name: CI & Deploy

on:
  pull_request:
  push:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: 24hourclassroom_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -psecret --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, bcmath, gd
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: composer install --prefer-dist --no-interaction
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci && npm run build
      - run: php artisan test
      - name: Route cache gate
        run: php artisan route:cache && php artisan route:clear

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test

  # axe-core over the built SPA with the API mocked (apps/web/a11y). Not a
  # deploy gate yet: it reports, and a red run should be fixed, not waved on.
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run a11y -w @24hc/web

  deploy:
    needs: [api, web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    concurrency: deploy-${{ github.ref_name }}
    env:
      PHP_BIN: ${{ vars.PHP_BIN || 'php' }}
    steps:
      # Runs for several pushes can finish their tests out of order, and
      # `concurrency` only serializes the deploys. Deploy only the commit that
      # is still the branch's head, so an older run never overwrites a newer one.
      - name: Skip unless this is still the branch head
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy: ${{ github.ref_name }} is now at $head, newer than ${{ github.sha }}; that run deploys it."
          fi
      - uses: actions/checkout@v4
        if: steps.latest.outputs.current == 'true'
      - uses: shivammathur/setup-php@v2
        if: steps.latest.outputs.current == 'true'
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, bcmath
      - uses: actions/setup-node@v4
        if: steps.latest.outputs.current == 'true'
        with:
          node-version: 22

      - name: Build Laravel (vendor + Vite assets)
        if: steps.latest.outputs.current == 'true'
        working-directory: apps/api
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction
          npm ci
          npm run build

      - name: Build Stencil app
        if: steps.latest.outputs.current == 'true'
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        if: steps.latest.outputs.current == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          echo "SSH_TARGET=$DEPLOY_USER@$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Deploy Laravel
        if: steps.latest.outputs.current == 'true'
        env:
          API_PATH: ${{ secrets.API_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy" \
            --exclude '.env' \
            --exclude 'storage/' \
            --exclude 'node_modules/' \
            --exclude 'tests/' \
            apps/api/ "$SSH_TARGET:$API_PATH/"

      - name: Write .env and run artisan
        if: steps.latest.outputs.current == 'true'
        env:
          API_PATH: ${{ secrets.API_PATH }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s' "$ENV_FILE" | \
            ssh -i ~/.ssh/id_deploy "$SSH_TARGET" "cat > '$API_PATH/.env'"
          ssh -i ~/.ssh/id_deploy "$SSH_TARGET" "
            set -e
            cd '$API_PATH'
            mkdir -p storage/logs storage/app/public storage/app/private storage/framework/cache storage/framework/sessions storage/framework/views
            # --force, not `|| true`: rsync --delete above removes the
            # public/storage symlink on every deploy (the --exclude
            # 'storage/' pattern matches directories only, and the link
            # is not a directory), so this recreates it each time.
            # `|| true` was masking genuine failures -- a permissions
            # error here 404s every avatar behind a green deploy.
            $PHP_BIN artisan storage:link --force
            $PHP_BIN artisan migrate --force
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan route:cache
            $PHP_BIN artisan view:cache
          "

      - name: Deploy Stencil app
        if: steps.latest.outputs.current == 'true'
        env:
          WEB_PATH: ${{ secrets.WEB_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy" \
            apps/web/www/ "$SSH_TARGET:$WEB_PATH/"
