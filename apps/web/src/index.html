<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <title>24 Hour Classroom</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Teachers and students creating and sharing lesson plans, homework, study materials, and more." />
    <script>
      // Anti-flash: paint the cached theme before any CSS or the deferred
      // module bundle runs. Reads only; never writes markup. The key literal
      // must match THEME_CACHE_KEY in services/theme-store.ts (a spec checks).
      try {
        var t = JSON.parse(localStorage.getItem('24hc.theme.v1'));
        if (t && typeof t === 'object') {
          document.documentElement.dataset.palette = t.palette;
          document.documentElement.dataset.typeset = t.typeset;
          if (t.scheme) document.documentElement.style.colorScheme = t.scheme;
          if (t.surface) document.documentElement.style.backgroundColor = t.surface;
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/build/app.css" />
    <script type="module" src="/build/app.esm.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
