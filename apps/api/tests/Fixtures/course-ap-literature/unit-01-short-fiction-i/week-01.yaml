  - front: Irony
    back: A gap between what is expected and what happens.
    topic_code: "4.A"
quiz:
  description: |
    Two items. About 5 minutes.
  questions:
    - slug: u01-w01-q01
      type: multiple_choice
      topic_code: "1.A"
      source: 'Kate Chopin, "The Story of an Hour" (1894)'
      stimulus: |
        Knowing that Mrs. Mallard was afflicted with a heart trouble, great care was taken to break to her as gently as possible the news of her husband's death.
      prompt: |
        What does the opening sentence establish about Mrs. Mallard?
      options:
        - "That others see her as fragile"
        - "That she is a widow of long standing"
      option_explanations:
        - |
          Correct: the care taken reflects how others see her, which the story will complicate.
        - |
          Tempting because the sentence mentions a death, but the news is only now being broken.
      answer: 0
      explanation: |
        The sentence shows the household's view of her before we see her own.
    - slug: u01-w01-q02
      type: fill_blank
      topic_code: "4.A"
      source: "general knowledge"
      prompt: |
        A narrator outside the story who refers to every character as "he" or "she" is a ____-person narrator.
      answer: ["third", "3rd"]
      explanation: |
        Chopin's narrator is a third-person narrator.
