week: 1
unit: 1
title: Water
topics: ["1.1"]
guide: guides/week-01.md
flashcards:
  - front: Hydrogen bond
    back: |
      A weak attraction between a partially positive H and a partially negative O or N.
    hint: Think of water beading on a leaf.
    topic_code: "1.1"
  - front: Cohesion
    back: Water molecules sticking to one another.
    topic_code: "1.1"
quiz:
  description: |
    Two items. About 5 minutes.
  questions:
    - slug: u01-w01-q01
      type: multiple_choice
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      stimulus: |
        | Liquid | Surface tension (mN/m) |
        |---|---|
        | Water | 72 |
        | Ethanol | 22 |
      prompt: |
        Which property of water best explains the table?
      options:
        - "Hydrogen bonding between molecules"
        - "Its low molar mass"
      option_explanations:
        - |
          Correct: hydrogen bonds pull surface molecules inward, raising surface tension.
        - |
          Tempting because water is light, but molar mass does not create intermolecular attraction.
      answer: 0
      explanation: |
        Surface tension follows from cohesion, which follows from hydrogen bonding.
    - slug: u01-w01-q02
      type: fill_blank
      topic_code: "1.1"
      source: "general knowledge"
      prompt: |
        Water is a ____ molecule because its electrons are shared unequally.
      answer: ["polar"]
      explanation: |
        Oxygen pulls the shared electrons toward itself, giving the molecule partial charges.
