        −98.9 kJ is the value for one mole of SO₃; the target equation makes two.
      - |
        The sign is reversed; forming the more oxidised SO₃ releases energy.
      - |
        This adds the two given enthalpies instead of reversing the first and doubling both.
      - |
        Correct. Reverse the first (+296.8) and add the second (−395.7) to get SO₂ + ½ O₂ → SO₃, ΔH° = −98.9 kJ; double for the target: −197.8 kJ.
    answer: 3
    explanation: |
      Practice 5 (Hess's law). Manipulate the given equations so their sum is the target, applying the same operations to ΔH°.
  - slug: apchem-final-q37
    type: fill_blank
    topic_code: "6.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Enthalpy is a ____ function: ΔH for a reaction depends only on the initial and final states, not on the path, which is what makes Hess's law possible.
    answer: ["state", "State"]
    explanation: |
      Practice 1. State functions (H, S, G, U) depend only on the state of the system; path functions (q, w) depend on how the change is carried out.
  # ---- Unit 7: stand-alone items (7.1-7.12)
  - slug: apchem-final-q38
    type: multiple_choice
    topic_code: "7.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which statement is true of a reversible reaction that has reached equilibrium in a closed container?
    options:
      - "The forward and reverse reactions have stopped."
      - "The forward and reverse reactions continue at equal rates, so the concentrations no longer change."
      - "The concentrations of reactants and products are equal."
      - "The reaction has gone to completion."
    option_explanations:
      - |
        Both reactions continue at the molecular level; equilibrium is dynamic.
      - |
        Correct. Equal forward and reverse rates mean no net change in concentration, even though individual molecules keep reacting.
      - |
        Equilibrium fixes the ratio given by K, which is rarely 1; concentrations are constant, not equal.
      - |
        Completion would mean no reactant remains; at equilibrium both reactants and products are present.
    answer: 1
    explanation: |
      Practice 4. Dynamic equilibrium: rates equal, concentrations constant, both sides present.
  - slug: apchem-final-q39
    type: multiple_choice
    topic_code: "7.5"
    source: "general knowledge"
    points: 1
    prompt: |
      A reaction has K = 1 × 10⁻¹⁰ at 25 °C. Which statement is correct?
    options:
      - "At equilibrium the mixture is almost entirely reactants; the reaction barely proceeds."
      - "The reaction is very slow."
      - "At equilibrium the mixture is almost entirely products."
      - "The reaction cannot occur at all."
    option_explanations:
      - |
        Correct. A very small K means the products-over-reactants ratio at equilibrium is tiny; essentially the reactants remain.
      - |
        K says nothing about rate; a reaction with a tiny K can be fast and one with a huge K can be slow.
      - |
        Products dominate when K is large, not small.
      - |
        The reaction does occur, to a tiny extent; "cannot occur" would be K = 0.
    answer: 0
    explanation: |
      Practice 4. The size of K gives the position of equilibrium: K ≫ 1 products, K ≪ 1 reactants; it never gives speed.
  - slug: apchem-final-q40
    type: multiple_choice
    topic_code: "7.7"
    source: "general knowledge"
    points: 1
    prompt: |
      For 2 HI(g) ⇌ H₂(g) + I₂(g), K = 0.0400 at a certain temperature. A flask initially contains 1.00 M HI and no products. What is [HI] at equilibrium?
    options:
      - "0.960 M"
      - "0.857 M"
      - "0.714 M"
      - "0.500 M"
    option_explanations:
      - |
        0.960 M would need x = 0.020, which comes from using K instead of √K.
      - |
        0.857 M corresponds to x = 0.0714, half the correct value; the HI loses 2x, not x.
      - |
        Correct. Let x = [H₂] = [I₂]; K = x²/(1.00 − 2x)² = 0.0400, so x/(1.00 − 2x) = 0.200, x = 0.200 − 0.400x, x = 0.143 M; [HI] = 1.00 − 2(0.143) = 0.714 M.
      - |
        0.500 M would require x = 0.25 and K = 0.25; the given K is much smaller.
    answer: 2
    explanation: |
      Practice 5. A perfect-square equilibrium expression: take the square root of both sides and solve the linear equation.
  - slug: apchem-final-q41
    type: multiple_choice
    topic_code: "7.9"
    source: "general knowledge"
    points: 1
    prompt: |
      N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g) is at equilibrium. The volume of the container is halved at constant temperature. What happens?
    options:
      - "The equilibrium shifts toward reactants, because the pressure increases."
      - "Nothing happens, because K is unchanged."
      - "The equilibrium shifts toward products, because K increases."
      - "The equilibrium shifts toward products, because Q becomes less than K and the system responds by reducing the total number of gas moles."
    option_explanations:
      - |
        Higher pressure favours the side with fewer gas moles, which is the product side (2 versus 4).
      - |
        K is unchanged, but Q is not: halving the volume doubles every concentration, and with more moles in the denominator Q falls below K.
      - |
        K depends only on temperature; it does not change when the volume changes.
      - |
        Correct. Doubling all concentrations multiplies the numerator by 4 and the denominator by 16, so Q = K/4 < K; the forward reaction runs until Q = K again, which also reduces the pressure.
    answer: 3
    explanation: |
      Practice 6. The rigorous reason is Q versus K; Le Châtelier's "fewer gas moles" is the shortcut it explains.
  - slug: apchem-final-q42
    type: multi_select
    topic_code: "7.12"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Solid silver chloride is in equilibrium with its saturated solution (Ksp = 1.8 × 10⁻¹⁰). Which statements are correct? Select all that apply.
    options:
      - "Adding solid NaCl decreases the molar solubility of AgCl."
      - "Adding solid NaCl decreases Ksp."
      - "Adding more solid AgCl leaves [Ag⁺] unchanged."
      - "Adding aqueous NH₃, which forms Ag(NH₃)₂⁺, increases the amount of AgCl that dissolves."
      - "The molar solubility of AgCl in pure water is 1.8 × 10⁻¹⁰ M."
    option_explanations:
      - |
        Correct. The common ion Cl⁻ raises Q above Ksp, so AgCl precipitates until [Ag⁺][Cl⁻] = Ksp again at a lower [Ag⁺].
      - |
        Ksp is an equilibrium constant and depends only on temperature; adding a common ion changes the position, not the constant.
      - |
        Correct. A solid does not appear in the Ksp expression; a saturated solution is saturated regardless of how much solid sits on the bottom.
      - |
        Correct. Complex formation removes free Ag⁺, lowering Q below Ksp, so more AgCl dissolves.
      - |
        The solubility is √Ksp = 1.3 × 10⁻⁵ M, since Ksp = s² for a 1:1 salt.
    answer: [0, 2, 3]
    explanation: |
      Practice 6. Every solubility effect is a Q versus Ksp argument; Ksp itself changes only with temperature.
  - slug: apchem-final-q43
    type: numeric
    topic_code: "7.11"
    source: "general knowledge"
    points: 1
    prompt: |
      The molar solubility of lead(II) iodide, PbI₂, is 1.3 × 10⁻³ M. Calculate its Ksp. Give your answer in the form of a number such as 5.0e-9.
    answer:
      value: 8.8e-9
      tolerance: 3.0e-10
    explanation: |
      Practice 5. PbI₂(s) ⇌ Pb²⁺ + 2 I⁻; [Pb²⁺] = s, [I⁻] = 2s; Ksp = s(2s)² = 4s³ = 4(1.3 × 10⁻³)³ = 8.8 × 10⁻⁹.
  # ---- Set D: titration curve of a weak acid (8.5, 8.7)
  - slug: apchem-final-q44
    type: multiple_choice
    topic_code: "8.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      A 25.0 mL sample of 0.100 M of a weak monoprotic acid HA is titrated with 0.100 M NaOH. The curve starts at pH 2.87, rises gently through a flat region, passes pH 4.74 at 12.5 mL of base, climbs steeply around 25.0 mL where it passes pH 8.72, and then flattens again above pH 12.
    prompt: |
      What is the Ka of the acid?
    options:
      - "1.3 × 10⁻³"
      - "1.9 × 10⁻⁹"
      - "1.8 × 10⁻⁵"
      - "1.0 × 10⁻⁷"
    option_explanations:
      - |
        1.3 × 10⁻³ is 10^(−2.87), the [H₃O⁺] at the start, not Ka; the initial pH is set by Ka and the concentration together.
      - |
        1.9 × 10⁻⁹ is 10^(−8.72), from the equivalence-point pH, where the species present is the conjugate base.
      - |
        Correct. At half-equivalence (12.5 mL, half of the 25.0 mL needed) [HA] = [A⁻], so pH = pKa = 4.74 and Ka = 10^(−4.74) = 1.8 × 10⁻⁵.
      - |
        10⁻⁷ is Kw's square root, not a property of this acid.
    answer: 2
    explanation: |
      Practice 5. Half-equivalence gives pKa directly; it is the single most useful point on a weak-acid titration curve.
  - slug: apchem-final-q45
    type: multiple_choice
    topic_code: "8.7"
    source: "general knowledge"
    points: 1
    stimulus: |
      A 25.0 mL sample of 0.100 M of a weak monoprotic acid HA is titrated with 0.100 M NaOH. The curve starts at pH 2.87, rises gently through a flat region, passes pH 4.74 at 12.5 mL of base, climbs steeply around 25.0 mL where it passes pH 8.72, and then flattens again above pH 12.
    prompt: |
      Why is the pH at the equivalence point above 7?
    options:
      - "Excess NaOH is present at the equivalence point."
      - "The solution contains A⁻, a weak base, which reacts with water to produce OH⁻."
      - "The acid was weak, so some HA remains unreacted at equivalence."
      - "Dilution by the added base raises the pH."
    option_explanations:
      - |
        At equivalence the moles of base equal the moles of acid; excess base comes only after it.
      - |
        Correct. All the HA has been converted to A⁻, whose Kb = Kw/Ka = 5.6 × 10⁻¹⁰ makes the 0.0500 M solution slightly basic (pH 8.72).
      - |
        At equivalence the stoichiometric amount of base has reacted with essentially all the HA.
      - |
        Dilution alone cannot carry a solution past pH 7; the basic pH comes from the conjugate base.
    answer: 1
    explanation: |
      Practice 6. The pH at equivalence is the pH of the salt solution: a weak acid's conjugate base is basic.
  - slug: apchem-final-q46
    type: multiple_choice
    topic_code: "8.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      A 25.0 mL sample of 0.100 M of a weak monoprotic acid HA is titrated with 0.100 M NaOH. The curve starts at pH 2.87, rises gently through a flat region, passes pH 4.74 at 12.5 mL of base, climbs steeply around 25.0 mL where it passes pH 8.72, and then flattens again above pH 12.
    prompt: |
      Indicator ranges: methyl orange 3.1–4.4; methyl red 4.2–6.3; bromothymol blue 6.0–7.6; phenolphthalein 8.2–10.0. Which indicator is best for this titration?
    options:
      - "Phenolphthalein, because its colour change lies within the steep part of the curve around the equivalence point."
      - "Methyl orange, because it changes colour at the acid's pKa."
      - "Methyl red, because its range brackets the pH of the buffer region."
      - "Bromothymol blue, because its range includes pH 7."
    option_explanations:
      - |
        Correct. The pH jumps from about 6 to 11 within a drop or two of 25.0 mL, so an indicator that changes at 8.2–10.0 switches exactly at the equivalence point.
      - |
        An indicator must change at the equivalence point, not at pKa; methyl orange would change colour long before equivalence.
      - |
        Methyl red changes during the buffer region, where the curve is flat; the colour would drift over several millilitres.
