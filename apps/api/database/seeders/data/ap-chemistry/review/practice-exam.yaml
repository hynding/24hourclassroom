    type: multiple_choice
    topic_code: "9.3"
    source: "general knowledge"
    points: 1
    prompt: |
      A reaction is thermodynamically favourable at low temperature but not at high temperature. What are the signs of ΔH° and ΔS°?
    options:
      - "ΔH° > 0, ΔS° > 0"
      - "ΔH° < 0, ΔS° < 0"
      - "ΔH° < 0, ΔS° > 0"
      - "ΔH° > 0, ΔS° < 0"
    option_explanations:
      - |
        (+, +) is favourable at high temperature only, the opposite pattern.
      - |
        Correct. With ΔH° < 0 and ΔS° < 0, ΔG° = ΔH° − TΔS° is negative when T is small and turns positive once TΔS° (negative, so subtracting it adds) outweighs ΔH°.
      - |
        (−, +) is favourable at every temperature.
      - |
        (+, −) is favourable at no temperature: both terms of ΔG° = ΔH° − TΔS° are positive whatever T is.
    answer: 1
    explanation: |
      Practice 6. The four sign cases of ΔG° = ΔH° − TΔS°; the crossover temperature is ΔH°/ΔS°.
  - slug: apchem-final-q58
    type: multi_select
    topic_code: "9.5"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which statements about free energy and equilibrium are correct? Select all that apply.
    options:
      - "If ΔG° < 0, then K > 1."
      - "If a reaction mixture has ΔG = 0, it is at equilibrium."
      - "Adding a catalyst makes ΔG° more negative."
      - "ΔG = ΔG° + RT ln Q, so a reaction with ΔG° > 0 can still proceed forward if Q is small enough."
      - "A reaction with ΔG° < 0 always proceeds rapidly."
    option_explanations:
      - |
        Correct. ΔG° = −RT ln K; a negative ΔG° means ln K > 0 and K > 1.
      - |
        Correct. ΔG = 0 is the condition for equilibrium, where Q = K.
      - |
        A catalyst changes neither ΔG° nor K; it changes only the rate.
      - |
        Correct. When Q < K the RT ln Q term is negative enough to make ΔG negative even though ΔG° is positive.
      - |
        ΔG° says nothing about rate; favourable reactions can be immeasurably slow.
    answer: [0, 1, 3]
    explanation: |
      Practice 6. ΔG° fixes K; ΔG (with Q) fixes direction; neither fixes speed.
