      - |
        Correct. 4.0 mol Al needs 6.0 mol Cl₂; only 4.5 mol is present, so Cl₂ limits, giving 4.5 × (2/3) = 3.0 mol AlCl₃.
      - |
        Aluminium is in excess: 4.5 mol Cl₂ consumes only 3.0 mol Al.
      - |
        The limiting reactant is right, but the mole ratio is 2 AlCl₃ per 3 Cl₂, so 4.5 mol Cl₂ gives 3.0 mol, not 4.5.
      - |
        The amounts are not in the 2:3 ratio of the equation, so one reactant must run out first.
    answer: 0
    explanation: |
      Practice 5. Compare the moles needed to the moles present; the reactant that runs short sets the yield through its own ratio.
  - slug: apchem-final-q25
