week: 34
description: |
  A full-length practice version of the AP Chemistry exam, built to the real paper's shape. The real exam is
  3 hours 15 minutes in two sections of equal weight. Section I is 60 multiple-choice questions in 90 minutes,
  about a third of them in sets that share one data table, graph, particle diagram or lab description; Section
  II is 7 free-response questions in 105 minutes: three long questions (10 points each) built around a
  laboratory experiment, a data set or an equilibrium system, and four short questions (4 points each) that
  each test one representation or calculation. A scientific or graphing calculator and the equations and
  constants sheet are allowed in both sections. Items here follow the unit weights of the Course and Exam
  Description (Unit 3 heaviest, then Unit 8). In the app, items 1-60 (1 point each, with the select-all items
  worth 2) are graded at once and items 61-67 (4, 4, 4, 4, 10, 10 and 10 points) are graded by your teacher
  against the scoring notes attached to each; score the two halves separately to see your real standing. Sit it
  in one block if you can: 90 minutes for items 1-60, a short break, then 105 minutes for items 61-67.
  Constants: R = 8.314 J/(mol·K) = 0.08206 L·atm/(mol·K); F = 96,485 C/mol; Kw = 1.0 × 10⁻¹⁴; c(water) =
  4.184 J/(g·°C); 0.0592/n volts per decade of Q at 298 K.
questions:
  # ======================================================================
  # Section I: 60 items. Unit 1 (5): q01-q05 · Unit 2 (5): q06-q10 · Unit 3 (12): q11-q22
  # Unit 4 (5): q23-q27 · Unit 5 (5): q28-q32 · Unit 6 (5): q33-q37 · Unit 7 (6): q38-q43
  # Unit 8 (9): q44-q52 · Unit 9 (8): q53-q60
  # ======================================================================
  # ---- Set A: mass spectrum of an element (1.2, 1.1, 1.6)
  - slug: apchem-final-q01
    type: multiple_choice
    topic_code: "1.2"
    source: "general knowledge"
    points: 1
    stimulus: |
      The mass spectrum of a pure element shows three peaks: mass 24 with relative abundance 79%, mass 25 with 10%, and mass 26 with 11%.
    prompt: |
      Which element is it, and what is its average atomic mass to one decimal place?
    options:
      - "Chromium; 25.0"
      - "Magnesium; 24.3"
      - "Magnesium; 25.0"
      - "Sodium; 24.3"
    option_explanations:
      - |
        Chromium's isotopes are near mass 52; a spectrum centred on 24–26 belongs to a much lighter element.
      - |
        Correct. (24)(0.79) + (25)(0.10) + (26)(0.11) = 18.96 + 2.50 + 2.86 = 24.3, which is magnesium's average atomic mass; the three peaks are ²⁴Mg, ²⁵Mg and ²⁶Mg.
      - |
        The element is right, but a simple average of the masses ignores the abundances; the weighted average is 24.3.
      - |
        Sodium has a single isotope at mass 23; a three-peak spectrum rules it out.
    answer: 1
    explanation: |
      Practice 5. Average atomic mass is the abundance-weighted mean of the isotope masses; match it to the periodic table.
  - slug: apchem-final-q02
    type: multiple_choice
    topic_code: "1.1"
    source: "general knowledge"
    points: 1
    stimulus: |
      The mass spectrum of a pure element shows three peaks: mass 24 with relative abundance 79%, mass 25 with 10%, and mass 26 with 11%.
    prompt: |
      How many moles of atoms are in a 4.86 g sample of this element?
    options:
      - "0.0500 mol"
      - "0.100 mol"
      - "0.200 mol"
      - "0.400 mol"
    option_explanations:
      - |
        0.0500 mol would be a 1.22 g sample; check the division.
      - |
        0.100 mol of magnesium has a mass of 2.43 g, half the sample.
      - |
        Correct. n = m/M = 4.86 g / 24.3 g/mol = 0.200 mol.
      - |
        0.400 mol would be 9.72 g, twice the sample.
    answer: 2
    explanation: |
      Practice 5. Moles = mass ÷ molar mass, with the molar mass from the spectrum's average.
  - slug: apchem-final-q03
    type: multiple_choice
    topic_code: "1.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      The mass spectrum of a pure element shows three peaks: mass 24 with relative abundance 79%, mass 25 with 10%, and mass 26 with 11%.
    prompt: |
      A photoelectron spectrum of the same element is recorded. How many peaks does it show, and what are their relative heights from highest binding energy to lowest?
    options:
      - "Four peaks; heights in the ratio 2 : 2 : 6 : 2"
      - "Three peaks; heights in the ratio 2 : 8 : 2"
      - "Four peaks; heights in the ratio 2 : 6 : 2 : 2"
      - "Twelve peaks of equal height, one per electron"
    option_explanations:
      - |
        Correct. Mg is 1s² 2s² 2p⁶ 3s²: four subshells, four peaks, with heights proportional to the electron count, 1s (highest binding energy) 2, then 2s 2, 2p 6, and 3s (lowest) 2.
      - |
        The 2s and 2p subshells have different energies and give separate peaks; they are not merged into one of height 8.
      - |
        The order is wrong: the 2s peak (height 2) lies at higher binding energy than the 2p peak (height 6).
      - |
        PES shows one peak per subshell, not per electron; the peak height encodes the number of electrons.
    answer: 0
    explanation: |
      Practice 1. One PES peak per occupied subshell, height proportional to occupancy, binding energy falling from the core outward.
  - slug: apchem-final-q04
    type: multiple_choice
    topic_code: "1.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following atoms has the largest atomic radius?
    options:
      - "Si"
      - "Al"
      - "Mg"
      - "Na"
    option_explanations:
      - |
        Silicon has the highest effective nuclear charge of the four and so the smallest radius.
      - |
        Aluminium is pulled in more tightly than magnesium or sodium by its larger nuclear charge.
      - |
        Magnesium is larger than aluminium but smaller than sodium.
      - |
        Correct. All four are in period 3, so they share the same outer shell; radius decreases across the period as the effective nuclear charge rises, so the element farthest left, sodium, is largest.
    answer: 3
    explanation: |
      Practice 6. Across a period the shell is the same and Z_eff grows, so radius shrinks; justify trends with effective nuclear charge and shell, not with "more electrons".
  - slug: apchem-final-q05
    type: numeric
    topic_code: "1.3"
    source: "PubChem (molar masses)"
    points: 1
    prompt: |
      Calculate the mass percent of oxygen in calcium carbonate, CaCO₃ (Ca 40.08, C 12.01, O 16.00 g/mol). Give one decimal place.
    answer:
      value: 48.0
      tolerance: 0.2
    explanation: |
      Practice 5. Molar mass = 40.08 + 12.01 + 3(16.00) = 100.09 g/mol; oxygen = 48.00/100.09 × 100% = 48.0%.
  # ---- Unit 2: stand-alone items (2.1-2.7)
  - slug: apchem-final-q06
    type: multiple_choice
    topic_code: "2.1"
    source: "general knowledge"
    points: 1
    prompt: |
      The melting point of MgO (2,852 °C) is far higher than that of NaCl (801 °C). Which explanation is best?
    options:
      - "MgO has covalent bonds, which are stronger than the ionic bonds in NaCl."
      - "The ions in MgO carry twice the charge of those in NaCl and are of similar size, so the Coulombic attraction, and the lattice energy, is about four times greater."
      - "MgO has a larger molar mass, giving stronger London dispersion forces."
      - "Oxygen is more electronegative than chlorine, so the Mg–O bond is more polar."
    option_explanations:
      - |
        Both compounds are ionic; the difference is in the strength of the ionic lattice, not the type of bonding.
      - |
        Correct. Coulomb's law: attraction scales with the product of the charges over the distance; (2+)(2−) against (1+)(1−) with similar ionic radii gives roughly four times the lattice energy.
      - |
        Dispersion forces are irrelevant to an ionic lattice; the ions are held by electrostatic attraction between charges.
      - |
        Electronegativity difference does not rank ionic lattice energies; charge and ionic radius do.
    answer: 1
    explanation: |
      Practice 6. Lattice energy is explained with Coulomb's law: charge first, then distance.
  - slug: apchem-final-q07
    type: multiple_choice
    topic_code: "2.6"
    source: "general knowledge"
    points: 1
    prompt: |
      The carbonate ion, CO₃²⁻, has three equivalent resonance structures. Which statement about its bonding is correct?
    options:
      - "It has one double bond and two single bonds that switch rapidly between the three positions."
      - "All three C–O bonds are identical, each with bond order 1."
      - "All three C–O bonds are identical, each with bond order 4/3, and the −2 charge is spread over the three oxygens."
      - "All three C–O bonds are double bonds, giving carbon an expanded octet."
    option_explanations:
      - |
        Resonance structures are not states the ion flips between; the real ion is a single average of them.
      - |
        The bond order is more than 1: one double and two single bonds averaged over three positions.
      - |
        Correct. Four bonding pairs shared over three equivalent C–O bonds give bond order 4/3, with equal bond lengths and a formal charge of −2/3 on each oxygen.
      - |
        Carbon cannot hold more than eight electrons; three double bonds would give it 12.
    answer: 2
    explanation: |
      Practice 1. The resonance hybrid is the average of the contributing structures; equal bond lengths are the experimental evidence.
  - slug: apchem-final-q08
    type: multiple_choice
    topic_code: "2.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Sulfur tetrafluoride, SF₄, has 34 valence electrons. What is its molecular geometry, and is it polar?
    options:
      - "See-saw; polar"
      - "Tetrahedral; nonpolar"
      - "Square planar; nonpolar"
      - "Trigonal bipyramidal; nonpolar"
    option_explanations:
      - |
        Correct. Sulfur has four bonding pairs and one lone pair (five electron domains, trigonal bipyramidal arrangement); the lone pair takes an equatorial position, giving a see-saw shape whose bond dipoles do not cancel.
      - |
        Tetrahedral would require four bonding pairs and no lone pair; sulfur here keeps a lone pair.
      - |
        Square planar is the shape of six domains with two lone pairs (XeF₄), not five domains with one.
      - |
        Trigonal bipyramidal names the arrangement of the five electron domains; the molecular shape, with one domain a lone pair, is see-saw, and it is polar.
    answer: 0
    explanation: |
      Practice 1. Count electron domains, place lone pairs (equatorial in a trigonal bipyramid), then name the shape from the atoms only.
  - slug: apchem-final-q09
    type: multi_select
    topic_code: "2.7"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which of these six molecules have a net dipole moment, so that a sample would align in an electric field? Select all that apply.
    options:
      - "CO₂"
      - "H₂O"
      - "NH₃"
      - "CCl₄"
      - "SO₂"
      - "BF₃"
    option_explanations:
      - |
        CO₂ is linear; its two equal C=O dipoles point in opposite directions and cancel.
      - |
        Correct. Bent, with two lone pairs on oxygen; the O–H dipoles add to a net dipole.
      - |
        Correct. Trigonal pyramidal; the lone pair on nitrogen makes the N–H dipoles add rather than cancel.
      - |
        Tetrahedral with four identical bonds; the C–Cl dipoles cancel by symmetry.
      - |
        Correct. Bent (one lone pair on sulfur, three electron domains); the S–O dipoles do not cancel.
      - |
        Trigonal planar with three identical bonds; the B–F dipoles cancel.
    answer: [1, 2, 4]
    explanation: |
      Practice 1. Polar bonds plus a shape that does not cancel them: lone pairs on the central atom or unequal substituents.
  - slug: apchem-final-q10
    type: true_false
    topic_code: "2.4"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: steel is an interstitial alloy in which small carbon atoms occupy spaces between iron atoms, making the lattice layers harder to slide past one another than in pure iron.
    answer: true
    explanation: |
      Practice 1. Interstitial alloys (steel) have small atoms in the holes of the host lattice; substitutional alloys (brass) have atoms of similar size replacing host atoms. Both disrupt the easy sliding of layers that makes pure metals malleable.
  # ---- Set B: boiling points of small hydrides (3.1, 3.3)
  - slug: apchem-final-q11
    type: multiple_choice
    topic_code: "3.1"
    source: "NIST Chemistry WebBook (boiling points, rounded)"
    points: 1
    stimulus: |
      Normal boiling points: CH₄ −161 °C; SiH₄ −112 °C; NH₃ −33 °C; H₂S −60 °C; H₂O 100 °C.
    prompt: |
      Which statement best explains why water boils 160 °C higher than hydrogen sulfide, even though H₂S is the heavier molecule?
    options:
      - "The O–H covalent bond is stronger than the S–H bond, so more energy is needed to break it on boiling."
      - "Water molecules are smaller, so they pack more closely and have stronger London dispersion forces."
      - "The highly polar O–H bonds and the small, electronegative oxygen let each water molecule form strong hydrogen bonds; S is too large and not electronegative enough to do so."
      - "Water is ionic and hydrogen sulfide is covalent."
    option_explanations:
      - |
        Boiling breaks intermolecular forces, not covalent bonds; the O–H bonds survive in the vapour.
      - |
        Dispersion forces favour the larger, more polarisable H₂S; they predict the wrong order.
      - |
        Correct. Hydrogen bonding between an H on O and a lone pair on a neighbouring O is far stronger than the dipole–dipole and dispersion forces available to H₂S.
      - |
        Both are molecular covalent compounds; neither is an ionic lattice.
    answer: 2
    explanation: |
      Practice 6. Name the specific intermolecular force and say why the other molecule lacks it; "stronger bonds" never earns the point for a boiling-point comparison.
  - slug: apchem-final-q12
    type: multiple_choice
    topic_code: "3.1"
    source: "NIST Chemistry WebBook (boiling points, rounded)"
    points: 1
    stimulus: |
      Normal boiling points: CH₄ −161 °C; SiH₄ −112 °C; NH₃ −33 °C; H₂S −60 °C; H₂O 100 °C.
    prompt: |
      Why does SiH₄ boil at a higher temperature than CH₄?
    options:
      - "SiH₄ has more electrons and a larger, more polarisable electron cloud, so its London dispersion forces are stronger."
      - "SiH₄ is polar and CH₄ is not."
      - "SiH₄ forms hydrogen bonds through its Si–H bonds."
      - "Si–H bonds are weaker than C–H bonds, so SiH₄ molecules stick together more."
    option_explanations:
      - |
        Correct. Both are nonpolar tetrahedral molecules; the only intermolecular force is dispersion, which grows with the number of electrons and polarisability.
      - |
        Both molecules are tetrahedral with four identical bonds, so both are nonpolar.
      - |
        Hydrogen bonding needs H bonded to N, O or F; silicon is not electronegative enough.
      - |
        Covalent bond strength within the molecule has no bearing on the force between molecules.
    answer: 0
    explanation: |
      Practice 6. For two nonpolar molecules, the larger electron cloud wins on dispersion forces.
  - slug: apchem-final-q13
    type: multiple_choice
    topic_code: "3.3"
    source: "NIST Chemistry WebBook (boiling points, rounded)"
    points: 1
    stimulus: |
      Normal boiling points: CH₄ −161 °C; SiH₄ −112 °C; NH₃ −33 °C; H₂S −60 °C; H₂O 100 °C.
    prompt: |
      Which of the five substances has the lowest vapour pressure at 25 °C?
    options:
      - "CH₄"
      - "H₂S"
      - "NH₃"
      - "H₂O"
    option_explanations:
      - |
        Methane has the weakest intermolecular forces and the highest vapour pressure; at 25 °C it is a gas far above its boiling point.
      - |
        H₂S is also a gas at 25 °C; its vapour pressure exceeds 1 atm.
      - |
        Ammonia boils at −33 °C, so at 25 °C its vapour pressure is well above 1 atm.
      - |
        Correct. The substance with the strongest intermolecular forces has the highest boiling point and the lowest vapour pressure at any given temperature; water at 25 °C is about 0.03 atm.
    answer: 3
    explanation: |
      Practice 4. Vapour pressure and boiling point are two readings of the same thing, the strength of the intermolecular forces.
  - slug: apchem-final-q14
    type: multiple_choice
    topic_code: "3.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Four rigid 1.0 L flasks at 25 °C contain, respectively, He at 1.0 atm, N₂ at 2.0 atm, CO₂ at 1.5 atm and Ar at 0.5 atm. Which flask contains the greatest number of molecules?
    options:
      - "CO₂, because it has the largest molar mass"
      - "N₂, because it has the highest pressure"
      - "He, because its atoms are smallest"
      - "All four contain the same number, because V and T are the same"
    option_explanations:
      - |
        Molar mass does not enter PV = nRT; at fixed V and T, n depends on P alone.
      - |
        Correct. n = PV/RT, so with V and T fixed the number of moles (and molecules) is proportional to pressure; 2.0 atm is the highest.
      - |
        Particle size is irrelevant for an ideal gas; the pressure sets the count.
      - |
        Equal numbers would require equal pressures (Avogadro's hypothesis at the same P, V, T).
    answer: 1
    explanation: |
      Practice 4. Ideal gas: at fixed V and T, moles scale with pressure and nothing else.
  - slug: apchem-final-q15
    type: numeric
    topic_code: "3.4"
    source: "general knowledge"
    points: 1
    prompt: |
      How many moles of gas are in a 2.00 L container at 1.50 atm and 300 K? (R = 0.08206 L·atm/(mol·K).) Give three significant figures.
    answer:
      value: 0.122
      tolerance: 0.002
    explanation: |
      Practice 5. n = PV/RT = (1.50)(2.00)/[(0.08206)(300)] = 3.00/24.6 = 0.122 mol.
  - slug: apchem-final-q16
    type: multiple_choice
    topic_code: "3.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Samples of He and Ar are held at the same temperature. Which statement is correct?
    options:
      - "The He atoms have the greater average kinetic energy, because they move faster."
      - "The Ar atoms have the greater average kinetic energy, because they are heavier."
      - "The two gases have the same average kinetic energy, and the He atoms have the higher average speed."
      - "The two gases have the same average speed, and the Ar atoms have the greater kinetic energy."
    option_explanations:
      - |
        Average kinetic energy depends only on temperature; the He atoms are faster precisely because they must have the same KE with a smaller mass.
      - |
        Temperature, not mass, sets average kinetic energy; equal T means equal average KE.
      - |
        Correct. KE_avg = (3/2)kT for both; since KE = ½mv², the lighter He atoms must move faster (by a factor of √10 for the rms speed).
      - |
        Equal speeds with different masses would mean different kinetic energies and therefore different temperatures.
    answer: 2
    explanation: |
      Practice 4. Kinetic molecular theory: temperature fixes average KE; speed then depends on mass.
  - slug: apchem-final-q17
    type: multiple_choice
    topic_code: "3.6"
    source: "general knowledge"
    points: 1
    prompt: |
      A real gas at very high pressure has a measured PV/nRT greater than 1. Which effect is responsible?
    options:
      - "Attractions between molecules reduce the force of collisions with the walls."
      - "The gas has started to condense."
      - "The molecules move more slowly at high pressure."
      - "The molecules' own volume is a significant fraction of the container volume, so the free volume is smaller than V."
    option_explanations:
      - |
        Attractions lower the measured pressure and make PV/nRT less than 1; they dominate at moderate pressure and low temperature.
      - |
        Condensation would remove gas and lower P; it does not raise PV/nRT above 1.
      - |
        Speed is set by temperature, not pressure.
      - |
        Correct. When the molecules are crowded, the volume available for motion is less than the container volume, so the pressure is higher than the ideal prediction and PV/nRT exceeds 1.
    answer: 3
    explanation: |
      Practice 6. Two deviations: intermolecular attraction (PV/nRT < 1) and molecular volume (PV/nRT > 1); the second wins at very high pressure.
  - slug: apchem-final-q18
    type: multiple_choice
    topic_code: "3.8"
    source: "general knowledge"
    points: 1
    prompt: |
      A particle diagram of aqueous sodium chloride is drawn correctly. Which description matches it?
    options:
      - "Separate Na⁺ and Cl⁻ ions, each surrounded by water molecules with the oxygen ends toward Na⁺ and the hydrogen ends toward Cl⁻."
      - "NaCl molecules floating among water molecules."
      - "Na⁺ and Cl⁻ ions paired together, surrounded by randomly oriented water molecules."
      - "Na and Cl atoms dispersed among water molecules."
    option_explanations:
      - |
        Correct. An ionic compound dissociates into hydrated ions; the water dipoles orient with the partial negative oxygen toward cations and the partial positive hydrogens toward anions.
      - |
        NaCl has no molecules; the solid is an ionic lattice that dissociates into ions in water.
      - |
        The ions separate in solution, and the water molecules around each ion are oriented, not random.
      - |
        Neutral atoms are not present; sodium and chlorine exist as ions in the solution.
    answer: 0
    explanation: |
      Practice 1. Draw the solvation shell with the correct dipole orientation; this is the standard particle-diagram item.
  - slug: apchem-final-q19
    type: multiple_choice
    topic_code: "3.9"
    source: "general knowledge"
    points: 1
    prompt: |
      In paper chromatography with a polar solvent, two dyes are spotted on the paper; dye X moves with the solvent front (large Rf) and dye Y barely moves. Which inference is correct?
    options:
      - "Dye Y is more soluble in the solvent than dye X."
      - "Dye X interacts more strongly with the mobile phase, and dye Y more strongly with the polar paper (stationary phase)."
      - "Dye X has the larger molar mass."
      - "Dye Y is more polar than the solvent and therefore cannot dissolve in it."
    option_explanations:
      - |
        The dye that travels farthest is the one carried most by the solvent, which is dye X.
      - |
        Correct. Rf reflects the balance between attraction to the mobile phase (carries the spot) and to the stationary phase (holds it); a large Rf means the mobile phase wins.
      - |
        Molar mass is not what separates components in chromatography; the relative strength of intermolecular attractions is.
      - |
        Y dissolves enough to move slightly; its small Rf means it is attracted more strongly to the paper, not that it is insoluble.
    answer: 1
    explanation: |
      Practice 2. Chromatography separates by differential attraction to the two phases.
  - slug: apchem-final-q20
    type: fill_blank
    topic_code: "3.10"
    source: "general knowledge"
    points: 1
    prompt: |
      Iodine, I₂, dissolves readily in hexane but hardly at all in water, because a nonpolar solute dissolves best in a ____ solvent whose intermolecular forces resemble its own.
    answer: ["nonpolar", "non-polar", "Nonpolar", "Non-polar"]
    explanation: |
      Practice 6. "Like dissolves like": dissolution is favourable when the solute–solvent attractions formed are comparable to the solute–solute and solvent–solvent attractions broken. I₂ (dispersion only) matches hexane, not hydrogen-bonded water.
  - slug: apchem-final-q21
    type: multiple_choice
    topic_code: "3.11"
    source: "general knowledge"
    points: 1
    prompt: |
      Which region of the electromagnetic spectrum, absorbed by a molecule, causes transitions between vibrational energy levels?
    options:
      - "Ultraviolet"
      - "Microwave"
      - "Infrared"
      - "X-ray"
    option_explanations:
      - |
        Ultraviolet and visible photons have enough energy to promote electrons to higher electronic levels.
      - |
        Microwaves excite molecular rotation, a smaller energy gap than vibration.
      - |
        Correct. Infrared photons match the spacing of vibrational levels (bond stretching and bending), which is why IR spectra identify functional groups.
      - |
        X-rays eject core electrons; this is the basis of photoelectron spectroscopy, not vibrational excitation.
    answer: 2
    explanation: |
      Practice 1. Energy ordering of molecular transitions: rotation (microwave) < vibration (infrared) < electronic (UV–visible) < core ionisation (X-ray).
  - slug: apchem-final-q22
    type: numeric
    topic_code: "3.13"
    source: "general knowledge"
    points: 1
    prompt: |
      A 1.50 × 10⁻⁴ M solution of a dye has absorbance 0.450 in a 1.00 cm cell. A solution of the same dye in the same cell has absorbance 0.300. What is its concentration in mol/L? Give your answer in the form of a number such as 2.0e-4.
    answer:
      value: 1.0e-4
      tolerance: 2.0e-6
    explanation: |
      Practice 5. Beer–Lambert: A = εbc, so A is proportional to c at fixed ε and b; c = (0.300/0.450)(1.50 × 10⁻⁴) = 1.00 × 10⁻⁴ M.
  # ---- Unit 4: stand-alone items (4.2-4.9)
  - slug: apchem-final-q23
    type: multiple_choice
    topic_code: "4.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Aqueous solutions of barium chloride and sodium sulfate are mixed and a white precipitate forms. What is the net ionic equation?
    options:
      - "BaCl₂(aq) + Na₂SO₄(aq) → BaSO₄(s) + 2 NaCl(aq)"
      - "Ba²⁺(aq) + 2 Cl⁻(aq) + 2 Na⁺(aq) + SO₄²⁻(aq) → BaSO₄(s) + 2 Na⁺(aq) + 2 Cl⁻(aq)"
      - "Na⁺(aq) + Cl⁻(aq) → NaCl(s)"
      - "Ba²⁺(aq) + SO₄²⁻(aq) → BaSO₄(s)"
    option_explanations:
      - |
        This is the molecular equation; it does not show which species actually change.
      - |
        This is the complete ionic equation; the spectator ions Na⁺ and Cl⁻ have not been cancelled.
      - |
        Sodium chloride is soluble and stays in solution as ions; it is not the precipitate.
      - |
        Correct. Only the ions that form the insoluble BaSO₄ appear; Na⁺ and Cl⁻ are spectators.
    answer: 3
    explanation: |
      Practice 1. Write the complete ionic equation, cancel what appears unchanged on both sides, and keep the solid as a formula unit.
  - slug: apchem-final-q24
    type: multiple_choice
    topic_code: "4.5"
    source: "general knowledge"
    points: 1
    prompt: |
      2 Al(s) + 3 Cl₂(g) → 2 AlCl₃(s). If 4.0 mol of Al and 4.5 mol of Cl₂ react, which reactant is limiting and how many moles of AlCl₃ form?
    options:
      - "Cl₂ is limiting; 3.0 mol AlCl₃"
      - "Al is limiting; 4.0 mol AlCl₃"
      - "Cl₂ is limiting; 4.5 mol AlCl₃"
      - "Neither is limiting; 4.0 mol AlCl₃"
