  # ---- Set C: initial-rate data (5.2, 5.3, 5.7)
  - slug: apchem-final-q28
    type: multiple_choice
    topic_code: "5.2"
    source: "general knowledge"
    points: 1
    stimulus: |
      Initial rates for A + B → products at 25 °C:

      | Trial | [A]₀ (M) | [B]₀ (M) | Initial rate (M/s) |
      |---|---|---|---|
      | 1 | 0.10 | 0.10 | 2.0 × 10⁻³ |
      | 2 | 0.20 | 0.10 | 8.0 × 10⁻³ |
      | 3 | 0.20 | 0.20 | 1.6 × 10⁻² |
    prompt: |
      What is the rate law?
    options:
      - "rate = k[A][B]"
      - "rate = k[A][B]²"
      - "rate = k[A]²"
      - "rate = k[A]²[B]"
    option_explanations:
      - |
        First order in A would give a doubled rate from trial 1 to 2; the rate quadrupled.
      - |
        Trials 2 and 3 double [B] and the rate merely doubles, so B is first order, not second.
      - |
        B does affect the rate (trials 2 → 3), so it must appear in the rate law.
      - |
        Correct. Doubling [A] (1 → 2) quadruples the rate: second order in A. Doubling [B] (2 → 3) doubles the rate: first order in B.
    answer: 3
    explanation: |
      Practice 5. Compare pairs of trials in which only one concentration changes; the factor by which the rate changes gives the order.
  - slug: apchem-final-q29
    type: multiple_choice
    topic_code: "5.3"
    source: "general knowledge"
    points: 1
    stimulus: |
      Initial rates for A + B → products at 25 °C:

      | Trial | [A]₀ (M) | [B]₀ (M) | Initial rate (M/s) |
      |---|---|---|---|
      | 1 | 0.10 | 0.10 | 2.0 × 10⁻³ |
      | 2 | 0.20 | 0.10 | 8.0 × 10⁻³ |
      | 3 | 0.20 | 0.20 | 1.6 × 10⁻² |
    prompt: |
      What is the value and unit of the rate constant k?
    options:
      - "0.20 M⁻¹ s⁻¹"
      - "2.0 M⁻² s⁻¹"
      - "2.0 × 10⁻² s⁻¹"
      - "20 M⁻² s⁻¹"
    option_explanations:
      - |
        The units are those of a second-order overall rate law; this law is third order overall.
      - |
        Correct. From trial 1: k = rate/([A]²[B]) = 2.0 × 10⁻³ / [(0.10)²(0.10)] = 2.0 × 10⁻³ / 1.0 × 10⁻³ = 2.0 M⁻² s⁻¹.
      - |
        s⁻¹ is the unit of a first-order rate constant; and the number does not follow from the data.
      - |
        The unit is right, but dividing 2.0 × 10⁻³ by 1.0 × 10⁻³ gives 2.0, not 20.
    answer: 1
    explanation: |
      Practice 5. Substitute any one trial into the rate law; the unit must make rate come out in M/s.
  - slug: apchem-final-q30
    type: multiple_choice
    topic_code: "5.7"
    source: "general knowledge"
    points: 1
    stimulus: |
      Initial rates for A + B → products at 25 °C:

      | Trial | [A]₀ (M) | [B]₀ (M) | Initial rate (M/s) |
      |---|---|---|---|
      | 1 | 0.10 | 0.10 | 2.0 × 10⁻³ |
      | 2 | 0.20 | 0.10 | 8.0 × 10⁻³ |
      | 3 | 0.20 | 0.20 | 1.6 × 10⁻² |
    prompt: |
      Which proposed mechanism is consistent with the experimental rate law?
    options:
      - "Step 1 (slow): A + B → C; Step 2 (fast): C + A → products"
      - "A single elementary step: A + B → products"
      - "Step 1 (fast, equilibrium): A + A ⇌ A₂; Step 2 (slow): A₂ + B → products"
      - "Step 1 (slow): B → D; Step 2 (fast): D + 2 A → products"
    option_explanations:
      - |
        A slow first step A + B gives rate = k[A][B], first order in A; the data demand second order in A.
      - |
        One step A + B would be rate = k[A][B]; the observed law has [A]².
      - |
        Correct. The slow step gives rate = k₂[A₂][B]; the fast pre-equilibrium gives [A₂] = K[A]², so rate = k₂K[A]²[B], matching the data.
      - |
        A slow unimolecular step in B gives rate = k[B], independent of A.
    answer: 2
    explanation: |
      Practice 6. The rate law comes from the slow step; an intermediate's concentration is replaced using the fast equilibrium that precedes it.
  - slug: apchem-final-q31
    type: numeric
    topic_code: "5.3"
    source: "general knowledge"
    points: 1
    prompt: |
      A first-order reaction has k = 0.0231 s⁻¹. What is its half-life in seconds? Give one decimal place.
    answer:
      value: 30.0
      tolerance: 0.2
    explanation: |
      Practice 5. t½ = 0.693/k = 0.693/0.0231 = 30.0 s, the same for every half-life of a first-order process.
  - slug: apchem-final-q32
    type: multiple_choice
    topic_code: "5.11"
    source: "general knowledge"
    points: 1
    prompt: |
      Which statement correctly describes the effect of a catalyst on a reaction's energy profile?
    options:
      - "It provides a pathway with a lower activation energy, leaving the energies of reactants and products unchanged."
      - "It lowers the energy of the products, making ΔH more negative."
      - "It raises the energy of the reactants so they need less energy to react."
      - "It lowers the activation energy of the forward reaction but not of the reverse."
    option_explanations:
      - |
        Correct. A catalyst changes the mechanism, replacing the high barrier with one or more lower ones; the reactant and product energies, and therefore ΔH and K, are untouched.
      - |
        Product energy is a property of the products, not of the path; ΔH is unchanged by a catalyst.
      - |
        Reactant energy is fixed by the reactants; a catalyst cannot change it.
      - |
        The barrier is lowered in both directions by the same amount, which is why the equilibrium constant does not change.
    answer: 0
    explanation: |
      Practice 1. On an energy profile a catalyst lowers the hump; it moves neither endpoint.
  # ---- Unit 6: stand-alone items (6.1-6.9)
  - slug: apchem-final-q33
    type: multiple_choice
    topic_code: "6.1"
    source: "general knowledge"
    points: 1
    prompt: |
      When solid ammonium nitrate dissolves in water in a beaker, the beaker becomes cold. Which statement is correct?
    options:
      - "The process is exothermic; heat flows from the solution into the beaker."
      - "The process is endothermic; the system (the dissolving salt) absorbs heat from the surroundings (the water and beaker), so q for the system is positive."
      - "The process is endothermic; q for the system is negative because the temperature falls."
      - "The process is exothermic; the cold feeling is due to evaporation of water."
    option_explanations:
      - |
        An exothermic process would warm the surroundings, not cool them.
      - |
        Correct. The falling temperature of the surroundings shows that energy is being transferred into the dissolving salt: q(system) > 0, ΔH(solution) > 0.
      - |
        The temperature of the surroundings falls because the system gained heat; q(system) is positive for an endothermic process.
      - |
        Evaporation is negligible here; the cooling is the enthalpy of solution of NH₄NO₃, which is positive.
    answer: 1
    explanation: |
      Practice 6. Define the system, then read the sign of q from what the surroundings do: surroundings cool, system absorbs, q > 0.
  - slug: apchem-final-q34
    type: numeric
    topic_code: "6.4"
    source: "general knowledge"
    points: 1
    prompt: |
      How much heat, in kJ, is required to warm 50.0 g of water from 25.0 °C to 35.0 °C? (c = 4.184 J/(g·°C).) Give three significant figures.
    answer:
      value: 2.09
      tolerance: 0.02
    explanation: |
      Practice 5. q = mcΔT = (50.0 g)(4.184 J/(g·°C))(10.0 °C) = 2,092 J = 2.09 kJ.
  - slug: apchem-final-q35
    type: multiple_choice
    topic_code: "6.6"
    source: "NIST Chemistry WebBook (bond enthalpies, rounded)"
    points: 1
    prompt: |
      Average bond enthalpies: H–H 436, Cl–Cl 243, H–Cl 431 kJ/mol. What is the estimated ΔH for H₂(g) + Cl₂(g) → 2 HCl(g)?
    options:
      - "+248 kJ"
      - "+183 kJ"
      - "−183 kJ"
      - "−248 kJ"
    option_explanations:
      - |
        +248 subtracts one H–Cl bond instead of two; two moles of HCl are formed.
      - |
        The magnitude is right but the sign is reversed: more energy is released forming the two H–Cl bonds than is absorbed breaking H–H and Cl–Cl.
      - |
        Correct. ΔH ≈ Σ(bonds broken) − Σ(bonds formed) = (436 + 243) − 2(431) = 679 − 862 = −183 kJ.
      - |
        −248 forgets one of the two H–Cl bonds formed.
    answer: 2
    explanation: |
      Practice 5. Bonds broken (endothermic, positive) minus bonds formed (exothermic); count every bond in the balanced equation.
  - slug: apchem-final-q36
    type: multiple_choice
    topic_code: "6.9"
    source: "general knowledge"
    points: 1
    prompt: |
      Given ΔH° = −296.8 kJ for S(s) + O₂(g) → SO₂(g) and ΔH° = −395.7 kJ for S(s) + 3/2 O₂(g) → SO₃(g), what is ΔH° for 2 SO₂(g) + O₂(g) → 2 SO₃(g)?
    options:
      - "−98.9 kJ"
      - "+98.9 kJ"
      - "−692.5 kJ"
      - "−197.8 kJ"
    option_explanations:
