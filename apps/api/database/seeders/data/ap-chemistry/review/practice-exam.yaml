  - slug: apchem-final-q54
    type: multiple_choice
    topic_code: "9.8"
    source: "general knowledge"
    points: 1
    stimulus: |
      A galvanic cell is built from a magnesium electrode in 1.0 M Mg(NO₃)₂ and a copper electrode in 1.0 M Cu(NO₃)₂ at 298 K, joined by a wire and a KNO₃ salt bridge. Standard reduction potentials: Cu²⁺(aq) + 2 e⁻ → Cu(s), +0.34 V; Mg²⁺(aq) + 2 e⁻ → Mg(s), −2.37 V.
    prompt: |
      What are E°cell and ΔG° for Mg(s) + Cu²⁺(aq) → Mg²⁺(aq) + Cu(s)?
    options:
      - "E° = 2.03 V; ΔG° = −392 kJ"
      - "E° = 2.71 V; ΔG° = +523 kJ"
      - "E° = 2.71 V; ΔG° = −261 kJ"
      - "E° = 2.71 V; ΔG° = −523 kJ"
    option_explanations:
      - |
        2.03 V is 2.37 − 0.34; the anode potential is negative, so subtracting it adds: 0.34 − (−2.37) = 2.71 V.
      - |
        A positive cell potential gives a negative ΔG°; the sign is wrong.
      - |
        −261 kJ uses n = 1; two electrons are transferred (Mg → Mg²⁺).
      - |
        Correct. E° = 0.34 − (−2.37) = 2.71 V; ΔG° = −nFE° = −(2)(96,485)(2.71) = −523,000 J = −523 kJ.
    answer: 3
    explanation: |
      Practice 5. E°cell = E°cathode − E°anode; ΔG° = −nFE° with n from the balanced equation.
  - slug: apchem-final-q55
    type: multiple_choice
    topic_code: "9.9"
    source: "general knowledge"
    points: 1
    stimulus: |
      A galvanic cell is built from a magnesium electrode in 1.0 M Mg(NO₃)₂ and a copper electrode in 1.0 M Cu(NO₃)₂ at 298 K, joined by a wire and a KNO₃ salt bridge. Standard reduction potentials: Cu²⁺(aq) + 2 e⁻ → Cu(s), +0.34 V; Mg²⁺(aq) + 2 e⁻ → Mg(s), −2.37 V.
    prompt: |
      The copper half-cell solution is replaced with 0.0010 M Cu(NO₃)₂. What happens to the cell potential?
    options:
      - "It rises by about 0.09 V, because the cell is further from equilibrium."
      - "It is unchanged, because E° is a property of the electrodes."
      - "It falls by about 0.09 V, because Q = [Mg²⁺]/[Cu²⁺] rises from 1 to 1,000."
      - "It falls to zero, because the reactant has been removed."
    option_explanations:
      - |
        Removing a reactant ion moves the cell toward equilibrium and lowers E.
      - |
        E° is unchanged, but E depends on concentrations through the Nernst equation.
      - |
        Correct. E = E° − (0.0592/2) log Q = 2.71 − (0.0296)(3) = 2.71 − 0.089 = 2.62 V.
      - |
        0.0010 M Cu²⁺ is still far above the equilibrium value (K ≈ 10⁹¹); E falls slightly, not to zero.
    answer: 2
    explanation: |
      Practice 5. Each tenfold increase in Q lowers E by 0.0592/n volts; three decades with n = 2 is 0.089 V.
