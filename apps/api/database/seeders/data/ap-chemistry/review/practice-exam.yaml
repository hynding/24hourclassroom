  - slug: apchem-final-q61
    type: short_answer
    topic_code: "2.7"
    source: "general knowledge"
    points: 4
    prompt: |
      Carbon dioxide (CO₂) boils at −78 °C (it sublimes) while sulfur dioxide (SO₂) boils at −10 °C.

      (a) Draw (describe in words) the Lewis structure of each molecule, including any lone pairs on the central atom and the number of resonance structures.
      (b) Name the molecular geometry of each molecule and state whether it is polar, with a one-sentence justification.
      (c) Identify the strongest intermolecular force present in each substance.
      (d) Explain, in terms of your answers to (b) and (c), why SO₂ has the higher boiling point even though both molecules have similar molar masses (44 and 64 g/mol).
    answer: |
      (a) CO₂: O=C=O, two double bonds, no lone pairs on carbon, two lone pairs on each oxygen; a single structure (16 valence electrons). SO₂: O=S–O with one lone pair on sulfur, two equivalent resonance structures (18 valence electrons; S–O bond order 1.5).
      (b) CO₂ is linear (two electron domains, 180°) and nonpolar: the two equal C=O dipoles point in opposite directions and cancel. SO₂ is bent (three electron domains, one a lone pair, about 119°) and polar: the two S–O dipoles do not cancel, and the lone pair side is partially negative.
      (c) CO₂: London dispersion forces only. SO₂: dipole–dipole attractions (in addition to dispersion).
      (d) The dispersion forces are of similar size (comparable electron counts), but SO₂ molecules also attract one another through their permanent dipoles; the extra dipole–dipole attraction requires more energy to separate the molecules, so SO₂ boils about 70 °C higher.
    explanation: |
      Four points.

      (a) 1 pt: both structures with correct bonding, the lone pair on S, and the resonance of SO₂ (CO₂ with no lone pair on C).
      (b) 1 pt: linear/nonpolar and bent/polar, each justified by cancellation or non-cancellation of bond dipoles.
      (c) 1 pt: dispersion for CO₂; dipole–dipole for SO₂.
      (d) 1 pt: the boiling-point difference attributed to the added dipole–dipole force in SO₂, with dispersion acknowledged as similar; "stronger bonds" or "heavier" alone earns nothing.
  - slug: apchem-final-q62
    type: short_answer
    topic_code: "5.5"
    source: "general knowledge"
    points: 4
    prompt: |
      Dinitrogen pentoxide decomposes in the gas phase: 2 N₂O₅(g) → 4 NO₂(g) + O₂(g). A student measures [N₂O₅] over time at 45 °C and finds that a plot of ln[N₂O₅] against time is a straight line with slope −5.0 × 10⁻⁴ s⁻¹, while plots of [N₂O₅] and of 1/[N₂O₅] against time are curved.

      (a) State the order of the reaction with respect to N₂O₅ and justify it from the plots.
      (b) Write the rate law and give the value of k with units.
      (c) Calculate the half-life of N₂O₅ at this temperature.
      (d) Calculate the time required for [N₂O₅] to fall to 10.0% of its initial value.
    answer: |
      (a) First order: only the ln[N₂O₅] versus t plot is linear, which is the signature of the first-order integrated rate law ln[A]ₜ = −kt + ln[A]₀.
      (b) rate = k[N₂O₅], with k = −slope = 5.0 × 10⁻⁴ s⁻¹.
      (c) t½ = 0.693/k = 0.693/(5.0 × 10⁻⁴ s⁻¹) = 1.39 × 10³ s (about 23 minutes).
      (d) ln([A]ₜ/[A]₀) = −kt; ln(0.100) = −2.303 = −(5.0 × 10⁻⁴)t; t = 4.6 × 10³ s (about 77 minutes, which is 3.3 half-lives).
    explanation: |
      Four points.

      (a) 1 pt: first order, justified by the linearity of ln[A] versus t (and the curvature of the others).
      (b) 1 pt: rate = k[N₂O₅] with k = 5.0 × 10⁻⁴ s⁻¹ (units required).
      (c) 1 pt: t½ ≈ 1,390 s (accept 1,380–1,400 s or 23 min).
      (d) 1 pt: t ≈ 4,600 s (accept 4,600–4,610 s or 77 min), from the integrated rate law or from 3.32 half-lives.
  - slug: apchem-final-q63
    type: short_answer
    topic_code: "4.2"
    source: "PubChem (molar masses)"
    points: 4
    prompt: |
      A student adds 25.0 mL of 0.200 M AgNO₃(aq) to 50.0 mL of 0.200 M NaCl(aq). A white precipitate forms.

      (a) Write the net ionic equation for the reaction.
      (b) Identify the limiting reactant, showing the calculation.
      (c) Calculate the mass of precipitate formed (AgCl = 143.32 g/mol).
      (d) Describe a particle diagram of the solution after the reaction is complete and the solid has settled: name every ion that remains dissolved, and state which of them is present in the greatest amount.
    answer: |
      (a) Ag⁺(aq) + Cl⁻(aq) → AgCl(s).
      (b) mol Ag⁺ = 0.0250 L × 0.200 M = 5.00 × 10⁻³ mol; mol Cl⁻ = 0.0500 L × 0.200 M = 1.00 × 10⁻² mol. The ratio is 1:1, so Ag⁺ (AgNO₃) is limiting and 5.00 × 10⁻³ mol of Cl⁻ is left over.
      (c) 5.00 × 10⁻³ mol AgCl × 143.32 g/mol = 0.717 g.
      (d) The diagram shows water molecules with dissolved Na⁺ (1.00 × 10⁻² mol), NO₃⁻ (5.00 × 10⁻³ mol) and the excess Cl⁻ (5.00 × 10⁻³ mol), no Ag⁺ (except the negligible amount from AgCl's Ksp), and AgCl as a solid at the bottom. Na⁺ is the most abundant ion; the diagram should show twice as many Na⁺ as NO₃⁻ or Cl⁻.
    explanation: |
      Four points.

      (a) 1 pt: correct net ionic equation with states; spectators omitted.
      (b) 1 pt: both mole calculations and Ag⁺ identified as limiting.
      (c) 1 pt: 0.717 g (accept 0.716–0.717 g).
      (d) 1 pt: Na⁺, NO₃⁻ and Cl⁻ remaining with Na⁺ most abundant and Ag⁺ essentially absent; the 2:1:1 proportion is required for the point.
  - slug: apchem-final-q64
    type: short_answer
    topic_code: "6.6"
    source: "NIST Chemistry WebBook (bond enthalpies, rounded)"
    points: 4
    prompt: |
      Average bond enthalpies (kJ/mol): N≡N 945; H–H 436; N–H 391.

      (a) Estimate ΔH° for N₂(g) + 3 H₂(g) → 2 NH₃(g) from the bond enthalpies, showing the bonds broken and formed.
      (b) Predict the sign of ΔS° for the reaction and justify it.
      (c) Using your answers, state whether the reaction is thermodynamically favourable at low temperature, at high temperature, or at both, and explain.
      (d) The tabulated ΔH° (from enthalpies of formation) is −92 kJ. Give one reason the bond-enthalpy estimate differs from it.
    answer: |
      (a) Bonds broken: 1 N≡N (945) + 3 H–H (3 × 436 = 1,308) = 2,253 kJ. Bonds formed: 6 N–H (6 × 391 = 2,346 kJ). ΔH° ≈ 2,253 − 2,346 = −93 kJ.
      (b) Negative: four moles of gas become two, so the matter is less dispersed.
      (c) ΔH° < 0 and ΔS° < 0 is the case favourable at low temperature only: ΔG° = ΔH° − TΔS° is negative while T is small, and becomes positive above T = ΔH°/ΔS° (about 465 K with ΔS° = −198 J/K), because the −TΔS° term is positive and grows with T.
      (d) Bond enthalpies are averages over many compounds, so the N–H value is not exactly that of NH₃ (any one of: the N–H enthalpy varies with the molecule; average values are rounded; the tabulated value refers to the standard states, while bond enthalpies describe gas-phase bonds). The agreement here (−93 versus −92 kJ) is unusually close.
    explanation: |
      Four points.

      (a) 1 pt: correct accounting (2,253 broken, 2,346 formed) and ΔH° ≈ −93 kJ.
      (b) 1 pt: negative, justified by the decrease in gas moles.
      (c) 1 pt: favourable at low temperature only, with the sign reasoning in ΔG° = ΔH° − TΔS°.
      (d) 1 pt: average bond enthalpies are not molecule-specific (or an equivalent valid reason).
  - slug: apchem-final-q65
    type: long_answer
    topic_code: "8.5"
    source: "general knowledge"
    points: 10
    prompt: |
      A 30.0 mL sample of 0.150 M nitrous acid, HNO₂ (Ka = 4.5 × 10⁻⁴), is titrated with 0.150 M NaOH at 25 °C.

      (a) Write the net ionic equation for the titration reaction.
      (b) Calculate the pH of the acid before any base is added. (Check whether the small-x approximation is valid.)
      (c) Calculate the volume of NaOH needed to reach the equivalence point.
      (d) Calculate the pH after 10.0 mL of NaOH has been added.
      (e) State the pH after 15.0 mL of NaOH has been added and explain why no calculation is needed.
      (f) Calculate the pH at the equivalence point.
      (g) Calculate the pH after 40.0 mL of NaOH has been added.
      (h) Indicator ranges: methyl red 4.2–6.3; bromothymol blue 6.0–7.6; phenolphthalein 8.2–10.0. Choose the best indicator and justify your choice.
      (i) Describe the shape of the titration curve from 0 to 40.0 mL, naming the species that controls the pH in each region.
    answer: |
      (a) HNO₂(aq) + OH⁻(aq) → NO₂⁻(aq) + H₂O(l).
      (b) Ka = x²/(0.150 − x). The approximation x = √(4.5 × 10⁻⁴ × 0.150) = 8.2 × 10⁻³ M is 5.5% of 0.150, so solve the quadratic: x² + 4.5 × 10⁻⁴x − 6.75 × 10⁻⁵ = 0, x = 8.0 × 10⁻³ M; pH = 2.10.
      (c) mol HNO₂ = 0.0300 L × 0.150 M = 4.50 × 10⁻³ mol; the same moles of NaOH is needed: V = 4.50 × 10⁻³/0.150 = 0.0300 L = 30.0 mL.
      (d) mol OH⁻ added = 0.0100 × 0.150 = 1.50 × 10⁻³ mol; HNO₂ left 3.00 × 10⁻³ mol, NO₂⁻ formed 1.50 × 10⁻³ mol (same volume, so moles may be used). pH = pKa + log(1.50/3.00) = 3.35 + (−0.30) = 3.05.
      (e) 15.0 mL is half the equivalence volume, so [HNO₂] = [NO₂⁻] and pH = pKa = −log(4.5 × 10⁻⁴) = 3.35.
      (f) All HNO₂ is converted to 4.50 × 10⁻³ mol NO₂⁻ in 60.0 mL: [NO₂⁻] = 0.0750 M. Kb = Kw/Ka = 2.2 × 10⁻¹¹; x = [OH⁻] = √(2.2 × 10⁻¹¹ × 0.0750) = 1.3 × 10⁻⁶ M; pOH = 5.89; pH = 8.11.
      (g) Excess OH⁻ = (0.0400 − 0.0300) L × 0.150 M = 1.50 × 10⁻³ mol in 0.0700 L = 0.0214 M; pOH = 1.67; pH = 12.33.
      (h) Phenolphthalein: its colour change (8.2–10.0) lies on the steep part of the curve, which passes through the equivalence pH of 8.11 and continues up past 10; methyl red would change in the buffer region and bromothymol blue would change just before equivalence.
      (i) The curve starts at pH 2.10 (weak acid, set by Ka and the concentration), rises gently through the buffer region where HNO₂ and NO₂⁻ together control the pH (pH = pKa at 15.0 mL), climbs steeply near 30.0 mL to the equivalence point at pH 8.11 (controlled by the weak base NO₂⁻), and then flattens above pH 12 where excess strong base OH⁻ controls the pH.
    explanation: |
      Ten points.

      (a) 1 pt: net ionic equation with water as a product.
      (b) 2 pts: 1 pt for the Ka setup with the 5% check (approximation fails), 1 pt for pH = 2.10 (accept 2.09–2.11; accept 2.08 from the approximation only if the check is shown and the student notes the small error).
      (c) 1 pt: 30.0 mL.
      (d) 1 pt: pH ≈ 3.05 (accept 3.04–3.06) via stoichiometry then Henderson–Hasselbalch.
      (e) 1 pt: pH = pKa = 3.35 with the half-equivalence reason.
      (f) 2 pts: 1 pt for [NO₂⁻] = 0.0750 M and Kb = 2.2 × 10⁻¹¹, 1 pt for pH ≈ 8.11 (accept 8.10–8.12).
      (g) 1 pt: pH ≈ 12.33 (accept 12.32–12.34) with the diluted excess OH⁻.
      (h) and (i) 1 pt together: phenolphthalein with a justification tied to the steep region, and a curve description naming the controlling species in each region.
  - slug: apchem-final-q66
    type: long_answer
    topic_code: "6.5"
    source: "NIST Chemistry WebBook (enthalpies of formation, rounded)"
    points: 10
    prompt: |
      A student measures the enthalpy of neutralisation. 50.0 mL of 1.00 M HCl and 50.0 mL of 1.00 M NaOH, both at 22.0 °C, are mixed in a polystyrene-cup calorimeter. The temperature rises to a maximum of 28.7 °C. Assume the solution has the density (1.00 g/mL) and specific heat (4.184 J/(g·°C)) of water and that the cup absorbs no heat.

      (a) Write the net ionic equation for the reaction.
      (b) Calculate the heat absorbed by the solution, in J.
      (c) Calculate the moles of water formed and hence ΔH for the reaction in kJ per mole of water.
      (d) Standard enthalpies of formation: H₂O(l) −285.8 kJ/mol; OH⁻(aq) −230.0 kJ/mol; H⁺(aq) 0 by convention. Calculate ΔH° for the net ionic reaction from these data and compare it with your experimental value.
      (e) Give the most likely reason for the direction of the difference between the two values, and describe one change to the procedure that would reduce it.
      (f) The experiment is repeated with 50.0 mL of 1.00 M acetic acid in place of the HCl. Predict whether the temperature rise will be larger, smaller or the same, and explain.
      (g) The experiment is repeated with 2.00 M HCl and 2.00 M NaOH (same volumes). Predict the temperature rise and explain why ΔH per mole is unchanged.
    answer: |
      (a) H⁺(aq) + OH⁻(aq) → H₂O(l).
      (b) Mass of solution = 100.0 g; ΔT = 28.7 − 22.0 = 6.7 °C; q(solution) = (100.0)(4.184)(6.7) = 2,800 J (2.80 × 10³ J).
      (c) mol H⁺ = mol OH⁻ = 0.0500 L × 1.00 M = 0.0500 mol, so 0.0500 mol of water forms. q(reaction) = −2,800 J; ΔH = −2,800 J / 0.0500 mol = −56,000 J/mol = −56 kJ/mol (−56.1).
      (d) ΔH° = ΔH°f[H₂O(l)] − ΔH°f[H⁺] − ΔH°f[OH⁻] = −285.8 − 0 − (−230.0) = −55.8 kJ/mol. The experimental −56.1 kJ/mol agrees to within about 0.5%.
      (e) Any difference usually arises from heat lost to the cup, the thermometer and the air (which would make the measured magnitude too small), or from the assumption that the solution has exactly water's specific heat and density; here the values agree closely, so the dominant error is small. To reduce heat loss: use a lid and a nested double cup, stir, and extrapolate the cooling curve back to the time of mixing to find the true maximum temperature; or determine the calorimeter's heat capacity with a known reaction.
      (f) Smaller. Acetic acid is weak, so some of the heat released by H⁺ + OH⁻ is consumed in ionising CH₃COOH (an endothermic step); the overall reaction CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O is less exothermic (about −55 kJ/mol rather than −56, and more noticeably for weaker acids).
      (g) Doubling both concentrations doubles the moles reacting (0.100 mol) in the same 100.0 g of solution, so q doubles and ΔT is about 13.4 °C. ΔH per mole of water is an intensive property of the reaction, so it is the same −56 kJ/mol: twice the heat divided by twice the moles.
    explanation: |
      Ten points.

      (a) 1 pt: net ionic equation.
      (b) 2 pts: 1 pt for using the total mass (100.0 g) and ΔT = 6.7 °C; 1 pt for q ≈ 2,800 J (accept 2,790–2,810 J).
      (c) 2 pts: 1 pt for 0.0500 mol water; 1 pt for ΔH ≈ −56 kJ/mol with the negative sign (accept −55.9 to −56.2).
      (d) 1 pt: −55.8 kJ/mol from formation data and a comparison statement.
      (e) 1 pt: heat loss (or calorimeter heat capacity) as the reason, with a specific procedural improvement.
      (f) 1 pt: smaller rise, because ionisation of the weak acid absorbs some of the energy.
      (g) 2 pts: 1 pt for ΔT ≈ 13.4 °C (accept 13–14 °C); 1 pt for ΔH per mole unchanged because it is intensive (the heat and the moles both double).
  - slug: apchem-final-q67
    type: long_answer
    topic_code: "9.5"
    source: "NIST Chemistry WebBook (thermodynamic data, rounded)"
    points: 10
    prompt: |
      Methanol is manufactured from synthesis gas: CO(g) + 2 H₂(g) ⇌ CH₃OH(g).

      | Substance | ΔH°f (kJ/mol) | S° (J/(mol·K)) |
      |---|---|---|
      | CO(g) | −110.5 | 197.7 |
      | H₂(g) | 0 | 130.7 |
      | CH₃OH(g) | −201.0 | 239.9 |

      (a) Calculate ΔH° for the reaction.
      (b) Calculate ΔS° for the reaction and explain its sign in terms of the particles.
      (c) Calculate ΔG° at 298 K and the equilibrium constant K at 298 K.
      (d) Calculate the temperature at which ΔG° = 0, and state what happens to K above that temperature.
      (e) Industrially the reaction is run at about 500 K over a copper-zinc oxide catalyst and at high pressure. Explain, using your answers, why a temperature at which K is unfavourable is used, why high pressure is used, and what the catalyst does and does not change.
      (f) At 500 K, Kp = 0.010. A mixture at 500 K contains CO at 1.0 atm, H₂ at 2.0 atm and CH₃OH at 0.10 atm. Calculate Q, compare it with K, and state the direction in which the reaction proceeds.
      (g) Write the expression for ΔG in terms of ΔG° and Q, and use it (or the Q versus K comparison) to state the sign of ΔG for the mixture in part (f).
    answer: |
      (a) ΔH° = ΔH°f[CH₃OH] − ΔH°f[CO] − 2 ΔH°f[H₂] = −201.0 − (−110.5) − 0 = −90.5 kJ.
      (b) ΔS° = 239.9 − 197.7 − 2(130.7) = 239.9 − 459.1 = −219.2 J/K. Negative because three moles of gas become one; the matter is far less dispersed.
      (c) ΔG° = ΔH° − TΔS° = −90.5 − (298)(−0.2192) = −90.5 + 65.3 = −25.2 kJ. ln K = −ΔG°/(RT) = 25,200/(8.314 × 298) = 10.2; K = e^10.2 ≈ 2.6 × 10⁴.
      (d) T = ΔH°/ΔS° = 90,500/219.2 = 413 K. Above 413 K, ΔG° > 0 and K < 1; K keeps falling as T rises (exothermic reaction).
      (e) At 298 K the reaction is far too slow: the rate, not the yield, is the problem, so a higher temperature is chosen even though K drops to about 0.01 at 500 K (a compromise between kinetics and thermodynamics). High pressure raises the yield because the forward reaction reduces the gas moles from three to one: compressing the mixture lowers Q below K, and the system responds by making more methanol. The catalyst lowers the activation energy so that equilibrium is reached quickly at 500 K; it changes neither ΔG°, K nor the equilibrium composition.
      (f) Q = P(CH₃OH)/[P(CO) P(H₂)²] = 0.10/[(1.0)(2.0)²] = 0.10/4.0 = 0.025. Q > K (0.025 > 0.010), so the reaction proceeds in reverse: methanol decomposes until Q falls to 0.010.
      (g) ΔG = ΔG° + RT ln Q = RT ln(Q/K). Since Q > K, ln(Q/K) > 0 and ΔG > 0 for the forward reaction (ΔG = (8.314)(500) ln(2.5) = +3.8 kJ), consistent with the reverse direction being favourable.
    explanation: |
      Ten points.

      (a) 1 pt: −90.5 kJ.
      (b) 2 pts: 1 pt for −219.2 J/K (accept −219 ± 1); 1 pt for the sign explained by the loss of gas moles.
      (c) 2 pts: 1 pt for ΔG° ≈ −25.2 kJ (accept −25 to −25.5, with the J → kJ conversion); 1 pt for K ≈ 2.6 × 10⁴ (accept 2 × 10⁴ to 3 × 10⁴).
      (d) 1 pt: T ≈ 413 K (accept 410–415 K) and K < 1 above it.
      (e) 2 pts: 1 pt for the rate-versus-yield reason for 500 K and the gas-mole (Q versus K or Le Châtelier) reason for high pressure; 1 pt for the catalyst lowering Ea without changing K or ΔG°.
      (f) 1 pt: Q = 0.025 > K, reverse direction.
      (g) 1 pt: ΔG = ΔG° + RT ln Q and ΔG > 0 for the forward reaction (accept +3.8 kJ or the qualitative sign with reasoning).
