week: 22
unit: 6
title: "Bond Enthalpies, Enthalpies of Formation and Hess's Law"
topics: ["6.7", "6.8", "6.9"]
guide: guides/week-22.md
guide_description: |
  Three ways to find ΔH without a calorimeter: the bond-enthalpy estimate (Σ broken − Σ formed, gas phase,
  bonds counted from Lewis structures), standard enthalpies of formation (Σ n ΔH°f products − Σ n ΔH°f
  reactants, elements zero), and Hess's law (scale, reverse and add known equations because enthalpy is a state
  function). Tables of bond enthalpies and ΔH°f values, worked examples for each method, and a guide to choosing
  the method from what the question gives you.
flashcards_description: |
  29 cards on bond enthalpies, standard states and enthalpies of formation, Hess's law manipulations and which
  method to use when.

flashcards:
  - front: Bond enthalpy → definition and sign
    back: |
      The energy required to break one mole of a given bond in the gas phase, always positive. For bonds other than those in diatomic molecules it is an average over many compounds.
    topic_code: "6.7"
  - front: Bond-enthalpy formula for ΔH of a reaction
    back: |
      ΔH ≈ Σ(bond enthalpies of bonds broken) − Σ(bond enthalpies of bonds formed). Breaking costs (positive), forming releases, so a reaction forming stronger bonds comes out negative.
    topic_code: "6.7"
  - front: Why a bond-enthalpy calculation is only an estimate
    back: |
      Tabulated values are averages over many molecules (a C–H in methane differs from one in benzene), and they apply to gases only; liquids and solids need extra phase-change terms.
    topic_code: "6.7"
  - front: Counting bonds for a bond-enthalpy calculation
    back: |
      Use Lewis structures, not formulas: CO₂ has two C=O bonds, O₂ one O=O, N₂ one N≡N, H₂O two O–H, CH₄ four C–H. Only bonds that actually change need to be counted (unchanged bonds cancel).
    topic_code: "6.7"
  - front: Bond-enthalpy estimate for CH₄ + 2 O₂ → CO₂ + 2 H₂O(g)
    back: |
      Broken: 4 C–H (1,652) + 2 O=O (990) = 2,642 kJ. Formed: 2 C=O (1,598) + 4 O–H (1,868) = 3,466 kJ. ΔH ≈ −824 kJ/mol (accepted −802 kJ/mol).
    topic_code: "6.7"
  - front: Bond-enthalpy estimate for H₂ + Cl₂ → 2 HCl
    back: |
      Broken 436 + 243 = 679 kJ; formed 2 × 431 = 862 kJ; ΔH ≈ −183 kJ. The two H–Cl bonds are stronger together than one H–H plus one Cl–Cl.
    topic_code: "6.7"
  - front: Why hydrocarbons are good fuels, in bond terms
    back: |
      Combustion replaces moderately strong C–H, C–C and O=O bonds with very strong C=O (799 kJ/mol) and O–H (467 kJ/mol) bonds, so far more energy is released in forming than spent in breaking.
    topic_code: "6.7"
  - front: Why N₂ is so unreactive, in bond terms
    back: |
      Its triple bond has a bond enthalpy of 945 kJ/mol, among the highest known; most reactions that must break it are endothermic or have huge activation energies.
    topic_code: "6.7"
  - front: Standard state → what the ° means
    back: |
      The pure substance at 1 atm (1 bar) and, usually, 25 °C; a solute at 1 M. Standard states of elements: O₂(g), N₂(g), H₂(g), Cl₂(g), Br₂(l), Hg(l), C(s, graphite), Na(s).
    topic_code: "6.8"
  - front: Standard enthalpy of formation ΔH°f → definition
    back: |
      ΔH for forming exactly one mole of a compound from its elements in their standard states, at standard conditions. For an element in its standard state, ΔH°f = 0 by definition.
    topic_code: "6.8"
  - front: Formation equation for NH₃(g) and for C₂H₅OH(l)
    back: |
      ½ N₂(g) + 3/2 H₂(g) → NH₃(g), ΔH°f = −45.9 kJ/mol. 2 C(s, graphite) + 3 H₂(g) + ½ O₂(g) → C₂H₅OH(l), ΔH°f = −277.6 kJ/mol. One mole of product; fractions allowed.
    topic_code: "6.8"
  - front: ΔH°rxn from enthalpies of formation → the formula
    back: |
      ΔH°rxn = Σ n ΔH°f(products) − Σ n ΔH°f(reactants), with n the coefficients and elements in standard states contributing zero. Exact at standard conditions.
    topic_code: "6.8"
  - front: Meaning of a positive ΔH°f
    back: |
      The compound lies above its elements in enthalpy: forming it absorbs energy and it stores energy relative to them. Examples: NO (+90.3), NO₂ (+33.2), O₃ (+142.7), C₂H₂ (+227) kJ/mol.
    topic_code: "6.8"
  - front: ΔH° of propane combustion from ΔH°f values
    back: |
      [3(−393.5) + 4(−285.8)] − [−103.8] = −2,323.7 + 103.8 = −2,219.9 kJ per mole of propane (liquid water as product).
    topic_code: "6.8"
  - front: Finding an unknown ΔH°f from a measured ΔH°rxn
    back: |
      Put the known values into Σ products − Σ reactants, leave the unknown as x and solve. Ethanol combustion −1,367 kJ gives x = −1,644.4 + 1,367 = −277.4 kJ/mol.
    topic_code: "6.8"
  - front: ΔH°f of H₂O(l) versus H₂O(g)
    back: |
      −285.8 kJ/mol for liquid, −241.8 kJ/mol for gas; the 44.0 kJ difference is the enthalpy of vaporisation at 25 °C. Combustion to liquid water is the more exothermic value.
    topic_code: "6.8"
  - front: Hess's law → statement
    back: |
      Because enthalpy is a state function, the ΔH of a reaction is the same whether it occurs in one step or several; ΔH for a target reaction equals the sum of the ΔH values of the steps that add up to it.
    topic_code: "6.9"
  - front: State function → definition and examples
    back: |
      A property that depends only on the current state of the system, not on the path by which it was reached. Enthalpy, internal energy, entropy, free energy, temperature, pressure. Heat and work are not state functions.
    topic_code: "6.9"
  - front: The two manipulations allowed in Hess's law
    back: |
      Multiply an equation and its ΔH by the same factor; reverse an equation and change the sign of its ΔH. Then add the equations, cancelling species that appear on both sides.
    topic_code: "6.9"
  - front: Hess's law method → the four steps
    back: |
      Locate each target species in the given equations; arrange each given equation so the species is on the correct side with the correct coefficient; add the equations and cancel; add the ΔH values.
    topic_code: "6.9"
  - front: Hess's law example → ΔH°f of CO from two combustions
    back: |
      C + O₂ → CO₂ (−393.5) plus the reverse of CO + ½ O₂ → CO₂ (+283.0) gives C + ½ O₂ → CO, ΔH = −110.5 kJ, a reaction that cannot be run cleanly in a calorimeter.
    topic_code: "6.9"
  - front: Hess's law example → 2 NO + O₂ → 2 NO₂
    back: |
      Reverse N₂ + O₂ → 2 NO (ΔH becomes −180.6) and add N₂ + 2 O₂ → 2 NO₂ (+66.4): ΔH = −114.2 kJ.
    topic_code: "6.9"
  - front: Hess's law shown on an energy diagram
    back: |
      Levels for N₂ + 2 O₂ (0), 2 NO₂ (+66.4) and 2 NO + O₂ (+180.6): the enthalpy change between any two levels is the same by any path, which is why the ΔH values simply add.
    topic_code: "6.9"
  - front: Which ΔH method when → the decision table
    back: |
      Bond enthalpies given and gas phase: estimate by Σ broken − Σ formed. ΔH°f table: Σ products − Σ reactants, exact. Other reactions with ΔH: Hess's law. Temperature data: calorimetry.
    topic_code: "6.9"
  - front: Sign check for any ΔH calculation
    back: |
      Combustions and neutralisations must come out negative; decompositions of stable compounds (CaCO₃, H₂O) positive. A combustion that comes out positive means the formula was applied backwards.
    topic_code: "6.8"
  - front: Bond order and bond enthalpy (spiral 2.2)
    back: |
      Higher bond order means a shorter, stronger bond: C–C 347, C=C 614, C≡C 839 kJ/mol. Each extra shared pair deepens the potential-energy well.
    topic_code: "2.2"
  - front: Lewis structure of CO₂ and what it means for bond counting (spiral 2.5)
    back: |
      O=C=O: two carbon–oxygen double bonds and no single bonds. Forming one CO₂ releases 2 × 799 = 1,598 kJ/mol, the largest single contribution to a hydrocarbon's heat of combustion.
    topic_code: "2.5"
  - front: Scaling and reversing thermochemical equations (spiral 6.6)
    back: |
      Half the equation, half the ΔH; reverse it, flip the sign. These are the only moves Hess's law needs. Halving 2 H₂ + O₂ → 2 H₂O (−571.6) gives H₂ + ½ O₂ → H₂O (−285.8).
    topic_code: "6.6"
  - front: Enthalpy of vaporisation from two ΔH values (spiral 6.5)
    back: |
      H₂O(l) → H₂O(g): ΔH = ΔH°f(g) − ΔH°f(l) = −241.8 − (−285.8) = +44.0 kJ/mol at 25 °C (40.7 kJ/mol at 100 °C).
    topic_code: "6.5"

quiz:
  description: |
    23 questions · about 45 minutes · topics 6.7–6.9 (bond enthalpies, standard enthalpies of formation and
    Hess's law), with review of Lewis structures, bond order, thermochemical-equation rules, energy diagrams and
    calorimetry from earlier weeks. Multiple choice, select-all, true/false and numeric items are graded at
    once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded
    by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: ΔH°f table (6.8)
    - slug: apchem-u06-w22-q01
      type: multiple_choice
      topic_code: "6.8"
      source: "NIST Chemistry WebBook (standard enthalpies of formation, rounded)"
      points: 1
      stimulus: |
        Standard enthalpies of formation at 25 °C:

        | Substance | ΔH°f (kJ/mol) |
        |---|---|
        | CaCO₃(s) | −1,206.9 |
        | CaO(s) | −635.1 |
        | CO₂(g) | −393.5 |
        | Ca(OH)₂(s) | −985.2 |
        | H₂O(l) | −285.8 |
      prompt: |
        Which expression gives ΔH° for the reaction CaCO₃(s) → CaO(s) + CO₂(g)?
      options:
        - "(−1,206.9) − [(−635.1) + (−393.5)]"
        - "[(−635.1) + (−393.5)] − (−1,206.9)"
        - "(−635.1) + (−393.5) + (−1,206.9)"
        - "[(−635.1) × (−393.5)] ÷ (−1,206.9)"
      option_explanations:
        - |
          This is reactants minus products, the reverse of the correct order, and would give the wrong sign.
        - |
          Correct. ΔH°rxn = Σ n ΔH°f(products) − Σ n ΔH°f(reactants): the products CaO and CO₂ minus the reactant CaCO₃.
        - |
          Adding every value together has no physical meaning; the reactant must be subtracted.
        - |
          Enthalpies of formation are added and subtracted, never multiplied or divided.
      answer: 1
      explanation: |
        Practice 5. Products minus reactants, each weighted by its coefficient.

    - slug: apchem-u06-w22-q02
      type: multiple_choice
      topic_code: "6.8"
      source: "NIST Chemistry WebBook (standard enthalpies of formation, rounded)"
      points: 1
      stimulus: |
        Standard enthalpies of formation at 25 °C:

        | Substance | ΔH°f (kJ/mol) |
        |---|---|
        | CaCO₃(s) | −1,206.9 |
        | CaO(s) | −635.1 |
        | CO₂(g) | −393.5 |
        | Ca(OH)₂(s) | −985.2 |
        | H₂O(l) | −285.8 |
      prompt: |
        Using the table, what is ΔH° for CaO(s) + H₂O(l) → Ca(OH)₂(s)?
      options:
        - "+64.3 kJ"
        - "−1,906.1 kJ"
        - "−349.4 kJ"
        - "−64.3 kJ"
      option_explanations:
        - |
          The magnitude is right but the sign is wrong: the product lies below the reactants, so the reaction is exothermic (slaking lime gets hot).
        - |
          −1,906.1 kJ is the sum of all three values, not products minus reactants.
        - |
          −349.4 kJ results from omitting the water's enthalpy of formation.
        - |
          Correct. ΔH° = (−985.2) − [(−635.1) + (−285.8)] = −985.2 + 920.9 = −64.3 kJ.
      answer: 3
      explanation: |
        Practice 5. Σ products − Σ reactants with every reactant included.

    - slug: apchem-u06-w22-q03
      type: numeric
      topic_code: "6.8"
      source: "NIST Chemistry WebBook (standard enthalpies of formation, rounded)"
      points: 1
      stimulus: |
        Standard enthalpies of formation at 25 °C:

        | Substance | ΔH°f (kJ/mol) |
        |---|---|
        | CaCO₃(s) | −1,206.9 |
        | CaO(s) | −635.1 |
        | CO₂(g) | −393.5 |
        | Ca(OH)₂(s) | −985.2 |
        | H₂O(l) | −285.8 |
      prompt: |
        Calculate ΔH° for the decomposition CaCO₃(s) → CaO(s) + CO₂(g). Give your answer in kJ to one decimal place, including the sign.
      answer: { value: 178.3, tolerance: 0.3 }
      explanation: |
        ΔH° = [(−635.1) + (−393.5)] − (−1,206.9) = −1,028.6 + 1,206.9 = +178.3 kJ. The decomposition is endothermic, which is why limestone must be heated strongly in a kiln to make lime.

    # ---- Stand-alone multiple choice
    - slug: apchem-u06-w22-q04
      type: multiple_choice
      topic_code: "6.7"
      source: "general knowledge"
      points: 1
      prompt: |
        A student uses average bond enthalpies to estimate ΔH for the combustion of methane and obtains −824 kJ/mol, while the accepted value for gaseous products is −802 kJ/mol. Which is the best explanation for the difference?
      options:
        - "The student must have made an arithmetic error, because bond enthalpies give exact results."
        - "Bond enthalpies apply only to endothermic reactions."
        - "Tabulated bond enthalpies are averages over many compounds, so the actual C–H and O–H bonds in these molecules differ slightly from the average values."
        - "The method ignores the bonds formed and counts only those broken."
      option_explanations:
        - |
          Bond-enthalpy calculations are inherently approximate; a 3% discrepancy is typical and not evidence of an error.
        - |
          The method applies to any gas-phase reaction, exothermic or endothermic.
        - |
          Correct. A C–H value of 413 kJ/mol is an average; the C–H bonds in methane and the O–H bonds in water are not exactly average, so the estimate is close but not exact.
        - |
          The method counts both: Σ broken − Σ formed. Omitting the bonds formed would give a wildly wrong, positive answer.
      answer: 2
      explanation: |
        Practice 6. Averages give estimates; enthalpies of formation give exact values.

    - slug: apchem-u06-w22-q05
      type: multiple_choice
      topic_code: "6.7"
      source: "general knowledge"
      points: 1
      prompt: |
        For the reaction C₂H₄(g) + H₂(g) → C₂H₆(g), which bonds are broken and which are formed in a bond-enthalpy calculation?
      options:
        - "Broken: one C=C and one H–H; formed: one C–C and two C–H"
        - "Broken: one C=C, four C–H and one H–H; formed: one C–C and six C–H"
        - "Broken: one C–C and one H–H; formed: one C=C and two C–H"
        - "Broken: one H–H; formed: two C–H"
      option_explanations:
        - |
          Correct. The double bond becomes a single bond and the two hydrogen atoms attach to the carbons; the four original C–H bonds are unchanged and cancel.
        - |
          Including the four unchanged C–H bonds on both sides is not wrong arithmetically (they cancel) but this option mislabels the net change; the simplest correct count is C=C and H–H broken, C–C and two C–H formed, and either count gives the same ΔH.
        - |
          The directions are reversed: ethene has the double bond, ethane the single bond.
        - |
          Adding H₂ across a double bond also converts the C=C to C–C, which must be counted.
      answer: 0
      explanation: |
        Practice 1. Compare Lewis structures and count only the bonds that change.

    - slug: apchem-u06-w22-q06
      type: multiple_choice
      topic_code: "6.9"
      source: "general knowledge"
      points: 1
      prompt: |
        Given (1) 2 H₂(g) + O₂(g) → 2 H₂O(g), ΔH = −483.6 kJ, and (2) 2 H₂(g) + O₂(g) → 2 H₂O(l), ΔH = −571.6 kJ, what is ΔH for H₂O(l) → H₂O(g)?
      options:
        - "−88.0 kJ"
        - "+88.0 kJ"
        - "−44.0 kJ"
        - "+44.0 kJ"
      option_explanations:
        - |
          −88.0 kJ has the wrong sign and is for two moles of water; vaporisation is endothermic.
        - |
          +88.0 kJ is the value for 2 H₂O(l) → 2 H₂O(g); the target is one mole.
        - |
          −44.0 kJ has the right magnitude but the wrong sign; converting liquid to gas absorbs heat.
        - |
          Correct. Reverse (2) and add (1): 2 H₂O(l) → 2 H₂O(g), ΔH = +571.6 − 483.6 = +88.0 kJ; halve for one mole: +44.0 kJ.
      answer: 3
      explanation: |
        Practice 5. Reverse, add, then scale to the target's coefficients.

    - slug: apchem-u06-w22-q07
      type: multiple_choice
      topic_code: "6.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Graph description: an energy diagram shows three levels: A + B at 0 kJ, C at −50 kJ, and D at −120 kJ. One path goes directly from A + B to D; another goes from A + B to C and then from C to D. Which statement is correct?
      options:
        - "The direct path releases more heat because it skips the intermediate."
        - "Both paths release 120 kJ in total, because enthalpy is a state function and depends only on the initial and final states."
        - "The two-step path releases 170 kJ, the sum of 50 and 120."
        - "ΔH cannot be compared because the paths have different activation energies."
      option_explanations:
        - |
          Both paths start at the same level and end at the same level; the total enthalpy change is identical.
        - |
          Correct. ΔH = H(final) − H(initial) = −120 kJ by either route; the two-step path releases 50 kJ then 70 kJ, which sum to the same 120 kJ. This is Hess's law.
        - |
          The second step goes from C (−50) to D (−120), releasing 70 kJ, not 120; the total is 50 + 70 = 120 kJ.
        - |
          Activation energies affect rates, not the overall enthalpy change, which is fixed by the end points.
      answer: 1
      explanation: |
        Practice 4 (review of 6.2). Hess's law is the state-function property drawn on an energy diagram.

    - slug: apchem-u06-w22-q08
      type: multiple_choice
      topic_code: "6.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Which equation correctly represents the standard enthalpy of formation of liquid methanol, CH₃OH(l)?
      options:
        - "C(g) + 4 H(g) + O(g) → CH₃OH(l)"
        - "CO(g) + 2 H₂(g) → CH₃OH(l)"
        - "C(s, graphite) + 2 H₂(g) + ½ O₂(g) → CH₃OH(l)"
        - "2 C(s, graphite) + 4 H₂(g) + O₂(g) → 2 CH₃OH(l)"
      option_explanations:
        - |
          Gaseous atoms are not the standard states of carbon, hydrogen and oxygen; this equation describes atomisation energy, not formation.
        - |
          CO is a compound, not an element; formation reactions start from elements in their standard states.
        - |
          Correct. One mole of product from graphite, H₂ and O₂, each in its standard state; the fractional coefficient on O₂ is required to make exactly one mole of methanol.
        - |
          The elements and states are right but the equation makes two moles of methanol; ΔH°f is defined per one mole formed.
      answer: 2
      explanation: |
        Practice 1. Elements in standard states, exactly one mole of product.

    - slug: apchem-u06-w22-q09
      type: multiple_choice
      topic_code: "6.8"
      source: "general knowledge"
      points: 1
      prompt: |
        The standard enthalpy of formation of nitrogen monoxide, NO(g), is +90.3 kJ/mol. Which statement follows?
      options:
        - "NO(g) is higher in enthalpy than ½ N₂(g) + ½ O₂(g), so its decomposition to the elements is exothermic."
        - "NO(g) is more stable than N₂ and O₂."
        - "Forming NO from its elements releases 90.3 kJ per mole."
        - "The bond in NO is stronger than the bonds in N₂ and O₂ combined."
      option_explanations:
        - |
          Correct. A positive ΔH°f places the compound above its elements; the reverse reaction, NO → ½ N₂ + ½ O₂, has ΔH = −90.3 kJ/mol and releases heat.
        - |
          A compound with positive ΔH°f stores energy relative to its elements and is thermodynamically less stable than they are (though it may persist for kinetic reasons).
        - |
          A positive ΔH°f means heat is absorbed, not released, in the formation.
        - |
          If the NO bond were stronger than the half-bonds of N₂ and O₂ it replaces, forming NO would release energy and ΔH°f would be negative.
      answer: 0
      explanation: |
        Practice 6. Sign of ΔH°f places a compound above or below its elements.

    - slug: apchem-u06-w22-q10
      type: multiple_choice
      topic_code: "2.5"
      source: "general knowledge"
      points: 1
      prompt: |
        In a bond-enthalpy calculation for the combustion of ethyne, 2 C₂H₂(g) + 5 O₂(g) → 4 CO₂(g) + 2 H₂O(g), how many C=O bonds are formed?
      options:
        - "4"
        - "8"
        - "2"
        - "12"
      option_explanations:
        - |
          Four is the number of CO₂ molecules; each contains two C=O double bonds.
        - |
          Correct. The Lewis structure of CO₂ is O=C=O, two double bonds per molecule; 4 CO₂ molecules contain 8 C=O bonds.
        - |
          Two is the number of C₂H₂ molecules reacting, not a count of carbon–oxygen bonds.
        - |
          Twelve would be the count if each CO₂ had three C=O bonds, which carbon's four valence electrons cannot support.
      answer: 1
      explanation: |
        Practice 1 (review of 2.5). Bond counts come from Lewis structures.

    - slug: apchem-u06-w22-q11
      type: multiple_choice
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      prompt: |
        For the reaction 4 NH₃(g) + 5 O₂(g) → 4 NO(g) + 6 H₂O(g), ΔH = −906 kJ. What is ΔH per mole of NH₃ consumed?
      options:
        - "−906 kJ"
        - "−3,624 kJ"
        - "−226.5 kJ"
        - "−181.2 kJ"
      option_explanations:
        - |
          −906 kJ is per 4 mol of NH₃ as the equation is written.
        - |
          −3,624 kJ multiplies by 4 instead of dividing.
        - |
          Correct. ΔH scales with the amount: −906 kJ / 4 mol NH₃ = −226.5 kJ per mole of ammonia.
        - |
          −181.2 kJ divides by 5, the coefficient of O₂, not of NH₃.
      answer: 2
      explanation: |
        Practice 5 (review of 6.6). Divide by the coefficient of the species named.

    # ---- Select all
    - slug: apchem-u06-w22-q12
      type: multi_select
      topic_code: "6.8"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about standard enthalpies of formation are correct? Select all that apply.
      options:
        - "ΔH°f of O₂(g) is zero."
        - "ΔH°f of O₃(g) is zero because ozone contains only oxygen."
        - "ΔH°f of H₂O(l) and H₂O(g) differ by the enthalpy of vaporisation."
        - "ΔH°f of Br₂(g) is zero."
        - "A compound with a negative ΔH°f is lower in enthalpy than its elements in their standard states."
      option_explanations:
        - |
          Correct. O₂(g) is the standard state of oxygen, so its enthalpy of formation is zero by definition.
        - |
          Ozone is not the standard state of oxygen; forming O₃ from O₂ absorbs energy, and ΔH°f(O₃) = +142.7 kJ/mol.
        - |
          Correct. −241.8 − (−285.8) = +44.0 kJ/mol is the enthalpy of vaporisation at 25 °C.
        - |
          The standard state of bromine is the liquid, Br₂(l); the gas has ΔH°f = +30.9 kJ/mol.
        - |
          Correct. Negative ΔH°f means heat is released when the compound forms, so the compound lies below the elements.
      answer: [0, 2, 4]
      explanation: |
        Practice 1. Zero only for the element in its standard state; sign places the compound relative to the elements.

    - slug: apchem-u06-w22-q13
      type: multi_select
      topic_code: "2.2"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about bond enthalpies are correct? Select all that apply.
      options:
