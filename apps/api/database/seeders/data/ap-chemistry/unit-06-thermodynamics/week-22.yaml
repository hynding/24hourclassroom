    # ---- Short answer
    - slug: apchem-u06-w22-q21
      type: short_answer
      topic_code: "6.7"
      source: "general knowledge"
      points: 3
      prompt: |
        The combustion of hydrogen, 2 H₂(g) + O₂(g) → 2 H₂O(g), has an accepted ΔH° of −483.6 kJ.
        (a) Estimate ΔH for this reaction from bond enthalpies (H–H 436, O=O 495, O–H 467 kJ/mol).
        (b) Explain why the estimate differs from the accepted value, naming the specific limitation of the method.
        (c) Explain why ΔH°f values give −571.6 kJ when the product is liquid water, and why that value is more exothermic.
      answer: |
        (a) Broken: 2 H–H (872) + 1 O=O (495) = 1,367 kJ; formed: 4 O–H (4 × 467 = 1,868 kJ); ΔH ≈ 1,367 − 1,868 = −501 kJ.
        (b) The O–H value of 467 kJ/mol is an average over many compounds (water, alcohols, acids); the actual bond enthalpies in H₂O differ from the average, so the estimate is off by about 4%. Bond-enthalpy calculations are approximate for any bond that is not in a diatomic molecule.
        (c) Σ products − Σ reactants with H₂O(l) (−285.8 kJ/mol) gives 2(−285.8) = −571.6 kJ. Liquid water is lower in enthalpy than the gas by the enthalpy of condensation (44.0 kJ/mol at 25 °C); when the product condenses, that extra heat is released, so the reaction to liquid water is more exothermic by 2 × 44.0 = 88.0 kJ.
      explanation: |
        Three points, one per part.

        (a) 1 pt: bonds broken 1,367 kJ, formed 1,868 kJ, ΔH ≈ −501 kJ (accept −500 kJ).
        (b) 1 pt: average bond enthalpies (O–H) are not exact for a specific molecule; the method is an estimate.
        (c) 1 pt: −571.6 kJ from 2 × ΔH°f(H₂O(l)); liquid water is lower in enthalpy than vapour by ΔH_vap, so condensing the product releases additional heat.

    - slug: apchem-u06-w22-q22
      type: short_answer
      topic_code: "6.4"
      source: "general knowledge"
      points: 3
      prompt: |
        The enthalpy of formation of magnesium oxide, Mg(s) + ½ O₂(g) → MgO(s), cannot be measured directly in a coffee-cup calorimeter. A student instead measures two reactions in dilute HCl:

        (1) Mg(s) + 2 H⁺(aq) → Mg²⁺(aq) + H₂(g), ΔH₁ = −467 kJ/mol
        (2) MgO(s) + 2 H⁺(aq) → Mg²⁺(aq) + H₂O(l), ΔH₂ = −151 kJ/mol

        and uses the known value (3) H₂(g) + ½ O₂(g) → H₂O(l), ΔH₃ = −285.8 kJ/mol.
        (a) Explain why the formation reaction cannot be measured directly in a coffee-cup calorimeter.
        (b) Show how to combine equations (1), (2) and (3) to obtain the formation reaction of MgO.
        (c) Calculate ΔH°f of MgO(s).
      answer: |
        (a) Burning magnesium in oxygen is a high-temperature combustion of a solid, not an aqueous reaction; it cannot be carried out in a foam cup at a measurable, contained temperature change, and the heat would be lost as light and to the air.
        (b) Keep (1): Mg + 2 H⁺ → Mg²⁺ + H₂. Reverse (2): Mg²⁺ + H₂O → MgO + 2 H⁺, ΔH = +151. Keep (3): H₂ + ½ O₂ → H₂O. Adding, the 2 H⁺, Mg²⁺, H₂ and H₂O cancel, leaving Mg(s) + ½ O₂(g) → MgO(s).
        (c) ΔH°f = ΔH₁ − ΔH₂ + ΔH₃ = (−467) + 151 + (−285.8) = −602 kJ/mol (accepted value −601.6 kJ/mol).
      explanation: |
        Three points, one per part.

        (a) 1 pt: the direct combustion cannot be run in an aqueous calorimeter (solid burning at high temperature, heat lost as light/air); an indirect route is needed.
        (b) 1 pt: equation (2) reversed, (1) and (3) kept, intermediates cancelled to give the formation equation.
        (c) 1 pt: −467 + 151 − 285.8 = −602 kJ/mol (accept −601 to −603).

    # ---- Long answer
    - slug: apchem-u06-w22-q23
      type: long_answer
      topic_code: "6.9"
      source: "NIST Chemistry WebBook (standard enthalpies of formation, rounded)"
      points: 6
      stimulus: |
        Data at 25 °C:

        | Substance | ΔH°f (kJ/mol) |
        |---|---|
        | C₂H₆(g) | −84.7 |
        | C₂H₄(g) | +52.5 |
        | CO₂(g) | −393.5 |
        | H₂O(l) | −285.8 |
        | H₂O(g) | −241.8 |

        Average bond enthalpies (kJ/mol): C–H 413, C–C 347, C=C 614, H–H 436.
      prompt: |
        Consider the hydrogenation of ethene: C₂H₄(g) + H₂(g) → C₂H₆(g).
        (a) Calculate ΔH° for the hydrogenation using the enthalpies of formation.
        (b) Estimate ΔH for the same reaction using bond enthalpies and compare the two results.
        (c) Write the balanced equation for the complete combustion of ethane to CO₂(g) and H₂O(l), and calculate its ΔH° from the table.
        (d) Explain why ΔH°f(C₂H₄) is positive while ΔH°f(C₂H₆) is negative, in terms of the stability of each compound relative to its elements.
        (e) Explain how Hess's law could be used to obtain ΔH for the hydrogenation from the combustion enthalpies of ethene, ethane and hydrogen, stating which equations would be reversed.
        (f) If the combustion of ethane were written with H₂O(g) as the product, state whether ΔH° would be more or less negative and by how much.
      answer: |
        (a) ΔH° = ΔH°f(C₂H₆) − [ΔH°f(C₂H₄) + ΔH°f(H₂)] = (−84.7) − (+52.5 + 0) = −137.2 kJ.
        (b) Broken: C=C (614) + H–H (436) = 1,050 kJ; formed: C–C (347) + 2 C–H (826) = 1,173 kJ; ΔH ≈ −123 kJ. The estimate is about 10% less exothermic than the exact −137.2 kJ because bond enthalpies are averages.
        (c) C₂H₆(g) + 7/2 O₂(g) → 2 CO₂(g) + 3 H₂O(l) (or 2 C₂H₆ + 7 O₂ → 4 CO₂ + 6 H₂O). ΔH° = [2(−393.5) + 3(−285.8)] − (−84.7) = (−787.0 − 857.4) + 84.7 = −1,559.7 kJ per mole of ethane.
        (d) A positive ΔH°f means ethene lies above graphite and hydrogen in enthalpy: energy is stored in it, and it is thermodynamically less stable than its elements. Ethane's negative value places it below its elements: forming it releases energy. The difference is the energy released when the C=C bond and H₂ are converted to C–C and two C–H bonds.
        (e) Write the combustions: C₂H₄ + 3 O₂ → 2 CO₂ + 2 H₂O (keep); H₂ + ½ O₂ → H₂O (keep); C₂H₆ + 7/2 O₂ → 2 CO₂ + 3 H₂O (reverse, so that C₂H₆ appears as a product). Adding the three cancels the CO₂, H₂O and O₂ and leaves C₂H₄ + H₂ → C₂H₆; ΔH = ΔH(comb C₂H₄) + ΔH(comb H₂) − ΔH(comb C₂H₆).
        (f) Less negative by 3 × 44.0 = 132.0 kJ (ΔH° = −1,427.7 kJ), because gaseous water is 44.0 kJ/mol higher in enthalpy than liquid water and the heat of condensation is not released.
      explanation: |
        Six points.

        (a) 1 pt: −137.2 kJ from Σ products − Σ reactants with ΔH°f(H₂) = 0.
        (b) 1 pt: bond-enthalpy estimate −123 kJ (accept −120 to −125) with a statement that it is close but approximate because values are averages.
        (c) 1 pt: balanced combustion equation and ΔH° = −1,559.7 kJ/mol (accept −1,560 kJ/mol; −3,119 kJ for the doubled equation if stated).
        (d) 1 pt: positive ΔH°f means the compound is higher in enthalpy (less stable) than its elements; negative means lower (more stable).
        (e) 1 pt: the ethane combustion is reversed and added to the ethene and hydrogen combustions; intermediates cancel.
        (f) 1 pt: less negative by 3 × 44.0 = 132 kJ because H₂O(g) is higher in enthalpy than H₂O(l).
