      prompt: |
        By definition, the standard enthalpy of formation of an element in its standard state, such as N₂(g) or C(s, graphite), is ____ kJ/mol.
      answer: ["0", "zero", "0 kJ/mol", "0.0"]
      explanation: |
        The formation reaction of an element in its standard state is the element turning into itself, with no change, so ΔH°f = 0. This convention makes the table of ΔH°f values a common reference level from which any reaction enthalpy can be computed.

    - slug: apchem-u06-w22-q17
      type: fill_blank
      topic_code: "6.9"
      source: "general knowledge"
      points: 1
      prompt: |
        Hess's law follows from the fact that enthalpy is a ____ function: its change depends only on the initial and final states, not on the path between them.
      answer: ["state", "state function", "a state"]
      explanation: |
        A state function's change is path-independent. Heat and work individually are not state functions, but at constant pressure the heat equals ΔH, which is. That is why ΔH values for steps can be added to give the ΔH of the overall change.

