    # ---- True/false
    - slug: apchem-u06-w22-q14
      type: true_false
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: if ΔH for 2 SO₂(g) + O₂(g) → 2 SO₃(g) is −198 kJ, then ΔH for 2 SO₃(g) → 2 SO₂(g) + O₂(g) is +198 kJ.
      answer: true
      explanation: |
        True. Reversing a reaction reverses the sign of its enthalpy change, because enthalpy is a state function: the path back returns exactly the energy released on the way forward. This rule, together with scaling, is all that Hess's law requires.

    - slug: apchem-u06-w22-q15
      type: true_false
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: because the N≡N bond enthalpy (945 kJ/mol) is about three times the N–N single-bond enthalpy (160 kJ/mol), each of the three bonds in N₂ is equally strong.
      answer: false
      explanation: |
        False. A triple bond consists of one sigma bond and two pi bonds, and they are not equivalent; the comparison is also complicated because the N–N single bond is unusually weak (lone-pair repulsion). The useful conclusion is only that bond enthalpy rises steeply with bond order, which is why N₂ is so hard to break.

    # ---- Fill in the blank
    - slug: apchem-u06-w22-q16
