        - "A C≡C triple bond has a larger bond enthalpy than a C=C double bond, which in turn exceeds a C–C single bond."
        - "The bond enthalpy of H–H is an average over many compounds."
        - "Bond enthalpies can be used directly for reactions involving ionic solids without correction."
        - "A reaction in which the bonds formed are stronger overall than the bonds broken is exothermic."
      option_explanations:
        - |
          Correct. Separating bonded atoms requires energy input against their attraction.
        - |
          Correct. Higher bond order means more shared electron pairs, a shorter bond and a deeper potential-energy well: 347, 614, 839 kJ/mol.
        - |
