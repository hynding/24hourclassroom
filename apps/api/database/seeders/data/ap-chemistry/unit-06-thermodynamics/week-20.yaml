week: 20
unit: 6
title: "Energy, Heat and Thermal Equilibrium"
topics: ["6.1", "6.2", "6.3"]
guide: guides/week-20.md
guide_description: |
  Endothermic and exothermic processes from the system's point of view, explained by bonds and attractions
  broken and formed; energy diagrams with ΔH as the gap between levels and the activation barrier between them;
  heat flow from hot to cold until thermal equilibrium, q = mcΔT, and energy conservation (q lost + q gained = 0)
  with worked examples of final-temperature and specific-heat calculations.
flashcards_description: |
  28 cards on system and surroundings, the sign of q and ΔH, energy diagrams, specific heat, thermal
  equilibrium and the particle-level reasons behind each.

flashcards:
  - front: System versus surroundings in thermochemistry
    back: |
      The system is the part being studied (the reacting substances); the surroundings are everything else: solvent, container, thermometer, air. Heat is counted from the system's point of view.
    topic_code: "6.1"
  - front: Sign of q and ΔH for an endothermic process
    back: |
      q > 0 and ΔH > 0: the system absorbs heat from the surroundings, which cool. Examples: melting, boiling, dissolving NH₄NO₃, decomposing CaCO₃, photosynthesis.
    topic_code: "6.1"
  - front: Sign of q and ΔH for an exothermic process
    back: |
      q < 0 and ΔH < 0: the system releases heat to the surroundings, which warm. Examples: combustion, neutralisation, freezing, condensation, dissolving NaOH.
    topic_code: "6.1"
  - front: Bond breaking and bond forming → which costs and which releases energy
    back: |
      Breaking a bond always requires energy (atoms are pulled apart against their attraction). Forming a bond always releases energy. ΔH is the net: cost of breaking minus release from forming.
    topic_code: "6.1"
  - front: Why combustion is exothermic in bond terms
    back: |
      The C–H and O=O bonds broken are weaker in total than the C=O and O–H bonds formed, so more energy is released in forming products than is spent breaking reactants; the surplus leaves as heat.
    topic_code: "6.1"
  - front: Phase changes classified as endothermic or exothermic
    back: |
      Melting, boiling, sublimation: endothermic (attractions pulled apart). Freezing, condensation, deposition: exothermic (attractions form). No bonds change, only intermolecular attractions.
    topic_code: "6.1"
  - front: Why dissolving can be either endothermic or exothermic
    back: |
      Dissolving separates solute particles and solvent molecules (costs energy) and forms solute–solvent attractions (releases energy). NH₄NO₃ cools the water (cost wins); NaOH warms it (release wins).
    topic_code: "6.1"
  - front: Cold pack feels cold → system or surroundings?
    back: |
      Your hand is part of the surroundings. The pack's contents (the system) absorb heat from your hand, so the dissolving is endothermic for the system; the cold you feel is the surroundings losing heat.
    topic_code: "6.1"
  - front: Energy diagram → what the two levels and the gap mean
    back: |
      Horizontal levels show the potential energy of reactants and of products; the vertical gap is ΔH. Products lower: exothermic (ΔH < 0). Products higher: endothermic (ΔH > 0).
    topic_code: "6.2"
  - front: Energy diagram → the barrier between the levels
    back: |
      The activation energy is the climb from the reactant level to the top of the barrier. It controls the rate; ΔH controls the heat. Two reactions with equal ΔH can have very different barriers.
    topic_code: "6.2"
  - front: Why methane and oxygen can sit mixed indefinitely at room temperature
    back: |
      The reaction is strongly exothermic (ΔH = −890 kJ/mol) but has a large activation energy; almost no collisions at 25 °C carry enough energy. A spark supplies the activation energy to start it.
    topic_code: "6.2"
  - front: Energy diagram for melting ice
    back: |
      Liquid water sits 6.01 kJ/mol above ice; the gap is the enthalpy of fusion. No barrier worth drawing: the diagram just shows the solid is the lower-energy state and melting is endothermic.
    topic_code: "6.2"
  - front: Heat versus temperature → the distinction
    back: |
      Heat is energy transferred because of a temperature difference (joules). Temperature measures the average kinetic energy of particles. A warm bathtub holds more heat than a cup of boiling water although its temperature is lower.
    topic_code: "6.3"
  - front: Direction of spontaneous heat flow and why
    back: |
      From hotter to colder. At the boundary, collisions transfer kinetic energy from faster (hotter) particles to slower ones more often than the reverse, giving a net flow until the average kinetic energies, that is the temperatures, are equal.
    topic_code: "6.3"
  - front: Thermal equilibrium → definition
    back: |
      Two objects in contact have reached thermal equilibrium when they have the same temperature and there is no further net heat flow between them.
    topic_code: "6.3"
  - front: q = m c ΔT → each symbol and its units
    back: |
      q heat in J; m mass in g; c specific heat capacity in J/(g·°C); ΔT = T_final − T_initial in °C (or K, same size). A cooling object has negative ΔT and negative q.
    topic_code: "6.3"
  - front: Specific heat capacity of liquid water
    back: |
      4.184 J/(g·°C), unusually high because hydrogen bonds must be stretched and bent before molecules speed up. It is why water moderates climate and makes a good coolant.
    topic_code: "6.3"
  - front: Energy conservation when a hot object meets a cold one
    back: |
      q_hot + q_cold = 0, or −q_hot = q_cold: the heat lost by the hot object equals the heat gained by the cold one. The two q values have opposite signs; never set them equal without the sign.
    topic_code: "6.3"
  - front: Final temperature of a mixture → which object it ends nearer to
    back: |
      Nearer to the object with the larger heat capacity (m × c). Water's large c means a hot metal dropped into water barely warms the water; equal masses of the same substance end at the plain average.
    topic_code: "6.3"
  - front: "Procedure: finding the specific heat of a metal by mixing"
    back: |
      Heat the metal to a known T, drop it into water of known mass and T, record the final T. q_water = m c ΔT (positive). Then −q_water = m_metal × c_metal × ΔT_metal; solve for c_metal.
    topic_code: "6.3"
  - front: "Worked value: 50.0 g Cu at 95.0 °C into 100.0 g water at 20.0 °C"
    back: |
      19.25(T − 95.0) + 418.4(T − 20.0) = 0 gives T = 23.3 °C. The water's heat capacity (418 J/°C) is twenty times the copper's (19 J/°C), so the water hardly moves.
    topic_code: "6.3"
  - front: Mixing two samples of water → final temperature shortcut
    back: |
      c cancels, so T_final is the mass-weighted average: (m₁T₁ + m₂T₂)/(m₁ + m₂). Example: 25.0 g at 80.0 °C with 75.0 g at 10.0 °C gives 27.5 °C.
    topic_code: "6.3"
  - front: Why a large specific heat means a small temperature rise
    back: |
      The substance has more ways to store energy (bending and stretching hydrogen bonds in water, for instance) besides speeding its particles up, so a given quantity of heat raises the average kinetic energy less.
    topic_code: "6.3"
  - front: Why an endothermic reaction makes the beaker feel cold
    back: |
      The system takes kinetic energy from the solvent and the glass to pay for the net bond-breaking; the surroundings' average kinetic energy, and so their temperature, falls.
    topic_code: "6.1"
  - front: Temperature in kinetic molecular theory (spiral 3.5)
    back: |
      Kelvin temperature is proportional to the average kinetic energy of the particles. Two gases at the same temperature have the same average kinetic energy, so the lighter one's molecules move faster.
    topic_code: "3.5"
  - front: ΔH on a reaction energy profile (spiral 5.6)
    back: |
      The difference between the product valley and the reactant valley. The peak height above the reactants is Ea, which says nothing about ΔH; the two are read from different parts of the same drawing.
    topic_code: "5.6"
  - front: Bond energy as potential energy (spiral 2.2)
    back: |
      The bond energy is the depth of the potential-energy well at the equilibrium bond length. Climbing out of the well (breaking the bond) costs that energy; falling into it (forming the bond) releases it.
    topic_code: "2.2"
  - front: Hydrogen bonding and water's thermal properties (spiral 3.1)
    back: |
      Each water molecule can form up to four hydrogen bonds. Stretching and breaking them absorbs energy, giving water its high specific heat, high heat of vaporisation and high boiling point for its size.
    topic_code: "3.1"

quiz:
  description: |
    22 questions · about 40 minutes · topics 6.1–6.3 (endothermic and exothermic processes, energy diagrams,
    heat transfer and thermal equilibrium with q = mcΔT), with review of kinetic molecular theory, bond
    potential energy, intermolecular forces and energy profiles from earlier units. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: hot metal into water (6.3)
    - slug: apchem-u06-w20-q01
      type: multiple_choice
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        A 75.0 g piece of iron is heated to 150.0 °C and dropped into an insulated cup containing 200.0 g of water at 22.0 °C. The water is stirred and its temperature rises to a steady 27.0 °C. Specific heat of water: 4.184 J/(g·°C).
      prompt: |
        Which statement about the energy transfer is correct?
      options:
        - "Heat flows from the iron to the water until both are at 27.0 °C; q for the iron is negative and q for the water is positive."
        - "Heat flows from the water to the iron because the water has the larger mass."
        - "The iron and the water exchange equal and opposite amounts of heat, so both q values are positive."
        - "Heat flows until the iron reaches 22.0 °C, the water's original temperature."
      option_explanations:
        - |
          Correct. Heat flows from the hotter object to the colder one until thermal equilibrium at a common temperature; the iron loses heat (q < 0) and the water gains the same quantity (q > 0).
        - |
          The direction of heat flow is set by temperature, not mass: the hotter iron loses heat to the cooler water.
        - |
          The quantities are equal in magnitude but opposite in sign; heat lost is negative for the iron and heat gained is positive for the water.
        - |
          The flow stops when both objects share one temperature, 27.0 °C, which lies between the two starting temperatures.
      answer: 0
      explanation: |
        Practice 6. Hot to cold, until the temperatures match; q_iron + q_water = 0.

    - slug: apchem-u06-w20-q02
      type: multiple_choice
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        A 75.0 g piece of iron is heated to 150.0 °C and dropped into an insulated cup containing 200.0 g of water at 22.0 °C. The water is stirred and its temperature rises to a steady 27.0 °C. Specific heat of water: 4.184 J/(g·°C).
      prompt: |
        The iron's temperature falls by 123.0 °C while the water's rises by only 5.0 °C. Which is the best explanation?
      options:
        - "The iron lost more heat than the water gained, because some escaped to the air."
        - "Iron atoms are heavier than water molecules, so they cool faster."
        - "The water has a much larger heat capacity (mass × specific heat), so the same quantity of heat changes its temperature far less."
        - "Water cannot be heated above 27.0 °C by a solid at 150.0 °C."
      option_explanations:
        - |
          In an insulated cup the heat lost by the iron equals the heat gained by the water; the different temperature changes are not evidence of loss.
        - |
          Atomic mass is not the deciding factor; the specific heat of iron (about 0.45 J/(g·°C)) is lower than water's, and the water's mass is larger.
        - |
          Correct. The water's heat capacity is 200.0 × 4.184 = 837 J/°C while the iron's is about 75.0 × 0.45 = 34 J/°C, so the same heat moves the water's temperature about 25 times less.
        - |
          There is no such limit; a larger piece of iron or less water would give a higher final temperature.
      answer: 2
      explanation: |
        Practice 6. ΔT = q/(m c): large m c, small ΔT.

    - slug: apchem-u06-w20-q03
      type: numeric
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        A 75.0 g piece of iron is heated to 150.0 °C and dropped into an insulated cup containing 200.0 g of water at 22.0 °C. The water is stirred and its temperature rises to a steady 27.0 °C. Specific heat of water: 4.184 J/(g·°C).
      prompt: |
        Calculate the specific heat capacity of iron from these data. Give your answer in J/(g·°C) to two decimal places.
      answer: { value: 0.45, tolerance: 0.01 }
      explanation: |
        q_water = 200.0 × 4.184 × (27.0 − 22.0) = 4,184 J. The iron loses the same quantity: −4,184 = 75.0 × c × (27.0 − 150.0) = 75.0 × c × (−123.0), so c = 4,184/(75.0 × 123.0) = 4,184/9,225 = 0.454 J/(g·°C), close to the accepted 0.449 J/(g·°C) for iron.

    # ---- Stand-alone multiple choice
    - slug: apchem-u06-w20-q04
      type: multiple_choice
      topic_code: "6.1"
      source: "general knowledge"
      points: 1
      prompt: |
        When solid ammonium nitrate dissolves in water in a beaker, the beaker becomes cold to the touch. Which statement is correct?
      options:
        - "The process is exothermic because the beaker loses heat."
        - "The process is endothermic: the dissolving system absorbs heat from the water and the beaker, so ΔH is positive."
        - "The process is endothermic because the ammonium nitrate releases heat to the water."
        - "The process is exothermic because dissolving always forms new attractions."
      option_explanations:
        - |
          The beaker is part of the surroundings; its losing heat means the system gained it, which is endothermic, not exothermic.
        - |
          Correct. The system (dissolving NH₄NO₃) takes in heat from its surroundings, cooling them; from the system's point of view q > 0 and ΔH > 0.
        - |
          A system that released heat would warm the water; this one cools it, so it absorbs heat.
        - |
          Dissolving forms solute–solvent attractions but also breaks solute–solute and solvent–solvent attractions; for NH₄NO₃ the cost exceeds the release.
      answer: 1
      explanation: |
        Practice 6. Surroundings cool, so the system absorbed heat: endothermic.

    - slug: apchem-u06-w20-q05
      type: multiple_choice
      topic_code: "6.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement correctly describes the energy changes in bond breaking and bond forming?
      options:
        - "Breaking bonds releases energy; forming bonds absorbs energy."
        - "Both breaking and forming bonds release energy in an exothermic reaction."
        - "Breaking bonds absorbs energy in endothermic reactions only."
        - "Breaking bonds always absorbs energy; forming bonds always releases energy, and the sign of ΔH depends on which total is larger."
      option_explanations:
        - |
          This is backwards: atoms attract one another in a bond, so separating them costs energy and bringing them together releases it.
        - |
          Breaking a bond always costs energy, whatever the overall sign of ΔH; a reaction is exothermic because the forming releases more than the breaking costs.
        - |
          Bond breaking absorbs energy in every reaction; the reaction type only decides whether the forming releases more or less than that.
        - |
          Correct. ΔH = (energy to break bonds) − (energy released forming bonds); a negative result is exothermic, a positive one endothermic.
      answer: 3
      explanation: |
        Practice 6. Breaking costs, forming pays; ΔH is the difference.

    - slug: apchem-u06-w20-q06
      type: multiple_choice
      topic_code: "6.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Graph description: an energy diagram shows the reactants at a potential energy of +15 kJ/mol, a barrier peaking at +85 kJ/mol, and the products at −45 kJ/mol. Which statement is correct?
      options:
        - "ΔH = +70 kJ/mol and the reaction is endothermic."
        - "ΔH = −45 kJ/mol and Ea = 85 kJ/mol."
        - "ΔH = −60 kJ/mol and Ea = 70 kJ/mol."
        - "ΔH = −60 kJ/mol and Ea = 130 kJ/mol."
      option_explanations:
        - |
          70 kJ/mol is the barrier height above the reactants (Ea), and the products lie below the reactants, so the reaction is exothermic.
        - |
          Both numbers are read from zero on the axis instead of from the reactant level; ΔH and Ea are differences, not absolute values.
        - |
          Correct. ΔH = (−45) − (+15) = −60 kJ/mol, exothermic; Ea = 85 − 15 = 70 kJ/mol.
        - |
          130 kJ/mol is the reverse activation energy (from the products at −45 to the peak at +85), not the forward one.
      answer: 2
      explanation: |
        Practice 4. Differences between levels, measured from the reactants.

    - slug: apchem-u06-w20-q07
      type: multiple_choice
      topic_code: "5.6"
      source: "general knowledge"
      points: 1
      prompt: |
        A mixture of hydrogen and oxygen gases can be stored at room temperature for years, yet when a spark is applied the gases react explosively to form water, releasing 286 kJ per mole of water formed. Which statement best explains both observations?
      options:
        - "The reaction is highly exothermic but has a large activation energy; the spark supplies the energy to start it, after which the heat released sustains it."
        - "The reaction is endothermic until the spark makes it exothermic."
        - "At room temperature the reaction is at equilibrium, and the spark shifts the equilibrium."
        - "Hydrogen and oxygen do not collide at room temperature."
      option_explanations:
        - |
          Correct. ΔH is strongly negative, but the H–H and O=O bonds must be stretched to reach the transition state, a high barrier that almost no room-temperature collisions clear; once started, the heat released keeps supplying the activation energy.
        - |
          ΔH is a fixed property of the reaction; it cannot change sign because of a spark.
        - |
          The mixture is not at equilibrium; it is kinetically trapped far from it because the rate is negligible.
        - |
          Gas molecules collide billions of times a second; the collisions simply lack the energy to react.
      answer: 0
      explanation: |
        Practice 6 (review of 5.6). Ea and ΔH are independent: thermodynamically favourable, kinetically slow.

    - slug: apchem-u06-w20-q08
      type: multiple_choice
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Equal masses of water (c = 4.184 J/(g·°C)) and ethanol (c = 2.44 J/(g·°C)) absorb the same quantity of heat. Which statement is correct?
      options:
        - "Both samples show the same temperature rise because they absorbed the same heat."
        - "The water's temperature rises more because it has the larger specific heat."
        - "The ethanol's temperature rises more because its molecules are heavier."
        - "The ethanol's temperature rises about 1.7 times as much as the water's, because ΔT = q/(mc) and its specific heat is smaller."
      option_explanations:
        - |
          Equal heat produces equal temperature rises only when the heat capacities are equal; these differ by a factor of 1.7.
        - |
          A larger specific heat means a smaller temperature rise for the same heat, not a larger one.
        - |
          Molecular mass is not the relevant quantity; the specific heat per gram is, and ethanol's is lower.
        - |
          Correct. ΔT = q/(m c), so with equal q and m the sample with the smaller c warms more: 4.184/2.44 ≈ 1.7 times as much.
      answer: 3
      explanation: |
        Practice 5. Temperature change is inversely proportional to specific heat.

    - slug: apchem-u06-w20-q09
      type: multiple_choice
      topic_code: "6.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which process is exothermic?
      options:
        - "Liquid bromine evaporating in an open dish"
        - "Water vapour condensing on a cold mirror"
        - "Solid iodine subliming to a purple vapour"
        - "Ice melting in a glass of lemonade"
      option_explanations:
        - |
          Evaporation separates molecules against their intermolecular attractions, which costs energy: endothermic.
        - |
          Correct. Condensation lets water molecules form hydrogen bonds with one another; forming attractions releases energy to the surroundings, so it is exothermic (the mirror warms slightly).
        - |
          Sublimation pulls I₂ molecules apart from the solid into the gas, absorbing energy: endothermic.
        - |
          Melting breaks some of the hydrogen bonds holding the ice lattice together and absorbs heat from the lemonade: endothermic.
      answer: 1
      explanation: |
        Practice 1. Attractions forming (condensing, freezing, depositing) release heat.

    - slug: apchem-u06-w20-q10
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Two sealed flasks at the same temperature contain helium (molar mass 4.0 g/mol) and argon (molar mass 39.9 g/mol). Which statement is correct?
      options:
        - "The argon atoms have the greater average kinetic energy because they are heavier."
        - "The helium atoms have the greater average kinetic energy because they move faster."
        - "The two gases have the same average kinetic energy, and the helium atoms have the greater average speed."
        - "The two gases have the same average speed."
      option_explanations:
        - |
          Average kinetic energy depends only on temperature, not on mass; the heavier argon simply moves more slowly to have the same kinetic energy.
        - |
          Helium does move faster, but faster motion of a lighter particle gives the same average kinetic energy at the same temperature.
        - |
          Correct. Kelvin temperature is proportional to the average kinetic energy of the particles; at equal temperature the lighter helium must move faster to match argon's kinetic energy.
        - |
          With equal kinetic energy and different masses the speeds must differ; helium's average speed is about three times argon's.
      answer: 2
      explanation: |
        Practice 4 (review of 3.5). Temperature measures average kinetic energy, the quantity that heat flow equalises.

    - slug: apchem-u06-w20-q11
      type: multiple_choice
      topic_code: "5.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Two exothermic reactions, P and Q, have the same ΔH of −80 kJ/mol. Reaction P has an activation energy of 20 kJ/mol and reaction Q has an activation energy of 150 kJ/mol. At 25 °C, which statement is correct?
      options:
        - "Both reactions release heat at the same rate because their ΔH values are equal."
        - "Reaction P is faster, and the reverse of reaction Q has an activation energy of 230 kJ/mol."
        - "Reaction Q is faster because its larger activation energy stores more energy."
        - "Reaction Q releases more heat per mole than reaction P."
      option_explanations:
        - |
          The rate of heat release depends on the rate of reaction, which depends on Ea, and the two activation energies differ by 130 kJ/mol.
        - |
          Correct. The lower barrier makes P far faster; for Q, Ea(reverse) = Ea(forward) − ΔH = 150 − (−80) = 230 kJ/mol.
        - |
          A larger activation energy slows a reaction; it is a barrier to be crossed, not stored energy.
        - |
          Both release 80 kJ per mole as written; ΔH is identical.
      answer: 1
      explanation: |
        Practice 5 (review of 5.6). Same thermodynamics, different kinetics.

    # ---- Select all
    - slug: apchem-u06-w20-q12
      type: multi_select
      topic_code: "6.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following processes are exothermic? Select all that apply.
      options:
        - "The combustion of propane in a gas grill"
        - "The freezing of water in an ice tray"
        - "The thermal decomposition of calcium carbonate to lime and carbon dioxide"
        - "The neutralisation of hydrochloric acid by sodium hydroxide solution"
        - "The evaporation of sweat from skin"
      option_explanations:
        - |
          Correct. Combustion forms strong C=O and O–H bonds and releases far more energy than it costs to break the C–H, C–C and O=O bonds.
        - |
          Correct. Freezing lets water molecules form a complete hydrogen-bonded lattice; forming attractions releases heat (which is why orchards are sprayed with water before a frost).
        - |
          Decomposing CaCO₃ requires strong heating; the system absorbs energy, so the process is endothermic.
        - |
          Correct. Forming O–H bonds in water from H⁺ and OH⁻ releases about 57 kJ per mole; the solution warms.
        - |
          Evaporation pulls molecules out of the liquid against hydrogen bonds; it absorbs heat from the skin, which is why sweating cools you: endothermic.
      answer: [0, 1, 3]
      explanation: |
        Practice 1. Combustion, neutralisation, freezing and condensing release heat; decomposition and evaporation absorb it.

    - slug: apchem-u06-w20-q13
      type: multi_select
      topic_code: "3.5"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        A hot copper block is placed in contact with a cold aluminium block inside an insulated box. Which statements correctly describe what happens at the particle level and overall? Select all that apply.
      options:
        - "Collisions at the interface transfer kinetic energy from the faster-vibrating copper atoms to the slower aluminium atoms more often than the reverse."
        - "Heat flows until the two blocks have the same average kinetic energy per particle, that is, the same temperature."
        - "The heat lost by the copper equals the heat gained by the aluminium."
        - "The final temperature is exactly halfway between the two starting temperatures."
        - "Heat continues to flow from copper to aluminium after they reach the same temperature because copper has the higher mass."
      option_explanations:
        - |
          Correct. Energy transfer at the boundary is by collisions, and on average energy moves from the more energetic particles to the less energetic ones.
        - |
          Correct. Thermal equilibrium means equal temperatures, and temperature measures the average kinetic energy per particle.
        - |
          Correct. In an insulated box energy is conserved: q_copper + q_aluminium = 0.
        - |
          The final temperature is nearer the block with the larger heat capacity (mass × specific heat); it is the midpoint only if the heat capacities happen to be equal.
        - |
          Net heat flow stops at equal temperatures; mass affects how far each temperature moves, not whether flow continues.
      answer: [0, 1, 2]
      explanation: |
        Practice 6 (review of 3.5). Kinetic molecular theory explains both the direction and the end point of heat flow.

    # ---- True/false
    - slug: apchem-u06-w20-q14
      type: true_false
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: when heat flows from a hot object to a cold one, it flows because the hot object's particles have, on average, more kinetic energy, not because the hot object contains more total energy.
      answer: true
      explanation: |
        True. Temperature, not total energy, decides the direction of heat flow. A cup of boiling water (high temperature, small total energy) placed in a cool lake (low temperature, enormous total energy) loses heat to the lake, because the lake's molecules have the lower average kinetic energy.

    - slug: apchem-u06-w20-q15
      type: true_false
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: breaking the H–H bond in a hydrogen molecule releases 436 kJ/mol of energy.
      answer: false
      explanation: |
        False. Separating two bonded atoms means climbing out of the potential-energy well that holds them together, which costs energy: 436 kJ must be supplied per mole of H–H bonds broken. It is the formation of H–H bonds from atoms that releases 436 kJ/mol.

