    # ---- Numeric
    - slug: apchem-u06-w20-q18
      type: numeric
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      prompt: |
        How much heat is required to warm 150.0 g of water from 18.0 °C to 42.0 °C? Use c = 4.184 J/(g·°C) and give your answer in kJ to one decimal place.
      answer: { value: 15.1, tolerance: 0.1 }
      explanation: |
        q = m c ΔT = 150.0 g × 4.184 J/(g·°C) × (42.0 − 18.0) °C = 150.0 × 4.184 × 24.0 = 15,062 J = 15.1 kJ. The sign is positive because the water absorbs heat.

    - slug: apchem-u06-w20-q19
      type: numeric
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      prompt: |
        30.0 g of water at 85.0 °C is mixed with 70.0 g of water at 20.0 °C in an insulated cup. Calculate the final temperature. Give your answer in °C to one decimal place.
      answer: { value: 39.5, tolerance: 0.2 }
      explanation: |
        Same substance, so the specific heat cancels: 30.0 (T − 85.0) + 70.0 (T − 20.0) = 0 → 100.0 T = 2,550 + 1,400 = 3,950 → T = 39.5 °C. Equivalently the mass-weighted average (30 × 85 + 70 × 20)/100. The result lies nearer 20.0 °C because the cooler sample has the larger mass.

    # ---- Short answer
    - slug: apchem-u06-w20-q20
      type: short_answer
      topic_code: "6.2"
      source: "general knowledge"
      points: 3
      prompt: |
        An instant cold pack contains solid ammonium nitrate and a pouch of water. When the pouch is broken, the salt dissolves and the pack's temperature drops from 22 °C to about 3 °C.
        (a) Identify the system and the surroundings in this situation and state the sign of ΔH for the dissolving process.
        (b) Sketch (describe in words) an energy diagram for the dissolving process, showing the relative positions of the initial and final states.
        (c) Explain, in terms of the attractions broken and formed, why dissolving ammonium nitrate is endothermic.
      answer: |
        (a) The system is the ammonium nitrate and the water that dissolves it (the dissolving process); the surroundings are the pack's plastic, the air and the person's skin. ΔH is positive, because the surroundings lose heat to the system.
        (b) The final state (NH₄⁺ and NO₃⁻ ions in solution) sits above the initial state (solid NH₄NO₃ plus liquid water) on the potential-energy axis; the vertical gap, pointing upward, is the positive ΔH of solution (about +26 kJ/mol).
        (c) Dissolving breaks the ionic attractions between NH₄⁺ and NO₃⁻ in the crystal and some hydrogen bonds between water molecules, which costs energy; it forms ion–dipole attractions between the ions and water, which releases energy. For ammonium nitrate the energy cost of breaking exceeds the energy released, so the net process absorbs heat.
      explanation: |
        Three points, one per part.

        (a) 1 pt: system = the dissolving salt and water (the process), surroundings = pack, air, hand; ΔH > 0.
        (b) 1 pt: products (dissolved ions) drawn at higher potential energy than reactants (solid plus water); the gap labelled ΔH positive.
        (c) 1 pt: ionic (and some water–water) attractions broken cost more than the ion–dipole attractions formed release, so the net is endothermic.

    - slug: apchem-u06-w20-q21
      type: short_answer
      topic_code: "3.1"
      source: "general knowledge"
      points: 3
      prompt: |
        The specific heat capacity of liquid water is 4.184 J/(g·°C), of ethanol 2.44 J/(g·°C) and of liquid mercury 0.14 J/(g·°C).
        (a) Explain, in terms of intermolecular forces, why water has a higher specific heat capacity than ethanol.
        (b) A student says that mercury's low specific heat means it cannot store much heat. Explain what the value actually means and why mercury was once used in thermometers.
        (c) Equal masses of water and ethanol, both at 20.0 °C, each absorb 1,000 J of heat. Calculate the final temperature of each.
      answer: |
        (a) Each water molecule forms up to four hydrogen bonds (two O–H donors, two lone-pair acceptors), while ethanol, with one O–H group and a nonpolar ethyl tail, forms fewer. Absorbed energy in water goes largely into stretching and bending this extensive hydrogen-bond network before the molecules speed up, so more heat is needed per degree.
        (b) A low specific heat means a small quantity of heat produces a large temperature change per gram; mercury can still store heat, but its temperature responds sensitively, which is exactly what a thermometer needs: a small heat input from the object being measured gives a large, visible expansion.
        (c) Water: ΔT = 1,000/(m × 4.184); ethanol: ΔT = 1,000/(m × 2.44). With, for example, m = 10.0 g: water rises 23.9 °C to 43.9 °C; ethanol rises 41.0 °C to 61.0 °C. In general the ethanol's rise is 4.184/2.44 = 1.71 times the water's. (Any consistent mass is acceptable.)
      explanation: |
        Three points, one per part.

        (a) 1 pt: water's more extensive hydrogen bonding (more H-bonds per molecule) absorbs energy before kinetic energy rises; ethanol's single O–H and nonpolar chain give fewer.
        (b) 1 pt: low c means a large ΔT for a small q (sensitive response), not an inability to hold heat; useful for a thermometer.
        (c) 1 pt: ΔT = q/(mc) applied to both, with the ethanol rising 1.7 times as much as the water; a stated mass with correct arithmetic (e.g. 23.9 °C and 41.0 °C rises for 10.0 g).

    # ---- Long answer
    - slug: apchem-u06-w20-q22
      type: long_answer
      topic_code: "6.3"
      source: "general knowledge"
      points: 6
      stimulus: |
        A student is given a 40.0 g sample of an unknown metal and asked to identify it. The student heats the metal in boiling water to 100.0 °C, then transfers it quickly into a foam cup containing 80.0 g of water at 21.0 °C. The highest temperature reached by the water is 24.6 °C.

        Reference specific heats, J/(g·°C): aluminium 0.897; iron 0.449; copper 0.385; lead 0.129.
      prompt: |
        (a) Calculate the heat gained by the water.
        (b) Calculate the specific heat capacity of the metal and identify it.
        (c) Explain why the water's temperature rose by only 3.6 °C while the metal's fell by 75.4 °C.
        (d) Describe the flow of energy at the particle level from the moment the hot metal enters the water until the temperature stops changing.
        (e) During the transfer from the boiling water to the cup, some heat was lost to the air. State whether this error makes the calculated specific heat too high or too low, and explain.
        (f) The student repeats the experiment with 160.0 g of water instead of 80.0 g. Predict qualitatively how the final temperature changes and whether the calculated specific heat should change.
      answer: |
        (a) q_water = 80.0 × 4.184 × (24.6 − 21.0) = 80.0 × 4.184 × 3.6 = 1,205 J (1.2 kJ).
        (b) −q_water = q_metal: −1,205 = 40.0 × c × (24.6 − 100.0) = 40.0 × c × (−75.4), so c = 1,205/(40.0 × 75.4) = 1,205/3,016 = 0.400 J/(g·°C). Closest to copper (0.385 J/(g·°C)).
        (c) The water's heat capacity (80.0 × 4.184 = 335 J/°C) is much larger than the metal's (40.0 × 0.40 = 16 J/°C), so the same quantity of heat changes the water's temperature about 21 times less.
        (d) The metal's atoms vibrate more vigorously than the water molecules move; collisions at the surface transfer kinetic energy from the metal atoms to the water molecules more often than the reverse, so the metal's average kinetic energy falls and the water's rises; stirring spreads the energy through the water; net transfer stops when both have the same average kinetic energy per particle, that is the same temperature.
        (e) Too low. Heat lost to the air during transfer means the metal delivers less heat to the water than it would have from 100.0 °C, so q_water is smaller than the true heat the metal would release over the assumed 75.4 °C fall; dividing a too-small q by the full ΔT gives a too-small c.
        (f) Doubling the water roughly halves its temperature rise (to about 1.8 °C), so the final temperature is lower (about 22.8 °C). The calculated specific heat should be the same within error, because both q_water and the metal's ΔT change consistently; however, the smaller temperature rise makes the measurement less precise.
      explanation: |
        Six points.

        (a) 1 pt: q = 80.0 × 4.184 × 3.6 = 1,205 J (accept 1,200–1,210 J).
        (b) 1 pt: c = 1,205/(40.0 × 75.4) = 0.40 J/(g·°C) with correct sign handling, identified as copper.
        (c) 1 pt: comparison of heat capacities (m × c) of water and metal; same q gives a much smaller ΔT for the larger heat capacity.
        (d) 1 pt: collisions transfer kinetic energy from faster to slower particles until average kinetic energies (temperatures) are equal.
        (e) 1 pt: too low, because the heat actually delivered to the water is less than the calculation assumes for a 75.4 °C fall.
        (f) 1 pt: smaller temperature rise and lower final temperature; the calculated c unchanged in principle (consistent q and ΔT), with a note on reduced precision.
