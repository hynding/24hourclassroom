week: 21
unit: 6
title: "Calorimetry, Phase Changes and Enthalpy of Reaction"
topics: ["6.4", "6.5", "6.6"]
guide: guides/week-21.md
guide_description: |
  The three-line logic of every calorimetry calculation (heat gained by the solution, heat of reaction with the
  opposite sign, per mole of limiting reactant), coffee-cup and bomb calorimeters and their assumptions, the
  heat of phase changes as potential energy with q = nΔH_fus and q = nΔH_vap, multi-stage heating-curve
  calculations, and ΔH_rxn as a stoichiometric quantity that scales, reverses and depends on the limiting
  reactant. Worked examples: neutralisation, dissolving NH₄NO₃, ice to steam, thermite, limiting reactant.
flashcards_description: |
  28 cards on calorimetry procedure and assumptions, enthalpies of fusion and vaporisation, heating curves and
  thermochemical equations.

flashcards:
  - front: Calorimetry → the three lines of every calculation
    back: |
      1. q_solution = m c ΔT (mass of the whole solution). 2. q_reaction = −q_solution. 3. ΔH = q_reaction ÷ moles of the limiting reactant (or of reaction as written), converted to kJ/mol.
    topic_code: "6.4"
  - front: Coffee-cup calorimeter → what it measures and its assumptions
    back: |
      Constant pressure, so q = ΔH. Assumes no heat exchange with the room, negligible heat capacity of the cup, solution density 1.00 g/mL and c = 4.184 J/(g·°C), and a fast complete reaction.
    topic_code: "6.4"
  - front: Bomb calorimeter → what it is and the equation used
    back: |
      A sealed steel vessel in a water bath for combustion at constant volume. The whole apparatus has a heat capacity C_cal (J/°C or kJ/°C), found by burning a standard; q = C_cal × ΔT.
    topic_code: "6.4"
  - front: Heat capacity C versus specific heat capacity c
    back: |
      C (J/°C) belongs to a particular object: C = m × c for a pure substance. c (J/(g·°C)) belongs to a material. A calorimeter's C includes the water and the hardware.
    topic_code: "6.4"
  - front: Mass to use in q = mcΔT for a dissolving experiment
    back: |
      The mass of the whole solution: water plus the dissolved solute (or both solutions when two are mixed). The solute's mass is not ignored; it is part of what warms or cools.
    topic_code: "6.4"
  - front: "Sign logic: solution temperature rises → ΔH of the reaction?"
    back: |
      The solution gained heat (q_solution > 0), so the reaction released it: q_reaction < 0 and ΔH is negative, exothermic. A falling temperature means an endothermic reaction with positive ΔH.
    topic_code: "6.4"
  - front: Heat of neutralisation of a strong acid by a strong base
    back: |
      About −57 kJ per mole of water formed, the same for HCl, HNO₃ or H₂SO₄ with NaOH or KOH, because the net ionic reaction is always H⁺(aq) + OH⁻(aq) → H₂O(l).
    topic_code: "6.4"
  - front: Effect of heat loss to the room on a measured exothermic ΔH
    back: |
      Some heat escapes instead of warming the solution, so ΔT is too small, q is too small, and the magnitude of the measured ΔH is too small (less negative than the true value).
    topic_code: "6.4"
  - front: Extrapolating a temperature–time graph in calorimetry
    back: |
      The solution starts cooling before mixing is complete, so the true maximum is found by extending the cooling line back to the time of mixing. This corrects for heat loss during the measurement.
    topic_code: "6.4"
  - front: Why temperature stays constant during melting or boiling
    back: |
      The heat added goes into potential energy, separating particles against their attractions, not into kinetic energy. Temperature measures kinetic energy, so it does not change until the phase change is complete.
    topic_code: "6.5"
  - front: Molar enthalpy of fusion of water → value and equation
    back: |
      ΔH_fus = 6.01 kJ/mol (334 J/g). q = n ΔH_fus for melting at 0 °C; the same magnitude is released on freezing. No ΔT in the formula.
    topic_code: "6.5"
  - front: Molar enthalpy of vaporisation of water → value and equation
    back: |
      ΔH_vap = 40.7 kJ/mol (2,260 J/g). q = n ΔH_vap for boiling at 100 °C; condensation releases the same. It is nearly seven times ΔH_fus.
    topic_code: "6.5"
  - front: Why ΔH_vap is much larger than ΔH_fus
    back: |
      Boiling separates the molecules completely, breaking essentially every intermolecular attraction and expanding the volume a thousandfold; melting only loosens the lattice, leaving most attractions in place.
    topic_code: "6.5"
  - front: Heating curve → what the sloped and flat parts mean
    back: |
      Sloped segments: one phase warming, slope = 1/(m c), so a low specific heat gives a steep line. Flat plateaus: a phase change, length proportional to n ΔH. Boiling's plateau is much longer than melting's.
    topic_code: "6.5"
  - front: Specific heats of ice, water and steam
    back: |
      Ice 2.09 J/(g·°C), liquid water 4.184 J/(g·°C), steam 2.01 J/(g·°C). Only the liquid uses 4.184; use the right value for each segment of a heating curve.
    topic_code: "6.5"
  - front: Ice at −10 °C to steam at 100 °C (20.0 g) → the four stages
    back: |
      Warm ice (418 J) + melt (6,671 J) + warm water (8,368 J) + boil (45,177 J) = 60.6 kJ. Boiling is about three quarters of the total.
    topic_code: "6.5"
  - front: Comparing ΔH_vap of water (40.7 kJ/mol) and methane (8.2 kJ/mol)
    back: |
      Water molecules are held by hydrogen bonds, methane only by weak London dispersion forces, so far more energy is needed to separate water molecules into the gas phase.
    topic_code: "3.1"
  - front: Thermochemical equation → what ΔH refers to
    back: |
      The molar amounts in the balanced equation as written. CH₄ + 2 O₂ → CO₂ + 2 H₂O, ΔH = −890 kJ means 890 kJ released per mole of CH₄ (and per 2 mol H₂O formed).
    topic_code: "6.6"
  - front: Writing heat as a term in a chemical equation
    back: |
      Exothermic: heat on the product side, CH₄ + 2 O₂ → CO₂ + 2 H₂O + 890 kJ. Endothermic: heat on the reactant side, N₂ + O₂ + 180 kJ → 2 NO (ΔH = +180 kJ).
    topic_code: "6.6"
  - front: Scaling a thermochemical equation
    back: |
      Multiply the equation by a factor and ΔH by the same factor. Burning 0.250 mol CH₄ (ΔH = −890 kJ/mol) releases 0.250 × 890 = 222 kJ.
    topic_code: "6.6"
  - front: Reversing a thermochemical equation
    back: |
      Change the sign of ΔH. 2 H₂ + O₂ → 2 H₂O(l), ΔH = −572 kJ, so 2 H₂O(l) → 2 H₂ + O₂ has ΔH = +572 kJ.
    topic_code: "6.6"
  - front: "'Per mole of reaction' versus per mole of a substance"
    back: |
      2 H₂ + O₂ → 2 H₂O, ΔH = −572 kJ per mole of reaction as written, which is −286 kJ per mole of H₂ or of H₂O and −572 kJ per mole of O₂. Always say which.
    topic_code: "6.6"
  - front: Heat released with a limiting reactant → procedure
    back: |
      Find the limiting reactant by mole ratio, then heat = (moles of limiting reactant) × (ΔH ÷ its coefficient). 0.40 mol H₂ with 0.30 mol O₂: H₂ limits, heat = 0.40 × 572/2 = 114 kJ.
    topic_code: "6.6"
  - front: Thermite reaction heat per gram of aluminium
    back: |
      2 Al + Fe₂O₃ → Al₂O₃ + 2 Fe, ΔH = −852 kJ, is 426 kJ per mole of Al; 10.0 g Al (0.371 mol) releases 158 kJ.
    topic_code: "6.6"
  - front: Converting a measured q to ΔH per mole → the mole that matters (spiral 4.5)
    back: |
      Divide by the moles of the limiting reactant (or the moles of reaction as written), never the excess reactant. Moles come from mass ÷ molar mass or molarity × litres.
    topic_code: "4.5"
  - front: Heat of solution of NH₄NO₃ from calorimetry → worked numbers
    back: |
      5.00 g in 100.0 g water cools 3.8 °C: q_solution = 105.0 × 4.184 × (−3.8) = −1,669 J, so q_dissolving = +1,669 J for 0.0625 mol: ΔH_solution = +26.7 kJ/mol.
    topic_code: "6.4"
  - front: Condensing steam releases how much heat per mole? → and why burns from steam are severe
    back: |
      40.7 kJ/mol at 100 °C, released into whatever the steam condenses on. Skin receives this latent heat in addition to the heat of cooling the water, which is why steam burns are worse than boiling-water burns.
    topic_code: "6.5"
  - front: Net ionic equation for strong acid–strong base neutralisation (spiral 4.8)
    back: |
      H⁺(aq) + OH⁻(aq) → H₂O(l). The spectator ions (Na⁺, Cl⁻, NO₃⁻, K⁺) do not change, which is why every strong acid–strong base pair gives the same ΔH per mole of water.
    topic_code: "4.8"

quiz:
  description: |
    23 questions · about 45 minutes · topics 6.4–6.6 (calorimetry, energy of phase changes and the enthalpy of
    reaction), with review of intermolecular forces, limiting reactants, neutralisation and heat transfer from
    earlier weeks. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: coffee-cup neutralisation (6.4)
    - slug: apchem-u06-w21-q01
      type: multiple_choice
      topic_code: "6.4"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student mixes 50.0 mL of 2.00 M HCl with 50.0 mL of 2.00 M NaOH, both at 21.5 °C, in a coffee-cup calorimeter. The temperature of the mixture rises to a maximum of 35.1 °C. Assume the solution has a density of 1.00 g/mL and a specific heat of 4.184 J/(g·°C), and that the cup absorbs no heat.
      prompt: |
        Which mass should be used in q = mcΔT to find the heat absorbed by the solution?
      options:
        - "50.0 g, the mass of the acid solution"
        - "3.65 g, the mass of HCl present"
        - "1.80 g, the mass of water formed"
        - "100.0 g, the combined mass of the two solutions"
      option_explanations:
        - |
          Both solutions warm up, not just the acid; the heat is spread through the whole 100.0 mL mixture.
        - |
          The HCl is a solute; it is the entire solution, mostly water, whose temperature rises.
        - |
          The water formed by the reaction is a tiny part of the solution and is already included in its mass.
        - |
          Correct. The whole mixture of 100.0 mL (100.0 g at 1.00 g/mL) absorbs the heat of the reaction and warms by 13.6 °C.
      answer: 3
      explanation: |
        Practice 2. The solution, not the solute or the product, is the thing whose temperature changes.

    - slug: apchem-u06-w21-q02
      type: multiple_choice
      topic_code: "6.4"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student mixes 50.0 mL of 2.00 M HCl with 50.0 mL of 2.00 M NaOH, both at 21.5 °C, in a coffee-cup calorimeter. The temperature of the mixture rises to a maximum of 35.1 °C. Assume the solution has a density of 1.00 g/mL and a specific heat of 4.184 J/(g·°C), and that the cup absorbs no heat.
      prompt: |
        Which statement about the heat of the reaction is correct?
      options:
        - "q_reaction is positive because the temperature rose."
        - "q_reaction is negative and equal in magnitude to the heat absorbed by the solution."
        - "q_reaction is zero because the calorimeter is insulated."
        - "q_reaction is negative and twice the heat absorbed by the solution, because two solutions were mixed."
      option_explanations:
        - |
          A temperature rise means the solution gained heat, so the reaction released it; q_reaction is negative.
        - |
          Correct. Energy is conserved within the insulated cup: q_reaction + q_solution = 0, so the reaction's q is −(100.0 × 4.184 × 13.6) J = −5,690 J.
        - |
          Insulation stops heat leaving the cup; it does not stop the reaction transferring heat to the solution inside it.
        - |
          Mixing two solutions does not double anything; the heat released equals the heat the combined solution absorbed.
      answer: 1
      explanation: |
        Practice 6. q_reaction = −q_solution.

    - slug: apchem-u06-w21-q03
      type: numeric
      topic_code: "6.4"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student mixes 50.0 mL of 2.00 M HCl with 50.0 mL of 2.00 M NaOH, both at 21.5 °C, in a coffee-cup calorimeter. The temperature of the mixture rises to a maximum of 35.1 °C. Assume the solution has a density of 1.00 g/mL and a specific heat of 4.184 J/(g·°C), and that the cup absorbs no heat.
      prompt: |
        Calculate ΔH for the reaction H⁺(aq) + OH⁻(aq) → H₂O(l) from these data. Give your answer in kJ/mol to one decimal place, including the sign.
      answer: { value: -56.9, tolerance: 0.5 }
      explanation: |
        q_solution = 100.0 × 4.184 × (35.1 − 21.5) = 100.0 × 4.184 × 13.6 = 5,690 J, so q_reaction = −5,690 J. Moles of water formed = 0.0500 L × 2.00 M = 0.100 mol (acid and base are equivalent). ΔH = −5,690 J / 0.100 mol = −56,900 J/mol = −56.9 kJ/mol, matching the accepted heat of neutralisation of about −57 kJ/mol.

    # ---- Stand-alone multiple choice
    - slug: apchem-u06-w21-q04
      type: multiple_choice
      topic_code: "6.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Graph description: a heating curve for a pure substance shows temperature rising, then a flat plateau while heat continues to be added, then temperature rising again. Which statement explains the plateau?
      options:
        - "The heat added is increasing the potential energy of the particles by separating them, not their kinetic energy."
        - "The substance has stopped absorbing heat."
        - "The particles' kinetic energy rises but the thermometer cannot register it."
        - "The specific heat of the substance becomes infinite at that temperature."
      option_explanations:
        - |
          Correct. During a phase change the energy goes into overcoming intermolecular attractions (potential energy); average kinetic energy, and therefore temperature, is unchanged until the change is complete.
        - |
          Heat is still being added at the same rate; the horizontal axis keeps increasing along the plateau.
        - |
          Temperature is a direct measure of average kinetic energy; if kinetic energy rose, the temperature would rise.
        - |
          Specific heat is a property of a single phase; the plateau is described by q = nΔH, not by a specific heat at all.
      answer: 0
      explanation: |
        Practice 6. Phase changes are potential-energy events at constant temperature.

    - slug: apchem-u06-w21-q05
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        The molar enthalpy of vaporisation of water (40.7 kJ/mol) is nearly seven times its molar enthalpy of fusion (6.01 kJ/mol). Which explanation is best?
      options:
        - "Water boils at a higher temperature than it melts, and higher temperatures always need more heat."
        - "Steam molecules move much faster than liquid molecules, so more kinetic energy must be supplied."
        - "Vaporisation separates the molecules completely, breaking essentially all the hydrogen bonds, whereas melting only loosens the hydrogen-bonded lattice and leaves most attractions intact."
        - "The specific heat of steam is lower than that of ice."
      option_explanations:
        - |
          The temperature at which a phase change occurs does not by itself set the enthalpy of the change; the attractions broken do.
        - |
          At the boiling point the liquid and vapour are at the same temperature, so their average kinetic energies are the same; the difference is potential energy.
        - |
          Correct. Both quantities measure the energy to overcome intermolecular attractions; boiling must overcome nearly all of them and expand the sample a thousandfold, melting only a fraction.
        - |
          Specific heats describe warming within a phase and have nothing to do with the energy of the phase change itself.
      answer: 2
      explanation: |
        Practice 6 (review of 3.1). Enthalpies of phase change measure intermolecular attractions overcome.

    - slug: apchem-u06-w21-q06
      type: multiple_choice
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Given 2 SO₂(g) + O₂(g) → 2 SO₃(g), ΔH = −198 kJ, what is ΔH for SO₃(g) → SO₂(g) + ½ O₂(g)?
      options:
        - "−198 kJ"
        - "+99 kJ"
        - "+198 kJ"
        - "−99 kJ"
      option_explanations:
        - |
          The target equation is reversed and halved; the sign must change and the magnitude must be halved.
        - |
          Correct. Halving the equation halves ΔH to −99 kJ; reversing it changes the sign to +99 kJ.
        - |
          The sign is right for the reverse reaction, but the target equation involves one mole of SO₃, not two, so the magnitude is halved.
        - |
          The magnitude is right but decomposing SO₃ is the reverse of its exothermic formation and must be endothermic.
      answer: 1
      explanation: |
        Practice 5. Scale and reverse: ΔH scales with the equation and changes sign on reversal.

    - slug: apchem-u06-w21-q07
      type: multiple_choice
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      prompt: |
        For the reaction 2 H₂(g) + O₂(g) → 2 H₂O(l), ΔH = −572 kJ. If 1.0 mol of H₂ and 1.0 mol of O₂ are allowed to react completely, how much heat is released?
      options:
        - "572 kJ"
        - "858 kJ"
        - "143 kJ"
        - "286 kJ"
      option_explanations:
        - |
          572 kJ is released per 2 mol H₂; only 1.0 mol H₂ is available.
        - |
          858 kJ would require adding the heat for both reactants as if each reacted fully, which double counts the reaction.
        - |
          143 kJ halves the correct value; the heat is set by the limiting reactant, 1.0 mol H₂, at 286 kJ per mole of H₂.
        - |
          Correct. H₂ is limiting (1.0 mol H₂ needs only 0.5 mol O₂). Heat = 1.0 mol H₂ × (572 kJ / 2 mol H₂) = 286 kJ.
      answer: 3
      explanation: |
        Practice 5. Identify the limiting reactant, then scale ΔH by its moles over its coefficient.

    - slug: apchem-u06-w21-q08
      type: multiple_choice
      topic_code: "6.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A bomb calorimeter is calibrated by burning benzoic acid, which releases a known 26.4 kJ per gram. Burning 1.00 g raises the calorimeter's temperature by 2.64 °C. What is the heat capacity of the calorimeter?
      options:
        - "10.0 kJ/°C"
        - "26.4 kJ/°C"
        - "2.64 kJ/°C"
        - "69.7 kJ/°C"
      option_explanations:
        - |
          Correct. C_cal = q/ΔT = 26.4 kJ / 2.64 °C = 10.0 kJ/°C; this value is then used for every later sample in the same apparatus.
        - |
          26.4 kJ is the heat released by the standard, not the heat capacity; it must be divided by the temperature rise.
        - |
          2.64 °C is the temperature change, not the heat capacity.
        - |
          69.7 would come from multiplying heat by temperature change instead of dividing.
      answer: 0
      explanation: |
        Practice 5. q = C_cal ΔT, so C_cal = q/ΔT.

    - slug: apchem-u06-w21-q09
      type: multiple_choice
      topic_code: "6.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A student measures the enthalpy of an exothermic reaction in a coffee-cup calorimeter but forgets to put the lid on, so some heat escapes to the air during the measurement. How does this affect the calculated ΔH?
      options:
        - "The calculated ΔH is too negative, because the air adds heat."
        - "The calculated ΔH is unaffected, because heat loss cancels out."
        - "The magnitude of the calculated ΔH is too small (less negative than the true value), because the measured temperature rise is too small."
        - "The calculated ΔH changes sign and appears endothermic."
      option_explanations:
        - |
          The air receives heat from the warm solution; it does not supply heat, so the solution's rise is reduced, not increased.
        - |
          Nothing compensates for lost heat in the calculation, which assumes all of the reaction's heat warmed the solution.
        - |
          Correct. Heat that escapes does not warm the solution, so ΔT and q_solution are too small, and the magnitude of ΔH = −q/n is underestimated.
        - |
          The solution still warms, so the reaction is still recorded as exothermic; only the magnitude is affected.
      answer: 2
      explanation: |
        Practice 2. Heat loss always shrinks the measured magnitude of an exothermic ΔH.

    - slug: apchem-u06-w21-q10
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        The molar enthalpies of vaporisation of three liquids are: ethanol (C₂H₅OH) 38.6 kJ/mol, diethyl ether (C₂H₅OC₂H₅) 26.5 kJ/mol, and water 40.7 kJ/mol. Which statement best accounts for the order?
      options:
        - "Larger molecules always have larger enthalpies of vaporisation."
        - "Water and ethanol can hydrogen-bond, and water forms more hydrogen bonds per molecule than ethanol; diethyl ether has no O–H and cannot hydrogen-bond with itself."
        - "Diethyl ether has the strongest intermolecular forces because it has the largest molar mass."
        - "The values depend only on the boiling points, not on the forces between molecules."
      option_explanations:
        - |
          Diethyl ether is the largest of the three molecules yet has the smallest ΔH_vap; size is not the deciding factor here.
        - |
          Correct. Hydrogen bonding is the dominant attraction: water (two O–H donors) exceeds ethanol (one O–H), and ether, lacking an O–H bond, relies on weaker dipole–dipole and dispersion forces.
        - |
          Ether's larger molar mass gives it more dispersion force, but the absence of hydrogen bonding leaves its total attraction weakest.
        - |
          Boiling point and ΔH_vap both result from intermolecular forces; neither is a cause of the other.
      answer: 1
      explanation: |
        Practice 6 (review of 3.1). Enthalpy of vaporisation ranks intermolecular attractions.

    - slug: apchem-u06-w21-q11
      type: multiple_choice
      topic_code: "4.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Propane burns according to C₃H₈(g) + 5 O₂(g) → 3 CO₂(g) + 4 H₂O(l), ΔH = −2,220 kJ. In a calorimetry experiment 0.100 mol of propane is burned with 0.400 mol of O₂. Which quantity should be used to calculate the heat released?
      options:
        - "0.0800 mol of propane, because O₂ is the limiting reactant"
        - "0.100 mol of propane, because propane is the limiting reactant"
        - "0.400 mol of O₂, because it is the larger amount"
        - "0.500 mol, the total moles of reactants"
      option_explanations:
        - |
          Correct. 0.100 mol propane would need 0.500 mol O₂, but only 0.400 mol is present, so O₂ limits; it consumes 0.400/5 = 0.0800 mol of propane, releasing 0.0800 × 2,220 = 178 kJ.
        - |
          Propane is in excess: 0.100 mol would require 0.500 mol of O₂ and only 0.400 mol is available.
        - |
          The larger mole amount is not the limiting reactant unless it is also short relative to its coefficient; here O₂ is limiting because its coefficient is 5.
        - |
          Total moles of reactants have no meaning in a stoichiometric calculation; the mole ratio from the equation decides.
      answer: 0
      explanation: |
        Practice 5 (review of 4.5). Compare moles available with moles required by the coefficients.

    # ---- Select all
    - slug: apchem-u06-w21-q12
      type: multi_select
      topic_code: "6.4"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are assumptions normally made when a coffee-cup calorimeter is used to measure the enthalpy of a reaction in aqueous solution? Select all that apply.
      options:
        - "No heat is exchanged between the calorimeter and the surrounding air."
        - "The solution has the same density and specific heat as pure water."
        - "The heat capacity of the foam cup is negligible."
        - "The reaction occurs at constant volume."
        - "The temperature of the solution never changes."
      option_explanations:
        - |
          Correct. The foam cups are insulators; the calculation treats the reaction and the solution as an isolated pair.
        - |
          Correct. Dilute aqueous solutions are assumed to have density 1.00 g/mL and c = 4.184 J/(g·°C).
        - |
          Correct. The cup absorbs so little heat that it is ignored (or lumped into a calibrated heat capacity).
        - |
          A coffee-cup calorimeter is open to the atmosphere, so the reaction occurs at constant pressure, which is why q equals ΔH.
        - |
          The whole method depends on measuring the solution's temperature change.
      answer: [0, 1, 2]
      explanation: |
        Practice 2. Insulated, water-like solution, negligible cup, constant pressure.

    - slug: apchem-u06-w21-q13
      type: multi_select
      topic_code: "3.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Graph description: a heating curve for water from −20 °C ice to 120 °C steam, drawn as temperature against heat added, shows three sloped segments and two plateaus. Which statements about the curve are correct? Select all that apply.
      options:
        - "The plateau at 100 °C is about seven times longer than the plateau at 0 °C, because ΔH_vap is about seven times ΔH_fus."
        - "The slope of the liquid-water segment is shallower than the slopes of the ice and steam segments, because liquid water has the highest specific heat."
        - "During the plateau at 0 °C the average kinetic energy of the molecules is increasing."
        - "During the plateau at 100 °C the average distance between molecules is increasing."
        - "The steam segment is flat because gases cannot be heated."
      option_explanations:
        - |
          Correct. Plateau length is proportional to the enthalpy of the phase change: 40.7 kJ/mol for boiling against 6.01 kJ/mol for melting.
        - |
          Correct. The slope is 1/(m c); water's c of 4.184 J/(g·°C) is about twice that of ice (2.09) or steam (2.01), so its segment rises more slowly.
        - |
          At a plateau the temperature, and so the average kinetic energy, is constant; the heat goes into potential energy.
        - |
          Correct. Boiling separates molecules against their attractions; the energy added is stored as increased potential energy of separation.
        - |
          The steam segment slopes upward; steam warms like any gas, with c = 2.01 J/(g·°C).
      answer: [0, 1, 3]
      explanation: |
        Practice 3 (review of 3.3). Plateaus are phase changes; slopes are specific heats.

    # ---- True/false
    - slug: apchem-u06-w21-q14
      type: true_false
      topic_code: "6.1"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: a thermochemical equation written as CaO(s) + H₂O(l) → Ca(OH)₂(s) + 65 kJ describes an exothermic reaction with ΔH = −65 kJ.
      answer: true
      explanation: |
        True. Heat written on the product side means the reaction releases it to the surroundings, which is exothermic; in the ΔH notation the same information is ΔH = −65 kJ per mole of CaO. Heat written on the reactant side would indicate an endothermic reaction with positive ΔH.

    - slug: apchem-u06-w21-q15
      type: true_false
      topic_code: "6.3"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: in a calorimetry experiment the heat capacity of 200.0 g of water is 4.184 J/°C.
      answer: false
      explanation: |
        False. 4.184 J/(g·°C) is the specific heat capacity, per gram. The heat capacity of the 200.0 g sample is C = m c = 200.0 × 4.184 = 836.8 J/°C: it takes 837 J to warm this sample by one degree. Confusing the two quantities is a common source of factor-of-m errors.

    # ---- Fill in the blank
    - slug: apchem-u06-w21-q16
      type: fill_blank
      topic_code: "6.5"
      source: "general knowledge"
      points: 1
      prompt: |
        During melting or boiling at constant temperature, the heat absorbed increases the ____ energy of the particles rather than their kinetic energy.
      answer: ["potential", "potential energy", "the potential"]
      explanation: |
        Temperature measures average kinetic energy, and it does not change during a phase change. The added heat does work against intermolecular attractions, increasing the separation of the particles and therefore their potential energy; it is released again as the same amount of heat when the change reverses.

    - slug: apchem-u06-w21-q17
      type: fill_blank
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Given N₂(g) + 3 H₂(g) → 2 NH₃(g), ΔH = −92 kJ, the enthalpy change for the decomposition 2 NH₃(g) → N₂(g) + 3 H₂(g) is ____ kJ.
      answer: ["+92", "92", "+92 kJ", "92 kJ"]
      explanation: |
        Reversing a thermochemical equation reverses the sign of ΔH. Forming 2 mol of ammonia releases 92 kJ, so decomposing 2 mol of ammonia absorbs 92 kJ: ΔH = +92 kJ.

