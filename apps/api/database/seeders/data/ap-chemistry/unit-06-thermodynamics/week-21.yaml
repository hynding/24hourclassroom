    # ---- Short answer
    - slug: apchem-u06-w21-q21
      type: short_answer
      topic_code: "6.5"
      source: "general knowledge"
      points: 3
      prompt: |
        A 10.0 g sample of ice at 0.0 °C is converted to liquid water at 50.0 °C. (ΔH_fus = 6.01 kJ/mol; c of liquid water = 4.184 J/(g·°C); molar mass 18.02 g/mol.)
        (a) Calculate the heat required to melt the ice.
        (b) Calculate the heat required to warm the resulting water to 50.0 °C, and the total heat for the process.
        (c) Describe how the two stages would appear on a heating curve and explain, at the particle level, why the temperature stays at 0.0 °C during the first stage.
      answer: |
        (a) n = 10.0/18.02 = 0.555 mol; q = 0.555 × 6,010 J/mol = 3,335 J ≈ 3.34 kJ.
        (b) q = 10.0 × 4.184 × 50.0 = 2,092 J ≈ 2.09 kJ. Total = 3.34 + 2.09 = 5.43 kJ.
        (c) The first stage is a horizontal plateau at 0.0 °C (heat added, no temperature change); the second is a rising straight line from 0.0 to 50.0 °C. During melting the added energy goes into breaking some hydrogen bonds and increasing the molecules' potential energy (separation and freedom of movement), not into their kinetic energy; since temperature measures average kinetic energy, it stays constant until all the ice has melted.
      explanation: |
        Three points, one per part.

        (a) 1 pt: q = n ΔH_fus = 3.34 kJ (accept 3.3–3.4 kJ), with moles computed.
        (b) 1 pt: q = m c ΔT = 2.09 kJ and total 5.43 kJ (accept 5.4 kJ).
        (c) 1 pt: plateau then rising segment; energy during melting increases potential energy (overcoming attractions) rather than kinetic energy, so the temperature is constant.

    - slug: apchem-u06-w21-q22
      type: short_answer
      topic_code: "4.8"
      source: "general knowledge"
      points: 3
      prompt: |
        A student measures the enthalpy of neutralisation of 1.0 M HCl with 1.0 M NaOH and obtains −56 kJ/mol. A second trial with 1.0 M HNO₃ and 1.0 M KOH gives the same value within error. A third trial with 1.0 M acetic acid (CH₃COOH) and 1.0 M NaOH gives −54 kJ/mol.
        (a) Write the net ionic equation for the first two trials and explain why their enthalpies are the same.
        (b) Write the net ionic equation for the acetic acid trial.
        (c) Suggest why the acetic acid value is slightly less exothermic.
      answer: |
        (a) H⁺(aq) + OH⁻(aq) → H₂O(l). HCl, HNO₃, NaOH and KOH are all strong electrolytes, fully dissociated; Cl⁻, NO₃⁻, Na⁺ and K⁺ are spectator ions that do not change, so the only chemical change in both trials is the same formation of water and the heat released per mole of water is the same.
        (b) CH₃COOH(aq) + OH⁻(aq) → CH₃COO⁻(aq) + H₂O(l), because acetic acid is a weak acid and exists mainly as intact molecules.
        (c) Part of the heat released by forming water is used to ionise the acetic acid molecules (breaking the O–H bond and separating the ions), an endothermic step that strong acids have already completed in solution; the net heat released is therefore smaller.
      explanation: |
        Three points, one per part.

        (a) 1 pt: net ionic equation H⁺ + OH⁻ → H₂O and the spectator-ion argument for equal ΔH.
        (b) 1 pt: CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O (weak acid written as a molecule).
        (c) 1 pt: energy required to ionise the weak acid (endothermic) offsets some of the heat of forming water.

    # ---- Long answer
    - slug: apchem-u06-w21-q23
      type: long_answer
      topic_code: "6.4"
      source: "general knowledge"
      points: 6
      stimulus: |
        A student dissolves 4.00 g of sodium hydroxide (molar mass 40.00 g/mol) in 100.0 g of water at 22.0 °C in a coffee-cup calorimeter. The temperature rises to a maximum of 31.8 °C. A temperature–time graph shows the reading rising sharply, peaking, then falling slowly at 0.2 °C per minute. Assume the solution has c = 4.184 J/(g·°C).
      prompt: |
        (a) Calculate the heat absorbed by the solution.
        (b) Calculate the molar enthalpy of solution of NaOH.
        (c) Explain why the mass of the solution, not the mass of the water alone, is used in part (a).
        (d) Explain, in terms of attractions broken and formed, why dissolving NaOH is exothermic while dissolving NH₄NO₃ is endothermic.
        (e) The student's value is less exothermic than the accepted value of −44.5 kJ/mol. Identify the most likely source of error and explain its direction.
        (f) Describe how the student could use the temperature–time graph to correct for that error.
      answer: |
        (a) q_solution = (100.0 + 4.00) g × 4.184 J/(g·°C) × (31.8 − 22.0) °C = 104.0 × 4.184 × 9.8 = 4,264 J ≈ 4.26 kJ.
        (b) n = 4.00/40.00 = 0.100 mol. q_dissolving = −4,264 J. ΔH_solution = −4,264 J / 0.100 mol = −42,600 J/mol = −42.6 kJ/mol.
        (c) The dissolved NaOH is part of the liquid whose temperature rose; all 104.0 g absorbed heat, so the whole solution mass is used (assuming it has water's specific heat).
        (d) Dissolving breaks the ionic attractions in the solid and some hydrogen bonds in water (endothermic steps) and forms ion–dipole attractions between Na⁺ or OH⁻ and water (exothermic). For NaOH, the small, highly charged ions are hydrated so strongly that the energy released exceeds the lattice and solvent energy cost; for NH₄NO₃ the larger ions are hydrated more weakly and the cost exceeds the release.
        (e) Heat loss to the surroundings (air, cup, thermometer) during the experiment. Lost heat does not warm the solution, so ΔT is too small and the magnitude of ΔH is underestimated (−42.6 instead of −44.5 kJ/mol). Incomplete dissolving or slow mixing has the same effect.
        (f) Extrapolate the slowly falling part of the temperature–time curve back to the moment of mixing (time zero) to find the temperature the solution would have reached with no cooling; use that extrapolated maximum, higher than 31.8 °C, in place of the observed peak.
      explanation: |
        Six points.

        (a) 1 pt: q = 104.0 × 4.184 × 9.8 = 4,260 J (accept 4,180–4,270 J; using 100.0 g gives 4,100 J and loses this point but may earn consistency credit later).
        (b) 1 pt: ΔH = −42.6 kJ/mol (accept −41 to −43 kJ/mol), negative sign required, from 0.100 mol.
        (c) 1 pt: the solute is part of the mass that warms; total solution mass is what absorbs the heat.
        (d) 1 pt: lattice and solvent attractions broken versus ion–dipole hydration formed; strong hydration of small Na⁺ and OH⁻ outweighs the cost; weaker hydration for NH₄⁺ and NO₃⁻ does not.
        (e) 1 pt: heat loss to surroundings (or incomplete dissolving), making ΔT and so the magnitude of ΔH too small.
        (f) 1 pt: extrapolate the cooling line back to the time of mixing to obtain a corrected maximum temperature.
