    prompt: |
      Using average bond enthalpies C–H 413, Cl–Cl 243, C–Cl 339 and H–Cl 431 kJ/mol, estimate ΔH for CH₄(g) + Cl₂(g) → CH₃Cl(g) + HCl(g). Give your answer in kJ as a whole number, including the sign.
    answer: { value: -114, tolerance: 2 }
    explanation: |
      Only one C–H bond and the Cl–Cl bond are broken (the other three C–H bonds survive): 413 + 243 = 656 kJ. Formed: one C–Cl (339) + one H–Cl (431) = 770 kJ. ΔH ≈ 656 − 770 = −114 kJ. Counting all four C–H bonds on both sides gives the same answer because three cancel.

