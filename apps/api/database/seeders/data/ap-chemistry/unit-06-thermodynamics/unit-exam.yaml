    answer: { value: -74.8, tolerance: 0.3 }
    explanation: |
      Keep the first (−393.5), double the second (2 × −285.8 = −571.6), reverse the third (+890.3). Adding the equations cancels CO₂, H₂O and O₂, leaving C + 2 H₂ → CH₄; ΔH = −393.5 − 571.6 + 890.3 = −74.8 kJ, the standard enthalpy of formation of methane.

  # ---- Short answer
  - slug: apchem-u06-exam-q38
    type: short_answer
    topic_code: "6.5"
    source: "general knowledge"
    points: 3
    prompt: |
      A 50.0 g ice cube at 0.0 °C is dropped into 200.0 g of water at 30.0 °C in an insulated cup. (ΔH_fus = 6.01 kJ/mol; c(water) = 4.184 J/(g·°C); molar mass 18.02 g/mol.)
      (a) Calculate the heat required to melt the ice completely.
      (b) Determine the final temperature of the water once the ice has melted and thermal equilibrium is reached.
      (c) Explain why ice at 0 °C cools a drink more effectively than the same mass of liquid water at 0 °C.
    answer: |
      (a) n = 50.0/18.02 = 2.775 mol; q = 2.775 × 6,010 = 16,680 J ≈ 16.7 kJ.
      (b) Heat lost by the warm water = heat to melt ice + heat to warm the melt from 0 °C to T: 200.0 × 4.184 × (30.0 − T) = 16,680 + 50.0 × 4.184 × (T − 0). 836.8(30.0 − T) = 16,680 + 209.2 T → 25,104 − 836.8 T = 16,680 + 209.2 T → 8,424 = 1,046 T → T = 8.1 °C.
      (c) Melting absorbs 334 J per gram (the enthalpy of fusion) before the resulting water absorbs any heat by warming, so ice removes far more heat from the drink than liquid water at the same temperature, which can only absorb heat by warming (4.18 J per gram per degree).
    explanation: |
      Three points, one per part.

      (a) 1 pt: q = n ΔH_fus = 16.7 kJ (accept 16.6–16.8 kJ).
      (b) 1 pt: correct heat balance including both the melting and the warming of the melt, giving T ≈ 8 °C (accept 7.9–8.3 °C).
      (c) 1 pt: the latent heat of fusion absorbed in melting, in addition to the heat absorbed on warming.

  - slug: apchem-u06-exam-q39
    type: short_answer
    topic_code: "6.8"
    source: "NIST Chemistry WebBook (standard enthalpies of formation, rounded)"
    points: 3
    prompt: |
      Standard enthalpies of formation (kJ/mol): NH₃(g) −45.9; NO(g) +90.3; H₂O(g) −241.8.
      (a) Calculate ΔH° for the first step of nitric acid manufacture, 4 NH₃(g) + 5 O₂(g) → 4 NO(g) + 6 H₂O(g).
      (b) Write the thermochemical equation for the formation of NO(g) from its elements and explain what the sign of ΔH°f tells you about NO relative to N₂ and O₂.
      (c) The reaction in (a) is run on a platinum gauze catalyst at about 900 °C. Explain why the catalyst affects the rate but not the value you calculated in (a).
    answer: |
      (a) ΔH° = [4(+90.3) + 6(−241.8)] − [4(−45.9) + 5(0)] = (361.2 − 1,450.8) + 183.6 = −906.0 kJ.
      (b) ½ N₂(g) + ½ O₂(g) → NO(g), ΔH°f = +90.3 kJ/mol. The positive sign means NO is higher in enthalpy than the elements it is made from: forming it absorbs energy, and NO is thermodynamically less stable than N₂ and O₂ (it persists for kinetic reasons).
      (c) The catalyst provides a pathway with a lower activation energy, so the reaction reaches a useful rate; but ΔH° is a state-function difference between the products and reactants, which the catalyst does not alter. The same heat is released per mole whether or not the catalyst is present.
    explanation: |
      Three points, one per part.

      (a) 1 pt: −906 kJ (accept −905 to −907) from Σ products − Σ reactants with coefficients.
      (b) 1 pt: correct formation equation with fractional coefficients and the interpretation of a positive ΔH°f (NO above its elements, less stable).
      (c) 1 pt: catalyst lowers Ea (rate) but ΔH° depends only on the initial and final states.

  # ---- Long answer
  - slug: apchem-u06-exam-q40
    type: long_answer
    topic_code: "6.4"
    source: "general knowledge"
    points: 6
    stimulus: |
      A student determines the enthalpy of the reaction Zn(s) + Cu²⁺(aq) → Zn²⁺(aq) + Cu(s) by adding 2.00 g of zinc powder (molar mass 65.38 g/mol) to 50.0 mL of 0.500 M CuSO₄ solution in a coffee-cup calorimeter. The temperature rises from 22.4 °C to 46.0 °C. Assume the solution has a density of 1.00 g/mL and a specific heat of 4.184 J/(g·°C), and ignore the mass of the zinc and the heat capacity of the cup.

      Reference values: ΔH°f of Zn²⁺(aq) = −153.9 kJ/mol; ΔH°f of Cu²⁺(aq) = +64.8 kJ/mol.
    prompt: |
      (a) Identify the limiting reactant, showing the calculation.
      (b) Calculate the heat released and the enthalpy change per mole of reaction.
      (c) Calculate ΔH° for the reaction from the enthalpies of formation and compare it with the student's value.
      (d) Give two reasons the student's magnitude is smaller than the accepted value.
      (e) Explain, at the particle level, why the solution's temperature rose.
      (f) The student proposes repeating the experiment with 4.00 g of zinc, keeping everything else the same, and expects the temperature rise to double. Evaluate this prediction.
    answer: |
      (a) Zn: 2.00/65.38 = 0.0306 mol. Cu²⁺: 0.0500 L × 0.500 M = 0.0250 mol. The reaction is 1:1, so Cu²⁺ is limiting (0.0250 mol).
      (b) q_solution = 50.0 g × 4.184 × (46.0 − 22.4) = 50.0 × 4.184 × 23.6 = 4,937 J. q_reaction = −4,937 J. ΔH = −4,937 J / 0.0250 mol = −197,500 J/mol = −198 kJ/mol.
      (c) ΔH° = [ΔH°f(Zn²⁺) + ΔH°f(Cu)] − [ΔH°f(Zn) + ΔH°f(Cu²⁺)] = (−153.9 + 0) − (0 + 64.8) = −218.7 kJ/mol. The student's −198 kJ/mol is about 10% smaller in magnitude.
      (d) Heat lost to the surroundings (air, cup, thermometer) during the measurement; the heat capacity of the cup and the zinc were ignored, so some heat warmed things other than the solution; the reaction may not have gone to completion or was slow, allowing cooling during the rise.
      (e) The reaction forms the strongly hydrated Zn²⁺ ion and metallic copper; more energy is released by these new attractions than is needed to remove Zn atoms from the metal and strip Cu²⁺ of its hydration shell. The surplus is transferred to the water molecules as kinetic energy through collisions, raising their average kinetic energy and so the temperature.
      (f) The prediction is wrong. Cu²⁺ is already the limiting reactant, so adding more zinc produces no more reaction and no more heat; the temperature rise stays about the same (slightly smaller, because the extra zinc absorbs some heat). Doubling the heat would require doubling the Cu²⁺ as well.
    explanation: |
      Six points.

      (a) 1 pt: moles of Zn (0.0306) and Cu²⁺ (0.0250) computed and Cu²⁺ identified as limiting.
      (b) 1 pt: q = 4,937 J (accept 4,900–4,950 J) and ΔH = −198 kJ/mol (accept −195 to −200), negative sign required.
      (c) 1 pt: ΔH° = −218.7 kJ/mol from the formation values, with a statement that the measured magnitude is smaller.
      (d) 1 pt: two valid error sources (heat loss to surroundings, neglected heat capacity of cup or zinc, incomplete reaction, slow reaction allowing cooling).
      (e) 1 pt: net energy released by forming hydrated Zn²⁺ and Cu metal exceeds the cost of the attractions broken; the energy becomes kinetic energy of the water molecules.
      (f) 1 pt: no change (Cu²⁺ limits), with the reasoning that extra zinc cannot react.
