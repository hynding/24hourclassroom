      - |
        Correct. The change in a state function between two states is the same by any route, so the sum of the step changes equals the direct change: Hess's law.
      - |
        Energy is conserved, but heat alone is not a state function; it is the state-function nature of enthalpy at constant pressure that makes the additivity exact.
      - |
        Rates are irrelevant to enthalpy changes.
    answer: 1
    explanation: |
      Practice 6. State function means path independence.

