  # ---- True/false
  - slug: apchem-u06-exam-q29
    type: true_false
    topic_code: "6.3"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: when a hot object and a cold object of different materials reach thermal equilibrium, the final temperature is always the average of their initial temperatures.
    answer: false
    explanation: |
      False. The final temperature is a weighted average with the heat capacities (m × c) as weights: m₁c₁(T − T₁) + m₂c₂(T − T₂) = 0. It is the plain average only when m₁c₁ = m₂c₂. A hot copper block dropped into water ends up very close to the water's starting temperature because water's heat capacity is far larger.

  - slug: apchem-u06-exam-q30
    type: true_false
    topic_code: "6.5"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: the heat required to boil 1.00 mol of water at 100 °C is given by q = n ΔH_vap and does not involve a temperature change.
    answer: true
    explanation: |
      True. Boiling occurs at a constant 100 °C; the 40.7 kJ absorbed per mole goes into separating the molecules (potential energy), not into raising their kinetic energy. q = mcΔT applies only to warming within a single phase.

