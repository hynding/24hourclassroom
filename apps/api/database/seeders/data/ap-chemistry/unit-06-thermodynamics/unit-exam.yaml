unit: 6
description: |
  40 questions · about 80 minutes · every topic of Unit 6 (6.1 to 6.9: endothermic and exothermic processes,
  energy diagrams, heat transfer, calorimetry, phase changes, enthalpy of reaction, bond enthalpies, enthalpies
  of formation and Hess's law), with review of intermolecular forces, limiting reactants and energy profiles.
  Three data sets in the AP style (an endothermic dissolving in a calorimeter, a table of enthalpies of
  formation and a described heating curve), stand-alone multiple choice, select-all, true/false,
  fill-in-the-blank and numeric items, two short-answer questions (3 points each) and one long free-response
  question (6 points). Multiple choice, select-all, true/false and numeric items are graded at once;
  fill-in-the-blank items are matched automatically; the free-response items are graded by your teacher
  against the scoring notes.
questions:
  # ---- Stimulus set A: dissolving KNO₃ in a calorimeter (6.4, 6.1)
  - slug: apchem-u06-exam-q01
    type: multiple_choice
    topic_code: "6.4"
    source: "general knowledge"
    points: 1
    stimulus: |
      A student adds 10.0 g of potassium nitrate, KNO₃ (molar mass 101.1 g/mol), to 100.0 g of water at 24.0 °C in a coffee-cup calorimeter and stirs until it dissolves. The lowest temperature reached is 15.8 °C. Assume the solution has a specific heat of 4.184 J/(g·°C) and that the cup absorbs no heat.
    prompt: |
      Which statement about the signs of the heat quantities is correct?
    options:
      - "q_solution is negative and q_dissolving is positive; the process is endothermic."
      - "q_solution is positive and q_dissolving is negative; the process is exothermic."
      - "Both q values are negative because the temperature fell."
      - "Both q values are positive because heat was absorbed from the hand."
    option_explanations:
      - |
        Correct. The solution lost heat (its temperature fell, so q_solution < 0) and the dissolving salt absorbed it (q_dissolving = −q_solution > 0): endothermic, ΔH_solution > 0.
      - |
        A temperature drop means the solution lost heat, so q_solution is negative, and the dissolving process gained it.
      - |
        Energy is conserved within the insulated cup, so the two q values must have opposite signs.
      - |
        The cup is insulated from the hand; the heat came from the water in the cup, which is why its temperature fell.
    answer: 0
    explanation: |
      Practice 6. Solution cools → solution lost heat → process absorbed heat → endothermic.

  - slug: apchem-u06-exam-q02
    type: multiple_choice
    topic_code: "6.1"
    source: "general knowledge"
    points: 1
    stimulus: |
      A student adds 10.0 g of potassium nitrate, KNO₃ (molar mass 101.1 g/mol), to 100.0 g of water at 24.0 °C in a coffee-cup calorimeter and stirs until it dissolves. The lowest temperature reached is 15.8 °C. Assume the solution has a specific heat of 4.184 J/(g·°C) and that the cup absorbs no heat.
    prompt: |
      Which statement best explains, at the particle level, why the temperature fell?
    options:
      - "Potassium nitrate molecules absorb heat as they move faster in solution."
      - "The ions react with water to form a gas, which carries heat away."
      - "Dissolving breaks the covalent bonds inside the nitrate ion, which requires a great deal of energy."
      - "The energy needed to separate K⁺ and NO₃⁻ ions from the crystal and to separate water molecules exceeds the energy released when the ions are hydrated, so the shortfall is taken from the kinetic energy of the water."
    option_explanations:
      - |
        KNO₃ is ionic, not molecular, and faster particle motion would mean a higher temperature, not a lower one.
      - |
        No gas forms when potassium nitrate dissolves; the ions simply become hydrated.
      - |
        The nitrate ion stays intact in solution; its internal N–O bonds are not broken by dissolving.
      - |
        Correct. Breaking ionic and hydrogen-bond attractions costs more than the ion–dipole hydration releases; the deficit is supplied by the water's kinetic energy, lowering its temperature.
    answer: 3
    explanation: |
      Practice 6. Endothermic dissolving: attractions broken cost more than attractions formed release.

  - slug: apchem-u06-exam-q03
    type: numeric
    topic_code: "6.4"
    source: "general knowledge"
    points: 1
    stimulus: |
      A student adds 10.0 g of potassium nitrate, KNO₃ (molar mass 101.1 g/mol), to 100.0 g of water at 24.0 °C in a coffee-cup calorimeter and stirs until it dissolves. The lowest temperature reached is 15.8 °C. Assume the solution has a specific heat of 4.184 J/(g·°C) and that the cup absorbs no heat.
    prompt: |
      Calculate the molar enthalpy of solution of KNO₃ from these data. Give your answer in kJ/mol to one decimal place, including the sign.
    answer: { value: 38.2, tolerance: 0.5 }
    explanation: |
      q_solution = (100.0 + 10.0) × 4.184 × (15.8 − 24.0) = 110.0 × 4.184 × (−8.2) = −3,774 J. q_dissolving = +3,774 J. n = 10.0/101.1 = 0.0989 mol. ΔH_solution = 3,774/0.0989 = 38,160 J/mol = +38.2 kJ/mol (the accepted value is about +35 kJ/mol; heat flowing in from the cup and air makes the measured drop smaller and the result slightly high or low depending on timing).

  # ---- Stimulus set B: enthalpies of formation (6.8)
  - slug: apchem-u06-exam-q04
    type: multiple_choice
    topic_code: "6.8"
    source: "NIST Chemistry WebBook (standard enthalpies of formation, rounded)"
    points: 1
    stimulus: |
      Standard enthalpies of formation at 25 °C:

      | Substance | ΔH°f (kJ/mol) |
      |---|---|
      | CH₄(g) | −74.8 |
      | CO(g) | −110.5 |
      | CO₂(g) | −393.5 |
      | H₂O(l) | −285.8 |
      | H₂O(g) | −241.8 |
    prompt: |
      Which equation represents the reaction whose enthalpy change is ΔH°f of CO₂(g)?
    options:
      - "CO(g) + ½ O₂(g) → CO₂(g)"
      - "C(g) + 2 O(g) → CO₂(g)"
      - "C(s, graphite) + O₂(g) → CO₂(g)"
      - "2 C(s, graphite) + 2 O₂(g) → 2 CO₂(g)"
    option_explanations:
      - |
        CO is a compound, not an element; this is the second step of carbon combustion, with ΔH = −283.0 kJ.
      - |
        Gaseous atoms are not the standard states of carbon and oxygen; this would be an atomisation reaction.
      - |
        Correct. One mole of CO₂ from the elements in their standard states, graphite and O₂ gas: ΔH° = −393.5 kJ/mol.
      - |
        The elements and states are right but two moles of product are formed; ΔH°f is per one mole.
    answer: 2
    explanation: |
      Practice 1. Formation: elements in standard states → one mole of compound.

  - slug: apchem-u06-exam-q05
    type: multiple_choice
    topic_code: "6.8"
    source: "NIST Chemistry WebBook (standard enthalpies of formation, rounded)"
    points: 1
    stimulus: |
      Standard enthalpies of formation at 25 °C:

      | Substance | ΔH°f (kJ/mol) |
      |---|---|
      | CH₄(g) | −74.8 |
      | CO(g) | −110.5 |
      | CO₂(g) | −393.5 |
      | H₂O(l) | −285.8 |
      | H₂O(g) | −241.8 |
    prompt: |
      What is ΔH° for CH₄(g) + 2 O₂(g) → CO₂(g) + 2 H₂O(l)?
    options:
      - "−604.5 kJ"
      - "−890.3 kJ"
      - "−1,039.9 kJ"
      - "−802.3 kJ"
    option_explanations:
      - |
        −604.5 kJ forgets the coefficient 2 on water: it uses one mole of H₂O instead of two.
      - |
        Correct. [(−393.5) + 2(−285.8)] − [(−74.8) + 0] = −965.1 + 74.8 = −890.3 kJ.
      - |
        −1,039.9 kJ subtracts the methane value with the wrong sign (adds −74.8 instead of subtracting it).
      - |
        −802.3 kJ is the value with gaseous water (−241.8 kJ/mol), not liquid water as the equation states.
    answer: 1
    explanation: |
      Practice 5. Products minus reactants, each times its coefficient.

  - slug: apchem-u06-exam-q06
    type: numeric
    topic_code: "6.8"
    source: "NIST Chemistry WebBook (standard enthalpies of formation, rounded)"
    points: 1
    stimulus: |
      Standard enthalpies of formation at 25 °C:

      | Substance | ΔH°f (kJ/mol) |
      |---|---|
      | CH₄(g) | −74.8 |
      | CO(g) | −110.5 |
      | CO₂(g) | −393.5 |
      | H₂O(l) | −285.8 |
      | H₂O(g) | −241.8 |
    prompt: |
      Calculate ΔH° for CO(g) + ½ O₂(g) → CO₂(g). Give your answer in kJ to one decimal place, including the sign.
    answer: { value: -283.0, tolerance: 0.3 }
    explanation: |
      ΔH° = ΔH°f(CO₂) − [ΔH°f(CO) + ½ ΔH°f(O₂)] = −393.5 − (−110.5 + 0) = −283.0 kJ. This is the heat released when carbon monoxide burns, the reason CO is itself a fuel.

  # ---- Stimulus set C: heating curve (6.5)
  - slug: apchem-u06-exam-q07
    type: multiple_choice
    topic_code: "6.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      Graph description: a heating curve for 25.0 g of water, temperature (°C) against heat added (kJ), starting with ice at −20 °C. Segment 1 rises from −20 °C to 0 °C; segment 2 is flat at 0 °C; segment 3 rises from 0 °C to 100 °C; segment 4 is flat at 100 °C; segment 5 rises above 100 °C. Data: c(ice) = 2.09, c(water) = 4.184, c(steam) = 2.01 J/(g·°C); ΔH_fus = 6.01 kJ/mol; ΔH_vap = 40.7 kJ/mol; molar mass 18.02 g/mol.
    prompt: |
      Which segment represents the largest quantity of heat?
    options:
      - "Segment 2, melting"
      - "Segment 3, warming the liquid"
      - "Segment 4, boiling"
      - "Segment 1, warming the ice"
    option_explanations:
      - |
        Melting 25.0 g needs 1.387 mol × 6.01 = 8.3 kJ, much less than boiling.
      - |
        Warming the liquid through 100 °C needs 25.0 × 4.184 × 100 = 10.5 kJ, large but still less than boiling.
      - |
        Correct. Boiling needs 1.387 mol × 40.7 = 56.5 kJ, more than all the other segments combined, because every hydrogen bond must be overcome to separate the molecules into a gas.
      - |
        Warming the ice through 20 °C needs 25.0 × 2.09 × 20 = 1.0 kJ, the smallest of the five.
    answer: 2
    explanation: |
      Practice 3. Plateau length is proportional to n ΔH; vaporisation dominates.

  - slug: apchem-u06-exam-q08
    type: multiple_choice
    topic_code: "6.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      Graph description: a heating curve for 25.0 g of water, temperature (°C) against heat added (kJ), starting with ice at −20 °C. Segment 1 rises from −20 °C to 0 °C; segment 2 is flat at 0 °C; segment 3 rises from 0 °C to 100 °C; segment 4 is flat at 100 °C; segment 5 rises above 100 °C. Data: c(ice) = 2.09, c(water) = 4.184, c(steam) = 2.01 J/(g·°C); ΔH_fus = 6.01 kJ/mol; ΔH_vap = 40.7 kJ/mol; molar mass 18.02 g/mol.
    prompt: |
      Compared with segment 3, segments 1 and 5 are steeper. Which explanation is correct?
    options:
      - "Ice and steam have lower specific heats than liquid water, so the same heat raises their temperature more."
      - "Ice and steam have higher specific heats than liquid water."
      - "Segments 1 and 5 are steeper because they involve phase changes."
      - "The slope depends only on the mass, which is smaller for the ice and steam."
    option_explanations:
      - |
        Correct. Slope = ΔT/q = 1/(m c); with c about 2.0 J/(g·°C) for ice and steam against 4.184 for liquid water, each joule raises their temperature about twice as much.
      - |
        Higher specific heat would make the segments shallower, not steeper.
      - |
        Phase changes are the flat segments (2 and 4); segments 1, 3 and 5 are single phases warming.
      - |
        The mass is 25.0 g throughout; it is the specific heat that differs.
    answer: 0
    explanation: |
      Practice 4. Steep slope, small specific heat.

  - slug: apchem-u06-exam-q09
    type: multiple_choice
    topic_code: "6.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      Graph description: a heating curve for 25.0 g of water, temperature (°C) against heat added (kJ), starting with ice at −20 °C. Segment 1 rises from −20 °C to 0 °C; segment 2 is flat at 0 °C; segment 3 rises from 0 °C to 100 °C; segment 4 is flat at 100 °C; segment 5 rises above 100 °C. Data: c(ice) = 2.09, c(water) = 4.184, c(steam) = 2.01 J/(g·°C); ΔH_fus = 6.01 kJ/mol; ΔH_vap = 40.7 kJ/mol; molar mass 18.02 g/mol.
    prompt: |
      During segment 4, which statement about the water molecules is correct?
    options:
      - "Their average kinetic energy increases as heat is added."
      - "Their potential energy decreases as they escape the liquid."
      - "Both their kinetic and potential energies stay constant."
      - "Their average potential energy increases as hydrogen bonds are overcome, while their average kinetic energy stays the same."
    option_explanations:
      - |
        The temperature is constant along segment 4, and temperature measures average kinetic energy, so it does not change.
      - |
        Separating molecules against attractions raises, not lowers, their potential energy.
      - |
        Energy is being added, so something must change; it is the potential energy of separation.
      - |
        Correct. The heat added during boiling does work against intermolecular attractions, raising the molecules' potential energy; their kinetic energy, and hence the temperature, is unchanged until all the liquid has vaporised.
    answer: 3
    explanation: |
      Practice 6. Phase change: potential energy up, kinetic energy unchanged.

  # ---- Stand-alone multiple choice
  - slug: apchem-u06-exam-q10
    type: multiple_choice
    topic_code: "6.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following is an endothermic process?
    options:
      - "Steam condensing on a cold window"
      - "Methane burning in a furnace"
      - "Solid calcium carbonate decomposing to calcium oxide and carbon dioxide when heated"
      - "Sodium hydroxide dissolving in water, which warms the solution"
    option_explanations:
      - |
        Condensation forms hydrogen bonds between water molecules and releases heat: exothermic.
      - |
        Combustion releases large quantities of heat: exothermic.
      - |
        Correct. The decomposition absorbs heat continuously from the furnace (ΔH° = +178 kJ/mol); it is endothermic, which is why it needs sustained heating.
      - |
        A warming solution means the system released heat: exothermic.
    answer: 2
    explanation: |
      Practice 1. Endothermic processes need heat supplied and have ΔH > 0.

  - slug: apchem-u06-exam-q11
    type: multiple_choice
    topic_code: "6.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Graph description: an energy diagram shows reactants at +30 kJ/mol, a peak at +110 kJ/mol, and products at −10 kJ/mol. Which set of values is correct?
    options:
      - "ΔH = −40 kJ/mol; Ea(forward) = 80 kJ/mol; Ea(reverse) = 120 kJ/mol"
      - "ΔH = −10 kJ/mol; Ea(forward) = 110 kJ/mol; Ea(reverse) = 120 kJ/mol"
      - "ΔH = +40 kJ/mol; Ea(forward) = 80 kJ/mol; Ea(reverse) = 40 kJ/mol"
      - "ΔH = −40 kJ/mol; Ea(forward) = 110 kJ/mol; Ea(reverse) = 80 kJ/mol"
    option_explanations:
      - |
        Correct. ΔH = −10 − 30 = −40 kJ/mol; Ea(forward) = 110 − 30 = 80 kJ/mol; Ea(reverse) = 110 − (−10) = 120 kJ/mol.
      - |
        These read the products and the peak from zero on the axis instead of as differences from the reactant level.
      - |
        The products lie below the reactants, so ΔH is negative, and the reverse barrier (from −10 up to 110) is 120, not 40.
      - |
        ΔH is right but the forward barrier is measured from the reactants at +30, giving 80, and the reverse from −10, giving 120.
    answer: 0
    explanation: |
      Practice 4. Every quantity on an energy diagram is a difference between two levels.

  - slug: apchem-u06-exam-q12
    type: multiple_choice
    topic_code: "6.3"
    source: "general knowledge"
    points: 1
    prompt: |
      A 100.0 g block of aluminium (c = 0.897 J/(g·°C)) at 80.0 °C and a 100.0 g block of lead (c = 0.129 J/(g·°C)) at 20.0 °C are placed in contact in an insulated container. Which statement about the final temperature is correct?
    options:
      - "It is exactly 50.0 °C, because the masses are equal."
      - "It cannot be determined without knowing the volumes."
      - "It is much closer to 20.0 °C, because lead is denser."
      - "It is much closer to 80.0 °C than to 20.0 °C, because aluminium's heat capacity is about seven times lead's."
    option_explanations:
      - |
        Equal masses give the midpoint only if the specific heats are also equal; here they differ sevenfold.
      - |
        Masses and specific heats are sufficient; volume plays no role.
      - |
        Density is irrelevant to heat transfer calculations; heat capacity (m × c) decides.
      - |
        Correct. 100.0 × 0.897 (T − 80.0) + 100.0 × 0.129 (T − 20.0) = 0 gives T ≈ 72.5 °C; the object with the larger m × c moves least.
    answer: 3
    explanation: |
      Practice 5. The final temperature sits near the object with the larger heat capacity.

  - slug: apchem-u06-exam-q13
    type: multiple_choice
    topic_code: "6.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Which statement correctly distinguishes heat from temperature?
    options:
      - "Heat is energy transferred between objects because of a temperature difference; temperature is a measure of the average kinetic energy of the particles."
      - "Temperature is the total energy of a sample; heat is its average energy."
      - "Heat and temperature are the same quantity measured in different units."
      - "Heat flows from the object with more total energy to the one with less."
    option_explanations:
      - |
        Correct. A large cool lake holds more thermal energy than a cup of boiling water, yet heat flows from the cup to the lake because the cup's particles have the higher average kinetic energy.
      - |
        This reverses the ideas: temperature reflects average particle kinetic energy, and heat is not a property a sample holds but energy in transit.
      - |
        They are different kinds of quantity: heat is energy in joules, temperature is a state variable in kelvin or degrees.
      - |
        Direction is set by temperature, not total energy; a small hot object loses heat to a large cool one.
    answer: 0
    explanation: |
      Practice 6. Temperature decides direction; heat is what flows.

  - slug: apchem-u06-exam-q14
    type: multiple_choice
    topic_code: "6.4"
    source: "general knowledge"
    points: 1
    prompt: |
      In a coffee-cup calorimetry experiment, 50.0 mL of 1.0 M AgNO₃ is mixed with 50.0 mL of 1.0 M NaCl and the temperature rises by 4.0 °C. Which quantity is needed, in addition to the temperature change, to calculate ΔH per mole of AgCl formed?
    options:
      - "The molar mass of AgCl"
      - "The density and specific heat of the solution, and the moles of AgCl formed from the limiting reactant"
      - "The heat of formation of NaNO₃"
      - "The volume of the foam cup"
    option_explanations:
      - |
        The molar mass is not needed; the moles of AgCl come from the molarity and volume of the limiting reactant.
      - |
        Correct. q = m c ΔT needs the solution's mass (from density and volume) and specific heat; dividing q by the 0.050 mol of AgCl formed gives ΔH per mole.
      - |
        The spectator ions Na⁺ and NO₃⁻ do not react; no formation enthalpy is required for the calorimetric result.
      - |
        The cup's volume plays no role; its heat capacity is assumed negligible.
    answer: 1
    explanation: |
      Practice 2. Mass, specific heat, ΔT and moles of the limiting reactant.

  - slug: apchem-u06-exam-q15
    type: multiple_choice
    topic_code: "6.6"
    source: "general knowledge"
    points: 1
    prompt: |
      For 2 C₈H₁₈(l) + 25 O₂(g) → 16 CO₂(g) + 18 H₂O(l), ΔH = −10,940 kJ. How much heat is released when 57.1 g of octane (molar mass 114.2 g/mol) burns completely?
    options:
      - "10,940 kJ"
      - "5,470 kJ"
      - "2,735 kJ"
      - "21,880 kJ"
    option_explanations:
      - |
        10,940 kJ is released per 2 mol of octane as written; 57.1 g is only 0.500 mol.
      - |
        5,470 kJ is the heat per mole of octane; 0.500 mol releases half of that.
      - |
        Correct. 57.1/114.2 = 0.500 mol octane; ΔH per mole of octane is −10,940/2 = −5,470 kJ; 0.500 × 5,470 = 2,735 kJ released.
      - |
        21,880 kJ doubles the equation's ΔH instead of scaling it down to half a mole.
    answer: 2
    explanation: |
      Practice 5. Moles of the named reactant divided by its coefficient, times ΔH.

  - slug: apchem-u06-exam-q16
    type: multiple_choice
    topic_code: "6.6"
    source: "general knowledge"
    points: 1
    prompt: |
      The thermochemical equation 2 H₂O(l) + 571.6 kJ → 2 H₂(g) + O₂(g) is equivalent to which of the following?
    options:
      - "H₂(g) + ½ O₂(g) → H₂O(l), ΔH = +285.8 kJ"
      - "2 H₂(g) + O₂(g) → 2 H₂O(l), ΔH = +571.6 kJ"
      - "H₂O(l) → H₂(g) + ½ O₂(g), ΔH = −285.8 kJ"
      - "H₂(g) + ½ O₂(g) → H₂O(l), ΔH = −285.8 kJ"
    option_explanations:
      - |
        Forming water is the reverse of the given decomposition, so its ΔH must be negative.
      - |
        The reverse reaction must have the opposite sign: forming 2 mol of water releases 571.6 kJ.
      - |
        Decomposing one mole of water absorbs 285.8 kJ, so ΔH is positive, not negative.
      - |
        Correct. Heat on the reactant side means ΔH = +571.6 kJ for the decomposition of 2 mol; reversing and halving gives −285.8 kJ for forming one mole.
    answer: 3
    explanation: |
      Practice 1. Heat as a reactant means endothermic; reverse and scale consistently.

  - slug: apchem-u06-exam-q17
    type: multiple_choice
    topic_code: "6.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Which statement about using average bond enthalpies to calculate ΔH is correct?
    options:
      - "ΔH equals the sum of the bond enthalpies of the bonds formed minus the sum for the bonds broken."
      - "The method gives exact values for any reaction in any phase."
      - "ΔH equals the sum of the bond enthalpies of the bonds broken minus the sum for the bonds formed, and is an estimate because tabulated values are averages."
      - "Only the bonds in the reactants need to be counted."
    option_explanations:
      - |
        This reverses the sign: breaking bonds is the energy input (positive), forming is the release.
      - |
        The values are averages and apply to gases; the results are approximate and need corrections for condensed phases.
      - |
        Correct. Energy in (breaking) minus energy out (forming), using averaged gas-phase values, gives an estimate usually within a few per cent.
      - |
        Both reactant bonds broken and product bonds formed must be included; omitting the products gives a large positive nonsense value.
    answer: 2
    explanation: |
      Practice 5. Σ broken − Σ formed; estimate, not exact.

  - slug: apchem-u06-exam-q18
    type: multiple_choice
    topic_code: "6.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Using bond enthalpies H–H 436, F–F 159 and H–F 567 kJ/mol, the estimated ΔH for H₂(g) + F₂(g) → 2 HF(g) is
    options:
      - "−539 kJ"
      - "+539 kJ"
      - "−28 kJ"
      - "−1,134 kJ"
    option_explanations:
      - |
        Correct. Broken: 436 + 159 = 595 kJ; formed: 2 × 567 = 1,134 kJ; ΔH ≈ 595 − 1,134 = −539 kJ, a violently exothermic reaction.
      - |
        The magnitude is right but the sign is reversed; forming two very strong H–F bonds releases far more than breaking the reactant bonds costs.
      - |
        −28 kJ comes from using one H–F bond instead of two.
      - |
        −1,134 kJ is the energy released by forming the H–F bonds alone, without subtracting the cost of breaking H–H and F–F.
    answer: 0
    explanation: |
      Practice 5. Two product bonds, both strong; one weak F–F bond broken.

  - slug: apchem-u06-exam-q19
    type: multiple_choice
    topic_code: "6.9"
    source: "general knowledge"
    points: 1
    prompt: |
      Given (1) S(s) + O₂(g) → SO₂(g), ΔH = −296.8 kJ, and (2) 2 SO₂(g) + O₂(g) → 2 SO₃(g), ΔH = −197.8 kJ, what is ΔH for S(s) + 3/2 O₂(g) → SO₃(g)?
    options:
      - "−494.6 kJ"
      - "−395.7 kJ"
      - "−98.9 kJ"
      - "−791.4 kJ"
    option_explanations:
      - |
        −494.6 kJ adds the two ΔH values without halving equation (2) to match one mole of SO₃.
      - |
        Correct. Halve (2): SO₂ + ½ O₂ → SO₃, ΔH = −98.9 kJ. Add (1): S + O₂ → SO₂, −296.8 kJ. Sum: S + 3/2 O₂ → SO₃, ΔH = −395.7 kJ, the enthalpy of formation of SO₃.
      - |
        −98.9 kJ is only the second step for one mole; the formation of SO₂ from sulfur must be added.
      - |
        −791.4 kJ doubles everything; the target makes one mole of SO₃.
    answer: 1
    explanation: |
      Practice 5. Scale equation (2) by ½ before adding.

  - slug: apchem-u06-exam-q20
    type: multiple_choice
    topic_code: "6.9"
    source: "general knowledge"
    points: 1
    prompt: |
      Why can the ΔH values of individual steps be added to give the ΔH of an overall reaction?
    options:
      - "Because every step has the same activation energy"
      - "Because enthalpy is a state function, so the total change depends only on the initial and final states, not on the path"
      - "Because heat is always conserved in chemical reactions"
      - "Because the steps occur at the same rate"
    option_explanations:
      - |
