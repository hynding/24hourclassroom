# The AP Chemistry course map. Week files live under unit-NN-<slug>/week-NN.yaml.
# Titles and slugs are composed by Database\Seeders\Curriculum\Course from the
# numbers here, so nothing in a week file repeats the naming convention.
title: AP Chemistry
# Every title starts with `prefix`; every test, material and the course row
# itself carry a slug that starts with `slug`.
prefix: AP Chemistry
slug: apchem
# The course page's introduction. Folded (`>`): one paragraph, not hard line breaks.
description: >
  A full school year of AP Chemistry, one week at a time: a study guide,
  flashcards and a quiz every week, a summary and an exam at the end of each
  of the nine units, and an exam-prep guide and full practice exam in the
  real format (60 multiple choice, then three 10-point long free-response
  questions and four 4-point short ones) before the May exam. Original
  material written around the College Board Course and Exam Description,
  with every constant and data value taken from public-domain sources (NIST,
  PubChem and other U.S. government publications).
teacher: { name: "AP Chemistry Teacher", email: apchem@example.com }
student: { name: "AP Chemistry Student", email: apchem-student@example.com }
# Monday of week 1. Null means no due dates: the whole course is open at once.
# The exam is Thursday 2027-05-06, session 2 (College Board AP Central);
# weeks 33-34 review, 35 buffer, 36 exam week.
start_date: 2026-08-31
exam_date: 2027-05-06
subject: science
grade_level: "9-12"
review:
  prep_guide_week: 33
  practice_exam_week: 34
  prep_guide_description: The exam format and calculator rules, the equations and constants sheet, the six science practices, how free-response questions are scored, and a two-week review plan.
# Every guide and summary must end with all of these (the content lint).
attribution_markers: ["AP Chemistry Course and Exam Description", public domain]
attribution: |
  Original study material written for this course and organised around the
  College Board AP Chemistry Course and Exam Description. Physical constants,
  thermodynamic data and spectroscopic values are public domain, taken from
  U.S. government sources (the NIST Chemistry WebBook, NIST CODATA constants,
  PubChem) and rounded as the AP equations sheet does.
# The six science practices, by their CED codes; guides tag topics with them.
practices:
  "1": Models and Representations
  "2": Question and Method
  "3": Representing Data and Phenomena
  "4": Model Analysis
  "5": Mathematical Routines
  "6": Argumentation
units:
  - number: 1
    slug: unit-01-atomic-structure-and-properties
    title: Atomic Structure and Properties
    weight: "7–9%"
    weeks: [1, 2, 3, 4]
    topics:
      "1.1": Moles and Molar Mass
      "1.2": Mass Spectra of Elements
      "1.3": Elemental Composition of Pure Substances
      "1.4": Composition of Mixtures
      "1.5": Atomic Structure and Electron Configuration
      "1.6": Photoelectron Spectroscopy
      "1.7": Periodic Trends
      "1.8": Valence Electrons and Ionic Compounds
  - number: 2
    slug: unit-02-compound-structure-and-properties
    title: Compound Structure and Properties
    weight: "7–9%"
    weeks: [5, 6, 7]
    topics:
      "2.1": Types of Chemical Bonds
      "2.2": Intramolecular Force and Potential Energy
      "2.3": Structure of Ionic Solids
      "2.4": Structure of Metals and Alloys
      "2.5": Lewis Diagrams
      "2.6": Resonance and Formal Charge
      "2.7": VSEPR and Hybridization
  - number: 3
    slug: unit-03-intermolecular-forces-and-properties
    title: Intermolecular Forces and Properties
    weight: "18–22%"
    weeks: [8, 9, 10, 11, 12]
    topics:
      "3.1": Intermolecular and Interparticle Forces
      "3.2": Properties of Solids
      "3.3": Solids, Liquids, and Gases
      "3.4": Ideal Gas Law
      "3.5": Kinetic Molecular Theory
      "3.6": Deviation from Ideal Gas Law
      "3.7": Solutions and Mixtures
      "3.8": Representations of Solutions
      "3.9": Separation of Solutions and Mixtures (Chromatography)
      "3.10": Solubility
      "3.11": Spectroscopy and the Electromagnetic Spectrum
