week: 28
unit: 8
title: "Acid–Base Reactions, Titrations, Structure and pKa"
topics: ["8.4", "8.5", "8.6", "8.7"]
guide: guides/week-28.md
guide_description: |
  Net ionic equations for strong–strong, strong–weak and weak–weak acid–base reactions and the pH of salt
  solutions; how partial neutralisation produces a buffer; titrations from stoichiometry to the full curve
  (start, buffer region, half-equivalence, equivalence, excess titrant) for strong–strong, weak acid–strong
  base and weak base–strong acid, with indicator choice and polyprotic curves; acid strength from molecular
  structure (binary acids, oxyacids, carboxylic acids, amines); and pKa with the pH–pKa rule for which form
  dominates. Worked examples for NH₄Cl, NaF, H₂SO₄ standardisation, the acetic acid curve and aspirin.
flashcards_description: |
  30 cards on acid–base reactions and salt hydrolysis, every point on a titration curve, indicator selection,
  structure and acid strength, and the pH–pKa relation.

flashcards:
  - front: Net ionic equation for a strong acid reacting with a strong base
    back: |
      H⁺(aq) + OH⁻(aq) → H₂O(l), K = 1/Kw = 1.0 × 10¹⁴; the spectator ions form a neutral salt such as NaCl.
    topic_code: "8.4"
  - front: Net ionic equation for a strong acid reacting with a weak base
    back: |
      H⁺(aq) + NH₃(aq) → NH₄⁺(aq); K = 1/Ka(NH₄⁺) ≈ 1.8 × 10⁹, so the reaction is complete. The product NH₄⁺ is a weak acid, making the salt solution acidic.
    topic_code: "8.4"
  - front: Net ionic equation for a weak acid reacting with a strong base
    back: |
      CH₃COOH(aq) + OH⁻(aq) → CH₃COO⁻(aq) + H₂O(l); K = Ka/Kw ≈ 1.8 × 10⁹, complete. The product acetate is a weak base, making the salt solution basic.
    topic_code: "8.4"
  - front: Predicting whether a salt solution is acidic, basic or neutral
    back: |
      Spectators: cations of strong bases (Na⁺, K⁺, Ca²⁺) and anions of strong acids (Cl⁻, NO₃⁻). Acidic: conjugate acids of weak bases (NH₄⁺) and small highly charged metal ions (Al³⁺, Fe³⁺). Basic: conjugate bases of weak acids (F⁻, CH₃COO⁻, CN⁻, CO₃²⁻).
    topic_code: "8.4"
  - front: "Worked pH of 0.10 M NH₄Cl"
    back: |
      Ka(NH₄⁺) = Kw/Kb = 5.6 × 10⁻¹⁰; x = √(5.6 × 10⁻¹⁰ × 0.10) = 7.5 × 10⁻⁶ M; pH = 5.13. Chloride is a spectator.
    topic_code: "8.4"
  - front: "Worked pH of 0.20 M NaF"
    back: |
      Kb(F⁻) = 1.0 × 10⁻¹⁴/6.8 × 10⁻⁴ = 1.5 × 10⁻¹¹; x = √(1.5 × 10⁻¹¹ × 0.20) = 1.7 × 10⁻⁶ M OH⁻; pOH 5.77; pH 8.23.
    topic_code: "8.4"
  - front: How partial neutralisation produces a buffer
    back: |
      Adding less than one equivalent of strong base to a weak acid converts part of it to its conjugate base, leaving both HA and A⁻ in comparable amounts: a buffer. Exactly one equivalent gives a salt solution; more gives excess strong base.
    topic_code: "8.4"
  - front: Why a weak acid and a weak base react less completely than strong–weak pairs
    back: |
      K = Ka(acid)/Ka(conjugate acid of the base). For CH₃COOH + NH₃, K = 1.8 × 10⁻⁵/5.6 × 10⁻¹⁰ = 3.2 × 10⁴: strongly product-favoured but an equilibrium, not a completed reaction.
    topic_code: "8.4"
  - front: Equivalence point versus end point
    back: |
      Equivalence: moles of titrant equal moles of analyte by the stoichiometry. End point: the indicator changes colour. A well-chosen indicator makes the two coincide.
    topic_code: "8.5"
  - front: Finding an unknown concentration from a titration
    back: |
      Moles titrant = M × V; convert with the mole ratio of the balanced equation; divide by the analyte volume. 25.00 mL H₂SO₄ needing 31.20 mL of 0.1000 M NaOH: 3.120 × 10⁻³ mol NaOH → 1.560 × 10⁻³ mol H₂SO₄ → 0.06240 M.
    topic_code: "8.5"
  - front: Shape of a strong acid–strong base titration curve
    back: |
      Starts low (pH 1 for 0.1 M), rises slowly, then jumps from about pH 3 to 11 within a drop of the equivalence point, where pH = 7.00; levels off near the titrant's pH. No buffer region.
    topic_code: "8.5"
  - front: Shape of a weak acid–strong base titration curve
    back: |
      Starts at a moderate pH, rises quickly then flattens through a buffer region centred on pH = pKa at half-equivalence, jumps at equivalence with pH above 7 (the conjugate base hydrolyses), and levels off as strong base is added.
    topic_code: "8.5"
  - front: Shape of a weak base–strong acid titration curve
    back: |
      The mirror image: starts high, buffer region with pOH = pKb (pH = 14 − pKb) at half-equivalence, equivalence below pH 7 because the conjugate acid is present, then falls toward the pH of the strong acid.
    topic_code: "8.5"
  - front: pH at the start of a weak-acid titration
    back: |
      A plain weak-acid ICE calculation: x = √(Ka c). For 0.100 M acetic acid, x = 1.3 × 10⁻³ M and pH = 2.87.
    topic_code: "8.5"
  - front: pH before equivalence in a weak-acid titration
    back: |
      The base converts an equal number of moles of HA to A⁻; the mixture is a buffer with pH = pKa + log(mol A⁻/mol HA). Volumes cancel in the ratio.
    topic_code: "8.5"
  - front: pH at half-equivalence
    back: |
      Half the acid has been converted, so mol HA = mol A⁻ and pH = pKa (for a weak base, pOH = pKb). This is how a titration curve measures Ka.
    topic_code: "8.5"
  - front: pH at the equivalence point of a weak acid–strong base titration
    back: |
      All HA is now A⁻ at concentration (moles)/(total volume). Solve the weak-base ICE with Kb = Kw/Ka. For 25.0 mL of 0.100 M acetic acid: 0.0500 M acetate, [OH⁻] = 5.3 × 10⁻⁶ M, pH 8.72.
    topic_code: "8.5"
  - front: pH after the equivalence point
    back: |
      Excess strong titrant dominates: [OH⁻] (or [H⁺]) = excess moles/total volume; the weak conjugate species contributes negligibly. 0.50 × 10⁻³ mol excess OH⁻ in 55.0 mL gives pH 11.96.
    topic_code: "8.5"
  - front: Polyprotic acid titration curve
    back: |
      One buffer region and one equivalence jump per proton; the second equivalence volume is twice the first; the half-equivalence points read pKa1 and pKa2. H₃PO₄'s third proton is too weak to show a jump in water.
    topic_code: "8.5"
  - front: Choosing an indicator
    back: |
      An indicator changes colour over about pKa(HIn) ± 1; pick one whose range lies on the steep part of the curve. Phenolphthalein (8.3–10.0) for weak acid–strong base; methyl red (4.4–6.2) for weak base–strong acid; either for strong–strong.
    topic_code: "8.5"
  - front: Strength of binary acids down a group
    back: |
      HF ≪ HCl < HBr < HI, and H₂O < H₂S < H₂Se: the H–X bond weakens and the larger anion spreads its charge better. Bond strength outweighs polarity down a group.
    topic_code: "8.6"
  - front: Strength of binary acids across a period
    back: |
      CH₄ < NH₃ < H₂O < HF: electronegativity rises, the bond becomes more polar and the proton is lost more readily. Polarity dominates across a period.
    topic_code: "8.6"
  - front: Why HF is a weak acid although H–F is the most polar bond
    back: |
      The H–F bond is the strongest of the hydrogen halides and the small F⁻ ion is strongly hydrated and holds the proton closely; the ionisation is therefore incomplete (Ka = 6.8 × 10⁻⁴).
    topic_code: "8.6"
  - front: Strength of oxyacids
    back: |
      More oxygen atoms on the central atom, or a more electronegative central atom, pull electron density from the O–H bond and delocalise the anion's charge: HClO₄ > HClO₃ > HClO₂ > HClO; HClO > HBrO > HIO; HNO₃ > HNO₂.
    topic_code: "8.6"
  - front: Why carboxylic acids are acidic but alcohols are not
    back: |
      The carboxylate anion is resonance-stabilised, the negative charge shared between two oxygens, so R–COOH has Ka ≈ 10⁻⁵; an alcohol's alkoxide has no such stabilisation (Ka ≈ 10⁻¹⁶). Electron-withdrawing groups (Cl) strengthen the acid further.
    topic_code: "8.6"
  - front: Structural requirement for a Brønsted–Lowry base
    back: |
      A lone pair to bind H⁺: the nitrogen of ammonia and amines, the oxygen of hydroxide, or an anion of a weak acid. Amines (RNH₂) are weak bases with Kb ≈ 10⁻⁴ to 10⁻⁵.
    topic_code: "8.6"
  - front: pKa → definition and meaning
    back: |
      pKa = −log Ka. Lower pKa means stronger acid: HF 3.17, acetic 4.74, HOCl 7.52, HCN 9.21, NH₄⁺ 9.25. pKa is the pH at which an acid is half-ionised.
    topic_code: "8.7"
  - front: The pH–pKa rule for which form dominates
    back: |
      log([A⁻]/[HA]) = pH − pKa. pH < pKa: the protonated form HA dominates; pH > pKa: the deprotonated form A⁻ dominates; pH = pKa: equal. Each unit of difference is a factor of 10.
    topic_code: "8.7"
  - front: "Worked ratio of acetate to acetic acid at pH 3.74 and 6.74"
    back: |
      pKa 4.74. At pH 3.74 (one unit below), [CH₃COO⁻]/[CH₃COOH] = 10⁻¹: acid form ten times the base. At pH 6.74 (two units above), the ratio is 10²: acetate 100 times the acid.
    topic_code: "8.7"
  - front: pH–pKa rule applied to indicators and drugs
    back: |
      An indicator of pKa 9 is in its acid colour below pH 8 and base colour above pH 10. Aspirin (pKa 3.5) is mostly neutral molecules in the stomach (pH 1–2) and mostly anions in the intestine (pH 6–7).
    topic_code: "8.7"

quiz:
  description: |
    23 questions · about 45 minutes · topics 8.4–8.7 (acid–base reactions and the pH of salts, titrations and
    their curves, molecular structure and acid strength, and pH versus pKa), with review of weak-acid
    equilibria, strong acids, net ionic equations, titration stoichiometry, electronegativity and the
    common-ion effect. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: weak-acid titration curve (8.5, 8.7)
    - slug: apchem-u08-w28-q01
      type: multiple_choice
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        Graph description: 25.0 mL of 0.100 M of a weak monoprotic acid HA is titrated with 0.100 M NaOH; pH is plotted against the volume of NaOH added. The curve starts at pH 2.87, rises gradually and passes through pH 4.74 at 12.5 mL, then rises steeply near 25.0 mL, passing through pH 8.72, and levels off near pH 12.4 by 40.0 mL.
      prompt: |
        What is Ka for the acid HA?
      options:
        - "1.3 × 10⁻³"
        - "1.8 × 10⁻⁵"
        - "1.9 × 10⁻⁹"
        - "4.74"
      option_explanations:
        - |
          1.3 × 10⁻³ is [H⁺] at the start of the titration (10^(−2.87)), not Ka.
        - |
          Correct. At 12.5 mL, half the acid has been neutralised, so [HA] = [A⁻] and pH = pKa = 4.74; Ka = 10^(−4.74) = 1.8 × 10⁻⁵.
        - |
          1.9 × 10⁻⁹ is 10^(−8.72), from the equivalence-point pH, which reflects the conjugate base, not Ka directly.
        - |
          4.74 is pKa, not Ka.
      answer: 1
      explanation: |
        Practice 5. The half-equivalence point of a weak-acid titration reads pKa directly.

    - slug: apchem-u08-w28-q02
      type: multiple_choice
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        Graph description: 25.0 mL of 0.100 M of a weak monoprotic acid HA is titrated with 0.100 M NaOH; pH is plotted against the volume of NaOH added. The curve starts at pH 2.87, rises gradually and passes through pH 4.74 at 12.5 mL, then rises steeply near 25.0 mL, passing through pH 8.72, and levels off near pH 12.4 by 40.0 mL.
      prompt: |
        Why is the pH at the equivalence point (25.0 mL) 8.72 rather than 7.00?
      options:
        - "Excess NaOH is present at the equivalence point."
        - "The indicator raises the pH of the solution."
        - "The acid was not completely neutralised at 25.0 mL."
        - "At equivalence the solution contains the weak base A⁻, which reacts with water to produce OH⁻."
      option_explanations:
        - |
          At the equivalence point the moles of NaOH exactly equal the moles of HA; there is no excess base yet.
        - |
          An indicator is present in trace amounts and has a negligible effect on pH.
        - |
          Neutralisation is complete at 25.0 mL (2.50 × 10⁻³ mol of each); the basic pH comes from the product, not from leftover acid.
        - |
          Correct. All HA has become A⁻ (0.0500 M after dilution); A⁻ + H₂O ⇌ HA + OH⁻ with Kb = Kw/Ka = 5.6 × 10⁻¹⁰ gives [OH⁻] = 5.3 × 10⁻⁶ M, pH 8.72.
      answer: 3
      explanation: |
        Practice 6. The salt of a weak acid and a strong base is basic.

    - slug: apchem-u08-w28-q03
      type: numeric
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        Graph description: 25.0 mL of 0.100 M of a weak monoprotic acid HA is titrated with 0.100 M NaOH; pH is plotted against the volume of NaOH added. The curve starts at pH 2.87, rises gradually and passes through pH 4.74 at 12.5 mL, then rises steeply near 25.0 mL, passing through pH 8.72, and levels off near pH 12.4 by 40.0 mL.
      prompt: |
        Calculate the pH after 10.0 mL of NaOH has been added. Give your answer to two decimal places.
      answer: { value: 4.56, tolerance: 0.05 }
      explanation: |
        Moles HA initially 2.50 × 10⁻³; moles OH⁻ added 1.00 × 10⁻³, converting that much HA to A⁻: 1.50 × 10⁻³ mol HA and 1.00 × 10⁻³ mol A⁻ remain in the same volume. pH = pKa + log(A⁻/HA) = 4.74 + log(1.00/1.50) = 4.74 − 0.18 = 4.56.

    # ---- Stand-alone multiple choice
    - slug: apchem-u08-w28-q04
      type: multiple_choice
      topic_code: "8.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Which salt gives a basic solution when dissolved in water?
      options:
        - "NaNO₂"
        - "NH₄Cl"
        - "KBr"
        - "Fe(NO₃)₃"
      option_explanations:
        - |
          Correct. Na⁺ is a spectator and NO₂⁻ is the conjugate base of the weak acid HNO₂; NO₂⁻ + H₂O ⇌ HNO₂ + OH⁻ makes the solution basic.
        - |
          NH₄⁺ is the conjugate acid of the weak base NH₃; it donates protons to water, giving an acidic solution (pH about 5 for 0.1 M).
        - |
          K⁺ (from the strong base KOH) and Br⁻ (from the strong acid HBr) are both spectators; the solution is neutral.
        - |
          The hydrated Fe³⁺ ion is acidic: its bound water molecules lose protons. Nitrate is a spectator.
      answer: 0
      explanation: |
        Practice 6. Conjugate bases of weak acids make salt solutions basic.

    - slug: apchem-u08-w28-q05
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which is the correct net ionic equation for the reaction of hydrochloric acid with aqueous ammonia?
      options:
        - "HCl(aq) + NH₃(aq) → NH₄Cl(aq)"
        - "H⁺(aq) + OH⁻(aq) → H₂O(l)"
        - "H⁺(aq) + NH₃(aq) → NH₄⁺(aq)"
        - "H⁺(aq) + Cl⁻(aq) + NH₃(aq) → NH₄⁺(aq) + Cl⁻(aq)"
      option_explanations:
        - |
          This is the molecular equation; the strong acid and the soluble salt should be written as ions.
        - |
          Ammonia is a weak base and is written as the molecule, not as OH⁻; the proton transfers directly to NH₃.
        - |
          Correct. HCl is a strong acid (written as H⁺ and Cl⁻), NH₃ is a weak base (written intact), Cl⁻ is a spectator and is cancelled.
        - |
          This is the complete ionic equation; the spectator Cl⁻ must be removed.
      answer: 2
      explanation: |
        Practice 2 (review of 4.2). Strong electrolytes are split into ions; weak ones are written whole.

    - slug: apchem-u08-w28-q06
      type: multiple_choice
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      prompt: |
        A solution of ammonia is titrated with hydrochloric acid. Which indicator is the best choice, and why?
      options:
        - "Phenolphthalein (pH range 8.3–10.0), because the solution starts basic"
        - "Methyl red (pH range 4.4–6.2), because the equivalence point is at pH about 5.3 where NH₄⁺ is present"
        - "Either indicator, because every titration has an equivalence pH of 7"
        - "Phenolphthalein, because it changes colour at the half-equivalence point"
      option_explanations:
        - |
          The starting pH is irrelevant; the indicator must change at the equivalence point, which for this titration is acidic.
        - |
          Correct. At equivalence the solution contains NH₄⁺ (a weak acid), so the pH is below 7; methyl red changes colour on the steep part of the curve.
        - |
          Only a strong acid–strong base titration has equivalence at pH 7; here the conjugate acid lowers it.
        - |
          The indicator should change at the equivalence point, not at half-equivalence (pH 9.26 here), where only half the base has reacted.
      answer: 1
      explanation: |
        Practice 2. Match the indicator's range to the equivalence-point pH.

    - slug: apchem-u08-w28-q07
      type: multiple_choice
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Why is the pH exactly 7.00 at the equivalence point of a strong acid–strong base titration at 25 °C?
      options:
        - "Because the indicator used is neutral"
        - "Because the strong acid and strong base are present in equal concentrations"
        - "Because the equivalence point of every titration is at pH 7.00"
        - "Because the only species left are water and spectator ions that neither donate nor accept protons"
      option_explanations:
        - |
          Indicators are present in trace amounts and do not set the pH.
        - |
          At equivalence neither acid nor base remains; both have been consumed in the reaction H⁺ + OH⁻ → H₂O.
        - |
          Weak acid–strong base titrations end above 7 and weak base–strong acid titrations below 7.
        - |
          Correct. H⁺ + OH⁻ → H₂O leaves a solution of a salt such as NaCl whose ions are spectators, so [H₃O⁺] = [OH⁻] from water alone.
      answer: 3
      explanation: |
        Practice 6. Neutrality at equivalence requires that neither conjugate species be a weak acid or base.

    - slug: apchem-u08-w28-q08
      type: multiple_choice
      topic_code: "8.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement correctly ranks and explains the acid strengths of the hydrogen halides in water?
      options:
        - "HI > HBr > HCl > HF, because the H–X bond becomes weaker and the halide ion larger down the group."
        - "HF > HCl > HBr > HI, because the H–X bond becomes more polar up the group."
        - "All four are equally strong, because each is a binary acid with one proton."
        - "HCl > HBr > HI > HF, because chlorine is the most electronegative halogen that forms a strong acid."
      option_explanations:
        - |
          Correct. Bond strength falls from 567 kJ/mol (H–F) to 299 kJ/mol (H–I), and the larger anion spreads its charge over more volume; both effects make the proton easier to lose. HF is the only weak one.
        - |
          Polarity does rise toward HF, but down a group bond strength is the dominant factor; HF is in fact the weakest.
        - |
          Only HCl, HBr and HI are strong; HF has Ka = 6.8 × 10⁻⁴.
        - |
          Electronegativity is not the deciding factor down a group; HI is the strongest of the four.
      answer: 0
      explanation: |
        Practice 6. Down a group, weaker bond and more stable (larger) anion mean stronger acid.

    - slug: apchem-u08-w28-q09
      type: multiple_choice
      topic_code: "8.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the chlorine oxyacids is the strongest, and why?
      options:
        - "HClO, because it has the fewest oxygen atoms to compete for the proton"
        - "HClO₂, because its anion has the lowest charge"
        - "HClO₄, because its three additional oxygen atoms withdraw electron density from the O–H bond and delocalise the charge of the ClO₄⁻ anion"
        - "All four are equally strong, because each contains one acidic hydrogen bonded to oxygen"
      option_explanations:
        - |
          Fewer oxygens means less electron withdrawal and a less stable anion; HClO is the weakest (Ka = 3.0 × 10⁻⁸).
        - |
          All four anions carry a single negative charge; what differs is how well that charge is spread over oxygens.
        - |
          Correct. Each added oxygen pulls electron density toward the chlorine, polarising and weakening the O–H bond and stabilising the anion by resonance; HClO₄ is among the strongest acids known.
        - |
          The acidities span more than ten orders of magnitude, from HClO (weak) to HClO₄ (strong).
      answer: 2
      explanation: |
        Practice 6. For oxyacids, more oxygens on the central atom means a stronger acid.

    - slug: apchem-u08-w28-q10
      type: multiple_choice
      topic_code: "8.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Hypochlorous acid has pKa = 7.52. In a swimming pool at pH 5.52, what is the ratio [OCl⁻]/[HOCl]?
      options:
        - "100:1"
        - "1:100"
        - "1:1"
        - "1:2"
      option_explanations:
        - |
          A pH two units above pKa would give 100:1 in favour of OCl⁻; here the pH is below pKa.
        - |
          Correct. log([OCl⁻]/[HOCl]) = pH − pKa = 5.52 − 7.52 = −2.00, so the ratio is 10⁻² = 1:100; the protonated form HOCl dominates at a pH below pKa.
        - |
          1:1 occurs only at pH = pKa = 7.52.
        - |
          The relation is logarithmic: each pH unit is a factor of 10, so two units give a factor of 100, not 2.
      answer: 1
      explanation: |
        Practice 5. Below pKa the acid form dominates by 10 per pH unit.

    - slug: apchem-u08-w28-q11
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      prompt: |
        A 25.00 mL sample of sulfuric acid requires 18.00 mL of 0.2000 M NaOH to reach the equivalence point. What is the concentration of the H₂SO₄?
      options:
        - "0.07200 M"
        - "0.1440 M"
        - "0.03600 M"
        - "0.2880 M"
      option_explanations:
        - |
          Correct. Moles NaOH = 0.01800 L × 0.2000 M = 3.600 × 10⁻³; H₂SO₄ + 2 NaOH → Na₂SO₄ + 2 H₂O, so moles H₂SO₄ = 1.800 × 10⁻³; concentration = 1.800 × 10⁻³/0.02500 L = 0.07200 M.
        - |
          0.1440 M ignores the 2:1 mole ratio between NaOH and the diprotic acid.
        - |
          0.03600 M divides by 2 twice.
        - |
          0.2880 M multiplies by 2 instead of dividing, and ignores the volume ratio.
      answer: 0
      explanation: |
        Practice 5 (review of 4.6). Titration stoichiometry: moles titrant, mole ratio, analyte volume.

    # ---- Multi-select
    - slug: apchem-u08-w28-q12
      type: multi_select
      topic_code: "8.4"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following mixtures, after reaction, contain a buffer (a weak acid and its conjugate base, or a weak base and its conjugate acid, in comparable amounts)? Select all that apply.
      options:
        - "0.10 mol HF mixed with 0.05 mol NaOH"
        - "0.10 mol HCl mixed with 0.05 mol NaOH"
        - "0.10 mol NH₃ mixed with 0.05 mol HCl"
        - "0.10 mol CH₃COOH mixed with 0.10 mol NaOH"
        - "0.10 mol NaF mixed with 0.05 mol HCl"
      option_explanations:
        - |
          Correct. The base converts half the HF to F⁻, leaving 0.05 mol HF and 0.05 mol F⁻: a buffer.
        - |
          Both are strong; after reaction 0.05 mol HCl remains with NaCl, a strong-acid solution with no weak conjugate pair.
        - |
          Correct. The acid converts half the NH₃ to NH₄⁺, leaving 0.05 mol of each: a buffer.
        - |
          Exactly one equivalent of base converts all the acid to acetate: a salt solution (basic), not a buffer, because no weak acid remains.
        - |
          Correct. The strong acid converts half the F⁻ to HF, leaving 0.05 mol HF and 0.05 mol F⁻: the same buffer as the first option, made from the other side.
      answer: [0, 2, 4]
      explanation: |
        Practice 2. Partial neutralisation of a weak acid or weak base (from either direction) gives a buffer.

    - slug: apchem-u08-w28-q13
      type: multi_select
      topic_code: "8.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        A 0.10 M solution of a weak monoprotic acid HA has Ka = 1.0 × 10⁻⁶. Which statements about the solution at equilibrium are correct? Select all that apply.
      options:
        - "[H₃O⁺] = 3.2 × 10⁻⁴ M"
        - "The pH is 3.50"
        - "The percent ionisation is 0.32%"
        - "[A⁻] equals [H₃O⁺]"
        - "[HA] is essentially 0.10 M"
        - "The pH would be the same if HA were a strong acid"
      option_explanations:
        - |
          Correct. x = √(Ka c) = √(1.0 × 10⁻⁷) = 3.2 × 10⁻⁴ M, with the approximation valid (0.32% of 0.10).
        - |
          Correct. pH = −log(3.2 × 10⁻⁴) = 3.50.
        - |
          Correct. 3.2 × 10⁻⁴/0.10 × 100 = 0.32%.
        - |
          Correct. HA ionises to give one H₃O⁺ for every A⁻, and water's own contribution is negligible.
        - |
          Correct. Only 0.32% has ionised, so [HA] = 0.10 − 0.0003 ≈ 0.10 M.
        - |
