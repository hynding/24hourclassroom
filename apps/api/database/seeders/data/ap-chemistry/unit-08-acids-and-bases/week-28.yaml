    # ---- Numeric
    - slug: apchem-u08-w28-q18
      type: numeric
      topic_code: "8.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Calculate the pH of 0.10 M NH₄Cl at 25 °C (Kb of NH₃ = 1.8 × 10⁻⁵). Give your answer to two decimal places.
      answer: { value: 5.13, tolerance: 0.05 }
      explanation: |
        Ka(NH₄⁺) = Kw/Kb = 1.0 × 10⁻¹⁴/1.8 × 10⁻⁵ = 5.6 × 10⁻¹⁰. NH₄⁺ ⇌ H⁺ + NH₃: x² ≈ 5.6 × 10⁻¹⁰ × 0.10 = 5.6 × 10⁻¹¹, x = 7.5 × 10⁻⁶ M, pH = 5.13. Chloride is a spectator, so the solution is acidic because of the ammonium ion alone.

