      answer: ["equivalence", "equivalence point", "stoichiometric", "stoichiometric point"]
      explanation: |
        The equivalence point is defined by stoichiometry; the end point is where the indicator changes colour, and a good indicator makes the two coincide. For a weak acid titrated with strong base, the equivalence pH is above 7.

