    # ---- True / false
    - slug: apchem-u08-w28-q14
      type: true_false
      topic_code: "8.7"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: in a solution whose pH is below the pKa of a weak acid, the protonated form HA is present in greater amount than the deprotonated form A⁻.
      answer: true
      explanation: |
        True. log([A⁻]/[HA]) = pH − pKa is negative when pH < pKa, so [A⁻] < [HA]. One unit below pKa the acid form outnumbers the base form 10:1; at pH = pKa they are equal; above pKa the base form dominates.

    - slug: apchem-u08-w28-q15
      type: true_false
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: electronegativity increases across a period from left to right, so the H–F bond is more polar than the H–Cl bond, and across the second period HF is a stronger acid than H₂O, which is stronger than NH₃.
      answer: true
      explanation: |
        True. Fluorine is the most electronegative element, so H–F is the most polar hydrogen halide bond. Across a period, increasing polarity of the H–X bond makes the proton easier to lose: NH₃ (essentially no acidity) < H₂O (Ka = 1.0 × 10⁻¹⁴ as pKw) < HF (Ka = 6.8 × 10⁻⁴). Down a group, by contrast, bond strength dominates and HF is the weakest hydrogen halide acid.

    # ---- Fill in the blank
    - slug: apchem-u08-w28-q16
