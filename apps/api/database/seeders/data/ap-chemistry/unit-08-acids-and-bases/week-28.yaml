    # ---- Short answer
    - slug: apchem-u08-w28-q21
      type: short_answer
      topic_code: "8.5"
      source: "general knowledge"
      points: 3
      prompt: |
        30.0 mL of 0.150 M nitrous acid, HNO₂ (Ka = 4.5 × 10⁻⁴), is titrated with 0.150 M NaOH.
        (a) Calculate the volume of NaOH required to reach the equivalence point.
        (b) State the pH at the half-equivalence point and explain why no ICE calculation is needed there.
        (c) Calculate the pH at the equivalence point.
      answer: |
        (a) Moles HNO₂ = 0.0300 L × 0.150 M = 4.50 × 10⁻³ mol; 1:1 with NaOH, so V = 4.50 × 10⁻³/0.150 = 0.0300 L = 30.0 mL.
        (b) At half-equivalence (15.0 mL) half the acid has been converted to NO₂⁻, so [HNO₂] = [NO₂⁻] and Ka = [H⁺]: pH = pKa = −log(4.5 × 10⁻⁴) = 3.35.
        (c) At equivalence, 4.50 × 10⁻³ mol NO₂⁻ in 60.0 mL = 0.0750 M. Kb = Kw/Ka = 2.2 × 10⁻¹¹; x = √(2.2 × 10⁻¹¹ × 0.0750) = 1.3 × 10⁻⁶ M OH⁻; pOH = 5.89; pH = 8.11.
      explanation: |
        Three points.

        (a) 1 pt: 30.0 mL.
        (b) 1 pt: pH = pKa = 3.35 with the reason [HA] = [A⁻].
        (c) 1 pt: pH 8.11 (accept 8.08–8.12) via the diluted concentration and Kb.

    - slug: apchem-u08-w28-q22
      type: short_answer
      topic_code: "7.12"
      source: "general knowledge"
      points: 3
      prompt: |
        A 0.10 M solution of HF (Ka = 6.8 × 10⁻⁴) has [H⁺] = 7.9 × 10⁻³ M. Solid NaF is dissolved in it until [F⁻] = 0.10 M, with no change in volume.
        (a) Calculate Q for HF ⇌ H⁺ + F⁻ immediately after the NaF dissolves, using the concentrations at that instant, and compare it with Ka.
        (b) State the direction of the net reaction and its effect on [H⁺].
        (c) Explain how this common-ion effect is related to the common-ion effect on the solubility of a sparingly soluble salt.
      answer: |
        (a) Just after dissolving, [HF] ≈ 0.092 M, [H⁺] = 7.9 × 10⁻³ M and [F⁻] ≈ 0.10 + 0.008 = 0.108 M (accept 0.10 M). Q = (7.9 × 10⁻³)(0.108)/0.092 = 9.3 × 10⁻³, far above Ka = 6.8 × 10⁻⁴.
        (b) Q > K, so the reverse reaction proceeds: H⁺ combines with F⁻ to re-form HF, and [H⁺] falls sharply (to about 6 × 10⁻⁴ M, pH about 3.2 instead of 2.1).
        (c) In both cases an ion that appears as a product of the equilibrium is added from another source, raising Q above K and shifting the equilibrium toward the undissociated form: toward HF here, toward the solid for AgCl in NaCl. Suppressing the ionisation of a weak acid with its conjugate base is exactly what a buffer does.
      explanation: |
        Three points.

        (a) 1 pt: Q ≈ 9 × 10⁻³ (accept 8–10 × 10⁻³) and Q > Ka.
        (b) 1 pt: reverse direction, [H⁺] decreases (pH rises).
        (c) 1 pt: parallel drawn with Ksp: added product ion, Q > K, shift toward the undissociated species.

    # ---- Long answer
    - slug: apchem-u08-w28-q23
      type: long_answer
      topic_code: "8.5"
      source: "general knowledge"
      points: 6
      prompt: |
        50.0 mL of 0.100 M aqueous ammonia (Kb = 1.8 × 10⁻⁵) is titrated with 0.100 M HCl at 25 °C.
        (a) Write the net ionic equation for the titration reaction and calculate the volume of HCl needed to reach equivalence.
        (b) Calculate the pH of the ammonia solution before any acid is added.
        (c) Calculate the pH after 25.0 mL of HCl has been added, and explain why this point is significant.
        (d) Calculate the pH at the equivalence point.
        (e) Calculate the pH after 60.0 mL of HCl has been added.
        (f) Describe the shape of the titration curve and choose a suitable indicator from phenolphthalein (8.3–10.0) and methyl red (4.4–6.2), with justification.
      answer: |
        (a) NH₃(aq) + H⁺(aq) → NH₄⁺(aq). Moles NH₃ = 0.0500 L × 0.100 M = 5.00 × 10⁻³ mol; 1:1, so V = 5.00 × 10⁻³/0.100 = 50.0 mL.
        (b) Weak base: x = √(1.8 × 10⁻⁵ × 0.100) = 1.3 × 10⁻³ M OH⁻; pOH = 2.87; pH = 11.13.
        (c) 2.50 × 10⁻³ mol H⁺ converts half the NH₃ to NH₄⁺, leaving 2.50 × 10⁻³ mol of each: the half-equivalence point, where pOH = pKb = 4.74 and pH = 9.26 (equivalently pH = pKa(NH₄⁺) = 9.26). It is significant because the solution is a buffer at its maximum effectiveness and pKb (or pKa) can be read directly from the curve.
        (d) All 5.00 × 10⁻³ mol has become NH₄⁺ in 100.0 mL: 0.0500 M. Ka(NH₄⁺) = Kw/Kb = 5.6 × 10⁻¹⁰; x = √(5.6 × 10⁻¹⁰ × 0.0500) = 5.3 × 10⁻⁶ M H⁺; pH = 5.28.
        (e) Excess H⁺ = (0.0600 − 0.0500) L × 0.100 M = 1.00 × 10⁻³ mol in 0.110 L: [H⁺] = 9.1 × 10⁻³ M; pH = 2.04. NH₄⁺ is a far weaker acid and contributes negligibly.
        (f) The curve starts high (11.13), falls through a flattish buffer region centred on pH 9.26 at 25.0 mL, drops steeply through the equivalence point at 50.0 mL and pH 5.28, then levels off toward the pH of dilute HCl (about 2). Methyl red is suitable: its range (4.4–6.2) brackets the equivalence pH of 5.28 on the steep part of the curve; phenolphthalein would change colour at pH 8–10, well before equivalence, in the buffer region.
      explanation: |
        Six points.

        (a) 1 pt: net ionic equation and 50.0 mL.
        (b) 1 pt: pH 11.13 (accept 11.1–11.2).
        (c) 1 pt: pH 9.26 identified as half-equivalence (pOH = pKb or pH = pKa) with its significance.
        (d) 1 pt: 0.0500 M NH₄⁺ and pH 5.28 (accept 5.25–5.30).
        (e) 1 pt: pH 2.04 (accept 2.0–2.1) from excess strong acid.
        (f) 1 pt: curve shape (start high, buffer region, steep drop below 7, levelling) and methyl red justified by the equivalence pH.
