    # ---- Short answer
    - slug: apchem-u08-w29-q21
      type: short_answer
      topic_code: "8.10"
      source: "general knowledge"
      points: 3
      prompt: |
        Two acetate buffers (pKa 4.74) are prepared, each 1.0 L. Buffer X is 1.0 M CH₃COOH / 1.0 M CH₃COO⁻; buffer Y is 0.010 M CH₃COOH / 0.010 M CH₃COO⁻. To each, 0.010 mol of HCl is added without changing the volume.
        (a) Calculate the pH of each buffer before the addition.
        (b) Calculate the pH of buffer X after the addition.
        (c) Explain what happens to buffer Y, calculate its pH after the addition, and state what this shows about buffer capacity.
      answer: |
        (a) Both have a 1:1 ratio, so pH = pKa = 4.74 for X and for Y.
        (b) H⁺ + CH₃COO⁻ → CH₃COOH: acetate 1.00 → 0.99 mol, acid 1.00 → 1.01 mol. pH = 4.74 + log(0.99/1.01) = 4.74 − 0.01 = 4.73.
        (c) In Y the 0.010 mol of H⁺ reacts with all 0.010 mol of acetate: the buffer is exhausted and the solution is simply 0.020 M acetic acid. x = √(1.8 × 10⁻⁵ × 0.020) = 6.0 × 10⁻⁴ M, pH = 3.22. Same initial pH, same ratio, but Y has only 1% of X's reserve of base: buffer capacity depends on the concentrations of the components, not on the pH.
      explanation: |
        Three points.

        (a) 1 pt: both pH 4.74 (ratio 1).
        (b) 1 pt: pH 4.73 (accept 4.73–4.74 with the stoichiometry shown).
        (c) 1 pt: acetate completely consumed, weak-acid calculation giving pH 3.2 (accept 3.2–3.3), and the conclusion that capacity scales with concentration.

    - slug: apchem-u08-w29-q22
      type: short_answer
      topic_code: "7.10"
      source: "general knowledge"
      points: 3
      prompt: |
        A buffer contains HOCl and OCl⁻ in equal concentrations (Ka = 3.0 × 10⁻⁸). A small amount of NaOH is added.
        (a) Write the equation for the reaction that consumes the added OH⁻.
        (b) Using the equilibrium HOCl ⇌ H⁺ + OCl⁻, explain in terms of Q and Ka why [H⁺] changes only slightly after the addition.
        (c) State whether the new pH is above or below the original and explain how far it can move before the buffer is no longer effective.
      answer: |
        (a) OH⁻(aq) + HOCl(aq) → OCl⁻(aq) + H₂O(l).
        (b) The reaction removes some HOCl and adds the same amount of OCl⁻. Immediately afterwards [H⁺] is unchanged, so Q = [H⁺][OCl⁻]/[HOCl] is slightly larger than Ka (numerator up, denominator down). The reverse reaction then consumes a little H⁺ until Q = Ka again. Because [H⁺] = Ka × [HOCl]/[OCl⁻] and the ratio has changed only slightly, the new [H⁺] is only slightly smaller than before.
        (c) Above (less H⁺). The buffer remains effective while the ratio [OCl⁻]/[HOCl] stays between about 1/10 and 10, i.e. within about one pH unit of pKa (7.52): roughly pH 6.5 to 8.5. Beyond that, too little HOCl remains to absorb further base and the pH climbs steeply.
      explanation: |
        Three points.

        (a) 1 pt: correct equation with HOCl consuming OH⁻.
        (b) 1 pt: Q compared with Ka after the addition and the small adjustment of [H⁺] tied to the small change in the ratio.
        (c) 1 pt: pH rises; effective range pKa ± 1 (about 6.5–8.5) with the reason (one component depleted).

    # ---- Long answer
    - slug: apchem-u08-w29-q23
      type: long_answer
      topic_code: "8.9"
      source: "general knowledge"
      points: 6
      prompt: |
        A biochemist needs 1.00 L of a buffer at pH 7.40. Available: NaH₂PO₄ (pKa of H₂PO₄⁻ = 7.21), Na₂HPO₄ (molar mass 141.96 g/mol), acetic acid (pKa 4.74), sodium acetate, and 1.0 M HCl.
        (a) Choose the better conjugate pair for this buffer and justify the choice.
        (b) Calculate the ratio [HPO₄²⁻]/[H₂PO₄⁻] required for pH 7.40.
        (c) If the buffer is made with 0.100 mol of NaH₂PO₄, calculate the mass of Na₂HPO₄ needed.
        (d) Calculate the pH after 0.020 mol of HCl is added to the buffer (no volume change), showing the reaction that occurs.
        (e) Calculate the pH that 0.020 mol of HCl would produce in 1.00 L of pure water, and comment.
        (f) State the maximum amount of HCl this buffer could absorb before being exhausted, and the approximate pH range over which the phosphate pair is a useful buffer.
      answer: |
        (a) H₂PO₄⁻/HPO₄²⁻: its pKa (7.21) is within 0.2 of the target, so both components will be present in comparable amounts and the buffer has capacity against both acid and base. Acetate (pKa 4.74) would need a ratio of about 460:1, leaving almost no acetic acid to absorb added base, and lies far outside its pKa ± 1 range.
        (b) log(ratio) = 7.40 − 7.21 = 0.19, so [HPO₄²⁻]/[H₂PO₄⁻] = 10^(0.19) = 1.5.
        (c) Moles Na₂HPO₄ = 1.5 × 0.100 = 0.155 mol (using 1.55); mass = 0.155 mol × 141.96 g/mol = 22 g.
        (d) H⁺ + HPO₄²⁻ → H₂PO₄⁻. HPO₄²⁻: 0.155 − 0.020 = 0.135 mol; H₂PO₄⁻: 0.100 + 0.020 = 0.120 mol. pH = 7.21 + log(0.135/0.120) = 7.21 + 0.05 = 7.26.
        (e) [H⁺] = 0.020 M, pH = 1.70. The buffer held the change to 0.14 units where water fell by 5.3 units.
        (f) The base component is 0.155 mol, so about 0.155 mol of HCl would exhaust it (after which the solution would be 0.255 M H₂PO₄⁻ at a pH set by its own ionisation, about 4.7). The pair is useful within about pKa ± 1, i.e. pH 6.2 to 8.2.
      explanation: |
        Six points.

        (a) 1 pt: phosphate pair chosen with the pKa-within-1 justification (and acetate rejected).
        (b) 1 pt: ratio = 1.5 (accept 1.5–1.6).
        (c) 1 pt: about 0.155 mol and 22 g (accept 21–22 g).
        (d) 1 pt: correct reaction, new moles 0.135/0.120 and pH 7.26 (accept 7.25–7.27).
        (e) 1 pt: pH 1.70 and a comparison with the buffered change.
        (f) 1 pt: about 0.15 mol of HCl exhausts it; effective range about pH 6.2–8.2.
