week: 29
unit: 8
title: "Buffers: Properties, Henderson–Hasselbalch and Capacity"
topics: ["8.8", "8.9", "8.10"]
guide: guides/week-29.md
guide_description: |
  How a buffer absorbs added strong acid with its conjugate base and added strong base with its weak acid,
  which mixtures qualify and why blood stays at pH 7.40; the Henderson–Hasselbalch equation for the pH of a
  buffer, for designing a buffer at a target pH and for the pH after an addition (stoichiometry first); and
  buffer capacity as a function of concentration and of the base/acid ratio, with the pKa ± 1 working range
  and exhausted buffers. Worked examples for acetate, HF/F⁻, ammonia and phosphate buffers.
flashcards_description: |
  28 cards on buffer action, recognising buffers, the Henderson–Hasselbalch equation in its three uses, and
  the two determinants of buffer capacity.

flashcards:
  - front: Buffer → definition
    back: |
      A solution containing a weak acid and its conjugate base (or a weak base and its conjugate acid) in comparable amounts, which resists changes in pH when small amounts of strong acid or base are added.
    topic_code: "8.8"
  - front: How an acetate buffer absorbs added strong acid
    back: |
      H⁺(aq) + CH₃COO⁻(aq) → CH₃COOH(aq): the conjugate base converts the strong acid into the weak acid, which barely ionises. The base/acid ratio falls slightly, so the pH drops only a little.
    topic_code: "8.8"
  - front: How an acetate buffer absorbs added strong base
    back: |
      OH⁻(aq) + CH₃COOH(aq) → CH₃COO⁻(aq) + H₂O(l): the weak acid converts the strong base into the weak base acetate. The ratio rises slightly, so the pH rises only a little.
    topic_code: "8.8"
  - front: "Worked comparison of buffer versus water receiving 0.010 mol HCl per litre"
    back: |
      0.10 M/0.10 M acetate buffer: ratio becomes 0.09/0.11, pH 4.74 → 4.65. Pure water: [H⁺] = 0.010 M, pH 7.00 → 2.00. A change of 0.09 units against 5 units.
    topic_code: "8.8"
  - front: Mixtures that are buffers
    back: |
      Weak acid + its salt (HNO₂ + KNO₂); weak base + its salt (NH₃ + NH₄Cl); weak acid + less than one equivalent of strong base; weak base + less than one equivalent of strong acid; a salt of a weak acid + less than one equivalent of strong acid.
    topic_code: "8.8"
  - front: Mixtures that are not buffers
    back: |
      A strong acid with its salt (HCl + NaCl: Cl⁻ cannot accept H⁺); a weak acid alone (nothing to absorb added acid); a weak acid with exactly one or more equivalents of strong base (all converted to the conjugate base or excess OH⁻ remains).
    topic_code: "8.8"
  - front: The bicarbonate buffer of blood
    back: |
      H₂CO₃/HCO₃⁻ (effective pKa 6.1 at body conditions) holds blood at pH 7.40 with an HCO₃⁻/H₂CO₃ ratio near 20:1; CO₂ + H₂O ⇌ H₂CO₃ supplies the acid and the lungs and kidneys adjust both components.
    topic_code: "8.8"
  - front: Common buffer pairs and their pKa values
    back: |
      HF/F⁻ 3.17; CH₃COOH/CH₃COO⁻ 4.74; H₂CO₃/HCO₃⁻ 6.37 (6.1 in blood); H₂PO₄⁻/HPO₄²⁻ 7.21; HOCl/OCl⁻ 7.52; NH₄⁺/NH₃ 9.25.
    topic_code: "8.8"
  - front: Why a buffer's pH is set by a ratio, not by amounts
    back: |
      [H⁺] = Ka × [HA]/[A⁻]. Only the ratio of the two components enters; doubling both leaves the pH unchanged (but doubles the capacity).
    topic_code: "8.8"
  - front: Henderson–Hasselbalch equation
    back: |
      pH = pKa + log([A⁻]/[HA]), i.e. pH = pKa + log(base/acid). It is the Ka expression solved for [H⁺] and expressed in logarithms. For a weak-base buffer, pOH = pKb + log([BH⁺]/[B]).
    topic_code: "8.9"
  - front: Deriving Henderson–Hasselbalch from Ka
    back: |
      Ka = [H⁺][A⁻]/[HA] → [H⁺] = Ka[HA]/[A⁻] → −log[H⁺] = −log Ka − log([HA]/[A⁻]) → pH = pKa + log([A⁻]/[HA]).
    topic_code: "8.9"
  - front: "Worked pH of 0.20 M acetic acid with 0.30 M acetate"
    back: |
      pH = 4.74 + log(0.30/0.20) = 4.74 + 0.18 = 4.92.
    topic_code: "8.9"
  - front: Moles or concentrations in the ratio?
    back: |
      Within one solution both components share the volume, so the ratio of moles equals the ratio of molarities; use whichever is handier. When solutions are mixed, work in moles (or dilute both to the final volume).
    topic_code: "8.9"
  - front: Designing a buffer for a target pH
    back: |
      Choose a pair with pKa within 1 of the target, then set log(base/acid) = pH − pKa. For pH 5.00 with acetic acid: ratio = 10^(0.26) = 1.8, so 0.18 mol acetate per 0.10 mol acid.
    topic_code: "8.9"
  - front: Procedure for the pH after adding strong acid or base to a buffer
    back: |
      Stoichiometry first: the strong reagent reacts completely with one buffer component (moles). Then put the new moles of acid and base into pH = pKa + log(base/acid).
    topic_code: "8.9"
  - front: "Worked HF/F⁻ buffer receiving NaOH"
    back: |
      0.25 mol HF, 0.40 mol F⁻ (pKa 3.17): pH = 3.37. Add 0.050 mol NaOH: HF 0.20, F⁻ 0.45; pH = 3.17 + log(0.45/0.20) = 3.52.
    topic_code: "8.9"
  - front: When Henderson–Hasselbalch is not valid
    back: |
      When one component is nearly used up or absent (then solve the weak-acid or weak-base ICE), when the strong reagent exceeds the buffer component (excess strong reagent sets the pH), or when the components are so dilute that x is not negligible.
    topic_code: "8.9"
  - front: Weak-base buffers in Henderson–Hasselbalch form
    back: |
      Use the conjugate acid's pKa: for NH₃/NH₄⁺, pH = 9.25 + log([NH₃]/[NH₄⁺]). A pH of 9.00 needs [NH₃]/[NH₄⁺] = 10^(−0.25) = 0.56.
    topic_code: "8.9"
  - front: Buffer capacity → definition
    back: |
      The amount of strong acid or strong base a buffer can absorb before its pH changes by a large amount. It depends on the concentrations of the components and on their ratio.
    topic_code: "8.10"
  - front: Effect of concentration on buffer capacity
    back: |
      At the same ratio, a 1.0 M/1.0 M buffer absorbs ten times as much acid or base as a 0.10 M/0.10 M buffer before the same pH change. The pH is the same; the reserves differ.
    topic_code: "8.10"
  - front: "Worked exhaustion of a dilute buffer"
    back: |
      0.010 M/0.010 M acetate buffer (1.0 L) receives 0.010 mol HCl: all the acetate is consumed, leaving 0.020 M acetic acid, pH 3.22. The 1.0 M/1.0 M buffer under the same addition moves only from 4.74 to 4.73.
    topic_code: "8.10"
  - front: Effect of the base/acid ratio on capacity
    back: |
      Capacity is greatest when the ratio is 1 (pH = pKa): equal reserves against acid and base, and the log term changes most slowly. A buffer resists added acid in proportion to its base and added base in proportion to its acid.
    topic_code: "8.10"
  - front: Effective pH range of a buffer
    back: |
      About pKa ± 1, where the ratio lies between 1/10 and 10. Acetate buffers pH 3.7–5.7; ammonia 8.3–10.3; phosphate 6.2–8.2.
    topic_code: "8.10"
  - front: Buffer capacity on a titration curve
    back: |
      The flat buffer region centred on the half-equivalence point shows the capacity: the flatter and longer, the greater. Capacity is greatest at half-equivalence and zero at the equivalence point.
    topic_code: "8.10"
  - front: Signs that a buffer has been exhausted
    back: |
      The pH jumps by more than about one unit on a small further addition; one component's moles reach zero in the stoichiometry; the Henderson–Hasselbalch ratio would be zero or infinite.
    topic_code: "8.10"
  - front: "Worked 0.50 M/0.50 M acetate buffer receiving 0.10 mol HCl or NaOH"
    back: |
      After HCl: 4.74 + log(0.40/0.60) = 4.56. After NaOH: 4.74 + log(0.60/0.40) = 4.92. Either addition of 0.60 mol would exhaust it.
    topic_code: "8.10"
  - front: Ranking buffers by capacity toward added acid
    back: |
      The amount of conjugate base decides it: 0.10 M HA/0.50 M A⁻ and 0.50 M/0.50 M absorb acid equally well, both better than 0.10 M/0.10 M or 0.50 M HA/0.10 M A⁻. Toward base, rank by the amount of acid.
    topic_code: "8.10"
  - front: Buffers as the common-ion effect
    back: |
      Adding the conjugate base to a weak acid is adding a product ion: Q rises above Ka, the ionisation is pushed back and [H⁺] falls, exactly as added Cl⁻ pushes AgCl toward the solid. The buffer's two reservoirs are what resist later additions.
    topic_code: "8.8"

quiz:
  description: |
    23 questions · about 45 minutes · topics 8.8–8.10 (how buffers work and which mixtures are buffers, the
    Henderson–Hasselbalch equation, and buffer capacity), with review of the common-ion effect, the buffer
    region of a titration curve, pH versus pKa, Ka, strong-acid pH, acid–base reactions and Q versus K.
    Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: an acetate buffer (8.8, 8.9)
    - slug: apchem-u08-w29-q01
      type: multiple_choice
      topic_code: "8.9"
      source: "general knowledge"
      points: 1
      stimulus: |
        A buffer is prepared by dissolving 0.30 mol of sodium acetate, NaCH₃COO, in 1.00 L of 0.20 M acetic acid (pKa = 4.74) with no change in volume.
      prompt: |
        What is the pH of the buffer?
      options:
        - "4.56"
        - "4.74"
        - "4.92"
        - "5.26"
      option_explanations:
        - |
          4.56 results from inverting the ratio (log(0.20/0.30) = −0.18); adding base above the acid must raise the pH above pKa.
        - |
          4.74 is pKa, the pH only when the acid and base are present in equal amounts.
        - |
          Correct. pH = pKa + log([A⁻]/[HA]) = 4.74 + log(0.30/0.20) = 4.74 + 0.18 = 4.92.
        - |
          5.26 would need a base/acid ratio of about 3.3, not 1.5.
      answer: 2
      explanation: |
        Practice 5. More conjugate base than acid puts the pH above pKa by log(ratio).

    - slug: apchem-u08-w29-q02
      type: multiple_choice
      topic_code: "8.8"
      source: "general knowledge"
      points: 1
      stimulus: |
        A buffer is prepared by dissolving 0.30 mol of sodium acetate, NaCH₃COO, in 1.00 L of 0.20 M acetic acid (pKa = 4.74) with no change in volume.
      prompt: |
        A small amount of HCl is added to the buffer. Which equation shows the reaction that limits the change in pH?
      options:
        - "H⁺(aq) + CH₃COO⁻(aq) → CH₃COOH(aq)"
        - "H⁺(aq) + OH⁻(aq) → H₂O(l)"
        - "CH₃COOH(aq) → H⁺(aq) + CH₃COO⁻(aq)"
        - "H⁺(aq) + Na⁺(aq) + Cl⁻(aq) → NaCl(aq) + H⁺(aq)"
      option_explanations:
        - |
          Correct. The conjugate base acetate accepts the added protons, converting the strong acid into the weak acid acetic acid; the ratio [A⁻]/[HA] falls only slightly.
        - |
          The buffer contains almost no OH⁻ (pH 4.92); the added acid is absorbed by acetate, not hydroxide.
        - |
          Ionisation of the acid would release more H⁺, the opposite of what is needed; added acid pushes this equilibrium left.
        - |
          Sodium and chloride are spectators; this is not a chemical change.
      answer: 0
      explanation: |
        Practice 6. The base component neutralises added acid; the acid component neutralises added base.

    - slug: apchem-u08-w29-q03
      type: numeric
      topic_code: "8.9"
      source: "general knowledge"
      points: 1
      stimulus: |
        A buffer is prepared by dissolving 0.30 mol of sodium acetate, NaCH₃COO, in 1.00 L of 0.20 M acetic acid (pKa = 4.74) with no change in volume.
      prompt: |
        0.050 mol of solid NaOH is dissolved in the buffer with no change in volume. Calculate the new pH. Give your answer to two decimal places.
      answer: { value: 5.11, tolerance: 0.04 }
      explanation: |
        OH⁻ + CH₃COOH → CH₃COO⁻ + H₂O converts 0.050 mol of acid to base: acetic acid 0.20 → 0.15 mol, acetate 0.30 → 0.35 mol. pH = 4.74 + log(0.35/0.15) = 4.74 + 0.37 = 5.11. The same NaOH in 1.00 L of water would give pH 12.70.

    # ---- Stand-alone multiple choice
    - slug: apchem-u08-w29-q04
      type: multiple_choice
      topic_code: "8.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Which solution is a buffer?
      options:
        - "0.10 M HNO₃ and 0.10 M KNO₃"
        - "0.10 M NaOH and 0.10 M NaCl"
        - "0.10 M HNO₂ only"
        - "0.10 M HNO₂ and 0.10 M KNO₂"
      option_explanations:
        - |
          Nitric acid is strong and nitrate is a spectator with no tendency to accept protons; added base simply neutralises the acid and the pH swings.
        - |
          Sodium hydroxide is a strong base and chloride cannot donate protons; this is not a conjugate pair.
        - |
          A weak acid alone has no reservoir of conjugate base to absorb added acid; its pH drops sharply on adding HCl.
        - |
          Correct. Nitrous acid (weak, pKa 3.35) and its conjugate base nitrite in comparable amounts can absorb both added acid and added base.
      answer: 3
      explanation: |
        Practice 2. A buffer needs both members of a weak conjugate pair.

    - slug: apchem-u08-w29-q05
      type: multiple_choice
      topic_code: "8.4"
      source: "general knowledge"
      points: 1
      prompt: |
        50.0 mL of 0.20 M NH₃ is mixed with 25.0 mL of 0.20 M HCl. Which statement about the resulting solution is correct?
      options:
        - "It is a solution of NH₄Cl only, with pH below 7."
        - "It is a buffer containing equal moles of NH₃ and NH₄⁺, with pH = pKa(NH₄⁺) = 9.25."
        - "It contains excess strong acid, with pH below 2."
        - "It is a buffer with pH = pKb(NH₃) = 4.74."
      option_explanations:
        - |
          Only 5.0 × 10⁻³ mol of HCl was added against 1.0 × 10⁻² mol of NH₃; half the ammonia remains.
        - |
          Correct. H⁺ + NH₃ → NH₄⁺ consumes all 5.0 × 10⁻³ mol of H⁺ and half the NH₃, leaving 5.0 × 10⁻³ mol each of NH₃ and NH₄⁺: a 1:1 buffer whose pH equals the pKa of the conjugate acid.
        - |
          The acid is the limiting reagent and is completely consumed by the excess ammonia.
        - |
          pKb is 4.74 but refers to pOH; the pH of the 1:1 buffer is 14.00 − 4.74 = 9.26, i.e. pKa of NH₄⁺.
      answer: 1
      explanation: |
        Practice 5 (review of 8.4). Partial neutralisation of a weak base makes a buffer.

    - slug: apchem-u08-w29-q06
      type: multiple_choice
      topic_code: "8.9"
      source: "general knowledge"
      points: 1
      prompt: |
        A chemist needs a buffer at pH 7.40. Which conjugate pair is the best choice? (pKa values: HF 3.17; CH₃COOH 4.74; H₂PO₄⁻ 7.21; NH₄⁺ 9.25)
      options:
        - "CH₃COOH / CH₃COO⁻"
        - "H₂PO₄⁻ / HPO₄²⁻"
        - "NH₄⁺ / NH₃"
        - "HF / F⁻"
      option_explanations:
        - |
          A pH of 7.40 is 2.7 units above the acetate pKa; the required ratio would be about 460:1 and the buffer would have almost no capacity against base.
        - |
          Correct. pKa 7.21 is within 1 unit of 7.40, so the required ratio [HPO₄²⁻]/[H₂PO₄⁻] = 10^(0.19) = 1.5 keeps both components in good supply.
        - |
          pKa 9.25 is 1.85 units above the target; the ratio would be 1:70, leaving too little base to absorb added acid.
        - |
          pKa 3.17 is over 4 units away; the buffer would be useless at pH 7.40.
      answer: 1
      explanation: |
        Practice 2. Choose a pair whose pKa is within about 1 unit of the target pH.

    - slug: apchem-u08-w29-q07
      type: multiple_choice
      topic_code: "8.9"
      source: "general knowledge"
      points: 1
      prompt: |
        What ratio [CH₃COO⁻]/[CH₃COOH] gives an acetate buffer a pH of 5.00? (pKa = 4.74)
      options:
        - "0.26"
        - "0.56"
        - "1.0"
        - "1.8"
      option_explanations:
        - |
          0.26 is the value of log(ratio), not the ratio itself.
        - |
          0.56 is 10^(−0.26), the ratio for pH 4.48; a pH above pKa needs a ratio above 1.
        - |
          A 1:1 ratio gives pH = pKa = 4.74, not 5.00.
        - |
          Correct. log(ratio) = pH − pKa = 5.00 − 4.74 = 0.26, so ratio = 10^(0.26) = 1.8: about 1.8 mol of acetate per mole of acetic acid.
      answer: 3
      explanation: |
        Practice 5. Solve Henderson–Hasselbalch for the ratio.

    - slug: apchem-u08-w29-q08
      type: multiple_choice
      topic_code: "8.10"
      source: "general knowledge"
      points: 1
      prompt: |
        Buffer P is 1.0 M acetic acid / 1.0 M sodium acetate; buffer Q is 0.010 M acetic acid / 0.010 M sodium acetate. Both have pH 4.74. 0.010 mol of HCl is added to 1.0 L of each. Which statement is correct?
      options:
        - "P's pH changes very little (to about 4.73); Q's acetate is completely consumed and its pH falls to about 3.2."
        - "Both change by the same amount, because they have the same pH and the same ratio."
        - "Q's pH changes less, because dilute solutions are less affected by added acid."
        - "P's pH falls more, because it contains more acid to begin with."
      option_explanations:
        - |
          Correct. In P the ratio becomes 0.99/1.01, pH 4.73. In Q the 0.010 mol of H⁺ uses up all 0.010 mol of acetate, leaving 0.020 M acetic acid alone: pH = −log √(1.8 × 10⁻⁵ × 0.020) = 3.22. Capacity scales with concentration.
        - |
          The same pH does not mean the same capacity; the amount of base available to react is 100 times larger in P.
        - |
          The opposite: the dilute buffer has a tiny reserve of base and is exhausted by this addition.
        - |
          The acid already present does not react with added H⁺; what matters is the base, and P has far more of it.
      answer: 0
      explanation: |
        Practice 6. Buffer capacity is proportional to the amount of the reacting component.

    - slug: apchem-u08-w29-q09
      type: multiple_choice
      topic_code: "8.10"
      source: "general knowledge"
      points: 1
      prompt: |
        Why is a buffer most effective when its pH is close to the pKa of the weak acid?
      options:
        - "Because at pH = pKa the acid is fully ionised, so it can absorb the most base."
        - "Because at pH = pKa the buffer contains no conjugate base, so added base is absorbed efficiently."
        - "Because at pH = pKa the acid and conjugate base are present in equal amounts, giving reserves against both added acid and added base, and the log term changes most slowly."
        - "Because Ka is largest at pH = pKa."
      option_explanations:
        - |
          At pH = pKa the acid is half-ionised, not fully; and full ionisation would leave nothing to absorb base.
        - |
          At pH = pKa the base equals the acid; a buffer with no conjugate base could not absorb added acid at all.
        - |
          Correct. With a 1:1 ratio the buffer can neutralise comparable amounts of acid or base, and the pH shifts by only log(new ratio), which is smallest near a ratio of 1. The useful range is about pKa ± 1.
        - |
          Ka is a constant at a given temperature; it does not depend on pH.
      answer: 2
      explanation: |
        Practice 6. Equal reserves and the shape of the log function make pH ≈ pKa the sweet spot.

    - slug: apchem-u08-w29-q10
      type: multiple_choice
      topic_code: "8.10"
      source: "general knowledge"
      points: 1
      prompt: |
        On the titration curve of a weak acid with a strong base, where is the buffer capacity of the solution in the flask greatest?
      options:
        - "At the equivalence point"
        - "At the half-equivalence point"
        - "Before any base has been added"
        - "Well past the equivalence point"
      option_explanations:
        - |
          At equivalence the acid has been completely converted to its conjugate base; with only one component present the capacity is essentially zero, which is why the curve is steepest there.
        - |
          Correct. At half-equivalence [HA] = [A⁻], the pH equals pKa and the curve is flattest: the solution absorbs the most base (or acid) per unit change in pH.
        - |
          Before any base is added only the weak acid is present; there is no conjugate base to absorb added acid.
        - |
          Past equivalence the solution is dominated by excess strong base; it is not a buffer.
      answer: 1
      explanation: |
        Practice 4. The flat region of a titration curve is the buffer region; it is flattest at pH = pKa.

    - slug: apchem-u08-w29-q11
      type: multiple_choice
      topic_code: "7.12"
      source: "general knowledge"
      points: 1
      prompt: |
        Sodium acetate is added to a solution of acetic acid. Which statement correctly describes the effect and its cause?
      options:
        - "[H⁺] decreases because acetate ion is a common ion that shifts CH₃COOH ⇌ H⁺ + CH₃COO⁻ toward the undissociated acid."
        - "[H⁺] increases because sodium acetate is a salt and salts are acidic."
        - "[H⁺] is unchanged because Ka is a constant."
        - "[H⁺] decreases because sodium ions react with hydrogen ions."
      option_explanations:
        - |
          Correct. Adding the product ion acetate raises Q above Ka; the reverse reaction consumes H⁺ until Q = Ka again. This is the common-ion effect, and the resulting mixture is a buffer.
        - |
          Sodium acetate is the salt of a weak acid and a strong base; its anion is a weak base, and the effect on H⁺ is a decrease.
        - |
          Ka is constant, but the concentrations adjust to keep the ratio constant; with more acetate, less H⁺ is needed to satisfy Ka.
        - |
          Na⁺ is a spectator; the effect is entirely due to acetate.
      answer: 0
      explanation: |
        Practice 6 (review of 7.12). A buffer is the common-ion effect applied to a weak acid.

    # ---- Multi-select
    - slug: apchem-u08-w29-q12
      type: multi_select
      topic_code: "8.8"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following solutions are buffers? Where two solutions are mixed, equal volumes are combined. Select all that apply.
      options:
        - "0.10 M H₂CO₃ with 0.10 M NaHCO₃"
        - "0.10 M NaOH with 0.10 M NaCl"
        - "0.10 M NH₄Cl with 0.10 M NH₃"
        - "0.20 M HF mixed with 0.10 M NaOH"
        - "0.10 M HCl mixed with 0.10 M NaCH₃COO"
        - "0.10 M CH₃COOH alone"
      option_explanations:
        - |
          Correct. Carbonic acid and bicarbonate are a weak conjugate pair in comparable amounts.
        - |
          A strong base with a spectator salt; chloride cannot donate a proton, so added acid is not buffered.
        - |
          Correct. Ammonium and ammonia are a weak conjugate pair.
        - |
          Correct. The NaOH converts half the HF to F⁻ (0.10 mol HF to 0.05 mol HF and 0.05 mol F⁻ per litre of each), leaving both components.
        - |
          Equal moles of HCl and acetate react completely to give acetic acid and NaCl: a weak-acid solution, not a buffer, because no conjugate base remains.
        - |
          A weak acid alone has no conjugate base reservoir.
      answer: [0, 2, 3]
      explanation: |
        Practice 2. Look for both members of a weak conjugate pair after any reaction has run.

    - slug: apchem-u08-w29-q13
      type: multi_select
      topic_code: "8.5"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the buffer region of the titration curve of a weak acid HA with NaOH are correct? Select all that apply.
      options:
        - "The pH at the midpoint of the region equals pKa of HA."
        - "Throughout the region the solution contains both HA and A⁻."
        - "The region is centred on the equivalence point."
        - "The pH changes slowly with added base within the region."
        - "A more concentrated acid solution gives a longer (larger-volume) buffer region at the same titrant concentration."
      option_explanations:
        - |
          Correct. At half-equivalence [HA] = [A⁻] and pH = pKa.
        - |
          Correct. Base added so far has converted part of the acid to its conjugate base; both are present until equivalence.
        - |
          The region is centred on the half-equivalence point; at equivalence the capacity is zero and the curve is steepest.
        - |
          Correct. That slow change is what buffering means; the log of the ratio moves slowly near 1.
        - |
          Correct. More moles of acid need more titrant to reach equivalence, so the buffer region spans a larger volume; the buffer capacity is larger.
      answer: [0, 1, 3, 4]
      explanation: |
        Practice 4 (review of 8.5). The buffer region is the flat stretch before equivalence.

    # ---- True / false
    - slug: apchem-u08-w29-q14
      type: true_false
      topic_code: "8.10"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: a buffer holds the pH exactly constant no matter how much strong acid or base is added.
      answer: false
      explanation: |
        False. A buffer keeps the change small for small additions; each addition shifts the base/acid ratio and the pH moves by log of that change. Once an addition exceeds the amount of the reacting component the buffer is exhausted and the pH jumps. Capacity is finite and proportional to the concentrations.

    - slug: apchem-u08-w29-q15
      type: true_false
      topic_code: "8.7"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: when the pH of a buffer equals the pKa of its weak acid, the concentrations of the weak acid and its conjugate base are equal.
      answer: true
      explanation: |
        True. pH = pKa + log([A⁻]/[HA]) gives log(ratio) = 0 and ratio = 1 when pH = pKa. This is the half-equivalence condition of a titration and the point of maximum buffer capacity.

    # ---- Fill in the blank
    - slug: apchem-u08-w29-q16
      type: fill_blank
      topic_code: "8.9"
      source: "general knowledge"
      points: 1
      prompt: |
        The Henderson–Hasselbalch equation is written pH = pKa + log([A⁻]/[HA]), where A⁻ is the conjugate ____ of the weak acid HA.
      answer: ["base", "conjugate base", "weak base", "base of the acid"]
      explanation: |
        The ratio is base over acid: more conjugate base pushes the pH above pKa, more acid pushes it below. Writing the ratio upside down is the most common error; check that adding base raises the calculated pH.

    - slug: apchem-u08-w29-q17
      type: fill_blank
      topic_code: "8.3"
      source: "general knowledge"
      points: 1
      prompt: |
        The equilibrium constant for the ionisation of a weak acid in water, [H₃O⁺][A⁻]/[HA], is given the symbol ____.
      answer: ["Ka", "K a", "K_a", "acid ionisation constant", "acid dissociation constant", "the acid ionisation constant"]
      explanation: |
        Ka, the acid ionisation (or dissociation) constant, measures the extent of ionisation; pKa = −log Ka puts it on the pH scale and is the number that appears in the Henderson–Hasselbalch equation.

