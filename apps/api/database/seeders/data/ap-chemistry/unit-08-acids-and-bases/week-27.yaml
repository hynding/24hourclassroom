week: 27
unit: 8
title: "Acids, Bases, pH and Weak-Acid Equilibria"
topics: ["8.1", "8.2", "8.3"]
guide: guides/week-27.md
guide_description: |
  Brønsted–Lowry acids, bases and conjugate pairs; water's autoionisation and Kw, the pH and pOH scales and
  their temperature dependence; pH of strong acids and bases, including dihydroxide bases and dilution; weak
  acids and bases through the ICE table with the small-x approximation and the 5% check, percent ionisation,
  Ka from a measured pH, Ka × Kb = Kw and polyprotic acids. Worked examples for HCl, Ba(OH)₂, acetic acid,
  HF, ammonia and HOCl.
flashcards_description: |
  29 cards on conjugate pairs, Kw and pH, strong-acid and strong-base pH, weak-acid and weak-base ICE
  calculations, percent ionisation and the Ka–Kb relation.

flashcards:
  - front: Brønsted–Lowry acid and base in proton-transfer terms
    back: |
      An acid donates a proton (H⁺); a base accepts one. Every acid–base reaction is a proton transfer between two conjugate pairs.
    topic_code: "8.1"
  - front: Conjugate acid–base pair → definition
    back: |
      Two species that differ by exactly one H⁺: the acid has it, the base lacks it. HF/F⁻, NH₄⁺/NH₃, H₂O/OH⁻, H₃O⁺/H₂O.
    topic_code: "8.1"
  - front: Identifying the two pairs in HF + H₂O ⇌ H₃O⁺ + F⁻
    back: |
      HF (acid) and F⁻ (its conjugate base); H₂O (base) and H₃O⁺ (its conjugate acid). The acid on the left pairs with the base on the right.
    topic_code: "8.1"
  - front: Amphoteric species in acid–base chemistry → examples
    back: |
      A species that can donate or accept a proton: H₂O, HCO₃⁻, HSO₄⁻, H₂PO₄⁻, HS⁻. Which role it plays depends on its partner.
    topic_code: "8.1"
  - front: Autoionisation of water and Kw
    back: |
      2 H₂O(l) ⇌ H₃O⁺(aq) + OH⁻(aq); Kw = [H₃O⁺][OH⁻] = 1.0 × 10⁻¹⁴ at 25 °C. In pure water each ion is 1.0 × 10⁻⁷ M.
    topic_code: "8.1"
  - front: pH, pOH and their sum
    back: |
      pH = −log[H₃O⁺]; pOH = −log[OH⁻]; pH + pOH = pKw = 14.00 at 25 °C. One pH unit is a factor of 10 in [H₃O⁺].
    topic_code: "8.1"
  - front: What 'neutral' means at any temperature
    back: |
      [H₃O⁺] = [OH⁻], not pH 7. Autoionisation is endothermic, so Kw rises with temperature: at 50 °C Kw = 5.5 × 10⁻¹⁴ and neutral water has pH 6.63.
    topic_code: "8.1"
  - front: Significant figures in pH
    back: |
      Only the digits after the decimal point are significant: [H₃O⁺] = 5.0 × 10⁻³ M (two sig figs) gives pH 2.30 (two decimals). Convert back with [H₃O⁺] = 10^(−pH).
    topic_code: "8.1"
  - front: The six strong acids
    back: |
      HCl, HBr, HI, HNO₃, HClO₄ and H₂SO₄ (first proton only). They ionise completely, so [H₃O⁺] equals the acid's formal concentration.
    topic_code: "8.2"
  - front: The common strong bases
    back: |
      Group 1 hydroxides (LiOH, NaOH, KOH) and the heavier group 2 hydroxides Ca(OH)₂, Sr(OH)₂, Ba(OH)₂, which release two OH⁻ per formula unit.
    topic_code: "8.2"
  - front: "Worked pH of 0.020 M Ba(OH)₂"
    back: |
      [OH⁻] = 2 × 0.020 = 0.040 M; pOH = −log 0.040 = 1.40; pH = 14.00 − 1.40 = 12.60.
    topic_code: "8.2"
  - front: "Worked pH of 0.0050 M HCl"
    back: |
      Complete ionisation: [H₃O⁺] = 5.0 × 10⁻³ M; pH = −log(5.0 × 10⁻³) = 2.30. [OH⁻] = Kw/[H₃O⁺] = 2.0 × 10⁻¹² M.
    topic_code: "8.2"
  - front: Effect of ten-fold dilution on a strong acid's pH
    back: |
      pH rises by exactly one unit (0.0050 M, pH 2.30 → 0.00050 M, pH 3.30) until the acid is so dilute (below about 10⁻⁶ M) that water's own H₃O⁺ matters; 10⁻⁸ M HCl has pH 6.98, not 8.
    topic_code: "8.2"
  - front: Why H₂SO₄ is strong but not 'doubly strong'
    back: |
      The first proton ionises completely; the second (HSO₄⁻, Ka2 = 1.2 × 10⁻²) only partly. 0.10 M H₂SO₄ has [H₃O⁺] a little above 0.10 M, not 0.20 M.
    topic_code: "8.2"
  - front: Ka expression for a weak acid
    back: |
      HA + H₂O ⇌ H₃O⁺ + A⁻; Ka = [H₃O⁺][A⁻]/[HA]. Water, the solvent, is omitted. The smaller Ka, the weaker the acid.
    topic_code: "8.3"
  - front: Ka values worth knowing
    back: |
      HF 6.8 × 10⁻⁴; HNO₂ 4.5 × 10⁻⁴; CH₃COOH 1.8 × 10⁻⁵; HOCl 3.0 × 10⁻⁸; HCN 6.2 × 10⁻¹⁰; NH₄⁺ 5.6 × 10⁻¹⁰. (Given on the exam when needed.)
    topic_code: "8.3"
  - front: ICE table for a weak acid of concentration c
    back: |
      Equilibrium row: [HA] = c − x, [H₃O⁺] = [A⁻] = x. Ka = x²/(c − x) ≈ x²/c when Ka ≪ c, so x = √(Ka × c). Check x/c < 5%.
    topic_code: "8.3"
  - front: "Worked pH of 0.10 M acetic acid (Ka = 1.8 × 10⁻⁵)"
    back: |
      x = √(1.8 × 10⁻⁵ × 0.10) = 1.3 × 10⁻³ M (1.3% of 0.10, approximation valid); pH = 2.87. A strong acid at 0.10 M would be pH 1.00.
    topic_code: "8.3"
  - front: Percent ionisation of a weak acid
    back: |
      100 × [H₃O⁺]eq/[HA]₀. It increases on dilution (0.10 M acetic acid 1.3%, 0.010 M 4.2%) even though the pH rises, because dilution shifts HA ⇌ H⁺ + A⁻ toward the side with more particles.
    topic_code: "8.3"
  - front: When a weak-acid problem needs the quadratic
    back: |
      When x from the approximation exceeds 5% of c, typically Ka/c > about 10⁻³. 0.10 M HF (Ka = 6.8 × 10⁻⁴): approximation gives 8.2%, so solve x² + 6.8 × 10⁻⁴x − 6.8 × 10⁻⁵ = 0 → x = 7.9 × 10⁻³ M, pH 2.10.
    topic_code: "8.3"
  - front: Finding Ka from a measured pH
    back: |
      x = [H₃O⁺] = 10^(−pH); [A⁻] = x; [HA] = c − x. Ka = x²/(c − x). A 0.050 M acid at pH 3.00 has Ka = (1.0 × 10⁻³)²/0.049 = 2.0 × 10⁻⁵.
    topic_code: "8.3"
  - front: Kb expression for a weak base
    back: |
      B + H₂O ⇌ BH⁺ + OH⁻; Kb = [BH⁺][OH⁻]/[B]. Solve for x = [OH⁻], then pOH, then pH = 14.00 − pOH.
    topic_code: "8.3"
  - front: "Worked pH of 0.20 M NH₃ (Kb = 1.8 × 10⁻⁵)"
    back: |
      x = √(1.8 × 10⁻⁵ × 0.20) = 1.9 × 10⁻³ M = [OH⁻]; pOH = 2.72; pH = 11.28.
    topic_code: "8.3"
  - front: Ka × Kb = Kw for a conjugate pair
    back: |
      Adding HA ⇌ H⁺ + A⁻ to A⁻ + H₂O ⇌ HA + OH⁻ gives the autoionisation of water, so the constants multiply to Kw. Kb(F⁻) = 1.0 × 10⁻¹⁴/6.8 × 10⁻⁴ = 1.5 × 10⁻¹¹.
    topic_code: "8.3"
  - front: Strength of a conjugate base from its acid's Ka
    back: |
      The weaker the acid, the stronger its conjugate base: CN⁻ (from HCN, Ka = 6.2 × 10⁻¹⁰) has Kb = 1.6 × 10⁻⁵, while F⁻ has Kb = 1.5 × 10⁻¹¹ and Cl⁻ (from strong HCl) is no base at all in water.
    topic_code: "8.3"
  - front: Polyprotic acids → successive Ka values
    back: |
      Protons leave one at a time with Ka falling by roughly 10⁵ per step (H₃PO₄: 7.5 × 10⁻³, 6.2 × 10⁻⁸, 4.8 × 10⁻¹³) because each successive proton leaves a more negative ion. The pH is set by Ka1 alone.
    topic_code: "8.3"
  - front: Anions of weak acids as weak bases
    back: |
      F⁻, CH₃COO⁻, CN⁻, CO₃²⁻ and similar anions accept protons from water (A⁻ + H₂O ⇌ HA + OH⁻), so their sodium salts give basic solutions; the salt pH is calculated with Kb = Kw/Ka.
    topic_code: "8.3"
  - front: Comparing 0.10 M solutions of different weak acids
    back: |
      At equal concentration, the acid with the larger Ka has the larger [H₃O⁺], the lower pH and the higher percent ionisation; at 0.10 M, HF (pH 2.10) is below acetic acid (2.87) and HOCl (4.26).
    topic_code: "8.3"
  - front: H⁺ versus H₃O⁺ in equations
    back: |
      They are interchangeable shorthand for the hydrated proton; HA ⇌ H⁺ + A⁻ and HA + H₂O ⇌ H₃O⁺ + A⁻ have the same Ka. Use whichever the question uses.
    topic_code: "8.1"

quiz:
  description: |
    23 questions · about 45 minutes · topics 8.1–8.3 (Brønsted–Lowry acids and bases, Kw and the pH scale,
    strong acids and bases, and weak-acid and weak-base equilibria), with review of combining equilibrium
    constants, the small-x approximation, the omission of the solvent from K, dilution and the temperature
    dependence of K. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: Ka table (8.3)
    - slug: apchem-u08-w27-q01
      type: multiple_choice
      topic_code: "8.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table: acid ionisation constants at 25 °C. HF 6.8 × 10⁻⁴; HNO₂ 4.5 × 10⁻⁴; CH₃COOH 1.8 × 10⁻⁵; HOCl 3.0 × 10⁻⁸; HCN 6.2 × 10⁻¹⁰.
      prompt: |
        Which 0.10 M solution has the lowest pH?
      options:
        - "0.10 M HCN"
        - "0.10 M CH₃COOH"
        - "0.10 M HF"
        - "0.10 M HOCl"
      option_explanations:
        - |
          HCN has the smallest Ka, so it produces the least H₃O⁺ at a given concentration and has the highest pH of the four (about 5.1).
        - |
          Acetic acid (Ka = 1.8 × 10⁻⁵) gives pH 2.87 at 0.10 M, below HOCl and HCN but above HF.
        - |
          Correct. At equal concentration the acid with the largest Ka ionises most; HF (Ka = 6.8 × 10⁻⁴) gives [H₃O⁺] ≈ 7.9 × 10⁻³ M, pH 2.10.
        - |
          HOCl (Ka = 3.0 × 10⁻⁸) is a much weaker acid; 0.10 M has pH about 4.3.
      answer: 2
      explanation: |
        Practice 4. Larger Ka, more H₃O⁺, lower pH at the same concentration.

    - slug: apchem-u08-w27-q02
      type: multiple_choice
      topic_code: "8.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table: acid ionisation constants at 25 °C. HF 6.8 × 10⁻⁴; HNO₂ 4.5 × 10⁻⁴; CH₃COOH 1.8 × 10⁻⁵; HOCl 3.0 × 10⁻⁸; HCN 6.2 × 10⁻¹⁰.
      prompt: |
        Which anion is the strongest base in water?
      options:
        - "CN⁻"
        - "F⁻"
        - "NO₂⁻"
        - "CH₃COO⁻"
      option_explanations:
        - |
          Correct. The weakest acid has the strongest conjugate base: Kb(CN⁻) = Kw/Ka = 1.0 × 10⁻¹⁴/6.2 × 10⁻¹⁰ = 1.6 × 10⁻⁵, the largest Kb of the four.
        - |
          F⁻ is the conjugate base of the strongest acid listed; Kb = 1.5 × 10⁻¹¹, the weakest base here.
        - |
          Kb(NO₂⁻) = 2.2 × 10⁻¹¹; nitrous acid is nearly as strong as HF, so nitrite is nearly as weak a base as fluoride.
        - |
          Kb(CH₃COO⁻) = 5.6 × 10⁻¹⁰, a weak base but 30 times weaker than cyanide.
      answer: 0
      explanation: |
        Practice 6. Ka × Kb = Kw: the smaller Ka, the larger Kb.

    - slug: apchem-u08-w27-q03
      type: numeric
      topic_code: "8.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table: acid ionisation constants at 25 °C. HF 6.8 × 10⁻⁴; HNO₂ 4.5 × 10⁻⁴; CH₃COOH 1.8 × 10⁻⁵; HOCl 3.0 × 10⁻⁸; HCN 6.2 × 10⁻¹⁰.
      prompt: |
        Calculate the pH of 0.25 M HOCl. Give your answer to two decimal places.
      answer: { value: 4.06, tolerance: 0.05 }
      explanation: |
        Ka = x²/(0.25 − x) ≈ x²/0.25, so x² = 3.0 × 10⁻⁸ × 0.25 = 7.5 × 10⁻⁹ and x = 8.7 × 10⁻⁵ M (0.03% of 0.25, approximation valid). pH = −log(8.7 × 10⁻⁵) = 4.06.

    # ---- Stand-alone multiple choice
    - slug: apchem-u08-w27-q04
      type: multiple_choice
      topic_code: "8.1"
      source: "general knowledge"
      points: 1
      prompt: |
        In the reaction HSO₄⁻(aq) + NH₃(aq) ⇌ SO₄²⁻(aq) + NH₄⁺(aq), which pair is a conjugate acid–base pair with the acid listed first?
      options:
        - "NH₃ / NH₄⁺"
        - "HSO₄⁻ / SO₄²⁻"
        - "HSO₄⁻ / NH₃"
        - "SO₄²⁻ / NH₄⁺"
      option_explanations:
        - |
          NH₄⁺ and NH₃ are a conjugate pair, but NH₄⁺ is the acid; listed acid-first it would be NH₄⁺ / NH₃.
        - |
          Correct. HSO₄⁻ donates a proton to become SO₄²⁻; they differ by one H⁺, with HSO₄⁻ the acid and SO₄²⁻ its conjugate base.
        - |
          HSO₄⁻ and NH₃ are the two reactants (an acid and a base), not a conjugate pair; they do not differ by one H⁺.
        - |
          SO₄²⁻ and NH₄⁺ are the two products, from different pairs.
      answer: 1
      explanation: |
        Practice 1. A conjugate pair differs by exactly one proton.

    - slug: apchem-u08-w27-q05
      type: multiple_choice
      topic_code: "8.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which species is amphoteric, able to act as a Brønsted–Lowry acid in one reaction and a base in another?
      options:
        - "Cl⁻"
        - "NH₄⁺"
        - "CO₃²⁻"
        - "HCO₃⁻"
      option_explanations:
        - |
          Chloride has no proton to donate and, as the conjugate base of a strong acid, essentially no tendency to accept one.
        - |
          Ammonium can only donate a proton (to give NH₃); it has no lone pair to accept one.
        - |
          Carbonate can only accept protons; it has none to donate.
        - |
          Correct. HCO₃⁻ donates a proton to give CO₃²⁻ (acting as an acid) or accepts one to give H₂CO₃ (acting as a base), depending on its partner.
      answer: 3
      explanation: |
        Practice 1. Amphoteric species carry a removable proton and a site that can accept one.

    - slug: apchem-u08-w27-q06
      type: multiple_choice
      topic_code: "8.2"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the pH of 0.020 M Ba(OH)₂ at 25 °C?
      options:
        - "12.30"
        - "12.60"
        - "1.70"
        - "1.40"
      option_explanations:
        - |
          12.30 uses [OH⁻] = 0.020 M, forgetting that each Ba(OH)₂ releases two hydroxide ions.
        - |
          Correct. [OH⁻] = 2(0.020) = 0.040 M; pOH = 1.40; pH = 14.00 − 1.40 = 12.60.
        - |
          1.70 is the pOH for 0.020 M OH⁻; a strong base has a high pH, not a low one.
        - |
          1.40 is the pOH, not the pH; subtract from 14.00.
      answer: 1
      explanation: |
        Practice 5. Count the hydroxides, find pOH, convert to pH.

    - slug: apchem-u08-w27-q07
      type: multiple_choice
      topic_code: "8.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A solution of HCl with pH 2.00 is diluted with water to ten times its volume. What is the new pH?
      options:
        - "3.00"
        - "2.10"
        - "20.0"
        - "1.00"
      option_explanations:
        - |
          Correct. Ten-fold dilution lowers [H₃O⁺] from 1.0 × 10⁻² M to 1.0 × 10⁻³ M; since the acid is strong and fully ionised, pH = −log(1.0 × 10⁻³) = 3.00.
        - |
          pH is logarithmic: a ten-fold change in concentration is a change of one whole unit, not 0.1.
        - |
          pH is not multiplied by the dilution factor; it changes by log(10) = 1.
        - |
          Dilution lowers [H₃O⁺], which raises the pH, not lowers it.
      answer: 0
      explanation: |
        Practice 5. Each factor of 10 in [H₃O⁺] is one pH unit.

    - slug: apchem-u08-w27-q08
      type: multiple_choice
      topic_code: "8.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Both 0.10 M HCl and 0.10 M CH₃COOH are prepared at 25 °C. The HCl solution has pH 1.00 and the acetic acid solution has pH 2.87. Which explanation is correct?
      options:
        - "Acetic acid molecules contain fewer hydrogen atoms available to ionise than HCl."
        - "Acetic acid is less concentrated because its molar mass is larger."
        - "HCl ionises completely, giving [H₃O⁺] = 0.10 M, whereas only about 1.3% of the acetic acid molecules are ionised at equilibrium (Ka = 1.8 × 10⁻⁵)."
        - "The acetic acid solution contains more OH⁻ because acetate is a base."
      option_explanations:
        - |
          Acetic acid has one acidic hydrogen, like HCl; the difference is the extent of ionisation, not the number of protons.
        - |
          Both solutions are 0.10 M; molar mass does not enter once the molarity is fixed.
        - |
          Correct. A strong acid is fully ionised; the weak acid reaches an equilibrium with x = √(1.8 × 10⁻⁵ × 0.10) = 1.3 × 10⁻³ M H₃O⁺, about 75 times less, so its pH is nearly two units higher.
        - |
          A solution at pH 2.87 is acidic; its [OH⁻] is 7 × 10⁻¹² M, far too small to matter.
      answer: 2
      explanation: |
        Practice 6. Strong versus weak is about the extent of ionisation at equilibrium.

    - slug: apchem-u08-w27-q09
      type: multiple_choice
      topic_code: "8.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A 0.10 M solution of a weak acid is diluted to 0.010 M. Which statement about the percent ionisation and the pH is correct?
      options:
        - "Percent ionisation decreases and pH decreases."
        - "Percent ionisation is unchanged and pH increases by 1.00."
        - "Percent ionisation decreases and pH increases."
        - "Percent ionisation increases and pH increases, but by less than 1.00."
      option_explanations:
        - |
          Dilution lowers [H₃O⁺] (pH rises) and shifts HA ⇌ H⁺ + A⁻ toward the side with more particles, so a larger fraction ionises.
        - |
          Percent ionisation is constant only for a strong acid; for a weak acid x = √(Ka c) falls by only √10 when c falls by 10, so the pH rises by 0.5, not 1.
        - |
          The pH rises, but the fraction ionised rises too: with x ≈ √(Ka c), x/c = √(Ka/c) grows as c shrinks.
        - |
          Correct. For acetic acid, 1.3% at 0.10 M (pH 2.87) becomes 4.2% at 0.010 M (pH 3.37): more of the acid ionises, yet there is less H₃O⁺ in total.
      answer: 3
      explanation: |
        Practice 6. Dilution favours ionisation (Le Châtelier) while lowering the absolute [H₃O⁺].

    - slug: apchem-u08-w27-q10
      type: multiple_choice
      topic_code: "7.10"
      source: "general knowledge"
      points: 1
      prompt: |
        Kw is 1.0 × 10⁻¹⁴ at 25 °C and 5.5 × 10⁻¹⁴ at 50 °C. Which conclusion follows?
      options:
        - "The autoionisation of water is endothermic, and pure water at 50 °C (pH 6.63) is neutral."
        - "The autoionisation of water is exothermic, and pure water at 50 °C is slightly acidic."
        - "Pure water at 50 °C has pH 7.00 because water is always neutral at pH 7."
        - "Kw increases because water expands on heating, raising the concentration of ions."
      option_explanations:
        - |
          Correct. K rises with temperature only for an endothermic reaction. At 50 °C, [H₃O⁺] = [OH⁻] = √(5.5 × 10⁻¹⁴) = 2.3 × 10⁻⁷ M, so pH = 6.63; the two concentrations are equal, which is what neutral means.
        - |
          A rising K with rising temperature indicates an endothermic process, and equal ion concentrations mean the water is neutral, not acidic.
        - |
          pH 7 is neutral only at 25 °C; the neutral pH shifts with Kw.
        - |
          Thermal expansion is a tiny effect; K changes because the equilibrium constant of an endothermic reaction increases with temperature.
      answer: 0
      explanation: |
        Practice 6 (review of 7.10). Temperature changes K; neutrality is [H₃O⁺] = [OH⁻].

    - slug: apchem-u08-w27-q11
      type: multiple_choice
      topic_code: "7.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Adding the equations HA ⇌ H⁺ + A⁻ (constant Ka) and A⁻ + H₂O ⇌ HA + OH⁻ (constant Kb) gives H₂O ⇌ H⁺ + OH⁻. What relation between the constants follows?
      options:
        - "Ka + Kb = Kw"
        - "Ka − Kb = Kw"
        - "Ka × Kb = Kw"
        - "Ka/Kb = Kw"
      option_explanations:
        - |
          Equilibrium constants never add when equations are added; enthalpies do.
        - |
          Subtraction of constants has no meaning for combined equilibria.
        - |
          Correct. When equations are added their constants multiply: ([H⁺][A⁻]/[HA]) × ([HA][OH⁻]/[A⁻]) = [H⁺][OH⁻] = Kw. Hence Kb = Kw/Ka for any conjugate pair.
        - |
          Division would correspond to subtracting the second equation (reversing it) from the first.
      answer: 2
      explanation: |
        Practice 5 (review of 7.6). The HA and A⁻ terms cancel in the product of the two expressions.

    # ---- Multi-select
    - slug: apchem-u08-w27-q12
      type: multi_select
      topic_code: "8.2"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are strong acids, ionising essentially completely in water? Select all that apply.
      options:
        - "HCl"
        - "HF"
        - "HNO₃"
        - "H₂CO₃"
        - "HClO₄"
        - "CH₃COOH"
      option_explanations:
        - |
          Correct. Hydrochloric acid is one of the six strong acids.
        - |
          HF is weak (Ka = 6.8 × 10⁻⁴) despite being a hydrogen halide; the strong H–F bond and strong hydration of F⁻ limit its ionisation.
        - |
          Correct. Nitric acid ionises completely.
        - |
          Carbonic acid is weak (Ka1 = 4.3 × 10⁻⁷); it is the acid of carbonated water.
        - |
          Correct. Perchloric acid is among the strongest acids known.
        - |
          Acetic acid is the standard weak acid (Ka = 1.8 × 10⁻⁵).
      answer: [0, 2, 4]
      explanation: |
        Practice 1. The strong acids: HCl, HBr, HI, HNO₃, HClO₄, H₂SO₄ (first proton).

    - slug: apchem-u08-w27-q13
      type: multi_select
      topic_code: "7.7"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        A student calculates the pH of 0.050 M HNO₂ (Ka = 4.5 × 10⁻⁴) with the small-x approximation and gets x = 4.7 × 10⁻³ M. Which statements are correct? Select all that apply.
      options:
        - "The approximation should be checked: 4.7 × 10⁻³/0.050 = 9.5%, which exceeds 5%, so it is not acceptable here."
        - "Solving the quadratic x² + 4.5 × 10⁻⁴x − 2.25 × 10⁻⁵ = 0 gives a smaller x, about 4.5 × 10⁻³ M."
        - "The approximation fails because Ka is not small compared with the initial concentration."
        - "The approximation would have been acceptable if the solution were more concentrated, for example 1.0 M."
        - "The approximation fails because the numerator x² should also have been neglected."
      option_explanations:
        - |
          Correct. The 5% rule compares x with the concentration it was dropped from; 9.5% is too large.
        - |
          Correct. Keeping the −x in the denominator lowers the answer to x = 4.5 × 10⁻³ M (pH 2.35, 9.0% ionised).
        - |
          Correct. Ka/c = 9 × 10⁻³ is above the rough 10⁻³ threshold at which x stops being negligible.
        - |
          Correct. At 1.0 M, x = √(4.5 × 10⁻⁴) = 0.021 M, 2.1% of 1.0 M, under 5%; the approximation improves with concentration.
        - |
          The x² in the numerator is the quantity being solved for and is never neglected; only the x subtracted from the initial concentration can be dropped.
      answer: [0, 1, 2, 3]
      explanation: |
        Practice 5 (review of 7.7). Check the 5% rule; the quadratic is the fallback.

    # ---- True / false
    - slug: apchem-u08-w27-q14
      type: true_false
      topic_code: "8.1"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: a solution with pH 7.00 is neutral at every temperature.
      answer: false
      explanation: |
        False. Neutral means [H₃O⁺] = [OH⁻], which gives pH 7.00 only at 25 °C where Kw = 1.0 × 10⁻¹⁴. At 50 °C (Kw = 5.5 × 10⁻¹⁴) neutral water has pH 6.63, and a solution of pH 7.00 there is slightly basic.

    - slug: apchem-u08-w27-q15
      type: true_false
      topic_code: "4.5"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: diluting 10.0 mL of 1.0 M HCl to a total volume of 250.0 mL gives a solution that is 0.040 M in HCl, with pH 1.40.
      answer: true
      explanation: |
        True. Moles are conserved on dilution: M₁V₁ = M₂V₂, so M₂ = (1.0 M)(10.0 mL)/(250.0 mL) = 0.040 M. Because HCl is strong, [H₃O⁺] = 0.040 M and pH = −log 0.040 = 1.40.

