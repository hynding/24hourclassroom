    # ---- Short answer
    - slug: apchem-u08-w27-q21
      type: short_answer
      topic_code: "8.3"
      source: "general knowledge"
      points: 3
      prompt: |
        A 0.050 M solution of a weak monoprotic acid HA has pH 3.00 at 25 °C.
        (a) Determine [H₃O⁺], [A⁻] and [HA] at equilibrium.
        (b) Calculate Ka and the percent ionisation.
        (c) Calculate Kb for A⁻ and state whether A⁻ is a stronger or weaker base than acetate ion (Kb = 5.6 × 10⁻¹⁰).
      answer: |
        (a) [H₃O⁺] = 10^(−3.00) = 1.0 × 10⁻³ M; [A⁻] = 1.0 × 10⁻³ M (formed 1:1 with H₃O⁺); [HA] = 0.050 − 0.0010 = 0.049 M.
        (b) Ka = (1.0 × 10⁻³)²/0.049 = 2.0 × 10⁻⁵. Percent ionisation = 100 × 1.0 × 10⁻³/0.050 = 2.0%.
        (c) Kb = Kw/Ka = 1.0 × 10⁻¹⁴/2.0 × 10⁻⁵ = 5.0 × 10⁻¹⁰. This is slightly smaller than acetate's 5.6 × 10⁻¹⁰, so A⁻ is a very slightly weaker base (HA is a very slightly stronger acid than acetic acid).
      explanation: |
        Three points.

        (a) 1 pt: all three equilibrium concentrations (accept [HA] = 0.050 M if the approximation is stated).
        (b) 1 pt: Ka = 2.0 × 10⁻⁵ (accept 2.0–2.1 × 10⁻⁵) and 2.0% ionised.
        (c) 1 pt: Kb = 5.0 × 10⁻¹⁰ with a correct comparison to acetate.

    - slug: apchem-u08-w27-q22
      type: short_answer
      topic_code: "7.10"
      source: "general knowledge"
      points: 3
      prompt: |
        Acetic acid (Ka = 1.8 × 10⁻⁵) ionises according to CH₃COOH(aq) ⇌ H⁺(aq) + CH₃COO⁻(aq). A 0.10 M solution is diluted ten-fold to 0.010 M.
        (a) Calculate the pH before and after dilution.
        (b) Calculate the percent ionisation before and after dilution.
        (c) Explain, by considering the reaction quotient Q immediately after dilution, why the percent ionisation changes in the direction it does.
      answer: |
        (a) Before: x = √(1.8 × 10⁻⁵ × 0.10) = 1.3 × 10⁻³ M, pH = 2.87. After: x = √(1.8 × 10⁻⁵ × 0.010) = 4.2 × 10⁻⁴ M, pH = 3.37 (both approximations pass the 5% test: 1.3% and 4.2%).
        (b) Before: 1.3 × 10⁻³/0.10 = 1.3%. After: 4.2 × 10⁻⁴/0.010 = 4.2%.
        (c) Immediately after a ten-fold dilution every concentration is divided by 10. Q = [H⁺][CH₃COO⁻]/[CH₃COOH] has two concentration factors in the numerator and one in the denominator, so Q is divided by 10 and falls below Ka. The forward reaction (ionisation) therefore proceeds until Q = Ka again, so a larger fraction of the acid is ionised, even though the absolute [H⁺] is lower.
      explanation: |
        Three points.

        (a) 1 pt: pH 2.87 before and 3.37 after (accept ±0.02).
        (b) 1 pt: 1.3% and 4.2%.
        (c) 1 pt: Q divided by 10 (more product factors than reactant factors), Q < K, forward shift; accept an equivalent Le Châtelier 'more particles on the product side' argument only if tied to Q.

    # ---- Long answer
    - slug: apchem-u08-w27-q23
      type: long_answer
      topic_code: "8.3"
      source: "general knowledge"
      points: 6
      prompt: |
        Hydrofluoric acid is a weak acid with Ka = 6.8 × 10⁻⁴ at 25 °C.
        (a) Write the ionisation equation for HF in water, identify both conjugate acid–base pairs, and write the Ka expression.
        (b) Set up the ICE table for a 0.10 M solution of HF and show that the small-x approximation is not acceptable.
        (c) Solve for [H₃O⁺] exactly and calculate the pH and the percent ionisation of 0.10 M HF.
        (d) A 0.10 M solution of HCl has pH 1.00. Explain the difference between the two solutions at the molecular level.
        (e) Calculate Kb for F⁻ and write the equation for the reaction it describes.
        (f) Predict, with justification, whether the percent ionisation of HF in a 0.010 M solution is higher or lower than in the 0.10 M solution.
      answer: |
        (a) HF(aq) + H₂O(l) ⇌ H₃O⁺(aq) + F⁻(aq). Pairs: HF (acid)/F⁻ (conjugate base) and H₂O (base)/H₃O⁺ (conjugate acid). Ka = [H₃O⁺][F⁻]/[HF].
        (b) Initial 0.10, 0, 0; change −x, +x, +x; equilibrium 0.10 − x, x, x. Approximation: x² = 6.8 × 10⁻⁴ × 0.10 = 6.8 × 10⁻⁵, x = 8.2 × 10⁻³ M, which is 8.2% of 0.10 M, over the 5% limit, so the −x cannot be neglected.
        (c) x²/(0.10 − x) = 6.8 × 10⁻⁴ → x² + 6.8 × 10⁻⁴x − 6.8 × 10⁻⁵ = 0 → x = [−6.8 × 10⁻⁴ + √(4.6 × 10⁻⁷ + 2.72 × 10⁻⁴)]/2 = (−0.00068 + 0.01651)/2 = 7.9 × 10⁻³ M. pH = −log(7.9 × 10⁻³) = 2.10. Percent ionisation = 7.9 × 10⁻³/0.10 × 100 = 7.9%.
        (d) HCl is a strong acid: essentially every HCl molecule transfers its proton to water, so [H₃O⁺] = 0.10 M. HF reaches an equilibrium in which only about 8% of the molecules have ionised; most remain as intact HF molecules (the H–F bond is strong and F⁻ is strongly hydrated, so the reverse reaction competes effectively), giving [H₃O⁺] about 13 times smaller.
        (e) Kb = Kw/Ka = 1.0 × 10⁻¹⁴/6.8 × 10⁻⁴ = 1.5 × 10⁻¹¹, for F⁻(aq) + H₂O(l) ⇌ HF(aq) + OH⁻(aq).
        (f) Higher. Dilution divides Q = [H₃O⁺][F⁻]/[HF] by 10 (two product factors against one reactant factor), so Q < Ka and more HF ionises; at 0.010 M the exact solution gives x = 2.3 × 10⁻³ M, 23% ionised, compared with 7.9% at 0.10 M.
      explanation: |
        Six points.

        (a) 1 pt: balanced equation, both conjugate pairs correctly identified, Ka expression.
        (b) 1 pt: ICE table and the 8.2% failure of the 5% test.
        (c) 1 pt: x = 7.9 × 10⁻³ M (accept 7.8–8.0 × 10⁻³), pH 2.10, 7.9% ionised.
        (d) 1 pt: complete ionisation of HCl versus partial (equilibrium) ionisation of HF, with a molecular-level statement.
        (e) 1 pt: Kb = 1.5 × 10⁻¹¹ and the hydrolysis equation.
        (f) 1 pt: higher percent ionisation on dilution, justified by Q or Le Châtelier (a numerical value is not required).
