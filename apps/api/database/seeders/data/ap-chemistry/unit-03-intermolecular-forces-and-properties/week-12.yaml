      points: 1
      prompt: |
        True or false: within the range where the Beer–Lambert law holds, doubling the concentration of the absorbing species doubles the absorbance but does not halve the percent transmittance.
      answer: true
      explanation: |
        True. A = εbc is linear in c, but T = 10⁻ᴬ, so doubling A squares T: 40 %T (A = 0.40) becomes 16 %T (A = 0.80), not 20 %T.

