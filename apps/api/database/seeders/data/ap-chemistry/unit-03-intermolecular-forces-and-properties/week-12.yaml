week: 12
unit: 3
title: "The Photoelectric Effect and the Beer–Lambert Law"
topics: ["3.12", "3.13"]
guide: guides/week-12.md
guide_description: |
  The photoelectric effect as the evidence for photons: threshold frequency, work function, KE = hν − φ, and why
  intensity changes the number of electrons but not their energy; then spectrophotometry: transmittance,
  absorbance, A = εbc, choosing the wavelength of maximum absorbance, building and reading a calibration curve,
  dilution factors and the limits of the linear range. Worked examples: sodium and zinc thresholds, a Cu²⁺
  calibration, molar absorptivity of a dye, path length and percent transmittance.
flashcards_description: |
  30 cards on the photoelectric observations and their photon explanation, work function and threshold
  calculations, absorbance and transmittance, the Beer–Lambert law and its variables, calibration curves,
  wavelength choice, blanks and dilution.

flashcards:
  - front: Photoelectric effect → the three observations a wave model cannot explain
    back: |
      No electrons below a threshold frequency however bright the light; instant emission above it even when dim; kinetic energy rises with frequency while intensity changes only the number of electrons.
    topic_code: "3.12"
  - front: Photon explanation of the photoelectric effect → the rule
    back: |
      Light arrives as photons of energy hν; one photon gives all its energy to one electron. If hν is below the work function nothing happens; photons do not pool their energy.
    topic_code: "3.12"
  - front: Work function φ → definition and relation to threshold frequency
    back: |
      The minimum energy to remove an electron from the metal surface; φ = hν₀, where ν₀ is the threshold frequency. Characteristic of each metal.
    topic_code: "3.12"
  - front: Kinetic energy of a photoelectron → the equation
    back: |
      KE_max = hν − φ = hc/λ − φ. Zero at the threshold; grows linearly with frequency. A graph of KE against ν has slope h.
    topic_code: "3.12"
  - front: Effect of light intensity in the photoelectric effect → what changes
    back: |
      More photons per second → more electrons per second (larger current). The energy of each electron is unchanged. Below the threshold, intensity does nothing.
    topic_code: "3.12"
  - front: Sodium's threshold (φ ≈ 3.65 × 10⁻¹⁹ J) → threshold wavelength
    back: |
      λ₀ = hc/φ = 1.986 × 10⁻²⁵ ÷ 3.65 × 10⁻¹⁹ = 5.44 × 10⁻⁷ m = 544 nm. Green and bluer light ejects electrons; red does not.
    topic_code: "3.12"
  - front: KE of electrons from sodium under 400 nm light → the calculation
    back: |
      E_photon = hc/λ = 4.97 × 10⁻¹⁹ J; KE_max = 4.97 × 10⁻¹⁹ − 3.65 × 10⁻¹⁹ = 1.32 × 10⁻¹⁹ J.
    topic_code: "3.12"
  - front: Zinc plate and the ultraviolet lamp → the classic demonstration
    back: |
      Zinc's work function (≈ 6.9 × 10⁻¹⁹ J) gives a 288 nm threshold, so a charged zinc electroscope discharges under UV but not under the brightest visible lamp.
    topic_code: "3.12"
  - front: Work function from a threshold frequency → the step
    back: |
      φ = hν₀. For ν₀ = 1.0 × 10¹⁵ Hz, φ = 6.6 × 10⁻¹⁹ J; a 250 nm photon (7.9 × 10⁻¹⁹ J) then gives KE_max = 1.3 × 10⁻¹⁹ J.
    topic_code: "3.12"
  - front: Photoelectric effect vs photoelectron spectroscopy → the link
    back: |
      Same bookkeeping. PES uses X-ray or far-UV photons on atoms: binding energy = hν − KE of the ejected electron, giving each subshell's energy.
    topic_code: "3.12"
  - front: Why the photoelectric effect supports a particle model of light → the argument
    back: |
      A wave would deliver energy gradually and a brighter wave would eject faster electrons; the observed threshold and the frequency-dependence of KE need energy to arrive in discrete packets of hν.
    topic_code: "3.12"
  - front: Transmittance → definition and percent form
    back: |
      T = I/I₀, the fraction of light intensity passing through the sample; %T = 100 T. Falls exponentially, not linearly, as concentration rises.
    topic_code: "3.13"
  - front: Absorbance → definition from transmittance
    back: |
      A = −log(I/I₀) = log(I₀/I) = −log T. Unitless. 100 %T is A = 0; 50 %T is A = 0.301; 10 %T is A = 1.00; 1 %T is A = 2.00.
    topic_code: "3.13"
  - front: Beer–Lambert law → the equation and each variable's unit
    back: |
      A = εbc: ε is molar absorptivity (M⁻¹cm⁻¹), b the path length (cm), c the concentration (M). A is directly proportional to c at fixed b and wavelength.
    topic_code: "3.13"
  - front: Molar absorptivity ε → what it tells you
    back: |
      How strongly one mole per litre absorbs at a given wavelength. Large ε (thousands) means the substance can be measured at very low concentration; ε depends on the substance and the wavelength.
    topic_code: "3.13"
  - front: Choosing the wavelength for a Beer's-law measurement → the rule
    back: |
      Use the wavelength of maximum absorbance (λ_max): the largest change in A per unit concentration and the least sensitivity to wavelength drift. A blue solution is measured in the orange-red; a red one in the blue.
    topic_code: "3.13"
  - front: Colour of a solution vs colour it absorbs → the relation
    back: |
      A solution shows the colours it transmits; it absorbs roughly the complementary colour. Cu²⁺(aq) is blue because it absorbs orange-red light near 600–800 nm.
    topic_code: "3.13"
  - front: Calibration curve → what is plotted and what the slope means
    back: |
      Absorbance (y) against known concentration (x) for a series of standards; a straight line through the origin with slope εb. An unknown's c = A ÷ slope.
    topic_code: "3.13"
  - front: Cu²⁺ standards giving A = 0.12 at 0.020 M up to 0.60 at 0.100 M → slope and an unknown at A = 0.45
    back: |
      Slope = 0.60 ÷ 0.100 = 6.0 M⁻¹ (so ε = 6.0 M⁻¹cm⁻¹ in a 1.00 cm cell); c = 0.45 ÷ 6.0 = 0.075 M.
    topic_code: "3.13"
  - front: Unknown prepared by dilution → how to get the original concentration
    back: |
      Multiply the measured concentration by the dilution factor. 0.075 M measured after diluting 10.0 mL to 50.0 mL → original = 0.075 × 5.00 = 0.375 M.
    topic_code: "3.13"
  - front: Molar absorptivity from one measurement → the rearrangement
    back: |
      ε = A ÷ (bc). A = 0.75 in a 1.00 cm cell at 2.5 × 10⁻⁴ M gives ε = 3.0 × 10³ M⁻¹cm⁻¹.
    topic_code: "3.13"
  - front: Doubling the path length → effect on A and on T
    back: |
      A doubles (A = εbc); T does not halve, it squares: A = 0.75 → 1.50 takes T from 0.18 to 0.032.
    topic_code: "3.13"
  - front: 25 %T in a 1.00 cm cell → A, and A in a 0.500 cm cell
    back: |
      A = −log 0.25 = 0.602; half the path length halves A to 0.301.
    topic_code: "3.13"
  - front: Blank in spectrophotometry → what it is and why it is measured
    back: |
      The solvent (and everything but the analyte) in the same cuvette; its absorbance is set to zero so that the cuvette, the solvent and any reagents do not count toward the sample's A.
    topic_code: "3.13"
  - front: Limits of Beer's law → when the line bends
    back: |
      At high concentration (roughly A above 1–1.5) absorbance stops rising linearly; dilute the sample by a known factor, measure, and multiply back. Other absorbing species at the wavelength also break the proportionality.
    topic_code: "3.13"
  - front: Reading an unknown whose absorbance is above the top standard → what to do
    back: |
      Do not extrapolate. Dilute the unknown until its A falls within the calibrated range, then multiply the result by the dilution factor.
    topic_code: "3.13"
  - front: Sources of error in a Beer's-law measurement → the usual list
    back: |
      Fingerprints, scratches or bubbles on the cuvette (extra absorbance); wrong wavelength (low sensitivity); a second coloured species; cuvette not blanked; temperature or evaporation changing concentration.
    topic_code: "3.13"
  - front: Measuring a colourless analyte by spectrophotometry → the trick
    back: |
      Convert it to a coloured species with a reagent (Fe³⁺ + SCN⁻ gives red [Fe(SCN)]²⁺), then calibrate and measure the coloured product.
    topic_code: "3.13"
  - front: Calibration line A = 12.0 c with an unknown at A = 0.36 after a fivefold dilution → the original concentration
    back: |
      c = 0.36 ÷ 12.0 = 0.030 M in the diluted sample; original = 0.030 × 5 = 0.150 M.
    topic_code: "3.13"
  - front: Doubling the concentration of a 40 %T solution → the new %T
    back: |
      A = −log 0.40 = 0.398 doubles to 0.796; T = 10⁻⁰·⁷⁹⁶ = 0.16, i.e. 16 %T, not 20 %T.
    topic_code: "3.13"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 3.12 and 3.13: the photoelectric effect and
    photons; absorbance, transmittance, the Beer–Lambert law and calibration curves), with review of molarity,
    the spectrum, periodic trends, intermolecular forces, chromatography and gases. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the
    short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: a Cu²⁺ calibration curve
    - slug: apchem-u03-w12-q01
      type: multiple_choice
      topic_code: "3.13"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student prepares five standard solutions of copper(II) sulfate and measures the absorbance of each at 635 nm in a 1.00 cm cuvette, after zeroing the spectrophotometer with a water blank.

        [Cu²⁺] = 0.020 M, A = 0.12
        [Cu²⁺] = 0.040 M, A = 0.24
        [Cu²⁺] = 0.060 M, A = 0.36
        [Cu²⁺] = 0.080 M, A = 0.48
        [Cu²⁺] = 0.100 M, A = 0.60

        An unknown copper(II) solution, prepared by diluting 10.0 mL of a stock solution to 50.0 mL, gives A = 0.45 under the same conditions.
      prompt: |
        What is the concentration of Cu²⁺ in the unknown (diluted) solution?
      options:
        - "0.045 M"
        - "0.27 M"
        - "0.075 M"
        - "0.090 M"
      option_explanations:
        - |
          0.045 would come from dividing A by 10; the calibration slope is 6.0 M⁻¹ (0.60 ÷ 0.100), not 10.
        - |
          0.27 multiplies A by the slope instead of dividing by it; concentration = A ÷ slope.
        - |
          Correct. The standards give A = 6.0 × c, so c = 0.45 ÷ 6.0 = 0.075 M, consistent with A = 0.45 lying between the 0.060 M and 0.080 M standards.
        - |
          0.090 M would give A = 0.54, higher than the measured 0.45.
      answer: 2
      explanation: |
        c = A ÷ slope = 0.45 ÷ 6.0 M⁻¹ = 0.075 M.

    - slug: apchem-u03-w12-q02
      type: multiple_choice
      topic_code: "3.13"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student prepares five standard solutions of copper(II) sulfate and measures the absorbance of each at 635 nm in a 1.00 cm cuvette, after zeroing the spectrophotometer with a water blank.

        [Cu²⁺] = 0.020 M, A = 0.12
        [Cu²⁺] = 0.040 M, A = 0.24
        [Cu²⁺] = 0.060 M, A = 0.36
        [Cu²⁺] = 0.080 M, A = 0.48
        [Cu²⁺] = 0.100 M, A = 0.60

        An unknown copper(II) solution, prepared by diluting 10.0 mL of a stock solution to 50.0 mL, gives A = 0.45 under the same conditions.
      prompt: |
        If the unknown were measured instead in a 2.00 cm cuvette at the same wavelength, what absorbance would be expected?
      options:
        - "0.90"
        - "0.45"
        - "0.225"
        - "0.60"
      option_explanations:
        - |
          Correct. A = εbc is proportional to the path length; doubling b from 1.00 cm to 2.00 cm doubles A from 0.45 to 0.90.
        - |
          Absorbance depends on path length; the light now passes through twice as many absorbing ions.
        - |
          Halving would correspond to a 0.500 cm cell, not a 2.00 cm cell.
        - |
          0.60 is the absorbance of the top standard in a 1.00 cm cell; it has no relation to the unknown in a longer cell.
      answer: 0
      explanation: |
        A ∝ b: twice the path, twice the absorbance.

    - slug: apchem-u03-w12-q03
      type: multiple_choice
      topic_code: "3.7"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student prepares five standard solutions of copper(II) sulfate and measures the absorbance of each at 635 nm in a 1.00 cm cuvette, after zeroing the spectrophotometer with a water blank.

        [Cu²⁺] = 0.020 M, A = 0.12
        [Cu²⁺] = 0.040 M, A = 0.24
        [Cu²⁺] = 0.060 M, A = 0.36
        [Cu²⁺] = 0.080 M, A = 0.48
        [Cu²⁺] = 0.100 M, A = 0.60

        An unknown copper(II) solution, prepared by diluting 10.0 mL of a stock solution to 50.0 mL, gives A = 0.45 under the same conditions.
      prompt: |
        What was the concentration of Cu²⁺ in the original stock solution?
      options:
        - "0.015 M"
        - "0.075 M"
        - "0.75 M"
        - "0.375 M"
      option_explanations:
        - |
          0.015 M divides by the dilution factor instead of multiplying; the stock is more concentrated than the diluted sample, not less.
        - |
          0.075 M is the diluted sample's concentration; the stock was five times more concentrated.
        - |
          0.75 M would require a dilution factor of 10, but 10.0 mL made up to 50.0 mL is a factor of 5.
        - |
          Correct. M₁V₁ = M₂V₂: M₁ = (0.075 M)(50.0 mL) ÷ 10.0 mL = 0.375 M.
      answer: 3
      explanation: |
        Multiply the diluted concentration by the dilution factor (50.0/10.0 = 5).

    # ---- Multiple choice (3.13)
    - slug: apchem-u03-w12-q04
      type: multiple_choice
      topic_code: "3.13"
      source: "general knowledge"
      points: 1
      prompt: |
        A solution of a red dye is to be analysed with a spectrophotometer. Which wavelength setting gives the most sensitive measurement, and why?
      options:
        - "650 nm (red), because the solution is red and the detector should match its colour"
        - "About 500 nm (green), because the dye absorbs green light most strongly, so absorbance changes most per unit concentration"
        - "Any wavelength, because the Beer–Lambert law holds at every wavelength"
        - "400 nm (violet), because shorter wavelengths carry more energy and are absorbed more"
      option_explanations:
        - |
          A red solution looks red because it transmits red light; it absorbs very little at 650 nm, so the absorbance would be tiny and insensitive.
        - |
          Correct. The dye transmits red and absorbs the complementary green region most strongly; at λ_max the molar absorptivity is largest, so the calibration line is steepest.
        - |
          Beer's law holds at each wavelength, but ε differs enormously; measuring where ε is largest gives the greatest sensitivity and precision.
        - |
          Photon energy does not decide absorbance; a substance absorbs only where its electronic transitions match, which for a red dye is the green region.
      answer: 1
      explanation: |
        Measure at the wavelength of maximum absorbance, the colour complementary to the solution's.

    - slug: apchem-u03-w12-q05
      type: multiple_choice
      topic_code: "3.13"
      source: "general knowledge"
      points: 1
      prompt: |
        A solution transmits 50.0 % of the light at the measuring wavelength. What is its absorbance?
      options:
        - "0.500"
        - "50.0"
        - "2.00"
        - "0.301"
      option_explanations:
        - |
          0.500 is the transmittance as a fraction; absorbance is the negative logarithm of that fraction.
        - |
          50.0 is the percent transmittance; absorbance is unitless and rarely exceeds 2 in practice.
        - |
          2.00 is the absorbance of a solution transmitting only 1 % of the light (T = 0.01).
        - |
          Correct. A = −log T = −log(0.500) = 0.301.
      answer: 3
      explanation: |
        A = −log(0.50) = 0.301.

    - slug: apchem-u03-w12-q06
      type: multiple_choice
      topic_code: "3.13"
      source: "general knowledge"
      points: 1
      prompt: |
        An aqueous solution of nickel(II) sulfate appears green. Which statement about its absorption of visible light is correct?
      options:
        - "It absorbs mainly red and violet light and transmits green."
        - "It absorbs mainly green light and transmits the rest."
        - "It absorbs all visible light equally, and the green colour comes from the sulfate ion."
        - "It absorbs no visible light; the green colour comes from reflected light."
      option_explanations:
        - |
          Correct. A solution shows the light it transmits; a green solution absorbs the complementary regions (red and violet-blue) and lets green through.
        - |
          If green were absorbed, the solution would appear the complementary colour (magenta-red), not green.
        - |
          Equal absorption at all wavelengths gives a grey or colourless appearance; sulfate ions are colourless.
        - |
          A coloured transparent solution owes its colour to absorption of some wavelengths; transmitted, not reflected, light reaches the eye.
      answer: 0
      explanation: |
        Transmitted colour = colour seen; absorbed colour is complementary.

    # ---- Multiple choice (3.12)
    - slug: apchem-u03-w12-q07
      type: multiple_choice
      topic_code: "3.12"
      source: "general knowledge"
      points: 1
      prompt: |
        Red light shone on a potassium surface ejects no electrons, however bright the lamp or however long it shines. Which explanation is consistent with the photon model of light?
      options:
        - "Red light is absorbed by the metal as heat before it can reach the electrons."
        - "The electrons need time to accumulate energy from the wave, and the experiment was not run long enough."
        - "Each red photon carries less energy than the work function, and one electron absorbs only one photon, so no electron can be freed."
        - "Red light has too long a wavelength to fit between the atoms of the metal surface."
      option_explanations:
        - |
          Heating is not the issue; the same metal under dim violet light emits electrons immediately.
        - |
          This is the wave-model prediction, and it is exactly what is not observed: with light above the threshold, emission is instant, and below it, waiting does nothing.
        - |
          Correct. E = hν for a red photon is below potassium's work function; since photons are absorbed one at a time, no single absorption can supply enough energy, and intensity cannot compensate.
        - |
          Wavelength has no such geometric role; the issue is the energy per photon, not whether the wave "fits".
      answer: 2
      explanation: |
        Below the threshold frequency, hν < φ for every photon.

    - slug: apchem-u03-w12-q08
      type: multiple_choice
      topic_code: "3.12"
      source: "general knowledge"
      points: 1
      prompt: |
        Ultraviolet light of a fixed wavelength ejects electrons from a metal. The intensity of the light is then doubled. What happens?
      options:
        - "Twice as many electrons are ejected per second, each with twice the kinetic energy."
        - "Twice as many electrons are ejected per second, each with the same maximum kinetic energy as before."
        - "The same number of electrons are ejected per second, each with twice the kinetic energy."
        - "The same number of electrons are ejected per second with the same kinetic energy; intensity has no effect."
      option_explanations:
        - |
          Doubling intensity doubles the number of photons but not their individual energy, so the electrons' energy is unchanged.
        - |
          Correct. Intensity is the number of photons per second; each still carries hν, so each electron still gets hν − φ, but twice as many are freed.
        - |
          The number of electrons tracks the number of photons, which doubled; the kinetic energy depends only on frequency.
        - |
          Intensity does affect the rate of emission (the photocurrent), just not the energy of each electron.
      answer: 1
      explanation: |
        Intensity → number of electrons; frequency → their energy.

    - slug: apchem-u03-w12-q09
      type: multiple_choice
      topic_code: "3.12"
      source: "NIST CODATA constants"
      points: 1
      prompt: |
        A metal has a work function of 4.0 × 10⁻¹⁹ J. Light of wavelength 350 nm (photon energy 5.7 × 10⁻¹⁹ J) shines on it. What is the maximum kinetic energy of the ejected electrons?
      options:
        - "1.7 × 10⁻¹⁹ J"
        - "5.7 × 10⁻¹⁹ J"
        - "9.7 × 10⁻¹⁹ J"
        - "0 J, because no electrons are ejected"
      option_explanations:
        - |
          Correct. KE_max = E_photon − φ = 5.7 × 10⁻¹⁹ − 4.0 × 10⁻¹⁹ = 1.7 × 10⁻¹⁹ J.
        - |
          5.7 × 10⁻¹⁹ J is the whole photon energy; the electron must first spend the work function to escape the surface.
        - |
          Adding the work function to the photon energy has no physical meaning; the work function is a cost, subtracted from the photon energy.
        - |
          The photon energy exceeds the work function, so electrons are ejected with the leftover energy.
      answer: 0
      explanation: |
        KE = hν − φ.

    - slug: apchem-u03-w12-q10
      type: multiple_choice
      topic_code: "3.12"
      source: "general knowledge"
      points: 1
      prompt: |
        A negatively charged zinc plate attached to an electroscope is illuminated first with a very bright visible lamp and then with a dim ultraviolet lamp. The electroscope discharges only under the ultraviolet lamp. Which conclusion is best supported?
      options:
        - "Ultraviolet light heats the plate more than visible light does."
        - "The visible lamp was too far from the plate to deliver enough total energy."
        - "Zinc absorbs ultraviolet light but reflects all visible light."
        - "The energy of each visible photon is below zinc's work function, while each ultraviolet photon carries enough to eject an electron."
      option_explanations:
        - |
          A dim UV lamp delivers far less total energy than a bright visible lamp; heating cannot be the explanation.
        - |
          Total energy delivered is not what matters; a brighter or closer visible lamp still ejects nothing because each photon is too weak.
        - |
          Zinc does absorb visible light (it warms up); the absorbed visible photons simply cannot supply the work function.
        - |
          Correct. Zinc's threshold lies in the ultraviolet (about 288 nm); visible photons carry at most about 5 × 10⁻¹⁹ J, less than the work function, while UV photons exceed it and free electrons that carry away the negative charge.
      answer: 3
      explanation: |
        Per-photon energy, not total intensity, decides whether electrons are ejected.

    # ---- Review (3.11)
    - slug: apchem-u03-w12-q11
      type: multiple_choice
      topic_code: "3.11"
      source: "general knowledge"
      points: 1
      prompt: |
        Which list places the regions of the electromagnetic spectrum in order of increasing photon energy?
      options:
        - "Ultraviolet < visible < infrared < microwave"
        - "Microwave < infrared < visible < ultraviolet"
        - "Infrared < microwave < ultraviolet < visible"
        - "Visible < infrared < ultraviolet < microwave"
      option_explanations:
        - |
          This is the order of decreasing energy; ultraviolet photons carry the most energy of the four.
        - |
          Correct. Wavelength decreases and photon energy (E = hc/λ) increases from microwave through infrared and visible to ultraviolet.
        - |
          Microwaves have longer wavelengths than infrared and visible light lies below ultraviolet; both pairs are reversed here.
        - |
          Visible photons are more energetic than infrared and far more than microwave; this ordering is scrambled.
      answer: 1
      explanation: |
        Energy rises as wavelength falls: microwave, IR, visible, UV.

    # ---- Review (1.7)
    - slug: apchem-u03-w12-q12
      type: multiple_choice
      topic_code: "1.7"
      source: "NIST Atomic Spectra Database (ionization energies, rounded)"
      points: 1
      prompt: |
        Metals with low first ionization energies tend to have low work functions. Which of the following metals has the lowest first ionization energy?
      options:
        - "Magnesium"
        - "Sodium"
        - "Potassium"
        - "Calcium"
      option_explanations:
        - |
          Magnesium (738 kJ/mol) has a higher ionization energy than sodium because of its greater effective nuclear charge in the same period.
        - |
          Sodium (496 kJ/mol) is low, but potassium's outer electron is in a higher shell, farther from the nucleus and more shielded.
        - |
          Correct. Potassium (419 kJ/mol) has its valence electron in n = 4, farther from the nucleus and better shielded than sodium's n = 3 electron; ionization energy falls down a group.
        - |
          Calcium (590 kJ/mol) is in the same period as potassium but has a greater effective nuclear charge, so its ionization energy is higher.
      answer: 2
      explanation: |
        Ionization energy decreases down a group and increases across a period.

    # ---- Multi-select
    - slug: apchem-u03-w12-q13
      type: multi_select
      topic_code: "3.12"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which observations about the photoelectric effect are correctly explained by the photon model of light? Select all that apply.
      options:
        - "Electrons are emitted immediately when light above the threshold frequency strikes the metal, even if the light is dim."
        - "Below the threshold frequency, no electrons are emitted no matter how intense the light."
        - "The maximum kinetic energy of the electrons increases as the frequency of the light increases."
        - "The maximum kinetic energy of the electrons increases as the intensity of the light increases."
        - "A graph of maximum kinetic energy against frequency is a straight line whose slope is Planck's constant."
      option_explanations:
        - |
          Correct. A single photon transfers its energy to a single electron in one event; no accumulation time is needed.
        - |
          Correct. Each photon's energy hν is below the work function, and photons are absorbed one at a time, so no electron can escape.
        - |
          Correct. KE_max = hν − φ rises linearly with frequency.
        - |
          Incorrect, so it should not be selected. Intensity changes the number of photons and hence the number of electrons, not the energy of each.
        - |
          Correct. Rearranging KE_max = hν − φ shows a line of slope h and intercept −φ; this was how Millikan measured h.
      answer: [0, 1, 2, 4]
      explanation: |
        All but the intensity–energy claim follow from E = hν and one-photon-one-electron absorption.

    - slug: apchem-u03-w12-q14
      type: multi_select
      topic_code: "3.1"
      source: "NIST Chemistry WebBook (boiling points, rounded)"
      points: 2
      partial_credit: true
      prompt: |
        Consider the substances CH₄ (boiling point −162 °C), CH₃OH (65 °C), CH₃Cl (−24 °C) and C₄H₁₀ (−1 °C). Which statements correctly explain the boiling points? Select all that apply.
      options:
        - "CH₃OH boils highest because its molecules hydrogen-bond."
        - "C₄H₁₀ boils higher than CH₄ because its larger electron cloud gives stronger dispersion forces."
        - "CH₃Cl boils higher than CH₄ because it is polar and has more electrons, giving dipole–dipole and stronger dispersion forces."
        - "CH₄ boils lowest because its C–H bonds are the weakest of the four substances."
        - "C₄H₁₀ boils higher than CH₃Cl because it is more polar."
      option_explanations:
        - |
          Correct. The O–H group lets methanol molecules hydrogen-bond, the strongest intermolecular force among the four.
        - |
          Correct. Butane and methane are both nonpolar; the larger molecule has more electrons and a more polarisable cloud, so stronger dispersion forces.
        - |
          Correct. Chloromethane has a permanent dipole and more electrons than methane; both factors raise its boiling point.
        - |
          Incorrect, so it should not be selected. Boiling does not break covalent bonds; methane boils lowest because its intermolecular (dispersion) forces are weakest.
        - |
          Incorrect, so it should not be selected. Butane is nonpolar; it boils higher than chloromethane because its larger size gives dispersion forces that outweigh chloromethane's dipole–dipole forces.
      answer: [0, 1, 2]
      explanation: |
        Hydrogen bonding > dispersion (size) and dipole effects; boiling breaks IMFs, not bonds.

    # ---- True / false
    - slug: apchem-u03-w12-q15
      type: true_false
