    # ---- Short answer
    - slug: apchem-u03-w12-q22
      type: short_answer
      topic_code: "3.12"
      source: "NIST CODATA constants"
      points: 3
      prompt: |
        A clean caesium surface has a work function of 3.4 × 10⁻¹⁹ J.
        (a) Calculate the threshold frequency for the photoelectric effect in caesium (h = 6.626 × 10⁻³⁴ J·s).
        (b) Light of frequency 7.5 × 10¹⁴ Hz is shone on the surface. Calculate the maximum kinetic energy of the ejected electrons.
        (c) The experiment is repeated with light of frequency 4.0 × 10¹⁴ Hz at ten times the intensity. Predict the result and explain it using the photon model.
      answer: |
        (a) ν₀ = φ/h = 3.4 × 10⁻¹⁹ ÷ 6.626 × 10⁻³⁴ = 5.1 × 10¹⁴ Hz.
        (b) KE_max = hν − φ = (6.626 × 10⁻³⁴)(7.5 × 10¹⁴) − 3.4 × 10⁻¹⁹ = 4.97 × 10⁻¹⁹ − 3.4 × 10⁻¹⁹ = 1.6 × 10⁻¹⁹ J.
        (c) No electrons are ejected. Each photon carries hν = 2.65 × 10⁻¹⁹ J, less than the work function; since one electron absorbs one photon, no single absorption can free an electron, and increasing the intensity only increases the number of these inadequate photons.
      explanation: |
        Scoring: 1 point for (a) ν₀ = 5.1 × 10¹⁴ Hz (accept 5.0–5.2 × 10¹⁴); 1 point for (b) 1.6 × 10⁻¹⁹ J (accept 1.5–1.7 × 10⁻¹⁹) with the subtraction shown; 1 point for (c) predicting no emission because hν < φ and explaining that intensity changes the number of photons, not the energy per photon.

    - slug: apchem-u03-w12-q23
      type: short_answer
      topic_code: "3.13"
      source: "general knowledge"
      points: 3
      prompt: |
        A student must determine the concentration of a blue food dye in a sports drink using a spectrophotometer and a stock solution of the pure dye of known concentration.
        (a) Explain how the student should choose the wavelength for the measurement.
        (b) Describe how to construct a calibration curve from the stock solution, naming the quantities plotted.
        (c) The sports drink gives an absorbance above the highest standard. Explain what the student should do and how the final concentration is calculated.
      answer: |
        (a) Measure the absorbance spectrum of a dye solution across the visible range and select the wavelength of maximum absorbance (for a blue dye, in the orange-red region around 600–650 nm); this gives the largest change in absorbance per unit concentration.
        (b) Prepare four or five standards by diluting the stock by known factors (M₁V₁ = M₂V₂), zero the instrument with a blank (water in the same type of cuvette), measure each standard's absorbance at the chosen wavelength in a 1.00 cm cuvette, and plot absorbance (y) against concentration (x); the best-fit line through the origin has slope εb.
        (c) Dilute a measured volume of the drink by a known factor (for example 10.0 mL to 50.0 mL) so its absorbance falls within the calibrated range, measure again, read the concentration from the line (c = A ÷ slope), and multiply by the dilution factor (× 5 in the example) to obtain the dye concentration in the original drink.
      explanation: |
        Scoring: 1 point for (a) choosing the wavelength of maximum absorbance with the sensitivity reason; 1 point for (b) preparing standards by dilution, blanking, and plotting absorbance against concentration; 1 point for (c) diluting by a known factor into the calibrated range and multiplying the result back by that factor (not extrapolating).

    # ---- Long answer
    - slug: apchem-u03-w12-q24
      type: long_answer
      topic_code: "3.13"
      source: "general knowledge"
      points: 6
      prompt: |
        Iron(III) ions are colourless in solution, but in the presence of excess thiocyanate ion they form the deep red complex [Fe(SCN)]²⁺, which absorbs most strongly at 450 nm. A student uses this reaction to find the iron concentration in a water sample. Standards containing 1.00 × 10⁻⁵, 2.00 × 10⁻⁵, 3.00 × 10⁻⁵ and 4.00 × 10⁻⁵ M [Fe(SCN)]²⁺ give absorbances of 0.070, 0.140, 0.210 and 0.280 in a 1.00 cm cuvette. The treated water sample gives A = 0.175.
        (a) Explain why thiocyanate must be added before the iron can be measured with a visible spectrophotometer, and why 450 nm is chosen.
        (b) Determine the molar absorptivity of [Fe(SCN)]²⁺ at 450 nm from the standards.
        (c) Calculate the concentration of iron in the water sample.
        (d) The student notices a fingerprint on the cuvette used for the sample but not on those used for the standards. Explain whether the reported iron concentration is too high or too low.
        (e) A different student measures the same sample at 600 nm, where [Fe(SCN)]²⁺ absorbs weakly, and obtains a concentration with a much larger uncertainty. Explain why.
      answer: |
        (a) Fe³⁺(aq) absorbs no visible light, so it gives no absorbance to measure; converting it to the red complex gives a species that absorbs in the visible. 450 nm is the complex's wavelength of maximum absorbance (it is red because it absorbs blue light), where ε is largest and the measurement most sensitive.
        (b) The standards are linear: slope = 0.280 ÷ 4.00 × 10⁻⁵ = 7.00 × 10³ M⁻¹; with b = 1.00 cm, ε = 7.00 × 10³ M⁻¹cm⁻¹.
        (c) c = A ÷ (εb) = 0.175 ÷ 7.00 × 10³ = 2.50 × 10⁻⁵ M (with excess SCN⁻, all the iron is in the complex, so this is the iron concentration).
        (d) Too high. The fingerprint scatters and absorbs light, adding to the measured absorbance; a larger A is read as a larger concentration.
        (e) At 600 nm the molar absorptivity is small, so the calibration line is nearly flat: a given uncertainty in absorbance (the instrument's noise, roughly constant) corresponds to a much larger uncertainty in concentration, and the absorbance values themselves are small compared with that noise.
      explanation: |
        Scoring: (a) 1 point for explaining that Fe³⁺ is colourless so a coloured complex is needed, and that 450 nm is λ_max for greatest sensitivity; (b) 1 point for ε = 7.00 × 10³ M⁻¹cm⁻¹ from the slope (accept 6.9–7.1 × 10³); (c) 1 point for 2.50 × 10⁻⁵ M; (d) 1 point for "too high" with the reasoning that the fingerprint adds absorbance; (e) 1 point for linking small ε to a shallow calibration slope and 1 point for explaining that a fixed absorbance uncertainty then maps to a large concentration uncertainty.
