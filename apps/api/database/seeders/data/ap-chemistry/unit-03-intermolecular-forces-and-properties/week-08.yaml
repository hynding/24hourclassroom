week: 8
unit: 3
title: "Intermolecular Forces, Solids, Liquids and Gases"
topics: ["3.1", "3.2", "3.3"]
guide: guides/week-08.md
guide_description: |
  The four intermolecular forces as Coulombic attractions (dispersion, dipole–dipole, hydrogen bonding, ion–dipole),
  how to identify them from a structure and rank substances by boiling point and vapour pressure; the four kinds of
  solid (ionic, metallic, covalent network, molecular) and the properties each structure produces; and the
  particulate picture of solids, liquids and gases as a contest between kinetic energy and attraction. Worked
  examples: ranking CH₄, C₃H₈, CH₃Cl and CH₃OH; ethanol against dimethyl ether; classifying quartz.
flashcards_description: |
  30 cards on dispersion, dipole–dipole, hydrogen-bonding and ion–dipole forces, boiling-point reasoning, vapour
  pressure and viscosity, the four solid types, and the particulate view of the three states.

flashcards:
  - front: Intermolecular force vs covalent bond → the size difference and what boiling breaks
    back: |
      IMFs are attractions between molecules, typically 1–40 kJ/mol; covalent bonds within molecules are 150–1000 kJ/mol. Boiling or melting a molecular substance overcomes IMFs; the molecules and their bonds survive intact.
    topic_code: "3.1"
  - front: London dispersion force → origin and which substances have it
    back: |
      A momentary uneven distribution of electrons creates an instantaneous dipole that induces a dipole in a neighbour; the two attract. Present in every substance; the only IMF in noble gases and nonpolar molecules.
    topic_code: "3.1"
  - front: What makes dispersion forces stronger → two factors
    back: |
      More electrons (larger, more polarisable cloud): He 4 K, Ar 87 K, Xe 165 K boiling points. More contact surface: n-pentane (309 K) boils above compact neopentane (283 K) at the same molar mass.
    topic_code: "3.1"
  - front: Dipole–dipole force → requirement and an example comparison
    back: |
      Polar molecules align δ+ to δ−. Acetaldehyde CH₃CHO (polar) boils at 293 K; propane C₃H₈ (nonpolar) at 231 K; both 44 g/mol, so the difference is the dipole–dipole contribution on top of similar dispersion.
    topic_code: "3.1"
  - front: Hydrogen bond → the strict requirement
    back: |
      A hydrogen covalently bonded to N, O or F, attracted to a lone pair on N, O or F of another molecule. Hydrogen bonded to carbon does not count. It is an unusually strong dipole–dipole attraction, not a covalent bond.
    topic_code: "3.1"
  - front: Water boils at 373 K, H₂S at 213 K → the explanation
    back: |
      Water hydrogen bonds (H on O, lone pairs on O); H₂S cannot, because sulfur is larger and far less electronegative. Hydrogen bonding outweighs H₂S's larger dispersion forces. The same anomaly appears for HF over HCl and NH₃ over PH₃.
    topic_code: "3.1"
  - front: Ethanol (351 K) vs dimethyl ether (249 K), both C₂H₆O → why
    back: |
      Equal molar mass, so similar dispersion forces; both polar. Ethanol has an O–H and hydrogen bonds between molecules; dimethyl ether's hydrogens are all on carbon, so it cannot hydrogen bond with itself.
    topic_code: "3.1"
  - front: Ion–dipole force → where it occurs and why it matters
    back: |
      Between an ion and the oppositely charged end of a polar molecule: Na⁺ surrounded by the oxygen ends of water, Cl⁻ by the hydrogen ends. Strongest of the attractions involving molecules; it is what dissolves salts in water.
    topic_code: "3.1"
  - front: Approximate strength order of IMFs for similar-sized species
    back: |
      Ion–dipole > hydrogen bonding > dipole–dipole > dispersion. But dispersion grows with size without limit: nonpolar I₂ (457 K) is held together far more strongly than polar HCl (188 K). Compare sizes before ranking.
    topic_code: "3.1"
  - front: Ranking CH₄, C₃H₈, CH₃Cl, CH₃OH by boiling point
    back: |
      CH₄ (dispersion, tiny, 112 K) < C₃H₈ (dispersion, larger, 231 K) < CH₃Cl (adds dipole–dipole, 249 K) < CH₃OH (adds hydrogen bonding, 338 K). Methanol beats the heavier CH₃Cl because hydrogen bonding is strong.
    topic_code: "3.1"
  - front: HCl < HBr < HI boiling points despite falling dipoles → why
    back: |
      188, 206, 238 K. The dipole–dipole force weakens down the group, but the dispersion force grows faster with the larger electron clouds. HF (293 K) breaks the pattern because of hydrogen bonding.
    topic_code: "3.1"
  - front: Vapour pressure → definition and its link to IMFs
    back: |
      The pressure of vapour in equilibrium with its liquid at a given temperature. Weaker IMFs let more molecules escape, so the vapour pressure is higher; a liquid boils when its vapour pressure equals the external pressure.
    topic_code: "3.1"
  - front: Viscosity and surface tension → how IMFs affect them
    back: |
      Stronger IMFs make a liquid more viscous (molecules resist sliding past one another) and raise surface tension (surface molecules are pulled inward more strongly). Water's high values come from hydrogen bonding; glycerol's from three O–H groups.
    topic_code: "3.1"
  - front: Shape and dispersion forces → n-pentane vs neopentane
    back: |
      Both C₅H₁₂, 72 g/mol. The straight chain can lie alongside its neighbours and touch along its whole length; the compact branched molecule has less contact area. n-pentane boils at 309 K, neopentane at 283 K.
    topic_code: "3.1"
  - front: IMFs present in a solution of NaCl in water → the full list
    back: |
      Ion–dipole between Na⁺ or Cl⁻ and water; hydrogen bonding and dipole–dipole among water molecules; dispersion among all particles. Name every force present, then say which dominates.
    topic_code: "3.1"
  - front: Four types of solid → particles and what holds them
    back: |
      Ionic: ions in a lattice by Coulombic attraction. Metallic: cations in an electron sea. Covalent network: atoms joined by covalent bonds throughout. Molecular: molecules held by intermolecular forces.
    topic_code: "3.2"
  - front: Molecular solid → properties and examples
    back: |
      Soft, low melting point, non-conducting in any state, often volatile, because only weak IMFs hold the molecules. Ice, iodine, sucrose, dry ice (CO₂), naphthalene.
    topic_code: "3.2"
  - front: Covalent network solid → properties and examples
    back: |
      Very hard, very high melting point, usually non-conducting, insoluble, because melting or breaking requires breaking covalent bonds throughout. Diamond, quartz (SiO₂), silicon carbide; graphite is the conducting exception.
    topic_code: "3.2"
  - front: Diamond vs graphite → same element, different solids
    back: |
      Diamond: every C sp³ bonded to four others in a 3-D network; hardest natural substance, insulator. Graphite: sp² sheets with delocalised π electrons; sheets held only by dispersion forces, so it is soft and slippery and conducts along the sheets.
    topic_code: "3.2"
  - front: Ice melts at 0 °C but quartz at 1710 °C → what breaks in each
    back: |
      Melting ice breaks hydrogen bonds between intact H₂O molecules (an IMF). Melting quartz breaks Si–O covalent bonds that run through the whole crystal. The question "what must break?" classifies the solid.
    topic_code: "3.2"
  - front: Classifying an unknown solid from properties → the decision path
    back: |
      Conducts as a solid → metallic. Conducts only when molten or dissolved → ionic. Never conducts and melts very high → covalent network. Never conducts and melts low → molecular.
    topic_code: "3.2"
  - front: Solid, liquid, gas → the kinetic-energy vs attraction contest
    back: |
      Solid: attractions dominate, particles packed and fixed, vibrating only. Liquid: KE and attractions comparable, particles touching but sliding. Gas: KE dominates, particles far apart and free between collisions.
    topic_code: "3.3"
  - front: Why gases are compressible and liquids and solids are not
    back: |
      Gas particles are separated by empty space (about ten diameters apart at 1 atm) that can be squeezed out. Liquid and solid particles are already in contact, and their electron clouds repel when pushed closer.
    topic_code: "3.3"
  - front: Particulate diagrams of the three states → how to recognise each
    back: |
      Gas: a few particles scattered through a mostly empty box. Liquid: box filled with particles in contact but disordered. Solid: box filled with particles in a regular, repeating arrangement. Same particles in all three.
    topic_code: "3.3"
  - front: What changes and what stays the same when water boils
    back: |
      Molecules go from touching (held by hydrogen bonds) to far apart and independent; kinetic energy wins. The H₂O molecules and their O–H covalent bonds are unchanged; no new substance forms.
    topic_code: "3.3"
  - front: Why ice floats → the structural reason
    back: |
      Hydrogen bonding holds water molecules in an open hexagonal lattice with more empty space than liquid water; melting collapses the lattice, so liquid water is denser (1.00 g/mL) than ice (0.92 g/mL).
    topic_code: "3.3"
  - front: Melting and boiling points as a measure of IMF strength
    back: |
      Stronger attractions require more kinetic energy (higher temperature) before particles can leave their positions (melt) or escape the liquid (boil). Ranking boiling points is ranking IMFs, size for size.
    topic_code: "3.3"
  - front: Density of the three states → why solids and liquids are far denser
    back: |
      Particles in solids and liquids touch, so mass per volume is high; a gas at 1 atm is mostly empty space, so its density is roughly a thousand times lower (air about 1.2 g/L; water 1.0 g/mL).
    topic_code: "3.3"
  - front: Error-spotting → "water has a high boiling point because O–H bonds are strong"
    back: |
      Wrong force. Boiling separates molecules; the O–H bonds stay intact. The correct reason is the strong hydrogen bonding between molecules, which is an intermolecular force.
    topic_code: "3.1"
  - front: Which practice? Justifying a boiling-point ranking
    back: |
      Practice 6 (argumentation) using practice 1 (structural models): draw or describe each structure, name the IMFs present (every one), compare sizes for dispersion, then rank and state the evidence (boiling points).
    topic_code: "3.1"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 3.1, 3.2 and 3.3: intermolecular forces, types
    of solids, and the three states of matter), with about a third reviewing Units 1 and 2. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically;
    the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: boiling points of hydrides (3.1, 2.7)
    - slug: apchem-u03-w08-q01
      type: multiple_choice
      topic_code: "3.1"
      source: "NIST Chemistry WebBook (boiling points, rounded)"
      points: 1
      stimulus: |
        | Compound | Molar mass (g/mol) | Boiling point (K) |
        |---|---|---|
        | H₂O | 18.02 | 373 |
        | H₂S | 34.08 | 213 |
        | H₂Se | 80.98 | 232 |
        | H₂Te | 129.6 | 271 |
      prompt: |
        Which statement best explains the trend in boiling point from H₂S to H₂Te?
      options:
        - "The molecules become more polar down the group, strengthening dipole–dipole forces."
        - "The molecules have more electrons and are more polarisable down the group, so dispersion forces strengthen."
        - "Hydrogen bonding becomes stronger as the central atom gets larger."
        - "The covalent bonds become weaker down the group, so the molecules fall apart more easily."
      option_explanations:
        - |
          Electronegativity falls from S to Te, so the molecules become less polar, not more.
        - |
          Correct. From H₂S (18 electrons) to H₂Te (54 electrons) the electron cloud grows larger and more easily distorted, and the resulting stronger dispersion forces raise the boiling point.
        - |
          None of these three hydrogen bonds; S, Se and Te are too large and not electronegative enough.
        - |
          Boiling does not break covalent bonds; it separates intact molecules.
      answer: 1
      explanation: |
        Within a family of similar molecules, dispersion forces track the number of electrons.

    - slug: apchem-u03-w08-q02
      type: multiple_choice
      topic_code: "3.1"
      source: "NIST Chemistry WebBook (boiling points, rounded)"
      points: 1
      stimulus: |
        | Compound | Molar mass (g/mol) | Boiling point (K) |
        |---|---|---|
        | H₂O | 18.02 | 373 |
        | H₂S | 34.08 | 213 |
        | H₂Se | 80.98 | 232 |
        | H₂Te | 129.6 | 271 |
      prompt: |
        If the trend from H₂Te to H₂S continued, water would be expected to boil at roughly 190 K. Which statement best explains why its actual boiling point is 373 K?
      options:
        - "Water's molar mass is too small for the trend to apply."
        - "Water is an ionic compound, unlike the other hydrides."
        - "Water's O–H bonds are the strongest covalent bonds in the series."
        - "Water molecules form hydrogen bonds, which are much stronger than the dipole–dipole and dispersion forces in the other hydrides."
      option_explanations:
        - |
          A small molar mass would make the boiling point lower still, not 180 K higher.
        - |
          Water is a molecular compound of two nonmetals; it is not ionic.
        - |
          Covalent bond strength is irrelevant to boiling; the O–H bonds survive the phase change.
        - |
          Correct. Hydrogen bonded to highly electronegative oxygen with lone pairs produces strong intermolecular hydrogen bonds; much more energy is needed to separate the molecules.
      answer: 3
      explanation: |
        Hydrogen bonding (H on N, O or F) overrides the dispersion trend.

    - slug: apchem-u03-w08-q03
      type: multiple_choice
      topic_code: "2.7"
      source: "NIST Chemistry WebBook (boiling points, rounded)"
      points: 1
      stimulus: |
        | Compound | Molar mass (g/mol) | Boiling point (K) |
        |---|---|---|
        | H₂O | 18.02 | 373 |
        | H₂S | 34.08 | 213 |
        | H₂Se | 80.98 | 232 |
        | H₂Te | 129.6 | 271 |
      prompt: |
        All four hydrides have a bent molecular geometry. Which consequence of that geometry is necessary for the dipole–dipole forces among their molecules to exist?
      options:
        - "The bent shape makes the bonds nonpolar."
        - "The bent shape prevents the two bond dipoles from cancelling, so each molecule has a net dipole."
        - "The bent shape allows the central atom to expand its octet."
        - "The bent shape makes the molecules linear when they approach each other."
      option_explanations:
        - |
          Bond polarity depends on electronegativity difference, not on shape; the X–H bonds are polar in all four.
        - |
          Correct. In a bent molecule the two bond dipoles add to a net molecular dipole; a linear XH₂ would be nonpolar and have no dipole–dipole forces at all.
        - |
          Octet expansion has nothing to do with shape here; oxygen cannot expand its octet in any case.
        - |
          Shape is a property of the molecule, not of how it approaches a neighbour.
      answer: 1
      explanation: |
        Review of 2.7: molecular polarity (from geometry) is the prerequisite for dipole–dipole forces.

    # ---- Multiple choice (3.1)
    - slug: apchem-u03-w08-q04
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following molecules can form hydrogen bonds with other molecules of the same kind?
      options:
        - "CH₄"
        - "CH₃OCH₃"
        - "CH₃NH₂"
        - "CH₃Cl"
      option_explanations:
        - |
          Methane's hydrogens are all on carbon; it has only dispersion forces.
        - |
          Dimethyl ether has an oxygen but every hydrogen is on carbon; it can accept a hydrogen bond from water but cannot hydrogen bond with itself.
        - |
          Correct. Methylamine has an N–H bond and a lone pair on nitrogen, so the N–H hydrogen of one molecule attracts the nitrogen lone pair of another.
        - |
          Chloromethane is polar (dipole–dipole) but has no H on N, O or F.
      answer: 2
      explanation: |
        Hydrogen bonding requires an H bonded to N, O or F.

    - slug: apchem-u03-w08-q05
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which substance has the highest vapour pressure at 25 °C?
      options:
        - "CH₃OCH₃ (dimethyl ether)"
        - "CH₃CH₂OH (ethanol)"
        - "H₂O"
        - "CH₃CH₂CH₂OH (propanol)"
      option_explanations:
        - |
          Correct. Dimethyl ether (46 g/mol) is polar but cannot hydrogen bond with itself, so its IMFs are the weakest here; it is a gas at 25 °C with a vapour pressure near 600 kPa.
        - |
          Ethanol hydrogen bonds; its vapour pressure (7.9 kPa) is well below dimethyl ether's.
        - |
          Water hydrogen bonds extensively; its vapour pressure at 25 °C is only 3.2 kPa.
        - |
          Propanol hydrogen bonds and is larger than ethanol, giving it the lowest vapour pressure of the four (2.8 kPa).
      answer: 0
      explanation: |
        Weakest IMFs, highest vapour pressure.

    - slug: apchem-u03-w08-q06
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Iodine, I₂ (nonpolar, 254 g/mol), is a solid at room temperature while hydrogen chloride, HCl (polar, 36.5 g/mol), is a gas. Which statement best explains this?
      options:
        - "Dipole–dipole forces are always weaker than dispersion forces."
        - "Iodine forms covalent bonds between its molecules in the solid."
        - "The dispersion forces among the large, highly polarisable I₂ molecules are stronger than the combined dipole–dipole and dispersion forces among the small HCl molecules."
        - "HCl's polarity makes its molecules repel one another."
      option_explanations:
        - |
          For molecules of similar size, dipole–dipole forces add to dispersion and raise boiling points; the comparison depends on size.
        - |
          I₂ in the solid is held by intermolecular dispersion forces; the only covalent bond is the I–I bond within each molecule.
        - |
          Correct. With 106 electrons, I₂ has very large dispersion forces; HCl's 18 electrons give weak dispersion forces and its dipole–dipole attraction is not enough to compensate.
        - |
          Polar molecules attract one another (δ+ to δ−); they do not repel.
      answer: 2
      explanation: |
        Size can make dispersion the dominant force even against polar molecules.

    - slug: apchem-u03-w08-q07
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        When solid potassium iodide dissolves in water, which intermolecular attraction forms between the ions and the solvent?
      options:
        - "Dispersion forces between K⁺ and I⁻"
        - "Hydrogen bonds between K⁺ and the hydrogen atoms of water"
        - "Ion–dipole attractions between each ion and the oppositely charged end of water molecules"
        - "Covalent bonds between the ions and oxygen"
      option_explanations:
        - |
          Dispersion forces exist among all particles but are not the attraction that pulls ions into solution.
        - |
          Hydrogen bonds involve H on N, O or F with a lone pair; a cation is not a hydrogen-bond donor. K⁺ is attracted to water's oxygen end.
        - |
          Correct. K⁺ is surrounded by the δ− oxygen ends of water molecules and I⁻ by the δ+ hydrogen ends; these ion–dipole attractions release the energy that breaks up the lattice.
        - |
          No covalent bonds form; the ions remain ions, hydrated by water.
      answer: 2
      explanation: |
        Ion–dipole: the force behind dissolving salts in water.

    # ---- Multiple choice (3.2, 3.3)
    - slug: apchem-u03-w08-q08
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A solid is extremely hard, melts above 2000 °C, does not conduct electricity in the solid or molten state, and is insoluble in water. It is best classified as
      options:
        - "an ionic solid"
        - "a metallic solid"
        - "a molecular solid"
        - "a covalent network solid"
      option_explanations:
        - |
          Ionic solids conduct when molten; this solid does not.
        - |
          Metals conduct electricity in the solid state through their delocalised electrons; this solid does not.
        - |
          Molecular solids are soft and melt at low temperatures because only IMFs hold the molecules.
        - |
          Correct. Covalent bonds throughout the lattice (as in diamond or SiC) must be broken to melt or scratch it, and with no mobile electrons or ions it never conducts.
      answer: 3
      explanation: |
        Very high melting, non-conducting in all states: covalent network.

    - slug: apchem-u03-w08-q09
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Graphite conducts electricity along its layers and is soft enough to use as a lubricant, while diamond is an insulator and the hardest natural substance. Which statement explains both differences?
      options:
        - "Graphite is a molecular solid while diamond is a covalent network solid."
        - "Graphite contains metallic bonds while diamond contains covalent bonds."
        - "In graphite each carbon is sp²-bonded within flat sheets that have delocalised π electrons and are held to one another only by dispersion forces; in diamond each carbon is sp³-bonded to four others in a rigid three-dimensional network with no delocalised electrons."
        - "Diamond's bonds are ionic, which makes it hard."
      option_explanations:
        - |
          Both are covalent network solids of carbon; the difference lies in the dimensionality of the network.
        - |
          Graphite's conductivity comes from delocalised π electrons in covalent sheets, not from metallic bonding.
        - |
          Correct. Delocalised π electrons within the sheets carry current; weak forces between sheets let them slide. Diamond's full three-dimensional σ-bonded network has no mobile electrons and resists any deformation.
        - |
          Diamond is a single element; its bonds are covalent.
      answer: 2
      explanation: |
        Structure explains properties: sheets plus π electrons versus a 3-D σ network.

    - slug: apchem-u03-w08-q10
      type: multiple_choice
      topic_code: "3.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Particulate diagram description: Box 1 shows about ten identical molecules spread widely through the box with large empty spaces. Box 2 shows the box completely filled with the same molecules in contact but in no regular pattern. Box 3 shows the box filled with the molecules in a regular, repeating arrangement. Which statement about the three boxes is correct?
      options:
        - "Box 1 is a gas, box 2 a liquid and box 3 a solid; only the gas is easily compressed because only it contains large empty spaces."
        - "Box 1 is a solid, because solids have the lowest density."
        - "Box 2 is a gas, because the molecules are disordered."
        - "All three boxes represent the same state at different temperatures."
      option_explanations:
        - |
          Correct. Spacing distinguishes gas from the condensed states; order distinguishes solid from liquid. Compressing a gas removes empty space; liquids and solids have none to remove.
        - |
          Solids have high density with particles in contact; widely spaced particles are a gas.
        - |
          Disorder alone does not make a gas; the filled box with touching molecules is a liquid.
        - |
          The three arrangements differ in spacing and order, which is exactly what distinguishes the three states.
      answer: 0
      explanation: |
        Gas: far apart. Liquid: touching, disordered. Solid: touching, ordered.

    # ---- Review (2.1, 1.7)
    - slug: apchem-u03-w08-q11
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Hydrogen bonding is strongest for H bonded to F, O or N. Which property of those three elements, from Unit 2, is the reason?
      options:
        - "They are the three largest nonmetal atoms."
        - "They are the three most electronegative elements, so the X–H bond is extremely polar and the hydrogen carries a large partial positive charge."
        - "They form the weakest covalent bonds with hydrogen."
        - "They are metals that transfer electrons to hydrogen."
      option_explanations:
        - |
          They are among the smallest atoms, which helps (the lone pair is concentrated), but size alone is not the criterion.
        - |
          Correct. ΔEN for H–F, H–O and H–N (1.78, 1.24, 0.84) leaves hydrogen strongly δ+ and nearly bare of electron density, so it interacts strongly with a neighbouring lone pair.
        - |
          H–F is one of the strongest single bonds known; bond strength is not the criterion.
        - |
          F, O and N are nonmetals; the X–H bond is polar covalent, not ionic.
      answer: 1
      explanation: |
        Review of 2.1: bond polarity from electronegativity difference is the root of hydrogen bonding.

    - slug: apchem-u03-w08-q12
      type: multiple_choice
      topic_code: "1.7"
      source: "general knowledge"
      points: 1
      prompt: |
        The noble gases boil at He 4 K, Ne 27 K, Ar 87 K, Kr 120 K and Xe 165 K. Which periodic trend from Unit 1 underlies this pattern?
      options:
        - "Increasing electronegativity down the group"
        - "Increasing nuclear charge, which makes the atoms more polar"
        - "Decreasing ionization energy across a period"
        - "Increasing atomic radius and electron count down the group, making the electron cloud more polarisable"
      option_explanations:
        - |
          Noble gases are not assigned electronegativities, and electronegativity decreases down a group anyway.
        - |
          A single atom has no permanent dipole; the attraction is from momentary, induced dipoles.
        - |
          The noble gases are in one group, not one period, and ionization energy is not the property driving dispersion forces.
        - |
          Correct. Each noble gas down the group adds a shell; the larger, more loosely held electron cloud distorts more easily, so dispersion forces grow and the boiling point rises.
      answer: 3
      explanation: |
        Review of 1.7: the radius/electron-count trend drives polarisability and hence dispersion forces.

    # ---- Multi-select
    - slug: apchem-u03-w08-q13
      type: multi_select
      topic_code: "3.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following statements about intermolecular forces are correct? Select all that apply.
      options:
        - "Dispersion forces are present in all molecular substances, polar or nonpolar."
        - "Hydrogen bonds are covalent bonds between hydrogen and oxygen."
        - "For molecules of similar size, a polar molecule generally has stronger intermolecular forces than a nonpolar one."
        - "A larger nonpolar molecule can have stronger total intermolecular forces than a smaller polar one."
        - "Ion–dipole forces occur between two polar molecules."
      option_explanations:
        - |
          Correct. Momentary dipoles arise in every electron cloud.
        - |
          A hydrogen bond is an intermolecular attraction between an N/O/F–H hydrogen and a lone pair, roughly a tenth the strength of a covalent bond.
        - |
          Correct. Dipole–dipole attraction adds to similar dispersion forces (CH₃CHO vs C₃H₈).
        - |
          Correct. I₂ versus HCl: dispersion grows with size and can dominate.
        - |
          Ion–dipole forces involve an ion and a polar molecule; between two polar molecules the force is dipole–dipole.
      answer: [0, 2, 3]
      explanation: |
        Know what each force requires and that dispersion scales with size.

    - slug: apchem-u03-w08-q14
      type: multi_select
      topic_code: "2.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which properties are expected of an ionic solid such as calcium fluoride, CaF₂? Select all that apply.
      options:
        - "A high melting point"
        - "Conduction of electricity in the solid state"
        - "Conduction of electricity when molten"
        - "Shattering when struck"
        - "A low boiling point and high vapour pressure"
      option_explanations:
