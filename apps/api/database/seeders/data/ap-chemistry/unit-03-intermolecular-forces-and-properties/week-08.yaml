    # ---- Short answer
    - slug: apchem-u03-w08-q22
      type: short_answer
      topic_code: "3.1"
      source: "NIST Chemistry WebBook (boiling points, rounded)"
      points: 3
      stimulus: |
        | Substance | Formula | Molar mass (g/mol) | Boiling point (K) |
        |---|---|---|---|
        | Propane | CH₃CH₂CH₃ | 44.1 | 231 |
        | Acetaldehyde | CH₃CHO | 44.1 | 293 |
        | Ethanol | CH₃CH₂OH | 46.1 | 351 |
      prompt: |
        Use the table to answer (a), (b) and (c).

        (a) Identify all the intermolecular forces present in each liquid.
        (b) Explain why acetaldehyde boils at a higher temperature than propane even though their molar masses are the same.
        (c) Explain why ethanol boils at a higher temperature than acetaldehyde.
      answer: |
        (a) Propane: dispersion only (nonpolar). Acetaldehyde: dispersion and dipole–dipole (polar C=O, no O–H). Ethanol: dispersion, dipole–dipole and hydrogen bonding (O–H).
        (b) Equal molar masses mean similar dispersion forces. Acetaldehyde's polar carbonyl group gives its molecules a permanent dipole, so dipole–dipole attractions add to the dispersion forces and more energy is needed to separate the molecules.
        (c) Ethanol has a hydrogen bonded to oxygen, so its molecules form hydrogen bonds with one another, a much stronger attraction than acetaldehyde's ordinary dipole–dipole forces; the small difference in molar mass is not the reason.
      explanation: |
        Three points, one per part.

        (a) 1 pt: all forces listed correctly for each substance (dispersion must be included for all three).

        (b) 1 pt: similar dispersion plus added dipole–dipole in acetaldehyde.

        (c) 1 pt: hydrogen bonding in ethanol (O–H) versus none in acetaldehyde.

    - slug: apchem-u03-w08-q23
      type: short_answer
      topic_code: "3.2"
      source: "general knowledge"
      points: 3
      prompt: |
        Silicon dioxide (quartz) melts at about 1710 °C, whereas carbon dioxide sublimes at −78 °C, even though both are oxides of group-14 elements with similar bond polarities. Answer (a), (b) and (c).

        (a) Classify each solid by type.
        (b) Explain, in terms of what must be overcome to melt or sublime each solid, why their temperatures differ so greatly.
        (c) A student suggests that SiO₂ has the higher melting point because Si–O bonds are stronger than C=O bonds. Explain why this reasoning is flawed, even if the bond strengths were as stated.
      answer: |
        (a) SiO₂ is a covalent network solid; CO₂ is a molecular solid.
        (b) Quartz is a continuous three-dimensional network of Si–O covalent bonds, so melting it requires breaking covalent bonds throughout the solid, which takes a great deal of energy. Solid CO₂ consists of discrete, nonpolar CO₂ molecules held together only by weak dispersion forces; subliming it separates the molecules without touching the C=O bonds, so very little energy is needed.
        (c) Covalent bond strength is irrelevant to the sublimation of CO₂ because no C=O bonds break when it sublimes; only intermolecular forces are overcome. The comparison must be between the forces that actually break: covalent bonds in SiO₂ versus dispersion forces in CO₂. (C=O, 799 kJ/mol, is in fact stronger than Si–O, 452 kJ/mol, which shows how misleading the bond-strength argument is.)
      explanation: |
        Three points, one per part.

        (a) 1 pt: covalent network and molecular.

        (b) 1 pt: covalent bonds broken throughout SiO₂ versus only dispersion forces overcome between CO₂ molecules.

        (c) 1 pt: identifies that the forces broken in the two processes are different in kind, so comparing covalent bond strengths is irrelevant for CO₂.

    # ---- Long answer
    - slug: apchem-u03-w08-q24
      type: long_answer
      topic_code: "3.1"
      source: "NIST Chemistry WebBook (boiling points, rounded)"
      points: 6
      stimulus: |
        | Substance | Formula | Molar mass (g/mol) | Boiling point (K) | Polar molecule? |
        |---|---|---|---|---|
        | Fluorine | F₂ | 38.0 | 85 | no |
        | Hydrogen chloride | HCl | 36.5 | 188 | yes |
        | Hydrogen fluoride | HF | 20.0 | 293 | yes |
        | Chlorine | Cl₂ | 70.9 | 239 | no |
        | Bromine | Br₂ | 159.8 | 332 | no |
      prompt: |
        (a) Explain the trend in boiling points among F₂, Cl₂ and Br₂.
        (b) HCl and F₂ have nearly the same molar mass. Explain why HCl boils about 100 K higher.
        (c) HF has the smallest molar mass in the table yet boils higher than HCl and Cl₂. Explain.
        (d) Predict whether I₂ (253.8 g/mol, nonpolar) boils above or below HF, and justify your prediction.
        (e) Describe, at the particulate level, what happens to the HF molecules and to the attractions among them as liquid HF is heated to its boiling point, and state which attractions are NOT broken.
      answer: |
        (a) All three are nonpolar diatomic molecules with only dispersion forces. The number of electrons rises from F₂ (18) to Cl₂ (34) to Br₂ (70), so the electron clouds become larger and more polarisable, the instantaneous dipoles stronger, and the boiling point rises (85, 239, 332 K).

        (b) Similar molar masses give similar dispersion forces. HCl is polar (ΔEN 0.96), so its molecules also attract one another by dipole–dipole forces; F₂ has no dipole. The extra attraction raises HCl's boiling point by about 100 K.

        (c) HF has a hydrogen bonded to fluorine, the most electronegative element, so its molecules form strong hydrogen bonds (H δ+ to a lone pair on F of a neighbour). Hydrogen bonding is far stronger than the dipole–dipole forces in HCl or the dispersion forces in Cl₂, and it outweighs HF's small size.

        (d) Above. I₂ has 106 electrons and very large dispersion forces; with such a large, polarisable cloud the dispersion forces exceed even HF's hydrogen bonding (I₂ boils at 457 K, HF at 293 K). Size can make dispersion the dominant force.

        (e) As the liquid is heated, the HF molecules gain kinetic energy and move faster; at the boiling point the kinetic energy is enough to overcome the hydrogen bonds (and the dipole–dipole and dispersion attractions) holding molecules in contact, and the molecules separate into the gas, far apart and moving independently. The covalent H–F bonds within the molecules are not broken; HF molecules exist in the vapour.
      explanation: |
        Six points.

        (a) 1 pt: dispersion only, strength rising with electron count/polarisability.

        (b) 1 pt: dipole–dipole in HCl added to comparable dispersion.

        (c) 1 pt: hydrogen bonding in HF (H on F with a lone pair) outweighing size.

        (d) 1 pt: above, justified by the very large dispersion forces of I₂.

        (e) 2 pts: 1 pt for kinetic energy overcoming intermolecular attractions as molecules separate; 1 pt for stating that the H–F covalent bonds remain intact.
