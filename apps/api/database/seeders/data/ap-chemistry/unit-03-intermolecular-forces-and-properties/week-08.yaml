    # ---- True / false
    - slug: apchem-u03-w08-q15
      type: true_false
      topic_code: "3.3"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: When a liquid is heated to its boiling point and vaporises, the kinetic energy of its molecules becomes large enough to overcome the intermolecular attractions, but the covalent bonds within the molecules remain intact.
      answer: true
      explanation: |
        True. Boiling is a physical change: molecules separate from one another, not into atoms. The same H₂O molecules exist in steam as in liquid water.

    - slug: apchem-u03-w08-q16
      type: true_false
      topic_code: "2.5"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: A correct Lewis diagram of a molecule is needed to decide whether it can act as a hydrogen-bond acceptor, because the acceptor must have a lone pair on N, O or F.
      answer: true
      explanation: |
        True. The Lewis diagram shows the lone pairs. Acetone (CH₃)₂C=O has no O–H and cannot donate a hydrogen bond, but its oxygen lone pairs accept hydrogen bonds from water, which is why acetone is fully miscible with water.

    # ---- Fill in the blank
    - slug: apchem-u03-w08-q17
      type: fill_blank
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        The attraction that arises from momentary, uneven distributions of electrons and is present between all molecules is the London ____ force.
      answer: ["dispersion", "dispersion force"]
      explanation: |
        London dispersion forces arise from instantaneous dipoles inducing dipoles in neighbours; they are the only intermolecular force in nonpolar substances and the dominant one in most large molecules.

