    # ---- Short answer
    - slug: apchem-u03-w09-q22
      type: short_answer
      topic_code: "3.5"
      source: "NIST CODATA constants"
      points: 3
      prompt: |
        Two flasks at 298 K contain helium (M = 0.004003 kg/mol) and nitrogen (M = 0.02801 kg/mol) respectively.
        (a) Calculate the root-mean-square speed of the helium atoms using v_rms = √(3RT/M) with R = 8.314 J/(mol·K).
        (b) Without a full calculation, state whether the nitrogen molecules are faster or slower and by roughly what factor.
        (c) Sketch, in words, how the Maxwell–Boltzmann curves for the two gases differ.
      answer: |
        (a) v_rms = √(3 × 8.314 × 298 / 0.004003) = √(1.857 × 10⁶) ≈ 1.36 × 10³ m/s.
        (b) Slower. N₂ is 7.0 times heavier, so its v_rms is √7.0 ≈ 2.6 times smaller, about 515 m/s.
        (c) The N₂ curve is taller and narrower with its peak at a lower speed; the He curve is lower, broader and peaks at a higher speed. Both enclose the same area (the same fraction of molecules in total).
      explanation: |
        Scoring: 1 point for (a) with correct substitution and an answer of 1.36 × 10³ m/s (accept 1.35–1.37 × 10³); 1 point for (b) stating slower by about √7 ≈ 2.6 (accept 2.5–2.7) or giving ≈ 515 m/s; 1 point for (c) describing the N₂ curve as narrower and peaked at lower speed and the He curve as broader and shifted to higher speed, with equal areas.

    - slug: apchem-u03-w09-q23
      type: short_answer
      topic_code: "3.6"
      source: "general knowledge"
      points: 3
      prompt: |
        At 300 K and 50 atm, the measured molar volume of ammonia gas is noticeably smaller than the ideal gas law predicts, while under the same conditions the molar volume of helium is slightly larger than predicted.
        (a) Identify the assumption of the kinetic molecular theory that fails for ammonia under these conditions, and explain how that failure lowers the molar volume.
        (b) Identify the assumption that fails for helium under these conditions and explain how it raises the molar volume.
        (c) Explain why ammonia shows a larger deviation than helium does.
      answer: |
        (a) The assumption that there are no attractive forces between particles. Ammonia molecules hydrogen-bond and attract one another; the attractions pull the molecules closer together and reduce the force of wall collisions, so the sample occupies less volume (and exerts less pressure) than an ideal gas would.
        (b) The assumption that the particles themselves occupy negligible volume. At 50 atm the helium atoms are close enough that their own volume is a noticeable fraction of the container, leaving less free space, so the measured volume is larger than the ideal prediction.
        (c) Ammonia is polar and hydrogen-bonds, so its attractions are strong and dominate; helium has only weak dispersion forces, so the attraction correction is tiny and only the small volume correction is seen.
      explanation: |
        Scoring: 1 point for (a) naming the no-attractions assumption and linking attractions to a smaller volume or pressure; 1 point for (b) naming the negligible-volume assumption and linking particle volume to a larger measured volume; 1 point for (c) attributing ammonia's larger deviation to its strong intermolecular (hydrogen-bonding) attractions compared with helium's weak dispersion forces.

    # ---- Long answer
    - slug: apchem-u03-w09-q24
      type: long_answer
      topic_code: "3.4"
      source: "PubChem (molar masses)"
      points: 6
      prompt: |
        A student is given a cylinder of an unknown pure gas and asked to determine its molar mass. She has a balance readable to 0.001 g, a 250.0 mL flask with a stopper, a barometer, a thermometer and a vacuum pump.
        (a) Describe a procedure, including the measurements she must record, that lets her determine the molar mass of the gas.
        (b) Show how the measurements are combined to give the molar mass, starting from the ideal gas law.
        (c) In one trial she finds that the gas has a density of 1.80 g/L at 1.00 atm and 298 K. Calculate the molar mass and identify the gas from among CO₂, N₂, O₂ and CH₄ (use R = 0.08206 L·atm/(mol·K)).
        (d) Explain whether the calculated molar mass would be too high or too low if some air remained in the flask when it was weighed "empty", and justify your reasoning.
      answer: |
        (a) Evacuate the flask with the pump and weigh it (m_empty). Fill it with the gas, let it come to room temperature, record the laboratory pressure from the barometer (P) and the temperature (T), and weigh the full flask (m_full). The gas mass is m_full − m_empty, and the flask volume V is known (250.0 mL = 0.2500 L).
        (b) PV = nRT with n = m/M gives PV = (m/M)RT, so M = mRT/(PV) = dRT/P where d = m/V is the density.
        (c) M = dRT/P = (1.80 g/L)(0.08206 L·atm/(mol·K))(298 K) / 1.00 atm = 44.0 g/mol. This matches CO₂ (44.01 g/mol); N₂ (28.02), O₂ (32.00) and CH₄ (16.04) are far too light.
        (d) Too low. If air remained in the "empty" flask, m_empty is too large, so the gas mass m_full − m_empty is too small; since M is proportional to the measured mass, the calculated molar mass is too low.
      explanation: |
        Scoring: (a) 1 point for weighing the evacuated flask and the filled flask to get the gas mass, and 1 point for recording P and T (volume taken as the flask volume); (b) 1 point for deriving M = mRT/(PV) or M = dRT/P from PV = nRT with n = m/M; (c) 1 point for M = 44.0 g/mol with correct substitution and 1 point for identifying CO₂ with a comparison to the alternatives; (d) 1 point for "too low" with the reasoning that the gas mass is underestimated when the empty mass is too high.
