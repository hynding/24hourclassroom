week: 9
unit: 3
title: "Gases: the Ideal Gas Law, Kinetic Molecular Theory and Real Gases"
topics: ["3.4", "3.5", "3.6"]
guide: guides/week-09.md
guide_description: |
  PV = nRT and the combined gas law, molar mass from gas density, Dalton's law of partial pressures and gases
  collected over water; kinetic molecular theory as the model behind the law, with temperature as average kinetic
  energy, root-mean-square speed and the Maxwell–Boltzmann distribution; then where real gases depart from the
  model (particle volume at high pressure, attractions at low temperature) and which gases deviate most. Worked
  examples: moles of O₂ in a cylinder, nitrogen from its density, a He/Ar mixture, hydrogen collected over water,
  v_rms of N₂ and He, and He against CO₂ at high pressure.
flashcards_description: |
  30 cards on the ideal gas law and its rearrangements, units and R values, Dalton's law, collection over water,
  the KMT assumptions, kinetic energy and speed, the Maxwell–Boltzmann curve, and real-gas deviations.

flashcards:
  - front: Ideal gas law → the equation, the two R values and the unit rules
    back: |
      PV = nRT. R = 0.08206 L·atm/(mol·K) with P in atm and V in L; R = 8.314 J/(mol·K) in energy calculations (M in kg/mol). T always in kelvin: K = °C + 273.15.
    topic_code: "3.4"
  - front: Pressure unit conversions → the equalities to know
    back: |
      1 atm = 760 torr = 760 mm Hg = 101.3 kPa. Convert to atm before using R = 0.08206; a pressure given in torr divided by 760 is in atm.
    topic_code: "3.4"
  - front: Solving PV = nRT for n → moles of O₂ in a 5.00 L cylinder at 2.00 atm and 298 K
    back: |
      n = PV/RT = (2.00)(5.00) ÷ [(0.08206)(298)] = 10.0 ÷ 24.45 = 0.409 mol. Keep units consistent and the kelvin temperature.
    topic_code: "3.4"
  - front: Molar mass from gas density → the rearrangement
    back: |
      PV = (m/M)RT gives M = mRT/(PV) = dRT/P with d in g/L. A gas of density 1.25 g/L at STP has M = (1.25)(0.08206)(273.15) ÷ 1.00 = 28.0 g/mol: N₂ or CO.
    topic_code: "3.4"
  - front: STP and molar volume → the numbers
    back: |
      Standard temperature and pressure: 273.15 K and 1 atm. One mole of ideal gas occupies 22.4 L at STP; at 25 °C and 1 atm it occupies 24.5 L. Use PV = nRT rather than memorised volumes at other conditions.
    topic_code: "3.4"
  - front: Combined gas law → when to use it and the form
    back: |
      For a fixed amount of gas whose conditions change: P₁V₁/T₁ = P₂V₂/T₂. Cancel whatever stays constant. A 2.00 L balloon at 1.00 atm, 300 K becomes 6.00 L at 0.500 atm, 450 K.
    topic_code: "3.4"
  - front: Dalton's law of partial pressures → statement and mole-fraction form
    back: |
      The total pressure of a mixture is the sum of the partial pressures each gas would exert alone: P_total = P_A + P_B + ... Each partial pressure is P_A = X_A × P_total, where X_A = n_A ÷ n_total.
    topic_code: "3.4"
  - front: Partial pressure of He in a 2.0 g He + 8.0 g Ar mixture at 1.50 atm
    back: |
      n(He) = 0.50 mol, n(Ar) = 0.20 mol; X(He) = 0.50 ÷ 0.70 = 0.714; P(He) = 0.714 × 1.50 = 1.07 atm. Pressure follows moles, not mass: the lighter gas contributes more here.
    topic_code: "3.4"
  - front: Gas collected over water → the correction and why
    back: |
      The collected gas is mixed with water vapour, so P_gas = P_total − P_water, using the vapour pressure of water at the collection temperature (23.8 torr at 25 °C). Then PV = nRT with P_gas gives moles of the gas alone.
    topic_code: "3.4"
  - front: Hydrogen collected over water → the worked numbers
    back: |
      0.250 L at 752 torr total, 25 °C: P(H₂) = 752 − 23.8 = 728.2 torr = 0.958 atm; n = (0.958)(0.250) ÷ [(0.08206)(298)] = 9.80 × 10⁻³ mol. From Mg + 2HCl → MgCl₂ + H₂, that is 0.238 g of Mg.
    topic_code: "3.4"
  - front: Pressure at constant volume when a gas is heated → the ratio
    back: |
      P₂ = P₁ × T₂/T₁ with temperatures in kelvin. 740 torr at 293 K heated to 353 K becomes 740 × 353/293 = 892 torr. Using °C in the ratio gives nonsense.
    topic_code: "3.4"
  - front: Kinetic molecular theory → the five assumptions
    back: |
      Gas particles are in constant random straight-line motion; their volume is negligible compared with the container; they exert no attractive or repulsive forces on one another; collisions are elastic; average kinetic energy is proportional to kelvin temperature.
    topic_code: "3.5"
  - front: KMT explanation of pressure
    back: |
      Pressure is the force per unit area from particles colliding with the walls. More particles or a smaller volume means more collisions per second; higher temperature means faster, harder collisions. Each gas law follows.
    topic_code: "3.5"
  - front: Temperature and average kinetic energy → the exact relationship
    back: |
      Average kinetic energy is directly proportional to kelvin temperature and depends on nothing else: all gases at 298 K have the same average KE whatever their molar mass. Doubling T (in K) doubles the average KE.
    topic_code: "3.5"
  - front: Same temperature, different gases → who moves faster and by how much
    back: |
      Equal average KE = ½mv², so lighter molecules move faster: v ∝ 1/√M. At 298 K, He (4.00 g/mol) has v_rms 1363 m/s and N₂ (28.02 g/mol) 515 m/s; the ratio 2.65 = √(28.02 ÷ 4.00).
    topic_code: "3.5"
  - front: Root-mean-square speed → formula and unit trap
    back: |
      v_rms = √(3RT/M) with R = 8.314 J/(mol·K), T in K and M in kg/mol (0.02802 for N₂, not 28.02). Forgetting the kg conversion gives a speed about 32 times too small.
    topic_code: "3.5"
  - front: Effect of temperature on speed → the square-root rule
    back: |
      Speed scales with √T. Doubling the kelvin temperature raises v_rms by √2 = 1.41, not by 2; KE doubles but speed does not.
    topic_code: "3.5"
  - front: Maxwell–Boltzmann distribution → what the axes and curve show
    back: |
      Number of molecules (y) against speed (x): zero at zero speed, a peak at the most probable speed, a long high-speed tail. The area under the curve is the total number of molecules.
    topic_code: "3.5"
  - front: Maxwell–Boltzmann curve at higher temperature → how it changes
    back: |
      The peak moves to higher speed and gets lower; the curve broadens, with more molecules in the high-speed tail. Area unchanged. At lower temperature the curve is taller, narrower and shifted left.
    topic_code: "3.5"
  - front: Maxwell–Boltzmann curves for two gases at one temperature → which is which
    back: |
      The heavier gas has the taller, narrower curve peaked at lower speed; the lighter gas is broader and shifted to higher speed. At 300 K, O₂ peaks near 390 m/s and H₂ near 1570 m/s.
    topic_code: "3.5"
  - front: KMT explanation of why a balloon expands when heated
    back: |
      Faster molecules strike the inside of the balloon harder and more often, pushing it outward until the inside pressure again matches the outside; the larger volume spreads the collisions over more area. V ∝ T at constant P.
    topic_code: "3.5"
  - front: Real gas vs ideal gas → the two assumptions that fail
    back: |
      Real particles have volume, and they attract one another (week 8's IMFs). Both are negligible at low pressure and high temperature, which is where PV = nRT works best.
    topic_code: "3.6"
  - front: Deviation at high pressure → direction and cause
    back: |
      The particles' own volume becomes a significant fraction of the container, so the gas occupies more volume than predicted: PV/nRT > 1. The gas is less compressible than an ideal gas.
    topic_code: "3.6"
  - front: Deviation at low temperature → direction and cause
    back: |
      Slow molecules are pulled toward their neighbours by intermolecular attractions, so they hit the walls less hard; the pressure is below the ideal prediction: PV/nRT < 1. Cool enough and the gas condenses.
    topic_code: "3.6"
  - front: PV/nRT vs pressure graph → the shape for CO₂, N₂ and He
    back: |
      He: almost flat at 1, rising slightly at very high pressure (volume effect only). N₂: small dip below 1 then rise. CO₂: deep dip below 1 (strong attractions) then a steep rise above 1 at very high pressure.
    topic_code: "3.6"
  - front: Which gases behave most ideally and which least → the ranking logic
    back: |
      Most ideal: small, nonpolar, weak dispersion forces (He, H₂, then Ne, N₂). Least ideal: polar or large molecules with strong IMFs (NH₃, H₂O vapour, CO₂, Cl₂). Rank by IMF strength and size.
    topic_code: "3.6"
  - front: He vs CO₂ at 200 atm and at 10 atm, 250 K → which deviates and how
    back: |
      At 200 atm both show PV/nRT > 1 from particle volume, CO₂ more because its molecules are bigger. At 10 atm and 250 K, CO₂'s attractions give PV/nRT < 1 while He stays near 1.
    topic_code: "3.6"
  - front: Conditions for most ideal behaviour → the two and why
    back: |
      Low pressure: particles far apart, their volume negligible and attractions rare. High temperature: kinetic energy far exceeds attraction energy, so attractions barely affect collisions.
    topic_code: "3.6"
  - front: Error-spotting → v_rms of N₂ calculated with M = 28.02
    back: |
      Molar mass must be in kg/mol (0.02802) when R = 8.314 J/(mol·K) is used, because 1 J = 1 kg·m²/s². The correct speed at 298 K is 515 m/s; using 28.02 gives about 16 m/s.
    topic_code: "3.5"
  - front: Which practice? Explaining a gas-law observation with KMT
    back: |
      Practice 4 (model analysis): the observation (pressure rose on heating) is explained by the model's assumptions (higher T means higher average KE, faster particles, more forceful and frequent wall collisions). Name the assumption used.
    topic_code: "3.5"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 3.4, 3.5 and 3.6: the ideal gas law, kinetic
    molecular theory and real gases), with about a third reviewing Units 1 and 2 and week 8. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically;
    the short answers and the long answer are graded by your teacher against the scoring notes. Calculator and the
    equations sheet allowed.
  questions:
    # ---- Stimulus set A: gas collected over water (3.4, 1.1)
    - slug: apchem-u03-w09-q01
      type: multiple_choice
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student reacts a strip of magnesium with excess hydrochloric acid and collects the hydrogen gas over water at 25 °C.

        | Measurement | Value |
        |---|---|
        | Volume of gas collected | 0.250 L |
        | Total pressure in the collection tube | 752 torr |
        | Vapour pressure of water at 25 °C | 23.8 torr |
        | Temperature | 298 K |
        | R | 0.08206 L·atm/(mol·K) |
      prompt: |
        Why must the vapour pressure of water be subtracted from the total pressure before calculating the moles of hydrogen?
      options:
        - "Because water vapour reacts with hydrogen and removes some of it."
        - "Because the gas in the tube is a mixture of hydrogen and water vapour, and by Dalton's law the hydrogen contributes only part of the total pressure."
        - "Because water vapour is heavier than hydrogen and sinks to the bottom of the tube."
        - "Because the ideal gas law applies only to dry gases at STP."
      option_explanations:
        - |
          Water vapour and hydrogen do not react under these conditions.
        - |
          Correct. The collected gas is H₂ plus water vapour in equilibrium with the liquid; P(H₂) = P_total − P(H₂O) = 752 − 23.8 = 728.2 torr.
        - |
          Gases mix uniformly; density differences do not separate them in the tube.
        - |
          The ideal gas law applies to any gas or mixture at any conditions where the gas is near-ideal; the issue is which pressure belongs to hydrogen.
      answer: 1
      explanation: |
        Dalton's law: each gas in a mixture contributes its own partial pressure.

    - slug: apchem-u03-w09-q02
      type: multiple_choice
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student reacts a strip of magnesium with excess hydrochloric acid and collects the hydrogen gas over water at 25 °C.

        | Measurement | Value |
        |---|---|
        | Volume of gas collected | 0.250 L |
        | Total pressure in the collection tube | 752 torr |
        | Vapour pressure of water at 25 °C | 23.8 torr |
        | Temperature | 298 K |
        | R | 0.08206 L·atm/(mol·K) |
      prompt: |
        Which expression gives the number of moles of hydrogen collected?
      options:
        - "(752 × 0.250) ÷ (0.08206 × 298)"
        - "[(752 − 23.8) × 0.250] ÷ (0.08206 × 298)"
        - "[(752 − 23.8) ÷ 760 × 0.250] ÷ (0.08206 × 298)"
        - "[(752 − 23.8) ÷ 760 × 0.250] ÷ (0.08206 × 25)"
      option_explanations:
        - |
          This uses the total pressure in torr with R in L·atm/(mol·K); it neither corrects for water vapour nor converts units.
        - |
          The water correction is right, but the pressure is still in torr while R uses atmospheres; the result would be 760 times too large.
        - |
          Correct. Hydrogen's partial pressure (728.2 torr) is converted to atm (0.958), then n = PV/RT = (0.958)(0.250) ÷ (0.08206 × 298) = 9.80 × 10⁻³ mol.
        - |
          The temperature must be in kelvin (298), not degrees Celsius.
      answer: 2
      explanation: |
        Partial pressure, correct units, kelvin: three checks before dividing.

    - slug: apchem-u03-w09-q03
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student reacts a strip of magnesium with excess hydrochloric acid and collects the hydrogen gas over water at 25 °C.

        | Measurement | Value |
        |---|---|
        | Volume of gas collected | 0.250 L |
        | Total pressure in the collection tube | 752 torr |
        | Vapour pressure of water at 25 °C | 23.8 torr |
        | Temperature | 298 K |
        | R | 0.08206 L·atm/(mol·K) |
      prompt: |
        The reaction is Mg(s) + 2HCl(aq) → MgCl₂(aq) + H₂(g), and the student finds 9.80 × 10⁻³ mol of H₂. What mass of magnesium reacted? (Mg 24.31 g/mol)
      options:
        - "0.119 g"
        - "0.238 g"
        - "0.476 g"
        - "2.48 g"
      option_explanations:
        - |
          0.119 g would be half the correct amount; the mole ratio of Mg to H₂ is 1 : 1, not 1 : 2.
        - |
          Correct. 1 mol Mg produces 1 mol H₂, so 9.80 × 10⁻³ mol × 24.31 g/mol = 0.238 g.
        - |
          0.476 g doubles the moles of magnesium, as if two Mg were needed per H₂.
        - |
          2.48 g is 0.102 mol of Mg, ten times the amount that produced this much hydrogen.
      answer: 1
      explanation: |
        Review of 1.1: moles from the gas law, then moles × molar mass.

    # ---- Multiple choice (3.4)
    - slug: apchem-u03-w09-q04
      type: multiple_choice
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A gas has a density of 1.96 g/L at 1.00 atm and 273 K. Which gas is it most likely to be?
      options:
        - "CO₂ (44.01 g/mol)"
        - "O₂ (32.00 g/mol)"
        - "N₂ (28.02 g/mol)"
        - "SO₂ (64.07 g/mol)"
      option_explanations:
        - |
          Correct. M = dRT/P = (1.96)(0.08206)(273) ÷ 1.00 = 43.9 g/mol, matching CO₂.
        - |
          Oxygen's density at 1.00 atm and 273 K would be 32.00 ÷ 22.4 = 1.43 g/L, well below the measured value.
        - |
          Nitrogen's density at these conditions is 1.25 g/L; the measured value is much higher.
        - |
          Sulfur dioxide would have a density of 2.86 g/L.
      answer: 0
      explanation: |
        M = dRT/P: density and conditions give the molar mass.

    - slug: apchem-u03-w09-q05
      type: multiple_choice
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A sealed, rigid 2.00 L flask contains gas at 1.20 atm and 300 K. The flask is heated to 400 K. What is the new pressure?
      options:
        - "0.900 atm"
        - "1.20 atm"
        - "1.60 atm"
        - "2.40 atm"
      option_explanations:
        - |
          0.900 atm would result from cooling (300/400 ratio applied the wrong way).
        - |
          The pressure cannot stay constant when the gas is heated in a rigid container.
        - |
          Correct. At constant V and n, P ∝ T: P₂ = 1.20 × (400 ÷ 300) = 1.60 atm.
        - |
          2.40 atm would require doubling the kelvin temperature to 600 K.
      answer: 2
      explanation: |
        Rigid flask: V constant, so P₂/P₁ = T₂/T₁ in kelvin.

    - slug: apchem-u03-w09-q06
      type: multiple_choice
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A mixture contains 0.60 mol of N₂, 0.30 mol of O₂ and 0.10 mol of Ar at a total pressure of 2.00 atm. What is the partial pressure of oxygen?
      options:
        - "0.30 atm"
        - "1.20 atm"
        - "0.67 atm"
        - "0.60 atm"
      option_explanations:
        - |
          0.30 is the number of moles of O₂, not its pressure; the mole fraction must be multiplied by the total pressure.
        - |
          1.20 atm is the partial pressure of nitrogen (X = 0.60).
        - |
          0.67 would be the result of dividing O₂ moles by N₂ moles instead of by the total.
        - |
          Correct. X(O₂) = 0.30 ÷ 1.00 = 0.30; P(O₂) = 0.30 × 2.00 = 0.60 atm.
      answer: 3
      explanation: |
        P_A = X_A × P_total.

    # ---- Multiple choice (3.5)
    - slug: apchem-u03-w09-q07
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Two identical flasks at 298 K contain helium and argon respectively, each at 1.00 atm. Which statement is correct?
      options:
        - "The helium atoms have greater average kinetic energy than the argon atoms."
        - "The argon atoms have greater average kinetic energy because they are heavier."
        - "The atoms in both flasks have the same average kinetic energy, but the helium atoms have the higher average speed."
        - "The atoms in both flasks have the same average speed."
      option_explanations:
        - |
          Average kinetic energy depends only on temperature, which is the same in both flasks.
        - |
          Mass does not affect average kinetic energy at a given temperature; it affects speed.
        - |
          Correct. Same T means same average KE; with KE = ½mv², the lighter helium atoms must move faster (by √(39.95 ÷ 4.00) = 3.16 times).
        - |
          Equal kinetic energy with different masses forces different speeds.
      answer: 2
      explanation: |
        KE depends on T only; speed depends on T and M.

    - slug: apchem-u03-w09-q08
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Graph description: Two Maxwell–Boltzmann distributions for the same sample of gas are drawn on one set of axes (number of molecules against speed). Curve A is tall and narrow with its peak at a lower speed. Curve B is lower and broader with its peak at a higher speed. Which statement is correct?
      options:
        - "Curve B represents the gas at a higher temperature; it has the same area as curve A."
        - "Curve A represents the gas at a higher temperature because its peak is taller."
        - "Curve B represents a larger number of molecules because it is broader."
        - "The two curves represent different gases at the same temperature, with B the heavier gas."
      option_explanations:
        - |
          Correct. Raising the temperature shifts the peak right and flattens the curve; the area (number of molecules) is unchanged for the same sample.
        - |
          A taller, narrower peak means a lower temperature: most molecules clustered near a lower speed.
        - |
          The area, not the width, gives the number of molecules; the same sample has the same area.
        - |
          For the same sample the difference is temperature; and a heavier gas would give the taller, narrower curve, not the broader one.
      answer: 0
      explanation: |
        Higher T: peak right, curve flatter and broader, area constant.

    - slug: apchem-u03-w09-q09
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        According to kinetic molecular theory, why does the pressure of a gas in a rigid container increase when more gas is pumped in at constant temperature?
      options:
        - "There are more molecules, so there are more collisions with the walls per second, and pressure is the force of those collisions per unit area."
        - "The added molecules move faster, so they hit the walls harder."
        - "The added molecules attract the original ones, pulling them toward the walls."
        - "The molecules become larger and take up more space."
      option_explanations:
        - |
          Correct. Pressure arises from wall collisions; more particles in the same volume at the same speed means more collisions per unit time and area.
        - |
          At constant temperature the average speed is unchanged; the number of collisions, not their force, increases.
        - |
          KMT assumes no attractions between gas particles; attractions would reduce, not raise, the pressure.
        - |
          Molecular size is fixed and, in the ideal model, negligible.
      answer: 0
      explanation: |
        P ∝ n at constant V and T: more collisions.

    # ---- Multiple choice (3.6)
    - slug: apchem-u03-w09-q10
      type: multiple_choice
      topic_code: "3.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Under which conditions would a sample of carbon dioxide gas be expected to deviate most from ideal behaviour?
      options:
        - "Low pressure and high temperature"
        - "High pressure and low temperature"
        - "Low pressure and low temperature"
        - "High pressure and high temperature"
      option_explanations:
        - |
          These are the conditions of most ideal behaviour: particles far apart and moving too fast for attractions to matter.
        - |
          Correct. High pressure makes the molecules' own volume significant, and low temperature lets intermolecular attractions compete with kinetic energy; both assumptions of KMT fail at once.
        - |
          Low temperature strengthens the effect of attractions, but at low pressure the molecules are far apart and rarely interact, so the deviation is small.
        - |
          High temperature suppresses the effect of attractions; only the volume effect remains, so the deviation is smaller than at low temperature.
      answer: 1
      explanation: |
        Deviations: high P (volume) and low T (attractions).


    # ---- Review (3.1)
    - slug: apchem-u03-w09-q11
      type: multiple_choice
      topic_code: "3.1"
      source: "NIST Chemistry WebBook (boiling points, rounded)"
      points: 1
      prompt: |
        The boiling points of the noble gases rise from helium (4 K) to xenon (165 K). Which statement best explains the trend?
      options:
        - "Heavier atoms have stronger covalent bonds between them, which must be broken to boil."
        - "Larger atoms are more electronegative, so dipole–dipole attractions grow down the group."
        - "Heavier atoms form hydrogen bonds more readily than lighter ones."
        - "Larger electron clouds are more polarisable, so London dispersion forces grow down the group."
      option_explanations:
        - |
          Noble gases are monatomic and form no bonds with one another; boiling overcomes intermolecular attractions, not covalent bonds.
        - |
          Noble-gas atoms have no permanent dipole, so there are no dipole–dipole forces; electronegativity is also irrelevant to a monatomic gas.
        - |
          Hydrogen bonding requires H bonded to N, O or F; noble gases contain no hydrogen at all.
        - |
          Correct. The only attraction between noble-gas atoms is dispersion, and dispersion strength grows with the size and polarisability of the electron cloud, which increases from He to Xe.
      answer: 3
      explanation: |
        Monatomic gases interact only by dispersion forces, which scale with polarisability (electron-cloud size).

    # ---- Review (2.7)
    - slug: apchem-u03-w09-q12
      type: multiple_choice
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Which molecule is nonpolar even though it contains polar bonds, and therefore has no dipole–dipole attractions between its molecules in the gas phase?
      options:
        - "H₂O"
        - "NH₃"
        - "SO₂"
        - "CF₄"
      option_explanations:
        - |
          Water is bent, so its two O–H bond dipoles add to a net dipole; it is strongly polar.
        - |
          Ammonia is trigonal pyramidal; the three N–H bond dipoles and the lone pair give a net dipole.
        - |
          Sulfur dioxide is bent (one lone pair on S), so its S=O bond dipoles do not cancel; it is polar.
        - |
          Correct. Each C–F bond is polar, but the four bonds point to the corners of a tetrahedron and their dipoles cancel exactly, leaving a nonpolar molecule.
      answer: 3
      explanation: |
        Symmetric tetrahedral geometry with four identical bonds cancels the bond dipoles.

    # ---- Multi-select
    - slug: apchem-u03-w09-q13
      type: multi_select
      topic_code: "3.5"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Two sealed 1.0 L flasks at 300 K contain, respectively, 0.10 mol of He and 0.10 mol of Ar. Which statements about the two samples are correct? Select all that apply.
      options:
        - "The two samples exert the same pressure."
        - "The average kinetic energy of the He atoms equals that of the Ar atoms."
        - "The root-mean-square speed of the He atoms is greater than that of the Ar atoms."
        - "The Ar atoms collide with the walls with the same average force per collision as the He atoms."
        - "The He sample has the greater total kinetic energy because its atoms are faster."
      option_explanations:
        - |
          Correct. Same n, V and T give the same P by the ideal gas law; the identity of the gas does not enter.
        - |
