week: 11
unit: 3
title: "Solubility and the Electromagnetic Spectrum"
topics: ["3.10", "3.11"]
guide: guides/week-11.md
guide_description: |
  Solubility as a trade of intermolecular attractions: ionic solutes and ion–dipole forces, hydrogen-bonding
  molecular solutes, nonpolar solutes in nonpolar solvents, the alcohol series, and why oil and water do not mix;
  then the electromagnetic spectrum, c = λν and E = hν, and which region excites rotation, vibration or an
  electronic transition. Worked examples: methanol against hexanol, iodine in hexane, a 450 nm photon, the sodium
  D line, and a microwave oven.
flashcards_description: |
  30 cards on "like dissolves like" and its intermolecular-force basis, solubility of salts, alcohols, nonpolar
  solutes and gases, the regions of the spectrum, the photon equations and the molecular process each region excites.

flashcards:
  - front: Dissolving as a trade → the three attractions involved
    back: |
      Solute–solute and solvent–solvent attractions are broken; solute–solvent attractions form. A solute dissolves when the new attractions are comparable to those lost.
    topic_code: "3.10"
  - front: The rule "like dissolves like" → the precise meaning
    back: |
      A solute dissolves in a solvent whose intermolecular forces resemble its own, so solute–solvent attractions can replace what is broken. Polar in polar, nonpolar in nonpolar.
    topic_code: "3.10"
  - front: Why NaCl dissolves in water but not in hexane → the forces
    back: |
      Water's dipoles form ion–dipole attractions around each ion, compensating for the lattice energy. Hexane has no dipole; dispersion forces cannot pay for breaking up the lattice.
    topic_code: "3.10"
  - front: Hydrophilic vs hydrophobic regions of a molecule → examples
    back: |
      Hydrophilic: O–H, N–H, C=O groups that hydrogen-bond with water. Hydrophobic: hydrocarbon chains and rings, which offer only dispersion forces.
    topic_code: "3.10"
  - front: Water-solubility of the alcohol series → the trend and the reason
    back: |
      Methanol, ethanol and propanol are miscible; butanol is partly soluble; hexanol and longer are nearly insoluble. One O–H can carry only three or four carbons; a longer chain disrupts water's hydrogen bonds without replacing them.
    topic_code: "3.10"
  - front: Why iodine dissolves in hexane but barely in water → the argument
    back: |
      I₂ is nonpolar (dispersion only). Hexane–I₂ dispersion attractions replace what is lost. Water would have to sacrifice strong hydrogen bonds for weak dispersion attractions, so I₂ stays out.
    topic_code: "3.10"
  - front: Oil and water → why "they repel" is wrong
    back: |
      There is no repulsion. Water–water hydrogen bonds are much stronger than water–oil dispersion attractions, so water does not make room for the oil.
    topic_code: "3.10"
  - front: Glucose's high water solubility → the structural reason
    back: |
      Five O–H groups on a six-carbon frame: most of the surface hydrogen-bonds with water, so the attractions gained exceed those lost.
    topic_code: "3.10"
  - front: Miscible vs soluble → the distinction
    back: |
      Miscible: two liquids that mix in all proportions (ethanol and water). Soluble: a solid or gas that dissolves to a useful extent. Both follow "like dissolves like".
    topic_code: "3.10"
  - front: Solubility of gases in water → effect of temperature and pressure
    back: |
      Gases dissolve better in cold water (warming gives the dissolved molecules energy to escape) and under higher pressure (more molecules strike the surface). Polar or reacting gases (NH₃, HCl) are far more soluble than N₂ or O₂.
    topic_code: "3.10"
  - front: Which ionic compounds are insoluble even in water → the reason
    back: |
      Those with very high lattice energies: small, highly charged ions (MgO, Al₂O₃, many carbonates and phosphates). Hydration cannot pay for the lattice.
    topic_code: "3.10"
  - front: Long-chain alcohol in hexane → why it dissolves well
    back: |
      The hydrocarbon chain's dispersion forces match the solvent's; the small O–H group costs little. Hexanol is far more soluble in hexane than in water.
    topic_code: "3.10"
  - front: Predicting solubility from polarity → the procedure
    back: |
      Decide whether the solute is ionic, polar molecular or nonpolar (week 7 polarity). Ionic and polar dissolve in polar solvents; nonpolar in nonpolar solvents. Then weigh the size of hydrophobic regions.
    topic_code: "3.10"
  - front: c = λν → what it links and the value of c
    back: |
      Wavelength × frequency = speed of light, c = 2.998 × 10⁸ m/s. Longer wavelength means lower frequency. Convert nm to m (× 10⁻⁹) and GHz to Hz (× 10⁹) first.
    topic_code: "3.11"
  - front: Photon energy → the two forms of the equation and h
    back: |
      E = hν = hc/λ with h = 6.626 × 10⁻³⁴ J·s. Use hν with a frequency, hc/λ with a wavelength. Higher frequency or shorter wavelength means a more energetic photon.
    topic_code: "3.11"
  - front: Order of the electromagnetic regions by increasing energy → the list
    back: |
      Radio < microwave < infrared < visible (red 700 nm to violet 400 nm) < ultraviolet < X-ray < gamma. Shorter wavelength, higher frequency, higher energy.
    topic_code: "3.11"
  - front: Microwave absorption → the molecular process
    back: |
      Rotation. Microwave photons match the small gaps between rotational levels; a microwave oven spins polar water molecules.
    topic_code: "3.11"
  - front: Infrared absorption → the molecular process and a use
    back: |
      Vibration (bond stretching and bending). Each bond type absorbs at a characteristic wavelength, so an IR spectrum fingerprints the bonds present; greenhouse gases absorb IR.
    topic_code: "3.11"
  - front: Ultraviolet and visible absorption → the molecular process
    back: |
      An electronic transition: an electron is promoted to a higher-energy orbital. Substances absorbing visible light are coloured; most small molecules absorb only in the UV.
    topic_code: "3.11"
  - front: Why a molecule absorbs only certain wavelengths → the matching rule
    back: |
      A photon is absorbed only when its energy equals the gap between two allowed energy levels of the molecule; rotational, vibrational and electronic gaps differ by orders of magnitude.
    topic_code: "3.11"
  - front: Energy of a 450 nm photon → the calculation
    back: |
      E = hc/λ = (6.626 × 10⁻³⁴)(2.998 × 10⁸) ÷ 4.50 × 10⁻⁷ = 4.41 × 10⁻¹⁹ J; per mole, × 6.022 × 10²³ = 266 kJ/mol, bond-energy scale.
    topic_code: "3.11"
  - front: Wavelength from photon energy → sodium's 3.37 × 10⁻¹⁹ J line
    back: |
      λ = hc/E = 1.986 × 10⁻²⁵ ÷ 3.37 × 10⁻¹⁹ = 5.89 × 10⁻⁷ m = 589 nm, yellow visible light.
    topic_code: "3.11"
  - front: Microwave oven at 2.45 GHz → wavelength and photon energy
    back: |
      λ = c/ν = 2.998 × 10⁸ ÷ 2.45 × 10⁹ = 0.122 m; E = hν = 1.62 × 10⁻²⁴ J, about 10⁵ times less than a visible photon.
    topic_code: "3.11"
  - front: Photon energy vs bond energy → which light breaks bonds
    back: |
      Bonds of 300–500 kJ/mol are 5–8 × 10⁻¹⁹ J each. Only ultraviolet (and the bluest visible) photons carry that much; infrared and microwave photons cannot break a bond in one step.
    topic_code: "3.11"
  - front: Why UV causes sunburn but visible light does not → the energy argument
    back: |
      A UV photon (about 250–320 nm, 6–8 × 10⁻¹⁹ J) can break or rearrange bonds in a molecule; a visible photon carries too little energy, however many there are.
    topic_code: "3.11"
  - front: Colour of a substance → relation to what it absorbs
    back: |
      A substance absorbing one part of the visible spectrum transmits or reflects the rest; a solution absorbing red light looks blue-green. Colourless substances absorb only outside the visible.
    topic_code: "3.11"
  - front: Frequency of 589 nm light → the calculation
    back: |
      ν = c/λ = 2.998 × 10⁸ ÷ 5.89 × 10⁻⁷ = 5.09 × 10¹⁴ Hz.
    topic_code: "3.11"
  - front: Photon energy per mole → how to convert
    back: |
      Multiply the single-photon energy in joules by N_A = 6.022 × 10²³ mol⁻¹ and divide by 1000 for kJ/mol. 4.41 × 10⁻¹⁹ J → 266 kJ/mol.
    topic_code: "3.11"
  - front: Photoelectron spectroscopy's place in the spectrum → the region it uses
    back: |
      X-rays or far ultraviolet: photons energetic enough to eject core electrons; the kinetic energy of the ejected electron gives the binding energy (week 3).
    topic_code: "3.11"
  - front: Common unit slips in spectrum calculations → the checklist
    back: |
      nm → m is × 10⁻⁹; μm → m is × 10⁻⁶; GHz → Hz is × 10⁹; MHz → Hz is × 10⁶. Keep c in m/s and h in J·s so E comes out in joules.
    topic_code: "3.11"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 3.10 and 3.11: solubility and intermolecular
    forces; the electromagnetic spectrum, photon energy and what each region excites), with review of PES,
    polarity, molarity and gases. Multiple choice, select-all, true/false and numeric items are graded at
    once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by
    your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: solubility tests
    - slug: apchem-u03-w11-q01
      type: multiple_choice
      topic_code: "3.10"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student shakes 0.5 g of each of four solids with 10 mL of water, and separately with 10 mL of hexane (C₆H₁₄), and records whether the solid dissolves.

        Sodium chloride, NaCl: dissolves in water; does not dissolve in hexane.
        Iodine, I₂: barely dissolves in water; dissolves in hexane, giving a purple solution.
        Glucose, C₆H₁₂O₆ (five O–H groups): dissolves in water; does not dissolve in hexane.
        Naphthalene, C₁₀H₈ (a flat hydrocarbon): does not dissolve in water; dissolves in hexane.
      prompt: |
        Which statement best explains why sodium chloride dissolves in water but not in hexane?
      options:
        - "Hexane molecules are too large to fit between the ions of the lattice."
        - "Water's dipoles form ion–dipole attractions with Na⁺ and Cl⁻ that compensate for the lattice energy; hexane has no dipole and offers only weak dispersion forces."
        - "Sodium chloride reacts chemically with water to form new compounds, but does not react with hexane."
        - "Hexane's boiling point is lower than water's, so it cannot provide enough energy to break the lattice."
      option_explanations:
        - |
          Dissolving is not a matter of molecules fitting into the lattice; it is a balance of attractions, and hexane's problem is the lack of a dipole.
        - |
          Correct. Hydration (ion–dipole attraction) pays for breaking the ionic lattice; a nonpolar solvent can only offer dispersion forces, which are far too weak to do so.
        - |
          Dissolving NaCl is a physical change; the ions are hydrated, not converted to new compounds.
        - |
          The energy to break the lattice comes from forming solute–solvent attractions, not from the solvent's boiling point.
      answer: 1
      explanation: |
        Ion–dipole attractions with water compensate for the lattice energy; hexane cannot form them.

    - slug: apchem-u03-w11-q02
      type: multiple_choice
      topic_code: "3.10"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student shakes 0.5 g of each of four solids with 10 mL of water, and separately with 10 mL of hexane (C₆H₁₄), and records whether the solid dissolves.

        Sodium chloride, NaCl: dissolves in water; does not dissolve in hexane.
        Iodine, I₂: barely dissolves in water; dissolves in hexane, giving a purple solution.
        Glucose, C₆H₁₂O₆ (five O–H groups): dissolves in water; does not dissolve in hexane.
        Naphthalene, C₁₀H₈ (a flat hydrocarbon): does not dissolve in water; dissolves in hexane.
      prompt: |
        Glucose and naphthalene are both molecular solids of similar molar mass, yet glucose dissolves in water and naphthalene does not. Which explanation is best?
      options:
        - "Glucose is ionic in water, forming C₆H₁₂O₆⁺ and OH⁻ ions that are hydrated."
        - "Naphthalene's flat shape lets its molecules stack too tightly for water to separate them."
        - "Glucose has the lower melting point, so less energy is needed to break up the solid."
        - "Glucose's five O–H groups hydrogen-bond with water, replacing the attractions lost; naphthalene offers water only dispersion forces, which cannot compensate for the hydrogen bonds water gives up."
      option_explanations:
        - |
          Glucose is a non-electrolyte; it dissolves as intact molecules and forms no ions.
        - |
          Naphthalene does stack, but hexane separates its molecules easily; the issue is what water gains, not how the solid is packed.
        - |
          Melting point is not the deciding factor; naphthalene (80 °C) actually melts below glucose (146 °C) and still fails to dissolve in water.
        - |
          Correct. Solubility in water requires attractions to water strong enough to replace water–water hydrogen bonds; glucose's O–H groups provide them, naphthalene's hydrocarbon surface does not.
      answer: 3
      explanation: |
        Hydrogen bonding to water makes glucose soluble; the nonpolar naphthalene cannot replace water's hydrogen bonds.

    - slug: apchem-u03-w11-q03
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student shakes 0.5 g of each of four solids with 10 mL of water, and separately with 10 mL of hexane (C₆H₁₄), and records whether the solid dissolves.

        Sodium chloride, NaCl: dissolves in water; does not dissolve in hexane.
        Iodine, I₂: barely dissolves in water; dissolves in hexane, giving a purple solution.
        Glucose, C₆H₁₂O₆ (five O–H groups): dissolves in water; does not dissolve in hexane.
        Naphthalene, C₁₀H₈ (a flat hydrocarbon): does not dissolve in water; dissolves in hexane.
      prompt: |
        Which intermolecular force is responsible for the attraction between iodine molecules and hexane molecules in the purple solution?
      options:
        - "London dispersion forces, because both I₂ and hexane are nonpolar"
        - "Dipole–dipole forces, because the I–I bond is polar"
        - "Hydrogen bonding between hexane's hydrogens and iodine"
        - "Ion–dipole forces, because I₂ ionises to I⁺ and I⁻ in hexane"
      option_explanations:
        - |
          Correct. Neither I₂ nor C₆H₁₄ has a permanent dipole; their only attraction is dispersion, and I₂'s large, polarisable electron cloud makes those forces substantial.
        - |
          A bond between two identical atoms has no polarity; I₂ has no permanent dipole.
        - |
          Hydrogen bonding requires H attached to N, O or F and a lone pair on N, O or F; hexane's C–H hydrogens do not qualify.
        - |
          Iodine does not ionise in a nonpolar solvent; it dissolves as intact I₂ molecules.
      answer: 0
      explanation: |
        Nonpolar–nonpolar: dispersion forces only.

    # ---- Multiple choice (3.10)
    - slug: apchem-u03-w11-q04
      type: multiple_choice
      topic_code: "3.10"
      source: "general knowledge"
      points: 1
      prompt: |
        Methanol (CH₃OH) mixes with water in all proportions, but octan-1-ol (CH₃(CH₂)₇OH) is almost insoluble in water. Which statement best accounts for the difference?
      options:
        - "Octanol's O–H group is less polar than methanol's because it is farther from the carbon chain."
        - "Octanol cannot form hydrogen bonds with water."
        - "Both have one hydrogen-bonding O–H group, but octanol's long hydrocarbon chain disrupts water's hydrogen bonding while offering only dispersion forces in return."
        - "Octanol is denser than water and sinks instead of dissolving."
      option_explanations:
        - |
          The O–H bond is the same in both molecules; its polarity does not depend on the chain length.
        - |
          Octanol's O–H can hydrogen-bond with water; the problem is the rest of the molecule, not the O–H.
        - |
          Correct. A single O–H can carry only a short chain into solution; the eight-carbon hydrophobic region costs water more hydrogen bonds than the O–H can replace.
        - |
          Octanol is actually less dense than water (it floats); density is not what decides solubility.
      answer: 2
      explanation: |
        Hydrophobic chain length outweighs one polar group.

    - slug: apchem-u03-w11-q05
      type: multiple_choice
      topic_code: "3.10"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following substances is expected to be the most soluble in water?
      options:
        - "Ethanol, CH₃CH₂OH"
        - "Hexan-1-ol, CH₃(CH₂)₅OH"
        - "Hexane, C₆H₁₄"
        - "Carbon tetrachloride, CCl₄"
      option_explanations:
        - |
          Correct. Ethanol has an O–H group that hydrogen-bonds with water and only a two-carbon hydrophobic part; it is miscible with water.
        - |
          Hexanol has an O–H, but its six-carbon chain makes it only slightly soluble; shorter alcohols are far more soluble.
        - |
          Hexane is nonpolar and has no hydrogen-bonding group; it is essentially insoluble in water.
        - |
          CCl₄ has polar bonds but a symmetrical tetrahedral shape, so it is nonpolar and insoluble in water.
      answer: 0
      explanation: |
        Small polar molecule with hydrogen bonding and little hydrophobic surface.

    # ---- Multiple choice (3.11)
    - slug: apchem-u03-w11-q06
      type: multiple_choice
      topic_code: "3.11"
      source: "general knowledge"
      points: 1
      prompt: |
        A chemist wants to identify the bonds present in an unknown organic compound by observing which wavelengths cause its bonds to stretch and bend. Which region of the electromagnetic spectrum should be used?
      options:
        - "Microwave"
        - "Ultraviolet"
        - "X-ray"
        - "Infrared"
      option_explanations:
        - |
          Microwave photons carry only enough energy to change molecular rotation, not to excite bond vibrations.
        - |
          Ultraviolet photons promote electrons to higher orbitals; they do not selectively report bond vibrations.
        - |
          X-rays eject core electrons (photoelectron spectroscopy); they are far too energetic for vibrations.
        - |
          Correct. Infrared photon energies match the spacing of vibrational levels, and each bond type absorbs at a characteristic infrared wavelength.
      answer: 3
      explanation: |
        Vibrations are excited by infrared light.

    - slug: apchem-u03-w11-q07
      type: multiple_choice
      topic_code: "3.11"
      source: "NIST CODATA constants"
      points: 1
      prompt: |
        Which photon carries the greatest energy?
      options:
        - "Red light, λ = 700 nm"
        - "Blue light, λ = 450 nm"
        - "Ultraviolet light, λ = 250 nm"
        - "Infrared light, λ = 3000 nm"
      option_explanations:
        - |
          At 700 nm a red photon carries about 2.8 × 10⁻¹⁹ J, less than blue or ultraviolet light.
        - |
          A 450 nm photon carries about 4.4 × 10⁻¹⁹ J; more than red, but the shorter-wavelength ultraviolet photon carries more.
        - |
          Correct. Photon energy is inversely proportional to wavelength (E = hc/λ); 250 nm is the shortest wavelength listed, giving about 7.9 × 10⁻¹⁹ J.
        - |
          The longest wavelength carries the least energy: about 6.6 × 10⁻²⁰ J, a tenth of the blue photon's.
      answer: 2
      explanation: |
        Shortest wavelength = highest photon energy.

    - slug: apchem-u03-w11-q08
      type: multiple_choice
      topic_code: "3.11"
      source: "NIST CODATA constants"
      points: 1
      prompt: |
        What is the energy of one photon of blue light with wavelength 450 nm? (h = 6.626 × 10⁻³⁴ J·s, c = 2.998 × 10⁸ m/s)
      options:
        - "2.98 × 10⁻³¹ J"
        - "4.41 × 10⁻¹⁹ J"
        - "4.41 × 10⁻²⁸ J"
        - "6.66 × 10¹⁴ J"
      option_explanations:
        - |
          This multiplies h by the wavelength in nanometres; energy is h times frequency, or hc divided by wavelength in metres.
        - |
          Correct. E = hc/λ = (6.626 × 10⁻³⁴ J·s)(2.998 × 10⁸ m/s) ÷ (4.50 × 10⁻⁷ m) = 4.41 × 10⁻¹⁹ J.
        - |
          This uses 450 m instead of 450 × 10⁻⁹ m; the nanometre conversion was dropped, giving an answer a billion times too small.
        - |
          6.66 × 10¹⁴ is the frequency in hertz, not the energy; it must still be multiplied by h.
      answer: 1
      explanation: |
        E = hc/λ with λ in metres.

    - slug: apchem-u03-w11-q09
      type: multiple_choice
      topic_code: "3.11"
      source: "general knowledge"
      points: 1
      prompt: |
        A microwave oven heats food using 2.45 GHz radiation. Which molecular process in water does this radiation excite, and why is this region of the spectrum suited to it?
      options:
        - "Rotation, because microwave photons carry just enough energy to match the small gaps between rotational levels of a polar molecule"
        - "Vibration, because microwave photons match the energy of O–H bond stretching"
        - "Electronic transitions, because microwaves promote water's electrons to higher orbitals"
        - "Bond breaking, because the energy of many microwave photons adds up to a bond energy"
      option_explanations:
        - |
          Correct. Rotational energy gaps are the smallest of the three types, and the oscillating field of the microwave radiation drives the rotation of water's permanent dipole.
        - |
          Vibrational gaps are about a thousand times larger than microwave photon energies; vibrations are excited by infrared radiation.
        - |
          Electronic transitions need ultraviolet or visible photons, roughly 10⁵ times more energetic than a microwave photon.
        - |
          Photons do not pool their energy to break a bond; absorption is one photon per transition, and microwave photons are far too weak to do so.
      answer: 0
      explanation: |
        Microwave → rotation of polar molecules.

    - slug: apchem-u03-w11-q10
      type: multiple_choice
      topic_code: "3.11"
      source: "general knowledge"
      points: 1
      prompt: |
        Light of wavelength 600 nm is compared with light of wavelength 300 nm. Which statement is correct?
      options:
        - "The 600 nm photons have twice the frequency and twice the energy of the 300 nm photons."
        - "The two kinds of photon have the same energy because they travel at the same speed."
        - "The 300 nm photons have twice the frequency and twice the energy of the 600 nm photons."
        - "The 300 nm photons have four times the energy of the 600 nm photons."
      option_explanations:
        - |
          A longer wavelength means a lower frequency (ν = c/λ) and a lower photon energy, not higher.
        - |
          All light travels at c in a vacuum; photon energy depends on frequency, which differs between the two.
        - |
          Correct. Halving the wavelength doubles the frequency (ν = c/λ) and therefore doubles the photon energy (E = hν).
        - |
          Energy is inversely proportional to wavelength, not to its square; halving λ doubles E.
      answer: 2
      explanation: |
        E ∝ 1/λ: half the wavelength, twice the energy.

    # ---- Review (1.6)
    - slug: apchem-u03-w11-q11
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        The photoelectron spectrum of an element shows three peaks: one at a very high binding energy with relative height 2, and two at low binding energies with relative heights 2 and 1 (in order of decreasing binding energy). Which element is it?
      options:
        - "Carbon"
        - "Beryllium"
        - "Nitrogen"
        - "Boron"
      option_explanations:
        - |
          Carbon's spectrum has a 1s peak (2), a 2s peak (2) and a 2p peak of height 2, not 1.
        - |
          Beryllium (1s²2s²) has only two peaks, both of height 2; there is no 2p peak.
        - |
          Nitrogen's 2p peak has relative height 3 (1s²2s²2p³).
        - |
          Correct. Heights 2, 2, 1 correspond to 1s², 2s² and 2p¹: boron, with five electrons in three subshells.
      answer: 3
      explanation: |
        Peak heights give electron counts per subshell: 1s² 2s² 2p¹ = boron.

    # ---- Review (3.7)
    - slug: apchem-u03-w11-q12
      type: multiple_choice
      topic_code: "3.7"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the nitrate ion concentration in a 0.20 M solution of calcium nitrate, Ca(NO₃)₂?
      options:
        - "0.20 M"
        - "0.40 M"
        - "0.10 M"
        - "0.60 M"
      option_explanations:
        - |
          0.20 M is the concentration of the compound and of Ca²⁺; each formula unit supplies two nitrate ions.
        - |
          Correct. Ca(NO₃)₂ dissociates into one Ca²⁺ and two NO₃⁻, so [NO₃⁻] = 2 × 0.20 = 0.40 M.
        - |
          Halving the molarity has no basis; the subscript 2 multiplies, it does not divide.
        - |
          0.60 M would be the total ion concentration (0.20 M Ca²⁺ + 0.40 M NO₃⁻), not the nitrate concentration alone.
      answer: 1
      explanation: |
        Two nitrate ions per formula unit.

    # ---- Multi-select
    - slug: apchem-u03-w11-q13
      type: multi_select
      topic_code: "3.10"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following substances are expected to dissolve readily in water? Select all that apply.
      options:
        - "Potassium bromide, KBr"
        - "Ammonia, NH₃"
        - "Octane, C₈H₁₈"
        - "Acetic acid, CH₃COOH"
        - "Carbon tetrachloride, CCl₄"
      option_explanations:
        - |
          Correct. KBr is an ionic compound with a modest lattice energy; ion–dipole attractions with water dissolve it readily.
        - |
          Correct. Ammonia is polar and hydrogen-bonds strongly with water through its N–H bonds and its lone pair; it is extremely soluble.
        - |
          Incorrect, so it should not be selected. Octane is a nonpolar hydrocarbon offering only dispersion forces; it is essentially insoluble in water.
        - |
          Correct. Acetic acid's O–H and C=O groups hydrogen-bond with water, and its hydrophobic part is a single CH₃; it is miscible with water.
        - |
          Incorrect, so it should not be selected. CCl₄ is tetrahedral and nonpolar despite its polar bonds; it does not mix with water.
      answer: [0, 1, 3]
      explanation: |
        Ionic and hydrogen-bonding solutes dissolve in water; nonpolar ones do not.

    - slug: apchem-u03-w11-q14
      type: multi_select
      topic_code: "3.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which pairs of liquids are expected to be miscible (to mix in all proportions)? Select all that apply.
      options:
        - "Ethanol and water"
        - "Hexane and octane"
        - "Water and hexane"
