    # ---- Short answer
    - slug: apchem-u03-w11-q22
      type: short_answer
      topic_code: "3.10"
      source: "general knowledge"
      points: 3
      prompt: |
        Vitamin C (ascorbic acid, C₆H₈O₆, with four O–H groups) dissolves in water but not in vegetable oil, whereas vitamin A (retinol, C₂₀H₃₀O, a long hydrocarbon chain with a single O–H at one end) dissolves in oil but hardly at all in water.
        (a) Explain, in terms of intermolecular forces, why vitamin C dissolves in water.
        (b) Explain why vitamin A does not dissolve in water even though it has an O–H group.
        (c) Explain why vitamin A dissolves in oil, naming the intermolecular force involved.
      answer: |
        (a) Vitamin C's four O–H groups hydrogen-bond with water; the attractions formed between vitamin C and water are comparable to the water–water hydrogen bonds and vitamin C–vitamin C attractions broken, so it dissolves.
        (b) Vitamin A is almost entirely a nonpolar hydrocarbon. Its single O–H can hydrogen-bond, but the large hydrophobic region would force water to give up many hydrogen bonds in exchange for weak dispersion attractions, so the molecule is excluded from water.
        (c) Oil is nonpolar (long hydrocarbon chains). Vitamin A's hydrocarbon chain interacts with the oil through London dispersion forces that match the oil–oil and vitamin A–vitamin A dispersion attractions lost, so it dissolves.
      explanation: |
        Scoring: 1 point for (a) naming hydrogen bonding between the O–H groups and water and framing it as replacing broken attractions; 1 point for (b) attributing insolubility to the large nonpolar region outweighing one O–H (water's hydrogen bonds not replaced); 1 point for (c) naming London dispersion forces between the hydrocarbon chain and the nonpolar oil.

    - slug: apchem-u03-w11-q23
      type: short_answer
      topic_code: "3.11"
      source: "NIST CODATA constants"
      points: 3
      prompt: |
        A sodium-vapour street lamp emits yellow light at 589 nm.
        (a) Calculate the frequency of this light (c = 2.998 × 10⁸ m/s).
        (b) Calculate the energy of one photon (h = 6.626 × 10⁻³⁴ J·s).
        (c) State which kind of transition in the sodium atom produces this light, and explain how you can tell from the region of the spectrum.
      answer: |
        (a) ν = c/λ = 2.998 × 10⁸ ÷ 5.89 × 10⁻⁷ = 5.09 × 10¹⁴ Hz.
        (b) E = hν = 6.626 × 10⁻³⁴ × 5.09 × 10¹⁴ = 3.37 × 10⁻¹⁹ J.
        (c) An electronic transition: an electron in an excited sodium atom drops from a higher orbital (3p) to a lower one (3s) and emits the energy difference as a photon. Visible light has photon energies of a few × 10⁻¹⁹ J, which matches electronic energy-level gaps; rotational and vibrational gaps are far smaller.
      explanation: |
        Scoring: 1 point for (a) 5.09 × 10¹⁴ Hz (accept 5.08–5.10 × 10¹⁴) with correct unit conversion; 1 point for (b) 3.37 × 10⁻¹⁹ J (accept 3.36–3.38 × 10⁻¹⁹); 1 point for (c) identifying an electronic transition between orbitals and justifying it by the visible region's photon energies matching electronic gaps.

    # ---- Long answer
    - slug: apchem-u03-w11-q24
      type: long_answer
      topic_code: "3.10"
      source: "general knowledge"
      points: 6
      prompt: |
        A student is given four liquids: water, ethanol (CH₃CH₂OH), hexane (C₆H₁₄) and propanone (acetone, CH₃COCH₃), and three solids: sodium iodide (NaI), iodine (I₂) and sucrose (C₁₂H₂₂O₁₁, eight O–H groups).
        (a) For each solid, predict whether it is more soluble in water or in hexane, and justify each prediction by naming the intermolecular force between solute and solvent.
        (b) Predict which of the liquid pairs water–ethanol, water–hexane and hexane–propanone are miscible, with reasons.
        (c) The student finds that propanone mixes with both water and hexane. Explain how a single molecule can do this.
        (d) Describe a simple experiment, using only the materials listed, that would confirm the prediction for iodine, and state the observation expected.
      answer: |
        (a) NaI: water, because ion–dipole attractions between water and the Na⁺ and I⁻ ions compensate for the lattice energy; hexane has no dipole. I₂: hexane, because both are nonpolar and interact by London dispersion forces; in water the solute cannot replace water's hydrogen bonds. Sucrose: water, because its eight O–H groups hydrogen-bond with water; in hexane only weak dispersion attractions would be available.
        (b) Water–ethanol: miscible, both hydrogen-bond and the attractions gained match those lost. Water–hexane: immiscible, water's hydrogen bonds would be sacrificed for weak dispersion forces. Hexane–propanone: miscible, propanone's two CH₃ groups give dispersion forces comparable to hexane's, and no strong attractions in either liquid must be given up.
        (c) Propanone has a polar C=O group that accepts hydrogen bonds from water and a nonpolar hydrocarbon part (two CH₃ groups) that interacts with hexane by dispersion forces; its small size means neither region dominates, so it is compatible with both solvents.
        (d) Shake a small amount of iodine with water in one tube and with hexane in another. Expected: the hexane becomes deep purple (iodine dissolves), while the water stays nearly colourless or very pale brown (little dissolves). Alternatively, shake iodine with a water–hexane mixture: the purple colour appears in the upper hexane layer.
      explanation: |
        Scoring: (a) 1 point for NaI in water with ion–dipole, 1 point for I₂ in hexane with dispersion forces, and 1 point for sucrose in water with hydrogen bonding (the justifications must name the force); (b) 1 point for correctly identifying water–ethanol and hexane–propanone as miscible and water–hexane as immiscible with intermolecular-force reasoning; (c) 1 point for describing propanone's polar C=O (hydrogen-bond acceptor) and nonpolar CH₃ groups (dispersion) as the basis of its dual compatibility; (d) 1 point for a two-solvent test and the expected purple hexane layer versus a nearly colourless aqueous phase.
