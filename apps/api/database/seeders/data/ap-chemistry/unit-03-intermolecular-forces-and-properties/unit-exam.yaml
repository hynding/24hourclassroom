  # ---- Short answer
  - slug: apchem-u03-exam-q38
    type: short_answer
    topic_code: "3.6"
    source: "general knowledge"
    points: 3
    prompt: |
      A 1.00 mol sample of ammonia, NH₃, and a 1.00 mol sample of methane, CH₄, are each compressed to 50 atm at 300 K.
      (a) State the two assumptions of kinetic molecular theory that fail at high pressure and explain in which direction each causes the measured pressure (or volume) to deviate from the ideal value.
      (b) Predict which of the two gases deviates more from ideal behaviour and justify your prediction with the intermolecular forces present.
      (c) Describe one change in conditions that would make both gases behave more ideally, and explain why.
    answer: |
      (a) The assumption that particles have negligible volume fails: at high pressure the molecules' own volume is a significant fraction of the container, so the gas is harder to compress and its volume (or pressure) is larger than ideal. The assumption that particles do not attract one another also fails: when molecules are crowded, attractions reduce the force of wall collisions, making the pressure (or volume) smaller than ideal.
      (b) Ammonia deviates more. NH₃ is polar and hydrogen-bonds (N–H with a lone pair on N), giving strong attractions; methane is nonpolar with only weak dispersion forces, so the attraction correction is much smaller for CH₄.
      (c) Raise the temperature (or lower the pressure). At higher temperature the molecules' kinetic energy is large compared with their attractions, so attractions have little effect; at lower pressure the molecules are far apart, so both their volume and their attractions become negligible.
    explanation: |
      Scoring: 1 point for (a) naming both failing assumptions with the correct direction of each deviation (volume effect → larger than ideal; attraction effect → smaller than ideal); 1 point for (b) choosing ammonia and justifying it by hydrogen bonding versus methane's dispersion forces; 1 point for (c) a correct change (higher T or lower P) with the kinetic-energy or spacing reasoning.

  - slug: apchem-u03-exam-q39
    type: short_answer
    topic_code: "3.10"
    source: "general knowledge"
    points: 3
    prompt: |
      Iodine, I₂, is far more soluble in aqueous potassium iodide than in pure water, because I₂ reacts with I⁻ to form the triiodide ion, I₃⁻. A student wants to separate iodine from an aqueous KI solution by shaking the solution with hexane in a separatory funnel.
      (a) Explain, in terms of intermolecular forces, why I₂ is only slightly soluble in pure water.
      (b) Explain why I₂ that has become I₃⁻ stays in the aqueous layer rather than moving into the hexane.
      (c) Predict what the student observes after shaking the KI/I₂ solution with hexane, and explain which species ends up in which layer.
    answer: |
      (a) I₂ is nonpolar and interacts only by dispersion forces. Dissolving it in water would require breaking strong water–water hydrogen bonds to make space for a solute that offers water only weak dispersion attractions in return, so very little dissolves.
      (b) I₃⁻ is an ion. It is strongly hydrated by ion–dipole attractions with water, and hexane, which has no dipole, cannot solvate an ion; so the triiodide remains in the aqueous layer.
      (c) The hexane (upper) layer turns purple as free I₂ moves into it (nonpolar solute into nonpolar solvent, dispersion forces matching), while the aqueous layer retains the K⁺, I⁻ and I₃⁻ ions and stays brown or pale. Only the free I₂ transfers; as it leaves, some I₃⁻ releases more I₂, which also transfers, so the aqueous layer lightens.
    explanation: |
      Scoring: 1 point for (a) explaining low solubility by water's hydrogen bonds being sacrificed for only weak dispersion attractions; 1 point for (b) identifying I₃⁻ as an ion held by ion–dipole attractions that hexane cannot provide; 1 point for (c) predicting a purple hexane layer (I₂ transfers by dispersion forces) with the ions remaining in water.

  # ---- Long answer
  - slug: apchem-u03-exam-q40
    type: long_answer
    topic_code: "3.4"
    source: "NIST Chemistry WebBook (vapour pressure of water, rounded)"
    points: 6
    prompt: |
      A student reacts 0.300 g of magnesium ribbon with excess hydrochloric acid, Mg(s) + 2 HCl(aq) → MgCl₂(aq) + H₂(g), and collects the hydrogen over water at 25 °C. The barometric pressure is 762 torr and the vapour pressure of water at 25 °C is 23.8 torr. (Mg = 24.31 g/mol; R = 0.08206 L·atm/(mol·K); 1 atm = 760 torr.)
      (a) Calculate the number of moles of H₂ produced.
      (b) Calculate the partial pressure of the hydrogen in the collection tube, in atm.
      (c) Calculate the volume of gas the student should expect to collect.
      (d) Compare the average kinetic energy and the root-mean-square speed of the H₂ molecules with those of the water-vapour molecules in the tube, giving the ratio of speeds.
      (e) Explain whether hydrogen is expected to behave ideally under these conditions, naming the relevant assumptions of kinetic molecular theory.
      (f) The student forgets to subtract the vapour pressure of water. State whether the number of moles of H₂ calculated from the measured volume would be too high or too low, and explain.
    answer: |
      (a) n(Mg) = 0.300 ÷ 24.31 = 0.01234 mol; the 1 : 1 ratio gives 0.01234 mol H₂ (0.0123 mol).
      (b) P(H₂) = 762 − 23.8 = 738.2 torr; ÷ 760 = 0.971 atm.
      (c) V = nRT/P = (0.01234)(0.08206)(298) ÷ 0.971 = 0.311 L = 311 mL.
      (d) Both gases are at the same temperature, so their average kinetic energies are equal. v_rms ∝ 1/√M, so v(H₂)/v(H₂O) = √(18.02/2.016) = √8.94 = 2.99 ≈ 3: hydrogen molecules move about three times faster.
      (e) Yes. The pressure is low (about 1 atm) and the temperature moderate; H₂ molecules are tiny and nonpolar with only very weak dispersion forces, so the assumptions of negligible particle volume and negligible attractions both hold well.
      (f) Too high. Using the total pressure (762 torr) in place of the smaller hydrogen partial pressure in n = PV/RT overstates P and therefore n; part of the measured volume is actually water vapour.
    explanation: |
      Scoring: (a) 1 point for 0.0123 mol with the mole ratio; (b) 1 point for subtracting the vapour pressure and converting to 0.971 atm; (c) 1 point for V = 0.311 L (accept 0.305–0.315 L); (d) 1 point for equal average kinetic energies and a speed ratio of about 3 (accept 2.9–3.0) from √(M ratio); (e) 1 point for "yes" with both assumptions (negligible volume, negligible attractions) tied to low P, moderate T and H₂'s small nonpolar molecules; (f) 1 point for "too high" with the reasoning that the total pressure overstates P(H₂).
