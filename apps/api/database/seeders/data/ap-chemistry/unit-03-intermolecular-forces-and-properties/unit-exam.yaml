unit: 3
description: |
  40 questions · about 75 minutes · every topic of Unit 3 (3.1 to 3.13): intermolecular forces, solids, liquids
  and gases, the ideal gas law, kinetic molecular theory, real gases, solutions and molarity, particulate
  representations, chromatography, solubility, the electromagnetic spectrum, the photoelectric effect and the
  Beer–Lambert law, with review of Units 1 and 2. Three data-based sets in the AP style (a real-gas molar-volume
  table, a calibration curve and a property table of solids), select-all, true/false, fill-in-the-blank and
  numeric items, two short-answer questions (3 points each) and one long free-response question (6 points).
  Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
  matched automatically; the free-response items are graded by your teacher against the scoring notes.
  Calculator and periodic table allowed.
questions:
  # ---- Stimulus set A: molar volumes of real gases (3.4, 3.6, 3.1)
  - slug: apchem-u03-exam-q01
    type: multiple_choice
    topic_code: "3.4"
    source: "general knowledge"
    points: 1
    stimulus: |
      The molar volume of three gases was measured at 300 K and 50.0 atm.

      Helium, He: 0.502 L/mol
      Nitrogen, N₂: 0.486 L/mol
      Carbon dioxide, CO₂: 0.36 L/mol

      R = 0.08206 L·atm/(mol·K).
    prompt: |
      What molar volume does the ideal gas law predict for any gas at 300 K and 50.0 atm?
    options:
      - "24.6 L/mol"
      - "0.492 L/mol"
      - "0.448 L/mol"
      - "1.23 L/mol"
    option_explanations:
      - |
        24.6 L/mol is the ideal molar volume at 300 K and 1.00 atm; at 50.0 atm it is fifty times smaller.
      - |
        Correct. V/n = RT/P = (0.08206)(300) ÷ 50.0 = 0.492 L/mol.
      - |
        0.448 L/mol would be the molar volume at 273 K; the temperature here is 300 K.
      - |
        1.23 L/mol uses 20.0 atm instead of 50.0 atm.
    answer: 1
    explanation: |
      V_m = RT/P = 0.492 L/mol.

  - slug: apchem-u03-exam-q02
    type: multiple_choice
    topic_code: "3.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      The molar volume of three gases was measured at 300 K and 50.0 atm.

      Helium, He: 0.502 L/mol
      Nitrogen, N₂: 0.486 L/mol
      Carbon dioxide, CO₂: 0.36 L/mol

      R = 0.08206 L·atm/(mol·K).
    prompt: |
      Which statement best explains why the measured molar volume of carbon dioxide is far below the ideal value?
    options:
      - "CO₂ molecules are larger than He atoms, so they take up more of the container's volume."
      - "CO₂ molecules move more slowly than the others, so they strike the walls less often."
      - "CO₂ decomposes to CO and O₂ at 50 atm, reducing the number of moles of gas."
      - "Attractions between CO₂ molecules, significant when they are crowded together at 50 atm, pull them closer and reduce the volume they occupy."
    option_explanations:
      - |
        Larger molecular volume would make the measured molar volume larger than ideal, not smaller; that effect is what makes helium's value slightly high.
      - |
        Slower molecules do strike the walls less often, but the ideal gas law already accounts for that through the temperature; speed does not cause the deviation.
      - |
        CO₂ is stable at 50 atm and 300 K; no decomposition occurs.
      - |
        Correct. At high pressure the molecules are close enough for CO₂'s substantial dispersion forces to matter; the attractions reduce the pressure the gas exerts, so it occupies less volume than an ideal gas at the same conditions.
    answer: 3
    explanation: |
      Attractions dominate for CO₂; the "no attractions" assumption fails.

  - slug: apchem-u03-exam-q03
    type: multiple_choice
    topic_code: "3.1"
    source: "general knowledge"
    points: 1
    stimulus: |
      The molar volume of three gases was measured at 300 K and 50.0 atm.

      Helium, He: 0.502 L/mol
      Nitrogen, N₂: 0.486 L/mol
      Carbon dioxide, CO₂: 0.36 L/mol

      R = 0.08206 L·atm/(mol·K).
    prompt: |
      Which intermolecular force is responsible for the attractions between CO₂ molecules, and why is it stronger than the attraction between N₂ molecules?
    options:
      - "London dispersion forces, which are stronger for CO₂ because it has more electrons and a larger, more polarisable electron cloud"
      - "Dipole–dipole forces, because the C=O bonds make CO₂ a polar molecule"
      - "Hydrogen bonding, because CO₂ contains oxygen"
      - "Ion–dipole forces, because CO₂ partially ionises at high pressure"
    option_explanations:
      - |
        Correct. Both molecules are nonpolar; CO₂ (22 electrons, three atoms) is larger and more polarisable than N₂ (14 electrons), so its dispersion forces are stronger.
      - |
        The C=O bonds are polar, but CO₂ is linear and the bond dipoles cancel; it has no permanent dipole.
      - |
        Hydrogen bonding requires hydrogen bonded to N, O or F; CO₂ has no hydrogen.
      - |
        CO₂ does not ionise in the gas phase; there are no ions present.
    answer: 0
    explanation: |
      Nonpolar molecules: dispersion only, growing with size and electron count.

  # ---- Gases (3.4, 3.5, 3.6)
  - slug: apchem-u03-exam-q04
    type: multiple_choice
    topic_code: "3.4"
    source: "general knowledge"
    points: 1
    prompt: |
      A rigid container holds 0.50 mol of N₂ and 0.25 mol of O₂ at a total pressure of 3.00 atm. What is the partial pressure of O₂?
    options:
      - "0.75 atm"
      - "1.50 atm"
      - "1.00 atm"
      - "2.00 atm"
    option_explanations:
      - |
        0.75 atm multiplies the total pressure by 0.25 mol as if it were a mole fraction; the mole fraction is 0.25 ÷ 0.75 = 0.333.
      - |
        1.50 atm is half the total, which would require equal moles of the two gases.
      - |
        Correct. X(O₂) = 0.25 ÷ 0.75 = 0.333; P(O₂) = 0.333 × 3.00 atm = 1.00 atm.
      - |
        2.00 atm is the partial pressure of N₂ (mole fraction 0.667), not of O₂.
    answer: 2
    explanation: |
      P_i = X_i × P_total.

  - slug: apchem-u03-exam-q05
    type: multiple_choice
    topic_code: "3.5"
    source: "PubChem (molar masses)"
    points: 1
    prompt: |
      At the same temperature, how does the root-mean-square speed of methane molecules (CH₄, 16.04 g/mol) compare with that of sulfur dioxide molecules (SO₂, 64.07 g/mol)?
    options:
      - "The CH₄ molecules are four times faster."
      - "The CH₄ molecules are twice as fast."
      - "The two have the same speed because they are at the same temperature."
      - "The SO₂ molecules are twice as fast because they have more kinetic energy."
    option_explanations:
      - |
        The molar-mass ratio is 4, but speed scales with the square root of the mass ratio, giving a factor of 2.
      - |
        Correct. v_rms ∝ 1/√M; √(64.07 ÷ 16.04) = √4.0 = 2.0, so methane molecules move twice as fast.
      - |
        Equal temperature means equal average kinetic energy, not equal speed; the lighter molecule must move faster to have the same KE.
      - |
        At the same temperature the average kinetic energies are equal; the heavier SO₂ molecules are slower, not faster.
    answer: 1
    explanation: |
      Same KE, quarter the mass → twice the speed.

  - slug: apchem-u03-exam-q06
    type: multiple_choice
    topic_code: "3.6"
    source: "general knowledge"
    points: 1
    prompt: |
      Which gas, under the same conditions of high pressure and low temperature, is expected to behave most nearly ideally?
    options:
      - "He"
      - "NH₃"
      - "Cl₂"
      - "H₂O"
    option_explanations:
      - |
        Correct. Helium atoms are the smallest and least polarisable particles listed, with negligible attractions and volume, so both KMT assumptions hold best.
      - |
        Ammonia hydrogen-bonds; its strong attractions cause large deviations at low temperature.
      - |
        Chlorine is large and polarisable with substantial dispersion forces and significant molecular volume.
      - |
        Water hydrogen-bonds strongly and deviates most of all; it would condense under these conditions.
    answer: 0
    explanation: |
      Smallest, least attracting particles deviate least.

  # ---- Solutions (3.7, 3.8, 3.9)
  - slug: apchem-u03-exam-q07
    type: multiple_choice
    topic_code: "3.7"
    source: "general knowledge"
    points: 1
    prompt: |
      What is the concentration of sulfate ions in a 0.15 M solution of iron(III) sulfate, Fe₂(SO₄)₃?
    options:
      - "0.15 M"
      - "0.30 M"
      - "0.050 M"
      - "0.45 M"
    option_explanations:
      - |
        0.15 M is the concentration of the compound; each formula unit releases three sulfate ions.
      - |
        0.30 M is the concentration of Fe³⁺ (two per formula unit), not sulfate.
      - |
        Dividing by three has no basis; the subscript multiplies the concentration.
      - |
        Correct. Each Fe₂(SO₄)₃ gives three SO₄²⁻, so [SO₄²⁻] = 3 × 0.15 = 0.45 M.
    answer: 3
    explanation: |
      Three sulfate ions per formula unit.

  - slug: apchem-u03-exam-q08
    type: multiple_choice
    topic_code: "3.8"
    source: "general knowledge"
    points: 1
    prompt: |
      Two particulate diagrams of aqueous solutions are compared. Diagram 1 shows four K⁺ and four Cl⁻ ions in a box of water; diagram 2 shows two K⁺ and two Cl⁻ ions in an identical box. Which statement is correct?
    options:
      - "Diagram 2 shows a solution twice as concentrated as diagram 1."
      - "The diagrams show the same concentration because the ion ratio is 1 : 1 in both."
      - "Diagram 1 shows a solution twice as concentrated as diagram 2, and both correctly show dissociated ions in a 1 : 1 ratio."
      - "Diagram 1 is incorrect because KCl should be drawn as intact KCl units."
    option_explanations:
      - |
        Diagram 2 has fewer ions in the same volume, so it is the less concentrated solution.
      - |
        The ratio is right in both, but concentration is particles per volume, and diagram 1 has twice as many in the same box.
      - |
        Correct. Twice the solute particles in the same volume is twice the molarity; both diagrams correctly show complete dissociation of KCl into separate K⁺ and Cl⁻.
      - |
        KCl is a strong electrolyte and exists in solution only as separate hydrated ions.
    answer: 2
    explanation: |
      Concentration ∝ particles per box.

  - slug: apchem-u03-exam-q09
    type: multiple_choice
    topic_code: "3.9"
    source: "NIST Chemistry WebBook (boiling points, rounded)"
    points: 1
    prompt: |
      A mixture of ethanol (boiling point 78 °C) and water (100 °C) is distilled. Which statement is correct?
    options:
      - "Water distils first because it has the smaller molar mass."
      - "Ethanol distils first because its weaker hydrogen bonding gives it the higher vapour pressure."
      - "The two cannot be separated because both hydrogen-bond."
      - "Ethanol distils first because its larger molecules are less dense."
    option_explanations:
      - |
        The order of distillation follows boiling point, not molar mass, and water boils higher.
      - |
        Correct. Ethanol has one O–H group to water's two and a hydrocarbon part, so its hydrogen bonding is weaker; its vapour pressure is higher and it boils first.
      - |
        Both do hydrogen-bond, but to different extents; a 22 °C difference in boiling point allows separation by distillation.
      - |
        Density plays no role in which component vaporises first.
    answer: 1
    explanation: |
      Lower boiling point (weaker IMFs) distils first.

  # ---- Stimulus set B: a permanganate calibration curve (3.13, 3.7, 3.11)
  - slug: apchem-u03-exam-q10
    type: multiple_choice
    topic_code: "3.13"
    source: "general knowledge"
    points: 1
    stimulus: |
      Potassium permanganate, KMnO₄, gives a purple solution. Standards were measured at 525 nm in a 1.00 cm cuvette after zeroing with a water blank.

      [MnO₄⁻] = 1.00 × 10⁻⁴ M, A = 0.22
      [MnO₄⁻] = 2.00 × 10⁻⁴ M, A = 0.44
      [MnO₄⁻] = 3.00 × 10⁻⁴ M, A = 0.66
      [MnO₄⁻] = 4.00 × 10⁻⁴ M, A = 0.88

      An unknown, prepared by diluting 5.00 mL of a permanganate stock solution to 25.00 mL, gives A = 0.55.
    prompt: |
      What is the concentration of MnO₄⁻ in the diluted unknown?
    options:
      - "2.5 × 10⁻⁴ M"
      - "1.2 × 10⁻³ M"
      - "5.5 × 10⁻⁴ M"
      - "1.1 × 10⁻⁴ M"
    option_explanations:
      - |
        Correct. The standards give A = 2200 × c (slope 0.88 ÷ 4.00 × 10⁻⁴ M = 2.2 × 10³ M⁻¹), so c = 0.55 ÷ 2200 = 2.5 × 10⁻⁴ M.
      - |
        1.2 × 10⁻³ M is the stock concentration after multiplying back by the dilution factor, not the diluted unknown's.
      - |
        5.5 × 10⁻⁴ treats the absorbance as if the slope were 1000; the standards show a slope of 2200 M⁻¹.
      - |
        1.1 × 10⁻⁴ M would give A = 0.24, less than half the measured value.
    answer: 0
    explanation: |
      c = A ÷ slope = 0.55 ÷ 2200 = 2.5 × 10⁻⁴ M.

  - slug: apchem-u03-exam-q11
    type: multiple_choice
    topic_code: "3.7"
    source: "general knowledge"
    points: 1
    stimulus: |
      Potassium permanganate, KMnO₄, gives a purple solution. Standards were measured at 525 nm in a 1.00 cm cuvette after zeroing with a water blank.

      [MnO₄⁻] = 1.00 × 10⁻⁴ M, A = 0.22
      [MnO₄⁻] = 2.00 × 10⁻⁴ M, A = 0.44
      [MnO₄⁻] = 3.00 × 10⁻⁴ M, A = 0.66
      [MnO₄⁻] = 4.00 × 10⁻⁴ M, A = 0.88

      An unknown, prepared by diluting 5.00 mL of a permanganate stock solution to 25.00 mL, gives A = 0.55.
    prompt: |
      What is the concentration of MnO₄⁻ in the original stock solution?
    options:
      - "5.0 × 10⁻⁵ M"
      - "2.5 × 10⁻⁴ M"
      - "6.3 × 10⁻³ M"
      - "1.3 × 10⁻³ M"
    option_explanations:
      - |
        5.0 × 10⁻⁵ M divides by the dilution factor; the stock is more concentrated than the diluted sample.
      - |
        2.5 × 10⁻⁴ M is the diluted unknown's concentration; the stock was five times more concentrated.
      - |
        6.3 × 10⁻³ M uses a dilution factor of 25; 5.00 mL to 25.00 mL is a factor of 5.
      - |
        Correct. M₁ = M₂V₂/V₁ = (2.5 × 10⁻⁴ M)(25.00 mL) ÷ 5.00 mL = 1.25 × 10⁻³ M ≈ 1.3 × 10⁻³ M.
    answer: 3
    explanation: |
      Multiply by the dilution factor of 5.

  - slug: apchem-u03-exam-q12
    type: multiple_choice
    topic_code: "3.11"
    source: "general knowledge"
    points: 1
    stimulus: |
      Potassium permanganate, KMnO₄, gives a purple solution. Standards were measured at 525 nm in a 1.00 cm cuvette after zeroing with a water blank.

      [MnO₄⁻] = 1.00 × 10⁻⁴ M, A = 0.22
      [MnO₄⁻] = 2.00 × 10⁻⁴ M, A = 0.44
      [MnO₄⁻] = 3.00 × 10⁻⁴ M, A = 0.66
      [MnO₄⁻] = 4.00 × 10⁻⁴ M, A = 0.88

      An unknown, prepared by diluting 5.00 mL of a permanganate stock solution to 25.00 mL, gives A = 0.55.
    prompt: |
      Why is 525 nm (green light) a suitable wavelength for measuring a purple permanganate solution, and what happens to the absorbed photons' energy?
    options:
      - "The solution transmits green, so green light passes through and is counted by the detector."
      - "Green photons have the highest energy in the visible spectrum, so they are absorbed by every solution."
      - "The solution appears purple because it absorbs green strongly; each absorbed photon promotes an electron in the permanganate ion to a higher-energy orbital."
      - "Green light is absorbed by the water solvent, and the permanganate absorbs the remainder."
    option_explanations:
      - |
        A purple solution transmits purple (red and blue) and absorbs green; measuring at a transmitted colour would give almost no absorbance.
      - |
        Violet photons have the highest visible energy, and absorption depends on matching an energy-level gap, not on being the most energetic.
      - |
        Correct. The colour seen is the complement of the colour absorbed; visible-light absorption corresponds to an electronic transition in the absorbing ion.
      - |
        Water is transparent across the visible range, which is why it serves as the blank.
    answer: 2
    explanation: |
      Measure at the absorbed (complementary) colour; visible absorption = electronic transition.

  # ---- Solubility, spectrum, photoelectric effect, Beer's law (3.10–3.13)
  - slug: apchem-u03-exam-q13
    type: multiple_choice
    topic_code: "3.10"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following is the best explanation for why butan-1-ol (CH₃CH₂CH₂CH₂OH) is only moderately soluble in water while ethane-1,2-diol (HOCH₂CH₂OH) is miscible with water in all proportions?
    options:
      - "Ethane-1,2-diol has the larger molar mass, and heavier molecules are more soluble."
      - "Ethane-1,2-diol has two O–H groups on a short chain, so most of its surface hydrogen-bonds with water, while butanol's single O–H must carry a four-carbon hydrophobic chain."
      - "Butan-1-ol is nonpolar because its O–H is at the end of the chain."
      - "Ethane-1,2-diol ionises in water to form a strong electrolyte."
    option_explanations:
      - |
        Molar mass is not what decides solubility; the two molecules have similar masses (74 and 62 g/mol) anyway.
      - |
        Correct. Solubility depends on the balance of hydrogen-bonding surface against hydrophobic surface; the diol is nearly all hydrogen-bonding, butanol is mostly hydrocarbon.
      - |
        Butan-1-ol is polar and hydrogen-bonds through its O–H; the position of the group does not make it nonpolar.
      - |
        Alcohols do not ionise appreciably in water; both compounds dissolve as intact molecules.
    answer: 1
    explanation: |
      More hydrogen-bonding groups per hydrophobic carbon → more soluble.

  - slug: apchem-u03-exam-q14
    type: multiple_choice
    topic_code: "3.11"
    source: "general knowledge"
    points: 1
    prompt: |
      Carbon dioxide in the atmosphere absorbs infrared radiation emitted by Earth's surface. Which molecular process does this absorption excite?
    options:
      - "Promotion of an electron to a higher-energy orbital"
      - "Ejection of an electron from the molecule"
      - "Rotation of the molecule about its centre of mass"
      - "Vibration of the C=O bonds (stretching and bending)"
    option_explanations:
      - |
        Electronic transitions require ultraviolet or visible photons, which carry about ten times the energy of infrared photons.
      - |
        Ejecting an electron needs far-ultraviolet or X-ray photons; infrared photons are a thousand times too weak.
      - |
        Rotational transitions are excited by lower-energy microwave radiation.
      - |
        Correct. Infrared photon energies match the gaps between vibrational energy levels; CO₂'s bending and asymmetric-stretching vibrations absorb strongly in the infrared.
    answer: 3
    explanation: |
      Infrared → vibration.

  - slug: apchem-u03-exam-q15
    type: multiple_choice
    topic_code: "3.12"
    source: "general knowledge"
    points: 1
    prompt: |
      In a photoelectric experiment, violet light ejects electrons from a metal with a certain maximum kinetic energy. Which change would increase the maximum kinetic energy of the ejected electrons?
    options:
      - "Replacing the violet light with ultraviolet light of the same intensity"
      - "Doubling the intensity of the violet light"
      - "Shining the violet light on the metal for twice as long"
      - "Replacing the violet light with green light of much greater intensity"
    option_explanations:
      - |
        Correct. Ultraviolet photons have a higher frequency and energy, so KE_max = hν − φ rises.
      - |
        Intensity increases the number of photons and therefore of electrons, but each electron still receives hν − φ.
      - |
        Exposure time changes the total number of electrons collected, not the energy of any one of them.
      - |
        Green light has a lower frequency than violet; its photons carry less energy, so KE_max falls (or emission stops) regardless of intensity.
    answer: 0
    explanation: |
      Only a higher frequency raises KE_max.

  - slug: apchem-u03-exam-q16
    type: multiple_choice
    topic_code: "3.12"
    source: "NIST CODATA constants"
    points: 1
    prompt: |
      A metal has a work function of 3.0 × 10⁻¹⁹ J. When 400 nm light (photon energy 5.0 × 10⁻¹⁹ J) strikes it, what is the maximum kinetic energy of the ejected electrons?
    options:
      - "8.0 × 10⁻¹⁹ J"
      - "5.0 × 10⁻¹⁹ J"
      - "2.0 × 10⁻¹⁹ J"
      - "3.0 × 10⁻¹⁹ J"
    option_explanations:
      - |
        Adding the work function to the photon energy is backwards; the work function is the energy the electron spends to escape.
      - |
        5.0 × 10⁻¹⁹ J is the whole photon energy; part of it is used to free the electron.
      - |
        Correct. KE_max = E_photon − φ = 5.0 × 10⁻¹⁹ − 3.0 × 10⁻¹⁹ = 2.0 × 10⁻¹⁹ J.
      - |
        3.0 × 10⁻¹⁹ J is the work function itself, the energy spent, not the energy left over.
    answer: 2
    explanation: |
      KE = hν − φ.

  - slug: apchem-u03-exam-q17
    type: multiple_choice
    topic_code: "3.13"
    source: "general knowledge"
    points: 1
    prompt: |
      A solution transmits 10.0 % of the incident light at the measuring wavelength. If the concentration of the absorbing species is halved (same cuvette, same wavelength), what will the new absorbance and percent transmittance be?
    options:
      - "A = 0.500; 20.0 %T"
      - "A = 0.500; 31.6 %T"
      - "A = 2.00; 1.0 %T"
      - "A = 1.00; 5.0 %T"
    option_explanations:
      - |
        The absorbance is right (1.00 halved to 0.500), but transmittance is not linear: T = 10⁻⁰·⁵⁰⁰ = 0.316, not 0.200.
      - |
        Correct. 10 %T means A = −log 0.100 = 1.00; halving c halves A to 0.500; T = 10⁻⁰·⁵ = 0.316 = 31.6 %T.
      - |
        Halving the concentration lowers the absorbance; A = 2.00 would be a doubled concentration.
      - |
        The absorbance must change when the concentration changes; A stays at 1.00 only if c is unchanged.
    answer: 1
    explanation: |
      A ∝ c; T = 10⁻ᴬ.

  # ---- Stimulus set C: a property table of solids (3.2, 3.3, 2.1)
  - slug: apchem-u03-exam-q18
    type: multiple_choice
    topic_code: "3.2"
    source: "NIST Chemistry WebBook (melting points, rounded)"
    points: 1
    stimulus: |
      Four solids were tested.

      Solid W: melting point 801 °C; does not conduct as a solid; conducts when molten; dissolves in water.
      Solid X: melting point 1414 °C; does not conduct as a solid or when molten; insoluble in water.
      Solid Y: melting point 80 °C; does not conduct in any state; insoluble in water, soluble in hexane.
      Solid Z: melting point 1085 °C; conducts as a solid and when molten; insoluble in water.
    prompt: |
      Which solid is a covalent network solid?
    options:
      - "W"
      - "Y"
      - "Z"
      - "X"
    option_explanations:
      - |
        W conducts when molten and dissolves in water: the behaviour of an ionic solid (it matches sodium chloride).
      - |
        Y's low melting point and solubility in hexane mark a molecular solid held by dispersion forces (naphthalene).
      - |
        Z conducts in the solid state, which only a metal does (copper).
      - |
        Correct. X has a very high melting point yet never conducts, even molten: covalently bonded atoms throughout and no mobile charges, as in silicon or silica.
    answer: 3
    explanation: |
      Very high melting, never conducts → covalent network.

  - slug: apchem-u03-exam-q19
    type: multiple_choice
    topic_code: "3.3"
    source: "NIST Chemistry WebBook (melting points, rounded)"
    points: 1
    stimulus: |
      Four solids were tested.

      Solid W: melting point 801 °C; does not conduct as a solid; conducts when molten; dissolves in water.
      Solid X: melting point 1414 °C; does not conduct as a solid or when molten; insoluble in water.
      Solid Y: melting point 80 °C; does not conduct in any state; insoluble in water, soluble in hexane.
      Solid Z: melting point 1085 °C; conducts as a solid and when molten; insoluble in water.
    prompt: |
      Which statement correctly describes what happens at the particle level when solid Y melts at 80 °C?
    options:
      - "The molecules gain enough kinetic energy to slide past one another, overcoming the weak dispersion forces between them, while the covalent bonds within each molecule stay intact."
      - "The covalent bonds within the molecules break, releasing free atoms that can move."
      - "The molecules break into ions, which is why the liquid conducts electricity."
      - "The molecules begin to move; in the solid they were completely motionless."
    option_explanations:
      - |
        Correct. Melting a molecular solid overcomes intermolecular forces only; the molecules keep their identity and the liquid is still non-conducting.
      - |
        Covalent bonds are far stronger than the dispersion forces holding the molecules together; they survive melting.
      - |
        The table says Y does not conduct in any state, so no ions form.
      - |
        Particles in a solid vibrate about fixed positions; they are not motionless.
    answer: 0
    explanation: |
      Melting overcomes IMFs, not bonds.

  - slug: apchem-u03-exam-q20
    type: multiple_choice
    topic_code: "2.1"
    source: "NIST Chemistry WebBook (melting points, rounded)"
    points: 1
    stimulus: |
      Four solids were tested.

      Solid W: melting point 801 °C; does not conduct as a solid; conducts when molten; dissolves in water.
      Solid X: melting point 1414 °C; does not conduct as a solid or when molten; insoluble in water.
      Solid Y: melting point 80 °C; does not conduct in any state; insoluble in water, soluble in hexane.
      Solid Z: melting point 1085 °C; conducts as a solid and when molten; insoluble in water.
    prompt: |
      Which type of bonding holds solid Z together, and what feature of that bonding explains its conductivity in the solid state?
    options:
      - "Ionic bonding; the ions are free to move through the lattice"
      - "Covalent network bonding; shared electrons move between atoms"
      - "Metallic bonding; delocalised valence electrons move freely through the lattice of cations"
      - "Hydrogen bonding; protons hop between molecules"
    option_explanations:
      - |
        Ions in an ionic solid are locked in place; ionic solids conduct only when molten or dissolved, as W does.
      - |
        In a covalent network the electrons are localised in bonds; such solids do not conduct (apart from graphite).
      - |
        Correct. A metal's valence electrons form a mobile sea that carries current in the solid and the liquid alike.
      - |
        Hydrogen bonding is an intermolecular force in molecular substances, which do not conduct.
    answer: 2
    explanation: |
      Conducts as a solid → metallic (electron sea).

  # ---- IMFs and review (3.1, Unit 1, Unit 2)
  - slug: apchem-u03-exam-q21
    type: multiple_choice
    topic_code: "3.1"
    source: "NIST Chemistry WebBook (boiling points, rounded)"
    points: 1
    prompt: |
      Ethanol (CH₃CH₂OH, 46 g/mol) boils at 78 °C, while dimethyl ether (CH₃OCH₃, also 46 g/mol) boils at −24 °C. Which explanation is correct?
    options:
      - "Ethanol has stronger dispersion forces because its chain is longer."
      - "Ethanol molecules hydrogen-bond through the O–H group; dimethyl ether has no O–H and can only use dipole–dipole and dispersion forces."
      - "Dimethyl ether is nonpolar, so it has no intermolecular forces at all."
      - "The C–O bonds in ethanol are stronger than those in dimethyl ether."
    option_explanations:
      - |
        The two isomers have the same number of electrons and similar shapes; their dispersion forces are comparable.
      - |
        Correct. Only ethanol has hydrogen bonded to oxygen, so only ethanol forms hydrogen bonds between its molecules, raising its boiling point by about 100 °C.
      - |
        Dimethyl ether is bent at the oxygen and polar; it has dipole–dipole forces, just not hydrogen bonds.
      - |
        Boiling does not break C–O bonds; it separates molecules from one another.
    answer: 1
    explanation: |
      Hydrogen bonding in ethanol; none in the ether.

  - slug: apchem-u03-exam-q22
    type: multiple_choice
    topic_code: "1.3"
    source: "PubChem (molar masses)"
    points: 1
    prompt: |
      A gaseous hydrocarbon is 85.6 % carbon and 14.4 % hydrogen by mass, and its density at STP is 1.25 g/L. What is its molecular formula? (C = 12.01, H = 1.008 g/mol; molar volume at STP = 22.4 L/mol)
    options:
      - "C₂H₄"
      - "CH₂"
      - "C₃H₆"
      - "C₄H₈"
    option_explanations:
      - |
        Correct. 85.6 ÷ 12.01 = 7.13 mol C and 14.4 ÷ 1.008 = 14.3 mol H, a 1 : 2 ratio, so the empirical formula is CH₂ (14.03 g/mol). Molar mass = 1.25 × 22.4 = 28.0 g/mol = 2 × 14.03, so the molecular formula is C₂H₄.
      - |
        CH₂ is the empirical formula; the molar mass from the density (28 g/mol) is twice 14 g/mol.
      - |
        C₃H₆ has a molar mass of 42 g/mol, which would require a density of 1.88 g/L at STP.
      - |
        C₄H₈ (56 g/mol) would have a density of 2.50 g/L at STP, twice the measured value.
    answer: 0
    explanation: |
      Empirical CH₂; M = 28 → C₂H₄.

  - slug: apchem-u03-exam-q23
    type: multiple_choice
    topic_code: "2.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Which molecule has a molecular geometry that makes it polar, and therefore able to experience dipole–dipole attractions?
    options:
      - "BF₃"
      - "CO₂"
      - "CCl₄"
      - "NF₃"
    option_explanations:
      - |
        BF₃ is trigonal planar with three identical bonds; the bond dipoles cancel and the molecule is nonpolar.
      - |
        CO₂ is linear; its two equal and opposite bond dipoles cancel.
      - |
        CCl₄ is tetrahedral with four identical bonds; the dipoles cancel.
      - |
        Correct. NF₃ is trigonal pyramidal because of the lone pair on nitrogen; the three N–F dipoles do not cancel, so the molecule has a net dipole.
    answer: 3
    explanation: |
      A lone pair on the central atom breaks the symmetry.

  - slug: apchem-u03-exam-q24
    type: multiple_choice
    topic_code: "1.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Iodine (I₂) is a solid at room temperature while chlorine (Cl₂) is a gas. Which periodic trend most directly explains the difference in their dispersion forces?
    options:
      - "Electronegativity increases up the group, making Cl₂ more polar."
      - "Ionization energy decreases down the group, so I₂ forms ions more easily."
      - "Atomic radius increases down the group, so iodine's larger, more loosely held electron cloud is more polarisable."
      - "Iodine has a higher electron affinity, so it attracts neighbouring molecules more strongly."
    option_explanations:
      - |
        Both diatomic molecules are nonpolar; electronegativity differences between identical atoms are zero.
      - |
        Neither halogen forms ions in the pure element; ionization energy is not what sets the dispersion force.
      - |
        Correct. Dispersion forces grow with polarisability, which grows with atomic size; iodine's outer electrons are farther from the nucleus and more easily distorted.
      - |
        Electron affinity is a property of isolated atoms accepting an electron, not of intermolecular attraction, and iodine's is actually lower than chlorine's.
    answer: 2
    explanation: |
      Larger atoms → more polarisable → stronger dispersion.

  # ---- Multi-select
  - slug: apchem-u03-exam-q25
    type: multi_select
    topic_code: "3.5"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      A sample of neon gas is heated from 300 K to 600 K in a rigid container. Which statements are correct? Select all that apply.
    options:
      - "The average kinetic energy of the atoms doubles."
      - "The root-mean-square speed of the atoms doubles."
      - "The pressure of the gas doubles."
      - "The Maxwell–Boltzmann distribution becomes broader with its peak at a higher speed."
      - "The number of atoms with very high speeds decreases."
    option_explanations:
      - |
        Correct. Average kinetic energy is proportional to the kelvin temperature, which doubled.
      - |
        Incorrect, so it should not be selected. v_rms ∝ √T, so doubling T raises the speed by a factor of √2 ≈ 1.41, not 2.
      - |
        Correct. At constant V and n, P ∝ T, so the pressure doubles.
      - |
        Correct. Raising the temperature spreads the speed distribution and shifts the most probable speed higher.
      - |
        Incorrect, so it should not be selected. The high-speed tail grows at higher temperature; more atoms, not fewer, have very high speeds.
    answer: [0, 2, 3]
    explanation: |
      KE ∝ T, P ∝ T at constant V, v ∝ √T.

  - slug: apchem-u03-exam-q26
    type: multi_select
    topic_code: "3.10"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which of the following are expected to be more soluble in hexane than in water? Select all that apply.
    options:
      - "Iodine, I₂"
      - "Potassium chloride, KCl"
      - "Vegetable oil (long-chain esters of fatty acids)"
      - "Glucose, C₆H₁₂O₆"
      - "Naphthalene, C₁₀H₈"
    option_explanations:
      - |
        Correct. Nonpolar I₂ interacts with hexane through dispersion forces of similar strength to those it gives up; water offers only a poor trade.
      - |
        Incorrect, so it should not be selected. KCl is ionic and dissolves in water by ion–dipole attraction; hexane cannot solvate ions.
      - |
        Correct. The long hydrocarbon chains of fats are hydrophobic and dissolve in hexane by dispersion forces.
      - |
        Incorrect, so it should not be selected. Glucose's five O–H groups hydrogen-bond with water; it is insoluble in hexane.
      - |
        Correct. Naphthalene is a flat nonpolar hydrocarbon; it dissolves in hexane and not in water.
    answer: [0, 2, 4]
    explanation: |
      Nonpolar solutes prefer the nonpolar solvent.

  - slug: apchem-u03-exam-q27
    type: multi_select
    topic_code: "3.2"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which statements about the properties of solids are correct? Select all that apply.
    options:
      - "Ionic solids are brittle because shifting a layer brings like charges into contact, which repel."
      - "Molecular solids generally have low melting points because only intermolecular forces must be overcome."
      - "Metals are malleable because their cations can slide past one another within the electron sea without breaking directional bonds."
      - "Covalent network solids are soft because their atoms are held by weak dispersion forces."
      - "Ionic solids conduct electricity well in the solid state because of their mobile ions."
    option_explanations:
      - |
        Correct. The alternating lattice of an ionic solid is destroyed by a shift of one ion spacing, so the crystal cleaves rather than deforming.
      - |
        Correct. Melting a molecular solid overcomes dispersion, dipole–dipole or hydrogen-bonding forces, all weaker than bonds.
      - |
        Correct. Metallic bonding is non-directional; the electron sea adjusts as the layers of cations slip.
      - |
        Incorrect, so it should not be selected. Covalent network solids (diamond, SiO₂) are among the hardest materials because every atom is covalently bonded to its neighbours.
      - |
        Incorrect, so it should not be selected. In a solid ionic lattice the ions are fixed; conduction requires melting or dissolving.
    answer: [0, 1, 2]
    explanation: |
      Properties follow from the particles and the forces between them.

