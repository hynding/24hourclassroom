    # ---- Short answer
    - slug: apchem-u03-w10-q22
      type: short_answer
      topic_code: "3.8"
      source: "general knowledge"
      points: 3
      prompt: |
        Two beakers each contain 100 mL of a 0.10 M aqueous solution: beaker 1 holds potassium bromide, KBr, and beaker 2 holds ethanol, C₂H₅OH.
        (a) Describe in words the particulate diagram for each solution, naming the solute particles present and how water is arranged around them.
        (b) Predict which solution conducts electricity and explain, using your diagrams.
        (c) A third beaker holds 0.10 M calcium bromide, CaBr₂. State how its diagram differs from beaker 1's, and compare the total concentration of ions in beakers 1 and 3.
      answer: |
        (a) Beaker 1: separate K⁺ and Br⁻ ions in a 1 : 1 ratio, each surrounded by water molecules; the oxygens of water point toward K⁺ and the hydrogens toward Br⁻. Beaker 2: intact C₂H₅OH molecules dispersed among water molecules, hydrogen-bonded through the O–H group; no ions.
        (b) Beaker 1 conducts because it contains mobile ions that carry charge; beaker 2 does not, because ethanol stays molecular and there are no charge carriers.
        (c) Beaker 3 shows two Br⁻ for each Ca²⁺ (each Ca²⁺ with water oxygens inward, each Br⁻ with hydrogens inward). Total ion concentration: beaker 1 is 0.20 M (0.10 K⁺ + 0.10 Br⁻); beaker 3 is 0.30 M (0.10 Ca²⁺ + 0.20 Br⁻).
      explanation: |
        Scoring: 1 point for (a) with dissociated 1 : 1 hydrated ions in beaker 1 (correct water orientation around at least one ion) and intact ethanol molecules in beaker 2; 1 point for (b) identifying KBr as the conductor because of mobile ions and ethanol as a non-conductor because it does not ionise; 1 point for (c) giving a 1 : 2 Ca²⁺ : Br⁻ ratio and total ion concentrations of 0.20 M and 0.30 M.

    - slug: apchem-u03-w10-q23
      type: short_answer
      topic_code: "3.9"
      source: "general knowledge"
      points: 3
      prompt: |
        A black ink is spotted on chromatography paper and developed with water. Three coloured spots appear: blue at 6.3 cm, red at 4.2 cm and yellow at 1.4 cm from the start line; the solvent front is at 7.0 cm.
        (a) Calculate the R_f of each dye.
        (b) Explain, in terms of intermolecular forces, why the dyes separate.
        (c) The experiment is repeated with the same paper but with ethanol, a less polar solvent, as the mobile phase. Predict how the R_f of the blue dye will change and justify your prediction.
      answer: |
        (a) Blue: 6.3/7.0 = 0.90; red: 4.2/7.0 = 0.60; yellow: 1.4/7.0 = 0.20.
        (b) Each dye is attracted to the polar cellulose (stationary phase) and to the water (mobile phase) to a different extent. A dye whose attractions to the paper are strong relative to its attractions to water spends more time stuck and moves less (yellow); a dye more strongly attracted to the water moves with it (blue). Different balances of hydrogen bonding, dipole and dispersion forces give different distances.
        (c) It will decrease. Ethanol is less polar than water, so it attracts the polar blue dye less strongly; the dye's attraction to the polar paper now wins more often, it spends more time on the stationary phase, and its R_f falls.
      explanation: |
        Scoring: 1 point for (a) with all three R_f values (0.90, 0.60, 0.20; accept ±0.01); 1 point for (b) explaining separation by different balances of attraction to stationary and mobile phases, naming intermolecular forces; 1 point for (c) predicting a lower R_f because the less polar mobile phase attracts the polar dye less, so it spends more time on the stationary phase. Accept a prediction of a higher R_f only if the student explicitly argues the blue dye is nonpolar and the reasoning is consistent.

    # ---- Long answer
    - slug: apchem-u03-w10-q24
      type: long_answer
      topic_code: "3.7"
      source: "PubChem (molar masses)"
      points: 6
      prompt: |
        A student is asked to prepare 250.0 mL of 0.200 M sodium carbonate, Na₂CO₃ (105.99 g/mol), and then to dilute part of it to make 100.0 mL of 0.0500 M Na₂CO₃.
        (a) Calculate the mass of Na₂CO₃ needed for the 0.200 M solution.
        (b) Describe the correct procedure for preparing the 0.200 M solution in a 250.0 mL volumetric flask.
        (c) Calculate the volume of the 0.200 M solution needed for the dilution and describe how the dilution is performed.
        (d) State the concentration of sodium ions and of carbonate ions in the diluted solution.
        (e) The student accidentally fills the 250.0 mL flask slightly above the calibration mark. Explain whether the concentration of the resulting solution is higher or lower than 0.200 M and whether the number of moles of solute has changed.
      answer: |
        (a) n = 0.200 mol/L × 0.2500 L = 0.0500 mol; mass = 0.0500 × 105.99 = 5.30 g.
        (b) Weigh 5.30 g of Na₂CO₃, dissolve it in distilled water in a beaker using less than 250 mL, transfer the solution quantitatively to the 250.0 mL volumetric flask with rinsing, add water to the calibration mark (bottom of the meniscus on the line), stopper and invert several times to mix.
        (c) V₁ = M₂V₂/M₁ = (0.0500 M)(100.0 mL)/0.200 M = 25.0 mL. Pipette 25.0 mL of the 0.200 M solution into a 100.0 mL volumetric flask and add water to the mark, then mix.
        (d) Na₂CO₃ dissociates to 2 Na⁺ + CO₃²⁻: [Na⁺] = 0.100 M, [CO₃²⁻] = 0.0500 M.
        (e) Lower than 0.200 M: the moles of solute are unchanged (all 5.30 g were added), but the volume is larger than 250.0 mL, so moles per litre is smaller.
      explanation: |
        Scoring: (a) 1 point for 0.0500 mol and 5.30 g; (b) 1 point for dissolving in less than the final volume, transferring, then filling to the mark and mixing (not filling to the mark before dissolving); (c) 1 point for 25.0 mL with the dilution equation and 1 point for diluting to a final volume of 100.0 mL in a volumetric flask (not adding 100.0 mL of water); (d) 1 point for [Na⁺] = 0.100 M and [CO₃²⁻] = 0.0500 M; (e) 1 point for "lower" with the reasoning that moles are unchanged while the volume is larger.
