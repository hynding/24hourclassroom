week: 10
unit: 3
title: "Solutions, Mixtures and Chromatography"
topics: ["3.7", "3.8", "3.9"]
guide: guides/week-10.md
guide_description: |
  Solutions as homogeneous mixtures; molarity from mass and volume, mass needed for a target concentration,
  dilution with M₁V₁ = M₂V₂, mixing two solutions, and the concentration of each ion in a strong electrolyte;
  particulate diagrams of ionic and molecular solutes with correctly oriented water; chromatography as a contest
  between attractions to the stationary and mobile phases, the retention factor R_f, column and gas chromatography,
  and distillation by boiling point. Worked examples: NaCl molarity, KNO₃ mass, HCl dilution, mixing NaCl
  solutions, judging a CaCl₂ diagram, R_f on a silica plate.
flashcards_description: |
  30 cards on molarity and its rearrangements, dilution and mixing, ion concentrations, particulate pictures of
  solutions, hydration shells, electrolytes, chromatography vocabulary and R_f, distillation and filtration.

flashcards:
  - front: Solution vs heterogeneous mixture → the particulate difference
    back: |
      A solution is homogeneous: solute dispersed as individual molecules or ions, same composition everywhere, nothing settles. A heterogeneous mixture (mud, salad dressing) has regions of different composition.
    topic_code: "3.7"
  - front: Molarity → the definition and the one volume that counts
    back: |
      M = moles of solute ÷ litres of solution. The volume is that of the final solution in the volumetric flask, not the volume of water added.
    topic_code: "3.7"
  - front: Molarity of 5.85 g NaCl made up to 250.0 mL → the steps
    back: |
      n = 5.85 ÷ 58.44 = 0.100 mol; M = 0.100 ÷ 0.2500 L = 0.400 M. Convert mL to L before dividing.
    topic_code: "3.7"
  - front: Mass of solute for a target molarity → the rearrangement
    back: |
      mass = M × V(L) × molar mass. For 250.0 mL of 0.150 M KNO₃: 0.150 × 0.2500 = 0.0375 mol × 101.11 g/mol = 3.79 g.
    topic_code: "3.7"
  - front: Dilution equation → what is conserved and the formula
    back: |
      Moles of solute are unchanged when solvent is added: M₁V₁ = M₂V₂. Any volume unit works as long as both volumes use it.
    topic_code: "3.7"
  - front: Diluting 25.0 mL of 6.00 M HCl to 500.0 mL → the result
    back: |
      M₂ = (6.00 × 25.0) ÷ 500.0 = 0.300 M. The stock is 20 times more concentrated because the volume grew 20-fold.
    topic_code: "3.7"
  - front: Volume of stock needed for a dilution → the rearrangement
    back: |
      V₁ = M₂V₂ ÷ M₁. To make 250.0 mL of 0.0400 M from 0.500 M stock: V₁ = (0.0400)(250.0) ÷ 0.500 = 20.0 mL, made up to the mark with water.
    topic_code: "3.7"
  - front: Mixing two solutions of the same solute → the rule
    back: |
      Add the moles from each, divide by the total volume. 100.0 mL of 0.200 M + 200.0 mL of 0.100 M NaCl = 0.0400 mol ÷ 0.3000 L = 0.133 M. Never average the molarities.
    topic_code: "3.7"
  - front: Ion concentrations in a strong electrolyte → the subscript rule
    back: |
      Each ion's molarity = subscript × compound molarity. 0.20 M Na₂SO₄: [Na⁺] = 0.40 M, [SO₄²⁻] = 0.20 M. 0.15 M Al(NO₃)₃: [NO₃⁻] = 0.45 M.
    topic_code: "3.7"
  - front: Strong electrolyte, weak electrolyte, non-electrolyte → examples of each
    back: |
      Strong: soluble ionic compounds, strong acids and bases, fully dissociated (NaCl, HCl, KOH). Weak: partly ionised (acetic acid, NH₃). Non-electrolyte: dissolves as molecules (sucrose, ethanol).
    topic_code: "3.7"
  - front: Molecular solute in water → what the molarity counts
    back: |
      Intact molecules. 0.10 M glucose contains 0.10 M C₆H₁₂O₆ molecules and no ions, so the solution does not conduct.
    topic_code: "3.7"
  - front: Hydrate solute → which molar mass to use
    back: |
      The hydrate's, water included. 0.100 M CuSO₄ from CuSO₄·5H₂O (249.69 g/mol) in 100.0 mL needs 0.0100 mol × 249.69 = 2.50 g; the copper(II) sulfate concentration is still 0.100 M.
    topic_code: "3.7"
  - front: Making a solution in a volumetric flask → the correct sequence
    back: |
      Weigh the solute, dissolve it in less than the final volume of water, transfer completely, add water to the calibration mark, stopper and invert to mix. Filling to the mark before dissolving traps air and errors the volume.
    topic_code: "3.7"
  - front: Molarity-per-volume ratio of 1.0 M and 2.0 M solutions → particulate meaning
    back: |
      The same box of solution holds twice as many solute particles for 2.0 M. Dilution keeps the number of solute particles and enlarges the box of solvent around them.
    topic_code: "3.8"
  - front: Hydration shell around a cation → how the water points
    back: |
      Water's δ− oxygen faces the positive ion; the hydrogens point away. The attraction is ion–dipole.
    topic_code: "3.8"
  - front: Hydration shell around an anion → how the water points
    back: |
      Water's δ+ hydrogens face the negative ion; the oxygen points away. Still an ion–dipole attraction, with the dipole reversed.
    topic_code: "3.8"
  - front: Drawing NaCl(aq) → the checklist
    back: |
      Separate Na⁺ and Cl⁻ in a 1 : 1 count, none touching, each ringed by oriented water (O toward Na⁺, H toward Cl⁻), far more water molecules than ions, no "NaCl molecules".
    topic_code: "3.8"
  - front: Drawing MgCl₂(aq) → the most-missed detail
    back: |
      Two Cl⁻ for every Mg²⁺, all as separate hydrated ions. The common error is an intact MgCl₂ unit or a 1 : 1 ion count.
    topic_code: "3.8"
  - front: Drawing sucrose(aq) → how it differs from a salt
    back: |
      Whole C₁₂H₂₂O₁₁ molecules hydrogen-bonded to surrounding water; no ions at all. The diagram predicts a non-conducting solution.
    topic_code: "3.8"
  - front: Why NaCl dissolves in water at the particle level → the energy argument
    back: |
      Ion–dipole attractions between the ions and water compensate for the ionic attractions broken in the lattice (and the hydrogen bonds broken among water molecules).
    topic_code: "3.8"
  - front: Chromatography → the two phases and the basis of separation
    back: |
      A mobile phase carries the mixture over a stationary phase; each component is slowed in proportion to how strongly it is attracted to the stationary phase relative to the mobile phase. Different attractions give different distances.
    topic_code: "3.9"
  - front: Paper and silica plates → the polarity of the stationary phase
    back: |
      Polar: cellulose and silica are rich in O–H groups. Polar components hydrogen-bond to them and move little in a nonpolar solvent; nonpolar components ride with the solvent.
    topic_code: "3.9"
  - front: Retention factor R_f → the definition and its limits
    back: |
      R_f = distance moved by the spot ÷ distance moved by the solvent front, both from the start line. Between 0 and 1; characteristic of a compound under fixed plate, solvent and temperature.
    topic_code: "3.9"
  - front: R_f of a spot at 3.6 cm with the solvent front at 8.0 cm → the value and its meaning
    back: |
      R_f = 3.6 ÷ 8.0 = 0.45. A second spot at 6.8 cm has R_f = 0.85 and is the less strongly held (on silica, the less polar) component.
    topic_code: "3.9"
  - front: Changing the mobile phase in chromatography → effect on R_f
    back: |
      A more polar solvent competes better with a polar stationary phase, so polar components move farther and all R_f values rise; a less polar solvent lowers them. Relative order can also change.
    topic_code: "3.9"
  - front: Column and gas chromatography → what replaces R_f
    back: |
      Retention time. Components wash through a packed column (or are swept by carrier gas through a coated column) and emerge at different times, the most strongly retained last.
    topic_code: "3.9"
  - front: Distillation → what property it uses and which liquid comes first
    back: |
      Boiling point. The liquid with the weaker intermolecular forces has the higher vapour pressure, boils first, and its vapour is condensed and collected. Ethanol (78 °C) distils before water (100 °C).
    topic_code: "3.9"
  - front: Filtration → what it can and cannot separate
    back: |
      Separates an insoluble solid from a liquid. It cannot separate a true solution, because dissolved particles are molecule-sized and pass through the paper.
    topic_code: "3.9"
  - front: Identifying an unknown by chromatography → the procedure
    back: |
      Run the unknown and known standards side by side on the same plate with the same solvent; a matching R_f (same distance) under identical conditions identifies the component.
    topic_code: "3.9"
  - front: Why "lighter moves farther" is wrong in chromatography → the real factor
    back: |
      Distance depends on the balance of attractions to the two phases, not on mass. A heavy nonpolar molecule outruns a light polar one on silica with a nonpolar solvent.
    topic_code: "3.9"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 3.7, 3.8 and 3.9: molarity, dilution and ion
    concentrations; particulate pictures of solutions; chromatography and distillation), with review of the mole,
    bonding and intermolecular forces. Multiple choice, select-all, true/false and numeric items are graded at
    once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by
    your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: pigment chromatography
    - slug: apchem-u03-w10-q01
      type: multiple_choice
      topic_code: "3.9"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student separates the pigments in a spinach extract by thin-layer chromatography on a silica plate, using a 9 : 1 mixture of hexane and acetone as the mobile phase. The solvent front travels 8.0 cm from the start line. Distances travelled by the pigments, measured from the start line:

        β-carotene (orange; a nonpolar hydrocarbon): 7.6 cm
        Xanthophyll (yellow; a hydrocarbon carrying two O–H groups): 4.8 cm
        Chlorophyll a (blue-green; a large polar molecule): 3.2 cm
        Chlorophyll b (yellow-green; like chlorophyll a but with an additional C=O group): 2.4 cm
      prompt: |
        Which pigment is attracted most strongly to the silica stationary phase?
      options:
        - "β-carotene, because it travels farthest with the solvent"
        - "Xanthophyll, because it has O–H groups"
        - "Chlorophyll b, because it travels the shortest distance"
        - "Chlorophyll a, because it is the largest molecule"
      option_explanations:
        - |
          Travelling with the solvent front means the component is held weakly by the stationary phase; β-carotene is the least attracted to silica.
        - |
          The O–H groups do make xanthophyll more polar than β-carotene, but it still moves farther than either chlorophyll, so it is not the most strongly held.
        - |
          Correct. A component held most strongly by the stationary phase spends the least time in the mobile phase and moves the shortest distance; chlorophyll b's extra C=O makes it the most polar pigment.
        - |
          Size alone does not set the distance, and chlorophyll a moves farther than chlorophyll b, so it is not the most strongly held.
      answer: 2
      explanation: |
        Shortest distance = strongest attraction to the stationary phase.

    - slug: apchem-u03-w10-q02
      type: multiple_choice
      topic_code: "3.9"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student separates the pigments in a spinach extract by thin-layer chromatography on a silica plate, using a 9 : 1 mixture of hexane and acetone as the mobile phase. The solvent front travels 8.0 cm from the start line. Distances travelled by the pigments, measured from the start line:

        β-carotene (orange; a nonpolar hydrocarbon): 7.6 cm
        Xanthophyll (yellow; a hydrocarbon carrying two O–H groups): 4.8 cm
        Chlorophyll a (blue-green; a large polar molecule): 3.2 cm
        Chlorophyll b (yellow-green; like chlorophyll a but with an additional C=O group): 2.4 cm
      prompt: |
        What is the retention factor, R_f, of xanthophyll?
      options:
        - "0.60"
        - "0.40"
        - "1.67"
        - "0.48"
      option_explanations:
        - |
          Correct. R_f = distance moved by the spot ÷ distance moved by the solvent front = 4.8 cm ÷ 8.0 cm = 0.60.
        - |
          This is the R_f of chlorophyll a (3.2 ÷ 8.0), not xanthophyll.
        - |
          This inverts the ratio (8.0 ÷ 4.8); an R_f can never exceed 1 because nothing travels farther than the solvent front.
        - |
          This is the raw distance in centimetres divided by 10; R_f is a ratio of two distances and has no units.
      answer: 0
      explanation: |
        R_f = 4.8/8.0 = 0.60.

    - slug: apchem-u03-w10-q03
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student separates the pigments in a spinach extract by thin-layer chromatography on a silica plate, using a 9 : 1 mixture of hexane and acetone as the mobile phase. The solvent front travels 8.0 cm from the start line. Distances travelled by the pigments, measured from the start line:

        β-carotene (orange; a nonpolar hydrocarbon): 7.6 cm
        Xanthophyll (yellow; a hydrocarbon carrying two O–H groups): 4.8 cm
        Chlorophyll a (blue-green; a large polar molecule): 3.2 cm
        Chlorophyll b (yellow-green; like chlorophyll a but with an additional C=O group): 2.4 cm
      prompt: |
        The student repeats the separation using pure hexane as the mobile phase. Which prediction about the R_f of chlorophyll a is best supported by intermolecular-force reasoning?
      options:
        - "It increases, because hexane is less dense than the mixture and flows faster up the plate."
        - "It is unchanged, because R_f depends only on the identity of the compound."
        - "It increases, because hexane's dispersion forces attract chlorophyll a more strongly than acetone's dipoles do."
        - "It decreases, because the mobile phase is now less polar and competes less effectively with the polar silica for the polar chlorophyll a."
      option_explanations:
        - |
          Flow rate affects how long the run takes, not the ratio of distances; R_f is set by the balance of attractions, and density is irrelevant.
        - |
          R_f is characteristic only for a fixed plate, solvent and temperature; changing the mobile phase changes it.
        - |
          Dispersion forces from hexane are weaker than the dipole and hydrogen-bonding interactions acetone offered; the attraction to the mobile phase falls, so the spot moves less, not more.
        - |
          Correct. Removing the acetone makes the mobile phase nonpolar; the polar chlorophyll a now prefers the polar silica even more, spends less time in the mobile phase, and its R_f falls.
      answer: 3
      explanation: |
        A less polar mobile phase holds polar components less well; their R_f values drop.

    # ---- Multiple choice (3.7)
    - slug: apchem-u03-w10-q04
      type: multiple_choice
      topic_code: "3.7"
      source: "PubChem (molar masses)"
      points: 1
      prompt: |
        A student dissolves 8.00 g of NaOH (40.00 g/mol) in water to make 500.0 mL of solution. What is the molarity of the solution?
      options:
        - "0.0160 M"
        - "0.400 M"
        - "0.200 M"
        - "16.0 M"
      option_explanations:
        - |
          This divides 8.00 g by 500 without converting to moles or litres; molarity needs moles per litre.
        - |
          Correct. n = 8.00 ÷ 40.00 = 0.200 mol; M = 0.200 mol ÷ 0.5000 L = 0.400 M.
        - |
          0.200 is the number of moles; it must still be divided by the volume in litres (0.5000 L) to give the molarity.
        - |
          This divides grams by litres (8.00 ÷ 0.500) and skips the conversion to moles.
      answer: 1
      explanation: |
        0.200 mol / 0.5000 L = 0.400 M.

    - slug: apchem-u03-w10-q05
      type: multiple_choice
      topic_code: "3.7"
      source: "general knowledge"
      points: 1
      prompt: |
        A student needs 100.0 mL of 0.100 M CuSO₄ and has a 2.00 M stock solution. Which procedure gives the correct solution?
      options:
        - "Measure 100.0 mL of the stock and add 5.00 mL of water."
        - "Measure 20.0 mL of the stock and add water to a total volume of 100.0 mL."
        - "Measure 5.00 mL of the stock and add 100.0 mL of water."
        - "Measure 5.00 mL of the stock and add water to a total volume of 100.0 mL."
      option_explanations:
        - |
          Adding 5 mL of water to 100 mL of 2.00 M stock barely dilutes it (to about 1.9 M); the volumes are reversed.
        - |
          20.0 mL of 2.00 M stock contains 0.0400 mol, which in 100.0 mL gives 0.400 M, four times too concentrated.
        - |
          The moles are right, but adding 100.0 mL of water gives a total volume of about 105 mL and a concentration slightly below 0.100 M; the final solution volume is what counts.
        - |
          Correct. V₁ = M₂V₂/M₁ = (0.100)(100.0)/2.00 = 5.00 mL, made up to the 100.0 mL mark so the final solution volume is exactly 100.0 mL.
      answer: 3
      explanation: |
        5.00 mL of stock diluted to a final volume of 100.0 mL.

    - slug: apchem-u03-w10-q06
      type: multiple_choice
      topic_code: "3.7"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the concentration of chloride ions in a 0.25 M solution of aluminium chloride, AlCl₃?
      options:
        - "0.75 M"
        - "0.25 M"
        - "0.083 M"
        - "1.0 M"
      option_explanations:
        - |
          Correct. AlCl₃ dissociates completely into Al³⁺ and three Cl⁻, so [Cl⁻] = 3 × 0.25 M = 0.75 M.
        - |
          0.25 M is the concentration of the compound and of Al³⁺; each formula unit releases three chloride ions.
        - |
          Dividing by three gives a value smaller than the compound's molarity, but each formula unit provides three chloride ions, not one-third of one.
        - |
          Four times the molarity would count every ion (one Al³⁺ plus three Cl⁻), which is the total ion concentration, not [Cl⁻].
      answer: 0
      explanation: |
        Three Cl⁻ per formula unit: 3 × 0.25 = 0.75 M.

    # ---- Multiple choice (3.8)
    - slug: apchem-u03-w10-q07
      type: multiple_choice
      topic_code: "3.8"
      source: "general knowledge"
      points: 1
      prompt: |
        A student draws a particulate diagram of a dilute aqueous solution of magnesium chloride, MgCl₂. Which feature must the diagram include to be correct?
      options:
        - "Intact MgCl₂ units surrounded by water molecules"
        - "Equal numbers of Mg²⁺ and Cl⁻ ions, each hydrated"
        - "Twice as many Cl⁻ ions as Mg²⁺ ions, each separately surrounded by water"
        - "Mg²⁺ and Cl⁻ ions paired together, with water only around the pairs"
      option_explanations:
        - |
          A soluble ionic compound dissociates completely; no MgCl₂ "molecules" exist in the solution.
        - |
          The formula requires two chloride ions for every magnesium ion, so equal numbers would not match the composition.
        - |
          Correct. Complete dissociation gives one Mg²⁺ and two Cl⁻ per formula unit, each ion hydrated by its own shell of oriented water molecules.
        - |
          Ion pairs are not how a dilute strong electrolyte exists; hydration separates each ion from the others.
      answer: 2
      explanation: |
        One Mg²⁺ : two Cl⁻, all separate and hydrated.

    - slug: apchem-u03-w10-q08
      type: multiple_choice
      topic_code: "3.8"
      source: "general knowledge"
      points: 1
      prompt: |
        In a particulate diagram of NaBr dissolved in water, how should the water molecules around a bromide ion be oriented, and why?
      options:
        - "Oxygen toward Br⁻, because oxygen is the most electronegative atom in water"
        - "Hydrogens toward Br⁻, because the partially positive hydrogens are attracted to the negative ion"
        - "Randomly, because water molecules in a liquid have no preferred orientation"
        - "Hydrogens toward Br⁻, because bromide forms covalent bonds to hydrogen"
      option_explanations:
        - |
          Oxygen's electronegativity makes it partially negative; it points toward cations, not anions.
        - |
          Correct. Water's O–H bonds are polar with δ+ hydrogens; the ion–dipole attraction turns those hydrogens toward the negative bromide ion.
        - |
          Hydration shells are ordered; the ion–dipole attraction gives the nearest water molecules a definite orientation.
        - |
          The attraction is ion–dipole, not a covalent bond; bromide ions do not bond to water's hydrogens.
      answer: 1
      explanation: |
        Anions attract the δ+ hydrogens of water (ion–dipole).

    # ---- Multiple choice (3.9)
    - slug: apchem-u03-w10-q09
      type: multiple_choice
      topic_code: "3.9"
      source: "NIST Chemistry WebBook (boiling points, rounded)"
      points: 1
      prompt: |
        A mixture of hexane, C₆H₁₄ (boiling point 69 °C), and octane, C₈H₁₈ (boiling point 126 °C), is separated by distillation. Which statement correctly identifies the first liquid collected and the reason?
      options:
        - "Octane, because its larger molecules are heavier and sink into the condenser first"
        - "Hexane, because it has the stronger hydrogen bonding and therefore the higher vapour pressure"
        - "Octane, because its stronger dispersion forces give it the higher vapour pressure"
        - "Hexane, because its weaker dispersion forces give it the higher vapour pressure and the lower boiling point"
      option_explanations:
        - |
          Distillation separates by volatility, not by mass; the vapour, not the liquid, travels to the condenser.
        - |
          Neither alkane can hydrogen-bond; hexane is more volatile because its dispersion forces are weaker, not stronger.
        - |
          Stronger dispersion forces lower the vapour pressure and raise the boiling point; octane is the less volatile component and distils second.
        - |
          Correct. Hexane's smaller, less polarisable molecules have weaker dispersion forces, so its vapour pressure is higher, it boils at the lower temperature, and it is collected first.
      answer: 3
      explanation: |
        Weaker IMFs → higher vapour pressure → lower boiling point → distils first.

    - slug: apchem-u03-w10-q10
      type: multiple_choice
      topic_code: "3.7"
      source: "general knowledge"
      points: 1
      prompt: |
        50.0 mL of 0.40 M KCl is mixed with 150.0 mL of 0.20 M KCl. Assuming the volumes are additive, what is the concentration of KCl in the mixture?
      options:
        - "0.25 M"
        - "0.30 M"
        - "0.60 M"
        - "0.050 M"
      option_explanations:
        - |
          Correct. Moles: 0.0500 × 0.40 = 0.020 mol plus 0.1500 × 0.20 = 0.030 mol, total 0.050 mol in 0.2000 L = 0.25 M.
        - |
          0.30 M is the simple average of the two molarities; the volumes are unequal, so the moles must be added and divided by the total volume.
        - |
          0.60 M adds the two molarities, which is meaningless; adding solutions can never give a concentration above the more concentrated one.
        - |
          0.050 is the total number of moles of KCl; it must still be divided by the total volume of 0.2000 L.
      answer: 0
      explanation: |
        Total moles 0.050 / total volume 0.200 L = 0.25 M.

    # ---- Review (1.1)
    - slug: apchem-u03-w10-q11
      type: multiple_choice
      topic_code: "1.1"
      source: "PubChem (molar masses)"
      points: 1
      prompt: |
        A student prepares 100.0 mL of 0.100 M copper(II) sulfate solution from the hydrate CuSO₄·5H₂O (249.69 g/mol). What mass of the hydrate is required?
      options:
        - "1.60 g"
        - "25.0 g"
        - "2.50 g"
        - "0.250 g"
      option_explanations:
        - |
          1.60 g uses the molar mass of anhydrous CuSO₄ (159.61 g/mol), but the solid weighed out is the hydrate, whose formula mass includes five waters.
        - |
          25.0 g treats the volume as 1.00 L; the solution is only 0.1000 L, so a tenth as many moles are needed.
        - |
          Correct. n = 0.100 mol/L × 0.1000 L = 0.0100 mol; mass = 0.0100 mol × 249.69 g/mol = 2.50 g of the hydrate.
        - |
          0.250 g is ten times too small; it would come from using 0.001 L or 24.97 g/mol by mistake.
      answer: 2
      explanation: |
        0.0100 mol × 249.69 g/mol = 2.50 g.

    # ---- Review (2.1)
    - slug: apchem-u03-w10-q12
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Four solid substances are each dissolved in water to make 0.10 M solutions. Which solution conducts electricity well, and why?
      options:
        - "Sucrose, C₁₂H₂₂O₁₁, because its many O–H groups form ions with water"
        - "Potassium nitrate, KNO₃, because its ionic bonds give separate mobile ions in water"
        - "Glucose, C₆H₁₂O₆, because its covalent bonds break on dissolving"
        - "Urea, (NH₂)₂CO, because nitrogen atoms carry a charge in solution"
      option_explanations:
        - |
          Sucrose dissolves as whole molecules; O–H groups hydrogen-bond to water but do not ionise, so the solution does not conduct.
        - |
          Correct. KNO₃ is held together by ionic bonds between K⁺ and NO₃⁻; in water these ions separate and move, carrying current.
        - |
          Glucose's covalent bonds stay intact on dissolving; it is a non-electrolyte.
        - |
          Urea is a neutral molecular compound; its nitrogen atoms are not charged and it does not ionise.
      answer: 1
      explanation: |
        Only the ionic compound gives mobile ions.

    # ---- Multi-select
    - slug: apchem-u03-w10-q13
      type: multi_select
      topic_code: "3.8"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        A particulate diagram of a 0.1 M sodium sulfate, Na₂SO₄, solution is to be drawn. Which statements describe a correct diagram? Select all that apply.
      options:
        - "There are two Na⁺ ions for every SO₄²⁻ ion."
        - "Water molecules near each Na⁺ point their oxygen atoms toward the ion."
        - "Water molecules near each SO₄²⁻ point their hydrogen atoms toward the ion."
        - "The sulfate ions are drawn as separate S and O atoms."
        - "Na₂SO₄ units are drawn intact, each surrounded by water."
      option_explanations:
        - |
          Correct. The formula Na₂SO₄ gives two sodium ions per sulfate ion, and the diagram must keep that ratio.
        - |
          Correct. The δ− oxygen of water is attracted to the positive sodium ion (ion–dipole).
        - |
          Correct. The δ+ hydrogens of water face the negative sulfate ion.
        - |
          Incorrect, so it should not be selected. The sulfate ion is a polyatomic ion held together by covalent bonds; it stays intact in solution.
        - |
          Incorrect, so it should not be selected. A soluble ionic compound dissociates completely; no intact Na₂SO₄ units exist in the solution.
      answer: [0, 1, 2]
      explanation: |
        Dissociated ions in the formula ratio, polyatomic ions intact, water oriented by charge.

    - slug: apchem-u03-w10-q14
      type: multi_select
      topic_code: "3.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        A mixture of three compounds is separated on a polar silica plate with a nonpolar solvent: propan-1-ol (CH₃CH₂CH₂OH), hexane (C₆H₁₄) and propanone (CH₃COCH₃). Which statements are correct? Select all that apply.
      options:
        - "Hexane has the highest R_f because it interacts with silica only through dispersion forces."
        - "Propan-1-ol has the lowest R_f because it hydrogen-bonds to the O–H groups of silica."
        - "Propanone has a higher R_f than propan-1-ol but lower than hexane."
        - "Propan-1-ol has the highest R_f because it is the most soluble in the solvent."
        - "All three have the same R_f because they have similar molar masses."
      option_explanations:
        - |
          Correct. Hexane is nonpolar; it is held to the polar stationary phase only weakly and travels with the nonpolar solvent.
        - |
          Correct. The alcohol's O–H both donates and accepts hydrogen bonds to silica's surface O–H groups, the strongest attraction of the three.
        - |
          Correct. Propanone's C=O is polar and can accept a hydrogen bond from silica, so it is held more than hexane, but it cannot donate one, so it is held less than the alcohol.
        - |
          Incorrect, so it should not be selected. Propan-1-ol is the most strongly attracted to the polar stationary phase and so moves least, not most.
        - |
          Incorrect, so it should not be selected. R_f depends on the balance of intermolecular attractions, not on molar mass.
      answer: [0, 1, 2]
      explanation: |
        Order of R_f on polar silica with nonpolar solvent: hexane > propanone > propan-1-ol.

    # ---- True / false
    - slug: apchem-u03-w10-q15
      type: true_false
      topic_code: "3.7"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: when 100.0 mL of water is added to 100.0 mL of a 0.50 M solution, the number of moles of solute in the solution is halved.
      answer: false
      explanation: |
        False. Dilution adds solvent only; the moles of solute are unchanged. The concentration halves (to 0.25 M) because the same moles occupy twice the volume.

