    # ---- Short answer
    - slug: apchem-u01-w01-q22
      type: short_answer
      topic_code: "1.2"
      source: "NIST Atomic Weights and Isotopic Compositions"
      points: 3
      stimulus: |
        Graph description: The mass spectrum of a pure element shows two peaks of nearly equal height: one at m/z = 79 with relative height 50.7 and one at m/z = 81 with relative height 49.3.
      prompt: |
        Answer (a), (b) and (c).

        (a) Identify the element and justify your identification with a calculation.
        (b) Explain, in terms of what the spectrometer detects, why the spectrum has exactly two peaks.
        (c) A student claims that a single atom of this element has a mass of 79.90 u. Explain why the claim is incorrect.
      answer: |
        (a) Average = (0.507)(79) + (0.493)(81) = 40.05 + 39.93 = 79.98 ≈ 79.9 u, which matches bromine (79.90 u on the periodic table).
        (b) The detector counts ions at each mass-to-charge ratio. Bromine atoms exist as only two isotopes, ⁷⁹Br and ⁸¹Br, so singly charged ions arrive at only two values of m/z and only two peaks appear.
        (c) 79.90 u is the abundance-weighted average of the two isotope masses. Every individual bromine atom is either ⁷⁹Br (about 79 u) or ⁸¹Br (about 81 u); no atom has the average mass.
      explanation: |
        Three points, one per part.

        (a) 1 pt: the weighted average computed correctly (79.9 to 80.0 u) and the element named as bromine. The calculation must be shown; naming bromine from the peak positions alone earns no credit.

        (b) 1 pt: links two peaks to two isotopes, mentioning that the instrument separates ions by m/z (or mass) so each isotope gives its own signal.

        (c) 1 pt: states that the periodic-table value is an average over isotopes and that individual atoms have isotope masses near 79 or 81 u. Zero for "atoms are too small to weigh".

    - slug: apchem-u01-w01-q23
      type: short_answer
      topic_code: "1.1"
      source: "PubChem (molar masses)"
      points: 3
      prompt: |
        A student is given a 5.00 g sample of sodium chloride, NaCl, and a 5.00 g sample of potassium chloride, KCl. Answer (a), (b) and (c). (Na 22.99, K 39.10, Cl 35.45 g/mol)

        (a) Calculate the number of moles of each compound in its sample.
        (b) Which sample contains more chloride ions? Justify with the result of part (a).
        (c) Explain why equal masses of the two compounds do not contain equal numbers of formula units.
      answer: |
        (a) M(NaCl) = 58.44 g/mol, so n = 5.00 ÷ 58.44 = 0.0856 mol. M(KCl) = 74.55 g/mol, so n = 5.00 ÷ 74.55 = 0.0671 mol.
        (b) The NaCl sample: each formula unit carries one Cl⁻, so moles of Cl⁻ equal moles of compound, and 0.0856 mol > 0.0671 mol.
        (c) A formula unit of KCl is heavier than one of NaCl because K (39.10) is heavier than Na (22.99). Five grams of the heavier formula unit therefore contains fewer formula units; equal masses mean equal numbers of particles only when the particles have equal mass.
      explanation: |
        Three points, one per part.

        (a) 1 pt: both molar masses computed (58.44 and 74.55 g/mol) and both mole amounts correct to three significant figures (0.0856 and 0.0671 mol). One arithmetic slip with correct method may earn the point if the student's values are used consistently later.

        (b) 1 pt: chooses NaCl and justifies with the larger mole amount and the 1:1 ratio of Cl⁻ to formula units.

        (c) 1 pt: explains that the mass per formula unit differs (K heavier than Na), so a fixed mass holds different numbers of units. Zero for restating that the molar masses differ with no link to the number of particles.

    # ---- Long answer
    - slug: apchem-u01-w01-q24
      type: long_answer
      topic_code: "1.2"
      source: "NIST Atomic Weights and Isotopic Compositions"
      points: 6
      stimulus: |
        | Isotope | Isotope mass (u) | Relative abundance (%) |
        |---|---|---|
        | ⁶⁹Ga | 68.926 | 60.1 |
        | ⁷¹Ga | 70.925 | 39.9 |

        Data for the two stable isotopes of gallium.
      prompt: |
        A laboratory receives a sample labelled "pure gallium" and analyses it by mass spectrometry.

        (a) Sketch in words what the mass spectrum of pure gallium should look like: state the m/z value and the relative height of each peak.
        (b) Calculate the average atomic mass of gallium from the data in the table. Show your work.
        (c) The laboratory's spectrum instead shows the peak at m/z = 69 with height 60.1, the peak at m/z = 71 with height 39.9, and a third small peak at m/z = 65. Propose an explanation for the third peak and describe how it would affect a calculation of the average atomic mass if it were mistakenly treated as a gallium isotope.
        (d) The sample has a mass of 2.79 g. Using your answer to (b), calculate the number of gallium atoms in the sample.
      answer: |
        (a) Two peaks only: one at m/z = 69 with relative height 60.1 (the taller) and one at m/z = 71 with relative height 39.9. No peak at 69.7, because no atom has the average mass.

        (b) Average = (0.601)(68.926) + (0.399)(70.925) = 41.42 + 28.30 = 69.72 u.

        (c) A peak at m/z = 65 cannot be a gallium isotope (gallium has only ⁶⁹Ga and ⁷¹Ga), so it indicates a contaminant, most plausibly copper (⁶⁵Cu), or a fragment or impurity ion of mass 65. If it were wrongly included as a gallium isotope, its fractional abundance would be counted at a mass below both true isotopes, so the calculated average would be lower than 69.72 u, and the two gallium fractions would be reduced as well because the heights no longer sum to 100 without it.

        (d) n = 2.79 g ÷ 69.72 g/mol = 0.0400 mol; atoms = 0.0400 mol × 6.022 × 10²³ mol⁻¹ = 2.41 × 10²² atoms.
      explanation: |
        Six points.

        (a) 1 pt: two peaks at m/z 69 and 71 with the 69 peak taller, heights given as about 60 and 40 (or a 3:2 ratio). No credit if a peak is placed at the average mass.

        (b) 1 pt: correct weighted average 69.7 u with the work shown (fractions × masses, summed). Using mass numbers 69 and 71 to get 69.8 earns the point if the method is correct.

        (c) 2 pts: 1 pt for identifying the third peak as an impurity or contaminant (naming copper-65 is a bonus, not required) and ruling it out as gallium; 1 pt for predicting that including it would lower the computed average because its mass is below both gallium isotopes.

        (d) 2 pts: 1 pt for moles = 2.79 ÷ 69.72 = 0.0400 mol; 1 pt for atoms = 2.41 × 10²² (accept 2.40–2.42 × 10²²). Consistent use of an incorrect (b) value earns the method point.
