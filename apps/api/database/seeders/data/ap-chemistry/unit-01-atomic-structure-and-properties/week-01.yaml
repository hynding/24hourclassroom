      points: 1
      prompt: |
        The number of particles in one mole, 6.022 × 10²³, is called ____ number.
      answer: ["Avogadro's", "Avogadro", "Avogadros", "Avogadro's number", "Avogadro number"]
      explanation: |
        Avogadro's number, N_A = 6.022 × 10²³ mol⁻¹, is the conversion factor between moles and particles. It is named for Amedeo Avogadro, though the value was determined long after his death.

