week: 1
unit: 1
title: "Moles, Molar Mass and Mass Spectra"
topics: ["1.1", "1.2"]
guide: guides/week-01.md
guide_description: |
  The mole as the bridge between what a balance reads and how many atoms react: grams to moles to particles with
  molar mass and Avogadro's number, then how a mass spectrum of an element shows its isotopes and how the
  abundance-weighted average becomes the atomic mass on the periodic table. Worked examples: moles of CaCO₃ in an
  antacid tablet, hydrogen atoms in 2.50 mol of water, the magnesium and copper spectra, and solving backwards for
  the abundance of boron-10.
flashcards_description: |
  28 cards on the mole, Avogadro's number, molar mass, particle counts, isotopes, mass spectra and the weighted
  average that gives average atomic mass.

flashcards:
  - front: Mole → definition and the number it stands for
    back: |
      The amount of substance containing exactly 6.022 × 10²³ particles (atoms, molecules, ions or formula units). It was fixed so that one mole of carbon-12 atoms has a mass of exactly 12 g, which is why molar masses in g/mol equal atomic masses in u.
    topic_code: "1.1"
  - front: Avogadro's number → value, units and what it converts
    back: |
      6.022 × 10²³ mol⁻¹. Multiply moles by it to get a number of particles; divide a number of particles by it to get moles. It never converts grams directly.
    topic_code: "1.1"
  - front: Molar mass of a compound → how to compute it from the formula
    back: |
      Add the atomic mass of every atom in the formula, multiplying each element's mass by its subscript (and a parenthesis subscript by everything inside). CaCO₃ = 40.08 + 12.01 + 3(16.00) = 100.09 g/mol.
    hint: Use two-decimal atomic masses from the periodic table.
    topic_code: "1.1"
  - front: n = m/M → what each symbol is and the units
    back: |
      n is amount in moles, m is mass in grams, M is molar mass in g/mol. Grams divided by grams per mole leaves moles. It is the first line of almost every quantitative problem in the course.
    topic_code: "1.1"
  - front: Grams → moles → particles → the two-step chain
    back: |
      Divide the mass by the molar mass to get moles, then multiply moles by 6.022 × 10²³ to get particles. Reverse the chain (divide by Avogadro's number, multiply by molar mass) to go from a particle count back to grams.
    topic_code: "1.1"
  - front: Moles of molecules vs moles of atoms → the trap in a water problem
    back: |
      One mole of H₂O contains one mole of molecules but two moles of H atoms and three moles of atoms in total. Multiply by the subscript before converting to a count of atoms of one element.
    topic_code: "1.1"
  - front: Mass of a single atom → how to get it from the molar mass
    back: |
      Divide the molar mass by Avogadro's number: one gold atom has mass 196.97 g/mol ÷ 6.022 × 10²³ mol⁻¹ = 3.271 × 10⁻²² g. The reverse (mass of one atom × N_A) gives the molar mass.
    topic_code: "1.1"
  - front: Atomic mass unit (u or Da) → definition and gram equivalent
    back: |
      One twelfth of the mass of one carbon-12 atom, 1.661 × 10⁻²⁴ g. An atom's mass in u and the element's molar mass in g/mol have the same numerical value.
    topic_code: "1.1"
  - front: Why the mole is 6.022 × 10²³ and not a round number
    back: |
      The size was chosen to make the mass of a mole of carbon-12 exactly 12 g, so that the atomic mass scale (in u) and the laboratory mass scale (in g) line up. The number is a consequence of that choice, not an arbitrary constant.
    topic_code: "1.1"
  - front: Molar mass of a hydrate such as CuSO₄·5H₂O → how to count the water
    back: |
      Add five full water molecules to the anhydrous formula: 63.55 + 32.06 + 4(16.00) + 5(18.02) = 249.71 g/mol. The dot means the water is part of the crystal, so it is part of the molar mass.
    topic_code: "1.1"
  - front: Significant figures in a mole calculation → the rule
    back: |
      The answer carries as many significant figures as the least precise measured value, usually the given mass. Molar masses from the periodic table are treated as exact enough not to limit the answer.
    topic_code: "1.1"
  - front: Formula unit → when to use the term instead of molecule
    back: |
      Ionic compounds such as NaCl have no discrete molecules, only a repeating lattice, so one mole of NaCl is 6.022 × 10²³ formula units (one Na⁺ and one Cl⁻ each). Molecule is reserved for covalent substances.
    topic_code: "1.1"
  - front: Isotope → definition in terms of subatomic particles
    back: |
      Atoms of one element (same number of protons) that differ in the number of neutrons, so they have different masses but identical chemical behaviour. Chlorine-35 and chlorine-37 are isotopes of chlorine.
    topic_code: "1.2"
  - front: Mass number vs atomic mass → which is a whole number and why
    back: |
      Mass number A is the integer count of protons plus neutrons in one isotope. Atomic mass (on the periodic table) is the weighted average over all natural isotopes, so it is rarely close to an integer: chlorine is 35.45.
    topic_code: "1.2"
  - front: Mass spectrometer → what it does to a sample, in four steps
    back: |
      Vaporises the sample, ionises the atoms (usually to 1+), accelerates and separates the ions by mass-to-charge ratio, and detects how many arrive at each m/z. The record of signal against m/z is the mass spectrum.
    topic_code: "1.2"
  - front: Mass spectrum of an element → what the x-axis and the y-axis show
    back: |
      The x-axis is mass-to-charge ratio m/z, which for singly charged ions equals the isotope mass in u. The y-axis is relative abundance, proportional to how many ions of that mass were detected.
    topic_code: "1.2"
  - front: Mass spectrum of an element → reading isotope abundance from peak height
    back: |
      Each peak is one isotope. Its height divided by the sum of all peak heights is that isotope's fractional abundance. If heights are given as percentages that already sum to 100, use them directly as fractions ÷ 100.
    topic_code: "1.2"
  - front: Average atomic mass from a spectrum → the weighted-average formula
    back: |
      Average atomic mass = Σ (fractional abundance × isotope mass). For magnesium: (0.790)(23.985) + (0.100)(24.986) + (0.110)(25.983) = 24.31 u. Fractions must be decimals, not percentages.
    topic_code: "1.2"
  - front: Chlorine's isotopes → masses, abundances and the resulting average
    back: |
      ³⁵Cl (34.969 u, 75.76%) and ³⁷Cl (36.966 u, 24.24%). Average = (0.7576)(34.969) + (0.2424)(36.966) = 35.45 u, nearer 35 because ³⁵Cl is three times as abundant.
    topic_code: "1.2"
  - front: Predicting which isotope an average lies closest to
    back: |
      The weighted average sits closest to the most abundant isotope's mass. Bromine (50.7% ⁷⁹Br, 49.3% ⁸¹Br) averages 79.90, almost midway; potassium (93.3% ³⁹K) averages 39.10, barely above 39.
    topic_code: "1.2"
  - front: Peak heights given as a ratio rather than percentages → what to do
    back: |
      Divide each height by the sum of all heights to get fractions. Heights 3 : 1 give 0.75 and 0.25; heights 100 : 32.5 : 1.0 give fractions 0.749, 0.243 and 0.007.
    topic_code: "1.2"
  - front: Solving a mass spectrum backwards → finding an unknown abundance
    back: |
      Let x be the fraction of one isotope and 1 − x the other; set x(m₁) + (1 − x)(m₂) equal to the known average and solve. For boron (10.013, 11.009, average 10.81) x = 0.199, so about 20% boron-10.
    topic_code: "1.2"
  - front: Identifying an element from its mass spectrum → the method
    back: |
      Compute the weighted average of the peak positions using the peak heights as weights, then find the element with that atomic mass on the periodic table. Peaks at 63 and 65 with heights 69.2 and 30.8 average to 63.55: copper.
    topic_code: "1.2"
  - front: Why no peak appears at the average atomic mass in an element's spectrum
    back: |
      Every detected ion is a real atom with a real isotope mass. The average is a statistic of the whole mixture; no single atom has the average mass, so the spectrum shows peaks only at isotope masses.
    topic_code: "1.2"
  - front: Doubly charged ions in a mass spectrum → where their peak appears
    back: |
      At half the mass, because the axis is m/z. A ²⁴Mg²⁺ ion appears at m/z = 12. AP spectra almost always assume z = 1, so m/z reads directly as mass.
    topic_code: "1.2"
  - front: Isotope masses are not exact integers → two reasons
    back: |
      A proton and a neutron each have mass slightly above 1 u, and the nuclear binding energy removes a small mass (E = mc²). So chlorine-35 has mass 34.969 u, not 35.000. On the exam, using the mass number is accepted when exact masses are not given.
    topic_code: "1.2"
  - front: Which practice? Turning a drawn mass spectrum into an atomic mass
    back: |
      Practice 3 (representing data and phenomena) to read the spectrum and practice 5 (mathematical routines) to carry out the weighted average. Expect to be asked to show the calculation, not just state the element.
    topic_code: "1.2"
  - front: Error-spotting → an average atomic mass calculation that gives 3545
    back: |
      The percentages were used directly instead of being divided by 100. A weighted average of masses near 35 must itself be near 35; an answer 100 times too large means the abundances were not converted to fractions.
    topic_code: "1.2"

quiz:
  description: |
    24 questions · about 40 minutes · all on this week (topics 1.1 and 1.2: moles, molar mass and mass spectra),
    with no review yet because this is week 1. Multiple choice, select-all, true/false and numeric items are graded
    at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by
    your teacher against the scoring notes. You may use a calculator and the periodic table throughout.
  questions:
    # ---- Multiple choice (1.1)
    - slug: apchem-u01-w01-q01
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A student weighs out 9.01 g of water, H₂O (molar mass 18.02 g/mol). Which of the following is the number of water molecules in the sample?
      options:
        - "9.01 × 6.022 × 10²³ ≈ 5.43 × 10²⁴"
        - "0.500 × 6.022 × 10²³ ≈ 3.01 × 10²³"
        - "18.02 × 6.022 × 10²³ ≈ 1.09 × 10²⁵"
        - "0.500 × 18.02 ≈ 9.01"
      option_explanations:
        - |
          This multiplies the mass in grams directly by Avogadro's number, skipping the conversion to moles; 9.01 g is not 9.01 mol.
        - |
          Correct. 9.01 g ÷ 18.02 g/mol = 0.500 mol, and 0.500 mol × 6.022 × 10²³ mol⁻¹ = 3.01 × 10²³ molecules.
        - |
          This uses the molar mass as if it were the number of moles present; the molar mass is a conversion factor, not an amount.
        - |
          This gives back the mass of the sample in grams, which is where the problem started; no particle count has been found.
      answer: 1
      explanation: |
        Two steps, always: grams ÷ molar mass = moles; moles × Avogadro's number = particles.

    - slug: apchem-u01-w01-q02
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which sample contains the greatest number of atoms?
      options:
        - "1.0 mol of He"
        - "1.0 mol of O₂"
        - "1.0 mol of NH₃"
        - "1.0 mol of CO"
      option_explanations:
        - |
          Helium is monatomic, so 1.0 mol of He is 1.0 mol of atoms, the smallest count of the four.
        - |
          Each O₂ molecule has two atoms, so 1.0 mol of O₂ holds 2.0 mol of atoms, fewer than ammonia.
        - |
          Correct. Each NH₃ molecule contains four atoms (one N and three H), so 1.0 mol of NH₃ holds 4.0 mol of atoms, about 2.4 × 10²⁴.
        - |
          Each CO molecule has two atoms, giving 2.0 mol of atoms, half the count in ammonia.
      answer: 2
      explanation: |
        Equal moles of molecules means equal numbers of molecules; the number of atoms depends on how many atoms each formula contains.

    - slug: apchem-u01-w01-q03
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        The molar mass of magnesium nitrate, Mg(NO₃)₂, is closest to which value? (Mg 24.31, N 14.01, O 16.00 g/mol)
      options:
        - "86.32 g/mol"
        - "100.33 g/mol"
        - "148.33 g/mol"
        - "124.31 g/mol"
      option_explanations:
        - |
          This counts only one nitrate group: 24.31 + 14.01 + 48.00 = 86.32 ignores the subscript 2 outside the parentheses.
        - |
          This doubles the nitrogen but not the oxygen: 24.31 + 2(14.01) + 3(16.00) = 100.33 applies the parenthesis subscript inconsistently.
        - |
          Correct. 24.31 + 2[14.01 + 3(16.00)] = 24.31 + 2(62.01) = 148.33 g/mol; the subscript 2 multiplies every atom inside the parentheses.
        - |
          This takes 2 N and 6 O but forgets to add the oxygen properly: 24.31 + 28.02 + 72.00 = 124.33 would need six oxygens at 12 each, which is not a real mass.
      answer: 2
      explanation: |
        A subscript after a parenthesis multiplies every atom inside: Mg(NO₃)₂ has 1 Mg, 2 N and 6 O.

    - slug: apchem-u01-w01-q04
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A 0.250 mol sample of an unknown pure element has a mass of 15.98 g. The element is most likely
      options:
        - "sulfur (32.06 g/mol)"
        - "copper (63.55 g/mol)"
        - "oxygen (16.00 g/mol)"
        - "selenium (78.97 g/mol)"
      option_explanations:
        - |
          15.98 g ÷ 0.250 mol = 63.9 g/mol, not 32.06; sulfur's molar mass is about half the value found.
        - |
          Correct. Molar mass = mass ÷ moles = 15.98 g ÷ 0.250 mol = 63.9 g/mol, which matches copper's 63.55 g/mol within the precision of the data.
        - |
          16.00 g/mol is the mass of one mole, but here 0.250 mol has nearly 16 g, so the molar mass must be about four times larger.
        - |
          78.97 g/mol would make 0.250 mol weigh 19.7 g, which is too heavy by almost 4 g.
      answer: 1
      explanation: |
        Rearranging n = m/M gives M = m/n. Identifying an element from a measured molar mass is a common first step in an FRQ.

    - slug: apchem-u01-w01-q05
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement best explains why chemists use the mole rather than counting particles directly?
      options:
        - "Individual atoms are far too small and numerous to count, but a mole of them has a mass large enough to weigh on a balance."
        - "Atoms cannot be weighed, so a mole is defined by volume instead of mass."
        - "The mole makes every element have the same molar mass, which simplifies calculations."
        - "Only molecules, not atoms, can be counted in moles."
      option_explanations:
        - |
          Correct. The mole links the microscopic (a count of particles) to the macroscopic (a mass in grams) so that a balance reading becomes a particle count.
        - |
          The mole is defined by a number of particles, chosen so that masses in grams match atomic masses; it is not a volume unit.
        - |
          Elements have different molar masses (1.01 g/mol for H, 196.97 g/mol for Au); the mole gives each a fixed number of atoms, not a fixed mass.
        - |
          Any kind of particle can be counted in moles: atoms, molecules, ions, formula units, even electrons.
      answer: 0
      explanation: |
        The mole is the bridge between the particulate level and the laboratory scale, which is the whole point of topic 1.1.

    - slug: apchem-u01-w01-q06
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A sample contains 3.01 × 10²³ formula units of sodium chloride, NaCl (molar mass 58.44 g/mol). What is its mass?
      options:
        - "58.44 g"
        - "116.9 g"
        - "29.2 g"
        - "0.500 g"
      option_explanations:
        - |
          58.44 g is the mass of a full mole of NaCl, 6.022 × 10²³ formula units; this sample has half that number.
        - |
          116.9 g would be two moles of NaCl; the sample contains half a mole, not two.
        - |
          Correct. 3.01 × 10²³ ÷ 6.022 × 10²³ mol⁻¹ = 0.500 mol, and 0.500 mol × 58.44 g/mol = 29.2 g.
        - |
          0.500 is the number of moles, not the mass in grams; the molar mass still has to be applied.
      answer: 2
      explanation: |
        Particles ÷ Avogadro's number = moles; moles × molar mass = grams.

    # ---- Multiple choice (1.2)
    - slug: apchem-u01-w01-q07
      type: multiple_choice
      topic_code: "1.2"
      source: "NIST Atomic Weights and Isotopic Compositions"
      points: 1
      stimulus: |
        Graph description: The mass spectrum of a pure sample of an element shows two peaks. A tall peak at m/z = 85 has a relative height of 72.2 and a shorter peak at m/z = 87 has a relative height of 27.8. The heights sum to 100.
      prompt: |
        Based on the spectrum, the average atomic mass of the element is closest to
      options:
        - "86.0 u"
        - "85.6 u"
        - "85.0 u"
        - "87.0 u"
      option_explanations:
        - |
          86.0 is the simple average of 85 and 87, which would be correct only if the two isotopes were equally abundant; they are not.
        - |
          Correct. (0.722)(85) + (0.278)(87) = 61.37 + 24.19 = 85.56 ≈ 85.6 u, the atomic mass of rubidium, closer to 85 because ⁸⁵Rb dominates.
        - |
          85.0 is the mass of the lighter isotope alone; the 27.8% of heavier atoms pull the average up by about 0.6 u.
        - |
          87.0 is the mass of the minor isotope; an average must lie between the two isotope masses and closer to the more abundant one.
      answer: 1
      explanation: |
        Weighted average: Σ (fraction × mass). The result must lie between the peak positions and nearer the taller peak.

    - slug: apchem-u01-w01-q08
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        In the mass spectrum of a pure element, what determines the height of each peak?
      options:
        - "The mass of the isotope: heavier isotopes always produce taller peaks."
        - "The charge of the ion: higher charges give taller peaks."
        - "The number of neutrons in the isotope."
        - "The relative number of atoms of that isotope in the sample."
      option_explanations:
        - |
          Mass determines the position of a peak along the m/z axis, not its height; the heaviest isotope is often the least abundant.
        - |
          Charge affects where a peak falls (m/z), and AP spectra assume all ions are 1+; it does not set the height.
        - |
          The neutron count fixes the isotope's mass and hence the peak position; abundance is a separate property measured by the height.
        - |
          Correct. The detector counts ions arriving at each m/z, so a peak's height is proportional to the abundance of that isotope.
      answer: 3
      explanation: |
        Position = mass (for z = 1); height = abundance. Keep the two axes separate.

    - slug: apchem-u01-w01-q09
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The average atomic mass of bromine is 79.90 u, and bromine has only two stable isotopes, ⁷⁹Br and ⁸¹Br. Which conclusion about their abundances is justified?
      options:
        - "⁸¹Br is far more abundant than ⁷⁹Br."
        - "The two isotopes are almost equally abundant, with ⁷⁹Br slightly more common."
        - "⁷⁹Br is at least ten times as abundant as ⁸¹Br."
        - "Bromine atoms all have a mass of 79.90 u."
      option_explanations:
        - |
          If ⁸¹Br dominated, the average would lie above 80, closer to 81; it lies just below 80.
        - |
          Correct. An average of 79.90 is almost exactly midway between 79 and 81 and a little nearer 79, so the isotopes are nearly 50:50 with ⁷⁹Br slightly favoured (about 50.7% to 49.3%).
        - |
          A 10:1 ratio would put the average near 79.2, well below the observed 79.90.
        - |
          No atom has the average mass; each bromine atom has a mass close to either 79 or 81 u.
      answer: 1
      explanation: |
        Reasoning from the average back to abundances: where the average sits between the isotope masses tells you their ratio.

    - slug: apchem-u01-w01-q10
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Two atoms are described: atom X has 17 protons and 18 neutrons; atom Y has 17 protons and 20 neutrons. Which statement is correct?
      options:
        - "X and Y are different elements because their masses differ."
        - "X and Y are the same isotope because they have the same number of protons."
        - "X and Y are isotopes of argon with mass numbers 35 and 37."
        - "X and Y are isotopes of chlorine with mass numbers 35 and 37."
      option_explanations:
        - |
          The element is set by the proton count; both have 17 protons, so both are the same element, chlorine.
        - |
          The same proton count makes them the same element, but different neutron counts make them different isotopes.
        - |
          Argon has 18 protons; an atom with 17 protons is chlorine regardless of its neutron count.
        - |
          Correct. Seventeen protons is chlorine; mass numbers are 17 + 18 = 35 and 17 + 20 = 37, the two natural isotopes ³⁵Cl and ³⁷Cl.
      answer: 3
      explanation: |
        Proton number identifies the element; proton plus neutron number is the mass number that labels the isotope.

    - slug: apchem-u01-w01-q11
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A student calculates the average atomic mass of copper from a spectrum (peaks at 63 and 65 with heights 69.2 and 30.8) and obtains 6355 u. Which error did the student most likely make?
      options:
        - "Using the peak heights as percentages without dividing by 100."
        - "Adding the two masses instead of averaging them."
        - "Reading the peak positions from the wrong axis."
        - "Using exact isotope masses instead of mass numbers."
      option_explanations:
        - |
          Correct. (69.2)(63) + (30.8)(65) = 4360 + 2002 = 6362, about 100 times the true 63.5; the abundances must be fractions (0.692 and 0.308), not percentages.
        - |
          Adding 63 and 65 gives 128, not thousands; the error here is a factor of 100.
        - |
          Reading the axes incorrectly would give nonsense near 70 or 30, not a number 100 times too large.
        - |
          Exact masses (62.93 and 64.93) change the answer in the second decimal place only, never by a factor of 100.
      answer: 0
      explanation: |
        An answer that is wildly off by a power of ten usually points to a percent-to-fraction mistake. Sanity-check: the average must lie between 63 and 65.

    - slug: apchem-u01-w01-q12
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following has the same mass as 1.00 mol of carbon-12 atoms?
      options:
        - "6.022 × 10²³ atoms of magnesium-24"
        - "0.500 mol of magnesium-24 atoms"
        - "1.00 mol of carbon dioxide molecules, CO₂"
        - "1.00 mol of hydrogen molecules, H₂"
      option_explanations:
        - |
          One mole of ²⁴Mg atoms has a mass of about 24 g, twice the 12 g of a mole of carbon-12.
        - |
          Correct. 1.00 mol of ¹²C has a mass of exactly 12 g; 0.500 mol of ²⁴Mg (24.0 g/mol) is 12.0 g as well.
        - |
          1.00 mol of CO₂ has a mass of 44.01 g; each molecule carries two oxygen atoms on top of the carbon, so a mole of it is much heavier than a mole of carbon atoms.
        - |
          1.00 mol of H₂ has a mass of about 2.02 g, far less than 12 g.
      answer: 1
      explanation: |
        Equal masses can come from different numbers of particles. The mole counts particles; mass depends on which particles.

    # ---- Multi-select
    - slug: apchem-u01-w01-q13
      type: multi_select
      topic_code: "1.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following samples each contain exactly 1.0 mol of oxygen atoms? Select all that apply.
      options:
        - "16.0 g of O₂"
        - "0.50 mol of O₂"
        - "1.0 mol of H₂O"
        - "0.50 mol of CO₂"
        - "1.0 mol of CO"
      option_explanations:
        - |
          Correct. 16.0 g of O₂ is 0.50 mol of molecules (32.00 g/mol), and each holds two O atoms: 1.0 mol of O atoms.
        - |
          Correct. 0.50 mol of O₂ molecules × 2 atoms per molecule = 1.0 mol of oxygen atoms.
        - |
          Correct. Each water molecule has one oxygen atom, so 1.0 mol of H₂O holds 1.0 mol of O atoms.
        - |
          Correct. Each CO₂ has two O atoms, so 0.50 mol of CO₂ holds 1.0 mol of O atoms.
        - |
          Correct. Each CO has one O atom, so 1.0 mol of CO holds 1.0 mol of oxygen atoms.
      answer: [0, 1, 2, 3, 4]
      explanation: |
        Every option works out to one mole of oxygen atoms; the point of the item is to make you count atoms per formula each time rather than assume one option must be wrong.

    - slug: apchem-u01-w01-q14
      type: multi_select
      topic_code: "1.2"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the mass spectrum of a pure element are correct? Select all that apply.
      options:
        - "Each peak corresponds to one isotope of the element."
        - "The tallest peak is always at the average atomic mass."
        - "The relative heights of the peaks give the relative abundances of the isotopes."
        - "For singly charged ions, the m/z value of a peak equals the isotope's mass in u."
        - "The number of peaks equals the number of neutrons in the atom."
      option_explanations:
        - |
          Correct. Atoms of one isotope all have the same mass and arrive at the same m/z, producing one peak per isotope.
        - |
          No peak appears at the average; the average is calculated from the peaks and no actual atom has that mass.
        - |
          Correct. The detector signal is proportional to the number of ions, so heights are proportional to abundances.
        - |
          Correct. With z = 1 the ratio m/z is just the ion's mass, which is why spectra are read directly in u.
        - |
          The number of peaks equals the number of naturally occurring isotopes, which has nothing to do with the neutron count of any one atom.
      answer: [0, 2, 3]
      explanation: |
        Position encodes mass, height encodes abundance, and the average is derived, not observed.

    # ---- True / false
    - slug: apchem-u01-w01-q15
      type: true_false
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: One mole of any pure substance has a mass of 6.022 × 10²³ grams.
      answer: false
      explanation: |
        False. One mole of any substance contains 6.022 × 10²³ particles; its mass is the molar mass in grams, which differs from substance to substance (18.02 g for water, 58.44 g for NaCl). Avogadro's number is a count, not a mass.

    - slug: apchem-u01-w01-q16
      type: true_false
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: The atomic mass of an element listed on the periodic table is closest to the mass of its most abundant isotope.
      answer: true
      explanation: |
        True. The listed value is an abundance-weighted average, so the isotope with the largest weight pulls the average toward itself. Chlorine's 35.45 is closest to ³⁵Cl (75.76%), and magnesium's 24.31 is closest to ²⁴Mg (79%).

    # ---- Fill in the blank
    - slug: apchem-u01-w01-q17
      type: fill_blank
