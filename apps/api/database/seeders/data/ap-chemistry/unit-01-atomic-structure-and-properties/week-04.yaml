week: 4
unit: 1
title: "Periodic Trends and Ionic Compounds"
topics: ["1.7", "1.8"]
guide: guides/week-04.md
guide_description: |
  Every periodic trend as an application of Coulomb's law: atomic and ionic radius, first and successive
  ionization energies, electron affinity and electronegativity across a period and down a group, with the
  aluminum and sulfur dips explained. Then valence electrons as the reason groups behave alike, the charges of
  main-group ions, writing ionic formulas, and why charge and size set the melting points of ionic solids.
  Worked examples: ranking radii, reading magnesium's successive ionization energies, S²⁻ against Cl⁻, Al₂O₃ and
  Ca₃(PO₄)₂, and MgO against NaF.
flashcards_description: |
  30 cards on the periodic trends and their Coulombic explanations, the ionization-energy exceptions, successive
  ionization energies, ionic charges and formulas, and lattice energy.

flashcards:
  - front: Atomic radius across a period → direction and the Coulombic reason
    back: |
      Decreases left to right. Electrons are added to the same shell while protons are added to the nucleus with no new shielding, so Z_eff rises and pulls the valence electrons closer: Na 186 pm, Si 118 pm, Cl 99 pm.
    topic_code: "1.7"
  - front: Atomic radius down a group → direction and the reason
    back: |
      Increases. Each row adds a shell, putting the valence electrons farther out behind one more full core of shielding; Z_eff stays about the same while distance grows: Li 152, Na 186, K 227 pm.
    topic_code: "1.7"
  - front: First ionization energy → definition and the equation it describes
    back: |
      The minimum energy to remove the most loosely held electron from a gaseous atom: X(g) → X⁺(g) + e⁻. Always positive (endothermic). Na 496 kJ/mol, Cl 1251 kJ/mol, Ar 1521 kJ/mol.
    topic_code: "1.7"
  - front: First ionization energy across a period → trend and why
    back: |
      Rises left to right because Z_eff increases while the valence shell stays the same, so the electron is held more tightly. Period 3: Na 496, Mg 738, Al 578, Si 786, P 1012, S 1000, Cl 1251, Ar 1521 kJ/mol.
    topic_code: "1.7"
  - front: First ionization energy down a group → trend and why
    back: |
      Falls because the outermost electron is in a higher shell, farther from the nucleus and shielded by more core electrons: Li 520, Na 496, K 419 kJ/mol.
    topic_code: "1.7"
  - front: Aluminum's ionization energy below magnesium's → the explanation
    back: |
      Mg removes a 3s electron (738 kJ/mol); Al removes a 3p electron (578 kJ/mol), which is higher in energy and more shielded by the 3s pair. A subshell change, not an error in the trend.
    topic_code: "1.7"
  - front: Sulfur's ionization energy below phosphorus's → the explanation
    back: |
      P is 3p³ with three unpaired electrons; S is 3p⁴ with one pair. The repulsion between the paired electrons makes one of them easier to remove (1000 vs 1012 kJ/mol). The same dip occurs at O after N.
    topic_code: "1.7"
  - front: Successive ionization energies → the general pattern
    back: |
      Each is larger than the last because the electron leaves an increasingly positive ion with less repulsion among the remaining electrons. Mg: 738, 1451, then 7733 kJ/mol.
    topic_code: "1.7"
  - front: Big jump in successive ionization energies → what it tells you
    back: |
      The jump marks the first removal of a core electron, which is much closer to the nucleus and unshielded by the valence shell. If the jump comes after IEₙ, the element has n valence electrons: Mg jumps after IE₂, Al after IE₃.
    topic_code: "1.7"
  - front: Electronegativity → definition and the extremes
    back: |
      The ability of a bonded atom to attract the shared electrons. Increases across a period and up a group: fluorine is highest (3.98, Pauling), cesium and francium lowest (about 0.7). Noble gases are usually not assigned values.
    topic_code: "1.7"
  - front: Electron affinity → definition and where it is most negative
    back: |
      The energy change when a gaseous atom gains an electron: X(g) + e⁻ → X⁻(g). Usually exothermic (negative), most strongly for the halogens, which are one electron short of a full p subshell. Do not confuse with ionization energy.
    topic_code: "1.7"
  - front: Ionization energy vs electron affinity → the contrast
    back: |
      Ionization energy removes an electron and is always endothermic; electron affinity adds an electron and is usually exothermic. Both become larger in magnitude toward the upper right of the table (excluding noble gases).
    topic_code: "1.7"
  - front: Cation radius vs its parent atom → which is smaller and why
    back: |
      The cation. Losing the outer electrons often empties a whole shell (Na 186 pm to Na⁺ 102 pm), and the remaining electrons feel the full nuclear charge with less repulsion, so they pull in.
    topic_code: "1.7"
  - front: Anion radius vs its parent atom → which is larger and why
    back: |
      The anion. Added electrons go into the same shell, increase electron–electron repulsion and are shared among the same nuclear charge, so the cloud expands: Cl 99 pm to Cl⁻ 181 pm.
    topic_code: "1.7"
  - front: Ranking isoelectronic ions by size → the rule
    back: |
      Same electrons, so compare protons: more protons means a smaller ion. O²⁻ (8 p) > F⁻ (9) > Na⁺ (11) > Mg²⁺ (12) > Al³⁺ (13), all with 10 electrons.
    topic_code: "1.7"
  - front: Metallic character across the table → trend and link to ionization energy
    back: |
      Metals have low ionization energies and lose electrons easily; metallic character rises down a group and to the left. Nonmetals, at the upper right, have high ionization energies and electronegativities and gain electrons.
    topic_code: "1.7"
  - front: Why elements in one group react alike
    back: |
      They have the same number of valence electrons and the same outer configuration (ns¹ for group 1, ns² np⁵ for the halogens), so they lose or gain the same number of electrons and form compounds with the same formulas: NaCl and KCl, MgO and CaO.
    topic_code: "1.8"
  - front: Valence electron count from the group number → main-group rule
    back: |
      Groups 1 and 2 have 1 and 2; groups 13 to 18 have the group number minus 10 (3 to 8). Chlorine (group 17) has 7; oxygen (16) has 6; aluminum (13) has 3.
    topic_code: "1.8"
  - front: Charge of a main-group ion → how to predict it
    back: |
      Metals lose their valence electrons to reach the previous noble gas: group 1 → 1+, group 2 → 2+, Al → 3+. Nonmetals gain to reach the next noble gas: group 15 → 3−, 16 → 2−, 17 → 1−.
    topic_code: "1.8"
  - front: Transition metals with more than one ionic charge → why
    back: |
      Their 4s and 3d electrons are close in energy, so different numbers can be removed: Fe²⁺ ([Ar] 3d⁶) and Fe³⁺ ([Ar] 3d⁵); Cu⁺ ([Ar] 3d¹⁰) and Cu²⁺ ([Ar] 3d⁹). The Roman numeral in a name gives the charge.
    topic_code: "1.8"
  - front: Writing an ionic formula → the charge-balance method
    back: |
      Find each ion's charge; choose the smallest numbers of each that make the total charge zero; put a polyatomic ion in parentheses if it appears more than once. Al³⁺ + O²⁻ → Al₂O₃; Ca²⁺ + PO₄³⁻ → Ca₃(PO₄)₂.
    topic_code: "1.8"
  - front: Al₂O₃ and Ca₃(PO₄)₂ → why those subscripts
    back: |
      Two Al³⁺ (6+) cancel three O²⁻ (6−). Three Ca²⁺ (6+) cancel two PO₄³⁻ (6−). The subscripts are the smallest whole numbers that make the compound neutral; the lowest common multiple of the charges is the key.
    topic_code: "1.8"
  - front: Ionic bonding → what holds the lattice together
    back: |
      The Coulombic attraction between oppositely charged ions in a three-dimensional lattice, not discrete molecules. Each ion is surrounded by ions of the opposite charge, which is why ionic formulas are empirical ratios.
    topic_code: "1.8"
  - front: Lattice energy → definition and the two factors that set it
    back: |
      The energy released when gaseous ions come together to form the solid lattice. By Coulomb's law it grows with the product of the ion charges and shrinks with the distance between ion centres: larger charges and smaller ions mean a stronger lattice.
    topic_code: "1.8"
  - front: MgO melts at 2825 °C, NaF at 993 °C → the two reasons
    back: |
      MgO's ions carry 2+ and 2−, so the charge product is four times NaF's 1+/1−; and Mg²⁺ (72 pm) and O²⁻ (140 pm) are smaller than Na⁺ (102) and F⁻ (133), so the ions are closer. Both make MgO's lattice energy much larger.
    topic_code: "1.8"
  - front: Ranking melting points of ionic solids → charge first, then size
    back: |
      Compare charges first: higher charge products win (MgO > NaCl). With equal charges, smaller ions sit closer and attract more strongly: NaCl (801 °C) > NaBr (747 °C) > NaI (661 °C).
    topic_code: "1.8"
  - front: Polyatomic ions you must know → the common list
    back: |
      NH₄⁺; OH⁻, NO₃⁻, NO₂⁻, HCO₃⁻, ClO₄⁻, ClO₃⁻, CH₃COO⁻, CN⁻, MnO₄⁻; SO₄²⁻, SO₃²⁻, CO₃²⁻, CrO₄²⁻, Cr₂O₇²⁻, HPO₄²⁻; PO₄³⁻. They stay intact as a unit in ionic compounds.
    topic_code: "1.8"
  - front: Noble gases and ionic compounds → why they form almost none
    back: |
      A full valence shell (ns² np⁶) gives them very high ionization energies and no tendency to gain electrons (no stable anion), so they neither lose nor gain electrons under ordinary conditions.
    topic_code: "1.8"
  - front: Error-spotting → ranking Na⁺ as larger than Na because it has a positive charge
    back: |
      Backwards. Na⁺ has lost its only n = 3 electron; its outer shell is now n = 2, so it is far smaller (102 pm vs 186 pm). A positive charge means fewer electrons, which always shrinks a species.
    topic_code: "1.7"
  - front: Which practice? Using an ionization-energy table to find an element's group
    back: |
      Practice 4 (model analysis): the data (successive ionization energies) are compared with the shell model's prediction of a large jump when the core is reached. Locate the jump; the number of energies before it is the group's valence count.
    topic_code: "1.7"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 1.7 and 1.8: periodic trends and ionic
    compounds), with about a third reviewing weeks 1 to 3. Multiple choice, select-all, true/false and numeric items
    are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are
    graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: successive ionization energies (1.7, 1.5, 1.8)
    - slug: apchem-u01-w04-q01
      type: multiple_choice
      topic_code: "1.7"
      source: "NIST Atomic Spectra Database (ionization energies, rounded)"
      points: 1
      stimulus: |
        Successive ionization energies (kJ/mol) of three period-3 elements, labelled X, Y and Z.

        | Element | IE₁ | IE₂ | IE₃ | IE₄ | IE₅ |
        |---|---|---|---|---|---|
        | X | 496 | 4562 | 6910 | 9543 | 13354 |
        | Y | 738 | 1451 | 7733 | 10543 | 13630 |
        | Z | 578 | 1817 | 2745 | 11577 | 14842 |
      prompt: |
        How many valence electrons does element Z have?
      options:
        - "1"
        - "2"
        - "3"
        - "4"
      option_explanations:
        - |
          A single valence electron would give a large jump between IE₁ and IE₂, as element X shows; Z's first jump is small.
        - |
          Two valence electrons would produce the jump after IE₂, which is element Y's pattern, not Z's.
        - |
          Correct. Z's energies rise gradually through IE₃ (2745) and then jump more than four-fold to IE₄ (11577), so the fourth electron comes from the core: three valence electrons, group 13 (aluminum).
        - |
          Four valence electrons would put the large jump after IE₄; for Z the jump is between IE₃ and IE₄.
      answer: 2
      explanation: |
        Locate the first large jump; the number of ionization energies before it equals the number of valence electrons.

    - slug: apchem-u01-w04-q02
      type: multiple_choice
      topic_code: "1.7"
      source: "NIST Atomic Spectra Database (ionization energies, rounded)"
      points: 1
      stimulus: |
        Successive ionization energies (kJ/mol) of three period-3 elements, labelled X, Y and Z.

        | Element | IE₁ | IE₂ | IE₃ | IE₄ | IE₅ |
        |---|---|---|---|---|---|
        | X | 496 | 4562 | 6910 | 9543 | 13354 |
        | Y | 738 | 1451 | 7733 | 10543 | 13630 |
        | Z | 578 | 1817 | 2745 | 11577 | 14842 |
      prompt: |
        Which statement best explains why IE₂ of element X (4562 kJ/mol) is so much larger than IE₁ (496 kJ/mol)?
      options:
        - "The second electron is removed from a filled n = 2 shell that is closer to the nucleus and no longer shielded by the 3s electron."
        - "The second electron has the opposite spin to the first, and opposite spins are harder to remove."
        - "Removing a second electron from any atom always requires about ten times the energy of the first."
        - "The second electron is removed from the 3p subshell, which is lower in energy than 3s."
      option_explanations:
        - |
          Correct. X is sodium ([Ne] 3s¹). After the 3s electron is gone, the next comes from the 2p core: much closer to the nucleus, feeling a far larger effective nuclear charge.
        - |
          Spin direction has no bearing on ionization energy; the difference is the shell the electron comes from.
        - |
          Element Y's IE₂ is only about twice its IE₁; the ratio depends entirely on whether a core electron is reached.
        - |
          Sodium has no 3p electrons, and 3p is higher in energy than 3s, not lower.
      answer: 0
      explanation: |
        The large jump is always the signature of breaking into the core.

    - slug: apchem-u01-w04-q03
      type: multiple_choice
      topic_code: "1.8"
      source: "NIST Atomic Spectra Database (ionization energies, rounded)"
      points: 1
      stimulus: |
        Successive ionization energies (kJ/mol) of three period-3 elements, labelled X, Y and Z.

        | Element | IE₁ | IE₂ | IE₃ | IE₄ | IE₅ |
        |---|---|---|---|---|---|
        | X | 496 | 4562 | 6910 | 9543 | 13354 |
        | Y | 738 | 1451 | 7733 | 10543 | 13630 |
        | Z | 578 | 1817 | 2745 | 11577 | 14842 |
      prompt: |
        Based on the data, what is the formula of the compound formed between element Y and oxygen?
      options:
        - "YO₂"
        - "Y₂O"
        - "YO"
        - "Y₂O₃"
      option_explanations:
        - |
          YO₂ would require Y to be 4+, but the jump after IE₂ shows only two electrons are readily removed.
        - |
          Y₂O would require a 1+ ion, which is element X's chemistry (Na₂O); Y loses two electrons.
        - |
          Correct. Y loses two electrons (the jump comes after IE₂), forming Y²⁺; with O²⁻ the neutral formula is YO. Y is magnesium and the compound is MgO.
        - |
          Y₂O₃ is the formula for a 3+ cation with oxide, which fits element Z (Al₂O₃), not Y.
      answer: 2
      explanation: |
        Ionization-energy data give the number of valence electrons, which gives the ionic charge and the formula.

    # ---- Multiple choice (1.7)
    - slug: apchem-u01-w04-q04
      type: multiple_choice
      topic_code: "1.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following correctly lists the species in order of increasing radius?
      options:
        - "Mg²⁺ < Na⁺ < F⁻ < O²⁻"
        - "O²⁻ < F⁻ < Na⁺ < Mg²⁺"
        - "Na⁺ < Mg²⁺ < O²⁻ < F⁻"
        - "F⁻ < O²⁻ < Mg²⁺ < Na⁺"
      option_explanations:
        - |
          Correct. All four are isoelectronic (10 electrons). The more protons, the more tightly the same electrons are held: Mg²⁺ (12 p) is smallest and O²⁻ (8 p) largest.
        - |
          This is the reverse order; the species with the most protons, Mg²⁺, should be smallest, not largest.
        - |
          Mg²⁺ has more protons than Na⁺ and is smaller, and F⁻ has more protons than O²⁻ and is smaller; both pairs are reversed here.
        - |
          Anions are larger than cations in an isoelectronic series, so F⁻ and O²⁻ belong at the large end, not the small end.
      answer: 0
      explanation: |
        For an isoelectronic series, rank by nuclear charge: more protons, smaller ion.

    - slug: apchem-u01-w04-q05
      type: multiple_choice
      topic_code: "1.7"
      source: "general knowledge"
      points: 1
      prompt: |
        The first ionization energy of aluminum (578 kJ/mol) is lower than that of magnesium (738 kJ/mol), even though aluminum has the greater nuclear charge. The best explanation is that
      options:
        - "aluminum's valence electrons are in a higher shell than magnesium's."
        - "aluminum has more core electrons, so its valence electrons are more shielded."
        - "aluminum's electron is removed from a 3p orbital, which is higher in energy and more shielded than magnesium's 3s orbital."
        - "aluminum is a metal and magnesium is a nonmetal."
      option_explanations:
        - |
          Both elements have their valence electrons in n = 3; the shell is the same.
        - |
          Both have the same ten-electron neon core, so core shielding is identical.
        - |
          Correct. Magnesium's outermost electron is 3s; aluminum's is 3p, which lies slightly higher in energy and is shielded in part by the 3s pair, so it is easier to remove despite the extra proton.
        - |
          Both are metals; and metallic character would not explain a reversal of the normal trend anyway.
      answer: 2
      explanation: |
        The first of the two period-3 dips: a change of subshell.

    - slug: apchem-u01-w04-q06
      type: multiple_choice
      topic_code: "1.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Which element has the highest electronegativity?
      options:
        - "Cl"
        - "O"
        - "N"
        - "F"
      option_explanations:
        - |
          Chlorine (3.16) is below fluorine in group 17; its valence electrons are farther from the nucleus and more shielded.
        - |
          Oxygen (3.44) is to the left of fluorine in period 2 and has a smaller Z_eff on its valence electrons.
        - |
          Nitrogen (3.04) is two places left of fluorine in period 2, with a lower Z_eff.
        - |
          Correct. Fluorine (3.98) has the highest electronegativity of all elements: small, with a high effective nuclear charge on its valence shell and one electron short of a full octet.
      answer: 3
      explanation: |
        Electronegativity rises across a period and up a group; fluorine is at the top right (excluding the noble gases).

    - slug: apchem-u01-w04-q07
      type: multiple_choice
      topic_code: "1.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Which comparison of atomic radii is correct, and why?
      options:
        - "K is smaller than Na because K has more protons."
        - "Cl is larger than Na because Cl has more electrons."
        - "K is larger than Na because its valence electron is in a higher shell and is shielded by more core electrons."
        - "Cl is larger than Na because electronegativity increases across the period."
      option_explanations:
        - |
          Potassium's extra protons are almost entirely offset by its extra core electrons; the added n = 4 shell makes K larger, not smaller.
        - |
          Chlorine's extra electrons are in the same n = 3 shell as sodium's, while its 17 protons pull them in harder, so Cl (99 pm) is smaller than Na (186 pm).
        - |
          Correct. Down a group each element adds a shell; the valence electron sits farther out behind an additional full core, so K (227 pm) is larger than Na (186 pm).
        - |
          Electronegativity does rise across the period, but radius falls across it; Cl is smaller than Na.
      answer: 2
      explanation: |
        Group trend: distance and shielding dominate; period trend: effective nuclear charge dominates.

    # ---- Multiple choice (1.8)
    - slug: apchem-u01-w04-q08
      type: multiple_choice
      topic_code: "1.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Which formula correctly represents the ionic compound formed between calcium and phosphate ions?
      options:
        - "CaPO₄"
        - "Ca₃(PO₄)₂"
        - "Ca₂(PO₄)₃"
        - "Ca(PO₄)₂"
      option_explanations:
        - |
          CaPO₄ has a net charge of 2+ + 3− = 1−; it is not neutral.
        - |
          Correct. Three Ca²⁺ give 6+ and two PO₄³⁻ give 6−, so Ca₃(PO₄)₂ is neutral; the polyatomic ion stays in parentheses.
        - |
          Ca₂(PO₄)₃ has 4+ against 9−, a net charge of 5−.
        - |
          Ca(PO₄)₂ has 2+ against 6−, a net charge of 4−.
      answer: 1
      explanation: |
        Choose the smallest whole numbers of each ion that make the total charge zero.

    - slug: apchem-u01-w04-q09
      type: multiple_choice
      topic_code: "1.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Magnesium oxide melts at 2825 °C while sodium chloride melts at 801 °C. Which statement best accounts for the difference?
      options:
        - "MgO is a covalent network solid, while NaCl is ionic."
        - "The ions in MgO carry charges of 2+ and 2−, so the Coulombic attraction between them is about four times that between the 1+ and 1− ions of NaCl, and the ions are also smaller."
        - "Magnesium has a higher ionization energy than sodium, so its compounds are more stable."
        - "Oxygen is more electronegative than chlorine, so the bonds in MgO are more polar."
      option_explanations:
        - |
          Both are ionic solids with the same rock-salt lattice; the difference lies in the strength of the ionic attraction, not the type of solid.
        - |
          Correct. Coulomb's law: the attraction scales with the product of the charges (4 for MgO versus 1 for NaCl) and inversely with the distance, and Mg²⁺ and O²⁻ are smaller than Na⁺ and Cl⁻.
        - |
          Ionization energy describes removing an electron from an atom, not the strength of the lattice once the ions have formed.
        - |
          Bond polarity is a covalent-bond concept; in an ionic solid the relevant quantities are the ion charges and the distance between them.
      answer: 1
      explanation: |
        Charge magnitude first, then ion size, both through Coulomb's law.

    - slug: apchem-u01-w04-q10
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Strontium and calcium both form chlorides with the formula MCl₂. Which statement best explains this similarity?
      options:
        - "Both have two valence electrons in an s subshell and lose them to form 2+ ions."
        - "Both have the same atomic radius."
        - "Both have the same number of core electrons."
        - "Both have the same first ionization energy."
      option_explanations:
        - |
          Correct. Ca is [Ar] 4s² and Sr is [Kr] 5s²; the shared ns² valence configuration makes both form 2+ ions, which require two Cl⁻ each.
        - |
          Strontium (215 pm) is larger than calcium (197 pm); size is not what sets the formula.
        - |
          Calcium has 18 core electrons and strontium 36; the core count differs.
        - |
          Their ionization energies differ (Ca 590, Sr 550 kJ/mol); it is the valence electron count that fixes the charge.
      answer: 0
      explanation: |
        Same group, same valence configuration, same ionic charge, same formulas.

    # ---- Review (1.5, 1.6)
    - slug: apchem-u01-w04-q11
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        The photoelectron spectra of sodium and potassium are compared. Which difference would be observed?
      options:
        - "Potassium's spectrum has fewer peaks because potassium is larger."
        - "Potassium's lowest-energy peak (its 4s electron) lies at a lower binding energy than sodium's lowest-energy peak (its 3s electron)."
        - "Sodium's 1s peak lies at a higher binding energy than potassium's 1s peak."
        - "Both spectra have identical peak positions because both elements are in group 1."
      option_explanations:
        - |
          Potassium has six occupied subshells (1s 2s 2p 3s 3p 4s) to sodium's four, so more peaks, not fewer.
        - |
          Correct. The 4s electron is farther from the nucleus and shielded by 18 core electrons, so its binding energy (0.42 MJ/mol) is below that of sodium's 3s electron (0.50 MJ/mol), matching the lower first ionization energy of potassium.
        - |
          Potassium has 19 protons to sodium's 11, so its 1s electrons are held far more tightly (347 vs 104 MJ/mol).
        - |
          Same group means the same number of valence electrons, not the same binding energies; every peak shifts with nuclear charge and shell.
      answer: 1
      explanation: |
        Review of 1.6 through 1.7: the PES valence peak position is the first ionization energy, and it falls down a group.

    - slug: apchem-u01-w04-q12
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Which ion has the ground-state electron configuration [Ar] 3d¹⁰?
      options:
        - "Cu⁺ only"
        - "Ni²⁺ only"
        - "Ga³⁺ only"
        - "Both Cu⁺ and Zn²⁺"
      option_explanations:
        - |
          Cu⁺ ([Ar] 3d¹⁰, copper having lost its single 4s electron) does fit, but so does another ion in the list, so this is incomplete.
        - |
          Ni²⁺ is [Ar] 3d⁸: nickel has 28 electrons and loses its two 4s electrons.
        - |
          Ga³⁺ is [Ar] 3d¹⁰ as well (gallium, 31 electrons, loses 4s² 4p¹), so it fits, but the option excludes the others that also fit.
        - |
          Correct. Cu is [Ar] 4s¹ 3d¹⁰, so Cu⁺ is [Ar] 3d¹⁰; Zn is [Ar] 4s² 3d¹⁰, so Zn²⁺ is [Ar] 3d¹⁰. (Ga³⁺ would too, but no option offers all three.)
      answer: 3
      explanation: |
        Review of 1.5: form cations by removing 4s (and 4p) electrons first; Cu⁺, Zn²⁺ and Ga³⁺ are all d¹⁰ ions.

    # ---- Multi-select
    - slug: apchem-u01-w04-q13
      type: multi_select
      topic_code: "1.7"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following trends are correctly described? Select all that apply.
      options:
        - "First ionization energy generally increases from left to right across a period."
        - "Atomic radius increases from top to bottom within a group."
