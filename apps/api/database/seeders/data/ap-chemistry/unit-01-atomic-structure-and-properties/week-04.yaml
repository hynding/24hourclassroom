    # ---- Short answer
    - slug: apchem-u01-w04-q22
      type: short_answer
      topic_code: "1.7"
      source: "general knowledge"
      points: 3
      prompt: |
        Consider the elements nitrogen, oxygen and fluorine. Answer (a), (b) and (c).

        (a) Arrange the three elements in order of increasing atomic radius and explain the trend in terms of effective nuclear charge.
        (b) The first ionization energies are N 1402, O 1314 and F 1681 kJ/mol. Explain why oxygen's value is lower than nitrogen's.
        (c) Predict the charge of the most common monatomic ion of each element and explain your predictions in terms of valence electrons.
      answer: |
        (a) F < O < N. All three have valence electrons in n = 2 with the same two-electron core, but the nuclear charge rises from 7 to 9 protons, so Z_eff on the valence electrons increases and pulls them closer: fluorine is smallest.
        (b) Nitrogen's 2p³ has three unpaired electrons, one per orbital. Oxygen's 2p⁴ puts a fourth electron into an orbital that already holds one; the repulsion within that pair raises its energy and makes it easier to remove, which outweighs oxygen's extra proton.
        (c) N³⁻, O²⁻ and F⁻. They have 5, 6 and 7 valence electrons and gain 3, 2 and 1 electrons respectively to reach the eight-electron neon configuration.
      explanation: |
        Three points, one per part.

        (a) 1 pt: correct order with the explanation that Z_eff increases across the period with the same shell and shielding.

        (b) 1 pt: electron pairing in oxygen's 2p subshell and the resulting repulsion. Zero for "oxygen is bigger" or "nitrogen has a half-filled subshell" without the repulsion argument.

        (c) 1 pt: all three charges correct and linked to the number of electrons gained to reach a full octet.

    - slug: apchem-u01-w04-q23
      type: short_answer
      topic_code: "1.8"
      source: "general knowledge"
      points: 3
      stimulus: |
        | Compound | Melting point (°C) | Cation radius (pm) | Anion radius (pm) |
        |---|---|---|---|
        | NaF | 993 | 102 | 133 |
        | NaCl | 801 | 102 | 181 |
        | MgO | 2825 | 72 | 140 |
        | CaO | 2613 | 100 | 140 |
      prompt: |
        Use the table to answer (a), (b) and (c).

        (a) Explain why NaF has a higher melting point than NaCl.
        (b) Explain why MgO has a much higher melting point than NaF.
        (c) Predict whether KCl would melt above or below 801 °C and justify your prediction.
      answer: |
        (a) Both have 1+ and 1− ions. F⁻ (133 pm) is smaller than Cl⁻ (181 pm), so in NaF the ion centres are closer and, by Coulomb's law, the attraction between them is stronger; more energy is needed to separate the ions.
        (b) MgO has 2+ and 2− ions, so the product of the charges is four times that in NaF, and both Mg²⁺ (72 pm) and O²⁻ (140 pm, comparable to F⁻) keep the ions close. The much larger charge product gives a far larger lattice energy.
        (c) Below 801 °C. KCl has the same 1+/1− charges as NaCl, but K⁺ (138 pm) is larger than Na⁺ (102 pm), so the ions are farther apart and the attraction weaker; KCl melts at 771 °C.
      explanation: |
        Three points, one per part.

        (a) 1 pt: identifies the smaller anion in NaF, shorter distance, stronger Coulombic attraction.

        (b) 1 pt: identifies the doubled charges (charge product 4 versus 1) as the dominant factor; mention of smaller cation size is acceptable support.

        (c) 1 pt: predicts a lower melting point and justifies with the larger K⁺ radius at equal charge. Zero for the correct prediction with no Coulombic reasoning.

    # ---- Long answer
    - slug: apchem-u01-w04-q24
      type: long_answer
      topic_code: "1.7"
      source: "NIST Atomic Spectra Database (ionization energies, rounded)"
      points: 6
      stimulus: |
        | Element | Atomic radius (pm) | First ionization energy (kJ/mol) | Electronegativity |
        |---|---|---|---|
        | Na | 186 | 496 | 0.93 |
        | Mg | 160 | 738 | 1.31 |
        | Al | 143 | 578 | 1.61 |
        | Si | 118 | 786 | 1.90 |
        | P | 110 | 1012 | 2.19 |
        | S | 104 | 1000 | 2.58 |
        | Cl | 99 | 1251 | 3.16 |
      prompt: |
        The table gives data for the period-3 elements sodium through chlorine.

        (a) Describe the trend in atomic radius across the period and explain it using Coulomb's law and the concept of effective nuclear charge.
        (b) The first ionization energy generally increases across the period but shows two exceptions. Identify both exceptions and explain each in terms of electron configuration.
        (c) Using the data, explain why sodium forms a 1+ ion in its compounds while chlorine forms a 1− ion.
        (d) Predict how the atomic radius and first ionization energy of potassium compare with those of sodium, and justify each prediction.
      answer: |
        (a) The radius decreases steadily from Na (186 pm) to Cl (99 pm). Each element adds one proton to the nucleus and one electron to the same n = 3 shell; the ten-electron core and its shielding do not change, so the effective nuclear charge felt by the valence electrons rises from about +1 to about +7. By Coulomb's law a larger charge at the same distance means a stronger attraction, so the valence electrons are pulled closer and the atom shrinks.

        (b) Aluminum (578 kJ/mol) is lower than magnesium (738): magnesium's outermost electron is 3s, aluminum's is 3p, which is higher in energy and partly shielded by the 3s pair, so it is easier to remove despite the extra proton. Sulfur (1000) is lower than phosphorus (1012): phosphorus is 3p³ with one electron per orbital; sulfur's fourth 3p electron must pair, and the repulsion within that pair makes one of the two easier to remove.

        (c) Sodium has the lowest ionization energy (496 kJ/mol) and the lowest electronegativity (0.93) in the period: its single 3s valence electron is weakly held and is lost readily, leaving the stable neon configuration, so sodium forms Na⁺. Chlorine has the highest ionization energy (1251) and electronegativity (3.16): it holds its own electrons tightly and attracts additional electron density strongly, and gaining one electron fills its 3p subshell to the argon configuration, so it forms Cl⁻.

        (d) Potassium has a larger radius (227 pm) and a lower first ionization energy (419 kJ/mol) than sodium. Its valence electron is in the n = 4 shell, farther from the nucleus, and it is shielded by 18 core electrons instead of 10; the eight extra protons are almost completely cancelled by the extra core, so Z_eff is about the same while the distance is larger, giving a weaker Coulombic attraction.
      explanation: |
        Six points.

        (a) 1 pt: the decreasing trend plus the explanation that Z_eff increases (same shell and core, more protons) and pulls electrons closer.

        (b) 2 pts: 1 pt for identifying Al and S as the exceptions and explaining Al through the 3s → 3p subshell change; 1 pt for explaining S through electron pairing and repulsion in the 3p⁴ configuration.

        (c) 1 pt: uses the low ionization energy/electronegativity of Na and the high values for Cl, linked to reaching noble-gas configurations by losing one or gaining one electron.

        (d) 2 pts: 1 pt for each correct prediction (larger radius, lower ionization energy) with justification by the added shell and greater shielding; a single justification covering both earns both points if it addresses distance and shielding.
