    # ---- True / false
    - slug: apchem-u01-w04-q15
      type: true_false
      topic_code: "1.8"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: In an ionic compound, the lattice energy increases when the ions are smaller because the oppositely charged ions can approach more closely.
      answer: true
      explanation: |
        True. Coulomb's law makes the attraction inversely proportional to the distance between the ion centres; smaller ions sit closer together, so the lattice is held more strongly. That is why LiF (845 °C) melts higher than CsI (632 °C) despite identical charges.

