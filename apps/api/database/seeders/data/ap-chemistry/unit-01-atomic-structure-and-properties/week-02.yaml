      points: 1
      prompt: |
        True or false: 1.00 mol of CuSO₄·5H₂O contains 5.00 mol of water molecules and has a molar mass of 249.71 g/mol.
      answer: true
      explanation: |
        True. The formula fixes five H₂O per formula unit, so a mole of the hydrate holds five moles of water, and the molar mass includes them: 159.61 + 5(18.02) = 249.71 g/mol.

