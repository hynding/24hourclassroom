    # ---- Numeric
    - slug: apchem-u01-w02-q19
      type: numeric
      topic_code: "1.3"
      source: "PubChem (molar masses)"
      points: 1
      prompt: |
        Calculate the mass percent of iron in hematite, Fe₂O₃ (Fe 55.85, O 16.00 g/mol). Give your answer as a percentage to one decimal place.
      answer: { value: 69.9, tolerance: 0.15 }
      explanation: |
        Molar mass = 2(55.85) + 3(16.00) = 159.70 g/mol. Mass of Fe per mole = 111.70 g. 111.70 ÷ 159.70 × 100 = 69.9%.

    - slug: apchem-u01-w02-q20
      type: numeric
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A 2.500 g sample of hydrated copper(II) sulfate, CuSO₄·xH₂O, is heated to constant mass and leaves 1.598 g of anhydrous CuSO₄ (159.61 g/mol). Determine x, the number of water molecules per formula unit. Give your answer as a whole number.
      answer: { value: 5, tolerance: 0.1 }
      explanation: |
        Water lost = 2.500 − 1.598 = 0.902 g = 0.0501 mol. CuSO₄ = 1.598 ÷ 159.61 = 0.01001 mol. Ratio = 0.0501 ÷ 0.01001 = 5.00, so x = 5.

