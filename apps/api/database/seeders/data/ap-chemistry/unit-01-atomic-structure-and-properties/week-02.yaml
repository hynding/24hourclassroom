week: 2
unit: 1
title: "Composition of Pure Substances and Mixtures"
topics: ["1.3", "1.4"]
guide: guides/week-02.md
guide_description: |
  Why a pure compound always has the same composition by mass and a mixture does not: mass percent from a formula,
  empirical and molecular formulas from percent composition and combustion data, and gravimetric methods for the
  composition of a mixture (heating a hydrate to constant mass, dissolving and filtering, converting a component to
  a precipitate). Worked examples include glucose, hematite against magnetite, a C₄H₈ combustion analysis,
  CuSO₄·xH₂O and an iron-ore calculation.
flashcards_description: |
  28 cards on the law of definite proportions, mass percent, empirical and molecular formulas, combustion analysis,
  hydrates, and finding the composition of a mixture from laboratory data.

flashcards:
  - front: Law of definite proportions → statement and particulate reason
    back: |
      A given compound always contains its elements in the same proportions by mass. Every formula unit has the same fixed numbers of each atom, so the mass ratio is locked to the atom ratio. Water is always 11.19% H and 88.81% O.
    topic_code: "1.3"
  - front: Mass percent of an element in a compound → the formula
    back: |
      (number of atoms of the element × its atomic mass) ÷ molar mass of the compound × 100. For C in C₆H₁₂O₆: 72.06 ÷ 180.18 × 100 = 40.0%. The percentages of all elements sum to 100.
    topic_code: "1.3"
  - front: Hematite vs magnetite → which has more iron by mass
    back: |
      Fe₂O₃ is 69.9% Fe (111.70 ÷ 159.70); Fe₃O₄ is 72.4% Fe (167.55 ÷ 231.55). Magnetite is richer. Comparing ores is a mass-percent calculation, not a count of iron atoms.
    topic_code: "1.3"
  - front: Empirical formula → definition and an example where it differs from the molecular formula
    back: |
      The simplest whole-number ratio of atoms. Glucose C₆H₁₂O₆ has empirical formula CH₂O; benzene C₆H₆ has CH. Ionic compounds are written only as empirical formulas.
    topic_code: "1.3"
  - front: Percent composition → empirical formula → the five-step routine
    back: |
      Assume 100 g so percentages become grams; convert each to moles; divide all by the smallest; multiply through to clear fractions (×2 for .5, ×3 for .33/.67); write the formula.
    topic_code: "1.3"
  - front: Mole ratio of 1.33 or 1.5 in an empirical-formula problem → what to do
    back: |
      Never round to 1 or 2. Multiply every ratio by the integer that makes them all whole: 1.33 × 3 = 4, 1.5 × 2 = 3. A ratio C 1 : O 1.5 is C₂O₃, not CO or CO₂.
    topic_code: "1.3"
  - front: Molecular formula from the empirical formula → the multiplier
    back: |
      Divide the known molar mass by the empirical formula mass; the quotient n (a whole number) multiplies every subscript. CH₂O is 30.03 g/mol; 180 ÷ 30.03 = 6, so C₆H₁₂O₆.
    topic_code: "1.3"
  - front: Combustion analysis → where the carbon and hydrogen end up
    back: |
      All carbon becomes CO₂ (1 C per CO₂) and all hydrogen becomes H₂O (2 H per H₂O). Moles of C = mol CO₂; moles of H = 2 × mol H₂O. Oxygen in the sample is found by subtracting the C and H masses from the sample mass.
    topic_code: "1.3"
  - front: Combustion of 0.500 g hydrocarbon → 1.571 g CO₂ and 0.643 g H₂O → formula
    back: |
      C: 1.571 ÷ 44.01 = 0.0357 mol. H: 2 × 0.643 ÷ 18.02 = 0.0714 mol. Ratio 1 : 2, empirical CH₂ (14.03). With molar mass 56.1, the multiplier is 4: C₄H₈.
    topic_code: "1.3"
  - front: Checking a combustion analysis for oxygen in the sample
    back: |
      Add the mass of C (mol × 12.01) and the mass of H (mol × 1.01). If the sum equals the sample mass, there is no oxygen; if it falls short, the difference is the mass of oxygen, which then goes into the mole ratio.
    topic_code: "1.3"
  - front: Benzene from 92.3% C, 7.7% H, molar mass 78.1 → formula
    back: |
      C 92.3 ÷ 12.01 = 7.69; H 7.7 ÷ 1.01 = 7.62; ratio 1 : 1, empirical CH (13.02 g/mol). 78.1 ÷ 13.02 = 6, so C₆H₆.
    topic_code: "1.3"
  - front: Sulfur oxide that is 40.0% S by mass → empirical formula
    back: |
      In 100 g: S 40.0 ÷ 32.06 = 1.25 mol; O 60.0 ÷ 16.00 = 3.75 mol. Divide by 1.25: 1 : 3. SO₃.
    topic_code: "1.3"
  - front: Hydrate → what the dot in CuSO₄·5H₂O means
    back: |
      Five water molecules are built into each formula unit of the crystal. They count in the molar mass (249.71 g/mol) and have a fixed mass percent (36.1%), so a hydrate is a pure compound, not a mixture.
    topic_code: "1.3"
  - front: Pure substance vs mixture → the composition test
    back: |
      A pure substance has a fixed composition that matches a formula and is identical in every sample. A mixture's composition varies from sample to sample and has to be measured, because nothing locks the ratio of its components.
    topic_code: "1.4"
  - front: Homogeneous vs heterogeneous mixture → examples and the difference
    back: |
      Homogeneous: uniform throughout at any sampled scale (salt water, air, brass). Heterogeneous: composition differs from region to region (sand and salt, granite). Both have variable composition.
    topic_code: "1.4"
  - front: Particulate diagram → telling a pure substance from a mixture
    back: |
      One kind of particle (all identical atoms or all identical molecules) is a pure substance; two or more kinds in the same box is a mixture. A box of H₂ and O₂ molecules is a mixture; a box of only H₂O molecules is a pure compound.
    topic_code: "1.4"
  - front: Gravimetric analysis → the idea in one sentence
    back: |
      Convert the component you want to measure into a pure, weighable solid with a known fixed composition, weigh it, and use its composition to count the component. Precipitating Cl⁻ as AgCl is the classic example.
    topic_code: "1.4"
  - front: Heating a hydrate to constant mass → what the data give you
    back: |
      Mass lost is water (÷ 18.02 for moles); the residue is the anhydrous salt (÷ its molar mass for moles). Their ratio is x in salt·xH₂O. The mass lost over the sample mass is the percent water in the sample.
    topic_code: "1.4"
  - front: 2.500 g CuSO₄·xH₂O heated to 1.598 g → x
    back: |
      Water 0.902 g ÷ 18.02 = 0.0501 mol; CuSO₄ 1.598 ÷ 159.61 = 0.01001 mol; ratio 5.00. x = 5. Percent water 0.902 ÷ 2.500 = 36.1%, matching the pure pentahydrate.
    topic_code: "1.4"
  - front: Hydrate heated for too short a time → effect on x
    back: |
      Some water stays in the residue, so the measured mass lost is too small (x too small) and the residue mass is too large (moles of salt too large), both pushing x below the true value.
    topic_code: "1.4"
  - front: Salt-and-sand separation → finding the percent salt
    back: |
      Dissolve the mixture in water, filter, dry and weigh the sand. Salt mass = total − sand. A 5.00 g mixture leaving 3.20 g of sand is 36.0% NaCl. Assumes all salt dissolved and no sand passed the filter.
    topic_code: "1.4"
  - front: Two percentages in series → iron in an ore that is 40.2% Fe₂O₃
    back: |
      First the mixture's composition (0.402 × 25.0 g = 10.05 g Fe₂O₃), then the compound's fixed composition (69.9% Fe): 0.699 × 10.05 = 7.03 g Fe. The mixture percentage varies by sample; the compound's does not.
    topic_code: "1.4"
  - front: Percent of a mixture component from a precipitate → the chain
    back: |
      Mass of precipitate → moles of precipitate (÷ M) → moles of the component (formula ratio) → mass of the component (× its M) → divided by the sample mass × 100. Each arrow is a fixed-composition step.
    topic_code: "1.4"
  - front: Melting behaviour → pure substance or mixture?
    back: |
      A pure crystalline substance melts sharply at one temperature; a mixture softens and melts over a range, usually below the pure components' melting points. A melting-point range is quick evidence of impurity.
    topic_code: "1.4"
  - front: Why ionic compounds have only empirical formulas
    back: |
      An ionic solid is an extended lattice with no discrete molecules, so the formula gives only the simplest ratio of ions that makes the solid neutral: NaCl, CaF₂, Al₂O₃. There is no molecular formula to multiply up to.
    topic_code: "1.3"
  - front: Error-spotting → mass percent of H in H₂O computed as 1.01 ÷ 18.02
    back: |
      The two hydrogens were not both counted. Multiply the atomic mass by the subscript first: 2(1.01) ÷ 18.02 × 100 = 11.2%, not 5.6%.
    topic_code: "1.3"
  - front: Which practice? Arguing from hydrate data that a sample is impure
    back: |
      Practice 6 (argumentation) built on practice 5 (the calculation). Compare the measured percent water with the theoretical value for the pure hydrate; a lower value means part of the sample is something that loses no water.
    topic_code: "1.4"
  - front: Empirical formula problem with a .67 ratio → the multiplier
    back: |
      A ratio such as 1 : 1.67 is 3 : 5 after multiplying by 3. Check by converting the decimal to a fraction (0.67 ≈ 2/3) and clearing the denominator.
    topic_code: "1.3"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 1.3 and 1.4: elemental composition and the
    composition of mixtures), with about a third reviewing week 1's moles and mass spectra. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically;
    the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: hydrate lab (1.4, with 1.1 review)
    - slug: apchem-u01-w02-q01
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student heats a sample of hydrated magnesium sulfate, MgSO₄·xH₂O, in a crucible and records the following data. Molar masses: MgSO₄ 120.37 g/mol, H₂O 18.02 g/mol.

        | Measurement | Mass (g) |
        |---|---|
        | Empty crucible | 21.450 |
        | Crucible + hydrate before heating | 23.910 |
        | Crucible + residue after first heating | 22.690 |
        | Crucible + residue after second heating | 22.650 |
        | Crucible + residue after third heating | 22.650 |
      prompt: |
        Why did the student heat the sample three times rather than once?
      options:
        - "To make sure the magnesium sulfate had decomposed completely into MgO and SO₃."
        - "To confirm that all the water had been driven off, shown by two successive masses that agree."
        - "To allow the crucible to cool between measurements so that the balance reads correctly."
        - "To evaporate the sulfate ions, which are more volatile than water."
      option_explanations:
        - |
          Decomposing the sulfate would ruin the analysis; the goal is to remove water only and leave anhydrous MgSO₄ intact.
        - |
          Correct. Heating to constant mass means repeating until the mass stops changing; the agreement between the second and third heatings shows no water remains.
        - |
          Cooling matters for a good reading, but it does not explain why the heating itself is repeated; repeated heating is about reaching constant mass.
        - |
          Sulfate ions are not volatile; only the water of hydration leaves the crucible at these temperatures.
      answer: 1
      explanation: |
        Heating to constant mass is the standard check that a volatile component has been removed completely.

    - slug: apchem-u01-w02-q02
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student heats a sample of hydrated magnesium sulfate, MgSO₄·xH₂O, in a crucible and records the following data. Molar masses: MgSO₄ 120.37 g/mol, H₂O 18.02 g/mol.

        | Measurement | Mass (g) |
        |---|---|
        | Empty crucible | 21.450 |
        | Crucible + hydrate before heating | 23.910 |
        | Crucible + residue after first heating | 22.690 |
        | Crucible + residue after second heating | 22.650 |
        | Crucible + residue after third heating | 22.650 |
      prompt: |
        What is the mass percent of water in the hydrate sample?
      options:
        - "48.8%"
        - "51.2%"
        - "49.6%"
        - "105%"
      option_explanations:
        - |
          48.8% is the mass percent of the anhydrous residue (1.200 ÷ 2.460), the complement of the water percentage.
        - |
          Correct. Hydrate mass = 23.910 − 21.450 = 2.460 g; final residue = 22.650 − 21.450 = 1.200 g; water lost = 1.260 g; 1.260 ÷ 2.460 × 100 = 51.2%.
        - |
          49.6% uses the first-heating residue (22.690) rather than the constant mass, so it undercounts the water.
        - |
          105% divides the water lost by the residue mass instead of by the original hydrate mass; a percentage of the sample cannot exceed 100.
      answer: 1
      explanation: |
        Percent water = (mass lost ÷ original sample mass) × 100, using the constant-mass residue.

    - slug: apchem-u01-w02-q03
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student heats a sample of hydrated magnesium sulfate, MgSO₄·xH₂O, in a crucible and records the following data. Molar masses: MgSO₄ 120.37 g/mol, H₂O 18.02 g/mol.

        | Measurement | Mass (g) |
        |---|---|
        | Empty crucible | 21.450 |
        | Crucible + hydrate before heating | 23.910 |
        | Crucible + residue after first heating | 22.690 |
        | Crucible + residue after second heating | 22.650 |
        | Crucible + residue after third heating | 22.650 |
      prompt: |
        Which calculation gives the number of moles of water driven off?
      options:
        - "(23.910 − 22.650) × 18.02"
        - "(23.910 − 21.450) ÷ 18.02"
        - "(23.910 − 22.650) ÷ 18.02"
        - "(22.650 − 21.450) ÷ 120.37"
      option_explanations:
        - |
          Multiplying a mass by a molar mass gives units of g²/mol, not moles; mass must be divided by molar mass.
        - |
          23.910 − 21.450 is the mass of the whole hydrate, not the water; dividing it by 18.02 treats the salt as if it were water.
        - |
          Correct. The water lost is the difference between the original crucible-plus-hydrate mass and the constant final mass, 1.260 g, and dividing by 18.02 g/mol gives 0.0699 mol H₂O.
        - |
          This is the number of moles of anhydrous MgSO₄ in the residue (0.00997 mol), needed for the ratio but not the moles of water.
      answer: 2
      explanation: |
        n = m/M applied to the mass that left the crucible. (The ratio 0.0699 ÷ 0.00997 = 7.0 gives MgSO₄·7H₂O.)

    # ---- Multiple choice (1.3)
    - slug: apchem-u01-w02-q04
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement best explains why every sample of pure carbon dioxide is 27.3% carbon by mass?
      options:
        - "Carbon and oxygen have the same atomic mass, so the ratio is fixed by the number of atoms."
        - "Every CO₂ molecule contains one carbon atom and two oxygen atoms, so the mass ratio of C to O is the same in every molecule and therefore in every sample."
        - "Carbon dioxide is a mixture whose composition happens to be constant in the atmosphere."
        - "The percentage depends on how the sample was prepared but is usually close to 27.3%."
      option_explanations:
        - |
          Carbon (12.01) and oxygen (16.00) have different atomic masses; the fixed percentage comes from a fixed atom ratio, not equal masses.
        - |
          Correct. This is the law of definite proportions at the particulate level: a fixed formula means a fixed mass ratio, 12.01 ÷ 44.01 = 27.3%.
        - |
          CO₂ is a pure compound, not a mixture; mixtures are exactly the things whose composition is not fixed.
        - |
          A pure compound's composition does not depend on preparation; that variability is a property of mixtures.
      answer: 1
      explanation: |
        Fixed formula → fixed mass ratio. The explanation must go through the atom ratio.

    - slug: apchem-u01-w02-q05
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A compound contains 2.50 mol of carbon for every 3.75 mol of oxygen and nothing else. Its empirical formula is
      options:
        - "CO"
        - "CO₂"
        - "C₂O₃"
        - "C₃O₂"
      option_explanations:
        - |
          CO would require equal moles of carbon and oxygen; here there is 1.5 times as much oxygen.
        - |
          CO₂ would require twice as much oxygen as carbon (a 1 : 2 ratio); the actual ratio is 1 : 1.5.
        - |
          Correct. 3.75 ÷ 2.50 = 1.5, so the ratio is C 1 : O 1.5; multiplying by 2 gives whole numbers, C₂O₃.
        - |
          C₃O₂ reverses the ratio, putting more carbon than oxygen, the opposite of the data.
      answer: 2
      explanation: |
        A ratio ending in .5 is multiplied through by 2, never rounded.

    - slug: apchem-u01-w02-q06
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A compound has the empirical formula NO₂ and a molar mass of 92.0 g/mol. Its molecular formula is
      options:
        - "NO₂"
        - "N₂O₄"
        - "N₂O₂"
        - "N₄O₈"
      option_explanations:
        - |
          NO₂ has a formula mass of 46.01 g/mol, only half the given molar mass, so the molecule must be larger.
        - |
          Correct. 92.0 ÷ 46.01 = 2.00, so every subscript doubles: N₂O₄ (dinitrogen tetroxide).
        - |
          N₂O₂ has a molar mass of 60.0 g/mol and a 1 : 1 ratio, which does not match the empirical formula NO₂.
        - |
          N₄O₈ would have a molar mass of 184 g/mol, twice the measured value.
      answer: 1
      explanation: |
        Multiplier = molar mass ÷ empirical formula mass; apply it to every subscript.

    - slug: apchem-u01-w02-q07
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A 1.000 g sample of a compound containing only carbon, hydrogen and oxygen is burned completely, producing CO₂ and H₂O. The masses of carbon and hydrogen recovered total 0.652 g. What can be concluded about the sample?
      options:
        - "The sample contained 0.348 g of oxygen, which must be included when finding the empirical formula."
        - "The sample contained no oxygen, because all the mass was accounted for by combustion products."
        - "The experiment lost 0.348 g of material and must be repeated."
        - "The oxygen in the sample was converted to O₂ gas and escaped, so it cannot be measured."
      option_explanations:
        - |
          Correct. Mass is conserved: 1.000 − 0.652 = 0.348 g of the sample was oxygen, found by subtraction and converted to moles (0.0218 mol) for the formula.
        - |
          If the sample had no oxygen, the C and H masses would sum to the full 1.000 g; the 0.348 g shortfall is the oxygen.
        - |
          Nothing was lost; the missing mass is simply the element that is not measured directly by weighing CO₂ and H₂O.
        - |
          The sample's oxygen ends up in the CO₂ and H₂O along with the oxygen from the air; it is found by difference, not by measuring O₂.
      answer: 0
      explanation: |
        In combustion analysis, oxygen in the sample is always found by subtracting the C and H masses from the sample mass.

    - slug: apchem-u01-w02-q08
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Particulate diagram description: Box 1 contains only pairs of identical shaded spheres bonded together. Box 2 contains pairs of identical shaded spheres and also single open spheres, scattered randomly. Box 3 contains only molecules made of one shaded sphere bonded to two open spheres. Which boxes represent pure substances?
      options:
        - "Box 1 only"
        - "Boxes 1 and 3"
        - "Boxes 2 and 3"
        - "Box 3 only"
      option_explanations:
        - |
          Box 1 is a pure element, but box 3 is also pure: every particle in it is the same compound molecule.
        - |
          Correct. Box 1 holds one kind of diatomic element and box 3 holds one kind of compound; each has a single particle type. Box 2 mixes two kinds of particles.
        - |
          Box 2 contains two different particle types (a diatomic element and a monatomic one), which is the definition of a mixture.
        - |
          Box 3 is pure, but so is box 1; a pure substance can be an element as well as a compound.
      answer: 1
      explanation: |
        Pure means one kind of particle, whether that particle is an atom, a diatomic molecule or a compound molecule.

    - slug: apchem-u01-w02-q09
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A 4.00 g mixture of sodium chloride and sand is stirred with water and filtered. The sand is dried and weighs 2.56 g. If some fine sand passed through the filter paper into the filtrate, how would the calculated mass percent of NaCl compare with the true value?
      options:
        - "Too low, because the sand collected weighs more than it should."
        - "Too high, because the sand collected weighs less than it should, so the mass attributed to NaCl is too large."
        - "Unaffected, because the sand in the filtrate is still part of the sample."
        - "Too high, because the dissolved NaCl is heavier than the dry sand."
      option_explanations:
        - |
          Losing sand through the filter makes the collected sand weigh less, not more.
        - |
          Correct. NaCl is found by difference (4.00 − sand). A sand mass that is too small inflates the difference, so the calculated 36.0% would be above the true percentage.
        - |
          The calculation uses only the sand that was weighed; sand lost to the filtrate is counted as if it were salt.
        - |
          Dissolved NaCl is never weighed in this method; the error comes from the sand mass, not from any comparison of densities.
      answer: 1
      explanation: |
        Trace the error through the formula: NaCl = total − sand; smaller sand → larger NaCl → percent too high.

    # ---- Review (1.1, 1.2)
    - slug: apchem-u01-w02-q10
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Graph description: The mass spectrum of a pure element shows peaks at m/z = 20 (height 90.5), m/z = 21 (height 0.3) and m/z = 22 (height 9.2). Which statement about the element is correct?
      options:
        - "Its average atomic mass is exactly 21.0 u, the middle peak."
        - "It has three isotopes of roughly equal abundance."
        - "Its most abundant isotope has 22 nucleons."
        - "Its average atomic mass is slightly above 20 u, and the element is neon."
      option_explanations:
        - |
          The middle peak is the least abundant; an average weighted by heights lands near 20.2, not at 21.
        - |
          Heights of 90.5, 0.3 and 9.2 are far from equal; one isotope makes up about nine tenths of the atoms.
        - |
          The tallest peak is at m/z = 20, so the most abundant isotope has 20 nucleons, not 22.
        - |
          Correct. (0.905)(20) + (0.003)(21) + (0.092)(22) = 18.10 + 0.06 + 2.02 = 20.18 u, which is neon's atomic mass.
      answer: 3
      explanation: |
        Review of 1.2: weighted average from peak heights, then identify the element from the periodic table.

    - slug: apchem-u01-w02-q11
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which quantity of carbon dioxide (44.01 g/mol) contains the largest number of molecules?
      options:
        - "22.0 g of CO₂"
        - "0.400 mol of CO₂"
        - "2.00 × 10²³ molecules of CO₂"
        - "0.250 mol of CO₂"
      option_explanations:
        - |
          Correct. 22.0 ÷ 44.01 = 0.500 mol, about 3.01 × 10²³ molecules, more than any other option.
        - |
          0.400 mol is 2.41 × 10²³ molecules, less than the 0.500 mol in 22.0 g.
        - |
          2.00 × 10²³ molecules is 0.332 mol, fewer than either 0.400 mol or 0.500 mol.
        - |
          0.250 mol is 1.51 × 10²³ molecules, the smallest amount listed.
      answer: 0
      explanation: |
        Review of 1.1: convert every option to the same unit (moles) before comparing.

    - slug: apchem-u01-w02-q12
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Two different compounds of nitrogen and oxygen are analysed. Compound A is 30.4% N by mass; compound B is 46.7% N by mass. Which pair of formulas is consistent with these data? (N 14.01, O 16.00)
      options:
        - "A = NO, B = NO₂"
        - "A = N₂O, B = NO"
        - "A = N₂O₅, B = N₂O"
        - "A = NO₂, B = NO"
      option_explanations:
        - |
          NO is 46.7% N (14.01 ÷ 30.01) and NO₂ is 30.4% N (14.01 ÷ 46.01); this option assigns them the wrong way round.
        - |
          N₂O is 63.6% N (28.02 ÷ 44.02), far above 30.4%; NO at 46.7% would fit B, but A does not match.
        - |
          N₂O₅ is 25.9% N (28.02 ÷ 108.02) and N₂O is 63.6% N; neither matches the data.
        - |
          Correct. NO₂: 14.01 ÷ 46.01 × 100 = 30.4% N. NO: 14.01 ÷ 30.01 × 100 = 46.7% N. More oxygen per nitrogen lowers the nitrogen percentage.
      answer: 3
      explanation: |
        Mass percent from a formula, used to match a formula to an analysis; the same element can form several compounds with different fixed compositions.

    # ---- Multi-select
    - slug: apchem-u01-w02-q13
      type: multi_select
      topic_code: "1.4"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following observations would support the claim that a white solid is a mixture rather than a pure compound? Select all that apply.
      options:
        - "Different samples of the solid give different mass percentages of chloride."
        - "The solid melts over a range of several degrees rather than at one sharp temperature."
        - "The solid dissolves completely in water."
        - "Stirring the solid with water leaves part of it undissolved, and the undissolved part has a different appearance."
        - "The solid has a molar mass that can be calculated from a formula."
      option_explanations:
        - |
          Correct. Variable composition from sample to sample is the defining property of a mixture; a pure compound obeys definite proportions.
        - |
          Correct. Mixtures melt over a range; a pure crystalline compound melts sharply.
        - |
          Complete dissolving is consistent with a pure soluble compound and also with a mixture of soluble salts; it does not distinguish them.
        - |
          Correct. Physical separation into parts with different properties shows that more than one substance is present.
        - |
          A molar mass follows from a formula, which only a pure substance has; this would support the opposite claim.
      answer: [0, 1, 3]
      explanation: |
        Evidence for a mixture: variable composition, a melting range, or physical separability into different components.

    - slug: apchem-u01-w02-q14
      type: multi_select
      topic_code: "1.2"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Lithium has two stable isotopes, ⁶Li (6.015 u) and ⁷Li (7.016 u), and an average atomic mass of 6.94 u. Which statements are correct? Select all that apply.
      options:
        - "⁷Li is much more abundant than ⁶Li."
        - "A mass spectrum of lithium would show two peaks, the one at m/z = 7 far taller."
        - "A mass spectrum of lithium would show a peak at m/z = 6.94."
        - "About 92% of lithium atoms are ⁷Li."
        - "The two isotopes differ in the number of protons."
      option_explanations:
        - |
          Correct. The average 6.94 lies very close to 7.016, so the heavier isotope must dominate.
        - |
          Correct. Two isotopes give two peaks, and peak height tracks abundance, so the ⁷Li peak is far taller.
        - |
          No atom has the average mass; peaks appear only at isotope masses, near 6 and 7.
        - |
          Correct. Solving 6.015x + 7.016(1 − x) = 6.94 gives x ≈ 0.076 for ⁶Li, so about 92% ⁷Li.
        - |
          Isotopes share the same proton number (3 for lithium); they differ in neutrons.
      answer: [0, 1, 3]
      explanation: |
        Review of 1.2: reasoning from the average back to abundances and to the shape of the spectrum.

    # ---- True / false
    - slug: apchem-u01-w02-q15
      type: true_false
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Two different compounds can have the same empirical formula but different molecular formulas.
      answer: true
      explanation: |
        True. Acetylene (C₂H₂) and benzene (C₆H₆) both have the empirical formula CH; formaldehyde (CH₂O), acetic acid (C₂H₄O₂) and glucose (C₆H₁₂O₆) all have CH₂O. The molar mass is needed to tell them apart.

    - slug: apchem-u01-w02-q16
      type: true_false
