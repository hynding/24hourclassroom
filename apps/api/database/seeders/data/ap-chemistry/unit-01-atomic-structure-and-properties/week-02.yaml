    # ---- Short answer
    - slug: apchem-u01-w02-q22
      type: short_answer
      topic_code: "1.3"
      source: "general knowledge"
      points: 3
      prompt: |
        A compound of carbon, hydrogen and oxygen is analysed and found to be 54.5% C, 9.1% H and 36.4% O by mass. Its molar mass is 88.1 g/mol. Answer (a), (b) and (c). (C 12.01, H 1.01, O 16.00)

        (a) Determine the empirical formula. Show the mole calculations.
        (b) Determine the molecular formula.
        (c) A second compound with the same percent composition has a molar mass of 44.0 g/mol. Explain how two different compounds can have identical percent composition.
      answer: |
        (a) In 100 g: C 54.5 ÷ 12.01 = 4.54 mol; H 9.1 ÷ 1.01 = 9.0 mol; O 36.4 ÷ 16.00 = 2.28 mol. Divide by 2.28: C 1.99, H 3.95, O 1.00 → C₂H₄O.
        (b) Empirical formula mass = 2(12.01) + 4(1.01) + 16.00 = 44.06 g/mol. 88.1 ÷ 44.06 = 2.00, so the molecular formula is C₄H₈O₂.
        (c) Both compounds have the same empirical formula, C₂H₄O. Percent composition depends only on the ratio of atoms, so any whole-number multiple of that ratio (C₂H₄O, C₄H₈O₂) has identical percentages; the molar mass is what distinguishes them.
      explanation: |
        Three points, one per part.

        (a) 1 pt: moles of each element computed and the ratio reduced to C₂H₄O (accept small rounding differences in the intermediate values).

        (b) 1 pt: empirical formula mass about 44.1 g/mol, multiplier 2, molecular formula C₄H₈O₂. Consistent use of an incorrect (a) earns the point if the method is right.

        (c) 1 pt: states that identical atom ratios give identical mass percentages, so compounds sharing an empirical formula are indistinguishable by composition alone and need the molar mass.

    - slug: apchem-u01-w02-q23
      type: short_answer
      topic_code: "1.4"
      source: "general knowledge"
      points: 3
      prompt: |
        A student wants to find the mass percent of sodium chloride in a mixture of NaCl and sand. Answer (a), (b) and (c).

        (a) Describe a procedure, naming the measurements that must be made, that would allow the student to determine the mass percent of NaCl.
        (b) The student uses a 6.00 g sample and recovers 4.26 g of dry sand. Calculate the mass percent of NaCl.
        (c) The student forgets to dry the sand fully before weighing it. State whether the reported mass percent of NaCl will be too high or too low, and explain why.
      answer: |
        (a) Weigh the mixture. Stir it with enough water to dissolve all the NaCl, filter to collect the sand, rinse the sand with a little water to remove dissolved salt, dry it to constant mass and weigh it. The NaCl mass is the original mass minus the sand mass (or evaporate the filtrate and weigh the NaCl directly).
        (b) NaCl = 6.00 − 4.26 = 1.74 g; 1.74 ÷ 6.00 × 100 = 29.0%.
        (c) Too low. Wet sand weighs more than dry sand, so the sand mass is too large, the difference attributed to NaCl is too small, and the percentage is below the true value.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a workable gravimetric procedure that includes weighing the mixture, dissolving the salt, filtering, drying and weighing the sand (or evaporating and weighing the salt). Zero if the salt is not separated from the sand by dissolving.

        (b) 1 pt: 29.0% (accept 29%).

        (c) 1 pt: too low, with the reasoning that extra water inflates the sand mass and so deflates the mass assigned to NaCl. Zero for the correct direction with no explanation.

    # ---- Long answer
    - slug: apchem-u01-w02-q24
      type: long_answer
      topic_code: "1.4"
      source: "general knowledge"
      points: 6
      stimulus: |
        A commercial "bath salt" is claimed to be pure Epsom salt, magnesium sulfate heptahydrate, MgSO₄·7H₂O (246.51 g/mol; anhydrous MgSO₄ 120.37 g/mol; H₂O 18.02 g/mol). A student tests the claim by heating a 3.000 g sample to constant mass and obtains 1.820 g of residue.
      prompt: |
        (a) Calculate the theoretical mass percent of water in pure MgSO₄·7H₂O.
        (b) Calculate the mass percent of water in the student's sample from the experimental data.
        (c) Does the evidence support the claim that the product is pure MgSO₄·7H₂O? Justify your answer using your results from (a) and (b).
        (d) Assuming the only impurity is an anhydrous salt that loses no mass on heating, calculate the mass percent of MgSO₄·7H₂O in the product.
        (e) Describe one experimental error that could cause the measured percent water to be lower than the true value even for a pure sample, and explain its effect.
      answer: |
        (a) Water in one mole: 7(18.02) = 126.14 g. 126.14 ÷ 246.51 × 100 = 51.2%.

        (b) Water lost = 3.000 − 1.820 = 1.180 g. 1.180 ÷ 3.000 × 100 = 39.3%.

        (c) No. A pure heptahydrate would lose 51.2% of its mass as water; the sample lost only 39.3%. The gap is far larger than experimental uncertainty, so part of the sample must be material that does not lose water, meaning the product is not pure MgSO₄·7H₂O.

        (d) Let m be the mass of MgSO₄·7H₂O in the 3.000 g sample. The water lost comes only from the hydrate: 0.5117 × m = 1.180 g, so m = 2.306 g. Mass percent of hydrate = 2.306 ÷ 3.000 × 100 = 76.9%.

        (e) Heating for too short a time leaves water in the residue, so the residue mass is too high, the mass lost is too low, and the computed percent water is below the true value. (Also acceptable: the residue absorbing moisture from the air while cooling before weighing, which likewise raises the residue mass.)
      explanation: |
        Six points.

        (a) 1 pt: 51.2% (accept 51.1–51.2) with the calculation shown.

        (b) 1 pt: 39.3% from the mass difference over the original sample mass.

        (c) 1 pt: concludes the sample is not pure and justifies by comparing the two percentages, noting that a lower water percentage implies non-hydrate material.

        (d) 2 pts: 1 pt for setting the water lost equal to 0.512 × (mass of hydrate); 1 pt for 2.31 g and 76.9% (accept 76.5–77.2%). A student who instead computes the mass of impurity (0.694 g, 23.1%) and reports 76.9% hydrate earns full credit.

        (e) 1 pt: a specific error (incomplete heating, residue reabsorbing moisture, sample spattering is NOT acceptable because it would raise the apparent loss) with its effect traced through to a lower percent water.
