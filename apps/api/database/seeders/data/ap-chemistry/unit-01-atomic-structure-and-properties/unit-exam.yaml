  - slug: apchem-u01-exam-q33
    type: fill_blank
    topic_code: "1.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Of the period-3 elements Na through Ar, the one with the largest atomic radius is ____.
    answer: ["sodium", "Na"]
