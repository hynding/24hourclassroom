  # ---- Short answer
  - slug: apchem-u01-exam-q38
    type: short_answer
    topic_code: "1.6"
    source: "general knowledge"
    points: 3
    stimulus: |
      Graph description: Two photoelectron spectra are shown. Spectrum 1 has peaks at 11.5 MJ/mol (relative height 2) and 0.90 MJ/mol (height 2). Spectrum 2 has peaks at 19.3 MJ/mol (height 2), 1.36 MJ/mol (height 2) and 0.80 MJ/mol (height 1).
    prompt: |
      Answer (a), (b) and (c).

      (a) Identify the elements that produced spectrum 1 and spectrum 2, and write the electron configuration of each.
      (b) Explain why the lowest-energy peak in spectrum 2 (0.80 MJ/mol) lies at a lower binding energy than the lowest-energy peak in spectrum 1 (0.90 MJ/mol), even though the element in spectrum 2 has the larger nuclear charge.
      (c) Explain why the 1s peak shifts from 11.5 MJ/mol in spectrum 1 to 19.3 MJ/mol in spectrum 2.
    answer: |
      (a) Spectrum 1: 2 + 2 = 4 electrons, beryllium, 1s² 2s². Spectrum 2: 2 + 2 + 1 = 5 electrons, boron, 1s² 2s² 2p¹.
      (b) Beryllium's outermost electron is in the 2s subshell; boron's is in the 2p subshell, which is slightly higher in energy and is partly shielded by the filled 2s pair. The 2p electron is therefore easier to remove despite boron's extra proton, which is the same reason boron's first ionization energy (801 kJ/mol) is below beryllium's (900 kJ/mol).
      (c) The 1s electrons are not shielded by anything and sit at nearly the same distance in both atoms. Boron's nucleus has five protons to beryllium's four, so by Coulomb's law the 1s electrons are attracted more strongly and need more energy to remove.
    explanation: |
      Three points, one per part.

      (a) 1 pt: both elements and both configurations correct (Be and B).

      (b) 1 pt: identifies the 2s versus 2p subshell difference and the shielding of 2p by 2s (or the higher energy of 2p) as the reason.

      (c) 1 pt: cites the larger nuclear charge acting on unshielded 1s electrons at a similar distance.

  - slug: apchem-u01-exam-q39
    type: short_answer
    topic_code: "1.8"
    source: "general knowledge"
    points: 3
    prompt: |
      Potassium chloride and calcium sulfide both crystallise in the same lattice structure. The ionic radii are K⁺ 138 pm, Cl⁻ 181 pm, Ca²⁺ 100 pm and S²⁻ 184 pm. Answer (a), (b) and (c).

      (a) Write the electron configuration of each of the four ions and state what they have in common.
      (b) Predict which compound, KCl or CaS, has the higher melting point and justify your prediction with Coulomb's law.
      (c) Explain why K⁺ is smaller than Cl⁻ even though both ions have the same number of electrons.
    answer: |
      (a) All four are 1s² 2s² 2p⁶ 3s² 3p⁶ ([Ar]); they are isoelectronic, each with 18 electrons.
      (b) CaS. Its ions carry 2+ and 2− charges, so the product of the charges is four times that in KCl (1+ and 1−), and the distance between ion centres is similar (100 + 184 = 284 pm against 138 + 181 = 319 pm, actually shorter). Both factors in Coulomb's law make the attraction in CaS stronger, so more energy is needed to melt it (CaS about 2525 °C; KCl 771 °C).
      (c) K⁺ has 19 protons attracting its 18 electrons while Cl⁻ has only 17. The stronger nuclear attraction in K⁺ pulls the same electron cloud closer, making it the smaller ion.
    explanation: |
      Three points, one per part.

      (a) 1 pt: the argon configuration for all four and the word isoelectronic (or "same number of electrons").

      (b) 1 pt: CaS with the charge-product argument (and optionally the shorter distance). Zero for CaS justified only by "calcium is heavier".

      (c) 1 pt: more protons in K⁺ acting on the same number of electrons.

  # ---- Long answer
  - slug: apchem-u01-exam-q40
    type: long_answer
    topic_code: "1.4"
    source: "general knowledge"
    points: 6
    stimulus: |
      A student is given a white powder that is a mixture of sodium chloride (NaCl, 58.44 g/mol) and sodium carbonate (Na₂CO₃, 105.99 g/mol) and must determine its composition. The student dissolves a 2.000 g sample of the powder in water and adds excess calcium chloride solution, which precipitates all of the carbonate as calcium carbonate (CaCO₃, 100.09 g/mol) and leaves the chloride in solution. The precipitate is filtered, dried to constant mass and weighed: 0.944 g of CaCO₃.
    prompt: |
      (a) Calculate the number of moles of CaCO₃ collected and explain why this equals the number of moles of Na₂CO₃ in the original sample.
      (b) Calculate the mass percent of Na₂CO₃ in the powder.
      (c) Calculate the mass percent of NaCl in the powder and the number of moles of NaCl in the 2.000 g sample.
      (d) The student forgot to dry the precipitate completely. State whether the reported mass percent of Na₂CO₃ would be too high or too low and explain.
      (e) Explain, at the particulate level, why dissolving the sample in water and adding calcium chloride can separate the two sodium salts even though both are soluble in water.
    answer: |
      (a) 0.944 g ÷ 100.09 g/mol = 0.009432 mol CaCO₃ ≈ 9.43 × 10⁻³ mol. Each formula unit of Na₂CO₃ supplies one carbonate ion, and every carbonate ion ends up in one formula unit of CaCO₃ (calcium chloride is in excess), so mol Na₂CO₃ = mol CaCO₃ = 9.43 × 10⁻³ mol.

      (b) Mass of Na₂CO₃ = 9.43 × 10⁻³ mol × 105.99 g/mol = 0.9997 g ≈ 1.000 g. Mass percent = 1.000 ÷ 2.000 × 100 = 50.0%.

      (c) Mass of NaCl = 2.000 − 1.000 = 1.000 g, so 50.0% NaCl. Moles of NaCl = 1.000 ÷ 58.44 = 0.01711 mol.

      (d) Too high. Residual water makes the precipitate weigh more than the CaCO₃ alone, so the calculated moles of carbonate, the mass of Na₂CO₃ and its percentage are all inflated.

      (e) In solution both salts are dissociated into ions: Na⁺, Cl⁻ and CO₃²⁻ moving independently among water molecules. Adding Ca²⁺ ions creates a combination, Ca²⁺ with CO₃²⁻, whose lattice attraction is strong enough that the ions come out of solution as solid CaCO₃, while Ca²⁺ with Cl⁻ and Na⁺ with either anion stay dissolved. The carbonate is removed selectively because only one of the possible ion pairings forms an insoluble solid.
    explanation: |
      Six points.

      (a) 1 pt: 9.43 × 10⁻³ mol (accept 9.4 × 10⁻³) and the one-to-one carbonate argument with calcium chloride in excess.

      (b) 1 pt: 1.00 g and 50.0% (accept 49.9–50.1%).

      (c) 1 pt: 50.0% NaCl and 0.0171 mol.

      (d) 1 pt: too high, with the explanation that water adds to the precipitate mass.

      (e) 2 pts: 1 pt for describing both salts as dissociated ions in solution; 1 pt for explaining that only the Ca²⁺/CO₃²⁻ pairing forms an insoluble solid, so carbonate is removed while chloride remains in solution.
