unit: 1
description: |
  40 questions · about 75 minutes · every topic of Unit 1 (1.1 to 1.8): moles and molar mass, mass spectra,
  composition of pure substances and mixtures, electron configuration, photoelectron spectroscopy, periodic trends,
  and ionic compounds. Three data-based sets in the AP style (a mass spectrum, a hydrate analysis and a
  photoelectron spectrum), select-all, true/false, fill-in-the-blank and numeric items, two short-answer questions
  (3 points each) and one long free-response question (6 points). Multiple choice, select-all, true/false and
  numeric items are graded at once; fill-in-the-blank items are matched automatically; the free-response items are
  graded by your teacher against the scoring notes. Calculator and periodic table allowed.
questions:
  # ---- Stimulus set A: mass spectrum of silicon (1.2, 1.1)
  - slug: apchem-u01-exam-q01
    type: multiple_choice
    topic_code: "1.2"
    source: "NIST Atomic Weights and Isotopic Compositions"
    points: 1
    stimulus: |
      Graph description: The mass spectrum of a pure element shows three peaks. At m/z = 28 the relative abundance is 92.2%; at m/z = 29 it is 4.7%; at m/z = 30 it is 3.1%.
    prompt: |
      The element is most likely
    options:
      - "aluminum"
      - "nickel"
      - "silicon"
      - "phosphorus"
    option_explanations:
      - |
        Aluminum has a single stable isotope, ²⁷Al, so its spectrum would show one peak at m/z = 27.
      - |
        Nickel's isotopes are at m/z 58, 60, 61, 62 and 64, twice the masses shown here.
      - |
        Correct. (0.922)(28) + (0.047)(29) + (0.031)(30) = 25.82 + 1.36 + 0.93 = 28.11, matching silicon's atomic mass of 28.09.
      - |
        Phosphorus has one stable isotope, ³¹P; its spectrum is a single peak at m/z = 31.
    answer: 2
    explanation: |
      Weighted average of peak positions by peak heights, then match to the periodic table.

  - slug: apchem-u01-exam-q02
    type: multiple_choice
    topic_code: "1.2"
    source: "NIST Atomic Weights and Isotopic Compositions"
    points: 1
    stimulus: |
      Graph description: The mass spectrum of a pure element shows three peaks. At m/z = 28 the relative abundance is 92.2%; at m/z = 29 it is 4.7%; at m/z = 30 it is 3.1%.
    prompt: |
      Which statement about the three kinds of atoms represented in the spectrum is correct?
    options:
      - "They have different numbers of protons and so belong to different elements."
      - "They have the same number of protons and electrons but different numbers of neutrons."
      - "They have the same mass but different charges."
      - "They have different electron configurations, which is why they separate in the spectrometer."
    option_explanations:
      - |
        All three peaks come from one pure element, so the atoms share one proton number; they are isotopes.
      - |
        Correct. Isotopes of one element have identical proton (and, as neutral atoms, electron) counts and differ only in neutrons: 14, 15 and 16 for ²⁸Si, ²⁹Si and ³⁰Si.
      - |
        The ions all carry a 1+ charge in a standard spectrum; they differ in mass, which is why they appear at different m/z.
      - |
        Isotopes have the same electron configuration; the spectrometer separates them by mass, not by electrons.
    answer: 1
    explanation: |
      Isotope = same element, different neutron count, different mass.

  - slug: apchem-u01-exam-q03
    type: multiple_choice
    topic_code: "1.1"
    source: "NIST Atomic Weights and Isotopic Compositions"
    points: 1
    stimulus: |
      Graph description: The mass spectrum of a pure element shows three peaks. At m/z = 28 the relative abundance is 92.2%; at m/z = 29 it is 4.7%; at m/z = 30 it is 3.1%.
    prompt: |
      A 5.62 g sample of this element contains approximately how many atoms? (Use the average atomic mass from the spectrum, about 28.1 g/mol.)
    options:
      - "1.20 × 10²³"
      - "3.38 × 10²⁴"
      - "6.02 × 10²³"
      - "2.00 × 10²²"
    option_explanations:
      - |
        Correct. 5.62 g ÷ 28.1 g/mol = 0.200 mol; 0.200 mol × 6.022 × 10²³ = 1.20 × 10²³ atoms.
      - |
        3.38 × 10²⁴ multiplies the mass in grams directly by Avogadro's number, skipping the conversion to moles.
      - |
        6.02 × 10²³ would be a full mole, 28.1 g of the element; the sample is only a fifth of that.
      - |
        2.00 × 10²² treats 0.200 mol as 0.0332 mol; check the division: 5.62 ÷ 28.1 = 0.200, not 0.0332.
    answer: 0
    explanation: |
      Grams → moles → atoms, two steps.

  # ---- Multiple choice (1.1, 1.3, 1.4)
  - slug: apchem-u01-exam-q04
    type: multiple_choice
    topic_code: "1.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following contains the greatest mass?
    options:
      - "1.0 mol of H₂O (18.02 g/mol)"
      - "2.0 mol of He (4.00 g/mol)"
      - "3.0 × 10²³ molecules of N₂ (28.02 g/mol)"
      - "0.50 mol of CO₂ (44.01 g/mol)"
    option_explanations:
      - |
        1.0 mol × 18.02 g/mol = 18.0 g, less than the CO₂ sample.
      - |
        2.0 mol × 4.00 g/mol = 8.0 g, the smallest mass.
      - |
        3.0 × 10²³ molecules is 0.50 mol; 0.50 × 28.02 = 14.0 g.
      - |
        Correct. 0.50 mol × 44.01 g/mol = 22.0 g, the largest mass of the four.
    answer: 3
    explanation: |
      Convert every option to grams before comparing; a large mole count of a light substance can weigh little.

  - slug: apchem-u01-exam-q05
    type: multiple_choice
    topic_code: "1.3"
    source: "general knowledge"
    points: 1
    prompt: |
      A compound is 85.6% carbon and 14.4% hydrogen by mass. Its empirical formula is (C 12.01, H 1.01)
    options:
      - "CH"
      - "CH₃"
      - "C₂H₅"
      - "CH₂"
    option_explanations:
      - |
        CH would be 92.3% carbon, as in benzene; this sample has less carbon.
      - |
        CH₃ would be 79.9% carbon; the ratio here is 1 : 2, not 1 : 3.
      - |
        C₂H₅ is 82.7% carbon and has a ratio of 1 : 2.5, not the 1 : 2 found from the data.
      - |
        Correct. 85.6 ÷ 12.01 = 7.13 mol C; 14.4 ÷ 1.01 = 14.3 mol H; 14.3 ÷ 7.13 = 2.0, so CH₂ (as in ethene or cyclohexane).
    answer: 3
    explanation: |
      Percent → grams → moles → simplest ratio.

  - slug: apchem-u01-exam-q06
    type: multiple_choice
    topic_code: "1.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following best explains why a pure compound has a fixed percent composition, while a solution of the same compound in water does not?
    options:
      - "A compound's atoms are bonded in a fixed ratio, so its mass ratio is fixed; a solution can contain any proportion of solute and solvent."
      - "Compounds are always solids, whereas solutions are liquids with variable density."
      - "The compound's atoms are heavier than the water molecules, so they settle to the bottom of the solution."
      - "A solution is a compound of the solute with water, whose formula depends on the temperature."
    option_explanations:
      - |
        Correct. Definite proportions follow from a fixed formula; a solution is a mixture, so its composition is whatever was mixed.
      - |
        Many pure compounds are liquids or gases; state of matter has nothing to do with definite proportions.
      - |
        Settling does not occur in a true solution, and density does not explain composition.
      - |
        Dissolving does not form a new compound with a formula; the solute and solvent keep their identities in a mixture.
    answer: 0
    explanation: |
      Pure substance: fixed formula, fixed composition. Mixture: variable composition.

  - slug: apchem-u01-exam-q07
    type: multiple_choice
    topic_code: "1.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Combustion of 0.360 g of a compound containing only carbon and hydrogen produces 1.100 g of CO₂ and 0.540 g of H₂O. Which calculation correctly gives the moles of hydrogen in the sample?
    options:
      - "0.540 ÷ 18.02"
      - "2 × (0.540 ÷ 18.02)"
      - "0.540 ÷ 1.01"
      - "2 × (1.100 ÷ 44.01)"
    option_explanations:
      - |
        0.540 ÷ 18.02 = 0.0300 mol of water molecules, but each water molecule contains two hydrogen atoms.
      - |
        Correct. 0.0300 mol H₂O × 2 H per molecule = 0.0600 mol H. (With 0.0250 mol C from the CO₂, the ratio is 1 : 2.4, giving C₅H₁₂.)
      - |
        Dividing the mass of water by the atomic mass of hydrogen treats the water as if it were pure hydrogen.
      - |
        1.100 ÷ 44.01 is the moles of CO₂ and hence of carbon (0.0250 mol); doubling it confuses the two oxygens in CO₂ with hydrogen and gives no information about H at all.
    answer: 1
    explanation: |
      mol H = 2 × mol H₂O. Mass-by-difference is used for oxygen, which is not measured directly.

  # ---- Stimulus set B: hydrate analysis (1.4, 1.1, 1.3)
  - slug: apchem-u01-exam-q08
    type: multiple_choice
    topic_code: "1.4"
    source: "general knowledge"
    points: 1
    stimulus: |
      A student heats a 2.443 g sample of hydrated barium chloride, BaCl₂·xH₂O, to constant mass and obtains 2.083 g of anhydrous BaCl₂. Molar masses: BaCl₂ 208.23 g/mol; H₂O 18.02 g/mol.
    prompt: |
      What is the value of x in the formula of the hydrate?
    options:
      - "1"
      - "6"
      - "4"
      - "2"
    option_explanations:
      - |
        x = 1 would mean 0.0100 mol of water, 0.180 g, half the measured loss of 0.360 g.
      - |
        x = 6 would require a loss of 1.08 g, far beyond the 0.360 g measured.
      - |
        x = 4 would require 0.0400 mol of water, a loss of 0.721 g, double what was observed.
      - |
        Correct. Water lost = 0.360 g = 0.0200 mol; BaCl₂ = 2.083 ÷ 208.23 = 0.0100 mol; ratio 2.00, so BaCl₂·2H₂O.
    answer: 3
    explanation: |
      Moles of water over moles of anhydrous salt.

  - slug: apchem-u01-exam-q09
    type: multiple_choice
    topic_code: "1.4"
    source: "general knowledge"
    points: 1
    stimulus: |
      A student heats a 2.443 g sample of hydrated barium chloride, BaCl₂·xH₂O, to constant mass and obtains 2.083 g of anhydrous BaCl₂. Molar masses: BaCl₂ 208.23 g/mol; H₂O 18.02 g/mol.
    prompt: |
      If the student had stopped heating before all the water was removed, how would the calculated value of x compare with the true value?
    options:
      - "Too large, because the mass of residue would be too small."
      - "Too large, because the water lost would be too great."
      - "Too small, because the mass lost would be too small and the residue mass too large."
      - "Unchanged, because the ratio of water to salt in the sample is fixed."
    option_explanations:
      - |
        Incomplete heating leaves water behind, making the residue heavier, not lighter.
      - |
        Stopping early reduces, not increases, the mass of water driven off.
      - |
        Correct. Less water lost (numerator too small) and a heavier residue counted as salt (denominator too large) both push the calculated x below the true value.
      - |
        The ratio in the sample is fixed, but the measurement of it depends on removing all the water; an incomplete measurement gives the wrong ratio.
    answer: 2
    explanation: |
      Trace each measured quantity through the formula x = (water ÷ 18.02) ÷ (residue ÷ 208.23).

  - slug: apchem-u01-exam-q10
    type: multiple_choice
    topic_code: "1.3"
    source: "general knowledge"
    points: 1
    stimulus: |
      A student heats a 2.443 g sample of hydrated barium chloride, BaCl₂·xH₂O, to constant mass and obtains 2.083 g of anhydrous BaCl₂. Molar masses: BaCl₂ 208.23 g/mol; H₂O 18.02 g/mol.
    prompt: |
      The mass percent of chlorine in the anhydrous BaCl₂ residue is closest to
    options:
      - "17.0%"
      - "34.0%"
      - "66.0%"
      - "29.0%"
    option_explanations:
      - |
        17.0% counts only one chlorine atom (35.45 ÷ 208.23); the formula has two.
      - |
        Correct. 2(35.45) ÷ 208.23 × 100 = 70.90 ÷ 208.23 × 100 = 34.0%.
      - |
        66.0% is the mass percent of barium (137.33 ÷ 208.23), the complement of the chlorine percentage.
      - |
        29.0% is the mass percent of chlorine in the hydrate (70.90 ÷ 244.27), not in the anhydrous residue the question asks about.
    answer: 1
    explanation: |
      Mass percent from the formula; count every atom of the element.

  # ---- Multiple choice (1.5, 1.6)
  - slug: apchem-u01-exam-q11
    type: multiple_choice
    topic_code: "1.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Which is the ground-state electron configuration of a selenium atom (Z = 34)?
    options:
      - "[Ar] 4s² 4p⁴"
      - "[Ar] 4s² 3d¹⁰ 4p⁴"
      - "[Ar] 4s² 3d¹⁰ 4p⁶"
      - "[Ar] 3d¹⁰ 4p⁶"
    option_explanations:
      - |
        This skips the 3d subshell entirely and accounts for only 24 electrons.
      - |
        Correct. 18 (argon) + 2 + 10 + 4 = 34 electrons; selenium is in group 16, period 4, with six valence electrons (4s² 4p⁴).
      - |
        [Ar] 4s² 3d¹⁰ 4p⁶ is krypton (36 electrons), or the Se²⁻ ion.
      - |
        This has 34 electrons but leaves the 4s subshell empty, which never happens in a ground-state neutral atom.
    answer: 1
    explanation: |
      Fill 4s, then 3d, then 4p; group 16 means four p electrons.

  - slug: apchem-u01-exam-q12
    type: multiple_choice
    topic_code: "1.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Which species has the greatest number of unpaired electrons?
    options:
      - "Mn²⁺ (Z = 25)"
      - "Fe²⁺ (Z = 26)"
      - "Zn²⁺ (Z = 30)"
      - "Ni²⁺ (Z = 28)"
    option_explanations:
      - |
        Correct. Mn²⁺ is [Ar] 3d⁵: five electrons in five d orbitals, all unpaired by Hund's rule.
      - |
        Fe²⁺ is [Ar] 3d⁶: four unpaired (one orbital holds a pair).
      - |
        Zn²⁺ is [Ar] 3d¹⁰: a full subshell with no unpaired electrons.
      - |
        Ni²⁺ is [Ar] 3d⁸: two unpaired electrons.
    answer: 0
    explanation: |
      Remove 4s electrons, then apply Hund's rule to the 3d subshell.

  - slug: apchem-u01-exam-q13
    type: multiple_choice
    topic_code: "1.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Which statement correctly describes the effective nuclear charge experienced by the valence electron of a potassium atom compared with that of a sodium atom?
    options:
      - "It is about the same for both, because potassium's extra protons are almost completely shielded by its extra core electrons."
      - "It is much larger for potassium because potassium has eight more protons."
      - "It is smaller for potassium because potassium has more electrons."
      - "It is zero for both because each has a single valence electron."
    option_explanations:
      - |
        Correct. Z_eff ≈ protons − core electrons: for Na, 11 − 10 = +1; for K, 19 − 18 = +1. The trend down group 1 comes from distance, not from Z_eff.
      - |
        The eight extra protons are matched by eight extra core electrons (the 3s and 3p of the argon core), which shield them.
      - |
        The extra electrons are core electrons that shield, bringing Z_eff down to about +1, the same as sodium's, not below it.
      - |
        Z_eff is never zero; the valence electron always feels a net positive attraction, otherwise it would not be bound.
    answer: 0
    explanation: |
      Down a group Z_eff on the valence electron stays about constant; the added shell increases distance.

  - slug: apchem-u01-exam-q14
    type: multiple_choice
    topic_code: "1.6"
    source: "general knowledge"
    points: 1
    prompt: |
      Graph description: A photoelectron spectrum shows peaks at 1.72 MJ/mol (relative height 2) and 1.09 MJ/mol (relative height 2), and a single peak far to the high-energy side at 28.6 MJ/mol (relative height 2). Which element is it?
    options:
      - "beryllium"
      - "boron"
      - "carbon"
      - "oxygen"
    option_explanations:
      - |
        Beryllium has only two peaks (1s², 2s²) and four electrons.
      - |
        Boron has three peaks with heights 2, 2, 1 (five electrons); the lowest-energy peak here has height 2.
      - |
        Correct. Heights 2 + 2 + 2 = 6 electrons: carbon, 1s² 2s² 2p². The 2p peak of height 2 at 1.09 MJ/mol is the partly filled valence subshell.
      - |
        Oxygen has eight electrons and a 2p peak of height 4.
    answer: 2
    explanation: |
      Sum of heights gives Z; the peak pattern gives the configuration.

  - slug: apchem-u01-exam-q15
    type: multiple_choice
    topic_code: "1.6"
    source: "general knowledge"
    points: 1
    prompt: |
      The 1s binding energy of fluorine (67.2 MJ/mol) is greater than that of oxygen (52.6 MJ/mol). The best explanation is that
    options:
      - "fluorine's 1s electrons are shielded by more core electrons."
      - "fluorine has more valence electrons, which hold the 1s electrons in place."
      - "fluorine has a larger nuclear charge acting on 1s electrons at about the same distance from the nucleus."
      - "fluorine's 1s electrons are in a higher energy level than oxygen's."
    option_explanations:
      - |
        1s electrons have no inner electrons to shield them in either atom.
      - |
        Outer electrons do not hold inner electrons; if anything they slightly repel them.
      - |
        Correct. Nine protons versus eight, with the 1s electrons at nearly the same tiny distance: Coulomb's law gives a stronger attraction and a higher binding energy.
      - |
        Both are n = 1; the shell is the same, and a higher level would mean a lower binding energy anyway.
    answer: 2
    explanation: |
      Core binding energies rise across a period with nuclear charge.

  - slug: apchem-u01-exam-q16
    type: multiple_choice
    topic_code: "1.6"
    source: "general knowledge"
    points: 1
    prompt: |
      In a photoelectron experiment, electrons are ejected by photons of fixed energy. An electron from the 1s subshell leaves with less kinetic energy than an electron from the 2p subshell because
    options:
      - "the 1s electron absorbs less of the photon's energy."
      - "the 1s electron was more tightly bound, so more of the photon's energy was used to free it."
      - "the 1s electron is heavier."
      - "the 2p electron is struck by two photons."
    option_explanations:
      - |
        Each ejected electron absorbs one whole photon; the energy absorbed is the same for every electron.
      - |
        Correct. Kinetic energy = photon energy − binding energy; the 1s electron has the larger binding energy, so less energy is left over as kinetic energy.
      - |
        All electrons have the same mass; the difference is in binding energy, not mass.
      - |
        One photon ejects one electron; the difference in kinetic energy reflects how tightly each was held.
    answer: 1
    explanation: |
      PES works backwards from measured kinetic energy to binding energy.

  # ---- Multiple choice (1.7, 1.8)
  - slug: apchem-u01-exam-q17
    type: multiple_choice
    topic_code: "1.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Which lists the atoms in order of increasing first ionization energy?
    options:
      - "Ar < Cl < S < P"
      - "F < O < N < C"
      - "Li < Na < K < Rb"
      - "K < Na < Li < He"
    option_explanations:
      - |
        This is decreasing order across period 3 (apart from the P/S reversal); argon has the highest ionization energy of the four.
      - |
        This is decreasing across period 2 (F highest), except that O < N; the list runs the wrong way.
      - |
        This is decreasing order; the valence electron is farther out and more shielded for each heavier alkali metal.
      - |
        Correct. Down group 1 ionization energy falls (Rb < K < Na < Li), so K < Na < Li is increasing, and helium (2372 kJ/mol) is the highest of all elements.
    answer: 3
    explanation: |
      Ionization energy falls down a group and rises across a period; helium tops the table.

  - slug: apchem-u01-exam-q18
    type: multiple_choice
    topic_code: "1.7"
    source: "general knowledge"
    points: 1
    prompt: |
      An element has the following successive ionization energies (kJ/mol): 1012, 1907, 2914, 4964, 6274, 21267. In which group of the periodic table is the element?
    options:
      - "Group 13"
      - "Group 14"
      - "Group 15"
      - "Group 16"
    option_explanations:
      - |
        A group 13 element would show its large jump after the third ionization energy; here the first five rise smoothly.
      - |
        A group 14 element's jump would come after IE₄; 4964 to 6274 is not a large jump.
      - |
        Correct. The jump from 6274 to 21267 (more than three-fold) comes after the fifth ionization, so five valence electrons: group 15 (the data are phosphorus's).
      - |
        Group 16 would need six smoothly rising values before the jump; the sixth value is the jump itself.
    answer: 2
    explanation: |
      Count the ionization energies before the first large jump.

  - slug: apchem-u01-exam-q19
    type: multiple_choice
    topic_code: "1.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following has the largest radius?
    options:
      - "Cl⁻"
      - "K⁺"
      - "Ar"
      - "S²⁻"
    option_explanations:
      - |
        Cl⁻ (18 electrons, 17 protons) is larger than Ar and K⁺ but smaller than S²⁻, which has one proton fewer.
      - |
        K⁺ has 19 protons holding 18 electrons, the tightest grip of the four, so it is the smallest.
      - |
        Neutral argon (18 protons, 18 electrons) sits between the cation and the anions in size.
      - |
        Correct. All four are isoelectronic with 18 electrons; S²⁻ has only 16 protons, the weakest attraction, so its electron cloud is the most spread out (184 pm).
    answer: 3
    explanation: |
      Isoelectronic series: fewest protons, largest radius.

  - slug: apchem-u01-exam-q20
    type: multiple_choice
    topic_code: "1.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Which pair of elements would be expected to have the most similar chemical properties?
    options:
      - "Na and Mg"
      - "Cl and Ar"
      - "O and S"
      - "N and O"
    option_explanations:
      - |
        Sodium (group 1) and magnesium (group 2) differ in valence electron count and form ions of different charge.
      - |
        Chlorine is a reactive halogen; argon is an inert noble gas.
      - |
        Correct. Oxygen and sulfur are both in group 16 with the ns² np⁴ valence configuration; both form 2− ions and compounds such as H₂O and H₂S.
      - |
        Nitrogen and oxygen are neighbours in a period with five and six valence electrons respectively.
    answer: 2
    explanation: |
      Same group, same valence configuration, similar chemistry.

  - slug: apchem-u01-exam-q21
    type: multiple_choice
    topic_code: "1.8"
    source: "general knowledge"
    points: 1
    prompt: |
      Which formula is correct for the compound of iron(III) ions and sulfate ions?
    options:
      - "Fe₂(SO₄)₃"
      - "FeSO₄"
      - "Fe₃(SO₄)₂"
      - "Fe(SO₄)₃"
    option_explanations:
      - |
        Correct. Two Fe³⁺ (6+) balance three SO₄²⁻ (6−): Fe₂(SO₄)₃.
      - |
        FeSO₄ is iron(II) sulfate: a 2+ cation with one 2− anion.
      - |
        Fe₃(SO₄)₂ has 9+ against 4−, far from neutral.
      - |
        Fe(SO₄)₃ has 3+ against 6−, a net charge of 3−.
    answer: 0
    explanation: |
      The Roman numeral gives the cation charge; balance with the anion.

  - slug: apchem-u01-exam-q22
    type: multiple_choice
    topic_code: "1.8"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following ionic compounds would be expected to have the highest melting point?
    options:
      - "KBr"
      - "NaCl"
      - "CaO"
      - "KCl"
    option_explanations:
      - |
        KBr has 1+/1− ions that are both large; it has the lowest melting point here (734 °C).
      - |
        NaCl has 1+/1− ions; it melts at 801 °C, below any 2+/2− compound.
      - |
        Correct. Ca²⁺ and O²⁻ give a charge product of 4, four times that of the 1+/1− salts, and the ions are relatively small; CaO melts at about 2613 °C.
      - |
        KCl is 1+/1− with a larger cation than NaCl; it melts at 771 °C.
    answer: 2
    explanation: |
      Charge magnitude dominates lattice energy; then ion size.

  - slug: apchem-u01-exam-q23
    type: multiple_choice
    topic_code: "1.8"
    source: "general knowledge"
    points: 1
    prompt: |
      Which statement best explains why aluminum forms Al³⁺ but not Al⁴⁺ in its compounds?
    options:
      - "Aluminum has only three electrons in total."
      - "The fourth ionization removes an electron from the neon core, which requires far more energy than any chemical process can supply."
      - "Al⁴⁺ would be larger than Al³⁺ and would not fit in a lattice."
      - "Aluminum's fourth electron has the wrong spin to be removed."
    option_explanations:
      - |
        Aluminum has 13 electrons; three of them are valence electrons.
      - |
        Correct. After the three n = 3 electrons are gone, the next electron is a 2p core electron (IE₄ = 11577 kJ/mol, over four times IE₃); the energy cost is not repaid by lattice formation.
      - |
        A more highly charged cation would be smaller, not larger; size is not the reason.
      - |
        Spin plays no role in which electrons are removed; the shell does.
    answer: 1
    explanation: |
      Ionic charges stop at the noble-gas core because of the ionization-energy jump.

  - slug: apchem-u01-exam-q24
    type: multiple_choice
    topic_code: "1.1"
    source: "general knowledge"
    points: 1
    prompt: |
      One molecule of a compound has a mass of 1.50 × 10⁻²² g. The molar mass of the compound is closest to
    options:
      - "90.3 g/mol"
      - "2.49 × 10⁻⁴⁶ g/mol"
      - "150 g/mol"
      - "4.01 × 10⁴⁵ g/mol"
    option_explanations:
      - |
        Correct. Molar mass = mass of one molecule × Avogadro's number = 1.50 × 10⁻²² g × 6.022 × 10²³ mol⁻¹ = 90.3 g/mol.
      - |
        Dividing the molecular mass by Avogadro's number goes the wrong way and gives an absurdly small number.
      - |
        150 g/mol ignores the exponents; the mass of one molecule must be scaled by the number of molecules in a mole.
      - |
        This multiplies by the exponent as if 10⁻²² were 10⁺²²; a molar mass of 10⁴⁵ g/mol is impossible.
    answer: 0
    explanation: |
      Mass of one particle × N_A = molar mass; molar mass ÷ N_A = mass of one particle.

  # ---- Multi-select
  - slug: apchem-u01-exam-q25
    type: multi_select
    topic_code: "1.2"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Copper has two stable isotopes, ⁶³Cu (62.93 u, 69.2%) and ⁶⁵Cu (64.93 u, 30.8%). Which statements are correct? Select all that apply.
    options:
      - "The average atomic mass of copper is closer to 63 than to 65."
      - "A mass spectrum of copper shows two peaks with a height ratio of about 69 : 31."
      - "Every copper atom has a mass of 63.55 u."
      - "The two isotopes have different numbers of neutrons: 34 and 36."
      - "The isotope ⁶⁵Cu has a larger first ionization energy because it is heavier."
    option_explanations:
      - |
        Correct. The weighted average, 63.55, lies nearer the more abundant lighter isotope.
      - |
        Correct. Two isotopes, two peaks; heights track the 69.2 : 30.8 abundances.
      - |
        No atom has the average mass; each is about 62.93 or 64.93 u.
      - |
        Correct. Copper has 29 protons; 63 − 29 = 34 and 65 − 29 = 36 neutrons.
      - |
        Ionization energy depends on nuclear charge and configuration, identical for both isotopes.
    answer: [0, 1, 3]
    explanation: |
      Isotopes differ in mass only; averages are weighted; spectra count atoms.

  - slug: apchem-u01-exam-q26
    type: multi_select
    topic_code: "1.5"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which of the following statements about electron configurations are correct? Select all that apply.
    options:
      - "The ground-state configuration of Cu is [Ar] 4s¹ 3d¹⁰."
      - "A nitrogen atom has three unpaired electrons."
      - "The 2s subshell is higher in energy than the 2p subshell in a many-electron atom."
      - "Ca²⁺, Cl⁻ and Ar are isoelectronic."
      - "When Fe forms Fe²⁺, two 3d electrons are removed."
    option_explanations:
      - |
        Correct. Copper is one of the two tested exceptions, with a filled 3d subshell.
      - |
        Correct. 2p³ with one electron per orbital by Hund's rule.
      - |
        The 2s is lower in energy than 2p because s electrons penetrate closer to the nucleus and are less shielded.
      - |
        Correct. Each has 18 electrons and the configuration 1s² 2s² 2p⁶ 3s² 3p⁶.
      - |
        The two 4s electrons are removed first; Fe²⁺ is [Ar] 3d⁶.
    answer: [0, 1, 3]
    explanation: |
      Aufbau, Hund, the exceptions, isoelectronic species, and the 4s-first rule for cations.

  - slug: apchem-u01-exam-q27
    type: multi_select
    topic_code: "1.7"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which of the following are consequences of the increase in effective nuclear charge across period 2 from lithium to fluorine? Select all that apply.
    options:
      - "Atomic radius decreases from Li to F."
      - "First ionization energy generally increases from Li to F."
      - "Electronegativity increases from Li to F."
      - "The number of occupied shells increases from Li to F."
      - "The 1s binding energy measured by PES increases from Li to F."
    option_explanations:
      - |
        Correct. Larger Z_eff pulls the n = 2 electrons closer.
      - |
        Correct. More tightly held valence electrons take more energy to remove (with the dips at B and O).
      - |
        Correct. A larger Z_eff attracts bonding electrons more strongly.
      - |
        Every period-2 element has exactly two occupied shells; the shell count does not change across a period.
      - |
        Correct. The 1s electrons feel the full, growing nuclear charge, so their binding energy rises steadily (6.26 to 67.2 MJ/mol).
    answer: [0, 1, 2, 4]
    explanation: |
      Across a period, the shell stays the same while nuclear charge grows.

  # ---- True / false
  - slug: apchem-u01-exam-q28
    type: true_false
    topic_code: "1.1"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: 1.00 mol of O₂ and 1.00 mol of O₃ contain the same number of oxygen atoms.
    answer: false
    explanation: |
      False. Equal moles means equal numbers of molecules, but each O₃ molecule has three atoms to O₂'s two: 2.00 mol of atoms versus 3.00 mol. Always ask "a mole of what?".

  - slug: apchem-u01-exam-q29
    type: true_false
    topic_code: "1.6"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: In a photoelectron spectrum, a peak of height 6 must represent the valence electrons of the atom.
    answer: false
    explanation: |
      False. Height counts electrons, so a height of 6 is any full p subshell, which for argon or potassium includes core 2p and 3p subshells. The valence peak is identified by its position (lowest binding energy), not its height.

  - slug: apchem-u01-exam-q30
    type: true_false
    topic_code: "1.8"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: Elements in the same group form ions with the same charge because they have the same number of valence electrons.
    answer: true
    explanation: |
      True. Group 1 elements (ns¹) all form 1+ ions, group 2 (ns²) 2+, group 17 (ns² np⁵) 1−. Same valence configuration, same electrons lost or gained, same charge, same compound formulas (NaCl, KCl, RbCl).

  # ---- Fill in the blank
  - slug: apchem-u01-exam-q31
