week: 3
unit: 1
title: "Electron Configuration and Photoelectron Spectroscopy"
topics: ["1.5", "1.6"]
guide: guides/week-03.md
guide_description: |
  Coulomb's law and the shell model, the three rules that fill subshells (Aufbau, Pauli, Hund), configurations of
  atoms and ions including the chromium and copper exceptions, shielding and effective nuclear charge, and then
  photoelectron spectroscopy as the experiment that justifies the model: one peak per subshell, position as binding
  energy, height as electron count. Worked examples: sulfur's orbital diagram, iron's ions, identifying sodium and
  chlorine from their spectra, and converting MJ/mol to joules per electron.
flashcards_description: |
  30 cards on Coulomb's law, shells and subshells, the filling rules, configurations of atoms and ions, shielding,
  effective nuclear charge and reading a photoelectron spectrum.

flashcards:
  - front: Coulomb's law → what two things set the attraction between nucleus and electron
    back: |
      The size of the charges (more protons, stronger pull) and the distance between them (closer, stronger pull; force ∝ q₁q₂/r²). Every trend in ionization energy and atomic size is an application of this one law.
    topic_code: "1.5"
  - front: Shell model of the atom → what a shell is and how its energy changes with n
    back: |
      A shell is the set of electrons with the same principal quantum number n, at roughly the same average distance from the nucleus. Energy rises with n: n = 1 is lowest and closest, n = 2 next, and so on.
    topic_code: "1.5"
  - front: Subshell capacities → s, p, d, f
    back: |
      s holds 2 electrons (one orbital), p holds 6 (three orbitals), d holds 10 (five orbitals), f holds 14 (seven orbitals). Each orbital holds at most two electrons of opposite spin.
    topic_code: "1.5"
  - front: Aufbau filling order → the sequence through period 4
    back: |
      1s 2s 2p 3s 3p 4s 3d 4p. The 4s fills before 3d in neutral atoms because it is slightly lower in energy while 3d is empty; 3d then fills across the first transition series.
    topic_code: "1.5"
  - front: Pauli exclusion principle → the limit it sets
    back: |
      An orbital holds at most two electrons, and those two must have opposite spins. This is why subshell capacities are 2, 6, 10, 14: twice the number of orbitals.
    topic_code: "1.5"
  - front: Hund's rule → how electrons spread over a p subshell
    back: |
      Electrons occupy the orbitals of a subshell one at a time with parallel spins before any orbital gets a second electron. Nitrogen's 2p³ is ↑ ↑ ↑, three unpaired electrons, not ↑↓ ↑ _.
    topic_code: "1.5"
  - front: Sulfur's electron configuration and number of unpaired electrons
    back: |
      1s² 2s² 2p⁶ 3s² 3p⁴, or [Ne] 3s² 3p⁴. The four 3p electrons sit as one pair and two singles (↑↓ ↑ ↑), so sulfur has two unpaired electrons.
    topic_code: "1.5"
  - front: Noble-gas shorthand → how to write it and what the symbol stands for
    back: |
      Replace the core electrons with the symbol of the preceding noble gas in brackets, then write the rest: Ca is [Ar] 4s². The bracketed symbol stands for all the core electrons; the electrons after it are the valence electrons.
    topic_code: "1.5"
  - front: Chromium and copper → the two configuration exceptions
    back: |
      Cr is [Ar] 4s¹ 3d⁵ and Cu is [Ar] 4s¹ 3d¹⁰, not 4s² 3d⁴ and 4s² 3d⁹. A half-filled or filled d subshell is slightly more stable than the plain Aufbau prediction. These are the only exceptions AP tests.
    topic_code: "1.5"
  - front: Transition-metal cations → which electrons leave first
    back: |
      The 4s electrons, before any 3d. Fe is [Ar] 4s² 3d⁶; Fe²⁺ is [Ar] 3d⁶; Fe³⁺ is [Ar] 3d⁵. Once 3d is occupied, 4s is the outermost and highest-energy subshell.
    topic_code: "1.5"
  - front: Isoelectronic species → definition and how to rank their sizes
    back: |
      Atoms or ions with the same number of electrons, such as O²⁻, F⁻, Ne, Na⁺ and Mg²⁺ (10 electrons each). With identical electron counts, the species with more protons pulls the cloud in harder and is smaller: Mg²⁺ < Na⁺ < Ne < F⁻ < O²⁻.
    topic_code: "1.5"
  - front: Shielding → what inner electrons do to outer ones
    back: |
      Inner (core) electrons sit between the nucleus and the outer electrons and repel them, cancelling part of the nuclear attraction. The more core electrons between an electron and the nucleus, the weaker the net pull it feels.
    topic_code: "1.5"
  - front: Effective nuclear charge Z_eff → the rough estimate and how it changes across a period
    back: |
      Z_eff ≈ number of protons − number of core electrons. Across a period the core stays the same while protons increase, so Z_eff on the valence electrons rises: about +1 for Na, +2 for Mg, up to +7 for Cl.
    topic_code: "1.5"
  - front: Why the 2s subshell is lower in energy than 2p in a many-electron atom
    back: |
      An s electron spends more time close to the nucleus (it penetrates the core more), so it is less shielded and feels a larger Z_eff than a p electron in the same shell. Hence 2s is held more tightly than 2p.
    topic_code: "1.5"
  - front: Valence electrons vs core electrons → which count for bonding
    back: |
      Valence electrons are in the outermost shell (plus a partly filled d subshell for transition metals) and take part in bonding; core electrons are inner-shell electrons that do not. Chlorine, [Ne] 3s² 3p⁵, has 7 valence and 10 core electrons.
    topic_code: "1.5"
  - front: Photoelectron spectroscopy → what the experiment measures
    back: |
      High-energy photons eject electrons from gaseous atoms; the instrument measures the ejected electrons' kinetic energies. Binding energy = photon energy − kinetic energy, so the spectrum records how tightly every electron in the atom was held.
    topic_code: "1.6"
  - front: PES peak position → what it tells you
    back: |
      The binding energy (ionization energy) of the electrons in one subshell, usually in MJ/mol. The 1s peak is always at the highest energy; outer subshells appear at progressively lower energies.
    topic_code: "1.6"
  - front: PES peak height → what it tells you
    back: |
      The number of electrons in that subshell, relative to the other peaks. A full p subshell gives a peak three times the height of a full s subshell (6 electrons to 2). Adding all the heights gives the atom's electron count.
    topic_code: "1.6"
  - front: Neon's photoelectron spectrum → the three peaks and what they show
    back: |
      1s at 84.0 MJ/mol (height 2), 2s at 4.68 MJ/mol (height 2), 2p at 2.08 MJ/mol (height 6). Two tightly held electrons far from eight loosely held ones is the n = 1 and n = 2 shells made visible; the 2s/2p split shows subshells.
    topic_code: "1.6"
  - front: Identifying an element from its PES → the routine
    back: |
      Count the peaks (subshells), add the heights (electrons, which equals Z for a neutral atom), check the 2, 2, 6, 2, 6 pattern and the falling energies, then name the element and write its configuration from the peaks.
    topic_code: "1.6"
  - front: Sodium's PES → why one peak is so far to the low-energy side
    back: |
      Peaks at 104, 6.84, 3.67 and 0.50 MJ/mol with heights 2, 2, 6, 1. The 0.50 MJ/mol peak of height 1 is the lone 3s electron, shielded by ten core electrons and far from the nucleus, which is why sodium ionizes so easily.
    topic_code: "1.6"
  - front: Comparing 1s peaks of Li (6.26) and Be (11.5 MJ/mol) → why Be is higher
    back: |
      Both 1s subshells hold two electrons at about the same distance, but beryllium has four protons to lithium's three. Larger nuclear charge means stronger Coulombic attraction, so every peak of an element moves to higher energy than the same peak of the element before it.
    topic_code: "1.6"
  - front: Oxygen's 2p peak (1.31) lower than nitrogen's (1.40 MJ/mol) → why
    back: |
      Oxygen's fourth 2p electron must pair in an orbital already holding one; the electron–electron repulsion in that pair makes the electron slightly easier to remove, outweighing oxygen's extra proton. A dip after a half-filled p subshell.
    topic_code: "1.6"
  - front: Converting a binding energy in MJ/mol to joules per electron
    back: |
      Multiply by 10⁶ to get J/mol, then divide by Avogadro's number. Neon 2p: 2.08 × 10⁶ J/mol ÷ 6.022 × 10²³ mol⁻¹ = 3.45 × 10⁻¹⁸ J per electron.
    topic_code: "1.6"
  - front: PES as evidence for the shell model → the argument in two sentences
    back: |
      If all electrons were at one energy, there would be one peak; instead there are groups of peaks separated by huge energy gaps (84 vs 4.68 MJ/mol in neon), showing distinct shells. Within a group, the small s/p splitting and the 2:6 height ratio show subshells with the predicted capacities.
    topic_code: "1.6"
  - front: Kinetic energy of a photoelectron → the relation to photon and binding energy
    back: |
      KE of the ejected electron = photon energy − binding energy. A more tightly bound electron leaves with less kinetic energy for the same photon; the instrument works backwards from KE to binding energy.
    topic_code: "1.6"
  - front: Which PES peak is tallest? → the trap
    back: |
      Not the outermost. The tallest peak is any full p subshell (height 6), which for argon means both 2p and 3p. Height counts electrons; position marks energy. Do not read the tallest peak as the valence shell.
    topic_code: "1.6"
  - front: Number of PES peaks for an element → how to predict it
    back: |
      One per occupied subshell. Argon (1s² 2s² 2p⁶ 3s² 3p⁶) gives five; potassium gives six (adds 4s¹); scandium gives seven (adds 3d¹). The count is the number of distinct subshells, not shells.
    topic_code: "1.6"
  - front: Error-spotting → an orbital diagram with 2p drawn as ↑↓ ↑ _ for nitrogen
    back: |
      Violates Hund's rule. The three 2p electrons must occupy three separate orbitals with parallel spins (↑ ↑ ↑) before any pairing. Nitrogen's three unpaired electrons are confirmed by its magnetism.
    topic_code: "1.5"
  - front: Which practice? Using a PES spectrum to argue for the shell model
    back: |
      Practice 4 (model analysis) and practice 6 (argumentation): the data (peak energies and heights) are evidence; the claim is that electrons occupy shells and subshells; the reasoning connects large energy gaps to shells and the 2:6 ratio to subshell capacity.
    topic_code: "1.6"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 1.5 and 1.6: electron configuration and
    photoelectron spectroscopy), with about a third reviewing weeks 1 and 2. Multiple choice, select-all, true/false
    and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and
    the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: an unknown PES (1.6, 1.5)
    - slug: apchem-u01-w03-q01
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        Graph description: The photoelectron spectrum of a neutral element shows four peaks. Reading from the high-energy end: a peak at 126 MJ/mol of relative height 2; a peak at 9.07 MJ/mol of relative height 2; a peak at 5.31 MJ/mol of relative height 6; and a peak at 0.74 MJ/mol of relative height 2.
      prompt: |
        The element whose spectrum is shown is
      options:
        - "sodium"
        - "magnesium"
        - "neon"
        - "aluminum"
      option_explanations:
        - |
          Sodium has 11 electrons and its last peak (3s¹) has height 1, not 2; the heights here total 12.
        - |
          Correct. Heights 2 + 2 + 6 + 2 = 12 electrons, so Z = 12: magnesium, 1s² 2s² 2p⁶ 3s². The low-energy peak of height 2 is the 3s pair.
        - |
          Neon has only three peaks (1s, 2s, 2p) and 10 electrons; there is no fourth, low-energy peak.
        - |
          Aluminum has 13 electrons and five peaks, including a 3p peak of height 1 at about 0.58 MJ/mol, which is absent.
      answer: 1
      explanation: |
        Add the peak heights to get the electron count; for a neutral atom that is the atomic number.

    - slug: apchem-u01-w03-q02
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        Graph description: The photoelectron spectrum of a neutral element shows four peaks. Reading from the high-energy end: a peak at 126 MJ/mol of relative height 2; a peak at 9.07 MJ/mol of relative height 2; a peak at 5.31 MJ/mol of relative height 6; and a peak at 0.74 MJ/mol of relative height 2.
      prompt: |
        Which statement best explains why the peak at 126 MJ/mol is at a much higher energy than the peak at 9.07 MJ/mol?
      options:
        - "The 126 MJ/mol peak represents electrons in the n = 1 shell, which are closest to the nucleus and not shielded by any inner electrons."
        - "The 126 MJ/mol peak represents more electrons, and more electrons require more energy to remove."
        - "The 126 MJ/mol peak represents the valence electrons, which are involved in bonding and therefore held most tightly."
        - "The two peaks represent the same electrons measured with photons of different energies."
      option_explanations:
        - |
          Correct. The 1s electrons sit nearest the nucleus and feel its full charge; by Coulomb's law they are bound far more tightly than the n = 2 electrons, which are farther out and shielded by the 1s pair.
        - |
          Both peaks have height 2, so they represent the same number of electrons; height has nothing to do with position anyway.
        - |
          Valence electrons are the outermost and most loosely held; they produce the lowest-energy peak, here the one at 0.74 MJ/mol.
        - |
          Binding energy is a property of the electron's subshell, not of the photon; different peaks are different subshells.
      answer: 0
      explanation: |
        Distance and shielding: core electrons are near an unshielded nucleus, so their binding energy is enormous.

    - slug: apchem-u01-w03-q03
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        Graph description: The photoelectron spectrum of a neutral element shows four peaks. Reading from the high-energy end: a peak at 126 MJ/mol of relative height 2; a peak at 9.07 MJ/mol of relative height 2; a peak at 5.31 MJ/mol of relative height 6; and a peak at 0.74 MJ/mol of relative height 2.
      prompt: |
        If this element loses two electrons to form a 2+ ion, which peak disappears from the spectrum, and what is the ion's electron configuration?
      options:
        - "The 5.31 MJ/mol peak shrinks to height 4; configuration 1s² 2s² 2p⁴ 3s²"
        - "The 126 MJ/mol peak disappears; configuration 2s² 2p⁶ 3s²"
        - "The 0.74 MJ/mol peak disappears; configuration 1s² 2s² 2p⁶"
        - "The 9.07 MJ/mol peak disappears; configuration 1s² 2p⁶ 3s²"
      option_explanations:
        - |
          Electrons are removed from the highest-energy, most loosely bound subshell, not from the middle of the 2p.
        - |
          The 1s electrons are the most tightly bound in the atom and are never removed in ordinary ion formation.
        - |
          Correct. The two valence 3s electrons (binding energy 0.74 MJ/mol) are lost, leaving Mg²⁺ with the neon configuration 1s² 2s² 2p⁶.
        - |
          The 2s electrons are core electrons; removing them would take about 9 MJ/mol each, far more than forming a simple cation.
      answer: 2
      explanation: |
        Ions form by losing the most loosely bound electrons; the lowest-energy PES peak is the one that vanishes.

    # ---- Multiple choice (1.5)
    - slug: apchem-u01-w03-q04
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Which is the ground-state electron configuration of a chromium atom (Z = 24)?
      options:
        - "[Ar] 4s² 3d⁴"
        - "[Ar] 4s¹ 3d⁵"
        - "[Ar] 3d⁶"
        - "[Ar] 4s² 4p⁴"
      option_explanations:
        - |
          This is the plain Aufbau prediction, but chromium is one of the two tested exceptions: a half-filled d⁵ is favoured.
        - |
          Correct. Chromium promotes one 4s electron to give 4s¹ 3d⁵, with both subshells half-filled, which is slightly more stable.
        - |
          [Ar] 3d⁶ has 24 electrons but leaves 4s empty in a neutral atom, which never happens in the ground state; it is also not a real exception.
        - |
          The 4p subshell does not begin to fill until after 3d is complete (gallium, Z = 31).
      answer: 1
      explanation: |
        Cr ([Ar] 4s¹ 3d⁵) and Cu ([Ar] 4s¹ 3d¹⁰) are the exceptions to memorise.

    - slug: apchem-u01-w03-q05
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        How many unpaired electrons are there in a ground-state phosphorus atom (Z = 15)?
      options:
        - "1"
        - "5"
        - "0"
        - "3"
      option_explanations:
        - |
          One unpaired electron would require pairing two of the 3p electrons, which violates Hund's rule.
        - |
          Phosphorus has five valence electrons, but the two 3s electrons are paired; only the 3p electrons are unpaired.
        - |
          Zero unpaired would require all three 3p electrons to be paired, impossible with an odd number in three orbitals.
        - |
          Correct. [Ne] 3s² 3p³; by Hund's rule the three 3p electrons occupy three separate orbitals with parallel spins: ↑ ↑ ↑.
      answer: 3
      explanation: |
        Hund's rule: singly occupy every orbital of a subshell before pairing.

    - slug: apchem-u01-w03-q06
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following species has the electron configuration [Ar] 3d⁵?
      options:
        - "Mn (Z = 25)"
        - "Fe³⁺ (Z = 26)"
        - "Cr (Z = 24)"
        - "V²⁺ (Z = 23)"
      option_explanations:
        - |
          Neutral manganese is [Ar] 4s² 3d⁵; it has two 4s electrons as well as the five 3d.
        - |
          Correct. Iron is [Ar] 4s² 3d⁶; removing three electrons takes both 4s and one 3d, leaving [Ar] 3d⁵.
        - |
          Chromium is [Ar] 4s¹ 3d⁵ as a neutral atom; it keeps one 4s electron.
        - |
          V²⁺ has 21 electrons: [Ar] 3d³, after losing vanadium's two 4s electrons.
      answer: 1
      explanation: |
        Transition metals lose 4s electrons first; count carefully for 3+ ions.

    - slug: apchem-u01-w03-q07
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        The first ionization energy of magnesium (738 kJ/mol) is greater than that of sodium (496 kJ/mol). Which statement best explains this using Coulomb's law?
      options:
        - "Magnesium's valence electrons are in a higher shell, farther from the nucleus."
        - "Magnesium has more core electrons, so its valence electrons are better shielded."
        - "Magnesium's 3s electrons experience a larger effective nuclear charge (about +2 versus +1) at a similar distance, so they are held more tightly."
        - "Magnesium has two valence electrons, and removing one of a pair always takes more energy than removing a single electron."
      option_explanations:
        - |
          Both elements have their valence electrons in the n = 3 shell; the shell does not change across a period.
        - |
          Both have the same ten core electrons (the neon core); shielding is the same, so it cannot explain the difference.
        - |
          Correct. Same shell, same core, one more proton: Z_eff rises from about +1 to +2, and a larger charge at a similar distance means a stronger Coulombic attraction and a higher ionization energy.
        - |
          Pairing usually makes an electron slightly easier to remove (repulsion), not harder; the dominant effect is the extra proton.
      answer: 2
      explanation: |
        Across a period: same shell, same shielding, more protons, higher Z_eff, higher ionization energy.

    - slug: apchem-u01-w03-q08
      type: multiple_choice
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Which list contains only species that are isoelectronic with argon?
      options:
        - "Cl⁻, K⁺, Ca²⁺, S²⁻"
        - "Cl⁻, K⁺, Na⁺, S²⁻"
        - "Cl, K, Ca, S"
        - "Cl⁻, K⁺, Ca²⁺, Sc"
      option_explanations:
        - |
          Correct. Cl⁻ (17 + 1), K⁺ (19 − 1), Ca²⁺ (20 − 2) and S²⁻ (16 + 2) each have 18 electrons, the argon configuration [Ne] 3s² 3p⁶.
        - |
          Na⁺ has 10 electrons (the neon configuration), not 18.
        - |
          The neutral atoms have 17, 19, 20 and 16 electrons; none has 18.
        - |
          Neutral scandium has 21 electrons; Sc³⁺ would be isoelectronic with argon, but Sc is not.
      answer: 0
      explanation: |
        Isoelectronic means the same number of electrons; count protons plus or minus the charge.

    - slug: apchem-u01-w03-q09
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        In a photoelectron spectrum, a 2p peak is three times as tall as the 2s peak of the same element. The best explanation is that
      options:
        - "2p electrons are three times as hard to remove as 2s electrons."
        - "the 2p subshell holds six electrons and the 2s subshell holds two, and peak height is proportional to the number of electrons."
        - "p orbitals are three times larger than s orbitals."
        - "the photons used eject 2p electrons three times more efficiently."
      option_explanations:
        - |
          Difficulty of removal is the peak's position on the energy axis, not its height; in fact 2p electrons are slightly easier to remove than 2s.
        - |
          Correct. A full 2p subshell has three orbitals holding six electrons; a 2s subshell holds two. The 3:1 height ratio is the 6:2 electron ratio.
        - |
          Orbital size is not what a spectrometer measures; the signal counts ejected electrons.
        - |
          The photon energy is the same for every electron in the sample; the height difference is in how many electrons there are to eject.
      answer: 1
      explanation: |
        Height counts electrons. The 2:6 pattern across a spectrum is the fingerprint of s and p subshells.

    # ---- Review (1.2, 1.3, 1.4)
    - slug: apchem-u01-w03-q10
      type: multiple_choice
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A mass spectrum and a photoelectron spectrum of the same element are compared. Which statement correctly contrasts the two?
      options:
        - "Both plot peak height against mass; the PES simply uses heavier ions."
        - "In the mass spectrum each peak is a subshell; in the PES each peak is an isotope."
        - "In both, peak height is proportional to energy."
        - "In the mass spectrum each peak is an isotope and its height is the isotope's abundance; in the PES each peak is a subshell and its height is the number of electrons in it."
      option_explanations:
        - |
          The PES x-axis is binding energy, not mass; the two experiments measure entirely different properties.
        - |
          This swaps the two: isotopes belong to the mass spectrum, subshells to the photoelectron spectrum.
        - |
          In neither spectrum does height measure energy; height counts particles (atoms or electrons) in both.
        - |
          Correct. Both spectra share the same reading logic (position is a property, height is a count), but the mass spectrum sorts atoms by mass while the PES sorts electrons by binding energy.
      answer: 3
      explanation: |
        Review of 1.2 against 1.6: the same reading skill applied to two different experiments.

    - slug: apchem-u01-w03-q11
      type: multiple_choice
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A compound is 42.9% carbon and 57.1% oxygen by mass. Its empirical formula is (C 12.01, O 16.00)
      options:
        - "CO₂"
        - "C₂O"
        - "CO"
        - "C₃O₄"
      option_explanations:
        - |
          CO₂ is 27.3% C; the sample has far more carbon by mass than that.
        - |
          C₂O would be 60.0% C by mass, above the measured 42.9%.
        - |
          Correct. 42.9 ÷ 12.01 = 3.57 mol C; 57.1 ÷ 16.00 = 3.57 mol O; a 1 : 1 ratio, so CO.
        - |
          C₃O₄ would be 36.0% C; the moles of C and O here are equal, giving a 1 : 1 ratio.
      answer: 2
      explanation: |
        Review of 1.3: percent to grams to moles to ratio.

    - slug: apchem-u01-w03-q12
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A student analyses three samples labelled as the same hydrate and finds that they contain 36.1%, 29.5% and 33.0% water by mass. Which conclusion is best supported?
      options:
        - "The hydrate has a variable number of water molecules per formula unit."
        - "The samples are all pure and the differences come from rounding."
        - "The three samples are different compounds with different formulas."
        - "At least two of the samples are not the pure hydrate; they are mixtures containing material that loses no water."
      option_explanations:
        - |
          A hydrate is a pure compound with a fixed formula; its water content cannot vary from sample to sample.
        - |
          Differences of several percentage points are far larger than rounding; pure samples of one compound give the same composition.
        - |
          The samples were labelled as the same hydrate; the simpler explanation is contamination or partial dehydration, which is also what the variable composition points to.
        - |
          Correct. Variable composition is the mark of a mixture; samples with less water than the pure hydrate's fixed value must contain something else (or be partly dehydrated).
      answer: 3
      explanation: |
        Review of 1.4: definite proportions for a pure compound, variable composition for a mixture.

    # ---- Multi-select
    - slug: apchem-u01-w03-q13
      type: multi_select
      topic_code: "1.5"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following electron configurations represent a ground-state atom or ion correctly? Select all that apply.
      options:
        - "Cu: [Ar] 4s¹ 3d¹⁰"
        - "Fe²⁺: [Ar] 4s² 3d⁴"
        - "Cl⁻: [Ne] 3s² 3p⁶"
        - "Ca: [Ar] 4s²"
        - "N: 1s² 2s² 2p³ with all three 2p electrons paired in one orbital"
      option_explanations:
        - |
          Correct. Copper is a tested exception: a filled 3d¹⁰ with a single 4s electron.
        - |
          Fe²⁺ loses its two 4s electrons, giving [Ar] 3d⁶; this option wrongly removes 3d electrons first.
        - |
          Correct. Chlorine gains one electron to complete the 3p subshell and match argon.
        - |
          Correct. Calcium has 20 electrons: the argon core plus two 4s electrons.
        - |
          Three electrons cannot occupy one orbital (Pauli limit is two), and Hund's rule spreads them over three orbitals anyway.
      answer: [0, 2, 3]
      explanation: |
        Check each against Aufbau, Pauli, Hund, the two exceptions, and the rule that 4s electrons leave first.

    - slug: apchem-u01-w03-q14
      type: multi_select
      topic_code: "1.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        A sample contains 0.100 mol of neon atoms. Which statements are correct? Select all that apply.
      options:
        - "The sample contains 6.02 × 10²² neon atoms."
        - "The sample contains 6.02 × 10²³ electrons."
        - "The sample has a mass of 2.02 g."
        - "The sample contains 1.00 mol of electrons."
        - "The sample contains 6.02 × 10²³ neon atoms."
      option_explanations:
        - |
          Correct. 0.100 mol × 6.022 × 10²³ mol⁻¹ = 6.02 × 10²² atoms.
        - |
          Correct. Each neon atom has 10 electrons, so 6.02 × 10²² atoms × 10 = 6.02 × 10²³ electrons.
        - |
          Correct. 0.100 mol × 20.18 g/mol = 2.02 g.
        - |
          Correct. 10 mol of electrons per mole of neon × 0.100 mol = 1.00 mol of electrons, the same count as option 2.
        - |
          6.02 × 10²³ atoms would be a full mole of neon; the sample is a tenth of that.
      answer: [0, 1, 2, 3]
      explanation: |
        Review of 1.1 with a twist: electrons can be counted in moles too, which is what MJ/mol binding energies refer to.

    # ---- True / false
    - slug: apchem-u01-w03-q15
      type: true_false
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: In the photoelectron spectrum of an element, the peak at the highest binding energy always corresponds to the 1s electrons.
      answer: true
      explanation: |
        True. The 1s electrons are closest to the nucleus and unshielded, so by Coulomb's law they are the most tightly bound electrons in any atom; their peak is always at the high-energy end of the spectrum.

    - slug: apchem-u01-w03-q16
      type: true_false
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: The empirical formula of a compound always has the same molar mass as its molecular formula.
      answer: false
      explanation: |
        False. The molecular formula is a whole-number multiple of the empirical formula, so its molar mass is that multiple of the empirical formula mass: CH₂O is 30.03 g/mol while C₆H₁₂O₆ is 180.18 g/mol. They coincide only when the multiplier is 1 (as for H₂O or CO₂).

    # ---- Fill in the blank
    - slug: apchem-u01-w03-q17
      type: fill_blank
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        The rule stating that electrons fill the orbitals of a subshell singly, with parallel spins, before any orbital receives a second electron is ____ rule.
      answer: ["Hund's", "Hund", "Hunds", "Hund's rule"]
      explanation: |
        Hund's rule maximises the number of unpaired electrons in a partly filled subshell, which is why nitrogen (2p³) has three unpaired electrons and oxygen (2p⁴) has two.

    - slug: apchem-u01-w03-q18
      type: fill_blank
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        An atom with 26 protons and 30 neutrons has a mass number of ____.
      answer: ["56"]
      explanation: |
        Mass number = protons + neutrons = 26 + 30 = 56. The atom is iron-56, the most abundant iron isotope; its electron count (26) is what sets the configuration [Ar] 4s² 3d⁶.

    # ---- Numeric
    - slug: apchem-u01-w03-q19
      type: numeric
      topic_code: "1.6"
      source: "NIST CODATA constants"
      points: 1
      prompt: |
        The binding energy of the 3s electron of sodium is 0.50 MJ/mol. Calculate the energy required to remove this electron from one sodium atom. Give your answer as the coefficient of 10⁻¹⁹ J to two decimal places (for example, enter 5.00 for 5.00 × 10⁻¹⁹ J).
      answer: { value: 8.30, tolerance: 0.05 }
      explanation: |
        0.50 × 10⁶ J/mol ÷ 6.022 × 10²³ mol⁻¹ = 8.30 × 10⁻¹⁹ J per electron. Enter 8.30. (Using 0.52 MJ/mol, the more precise tabulated value, gives 8.64 × 10⁻¹⁹ J.)

    - slug: apchem-u01-w03-q20
      type: numeric
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        In the photoelectron spectrum of a neutral atom, the peaks have relative heights 2, 2, 6, 2, 6, 2 and 3, listed from highest binding energy to lowest. What is the atomic number of the element? Give a whole number.
      answer: { value: 23, tolerance: 0 }
      explanation: |
        Sum of heights = 2 + 2 + 6 + 2 + 6 + 2 + 3 = 23 electrons, so Z = 23: vanadium, 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d³. The final peak of height 3 is the partly filled 3d subshell.

    - slug: apchem-u01-w03-q21
      type: numeric
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        A photoelectron experiment uses a sample of 0.250 g of argon gas (39.95 g/mol). How many moles of electrons does the sample contain? Give your answer in mol to three decimal places.
      answer: { value: 0.113, tolerance: 0.002 }
      explanation: |
        0.250 ÷ 39.95 = 0.006258 mol Ar. Each argon atom has 18 electrons, so 0.006258 × 18 = 0.113 mol of electrons. Review of 1.1: moles of a part from moles of the whole.

    # ---- Short answer
    - slug: apchem-u01-w03-q22
      type: short_answer
      topic_code: "1.6"
      source: "general knowledge"
      points: 3
      stimulus: |
        | Subshell | Binding energy, nitrogen (MJ/mol) | Binding energy, oxygen (MJ/mol) |
        |---|---|---|
        | 1s | 39.6 | 52.6 |
        | 2s | 2.45 | 3.12 |
        | 2p | 1.40 | 1.31 |

        Peak heights (relative): nitrogen 2, 2, 3; oxygen 2, 2, 4.
      prompt: |
        Use the table to answer (a), (b) and (c).

        (a) Explain why every peak of oxygen except the 2p lies at a higher binding energy than the corresponding peak of nitrogen.
        (b) Explain why the 2p peak of oxygen is at a slightly lower binding energy than the 2p peak of nitrogen, even though oxygen has the greater nuclear charge.
        (c) Describe the 2p orbital diagrams of nitrogen and oxygen and state the number of unpaired electrons in each atom.
      answer: |
        (a) Oxygen has eight protons to nitrogen's seven, and the electrons in each subshell are at about the same distance in the two atoms with the same shielding. By Coulomb's law the larger nuclear charge attracts each electron more strongly, so more energy is needed to remove it.
        (b) Nitrogen's three 2p electrons each occupy their own orbital (Hund's rule). Oxygen's fourth 2p electron must pair with one of them, and the repulsion between the two electrons sharing an orbital raises their energy and makes one of them slightly easier to remove, outweighing the extra proton.
        (c) Nitrogen 2p: ↑ ↑ ↑, three unpaired electrons. Oxygen 2p: ↑↓ ↑ ↑, two unpaired electrons.
      explanation: |
        Three points, one per part.

        (a) 1 pt: cites the larger nuclear charge (more protons) with similar distance/shielding, so stronger Coulombic attraction and higher binding energy. Zero for "oxygen has more electrons".

        (b) 1 pt: identifies electron pairing in one 2p orbital of oxygen and the resulting repulsion as the reason the electron is easier to remove.

        (c) 1 pt: both diagrams correct (three singles for N; one pair and two singles for O) and the counts 3 and 2.

    - slug: apchem-u01-w03-q23
      type: short_answer
      topic_code: "1.5"
      source: "general knowledge"
      points: 3
      prompt: |
        Consider the species K⁺ and Cl⁻. Answer (a), (b) and (c).

        (a) Write the complete ground-state electron configuration of each ion.
        (b) Which ion has the larger radius? Justify your answer in terms of nuclear charge and the electrons present.
        (c) Which ion would require more energy to have one electron removed? Explain using Coulomb's law.
      answer: |
        (a) Both are 1s² 2s² 2p⁶ 3s² 3p⁶ (18 electrons, the argon configuration).
        (b) Cl⁻. The two ions have identical electron configurations, but Cl⁻ has only 17 protons attracting its 18 electrons while K⁺ has 19. The weaker attraction in Cl⁻ lets its electron cloud spread out farther.
        (c) K⁺. Its 19 protons hold the same 18 electrons more tightly and at a shorter distance than Cl⁻'s 17 protons do, so by Coulomb's law the outermost electron of K⁺ is bound more strongly and needs more energy to remove.
      explanation: |
        Three points, one per part.

        (a) 1 pt: both configurations correct and identical (shorthand [Ar] accepted if the full configuration is also given or clearly implied).

        (b) 1 pt: chooses Cl⁻ and justifies with the smaller nuclear charge acting on the same number of electrons.

        (c) 1 pt: chooses K⁺ and links the greater nuclear charge (and smaller radius) to a stronger Coulombic attraction.

    # ---- Long answer
    - slug: apchem-u01-w03-q24
      type: long_answer
      topic_code: "1.6"
      source: "general knowledge"
      points: 6
      stimulus: |
        Graph description: The photoelectron spectrum of an unknown neutral element shows five peaks. From the high-energy end: 273 MJ/mol (relative height 2), 26.8 MJ/mol (height 2), 20.2 MJ/mol (height 6), 2.44 MJ/mol (height 2) and 1.25 MJ/mol (height 5).
      prompt: |
        (a) Identify the element and write its complete ground-state electron configuration. Explain how the spectrum supports your identification.
        (b) Explain why the spectrum shows five peaks rather than three, even though the atom has electrons in only three shells.
        (c) A second spectrum, of the element with one more proton, is recorded. Describe two specific ways it would differ from the spectrum shown.
        (d) The element shown forms a 1− ion. Predict how the photoelectron spectrum of the ion would differ from that of the neutral atom, and justify your prediction.
      answer: |
        (a) Heights 2 + 2 + 6 + 2 + 5 = 17 electrons, so the element is chlorine: 1s² 2s² 2p⁶ 3s² 3p⁵. The pattern 2, 2, 6, 2, 5 matches the subshell capacities filled in Aufbau order with the last subshell one electron short of full, and the energies fall from the 1s core (273 MJ/mol) to the loosely held 3p valence electrons (1.25 MJ/mol), exactly as the shell model predicts for a period-3 element.

        (b) Each peak is a subshell, not a shell. Within the n = 2 and n = 3 shells the s and p subshells differ in energy (2s electrons penetrate closer to the nucleus and are less shielded than 2p; likewise 3s and 3p), so each shell beyond the first produces two peaks: one shell gives 1s; the second gives 2s and 2p; the third gives 3s and 3p, five in all.

        (c) The element with Z = 18 is argon. Its spectrum would (1) show the final 3p peak with height 6 instead of 5, because the subshell is now full; and (2) have every peak shifted to a higher binding energy (1s about 309 MJ/mol, 3p about 1.52 MJ/mol), because the extra proton increases the nuclear charge acting on electrons in the same shells with the same shielding.

        (d) Cl⁻ has 18 electrons with the configuration 1s² 2s² 2p⁶ 3s² 3p⁶. Its spectrum would show the same five peaks, but the 3p peak would have height 6 instead of 5, and all peaks, especially the outer ones, would shift to slightly lower binding energies, because the added electron increases electron–electron repulsion and shielding while the nuclear charge is unchanged, so each electron is held a little less tightly.
      explanation: |
        Six points.

        (a) 2 pts: 1 pt for chlorine with the correct configuration; 1 pt for the justification (sum of heights = 17, the 2/2/6/2/5 pattern, and energies decreasing outward).

        (b) 1 pt: distinguishes subshells from shells and explains the s/p energy difference through penetration or shielding.

        (c) 1 pt: both differences stated: 3p height becomes 6, and all peaks move to higher binding energy because of the larger nuclear charge. One correct difference earns half credit only if the grader allows partial points; otherwise both are needed.

        (d) 2 pts: 1 pt for the 3p peak rising to height 6 with the configuration of Cl⁻; 1 pt for predicting lower binding energies with a reason (added repulsion and shielding, same nuclear charge).
