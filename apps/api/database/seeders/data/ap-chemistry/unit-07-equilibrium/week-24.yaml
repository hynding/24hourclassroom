        (b) Use the total pressure to find the equilibrium partial pressures of both gases.
        (c) Calculate Kp at 298 K.
      answer: |
        (a) Let y atm of N₂O₄ form. Initial: P(NO₂) = 1.00, P(N₂O₄) = 0. Change: −2y, +y. Equilibrium: 1.00 − 2y, y.
        (b) Total = (1.00 − 2y) + y = 1.00 − y = 0.74, so y = 0.26 atm. P(N₂O₄) = 0.26 atm; P(NO₂) = 1.00 − 0.52 = 0.48 atm.
        (c) Kp = P(N₂O₄)/P(NO₂)² = 0.26/(0.48)² = 0.26/0.230 = 1.1.
