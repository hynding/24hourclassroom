        Three points.

        (a) 1 pt: ICE table with −2y for NO₂ and +y for N₂O₄ (or equivalent with x = change in NO₂ and x/2 formed).
        (b) 1 pt: total pressure 1.00 − y = 0.74 giving 0.26 atm N₂O₄ and 0.48 atm NO₂.
        (c) 1 pt: Kp = 0.26/0.48² = 1.1 (accept 1.1–1.2).

    # ---- Long answer
    - slug: apchem-u07-w24-q23
      type: long_answer
      topic_code: "7.7"
      source: "general knowledge"
      points: 6
      prompt: |
        At 700 K, H₂(g) + I₂(g) ⇌ 2 HI(g) has Kc = 50. A 1.00 L flask is charged with 0.300 mol H₂ and 0.100 mol I₂ and held at 700 K until equilibrium is reached.
        (a) Construct an ICE table for the system, defining x.
        (b) Explain why the small-x approximation cannot be used here.
        (c) Show that the equilibrium condition leads to the quadratic 46x² − 20x + 1.5 = 0, and solve it.
        (d) Explain which root is physically meaningful.
        (e) State the equilibrium concentrations of all three gases and verify that they reproduce Kc = 50.
        (f) A different flask at 700 K contains [H₂] = 0.050 M, [I₂] = 0.050 M and [HI] = 0.400 M. Determine, with justification, the direction in which this mixture reacts.
      answer: |
        (a) Initial: [H₂] = 0.300 M, [I₂] = 0.100 M, [HI] = 0. Change: −x, −x, +2x. Equilibrium: 0.300 − x, 0.100 − x, 2x.
        (b) K = 50 is not small; the fraction of reactant consumed will be large (close to the limiting I₂'s full 0.100 M), so x is not negligible against 0.100 and dropping it would give a meaningless result.
        (c) (2x)²/((0.300 − x)(0.100 − x)) = 50 → 4x² = 50(0.0300 − 0.400x + x²) = 1.5 − 20x + 50x² → 46x² − 20x + 1.5 = 0. x = [20 ± √(400 − 276)]/92 = (20 ± 11.14)/92, so x = 0.0963 M or x = 0.338 M.
        (d) x = 0.338 M exceeds the 0.100 M of I₂ available and would make [I₂] negative; only x = 0.0963 M leaves every concentration positive.
        (e) [H₂] = 0.300 − 0.096 = 0.204 M; [I₂] = 0.100 − 0.096 = 0.0037 M; [HI] = 2(0.0963) = 0.193 M. Check: (0.193)²/(0.204 × 0.0037) = 0.0372/0.000755 ≈ 49–50, consistent with Kc = 50 within rounding.
        (f) Q = (0.400)²/(0.050 × 0.050) = 0.160/0.0025 = 64. Q > K (64 > 50), so the mixture holds too much HI; the reverse reaction proceeds, forming H₂ and I₂, until Q falls to 50.
      explanation: |
        Six points.

        (a) 1 pt: correct initial, change (−x, −x, +2x) and equilibrium rows.
        (b) 1 pt: K is not small / x comparable to the 0.100 M of I₂, so the approximation is invalid.
        (c) 1 pt: derivation of 46x² − 20x + 1.5 = 0 and both roots (0.096 and 0.338 M).
        (d) 1 pt: 0.338 M rejected because it exceeds [I₂]₀ (negative concentration); 0.0963 M kept.
        (e) 1 pt: [H₂] = 0.204 M, [I₂] = 0.0037 M, [HI] = 0.193 M with a check giving approximately 50.
        (f) 1 pt: Q = 64 > K, reverse direction, with the comparison stated.
