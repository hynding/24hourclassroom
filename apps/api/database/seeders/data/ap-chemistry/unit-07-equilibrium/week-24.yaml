        Phosgene decomposes: COCl₂(g) ⇌ CO(g) + Cl₂(g), with Kc = 2.2 × 10⁻¹⁰ at 373 K. A flask initially contains 0.120 M COCl₂ and no products.
        (a) Set up the ICE table and write the equilibrium-constant expression in terms of x.
