        Three points.

        (a) 1 pt: ICE rows with x defined and K = x²/(0.120 − x).
        (b) 1 pt: approximation stated and x = 5.1 × 10⁻⁶ M (accept 5.1–5.2 × 10⁻⁶).
        (c) 1 pt: 5% test shown (ratio far below 5%) and [COCl₂] = 0.120 M.

    - slug: apchem-u07-w24-q22
