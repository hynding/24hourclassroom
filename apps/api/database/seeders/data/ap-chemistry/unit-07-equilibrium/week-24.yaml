    # ---- True / false
    - slug: apchem-u07-w24-q14
      type: true_false
      topic_code: "6.9"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: when two reactions are added to give an overall reaction, the ΔH values of the steps are added to give the overall ΔH, and the K values of the steps are likewise added to give the overall K.
      answer: false
      explanation: |
        False. ΔH values add (Hess's law), because enthalpy is a state function and the step enthalpies sum. K values multiply, because K is a ratio of concentration terms and the intermediate's concentration cancels only when the mass-action expressions are multiplied: K₃ = K₁ × K₂.

