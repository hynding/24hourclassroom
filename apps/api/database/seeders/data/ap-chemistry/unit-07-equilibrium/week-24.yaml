week: 24
unit: 7
title: "The Size of K and Equilibrium Concentrations"
topics: ["7.5", "7.6", "7.7", "7.8"]
guide: guides/week-24.md
guide_description: |
  What the magnitude of K says about the composition of an equilibrium mixture; how K changes when an equation
  is reversed, multiplied or added to another; solving ICE tables for unknown concentrations with the small-x
  approximation (and the 5% check) or the quadratic formula; and reading particle diagrams, concentration–time
  graphs and bar charts as equilibrium representations. Worked examples for ammonia synthesis, a diprotic acid,
  H₂ + I₂, PCl₅ and N₂O₄.
flashcards_description: |
  28 cards on the meaning of large and small K, the algebra of K for manipulated equations, the small-x
  approximation and the quadratic route through an ICE table, and equilibrium representations.

flashcards:
  - front: What a very large K (above about 10³) says about the mixture
    back: |
      Products dominate at equilibrium: the limiting reactant is almost entirely consumed and only a trace remains. It says nothing about how fast equilibrium is reached.
    topic_code: "7.5"
  - front: What a very small K (below about 10⁻³) says about the mixture
    back: |
      Reactants dominate: the reaction barely proceeds and the reactant concentrations are nearly unchanged from their initial values. The small amount of product may still matter (trace NO in engines).
    topic_code: "7.5"
  - front: K between about 10⁻³ and 10³
    back: |
      Significant amounts of both reactants and products are present at equilibrium; the exact composition must be calculated with an ICE table rather than estimated.
    topic_code: "7.5"
  - front: Does a larger K mean a faster reaction?
    back: |
      No. K is a thermodynamic quantity describing the position of equilibrium; the rate is set by the activation energy and the rate constant k. H₂ + O₂ has K ≈ 10⁸⁰ at 25 °C yet reacts immeasurably slowly without a spark.
    topic_code: "7.5"
  - front: Estimating composition from a tiny K without an ICE table
    back: |
      For A ⇌ B + C with [A]₀ = 0.10 M and K = 1 × 10⁻⁶, x² ≈ K[A]₀ = 1 × 10⁻⁷, so x ≈ 3 × 10⁻⁴ M: about 0.3% of A reacts and [A] stays essentially 0.10 M.
    topic_code: "7.5"
  - front: Comparing K values for reactions with different coefficients
    back: |
      Only reactions written with comparable exponents can be compared by K alone, because K's units and size depend on the coefficients. Compare compositions, not just the numbers, when the stoichiometry differs.
    topic_code: "7.5"
  - front: K for the reverse reaction
    back: |
      K(reverse) = 1/K(forward). Reversing swaps numerator and denominator of the mass-action expression, so a reaction with K = 4.0 × 10¹² has K = 2.5 × 10⁻¹³ when written backwards.
    topic_code: "7.6"
  - front: K when every coefficient is multiplied by n
    back: |
      K' = Kⁿ, because each concentration's exponent is multiplied by n. Doubling the equation squares K; halving it takes the square root.
    topic_code: "7.6"
  - front: K for the sum of two reactions
    back: |
      K₃ = K₁ × K₂. The concentration factors of the intermediate cancel when the mass-action expressions are multiplied, exactly as ΔH values add in Hess's law.
    topic_code: "7.6"
  - front: K for a reaction obtained by subtracting one equation from another
    back: |
      Subtracting reaction 2 from reaction 1 is adding the reverse of 2, so K = K₁/K₂.
    topic_code: "7.6"
  - front: The only thing that changes the value of K
    back: |
      Temperature. Catalysts, concentration changes, volume changes and inert gases change Q (and so cause shifts) or change rates, but K at a given temperature is fixed.
    topic_code: "7.6"
  - front: Why K values multiply while ΔH values add
    back: |
      ΔH is a difference in a state function and sums over steps; K is a product of concentration ratios, so combining steps multiplies the ratios. Both follow from the same bookkeeping of species that cancel.
    topic_code: "7.6"
  - front: "Worked K manipulation for ammonia"
    back: |
      N₂ + 3 H₂ ⇌ 2 NH₃ has K = 0.50 at 400 °C. For 2 NH₃ ⇌ N₂ + 3 H₂, K = 1/0.50 = 2.0; for ½ N₂ + 3/2 H₂ ⇌ NH₃, K = √0.50 = 0.71.
    topic_code: "7.6"
  - front: Small-x approximation → statement
    back: |
      When K is very small relative to the initial concentration, the amount reacting x is negligible against that initial value: [A]₀ − x ≈ [A]₀. The x in the numerator (the product term) is never dropped.
    topic_code: "7.7"
  - front: The 5% rule for the small-x approximation
    back: |
      After solving with the approximation, divide x by the concentration it was dropped from. If the result is under 5% the approximation stands; if not, solve the quadratic (or iterate).
    topic_code: "7.7"
  - front: Rough test for when the approximation will work
    back: |
      If [A]₀/K is greater than about 400 (equivalently K is at least a few hundred times smaller than [A]₀) the approximation usually passes the 5% test for a reaction producing two particles from one.
    topic_code: "7.7"
  - front: Solving an ICE table when K is not small
    back: |
      Clear the denominator, collect terms into ax² + bx + c = 0, and apply x = [−b ± √(b² − 4ac)]/(2a). Keep the root that leaves every equilibrium concentration positive.
    topic_code: "7.7"
  - front: The square-root shortcut for a perfect-square ratio
    back: |
      For H₂ + I₂ ⇌ 2 HI with equal initial reactant concentrations, K = (2x)²/(c₀ − x)² is a perfect square: take √K = 2x/(c₀ − x) and solve the linear equation instead of the quadratic.
    topic_code: "7.7"
  - front: "Worked quadratic for PCl₅ decomposition"
    back: |
      K = 0.040, [PCl₅]₀ = 0.500 M. x² + 0.040x − 0.020 = 0 gives x = 0.123 M, so [PCl₅] = 0.377 M and [PCl₃] = [Cl₂] = 0.123 M. The approximation would give 0.141 M, 28% of 0.500, so it fails.
    topic_code: "7.7"
  - front: Handling a very large K in an ICE problem
    back: |
      Assume the limiting reactant reacts completely, write the resulting amounts as a new initial state, then let a small amount y run backwards and apply the small-y approximation to find the trace of reactant left.
    topic_code: "7.7"
  - front: ICE table when products are present initially
    back: |
      Compare Q with K first to find the direction, then write the change row with the signs that direction requires; the equilibrium row has non-zero starting values for products.
    topic_code: "7.7"
  - front: Choosing the right quadratic root
    back: |
      Reject any root that makes a concentration negative or that exceeds an initial concentration being consumed. Usually one root is physically impossible and the other is the answer.
    topic_code: "7.7"
  - front: Coefficient of 2 in an ICE table
    back: |
      A species with coefficient 2 changes by 2x and enters the K expression as (2x)² — both the 2 and the square are needed; omitting either is the most common algebra error.
    topic_code: "7.7"
  - front: Reading K from a particle diagram
    back: |
      Count the particles of each species in the box stated to be at equilibrium; treat the counts as concentrations (same volume), raise them to the coefficients and form the mass-action ratio.
    topic_code: "7.8"
  - front: Deciding which of several boxes is at equilibrium
    back: |
      Compute Q for each box from its counts and compare with K; the box whose Q equals K is the equilibrium mixture. Appearance (more product particles) is not a criterion.
    topic_code: "7.8"
  - front: Reading K from a concentration–time graph
    back: |
      Use the plateau values after all curves have flattened; the ratio of plateaus, with coefficients as exponents, is K. Check that the changes from the starting values obey the stoichiometric ratio.
    topic_code: "7.8"
  - front: Bar charts of initial and equilibrium concentrations
    back: |
      Reactant bars shrink and product bars grow by amounts in the coefficient ratio; a bar chart showing a shrinkage of 0.1 M for A and growth of 0.2 M for B fits A ⇌ 2 B.
    topic_code: "7.8"
  - front: Two boxes both labelled 'at equilibrium' at the same temperature
    back: |
      Their Q values must be equal, since both equal K. If the counts give different Q values, at least one box is not at equilibrium or the temperatures differ.
    topic_code: "7.8"

quiz:
  description: |
    23 questions · about 45 minutes · topics 7.5–7.8 (the magnitude of K, the properties of K for reversed,
    scaled and added reactions, calculating equilibrium concentrations by the small-x approximation or the
    quadratic formula, and representations of equilibrium), with review of Q versus K, ICE tables from data,
    Hess's law, rate laws of elementary steps and the ideal gas law. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: concentration–time graph for N₂O₄ (7.7, 7.8)
    - slug: apchem-u07-w24-q01
      type: multiple_choice
      topic_code: "7.8"
      source: "general knowledge"
      points: 1
      stimulus: |
        Graph description: concentration against time for N₂O₄(g) ⇌ 2 NO₂(g) in a sealed 1.0 L flask at 298 K. [N₂O₄] starts at 0.100 M and falls to a flat plateau of 0.071 M; [NO₂] starts at 0 and rises to a flat plateau of 0.057 M. Both curves become horizontal at the same time.
      prompt: |
        What is the value of Kc for the reaction as written at 298 K?
      options:
        - "0.80"
        - "22"
        - "0.023"
        - "0.046"
      option_explanations:
        - |
          0.80 is the simple ratio 0.057/0.071; it ignores the exponent of 2 on [NO₂] that the coefficient requires.
        - |
          22 is 1/0.046, the value of K for the reverse reaction 2 NO₂ ⇌ N₂O₄.
        - |
          0.023 is half of K; it comes from dividing 0.057 by 2 before squaring instead of squaring the plateau value itself.
        - |
          Correct. Kc = [NO₂]²/[N₂O₄] = (0.057)²/0.071 = 0.00325/0.071 = 0.046.
      answer: 3
      explanation: |
        Practice 5. Plateau values are equilibrium concentrations; the coefficient 2 becomes an exponent.

    - slug: apchem-u07-w24-q02
      type: multiple_choice
      topic_code: "7.8"
      source: "general knowledge"
      points: 1
      stimulus: |
        Graph description: concentration against time for N₂O₄(g) ⇌ 2 NO₂(g) in a sealed 1.0 L flask at 298 K. [N₂O₄] starts at 0.100 M and falls to a flat plateau of 0.071 M; [NO₂] starts at 0 and rises to a flat plateau of 0.057 M. Both curves become horizontal at the same time.
      prompt: |
        Which statement about the graph is correct?
      options:
        - "[NO₂] rises by 0.029 M, the same amount by which [N₂O₄] falls, as a 1:1 reaction requires."
        - "[NO₂] rises by 0.057 M, twice the 0.029 M fall in [N₂O₄], as the 1:2 coefficients require."
        - "The curves flatten because the forward and reverse reactions both stop."
        - "Equilibrium is reached at the moment the two curves cross, where [NO₂] = [N₂O₄]."
      option_explanations:
        - |
          The rise in [NO₂] is 0.057 M, not 0.029 M; one N₂O₄ gives two NO₂, so the product changes twice as much.
        - |
          Correct. Δ[N₂O₄] = 0.100 − 0.071 = −0.029 M and Δ[NO₂] = +0.057 M ≈ 2 × 0.029 M, the 1:2 stoichiometric ratio.
        - |
          At equilibrium both reactions continue at equal rates; the concentrations are constant because the rates match, not because the reactions stop.
        - |
          Curves crossing has no significance: equilibrium is where every curve becomes flat, and [NO₂] is below [N₂O₄] there.
      answer: 1
      explanation: |
        Practice 4. Changes in concentration are in the ratio of the coefficients; equilibrium is where every curve is flat.

    - slug: apchem-u07-w24-q03
      type: numeric
      topic_code: "7.7"
      source: "general knowledge"
      points: 1
      stimulus: |
        Graph description: concentration against time for N₂O₄(g) ⇌ 2 NO₂(g) in a sealed 1.0 L flask at 298 K. [N₂O₄] starts at 0.100 M and falls to a flat plateau of 0.071 M; [NO₂] starts at 0 and rises to a flat plateau of 0.057 M. Both curves become horizontal at the same time.
      prompt: |
        A second flask at 298 K starts with [N₂O₄] = 0.400 M and no NO₂. Using Kc = 0.046, calculate the equilibrium concentration of NO₂ in mol/L. Give your answer to three significant figures.
      answer: { value: 0.125, tolerance: 0.004 }
      explanation: |
        ICE: [N₂O₄] = 0.400 − x, [NO₂] = 2x. (2x)²/(0.400 − x) = 0.046 → 4x² + 0.046x − 0.0184 = 0 → x = [−0.046 + √(0.002116 + 0.2944)]/8 = (−0.046 + 0.5445)/8 = 0.0623 M. [NO₂] = 2x = 0.125 M. The small-x approximation (4x² = 0.0184, x = 0.068, 17% of 0.400) fails the 5% test, so the quadratic was required.

    # ---- Stand-alone multiple choice
    - slug: apchem-u07-w24-q04
      type: multiple_choice
      topic_code: "7.5"
      source: "general knowledge"
      points: 1
      prompt: |
        For which value of K does an equilibrium mixture consist almost entirely of reactants, with only a trace of product?
      options:
        - "K = 3 × 10⁻¹²"
        - "K = 1.0"
        - "K = 8 × 10³"
        - "K = 5 × 10⁹"
      option_explanations:
        - |
          Correct. A K far below 1 means the product-over-reactant ratio at equilibrium is tiny: the reaction barely proceeds and the reactants remain essentially at their initial concentrations.
        - |
          K near 1 means comparable amounts of reactants and products are present at equilibrium.
        - |
          K in the thousands means products are strongly favoured, not reactants.
        - |
          K near 10¹⁰ means the reaction is essentially complete; almost no reactant remains.
      answer: 0
      explanation: |
        Practice 4. The size of K places the position of equilibrium: K ≪ 1 reactants, K ≫ 1 products.

    - slug: apchem-u07-w24-q05
      type: multiple_choice
      topic_code: "7.6"
      source: "general knowledge"
      points: 1
      prompt: |
        At 500 K, 2 NO(g) + O₂(g) ⇌ 2 NO₂(g) has K = 4.0 × 10¹². What is K at 500 K for NO₂(g) ⇌ NO(g) + ½ O₂(g)?
      options:
        - "2.5 × 10⁻¹³"
        - "1.6 × 10²⁵"
        - "5.0 × 10⁻⁷"
        - "2.0 × 10⁶"
      option_explanations:
        - |
          2.5 × 10⁻¹³ is 1/K, the constant for the full reverse reaction 2 NO₂ ⇌ 2 NO + O₂, before halving.
        - |
          1.6 × 10²⁵ is K², which would apply to doubling the equation, not reversing and halving it.
        - |
          Correct. Reversing gives 1/(4.0 × 10¹²) = 2.5 × 10⁻¹³; halving takes the square root: √(2.5 × 10⁻¹³) = 5.0 × 10⁻⁷.
        - |
          2.0 × 10⁶ is √K for the forward reaction halved; the equation was also reversed, so the reciprocal is needed.
      answer: 2
      explanation: |
        Practice 5. Reverse: reciprocal. Halve: square root. K' = (1/K)^½ = 1/√K.

    - slug: apchem-u07-w24-q06
      type: multiple_choice
      topic_code: "7.7"
      source: "general knowledge"
      points: 1
      prompt: |
        A weak acid HA ionises: HA(aq) ⇌ H⁺(aq) + A⁻(aq), K = 1.8 × 10⁻⁵. A solution starts at [HA] = 0.10 M. Which is the best way to find [H⁺] at equilibrium?
      options:
        - "Set [H⁺] = K, because the initial concentration does not matter when K is small."
        - "Write K = x²/(0.10 − x), approximate 0.10 − x ≈ 0.10, solve x = √(K × 0.10), then confirm x is under 5% of 0.10."
        - "Write K = x²/(0.10 − x) and solve the quadratic, because the approximation is never allowed for acids."
        - "Write K = x/(0.10 − x), since only one product term enters the numerator."
      option_explanations:
        - |
          K is a ratio, not a concentration; [H⁺] depends on both K and the initial concentration through x² = K[HA]₀.
        - |
          Correct. With K/[HA]₀ ≈ 2 × 10⁻⁴ the approximation is safe: x = √(1.8 × 10⁻⁶) = 1.3 × 10⁻³ M, which is 1.3% of 0.10, so it passes the 5% check.
        - |
          The quadratic also gives the right answer, but it is unnecessary effort here; the approximation is valid whenever the 5% check passes, acid or not.
        - |
          Both H⁺ and A⁻ form, each at x, so the numerator is x × x = x².
      answer: 1
      explanation: |
        Practice 5. Small K relative to the initial concentration: drop x from the reactant term only, then check.

    - slug: apchem-u07-w24-q07
      type: multiple_choice
      topic_code: "7.7"
      source: "general knowledge"
      points: 1
      prompt: |
        For the reaction A(aq) ⇌ B(aq) + C(aq), which combination of K and initial concentration requires the quadratic formula because the small-x approximation fails the 5% test?
      options:
        - "K = 2.0 × 10⁻⁸, [A]₀ = 0.50 M"
        - "K = 1.0 × 10⁻⁵, [A]₀ = 1.0 M"
        - "K = 4.0 × 10⁻⁶, [A]₀ = 0.020 M"
        - "K = 0.25, [A]₀ = 0.10 M"
      option_explanations:
        - |
          x = √(1.0 × 10⁻⁸) = 1.0 × 10⁻⁴ M, which is 0.02% of 0.50 M; the approximation is excellent.
        - |
          x = √(1.0 × 10⁻⁵) = 3.2 × 10⁻³ M, 0.32% of 1.0 M; the approximation holds.
        - |
          x = √(8.0 × 10⁻⁸) = 2.8 × 10⁻⁴ M, 1.4% of 0.020 M; still under 5%.
        - |
          Correct. The approximation gives x = √(0.025) = 0.16 M, larger than the 0.10 M available; that absurd result (160%) shows K is not small, and the quadratic x² + 0.25x − 0.025 = 0 must be solved (x = 0.069 M).
      answer: 3
      explanation: |
        Practice 5. The test is x against [A]₀; when K is comparable to [A]₀ the approximation cannot work.

    - slug: apchem-u07-w24-q08
      type: multiple_choice
      topic_code: "7.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Figure description: four 1.0 L boxes contain particles for A(g) ⇌ 2 B(g), for which K = 2.0 at the temperature shown when the particle counts are treated as molarities. Box W holds 2 A and 2 B; box X holds 6 A and 2 B; box Y holds 2 A and 6 B; box Z holds 4 A and 4 B. Which box is at equilibrium?
      options:
        - "Box W"
        - "Box X"
        - "Box Y"
        - "Box Z"
      option_explanations:
        - |
          Correct. Q = [B]²/[A] = 2²/2 = 2.0 = K, so box W is the equilibrium mixture.
        - |
          Q = 2²/6 = 0.67 < K; box X will react forward, forming more B.
        - |
          Q = 6²/2 = 18 > K; box Y holds too much B and will react in reverse. More product particles do not mean equilibrium.
        - |
          Q = 4²/4 = 4.0 > K; box Z will react in reverse until Q falls to 2.0.
      answer: 0
      explanation: |
        Practice 1 and 4. Compute Q from counts with the coefficient as exponent; the box with Q = K is at equilibrium.

    - slug: apchem-u07-w24-q09
      type: multiple_choice
      topic_code: "7.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Reaction 1: A(g) ⇌ B(g), K₁ = 2.0 × 10⁻³. Reaction 2: B(g) ⇌ C(g), K₂ = 5.0 × 10². What is K for A(g) ⇌ C(g) at the same temperature?
      options:
        - "5.0 × 10²"
        - "4.0 × 10⁻⁶"
        - "1.0"
        - "2.5 × 10⁵"
      option_explanations:
        - |
          5.0 × 10² is K₂ alone; the overall constant must also include the first step.
        - |
          4.0 × 10⁻⁶ is K₁/K₂, which would apply if reaction 2 were subtracted (reversed) rather than added.
        - |
          Correct. Adding the two reactions cancels B, and K = K₁ × K₂ = (2.0 × 10⁻³)(5.0 × 10²) = 1.0. Check: [B]/[A] × [C]/[B] = [C]/[A].
        - |
          2.5 × 10⁵ is K₂/K₁, the constant for reversing reaction 1 and adding it to reaction 2, which would not give A ⇌ C.
      answer: 2
      explanation: |
        Practice 5. Adding equations multiplies their equilibrium constants.

    - slug: apchem-u07-w24-q10
      type: multiple_choice
      topic_code: "7.5"
      source: "general knowledge"
      points: 1
      prompt: |
        A reaction has K = 6 × 10¹⁵ at 25 °C. Which conclusion is justified by this value alone?
      options:
        - "The reaction reaches equilibrium quickly at 25 °C."
        - "At equilibrium the products are overwhelmingly favoured over the reactants."
        - "The reaction is exothermic."
        - "The activation energy of the forward reaction is small."
      option_explanations:
        - |
          K says nothing about rate. Many reactions with enormous K (such as H₂ + O₂) are imperceptibly slow at room temperature.
        - |
          Correct. K = 6 × 10¹⁵ means the product-over-reactant ratio at equilibrium is enormous; the limiting reactant is consumed to a trace.
        - |
          Large K does not require ΔH < 0; an endothermic reaction with a large entropy increase can also have a large K (unit 9).
        - |
          The activation energy governs the rate constant, not K; a large K is compatible with any activation energy.
      answer: 1
      explanation: |
        Practice 6. K is about extent, not speed or sign of ΔH.

    - slug: apchem-u07-w24-q11
      type: multiple_choice
      topic_code: "7.3"
      source: "general knowledge"
      points: 1
      prompt: |
        For CO(g) + 2 H₂(g) ⇌ CH₃OH(g), K = 10.5 at a certain temperature. A mixture contains [CO] = 0.20 M, [H₂] = 0.10 M and [CH₃OH] = 0.050 M. Which statement is correct?
      options:
        - "Q = 2.5, so the mixture is at equilibrium."
        - "Q = 2.5, so the reaction proceeds in reverse."
        - "Q = 25, so the reaction proceeds in reverse."
        - "Q = 25, so the reaction proceeds forward."
      option_explanations:
        - |
          Q = 0.050/(0.20 × 0.10²) = 0.050/0.0020 = 25, not 2.5, and 25 is not equal to K, so the mixture is not at equilibrium.
        - |
          The arithmetic is wrong: [H₂] must be squared, giving 0.0020 in the denominator and Q = 25.
        - |
          Correct. Q = 25 > K = 10.5, so the mixture holds too much CH₃OH relative to equilibrium and the reverse reaction proceeds until Q falls to 10.5.
        - |
          Q > K requires the reverse direction, not forward; forward would raise Q further above K.
      answer: 2
      explanation: |
        Practice 5 (review of 7.3). Compute Q with the coefficients as exponents and compare with K.

    # ---- Multi-select
    - slug: apchem-u07-w24-q12
      type: multi_select
      topic_code: "7.6"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following change the numerical value of the equilibrium constant for a gas-phase reaction? Select all that apply.
      options:
        - "Raising the temperature of the system"
        - "Adding a catalyst"
        - "Doubling the volume of the container"
        - "Writing the equation in the reverse direction"
        - "Adding an inert gas at constant volume"
        - "Multiplying every coefficient in the equation by 2"
      option_explanations:
        - |
          Correct. Temperature is the only physical condition that changes K; the direction of the change depends on the sign of ΔH.
        - |
          A catalyst speeds the forward and reverse reactions equally; equilibrium is reached sooner but K is unchanged.
        - |
          Changing the volume changes the concentrations and so Q, causing a shift, but K at the same temperature is the same.
        - |
          Correct. The reversed equation has K' = 1/K, a different number for the same chemistry written the other way.
        - |
          An inert gas at constant volume changes no partial pressure or concentration of the reacting species, and K is unaffected in any case.
        - |
          Correct. Doubling the coefficients squares every exponent, so K' = K².
      answer: [0, 3, 5]
      explanation: |
        Practice 6. Physically, only temperature changes K; on paper, rewriting the equation changes the number that represents the same equilibrium.

    - slug: apchem-u07-w24-q13
      type: multi_select
      topic_code: "7.2"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        A sealed flask at constant temperature initially contains only the product of a reversible gas-phase reaction, and no reactants. Which statements are correct? Select all that apply.
      options:
        - "The net reaction proceeds in the reverse direction."
        - "The initial value of Q is larger than K."
        - "The equilibrium composition reached is the same as would be reached from the stoichiometrically equivalent amounts of reactants at the same temperature."
        - "The forward rate is initially at its maximum value."
        - "The reverse rate decreases as the system approaches equilibrium."
      option_explanations:
        - |
          Correct. With no reactant present only the reverse reaction can occur at first, so products are consumed and reactants form.
        - |
          Correct. With zero in the denominator Q is effectively infinite, far above any finite K.
        - |
          Correct. K depends only on temperature, so the same total inventory of atoms reaches the same equilibrium mixture from either side.
        - |
          The forward rate is initially zero because there are no reactants to collide; it rises as reactants form.
        - |
          Correct. The reverse rate is highest at the start when the product concentration is largest, and falls as product is consumed until it equals the rising forward rate.
