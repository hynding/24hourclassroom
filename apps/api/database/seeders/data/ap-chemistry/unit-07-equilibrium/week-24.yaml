        Nitrogen dioxide dimerises: 2 NO₂(g) ⇌ N₂O₄(g). At 298 K a rigid flask is filled with NO₂ at an initial partial pressure of 1.00 atm and no N₂O₄. At equilibrium the total pressure is 0.74 atm.
