week: 23
unit: 7
title: "Equilibrium, the Reaction Quotient and K"
topics: ["7.1", "7.2", "7.3", "7.4"]
guide: guides/week-23.md
guide_description: |
  Dynamic equilibrium as equal forward and reverse rates, read from concentration–time and rate–time graphs;
  why the same equilibrium is reached from either side; writing Q and K (products over reactants to their
  coefficients, solids and liquids omitted) and using Q versus K to predict the direction of change; calculating
  Kc and Kp from equilibrium data, particle diagrams and ICE tables, and converting between them with
  Kp = Kc(RT)^Δn. Worked examples for H₂ + I₂, the water-gas shift, N₂O₄ decomposition and SO₃ formation.
flashcards_description: |
  28 cards on dynamic equilibrium, the direction of reversible reactions, writing Q and K, Q versus K, ICE tables
  and the Kp–Kc relation.

flashcards:
  - front: Dynamic equilibrium → definition
    back: |
      The state of a reversible reaction in which the forward and reverse rates are equal, so concentrations stay constant while both reactions continue at the molecular level.
    topic_code: "7.1"
  - front: Reading equilibrium on a concentration–time graph
    back: |
      Reactant curves fall and product curves rise until every curve goes flat; the time at which all curves become horizontal is when equilibrium is reached. Flat does not mean equal concentrations.
    topic_code: "7.1"
  - front: Reading equilibrium on a rate–time graph
    back: |
      The forward rate starts high and falls as reactants are used; the reverse rate starts at zero and rises as products form; equilibrium is where the two lines meet and then run together.
    topic_code: "7.1"
  - front: Evidence that equilibrium is dynamic, not static
    back: |
      Add radioactive iodine to a saturated iodine solution in contact with solid iodine: radioactivity appears in the solid though its mass is unchanged, because dissolving and crystallising continue at equal rates.
    topic_code: "7.1"
  - front: Are 'complete' reactions really irreversible?
    back: |
      No; every reaction is reversible in principle. A reaction that goes to completion has such a large K that negligible reactant remains, and one that 'does not occur' has a very small K.
    topic_code: "7.1"
  - front: N₂O₄ ⇌ 2 NO₂ as an equilibrium example
    back: |
      Colourless N₂O₄ in a sealed flask produces brown NO₂ until the colour stops deepening. The forward rate fell and the reverse rate rose until equal; the constant colour is the equilibrium mixture.
    topic_code: "7.1"
  - front: Approaching the same equilibrium from either side
    back: |
      Starting from pure reactants or from pure products (same total composition, same temperature) gives the same equilibrium concentrations. Equilibrium is a destination fixed by K, not by the starting point.
    topic_code: "7.2"
  - front: What decides the direction a reversible reaction proceeds
    back: |
      The initial concentrations relative to the equilibrium ratio: too little product and the reaction runs forward, too much and it runs in reverse. Quantitatively, compare Q with K.
    topic_code: "7.2"
  - front: Reaction quotient Q → expression for a A + b B ⇌ c C + d D
    back: |
      Q = [C]ᶜ[D]ᵈ / ([A]ᵃ[B]ᵇ) evaluated with the concentrations present at any moment. At equilibrium Q = K. Coefficients become exponents.
    topic_code: "7.3"
  - front: Species omitted from Q and K, and why
    back: |
      Pure solids, pure liquids and the solvent in dilute solution: their concentrations are constant and absorbed into K. CaCO₃(s) ⇌ CaO(s) + CO₂(g) has K = [CO₂].
    topic_code: "7.3"
  - front: Q compared with K → the three cases
    back: |
      Q < K: too little product, reaction proceeds forward. Q > K: too much product, reaction proceeds in reverse. Q = K: at equilibrium, no net change.
    topic_code: "7.3"
  - front: Worked Q vs K for H₂ + I₂ ⇌ 2 HI (K = 50)
    back: |
      [H₂] = 0.10, [I₂] = 0.20, [HI] = 0.40 M: Q = 0.16/0.020 = 8.0 < 50, so HI forms and H₂ and I₂ are consumed until Q reaches 50.
    topic_code: "7.3"
  - front: Why K is a constant → the kinetic argument
    back: |
      For an elementary A ⇌ B, equilibrium means k_f[A] = k_r[B], so [B]/[A] = k_f/k_r = K. Rate constants depend only on temperature, so K depends only on temperature.
    topic_code: "7.3"
  - front: Do rate-law orders appear in K?
    back: |
      No. K uses the coefficients of the balanced overall equation as exponents, whatever the experimental orders. Orders describe the mechanism's slow step; K describes the overall equilibrium.
    topic_code: "7.3"
  - front: Units of K on the AP exam
    back: |
      None. Concentrations are understood relative to 1 M and pressures relative to 1 atm (or 1 bar), so K is reported as a pure number.
    topic_code: "7.3"
  - front: Kc versus Kp
    back: |
      Kc uses molar concentrations; Kp uses partial pressures of gases. Related by Kp = Kc(RT)^Δn, where Δn = moles of gaseous products − moles of gaseous reactants and R = 0.08206 L·atm/(mol·K).
    topic_code: "7.4"
  - front: When Kp equals Kc
    back: |
      When Δn = 0, the number of gas molecules is the same on both sides: H₂ + I₂ ⇌ 2 HI, CO + H₂O ⇌ CO₂ + H₂. Then (RT)⁰ = 1.
    topic_code: "7.4"
  - front: Kp for N₂O₄ ⇌ 2 NO₂ from Kc at 298 K
    back: |
      Δn = +1, so Kp = Kc × RT = Kc × 0.08206 × 298 = 24.5 Kc. With Kc = 0.046, Kp = 1.1.
    topic_code: "7.4"
  - front: Calculating K from equilibrium concentrations → example
    back: |
      CO + H₂O ⇌ CO₂ + H₂ with [CO] = [H₂O] = 0.012 M and [CO₂] = [H₂] = 0.028 M: K = (0.028)²/(0.012)² = 5.4.
    topic_code: "7.4"
  - front: Calculating K from a particle diagram
    back: |
      Count each species in the equilibrium box and use the counts as concentrations (give the box a volume if Δn ≠ 0). 2 A₂, 2 B₂, 4 AB for A₂ + B₂ ⇌ 2 AB gives K = 4²/(2 × 2) = 4.
    topic_code: "7.4"
  - front: ICE table → what the three rows are
    back: |
      Initial concentrations; Change, written as −x or +x times each coefficient; Equilibrium = Initial + Change. Use the one known equilibrium value to find x, then fill the rest and compute K.
    topic_code: "7.4"
  - front: Change row for a species with coefficient 2
    back: |
      ±2x, not ±x. For N₂O₄ ⇌ 2 NO₂, N₂O₄ changes by −x while NO₂ changes by +2x; if [NO₂]eq = 0.140 M then x = 0.070 M.
    topic_code: "7.4"
  - front: "Worked ICE: 0.500 M N₂O₄, [NO₂]eq = 0.140 M → Kc"
    back: |
      x = 0.070, [N₂O₄]eq = 0.500 − 0.070 = 0.430 M. Kc = (0.140)²/0.430 = 0.046.
    topic_code: "7.4"
  - front: Moles versus molarity in Kc
    back: |
      Kc needs molarities. Divide every mole amount by the flask volume before substituting unless the volume is exactly 1 L (or Δn = 0, when the volume cancels).
    topic_code: "7.4"
  - front: "Worked Kp: 2 SO₂ + O₂ ⇌ 2 SO₃ at 1,000 K"
    back: |
      P(SO₂) = 0.20, P(O₂) = 0.10, P(SO₃) = 0.60 atm: Kp = (0.60)²/((0.20)² × 0.10) = 0.36/0.0040 = 90.
    topic_code: "7.4"
  - front: Partial pressure to molarity for an equilibrium gas (spiral 3.4)
    back: |
      [gas] = n/V = P/(RT). At 500 K a partial pressure of 2.05 atm is 2.05/(0.08206 × 500) = 0.0500 M. This is the conversion inside Kp = Kc(RT)^Δn.
    topic_code: "3.4"
  - front: Equilibrium constant as a ratio of rate constants (spiral 5.4)
    back: |
      For a single elementary step, K = k_forward/k_reverse. A reaction whose forward rate constant is 100 times its reverse rate constant has K = 100 and lies well toward products.
    topic_code: "5.4"
  - front: Does a catalyst change K? (spiral 5.11)
    back: |
      No. It lowers the activation energy for both directions equally, so k_f and k_r rise by the same factor and their ratio is unchanged. Equilibrium is reached faster but at the same composition.
    topic_code: "5.11"

quiz:
  description: |
    23 questions · about 45 minutes · topics 7.1–7.4 (dynamic equilibrium, the direction of reversible
    reactions, Q and K, and calculating K from concentrations, pressures, particle diagrams and ICE tables),
    with review of elementary steps, catalysts, the ideal gas law, molarity and stoichiometry. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: particle diagrams (7.3, 7.4)
    - slug: apchem-u07-w23-q01
      type: multiple_choice
      topic_code: "7.4"
      source: "general knowledge"
      points: 1
      stimulus: |
        Figure description: three 1.0 L boxes show particles for the gas-phase reaction A₂(g) + B₂(g) ⇌ 2 AB(g) at the same temperature. Box 1 is at equilibrium and contains 2 A₂, 3 B₂ and 6 AB. Box 2 contains 4 A₂, 4 B₂ and 4 AB. Box 3 contains 1 A₂, 2 B₂ and 8 AB. Treat the particle counts as concentrations.
      prompt: |
        What is the value of K for the reaction at this temperature?
      options:
        - "1.0"
        - "0.17"
        - "6.0"
        - "36"
      option_explanations:
        - |
          1.0 is Q for box 2, which is not at equilibrium.
        - |
          0.17 is 1/6, the reciprocal of K; it would be K for the reverse reaction 2 AB ⇌ A₂ + B₂.
        - |
          Correct. Box 1 is the equilibrium mixture: K = [AB]²/([A₂][B₂]) = 6²/(2 × 3) = 36/6 = 6.0.
        - |
          36 is [AB]² alone; it must be divided by the product of the reactant concentrations.
      answer: 2
      explanation: |
        Practice 1 and 5. Only the box stated to be at equilibrium gives K; coefficients become exponents.

    - slug: apchem-u07-w23-q02
      type: multiple_choice
      topic_code: "7.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        Figure description: three 1.0 L boxes show particles for the gas-phase reaction A₂(g) + B₂(g) ⇌ 2 AB(g) at the same temperature. Box 1 is at equilibrium and contains 2 A₂, 3 B₂ and 6 AB. Box 2 contains 4 A₂, 4 B₂ and 4 AB. Box 3 contains 1 A₂, 2 B₂ and 8 AB. Treat the particle counts as concentrations.
      prompt: |
        In which direction will the reaction in box 2 proceed to reach equilibrium?
      options:
        - "Forward, because Q = 1.0 is less than K, so more AB must form"
        - "Reverse, because there are more reactant particles than product particles"
        - "Reverse, because Q = 1.0 is greater than K"
        - "No net change, because box 2 already has equal numbers of A₂ and B₂"
      option_explanations:
        - |
          Correct. Q = 4²/(4 × 4) = 1.0, below K = 6.0; the mixture has too little product, so A₂ and B₂ combine to form AB until Q rises to 6.0.
        - |
          The relative numbers of particles do not decide the direction; the value of Q relative to K does.
        - |
          Q = 1.0 is less than K = 6.0, not greater.
        - |
          Equal reactant counts have nothing to do with equilibrium, which is reached when Q = K.
      answer: 0
      explanation: |
        Practice 4. Q < K means the forward reaction proceeds.

    - slug: apchem-u07-w23-q03
      type: numeric
      topic_code: "7.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        Figure description: three 1.0 L boxes show particles for the gas-phase reaction A₂(g) + B₂(g) ⇌ 2 AB(g) at the same temperature. Box 1 is at equilibrium and contains 2 A₂, 3 B₂ and 6 AB. Box 2 contains 4 A₂, 4 B₂ and 4 AB. Box 3 contains 1 A₂, 2 B₂ and 8 AB. Treat the particle counts as concentrations.
      prompt: |
        Calculate the reaction quotient Q for box 3. Give your answer as a whole number.
      answer: { value: 32, tolerance: 0 }
      explanation: |
        Q = [AB]²/([A₂][B₂]) = 8²/(1 × 2) = 64/2 = 32. Since Q = 32 > K = 6.0, box 3 holds too much AB and the reverse reaction proceeds: some AB dissociates into A₂ and B₂ until Q falls to 6.0.

    # ---- Stand-alone multiple choice
    - slug: apchem-u07-w23-q04
      type: multiple_choice
      topic_code: "7.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement correctly describes a chemical system at equilibrium?
      options:
        - "The forward and reverse reactions have stopped."
        - "The forward and reverse reactions continue at equal rates, so the concentrations remain constant."
        - "The concentrations of reactants and products are equal."
        - "The reaction has consumed all of the limiting reactant."
      option_explanations:
        - |
          Both reactions continue at the molecular level; equilibrium is dynamic, as isotope-exchange experiments show.
        - |
          Correct. Equal forward and reverse rates mean no net change in any concentration, although molecules keep reacting in both directions.
        - |
          Equal concentrations are a coincidence, not a requirement; K can be very large or very small.
        - |
          A limiting reactant is a stoichiometry idea for reactions that go to completion; at equilibrium some of every species is present.
      answer: 1
      explanation: |
        Practice 6. Constant concentrations, equal rates, continuing reaction.

    - slug: apchem-u07-w23-q05
      type: multiple_choice
      topic_code: "7.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Graph description: for the reaction 2 SO₂(g) + O₂(g) ⇌ 2 SO₃(g), concentration is plotted against time. [SO₂] falls from 0.40 M and becomes constant at 0.10 M after 60 s; [SO₃] rises from 0 and becomes constant at 0.30 M after 60 s; [O₂] falls from 0.20 M and becomes constant at 0.05 M after 60 s. Which statement is correct?
      options:
        - "Equilibrium is reached at 30 s, when the SO₂ and SO₃ curves cross."
        - "The reaction stops at 60 s."
        - "The forward rate exceeds the reverse rate before 60 s because SO₃ is still forming."
        - "Equilibrium is reached at 60 s, when every concentration stops changing, and the changes (−0.30, −0.15, +0.30) are in the ratio of the coefficients."
      option_explanations:
        - |
          Curves crossing means two concentrations are momentarily equal; it has nothing to do with equilibrium.
        - |
          At 60 s the rates become equal; the reactions do not stop.
        - |
          This is true, but it is not the complete reading of the graph: the question asks which statement about the graph is correct in full, and the one that identifies the equilibrium time and checks the stoichiometry is the better answer.
        - |
          Correct. All three curves flatten at 60 s, the equilibrium time; the changes 0.30 (SO₂), 0.15 (O₂) and 0.30 (SO₃) are in the 2:1:2 ratio of the balanced equation.
      answer: 3
      explanation: |
        Practice 3. Equilibrium is where all curves go flat; changes follow the coefficients.

    - slug: apchem-u07-w23-q06
      type: multiple_choice
      topic_code: "7.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Two sealed 1.0 L flasks are held at the same temperature. Flask X initially contains 1.0 mol of N₂O₄ and no NO₂; flask Y initially contains 2.0 mol of NO₂ and no N₂O₄. For N₂O₄(g) ⇌ 2 NO₂(g), which statement is correct once both flasks reach equilibrium?
      options:
        - "Flask Y contains more NO₂ at equilibrium because it started with NO₂."
        - "Flask X reaches equilibrium by the forward reaction and flask Y by the reverse reaction, and both end with identical equilibrium concentrations."
        - "Flask X contains only N₂O₄ because the reverse reaction dominates."
        - "The two flasks have different values of K."
      option_explanations:
        - |
          The starting side does not affect the final composition when the total amount of material (1.0 mol N₂O₄ is equivalent to 2.0 mol NO₂) and temperature are the same.
        - |
          Correct. Both flasks hold the same total nitrogen and oxygen at the same temperature, so both reach the same equilibrium mixture, one from the reactant side, the other from the product side.
        - |
          Starting from pure N₂O₄, only the forward reaction can occur at first; some NO₂ must form.
        - |
          K depends only on temperature, which is the same for both flasks.
      answer: 1
      explanation: |
        Practice 6. Equilibrium is a destination set by K, not by the starting side.

    - slug: apchem-u07-w23-q07
      type: multiple_choice
      topic_code: "7.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which is the correct equilibrium-constant expression for the reaction C(s) + H₂O(g) ⇌ CO(g) + H₂(g)?
      options:
        - "K = [CO][H₂] / [H₂O]"
        - "K = [CO][H₂] / ([C][H₂O])"
        - "K = [H₂O] / ([CO][H₂])"
        - "K = [CO] + [H₂] − [H₂O]"
      option_explanations:
        - |
          Correct. Products over reactants, each to its coefficient (all 1), with solid carbon omitted because its concentration is constant.
        - |
          Solid carbon is a pure solid and does not appear in the expression.
        - |
          This is the reciprocal: reactants over products, which is K for the reverse reaction.
        - |
          Equilibrium expressions are products and quotients of concentrations, never sums or differences.
      answer: 0
      explanation: |
        Practice 1. Omit pure solids and liquids.

    - slug: apchem-u07-w23-q08
      type: multiple_choice
      topic_code: "7.3"
      source: "general knowledge"
      points: 1
      prompt: |
        For N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g), Kc = 0.50 at a certain temperature. A mixture contains [N₂] = 0.20 M, [H₂] = 0.40 M and [NH₃] = 0.30 M. Which statement is correct?
      options:
        - "Q = 0.50, so the mixture is at equilibrium."
        - "Q = 1.1, so the reaction proceeds forward."
        - "Q = 3.8, so the reaction proceeds forward."
        - "Q = 7.0, so the reaction proceeds in reverse, forming N₂ and H₂."
      option_explanations:
        - |
          Q does not equal K here; the arithmetic gives a value well above 0.50.
        - |
          1.1 results from forgetting to cube [H₂]; and a Q above K means the reverse reaction, not forward.
        - |
          3.8 results from cubing [H₂] but not squaring [NH₃]; the direction is also wrong.
        - |
          Correct. Q = (0.30)²/(0.20 × (0.40)³) = 0.090/(0.20 × 0.064) = 0.090/0.0128 = 7.0; since Q > K, NH₃ decomposes until Q = 0.50.
      answer: 3
      explanation: |
        Practice 5. Raise each concentration to its coefficient, then compare Q with K.

    - slug: apchem-u07-w23-q09
      type: multiple_choice
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        For which reaction is Kp equal to Kc at all temperatures?
      options:
        - "N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g)"
        - "H₂(g) + Cl₂(g) ⇌ 2 HCl(g)"
        - "PCl₅(g) ⇌ PCl₃(g) + Cl₂(g)"
        - "2 SO₂(g) + O₂(g) ⇌ 2 SO₃(g)"
      option_explanations:
        - |
          Δn = 2 − 4 = −2, so Kp = Kc(RT)⁻², which differs from Kc.
        - |
          Correct. Δn = 2 − 2 = 0, so Kp = Kc(RT)⁰ = Kc: the partial pressure of each gas is proportional to its molarity by the same factor RT, and the factors cancel when the gas counts match.
        - |
          Δn = 2 − 1 = +1, so Kp = Kc × RT, which differs from Kc at every temperature.
        - |
          Δn = 2 − 3 = −1, so Kp = Kc/(RT), which is smaller than Kc at every temperature.
      answer: 1
      explanation: |
        Practice 5 (review of 3.4). P = [gas]RT, so (RT) factors cancel only when Δn = 0.

    - slug: apchem-u07-w23-q10
      type: multiple_choice
      topic_code: "5.4"
      source: "general knowledge"
      points: 1
      prompt: |
        The reaction A(g) ⇌ B(g) occurs in a single elementary step in each direction, with forward rate constant k_f = 4.0 × 10³ s⁻¹ and reverse rate constant k_r = 8.0 × 10¹ s⁻¹. What is the equilibrium constant?
      options:
        - "0.020"
        - "50"
        - "3.2 × 10⁵"
        - "4.1 × 10³"
      option_explanations:
        - |
          0.020 is k_r/k_f, the equilibrium constant for the reverse reaction B ⇌ A.
        - |
          Correct. At equilibrium k_f[A] = k_r[B], so K = [B]/[A] = k_f/k_r = 4.0 × 10³/8.0 × 10¹ = 50.
        - |
          Multiplying the rate constants has no meaning here; K is their ratio.
        - |
          Adding the rate constants has no physical basis.
      answer: 1
      explanation: |
        Practice 5 (review of 5.4). K = k_f/k_r for an elementary reversible step.

    - slug: apchem-u07-w23-q11
      type: multiple_choice
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        At 400 K an equilibrium mixture has a partial pressure of NO₂ of 0.656 atm. Using R = 0.08206 L·atm/(mol·K), what is the molar concentration of NO₂?
      options:
        - "0.656 M"
        - "0.0164 M"
        - "0.0200 M"
        - "21.5 M"
      option_explanations:
        - |
          Partial pressure in atm is not the same as molarity; it must be divided by RT.
        - |
          0.0164 M would result from dividing by RT at 487 K, not 400 K.
        - |
          Correct. [NO₂] = P/(RT) = 0.656/(0.08206 × 400) = 0.656/32.8 = 0.0200 M.
        - |
          21.5 M multiplies by RT instead of dividing.
      answer: 2
      explanation: |
        Practice 5 (review of 3.4). [gas] = n/V = P/(RT).

    # ---- Select all
    - slug: apchem-u07-w23-q12
      type: multi_select
      topic_code: "7.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about writing the equilibrium-constant expression are correct? Select all that apply.
      options:
        - "The coefficient of each species in the balanced equation becomes its exponent."
        - "Pure solids are omitted because their concentration does not change."
        - "The exponents are the orders found from the rate law."
        - "For the reaction written in reverse, K is the reciprocal of the original K."
        - "Water as a solvent in a dilute aqueous solution is omitted from the expression."
      option_explanations:
        - |
          Correct. That is the law of mass action: K = [C]ᶜ[D]ᵈ/([A]ᵃ[B]ᵇ).
        - |
          Correct. A pure solid's density, and so its concentration, is fixed; it is absorbed into the value of K.
        - |
          Rate-law orders describe the mechanism and come from experiment; the equilibrium expression uses the stoichiometric coefficients.
        - |
          Correct. Swapping numerator and denominator inverts the ratio: K(reverse) = 1/K(forward).
        - |
          Correct. The solvent's concentration (about 55.5 M for water) is essentially constant and is treated like a pure liquid.
      answer: [0, 1, 3, 4]
      explanation: |
        Practice 1. Coefficients as exponents; solids, liquids and solvent omitted; reverse gives the reciprocal.

    - slug: apchem-u07-w23-q13
      type: multi_select
      topic_code: "7.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        A sealed flask of N₂O₄(g) at 25 °C develops a brown colour that deepens for a minute and then stays constant. Which statements about the system after the colour stops changing are correct? Select all that apply.
      options:
        - "N₂O₄ molecules are still dissociating into NO₂."
        - "NO₂ molecules are still combining to form N₂O₄."
        - "The rate of dissociation equals the rate of recombination."
        - "The concentrations of N₂O₄ and NO₂ are equal."
        - "If the flask is kept at 25 °C, the colour will slowly fade as the reaction finishes."
      option_explanations:
        - |
          Correct. The forward reaction continues at the molecular level; the constant colour is a balance, not a halt.
        - |
          Correct. The reverse reaction continues at exactly the rate needed to offset the forward reaction.
        - |
          Correct. Equal rates in the two directions are what make the concentrations, and the colour, constant.
        - |
          Equilibrium does not require equal concentrations; at 25 °C most of the material is N₂O₄ (K is about 0.046 in terms of molarity).
        - |
          At constant temperature the equilibrium composition is permanent; the colour will not change.
      answer: [0, 1, 2]
      explanation: |
        Practice 6. Dynamic equilibrium: both reactions continue, rates equal, concentrations constant but not equal.

    # ---- True/false
    - slug: apchem-u07-w23-q14
      type: true_false
      topic_code: "7.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: a reversible reaction started with only products present will proceed in the reverse direction until it reaches the same equilibrium composition that would be reached from the equivalent amount of reactants at the same temperature.
      answer: true
      explanation: |
        True. Starting from pure products, Q is infinite (no reactant in the denominator), so Q > K and the reverse reaction proceeds. Because K depends only on temperature, the equilibrium composition for a given total amount of material is the same whichever side it started on.

    - slug: apchem-u07-w23-q15
      type: true_false
      topic_code: "5.11"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: adding a catalyst to a reaction mixture at equilibrium increases the value of K because the forward reaction becomes faster.
      answer: false
      explanation: |
        False. A catalyst lowers the activation energy for the forward and reverse reactions by the same amount, so both rate constants increase by the same factor and their ratio, K = k_f/k_r, is unchanged. A catalyst lets a system reach equilibrium sooner but does not change where equilibrium lies.

    # ---- Fill in the blank
    - slug: apchem-u07-w23-q16
      type: fill_blank
      topic_code: "7.3"
      source: "general knowledge"
      points: 1
      prompt: |
        For a reaction mixture in which the reaction quotient Q is greater than the equilibrium constant K, the net reaction proceeds in the ____ direction.
      answer: ["reverse", "backward", "reverse (toward reactants)", "leftward", "left", "reverse (to the left)"]
      explanation: |
        Q > K means the ratio of products to reactants is larger than equilibrium allows: there is too much product. The reverse reaction proceeds, consuming products and forming reactants, until Q falls to K.

    - slug: apchem-u07-w23-q17
      type: fill_blank
