      points: 1
      prompt: |
        At equilibrium a 2.50 L flask contains 0.125 mol of HI. The molar concentration of HI to be used in the Kc expression is ____ M.
      answer: ["0.0500", "0.05", "0.050", "0.0500 M", "0.05 M"]
      explanation: |
        Molarity = moles ÷ litres = 0.125 mol / 2.50 L = 0.0500 M. Kc expressions need concentrations, not mole amounts; forgetting to divide by the volume is a common error whenever the flask is not 1 L.

    # ---- Numeric
    - slug: apchem-u07-w23-q18
      type: numeric
      topic_code: "7.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A flask initially contains 0.600 M N₂O₄ and no NO₂. At equilibrium, [NO₂] = 0.120 M. Calculate Kc for N₂O₄(g) ⇌ 2 NO₂(g). Give your answer to three decimal places.
      answer: { value: 0.027, tolerance: 0.001 }
      explanation: |
        ICE: N₂O₄ changes by −x, NO₂ by +2x. 2x = 0.120, so x = 0.060 and [N₂O₄]eq = 0.600 − 0.060 = 0.540 M. Kc = (0.120)²/0.540 = 0.0144/0.540 = 0.0267 ≈ 0.027.

    - slug: apchem-u07-w23-q19
      type: numeric
      topic_code: "7.4"
      source: "general knowledge"
      points: 1
      prompt: |
        At equilibrium at a certain temperature, the partial pressures are P(NO₂) = 0.30 atm and P(N₂O₄) = 0.90 atm. Calculate Kp for 2 NO₂(g) ⇌ N₂O₄(g). Give your answer to one decimal place.
      answer: { value: 10.0, tolerance: 0.1 }
      explanation: |
        Kp = P(N₂O₄)/P(NO₂)² = 0.90/(0.30)² = 0.90/0.090 = 10. Note the reaction is written with N₂O₄ as the product, so it appears in the numerator; for the reverse reaction Kp would be 0.10.

    - slug: apchem-u07-w23-q20
      type: numeric
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Kc for N₂O₄(g) ⇌ 2 NO₂(g) is 0.046 at 298 K. Calculate Kp at this temperature using Kp = Kc(RT)^Δn with R = 0.08206 L·atm/(mol·K). Give your answer to two decimal places.
      answer: { value: 1.12, tolerance: 0.03 }
      explanation: |
        Δn = 2 − 1 = +1, so Kp = Kc × RT = 0.046 × 0.08206 × 298 = 0.046 × 24.45 = 1.12. Kp is larger than Kc here because each mole of gas contributes RT atm per mol/L and there is one more mole of gas on the product side.

    # ---- Short answer
    - slug: apchem-u07-w23-q21
      type: short_answer
      topic_code: "7.1"
      source: "general knowledge"
      points: 3
      prompt: |
        Graph description: for the reaction H₂(g) + I₂(g) ⇌ 2 HI(g) at 700 K, concentration is plotted against time. [H₂] and [I₂] both start at 0.100 M and fall to a constant 0.022 M; [HI] starts at 0 and rises to a constant 0.156 M. All three curves become flat at the same time, t₁.
        (a) Explain what is happening to the forward and reverse rates between t = 0 and t₁, and at t₁.
        (b) Show that the changes in concentration are consistent with the balanced equation.
        (c) Calculate K from the equilibrium concentrations.
      answer: |
        (a) At t = 0 the forward rate is at its maximum (highest [H₂] and [I₂]) and the reverse rate is zero (no HI). As the reaction proceeds the forward rate falls and the reverse rate rises; at t₁ they become equal, and from then on the concentrations are constant although both reactions continue.
        (b) H₂ and I₂ each fall by 0.100 − 0.022 = 0.078 M; HI rises by 0.156 M = 2 × 0.078 M. The changes are in the 1:1:2 ratio of the coefficients.
        (c) K = [HI]²/([H₂][I₂]) = (0.156)²/(0.022 × 0.022) = 0.02434/0.000484 = 50.
      explanation: |
        Three points, one per part.

        (a) 1 pt: forward rate decreasing, reverse rate increasing from zero, equal at t₁ with both reactions continuing.
        (b) 1 pt: changes of −0.078, −0.078 and +0.156 M match the 1:1:2 stoichiometry.
        (c) 1 pt: K ≈ 50 (accept 48–52).

    - slug: apchem-u07-w23-q22
      type: short_answer
      topic_code: "4.5"
      source: "general knowledge"
      points: 3
      prompt: |
        Phosphorus pentachloride decomposes: PCl₅(g) ⇌ PCl₃(g) + Cl₂(g). A 2.00 L flask is charged with 0.400 mol of PCl₅ and heated to 500 K. At equilibrium the flask contains 0.120 mol of Cl₂.
        (a) Construct an ICE table in molarity for the system, defining x.
        (b) Determine the equilibrium concentrations of all three gases.
        (c) Calculate Kc at 500 K.
      answer: |
        (a) [PCl₅]₀ = 0.400/2.00 = 0.200 M; [PCl₃]₀ = [Cl₂]₀ = 0. Change: PCl₅ −x, PCl₃ +x, Cl₂ +x. Equilibrium: 0.200 − x, x, x.
        (b) [Cl₂]eq = 0.120/2.00 = 0.0600 M, so x = 0.0600 M; [PCl₃]eq = 0.0600 M; [PCl₅]eq = 0.200 − 0.0600 = 0.140 M.
        (c) Kc = [PCl₃][Cl₂]/[PCl₅] = (0.0600)(0.0600)/0.140 = 0.00360/0.140 = 0.0257 ≈ 0.026.
      explanation: |
        Three points, one per part.

        (a) 1 pt: initial concentrations in M (0.200, 0, 0) with change row −x, +x, +x.
        (b) 1 pt: x = 0.0600 M from the Cl₂ data; [PCl₃] = 0.0600 M, [PCl₅] = 0.140 M.
        (c) 1 pt: Kc = 0.026 (accept 0.025–0.026). Using moles instead of molarity (0.0514) loses this point.

    # ---- Long answer
    - slug: apchem-u07-w23-q23
      type: long_answer
      topic_code: "7.4"
      source: "general knowledge"
      points: 6
      stimulus: |
        The water-gas shift reaction, CO(g) + H₂O(g) ⇌ CO₂(g) + H₂(g), is used to make hydrogen. At 700 K, Kc = 5.4. A 5.00 L reactor is charged with 2.00 mol of CO and 2.00 mol of H₂O and held at 700 K. At equilibrium, 1.40 mol of H₂ is present.
      prompt: |
        (a) Write the equilibrium-constant expression and explain why Kp = Kc for this reaction.
        (b) Set up an ICE table in molarity and determine the equilibrium concentrations of all four gases.
        (c) Use your concentrations to calculate Kc and compare it with the stated value.
        (d) A second reactor at 700 K contains [CO] = 0.100 M, [H₂O] = 0.100 M, [CO₂] = 0.300 M and [H₂] = 0.300 M. Determine the direction in which this mixture will react, with justification.
        (e) Explain, in terms of forward and reverse rates, what happens in the second reactor from the moment of mixing until equilibrium.
        (f) At 1,000 K, Kc for this reaction is 1.4. State whether the reaction is exothermic or endothermic and explain your reasoning.
      answer: |
        (a) Kc = [CO₂][H₂]/([CO][H₂O]). Δn = (1 + 1) − (1 + 1) = 0, so Kp = Kc(RT)⁰ = Kc.
        (b) Initial: [CO] = [H₂O] = 2.00/5.00 = 0.400 M; [CO₂] = [H₂] = 0. Change: −x, −x, +x, +x. Equilibrium: [H₂] = 1.40/5.00 = 0.280 M = x; [CO₂] = 0.280 M; [CO] = [H₂O] = 0.400 − 0.280 = 0.120 M.
        (c) Kc = (0.280)(0.280)/((0.120)(0.120)) = 0.0784/0.0144 = 5.4, in agreement with the stated value.
        (d) Q = (0.300)(0.300)/((0.100)(0.100)) = 0.0900/0.0100 = 9.0. Q > K (9.0 > 5.4), so the mixture holds too much product and the reverse reaction proceeds: CO₂ and H₂ are consumed and CO and H₂O form until Q = 5.4.
        (e) At mixing, the reverse rate (which depends on [CO₂] and [H₂]) exceeds the forward rate (which depends on [CO] and [H₂O]). As products are consumed the reverse rate falls, and as reactants form the forward rate rises; when the two rates become equal, concentrations stop changing and the system is at equilibrium with Q = K.
        (f) K falls from 5.4 to 1.4 as the temperature rises, so raising the temperature favours the reactants; heat must therefore be a product, and the reaction is exothermic (ΔH < 0). Qualitatively, adding heat to an exothermic equilibrium pushes it toward the reactants, lowering K.
      explanation: |
        Six points.

        (a) 1 pt: correct Kc expression and Δn = 0 reasoning for Kp = Kc.
        (b) 1 pt: initial 0.400 M each, x = 0.280 M, equilibrium 0.120, 0.120, 0.280, 0.280 M.
        (c) 1 pt: Kc = 5.4 computed from the concentrations and compared.
        (d) 1 pt: Q = 9.0 > K, reverse direction, with the comparison stated.
        (e) 1 pt: reverse rate initially exceeds forward rate; rates converge; equal at equilibrium.
        (f) 1 pt: exothermic, because K decreases with increasing temperature (accept a Le Châtelier or van 't Hoff argument).
