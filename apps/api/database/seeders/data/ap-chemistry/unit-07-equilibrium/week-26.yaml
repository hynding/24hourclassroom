        Three points.

        (a) 1 pt: both threshold concentrations (8.5 × 10⁻¹⁵ M and 1.8 × 10⁻⁸ M) and AgI first.
        (b) 1 pt: [I⁻] = 4.7 × 10⁻⁹ M (accept 4.6–4.8 × 10⁻⁹).
        (c) 1 pt: effective separation, justified by the negligible fraction of iodide remaining.

    # ---- Long answer
    - slug: apchem-u07-w26-q23
      type: long_answer
      topic_code: "7.13"
      source: "general knowledge"
      points: 6
      prompt: |
        Magnesium hydroxide, Mg(OH)₂, has Ksp = 5.6 × 10⁻¹² at 298 K. (R = 8.314 J/(mol·K); Kw = 1.0 × 10⁻¹⁴.)
        (a) Write the dissolution equation and the Ksp expression.
        (b) Calculate the molar solubility of Mg(OH)₂ in pure water and the pH of the saturated solution.
        (c) Calculate the molar solubility in a solution buffered at pH 13.00 and explain the difference from part (b) in terms of Q and Ksp.
        (d) Explain, in terms of Q and Ksp, why Mg(OH)₂ dissolves readily in dilute HCl.
        (e) Calculate ΔG° at 298 K for the dissolution and interpret its sign.
        (f) A student claims that because Mg(OH)₂ is 'insoluble', its saturated solution must be neutral. Evaluate the claim.
      answer: |
        (a) Mg(OH)₂(s) ⇌ Mg²⁺(aq) + 2 OH⁻(aq); Ksp = [Mg²⁺][OH⁻]².
        (b) Ksp = s(2s)² = 4s³, so s = ∛(5.6 × 10⁻¹²/4) = ∛(1.4 × 10⁻¹²) = 1.1 × 10⁻⁴ M. [OH⁻] = 2s = 2.2 × 10⁻⁴ M, pOH = 3.65, pH = 10.35.
        (c) At pH 13.00, pOH = 1.00 and [OH⁻] = 0.10 M is fixed by the buffer. s = [Mg²⁺] = 5.6 × 10⁻¹²/(0.10)² = 5.6 × 10⁻¹⁰ M. The hydroxide ion is a common ion: with [OH⁻] already 0.10 M, Q reaches Ksp after only 5.6 × 10⁻¹⁰ M dissolves, about 200,000 times less than in water.
        (d) H⁺ from the acid reacts with OH⁻ (H⁺ + OH⁻ → H₂O), lowering [OH⁻] so that Q = [Mg²⁺][OH⁻]² falls below Ksp; the solid dissolves to raise Q back toward Ksp, and as long as acid is present the OH⁻ keeps being removed, so dissolving continues (Le Châtelier: a product is removed).
        (e) ΔG° = −RT ln Ksp = −(8.314)(298) ln(5.6 × 10⁻¹²) = −(2,478 J/mol)(−25.91) = +64,200 J/mol = +64.2 kJ/mol. Positive: dissolving to 1 M ions is unfavourable, consistent with K ≪ 1 and the small solubility.
        (f) The claim is wrong. 'Insoluble' means a tiny Ksp, not zero; the solubility that does occur releases 2.2 × 10⁻⁴ M OH⁻, giving pH 10.35, distinctly basic (this is why milk of magnesia is an antacid). A saturated solution of a sparingly soluble hydroxide is basic to the extent Ksp allows.
      explanation: |
        Six points.

        (a) 1 pt: balanced dissolution equation and Ksp = [Mg²⁺][OH⁻]².
        (b) 1 pt: s = 1.1 × 10⁻⁴ M and pH = 10.3–10.4 (via [OH⁻] = 2s).
        (c) 1 pt: s = 5.6 × 10⁻¹⁰ M with the common-ion / Q = Ksp explanation.
        (d) 1 pt: H⁺ removes OH⁻, Q < Ksp, dissolving continues.
        (e) 1 pt: ΔG° = +64 kJ/mol (accept 63–65) and interpretation (unfavourable, K < 1).
        (f) 1 pt: claim rejected; saturated solution is basic (pH ≈ 10.3) because 'insoluble' means small, not zero, solubility.
