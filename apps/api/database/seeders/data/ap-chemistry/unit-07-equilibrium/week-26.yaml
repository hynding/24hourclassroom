      answer: { value: 3.0e-9, tolerance: 0.2e-9 }
      explanation: |
        pOH = 14.00 − 10.00 = 4.00, so the buffer fixes [OH⁻] = 1.0 × 10⁻⁴ M. Ksp = [Zn²⁺][OH⁻]² gives [Zn²⁺] = s = 3.0 × 10⁻¹⁷/(1.0 × 10⁻⁴)² = 3.0 × 10⁻¹⁷/1.0 × 10⁻⁸ = 3.0 × 10⁻⁹ M. The hydroxide concentration is set by the buffer, not by 2s.

    - slug: apchem-u07-w26-q20
