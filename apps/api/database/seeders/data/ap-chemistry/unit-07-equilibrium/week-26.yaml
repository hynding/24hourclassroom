week: 26
unit: 7
title: "Common Ions, pH and the Thermodynamics of Dissolving"
topics: ["7.12", "7.13", "7.14"]
guide: guides/week-26.md
guide_description: |
  The common-ion effect explained by Le Châtelier and by Q against Ksp, with solubility calculations in
  solutions that already contain one of the salt's ions and the logic of selective precipitation; why salts
  with basic anions dissolve in acid and salts of strong-acid anions do not, with hydroxide solubility at a
  buffered pH; and the free energy of dissolution, ΔG° = −RT ln Ksp, read through the lattice-versus-hydration
  enthalpy and the entropy of the ions against the ordering of water. Worked examples for AgCl, PbI₂, Mg(OH)₂,
  Fe(OH)₃, KNO₃ and CaCO₃.
flashcards_description: |
  28 cards on the common-ion effect, selective precipitation, the pH dependence of solubility and the enthalpy,
  entropy and free energy of dissolving.

flashcards:
  - front: Common-ion effect → definition
    back: |
      The decrease in solubility of a sparingly soluble salt in a solution that already contains one of its ions. It is a Le Châtelier shift toward the solid, or equivalently Q reaching Ksp at a much smaller amount dissolved.
    topic_code: "7.12"
  - front: Setting up Ksp with a common ion present
    back: |
      Write the common ion's concentration as (c + s) or (c + 2s) and, because c ≫ s, approximate it as c. The metal ion (or the ion not supplied by the other source) stays as s. Keep the exponent: s(c)² for a 1:2 salt.
    topic_code: "7.12"
  - front: "Worked solubility of AgCl in 0.10 M NaCl"
    back: |
      Ksp = [Ag⁺][Cl⁻] = s(0.10) = 1.8 × 10⁻¹⁰, so s = 1.8 × 10⁻⁹ M, about 7,000 times smaller than in pure water (1.3 × 10⁻⁵ M).
    topic_code: "7.12"
  - front: "Worked solubility of PbI₂ in 0.050 M KI"
    back: |
      Ksp = s(0.050)² = 9.8 × 10⁻⁹, so s = 3.9 × 10⁻⁶ M (pure water: 1.35 × 10⁻³ M). The iodide concentration is squared because I⁻ has coefficient 2.
    topic_code: "7.12"
  - front: Which common ion suppresses solubility more, at equal concentration?
    back: |
      The ion with the larger exponent in Ksp. For PbI₂, 0.050 M I⁻ (squared) gives s = 3.9 × 10⁻⁶ M while 0.050 M Pb²⁺ gives s = 2.2 × 10⁻⁴ M.
    topic_code: "7.12"
  - front: Q explanation of the common-ion effect
    back: |
      If the salt dissolved to its pure-water solubility in the presence of the added ion, Q would exceed Ksp; so dissolving stops much earlier, at the smaller s for which Q = Ksp.
    topic_code: "7.12"
  - front: Does a common ion change Ksp?
    back: |
      No. Ksp is a constant at a given temperature; the common ion changes the solubility (how much dissolves), not the product of the ion concentrations at saturation.
    topic_code: "7.12"
  - front: Selective precipitation → principle
    back: |
      When a precipitating ion is added slowly to a mixture, the salt with the smallest Ksp (for the same formula type) precipitates first; the second begins only when the first ion is almost entirely removed.
    topic_code: "7.12"
  - front: "Worked selective precipitation of I⁻ before Cl⁻ with Ag⁺"
    back: |
      From 0.010 M each: AgI starts at [Ag⁺] = 8.5 × 10⁻¹⁷/0.010 = 8.5 × 10⁻¹⁵ M, AgCl at 1.8 × 10⁻⁸ M. When AgCl begins, [I⁻] = 8.5 × 10⁻¹⁷/1.8 × 10⁻⁸ = 4.7 × 10⁻⁹ M: essentially all removed.
    topic_code: "7.12"
  - front: Why salts of basic anions dissolve in acid
    back: |
      H⁺ reacts with the anion (OH⁻ → H₂O, CO₃²⁻ → CO₂ + H₂O, F⁻ → HF), removing it from solution. Q falls below Ksp, so more solid dissolves to restore Q = Ksp.
    topic_code: "7.13"
  - front: Anions whose salts are more soluble at low pH
    back: |
      Conjugate bases of weak acids: OH⁻, CO₃²⁻, PO₄³⁻, F⁻, S²⁻, CH₃COO⁻, CN⁻. Their sparingly soluble salts (hydroxides, carbonates, phosphates, fluorides, sulfides) dissolve in acid.
    topic_code: "7.13"
  - front: Anions whose salts are essentially unaffected by pH
    back: |
      Conjugate bases of strong acids: Cl⁻, Br⁻, I⁻, NO₃⁻, ClO₄⁻, and to a good approximation SO₄²⁻. They do not consume H⁺, so acid changes nothing in Ksp. AgCl and BaSO₄ stay insoluble in acid.
    topic_code: "7.13"
  - front: Solubility of a hydroxide at a buffered pH
    back: |
      The buffer fixes [OH⁻] = 10^(−pOH), which acts as a common ion. For M(OH)₂, s = [M²⁺] = Ksp/[OH⁻]²; do not set [OH⁻] = 2s.
    topic_code: "7.13"
  - front: "Worked Mg(OH)₂ solubility at pH 13.00"
    back: |
      [OH⁻] = 0.10 M. s = 5.6 × 10⁻¹²/(0.10)² = 5.6 × 10⁻¹⁰ M, versus 1.1 × 10⁻⁴ M in pure water.
    topic_code: "7.13"
  - front: The pH at which a metal hydroxide begins to precipitate
    back: |
      Set Q = Ksp with the given metal-ion concentration and solve for [OH⁻], then pOH and pH. Fe(OH)₃ (Ksp = 2.8 × 10⁻³⁹) from 0.010 M Fe³⁺ starts at [OH⁻] = 6.5 × 10⁻¹³ M, pH ≈ 1.8.
    topic_code: "7.13"
  - front: Everyday chemistry of pH and solubility
    back: |
      Milk of magnesia (Mg(OH)₂) dissolves in stomach acid; limestone and marble weather in acid rain; tooth enamel (a phosphate) dissolves at the low pH of plaque; ocean acidification lowers carbonate for shells.
    topic_code: "7.13"
  - front: Free energy of dissolution → relation to Ksp
    back: |
      ΔG° = −RT ln Ksp with R = 8.314 J/(mol·K) and T in kelvin. A tiny Ksp gives a large positive ΔG°: dissolving to 1 M ions is unfavourable, the thermodynamic meaning of 'insoluble'.
    topic_code: "7.14"
  - front: "Worked ΔG° of dissolving AgCl at 298 K"
    back: |
      ΔG° = −(8.314)(298) ln(1.8 × 10⁻¹⁰) = −(2,478 J/mol)(−22.44) = +55.6 kJ/mol.
    topic_code: "7.14"
  - front: Two contributions to the enthalpy of solution
    back: |
      Breaking the ionic lattice (endothermic, the lattice energy) and hydrating the separated ions (exothermic, the hydration energy). Their near-cancellation makes ΔH°soln small and of either sign.
    topic_code: "7.14"
  - front: Two contributions to the entropy of solution
    back: |
      Ions leaving an ordered lattice for the solution gain entropy; water molecules that organise around each ion lose entropy. Small, highly charged ions order water so strongly that ΔS°soln can be negative.
    topic_code: "7.14"
  - front: Why KNO₃ dissolves although its dissolution is endothermic
    back: |
      ΔH° = +35 kJ/mol but ΔS° = +117 J/(mol·K), so at 298 K ΔG° = 35 − 298(0.117) ≈ 0 and the process is driven by the entropy gain; its solubility climbs steeply with temperature.
    topic_code: "7.14"
  - front: Sign of ΔG° for dissolving and the direction of solubility with temperature
    back: |
      Temperature dependence follows the sign of ΔH°soln: endothermic dissolving (most solids) becomes more favourable, and K rises, on heating; exothermic dissolving (NaOH, CaCl₂, most gases) becomes less favourable.
    topic_code: "7.14"
  - front: Why sparingly soluble salts tend to have positive ΔG° of dissolution
    back: |
      Small or highly charged ions (Ca²⁺, Al³⁺, F⁻, OH⁻, CO₃²⁻) have very large lattice energies (positive ΔH°) and order water strongly (negative or small ΔS°), so ΔH° − TΔS° is positive.
    topic_code: "7.14"
  - front: Temperature at which an endothermic dissolution becomes favourable
    back: |
      ΔG° = 0 when T = ΔH°/ΔS° (same units for both). A salt with ΔH° = +25.0 kJ/mol and ΔS° = +50.0 J/(mol·K) reaches ΔG° = 0 at 500 K; above that, K > 1.
    topic_code: "7.14"
  - front: Hot packs and cold packs as dissolution thermodynamics
    back: |
      CaCl₂ dissolves exothermically (ΔH° ≈ −82 kJ/mol) with ΔS° > 0: a hot pack. NH₄NO₃ dissolves endothermically (ΔH° ≈ +26 kJ/mol) driven by ΔS°: a cold pack.
    topic_code: "7.14"
  - front: Converting ΔG° to K for a dissolution
    back: |
      K = e^(−ΔG°/RT). For ΔG° = +10.1 kJ/mol at 298 K, K = e^(−10,100/2,478) = e^(−4.08) = 0.017.
    topic_code: "7.14"
  - front: Common-ion effect and buffers → preview
    back: |
      A buffer is the common-ion effect applied to a weak acid: adding the conjugate base (a common ion) suppresses the acid's ionisation exactly as added Cl⁻ suppresses the dissolving of AgCl.
    topic_code: "7.12"
  - front: Units check for ΔG° = ΔH° − TΔS°
    back: |
      ΔH° is usually in kJ/mol and ΔS° in J/(mol·K); divide ΔS° by 1,000 (or multiply ΔH° by 1,000) before subtracting. T must be in kelvin.
    topic_code: "7.14"

quiz:
  description: |
    23 questions · about 45 minutes · topics 7.12–7.14 (the common-ion effect, pH and solubility, and the free
    energy of dissolution), with review of Ksp and precipitation, Le Châtelier's principle, lattice energy,
    enthalpy of solution, calorimetry and hydration. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: Ksp table (7.12, 7.13, 7.14)
    - slug: apchem-u07-w26-q01
      type: multiple_choice
      topic_code: "7.12"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table: solubility products at 25 °C. AgCl 1.8 × 10⁻¹⁰; AgBr 5.4 × 10⁻¹³; AgI 8.5 × 10⁻¹⁷; Ag₂CO₃ 8.5 × 10⁻¹²; Mg(OH)₂ 5.6 × 10⁻¹²; CaCO₃ 3.4 × 10⁻⁹.
      prompt: |
        What is the molar solubility of AgBr in 0.20 M NaBr?
      options:
        - "7.3 × 10⁻⁷ M"
        - "2.7 × 10⁻¹² M"
        - "1.1 × 10⁻¹³ M"
        - "2.7 × 10⁻⁶ M"
      option_explanations:
        - |
          7.3 × 10⁻⁷ M is √Ksp, the solubility in pure water; it ignores the bromide already present.
        - |
          Correct. [Br⁻] ≈ 0.20 M (the common ion), so Ksp = s(0.20) and s = 5.4 × 10⁻¹³/0.20 = 2.7 × 10⁻¹² M.
        - |
          1.1 × 10⁻¹³ M is Ksp × 0.20; the common-ion concentration must divide Ksp, not multiply it.
        - |
          2.7 × 10⁻⁶ M is off by a factor of 10⁶; the exponent of Ksp was mishandled.
      answer: 1
      explanation: |
        Practice 5. Ksp = [Ag⁺][Br⁻] with [Br⁻] fixed by the NaBr; s = Ksp/[Br⁻].

    - slug: apchem-u07-w26-q02
      type: multiple_choice
      topic_code: "7.13"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table: solubility products at 25 °C. AgCl 1.8 × 10⁻¹⁰; AgBr 5.4 × 10⁻¹³; AgI 8.5 × 10⁻¹⁷; Ag₂CO₃ 8.5 × 10⁻¹²; Mg(OH)₂ 5.6 × 10⁻¹²; CaCO₃ 3.4 × 10⁻⁹.
      prompt: |
        Which of the salts in the table become noticeably more soluble when the solution is acidified with HNO₃?
      options:
        - "AgCl, AgBr and AgI, because H⁺ reacts with the halide ions"
        - "Mg(OH)₂ only, because it is the only base in the table"
        - "Ag₂CO₃, Mg(OH)₂ and CaCO₃, because CO₃²⁻ and OH⁻ react with H⁺"
        - "All six, because adding any strong electrolyte increases solubility"
      option_explanations:
        - |
          Cl⁻, Br⁻ and I⁻ are conjugate bases of strong acids; they do not react with H⁺, so the silver halides stay just as insoluble in acid.
        - |
          Carbonate is also a weak base: it reacts with H⁺ to give CO₂ and water, so both carbonates dissolve in acid as well.
        - |
          Correct. H⁺ removes CO₃²⁻ (as CO₂ + H₂O) and OH⁻ (as H₂O), lowering Q below Ksp so that more solid dissolves.
        - |
          Only salts whose anion is a weak base respond to acid; an added electrolyte with no reacting ion has only a small effect.
      answer: 2
      explanation: |
        Practice 6. Basic anions are consumed by acid; strong-acid anions are not.

    - slug: apchem-u07-w26-q03
      type: numeric
      topic_code: "7.14"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table: solubility products at 25 °C. AgCl 1.8 × 10⁻¹⁰; AgBr 5.4 × 10⁻¹³; AgI 8.5 × 10⁻¹⁷; Ag₂CO₃ 8.5 × 10⁻¹²; Mg(OH)₂ 5.6 × 10⁻¹²; CaCO₃ 3.4 × 10⁻⁹.
      prompt: |
        Calculate ΔG° in kJ/mol at 298 K for CaCO₃(s) ⇌ Ca²⁺(aq) + CO₃²⁻(aq), using ΔG° = −RT ln K with R = 8.314 J/(mol·K). Give your answer to three significant figures.
      answer: { value: 48.3, tolerance: 0.5 }
      explanation: |
        ln(3.4 × 10⁻⁹) = −19.50. ΔG° = −(8.314 J/(mol·K))(298 K)(−19.50) = +48,300 J/mol = +48.3 kJ/mol. The large positive value is the thermodynamic statement that calcium carbonate is sparingly soluble: dissolving to 1 M ions is strongly unfavourable.

    # ---- Stand-alone multiple choice
    - slug: apchem-u07-w26-q04
      type: multiple_choice
      topic_code: "7.12"
      source: "general knowledge"
      points: 1
      prompt: |
        Solid NaCl is stirred into a saturated solution of AgCl that is in contact with excess AgCl(s). Which statement correctly explains what happens?
      options:
        - "[Cl⁻] rises, so Q > Ksp and AgCl precipitates until [Ag⁺][Cl⁻] again equals Ksp; [Ag⁺] falls."
        - "[Cl⁻] rises, so Ksp increases and more AgCl dissolves."
        - "Nothing happens, because NaCl and AgCl are different compounds."
        - "[Cl⁻] rises, so Q < Ksp and more AgCl dissolves to use up the extra chloride."
      option_explanations:
        - |
          Correct. The added Cl⁻ makes the ion product exceed Ksp; the equilibrium shifts toward the solid (Le Châtelier), removing Ag⁺ and some Cl⁻ until Q = Ksp again.
        - |
          Ksp is a constant at fixed temperature; the common ion changes the solubility, not Ksp.
        - |
          The chloride ion is common to both salts, and it enters the Ksp expression for AgCl.
        - |
          Raising [Cl⁻] raises Q above Ksp; dissolving more AgCl would raise Q further still.
      answer: 0
      explanation: |
        Practice 6. The common-ion effect is Q > Ksp after the addition, resolved by precipitation.

    - slug: apchem-u07-w26-q05
      type: multiple_choice
      topic_code: "7.12"
      source: "general knowledge"
      points: 1
      prompt: |
        In which of these solutions is the molar solubility of PbI₂ (Ksp = 9.8 × 10⁻⁹) lowest?
      options:
        - "Pure water"
        - "0.10 M KNO₃"
        - "0.10 M Pb(NO₃)₂"
        - "0.10 M KI"
      option_explanations:
        - |
          In pure water s = ∛(Ksp/4) = 1.35 × 10⁻³ M, the largest of the four.
        - |
          K⁺ and NO₃⁻ are not ions of PbI₂; they have no common-ion effect, so the solubility is essentially that in pure water.
        - |
          With [Pb²⁺] = 0.10 M, Ksp = 0.10(2s)² gives s = √(9.8 × 10⁻⁹/0.40) = 1.6 × 10⁻⁴ M, reduced but less than with iodide.
        - |
          Correct. With [I⁻] = 0.10 M, Ksp = s(0.10)² gives s = 9.8 × 10⁻⁹/0.010 = 9.8 × 10⁻⁷ M, the smallest, because the iodide concentration is squared in Ksp.
      answer: 3
      explanation: |
        Practice 5. The common ion with the larger exponent suppresses solubility more at equal concentration.

    - slug: apchem-u07-w26-q06
      type: multiple_choice
      topic_code: "7.13"
      source: "general knowledge"
      points: 1
      prompt: |
        Magnesium hydroxide, Mg(OH)₂, is only slightly soluble in water but dissolves readily in dilute hydrochloric acid. Which explanation is correct?
      options:
        - "HCl supplies Cl⁻, which forms soluble MgCl₂ and pulls Mg²⁺ out of the solid."
        - "H⁺ reacts with OH⁻ to form water, lowering [OH⁻] so that Q < Ksp and more Mg(OH)₂ dissolves."
        - "Acid raises the temperature of the solution, and Ksp increases with temperature."
        - "The acid lowers Ksp, so more solid is needed to reach saturation."
      option_explanations:
        - |
          MgCl₂ is soluble, but chloride is not what drives the dissolving; nitric or sulfuric acid dissolves Mg(OH)₂ just as well because the active species is H⁺.
        - |
          Correct. Removing OH⁻ by neutralisation keeps the ion product below Ksp, so the dissolving equilibrium keeps shifting right (Le Châtelier: a product is removed).
        - |
          Any warming is incidental; the effect is seen at constant temperature and is due to the reaction of H⁺ with OH⁻.
        - |
          Ksp is unchanged at a given temperature; the acid changes [OH⁻], not the constant.
      answer: 1
      explanation: |
        Practice 6. Removing a product ion of a solubility equilibrium shifts it toward dissolving.

    - slug: apchem-u07-w26-q07
      type: multiple_choice
      topic_code: "7.13"
      source: "general knowledge"
      points: 1
      prompt: |
        The solubility of which salt is essentially unaffected by lowering the pH of the solution?
      options:
        - "CaF₂"
        - "BaCO₃"
        - "AgCl"
        - "Mg(OH)₂"
      option_explanations:
        - |
          F⁻ is the conjugate base of the weak acid HF; H⁺ converts it to HF, so CaF₂ is more soluble in acid.
        - |
          CO₃²⁻ reacts with H⁺ to give HCO₃⁻, then CO₂ and water, so BaCO₃ dissolves in acid.
        - |
          Correct. Cl⁻ is the conjugate base of the strong acid HCl; it has no tendency to bind H⁺, so acid leaves [Cl⁻] and the AgCl equilibrium unchanged.
        - |
          OH⁻ is neutralised by H⁺, so Mg(OH)₂ dissolves readily in acid.
      answer: 2
      explanation: |
        Practice 6. Only salts of weak-acid anions respond to pH.

    - slug: apchem-u07-w26-q08
      type: multiple_choice
      topic_code: "7.14"
      source: "general knowledge"
      points: 1
      prompt: |
        For a sparingly soluble salt such as BaSO₄ (Ksp = 1.1 × 10⁻¹⁰), what is the sign of ΔG° for the dissolution reaction at 25 °C, and why?
      options:
        - "Positive, because ΔG° = −RT ln Ksp and ln Ksp is a large negative number."
        - "Negative, because some of the salt does dissolve."
        - "Zero, because the saturated solution is at equilibrium."
        - "Positive, because dissolving any solid is always endothermic."
      option_explanations:
        - |
          Correct. −RT ln(1.1 × 10⁻¹⁰) = −(2,478)(−22.9) ≈ +57 kJ/mol. A positive ΔG° means K < 1: forming 1 M ions from the solid is unfavourable, which is what 'sparingly soluble' means thermodynamically.
        - |
          A small amount dissolving is consistent with a tiny K and a positive ΔG°; ΔG° refers to the standard state of 1 M ions, not to the trace that dissolves.
        - |
          ΔG (no superscript) is zero at equilibrium; ΔG° is the standard-state value and is non-zero whenever K ≠ 1.
        - |
          Many dissolutions are exothermic (NaOH, CaCl₂); the sign of ΔG° comes from both ΔH° and ΔS°, and here it is fixed by Ksp.
      answer: 0
      explanation: |
        Practice 5. ΔG° and K are linked by ΔG° = −RT ln K; K ≪ 1 means ΔG° ≫ 0.

    - slug: apchem-u07-w26-q09
      type: multiple_choice
      topic_code: "7.14"
      source: "general knowledge"
      points: 1
      prompt: |
        Potassium nitrate dissolves in water with ΔH° = +35 kJ/mol, yet it is very soluble at room temperature. Which statement best explains this?
      options:
        - "The hydration energy of K⁺ and NO₃⁻ exceeds the lattice energy, making the process favourable."
        - "Endothermic processes are always favourable at high enough concentration."
        - "The dissolution is driven by the heat absorbed from the surroundings."
        - "ΔS° for the dissolution is large and positive, so −TΔS° outweighs the positive ΔH° and ΔG° is near zero or negative."
      option_explanations:
        - |
          If hydration exceeded the lattice energy the process would be exothermic; ΔH° = +35 kJ/mol says the opposite.
        - |
          Concentration does not change the sign of a thermodynamic driving force in this way; ΔG° is set by ΔH° and ΔS°.
        - |
          Absorbing heat is a cost, not a driving force; what pays for it is the entropy increase.
        - |
          Correct. For KNO₃, ΔS° ≈ +117 J/(mol·K); at 298 K, TΔS° ≈ 35 kJ/mol, cancelling the enthalpy cost. The entropy gain of the ions leaving the lattice drives the process, and solubility rises steeply with temperature.
      answer: 3
      explanation: |
        Practice 6. ΔG° = ΔH° − TΔS°: an endothermic process is favourable when TΔS° is large enough.

    - slug: apchem-u07-w26-q10
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which comparison of lattice energies is correct, and what does it imply for the enthalpy of dissolution?
      options:
        - "NaCl has a larger lattice energy than MgO, because Na⁺ is smaller than Mg²⁺, so NaCl dissolves less readily."
        - "MgO has a larger lattice energy than NaCl, because its ions carry twice the charge, so more energy must be supplied to separate its ions when it dissolves."
        - "The two lattice energies are equal, because both are 1:1 ionic solids with the rock-salt structure."
        - "MgO has a smaller lattice energy than NaCl, because O²⁻ is a larger ion than Cl⁻."
      option_explanations:
        - |
          Na⁺ is in fact larger than Mg²⁺, and the charge effect dominates: MgO's lattice energy is roughly four times NaCl's.
        - |
          Correct. Coulomb's law makes the lattice energy proportional to the product of the ion charges (2 × 2 versus 1 × 1) divided by the ion separation; MgO's ~3,800 kJ/mol against NaCl's ~790 kJ/mol is a large enthalpy cost that hydration cannot repay, so MgO is essentially insoluble.
        - |
          Sharing a structure does not equalise lattice energies; the charges and sizes of the ions set the magnitude.
        - |
          O²⁻ is slightly larger than Cl⁻ only in some comparisons, and the doubled charges on both ions far outweigh any size effect.
      answer: 1
      explanation: |
        Practice 6 (review of 2.1). Lattice energy follows Coulomb's law; it is the endothermic half of ΔH° of solution.

    - slug: apchem-u07-w26-q11
      type: multiple_choice
      topic_code: "7.11"
      source: "general knowledge"
      points: 1
      prompt: |
        The molar solubility of calcium hydroxide, Ca(OH)₂, in pure water at 25 °C is 0.011 M. What is its Ksp?
      options:
        - "1.2 × 10⁻⁴"
        - "1.3 × 10⁻⁶"
        - "5.3 × 10⁻⁶"
        - "2.7 × 10⁻⁷"
      option_explanations:
        - |
          1.2 × 10⁻⁴ is s², the expression for a 1:1 salt; Ca(OH)₂ releases two OH⁻ per formula unit.
        - |
          1.3 × 10⁻⁶ is s³, which omits the factor of 4 from (2s)².
        - |
          Correct. Ksp = [Ca²⁺][OH⁻]² = s(2s)² = 4s³ = 4(0.011)³ = 4 × 1.33 × 10⁻⁶ = 5.3 × 10⁻⁶.
        - |
          2.7 × 10⁻⁷ is s³/4, dividing by 4 instead of multiplying.
      answer: 2
      explanation: |
        Practice 5 (review of 7.11). For a 1:2 salt Ksp = 4s³.

    # ---- Multi-select
    - slug: apchem-u07-w26-q12
      type: multi_select
      topic_code: "7.13"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following sparingly soluble salts are more soluble in 0.1 M HCl than in pure water? Select all that apply.
      options:
        - "CaCO₃"
        - "BaSO₄"
        - "AgBr"
        - "Zn(OH)₂"
        - "Ca₃(PO₄)₂"
        - "AgCH₃COO (silver acetate)"
      option_explanations:
        - |
          Correct. Carbonate is a weak base; H⁺ converts it to CO₂ and water, lowering Q below Ksp.
        - |
          Sulfate is the conjugate base of HSO₄⁻, a fairly strong acid; H⁺ barely binds it, so acid has no significant effect on BaSO₄.
        - |
          Bromide is the conjugate base of the strong acid HBr; it does not react with H⁺.
        - |
          Correct. Hydroxide is neutralised by H⁺, so the hydroxide equilibrium shifts toward dissolving.
        - |
