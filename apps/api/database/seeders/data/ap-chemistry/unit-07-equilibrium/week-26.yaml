      prompt: |
        5.00 g of NH₄NO₃ (80.04 g/mol) is dissolved in 100.0 g of water in a coffee-cup calorimeter and the temperature falls by 3.6 °C. Treating the solution as having the heat capacity of the 100.0 g of water (c = 4.184 J/(g·°C)), calculate ΔH of dissolution in kJ/mol. Give your answer to two significant figures (positive for endothermic).
      answer: { value: 24, tolerance: 1 }
      explanation: |
        Heat lost by the water: q = (100.0 g)(4.184 J/(g·°C))(−3.6 °C) = −1,506 J, so the dissolution absorbed +1,506 J. Moles: 5.00/80.04 = 0.0625 mol. ΔH = 1,506 J/0.0625 mol = 24,100 J/mol = +24 kJ/mol. The positive sign (endothermic) is why ammonium nitrate is used in instant cold packs; the process is driven by the entropy gain of the ions.

    # ---- Short answer
    - slug: apchem-u07-w26-q21
      type: short_answer
      topic_code: "7.14"
      source: "general knowledge"
      points: 3
      prompt: |
        A sparingly soluble salt MX dissolves with ΔH° = +25.0 kJ/mol and ΔS° = +50.0 J/(mol·K).
        (a) Calculate ΔG° for the dissolution at 298 K and state whether the salt is appreciably soluble under standard conditions.
        (b) Calculate the temperature at which ΔG° = 0.
        (c) Predict, with a thermodynamic justification, whether the solubility of MX increases or decreases as the temperature is raised.
      answer: |
        (a) ΔG° = ΔH° − TΔS° = 25.0 kJ/mol − (298 K)(0.0500 kJ/(mol·K)) = 25.0 − 14.9 = +10.1 kJ/mol. Positive, so K = Ksp < 1 (K = e^(−10,100/(8.314 × 298)) ≈ 0.017): the salt is not appreciably soluble under standard conditions.
        (b) ΔG° = 0 when T = ΔH°/ΔS° = 25,000 J/mol ÷ 50.0 J/(mol·K) = 500 K.
        (c) Increases. ΔH° > 0 and ΔS° > 0, so as T rises the −TΔS° term grows more negative and ΔG° falls, making Ksp larger (ΔG° = −RT ln K). Equivalently, heat is a reactant in an endothermic dissolution and heating shifts the equilibrium toward dissolving.
      explanation: |
        Three points.

        (a) 1 pt: ΔG° = +10.1 kJ/mol (accept 10–10.2) with units converted, and 'not appreciably soluble' / K < 1.
        (b) 1 pt: T = 500 K.
        (c) 1 pt: solubility increases, justified by the sign of ΔH° (and ΔS°) through ΔG° = ΔH° − TΔS° or Le Châtelier.

    - slug: apchem-u07-w26-q22
      type: short_answer
