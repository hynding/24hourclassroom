    # ---- Numeric
    - slug: apchem-u07-w26-q18
      type: numeric
      topic_code: "7.12"
      source: "general knowledge"
      points: 1
      prompt: |
        Ksp for CaF₂ is 3.5 × 10⁻¹¹. Calculate its molar solubility in 0.10 M NaF in mol/L. Give your answer to two significant figures (for example 2.3e-9 for 2.3 × 10⁻⁹).
      answer: { value: 3.5e-9, tolerance: 0.2e-9 }
      explanation: |
        CaF₂(s) ⇌ Ca²⁺ + 2 F⁻. [Ca²⁺] = s; [F⁻] = 0.10 + 2s ≈ 0.10 M. Ksp = s(0.10)² = 0.010s, so s = 3.5 × 10⁻¹¹/0.010 = 3.5 × 10⁻⁹ M. In pure water s = ∛(Ksp/4) = 2.1 × 10⁻⁴ M, about 60,000 times larger. The 2s is dropped but the square on the fluoride concentration is kept.

