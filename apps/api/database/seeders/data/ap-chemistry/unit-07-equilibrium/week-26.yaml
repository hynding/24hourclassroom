      prompt: |
        A solution is 0.010 M in both Cl⁻ and I⁻. Solid AgNO₃ is added slowly with stirring (assume no volume change). Ksp: AgCl 1.8 × 10⁻¹⁰; AgI 8.5 × 10⁻¹⁷.
        (a) Calculate the [Ag⁺] at which each salt begins to precipitate and identify which precipitates first.
        (b) Calculate [I⁻] remaining in solution at the moment AgCl begins to precipitate.
        (c) Explain whether this procedure could separate the two halide ions effectively.
      answer: |
        (a) AgI: [Ag⁺] = Ksp/[I⁻] = 8.5 × 10⁻¹⁷/0.010 = 8.5 × 10⁻¹⁵ M. AgCl: [Ag⁺] = 1.8 × 10⁻¹⁰/0.010 = 1.8 × 10⁻⁸ M. AgI precipitates first, at a silver-ion concentration about two million times smaller.
        (b) When [Ag⁺] reaches 1.8 × 10⁻⁸ M, [I⁻] = Ksp(AgI)/[Ag⁺] = 8.5 × 10⁻¹⁷/1.8 × 10⁻⁸ = 4.7 × 10⁻⁹ M.
        (c) Yes. Only 4.7 × 10⁻⁹/0.010 = 4.7 × 10⁻⁵ % of the original iodide remains in solution when the first AgCl appears, so essentially all the iodide can be filtered off as AgI before any chloride precipitates.
