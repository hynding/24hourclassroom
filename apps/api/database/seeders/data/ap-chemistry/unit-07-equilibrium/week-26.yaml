    # ---- True / false
    - slug: apchem-u07-w26-q14
      type: true_false
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: when a salt dissolves and the solution becomes warmer, ΔH for the dissolution is negative, and the lattice energy of the salt is smaller in magnitude than the total hydration energy of its ions.
      answer: true
      explanation: |
        True. Warming of the solution means the system released heat: the dissolution is exothermic, ΔH°soln < 0. The enthalpy of solution is (lattice energy to separate the ions, endothermic) + (hydration energy, exothermic); a negative sum means the hydration energy released exceeds the lattice energy absorbed, as for CaCl₂ or NaOH.

