  # ---- True/false
  - slug: apchem-u07-exam-q31
    type: true_false
    topic_code: "7.1"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: at equilibrium the concentrations of reactants and products must be equal to each other.
    answer: false
    explanation: |
      False. Equilibrium means the concentrations are constant, because the forward and reverse rates are equal; the concentrations themselves are set by K and are usually very different. For K = 50, H₂ + I₂ ⇌ 2 HI gives [HI] seven times [H₂].

  - slug: apchem-u07-exam-q32
    type: true_false
    topic_code: "7.12"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: the Ksp of silver chloride is the same in 0.10 M NaCl as in pure water, even though far less AgCl dissolves in the NaCl solution.
    answer: true
    explanation: |
      True. Ksp is an equilibrium constant and depends only on temperature. The common ion lowers the molar solubility (from 1.3 × 10⁻⁵ M to 1.8 × 10⁻⁹ M) because the product [Ag⁺][Cl⁻] reaches 1.8 × 10⁻¹⁰ after much less solid dissolves.

  - slug: apchem-u07-exam-q33
    type: true_false
    topic_code: "7.14"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: a positive ΔG° for the dissolution of a salt means that none of the salt dissolves in water.
    answer: false
    explanation: |
      False. A positive ΔG° means K = Ksp < 1: forming 1 M ions from the solid is unfavourable, so the salt is sparingly soluble, but some does dissolve until Q = Ksp. AgCl has ΔG° = +55.6 kJ/mol of dissolution and still dissolves to 1.3 × 10⁻⁵ M.

  # ---- Fill in the blank
  - slug: apchem-u07-exam-q34
    type: fill_blank
    topic_code: "7.3"
    source: "general knowledge"
    points: 1
    prompt: |
      The reaction quotient Q has the same algebraic form as K; the system is at ____ when Q = K.
    answer: ["equilibrium", "chemical equilibrium", "dynamic equilibrium"]
    explanation: |
      Q is evaluated from the concentrations actually present; K is the value of Q at equilibrium. Q < K means the forward reaction proceeds, Q > K the reverse, and Q = K means there is no net change.

  - slug: apchem-u07-exam-q35
    type: fill_blank
    topic_code: "7.7"
    source: "general knowledge"
    points: 1
    prompt: |
      When K is not small enough for the small-x approximation to pass the 5% test, the equilibrium equation must be solved exactly, usually with the ____ formula.
    answer: ["quadratic", "quadratic formula", "quadratic equation"]
    explanation: |
      Clearing the denominator gives ax² + bx + c = 0, solved by x = [−b ± √(b² − 4ac)]/(2a). The physically meaningful root is the one that leaves every equilibrium concentration positive.

  - slug: apchem-u07-exam-q36
    type: fill_blank
    topic_code: "7.11"
    source: "general knowledge"
    points: 1
    prompt: |
      A solution in which the ion product Q for a salt exactly equals Ksp is ____, meaning it is in equilibrium with the solid and will dissolve no more.
    answer: ["saturated", "a saturated solution", "saturated solution", "at saturation"]
    explanation: |
      Saturated: dissolving and precipitation occur at equal rates. Q < Ksp is unsaturated (more could dissolve); Q > Ksp is supersaturated and precipitates until Q = Ksp.

  # ---- Numeric
  - slug: apchem-u07-exam-q37
    type: numeric
    topic_code: "7.4"
    source: "general knowledge"
    points: 1
    prompt: |
      A 1.00 L flask is charged with 0.500 mol of PCl₅ and heated to 500 K. At equilibrium for PCl₅(g) ⇌ PCl₃(g) + Cl₂(g), the flask contains 0.150 mol of Cl₂. Calculate Kc at 500 K. Give your answer to two significant figures.
    answer: { value: 0.064, tolerance: 0.003 }
    explanation: |
      ICE: [PCl₅] = 0.500 − x, [PCl₃] = [Cl₂] = x, with x = 0.150 M. Kc = (0.150)(0.150)/(0.500 − 0.150) = 0.0225/0.350 = 0.064.

  - slug: apchem-u07-exam-q38
    type: numeric
    topic_code: "7.7"
    source: "general knowledge"
    points: 1
    prompt: |
      For A(aq) ⇌ B(aq) + C(aq), K = 2.0 × 10⁻⁶. A solution initially 0.50 M in A reaches equilibrium. Calculate [B] in mol/L. Give your answer to two significant figures.
    answer: { value: 0.0010, tolerance: 0.0001 }
    explanation: |
      K = x²/(0.50 − x) ≈ x²/0.50, so x² = 1.0 × 10⁻⁶ and x = 1.0 × 10⁻³ M = [B]. Check: 0.0010/0.50 = 0.2%, far under 5%, so the approximation is valid.

  - slug: apchem-u07-exam-q39
    type: numeric
    topic_code: "7.14"
    source: "general knowledge"
    points: 1
    prompt: |
      Ksp for AgBr is 5.4 × 10⁻¹³ at 298 K. Calculate ΔG° in kJ/mol for AgBr(s) ⇌ Ag⁺(aq) + Br⁻(aq) at 298 K (R = 8.314 J/(mol·K)). Give your answer to three significant figures.
    answer: { value: 70.0, tolerance: 0.5 }
    explanation: |
      ln(5.4 × 10⁻¹³) = −28.25. ΔG° = −RT ln K = −(8.314)(298)(−28.25) = +70,000 J/mol = +70.0 kJ/mol. The large positive value corresponds to the very small Ksp: AgBr is even less soluble than AgCl (+55.6 kJ/mol).

  # ---- Short answer
  - slug: apchem-u07-exam-q40
    type: short_answer
    topic_code: "7.10"
    source: "general knowledge"
    points: 3
    prompt: |
      An equilibrium mixture for N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g) in a 1.00 L vessel at 700 K contains [N₂] = 0.200 M, [H₂] = 0.600 M and [NH₃] = 0.100 M.
      (a) Calculate Kc at 700 K.
      (b) The vessel is compressed to 0.500 L at constant temperature. Calculate Q immediately after the compression.
      (c) State the direction of the net reaction after compression and justify it with your values of Q and K.
    answer: |
      (a) Kc = [NH₃]²/([N₂][H₂]³) = (0.100)²/((0.200)(0.600)³) = 0.0100/(0.200 × 0.216) = 0.0100/0.0432 = 0.23.
      (b) Every concentration doubles: [N₂] = 0.400 M, [H₂] = 1.20 M, [NH₃] = 0.200 M. Q = (0.200)²/((0.400)(1.20)³) = 0.0400/(0.400 × 1.728) = 0.0400/0.691 = 0.058.
      (c) Q = 0.058 < K = 0.23, so the forward reaction proceeds: N₂ and H₂ combine to form NH₃ until Q rises to 0.23. This is the shift toward fewer moles of gas (4 → 2) that Le Châtelier's principle predicts.
    explanation: |
      Three points.

      (a) 1 pt: Kc = 0.23 (accept 0.23–0.24) with the correct expression.
      (b) 1 pt: doubled concentrations and Q = 0.058 (accept 0.057–0.059).
      (c) 1 pt: forward direction justified by Q < K.

  - slug: apchem-u07-exam-q41
    type: short_answer
    topic_code: "7.11"
    source: "general knowledge"
    points: 3
    prompt: |
      100.0 mL of 0.0010 M CaCl₂ is mixed with 100.0 mL of 0.0020 M NaF. Ksp for CaF₂ is 3.5 × 10⁻¹¹.
      (a) Calculate [Ca²⁺] and [F⁻] immediately after mixing.
      (b) Determine whether CaF₂ precipitates, showing the comparison that decides it.
      (c) Write the net ionic equation for any precipitation and state what happens to [Ca²⁺] and [F⁻] as the system reaches equilibrium.
    answer: |
      (a) The volume doubles, so each concentration halves: [Ca²⁺] = 5.0 × 10⁻⁴ M; [F⁻] = 1.0 × 10⁻³ M.
      (b) Q = [Ca²⁺][F⁻]² = (5.0 × 10⁻⁴)(1.0 × 10⁻³)² = 5.0 × 10⁻¹⁰. Q > Ksp (5.0 × 10⁻¹⁰ > 3.5 × 10⁻¹¹), so CaF₂ precipitates.
      (c) Ca²⁺(aq) + 2 F⁻(aq) → CaF₂(s). Both concentrations fall (fluoride twice as fast as calcium) until [Ca²⁺][F⁻]² = 3.5 × 10⁻¹¹, at which point the solution is saturated and precipitation stops.
    explanation: |
      Three points.

      (a) 1 pt: both concentrations halved on mixing.
      (b) 1 pt: Q = 5.0 × 10⁻¹⁰ compared with Ksp and precipitation predicted.
      (c) 1 pt: correct net ionic equation and the statement that the ion concentrations fall until Q = Ksp.

  # ---- Long answer
  - slug: apchem-u07-exam-q42
    type: long_answer
    topic_code: "7.7"
    source: "general knowledge"
    points: 6
    prompt: |
      Phosphorus pentachloride decomposes: PCl₅(g) ⇌ PCl₃(g) + Cl₂(g). Kc = 0.040 at 500 K and 0.50 at 600 K. A 1.00 L flask at 500 K is charged with 0.250 mol of PCl₅ and no products. (R = 0.08206 L·atm/(mol·K))
      (a) Set up the ICE table and show that the equilibrium condition gives x² + 0.040x − 0.010 = 0.
      (b) Explain why the small-x approximation is not acceptable here, and solve the quadratic for the equilibrium concentrations of all three gases.
      (c) Calculate Kp at 500 K.
      (d) The flask is then expanded to 2.00 L at 500 K. Calculate Q immediately after the expansion and state the direction of the net reaction with justification.
      (e) Use the two Kc values to determine whether the decomposition is endothermic or exothermic, and explain your reasoning.
      (f) Predict, with a Q-based justification, how the percentage of PCl₅ that is decomposed at equilibrium would change if additional Cl₂ were injected into the original equilibrium mixture at 500 K.
    answer: |
      (a) Initial: [PCl₅] = 0.250 M, [PCl₃] = [Cl₂] = 0. Change: −x, +x, +x. Equilibrium: 0.250 − x, x, x. Kc = x²/(0.250 − x) = 0.040 → x² = 0.010 − 0.040x → x² + 0.040x − 0.010 = 0.
      (b) The approximation x² ≈ 0.010 gives x = 0.10 M, which is 40% of 0.250 M, far over 5%; K is not small relative to the initial concentration. Quadratic: x = [−0.040 + √(0.0016 + 0.040)]/2 = (−0.040 + 0.204)/2 = 0.082 M. [PCl₃] = [Cl₂] = 0.082 M; [PCl₅] = 0.250 − 0.082 = 0.168 M. Check: (0.082)²/0.168 = 0.040.
      (c) Δn = 2 − 1 = +1, so Kp = Kc(RT) = 0.040 × 0.08206 × 500 = 1.6.
      (d) Doubling the volume halves each concentration: [PCl₅] = 0.084 M, [PCl₃] = [Cl₂] = 0.041 M. Q = (0.041)²/0.084 = 0.00168/0.084 = 0.020. Q < K (0.020 < 0.040), so the forward reaction proceeds: more PCl₅ decomposes, toward the side with more moles of gas.
      (e) Kc rises from 0.040 at 500 K to 0.50 at 600 K: a higher temperature favours the products, so heat behaves as a reactant and the decomposition is endothermic (ΔH > 0).
      (f) Injecting Cl₂ raises [Cl₂] and therefore Q above K; the reverse reaction proceeds, consuming PCl₃ and some of the added Cl₂ and re-forming PCl₅. The percentage of the original PCl₅ decomposed at the new equilibrium is lower than before (a common-ion-style suppression), though Kc is unchanged.
    explanation: |
      Six points.

      (a) 1 pt: ICE table and derivation of x² + 0.040x − 0.010 = 0.
      (b) 1 pt: approximation rejected (x would be 40% of initial) and x = 0.082 M with [PCl₅] = 0.168 M, [PCl₃] = [Cl₂] = 0.082 M (accept 0.081–0.083).
      (c) 1 pt: Kp = 1.6 (accept 1.6–1.7) with Δn = +1.
      (d) 1 pt: Q = 0.020 < K, forward direction.
      (e) 1 pt: endothermic because K increases with temperature.
      (f) 1 pt: Q > K, reverse shift, smaller percentage decomposed, K unchanged.
