      - "CaCO₃"
      - "PbSO₄"
      - "CaF₂"
    option_explanations:
      - |
        Correct. Hydroxide is neutralised by H⁺, removing it from the Ksp equilibrium.
      - |
        Iodide is the conjugate base of the strong acid HI; it does not react with H⁺.
      - |
