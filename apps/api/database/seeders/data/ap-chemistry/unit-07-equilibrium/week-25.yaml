    # ---- Numeric
    - slug: apchem-u07-w25-q18
      type: numeric
      topic_code: "7.11"
      source: "general knowledge"
      points: 1
      prompt: |
        The molar solubility of silver chromate, Ag₂CrO₄, at 25 °C is 6.5 × 10⁻⁵ mol/L. Calculate Ksp. Give your answer to two significant figures (for example 2.3e-10 for 2.3 × 10⁻¹⁰).
      answer: { value: 1.1e-12, tolerance: 0.1e-12 }
      explanation: |
        Ag₂CrO₄(s) ⇌ 2 Ag⁺ + CrO₄²⁻: [Ag⁺] = 2s = 1.3 × 10⁻⁴ M and [CrO₄²⁻] = s = 6.5 × 10⁻⁵ M. Ksp = (2s)²(s) = 4s³ = 4(6.5 × 10⁻⁵)³ = 4 × 2.75 × 10⁻¹³ = 1.1 × 10⁻¹².

    - slug: apchem-u07-w25-q19
      type: numeric
      topic_code: "7.11"
      source: "general knowledge"
      points: 1
      prompt: |
        Ksp for magnesium hydroxide, Mg(OH)₂, is 5.6 × 10⁻¹² at 25 °C. Calculate its molar solubility in mol/L. Give your answer to two significant figures (for example 2.3e-4 for 2.3 × 10⁻⁴).
      answer: { value: 1.1e-4, tolerance: 0.1e-4 }
      explanation: |
        Ksp = [Mg²⁺][OH⁻]² = s(2s)² = 4s³, so s³ = 5.6 × 10⁻¹²/4 = 1.4 × 10⁻¹² and s = ∛(1.4 × 10⁻¹²) = 1.1 × 10⁻⁴ M. The hydroxide concentration in the saturated solution is 2s = 2.2 × 10⁻⁴ M.

