      prompt: |
        At 700 K the equilibrium H₂(g) + I₂(g) ⇌ 2 HI(g) has K = 50. A 1.0 L flask at equilibrium contains [H₂] = [I₂] = 0.022 M and [HI] = 0.156 M. Enough HI is injected to raise [HI] to 0.300 M instantly.
        (a) Calculate Q immediately after the injection.
        (b) Predict the direction of the net reaction and justify it.
        (c) Describe how the forward and reverse rates compare immediately after the injection and how they change as the new equilibrium is reached.
      answer: |
        (a) Q = [HI]²/([H₂][I₂]) = (0.300)²/((0.022)(0.022)) = 0.0900/0.000484 = 1.9 × 10².
        (b) Q = 186 > K = 50, so the mixture holds too much HI relative to equilibrium; the reverse reaction proceeds, consuming HI and forming H₂ and I₂, until Q returns to 50.
        (c) Immediately after injection the reverse rate (proportional to [HI]²) jumps while the forward rate (proportional to [H₂][I₂]) is unchanged, so reverse exceeds forward. As HI is consumed the reverse rate falls, and as H₂ and I₂ form the forward rate rises; the two become equal at the new equilibrium, where the concentrations are constant and Q = K.
      explanation: |
        Three points.

        (a) 1 pt: Q ≈ 1.9 × 10² (accept 180–190).
        (b) 1 pt: reverse direction, with Q > K stated.
        (c) 1 pt: reverse rate initially exceeds forward; reverse falls and forward rises until equal.

    # ---- Long answer
    - slug: apchem-u07-w25-q23
      type: long_answer
      topic_code: "7.10"
      source: "general knowledge"
      points: 6
      prompt: |
        The Haber process, N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g), is exothermic (ΔH° = −92 kJ/mol). Kp is 4.3 × 10⁻³ at 400 °C and 2.4 × 10⁻⁴ at 500 °C.
        (a) Write the expression for Kp and explain, using Q, why adding H₂ to an equilibrium mixture at constant volume increases the amount of NH₃.
        (b) Explain, using Q, why decreasing the volume of the container at constant temperature increases the amount of NH₃.
        (c) Use the two Kp values to explain why the given ΔH° must be negative.
        (d) Explain why an iron catalyst is used even though it does not change the equilibrium yield.
        (e) Industrial plants run at about 450 °C and 200 atm rather than at the much lower temperature that would maximise the yield. Explain the compromise.
        (f) Predict and explain the effect on the amount of NH₃ of adding argon while the total pressure is held constant.
      answer: |
        (a) Kp = P(NH₃)²/(P(N₂) P(H₂)³). Adding H₂ raises P(H₂), enlarging the denominator of Q, so Q < K. The forward reaction proceeds, converting some of the added H₂ (with N₂) into NH₃, until Q = K again; the new mixture holds more NH₃.
        (b) Decreasing the volume raises every partial pressure by the same factor f. Q is multiplied by f²/(f × f³) = 1/f², so Q < K; the forward reaction (4 mol gas → 2 mol gas) proceeds until Q = K, producing more NH₃.
        (c) K falls from 4.3 × 10⁻³ to 2.4 × 10⁻⁴ as the temperature rises, so higher temperature favours the reactants. A reaction whose K decreases with temperature behaves as if heat were a product (adding heat pushes it left), which means it is exothermic: ΔH° < 0.
        (d) Without a catalyst the rate at a temperature low enough for a good yield is far too slow to be practical (the N≡N bond is very strong). The catalyst lowers the activation energy of both directions equally, so equilibrium is reached quickly without changing the position of equilibrium.
        (e) A low temperature gives a larger K and a larger equilibrium yield but a very slow rate; a high temperature gives a fast rate but a small K. About 450 °C with a catalyst gives an acceptable rate at a modest yield; the high pressure (200 atm) pushes the equilibrium toward NH₃ to compensate, and NH₃ is removed by cooling and recycling the unreacted gases.
        (f) At constant total pressure, adding argon forces the container to expand, so the partial pressure of each reacting gas falls by the same factor. each partial pressure is multiplied by a factor f < 1, so Q is multiplied by f²/(f × f³) = 1/f², which is greater than 1: Q rises above K; the reverse reaction proceeds and the amount of NH₃ decreases, as for any volume increase.
      explanation: |
        Six points.

        (a) 1 pt: correct Kp expression and Q < K after adding H₂, forward shift.
        (b) 1 pt: all partial pressures rise; Q multiplied by 1/f² (or equivalent), Q < K, forward shift.
        (c) 1 pt: K decreases with temperature therefore exothermic (accept a heat-as-product or van 't Hoff argument).
        (d) 1 pt: catalyst lowers Ea for both directions, speeds attainment of equilibrium, no change in yield.
        (e) 1 pt: trade-off between yield (low T) and rate (high T); high pressure and product removal compensate.
        (f) 1 pt: argon at constant pressure lowers partial pressures, Q > K, reverse shift, less NH₃.
