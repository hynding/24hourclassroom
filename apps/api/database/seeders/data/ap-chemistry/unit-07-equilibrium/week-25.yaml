week: 25
unit: 7
title: "Le Châtelier's Principle and Solubility Equilibria"
topics: ["7.9", "7.10", "7.11"]
guide: guides/week-25.md
guide_description: |
  Le Châtelier's principle as a prediction tool for changes in concentration, volume, temperature, catalysts and
  inert gases; the Q-versus-K explanation of every shift, including why a temperature change is the one
  disturbance that changes K; solubility products: writing Ksp, converting between Ksp and molar solubility for
  1:1, 1:2 and 1:3 salts, and deciding whether a precipitate forms from Q against Ksp. Worked examples for
  methanol synthesis, the cobalt chloride colour change, N₂O₄, Ca(OH)₂, PbI₂ and AgCl precipitation.
flashcards_description: |
  29 cards on the responses of an equilibrium to each kind of disturbance, the Q/K reasoning behind them,
  and the Ksp relations for sparingly soluble salts.

flashcards:
  - front: Le Châtelier's principle → statement
    back: |
      When a system at equilibrium is disturbed, it responds by shifting in the direction that partly counteracts the disturbance, until a new equilibrium (Q = K) is established.
    topic_code: "7.9"
  - front: Effect of adding a reactant to an equilibrium mixture
    back: |
      The system shifts toward products, consuming part (not all) of the added reactant; the new equilibrium has more product and more of the added reactant than before.
    topic_code: "7.9"
  - front: Effect of removing a product as it forms
    back: |
      The system shifts toward products to replace what was removed. Continuously removing a product drives a reaction to completion, which is how industry gets high yields from unfavourable equilibria.
    topic_code: "7.9"
  - front: Effect of decreasing the volume (raising the total pressure) on a gas equilibrium
    back: |
      The system shifts toward the side with fewer moles of gas; if both sides have the same number of gas moles there is no shift. Solids and liquids do not count.
    topic_code: "7.9"
  - front: Effect of raising the temperature on an exothermic equilibrium
    back: |
      Shifts toward reactants (the endothermic direction) and K decreases. Treat heat as a product: adding heat pushes the reaction left.
    topic_code: "7.9"
  - front: Effect of raising the temperature on an endothermic equilibrium
    back: |
      Shifts toward products and K increases. Treat heat as a reactant: adding heat pushes the reaction right.
    topic_code: "7.9"
  - front: Effect of a catalyst on the position of equilibrium
    back: |
      None. A catalyst lowers the activation energy of the forward and reverse reactions equally, so equilibrium is reached faster but the composition and K are unchanged.
    topic_code: "7.9"
  - front: Adding an inert gas at constant volume
    back: |
      No shift. The partial pressures and concentrations of the reacting gases are unchanged, so Q is unchanged; the extra total pressure comes entirely from the inert gas.
    topic_code: "7.9"
  - front: Adding an inert gas at constant total pressure
    back: |
      The container expands to keep the total pressure fixed, lowering every reacting gas's partial pressure: the effect is that of a volume increase, so the system shifts toward more moles of gas.
    topic_code: "7.9"
  - front: The cobalt chloride colour equilibrium
    back: |
      [Co(H₂O)₆]²⁺ (pink) + 4 Cl⁻ ⇌ [CoCl₄]²⁻ (blue) + 6 H₂O, endothermic. Adding HCl or warming turns it blue; adding water or cooling turns it pink.
    topic_code: "7.9"
  - front: Industrial conditions for an exothermic synthesis such as methanol or ammonia
    back: |
      High pressure (fewer gas moles on the product side), a moderate temperature as a compromise between yield (favoured by low T) and rate (favoured by high T), a catalyst, and removal of product.
    topic_code: "7.9"
  - front: Q/K reason for the shift when a reactant is added
    back: |
      Adding reactant enlarges the denominator of Q, so Q drops below K; the forward reaction then proceeds, raising Q, until Q = K again.
    topic_code: "7.10"
  - front: Q/K reason for the shift when the volume is halved
    back: |
      Every concentration doubles, so Q is multiplied by 2 raised to the power (moles of gas on the product side minus moles on the reactant side). If that exponent is positive Q > K and the reaction runs in reverse; if negative, forward; if zero, no change.
    topic_code: "7.10"
  - front: Which disturbances change Q and which change K?
    back: |
      Concentration and volume changes alter Q instantly while K is unchanged. A temperature change leaves Q unchanged at first but changes K. A catalyst or inert gas at constant volume changes neither.
    topic_code: "7.10"
  - front: Why Δn(gas) = 0 reactions ignore volume changes
    back: |
      Doubling every concentration multiplies numerator and denominator of Q by the same factor when the exponents sum equally, so Q is unchanged and still equals K. Example: H₂ + I₂ ⇌ 2 HI.
    topic_code: "7.10"
  - front: Explaining a temperature shift with K rather than heat
    back: |
      For N₂O₄ ⇌ 2 NO₂ (endothermic) K rises from 0.046 at 298 K to about 0.60 at 325 K. On warming, the concentrations are momentarily unchanged, so Q = 0.046 < new K; the forward reaction proceeds.
    topic_code: "7.10"
  - front: What 'partly counteracts' means quantitatively
    back: |
      After adding A to an A + B ⇌ C mixture the final [A] is above its old equilibrium value but below the value just after addition: the shift consumes only part of the added reactant, because Q must return to K, not the concentrations to their old values.
    topic_code: "7.10"
  - front: Solubility product Ksp → definition
    back: |
      The equilibrium constant for a sparingly soluble solid dissolving into its ions, e.g. AgCl(s) ⇌ Ag⁺ + Cl⁻, Ksp = [Ag⁺][Cl⁻]. The solid is omitted because it is pure.
    topic_code: "7.11"
  - front: Ksp expression for a 1:2 salt such as Ca(OH)₂
    back: |
      Ca(OH)₂(s) ⇌ Ca²⁺ + 2 OH⁻, Ksp = [Ca²⁺][OH⁻]². With molar solubility s, [Ca²⁺] = s and [OH⁻] = 2s, so Ksp = 4s³.
    topic_code: "7.11"
  - front: Ksp expression for a 2:1 salt such as Ag₂CrO₄
    back: |
      Ag₂CrO₄(s) ⇌ 2 Ag⁺ + CrO₄²⁻, Ksp = [Ag⁺]²[CrO₄²⁻] = (2s)²(s) = 4s³.
    topic_code: "7.11"
  - front: Ksp for a 1:3 salt such as Fe(OH)₃
    back: |
      Fe(OH)₃(s) ⇌ Fe³⁺ + 3 OH⁻, Ksp = [Fe³⁺][OH⁻]³ = s(3s)³ = 27s⁴.
    topic_code: "7.11"
  - front: Molar solubility → definition
    back: |
      The number of moles of the solid that dissolve per litre to give a saturated solution, written s. Multiply by the molar mass for grams per litre.
    topic_code: "7.11"
  - front: Molar solubility of a 1:1 salt from Ksp
    back: |
      s = √Ksp. For AgCl, s = √(1.8 × 10⁻¹⁰) = 1.3 × 10⁻⁵ M.
    topic_code: "7.11"
  - front: Molar solubility of a 1:2 or 2:1 salt from Ksp
    back: |
      s = ∛(Ksp/4). For PbI₂ with Ksp = 9.8 × 10⁻⁹, s = ∛(2.45 × 10⁻⁹) = 1.35 × 10⁻³ M.
    topic_code: "7.11"
  - front: Comparing solubilities from Ksp values
    back: |
      Only salts with the same ion ratio can be ranked by Ksp alone. AgCl (Ksp 1.8 × 10⁻¹⁰) has a larger Ksp than Ag₂CrO₄ (1.1 × 10⁻¹²) but a smaller molar solubility (1.3 × 10⁻⁵ versus 6.5 × 10⁻⁵ M).
    topic_code: "7.11"
  - front: Criterion for precipitation
    back: |
      Calculate the ion product Q from the concentrations just after mixing. Q > Ksp: a precipitate forms until Q = Ksp. Q < Ksp: unsaturated, no precipitate. Q = Ksp: exactly saturated.
    topic_code: "7.11"
  - front: Dilution on mixing before a precipitation test
    back: |
      When two solutions are combined, each ion's concentration falls by the factor (its own volume)/(total volume). Mixing equal volumes halves both concentrations before Q is computed.
    topic_code: "7.11"
  - front: Saturated solution → equilibrium meaning
    back: |
      A solution in contact with excess solid in which dissolving and precipitation occur at equal rates; its ion product equals Ksp. The amount of excess solid does not change the concentrations.
    topic_code: "7.11"
  - front: Le Châtelier applied to a dissolving equilibrium
    back: |
      Adding one of the salt's ions (a common ion) shifts the equilibrium toward the solid and lowers solubility; removing an ion by a reaction (acid consuming OH⁻) shifts toward dissolving. Developed in week 26.
    topic_code: "7.11"

quiz:
  description: |
    23 questions · about 45 minutes · topics 7.9–7.11 (Le Châtelier's principle, its explanation by Q versus
    K, and solubility equilibria), with review of calculating K from data, net ionic equations and solubility,
    catalysts, the sign of ΔH and partial pressures. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: SO₂/O₂/SO₃ equilibrium disturbed by compression (7.4, 7.10)
    - slug: apchem-u07-w25-q01
      type: multiple_choice
      topic_code: "7.4"
      source: "general knowledge"
      points: 1
      stimulus: |
        An equilibrium mixture for 2 SO₂(g) + O₂(g) ⇌ 2 SO₃(g), ΔH° = −198 kJ/mol, in a 2.00 L flask at 1,000 K contains 0.400 mol SO₂, 0.200 mol O₂ and 0.800 mol SO₃.
      prompt: |
        What is the value of Kc at 1,000 K?
      options:
        - "10"
        - "4.0"
        - "40"
        - "80"
      option_explanations:
        - |
          10 results from using moles instead of molarities; the 2.00 L volume must be applied to each amount before forming the ratio.
        - |
          4.0 omits the square on [SO₂] in the denominator.
        - |
          Correct. [SO₂] = 0.200 M, [O₂] = 0.100 M, [SO₃] = 0.400 M; Kc = (0.400)²/((0.200)²(0.100)) = 0.160/0.00400 = 40.
        - |
          80 is twice K; it comes from leaving the moles of SO₃ unconverted while converting the others.
      answer: 2
      explanation: |
        Practice 5 (review of 7.4). Convert moles to molarity first; coefficients become exponents.

    - slug: apchem-u07-w25-q02
      type: multiple_choice
      topic_code: "7.10"
      source: "general knowledge"
      points: 1
      stimulus: |
        An equilibrium mixture for 2 SO₂(g) + O₂(g) ⇌ 2 SO₃(g), ΔH° = −198 kJ/mol, in a 2.00 L flask at 1,000 K contains 0.400 mol SO₂, 0.200 mol O₂ and 0.800 mol SO₃.
      prompt: |
        The flask is rapidly compressed to 1.00 L at 1,000 K. Which statement correctly describes what happens?
      options:
        - "Immediately after compression Q is less than K, so the forward reaction proceeds and more SO₃ forms."
        - "Immediately after compression Q is greater than K, so the reverse reaction proceeds and SO₃ decomposes."
        - "Q is unchanged by compression, so there is no net reaction."
        - "K decreases because the pressure increased, so the reverse reaction proceeds."
      option_explanations:
        - |
          Correct. Doubling every concentration multiplies Q by 2²/(2² × 2) = ½: Q falls from 40 to 20, below K, and the forward reaction (3 mol gas → 2 mol gas) proceeds, as Le Châtelier predicts.
        - |
          The reaction has fewer gas moles on the product side, so compression lowers Q (to 20), not raises it.
        - |
          Q changes because the exponents differ: the numerator is multiplied by 4 and the denominator by 8.
        - |
          K depends only on temperature; compression changes Q, not K.
      answer: 0
      explanation: |
        Practice 6. Compression raises every concentration; the side with more gas moles grows faster in Q, so Q moves away from K in the direction that favours fewer gas moles.

    - slug: apchem-u07-w25-q03
      type: numeric
      topic_code: "7.10"
      source: "general knowledge"
      points: 1
      stimulus: |
        An equilibrium mixture for 2 SO₂(g) + O₂(g) ⇌ 2 SO₃(g), ΔH° = −198 kJ/mol, in a 2.00 L flask at 1,000 K contains 0.400 mol SO₂, 0.200 mol O₂ and 0.800 mol SO₃.
      prompt: |
        Calculate the value of Q immediately after the flask is compressed to 1.00 L at 1,000 K, before any reaction occurs. Give your answer to two significant figures.
      answer: { value: 20, tolerance: 1 }
      explanation: |
        After compression [SO₂] = 0.400 M, [O₂] = 0.200 M, [SO₃] = 0.800 M. Q = (0.800)²/((0.400)²(0.200)) = 0.640/0.0320 = 20. Since Q = 20 < K = 40, the forward reaction proceeds until Q returns to 40.

    # ---- Stand-alone multiple choice
    - slug: apchem-u07-w25-q04
      type: multiple_choice
      topic_code: "7.9"
      source: "general knowledge"
      points: 1
      prompt: |
        Methanol is synthesised by CO(g) + 2 H₂(g) ⇌ CH₃OH(g), ΔH° = −91 kJ/mol. Which change increases the equilibrium amount of CH₃OH?
      options:
        - "Raising the temperature"
        - "Adding a catalyst"
        - "Increasing the volume of the container"
        - "Removing CH₃OH as it forms"
      option_explanations:
        - |
          The reaction is exothermic; raising the temperature shifts it toward reactants and lowers the methanol yield.
        - |
          A catalyst changes only the rate at which equilibrium is reached, not the equilibrium amount.
        - |
          Increasing the volume favours the side with more gas moles, which is the reactant side (3 mol versus 1 mol).
        - |
          Correct. Removing a product lowers Q below K, so the forward reaction proceeds to replace the methanol removed.
      answer: 3
      explanation: |
        Practice 6. Exothermic, fewer product gas moles: low temperature, high pressure and product removal all raise the yield.

    - slug: apchem-u07-w25-q05
      type: multiple_choice
      topic_code: "7.9"
      source: "general knowledge"
      points: 1
      prompt: |
        Argon is added to an equilibrium mixture of N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g) in a rigid container at constant temperature. What is the effect on the amount of NH₃?
      options:
        - "It increases, because the total pressure increases and the reaction has fewer gas moles on the right."
        - "It is unchanged, because the partial pressures of N₂, H₂ and NH₃ are not altered."
        - "It decreases, because argon dilutes the reactants."
        - "It increases, because argon collides with the reactants and speeds the forward reaction."
      option_explanations:
        - |
          The total pressure rises but the partial pressure of each reacting gas, and so Q, is unchanged; only the reacting gases' pressures enter Kp.
        - |
          Correct. In a rigid container argon adds its own partial pressure without changing the concentrations of the reacting species, so Q still equals K and no shift occurs.
        - |
          Dilution requires a volume increase; at constant volume the concentrations are fixed.
        - |
          Collisions with argon do not change the rate constants or the equilibrium; argon is inert and merely adds pressure.
      answer: 1
      explanation: |
        Practice 6. An inert gas at constant volume changes neither Q nor K.

    - slug: apchem-u07-w25-q06
      type: multiple_choice
      topic_code: "7.10"
      source: "general knowledge"
      points: 1
      prompt: |
        Which disturbance to a system at equilibrium changes the value of K rather than the value of Q?
      options:
        - "Adding more of a reactant at constant volume"
        - "Halving the volume of the container"
        - "Raising the temperature"
        - "Removing a product at constant volume"
      option_explanations:
        - |
          Adding reactant changes the concentrations, so Q changes while K stays the same.
        - |
          Halving the volume doubles every concentration, altering Q (unless Δn(gas) = 0) but not K.
        - |
          Correct. Temperature is the only variable on which K depends; after warming, Q is momentarily unchanged while K has moved, and the system shifts toward the new K.
        - |
          Removing product lowers Q below K; K is unaffected.
      answer: 2
      explanation: |
        Practice 6. Concentration and volume disturbances move Q; temperature moves K.

    - slug: apchem-u07-w25-q07
      type: multiple_choice
      topic_code: "7.11"
      source: "general knowledge"
      points: 1
      prompt: |
        Which is the correct solubility-product expression for calcium phosphate, Ca₃(PO₄)₂(s) ⇌ 3 Ca²⁺(aq) + 2 PO₄³⁻(aq)?
      options:
        - "Ksp = [Ca²⁺]³[PO₄³⁻]²"
        - "Ksp = [Ca²⁺]³[PO₄³⁻]²/[Ca₃(PO₄)₂]"
        - "Ksp = [Ca²⁺][PO₄³⁻]"
        - "Ksp = 3[Ca²⁺] × 2[PO₄³⁻]"
      option_explanations:
        - |
          Correct. Each ion's concentration is raised to its coefficient, and the pure solid is omitted.
        - |
          A pure solid has a fixed concentration and never appears in an equilibrium expression.
        - |
          The coefficients 3 and 2 must appear as exponents; omitting them gives the expression for a 1:1 salt.
        - |
          Coefficients become exponents, not multipliers, in the mass-action expression.
      answer: 0
      explanation: |
        Practice 5. Ksp is an ordinary equilibrium constant for the dissolving reaction.

    - slug: apchem-u07-w25-q08
      type: multiple_choice
      topic_code: "7.11"
      source: "general knowledge"
      points: 1
      prompt: |
        At 25 °C, AgCl has Ksp = 1.8 × 10⁻¹⁰ and Ag₂CrO₄ has Ksp = 1.1 × 10⁻¹². Which statement about their molar solubilities is correct?
      options:
        - "AgCl is more soluble, because its Ksp is larger."
        - "The two salts have equal molar solubility, because the Ksp values are both very small."
        - "Ag₂CrO₄ is less soluble by a factor of about 160, the ratio of the Ksp values."
        - "Ag₂CrO₄ is more soluble (6.5 × 10⁻⁵ M versus 1.3 × 10⁻⁵ M), despite its smaller Ksp."
      option_explanations:
        - |
          Ksp values can be compared directly only for salts with the same ion ratio; AgCl is 1:1 and Ag₂CrO₄ is 2:1, so the larger Ksp does not mean the larger solubility.
        - |
          Both Ksp values are small, but the solubilities differ by a factor of about 5 because of the different stoichiometry.
        - |
          The ratio of Ksp values is not the ratio of solubilities when the expressions have different exponents.
        - |
          Correct. For AgCl, s = √(1.8 × 10⁻¹⁰) = 1.3 × 10⁻⁵ M; for Ag₂CrO₄, 4s³ = 1.1 × 10⁻¹² gives s = 6.5 × 10⁻⁵ M.
      answer: 3
      explanation: |
        Practice 5. Convert each Ksp to s using its own stoichiometry before comparing.

    - slug: apchem-u07-w25-q09
      type: multiple_choice
      topic_code: "7.9"
      source: "general knowledge"
      points: 1
      prompt: |
        The equilibrium [Co(H₂O)₆]²⁺(aq, pink) + 4 Cl⁻(aq) ⇌ [CoCl₄]²⁻(aq, blue) + 6 H₂O(l) is endothermic. A violet (mixed) solution is placed in an ice bath. What is observed, and why?
      options:
        - "It turns blue, because cooling removes heat and the forward reaction releases heat to replace it."
        - "It turns pink, because cooling removes heat and the system shifts in the exothermic (reverse) direction."
        - "It stays violet, because temperature changes do not affect aqueous equilibria."
        - "It turns blue, because the solubility of Cl⁻ increases at low temperature."
      option_explanations:
        - |
          The forward reaction is endothermic (absorbs heat), so it cannot be the direction that compensates for lost heat.
        - |
          Correct. Treating heat as a reactant (heat + pink + 4 Cl⁻ ⇌ blue + 6 H₂O), removing heat shifts the equilibrium left, toward the pink complex; equivalently, K for the endothermic reaction falls on cooling.
        - |
          Temperature changes K for every reaction with non-zero ΔH, in solution or in the gas phase.
        - |
          Chloride ion is fully dissolved throughout; the colour change is due to the shift of the complex-ion equilibrium.
      answer: 1
      explanation: |
        Practice 6. Cooling favours the exothermic direction; the reverse of an endothermic reaction is exothermic.

    - slug: apchem-u07-w25-q10
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Aqueous solutions of lead(II) nitrate and potassium iodide are mixed and a yellow precipitate forms. Which is the correct net ionic equation?
      options:
        - "Pb²⁺(aq) + 2 I⁻(aq) → PbI₂(s)"
        - "Pb(NO₃)₂(aq) + 2 KI(aq) → PbI₂(s) + 2 KNO₃(aq)"
        - "Pb²⁺(aq) + 2 NO₃⁻(aq) + 2 K⁺(aq) + 2 I⁻(aq) → PbI₂(s) + 2 K⁺(aq) + 2 NO₃⁻(aq)"
        - "K⁺(aq) + NO₃⁻(aq) → KNO₃(s)"
      option_explanations:
        - |
          Correct. Only the ions that combine to form the insoluble solid appear; K⁺ and NO₃⁻ are spectators and are cancelled.
        - |
          This is the molecular (complete formula) equation, not the net ionic equation.
        - |
          This is the complete ionic equation; the spectator ions K⁺ and NO₃⁻ still need to be cancelled.
        - |
          Potassium nitrate is soluble (all nitrates and all potassium salts are), so it does not precipitate.
      answer: 0
      explanation: |
        Practice 2 (review of 4.2). The precipitate is the sparingly soluble salt whose Ksp governs the solubility equilibrium.

    - slug: apchem-u07-w25-q11
      type: multiple_choice
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A mixture of gases at constant temperature is compressed to half its original volume. What happens to the partial pressure of each gas and to the mole fraction of each gas?
      options:
        - "Each partial pressure is halved; each mole fraction is unchanged."
        - "Each partial pressure is unchanged; each mole fraction doubles."
        - "Each partial pressure doubles; the mole fraction of the heaviest gas increases."
        - "Each partial pressure doubles; each mole fraction is unchanged."
      option_explanations:
        - |
          By PV = nRT at constant n and T, halving V doubles P, not halves it.
        - |
          Mole fractions depend only on the numbers of moles, which do not change on compression; partial pressures do change.
        - |
          The mole fractions are unaffected by molar mass; every gas's moles are fixed, so every mole fraction is unchanged.
        - |
          Correct. P = nRT/V doubles for every gas when V is halved, while nᵢ/n(total) is unchanged. This is why compression changes Q for a gas equilibrium: each partial pressure doubles.
      answer: 3
      explanation: |
        Practice 5 (review of 3.4). The ideal gas law explains the volume rule of Le Châtelier's principle.

    # ---- Multi-select
    - slug: apchem-u07-w25-q12
      type: multi_select
      topic_code: "7.9"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        For the Haber process, N₂(g) + 3 H₂(g) ⇌ 2 NH₃(g), ΔH° = −92 kJ/mol, which changes increase the equilibrium amount of NH₃? Select all that apply.
      options:
        - "Adding N₂ at constant volume"
        - "Removing NH₃ as it forms"
        - "Decreasing the volume of the container"
        - "Lowering the temperature"
        - "Adding an iron catalyst"
        - "Adding argon at constant volume"
      option_explanations:
        - |
          Correct. Added reactant lowers Q below K and the forward reaction proceeds.
        - |
          Correct. Removing product lowers Q below K and more NH₃ is made to replace it.
        - |
          Correct. Four moles of gas become two, so compression favours the product side.
        - |
          Correct. The reaction is exothermic; cooling favours the forward (heat-releasing) direction and raises K.
        - |
          A catalyst speeds both directions equally; the equilibrium amount is unchanged (it is reached sooner).
        - |
          Argon at constant volume leaves every partial pressure of the reacting gases unchanged, so Q still equals K.
      answer: [0, 1, 2, 3]
      explanation: |
        Practice 6. Concentration, volume and temperature shift; catalysts and inert gases at constant volume do not.

    - slug: apchem-u07-w25-q13
      type: multi_select
      topic_code: "4.2"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following ionic compounds are soluble in water, so that no solubility-product equilibrium limits their dissolving at ordinary concentrations? Select all that apply.
      options:
        - "NaNO₃"
        - "AgCl"
        - "KBr"
        - "BaSO₄"
        - "NH₄Cl"
      option_explanations:
        - |
          Correct. All sodium salts and all nitrates are soluble.
        - |
          Silver chloride is sparingly soluble (Ksp = 1.8 × 10⁻¹⁰); it is the classic white precipitate.
        - |
          Correct. All potassium salts are soluble.
        - |
          Barium sulfate is sparingly soluble (Ksp = 1.1 × 10⁻¹⁰); its insolubility is why it is safe as a contrast agent.
        - |
          Correct. All ammonium salts are soluble.
      answer: [0, 2, 4]
      explanation: |
        Practice 2 (review of 4.2). Sodium, potassium, ammonium and nitrate salts are soluble; Ksp describes the sparingly soluble ones.

    # ---- True / false
    - slug: apchem-u07-w25-q14
      type: true_false
      topic_code: "5.11"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: a catalyst lowers the activation energy of the forward and reverse reactions by the same amount, which is why it increases both rates equally and leaves the equilibrium composition unchanged.
      answer: true
      explanation: |
        True. A catalyst provides a different pathway with a lower energy maximum; the reactant and product energies are unchanged, so the forward and reverse activation energies drop by the same amount. Both rate constants rise by the same factor, their ratio K is unchanged, and equilibrium is reached faster at the same composition.

    - slug: apchem-u07-w25-q15
      type: true_false
      topic_code: "7.11"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: of two sparingly soluble salts, the one with the larger Ksp always has the larger molar solubility.
      answer: false
      explanation: |
        False. The relation between Ksp and molar solubility depends on the ion ratio (s² for 1:1, 4s³ for 1:2 or 2:1, 27s⁴ for 1:3). Ag₂CrO₄ (Ksp = 1.1 × 10⁻¹²) is more soluble by moles than AgCl (Ksp = 1.8 × 10⁻¹⁰). Only salts of the same formula type can be ranked by Ksp alone.

