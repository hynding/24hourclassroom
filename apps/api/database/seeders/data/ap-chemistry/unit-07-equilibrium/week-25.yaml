      points: 3
      prompt: |
        At 298 K an equilibrium mixture for N₂O₄(g) ⇌ 2 NO₂(g) has [N₂O₄] = 0.071 M and [NO₂] = 0.057 M (Kc = 0.046). The piston of the container is pushed in so that the volume is halved, at constant temperature.
        (a) Calculate Q immediately after the volume change.
        (b) State the direction of the net reaction and justify it by comparing Q with K.
        (c) The gas mixture momentarily darkens and then becomes lighter than it was immediately after compression. Explain both observations.
      answer: |
        (a) Halving the volume doubles each concentration: [N₂O₄] = 0.142 M, [NO₂] = 0.114 M. Q = (0.114)²/0.142 = 0.0130/0.142 = 0.092.
        (b) Q = 0.092 > K = 0.046, so the reverse reaction proceeds: NO₂ molecules combine to form N₂O₄ until Q falls back to 0.046 (the shift toward fewer moles of gas).
        (c) The immediate darkening is the doubling of [NO₂] (brown) by compression before any reaction occurs; the subsequent lightening is the reverse reaction consuming part of the NO₂ as the system re-establishes equilibrium. The final [NO₂] is still above its original 0.057 M because the shift only partly counteracts the compression.
      explanation: |
        Three points.

        (a) 1 pt: doubled concentrations and Q = 0.092 (accept 0.091–0.092).
        (b) 1 pt: reverse direction with Q > K stated.
        (c) 1 pt: darkening from compression raising [NO₂]; lightening from the reverse shift consuming NO₂ (accept a statement that the final [NO₂] remains above the original value as supporting detail).

    - slug: apchem-u07-w25-q22
