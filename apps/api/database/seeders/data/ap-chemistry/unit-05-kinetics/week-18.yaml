    # ---- Numeric
    - slug: apchem-u05-w18-q18
      type: numeric
      topic_code: "5.6"
      source: "general knowledge"
      points: 1
      prompt: |
        A reaction has an activation energy of 60.0 kJ/mol and a rate constant of 3.0 × 10⁻³ s⁻¹ at 298 K. Using R = 8.314 J/(mol·K), calculate the rate constant at 348 K. Give your answer in s⁻¹ to two significant figures (for example 0.012).
      answer: { value: 0.097, tolerance: 0.003 }
      explanation: |
        ln(k₂/k₁) = −(Ea/R)(1/T₂ − 1/T₁) = −(60,000/8.314)(1/348 − 1/298) = −(7,217)(0.0028736 − 0.0033557) = −(7,217)(−4.821 × 10⁻⁴) = 3.479. k₂ = 3.0 × 10⁻³ × e³·⁴⁷⁹ = 3.0 × 10⁻³ × 32.4 = 0.097 s⁻¹. A 50 K rise multiplies the rate by about 32 for a barrier of this size.

