week: 18
unit: 5
title: "Collisions, Activation Energy and Elementary Steps"
topics: ["5.4", "5.5", "5.6", "5.7"]
guide: guides/week-18.md
guide_description: |
  Why elementary steps are the one case where coefficients give the rate law, how the collision model and the
  Maxwell–Boltzmann distribution explain the effects of concentration, temperature and orientation, how to read
  a reaction energy profile (Ea forward and reverse, transition state, ΔH), the Arrhenius equation in its
  two-temperature and ln k vs 1/T forms, and the first rules for a reaction mechanism: steps add to the overall
  equation, intermediates cancel, the mechanism must fit the rate law.
flashcards_description: |
  29 cards on molecularity, the collision model, energy profiles, the Arrhenius equation and mechanisms with
  intermediates.

flashcards:
  - front: Elementary reaction → definition and what it allows you to write
    back: |
      A reaction that happens exactly as written in one molecular event. Only for an elementary step can the rate law be written from the coefficients: A + B → products has rate = k[A][B].
    topic_code: "5.4"
  - front: Molecularity → the three kinds and which is rare
    back: |
      Unimolecular (one particle rearranges or falls apart), bimolecular (two collide, the common case) and termolecular (three collide at once, rare because a simultaneous three-body collision with the right energy and geometry is improbable).
    topic_code: "5.4"
  - front: Rate law of the elementary step 2 NO → N₂O₂
    back: |
      rate = k[NO]². Two NO molecules must collide, so the rate is proportional to [NO] × [NO]. Bimolecular.
    topic_code: "5.4"
  - front: Why the overall equation 2 NO₂ + F₂ → 2 NO₂F does not have rate = k[NO₂]²[F₂]
    back: |
      The overall equation is a sum of steps, not a description of one collision. The measured rate law, rate = k[NO₂][F₂], shows the first (slow) collision involves one NO₂ and one F₂; the second NO₂ reacts in a later fast step.
    topic_code: "5.4"
  - front: Collision model → the three requirements for a successful collision
    back: |
      The particles must collide; the collision must supply at least the activation energy along the line of approach; and the particles must be oriented so the atoms that will bond actually meet.
    topic_code: "5.5"
  - front: Effect of concentration in the collision model
    back: |
      More particles per litre means more collisions per second, in proportion. It does not change the fraction of collisions that have enough energy, which depends only on temperature.
    topic_code: "5.5"
  - front: Effect of temperature in the collision model → the big reason and the small one
    back: |
      Small: faster particles collide slightly more often. Big: the Maxwell–Boltzmann tail beyond Ea grows steeply, so a much larger fraction of collisions carries enough energy. A 10 °C rise can roughly double a typical rate.
    topic_code: "5.5"
  - front: Orientation factor → an example where geometry matters
    back: |
      In NO + O₃ → NO₂ + O₂ the nitrogen must strike an oxygen of the ozone; an approach by the O end of NO bounces off. The fraction of collisions with useful geometry is part of the Arrhenius frequency factor A.
    topic_code: "5.5"
  - front: Maxwell–Boltzmann curves at two temperatures → how to draw them
    back: |
      Both start at the origin and rise to a hump then tail off. The hotter curve is lower, broader and peaks further right; the two curves enclose equal areas. A vertical line at Ea shows a larger shaded area beyond it for the hotter gas.
    topic_code: "3.5"
  - front: Activation energy Ea → what it is on an energy profile
    back: |
      The minimum energy a collision must supply to reach the transition state: the height from the reactant valley to the top of the hill. A larger Ea means a slower reaction at any given temperature.
    topic_code: "5.6"
  - front: Transition state (activated complex) → what it is and is not
    back: |
      The highest-energy arrangement along the reaction path, with old bonds partly broken and new ones partly formed. It is a peak on the profile, never isolated, and is not an intermediate.
    topic_code: "5.6"
  - front: Reading ΔH from a single-step energy profile
    back: |
      ΔH = energy of products minus energy of reactants. Products in a lower valley than reactants: exothermic, ΔH < 0. Products higher: endothermic, ΔH > 0. The height of the hill has nothing to do with ΔH.
    topic_code: "5.6"
  - front: Relationship between Ea(forward), Ea(reverse) and ΔH
    back: |
      Ea(reverse) = Ea(forward) − ΔH. For an exothermic reaction the reverse barrier is bigger; for an endothermic one it is smaller. Example: Ea(fwd) = 50 kJ/mol, ΔH = −30 kJ/mol gives Ea(rev) = 80 kJ/mol.
    topic_code: "5.6"
  - front: Arrhenius equation → form and meaning of each symbol
    back: |
      k = A e^(−Ea/RT). The exponential is the fraction of collisions with energy at least Ea; A (frequency factor) carries the collision frequency and orientation probability. R = 8.314 J/(mol·K), T in kelvin, Ea in J/mol.
    topic_code: "5.6"
  - front: Arrhenius plot → what to plot and what the slope gives
    back: |
      ln k against 1/T is a straight line: ln k = −(Ea/R)(1/T) + ln A. Slope = −Ea/R, so Ea = −slope × 8.314 J/(mol·K); the intercept is ln A.
    topic_code: "5.6"
  - front: Two-temperature Arrhenius equation
    back: |
      ln(k₂/k₁) = −(Ea/R)(1/T₂ − 1/T₁). Use it to find Ea from two rate constants, or k at a new temperature from Ea. Convert °C to K and kJ to J first.
    topic_code: "5.6"
  - front: Why ΔH says nothing about how fast a reaction is
    back: |
      Rate depends on Ea, the barrier; ΔH is the energy difference between the two valleys. Paper burning in air is strongly exothermic yet paper sits unchanged at room temperature because Ea is high.
    topic_code: "5.6"
  - front: Reaction mechanism → definition and the first rule
    back: |
      A proposed sequence of elementary steps describing how an overall reaction happens. The steps must add up to the overall balanced equation; species that cancel between steps are intermediates.
    topic_code: "5.7"
  - front: Intermediate in a mechanism → how to spot it
    back: |
      A species produced in one step and consumed in a later one, so it does not appear in the overall equation. It is a real molecule or atom (sometimes detectable), sitting in a valley on a multistep profile.
    topic_code: "5.7"
  - front: Intermediate versus transition state → the difference
    back: |
      An intermediate is a species in a valley between two hills and can sometimes be detected. A transition state is the top of a hill, an arrangement passed through in a single vibration and never isolated.
    topic_code: "5.7"
  - front: Three tests a proposed mechanism must pass
    back: |
      The steps add to the overall equation; each step is chemically reasonable (bimolecular or unimolecular, no impossible species); and the rate law predicted by the mechanism matches the experimental rate law.
    topic_code: "5.7"
  - front: Can a mechanism be proved by matching the rate law?
    back: |
      No. Agreement with the rate law makes a mechanism consistent with experiment; another mechanism might also fit. A mechanism can be disproved by a mismatch but only supported, never proved, by a match.
    topic_code: "5.7"
  - front: Mechanism of 2 NO₂ + F₂ → 2 NO₂F → steps and intermediate
    back: |
      Step 1 (slow): NO₂ + F₂ → NO₂F + F. Step 2 (fast): NO₂ + F → NO₂F. The F atom is the intermediate. Both steps are bimolecular, and the slow step gives rate = k[NO₂][F₂], matching experiment.
    topic_code: "5.7"
  - front: Mechanism for ozone decomposition 2 O₃ → 3 O₂ → intermediate
    back: |
      Step 1: O₃ → O₂ + O (unimolecular). Step 2: O + O₃ → 2 O₂ (bimolecular). The oxygen atom is the intermediate; adding the steps gives 2 O₃ → 3 O₂.
    topic_code: "5.7"
  - front: Unimolecular step → where the energy comes from
    back: |
      A single molecule falls apart or rearranges after earlier collisions have given it enough internal energy. Examples: O₃ → O₂ + O, cyclopropane → propene, radioactive decay in the first-order sense.
    topic_code: "5.4"
  - front: Doubling the temperature's effect on average kinetic energy versus on rate
    back: |
      Average kinetic energy is proportional to kelvin temperature, so 300 → 310 K raises it by about 3%. The rate may double, because the fraction of collisions beyond Ea in the Maxwell–Boltzmann tail rises far faster than the average.
    topic_code: "5.5"
  - front: Potential energy of two atoms versus their separation → the shape (spiral 2.2)
    back: |
      Far apart: zero. Approaching: energy falls as the bond forms, to a minimum at the equilibrium bond length (the bond energy is the depth of that well). Closer still: energy rises steeply from nuclear repulsion. Reaction profiles are built from such curves.
    topic_code: "2.2"
  - front: Estimating Ea from a 'rate doubles per 10 °C' observation
    back: |
      ln 2 = (Ea/R)(1/300 − 1/310) = (Ea/8.314)(1.075 × 10⁻⁴), so Ea ≈ 54 kJ/mol. The rule of thumb holds only for barriers near this size.
    topic_code: "5.6"
  - front: Frequency factor A → what lowers it
    back: |
      A is the collision frequency times the fraction of collisions with the right orientation. Large, awkwardly shaped molecules that must meet at one specific atom have a small orientation fraction and so a small A.
    topic_code: "5.5"

quiz:
  description: |
    22 questions · about 40 minutes · topics 5.4–5.7 (elementary steps and molecularity, the collision model,
    reaction energy profiles and the Arrhenius equation, and the first rules for mechanisms), with review of the
    Maxwell–Boltzmann distribution, potential energy of bonds and the rate laws and integrated rate laws of week
    17. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes.
  questions:
    # ---- Stimulus set A: a single-step energy profile (5.6)
    - slug: apchem-u05-w18-q01
      type: multiple_choice
      topic_code: "5.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        Graph description: a reaction energy profile for the single-step gas-phase reaction X + Y → Z. The vertical axis is potential energy in kJ/mol and the horizontal axis is reaction progress. The reactants X + Y sit at 20 kJ/mol on the left, the curve rises smoothly to a single maximum at 95 kJ/mol, and falls to the product Z at 50 kJ/mol on the right.
      prompt: |
        What is the activation energy of the forward reaction?
      options:
        - "30 kJ/mol"
        - "75 kJ/mol"
        - "95 kJ/mol"
        - "45 kJ/mol"
      option_explanations:
        - |
          30 kJ/mol is the difference between products and reactants, which is ΔH, not the barrier.
        - |
          Correct. Ea(forward) is the climb from the reactants (20 kJ/mol) to the top of the hill (95 kJ/mol): 95 − 20 = 75 kJ/mol.
        - |
          95 kJ/mol is the absolute energy of the transition state on this axis; the activation energy is measured from the reactants, not from zero.
        - |
          45 kJ/mol is the climb from the products to the top, which is the activation energy of the reverse reaction.
      answer: 1
      explanation: |
        Practice 1 and 4. Ea(forward) = E(transition state) − E(reactants).

    - slug: apchem-u05-w18-q02
      type: multiple_choice
      topic_code: "5.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        Graph description: a reaction energy profile for the single-step gas-phase reaction X + Y → Z. The vertical axis is potential energy in kJ/mol and the horizontal axis is reaction progress. The reactants X + Y sit at 20 kJ/mol on the left, the curve rises smoothly to a single maximum at 95 kJ/mol, and falls to the product Z at 50 kJ/mol on the right.
      prompt: |
        Which statement about the reaction is correct?
      options:
        - "The reaction is exothermic, because energy is released when the transition state forms."
        - "The reaction is exothermic, with ΔH = −30 kJ/mol."
        - "The reaction is endothermic, because the activation energy is positive."
        - "The reaction is endothermic, with ΔH = +30 kJ/mol."
      option_explanations:
        - |
          Energy is absorbed, not released, in climbing to the transition state; and the products lie above the reactants, so the reaction is endothermic.
        - |
          The sign is wrong: products (50 kJ/mol) are higher than reactants (20 kJ/mol), so ΔH is positive.
        - |
          Every activation energy is positive, for exothermic and endothermic reactions alike, so it cannot be the reason for the sign of ΔH.
        - |
          Correct. ΔH = E(products) − E(reactants) = 50 − 20 = +30 kJ/mol; the products sit in a higher valley, so the reaction absorbs energy.
      answer: 3
      explanation: |
        Practice 4. The sign of ΔH comes from the two valleys; the hill height is irrelevant to it.

    - slug: apchem-u05-w18-q03
      type: numeric
      topic_code: "5.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        Graph description: a reaction energy profile for the single-step gas-phase reaction X + Y → Z. The vertical axis is potential energy in kJ/mol and the horizontal axis is reaction progress. The reactants X + Y sit at 20 kJ/mol on the left, the curve rises smoothly to a single maximum at 95 kJ/mol, and falls to the product Z at 50 kJ/mol on the right.
      prompt: |
        Calculate the activation energy of the reverse reaction, Z → X + Y. Give your answer in kJ/mol as a whole number.
      answer: { value: 45, tolerance: 0 }
      explanation: |
        Ea(reverse) is the climb from the product valley (50 kJ/mol) to the transition state (95 kJ/mol): 95 − 50 = 45 kJ/mol. Equivalently Ea(reverse) = Ea(forward) − ΔH = 75 − 30 = 45 kJ/mol. The reverse reaction has the smaller barrier, as it must for an endothermic forward reaction.

    # ---- Stand-alone multiple choice
    - slug: apchem-u05-w18-q04
      type: multiple_choice
      topic_code: "5.4"
      source: "general knowledge"
      points: 1
      prompt: |
        The step NO(g) + O₃(g) → NO₂(g) + O₂(g) is elementary. Which rate law describes it?
      options:
        - "rate = k[NO][O₃]"
        - "rate = k[NO]²[O₃]"
        - "rate = k[NO₂][O₂]"
        - "rate = k[NO] + k[O₃]"
      option_explanations:
        - |
          Correct. For an elementary step the coefficients are the orders: one NO and one O₃ collide, so the rate is proportional to [NO][O₃]; the step is bimolecular.
        - |
          A square on [NO] would require two NO molecules in the collision; the step shows only one.
        - |
          Products do not appear in the rate law of a forward elementary step; the rate depends on how often the reactants collide.
        - |
          Rates multiply concentrations, they do not add them; a sum would mean the reaction could proceed with only one reactant present.
      answer: 0
      explanation: |
        Practice 1. Molecularity gives the rate law only when the step is elementary, which the question states.

    - slug: apchem-u05-w18-q05
      type: multiple_choice
      topic_code: "5.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Raising the temperature of a reaction mixture from 25 °C to 35 °C roughly doubles the rate of a typical reaction. Which statement best explains this large effect?
      options:
        - "The average kinetic energy of the molecules doubles."
        - "The number of collisions per second doubles."
        - "The fraction of collisions with energy greater than the activation energy increases greatly."
        - "The activation energy of the reaction falls by about half."
      option_explanations:
        - |
          Average kinetic energy is proportional to kelvin temperature: 298 K to 308 K is a rise of only about 3%, nowhere near doubling.
        - |
          Collision frequency grows with the square root of the kelvin temperature, a change of under 2% here; it is a minor contribution.
        - |
          Correct. The Maxwell–Boltzmann tail beyond Ea grows steeply with temperature, so a far larger share of the collisions can react even though the average energy barely changes.
        - |
          The activation energy is a property of the reaction pathway and does not change with temperature; only a catalyst changes Ea.
      answer: 2
      explanation: |
        Practice 6. The exponential e^(−Ea/RT) in the Arrhenius equation is the quantitative form of this argument.

    - slug: apchem-u05-w18-q06
      type: multiple_choice
      topic_code: "5.7"
      source: "general knowledge"
      points: 1
      prompt: |
        A proposed mechanism for the reaction 2 NO(g) + Br₂(g) → 2 NOBr(g) is:

        Step 1: NO + Br₂ → NOBr₂
        Step 2: NOBr₂ + NO → 2 NOBr

        Which species is an intermediate?
      options:
        - "NO"
        - "NOBr₂"
        - "NOBr"
        - "Br₂"
      option_explanations:
        - |
          NO is a reactant: it is consumed in both steps and appears on the left of the overall equation.
        - |
          Correct. NOBr₂ is formed in step 1 and consumed in step 2, so it cancels when the steps are added and is absent from the overall equation.
        - |
          NOBr is the product; it appears on the right of the overall equation, not as a species that cancels.
        - |
          Br₂ is a reactant consumed in step 1 and appearing in the overall equation.
      answer: 1
      explanation: |
        Practice 1. Add the steps: NO + Br₂ + NOBr₂ + NO → NOBr₂ + 2 NOBr; NOBr₂ cancels, leaving 2 NO + Br₂ → 2 NOBr.

    - slug: apchem-u05-w18-q07
      type: multiple_choice
      topic_code: "5.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A student proposes that the reaction 2 NO(g) + O₂(g) → 2 NO₂(g) occurs in a single termolecular step. Which is the best objection to this proposal?
      options:
        - "Termolecular steps are impossible because three molecules cannot occupy the same place."
        - "A single step cannot produce two molecules of product."
        - "The proposal predicts a rate law that is zero order in O₂."
        - "A simultaneous collision of three molecules with the right energy and orientation is so improbable that mechanisms with two bimolecular steps are strongly preferred."
      option_explanations:
        - |
          Termolecular steps are rare, not impossible; a few are known, so the objection is overstated.
        - |
          An elementary step may form any number of product molecules; the product count is not the issue.
        - |
          A termolecular step would be first order in O₂ (rate = k[NO]²[O₂]), so this objection misstates the prediction.
        - |
          Correct. The probability of three particles meeting at once with enough energy and the right geometry is tiny, so chemists prefer a sequence such as 2 NO ⇌ N₂O₂ followed by N₂O₂ + O₂ → 2 NO₂ unless there is strong evidence for the three-body step.
      answer: 3
      explanation: |
        Practice 6. Chemical reasonableness is one of the tests a mechanism must pass.

    - slug: apchem-u05-w18-q08
      type: multiple_choice
      topic_code: "5.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Graph description: for a reaction, ln k (y-axis) is plotted against 1/T in K⁻¹ (x-axis). The points fall on a straight line with slope −6.0 × 10³ K. What is the activation energy?
      options:
        - "50 kJ/mol"
        - "6.0 kJ/mol"
        - "0.72 kJ/mol"
        - "−50 kJ/mol"
      option_explanations:
        - |
          Correct. ln k = −(Ea/R)(1/T) + ln A, so slope = −Ea/R and Ea = 6.0 × 10³ K × 8.314 J/(mol·K) = 4.99 × 10⁴ J/mol ≈ 50 kJ/mol.
        - |
          6.0 kJ/mol takes the slope's number as Ea in kJ, skipping the multiplication by R.
        - |
          0.72 kJ/mol would come from dividing the slope by R instead of multiplying.
        - |
          Activation energies are always positive; the negative slope is what makes Ea positive.
      answer: 0
      explanation: |
        Practice 5. Ea = −slope × R, with R = 8.314 J/(mol·K).

    - slug: apchem-u05-w18-q09
      type: multiple_choice
      topic_code: "5.2"
      source: "general knowledge"
      points: 1
      prompt: |
        For the reaction A + B → C, the rate law is rate = k[A]²[B]. If the concentration of A is halved and the concentration of B is doubled, the rate will
      options:
        - "double"
        - "stay the same"
        - "be halved"
        - "be quartered"
      option_explanations:
        - |
          Doubling the rate would need the [B] effect alone; the [A] change also matters.
        - |
          Unchanged rate would need the two factors to cancel: (1/2)² × 2 = 1/2, so they do not.
        - |
          Correct. Halving [A] multiplies the rate by (1/2)² = 1/4; doubling [B] multiplies it by 2; the net factor is 1/4 × 2 = 1/2.
        - |
          Quartering is the effect of halving [A] alone, before accounting for the doubling of [B].
      answer: 2
      explanation: |
        Practice 5 (spiral from 5.2). Multiply the separate factors from each concentration change.

    - slug: apchem-u05-w18-q10
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Graph description: two Maxwell–Boltzmann distributions of molecular kinetic energy for the same gas sample are drawn on one set of axes (fraction of molecules against kinetic energy). Curve P has a tall, narrow peak at low energy; curve Q is lower and broader with its peak further to the right. Which statement is correct?
      options:
        - "Curve P is at the higher temperature, because its peak is taller."
        - "Curve Q is at the higher temperature, and the two curves enclose the same total area."
        - "Curve Q represents a higher concentration of the gas."
        - "Curve P shows a larger fraction of molecules above any given activation energy."
      option_explanations:
        - |
          A taller, narrower peak means most molecules cluster at low energy, which is the lower temperature.
        - |
          Correct. Raising the temperature spreads the molecules over a wider range of energies and shifts the most probable energy upward; the area under each curve is the total fraction, 1, so the areas are equal.
        - |
          The distribution's shape depends only on temperature; concentration changes how many molecules there are, not how their energies are spread.
        - |
          The lower-temperature curve has the smaller tail at high energy, so a smaller fraction exceeds any given Ea.
      answer: 1
      explanation: |
        Practice 4 (spiral from 3.5). Hotter means broader and flatter, with a bigger high-energy tail.

    - slug: apchem-u05-w18-q11
      type: multiple_choice
      topic_code: "5.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Two gas-phase reactions have the same activation energy and are run at the same temperature and concentrations, yet one is a thousand times faster. Which factor in the collision model best accounts for the difference?
      options:
        - "The slower reaction has a larger ΔH."
        - "The slower reaction's molecules move more slowly."
        - "The faster reaction has a larger fraction of collisions with energy above Ea."
        - "The faster reaction has a much larger fraction of collisions with an orientation that allows the new bonds to form."
      option_explanations:
        - |
          ΔH is the energy difference between products and reactants and does not enter the rate expression at all.
        - |
          At the same temperature, molecules of similar mass move at similar speeds; speed differences cannot produce a thousandfold change.
        - |
          With the same Ea and T, the exponential factor e^(−Ea/RT) is identical for both reactions.
        - |
          Correct. With Ea and T equal, the remaining difference is the frequency factor A, dominated by the orientation requirement: a reaction that works from almost any angle is far faster than one needing a precise geometry.
      answer: 3
      explanation: |
        Practice 6. k = A e^(−Ea/RT): when the exponential is fixed, A decides.

    # ---- Select all
    - slug: apchem-u05-w18-q12
      type: multi_select
      topic_code: "5.7"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        A mechanism is proposed for an overall reaction. Which of the following must be true for the mechanism to be acceptable? Select all that apply.
      options:
        - "The elementary steps add up to the overall balanced equation."
        - "The rate law predicted by the mechanism agrees with the experimentally determined rate law."
        - "Every step is unimolecular or bimolecular, unless there is strong evidence for a termolecular step."
        - "Each intermediate appears in the overall balanced equation."
        - "The mechanism has been proved correct by the match with the rate law."
      option_explanations:
        - |
          Correct. A mechanism is a decomposition of the overall change into steps, so the steps must sum to it, with intermediates cancelling.
        - |
          Correct. A mechanism that predicts the wrong rate law is rejected; consistency with the measured rate law is the main experimental test.
        - |
          Correct. Simultaneous three-body collisions are so improbable that termolecular steps need special justification.
        - |
          Intermediates are formed and consumed within the mechanism and cancel out, so by definition they do not appear in the overall equation.
        - |
          A match with the rate law supports a mechanism but cannot prove it, because other mechanisms might predict the same rate law.
      answer: [0, 1, 2]
      explanation: |
        Practice 6. Sum to the overall equation, be chemically reasonable, fit the rate law: consistency, not proof.

    - slug: apchem-u05-w18-q13
      type: multi_select
      topic_code: "5.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following changes increase the rate of a reaction by increasing the number of collisions per second between reactant particles, rather than by changing the energy or geometry of the collisions? Select all that apply.
      options:
        - "Increasing the concentration of a reactant in solution"
        - "Grinding a solid reactant into a fine powder"
        - "Adding a catalyst"
        - "Compressing a mixture of reacting gases into a smaller volume"
        - "Raising the temperature by 50 °C"
      option_explanations:
        - |
          Correct. More reactant particles per litre means more encounters per second; the energy distribution is unchanged.
        - |
          Correct. A powder exposes far more surface, so many more reactant particles can collide with the solid each second.
        - |
          A catalyst provides a pathway with a lower activation energy; it changes the fraction of collisions that succeed, not their number.
        - |
          Correct. Compressing a gas raises each partial pressure and concentration, so collisions are more frequent.
        - |
          Temperature raises the collision frequency only slightly; its main effect is on the fraction of collisions with energy above Ea, so it is not primarily a collision-count effect.
      answer: [0, 1, 3]
      explanation: |
        Practice 4. Concentration and surface area act on collision frequency; temperature and catalysts act mainly on the energy requirement.

    # ---- True/false
    - slug: apchem-u05-w18-q14
      type: true_false
      topic_code: "5.4"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: the rate law of a unimolecular elementary step A → products is rate = k[A], so the step is first order in A.
      answer: true
      explanation: |
        True. In an elementary step the coefficients are the orders. A single molecule of A falling apart or rearranging gives a rate proportional to the number of A molecules present, which is first order. Radioactive decay and the dissociation of N₂O₄ into NO₂ behave this way.

    - slug: apchem-u05-w18-q15
      type: true_false
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: for a reaction that is second order in A, doubling the initial concentration of A doubles the half-life.
      answer: false
      explanation: |
        False. For second order t½ = 1/(k[A]₀), so doubling [A]₀ halves the half-life. A higher concentration means more frequent collisions and a faster first halving. It is the first-order half-life, 0.693/k, that is unaffected by concentration.

