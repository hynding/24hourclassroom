    # ---- Short answer
    - slug: apchem-u05-w18-q20
      type: short_answer
      topic_code: "5.7"
      source: "general knowledge"
      points: 3
      prompt: |
        The reaction 2 NO₂(g) + F₂(g) → 2 NO₂F(g) has the experimental rate law rate = k[NO₂][F₂]. A student proposes this mechanism:

        Step 1: NO₂ + F₂ → NO₂F + F (slow)
        Step 2: NO₂ + F → NO₂F (fast)

        (a) Show that the two steps add to give the overall equation and identify the intermediate.
        (b) State the molecularity of each step and write the rate law for step 1.
        (c) Explain whether the mechanism is consistent with the experimental rate law.
      answer: |
        (a) Adding: NO₂ + F₂ + NO₂ + F → NO₂F + F + NO₂F. The F atom appears on both sides and cancels, leaving 2 NO₂ + F₂ → 2 NO₂F. The intermediate is the fluorine atom, F.
        (b) Both steps are bimolecular (two particles collide in each). Step 1: rate = k₁[NO₂][F₂].
        (c) Yes. The slow step controls the rate, and its rate law, k₁[NO₂][F₂], has the same form as the experimental rate law (first order in each reactant), so the mechanism is consistent with the data. It is not proved by this agreement.
      explanation: |
        Three points, one per part.

        (a) 1 pt: the steps are summed, F is shown to cancel, and F is named as the intermediate.
        (b) 1 pt: both bimolecular; rate = k[NO₂][F₂] for step 1 (accept k₁).
        (c) 1 pt: the slow-step rate law matches the experimental rate law, so the mechanism is consistent; a statement that this supports but does not prove the mechanism earns the point as well.

    - slug: apchem-u05-w18-q21
      type: short_answer
      topic_code: "3.5"
      source: "general knowledge"
      points: 3
      prompt: |
        A sample of gas-phase reactant is held at 300 K and then warmed to 400 K.
        (a) Describe how the Maxwell–Boltzmann distribution of molecular kinetic energies changes when the sample is warmed. Mention the peak and the area under the curve.
        (b) Using the distribution, explain why the reaction rate at 400 K is much greater than at 300 K even though the average kinetic energy rises by only one third.
        (c) Explain why increasing the concentration of the reactant at 300 K does not change the distribution, yet still increases the rate.
      answer: |
        (a) The warmer curve is lower and broader; its peak (most probable energy) shifts to higher energy; the area under the curve is unchanged because it represents the total fraction of molecules, which is 1.
        (b) Only collisions with kinetic energy at or above the activation energy can react. The fraction of molecules in the high-energy tail beyond Ea grows far faster than the average energy, so a much larger share of collisions succeeds at 400 K.
        (c) The distribution depends only on temperature, so adding more molecules at 300 K leaves the fraction above Ea unchanged. However, more molecules per litre produce more collisions per second, and the same fraction of a larger number of collisions is a larger number of successful collisions, so the rate rises.
      explanation: |
        Three points, one per part.

        (a) 1 pt: lower and broader curve with peak shifted right, and area unchanged (equal to 1 or the total number of molecules).
        (b) 1 pt: fraction of collisions with energy at least Ea increases greatly (the tail beyond Ea), which is the controlling factor; mention of Ea required.
        (c) 1 pt: distribution depends only on temperature; concentration raises the collision frequency so more collisions, and thus more successful collisions, occur per second.

    # ---- Long answer
    - slug: apchem-u05-w18-q22
      type: long_answer
      topic_code: "5.6"
      source: "general knowledge"
      points: 6
      stimulus: |
        The rate constant for the first-order isomerisation of a cyclic hydrocarbon was measured at four temperatures:

        | T (K) | 300 | 320 | 340 | 360 |
        |---|---|---|---|---|
        | k (s⁻¹) | 0.0176 | 0.0650 | 0.205 | 0.570 |
      prompt: |
        (a) Using the data at 300 K and 360 K, calculate the activation energy of the reaction in kJ/mol. (R = 8.314 J/(mol·K))
        (b) Describe the plot a student would make to obtain Ea from all four points, stating what is plotted on each axis and how Ea is read from the graph.
        (c) Calculate the half-life of the reaction at 340 K.
        (d) Draw (describe in words) the reaction energy profile for this isomerisation, given that the reaction is exothermic by 25 kJ/mol. Label Ea, the transition state and ΔH.
        (e) The student suggests running the reaction at 300 K with twice the starting concentration to make it go faster. Explain, with reference to the collision model, what effect this has on the rate and on the rate constant.
        (f) Explain in terms of the Maxwell–Boltzmann distribution why the rate constant rises by a factor of about 32 between 300 K and 360 K although the average kinetic energy rises by only 20%.
      answer: |
        (a) ln(k₂/k₁) = ln(0.570/0.0176) = ln(32.4) = 3.48. 1/T₂ − 1/T₁ = 1/360 − 1/300 = 0.0027778 − 0.0033333 = −5.556 × 10⁻⁴ K⁻¹. Ea = −R ln(k₂/k₁)/(1/T₂ − 1/T₁) = −(8.314)(3.48)/(−5.556 × 10⁻⁴) = 5.2 × 10⁴ J/mol = 52 kJ/mol.
        (b) Plot ln k (y-axis) against 1/T in K⁻¹ (x-axis). The points fall on a straight line whose slope is −Ea/R; Ea = −slope × 8.314 J/(mol·K). The intercept is ln A.
        (c) First order: t½ = 0.693/k = 0.693/0.205 s⁻¹ = 3.38 s.
        (d) A single hill: the reactant valley on the left, a smooth rise to the transition state 52 kJ/mol above the reactants, then a descent to the product valley 25 kJ/mol below the reactants. Ea(forward) = 52 kJ/mol, ΔH = −25 kJ/mol, Ea(reverse) = 77 kJ/mol.
        (e) Doubling the concentration doubles the number of molecules per litre, so twice as many molecules gain enough energy per second and the rate doubles (rate = k[A]). The rate constant is unchanged: k depends only on temperature and the pathway, not on concentration.
        (f) Only molecules with energy at or above Ea (52 kJ/mol, far above the average of a few kJ/mol) can react. Warming from 300 K to 360 K broadens the distribution and shifts its peak slightly, but the area of the high-energy tail beyond Ea grows exponentially, by a factor of e^(−Ea/R)(1/360 − 1/300) ≈ 32, which is what k measures.
      explanation: |
        Six points.

        (a) 1 pt: correct use of ln(k₂/k₁) = −(Ea/R)(1/T₂ − 1/T₁) giving Ea ≈ 52 kJ/mol (accept 50–54 kJ/mol).
        (b) 1 pt: ln k versus 1/T, straight line, slope = −Ea/R (so Ea = −slope × R).
        (c) 1 pt: t½ = 0.693/k = 3.4 s (accept 3.3–3.4 s).
        (d) 1 pt: single-peak profile with products below reactants; Ea labelled as the rise to the peak (52 kJ/mol), ΔH as the drop between valleys (−25 kJ/mol), transition state at the peak. Accept Ea(reverse) = 77 kJ/mol as extra.
        (e) 1 pt: rate doubles because collision frequency (number of molecules with sufficient energy per second) doubles; k is unchanged because it depends only on temperature.
        (f) 1 pt: fraction of molecules with energy at least Ea (the high-energy tail) increases exponentially with T; the average energy is irrelevant because it is far below Ea.
