week: 17
unit: 5
title: "Reaction Rates and Rate Laws"
topics: ["5.1", "5.2", "5.3"]
guide: guides/week-17.md
guide_description: |
  How a reaction rate is defined and measured, how the coefficients of a balanced equation relate the rates of
  different species, how the method of initial rates gives the orders and the rate constant with its units, and
  how the three integrated rate laws and their straight-line plots identify an order and predict a concentration
  at a later time. Worked examples for every calculation type and the first-order half-life.
flashcards_description: |
  28 cards on rate definitions, the method of initial rates, units of k, the integrated rate laws, their plots
  and half-lives.

flashcards:
  - front: Rate of a reaction in terms of one species → sign and units
    back: |
      Rate = −Δ[reactant]/Δt or +Δ[product]/Δt, so the rate is always reported as a positive number. The usual units are M/s (mol/(L·s)); minutes appear when the reaction is slow.
    topic_code: "5.1"
  - front: Relating the rates of two species in one reaction → the rule
    back: |
      Divide each species' rate by its coefficient to get one reaction rate. For 2 N₂O₅ → 4 NO₂ + O₂, NO₂ forms four times as fast as O₂ and N₂O₅ disappears twice as fast as O₂ forms.
    hint: bigger coefficient, faster change
    topic_code: "5.1"
  - front: Average rate versus instantaneous rate of reaction
    back: |
      Average rate is Δ[A]/Δt over an interval from a table. Instantaneous rate is the slope of the tangent to the concentration–time curve at one moment. The initial rate is the tangent at t = 0, when concentrations are exactly what was mixed.
    topic_code: "5.1"
  - front: Five factors that change a reaction rate
    back: |
      Concentration (more collisions per second), temperature (more collisions with enough energy), surface area of a solid (only the surface reacts), solvent (stabilises or destabilises the transition state) and a catalyst (a lower-energy pathway).
    topic_code: "5.1"
  - front: Ways to follow a reaction's progress in the lab
    back: |
      Absorbance of a coloured species (Beer–Lambert law), pressure of a gas at fixed V and T, conductivity of an ionic solution, volume of gas collected, or titrating samples quenched at known times. Each is proportional to a concentration.
    topic_code: "5.1"
  - front: General rate law for A + B → products → what each symbol means
    back: |
      rate = k[A]ᵐ[B]ⁿ. The orders m and n come only from experiment; k is the rate constant, which depends on temperature and catalyst but not on concentration.
    topic_code: "5.2"
  - front: Are rate-law exponents the coefficients of the balanced equation?
    back: |
      No. Orders are measured. They equal coefficients only for a single elementary step (week 18). The overall equation for a multistep reaction says nothing about its orders.
    topic_code: "5.2"
  - front: Method of initial rates → how to extract one order
    back: |
      Pick two experiments where only one concentration changes. rate₂/rate₁ = ([A]₂/[A]₁)ᵐ. A factor of 2 in [A] giving a factor of 2 in rate means m = 1; a factor of 4 means m = 2; no change means m = 0.
    topic_code: "5.2"
  - front: Order from a non-integer concentration ratio → use logs
    back: |
      m = log(rate₂/rate₁) / log([A]₂/[A]₁). For example, raising [A] from 0.10 to 0.30 M and seeing the rate rise by 9.0 gives m = log 9/log 3 = 2.
    topic_code: "5.2"
  - front: Units of the rate constant k for overall order p
    back: |
      M¹⁻ᵖ·s⁻¹, so that k times concentrations gives M/s. Zero order: M/s. First order: s⁻¹. Second order: M⁻¹·s⁻¹. Third order: M⁻²·s⁻¹.
    hint: rate units divided by concentration units to the overall order
    topic_code: "5.2"
  - front: Overall order of a reaction → definition
    back: |
      The sum of the individual orders in the rate law. rate = k[NO]²[O₂] is second order in NO, first order in O₂ and third order overall.
    topic_code: "5.2"
  - front: Zero order in a reactant → what it means physically
    back: |
      Changing that reactant's concentration does not change the rate. It happens when something else limits the rate: a saturated catalyst surface, a saturated enzyme, or a reactant that enters only after the rate-determining step.
    topic_code: "5.2"
  - front: Pseudo-first-order conditions → what they are and why they are used
    back: |
      Every reactant but one is present in large excess, so their concentrations are effectively constant and get folded into an observed k. The reaction then looks first order in the limiting reactant, which makes k easy to measure.
    topic_code: "5.2"
  - front: Integrated rate law for a first-order reaction
    back: |
      ln[A]ₜ = −kt + ln[A]₀. A plot of ln[A] against t is a straight line with slope −k and intercept ln[A]₀.
    topic_code: "5.3"
  - front: Integrated rate law for a second-order reaction
    back: |
      1/[A]ₜ = kt + 1/[A]₀. A plot of 1/[A] against t is a straight line with slope +k and intercept 1/[A]₀.
    topic_code: "5.3"
  - front: Integrated rate law for a zero-order reaction
    back: |
      [A]ₜ = −kt + [A]₀. A plot of [A] against t is a straight line with slope −k; the concentration falls by equal amounts in equal times until the reactant is gone.
    topic_code: "5.3"
  - front: Half-life of a first-order reaction → formula and key property
    back: |
      t½ = 0.693/k = ln 2/k. It does not depend on the starting concentration, so every successive halving takes the same time. Radioactive decay is the classic example.
    topic_code: "5.3"
  - front: Half-life of a second-order reaction → formula and behaviour
    back: |
      t½ = 1/(k[A]₀). It doubles each time the concentration halves, so the reaction slows dramatically at low concentration.
    topic_code: "5.3"
  - front: Half-life of a zero-order reaction → formula and behaviour
    back: |
      t½ = [A]₀/(2k). It shrinks as the concentration falls, because the rate stays constant while there is less left to use up.
    topic_code: "5.3"
  - front: Identifying order from a concentration–time table without plotting
    back: |
      Equal drops in equal times → zero order. Same fraction lost in equal times (constant half-life) → first order. Successive half-lives doubling → second order.
    topic_code: "5.3"
  - front: Which linear plot proves which order
    back: |
      Straight line in [A] vs t → zero order. Straight line in ln[A] vs t → first order. Straight line in 1/[A] vs t → second order. Only one of the three will be straight for a given data set.
    topic_code: "5.3"
  - front: Fraction of a first-order reactant left after n half-lives
    back: |
      (1/2)ⁿ. After three half-lives 1/8 remains (12.5%); after four, 1/16. Use ln[A]ₜ = −kt + ln[A]₀ when the elapsed time is not a whole number of half-lives.
    topic_code: "5.3"
  - front: Rate constant from a first-order graph's slope → sign to watch
    back: |
      The slope of ln[A] vs t is −k, so k is the magnitude of the slope. A slope of −0.0231 min⁻¹ means k = 0.0231 min⁻¹ and t½ = 0.693/0.0231 = 30.0 min.
    topic_code: "5.3"
  - front: Why rate-law problems use initial rates rather than later rates
    back: |
      At t = 0 the concentrations are exactly the amounts mixed, no products have accumulated to run a reverse reaction, and the tangent is easiest to read. Later rates need the integrated rate law.
    topic_code: "5.2"
  - front: Rate of a gas-phase reaction followed by pressure → the link to concentration
    back: |
      At fixed V and T, PV = nRT makes the partial pressure of each gas proportional to its molarity (n/V = P/RT). So a rate in atm/s converts to M/s by dividing by RT.
    topic_code: "3.4"
  - front: Beer–Lambert law as a kinetics tool
    back: |
      A = εbc, so absorbance is proportional to the concentration of a coloured species. Recording absorbance against time with a spectrometer gives a concentration–time curve without disturbing the reaction.
    topic_code: "3.13"
  - front: Stoichiometric link between rates → worked check
    back: |
      For 2 H₂O₂ → 2 H₂O + O₂, if O₂ appears at 5.0 × 10⁻⁴ M/s then H₂O₂ disappears at 1.0 × 10⁻³ M/s, because two H₂O₂ are consumed for each O₂ produced.
    topic_code: "4.5"
  - front: Doubling a reactant's concentration and the rate rises by a factor of 8 → order?
    back: |
      Third order in that reactant: 2³ = 8. Rare, but it appears in questions to test that you compute 2ᵐ rather than assume 1 or 2.
    topic_code: "5.2"

quiz:
  description: |
    22 questions · about 40 minutes · topics 5.1–5.3 (reaction rates, rate laws from initial-rate data, integrated
    rate laws and half-lives), with review of stoichiometry, gas laws, molarity and the Beer–Lambert law from
    Units 3 and 4. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: initial-rate data (5.2)
    - slug: apchem-u05-w17-q01
      type: multiple_choice
      topic_code: "5.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        Initial-rate data at 25 °C for the reaction 2 ClO₂(aq) + 2 OH⁻(aq) → ClO₃⁻(aq) + ClO₂⁻(aq) + H₂O(l):

        | Experiment | [ClO₂]₀ (M) | [OH⁻]₀ (M) | Initial rate (M/s) |
        |---|---|---|---|
        | 1 | 0.020 | 0.030 | 2.76 × 10⁻³ |
        | 2 | 0.040 | 0.030 | 1.10 × 10⁻² |
        | 3 | 0.040 | 0.060 | 2.21 × 10⁻² |
      prompt: |
        What is the order of the reaction with respect to ClO₂?
      options:
        - "Zero order"
        - "First order"
        - "Second order"
        - "Third order"
      option_explanations:
        - |
          Zero order would mean the rate does not change when [ClO₂] changes, but the rate quadruples between experiments 1 and 2.
        - |
          First order would double the rate when [ClO₂] doubles; the observed factor is 1.10 × 10⁻² / 2.76 × 10⁻³ ≈ 4.0, not 2.
        - |
          Correct. Between experiments 1 and 2 only [ClO₂] changes, and it doubles; the rate rises by a factor of 4.0 = 2², so the order in ClO₂ is 2.
        - |
          Third order would raise the rate by 2³ = 8 when the concentration doubles; the data show a factor of 4.
      answer: 2
      explanation: |
        Practice 5. Compare the two experiments that differ in only one concentration and ask what power of 2 reproduces the rate ratio.

    - slug: apchem-u05-w17-q02
      type: multiple_choice
      topic_code: "5.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        Initial-rate data at 25 °C for the reaction 2 ClO₂(aq) + 2 OH⁻(aq) → ClO₃⁻(aq) + ClO₂⁻(aq) + H₂O(l):

        | Experiment | [ClO₂]₀ (M) | [OH⁻]₀ (M) | Initial rate (M/s) |
        |---|---|---|---|
        | 1 | 0.020 | 0.030 | 2.76 × 10⁻³ |
        | 2 | 0.040 | 0.030 | 1.10 × 10⁻² |
        | 3 | 0.040 | 0.060 | 2.21 × 10⁻² |
      prompt: |
        Which rate law is consistent with the data?
      options:
        - "rate = k[ClO₂]²[OH⁻]"
        - "rate = k[ClO₂][OH⁻]"
        - "rate = k[ClO₂]²[OH⁻]²"
        - "rate = k[ClO₂][OH⁻]²"
      option_explanations:
        - |
          Correct. ClO₂ is second order (experiments 1 and 2). Between experiments 2 and 3 only [OH⁻] changes, doubling, and the rate doubles (2.21 × 10⁻² / 1.10 × 10⁻² ≈ 2.0), so OH⁻ is first order.
        - |
          First order in ClO₂ does not fit: doubling [ClO₂] quadrupled the rate rather than doubling it.
        - |
          Second order in OH⁻ would quadruple the rate between experiments 2 and 3; it only doubled.
        - |
          Both exponents are the wrong way round: the data show [ClO₂] squared and [OH⁻] to the first power, not the reverse. The coefficients in the balanced equation are 2 and 2, which is exactly why orders must come from data.
      answer: 0
      explanation: |
        Practice 5. Note that the orders (2 and 1) do not match the coefficients (2 and 2): rate laws are experimental.

    - slug: apchem-u05-w17-q03
      type: numeric
      topic_code: "5.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        Initial-rate data at 25 °C for the reaction 2 ClO₂(aq) + 2 OH⁻(aq) → ClO₃⁻(aq) + ClO₂⁻(aq) + H₂O(l):

        | Experiment | [ClO₂]₀ (M) | [OH⁻]₀ (M) | Initial rate (M/s) |
        |---|---|---|---|
        | 1 | 0.020 | 0.030 | 2.76 × 10⁻³ |
        | 2 | 0.040 | 0.030 | 1.10 × 10⁻² |
        | 3 | 0.040 | 0.060 | 2.21 × 10⁻² |
      prompt: |
        Using the rate law rate = k[ClO₂]²[OH⁻] and experiment 1, calculate the rate constant k. Give your answer in M⁻²·s⁻¹ to the nearest whole number.
      answer: { value: 230, tolerance: 5 }
      explanation: |
        k = rate / ([ClO₂]²[OH⁻]) = 2.76 × 10⁻³ / ((0.020)² × 0.030) = 2.76 × 10⁻³ / (4.0 × 10⁻⁴ × 0.030) = 2.76 × 10⁻³ / 1.2 × 10⁻⁵ = 230 M⁻²·s⁻¹. The units follow from M/s ÷ M³ = M⁻²·s⁻¹ for a third-order reaction.

    # ---- Stand-alone multiple choice
    - slug: apchem-u05-w17-q04
      type: multiple_choice
      topic_code: "5.1"
      source: "general knowledge"
      points: 1
      prompt: |
        In the reaction 2 N₂O₅(g) → 4 NO₂(g) + O₂(g), the concentration of O₂ increases at 3.0 × 10⁻⁴ M/s at a certain moment. At what rate is N₂O₅ being consumed at that moment?
      options:
        - "1.5 × 10⁻⁴ M/s"
        - "3.0 × 10⁻⁴ M/s"
        - "6.0 × 10⁻⁴ M/s"
        - "1.2 × 10⁻³ M/s"
      option_explanations:
        - |
          Halving would be right if N₂O₅ had half the coefficient of O₂; it has twice the coefficient, so it changes twice as fast, not half as fast.
        - |
          Equal rates would need equal coefficients. N₂O₅ has coefficient 2 and O₂ has coefficient 1.
        - |
          Correct. Two N₂O₅ are consumed for every O₂ formed, so N₂O₅ disappears at 2 × 3.0 × 10⁻⁴ = 6.0 × 10⁻⁴ M/s.
        - |
          A factor of 4 is the NO₂ : O₂ ratio: NO₂ forms at 1.2 × 10⁻³ M/s, but the question asks about N₂O₅.
      answer: 2
      explanation: |
        Practice 5. Rate of a species = (its coefficient / the other's coefficient) × the other's rate.

    - slug: apchem-u05-w17-q05
      type: multiple_choice
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Graph description: for the decomposition of a compound X, a plot of 1/[X] (in M⁻¹) against time (in s) is a straight line with a positive slope, while plots of [X] and ln[X] against time are both curved. Which conclusion follows?
      options:
        - "The reaction is first order in X and the slope equals −k."
        - "The reaction is zero order in X and the slope equals k."
        - "The reaction is second order in X and the slope equals −k."
        - "The reaction is second order in X and the slope equals k."
      option_explanations:
        - |
          A first-order reaction gives a straight line in ln[X], not 1/[X]; the ln plot is described as curved here.
        - |
          A zero-order reaction gives a straight line in [X] itself; that plot is curved here.
        - |
          The order is right but the sign is wrong: 1/[X]ₜ = kt + 1/[X]₀ has slope +k, consistent with the positive slope described.
        - |
          Correct. Only a second-order reaction linearises as 1/[X] against t, and the integrated law 1/[X]ₜ = kt + 1/[X]₀ shows the slope is +k.
      answer: 3
      explanation: |
        Practice 4. Match the straight-line plot to the integrated rate law and read k from the slope with the right sign.

    - slug: apchem-u05-w17-q06
      type: multiple_choice
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A reactant's concentration falls from 0.80 M to 0.40 M in 20 s and then from 0.40 M to 0.20 M in a further 40 s. What is the order of the reaction in this reactant?
      options:
        - "Zero order, because the rate is constant"
        - "Second order, because the half-life doubles as the concentration halves"
        - "First order, because the half-life is constant"
        - "It cannot be determined without the rate constant"
      option_explanations:
        - |
          A constant rate would remove equal amounts in equal times; here 0.40 M is removed in 20 s but only 0.20 M in the next 40 s, so the rate is falling.
        - |
          Correct. For a second-order reaction t½ = 1/(k[A]₀), so when [A]₀ halves the half-life doubles: 20 s, then 40 s.
        - |
          The half-life is not constant: the first halving took 20 s and the second took 40 s.
        - |
          The pattern of successive half-lives alone fixes the order; k is not needed for this decision.
      answer: 1
      explanation: |
        Practice 4. Successive half-lives: constant means first order, doubling means second order, shrinking means zero order.

    - slug: apchem-u05-w17-q07
      type: multiple_choice
      topic_code: "5.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A reaction has the rate law rate = k[A][B]². What are the units of k if concentrations are in M and time in seconds?
      options:
        - "s⁻¹"
        - "M⁻¹·s⁻¹"
        - "M·s⁻¹"
        - "M⁻²·s⁻¹"
      option_explanations:
        - |
          s⁻¹ is the unit of a first-order rate constant; this reaction is third order overall.
        - |
          M⁻¹·s⁻¹ belongs to a second-order reaction. The exponents here add to 3.
        - |
          M/s is the unit of a zero-order rate constant, where k alone equals the rate.
        - |
          Correct. Overall order is 1 + 2 = 3, so k = rate/(M³) has units (M/s)/M³ = M⁻²·s⁻¹.
      answer: 3
      explanation: |
        Practice 5. Units of k are M¹⁻ᵖ·s⁻¹ for overall order p.

    - slug: apchem-u05-w17-q08
      type: multiple_choice
      topic_code: "5.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which change would most likely increase the initial rate of the reaction between zinc metal and 1.0 M hydrochloric acid at 25 °C?
      options:
        - "Replacing the 1.0 M HCl with 1.0 M acetic acid at the same temperature"
        - "Using the same mass of zinc as a powder instead of a single lump"
        - "Diluting the acid to 0.50 M before adding the zinc"
        - "Cooling the acid to 5 °C before adding the zinc"
      option_explanations:
        - |
          Acetic acid is weak, so its H⁺ concentration is far lower than 1.0 M; fewer H⁺ ions collide with the zinc each second and the rate falls.
        - |
          Correct. A powder exposes far more metal surface to the acid, so many more collisions between H⁺ and zinc atoms occur per second.
        - |
          Halving the H⁺ concentration halves the number of H⁺ collisions with the surface per second, slowing the reaction.
        - |
          Lower temperature means slower molecules and a smaller fraction of collisions with enough energy to react.
      answer: 1
      explanation: |
        Practice 2 and 4. Surface area, concentration and temperature all act through the number and energy of collisions.

    - slug: apchem-u05-w17-q09
      type: multiple_choice
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        The radioactive isotope iodine-131 decays by a first-order process with a half-life of 8.0 days. What fraction of a sample remains after 32 days?
      options:
        - "1/4"
        - "1/16"
        - "1/8"
        - "1/32"
      option_explanations:
        - |
          One quarter remains after two half-lives (16 days), not four.
        - |
          Correct. 32 days is four half-lives, and (1/2)⁴ = 1/16 of the original remains.
        - |
          One eighth remains after three half-lives (24 days).
        - |
          Dividing 32 by 1 would be wrong: the fraction after n half-lives is (1/2)ⁿ, and n = 32/8 = 4 gives 1/16.
      answer: 1
      explanation: |
        Practice 5. First-order half-lives are constant, so count them and apply (1/2)ⁿ.

    - slug: apchem-u05-w17-q10
      type: multiple_choice
      topic_code: "3.13"
      source: "general knowledge"
      points: 1
      prompt: |
        A student follows the reaction of a violet dye with bleach by measuring the solution's absorbance at 590 nm every 10 s. Which statement best justifies using absorbance to measure the rate?
      options:
        - "Absorbance is proportional to the dye concentration by the Beer–Lambert law, so a plot of absorbance against time has the same shape as a concentration–time plot."
        - "Absorbance measures the temperature of the solution, which controls the rate."
        - "Absorbance equals the rate constant of the reaction directly."
        - "Absorbance counts the number of collisions between dye and bleach molecules."
      option_explanations:
        - |
          Correct. A = εbc, with ε and the path length b fixed, so absorbance tracks the dye's concentration; the method follows the reaction without removing samples.
        - |
          A spectrometer measures light transmitted through the sample, not temperature; the temperature is held constant separately.
        - |
          The rate constant is extracted from how absorbance changes with time, not from any single absorbance reading.
        - |
          Collisions are not observed directly by any instrument; absorbance reports how much coloured species is present.
      answer: 0
      explanation: |
        Practice 2. Choosing a measurable property proportional to concentration is the first step of any kinetics experiment.

    - slug: apchem-u05-w17-q11
      type: multiple_choice
      topic_code: "4.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Hydrogen peroxide decomposes according to 2 H₂O₂(aq) → 2 H₂O(l) + O₂(g). If 0.040 mol of O₂ is collected from the decomposition in 250 mL of solution, by how much did the molarity of H₂O₂ fall?
      options:
        - "0.080 M"
        - "0.16 M"
        - "0.040 M"
        - "0.32 M"
      option_explanations:
        - |
          0.080 mol is the amount of H₂O₂ consumed, but the question asks for the change in molarity in 0.250 L.
        - |
          0.16 M would follow from 0.040 mol in 0.250 L, which is the change in O₂ expressed as if it stayed in solution; H₂O₂ is consumed at twice that amount.
        - |
          0.040 M ignores both the 2:1 mole ratio and the division by the 0.250 L volume.
        - |
          Correct. 0.040 mol O₂ means 2 × 0.040 = 0.080 mol H₂O₂ consumed; 0.080 mol / 0.250 L = 0.32 M.
      answer: 3
      explanation: |
        Practice 5 (spiral from 4.5). Rate problems always rest on mole ratios and molarity = mol/L.

    # ---- Select all
    - slug: apchem-u05-w17-q12
      type: multi_select
      topic_code: "5.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about a first-order reaction A → products are correct? Select all that apply.
      options:
        - "A plot of ln[A] against time is a straight line with slope −k."
        - "The half-life is independent of the initial concentration of A."
        - "Doubling [A] doubles the rate."
        - "The rate constant k has units of M⁻¹·s⁻¹."
        - "The concentration of A falls by equal amounts in equal time intervals."
      option_explanations:
        - |
          Correct. ln[A]ₜ = −kt + ln[A]₀ is the equation of a line in ln[A] with slope −k.
        - |
          Correct. t½ = 0.693/k contains no concentration, so every successive halving takes the same time.
        - |
          Correct. rate = k[A], so the rate is directly proportional to [A].
        - |
          For a first-order reaction k has units of s⁻¹; M⁻¹·s⁻¹ belongs to second order.
        - |
          Equal drops in equal times describe zero order; a first-order reactant loses the same fraction, not the same amount, in each interval.
      answer: [0, 1, 2]
      explanation: |
        Practice 4. The three fingerprints of first order: linear ln plot, constant half-life, rate proportional to [A].

    - slug: apchem-u05-w17-q13
      type: multi_select
      topic_code: "5.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        A student wants to measure the rate of the reaction Mg(s) + 2 HCl(aq) → MgCl₂(aq) + H₂(g). Which of the following could be used to follow the reaction's progress? Select all that apply.
      options:
        - "Measuring the volume of hydrogen gas collected over water at fixed intervals"
        - "Measuring the mass of the flask and its contents on an open balance over time"
        - "Measuring the absorbance of the colourless solution at 450 nm"
        - "Measuring the pressure in a sealed flask of fixed volume at constant temperature"
        - "Counting the number of collisions per second with a stopwatch"
      option_explanations:
        - |
          Correct. The volume of H₂ produced is proportional to the moles of Mg consumed, so volume against time gives the rate.
        - |
          Correct. Hydrogen escapes, so the system loses mass at a rate proportional to the reaction rate; a balance reading against time works (the loss is small, so a sensitive balance is needed).
        - |
          None of the species in this reaction absorbs visible light, so the absorbance stays at zero and tells you nothing.
        - |
          Correct. At fixed V and T the pressure rise is proportional to the moles of H₂ formed (PV = nRT).
        - |
          Collisions happen on a scale of 10⁹ or more per second per molecule and cannot be counted by any stopwatch.
      answer: [0, 1, 3]
      explanation: |
        Practice 2. Any property proportional to the amount of a reactant or product can follow a reaction; a coloured species is needed for absorbance.

    # ---- True/false
    - slug: apchem-u05-w17-q14
      type: true_false
      topic_code: "4.5"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: in the reaction N₂(g) + 3 H₂(g) → 2 NH₃(g), the rate of disappearance of H₂ is three times the rate of disappearance of N₂.
      answer: true
      explanation: |
        True. The coefficients fix the ratio: three moles of H₂ are consumed for each mole of N₂, so at any moment −Δ[H₂]/Δt = 3 × (−Δ[N₂]/Δt). The reaction rate itself is defined as −Δ[N₂]/Δt = −(1/3)Δ[H₂]/Δt = (1/2)Δ[NH₃]/Δt.

    - slug: apchem-u05-w17-q15
      type: true_false
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: for a gas-phase reaction in a rigid container at constant temperature, the partial pressure of a reactant is directly proportional to its molar concentration, so a pressure–time plot can replace a concentration–time plot.
      answer: true
      explanation: |
        True. From PV = nRT, P = (n/V)RT = [gas]RT; with R and T constant, P is proportional to molarity. Dividing a pressure in atm by RT (0.08206 × T) converts it to mol/L, and the shape of the plot, and therefore the order, is unchanged.

    # ---- Fill in the blank
    - slug: apchem-u05-w17-q16
      type: fill_blank
      topic_code: "3.7"
      source: "general knowledge"
      points: 1
      prompt: |
        To set up a rate experiment, a student mixes 25.0 mL of 0.200 M KI with 25.0 mL of 0.100 M Na₂S₂O₈. At the instant of mixing, the concentration of I⁻ in the mixture is ____ M.
      answer: ["0.100", "0.1", "0.100 M", "0.1 M"]
      explanation: |
        Mixing equal volumes doubles the total volume to 50.0 mL, so each concentration halves: M₁V₁ = M₂V₂ gives 0.200 M × 25.0 mL / 50.0 mL = 0.100 M. Initial-rate tables always list concentrations after mixing, so this dilution step is the first move in the lab.

    - slug: apchem-u05-w17-q17
      type: fill_blank
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        For a reaction that is second order in A, a straight line is obtained by plotting ____ against time.
      answer: ["1/[A]", "1/[A] (reciprocal concentration)", "the reciprocal of [A]", "reciprocal concentration", "1/[A]t", "1 over [A]"]
      explanation: |
        The second-order integrated rate law is 1/[A]ₜ = kt + 1/[A]₀, a straight line in 1/[A] with slope k. First order linearises as ln[A], zero order as [A] itself.

    # ---- Numeric
    - slug: apchem-u05-w17-q18
      type: numeric
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        The decomposition of a drug in the bloodstream is first order with k = 0.0462 h⁻¹. If the initial concentration is 8.00 mg/L, what is the concentration after 10.0 hours? Give your answer in mg/L to two decimal places.
      answer: { value: 5.04, tolerance: 0.05 }
      explanation: |
        ln[A]ₜ = −kt + ln[A]₀ = −(0.0462)(10.0) + ln 8.00 = −0.462 + 2.079 = 1.617, so [A]ₜ = e¹·⁶¹⁷ = 5.04 mg/L. Check with the half-life: t½ = 0.693/0.0462 = 15.0 h, and 10 h is two thirds of a half-life, so a little more than half (4.00) should remain, which 5.04 is.

    - slug: apchem-u05-w17-q19
      type: numeric
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        In a rigid 2.00 L flask at 300 K, the partial pressure of a gaseous reactant falls at an initial rate of 0.0246 atm/s. Using R = 0.08206 L·atm/(mol·K), convert this to a rate of change of molarity. Give your answer in M/s to three significant figures (for example 0.00100).
      answer: { value: 0.00100, tolerance: 0.00002 }
      explanation: |
        [gas] = P/(RT), so Δ[gas]/Δt = (ΔP/Δt)/(RT) = 0.0246 / (0.08206 × 300) = 0.0246 / 24.62 = 1.00 × 10⁻³ M/s. The flask volume is not needed: molarity already is moles per litre, and P/RT gives it directly.

    # ---- Short answer
    - slug: apchem-u05-w17-q20
      type: short_answer
      topic_code: "5.2"
      source: "general knowledge"
      points: 3
      stimulus: |
        Initial-rate data for the reaction A + 2 B → C at 25 °C:

        | Experiment | [A]₀ (M) | [B]₀ (M) | Initial rate (M/s) |
        |---|---|---|---|
        | 1 | 0.10 | 0.10 | 4.0 × 10⁻⁴ |
        | 2 | 0.20 | 0.10 | 8.0 × 10⁻⁴ |
        | 3 | 0.10 | 0.30 | 4.0 × 10⁻⁴ |
      prompt: |
        (a) Determine the order of the reaction with respect to A and with respect to B, showing the reasoning from the table.
        (b) Write the rate law and calculate the value of k with units.
        (c) A student claims that because the coefficient of B is 2, the reaction must be second order in B. Explain why the claim is incorrect.
      answer: |
        (a) Experiments 1 and 2: [A] doubles with [B] fixed and the rate doubles, so the reaction is first order in A. Experiments 1 and 3: [B] triples with [A] fixed and the rate is unchanged, so it is zero order in B.
        (b) rate = k[A]. From experiment 1, k = 4.0 × 10⁻⁴ M/s ÷ 0.10 M = 4.0 × 10⁻³ s⁻¹.
        (c) Orders are determined experimentally and are not read from the coefficients of the overall balanced equation; the data show that changing [B] has no effect on the rate, so B is zero order even though its coefficient is 2. Coefficients equal orders only for a single elementary step, and this overall reaction need not be one.
      explanation: |
        Three points, one per part.

        (a) 1 pt: first order in A and zero order in B, each justified by comparing the correct pair of experiments (rate doubles with [A]; rate unchanged with [B]).
        (b) 1 pt: rate = k[A] and k = 4.0 × 10⁻³ s⁻¹ with correct units (s⁻¹). Accept 4 × 10⁻³ s⁻¹.
        (c) 1 pt: states that orders come from experiment, not coefficients, and cites the data (no change in rate when [B] changes) or the elementary-step condition.

    - slug: apchem-u05-w17-q21
      type: short_answer
      topic_code: "3.13"
      source: "general knowledge"
      points: 3
      prompt: |
        Crystal violet, a purple dye, reacts with hydroxide ion to form a colourless product. A student plans to measure the rate of this reaction with a visible spectrometer.
        (a) Explain what wavelength the student should select and why.
        (b) Describe how the student converts the absorbance readings into concentrations of crystal violet.
        (c) The student uses a hydroxide concentration 1,000 times larger than the dye concentration. Explain how this choice simplifies finding the order with respect to the dye.
      answer: |
        (a) A wavelength near the dye's absorbance maximum (about 590 nm, in the yellow-orange region that purple absorbs), because absorbance is largest and most sensitive to concentration there, and the colourless product does not absorb.
        (b) Using the Beer–Lambert law A = εbc: measure the absorbance of standard solutions of known concentration to make a calibration line (or determine εb), then concentration = A/(εb) for each reading.
        (c) With OH⁻ in huge excess its concentration barely changes during the reaction, so rate = k[CV]ᵐ[OH⁻]ⁿ reduces to rate = k'[CV]ᵐ with k' = k[OH⁻]ⁿ constant. The order in the dye can then be found by seeing which plot ([CV], ln[CV] or 1/[CV] against time) is linear.
      explanation: |
        Three points, one per part.

        (a) 1 pt: wavelength at or near the dye's maximum absorbance, with the reason (greatest sensitivity, or product does not absorb).
        (b) 1 pt: Beer–Lambert law with a calibration curve or known molar absorptivity and path length; concentration proportional to absorbance.
        (c) 1 pt: pseudo-first-order (or constant [OH⁻]) argument: the excess reactant's concentration is effectively constant, so the rate depends only on the dye and a linear plot reveals its order.

    # ---- Long answer
    - slug: apchem-u05-w17-q22
      type: long_answer
      topic_code: "5.3"
      source: "general knowledge"
      points: 6
      stimulus: |
        A student studies the decomposition of hydrogen peroxide, 2 H₂O₂(aq) → 2 H₂O(l) + O₂(g), catalysed by a trace of iodide ion, and records the concentration of H₂O₂ at 25 °C:

        | Time (min) | 0 | 10.0 | 20.0 | 30.0 | 40.0 |
        |---|---|---|---|---|---|
        | [H₂O₂] (M) | 0.800 | 0.566 | 0.400 | 0.283 | 0.200 |
      prompt: |
        (a) Determine the order of the reaction with respect to H₂O₂. Justify your answer using the data.
        (b) Calculate the rate constant, including units.
        (c) Calculate the concentration of H₂O₂ that would remain at 75.0 min.
        (d) Calculate the initial rate of the reaction, and the rate of formation of O₂ at that instant.
        (e) The student repeats the experiment with twice the initial concentration of H₂O₂. Predict, with justification, how the half-life changes.
        (f) Sketch (describe in words) what a plot of ln[H₂O₂] against time would look like for this data, labelling the slope and intercept.
      answer: |
        (a) First order. The concentration halves every 20.0 min (0.800 → 0.400 → 0.200), a constant half-life, which is the signature of first-order kinetics; equivalently, each 10.0 min interval retains the same fraction (0.566/0.800 = 0.400/0.566 = 0.707).
        (b) t½ = 20.0 min, so k = 0.693/20.0 min = 0.0347 min⁻¹ (= 5.78 × 10⁻⁴ s⁻¹).
        (c) ln[A]ₜ = −kt + ln[A]₀ = −(0.0347)(75.0) + ln 0.800 = −2.60 − 0.223 = −2.83; [H₂O₂] = e⁻²·⁸³ = 0.059 M. (Check: 75 min is 3.75 half-lives; 0.800 × (0.5)³·⁷⁵ = 0.059 M.)
        (d) Initial rate = k[H₂O₂]₀ = 0.0347 min⁻¹ × 0.800 M = 0.0278 M/min (rate of disappearance of H₂O₂). O₂ forms at half that rate because of the 2:1 coefficients: 0.0139 M/min.
        (e) The half-life is unchanged at 20.0 min: for a first-order process t½ = 0.693/k depends only on k, not on concentration.
        (f) A straight line with negative slope: slope = −k = −0.0347 min⁻¹, y-intercept = ln(0.800) = −0.223, passing through (20.0, −0.916) and (40.0, −1.609).
      explanation: |
        Six points.

        (a) 1 pt: first order, justified by a constant half-life (20.0 min) or constant fractional loss per interval.
        (b) 1 pt: k = 0.693/20.0 = 0.0347 min⁻¹ (accept 0.035 min⁻¹ or 5.8 × 10⁻⁴ s⁻¹) with units.
        (c) 1 pt: correct use of the first-order integrated rate law or of 3.75 half-lives to obtain 0.059 M (accept 0.057–0.061 M).
        (d) 1 pt: initial rate = k[A]₀ = 0.0278 M/min, and O₂ formation rate = half of that, 0.0139 M/min (accept consistent values from the student's k).
        (e) 1 pt: half-life unchanged, because t½ = 0.693/k is independent of [A]₀.
        (f) 1 pt: linear plot, negative slope equal to −k, intercept ln[A]₀ = −0.22.
