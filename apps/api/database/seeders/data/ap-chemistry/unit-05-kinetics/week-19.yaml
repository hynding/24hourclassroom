    # ---- Numeric
    - slug: apchem-u05-w19-q18
      type: numeric
      topic_code: "5.6"
      source: "general knowledge"
      points: 1
      prompt: |
        An enzyme lowers the activation energy of a reaction from 80.0 kJ/mol to 65.0 kJ/mol at 298 K without changing the frequency factor. By what factor does the rate constant increase? Use R = 8.314 J/(mol·K) and give your answer to two significant figures (for example 120).
      answer: { value: 430, tolerance: 15 }
      explanation: |
        k₂/k₁ = e^((Ea₁ − Ea₂)/RT) = e^(15,000/(8.314 × 298)) = e^(15,000/2,478) = e^6.05 = 4.3 × 10². A 15 kJ/mol reduction in the barrier makes the reaction about 430 times faster at body-like temperatures.

    - slug: apchem-u05-w19-q19
      type: numeric
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        With a catalyst present, the first-order decomposition of a compound has a rate constant of 0.0231 min⁻¹. Calculate the half-life of the catalysed reaction. Give your answer in minutes to one decimal place.
      answer: { value: 30.0, tolerance: 0.2 }
      explanation: |
        For a first-order reaction t½ = 0.693/k = 0.693/0.0231 min⁻¹ = 30.0 min. The catalyst raises k and therefore shortens the half-life, but the first-order relationship between them is unchanged.

    # ---- Short answer
    - slug: apchem-u05-w19-q20
      type: short_answer
      topic_code: "5.8"
      source: "general knowledge"
      points: 3
      prompt: |
        The reaction 2 NO(g) + O₂(g) → 2 NO₂(g) has the experimental rate law rate = k[NO]²[O₂]. A proposed mechanism is:

        Step 1 (fast, reversible): NO + NO ⇌ N₂O₂
        Step 2 (slow): N₂O₂ + O₂ → 2 NO₂

        (a) Write the rate law for the slow step as written, and explain why it cannot be compared directly with the experimental rate law.
        (b) Use the fast equilibrium of step 1 to express [N₂O₂] in terms of [NO], and derive the rate law predicted by the mechanism.
        (c) Explain how this mechanism accounts for a third-order rate law without requiring a termolecular collision.
      answer: |
        (a) rate = k₂[N₂O₂][O₂]. N₂O₂ is an intermediate whose concentration cannot be set or measured directly, so a rate law containing it cannot be tested against initial-rate data.
        (b) At the fast equilibrium, forward rate = reverse rate: k₁[NO]² = k₋₁[N₂O₂], so [N₂O₂] = (k₁/k₋₁)[NO]² = K₁[NO]². Substituting: rate = k₂K₁[NO]²[O₂] = k[NO]²[O₂], with k = k₂k₁/k₋₁. This matches the experimental rate law.
        (c) Two NO molecules collide to form N₂O₂ (bimolecular), and N₂O₂ then collides with O₂ (bimolecular). The [NO]² factor comes from the equilibrium concentration of the dimer, not from three molecules meeting at once, so the overall third order arises from two ordinary two-body collisions.
      explanation: |
        Three points, one per part.

        (a) 1 pt: rate = k₂[N₂O₂][O₂] and the statement that N₂O₂ is an intermediate (not measurable or controllable), so the expression must be rewritten.
        (b) 1 pt: equates forward and reverse rates of step 1 (or uses K₁) to get [N₂O₂] proportional to [NO]², and obtains rate = k[NO]²[O₂].
        (c) 1 pt: explains that each step is bimolecular and the square arises from the pre-equilibrium, so no three-body collision is needed.

    - slug: apchem-u05-w19-q21
      type: short_answer
      topic_code: "5.11"
      source: "general knowledge"
      points: 3
      prompt: |
        Chlorine atoms released from chlorofluorocarbons destroy stratospheric ozone by the mechanism:

        Step 1: Cl + O₃ → ClO + O₂
        Step 2: ClO + O → Cl + O₂

        (a) Write the overall equation and identify the catalyst and the intermediate, explaining how you decided.
        (b) Explain in terms of activation energy why the presence of Cl atoms greatly increases the rate at which ozone is destroyed.
        (c) Explain why a single chlorine atom can destroy a very large number of ozone molecules.
      answer: |
        (a) Adding the steps and cancelling ClO and Cl: O₃ + O → 2 O₂. Cl is the catalyst because it is consumed in step 1 and regenerated in step 2 (it enters first and comes out later). ClO is the intermediate because it is produced in step 1 and consumed in step 2.
        (b) The chlorine pathway has a lower activation energy than the direct reaction O₃ + O → 2 O₂. At stratospheric temperatures the fraction of collisions with enough energy, e^(−Ea/RT), is much larger for the lower barrier, so the rate constant is much larger.
        (c) Because Cl is regenerated at the end of each cycle, it is not used up; it goes round the two-step cycle again and again, destroying one O₃ per cycle, until something else (such as reaction with methane to form HCl) removes it.
      explanation: |
        Three points, one per part.

        (a) 1 pt: overall equation O₃ + O → 2 O₂; Cl identified as catalyst (consumed then regenerated) and ClO as intermediate (formed then consumed), with the reasoning.
        (b) 1 pt: the catalysed pathway has a lower Ea, so a larger fraction of collisions succeeds (or k is larger by the Arrhenius equation).
        (c) 1 pt: the catalyst is regenerated and so repeats the cycle many times.

    # ---- Long answer
    - slug: apchem-u05-w19-q22
      type: long_answer
      topic_code: "5.10"
      source: "general knowledge"
      points: 6
      prompt: |
        The gas-phase reaction NO₂(g) + CO(g) → NO(g) + CO₂(g) has the experimental rate law rate = k[NO₂]² at temperatures below about 500 K. The proposed mechanism is:

        Step 1 (slow): NO₂ + NO₂ → NO₃ + NO
        Step 2 (fast): NO₃ + CO → NO₂ + CO₂

        (a) Show that the mechanism gives the overall equation and identify the intermediate.
        (b) Derive the rate law predicted by the mechanism and state whether it is consistent with experiment.
        (c) A student argues that because CO does not appear in the rate law, CO must not take part in the reaction. Evaluate this argument.
        (d) Draw (describe in words) the energy profile for the mechanism, given that the overall reaction is exothermic. Indicate the relative heights of the two barriers and the position of the intermediate.
        (e) Explain why the rate law is consistent with a bimolecular rate-determining step rather than with the overall equation's one-to-one stoichiometry.
        (f) Above about 500 K the rate law changes to rate = k[NO₂][CO]. Propose how the mechanism changes at high temperature and explain what that implies about the activation energies of the competing pathways.
      answer: |
        (a) Sum: 2 NO₂ + NO₃ + CO → NO₃ + NO + NO₂ + CO₂. Cancelling NO₃ (both sides) and one NO₂ gives NO₂ + CO → NO + CO₂. NO₃ is the intermediate (formed in step 1, consumed in step 2).
        (b) The slow step is first and bimolecular in NO₂: rate = k₁[NO₂]². No intermediate appears, so this is the prediction; it matches rate = k[NO₂]², so the mechanism is consistent with the data.
        (c) The argument is wrong. CO is consumed and CO₂ is formed, so CO clearly reacts; it simply reacts in the fast second step, after the rate-determining step, so its concentration cannot influence how fast the slow step produces NO₃.
        (d) Two hills. The first, from the reactants to the transition state of step 1, is tall (the slow step). A valley for NO₃ + NO + CO (the intermediate) follows, then a much lower second hill for step 2, and the products lie below the reactants (exothermic). The first barrier is the larger one measured from its starting valley.
        (e) The rate law's second order in NO₂ shows that two NO₂ molecules collide in the slow event; the overall 1:1 stoichiometry describes the net change, not the collision. Rate laws reflect the rate-determining collision, not the balanced equation.
        (f) At higher temperature the direct bimolecular step NO₂ + CO → NO + CO₂ (a single elementary step with rate = k[NO₂][CO]) becomes faster than the two-step route. That direct step must have a larger activation energy than the NO₂ + NO₂ step, since raising the temperature favours the pathway with the higher Ea (its rate constant grows faster with T by the Arrhenius equation).
      explanation: |
        Six points.

        (a) 1 pt: steps summed with NO₃ cancelled, overall equation obtained, NO₃ named as intermediate.
        (b) 1 pt: rate = k[NO₂]² from the slow first step and the statement that this matches experiment.
        (c) 1 pt: rejects the claim; CO reacts in the fast step after the rate-determining step so it does not affect the rate.
        (d) 1 pt: two-peak profile with the first peak taller (slow step), an intermediate valley between, products below reactants.
        (e) 1 pt: order in NO₂ reflects two NO₂ molecules in the rate-determining collision; stoichiometry of the overall equation is irrelevant to orders.
        (f) 1 pt: a direct one-step pathway NO₂ + CO becomes dominant; it has the higher Ea, and higher-Ea pathways gain more from a temperature rise.
