week: 19
unit: 5
title: "Mechanisms, Rate-Determining Steps and Catalysis"
topics: ["5.8", "5.9", "5.10", "5.11"]
guide: guides/week-19.md
guide_description: |
  How to predict the rate law from a mechanism when the slow step comes first and when a fast equilibrium
  precedes it, what the steady-state approximation assumes and when it reduces to the pre-equilibrium answer,
  how to read a multistep energy profile (one hill per step, intermediates in the valleys, the rate-determining
  step as the largest climb), and how acid–base, surface and enzyme catalysts lower the activation energy
  without changing ΔH. Worked examples: NO₂ + CO, 2 NO + O₂, chlorine-catalysed ozone loss, iodide-catalysed
  peroxide decomposition.
flashcards_description: |
  30 cards on rate-determining steps, deriving rate laws from mechanisms, steady state, multistep profiles and
  the three kinds of catalysis.

flashcards:
  - front: Rate-determining step → what it is and what it decides
    back: |
      The slowest elementary step of a mechanism. The overall reaction can go no faster than it, so the rate law of the overall reaction is set by the rate-determining step (after any intermediates are replaced).
    topic_code: "5.8"
  - front: Predicting the rate law when the slow step is first
    back: |
      Write the rate law of the slow step from its coefficients. Its reactants are all original reactants, so no intermediate appears. NO₂ + NO₂ → NO₃ + NO (slow) gives rate = k[NO₂]².
    topic_code: "5.8"
  - front: Why CO does not appear in the rate law of NO₂ + CO → NO + CO₂
    back: |
      The slow step is NO₂ + NO₂ → NO₃ + NO; CO reacts with NO₃ only in a later fast step. Adding CO cannot speed up a step it is not part of, so the rate is k[NO₂]², zero order in CO.
    topic_code: "5.8"
  - front: Predicting the rate law when a fast equilibrium precedes the slow step
    back: |
      Write the slow step's rate law, then replace the intermediate using the fast step's equilibrium: forward rate = reverse rate, or K₁ = [intermediate]/[reactants]. Example: 2 NO ⇌ N₂O₂ (fast), N₂O₂ + O₂ → 2 NO₂ (slow) gives rate = k[NO]²[O₂].
    topic_code: "5.8"
  - front: Species allowed in a predicted rate law
    back: |
      Only reactants (and sometimes products or a catalyst) whose concentrations can be set and measured. An intermediate must be eliminated by the pre-equilibrium or steady-state treatment before the rate law is compared with experiment.
    topic_code: "5.8"
  - front: Mechanism consistent with rate = k[NO]²[O₂] without a termolecular step
    back: |
      Step 1 (fast equilibrium): 2 NO ⇌ N₂O₂. Step 2 (slow): N₂O₂ + O₂ → 2 NO₂. [N₂O₂] = K₁[NO]², so rate = k₂K₁[NO]²[O₂]. Third order overall from two bimolecular steps.
    topic_code: "5.8"
  - front: Steady-state approximation → the assumption in one sentence
    back: |
      A reactive intermediate that is formed slowly and consumed quickly never accumulates, so its concentration is small and nearly constant: rate of formation = rate of consumption. Solve that equation for [intermediate].
    topic_code: "5.9"
  - front: Steady state versus pre-equilibrium → when each applies
    back: |
      Pre-equilibrium assumes the intermediate's reverse reaction is much faster than its onward step, so it reaches its equilibrium amount. Steady state makes no such assumption and contains the pre-equilibrium result as the limit where the reverse step dominates.
    topic_code: "5.9"
  - front: Steady-state rate law for 2 NO + O₂ via N₂O₂ → the two limits
    back: |
      rate = k₁k₂[NO]²[O₂]/(k₋₁ + k₂[O₂]). If k₋₁ ≫ k₂[O₂]: rate = (k₁k₂/k₋₁)[NO]²[O₂], the pre-equilibrium answer. If k₂[O₂] ≫ k₋₁: rate = k₁[NO]², second order and independent of O₂.
    topic_code: "5.9"
  - front: Number of peaks on a multistep energy profile → what it tells you
    back: |
      One maximum (transition state) per elementary step. Two hills mean a two-step mechanism; the valley between them is the intermediate.
    topic_code: "5.10"
  - front: Activation energy of each step on a multistep profile → where to measure from
    back: |
      From the valley where that step starts to its own peak, not from the overall reactants. Step 2's Ea is the climb from the intermediate valley to the second peak.
    topic_code: "5.10"
  - front: Identifying the rate-determining step on a multistep profile
    back: |
      The step with the largest activation energy measured from its own starting valley. Usually the tallest climb; check each step rather than assuming the highest peak.
    topic_code: "5.10"
  - front: ΔH on a multistep energy profile
    back: |
      Energy of the final products minus energy of the initial reactants: last valley minus first valley. The intermediates' energies and the peaks do not affect it.
    topic_code: "5.10"
  - front: Catalysed versus uncatalysed energy profile → what changes and what does not
    back: |
      The catalysed curve has more hills (extra steps) but a lower highest barrier. Start and end energies are identical, so ΔH and the equilibrium constant are unchanged; only the rate changes.
    topic_code: "5.10"
  - front: Catalyst → definition in terms of a mechanism
    back: |
      A species that is consumed in an early step and regenerated in a later step, so it does not appear in the overall equation and is not used up. It provides a pathway with a lower activation energy.
    topic_code: "5.11"
  - front: Catalyst versus intermediate → how to tell them apart in a mechanism
    back: |
      Catalyst: reactant first, product later (goes in, comes out). Intermediate: product first, reactant later (comes out, goes in). Both cancel from the overall equation.
    topic_code: "5.11"
  - front: Why a catalyst increases the rate → Arrhenius and Maxwell–Boltzmann
    back: |
      Lower Ea makes e^(−Ea/RT) larger, so k is larger at the same temperature. On the Maxwell–Boltzmann curve the Ea line moves left and a far larger fraction of collisions lies beyond it.
    topic_code: "5.11"
  - front: Three things a catalyst does not change
    back: |
      ΔH of the reaction, the equilibrium constant, and the equilibrium position. It speeds the forward and reverse reactions equally, so equilibrium is reached sooner but is the same equilibrium.
    topic_code: "5.11"
  - front: Homogeneous catalysis → definition and example
    back: |
      Catalyst in the same phase as the reactants. Acid catalysis of ester hydrolysis in solution; Cl atoms destroying ozone in the gas phase; I⁻ catalysing H₂O₂ decomposition in water.
    topic_code: "5.11"
  - front: Heterogeneous (surface) catalysis → the three stages
    back: |
      Reactants adsorb onto the solid surface (bonds weaken), they react on the surface, products desorb. Examples: catalytic converters (Pt, Pd, Rh), the Haber process on iron, hydrogenation of alkenes on nickel.
    topic_code: "5.11"
  - front: Acid–base catalysis → how a proton speeds a reaction
    back: |
      H⁺ (or OH⁻) is transferred to a reactant to make a more reactive intermediate, for example protonating a carbonyl so that water attacks it faster; the proton is released again at the end.
    topic_code: "5.11"
  - front: Enzyme catalysis → active site and saturation kinetics
    back: |
      An enzyme binds its substrate at an active site that holds it in the reactive geometry and stabilises the transition state. At high substrate concentration every active site is occupied and the rate becomes zero order in substrate.
    topic_code: "5.11"
  - front: Chlorine-catalysed ozone destruction → steps, catalyst, intermediate
    back: |
      Cl + O₃ → ClO + O₂; ClO + O → Cl + O₂. Overall O₃ + O → 2 O₂. Cl is the catalyst (regenerated), ClO the intermediate. One Cl atom can destroy thousands of ozone molecules.
    topic_code: "5.11"
  - front: Iodide-catalysed decomposition of H₂O₂ → mechanism and rate law
    back: |
      Step 1 (slow): H₂O₂ + I⁻ → H₂O + IO⁻. Step 2 (fast): H₂O₂ + IO⁻ → H₂O + O₂ + I⁻. Rate = k[H₂O₂][I⁻]. The catalyst appears in the rate law because it takes part in the slow step.
    topic_code: "5.11"
  - front: Can a catalyst appear in a rate law?
    back: |
      Yes, when it participates in the rate-determining step. The rate of H₂O₂ decomposition is proportional to [I⁻] even though I⁻ is absent from the overall equation 2 H₂O₂ → 2 H₂O + O₂.
    topic_code: "5.11"
  - front: Inhibitor → what it does
    back: |
      Slows a reaction, usually by binding to a catalyst or an enzyme's active site so the catalysed pathway is blocked. Lead poisons the platinum in a catalytic converter the same way.
    topic_code: "5.11"
  - front: Reading 'reactant absent from the rate law' correctly
    back: |
      The reactant still reacts; it enters only after the rate-determining step, so changing its concentration cannot change the overall rate. Never conclude it is not involved in the reaction.
    topic_code: "5.8"
  - front: Two-step mechanism check → the rate law of A + 2 B → D via a slow first step A + B → C
    back: |
      Slow step first: rate = k[A][B]. The second B enters in the fast step C + B → D and does not affect the rate; the overall reaction is first order in B although its coefficient is 2.
    topic_code: "5.8"
  - front: Catalytic converter chemistry → redox on a surface (spiral 4.9)
    back: |
      On Pt/Pd/Rh surfaces, CO is oxidised to CO₂ (C goes from +2 to +4), unburned hydrocarbons are oxidised to CO₂ and H₂O, and NO is reduced to N₂ (N goes from +2 to 0). A heterogeneous catalyst handling both oxidation and reduction.
    topic_code: "4.9"
  - front: Reverse activation energy of a step on a multistep profile
    back: |
      From the valley after the step up to the same peak. For a step from an intermediate at +20 kJ/mol over a peak at +90 to products at −40, the forward Ea is 70 kJ/mol and the reverse Ea is 130 kJ/mol.
    topic_code: "5.10"

quiz:
  description: |
    22 questions · about 40 minutes · topics 5.8–5.11 (rate laws from mechanisms with slow and fast first steps,
    the steady-state approximation, multistep energy profiles and catalysis), with review of elementary steps,
    intermediates, the Arrhenius equation, half-lives and redox from earlier weeks. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: a two-step energy profile (5.10)
    - slug: apchem-u05-w19-q01
      type: multiple_choice
      topic_code: "5.10"
      source: "general knowledge"
      points: 1
      stimulus: |
        Graph description: an energy profile for a two-step reaction, potential energy (kJ/mol) against reaction progress. The reactants start at 0 kJ/mol. The curve rises to a first maximum at +55 kJ/mol, falls to a valley at +25 kJ/mol, rises to a second maximum at +95 kJ/mol, and finally falls to the products at −30 kJ/mol.
      prompt: |
        Which step is rate-determining, and why?
      options:
        - "Step 1, because its transition state is reached first"
        - "Step 1, because its activation energy of 55 kJ/mol is measured from the reactants"
        - "Step 2, because its activation energy, 95 − 25 = 70 kJ/mol, is larger than that of step 1"
        - "Step 2, because the products are lower in energy than the intermediate"
      option_explanations:
        - |
          The order in which steps occur has nothing to do with which is slowest; speed depends on the size of each step's barrier.
        - |
          Step 1's barrier is indeed 55 kJ/mol, but the comparison must be with step 2's barrier measured from the intermediate, which is larger.
        - |
          Correct. Each step's Ea is measured from its own starting valley: step 1 climbs 55 kJ/mol, step 2 climbs from +25 to +95, that is 70 kJ/mol. The larger barrier is the slower step.
        - |
          The energy of the products relative to the intermediate is the ΔH of step 2, not its barrier; exothermicity does not make a step slow or fast.
      answer: 2
      explanation: |
        Practice 4. Measure each activation energy from the valley the step starts in.

    - slug: apchem-u05-w19-q02
      type: multiple_choice
      topic_code: "5.10"
      source: "general knowledge"
      points: 1
      stimulus: |
        Graph description: an energy profile for a two-step reaction, potential energy (kJ/mol) against reaction progress. The reactants start at 0 kJ/mol. The curve rises to a first maximum at +55 kJ/mol, falls to a valley at +25 kJ/mol, rises to a second maximum at +95 kJ/mol, and finally falls to the products at −30 kJ/mol.
      prompt: |
        What does the valley at +25 kJ/mol represent?
      options:
        - "An intermediate: a real species formed in step 1 and consumed in step 2"
        - "The transition state of step 1"
        - "The catalyst, which is regenerated at the end of the reaction"
        - "The products of the overall reaction"
      option_explanations:
        - |
          Correct. A valley between two peaks is an energy minimum, a species that exists for a time: the intermediate produced by the first step and used up by the second.
        - |
          Transition states are the maxima on the curve, not the minima; step 1's transition state is the peak at +55 kJ/mol.
        - |
          Nothing in the profile indicates a catalyst, and a catalyst is not represented by a single point on the curve in any case.
        - |
          The products are the final level at −30 kJ/mol on the right of the profile.
      answer: 0
      explanation: |
        Practice 1. Peaks are transition states; valleys between peaks are intermediates.

    - slug: apchem-u05-w19-q03
      type: numeric
      topic_code: "5.10"
      source: "general knowledge"
      points: 1
      stimulus: |
        Graph description: an energy profile for a two-step reaction, potential energy (kJ/mol) against reaction progress. The reactants start at 0 kJ/mol. The curve rises to a first maximum at +55 kJ/mol, falls to a valley at +25 kJ/mol, rises to a second maximum at +95 kJ/mol, and finally falls to the products at −30 kJ/mol.
      prompt: |
        Calculate the activation energy of the reverse of step 2 (products going back to the intermediate). Give your answer in kJ/mol as a whole number.
      answer: { value: 125, tolerance: 0 }
      explanation: |
        The reverse of step 2 climbs from the products at −30 kJ/mol to the second peak at +95 kJ/mol: 95 − (−30) = 125 kJ/mol. The overall ΔH is −30 kJ/mol (products minus reactants), and the large reverse barrier is why the products, once formed, are slow to revert.

    # ---- Stand-alone multiple choice
    - slug: apchem-u05-w19-q04
      type: multiple_choice
      topic_code: "5.8"
      source: "general knowledge"
      points: 1
      prompt: |
        A proposed mechanism for the reaction 2 NO₂Cl(g) → 2 NO₂(g) + Cl₂(g) is:

        Step 1 (slow): NO₂Cl → NO₂ + Cl
        Step 2 (fast): NO₂Cl + Cl → NO₂ + Cl₂

        Which rate law does this mechanism predict?
      options:
        - "rate = k[NO₂Cl]²"
        - "rate = k[NO₂Cl]"
        - "rate = k[NO₂Cl][Cl]"
        - "rate = k[NO₂][Cl₂]"
      option_explanations:
        - |
          A square would follow from the overall equation's coefficient of 2, but the rate is set by the slow step, in which a single NO₂Cl falls apart.
        - |
          Correct. The slow, rate-determining step is unimolecular in NO₂Cl, so the predicted rate law is rate = k₁[NO₂Cl], first order.
        - |
          This is the rate law of the fast second step; it contains the intermediate Cl and does not control the overall rate.
        - |
          Products do not appear in the forward rate law; the rate depends on the reactant in the slow step.
      answer: 1
      explanation: |
        Practice 5. Slow step first: its rate law is the prediction, with no intermediate to remove.

    - slug: apchem-u05-w19-q05
      type: multiple_choice
      topic_code: "5.8"
      source: "general knowledge"
      points: 1
      prompt: |
        A mechanism for the reaction 2 NO(g) + Cl₂(g) → 2 NOCl(g) is proposed:

        Step 1 (fast, reversible): NO + Cl₂ ⇌ NOCl₂
        Step 2 (slow): NOCl₂ + NO → 2 NOCl

        Which rate law does the mechanism predict?
      options:
        - "rate = k[NOCl₂][NO]"
        - "rate = k[NO][Cl₂]"
        - "rate = k[NO]²"
        - "rate = k[NO]²[Cl₂]"
      option_explanations:
        - |
          This is the slow step's rate law as written, but NOCl₂ is an intermediate and must be replaced before the rate law can be compared with experiment.
        - |
          Rate = k[NO][Cl₂] would be the prediction if step 1 were slow; here step 1 is a fast equilibrium and step 2 is rate-determining.
        - |
          Second order in NO alone omits the Cl₂ that enters through the equilibrium concentration of NOCl₂.
        - |
          Correct. Slow step: rate = k₂[NOCl₂][NO]. Fast equilibrium: [NOCl₂] = K₁[NO][Cl₂]. Substituting, rate = k₂K₁[NO]²[Cl₂] = k[NO]²[Cl₂].
      answer: 3
      explanation: |
        Practice 5. Replace the intermediate using the equilibrium of the fast first step.

    - slug: apchem-u05-w19-q06
      type: multiple_choice
      topic_code: "5.11"
      source: "general knowledge"
      points: 1
      prompt: |
        Consider the mechanism:

        Step 1: H₂O₂ + I⁻ → H₂O + IO⁻
        Step 2: H₂O₂ + IO⁻ → H₂O + O₂ + I⁻

        Which statement correctly identifies the roles of I⁻ and IO⁻?
      options:
        - "I⁻ is a catalyst and IO⁻ is an intermediate."
        - "I⁻ is an intermediate and IO⁻ is a catalyst."
        - "Both I⁻ and IO⁻ are intermediates."
        - "Both I⁻ and IO⁻ are catalysts."
      option_explanations:
        - |
          Correct. I⁻ is consumed in step 1 and regenerated in step 2 (in first, out later), the signature of a catalyst; IO⁻ is produced in step 1 and consumed in step 2 (out first, in later), the signature of an intermediate.
        - |
          The roles are reversed: I⁻ enters as a reactant before it is reformed, which is how a catalyst behaves, not an intermediate.
        - |
          An intermediate is formed before it is consumed; I⁻ is consumed before it is reformed, so it is not an intermediate.
        - |
          IO⁻ does not exist before the reaction and is not regenerated at the end; it is made and then destroyed, so it is an intermediate.
      answer: 0
      explanation: |
        Practice 1. Catalyst: reactant in an early step, product in a later one. Intermediate: the reverse.

    - slug: apchem-u05-w19-q07
      type: multiple_choice
      topic_code: "5.11"
      source: "general knowledge"
      points: 1
      prompt: |
        A catalyst is added to a reaction mixture at constant temperature. Which quantity is unchanged?
      options:
        - "The activation energy of the pathway followed"
        - "The rate constant of the forward reaction"
        - "The enthalpy change ΔH of the reaction"
        - "The fraction of collisions that lead to reaction"
      option_explanations:
        - |
          The catalyst provides a new pathway whose highest barrier is lower; that is exactly how it works.
        - |
          A lower Ea makes e^(−Ea/RT) larger, so k increases (for both the forward and the reverse reaction).
        - |
          Correct. ΔH is the energy difference between products and reactants, and the catalyst changes neither; the catalysed and uncatalysed profiles begin and end at the same levels.
        - |
          With a lower barrier a larger fraction of collisions carries enough energy to react.
      answer: 2
      explanation: |
        Practice 6. A catalyst changes the path, not the endpoints; ΔH and K are untouched.

    - slug: apchem-u05-w19-q08
      type: multiple_choice
      topic_code: "5.9"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement best describes the steady-state approximation for a reactive intermediate X in a mechanism?
      options:
        - "[X] is assumed to be equal to the concentration of the reactant that forms it."
        - "The rate of formation of X is set equal to its rate of consumption, so [X] stays small and nearly constant."
        - "[X] is assumed to rise steadily throughout the reaction."
        - "X is assumed to be at equilibrium with the products of the reaction."
      option_explanations:
        - |
          A reactive intermediate is present at far lower concentration than the reactants; it is never assumed equal to them.
        - |
          Correct. Because X is consumed about as fast as it is made, its concentration quickly reaches a small, roughly constant value; setting formation equal to consumption lets you solve for [X] and remove it from the rate law.
        - |
          A steadily rising concentration is the opposite of a steady state; that describes a product, not a reactive intermediate.
        - |
          Equilibrium with the products is not part of the approximation; the fast pre-equilibrium idea concerns the step that forms X from reactants, and the steady state is more general than that.
      answer: 1
      explanation: |
        Practice 4. d[X]/dt ≈ 0 is the steady-state condition.

    - slug: apchem-u05-w19-q09
      type: multiple_choice
      topic_code: "5.6"
      source: "general knowledge"
      points: 1
      prompt: |
        A catalyst lowers the activation energy of a reaction from 100 kJ/mol to 80 kJ/mol at 300 K, leaving the frequency factor A unchanged. Which expression gives the factor by which the rate constant increases?
      options:
        - "100/80 = 1.25"
        - "e^(80,000/(8.314 × 300))"
        - "e^(−20,000/(8.314 × 300))"
        - "e^(20,000/(8.314 × 300))"
      option_explanations:
        - |
          The dependence of k on Ea is exponential, not a simple ratio; a 20 kJ/mol drop changes k by thousands of times, not by 25%.
        - |
          This is e^(+Ea/RT) for the catalysed barrier alone, not the ratio of the two rate constants.
        - |
          A negative exponent gives a factor smaller than 1, which would mean the catalyst slowed the reaction.
        - |
          Correct. k₂/k₁ = e^(−Ea₂/RT)/e^(−Ea₁/RT) = e^((Ea₁ − Ea₂)/RT) = e^(20,000/(8.314 × 300)) ≈ e^8.0 ≈ 3,000.
      answer: 3
      explanation: |
        Practice 5 (spiral from 5.6). The ratio of two Arrhenius expressions with the same A depends only on the difference in Ea.

    - slug: apchem-u05-w19-q10
      type: multiple_choice
      topic_code: "5.4"
      source: "general knowledge"
      points: 1
      prompt: |
        In the mechanism for ozone destruction, Step 1: Cl + O₃ → ClO + O₂ and Step 2: ClO + O → Cl + O₂, what is the molecularity of each step?
      options:
        - "Step 1 unimolecular; step 2 bimolecular"
        - "Both steps are bimolecular"
        - "Step 1 bimolecular; step 2 termolecular"
        - "Both steps are unimolecular"
      option_explanations:
        - |
          Step 1 involves a collision between a Cl atom and an O₃ molecule, two particles, so it is bimolecular, not unimolecular.
        - |
          Correct. Each step is a collision between exactly two particles: Cl with O₃, then ClO with O.
        - |
          Step 2 has two reactant particles, ClO and O; nothing in it involves three.
        - |
          A unimolecular step has a single reactant particle; both steps here have two.
      answer: 1
      explanation: |
        Practice 1 (spiral from 5.4). Count the reactant particles in each elementary step.

    - slug: apchem-u05-w19-q11
      type: multiple_choice
      topic_code: "4.9"
      source: "general knowledge"
      points: 1
      prompt: |
        In an automobile catalytic converter, carbon monoxide is converted to carbon dioxide and nitrogen monoxide is converted to nitrogen gas on a platinum–rhodium surface. Which statement about oxidation states is correct?
      options:
        - "Carbon is oxidised from +2 to +4 and nitrogen is reduced from +2 to 0."
        - "Carbon is reduced from +4 to +2 and nitrogen is oxidised from 0 to +2."
        - "Both carbon and nitrogen are oxidised."
        - "Neither carbon nor nitrogen changes oxidation state; the catalyst is the only species that reacts."
      option_explanations:
        - |
          Correct. In CO carbon is +2 and in CO₂ it is +4, an oxidation; in NO nitrogen is +2 and in N₂ it is 0, a reduction. The surface catalyses both half-processes.
        - |
          The directions are reversed: CO gains oxygen and carbon's oxidation number rises; NO loses oxygen and nitrogen's falls.
        - |
          Nitrogen's oxidation number falls from +2 to 0, which is a reduction, not an oxidation.
        - |
          A catalyst is not consumed, but the reactants certainly change: CO and NO are converted to CO₂ and N₂, with changes in oxidation state.
      answer: 0
      explanation: |
        Practice 1 (spiral from 4.9). Assign oxidation numbers (O is −2) to each species before and after.

    # ---- Select all
    - slug: apchem-u05-w19-q12
      type: multi_select
      topic_code: "5.11"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about catalysts are correct? Select all that apply.
      options:
        - "A catalyst lowers the activation energy by providing a different reaction pathway."
        - "A catalyst is consumed in one step of the mechanism and regenerated in a later step."
        - "A catalyst increases the equilibrium constant of the reaction."
        - "A heterogeneous catalyst works by adsorbing reactants onto its surface, where bonds weaken."
        - "An enzyme can show zero-order kinetics in its substrate when all active sites are occupied."
      option_explanations:
        - |
          Correct. The catalysed mechanism has its own steps, and its highest barrier is lower than the uncatalysed Ea.
        - |
          Correct. That is the mechanistic definition of a catalyst and the reason it is not used up overall.
        - |
          A catalyst speeds the forward and reverse reactions equally, so K and the equilibrium position are unchanged.
        - |
          Correct. Adsorption, reaction on the surface and desorption are the three stages of surface catalysis, as in a catalytic converter.
        - |
          Correct. Once every active site is busy, adding more substrate cannot increase the rate, so the rate is independent of substrate concentration.
      answer: [0, 1, 3, 4]
      explanation: |
        Practice 6. Catalysts change the path and the rate, never the thermodynamics.

    - slug: apchem-u05-w19-q13
      type: multi_select
      topic_code: "5.8"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        The reaction A + 2 B → C has the experimental rate law rate = k[A][B]. Which proposed mechanisms are consistent with this rate law? Select all that apply.
      options:
        - "Step 1 (slow): A + B → D; Step 2 (fast): D + B → C"
        - "Step 1 (fast equilibrium): A + B ⇌ D; Step 2 (slow): D + B → C"
        - "Single step: A + 2 B → C"
        - "Step 1 (fast equilibrium): 2 B ⇌ B₂; Step 2 (slow): A + B₂ → C"
        - "Step 1 (slow): A → E; Step 2 (fast): E + 2 B → C"
      option_explanations:
        - |
          Correct. The slow first step is bimolecular in A and B, giving rate = k[A][B], which matches.
        - |
          The slow step gives rate = k₂[D][B] with [D] = K₁[A][B], so the prediction is rate = k[A][B]², second order in B, which does not match.
        - |
          A single termolecular step would give rate = k[A][B]², and is also improbable.
        - |
          The slow step gives rate = k₂[A][B₂] with [B₂] = K₁[B]², so rate = k[A][B]², which does not match.
        - |
          A slow unimolecular first step predicts rate = k[A], zero order in B, which does not match.
      answer: [0]
      explanation: |
        Practice 6. Derive each prediction and compare its orders with the experiment; only one survives.

    # ---- True/false
    - slug: apchem-u05-w19-q14
      type: true_false
      topic_code: "5.10"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: on a multistep energy profile, the overall ΔH of the reaction equals the sum of the activation energies of the individual steps.
      answer: false
      explanation: |
        False. ΔH is the energy of the final products minus that of the initial reactants, the last valley minus the first; it does not depend on how high the peaks are. Activation energies decide the rate, ΔH decides the heat released or absorbed, and the two are independent.

    - slug: apchem-u05-w19-q15
      type: true_false
      topic_code: "5.7"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: an intermediate in a mechanism is the same thing as the transition state of the rate-determining step.
      answer: false
      explanation: |
        False. An intermediate is a real species that sits in a valley between two peaks and can sometimes be detected or trapped. A transition state is the top of a peak, a fleeting arrangement that exists for the duration of one molecular vibration and cannot be isolated.

    # ---- Fill in the blank
    - slug: apchem-u05-w19-q16
      type: fill_blank
      topic_code: "5.8"
      source: "general knowledge"
      points: 1
      prompt: |
        The slowest elementary step in a mechanism, which limits the overall rate and whose rate law (after intermediates are replaced) is the predicted rate law, is called the ____ step.
      answer: ["rate-determining", "rate determining", "rate-limiting", "rate limiting", "slow", "slowest"]
      explanation: |
        The rate-determining (rate-limiting) step is the bottleneck: the overall reaction cannot go faster than its slowest step. Its rate law, with any intermediate replaced through a fast equilibrium or the steady state, is what the mechanism predicts.

