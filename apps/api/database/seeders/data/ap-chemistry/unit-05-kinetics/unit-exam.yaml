  - slug: apchem-u05-exam-q24
    type: multiple_choice
    topic_code: "3.4"
    source: "general knowledge"
    points: 1
    prompt: |
      A gas-phase reaction is followed in a rigid vessel at 400 K. The partial pressure of the reactant falls from 0.820 atm to 0.410 atm. Using R = 0.08206 L·atm/(mol·K), by how much did the reactant's molar concentration fall?
    options:
      - "0.0125 M"
      - "0.0250 M"
      - "0.410 M"
      - "0.0500 M"
    option_explanations:
      - |
        Correct. Δ[gas] = ΔP/(RT) = 0.410 / (0.08206 × 400) = 0.410 / 32.8 = 0.0125 M.
      - |
        0.0250 M would result from using the initial pressure 0.820 atm rather than the change of 0.410 atm.
      - |
        0.410 is the change in pressure in atm, not a concentration; it must be divided by RT.
      - |
        0.0500 M does not follow from the data; check the value of RT (32.8 L·atm/mol at 400 K).
    answer: 0
    explanation: |
      Practice 5 (review of 3.4). [gas] = P/(RT).

  - slug: apchem-u05-exam-q25
    type: multiple_choice
    topic_code: "5.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Two reactions, X and Y, are carried out at the same temperature and concentrations. Reaction X has Ea = 50 kJ/mol and reaction Y has Ea = 100 kJ/mol. If both have the same frequency factor, which statement is correct?
    options:
      - "Reaction Y is faster because more energy is released."
      - "The two reactions have the same rate because the frequency factors are equal."
      - "Reaction X is faster, and raising the temperature by 10 K would increase both rate constants by the same factor."
      - "Reaction X is faster, and raising the temperature by 10 K would increase Y's rate constant by a larger factor than X's."
    option_explanations:
      - |
        Activation energy is a barrier, not energy released; the higher barrier makes Y slower.
      - |
        Equal A with different Ea gives different values of e^(−Ea/RT) and so different rate constants.
      - |
        The factor by which k increases for a given temperature change is e^((Ea/R)(1/T₁ − 1/T₂)), which is larger for the larger Ea.
      - |
        Correct. With equal A, the lower Ea gives X the larger k; and because the exponential factor depends on Ea/RT, the reaction with the larger Ea gains more from a given rise in T.
    answer: 3
    explanation: |
      Practice 4. High-barrier reactions are slower but more temperature-sensitive.

  - slug: apchem-u05-exam-q26
    type: multiple_choice
    topic_code: "5.11"
    source: "general knowledge"
    points: 1
    prompt: |
      The enzyme catalase decomposes hydrogen peroxide. When the H₂O₂ concentration is raised well above the enzyme concentration, the rate stops increasing. Which explanation is best?
    options:
      - "The enzyme is destroyed by the excess peroxide."
      - "Every active site is occupied, so the rate is limited by how fast the enzyme turns over and the reaction becomes zero order in H₂O₂."
      - "The reaction has reached equilibrium."
      - "The activation energy rises as the concentration increases."
    option_explanations:
      - |
        Catalase is not destroyed by its substrate at these concentrations; the rate plateaus, it does not fall to zero.
      - |
        Correct. At saturation the rate equals the number of active sites times the turnover rate, independent of [H₂O₂]; the rate law becomes zero order in substrate.
      - |
        The decomposition of H₂O₂ lies far toward products; the plateau appears at the start of the reaction, long before equilibrium.
      - |
        Activation energy is fixed by the pathway and does not depend on concentration.
    answer: 1
    explanation: |
      Practice 6. Saturation kinetics is the enzyme signature.

  # ---- Select all
  - slug: apchem-u05-exam-q27
    type: multi_select
    topic_code: "5.8"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which statements about reaction mechanisms are correct? Select all that apply.
    options:
      - "The rate law of the overall reaction is determined by the rate-determining step."
      - "An intermediate may appear in the final predicted rate law."
      - "A mechanism whose predicted rate law matches experiment has been proved correct."
      - "When a fast equilibrium precedes the slow step, the intermediate's concentration is replaced using the equilibrium of the fast step."
      - "A reactant that does not appear in the rate law takes part only in steps after the rate-determining step."
    option_explanations:
      - |
        Correct. The slowest step is the bottleneck; its rate law (with intermediates removed) is the prediction.
      - |
        Intermediates cannot be measured or controlled, so they must be eliminated before the rate law is compared with data.
      - |
        A match supports the mechanism but cannot prove it; other mechanisms might predict the same rate law.
      - |
        Correct. Setting the fast step's forward and reverse rates equal (or using K₁) expresses the intermediate in terms of reactants.
      - |
        Correct. Such a reactant is consumed, but in a fast step that cannot influence the overall rate.
    answer: [0, 3, 4]
    explanation: |
      Practice 6. Rate-determining step, intermediate elimination, consistency not proof.

  - slug: apchem-u05-exam-q28
    type: multi_select
    topic_code: "5.11"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which of the following are changed when a catalyst is added to a reaction at constant temperature? Select all that apply.
    options:
      - "The activation energy of the pathway"
      - "The rate of the forward reaction"
      - "The rate of the reverse reaction"
      - "The enthalpy change of the reaction"
      - "The equilibrium constant"
    option_explanations:
      - |
        Correct. The catalysed pathway has a lower highest barrier; that is the mechanism of catalysis.
      - |
        Correct. Lower Ea means a larger forward rate constant and a faster forward reaction.
      - |
        Correct. The reverse reaction crosses the same lowered barrier from the other side, so it speeds up by the same factor.
      - |
        ΔH depends only on the energies of reactants and products, which the catalyst leaves unchanged.
      - |
        K is fixed by ΔG° of the reaction; because forward and reverse rates rise equally, their ratio, and so K, is unchanged.
    answer: [0, 1, 2]
    explanation: |
      Practice 6. Both rates up, equilibrium unchanged.

  - slug: apchem-u05-exam-q29
    type: multi_select
    topic_code: "5.3"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      A reaction is zero order in its single reactant A. Which statements are correct? Select all that apply.
    options:
