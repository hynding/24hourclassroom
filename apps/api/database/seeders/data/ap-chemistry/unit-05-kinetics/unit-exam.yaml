      - "The rate is independent of [A] until A runs out."
      - "The half-life decreases as the reaction proceeds."
      - "The units of k are s⁻¹."
      - "This behaviour can arise when a catalyst surface or enzyme is saturated with A."
    option_explanations:
      - |
        Correct. [A]ₜ = −kt + [A]₀ is a straight line in [A] with slope −k.
      - |
        Correct. rate = k[A]⁰ = k, a constant, until the reactant is exhausted.
      - |
        Correct. t½ = [A]₀/(2k), so as [A] falls each successive half-life is shorter.
      - |
        For zero order k has the units of a rate, M/s; s⁻¹ is the first-order unit.
      - |
        Correct. When every active site is occupied, adding more A cannot speed the reaction, so the rate is independent of [A].
    answer: [0, 1, 2, 4]
