  # ---- True/false
  - slug: apchem-u05-exam-q30
    type: true_false
    topic_code: "5.4"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: termolecular elementary steps are rare because a simultaneous collision of three particles with the required energy and orientation is highly improbable.
    answer: true
    explanation: |
      True. Bimolecular collisions are common, but the chance that a third particle arrives at the same instant with the right geometry is tiny, so mechanisms are built from unimolecular and bimolecular steps wherever possible. A third-order rate law usually reflects a pre-equilibrium, not a three-body collision.

  - slug: apchem-u05-exam-q31
    type: true_false
    topic_code: "5.6"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: an endothermic reaction always has a larger activation energy than an exothermic reaction.
    answer: false
    explanation: |
      False. Ea and ΔH are independent: an endothermic reaction's forward Ea must be at least as large as ΔH (the products lie above the reactants), but an exothermic reaction can have an enormous barrier (paper in air) while an endothermic one can have a small one. What is always true is that for an endothermic reaction Ea(forward) > Ea(reverse).

  - slug: apchem-u05-exam-q32
    type: true_false
    topic_code: "5.11"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: in the mechanism Step 1: H⁺ + X → HX⁺, Step 2: HX⁺ + Y → Z + H⁺, the species H⁺ is an intermediate.
    answer: false
    explanation: |
      False. H⁺ is consumed in step 1 and regenerated in step 2: it goes in first and comes out later, which is the pattern of a catalyst (here an acid catalyst). HX⁺, produced in step 1 and consumed in step 2, is the intermediate.

  # ---- Fill in the blank
  - slug: apchem-u05-exam-q33
    type: fill_blank
    topic_code: "5.3"
    source: "general knowledge"
    points: 1
    prompt: |
      For a first-order reaction with rate constant k, the half-life is given by t½ = ____ / k.
    answer: ["0.693", "ln 2", "ln2", "ln(2)", "0.693 (ln 2)"]
    explanation: |
      Setting [A]ₜ = [A]₀/2 in ln[A]ₜ = −kt + ln[A]₀ gives ln(1/2) = −kt½, so t½ = ln 2/k = 0.693/k. The half-life contains no concentration, which is why it is constant throughout a first-order reaction.

  - slug: apchem-u05-exam-q34
    type: fill_blank
    topic_code: "5.7"
    source: "general knowledge"
    points: 1
    prompt: |
      A species that is produced in one elementary step of a mechanism and consumed in a later step, and so does not appear in the overall balanced equation, is called an ____.
    answer: ["intermediate", "reaction intermediate", "reactive intermediate"]
    explanation: |
      Intermediates cancel when the steps are added. They are real species (atoms, radicals, ions or molecules) that occupy the valleys between peaks on a multistep energy profile, unlike transition states, which are the peaks.

  - slug: apchem-u05-exam-q35
    type: fill_blank
    topic_code: "5.5"
    source: "general knowledge"
    points: 1
    prompt: |
      In the Arrhenius equation k = A e^(−Ea/RT), the factor e^(−Ea/RT) represents the fraction of collisions with energy at least Ea, while A, the ____ factor, accounts for the collision frequency and the fraction of collisions with a suitable orientation.
    answer: ["frequency", "pre-exponential", "pre-exponential (frequency)", "Arrhenius", "frequency (pre-exponential)"]
    explanation: |
      A is the frequency (pre-exponential) factor. It is large for small, simple molecules that react from many angles and small for large molecules that must meet at one precise site; it is nearly independent of temperature compared with the exponential term.

  # ---- Numeric
  - slug: apchem-u05-exam-q36
    type: numeric
    topic_code: "5.3"
    source: "general knowledge"
    points: 1
    prompt: |
      A first-order reaction has k = 1.5 × 10⁻³ s⁻¹. If the initial concentration of the reactant is 0.250 M, what is its concentration after 600 s? Give your answer in M to three decimal places.
    answer: { value: 0.102, tolerance: 0.002 }
    explanation: |
      ln[A]ₜ = −kt + ln[A]₀ = −(1.5 × 10⁻³)(600) + ln 0.250 = −0.900 + (−1.386) = −2.286, so [A]ₜ = e⁻²·²⁸⁶ = 0.102 M. Check: t½ = 0.693/0.0015 = 462 s, so 600 s is 1.3 half-lives and a little under 0.125 M should remain.

  - slug: apchem-u05-exam-q37
    type: numeric
    topic_code: "5.6"
    source: "general knowledge"
    points: 1
    prompt: |
      The rate constant of a reaction is 4.0 × 10⁻⁴ s⁻¹ at 310 K and 1.6 × 10⁻³ s⁻¹ at 330 K. Calculate the activation energy using R = 8.314 J/(mol·K). Give your answer in kJ/mol to the nearest whole number.
    answer: { value: 59, tolerance: 1 }
    explanation: |
      ln(k₂/k₁) = ln(4.0) = 1.386. 1/T₂ − 1/T₁ = 1/330 − 1/310 = 0.0030303 − 0.0032258 = −1.955 × 10⁻⁴ K⁻¹. Ea = −R ln(k₂/k₁)/(1/T₂ − 1/T₁) = −(8.314)(1.386)/(−1.955 × 10⁻⁴) = 5.9 × 10⁴ J/mol = 59 kJ/mol.

  # ---- Short answer
  - slug: apchem-u05-exam-q38
    type: short_answer
    topic_code: "5.8"
    source: "general knowledge"
    points: 3
    prompt: |
      The reaction 2 NO(g) + Br₂(g) → 2 NOBr(g) has the experimental rate law rate = k[NO]²[Br₂]. Two mechanisms are proposed.

      Mechanism I: Step 1 (slow): NO + Br₂ → NOBr₂; Step 2 (fast): NOBr₂ + NO → 2 NOBr
      Mechanism II: Step 1 (fast, reversible): NO + Br₂ ⇌ NOBr₂; Step 2 (slow): NOBr₂ + NO → 2 NOBr

      (a) Derive the rate law predicted by Mechanism I.
      (b) Derive the rate law predicted by Mechanism II.
      (c) State which mechanism is consistent with the experimental rate law and explain why the other must be rejected.
    answer: |
      (a) Mechanism I: the slow step comes first, so rate = k₁[NO][Br₂], first order in each reactant.
      (b) Mechanism II: slow step rate = k₂[NOBr₂][NO]; from the fast equilibrium, [NOBr₂] = K₁[NO][Br₂]; substituting gives rate = k₂K₁[NO]²[Br₂] = k[NO]²[Br₂].
      (c) Mechanism II is consistent: its predicted rate law matches the experimental one. Mechanism I predicts first order in NO, but experiment shows second order, so Mechanism I is rejected; a mechanism that predicts the wrong rate law cannot be correct.
    explanation: |
      Three points, one per part.

      (a) 1 pt: rate = k[NO][Br₂] from the slow first step.
      (b) 1 pt: slow step rate law with the intermediate replaced through the fast equilibrium to give rate = k[NO]²[Br₂].
      (c) 1 pt: Mechanism II consistent; Mechanism I rejected because its predicted order in NO (1) contradicts the data (2).

  - slug: apchem-u05-exam-q39
    type: short_answer
    topic_code: "5.10"
    source: "general knowledge"
    points: 3
    prompt: |
      Graph description: an energy profile for a reaction has three maxima. The reactants are at 0 kJ/mol; the first peak is at +30 kJ/mol; the first valley at −10 kJ/mol; the second peak at +45 kJ/mol; the second valley at +5 kJ/mol; the third peak at +25 kJ/mol; and the products at −60 kJ/mol.

      (a) State the number of elementary steps and identify which step is rate-determining, showing the activation energy of each step.
      (b) State ΔH for the overall reaction and explain how it is read from the profile.
      (c) A catalyst is found that replaces the second step with a step of activation energy 20 kJ/mol. Predict the effect on the overall rate and on the overall ΔH.
    answer: |
      (a) Three steps (three peaks). Ea(step 1) = 30 − 0 = 30 kJ/mol; Ea(step 2) = 45 − (−10) = 55 kJ/mol; Ea(step 3) = 25 − 5 = 20 kJ/mol. Step 2 has the largest barrier and is rate-determining.
      (b) ΔH = E(products) − E(reactants) = −60 − 0 = −60 kJ/mol, exothermic; it is the vertical difference between the final and initial levels, independent of the peaks and intermediate valleys.
      (c) The largest barrier falls from 55 to 30 kJ/mol (step 1 now has the largest Ea), so the overall rate increases greatly. ΔH is unchanged at −60 kJ/mol because the reactants and products are the same.
    explanation: |
      Three points, one per part.

      (a) 1 pt: three steps; activation energies 30, 55 and 20 kJ/mol measured from each step's starting valley; step 2 rate-determining.
      (b) 1 pt: ΔH = −60 kJ/mol, from products minus reactants.
      (c) 1 pt: rate increases because the largest barrier is now lower (step 1 at 30 kJ/mol becomes rate-determining); ΔH unchanged.

  # ---- Long answer
  - slug: apchem-u05-exam-q40
    type: long_answer
    topic_code: "5.3"
    source: "general knowledge"
    points: 6
    stimulus: |
      A student studies the reaction of crystal violet (CV⁺), a purple dye, with hydroxide ion: CV⁺(aq) + OH⁻(aq) → CVOH(aq), colourless. With [OH⁻] = 0.10 M, far in excess of the dye, the absorbance at 590 nm (proportional to [CV⁺]) is recorded:

      | Time (s) | 0 | 30 | 60 | 90 | 120 |
      |---|---|---|---|---|---|
      | Absorbance | 0.800 | 0.566 | 0.400 | 0.283 | 0.200 |

      A second run with [OH⁻] = 0.20 M gives an absorbance that halves every 30 s.
    prompt: |
      (a) Explain why absorbance can be used in place of concentration to determine the order with respect to CV⁺.
      (b) Determine the order with respect to CV⁺ and the pseudo-first-order rate constant k' at [OH⁻] = 0.10 M. Show your reasoning.
      (c) Using the second run, determine the order with respect to OH⁻ and write the full rate law.
      (d) Calculate the true rate constant k, with units.
      (e) Describe the plot the student should make to confirm the order in CV⁺ and state what its slope represents.
      (f) The student repeats the first run at a higher temperature and finds the absorbance halves every 20 s. Explain this observation using the collision model.
    answer: |
      (a) By the Beer–Lambert law A = εbc, so absorbance is directly proportional to [CV⁺] at fixed wavelength and path length. Ratios of absorbances equal ratios of concentrations, which is all that is needed to find the order and half-life.
      (b) The absorbance halves every 60 s (0.800 → 0.400 → 0.200): a constant half-life, so the reaction is first order in CV⁺. k' = 0.693/t½ = 0.693/60 s = 0.0116 s⁻¹.
      (c) Doubling [OH⁻] halves the half-life (60 s to 30 s), so k' doubles: k' is proportional to [OH⁻], first order in OH⁻. Rate = k[CV⁺][OH⁻].
      (d) k' = k[OH⁻], so k = 0.0116 s⁻¹ / 0.10 M = 0.116 M⁻¹·s⁻¹.
      (e) Plot ln(absorbance) (or ln[CV⁺]) against time; a straight line confirms first order, and its slope equals −k'.
      (f) The half-life falls from 60 s to 20 s, so k' triples. At higher temperature a much larger fraction of CV⁺–OH⁻ collisions has energy at or above the activation energy (the Maxwell–Boltzmann tail beyond Ea grows), and collisions are slightly more frequent, so k increases as the Arrhenius equation predicts.
    explanation: |
      Six points.

      (a) 1 pt: Beer–Lambert law, absorbance proportional to concentration, so ratios (and half-lives) are the same.
      (b) 1 pt: first order from a constant half-life of 60 s (or constant fractional decrease), and k' = 0.693/60 = 0.0116 s⁻¹ (accept 0.012 s⁻¹).
      (c) 1 pt: first order in OH⁻ because doubling [OH⁻] doubles k' (halves t½); rate = k[CV⁺][OH⁻].
      (d) 1 pt: k = k'/[OH⁻] = 0.116 M⁻¹·s⁻¹ (accept 0.12 M⁻¹·s⁻¹) with correct units.
      (e) 1 pt: ln A (or ln[CV⁺]) versus t, linear, slope −k'.
      (f) 1 pt: higher temperature raises the fraction of collisions with energy at least Ea (and slightly the collision frequency), so k' increases and the half-life shortens.
