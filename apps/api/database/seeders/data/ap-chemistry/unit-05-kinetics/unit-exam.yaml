        A zero-order rate constant has the units of a rate, M/s.
      - |
        A first-order rate constant has units of s⁻¹, with no concentration unit.
      - |
        Correct. Units of k are M¹⁻ᵖ·s⁻¹; M⁻¹·s⁻¹ means 1 − p = −1, so p = 2.
      - |
        A third-order rate constant has units of M⁻²·s⁻¹.
    answer: 2
    explanation: |
      Practice 5. Read the order from the power of M in the units of k.

  - slug: apchem-u05-exam-q22
    type: multiple_choice
    topic_code: "5.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which experimental method would be LEAST suitable for following the rate of the reaction CH₃COOCH₃(aq) + OH⁻(aq) → CH₃COO⁻(aq) + CH₃OH(aq), in which all species are colourless?
    options:
      - "Measuring the absorbance of the solution in the visible region over time"
      - "Withdrawing samples at intervals, quenching them in ice, and titrating the remaining OH⁻ with acid"
      - "Measuring the electrical conductivity of the solution over time"
      - "Measuring the pH of the solution over time"
