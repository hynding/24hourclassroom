unit: 5
description: |
  40 questions · about 80 minutes · every topic of Unit 5 (5.1 to 5.11: rates, rate laws, integrated rate laws,
  elementary steps, the collision model, energy profiles, mechanisms, the steady state and catalysis), with
  review of the Maxwell–Boltzmann distribution, gas laws and stoichiometry from Units 3 and 4. Three data sets
  in the AP style (an initial-rate table, a concentration–time table and a catalysed energy profile), stand-alone
  multiple choice, select-all, true/false, fill-in-the-blank and numeric items, two short-answer questions
  (3 points each) and one long free-response question (6 points). Multiple choice, select-all, true/false and
  numeric items are graded at once; fill-in-the-blank items are matched automatically; the free-response items
  are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: initial-rate table (5.2)
  - slug: apchem-u05-exam-q01
    type: multiple_choice
    topic_code: "5.2"
    source: "general knowledge"
    points: 1
    stimulus: |
      Initial-rate data at 25 °C for BrO₃⁻(aq) + 5 Br⁻(aq) + 6 H⁺(aq) → 3 Br₂(aq) + 3 H₂O(l):

      | Experiment | [BrO₃⁻]₀ (M) | [Br⁻]₀ (M) | [H⁺]₀ (M) | Initial rate (M/s) |
      |---|---|---|---|---|
      | 1 | 0.10 | 0.10 | 0.10 | 8.0 × 10⁻⁴ |
      | 2 | 0.20 | 0.10 | 0.10 | 1.6 × 10⁻³ |
      | 3 | 0.10 | 0.30 | 0.10 | 2.4 × 10⁻³ |
      | 4 | 0.10 | 0.10 | 0.20 | 3.2 × 10⁻³ |
    prompt: |
      What is the order of the reaction with respect to H⁺?
    options:
      - "Zero"
      - "First"
      - "Second"
      - "Sixth"
    option_explanations:
      - |
        The rate changes when [H⁺] changes (experiments 1 and 4), so the order cannot be zero.
      - |
        First order would double the rate when [H⁺] doubles; the rate rises by a factor of 4.
      - |
        Correct. Between experiments 1 and 4 only [H⁺] changes, doubling, and the rate rises from 8.0 × 10⁻⁴ to 3.2 × 10⁻³, a factor of 4 = 2².
      - |
        Six is the coefficient of H⁺ in the balanced equation; orders are measured, not read from coefficients.
    answer: 2
    explanation: |
      Practice 5. Compare the pair of experiments in which only [H⁺] differs.

  - slug: apchem-u05-exam-q02
    type: multiple_choice
    topic_code: "5.2"
    source: "general knowledge"
    points: 1
    stimulus: |
      Initial-rate data at 25 °C for BrO₃⁻(aq) + 5 Br⁻(aq) + 6 H⁺(aq) → 3 Br₂(aq) + 3 H₂O(l):

      | Experiment | [BrO₃⁻]₀ (M) | [Br⁻]₀ (M) | [H⁺]₀ (M) | Initial rate (M/s) |
      |---|---|---|---|---|
      | 1 | 0.10 | 0.10 | 0.10 | 8.0 × 10⁻⁴ |
      | 2 | 0.20 | 0.10 | 0.10 | 1.6 × 10⁻³ |
      | 3 | 0.10 | 0.30 | 0.10 | 2.4 × 10⁻³ |
      | 4 | 0.10 | 0.10 | 0.20 | 3.2 × 10⁻³ |
    prompt: |
      Which rate law is consistent with the data?
    options:
      - "rate = k[BrO₃⁻][Br⁻]⁵[H⁺]⁶"
      - "rate = k[BrO₃⁻][Br⁻]²[H⁺]"
      - "rate = k[BrO₃⁻]²[Br⁻][H⁺]"
      - "rate = k[BrO₃⁻][Br⁻][H⁺]²"
    option_explanations:
      - |
        These are the coefficients of the balanced equation, which do not give orders for an overall reaction; the data show far smaller exponents.
      - |
        Experiments 1 and 3 show the rate tripling when [Br⁻] triples, so bromide is first order, not second.
      - |
        Experiments 1 and 2 show the rate only doubling when [BrO₃⁻] doubles, so the order in bromate is 1, not 2.
      - |
        Correct. Doubling [BrO₃⁻] doubles the rate (first order); tripling [Br⁻] triples it (first order); doubling [H⁺] quadruples it (second order).
    answer: 3
    explanation: |
      Practice 5. Fourth order overall; the two H⁺ ions in the slow step are why acid speeds this reaction so strongly.

  - slug: apchem-u05-exam-q03
    type: numeric
    topic_code: "5.2"
    source: "general knowledge"
    points: 1
    stimulus: |
      Initial-rate data at 25 °C for BrO₃⁻(aq) + 5 Br⁻(aq) + 6 H⁺(aq) → 3 Br₂(aq) + 3 H₂O(l):

      | Experiment | [BrO₃⁻]₀ (M) | [Br⁻]₀ (M) | [H⁺]₀ (M) | Initial rate (M/s) |
      |---|---|---|---|---|
      | 1 | 0.10 | 0.10 | 0.10 | 8.0 × 10⁻⁴ |
      | 2 | 0.20 | 0.10 | 0.10 | 1.6 × 10⁻³ |
      | 3 | 0.10 | 0.30 | 0.10 | 2.4 × 10⁻³ |
      | 4 | 0.10 | 0.10 | 0.20 | 3.2 × 10⁻³ |
    prompt: |
      Using the rate law rate = k[BrO₃⁻][Br⁻][H⁺]² and experiment 1, calculate the rate constant. Give your answer in M⁻³·s⁻¹ to two significant figures.
    answer: { value: 8.0, tolerance: 0.2 }
    explanation: |
      k = rate / ([BrO₃⁻][Br⁻][H⁺]²) = 8.0 × 10⁻⁴ / (0.10 × 0.10 × (0.10)²) = 8.0 × 10⁻⁴ / 1.0 × 10⁻⁴ = 8.0 M⁻³·s⁻¹. For a fourth-order reaction the units are (M/s)/M⁴ = M⁻³·s⁻¹.

  # ---- Stimulus set B: concentration–time table (5.3)
  - slug: apchem-u05-exam-q04
    type: multiple_choice
    topic_code: "5.3"
    source: "general knowledge"
    points: 1
    stimulus: |
      The decomposition 2 NOBr(g) → 2 NO(g) + Br₂(g) was followed at a fixed temperature:

      | Time (s) | 0 | 10 | 20 | 40 | 80 |
      |---|---|---|---|---|---|
      | [NOBr] (M) | 0.0400 | 0.0303 | 0.0244 | 0.0175 | 0.0112 |
      | 1/[NOBr] (M⁻¹) | 25.0 | 33.0 | 41.0 | 57.0 | 89.0 |
    prompt: |
      What is the order of the reaction with respect to NOBr?
    options:
      - "Zero order, because the concentration falls steadily"
      - "First order, because the concentration halves in a constant time"
      - "Second order, because 1/[NOBr] increases by equal amounts in equal time intervals"
      - "Second order, because the coefficient of NOBr is 2"
    option_explanations:
      - |
        A zero-order reactant loses equal amounts in equal times; here the first 10 s removes 0.0097 M and the next 10 s only 0.0059 M.
      - |
        The first halving (0.0400 to 0.0200 M) takes about 31 s and the second (to 0.0100 M) about 63 s; the half-life is not constant.
      - |
        Correct. 1/[NOBr] rises by 8.0 M⁻¹ every 10 s (25.0, 33.0, 41.0, then 57.0 at 40 s and 89.0 at 80 s), a straight line against time, the signature of second order.
      - |
        The coefficient happens to equal the order here, but that is a coincidence; the justification must come from the data.
    answer: 2
    explanation: |
      Practice 4. A linear 1/[A] column means second order.

  - slug: apchem-u05-exam-q05
    type: multiple_choice
    topic_code: "5.3"
    source: "general knowledge"
    points: 1
    stimulus: |
      The decomposition 2 NOBr(g) → 2 NO(g) + Br₂(g) was followed at a fixed temperature:

      | Time (s) | 0 | 10 | 20 | 40 | 80 |
      |---|---|---|---|---|---|
      | [NOBr] (M) | 0.0400 | 0.0303 | 0.0244 | 0.0175 | 0.0112 |
      | 1/[NOBr] (M⁻¹) | 25.0 | 33.0 | 41.0 | 57.0 | 89.0 |
    prompt: |
      What is the value of the rate constant?
    options:
      - "0.80 M⁻¹·s⁻¹"
      - "−0.80 M⁻¹·s⁻¹"
      - "0.80 s⁻¹"
      - "25 M⁻¹·s⁻¹"
    option_explanations:
      - |
        Correct. The slope of 1/[NOBr] against t is (89.0 − 25.0)/80 = 0.80 M⁻¹·s⁻¹, and for second order the slope equals +k.
      - |
        The second-order plot has a positive slope equal to +k; rate constants are never negative.
      - |
        s⁻¹ is the unit of a first-order rate constant; a second-order k carries M⁻¹·s⁻¹.
      - |
        25 M⁻¹ is the intercept, 1/[NOBr]₀, not the slope.
    answer: 0
    explanation: |
      Practice 5. 1/[A]ₜ = kt + 1/[A]₀: slope k, intercept 1/[A]₀.

  - slug: apchem-u05-exam-q06
    type: numeric
    topic_code: "5.3"
    source: "general knowledge"
    points: 1
    stimulus: |
      The decomposition 2 NOBr(g) → 2 NO(g) + Br₂(g) was followed at a fixed temperature:

      | Time (s) | 0 | 10 | 20 | 40 | 80 |
      |---|---|---|---|---|---|
      | [NOBr] (M) | 0.0400 | 0.0303 | 0.0244 | 0.0175 | 0.0112 |
      | 1/[NOBr] (M⁻¹) | 25.0 | 33.0 | 41.0 | 57.0 | 89.0 |
    prompt: |
      Using k = 0.80 M⁻¹·s⁻¹, calculate the time at which [NOBr] reaches 0.0100 M. Give your answer in seconds to the nearest whole number.
    answer: { value: 94, tolerance: 2 }
    explanation: |
      1/[A]ₜ = kt + 1/[A]₀ → 1/0.0100 = 0.80 t + 25.0 → 100 = 0.80 t + 25.0 → t = 75/0.80 = 93.75 s ≈ 94 s. Check: 0.0100 M is two half-lives from 0.0400 M; the first half-life is 1/(k[A]₀) = 31.25 s and the second is 62.5 s, totalling 93.75 s.

  # ---- Stimulus set C: catalysed energy profile (5.10, 5.11, 5.6)
  - slug: apchem-u05-exam-q07
    type: multiple_choice
    topic_code: "5.10"
    source: "general knowledge"
    points: 1
    stimulus: |
      Graph description: two energy profiles for the same exothermic reaction are drawn on one set of axes (potential energy in kJ/mol against reaction progress), both starting at the reactants at 0 kJ/mol and ending at the products at −50 kJ/mol. The uncatalysed curve (dashed) has a single maximum at +120 kJ/mol. The catalysed curve (solid) has a first maximum at +40 kJ/mol, a valley at +10 kJ/mol, and a second maximum at +70 kJ/mol.
    prompt: |
      Which step of the catalysed pathway is rate-determining?
    options:
      - "Step 1, with an activation energy of 40 kJ/mol"
      - "Neither; the uncatalysed step at 120 kJ/mol still controls the rate"
      - "Step 2, with an activation energy of 70 kJ/mol"
      - "Step 2, with an activation energy of 60 kJ/mol"
    option_explanations:
      - |
        Step 1's barrier is 40 kJ/mol, but step 2's barrier measured from the intermediate is larger, so step 1 is the faster step.
      - |
        Once the catalyst is present, almost all reaction goes by the faster catalysed route; the uncatalysed path contributes negligibly.
      - |
        70 kJ/mol is the height of the second peak above the reactants, not above the intermediate from which step 2 starts.
      - |
        Correct. Step 2 climbs from the intermediate at +10 kJ/mol to the peak at +70 kJ/mol, an activation energy of 60 kJ/mol, which exceeds step 1's 40 kJ/mol.
    answer: 3
    explanation: |
      Practice 4. Measure each step's Ea from its own starting valley.

  - slug: apchem-u05-exam-q08
    type: multiple_choice
    topic_code: "5.11"
    source: "general knowledge"
    points: 1
    stimulus: |
      Graph description: two energy profiles for the same exothermic reaction are drawn on one set of axes (potential energy in kJ/mol against reaction progress), both starting at the reactants at 0 kJ/mol and ending at the products at −50 kJ/mol. The uncatalysed curve (dashed) has a single maximum at +120 kJ/mol. The catalysed curve (solid) has a first maximum at +40 kJ/mol, a valley at +10 kJ/mol, and a second maximum at +70 kJ/mol.
    prompt: |
      Which statement about the effect of the catalyst is correct?
    options:
      - "The catalyst makes the reaction more exothermic, releasing an extra 50 kJ/mol."
      - "The catalyst changes the mechanism to two steps and lowers the highest barrier from 120 to 70 kJ/mol, leaving ΔH at −50 kJ/mol."
      - "The catalyst lowers ΔH from −50 kJ/mol to −120 kJ/mol."
      - "The catalyst is consumed, which is why the valley at +10 kJ/mol appears."
    option_explanations:
      - |
        Both curves end at −50 kJ/mol; the heat released is identical with and without the catalyst.
      - |
        Correct. The catalysed route has two steps (two peaks) whose highest point is 70 kJ/mol above the reactants instead of 120, while the start and end energies, and so ΔH, are unchanged.
      - |
        −120 kJ/mol confuses the uncatalysed activation energy with an enthalpy change; ΔH is read from the valleys, not the peaks.
      - |
        The valley is an intermediate of the catalysed mechanism; a catalyst is regenerated, not consumed.
    answer: 1
    explanation: |
      Practice 6. A catalyst changes the path and the rate, never the thermodynamics.

  - slug: apchem-u05-exam-q09
    type: multiple_choice
    topic_code: "5.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      Graph description: two energy profiles for the same exothermic reaction are drawn on one set of axes (potential energy in kJ/mol against reaction progress), both starting at the reactants at 0 kJ/mol and ending at the products at −50 kJ/mol. The uncatalysed curve (dashed) has a single maximum at +120 kJ/mol. The catalysed curve (solid) has a first maximum at +40 kJ/mol, a valley at +10 kJ/mol, and a second maximum at +70 kJ/mol.
    prompt: |
      What is the activation energy of the reverse reaction along the uncatalysed pathway?
    options:
      - "70 kJ/mol"
      - "120 kJ/mol"
      - "50 kJ/mol"
      - "170 kJ/mol"
    option_explanations:
      - |
        70 kJ/mol is the uncatalysed forward barrier minus the magnitude of ΔH, which is not how the reverse barrier is found.
      - |
        120 kJ/mol is the forward activation energy; the reverse reaction starts from the lower product valley and must climb further.
      - |
        50 kJ/mol is the magnitude of ΔH, the gap between the valleys, not a barrier.
      - |
        Correct. Ea(reverse) = Ea(forward) − ΔH = 120 − (−50) = 170 kJ/mol: the climb from the products at −50 to the peak at +120.
    answer: 3
    explanation: |
      Practice 5. Ea(reverse) = Ea(forward) − ΔH, with the sign of ΔH included.

  # ---- Stand-alone multiple choice
  - slug: apchem-u05-exam-q10
    type: multiple_choice
    topic_code: "5.1"
    source: "general knowledge"
    points: 1
    prompt: |
      In the reaction 4 NH₃(g) + 5 O₂(g) → 4 NO(g) + 6 H₂O(g), water is being produced at 0.30 M/s. At what rate is O₂ being consumed?
    options:
      - "0.25 M/s"
      - "0.30 M/s"
      - "0.36 M/s"
      - "0.20 M/s"
    option_explanations:
      - |
        Correct. O₂ is consumed at (5/6) × 0.30 = 0.25 M/s, because five O₂ are used for every six H₂O formed.
      - |
        Equal rates would need equal coefficients; O₂ has 5 and H₂O has 6.
      - |
        0.36 M/s would be the rate for a species with a coefficient of 7.2 relative to water's 6; no such species exists.
      - |
        0.20 M/s is the rate for NH₃ or NO (coefficient 4): (4/6) × 0.30 = 0.20 M/s.
    answer: 0
    explanation: |
      Practice 5. Multiply by the ratio of coefficients.

  - slug: apchem-u05-exam-q11
    type: multiple_choice
    topic_code: "5.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following is a valid rate law for the elementary step 2 NO₂(g) → NO₃(g) + NO(g)?
    options:
      - "rate = k[NO₂]"
      - "rate = k[NO₂]²"
      - "rate = k[NO₃][NO]"
      - "rate = k[NO₂]²[NO₃]"
    option_explanations:
      - |
        First order would describe a single NO₂ decomposing; this step requires two NO₂ molecules to collide.
      - |
        Correct. The step is bimolecular in NO₂, so its rate law is k[NO₂]², with the coefficient as the order because the step is elementary.
      - |
        Products do not appear in the rate law of a forward elementary step.
      - |
        NO₃ is a product of this step; it cannot influence how often two NO₂ molecules collide.
    answer: 1
    explanation: |
      Practice 1. Elementary step: coefficients are orders.

  - slug: apchem-u05-exam-q12
    type: multiple_choice
    topic_code: "5.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Which of the following best explains why most collisions between reactant molecules at room temperature do not lead to reaction?
    options:
      - "Most molecules are moving too fast to react."
      - "The products form only when the activation energy of the reverse reaction is exceeded."
      - "Reactant molecules repel one another and rarely collide."
      - "Most collisions lack sufficient energy to reach the transition state, or occur with the wrong orientation."
    option_explanations:
      - |
        Faster molecules carry more kinetic energy and are more likely to react, not less.
      - |
        The forward reaction depends on the forward activation energy; the reverse barrier is irrelevant to whether a forward collision succeeds.
      - |
        Gas and solution molecules collide billions of times a second; collision frequency is not the limitation.
      - |
        Correct. Only the small fraction of collisions in the high-energy tail of the Maxwell–Boltzmann distribution has energy at least Ea, and of those only some have the atoms that must bond pointed at each other.
    answer: 3
    explanation: |
      Practice 6. Energy and orientation are the two filters in the collision model.

  - slug: apchem-u05-exam-q13
    type: multiple_choice
    topic_code: "5.7"
    source: "general knowledge"
    points: 1
    prompt: |
      A mechanism for the reaction 2 O₃(g) → 3 O₂(g) is:

      Step 1: O₃ → O₂ + O
      Step 2: O + O₃ → 2 O₂

      Which statement is correct?
    options:
      - "O is a catalyst because it is regenerated."
      - "O₂ is an intermediate because it appears in both steps."
      - "O is an intermediate because it is produced in step 1 and consumed in step 2."
      - "The mechanism cannot be correct because the steps do not add to the overall equation."
    option_explanations:
      - |
        O is produced before it is consumed and is not regenerated afterward; that is the pattern of an intermediate, not a catalyst.
      - |
        O₂ is a product that appears on the right of both steps and of the overall equation; it never cancels, so it is not an intermediate.
      - |
        Correct. The oxygen atom is formed in step 1, used up in step 2, and cancels when the steps are added, leaving 2 O₃ → 3 O₂.
      - |
        Adding the steps gives O₃ + O + O₃ → O₂ + O + 2 O₂, which simplifies to 2 O₃ → 3 O₂, exactly the overall equation.
    answer: 2
    explanation: |
      Practice 1. Intermediate: made in one step, consumed in a later one.

  - slug: apchem-u05-exam-q14
    type: multiple_choice
    topic_code: "5.8"
    source: "general knowledge"
    points: 1
    prompt: |
      For the mechanism Step 1 (fast, reversible): A + B ⇌ C; Step 2 (slow): C + A → D, which rate law is predicted?
    options:
      - "rate = k[A]²[B]"
      - "rate = k[C][A]"
      - "rate = k[A][B]"
      - "rate = k[A][B]²"
    option_explanations:
      - |
        Correct. Slow step: rate = k₂[C][A]; fast equilibrium: [C] = K₁[A][B]; so rate = k₂K₁[A]²[B].
      - |
        This is the slow step's rate law as written, but it contains the intermediate C and must be rewritten in terms of reactants.
      - |
        This would be the prediction if step 1 were slow; here step 1 is a fast equilibrium and the slow step is the second.
      - |
        B appears once in the equilibrium expression for C and nowhere else, so the order in B is 1, not 2.
    answer: 0
    explanation: |
      Practice 5. Replace the intermediate with the fast step's equilibrium expression.

  - slug: apchem-u05-exam-q15
    type: multiple_choice
    topic_code: "5.9"
    source: "general knowledge"
    points: 1
    prompt: |
      In applying the steady-state approximation to the intermediate N₂O₂ in the mechanism 2 NO ⇌ N₂O₂ (k₁ forward, k₋₁ reverse) followed by N₂O₂ + O₂ → 2 NO₂ (k₂), which equation is written?
    options:
      - "k₁[NO]² = k₋₁[N₂O₂]"
      - "k₁[NO]² = k₋₁[N₂O₂] + k₂[N₂O₂][O₂]"
      - "k₂[N₂O₂][O₂] = k₋₁[N₂O₂]"
      - "k₁[NO]² = k₂[NO₂]²"
    option_explanations:
      - |
        This is the pre-equilibrium condition, which ignores the removal of N₂O₂ by step 2; the steady state includes every route by which the intermediate is consumed.
      - |
        Correct. Steady state sets the rate of formation of N₂O₂ (k₁[NO]²) equal to its total rate of consumption: reverting to NO (k₋₁[N₂O₂]) plus reacting with O₂ (k₂[N₂O₂][O₂]).
      - |
        This equates two consumption routes with each other, which has no physical basis.
      - |
        The product NO₂ does not appear in any expression for the formation or consumption of the intermediate.
    answer: 1
    explanation: |
      Practice 4. Formation = total consumption; the pre-equilibrium result is the limit k₋₁ ≫ k₂[O₂].

  - slug: apchem-u05-exam-q16
    type: multiple_choice
    topic_code: "5.11"
    source: "general knowledge"
    points: 1
    prompt: |
      Hydrogen gas and ethene react to form ethane far faster in the presence of finely divided nickel. Which description of the catalysis is best?
    options:
      - "Homogeneous catalysis: nickel dissolves in the gas mixture and forms an intermediate."
      - "Heterogeneous catalysis: the gases adsorb on the nickel surface, the H–H bond is weakened, and ethane desorbs."
      - "Acid catalysis: nickel donates protons to ethene."
      - "Enzyme catalysis: nickel binds ethene at an active site shaped for it."
    option_explanations:
      - |
        Nickel is a solid in a different phase from the gaseous reactants; it does not dissolve in them.
      - |
        Correct. Solid nickel catalysing a gas-phase hydrogenation is the classic heterogeneous case: adsorption, surface reaction and desorption.
      - |
        Nickel metal has no protons to donate; acid catalysis requires an acid.
      - |
        Enzymes are proteins; a metal surface has no active site in the enzyme sense, although it does bind reactants.
    answer: 1
    explanation: |
      Practice 6. Different phase from the reactants means heterogeneous.

  - slug: apchem-u05-exam-q17
    type: multiple_choice
    topic_code: "5.3"
    source: "general knowledge"
    points: 1
    prompt: |
      A first-order reaction has a rate constant of 0.0347 min⁻¹. How long does it take for the concentration of the reactant to fall to one eighth of its initial value?
    options:
      - "20 min"
      - "40 min"
      - "60 min"
      - "160 min"
    option_explanations:
      - |
        20 min is one half-life (0.693/0.0347), after which one half remains, not one eighth.
      - |
        40 min is two half-lives, leaving one quarter.
      - |
        Correct. t½ = 0.693/0.0347 = 20.0 min; one eighth is (1/2)³, three half-lives, 60 min.
      - |
        160 min is eight half-lives, by which time only 1/256 would remain.
    answer: 2
    explanation: |
      Practice 5. Count half-lives: 1/8 = (1/2)³.

  - slug: apchem-u05-exam-q18
    type: multiple_choice
    topic_code: "5.6"
    source: "general knowledge"
    points: 1
    prompt: |
      Graph description: ln k is plotted against 1/T for two reactions, P and Q. Both are straight lines; line P is steeper (more negative slope) than line Q. Which conclusion is correct?
    options:
      - "Reaction P has the larger activation energy, so its rate constant is more sensitive to temperature."
      - "Reaction Q has the larger activation energy, because a shallower slope means a bigger Ea."
      - "Reaction P is always faster than reaction Q."
      - "The two reactions have the same frequency factor."
    option_explanations:
      - |
        Correct. Slope = −Ea/R, so a steeper line means a larger Ea, and a larger Ea makes k change more for a given change in temperature.
      - |
        The slope's magnitude is Ea/R; a shallower slope means a smaller activation energy.
      - |
        Which reaction is faster at a given temperature depends on both Ea and A; the slopes alone do not fix the relative values of k.
      - |
        The frequency factor is read from the intercept (ln A), which the description does not compare.
    answer: 0
    explanation: |
      Practice 4. Steeper Arrhenius plot, larger Ea, stronger temperature dependence.

  - slug: apchem-u05-exam-q19
    type: multiple_choice
    topic_code: "3.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Graph description: a Maxwell–Boltzmann distribution of molecular speeds is drawn for a sample of N₂ at 300 K, and a second curve for the same sample at 600 K. Which feature of the 600 K curve is correct?
    options:
      - "It is taller and narrower, with its peak at a lower speed."
      - "Its peak is at exactly twice the speed of the 300 K peak."
      - "It encloses twice the area of the 300 K curve."
      - "It is lower and broader, with its peak at a higher speed and a larger fraction of molecules at high speeds."
    option_explanations:
      - |
        A taller, narrower curve with a lower peak speed describes cooling, not heating.
      - |
        Speeds scale with the square root of the kelvin temperature, so doubling T raises the peak speed by a factor of about 1.4, not 2.
      - |
        The area under each curve is the total fraction of molecules, 1, so the areas are equal.
      - |
        Correct. Heating spreads the molecules over a wider range of speeds and shifts the most probable speed upward; the high-speed tail grows, which is what matters for reaction.
    answer: 3
    explanation: |
      Practice 4 (review of 3.5). Hotter: lower, broader, shifted right, equal area.

  - slug: apchem-u05-exam-q20
    type: multiple_choice
    topic_code: "4.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Magnesium reacts with excess hydrochloric acid: Mg(s) + 2 HCl(aq) → MgCl₂(aq) + H₂(g). In a rate experiment, 0.0300 mol of H₂ is collected in 60.0 s from a 0.500 L solution. What is the average rate of consumption of HCl in M/s?
    options:
      - "1.00 × 10⁻³ M/s"
      - "5.00 × 10⁻⁴ M/s"
      - "2.00 × 10⁻³ M/s"
      - "6.00 × 10⁻⁴ M/s"
    option_explanations:
      - |
        1.00 × 10⁻³ M/s is the rate of H₂ formation expressed per litre (0.0300 mol / 0.500 L / 60.0 s); HCl is consumed at twice that rate.
      - |
        5.00 × 10⁻⁴ M/s divides the H₂ rate by 2 instead of multiplying by 2.
      - |
        Correct. H₂ forms at 0.0300 mol / 0.500 L / 60.0 s = 1.00 × 10⁻³ M/s; two HCl are consumed per H₂, so HCl is consumed at 2.00 × 10⁻³ M/s.
      - |
        6.00 × 10⁻⁴ M/s does not follow from any correct combination of the mole ratio, the volume and the time.
    answer: 2
    explanation: |
      Practice 5 (review of 4.5). Moles to molarity to rate, then the coefficient ratio.

  - slug: apchem-u05-exam-q21
    type: multiple_choice
    topic_code: "5.2"
