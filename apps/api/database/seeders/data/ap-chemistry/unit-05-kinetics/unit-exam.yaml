  - slug: apchem-u05-exam-q23
    type: multiple_choice
    topic_code: "5.8"
    source: "general knowledge"
    points: 1
    prompt: |
      The reaction H₂O₂(aq) + 2 I⁻(aq) + 2 H⁺(aq) → I₂(aq) + 2 H₂O(l) has the rate law rate = k[H₂O₂][I⁻]. Which conclusion about the mechanism is justified?
    options:
      - "H⁺ does not take part in the reaction."
      - "The rate-determining step involves one H₂O₂ and one I⁻ and occurs before any step involving H⁺."
      - "The reaction occurs in a single step involving five ions and molecules."
      - "The rate-determining step involves two iodide ions."
    option_explanations:
      - |
        H⁺ is consumed, as the balanced equation shows; it simply enters in a fast step after the rate-determining step.
      - |
        Correct. The rate law is first order in H₂O₂ and I⁻ and zero order in H⁺, which fits a slow bimolecular step H₂O₂ + I⁻ followed by fast steps that consume H⁺ and the second I⁻.
      - |
        A five-particle elementary step is essentially impossible, and it would predict a rate law containing H⁺ and [I⁻]².
      - |
