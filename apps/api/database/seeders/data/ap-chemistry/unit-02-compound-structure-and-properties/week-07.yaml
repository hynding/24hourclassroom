    # ---- Numeric
    - slug: apchem-u02-w07-q19
      type: numeric
      topic_code: "2.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Calculate the formal charge on the sulfur atom in the Lewis diagram of the sulfate ion in which sulfur is joined to the four oxygens by four single bonds and has no lone pairs. Give a signed whole number.
      answer: { value: 2, tolerance: 0 }
      explanation: |
        Formal charge = 6 − 0 − ½(8) = +2. Each oxygen is 6 − 6 − 1 = −1; the sum is +2 − 4 = −2, the charge of the ion. The expanded-octet structure with two S=O bonds brings sulfur to 0.

