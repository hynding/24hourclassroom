week: 7
unit: 2
title: "Resonance, Formal Charge, VSEPR and Hybridization"
topics: ["2.6", "2.7"]
guide: guides/week-07.md
guide_description: |
  Resonance structures and the hybrid they average to, fractional bond orders and equal bond lengths; formal charge
  as the tool for choosing among non-equivalent structures; then VSEPR from the Lewis diagram to electron-domain
  and molecular geometry, bond angles and the effect of lone pairs, molecular polarity from geometry, and
  hybridization with σ and π bond counts. Worked examples: ozone, nitrate, thiocyanate, sulfate, SO₂, ClF₃, XeF₄,
  ethene and HCN.
flashcards_description: |
  32 cards on resonance and bond order, formal charge rules, the VSEPR table of shapes and angles, lone-pair
  effects, polarity decisions, hybridization and σ/π counting.

flashcards:
  - front: Resonance structures → what may and may not differ between them
    back: |
      Only the placement of electrons (which bonds are double, where lone pairs sit) differs; the atoms stay in the same positions. Structures that move an atom are different molecules (isomers), not resonance forms.
    topic_code: "2.6"
  - front: Resonance hybrid → what the molecule actually is
    back: |
      A single average structure with delocalised electrons, present at all times. The molecule does not flip between forms. Bonds that are double in some structures and single in others are intermediate in length and strength.
    topic_code: "2.6"
  - front: Ozone's two O–O bonds → length evidence for resonance
    back: |
      Both are 128 pm, between an O–O single (148 pm) and an O=O double (121 pm). If one were double and one single they would differ; equal lengths show the hybrid has bond order 1.5 on each.
    topic_code: "2.6"
  - front: Bond order from equivalent resonance structures → the formula
    back: |
      Total number of bonds in one structure across the equivalent positions, divided by the number of positions. NO₃⁻: (2 + 1 + 1) ÷ 3 = 1.33. Benzene: 9 bonds over 6 positions = 1.5.
    topic_code: "2.6"
  - front: Nitrate and carbonate → resonance count and bond order
    back: |
      Each has three equivalent structures (the double bond on each oxygen in turn), so each X–O bond has order 1.33 and all three are the same length (N–O 124 pm, between 136 and 115 pm).
    topic_code: "2.6"
  - front: Acetate vs acetic acid → why one has equal C–O bonds and the other does not
    back: |
      In CH₃COO⁻ the two oxygens are equivalent, so two resonance structures average to identical bonds (order 1.5). In CH₃COOH one oxygen carries H, the structures are not equivalent, and C=O (123 pm) and C–OH (136 pm) stay distinct.
    topic_code: "2.6"
  - front: Formal charge → the formula
    back: |
      Valence electrons of the free atom − lone-pair (nonbonding) electrons − ½ bonding electrons; equivalently valence − dots − lines. The formal charges in a structure sum to the overall charge of the species.
    topic_code: "2.6"
  - front: Choosing the best resonance structure → the three formal-charge rules
    back: |
      Fewest nonzero formal charges; negative formal charge on the most electronegative atom; no like charges on adjacent atoms. Apply in that order when structures are not equivalent.
    topic_code: "2.6"
  - front: Thiocyanate SCN⁻ → which structure dominates and why
    back: |
      S=C=N (N −1, others 0) beats S–C≡N (S −1) because nitrogen is more electronegative than sulfur, and both beat S≡C–N (S +1, N −2) which has larger, separated charges. The C–N bond order is between 2 and 3.
    topic_code: "2.6"
  - front: CO₂ → why O=C=O beats O≡C–O
    back: |
      O=C=O has formal charges of 0 on every atom; O≡C–O puts +1 on the triple-bonded oxygen and −1 on the single-bonded one. Fewer nonzero charges wins, so the symmetric structure is the major form.
    topic_code: "2.6"
  - front: Sulfate's two accepted structures → formal charges in each
    back: |
      Four single bonds: S +2, each O −1 (sum −2). Two S=O and two S–O (expanded octet): S 0, double-bonded O 0, single-bonded O −1 (sum −2). The expanded form has fewer formal charges; both are accepted on the exam.
    topic_code: "2.6"
  - front: Formal charges in NH₄⁺ and in ozone
    back: |
      NH₄⁺: N is 5 − 0 − 4 = +1, each H is 0; sum +1. Ozone O=O–O: terminal double-bonded O 0, central O +1 (6 − 2 − 3), terminal single-bonded O −1; sum 0.
    topic_code: "2.6"
  - front: Formal charge vs oxidation number → the difference
    back: |
      Formal charge splits each bond's electrons equally between the two atoms; oxidation number gives both electrons to the more electronegative atom. In H₂O, oxygen's formal charge is 0 but its oxidation number is −2.
    topic_code: "2.6"
  - front: Electron domain → what counts as one
    back: |
      A lone pair, or a bond to one atom regardless of its order: single, double and triple bonds are each one domain. CO₂ has 2 domains on carbon; SO₂ has 3 on sulfur (two bonds, one lone pair).
    topic_code: "2.7"
  - front: VSEPR → the principle in one sentence
    back: |
      Electron domains around a central atom repel one another and adopt the arrangement that places them as far apart as possible; the atoms follow the domains that hold them.
    topic_code: "2.7"
  - front: Electron-domain geometries for 2 to 6 domains → names and ideal angles
    back: |
      2 linear (180°); 3 trigonal planar (120°); 4 tetrahedral (109.5°); 5 trigonal bipyramidal (90° and 120°); 6 octahedral (90°).
    topic_code: "2.7"
  - front: Molecular geometry vs electron-domain geometry → the distinction
    back: |
      Electron-domain geometry counts lone pairs; molecular geometry names only the arrangement of atoms. Water: tetrahedral electron-domain geometry, bent molecular geometry. Always give the molecular geometry when asked for the shape.
    topic_code: "2.7"
  - front: Four domains with 0, 1, 2 lone pairs → shapes and angles
    back: |
      0: tetrahedral, 109.5° (CH₄). 1: trigonal pyramidal, about 107° (NH₃). 2: bent, about 104.5° (H₂O). Each lone pair compresses the bond angles a little more.
    topic_code: "2.7"
  - front: Three domains with 0 or 1 lone pair → shapes
    back: |
      0: trigonal planar, 120° (BF₃, CO₃²⁻). 1: bent, slightly under 120° (SO₂, O₃, NO₂⁻).
    topic_code: "2.7"
  - front: Why lone pairs squeeze bond angles
    back: |
      A lone pair is held by only one nucleus, so it spreads out and repels neighbouring domains more strongly than a bonding pair does. Bond angles close up: 109.5° → 107° (NH₃) → 104.5° (H₂O).
    topic_code: "2.7"
  - front: Five domains → where lone pairs go and the resulting shapes
    back: |
      Lone pairs take the roomier equatorial positions. 0 lone pairs: trigonal bipyramidal (PCl₅); 1: see-saw (SF₄); 2: T-shaped (ClF₃); 3: linear (XeF₂, I₃⁻).
    topic_code: "2.7"
  - front: Six domains → shapes with 0, 1, 2 lone pairs
    back: |
      0: octahedral (SF₆); 1: square pyramidal (BrF₅); 2: square planar (XeF₄), with the lone pairs opposite each other to minimise repulsion.
    topic_code: "2.7"
  - front: Deciding molecular polarity → the two questions
    back: |
      Are the bonds polar (different electronegativities)? Does the geometry let the bond dipoles cancel? Symmetric shapes with identical terminal atoms and no lone pairs on the centre (plus square planar and linear with 3 lone pairs) are nonpolar; otherwise polar bonds make a polar molecule.
    topic_code: "2.7"
  - front: CO₂ nonpolar but H₂O polar → why
    back: |
      Both have polar bonds. CO₂ is linear, so the two equal C=O dipoles point in opposite directions and cancel. H₂O is bent, so the two O–H dipoles add to a net dipole pointing toward oxygen.
    topic_code: "2.7"
  - front: CCl₄ vs CHCl₃ polarity
    back: |
      Both tetrahedral. CCl₄ has four identical C–Cl dipoles that cancel: nonpolar. CHCl₃ replaces one Cl with H, so the dipoles no longer cancel: polar. Identical terminal atoms are required for cancellation.
    topic_code: "2.7"
  - front: Hybridization from domain count → sp, sp², sp³
    back: |
      2 domains → sp (linear); 3 → sp² (trigonal planar); 4 → sp³ (tetrahedral). Count domains, not bonded atoms: NH₃ (3 bonds + 1 lone pair) is sp³. The CED does not require hybridizations for 5 or 6 domains.
    topic_code: "2.7"
  - front: σ and π bonds → which bonds contain which
    back: |
      Every bond has exactly one σ bond (density along the axis). A double bond is 1 σ + 1 π; a triple is 1 σ + 2 π (π density above and below the axis, from unhybridised p orbitals).
    topic_code: "2.7"
  - front: Ethene H₂C=CH₂ → σ/π count and hybridization
    back: |
      5 σ (four C–H, one C–C) and 1 π (the second C–C bond). Each carbon has three domains: sp², with one unhybridised p orbital forming the π bond. The molecule is planar.
    topic_code: "2.7"
  - front: HCN → σ/π count and hybridization
    back: |
      2 σ (H–C and C–N) and 2 π (in the triple bond). Carbon has two domains: sp; the two leftover p orbitals form the two π bonds. Linear, 180°.
    topic_code: "2.7"
  - front: Which unhybridised orbitals form π bonds
    back: |
      An sp² atom keeps one p orbital (one π bond possible); an sp atom keeps two p orbitals (two π bonds); an sp³ atom keeps none, so it can form only σ bonds. Hybridization and multiple bonding are tied together.
    topic_code: "2.7"
  - front: Error-spotting → "H₂O is tetrahedral"
    back: |
      Tetrahedral is water's electron-domain geometry (four domains). Its molecular geometry, the shape of the atoms, is bent with a 104.5° angle. The exam asks for molecular geometry unless it says otherwise.
    topic_code: "2.7"
  - front: Which practice? Justifying a bond length from resonance
    back: |
      Practice 6 (argumentation) using practice 1 (Lewis models): claim the bonds are equal and intermediate, cite the equivalent structures and the fractional bond order, and compare with reference single and double lengths.
    topic_code: "2.6"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 2.6 and 2.7: resonance, formal charge, VSEPR
    and hybridization), with about a third reviewing weeks 1 to 6. Multiple choice, select-all, true/false and
    numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the
    long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: bond-length data for nitrogen–oxygen species (2.6, 2.2, 2.7)
    - slug: apchem-u02-w07-q01
      type: multiple_choice
      topic_code: "2.6"
      source: "NIST CCCBDB (bond lengths, rounded)"
      points: 1
      stimulus: |
        | Species | Lewis description | N–O bond length (pm) |
        |---|---|---|
        | NO₃⁻ | N central, three oxygens | 124 (all three bonds) |
        | NO₂⁻ | N central, two oxygens, one lone pair on N | 124 (both bonds) |
        | HNO₃ | N central; one O bonded to H | 121, 121 (to bare O); 141 (to O–H) |
        | Reference | N–O single bond 136; N=O double bond 115 | |
      prompt: |
        Which statement best explains why all three N–O bonds in NO₃⁻ have the same length?
      options:
        - "The ion rapidly switches among three Lewis structures, so the bonds average out over time."
        - "The ion is a resonance hybrid of three equivalent structures; the electrons are delocalised and each bond has a bond order of 1.33."
        - "All three bonds are single bonds, which is why they are the same length."
        - "Nitrogen expands its octet so that all three bonds are double bonds."
      option_explanations:
        - |
          Resonance structures are not states the molecule alternates between; the hybrid is a single, permanent structure.
        - |
          Correct. Three equivalent structures contribute equally, giving each bond order (2 + 1 + 1) ÷ 3 = 1.33 and a length between single (136) and double (115).
        - |
          Three single bonds would be 136 pm; the observed 124 pm is intermediate between single and double.
        - |
          Nitrogen is a period-2 atom and cannot hold more than eight electrons; three double bonds would give it twelve.
      answer: 1
      explanation: |
        Equal, intermediate bond lengths are the experimental signature of resonance.

    - slug: apchem-u02-w07-q02
      type: multiple_choice
      topic_code: "2.6"
      source: "NIST CCCBDB (bond lengths, rounded)"
      points: 1
      stimulus: |
        | Species | Lewis description | N–O bond length (pm) |
        |---|---|---|
        | NO₃⁻ | N central, three oxygens | 124 (all three bonds) |
        | NO₂⁻ | N central, two oxygens, one lone pair on N | 124 (both bonds) |
        | HNO₃ | N central; one O bonded to H | 121, 121 (to bare O); 141 (to O–H) |
        | Reference | N–O single bond 136; N=O double bond 115 | |
      prompt: |
        Why is the N–O bond to the hydroxyl oxygen in HNO₃ (141 pm) longer than the other two N–O bonds (121 pm)?
      options:
        - "The hydrogen atom pulls the oxygen farther from nitrogen."
        - "Nitrogen's lone pair repels the hydroxyl oxygen."
        - "The O–H bond is a double bond, which lengthens the N–O bond."
        - "The oxygen bonded to hydrogen cannot participate in resonance with the other two oxygens, so its bond to nitrogen is a single bond while the other two share a double bond."
      option_explanations:
        - |
          Hydrogen's mass or position has no direct effect on bond length; the difference comes from bond order.
        - |
          In HNO₃ nitrogen has no lone pair; it has three bonding domains (one double, two single in each structure).
        - |
          O–H is a single bond; oxygen cannot form a double bond to hydrogen.
        - |
          Correct. Only the two bare oxygens are equivalent and share the double bond through resonance (bond order 1.5, 121 pm); the O–H oxygen forms a plain single bond to N, longer at 141 pm.
      answer: 3
      explanation: |
        Resonance applies only among equivalent positions; a protonated oxygen drops out of the delocalised set.

    - slug: apchem-u02-w07-q03
      type: multiple_choice
      topic_code: "2.7"
      source: "NIST CCCBDB (bond lengths, rounded)"
      points: 1
      stimulus: |
        | Species | Lewis description | N–O bond length (pm) |
        |---|---|---|
        | NO₃⁻ | N central, three oxygens | 124 (all three bonds) |
        | NO₂⁻ | N central, two oxygens, one lone pair on N | 124 (both bonds) |
        | HNO₃ | N central; one O bonded to H | 121, 121 (to bare O); 141 (to O–H) |
        | Reference | N–O single bond 136; N=O double bond 115 | |
      prompt: |
        Which comparison of the O–N–O bond angles in NO₃⁻ and NO₂⁻ is correct?
      options:
        - "Both are 120° because both nitrogen atoms have three electron domains."
        - "NO₃⁻ is 120° and NO₂⁻ is slightly less than 120°, because the lone pair on nitrogen in NO₂⁻ repels the bonding domains more strongly."
        - "NO₃⁻ is 109.5° and NO₂⁻ is 104.5°, like methane and water."
        - "NO₂⁻ is 180° because it has only two oxygen atoms."
      option_explanations:
        - |
          Both have three domains, but one of NO₂⁻'s is a lone pair, which compresses the bond angle below the ideal 120°.
        - |
          Correct. NO₃⁻ (three bonding domains, no lone pairs) is trigonal planar at 120°; NO₂⁻ (two bonds plus a lone pair) is bent, with the angle closed to about 115°.
        - |
          Those are tetrahedral-based angles for four domains; nitrogen has three domains in both ions.
        - |
          Two bonded atoms plus a lone pair make three domains, not two; the shape is bent, not linear.
      answer: 1
      explanation: |
        Count domains, then let lone pairs compress the angle.

    # ---- Multiple choice (2.6)
    - slug: apchem-u02-w07-q04
      type: multiple_choice
      topic_code: "2.6"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the formal charge on the central oxygen atom in the Lewis diagram of ozone, O=O–O, in which the central oxygen has one lone pair?
      options:
        - "−1"
        - "0"
        - "+1"
        - "+2"
      option_explanations:
        - |
          −1 is the formal charge on the terminal single-bonded oxygen (6 − 6 − 1), not the central one.
        - |
          Zero is the formal charge on the terminal double-bonded oxygen (6 − 4 − 2).
        - |
          Correct. Central O: 6 valence − 2 lone-pair electrons − ½(6 bonding electrons) = 6 − 2 − 3 = +1. The charges +1, 0 and −1 sum to zero, as they must for a neutral molecule.
        - |
          +2 would require only one bond and no lone pairs on the central atom, which is not the diagram described.
      answer: 2
      explanation: |
        Formal charge = valence − nonbonding − ½ bonding; check that the sum equals the species' charge.

    - slug: apchem-u02-w07-q05
      type: multiple_choice
      topic_code: "2.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Two Lewis structures are drawn for the cyanate ion, OCN⁻ (carbon central): structure I, O=C=N with two lone pairs on O and two on N; structure II, O–C≡N with three lone pairs on O and one on N. Which statement about them is correct?
      options:
        - "Structure II is better because it places the −1 formal charge on oxygen, the more electronegative atom, and keeps all charges small."
        - "Structure I is better because every atom has a formal charge of zero."
        - "Structure II is worse because it contains a triple bond."
        - "The structures are equivalent, so they contribute equally."
      option_explanations:
        - |
          Correct. Structure II: O 6 − 6 − 1 = −1, C 0, N 5 − 2 − 3 = 0. Structure I: O 0, C 0, N −1. Both have a single −1, but II puts it on oxygen (3.44) rather than nitrogen (3.04), so II is the major contributor.
        - |
          In structure I nitrogen's formal charge is 5 − 4 − 2 = −1 and oxygen's is 0; not every atom is zero.
        - |
          A triple bond is not a defect; the formal-charge rules, not bond multiplicity, decide which structure matters more.
        - |
          The structures place the double/triple bonds on different atoms and have different formal-charge patterns; they are not equivalent.
      answer: 0
      explanation: |
        For non-equivalent structures: fewest charges, then negative charge on the most electronegative atom.

    - slug: apchem-u02-w07-q06
      type: multiple_choice
      topic_code: "2.6"
      source: "general knowledge"
      points: 1
      prompt: |
        In benzene, C₆H₆, the carbon–carbon bonds are all 140 pm long. Given that a C–C single bond is 154 pm and a C=C double bond is 134 pm, which conclusion is correct?
      options:
        - "Benzene contains three single and three double bonds that happen to be the same length."
        - "Benzene's bonds are all double bonds compressed by the ring."
        - "Each carbon–carbon bond in benzene has a bond order of 1.5, the average of the two resonance structures."
        - "Benzene's bonds are all single bonds shortened by hydrogen."
      option_explanations:
        - |
          If the bonds alternated, they would alternate in length (154 and 134 pm); the observed uniform 140 pm rules that out.
        - |
          Double bonds are 134 pm; 140 pm is longer than a double bond, not shorter.
        - |
          Correct. Two equivalent structures with alternating double bonds average to bond order 1.5 on every bond, intermediate in length between single and double.
        - |
          Single bonds are 154 pm; the observed bonds are considerably shorter, indicating partial double-bond character.
      answer: 2
      explanation: |
        Intermediate, uniform bond lengths are the fingerprint of a resonance hybrid.

    # ---- Multiple choice (2.7)
    - slug: apchem-u02-w07-q07
      type: multiple_choice
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the molecular geometry of the sulfur tetrafluoride molecule, SF₄?
      options:
        - "Tetrahedral"
        - "Square planar"
        - "See-saw"
        - "Trigonal bipyramidal"
      option_explanations:
        - |
          Tetrahedral needs four domains with no lone pairs; sulfur in SF₄ has five domains including a lone pair.
        - |
          Square planar is six domains with two lone pairs (XeF₄); SF₄ has five.
        - |
          Correct. 34 electrons give sulfur four bonds and one lone pair: five domains, trigonal bipyramidal electron geometry, with the lone pair equatorial; the atoms form a see-saw.
        - |
          Trigonal bipyramidal is the electron-domain geometry; the molecular geometry excludes the lone pair.
      answer: 2
      explanation: |
        Five domains, one lone pair (equatorial): see-saw.

    - slug: apchem-u02-w07-q08
      type: multiple_choice
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Which molecule is nonpolar even though it contains polar bonds?
      options:
        - "NH₃"
        - "CHCl₃"
        - "SO₂"
        - "CCl₄"
      option_explanations:
        - |
          NH₃ is trigonal pyramidal; the three N–H dipoles and the lone pair give a net dipole.
        - |
          CHCl₃ is tetrahedral but has non-identical terminal atoms, so the dipoles do not cancel.
        - |
          SO₂ is bent (one lone pair on S); the two S–O dipoles add to a net dipole.
        - |
          Correct. CCl₄ is tetrahedral with four identical polar C–Cl bonds arranged symmetrically, so their dipoles cancel exactly.
      answer: 3
      explanation: |
        Polar bonds plus a symmetric shape with identical terminal atoms gives a nonpolar molecule.

    - slug: apchem-u02-w07-q09
      type: multiple_choice
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the hybridization of the nitrogen atom in ammonia, NH₃, and what is the approximate H–N–H bond angle?
      options:
        - "sp²; 120°"
        - "sp³; about 107°"
        - "sp³; 109.5°"
        - "sp; 180°"
      option_explanations:
        - |
          Nitrogen has four domains (three bonds plus a lone pair), not three; sp² would require a planar nitrogen.
        - |
          Correct. Four domains make nitrogen sp³ (tetrahedral electron geometry); the lone pair compresses the H–N–H angle from 109.5° to about 107°.
        - |
          109.5° is the ideal tetrahedral angle; the lone pair's extra repulsion reduces it.
        - |
          sp and 180° describe a two-domain centre such as the carbon in CO₂.
      answer: 1
      explanation: |
        Count domains (lone pairs included) for hybridization; lone pairs squeeze the angle.

    - slug: apchem-u02-w07-q10
      type: multiple_choice
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        How many σ bonds and how many π bonds are in a molecule of ethyne (acetylene), H–C≡C–H?
      options:
        - "3 σ and 2 π"
        - "2 σ and 3 π"
        - "5 σ and 0 π"
        - "1 σ and 2 π"
      option_explanations:
        - |
          Correct. Two C–H σ bonds and one C–C σ bond make 3 σ; the triple bond's other two components are π bonds.
        - |
          Every bond contains exactly one σ bond, so a molecule with three bonds has three σ bonds, and a triple bond holds only two π.
        - |
          Five σ bonds would require five separate bonds; ethyne has three bonds, one of them triple.
        - |
          The C–H bonds are σ bonds too; there are three σ bonds in all.
      answer: 0
      explanation: |
        Single = 1 σ; double = 1 σ + 1 π; triple = 1 σ + 2 π.

    - slug: apchem-u02-w07-q11
      type: multiple_choice
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Which molecule has a square planar geometry?
      options:
        - "CH₄"
        - "XeF₄"
        - "SF₄"
        - "PF₅"
      option_explanations:
        - |
          CH₄ has four bonding domains and no lone pairs: tetrahedral.
        - |
          Correct. Xenon has four bonds and two lone pairs (36 electrons): six domains, octahedral electron geometry, with the lone pairs opposite each other, leaving the four fluorines in a square plane.
        - |
          SF₄ has five domains with one lone pair: see-saw.
        - |
          PF₅ has five bonding domains: trigonal bipyramidal.
      answer: 1
      explanation: |
        Six domains, two lone pairs: square planar.

    # ---- Review (2.5)
    - slug: apchem-u02-w07-q12
      type: multiple_choice
      topic_code: "2.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Before any geometry can be predicted, a correct Lewis diagram is needed. How many lone pairs are on the central atom in the Lewis diagram of ClF₃ (28 valence electrons)?
      options:
        - "0"
        - "1"
        - "2"
        - "3"
      option_explanations:
        - |
          Three Cl–F bonds use 6 electrons and three lone pairs on each F use 18, leaving 4 electrons that must go on chlorine.
        - |
          One lone pair would account for only 26 electrons; two are left over.
        - |
          Correct. 28 − 6 (bonds) − 18 (fluorine lone pairs) = 4 electrons = 2 lone pairs on Cl, giving it 10 electrons (an expanded octet) and five domains, a T-shaped molecule.
        - |
          Three lone pairs would require 30 electrons; ClF₃ has 28.
      answer: 2
      explanation: |
        Review of 2.5: the leftover electrons after terminal octets go on the central atom, and they decide the shape.

    # ---- Multi-select
    - slug: apchem-u02-w07-q13
      type: multi_select
      topic_code: "2.7"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following molecules are polar? Select all that apply.
      options:
        - "H₂O"
        - "CO₂"
        - "PF₃"
        - "BF₃"
        - "CH₂Cl₂"
      option_explanations:
        - |
          Correct. Bent, with two polar O–H bonds whose dipoles add.
        - |
          Linear with two equal, opposite C=O dipoles: nonpolar.
        - |
          Correct. Trigonal pyramidal (a lone pair on P); the P–F dipoles do not cancel.
        - |
          Trigonal planar with three identical B–F bonds: the dipoles cancel, nonpolar.
        - |
          Correct. Tetrahedral but with two H and two Cl, so the bond dipoles do not cancel.
      answer: [0, 2, 4]
      explanation: |
        Polar bonds plus a shape that fails to cancel them: lone pairs on the centre or non-identical terminal atoms.

    - slug: apchem-u02-w07-q14
      type: multi_select
      topic_code: "2.1"
      source: "general knowledge"
