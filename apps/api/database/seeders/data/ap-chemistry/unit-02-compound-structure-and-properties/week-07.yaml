    # ---- True / false
    - slug: apchem-u02-w07-q15
      type: true_false
      topic_code: "2.5"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: In the Lewis diagram of BF₃, boron has only six electrons, and this is accepted because boron does not need an octet.
      answer: true
      explanation: |
        True. BF₃ has 24 electrons: three B–F bonds and three lone pairs on each F. Boron is an accepted exception with six electrons; it is trigonal planar (sp²) and readily accepts an electron pair from a donor.

    - slug: apchem-u02-w07-q16
      type: true_false
      topic_code: "1.7"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: When two non-equivalent resonance structures each carry a single −1 formal charge, the one that places the charge on the more electronegative atom is the greater contributor, because that atom holds extra electron density more comfortably.
      answer: true
      explanation: |
        True. Electronegativity (the periodic trend from Unit 1) measures how strongly an atom attracts electrons; a negative formal charge is most stable on the atom that attracts electrons most, which is why O=C=N⁻ is outweighed by ⁻O–C≡N in cyanate.

