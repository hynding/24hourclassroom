    # ---- Short answer
    - slug: apchem-u02-w07-q22
      type: short_answer
      topic_code: "2.6"
      source: "general knowledge"
      points: 3
      prompt: |
        Consider the nitrite ion, NO₂⁻. Answer (a), (b) and (c).

        (a) Describe the two resonance structures of NO₂⁻ in words, including the lone pairs on each atom.
        (b) Calculate the formal charge on each atom in one of the structures and show that the charges sum to −1.
        (c) The two N–O bonds in nitrite are each 124 pm, while the N–O bonds in NO₃⁻ are also 124 pm and the N=O bond in NO⁺ is 106 pm. Explain why nitrite's bonds are much longer than the bond in NO⁺.
      answer: |
        (a) 18 electrons, N central. Structure 1: N=O on the left (two lone pairs on that O), N–O on the right (three lone pairs on that O), one lone pair on N. Structure 2: the same with the double bond on the right oxygen. Brackets, charge 1−.
        (b) Structure 1: double-bonded O: 6 − 4 − 2 = 0. Nitrogen: 5 − 2 − ½(6) = 0. Single-bonded O: 6 − 6 − 1 = −1. Sum = 0 + 0 + (−1) = −1, the ion's charge.
        (c) Nitrite's N–O bonds are a resonance average of one double and one single bond, bond order 1.5, so each is intermediate in length. NO⁺ has a full triple bond (bond order 3, 10 electrons: N≡O⁺ with a lone pair on each atom), and higher bond order means a shorter, stronger bond.
      explanation: |
        Three points, one per part.

        (a) 1 pt: both structures described correctly with lone pairs (N 1, double-bonded O 2, single-bonded O 3).

        (b) 1 pt: all three formal charges correct and the sum shown to be −1.

        (c) 1 pt: nitrite bond order 1.5 versus NO⁺ bond order 3 (or at least "triple bond"), with the link between bond order and length.

    - slug: apchem-u02-w07-q23
      type: short_answer
      topic_code: "2.7"
      source: "general knowledge"
      points: 3
      prompt: |
        Consider the molecules CF₄ and SF₄. Answer (a), (b) and (c).

        (a) Determine the number of electron domains around the central atom in each molecule and name the molecular geometry of each.
        (b) Predict whether each molecule is polar or nonpolar and justify your predictions.
        (c) Explain why sulfur can form SF₄ but carbon cannot form a stable CF₄ with an additional lone pair on carbon (that is, why there is no analogous see-saw carbon compound).
      answer: |
        (a) CF₄: carbon has four bonding domains and no lone pairs: tetrahedral. SF₄: sulfur has four bonding domains and one lone pair, five domains: see-saw (trigonal bipyramidal electron geometry with the lone pair equatorial).
        (b) CF₄ is nonpolar: the four identical C–F dipoles are arranged symmetrically in a tetrahedron and cancel. SF₄ is polar: the lone pair and the see-saw arrangement make the S–F dipoles unsymmetrical, so they do not cancel and the molecule has a net dipole.
        (c) Carbon is in period 2 and has only 2s and 2p orbitals, which hold at most eight electrons; four bonds already fill its octet, so it cannot accommodate a fifth domain. Sulfur is in period 3 and has empty 3d orbitals available, so it can hold ten electrons (an expanded octet) and support five domains.
      explanation: |
        Three points, one per part.

        (a) 1 pt: 4 domains/tetrahedral for CF₄ and 5 domains (one lone pair)/see-saw for SF₄.

        (b) 1 pt: CF₄ nonpolar by symmetric cancellation; SF₄ polar because the lone pair breaks the symmetry.

        (c) 1 pt: octet limit for period-2 carbon versus the expanded octet available to period-3 sulfur (d orbitals).

    # ---- Long answer
    - slug: apchem-u02-w07-q24
      type: long_answer
      topic_code: "2.7"
      source: "general knowledge"
      points: 6
      stimulus: |
        Formaldehyde, H₂C=O, and methanol, CH₃OH, are both small molecules containing carbon, hydrogen and oxygen. Formaldehyde has a molar mass of 30.03 g/mol and methanol 32.04 g/mol.
      prompt: |
        (a) Describe the Lewis diagram of each molecule in words, giving the bonds and the lone pairs.
        (b) For formaldehyde, give the molecular geometry around carbon, the approximate H–C–H bond angle, and the hybridization of the carbon atom.
        (c) For methanol, give the molecular geometry around carbon and around oxygen, and the hybridization of each.
        (d) Count the σ and π bonds in each molecule.
        (e) Both molecules are polar. Identify the direction of the net dipole in formaldehyde and explain, using bond polarity and geometry, why the molecule is polar.
      answer: |
        (a) Formaldehyde (12 electrons): carbon central, two C–H single bonds, one C=O double bond; oxygen carries two lone pairs; carbon and hydrogen carry none. Methanol (14 electrons): carbon bonded to three H and to O by single bonds; O bonded to C and to H; two lone pairs on oxygen.

        (b) Carbon in formaldehyde has three electron domains (two C–H, one C=O): trigonal planar molecular geometry, bond angles about 120° (the H–C–H angle is slightly less, about 116°, because the double bond occupies more space), hybridization sp².

        (c) Methanol's carbon has four bonding domains: tetrahedral, sp³, angles about 109.5°. Its oxygen has two bonds and two lone pairs: four domains, bent geometry around oxygen (C–O–H about 109°, slightly compressed), hybridization sp³.

        (d) Formaldehyde: 3 σ (two C–H, one C–O) and 1 π (the second C=O bond). Methanol: 5 σ (three C–H, one C–O, one O–H) and 0 π.

        (e) The C=O bond is strongly polar (ΔEN 0.89) with oxygen δ−, and the C–H bonds are nearly nonpolar. In the trigonal planar molecule the two C–H dipoles are small and point away from oxygen, so nothing cancels the C=O dipole; the net dipole points from the CH₂ end toward the oxygen atom. The molecule is polar because its bond dipoles do not cancel in that geometry.
      explanation: |
        Six points.

        (a) 1 pt: both Lewis diagrams correct (bonds and lone pairs on oxygen).

        (b) 1 pt: trigonal planar, about 120°, sp².

        (c) 1 pt: tetrahedral/sp³ at carbon and bent/sp³ at oxygen.

        (d) 1 pt: 3 σ + 1 π for formaldehyde and 5 σ + 0 π for methanol.

        (e) 2 pts: 1 pt for the direction of the dipole (toward oxygen); 1 pt for the reasoning that the polar C=O dipole is not cancelled by the weak C–H dipoles in the trigonal planar geometry.
