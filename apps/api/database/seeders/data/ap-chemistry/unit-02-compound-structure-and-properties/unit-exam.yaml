unit: 2
description: |
  40 questions · about 75 minutes · every topic of Unit 2 (2.1 to 2.7): bond types, potential energy of bonds,
  ionic solids, metals and alloys, Lewis diagrams, resonance and formal charge, VSEPR and hybridization, with
  review of Unit 1. Three data-based sets in the AP style (a potential-energy table, a property table of solids
  and a Lewis-structure set), select-all, true/false, fill-in-the-blank and numeric items, two short-answer
  questions (3 points each) and one long free-response question (6 points). Multiple choice, select-all,
  true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the
  free-response items are graded by your teacher against the scoring notes. Calculator and periodic table allowed.
questions:
  # ---- Stimulus set A: bond data for carbon–nitrogen bonds (2.2, 2.6, 2.7)
  - slug: apchem-u02-exam-q01
    type: multiple_choice
    topic_code: "2.2"
    source: "NIST Chemistry WebBook and CCCBDB (bond data, rounded)"
    points: 1
    stimulus: |
      | Bond | Bond length (pm) | Bond energy (kJ/mol) |
      |---|---|---|
      | C–N | 147 | 305 |
      | C=N | 128 | 615 |
      | C≡N | 116 | 887 |
    prompt: |
      Which statement is best supported by the data in the table?
    options:
      - "Bond energy is directly proportional to bond length."
      - "As the number of shared electron pairs increases, the bond becomes shorter and stronger."
      - "A triple bond is exactly three times as strong as a single bond."
      - "Bond length is independent of bond order."
    option_explanations:
      - |
        Energy rises as length falls; the relationship is inverse, not direct.
      - |
        Correct. From single to double to triple the length drops (147 → 128 → 116 pm) while the energy climbs (305 → 615 → 887 kJ/mol); more electron density between the nuclei pulls them closer and binds them harder.
      - |
        887 ÷ 305 = 2.9, close to but less than 3; the π bonds add less than the σ bond does.
      - |
        The table shows length changing by 31 pm across the three bond orders.
    answer: 1
    explanation: |
      Bond order up, length down, energy up.

  - slug: apchem-u02-exam-q02
    type: multiple_choice
    topic_code: "2.6"
    source: "NIST Chemistry WebBook and CCCBDB (bond data, rounded)"
    points: 1
    stimulus: |
      | Bond | Bond length (pm) | Bond energy (kJ/mol) |
      |---|---|---|
      | C–N | 147 | 305 |
      | C=N | 128 | 615 |
      | C≡N | 116 | 887 |
    prompt: |
      The C–N bond in the thiocyanate ion, SCN⁻, is measured at about 117 pm. Which conclusion about the ion's resonance structures is most consistent with this value?
    options:
      - "The structure S–C≡N is the dominant contributor, with some contribution from S=C=N."
      - "The structure S≡C–N is the dominant contributor."
      - "All three resonance structures contribute equally."
      - "The ion has a C–N single bond."
    option_explanations:
      - |
        Correct. 117 pm is almost the triple-bond length (116 pm), so the structure with C≡N (S–C≡N) must dominate, with S=C=N (C=N at 128 pm) contributing less; formal charge places −1 on S in the first and on N in the second.
      - |
        S≡C–N would give a C–N single bond near 147 pm and carries large formal charges (S +1, N −2); it is negligible.
      - |
        Equal contributions would put the length between single and triple, near 128–130 pm, not 117.
      - |
        A single bond is 147 pm, 30 pm longer than observed.
    answer: 0
    explanation: |
      Measured bond lengths tell you which resonance structure weighs most.

  - slug: apchem-u02-exam-q03
    type: multiple_choice
    topic_code: "2.7"
    source: "NIST Chemistry WebBook and CCCBDB (bond data, rounded)"
    points: 1
    stimulus: |
      | Bond | Bond length (pm) | Bond energy (kJ/mol) |
      |---|---|---|
      | C–N | 147 | 305 |
      | C=N | 128 | 615 |
      | C≡N | 116 | 887 |
    prompt: |
      In hydrogen cyanide, HCN, the carbon atom forms the C≡N bond. Which set of descriptions of the carbon atom is correct?
    options:
      - "Four electron domains; sp³; 109.5°"
      - "Three electron domains; sp²; 120°"
      - "Two electron domains; sp; 180°"
      - "Two electron domains; sp²; 180°"
    option_explanations:
      - |
        Carbon bonds to only two atoms with no lone pairs; it has two domains, not four.
      - |
        Three domains would require a lone pair or a third atom; HCN's carbon has neither.
      - |
        Correct. One H–C σ bond and one C≡N (one σ, two π) are two domains: linear, sp hybridised, with two unhybridised p orbitals for the two π bonds.
      - |
        Two domains correspond to sp hybridization, not sp².
    answer: 2
    explanation: |
      Domains → geometry → hybridization: 2, linear, sp.

  # ---- Multiple choice (2.1, 2.2)
  - slug: apchem-u02-exam-q04
    type: multiple_choice
    topic_code: "2.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which pair of elements would be expected to form a compound with the greatest ionic character?
    options:
      - "C and O"
      - "N and H"
      - "Cs and F"
      - "Si and Cl"
    option_explanations:
      - |
        Two nonmetals with ΔEN 0.89: polar covalent.
      - |
        Two nonmetals with ΔEN 0.84: polar covalent.
      - |
        Correct. Cesium (0.79, a metal with the lowest ionization energy of the common elements) and fluorine (3.98) have ΔEN 3.19, the largest difference possible; CsF is as ionic as a compound gets.
      - |
        Both nonmetals, ΔEN 1.26: polar covalent (SiCl₄ is a molecular liquid).
    answer: 2
    explanation: |
      Far-left metal plus far-right nonmetal: maximum electronegativity difference.

  - slug: apchem-u02-exam-q05
    type: multiple_choice
    topic_code: "2.1"
    source: "general knowledge"
    points: 1
    prompt: |
      In the polar covalent bond between hydrogen and oxygen in water, which statement is correct?
    options:
      - "The shared electrons spend more time near hydrogen, giving hydrogen a partial negative charge."
      - "The electrons are transferred completely from hydrogen to oxygen, forming H⁺ and O²⁻."
      - "The shared electrons spend more time near oxygen, giving oxygen a partial negative charge and hydrogen a partial positive charge."
      - "The electrons are shared equally because both atoms are nonmetals."
    option_explanations:
      - |
        Oxygen (3.44) is more electronegative than hydrogen (2.20), so the electrons favour oxygen.
      - |
        ΔEN = 1.24 is far from complete transfer; water is molecular, not ionic.
      - |
        Correct. Unequal sharing puts δ− on oxygen and δ+ on each hydrogen; this bond polarity is what makes water a polar molecule.
      - |
        Both are nonmetals, so the bond is covalent, but a difference of 1.24 makes the sharing clearly unequal.
    answer: 2
    explanation: |
      Polar covalent: shared, but unequally.

  - slug: apchem-u02-exam-q06
    type: multiple_choice
    topic_code: "2.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Graph description: A potential-energy curve for two atoms has its minimum at an internuclear distance of 154 pm and an energy of −348 kJ/mol. Which statement about the pair of atoms is correct?
    options:
      - "The bond length is 348 pm and the bond energy is 154 kJ/mol."
      - "At 100 pm the pair has a lower energy than at 154 pm."
      - "Separating the atoms completely from 154 pm requires 348 kJ/mol."
      - "The atoms are most stable at an infinite separation, where the energy is zero."
    option_explanations:
      - |
        The axes are swapped: the x-coordinate of the minimum (154 pm) is the length and the depth (348 kJ/mol) is the energy.
      - |
        At 100 pm, left of the minimum, nuclear repulsion raises the energy well above −348 kJ/mol.
      - |
        Correct. The bond energy is the depth of the well: 348 kJ must be supplied per mole to pull the atoms apart to zero interaction.
      - |
        Zero is the reference, not the most stable state; the pair is 348 kJ/mol more stable at the bond length.
    answer: 2
    explanation: |
      Bond energy is the climb from the minimum to zero.

  - slug: apchem-u02-exam-q07
    type: multiple_choice
    topic_code: "2.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Which pair of atoms would be expected to have the longest bond?
    options:
      - "H and F"
      - "C and C (triple bond)"
      - "C and I"
      - "O and O (double bond)"
    option_explanations:
      - |
        Two small atoms: 92 pm, among the shortest bonds there are.
      - |
        A triple bond between small atoms, 120 pm.
      - |
        Correct. Iodine is a large period-5 atom, and the bond is single: about 214 pm, far longer than any bond between period-2 atoms.
      - |
        A double bond between small atoms, 121 pm.
    answer: 2
    explanation: |
      Large atoms and low bond order make long bonds.

  # ---- Stimulus set B: properties of four solids (2.3, 2.4, 2.1)
  - slug: apchem-u02-exam-q08
    type: multiple_choice
    topic_code: "2.3"
    source: "general knowledge"
    points: 1
    stimulus: |
      | Solid | Melting point (°C) | Conducts as solid? | Conducts as liquid? | Soluble in water? |
      |---|---|---|---|---|
      | A | 2825 | no | yes | slightly |
      | B | 660 | yes | yes | no |
      | C | 801 | no | yes | yes |
      | D | 0 | no | no | (is water) |
    prompt: |
      Which solid is most likely magnesium oxide, MgO?
    options:
      - "A"
      - "B"
      - "C"
      - "D"
    option_explanations:
      - |
        Correct. An ionic solid with 2+ and 2− ions has a very high melting point (MgO 2825 °C), does not conduct until molten, and is only slightly soluble; A fits.
      - |
        B conducts as a solid, the mark of a metal (aluminum melts at 660 °C).
      - |
        C is ionic (conducts only molten, soluble) but its melting point of 801 °C matches a 1+/1− salt such as NaCl, far below MgO.
      - |
        D is a molecular solid that never conducts; its melting point of 0 °C identifies ice.
    answer: 0
    explanation: |
      Charge magnitude sets the melting point among ionic solids.

  - slug: apchem-u02-exam-q09
    type: multiple_choice
    topic_code: "2.4"
    source: "general knowledge"
    points: 1
    stimulus: |
      | Solid | Melting point (°C) | Conducts as solid? | Conducts as liquid? | Soluble in water? |
      |---|---|---|---|---|
      | A | 2825 | no | yes | slightly |
      | B | 660 | yes | yes | no |
      | C | 801 | no | yes | yes |
      | D | 0 | no | no | (is water) |
    prompt: |
      Which statement best explains why solid B conducts electricity while solids A and C do not?
    options:
      - "B contains mobile ions in its lattice; A and C do not."
      - "B is a covalent network solid with shared electrons."
      - "B has a lower melting point, so its particles are freer to move."
      - "B's valence electrons are delocalised throughout the solid and can move; in A and C the electrons are localised on ions fixed in place."
    option_explanations:
      - |
        Ions in a solid lattice are not mobile in any of the solids; B's carriers are electrons.
      - |
        Network covalent solids (diamond, quartz) generally do not conduct; B's conductivity marks a metal.
      - |
        Melting point does not determine solid-state conductivity; C melts lower than A yet neither conducts as a solid.
      - |
        Correct. B is a metal (electron-sea model). In the ionic solids A and C, electrons are held on individual ions and the ions cannot move until the solid melts.
    answer: 3
    explanation: |
      Solid-state conductivity needs mobile electrons: metals.

  - slug: apchem-u02-exam-q10
    type: multiple_choice
    topic_code: "2.1"
    source: "general knowledge"
    points: 1
    stimulus: |
      | Solid | Melting point (°C) | Conducts as solid? | Conducts as liquid? | Soluble in water? |
      |---|---|---|---|---|
      | A | 2825 | no | yes | slightly |
      | B | 660 | yes | yes | no |
      | C | 801 | no | yes | yes |
      | D | 0 | no | no | (is water) |
    prompt: |
      What type of bonding holds the particles together within solid D, and what type of attraction holds the particles to one another in the solid?
    options:
      - "Ionic bonds within the particles; ionic bonds between them"
      - "Metallic bonds within the particles; electron sea between them"
      - "Polar covalent bonds within each molecule; weaker attractions between molecules"
      - "Nonpolar covalent bonds within each molecule; no attraction between molecules"
    option_explanations:
      - |
        Water is molecular, not ionic; it does not conduct even as a liquid (pure water).
      - |
        Water is not a metal; it does not conduct as a solid.
      - |
        Correct. Each H₂O molecule is held together by polar covalent O–H bonds; the molecules attract one another by much weaker intermolecular forces, which is why ice melts at 0 °C.
      - |
        O–H bonds are polar (ΔEN 1.24), and there must be some attraction between molecules or water would not be a solid at all.
    answer: 2
    explanation: |
      Molecular solids: strong bonds inside, weak forces between.

  # ---- Multiple choice (2.3, 2.4)
  - slug: apchem-u02-exam-q11
    type: multiple_choice
    topic_code: "2.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Which best explains why ionic crystals are brittle?
    options:
      - "A small displacement of one layer brings ions of like charge next to each other, and the repulsion splits the crystal."
      - "The ionic bonds are weak and break easily."
      - "The ions are too large to pack efficiently."
      - "The electrons between the ions are easily removed."
    option_explanations:
      - |
        Correct. Shifting a layer by one ion spacing aligns cation with cation and anion with anion; the like-charge repulsion fractures the crystal along that plane.
      - |
        Ionic attractions are strong (hence the high melting points); brittleness is about what happens when layers shift, not weakness.
      - |
        Packing efficiency has no bearing on brittleness; NaCl packs very efficiently.
      - |
        Electrons in an ionic solid are localised on the ions and are not involved in fracture.
    answer: 0
    explanation: |
      The shifted-layer argument is the standard explanation.

  - slug: apchem-u02-exam-q12
    type: multiple_choice
    topic_code: "2.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Sterling silver is 92.5% silver and 7.5% copper by mass. Given atomic radii of Ag 144 pm and Cu 128 pm, which description is correct?
    options:
      - "An interstitial alloy; copper atoms fit between silver atoms, making the alloy softer."
      - "A substitutional alloy that is softer than pure silver because copper is softer."
      - "An ionic compound of Ag⁺ and Cu⁻."
      - "A substitutional alloy; copper atoms replace silver atoms in the lattice, making the alloy harder than pure silver."
    option_explanations:
      - |
        Copper's radius is only 11% smaller than silver's, too large to fit in the gaps; and alloying hardens, not softens.
      - |
        The hardness of the alloy comes from lattice disruption, not from the hardness of the added element; sterling silver is harder than pure silver.
      - |
        Two metals bond metallically; no anion of copper exists.
      - |
        Correct. Similar radii make it substitutional; the differently sized copper atoms disrupt the slip planes, which is why sterling is harder and more durable than pure silver.
    answer: 3
    explanation: |
      Similar radii: substitutional; alloys are harder than their parent metals.

  # ---- Stimulus set C: Lewis structures of sulfur dioxide (2.5, 2.6, 2.7)
  - slug: apchem-u02-exam-q13
    type: multiple_choice
    topic_code: "2.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      Two students draw Lewis diagrams for sulfur dioxide, SO₂ (18 valence electrons). Student 1 draws O=S–O with one lone pair on S, two lone pairs on the double-bonded O and three on the single-bonded O. Student 2 draws O=S=O with one lone pair on S and two lone pairs on each O.
    prompt: |
      Which statement about the two diagrams is correct?
    options:
      - "Only student 1's diagram uses the correct number of electrons."
      - "Only student 2's diagram uses the correct number of electrons."
      - "Both diagrams use 18 electrons; student 1's obeys the octet rule for sulfur and student 2's gives sulfur an expanded octet of 10 electrons."
      - "Both diagrams are wrong because sulfur cannot form double bonds."
    option_explanations:
      - |
        Student 2's diagram also totals 18: two double bonds (8), one lone pair on S (2), two lone pairs on each O (8).
      - |
        Student 1's diagram also totals 18: 6 (bonds) + 2 (S) + 4 (double-bonded O) + 6 (single-bonded O).
      - |
        Correct. Both are legitimate; sulfur (period 3) may expand its octet, and the second diagram has lower formal charges (all zero), while the first obeys the octet rule and has a resonance partner.
      - |
        Sulfur forms double bonds readily (SO₂, SO₃, sulfate); both drawings are acceptable representations.
    answer: 2
    explanation: |
      Period-3 central atoms allow two valid diagrams; formal charge favours the expanded one, the octet rule the other.

  - slug: apchem-u02-exam-q14
    type: multiple_choice
    topic_code: "2.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      Two students draw Lewis diagrams for sulfur dioxide, SO₂ (18 valence electrons). Student 1 draws O=S–O with one lone pair on S, two lone pairs on the double-bonded O and three on the single-bonded O. Student 2 draws O=S=O with one lone pair on S and two lone pairs on each O.
    prompt: |
      What are the formal charges on sulfur and on the single-bonded oxygen in student 1's diagram?
    options:
      - "S = 0; O = 0"
      - "S = −1; O = +1"
      - "S = +1; O = −1"
      - "S = +2; O = −2"
    option_explanations:
      - |
        Zero on every atom is student 2's diagram, where sulfur has two double bonds.
      - |
        The signs are reversed; sulfur has fewer electrons assigned than its valence count, so it is positive.
      - |
        Correct. S: 6 − 2 − ½(6) = +1. Single-bonded O: 6 − 6 − ½(2) = −1. Double-bonded O: 0. Sum = 0 for the neutral molecule.
      - |
        These magnitudes would need sulfur with one bond and no lone pairs, not the diagram described.
    answer: 2
    explanation: |
      Formal charge = valence − lone-pair electrons − bonds.

  - slug: apchem-u02-exam-q15
    type: multiple_choice
    topic_code: "2.7"
    source: "general knowledge"
    points: 1
    stimulus: |
      Two students draw Lewis diagrams for sulfur dioxide, SO₂ (18 valence electrons). Student 1 draws O=S–O with one lone pair on S, two lone pairs on the double-bonded O and three on the single-bonded O. Student 2 draws O=S=O with one lone pair on S and two lone pairs on each O.
    prompt: |
      Regardless of which diagram is used, what are the molecular geometry and polarity of SO₂?
    options:
      - "Linear; nonpolar"
      - "Bent; polar"
      - "Trigonal planar; nonpolar"
      - "Bent; nonpolar"
    option_explanations:
      - |
        Sulfur has three domains (two bonds and a lone pair), not two; the molecule is not linear.
      - |
        Correct. Three domains with one lone pair give a bent shape (about 119°); the two polar S–O dipoles do not cancel in a bent molecule, so SO₂ is polar.
      - |
        Trigonal planar is the electron-domain geometry; with a lone pair the molecular geometry is bent.
      - |
        A bent molecule with polar bonds has a net dipole; it cannot be nonpolar.
    answer: 1
    explanation: |
      Both diagrams give sulfur three domains; shape and polarity do not depend on the choice.

  # ---- Multiple choice (2.5, 2.6, 2.7)
  - slug: apchem-u02-exam-q16
    type: multiple_choice
    topic_code: "2.5"
    source: "general knowledge"
    points: 1
    prompt: |
      How many lone pairs are on the central atom in the Lewis diagram of xenon difluoride, XeF₂ (22 valence electrons)?
    options:
      - "0"
      - "1"
      - "2"
      - "3"
    option_explanations:
      - |
        Two Xe–F bonds (4) and three lone pairs on each F (12) account for 16 electrons; 6 remain for xenon.
      - |
        One lone pair would account for 18 electrons, four short of 22.
      - |
        Two lone pairs account for 20 electrons; two remain.
      - |
        Correct. 22 − 4 − 12 = 6 electrons = three lone pairs on Xe, giving it 10 electrons and five domains; the molecule is linear.
    answer: 3
    explanation: |
      Leftover electrons go on the central atom, which may expand its octet.

  - slug: apchem-u02-exam-q17
    type: multiple_choice
    topic_code: "2.6"
    source: "general knowledge"
    points: 1
    prompt: |
      Which species has resonance structures that are all equivalent, so that every bond to the central atom has the same length?
    options:
      - "HCO₂⁻ (formate, both oxygens bonded only to carbon)"
      - "HNO₃"
      - "HCN"
      - "CH₃COOH"
    option_explanations:
      - |
        Correct. Formate's two oxygens are equivalent; two resonance structures place the C=O on either, so both C–O bonds have order 1.5 and equal length (127 pm).
      - |
        In nitric acid one oxygen carries the hydrogen and does not share in the resonance; its N–O bond is longer than the other two.
      - |
        HCN has a single Lewis structure with a C≡N triple bond; no resonance.
      - |
        Acetic acid's two oxygens are not equivalent (one is bonded to H), so its C=O and C–O bonds differ in length.
    answer: 0
    explanation: |
      Equivalent positions give equivalent resonance structures and identical bonds.

  - slug: apchem-u02-exam-q18
    type: multiple_choice
    topic_code: "2.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Which molecule has bond angles closest to 109.5°?
    options:
      - "BF₃"
      - "H₂S"
      - "SiH₄"
      - "CO₂"
    option_explanations:
      - |
        BF₃ has three domains: trigonal planar, 120°.
      - |
        H₂S has four domains but two are lone pairs, which compress the angle to about 92°.
      - |
        Correct. Silicon has four bonding domains and no lone pairs: a regular tetrahedron with 109.5° angles.
      - |
        CO₂ has only two electron domains on carbon, so it is linear with a 180° bond angle, nowhere near 109.5°.
    answer: 2
    explanation: |
      Four bonding domains and no lone pairs give the ideal tetrahedral angle.

  - slug: apchem-u02-exam-q19
    type: multiple_choice
    topic_code: "2.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Phosphorus trichloride, PCl₃, is polar while boron trichloride, BCl₃, is nonpolar. The best explanation is that
    options:
      - "P–Cl bonds are polar and B–Cl bonds are not."
      - "BCl₃ contains ionic bonds, which have no dipole."
      - "phosphorus is more electronegative than boron."
      - "PCl₃ is trigonal pyramidal because of a lone pair on phosphorus, so its bond dipoles do not cancel; BCl₃ is trigonal planar and its three dipoles cancel."
    option_explanations:
      - |
        Both bonds are polar (ΔEN 0.97 and 1.12); the difference is in the geometry.
      - |
        BCl₃ is a covalent molecule (boron and chlorine are nonmetals); it is nonpolar because of symmetry.
      - |
        Phosphorus is more electronegative (2.19 vs 2.04), but that makes the B–Cl bonds more polar, not less; the shape decides.
      - |
        Correct. Phosphorus has four domains (three bonds, one lone pair) giving a pyramid with a net dipole; boron has three bonding domains and no lone pair, giving a flat, symmetric molecule.
    answer: 3
    explanation: |
      A lone pair on the central atom usually breaks the symmetry that cancels bond dipoles.

  - slug: apchem-u02-exam-q20
    type: multiple_choice
    topic_code: "2.7"
    source: "general knowledge"
    points: 1
    prompt: |
      In the acetic acid molecule, CH₃COOH, what are the hybridizations of the methyl carbon (CH₃) and the carboxyl carbon (COOH)?
    options:
      - "sp³ and sp²"
      - "sp³ and sp³"
      - "sp² and sp²"
      - "sp² and sp"
    option_explanations:
      - |
        Correct. The methyl carbon has four single bonds (four domains, sp³); the carboxyl carbon has one C=O, one C–O and one C–C (three domains, sp², trigonal planar).
      - |
        The carboxyl carbon has a double bond to oxygen and only three domains, so it is not sp³.
      - |
        The methyl carbon has four bonding domains; four domains are sp³.
      - |
        sp requires two domains; neither carbon in acetic acid has only two.
    answer: 0
    explanation: |
      Count domains on each atom separately.

  - slug: apchem-u02-exam-q21
    type: multiple_choice
    topic_code: "2.7"
    source: "general knowledge"
    points: 1
    prompt: |
      How many π bonds are in a molecule of carbon dioxide, and in which orbitals do they form?
    options:
      - "One π bond, formed from sp hybrid orbitals on carbon"
      - "Two π bonds, formed from the two unhybridised p orbitals on the sp-hybridised carbon"
      - "Two π bonds, formed from sp² hybrid orbitals on carbon"
      - "No π bonds, because carbon has no lone pairs"
    option_explanations:
      - |
        Each C=O contributes one π bond, so there are two; and π bonds form from unhybridised p orbitals, not hybrids.
      - |
        Correct. Carbon (two domains) is sp; its two remaining p orbitals, perpendicular to each other, each overlap sideways with an oxygen p orbital to make the two π bonds.
      - |
        Hybrid orbitals form σ bonds; π bonds use leftover p orbitals, and carbon in CO₂ is sp, not sp².
      - |
        Lone pairs are irrelevant; the two double bonds each contain a π bond.
    answer: 1
    explanation: |
      σ bonds use hybrids; π bonds use the p orbitals left unhybridised.

  # ---- Review (Unit 1)
  - slug: apchem-u02-exam-q22
    type: multiple_choice
    topic_code: "1.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Which trend from Unit 1 is the direct basis for deciding whether a bond is polar?
    options:
      - "The increase in atomic radius down a group"
      - "The decrease in ionization energy down a group"
      - "The increase in electronegativity across a period and up a group"
      - "The increase in successive ionization energies"
    option_explanations:
      - |
        Radius affects bond length, not which atom attracts the shared pair.
      - |
        Ionization energy explains which elements form cations, not the polarity of a shared pair.
      - |
        Correct. Bond polarity is the unequal sharing caused by an electronegativity difference; the periodic trend tells you which atom is δ−.
      - |
        Successive ionization energies reveal valence-electron counts, not bond polarity.
    answer: 2
    explanation: |
      Electronegativity difference is the measure of bond polarity.

  - slug: apchem-u02-exam-q23
    type: multiple_choice
    topic_code: "1.5"
    source: "general knowledge"
    points: 1
    prompt: |
      A neutral atom has the ground-state configuration 1s² 2s² 2p⁶ 3s² 3p⁴. How many valence electrons does it contribute to a Lewis diagram, and how many bonds does it most commonly form?
    options:
      - "4 electrons; 4 bonds"
      - "6 electrons; 2 bonds"
      - "8 electrons; 0 bonds"
      - "16 electrons; 6 bonds"
    option_explanations:
      - |
        The 3s² 3p⁴ valence shell holds six electrons, not four.
      - |
        Correct. Sulfur has six valence electrons (3s² 3p⁴) and most commonly forms two bonds to reach an octet (H₂S), though it can expand to four or six (SF₄, SF₆).
      - |
        Eight valence electrons would be a noble gas; this atom is two short of an octet.
      - |
        Sixteen is the total electron count; only the outer-shell six are valence electrons.
    answer: 1
    explanation: |
      Valence electrons = electrons beyond the noble-gas core.

  - slug: apchem-u02-exam-q24
    type: multiple_choice
    topic_code: "1.1"
    source: "general knowledge"
    points: 1
    prompt: |
      A sample of ammonia gas, NH₃ (17.04 g/mol), has a mass of 8.52 g. How many N–H σ bonds does the sample contain?
    options:
      - "3.01 × 10²³"
      - "9.03 × 10²³"
      - "1.51 × 10²³"
      - "6.02 × 10²³"
    option_explanations:
      - |
        3.01 × 10²³ is the number of molecules; each has three bonds.
      - |
        Correct. 8.52 ÷ 17.04 = 0.500 mol = 3.01 × 10²³ molecules; three N–H σ bonds each gives 9.03 × 10²³.
      - |
        1.51 × 10²³ would be 0.25 mol of molecules; the sample is 0.500 mol.
      - |
        6.02 × 10²³ would be one mole of bonds, but the sample contains 1.50 mol of bonds.
    answer: 1
    explanation: |
      Moles of molecules × bonds per molecule × Avogadro's number.

  # ---- Multi-select
  - slug: apchem-u02-exam-q25
    type: multi_select
    topic_code: "2.1"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which of the following substances are held together primarily by ionic bonding? Select all that apply.
    options:
      - "CaF₂"
      - "SO₃"
      - "NH₄Cl"
      - "Fe"
      - "K₂O"
    option_explanations:
      - |
        Correct. Calcium (metal) and fluorine (nonmetal): Ca²⁺ and F⁻ in a lattice.
      - |
        Two nonmetals sharing electrons: a covalent molecule.
      - |
        Correct. Although the ammonium ion is held together covalently, the solid is a lattice of NH₄⁺ and Cl⁻ ions, so the compound is ionic.
      - |
        Iron is a pure metal, held together by metallic bonding: cations in a sea of delocalised electrons, no anions.
      - |
        Correct. Potassium (metal) and oxygen (nonmetal): K⁺ and O²⁻.
    answer: [0, 2, 4]
    explanation: |
      Ionic: a lattice of cations and anions, including polyatomic ions.

  - slug: apchem-u02-exam-q26
    type: multi_select
    topic_code: "2.5"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which statements about Lewis diagrams are correct? Select all that apply.
    options:
      - "The Lewis diagram of the cyanide ion, CN⁻, contains a triple bond."
      - "In the Lewis diagram of PCl₅, phosphorus has 10 electrons around it."
      - "The Lewis diagram of NO₂ cannot give every atom an octet because the molecule has an odd number of electrons."
      - "Hydrogen can be the central atom in H₂O₂."
      - "The Lewis diagram of CO₃²⁻ requires 24 electrons."
    option_explanations:
      - |
        Correct. 10 electrons: C≡N with a lone pair on each atom gives both an octet.
      - |
        Correct. Five P–Cl bonds use 10 electrons on phosphorus, an expanded octet allowed for a period-3 atom.
      - |
        Correct. 17 valence electrons is odd, so one atom (nitrogen in the usual diagram) keeps an unpaired electron.
      - |
        Hydrogen forms only one bond and is always terminal; H₂O₂ is H–O–O–H.
      - |
        Correct. Carbon contributes 4, each of three oxygens 6, and the 2− charge adds 2: a total of 24 electrons.
    answer: [0, 1, 2, 4]
    explanation: |
      Electron counting, expanded octets, odd-electron species, and hydrogen's terminal position.

  - slug: apchem-u02-exam-q27
    type: multi_select
    topic_code: "2.7"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which of the following molecules are nonpolar? Select all that apply.
    options:
      - "XeF₄"
      - "NF₃"
      - "BeCl₂"
      - "SF₆"
      - "H₂S"
    option_explanations:
      - |
        Correct. Square planar with four identical bonds and the two lone pairs opposite each other: the dipoles cancel.
      - |
        Trigonal pyramidal with a lone pair on nitrogen: polar.
      - |
        Correct. Linear with two identical Be–Cl dipoles pointing opposite ways: nonpolar.
      - |
        Correct. Octahedral with six identical S–F bonds: all dipoles cancel.
      - |
        H₂S is bent because of the two lone pairs on sulfur, so its two S–H bond dipoles add rather than cancel: polar.
    answer: [0, 2, 3]
    explanation: |
      Symmetric arrangements of identical bonds cancel; lone pairs usually spoil the symmetry (square planar and linear-with-three-lone-pairs are the exceptions).

  # ---- True / false
  - slug: apchem-u02-exam-q28
    type: true_false
    topic_code: "2.2"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: Forming a chemical bond from two separated atoms releases energy equal to the bond energy.
    answer: true
    explanation: |
      True. The separated atoms are at zero on the potential-energy curve; the bonded pair sits at the minimum, lower by the bond energy, and that difference is released (as heat or light) when the bond forms. Breaking the bond absorbs the same amount.

  - slug: apchem-u02-exam-q29
    type: true_false
    topic_code: "2.6"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: The ozone molecule spends half its time as O=O–O and half as O–O=O, switching rapidly between the two resonance structures.
    answer: false
    explanation: |
      False. Resonance structures are limitations of the Lewis drawing, not states of the molecule. Ozone has one permanent structure, the hybrid, with two identical O–O bonds of order 1.5 and length 128 pm.

  - slug: apchem-u02-exam-q30
    type: true_false
    topic_code: "2.4"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: Adding a small amount of carbon to iron produces an interstitial alloy that is harder than pure iron.
    answer: true
    explanation: |
      True. Carbon atoms (77 pm) fit into the spaces between iron atoms (126 pm) and pin the layers of the lattice so they cannot slide as easily; steel is much harder than pure iron.

