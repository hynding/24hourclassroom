  # ---- Short answer
  - slug: apchem-u02-exam-q38
    type: short_answer
    topic_code: "2.6"
    source: "general knowledge"
    points: 3
    prompt: |
      Consider the nitrate ion, NO₃⁻, and the ammonium ion, NH₄⁺. Answer (a), (b) and (c).

      (a) Describe the Lewis diagram of NO₃⁻ (one resonance structure) and state how many equivalent resonance structures it has.
      (b) Calculate the formal charge on nitrogen in NO₃⁻ and in NH₄⁺.
      (c) The N–O bonds in nitrate are all 124 pm. A student claims this shows that nitrogen has an expanded octet with three double bonds. Explain why the claim is wrong and give the correct explanation.
    answer: |
      (a) 24 electrons, N central; one N=O (that oxygen with two lone pairs) and two N–O (each with three lone pairs); no lone pair on N; brackets with 1−. Three equivalent resonance structures, with the double bond on each oxygen in turn.
      (b) NO₃⁻: N has 0 lone-pair electrons and 4 bonds: 5 − 0 − 4 = +1. NH₄⁺: 5 − 0 − 4 = +1.
      (c) Nitrogen is in period 2 and has only 2s and 2p orbitals, so it can never hold more than eight electrons; three double bonds would give it twelve. The equal bond lengths come from resonance: the real ion is a hybrid of three equivalent structures, so each bond has order 1.33 and a length between single (136 pm) and double (115 pm).
    explanation: |
      Three points, one per part.

      (a) 1 pt: correct diagram described (one double, two single bonds, lone pairs on O, no lone pair on N, charge) and three resonance structures.

      (b) 1 pt: +1 for nitrogen in both ions.

      (c) 1 pt: rejects the expanded octet for period-2 nitrogen and explains equal lengths through resonance and fractional bond order.

  - slug: apchem-u02-exam-q39
    type: short_answer
    topic_code: "2.3"
    source: "general knowledge"
    points: 3
    stimulus: |
      | Compound | Melting point (°C) |
      |---|---|
      | NaCl | 801 |
      | MgCl₂ | 714 |
      | AlCl₃ | 193 (sublimes) |
      | MgO | 2825 |
    prompt: |
      Use the table to answer (a), (b) and (c).

      (a) Explain, using Coulomb's law, why MgO has a far higher melting point than NaCl.
      (b) The melting points of NaCl and MgCl₂ are similar even though Mg²⁺ has twice the charge of Na⁺. Suggest why the doubled cation charge does not raise the melting point of MgCl₂ above NaCl's.
      (c) AlCl₃ melts (sublimes) at only 193 °C. Explain what this suggests about the bonding in AlCl₃ compared with the other chlorides.
    answer: |
      (a) MgO contains 2+ and 2− ions, so the product of the charges is four times that in NaCl (1+ and 1−); Mg²⁺ (72 pm) and O²⁻ (140 pm) are also smaller than Na⁺ (102 pm) and Cl⁻ (181 pm), so the ions are closer. Both factors make the Coulombic attraction, and so the lattice energy, much larger, and far more energy is needed to free the ions.
      (b) The doubled charge on Mg²⁺ is only half the story: the anion is still Cl⁻ (1−), so the charge product is 2, not 4, and MgCl₂ has a different, layered lattice with a 1 : 2 ion ratio in which each ion has fewer oppositely charged neighbours than in the rock-salt structure of NaCl. The two effects roughly cancel, giving similar melting points. (Partial covalent character in MgCl₂ is also acceptable.)
      (c) A melting point this low is characteristic of a molecular or covalent substance, not an ionic lattice. Al³⁺ is small and highly charged, so it polarises the chloride ions strongly and the bonding is substantially covalent; AlCl₃ exists as Al₂Cl₆ molecules in the solid and vapour rather than as a true ionic lattice.
    explanation: |
      Three points, one per part.

      (a) 1 pt: both the charge product (4 vs 1) and the smaller ion sizes, linked to Coulomb's law and lattice energy (charge alone earns the point if Coulomb's law is cited).

      (b) 1 pt: any reasonable factor beyond cation charge: the anion charge is unchanged so the product is only doubled; the different lattice structure/coordination; or partial covalent character.

      (c) 1 pt: identifies the bonding as largely covalent/molecular (polarisation by the small, highly charged Al³⁺), with the low melting point as evidence.

  # ---- Long answer
  - slug: apchem-u02-exam-q40
    type: long_answer
    topic_code: "2.7"
    source: "general knowledge"
    points: 6
    stimulus: |
      Four species are to be compared: carbon dioxide (CO₂), the carbonate ion (CO₃²⁻), the nitrite ion (NO₂⁻) and ammonia (NH₃).
    prompt: |
      (a) Give the number of valence electrons in each of the four species.
      (b) For CO₃²⁻ and NO₂⁻, describe one resonance structure of each in words and state the bond order of the bonds to the central atom.
      (c) Give the molecular geometry and approximate bond angle of each of the four species.
      (d) State which of the four species are polar (treating the ions by whether their bond dipoles cancel) and justify each answer with its geometry.
      (e) Give the hybridization of the central atom in each species and explain why CO₂ and NH₃ have different hybridizations even though both central atoms form bonds to exactly the number of atoms needed for an octet.
    answer: |
      (a) CO₂: 4 + 12 = 16. CO₃²⁻: 4 + 18 + 2 = 24. NO₂⁻: 5 + 12 + 1 = 18. NH₃: 5 + 3 = 8.

      (b) CO₃²⁻: C central with one C=O (two lone pairs on that O) and two C–O (three lone pairs each), no lone pair on C; three equivalent structures, bond order 1.33. NO₂⁻: N central with one N=O (two lone pairs on O), one N–O (three lone pairs on O) and one lone pair on N; two equivalent structures, bond order 1.5.

      (c) CO₂: two domains, linear, 180°. CO₃²⁻: three domains, trigonal planar, 120°. NO₂⁻: three domains with one lone pair, bent, slightly under 120° (about 115°). NH₃: four domains with one lone pair, trigonal pyramidal, about 107°.

      (d) CO₂: nonpolar; the two equal C=O dipoles are collinear and opposite. CO₃²⁻: the three equivalent C–O dipoles at 120° cancel, so no net bond dipole (the ion carries a charge but has a symmetric charge distribution). NO₂⁻: bent with a lone pair, the two N–O dipoles do not cancel, so it has a net dipole. NH₃: trigonal pyramidal, the three N–H dipoles and the lone pair give a net dipole; polar.

      (e) CO₂: sp (two domains). CO₃²⁻: sp² (three). NO₂⁻: sp² (three domains including the lone pair). NH₃: sp³ (four domains including the lone pair). Hybridization follows the number of electron domains, not the number of bonded atoms: carbon in CO₂ reaches its octet with two double bonds (two domains, sp), whereas nitrogen in NH₃ reaches its octet with three single bonds plus a lone pair (four domains, sp³).
    explanation: |
      Six points.

      (a) 1 pt: all four counts correct.

      (b) 1 pt: both resonance descriptions correct with bond orders 1.33 and 1.5.

      (c) 1 pt: all four geometries and angles (accept "less than 120°" for nitrite and "about 107°" for ammonia).

      (d) 1 pt: CO₂ and CO₃²⁻ identified as having cancelling dipoles; NO₂⁻ and NH₃ as polar, each justified by geometry.

      (e) 2 pts: 1 pt for the four hybridizations; 1 pt for the explanation that hybridization counts domains (lone pairs and multiple bonds count once), so CO₂ (sp) and NH₃ (sp³) differ.
