week: 6
unit: 2
title: "Ionic Solids, Metals and Alloys, and Lewis Diagrams"
topics: ["2.3", "2.4", "2.5"]
guide: guides/week-06.md
guide_description: |
  The lattice model of an ionic solid and the properties it explains (melting point, brittleness, conductivity
  only when molten or dissolved); the electron-sea model of metals, and substitutional against interstitial alloys
  and why alloying hardens a metal; then the full routine for Lewis diagrams, including multiple bonds, polyatomic
  ions, and the exceptions to the octet rule. Worked examples: why NaCl shatters while copper dents, KCl against
  CaS, cupronickel, and the diagrams of CO₂, NH₄⁺, SO₄²⁻ and HCN.
flashcards_description: |
  30 cards on the ionic lattice and its properties, metallic bonding, substitutional and interstitial alloys, the
  Lewis-diagram routine, electron counting for ions, multiple bonds and octet exceptions.

flashcards:
  - front: Ionic solid structure → what surrounds each ion in NaCl
    back: |
      A three-dimensional lattice in which every Na⁺ is surrounded by six Cl⁻ and every Cl⁻ by six Na⁺, repeating in all directions. There are no NaCl molecules; the formula is the ratio of ions.
    topic_code: "2.3"
  - front: Why ionic compounds have high melting points → the lattice argument
    back: |
      Each ion is attracted to several oppositely charged neighbours at once, and Coulombic attraction between full charges is strong, so a great deal of energy is needed to free the ions from their positions: NaCl 801 °C, MgO 2825 °C.
    topic_code: "2.3"
  - front: Why ionic solids are brittle → the shifted-layer explanation
    back: |
      A blow slides one layer by one ion spacing, placing cations beside cations and anions beside anions. The like charges repel strongly and the crystal cleaves along that plane.
    topic_code: "2.3"
  - front: Conductivity of ionic compounds → solid vs molten vs dissolved
    back: |
      Solid: no conduction, ions fixed in the lattice and electrons localised on them. Molten or dissolved: conducts, because the ions themselves are free to move and carry charge. The carriers are ions, not electrons.
    topic_code: "2.3"
  - front: Ionic solids are hard but not malleable → why both
    back: |
      Strong attractions resist small deformations (hard), but any deformation large enough to move a layer brings like charges together and fractures the crystal (not malleable). Metals deform without fracture because every site is equivalent.
    topic_code: "2.3"
  - front: Ranking ionic melting points → charge, then size
    back: |
      Compare charge products first (MgO 2+/2− far above NaCl 1+/1−); for equal charges, smaller ions sit closer and attract more (NaF 993 °C > NaCl 801 °C > NaBr 747 °C). It is the week-4 lattice-energy rule applied to the solid.
    topic_code: "2.3"
  - front: KCl vs CaS melting points → the comparison
    back: |
      Same lattice type; CaS has 2+ and 2− ions (charge product 4) against KCl's 1+ and 1− (product 1), with ions no larger. CaS (about 2525 °C) melts far above KCl (771 °C).
    topic_code: "2.3"
  - front: Metallic solid structure → the electron-sea model restated
    back: |
      Metal cations occupy fixed lattice positions while their valence electrons are delocalised over the whole solid. The cations are all identical, so any site is as good as any other for a neighbouring layer.
    topic_code: "2.4"
  - front: Why metals are malleable and ductile
    back: |
      When a layer of cations slides, each cation is still surrounded by the same delocalised electron sea and attracted just as before, so the metal changes shape without breaking. Contrast the like-charge repulsion that shatters ionic solids.
    topic_code: "2.4"
  - front: Why metals conduct heat and electricity
    back: |
      The delocalised electrons move freely through the lattice: under a voltage they carry charge; at a hot spot they carry kinetic energy to cooler regions. Localised electrons in ionic or molecular solids cannot do either.
    topic_code: "2.4"
  - front: Alloy → definition and why alloys are made
    back: |
      A solid mixture of a metal with one or more other elements that keeps metallic properties. Alloying tunes hardness, strength, corrosion resistance or melting point; brass, bronze, steel and sterling silver are examples.
    topic_code: "2.4"
  - front: Substitutional alloy → how it forms and an example
    back: |
      Atoms of similar size to the host replace some host atoms in the lattice. Brass: zinc (134 pm) replaces some copper (128 pm). Also bronze (Cu/Sn), sterling silver (Ag/Cu), cupronickel (Cu/Ni).
    topic_code: "2.4"
  - front: Interstitial alloy → how it forms and an example
    back: |
      Much smaller atoms fit into the spaces between host atoms. Steel: carbon atoms (77 pm) sit in the gaps of the iron lattice (126 pm). The small atoms pin the layers, so the alloy is harder and less malleable.
    topic_code: "2.4"
  - front: Why an alloy is usually harder than the pure metal
    back: |
      Foreign atoms of a different size (or in interstitial gaps) disrupt the regular planes of cations, so layers cannot slide past one another as easily. More force is needed to deform the solid.
    topic_code: "2.4"
  - front: Predicting alloy type from atomic radii → the rule
    back: |
      Radii within about 15% of each other give a substitutional alloy (Cu 128, Ni 124 pm); a much smaller added atom (C 77 pm in Fe 126 pm) gives an interstitial alloy. Many alloys, such as stainless steel, are both.
    topic_code: "2.4"
  - front: Lewis diagram → what it shows
    back: |
      Every valence electron of a molecule or ion: bonding pairs as lines between atoms, lone pairs as pairs of dots on atoms. Core electrons are not shown. For an ion, the diagram is bracketed with the charge outside.
    topic_code: "2.5"
  - front: Counting valence electrons for a Lewis diagram → the rule for ions
    back: |
      Add each atom's group-number valence count; add one electron per negative charge, subtract one per positive charge. SO₄²⁻: 6 + 4(6) + 2 = 32. NH₄⁺: 5 + 4(1) − 1 = 8. CO₃²⁻: 4 + 18 + 2 = 24.
    topic_code: "2.5"
  - front: Lewis diagram routine → the seven steps
    back: |
      Count electrons; pick the central atom (least electronegative non-hydrogen, usually C); draw single bonds; complete terminal octets (H gets 2); put leftovers on the centre; convert lone pairs to multiple bonds if the centre lacks an octet; bracket ions with the charge.
    topic_code: "2.5"
  - front: Choosing the central atom → the guidelines
    back: |
      Usually the least electronegative atom, and the one that can form the most bonds; carbon is almost always central; hydrogen and the halogens are terminal (they form one bond). In oxyacids, H bonds to O, not to the central atom.
    topic_code: "2.5"
  - front: CO₂ Lewis diagram → why double bonds are needed
    back: |
      16 electrons. Two C–O single bonds plus three lone pairs on each O use all 16 but leave carbon with only 4. Moving one lone pair from each oxygen into the bonds gives O=C=O: carbon 8, each oxygen 8 (two lone pairs each).
    topic_code: "2.5"
  - front: HCN Lewis diagram → where the triple bond goes
    back: |
      10 electrons. H–C–N with three lone pairs on N leaves carbon with 4. Convert two lone pairs into bonds: H–C≡N with one lone pair on nitrogen. Hydrogen 2, carbon 8, nitrogen 8.
    topic_code: "2.5"
  - front: SO₄²⁻ Lewis diagram (octet form) → the electron bookkeeping
    back: |
      32 electrons: four S–O single bonds (8) plus three lone pairs on each oxygen (24). Every atom has an octet, charge 2− outside the brackets. Double-bonded versions with an expanded octet on S lower formal charges (week 7); both are accepted.
    topic_code: "2.5"
  - front: Hydrogen in Lewis diagrams → the duet
    back: |
      Hydrogen has one valence electron and one orbital, so it holds at most two electrons: one bond, no lone pairs, never a central atom. Giving H an octet is a common and serious error.
    topic_code: "2.5"
  - front: Octet exceptions with fewer than eight → B and Be
    back: |
      BF₃ leaves boron with six electrons and BeCl₂ leaves beryllium with four; both are accepted as drawn. They are electron-deficient and readily accept a pair from a donor (Lewis acids, Unit 8).
    topic_code: "2.5"
  - front: Expanded octets → which atoms and which molecules
    back: |
      Central atoms from period 3 downward (P, S, Cl, Xe, ...) can hold more than eight because empty d orbitals are available: PCl₅ (10 electrons on P), SF₆ (12 on S), XeF₄ (12 on Xe). Period-2 atoms (C, N, O, F) never exceed eight.
    topic_code: "2.5"
  - front: Odd-electron molecules → NO and NO₂
    back: |
      NO has 11 valence electrons and NO₂ has 17, so one atom must carry an unpaired electron; no diagram gives every atom an octet. Such species are radicals and are unusually reactive.
    topic_code: "2.5"
  - front: Checking a finished Lewis diagram → three tests
    back: |
      The number of electrons drawn equals the count from step 1; every period-2 atom has eight (hydrogen two); the diagram carries the ion's charge in brackets. If the count is off by two, a bond or lone pair was dropped or doubled.
    topic_code: "2.5"
  - front: Error-spotting → an ionic formula written as a molecule, Na₂Cl₂
    back: |
      Ionic compounds have only empirical formulas because they are lattices with no discrete molecules; Na₂Cl₂ is not a species. Reduce to NaCl, the ratio of ions throughout the crystal.
    topic_code: "2.3"
  - front: Error-spotting → PCl₅ drawn with phosphorus holding only eight electrons
    back: |
      Five chlorines each need one bond, giving phosphorus ten electrons. Forcing an octet would leave a chlorine unbonded. Period-3 phosphorus can expand its octet; the correct diagram has five P–Cl bonds and 40 electrons in all.
    topic_code: "2.5"
  - front: Which practice? Explaining brittleness and conductivity from a particulate model
    back: |
      Practice 4 (model analysis) and practice 6 (argumentation): the claim (NaCl shatters, Cu bends) is supported by the lattice and electron-sea models, with reasoning about what happens to the attractions when a layer shifts.
    topic_code: "2.3"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 2.3, 2.4 and 2.5: ionic solids, metals and
    alloys, and Lewis diagrams), with about a third reviewing Unit 1 and week 5. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short
    answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: three solids compared (2.3, 2.4, 2.1)
    - slug: apchem-u02-w06-q01
      type: multiple_choice
      topic_code: "2.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        Three solids were tested in the laboratory.

        | Solid | Melting point (°C) | Conducts as solid? | Conducts when molten? | Effect of a hammer blow |
        |---|---|---|---|---|
        | X | 801 | no | yes | shatters |
        | Y | 1085 | yes | yes | dents |
        | Z | 80 | no | no | crumbles |
      prompt: |
        Which statement best explains why solid X conducts electricity only when molten?
      options:
        - "Melting breaks the covalent bonds in X, releasing free electrons."
        - "In the solid the ions of X are held in fixed lattice positions; in the liquid the ions are free to move and carry charge."
        - "Solid X contains no charged particles, but melting creates ions."
        - "The electron sea in X becomes mobile only at high temperature."
      option_explanations:
        - |
          X shows the ionic pattern (high melting point, shatters, conducts molten); it has no covalent bonds to break and its carriers are ions, not electrons.
        - |
          Correct. Ionic solids contain ions already, but conduction requires mobile charge carriers; melting frees the ions from the lattice.
        - |
          The ions exist in the solid; what changes on melting is their mobility, not their existence.
        - |
          An electron sea describes metals (solid Y), which conduct in the solid state as well.
      answer: 1
      explanation: |
        Ionic: charge carriers are ions, mobile only in the melt or solution.

    - slug: apchem-u02-w06-q02
      type: multiple_choice
      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      stimulus: |
        Three solids were tested in the laboratory.

        | Solid | Melting point (°C) | Conducts as solid? | Conducts when molten? | Effect of a hammer blow |
        |---|---|---|---|---|
        | X | 801 | no | yes | shatters |
        | Y | 1085 | yes | yes | dents |
        | Z | 80 | no | no | crumbles |
      prompt: |
        Which explanation accounts for solid Y denting rather than shattering when struck?
      options:
        - "Y is held together by weak intermolecular forces that let the molecules slide."
        - "Y has a lower melting point than X, so it is softer."
        - "Y's cations are all identical and surrounded by delocalised electrons, so a shifted layer remains bonded exactly as before."
        - "Y's ions rearrange into a new lattice when struck."
      option_explanations:
        - |
          Weak intermolecular forces describe molecular solid Z; Y conducts as a solid, which rules out a molecular solid.
        - |
          Y actually has the higher melting point; hardness and brittleness depend on bonding type, not melting point alone.
        - |
          Correct. Y is a metal (copper, 1085 °C). In the electron-sea model every lattice site is equivalent, so sliding a layer does not create repulsion and the metal deforms without fracture.
        - |
          No rearrangement into a new lattice occurs; the layers simply slide while the delocalised electrons keep them bonded.
      answer: 2
      explanation: |
        Malleability follows from identical cations in a mobile electron sea.

    - slug: apchem-u02-w06-q03
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        Three solids were tested in the laboratory.

        | Solid | Melting point (°C) | Conducts as solid? | Conducts when molten? | Effect of a hammer blow |
        |---|---|---|---|---|
        | X | 801 | no | yes | shatters |
        | Y | 1085 | yes | yes | dents |
        | Z | 80 | no | no | crumbles |
      prompt: |
        Which identification of the three solids is most consistent with the data?
      options:
        - "X = copper, Y = sodium chloride, Z = naphthalene"
        - "X = naphthalene, Y = copper, Z = sodium chloride"
        - "X = sodium chloride, Y = copper, Z = naphthalene"
        - "X = sodium chloride, Y = naphthalene, Z = copper"
      option_explanations:
        - |
          Copper conducts as a solid; X does not. Sodium chloride does not conduct as a solid; Y does.
        - |
          Naphthalene (a molecular solid) melts near 80 °C and never conducts; it matches Z, not X.
        - |
          Correct. X (conducts only molten, shatters, 801 °C) is ionic NaCl; Y (conducts solid, dents) is metallic copper; Z (low melting, no conduction) is the molecular solid naphthalene.
        - |
          Copper conducts in both states and dents; Z neither conducts nor dents.
      answer: 2
      explanation: |
        Match the property pattern to the bonding type: ionic, metallic, molecular (covalent).

    # ---- Multiple choice (2.3, 2.4)
    - slug: apchem-u02-w06-q04
      type: multiple_choice
      topic_code: "2.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following is the best particulate description of solid magnesium chloride?
      options:
        - "Discrete MgCl₂ molecules held together by intermolecular forces."
        - "Pairs of Mg and Cl atoms sharing electrons in covalent bonds."
        - "Mg²⁺ ions in a sea of delocalised electrons supplied by chlorine."
        - "A lattice of Mg²⁺ and Cl⁻ ions in a 1 : 2 ratio, each ion surrounded by ions of opposite charge."
      option_explanations:
        - |
          Ionic compounds do not form discrete molecules; the formula is a ratio of ions in a continuous lattice.
        - |
          Magnesium (metal, low ionization energy) and chlorine (high electronegativity) transfer electrons rather than share.
        - |
          An electron sea describes a metal; chlorine's electrons are localised on Cl⁻ ions.
        - |
          Correct. MgCl₂ is an extended three-dimensional array of Mg²⁺ and Cl⁻ ions in the ratio that gives neutrality, with Coulombic attraction between neighbours.
      answer: 3
      explanation: |
        Ionic solid = lattice of ions in the formula ratio.

    - slug: apchem-u02-w06-q05
      type: multiple_choice
      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Steel is an alloy of iron (atomic radius 126 pm) with a small percentage of carbon (atomic radius 77 pm). Which statement about steel is correct?
      options:
        - "It is an interstitial alloy, because the small carbon atoms fit into spaces between iron atoms, making the layers harder to slide."
        - "It is a substitutional alloy, because carbon atoms replace iron atoms in the lattice."
        - "It is an ionic compound of Fe³⁺ and carbide ions."
        - "It is softer than pure iron because carbon weakens the metallic bonding."
      option_explanations:
        - |
          Correct. With a radius about 60% of iron's, carbon slips into the interstices; the pinned layers resist sliding, so steel is harder and stronger than pure iron.
        - |
          Carbon is far too small to substitute for iron; it occupies the gaps instead.
        - |
          Steel keeps metallic properties (conducts, is malleable); it is a metallic solid, not an ionic one.
        - |
          Interstitial atoms make the alloy harder, not softer, by hindering the motion of cation layers.
      answer: 0
      explanation: |
        Small atom in the gaps: interstitial; similar-sized atom in the lattice sites: substitutional.

    - slug: apchem-u02-w06-q06
      type: multiple_choice
      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Brass (copper with zinc) is harder than pure copper. The best explanation is that
      options:
        - "zinc atoms form covalent bonds with copper atoms."
        - "zinc atoms, which differ in size from copper atoms, disrupt the regular layers of the lattice so they cannot slide as easily."
        - "zinc removes the delocalised electrons from the copper lattice."
        - "brass is an ionic compound of Cu²⁺ and Zn²⁻."
      option_explanations:
        - |
          Two metals bond metallically; there are no localised covalent bonds in brass.
        - |
          Correct. Substituted atoms of a different size (Zn 134 pm, Cu 128 pm) break the regularity of the planes; deformation needs more force.
        - |
          The electron sea remains (brass still conducts); zinc contributes its own valence electrons to it.
        - |
          Both are metals; zinc does not form a 2− ion, and brass has metallic properties.
      answer: 1
      explanation: |
        Alloying hardens a metal by disrupting the slip planes.

    # ---- Multiple choice (2.5)
    - slug: apchem-u02-w06-q07
      type: multiple_choice
      topic_code: "2.5"
      source: "general knowledge"
      points: 1
      prompt: |
        How many valence electrons must be shown in the Lewis diagram of the phosphate ion, PO₄³⁻?
      options:
        - "29"
        - "26"
        - "32"
        - "35"
      option_explanations:
        - |
          29 is P (5) + 4 O (24) with the 3− charge ignored; each negative charge adds an electron.
        - |
          26 subtracts the charge instead of adding it; a negative ion has extra electrons.
        - |
          Correct. 5 + 4(6) + 3 = 32 electrons: four P–O bonds (8) and three lone pairs on each oxygen (24).
        - |
          35 adds the charge twice or miscounts oxygen; the total is 32.
      answer: 2
      explanation: |
        Group-number electrons for each atom, plus one per negative charge.

    - slug: apchem-u02-w06-q08
      type: multiple_choice
      topic_code: "2.5"
      source: "general knowledge"
      points: 1
      prompt: |
        In the correct Lewis diagram of carbon dioxide, CO₂, the central carbon atom
      options:
        - "has two double bonds and no lone pairs."
        - "has two single bonds and two lone pairs."
        - "has one triple bond, one single bond and no lone pairs."
        - "has two single bonds and no lone pairs, with six electrons."
      option_explanations:
        - |
          Correct. O=C=O: two double bonds give carbon eight electrons and leave two lone pairs on each oxygen, using all 16 electrons.
        - |
          With 16 electrons in total, lone pairs on carbon would leave the oxygens without octets; carbon's electrons go into bonds.
        - |
          A triple-single arrangement (O≡C–O) is a valid resonance form in principle but places formal charges of +1 and −1 on the oxygens; the two-double-bond structure is the accepted diagram.
        - |
          A carbon with six electrons violates the octet rule when multiple bonds are available to fix it.
      answer: 0
      explanation: |
        Move lone pairs into bonds until the central atom has an octet.

    - slug: apchem-u02-w06-q09
      type: multiple_choice
      topic_code: "2.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Which molecule has a central atom with an expanded octet in its Lewis diagram?
      options:
        - "NH₃"
        - "H₂O"
        - "SF₆"
        - "CF₄"
      option_explanations:
        - |
          Nitrogen (period 2) holds exactly eight: three bonds and one lone pair.
        - |
          Oxygen (period 2) holds eight: two bonds and two lone pairs.
        - |
          Correct. Sulfur (period 3) forms six S–F bonds, 12 electrons around S; period-3 atoms can exceed an octet.
        - |
          Carbon holds exactly eight in four C–F bonds; period-2 atoms cannot expand.
      answer: 2
      explanation: |
        Expanded octets need a central atom from period 3 or below.

    - slug: apchem-u02-w06-q10
      type: multiple_choice
      topic_code: "2.5"
      source: "general knowledge"
      points: 1
      prompt: |
        A student draws the Lewis diagram of HCN as H–C=N with two lone pairs on nitrogen and one lone pair on carbon. What is wrong with the diagram?
      options:
        - "Nothing; it is correct."
        - "Nitrogen should have an expanded octet."
        - "Hydrogen should be the central atom."
        - "The total electron count is 12, two more than the 10 available; the correct diagram is H–C≡N with one lone pair on N."
      option_explanations:
        - |
          Count the electrons: H–C (2) + C=N (4) + two lone pairs on N (4) + one on C (2) = 12, but HCN has only 1 + 4 + 5 = 10.
        - |
          Nitrogen is in period 2 and can never hold more than eight electrons.
        - |
          Hydrogen forms only one bond and is never central.
        - |
          Correct. The extra pair must be removed by converting a lone pair into a third bond: H–C≡N with one lone pair on nitrogen gives carbon and nitrogen octets with exactly 10 electrons.
      answer: 3
      explanation: |
        Always check the total against the valence-electron count.

    # ---- Review (1.8, 2.2)
    - slug: apchem-u02-w06-q11
      type: multiple_choice
      topic_code: "1.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Which ionic solid would be expected to have the greatest lattice energy?
      options:
        - "MgO"
        - "NaCl"
        - "KBr"
        - "CaCl₂"
      option_explanations:
        - |
          Correct. Mg²⁺ and O²⁻ give a charge product of 4, and both ions are small (72 and 140 pm); the Coulombic attraction, and so the lattice energy, is the largest of the four.
        - |
          NaCl has 1+ and 1− ions: a charge product of 1 and a weaker lattice than any 2+/2− solid.
        - |
          KBr has 1+/1− charges and the largest ions listed, giving the smallest lattice energy.
        - |
          CaCl₂ has a 2+ cation but 1− anions; its attraction per ion pair is below MgO's 2+/2− combination.
      answer: 0
      explanation: |
        Review of 1.8: charge product first, then ion size.

    - slug: apchem-u02-w06-q12
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Based on their Lewis diagrams, which molecule has the shortest bond between its two atoms?
      options:
        - "F₂"
        - "O₂"
        - "Cl₂"
        - "N₂"
      option_explanations:
        - |
          F₂ has a single bond (bond order 1); it is short because fluorine is small (142 pm) but not as short as a triple bond.
        - |
          O₂ has a double bond, 121 pm, longer than the triple bond of N₂.
        - |
          Cl₂ has a single bond between large atoms, 199 pm, the longest listed.
        - |
          Correct. N≡N has bond order 3; three shared pairs pull the nuclei to 110 pm, the shortest of the four.
      answer: 3
      explanation: |
        Review of 2.2: Lewis diagrams give bond order, and higher order means a shorter, stronger bond.

    # ---- Multi-select
    - slug: apchem-u02-w06-q13
      type: multi_select
      topic_code: "2.5"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following species have Lewis diagrams in which every atom obeys the octet rule (hydrogen the duet)? Select all that apply.
      options:
        - "NH₄⁺"
        - "BF₃"
        - "CO₃²⁻"
        - "PCl₅"
        - "H₂O"
      option_explanations:
        - |
          Correct. Eight electrons in four N–H bonds: nitrogen has an octet and each hydrogen a duet.
        - |
          Boron has only six electrons (three bonds, no lone pairs); it is a tested exception.
        - |
          Correct. 24 electrons: carbon with one double and two single bonds has eight; each oxygen has eight.
        - |
          Phosphorus holds ten electrons in five bonds, an expanded octet.
        - |
          Correct. Oxygen has two bonds and two lone pairs (eight); each hydrogen has two.
      answer: [0, 2, 4]
      explanation: |
        Count the electrons around each atom; exceptions are B, Be, odd-electron species and period-3+ centres with extra electrons.

    - slug: apchem-u02-w06-q14
      type: multi_select
      topic_code: "1.7"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements correctly use periodic trends to explain properties of ionic solids? Select all that apply.
      options:
        - "LiF has a higher melting point than KBr partly because Li⁺ and F⁻ are smaller than K⁺ and Br⁻."
        - "From NaCl to CsCl, the group-1 chlorides have decreasing melting points because the cation radius increases."
        - "Cs⁺ is smaller than Li⁺, so CsCl melts higher than LiCl."
        - "The oxide of a group-2 metal has a higher lattice energy than the fluoride of the group-1 metal next to it because the charges are doubled."
        - "Ionic radius has no effect on lattice energy; only charge matters."
      option_explanations:
        - |
          Correct. Smaller ions sit closer, strengthening the Coulombic attraction (LiF 845 °C, KBr 734 °C).
        - |
          Correct. Larger cations mean larger ion separations and weaker attraction: NaCl 801, KCl 771, RbCl 718, CsCl 645 °C.
        - |
          Cs⁺ is far larger than Li⁺ (radius grows down a group), and CsCl melts lower (645 °C) than NaCl.
        - |
          Correct. MgO (2+/2−) has a charge product four times that of NaF (1+/1−), so a much larger lattice energy.
        - |
          Both charge and distance appear in Coulomb's law; radius matters, though charge usually dominates.
      answer: [0, 1, 3]
      explanation: |
        Review of 1.7 feeding 2.3: ion sizes from the periodic trend set the distance term in Coulomb's law.

    # ---- True / false
    - slug: apchem-u02-w06-q15
      type: true_false
      topic_code: "2.4"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: In a substitutional alloy, atoms of the added element occupy spaces between the host atoms rather than replacing them.
      answer: false
      explanation: |
        False. That describes an interstitial alloy (carbon in iron). In a substitutional alloy the added atoms, similar in size to the host, take the host atoms' lattice positions (zinc in copper for brass).

    - slug: apchem-u02-w06-q16
      type: true_false
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: The number of valence electrons an atom contributes to a Lewis diagram equals the number of electrons in its outermost shell, which for a main-group element is its group number (or group number minus 10).
      answer: true
      explanation: |
        True. Lewis diagrams show only valence electrons: carbon ([He] 2s² 2p²) contributes 4, oxygen 6, chlorine 7. Core electrons are omitted because they take no part in bonding.

    # ---- Fill in the blank
    - slug: apchem-u02-w06-q17
      type: fill_blank
      topic_code: "2.3"
      source: "general knowledge"
      points: 1
      prompt: |
        When an ionic crystal is struck, a layer of ions shifts so that ions of like charge are aligned; their mutual ____ causes the crystal to shatter.
      answer: ["repulsion", "electrostatic repulsion", "Coulombic repulsion"]
      explanation: |
        Like charges repel. The shifted layer places cation next to cation and anion next to anion, and the repulsion cleaves the crystal; this is why ionic solids are brittle while metals, whose cations are all alike, are malleable.

