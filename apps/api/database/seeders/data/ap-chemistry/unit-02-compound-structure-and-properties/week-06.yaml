    # ---- Short answer
    - slug: apchem-u02-w06-q22
      type: short_answer
      topic_code: "2.5"
      source: "general knowledge"
      points: 3
      prompt: |
        Consider the molecules SO₂ and SF₄. Answer (a), (b) and (c).

        (a) Determine the total number of valence electrons in each molecule.
        (b) Describe the Lewis diagram of SO₂ in words: the bonds to each oxygen and the lone pairs on each atom (give one of its two equivalent diagrams).
        (c) Describe the Lewis diagram of SF₄ and explain why its central atom is permitted to hold more than eight electrons.
      answer: |
        (a) SO₂: 6 + 2(6) = 18. SF₄: 6 + 4(7) = 34.
        (b) Sulfur central. One S=O double bond and one S–O single bond; one lone pair on sulfur; two lone pairs on the double-bonded oxygen and three on the single-bonded oxygen. Total: 6 (bonds) + 2 + 4 + 6 = 18 electrons. (The other resonance form swaps the double and single bonds.)
        (c) Sulfur central with four S–F single bonds (8 electrons) and one lone pair on sulfur (2), making 10 electrons around sulfur; each fluorine has three lone pairs (24). Total 34. Sulfur is in period 3 and has empty 3d orbitals available, so it can accommodate more than eight electrons; a period-2 atom could not.
      explanation: |
        Three points, one per part.

        (a) 1 pt: both counts correct (18 and 34).

        (b) 1 pt: a correct SO₂ diagram described with one double bond, one single bond, a lone pair on S, and correct lone pairs on the oxygens (an all-double-bond form with expanded octet on S is also accepted if the count is 18).

        (c) 1 pt: four bonds plus a lone pair on S (10 electrons) and the period-3/d-orbital justification for the expanded octet.

    - slug: apchem-u02-w06-q23
      type: short_answer
      topic_code: "2.3"
      source: "general knowledge"
      points: 3
      prompt: |
        A student has two white crystalline solids. One is sodium chloride (NaCl) and the other is sucrose (table sugar, C₁₂H₂₂O₁₁). Answer (a), (b) and (c).

        (a) Describe a simple test, other than taste, that would distinguish the two solids, and state the expected result for each.
        (b) Explain the result of your test in terms of the particles present in each solid and their bonding.
        (c) Both solids dissolve in water. Explain why the sodium chloride solution conducts electricity while the sucrose solution does not.
      answer: |
        (a) Measure the electrical conductivity of a solution of each in water (or melt each and test; or compare melting points). The NaCl solution conducts; the sucrose solution does not. Alternatively, NaCl melts above 800 °C while sucrose melts and decomposes below 200 °C.
        (b) NaCl is an ionic solid: a lattice of Na⁺ and Cl⁻ ions held by strong Coulombic attractions, so it needs a high temperature to melt and provides ions when dissolved. Sucrose is a molecular solid: discrete C₁₂H₂₂O₁₁ molecules held together by comparatively weak intermolecular attractions, so it melts at a low temperature and never produces ions.
        (c) Dissolving NaCl separates the lattice into mobile Na⁺ and Cl⁻ ions, which carry charge through the solution. Dissolving sucrose disperses neutral molecules; with no mobile charged particles the solution cannot conduct.
      explanation: |
        Three points, one per part.

        (a) 1 pt: a valid distinguishing test (conductivity of solution or melt, melting point) with correct expected results.

        (b) 1 pt: ionic lattice with strong attractions for NaCl versus neutral molecules with weak intermolecular forces for sucrose, linked to the observed results.

        (c) 1 pt: mobile ions in the NaCl solution versus neutral molecules in the sucrose solution.

    # ---- Long answer
    - slug: apchem-u02-w06-q24
      type: long_answer
      topic_code: "2.4"
      source: "general knowledge"
      points: 6
      stimulus: |
        | Metal or alloy | Composition | Atomic radii (pm) | Electrical conductivity (relative, Cu = 100) | Hardness (relative) |
        |---|---|---|---|---|
        | Copper | 100% Cu | Cu 128 | 100 | 1.0 |
        | Brass | 70% Cu, 30% Zn | Zn 134 | 28 | 2.5 |
        | Pure iron | 100% Fe | Fe 126 | 17 | 1.2 |
        | Carbon steel | 99% Fe, 1% C | C 77 | 10 | 4.0 |
      prompt: |
        (a) Describe the bonding in pure copper using the electron-sea model, and use the model to explain why copper conducts electricity so well.
        (b) Classify brass and carbon steel as substitutional or interstitial alloys, with reference to the atomic radii in the table.
        (c) Explain, at the particulate level, why both alloys are harder than their parent metals.
        (d) Explain why alloying copper with zinc lowers its electrical conductivity.
        (e) A manufacturer needs a material that is both highly conductive and strong enough to resist bending. Using the data, discuss the trade-off and recommend a material, justifying your choice.
      answer: |
        (a) Copper consists of Cu cations in a regular lattice with the valence electrons delocalised over the whole solid rather than belonging to individual atoms. Because those electrons are free to move through the lattice, an applied voltage sets them in motion and charge flows readily; the ordered, uniform lattice offers little obstruction.

        (b) Brass: substitutional. Zinc (134 pm) is within a few percent of copper (128 pm), so zinc atoms replace copper atoms at lattice sites. Carbon steel: interstitial. Carbon (77 pm) is much smaller than iron (126 pm), so carbon atoms occupy the spaces between iron atoms.

        (c) In a pure metal all cations are identical and arranged in regular planes that can slide past one another while the electron sea maintains the bonding. Substituted zinc atoms of a different size, or interstitial carbon atoms wedged between layers, break the regularity and lock the planes, so more force is needed to make them slide; the alloy resists deformation and is harder.

        (d) The delocalised electrons in brass are scattered by the irregularities that zinc atoms introduce (different size and nuclear charge at random sites), so they move less freely through the lattice; conductivity falls from 100 to 28.

        (e) Conductivity and hardness move in opposite directions: pure copper conducts best (100) but is softest (1.0); brass is 2.5 times harder but conducts at only 28; steel is hardest (4.0) but conducts at 10. If conductivity is the priority, pure copper with a mechanical support, or a copper alloy with only a small amount of added metal, is the best compromise; among the listed materials, brass gives the largest gain in hardness for a conductivity that is still above iron's, so brass is the recommendation when both properties matter and copper when conductivity dominates.
      explanation: |
        Six points.

        (a) 1 pt: cations in a lattice plus delocalised valence electrons; conduction attributed to mobile electrons.

        (b) 1 pt: brass substitutional (similar radii) and steel interstitial (carbon much smaller), both justified with the radii.

        (c) 1 pt: regular planes slide in a pure metal; foreign atoms disrupt the planes and hinder sliding.

        (d) 1 pt: irregular lattice scatters or impedes the delocalised electrons.

        (e) 2 pts: 1 pt for identifying the inverse relationship between conductivity and hardness from the data; 1 pt for a recommendation that follows from the data with a stated justification (copper, brass, or copper with a small alloying addition are all acceptable if justified).
