week: 5
unit: 2
title: "Types of Bonds and the Energy of a Bond"
topics: ["2.1", "2.2"]
guide: guides/week-05.md
guide_description: |
  Ionic, covalent (polar and nonpolar) and metallic bonding as regions of one electrostatic continuum, decided by
  the electronegativities and positions of the atoms; then the potential-energy curve of two atoms, with bond
  length at the minimum and bond energy as the depth of the well, and how bond order and atom size set both.
  Worked examples: classifying Cl₂, BrCl, NaBr, CaO and brass; ranking X–H bond polarities; H₂ against Cl₂; N₂
  against O₂; the energy to break the bonds in a sample.
flashcards_description: |
  28 cards on bond types and the electronegativity guide, partial charges, the electron-sea model, the
  potential-energy diagram, and the links among bond order, bond length and bond energy.

flashcards:
  - front: Ionic bond → how it forms and what holds it
    back: |
      A metal with a low ionization energy transfers electrons to a nonmetal with a high electronegativity; the resulting cations and anions attract electrostatically in a lattice. NaCl: ΔEN 2.23, metal plus nonmetal.
    topic_code: "2.1"
  - front: Covalent bond → definition and who forms it
    back: |
      A pair of electrons shared between two atoms, each attracted to both nuclei. Formed between nonmetals, which both have high ionization energies and high electronegativities, so neither gives electrons up.
    topic_code: "2.1"
  - front: Nonpolar vs polar covalent → the dividing idea
    back: |
      Equal sharing (identical or nearly identical electronegativities, as in Cl₂ or C–H) is nonpolar; unequal sharing (ΔEN roughly 0.4 to 1.7) is polar, with δ− on the more electronegative atom and δ+ on the other.
    topic_code: "2.1"
  - front: Partial charges δ+ and δ− → where each sits in H–Cl
    back: |
      Chlorine (3.16) pulls the shared pair more than hydrogen (2.20), so Cl is δ− and H is δ+. The bond has a dipole pointing from H toward Cl.
    topic_code: "2.1"
  - front: Electronegativity difference as a bond-type guide → the rough cutoffs and the caution
    back: |
      Below about 0.4 nonpolar; 0.4 to about 1.7 polar covalent; above about 1.7 ionic. But metal-plus-nonmetal is a better test for ionic than any number: HF (ΔEN 1.78) is covalent because both are nonmetals.
    topic_code: "2.1"
  - front: Metallic bonding → the electron-sea model
    back: |
      Metal cations arranged in a lattice with their valence electrons delocalised over the whole solid. The mobile electrons explain electrical and thermal conductivity; the cations' ability to slide while staying bound explains malleability and ductility.
    topic_code: "2.1"
  - front: Why NaCl(s) does not conduct but Cu(s) does
    back: |
      In copper the valence electrons are delocalised and free to move. In solid NaCl electrons are localised on ions that are fixed in the lattice; only when melted or dissolved can the ions move and carry charge.
    topic_code: "2.1"
  - front: Ranking X–H bond polarity → C–H, N–H, O–H, C–F
    back: |
      ΔEN: C–H 0.35, N–H 0.84, O–H 1.24, C–F 1.43. Polarity increases in that order. H is δ+ in every X–H bond listed; F is δ− in C–F.
    topic_code: "2.1"
  - front: MgCl₂ ionic but PCl₃ covalent → why
    back: |
      Magnesium is a metal with a low ionization energy and ΔEN 1.85 with Cl, so electrons transfer. Phosphorus is a nonmetal close to chlorine in electronegativity (ΔEN 0.97), so the atoms share. Same chlorine, different partner.
    topic_code: "2.1"
  - front: Bonding as a continuum → what the CED wants you to say
    back: |
      Ionic, polar covalent and nonpolar covalent are regions, not boxes; as ΔEN increases the sharing becomes more unequal until the electrons are essentially transferred. Describe a bond's position on the continuum rather than forcing a label.
    topic_code: "2.1"
  - front: Potential-energy diagram of two atoms → the axes
    back: |
      x-axis: distance between the nuclei (pm). y-axis: potential energy of the pair (kJ/mol), zero when the atoms are infinitely far apart. The curve dips to a minimum and rises steeply at short distances.
    topic_code: "2.2"
  - front: Potential-energy diagram → where the bond length is read
    back: |
      At the x-value of the minimum. For H₂ the minimum is at 74 pm, so the H–H bond length is 74 pm. Distances shorter than this are dominated by nuclear repulsion.
    topic_code: "2.2"
  - front: Potential-energy diagram → where the bond energy is read
    back: |
      The depth of the well: the positive energy needed to climb from the minimum back to zero. H₂'s minimum is at −436 kJ/mol, so the bond energy is 436 kJ/mol. Report it as a positive number.
    topic_code: "2.2"
  - front: Why the potential-energy curve rises steeply at short distances
    back: |
      The two positively charged nuclei repel each other more and more strongly as they approach (Coulomb's law, 1/r), and the filled electron clouds repel as well. Attraction can no longer compensate, so the energy climbs.
    topic_code: "2.2"
  - front: Why the potential-energy curve falls below zero as atoms approach
    back: |
      Each atom's electrons are attracted to the other atom's nucleus; shared electron density between the nuclei attracts both. Net attraction lowers the energy until repulsion takes over at the minimum.
    topic_code: "2.2"
  - front: Bond breaking vs bond forming → the sign of the energy
    back: |
      Breaking a bond always absorbs energy (climbing out of the well, endothermic); forming a bond always releases the same energy (exothermic). Bonds do not store energy that is released when they break.
    topic_code: "2.2"
  - front: H₂ vs Cl₂ potential-energy curves → the comparison
    back: |
      H₂: minimum at 74 pm, −436 kJ/mol. Cl₂: 199 pm, −243 kJ/mol. Larger chlorine atoms make a longer bond, and the shared pair is farther from each nucleus with more inner-electron repulsion, so the bond is weaker.
    topic_code: "2.2"
  - front: Bond order → definition and its effect on length and energy
    back: |
      The number of shared electron pairs (1, 2, 3). Higher order pulls the nuclei closer (shorter bond) and binds them more strongly (higher bond energy): C–C 154 pm, 348 kJ/mol; C=C 134 pm, 614; C≡C 120 pm, 839.
    topic_code: "2.2"
  - front: N₂ vs O₂ wells → which is deeper and why
    back: |
      N₂ (triple bond): 110 pm, −945 kJ/mol. O₂ (double bond): 121 pm, −498 kJ/mol. More shared pairs mean more electron density between the nuclei, a shorter bond and a deeper well.
    topic_code: "2.2"
  - front: Is a double bond twice as strong as a single? → no, and why
    back: |
      C=C (614 kJ/mol) is less than twice C–C (348). The second pair forms a π bond with poorer overlap than the first σ bond, so it adds less than the first. A triple bond adds still less per pair.
    topic_code: "2.2"
  - front: Hydrogen halide bond lengths and energies → the trend down the group
    back: |
      H–F 92 pm, 567 kJ/mol; H–Cl 127, 432; H–Br 141, 366; H–I 161, 299. Larger halogen atoms give longer, weaker bonds: for the same bond order, longer usually means weaker.
    topic_code: "2.2"
  - front: Energy to break the bonds in a sample → the calculation
    back: |
      Bond energy (kJ/mol) × moles of bonds. For 0.250 mol of H₂: 436 × 0.250 = 109 kJ. Convert grams to moles first if a mass is given (2.00 g H₂ = 0.990 mol, 432 kJ).
    topic_code: "2.2"
  - front: Two potential-energy curves on one graph → how to tell which is which
    back: |
      The curve whose minimum is farther left has the shorter bond; the one whose minimum is lower has the stronger bond. A triple bond's curve is both left of and below a single bond's curve between the same atoms.
    topic_code: "2.2"
  - front: Effect of atom size on bond length → the rule and an example
    back: |
      Larger atoms have larger valence shells, so their nuclei cannot approach as closely: C–I (214 pm) is longer than C–Cl (177 pm) even though both are single bonds. Size and bond order both matter.
    topic_code: "2.2"
  - front: Point left of the minimum on a potential-energy curve → what it means
    back: |
      The atoms are squeezed closer than their bond length; nuclear repulsion dominates and the energy is higher than at the minimum, so the atoms push apart. Like a compressed spring, the molecule vibrates about the minimum.
    topic_code: "2.2"
  - front: Coulomb's law and bond strength → why H–F is so strong
    back: |
      Fluorine is small with a high effective nuclear charge, so the shared electrons sit very close to its nucleus and are attracted strongly; the short distance (92 pm) means a large Coulombic attraction and a deep well (567 kJ/mol).
    topic_code: "2.2"
  - front: Error-spotting → "a bond stores energy that is released when it breaks"
    back: |
      Backwards. Breaking a bond requires energy input; energy is released when new, stronger bonds form in the products. The potential-energy curve shows breaking as climbing out of the well.
    topic_code: "2.2"
  - front: Which practice? Reading bond length and energy from a potential-energy graph
    back: |
      Practice 3 (representing data and phenomena): locate the minimum, read the x-coordinate as bond length and the depth as bond energy, then explain the shape with attraction and repulsion (practice 4, model analysis).
    topic_code: "2.2"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 2.1 and 2.2: types of bonds and the
    potential energy of a bond), with about a third reviewing Unit 1. Multiple choice, select-all, true/false and
    numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the
    long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: potential-energy data for diatomic molecules (2.2, 2.1)
    - slug: apchem-u02-w05-q01
      type: multiple_choice
      topic_code: "2.2"
      source: "NIST Chemistry WebBook (bond data, rounded)"
      points: 1
      stimulus: |
        Potential-energy curves were drawn for three diatomic molecules. The table gives the position of the minimum of each curve.

        | Molecule | Distance at minimum (pm) | Energy at minimum (kJ/mol) |
        |---|---|---|
        | H₂ | 74 | −436 |
        | Cl₂ | 199 | −243 |
        | N₂ | 110 | −945 |
      prompt: |
        Which molecule has the strongest bond, and what is its bond energy?
      options:
        - "N₂; 945 kJ/mol"
        - "N₂; −945 kJ/mol"
        - "H₂; 436 kJ/mol"
        - "Cl₂; 199 kJ/mol"
      option_explanations:
        - |
          Correct. The deepest well belongs to N₂, and its bond energy is the depth of that well expressed as a positive quantity: 945 kJ/mol must be supplied to separate the atoms.
        - |
          The minimum is drawn at −945 kJ/mol, but bond energy is reported as the positive energy required to break the bond.
        - |
          H₂'s bond (436 kJ/mol) is strong but its well is less than half as deep as N₂'s.
        - |
          199 pm is Cl₂'s bond length, not its bond energy; and Cl₂ has the weakest bond of the three.
      answer: 0
      explanation: |
        Bond energy = depth of the well, as a positive number; the deepest well is the strongest bond.

    - slug: apchem-u02-w05-q02
      type: multiple_choice
      topic_code: "2.2"
      source: "NIST Chemistry WebBook (bond data, rounded)"
      points: 1
      stimulus: |
        Potential-energy curves were drawn for three diatomic molecules. The table gives the position of the minimum of each curve.

        | Molecule | Distance at minimum (pm) | Energy at minimum (kJ/mol) |
        |---|---|---|
        | H₂ | 74 | −436 |
        | Cl₂ | 199 | −243 |
        | N₂ | 110 | −945 |
      prompt: |
        Which statement best explains why the Cl–Cl bond is longer and weaker than the H–H bond?
      options:
        - "Chlorine is more electronegative than hydrogen, so it holds electrons farther from the bond."
        - "Chlorine atoms are much larger, so the nuclei cannot approach as closely and the shared pair is farther from each nucleus; inner electrons also add repulsion."
        - "Cl₂ has a double bond while H₂ has a single bond."
        - "The Cl–Cl bond is ionic, which is weaker than covalent."
      option_explanations:
        - |
          Electronegativity describes attraction for shared electrons; the length and strength difference here comes from size and shielding, not from polarity (both bonds are nonpolar).
        - |
          Correct. Chlorine's n = 3 valence shell is far larger than hydrogen's n = 1, so the equilibrium distance is longer, the Coulombic attraction weaker, and the filled inner shells repel one another.
        - |
          Both are single bonds; a double bond would be shorter and stronger, the opposite of what Cl₂ shows.
        - |
          Two identical nonmetal atoms share electrons equally; the Cl–Cl bond is nonpolar covalent.
      answer: 1
      explanation: |
        Atom size sets the distance; the distance (Coulomb's law) sets the strength.

    - slug: apchem-u02-w05-q03
      type: multiple_choice
      topic_code: "2.1"
      source: "NIST Chemistry WebBook (bond data, rounded)"
      points: 1
      stimulus: |
        Potential-energy curves were drawn for three diatomic molecules. The table gives the position of the minimum of each curve.

        | Molecule | Distance at minimum (pm) | Energy at minimum (kJ/mol) |
        |---|---|---|
        | H₂ | 74 | −436 |
        | Cl₂ | 199 | −243 |
        | N₂ | 110 | −945 |
      prompt: |
        A fourth curve is drawn for HCl, with its minimum at 127 pm and −432 kJ/mol. Which statement about the H–Cl bond is correct?
      options:
        - "It is nonpolar covalent because its bond energy is close to that of H₂."
        - "It is ionic because hydrogen and chlorine have different electronegativities."
        - "It is polar covalent, with the shared pair drawn toward chlorine, and its length lies between those of H₂ and Cl₂."
        - "It is metallic because hydrogen behaves as a metal in compounds."
      option_explanations:
        - |
          Bond energy does not determine polarity; ΔEN = 0.96 makes H–Cl clearly polar.
        - |
          Both atoms are nonmetals and ΔEN is below 1.7; they share electrons (unequally) rather than transferring them.
        - |
          Correct. Two nonmetals with ΔEN 0.96 share the pair unequally (Cl δ−, H δ+), and a bond between a small atom and a large one is intermediate in length, 127 pm.
        - |
          Hydrogen is a nonmetal; metallic bonding needs delocalised electrons among metal cations.
      answer: 2
      explanation: |
        Classify by the atoms and their electronegativity difference; bond length tracks atom size.

    # ---- Multiple choice (2.1)
    - slug: apchem-u02-w05-q04
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which bond is the most polar? (Electronegativities: H 2.20, C 2.55, N 3.04, O 3.44, F 3.98, Si 1.90)
      options:
        - "C–O"
        - "N–H"
        - "Si–F"
        - "C–F"
      option_explanations:
        - |
          C–O has ΔEN = 0.89, less than C–F or Si–F.
        - |
          N–H has ΔEN = 0.84, the smallest difference listed apart from C–O.
        - |
          Correct. Si–F has ΔEN = 3.98 − 1.90 = 2.08, the largest difference, so the shared electrons are pulled most strongly toward fluorine.
        - |
          C–F has ΔEN = 1.43, large but smaller than Si–F's 2.08.
      answer: 2
      explanation: |
        Polarity grows with electronegativity difference.

    - slug: apchem-u02-w05-q05
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which property of metals is best explained by the electron-sea model of metallic bonding?
      options:
        - "Metals have high ionization energies."
        - "Metals conduct electricity in the solid state because their valence electrons are delocalised and mobile."
        - "Metals form molecules with fixed formulas."
        - "Metals are brittle because their cations repel one another when the lattice is deformed."
      option_explanations:
        - |
          Metals have low ionization energies, which is why their valence electrons are easily delocalised in the first place.
        - |
          Correct. In the model, valence electrons belong to the lattice as a whole and move freely under an applied voltage, so solid metals conduct.
        - |
          Metals form extended lattices, not discrete molecules.
        - |
          Metals are malleable, not brittle: the electron sea keeps the cations bound as they slide past one another. Brittleness from like-charge repulsion describes ionic solids.
      answer: 1
      explanation: |
        Mobile delocalised electrons explain conductivity, thermal conductivity and malleability.

    - slug: apchem-u02-w05-q06
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Hydrogen fluoride has an electronegativity difference of 1.78, yet it is classified as a covalent compound. Which statement best justifies the classification?
      options:
        - "Both hydrogen and fluorine are nonmetals, so neither has a low enough ionization energy to transfer an electron; the pair is shared, though very unequally."
        - "Fluorine is too small to form an ion."
        - "The electronegativity difference is below 1.7 when rounded."
        - "Hydrogen fluoride exists as a gas, and all gases are covalent."
      option_explanations:
        - |
          Correct. Bond type is a continuum, and the element types matter more than a numerical cutoff; HF is a highly polar covalent molecule with discrete H–F units.
        - |
          Fluorine forms F⁻ readily in compounds with metals (NaF, CaF₂); size is not the issue.
        - |
          1.78 is above 1.7, not below; the cutoff is only a rough guide and the atoms involved settle the question.
        - |
          Physical state is not a test of bond type; some ionic compounds can be vaporised, and many covalent compounds are solids.
      answer: 0
      explanation: |
        Metal + nonmetal → ionic; nonmetal + nonmetal → covalent, polar if ΔEN is large.

    - slug: apchem-u02-w05-q07
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Particulate diagram description: Box 1 shows a regular array of alternating large and small spheres marked + and −. Box 2 shows pairs of identical spheres joined together, randomly oriented. Box 3 shows a regular array of identical spheres marked + with many tiny dots scattered among them. Which box represents a metallic solid?
      options:
        - "Box 1, because the regular array shows a lattice."
        - "Box 2, because the paired spheres share electrons."
        - "Box 3, because cations sit in a lattice surrounded by delocalised electrons."
        - "None of the boxes, because metals cannot be drawn at the particulate level."
      option_explanations:
        - |
          Alternating + and − spheres is an ionic lattice (box 1 is something like NaCl).
        - |
          Pairs of bonded identical atoms are diatomic molecules of a nonmetal, held by covalent bonds.
        - |
          Correct. Identical cations in an ordered array with freely moving electrons (the dots) is the electron-sea picture of a metal.
        - |
          Metals are routinely drawn as cation lattices with an electron sea; box 3 is that drawing.
      answer: 2
      explanation: |
        Ionic: + and − lattice. Covalent: molecules. Metallic: cation lattice plus electron sea.

    # ---- Multiple choice (2.2)
    - slug: apchem-u02-w05-q08
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        On the potential-energy curve for two atoms, what happens at distances shorter than the bond length?
      options:
        - "The potential energy keeps decreasing because the atoms attract more strongly."
        - "The potential energy rises steeply because the repulsion between the two nuclei (and between the electron clouds) dominates."
        - "The potential energy becomes zero because the atoms merge."
        - "The potential energy stays at the minimum because the bond length is fixed."
      option_explanations:
        - |
          Attraction does keep growing, but repulsion grows faster at short range, so the net energy rises.
        - |
          Correct. Nuclear–nuclear and electron–electron repulsion overwhelm attraction when the nuclei are squeezed closer than the equilibrium distance, so the curve climbs.
        - |
          Zero is defined at infinite separation; at very short distances the energy is large and positive.
        - |
          The minimum is one point; moving left of it raises the energy, which is what makes the bond length an equilibrium.
      answer: 1
      explanation: |
        The steep left wall of the well is repulsion; the gentle right slope is attraction.

    - slug: apchem-u02-w05-q09
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which list is in order of increasing bond length?
      options:
        - "C≡C < C=C < C–C"
        - "C–C < C=C < C≡C"
        - "C=C < C≡C < C–C"
        - "C–C < C≡C < C=C"
      option_explanations:
        - |
          Correct. More shared pairs pull the nuclei closer: triple (120 pm) is shortest, then double (134 pm), then single (154 pm).
        - |
          This is decreasing length, not increasing; the single bond is the longest.
        - |
          The triple bond is shorter than the double; this order places it between double and single.
        - |
          The triple bond is the shortest, not the middle value.
      answer: 0
      explanation: |
        Higher bond order, shorter bond, higher bond energy.

    - slug: apchem-u02-w05-q10
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Graph description: Two potential-energy curves for pairs of atoms are drawn on the same axes. Curve X has its minimum at 143 pm and −360 kJ/mol. Curve Y has its minimum at 120 pm and −500 kJ/mol. Which conclusion is correct?
      options:
        - "The bond represented by X is shorter and stronger than Y."
        - "The bond represented by Y is shorter and stronger than X."
        - "The bond represented by X is shorter but weaker than Y."
        - "The two bonds have the same strength because both curves reach zero at large distances."
      option_explanations:
        - |
          X's minimum is at a larger distance and a shallower depth: longer and weaker.
        - |
          Correct. Y's minimum is at the smaller distance (120 pm, shorter bond) and the lower energy (−500 kJ/mol, deeper well, stronger bond).
        - |
          X is the longer bond (143 pm), not the shorter.
        - |
          Every curve approaches zero at infinite separation; bond strength is measured by the depth of the well, which differs.
      answer: 1
      explanation: |
        Read the minimum: x-coordinate for length, depth for energy.

    - slug: apchem-u02-w05-q11
      type: multiple_choice
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement about the energy changes in bonds is correct?
      options:
        - "Energy is released when a bond is broken and absorbed when a bond is formed."
        - "Energy is absorbed when a bond is broken and released when a bond is formed."
        - "Energy is released both when a bond breaks and when it forms."
        - "No energy change accompanies bond formation; only bond breaking involves energy."
      option_explanations:
        - |
          This is reversed; separating bonded atoms means climbing out of the potential-energy well, which requires energy.
        - |
          Correct. Breaking a bond is endothermic (the bond energy must be supplied); forming the same bond releases that energy.
        - |
          Breaking and forming are opposite processes with opposite energy signs.
        - |
          Formation releases exactly the bond energy; it is how exothermic reactions release heat.
      answer: 1
      explanation: |
        Break: endothermic. Form: exothermic. Always.

    # ---- Review (1.7, 1.6)
    - slug: apchem-u02-w05-q12
      type: multiple_choice
      topic_code: "1.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Electronegativity is the property used to classify bonds. Which statement about its periodic trend is correct?
      options:
        - "It increases down a group because larger atoms have more electrons to attract."
        - "It is highest for the noble gases because their shells are full."
        - "It decreases across a period as atoms get smaller."
        - "It increases across a period and up a group, because a larger effective nuclear charge at a shorter distance attracts shared electrons more strongly."
      option_explanations:
        - |
          Electronegativity decreases down a group; the valence shell is farther from a more shielded nucleus.
        - |
          Noble gases are usually not assigned electronegativities since they rarely share electrons; fluorine has the highest value.
        - |
          Electronegativity increases across a period; the smaller atom with higher Z_eff attracts electrons more.
        - |
          Correct. Z_eff grows across a period and distance shrinks up a group; both strengthen the Coulombic pull on shared electrons. Fluorine is the extreme.
      answer: 3
      explanation: |
        Review of 1.7, now in use: the electronegativity trend decides bond polarity.

    - slug: apchem-u02-w05-q13
      type: multiple_choice
      topic_code: "1.6"
      source: "general knowledge"
      points: 1
      prompt: |
        A photoelectron spectrum of an element shows its lowest-energy peak at 0.42 MJ/mol with relative height 1, and its 1s peak at 347 MJ/mol. Based on this, which kind of bonding would the element most likely show in its compounds with chlorine?
      options:
        - "Nonpolar covalent, because the element has only one valence electron."
        - "Polar covalent, because 0.42 MJ/mol is a moderate binding energy."
        - "Metallic, because the element has a high 1s binding energy."
        - "Ionic, because a single very loosely held valence electron (0.42 MJ/mol) indicates a metal with a low ionization energy that transfers its electron to chlorine."
      option_explanations:
        - |
          One easily removed valence electron is the signature of an alkali metal, which forms ionic chlorides, not nonpolar covalent ones.
        - |
          0.42 MJ/mol (420 kJ/mol) is one of the lowest ionization energies of any element; such an atom gives its electron up rather than sharing it.
        - |
          Every element has a high 1s binding energy; it says nothing about bonding. The metallic bonding of the element itself is not the question (its compound with chlorine is).
        - |
          Correct. The data match potassium (Z = 19 from the 347 MJ/mol 1s peak; one 4s electron at 0.42 MJ/mol). A low first ionization energy plus chlorine's high electronegativity gives electron transfer: KCl is ionic.
      answer: 3
      explanation: |
        Review of 1.6 and 1.7 applied to 2.1: PES reveals the valence electron count and ionization energy, which predict bond type.

    # ---- Multi-select
    - slug: apchem-u02-w05-q14
      type: multi_select
      topic_code: "2.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following substances contain polar covalent bonds? Select all that apply.
      options:
        - "H₂O"
        - "N₂"
        - "NH₃"
        - "KBr"
        - "CO₂"
      option_explanations:
        - |
          Correct. O–H bonds have ΔEN = 1.24; the electrons are shared unequally with oxygen δ−.
        - |
          N≡N joins two identical atoms; the bond is nonpolar.
        - |
          Correct. N–H bonds (ΔEN 0.84) are polar, with nitrogen δ−.
        - |
          Potassium is a metal and bromine a nonmetal (ΔEN 2.14); KBr is ionic, with no shared pairs.
        - |
          Correct. Each C=O bond (ΔEN 0.89) is polar even though the molecule as a whole is nonpolar by symmetry (a Unit 2 week 7 idea).
      answer: [0, 2, 4]
      explanation: |
        Polar covalent needs two different nonmetals; bond polarity is separate from molecular polarity.

    - slug: apchem-u02-w05-q15
