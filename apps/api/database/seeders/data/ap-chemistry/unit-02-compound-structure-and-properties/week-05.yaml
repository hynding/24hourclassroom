    # ---- Short answer
    - slug: apchem-u02-w05-q23
      type: short_answer
      topic_code: "2.1"
      source: "general knowledge"
      points: 3
      prompt: |
        Three solids are tested: solid A conducts electricity, solid B does not conduct as a solid but conducts when melted, and solid C does not conduct in either state and melts at 80 °C. Answer (a), (b) and (c).

        (a) Identify the type of bonding most likely present in each solid.
        (b) Explain, in terms of the particles present and their mobility, why solid B conducts only when melted.
        (c) Explain why solid C has such a low melting point compared with A and B.
      answer: |
        (a) A: metallic. B: ionic. C: covalent (a molecular solid).
        (b) In solid B the charged particles are ions locked in fixed lattice positions, so no charge carriers can move. Melting frees the ions to move, and mobile ions carry current.
        (c) C consists of discrete molecules held to one another only by weak intermolecular attractions; little energy is needed to separate the molecules, so it melts at a low temperature. A and B require breaking strong metallic or ionic bonds throughout the lattice.
      explanation: |
        Three points, one per part.

        (a) 1 pt: all three identified correctly (metallic, ionic, covalent/molecular).

        (b) 1 pt: ions immobile in the solid, mobile in the liquid; must mention ions as the charge carriers.

        (c) 1 pt: molecules held by weak intermolecular forces versus the strong bonding throughout a metallic or ionic lattice.

    - slug: apchem-u02-w05-q24
      type: short_answer
      topic_code: "2.2"
      source: "NIST Chemistry WebBook (bond data, rounded)"
      points: 3
      stimulus: |
        | Bond | Bond length (pm) | Bond energy (kJ/mol) |
        |---|---|---|
        | H–F | 92 | 567 |
        | H–Cl | 127 | 432 |
        | H–Br | 141 | 366 |
        | H–I | 161 | 299 |
      prompt: |
        Use the table to answer (a), (b) and (c).

        (a) Describe the relationship between bond length and bond energy shown by the data.
        (b) Explain the trend in bond length in terms of atomic structure.
        (c) Explain, using Coulomb's law, why the H–F bond is the strongest of the four.
      answer: |
        (a) As the bond length increases from H–F to H–I, the bond energy decreases: longer bonds are weaker.
        (b) Going down group 17 each halogen adds a shell, so its valence electrons and atomic radius are larger (F < Cl < Br < I). The hydrogen nucleus cannot approach a larger atom as closely, so the internuclear distance grows.
        (c) In H–F the shared electrons are very close to both nuclei (92 pm) and fluorine's high effective nuclear charge pulls them strongly. Coulomb's law makes the attraction larger when the charges are closer, so more energy is needed to pull the atoms apart; in H–I the shared pair is far from the iodine nucleus and shielded by many inner electrons, so the attraction is weaker.
      explanation: |
        Three points, one per part.

        (a) 1 pt: inverse relationship stated (longer = weaker).

        (b) 1 pt: larger halogen atoms (added shells) force a longer bond.

        (c) 1 pt: shorter distance (and higher Z_eff of F) gives stronger Coulombic attraction, hence higher bond energy.

    # ---- Long answer
    - slug: apchem-u02-w05-q25
      type: long_answer
      topic_code: "2.2"
      source: "NIST Chemistry WebBook (bond data, rounded)"
      points: 6
      stimulus: |
        Graph description: A potential-energy diagram shows two curves for pairs of oxygen atoms. Curve 1 has its minimum at 121 pm and −498 kJ/mol. Curve 2 has its minimum at 148 pm and −142 kJ/mol. Both curves approach zero energy at large separations and rise steeply at short separations.
      prompt: |
        Curve 1 represents the O=O bond in O₂ and curve 2 represents the O–O single bond in hydrogen peroxide, H₂O₂.

        (a) Explain why the potential energy of two oxygen atoms is defined as zero at large separations and becomes negative as the atoms approach.
        (b) Identify which curve has the shorter bond and which has the stronger bond, and explain why the two differences are consistent with each other.
        (c) Explain in terms of shared electrons why the bond in O₂ is both shorter and stronger than the O–O bond in H₂O₂.
        (d) Calculate the energy required to break the O=O bonds in 8.00 g of O₂ (32.00 g/mol).
        (e) A student states that because the O=O bond energy (498 kJ/mol) is more than three times the O–O bond energy (142 kJ/mol), a double bond must consist of two bonds each stronger than a single bond. Evaluate this claim.
      answer: |
        (a) At infinite separation the atoms do not interact, which is the convenient reference for zero. As they approach, each atom's electrons are attracted to the other's nucleus and electron density builds up between the nuclei, so the system's energy drops below that of the separated atoms; a negative energy means the pair is more stable bonded than apart.

        (b) Curve 1 has the shorter bond (121 pm versus 148 pm) and the stronger bond (498 versus 142 kJ/mol). They are consistent: in a shorter bond the shared electrons are closer to both nuclei, so by Coulomb's law the attraction is greater and more energy is needed to pull the atoms apart.

        (c) O₂ has a double bond, two shared pairs, while H₂O₂ has a single O–O bond with one shared pair. Twice the electron density between the nuclei attracts both nuclei more strongly, drawing them closer and deepening the well.

        (d) 8.00 ÷ 32.00 = 0.250 mol O₂; 0.250 mol × 498 kJ/mol = 125 kJ.

        (e) The claim is not justified. A double bond is one σ bond plus one π bond; the π bond has poorer orbital overlap than the σ bond and is weaker, so a double bond is usually less than twice a single bond (C=C 614 against 2 × 348 = 696 kJ/mol). The O–O single bond in H₂O₂ is unusually weak because the lone pairs on the two small, adjacent oxygen atoms repel each other, which makes the ratio look large; the comparison does not show that each component of the double bond is stronger than a normal single bond.
      explanation: |
        Six points.

        (a) 1 pt: zero at infinite separation as the reference; negative energy from net attraction as the atoms approach.

        (b) 1 pt: curve 1 both shorter and stronger, with the Coulombic link between shorter distance and stronger attraction.

        (c) 1 pt: double bond (two shared pairs) versus single bond; more electron density between the nuclei.

        (d) 1 pt: 0.250 mol and 125 kJ (accept 124–125).

        (e) 2 pts: 1 pt for rejecting the claim with the σ/π reasoning (a second shared pair adds less than the first); 1 pt for recognising the O–O single bond is anomalously weak because of lone-pair repulsion, so the ratio overstates the general case. A student who gives only the σ/π argument earns 1 pt.
