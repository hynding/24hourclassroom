    # ---- True / false
    - slug: apchem-u02-w05-q16
      type: true_false
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: On a potential-energy diagram for two atoms, the bond length is the distance at which the potential energy is lowest.
      answer: true
      explanation: |
        True. The minimum of the curve is the equilibrium separation where attraction and repulsion balance; that distance is the bond length (74 pm for H₂), and the depth of the well is the bond energy.

    - slug: apchem-u02-w05-q17
      type: true_false
      topic_code: "1.8"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: The compound formed between barium and chlorine has the formula BaCl, because each barium atom transfers one electron to one chlorine atom.
      answer: false
      explanation: |
        False. Barium ([Xe] 6s²) loses two electrons to form Ba²⁺, and each chlorine accepts one, so two Cl⁻ are needed: BaCl₂. The transfer is ionic bonding, and the formula follows from charge balance.

