unit: 4
description: |
  40 questions · about 75 minutes · every topic of Unit 4 (4.1 to 4.9): balancing and evidence of reaction, net
  ionic equations, particulate representations, physical and chemical change, stoichiometry and limiting
  reactant, titration, types of reactions, acid–base and redox, with review of Units 1 to 3. Three data-based
  sets in the AP style (a precipitation in solution, a titration of an unknown acid and a metal–acid reaction),
  select-all, true/false, fill-in-the-blank and numeric items, two short-answer questions (3 points each) and
  one long free-response question (6 points). Multiple choice, select-all, true/false and numeric items are
  graded at once; fill-in-the-blank items are matched automatically; the free-response items are graded by your
  teacher against the scoring notes. Calculator and periodic table allowed.
questions:
  # ---- Stimulus set A: calcium carbonate precipitation (4.2, 4.5, 3.7)
  - slug: apchem-u04-exam-q01
    type: multiple_choice
    topic_code: "4.2"
    source: "PubChem (molar masses)"
    points: 1
    stimulus: |
      30.0 mL of 0.200 M sodium carbonate solution is mixed with 40.0 mL of 0.100 M calcium chloride solution. A white precipitate of calcium carbonate (100.09 g/mol) forms. Assume the volumes are additive and the precipitation is complete.
    prompt: |
      Which is the net ionic equation for the reaction?
    options:
      - "Na₂CO₃(aq) + CaCl₂(aq) → CaCO₃(s) + 2 NaCl(aq)"
      - "2 Na⁺(aq) + 2 Cl⁻(aq) → 2 NaCl(aq)"
      - "Ca²⁺(aq) + CO₃²⁻(aq) → CaCO₃(s)"
      - "Ca²⁺(aq) + 2 Cl⁻(aq) + 2 Na⁺(aq) + CO₃²⁻(aq) → CaCO₃(s) + 2 NaCl(s)"
    option_explanations:
      - |
        This is the molecular equation; the spectators are still inside the formulas.
      - |
        Sodium and chloride are the spectators; they do not combine (NaCl is soluble).
      - |
        Correct. Only calcium and carbonate ions change state, forming the insoluble solid; Na⁺ and Cl⁻ remain dissolved and are cancelled.
      - |
        NaCl is soluble and should be written as separate aqueous ions, which then cancel.
    answer: 2
    explanation: |
      Precipitating ions only.

  - slug: apchem-u04-exam-q02
    type: multiple_choice
    topic_code: "4.5"
    source: "PubChem (molar masses)"
    points: 1
    stimulus: |
      30.0 mL of 0.200 M sodium carbonate solution is mixed with 40.0 mL of 0.100 M calcium chloride solution. A white precipitate of calcium carbonate (100.09 g/mol) forms. Assume the volumes are additive and the precipitation is complete.
    prompt: |
      What mass of calcium carbonate precipitates?
    options:
      - "0.400 g"
      - "0.600 g"
      - "1.00 g"
      - "0.200 g"
    option_explanations:
      - |
        Correct. Na₂CO₃: 0.0300 × 0.200 = 0.00600 mol; CaCl₂: 0.0400 × 0.100 = 0.00400 mol; the 1 : 1 reaction makes Ca²⁺ limiting, so 0.00400 mol CaCO₃ × 100.09 = 0.400 g.
      - |
        0.600 g uses the carbonate, which is in excess; the smaller amount of calcium limits the product.
      - |
        1.00 g adds the moles of the two reactants, which is not how a 1 : 1 reaction works.
      - |
        0.200 g halves the correct value; nothing in the stoichiometry calls for dividing by two.
    answer: 0
    explanation: |
      Limiting Ca²⁺: 0.00400 mol × 100.09 g/mol.

  - slug: apchem-u04-exam-q03
    type: multiple_choice
    topic_code: "3.7"
    source: "general knowledge"
    points: 1
    stimulus: |
      30.0 mL of 0.200 M sodium carbonate solution is mixed with 40.0 mL of 0.100 M calcium chloride solution. A white precipitate of calcium carbonate (100.09 g/mol) forms. Assume the volumes are additive and the precipitation is complete.
    prompt: |
      What is the concentration of sodium ions in the solution after the reaction?
    options:
      - "0.0857 M"
      - "0.400 M"
      - "0.200 M"
      - "0.171 M"
    option_explanations:
      - |
        0.0857 M counts one Na⁺ per Na₂CO₃; each formula unit supplies two.
      - |
        0.400 M is the sodium concentration in the original carbonate solution before the volume grew to 70.0 mL.
      - |
        0.200 M is the molarity of the carbonate solution, not of sodium in the mixture.
      - |
        Correct. Na⁺ is a spectator: 2 × 0.00600 = 0.0120 mol in 0.0700 L = 0.171 M.
    answer: 3
    explanation: |
      Spectator moles unchanged; divide by the total volume.

  # ---- Reactions and representations (4.1–4.4)
  - slug: apchem-u04-exam-q04
    type: multiple_choice
    topic_code: "4.1"
    source: "general knowledge"
    points: 1
    prompt: |
      When the combustion of ethane, C₂H₆ + O₂ → CO₂ + H₂O, is balanced with the smallest whole-number coefficients, what is the coefficient of O₂?
    options:
      - "3"
      - "7"
      - "5"
      - "14"
    option_explanations:
      - |
        3 O₂ supplies only 6 oxygen atoms, but one ethane needs 7 (two CO₂ and three H₂O); the fraction 7/2 must be cleared by doubling.
      - |
        Correct. 2 C₂H₆ + 7 O₂ → 4 CO₂ + 6 H₂O: oxygen atoms 14 on each side.
      - |
        5 O₂ balances propane's combustion, not ethane's.
      - |
        14 is the number of oxygen atoms, not the coefficient of O₂ molecules.
    answer: 1
    explanation: |
      2 C₂H₆ + 7 O₂ → 4 CO₂ + 6 H₂O.

  - slug: apchem-u04-exam-q05
    type: multiple_choice
    topic_code: "4.1"
    source: "general knowledge"
    points: 1
    prompt: |
      A student heats a sample of a white solid. It melts, then refreezes unchanged on cooling. A second sample, placed in acid, fizzes and the solid disappears. Which conclusion is best supported?
    options:
      - "Both observations indicate chemical changes."
      - "Melting was a chemical change; fizzing was physical."
      - "Neither observation indicates a chemical change."
      - "Melting was a physical change; the fizzing indicates a chemical change in which a gas was produced."
    option_explanations:
      - |
        Melting and refreezing unchanged is a change of state, not of substance.
      - |
        The classifications are reversed: melting and refreezing unchanged is physical, while gas evolution from a solid in acid is chemical.
      - |
        The production of a gas from a solid and an acid is strong evidence of a new substance.
      - |
        Correct. Melting leaves the substance intact (physical); gas evolution means bonds have broken and formed to make a new substance (chemical).
    answer: 3
    explanation: |
      Phase change = physical; gas evolution = chemical.

  - slug: apchem-u04-exam-q06
    type: multiple_choice
    topic_code: "4.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Which species is correctly written as separate ions in a complete ionic equation?
    options:
      - "HBr(aq), as H⁺(aq) + Br⁻(aq)"
      - "CH₃COOH(aq), as H⁺(aq) + CH₃COO⁻(aq)"
      - "BaSO₄(s), as Ba²⁺(aq) + SO₄²⁻(aq)"
      - "NH₃(aq), as NH₄⁺(aq) + OH⁻(aq)"
    option_explanations:
      - |
        Correct. Hydrobromic acid is one of the six strong acids and is completely ionised in water.
      - |
        Acetic acid is weak and mostly molecular; it is written as CH₃COOH.
      - |
        Barium sulfate is an insoluble solid; it stays as BaSO₄(s).
      - |
        Ammonia is a weak base; only a small fraction forms NH₄⁺ and OH⁻, so it is written as NH₃.
    answer: 0
    explanation: |
      Only strong electrolytes are split.

  - slug: apchem-u04-exam-q07
    type: multiple_choice
    topic_code: "4.3"
    source: "general knowledge"
    points: 1
    prompt: |
      A particulate "before" box shows 6 molecules of H₂ and 2 molecules of N₂. For the reaction N₂ + 3 H₂ → 2 NH₃, which "after" box is correct?
    options:
      - "4 NH₃ and 2 H₂"
      - "6 NH₃ and nothing else"
      - "2 NH₃, 1 N₂ and 3 H₂"
      - "4 NH₃ and nothing else"
    option_explanations:
      - |
        Four NH₃ consume all 6 H₂ (3 per N₂), so no H₂ can remain.
      - |
        Six NH₃ would need 6 N atoms, but only 4 are present.
      - |
        This is an incomplete reaction; the question assumes the reaction goes to completion and the reactants are in exact ratio.
      - |
        Correct. 2 N₂ need 6 H₂ exactly: 2 : 6 is the 1 : 3 ratio, giving 4 NH₃ with nothing left over; atoms: 4 N, 12 H each side.
    answer: 3
    explanation: |
      Exact stoichiometric ratio: 4 NH₃, no leftovers.

  - slug: apchem-u04-exam-q08
    type: multiple_choice
    topic_code: "4.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Which process involves breaking covalent bonds within molecules and is therefore a chemical change?
    options:
      - "Liquid bromine evaporating"
      - "Hydrogen peroxide decomposing to water and oxygen"
      - "Ethanol dissolving in water"
      - "Iodine subliming"
    option_explanations:
      - |
        Evaporation separates Br₂ molecules held by dispersion forces; the Br–Br bond survives.
      - |
        Correct. The O–O bond in H₂O₂ breaks and new O=O and O–H arrangements form; H₂O and O₂ are new substances.
      - |
        Mixing replaces hydrogen bonds with other hydrogen bonds; both molecules stay intact.
      - |
        Sublimation frees I₂ molecules from the lattice unchanged.
    answer: 1
    explanation: |
      Decomposition = bonds broken = chemical.

  - slug: apchem-u04-exam-q09
    type: multiple_choice
    topic_code: "4.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Hydrogen chloride gas is bubbled into water. Which statement best describes the process at the particulate level?
    options:
      - "HCl molecules disperse among water molecules, held by dipole–dipole forces, in a physical change."
      - "HCl molecules form hydrogen bonds with water and remain intact."
      - "The H–Cl bond breaks as the proton transfers to water, forming H₃O⁺ and Cl⁻, a chemical change."
      - "HCl molecules decompose into H₂ and Cl₂."
    option_explanations:
      - |
        HCl does not remain molecular in water; it ionises completely.
      - |
        Essentially no intact HCl molecules remain in the solution.
      - |
        Correct. A covalent bond breaks and a new O–H bond forms in hydronium; the solution contains new species, so this is a chemical change.
      - |
        No hydrogen or chlorine gas forms; the proton is transferred to water.
    answer: 2
    explanation: |
      Dissolving HCl is a proton transfer: chemical.

  # ---- Stimulus set B: titrating an unknown monoprotic acid (4.6, 4.8)
  - slug: apchem-u04-exam-q10
    type: multiple_choice
    topic_code: "4.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      A 0.2525 g sample of an unknown weak monoprotic acid, HA, is dissolved in about 50 mL of water and titrated with 0.1000 M sodium hydroxide using phenolphthalein. The end point is reached after 20.65 mL of titrant.
    prompt: |
      How many moles of the acid were in the sample?
    options:
      - "2.065 × 10⁻³ mol"
      - "4.130 × 10⁻³ mol"
      - "1.033 × 10⁻³ mol"
      - "2.065 × 10⁻² mol"
    option_explanations:
      - |
        Correct. n(NaOH) = 0.02065 L × 0.1000 M = 2.065 × 10⁻³ mol; HA + OH⁻ → A⁻ + H₂O is 1 : 1, so the acid is 2.065 × 10⁻³ mol.
      - |
        Doubling would apply to a diprotic acid; HA has one acidic proton.
      - |
        Halving would apply if two acid molecules reacted with each OH⁻, which they do not.
      - |
        This uses the volume in mL as if it were in decilitres; 20.65 mL is 0.02065 L.
    answer: 0
    explanation: |
      Moles of base = moles of monoprotic acid.

  - slug: apchem-u04-exam-q11
    type: multiple_choice
    topic_code: "4.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      A 0.2525 g sample of an unknown weak monoprotic acid, HA, is dissolved in about 50 mL of water and titrated with 0.1000 M sodium hydroxide using phenolphthalein. The end point is reached after 20.65 mL of titrant.
    prompt: |
      What is the molar mass of the acid?
    options:
      - "61.1 g/mol"
      - "244 g/mol"
      - "122 g/mol"
      - "12.2 g/mol"
    option_explanations:
      - |
        61.1 g/mol would follow from doubling the moles of acid.
      - |
        244 g/mol would follow from halving the moles of acid.
      - |
        Correct. M = mass ÷ moles = 0.2525 g ÷ 2.065 × 10⁻³ mol = 122.3 g/mol (consistent with benzoic acid, C₆H₅COOH, 122.12 g/mol).
      - |
        12.2 g/mol uses the volume in mL as litres; no acid has a molar mass this small.
    answer: 2
    explanation: |
      M = m/n.

  - slug: apchem-u04-exam-q12
    type: multiple_choice
    topic_code: "4.8"
    source: "general knowledge"
    points: 1
    stimulus: |
      A 0.2525 g sample of an unknown weak monoprotic acid, HA, is dissolved in about 50 mL of water and titrated with 0.1000 M sodium hydroxide using phenolphthalein. The end point is reached after 20.65 mL of titrant.
    prompt: |
      Which net ionic equation represents the titration reaction, and which species is the conjugate base of the acid?
    options:
      - "H⁺(aq) + OH⁻(aq) → H₂O(l); the conjugate base is OH⁻"
      - "HA(aq) + OH⁻(aq) → A⁻(aq) + H₂O(l); the conjugate base is A⁻"
      - "HA(aq) + Na⁺(aq) → NaA(s) + H⁺(aq); the conjugate base is Na⁺"
      - "HA(aq) + H₂O(l) → H₃O⁺(aq) + A⁻(aq); the conjugate base is H₃O⁺"
    option_explanations:
      - |
        HA is weak, so it is written as the molecule, and OH⁻ is the conjugate base of water, not of HA.
      - |
        Correct. The weak acid donates its proton to hydroxide; A⁻ is what remains of HA after losing one H⁺, its conjugate base. Na⁺ is the spectator.
      - |
        Sodium ions are spectators and form no solid; a cation cannot be a conjugate base of HA.
      - |
        This is the ionisation of HA in water, not the titration reaction, and H₃O⁺ is the conjugate acid of water.
    answer: 1
    explanation: |
      Weak acid as molecule; conjugate base = HA − H⁺.

  # ---- Titration, types, acid–base, redox (4.6–4.9)
  - slug: apchem-u04-exam-q13
    type: multiple_choice
    topic_code: "4.6"
    source: "general knowledge"
    points: 1
    prompt: |
      In an acid–base titration, the student's pipette was rinsed with distilled water immediately before being used to transfer the acid sample into the flask. How does this affect the calculated concentration of the acid?
    options:
      - "Too high, because extra water in the pipette increases the volume delivered."
      - "No effect, because water does not react with the base."
      - "Too high, because the diluted acid requires more base."
      - "Too low, because the water dilutes the acid in the pipette, so fewer moles of acid are delivered than the pipette's volume implies."
    option_explanations:
      - |
        The pipette still delivers its calibrated volume, but that volume is now partly water; the delivered moles of acid fall.
      - |
        Water does not react, but it displaces acid in the pipette, reducing the moles delivered and the titrant needed.
      - |
        A diluted sample requires less base, not more, because fewer moles of acid are present.
      - |
        Correct. The calculation assumes the pipette delivered 25.00 mL of undiluted acid; the smaller titrant volume is read as a lower concentration.
    answer: 3
    explanation: |
      Diluted analyte → fewer moles delivered → concentration too low.

  - slug: apchem-u04-exam-q14
    type: multiple_choice
    topic_code: "4.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Solid calcium carbonate is heated strongly, producing calcium oxide and carbon dioxide. How is the reaction classified?
    options:
      - "Decomposition; not redox, because every element keeps its oxidation state"
      - "Decomposition and redox, because a gas is released"
      - "Single replacement, because oxygen leaves the solid"
      - "Combustion, because heat is involved"
    option_explanations:
      - |
        Correct. One compound becomes two (decomposition); Ca stays +2, C +4 and O −2 throughout, so no electrons are transferred.
      - |
        Releasing a gas is not the test for redox; oxidation numbers are unchanged here.
      - |
        No free element displaces another; CO₂ is a compound, not an element.
      - |
        Combustion is reaction with oxygen; here oxygen is not a reactant.
    answer: 0
    explanation: |
      Decomposition without a change in oxidation state.

  - slug: apchem-u04-exam-q15
    type: multiple_choice
    topic_code: "4.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Which combination produces a single replacement reaction?
    options:
      - "Copper wire in zinc sulfate solution"
      - "Silver wire in dilute hydrochloric acid"
      - "Zinc granules in copper(II) nitrate solution"
      - "Sodium chloride solution added to potassium nitrate solution"
    option_explanations:
      - |
        Copper is below zinc in the activity series and cannot displace it; no reaction.
      - |
        Silver is below hydrogen; it does not release H₂ from acids.
      - |
        Correct. Zinc is above copper, so Zn + Cu²⁺ → Zn²⁺ + Cu: the zinc darkens with copper and the blue colour fades.
      - |
        Both possible products are soluble; this is not even a double replacement, let alone a single one.
    answer: 2
    explanation: |
      Activity series: Zn above Cu.

  - slug: apchem-u04-exam-q16
    type: multiple_choice
    topic_code: "4.8"
    source: "general knowledge"
    points: 1
    prompt: |
      In the reaction H₂PO₄⁻(aq) + CO₃²⁻(aq) ⇌ HPO₄²⁻(aq) + HCO₃⁻(aq), which pair is a conjugate acid–base pair?
    options:
      - "H₂PO₄⁻ and CO₃²⁻"
      - "H₂PO₄⁻ and HPO₄²⁻"
      - "CO₃²⁻ and HPO₄²⁻"
      - "H₂PO₄⁻ and HCO₃⁻"
    option_explanations:
      - |
        These are the two reactants (an acid and a base), but they do not differ by one proton.
      - |
        Correct. H₂PO₄⁻ (acid) loses one proton to become HPO₄²⁻ (its conjugate base). The other pair is CO₃²⁻/HCO₃⁻.
      - |
        These are both bases of different acids; they are not related by a single proton transfer.
      - |
        HCO₃⁻ is the conjugate acid of CO₃²⁻, not of H₂PO₄⁻.
    answer: 1
    explanation: |
      Conjugate pairs differ by exactly one H⁺.

  - slug: apchem-u04-exam-q17
    type: multiple_choice
    topic_code: "4.9"
    source: "general knowledge"
    points: 1
    prompt: |
      In which species does sulfur have the highest oxidation number?
    options:
      - "H₂S"
      - "S₈"
      - "SO₂"
      - "H₂SO₄"
    option_explanations:
      - |
        In H₂S sulfur is −2, its lowest common oxidation state.
      - |
        Elemental sulfur, like every free element, has an oxidation number of 0, below the positive values in its oxides.
      - |
        In SO₂ sulfur is +4 (x + 2(−2) = 0), high but not the maximum; sulfur reaches +6 in sulfuric acid.
      - |
        Correct. In H₂SO₄, 2(+1) + x + 4(−2) = 0 gives x = +6, sulfur's maximum.
    answer: 3
    explanation: |
      −2, 0, +4, +6.

  # ---- Stimulus set C: magnesium in hydrochloric acid (4.9, 4.5, 3.4)
  - slug: apchem-u04-exam-q18
    type: multiple_choice
    topic_code: "4.9"
    source: "PubChem (molar masses)"
    points: 1
    stimulus: |
      A student drops 0.243 g of magnesium ribbon (24.31 g/mol) into 50.0 mL of 0.500 M hydrochloric acid and collects the hydrogen gas: Mg(s) + 2 HCl(aq) → MgCl₂(aq) + H₂(g). The laboratory is at 298 K and 1.00 atm; R = 0.08206 L·atm/(mol·K).
    prompt: |
      Which statement about the electron transfer in this reaction is correct?
    options:
      - "Magnesium is oxidised from 0 to +2 and is the reducing agent; H⁺ is reduced from +1 to 0 and is the oxidising agent."
      - "Magnesium is reduced and is the oxidising agent; hydrogen is oxidised."
      - "Chloride is oxidised from −1 to 0, releasing chlorine gas."
      - "No electrons are transferred; this is an acid–base reaction."
    option_explanations:
      - |
        Correct. Mg loses two electrons (0 → +2) and so is the reducing agent; each pair of H⁺ gains them to form H₂ (+1 → 0), so H⁺ is the oxidising agent. Cl⁻ is a spectator.
      - |
        The roles are reversed: magnesium loses electrons, which is oxidation.
      - |
        Chloride stays −1 throughout; the gas evolved is hydrogen, not chlorine.
      - |
        A free element appears and another disappears; oxidation states change, so this is redox (a single replacement).
    answer: 0
    explanation: |
      Metal + acid: metal oxidised, H⁺ reduced.

  - slug: apchem-u04-exam-q19
    type: multiple_choice
    topic_code: "4.5"
    source: "PubChem (molar masses)"
    points: 1
    stimulus: |
      A student drops 0.243 g of magnesium ribbon (24.31 g/mol) into 50.0 mL of 0.500 M hydrochloric acid and collects the hydrogen gas: Mg(s) + 2 HCl(aq) → MgCl₂(aq) + H₂(g). The laboratory is at 298 K and 1.00 atm; R = 0.08206 L·atm/(mol·K).
    prompt: |
      Which reactant is limiting, and how many moles of H₂ are produced?
    options:
      - "HCl is limiting; 0.0125 mol H₂"
      - "HCl is limiting; 0.0250 mol H₂"
      - "Mg is limiting; 0.0100 mol H₂"
      - "Mg is limiting; 0.0200 mol H₂"
    option_explanations:
      - |
        HCl (0.0250 mol ÷ 2 = 0.0125) has the larger quotient; it is in excess, not limiting.
      - |
        HCl is in excess, and even if it limited, 0.0250 mol HCl would give only 0.0125 mol H₂.
      - |
        Correct. Mg: 0.243 ÷ 24.31 = 0.0100 mol ÷ 1 = 0.0100; HCl: 0.0500 × 0.500 = 0.0250 mol ÷ 2 = 0.0125. Mg limits, and the 1 : 1 Mg : H₂ ratio gives 0.0100 mol H₂.
      - |
        Magnesium is limiting, but each Mg gives one H₂, not two.
    answer: 2
    explanation: |
      Smallest moles ÷ coefficient: Mg.

  - slug: apchem-u04-exam-q20
    type: multiple_choice
    topic_code: "3.4"
    source: "NIST CODATA constants"
    points: 1
    stimulus: |
      A student drops 0.243 g of magnesium ribbon (24.31 g/mol) into 50.0 mL of 0.500 M hydrochloric acid and collects the hydrogen gas: Mg(s) + 2 HCl(aq) → MgCl₂(aq) + H₂(g). The laboratory is at 298 K and 1.00 atm; R = 0.08206 L·atm/(mol·K).
    prompt: |
      What volume of dry hydrogen gas is expected at the laboratory conditions?
    options:
      - "0.224 L"
      - "0.245 L"
      - "0.489 L"
      - "2.45 L"
    option_explanations:
      - |
        0.224 L uses 22.4 L/mol, which applies at 273 K, not 298 K.
      - |
        Correct. V = nRT/P = (0.0100)(0.08206)(298) ÷ 1.00 = 0.245 L.
      - |
        0.489 L doubles the moles of hydrogen; each Mg gives one H₂.
      - |
        2.45 L is ten times too large, from using 0.100 mol instead of 0.0100 mol.
    answer: 1
    explanation: |
      PV = nRT at 298 K.

  - slug: apchem-u04-exam-q21
    type: multiple_choice
    topic_code: "4.9"
    source: "general knowledge"
    points: 1
    prompt: |
      Which is the correctly balanced half-reaction for the reduction of dichromate ion to chromium(III) ion in acidic solution?
    options:
      - "Cr₂O₇²⁻ + 14 H⁺ → 2 Cr³⁺ + 7 H₂O + 6 e⁻"
      - "Cr₂O₇²⁻ + 7 H⁺ + 3 e⁻ → Cr³⁺ + 7 H₂O"
      - "Cr₂O₇²⁻ + 6 e⁻ → 2 Cr³⁺ + 7 O²⁻"
      - "Cr₂O₇²⁻ + 14 H⁺ + 6 e⁻ → 2 Cr³⁺ + 7 H₂O"
    option_explanations:
      - |
        A reduction gains electrons; with the electrons on the product side the charge is +12 on the left and 0 on the right.
      - |
        Chromium is not balanced (two on the left, one on the right) and the hydrogen count does not match the seven waters.
      - |
        Free oxide ions do not exist in aqueous solution; oxygen is balanced with water and hydrogen with H⁺.
      - |
        Correct. Atoms: Cr 2/2, O 7/7, H 14/14. Charge: −2 + 14 − 6 = +6 on the left; 2(+3) = +6 on the right. Each chromium goes from +6 to +3.
    answer: 3
    explanation: |
      Six electrons per dichromate.

  # ---- Review (Units 1–3)
  - slug: apchem-u04-exam-q22
    type: multiple_choice
    topic_code: "1.3"
    source: "PubChem (molar masses)"
    points: 1
    prompt: |
      Complete combustion of 0.500 mol of a hydrocarbon produces 1.00 mol of CO₂ and 1.50 mol of H₂O. What is the molecular formula of the hydrocarbon?
    options:
      - "C₂H₆"
      - "CH₃"
      - "C₂H₃"
      - "C₄H₁₂"
    option_explanations:
      - |
        Correct. Per mole of hydrocarbon: 2 mol C (from 1.00 ÷ 0.500) and 6 mol H (from 2 × 1.50 ÷ 0.500), so C₂H₆, ethane.
      - |
        CH₃ is the empirical ratio, but the data give the amounts per mole of compound directly: 2 C and 6 H.
      - |
        C₂H₃ counts one hydrogen per water molecule; each H₂O contains two.
      - |
        C₄H₁₂ doubles the correct formula and is not a real alkane (C₄ would be C₄H₁₀).
    answer: 0
    explanation: |
      Moles of C and H per mole of compound.

  - slug: apchem-u04-exam-q23
    type: multiple_choice
    topic_code: "3.10"
    source: "general knowledge"
    points: 1
    prompt: |
      Silver chloride is insoluble in water, while silver nitrate dissolves readily. Which statement best explains the difference in terms of intermolecular and interparticle forces?
    options:
      - "Nitrate ions are larger, so they fit between water molecules more easily."
      - "Silver nitrate is a molecular compound and dissolves by hydrogen bonding."
      - "The ion–dipole attractions water forms with Ag⁺ and NO₃⁻ are sufficient to overcome the lattice energy of AgNO₃, but not strong enough relative to the lattice energy of AgCl."
      - "Chloride ions react with water to form HCl, which escapes as a gas."
    option_explanations:
      - |
        Fitting between water molecules is not the issue; the balance of lattice energy against hydration energy is.
      - |
        Silver nitrate is ionic; it dissolves by ion–dipole attraction, not hydrogen bonding.
      - |
        Correct. Dissolving requires the hydration of the ions to compensate for the lattice energy; for AgCl the lattice is too strongly held relative to what hydration returns.
      - |
        Chloride does not react with water to give HCl; AgCl simply does not dissolve.
    answer: 2
    explanation: |
      Solubility is a balance of lattice energy against ion–dipole hydration.

  - slug: apchem-u04-exam-q24
    type: multiple_choice
    topic_code: "3.13"
    source: "general knowledge"
    points: 1
    prompt: |
      Instead of titrating, a student determines the concentration of a coloured copper(II) solution with a spectrophotometer. A calibration curve from standards gives A = 12.5 × [Cu²⁺] (1.00 cm cuvette). The unknown reads A = 0.350. What is [Cu²⁺]?
    options:
      - "4.38 M"
      - "0.0280 M"
      - "0.350 M"
      - "0.0875 M"
    option_explanations:
      - |
        4.38 M multiplies the absorbance by the slope instead of dividing.
      - |
        Correct. [Cu²⁺] = A ÷ slope = 0.350 ÷ 12.5 M⁻¹ = 0.0280 M.
      - |
        0.350 is the absorbance, which is unitless and must be converted through the calibration slope.
      - |
        0.0875 M divides by 4 for no reason; the slope is 12.5 M⁻¹.
    answer: 1
    explanation: |
      c = A ÷ (εb).

  # ---- Multi-select
  - slug: apchem-u04-exam-q25
    type: multi_select
    topic_code: "4.2"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which of the following pairs of aqueous solutions react when mixed, and are correctly matched with the net ionic equation? Select all that apply.
    options:
      - "KOH + HClO₄: H⁺ + OH⁻ → H₂O"
      - "Na₂S + Pb(NO₃)₂: Pb²⁺ + S²⁻ → PbS(s)"
      - "NaBr + KNO₃: Na⁺ + NO₃⁻ → NaNO₃(aq)"
      - "NH₄Cl + NaOH: NH₄⁺ + OH⁻ → NH₃ + H₂O"
      - "MgCl₂ + Na₂SO₄: Mg²⁺ + SO₄²⁻ → MgSO₄(s)"
    option_explanations:
      - |
        Correct. Perchloric acid is strong and KOH is a strong base; K⁺ and ClO₄⁻ are spectators.
      - |
        Correct. Lead(II) sulfide is insoluble; Na⁺ and NO₃⁻ are spectators.
      - |
        Incorrect, so it should not be selected. All possible products are soluble; nothing reacts and there is no net ionic equation.
      - |
        Correct. The ammonium ion (a weak acid) donates a proton to hydroxide, giving ammonia and water; Na⁺ and Cl⁻ are spectators.
      - |
        Incorrect, so it should not be selected. Magnesium sulfate is soluble; no precipitate forms and no reaction occurs.
    answer: [0, 1, 3]
    explanation: |
      Reactions need a precipitate, gas, water or weak-electrolyte product.

  - slug: apchem-u04-exam-q26
    type: multi_select
    topic_code: "4.9"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Consider the reaction 2 Fe³⁺(aq) + Sn²⁺(aq) → 2 Fe²⁺(aq) + Sn⁴⁺(aq). Which statements are correct? Select all that apply.
    options:
      - "Sn²⁺ is oxidised."
      - "Fe³⁺ is the oxidising agent."
      - "Two moles of electrons are transferred per mole of Sn²⁺."
      - "Fe³⁺ is the reducing agent."
      - "Iron's oxidation number increases."
    option_explanations:
      - |
        Correct. Tin goes from +2 to +4, losing two electrons.
      - |
        Correct. Fe³⁺ accepts the electrons (reduced to Fe²⁺), so it is the oxidising agent.
      - |
        Correct. Each Sn²⁺ loses two electrons, which reduce two Fe³⁺.
      - |
        Incorrect, so it should not be selected. Fe³⁺ is reduced; the reducing agent is Sn²⁺.
      - |
        Incorrect, so it should not be selected. Iron goes from +3 to +2, a decrease.
    answer: [0, 1, 2]
    explanation: |
      Sn oxidised (+2 → +4), Fe reduced (+3 → +2).

  - slug: apchem-u04-exam-q27
    type: multi_select
    topic_code: "4.4"
    source: "general knowledge"
    points: 2
    partial_credit: true
    prompt: |
      Which of the following are physical changes, in which no bonds within the particles are broken or formed? Select all that apply.
    options:
      - "Frost forming on a cold window"
      - "A copper roof turning green over years"
      - "Table salt dissolving in soup"
      - "Milk souring"
      - "Perfume evaporating from an open bottle"
    option_explanations:
      - |
        Correct. Water vapour deposits as ice; only intermolecular hydrogen bonds form.
      - |
        Incorrect, so it should not be selected. Copper reacts with oxygen, water and CO₂ to form new compounds (copper carbonates and hydroxides).
      - |
        Correct. In the AP treatment the ions are separated and hydrated but remain unchanged; the salt is recoverable.
      - |
        Incorrect, so it should not be selected. Bacteria convert lactose to lactic acid: bonds break and form.
      - |
        Correct. Evaporation overcomes the intermolecular forces among the perfume molecules; the molecules are unchanged.
    answer: [0, 2, 4]
    explanation: |
      Phase changes and dissolving (salt) are physical; corrosion and souring are chemical.

