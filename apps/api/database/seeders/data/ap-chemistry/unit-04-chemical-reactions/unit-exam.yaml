  - slug: apchem-u04-exam-q29
    type: true_false
    topic_code: "4.8"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: a 0.10 M solution of a weak acid requires fewer moles of NaOH for complete neutralisation than a 0.10 M solution of a strong acid of the same volume, because less of the weak acid is ionised.
    answer: false
    explanation: |
      False. Both contain the same moles of acid; as hydroxide removes H₃O⁺, more of the weak acid ionises until all of it has reacted, so the same moles of base are consumed.

