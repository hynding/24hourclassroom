  # ---- Short answer
  - slug: apchem-u04-exam-q38
    type: short_answer
    topic_code: "4.2"
    source: "general knowledge"
    points: 3
    prompt: |
      Aqueous solutions of iron(III) chloride and sodium hydroxide are mixed; a rust-coloured precipitate of iron(III) hydroxide forms.
      (a) Write the balanced molecular equation with state symbols and the net ionic equation, and identify the spectator ions.
      (b) Describe a particulate diagram of the mixture after the reaction, stating which species are present as separate hydrated ions and which are in the solid.
      (c) Classify the reaction by what is transferred and by pattern, and state whether any element changes oxidation state.
    answer: |
      (a) FeCl₃(aq) + 3 NaOH(aq) → Fe(OH)₃(s) + 3 NaCl(aq). Net ionic: Fe³⁺(aq) + 3 OH⁻(aq) → Fe(OH)₃(s). Spectators: Na⁺ and Cl⁻.
      (b) The solid at the bottom is an extended lattice of Fe³⁺ and OH⁻ in a 1 : 3 ratio. The solution contains separate hydrated Na⁺ (water oxygens pointing inward) and Cl⁻ (water hydrogens pointing inward) in a 1 : 1 ratio, with essentially no free Fe³⁺ or OH⁻ remaining if the reactants were in stoichiometric amounts.
      (c) Precipitation (ions combining into an insoluble solid); double replacement. No element changes oxidation state (Fe stays +3, O −2, H +1, Na +1, Cl −1), so it is not redox.
    explanation: |
      Scoring: 1 point for (a) both equations balanced with the spectators named; 1 point for (b) a correct description with the solid as Fe³⁺/OH⁻ lattice and the spectators as hydrated ions; 1 point for (c) precipitation/double replacement with the statement that no oxidation states change.

  - slug: apchem-u04-exam-q39
    type: short_answer
    topic_code: "4.9"
    source: "general knowledge"
    points: 3
    prompt: |
      In acidic solution, dichromate ion oxidises iron(II) ion: Cr₂O₇²⁻ + Fe²⁺ → Cr³⁺ + Fe³⁺ (unbalanced).
      (a) Write the two balanced half-reactions.
      (b) Write the balanced overall net ionic equation and verify that charge is balanced.
      (c) A 20.00 mL sample of Fe²⁺ solution requires 12.50 mL of 0.0200 M K₂Cr₂O₇. Calculate the concentration of Fe²⁺.
    answer: |
      (a) Reduction: Cr₂O₇²⁻ + 14 H⁺ + 6 e⁻ → 2 Cr³⁺ + 7 H₂O. Oxidation: Fe²⁺ → Fe³⁺ + e⁻.
      (b) Multiply the oxidation by 6 and add: Cr₂O₇²⁻ + 14 H⁺ + 6 Fe²⁺ → 2 Cr³⁺ + 7 H₂O + 6 Fe³⁺. Charge: left −2 + 14 + 12 = +24; right +6 + 18 = +24.
      (c) n(Cr₂O₇²⁻) = 0.01250 L × 0.0200 M = 2.50 × 10⁻⁴ mol; × 6 = 1.50 × 10⁻³ mol Fe²⁺; ÷ 0.02000 L = 0.0750 M.
    explanation: |
      Scoring: 1 point for (a) both half-reactions balanced in atoms and charge; 1 point for (b) the overall equation with a correct charge check (+24 each side); 1 point for (c) 0.0750 M using the 6 : 1 ratio.

  # ---- Long answer
  - slug: apchem-u04-exam-q40
    type: long_answer
    topic_code: "4.6"
    source: "PubChem (molar masses)"
    points: 6
    prompt: |
      A student is asked to determine the mass percent of calcium carbonate (100.09 g/mol) in an antacid tablet by back-titration. A 1.250 g tablet is crushed and added to 50.00 mL of 0.500 M hydrochloric acid (an excess); the mixture fizzes and is warmed gently until the fizzing stops. The remaining acid is then titrated with 0.250 M sodium hydroxide, requiring 36.40 mL to reach the phenolphthalein end point.
      (a) Write the net ionic equation for the reaction of calcium carbonate with the acid, and classify the reaction by type.
      (b) Calculate the moles of HCl originally added and the moles of HCl that remained after reaction with the tablet.
      (c) Calculate the moles of HCl consumed by the calcium carbonate and hence the mass of CaCO₃ in the tablet.
      (d) Calculate the mass percent of CaCO₃ in the tablet.
      (e) Explain why a back-titration is used here rather than titrating the tablet directly with acid.
      (f) The student forgot to warm the mixture, leaving some dissolved CO₂ (which forms carbonic acid) in the solution before titrating with NaOH. Explain the effect on the calculated mass percent of CaCO₃.
    answer: |
      (a) CaCO₃(s) + 2 H⁺(aq) → Ca²⁺(aq) + H₂O(l) + CO₂(g). An acid–base (proton transfer) reaction that is also gas-forming; a double replacement in pattern; not redox.
      (b) Added: 0.05000 L × 0.500 M = 0.0250 mol HCl. Remaining: equals the NaOH used, 0.03640 L × 0.250 M = 0.00910 mol.
      (c) Consumed: 0.0250 − 0.00910 = 0.0159 mol HCl; CaCO₃ : HCl is 1 : 2, so 0.00795 mol CaCO₃ × 100.09 = 0.796 g.
      (d) 0.796 ÷ 1.250 × 100 = 63.7 %.
      (e) Calcium carbonate is an insoluble solid that reacts slowly, and the tablet's binders and the CO₂ evolution make a direct end point hard to see; adding a measured excess of acid dissolves the carbonate completely, and the clear leftover acid can be titrated sharply with base.
      (f) Too low. Dissolved CO₂ (carbonic acid) consumes some of the NaOH, so the titrant volume and the apparent moles of leftover HCl are too large; the acid "consumed by the tablet" is then underestimated, giving a smaller calculated mass of CaCO₃ and a lower mass percent.
    explanation: |
      Scoring: (a) 1 point for the net ionic equation with CO₂(g) and correct classification (acid–base/gas-forming, not redox); (b) 1 point for 0.0250 mol added and 0.00910 mol remaining; (c) 1 point for 0.0159 mol consumed and 0.796 g CaCO₃ (accept 0.79–0.80 g) using the 1 : 2 ratio; (d) 1 point for 63.7 % (accept 63–64 %); (e) 1 point for a valid reason (insoluble, slow-reacting solid; excess acid ensures complete reaction and a sharp end point); (f) 1 point for "too low" with the reasoning that carbonic acid consumes extra NaOH, overstating the leftover HCl and understating the carbonate.
