week: 13
unit: 4
title: "Reactions, Net Ionic Equations and Particulate Representations"
topics: ["4.1", "4.2", "4.3"]
guide: guides/week-13.md
guide_description: |
  Evidence of chemical change and the balancing of equations by conservation of atoms and charge; the
  solubility rules and the lists of strong acids and bases that decide what is written as ions; the three-step
  route from molecular to complete ionic to net ionic equation with spectators cancelled; particulate before-and-
  after diagrams read as coefficients and as limiting or excess reactant. Worked examples: propane and aluminium
  combustion, lead iodide precipitation, strong and weak acid neutralisations, carbonate with acid, and two
  particulate boxes.
flashcards_description: |
  30 cards on chemical versus physical change, balancing, the solubility rules, strong acids and bases, strong
  and weak electrolytes, the net-ionic procedure, spectator ions, common net ionic equations, and reading and
  drawing particulate diagrams of reactions.

flashcards:
  - front: Evidence of a chemical change → the usual signs
    back: |
      A gas from a non-boiling liquid, a precipitate when clear solutions mix, a permanent colour change, a large temperature change, light or flame. Each means a new substance with new properties has formed.
    topic_code: "4.1"
  - front: Physical change → examples that are not reactions
    back: |
      Melting, boiling, dissolving (ions are unchanged), cutting, grinding, mixing. The particles keep their identity; only state, shape or arrangement changes.
    topic_code: "4.1"
  - front: What a chemical reaction does at the particle level → the statement
    back: |
      Bonds break and new bonds form so atoms are rearranged into new substances; no atoms are created or destroyed, so mass and atom counts are conserved.
    topic_code: "4.1"
  - front: Rules for balancing an equation → what may and may not change
    back: |
      Change coefficients only; never change a subscript (that changes the substance). Balance the element appearing in fewest places first, H and O last, clear fractions at the end.
    topic_code: "4.1"
  - front: Balancing propane combustion → the result and coefficient sum
    back: |
      C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O. C 3/3, H 8/8, O 10/10. Coefficient sum 13.
    topic_code: "4.1"
  - front: Balancing aluminium with oxygen → the result
    back: |
      4 Al + 3 O₂ → 2 Al₂O₃. Start with oxygen (six on each side), then aluminium. Coefficient sum 9.
    topic_code: "4.1"
  - front: Balancing butane combustion → the result
    back: |
      2 C₄H₁₀ + 13 O₂ → 8 CO₂ + 10 H₂O. The fractional 6½ O₂ for one butane is doubled away.
    topic_code: "4.1"
  - front: State symbols → the four and why they matter in Unit 4
    back: |
      (s), (l), (g), (aq). Whether a product is (aq), (s) or (g) decides whether it is written as ions, stays as a solid, or bubbles off, which is the whole net-ionic question.
    topic_code: "4.1"
  - front: Solubility rules part 1 → always soluble
    back: |
      All compounds of Na⁺, K⁺ (and the other group 1 ions), NH₄⁺, and all nitrates (NO₃⁻). Also acetates and perchlorates.
    topic_code: "4.2"
  - front: Solubility rules part 2 → halides and sulfates
    back: |
      Chlorides, bromides and iodides are soluble except with Ag⁺, Pb²⁺ and Hg₂²⁺. Sulfates are soluble except BaSO₄, SrSO₄, PbSO₄ (CaSO₄ only slightly soluble).
    topic_code: "4.2"
  - front: Solubility rules part 3 → usually insoluble
    back: |
      Carbonates, phosphates, sulfides and hydroxides are insoluble except with group 1 ions and NH₄⁺; Ba(OH)₂, Sr(OH)₂ and Ca(OH)₂ are soluble to moderately soluble.
    topic_code: "4.2"
  - front: The six strong acids → the list
    back: |
      HCl, HBr, HI, HNO₃, H₂SO₄ (first proton), HClO₄. Written as H⁺(aq) plus the anion in ionic equations. Every other common acid (HF, CH₃COOH, H₂CO₃, H₃PO₄) is weak and written as a molecule.
    topic_code: "4.2"
  - front: Strong bases → the list
    back: |
      Group 1 hydroxides (LiOH, NaOH, KOH…) and Ca(OH)₂, Sr(OH)₂, Ba(OH)₂. Written as the metal ion plus OH⁻. Ammonia is a weak base, written NH₃(aq).
    topic_code: "4.2"
  - front: What is written as ions vs as a formula in a complete ionic equation → the split
    back: |
      Ions: soluble ionic compounds (aq), strong acids, strong bases. Complete formulas: insoluble solids, weak acids and bases, molecular compounds, gases, water.
    topic_code: "4.2"
  - front: Net ionic equation → the three-step procedure
    back: |
      (1) Balanced molecular equation with state symbols. (2) Rewrite each aqueous strong electrolyte as ions, multiplying by its coefficient. (3) Cancel ions identical on both sides (spectators). Check atoms and charge.
    topic_code: "4.2"
  - front: Spectator ion → definition and how to spot one
    back: |
      An ion that appears unchanged, same formula and same (aq) state, on both sides. It stays dissolved and is omitted from the net ionic equation.
    topic_code: "4.2"
  - front: Lead(II) nitrate + potassium iodide → the net ionic equation
    back: |
      Pb²⁺(aq) + 2 I⁻(aq) → PbI₂(s); yellow precipitate. K⁺ and NO₃⁻ are spectators. Charge: +2 − 2 = 0 both sides.
    topic_code: "4.2"
  - front: Strong acid + strong base → the universal net ionic equation
    back: |
      H⁺(aq) + OH⁻(aq) → H₂O(l). The same for HCl + NaOH, HNO₃ + KOH, etc., because all are fully dissociated; the salt's ions are spectators.
    topic_code: "4.2"
  - front: Weak acid + strong base → how the acid is written
    back: |
      As a molecule: CH₃COOH(aq) + OH⁻(aq) → CH₃COO⁻(aq) + H₂O(l). The weak acid is mostly un-ionised, so it is not split; only Na⁺ is a spectator.
    topic_code: "4.2"
  - front: Carbonate + strong acid → the net ionic equation
    back: |
      CO₃²⁻(aq) + 2 H⁺(aq) → H₂O(l) + CO₂(g). Carbonic acid decomposes; the fizz is the evidence of reaction.
    topic_code: "4.2"
  - front: Silver nitrate + sodium chloride → the net ionic equation
    back: |
      Ag⁺(aq) + Cl⁻(aq) → AgCl(s), a white precipitate; Na⁺ and NO₃⁻ are spectators.
    topic_code: "4.2"
  - front: Barium chloride + sodium sulfate → the net ionic equation
    back: |
      Ba²⁺(aq) + SO₄²⁻(aq) → BaSO₄(s), a white precipitate; Na⁺ and Cl⁻ are spectators.
    topic_code: "4.2"
  - front: Nitric acid + aqueous ammonia → the net ionic equation
    back: |
      H⁺(aq) + NH₃(aq) → NH₄⁺(aq). Ammonia is a weak base and stays molecular; NO₃⁻ is the spectator.
    topic_code: "4.2"
  - front: When two solutions give "no reaction" → the criterion
    back: |
      Every possible product is soluble and no gas or water forms: NaCl + KNO₃ is just four spectator ions. There is no net ionic equation.
    topic_code: "4.2"
  - front: Charge balance in a net ionic equation → the check
    back: |
      Total charge must be equal on both sides. Pb²⁺ + 2 I⁻ → PbI₂: (+2) + (−2) = 0 = 0. An unbalanced charge means a spectator or coefficient was mishandled.
    topic_code: "4.2"
  - front: Reading a particulate before-and-after diagram → the procedure
    back: |
      Count each species before and after; reduce the counts to smallest whole numbers for the coefficients; anything unchanged and left over was in excess; the species that ran out was limiting. Atoms must be conserved.
    topic_code: "4.3"
  - front: 4 A₂ + 2 B₂ before, 4 A₂B after → the equation
    back: |
      Ratio 4 : 2 : 4 = 2 : 1 : 2, so 2 A₂ + B₂ → 2 A₂B. Atom check: 8 A and 4 B each side.
    topic_code: "4.3"
  - front: 4 H₂ + 3 O₂ before → the correct after box
    back: |
      2 H₂ + O₂ → 2 H₂O: four H₂ consume 2 O₂ to make 4 H₂O, leaving 1 O₂. Hydrogen was limiting. Six H₂O would create hydrogen from nothing.
    topic_code: "4.3"
  - front: Particulate picture of a precipitation → what changes and what does not
    back: |
      Before: separate hydrated ions in each beaker. After: the precipitating pair clumped as an alternating solid at the bottom; the spectators still dispersed and hydrated, unchanged.
    topic_code: "4.3"
  - front: 3 N₂ + 9 H₂ before, 6 NH₃ after → equation and leftover
    back: |
      N₂ + 3 H₂ → 2 NH₃ (scaled by 3). 3 : 9 is exactly 1 : 3, so nothing is left over; atoms: 6 N and 18 H on each side.
    topic_code: "4.3"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 4.1, 4.2 and 4.3: chemical change and
    balancing; solubility rules, strong electrolytes and net ionic equations; particulate diagrams of reactions),
    with review of molarity, solubility, bonding, gases and the mole. Multiple choice, select-all, true/false
    and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers
    and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: lead iodide precipitation
    - slug: apchem-u04-w13-q01
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student mixes 25.0 mL of 0.200 M lead(II) nitrate, Pb(NO₃)₂(aq), with 25.0 mL of 0.400 M potassium iodide, KI(aq). A bright yellow precipitate forms immediately. Assume the volumes are additive and the precipitation is complete.
      prompt: |
        Which is the correct net ionic equation for the reaction?
      options:
        - "Pb(NO₃)₂(aq) + 2 KI(aq) → PbI₂(s) + 2 KNO₃(aq)"
        - "Pb²⁺(aq) + 2 NO₃⁻(aq) + 2 K⁺(aq) + 2 I⁻(aq) → PbI₂(s) + 2 K⁺(aq) + 2 NO₃⁻(aq)"
        - "Pb²⁺(aq) + 2 I⁻(aq) → PbI₂(s)"
        - "K⁺(aq) + NO₃⁻(aq) → KNO₃(s)"
      option_explanations:
        - |
          This is the molecular equation; it is correct but shows the spectator ions inside intact formulas rather than isolating the change.
        - |
          This is the complete ionic equation; the K⁺ and NO₃⁻ spectators have not yet been cancelled.
        - |
          Correct. Only lead(II) and iodide ions change state, combining into the insoluble PbI₂; potassium and nitrate remain dissolved and are omitted.
        - |
          Potassium nitrate is soluble (all nitrates and all potassium compounds are), so no KNO₃ solid forms.
      answer: 2
      explanation: |
        Net ionic: the ions that form the precipitate only.

    - slug: apchem-u04-w13-q02
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student mixes 25.0 mL of 0.200 M lead(II) nitrate, Pb(NO₃)₂(aq), with 25.0 mL of 0.400 M potassium iodide, KI(aq). A bright yellow precipitate forms immediately. Assume the volumes are additive and the precipitation is complete.
      prompt: |
        Which ions are spectator ions in this reaction?
      options:
        - "K⁺ and NO₃⁻"
        - "Pb²⁺ and I⁻"
        - "K⁺ and I⁻"
        - "Pb²⁺ and NO₃⁻"
      option_explanations:
        - |
          Correct. Potassium and nitrate ions begin and end as dissolved, hydrated ions; they appear unchanged on both sides of the complete ionic equation.
        - |
          These are the ions that react, leaving solution to form the solid; they are the opposite of spectators.
        - |
          Iodide is consumed in forming PbI₂, so it is not a spectator.
        - |
          Lead(II) is consumed in forming PbI₂, so it is not a spectator.
      answer: 0
      explanation: |
        Spectators are unchanged on both sides.

    - slug: apchem-u04-w13-q03
      type: multiple_choice
      topic_code: "3.7"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student mixes 25.0 mL of 0.200 M lead(II) nitrate, Pb(NO₃)₂(aq), with 25.0 mL of 0.400 M potassium iodide, KI(aq). A bright yellow precipitate forms immediately. Assume the volumes are additive and the precipitation is complete.
      prompt: |
        What is the concentration of nitrate ions in the solution after mixing?
      options:
        - "0.400 M"
        - "0.100 M"
        - "0.0500 M"
        - "0.200 M"
      option_explanations:
        - |
          0.400 M is the nitrate concentration in the original lead nitrate solution (2 × 0.200 M) before the volume doubled on mixing.
        - |
          0.100 M would be right only if each Pb(NO₃)₂ supplied one nitrate; it supplies two.
        - |
          0.0500 M divides by too much; the nitrate moles are 0.0100 mol in a total of 0.0500 L.
        - |
          Correct. Moles of NO₃⁻ = 0.0250 L × 0.200 M × 2 = 0.0100 mol, unchanged by the reaction (spectator), in 0.0500 L: 0.200 M.
      answer: 3
      explanation: |
        Spectator moles unchanged; divide by the total volume.

    # ---- Multiple choice (4.1)
    - slug: apchem-u04-w13-q04
      type: multiple_choice
      topic_code: "4.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which observation is the strongest evidence that a chemical change, rather than a physical change, has taken place?
      options:
        - "A solid dissolves completely in water, giving a clear solution."
        - "Two clear, colourless solutions are mixed and a white solid forms."
        - "A liquid boils when heated and the vapour condenses on a cold surface."
        - "A metal bar is bent into a new shape."
      option_explanations:
        - |
          Dissolving is a physical change; the solute's particles are dispersed but unchanged and can be recovered by evaporation.
        - |
          Correct. A precipitate forming from two solutions means ions have combined into a new substance with different properties (an insoluble solid).
        - |
          Boiling and condensing are changes of state; the substance is unchanged.
        - |
          Bending changes shape only; the metal's identity is unchanged.
      answer: 1
      explanation: |
        A new substance (precipitate) is evidence of chemical change.

    - slug: apchem-u04-w13-q05
      type: multiple_choice
      topic_code: "4.1"
      source: "general knowledge"
      points: 1
      prompt: |
        When the equation for the complete combustion of propane, C₃H₈ + O₂ → CO₂ + H₂O, is balanced with the smallest whole-number coefficients, what is the sum of all the coefficients?
      options:
        - "7"
        - "10"
        - "11"
        - "13"
      option_explanations:
        - |
          7 would come from forgetting to balance oxygen (1 + 1 + 3 + 4 = 9 is not it either); the oxygen coefficient is 5.
        - |
          10 is the number of oxygen atoms on each side, not the sum of coefficients.
        - |
          11 would be the sum if the oxygen coefficient were 3, but then only 6 O atoms would be supplied against 10 needed.
        - |
          Correct. C₃H₈ + 5 O₂ → 3 CO₂ + 4 H₂O; 1 + 5 + 3 + 4 = 13.
      answer: 3
      explanation: |
        1 + 5 + 3 + 4 = 13.

    # ---- Multiple choice (4.2)
    - slug: apchem-u04-w13-q06
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which pair of aqueous solutions produces a precipitate when mixed?
      options:
        - "Ba(NO₃)₂ and Na₂SO₄"
        - "KCl and NaNO₃"
        - "NH₄Cl and KBr"
        - "NaOH and HCl"
      option_explanations:
        - |
          Correct. Barium sulfate is one of the insoluble sulfates: Ba²⁺(aq) + SO₄²⁻(aq) → BaSO₄(s), a white precipitate.
        - |
          Both possible products, KNO₃ and NaCl, are soluble; no reaction occurs.
        - |
          NH₄Br and KCl are both soluble (ammonium and potassium compounds always are); no reaction.
        - |
          This acid–base reaction forms water and soluble NaCl, not a precipitate.
      answer: 0
      explanation: |
        BaSO₄ is insoluble.

    - slug: apchem-u04-w13-q07
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which is the net ionic equation for the reaction of aqueous nitric acid with aqueous potassium hydroxide?
      options:
        - "HNO₃(aq) + KOH(aq) → KNO₃(aq) + H₂O(l)"
        - "K⁺(aq) + NO₃⁻(aq) → KNO₃(aq)"
        - "H⁺(aq) + OH⁻(aq) → H₂O(l)"
        - "HNO₃(aq) + OH⁻(aq) → NO₃⁻(aq) + H₂O(l)"
      option_explanations:
        - |
          This is the molecular equation, with the spectators still inside the formulas.
        - |
          Potassium and nitrate are both spectators; they do not combine (KNO₃ is soluble).
        - |
          Correct. Nitric acid is a strong acid and KOH a strong base, so both are written as ions; cancelling K⁺ and NO₃⁻ leaves the formation of water.
        - |
          HNO₃ is a strong acid and must be written as H⁺ + NO₃⁻; this form would be right only for a weak acid.
      answer: 2
      explanation: |
        Strong acid + strong base: H⁺ + OH⁻ → H₂O.

    - slug: apchem-u04-w13-q08
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Acetic acid, CH₃COOH, is a weak acid. Which is the correct net ionic equation for its reaction with aqueous sodium hydroxide?
      options:
        - "H⁺(aq) + OH⁻(aq) → H₂O(l)"
        - "CH₃COOH(aq) + OH⁻(aq) → CH₃COO⁻(aq) + H₂O(l)"
        - "CH₃COOH(aq) + Na⁺(aq) + OH⁻(aq) → CH₃COONa(s) + H₂O(l)"
        - "CH₃COO⁻(aq) + H⁺(aq) + Na⁺(aq) + OH⁻(aq) → CH₃COO⁻(aq) + Na⁺(aq) + H₂O(l)"
      option_explanations:
        - |
          This is right for a strong acid, but acetic acid is mostly un-ionised and must be written as the molecule.
        - |
          Correct. The weak acid stays as CH₃COOH; hydroxide removes its proton, giving acetate and water; Na⁺ is the only spectator.
        - |
          Sodium acetate is soluble, so no solid forms, and Na⁺ should be cancelled as a spectator.
        - |
          This splits the weak acid into ions, which misrepresents a solution in which almost all of the acid is molecular.
      answer: 1
      explanation: |
        Weak acids are written as molecules.

    # ---- Multiple choice (4.3)
    - slug: apchem-u04-w13-q09
      type: multiple_choice
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A particulate diagram shows a box containing 4 molecules of H₂ and 3 molecules of O₂ before a reaction that forms water. Which "after" box is consistent with the reaction 2 H₂ + O₂ → 2 H₂O and with conservation of atoms?
      options:
        - "6 H₂O molecules and nothing else"
        - "4 H₂O molecules and 3 O₂ molecules"
        - "3 H₂O molecules and 1 H₂ molecule"
        - "4 H₂O molecules and 1 O₂ molecule"
      option_explanations:
        - |
          Six water molecules would contain 12 H atoms, but only 8 were present; hydrogen cannot be created.
        - |
          Forming 4 H₂O consumes 2 O₂, so 3 O₂ cannot remain; oxygen would be counted twice.
        - |
          3 H₂O plus 1 H₂ accounts for only 8 H atoms correctly but leaves 3 O in water and 6 O in O₂ unaccounted; the ratio does not follow 2 : 1 : 2.
        - |
          Correct. 4 H₂ react with 2 O₂ to make 4 H₂O; 1 O₂ is left over. Atoms: 8 H and 6 O on each side.
      answer: 3
      explanation: |
        H₂ is limiting; one O₂ remains.

    - slug: apchem-u04-w13-q10
      type: multiple_choice
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A before box contains 4 molecules of A₂ and 2 molecules of B₂; the after box contains 4 molecules of A₂B and nothing else. Which balanced equation does the diagram represent?
      options:
        - "2 A₂ + B₂ → 2 A₂B"
        - "4 A₂ + 2 B₂ → 4 A₂B is the only valid form, since coefficients cannot be reduced"
        - "A₂ + B₂ → A₂B"
        - "2 A + B → A₂B"
      option_explanations:
        - |
          Correct. The counts 4 : 2 : 4 reduce to 2 : 1 : 2; atoms check: 8 A and 4 B on each side.
        - |
          The equation is valid as written, but balanced equations use the smallest whole-number coefficients, so it reduces to 2 : 1 : 2.
        - |
          A₂ + B₂ → A₂B is not balanced: 2 B atoms on the left, 1 on the right.
        - |
          The diagram shows diatomic molecules A₂ and B₂ as reactants, not separate atoms.
      answer: 0
      explanation: |
        Reduce 4 : 2 : 4 to 2 : 1 : 2.

    # ---- Review (3.8)
    - slug: apchem-u04-w13-q11
      type: multiple_choice
      topic_code: "3.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Aqueous solutions of silver nitrate and sodium chloride are mixed and a white precipitate forms. Which description of a particulate diagram of the mixture after reaction is correct?
      options:
        - "All four ions remain separately hydrated and uniformly dispersed."
        - "Ag⁺ and Cl⁻ ions are clumped together in an alternating solid, while Na⁺ and NO₃⁻ remain separately hydrated in the solution."
        - "Na⁺ and NO₃⁻ ions are clumped together as a solid, while Ag⁺ and Cl⁻ remain dispersed."
        - "Intact AgCl and NaNO₃ molecules float among the water molecules."
      option_explanations:
        - |
          If all ions stayed dispersed there would be no precipitate; the observation says a solid forms.
        - |
          Correct. AgCl is insoluble and forms an ionic solid; the spectators Na⁺ and NO₃⁻ stay hydrated (water oxygens toward Na⁺, hydrogens toward NO₃⁻).
        - |
          Sodium nitrate is soluble; it is the silver chloride that precipitates.
        - |
          Neither compound exists as molecules in water; the soluble one is dissociated ions and the insoluble one is an extended ionic lattice.
      answer: 1
      explanation: |
        Precipitate = ionic solid of the reacting pair; spectators stay hydrated.

    # ---- Review (2.1)
    - slug: apchem-u04-w13-q12
      type: multiple_choice
      topic_code: "2.1"
      source: "general knowledge"
      points: 1
      prompt: |
        In a complete ionic equation, potassium iodide is written as K⁺(aq) + I⁻(aq), while iodine, I₂, is written as I₂(aq). Which statement explains the difference?
      options:
        - "Potassium iodide is a weak electrolyte while iodine is a strong electrolyte."
        - "Iodine is more soluble in water than potassium iodide."
        - "Potassium iodide is held by ionic bonds and dissociates into its ions in water, while I₂ is a covalently bonded molecule that stays intact."
        - "Both are ionic, but I₂ ionises only at high temperature."
      option_explanations:
        - |
          KI is a strong electrolyte (fully dissociated) and I₂ is a non-electrolyte; the labels are reversed.
        - |
          Iodine is only slightly soluble in water; solubility is not the reason for the different notation anyway.
        - |
          Correct. Metal + nonmetal with a large electronegativity difference gives an ionic lattice that separates into hydrated ions; two identical nonmetal atoms share electrons covalently and the molecule survives dissolution.
        - |
          I₂ is molecular, not ionic; heating does not turn it into ions.
      answer: 2
      explanation: |
        Ionic compounds dissociate; covalent molecules do not.

    # ---- Multi-select
    - slug: apchem-u04-w13-q13
      type: multi_select
      topic_code: "4.2"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following species should be written as separate ions in a complete ionic equation for a reaction in aqueous solution? Select all that apply.
      options:
        - "HCl(aq)"
        - "NH₃(aq)"
        - "Na₂CO₃(aq)"
        - "AgCl(s)"
        - "Ba(OH)₂(aq)"
      option_explanations:
        - |
          Correct. Hydrochloric acid is a strong acid, completely ionised to H⁺(aq) and Cl⁻(aq).
        - |
          Incorrect, so it should not be selected. Ammonia is a weak base, mostly un-ionised, and is written as the NH₃ molecule.
        - |
          Correct. Sodium carbonate is a soluble ionic compound (all sodium compounds are), written as 2 Na⁺ + CO₃²⁻.
        - |
          Incorrect, so it should not be selected. Silver chloride is an insoluble solid; it is written as a complete formula with (s).
        - |
          Correct. Barium hydroxide is a strong base and is written as Ba²⁺ + 2 OH⁻.
      answer: [0, 2, 4]
      explanation: |
        Ions for strong electrolytes only.

    - slug: apchem-u04-w13-q14
      type: multi_select
      topic_code: "3.10"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following ionic compounds are soluble in water? Select all that apply.
      options:
        - "NH₄Cl"
        - "PbSO₄"
        - "Ca(NO₃)₂"
        - "CaCO₃"
        - "AgNO₃"
      option_explanations:
        - |
          Correct. All ammonium compounds are soluble; the small, hydrated NH₄⁺ and Cl⁻ ions are easily solvated.
        - |
          Incorrect, so it should not be selected. Lead(II) sulfate is one of the insoluble sulfates (with Ba²⁺ and Sr²⁺).
        - |
          Correct. All nitrates are soluble, calcium nitrate included; the nitrate ion is never the reason a compound precipitates.
        - |
          Incorrect, so it should not be selected. Carbonates are insoluble except with group 1 ions and ammonium; CaCO₃ is limestone.
        - |
