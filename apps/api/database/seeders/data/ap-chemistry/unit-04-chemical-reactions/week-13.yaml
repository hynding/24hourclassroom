    # ---- True / false
    - slug: apchem-u04-w13-q15
      type: true_false
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: the net ionic equation for the reaction of any strong acid with any strong base in aqueous solution is H⁺(aq) + OH⁻(aq) → H₂O(l).
      answer: true
      explanation: |
        True. Both are fully dissociated, so the only change is the combination of H⁺ and OH⁻; the salt's ions are spectators.

    - slug: apchem-u04-w13-q16
      type: true_false
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: when a reaction in an open flask produces a gas such as CO₂, the gas escapes, so the mass of the flask and its contents decreases even though atoms are conserved.
      answer: true
      explanation: |
        True. Conservation of mass applies to the whole system; the gas that leaves carries mass away from the open flask, which is why gas-forming reactions are weighed in closed systems.

