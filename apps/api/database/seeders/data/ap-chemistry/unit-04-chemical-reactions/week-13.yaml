    # ---- Short answer
    - slug: apchem-u04-w13-q22
      type: short_answer
      topic_code: "4.2"
      source: "general knowledge"
      points: 3
      prompt: |
        Aqueous sodium carbonate is mixed with aqueous calcium chloride and a white precipitate forms.
        (a) Write the balanced molecular equation with state symbols.
        (b) Write the complete ionic equation.
        (c) Write the net ionic equation and identify the spectator ions.
      answer: |
        (a) Na₂CO₃(aq) + CaCl₂(aq) → CaCO₃(s) + 2 NaCl(aq).
        (b) 2 Na⁺(aq) + CO₃²⁻(aq) + Ca²⁺(aq) + 2 Cl⁻(aq) → CaCO₃(s) + 2 Na⁺(aq) + 2 Cl⁻(aq).
        (c) Ca²⁺(aq) + CO₃²⁻(aq) → CaCO₃(s). Spectators: Na⁺ and Cl⁻.
      explanation: |
        Scoring: 1 point for (a) a balanced molecular equation with CaCO₃(s) and NaCl(aq) correctly labelled; 1 point for (b) all aqueous strong electrolytes written as ions with coefficients carried through; 1 point for (c) the correct net ionic equation with both spectators named.

    - slug: apchem-u04-w13-q23
      type: short_answer
      topic_code: "4.3"
      source: "general knowledge"
      points: 3
      prompt: |
        A particulate diagram of a reaction between nitrogen and hydrogen shows, before the reaction, 2 molecules of N₂ and 9 molecules of H₂. After the reaction the box contains 4 molecules of NH₃ and 3 molecules of H₂.
        (a) Show that atoms are conserved between the two boxes.
        (b) Write the balanced equation for the reaction, with the smallest whole-number coefficients.
        (c) Identify the limiting reactant and the reactant in excess, and explain how the diagram shows this.
      answer: |
        (a) Before: 4 N atoms (2 N₂) and 18 H atoms (9 H₂). After: 4 N (in 4 NH₃) and 12 + 6 = 18 H (12 in NH₃, 6 in 3 H₂). Both counts match.
        (b) The 2 N₂ and 6 H₂ consumed give 4 NH₃: 2 : 6 : 4 reduces to N₂ + 3 H₂ → 2 NH₃.
        (c) N₂ is limiting: none remains after the reaction. H₂ is in excess: 3 molecules are left unreacted in the after box. The diagram shows this by the absence of N₂ and the presence of leftover H₂.
      explanation: |
        Scoring: 1 point for (a) correct atom counts before and after (4 N, 18 H); 1 point for (b) N₂ + 3 H₂ → 2 NH₃; 1 point for (c) identifying N₂ as limiting and H₂ as excess with reference to the leftover molecules.

    # ---- Long answer
    - slug: apchem-u04-w13-q24
      type: long_answer
      topic_code: "4.2"
      source: "general knowledge"
      points: 6
      prompt: |
        A student is given four unlabelled colourless solutions known to be 0.1 M NaCl, 0.1 M AgNO₃, 0.1 M Na₂CO₃ and 0.1 M HCl, and must identify them using only the solutions themselves, test tubes and a conductivity probe.
        (a) Predict what is observed when each pair of solutions is mixed, and write the net ionic equation for each pair that reacts.
        (b) Explain how the observations in (a) are sufficient to identify all four solutions.
        (c) Before mixing, each solution is tested with the conductivity probe. Explain why all four conduct electricity, and use a particulate description of one of them to support your answer.
        (d) A fifth solution of 0.1 M acetic acid is tested and found to conduct only weakly. Explain this result and write the species present in the solution.
      answer: |
        (a) NaCl + AgNO₃: white precipitate, Ag⁺(aq) + Cl⁻(aq) → AgCl(s). AgNO₃ + Na₂CO₃: precipitate, 2 Ag⁺(aq) + CO₃²⁻(aq) → Ag₂CO₃(s). AgNO₃ + HCl: white precipitate, Ag⁺(aq) + Cl⁻(aq) → AgCl(s). Na₂CO₃ + HCl: bubbles of gas, CO₃²⁻(aq) + 2 H⁺(aq) → H₂O(l) + CO₂(g). NaCl + Na₂CO₃ and NaCl + HCl: no reaction (all possible products soluble, no gas or water formed).
        (b) The solution that gives a precipitate with all three others is AgNO₃. Of the remaining three, the pair that fizzes together is Na₂CO₃ and HCl, and the one that gives no visible change with either of them is NaCl. Na₂CO₃ is then the one that precipitates with AgNO₃ and fizzes with HCl; HCl is the one that fizzes with Na₂CO₃ and precipitates AgCl with AgNO₃ (distinguished from NaCl by the fizzing).
        (c) All four are strong electrolytes: NaCl, AgNO₃ and Na₂CO₃ are soluble ionic compounds and HCl is a strong acid, so each solution contains mobile ions that carry current. For example, NaCl(aq) consists of separate hydrated Na⁺ ions (water oxygens pointing inward) and Cl⁻ ions (water hydrogens pointing inward) moving freely through the water.
        (d) Acetic acid is a weak acid: only a small fraction of CH₃COOH molecules ionise, so the solution contains mostly intact CH₃COOH molecules with a small concentration of H⁺ (as H₃O⁺) and CH₃COO⁻ ions and so has few charge carriers; it conducts weakly.
      explanation: |
        Scoring: (a) 1 point for correctly predicting the two AgCl precipitations and the Ag₂CO₃ precipitation with net ionic equations, and 1 point for the carbonate–acid gas evolution with its net ionic equation and the two "no reaction" pairs; (b) 1 point for a logical identification scheme that distinguishes all four; (c) 1 point for identifying all four as strong electrolytes with mobile ions, with a correct particulate description of one solution; (d) 1 point for explaining weak conduction by partial ionisation and 1 point for listing CH₃COOH (major), H⁺/H₃O⁺ and CH₃COO⁻ (minor).
