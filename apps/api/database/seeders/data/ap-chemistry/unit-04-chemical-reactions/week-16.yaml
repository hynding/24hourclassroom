    # ---- Short answer
    - slug: apchem-u04-w16-q22
      type: short_answer
      topic_code: "4.8"
      source: "general knowledge"
      points: 3
      prompt: |
        Hypochlorous acid, HOCl, is a weak acid used in swimming-pool disinfection.
        (a) Write the equation for HOCl reacting with water and identify both conjugate acid–base pairs.
        (b) Describe the particulate composition of a 0.10 M HOCl solution and contrast it with a 0.10 M HCl solution.
        (c) Write the net ionic equation for the reaction of HOCl with aqueous sodium hydroxide, and explain why HOCl is written the way it is.
      answer: |
        (a) HOCl(aq) + H₂O(l) ⇌ H₃O⁺(aq) + OCl⁻(aq). Pairs: HOCl (acid) / OCl⁻ (conjugate base); H₂O (base) / H₃O⁺ (conjugate acid).
        (b) The HOCl solution is mostly intact HOCl molecules among water molecules, with only a small number of H₃O⁺ and OCl⁻ ions (a few percent or less ionised). The HCl solution contains essentially no HCl molecules: every one has transferred its proton, so it is 0.10 M H₃O⁺ and 0.10 M Cl⁻.
        (c) HOCl(aq) + OH⁻(aq) → OCl⁻(aq) + H₂O(l). HOCl is a weak acid, so it is written as the molecule (it is mostly un-ionised); NaOH is a strong base, written as ions, and Na⁺ is the spectator that cancels.
      explanation: |
        Scoring: 1 point for (a) the equation with both conjugate pairs correctly identified; 1 point for (b) mostly molecular HOCl with few ions versus fully ionised HCl; 1 point for (c) the correct net ionic equation with the weak-acid justification for writing HOCl as a molecule.

    - slug: apchem-u04-w16-q23
      type: short_answer
      topic_code: "4.9"
      source: "general knowledge"
      points: 3
      prompt: |
        Copper metal dissolves in concentrated nitric acid, giving a blue solution and brown nitrogen dioxide gas: Cu(s) + NO₃⁻(aq) → Cu²⁺(aq) + NO₂(g) (unbalanced, acidic solution).
        (a) Assign oxidation numbers to copper and nitrogen before and after the reaction, and identify the oxidising agent.
        (b) Write the balanced oxidation and reduction half-reactions.
        (c) Write the balanced overall net ionic equation and show that charge is balanced.
      answer: |
        (a) Cu: 0 → +2 (oxidised). N: +5 in NO₃⁻ → +4 in NO₂ (reduced). The oxidising agent is NO₃⁻ (nitrate, or nitric acid).
        (b) Oxidation: Cu → Cu²⁺ + 2 e⁻. Reduction: NO₃⁻ + 2 H⁺ + e⁻ → NO₂ + H₂O.
        (c) Doubling the reduction and adding: Cu + 2 NO₃⁻ + 4 H⁺ → Cu²⁺ + 2 NO₂ + 2 H₂O. Charge: left (−2) + (+4) = +2; right +2. Atoms: Cu 1/1, N 2/2, O 6/6, H 4/4.
      explanation: |
        Scoring: 1 point for (a) correct oxidation numbers (Cu 0 → +2, N +5 → +4) and NO₃⁻ as the oxidising agent; 1 point for (b) both half-reactions balanced in atoms and charge; 1 point for (c) the overall equation with the charge check (+2 each side).

    # ---- Long answer
    - slug: apchem-u04-w16-q24
      type: long_answer
      topic_code: "4.9"
      source: "PubChem (molar masses)"
      points: 6
      prompt: |
        A student determines the percent of iron in an iron supplement tablet. The tablet (mass 0.850 g) is dissolved in dilute sulfuric acid, which converts all of the iron to Fe²⁺, and the solution is diluted to 100.0 mL. A 25.00 mL portion is titrated with 0.0150 M KMnO₄; the end point is reached after 11.40 mL.
        (a) Write the balanced net ionic equation for the titration reaction in acidic solution, starting from the half-reactions MnO₄⁻ → Mn²⁺ and Fe²⁺ → Fe³⁺.
        (b) Explain why the solution must be acidic, and what observation marks the end point.
        (c) Calculate the moles of Fe²⁺ in the 25.00 mL portion.
        (d) Calculate the mass of iron in the whole tablet and the mass percent of iron.
        (e) Some of the Fe²⁺ is oxidised to Fe³⁺ by air while the solution stands before the titration. Explain whether the calculated percent of iron would be too high or too low.
        (f) Identify the oxidising agent and the reducing agent in the titration, and state how many moles of electrons are transferred per mole of MnO₄⁻.
      answer: |
        (a) Reduction: MnO₄⁻ + 8 H⁺ + 5 e⁻ → Mn²⁺ + 4 H₂O. Oxidation (×5): 5 Fe²⁺ → 5 Fe³⁺ + 5 e⁻. Overall: MnO₄⁻ + 8 H⁺ + 5 Fe²⁺ → Mn²⁺ + 4 H₂O + 5 Fe³⁺.
        (b) The reduction of permanganate to Mn²⁺ consumes eight H⁺ per MnO₄⁻; without acid, permanganate is reduced only to brown MnO₂, changing the stoichiometry and obscuring the end point. The end point is the first permanent pale pink, when a trace of unreacted purple MnO₄⁻ persists because no Fe²⁺ remains.
        (c) n(MnO₄⁻) = 0.01140 L × 0.0150 M = 1.71 × 10⁻⁴ mol; n(Fe²⁺) = 5 × 1.71 × 10⁻⁴ = 8.55 × 10⁻⁴ mol.
        (d) The whole 100.0 mL contains 4 × 8.55 × 10⁻⁴ = 3.42 × 10⁻³ mol Fe; mass = 3.42 × 10⁻³ × 55.85 = 0.191 g; percent = 0.191 ÷ 0.850 × 100 = 22.5 %.
        (e) Too low. Fe³⁺ does not react with permanganate, so iron that was oxidised by air before the titration is not counted; fewer moles of MnO₄⁻ are needed and the calculated iron is less than the true amount.
        (f) Oxidising agent: MnO₄⁻ (reduced, Mn +7 → +2). Reducing agent: Fe²⁺ (oxidised, +2 → +3). Five moles of electrons are transferred per mole of MnO₄⁻.
      explanation: |
        Scoring: (a) 1 point for the balanced overall equation derived from correctly balanced half-reactions; (b) 1 point for the role of H⁺ in the reduction (or that MnO₂ forms without acid) and the persistent pink end point; (c) 1 point for 8.55 × 10⁻⁴ mol (accept 8.5–8.6 × 10⁻⁴) with the 5 : 1 ratio; (d) 1 point for scaling to 100.0 mL and 0.191 g, 22.5 % (accept 22.3–22.7 %); (e) 1 point for "too low" with the reasoning that air-oxidised Fe³⁺ is not titrated; (f) 1 point for both agents correctly identified and 5 mol e⁻ per mol MnO₄⁻.
