week: 16
unit: 4
title: "Acid–Base Reactions and Oxidation–Reduction"
topics: ["4.8", "4.9"]
guide: guides/week-16.md
guide_description: |
  Brønsted–Lowry acids and bases as proton donors and acceptors, conjugate pairs, amphoteric water, strong
  versus weak at the particulate level and the net ionic equations that follow; then oxidation numbers by rule,
  oxidation and reduction, oxidising and reducing agents, the half-reaction method in acidic and basic solution,
  moles of electrons, and the permanganate redox titration. Worked examples: HSO₄⁻ with NH₃, HCl against HF,
  oxidation numbers in Cr₂O₇²⁻ and MnO₄⁻, permanganate with Fe²⁺, copper with nitric acid, and an iron(II)
  titration.
flashcards_description: |
  30 cards on Brønsted–Lowry definitions, conjugate pairs, amphoteric species, strong and weak acids and bases,
  acid–base net ionic equations, the oxidation-number rules, identifying oxidation and reduction and the
  agents, half-reaction balancing, electron bookkeeping and redox titrations.

flashcards:
  - front: Brønsted–Lowry acid and base → definitions
    back: |
      Acid: proton (H⁺) donor. Base: proton acceptor. Every acid–base reaction is one proton moving from the acid to the base.
    topic_code: "4.8"
  - front: Conjugate acid–base pair → how to recognise one
    back: |
      Two species differing by exactly one H⁺: HF/F⁻, NH₄⁺/NH₃, H₂O/OH⁻, H₃O⁺/H₂O. The acid's conjugate base is what remains after it donates; the base's conjugate acid is what it becomes after accepting.
    topic_code: "4.8"
  - front: HF + H₂O ⇌ H₃O⁺ + F⁻ → the roles
    back: |
      HF acid, H₂O base; F⁻ conjugate base of HF, H₃O⁺ conjugate acid of H₂O.
    topic_code: "4.8"
  - front: NH₃ + H₂O ⇌ NH₄⁺ + OH⁻ → the roles
    back: |
      NH₃ base, H₂O acid (it donates); NH₄⁺ conjugate acid of NH₃, OH⁻ conjugate base of H₂O.
    topic_code: "4.8"
  - front: Amphoteric species → definition and examples
    back: |
      Can act as an acid or a base depending on the partner: H₂O, HCO₃⁻, HSO₄⁻, H₂PO₄⁻. Needs a proton to give and room to accept one.
    topic_code: "4.8"
  - front: Strong acid at the particulate level → what the solution contains
    back: |
      Essentially complete proton transfer to water: 0.10 M HCl is 0.10 M H₃O⁺ and 0.10 M Cl⁻ with no HCl molecules. The six: HCl, HBr, HI, HNO₃, H₂SO₄, HClO₄.
    topic_code: "4.8"
  - front: Weak acid at the particulate level → what the solution contains
    back: |
      Mostly intact acid molecules with a small fraction ionised: 0.10 M acetic acid has about 0.0013 M H₃O⁺. HF, CH₃COOH, HCN, H₂CO₃, NH₄⁺ are weak.
    topic_code: "4.8"
  - front: Strong and weak bases → examples of each
    back: |
      Strong (fully dissociated): NaOH, KOH, Ba(OH)₂. Weak (mostly molecular): NH₃, amines. A 0.10 M NH₃ solution is mostly NH₃ molecules.
    topic_code: "4.8"
  - front: Acid strength vs concentration → the distinction
    back: |
      Strength is the fraction ionised (strong ≈ 100 %, weak a few percent); concentration is molarity. A dilute strong acid and a concentrated weak acid are both possible.
    topic_code: "4.8"
  - front: Stronger acid, weaker conjugate base → the rule
    back: |
      Cl⁻ (from strong HCl) has no tendency to accept a proton; F⁻ and CH₃COO⁻ (from weak acids) do, so their solutions are slightly basic.
    topic_code: "4.8"
  - front: Acid–base net ionic equations → the four combinations
    back: |
      Strong + strong: H⁺ + OH⁻ → H₂O. Weak acid + strong base: CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O. Strong acid + weak base: H⁺ + NH₃ → NH₄⁺. Weak + weak: CH₃COOH + NH₃ → CH₃COO⁻ + NH₄⁺.
    topic_code: "4.8"
  - front: 0.10 M HCl vs 0.10 M HF → moles of OH⁻ needed to neutralise each
    back: |
      The same: 0.10 mol per litre. As OH⁻ removes H₃O⁺ from the HF solution, more HF ionises until all of it has reacted; strength does not change the stoichiometry.
    topic_code: "4.8"
  - front: HCN + KOH → net ionic equation and conjugate base
    back: |
      HCN(aq) + OH⁻(aq) → CN⁻(aq) + H₂O(l); CN⁻ is the conjugate base of HCN. HCN is weak, so it is written as the molecule.
    topic_code: "4.8"
  - front: HCO₃⁻ + H₂O → H₂CO₃ + OH⁻ → the roles
    back: |
      HCO₃⁻ acts as the base (accepts H⁺) and H₂CO₃ is its conjugate acid; H₂O is the acid and OH⁻ its conjugate base.
    topic_code: "4.8"
  - front: Oxidation-number rules → the ordered list
    back: |
      Free element 0; monatomic ion = charge; F −1; group 1 +1, group 2 +2; H +1 (−1 in metal hydrides); O −2 (−1 in peroxides); sum = 0 for a compound, = charge for an ion.
    topic_code: "4.9"
  - front: Oxidation numbers in Cr₂O₇²⁻, MnO₄⁻, SO₄²⁻ → the central atoms
    back: |
      Cr: 2x − 14 = −2 → +6. Mn: x − 8 = −1 → +7. S: x − 8 = −2 → +6.
    topic_code: "4.9"
  - front: Oxidation numbers in NH₄⁺, ClO₃⁻, CH₄, CO₂, H₂O₂ → the values
    back: |
      N −3; Cl +5; C −4; C +4; O −1 (peroxide). Fractional averages are allowed (Fe in Fe₃O₄ is +8/3).
    topic_code: "4.9"
  - front: Oxidation and reduction → definitions in two ways
    back: |
      Oxidation: loss of electrons, oxidation number rises. Reduction: gain of electrons, oxidation number falls. "OIL RIG". They always occur together.
    topic_code: "4.9"
  - front: Oxidising agent vs reducing agent → which is which
    back: |
      The oxidising agent is reduced (it takes electrons); the reducing agent is oxidised (it gives electrons). In Zn + Cu²⁺, Zn is the reducing agent and Cu²⁺ the oxidising agent.
    topic_code: "4.9"
  - front: Good reducing agents and good oxidising agents → typical examples
    back: |
      Reducing: metals with low ionization energy (group 1, group 2, Al, Zn). Oxidising: electronegative nonmetals (F₂, Cl₂, O₂) and high-oxidation-state species (MnO₄⁻, Cr₂O₇²⁻, NO₃⁻ in acid).
    topic_code: "4.9"
  - front: Half-reaction method in acidic solution → the five steps
    back: |
      (1) Split into two half-reactions. (2) Balance atoms other than O and H. (3) Add H₂O for O, then H⁺ for H. (4) Add e⁻ to the more positive side to balance charge. (5) Scale so electrons cancel, add, simplify.
    topic_code: "4.9"
  - front: Balancing in basic solution → the extra step
    back: |
      Balance as in acid, then add OH⁻ to both sides to neutralise every H⁺ (H⁺ + OH⁻ → H₂O) and cancel water that appears on both sides.
    topic_code: "4.9"
  - front: Permanganate reduction half-reaction in acid → the balanced form
    back: |
      MnO₄⁻ + 8 H⁺ + 5 e⁻ → Mn²⁺ + 4 H₂O. Mn goes from +7 to +2, five electrons gained.
    topic_code: "4.9"
  - front: MnO₄⁻ + Fe²⁺ in acid → the overall balanced equation
    back: |
      MnO₄⁻ + 8 H⁺ + 5 Fe²⁺ → Mn²⁺ + 4 H₂O + 5 Fe³⁺. Charge +17 each side; 5 : 1 ratio of Fe²⁺ to MnO₄⁻.
    topic_code: "4.9"
  - front: Copper with concentrated nitric acid → the balanced equation
    back: |
      Cu + 2 NO₃⁻ + 4 H⁺ → Cu²⁺ + 2 NO₂ + 2 H₂O. Cu 0 → +2; N +5 → +4; brown NO₂ gas.
    topic_code: "4.9"
  - front: Dichromate with Fe²⁺ in acid → the balanced equation
    back: |
      Cr₂O₇²⁻ + 14 H⁺ + 6 Fe²⁺ → 2 Cr³⁺ + 7 H₂O + 6 Fe³⁺. Cr +6 → +3 (six electrons per dichromate); charge +24 each side.
    topic_code: "4.9"
  - front: Moles of electrons transferred → how to count
    back: |
      Change in oxidation number × number of atoms. 0.250 mol Zn → Zn²⁺ transfers 0.500 mol e⁻; 2 Al + 3 Cu²⁺ moves six electrons per equation.
    topic_code: "4.9"
  - front: Permanganate as its own indicator → the end point
    back: |
      MnO₄⁻ is intensely purple, Mn²⁺ almost colourless; the end point is the first permanent pale pink, when a trace of excess MnO₄⁻ persists.
    topic_code: "4.9"
  - front: Iron(II) titration, 25.00 mL needing 18.50 mL of 0.0200 M KMnO₄ → [Fe²⁺]
    back: |
      n(MnO₄⁻) = 3.70 × 10⁻⁴ mol; × 5 = 1.85 × 10⁻³ mol Fe²⁺; ÷ 0.02500 L = 0.0740 M; iron mass 0.103 g.
    topic_code: "4.9"
  - front: 2 Al + 3 Cl₂ → 2 AlCl₃ → oxidised, reduced, agents, electrons
    back: |
      Al oxidised (0 → +3), Cl₂ reduced (0 → −1); Cl₂ is the oxidising agent, Al the reducing agent; 3 mol e⁻ per mol Al, 6 per equation.
    topic_code: "4.9"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 4.8 and 4.9: Brønsted–Lowry acids and bases,
    conjugate pairs, strong and weak; oxidation numbers, half-reactions, agents and redox titrations), with
    review of titration, reaction types, net ionic equations, periodic trends, molarity and stoichiometry.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the
    scoring notes.
  questions:
    # ---- Stimulus set A: a permanganate titration of iron(II)
    - slug: apchem-u04-w16-q01
      type: multiple_choice
      topic_code: "4.9"
      source: "general knowledge"
      points: 1
      stimulus: |
        A 25.00 mL sample of an acidified iron(II) sulfate solution is titrated with 0.0200 M potassium permanganate. The purple titrant is decolourised as it is added until, after 18.50 mL, a faint pink colour persists. The reaction is

        MnO₄⁻(aq) + 8 H⁺(aq) + 5 Fe²⁺(aq) → Mn²⁺(aq) + 4 H₂O(l) + 5 Fe³⁺(aq)
      prompt: |
        Which species is oxidised, and which species is the oxidising agent?
      options:
        - "MnO₄⁻ is oxidised; Fe²⁺ is the oxidising agent."
        - "Fe²⁺ is oxidised; MnO₄⁻ is the oxidising agent."
        - "Fe²⁺ is oxidised; Fe²⁺ is the oxidising agent."
        - "H⁺ is oxidised; MnO₄⁻ is the oxidising agent."
      option_explanations:
        - |
          Manganese goes from +7 to +2, a decrease; MnO₄⁻ is reduced, not oxidised.
        - |
          Correct. Iron rises from +2 to +3 (oxidised, so Fe²⁺ is the reducing agent); permanganate takes those electrons and is reduced, which makes it the oxidising agent.
        - |
          The species oxidised is the reducing agent, not the oxidising agent.
        - |
          Hydrogen stays +1 throughout (H⁺ becomes the H in water); it is neither oxidised nor reduced.
      answer: 1
      explanation: |
        Oxidised = loses electrons = reducing agent; the oxidising agent is reduced.

    - slug: apchem-u04-w16-q02
      type: multiple_choice
      topic_code: "4.9"
      source: "general knowledge"
      points: 1
      stimulus: |
        A 25.00 mL sample of an acidified iron(II) sulfate solution is titrated with 0.0200 M potassium permanganate. The purple titrant is decolourised as it is added until, after 18.50 mL, a faint pink colour persists. The reaction is

        MnO₄⁻(aq) + 8 H⁺(aq) + 5 Fe²⁺(aq) → Mn²⁺(aq) + 4 H₂O(l) + 5 Fe³⁺(aq)
      prompt: |
        What is the concentration of Fe²⁺ in the sample?
      options:
        - "0.0148 M"
        - "0.00296 M"
        - "0.370 M"
        - "0.0740 M"
      option_explanations:
        - |
          0.0148 M uses a 1 : 1 ratio; five Fe²⁺ react with each MnO₄⁻.
        - |
          0.00296 M divides by five instead of multiplying.
        - |
          0.370 M uses the titrant volume in place of the sample volume in the final division, and omits a factor of 10.
        - |
          Correct. n(MnO₄⁻) = 0.01850 L × 0.0200 M = 3.70 × 10⁻⁴ mol; × 5 = 1.85 × 10⁻³ mol Fe²⁺; ÷ 0.02500 L = 0.0740 M.
      answer: 3
      explanation: |
        5 mol Fe²⁺ per mol MnO₄⁻.

    - slug: apchem-u04-w16-q03
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        A 25.00 mL sample of an acidified iron(II) sulfate solution is titrated with 0.0200 M potassium permanganate. The purple titrant is decolourised as it is added until, after 18.50 mL, a faint pink colour persists. The reaction is

        MnO₄⁻(aq) + 8 H⁺(aq) + 5 Fe²⁺(aq) → Mn²⁺(aq) + 4 H₂O(l) + 5 Fe³⁺(aq)
      prompt: |
        Why is no separate indicator needed for this titration, and what marks the end point?
      options:
        - "MnO₄⁻ is intensely purple and Mn²⁺ is nearly colourless, so the first persistent pink shows that a trace of excess permanganate remains."
        - "Fe³⁺ is deep purple, so the solution turns purple when all the Fe²⁺ has been oxidised."
        - "The reaction releases a gas, and the end point is when bubbling stops."
        - "Permanganate reacts with phenolphthalein already present in the acid."
      option_explanations:
        - |
          Correct. As long as Fe²⁺ remains, each drop of purple MnO₄⁻ is reduced to colourless Mn²⁺; once the Fe²⁺ is gone the next drop stays coloured.
        - |
          Fe³⁺ solutions are pale yellow, not purple; the colour comes from excess permanganate.
        - |
          No gas is produced in this reaction; every product (Mn²⁺, Fe³⁺, water) stays in solution, so bubbling cannot mark the end point.
        - |
          No phenolphthalein is used; this is not an acid–base titration.
      answer: 0
      explanation: |
        Permanganate is self-indicating.

    # ---- Multiple choice (4.8)
    - slug: apchem-u04-w16-q04
      type: multiple_choice
      topic_code: "4.8"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the conjugate base of the hydrogen sulfate ion, HSO₄⁻?
      options:
        - "H₂SO₄"
        - "H₃O⁺"
        - "SO₄²⁻"
        - "OH⁻"
      option_explanations:
        - |
          H₂SO₄ is the conjugate acid of HSO₄⁻ (one more proton), not its conjugate base.
        - |
          Hydronium is the conjugate acid of water; it is unrelated to HSO₄⁻ by a single proton.
        - |
          Correct. Removing one H⁺ from HSO₄⁻ leaves SO₄²⁻; the pair differs by exactly one proton.
        - |
          Hydroxide is the conjugate base of water, not of HSO₄⁻.
      answer: 2
      explanation: |
        Conjugate base = acid minus one H⁺.

    - slug: apchem-u04-w16-q05
      type: multiple_choice
      topic_code: "4.8"
      source: "general knowledge"
      points: 1
      prompt: |
        In the reaction NH₃(aq) + H₂O(l) ⇌ NH₄⁺(aq) + OH⁻(aq), which species acts as the Brønsted–Lowry acid?
      options:
        - "NH₃, because it contains hydrogen"
        - "H₂O, because it donates a proton to NH₃"
        - "NH₄⁺, because it is positively charged"
        - "OH⁻, because it is a strong base"
      option_explanations:
        - |
          Ammonia accepts a proton here, so it is the base; containing hydrogen does not make a species an acid.
        - |
          Correct. Water gives up a proton to ammonia, becoming OH⁻; the proton donor is the acid.
        - |
          NH₄⁺ is the conjugate acid formed, a product; the question asks which reactant acts as the acid.
        - |
          OH⁻ is the conjugate base of water, a product of the reaction.
      answer: 1
      explanation: |
        Water is amphoteric; here it donates.

    - slug: apchem-u04-w16-q06
      type: multiple_choice
      topic_code: "4.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Which species is amphoteric, able to act as either a Brønsted–Lowry acid or a Brønsted–Lowry base?
      options:
        - "Cl⁻"
        - "NH₄⁺"
        - "SO₄²⁻"
        - "HCO₃⁻"
      option_explanations:
        - |
          Chloride has no proton to donate; it can only (very weakly) accept one.
        - |
          Ammonium can donate a proton but has no lone pair available to accept one; it is an acid only.
        - |
          Sulfate has no proton to give; it can only accept.
        - |
          Correct. Hydrogen carbonate can donate its proton (→ CO₃²⁻) or accept one (→ H₂CO₃), depending on its partner.
      answer: 3
      explanation: |
        Amphoteric: has a proton to give and room to take one.

    - slug: apchem-u04-w16-q07
      type: multiple_choice
      topic_code: "4.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Two beakers contain 0.10 M hydrochloric acid and 0.10 M hydrofluoric acid. Which statement correctly compares them?
      options:
        - "The HCl solution has a much higher concentration of H₃O⁺ because HCl ionises completely while HF ionises only partly; yet both require the same moles of OH⁻ for complete neutralisation."
        - "The HF solution has the higher H₃O⁺ concentration because fluorine is more electronegative than chlorine."
        - "The HCl solution requires more OH⁻ to neutralise because it contains more H₃O⁺."
        - "Both solutions contain the same concentration of H₃O⁺ because both are 0.10 M."
      option_explanations:
        - |
          Correct. Strength governs the fraction ionised at any moment ([H₃O⁺] ≈ 0.10 M for HCl, about 0.008 M for HF), but as OH⁻ is added the remaining HF ionises, so both consume 0.10 mol OH⁻ per litre.
        - |
          HF is a weak acid despite fluorine's electronegativity; its strong H–F bond and the strong hydration of F⁻ keep most of it molecular.
        - |
          Total acid is the same (0.10 mol per litre); as OH⁻ is added the un-ionised HF ionises and reacts too.
        - |
          Concentration of the acid is the same, but the fraction ionised differs enormously.
      answer: 0
      explanation: |
        Strength ≠ amount: same moles of base, different [H₃O⁺].

    # ---- Multiple choice (4.9)
    - slug: apchem-u04-w16-q08
      type: multiple_choice
      topic_code: "4.9"
      source: "general knowledge"
      points: 1
      prompt: |
        What is the oxidation number of chromium in the dichromate ion, Cr₂O₇²⁻?
      options:
        - "+3"
        - "+7"
        - "+6"
        - "+12"
      option_explanations:
        - |
          +3 is chromium's oxidation state in Cr³⁺, the product of dichromate's reduction, not in dichromate itself.
        - |
          +7 is manganese's oxidation state in MnO₄⁻; dichromate has two chromium atoms sharing the positive charge.
        - |
          Correct. 2x + 7(−2) = −2 gives 2x = +12, so each chromium is +6.
        - |
          +12 is the total for both chromium atoms; the oxidation number is per atom.
      answer: 2
      explanation: |
        2x − 14 = −2 → x = +6.

    - slug: apchem-u04-w16-q09
      type: multiple_choice
      topic_code: "4.9"
      source: "general knowledge"
      points: 1
      prompt: |
        In the reaction 2 Al(s) + 3 Cu²⁺(aq) → 2 Al³⁺(aq) + 3 Cu(s), which species is the oxidising agent?
      options:
        - "Al, because it loses electrons"
        - "Cu²⁺, because it gains electrons and is reduced"
        - "Al³⁺, because it has the highest positive charge"
        - "Cu, because it is a product"
      option_explanations:
        - |
          Aluminium is oxidised (0 → +3), which makes it the reducing agent.
        - |
          Correct. Cu²⁺ accepts electrons (+2 → 0), so it is reduced; the species reduced is by definition the oxidising agent.
        - |
          Al³⁺ is the product of oxidation; it did not take electrons from anything in this reaction.
        - |
          Copper metal is the reduced product, not the agent that caused the oxidation.
      answer: 1
      explanation: |
        Oxidising agent = species reduced.

    - slug: apchem-u04-w16-q10
      type: multiple_choice
      topic_code: "4.9"
      source: "general knowledge"
      points: 1
      prompt: |
        Which is the correctly balanced half-reaction for the reduction of permanganate ion to manganese(II) ion in acidic solution?
      options:
        - "MnO₄⁻ + 4 H⁺ + 3 e⁻ → MnO₂ + 2 H₂O"
        - "MnO₄⁻ + 5 e⁻ → Mn²⁺ + 4 O²⁻"
        - "MnO₄⁻ + 8 H⁺ → Mn²⁺ + 4 H₂O + 5 e⁻"
        - "MnO₄⁻ + 8 H⁺ + 5 e⁻ → Mn²⁺ + 4 H₂O"
      option_explanations:
        - |
          This is the balanced reduction to MnO₂ (manganese +4), which occurs in neutral or basic solution, not the reduction to Mn²⁺.
        - |
          Free oxide ions do not exist in aqueous solution; oxygen is balanced with water and H⁺.
        - |
          The electrons are on the wrong side; a reduction gains electrons, which appear as reactants. As written the charge is +7 on the left and +2 − 5 = −3 on the right.
        - |
          Correct. Atoms: Mn 1/1, O 4/4, H 8/8. Charge: −1 + 8 − 5 = +2 on the left, +2 on the right. Manganese goes from +7 to +2 by gaining five electrons.
      answer: 3
      explanation: |
        Balance O with H₂O, H with H⁺, charge with e⁻ on the left for a reduction.

    # ---- Review (4.7)
    - slug: apchem-u04-w16-q11
      type: multiple_choice
      topic_code: "4.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following reactions is NOT an oxidation–reduction reaction?
      options:
        - "Ba²⁺(aq) + SO₄²⁻(aq) → BaSO₄(s)"
        - "2 H₂O₂(aq) → 2 H₂O(l) + O₂(g)"
        - "Cu(s) + 2 Ag⁺(aq) → Cu²⁺(aq) + 2 Ag(s)"
        - "2 Mg(s) + O₂(g) → 2 MgO(s)"
      option_explanations:
        - |
          Correct. Precipitation changes no oxidation states: Ba stays +2, S +6, O −2; the ions simply leave solution as a solid.
        - |
          Oxygen goes from −1 in peroxide to −2 in water and 0 in O₂; this decomposition is redox.
        - |
          Copper goes from 0 to +2 and silver from +1 to 0; electrons are transferred.
        - |
          Magnesium goes from 0 to +2 and oxygen from 0 to −2; synthesis from elements is redox.
      answer: 0
      explanation: |
        No change in oxidation state → not redox.

    # ---- Review (1.7)
    - slug: apchem-u04-w16-q12
      type: multiple_choice
      topic_code: "1.7"
      source: "NIST Atomic Spectra Database (ionization energies, rounded)"
      points: 1
      prompt: |
        Sodium metal is a far stronger reducing agent than magnesium metal. Which periodic property most directly explains this?
      options:
        - "Sodium has the larger electron affinity, so it attracts electrons more strongly."
        - "Sodium has the higher electronegativity, so it holds its electrons less tightly."
        - "Sodium has the lower first ionization energy (496 kJ/mol versus 738 kJ/mol), so it gives up its valence electron more easily."
        - "Sodium has more valence electrons to donate than magnesium."
      option_explanations:
        - |
          A large electron affinity describes an atom's tendency to gain an electron, the opposite of reducing behaviour; sodium's is also small.
        - |
          Sodium's electronegativity is lower than magnesium's, not higher, and the statement contradicts itself.
        - |
          Correct. A reducing agent donates electrons; the lower the ionization energy, the more easily the electron is lost, and sodium's lower effective nuclear charge makes its 3s electron easier to remove.
        - |
          Sodium has one valence electron, magnesium two; the number of electrons is not what sets reducing strength.
      answer: 2
      explanation: |
        Low ionization energy → easily oxidised → strong reducing agent.

    # ---- Multi-select
    - slug: apchem-u04-w16-q13
      type: multi_select
      topic_code: "4.9"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Consider the reaction Zn(s) + 2 HCl(aq) → ZnCl₂(aq) + H₂(g). Which statements are correct? Select all that apply.
      options:
        - "Zinc is oxidised from 0 to +2."
        - "Hydrogen is reduced from +1 to 0."
        - "Chlorine is reduced from 0 to −1."
        - "H⁺ is the oxidising agent."
        - "Two moles of electrons are transferred per mole of zinc."
      option_explanations:
        - |
          Correct. Zinc metal (0) becomes Zn²⁺ (+2), losing two electrons.
        - |
          Correct. H⁺ (+1) becomes H₂ (0), gaining electrons.
        - |
          Incorrect, so it should not be selected. Chlorine is −1 in HCl and −1 in ZnCl₂; it is a spectator and its oxidation number never changes.
        - |
          Correct. H⁺ gains the electrons zinc loses, so it is reduced and is the oxidising agent.
        - |
          Correct. Each Zn atom loses two electrons (0 → +2), which reduce two H⁺ to one H₂.
      answer: [0, 1, 3, 4]
      explanation: |
        Zn oxidised, H⁺ reduced, Cl⁻ spectator, 2 e⁻ per Zn.

    - slug: apchem-u04-w16-q14
      type: multi_select
      topic_code: "4.2"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following net ionic equations are correctly written? Select all that apply.
      options:
        - "HNO₃ + KOH: H⁺(aq) + OH⁻(aq) → H₂O(l)"
        - "HF + NaOH: HF(aq) + OH⁻(aq) → F⁻(aq) + H₂O(l)"
        - "HCl + NH₃: HCl(aq) + NH₃(aq) → NH₄⁺(aq) + Cl⁻(aq)"
        - "CH₃COOH + NH₃: CH₃COOH(aq) + NH₃(aq) → CH₃COO⁻(aq) + NH₄⁺(aq)"
        - "H₂SO₄ + Ba(OH)₂: H⁺(aq) + OH⁻(aq) → H₂O(l) only, since all ions are spectators"
      option_explanations:
        - |
          Correct. Strong acid and strong base; K⁺ and NO₃⁻ cancel.
        - |
          Correct. HF is weak and stays molecular; Na⁺ is the spectator.
        - |
          Incorrect, so it should not be selected. HCl is a strong acid and must be written as H⁺ + Cl⁻; Cl⁻ then cancels, leaving H⁺ + NH₃ → NH₄⁺.
        - |
          Correct. Both are weak and written as molecules; nothing cancels.
        - |
          Incorrect, so it should not be selected. Barium sulfate precipitates, so Ba²⁺ and SO₄²⁻ are not spectators: the net ionic equation is 2 H⁺ + SO₄²⁻ + Ba²⁺ + 2 OH⁻ → BaSO₄(s) + 2 H₂O.
      answer: [0, 1, 3]
      explanation: |
        Strong as ions, weak as molecules, precipitating ions kept.

    # ---- True / false
    - slug: apchem-u04-w16-q15
      type: true_false
      topic_code: "4.8"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: the conjugate base of a strong acid has a negligible tendency to accept a proton in water.
      answer: true
      explanation: |
        True. Because the strong acid gives up its proton completely, its conjugate base (Cl⁻, NO₃⁻, ClO₄⁻) does not take it back; the stronger the acid, the weaker the conjugate base.

    - slug: apchem-u04-w16-q16
