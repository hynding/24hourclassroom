    # ---- Short answer
    - slug: apchem-u04-w14-q22
      type: short_answer
      topic_code: "4.4"
      source: "general knowledge"
      points: 3
      prompt: |
        Three processes are carried out on water: (1) ice is melted; (2) sodium chloride is dissolved in the water; (3) a direct current is passed through the water, producing hydrogen and oxygen gases.
        (a) Classify process (1) as physical or chemical and justify the classification in terms of the interactions that change.
        (b) Explain why process (2) is usually classified as physical even though strong interparticle attractions are broken.
        (c) Classify process (3) and explain what distinguishes it from process (1) at the particle level.
      answer: |
        (a) Physical. Melting overcomes some of the hydrogen bonds between water molecules so they can move past one another; every O–H covalent bond within the molecules remains, and the liquid is still water.
        (b) Dissolving NaCl breaks the ionic attractions of the lattice and forms ion–dipole attractions between the ions and water, but the Na⁺ and Cl⁻ ions themselves are unchanged and the salt can be recovered unchanged by evaporating the water; because no bonds within particles are broken or formed and no new substance results, it is treated as physical.
        (c) Chemical. Electrolysis breaks the O–H covalent bonds within the water molecules and forms new H–H and O=O bonds, producing substances (H₂ and O₂) with completely different properties; melting changes only intermolecular interactions.
      explanation: |
        Scoring: 1 point for (a) physical with hydrogen bonds (intermolecular) overcome and O–H bonds preserved; 1 point for (b) recognising that ionic and ion–dipole interactions change but the ions are unchanged and recoverable; 1 point for (c) chemical with covalent bonds broken and formed and new substances produced, contrasted with (1).

    - slug: apchem-u04-w14-q23
      type: short_answer
      topic_code: "4.5"
      source: "PubChem (molar masses)"
      points: 3
      prompt: |
        A student heats 3.00 g of magnesium ribbon (24.31 g/mol) in air to form magnesium oxide: 2 Mg + O₂ → 2 MgO (40.30 g/mol). The product weighs 4.72 g.
        (a) Calculate the theoretical yield of MgO.
        (b) Calculate the percent yield.
        (c) The student notices that the product contains a small amount of magnesium nitride, Mg₃N₂, formed from nitrogen in the air. Explain whether this side reaction would make the measured yield higher or lower than it would otherwise be, and why.
      answer: |
        (a) 3.00 ÷ 24.31 = 0.1234 mol Mg → 0.1234 mol MgO × 40.30 = 4.97 g.
        (b) 4.72 ÷ 4.97 × 100 = 95.0 %.
        (c) Lower. Each magnesium atom that becomes Mg₃N₂ (33.7 g per mol Mg) adds less mass than one that becomes MgO (40.3 g per mol Mg), because N₂ contributes less mass per Mg than O₂ does; the product mass, and hence the apparent yield of MgO, is therefore smaller than if all the Mg had formed the oxide.
      explanation: |
        Scoring: 1 point for (a) 4.97 g (accept 4.96–4.98) with the 1 : 1 mole ratio; 1 point for (b) 95.0 % (accept 94.9–95.1); 1 point for (c) "lower" with the reasoning that nitride adds less mass per magnesium atom than oxide. Accept "higher" only with an explicitly correct argument that the nitride was weighed as if it were oxide and its mass per Mg exceeds that of the oxide, which it does not, so this is not expected.

    # ---- Long answer
    - slug: apchem-u04-w14-q24
      type: long_answer
      topic_code: "4.5"
      source: "PubChem (molar masses)"
      points: 6
      prompt: |
        A student adds 0.540 g of aluminium foil (26.98 g/mol) to 100.0 mL of 0.250 M copper(II) chloride solution. The reaction is 2 Al(s) + 3 CuCl₂(aq) → 2 AlCl₃(aq) + 3 Cu(s). After the reaction the copper is filtered, dried and weighed: 1.45 g (Cu = 63.55 g/mol).
        (a) Determine which reactant is limiting, showing the calculation.
        (b) Calculate the theoretical yield of copper.
        (c) Calculate the percent yield.
        (d) Calculate the mass of the excess reactant that remains after the reaction.
        (e) Determine the concentration of Al³⁺ ions in the solution after the reaction, assuming the volume stays 100.0 mL.
        (f) The student observes that the solution was still faintly blue at the end. Explain what this suggests about the reaction and how it affects the interpretation of the percent yield.
      answer: |
        (a) Al: 0.540 ÷ 26.98 = 0.0200 mol; ÷ 2 = 0.0100. CuCl₂: 0.1000 L × 0.250 M = 0.0250 mol; ÷ 3 = 0.00833. The smaller quotient belongs to CuCl₂, so copper(II) chloride is limiting.
        (b) 0.0250 mol CuCl₂ × (3 Cu / 3 CuCl₂) = 0.0250 mol Cu × 63.55 = 1.59 g.
        (c) 1.45 ÷ 1.59 × 100 = 91.2 %.
        (d) Al used = 0.0250 × (2/3) = 0.0167 mol; remaining = 0.0200 − 0.0167 = 0.0033 mol × 26.98 = 0.090 g of aluminium.
        (e) Al³⁺ formed = 0.0167 mol in 0.1000 L = 0.167 M.
        (f) A blue tint means some Cu²⁺ remained unreacted, so the reaction did not go to completion (perhaps the aluminium's oxide coating slowed it or it was not stirred long enough). The theoretical yield assumed all Cu²⁺ reacted, so part of the shortfall in the 91 % yield is unreacted copper(II), not lost product; the yield of the reaction that did occur is higher than 91 %.
      explanation: |
        Scoring: (a) 1 point for moles of both reactants compared relative to the coefficients with CuCl₂ identified as limiting; (b) 1 point for 1.59 g; (c) 1 point for 91.2 % (accept 91.0–91.5); (d) 1 point for 0.090 g Al remaining (accept 0.085–0.095); (e) 1 point for 0.167 M; (f) 1 point for linking the blue colour to unreacted Cu²⁺ (incomplete reaction) and explaining that this lowers the measured yield independently of losses.
