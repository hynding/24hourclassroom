week: 14
unit: 4
title: "Physical and Chemical Changes, and Stoichiometry"
topics: ["4.4", "4.5"]
guide: guides/week-14.md
guide_description: |
  The particle-level line between physical change (intermolecular interactions) and chemical change (bonds
  break and form), with the dissolving of ionic solids and of HCl as the cases on the line; then the mole road
  of stoichiometry from mass, gas volume or solution through the mole ratio, limiting reactant by the
  moles-over-coefficient test, theoretical and percent yield, and leftover excess. Worked examples: iron from
  Fe₂O₃, oxygen from KClO₃, AgCl from silver nitrate, CO₂ from a carbonate, H₂ against O₂, lead iodide in
  solution, and an iron–copper displacement lab.
flashcards_description: |
  30 cards on classifying changes by the interactions involved, the three routes into moles, mole ratios,
  mass–mass, mass–volume and solution stoichiometry, the limiting-reactant test, excess, theoretical yield and
  percent yield.

flashcards:
  - front: Physical change at the particle level → what changes
    back: |
      Only intermolecular or interparticle interactions are overcome or formed; every bond inside the particles survives. Melting, boiling, subliming, dissolving a molecular solid.
    topic_code: "4.4"
  - front: Chemical change at the particle level → what changes
    back: |
      Covalent or ionic bonds break and new ones form, giving substances with new properties. Combustion, rusting, precipitation, electrolysis, acid ionisation.
    topic_code: "4.4"
  - front: Boiling water vs electrolysing water → the contrast
    back: |
      Boiling breaks hydrogen bonds between molecules (physical; the vapour is still H₂O). Electrolysis breaks O–H bonds and forms H–H and O=O (chemical; new substances).
    topic_code: "4.4"
  - front: Dissolving sugar → why it is physical
    back: |
      Sugar–sugar hydrogen bonds are replaced by sugar–water hydrogen bonds; the sucrose molecules are intact and return on evaporation.
    topic_code: "4.4"
  - front: Dissolving NaCl → the borderline case and the AP treatment
    back: |
      Ionic attractions in the lattice are replaced by ion–dipole attractions with water; the ions are unchanged and the salt is recovered on evaporation, so it is usually classed as physical despite the strong forces involved.
    topic_code: "4.4"
  - front: Dissolving HCl gas in water → why it is chemical
    back: |
      The H–Cl covalent bond breaks and a new O–H bond forms in H₃O⁺; the solution contains hydronium and chloride ions, species not present in the gas.
    topic_code: "4.4"
  - front: Dry ice subliming → classification and reason
    back: |
      Physical: CO₂ molecules escape the dispersion forces of the solid unchanged; the gas is still CO₂.
    topic_code: "4.4"
  - front: Baking soda with vinegar → classification and reason
    back: |
      Chemical: a proton transfers and C–O bonds rearrange to release CO₂ gas, a new substance; the fizz is the evidence.
    topic_code: "4.4"
  - front: Test for physical vs chemical → the question to ask
    back: |
      Which interactions change? Intermolecular only → physical. Bonds within particles → chemical. Reversibility is a weaker guide (some chemical changes reverse easily).
    topic_code: "4.4"
  - front: The mole road → the spine of every stoichiometry problem
    back: |
      Measured quantity of A → moles of A → mole ratio from the balanced equation → moles of B → quantity of B. The ratio step is the only link between two substances.
    topic_code: "4.5"
  - front: Three ways into moles → the conversions
    back: |
      Mass ÷ molar mass; gas: n = PV/RT (22.4 L/mol only at STP); solution: n = M × V(L).
    topic_code: "4.5"
  - front: Mole ratio → where it comes from
    back: |
      The coefficients of the balanced equation. In Fe₂O₃ + 3 CO → 2 Fe + 3 CO₂, 1 mol Fe₂O₃ gives 2 mol Fe; 3 mol CO give 3 mol CO₂.
    topic_code: "4.5"
  - front: Iron from 25.0 g Fe₂O₃ → the calculation
    back: |
      25.0 ÷ 159.70 = 0.1566 mol Fe₂O₃ × 2 = 0.3131 mol Fe × 55.85 = 17.5 g Fe.
    topic_code: "4.5"
  - front: Oxygen volume from 5.00 g KClO₃ at 298 K and 1.00 atm → the calculation
    back: |
      2 KClO₃ → 2 KCl + 3 O₂. 5.00 ÷ 122.55 = 0.0408 mol × 3/2 = 0.0612 mol O₂; V = nRT/P = 1.50 L.
    topic_code: "4.5"
  - front: AgCl from 25.0 mL of 0.150 M AgNO₃ with excess chloride → the calculation
    back: |
      0.0250 L × 0.150 M = 0.00375 mol Ag⁺ → 0.00375 mol AgCl × 143.32 g/mol = 0.538 g.
    topic_code: "4.5"
  - front: CO₂ from 2.50 g CaCO₃ with excess acid at 298 K, 1.00 atm → the calculation
    back: |
      2.50 ÷ 100.09 = 0.0250 mol CO₂; V = (0.0250)(0.08206)(298) ÷ 1.00 = 0.611 L.
    topic_code: "4.5"
  - front: Limiting reactant → definition
    back: |
      The reactant consumed first; it fixes the maximum amount of product. Everything after it is computed from the limiting reactant, never from the one in excess.
    topic_code: "4.5"
  - front: Quick test for the limiting reactant → the quotient method
    back: |
      Divide each reactant's moles by its coefficient; the smallest quotient marks the limiting reactant. Grams never decide; moles divided by coefficients do.
    topic_code: "4.5"
  - front: 4.00 g H₂ with 24.0 g O₂ → limiting reactant and water formed
    back: |
      H₂: 1.98 mol ÷ 2 = 0.99; O₂: 0.750 mol ÷ 1 = 0.750 → O₂ limits. Water: 0.750 × 2 = 1.50 mol = 27.0 g. H₂ left: 0.48 mol.
    topic_code: "4.5"
  - front: Excess reactant left over → how to find it
    back: |
      Moles of excess used = moles of limiting × (coefficient ratio); subtract from the starting moles. 1.98 − 1.50 = 0.48 mol H₂ remains in the example.
    topic_code: "4.5"
  - front: Limiting reactant in solution, 20.0 mL 0.100 M Pb(NO₃)₂ + 30.0 mL 0.100 M KI → the result
    back: |
      Pb²⁺ 0.00200 mol needs 0.00400 mol I⁻; only 0.00300 present, so I⁻ limits. PbI₂ = 0.00150 mol × 461.0 = 0.692 g; 0.00050 mol Pb²⁺ remains.
    topic_code: "4.5"
  - front: Theoretical yield → definition
    back: |
      The maximum mass (or moles) of product calculated from the limiting reactant, assuming complete reaction and no losses.
    topic_code: "4.5"
  - front: Percent yield → formula
    back: |
      (actual yield ÷ theoretical yield) × 100 %. 24.3 g obtained against 27.0 g theoretical is 90.0 %.
    topic_code: "4.5"
  - front: Why percent yield is below 100 % → the usual reasons
    back: |
      Incomplete reaction, competing side reactions, product lost in transfer, filtration or washing, product that stays dissolved.
    topic_code: "4.5"
  - front: Percent yield above 100 % → what it means
    back: |
      The product is impure or still wet (or contaminated with unreacted excess), not that mass was created. Dry the product and remeasure.
    topic_code: "4.5"
  - front: Iron filings in copper(II) sulfate, 2.00 g Fe with 50.0 mL 0.500 M CuSO₄ → limiting reactant and theoretical copper
    back: |
      Fe 0.0358 mol; Cu²⁺ 0.0250 mol; 1 : 1 so CuSO₄ limits. Cu = 0.0250 × 63.55 = 1.59 g. 1.42 g recovered is an 89.4 % yield.
    topic_code: "4.5"
  - front: 0.540 g Al with 100.0 mL 0.250 M CuCl₂ → limiting reactant
    back: |
      2 Al + 3 CuCl₂ → 2 AlCl₃ + 3 Cu. Al 0.0200 ÷ 2 = 0.0100; CuCl₂ 0.0250 ÷ 3 = 0.00833 → CuCl₂ limits; Cu = 0.0250 × 63.55 = 1.59 g.
    topic_code: "4.5"
  - front: Using 22.4 L/mol → the only conditions it applies to
    back: |
      STP: 273 K and 1 atm. At any other temperature or pressure use PV = nRT (24.5 L/mol at 298 K and 1 atm).
    topic_code: "4.5"
  - front: Volume of 0.200 M BaCl₂ to precipitate the sulfate in 50.0 mL of 0.150 M Na₂SO₄ → the calculation
    back: |
      0.0500 × 0.150 = 0.00750 mol SO₄²⁻ → 0.00750 mol Ba²⁺ ÷ 0.200 M = 0.0375 L = 37.5 mL.
    topic_code: "4.5"
  - front: Mass of CO₂ from burning 10.0 g propane → the calculation
    back: |
      10.0 ÷ 44.09 = 0.227 mol C₃H₈ × 3 = 0.680 mol CO₂ × 44.01 = 29.9 g.
    topic_code: "4.5"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 4.4 and 4.5: physical versus chemical change
    at the particle level; stoichiometry, limiting reactant, theoretical and percent yield), with review of
    molarity, the mole, net ionic equations, phases, gases and empirical formulas. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the
    short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: iron in copper(II) sulfate
    - slug: apchem-u04-w14-q01
      type: multiple_choice
      topic_code: "4.5"
      source: "PubChem (molar masses)"
      points: 1
      stimulus: |
        A student adds 2.00 g of iron filings (Fe, 55.85 g/mol) to 50.0 mL of 0.500 M copper(II) sulfate solution and stirs until the blue colour fades. The reaction is Fe(s) + CuSO₄(aq) → FeSO₄(aq) + Cu(s). The solid is filtered, washed, dried and weighed: 1.42 g of copper (63.55 g/mol) is recovered.
      prompt: |
        Which reactant is limiting?
      options:
        - "Iron, because 2.00 g is less than the mass of copper sulfate present"
        - "Copper(II) sulfate, because 0.0250 mol of Cu²⁺ is less than 0.0358 mol of Fe in the 1 : 1 reaction"
        - "Iron, because 0.0358 mol of Fe is more than 0.0250 mol of Cu²⁺"
        - "Neither; the reactants are present in exactly the stoichiometric ratio"
      option_explanations:
        - |
          Masses do not decide; the comparison must be made in moles against the equation's ratio.
        - |
          Correct. Cu²⁺: 0.0500 L × 0.500 M = 0.0250 mol; Fe: 2.00 ÷ 55.85 = 0.0358 mol; the 1 : 1 ratio means the smaller amount, Cu²⁺, runs out first.
        - |
          Having more moles makes iron the excess reactant, not the limiting one.
        - |
          0.0358 mol Fe against 0.0250 mol Cu²⁺ is not a 1 : 1 match; iron is in excess by 0.0108 mol.
      answer: 1
      explanation: |
        Fewer moles relative to the coefficient → limiting.

    - slug: apchem-u04-w14-q02
      type: multiple_choice
      topic_code: "4.5"
      source: "PubChem (molar masses)"
      points: 1
      stimulus: |
        A student adds 2.00 g of iron filings (Fe, 55.85 g/mol) to 50.0 mL of 0.500 M copper(II) sulfate solution and stirs until the blue colour fades. The reaction is Fe(s) + CuSO₄(aq) → FeSO₄(aq) + Cu(s). The solid is filtered, washed, dried and weighed: 1.42 g of copper (63.55 g/mol) is recovered.
      prompt: |
        What is the theoretical yield of copper?
      options:
        - "2.28 g"
        - "1.42 g"
        - "2.00 g"
        - "1.59 g"
      option_explanations:
        - |
          2.28 g uses the iron (0.0358 mol × 63.55), the excess reactant; the theoretical yield must come from the limiting reactant.
        - |
          1.42 g is the actual yield, what was recovered; the theoretical yield is the calculated maximum.
        - |
          2.00 g is the mass of iron added; copper's mass is not equal to iron's even in a 1 : 1 reaction, because the molar masses differ.
        - |
          Correct. The limiting Cu²⁺ (0.0250 mol) gives 0.0250 mol Cu × 63.55 g/mol = 1.59 g.
      answer: 3
      explanation: |
        Theoretical yield from the limiting reactant: 0.0250 mol × 63.55 = 1.59 g.

    - slug: apchem-u04-w14-q03
      type: multiple_choice
      topic_code: "3.7"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student adds 2.00 g of iron filings (Fe, 55.85 g/mol) to 50.0 mL of 0.500 M copper(II) sulfate solution and stirs until the blue colour fades. The reaction is Fe(s) + CuSO₄(aq) → FeSO₄(aq) + Cu(s). The solid is filtered, washed, dried and weighed: 1.42 g of copper (63.55 g/mol) is recovered.
      prompt: |
        Assuming the reaction goes to completion and the volume stays 50.0 mL, what is the concentration of Fe²⁺ ions in the solution after the reaction?
      options:
        - "0.500 M"
        - "0.716 M"
        - "0.250 M"
        - "0.0250 M"
      option_explanations:
        - |
          Correct. Each Cu²⁺ consumed releases one Fe²⁺: 0.0250 mol Fe²⁺ in 0.0500 L = 0.500 M.
        - |
          0.716 M would require all 0.0358 mol of iron to dissolve, but only 0.0250 mol react before the Cu²⁺ is used up.
        - |
          0.250 M halves the answer without reason; the mole ratio Fe : Cu²⁺ is 1 : 1 and the volume is 0.0500 L.
        - |
          0.0250 is the number of moles of Fe²⁺, not its concentration; divide by 0.0500 L.
      answer: 0
      explanation: |
        Moles of Fe²⁺ = moles of Cu²⁺ reacted = 0.0250 mol in 0.0500 L.

    # ---- Multiple choice (4.4)
    - slug: apchem-u04-w14-q04
      type: multiple_choice
      topic_code: "4.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Which process is a physical change, and what is the particle-level reason?
      options:
        - "Hydrogen burning in oxygen; the molecules are rearranged into water."
        - "Iron rusting; iron atoms bond to oxygen."
        - "Sucrose dissolving in water; sucrose–sucrose hydrogen bonds are replaced by sucrose–water hydrogen bonds and the molecules stay intact."
        - "HCl gas dissolving in water; the H–Cl bond breaks to form H₃O⁺ and Cl⁻."
      option_explanations:
        - |
          Combustion breaks H–H and O=O bonds and forms O–H bonds; it is a chemical change.
        - |
          Rusting forms new Fe–O bonds in iron(III) oxide; it is chemical.
        - |
          Correct. Only intermolecular interactions change; the sucrose molecules keep every covalent bond and can be recovered by evaporation.
        - |
          Dissolving HCl breaks a covalent bond and forms a new one; it is a chemical change even though it is "just dissolving".
      answer: 2
      explanation: |
        Physical = only intermolecular interactions change.

    - slug: apchem-u04-w14-q05
      type: multiple_choice
      topic_code: "4.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Dissolving hydrogen chloride gas in water is classified as a chemical change, while dissolving sodium chloride is usually treated as a physical change. Which statement best justifies the distinction?
      options:
        - "HCl is a gas and NaCl is a solid, and only gases react with water."
        - "The H–Cl covalent bond breaks and a new O–H bond forms in H₃O⁺, creating species not present before; NaCl's ions are unchanged, merely separated and hydrated."
        - "NaCl dissolves without any change in interactions, while HCl forms ion–dipole attractions."
        - "HCl solutions conduct electricity but NaCl solutions do not."
      option_explanations:
        - |
          The state of the solute is irrelevant; many solids react with water (sodium metal, for example).
        - |
          Correct. The criterion is whether bonds within the particles break and form (HCl: yes, giving H₃O⁺ and Cl⁻) or only interparticle attractions change (NaCl: ionic attractions replaced by ion–dipole attractions, ions intact).
        - |
          Dissolving NaCl involves a large change in interactions (lattice attractions to ion–dipole attractions); the point is that the ions themselves are unchanged.
        - |
          Both solutions conduct well; both contain mobile ions once dissolved.
      answer: 1
      explanation: |
        Bond breaking (H–Cl) marks the chemical change.

    # ---- Multiple choice (4.5)
    - slug: apchem-u04-w14-q06
      type: multiple_choice
      topic_code: "4.5"
      source: "PubChem (molar masses)"
      points: 1
      prompt: |
        Iron(III) oxide is reduced by carbon monoxide: Fe₂O₃ + 3 CO → 2 Fe + 3 CO₂. What mass of iron is produced from 25.0 g of Fe₂O₃ (159.70 g/mol) with excess CO? (Fe = 55.85 g/mol)
      options:
        - "8.74 g"
        - "25.0 g"
        - "35.0 g"
        - "17.5 g"
      option_explanations:
        - |
          8.74 g uses a 1 : 1 ratio; each formula unit of Fe₂O₃ contains two iron atoms.
        - |
          25.0 g is the mass of oxide; the oxygen leaves as CO₂, so the iron must weigh less.
        - |
          35.0 g doubles the oxide mass instead of converting through moles; iron cannot weigh more than the oxide it came from.
        - |
          Correct. 25.0 ÷ 159.70 = 0.1566 mol Fe₂O₃ × 2 = 0.3131 mol Fe × 55.85 = 17.5 g.
      answer: 3
      explanation: |
        Mass → moles → ×2 → mass.

    - slug: apchem-u04-w14-q07
      type: multiple_choice
      topic_code: "4.5"
      source: "PubChem (molar masses)"
      points: 1
      prompt: |
        Potassium chlorate decomposes on heating: 2 KClO₃ → 2 KCl + 3 O₂. What volume of O₂, measured at 298 K and 1.00 atm, is produced from 5.00 g of KClO₃ (122.55 g/mol)? (R = 0.08206 L·atm/(mol·K))
      options:
        - "1.50 L"
        - "0.998 L"
        - "1.37 L"
        - "2.25 L"
      option_explanations:
        - |
          Correct. 5.00 ÷ 122.55 = 0.0408 mol KClO₃ × 3/2 = 0.0612 mol O₂; V = nRT/P = (0.0612)(0.08206)(298) = 1.50 L.
        - |
          0.998 L uses a 1 : 1 mole ratio; each 2 mol of KClO₃ gives 3 mol of O₂.
        - |
          1.37 L uses 22.4 L/mol, which applies only at 273 K; at 298 K the molar volume is 24.5 L.
        - |
          2.25 L uses a ratio of 3 : 1 (tripling the moles of KClO₃) instead of 3 : 2.
      answer: 0
      explanation: |
        Mole ratio 3/2, then PV = nRT at 298 K.

    - slug: apchem-u04-w14-q08
      type: multiple_choice
      topic_code: "4.5"
      source: "general knowledge"
      points: 1
      prompt: |
        A student's synthesis of a solid product gives a percent yield of 108 %. Which is the most likely explanation?
      options:
        - "The reaction produced more product than the limiting reactant allowed because the excess reactant also reacted."
        - "The law of conservation of mass does not apply to this reaction."
        - "The product was weighed before it was completely dry, or it was contaminated with unreacted starting material."
        - "The student used too much of the limiting reactant."
      option_explanations:
        - |
          The excess reactant cannot react once the limiting reactant is gone; it has nothing to react with.
        - |
          Conservation of mass always applies; an apparent excess signals a measurement or purity problem.
        - |
          Correct. Water or impurities add mass that is not product; drying and purifying the solid would bring the yield to or below 100 %.
        - |
          Using more limiting reactant raises the theoretical yield as well, so the percentage would not exceed 100 %.
      answer: 2
      explanation: |
        Yield above 100 % means impure or wet product.

    - slug: apchem-u04-w14-q09
      type: multiple_choice
      topic_code: "4.5"
      source: "PubChem (molar masses)"
      points: 1
      prompt: |
        25.0 mL of 0.150 M silver nitrate is treated with excess sodium chloride solution. What mass of silver chloride, AgCl (143.32 g/mol), precipitates?
      options:
        - "0.215 g"
        - "0.538 g"
        - "3.75 g"
        - "21.5 g"
      option_explanations:
        - |
          0.215 g uses 0.00150 mol, which would come from 10.0 mL of solution; the volume is 25.0 mL.
        - |
          Correct. 0.0250 L × 0.150 M = 0.00375 mol Ag⁺ → 0.00375 mol AgCl × 143.32 g/mol = 0.538 g.
        - |
          3.75 g treats 25.0 mL as 25.0 L (millimoles mistaken for moles).
        - |
          21.5 g uses 0.150 mol, the amount in a full litre, not in 25.0 mL.
      answer: 1
      explanation: |
        M × V(L) → moles → × molar mass.

    - slug: apchem-u04-w14-q10
      type: multiple_choice
      topic_code: "4.5"
      source: "PubChem (molar masses)"
      points: 1
      prompt: |
        4.00 g of hydrogen (H₂, 2.016 g/mol) and 24.0 g of oxygen (O₂, 32.00 g/mol) react: 2 H₂ + O₂ → 2 H₂O. What is the maximum mass of water (18.02 g/mol) that can form?
      options:
        - "28.0 g"
        - "35.8 g"
        - "13.5 g"
        - "27.0 g"
      option_explanations:
        - |
          28.0 g adds the reactant masses; not all of the hydrogen reacts, so the water weighs less than the total.
        - |
          35.8 g uses all 1.98 mol of H₂; oxygen (0.750 mol) runs out first and limits the water to 1.50 mol.
        - |
          13.5 g uses 0.750 mol of water, forgetting that each O₂ gives two H₂O.
        - |
          Correct. H₂: 1.98 mol ÷ 2 = 0.99; O₂: 0.750 mol ÷ 1 = 0.750 → O₂ limits; water = 0.750 × 2 = 1.50 mol × 18.02 = 27.0 g.
      answer: 3
      explanation: |
        O₂ limiting; 1.50 mol H₂O = 27.0 g.

    # ---- Review (1.1)
    - slug: apchem-u04-w14-q11
      type: multiple_choice
      topic_code: "1.1"
      source: "NIST CODATA constants"
      points: 1
      prompt: |
        How many oxygen molecules are present in 0.750 mol of O₂?
      options:
        - "4.52 × 10²³"
        - "9.03 × 10²³"
        - "2.26 × 10²³"
        - "6.02 × 10²³"
      option_explanations:
        - |
          Correct. 0.750 mol × 6.022 × 10²³ mol⁻¹ = 4.52 × 10²³ molecules.
        - |
          9.03 × 10²³ is the number of oxygen atoms (two per molecule), not molecules.
        - |
          2.26 × 10²³ halves the correct count; nothing in the question calls for dividing by two.
        - |
          6.02 × 10²³ is the number of molecules in exactly one mole, not in 0.750 mol.
      answer: 0
      explanation: |
        n × N_A.

    # ---- Review (4.2)
    - slug: apchem-u04-w14-q12
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which is the net ionic equation for iron filings reacting with aqueous copper(II) sulfate?
      options:
        - "Fe(s) + CuSO₄(aq) → FeSO₄(aq) + Cu(s)"
        - "Fe(s) + Cu²⁺(aq) + SO₄²⁻(aq) → Fe²⁺(aq) + SO₄²⁻(aq) + Cu(s)"
        - "Fe(s) + Cu²⁺(aq) → Fe²⁺(aq) + Cu(s)"
        - "Fe²⁺(aq) + Cu(s) → Fe(s) + Cu²⁺(aq)"
      option_explanations:
        - |
          This is the molecular equation; the sulfate spectator has not been separated out and cancelled.
        - |
          This is the complete ionic equation; SO₄²⁻ appears unchanged on both sides and should be removed.
        - |
          Correct. Sulfate is a spectator; the change is iron atoms becoming Fe²⁺ while Cu²⁺ becomes copper metal. Charge: +2 on each side.
        - |
          This is the reverse reaction, which does not occur spontaneously; iron displaces copper, not the other way round.
      answer: 2
      explanation: |
        Cancel the sulfate spectator.

    # ---- Multi-select
    - slug: apchem-u04-w14-q13
      type: multi_select
      topic_code: "4.5"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        For the reaction N₂ + 3 H₂ → 2 NH₃, 1.00 mol of N₂ is mixed with 2.00 mol of H₂ and the reaction goes to completion. Which statements are correct? Select all that apply.
      options:
        - "H₂ is the limiting reactant."
        - "1.33 mol of NH₃ is produced."
        - "0.333 mol of N₂ remains unreacted."
        - "N₂ is the limiting reactant because fewer moles of it were supplied."
        - "2.00 mol of NH₃ is produced."
      option_explanations:
        - |
          Correct. N₂: 1.00 ÷ 1 = 1.00; H₂: 2.00 ÷ 3 = 0.667; the smaller quotient marks H₂ as limiting.
        - |
          Correct. 2.00 mol H₂ × (2 NH₃ / 3 H₂) = 1.33 mol NH₃.
        - |
          Correct. N₂ used = 2.00 ÷ 3 = 0.667 mol; 1.00 − 0.667 = 0.333 mol remains.
        - |
          Incorrect, so it should not be selected. Fewer moles does not mean limiting; the moles must be compared relative to the coefficients, and N₂ is in excess.
        - |
          Incorrect, so it should not be selected. 2.00 mol NH₃ would need 1.00 mol N₂ and 3.00 mol H₂; only 2.00 mol H₂ is available.
      answer: [0, 1, 2]
      explanation: |
        Quotient test: H₂ limits; products and leftovers follow from it.

    - slug: apchem-u04-w14-q14
      type: multi_select
      topic_code: "3.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following processes involve only changes in intermolecular (interparticle) interactions, with every bond within the particles preserved? Select all that apply.
      options:
        - "Liquid nitrogen boiling"
        - "Iodine crystals subliming"
        - "Methane burning in air"
        - "Ethanol mixing with water"
        - "Hydrogen peroxide decomposing to water and oxygen"
      option_explanations:
        - |
          Correct. Boiling separates N₂ molecules held by dispersion forces; the N≡N bond is untouched.
        - |
          Correct. Sublimation frees I₂ molecules from the dispersion forces of the lattice; the I–I bond remains.
        - |
          Incorrect, so it should not be selected. Combustion breaks C–H and O=O bonds and forms C=O and O–H bonds.
        - |
          Correct. Mixing replaces ethanol–ethanol and water–water hydrogen bonds with ethanol–water hydrogen bonds; both molecules stay intact.
        - |
          Incorrect, so it should not be selected. Decomposition breaks the O–O bond and forms O=O; new substances appear.
      answer: [0, 1, 3]
      explanation: |
        Phase changes and mixing are physical; combustion and decomposition are chemical.

    # ---- True / false
    - slug: apchem-u04-w14-q15
      type: true_false
      topic_code: "4.4"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: when water boils, the covalent O–H bonds within the water molecules break, which is why boiling requires so much energy.
      answer: false
      explanation: |
        False. Boiling overcomes the hydrogen bonds between molecules; the O–H bonds survive and the vapour is still H₂O. The large energy requirement reflects water's strong hydrogen bonding, not bond breaking.

    - slug: apchem-u04-w14-q16
      type: true_false
      topic_code: "3.4"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: at 298 K and 1.00 atm, one mole of an ideal gas occupies 22.4 L.
      answer: false
      explanation: |
        False. 22.4 L/mol holds at STP (273 K, 1 atm); at 298 K the molar volume is RT/P = (0.08206)(298)/1.00 = 24.5 L.

