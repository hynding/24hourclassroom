    # ---- Short answer
    - slug: apchem-u04-w15-q22
      type: short_answer
      topic_code: "4.6"
      source: "PubChem (molar masses)"
      points: 3
      prompt: |
        A student prepares a sodium hydroxide solution of approximately 0.1 M and standardises it against potassium hydrogen phthalate (KHP, 204.22 g/mol, one acidic proton). A 0.4210 g sample of KHP requires 20.50 mL of the NaOH solution.
        (a) Explain why the NaOH solution must be standardised rather than used at its nominal concentration.
        (b) Calculate the concentration of the NaOH solution.
        (c) The student then uses the standardised NaOH to titrate 25.00 mL of a nitric acid solution, which requires 22.30 mL. Calculate the concentration of the nitric acid.
      answer: |
        (a) Solid NaOH is hygroscopic and absorbs CO₂ from the air, so a weighed mass contains an unknown amount of water and carbonate; the true molarity of the solution is uncertain and must be measured against a pure, stable primary standard.
        (b) n(KHP) = 0.4210 ÷ 204.22 = 0.002062 mol = n(NaOH) (1 : 1); [NaOH] = 0.002062 ÷ 0.02050 L = 0.1006 M.
        (c) n(NaOH) = 0.02230 L × 0.1006 M = 0.002243 mol = n(HNO₃) (1 : 1); [HNO₃] = 0.002243 ÷ 0.02500 L = 0.0897 M.
      explanation: |
        Scoring: 1 point for (a) citing absorption of water and/or CO₂ making the nominal concentration unreliable; 1 point for (b) 0.1006 M (accept 0.100–0.101); 1 point for (c) 0.0897 M (accept 0.0895–0.0900) using the standardised value.

    - slug: apchem-u04-w15-q23
      type: short_answer
      topic_code: "4.7"
      source: "general knowledge"
      points: 3
      prompt: |
        Classify each reaction by what is transferred (proton, electrons, or ions forming a solid) and by pattern (synthesis, decomposition, combustion, single replacement or double replacement), and justify each classification briefly.
        (a) Mg(s) + 2 HCl(aq) → MgCl₂(aq) + H₂(g)
        (b) HF(aq) + NaOH(aq) → NaF(aq) + H₂O(l)
        (c) Na₂S(aq) + Cu(NO₃)₂(aq) → CuS(s) + 2 NaNO₃(aq)
      answer: |
        (a) Electron transfer (redox); single replacement. Magnesium displaces hydrogen from the acid: Mg goes from 0 to +2 and H from +1 to 0, so electrons move from Mg to H⁺.
        (b) Proton transfer (acid–base); double replacement. HF donates a proton to OH⁻ to form water; no oxidation state changes. Net ionic: HF + OH⁻ → F⁻ + H₂O (HF is weak, so it is written as the molecule).
        (c) Ion combination (precipitation); double replacement. S²⁻ and Cu²⁺ leave solution as insoluble CuS; the ions swap partners and no oxidation state changes. Net ionic: Cu²⁺ + S²⁻ → CuS(s).
      explanation: |
        Scoring: 1 point for each reaction with both classifications correct and a justification that names the transfer (electrons with oxidation-state change for (a); proton for (b); ions forming an insoluble solid for (c)).

    # ---- Long answer
    - slug: apchem-u04-w15-q24
      type: long_answer
      topic_code: "4.6"
      source: "PubChem (molar masses)"
      points: 6
      prompt: |
        A student determines the mass percent of acetic acid, CH₃COOH (60.05 g/mol), in a brand of vinegar. A 5.00 mL sample of vinegar (density 1.01 g/mL) is pipetted into a flask, diluted with about 25 mL of distilled water, and titrated with 0.1050 M NaOH using phenolphthalein. Three trials give titrant volumes of 20.15, 19.95 and 20.05 mL.
        (a) Write the net ionic equation for the titration reaction, explaining how acetic acid is written and why.
        (b) Using the mean titrant volume, calculate the moles of acetic acid in the sample.
        (c) Calculate the mass percent of acetic acid in the vinegar.
        (d) Explain why diluting the sample with 25 mL of water before titrating does not affect the result.
        (e) Describe how the student should decide when to stop adding titrant, and explain what would happen to the result if the student stopped at the first flash of pink that disappeared on swirling.
        (f) The student suggests using a 0.0105 M NaOH solution instead to get "more precise" results. Evaluate this suggestion.
      answer: |
        (a) CH₃COOH(aq) + OH⁻(aq) → CH₃COO⁻(aq) + H₂O(l). Acetic acid is a weak acid, mostly un-ionised in solution, so it is written as the intact molecule rather than as H⁺ + CH₃COO⁻; Na⁺ is a spectator.
        (b) Mean volume = (20.15 + 19.95 + 20.05) ÷ 3 = 20.05 mL. n(NaOH) = 0.02005 L × 0.1050 M = 0.002105 mol = n(CH₃COOH) (1 : 1).
        (c) Mass of acid = 0.002105 × 60.05 = 0.1264 g. Mass of vinegar = 5.00 mL × 1.01 g/mL = 5.05 g. Mass percent = 0.1264 ÷ 5.05 × 100 = 2.50 %.
        (d) Adding water changes the volume and concentration of the acid in the flask but not the number of moles of acetic acid; the titration counts moles of acid through the moles of base required, so the result is unchanged.
        (e) Add titrant until the first faint pink colour persists for about 30 seconds with swirling. Stopping at a flash of pink that disappears means the equivalence point has not yet been reached: the recorded volume is too small, so the calculated moles and mass percent of acetic acid would be too low.
        (f) A ten-fold more dilute titrant would require about 200 mL for each sample, far more than a 50 mL burette holds, so the titration would need refilling and the volume uncertainty would accumulate; it would not improve precision. Better precision comes from a larger sample or a titrant concentration that gives 20–40 mL per titration.
      explanation: |
        Scoring: (a) 1 point for the correct net ionic equation with acetic acid as a molecule and the weak-acid justification; (b) 1 point for the mean volume 20.05 mL and 0.002105 mol (accept 0.00210–0.00211); (c) 1 point for 2.50 % (accept 2.48–2.52) using the density to get the vinegar mass; (d) 1 point for stating that moles of acid are unchanged by dilution; (e) 1 point for the persistent-faint-pink criterion and "too low" with the reasoning that the equivalence point was not reached; (f) 1 point for recognising that a 200 mL titrant volume is impractical and does not improve precision.
