week: 15
unit: 4
title: "Titration and the Types of Chemical Reactions"
topics: ["4.6", "4.7"]
guide: guides/week-15.md
guide_description: |
  Titration as solution stoichiometry with a burette: titrant and analyte, equivalence point against end point,
  indicators, primary standards and standardising NaOH with KHP, diprotic acids, and the error analysis of
  overshoot, air bubbles, rinsing and wet flasks; then the classification of reactions by what is transferred
  (proton, electron, ions into a solid) and by pattern (synthesis, decomposition, combustion, single and double
  replacement), with the activity series. Worked examples: HCl, H₂SO₄, KHP, vinegar, five classifications and
  the activity series.
flashcards_description: |
  30 cards on titration vocabulary and equipment, the equivalence and end points, standardisation, titration
  calculations, error analysis, the three transfer types, the five patterns, the activity series and predicting
  whether a reaction occurs.

flashcards:
  - front: Titration → what it measures and the two solutions involved
    back: |
      The volume of a titrant of known concentration needed to react completely with a measured volume of analyte; the balanced equation converts titrant moles into analyte moles.
    topic_code: "4.6"
  - front: Titrant vs analyte → which is where
    back: |
      Titrant: known concentration, in the burette. Analyte: unknown, measured by pipette into the flask with a few drops of indicator.
    topic_code: "4.6"
  - front: Equivalence point vs end point → the distinction
    back: |
      Equivalence point: moles of titrant exactly match the stoichiometric requirement (a chemical fact). End point: the indicator changes colour (what you see). A good indicator makes the two nearly coincide.
    topic_code: "4.6"
  - front: Phenolphthalein → its colours and when to stop
    back: |
      Colourless in acid, pink in base. Stop at the first permanent faint pink; a deep pink means the end point was overshot.
    topic_code: "4.6"
  - front: Standard solution and primary standard → definitions
    back: |
      A standard solution has an accurately known concentration. A primary standard is a pure, stable, weighable solid (KHP, KHC₈H₄O₄, 204.22 g/mol) used to determine a titrant's concentration.
    topic_code: "4.6"
  - front: Why NaOH must be standardised → the reason
    back: |
      Solid NaOH absorbs water and CO₂ from the air, so a weighed amount never gives exactly the intended concentration; the solution is titrated against KHP to find its true molarity.
    topic_code: "4.6"
  - front: Standardising NaOH with 0.5105 g KHP needing 24.80 mL → the result
    back: |
      n(KHP) = 0.5105 ÷ 204.22 = 0.002500 mol = n(NaOH); [NaOH] = 0.002500 ÷ 0.02480 L = 0.1008 M.
    topic_code: "4.6"
  - front: Titration calculation → the four steps
    back: |
      (1) Moles of titrant = M × V(L). (2) Mole ratio from the balanced equation. (3) Moles of analyte. (4) Divide by the analyte volume for concentration, or multiply by molar mass for mass.
    topic_code: "4.6"
  - front: 25.00 mL HCl needing 21.50 mL of 0.100 M NaOH → [HCl]
    back: |
      n(NaOH) = 0.00215 mol = n(HCl) (1 : 1); [HCl] = 0.00215 ÷ 0.02500 = 0.0860 M.
    topic_code: "4.6"
  - front: 20.00 mL H₂SO₄ needing 30.00 mL of 0.150 M NaOH → [H₂SO₄]
    back: |
      n(NaOH) = 0.00450 mol; H₂SO₄ + 2 NaOH, so n(H₂SO₄) = 0.00225 mol; ÷ 0.02000 L = 0.113 M. The 2 : 1 ratio is the step most often missed.
    topic_code: "4.6"
  - front: Vinegar titration, 10.00 mL needing 14.20 mL of 0.100 M NaOH → concentration and mass percent
    back: |
      n = 0.001420 mol acetic acid → 0.142 M; mass = 0.001420 × 60.05 = 0.0853 g in 10.00 g of vinegar (density 1.00 g/mL) → 0.853 % by mass.
    topic_code: "4.6"
  - front: Weak acid in a titration → how much base it consumes
    back: |
      The same as a strong acid of equal concentration: one OH⁻ per acid molecule. At the equivalence point every acid molecule has reacted, weak or strong.
    topic_code: "4.6"
  - front: Rinsing rules for titration glassware → what gets rinsed with what
    back: |
      Burette: with titrant. Pipette: with analyte. Flask: distilled water is fine (extra water changes no moles). Rinsing burette or pipette with water dilutes the solution it then holds.
    topic_code: "4.6"
  - front: Overshooting the end point → effect on the calculated analyte concentration
    back: |
      Too high: more titrant volume is recorded than the analyte needed, so the analyte's moles and concentration are overestimated.
    topic_code: "4.6"
  - front: Air bubble in the burette tip that disappears during the titration → effect
    back: |
      Too high: the bubble's volume is counted as titrant delivered, overstating the titrant volume and so the analyte's moles.
    topic_code: "4.6"
  - front: Wet flask vs water-rinsed pipette → effects on the result
    back: |
      Wet flask: no effect (moles of analyte and titrant unchanged). Water-rinsed pipette: the analyte is diluted before measuring, so fewer moles are delivered and the calculated concentration is too low.
    topic_code: "4.6"
  - front: Burette rinsed with water instead of titrant → effect
    back: |
      The titrant is diluted, so more volume is needed to reach the end point; the analyte concentration comes out too high.
    topic_code: "4.6"
  - front: 25.00 mL Ba(OH)₂ needing 18.60 mL of 0.0500 M HCl → [Ba(OH)₂]
    back: |
      n(HCl) = 9.30 × 10⁻⁴ mol; Ba(OH)₂ + 2 HCl, so n(Ba(OH)₂) = 4.65 × 10⁻⁴ mol; ÷ 0.02500 L = 0.0186 M.
    topic_code: "4.6"
  - front: Three transfer types of reaction → what moves in each
    back: |
      Acid–base: a proton (H⁺). Oxidation–reduction: electrons (some element changes oxidation state). Precipitation: ions leave solution to form an insoluble solid.
    topic_code: "4.7"
  - front: Synthesis and decomposition → patterns and examples
    back: |
      Synthesis: A + B → AB (2 Mg + O₂ → 2 MgO, redox). Decomposition: AB → A + B (2 KClO₃ → 2 KCl + 3 O₂, redox; CaCO₃ → CaO + CO₂, not redox).
    topic_code: "4.7"
  - front: Combustion → pattern and products for a hydrocarbon
    back: |
      Fuel + O₂ → CO₂ + H₂O with heat released; always redox. 2 C₄H₁₀ + 13 O₂ → 8 CO₂ + 10 H₂O.
    topic_code: "4.7"
  - front: Single replacement → pattern and the condition for it to occur
    back: |
      Element displaces another from a compound (Zn + 2 HCl → ZnCl₂ + H₂); always redox. It occurs only if the free element is more reactive (higher in the activity series) than the one it displaces.
    topic_code: "4.7"
  - front: Double replacement → pattern and the condition for it to occur
    back: |
      Ions swap partners, AB + CD → AD + CB; occurs only if a precipitate, a gas or water forms. Never redox. Includes precipitation, neutralisation and carbonate + acid.
    topic_code: "4.7"
  - front: Activity series of metals → the order to know
    back: |
      K > Na > Ca > Mg > Al > Zn > Fe > Ni > Sn > Pb > H > Cu > Ag > Au. A metal above hydrogen reacts with acids to give H₂; a metal displaces any metal below it from solution.
    topic_code: "4.7"
  - front: Activity series of halogens → the order and a consequence
    back: |
      F₂ > Cl₂ > Br₂ > I₂. Cl₂ + 2 KBr → 2 KCl + Br₂ occurs; Br₂ + KCl does not.
    topic_code: "4.7"
  - front: Copper wire in zinc sulfate vs in silver nitrate → what happens
    back: |
      ZnSO₄: no reaction (Cu is below Zn). AgNO₃: Cu + 2 Ag⁺ → Cu²⁺ + 2 Ag; solution turns blue, silver crystals grow (Cu is above Ag).
    topic_code: "4.7"
  - front: Quick test for redox → what to check
    back: |
      Does any element change oxidation state? A free element appearing or disappearing is a sure sign. Precipitation and acid–base reactions never change oxidation states.
    topic_code: "4.7"
  - front: Al in CuCl₂, HNO₃ + KOH, Pb(NO₃)₂ + Na₂SO₄, butane burning, MgCO₃ heated → classifications
    back: |
      Single replacement/redox; double replacement/acid–base; double replacement/precipitation; combustion/redox; decomposition/not redox.
    topic_code: "4.7"
  - front: Decomposition of hydrogen peroxide → classification
    back: |
      2 H₂O₂ → 2 H₂O + O₂: decomposition and redox (oxygen goes from −1 to −2 in water and 0 in O₂).
    topic_code: "4.7"
  - front: Metal + acid → the products and the requirement
    back: |
      Metal + acid → salt + H₂ (Mg + 2 HCl → MgCl₂ + H₂), a single replacement/redox reaction, only for metals above hydrogen in the activity series; copper and silver do not react with HCl.
    topic_code: "4.7"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 4.6 and 4.7: titration technique, calculations
    and error analysis; classifying reactions by what is transferred and by pattern, with the activity series),
    with review of molarity, net ionic equations, particulate representations, solubility, gases and
    stoichiometry. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: titrating vinegar
    - slug: apchem-u04-w15-q01
      type: multiple_choice
      topic_code: "4.6"
      source: "PubChem (molar masses)"
      points: 1
      stimulus: |
        A student pipettes 10.00 mL of vinegar (a solution of acetic acid, CH₃COOH, 60.05 g/mol) into a flask, adds two drops of phenolphthalein, and titrates with 0.100 M sodium hydroxide, which was prepared by dissolving 4.00 g of NaOH (40.00 g/mol) in enough water to make 1.000 L. The burette reads 0.35 mL at the start and 14.55 mL at the first permanent faint pink.
      prompt: |
        What is the concentration of acetic acid in the vinegar?
      options:
        - "0.0704 M"
        - "0.146 M"
        - "0.142 M"
        - "1.42 M"
      option_explanations:
        - |
          0.0704 M would follow from assuming a 2 : 1 ratio; acetic acid has one acidic proton and reacts 1 : 1 with NaOH.
        - |
          0.146 M uses the final burette reading alone (14.55 mL); the volume delivered is the difference, 14.20 mL.
        - |
          Correct. V = 14.55 − 0.35 = 14.20 mL; n(NaOH) = 0.01420 L × 0.100 M = 0.001420 mol = n(CH₃COOH); ÷ 0.01000 L = 0.142 M.
        - |
          1.42 M forgets to convert the 10.00 mL analyte volume to litres correctly (it uses 1.00 mL).
      answer: 2
      explanation: |
        Delivered volume → moles NaOH → 1 : 1 → divide by 0.01000 L.

    - slug: apchem-u04-w15-q02
      type: multiple_choice
      topic_code: "4.6"
      source: "PubChem (molar masses)"
      points: 1
      stimulus: |
        A student pipettes 10.00 mL of vinegar (a solution of acetic acid, CH₃COOH, 60.05 g/mol) into a flask, adds two drops of phenolphthalein, and titrates with 0.100 M sodium hydroxide, which was prepared by dissolving 4.00 g of NaOH (40.00 g/mol) in enough water to make 1.000 L. The burette reads 0.35 mL at the start and 14.55 mL at the first permanent faint pink.
      prompt: |
        In a second trial the student adds base too quickly and the solution turns deep pink before the burette is closed. What effect does this have on the calculated acetic acid concentration, and why?
      options:
        - "Too high, because the recorded titrant volume exceeds the volume the acid actually required"
        - "Too low, because excess base neutralises some of the indicator"
        - "No effect, because the equivalence point is a fixed property of the solutions"
        - "Too high, because the deep pink colour indicates that more acid was present"
      option_explanations:
        - |
          Correct. Overshooting means extra NaOH was delivered after the equivalence point; the larger volume is converted into more "moles of acid" than were really present.
        - |
          The indicator is present in trace amounts and does not change the stoichiometry; the error is in the recorded volume.
        - |
          The equivalence point is fixed, but the recorded end point volume is what enters the calculation, and it is too large.
        - |
          The deep pink means excess base, not extra acid; the direction of the error is right but the reasoning is wrong.
      answer: 0
      explanation: |
        Overshoot → volume too large → concentration too high.

    - slug: apchem-u04-w15-q03
      type: multiple_choice
      topic_code: "3.7"
      source: "PubChem (molar masses)"
      points: 1
      stimulus: |
        A student pipettes 10.00 mL of vinegar (a solution of acetic acid, CH₃COOH, 60.05 g/mol) into a flask, adds two drops of phenolphthalein, and titrates with 0.100 M sodium hydroxide, which was prepared by dissolving 4.00 g of NaOH (40.00 g/mol) in enough water to make 1.000 L. The burette reads 0.35 mL at the start and 14.55 mL at the first permanent faint pink.
      prompt: |
        The student later learns that the NaOH pellets had absorbed moisture from the air before being weighed, so the 4.00 g contained some water. Which statement about the sodium hydroxide solution is correct?
      options:
        - "Its concentration is higher than 0.100 M, because water adds to the mass of solute."
        - "Its concentration is lower than 0.100 M, because fewer than 0.100 mol of NaOH were dissolved."
        - "Its concentration is exactly 0.100 M, because the solution was made up to 1.000 L."
        - "Its concentration cannot be known, so the titration gives no information."
      option_explanations:
        - |
          Water in the pellets is not solute; it reduces the amount of NaOH in the weighed sample.
        - |
          Correct. Part of the 4.00 g was water, so less than 0.100 mol of NaOH went into the litre; the true molarity is lower, which is why NaOH is standardised against a primary standard.
        - |
          Making up to volume fixes the volume, not the moles of solute, which were fewer than intended.
        - |
          The concentration can be determined by standardising against KHP; the titration then gives correct results.
      answer: 1
      explanation: |
        Less NaOH than weighed → lower molarity; standardise.

    # ---- Multiple choice (4.6)
    - slug: apchem-u04-w15-q04
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement correctly distinguishes the equivalence point from the end point of a titration?
      options:
        - "They are different names for the same observation."
        - "The equivalence point is when the indicator changes colour; the end point is when the reaction is complete."
        - "The end point always comes before the equivalence point."
        - "The equivalence point is when the moles of titrant match the stoichiometric requirement; the end point is when the indicator changes colour, chosen to be as close to it as possible."
      option_explanations:
        - |
          They are related but different: one is a stoichiometric condition, the other an observable signal.
        - |
          The definitions are reversed: the colour change is the end point, and completion of the stoichiometric reaction is the equivalence point.
        - |
          With a well-chosen indicator the end point coincides closely with the equivalence point; it may fall slightly before or after.
        - |
          Correct. The equivalence point is the chemical fact; the end point is the indicator's signal that approximates it.
      answer: 3
      explanation: |
        Stoichiometric point vs observed colour change.

    - slug: apchem-u04-w15-q05
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      prompt: |
        20.00 mL of sulfuric acid, H₂SO₄, requires 30.00 mL of 0.150 M NaOH to reach the end point. What is the concentration of the sulfuric acid?
      options:
        - "0.113 M"
        - "0.225 M"
        - "0.450 M"
        - "0.0563 M"
      option_explanations:
        - |
          Correct. n(NaOH) = 0.03000 × 0.150 = 0.00450 mol; H₂SO₄ + 2 NaOH → Na₂SO₄ + 2 H₂O, so n(H₂SO₄) = 0.00225 mol; ÷ 0.02000 L = 0.113 M.
        - |
          0.225 M uses a 1 : 1 ratio; each H₂SO₄ supplies two protons and needs two NaOH.
        - |
          0.450 M doubles instead of halving the moles of NaOH.
        - |
          0.0563 M halves twice; the 2 : 1 ratio should be applied once.
      answer: 0
      explanation: |
        Diprotic acid: moles of acid = half the moles of base.

    - slug: apchem-u04-w15-q06
      type: multiple_choice
      topic_code: "4.6"
      source: "PubChem (molar masses)"
      points: 1
      prompt: |
        A 0.5105 g sample of potassium hydrogen phthalate, KHP (204.22 g/mol, one acidic proton), requires 24.80 mL of a sodium hydroxide solution to reach the phenolphthalein end point. What is the concentration of the NaOH?
      options:
        - "0.0504 M"
        - "0.2016 M"
        - "0.1008 M"
        - "0.0206 M"
      option_explanations:
        - |
          0.0504 M halves the moles, as if KHP had two acidic protons; it has one.
        - |
          0.2016 M doubles the moles; KHP reacts 1 : 1 with NaOH.
        - |
          Correct. n(KHP) = 0.5105 ÷ 204.22 = 0.002500 mol = n(NaOH); ÷ 0.02480 L = 0.1008 M.
        - |
          0.0206 M divides the mass by the volume without converting to moles.
      answer: 2
      explanation: |
        Primary standard moles = titrant moles.

    - slug: apchem-u04-w15-q07
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Before a titration a student rinses the burette with distilled water but not with the NaOH titrant, then fills it with titrant. How does this affect the calculated concentration of the acid being analysed?
      options:
        - "Too low, because the diluted titrant delivers fewer moles of base."
        - "Too high, because the diluted titrant requires a larger volume to supply the same moles of base, and the larger volume is used in the calculation with the nominal concentration."
        - "No effect, because the number of moles of acid is unchanged."
        - "Too low, because water in the burette reacts with the acid."
      option_explanations:
        - |
          The acid still requires the same moles of base; the student simply has to deliver more of the diluted solution, and that larger volume inflates the result.
        - |
          Correct. The titrant's true concentration is below its labelled value; more volume is needed, and multiplying that volume by the nominal concentration overestimates the moles of base and so the acid's concentration.
        - |
          The moles of acid are unchanged, but the calculation uses an inflated titrant volume, so the result is wrong.
        - |
          Water does not react with the acid; the error comes from the diluted titrant.
      answer: 1
      explanation: |
        Diluted titrant → more volume → concentration too high.

    # ---- Multiple choice (4.7)
    - slug: apchem-u04-w15-q08
      type: multiple_choice
      topic_code: "4.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Heating potassium chlorate produces potassium chloride and oxygen: 2 KClO₃ → 2 KCl + 3 O₂. How is this reaction best classified?
      options:
        - "Double replacement and precipitation"
        - "Synthesis and acid–base"
        - "Decomposition, not redox, because no electrons are transferred"
        - "Decomposition and oxidation–reduction, because chlorine and oxygen change oxidation state"
      option_explanations:
        - |
          No ions swap partners and no precipitate forms from solution; a single compound breaks apart.
        - |
          The reaction goes from one compound to two substances (decomposition), and no proton is transferred.
        - |
          Oxygen goes from −2 in ClO₃⁻ to 0 in O₂ and chlorine from +5 to −1, so electrons are transferred.
        - |
          Correct. One substance breaks into two (decomposition), and oxidation states change (Cl +5 → −1, O −2 → 0), so it is also redox.
      answer: 3
      explanation: |
        Decomposition that produces a free element is redox.

    - slug: apchem-u04-w15-q09
      type: multiple_choice
      topic_code: "4.7"
      source: "general knowledge"
      points: 1
      prompt: |
        A strip of zinc is placed in copper(II) sulfate solution; the blue colour fades and a reddish solid forms on the zinc. How is the reaction classified?
      options:
        - "Single replacement and oxidation–reduction"
        - "Double replacement and precipitation"
        - "Synthesis and oxidation–reduction"
        - "Single replacement and acid–base"
      option_explanations:
        - |
          Correct. Zn + CuSO₄ → ZnSO₄ + Cu: the free element zinc displaces copper, and electrons move from Zn (0 → +2) to Cu²⁺ (+2 → 0).
        - |
          No ions swap partners between two compounds, and the solid copper is a displaced element, not an insoluble ionic compound.
        - |
          Two substances do not combine into one; an element displaces another.
        - |
          No proton is transferred; the change is electron transfer.
      answer: 0
      explanation: |
        Element displaces element: single replacement, always redox.

    - slug: apchem-u04-w15-q10
      type: multiple_choice
      topic_code: "4.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Which reaction is NOT an oxidation–reduction reaction?
      options:
        - "2 Na + Cl₂ → 2 NaCl"
        - "CH₄ + 2 O₂ → CO₂ + 2 H₂O"
        - "AgNO₃(aq) + NaCl(aq) → AgCl(s) + NaNO₃(aq)"
        - "Fe + 2 HCl → FeCl₂ + H₂"
      option_explanations:
        - |
          Sodium goes from 0 to +1 and chlorine from 0 to −1; synthesis from elements is redox.
        - |
          Combustion is always redox: carbon goes from −4 to +4 and oxygen from 0 to −2.
        - |
          Correct. In this precipitation (double replacement) every element keeps its oxidation state: Ag stays +1, Cl −1, Na +1, N +5, O −2; ions merely change partners.
        - |
          Iron goes from 0 to +2 and hydrogen from +1 to 0; a single replacement is redox.
      answer: 2
      explanation: |
        Precipitation never changes oxidation states.

    # ---- Review (4.2)
    - slug: apchem-u04-w15-q11
      type: multiple_choice
      topic_code: "4.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which is the net ionic equation for the titration of hydrobromic acid with barium hydroxide solution?
      options:
        - "2 HBr(aq) + Ba(OH)₂(aq) → BaBr₂(aq) + 2 H₂O(l)"
        - "Ba²⁺(aq) + 2 Br⁻(aq) → BaBr₂(s)"
        - "HBr(aq) + OH⁻(aq) → Br⁻(aq) + H₂O(l)"
        - "H⁺(aq) + OH⁻(aq) → H₂O(l)"
      option_explanations:
        - |
          This is the molecular equation; both compounds are strong electrolytes and should be separated into ions.
        - |
          Barium bromide is soluble; no precipitate forms, and Ba²⁺ and Br⁻ are spectators.
        - |
          HBr is a strong acid and must be written as H⁺ + Br⁻; this form is appropriate only for a weak acid.
        - |
          Correct. Strong acid plus strong base: after cancelling the spectators Ba²⁺ and Br⁻, only the formation of water remains.
      answer: 3
      explanation: |
        Strong acid–strong base net ionic equation.

    # ---- Review (4.3)
    - slug: apchem-u04-w15-q12
      type: multiple_choice
      topic_code: "4.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A particulate diagram is drawn of the flask contents at the equivalence point of a titration of HCl(aq) with NaOH(aq). Which species should be shown in significant numbers?
      options:
        - "H₃O⁺, OH⁻, Na⁺ and Cl⁻ in equal numbers"
        - "Na⁺ and Cl⁻ ions, hydrated, with water molecules and essentially no H₃O⁺ or OH⁻"
        - "NaCl units and H₂O molecules"
        - "H₃O⁺ and Cl⁻, with all the OH⁻ consumed"
      option_explanations:
        - |
          At the equivalence point the H₃O⁺ and OH⁻ have reacted with each other in equal amounts; neither remains in significant quantity.
        - |
          Correct. H⁺ + OH⁻ → H₂O has consumed both reactive ions; the spectators Na⁺ and Cl⁻ remain as separate hydrated ions.
        - |
          Sodium chloride is a soluble strong electrolyte; it exists as separate ions, not NaCl units.
        - |
          This describes the flask before the titration begins, when only acid is present.
      answer: 1
      explanation: |
        Only spectators remain at equivalence.

    # ---- Multi-select
    - slug: apchem-u04-w15-q13
      type: multi_select
      topic_code: "4.6"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following procedural errors would cause the calculated concentration of an acid analyte to be too high? Select all that apply.
      options:
        - "The burette was rinsed with water, not with the NaOH titrant, before filling."
        - "The flask was wet with distilled water when the acid was pipetted in."
        - "An air bubble in the burette tip disappeared during the titration."
        - "The pipette was rinsed with water, not with the acid, before measuring the acid."
        - "The titration was stopped at a deep pink rather than a faint pink."
      option_explanations:
        - |
          Correct. The diluted titrant needs a larger volume, and the calculation with the nominal concentration overstates the moles of base.
        - |
          Incorrect, so it should not be selected. Extra water in the flask changes neither the moles of acid nor the moles of base required; no effect.
        - |
          Correct. The bubble's volume is recorded as delivered titrant, inflating the volume and the result.
        - |
          Incorrect, so it should not be selected. A water-rinsed pipette dilutes the acid, delivering fewer moles; the result is too low.
        - |
          Correct. Overshooting records more titrant than the equivalence point required.
      answer: [0, 2, 4]
      explanation: |
        Anything that inflates the recorded titrant volume raises the result.

    - slug: apchem-u04-w15-q14
      type: multi_select
      topic_code: "4.2"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which pairs of aqueous solutions undergo a double replacement reaction when mixed (a precipitate, gas or water forms)? Select all that apply.
      options:
        - "Pb(NO₃)₂ and KI"
        - "NaNO₃ and KCl"
        - "Na₂CO₃ and HCl"
        - "HNO₃ and Ca(OH)₂"
        - "MgSO₄ and NaCl"
      option_explanations:
        - |
          Correct. PbI₂ is insoluble and precipitates as a yellow solid.
        - |
          Incorrect, so it should not be selected. Both possible products (NaCl, KNO₃) are soluble; no reaction.
        - |
          Correct. Carbonic acid forms and decomposes to CO₂ gas and water.
        - |
          Correct. Acid plus base forms water (and soluble calcium nitrate).
        - |
          Incorrect, so it should not be selected. MgCl₂ and Na₂SO₄ are both soluble; no driving force.
      answer: [0, 2, 3]
      explanation: |
        A double replacement needs a precipitate, a gas or water.

    # ---- True / false
    - slug: apchem-u04-w15-q15
      type: true_false
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: in a titration, the moles of titrant delivered at the equivalence point equal the moles of analyte present, whatever the balanced equation.
      answer: false
      explanation: |
        False. The moles are related by the mole ratio of the balanced equation; a diprotic acid needs two moles of NaOH per mole of acid.

    - slug: apchem-u04-w15-q16
      type: true_false
      topic_code: "4.5"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: the theoretical yield of a reaction is calculated from the reactant that is present in excess.
      answer: false
      explanation: |
        False. The theoretical yield is set by the limiting reactant, the one that runs out first.

