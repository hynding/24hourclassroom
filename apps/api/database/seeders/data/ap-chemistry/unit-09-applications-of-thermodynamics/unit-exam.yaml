    points: 6
    prompt: |
      A 250 mL sample of 0.50 M CuSO₄(aq) is electrolysed between platinum electrodes with a constant current of 1.50 A for 40.0 min at 298 K. Standard reduction potentials: Cu²⁺(aq) + 2 e⁻ → Cu(s), +0.34 V; O₂(g) + 4 H⁺(aq) + 4 e⁻ → 2 H₂O(l), +1.23 V; 2 H₂O(l) + 2 e⁻ → H₂(g) + 2 OH⁻(aq), −0.83 V. F = 96,485 C/mol; Cu = 63.55 g/mol; molar volume at STP = 22.4 L/mol.

      (a) Write the half-reaction at each electrode and the balanced overall equation.
      (b) Explain why copper rather than hydrogen forms at the cathode.
      (c) Calculate the minimum voltage the power supply must exceed under standard conditions, and explain why the practical voltage is higher.
      (d) Calculate the mass of copper deposited and the volume of O₂ produced at STP.
      (e) Calculate ΔG° in kJ for the overall equation as written in (a), and state what its sign means for this process.
      (f) The electrolysis is continued until all the Cu²⁺ has been removed. Calculate how long in total this takes at 1.50 A, and predict what will form at the cathode after that point.
    answer: |
      (a) Cathode Cu²⁺(aq) + 2 e⁻ → Cu(s); anode 2 H₂O(l) → O₂(g) + 4 H⁺(aq) + 4 e⁻; overall 2 Cu²⁺(aq) + 2 H₂O(l) → 2 Cu(s) + O₂(g) + 4 H⁺(aq) (n = 4).
      (b) Cu²⁺ has the higher reduction potential (+0.34 V versus −0.83 V, about −0.41 V at pH 7, for water), so it is reduced first; hydrogen forms only after the Cu²⁺ is depleted.
      (c) E° for the forced reaction = 0.34 − 1.23 = −0.89 V, so the supply must exceed 0.89 V; in practice more is needed because of the overpotential for O₂ evolution and the resistance of the solution.
      (d) Q = (1.50)(2,400) = 3,600 C; 3,600/96,485 = 0.0373 mol e⁻; Cu: 0.01866 mol × 63.55 = 1.19 g; O₂: 0.0373/4 = 0.00933 mol × 22.4 L/mol = 0.209 L (accept 0.21 L).
      (e) ΔG° = −nFE° = −(4)(96,485)(−0.89) = +343,000 J = +343 kJ (accept +340 to +345 kJ); positive, so the process is not thermodynamically favourable and runs only because the power supply does electrical work on it.
      (f) Mol Cu²⁺ = 0.250 L × 0.50 M = 0.125 mol; mol e⁻ = 0.250 mol; q = 0.250 × 96,485 = 24,120 C; t = 24,120/1.50 = 16,080 s = 268 min = 4.47 h (accept 4.4–4.5 h). After the copper is gone, water is reduced at the cathode and H₂(g) is evolved.
    explanation: |
      Six points.

      (a) 1 pt: both half-reactions and the overall equation with n = 4.
      (b) 1 pt: Cu²⁺ has the higher reduction potential than water.
      (c) 1 pt: 0.89 V minimum, higher in practice (overpotential, resistance).
      (d) 1 pt: 1.19 g Cu and 0.21 L O₂.
      (e) 1 pt: ΔG° ≈ +343 kJ (accept +340 to +345), positive because work is supplied.
      (f) 1 pt: about 268 min (4.4–4.5 h), then H₂ at the cathode.

