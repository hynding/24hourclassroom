    options:
      - "It rises, because the precipitate removes a product of the cell reaction."
      - "It falls, because [Ag⁺] decreases, raising Q = [Zn²⁺]/[Ag⁺]² and lowering E by the Nernst equation."
      - "It is unchanged, because E° depends only on the identity of the electrodes."
      - "It falls to zero immediately, because the silver half-cell no longer contains any Ag⁺."
    option_explanations:
      - |
        Ag⁺ is a reactant of the cell reaction, not a product; removing it moves the cell toward equilibrium and lowers E.
      - |
        Correct. Precipitating AgCl lowers [Ag⁺] from 1.0 M to a value set by Ksp (very small), so Q rises sharply; with the squared Ag⁺ term, E can drop by several tenths of a volt.
      - |
        E° is unchanged, but the measured E follows the Nernst equation and depends on the ion concentrations.
      - |
        Some Ag⁺ remains in equilibrium with AgCl(s); E falls but does not reach zero, because Q is still far below K.
    answer: 1
    explanation: |
      Practice 6. Any change that lowers a reactant-ion concentration raises Q and lowers E; a precipitation reaction is a drastic version of dilution.
