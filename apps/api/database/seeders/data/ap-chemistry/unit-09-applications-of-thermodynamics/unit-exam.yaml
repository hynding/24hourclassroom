unit: 9
description: |
  42 questions · about 85 minutes · every topic of Unit 9 (9.1 to 9.10: entropy and absolute entropy, Gibbs
  free energy and thermodynamic favourability, thermodynamic versus kinetic control, free energy and
  equilibrium, coupled reactions, galvanic and electrolytic cells, cell potential and free energy, the Nernst
  equation, and electrolysis with Faraday's law), with review of Hess's law, the reaction quotient and
  oxidation numbers. Three data sets in the AP style (thermodynamic data for the decomposition of calcium
  carbonate, a zinc–silver galvanic cell with a table of reduction potentials, and the electrolysis of aqueous
  copper(II) sulfate), stand-alone multiple choice, select-all, true/false, fill-in-the-blank and numeric
  items, two short-answer questions (3 points each) and one long free-response question (6 points). Multiple
  choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
  automatically; the free-response items are graded by your teacher against the scoring notes. Constants:
  R = 8.314 J/(mol·K), F = 96,485 C/mol, 0.0592/n volts per decade of Q at 298 K.
questions:
  # ---- Stimulus set A: calcium carbonate decomposition data (9.2, 9.3, 9.5)
  - slug: apchem-u09-exam-q01
    type: multiple_choice
    topic_code: "9.2"
    source: "general knowledge"
    points: 1
    stimulus: |
      Thermodynamic data at 298 K for CaCO₃(s) → CaO(s) + CO₂(g):

      | Substance | ΔH°f (kJ/mol) | S° (J/(mol·K)) |
      |---|---|---|
      | CaCO₃(s) | −1,206.9 | 92.9 |
      | CaO(s) | −635.1 | 38.1 |
      | CO₂(g) | −393.5 | 213.8 |

      From these values, ΔH° = +178.3 kJ and ΔS° = +159.0 J/K for the reaction as written.
    prompt: |
      Which statement best explains the sign of ΔS° for the decomposition?
    options:
      - "ΔS° is positive because the reaction is endothermic, and absorbing heat always raises entropy."
      - "ΔS° is positive because one mole of gas is produced from a solid, greatly increasing the dispersal of matter."
      - "ΔS° is positive because CaO has a lower S° than CaCO₃."
      - "ΔS° is positive because the number of moles of substance increases from one to two, regardless of phase."
    option_explanations:
      - |
        Absorbing heat does raise a system's entropy, but ΔS° here is the difference between the tabulated S° values of products and reactants, and an endothermic reaction can have negative ΔS° (for example 2 NO(g) → N₂(g) + O₂(g) reversed). The sign is set by the gas produced.
      - |
        Correct. The 213.8 J/(mol·K) of CO₂(g) dwarfs the other entries; creating a gas from a solid is the dominant entropy-raising change.
      - |
        CaO's small S° slightly lowers ΔS°; it cannot be the reason the total is positive.
      - |
        Mole count alone is not the criterion; two solids from one solid would barely change S. It is the gas that matters.
    answer: 1
    explanation: |
      Practice 4. Count gas moles first; here 0 → 1 mol of gas, and the S° data confirm the large positive ΔS°.
  - slug: apchem-u09-exam-q02
    type: multiple_choice
    topic_code: "9.3"
    source: "general knowledge"
    points: 1
    stimulus: |
      Thermodynamic data at 298 K for CaCO₃(s) → CaO(s) + CO₂(g):

      | Substance | ΔH°f (kJ/mol) | S° (J/(mol·K)) |
      |---|---|---|
      | CaCO₃(s) | −1,206.9 | 92.9 |
      | CaO(s) | −635.1 | 38.1 |
      | CO₂(g) | −393.5 | 213.8 |

      From these values, ΔH° = +178.3 kJ and ΔS° = +159.0 J/K for the reaction as written.
    prompt: |
      Which statement about the thermodynamic favourability of the decomposition is correct?
    options:
      - "It is favourable at all temperatures, because ΔS° is positive."
      - "It is never favourable, because ΔH° is positive."
      - "It is unfavourable at 298 K (ΔG° ≈ +131 kJ) but becomes favourable above about 1,100 K."
      - "It is favourable at 298 K because TΔS° exceeds ΔH°."
    option_explanations:
      - |
        A positive ΔS° helps only when TΔS° is large enough to outweigh a positive ΔH°; at low temperature it is not.
      - |
        A positive ΔH° makes a reaction unfavourable at low temperature only; with ΔS° > 0 it becomes favourable at high temperature.
      - |
        Correct. ΔG° = 178.3 − (298)(0.1590) = 178.3 − 47.4 = +130.9 kJ at 298 K; ΔG° = 0 at T = 178,300/159.0 = 1,121 K, above which the −TΔS° term wins. This is why limestone is roasted in a kiln.
      - |
        At 298 K, TΔS° = 47.4 kJ, far less than ΔH° = 178.3 kJ.
    answer: 2
    explanation: |
      Practice 5. The (+, +) case: unfavourable at low T, favourable above T = ΔH°/ΔS°.
  - slug: apchem-u09-exam-q03
    type: multiple_choice
    topic_code: "9.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      Thermodynamic data at 298 K for CaCO₃(s) → CaO(s) + CO₂(g):

      | Substance | ΔH°f (kJ/mol) | S° (J/(mol·K)) |
      |---|---|---|
      | CaCO₃(s) | −1,206.9 | 92.9 |
      | CaO(s) | −635.1 | 38.1 |
      | CO₂(g) | −393.5 | 213.8 |

      From these values, ΔH° = +178.3 kJ and ΔS° = +159.0 J/K for the reaction as written.
    prompt: |
      Using ΔG° ≈ +131 kJ at 298 K, what is the approximate value of the equilibrium constant Kp = P(CO₂) at 298 K, and what does it mean?
    options:
      - "About 10⁻²³ atm; the equilibrium pressure of CO₂ over limestone at room temperature is immeasurably small."
      - "About 10²³ atm; limestone decomposes completely at room temperature."
      - "About 0.5 atm; limestone is in equilibrium with the CO₂ in air."
      - "Exactly 1, because ΔG° refers to standard conditions."
    option_explanations:
      - |
        Correct. ln K = −ΔG°/(RT) = −130,900/(8.314 × 298) = −52.8, so K = e^(−52.8) ≈ 10⁻²³. A large positive ΔG° means an extremely small K.
      - |
        The sign is reversed: a positive ΔG° gives K ≪ 1, not K ≫ 1.
      - |
        0.5 atm would correspond to ΔG° near zero; the actual ΔG° is +131 kJ.
      - |
        ΔG° = 0 would give K = 1; ΔG° is defined at standard conditions but K is a property of the reaction, not forced to 1.
    answer: 0
    explanation: |
      Practice 5. ΔG° = −RT ln K; each 5.7 kJ of ΔG° at 298 K is one power of ten in K, so 131 kJ is about 23 powers of ten.
  - slug: apchem-u09-exam-q04
    type: multiple_choice
    topic_code: "9.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Which sample has the greatest entropy?
    options:
      - "1 mol of liquid water at 25 °C"
      - "1 mol of ice at 0 °C"
      - "1 mol of liquid water at 0 °C"
      - "1 mol of water vapour at 100 °C"
    option_explanations:
      - |
        Liquid water at 25 °C has more entropy than ice or cooler liquid water, but far less than the gas.
      - |
        Ice is the most ordered of the four; its molecules are fixed in a lattice.
      - |
        Liquid water at 0 °C has more entropy than ice at the same temperature but less than warmer liquid or the vapour.
      - |
        Correct. The gas phase has the greatest dispersal of matter, and the higher temperature adds further dispersal of energy.
    answer: 3
    explanation: |
      Practice 4. S increases solid → liquid → gas and with temperature; the gas at the highest temperature wins on both counts.
  - slug: apchem-u09-exam-q05
    type: multiple_choice
    topic_code: "9.1"
    source: "general knowledge"
    points: 1
    prompt: |
      For which process is ΔS of the system negative?
    options:
      - "N₂(g) + 3 H₂(g) → 2 NH₃(g)"
      - "NH₄NO₃(s) → NH₄⁺(aq) + NO₃⁻(aq)"
      - "C₆H₁₂O₆(s) + 6 O₂(g) → 6 CO₂(g) + 6 H₂O(g)"
      - "I₂(s) → I₂(g)"
    option_explanations:
      - |
        Correct. Four moles of gas become two; the matter is less dispersed, so ΔS is negative (−198 J/K for this reaction).
      - |
        Dissolving a solid into mobile ions raises entropy.
      - |
        Six moles of gas become twelve; a large positive ΔS.
      - |
        Sublimation produces a gas from a solid, the largest possible increase in dispersal.
    answer: 0
    explanation: |
      Practice 4. Fewer gas moles on the right means ΔS < 0.
  - slug: apchem-u09-exam-q06
    type: multiple_choice
    topic_code: "9.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Which statement about standard molar entropies, S°, is correct?
    options:
      - "S° of an element in its standard state is zero, like ΔH°f."
      - "S° values are always negative for solids."
      - "S° of any substance is positive at 298 K, and a perfect crystal has zero entropy only at 0 K."
      - "S° depends on the amount of substance but not on its phase."
    option_explanations:
      - |
        Unlike ΔH°f and ΔG°f, S° is an absolute quantity; O₂(g) has S° = 205.2 J/(mol·K), not zero.
      - |
        S° values are positive for every substance above absolute zero, solids included (CaO 38.1 J/(mol·K)).
      - |
        Correct. The third law sets the zero at a perfect crystal at 0 K; everything above that has positive absolute entropy, which is why ΔS° is calculated directly from S° values.
      - |
        Phase is the single largest influence on S°; gases have far higher values than liquids or solids of the same substance.
    answer: 2
    explanation: |
      Practice 1. Absolute entropies (third law) are what makes ΔS° = Σ S°(products) − Σ S°(reactants) possible with no "formation" bookkeeping.
  - slug: apchem-u09-exam-q07
    type: multiple_choice
    topic_code: "9.3"
    source: "general knowledge"
    points: 1
    prompt: |
      A reaction has ΔH° = +50 kJ and ΔS° = −120 J/K. Which statement is correct?
    options:
      - "The reaction is favourable at high temperature only."
      - "The reaction is not thermodynamically favourable at any temperature."
      - "The reaction is favourable at low temperature only."
      - "The reaction is favourable at all temperatures."
    option_explanations:
      - |
        High temperature helps only when ΔS° > 0; here −TΔS° is positive and grows with T.
      - |
        Correct. Both terms of ΔG° = ΔH° − TΔS° are positive at every temperature, so ΔG° > 0 always; the reverse reaction is the favourable one.
      - |
        Low temperature favours reactions with ΔH° < 0; a positive ΔH° cannot be overcome when ΔS° is also negative.
      - |
        That is the (−, +) case; this is the (+, −) case, its opposite.
    answer: 1
    explanation: |
      Practice 6. (+, −): never favourable. Its reverse, (−, +), is favourable at every temperature.
  - slug: apchem-u09-exam-q08
    type: multiple_choice
    topic_code: "9.4"
    source: "general knowledge"
    points: 1
    prompt: |
      At 298 K and 1 atm, ΔG° for C(diamond) → C(graphite) is −2.9 kJ/mol, yet diamonds do not visibly change over centuries. Which explanation is correct?
    options:
      - "The negative ΔG° is too small to make the reaction favourable."
      - "Diamond is actually the more stable form, so the sign of ΔG° must be wrong."
      - "The reaction is at equilibrium, so no net change occurs."
      - "The conversion is thermodynamically favourable but has an enormous activation energy, so it is under kinetic control."
    option_explanations:
      - |
        Any negative ΔG° means K > 1; magnitude affects how far the equilibrium lies, not whether the reaction is favourable.
      - |
        Graphite is the more stable form at 1 atm; the negative ΔG° is correct.
      - |
        Equilibrium would require ΔG = 0; with ΔG° < 0 and essentially pure diamond present, the system is far from equilibrium.
      - |
        Correct. Breaking the sp³ carbon network needs a very large Ea, so the rate is negligible at room temperature; favourable does not mean fast.
    answer: 3
    explanation: |
      Practice 6. Thermodynamics (ΔG°) says the change is downhill; kinetics (Ea) says the hill in between is too high to cross at 298 K.
  - slug: apchem-u09-exam-q09
    type: multiple_choice
    topic_code: "9.4"
    source: "general knowledge"
    points: 1
    prompt: |
      A catalyst is added to a reaction mixture that has not yet reached equilibrium. Which quantity is unchanged by the catalyst?
    options:
      - "ΔG° and the equilibrium constant K"
      - "The rate at which equilibrium is reached"
      - "The activation energy of the forward reaction"
      - "The activation energy of the reverse reaction"
    option_explanations:
      - |
        Correct. A catalyst changes the pathway, not the initial and final states; ΔG°, ΔH°, ΔS° and K are all untouched, and the equilibrium composition is the same, reached sooner.
      - |
        The rate is exactly what a catalyst changes; equilibrium is reached faster.
      - |
        The catalyst lowers the forward activation energy by providing a different mechanism.
      - |
        The reverse activation energy is lowered by the same amount, which is why K is unchanged.
    answer: 0
    explanation: |
      Practice 6. Catalysts act on kinetics only.
  - slug: apchem-u09-exam-q10
    type: multiple_choice
    topic_code: "9.5"
    source: "general knowledge"
    points: 1
    prompt: |
      A reaction has ΔG° = +10 kJ/mol at 298 K. A mixture is prepared in which Q = 1 × 10⁻⁴. Which statement is correct?
    options:
      - "The reaction proceeds in reverse, because ΔG° is positive."
      - "The mixture is at equilibrium, because ΔG° is small."
      - "The reaction proceeds forward, because ΔG = ΔG° + RT ln Q = 10 − 22.8 = −12.8 kJ/mol is negative."
      - "No reaction occurs in either direction until a catalyst is added."
    option_explanations:
      - |
        ΔG°, not ΔG, is positive; the direction of reaction under actual conditions depends on ΔG, which includes the RT ln Q term.
      - |
        Equilibrium requires ΔG = 0, which here would need Q = K ≈ 0.018 (from ΔG° = +10 kJ); Q = 10⁻⁴ is far below that.
      - |
        Correct. RT ln Q = (8.314)(298)(ln 10⁻⁴) = (2,478)(−9.21) = −22,800 J; ΔG = +10,000 − 22,800 = −12,800 J, so the mixture moves forward toward Q = K.
      - |
        A catalyst affects rate, not direction; thermodynamics already says the forward reaction is downhill from this starting point.
    answer: 2
    explanation: |
      Practice 5. Q < K (10⁻⁴ versus 0.018) means forward; ΔG makes the same statement in energy units.
  - slug: apchem-u09-exam-q11
    type: multiple_choice
    topic_code: "9.6"
    source: "general knowledge"
    points: 1
    prompt: |
      In cells, the unfavourable formation of glucose-6-phosphate from glucose and phosphate (ΔG° ≈ +14 kJ/mol) is made to occur. Which statement describes how?
    options:
      - "The cell raises its temperature until TΔS° exceeds ΔH°."
      - "The reaction is coupled to the hydrolysis of ATP (ΔG° ≈ −30 kJ/mol) through a shared intermediate, so the net ΔG° is about −16 kJ/mol."
      - "An enzyme lowers ΔG° for the reaction below zero."
      - "The equilibrium constant of the phosphorylation is increased by adding more glucose."
    option_explanations:
      - |
        Cells run at nearly constant temperature; a 14 kJ barrier is not overcome thermally.
      - |
        Correct. ATP transfers its phosphate directly to glucose in one enzyme-catalysed step, so the free energies add: +14 + (−30) ≈ −16 kJ/mol, favourable.
      - |
        Enzymes are catalysts; they lower Ea, never ΔG°.
      - |
        Adding reactant changes Q and can shift position, but it does not change K; and K for the uncoupled reaction stays about 0.004.
    answer: 1
    explanation: |
      Practice 6. Coupling: a favourable reaction that shares an intermediate with the unfavourable one makes the sum favourable; ΔG° values add, K values multiply.
  - slug: apchem-u09-exam-q12
    type: multiple_choice
    topic_code: "9.7"
    source: "general knowledge"
    points: 1
    prompt: |
      In a galvanic cell with a KNO₃ salt bridge, which statement about ion movement is correct?
    options:
      - "Electrons flow through the salt bridge from the anode to the cathode."
      - "K⁺ ions move toward the anode compartment to neutralise the negative charge building up there."
      - "The salt bridge is unnecessary if the wire is thick enough."
      - "NO₃⁻ ions move toward the anode compartment, where positive ions are being produced, and K⁺ ions toward the cathode compartment."
    option_explanations:
      - |
        Electrons travel only through the external wire; ions, not electrons, carry charge through the salt bridge and solutions.
      - |
        The anode compartment accumulates positive metal ions, so anions, not cations, migrate toward it.
      - |
        Without the salt bridge, charge would build up in each compartment within a tiny fraction of a second and the current would stop; the wire cannot carry ions.
      - |
        Correct. Oxidation at the anode releases cations into solution, balanced by incoming anions; reduction at the cathode removes cations, balanced by incoming K⁺.
    answer: 3
    explanation: |
      Practice 1. "Anions to the anode, cations to the cathode" through the salt bridge; electrons through the wire.
  - slug: apchem-u09-exam-q13
    type: multiple_choice
    topic_code: "9.8"
    source: "general knowledge"
    points: 1
    prompt: |
      E° = +0.34 V for Cu²⁺(aq) + 2 e⁻ → Cu(s). What is E° for 3 Cu²⁺(aq) + 6 e⁻ → 3 Cu(s), and what is E° for Cu(s) → Cu²⁺(aq) + 2 e⁻?
    options:
      - "+0.34 V and −0.34 V"
      - "+1.02 V and −0.34 V"
      - "+1.02 V and −1.02 V"
      - "+0.34 V and +0.34 V"
    option_explanations:
      - |
        Correct. Scaling a half-reaction leaves its potential unchanged (intensive), while reversing it reverses the sign.
      - |
        Tripling the equation does not triple the potential; E° stays +0.34 V.
      - |
        Both values are wrong for the same reason: E° does not scale with the coefficients.
      - |
        The reversed half-reaction (an oxidation) has the opposite sign, −0.34 V.
    answer: 0
    explanation: |
      Practice 1. Potentials are per electron; they are reversed in sign when a half-reaction is reversed and unchanged when it is multiplied.
  - slug: apchem-u09-exam-q14
    type: multiple_choice
    topic_code: "9.9"
    source: "general knowledge"
    points: 1
    prompt: |
      For the cell Zn(s) | Zn²⁺(aq) || Cu²⁺(aq) | Cu(s), which change would increase the cell potential above E°?
    options:
      - "Adding Zn(NO₃)₂ to the anode compartment"
      - "Using a larger zinc electrode"
      - "Increasing [Cu²⁺] in the cathode compartment"
      - "Diluting the Cu²⁺ solution with water"
    option_explanations:
      - |
        Zn²⁺ is a product; raising it raises Q and lowers E.
      - |
        Electrode size changes the current the cell can deliver and how long it lasts, not the potential.
      - |
        Correct. Cu²⁺ is a reactant; raising it lowers Q = [Zn²⁺]/[Cu²⁺] below 1, making RT ln Q negative and E > E°.
      - |
        Diluting a reactant raises Q and lowers E.
    answer: 2
    explanation: |
      Practice 4. Nernst: E = E° − (RT/nF) ln Q. More reactant ion or less product ion means smaller Q and higher E.
  - slug: apchem-u09-exam-q15
    type: multiple_choice
    topic_code: "9.10"
    source: "general knowledge"
    points: 1
    prompt: |
      Molten magnesium chloride is electrolysed with inert electrodes. What forms at each electrode?
    options:
      - "Cathode: H₂(g); anode: Cl₂(g)"
      - "Cathode: Mg(l); anode: Cl₂(g)"
      - "Cathode: Cl₂(g); anode: Mg(l)"
      - "Cathode: Mg(l); anode: O₂(g)"
    option_explanations:
      - |
        There is no water in a molten salt, so hydrogen cannot form; the only cation present is Mg²⁺.
      - |
        Correct. Mg²⁺ + 2 e⁻ → Mg at the cathode (reduction) and 2 Cl⁻ → Cl₂ + 2 e⁻ at the anode (oxidation); this is how magnesium is manufactured.
      - |
        The electrodes are reversed: cations are reduced at the cathode and anions oxidised at the anode.
      - |
        No oxygen-containing species is present in molten MgCl₂.
    answer: 1
    explanation: |
      Practice 6. In a molten salt the salt's own ions are the only candidates; in water, compare with water's half-reactions.
  - slug: apchem-u09-exam-q16
    type: multiple_choice
    topic_code: "6.9"
    source: "general knowledge"
    points: 1
    prompt: |
      Given ΔH° = −393.5 kJ for C(s) + O₂(g) → CO₂(g) and ΔH° = −283.0 kJ for CO(g) + ½ O₂(g) → CO₂(g), what is ΔH° for C(s) + ½ O₂(g) → CO(g)?
    options:
      - "−676.5 kJ"
      - "+110.5 kJ"
      - "−283.0 kJ"
      - "−110.5 kJ"
    option_explanations:
      - |
        Adding the two equations as written does not give the target; the second must be reversed, not added.
      - |
        The magnitude is right but the sign is wrong: forming CO from its elements is exothermic.
      - |
        This is the enthalpy of the second reaction, not of the target.
      - |
        Correct. Keep the first equation and reverse the second (+283.0 kJ): C + O₂ → CO₂ and CO₂ → CO + ½ O₂ add to C + ½ O₂ → CO with ΔH° = −393.5 + 283.0 = −110.5 kJ.
    answer: 3
    explanation: |
      Practice 5 (review of 6.9). Hess's law: manipulate the given equations so that unwanted species cancel, and treat ΔH° the same way. The same bookkeeping gives ΔG° for coupled reactions.
  - slug: apchem-u09-exam-q17
    type: multiple_choice
    topic_code: "7.3"
    source: "general knowledge"
    points: 1
    prompt: |
      For the cell reaction Ni(s) + 2 Ag⁺(aq) → Ni²⁺(aq) + 2 Ag(s), which is the correct expression for Q?
    options:
      - "Q = [Ni²⁺][Ag]² / ([Ni][Ag⁺]²)"
      - "Q = [Ni²⁺] / [Ag⁺]²"
      - "Q = [Ni²⁺] / (2[Ag⁺])"
      - "Q = [Ag⁺]² / [Ni²⁺]"
    option_explanations:
      - |
        Solids never appear in Q; their "concentration" is constant and is folded into K.
      - |
        Correct. Only the aqueous ions appear, products over reactants, each raised to its coefficient.
      - |
        Coefficients become exponents, not multipliers.
      - |
        This is the expression for the reverse reaction; products belong in the numerator.
    answer: 1
    explanation: |
      Practice 5 (review of 7.3). This Q goes straight into the Nernst equation; the squared silver term is why [Ag⁺] has a stronger effect on E than [Ni²⁺].
  - slug: apchem-u09-exam-q18
    type: multiple_choice
    topic_code: "4.9"
    source: "general knowledge"
    points: 1
    prompt: |
      In the half-reaction MnO₄⁻(aq) + 8 H⁺(aq) + 5 e⁻ → Mn²⁺(aq) + 4 H₂O(l), what is the oxidation number of manganese before and after, and is permanganate the oxidising or reducing agent?
    options:
      - "+4 to +2; reducing agent"
      - "+7 to +2; reducing agent"
      - "+7 to +2; oxidising agent"
      - "+5 to +2; oxidising agent"
    option_explanations:
      - |
        Four oxygens at −2 and an ion charge of −1 give Mn = +7, not +4.
      - |
        The oxidation numbers are right, but a species that gains electrons (is reduced) is the oxidising agent.
      - |
        Correct. Mn is +7 in MnO₄⁻ (four O at −2 sum to −8; −8 + 7 = −1) and +2 in Mn²⁺; it gains five electrons, so it is reduced and is therefore the oxidising agent.
      - |
        Five is the number of electrons gained, not the starting oxidation number.
    answer: 2
    explanation: |
      Practice 5 (review of 4.9). The change in oxidation number equals the electrons in the half-reaction; this n enters ΔG° = −nFE° and Faraday's law.
  # ---- Stimulus set B: zinc–silver galvanic cell (9.7, 9.8, 9.9)
  - slug: apchem-u09-exam-q19
    type: multiple_choice
    topic_code: "9.7"
    source: "general knowledge"
    points: 1
    stimulus: |
      A galvanic cell is built from a zinc electrode in 1.0 M Zn(NO₃)₂ and a silver electrode in 1.0 M AgNO₃ at 298 K, joined by a wire through a voltmeter and a KNO₃ salt bridge.

      | Half-reaction | E° (V) |
      |---|---|
      | Ag⁺(aq) + e⁻ → Ag(s) | +0.80 |
      | Cu²⁺(aq) + 2 e⁻ → Cu(s) | +0.34 |
      | 2 H⁺(aq) + 2 e⁻ → H₂(g) | 0.00 |
      | Zn²⁺(aq) + 2 e⁻ → Zn(s) | −0.76 |
    prompt: |
      Which statement about the cell is correct?
    options:
      - "Zinc is the anode; electrons flow through the wire from zinc to silver; the zinc electrode loses mass."
      - "Silver is the anode; electrons flow through the wire from silver to zinc; the silver electrode loses mass."
      - "Zinc is the cathode; electrons flow through the salt bridge to silver."
      - "Zinc is the anode; electrons flow through the wire from silver to zinc; the silver electrode gains mass."
    option_explanations:
      - |
