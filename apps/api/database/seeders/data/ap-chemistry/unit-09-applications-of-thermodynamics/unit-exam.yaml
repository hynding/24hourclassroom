      (a) Cu(s) + 2 Ag⁺(aq) → Cu²⁺(aq) + 2 Ag(s); n = 2; E° = 0.80 − 0.34 = 0.46 V; ΔG° = −(2)(96,485)(0.46) = −88,800 J = −88.8 kJ (accept −88 to −89 kJ).
