      Three points.

      (a) 1 pt: balanced equation, n = 2, E° = 0.46 V, ΔG° ≈ −88.8 kJ.
      (b) 1 pt: Q = 10 and E ≈ 0.43 V.
      (c) 1 pt: Q rises as reactant ion is consumed and product ion made, so E falls toward zero at Q = K.
