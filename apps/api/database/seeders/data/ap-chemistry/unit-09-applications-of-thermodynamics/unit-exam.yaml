      - "E° = 2.36 V; ΔG° = −455 kJ"
      - "E° = 1.56 V; ΔG° = −301 kJ"
      - "E° = 1.56 V; ΔG° = −151 kJ"
    option_explanations:
      - |
        0.04 V would be 0.80 − 0.76; the anode value is negative, so subtracting it adds: 0.80 − (−0.76) = 1.56 V.
      - |
