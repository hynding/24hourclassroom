        A galvanic cell is built from a nickel electrode in 1.0 M Ni(NO₃)₂(aq) and a silver electrode in 1.0 M AgNO₃(aq), connected by a wire through a voltmeter and by a KNO₃ salt bridge. Standard reduction potentials: Ag⁺ + e⁻ → Ag, +0.80 V; Ni²⁺ + 2 e⁻ → Ni, −0.25 V.

        (a) Write the two half-reactions, label each as oxidation or reduction, and write the balanced overall equation.
        (b) Identify the anode and the cathode, give the sign of each electrode, and state the direction of electron flow in the wire.
        (c) Describe what happens to the mass of each electrode and to the concentration of each metal ion as the cell runs.
        (d) Explain the role of the salt bridge and state which way K⁺ and NO₃⁻ ions migrate.
        (e) Write the cell in line notation.
