        Six points.

        (a) 1 pt: both half-reactions labelled, silver doubled, correct overall equation.
        (b) 1 pt: Ni anode (−), Ag cathode (+), electrons Ni → Ag.
        (c) 1 pt: Ni loses mass and [Ni²⁺] rises; Ag gains mass and [Ag⁺] falls.
        (d) 1 pt: salt bridge keeps neutrality; NO₃⁻ to the nickel side, K⁺ to the silver side.
        (e) 1 pt: Ni(s) | Ni²⁺(aq) || Ag⁺(aq) | Ag(s).
        (f) 1 pt: electrolytic cell; silver is now the anode; ΔG > 0 for the driven reaction.

