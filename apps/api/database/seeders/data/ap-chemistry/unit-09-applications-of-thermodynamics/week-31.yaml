week: 31
unit: 9
title: "Free Energy, Equilibrium, Coupled Reactions and Electrochemical Cells"
topics: ["9.5", "9.6", "9.7"]
guide: guides/week-31.md
guide_description: |
  ΔG° = −RT ln K and what the sign of ΔG° says about K; ΔG = ΔG° + RT ln Q as the thermodynamic form of the
  Q-versus-K rule, with its consequences for reactions that have positive ΔG° and for the temperature
  dependence of K; coupled reactions in metabolism (ATP), metallurgy (carbon reduction of ores) and the role
  of light and electricity as external free-energy inputs; and the anatomy of galvanic and electrolytic
  cells: anode, cathode, electrode signs, salt bridge, electron and ion flow, cell notation. Worked examples
  for ammonia synthesis, acetic acid, hexokinase, iron smelting, the Ni/Ag cell and molten salt electrolysis.
flashcards_description: |
  29 cards on the ΔG°–K relation, ΔG under non-standard conditions, coupled reactions and the parts and
  signs of galvanic and electrolytic cells.

flashcards:
  - front: ΔG° and K → the bridging equation
    back: |
      ΔG° = −RT ln K, with R = 8.314 J/(mol·K) and T in kelvin; ΔG° comes out in J/mol. Equivalently K = e^(−ΔG°/RT).
    topic_code: "9.5"
  - front: Sign of ΔG° and size of K
    back: |
      ΔG° < 0 ⇔ K > 1 (products favoured); ΔG° > 0 ⇔ K < 1 (reactants favoured); ΔG° = 0 ⇔ K = 1. At 298 K each 5.7 kJ/mol of ΔG° is one factor of 10 in K.
    topic_code: "9.5"
  - front: "Worked K for ammonia synthesis from ΔG° = −33.2 kJ/mol"
    back: |
      K = e^(33,200/(8.314 × 298)) = e^(13.4) = 6.6 × 10⁵ at 298 K. A modestly negative ΔG° is a very large K.
    topic_code: "9.5"
  - front: "Worked ΔG° from K = 50 at 700 K"
    back: |
      ΔG° = −(8.314)(700) ln 50 = −5,820 × 3.91 = −22,800 J/mol = −22.8 kJ/mol for H₂ + I₂ ⇌ 2 HI.
    topic_code: "9.5"
  - front: Thermodynamic meaning of a weak acid's Ka
    back: |
      ΔG° = −RT ln Ka is positive for Ka < 1: ionising to 1 M ions is unfavourable. Acetic acid (Ka = 1.8 × 10⁻⁵) has ΔG° = +27.1 kJ/mol at 298 K.
    topic_code: "9.5"
  - front: ΔG under non-standard conditions
    back: |
      ΔG = ΔG° + RT ln Q. ΔG° is a constant for the reaction at a given T; ΔG depends on the actual mixture through Q and is zero at equilibrium.
    topic_code: "9.5"
  - front: Why ΔG = 0 when Q = K
    back: |
      Substituting Q = K: ΔG = ΔG° + RT ln K = ΔG° − ΔG° = 0. Q < K gives ΔG < 0 (forward); Q > K gives ΔG > 0 (reverse): the unit 7 rule in thermodynamic dress.
    topic_code: "9.5"
  - front: Why a reaction with ΔG° > 0 still forms some product
    back: |
      From pure reactants Q = 0 and RT ln Q → −∞, so ΔG is negative at first; the forward reaction runs until Q rises to K (< 1). 'Unfavourable' means little product, not none.
    topic_code: "9.5"
  - front: "Worked ΔG for ammonia synthesis at Q = 10³"
    back: |
      ΔG = −33.2 + (0.008314)(298) ln(10³) = −33.2 + 17.1 = −16.1 kJ/mol: still forward, because Q = 10³ is below K = 6.6 × 10⁵.
    topic_code: "9.5"
  - front: Temperature dependence of K from thermodynamics
    back: |
      ln K = −ΔH°/(RT) + ΔS°/R. Exothermic (ΔH° < 0): K falls as T rises. Endothermic: K rises. This derives Le Châtelier's temperature rule.
    topic_code: "9.5"
  - front: Relation between ΔG°, ΔH°, ΔS° and K in one line
    back: |
      −RT ln K = ΔH° − TΔS°. Given any three of ΔH°, ΔS°, T and K, the fourth follows; a plot of ln K against 1/T has slope −ΔH°/R.
    topic_code: "9.5"
  - front: Coupled reactions → principle
    back: |
      An unfavourable reaction proceeds when it shares an intermediate with a favourable one so that the sum has ΔG° < 0. ΔG° values add (as in Hess's law); K values multiply.
    topic_code: "9.6"
  - front: "Worked ATP coupling: phosphorylating glucose"
    back: |
      Glucose + Pi → G6P + H₂O, +13.8 kJ/mol; ATP + H₂O → ADP + Pi, −30.5 kJ/mol. Net glucose + ATP → G6P + ADP, −16.7 kJ/mol (K ≈ 850). Hexokinase transfers the phosphate directly.
    topic_code: "9.6"
  - front: Why cells use ATP
    back: |
      ATP hydrolysis (ΔG° ≈ −30.5 kJ/mol) is favourable and is coupled by enzymes to unfavourable synthesis, transport and movement; the favourable oxidation of food is coupled in turn to remaking ATP from ADP.
    topic_code: "9.6"
  - front: Carbon reduction of metal ores as coupling
    back: |
      ZnO → Zn + ½ O₂ (+318 kJ) is paid for by C + ½ O₂ → CO (−137 kJ at 298 K, more negative at high T because ΔS° > 0). ZnO + C → Zn + CO is +181 kJ at 298 K but favourable above about 1,200 K.
    topic_code: "9.6"
  - front: "Worked iron smelting: Fe₂O₃ + 3 CO → 2 Fe + 3 CO₂"
    back: |
      From ΔG°f (−742.2, −137.2, −394.4 kJ/mol): ΔG° = 3(−394.4) − (−742.2) − 3(−137.2) = −29.4 kJ/mol. The oxidation of CO pays for the reduction of the oxide.
    topic_code: "9.6"
  - front: Light and electricity as free-energy inputs
    back: |
      Photosynthesis (ΔG° = +2,870 kJ/mol glucose) is driven by absorbed photons; electrolysis of water (ΔG° = +474 kJ) by electrical work. An external source pays for the unfavourable change; the second law holds for the whole system.
    topic_code: "9.6"
  - front: Galvanic (voltaic) cell → definition
    back: |
      A device in which a thermodynamically favourable redox reaction (ΔG < 0, E° > 0) is split into two half-cells so that the electrons flow through an external wire and can do electrical work. Batteries and fuel cells.
    topic_code: "9.7"
  - front: Electrolytic cell → definition
    back: |
      A device in which an external power supply forces a non-favourable redox reaction (ΔG > 0) to occur: electrolysis of molten salts or water, electroplating, recharging a battery.
    topic_code: "9.7"
  - front: Anode and cathode in every cell
    back: |
      Oxidation occurs at the anode and reduction at the cathode, in galvanic and electrolytic cells alike ('an ox, red cat'). What changes between the cell types is the sign of each electrode.
    topic_code: "9.7"
  - front: Electrode signs in a galvanic cell
    back: |
      Anode negative (electrons are released there and leave into the wire); cathode positive (electrons arrive and are consumed). Electrons flow anode → wire → cathode.
    topic_code: "9.7"
  - front: Electrode signs in an electrolytic cell
    back: |
      The supply pulls electrons from the anode (connected to its positive terminal) and pushes them into the cathode (negative terminal). Still oxidation at the anode and reduction at the cathode.
    topic_code: "9.7"
  - front: Role of the salt bridge
    back: |
      It completes the circuit with ion flow: anions migrate toward the anode compartment (where cations are being produced) and cations toward the cathode compartment (where cations are being consumed). Without it charge builds up and current stops.
    topic_code: "9.7"
  - front: Mass changes of the electrodes in a Zn/Cu cell
    back: |
      The zinc anode dissolves (Zn → Zn²⁺ + 2 e⁻) and loses mass; the copper cathode gains mass as Cu²⁺ + 2 e⁻ → Cu plates onto it. [Zn²⁺] rises and [Cu²⁺] falls.
    topic_code: "9.7"
  - front: Cell notation
    back: |
      Anode on the left, cathode on the right; | for a phase boundary, || for the salt bridge: Zn(s) | Zn²⁺(aq) || Cu²⁺(aq) | Cu(s). An inert Pt electrode is written for half-cells with no solid metal: Pt(s) | Fe²⁺(aq), Fe³⁺(aq).
    topic_code: "9.7"
  - front: Deciding which half-cell is the cathode
    back: |
      The half-reaction with the higher (more positive) standard reduction potential proceeds as a reduction and is the cathode; the other runs in reverse as the anode. E°cell = E°(cathode) − E°(anode) > 0 for a galvanic cell.
    topic_code: "9.7"
  - front: "Worked Ni/Ag galvanic cell"
    back: |
      E°: Ag⁺/Ag +0.80, Ni²⁺/Ni −0.25 V. Cathode Ag⁺ + e⁻ → Ag; anode Ni → Ni²⁺ + 2 e⁻; overall Ni + 2 Ag⁺ → Ni²⁺ + 2 Ag, E°cell = 1.05 V; Ni(s) | Ni²⁺(aq) || Ag⁺(aq) | Ag(s).
    topic_code: "9.7"
  - front: Electrolysis of a molten salt
    back: |
      Molten NaCl: cathode Na⁺ + e⁻ → Na(l); anode 2 Cl⁻ → Cl₂(g) + 2 e⁻. No salt bridge is needed because both electrodes share one electrolyte; the supply must exceed the reverse cell potential.
    topic_code: "9.7"
  - front: A rechargeable battery as both cell types
    back: |
      Discharging, it is a galvanic cell (favourable reaction produces current); charging, it is an electrolytic cell (the charger forces the reverse reaction). The same electrode is anode in one mode and cathode in the other.
    topic_code: "9.7"

quiz:
  description: |
    23 questions · about 45 minutes · topics 9.5–9.7 (ΔG° and K, ΔG under non-standard conditions, coupled
    reactions, and galvanic and electrolytic cells), with review of oxidation numbers and redox, combining
    equilibrium constants, Hess's law, the free energy of dissolution and ΔG° from ΔG°f. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: a nickel–silver galvanic cell (9.7)
    - slug: apchem-u09-w31-q01
      type: multiple_choice
      topic_code: "9.7"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table: standard reduction potentials at 25 °C. Ag⁺ + e⁻ → Ag, +0.80 V; Cu²⁺ + 2 e⁻ → Cu, +0.34 V; 2 H⁺ + 2 e⁻ → H₂, 0.00 V; Ni²⁺ + 2 e⁻ → Ni, −0.25 V; Zn²⁺ + 2 e⁻ → Zn, −0.76 V; Mg²⁺ + 2 e⁻ → Mg, −2.37 V. A galvanic cell is built from a nickel electrode in 1.0 M Ni(NO₃)₂ and a silver electrode in 1.0 M AgNO₃, connected by a wire and a KNO₃ salt bridge.
      prompt: |
        Which statement about the electrodes is correct?
      options:
        - "Silver is the anode and is negative; nickel is the cathode and is positive."
        - "Nickel is the cathode and is negative, because it has the lower reduction potential."
        - "Nickel is the anode and is negative, because Ni is oxidised and releases electrons into the wire; silver is the cathode and is positive."
        - "Both electrodes are neutral, because the salt bridge keeps the charge balanced."
      option_explanations:
        - |
          Silver has the higher reduction potential, so Ag⁺ is reduced at the silver electrode, which is the cathode.
        - |
          Nickel's lower potential means it is oxidised, which makes it the anode, not the cathode.
        - |
          Correct. Ni → Ni²⁺ + 2 e⁻ at the anode; the electrons leave through the wire, making the anode the negative terminal; at the silver cathode Ag⁺ + e⁻ → Ag consumes them.
        - |
          The salt bridge balances the solutions' charges, but the electrodes still carry opposite signs in a working cell.
      answer: 2
      explanation: |
        Practice 1. The higher reduction potential is the cathode; oxidation at the anode, which is negative in a galvanic cell.

    - slug: apchem-u09-w31-q02
      type: multiple_choice
      topic_code: "9.7"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table: standard reduction potentials at 25 °C. Ag⁺ + e⁻ → Ag, +0.80 V; Cu²⁺ + 2 e⁻ → Cu, +0.34 V; 2 H⁺ + 2 e⁻ → H₂, 0.00 V; Ni²⁺ + 2 e⁻ → Ni, −0.25 V; Zn²⁺ + 2 e⁻ → Zn, −0.76 V; Mg²⁺ + 2 e⁻ → Mg, −2.37 V. A galvanic cell is built from a nickel electrode in 1.0 M Ni(NO₃)₂ and a silver electrode in 1.0 M AgNO₃, connected by a wire and a KNO₃ salt bridge.
      prompt: |
        As the cell operates, which direction do the ions in the salt bridge move, and why?
      options:
        - "NO₃⁻ moves toward the nickel compartment and K⁺ toward the silver compartment, to balance the Ni²⁺ being produced and the Ag⁺ being consumed."
        - "K⁺ moves toward the nickel compartment to replace the nickel atoms that dissolve."
        - "Electrons move through the salt bridge from nickel to silver."
        - "No ions move; the salt bridge only prevents the solutions from mixing."
      option_explanations:
        - |
          Correct. Oxidation adds Ni²⁺ to the anode compartment, so anions flow in to neutralise it; reduction removes Ag⁺ from the cathode compartment, so cations flow in.
        - |
          Adding cations to a compartment that is already gaining Ni²⁺ would make the charge imbalance worse.
        - |
          Electrons travel only through the metal wire; the salt bridge carries ions.
        - |
          Ion migration is the whole point of the salt bridge; without it, charge builds up and the current stops.
      answer: 0
      explanation: |
        Practice 6. Anions to the anode, cations to the cathode.

    - slug: apchem-u09-w31-q03
      type: multiple_choice
      topic_code: "9.7"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table: standard reduction potentials at 25 °C. Ag⁺ + e⁻ → Ag, +0.80 V; Cu²⁺ + 2 e⁻ → Cu, +0.34 V; 2 H⁺ + 2 e⁻ → H₂, 0.00 V; Ni²⁺ + 2 e⁻ → Ni, −0.25 V; Zn²⁺ + 2 e⁻ → Zn, −0.76 V; Mg²⁺ + 2 e⁻ → Mg, −2.37 V. A galvanic cell is built from a nickel electrode in 1.0 M Ni(NO₃)₂ and a silver electrode in 1.0 M AgNO₃, connected by a wire and a KNO₃ salt bridge.
      prompt: |
        Which is the correct cell notation and overall reaction?
      options:
        - "Ag(s) | Ag⁺(aq) || Ni²⁺(aq) | Ni(s); 2 Ag + Ni²⁺ → 2 Ag⁺ + Ni"
        - "Ni(s) | Ni²⁺(aq) || Ag⁺(aq) | Ag(s); Ni + 2 Ag⁺ → Ni²⁺ + 2 Ag"
        - "Ni(s) | Ag⁺(aq) || Ni²⁺(aq) | Ag(s); Ni + Ag⁺ → Ni²⁺ + Ag"
        - "Ni(s) | Ni²⁺(aq) | Ag⁺(aq) | Ag(s); Ni + 2 Ag⁺ → Ni²⁺ + 2 Ag"
      option_explanations:
        - |
          This puts the cathode on the left and writes the reverse (non-favourable) reaction.
        - |
          Correct. Anode half-cell on the left, cathode on the right, double bar for the salt bridge, and the overall equation balanced in electrons (two Ag⁺ per Ni).
        - |
          The ions are paired with the wrong metals, and the electrons are not balanced.
        - |
          A single bar between the two solutions omits the salt bridge; the double bar is required.
      answer: 1
      explanation: |
        Practice 1. Anode | its ion || cathode ion | cathode, with the electron count balanced.

    # ---- Stand-alone multiple choice
    - slug: apchem-u09-w31-q04
      type: multiple_choice
      topic_code: "9.5"
      source: "general knowledge"
      points: 1
      prompt: |
        A reaction has ΔG° = +11.4 kJ/mol at 298 K. Which statement about its equilibrium constant is correct? (RT ln 10 = 5.7 kJ/mol at 298 K)
      options:
        - "K ≈ 100, because a positive ΔG° means products are favoured."
        - "K ≈ 0.01, because ΔG° = −RT ln K gives ln K = −4.6."
        - "K = 1, because ΔG° is small."
        - "K is negative."
      option_explanations:
        - |
          A positive ΔG° means reactants are favoured; K is less than 1.
        - |
          Correct. ln K = −ΔG°/RT = −11,400/2,478 = −4.6, so K = e^(−4.6) = 0.010; equivalently, two units of 5.7 kJ above zero is two factors of 10 below 1.
        - |
          K = 1 only when ΔG° = 0 exactly; 11.4 kJ/mol is two orders of magnitude away.
        - |
          An equilibrium constant is a ratio of concentrations and is never negative.
      answer: 1
      explanation: |
        Practice 5. ΔG° > 0 ⇔ K < 1; each 5.7 kJ/mol at 298 K is a factor of 10.

    - slug: apchem-u09-w31-q05
      type: multiple_choice
      topic_code: "9.5"
      source: "general knowledge"
      points: 1
      prompt: |
        A reaction has ΔG° = +20 kJ/mol. Pure reactants are placed in a flask. Which statement is correct?
      options:
        - "No reaction occurs, because ΔG° is positive."
        - "The reaction proceeds to completion, because ΔG° is small."
        - "The reaction proceeds in reverse."
        - "Some product forms, because with no product present Q = 0 and ΔG = ΔG° + RT ln Q is negative, until Q rises to K (which is less than 1)."
      option_explanations:
        - |
          ΔG° refers to standard conditions; the actual driving force ΔG depends on Q, which is zero at the start.
        - |
          K = e^(−20,000/2,478) ≈ 3 × 10⁻⁴: only a small fraction converts.
        - |
          With no products there is nothing to react in reverse; the net direction is forward until Q = K.
        - |
          Correct. ln Q → −∞ for pure reactants, so ΔG < 0 initially; the reaction runs forward only until Q = K ≈ 3 × 10⁻⁴, leaving mostly reactants.
      answer: 3
      explanation: |
        Practice 6. ΔG, not ΔG°, decides the direction under the actual conditions.

    - slug: apchem-u09-w31-q06
      type: multiple_choice
      topic_code: "9.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Using ln K = −ΔH°/(RT) + ΔS°/R, which statement about the temperature dependence of K is correct?
      options:
        - "For an endothermic reaction, K increases as T increases, because the negative −ΔH°/(RT) term shrinks in magnitude."
        - "For an exothermic reaction, K increases as T increases."
        - "K is independent of temperature when ΔS° = 0."
        - "K always increases with temperature because ΔS°/R is constant."
      option_explanations:
        - |
          Correct. With ΔH° > 0, −ΔH°/(RT) is negative and becomes less negative as T grows, so ln K and K rise: heating favours an endothermic reaction, as Le Châtelier predicts.
        - |
          With ΔH° < 0 the positive term −ΔH°/(RT) shrinks as T rises, so K falls.
        - |
          The temperature dependence comes from the ΔH° term; ΔS° only sets the value K approaches at very high T.
        - |
          The direction depends on the sign of ΔH°; exothermic reactions have smaller K at higher T.
      answer: 0
      explanation: |
        Practice 6. The sign of ΔH° sets the direction of K's change with temperature.

    - slug: apchem-u09-w31-q07
      type: multiple_choice
      topic_code: "9.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Glucose + Pi → glucose-6-phosphate + H₂O has ΔG° = +13.8 kJ/mol; ATP + H₂O → ADP + Pi has ΔG° = −30.5 kJ/mol. How does the cell make the first reaction happen?
      options:
        - "By raising the temperature until the first reaction becomes favourable on its own."
        - "By using an enzyme to lower the activation energy, which makes ΔG° negative."
        - "By coupling the two reactions through the shared phosphate so that the overall reaction, glucose + ATP → glucose-6-phosphate + ADP, has ΔG° = −16.7 kJ/mol."
        - "By removing water so that Q for the first reaction is lowered to zero."
      option_explanations:
        - |
          Cells operate at nearly constant temperature; the coupling supplies the free energy.
        - |
          An enzyme speeds the reaction but can never change ΔG°; hexokinase works because it couples the two processes.
        - |
          Correct. The ΔG° values add: 13.8 + (−30.5) = −16.7 kJ/mol, so the combined process is favourable (K ≈ 850).
        - |
          Water is the solvent and cannot be removed from a cell; the driving force comes from ATP.
      answer: 2
      explanation: |
        Practice 6. Coupled reactions add their ΔG° values through a shared intermediate.

    - slug: apchem-u09-w31-q08
      type: multiple_choice
      topic_code: "9.6"
      source: "general knowledge"
      points: 1
      prompt: |
        ZnO(s) + C(s) → Zn(s) + CO(g) has ΔG° = +181 kJ/mol at 298 K yet is used to produce zinc at about 1,200 K. Which explanation is correct?
      options:
        - "At high temperature carbon becomes a stronger reducing agent because its activation energy falls."
        - "The reaction has ΔS° > 0 (a gas is formed from solids), so −TΔS° becomes large and negative at high T and ΔG° turns negative: the favourable oxidation of carbon pays for the unfavourable reduction of ZnO."
        - "At high temperature ZnO decomposes on its own and carbon is only a fuel."
        - "ΔG° is positive at every temperature, so the process must be powered by electricity."
      option_explanations:
        - |
          Activation energy affects rate; the change in favourability comes from the entropy term in ΔG° = ΔH° − TΔS°.
        - |
          Correct. Creating a mole of gas gives a positive ΔS°; above the crossover temperature the TΔS° term exceeds ΔH° and the coupled reaction becomes favourable.
        - |
          ZnO → Zn + ½ O₂ is strongly unfavourable even at 1,200 K; carbon's oxidation is essential.
        - |
          Electrolysis is used for aluminium, whose oxide carbon cannot reduce; zinc smelting is a thermal, coupled process.
      answer: 1
      explanation: |
        Practice 6. Coupling plus the temperature dependence of a gas-forming reaction.

    - slug: apchem-u09-w31-q09
      type: multiple_choice
      topic_code: "9.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement correctly contrasts galvanic and electrolytic cells?
      options:
        - "Oxidation occurs at the anode in a galvanic cell but at the cathode in an electrolytic cell."
        - "A galvanic cell requires a power supply; an electrolytic cell produces one."
        - "Both cells have a negative anode."
        - "In both cells oxidation occurs at the anode, but the anode is negative in a galvanic cell and positive in an electrolytic cell."
      option_explanations:
        - |
          Oxidation is at the anode in every electrochemical cell; the definitions do not change.
        - |
          It is the electrolytic cell that needs the power supply; a galvanic cell generates current from a favourable reaction.
        - |
          In an electrolytic cell the supply draws electrons out of the anode, making it positive.
        - |
          Correct. The electrode processes are the same; the signs differ because in a galvanic cell the anode releases electrons spontaneously, whereas in an electrolytic cell the supply's positive terminal pulls them out.
      answer: 3
      explanation: |
        Practice 1. 'An ox, red cat' in both; the signs swap.

    - slug: apchem-u09-w31-q10
      type: multiple_choice
      topic_code: "4.9"
      source: "general knowledge"
      points: 1
      prompt: |
        In the cell reaction Ni(s) + 2 Ag⁺(aq) → Ni²⁺(aq) + 2 Ag(s), which species is the reducing agent, and what happens to its oxidation number?
      options:
        - "Ni; its oxidation number rises from 0 to +2 as it is oxidised."
        - "Ag⁺; its oxidation number falls from +1 to 0 as it is reduced."
        - "Ni²⁺; it accepts electrons."
        - "Ag⁺; it donates electrons to nickel."
      option_explanations:
        - |
          Correct. The reducing agent is the species that is oxidised (loses electrons) and thereby reduces the other; Ni goes from 0 to +2, giving two electrons to two Ag⁺ ions.
        - |
          Ag⁺ is reduced, which makes it the oxidising agent, not the reducing agent.
        - |
          Ni²⁺ is a product; it is the oxidised form of nickel.
        - |
          Ag⁺ accepts electrons; it does not donate them.
      answer: 0
      explanation: |
        Practice 2 (review of 4.9). Reducing agent = species oxidised; oxidation number increases.

    - slug: apchem-u09-w31-q11
      type: multi_select
      topic_code: "4.9"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        A galvanic cell is built from a Zn/Zn²⁺ half-cell and a Cu/Cu²⁺ half-cell joined by a salt bridge. Which statements are correct? Select all that apply.
      options:
        - "Zinc is oxidised at the anode: Zn(s) → Zn²⁺(aq) + 2 e⁻."
        - "Electrons travel through the external wire from the zinc electrode to the copper electrode."
        - "The copper electrode loses mass as the cell runs."
        - "Anions from the salt bridge migrate toward the zinc half-cell."
        - "The two half-reactions must be multiplied so that the electrons cancel before the overall reaction is written."
      option_explanations:
        - |
          Correct. Zinc is the stronger reducing agent of the pair, so it is oxidised at the anode, releasing two electrons per atom.
        - |
          Correct. Electrons leave the electrode where oxidation happens (zinc) and travel through the wire to the electrode where reduction happens (copper).
        - |
          The copper electrode gains mass: Cu²⁺ ions are reduced and plate out as copper metal on it.
        - |
          Correct. Zn²⁺ builds up in the anode compartment, and anions from the salt bridge move there to keep that solution neutral.
        - |
          Correct. Electrons do not appear in the overall equation, so the half-reactions are scaled until the electrons lost equal the electrons gained.
      answer: [0, 1, 3, 4]
      explanation: |
        Practice 2 (review of 4.9). Zinc is the stronger reducing agent, so it is oxidised at the anode and its electrons flow through the wire to copper, where Cu²⁺ is reduced and copper plates out (the copper electrode gains mass, so the third statement is false). Anions move toward the anode compartment to balance the Zn²⁺ being produced. Both half-reactions here already involve two electrons, but in general the electrons must be made equal and cancelled.
    - slug: apchem-u09-w31-q12
      type: multi_select
      topic_code: "7.6"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Reaction 1 has equilibrium constant K₁ and reaction 2 has K₂, both at the same temperature. Reaction 3 is the sum of reactions 1 and 2. Which statements are correct? Select all that apply.
      options:
        - "K₃ = K₁ × K₂."
        - "K₃ = K₁ + K₂."
        - "ΔG°₃ = ΔG°₁ + ΔG°₂."
        - "If K₁ is very small and K₂ is very large, K₃ can still be greater than 1."
        - "Reversing reaction 2 before adding it would give K₃ = K₁ / K₂."
      option_explanations:
        - |
          Correct. Adding equations multiplies their equilibrium constants, because concentrations in the combined expression multiply.
        - |
          Equilibrium constants are never added; adding ΔG° values corresponds to multiplying K values.
        - |
          Correct. Free energy is a state function, so the ΔG° of a sum of reactions is the sum of the ΔG° values.
        - |
          Correct. The product of a very small and a very large number can exceed 1; this is how a favourable reaction drives an unfavourable one.
        - |
