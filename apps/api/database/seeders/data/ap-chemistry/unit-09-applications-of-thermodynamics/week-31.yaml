      answer: [0, 2, 3, 4]
      explanation: |
        Practice 5 (review of 7.6). Because ΔG° = −RT ln K, adding free energies is the same as multiplying equilibrium constants; reversing a reaction changes the sign of ΔG° and inverts K. A tiny K₁ times a huge K₂ can easily exceed 1, which is the whole idea of a coupled reaction. Equilibrium constants are never added.
