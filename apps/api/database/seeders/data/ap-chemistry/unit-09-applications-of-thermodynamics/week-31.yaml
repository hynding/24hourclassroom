        Zinc oxide is refined to the metal by heating with carbon. Use the data: ZnO(s) → Zn(s) + ½ O₂(g), ΔG° = +318.3 kJ; C(s) + ½ O₂(g) → CO(g), ΔG° = −137.2 kJ; CO(g) + ½ O₂(g) → CO₂(g), ΔG° = −257.2 kJ.

