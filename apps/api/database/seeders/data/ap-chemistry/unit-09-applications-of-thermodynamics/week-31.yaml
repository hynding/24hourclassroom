      answer: |
        (a) Oxidation Ni(s) → Ni²⁺(aq) + 2 e⁻; reduction 2 Ag⁺(aq) + 2 e⁻ → 2 Ag(s) (silver half-reaction doubled so the electrons cancel); overall Ni(s) + 2 Ag⁺(aq) → Ni²⁺(aq) + 2 Ag(s).
        (b) Nickel is the anode (negative in a galvanic cell), silver is the cathode (positive); electrons flow through the wire from Ni to Ag.
        (c) The nickel electrode loses mass and [Ni²⁺] increases; the silver electrode gains mass as Ag plates on and [Ag⁺] decreases.
        (d) The salt bridge completes the circuit and keeps each compartment electrically neutral without mixing the solutions; NO₃⁻ migrates toward the anode (nickel) compartment to offset the Ni²⁺ being made, and K⁺ migrates toward the cathode (silver) compartment to replace the Ag⁺ being removed.
        (e) Ni(s) | Ni²⁺(aq, 1.0 M) || Ag⁺(aq, 1.0 M) | Ag(s), anode on the left.
