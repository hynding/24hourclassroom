    # ---- Short answer
    - slug: apchem-u09-w30-q21
      type: short_answer
      topic_code: "9.3"
      source: "general knowledge"
      points: 3
      prompt: |
        For CaCO₃(s) → CaO(s) + CO₂(g), ΔH° = +178.3 kJ/mol and ΔS° = +160.5 J/(mol·K).
        (a) Calculate ΔG° at 298 K and state whether the decomposition is thermodynamically favourable at room temperature.
        (b) Calculate the temperature above which the decomposition becomes favourable (assume ΔH° and ΔS° are independent of temperature).
        (c) Explain, in terms of the two terms of ΔG°, why limestone must be heated strongly in a kiln to make lime.
      answer: |
        (a) ΔG° = 178.3 − 298(0.1605) = 178.3 − 47.8 = +130.5 kJ/mol. Positive: not favourable at 298 K (limestone is stable).
        (b) ΔG° = 0 at T = ΔH°/ΔS° = 178,300/160.5 = 1,111 K (about 840 °C); above this ΔG° < 0.
        (c) The reaction is strongly endothermic (ΔH° > 0 opposes it) but creates a mole of gas (ΔS° > 0 favours it). At low temperature the enthalpy term dominates and ΔG° is positive; only when T is large enough for TΔS° to exceed ΔH° does ΔG° become negative. Heating also provides the energy the endothermic reaction absorbs and raises the rate.
      explanation: |
        Three points.

        (a) 1 pt: ΔG° = +130.5 kJ/mol (accept 130–131) with units converted, and 'not favourable'.
        (b) 1 pt: T ≈ 1,110 K (accept 1,100–1,115 K).
        (c) 1 pt: the +/+ sign case explained: TΔS° must outgrow ΔH°.

    - slug: apchem-u09-w30-q22
      type: short_answer
      topic_code: "5.6"
      source: "general knowledge"
      points: 3
      prompt: |
        The reaction 2 H₂(g) + O₂(g) → 2 H₂O(g) has ΔH° = −483.6 kJ and ΔG° = −457 kJ at 298 K, yet a mixture of hydrogen and oxygen can be stored for years without reacting. A spark sets off an explosion.
        (a) Describe the energy profile (reaction coordinate diagram) for this reaction, giving the relative positions of reactants, products and the transition state.
        (b) Explain why the mixture does not react at room temperature, naming the factor that controls the behaviour.
        (c) Explain what the spark does and why the reaction then continues on its own.
      answer: |
        (a) Reactants on the left at a higher energy than products on the right (the drop is ΔH = −483.6 kJ, exothermic); between them a large hump whose top is the transition state, with the forward activation energy Ea the height from the reactants to the top (large, since H–H and O=O bonds must be broken) and the reverse Ea larger still by 483.6 kJ.
        (b) The reaction is thermodynamically favourable (ΔG° ≪ 0) but under kinetic control: at 298 K almost no collisions have energy equal to the large Ea, so the rate is effectively zero.
        (c) The spark supplies enough energy locally for some molecules to cross the barrier. Their reaction releases 483.6 kJ per 2 mol H₂, heating the surrounding gas so that many more molecules exceed Ea; the process accelerates itself (a chain of heat release) until the mixture is consumed. The spark changes neither ΔH° nor ΔG°.
      explanation: |
        Three points.

        (a) 1 pt: exothermic profile with a large barrier; transition state at the top; Ea defined.
        (b) 1 pt: favourable thermodynamically but kinetically slow because of Ea (both factors named).
        (c) 1 pt: spark provides activation energy; heat released sustains the reaction; ΔG° unchanged.

    # ---- Long answer
    - slug: apchem-u09-w30-q23
      type: long_answer
      topic_code: "9.3"
      source: "general knowledge"
      points: 6
      prompt: |
        The contact process oxidises sulfur dioxide: 2 SO₂(g) + O₂(g) → 2 SO₃(g), ΔH° = −197.8 kJ/mol. Standard molar entropies in J/(mol·K): SO₂(g) 248.2; O₂(g) 205.2; SO₃(g) 256.8.
        (a) Predict the sign of ΔS° from the equation and explain your reasoning.
        (b) Calculate ΔS°.
        (c) Calculate ΔG° at 298 K and state whether the reaction is thermodynamically favourable at that temperature.
        (d) Calculate the temperature at which ΔG° = 0, and ΔG° at 1,200 K.
        (e) Industrial plants run the reaction at about 700 K over a vanadium(V) oxide catalyst rather than at 298 K. Explain why, using both thermodynamic and kinetic reasoning.
        (f) Explain why the catalyst does not change the equilibrium yield of SO₃ at a given temperature.
      answer: |
        (a) Negative: three moles of gas become two, so the matter is less dispersed.
        (b) ΔS° = 2(256.8) − [2(248.2) + 205.2] = 513.6 − 701.6 = −188.0 J/(mol·K).
        (c) ΔG° = −197.8 − 298(−0.1880) = −197.8 + 56.0 = −141.8 kJ/mol. Strongly favourable at 298 K.
        (d) T = ΔH°/ΔS° = 197,800/188.0 = 1,052 K. At 1,200 K: ΔG° = −197.8 + 1,200(0.1880) = −197.8 + 225.6 = +27.8 kJ/mol (unfavourable).
        (e) Thermodynamically, lower temperature gives a more negative ΔG° and a larger K (the −/− case); but at 298 K the rate is negligible because the activation energy is high. Raising the temperature to 700 K speeds the reaction while ΔG° (−197.8 + 131.6 = −66.2 kJ/mol) is still clearly negative, and the catalyst lowers Ea so that a good rate is reached without going hotter, where the yield would fall. The choice balances rate (kinetics) against yield (thermodynamics).
        (f) A catalyst lowers the activation energy of the forward and reverse reactions equally; it changes neither ΔG° nor K, so the equilibrium composition at 700 K is the same with or without it. It only shortens the time needed to reach that composition.
      explanation: |
        Six points.

        (a) 1 pt: negative, justified by the decrease in gas moles.
        (b) 1 pt: −188.0 J/(mol·K) (accept −188 ± 1).
        (c) 1 pt: −141.8 kJ/mol (accept −141 to −142) and favourable.
        (d) 1 pt: T ≈ 1,050 K and ΔG°(1,200 K) ≈ +28 kJ/mol.
        (e) 1 pt: rate versus yield compromise with both factors named.
        (f) 1 pt: catalyst lowers Ea both ways, no change in ΔG° or K.
