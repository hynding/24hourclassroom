week: 30
unit: 9
title: "Entropy, Free Energy and Thermodynamic Favourability"
topics: ["9.1", "9.2", "9.3", "9.4"]
guide: guides/week-30.md
guide_description: |
  Entropy as the dispersal of matter and energy, with the rules for predicting the sign of ΔS (gas moles,
  phase, dissolving, temperature, complexity) and the entropy of the surroundings; absolute entropies from
  the third law and ΔS° = Σ S°(products) − Σ S°(reactants), including phase changes at their transition
  temperature; Gibbs free energy, ΔG° = ΔH° − TΔS°, the four sign cases, the crossover temperature and
  ΔG°f; and the distinction between thermodynamic favourability and rate. Worked examples for ammonia
  synthesis, hydrogen peroxide, methane combustion, N₂O₄ and diamond.
flashcards_description: |
  29 cards on the meaning and sign of entropy, calculating ΔS° and ΔG°, the sign cases and crossover
  temperature, and thermodynamic versus kinetic control.

flashcards:
  - front: Entropy → definition in terms of dispersal
    back: |
      A state function measuring how dispersed a system's matter and energy are: the more accessible arrangements of particles and energy, the higher S. Units J/(mol·K).
    topic_code: "9.1"
  - front: Second law of thermodynamics → statement
    back: |
      The entropy of the universe (system + surroundings) increases in every process that actually occurs; at equilibrium it is at a maximum.
    topic_code: "9.1"
  - front: Dominant rule for the sign of ΔS of a reaction
    back: |
      Count moles of gas: more gas moles on the product side means ΔS > 0; fewer means ΔS < 0. CaCO₃(s) → CaO(s) + CO₂(g) is positive; N₂ + 3 H₂ → 2 NH₃ is negative.
    topic_code: "9.1"
  - front: Entropy and phase
    back: |
      S(solid) < S(liquid) ≪ S(gas). Melting, vaporising and subliming raise entropy; freezing and condensing lower it.
    topic_code: "9.1"
  - front: Entropy and dissolving
    back: |
      A solid or liquid dissolving usually raises S (particles spread through the solvent), unless small, highly charged ions order the water strongly. A gas dissolving lowers S.
    topic_code: "9.1"
  - front: Entropy and temperature
    back: |
      Heating raises entropy: more energy can be shared in more ways among translational, rotational and vibrational motions. Cooling lowers it.
    topic_code: "9.1"
  - front: Entropy and molecular complexity
    back: |
      For the same phase, larger molecules with more atoms and bonds have more vibrational modes and higher S°: CH₄ < C₂H₆ < C₃H₈; CO(g) < CO₂(g). The gas-mole rule overrides this when gas counts differ.
    topic_code: "9.1"
  - front: Entropy change of the surroundings
    back: |
      ΔS(surr) = −ΔH(sys)/T. An exothermic reaction heats the surroundings and raises their entropy, which is why exothermic reactions with ΔS(sys) < 0 can still be favourable.
    topic_code: "9.1"
  - front: Third law of thermodynamics
    back: |
      A perfect crystal at 0 K has zero entropy. This gives every substance an absolute standard molar entropy S° (tabulated at 298 K), unlike enthalpy, which has only relative values.
    topic_code: "9.2"
  - front: S° of elements versus ΔH°f of elements
    back: |
      Elements in their standard state have ΔH°f = 0 and ΔG°f = 0 but non-zero S°: H₂(g) 130.7, N₂(g) 191.6, O₂(g) 205.2, C(graphite) 5.7 J/(mol·K). Never set S°(element) = 0.
    topic_code: "9.2"
  - front: Formula for ΔS° of a reaction
    back: |
      ΔS° = Σ n S°(products) − Σ n S°(reactants), with coefficients as multipliers, in J/(mol·K). Convert to kJ/(mol·K) before combining with ΔH°.
    topic_code: "9.2"
  - front: "Worked ΔS° for N₂ + 3 H₂ → 2 NH₃"
    back: |
      2(192.8) − [191.6 + 3(130.7)] = 385.6 − 583.7 = −198.1 J/(mol·K). About −100 J/K per mole of gas lost is typical.
    topic_code: "9.2"
  - front: "Worked ΔS° for 2 H₂O₂(l) → 2 H₂O(l) + O₂(g)"
    back: |
      [2(69.9) + 205.2] − 2(109.6) = 345.0 − 219.2 = +125.8 J/(mol·K): one mole of gas is created.
    topic_code: "9.2"
  - front: ΔS of a phase change at its transition temperature
    back: |
      At the normal melting or boiling point the phases are in equilibrium, ΔG = 0, so ΔS = ΔH/T. Ice: 6,010/273 = 22.0 J/(mol·K); water boiling: 40,700/373 = 109 J/(mol·K).
    topic_code: "9.2"
  - front: Gibbs free energy → definition and criterion
    back: |
      G = H − TS. At constant T and P, ΔG = ΔH − TΔS; ΔG < 0 means thermodynamically favourable, ΔG > 0 unfavourable as written, ΔG = 0 at equilibrium. ΔG = −TΔS(universe).
    topic_code: "9.3"
  - front: Units trap in ΔG° = ΔH° − TΔS°
    back: |
      ΔH° is usually in kJ/mol and ΔS° in J/(mol·K); divide ΔS° by 1,000 before multiplying by T in kelvin. Forgetting this gives absurd ΔG° values in the tens of thousands.
    topic_code: "9.3"
  - front: "Worked ΔG° for ammonia synthesis at 298 K and 700 K"
    back: |
      ΔH° = −92.2 kJ, ΔS° = −198.1 J/K. 298 K: −92.2 + 59.0 = −33.2 kJ (favourable). 700 K: −92.2 + 138.7 = +46.5 kJ (unfavourable). Crossover T = ΔH°/ΔS° = 465 K.
    topic_code: "9.3"
  - front: The four sign cases of ΔH° and ΔS°
    back: |
      −/+: favourable at all T. +/−: never favourable. −/−: favourable below T = ΔH°/ΔS° (low T). +/+: favourable above T = ΔH°/ΔS° (high T).
    topic_code: "9.3"
  - front: Crossover temperature
    back: |
      The temperature at which ΔG° = 0: T = ΔH°/ΔS° (both in the same units). Below it the sign of ΔH° decides; above it the sign of ΔS° decides.
    topic_code: "9.3"
  - front: ΔG° from free energies of formation
    back: |
      ΔG° = Σ n ΔG°f(products) − Σ n ΔG°f(reactants); ΔG°f = 0 for elements in their standard state. CH₄ combustion: [−394.4 + 2(−237.1)] − (−50.5) = −818.1 kJ/mol.
    topic_code: "9.3"
  - front: Meaning of 'thermodynamically favourable'
    back: |
      ΔG° < 0 and K > 1: products are favoured at equilibrium under standard conditions. It says nothing about rate, and it does not mean the reaction goes to completion (K could be 2).
    topic_code: "9.3"
  - front: A positive ΔG° does not mean nothing happens
    back: |
      ΔG° > 0 means K < 1; the reaction still proceeds forward from pure reactants until Q = K, just not very far. N₂O₄ → 2 NO₂ has ΔG° = +4.8 kJ at 298 K, yet a flask of N₂O₄ turns visibly brown.
    topic_code: "9.3"
  - front: "Worked N₂O₄(g) → 2 NO₂(g) at 298 K"
    back: |
      ΔH° = +57.2 kJ, ΔS° = +175.8 J/K: ΔG° = 57.2 − 52.4 = +4.8 kJ/mol (not favourable; K ≈ 0.14). Favourable above T = 57,200/175.8 = 325 K.
    topic_code: "9.3"
  - front: ΔG° versus ΔG
    back: |
      ΔG° refers to standard conditions (1 M, 1 atm). Under other conditions ΔG = ΔG° + RT ln Q, which falls to zero at equilibrium (Q = K). Week 31 develops this.
    topic_code: "9.3"
  - front: Thermodynamic versus kinetic control → distinction
    back: |
      ΔG° says where the reaction wants to go; the activation energy says how fast it gets there. A favourable reaction with a large Ea may be imperceptibly slow: kinetically controlled.
    topic_code: "9.4"
  - front: Diamond and graphite as a kinetic-control example
    back: |
      C(diamond) → C(graphite) has ΔG° = −2.9 kJ/mol, so diamond is thermodynamically unstable; but rearranging the covalent network has an enormous Ea, so diamonds persist. Kinetically stable, thermodynamically unstable.
    topic_code: "9.4"
  - front: Fuels in air as a kinetic-control example
    back: |
      Methane, octane and hydrogen have combustion ΔG° of hundreds to thousands of kJ negative yet sit in air indefinitely; breaking the first bonds needs an activation energy that a spark or flame supplies.
    topic_code: "9.4"
  - front: What a catalyst does and does not change
    back: |
      A catalyst lowers Ea and speeds a reaction that is already favourable (MnO₂ on H₂O₂, ΔG° = −233 kJ/mol); it cannot change ΔG°, K or the equilibrium composition, and it cannot make an unfavourable reaction favourable.
    topic_code: "9.4"
  - front: Exam phrasing for a slow favourable reaction
    back: |
      'The reaction is thermodynamically favourable (ΔG° < 0) but has a large activation energy, so at this temperature it is kinetically slow.' Name both the thermodynamic and the kinetic factor.
    topic_code: "9.4"

quiz:
  description: |
    23 questions · about 45 minutes · topics 9.1–9.4 (entropy and its sign, absolute entropies and ΔS°,
    Gibbs free energy and thermodynamic favourability, and thermodynamic versus kinetic control), with review
    of kinetic molecular theory, energy profiles and catalysts, phase-change enthalpies, enthalpies of
    formation, the temperature dependence of K and the free energy of dissolution. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: entropy table and the Haber process (9.2, 9.3)
    - slug: apchem-u09-w30-q01
      type: multiple_choice
      topic_code: "9.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table: standard molar entropies at 298 K in J/(mol·K): N₂(g) 191.6; H₂(g) 130.7; NH₃(g) 192.8; O₂(g) 205.2; NO(g) 210.8; NO₂(g) 240.1. For N₂(g) + 3 H₂(g) → 2 NH₃(g), ΔH° = −92.2 kJ/mol.
      prompt: |
        What is ΔS° for N₂(g) + 3 H₂(g) → 2 NH₃(g)?
      options:
        - "−129.5 J/(mol·K)"
        - "−198.1 J/(mol·K)"
        - "+198.1 J/(mol·K)"
        - "−62.1 J/(mol·K)"
      option_explanations:
        - |
          −129.5 J/(mol·K) uses one mole each of N₂ and H₂; the coefficients must multiply the S° values.
        - |
          Correct. ΔS° = 2(192.8) − [191.6 + 3(130.7)] = 385.6 − 583.7 = −198.1 J/(mol·K), negative because 4 mol of gas become 2.
        - |
          The sign is reversed; products minus reactants gives a negative value, as the loss of gas moles requires.
        - |
          −62.1 J/(mol·K) omits the factor of 2 on NH₃ and the factor of 3 on H₂.
      answer: 1
      explanation: |
        Practice 5. Products minus reactants, each weighted by its coefficient.

    - slug: apchem-u09-w30-q02
      type: multiple_choice
      topic_code: "9.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table: standard molar entropies at 298 K in J/(mol·K): N₂(g) 191.6; H₂(g) 130.7; NH₃(g) 192.8; O₂(g) 205.2; NO(g) 210.8; NO₂(g) 240.1. For N₂(g) + 3 H₂(g) → 2 NH₃(g), ΔH° = −92.2 kJ/mol.
      prompt: |
        Which statement about the thermodynamic favourability of ammonia synthesis is correct?
      options:
        - "It is favourable at all temperatures, because ΔH° is negative."
        - "It is never favourable, because ΔS° is negative."
        - "It is favourable only at high temperatures, where the TΔS° term dominates."
        - "It is favourable only at low temperatures, because ΔH° < 0 and ΔS° < 0 make ΔG° negative only below T = ΔH°/ΔS°."
      option_explanations:
        - |
          A negative ΔH° alone does not guarantee favourability; the −TΔS° term is positive here and grows with temperature.
        - |
          A negative ΔS° does not forbid the reaction; at low enough temperature the enthalpy term wins.
        - |
          With ΔS° < 0, raising the temperature makes −TΔS° more positive and the reaction less favourable, not more.
        - |
          Correct. ΔG° = ΔH° − TΔS° = −92.2 + 0.1981T (kJ): negative at 298 K (−33.2 kJ) and zero at 465 K; above that it is positive.
      answer: 3
      explanation: |
        Practice 6. The −/− case: favourable below the crossover temperature.

    - slug: apchem-u09-w30-q03
      type: numeric
      topic_code: "9.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        Table: standard molar entropies at 298 K in J/(mol·K): N₂(g) 191.6; H₂(g) 130.7; NH₃(g) 192.8; O₂(g) 205.2; NO(g) 210.8; NO₂(g) 240.1. For N₂(g) + 3 H₂(g) → 2 NH₃(g), ΔH° = −92.2 kJ/mol.
      prompt: |
        Assuming ΔH° and ΔS° do not change with temperature, calculate the temperature in kelvin at which ΔG° = 0 for ammonia synthesis. Give your answer to three significant figures.
      answer: { value: 465, tolerance: 5 }
      explanation: |
        ΔG° = 0 when T = ΔH°/ΔS° = (−92,200 J/mol)/(−198.1 J/(mol·K)) = 465 K. Below 465 K the reaction is favourable; above it, the reverse is. Industry runs at about 700 K anyway for the sake of rate and uses high pressure to recover yield.

    # ---- Stand-alone multiple choice
    - slug: apchem-u09-w30-q04
      type: multiple_choice
      topic_code: "9.1"
      source: "general knowledge"
      points: 1
      prompt: |
        For which process is ΔS(system) most clearly positive?
      options:
        - "CaCO₃(s) → CaO(s) + CO₂(g)"
        - "2 SO₂(g) + O₂(g) → 2 SO₃(g)"
        - "H₂O(g) → H₂O(l)"
        - "Ag⁺(aq) + Cl⁻(aq) → AgCl(s)"
      option_explanations:
        - |
          Correct. A mole of gas is produced from solids only; the matter becomes far more dispersed, so ΔS is large and positive (about +160 J/K).
        - |
          Three moles of gas become two: entropy decreases.
        - |
          Condensation converts a gas to a liquid: entropy decreases.
        - |
          Dispersed ions combine into an ordered solid: entropy decreases.
      answer: 0
      explanation: |
        Practice 4. Creating gas from condensed phases is the surest sign of ΔS > 0.

    - slug: apchem-u09-w30-q05
      type: multiple_choice
      topic_code: "9.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Liquid water at −5 °C freezes. Which statement about the entropy changes is correct?
      options:
        - "ΔS(system) > 0 and ΔS(surroundings) < 0; the process is favourable because the system's entropy increases."
        - "ΔS(system) = 0, because freezing is a physical change."
        - "ΔS(system) < 0, but ΔS(surroundings) > 0 by a larger amount because freezing releases heat, so ΔS(universe) > 0."
        - "ΔS(system) < 0 and ΔS(surroundings) < 0; freezing is never favourable."
      option_explanations:
        - |
          The system becomes more ordered (liquid to solid), so its entropy falls.
        - |
          Physical changes have entropy changes too; a solid has fewer accessible arrangements than a liquid.
        - |
          Correct. ΔS(sys) ≈ −22 J/(mol·K), but the 6.0 kJ/mol released warms the surroundings: ΔS(surr) = +6,010/268 = +22.4 J/(mol·K), larger in magnitude below 0 °C, so the total is positive and freezing is favourable.
        - |
          Freezing is favourable below 0 °C; the heat released raises the entropy of the surroundings.
      answer: 2
      explanation: |
        Practice 6. Exothermic processes raise the entropy of the surroundings by −ΔH/T.

    - slug: apchem-u09-w30-q06
      type: multiple_choice
      topic_code: "9.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement about standard molar entropies is correct?
      options:
        - "S° of an element in its standard state is zero, like ΔH°f."
        - "S° of an element in its standard state is not zero; S° is an absolute quantity, zero only for a perfect crystal at 0 K."
        - "S° values are always negative for solids."
        - "S° of a gas is lower than that of the same substance as a liquid."
      option_explanations:
        - |
          Only ΔH°f and ΔG°f are defined to be zero for elements; S°(O₂, g) = 205.2 J/(mol·K).
        - |
          Correct. The third law fixes an absolute zero of entropy, so every substance above 0 K has a positive S°, elements included.
        - |
          S° values are positive for all substances above 0 K; solids simply have small values (graphite 5.7 J/(mol·K)).
        - |
          The gas always has the higher entropy: H₂O(g) 188.8 versus H₂O(l) 69.9 J/(mol·K).
      answer: 1
      explanation: |
        Practice 6. Entropy has an absolute scale; enthalpy does not.

    - slug: apchem-u09-w30-q07
      type: multiple_choice
      topic_code: "9.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Ice melts at 273 K with ΔH°fus = 6.01 kJ/mol. What is ΔS° for the melting of one mole of ice at 273 K?
      options:
        - "+6.01 J/(mol·K)"
        - "−22.0 J/(mol·K)"
        - "+1,640 J/(mol·K)"
        - "+22.0 J/(mol·K)"
      option_explanations:
        - |
          6.01 is ΔH° in kJ/mol; it must be divided by the temperature to give an entropy change.
        - |
          Melting increases disorder, so ΔS must be positive.
        - |
          1,640 results from multiplying by T instead of dividing.
        - |
          Correct. At the melting point the two phases are in equilibrium, ΔG = 0, so ΔS = ΔH/T = 6,010 J/mol ÷ 273 K = +22.0 J/(mol·K).
      answer: 3
      explanation: |
        Practice 5. For a phase change at its transition temperature, ΔS = ΔH/T.

    - slug: apchem-u09-w30-q08
      type: multiple_choice
      topic_code: "9.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Using ΔG°f values (kJ/mol): CH₄(g) −50.5; CO₂(g) −394.4; H₂O(l) −237.1; O₂(g) 0. What is ΔG° for CH₄(g) + 2 O₂(g) → CO₂(g) + 2 H₂O(l)?
      options:
        - "−581.0 kJ/mol"
        - "−682.0 kJ/mol"
        - "−818.1 kJ/mol"
        - "−919.1 kJ/mol"
      option_explanations:
        - |
          −581.0 kJ/mol counts only one mole of water.
        - |
          −682.0 kJ/mol omits the subtraction of the methane term.
        - |
          Correct. ΔG° = [−394.4 + 2(−237.1)] − [−50.5 + 0] = −868.6 + 50.5 = −818.1 kJ/mol.
        - |
          −919.1 kJ/mol adds the methane term instead of subtracting it.
      answer: 2
      explanation: |
        Practice 5. Products minus reactants, elements at zero.

    - slug: apchem-u09-w30-q09
      type: multiple_choice
      topic_code: "9.3"
      source: "general knowledge"
      points: 1
      prompt: |
        For 3 O₂(g) → 2 O₃(g), ΔH° = +285 kJ/mol and ΔS° = −137 J/(mol·K). Which conclusion is correct?
      options:
        - "The reaction is not thermodynamically favourable at any temperature, because both terms make ΔG° positive."
        - "The reaction becomes favourable above about 2,080 K."
        - "The reaction is favourable at low temperatures, where the entropy term is small."
        - "The reaction is favourable at 298 K because ozone exists in the atmosphere."
      option_explanations:
        - |
          Correct. ΔG° = ΔH° − TΔS° = 285 + 0.137T, positive for every positive T; the reverse reaction (ozone decomposing) is favourable at all temperatures.
        - |
          285/0.137 = 2,080 K is where the two terms are equal in magnitude, but with ΔS° negative they add rather than cancel; ΔG° only grows with T.
        - |
          At low T, ΔG° ≈ ΔH° = +285 kJ, still positive.
        - |
          Atmospheric ozone is produced by ultraviolet light, a non-thermodynamic input, and it decomposes continually; its presence does not mean ΔG° < 0.
      answer: 0
      explanation: |
        Practice 6. The +/− case is never favourable.

    - slug: apchem-u09-w30-q10
      type: multiple_choice
      topic_code: "9.4"
      source: "general knowledge"
      points: 1
      prompt: |
        The conversion C(diamond) → C(graphite) has ΔG° = −2.9 kJ/mol at 298 K, yet diamonds do not visibly change over centuries. Which explanation is correct?
      options:
        - "The reaction is thermodynamically unfavourable at room temperature."
        - "The reaction is thermodynamically favourable but has a very large activation energy, so its rate is negligible: diamond is kinetically stable."
        - "Diamond is the more stable form of carbon, so ΔG° must have been measured wrongly."
        - "Diamond and graphite are at equilibrium, so no net change occurs."
      option_explanations:
        - |
          ΔG° < 0 means it is favourable; the problem is rate, not thermodynamics.
        - |
          Correct. Converting the three-dimensional covalent network of diamond into graphite's layers requires breaking many C–C bonds at once; the enormous Ea makes the favourable process immeasurably slow at ordinary temperatures.
        - |
          Graphite is the thermodynamically stable form at 1 atm; diamond's persistence is kinetic.
        - |
          Equilibrium would require ΔG = 0; with ΔG° = −2.9 kJ/mol the mixture is not at equilibrium, it is simply not moving toward it.
      answer: 1
      explanation: |
        Practice 6. Favourable does not mean fast.

    - slug: apchem-u09-w30-q11
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Heating a gas at constant volume increases its entropy. Which description from kinetic molecular theory explains this?
      options:
        - "The molecules move faster, and the Maxwell–Boltzmann distribution of speeds broadens, so the energy can be shared among the molecules in many more ways."
        - "The molecules get larger, taking up more positions in the container."
        - "The number of molecules increases as the gas expands."
        - "The average kinetic energy stays the same but the pressure rises."
      option_explanations:
        - |
          Correct. At higher temperature the distribution of molecular speeds is wider and shifted to higher values; with more energy states accessible, the number of arrangements of energy, and so S, increases.
        - |
          Molecular size does not change with temperature.
        - |
          At constant volume in a closed container the number of molecules is fixed.
        - |
          The average kinetic energy is proportional to temperature and rises on heating; the pressure rises because of that.
      answer: 0
      explanation: |
        Practice 6 (review of 3.5). A broader speed distribution means more ways to distribute energy.

    # ---- Multi-select
    - slug: apchem-u09-w30-q12
      type: multi_select
      topic_code: "9.1"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        For which of the following processes is ΔS(system) positive? Select all that apply.
      options:
        - "Dry ice subliming: CO₂(s) → CO₂(g)"
        - "2 NH₃(g) → N₂(g) + 3 H₂(g)"
        - "Water vapour condensing on a cold window"
        - "KNO₃(s) dissolving in water"
        - "2 H₂(g) + O₂(g) → 2 H₂O(l)"
        - "Heating a block of copper from 20 °C to 80 °C"
      option_explanations:
        - |
          Correct. A solid becomes a gas; the matter is vastly more dispersed.
        - |
          Correct. Two moles of gas become four, so the matter is more dispersed and ΔS is positive.
        - |
          Condensation converts a gas to a liquid, lowering the entropy of the water.
        - |
          Correct. Ions leave an ordered lattice and spread through the solvent (and KNO₃'s ΔS°soln is large and positive).
        - |
          Three moles of gas become a liquid; a large decrease.
        - |
          Correct. Heating raises entropy as more energy is distributed among the atoms' vibrations.
      answer: [0, 1, 3, 5]
      explanation: |
        Practice 4. Gas formation, dissolving and heating raise entropy; condensation and gas consumption lower it.

    - slug: apchem-u09-w30-q13
      type: multi_select
      topic_code: "5.11"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Hydrogen peroxide decomposes, 2 H₂O₂(aq) → 2 H₂O(l) + O₂(g), with ΔG° = −233 kJ/mol, slowly in a bottle but rapidly when MnO₂ is added. Which statements are correct? Select all that apply.
      options:
        - "MnO₂ lowers the activation energy by providing an alternative pathway."
        - "MnO₂ makes ΔG° more negative."
        - "The reaction is thermodynamically favourable with or without MnO₂."
        - "MnO₂ is consumed as the peroxide decomposes."
        - "Without the catalyst the reaction is under kinetic control: slow despite being favourable."
      option_explanations:
        - |
          Correct. That is what a catalyst does; both forward and reverse barriers fall by the same amount.
        - |
          A catalyst never changes ΔG°, ΔH°, ΔS° or K; it changes only the rate.
        - |
          Correct. ΔG° = −233 kJ/mol regardless of the catalyst; the catalyst only lets the system reach the favoured state faster.
        - |
          A catalyst is regenerated; the same MnO₂ can decompose any amount of peroxide.
        - |
          Correct. The large negative ΔG° shows favourability; the slowness shows a high activation energy.
      answer: [0, 2, 4]
      explanation: |
        Practice 6 (review of 5.11). Catalysts act on kinetics, never on thermodynamics.

    # ---- True / false
    - slug: apchem-u09-w30-q14
      type: true_false
      topic_code: "9.4"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: a reaction with a large negative ΔG° must proceed rapidly once the reactants are mixed.
      answer: false
      explanation: |
        False. ΔG° describes the position of equilibrium (K ≫ 1), not the rate. A mixture of H₂ and O₂ (ΔG° = −474 kJ) or methane and air (−818 kJ) persists indefinitely at room temperature because the activation energy is large; rate is set by Ea and temperature, not by ΔG°.

    - slug: apchem-u09-w30-q15
      type: true_false
