      points: 1
      prompt: |
        True or false: for a given substance, the enthalpy of vaporisation is larger than the enthalpy of fusion, and so is the entropy of vaporisation compared with the entropy of fusion.
      answer: true
      explanation: |
        True. Vaporisation separates the molecules completely, overcoming all intermolecular attractions (water: 40.7 versus 6.01 kJ/mol), and a gas is far more dispersed than a liquid, so ΔS°vap (109 J/(mol·K) for water at 373 K) exceeds ΔS°fus (22.0 J/(mol·K) at 273 K).

    # ---- Fill in the blank
    - slug: apchem-u09-w30-q16
      type: fill_blank
      topic_code: "7.14"
      source: "general knowledge"
      points: 1
      prompt: |
        Because ΔG° = −RT ln K, a process with a positive ΔG°, such as the dissolution of a sparingly soluble salt, has an equilibrium constant that is ____ than 1.
      answer: ["less", "smaller", "lower", "less than 1", "smaller than 1"]
      explanation: |
        A positive ΔG° makes ln K negative, so K < 1: reactants are favoured at equilibrium. The reaction still proceeds a little from pure reactants (until Q = K), which is why 'unfavourable' is not 'impossible'. Week 31 develops this relation.

    - slug: apchem-u09-w30-q17
      type: fill_blank
      topic_code: "7.9"
      source: "general knowledge"
      points: 1
      prompt: |
        For an exothermic reaction, the equilibrium constant K ____ as the temperature is raised, which is consistent with ΔG° = ΔH° − TΔS° becoming less negative when ΔS° is negative.
      answer: ["decreases", "falls", "gets smaller", "becomes smaller", "drops", "goes down"]
      explanation: |
        Heat behaves as a product of an exothermic reaction, so heating shifts the equilibrium toward reactants and lowers K (Le Châtelier). Thermodynamically, ln K = −ΔG°/RT = −ΔH°/RT + ΔS°/R: with ΔH° < 0 the first term shrinks in magnitude as T grows, so K falls.

