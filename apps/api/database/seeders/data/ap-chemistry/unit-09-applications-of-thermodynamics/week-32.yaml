week: 32
unit: 9
title: Cell Potential, the Nernst Equation and Electrolysis
topics: ["9.8", "9.9", "9.10"]
guide: guides/week-32.md
guide_description: Standard cell potential from a table of reduction potentials, the links E° ↔ ΔG° ↔ K, the Nernst equation and concentration cells, and electrolysis with Faraday's law, with worked examples and a self-check.
flashcards_description: Twenty-nine cards on standard reduction potentials, E°cell, ΔG° = −nFE°, the Nernst equation, concentration cells, predicting electrolysis products and Faraday's-law calculations.
flashcards:
  - front: "Standard reduction potential E° → definition"
    back: The potential of a half-cell under standard conditions (1 M, 1 atm, 298 K) measured against the standard hydrogen electrode, which is defined as 0.00 V. Always tabulated for the reduction direction.
    topic_code: "9.8"
  - front: "Standard hydrogen electrode → role"
    back: The reference half-cell, 2 H⁺(aq, 1 M) + 2 e⁻ → H₂(g, 1 atm) on platinum, assigned E° = 0.00 V so every other half-cell potential can be measured relative to it.
    topic_code: "9.8"
  - front: "E°cell → formula from a reduction-potential table"
    back: E°cell = E°cathode − E°anode, with both values taken as listed (as reductions). The half-reaction with the higher E° is the cathode.
    topic_code: "9.8"
  - front: "Which half-reaction is the cathode in a galvanic cell?"
    back: The one with the more positive (higher) standard reduction potential; it runs as a reduction. The other runs backwards as the oxidation at the anode.
    topic_code: "9.8"
  - front: "Doubling a half-reaction → effect on its E°"
    back: None. E° is intensive (a free energy per electron); scaling a half-reaction scales both the energy and the electrons. Only n changes.
    topic_code: "9.8"
  - front: "ΔG° = −nFE° → meaning of each symbol"
    back: n = moles of electrons transferred in the balanced equation; F = 96,485 C/mol; E° in volts; ΔG° comes out in joules (1 V·C = 1 J).
    topic_code: "9.8"
  - front: "Faraday's constant F → value and meaning"
    back: 96,485 C/mol, the charge on one mole of electrons (Avogadro's number times the elementary charge).
    topic_code: "9.8"
  - front: "Sign of E°cell versus favourability"
    back: E° > 0 ⇔ ΔG° < 0 ⇔ K > 1 (favourable as written); E° < 0 ⇔ ΔG° > 0 ⇔ K < 1; E° = 0 ⇔ K = 1.
    topic_code: "9.8"
  - front: "E° → K relation"
    back: "nFE° = RT ln K, so ln K = nFE°/(RT); at 298 K, log K = nE°/0.0592. A cell potential of about 1 V corresponds to K of order 10³⁰ or more."
    topic_code: "9.8"
  - front: "Strongest oxidising agent in a reduction-potential table"
    back: "The species on the left of the half-reaction with the most positive E° (F₂ in a full table). Strongest reducing agent: the species on the right of the most negative one (Li)."
    topic_code: "9.8"
  - front: "Why is E°cell for Zn + Cu²⁺ equal to 1.10 V?"
    back: E°(Cu²⁺/Cu) = +0.34 V is the cathode, E°(Zn²⁺/Zn) = −0.76 V the anode; 0.34 − (−0.76) = 1.10 V.
    topic_code: "9.8"
  - front: "ΔG° for the Zn/Cu cell reaction"
    back: −nFE° = −(2)(96,485)(1.10) = −212,000 J = −212 kJ per mole of reaction.
    topic_code: "9.8"
  - front: "Nernst equation → form on the equations sheet"
    back: E = E° − (RT/nF) ln Q. At 298 K this is E = E° − (0.0257/n) ln Q, or E = E° − (0.0592/n) log Q.
    topic_code: "9.9"
  - front: "Nernst equation → where it comes from"
    back: Substitute ΔG = −nFE and ΔG° = −nFE° into ΔG = ΔG° + RT ln Q and divide by −nF.
    topic_code: "9.9"
  - front: "Q < 1 in a galvanic cell → effect on E"
    back: ln Q is negative, so E > E°. Concentrated reactant ions and dilute product ions raise the voltage above the standard value.
    topic_code: "9.9"
  - front: "Voltage of a galvanic cell as it discharges"
    back: Reactant ions are used up and product ions build up, Q rises, E falls, and E reaches zero when Q = K. A dead battery is a cell at equilibrium.
    topic_code: "9.9"
  - front: "E = 0 for a cell → what it means"
    back: "Q = K: the cell reaction is at equilibrium and no net reaction (and no current) can be drawn."
    topic_code: "9.9"
  - front: "Change in E per tenfold change in Q at 298 K"
    back: 0.0592/n volts (about 30 mV for n = 2). Concentration effects on voltage are real but modest.
    topic_code: "9.9"
  - front: "Concentration cell → definition and E°"
    back: Two half-cells of the same electrode and ion at different concentrations. E° = 0; E = −(0.0592/n) log([dilute]/[concentrated]) > 0 until the concentrations are equal.
    topic_code: "9.9"
  - front: "Concentration cell → which side is the anode?"
    back: The dilute side. Oxidation there makes more ions; reduction on the concentrated side removes them, so the two concentrations move toward each other.
    topic_code: "9.9"
  - front: "Species that appear in Q for a cell reaction"
    back: Aqueous ions and gases (as partial pressures). Solid electrodes and liquid water are omitted.
    topic_code: "9.9"
  - front: "Electrolytic cell → minimum applied voltage"
    back: Greater than the magnitude of the cell's negative potential (−E°, adjusted by the Nernst equation for the actual concentrations), plus any overpotential needed in practice.
    topic_code: "9.10"
  - front: "Which terminal of the power supply each electrolytic electrode is wired to"
    back: The anode (still oxidation) is wired to the positive terminal of the supply; the cathode (still reduction) to the negative terminal. The reverse of a galvanic cell's signs.
    topic_code: "9.10"
  - front: "Electrolysis of molten NaCl → products"
    back: Na(l) at the cathode (Na⁺ + e⁻ → Na) and Cl₂(g) at the anode (2 Cl⁻ → Cl₂ + 2 e⁻). No water present to compete.
    topic_code: "9.10"
  - front: "Electrolysis of aqueous NaCl → products"
    back: H₂(g) and OH⁻ at the cathode (water is reduced before Na⁺) and Cl₂(g) at the anode (chloride, because of O₂'s overpotential); the chlor-alkali process.
    topic_code: "9.10"
  - front: "Electrolysis of aqueous CuSO₄ with inert electrodes → products"
    back: Cu(s) at the cathode (Cu²⁺ is easier to reduce than water) and O₂(g) plus H⁺ at the anode (water is easier to oxidise than sulfate).
    topic_code: "9.10"
  - front: "Why aqueous Na⁺ cannot be reduced to sodium metal"
    back: Water's reduction potential (about −0.41 V at pH 7) is far above Na⁺/Na (−2.71 V), so water is reduced first and H₂ forms. Sodium is made only from the molten salt.
    topic_code: "9.10"
  - front: "Faraday's law → the conversion chain"
    back: I (A) × t (s) = q (C); q ÷ 96,485 = mol e⁻; × (mol substance per mol e⁻ from the half-reaction) = mol substance; × molar mass (or × 22.4 L/mol at STP).
    topic_code: "9.10"
  - front: "Mass of Cu from 2.00 A for 30.0 min"
    back: q = 3,600 C; 3,600/96,485 = 0.0373 mol e⁻; ÷ 2 = 0.0187 mol Cu; × 63.55 = 1.19 g.
    topic_code: "9.10"
quiz:
  description: |
    Twenty-three items on cell potential, the Nernst equation and electrolysis (topics 9.8–9.10), with review of redox (4.9), Q versus K (7.10), free energy and equilibrium (9.5) and cell anatomy (9.7). Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes. Constants: R = 8.314 J/(mol·K), F = 96,485 C/mol, RT/F = 0.0257 V at 298 K (0.0592 V with log₁₀).
  questions:
    - slug: apchem-u09-w32-q01
      type: multiple_choice
      topic_code: "9.8"
      source: "general knowledge"
      points: 1
      stimulus: |
        Standard reduction potentials at 298 K:

        | Half-reaction | E° (V) |
        |---|---|
        | Ag⁺(aq) + e⁻ → Ag(s) | +0.80 |
        | Cu²⁺(aq) + 2 e⁻ → Cu(s) | +0.34 |
        | 2 H⁺(aq) + 2 e⁻ → H₂(g) | 0.00 |
        | Ni²⁺(aq) + 2 e⁻ → Ni(s) | −0.25 |
        | Zn²⁺(aq) + 2 e⁻ → Zn(s) | −0.76 |
        | Al³⁺(aq) + 3 e⁻ → Al(s) | −1.66 |
      prompt: |
        Which species in the table is the strongest oxidising agent?
      options:
        - "Al(s), because its half-reaction has the most negative E°."
        - "Al³⁺(aq), because it carries the largest charge."
        - "Ag⁺(aq), because its half-reaction has the most positive E°."
        - "Ag(s), because silver is the least reactive metal listed."
      option_explanations:
        - |
          Al(s) is the strongest reducing agent: it is on the right of the most negative half-reaction, meaning it gives up electrons most readily.
        - |
          Charge alone says nothing about oxidising strength; Al³⁺ is in fact very hard to reduce (−1.66 V).
        - |
          Correct. The oxidising agent is the species being reduced (on the left), and the most positive E° marks the greatest tendency to be reduced.
        - |
          Ag(s) is the reduced form; it is a weak reducing agent, not an oxidising agent at all.
      answer: 2
      explanation: |
        Practice 4. Top-left of the table = strongest oxidising agent; bottom-right = strongest reducing agent.
    - slug: apchem-u09-w32-q02
      type: multiple_choice
      topic_code: "9.8"
      source: "general knowledge"
      points: 1
      stimulus: |
        Standard reduction potentials at 298 K:

        | Half-reaction | E° (V) |
        |---|---|
        | Ag⁺(aq) + e⁻ → Ag(s) | +0.80 |
        | Cu²⁺(aq) + 2 e⁻ → Cu(s) | +0.34 |
        | 2 H⁺(aq) + 2 e⁻ → H₂(g) | 0.00 |
        | Ni²⁺(aq) + 2 e⁻ → Ni(s) | −0.25 |
        | Zn²⁺(aq) + 2 e⁻ → Zn(s) | −0.76 |
        | Al³⁺(aq) + 3 e⁻ → Al(s) | −1.66 |
      prompt: |
        A galvanic cell is built from the Al/Al³⁺ and Ag/Ag⁺ half-cells under standard conditions. What is E°cell, and what is n for the balanced overall reaction Al(s) + 3 Ag⁺(aq) → Al³⁺(aq) + 3 Ag(s)?
      options:
        - "E°cell = 0.86 V; n = 3"
        - "E°cell = 2.46 V; n = 3"
        - "E°cell = 4.06 V; n = 3, because the silver half-reaction is tripled"
        - "E°cell = 2.46 V; n = 4"
      option_explanations:
        - |
          0.86 V is 0.80 + 0.06, which is not any combination of the table values; the correct subtraction is 0.80 − (−1.66).
        - |
          Correct. E°cell = E°cathode − E°anode = 0.80 − (−1.66) = 2.46 V; three electrons are transferred per aluminium atom, so n = 3.
        - |
          Tripling the silver half-reaction does not triple its potential; E° is intensive and stays +0.80 V.
        - |
          n is the moles of electrons in the balanced equation: Al loses three electrons and three Ag⁺ gain one each, so n = 3, not 4.
      answer: 1
      explanation: |
        Practice 5. Silver is the cathode (higher E°), aluminium the anode. Balance electrons (3 e⁻) to get n, but never scale E°.
    - slug: apchem-u09-w32-q03
      type: multiple_choice
      topic_code: "9.8"
      source: "general knowledge"
      points: 1
      stimulus: |
        Standard reduction potentials at 298 K:

        | Half-reaction | E° (V) |
        |---|---|
        | Ag⁺(aq) + e⁻ → Ag(s) | +0.80 |
        | Cu²⁺(aq) + 2 e⁻ → Cu(s) | +0.34 |
        | 2 H⁺(aq) + 2 e⁻ → H₂(g) | 0.00 |
        | Ni²⁺(aq) + 2 e⁻ → Ni(s) | −0.25 |
        | Zn²⁺(aq) + 2 e⁻ → Zn(s) | −0.76 |
        | Al³⁺(aq) + 3 e⁻ → Al(s) | −1.66 |
      prompt: |
        Which of the following reactions is NOT thermodynamically favourable under standard conditions?
      options:
        - "Zn(s) + Ni²⁺(aq) → Zn²⁺(aq) + Ni(s)"
        - "Ni(s) + 2 H⁺(aq) → Ni²⁺(aq) + H₂(g)"
        - "2 Al(s) + 3 Cu²⁺(aq) → 2 Al³⁺(aq) + 3 Cu(s)"
        - "Cu(s) + 2 H⁺(aq) → Cu²⁺(aq) + H₂(g)"
      option_explanations:
        - |
          E°cell = −0.25 − (−0.76) = +0.51 V: zinc is below nickel in the table, so zinc reduces Ni²⁺ favourably.
        - |
          E°cell = 0.00 − (−0.25) = +0.25 V: nickel is below hydrogen, so it dissolves in acid with evolution of H₂.
        - |
          E°cell = 0.34 − (−1.66) = +2.00 V: aluminium reduces Cu²⁺ very favourably.
        - |
          Correct. E°cell = 0.00 − 0.34 = −0.34 V. Copper lies above hydrogen in the table, so H⁺ cannot oxidise it; copper does not dissolve in non-oxidising acids.
      answer: 3
      explanation: |
        Practice 6. A reaction is favourable when the oxidising agent (left side of a half-reaction) lies above the reducing agent (right side) in the table, giving E°cell > 0.
    - slug: apchem-u09-w32-q04
      type: multiple_choice
      topic_code: "9.8"
      source: "general knowledge"
      points: 1
      prompt: |
        For Ag⁺(aq) + e⁻ → Ag(s), E° = +0.80 V. Which statement about the half-reaction 2 Ag⁺(aq) + 2 e⁻ → 2 Ag(s) is correct?
      options:
        - "Its E° is still +0.80 V, but ΔG° for it is twice as negative as for the one-electron version."
        - "Its E° is +1.60 V and its ΔG° is twice as negative."
        - "Its E° is +1.60 V but its ΔG° is unchanged."
        - "Both its E° and its ΔG° are unchanged, since the same chemistry is involved."
      option_explanations:
        - |
          Correct. E° is an intensive quantity (energy per electron) and does not change when the equation is scaled; ΔG° = −nFE° is extensive and doubles with n.
        - |
          Potentials are not multiplied when a half-reaction is multiplied; +1.60 V is the classic error.
        - |
          Neither half is right: E° stays at +0.80 V and ΔG° doubles.
        - |
          ΔG° is extensive; doubling the amount of reaction doubles the free-energy change even though E° is unchanged.
      answer: 0
      explanation: |
        Practice 6. Think of E° as "volts" and ΔG° as "joules": the voltage of a battery does not depend on its size, but the energy it stores does.
    - slug: apchem-u09-w32-q05
      type: multiple_choice
      topic_code: "9.8"
      source: "general knowledge"
      points: 1
      prompt: |
        For the cell reaction Pb(s) + Cu²⁺(aq) → Pb²⁺(aq) + Cu(s), E°cell = +0.47 V. Which pair of values is correct for ΔG° and K at 298 K?
      options:
        - "ΔG° = +90.7 kJ; K ≈ 10⁻¹⁶"
        - "ΔG° = −45.3 kJ; K ≈ 10⁸"
        - "ΔG° = −90.7 kJ; K ≈ 10⁻¹⁶"
        - "ΔG° = −90.7 kJ; K ≈ 10¹⁶"
      option_explanations:
        - |
          The sign is wrong: a positive E° gives a negative ΔG° through ΔG° = −nFE°.
        - |
          This uses n = 1; two electrons are transferred (Pb → Pb²⁺), so the magnitude is doubled to 90.7 kJ.
        - |
          The free energy is right, but a negative ΔG° must give K greater than 1, not 10⁻¹⁶.
        - |
          Correct. ΔG° = −(2)(96,485)(0.47) = −90,700 J = −90.7 kJ; log K = nE°/0.0592 = (2)(0.47)/0.0592 = 15.9, so K ≈ 10¹⁶.
      answer: 3
      explanation: |
        Practice 5. ΔG° = −nFE° with n = 2, then log K = nE°/0.0592 at 298 K. Sign checks: E° > 0, ΔG° < 0, K > 1 must all agree.
    - slug: apchem-u09-w32-q06
      type: multiple_choice
      topic_code: "9.9"
      source: "general knowledge"
      points: 1
      prompt: |
        A Zn/Cu galvanic cell (E° = 1.10 V) is set up and then some of the CuSO₄ solution is replaced with pure water, lowering [Cu²⁺] from 1.0 M to 0.10 M while [Zn²⁺] stays at 1.0 M. What happens to the cell potential?
      options:
        - "It rises, because the cell is further from equilibrium."
        - "It falls by about 0.03 V, because Q increases."
        - "It falls by about 0.06 V, because Q increases."
        - "It is unchanged, because E° depends only on the identity of the electrodes."
      option_explanations:
        - |
          Diluting a reactant ion moves the cell toward equilibrium, not away from it; Q = [Zn²⁺]/[Cu²⁺] goes up.
        - |
          Correct. Q goes from 1 to 10, so E = 1.10 − (0.0592/2)(log 10) = 1.10 − 0.030 = 1.07 V.
        - |
          0.06 V would be the drop for a tenfold change with n = 1; here n = 2, so the shift per decade is 0.0296 V.
        - |
          E° is unchanged, but E under non-standard conditions is given by the Nernst equation and does depend on concentrations.
      answer: 1
      explanation: |
        Practice 5. Nernst: E = E° − (0.0592/n) log Q. Removing a reactant ion raises Q and lowers E, by 0.0592/n per factor of ten.
    - slug: apchem-u09-w32-q07
      type: multiple_choice
      topic_code: "9.9"
      source: "general knowledge"
      points: 1
      prompt: |
        A concentration cell is built from two silver electrodes, one in 0.010 M AgNO₃ and one in 1.0 M AgNO₃. Which statement is correct?
      options:
        - "E° = +0.80 V and the cell runs until the dilute side is exhausted."
        - "E° = 0 and no current flows, because both electrodes are silver."
        - "E° = 0, the electrode in the 0.010 M solution is the anode, and E ≈ +0.12 V initially."
        - "E° = 0, the electrode in the 1.0 M solution is the anode, and E ≈ +0.12 V initially."
      option_explanations:
        - |
          Both half-cells have the same E°, so they cancel: E° for a concentration cell is zero, not 0.80 V.
        - |
          E° is zero but E is not; the concentration difference drives a current until the two concentrations are equal.
        - |
          Correct. Oxidation on the dilute side makes Ag⁺ there; reduction on the concentrated side removes it. E = −(0.0592/1) log(0.010/1.0) = +0.118 V.
        - |
          The concentrated side is the cathode: reducing Ag⁺ there lowers its concentration toward the dilute side's value.
      answer: 2
      explanation: |
        Practice 4. A concentration cell is driven by the tendency of concentrations to equalise (entropy of mixing); the dilute half-cell is the anode.
    - slug: apchem-u09-w32-q08
      type: multiple_choice
      topic_code: "9.10"
      source: "general knowledge"
      points: 1
      prompt: |
        Concentrated aqueous NaCl is electrolysed with inert electrodes. Which products form at the cathode and the anode?
      options:
        - "Cathode: H₂(g) and OH⁻(aq); anode: Cl₂(g)"
        - "Cathode: Na(s); anode: Cl₂(g)"
        - "Cathode: H₂(g); anode: O₂(g)"
        - "Cathode: Na(s); anode: O₂(g)"
      option_explanations:
        - |
          Correct. Water is reduced in preference to Na⁺ (giving H₂ and OH⁻), and chloride is oxidised at the anode because O₂ evolution has a large overpotential: the chlor-alkali process.
        - |
          Sodium metal forms only from the molten salt; in water, H₂O is reduced long before Na⁺.
        - |
          H₂ is right, but in concentrated brine the anode product is Cl₂, not O₂, because of the overpotential for oxygen evolution.
        - |
          Neither product is right for brine: water is reduced at the cathode and chloride is oxidised at the anode.
      answer: 0
      explanation: |
        Practice 6. In aqueous electrolysis, compare every candidate with water; chloride is the recognised exception at the anode.
    - slug: apchem-u09-w32-q09
      type: multiple_choice
      topic_code: "9.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement correctly contrasts the electrodes of a galvanic cell with those of an electrolytic cell?
      options:
        - "In an electrolytic cell reduction occurs at the anode, the reverse of a galvanic cell."
        - "In both cells oxidation occurs at the anode, but the anode is negative in a galvanic cell and positive in an electrolytic cell."
        - "In both cells the cathode is negative, but in an electrolytic cell it is where oxidation occurs."
        - "The names anode and cathode are swapped in an electrolytic cell, so no sign rule is needed."
      option_explanations:
        - |
          Oxidation is at the anode in every cell; the definitions never change.
        - |
          Correct. The process at each electrode is fixed by its name; only the sign label changes, because in an electrolytic cell the power supply pulls electrons out of the anode (making it positive).
        - |
          The cathode is positive in a galvanic cell and negative in an electrolytic cell, and reduction occurs there in both.
        - |
          The names are never swapped; anode = oxidation and cathode = reduction always.
      answer: 1
      explanation: |
        Practice 1 (review of 9.7). Anode/cathode are defined by process; +/− depends on whether the cell is supplying or receiving electrical work.
    - slug: apchem-u09-w32-q10
      type: multiple_choice
      topic_code: "4.9"
      source: "general knowledge"
      points: 1
      prompt: |
        In acidic solution the dichromate ion oxidises iron(II): Cr₂O₇²⁻(aq) + 6 Fe²⁺(aq) + 14 H⁺(aq) → 2 Cr³⁺(aq) + 6 Fe³⁺(aq) + 7 H₂O(l). What is the oxidation number of chromium in Cr₂O₇²⁻, and how many moles of electrons are transferred per mole of dichromate?
      options:
        - "+3; 3 mol e⁻"
        - "+7; 7 mol e⁻"
        - "+6; 3 mol e⁻"
        - "+6; 6 mol e⁻"
      option_explanations:
        - |
          +3 is the oxidation number of chromium in the product Cr³⁺, not in dichromate.
        - |
          Seven oxygens at −2 give −14; with the ion charge of −2, two Cr atoms share +12, so each is +6, not +7.
        - |
          The oxidation number is right, but each of the two Cr atoms gains three electrons, so six are transferred per dichromate.
        - |
          Correct. Each Cr goes from +6 to +3 (3 e⁻ each, two Cr atoms = 6 e⁻), matching the six Fe²⁺ that each lose one electron.
      answer: 3
      explanation: |
        Practice 5 (review of 4.9). Assign oxidation numbers from O = −2 and the overall charge; count electrons from the change per atom times the number of atoms. This n is what a Faraday's-law or ΔG° = −nFE° calculation would use.
    - slug: apchem-u09-w32-q11
      type: multi_select
      topic_code: "9.7"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        A rechargeable cell is discharged through a flashlight bulb and later recharged from a wall charger. Which statements are correct? Select all that apply.
      options:
        - "During discharge the cell is galvanic: the reaction with E > 0 runs and does electrical work."
        - "During charging the cell is electrolytic: the charger drives the reverse reaction, which has E < 0."
        - "The electrode that is the anode during discharge is the cathode during charging."
        - "The charger must supply a voltage greater than the cell's own potential."
        - "During charging, reduction takes place at the electrode wired to the charger's positive terminal."
      option_explanations:
        - |
          Correct. Discharge is the spontaneous direction; the cell converts chemical free energy into electrical work.
        - |
          Correct. Charging forces the non-spontaneous reverse reaction; electrical work from the charger raises the cell's free energy.
        - |
          Correct. Reversing the reaction reverses which electrode is oxidised, so the discharge anode becomes the charging cathode.
        - |
          Correct. The applied voltage must exceed the cell's potential (plus any overpotential) or the cell would simply discharge through the charger.
        - |
          The positive terminal pulls electrons out of the electrode it is wired to, so that electrode is oxidised: it is the anode during charging, not the site of reduction.
      answer: [0, 1, 2, 3]
      explanation: |
        Practice 6 (review of 9.7). A rechargeable battery is one pair of half-cells run in both directions; the names of the electrodes follow the process (oxidation at the anode) and therefore swap when the direction reverses.
    - slug: apchem-u09-w32-q12
      type: multi_select
      topic_code: "9.10"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about Faraday's law and electrolysis calculations are correct? Select all that apply.
      options:
        - "The charge passed equals the current in amperes multiplied by the time in seconds."
        - "One mole of electrons carries 96,485 C."
        - "Depositing one mole of Al from Al³⁺ requires three times as much charge as depositing one mole of Ag from Ag⁺."
        - "Doubling the current while halving the time deposits the same mass of metal."
        - "The mass deposited depends on the applied voltage once the minimum voltage is exceeded."
      option_explanations:
        - |
          Correct. q = I·t, with 1 A = 1 C/s; time must be converted to seconds.
        - |
          Correct. This is Faraday's constant, Avogadro's number times the elementary charge.
        - |
