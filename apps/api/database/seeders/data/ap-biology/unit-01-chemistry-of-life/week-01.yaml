week: 1
unit: 1
title: Water and the Elements of Life
topics: ["1.1", "1.2"]
guide: guides/week-01.md
guide_description: |
  Why one fact about oxygen explains cohesion, adhesion, specific heat, evaporative cooling, floating ice and
  water as a solvent; which elements life takes from its surroundings and what each builds. Vocabulary,
  three worked examples (a surface-tension table, pH arithmetic, heat arithmetic), misconceptions, self-check.
flashcards_description: |
  28 cards: terms, structure-to-function, and "what does this data show" cards for water and the elements of life.

flashcards:
  - front: Polar covalent bond
    back: |
      A covalent bond in which the shared electrons sit closer to the more electronegative atom, leaving one end δ⁻ and the other δ⁺.
    hint: Think of O–H inside a water molecule.
    topic_code: "1.1"
  - front: Hydrogen bond
    back: |
      A weak attraction between a δ⁺ hydrogen on one molecule and a δ⁻ oxygen or nitrogen on another molecule. Weak alone, powerful in numbers.
    hint: It is between molecules, not inside one.
    topic_code: "1.1"
  - front: Electronegativity
    back: |
      An atom's pull on shared electrons. Oxygen and nitrogen pull hard; carbon and hydrogen pull less, so C–H bonds are nonpolar and O–H bonds are polar.
    topic_code: "1.1"
  - front: Why is a water molecule bent rather than straight?
    back: |
      Oxygen's two unshared electron pairs push the two O–H bonds together, giving a bent shape. The bend is why the partial charges do not cancel and the molecule is polar.
    topic_code: "1.1"
  - front: How many hydrogen bonds can one water molecule form at once?
    back: |
      Up to four: two through its hydrogens (δ⁺) and two through the unshared pairs on its oxygen (δ⁻).
    topic_code: "1.1"
  - front: Cohesion
    back: |
      Attraction between water molecules through hydrogen bonds. Produces surface tension and lets a column of water in xylem be pulled up without breaking.
    topic_code: "1.1"
  - front: Adhesion
    back: |
      Attraction between water molecules and other polar or charged surfaces, such as glass or cellulose cell walls. Drives capillary action together with cohesion.
    topic_code: "1.1"
  - front: Surface tension → cause and one biological example
    back: |
      Surface molecules are hydrogen-bonded sideways and inward but not upward, so the surface resists breaking. A water strider stands on a pond; water beads on a leaf.
    topic_code: "1.1"
  - front: Capillary action → the two forces involved
    back: |
      Adhesion pulls the edge of the water column up the wall of a narrow tube; cohesion drags the rest of the column with it. The narrower the tube, the higher the rise.
    hint: One force is to the wall, one is molecule to molecule.
    topic_code: "1.1"
  - front: Specific heat of water (value and meaning)
    back: |
      1 cal per gram per °C, about five times that of sand. Added heat goes into breaking hydrogen bonds before it raises temperature, so water warms and cools slowly.
    topic_code: "1.1"
  - front: Why does water's high specific heat matter to organisms?
    back: |
      Body and ocean temperatures stay steady despite changing heat input, so enzymes keep working in their narrow temperature range. Coastal climates are moderated.
    topic_code: "1.1"
  - front: Heat of vaporization of water
    back: |
      About 586 cal per gram, because every hydrogen bond a molecule has must be broken for it to leave the liquid.
    topic_code: "1.1"
  - front: Evaporative cooling → mechanism
    back: |
      The most energetic molecules are the ones that escape as vapour, so the average energy of what remains falls and the liquid cools. Sweating and transpiration cool by this route.
    hint: Which molecules leave first?
    topic_code: "1.1"
  - front: Why does ice float?
    back: |
      As water freezes, hydrogen bonds lock molecules into an open lattice that holds them farther apart than in the liquid, so ice is less dense. Ponds freeze from the top and the ice insulates the water below.
    topic_code: "1.1"
  - front: Hydrophilic vs hydrophobic
    back: |
      Hydrophilic substances are polar or ionic and dissolve in water; hydrophobic substances are nonpolar (oils, fats) and are excluded by water, clustering together instead.
    topic_code: "1.1"
  - front: Hydration shell
    back: |
      The layer of water molecules around a dissolved ion: oxygen ends toward a cation such as Na⁺, hydrogen ends toward an anion such as Cl⁻. This is how salt dissolves.
    topic_code: "1.1"
  - front: pH (definition and equation)
    back: |
      pH = −log₁₀[H⁺]. Pure water has [H⁺] = 10⁻⁷ M, so pH 7. Below 7 is acidic, above 7 is basic. Each unit is a tenfold change in [H⁺].
    topic_code: "1.1"
  - front: Acid vs base
    back: |
      An acid releases H⁺ into solution and lowers pH; a base accepts H⁺ or releases OH⁻ and raises pH.
    topic_code: "1.1"
  - front: Buffer → what it does and the example in blood
    back: |
      A buffer absorbs or releases H⁺ to resist pH change. In blood, carbonic acid (H₂CO₃) and bicarbonate (HCO₃⁻) hold pH near 7.4: excess H⁺ is captured by bicarbonate, a shortage is replaced by carbonic acid dissociating.
    topic_code: "1.1"
  - front: The four most abundant elements in living things
    back: |
      Oxygen (about 65% of human body mass), carbon (18%), hydrogen (10%), nitrogen (3%). Oxygen leads because the body is mostly water.
    hint: CHON, but not in that order by mass.
    topic_code: "1.2"
  - front: Why are organisms not just a sample of their environment?
    back: |
      Air is 78% nitrogen and 21% oxygen with only a trace of carbon, yet bodies are 18% carbon. Organisms must take in specific elements and spend energy rearranging them into their own molecules.
    topic_code: "1.2"
  - front: What is carbon used to build, and why is it suited to it?
    back: |
      The backbone of carbohydrates, lipids, proteins and nucleic acids. With four valence electrons it forms four covalent bonds, making chains, branches and rings.
    topic_code: "1.2"
  - front: What does an organism need nitrogen for?
    back: |
      The amino groups of amino acids (so proteins) and the nitrogenous bases of DNA and RNA. Atmospheric N₂ is held by a triple bond most organisms cannot break.
    topic_code: "1.2"
  - front: What does an organism need phosphorus for?
    back: |
      Phosphate groups in DNA and RNA backbones, in ATP, and in the heads of phospholipids.
    topic_code: "1.2"
  - front: Valence electrons and the octet rule
    back: |
      Valence electrons are those in the outermost shell. Atoms react until that shell holds eight (two for the first shell), by gaining, losing or sharing electrons.
    topic_code: "1.2"
  - front: Isotope → definition and the carbon-14 use
    back: |
      Atoms of one element with different neutron numbers. Carbon-14 is radioactive with a half-life of about 5,730 years; the ¹⁴C/¹²C ratio in dead material dates it to about 50,000 years back.
    topic_code: "1.2"
  - front: Three kinds of isomer
    back: |
      Structural (atoms connected differently, butane vs isobutane), geometric cis/trans (different arrangement around a double bond that cannot rotate), enantiomers (mirror images). Enzymes usually fit only one.
    topic_code: "1.2"
  - front: Functional groups → which are polar, which is acidic, which is basic
    back: |
      Hydroxyl, carbonyl, carboxyl, amino, phosphate and sulfhydryl are polar (hydrophilic); methyl is nonpolar. Carboxyl donates H⁺ (acidic); amino accepts H⁺ (basic); phosphate is acidic too.
    topic_code: "1.2"

quiz:
  description: |
    22 questions · about 25 minutes · recall and first applications of water's properties and the elements of life.
    Multiple choice, select-all, true/false and numeric items are graded at once; the fill-in-the-blank items are
    matched automatically; the two short answers and the long answer are graded by your teacher against the
    acceptable-answer summary.
  questions:
    - slug: u01-w01-q01
      type: multiple_choice
      topic_code: "1.1"
      source: "Biology 2e §2.1 Atoms, Isotopes, Ions, and Molecules"
      points: 1
      prompt: |
        In a water molecule the oxygen atom carries a partial negative charge and each hydrogen a partial positive charge. Which statement best explains why?
      options:
        - "Oxygen has more protons than hydrogen, so it holds a full negative charge that it shares with the hydrogens."
        - "Oxygen is more electronegative than hydrogen, so the shared electron pairs spend more time near the oxygen."
        - "Hydrogen gives one electron completely to oxygen, forming an ionic bond with separated charges."
        - "The molecule is bent, and bending any molecule produces partial charges on its ends."
      option_explanations:
        - |
          Proton count is not the issue; the charges are partial (δ), produced by unequal sharing of electrons, not by a full charge being handed around.
        - |
          Correct. Electronegativity is the pull on shared electrons; oxygen's stronger pull shifts electron density toward itself, leaving the hydrogens electron-poor.
        - |
          If an electron were transferred completely the bond would be ionic and the charges whole, as in NaCl. The O–H bond is covalent, with electrons shared unequally.
        - |
          The bend matters for why the partial charges do not cancel across the molecule, but it is the electronegativity difference, not the shape, that creates them.
      answer: 1
      explanation: |
        Unequal sharing in a polar covalent bond is the root of every property of water on this exam: polarity leads to hydrogen bonding, and hydrogen bonding leads to the rest.

    - slug: u01-w01-q02
      type: multiple_choice
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        A student places a paper clip gently on the surface of a glass of water and it stays afloat even though steel is denser than water. Which property of water, and which cause, explain the observation?
      options:
        - "Surface tension, caused by hydrogen bonds pulling surface molecules toward one another and inward."
        - "Buoyancy, caused by the low density of water compared with steel."
        - "Adhesion, caused by water molecules bonding to the steel of the clip."
        - "Low specific heat, which keeps the surface rigid at room temperature."
      option_explanations:
        - |
          Correct. Surface molecules have hydrogen-bonded neighbours beside and below them but none above, so the surface behaves like an elastic skin that supports a light object.
        - |
          Buoyancy would require the clip to be less dense than water, and steel is much denser; a clip pushed under the surface sinks at once.
        - |
          Adhesion is water sticking to another surface; it would wet the clip and pull it down, not hold it up. The support comes from water sticking to water.
        - |
          Water's specific heat is high, not low, and specific heat describes how slowly water changes temperature; it has nothing to do with a surface supporting weight.
      answer: 0
      explanation: |
        Surface tension is cohesion seen at a surface. The same reasoning explains a water strider's feet dimpling the surface without breaking through.

    - slug: u01-w01-q03
      type: multiple_choice
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        Two identical beakers, one of water and one of ethanol, sit under the same lamp. After 20 minutes the ethanol has warmed by 8 °C and the water by 3 °C. Which conclusion is best supported?
      options:
        - "Ethanol absorbed more energy from the lamp than water did."
        - "Water has a higher specific heat, so the same energy raised its temperature less."
        - "Water lost heat by evaporating faster than ethanol."
        - "The lamp heated the ethanol beaker from a shorter distance."
      option_explanations:
        - |
          The beakers are identical and under the same lamp, so they received about the same energy; the difference is what each liquid did with it, not how much it got.
        - |
          Correct. Specific heat is the energy needed per gram per degree. Water's hydrogen bonds absorb energy before the molecules speed up, so its temperature climbs more slowly.
        - |
          Ethanol evaporates faster than water, not slower, so evaporation would have cooled the ethanol more and cannot explain its larger rise.
        - |
          The setup states identical beakers under the same lamp; inventing a difference in distance is not a conclusion the data support.
      answer: 1
      explanation: |
        When comparing substances that received the same energy, a smaller temperature change means a larger specific heat. Water's is about five times that of sand and higher than most liquids.

    - slug: u01-w01-q04
      type: multiple_choice
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        Why does a lake freeze from the surface down rather than from the bottom up?
      options:
        - "Cold water is denser than warm water at every temperature, so cold water always sinks and freezes at the bottom."
        - "Ice is less dense than liquid water because hydrogen bonds hold the frozen molecules in an open lattice, so ice floats."
        - "Sunlight warms the bottom of the lake, keeping it liquid while the surface freezes."
        - "Wind removes heat only from the surface, and water conducts heat too poorly for the bottom ever to cool."
      option_explanations:
        - |
          Below 4 °C water becomes less dense as it cools, and ice is less dense still; if cold water always sank, ice would form on the bottom and lakes would freeze solid.
        - |
          Correct. As water freezes, each molecule is locked into four hydrogen bonds in a lattice that spaces molecules farther apart than in the liquid, so the solid floats and insulates what is beneath.
        - |
          Sunlight does not reach the bottom of a deep lake with enough energy to keep it liquid in winter; the explanation is the density of ice, not heating from below.
        - |
          Heat does leave at the surface, but that alone would let the newly formed ice sink if it were denser than water. Floating ice is what keeps the bottom liquid.
      answer: 1
      explanation: |
        Water is one of the few substances whose solid is less dense than its liquid. The floating ice layer insulates the water below, and aquatic life survives the winter under it.

    - slug: u01-w01-q05
      type: multiple_choice
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        Sodium chloride dissolves readily in water. Which description of the molecular events is correct?
      options:
        - "Water molecules form covalent bonds with Na⁺ and Cl⁻, splitting the crystal."
        - "The δ⁻ oxygen ends of water molecules surround Na⁺ and the δ⁺ hydrogen ends surround Cl⁻, forming hydration shells."
        - "Water's hydrogen ions replace the sodium ions in the crystal lattice."
        - "Nonpolar water molecules slip between the ions and push them apart."
      option_explanations:
        - |
          No covalent bonds form; dissolving is a matter of attractions between charges, and the ions keep their identity in solution.
        - |
          Correct. Each ion is wrapped in a shell of water molecules oriented by charge, and the attraction to many water molecules outweighs the attraction to the crystal.
        - |
          Water does not donate hydrogen ions into the crystal; the few H⁺ that exist in pure water are not what pulls the lattice apart.
        - |
          Water is polar, not nonpolar; it is exactly its partial charges that let it interact with ions. Nonpolar liquids such as hexane do not dissolve salt.
      answer: 1
      explanation: |
        Hydration shells are the picture to carry: oxygen toward cations, hydrogen toward anions. The same orientation explains why polar molecules dissolve and nonpolar ones are excluded.

    - slug: u01-w01-q06
      type: multiple_choice
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        Blood pH is held near 7.4 by the carbonic acid–bicarbonate system. If vigorous exercise releases extra H⁺ into the blood, which response moderates the change?
      options:
        - "Bicarbonate ions (HCO₃⁻) combine with the extra H⁺ to form carbonic acid, removing free H⁺ from solution."
        - "Carbonic acid releases more H⁺, diluting the added hydrogen ions."
        - "Water molecules split into H⁺ and OH⁻ to neutralise the acid."
        - "The extra H⁺ is converted directly into hydrogen gas and exhaled."
      option_explanations:
        - |
          Correct. A buffer's base component accepts hydrogen ions; HCO₃⁻ + H⁺ → H₂CO₃ takes free H⁺ out of solution, so the pH falls much less than it otherwise would.
        - |
          Releasing more H⁺ would lower the pH further; that is the buffer's response to a shortage of H⁺, not to an excess.
        - |
          Water does dissociate, but only to 10⁻⁷ M; it cannot absorb an acid load, and splitting water adds H⁺ as well as OH⁻.
        - |
          Hydrogen ions are not turned into H₂ in the blood. Exhaling removes CO₂, which shifts the equilibrium, but the ions themselves are captured by bicarbonate.
      answer: 0
      explanation: |
        A buffer is a weak acid and its conjugate base in balance. Add H⁺ and the base takes it up; remove H⁺ and the acid dissociates to replace it. Either way the pH moves only a little.

    - slug: u01-w01-q07
      type: multiple_choice
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        Solution A has a pH of 3 and solution B has a pH of 6. How do their hydrogen ion concentrations compare?
      options:
        - "A has twice the H⁺ concentration of B."
        - "A has three times the H⁺ concentration of B."
        - "A has 1,000 times the H⁺ concentration of B."
        - "B has 1,000 times the H⁺ concentration of A."
      option_explanations:
        - |
          Reading a difference of three pH units as "twice as acidic" ignores that the scale is logarithmic; each unit is a tenfold change in [H⁺].
        - |
          Three units is not three times. The pH scale is base-ten logarithmic, so three units is 10 × 10 × 10.
        - |
          Correct. pH = −log₁₀[H⁺]; A has [H⁺] = 10⁻³ M and B has 10⁻⁶ M, a thousandfold difference, with A the more acidic.
        - |
          The direction is reversed: a lower pH means a higher H⁺ concentration, so A, at pH 3, is the solution with more hydrogen ions.
      answer: 2
      explanation: |
        Work it with the equation: [H⁺] = 10⁻ᵖᴴ. 10⁻³ ÷ 10⁻⁶ = 10³ = 1,000. Lower pH, more H⁺.

    - slug: u01-w01-q08
      type: multiple_choice
      topic_code: "1.2"
      source: "Biology 2e §2.1 Atoms, Isotopes, Ions, and Molecules"
      points: 1
      prompt: |
        By mass, the human body is about 65% oxygen, 18% carbon, 10% hydrogen and 3% nitrogen, while the atmosphere is about 78% nitrogen and 21% oxygen with only a trace of carbon. Which inference is best supported by the comparison?
      options:
        - "Organisms absorb elements in the same proportions in which they occur in their surroundings."
        - "Organisms selectively take in particular elements and use energy to build them into their own molecules."
        - "Nitrogen is unimportant to living things because they contain so little of it."
        - "Carbon is more abundant in living things because it is the lightest element."
      option_explanations:
        - |
          The proportions are strikingly different; a body with 18% carbon cannot have been assembled by sampling an atmosphere with almost none.
        - |
          Correct. Life concentrates certain elements against their environmental abundance, which requires selective uptake and energy to rearrange them, a theme that runs through the whole course.
        - |
          Three percent of body mass is a great deal of nitrogen: every amino acid and every nucleotide base contains it. Abundance in the body is not the same as importance.
        - |
          Hydrogen is the lightest element, not carbon, and lightness does not explain abundance. Carbon's four bonds, not its mass, make it the backbone of biological molecules.
      answer: 1
      explanation: |
        The mismatch between body composition and environmental composition is evidence that organisms are open systems that exchange matter selectively with their surroundings (CED 1.2).

    - slug: u01-w01-q09
      type: multiple_choice
      topic_code: "1.2"
      source: "Biology 2e §2.3 Carbon"
      points: 1
      prompt: |
        Carbon has four valence electrons. Which consequence of that fact best explains why carbon is the backbone of biological macromolecules?
      options:
        - "Carbon forms up to four covalent bonds, so it can build chains, branches and rings that other atoms attach to."
        - "Carbon readily gives up four electrons to become a C⁴⁺ ion that attracts negative groups."
        - "Carbon forms only single bonds, which makes its molecules uniform and predictable."
        - "Carbon's four electrons make it the most electronegative element in living things."
      option_explanations:
        - |
          Correct. Needing four more electrons to complete its octet, carbon shares with up to four partners, including other carbons, and that is what produces long, varied skeletons.
        - |
          Losing four electrons would cost far too much energy; carbon shares electrons covalently rather than forming ions.
        - |
          Carbon forms single, double and triple bonds, and the double bonds in particular change a molecule's shape (cis/trans isomers). Uniformity is not its strength; versatility is.
        - |
          Carbon's electronegativity is moderate, which is why C–H bonds are nonpolar. Oxygen and nitrogen are the strongly electronegative elements in living things.
      answer: 0
      explanation: |
        Four bonds plus the ability to bond to itself gives carbon the structural range that proteins, carbohydrates, lipids and nucleic acids all depend on.

    - slug: u01-w01-q10
      type: multiple_choice
      topic_code: "1.2"
      source: "Biology 2e §2.1 Atoms, Isotopes, Ions, and Molecules"
      points: 1
      prompt: |
        Air is nearly four-fifths nitrogen gas, yet nitrogen is often the element that limits plant growth. Which statement explains the paradox?
      options:
        - "N₂ is held by a triple covalent bond that most organisms cannot break, so atmospheric nitrogen is unavailable to them."
        - "Plants do not need nitrogen, so the atmospheric supply is irrelevant to their growth."
        - "Nitrogen gas is toxic to plants, so they avoid absorbing it."
        - "Nitrogen is too heavy to enter leaves through stomata."
      option_explanations:
        - |
          Correct. The N≡N triple bond is among the strongest in nature; only certain bacteria can fix it into usable forms, so the usable nitrogen supply, not the total, limits growth.
        - |
          Plants need large amounts of nitrogen for every protein and nucleic acid; a nitrogen shortage shows as yellowed leaves and stunted growth.
        - |
          N₂ is inert, not toxic; the problem is that it does nothing, not that it does harm.
        - |
          N₂ (28 g/mol) is lighter than CO₂ (44 g/mol), which enters leaves constantly. Mass is not the barrier; bond strength is.
      answer: 0
      explanation: |
        The nitrogen cycle in Unit 8 returns to this: fixation by bacteria is the step that converts abundant but inert N₂ into ammonium and nitrate that plants can use.

    - slug: u01-w01-q11
      type: multiple_choice
      topic_code: "1.2"
      source: "Biology 2e §2.3 Carbon"
      points: 1
      prompt: |
        A molecule carries a carboxyl group (–COOH). In the watery interior of a cell, how will that group most likely behave?
      options:
        - "It will release H⁺ and carry a negative charge, making that part of the molecule hydrophilic."
        - "It will accept H⁺ and carry a positive charge, making that part of the molecule hydrophilic."
        - "It will remain uncharged and nonpolar, making that part of the molecule hydrophobic."
        - "It will form a covalent bond with water, splitting the molecule in two."
      option_explanations:
        - |
          Correct. A carboxyl group is acidic: at cellular pH it donates its hydrogen ion and becomes –COO⁻, a charged, water-loving group.
        - |
          Accepting H⁺ to become positive is what an amino group (–NH₂ → –NH₃⁺) does; the carboxyl group goes the other way.
        - |
          A methyl group (–CH₃) is the nonpolar, hydrophobic one. Carboxyl is polar even before it ionises.
        - |
          Hydrolysis splits bonds inside a molecule using water, but a carboxyl group sitting in water does not spontaneously break its parent molecule apart.
      answer: 0
      explanation: |
        Functional groups predict behaviour: carboxyl and phosphate act as acids, amino as a base, hydroxyl and carbonyl as polar but neutral, methyl as nonpolar.

    - slug: u01-w01-q12
      type: multi_select
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 2
      partial_credit: true
      prompt: |
        Select every property of water that results from hydrogen bonding between water molecules.
      options:
        - "High specific heat"
        - "Ice being less dense than liquid water"
        - "Water being a small molecule with a molar mass of 18 g/mol"
        - "Cohesion and surface tension"
        - "Water being colourless"
      option_explanations:
        - |
          Correct. Energy added to water goes first into breaking hydrogen bonds, so a lot of heat is needed to raise the temperature.
        - |
          Correct. Hydrogen bonds lock freezing molecules into an open lattice that spaces them farther apart than in the liquid.
        - |
          Molar mass is set by the atoms in the molecule (one O, two H), not by how molecules attract each other; it would be 18 g/mol with or without hydrogen bonds.
        - |
          Correct. Cohesion is hydrogen bonding between neighbouring water molecules, and surface tension is cohesion at a surface.
        - |
          Colour depends on which wavelengths a molecule absorbs; water's transparency is not a consequence of hydrogen bonding between molecules.
      answer: [0, 1, 3]
      explanation: |
        The test for whether a property comes from hydrogen bonding: would it vanish if water molecules could not attract each other? Specific heat, floating ice and cohesion would; molar mass and colour would not.

    - slug: u01-w01-q13
      type: multi_select
      topic_code: "1.2"
      source: "Biology 2e §2.1 Atoms, Isotopes, Ions, and Molecules"
      points: 2
      partial_credit: true
      prompt: |
        Which statements correctly pair an element with something a cell must build from it? Select all that apply.
      options:
        - "Nitrogen: the amino groups of amino acids and the bases of nucleotides"
        - "Phosphorus: the phosphate groups of ATP and of the DNA backbone"
        - "Carbon: the skeleton of every carbohydrate, lipid, protein and nucleic acid"
        - "Oxygen: the only element found in water and in no biological molecule"
      option_explanations:
        - |
          Correct. Every amino acid has an –NH₂ group and every nucleotide base contains nitrogen, which is why nitrogen supply limits protein and DNA synthesis.
        - |
          Correct. Phosphate groups link nucleotides into a backbone, carry the energy of ATP, and form the heads of phospholipids.
        - |
          Correct. Carbon's four bonds make the chains and rings that all four classes of macromolecule are built on.
        - |
          Oxygen is in water, but it is also in every carbohydrate, in the carbonyl and carboxyl groups of proteins and lipids, and in nucleic acids. The claim is false in both halves.
      answer: [0, 1, 2]
      explanation: |
        CED 1.2 asks you to connect each element to the molecules that need it: carbon for all skeletons, nitrogen for proteins and nucleic acids, phosphorus for nucleic acids, ATP and phospholipids.

    - slug: u01-w01-q14
      type: true_false
      topic_code: "1.1"
      source: "Biology 2e §2.1 Atoms, Isotopes, Ions, and Molecules"
      points: 1
      prompt: |
        True or false: The hydrogen bonds in liquid water are the bonds that hold each hydrogen atom to its oxygen atom within a single molecule.
      answer: false
      explanation: |
        False. Within a molecule, hydrogen is held to oxygen by a polar covalent bond. A hydrogen bond is the weaker attraction between the δ⁺ hydrogen of one molecule and the δ⁻ oxygen of a different molecule. Confusing the two is the single most common error on this topic.

    - slug: u01-w01-q15
      type: true_false
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        True or false: When sweat evaporates, the skin cools because the water molecules that escape as vapour are, on average, the most energetic ones, leaving a liquid with lower average energy behind.
      answer: true
      explanation: |
        True. Evaporation is selective: only molecules with enough energy to break all their hydrogen bonds escape. Removing the fastest molecules lowers the mean kinetic energy, and therefore the temperature, of what remains. Water's high heat of vaporization means each gram that escapes carries away a large amount of heat.

    - slug: u01-w01-q16
      type: fill_blank
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        Water rises inside the narrow xylem vessels of a plant partly because water molecules are attracted to the polar cellulose walls, a property called ____.
      answer: ["adhesion"]
      explanation: |
        Adhesion is water sticking to something other than water. Cohesion (water to water) is the partner force that drags the rest of the column up, but the attraction named in the prompt, molecule to wall, is adhesion. "Capillary action" names the whole phenomenon rather than this one force, so it would not earn the point.

    - slug: u01-w01-q17
      type: fill_blank
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        A substance that resists changes in pH by absorbing excess hydrogen ions or releasing them when they are scarce is called a ____.
      answer: ["buffer"]
      explanation: |
        A buffer is a weak acid paired with its conjugate base. Its job is to hold pH within a narrow range, which keeps enzymes in the shape that lets them work. The carbonic acid–bicarbonate pair in blood is the standard example. "Base" alone is not accepted: a base raises pH, it does not resist change in both directions.

    - slug: u01-w01-q18
      type: fill_blank
      topic_code: "1.2"
      source: "Biology 2e §2.1 Atoms, Isotopes, Ions, and Molecules"
      points: 1
      prompt: |
        Atoms of the same element that differ in their number of neutrons, such as carbon-12 and carbon-14, are called ____.
      answer: ["isotopes", "isotope"]
      explanation: |
        Isotopes share proton number (so they are the same element with the same chemistry) but differ in mass. Carbon-14 is radioactive; its decay at a known half-life of about 5,730 years is what makes radiocarbon dating possible. "Ions" is a different thing: atoms that have gained or lost electrons and therefore carry a charge.

    - slug: u01-w01-q19
      type: numeric
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        Lemon juice has a hydrogen ion concentration of about 1 × 10⁻² mol/L. Using pH = −log₁₀[H⁺], what is its pH? Give a whole number.
      answer: { value: 2, tolerance: 0 }
      explanation: |
        pH = −log₁₀(1 × 10⁻²) = −(−2) = 2. A quick rule: for a concentration written as 1 × 10⁻ⁿ, the pH is n. A pH of 2 is strongly acidic, 100,000 times the H⁺ concentration of pure water at pH 7.

    - slug: u01-w01-q20
      type: short_answer
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 4
      prompt: |
        Conceptual analysis. A redwood moves water from its roots to leaves more than 90 metres up without a pump. (a) Describe the molecular interaction between water molecules that makes this possible. (b) Explain how that interaction allows a column of water to be pulled upward as water evaporates from the leaves. (c) Predict what would happen to the column if water molecules could not attract one another, and (d) justify your prediction.
      answer: |
        Hydrogen bonding between water molecules (cohesion) lets the column be pulled up as one unbroken chain when evaporation at the top removes molecules; without that attraction the column would break and water would not rise.
      explanation: |
        Four points, one per task.

        (a) Describe, 1 pt: hydrogen bonds between the δ⁺ hydrogen of one water molecule and the δ⁻ oxygen of another, which is cohesion. Naming "cohesion" alone without saying what it is physically earns the point only if hydrogen bonding is mentioned somewhere in the answer.

        (b) Explain, 1 pt: evaporation from the leaf removes molecules at the top; because each molecule is hydrogen-bonded to its neighbours, the loss pulls the molecule below upward, and so on down the column. Accept "transpiration pull", "the column acts like a chain/rope", or "tension is transmitted through hydrogen bonds". Mentioning adhesion to the xylem walls as a helper is a bonus, not a requirement.

        (c) Predict, 1 pt: the column would break (cavitate) or water would not rise beyond what capillary action or root pressure can lift; water transport to the leaves would fail.

        (d) Justify, 1 pt: because with no attraction between molecules there is nothing to transmit the pull from the top of the column to the bottom; each molecule that evaporated would simply leave a gap.

        Zero: answers that attribute the rise to "suction from the leaves" with no molecular mechanism, or that say the plant pumps water with energy from ATP.

    - slug: u01-w01-q21
      type: short_answer
      topic_code: "1.2"
      source: "Biology 2e §2.1 Atoms, Isotopes, Ions, and Molecules"
      points: 4
      prompt: |
        Analyze data. The table shows the percentage by mass of four elements in the human body and in the Earth's crust.

        | Element | Human body (%) | Earth's crust (%) |
        |---|---|---|
        | Oxygen | 65 | 46 |
        | Carbon | 18 | 0.03 |
        | Hydrogen | 10 | 0.1 |
        | Nitrogen | 3 | trace |

        (a) Identify the element with the greatest enrichment in the body relative to the crust, and support your choice with the data. (b) Explain why living organisms are not simply a sample of the material around them. (c) Describe one specific biological molecule that requires the element you identified, and state the role of that element within it.
      answer: |
        Carbon (18% vs 0.03%, about 600-fold); organisms selectively take in and rearrange elements using energy; carbon forms the backbone of, for example, glucose or a protein.
      explanation: |
        Four points.

        (a) Identify with support, 1 pt: carbon, with a comparison such as "18% in the body versus 0.03% in the crust" or "about 600 times more concentrated". Choosing oxygen (65 vs 46, under twofold) does not earn the point because the ratio is far smaller, but a student who chooses hydrogen with 10 vs 0.1 (100-fold) has used the data correctly and earns the point.

        (b) Explain, 2 pts: 1 pt for the idea that organisms take in specific elements selectively (through food, gas exchange, roots) rather than absorbing whatever is around; 1 pt for the idea that building body molecules from those elements requires energy and chemical work (metabolism), which is why composition can differ so much from the environment. Accept "open system that exchanges matter with the environment".

        (c) Describe a molecule, 1 pt: any correct example with the element's role, e.g. glucose or any carbohydrate (carbon skeleton), a protein (carbon backbone of each amino acid), DNA (carbon in the sugar and bases). For a hydrogen answer, accept hydrogen in C–H bonds of lipids or the H⁺ gradients of later units.

        Zero: restating the table without a comparison, or claiming organisms absorb elements in environmental proportions.

    - slug: u01-w01-q22
      type: long_answer
      topic_code: "1.1"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. A class tested the claim that liquids with more hydrogen bonding cool a surface more when they evaporate. A thermometer bulb was wrapped in gauze soaked in one liquid and held in moving air; the temperature was read every minute for five minutes. Each trial was repeated three times and the mean is shown.

        | Liquid | Hydrogen bonds per molecule | Start (°C) | After 5 min (°C) | Mean change (°C) |
        |---|---|---|---|---|
        | Water | up to 4 | 22.0 | 17.5 | −4.5 |
        | Ethanol | 1 | 22.0 | 13.0 | −9.0 |
        | Hexane | 0 | 22.0 | 15.0 | −7.0 |
        | Dry gauze (control) | — | 22.0 | 21.8 | −0.2 |

        (a) Identify the independent and dependent variables and state the purpose of the dry-gauze control.
        (b) Describe the pattern in the data.
        (c) The class expected water to produce the largest temperature drop because it has the highest heat of vaporization. Explain, using the properties of water, why the data do not support that expectation and what other factor the design failed to control.
        (d) Propose one change to the procedure that would allow a fair test of the original claim, and predict the result for water if the claim is correct.
      answer: |
        IV: liquid type; DV: temperature change; control shows the drop is due to evaporation, not the moving air. Ethanol cooled most, water least. Water's strong hydrogen bonding means it also evaporates slowest, so less mass evaporated in five minutes; the design confounded evaporation rate with energy per gram. Fix: run until an equal mass has evaporated, or measure energy removed per gram evaporated; water should then show the largest heat removed per gram.
      explanation: |
        Eight points.

        (a) 2 pts: 1 pt for independent variable = type of liquid (its hydrogen-bonding capacity) and dependent variable = temperature change of the bulb (accept "final temperature"); 1 pt for the control's purpose: to show that moving air alone barely changes the reading, so the drops are caused by evaporation of the liquid.

        (b) 1 pt: ethanol produced the largest drop (−9.0 °C), hexane next (−7.0), water the smallest (−4.5), so cooling did not increase with hydrogen bonding; at least two liquids must be named with numbers or a correct ordering.

        (c) 3 pts: 1 pt for recognising that the result contradicts the expectation (water, with the most hydrogen bonds and the highest heat of vaporization, cooled least); 1 pt for the mechanism: the same hydrogen bonds that give water a high heat of vaporization also make it evaporate slowly, so far less water than ethanol left the gauze in five minutes, and total heat removed = mass evaporated × heat of vaporization per gram; 1 pt for naming the uncontrolled factor: the rate or amount of evaporation (mass lost) was not measured or equalised, so the test compared rate of evaporation, not energy per gram. Accept "volatility" or "vapour pressure" as the factor.

        (d) 2 pts: 1 pt for a procedural change that controls the confound: weigh the gauze before and after to find mass evaporated and compute cooling per gram; or run each trial until the same mass has evaporated; or seal the system so only a fixed mass can evaporate; 1 pt for a prediction consistent with the claim: per gram evaporated, water should remove the most heat (largest drop per gram), ethanol less, hexane least.

        Zero for a part: restating the table as the "pattern" without an ordering or comparison; saying the data are wrong or the thermometer was faulty; explaining the water result by "water is a liquid" or by specific heat (specific heat is about the liquid warming, not about evaporation).
