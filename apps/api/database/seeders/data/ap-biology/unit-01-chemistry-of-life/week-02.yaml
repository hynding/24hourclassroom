week: 2
unit: 1
title: Macromolecules, Carbohydrates and Lipids
topics: ["1.3", "1.4", "1.5"]
guide: guides/week-02.md
guide_description: |
  Dehydration synthesis and hydrolysis; why one monomer (glucose) makes a pantry (starch, glycogen) or a wall
  (cellulose) depending on its linkage; fatty-acid saturation, phospholipid self-assembly and steroids. Three
  worked examples (linkage to property, a melting-point table, energy per gram), misconceptions, self-check.
flashcards_description: |
  30 cards on building and breaking polymers, carbohydrate structure and function, and the lipid families.

flashcards:
  - front: Dehydration synthesis
    back: |
      Joining two monomers by removing a water molecule: the –H from one and the –OH from the other leave together and a covalent bond forms. Requires energy and an enzyme.
    hint: Water comes OUT; a bond goes IN.
    topic_code: "1.3"
  - front: Hydrolysis
    back: |
      Breaking a covalent bond between monomers by adding water: one fragment receives –H, the other –OH. Releases energy. Digestion is hydrolysis.
    hint: The word lysis means splitting.
    topic_code: "1.3"
  - front: Monomer and polymer
    back: |
      A monomer is one building block (a monosaccharide, an amino acid, a nucleotide); a polymer is a chain of monomers joined by covalent bonds. Lipids are the exception: not true polymers.
    topic_code: "1.3"
  - front: Which three macromolecule classes are true polymers?
    back: |
      Carbohydrates (polysaccharides of sugars), proteins (polypeptides of amino acids) and nucleic acids (polynucleotides). Lipids are grouped by being hydrophobic, not by a repeating monomer.
    topic_code: "1.3"
  - front: Why can one kind of monomer produce polymers with different properties?
    back: |
      The properties depend on how the monomers are linked (which carbons, α or β orientation, branching), not only on which monomer is used. Glucose makes both starch and cellulose.
    topic_code: "1.3"
  - front: Monosaccharide
    back: |
      A single sugar with the general formula (CH₂O)ₙ, three to seven carbons, a carbonyl group and several hydroxyl groups. Glucose, fructose, galactose, ribose.
    topic_code: "1.4"
  - front: Glucose, fructose and galactose → how are they related?
    back: |
      All are C₆H₁₂O₆: isomers. They differ in the position of the carbonyl group (glucose and galactose are aldoses, fructose a ketose) or the arrangement of hydroxyl groups, so enzymes treat them differently.
    topic_code: "1.4"
  - front: Aldose vs ketose
    back: |
      An aldose has its carbonyl at the end of the chain (an aldehyde, as in glucose); a ketose has it inside the chain (a ketone, as in fructose).
    topic_code: "1.4"
  - front: Glycosidic linkage
    back: |
      The covalent bond between two sugar molecules formed by dehydration synthesis. Named by the carbons joined (1-4, 1-6) and the orientation of the carbon-1 hydroxyl (α or β).
    topic_code: "1.4"
  - front: α versus β linkage
    back: |
      In the ring form of glucose the –OH on carbon 1 points below the ring (α) or above it (β). α 1-4 chains can coil; β 1-4 chains are straight because every second glucose is flipped.
    hint: Alpha = below, beta = above.
    topic_code: "1.4"
  - front: Maltose, lactose, sucrose → the monomers of each
    back: |
      Maltose = glucose + glucose (malt, from starch digestion). Lactose = glucose + galactose (milk). Sucrose = glucose + fructose (table sugar).
    topic_code: "1.4"
  - front: Starch
    back: |
      The plant glucose store. Amylose is an unbranched α 1-4 chain that coils into a helix; amylopectin adds α 1-6 branches. Human amylase hydrolyses both.
    topic_code: "1.4"
  - front: Glycogen
    back: |
      The animal glucose store, in liver and muscle. Like amylopectin but more highly branched, so there are many chain ends from which glucose can be released quickly.
    topic_code: "1.4"
  - front: Why does branching make a storage polysaccharide release glucose faster?
    back: |
      Enzymes that free glucose work from chain ends. A branched molecule has many ends, so many enzymes can work at once and glucose appears quickly when blood sugar falls.
    topic_code: "1.4"
  - front: Cellulose
    back: |
      The plant cell-wall polymer: straight β 1-4 glucose chains that hydrogen-bond side by side into rigid microfibrils. The most abundant natural polymer. Indigestible to humans.
    topic_code: "1.4"
  - front: Why can't humans digest cellulose when they digest starch easily?
    back: |
      Human enzymes recognise only the α 1-4 glycosidic linkage of starch. Cellulose's β 1-4 link does not fit them. Cows and termites rely on microbes that make cellulase.
    topic_code: "1.4"
  - front: Chitin
    back: |
      A nitrogen-containing polysaccharide (N-acetylglucosamine units) that forms arthropod exoskeletons and fungal cell walls. Structural, like cellulose.
    topic_code: "1.4"
  - front: Energy per gram → carbohydrate vs fat
    back: |
      Carbohydrate about 4 kcal/g; fat about 9 kcal/g. Fat stores more than twice the energy per gram and, being hydrophobic, carries no bound water, so it is the lighter long-term store.
    topic_code: "1.5"
  - front: Triglyceride
    back: |
      Glycerol (a three-carbon alcohol) joined to three fatty acids by ester bonds, with three water molecules released. The main energy-storage lipid.
    topic_code: "1.5"
  - front: Fatty acid
    back: |
      A long hydrocarbon chain (usually 12-18 carbons) ending in a carboxyl group. The chain is nonpolar; the carboxyl end is polar.
    topic_code: "1.5"
  - front: Saturated fatty acid → structure and physical state
    back: |
      No C=C double bonds; every carbon carries as many hydrogens as it can. The chain is straight, so molecules pack tightly and the fat is solid at room temperature (butter, lard).
    topic_code: "1.5"
  - front: Unsaturated fatty acid → structure and physical state
    back: |
      One (mono-) or more (poly-) C=C double bonds. A cis double bond puts a kink in the chain, so molecules cannot pack and the fat is liquid at room temperature (olive, canola oils).
    topic_code: "1.5"
  - front: Why are trans fats solid even though they are unsaturated?
    back: |
      A trans double bond keeps the chain straight, so trans fatty acids pack like saturated ones. They are made by artificial hydrogenation and raise LDL cholesterol.
    hint: It is the kink, not the double bond, that matters.
    topic_code: "1.5"
  - front: Essential fatty acid
    back: |
      A fatty acid the body needs but cannot make, so it must come from food. Omega-3 fatty acids (a double bond three carbons from the chain's end) are the main example.
    topic_code: "1.5"
  - front: Phospholipid
    back: |
      Glycerol with two fatty-acid tails and a phosphate-containing head. The head is charged and hydrophilic; the tails are hydrophobic.
    topic_code: "1.5"
  - front: Amphipathic
    back: |
      Having both a hydrophilic region and a hydrophobic region in one molecule. Phospholipids are amphipathic, which is why they self-assemble into bilayers in water.
    topic_code: "1.5"
  - front: Why do phospholipids form a bilayer in water?
    back: |
      Water hydrogen-bonds to the charged heads but excludes the nonpolar tails. The arrangement that satisfies both is two layers with heads facing water and tails hidden inside. No energy input is needed.
    topic_code: "1.5"
  - front: Steroid
    back: |
      A lipid built on four fused carbon rings. Cholesterol is the common example; it is also the precursor of testosterone, estradiol, cortisol, vitamin D and bile salts.
    topic_code: "1.5"
  - front: What does cholesterol do in an animal cell membrane?
    back: |
      It sits among the phospholipid tails and moderates fluidity: it keeps the membrane from becoming too rigid when cold and too loose when warm.
    topic_code: "1.5"
  - front: Wax
    back: |
      A long-chain fatty acid esterified to a long-chain alcohol. Strongly hydrophobic; the waterproof coating on leaves, fruit and feathers.
    topic_code: "1.5"

quiz:
  description: |
    22 questions · about 25 minutes · about 70% this week (macromolecules, carbohydrates, lipids) and 30% review
    of water and the elements of life. Multiple choice, select-all, true/false and numeric items are graded at once;
    the fill-in-the-blank items are matched automatically; the two short answers and the long answer are graded by
    your teacher against the acceptable-answer summary.
  questions:
    - slug: u01-w02-q01
      type: multiple_choice
      topic_code: "1.3"
      source: "Biology 2e §3.1 Synthesis of Biological Macromolecules"
      points: 1
      prompt: |
        Two glucose molecules are joined to form maltose. Which description of the reaction is correct?
      options:
        - "A water molecule is removed, with –H coming from one glucose and –OH from the other, and a covalent bond forms between them."
        - "A water molecule is added across the bond between the two sugars, splitting one into two."
        - "The two glucose molecules are held together by hydrogen bonds between their hydroxyl groups."
        - "One glucose transfers an electron to the other, forming an ionic bond."
      option_explanations:
        - |
          Correct. This is dehydration synthesis: the removed water is built from pieces of both monomers, and the glycosidic linkage that forms is covalent.
        - |
          Adding water to split a bond is hydrolysis, the reverse of what the question describes; it would turn maltose back into two glucoses.
        - |
          Hydrogen bonds are weak and reversible and could not hold a polymer together through digestion and transport; the link in a disaccharide is a covalent glycosidic bond.
        - |
          Sugars share electrons rather than transferring them; the bond is covalent, with no ions formed.
      answer: 0
      explanation: |
        Every polymer in this unit is built by dehydration synthesis and taken apart by hydrolysis. Picture water leaving when a bond forms and returning when it breaks.

    - slug: u01-w02-q02
      type: multiple_choice
      topic_code: "1.4"
      source: "Biology 2e §3.2 Carbohydrates"
      points: 1
      prompt: |
        Starch and cellulose are both polymers of glucose, yet a potato is food and a wooden table is not. Which difference is responsible?
      options:
        - "Starch contains more glucose units per chain than cellulose."
        - "Starch is joined by α 1-4 glycosidic linkages that human enzymes can hydrolyse; cellulose is joined by β 1-4 linkages that they cannot."
        - "Cellulose is a polymer of galactose rather than glucose."
        - "Starch molecules are polar and cellulose molecules are nonpolar."
      option_explanations:
        - |
          Chain length is not the issue; cellulose chains are often longer than starch chains, and length does not decide whether an enzyme can act.
        - |
          Correct. The orientation of the carbon-1 hydroxyl (α down, β up) changes the shape of the link, and human digestive enzymes fit only the α form.
        - |
          Both are pure glucose. The monomer is identical; only the linkage geometry differs.
        - |
          Both polymers are made of the same polar hydroxyl-rich sugar; polarity is not what separates them, and cellulose's insolubility comes from chain packing, not from being nonpolar.
      answer: 1
      explanation: |
        One monomer, two linkages, two functions: the central idea of topic 1.4. The β link also makes straight chains that hydrogen-bond into fibres, which is why cellulose is a good wall.

    - slug: u01-w02-q03
      type: multiple_choice
      topic_code: "1.4"
      source: "Biology 2e §3.2 Carbohydrates"
      points: 1
      prompt: |
        When blood glucose falls, liver cells must release glucose quickly. Glycogen is highly branched. How does branching serve this need?
      options:
        - "Branches make the molecule more soluble, so glucose diffuses out of the cell faster."
        - "Branches create many chain ends, so many enzymes can release glucose at the same time."
        - "Branches store more energy per glucose unit than straight chains do."
        - "Branches prevent the molecule from being hydrolysed until a hormone signal arrives."
      option_explanations:
        - |
          Glycogen is released as free glucose after enzymatic hydrolysis, not as whole glycogen; solubility of the polymer is not the limiting step.
        - |
          Correct. The enzymes that free glucose work from the non-reducing ends of chains; a branched molecule has many such ends, so release is fast.
        - |
          Each glucose unit holds the same energy whether the chain is branched or not; branching changes the rate of release, not the amount stored.
        - |
          Branching does not block enzymes; hormones such as glucagon control the enzymes, not the geometry of the molecule.
      answer: 1
      explanation: |
        Structure to function: a sprinting muscle or a fasting liver needs glucose now, and a many-ended molecule is the way to supply it.

    - slug: u01-w02-q04
      type: multiple_choice
      topic_code: "1.5"
      source: "Biology 2e §3.3 Lipids"
      points: 1
      prompt: |
        Butter is solid at 20 °C and olive oil is liquid at the same temperature. Which molecular explanation is best?
      options:
        - "Butter's fatty acids are mostly saturated and straight, so they pack closely; olive oil's are mostly cis-unsaturated and kinked, so they cannot."
        - "Olive oil contains shorter fatty acids than butter, so its molecules are too small to be solid."
        - "Butter contains cholesterol, which locks its fatty acids into a crystal."
        - "Olive oil's fatty acids carry more hydrogen atoms, which repel one another and keep the oil liquid."
      option_explanations:
        - |
          Correct. Close packing lets weak attractions between chains add up, so more heat is needed to separate them; a kink at each cis double bond prevents that packing.
        - |
          Both fats are built mainly from 16- and 18-carbon fatty acids; chain length is similar and does not explain the difference.
        - |
          Butter does contain a little cholesterol, but the solid state comes from the fatty acids themselves; plant fats with no cholesterol can also be solid (cocoa butter).
        - |
          Reversed: unsaturated fatty acids carry fewer hydrogens, and hydrogen atoms do not repel one another in a way that keeps a fat liquid.
      answer: 0
      explanation: |
        Saturation decides packing, packing decides melting point. The same reasoning explains membrane fluidity in Unit 2.

    - slug: u01-w02-q05
      type: multiple_choice
      topic_code: "1.5"
      source: "Biology 2e §3.3 Lipids"
      points: 1
      prompt: |
        Phospholipids placed in water spontaneously form a bilayer with no energy input. Which property of the molecules and of water explains this?
      options:
        - "Phospholipids are entirely hydrophobic, so they clump together away from water."
        - "Phospholipids are amphipathic: water attracts the charged heads and excludes the nonpolar tails, so heads face outward and tails hide inside."
        - "Phospholipids form covalent bonds with each other, building a sheet."
        - "Water forms hydrogen bonds with the fatty-acid tails, pulling them into two layers."
      option_explanations:
        - |
          An entirely hydrophobic molecule would form a droplet, as oil does; it is the water-loving head that forces the layered arrangement.
        - |
          Correct. The bilayer is the only arrangement that satisfies both regions of the molecule at once, so it forms on its own, which is why membranes self-assemble.
        - |
          Phospholipids in a membrane are not covalently linked to each other; they are held by the same hydrophobic exclusion and can drift past one another.
        - |
          Water cannot hydrogen-bond to nonpolar hydrocarbon tails; it hydrogen-bonds to the phosphate heads, which is why the tails end up inside.
      answer: 1
      explanation: |
        This is week 1's hydrophobic exclusion applied to a molecule with two faces. Carry the picture into topic 2.3, where the bilayer becomes the plasma membrane.

    - slug: u01-w02-q06
      type: multiple_choice
      topic_code: "1.3"
      source: "Biology 2e §3.1 Synthesis of Biological Macromolecules"
      points: 1
      prompt: |
        A student tests a food sample by adding the digestive enzyme amylase and later detects maltose and glucose. Which conclusion is justified?
      options:
        - "The sample contained starch, which amylase hydrolysed into smaller sugars."
        - "The sample contained cellulose, which amylase hydrolysed into smaller sugars."
        - "Amylase joined free glucose molecules in the sample into maltose."
        - "The sample contained protein, which amylase broke into amino acids."
      option_explanations:
        - |
          Correct. Amylase hydrolyses the α 1-4 links of starch, releasing maltose and glucose; detecting those products after the enzyme implies the substrate was present.
        - |
          Amylase cannot act on cellulose's β 1-4 links, so a cellulose sample would yield no maltose or glucose.
        - |
          Enzymes are specific to a reaction direction in the cell's conditions; amylase catalyses hydrolysis, and in a digestive test the products are smaller than the substrate, not larger.
        - |
          Proteases, not amylase, hydrolyse proteins, and the products would be amino acids, not sugars.
      answer: 0
      explanation: |
        Enzymes are specific to both the substrate and the linkage. Products identify substrates: maltose and glucose point to starch.

    - slug: u01-w02-q07
      type: multiple_choice
      topic_code: "1.5"
      source: "Biology 2e §3.3 Lipids"
      points: 1
      prompt: |
        A migrating bird stores fuel before a long flight. Compared with storing the same energy as glycogen, storing it as fat offers which advantage?
      options:
        - "Fat releases energy faster than glycogen when the bird needs it."
        - "Fat holds more than twice the energy per gram and carries no bound water, so the store is lighter."
        - "Fat is water-soluble, so it can be carried dissolved in the blood."
        - "Fat can be converted directly into protein for building muscle."
      option_explanations:
        - |
          The reverse is true: glycogen's branches let glucose be released quickly, which is why muscles keep glycogen for sprints and fat for the long haul.
        - |
          Correct. About 9 kcal/g versus 4 kcal/g, and the hydrophobic store is not hydrated the way glycogen is, so the same energy weighs far less.
        - |
          Fats are hydrophobic and are transported in the blood only when packaged in lipoproteins; they do not dissolve.
        - |
          Fatty acids cannot be turned into amino acids in animals; protein must come from the diet.
      answer: 1
      explanation: |
        Two features of nonpolar molecules combine here: high energy content in C–H bonds and no hydration shell to carry.

    - slug: u01-w02-q08
      type: multiple_choice
      topic_code: "1.4"
      source: "Biology 2e §3.2 Carbohydrates"
      points: 1
      prompt: |
        Glucose and fructose both have the formula C₆H₁₂O₆, yet enzymes that act on glucose generally ignore fructose. What is the best explanation?
      options:
        - "Fructose contains more energy than glucose, so enzymes cannot handle it."
        - "They are structural isomers: the carbonyl group sits at a different carbon, giving each a different shape that enzymes distinguish."
        - "Fructose is an ionic compound and glucose is covalent."
        - "Glucose is a hexose and fructose is a pentose."
      option_explanations:
        - |
          Both sugars release almost the same energy per molecule; enzyme specificity is a matter of shape, not of energy content.
        - |
          Correct. Glucose is an aldose (carbonyl on carbon 1) and fructose a ketose (carbonyl on carbon 2); the different arrangement gives a different 3-D shape, and enzymes bind by shape.
        - |
          Both are covalent molecules built of C, H and O; neither forms ions.
        - |
          Both have six carbons, as the formula shows; the difference is arrangement, not carbon count.
      answer: 1
      explanation: |
        Same formula, different arrangement, different behaviour: isomers from week 1 explain why "C₆H₁₂O₆" is not enough to name a sugar.

    - slug: u01-w02-q09
      type: multiple_choice
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        Review. Cellulose microfibrils are strong partly because neighbouring straight chains are held together along their length. Which interaction holds them, and what feature of glucose makes it possible?
      options:
        - "Covalent glycosidic bonds between the chains, made possible by glucose's carbonyl group."
        - "Hydrogen bonds between the chains, made possible by glucose's many hydroxyl groups."
        - "Ionic bonds between the chains, made possible by charged phosphate groups on glucose."
        - "Hydrophobic interactions, made possible by glucose being nonpolar."
      option_explanations:
        - |
          Glycosidic bonds join glucose units within a chain; between chains there are no covalent links, which is why fibres can be separated without breaking the polymer.
        - |
          Correct. Each glucose carries several polar –OH groups whose hydrogens and oxygens hydrogen-bond to the –OH groups of adjacent chains, and the straight β 1-4 geometry lets the chains lie close enough for many such bonds.
        - |
          Glucose has no phosphate groups and carries no charge; ionic bonding is not available.
        - |
          Glucose is highly polar because of its hydroxyl groups; hydrophobic interaction is what nonpolar tails do, not sugars.
      answer: 1
      explanation: |
        Week 1's hydrogen bonding is doing structural work here: many weak bonds along a straight chain add up to a fibre that holds up a tree.

    - slug: u01-w02-q10
      type: multiple_choice
      topic_code: "1.2"
      source: "Biology 2e §2.3 Carbon"
      points: 1
      prompt: |
        Review. A fatty acid is almost entirely a hydrocarbon chain, with a single carboxyl group at one end. Which statement about its behaviour in water follows from that structure?
      options:
        - "The whole molecule dissolves readily because the carboxyl group is polar."
        - "The hydrocarbon chain is nonpolar and is excluded by water, while the carboxyl end is polar and interacts with it."
        - "The hydrocarbon chain forms hydrogen bonds with water because C–H bonds are polar."
        - "The molecule ionises completely, making it as soluble as table salt."
      option_explanations:
        - |
          One polar group cannot carry a chain of 16 or more nonpolar carbons into solution; fatty acids are poorly soluble, which is why fats float on water.
        - |
          Correct. C–H bonds are nonpolar (carbon and hydrogen have similar electronegativity), so the chain is hydrophobic; only the carboxyl end is hydrophilic.
        - |
          C–H bonds are nonpolar because carbon and hydrogen pull electrons about equally, so there are no partial charges for water to hydrogen-bond with.
        - |
          The carboxyl group can lose one H⁺, but that does not make the long nonpolar chain soluble; salt dissolves because every part of it is charged.
      answer: 1
      explanation: |
        Functional groups from week 1 predict behaviour: methyl and hydrocarbon regions are hydrophobic, carboxyl regions hydrophilic. A fatty acid is both, which is the seed of amphipathic behaviour.

    - slug: u01-w02-q11
      type: multiple_choice
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        Review. During dehydration synthesis a water molecule is produced; during hydrolysis one is consumed. In a cell, which property of water is most directly relevant to hydrolysis being possible everywhere in the cytoplasm?
      options:
        - "Water's high specific heat keeps the reaction at a constant temperature."
        - "Water is the solvent in which the polymers and enzymes are dissolved or suspended, and it is present in vast excess as a reactant."
        - "Water's surface tension pulls the polymer apart."
        - "Water's low density allows it to slip between monomers."
      option_explanations:
        - |
          Specific heat matters for temperature stability, but the question is about why water is available for the reaction, not about heat.
        - |
          Correct. The cytoplasm is mostly water; polar polymers and enzymes are hydrated in it, and water molecules are always on hand to be inserted across a bond.
        - |
          Surface tension is a property of a water surface in contact with air; it does not act on dissolved molecules.
        - |
          Liquid water is not low in density, and density has nothing to do with how water takes part in a reaction.
      answer: 1
      explanation: |
        Water is both solvent and reactant in the cell. Week 1's "solvent of life" is why week 2's hydrolysis reactions can happen anywhere.

    - slug: u01-w02-q12
      type: multi_select
      topic_code: "1.4"
      source: "Biology 2e §3.2 Carbohydrates"
      points: 2
      partial_credit: true
      prompt: |
        Select every statement that correctly pairs a polysaccharide with its structure and role.
      options:
        - "Amylose: unbranched α 1-4 glucose chain that coils; plant energy store"
        - "Glycogen: highly branched α 1-4/α 1-6 glucose polymer; animal energy store in liver and muscle"
        - "Cellulose: straight β 1-4 glucose chains in hydrogen-bonded fibres; plant cell wall"
        - "Chitin: branched α 1-6 polymer of fructose; animal energy store"
        - "Amylopectin: unbranched β 1-4 glucose chain; insect exoskeleton"
      option_explanations:
        - |
          Correct. Amylose is the unbranched component of starch; its α links let the chain coil into a helix that packs glucose compactly.
        - |
          Correct. Glycogen's many branches give many chain ends, so glucose is released quickly when it is needed.
        - |
          Correct. The β link flips alternate glucoses and makes a straight ribbon; ribbons hydrogen-bond into microfibrils that resist stretching.
        - |
          Chitin is a structural polymer of a nitrogen-containing glucose derivative, found in exoskeletons and fungal walls, not a fructose energy store.
        - |
          Amylopectin is the branched α-linked component of starch, a plant energy store; β links and exoskeletons belong to other polymers.
      answer: [0, 1, 2]
      explanation: |
        The storage polymers are all α-linked and can coil or branch; the structural ones (cellulose, chitin) are β-linked and straight. Linkage predicts role.

    - slug: u01-w02-q13
      type: multi_select
      topic_code: "1.5"
      source: "Biology 2e §3.3 Lipids"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are true of a phospholipid? Select all that apply.
      options:
        - "It has a glycerol backbone with two fatty-acid tails and a phosphate-containing head."
        - "Its tails are hydrophobic and its head is hydrophilic."
        - "It is a polymer of repeating phosphate units."
        - "In water it assembles into a bilayer with tails facing inward."
        - "It stores more energy per gram than a triglyceride."
      option_explanations:
        - |
          Correct. Compared with a triglyceride, one fatty acid is replaced by a phosphate group, which is what gives the molecule its polar head.
        - |
          Correct. The hydrocarbon tails are nonpolar; the phosphate head is charged, so the two regions behave oppositely toward water.
        - |
          A phospholipid is a single molecule with one phosphate group; lipids are not polymers of repeating units.
        - |
          Correct. Hydrophobic exclusion drives the tails together and the heads toward the water on each face; no energy input is needed.
        - |
          A triglyceride has three energy-rich tails to a phospholipid's two, and phospholipids are membrane components rather than energy stores.
      answer: [0, 1, 3]
      explanation: |
        A phospholipid is defined by its two faces. Everything about membranes in Unit 2 follows from heads that love water and tails that avoid it.

    - slug: u01-w02-q14
      type: true_false
      topic_code: "1.3"
      source: "Biology 2e §3.1 Synthesis of Biological Macromolecules"
      points: 1
      prompt: |
        True or false: Hydrolysis reactions require an input of energy, while dehydration synthesis reactions release energy.
      answer: false
      explanation: |
        False, it is the other way round. Building a polymer by dehydration synthesis stores energy in new covalent bonds and must be driven by an energy input (ultimately ATP); hydrolysis breaks those bonds and releases energy, which is why digestion gives the body usable fuel. Both directions are catalysed by enzymes.

    - slug: u01-w02-q15
      type: true_false
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        Review. True or false: Water expands when it freezes because the hydrogen bonds in ice hold the molecules in a fixed lattice that is more open than the arrangement in the liquid.
      answer: true
      explanation: |
        True. In liquid water hydrogen bonds constantly break and re-form and molecules can crowd closer; in ice each molecule is locked into four hydrogen bonds at fixed angles, which spaces the molecules farther apart. The lower density is why ice floats and why a frozen bottle cracks. The common wrong intuition is that freezing always packs molecules more tightly.

    - slug: u01-w02-q16
      type: fill_blank
      topic_code: "1.3"
      source: "Biology 2e §3.1 Synthesis of Biological Macromolecules"
      points: 1
      prompt: |
        Digestive enzymes such as amylase, lipase and the proteases break polymers into monomers by inserting a water molecule across each bond, a reaction called ____.
      answer: ["hydrolysis"]
      explanation: |
        Hydro (water) plus lysis (splitting): water is the reagent that breaks the bond, with –H going to one fragment and –OH to the other. "Digestion" names the process in the body, not the reaction, and "dehydration synthesis" is the reverse, so neither is accepted.

