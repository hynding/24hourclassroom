      prompt: |
        Fat yields about 9 kcal per gram and carbohydrate about 4 kcal per gram. A hibernating animal needs to store 36,000 kcal. How many fewer grams does it carry by storing that energy as fat rather than as carbohydrate? Ignore bound water.
      answer: { value: 5000, tolerance: 100 }
      explanation: |
        As fat: 36,000 ÷ 9 = 4,000 g. As carbohydrate: 36,000 ÷ 4 = 9,000 g. Difference: 9,000 − 4,000 = 5,000 g. Including the water that glycogen binds would make the real gap even larger, which is why long-term energy stores in animals are fat.

    - slug: u01-w02-q20
      type: short_answer
      topic_code: "1.4"
      source: "Biology 2e §3.2 Carbohydrates"
      points: 4
      prompt: |
        Conceptual analysis. Starch and cellulose are both made entirely of glucose. (a) Describe the structural difference between the two polymers at the level of the glycosidic linkage. (b) Explain how that difference leads to cellulose forming rigid fibres while starch does not. (c) Explain why a cow can obtain energy from grass but a human cannot. (d) Predict what would happen to a plant cell if its wall were built from amylose instead of cellulose, and justify your prediction.
      answer: |
        Starch has α 1-4 (and α 1-6) linkages; cellulose has β 1-4 linkages. The β link flips alternate glucoses, giving straight chains that hydrogen-bond side by side into fibres, whereas α chains coil. Cows host microbes with cellulase; human enzymes fit only α links. An amylose wall would be weak and water-soluble, and the cell would burst or collapse under osmotic stress.
      explanation: |
        Four points, one per task.

        (a) Describe, 1 pt: starch is α-linked (carbon-1 hydroxyl below the ring) and cellulose β-linked (above the ring); accept "α 1-4 versus β 1-4" or a description of alternate glucoses being flipped in cellulose. Naming branching alone (amylopectin's α 1-6) without the α/β difference earns nothing.

        (b) Explain, 1 pt: the β linkage makes a straight, unbranched chain; straight chains lie against each other and form many hydrogen bonds between their hydroxyl groups, producing microfibrils. Starch's α linkage makes a coiled or branched chain that cannot stack this way. Both halves (straightness and hydrogen bonding between chains) are needed for the point; "cellulose is stronger" alone is a restatement.

        (c) Explain, 1 pt: human digestive enzymes hydrolyse only α glycosidic links; the cow's rumen contains microbes that secrete cellulase, which hydrolyses β 1-4 links, and the cow absorbs the products. Accept "symbiotic bacteria" or "mutualistic microbes". An answer that says cows have "stronger stomach acid" earns nothing.

        (d) Predict and justify, 1 pt: the wall would be weak (coiled chains do not form fibres) and would be digested by the plant's own amylase or dissolve in water, so the cell could not resist turgor pressure and would swell or burst, or would lose its shape. The justification must connect the α linkage's coiling or solubility to the loss of mechanical strength.

        Zero: answers that say the two differ in the monomer, or attribute the difference to chain length or to one being "a sugar" and the other "a fibre" with no linkage chemistry.

    - slug: u01-w02-q21
      type: short_answer
      topic_code: "1.5"
      source: "Biology 2e §3.3 Lipids"
      points: 4
      prompt: |
        Analyze a model. The diagram a student drew of a cell membrane shows a single layer of phospholipids with their phosphate heads facing the cytoplasm and their fatty-acid tails facing the extracellular fluid. (a) Identify two errors in the model. (b) Describe the correct arrangement. (c) Explain, in terms of the properties of water and of the phospholipid, why the correct arrangement forms spontaneously.
      answer: |
        Errors: one layer instead of two, and tails facing water. Correct: a bilayer, heads facing the watery cytoplasm and extracellular fluid on both faces, tails hidden in the middle. Water hydrogen-bonds to the charged heads and excludes the nonpolar tails, so the bilayer is the arrangement that satisfies both regions.
      explanation: |
        Four points.

        (a) Identify, 1 pt for both errors: the membrane is a bilayer, not a monolayer; and hydrophobic tails cannot face the aqueous extracellular fluid. Half credit is not available; a single error identified earns zero for this part but the student can still earn (b) and (c).

        (b) Describe, 1 pt: two layers with phosphate heads facing outward toward both aqueous compartments (cytoplasm and extracellular fluid) and tails pointing toward each other in the interior. Accept a correctly labelled drawing described in words.

        (c) Explain, 2 pts: 1 pt for the water side: water is polar and hydrogen-bonds to the charged phosphate heads but cannot interact with the nonpolar hydrocarbon tails (hydrophobic exclusion); 1 pt for the consequence: the only stable arrangement in which every head touches water and no tail does is a bilayer, so it forms without energy input (self-assembly). Accept "amphipathic" as shorthand if the student also says which part faces water.

        Zero: answers that fix the drawing without explaining why, or that attribute the bilayer to covalent bonds between phospholipids or to proteins holding them in place.

    - slug: u01-w02-q22
      type: long_answer
      topic_code: "1.5"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. A student measured the melting point of four pure fatty acids to test the claim that "the more double bonds a fatty acid has, the lower its melting point."

        | Fatty acid | Carbons | C=C double bonds | Geometry of double bonds | Melting point (°C) |
        |---|---|---|---|---|
        | Palmitic | 16 | 0 | — | 63 |
        | Stearic | 18 | 0 | — | 69 |
        | Oleic | 18 | 1 | cis | 13 |
        | Elaidic | 18 | 1 | trans | 45 |

        (a) Identify the independent and dependent variables, and state one variable the student controlled and one the student did not.
        (b) Describe the pattern in the data for the three 18-carbon fatty acids.
        (c) Evaluate whether the data support the claim as stated, and explain the molecular reason for the difference between oleic and elaidic acid.
        (d) Propose a modification to the claim that the data do support, and describe one additional fatty acid the student should test to check it, with a predicted result.
      answer: |
        IV: number and geometry of double bonds; DV: melting point; chain length was controlled among the three 18-carbon acids but not for palmitic. Among the C18 acids, stearic (0) melts highest, elaidic (1 trans) lower, oleic (1 cis) lowest. The claim is only partly supported: the cis bond's kink prevents packing, lowering the melting point, but the trans bond keeps the chain straight so the drop is small; the number of double bonds alone does not predict melting point. Revised claim: each cis double bond lowers the melting point; test linoleic acid (C18, 2 cis) and predict a melting point below 13 °C.
      explanation: |
        Eight points.

        (a) 2 pts: 1 pt for independent variable = the number (and geometry) of double bonds and dependent variable = melting point; 1 pt for a controlled variable (chain length at 18 carbons for stearic, oleic and elaidic; purity of the sample) and an uncontrolled one (chain length differs for palmitic at 16 carbons; or geometry of the double bond varies between oleic and elaidic, so two variables change at once in that comparison).

        (b) 1 pt: among the 18-carbon acids, melting point falls from 69 °C (no double bond) to 45 °C (one trans) to 13 °C (one cis); the student must give the ordering with at least two numbers or a clear comparison. Noting that palmitic and stearic show chain length raising melting point is a bonus observation, not required.

        (c) 3 pts: 1 pt for the evaluation: the claim is only partly supported because oleic and elaidic have the same number of double bonds yet melt 32 °C apart, so the number of double bonds alone does not determine melting point; 1 pt for the cis mechanism: a cis double bond introduces a kink, kinked chains cannot pack closely, weak intermolecular attractions are fewer, so less heat separates the molecules; 1 pt for the trans mechanism: a trans double bond leaves the chain nearly straight, so the molecules pack almost like a saturated acid and the melting point stays high. Accept "van der Waals interactions" or "intermolecular forces" for the attractions.

        (d) 2 pts: 1 pt for a revised claim consistent with the data, e.g. "each cis double bond lowers the melting point" or "melting point depends on how well chains pack, which cis double bonds disrupt"; 1 pt for a sensible additional test with a prediction, e.g. linoleic acid (18 carbons, two cis double bonds) predicted to melt below 13 °C, or a trans acid with two double bonds predicted to stay well above oleic. The test must hold chain length at 18 carbons or the student must say why not.

        Zero for a part: restating the table without a comparison; explaining the data by "unsaturated fats are healthier"; attributing the difference to the number of hydrogen atoms rather than to chain shape and packing; proposing a test that changes chain length without acknowledging the confound.

