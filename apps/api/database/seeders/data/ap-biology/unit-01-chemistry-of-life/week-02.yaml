      prompt: |
        Review. Glycerol, a three-carbon molecule with three hydroxyl groups, dissolves freely in water, whereas propane, a three-carbon hydrocarbon of similar size, barely dissolves at all. Which explanation is best?
      options:
        - "Glycerol's hydroxyl groups are polar and hydrogen-bond with water, so water molecules surround and disperse it; propane has only nonpolar C–H bonds and is excluded."
        - "Glycerol is lighter than propane, and lighter molecules dissolve more easily."
        - "Propane is a gas, and gases cannot dissolve in liquids."
        - "Glycerol ionises in water into charged fragments, as salt does."
      option_explanations:
        - |
          Correct. Each –OH group has a δ⁻ oxygen and a δ⁺ hydrogen that water can hydrogen-bond to, so glycerol is hydrophilic; propane offers water nothing to bond with and is pushed out by water's attraction to itself.
        - |
          Glycerol (92 g/mol) is heavier than propane (44 g/mol), and mass is not what decides solubility in water; polarity is.
        - |
          Many gases dissolve in water (oxygen and carbon dioxide must, or fish and plants would die); the state of the substance is not the explanation.
        - |
          Glycerol stays a neutral molecule in water. It dissolves through hydrogen bonding, not through forming ions.
      answer: 0
      explanation: |
        "Like dissolves like" is really "hydrogen bonding dissolves": a substance is hydrophilic when water can bond to it. That is why the hydroxyl-rich glycerol backbone of a fat is polar even though its fatty-acid tails are not.
