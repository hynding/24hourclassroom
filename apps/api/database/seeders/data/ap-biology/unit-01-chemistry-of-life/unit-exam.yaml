      (e) Predict the activity you would expect if the enzyme were held at pH 7 for 30 minutes and then assayed at 37 °C and pH 2. Justify your prediction and describe what result would refute it.
    answer: |
      Activity rises from 10 to 37 °C, peaks at 37 °C (71 units), and falls to 9 at 60 °C. Warming increases molecular motion and collision rate; above the optimum, heat breaks the weak interactions holding tertiary structure and the active site deforms. At pH 7, acidic and basic R groups in the active site carry the wrong charges, so ionic bonds that shape the site are lost; a low-pH optimum means the enzyme works in the stomach. The 60 °C effect is largely irreversible: after cooling, activity is 6, far below the 71 seen at 37 °C. Prediction: near-full recovery (about 71) after a pH 7 exposure, because pH changes alter R-group charges without aggregating the protein, so restoring pH 2 restores the fold; activity well below 71 would refute it.
    explanation: |
      Eight points.

      (a) 1 pt: activity rises with temperature from 10 °C to a maximum at 37 °C (71 units), then falls, steeply by 60 °C (9 units). Must name 37 °C as the optimum and give the shape of the curve with at least one number.

      (b) 2 pts: 1 pt for the rise: higher temperature means faster molecular motion, more frequent and more energetic collisions between enzyme and substrate, so the rate increases; 1 pt for the fall: above the optimum, thermal motion breaks the hydrogen bonds, ionic bonds and hydrophobic interactions that hold the tertiary structure, the active site loses its shape (denaturation) and substrate no longer fits. Naming "denaturation" without saying which bonds or structure are affected earns the second point only if the loss of active-site shape is mentioned.

      (c) 2 pts: 1 pt for the mechanism: the charge on acidic (carboxyl) and basic (amino) R groups depends on H⁺ concentration; at pH 7 some R groups in or near the active site carry different charges than at pH 2, so the ionic bonds and hydrogen bonds that form the site's shape are not present and substrate binding or catalysis fails; 1 pt for the inference: an enzyme with a pH optimum near 2 works in the stomach, where gastric acid keeps the pH at 1 to 2 (pepsin is the real example; the name is not required).

      (d) 2 pts: 1 pt for the conclusion that the heat effect is largely irreversible; 1 pt for the justification by comparison: the heated sample assayed under optimum conditions (37 °C, pH 2) gave only 6 units, versus 71 for the unheated enzyme under the same conditions, so cooling did not restore activity; the protein misfolded or aggregated. A student who says "partly reversible" because 6 is slightly above the 60 °C reading of 9 has misread the comparison and earns the first point only.

      (e) 1 pt: prediction that activity recovers to near 71 units (accept any value close to the optimum), justified by the argument that a pH change alters R-group charges without breaking covalent bonds or causing aggregation, so restoring pH 2 restores the ionic interactions and the fold; and a refuting result: activity remaining far below 71 after the pH exposure, which would indicate the pH 7 treatment caused irreversible unfolding. Both the justification and the refuting result are required for the point.

      Zero for a part: describing the data as "activity changes" without direction or numbers; explaining the fall at 60 °C as the enzyme "being used up" or "dying"; saying acid "activates" the enzyme without reference to R-group charge; concluding reversibility from the mere fact that the sample was cooled.
