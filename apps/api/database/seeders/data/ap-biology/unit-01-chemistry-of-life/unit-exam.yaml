  # ---- Free response
  - slug: u01-exam-q43
    type: short_answer
    topic_code: "1.5"
    source: "Biology 2e §3.3 Lipids"
    points: 4
    prompt: |
      Scientific investigation. A student wants to test the hypothesis that a cell membrane made mostly of saturated phospholipids will be less permeable to a small nonpolar dye at 10 °C than a membrane made mostly of unsaturated phospholipids. The student can make artificial vesicles (tiny membrane spheres) of either composition. (a) Describe an experimental procedure, including the independent and dependent variables and at least two controlled variables. (b) State the prediction that the hypothesis makes about the results. (c) Explain the molecular reasoning that connects fatty-acid saturation to the predicted difference.
    answer: |
      Make vesicles of each composition, place equal numbers in dye solution at 10 °C, measure dye inside the vesicles over time; IV = saturation of the phospholipids, DV = dye uptake; control temperature, dye concentration, vesicle size and number, time. Predict slower uptake in saturated vesicles. Saturated tails are straight and pack tightly, leaving fewer gaps for the dye to slip through; cis-unsaturated tails are kinked and pack loosely, so the membrane is more fluid and more permeable.
    explanation: |
      Four points.

      (a) Procedure, 2 pts: 1 pt for a workable design that names the independent variable (saturated versus unsaturated phospholipid composition of the vesicles) and the dependent variable (amount or rate of dye entering the vesicles, measured by colour inside the vesicles, or dye remaining outside, over a set time); 1 pt for at least two controlled variables from: temperature held at 10 °C, same dye concentration, same vesicle size and number, same volume, same time of measurement, same measuring method. Replication (several vesicle batches) is a bonus. A design with no measurable dependent variable earns 1 pt at most.

      (b) Prediction, 1 pt: vesicles made of saturated phospholipids will take up less dye (or take it up more slowly) than vesicles made of unsaturated phospholipids at 10 °C. The prediction must be directional and consistent with the hypothesis.

      (c) Reasoning, 1 pt: saturated fatty-acid tails are straight and pack closely, especially at low temperature, so the membrane is less fluid and has fewer transient gaps for a molecule to pass through; cis-unsaturated tails have kinks that prevent close packing, keeping the membrane fluid and more permeable. Either half with the connection to packing earns the point; naming "kinks" or "double bonds" without linking them to packing or fluidity does not.

      Zero: a hypothesis restated as a procedure; a design that varies temperature instead of composition; reasoning that says saturated fats are "thicker" or "heavier".

