unit: 1
description: |
  44 questions · about 60 minutes · every topic of Unit 1 (1.1 to 1.7), with two data-based stimulus sets, one
  short free-response item (4 points) and one long free-response item (8 points). Multiple choice, select-all,
  true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the two
  free-response items are graded by your teacher against the acceptable-answer summary.
questions:
  # ---- Stimulus set A: water potential-free osmosis-free -- an evaporation and surface-tension data set (1.1)
  - slug: u01-exam-q01
    type: multiple_choice
    topic_code: "1.1"
    source: "Biology 2e §2.2 Water"
    points: 1
    stimulus: |
      Students measured three properties of four liquids at 20 °C. Each value is the mean of three trials.

      | Liquid | Hydrogen-bonding groups per molecule | Surface tension (mN/m) | Mass lost by evaporation in 1 h from an open dish (g) | Temperature rise after 500 J added to 50 g (°C) |
      |---|---|---|---|---|
      | Water | 2 (O–H) | 72 | 0.9 | 2.4 |
      | Ethanol | 1 (O–H) | 22 | 4.1 | 4.1 |
      | Acetone | 0 | 24 | 7.6 | 4.6 |
      | Hexane | 0 | 18 | 9.8 | 4.4 |
    prompt: |
      Which conclusion about surface tension is best supported by the data?
    options:
      - "Surface tension rises with the number of hydrogen-bonding groups per molecule, consistent with cohesion from hydrogen bonds."
      - "Surface tension rises with the rate of evaporation."
      - "Surface tension is unrelated to molecular structure."
      - "Surface tension is highest in the liquid that heats up fastest."
    option_explanations:
      - |
        Correct. Water, with the most hydrogen-bonding groups, has by far the highest surface tension; ethanol with one is next; the two liquids with none are lowest. That ordering is what a cohesion explanation predicts.
      - |
        The relationship runs the other way: the liquid with the highest surface tension (water) evaporated least. Evaporation rate and surface tension both depend on intermolecular attraction, but they move in opposite directions.
      - |
        The data show a clear pattern between the hydrogen-bonding column and surface tension; saying there is no relationship ignores the table.
      - |
        Water had the smallest temperature rise, not the largest, and heating rate is governed by specific heat, a different property.
    answer: 0
    explanation: |
      Read down the hydrogen-bonding column and across to surface tension: the ordering matches. Choose the explanation that fits every row, not one that fits a single number.

  - slug: u01-exam-q02
    type: multiple_choice
    topic_code: "1.1"
    source: "Biology 2e §2.2 Water"
    points: 1
    stimulus: |
      Students measured three properties of four liquids at 20 °C. Each value is the mean of three trials.

      | Liquid | Hydrogen-bonding groups per molecule | Surface tension (mN/m) | Mass lost by evaporation in 1 h from an open dish (g) | Temperature rise after 500 J added to 50 g (°C) |
      |---|---|---|---|---|
      | Water | 2 (O–H) | 72 | 0.9 | 2.4 |
      | Ethanol | 1 (O–H) | 22 | 4.1 | 4.1 |
      | Acetone | 0 | 24 | 7.6 | 4.6 |
      | Hexane | 0 | 18 | 9.8 | 4.4 |
    prompt: |
      Water lost the least mass by evaporation and showed the smallest temperature rise. Which single molecular explanation accounts for both observations?
    options:
      - "Water molecules are heavier than the others, so they move more slowly."
      - "Energy added to water is used to break hydrogen bonds, so less goes into raising the temperature, and a molecule must break all its hydrogen bonds before it can escape the liquid."
      - "Water is a better conductor of heat than the other liquids."
      - "Water's molecules are smaller, so they fit into the dish more tightly."
    option_explanations:
      - |
        Water (18 g/mol) is the lightest of the four; by mass alone it should evaporate fastest and heat fastest, the opposite of what was seen.
      - |
        Correct. One cause, two effects: hydrogen bonding gives water both a high specific heat (small temperature rise per joule) and a high heat of vaporization (slow evaporation).
      - |
        Thermal conductivity affects how quickly heat spreads through a liquid, not how much its temperature rises for a given amount of heat.
      - |
        Molecular size does not explain either observation; acetone and hexane are larger molecules than water yet evaporated faster.
    answer: 1
    explanation: |
      Specific heat and heat of vaporization are two faces of one fact: hydrogen bonds absorb energy. A good answer names the shared cause rather than inventing two.

  - slug: u01-exam-q03
    type: multiple_choice
    topic_code: "1.5"
    source: "Biology 2e §3.3 Lipids"
    points: 1
    stimulus: |
      Students measured three properties of four liquids at 20 °C. Each value is the mean of three trials.

      | Liquid | Hydrogen-bonding groups per molecule | Surface tension (mN/m) | Mass lost by evaporation in 1 h from an open dish (g) | Temperature rise after 500 J added to 50 g (°C) |
      |---|---|---|---|---|
      | Water | 2 (O–H) | 72 | 0.9 | 2.4 |
      | Ethanol | 1 (O–H) | 22 | 4.1 | 4.1 |
      | Acetone | 0 | 24 | 7.6 | 4.6 |
      | Hexane | 0 | 18 | 9.8 | 4.4 |
    prompt: |
      A drop of olive oil is added to the dish of water and to the dish of hexane. Which prediction is best supported by the data and by the structure of a triglyceride?
    options:
      - "The oil dissolves in water because water has the highest surface tension."
      - "The oil dissolves in hexane but floats as a separate layer on water, because triglyceride tails are nonpolar like hexane and are excluded by hydrogen-bonded water."
      - "The oil dissolves in both liquids because it is a liquid at 20 °C."
      - "The oil dissolves in neither liquid because triglycerides are polymers."
    option_explanations:
      - |
        Surface tension does not make water a better solvent for nonpolar molecules; it is a sign of water's attraction to itself, which is exactly why oil is excluded.
      - |
        Correct. Hexane and the fatty-acid tails of a triglyceride are both hydrocarbons and mix freely; water's hydrogen bonds pull water molecules together and push the nonpolar oil out into a separate layer.
      - |
        Being liquid says nothing about miscibility; oil and water are both liquids and do not mix.
      - |
        Triglycerides are not polymers (glycerol plus three fatty acids), and in any case being a polymer does not prevent dissolving; cellulose, a polymer, is insoluble for other reasons.
    answer: 1
    explanation: |
      Like dissolves like, and the table tells you which liquids are "like": the two with no hydrogen-bonding groups behave like the oil's tails.

  # ---- Elements and bonding (1.2)
  - slug: u01-exam-q04
    type: multiple_choice
    topic_code: "1.2"
    source: "Biology 2e §2.1 Atoms, Isotopes, Ions, and Molecules"
    points: 1
    prompt: |
      Methane (CH₄) is nonpolar while water (H₂O) is polar, although both contain hydrogen bonded to a single central atom. Which comparison explains the difference?
    options:
      - "Carbon has more protons than oxygen and holds its electrons closer."
      - "Carbon and hydrogen have similar electronegativity so they share electrons about equally, whereas oxygen is far more electronegative than hydrogen and pulls the shared electrons toward itself."
      - "Methane has four bonds and water has two, and molecules with more bonds are always nonpolar."
      - "Water contains oxygen, and any molecule containing oxygen is polar."
    option_explanations:
      - |
        Oxygen has more protons (8) than carbon (6), and proton count alone does not set polarity; electronegativity, the pull on shared electrons, does.
      - |
        Correct. Bond polarity depends on the electronegativity difference between the two atoms; C–H is nearly even, O–H is lopsided, and water's bent shape keeps the two lopsided bonds from cancelling.
      - |
        Bond count does not decide polarity; carbon tetrachloride has four bonds and is nonpolar, but chloroform with four bonds is polar.
      - |
        Molecular oxygen (O₂) contains oxygen and is nonpolar; the presence of an element is not what matters, the difference between bonded atoms is.
    answer: 1
    explanation: |
      Electronegativity difference is the one rule that explains both molecules, and it is the rule that later tells you a C–H-rich fatty-acid tail is hydrophobic.

  - slug: u01-exam-q05
    type: multiple_choice
    topic_code: "1.2"
    source: "Biology 2e §2.1 Atoms, Isotopes, Ions, and Molecules"
    points: 1
    prompt: |
      A farmer adds a nitrogen-containing fertiliser and a phosphate-containing fertiliser to a field. Which pairing correctly states what the crop plants will build from each?
    options:
      - "Nitrogen into cellulose; phosphate into starch."
      - "Nitrogen into amino acids and nucleotide bases; phosphate into ATP, nucleic acids and phospholipid heads."
      - "Nitrogen into fatty acids; phosphate into glucose."
      - "Both into water, which the plant needs most."
    option_explanations:
      - |
        Cellulose and starch are pure carbohydrate (C, H, O); they contain neither nitrogen nor phosphorus.
      - |
        Correct. Every amino acid has an amino group and every base has nitrogen in its rings; phosphate groups are in the nucleic acid backbone, in ATP and in membrane phospholipids.
      - |
        Fatty acids and glucose are built from carbon, hydrogen and oxygen only; the fertiliser elements are not used in them.
      - |
        Water is H₂O; neither nitrogen nor phosphorus is part of it, and plants take water in directly rather than making it from fertiliser.
    answer: 1
    explanation: |
      Match each element to the molecules that cannot exist without it: N for proteins and nucleic acids, P for nucleic acids, ATP and membranes. That is why these two are the elements farmers must supply.

  - slug: u01-exam-q06
    type: multiple_choice
    topic_code: "1.2"
    source: "Biology 2e §2.1 Atoms, Isotopes, Ions, and Molecules"
    points: 1
    prompt: |
      A bone fragment contains one quarter of the carbon-14 that living tissue contains. Carbon-14 has a half-life of about 5,730 years. Approximately how old is the fragment?
    options:
      - "About 1,400 years"
      - "About 5,700 years"
      - "About 11,500 years"
      - "About 23,000 years"
    option_explanations:
      - |
        One quarter of the activity remaining means two half-lives have passed, not a quarter of one.
      - |
        After one half-life half the carbon-14 remains; one quarter requires a second halving.
      - |
        Correct. Half after 5,730 years, a quarter after 11,460 years: two half-lives.
      - |
        Four half-lives (about 23,000 years) would leave one sixteenth, not one quarter.
    answer: 2
    explanation: |
      Each half-life halves what is left: 1 → 1/2 → 1/4. Count the halvings and multiply by the half-life. Radiocarbon dating works to about 50,000 years, roughly nine half-lives.

  # ---- Water (1.1)
  - slug: u01-exam-q07
    type: multiple_choice
    topic_code: "1.1"
    source: "Biology 2e §2.2 Water"
    points: 1
    prompt: |
      Coastal cities have milder winters and cooler summers than inland cities at the same latitude. Which property of water is responsible, and why?
    options:
      - "Low density of ice, because floating ice reflects sunlight."
      - "High specific heat, because the ocean absorbs or releases large amounts of heat with only a small change in its own temperature, moderating the air above it."
      - "Cohesion, because waves mix warm and cold water."
      - "Low heat of vaporization, because the ocean evaporates quickly and cools the coast."
    option_explanations:
      - |
        Sea ice reflects sunlight where it exists, but a city's climate is moderated in summer too, when there is no ice; the effect comes from the water's heat capacity.
      - |
        Correct. The ocean is a vast heat reservoir: it warms slowly in summer and cools slowly in winter, so coastal air temperatures swing less than air over land.
      - |
        Mixing by waves redistributes heat but does not explain why the ocean's temperature changes so little; that is specific heat.
      - |
        Water's heat of vaporization is high, not low, and evaporation alone would make coasts cooler, not milder in winter.
    answer: 1
    explanation: |
      The same property that steadies your body temperature steadies a continent's edge: it takes a lot of heat to change water's temperature.

  - slug: u01-exam-q08
    type: multiple_choice
    topic_code: "1.1"
    source: "Biology 2e §2.2 Water"
    points: 1
    prompt: |
      A student dilutes a solution of pH 4 with pure water until its hydrogen ion concentration falls to one hundredth of the original. What is the new pH?
    options:
      - "2"
      - "4.02"
      - "6"
      - "8"
    option_explanations:
      - |
        A pH of 2 would mean 100 times more H⁺, not 100 times less; the direction is reversed.
      - |
        The pH scale is logarithmic; a hundredfold change in concentration is a change of two whole units, not of 0.02.
      - |
        Correct. One hundredth is 10⁻², so the exponent rises by 2: from 10⁻⁴ M to 10⁻⁶ M, pH 4 to pH 6.
      - |
        pH 8 would be basic; diluting an acid with pure water approaches pH 7 but cannot pass it.
    answer: 2
    explanation: |
      Each tenfold dilution adds one to the pH. Dilution can bring an acid toward neutrality but never beyond it, because the water itself sits at pH 7.

  - slug: u01-exam-q09
    type: multiple_choice
    topic_code: "1.1"
    source: "Biology 2e §2.2 Water"
    points: 1
    prompt: |
      Nonpolar molecules such as hydrocarbons are often described as "hydrophobic". Which statement most accurately describes what happens when they are placed in water?
    options:
      - "Water molecules are repelled by the nonpolar molecules and move away from them."
      - "Water molecules hydrogen-bond to each other rather than to the nonpolar molecules, so the nonpolar molecules are pushed together and excluded."
      - "Nonpolar molecules form ionic bonds with each other that water cannot break."
      - "Nonpolar molecules dissolve but only very slowly."
    option_explanations:
      - |
        There is no repulsive force; water is simply more attracted to itself than to the nonpolar molecule, which looks like repulsion but is exclusion.
      - |
        Correct. Water maximises its own hydrogen bonding, and the only way to do that around a nonpolar molecule is to minimise the contact surface, which drives nonpolar molecules into clusters.
      - |
        Hydrocarbons carry no charge and form no ionic bonds; the weak attractions between them are van der Waals forces, and they cluster because water excludes them, not because they bond strongly.
      - |
        Hydrocarbons do not dissolve appreciably in water at any speed; the two remain in separate phases.
    answer: 1
    explanation: |
      Hydrophobic exclusion is a property of water, not of the oil. It drives bilayer formation and protein folding, so it is worth stating precisely.

  # ---- Macromolecules (1.3)
  - slug: u01-exam-q10
    type: multiple_choice
    topic_code: "1.3"
    source: "Biology 2e §3.1 Synthesis of Biological Macromolecules"
    points: 1
    prompt: |
      A cell joins 100 amino acids into a single polypeptide. How many water molecules are produced, and by which reaction?
    options:
      - "100 water molecules, by hydrolysis"
      - "99 water molecules, by dehydration synthesis"
      - "99 water molecules, by hydrolysis"
      - "50 water molecules, by dehydration synthesis"
    option_explanations:
      - |
        Hydrolysis consumes water rather than producing it, and 100 monomers need only 99 bonds.
      - |
        Correct. Each peptide bond releases one water, and 100 monomers in a chain are joined by 99 bonds.
      - |
        The count is right but the reaction is wrong: forming bonds releases water (dehydration), breaking them consumes it (hydrolysis).
      - |
        Every adjacent pair of monomers is joined by its own bond; a chain of 100 has 99 links, not 50.
    answer: 1
    explanation: |
      Links are always one fewer than monomers in a linear chain, and each link costs the cell energy and releases a water.

  - slug: u01-exam-q11
    type: multiple_choice
    topic_code: "1.3"
    source: "Biology 2e §3.1 Synthesis of Biological Macromolecules"
    points: 1
    prompt: |
      Which statement correctly contrasts lipids with the other three classes of biological macromolecule?
    options:
      - "Lipids are the only class that contains carbon."
      - "Lipids are not true polymers: they are not long chains of a repeating monomer, and they are grouped by being hydrophobic."
      - "Lipids are the only class built by dehydration synthesis."
      - "Lipids contain nitrogen, which the other classes lack."
    option_explanations:
      - |
        All four classes are carbon-based; carbon is the backbone of every one.
      - |
        Correct. A triglyceride is glycerol plus three fatty acids and a steroid is four fused rings; neither is a repeating chain. What unites lipids is insolubility in water.
      - |
        Ester bonds in a triglyceride are made by dehydration synthesis, but so are glycosidic, peptide and phosphodiester bonds; the reaction is shared, not unique.
      - |
        Most lipids contain no nitrogen at all; proteins and nucleic acids are the nitrogen-rich classes.
    answer: 1
    explanation: |
      Three classes are defined by their monomer; lipids are defined by their behaviour toward water. Keep that distinction when a question asks about "polymers".

  # ---- Carbohydrates (1.4)
  - slug: u01-exam-q12
    type: multiple_choice
    topic_code: "1.4"
    source: "Biology 2e §3.2 Carbohydrates"
    points: 1
    prompt: |
      Lactose is a disaccharide of glucose and galactose joined by a β linkage; people who lack the enzyme lactase cannot digest it. Which statement follows from this?
    options:
      - "Lactase hydrolyses the β glycosidic linkage of lactose; without it, lactose passes undigested to gut bacteria."
      - "Lactase converts galactose into glucose so that lactose can be absorbed whole."
      - "People without lactase cannot digest any carbohydrate."
      - "Lactose is a polysaccharide, so it cannot be absorbed by anyone."
    option_explanations:
      - |
        Correct. Enzymes are specific to a linkage; with no lactase, the β bond stays intact, lactose reaches the colon and bacteria ferment it, which causes the symptoms of lactose intolerance.
      - |
        Lactase splits lactose into its two monosaccharides, which are absorbed separately; it does not interconvert sugars or let a disaccharide pass through the gut wall.
      - |
        Lactase acts only on lactose; amylase, sucrase and maltase handle other carbohydrates and are unaffected.
      - |
        Lactose is a disaccharide (two sugars), and digestion of it is routine for anyone with lactase.
    answer: 0
    explanation: |
      Enzyme specificity plus linkage type explains lactose intolerance, cellulose indigestibility and starch digestion with one rule.

  - slug: u01-exam-q13
    type: multiple_choice
    topic_code: "1.4"
    source: "Biology 2e §3.2 Carbohydrates"
    points: 1
    prompt: |
      A plant stores glucose as starch rather than as free glucose in its cells. Which advantage does the polymer offer?
    options:
      - "Starch contains more energy per glucose unit than free glucose."
      - "A large, insoluble polymer does not raise the concentration of dissolved molecules in the cell, so it does not draw in water by osmosis the way thousands of free glucose molecules would."
      - "Starch can be transported through the plant more easily than glucose."
      - "Starch can be used directly in cellular respiration without being broken down."
    option_explanations:
      - |
        Each glucose unit in starch holds essentially the same energy as a free glucose; polymerising stores the same energy, not more.
      - |
        Correct. Osmotic effects depend on the number of dissolved particles; one starch grain counts for almost nothing, whereas the same glucose dissolved would flood the cell with water.
      - |
        Plants transport sugar as sucrose, a small soluble disaccharide; insoluble starch stays where it is made or stored.
      - |
        Respiration uses glucose; starch must first be hydrolysed back to glucose by amylase-type enzymes.
    answer: 1
    explanation: |
      Storage polymers solve an osmotic problem as much as an energy one. The same logic explains why animals store glycogen rather than free glucose (Unit 2 returns to osmosis).

  - slug: u01-exam-q14
    type: multiple_choice
    topic_code: "1.4"
    source: "Biology 2e §3.2 Carbohydrates"
    points: 1
    prompt: |
      Which description of a monosaccharide is correct?
    options:
      - "A sugar with a 1:2:1 ratio of carbon, hydrogen and oxygen, bearing a carbonyl group and several hydroxyl groups, that usually forms a ring in water."
      - "A sugar made of two glucose units joined by a glycosidic bond."
      - "A long chain of glucose units linked by β 1-4 bonds."
      - "A five-carbon sugar that is always part of a nucleotide."
    option_explanations:
      - |
        Correct. The formula (CH₂O)ₙ, the carbonyl (aldehyde or ketone), the hydroxyls and the ring form in solution define the class.
      - |
        Two sugars joined make a disaccharide (maltose, here); a monosaccharide is a single unit.
      - |
        A long chain is a polysaccharide; β 1-4 glucose chains are cellulose.
      - |
        Ribose and deoxyribose are five-carbon monosaccharides, but so are others, and six- and three-carbon sugars are monosaccharides too.
    answer: 0
    explanation: |
      Mono-, di- and poly- name how many units; the chemistry of the unit itself is carbonyl plus hydroxyls on a carbon chain.

  # ---- Stimulus set B: a melting-point and membrane-fluidity data set (1.5)
  - slug: u01-exam-q15
    type: multiple_choice
    topic_code: "1.5"
    source: "Biology 2e §3.3 Lipids"
    points: 1
    stimulus: |
      Fish kept at different water temperatures for four weeks were sampled, and the fatty-acid composition of their cell membranes was analysed.

      | Water temperature (°C) | Saturated fatty acids in membrane (%) | Unsaturated fatty acids in membrane (%) | Cholesterol (relative units) |
      |---|---|---|---|
      | 5 | 28 | 72 | 1.0 |
      | 15 | 39 | 61 | 1.4 |
      | 25 | 52 | 48 | 1.9 |
    prompt: |
      Which trend does the table show?
    options:
      - "As water temperature rises, the proportion of unsaturated fatty acids in the membrane falls."
      - "As water temperature rises, the proportion of unsaturated fatty acids in the membrane rises."
      - "Fatty-acid composition does not change with temperature."
      - "Saturated fatty acids disappear from the membrane at 5 °C."
    option_explanations:
      - |
        Correct. Unsaturated falls from 72% to 48% while saturated rises from 28% to 52% as the water warms.
      - |
        This reverses the numbers: the unsaturated column decreases down the table.
      - |
        The proportions change by more than twenty percentage points across the range; the composition clearly responds to temperature.
      - |
        At 5 °C saturated fatty acids are still 28% of the membrane; they decrease but do not disappear.
    answer: 0
    explanation: |
      Describe the data before explaining them: state the direction and quote two numbers. That is worth a point on a free-response item too.

  - slug: u01-exam-q16
    type: multiple_choice
    topic_code: "1.5"
    source: "Biology 2e §3.3 Lipids"
    points: 1
    stimulus: |
      Fish kept at different water temperatures for four weeks were sampled, and the fatty-acid composition of their cell membranes was analysed.

      | Water temperature (°C) | Saturated fatty acids in membrane (%) | Unsaturated fatty acids in membrane (%) | Cholesterol (relative units) |
      |---|---|---|---|
      | 5 | 28 | 72 | 1.0 |
      | 15 | 39 | 61 | 1.4 |
      | 25 | 52 | 48 | 1.9 |
    prompt: |
      Which explanation best accounts for the change in fatty-acid composition with temperature?
    options:
      - "Cold water destroys saturated fatty acids."
      - "In cold water, membranes rich in kinked cis-unsaturated tails stay fluid because the tails cannot pack tightly; in warm water, more straight saturated tails keep the membrane from becoming too loose."
      - "Fish eat different food at different temperatures, and the membrane simply reflects the diet."
      - "Unsaturated fatty acids are heavier and sink to the membrane at low temperature."
    option_explanations:
      - |
        Nothing in the data suggests destruction; the fish are adjusting the composition of what they build, and saturated fatty acids are still present at 5 °C.
      - |
        Correct. The same packing argument that makes olive oil liquid and butter solid applies to a membrane: cells tune saturation to keep fluidity in a working range at the temperature they live at.
      - |
        The fish were given the same food; the experiment controlled diet so that temperature alone varied, and the regularity of the trend points to a regulated response.
      - |
        Fatty acids do not sink within a membrane, and unsaturated acids are if anything slightly lighter; mass plays no part.
    answer: 1
    explanation: |
      Structure to function: kinks prevent packing, packing decides how fluid a membrane is at a given temperature. The cell is doing with chemistry what a cook does with butter and oil.

  - slug: u01-exam-q17
    type: multiple_choice
    topic_code: "1.5"
    source: "Biology 2e §3.3 Lipids"
    points: 1
    stimulus: |
      Fish kept at different water temperatures for four weeks were sampled, and the fatty-acid composition of their cell membranes was analysed.

      | Water temperature (°C) | Saturated fatty acids in membrane (%) | Unsaturated fatty acids in membrane (%) | Cholesterol (relative units) |
      |---|---|---|---|
      | 5 | 28 | 72 | 1.0 |
      | 15 | 39 | 61 | 1.4 |
      | 25 | 52 | 48 | 1.9 |
    prompt: |
      Cholesterol content also rises with temperature. Given the structure of cholesterol, which role is it most likely playing at 25 °C?
    options:
      - "Serving as the main energy store of the membrane."
      - "Inserting its rigid four-ring structure among the fatty-acid tails to restrain their movement, reducing fluidity at a temperature where the membrane would otherwise be too loose."
      - "Forming the hydrophilic heads of the phospholipids."
      - "Breaking down unsaturated fatty acids into saturated ones."
    option_explanations:
      - |
        Cholesterol is a steroid, not a fuel store; energy is stored in triglycerides elsewhere in the cell.
      - |
        Correct. The flat, stiff ring system wedges between tails and limits how far they can move apart, which stabilises a warm membrane; at low temperatures it instead prevents tails from packing into a solid.
      - |
        Phospholipid heads are phosphate groups attached to glycerol; cholesterol is a separate molecule with only a small polar hydroxyl group.
      - |
        Cholesterol is not an enzyme and does not alter fatty acids; the saturation change is made by the cell's fatty-acid synthesis enzymes.
    answer: 1
    explanation: |
      Cholesterol is a fluidity buffer: it makes a warm membrane less fluid and a cold one more fluid. Rising cholesterol alongside rising saturation at 25 °C is two tools applied to one problem.

  # ---- Lipids (1.5)
  - slug: u01-exam-q18
    type: multiple_choice
    topic_code: "1.5"
    source: "Biology 2e §3.3 Lipids"
    points: 1
    prompt: |
      A food label lists "partially hydrogenated vegetable oil". Which statement describes the chemistry and the consequence?
    options:
      - "Hydrogen was added across some C=C double bonds, converting cis-unsaturated chains into saturated or trans chains that pack more closely, making the oil more solid and raising the risk of elevated LDL cholesterol."
      - "Water was added to the oil, diluting it and making it healthier."
      - "Hydrogen was removed, creating more double bonds and making the oil more liquid."
      - "The oil was converted into cholesterol."
    option_explanations:
      - |
        Correct. Hydrogenation saturates double bonds and can flip the remaining ones to trans; both changes straighten the chains, so the product is spreadable and shelf-stable but behaves like saturated fat in the body.
      - |
        Hydrogenation adds hydrogen, not water, and the purpose is to make the oil more solid, not more dilute.
      - |
        Removing hydrogen to create double bonds is dehydrogenation, the opposite process; it would make the fat more liquid, not spreadable.
      - |
        Cholesterol is a four-ring steroid that cannot be made by adding hydrogen to a triglyceride; the effect on cholesterol is on blood LDL levels, not on the oil itself.
    answer: 0
    explanation: |
      Saturation and geometry decide packing; packing decides melting point; the body treats a straight chain as saturated whether or not it carries a double bond.

  - slug: u01-exam-q19
    type: multiple_choice
    topic_code: "1.5"
    source: "Biology 2e §3.3 Lipids"
    points: 1
    prompt: |
      Detergent molecules, like phospholipids, have a polar head and a nonpolar tail. When a single layer of such molecules forms a tiny sphere in water with the tails pointing inward and the heads outward, the structure is a micelle. Why do detergents form micelles while phospholipids form bilayers?
    options:
