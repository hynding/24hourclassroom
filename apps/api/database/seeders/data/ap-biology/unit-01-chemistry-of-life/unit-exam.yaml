      - "Detergents are charged and phospholipids are not."
    option_explanations:
      - |
        Correct. Molecular shape decides the assembly: a wide head on a single narrow tail curves strongly, two tails under a head pack side by side into a sheet.
      - |
        A molecule with no polar head would form an oil droplet, not a micelle; detergents work precisely because they are amphipathic.
      - |
        Phospholipid bilayers curve into vesicles and whole cells; size does not prevent curvature, and the spherical cell membrane is proof.
      - |
