    points: 1
    prompt: |
      True or false: Adding a strong acid to a well-buffered solution produces a much smaller change in pH than adding the same amount of acid to pure water.
    answer: true
    explanation: |
      True. A buffer's base component (such as bicarbonate) captures the added H⁺ as a weak acid (carbonic acid), so the free hydrogen ion concentration rises only slightly. Pure water has nothing to absorb the H⁺, so its pH falls sharply. This is why blood stays near pH 7.4 despite the acids metabolism produces.

