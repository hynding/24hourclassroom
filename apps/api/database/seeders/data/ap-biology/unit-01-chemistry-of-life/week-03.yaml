week: 3
unit: 1
title: Nucleic Acids and Proteins
topics: ["1.6", "1.7"]
guide: guides/week-03.md
guide_description: |
  Nucleotides, the directional sugar-phosphate backbone, antiparallel complementary strands and DNA versus RNA;
  the four levels of protein structure, what holds each, and why a sequence change can change a shape and a
  function (sickle-cell haemoglobin). Three worked examples (a mutation's location, a complementary strand,
  a pH-activity curve), misconceptions, self-check. The Unit 1 exam is this week.
flashcards_description: |
  30 cards on nucleic acid structure, DNA versus RNA, amino acids, peptide bonds and the four levels of protein structure.

flashcards:
  - front: Nucleotide
    back: |
      The monomer of nucleic acids: a five-carbon sugar (deoxyribose or ribose), a phosphate group on the 5′ carbon, and a nitrogenous base on the 1′ carbon.
    topic_code: "1.6"
  - front: Deoxyribose vs ribose
    back: |
      Ribose (RNA) has an –OH on its 2′ carbon; deoxyribose (DNA) has only –H there. The missing hydroxyl makes DNA chemically more stable, suited to long-term storage.
    hint: Deoxy means one oxygen fewer.
    topic_code: "1.6"
  - front: Purines and pyrimidines
    back: |
      Purines (adenine, guanine) have two fused rings; pyrimidines (cytosine, thymine, uracil) have one. A purine always pairs with a pyrimidine, so every rung of the helix is the same width.
    hint: Pyrimidines have the longer name and the smaller ring.
    topic_code: "1.6"
  - front: Phosphodiester bond
    back: |
      The covalent bond linking the 3′ hydroxyl of one nucleotide's sugar to the 5′ phosphate of the next, formed by dehydration synthesis. It builds the sugar-phosphate backbone.
    topic_code: "1.6"
  - front: 5′ end and 3′ end
    back: |
      A strand's 5′ end carries a free phosphate on the sugar's carbon 5; its 3′ end carries a free hydroxyl on carbon 3. Strands are built and read 5′ → 3′.
    topic_code: "1.6"
  - front: Antiparallel
    back: |
      The two strands of a DNA double helix run in opposite directions: one 5′ → 3′, the other 3′ → 5′. Only then can the bases meet face to face.
    topic_code: "1.6"
  - front: Complementary base pairing
    back: |
      Adenine pairs with thymine (two hydrogen bonds); guanine pairs with cytosine (three). In RNA, uracil takes thymine's place. One strand's sequence fixes the other's.
    topic_code: "1.6"
  - front: Why is a G–C-rich DNA region harder to separate than an A–T-rich one?
    back: |
      Each G–C pair is held by three hydrogen bonds and each A–T pair by two, so more bonds must be broken per base pair; the region needs more heat or energy to melt.
    topic_code: "1.6"
  - front: Where is the information in DNA, and where is the structure?
    back: |
      The sugar-phosphate backbone is identical along the strand and gives structure; the information is the order of the bases attached to it.
    topic_code: "1.6"
  - front: Three differences between DNA and RNA
    back: |
      Sugar: deoxyribose vs ribose. Base: thymine vs uracil. Form: double-stranded helix vs usually single-stranded, which lets RNA fold into functional shapes.
    topic_code: "1.6"
  - front: mRNA, rRNA and tRNA → roles
    back: |
      mRNA carries a gene's sequence from DNA to the ribosome; rRNA forms the ribosome's core and catalyses peptide-bond formation; tRNA brings the matching amino acid to each codon.
    topic_code: "1.6"
  - front: Amino acid → the four groups on the α carbon
    back: |
      An amino group (–NH₂), a carboxyl group (–COOH), a hydrogen atom and a variable R group (side chain). The R group is all that differs among the twenty.
    topic_code: "1.7"
  - front: R group classes
    back: |
      Nonpolar (e.g. leucine, valine), polar uncharged (serine, cysteine), positively charged (lysine, arginine), negatively charged (aspartate, glutamate), aromatic (phenylalanine, tryptophan).
    topic_code: "1.7"
  - front: Peptide bond
    back: |
      The covalent bond between the carboxyl group of one amino acid and the amino group of the next, formed by dehydration synthesis. A chain of them is a polypeptide, with an N-terminus and a C-terminus.
    topic_code: "1.7"
  - front: Essential amino acid
    back: |
      One the organism cannot synthesise and must obtain from food. Humans have nine. Which amino acids are essential varies between species.
    topic_code: "1.7"
  - front: Primary structure
    back: |
      The sequence of amino acids in a polypeptide, read from the N-terminus to the C-terminus. It is specified by the gene and determines every higher level of structure.
    topic_code: "1.7"
  - front: Secondary structure → the two forms and what holds them
    back: |
      α helix (a coil) and β pleated sheet (strands side by side), both held by hydrogen bonds between backbone C=O and N–H groups. R groups are not involved.
    hint: Backbone, not side chains.
    topic_code: "1.7"
  - front: Tertiary structure → the four interactions
    back: |
      The overall 3-D fold of one polypeptide, held by R-group interactions: hydrophobic clustering in the interior, hydrogen bonds between polar R groups, ionic bonds between charged R groups, and covalent disulfide bridges between cysteines.
    topic_code: "1.7"
  - front: Disulfide bridge
    back: |
      A covalent S–S bond between the sulfhydryl groups of two cysteine residues. The only covalent interaction that stabilises tertiary structure; it is why hair can be permanently curled.
    topic_code: "1.7"
  - front: Quaternary structure
    back: |
      The arrangement of two or more polypeptide subunits in one functional protein, held by the same weak interactions as tertiary structure. Haemoglobin has four subunits; insulin has two chains.
    topic_code: "1.7"
  - front: Where do nonpolar R groups end up in a soluble protein, and why?
    back: |
      In the interior, away from water: water excludes them (hydrophobic exclusion) while polar and charged R groups stay on the surface where they hydrogen-bond with water.
    topic_code: "1.7"
  - front: How would a membrane-spanning protein differ in its R-group arrangement?
    back: |
      The region inside the lipid bilayer has nonpolar R groups on its outer surface (facing the fatty-acid tails), while the parts in the cytoplasm and extracellular fluid have polar R groups outside.
    topic_code: "1.7"
  - front: Denaturation
    back: |
      Loss of a protein's secondary, tertiary and quaternary structure, and so its function, when heat, extreme pH or high salt break the weak interactions. Peptide bonds and primary sequence remain; some proteins refold.
    topic_code: "1.7"
  - front: Why does extreme pH denature an enzyme?
    back: |
      Added or removed H⁺ changes the charge on carboxyl and amino R groups, so the ionic bonds that held the fold are lost and the active site deforms.
    topic_code: "1.7"
  - front: Chaperone
    back: |
      A protein that helps a newly made polypeptide fold correctly and protects it from aggregating. Folding is driven by chemistry, but in a crowded cell it often needs help.
    topic_code: "1.7"
  - front: Sickle-cell haemoglobin → what changed and what followed
    back: |
      One amino acid of about 600, glutamate to valine at position 6 of the β chain. The new hydrophobic patch makes deoxygenated haemoglobin molecules stick together into fibres that distort the red cell.
    topic_code: "1.7"
  - front: The causal chain from gene to function
    back: |
      DNA sequence → amino-acid sequence (primary) → local folding (secondary) → R-group interactions (tertiary, quaternary) → shape → function. A change at any step can change the end.
    topic_code: "1.7"
  - front: Protein functions → six examples
    back: |
      Enzymes (amylase), transport (haemoglobin), structural (keratin, actin), hormones (insulin), defence (antibodies), contractile (myosin). Shape fits each to its task.
    topic_code: "1.7"
  - front: Which bonds hold DNA together, and which hold a protein's shape?
    back: |
      DNA: covalent phosphodiester bonds along each backbone, hydrogen bonds between bases across strands. Protein: covalent peptide bonds in the chain; hydrogen, ionic, hydrophobic and disulfide interactions for the fold.
    topic_code: "1.6"
  - front: Why is RNA, not DNA, the catalyst in the ribosome?
    back: |
      Single-stranded RNA can fold back on itself into intricate shapes with reactive 2′ hydroxyls; double-stranded DNA is locked in a uniform helix and lacks the 2′ –OH. rRNA forms the peptide bond.
    topic_code: "1.6"

quiz:
  description: |
    25 questions · about 25 minutes · about 70% nucleic acids and proteins, 30% review of weeks 1 and 2.
    Multiple choice, select-all, true/false and numeric items are graded at once; the fill-in-the-blank items are
    matched automatically; the two short answers and the long answer are graded by your teacher against the
    acceptable-answer summary.
  questions:
    - slug: u01-w03-q01
      type: multiple_choice
      topic_code: "1.6"
      source: "Biology 2e §3.5 Nucleic Acids"
      points: 1
      prompt: |
        Which bond joins one nucleotide to the next along a single strand of DNA, and which atoms does it connect?
      options:
        - "A hydrogen bond between the bases of adjacent nucleotides."
        - "A phosphodiester bond between the 3′ hydroxyl of one sugar and the 5′ phosphate of the next nucleotide."
        - "A glycosidic bond between the two sugars."
        - "A peptide bond between the phosphate groups."
      option_explanations:
        - |
          Hydrogen bonds act between bases on opposite strands, across the helix; they do not link nucleotides along a strand.
        - |
          Correct. The sugar-phosphate backbone is a chain of covalent phosphodiester bonds, each made by dehydration synthesis, and the 3′-to-5′ linkage is what gives a strand its direction.
        - |
          Glycosidic bonds join sugars to sugars in carbohydrates, or a base to its sugar within one nucleotide; they do not join nucleotides to each other.
        - |
          Peptide bonds link amino acids in proteins; the phosphate-to-sugar link in nucleic acids is a phosphodiester bond.
      answer: 1
      explanation: |
        The backbone is covalent and directional; the base pairing across it is weak and reversible. Keeping those two kinds of bond straight answers many questions in Unit 6.

    - slug: u01-w03-q02
      type: multiple_choice
      topic_code: "1.6"
      source: "Biology 2e §3.5 Nucleic Acids"
      points: 1
      prompt: |
        Two DNA fragments of equal length are heated. Fragment X is 70% G–C pairs and fragment Y is 30% G–C pairs. Which prediction and reason are correct?
      options:
        - "X separates at a lower temperature because guanine and cytosine are smaller bases."
        - "Y separates at a lower temperature because it has fewer hydrogen bonds per base pair on average."
        - "Both separate at the same temperature because every base pair has the same number of hydrogen bonds."
        - "X separates at a lower temperature because its phosphodiester bonds are weaker."
      option_explanations:
        - |
          Base size does not set the melting temperature, and G–C pairs are held by three hydrogen bonds, which makes them harder, not easier, to separate.
        - |
          Correct. A–T pairs have two hydrogen bonds and G–C pairs three; a fragment rich in A–T has fewer bonds to break per pair and melts at a lower temperature.
        - |
          The number of hydrogen bonds differs by pair: two for A–T and three for G–C, which is why G–C content predicts melting temperature.
        - |
          Heating to separate strands breaks hydrogen bonds between bases, not the covalent phosphodiester backbone, which is the same in both fragments.
      answer: 1
      explanation: |
        Melting a double helix means breaking hydrogen bonds. Count them: more G–C, more bonds, higher melting temperature. The same fact is used to design PCR primers in Unit 6.

    - slug: u01-w03-q03
      type: multiple_choice
      topic_code: "1.6"
      source: "Biology 2e §3.5 Nucleic Acids"
      points: 1
      prompt: |
        One strand of a DNA molecule reads 5′-GCATTC-3′. Which is the complementary strand, written in the conventional 5′ to 3′ direction?
      options:
        - "5′-CGTAAG-3′"
        - "5′-GAATGC-3′"
        - "5′-GCATTC-3′"
        - "5′-CGUAAG-3′"
      option_explanations:
        - |
          These are the correct complementary bases but written 3′ to 5′ (directly under the original strand). Written 5′ to 3′ the order must be reversed.
        - |
          Correct. Pair each base (G–C, C–G, A–T, T–A, T–A, C–G) to get 3′-CGTAAG-5′, then write it from its 5′ end: 5′-GAATGC-3′. Antiparallel means the complement reads backwards.
        - |
          This is the original strand, not its partner; a strand is not complementary to itself.
        - |
          Uracil appears in RNA, not DNA, and this version is also written 3′ to 5′.
      answer: 1
      explanation: |
        Two steps every time: complement each base, then reverse the direction. Forgetting the second step is the most common error on this kind of item.

    - slug: u01-w03-q04
      type: multiple_choice
      topic_code: "1.6"
      source: "Biology 2e §3.5 Nucleic Acids"
      points: 1
      prompt: |
        Why does a DNA double helix have a constant width along its entire length?
      options:
        - "Every base is the same size."
        - "A two-ring purine always pairs with a one-ring pyrimidine, so every rung spans three rings."
        - "The sugar-phosphate backbones are rigid and hold the strands a fixed distance apart regardless of the bases."
        - "The helix is wider at G–C pairs but the difference is too small to measure."
      option_explanations:
        - |
          Purines have two rings and pyrimidines one; the bases are not the same size, which is exactly why the pairing rule matters.
        - |
          Correct. A–T and G–C are each a purine plus a pyrimidine, three rings across, so the distance between the backbones never changes.
        - |
          The backbones are flexible enough to form a helix; it is the pairing rule, not backbone stiffness, that sets the spacing.
        - |
          Both standard pairs are purine–pyrimidine and span the same width; there is no systematic difference at G–C pairs.
      answer: 1
      explanation: |
        Purine-with-pyrimidine pairing explains both the uniform helix and Chargaff's rule that A equals T and G equals C.

    - slug: u01-w03-q05
      type: multiple_choice
      topic_code: "1.7"
      source: "Biology 2e §3.4 Proteins"
      points: 1
      prompt: |
        Which interactions hold an α helix in shape?
      options:
        - "Hydrogen bonds between the backbone C=O of one amino acid and the backbone N–H of an amino acid farther along the chain."
        - "Disulfide bridges between cysteine R groups."
        - "Ionic bonds between charged R groups."
        - "Peptide bonds between the R groups of adjacent amino acids."
      option_explanations:
        - |
          Correct. Secondary structure is a property of the backbone: regularly spaced hydrogen bonds between carbonyl and amide groups coil the chain, with every R group pointing outward.
        - |
          Disulfide bridges are covalent R-group links that stabilise tertiary structure; they are not what forms a helix.
        - |
          Ionic bonds between R groups contribute to tertiary structure, the overall fold, not to the local helix.
        - |
          Peptide bonds join the carboxyl and amino groups of the backbone, never R groups, and they form the chain itself rather than its shape.
      answer: 0
      explanation: |
        Secondary = backbone hydrogen bonds; tertiary = R-group interactions. The distinction is tested every year.

    - slug: u01-w03-q06
      type: multiple_choice
      topic_code: "1.7"
      source: "Biology 2e §3.4 Proteins"
      points: 1
      prompt: |
        In sickle-cell haemoglobin, glutamate (a negatively charged amino acid) at position 6 of the β chain is replaced by valine (nonpolar). Which statement best explains why this single change has such a large effect?
      options:
        - "Valine is much larger than glutamate, so the protein can no longer fit inside the red cell."
        - "The change creates a hydrophobic patch on the protein's surface that sticks to the same patch on other haemoglobin molecules, so they polymerise into fibres."
        - "The change breaks every peptide bond in the β chain, unfolding the protein."
        - "Valine cannot be joined by a peptide bond, so the chain stops at position 6."
      option_explanations:
        - |
          The two amino acids are of similar size; the problem is chemistry (charge replaced by hydrophobicity), not bulk.
        - |
          Correct. A nonpolar R group exposed to water is excluded by it and seeks other nonpolar surfaces; when oxygen is low the molecules stack into fibres that bend the cell into a sickle.
        - |
          A substitution changes one R group and leaves every peptide bond intact; the primary structure is still a complete chain.
        - |
          Valine is one of the twenty standard amino acids and forms peptide bonds normally; it occupies position 6 and the chain continues.
      answer: 1
      explanation: |
        Location plus chemistry decide the effect of a mutation. A charge-to-nonpolar swap on a surface that other molecules can touch is about the worst case.

    - slug: u01-w03-q07
      type: multiple_choice
      topic_code: "1.7"
      source: "Biology 2e §3.4 Proteins"
      points: 1
      prompt: |
        A soluble enzyme is folded in the cytoplasm. Where would you expect to find amino acids with nonpolar R groups, and why?
      options:
        - "On the surface, because nonpolar groups hydrogen-bond strongly with water."
        - "In the interior, because water excludes nonpolar groups and they cluster together away from it."
        - "Evenly distributed, because R-group chemistry does not affect folding."
        - "At the two ends of the chain only, because the N- and C-termini are hydrophobic."
      option_explanations:
        - |
          Nonpolar R groups cannot hydrogen-bond with water at all; it is polar and charged groups that sit on the surface for that reason.
        - |
          Correct. Hydrophobic exclusion, the same force that drives phospholipids into a bilayer, pushes nonpolar side chains into the core and leaves polar ones facing the water.
        - |
          R-group chemistry is the main driver of tertiary structure; a protein with randomly placed hydrophobic residues would not fold into a stable soluble shape.
        - |
          The termini carry a charged amino group and a charged carboxyl group, which are hydrophilic; the position in the chain does not decide where a residue ends up.
      answer: 1
      explanation: |
        A membrane protein inverts the rule where it passes through the bilayer: nonpolar residues outward toward the tails, polar ones inward or at the aqueous faces.

    - slug: u01-w03-q08
      type: multiple_choice
      topic_code: "1.7"
      source: "Biology 2e §3.4 Proteins"
      points: 1
      prompt: |
        An enzyme is heated to 70 °C, loses all activity, and regains it when cooled. Which statement correctly describes what happened at 70 °C?
      options:
        - "Its peptide bonds were broken and then re-formed on cooling."
        - "Its weak interactions (hydrogen bonds, ionic bonds, hydrophobic clustering) were disrupted, unfolding the active site; the primary sequence survived, so it could refold."
        - "Its amino acids were converted into different amino acids by the heat."
        - "Its disulfide bridges melted, and new ones formed at random on cooling."
      option_explanations:
        - |
          Peptide bonds are covalent and survive ordinary heating; if they had broken, the enzyme could not have reassembled on cooling.
        - |
          Correct. Denaturation disrupts the higher levels of structure while leaving the sequence intact, which is why some proteins refold once the stress is removed.
        - |
          Heat does not change the identity of amino acids in a chain; it changes how the chain is folded.
        - |
          Disulfide bridges are covalent and are not broken by moderate heat; random new bridges would make correct refolding impossible, not routine.
      answer: 1
      explanation: |
        "Lost its shape, kept its sequence" is the definition of denaturation. Whether refolding happens depends on the protein; a fried egg never does.

    - slug: u01-w03-q09
      type: multiple_choice
      topic_code: "1.6"
      source: "Biology 2e §3.5 Nucleic Acids"
      points: 1
      prompt: |
        Which feature of RNA, absent from DNA, allows molecules such as tRNA and rRNA to fold into specific three-dimensional shapes?
      options:
        - "RNA uses thymine, which forms stronger hydrogen bonds."
        - "RNA is usually single-stranded, so bases within one strand can pair with each other where sequences are complementary."
        - "RNA lacks a phosphate backbone and is therefore more flexible."
        - "RNA contains deoxyribose, whose missing hydroxyl lets the strand bend."
      option_explanations:
        - |
          RNA uses uracil, not thymine, and the base change does not make bonds stronger or enable folding.
        - |
          Correct. With no permanent partner strand, an RNA molecule folds back on itself, pairing complementary stretches to form hairpins and loops, which is how tRNA gets its shape and rRNA its catalytic site.
        - |
          RNA has the same sugar-phosphate backbone as DNA; the backbone is not what differs.
        - |
          Reversed: RNA has ribose with a 2′ hydroxyl; deoxyribose is DNA's sugar.
      answer: 1
      explanation: |
        Single strands fold; double strands are locked in a helix. That is why DNA is a stable archive and RNA can be a working part, even a catalyst.

    - slug: u01-w03-q10
      type: multiple_choice
      topic_code: "1.3"
      source: "Biology 2e §3.1 Synthesis of Biological Macromolecules"
      points: 1
      prompt: |
        Review. A peptide bond, a glycosidic linkage and a phosphodiester bond are formed by the same type of reaction. Which statement about that reaction is correct?
      options:
        - "Each forms by hydrolysis, which releases energy stored in the monomers."
        - "Each forms by dehydration synthesis, removing a water molecule and requiring an input of energy."
        - "Each forms spontaneously in water without an enzyme."
        - "Each forms by transferring electrons from one monomer to another."
      option_explanations:
        - |
          Hydrolysis breaks these bonds; it is the reverse of their formation and does release energy, but forming a polymer costs energy.
        - |
          Correct. In every case –H from one monomer and –OH from the other leave as water, a covalent bond forms, and the cell pays for it with ATP via an enzyme.
        - |
          Dehydration synthesis is energetically uphill in a watery cell and needs an enzyme (and energy) to proceed at a useful rate; it is hydrolysis that is downhill.
        - |
          These are covalent bonds built by sharing electrons; no electron transfer or ionic bond is involved.
      answer: 1
      explanation: |
        Three polymer classes, one reaction. Recognising that a bond is "just another dehydration synthesis" lets you predict how it is broken: by hydrolysis, with an enzyme.

    - slug: u01-w03-q11
      type: multiple_choice
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        Review. Hydrogen bonds hold the two strands of DNA together, yet a cell can separate the strands to copy them at body temperature. Which property of hydrogen bonds makes both facts possible?
      options:
        - "Hydrogen bonds are covalent and can only be broken by enzymes."
        - "Individually a hydrogen bond is weak and easily broken, but many of them together are strong, so strands hold yet can be unzipped locally."
        - "Hydrogen bonds are stronger than covalent bonds but only form between nitrogen atoms."
        - "Hydrogen bonds form only at low temperature and vanish at 37 °C."
      option_explanations:
        - |
          Hydrogen bonds are not covalent; they are weak attractions between partial charges, far weaker than the covalent bonds in the backbone.
        - |
          Correct. The sum of thousands of weak bonds holds the helix stable, while any short stretch can be opened with little energy; that is the same reason water is both cohesive and fluid.
        - |
          Hydrogen bonds are much weaker than covalent bonds, and in DNA they form between hydrogens and both oxygen and nitrogen atoms.
        - |
          Hydrogen bonds exist across the whole range of biological temperatures; they are broken and re-formed constantly, which is what makes them useful.
      answer: 1
      explanation: |
        Week 1's lesson about water, weak alone and strong together, is the reason the genetic material can be both stable and copyable.

    - slug: u01-w03-q12
      type: multi_select
      topic_code: "1.7"
      source: "Biology 2e §3.4 Proteins"
      points: 2
      partial_credit: true
      prompt: |
        Which interactions contribute to a protein's tertiary structure? Select all that apply.
      options:
        - "Hydrophobic clustering of nonpolar R groups in the interior"
        - "Ionic bonds between oppositely charged R groups"
        - "Peptide bonds between adjacent amino acids"
        - "Disulfide bridges between cysteine R groups"
        - "Hydrogen bonds between polar R groups"
      option_explanations:
        - |
          Correct. Water excludes nonpolar side chains, driving them together in the core; this is often the largest contribution to the fold.
        - |
          Correct. A negatively charged aspartate or glutamate can pair with a positively charged lysine or arginine across the fold.
        - |
          Peptide bonds form the primary structure, the chain itself; they do not decide how the chain folds in three dimensions.
        - |
          Correct. The S–S bond between two cysteines is the one covalent interaction that stabilises a fold.
        - |
          Correct. Serine, threonine, asparagine and similar polar side chains hydrogen-bond with each other and with the backbone.
      answer: [0, 1, 3, 4]
      explanation: |
        Tertiary structure is R-group chemistry: hydrophobic, ionic, hydrogen and disulfide. The backbone's own hydrogen bonds belong to secondary structure, and peptide bonds to primary.

    - slug: u01-w03-q13
      type: multi_select
      topic_code: "1.6"
      source: "Biology 2e §3.5 Nucleic Acids"
      points: 2
      partial_credit: true
      prompt: |
        Which statements correctly describe a difference between DNA and RNA? Select all that apply.
      options:
        - "DNA's sugar is deoxyribose, which lacks the 2′ hydroxyl that ribose has."
        - "DNA uses thymine where RNA uses uracil."
        - "DNA is usually double-stranded; RNA is usually single-stranded."
        - "DNA is built from amino acids; RNA from nucleotides."
        - "DNA strands run antiparallel; RNA has no 5′ or 3′ end."
      option_explanations:
        - |
          Correct. The missing oxygen makes deoxyribose less reactive, suiting DNA to long-term storage.
        - |
          Correct. Uracil pairs with adenine in RNA exactly as thymine does in DNA.
        - |
          Correct. Single-strandedness lets RNA fold into working shapes such as tRNA's cloverleaf.
        - |
          Both are built from nucleotides; amino acids are the monomers of proteins.
        - |
          Every nucleic acid strand has a 5′ end and a 3′ end because every phosphodiester bond links a 3′ carbon to a 5′ carbon; RNA is no exception.
      answer: [0, 1, 2]
      explanation: |
        Sugar, base, strandedness: the three textbook differences. The directional backbone is shared by both.

    - slug: u01-w03-q14
      type: true_false
      topic_code: "1.7"
      source: "Biology 2e §3.4 Proteins"
      points: 1
      prompt: |
        True or false: The primary structure of a protein is determined by the sequence of nucleotides in the gene that encodes it, and every higher level of structure follows from that primary sequence and the chemistry of its R groups.
      answer: true
      explanation: |
        True. The gene specifies the order of amino acids; once the chain exists, backbone hydrogen bonding and R-group interactions (hydrophobic, hydrogen, ionic, disulfide) fold it, often with chaperone help. This causal chain, gene to sequence to shape to function, is why a mutation can change a phenotype.

    - slug: u01-w03-q15
      type: true_false
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        Review. True or false: Moving from pH 6 to pH 5 represents a tenfold increase in hydrogen ion concentration.
      answer: true
      explanation: |
        True. pH = −log₁₀[H⁺], so each whole unit is a factor of ten: pH 6 is 10⁻⁶ M and pH 5 is 10⁻⁵ M, ten times as much H⁺. The direction matters as well: a lower pH means more hydrogen ions. This logarithmic scale is why a drop of only 0.3 pH units in blood is a medical emergency, and why enzymes with a sharp pH optimum lose activity so quickly outside it.

    - slug: u01-w03-q16
      type: fill_blank
      topic_code: "1.6"
      source: "Biology 2e §3.5 Nucleic Acids"
      points: 1
      prompt: |
        The two strands of a DNA double helix run in opposite directions, one 5′ → 3′ and the other 3′ → 5′; this arrangement is described as ____.
      answer: ["antiparallel"]
      explanation: |
        Antiparallel is the term for strands that are parallel in the sense of lying side by side but opposite in direction. It follows from the geometry of base pairing: the bases meet face to face only if the backbones run opposite ways. "Complementary" describes the base sequence relationship, not the direction, so it is not accepted here.

