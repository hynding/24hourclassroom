      prompt: |
        Review. A fatty acid with one or more carbon–carbon double bonds is described as ____, and if the double bonds are cis the chain is kinked and the fat is usually liquid at room temperature.
      answer: ["unsaturated"]
      explanation: |
        Unsaturated means not saturated with hydrogen: a double bond takes the place of two hydrogens. The kink from a cis double bond prevents close packing and lowers the melting point. "Polyunsaturated" is a subset (more than one double bond) and is accepted only as a more specific answer; "saturated" is the opposite.

    - slug: u01-w03-q19
      type: numeric
      topic_code: "1.6"
      source: "Biology 2e §3.5 Nucleic Acids"
      points: 1
      prompt: |
        A short double-stranded DNA fragment has one strand reading 5′-AGGCTA-3′. How many hydrogen bonds hold the two strands of this fragment together?
      answer: { value: 15, tolerance: 0 }
      explanation: |
        Go base by base along the given strand and add the bonds of each pair: A–T 2, G–C 3, G–C 3, C–G 3, T–A 2, A–T 2. That is 2 + 3 + 3 + 3 + 2 + 2 = 15 hydrogen bonds. Equivalently, three A–T pairs (6 bonds) plus three G–C pairs (9 bonds). A common slip is to count the bases on both strands and double the total.

    - slug: u01-w03-q20
      type: short_answer
      topic_code: "1.7"
      source: "Biology 2e §3.4 Proteins"
      points: 4
      prompt: |
        Conceptual analysis. A single nucleotide change in a gene causes an enzyme to have the nonpolar amino acid leucine in place of the negatively charged amino acid aspartate. The substituted residue lies in the enzyme's hydrophobic core, not in its active site. (a) Predict the effect on the enzyme's tertiary structure and justify your prediction. (b) Explain how a change far from the active site can still abolish catalytic activity. (c) Describe one substitution at the same position that you would expect to have little effect, and justify.
      answer: |
        The leucine fits the hydrophobic core better than the charged aspartate did, so the fold may change little, or it may improve; but if the aspartate had been forming an ionic bond that held the fold, losing it could shift the structure. A shift in tertiary structure propagates to the active site, since the active site's shape is a product of the whole fold. A substitution to another charged residue (glutamate) would most likely preserve any ionic bond and change little.
      explanation: |
        Four points.

        (a) Predict and justify, 2 pts: a defensible prediction with chemistry. Accept either direction. Prediction A (1 pt): little disruption, because a nonpolar leucine is compatible with a hydrophobic core, perhaps more so than a charged aspartate. Prediction B (1 pt): disruption, because the charged aspartate was presumably doing something in the core, such as forming an ionic bond or hydrogen bond that held parts of the fold together, and losing that interaction shifts the structure. 1 pt for the prediction, 1 pt for a justification that names the relevant interaction (hydrophobic clustering, ionic bond, hydrogen bond). A bare prediction with no mechanism earns 1 pt at most.

        (b) Explain, 1 pt: the active site is a pocket formed by residues brought together by the overall tertiary fold; a change anywhere that shifts the fold can move those residues, so substrate binding or catalysis fails even though no active-site residue changed. Accept "the shape of the active site depends on the whole protein".

        (c) Describe and justify, 1 pt: a conservative substitution, e.g. aspartate to glutamate (both negatively charged, similar size) or, if the student took prediction A, leucine to isoleucine or valine (both nonpolar). The justification must say the chemistry of the R group is preserved so the same interactions can form.

        Zero: claims that any single substitution always destroys an enzyme; answers that discuss the DNA mutation without reaching the protein; answers that say the enzyme is unaffected because the active site is unchanged, with no consideration of the fold.

    - slug: u01-w03-q21
      type: short_answer
      topic_code: "1.6"
      source: "Biology 2e §3.5 Nucleic Acids"
      points: 4
      prompt: |
        Analyze a visual representation. A diagram shows a short DNA double helix with the sugar-phosphate backbones drawn as two ribbons and the base pairs as rungs. One ribbon is labelled 5′ at the top and 3′ at the bottom. (a) State the labels that belong at the top and bottom of the other ribbon, and justify. (b) Identify the type of bond that forms each rung and the type that forms each ribbon. (c) The diagram shows every rung as the same length. Explain why that is correct.
      answer: |
        The other ribbon is 3′ at the top and 5′ at the bottom because the strands are antiparallel. Rungs are hydrogen bonds between paired bases; ribbons are covalent phosphodiester bonds. Each rung is a purine paired with a pyrimidine, so each spans three rings and the same width.
      explanation: |
        Four points.

        (a) 1 pt: 3′ at the top and 5′ at the bottom, with the justification that the strands are antiparallel (run in opposite directions) so that the bases can face each other. Labels without the word antiparallel or an equivalent explanation earn nothing.

        (b) 2 pts: 1 pt for rungs = hydrogen bonds between complementary bases (two for A–T, three for G–C; the counts are a bonus, not required); 1 pt for ribbons = covalent phosphodiester bonds linking the 3′ carbon of one sugar to the 5′ phosphate of the next. "Covalent bonds" alone for the ribbon earns the point; "strong bonds" does not.

        (c) 1 pt: every pair is one purine (two rings) and one pyrimidine (one ring), so every rung is three rings wide; A–T and G–C therefore span the same distance between the backbones. An answer that says "all bases are the same size" is wrong and earns nothing.

        Zero overall: answers that call the rungs covalent and the ribbons hydrogen-bonded, or that label both ribbons 5′ at the top.

    - slug: u01-w03-q22
      type: long_answer
      topic_code: "1.7"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. Students tested the claim that "the enzyme catalase is denatured by heat but not by changes in pH." They measured the volume of oxygen produced in two minutes when catalase broke down hydrogen peroxide, after treating the enzyme as shown. Each value is the mean of three trials.

        | Treatment of enzyme before the assay | O₂ produced in 2 min (mL) |
        |---|---|
        | Kept at 25 °C, pH 7 (control) | 24 |
        | Heated to 80 °C for 10 min, then cooled to 25 °C, pH 7 | 1 |
        | Kept at 25 °C in pH 3 buffer, then returned to pH 7 | 22 |
        | Kept at 25 °C in pH 3 buffer and assayed at pH 3 | 4 |
        | Kept at 25 °C in pH 11 buffer and assayed at pH 11 | 3 |

        (a) Identify the independent and dependent variables and explain why the first row is a valid control.
        (b) Describe the pattern in the data.
        (c) Evaluate the claim. Explain, in terms of protein structure, what heat did to the enzyme and what acid or base did to it, and account for the difference between the third and fourth rows.
        (d) Propose a further experiment that would test whether the loss of activity at pH 3 is fully reversible, and state the result that would support reversibility.
      answer: |
        IV: pre-treatment (heat, pH); DV: oxygen produced; the control shows the enzyme's normal activity under assay conditions. Heat abolished activity permanently; extreme pH abolished activity only while the enzyme stayed at that pH, and activity returned at pH 7. The claim is wrong: pH does denature catalase, but reversibly, whereas heat denatured it irreversibly. Heat broke the weak interactions and the protein aggregated or misfolded; acid and base changed the charges on R groups, breaking ionic bonds that were restored at pH 7. Test reversibility by holding the enzyme at pH 3 for longer periods before returning it to pH 7 and assaying; a return to about 24 mL after every exposure supports full reversibility.
      explanation: |
        Eight points.

        (a) 2 pts: 1 pt for independent variable = the pre-treatment of the enzyme (temperature or pH exposure) and dependent variable = volume of O₂ produced in two minutes (a measure of enzyme activity); 1 pt for the control being valid because it holds everything else constant (same enzyme, substrate, time, temperature and pH during the assay) and shows the enzyme's baseline activity to compare against.

        (b) 1 pt: the heated enzyme produced almost no O₂ (1 mL vs 24); the enzyme exposed to pH 3 and returned to pH 7 produced nearly the control amount (22 mL); the enzyme assayed while still at pH 3 or pH 11 produced little (4 and 3 mL). At least two of these comparisons with numbers or a clear ordering.

        (c) 3 pts: 1 pt for the evaluation: the claim is not supported, because extreme pH did stop activity (rows 4 and 5); the difference is that the pH effect was reversible while the heat effect was not. 1 pt for heat: heat broke the hydrogen bonds, ionic bonds and hydrophobic interactions holding the tertiary (and quaternary) structure, the unfolded chains misfolded or aggregated on cooling, so the active site was not restored. 1 pt for pH: added H⁺ (pH 3) or removed H⁺ (pH 11) changed the charge state of acidic and basic R groups, breaking ionic bonds and hydrogen bonds that shape the active site; returning to pH 7 restored the charges and the fold, which is why row 3 recovered. Accept "ionisation of R groups" or "amino and carboxyl groups gain or lose protons".

        (d) 2 pts: 1 pt for an experiment that varies the duration or severity of acid exposure (e.g. 10 min, 1 h, 24 h at pH 3; or pH 3, 2, 1) before returning the enzyme to pH 7 and assaying under control conditions, with the other conditions held constant; 1 pt for the supporting result: activity close to the control (about 24 mL) after every exposure, versus a decline with longer or harsher exposure if the damage is partly irreversible. Accept a design that compares activity at pH 7 before and after acid exposure in the same sample.

        Zero for a part: restating the table as the pattern; explaining heat by "the enzyme died" or "was used up"; saying acid "ate" the enzyme; proposing an experiment that changes the assay pH rather than the pre-treatment, or one with no stated result.

