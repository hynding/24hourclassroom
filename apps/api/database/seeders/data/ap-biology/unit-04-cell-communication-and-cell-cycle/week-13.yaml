week: 13
unit: 4
title: Feedback and the Cell Cycle
topics: ["4.4", "4.5"]
guide: guides/week-13.md
guide_description: |
  Negative feedback (blood glucose, body temperature, calcium) and positive feedback (labour, clotting, fruit
  ripening) as the two ways a response acts back on its signal; then the cell cycle: interphase (G₁, S, G₂),
  G₀, the stages of mitosis, cytokinesis in animal and plant cells, and how mitosis hands an identical genome to
  each daughter cell. Vocabulary, three worked examples (a glucose-tolerance table, a root-tip count converted
  to phase durations, chromosome and chromatid bookkeeping), misconceptions, self-check.
flashcards_description: |
  37 cards: feedback vocabulary with physiological examples, the cell cycle stage by stage, and "what does this
  count or curve show" cards for homeostasis and mitosis.

flashcards:
  - front: Homeostasis → the set-point idea
    back: |
      Keeping internal conditions within a working range around a set point by constantly adjusting. It is dynamic (always correcting) and an equilibrium (values stay within limits), not a fixed state.
    topic_code: "4.4"
  - front: The three parts of a feedback loop
    back: |
      A receptor (sensor) detects the change, a control centre (often the brain, or a gland) compares it with the set point, and an effector (a muscle or gland) produces the response. The response then feeds back and changes the stimulus.
    topic_code: "4.4"
  - front: Negative feedback loop → definition and net effect
    back: |
      The response counteracts the stimulus, pushing the variable back toward its set point. The result is stability: a rise is answered by a fall and a fall by a rise. It is the main mechanism of homeostasis.
    hint: Negative means opposing, not bad.
    topic_code: "4.4"
  - front: Positive feedback loop → definition and net effect
    back: |
      The response reinforces the stimulus, driving the variable further in the same direction until some end point is reached. The result is a rapid, self-limiting event, not stability: labour, clotting, ripening.
    hint: Positive means amplifying, not good.
    topic_code: "4.4"
  - front: Blood glucose rises after a meal → the loop
    back: |
      Receptor cells in the pancreas detect high glucose and release insulin; insulin makes liver, muscle and fat cells take up glucose and the liver store it as glycogen; glucose falls, so insulin release falls. Negative feedback.
    topic_code: "4.4"
  - front: Blood glucose falls between meals → the loop
    back: |
      The pancreas releases glucagon; glucagon makes the liver break glycogen down and release glucose; glucose rises, so glucagon release falls. Also negative feedback, in the opposite direction.
    topic_code: "4.4"
  - front: Why are insulin and glucagon both examples of negative feedback?
    back: |
      Each hormone's response removes the condition that triggered it. The direction of the correction differs, but in both cases the response opposes the change and the variable returns toward the set point.
    topic_code: "4.4"
  - front: Body temperature too high → the responses
    back: |
      The hypothalamus detects the rise and orders vasodilation (more blood to the skin, heat lost by radiation) and sweating (heat lost by evaporation). Temperature falls, the responses stop. Negative feedback.
    topic_code: "4.4"
  - front: Body temperature too low → the responses
    back: |
      The hypothalamus orders vasoconstriction (blood kept near the core), shivering (muscle contraction makes heat) and goose bumps (arrector pili muscles raise hair or fur for insulation). Temperature rises, the responses stop.
    topic_code: "4.4"
  - front: Hypothalamus → its role in thermoregulation
    back: |
      The control centre for temperature and most homeostasis. It holds the set point and runs reflexes for cooling and warming. Pyrogens released during infection raise its set point, producing a fever that is itself a defence.
    topic_code: "4.4"
  - front: Endotherm vs ectotherm
    back: |
      An endotherm keeps a near-constant body temperature from internal heat (mammals, birds); an ectotherm's temperature follows the surroundings and is adjusted mainly by behaviour such as basking or seeking shade (reptiles, most fish).
    topic_code: "4.4"
  - front: Labour and oxytocin → why it is positive feedback
    back: |
      The baby's head stretches the cervix; stretch receptors signal the brain to release oxytocin; oxytocin makes the uterus contract, which stretches the cervix more, which releases more oxytocin. The loop ends only with birth.
    topic_code: "4.4"
  - front: Blood clotting → why it is positive feedback
    back: |
      Thrombin converts fibrinogen to fibrin and also activates more clotting factors that produce more thrombin, so the clot forms fast at the injury. The loop ends when the wound is sealed.
    topic_code: "4.4"
  - front: Fruit ripening and ethylene → why it is positive feedback
    back: |
      A ripening fruit releases the gas ethylene; ethylene triggers more ripening and more ethylene, in the same fruit and in its neighbours. One ripe apple in a bag ripens the rest. Ends when the fruit is fully ripe.
    topic_code: "4.4"
  - front: How does a positive feedback loop stop?
    back: |
      Not by returning to a set point but by reaching an end state that removes the stimulus: the baby is born, the clot seals the wound, the fruit is ripe. Positive feedback drives a one-way event to completion.
    topic_code: "4.4"
  - front: Given this result, what does it show? A patient's blood glucose stays high after a meal and insulin stays near zero
    back: |
      The loop is broken at the signal: the sensor-gland is not releasing insulin, so the effectors never respond and glucose is not brought back to the set point. Supplying insulin from outside should restore the correction.
    topic_code: "4.4"
  - front: Cell cycle → the two major phases
    back: |
      Interphase (G₁, S, G₂), in which the cell grows and copies its DNA, and the mitotic (M) phase, in which the nucleus divides (karyokinesis, or mitosis) and then the cytoplasm divides (cytokinesis).
    topic_code: "4.5"
  - front: G₁ phase → what happens
    back: |
      First gap: the cell grows and is biochemically very active, accumulating building blocks for DNA and histones and the energy reserves needed for replication. In cultured human cells about 9 hours of a 24-hour cycle.
    topic_code: "4.5"
  - front: S phase → what happens
    back: |
      Synthesis: every chromosome is replicated, producing two identical sister chromatids joined at the centromere. The centrosome is also duplicated. About 10 hours in cultured human cells.
    topic_code: "4.5"
  - front: G₂ phase → what happens
    back: |
      Second gap: the cell replenishes energy stores, makes the proteins needed to move chromosomes, duplicates some organelles and begins dismantling the cytoskeleton to supply the spindle. About 4.5 hours.
    topic_code: "4.5"
  - front: G₀ → what it is and which cells stay there
    back: |
      A resting state outside the cycle: the cell works but is not preparing to divide. Some cells enter G₀ temporarily when conditions are poor; mature nerve and cardiac muscle cells stay there permanently, which is why those tissues barely regenerate.
    topic_code: "4.5"
  - front: Sister chromatids → what they are and when they exist
    back: |
      The two identical copies of one chromosome made in S phase, held together by cohesin proteins most tightly at the centromere. They exist from S phase until anaphase, when they separate and each becomes a chromosome in its own right.
    topic_code: "4.5"
  - front: Centromere and kinetochore
    back: |
      The centromere is the constricted region where sister chromatids are held together; the kinetochore is the protein structure that assembles on each chromatid's centromere in prometaphase and captures spindle microtubules.
    topic_code: "4.5"
  - front: Cohesin
    back: |
      The protein that holds sister chromatids together from S phase onward. Its breakdown at the start of anaphase is what frees the chromatids to be pulled apart.
    topic_code: "4.5"
  - front: Chromatin → nucleosome and the compaction numbers
    back: |
      DNA wrapped around cores of eight histone proteins forms nucleosomes (about sevenfold shortening); nucleosomes coil into a 30 nm fibre (about fiftyfold); further folding makes a chromosome. Two metres of DNA fit a 10 μm nucleus.
    topic_code: "4.5"
  - front: Why must chromosomes condense before mitosis?
    back: |
      Loose, two-metre-long chromatin would tangle and break when pulled to the poles. Condensed chromosomes are compact, separable units that the spindle can move intact, so each daughter gets a complete set.
    topic_code: "4.5"
  - front: Prophase → the events
    back: |
      Chromatin condenses into visible chromosomes, each of two sister chromatids. The nucleolus disappears, the nuclear envelope begins to break into vesicles, membranous organelles fragment, and the two centrosomes move apart as spindle microtubules grow between them.
    topic_code: "4.5"
  - front: Prometaphase → the events
    back: |
      The nuclear envelope finishes fragmenting. A kinetochore forms on each sister chromatid's centromere and captures spindle microtubules from opposite poles. Non-kinetochore (polar) microtubules overlap at the middle and push the poles apart.
    topic_code: "4.5"
  - front: Metaphase → the one thing to look for
    back: |
      All chromosomes line up on the metaphase plate midway between the poles, each sister chromatid attached to a different pole and still held by cohesin. Chromosomes are at their most condensed.
    topic_code: "4.5"
  - front: Anaphase → the events
    back: |
      Cohesin is degraded, sister chromatids separate at the centromere and each, now a chromosome, is pulled toward the pole its microtubule leads to. Polar microtubules slide past each other and the cell elongates.
    hint: A for apart.
    topic_code: "4.5"
  - front: Telophase → the events
    back: |
      Chromosomes reach the poles and decondense back into chromatin; the spindle depolymerises into tubulin; nuclear envelopes re-form around each set and nucleoli reappear. Two nuclei, one cell.
    topic_code: "4.5"
  - front: Cytokinesis in animal cells
    back: |
      A contractile ring of actin filaments forms just inside the membrane at the former metaphase plate and tightens, producing a cleavage furrow that deepens until the cell pinches in two.
    topic_code: "4.5"
  - front: Cytokinesis in plant cells
    back: |
      Golgi vesicles carrying wall materials gather at the metaphase plate (the phragmoplast) and fuse into a cell plate that grows outward until it joins the existing wall. Enzymes build a new wall from stored glucose. No furrow, because the wall cannot pinch.
    topic_code: "4.5"
  - front: Mitotic spindle → made of what, organised from where
    back: |
      Microtubules of tubulin, organised from the two centrosomes (each with a pair of centrioles in animal cells). Kinetochore microtubules attach chromosomes; polar microtubules overlap and push the poles apart.
    topic_code: "4.5"
  - front: How do you count chromosomes and chromatids in a diagram?
    back: |
      Count centromeres to count chromosomes. Before S phase each chromosome has one chromatid; after S phase and until anaphase it has two. A human cell in G₂ has 46 chromosomes and 92 chromatids; after anaphase each pole has 46 chromosomes of one chromatid each.
    topic_code: "4.5"
  - front: Why do the two daughter cells of mitosis have identical genomes?
    back: |
      S phase makes an exact copy of every chromosome, cohesin keeps the copies together, the spindle attaches the two copies to opposite poles, and anaphase sends one copy of every chromosome to each pole. The chromosome number is kept (diploid to diploid).
    topic_code: "4.5"
  - front: Three jobs mitosis does for a multicellular organism
    back: |
      Growth (more cells), repair and replacement (skin, gut lining, blood cells on a schedule of days), and asexual reproduction in some organisms. Each product is genetically identical to the parent.
    topic_code: "4.5"

quiz:
  description: |
    25 questions · about 30 minutes · about 70% this week (feedback, the cell cycle, mitosis) and 30% review of
    signal transduction, cell size, membranes, cell structure and protein chemistry. Multiple choice, select-all,
    true/false and numeric items are graded at once; the fill-in-the-blank items are matched automatically; the two
    short answers and the long answer are graded by your teacher against the acceptable-answer summary.
  questions:
    # ---- Stimulus set A: a glucose tolerance table (4.4)
    - slug: u04-w13-q01
      type: multiple_choice
      topic_code: "4.4"
      source: "Biology 2e §33.3 Homeostasis"
      points: 1
      stimulus: |
        Two volunteers each drank a solution containing 75 g of glucose at time 0. Blood glucose and blood insulin were measured over three hours. Volunteer 1 is healthy. Volunteer 2 has a condition in which the insulin-producing cells of the pancreas have been destroyed.

        | Time (min) | Volunteer 1 glucose (mg/dL) | Volunteer 1 insulin (μU/mL) | Volunteer 2 glucose (mg/dL) | Volunteer 2 insulin (μU/mL) |
        |---|---|---|---|---|
        | 0 | 85 | 6 | 160 | 1 |
        | 30 | 140 | 60 | 240 | 1 |
        | 60 | 120 | 45 | 290 | 1 |
        | 120 | 90 | 15 | 320 | 1 |
        | 180 | 82 | 7 | 310 | 1 |
      prompt: |
        Which description of volunteer 1's data best shows that blood glucose is regulated by negative feedback?
      options:
        - "Glucose rises after the drink and keeps rising for three hours."
        - "Insulin rises as glucose rises, glucose then falls back toward its starting value, and insulin falls with it."
        - "Insulin rises first and glucose follows it upward."
        - "Glucose and insulin stay constant throughout."
      option_explanations:
        - |
          Volunteer 1's glucose peaks at 30 minutes (140) and is back to 82 by 180 minutes; continuous rising describes neither volunteer accurately and would indicate no correction at all.
        - |
          Correct. The stimulus (high glucose) triggers the signal (insulin), the response lowers glucose, and the falling glucose removes the stimulus so insulin declines: a loop in which the response opposes the change.
        - |
          Insulin does not cause glucose to rise; the drink does. Insulin is the response to the rise and its effect is to lower glucose.
        - |
          Both variables change by a factor of ten (insulin) or by 55 mg/dL (glucose); constancy is not what the table shows.
      answer: 1
      explanation: |
        Describing a feedback loop means stating the sequence: stimulus, signal, response, and the response removing the stimulus. Quote the numbers that show each step.

    - slug: u04-w13-q02
      type: multiple_choice
      topic_code: "4.4"
      source: "Biology 2e §33.3 Homeostasis"
      points: 1
      stimulus: |
        Two volunteers each drank a solution containing 75 g of glucose at time 0. Blood glucose and blood insulin were measured over three hours. Volunteer 1 is healthy. Volunteer 2 has a condition in which the insulin-producing cells of the pancreas have been destroyed.

        | Time (min) | Volunteer 1 glucose (mg/dL) | Volunteer 1 insulin (μU/mL) | Volunteer 2 glucose (mg/dL) | Volunteer 2 insulin (μU/mL) |
        |---|---|---|---|---|
        | 0 | 85 | 6 | 160 | 1 |
        | 30 | 140 | 60 | 240 | 1 |
        | 60 | 120 | 45 | 290 | 1 |
        | 120 | 90 | 15 | 320 | 1 |
        | 180 | 82 | 7 | 310 | 1 |
      prompt: |
        At which step is volunteer 2's feedback loop broken, and what in the data supports that?
      options:
        - "At the receptor step: the volunteer cannot absorb glucose from the drink, shown by the low starting value."
        - "At the signal step: insulin is never released in response to high glucose, shown by insulin staying at 1 μU/mL while glucose climbs to 320 mg/dL."
        - "At the effector step: liver cells ignore insulin, shown by insulin being high while glucose stays high."
        - "The loop is intact but slower, shown by glucose beginning to fall at 180 minutes."
      option_explanations:
        - |
          Glucose rises from 160 to 320 after the drink, so absorption is working; and the starting value is high, not low.
        - |
          Correct. The sensor cells that detect glucose and release insulin have been destroyed, so the signal is absent; with no signal, the effectors are never told to take up glucose and the variable drifts far above the set point.
        - |
          Insulin is 1 μU/mL throughout, so there is no insulin for the liver to ignore; a problem at the effector would show high insulin alongside high glucose.
        - |
          A drop from 320 to 310 over an hour, with glucose still nearly four times the healthy baseline, is not evidence of a working correction; the loop has no signal at all.
      answer: 1
      explanation: |
        To locate a break in a loop, ask which component's output is missing. Here glucose (the stimulus) is present, insulin (the signal) is not, so the lesion is at the gland.

    - slug: u04-w13-q03
      type: multiple_choice
      topic_code: "4.4"
      source: "Biology 2e §33.3 Homeostasis"
      points: 1
      stimulus: |
        Two volunteers each drank a solution containing 75 g of glucose at time 0. Blood glucose and blood insulin were measured over three hours. Volunteer 1 is healthy. Volunteer 2 has a condition in which the insulin-producing cells of the pancreas have been destroyed.

        | Time (min) | Volunteer 1 glucose (mg/dL) | Volunteer 1 insulin (μU/mL) | Volunteer 2 glucose (mg/dL) | Volunteer 2 insulin (μU/mL) |
        |---|---|---|---|---|
        | 0 | 85 | 6 | 160 | 1 |
        | 30 | 140 | 60 | 240 | 1 |
        | 60 | 120 | 45 | 290 | 1 |
        | 120 | 90 | 15 | 320 | 1 |
        | 180 | 82 | 7 | 310 | 1 |
      prompt: |
        Suppose volunteer 2 were given an injection of insulin at 30 minutes. Which prediction is most consistent with how the loop normally works?
      options:
        - "Glucose would continue to rise, because the pancreas is still damaged."
        - "Glucose would fall over the following hour as liver, muscle and fat cells took it up, because the effectors are intact and only the signal was missing."
        - "Glucose would instantly return to 85 mg/dL and stay there."
        - "Insulin would stimulate the pancreas to recover."
      option_explanations:
        - |
          The pancreas's job in this loop is to supply insulin; an injection replaces that supply, so the damage no longer prevents the correction.
        - |
          Correct. The receptor-and-signal step was the only break; the effector cells still carry insulin receptors and transporters, so supplied insulin should produce the uptake that the volunteer's own body could not order.
        - |
          Even in volunteer 1 the fall from 140 to 90 took 90 minutes; uptake is a process, not a switch, and an injection cannot restore the loop's own fine tuning.
        - |
          Insulin acts on liver, muscle and fat; it does not regrow the destroyed cells that make it.
      answer: 1
      explanation: |
        Replacing a missing signal from outside restores the response if the rest of the loop is intact. That is the logic of insulin therapy and of every experiment that adds a hormone to a mutant.

    # ---- Stimulus set B: a root-tip count (4.5)
    - slug: u04-w13-q04
      type: multiple_choice
      topic_code: "4.5"
      source: "Biology 2e §10.2 The Cell Cycle"
      points: 1
      stimulus: |
        A student examined 600 cells in one field of an onion root-tip squash and classified each cell by the stage of the cell cycle it was in. The cell cycle in this tissue takes about 24 hours.

        | Stage | Cells counted |
        |---|---|
        | Interphase | 540 |
        | Prophase | 30 |
        | Metaphase | 12 |
        | Anaphase | 8 |
        | Telophase | 10 |
        | Total | 600 |
      prompt: |
        Which inference about the duration of the stages is best supported by the counts?
      options:
        - "Interphase is the shortest stage, because interphase cells are hard to see."
        - "A stage that occupies more of the cycle's time will be seen in more cells at any instant, so interphase is by far the longest stage and anaphase is the shortest."
        - "All stages last the same time, and the differences are counting error."
        - "Prophase is longer than interphase, because 30 is a large count."
      option_explanations:
        - |
          Interphase accounts for 540 of 600 cells (90%); the count is the largest, not the smallest, and visibility is not the explanation.
        - |
          Correct. A snapshot of an unsynchronised population samples time: the fraction of cells in a stage equals the fraction of the cycle that stage occupies. Interphase is 90% of the cycle; anaphase (8 cells, 1.3%) is the briefest.
        - |
          The counts range from 8 to 540, a 67-fold difference, far beyond any plausible counting error.
        - |
          30 cells is 5% of the field; 540 is 90%. The comparison must be between fractions, not against an arbitrary idea of a large number.
      answer: 1
      explanation: |
        Cells counted in a stage ÷ total cells × cycle length = time in that stage. The reasoning depends on the cells dividing asynchronously, so the field is a random sample of the cycle.

    - slug: u04-w13-q05
      type: multiple_choice
      topic_code: "4.5"
      source: "Biology 2e §10.2 The Cell Cycle"
      points: 1
      stimulus: |
        A student examined 600 cells in one field of an onion root-tip squash and classified each cell by the stage of the cell cycle it was in. The cell cycle in this tissue takes about 24 hours.

        | Stage | Cells counted |
        |---|---|
        | Interphase | 540 |
        | Prophase | 30 |
        | Metaphase | 12 |
        | Anaphase | 8 |
        | Telophase | 10 |
        | Total | 600 |
      prompt: |
        The student classified one cell as anaphase. Which observation justifies that classification?
      options:
        - "Chromosomes aligned in a single plane across the middle of the cell."
        - "Two groups of chromosomes moving toward opposite ends of the cell, with the cell beginning to elongate."
        - "A nucleus with no visible chromosomes and a nucleolus present."
        - "Two nuclei with nuclear envelopes re-formed and a cell plate between them."
      option_explanations:
        - |
          Chromosomes on the metaphase plate define metaphase; in anaphase the sister chromatids have already separated and left the plate.
        - |
          Correct. Anaphase begins when cohesin is degraded and the sister chromatids are pulled apart toward the poles; the sliding polar microtubules also lengthen the cell.
        - |
          A nucleus with diffuse chromatin and a nucleolus is interphase, when chromosomes are not condensed enough to see.
        - |
          Re-formed nuclear envelopes and a cell plate mark telophase and cytokinesis in a plant cell, the stage after anaphase.
      answer: 1
      explanation: |
        Each stage has one diagnostic feature: condensing chromosomes (prophase), a plate (metaphase), separation (anaphase), two nuclei (telophase). Learn the feature, not just the name.

    - slug: u04-w13-q06
      type: numeric
      topic_code: "4.5"
      source: "Biology 2e §10.3 Control of the Cell Cycle"
      points: 1
      stimulus: |
        A student examined 600 cells in one field of an onion root-tip squash and classified each cell by the stage of the cell cycle it was in. The cell cycle in this tissue takes about 24 hours.

        | Stage | Cells counted |
        |---|---|
        | Interphase | 540 |
        | Prophase | 30 |
        | Metaphase | 12 |
        | Anaphase | 8 |
        | Telophase | 10 |
        | Total | 600 |
      prompt: |
        Using the counts, estimate how many hours a cell in this tissue spends in the mitotic (M) phase of a 24-hour cycle. Give your answer to one decimal place.
      answer: { value: 2.4, tolerance: 0.1 }
      explanation: |
        Cells in mitosis = 30 + 12 + 8 + 10 = 60 of 600, which is 0.10 of the population. Time in M phase = 0.10 × 24 h = 2.4 h. The same arithmetic gives 21.6 h for interphase and only 8/600 × 24 = 0.32 h (about 19 minutes) for anaphase. The fraction 60/600 is also the tissue's mitotic index, 10%, which week 14 uses to test whether a treatment changes the rate of division.

    # ---- Feedback (4.4)
    - slug: u04-w13-q07
      type: multiple_choice
      topic_code: "4.4"
      source: "Biology 2e §33.3 Homeostasis"
      points: 1
      prompt: |
        During labour, the baby's head stretches the cervix, which triggers release of the hormone oxytocin; oxytocin makes the uterus contract, which stretches the cervix further, which releases more oxytocin. Why is this classed as positive feedback, and how does it end?
      options:
        - "Because it is beneficial; it ends when oxytocin is used up."
        - "Because the response increases the original stimulus rather than reducing it; it ends when birth removes the stimulus."
        - "Because it returns the uterus to its set point; it ends when the set point is reached."
        - "Because oxytocin inhibits its own release; it ends when inhibition is complete."
      option_explanations:
        - |
          Positive and negative describe direction, not value; a negative loop (temperature control) is just as beneficial. Hormones are not "used up" like a fuel.
        - |
          Correct. Each contraction stretches the cervix more and so raises oxytocin further; the loop amplifies in one direction until birth, which removes the stretch and ends the cycle.
        - |
          There is no set point for a cervix in labour; the loop drives the system away from its starting state, not back to it.
        - |
          Oxytocin promotes its own release through the stretch it causes; self-inhibition would describe a negative loop.
      answer: 1
      explanation: |
        Positive feedback drives a one-way event to completion. Unlike negative feedback, it does not stabilise; it ends when the end state removes the trigger.

    - slug: u04-w13-q08
      type: multiple_choice
      topic_code: "4.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A ripening apple releases the gas ethylene, which triggers ripening in that apple and in apples nearby, and ripening fruit makes more ethylene. A grocer stores unripe bananas in a sealed bag with one ripe apple. Which prediction and explanation are correct?
      options:
        - "The bananas ripen more slowly, because the apple absorbs their ethylene."
        - "The bananas ripen faster, because the apple's ethylene starts a positive feedback loop in which each ripening banana releases more ethylene."
        - "Nothing changes, because ethylene is a gas and cannot act as a signal."
        - "The bananas ripen faster, because negative feedback keeps ethylene at a constant level."
      option_explanations:
        - |
          A ripe apple is a source of ethylene, not a sink; the sealed bag concentrates the gas rather than removing it.
        - |
          Correct. Ethylene is a hydrophobic gas that crosses membranes to its receptor; it both triggers ripening and raises ethylene production, so one ripe fruit in a closed space accelerates all the rest.
        - |
          Nitric oxide and ethylene are both gaseous ligands; being a gas lets a signal diffuse through air and through membranes.
        - |
          Constant ethylene would describe negative feedback and would not speed anything up; the acceleration comes from the loop reinforcing itself.
      answer: 1
      explanation: |
        Fruit ripening is the plant example of positive feedback the CED expects alongside labour and clotting: a response that increases its own stimulus until the process is complete.

    # ---- Cell cycle (4.5)
    - slug: u04-w13-q09
      type: multiple_choice
      topic_code: "4.5"
      source: "Biology 2e §10.1 Cell Division"
      points: 1
      prompt: |
        A human skin cell has 46 chromosomes in G₁. How many chromosomes and how many chromatids does it contain in G₂, just before mitosis?
      options:
        - "46 chromosomes, 46 chromatids"
        - "92 chromosomes, 92 chromatids"
        - "46 chromosomes, 92 chromatids"
        - "23 chromosomes, 46 chromatids"
      option_explanations:
        - |
          46 and 46 describes G₁, before S phase; after replication each chromosome is two chromatids.
        - |
          Chromosome number does not double in S phase; the chromosomes are copied but each copy stays attached to its original at the centromere, so there are still 46 chromosomes.
        - |
          Correct. S phase replicates every chromosome into two identical sister chromatids held at the centromere: 46 chromosomes, each of two chromatids, 92 chromatids in total.
        - |
          23 is the haploid number found in gametes; a skin cell is diploid throughout the cycle.
      answer: 2
      explanation: |
        Count centromeres to count chromosomes. Replication doubles chromatids, not chromosomes; anaphase doubles chromosomes (each chromatid becomes one) without changing the DNA content.

    - slug: u04-w13-q10
      type: multiple_choice
      topic_code: "4.5"
      source: "Biology 2e §10.2 The Cell Cycle"
      points: 1
      prompt: |
        A drug prevents the breakdown of cohesin proteins. Cells treated with the drug reach metaphase normally. What happens next?
      options:
        - "Sister chromatids cannot separate, so the cell cannot complete anaphase and the chromosomes stay at the metaphase plate."
        - "The chromosomes separate early, in prophase."
        - "The spindle fails to form."
        - "The nuclear envelope cannot break down."
      option_explanations:
        - |
          Correct. Anaphase begins when cohesin is degraded and the sister chromatids are released; with cohesin intact the spindle pulls but the chromatids stay joined, and the cell arrests.
        - |
          Separation is what cohesin prevents; keeping cohesin would delay separation, not bring it forward.
        - |
          The spindle is built from tubulin by the centrosomes in prophase and prometaphase; the cells reached metaphase, which requires a working spindle.
        - |
          Nuclear envelope breakdown happens in prophase and prometaphase and is complete by metaphase, which the cells reached.
      answer: 0
      explanation: |
        Each stage has a molecular trigger. Cohesin degradation is the trigger for anaphase; a drug that blocks a trigger freezes the cell at the stage just before.

    - slug: u04-w13-q11
      type: multiple_choice
      topic_code: "4.5"
      source: "Biology 2e §10.2 The Cell Cycle"
      points: 1
      prompt: |
        Why do plant cells build a cell plate during cytokinesis instead of forming a cleavage furrow like animal cells?
      options:
        - "Plant cells lack actin."
        - "A rigid cellulose wall cannot be pinched inward, so the cell lays down a new wall from the inside using Golgi vesicles that fuse at the metaphase plate."
        - "Plant cells divide without separating their cytoplasm."
        - "Plant cells have no Golgi apparatus, so they cannot make a furrow."
