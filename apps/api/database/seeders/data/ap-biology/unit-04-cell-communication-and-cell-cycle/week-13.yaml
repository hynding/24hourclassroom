          Plant cells have actin and use it in the cytoskeleton and cytoplasmic streaming; the obstacle to a furrow is the wall, not a missing protein.
        - |
          Correct. Vesicles carrying wall materials gather at the former metaphase plate, fuse into a cell plate that grows outward to meet the old wall, and enzymes use stored glucose to build the new wall between the daughters.
