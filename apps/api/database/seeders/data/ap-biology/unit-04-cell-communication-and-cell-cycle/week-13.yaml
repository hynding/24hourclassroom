    - slug: u04-w13-q13
      type: multiple_choice
      topic_code: "2.2"
      source: "Biology 2e §10.3 Control of the Cell Cycle"
      points: 1
      prompt: |
        Review. As a cell grows during G₁, it eventually divides rather than continuing to enlarge. Which relationship best explains why continued growth without division becomes a problem?
      options:
        - "Surface area grows faster than volume, so a large cell has too much membrane."
        - "Volume grows faster than surface area, so the membrane of a large cell cannot exchange materials fast enough to supply the interior."
        - "Large cells contain more DNA, which is toxic."
        - "Large cells lose their ability to make ATP."
      option_explanations:
        - |
          The relationship is reversed: volume scales with the cube of the radius and surface area with the square, so surface area lags behind volume as a cell grows.
        - |
          Correct. Surface-area-to-volume ratio falls as size increases; nutrients, gases and wastes cross the membrane too slowly for the growing interior, and dividing restores a workable ratio. Cell size is one of the conditions checked before S phase.
        - |
          DNA content is set by the genome and does not increase with cell size in G₁; it doubles only in S phase, and that is normal.
        - |
          Mitochondria keep working in a large cell; the limit is delivery across the surface, not production inside.
      answer: 1
      explanation: |
        Unit 2's SA:V argument is the physical reason cells divide. The G₁ checkpoint in week 14 is the cell's way of measuring it.

    - slug: u04-w13-q14
      type: multiple_choice
      topic_code: "2.1"
      source: "Biology 2e §10.1 Cell Division"
      points: 1
      prompt: |
        Review. Bacteria divide by binary fission with no spindle and no mitosis. Which difference between prokaryotic and eukaryotic cells best explains why eukaryotes need a mitotic spindle?
      options:
        - "Eukaryotic cells are too large for diffusion."
        - "Eukaryotes have several linear chromosomes enclosed in a nucleus, which must be condensed, attached and pulled apart so that each daughter receives a complete set."
        - "Prokaryotes have no DNA to divide."
        - "Eukaryotic cells lack a plasma membrane during division."
      option_explanations:
        - |
          Size is a reason to divide at all, not a reason the division needs a spindle; some eukaryotic cells are smaller than some bacteria.
        - |
          Correct. A bacterium copies one circular chromosome and the two copies are separated as the cell elongates. Several linear chromosomes in a membrane-bound nucleus need the spindle's kinetochore attachments to guarantee one copy of each goes to each pole.
        - |
          Prokaryotes have a circular chromosome in the nucleoid region; they replicate and segregate it, just without a spindle.
        - |
          The plasma membrane persists throughout the cycle; it is the nuclear envelope that disassembles and re-forms.
      answer: 1
      explanation: |
        The complexity of mitosis is the price of a eukaryotic genome: many chromosomes, a nucleus, and a guarantee that every daughter gets all of them.

    - slug: u04-w13-q15
      type: multiple_choice
      topic_code: "3.5"
      source: "Biology 2e §10.2 The Cell Cycle"
      points: 1
      prompt: |
        Review. During G₁ and G₂ the cell accumulates energy reserves, and assembling the spindle and moving chromosomes consume large amounts of ATP. In an aerobic human cell, which process supplies most of that ATP, and where does it occur?
      options:
        - "Glycolysis in the cytoplasm, which yields most of the cell's ATP."
        - "Oxidative phosphorylation on the inner mitochondrial membrane, driven by the electron transport chain and the proton gradient it builds."
        - "Fermentation in the mitochondrial matrix."
        - "Photophosphorylation in the nucleus."
      option_explanations:
        - |
          Glycolysis yields a net of only 2 ATP per glucose; it is the start of the pathway, not the main source.
        - |
          Correct. The electron transport chain pumps protons across the inner membrane and ATP synthase uses the gradient to make most of the roughly 30–32 ATP per glucose that an aerobic cell obtains.
        - |
          Fermentation occurs in the cytoplasm when oxygen is absent and regenerates NAD⁺ without making extra ATP; it is not the aerobic cell's main source.
        - |
          Photophosphorylation is the chloroplast's light-driven ATP synthesis; human cells have no chloroplasts and the nucleus makes no ATP.
      answer: 1
      explanation: |
        Dividing is expensive, and the cell pays for it with Unit 3's machinery. Rapidly dividing tissues are among the most mitochondria-rich.

    # ---- Select-all
    - slug: u04-w13-q16
      type: multi_select
      topic_code: "4.4"
      source: "Biology 2e §33.3 Homeostasis"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are examples of negative feedback? Select all that apply.
      options:
        - "Rising blood glucose triggers insulin, which lowers blood glucose."
        - "A fall in blood calcium triggers parathyroid hormone, which raises blood calcium."
        - "Thrombin activates clotting factors that produce more thrombin at a wound."
        - "A rise in body temperature triggers sweating, which lowers body temperature."
        - "Cervical stretch triggers oxytocin, which causes contractions that stretch the cervix further."
      option_explanations:
        - |
          Correct. The response (uptake and storage of glucose) removes the stimulus (high glucose), so the loop stabilises the variable.
        - |
          Correct. PTH increases calcium absorption in gut and kidney and release from bone; the rise in calcium then shuts PTH off.
        - |
          Thrombin amplifies its own production; the response increases the stimulus, which is positive feedback that ends only when the clot is complete.
        - |
          Correct. Evaporative cooling removes the heat that triggered it, returning temperature to the set point.
        - |
          Each contraction increases the stretch that releases more oxytocin: positive feedback driving labour to completion.
      answer: [0, 1, 3]
      explanation: |
        Ask one question of every loop: does the response reduce the stimulus (negative, stabilising) or increase it (positive, self-amplifying)? Direction of the hormone is irrelevant; glucagon and insulin are both negative.

    - slug: u04-w13-q17
      type: multi_select
      topic_code: "4.5"
      source: "Biology 2e §10.2 The Cell Cycle"
      points: 2
      partial_credit: true
      prompt: |
        Which events take place during interphase? Select all that apply.
      options:
        - "Replication of every chromosome to produce sister chromatids"
        - "Duplication of the centrosome"
        - "Separation of sister chromatids to opposite poles"
        - "Growth of the cell and accumulation of energy reserves"
        - "Formation of a cleavage furrow"
      option_explanations:
        - |
          Correct. DNA synthesis is S phase, the middle of interphase; each chromosome becomes two cohesin-joined chromatids.
        - |
          Correct. The centrosome is copied in S phase so that two are available to organise the spindle poles.
        - |
          Chromatid separation is anaphase, part of the mitotic phase, not interphase.
        - |
          Correct. G₁ and G₂ are growth and preparation phases; most of a cell's life and most of its biochemical activity happen in interphase.
        - |
          The cleavage furrow forms during cytokinesis at the end of the mitotic phase.
      answer: [0, 1, 3]
      explanation: |
        Interphase is not a rest; it is growth, copying and preparation, and it takes about 90% of the cycle. The mitotic phase only distributes what interphase made.

    # ---- True/false
    - slug: u04-w13-q18
      type: true_false
      topic_code: "4.5"
      source: "Biology 2e §10.1 Cell Division"
      points: 1
      prompt: |
        True or false: Mitosis halves the chromosome number, so that each daughter cell receives one chromosome of each homologous pair.
      answer: false
      explanation: |
        False. Mitosis separates sister chromatids, not homologous pairs, and each daughter receives one copy of every chromosome: a diploid parent produces two diploid daughters with identical genomes. Halving the chromosome number by separating homologues is meiosis (Unit 5), which makes haploid gametes. Keeping the two processes apart is the first thing the Unit 5 exam checks.

    - slug: u04-w13-q19
      type: true_false
      topic_code: "1.7"
      source: "Biology 2e §10.1 Cell Division"
      points: 1
      prompt: |
        Review. True or false: Histone proteins bind DNA tightly because they are rich in positively charged R groups, such as lysine and arginine, that attract the negatively charged phosphate backbone.
      answer: true
      explanation: |
        True. The sugar-phosphate backbone carries a negative charge on every phosphate, and histones are unusually rich in basic amino acids whose R groups are protonated at cellular pH. The ionic attraction lets DNA wrap around the eight-histone core to form a nucleosome, the first level of the compaction that packs two metres of DNA into a nucleus. Unit 6 returns to this: modifying those charges loosens or tightens the wrapping and so regulates gene expression.

    - slug: u04-w13-q20
      type: true_false
      topic_code: "2.6"
      source: "Biology 2e §33.3 Homeostasis"
      points: 1
      prompt: |
        Review. True or false: Insulin lowers blood glucose partly by causing muscle and fat cells to insert more glucose transporter proteins into their membranes, and those transporters move glucose into the cell by facilitated diffusion down its concentration gradient.
      answer: true
      explanation: |
        True. Glucose is polar and cannot cross the bilayer on its own; it enters through carrier proteins. Insulin signalling moves vesicles holding stored transporters to the surface, raising the membrane's capacity for facilitated diffusion, which needs no ATP because blood glucose is higher than the cell's. The feedback loop of this week therefore works through the membrane transport of Unit 2.

    # ---- Fill in the blank
    - slug: u04-w13-q21
      type: fill_blank
      topic_code: "1.6"
      source: "Biology 2e §10.1 Cell Division"
      points: 1
      prompt: |
        Review. Each chromosome contains one very long DNA double helix whose two strands are held together by ____ bonds between complementary bases, bonds weak enough to be separated when the DNA is copied in S phase.
      answer: ["hydrogen"]
      explanation: |
        Hydrogen bonds (two per A–T pair, three per G–C pair) hold the strands together with enough strength to keep the helix stable yet little enough that enzymes can unzip it for replication. The covalent phosphodiester bonds along each backbone are never broken during copying. "Covalent" or "phosphodiester" would therefore not earn the point.

    - slug: u04-w13-q22
      type: fill_blank
      topic_code: "4.4"
      source: "Biology 2e §33.3 Homeostasis"
      points: 1
      prompt: |
        A homeostatic control system compares the measured value of a variable, such as body temperature, with a target value called the ____, and triggers responses when the two differ.
      answer: ["set point", "setpoint", "set-point"]
      explanation: |
        The set point is the target around which negative feedback holds a variable. It is not fixed for life: during fever, pyrogens raise the hypothalamus's temperature set point, so the body shivers to reach a new, higher target. "Normal value" or "equilibrium" describe the result, not the reference the control centre uses, so they are not accepted.

    # ---- Free response
    - slug: u04-w13-q23
      type: short_answer
      topic_code: "4.4"
      source: "Biology 2e §33.3 Homeostasis"
      points: 4
      prompt: |
        Conceptual analysis. During a bacterial infection, chemicals called pyrogens act on the hypothalamus and raise its temperature set point from 37 °C to 39 °C. (a) Describe the responses the body produces in the first hour after the set point rises, while the actual temperature is still 37 °C. (b) Explain why the person feels cold and shivers even though their temperature is normal. (c) Once the infection ends and the set point returns to 37 °C, predict the responses the body produces and justify your prediction in terms of negative feedback.
      answer: |
        Shivering, vasoconstriction and goose bumps, as if the body were cold, because the hypothalamus compares 37 °C with a 39 °C target and reads a deficit; when the set point drops back, the 39 °C body is now above target, so sweating and vasodilation return it to 37 °C. In both cases the response moves the variable toward the current set point.
      explanation: |
        Four points.

        (a) Describe, 1 pt: heat-conserving and heat-generating responses: shivering, vasoconstriction of skin vessels, goose bumps (arrector pili), seeking warmth. At least two must be named.

        (b) Explain, 2 pts: 1 pt for the comparison: the control centre compares actual temperature with the set point, and 37 °C is now 2 °C below target, so the hypothalamus registers "too cold"; 1 pt for the inference that feedback acts relative to the set point, not to an absolute value, so a normal temperature is treated as a deficit. Accept "the thermostat has been turned up".

        (c) Predict and justify, 1 pt: sweating and vasodilation (feeling hot, flushed), because the body at 39 °C is now above the restored 37 °C set point and negative feedback produces heat-losing responses until temperature falls back to the target. The justification must mention that the response opposes the difference from the set point.

        Zero: answers that treat fever as a failure of homeostasis with no reference to the set point, or that predict shivering when the set point falls.

    - slug: u04-w13-q24
      type: short_answer
      topic_code: "4.5"
      source: "Biology 2e §10.2 The Cell Cycle"
      points: 4
      prompt: |
        Analyze a model. A student's diagram of mitosis shows a cell with four chromosomes in G₁. In the student's metaphase drawing, the four chromosomes are shown as single chromatids lined up at the plate, and in anaphase two chromosomes move to each pole, giving daughter cells with two chromosomes each. (a) Identify two errors in the model. (b) Describe what a correct metaphase cell and correct daughter cells would contain. (c) Explain which events of the cell cycle guarantee that the daughters are genetically identical to the parent.
      answer: |
        Errors: chromosomes at metaphase should each be two sister chromatids (replicated in S phase), and daughters should each receive four chromosomes, not two. Correct metaphase: four chromosomes, eight chromatids, on the plate; each daughter: four single-chromatid chromosomes. S phase copies every chromosome exactly, cohesin keeps the copies together, kinetochores attach the two chromatids to opposite poles, and anaphase sends one copy of each chromosome to each pole.
      explanation: |
        Four points.

        (a) Identify, 1 pt for both: the metaphase chromosomes are drawn unreplicated (should be two chromatids each) and the chromosome number has been halved (each daughter should have four). Identifying only one error earns nothing for this part, but (b) and (c) are still available.

        (b) Describe, 1 pt: metaphase cell has four chromosomes each of two sister chromatids (eight chromatids) aligned on the metaphase plate; each daughter cell has four chromosomes, each a single chromatid, identical to the parent's set.

        (c) Explain, 2 pts: 1 pt for S-phase replication producing identical sister chromatids held by cohesin; 1 pt for the mechanism of distribution: kinetochores of sister chromatids attach to microtubules from opposite poles, and at anaphase cohesin is degraded so one chromatid of every chromosome travels to each pole. Accept "the spindle checkpoint ensures every chromatid is attached" as part of the second point.

        Zero: answers that say the daughters are identical "because mitosis makes clones" with no mechanism, or that describe homologous pairs separating.

    - slug: u04-w13-q25
      type: long_answer
      topic_code: "4.5"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. A class tested whether temperature changes the rate at which onion root-tip cells divide. Onion bulbs were grown in water at three temperatures for 48 hours; root tips were then fixed, squashed and stained, and 500 cells were classified for each temperature. The cell cycle in this tissue at 20 °C is known to take about 24 hours.

        | Temperature (°C) | Interphase | Prophase | Metaphase | Anaphase | Telophase | Cells in mitosis (%) |
        |---|---|---|---|---|---|---|
        | 10 | 480 | 11 | 4 | 2 | 3 | 4.0 |
        | 20 | 450 | 26 | 10 | 6 | 8 | 10.0 |
        | 30 | 425 | 38 | 16 | 9 | 12 | 15.0 |

        (a) Identify the independent and dependent variables and state two variables that should have been controlled.
        (b) Describe the pattern in the data.
        (c) The class concluded that "mitosis takes longer at higher temperatures because more cells are in mitosis." Evaluate this conclusion and propose an alternative explanation that is consistent with the data and with how enzymes respond to temperature.
        (d) Describe one additional measurement that would distinguish the two explanations, and predict its result under each.
      answer: |
        IV: temperature; DV: percentage of cells in mitosis (or counts per stage); control the onion variety, duration, water, light and cell count. The share of cells in mitosis rises from 4% at 10 °C to 15% at 30 °C, and every stage rises in proportion. The conclusion confuses a longer mitosis with a shorter cycle: if the whole cycle speeds up because enzymes work faster with temperature, more cells pass through mitosis per hour and a snapshot catches more of them, even if mitosis itself is the same length or shorter. To distinguish, time the cycle directly (for example, follow labelled cells from one mitosis to the next); a faster cycle at 30 °C supports the enzyme explanation, while an unchanged cycle with a longer M phase supports the class's claim.
      explanation: |
        Eight points.

        (a) 2 pts: 1 pt for independent variable = temperature and dependent variable = percentage (or number) of cells in mitosis, or the distribution of cells across stages; 1 pt for two controlled variables from: same onion variety and bulb size, same 48-hour exposure, same water and nutrients, same light, same region of root tip sampled, same number of cells counted, same staining method.

        (b) 1 pt: the percentage of cells in mitosis increases with temperature (4.0% at 10 °C, 10.0% at 20 °C, 15.0% at 30 °C) and each stage of mitosis increases in roughly the same proportion; at least two numbers or a clear ordering are required.

        (c) 3 pts: 1 pt for recognising that a snapshot count cannot by itself distinguish a longer mitosis from a shorter cycle, because the fraction in mitosis is time in mitosis divided by total cycle time; 1 pt for the alternative: enzyme-catalysed processes (DNA replication, protein synthesis, spindle assembly) speed up with temperature within the working range, so the whole cycle is shorter at 30 °C, more cells enter mitosis per hour, and the fraction in mitosis rises; 1 pt for noting that the uniform rise across all stages fits a faster cycle better than a specific lengthening of mitosis, or for noting that the class's conclusion would require interphase to have shortened by exactly enough to compensate. Accept a reference to the roughly doubling of enzyme activity per 10 °C rise.

        (d) 2 pts: 1 pt for a measurement that captures time directly: following individual cells by time-lapse microscopy, measuring the interval between successive divisions, or pulse-labelling S-phase cells and timing their arrival in mitosis; 1 pt for predictions under each explanation: if the cycle is faster at 30 °C, the interval between divisions will be shorter than 24 hours (and mitosis itself may be the same length or shorter); if the class is right, the total cycle will still be about 24 hours and mitosis alone will be longer.

        Zero for a part: restating the table as the pattern; attributing the rise to "cells like warmth"; explaining the result by denaturation (activity rose, it did not fall, across this range); proposing an additional count of the same kind as the original instead of a timing measurement.
