    points: 1
    prompt: |
      Review. As a cell grows, its volume increases faster than its surface area, so its ____ ratio falls, and the cell can no longer exchange materials with its surroundings fast enough; this is one reason cell size is assessed at the G₁ checkpoint.
    answer: ["surface area to volume", "surface-area-to-volume", "surface area-to-volume", "SA:V", "SA/V", "surface-to-volume"]
    explanation: |
      For a sphere SA:V = 3/r, so the ratio halves when the radius doubles. Membrane transport scales with surface area while demand scales with volume, which sets an upper limit on cell size and makes division the solution. "Volume to surface area" reverses the ratio and would rise, not fall, so it is not accepted.

  - slug: u04-exam-q46
    type: fill_blank
    topic_code: "1.6"
    source: "Biology 2e §10.2 The Cell Cycle"
    points: 1
    prompt: |
      Review. The exact copying of each chromosome during S phase depends on ____ base pairing, in which adenine pairs with thymine and guanine with cytosine, so that each original strand specifies the sequence of its new partner.
    answer: ["complementary"]
    explanation: |
      Complementary pairing (two hydrogen bonds for A–T, three for G–C) is what makes a strand a template, and it is why the two sister chromatids are identical and why both daughters of mitosis carry the same genome. "Antiparallel" describes the strands' opposite directions, not the pairing rule, so it is not accepted.

  # ---- Numeric (second)
  - slug: u04-exam-q47
    type: numeric
    topic_code: "4.6"
    source: "general knowledge"
    points: 1
    prompt: |
      A class grew root tips in water (control) and in a growth-promoting extract. Of 1,000 control cells, 850 were in interphase and 150 in mitosis. Of 1,000 treated cells, 800 were in interphase and 200 in mitosis. Using the control proportions as the expected values for the treated sample, calculate the chi-square value. Give your answer to one decimal place.
    answer: { value: 19.6, tolerance: 0.3 }
    explanation: |
      Expected for the treated sample: 850 interphase and 150 mitosis. χ² = (800 − 850)²/850 + (200 − 150)²/150 = 2,500/850 + 2,500/150 = 2.94 + 16.67 = 19.6. With 1 degree of freedom the critical value at p = 0.05 is 3.84, so the null hypothesis of no effect is rejected: the extract raised the mitotic index from 15% to 20% by more than chance would explain. The mitosis category contributes most of the value because the same deviation of 50 is a larger fraction of 150 than of 850.

  # ---- Free response
  - slug: u04-exam-q48
    type: short_answer
    topic_code: "4.4"
    source: "Biology 2e §33.3 Homeostasis"
    points: 4
    prompt: |
      Conceptual analysis. When blood calcium falls, the parathyroid glands release parathyroid hormone (PTH), which increases calcium absorption in the intestine and kidney and releases calcium from bone; as blood calcium rises, PTH release declines. A patient has a tumour of the parathyroid gland that secretes PTH continuously regardless of blood calcium. (a) Identify the receptor, the control centre and the effectors in the normal loop. (b) Explain why the normal loop is classed as negative feedback. (c) Predict the patient's blood calcium level and explain, in terms of the loop, why it is not corrected.
    answer: |
      Calcium-sensing cells of the parathyroid are the receptor and control centre; intestine, kidney and bone are the effectors. The response (rising calcium) removes the stimulus (low calcium), so it is negative feedback. The patient's calcium will be persistently high because the gland no longer responds to the rise: the signal is produced independently of the variable, so the feedback arrow is cut and the effectors keep raising calcium.
    explanation: |
      Four points.

      (a) Identify, 1 pt: receptor and control centre = calcium-sensing cells of the parathyroid gland (accept the gland for both roles); effectors = intestine, kidney and bone (at least two named). All three components must be addressed.

      (b) Explain, 1 pt: the response (increased blood calcium) opposes and removes the stimulus (low calcium), so PTH release declines and the variable returns to its set point; naming "negative feedback" without stating that the response removes the stimulus earns nothing.

      (c) Predict and explain, 2 pts: 1 pt for predicting high blood calcium (hypercalcaemia); 1 pt for the explanation that the tumour secretes PTH independently of blood calcium, so the rising calcium no longer reduces the signal, the loop's feedback link is broken, and the effectors continue to raise calcium without a stop. Accept "the gland ignores the sensor" as the broken link.

      Zero: answers that classify the loop as positive because PTH raises calcium, or that predict low calcium.

  - slug: u04-exam-q49
    type: long_answer
    topic_code: "4.6"
    source: "general knowledge"
    points: 8
    prompt: |
      Interpreting and evaluating experimental results. Researchers tested how a growth factor drives cultured cells into S phase. Cells were starved of growth factor for 24 hours (so nearly all rested in G₁), then given the treatments below. After 16 hours they measured phosphorylated ERK (the final kinase of the Ras cascade), the amount of cyclin D, and the percentage of cells in S phase. Each value is the mean of five cultures; standard errors were below 3 units.

      | Treatment | Phosphorylated ERK (relative) | Cyclin D (relative) | Cells in S phase (%) |
      |---|---|---|---|
      | No growth factor | 2 | 3 | 4 |
      | Growth factor | 45 | 40 | 48 |
      | Growth factor + receptor tyrosine kinase inhibitor | 3 | 4 | 5 |
      | Growth factor + inhibitor of MEK (the kinase that phosphorylates ERK) | 4 | 5 | 6 |
      | Growth factor + cyclin D synthesis blocked | 44 | 3 | 5 |
      | No growth factor, cells expressing GTP-locked Ras | 43 | 38 | 46 |

      (a) Identify the independent and dependent variables and the purpose of the first row.
      (b) Describe the pattern across the three inhibitor treatments compared with growth factor alone.
      (c) Using the mechanism of signal transduction and of cell-cycle control, explain the order of events that connects growth factor binding to entry into S phase, and justify that order with specific rows of the table.
      (d) The last row shows cells with GTP-locked Ras entering S phase without growth factor. Explain what this result shows about the role of Ras, and predict the result for GTP-locked Ras cells treated with the cyclin D synthesis blocker, with justification.
    answer: |
      IV: treatment; DV: phosphorylated ERK, cyclin D and percentage in S phase; the untreated row gives the G₁-arrested baseline. The receptor and MEK inhibitors abolish all three measurements; blocking cyclin D leaves ERK phosphorylation intact but abolishes cyclin D and S-phase entry. Order: growth factor binds the receptor tyrosine kinase, which dimerises and autophosphorylates; Ras is activated; the Raf-MEK-ERK cascade phosphorylates ERK; ERK changes gene expression so that cyclin D is made; cyclin D activates its Cdk, Rb is phosphorylated, E2F is released and the cell enters S phase. The receptor inhibitor row shows everything depends on reception; the MEK row shows cyclin D depends on ERK; the cyclin D row shows S-phase entry depends on cyclin D but ERK does not. GTP-locked Ras signals downstream without ligand, so Ras is sufficient and sits between the receptor and ERK; with cyclin D blocked, those cells would still show high phosphorylated ERK (about 43) but low cyclin D and about 5% in S phase, because the block is downstream of Ras.
    explanation: |
      Eight points.

      (a) 2 pts: 1 pt for independent variable = the treatment (presence of growth factor, inhibitor, or Ras mutation) and dependent variables = phosphorylated ERK, cyclin D level and percentage of cells in S phase; 1 pt for the first row's purpose: a baseline for growth-factor-starved cells arrested in G₁, against which every stimulation and inhibition is compared.

      (b) 1 pt: the receptor inhibitor and the MEK inhibitor bring all three measurements back to baseline (ERK 3–4, cyclin D 4–5, S phase 5–6%), whereas the cyclin D blocker leaves phosphorylated ERK at the stimulated level (44) while cyclin D (3) and S phase (5%) fall to baseline. The contrast between the third pattern and the first two must be stated.

      (c) 3 pts: 1 pt for the signalling order: growth factor → receptor tyrosine kinase (dimerisation, cross-phosphorylation) → Ras → kinase cascade (Raf, MEK) → phosphorylated ERK; 1 pt for the cell-cycle order: ERK leads to expression of cyclin D → cyclin D-Cdk complex → Rb phosphorylation and E2F release → passage through the G₁ checkpoint into S phase; 1 pt for justification with rows: the receptor inhibitor row shows all downstream events require reception; the MEK inhibitor row shows cyclin D and S phase require ERK phosphorylation, placing them downstream of the cascade; the cyclin D blocker row shows ERK is upstream of cyclin D (ERK is unaffected) and cyclin D is required for S phase. At least two rows must be used explicitly.

      (d) 2 pts: 1 pt for the interpretation: Ras locked in its active GTP-bound form drives the cascade, cyclin D synthesis and S-phase entry with no ligand, so Ras acts downstream of the receptor and upstream of ERK and is sufficient to trigger the whole sequence, which is why such mutations are oncogenic; 1 pt for the prediction: GTP-locked Ras cells with cyclin D blocked would show high phosphorylated ERK (near 43) but baseline cyclin D and S-phase entry (near 5%), because the block is downstream of everything Ras controls except the cyclin D step itself.

      Zero for a part: restating the table without comparison; placing cyclin D upstream of ERK; explaining the Ras result as "Ras replaces the growth factor" without locating it in the pathway; predicting that GTP-locked Ras overcomes a cyclin D block.
