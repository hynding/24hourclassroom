    answer: true
    explanation: |
      True. Small nonpolar molecules (O₂, CO₂, NO, steroids) dissolve in the hydrophobic core of the bilayer and diffuse through it; only polar and charged molecules need channels or carriers (topic 2.4). That is why NO can signal to a neighbouring cell without a surface receptor, and why its short half-life keeps its action local.

  - slug: u04-exam-q38
    type: true_false
    topic_code: "4.6"
    source: "Biology 2e §10.4 Cancer and the Cell Cycle"
    points: 1
    prompt: |
      True or false: A proto-oncogene is a gene that is found only in tumour cells.
    answer: false
    explanation: |
      False. Proto-oncogenes are normal, essential genes present in every cell; they encode positive regulators of division such as growth-factor receptors, Ras and cyclins. They are called oncogenes only once a gain-of-function mutation has made the product overactive or impossible to switch off. The gene found "only in tumours" is a misconception; what tumours have is a mutated version of a gene everyone carries.

  - slug: u04-exam-q39
    type: true_false
    topic_code: "3.1"
    source: "Biology 2e §33.3 Homeostasis"
    points: 1
    prompt: |
      Review. True or false: Feedback inhibition, in which the end product of a metabolic pathway binds the first enzyme of the pathway and reduces its activity, is an example of negative feedback operating at the level of a single cell's chemistry.
    answer: true
    explanation: |
      True. The product is the response, its accumulation is the stimulus, and the response reduces the production that caused it, which is exactly the logic of a negative loop. The mechanism is allosteric regulation (topic 3.1): the product binds a site other than the active site and changes the enzyme's shape. Homeostasis in the body and feedback inhibition in a pathway are the same idea at different scales.

