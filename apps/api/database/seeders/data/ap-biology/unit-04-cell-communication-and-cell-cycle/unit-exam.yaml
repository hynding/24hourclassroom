  # ---- True/false (5)
  - slug: u04-exam-q35
    type: true_false
    topic_code: "4.2"
    source: "Biology 2e §9.1 Signaling Molecules and Cellular Receptors"
    points: 1
    prompt: |
      True or false: A G protein-coupled receptor crosses the plasma membrane seven times, and the G protein it activates is switched off when it hydrolyses GTP to GDP.
    answer: true
    explanation: |
      True. The seven transmembrane segments are the structural signature of the class, and the GTP-GDP cycle is its timer. The membrane-spanning segments are rich in hydrophobic R groups, as any transmembrane protein's must be. Cholera toxin disables the hydrolysis step, which is why the signal in affected intestinal cells never ends.

  - slug: u04-exam-q36
    type: true_false
    topic_code: "4.5"
    source: "Biology 2e §10.2 The Cell Cycle"
    points: 1
    prompt: |
      True or false: Cytokinesis is the final stage of mitosis, following telophase.
    answer: false
    explanation: |
      False. Mitosis (karyokinesis) is the division of the nucleus and ends with telophase; cytokinesis is the division of the cytoplasm and is a separate process that usually overlaps late mitosis. The distinction matters because the two can be uncoupled: some cells complete mitosis without cytokinesis and become multinucleate.

  - slug: u04-exam-q37
    type: true_false
    topic_code: "2.4"
    source: "Biology 2e §9.1 Signaling Molecules and Cellular Receptors"
    points: 1
    prompt: |
