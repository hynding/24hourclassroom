    topic_code: "4.6"
    source: "Biology 2e §10.4 Cancer and the Cell Cycle"
    points: 1
    prompt: |
      Skin cells exposed to sunlight suffer DNA damage daily, yet most never become cancerous. Which mechanism is most directly responsible?
    options:
