unit: 4
description: |
  49 questions · about 65 minutes · every topic of Unit 4 (4.1 to 4.6) with about 20% cumulative review of Units
  1 to 3, two data-based stimulus sets, two numeric items, one short free-response item (4 points) and one long
  free-response item (8 points). Multiple choice, select-all, true/false and numeric items are graded at once;
  fill-in-the-blank items are matched automatically; the two free-response items are graded by your teacher
  against the acceptable-answer summary.
questions:
  # ---- Stimulus set A: dissecting a calcium-release pathway (4.2, 4.3)
  - slug: u04-exam-q01
    type: multiple_choice
    topic_code: "4.2"
    source: "Biology 2e §9.2 Propagation of the Signal"
    points: 1
    stimulus: |
      A hormone causes cultured gland cells to secrete a digestive enzyme. Researchers measured cytoplasmic Ca²⁺ and enzyme secretion two minutes after each treatment. Each value is the mean of four cultures.

      | Treatment | Cytoplasmic Ca²⁺ (relative) | Enzyme secreted (relative) |
      |---|---|---|
      | Normal cells, no hormone | 1 | 2 |
      | Normal cells + hormone | 50 | 90 |
      | Cells whose G protein cannot bind GTP + hormone | 1 | 2 |
      | Normal cells + phospholipase C inhibitor + hormone | 1 | 3 |
      | Normal cells + IP₃ injected into the cytoplasm, no hormone | 48 | 88 |
      | Cells with ER Ca²⁺ channels blocked + hormone | 1 | 3 |
    prompt: |
      Which ordering of the pathway's components is best supported by the whole table?
    options:
      - "Hormone → receptor → G protein → phospholipase C → IP₃ → Ca²⁺ release from the ER → secretion"
      - "Hormone → IP₃ → G protein → phospholipase C → Ca²⁺ → secretion"
      - "Hormone → ER Ca²⁺ channel → G protein → IP₃ → secretion"
      - "Hormone → phospholipase C → receptor → G protein → secretion"
    option_explanations:
      - |
        Correct. Blocking the G protein, phospholipase C or the ER channel each abolishes the Ca²⁺ rise and secretion, so all three are required; injected IP₃ restores both without hormone, so IP₃ lies downstream of the receptor, G protein and phospholipase C and upstream of the ER channel.
      - |
        If IP₃ came before the G protein, injected IP₃ would not bypass a GTP-binding-defective G protein; but it did, which places IP₃ downstream.
      - |
        The ER channel is the last step before secretion: blocking it stops the Ca²⁺ rise, and IP₃ (which opens it) still needs it. It cannot sit first.
      - |
        The receptor is at the surface and is the first protein the hormone touches; phospholipase C is a membrane enzyme activated only after the G protein.
    answer: 0
    explanation: |
      Order a pathway by two rules: a block stops everything downstream of it, and an added intermediate bypasses every block upstream of it.

  - slug: u04-exam-q02
    type: multiple_choice
    topic_code: "4.3"
    source: "Biology 2e §9.2 Propagation of the Signal"
    points: 1
    stimulus: |
      A hormone causes cultured gland cells to secrete a digestive enzyme. Researchers measured cytoplasmic Ca²⁺ and enzyme secretion two minutes after each treatment. Each value is the mean of four cultures.

      | Treatment | Cytoplasmic Ca²⁺ (relative) | Enzyme secreted (relative) |
      |---|---|---|
      | Normal cells, no hormone | 1 | 2 |
      | Normal cells + hormone | 50 | 90 |
      | Cells whose G protein cannot bind GTP + hormone | 1 | 2 |
      | Normal cells + phospholipase C inhibitor + hormone | 1 | 3 |
      | Normal cells + IP₃ injected into the cytoplasm, no hormone | 48 | 88 |
      | Cells with ER Ca²⁺ channels blocked + hormone | 1 | 3 |
    prompt: |
      What role do the data assign to IP₃?
    options:
      - "IP₃ is the hormone's receptor."
      - "IP₃ is a second messenger: produced inside the cell after reception, sufficient on its own to open ER Ca²⁺ channels and trigger the response."
      - "IP₃ is an enzyme that phosphorylates the G protein."
      - "IP₃ is a competitive inhibitor of the hormone."
    option_explanations:
      - |
        Receptors are surface proteins that bind the hormone; IP₃ is a small molecule injected into the cytoplasm that acts with no hormone present at all.
      - |
        Correct. Injected IP₃ reproduced the full response without hormone and without needing the G protein or phospholipase C, which is the defining test for a second messenger that acts downstream.
      - |
        IP₃ is a sugar phosphate released from a membrane lipid, not a kinase; it works by opening a channel, and the G protein is upstream of it.
      - |
        An inhibitor would reduce the response; IP₃ produced it in full.
    answer: 1
    explanation: |
      Second messengers are identified experimentally by sufficiency: add the candidate alone and get the response.

  - slug: u04-exam-q03
    type: multiple_choice
    topic_code: "4.3"
    source: "Biology 2e §9.1 Signaling Molecules and Cellular Receptors"
    points: 1
    stimulus: |
      A hormone causes cultured gland cells to secrete a digestive enzyme. Researchers measured cytoplasmic Ca²⁺ and enzyme secretion two minutes after each treatment. Each value is the mean of four cultures.

      | Treatment | Cytoplasmic Ca²⁺ (relative) | Enzyme secreted (relative) |
      |---|---|---|
      | Normal cells, no hormone | 1 | 2 |
      | Normal cells + hormone | 50 | 90 |
      | Cells whose G protein cannot bind GTP + hormone | 1 | 2 |
      | Normal cells + phospholipase C inhibitor + hormone | 1 | 3 |
      | Normal cells + IP₃ injected into the cytoplasm, no hormone | 48 | 88 |
      | Cells with ER Ca²⁺ channels blocked + hormone | 1 | 3 |
    prompt: |
      A seventh culture carries a G protein that binds GTP normally but cannot hydrolyse it. Predict its measurements after a brief pulse of hormone followed by thorough washing to remove the hormone.
    options:
      - "Ca²⁺ and secretion stay at baseline, because the G protein is defective."
      - "Ca²⁺ and secretion rise and then remain high long after the hormone is washed away, because the G protein stays active and keeps phospholipase C producing IP₃."
      - "Ca²⁺ rises but secretion does not."
      - "The cells secrete without any hormone, but only once."
    option_explanations:
      - |
        This G protein activates normally; its defect is in switching off, which makes the response longer, not absent.
      - |
        Correct. GTP hydrolysis is the G protein's timer. Without it, phospholipase C keeps making IP₃, the ER keeps releasing Ca²⁺ faster than pumps can clear it, and secretion continues with no hormone present, as in cholera toxin's effect on intestinal cells.
      - |
        Every row of the table shows Ca²⁺ and secretion rising together; the channel-blocked row shows that secretion follows Ca²⁺.
      - |
        With no hormone the G protein is never switched on; the lesion only matters once a pulse has activated it, after which the signal fails to end.
    answer: 1
    explanation: |
      Losing an off switch converts a pulse into a permanent signal. The same logic applies to Ras, phosphodiesterase and non-degradable cyclin.

  - slug: u04-exam-q04
    type: multiple_choice
    topic_code: "4.2"
    source: "Biology 2e §9.2 Propagation of the Signal"
    points: 1
    stimulus: |
      A hormone causes cultured gland cells to secrete a digestive enzyme. Researchers measured cytoplasmic Ca²⁺ and enzyme secretion two minutes after each treatment. Each value is the mean of four cultures.

      | Treatment | Cytoplasmic Ca²⁺ (relative) | Enzyme secreted (relative) |
      |---|---|---|
      | Normal cells, no hormone | 1 | 2 |
      | Normal cells + hormone | 50 | 90 |
      | Cells whose G protein cannot bind GTP + hormone | 1 | 2 |
      | Normal cells + phospholipase C inhibitor + hormone | 1 | 3 |
      | Normal cells + IP₃ injected into the cytoplasm, no hormone | 48 | 88 |
      | Cells with ER Ca²⁺ channels blocked + hormone | 1 | 3 |
    prompt: |
      Which single treatment would restore secretion in the cells whose G protein cannot bind GTP, and why?
    options:
      - "Adding more hormone, because the receptor would eventually activate the G protein."
      - "Injecting IP₃, because it enters the pathway downstream of the defective step."
      - "Adding a phospholipase C inhibitor, because it removes the block."
      - "Blocking the ER Ca²⁺ channels, because the ER would then release its store."
    option_explanations:
      - |
        A G protein that cannot bind GTP cannot be switched on by any amount of receptor activation; raising the hormone dose changes nothing upstream of a complete block.
      - |
        Correct. IP₃ is downstream of the G protein and phospholipase C; supplying it directly bypasses the defect and opens the ER channels, exactly as the injected-IP₃ row shows in normal cells.
      - |
        Inhibiting phospholipase C adds a second block downstream of the first; it cannot remove the G protein defect.
      - |
        Blocking the channel prevents release; the ER store leaves only through those channels, so blocking them lowers Ca²⁺ further.
    answer: 1
    explanation: |
      To rescue a blocked pathway, supply something downstream of the block. This is the same reasoning that locates where a mutation acts.

  # ---- Stimulus set B: where three drugs arrest the cycle (4.5, 4.6)
  - slug: u04-exam-q05
    type: multiple_choice
    topic_code: "4.6"
    source: "Biology 2e §10.3 Control of the Cell Cycle"
    points: 1
    stimulus: |
      Cultured human cells were grown with or without one of three drugs for 24 hours, then the percentage of cells in each part of the cycle was measured from their DNA content and chromosome state. The untreated cycle takes 20 hours.

      | Culture | G₁ (%) | S (%) | G₂ and M (%) |
      |---|---|---|---|
      | Untreated | 55 | 30 | 15 |
      | Drug A | 92 | 4 | 4 |
      | Drug B | 20 | 10 | 70 |
      | Drug C | 56 | 29 | 15 |
    prompt: |
      Where in the cycle does drug A act, and what kind of molecule could it be?
    options:
      - "At the M checkpoint; a microtubule poison."
      - "At the G₁-to-S transition; an inhibitor of growth-factor signalling or of the G₁ Cdk-cyclin complex, so cells cannot pass the restriction point."
      - "During S phase; a DNA replication inhibitor that traps cells in S."
      - "Nowhere; drug A has no effect."
    option_explanations:
      - |
        A microtubule poison traps cells in mitosis and would swell the G₂ and M category, as drug B does; drug A emptied it.
      - |
        Correct. Cells pile up just before the step a drug blocks; 92% in G₁ with S and G₂/M almost empty means cells reach the G₁ checkpoint and cannot pass it.
      - |
        A replication inhibitor would leave cells stuck in S phase, raising the S column; drug A reduced S to 4%.
      - |
        The distribution changed from 55/30/15 to 92/4/4; that is a large effect.
    answer: 1
    explanation: |
      Read a phase-distribution table by asking where cells accumulate; the block is at the exit from that phase.

  - slug: u04-exam-q06
    type: multiple_choice
    topic_code: "4.6"
    source: "Biology 2e §10.3 Control of the Cell Cycle"
    points: 1
    stimulus: |
      Cultured human cells were grown with or without one of three drugs for 24 hours, then the percentage of cells in each part of the cycle was measured from their DNA content and chromosome state. The untreated cycle takes 20 hours.

      | Culture | G₁ (%) | S (%) | G₂ and M (%) |
      |---|---|---|---|
      | Untreated | 55 | 30 | 15 |
      | Drug A | 92 | 4 | 4 |
      | Drug B | 20 | 10 | 70 |
      | Drug C | 56 | 29 | 15 |
    prompt: |
      Microscopy shows that most drug B cells have condensed chromosomes that never reach the metaphase plate. Which explanation fits both the table and the microscopy?
    options:
      - "Drug B prevents DNA replication."
      - "Drug B disrupts spindle microtubules, so kinetochores are never properly attached, the M checkpoint is not satisfied and cells accumulate in mitosis."
      - "Drug B activates p53, arresting cells in G₁."
      - "Drug B speeds up the cycle so cells spend more time dividing."
    option_explanations:
      - |
        Cells with condensed chromosomes have completed S phase; a replication block would keep them in S with uncondensed chromatin.
      - |
        Correct. Without a working spindle the chromosomes cannot align, the spindle checkpoint holds the cell before anaphase, and the G₂/M category swells to 70%.
      - |
        A p53 arrest would raise the G₁ column, as drug A did; drug B lowered it to 20%.
      - |
        A faster cycle would not change the proportions in each phase unless one phase were specifically lengthened; the microscopy shows an arrest, not speed.
    answer: 1
    explanation: |
      Combine the count with the picture: an M-phase pile-up with unaligned chromosomes points at the spindle checkpoint, the way paclitaxel and related drugs work.

  - slug: u04-exam-q07
    type: multiple_choice
    topic_code: "4.5"
    source: "Biology 2e §10.2 The Cell Cycle"
    points: 1
    stimulus: |
      Cultured human cells were grown with or without one of three drugs for 24 hours, then the percentage of cells in each part of the cycle was measured from their DNA content and chromosome state. The untreated cycle takes 20 hours.

      | Culture | G₁ (%) | S (%) | G₂ and M (%) |
      |---|---|---|---|
      | Untreated | 55 | 30 | 15 |
      | Drug A | 92 | 4 | 4 |
      | Drug B | 20 | 10 | 70 |
      | Drug C | 56 | 29 | 15 |
    prompt: |
      The researchers sorted cells into the G₂ and M category because each contained twice the DNA of a G₁ cell. Why do G₂ cells have twice the DNA while still having the same number of chromosomes?
    options:
      - "Because each chromosome was replicated in S phase into two sister chromatids that remain joined at the centromere."
      - "Because G₂ cells have fused with a neighbour."
      - "Because the chromosome number doubled in S phase."
      - "Because DNA is made during mitosis."
    option_explanations:
      - |
        Correct. Replication doubles the DNA and the chromatids but not the chromosomes; the count stays at 46 until anaphase separates the chromatids.
      - |
        Cultured cells do not fuse during the normal cycle; the doubling is within each cell.
      - |
        Chromosome number is constant from G₁ through metaphase; it is chromatid number that doubles in S.
      - |
        DNA synthesis is S phase; mitosis distributes DNA already made.
    answer: 0
    explanation: |
      DNA content, chromatid number and chromosome number change at different moments: S phase doubles the first two, anaphase doubles the third, cytokinesis halves all three per cell.

  - slug: u04-exam-q08
    type: numeric
    topic_code: "4.5"
    source: "Biology 2e §10.3 Control of the Cell Cycle"
    points: 1
    stimulus: |
      Cultured human cells were grown with or without one of three drugs for 24 hours, then the percentage of cells in each part of the cycle was measured from their DNA content and chromosome state. The untreated cycle takes 20 hours.

      | Culture | G₁ (%) | S (%) | G₂ and M (%) |
      |---|---|---|---|
      | Untreated | 55 | 30 | 15 |
      | Drug A | 92 | 4 | 4 |
      | Drug B | 20 | 10 | 70 |
      | Drug C | 56 | 29 | 15 |
    prompt: |
      Assuming the untreated cells divide asynchronously, estimate the length of S phase in hours for the untreated culture. Give your answer to one decimal place.
    answer: { value: 6.0, tolerance: 0.2 }
    explanation: |
      In an unsynchronised population the fraction of cells in a phase equals the fraction of the cycle that phase occupies: 0.30 × 20 h = 6.0 h for S phase, 11 h for G₁ and 3 h for G₂ plus M. The estimate assumes no drug and no synchronisation; the drug-treated cultures violate the assumption, which is why their percentages cannot be converted to times.

  # ---- Cell communication (4.1)
  - slug: u04-exam-q09
    type: multiple_choice
    topic_code: "4.1"
    source: "Biology 2e §9.1 Signaling Molecules and Cellular Receptors"
    points: 1
    prompt: |
      Heart muscle cells are connected by gap junctions, and a wave of contraction passes across the heart far faster than a hormone could diffuse between cells. Which explanation is correct?
    options:
      - "The cells are joined by channels through which ions pass directly from one cytoplasm to the next, so the electrical signal spreads without any ligand being secreted."
      - "Each cell secretes a hormone into the blood that the next cell detects."
      - "The cells share one continuous plasma membrane with no boundaries."
      - "Heart cells signal by quorum sensing."
    option_explanations:
      - |
        Correct. Direct-contact signalling through gap junctions lets ions and small mediators move between neighbours, which is why the heart beats as a coordinated unit.
      - |
        Endocrine signalling is slow and diluted; a heartbeat needs millisecond coordination between adjacent cells.
      - |
        Each cell keeps its own membrane; the junctions are protein channels that bridge two membranes at contact points.
      - |
        Quorum sensing is bacterial density-sensing through secreted autoinducers; it is far too slow and indirect for a heartbeat.
    answer: 0
    explanation: |
      Direct contact is the fastest and most local form of communication, and plants achieve the same thing with plasmodesmata.

  - slug: u04-exam-q10
    type: multiple_choice
    topic_code: "4.1"
    source: "Biology 2e §9.1 Signaling Molecules and Cellular Receptors"
    points: 1
    prompt: |
      A neurotransmitter is released into a synapse, binds receptors on the target cell, and within milliseconds is broken down by an enzyme in the cleft. A drug blocks that enzyme. Which effect on signalling is expected?
    options:
      - "The signal fails, because the neurotransmitter cannot be made."
      - "The signal is prolonged and intensified, because the ligand stays in the cleft and keeps binding receptors instead of being cleared."
      - "The signal becomes endocrine, travelling through the blood."
      - "The target cell stops making receptors."
    option_explanations:
      - |
        The enzyme degrades neurotransmitter after release; it has no role in making it, so release is unaffected.
      - |
        Correct. Removal of the ligand is one of the ways a cell terminates a signal; blocking removal leaves the receptors occupied and the response continues far longer than normal, which is how some nerve agents and insecticides act.
      - |
        The route of a signal is set by where it is released, not by how long it lasts; it stays within the synapse.
      - |
        Receptor numbers may change over days in response to chronic stimulation, but the immediate effect of blocking clearance is prolonged signalling.
    answer: 1
    explanation: |
      Signal termination is active. Block it anywhere, at the ligand, the receptor, a G protein or a second messenger, and the response outlasts the stimulus.

  - slug: u04-exam-q11
    type: multiple_choice
    topic_code: "4.1"
    source: "Biology 2e §9.4 Signaling in Single-Celled Organisms"
    points: 1
    prompt: |
      Pseudomonas aeruginosa forms biofilms on medical implants after quorum sensing switches on hundreds of genes. Which strategy would most directly prevent biofilm formation without killing the bacteria?
    options:
      - "A drug that blocks the autoinducer's receptor, so the bacteria never detect that they are crowded."
      - "A drug that increases autoinducer production."
      - "Adding nutrients so the bacteria grow faster."
      - "Cooling the implant to slow diffusion."
    option_explanations:
      - |
        Correct. Quorum sensing depends on autoinducer binding a receptor or transcription factor; with the receptor blocked, density is never registered and the group genes, including those for biofilm matrix, stay off.
      - |
        More autoinducer would reach the threshold sooner and switch the biofilm genes on earlier.
      - |
        Faster growth raises density and autoinducer concentration, promoting the biofilm.
      - |
        Cooling slows everything, including bacterial growth, but does not break the signalling loop; a chilled implant is not a treatment.
    answer: 0
    explanation: |
      Interrupting communication can disarm a pathogen without selecting for resistance the way killing it does; the logic is identical to blocking a hormone receptor in a human cell.

  # ---- Introduction to signal transduction (4.2)
  - slug: u04-exam-q12
    type: multiple_choice
    topic_code: "4.2"
    source: "Biology 2e §9.1 Signaling Molecules and Cellular Receptors"
    points: 1
    prompt: |
      Cells are treated with a drug that blocks all transcription. The response to the steroid hormone testosterone is abolished, but the response to epinephrine (glycogen breakdown within minutes) is unaffected. Which explanation fits?
    options:
      - "Testosterone acts through an internal receptor that regulates gene expression, so its response requires transcription; epinephrine acts through a surface receptor and a kinase cascade that modifies existing enzymes, so no new transcription is needed."
      - "Epinephrine is not a real hormone."
      - "Testosterone is destroyed by the drug."
      - "Epinephrine enters the nucleus and bypasses transcription."
    option_explanations:
      - |
        Correct. The two ligands use the two receptor locations and two kinds of response: a hydrophobic steroid changes which genes are read, which is slow and transcription-dependent; a hydrophilic hormone changes the activity of proteins already present, which is fast.
      - |
        Epinephrine is an endocrine signal released by the adrenal gland; it simply acts without altering transcription in this response.
      - |
        The drug acts on transcription, not on steroids; testosterone still enters the cell and binds its receptor, but the receptor's instruction to the genome cannot be carried out.
      - |
        Epinephrine never enters the cell; its receptor is on the surface and its message is relayed by cAMP and protein kinase A.
    answer: 0
    explanation: |
      Response type follows receptor type: internal receptors change gene expression; surface receptors usually change protein activity first, and only sometimes reach the genome.

  - slug: u04-exam-q13
    type: multiple_choice
    topic_code: "4.2"
    source: "Biology 2e §9.1 Signaling Molecules and Cellular Receptors"
    points: 1
    prompt: |
      Acetylcholine binds a receptor on a muscle cell that is itself an ion channel; within a millisecond Na⁺ flows into the cell. Which receptor class is this, and what is the immediate mechanism?
    options:
      - "A G protein-coupled receptor; the G protein opens a separate channel."
      - "An ion channel-linked receptor; ligand binding changes the receptor's shape, opening a pore through which Na⁺ moves down its gradient."
      - "A receptor tyrosine kinase; dimerisation lets Na⁺ through."
      - "An internal receptor; acetylcholine crosses the membrane first."
    option_explanations:
      - |
        G protein signalling takes longer and acts indirectly through enzymes or channels; the description says the receptor itself is the channel.
      - |
        Correct. The channel-lining amino acids are hydrophilic and the membrane-spanning ones hydrophobic; a conformational change on binding opens the gate and the ion flux is immediate, which suits synaptic transmission.
      - |
        Tyrosine kinase receptors signal by phosphorylation over seconds to minutes, not by passing ions.
      - |
        Acetylcholine is a small charged molecule that cannot cross the bilayer; its receptor must face the outside.
    answer: 1
    explanation: |
      Three surface receptor classes, three mechanisms: a gate (ion channel), a switch (G protein) and an enzyme (kinase). Speed and the kind of response follow from the class.

  # ---- Signal transduction pathways (4.3)
  - slug: u04-exam-q14
    type: multiple_choice
    topic_code: "4.3"
    source: "Biology 2e §9.2 Propagation of the Signal"
    points: 1
    prompt: |
      Many hormones act at blood concentrations around 10⁻¹⁰ mol/L, far too low for one hormone molecule per responding enzyme. Which property of signalling pathways resolves the apparent paradox?
    options:
      - "Hormones are recycled after each use."
      - "Each step in a cascade is catalytic, so the number of activated molecules grows at every stage and a few hormone molecules produce a large response."
      - "Cells concentrate hormones inside themselves before responding."
      - "Receptors multiply when hormone is scarce."
    option_explanations:
      - |
        A ligand may bind more than once, but recycling could not bridge a gap of millions between hormone molecules and product molecules.
      - |
        Correct. Amplification: one receptor activates many G proteins, each enzyme makes many second messengers, each kinase phosphorylates many targets, so the response scales as the product of the factors, not their sum.
      - |
        Hydrophilic hormones never enter the cell; and concentration without amplification would still leave one hormone per enzyme.
      - |
        Receptor number changes sensitivity over hours to days and cannot create product molecules; the gain is in the cascade.
    answer: 1
    explanation: |
      Amplification is why pathways are cascades rather than single steps, and why termination at every step matters.

  - slug: u04-exam-q15
    type: multiple_choice
    topic_code: "4.3"
    source: "Biology 2e §9.3 Response to the Signal"
    points: 1
    prompt: |
      In a developing hand, the cells between the digits die in an orderly way and the webbing disappears, while the digit cells survive. Which description of the process is correct?
    options:
      - "The webbing cells are killed by lack of oxygen and burst, releasing their contents."
      - "The webbing cells receive a signal that triggers apoptosis, a controlled dismantling that keeps their contents from leaking and lets neighbours clear the remains."
      - "The digit cells eat the webbing cells."
      - "The webbing cells migrate into the digits."
    option_explanations:
      - |
        Uncontrolled bursting (necrosis) releases enzymes and triggers inflammation; development uses a tidy, signalled death instead.
      - |
        Correct. Apoptosis is one of the responses a signalling pathway can order; sculpting digits, removing self-reactive T cells and eliminating damaged cells all use it.
      - |
        Neighbouring cells do clear apoptotic fragments, but only after the dying cell has dismantled itself in response to a signal.
      - |
        The tissue is removed, not relocated; cell death, not migration, is what the embryo uses here.
    answer: 1
    explanation: |
      Programmed cell death is a normal, signalled outcome, and losing the ability to trigger it is one of the ways tumours grow.

  # ---- Feedback (4.4)
  - slug: u04-exam-q16
    type: multiple_choice
    topic_code: "4.4"
    source: "Biology 2e §33.3 Homeostasis"
    points: 1
    prompt: |
      Between meals, blood glucose falls, the pancreas releases glucagon, the liver breaks glycogen down and releases glucose, blood glucose rises, and glucagon release declines. A student says this must be positive feedback because glucagon makes glucose go up. What is the correct classification and reason?
    options:
      - "Positive feedback, because the hormone raises the variable."
      - "Negative feedback, because the response (a rise in glucose) removes the stimulus (low glucose) and returns the variable toward its set point."
      - "Positive feedback, because the liver amplifies the signal."
      - "Neither, because glucagon is a protein."
    option_explanations:
      - |
        The direction of the hormone's effect is irrelevant; what matters is whether the response opposes or reinforces the original change. Here it opposes it.
      - |
        Correct. The stimulus was a fall; the response is a rise; the rise ends the response. Insulin and glucagon are two negative loops around one set point.
      - |
        Amplification within a pathway (week 12) is not feedback; feedback is the response acting on the stimulus, and here it cancels it.
      - |
        The chemistry of the signal has nothing to do with the loop's logic.
    answer: 1
    explanation: |
      Ask one question of every loop: does the response reduce the stimulus or increase it? Glucagon reduces the deficit that triggered it.

  - slug: u04-exam-q17
    type: multiple_choice
    topic_code: "4.4"
    source: "Biology 2e §33.3 Homeostasis"
    points: 1
    prompt: |
      At a cut, the enzyme thrombin converts fibrinogen to fibrin and also activates more of the clotting factors that produce thrombin. Why is this arrangement useful, and what limits it?
    options:
      - "It is negative feedback that keeps thrombin at a constant level; it is limited by the set point."
      - "It is positive feedback that builds a clot rapidly at the site of injury; it is limited because the loop ends when the wound is sealed and the activating surfaces are covered."
      - "It is positive feedback that spreads clotting through the whole body; nothing limits it."
      - "It is negative feedback that dissolves clots."
    option_explanations:
      - |
        Thrombin increases its own production; that is reinforcement, not opposition.
      - |
        Correct. A clot must form in seconds, and a self-amplifying loop does that; the loop is local because the activating factors are exposed only at the wound, and it stops once the damage is covered.
      - |
        Body-wide clotting would be fatal; positive loops in healthy physiology are confined by their end condition and by local triggers.
      - |
        Clot removal is a separate process; the thrombin loop builds clots.
    answer: 1
    explanation: |
      Positive feedback suits fast, one-way events with a natural end: a clot, a birth, a ripe fruit.

  - slug: u04-exam-q18
    type: multiple_choice
    topic_code: "4.4"
    source: "Biology 2e §33.3 Homeostasis"
    points: 1
    prompt: |
      A lizard on a cold morning climbs onto a sun-warmed rock, and when its body warms it moves into the shade. Which statement about this behaviour is correct?
    options:
      - "The lizard is an endotherm using metabolic heat."
      - "The lizard is an ectotherm regulating body temperature by behaviour, in a negative feedback loop in which warming removes the stimulus for basking and cooling removes the stimulus for shade-seeking."
      - "The behaviour is positive feedback, because the lizard keeps getting hotter."
      - "The lizard cannot regulate temperature at all."
    option_explanations:
      - |
        Endotherms generate heat internally; a lizard relies on external heat, which is why it must bask.
      - |
        Correct. Ectotherms have the same loop logic as endotherms, with behaviour as the effector; the response in each direction removes the condition that triggered it.
      - |
        The lizard leaves the rock when warm, which is the opposite of runaway heating.
      - |
        Behavioural regulation is regulation; many ectotherms hold their daytime temperature within a few degrees by moving between sun and shade.
    answer: 1
    explanation: |
      Homeostasis is defined by the loop, not by the effector; muscles, glands and behaviour can all close it.

  # ---- Cell cycle (4.5)
  - slug: u04-exam-q19
