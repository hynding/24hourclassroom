    source: "Biology 2e §10.3 Control of the Cell Cycle"
    points: 1
    prompt: |
      A mutation causes a cell to proceed into anaphase even when one chromosome is not attached to the spindle. Which checkpoint is defective, and what is the likely consequence for the daughters?
    options:
