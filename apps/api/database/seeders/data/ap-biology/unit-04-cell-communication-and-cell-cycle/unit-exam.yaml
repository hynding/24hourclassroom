      - |
        G₁ assesses size and DNA integrity before S phase; attachment is not its concern.
      - |
        Correct. The spindle checkpoint delays the irreversible separation until every kinetochore is attached to opposite poles; bypassing it lets an unattached chromosome go to one pole, so the daughters differ in chromosome number.
      - |
