    # ---- Spiral review
    - slug: u04-w14-q12
      type: multiple_choice
      topic_code: "4.3"
      source: "Biology 2e §9.3 Response to the Signal"
      points: 1
      prompt: |
        Review. HER2 is a receptor tyrosine kinase that is present in abnormally large numbers on the cells of about a quarter of breast cancers. Why does overexpressing a receptor, without any change in its sequence, drive division?
      options:
        - "More receptors make the cell larger, which triggers division."
        - "With many receptors crowded in the membrane, dimerisation and cross-phosphorylation happen even with little or no growth factor, so the Ras cascade and cyclin expression run continuously."
        - "Extra receptors bind p53 and remove it from the nucleus."
        - "Extra receptors let growth factor enter the cell and bind DNA."
      option_explanations:
        - |
          Receptor number does not change cell size; the link to division runs through signalling, not geometry.
        - |
          Correct. Dimerisation is the switch for this receptor class; at high density receptors meet and activate each other spontaneously, producing a constant growth signal. Herceptin, an antibody that binds HER2, blocks that signal.
        - |
          p53 is a nuclear protein that responds to DNA damage; surface receptors do not bind it, and the HER2 effect is through the growth pathway.
        - |
          Growth factors are proteins that never enter the cell; their receptors' intracellular domains carry the message, and the response reaches the nucleus through a cascade.
      answer: 1
      explanation: |
        A change in the amount of a pathway component, not just its structure, can change the pathway's output. Week 12's dimerisation rule explains why.

    - slug: u04-w14-q13
      type: multiple_choice
      topic_code: "3.1"
      source: "Biology 2e §10.3 Control of the Cell Cycle"
      points: 1
      prompt: |
        Review. A Cdk is an enzyme that is inactive alone and active only when bound to its cyclin. Which general principle of enzyme regulation does this illustrate?
      options:
        - "Enzymes are consumed by the reactions they catalyse, so a partner is needed to replace them."
        - "Binding of another molecule at a site other than the active site changes an enzyme's shape and so its activity."
        - "Enzymes work only at their optimum temperature."
        - "An enzyme's substrate must be a protein."
      option_explanations:
        - |
          Enzymes are not used up; the Cdk persists through the whole cycle and is reused each time its cyclin appears.
        - |
          Correct. Cyclin binding is allosteric regulation: the partner reshapes the Cdk so that its active site can bind ATP and its target protein. The same principle governs feedback inhibition and activation of metabolic enzymes.
        - |
          Temperature affects rate but is not what switches a Cdk on and off within one cell at constant temperature.
        - |
          Cdk targets happen to be proteins, but many enzymes act on sugars, lipids or nucleic acids; substrate identity is not the principle at work.
      answer: 1
      explanation: |
        Unit 3's allosteric regulation is the mechanism behind the cell cycle's timing. Cyclin is the activator, p21 is an inhibitor, and the Cdk is the enzyme both act on.

    - slug: u04-w14-q14
      type: multiple_choice
      topic_code: "2.9"
      source: "Biology 2e §10.2 The Cell Cycle"
      points: 1
      prompt: |
        Review. During prophase and prometaphase the nuclear envelope breaks into vesicles, and it re-forms in telophase. Which function of the nucleus as a compartment is suspended while the envelope is gone?
      options:
        - "Separating transcription and RNA processing from the cytoplasm, so that unfinished RNA is kept away from ribosomes."
        - "Making ATP for the spindle."
        - "Storing calcium for the contractile ring."
        - "Digesting worn-out organelles."
      option_explanations:
        - |
          Correct. The nuclear envelope is the boundary that keeps the genome and RNA processing apart from translation; while it is dismantled, transcription largely stops and the chromosomes are moved as condensed, inactive units.
        - |
          ATP synthesis is a mitochondrial function; the nucleus makes none.
        - |
          Calcium is stored in the endoplasmic reticulum, not the nucleus.
        - |
          Digestion of organelles is the lysosome's job.
      answer: 0
      explanation: |
        Compartments (topic 2.9) can be taken down and rebuilt. Mitosis is the one time the cell dissolves its most important boundary, and it does so only after shutting the genome down.

    - slug: u04-w14-q15
      type: multiple_choice
      topic_code: "2.2"
      source: "Biology 2e §10.3 Control of the Cell Cycle"
      points: 1
      prompt: |
        Review. Cell size is one of the conditions assessed at the G₁ checkpoint. Which quantitative change as a cell grows explains why size matters?
      options:
        - "Surface area increases with the cube of the radius while volume increases with the square."
        - "Volume increases with the cube of the radius while surface area increases with the square, so the surface-to-volume ratio falls and exchange across the membrane becomes limiting."
        - "The nucleus shrinks as the cell grows."
        - "Diffusion speeds up in larger cells."
      option_explanations:
        - |
          The exponents are swapped; it is volume that scales with the cube.
        - |
          Correct. A sphere of radius r has surface 4πr² and volume (4/3)πr³, so SA:V = 3/r; doubling the radius halves the ratio, and the membrane can no longer supply the interior. Dividing restores the ratio.
        - |
          The nucleus does not shrink; the issue is the whole cell's exchange surface relative to its contents.
        - |
          Diffusion time grows with the square of distance, so larger cells are served more slowly, not faster.
      answer: 1
      explanation: |
        Topic 2.2's SA:V argument is the physical reason a checkpoint measures size: a cell that grew without dividing would starve its own interior.

    - slug: u04-w14-q16
      type: multiple_choice
      topic_code: "1.7"
      source: "Biology 2e §10.4 Cancer and the Cell Cycle"
      points: 1
      prompt: |
        Review. Most cancer-associated mutations in p53 change single amino acids in the part of the protein that binds DNA. Why does such a small change disable p53's ability to halt the cycle?
      options:
        - "Because the mutation removes the gene from the chromosome."
        - "Because a substitution in the DNA-binding region changes R-group interactions and the fold of that region, so p53 can no longer recognise and bind the DNA sequences that switch on p21 and repair genes."
        - "Because p53 is a lipid and substitutions make it hydrophilic."
        - "Because the mutation changes p53 into p21."
      option_explanations:
        - |
          The gene is still present and the protein is still made; the mutant protein is simply unable to do its job.
        - |
          Correct. p53 works as a transcription factor; its function depends on the three-dimensional shape of its DNA-binding domain, and a single R-group change in that domain can destroy the fit, just as a change in an enzyme's active site destroys catalysis.
        - |
          p53 is a protein; amino-acid substitutions alter protein structure, and polarity changes are one way they do so.
        - |
          Genes do not transform into other genes; p21 is encoded separately and is produced only when functional p53 switches it on.
      answer: 1
      explanation: |
        Structure determines function at every scale (Unit 1). A tumour suppressor that cannot bind DNA is a brake pedal disconnected from the brakes.

    # ---- Select-all
    - slug: u04-w14-q17
      type: multi_select
      topic_code: "4.6"
      source: "Biology 2e §10.3 Control of the Cell Cycle"
      points: 2
      partial_credit: true
      prompt: |
        Which statements correctly match a checkpoint with what it assesses? Select all that apply.
      options:
        - "G₁ checkpoint: cell size, nutrient and energy reserves, growth signals, and DNA damage"
        - "G₂ checkpoint: whether all chromosomes have been completely replicated without damage"
        - "M checkpoint: whether every sister chromatid is attached to spindle microtubules from opposite poles"
        - "G₁ checkpoint: whether sister chromatids have separated"
        - "M checkpoint: whether the cell has enough ATP to begin S phase"
      option_explanations:
        - |
          Correct. The restriction point asks whether everything needed for a successful division is in place before the cell commits.
        - |
          Correct. Entering mitosis with unreplicated or damaged DNA would hand a daughter an incomplete or corrupted genome, so G₂ checks replication.
        - |
          Correct. The spindle checkpoint guards the irreversible step of anaphase by requiring every kinetochore to be attached.
        - |
          Sister chromatids do not exist in G₁ (replication has not happened) and they separate only in anaphase; the G₁ checkpoint cannot assess them.
        - |
          S phase precedes mitosis; the M checkpoint comes after it and is concerned with chromosome attachment, not with reserves for a phase already completed.
      answer: [0, 1, 2]
      explanation: |
        Each checkpoint guards the step that follows it: G₁ guards replication, G₂ guards mitosis, M guards separation. Match the check to what would go wrong next.

