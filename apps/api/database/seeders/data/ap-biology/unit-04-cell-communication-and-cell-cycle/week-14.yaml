      source: "Biology 2e §10.2 The Cell Cycle"
      points: 1
      prompt: |
        Review. In animal cells, the organelle that is duplicated in S phase and whose two copies move to opposite poles to organise the mitotic spindle is the ____.
      answer: ["centrosome", "centrosomes"]
      explanation: |
        The centrosome is the microtubule-organising centre; in animal cells it contains a pair of centrioles. Its duplication in S phase and separation in prophase set up the two poles from which kinetochore and polar microtubules grow. "Centromere" is the region of a chromosome where sister chromatids are joined, a different structure with a similar name, and is not accepted.

    # ---- Free response
    - slug: u04-w14-q23
      type: short_answer
      topic_code: "4.6"
      source: "general knowledge"
      points: 4
      prompt: |
        Conceptual analysis. The chemotherapy drug paclitaxel binds microtubules and prevents them from depolymerising, so spindle microtubules cannot shorten or be rearranged. (a) Identify the checkpoint most directly affected by the drug. (b) Explain why cells treated with the drug accumulate in metaphase and eventually undergo apoptosis. (c) Predict which tissues of a patient will show the strongest side effects, and justify your prediction in terms of the cell cycle.
      answer: |
        The M (spindle) checkpoint. With microtubules frozen, kinetochores cannot be correctly attached and tensioned, so the checkpoint is never satisfied, anaphase never begins and the cell stays in metaphase; a cell held there long enough triggers apoptosis. Side effects will be strongest in tissues whose cells divide most often, such as the gut lining, hair follicles and bone marrow, because only cells that enter mitosis are caught.
      explanation: |
        Four points.

        (a) Identify, 1 pt: the M checkpoint (accept "spindle checkpoint" or "metaphase checkpoint").

        (b) Explain, 2 pts: 1 pt for the mechanism: the spindle cannot attach to and pull on every kinetochore correctly when microtubules cannot shorten or rearrange, so the checkpoint's requirement is not met and the cell cannot proceed to anaphase; 1 pt for the outcome: a prolonged mitotic arrest activates the cell's apoptosis pathway, so the arrested cell dies instead of dividing. Accept "the cell cannot separate its chromatids" as part of the mechanism.

        (c) Predict and justify, 1 pt: rapidly dividing tissues such as gut epithelium, hair follicles, bone marrow (and the resulting nausea, hair loss, low blood counts), because the drug acts only on cells that reach mitosis, and cells in G₀ (neurons, heart muscle) are unaffected. Both the tissue and the cell-cycle reasoning are required.

        Zero: answers that say the drug damages DNA (it does not), that place the effect at the G₁ checkpoint, or that predict side effects in non-dividing tissues.

    - slug: u04-w14-q24
      type: short_answer
      topic_code: "4.6"
      source: "Biology 2e §10.4 Cancer and the Cell Cycle"
      points: 4
      prompt: |
        Argumentation. A student claims that "a single mutation in one cell is enough to cause cancer." Using the roles of p53, Ras and the checkpoints, (a) state whether you agree, (b) support your position with two specific pieces of evidence or reasoning, and (c) explain why mutated p53 is found in more than half of all human tumours.
      answer: |
        Disagree: a cell with one stuck accelerator (GTP-locked Ras) is still restrained by p53 and the checkpoints, and a cell with one lost brake still needs a signal to divide; cancer develops as errors accumulate over generations of a cell that divides when it should not. p53 is so common because losing it removes three defences at once: the halt, the repair and the apoptosis, so every further mutation is kept and copied.
      explanation: |
        Four points.

        (a) Position, 1 pt: disagree, or agree only with the qualification that one mutation starts a process that needs further mutations. A flat "agree" earns nothing for this part.

        (b) Support, 2 pts, 1 per piece: e.g. multiple independent controls (three checkpoints, several negative regulators) mean one lesion is caught by the others; a Ras mutation alone still faces p53 and the M checkpoint; most mutations produce non-functional proteins that stop the cycle rather than freeing it; cancer cells typically carry mutations in both an oncogene and a tumour suppressor; errors accumulate because a cell that divides inappropriately copies its mistakes and each generation can add more. Any two distinct arguments earn full marks.

        (c) Explain, 1 pt: p53 coordinates the halt at G₁, recruitment of repair enzymes and apoptosis of unrepairable cells, so its loss simultaneously lets damaged cells keep dividing and prevents their removal; mutations therefore accumulate far faster, making p53 loss a step on the road of most cancers. Accept "it is the master brake and the executioner" if both roles are named.

        Zero: answers with no reference to specific regulators or checkpoints, or that argue cancer is always inherited.

    - slug: u04-w14-q25
      type: long_answer
      topic_code: "4.6"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. Researchers compared two lines of cultured mouse cells: a normal line and a line in which both copies of the p53 gene had been deleted. Cells were exposed to a dose of ultraviolet light that damages DNA, or left unexposed, and after 24 hours the percentage of cells in S phase and the percentage undergoing apoptosis were measured. Each value is the mean of five cultures; standard errors were below 2 percentage points.

        | Cell line | UV exposure | Cells in S phase (%) | Cells in apoptosis (%) |
        |---|---|---|---|
        | Normal | none | 30 | 2 |
        | Normal | UV | 6 | 24 |
        | p53-deleted | none | 32 | 2 |
        | p53-deleted | UV | 29 | 3 |

        (a) Identify the independent and dependent variables and state the purpose of the two unexposed rows.
        (b) Describe the effect of UV on each cell line.
        (c) Explain the normal line's response in terms of the G₁ checkpoint, naming the proteins involved, and explain why the p53-deleted line responds differently.
        (d) Predict what will happen to the p53-deleted cells that continue to divide after UV exposure, and explain why this makes p53 loss so common in cancers.
      answer: |
        IV: cell line and UV exposure; DV: percentage in S phase and percentage in apoptosis; the unexposed rows show that both lines cycle normally without damage. UV cut the normal line's S-phase fraction from 30% to 6% and raised apoptosis from 2% to 24%, while the p53-deleted line was almost unchanged (32 to 29, 2 to 3). In normal cells, damage activates p53, which induces p21 to inhibit Cdk-cyclin complexes and halt the cycle in G₁ for repair, and triggers apoptosis if repair fails; without p53 there is no halt, no p21 and no apoptosis, so damaged cells enter S phase. Those cells replicate damaged DNA, pass mutations to daughters, and accumulate further errors each generation, including mutations in other regulators, so a p53-deleted population evolves toward uncontrolled division; losing p53 removes the halt, the repair signal and the apoptosis response at once.
      explanation: |
        Eight points.

        (a) 2 pts: 1 pt for independent variables = cell line (normal versus p53-deleted) and UV exposure, dependent variables = percentage of cells in S phase and percentage in apoptosis; 1 pt for the controls' purpose: the unexposed rows establish each line's baseline cycling and death rates so that the effect of UV, rather than of the deletion alone, can be isolated.

        (b) 1 pt: in the normal line UV reduced S-phase cells from 30% to 6% and raised apoptosis from 2% to 24%; in the p53-deleted line UV left S phase almost unchanged (32% to 29%) and apoptosis barely rose (2% to 3%). Numbers for at least one line and a clear contrast are required.

        (c) 3 pts: 1 pt for the halt: DNA damage activates p53, which induces p21; p21 binds and inhibits Cdk-cyclin complexes, so cells cannot pass the G₁ checkpoint into S phase, which is why the S-phase fraction fell; 1 pt for apoptosis: p53 also recruits repair enzymes and, where repair fails, triggers programmed cell death, which is why apoptosis rose to 24%; 1 pt for the mutant: with no p53 there is no p21 induction, no arrest and no apoptosis signal, so damaged cells continue through the checkpoint at the normal rate. Naming p21 or Rb-E2F in the halt mechanism is required for the first point.

        (d) 2 pts: 1 pt for the prediction: the cells replicate damaged DNA and pass mutations to their daughters, so mutations accumulate in the population over successive divisions, including in other cell-cycle regulators, leading toward uncontrolled growth; 1 pt for the explanation of p53's prominence: a single loss removes three protections (halt, repair, apoptosis), so a p53-deficient cell both survives damage and keeps dividing, accelerating the accumulation of every further mutation that cancer needs.

        Zero for a part: restating the table without comparison; explaining the normal line's drop in S phase as "UV killed the cells" without the checkpoint; claiming the p53-deleted cells are "immune" to UV damage; predicting that the mutant cells will repair their DNA and recover.
