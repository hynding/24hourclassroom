week: 14
unit: 4
title: Regulation of the Cell Cycle and Cancer
topics: ["4.6"]
guide: guides/week-14.md
guide_description: |
  The three checkpoints and what each one checks; cyclins and cyclin-dependent kinases as the engine; p53, p21
  and Rb as the brakes; growth factors, crowding and cell size as external signals; proto-oncogenes, oncogenes
  and tumour suppressors; why cancer needs several mutations. AP Investigation 7 (mitosis) with the mitotic index
  and a full chi-square walk-through, plus a synthesis of the whole unit. Vocabulary, three worked examples (a
  chi-square calculation, a cyclin time course, a drug-arrest table), misconceptions, self-check.
flashcards_description: |
  31 cards: checkpoint and regulator vocabulary, the cyclin-Cdk engine, cancer genetics, and "what does this
  count or curve show" cards including the chi-square test for Investigation 7.

flashcards:
  - front: Cell-cycle checkpoint → definition
    back: |
      A point in the cycle where the cell assesses internal and external conditions and either proceeds or halts. Three main ones: near the end of G₁, at the G₂/M transition, and during metaphase. Prevents errors being copied or inherited.
    topic_code: "4.6"
  - front: G₁ checkpoint (restriction point) → what it checks
    back: |
      Whether conditions favour division: adequate cell size, enough nutrients and energy reserves, growth-factor signals present, and no damage to the genomic DNA. Failing cells halt, repair, or leave the cycle into G₀. Once past, the cell is committed to dividing.
    topic_code: "4.6"
  - front: G₂ checkpoint → what it checks
    back: |
      Whether the cell is ready for mitosis: size and protein reserves again, and above all whether every chromosome has been replicated completely and without damage. Problems halt the cycle for repair.
    topic_code: "4.6"
  - front: M (spindle) checkpoint → what it checks and why it matters
    back: |
      Near the end of metaphase: whether every sister chromatid's kinetochore is firmly attached to microtubules from opposite poles. Anaphase is irreversible, so the cell waits until all are attached; otherwise a daughter could get an extra or missing chromosome.
    topic_code: "4.6"
  - front: Cyclin → behaviour through the cycle
    back: |
      A regulatory protein whose concentration rises and falls in a predictable pattern. Four cyclins (D, E, A, B) peak at different phases; each is made, does its job, and is destroyed. Cyclin levels are the cycle's clock.
    topic_code: "4.6"
  - front: Cyclin-dependent kinase (Cdk) → behaviour and activation
    back: |
      A kinase present at a fairly constant level throughout the cycle but inactive on its own. It becomes active only when bound to its cyclin partner; the Cdk-cyclin complex then phosphorylates target proteins that drive the cell through a checkpoint.
    hint: The kinase is always there; the cyclin decides when it works.
    topic_code: "4.6"
  - front: Why does Cdk activity rise and fall if Cdk levels stay constant?
    back: |
      Because activity depends on the cyclin partner, and cyclin is synthesised and degraded on a schedule. When cyclin accumulates, active complexes form; when cyclin is destroyed at the end of its phase, the Cdk goes quiet again.
    topic_code: "4.6"
  - front: Positive regulators of the cell cycle
    back: |
      Molecules that push the cycle forward: the cyclins and Cdks, and the external growth factors and hormones (such as human growth hormone) that signal cells to divide. Mutations that make them overactive are one route to cancer.
    topic_code: "4.6"
  - front: Negative regulators of the cell cycle → the three to know
    back: |
      Rb, p53 and p21 act as brakes at the G₁ checkpoint, blocking progression until conditions are right. They are tumour suppressors: losing them removes the stop.
    topic_code: "4.6"
  - front: p53 → its three jobs
    back: |
      When DNA damage is detected in G₁, p53 halts the cycle, recruits enzymes to repair the DNA, and if repair fails triggers apoptosis so the damaged genome is not copied. Mutated p53 is found in more than half of human tumours.
    topic_code: "4.6"
  - front: p21 → mechanism
    back: |
      Produced on p53's instruction; it enforces the halt by binding and inhibiting Cdk-cyclin complexes. The more stress, the more p21 and the less likely the cell is to enter S phase.
    topic_code: "4.6"
  - front: Rb (retinoblastoma protein) → mechanism
    back: |
      Unphosphorylated Rb binds the transcription factor E2F and keeps it from switching on the genes needed for the G₁-to-S transition. When growth signals lead to Rb phosphorylation, it releases E2F and the cell proceeds into S phase.
    topic_code: "4.6"
  - front: How do growth factors feed into the cell cycle?
    back: |
      A growth factor binds a receptor tyrosine kinase, the Ras-MAP kinase cascade runs, and the result is expression of cyclins and other proteins that let the cell pass the G₁ checkpoint. No growth factor, no cyclin D, no progression.
    topic_code: "4.6"
  - front: Density-dependent inhibition and anchorage dependence
    back: |
      Normal cells stop dividing when crowded (contact with neighbours inhibits division) and when not attached to a surface or matrix. Cancer cells ignore both and pile up in culture.
    topic_code: "4.6"
  - front: Why does cell size act as a signal to divide?
    back: |
      As a cell grows, volume outpaces surface area and the membrane cannot supply the interior fast enough. Cell size is one of the conditions assessed at the G₁ checkpoint; dividing restores a workable surface-to-volume ratio.
    topic_code: "4.6"
  - front: Proto-oncogene vs oncogene
    back: |
      A proto-oncogene is a normal gene for a positive regulator (a growth-factor receptor, Ras, a cyclin). An oncogene is a mutated version that is overactive or cannot be switched off, so it drives division without the proper signals.
    hint: A stuck accelerator.
    topic_code: "4.6"
  - front: Tumour suppressor gene
    back: |
      A gene for a negative regulator such as p53, p21 or Rb. A mutation that disables it removes a brake, so the cell cannot halt even when DNA is damaged or chromosomes are unattached.
    hint: Failed brakes.
    topic_code: "4.6"
  - front: Why does cancer usually need several mutations, not one?
    back: |
      A cell with one broken brake or one stuck accelerator is still restrained by its other controls. But a cell that divides when it should not copies its errors, and each generation can add more; over time, enough controls fail that division is uncontrolled.
    topic_code: "4.6"
  - front: Why is a mutation that makes a Cdk active without its cyclin dangerous?
    back: |
      The Cdk would phosphorylate its targets at any time, pushing the cell past a checkpoint whether or not the conditions had been met. That is the definition of an oncogene: a positive regulator that no longer waits for its signal.
    topic_code: "4.6"
  - front: Tumour formation as a balance
    back: |
      Tissue size is a balance between cell division and apoptosis. A tumour forms when division increases, apoptosis decreases, or both; loss of p53 does both at once, which is why it is so common in cancers.
    topic_code: "4.6"
  - front: HER2 → how a receptor becomes oncogenic
    back: |
      HER2 is a receptor tyrosine kinase in the growth-factor family. In about a quarter of breast cancers it is overexpressed, so the growth pathway runs with little or no ligand. The antibody drug Herceptin binds HER2 and blocks the signal.
    topic_code: "4.6"
  - front: Ras in cancer → the mechanism in one sentence
    back: |
      A mutation that destroys Ras's GTPase activity locks it in the active GTP-bound form, so the kinase cascade signals division continuously; Ras is mutated in about 30% of cancers.
    topic_code: "4.6"
  - front: Cell-cycle timing in cultured human cells
    back: |
      About 24 hours: G₁ 9 h, S 10 h, G₂ 4.5 h, M 0.5 h. In the body the range is huge: hours in an early embryo, two to five days for gut and skin epithelium, a lifetime in G₀ for neurons and heart muscle.
    topic_code: "4.6"
  - front: Mitotic index → equation and meaning
    back: |
      Mitotic index = cells in mitosis ÷ total cells counted (often × 100 for a percentage). A measure of how actively a tissue is dividing; it rises when a signal pushes cells through the G₁ checkpoint and falls when they are arrested.
    topic_code: "4.6"
  - front: Chi-square → the equation and what it compares
    back: |
      χ² = Σ (observed − expected)² ÷ expected, summed over every category. It measures how far observed counts depart from the counts a null hypothesis predicts; the larger the value, the less likely the difference is chance.
    topic_code: "4.6"
  - front: Null hypothesis for a chi-square test in Investigation 7
    back: |
      That the treatment has no effect: the proportion of treated cells in mitosis is the same as in the control, so the expected counts for the treated sample are the control proportions applied to the treated total.
    topic_code: "4.6"
  - front: Degrees of freedom and the critical value at p = 0.05
    back: |
      Degrees of freedom = number of categories − 1. From the AP table at p = 0.05: df 1 → 3.84, df 2 → 5.99, df 3 → 7.81, df 4 → 9.49. If χ² exceeds the critical value, reject the null hypothesis.
    topic_code: "4.6"
  - front: What does rejecting the null hypothesis mean in a chi-square test?
    back: |
      That a difference this large would arise by chance in fewer than 5% of samples if the null were true, so the difference is unlikely to be chance alone. It does not prove the mechanism; it only says the treatment and control differ.
    topic_code: "4.6"
  - front: AP Investigation 7 part 1 → what you do
    back: |
      Grow onion or other root tips with and without a treatment (a fungal lectin that mimics a growth signal, in the standard version), squash and stain, count interphase and mitotic cells in each, calculate mitotic index, and test with chi-square whether the treatment changed it.
    topic_code: "4.6"
  - front: Given this result, what is the conclusion? A chi-square of 21.7 with 1 degree of freedom
    back: |
      21.7 is far above the critical value of 3.84 at p = 0.05, so reject the null hypothesis: the observed counts differ from expectation by more than chance would produce. If the categories were interphase versus mitosis, the treatment changed the mitotic index.
    topic_code: "4.6"
  - front: Given this result, what is the conclusion? Cells in culture reach confluence and stop dividing; a mutant line keeps dividing and piles up
    back: |
      The normal line shows density-dependent inhibition, a checkpoint response to crowding. The mutant has lost that control, which is a hallmark of cancer cells: it ignores the external signal that should hold it at the G₁ checkpoint.
    topic_code: "4.6"

quiz:
  description: |
    25 questions · about 30 minutes · about 70% this week (checkpoints, cyclins and Cdks, cancer, Investigation 7
    and the chi-square test) and 30% review of signal transduction, mitosis, enzymes, cell size, compartments and
    protein structure. Multiple choice, select-all, true/false and numeric items are graded at once; the
    fill-in-the-blank items are matched automatically; the two short answers and the long answer are graded by your
    teacher against the acceptable-answer summary.
  questions:
    # ---- Stimulus set A: Investigation 7 counts and a chi-square test (4.6)
    - slug: u04-w14-q01
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        In AP Investigation 7, a class tested whether a lectin from a soil fungus changes the rate of cell division in onion root tips. Root tips were grown for 48 hours in water (control) or in a lectin solution, then squashed, stained and counted. One thousand cells were classified for each treatment.

        | Treatment | Cells in interphase | Cells in mitosis | Total |
        |---|---|---|---|
        | Control (water) | 940 | 60 | 1,000 |
        | Lectin | 905 | 95 | 1,000 |

        The AP chi-square table gives a critical value of 3.84 for 1 degree of freedom at p = 0.05.
      prompt: |
        Which statement is the appropriate null hypothesis for a chi-square test of these data?
      options:
        - "The lectin increases the number of cells in mitosis."
        - "The lectin has no effect on cell division, so the proportion of lectin-treated cells in mitosis is the same as in the control."
        - "Exactly half of the cells in each treatment will be in mitosis."
        - "The lectin kills root-tip cells."
      option_explanations:
        - |
          That is the class's research hypothesis, the effect they hope to detect; the null hypothesis is the statement of no difference that the test tries to reject.
        - |
          Correct. The null states that any difference between treatments is due to chance; it lets the control proportions (94% interphase, 6% mitosis) serve as the expected values for the treated sample.
        - |
          Nothing in the biology predicts a 50:50 split; the expected values must come from the control, not from an arbitrary ratio.
        - |
          Cell death is not what the test examines; the categories are interphase and mitosis among living cells.
      answer: 1
      explanation: |
        A chi-square test needs expected counts, and expected counts come from the null hypothesis. In Investigation 7 the control sets the expectation for the treated group.

    - slug: u04-w14-q02
      type: numeric
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        In AP Investigation 7, a class tested whether a lectin from a soil fungus changes the rate of cell division in onion root tips. Root tips were grown for 48 hours in water (control) or in a lectin solution, then squashed, stained and counted. One thousand cells were classified for each treatment.

        | Treatment | Cells in interphase | Cells in mitosis | Total |
        |---|---|---|---|
        | Control (water) | 940 | 60 | 1,000 |
        | Lectin | 905 | 95 | 1,000 |

        The AP chi-square table gives a critical value of 3.84 for 1 degree of freedom at p = 0.05.
      prompt: |
        Using the control proportions as the expected values for the lectin-treated sample, calculate the chi-square value for the lectin data. Give your answer to one decimal place.
      answer: { value: 21.7, tolerance: 0.3 }
      explanation: |
        Expected for 1,000 lectin-treated cells, from the control proportions: interphase 940, mitosis 60. χ² = Σ (o − e)²/e = (905 − 940)²/940 + (95 − 60)²/60 = (−35)²/940 + (35)²/60 = 1,225/940 + 1,225/60 = 1.30 + 20.42 = 21.7. With two categories there is 1 degree of freedom; 21.7 is far above the critical value of 3.84, so the null hypothesis is rejected. Notice that the small category (mitosis) contributes almost all of the chi-square value, because the same deviation of 35 is a much larger fraction of 60 than of 940.

    - slug: u04-w14-q03
      type: multiple_choice
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        In AP Investigation 7, a class tested whether a lectin from a soil fungus changes the rate of cell division in onion root tips. Root tips were grown for 48 hours in water (control) or in a lectin solution, then squashed, stained and counted. One thousand cells were classified for each treatment.

        | Treatment | Cells in interphase | Cells in mitosis | Total |
        |---|---|---|---|
        | Control (water) | 940 | 60 | 1,000 |
        | Lectin | 905 | 95 | 1,000 |

        The AP chi-square table gives a critical value of 3.84 for 1 degree of freedom at p = 0.05.
      prompt: |
        The chi-square value for the lectin data is about 21.7. Which conclusion is justified?
      options:
        - "The null hypothesis is rejected: the difference in mitotic index between lectin-treated and control root tips is larger than chance alone would produce in more than 95% of samples."
        - "The null hypothesis is accepted, because 21.7 is larger than 3.84."
        - "The lectin was proven to act through the Ras pathway."
        - "The result is inconclusive, because only 1,000 cells were counted."
      option_explanations:
        - |
          Correct. A value above the critical value means a difference this large has a probability below 0.05 under the null; the mitotic index rose from 6% to 9.5%, and the test says that rise is unlikely to be sampling noise.
        - |
          The comparison is reversed: a chi-square larger than the critical value is evidence against the null, not for it.
        - |
          The test compares counts; it says nothing about mechanism. A follow-up experiment would be needed to show which pathway the lectin triggers.
        - |
          A sample of 1,000 cells per treatment is large; the chi-square calculation already takes the sample size into account, and the result is decisive.
      answer: 0
      explanation: |
        State a chi-square conclusion in three parts: compare the value with the critical value, say whether the null is rejected, and translate that into the biology (the treatment changed the mitotic index). The mechanism is a separate question.

    - slug: u04-w14-q04
      type: multiple_choice
      topic_code: "4.6"
      source: "Biology 2e §10.3 Control of the Cell Cycle"
      points: 1
      stimulus: |
        In AP Investigation 7, a class tested whether a lectin from a soil fungus changes the rate of cell division in onion root tips. Root tips were grown for 48 hours in water (control) or in a lectin solution, then squashed, stained and counted. One thousand cells were classified for each treatment.

        | Treatment | Cells in interphase | Cells in mitosis | Total |
        |---|---|---|---|
        | Control (water) | 940 | 60 | 1,000 |
        | Lectin | 905 | 95 | 1,000 |

        The AP chi-square table gives a critical value of 3.84 for 1 degree of freedom at p = 0.05.
      prompt: |
        If the lectin acts like a growth factor, which mechanism most plausibly explains the higher mitotic index?
      options:
        - "The lectin dissolves the cell wall so cells can divide."
        - "The lectin triggers a signalling pathway that raises cyclin levels, so more cells pass the G₁ checkpoint and enter S phase and mitosis."
        - "The lectin lengthens mitosis so that cells get stuck in metaphase."
        - "The lectin causes DNA damage, which activates p53 and drives cells into mitosis."
      option_explanations:
        - |
          Plant cells divide inside their walls by building a cell plate; the wall is not an obstacle to division, and dissolving it would kill the cell.
        - |
          Correct. Growth signals act at the G₁ checkpoint: a surface receptor and cascade lead to expression of cyclins, the Cdk-cyclin complexes form, Rb is phosphorylated and E2F is released, and more cells per hour commit to dividing.
        - |
          A longer mitosis would also raise the fraction in mitosis, but a growth-factor-like signal does not act on the spindle; the counts show all stages represented, not a pile-up at one stage.
        - |
          Activated p53 halts the cycle at G₁ and may trigger apoptosis; it does not drive cells into mitosis. DNA damage would lower the mitotic index.
      answer: 1
      explanation: |
        Investigation 7 is a cell-signalling experiment measured by a cell-cycle count. The lectin is the ligand, the mitotic index is the response, and the G₁ checkpoint is where the two connect.

    # ---- Stimulus set B: a cyclin-Cdk time course (4.6)
    - slug: u04-w14-q05
      type: multiple_choice
      topic_code: "4.6"
      source: "Biology 2e §10.3 Control of the Cell Cycle"
      points: 1
      stimulus: |
        Researchers followed an extract of frog eggs that cycles through division in a test tube. They measured the amount of cyclin B and the kinase activity of its Cdk partner over time, and recorded the stage of the extract. In a second run, a drug that blocks synthesis of cyclin B was added at time 0.

        | Time (min) | Cyclin B (relative) | Cdk activity (relative) | Stage |
        |---|---|---|---|
        | 0 | 10 | 5 | interphase |
        | 20 | 40 | 10 | interphase |
        | 40 | 80 | 60 | entering mitosis |
        | 50 | 90 | 100 | metaphase |
        | 60 | 15 | 8 | anaphase to telophase |
        | 80 | 20 | 5 | interphase |

        With the cyclin B synthesis blocker: cyclin B stayed at 10, Cdk activity stayed near 5, and the extract remained in interphase for the whole 80 minutes.
      prompt: |
        Which description of the relationship between cyclin B and Cdk activity fits the first run?
      options:
        - "Cdk activity rises before cyclin B, so the kinase causes cyclin to accumulate."
        - "Cyclin B accumulates during interphase, Cdk activity rises once cyclin is high and peaks at metaphase, and both fall sharply as the extract leaves mitosis."
        - "Cyclin B and Cdk activity are unrelated."
        - "Cdk activity stays constant while cyclin B changes."
      option_explanations:
        - |
          Cyclin B is already at 40 by 20 minutes while Cdk activity is still 10; the cyclin rises first, and activity follows only when cyclin has accumulated.
        - |
          Correct. Cyclin B climbs from 10 to 90 through interphase, Cdk activity jumps between 20 and 50 minutes to a peak of 100 at metaphase, and at 60 minutes both collapse (15 and 8) as cyclin is degraded and the extract exits mitosis.
        - |
          The two columns rise and fall together with a lag; the pattern is far from random.
        - |
          Cdk activity ranges from 5 to 100 in the table. It is the amount of Cdk protein, not its activity, that stays roughly constant in cells.
      answer: 1
      explanation: |
        Describe the data before explaining it: cyclin leads, activity follows, both fall at exit. That pattern is the signature of a kinase that depends on a partner protein.

    - slug: u04-w14-q06
      type: multiple_choice
      topic_code: "4.6"
      source: "Biology 2e §10.3 Control of the Cell Cycle"
      points: 1
      stimulus: |
        Researchers followed an extract of frog eggs that cycles through division in a test tube. They measured the amount of cyclin B and the kinase activity of its Cdk partner over time, and recorded the stage of the extract. In a second run, a drug that blocks synthesis of cyclin B was added at time 0.

        | Time (min) | Cyclin B (relative) | Cdk activity (relative) | Stage |
        |---|---|---|---|
        | 0 | 10 | 5 | interphase |
        | 20 | 40 | 10 | interphase |
        | 40 | 80 | 60 | entering mitosis |
        | 50 | 90 | 100 | metaphase |
        | 60 | 15 | 8 | anaphase to telophase |
        | 80 | 20 | 5 | interphase |

        With the cyclin B synthesis blocker: cyclin B stayed at 10, Cdk activity stayed near 5, and the extract remained in interphase for the whole 80 minutes.
      prompt: |
        What does the result with the synthesis blocker show?
      options:
        - "Cyclin B is required for Cdk activation and for entry into mitosis; without it the kinase stays inactive and the extract cannot leave interphase."
        - "The drug inactivated the Cdk directly."
        - "Cyclin B is destroyed by the drug."
        - "Mitosis can proceed without any kinase activity."
      option_explanations:
        - |
          Correct. Removing cyclin while leaving the Cdk untouched left activity at baseline and the extract stuck in interphase; cyclin is the limiting, timing component and the Cdk cannot act without it.
        - |
          The drug blocks cyclin synthesis, not the kinase; the Cdk protein is still present, and in the first run the same Cdk was fully active once cyclin was available.
        - |
          Cyclin B stayed at its starting level of 10, not at zero; the drug stopped new cyclin being made rather than destroying what was there.
        - |
          The extract never entered mitosis, which shows the opposite: without Cdk activity there is no mitosis.
      answer: 0
      explanation: |
        A blocker experiment tests necessity. Cyclin absent, no activity, no mitosis: cyclin is necessary. The first run showed it is also sufficient to trigger the rise in activity once it accumulates.

    - slug: u04-w14-q07
      type: multiple_choice
      topic_code: "4.6"
      source: "Biology 2e §10.3 Control of the Cell Cycle"
      points: 1
      stimulus: |
        Researchers followed an extract of frog eggs that cycles through division in a test tube. They measured the amount of cyclin B and the kinase activity of its Cdk partner over time, and recorded the stage of the extract. In a second run, a drug that blocks synthesis of cyclin B was added at time 0.

        | Time (min) | Cyclin B (relative) | Cdk activity (relative) | Stage |
        |---|---|---|---|
        | 0 | 10 | 5 | interphase |
        | 20 | 40 | 10 | interphase |
        | 40 | 80 | 60 | entering mitosis |
        | 50 | 90 | 100 | metaphase |
        | 60 | 15 | 8 | anaphase to telophase |
        | 80 | 20 | 5 | interphase |

        With the cyclin B synthesis blocker: cyclin B stayed at 10, Cdk activity stayed near 5, and the extract remained in interphase for the whole 80 minutes.
      prompt: |
        A third run uses a form of cyclin B that cannot be degraded. Predict the result.
      options:
        - "The extract never enters mitosis."
        - "The extract enters mitosis but cannot exit it: Cdk activity stays high and the extract remains in a mitotic state instead of returning to interphase."
        - "The extract cycles faster, because more cyclin is available."
        - "The Cdk is degraded instead."
      option_explanations:
        - |
          Non-degradable cyclin still accumulates and still activates the Cdk, so entry into mitosis happens normally; it is the exit that is affected.
        - |
          Correct. In the first run the fall in Cdk activity at 60 minutes coincided with cyclin B dropping from 90 to 15. Degrading cyclin is how the kinase is switched off; a cyclin that cannot be degraded leaves the Cdk active and the extract arrested in mitosis.
        - |
          Cycling requires both an on and an off; with no off, there is no second cycle at all.
        - |
          The Cdk is not the component whose level changes; nothing in the system degrades it in response to a stable cyclin.
      answer: 1
      explanation: |
        The cell cycle is a sequence of on-off switches. Cyclin synthesis is the on; cyclin degradation is the off; losing the off is as disabling as losing the on, a theme shared with Ras and G proteins in week 12.

    # ---- Checkpoints and regulators (4.6)
    - slug: u04-w14-q08
      type: multiple_choice
      topic_code: "4.6"
      source: "Biology 2e §10.3 Control of the Cell Cycle"
      points: 1
      prompt: |
        A cell in G₁ suffers DNA damage from ultraviolet light. Which sequence of events is the normal response?
      options:
        - "The cell proceeds to S phase so the damaged DNA can be replaced by replication."
        - "p53 halts the cycle, p21 blocks Cdk-cyclin complexes, repair enzymes are recruited, and if repair fails p53 triggers apoptosis."
        - "The M checkpoint stops the cell at metaphase."
        - "Rb is phosphorylated and releases E2F to speed up division."
      option_explanations:
        - |
          Replication copies damage rather than removing it; letting a damaged genome into S phase is exactly what the G₁ checkpoint exists to prevent.
        - |
          Correct. p53 is the damage sensor's output: it orders the halt, p21 enforces it by inhibiting the complexes that would push the cell forward, repair proceeds, and an unrepairable cell is removed by apoptosis so its errors are never inherited.
        - |
          The M checkpoint monitors spindle attachment during metaphase; a G₁ cell has not reached it, and DNA damage is handled before S phase.
        - |
          Phosphorylating Rb releases the brake; the response to damage is to keep Rb unphosphorylated and E2F bound so the cell stays in G₁.
      answer: 1
      explanation: |
        Stop, repair, or die: the three outcomes of the G₁ checkpoint. p53 coordinates all three, which is why losing it is found in more than half of human cancers.

    - slug: u04-w14-q09
      type: multiple_choice
      topic_code: "4.6"
      source: "Biology 2e §10.3 Control of the Cell Cycle"
      points: 1
      prompt: |
        At the M checkpoint, a cell with one chromosome whose kinetochore has not attached to the spindle waits in metaphase. Why is waiting the correct response, rather than proceeding?
      options:
        - "Because anaphase is irreversible, and an unattached chromosome would leave one daughter with an extra chromosome and the other with one missing."
        - "Because the nuclear envelope cannot re-form until every chromosome is attached."
        - "Because the unattached chromosome has not yet been replicated."
        - "Because cytokinesis cannot begin until the cell has grown enough."
      option_explanations:
        - |
          Correct. Once cohesin is degraded there is no way to recover; the checkpoint delays that irreversible step until every sister chromatid pair is attached to opposite poles so each daughter receives exactly one copy of every chromosome.
        - |
          Envelope re-formation in telophase is a consequence of exit from mitosis, not the reason for the delay; the problem is chromosome distribution.
        - |
          Replication is complete by the end of S phase and verified at the G₂ checkpoint; a metaphase chromosome has already been copied.
        - |
          Cell size is assessed in G₁ and G₂; the M checkpoint is about attachment, not growth.
      answer: 0
      explanation: |
        Checkpoints sit just before irreversible steps. The spindle checkpoint protects the single most important outcome of mitosis: an identical, complete set in each daughter.

    - slug: u04-w14-q10
      type: multiple_choice
      topic_code: "4.6"
      source: "Biology 2e §10.3 Control of the Cell Cycle"
      points: 1
      prompt: |
        A mutation produces a form of Rb that cannot be phosphorylated. What is the most likely effect on the cell?
      options:
        - "The cell divides continuously, because Rb can no longer bind E2F."
        - "The cell stays in G₁, because Rb keeps E2F bound and the genes for the G₁-to-S transition are never switched on."
        - "The cell skips S phase and enters mitosis directly."
        - "The cell undergoes apoptosis immediately."
      option_explanations:
        - |
          A permanently unphosphorylated Rb is a brake that cannot be released; it binds E2F more reliably, not less, so division is blocked rather than freed.
        - |
          Correct. Growth signals normally lead to Rb phosphorylation, which releases E2F to activate S-phase genes; a non-phosphorylatable Rb never lets go, so the cell cannot pass the restriction point.
        - |
          The order of the cycle is fixed; a cell cannot reach mitosis without replicating its DNA, and this mutation stops it before S phase anyway.
        - |
          Apoptosis is a p53-ordered response to damage; a cell parked in G₁ by an unreleased brake is arrested, not killed.
      answer: 1
      explanation: |
        Predict a mutation's effect by asking what the protein normally does and whether the change locks it on or off. Rb that cannot be phosphorylated is a brake locked on; Rb deleted is a brake missing, which is the cancer-causing form.

    - slug: u04-w14-q11
      type: multiple_choice
      topic_code: "4.6"
      source: "Biology 2e §10.4 Cancer and the Cell Cycle"
      points: 1
      prompt: |
        Which comparison of proto-oncogenes and tumour suppressor genes is correct?
      options:
        - "Proto-oncogenes encode negative regulators; tumour suppressors encode positive regulators."
        - "A proto-oncogene becomes cancer-promoting when a mutation makes its product overactive, like a stuck accelerator; a tumour suppressor becomes cancer-promoting when a mutation disables its product, like failed brakes."
        - "Both cause cancer only when their products are overproduced."
        - "Proto-oncogenes are found only in cancer cells."
      option_explanations:
        - |
          Reversed: proto-oncogenes encode positive regulators such as growth-factor receptors, Ras and cyclins; tumour suppressors encode the brakes, p53, p21 and Rb.
        - |
          Correct. The two classes fail in opposite ways: gain of function for a proto-oncogene, loss of function for a tumour suppressor, and either removes a restraint on division.
        - |
          Overproduction is a gain of function and applies to proto-oncogenes; tumour suppressors cause trouble when they are lost or inactivated, the opposite direction.
        - |
          Proto-oncogenes are normal genes in every cell, needed for normal growth; they are called oncogenes only once mutated.
      answer: 1
