    # ---- True/false
    - slug: u04-w14-q19
      type: true_false
      topic_code: "4.6"
      source: "Biology 2e §10.3 Control of the Cell Cycle"
      points: 1
      prompt: |
        True or false: The concentration of cyclin-dependent kinase protein in a cell rises and falls through the cycle, and that fluctuation is what times the checkpoints.
      answer: false
      explanation: |
        False. Cdk protein levels stay relatively stable; it is the cyclins that are synthesised and degraded on a schedule, and the fluctuation in cyclin concentration determines when active Cdk-cyclin complexes exist. The kinase is the engine, the cyclin is the ignition key, and the key is what comes and goes. Confusing the two is the most common error on this topic.

