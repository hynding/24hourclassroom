      source: "Biology 2e §9.2 Propagation of the Signal"
      points: 1
      prompt: |
        Review. The endoplasmic reticulum holds Ca²⁺ at a concentration thousands of times higher than the surrounding cytoplasm and releases it when IP₃ opens its channels. Which advantage of compartmentalisation in eukaryotic cells does this illustrate?
      options:
        - "Compartments let incompatible conditions, such as a high Ca²⁺ store and a low-Ca²⁺ cytoplasm, exist side by side and be switched between on demand."
        - "Compartments make the cell smaller, so diffusion is faster."
        - "Compartments allow prokaryotes to compete with eukaryotes."
        - "Compartments replace the need for membrane proteins."
      option_explanations:
        - |
          Correct. Membrane-bound compartments separate chemistry; the ER can be a Ca²⁺ reservoir precisely because its membrane keeps the ions out of the cytoplasm until a channel opens. Lysosomes keeping acid and hydrolases away from the rest of the cell is the same principle.
        - |
