    # ---- Free response
    - slug: u04-w12-q23
      type: short_answer
      topic_code: "4.3"
      source: "Biology 2e §9.3 Response to the Signal"
      points: 4
      prompt: |
        Conceptual analysis. In a liver cell, epinephrine binds a G protein-coupled receptor, which activates adenylyl cyclase; cAMP activates protein kinase A, which phosphorylates and activates the enzyme that breaks glycogen down to glucose. (a) Identify the step in this pathway that is reception and the step that is the response. (b) Explain how the pathway amplifies the signal. (c) A mutation makes the cell's phosphodiesterase non-functional. Predict the effect on glucose release after a brief pulse of epinephrine, and (d) justify your prediction.
      answer: |
        Reception is epinephrine binding its receptor; the response is glycogen breakdown releasing glucose. Each activated component acts on many molecules of the next, so the number of active molecules grows at every step. Without phosphodiesterase, cAMP is not degraded, so PKA stays active and glucose release continues long after the hormone is gone, because the termination step of the pathway is missing.
      explanation: |
        Four points, one per task.

        (a) Identify, 1 pt: reception = epinephrine binding the G protein-coupled receptor at the cell surface; response = activation of the glycogen-degrading enzyme and release of glucose (accept "glycogen breakdown"). Both must be named; identifying cAMP production as the response earns nothing for this part.

        (b) Explain, 1 pt: one receptor activates many G proteins (or many adenylyl cyclase molecules), each cyclase makes many cAMP, each PKA phosphorylates many enzyme molecules; because each step is catalytic, the number of activated molecules multiplies down the cascade. Saying only "the signal gets bigger" is a restatement and earns nothing.

        (c) Predict, 1 pt: glucose release will be prolonged or exaggerated and will not stop when epinephrine is removed; accept "the cell keeps releasing glucose" or "the response lasts much longer than normal".

        (d) Justify, 1 pt: phosphodiesterase converts cAMP to AMP and is the step that turns the pathway off; without it cAMP persists, protein kinase A stays active and keeps the glycogen-degrading enzyme phosphorylated, so the response continues without a ligand. Accept an answer that also notes phosphatases could eventually reverse the enzyme's phosphorylation but cannot stop PKA while cAMP remains.

        Zero: answers that place the receptor inside the cell, that describe amplification as the hormone being copied, or that predict no change because "the hormone is gone".

    - slug: u04-w12-q24
      type: short_answer
