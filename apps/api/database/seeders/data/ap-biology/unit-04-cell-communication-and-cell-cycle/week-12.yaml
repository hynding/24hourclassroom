        Four points.

        (a) Describe, 1 pt: light is essentially absent at low density and rises sharply only above a threshold (between 10⁷ and 10⁹ cells/mL); must cite at least two values or give the threshold idea. "Light increases with density" alone, without the threshold or numbers, earns nothing.

        (b) Explain, 2 pts: 1 pt for the inference that the bacteria release a signalling molecule (autoinducer) into the medium and that its concentration, not cell contact, is what they sense; 1 pt for connecting culture 4 to that inference: the cell-free liquid already contained a high concentration of the molecule, so sparse cells behaved as if they were crowded. Accept "quorum sensing" as a name only if the mechanism is described.

        (c) Predict and justify, 1 pt: the culture would still glow (light near 88), because a small heat-stable molecule is not destroyed by boiling; the justification must link heat stability to the molecule's structure (not a protein, so no denaturation). A student who predicts no light because "boiling kills the signal" has ignored the stated heat stability and earns nothing for this part.

        Zero: answers that attribute the light to the liquid being nutrient-rich without reference to a signal, or that say bacteria count each other by touch.

    - slug: u04-w12-q25
      type: long_answer
      topic_code: "4.2"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. A growth factor normally binds a receptor tyrosine kinase and, through the Ras kinase cascade, causes cultured cells to divide. Researchers made four versions of the receptor and measured two things: phosphorylated tyrosine on the receptor after growth factor was added, and the number of cell divisions in 48 hours.

        | Receptor version | Growth factor added? | Phosphotyrosine on receptor (relative) | Divisions per 100 cells in 48 h |
        |---|---|---|---|
        | Wild type | no | 1 | 5 |
        | Wild type | yes | 40 | 52 |
        | Extracellular domain deleted | yes | 1 | 4 |
        | Kinase domain inactivated by mutation | yes | 2 | 6 |
        | Two receptors permanently joined (forced dimer) | no | 38 | 49 |

        (a) Identify the independent and dependent variables, and state the purpose of the wild type without growth factor row.
        (b) Describe the pattern in the data for the three mutant receptors compared with wild type plus growth factor.
        (c) Explain, using the mechanism of receptor tyrosine kinases, why the extracellular deletion and the kinase mutation each fail to produce division, and why the forced dimer divides without growth factor.
        (d) A fifth version has a mutation in Ras that prevents GTP hydrolysis. Predict the two measurements for this cell line with no growth factor added, and justify each prediction.
      answer: |
        IV: receptor version (and growth factor presence); DV: receptor phosphotyrosine and divisions per 100 cells; the untreated wild type gives the baseline. Deleting the extracellular domain or inactivating the kinase abolishes both phosphorylation and division; the forced dimer phosphorylates and divides without ligand. Ligand binding normally causes dimerisation, after which each receptor phosphorylates the other; no binding domain means no dimer, no kinase means no phosphorylation, and a forced dimer skips the need for ligand. A GTPase-dead Ras is downstream of the receptor, so receptor phosphotyrosine would stay low (about 1) without growth factor, but divisions would be high (near 50) because the cascade below Ras runs continuously.
      explanation: |
        Eight points.

        (a) 2 pts: 1 pt for independent variable = the receptor version (accept "the mutation" or "receptor structure", with or without growth factor presence as a second manipulated variable) and dependent variables = receptor phosphotyrosine level and divisions per 100 cells; 1 pt for the control's purpose: the wild type with no growth factor gives the baseline rate of phosphorylation and division so that the effect of growth factor and of each mutation can be measured against it.

        (b) 1 pt: the extracellular deletion and the kinase-dead mutant show near-baseline phosphorylation (1–2) and division (4–6) even with growth factor, while the forced dimer reaches wild-type-plus-ligand levels (38 phosphotyrosine, 49 divisions) with no growth factor at all. At least two comparisons with numbers or a clear ordering are required.

        (c) 3 pts: 1 pt for the extracellular deletion: the ligand-binding domain is gone, so growth factor cannot bind, the receptors never dimerise and no cross-phosphorylation occurs; 1 pt for the kinase mutation: ligand may bind and dimers may form, but with no kinase activity neither partner can phosphorylate the other's tyrosines, so no docking sites form and the cascade never starts; 1 pt for the forced dimer: dimerisation is the event that ligand binding normally causes, so permanently paired receptors cross-phosphorylate and signal without any ligand. Accept "autophosphorylation" or "transphosphorylation" for the cross-phosphorylation step.

        (d) 2 pts: 1 pt for predicting receptor phosphotyrosine near baseline (about 1) because Ras is downstream of the receptor and a Ras mutation cannot affect the receptor's own phosphorylation without ligand; 1 pt for predicting divisions near the stimulated level (about 50) because GTP-locked Ras keeps the kinase cascade running and signals division continuously. Both predictions need a justification referring to upstream versus downstream position.

        Zero for a part: restating the table without comparison; explaining failure of the mutants by "the mutation broke the receptor" with no mechanism; predicting that a Ras mutation raises receptor phosphorylation; or treating the forced dimer as a loss-of-function result.
