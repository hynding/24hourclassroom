    # ---- True/false
    - slug: u04-w12-q17
      type: true_false
      topic_code: "4.3"
      source: "Biology 2e §9.3 Response to the Signal"
      points: 1
      prompt: |
        True or false: Phosphatases help terminate a signal by removing phosphate groups from proteins that a kinase cascade has activated.
      answer: true
      explanation: |
        True. Every kinase step is reversed by a phosphatase; together with ligand removal, phosphodiesterase destroying cAMP and pumps clearing Ca²⁺, this returns the cell to its resting state. A cell that could not dephosphorylate would stay in whatever state the last signal left it.

    - slug: u04-w12-q18
      type: true_false
      topic_code: "2.8"
      source: "Biology 2e §9.2 Propagation of the Signal"
      points: 1
      prompt: |
        Review. True or false: Because cytoplasmic Ca²⁺ is kept far below the concentration outside the cell, releasing Ca²⁺ into the cytoplasm during a signal requires ATP-driven active transport.
      answer: false
      explanation: |
        False. The release is passive: once a channel opens, Ca²⁺ moves down its concentration gradient into the cytoplasm by facilitated diffusion, with no ATP spent. It is the opposite job, pumping Ca²⁺ back out or into the ER against the gradient to end the signal and reset the cell, that is active transport and costs ATP (topic 2.8).

    - slug: u04-w12-q19
      type: true_false
      topic_code: "3.2"
      source: "Biology 2e §9.2 Propagation of the Signal"
      points: 1
      prompt: |
        Review. True or false: A fall in cytoplasmic pH that changes the charges on R groups in a kinase's active site could slow the rate at which that kinase phosphorylates its targets.
      answer: true
      explanation: |
        True. A kinase is an enzyme, and enzymes depend on the charge and shape of the active site (topic 3.2). Extra H⁺ protonates acidic R groups and changes the ionic and hydrogen bonds that hold the site's shape, so substrate (and ATP) binding and catalysis slow. Environmental conditions therefore affect signalling pathways as they affect any other enzyme-catalysed process.

