week: 12
unit: 4
title: Cell Communication and Signal Transduction
topics: ["4.1", "4.2", "4.3"]
guide: guides/week-12.md
guide_description: |
  How cells talk: direct contact, paracrine, synaptic and endocrine signalling, and quorum sensing in bacteria;
  the three parts of every pathway (reception, transduction, response); surface receptors versus internal
  receptors; G proteins, receptor tyrosine kinases, kinase cascades and second messengers; amplification,
  termination, and why one mutation in a pathway can switch it permanently on. Vocabulary, three worked examples
  (an epinephrine experiment, an amplification calculation, a receptor-mutation table), misconceptions, self-check.
flashcards_description: |
  34 cards: the signalling vocabulary, receptor-to-response pathways step by step, and "what does this result
  show" cards for cell communication and signal transduction.

flashcards:
  - front: Ligand → definition and the two classes by solubility
    back: |
      A molecule that binds a specific receptor and delivers a signal. Hydrophobic ligands (steroids, thyroid hormone, nitric oxide) cross the membrane and bind internal receptors; hydrophilic ligands (peptides, proteins, amino-acid derivatives) cannot cross and bind cell-surface receptors.
    hint: Can it get through the bilayer?
    topic_code: "4.1"
  - front: Receptor protein → what it is and why binding is specific
    back: |
      A protein with a binding site whose shape and chemistry fit one ligand (or a family). Binding changes the receptor's shape, and that change is the signal passed inward. Specificity comes from tertiary structure.
    topic_code: "4.1"
  - front: Direct-contact signalling → the two structures that allow it
    back: |
      Gap junctions in animal cells and plasmodesmata in plant cells: fluid-filled channels through which small molecules and ions (intracellular mediators) diffuse from one cytoplasm to the next. Proteins and DNA are too large to pass.
    topic_code: "4.1"
  - front: Paracrine signalling
    back: |
      Local signalling: the ligand diffuses through the extracellular matrix to nearby cells and is quickly degraded or taken up, so the response stays local. Growth factors and neurotransmitters are examples.
    topic_code: "4.1"
  - front: Synaptic signalling → distance and how the signal is cleared
    back: |
      A form of paracrine signalling between nerve cells across a synaptic cleft only 20–40 nm wide. Neurotransmitter is released, binds receptors on the target cell, and is then broken down by enzymes or reabsorbed, so the message is brief.
    topic_code: "4.1"
  - front: Endocrine signalling
    back: |
      Long-distance signalling by hormones released into the bloodstream. Hormones are diluted to very low concentrations, so target cells need high-affinity receptors; responses are slower but longer lasting than paracrine responses.
    topic_code: "4.1"
  - front: Autocrine signalling
    back: |
      A cell responds to a ligand it released itself (or a neighbouring cell of the same type does). Used in development, pain and inflammation; a damaged cell can signal itself to undergo programmed cell death.
    topic_code: "4.1"
  - front: Quorum sensing → mechanism and the bioluminescence example
    back: |
      Bacteria secrete autoinducers; the concentration rises with population density. Above a threshold the autoinducer binds transcription factors and switches genes on. Vibrio fischeri glows only when crowded inside the bobtail squid's light organ.
    hint: A census taken by chemistry.
    topic_code: "4.1"
  - front: Autoinducer
    back: |
      A signalling molecule a bacterium secretes to communicate with others of its kind. Acyl-homoserine lactones are small and hydrophobic; others are peptides. Autoinducer production is itself switched on by autoinducer, a positive feedback loop.
    topic_code: "4.1"
  - front: Yeast mating factor → what the example shows
    back: |
      Haploid yeast secrete a peptide mating factor; receptors on a compatible cell trigger a cascade of kinases and G-protein-like GTP-binding proteins. The same components as animal pathways, so signalling predates multicellularity.
    topic_code: "4.1"
  - front: Biofilm
    back: |
      A coordinated colony of bacteria held in a secreted matrix, formed when quorum sensing switches on group behaviours such as adhesion and toxin release. Biofilms on implants and catheters are hard to clear and cause serious infections.
    topic_code: "4.1"
  - front: Internal (intracellular) receptor → which ligands and what happens after binding
    back: |
      Sits in the cytoplasm or nucleus; binds hydrophobic ligands that have crossed the membrane (estradiol, testosterone, thyroid hormone). Binding exposes a DNA-binding region; the complex moves to the nucleus and switches transcription of specific genes on or off.
    topic_code: "4.2"
  - front: Cell-surface receptor → the three domains
    back: |
      An integral membrane protein with an extracellular domain (binds the ligand), a transmembrane domain (hydrophobic R groups, anchors it) and an intracellular domain (changes shape and starts transduction). Needed for ligands that cannot cross the bilayer.
    topic_code: "4.2"
  - front: Ion channel-linked receptor
    back: |
      A surface receptor that is also a gated channel: ligand binding changes its shape and opens a pore that lets specific ions (Na⁺, Ca²⁺, Mg²⁺, H⁺) flow down their gradient. Fast, used at synapses.
    topic_code: "4.2"
  - front: G protein-coupled receptor → the GTP/GDP cycle
    back: |
      Seven transmembrane segments. Ligand binding lets the attached G protein swap GDP for GTP and split into active α and βγ parts, which switch on membrane enzymes or channels. The α subunit hydrolyses GTP to GDP and the signal stops.
    hint: GTP on means on; hydrolysis to GDP is the off switch.
    topic_code: "4.2"
  - front: Receptor tyrosine kinase → what ligand binding does to it
    back: |
      An enzyme-linked receptor. Ligand binding makes two receptors pair (dimerise); each then adds phosphates to tyrosines on the other's intracellular tail. The phosphotyrosines become docking sites for relay proteins. Insulin and growth factor receptors work this way.
    topic_code: "4.2"
  - front: Signal transduction (definition)
    back: |
      Converting an extracellular signal (ligand bound at the surface) into an intracellular one, carried through the membrane and cytoplasm by a chain of shape changes, phosphorylations and second messengers until a response occurs.
    topic_code: "4.2"
  - front: Why is a signalling pathway called a cascade?
    back: |
      Each activated protein activates the next in a chain, and each enzyme in the chain can act on many molecules of the next, so the signal grows as it passes down. Upstream events come before a given step, downstream events after.
    topic_code: "4.2"
  - front: Phosphorylation → the enzyme that adds and the one that removes
    back: |
      A kinase transfers a phosphate from ATP to the –OH of serine, threonine or tyrosine on a target protein, changing its shape and activity. A phosphatase removes the phosphate (dephosphorylation), resetting the protein. Together they make the switch reversible.
    topic_code: "4.2"
  - front: Second messenger
    back: |
      A small, non-protein molecule or ion that spreads a signal inside the cell after a surface receptor is activated: cAMP, Ca²⁺, IP₃ and DAG. Small and numerous, so they move fast and amplify.
    topic_code: "4.3"
  - front: cAMP → made by, acts on, removed by
    back: |
      Made from ATP by adenylyl cyclase (a membrane enzyme turned on by a G protein). Binds and activates protein kinase A, which phosphorylates serine/threonine targets. Destroyed by phosphodiesterase, which converts it to AMP.
    topic_code: "4.3"
  - front: Calcium ions as a second messenger → where stored and how released
    back: |
      Cytoplasmic Ca²⁺ is kept very low by ATP-driven pumps that push it out of the cell or into the endoplasmic reticulum. A signal opens ligand-gated Ca²⁺ channels (in the membrane or the ER) and Ca²⁺ floods in down its gradient, triggering contraction, secretion or other responses.
    topic_code: "4.3"
  - front: IP₃ and DAG → made from what, and what each does
    back: |
      Phospholipase C, activated by a G protein, splits the membrane lipid PIP₂ into two second messengers. DAG stays in the membrane and activates protein kinase C; IP₃ diffuses to the ER and opens Ca²⁺ channels.
    topic_code: "4.3"
  - front: Epinephrine → the pathway from receptor to glucose
    back: |
      Epinephrine binds a G protein-coupled receptor on liver or muscle cells → G protein activates adenylyl cyclase → cAMP rises → protein kinase A is activated → PKA phosphorylates one enzyme that starts glycogen breakdown and another that stops glycogen synthesis. Glucose is released for fight or flight.
    hint: Six steps, each one amplifying.
    topic_code: "4.3"
  - front: Signal amplification → mechanism and consequence
    back: |
      One activated receptor switches on many G proteins; each enzyme downstream makes or activates many of the next molecule. A handful of hormone molecules can release millions of glucose molecules, which is why hormones work at tiny concentrations.
    topic_code: "4.3"
  - front: How can one ligand cause different responses in different cells?
    back: |
      The receptor and second messenger may be the same, but each cell type expresses a different set of target proteins for the kinase to act on. Epinephrine makes liver cells release glucose and heart muscle beat faster through the same cAMP pathway.
    topic_code: "4.3"
  - front: Four ways a cell switches a signal off
    back: |
      The ligand is degraded or removed; phosphatases strip phosphates from activated proteins; phosphodiesterase breaks cAMP down to AMP; pumps return Ca²⁺ to the ER or outside. Without termination a brief signal would become a permanent one.
    topic_code: "4.3"
  - front: Kinds of cellular response a pathway can produce
    back: |
      A change in gene expression (a transcription factor is freed or activated), a change in protein synthesis, a change in enzyme activity (metabolism), growth and division (growth factor → Ras → MAP kinase pathway), movement, secretion, or apoptosis.
    topic_code: "4.3"
  - front: Apoptosis → what it is and two situations that trigger it
    back: |
      Programmed cell death: a controlled dismantling of a cell that keeps harmful contents from leaking. Triggered by signals such as DNA damage, loss of contact with the extracellular matrix, or an immature T cell recognising a self protein; it also removes the webbing between embryonic fingers.
    topic_code: "4.3"
  - front: Why does a mutation in Ras cause uncontrolled growth?
    back: |
      Ras is a small G protein in the growth-factor pathway; it is on with GTP and off after hydrolysing it to GDP. A mutation that disables its GTPase activity leaves it locked on, so the kinase cascade signals division with no growth factor present. Ras mutations are found in about 30% of cancers.
    topic_code: "4.3"
  - front: Cholera toxin → what it does to a G protein and the result
    back: |
      The toxin chemically modifies a G protein in intestinal cells so it cannot hydrolyse GTP and stays active. Chloride channels stay open, water follows the ions into the gut, and the diarrhoea can be fatal through dehydration. A natural experiment in signal termination.
    topic_code: "4.3"
  - front: Nitric oxide → why it needs no surface receptor and why it acts locally
    back: |
      NO is a gas that diffuses straight through the bilayer to receptors inside the target cell, relaxing smooth muscle. Its half-life is seconds, so it acts only on cells next to the one that made it.
    topic_code: "4.1"
  - front: Upstream vs downstream in a pathway
    back: |
      Relative to any step, upstream components act before it (closer to the receptor) and downstream components after it (closer to the response). A block upstream stops everything below; adding a downstream molecule bypasses a block above it.
    hint: Think of a river, where a dam stops only what is below it.
    topic_code: "4.2"
  - front: Given this result, what is the conclusion? Adding cAMP to a cell extract with no membranes still releases glucose
    back: |
      cAMP acts downstream of the receptor and inside the cell; it is sufficient to trigger the response without hormone or receptor. Combined with the finding that hormone alone does nothing in the extract, it shows the receptor is at the membrane and cAMP is the messenger.
    topic_code: "4.3"

quiz:
  description: |
    25 questions · about 30 minutes · about 70% this week (cell communication, receptors, signal transduction) and
    30% review of enzymes, membranes, protein structure and cell compartments. Multiple choice, select-all, true/false
    and numeric items are graded at once; the fill-in-the-blank items are matched automatically; the two short
    answers and the long answer are graded by your teacher against the acceptable-answer summary.
  questions:
    # ---- Stimulus set: an epinephrine and glycogen experiment (4.2, 4.3)
    - slug: u04-w12-q01
      type: multiple_choice
      topic_code: "4.2"
      source: "Biology 2e §9.3 Response to the Signal"
      points: 1
      stimulus: |
        Researchers investigated how the hormone epinephrine causes liver cells to release glucose. Five preparations of liver tissue were treated as shown. Glucose released into the medium was measured after ten minutes, and the level of cAMP in each preparation was measured at the same time. Each value is the mean of four trials.

        | Preparation | Treatment | cAMP (relative units) | Glucose released (μmol) |
        |---|---|---|---|
        | A: intact liver cells | none | 1 | 2 |
        | B: intact liver cells | epinephrine added | 25 | 48 |
        | C: cell-free extract, all membranes removed | epinephrine added | 1 | 3 |
        | D: cell-free extract, all membranes removed | cAMP added | — | 45 |
        | E: intact liver cells plus a drug that blocks the epinephrine receptor | epinephrine added | 1 | 2 |
      prompt: |
        Comparing preparations B and C, which conclusion is best supported?
      options:
        - "Epinephrine must enter the cytoplasm to act, so removing the membranes let it escape."
        - "Epinephrine acts at the plasma membrane; without membranes there is no receptor to bind it and no cAMP is produced."
        - "Epinephrine is destroyed by enzymes in a cell-free extract."
        - "Epinephrine works only when glucose is already present."
      option_explanations:
        - |
          If epinephrine acted inside the cell, removing the membranes would make it easier, not harder, for the hormone to reach its target; the extract contains all the cytoplasmic enzymes yet nothing happened.
        - |
          Correct. Epinephrine is a hydrophilic ligand with a cell-surface receptor; in C the membranes, and so the receptors and adenylyl cyclase, are gone, so cAMP stays at baseline and no glucose is released.
        - |
          Nothing in the data tests the stability of epinephrine; the simpler explanation that fits every row is the absence of a membrane receptor in C.
        - |
          Glucose is the product being measured, released from glycogen; its presence beforehand is not a condition the experiment varied.
      answer: 1
      explanation: |
        A hydrophilic hormone needs a surface receptor. The membrane-free extract still holds every cytoplasmic enzyme of the pathway, so the missing piece must be in the membrane.

    - slug: u04-w12-q02
      type: multiple_choice
      topic_code: "4.3"
      source: "Biology 2e §9.2 Propagation of the Signal"
      points: 1
      stimulus: |
        Researchers investigated how the hormone epinephrine causes liver cells to release glucose. Five preparations of liver tissue were treated as shown. Glucose released into the medium was measured after ten minutes, and the level of cAMP in each preparation was measured at the same time. Each value is the mean of four trials.

        | Preparation | Treatment | cAMP (relative units) | Glucose released (μmol) |
        |---|---|---|---|
        | A: intact liver cells | none | 1 | 2 |
        | B: intact liver cells | epinephrine added | 25 | 48 |
        | C: cell-free extract, all membranes removed | epinephrine added | 1 | 3 |
        | D: cell-free extract, all membranes removed | cAMP added | — | 45 |
        | E: intact liver cells plus a drug that blocks the epinephrine receptor | epinephrine added | 1 | 2 |
      prompt: |
        Preparation D released almost as much glucose as preparation B. What does this result show about the role of cAMP?
      options:
        - "cAMP is the hormone's receptor."
        - "cAMP acts downstream of the receptor, inside the cell, and is sufficient on its own to activate the enzymes that release glucose."
        - "cAMP must be converted to epinephrine before it can act."
        - "cAMP works only when membranes are absent."
      option_explanations:
        - |
          A receptor is a protein that binds the ligand; cAMP is a small nucleotide made after the receptor is activated, not the receptor itself.
        - |
          Correct. With no receptor and no membrane present, cAMP alone drives the response, so every step from cAMP to glucose release is cytoplasmic and lies downstream of the hormone-receptor step.
        - |
          The pathway runs the other way: epinephrine at the surface leads to cAMP inside. There is no conversion between them.
        - |
          Preparation B shows cAMP rising and glucose being released in intact cells, with membranes present; D simply shows that the membranes are not needed once cAMP exists.
      answer: 1
      explanation: |
        Adding a suspected messenger and getting the response without the hormone is the classic test for a second messenger: it is sufficient, and it acts downstream.

    - slug: u04-w12-q03
      type: multiple_choice
      topic_code: "4.2"
      source: "Biology 2e §9.1 Signaling Molecules and Cellular Receptors"
      points: 1
      stimulus: |
        Researchers investigated how the hormone epinephrine causes liver cells to release glucose. Five preparations of liver tissue were treated as shown. Glucose released into the medium was measured after ten minutes, and the level of cAMP in each preparation was measured at the same time. Each value is the mean of four trials.

        | Preparation | Treatment | cAMP (relative units) | Glucose released (μmol) |
        |---|---|---|---|
        | A: intact liver cells | none | 1 | 2 |
        | B: intact liver cells | epinephrine added | 25 | 48 |
        | C: cell-free extract, all membranes removed | epinephrine added | 1 | 3 |
        | D: cell-free extract, all membranes removed | cAMP added | — | 45 |
        | E: intact liver cells plus a drug that blocks the epinephrine receptor | epinephrine added | 1 | 2 |
      prompt: |
        In preparation E the cells are intact and epinephrine is present, yet cAMP and glucose stay at baseline. Which explanation is best?
      options:
        - "The drug destroyed the cells' glycogen stores."
        - "The drug occupies or distorts the receptor's ligand-binding site, so epinephrine cannot bind and the G protein is never activated."
        - "The drug converted epinephrine into a hydrophobic hormone that entered the cell instead."
        - "The drug raised the cells' cAMP so high that no more could be made."
      option_explanations:
        - |
          If glycogen were gone, cAMP would still rise when epinephrine bound, because cAMP is made before glycogen is touched; cAMP stayed at 1, so the block is earlier.
        - |
          Correct. Blocking the first step, reception, means no shape change in the receptor, no G protein activation, no adenylyl cyclase activity and so no cAMP; everything downstream stays silent.
        - |
          A hormone that entered the cell and worked through an internal receptor would still produce a response; the data show no response at all.
        - |
          The measured cAMP in E is 1 unit, the same as the untreated control, not high.
      answer: 1
      explanation: |
        A block at reception silences the whole pathway. Comparing E with B isolates the receptor as the required first step.

    - slug: u04-w12-q04
      type: multi_select
      topic_code: "4.3"
      source: "Biology 2e §9.3 Response to the Signal"
      points: 2
      partial_credit: true
      stimulus: |
        Researchers investigated how the hormone epinephrine causes liver cells to release glucose. Five preparations of liver tissue were treated as shown. Glucose released into the medium was measured after ten minutes, and the level of cAMP in each preparation was measured at the same time. Each value is the mean of four trials.

        | Preparation | Treatment | cAMP (relative units) | Glucose released (μmol) |
        |---|---|---|---|
        | A: intact liver cells | none | 1 | 2 |
        | B: intact liver cells | epinephrine added | 25 | 48 |
        | C: cell-free extract, all membranes removed | epinephrine added | 1 | 3 |
        | D: cell-free extract, all membranes removed | cAMP added | — | 45 |
        | E: intact liver cells plus a drug that blocks the epinephrine receptor | epinephrine added | 1 | 2 |
      prompt: |
        Select every statement that is supported by the data in the table.
      options:
        - "Epinephrine binding leads to a rise in cAMP in intact cells."
        - "cAMP is produced by enzymes in the cytoplasm that do not need a membrane."
        - "The enzymes that convert glycogen to glucose are present in the cell-free extract."
        - "A functional receptor is required for epinephrine to raise cAMP."
        - "Epinephrine raises cAMP by entering the nucleus and switching on the adenylyl cyclase gene."
      option_explanations:
        - |
          Correct. B versus A: adding epinephrine to intact cells raised cAMP from 1 to 25 units.
        - |
          Preparation C, with no membranes, made no cAMP in response to epinephrine; the enzyme that makes cAMP (adenylyl cyclase) sits in the membrane, which is exactly what was removed.
        - |
          Correct. In D the membrane-free extract released 45 μmol of glucose once cAMP was supplied, so the glycogen-degrading enzymes are soluble cytoplasmic proteins that survived membrane removal.
        - |
          Correct. In E, blocking the receptor kept cAMP at baseline despite epinephrine being present.
        - |
          The response was measured within ten minutes and happened in an extract with no nucleus (D); transcription of a new gene is far too slow and is not needed, since the cAMP-producing enzyme already exists.
      answer: [0, 2, 3]
      explanation: |
        Read each row as a test of one step. Intact cells plus hormone (B) show the whole pathway; membranes removed (C, D) locate the receptor and cyclase; the blocker (E) proves the receptor is required.

    # ---- Cell communication (4.1)
    - slug: u04-w12-q05
      type: multiple_choice
      topic_code: "4.1"
      source: "Biology 2e §9.1 Signaling Molecules and Cellular Receptors"
      points: 1
      prompt: |
        Insulin is released by cells in the pancreas, travels in the blood and acts on liver, muscle and fat cells throughout the body. Which type of signalling is this, and which feature of it follows?
      options:
        - "Paracrine signalling, so the response is confined to cells next to the pancreas."
        - "Endocrine signalling, so the hormone is diluted in the blood and target cells need receptors that bind it at very low concentration."
        - "Autocrine signalling, so only the pancreatic cells themselves respond."
        - "Direct-contact signalling through gap junctions between the pancreas and the liver."
      option_explanations:
        - |
          Paracrine signals diffuse through the extracellular matrix to neighbours and are degraded quickly; a ligand that reaches muscle in the leg from the pancreas has travelled far further than diffusion allows.
        - |
          Correct. Hormones are the long-distance class: carried by the bloodstream, diluted to tiny concentrations, acting on any cell that carries the matching receptor. The response is slower to begin and longer lasting than a local signal.
        - |
          Autocrine signalling is a cell acting on itself or on identical neighbours; insulin's targets are different cell types in distant tissues.
        - |
          Gap junctions join cytoplasms of cells that touch; the pancreas and liver are separate organs with no such continuity.
      answer: 1
      explanation: |
        Classify signalling by how far the ligand travels and how it gets there: through a shared channel, by diffusion to neighbours, across a synapse, or by the bloodstream.

    - slug: u04-w12-q06
      type: multiple_choice
      topic_code: "4.1"
      source: "Biology 2e §9.1 Signaling Molecules and Cellular Receptors"
      points: 1
      prompt: |
        Estradiol is a steroid built from cholesterol; glucagon is a 29-amino-acid peptide. Based on their chemistry, where is the receptor for each most likely located?
      options:
        - "Both on the cell surface, because all hormones are too large to cross the membrane."
        - "Estradiol's receptor inside the cell, because the hydrophobic steroid diffuses through the bilayer; glucagon's receptor on the cell surface, because the polar peptide cannot."
        - "Estradiol's receptor on the cell surface and glucagon's inside the cell, because peptides are small enough to slip through."
        - "Both inside the cell, because all hormones travel in the blood and are therefore soluble in lipid."
      option_explanations:
        - |
          Size is not the deciding factor; steroids are small and, more importantly, nonpolar, which is what lets them pass the hydrophobic core of the bilayer.
        - |
          Correct. Hydrophobic ligands cross the membrane and bind internal receptors that then act on DNA; hydrophilic ligands such as peptides are stopped by the bilayer and must bind a surface receptor whose intracellular domain relays the signal.
        - |
          This reverses the chemistry: a peptide carries many polar and charged groups and is excluded by the lipid core, whatever its size.
        - |
          Travelling in the blood requires a carrier protein for a steroid precisely because the blood is watery; soluble in blood is not the same as able to cross a lipid bilayer.
      answer: 1
      explanation: |
        Membrane permeability (topic 2.4) decides receptor location: if the ligand can get in, the receptor can be inside; if it cannot, the receptor must face outward.

    # ---- Signal transduction (4.2)
    - slug: u04-w12-q07
      type: multiple_choice
      topic_code: "4.2"
      source: "Biology 2e §9.2 Propagation of the Signal"
      points: 1
      prompt: |
        A mutation changes the extracellular domain of a receptor tyrosine kinase so that it can still bind its growth factor but can no longer pair with a second receptor molecule. What is the most likely consequence?
      options:
        - "The receptor signals continuously, because unpaired receptors are always active."
        - "No signal is produced, because the two intracellular domains cannot phosphorylate each other's tyrosines."
        - "The growth factor is converted to a steroid and enters the cell."
        - "The receptor switches to using a G protein instead."
      option_explanations:
        - |
          Activity of a receptor tyrosine kinase depends on pairing; a single receptor's kinase domain has nothing to act on, so the result is silence, not constant signalling.
        - |
          Correct. Ligand binding normally causes dimerisation; each partner then phosphorylates tyrosines on the other, and those phosphotyrosines are the docking sites for the relay proteins. No dimer, no cross-phosphorylation, no docking sites.
        - |
          Ligand chemistry is set by the molecule itself; a receptor cannot turn a protein ligand into a lipid.
        - |
          The G protein mechanism belongs to a different receptor family with seven transmembrane segments; a receptor cannot change class.
      answer: 1
      explanation: |
        For enzyme-linked receptors, dimerisation is the switch. A change in the structure of any pathway component (here, the receptor) changes the pathway's output (CED 4.3).

    - slug: u04-w12-q08
      type: multiple_choice
      topic_code: "4.2"
      source: "Biology 2e §9.1 Signaling Molecules and Cellular Receptors"
      points: 1
      prompt: |
        Cholera toxin chemically modifies a G protein in intestinal cells so that it can no longer hydrolyse GTP to GDP. Which outcome follows directly?
      options:
        - "The G protein never becomes active, so the cells stop secreting."
        - "The G protein stays switched on, chloride channels remain open, water follows the ions into the gut and severe diarrhoea results."
        - "The receptor loses its seven transmembrane segments."
        - "The G protein converts to a receptor tyrosine kinase."
      option_explanations:
        - |
          The modification affects the off step, not the on step; the protein still binds GTP and activates, it simply cannot stop.
        - |
          Correct. GTP hydrolysis is the G protein's built-in timer. Removing it locks the protein in the active state, and every downstream step (channel opening, ion and water loss) runs without a stop signal.
        - |
          The receptor is a separate protein and is untouched by the toxin; the lesion is in the G protein's enzyme activity.
        - |
          Proteins do not change families; a G protein modified by a toxin is still a G protein, only one with a broken switch.
      answer: 1
      explanation: |
        Signal termination is part of the signal. The GTP-to-GDP step and the kinase-to-phosphatase pair are the off switches; disable one and a transient message becomes permanent.

    # ---- Signal transduction pathways (4.3)
    - slug: u04-w12-q09
      type: multiple_choice
      topic_code: "4.3"
      source: "Biology 2e §9.2 Propagation of the Signal"
      points: 1
      prompt: |
        A single molecule of epinephrine binding a liver cell can lead to the release of millions of glucose molecules. Which feature of the pathway makes this possible?
      options:
        - "Each epinephrine molecule is split into millions of smaller signalling molecules."
        - "Each activated enzyme in the cascade acts on many molecules of the next component, so the number of active molecules multiplies at every step."
        - "The receptor copies itself every time it is activated."
        - "Glycogen spontaneously breaks down once any signal reaches the cell."
      option_explanations:
        - |
          The ligand is not consumed or divided; it binds, triggers a shape change and is later removed. The multiplication happens inside the cell, not to the hormone.
        - |
          Correct. One receptor activates many G proteins, each adenylyl cyclase makes many cAMP, each PKA phosphorylates many enzymes and each of those releases many glucose units. Amplification is the product of all those factors.
        - |
          Receptors are proteins encoded in the genome; they are made by translation, not by self-copying on activation.
        - |
          Glycogen breakdown is enzyme-catalysed and tightly controlled; it is the activation of those enzymes by the cascade that releases glucose.
      answer: 1
      explanation: |
        Amplification is why hormones work at nanomolar concentrations and why a cascade, rather than a single step, is worth the cost.

    - slug: u04-w12-q10
      type: multiple_choice
      topic_code: "4.3"
      source: "Biology 2e §9.3 Response to the Signal"
      points: 1
      prompt: |
        Epinephrine makes liver cells release glucose and makes heart muscle cells contract faster, yet both cell types use the same receptor and the same rise in cAMP. What best explains the different responses?
      options:
        - "Heart cells receive a different hormone that happens to be named the same."
        - "The two cell types express different sets of target proteins for protein kinase A to phosphorylate, so the same messenger produces different outcomes."
        - "cAMP is a different molecule in heart cells."
        - "Liver cells have more receptors, which changes the kind of response rather than its size."
      option_explanations:
        - |
          The same molecule, epinephrine, reaches both tissues through the blood; the difference lies in the responding cells.
        - |
          Correct. The pathway's first steps are shared, but the proteins waiting at the end differ: glycogen-handling enzymes in liver, contraction-related proteins in heart. Response depends on which genes each cell expresses.
        - |
          cAMP is cyclic adenosine monophosphate wherever it occurs; it is the targets, not the messenger, that vary.
        - |
          Receptor number changes sensitivity (how much response for a given dose), not the identity of the response.
      answer: 1
      explanation: |
        A signal means whatever the receiving cell is equipped to do with it. The same logic explains why one hormone can coordinate many tissues at once.

    - slug: u04-w12-q11
