      answer: |
        Light appears only above a threshold density (near zero at 10⁵ and 10⁷ cells/mL, high at 10⁹). Culture 4 shows the signal is a secreted, cell-free molecule: the liquid alone makes sparse cells glow, so they detect density through the concentration of an autoinducer rather than by contact. A small heat-stable lactone would survive boiling, so the low-density culture would still glow.
