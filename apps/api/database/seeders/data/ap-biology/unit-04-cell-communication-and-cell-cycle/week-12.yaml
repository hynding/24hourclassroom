    # ---- Spiral review
    - slug: u04-w12-q12
      type: multiple_choice
      topic_code: "3.1"
      source: "Biology 2e §9.2 Propagation of the Signal"
      points: 1
      prompt: |
        Review. A kinase attaches a negatively charged phosphate group to a serine in the target enzyme, and the target enzyme becomes active. Which principle of enzyme regulation best explains why adding a phosphate changes activity?
      options:
        - "The phosphate supplies the energy the enzyme uses to catalyse its reaction."
        - "The added charge alters interactions among R groups, changing the enzyme's three-dimensional shape and so the shape of its active site."
        - "The phosphate is the enzyme's substrate, so the enzyme now has something to act on."
        - "Phosphorylation increases the enzyme's temperature, speeding up the reaction."
      option_explanations:
        - |
          Energy for the enzyme's own reaction comes from the reaction's substrates or from coupled ATP hydrolysis in that reaction, not from the phosphate stuck to the enzyme's surface.
        - |
          Correct. An enzyme's activity depends on the shape of its active site, and shape depends on R-group interactions (topic 1.7); a new negative charge forms or breaks ionic and hydrogen bonds and shifts the fold, which is a form of allosteric regulation.
        - |
          The substrate is whatever the target enzyme converts (glycogen, for example); the phosphate on the enzyme is a regulatory tag, not a substrate.
        - |
          A single phosphate does not heat a protein; reaction rate rises because the active site now fits the substrate, not because of temperature.
      answer: 1
      explanation: |
        Phosphorylation is regulation by shape change. The same structure-function logic you learned for enzymes explains how every kinase cascade works.

    - slug: u04-w12-q13
      type: multiple_choice
      topic_code: "2.4"
      source: "Biology 2e §9.1 Signaling Molecules and Cellular Receptors"
      points: 1
      prompt: |
        Review. Which property of the plasma membrane is the reason a peptide hormone must bind a receptor on the cell surface rather than entering the cell?
      options:
        - "The membrane is a rigid wall that blocks every molecule larger than water."
        - "The hydrophobic core of the phospholipid bilayer is impermeable to large polar and charged molecules."
        - "The membrane carries a positive charge that repels all proteins."
        - "The membrane is covered by a layer of cellulose."
      option_explanations:
        - |
          The membrane is fluid and selectively permeable; small nonpolar molecules such as O₂, CO₂ and steroids pass through, so size is not the simple rule.
        - |
          Correct. The fatty-acid tails exclude polar and charged molecules; a peptide of dozens of amino acids with many polar R groups cannot dissolve in that core, so its message must be carried across by a transmembrane protein.
        - |
          The membrane as a whole does not carry a uniform charge that repels proteins; many proteins are embedded in it and many bind to it.
        - |
          Cellulose is a plant cell-wall polymer, not a component of the plasma membrane, and animal cells have no wall at all.
      answer: 1
      explanation: |
        Selective permeability from Unit 2 is the reason signalling needs two receptor locations: inside for ligands that cross, on the surface for those that cannot.

    - slug: u04-w12-q14
      type: multiple_choice
      topic_code: "1.7"
      source: "Biology 2e §9.1 Signaling Molecules and Cellular Receptors"
      points: 1
      prompt: |
        Review. A mutation replaces a polar amino acid in the ligand-binding pocket of a hormone receptor with a bulky nonpolar one. The hormone no longer binds. At which level of protein structure did the change occur, and why did it matter?
      options:
        - "Primary structure changed, which altered the local R-group chemistry and shape of the binding site so the ligand no longer fits."
        - "Quaternary structure changed, because the receptor lost a subunit."
        - "Only secondary structure changed, because α helices depend on R groups."
        - "No level of structure changed; binding failed because the hormone was mutated."
      option_explanations:
        - |
          Correct. A substitution is a change in sequence (primary structure); because the new R group differs in polarity and size, the hydrogen bonds and fit between receptor and ligand are lost. Binding is a matter of complementary shape and chemistry.
        - |
          Nothing in the scenario removes a polypeptide; the receptor is the same chain with one residue swapped.
        - |
          Secondary structure is held by backbone hydrogen bonds and is largely independent of R-group identity; the binding pocket is a tertiary feature shaped by R groups.
        - |
          The hormone is unchanged; the receptor is what mutated, and its binding site is what no longer matches.
      answer: 0
      explanation: |
        Receptor-ligand specificity is protein structure at work. Change the sequence in the pocket, change the fit, and the whole pathway downstream goes quiet.

    - slug: u04-w12-q15
      type: multiple_choice
