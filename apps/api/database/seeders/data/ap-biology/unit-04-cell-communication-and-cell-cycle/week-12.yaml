      points: 4
      prompt: |
        Analyze data. Vibrio fischeri bacteria were grown in flasks at different densities, and the light each culture produced was measured. In a separate flask, bacteria at low density were given cell-free liquid taken from a dense, glowing culture.

        | Culture | Cells per mL | Light (relative units) |
        |---|---|---|
        | 1 | 10⁵ | 0 |
        | 2 | 10⁷ | 1 |
        | 3 | 10⁹ | 95 |
        | 4 | 10⁵ plus liquid from culture 3 | 88 |

