      - |
        The change is in primary structure; its consequences appear first in tertiary structure, and quaternary structure applies only if there are multiple chains.
    answer: 1
    explanation: |
      Unit 1 predicts Unit 6: the effect of a substitution is written in the chemistry of the R groups and where in the fold they sit.

