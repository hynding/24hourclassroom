  - slug: u06-exam-q38
    type: fill_blank
    topic_code: "6.4"
    source: "Biology 2e §15.1 The Genetic Code"
    points: 1
    prompt: |
      Because most amino acids are specified by more than one codon, the genetic code is described as ____.
    answer: ["degenerate", "redundant"]
    explanation: |
      Sixty-one sense codons for twenty amino acids means redundancy, concentrated at the third codon position, which is why many third-position substitutions are silent. The code is degenerate but not ambiguous: each codon specifies only one amino acid. "Universal" describes a different property, that nearly all organisms share the same assignments.

  - slug: u06-exam-q39
    type: fill_blank
    topic_code: "6.6"
    source: "Biology 2e §16.4 Eukaryotic Transcription Gene Regulation"
    points: 1
    prompt: |
      Proteins that bind specific DNA sequences such as promoters and enhancers and thereby increase or decrease the transcription of particular genes are called ____.
    answer: ["transcription factors", "transcription factor"]
    explanation: |
      Transcription factors are the trans-acting side of gene regulation; the DNA sequences they bind are the cis-acting side. General factors assemble the pre-initiation complex at every Pol II promoter; specific factors (activators and repressors) bind enhancers and silencers and give each cell type its pattern of expression. "RNA polymerase" is not accepted: it transcribes but does not itself decide which genes to read.

  - slug: u06-exam-q40
    type: fill_blank
    topic_code: "5.1"
    source: "Biology 2e §13.2 Chromosomal Basis of Inherited Disorders"
    points: 1
    prompt: |
      Review. The failure of homologous chromosomes or sister chromatids to separate properly during meiosis, producing gametes with an abnormal number of chromosomes, is called ____.
    answer: ["nondisjunction", "non-disjunction"]
    explanation: |
      Nondisjunction in meiosis I leaves all four gametes abnormal (two n + 1, two n − 1); in meiosis II it affects two of the four. The resulting aneuploid zygotes have altered gene dosage for every gene on the affected chromosome. "Crossing over" is a normal and beneficial event, not an error, and is not accepted.

  - slug: u06-exam-q41
    type: fill_blank
    topic_code: "1.6"
    source: "Biology 2e §3.5 Nucleic Acids"
    points: 1
    prompt: |
      Review. The covalent linkage that joins the 3′ carbon of one nucleotide's sugar to the 5′ phosphate of the next, forming the backbone of DNA and RNA, is the ____ bond.
    answer: ["phosphodiester"]
    explanation: |
      The phosphodiester bond gives strands their 5′ and 3′ ends and therefore their direction; DNA polymerase, RNA polymerase and ligase all form it, restriction enzymes break it, and a dideoxynucleotide blocks it. "Hydrogen" bonds hold the two strands together across the helix but are not part of the backbone, and "peptide" bonds belong to proteins.

  # ---- Numeric (2)
  - slug: u06-exam-q42
    type: numeric
    topic_code: "6.8"
    source: "Biology 2e §17.1 Biotechnology"
    points: 1
    prompt: |
      Starting from a single copy of a target sequence, what is the minimum number of PCR cycles needed to produce at least one million copies, assuming perfect doubling each cycle? Give a whole number.
    answer: { value: 20, tolerance: 0 }
    explanation: |
      Copies after n cycles = 2ⁿ. 2¹⁹ = 524,288, which is short of a million; 2²⁰ = 1,048,576, which exceeds it. So 20 cycles. The logarithmic shortcut: log₂(10⁶) ≈ 19.9, rounded up to the next whole cycle. In practice efficiency falls below 100% in later cycles, so real protocols run 25-35 cycles.

  - slug: u06-exam-q43
    type: numeric
    topic_code: "6.2"
    source: "Biology 2e §14.5 DNA Replication in Eukaryotes"
    points: 1
    prompt: |
      A eukaryotic chromosome of 1.2 × 10⁸ base pairs is replicated from 600 origins spaced evenly along it, each origin producing two forks that move at 50 nucleotides per second. About how many minutes does it take to replicate the chromosome, assuming all origins fire at once? Give your answer to the nearest minute.
    answer: { value: 33, tolerance: 2 }
    explanation: |
      Each origin is responsible for 1.2 × 10⁸ ÷ 600 = 2 × 10⁵ base pairs, shared by its two forks, so each fork copies 1 × 10⁵ base pairs. At 50 per second that is 2,000 s, and 2,000 ÷ 60 ≈ 33 minutes. With a single origin the same chromosome would take 1.2 × 10⁸ ÷ 2 ÷ 50 = 1.2 × 10⁶ s, about two weeks: the calculation that explains why eukaryotes need many origins to fit replication into an S phase of a few hours.

  # ---- Free response
  - slug: u06-exam-q44
    type: short_answer
    topic_code: "6.5"
    source: "Biology 2e §16.2 Prokaryotic Gene Regulation"
    points: 4
    prompt: |
      Conceptual analysis. A newly discovered bacterial operon encodes enzymes that break down the sugar melibiose. Expression is undetectable when melibiose is absent, high when melibiose is present and glucose is absent, and low when both sugars are present. (a) Classify the operon as inducible or repressible and justify your classification. (b) Describe a mechanism, naming the kinds of regulatory molecules involved, that would produce the melibiose-dependent switch. (c) Explain why expression is only low when both sugars are present, and predict the effect of a mutation that makes the cell unable to produce cAMP.
    answer: |
      Inducible: it is off by default and switched on by its substrate, like the lac operon. A repressor protein binds the operator and blocks RNA polymerase; melibiose (or a derivative) acts as the inducer, binding the repressor and releasing it. With glucose present, cAMP is low and CAP cannot help the polymerase, so transcription is weak even though the repressor is off; a cell unable to make cAMP would show only the low level even without glucose.
    explanation: |
      Four points.

      (a) Classify and justify, 1 pt: inducible, because the genes are off in the absence of the sugar and turned on by its presence; the pattern matches a catabolic operon whose substrate induces it (compare lac), not an anabolic one shut off by its product (compare trp).

      (b) Mechanism, 2 pts: 1 pt for a repressor protein bound to an operator near the promoter that physically blocks RNA polymerase when melibiose is absent; 1 pt for melibiose (or a metabolite of it) acting as an inducer that binds the repressor, changes its shape and releases it from the operator so transcription proceeds. Accept an activator-based mechanism (melibiose converts a protein into an activator) if clearly described, but the regulatory protein and the small-molecule signal must both be named.

      (c) Explain and predict, 1 pt: glucose presence keeps cAMP low, so the CAP-cAMP complex does not form and cannot bind the promoter to boost polymerase binding; transcription occurs at only the basal rate. A mutant unable to make cAMP would never activate CAP, so expression would stay at the low level under every condition, even with melibiose present and glucose absent. Both the explanation and the prediction are required.

      Zero: calling the operon repressible; mechanisms in which the sugar binds RNA polymerase or the DNA directly; predictions that the cAMP mutant shows no expression at all (the repressor is still released by melibiose).

  - slug: u06-exam-q45
    type: long_answer
    topic_code: "6.7"
    source: "general knowledge"
    points: 8
    prompt: |
      Interpreting and evaluating experimental results. Researchers measured the rate at which a particular gene acquired loss-of-function mutations in cultured human cells. They compared normal cells with cells lacking a functional mismatch-repair enzyme (MMR−), with and without exposure to ultraviolet (UV) light, and sequenced the mutations found. Each value is the mean of five cultures.

      | Cells | UV exposure | Mutations per 10⁶ cells per generation | Base substitutions (%) | Single-base insertions or deletions (%) | Thymine dimers remaining 24 h after exposure (%) |
      |---|---|---|---|---|---|
      | Normal | None | 2 | 70 | 30 | — |
      | Normal | 10 J/m² | 38 | 92 | 8 | 3 |
      | MMR− | None | 190 | 40 | 60 | — |
      | MMR− | 10 J/m² | 230 | 48 | 52 | 4 |

      (a) Identify the independent and dependent variables.
      (b) Calculate how many times higher the mutation rate is in unexposed MMR− cells than in unexposed normal cells, and describe how UV changed the rate in each cell type.
      (c) Explain, in terms of what mismatch repair does and when it acts, why loss of the enzyme raises the spontaneous mutation rate and why the proportion of insertions and deletions rises in MMR− cells.
      (d) The fraction of thymine dimers remaining after 24 hours is similar in normal and MMR− cells. Explain what this shows about which repair system handles UV damage, and use the substitution percentages to describe what kind of mutation UV mainly causes.
      (e) Predict the consequence for the protein encoded by this gene of the most common mutation type in MMR− cells, and explain why individuals who inherit one non-functional copy of a mismatch-repair gene have a greatly increased lifetime risk of cancer even though their cells start with one working copy.
    answer: |
      IVs: mismatch-repair status and UV exposure; DV: mutation rate (and mutation spectrum). MMR− cells mutate 95 times more often (190 ÷ 2); UV raised the normal rate 19-fold (2 → 38) but the MMR− rate only modestly (190 → 230). Mismatch repair corrects replication errors that escape proofreading, using methylation to identify the new strand; without it, polymerase slips and mispairs persist, and slippage especially produces single-base indels, so their share rises from 30% to 60%. Dimers are removed equally well in both cell types, so UV damage is handled by nucleotide excision repair, not mismatch repair; UV mainly causes base substitutions (92% in exposed normal cells). Single-base indels frameshift, so the usual result is a scrambled, truncated, non-functional protein. A person with one working copy repairs normally until a somatic mutation knocks out the second copy in some cell; that cell's lineage then mutates about a hundred times faster, rapidly accumulating the further mutations in oncogenes and tumour suppressors that drive cancer.
    explanation: |
      Eight points.

      (a) 1 pt: independent variables are mismatch-repair status (normal versus MMR−) and UV exposure (none versus 10 J/m²); dependent variables are the mutation rate per 10⁶ cells per generation and the type of mutation (substitution versus indel percentages). Both independent variables must be named.

      (b) 1 pt: 190 ÷ 2 = 95 times higher (accept 90 to 100); UV raised the normal rate from 2 to 38 (about 19-fold) but the MMR− rate only from 190 to 230 (about 1.2-fold), so UV's effect is large in normal cells and small relative to the already high baseline in MMR− cells. Both the ratio and the comparison are required.

      (c) 2 pts: 1 pt for the function: mismatch repair scans newly replicated DNA for mispaired bases and small loops left by polymerase slippage that escaped proofreading, identifies the new strand (by its lack of methylation or by nicks) and replaces the error; without it those replication errors become permanent mutations in the next round, so the spontaneous rate rises; 1 pt for the spectrum: polymerase slippage at repeated sequences produces single-base insertions and deletions that mismatch repair is especially responsible for correcting, so when it is absent their share of surviving mutations rises (30% to 60%).

      (d) 2 pts: 1 pt for the inference that thymine dimers are removed by a different pathway, nucleotide excision repair, which is intact in MMR− cells, so dimer removal is unaffected by the mismatch-repair defect (3% versus 4% remaining); 1 pt for using the data to say that UV mainly causes base substitutions: in exposed normal cells 92% of mutations are substitutions, up from 70%, consistent with polymerase misreading past dimers, while indels barely change.

      (e) 2 pts: 1 pt for the prediction: single-base insertions or deletions shift the reading frame, so the protein is scrambled downstream of the mutation and usually truncated by a premature stop, giving loss of function; 1 pt for the explanation of inherited risk: cells with one functional copy repair normally, but a somatic mutation (or loss) of the remaining copy in any cell removes repair in that cell's descendants, raising their mutation rate about a hundredfold, so mutations in cell-cycle genes accumulate far faster than normal and cancer arises earlier and more often (a two-hit, loss-of-function mechanism typical of tumour-suppressor genes, including repair genes). Accept reference to Lynch syndrome but do not require it.

      Zero for a part: describing the data without numbers; stating that mismatch repair removes thymine dimers; claiming UV mainly causes frameshifts; predicting that a single-base indel changes one amino acid; explaining inherited risk as "they have the mutation in every cell" without the second-hit reasoning.
