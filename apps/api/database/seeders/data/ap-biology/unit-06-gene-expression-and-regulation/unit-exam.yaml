    points: 1
    prompt: |
      Review. True or false: A polypeptide that begins with a signal sequence is directed, while it is still being translated, to the rough endoplasmic reticulum, where it is threaded into the lumen and can then be processed through the Golgi for secretion or membrane insertion.
