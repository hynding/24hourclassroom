  # ---- Cumulative review, multiple choice (Units 1-5)
  - slug: u06-exam-q23
    type: multiple_choice
    topic_code: "1.7"
    source: "Biology 2e §3.4 Proteins"
    points: 1
    prompt: |
      Review. A missense mutation replaces a glycine with a glutamate in the middle of an α helix that lies in the hydrophobic core of an enzyme. Which prediction about the protein is best supported by the chemistry involved?
    options:
