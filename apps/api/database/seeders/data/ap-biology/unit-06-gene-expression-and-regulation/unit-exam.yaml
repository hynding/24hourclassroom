      - "Two, because linear DNA is cut less efficiently."
      - "Six, because both strands are cut."
    option_explanations:
      - |
        Three fragments from a circle mean three sites; the number of fragments, not the number of cuts, changes with topology.
      - |
        Correct. The three sites that give three pieces of a circle give four pieces of a line, because the circle's piece spanning the join is split into two ends.
      - |
