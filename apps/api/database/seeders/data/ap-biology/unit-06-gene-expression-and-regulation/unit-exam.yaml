    explanation: |
      True. The signal sequence at the N-terminus emerges first from the ribosome and is recognised by a signal-recognition particle that docks the ribosome on the ER membrane; translation continues into the ER lumen, the signal is usually clipped off, and the protein follows the endomembrane route of Unit 2. Proteins without a signal sequence are finished on free ribosomes and stay in the cytosol or are imported into organelles afterwards.

  # ---- Fill in the blank (6)
