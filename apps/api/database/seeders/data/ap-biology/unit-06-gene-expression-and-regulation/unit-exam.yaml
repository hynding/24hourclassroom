unit: 6
description: |
  45 questions · about 60 minutes · every topic of Unit 6 (6.1 to 6.8) with about a fifth cumulative review of
  Units 1 to 5, two data-based stimulus sets, one short free-response item (4 points) and one long free-response
  item (8 points). Multiple choice, select-all, true/false and numeric items are graded at once;
  fill-in-the-blank items are matched automatically; the two free-response items are graded by your teacher
  against the acceptable-answer summary.
questions:
  # ---- Stimulus set A: an expression data set (6.5, 6.6)
  - slug: u06-exam-q01
    type: multiple_choice
    topic_code: "6.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      Researchers measured the mRNA level of four genes (relative units) in cultured fibroblasts, in fibroblasts engineered to express the muscle transcription factor MyoD, in muscle cells, and in fibroblasts treated for 24 hours with a histone deacetylase (HDAC) inhibitor. In fibroblasts the promoter of gene Q is heavily methylated at its CpG island; in muscle it is unmethylated.

      | Gene | Fibroblast | Fibroblast + MyoD | Muscle | Fibroblast + HDAC inhibitor |
      |---|---|---|---|---|
      | Actin (cytoskeleton) | 100 | 104 | 98 | 101 |
      | Myosin heavy chain | 1 | 310 | 420 | 9 |
      | Collagen | 250 | 60 | 2 | 240 |
      | Gene Q | 0 | 0 | 85 | 2 |
    prompt: |
      Which conclusion about the effect of MyoD on fibroblasts is best supported?
    options:
      - "MyoD deleted the collagen gene and inserted the myosin gene."
      - "MyoD switched on the muscle programme (myosin up 310-fold) and switched down the fibroblast programme (collagen down about fourfold) without changing housekeeping expression, showing that cell identity is a pattern of expression that one transcription factor can reset."
      - "MyoD is an enzyme that converts collagen into myosin."
      - "MyoD acts only on gene Q."
    option_explanations:
      - |
        Genes are not gained or lost in differentiation; the fibroblast already had the myosin gene (it rose from 1 to 310 without any DNA being added) and still has the collagen gene (it fell to 60, not to zero).
      - |
        Correct. Actin is unchanged (housekeeping), myosin rises toward the muscle value, collagen falls toward it: a master regulator changing which genes are read in a cell that has all of them.
      - |
        MyoD is a transcription factor; proteins are not converted into one another, and the change measured is in mRNA.
      - |
        Gene Q stayed at 0 with MyoD; the large effects were on myosin and collagen.
    answer: 1
    explanation: |
      Three columns, three readings of one genome. Compare each gene across columns, name the housekeeping gene, and describe the direction of change for the cell-specific ones.

  - slug: u06-exam-q02
    type: multiple_choice
    topic_code: "6.5"
    source: "Biology 2e §16.3 Eukaryotic Epigenetic Gene Regulation"
    points: 1
    stimulus: |
      Researchers measured the mRNA level of four genes (relative units) in cultured fibroblasts, in fibroblasts engineered to express the muscle transcription factor MyoD, in muscle cells, and in fibroblasts treated for 24 hours with a histone deacetylase (HDAC) inhibitor. In fibroblasts the promoter of gene Q is heavily methylated at its CpG island; in muscle it is unmethylated.

      | Gene | Fibroblast | Fibroblast + MyoD | Muscle | Fibroblast + HDAC inhibitor |
      |---|---|---|---|---|
      | Actin (cytoskeleton) | 100 | 104 | 98 | 101 |
      | Myosin heavy chain | 1 | 310 | 420 | 9 |
      | Collagen | 250 | 60 | 2 | 240 |
      | Gene Q | 0 | 0 | 85 | 2 |
    prompt: |
      The HDAC inhibitor raised myosin expression ninefold but left gene Q almost silent. Which explanation is best?
    options:
      - "The HDAC inhibitor degraded the gene Q mRNA."
      - "Keeping histones acetylated opened the chromatin around the myosin gene enough for some transcription, but gene Q's promoter is also silenced by DNA methylation, a separate mark that the inhibitor does not remove."
      - "Gene Q has no promoter in fibroblasts."
      - "The inhibitor works only on genes that are already highly expressed."
    option_explanations:
      - |
        There was no gene Q mRNA to degrade (0 before treatment); the question is why transcription did not start.
      - |
        Correct. Histone acetylation and DNA methylation are independent epigenetic layers; relieving one does not relieve the other, and a methylated CpG island keeps transcription factors off the promoter regardless of histone state.
      - |
        Gene Q is the same gene in every cell and is expressed in muscle (85); its promoter is present but marked.
      - |
        Myosin was at 1 before treatment, not highly expressed; the inhibitor acts on chromatin state, not on prior expression level.
    answer: 1
    explanation: |
      Two locks on one door: histone deacetylation and promoter methylation. A drug that opens one lock leaves a doubly silenced gene closed, which is why combination treatments are used in cancer.

  - slug: u06-exam-q03
    type: multiple_choice
    topic_code: "6.6"
    source: "Biology 2e §16.1 Regulation of Gene Expression"
    points: 1
    stimulus: |
      Researchers measured the mRNA level of four genes (relative units) in cultured fibroblasts, in fibroblasts engineered to express the muscle transcription factor MyoD, in muscle cells, and in fibroblasts treated for 24 hours with a histone deacetylase (HDAC) inhibitor. In fibroblasts the promoter of gene Q is heavily methylated at its CpG island; in muscle it is unmethylated.

      | Gene | Fibroblast | Fibroblast + MyoD | Muscle | Fibroblast + HDAC inhibitor |
      |---|---|---|---|---|
      | Actin (cytoskeleton) | 100 | 104 | 98 | 101 |
      | Myosin heavy chain | 1 | 310 | 420 | 9 |
      | Collagen | 250 | 60 | 2 | 240 |
      | Gene Q | 0 | 0 | 85 | 2 |
    prompt: |
      Which gene is the best choice as a housekeeping control for comparing expression between these samples, and why?
    options:
      - "Myosin, because it shows the largest changes."
      - "Actin, because its expression is nearly constant across all conditions, so differences in the other genes cannot be blamed on differences in RNA recovery between samples."
      - "Collagen, because it is highest in the starting cells."
      - "Gene Q, because it is zero in most samples."
    option_explanations:
      - |
        A control should not change; a gene that varies 400-fold is the experimental variable, not the baseline.
      - |
        Correct. A housekeeping gene expressed at a similar level in every cell type lets you check that each sample was prepared comparably, so that a fall in collagen or a rise in myosin reflects regulation rather than technical loss.
      - |
        Collagen falls from 250 to 2 across the samples; it is a fibroblast-specific gene, exactly what is being measured.
      - |
        A gene that is absent in most samples gives no baseline signal and cannot show whether RNA was recovered.
    answer: 1
    explanation: |
      Every expression comparison needs an internal standard. Housekeeping genes are chosen because their constancy is the point.

  # ---- Stimulus set B: a sequence, a mutation and a test (6.4, 6.7, 6.8)
  - slug: u06-exam-q04
    type: multiple_choice
    topic_code: "6.4"
    source: "Biology 2e §15.1 The Genetic Code"
    points: 1
    stimulus: |
      The first eight codons of the coding strand of the β-globin gene are shown for a healthy person and for a patient, together with a partial codon table. The restriction enzyme MstII cuts the sequence CCTGAGG.

      Healthy: 5′-ATG GTG CAC CTG ACT CCT GAG GAG-3′
      Patient: 5′-ATG GTG CAC CTG ACT CCT GTG GAG-3′

      | mRNA codon | Amino acid |
      |---|---|
      | AUG | Met (start) |
      | GUG, GUA | Val |
      | CAC | His |
      | CUG | Leu |
      | ACU | Thr |
      | CCU | Pro |
      | GAG, GAA | Glu |
      | UAG, UAA | Stop |
    prompt: |
      Which amino-acid sequence does the patient's allele encode for these eight codons?
    options:
      - "Met-Val-His-Leu-Thr-Pro-Glu-Glu"
      - "Met-Val-His-Leu-Thr-Pro-Val-Glu"
      - "Met-Val-His-Leu-Thr-Pro-Stop"
      - "Val-His-Leu-Thr-Pro-Val-Glu-Glu"
    option_explanations:
      - |
        This is the healthy sequence; the patient's seventh codon is GTG (GUG in mRNA), which is valine, not glutamate.
      - |
        Correct. Only the seventh codon differs: GAG → GTG, transcribed as GUG, which the table gives as valine. Every other codon is unchanged.
      - |
        No stop codon appears; GUG is a sense codon for valine. A stop would require UAG or UAA.
      - |
        Methionine from the AUG start codon is the first residue; dropping it misreads the frame from the beginning.
    answer: 1
    explanation: |
      Transcribe (T → U), group in threes from AUG, look up. The sickle-cell mutation is one base, one codon, one residue.

  - slug: u06-exam-q05
    type: multiple_choice
    topic_code: "6.7"
    source: "Biology 2e §14.6 DNA Repair"
    points: 1
    stimulus: |
      The first eight codons of the coding strand of the β-globin gene are shown for a healthy person and for a patient, together with a partial codon table. The restriction enzyme MstII cuts the sequence CCTGAGG.

      Healthy: 5′-ATG GTG CAC CTG ACT CCT GAG GAG-3′
      Patient: 5′-ATG GTG CAC CTG ACT CCT GTG GAG-3′

      | mRNA codon | Amino acid |
      |---|---|
      | AUG | Met (start) |
      | GUG, GUA | Val |
      | CAC | His |
      | CUG | Leu |
      | ACU | Thr |
      | CCU | Pro |
      | GAG, GAA | Glu |
      | UAG, UAA | Stop |
    prompt: |
      How should the patient's mutation be classified, and why is its effect on the protein large despite its size?
    options:
      - "A frameshift; one base was deleted, scrambling the rest of the chain."
      - "A silent substitution; the third base of a codon changed."
      - "A missense substitution (an A-to-T transversion) that replaces a charged glutamate with a nonpolar valine on the protein surface, creating a hydrophobic patch that makes deoxygenated haemoglobin molecules stick together."
      - "A nonsense substitution that truncates the chain after proline."
    option_explanations:
      - |
        Both alleles have the same number of bases; a base was changed, not removed, so the frame is intact.
      - |
        The change is in the second base of the codon (GAG → GTG), and it does change the amino acid; a silent change would leave the residue the same.
      - |
        Correct. A purine (A) replaced by a pyrimidine (T) is a transversion; the result swaps a negatively charged R group for a hydrophobic one, and because that residue lies on the surface, the protein's interactions with other haemoglobin molecules change.
      - |
        GUG is a sense codon; no stop is created and the chain continues to its normal length.
    answer: 2
    explanation: |
      The effect of a missense mutation depends on the chemistry of the swap and where it falls. One residue in about 600 is enough when it changes a surface charge.

  - slug: u06-exam-q06
    type: multiple_choice
    topic_code: "6.8"
    source: "Biology 2e §17.2 Mapping Genomes"
    points: 1
    stimulus: |
      The first eight codons of the coding strand of the β-globin gene are shown for a healthy person and for a patient, together with a partial codon table. The restriction enzyme MstII cuts the sequence CCTGAGG.

      Healthy: 5′-ATG GTG CAC CTG ACT CCT GAG GAG-3′
      Patient: 5′-ATG GTG CAC CTG ACT CCT GTG GAG-3′

      | mRNA codon | Amino acid |
      |---|---|
      | AUG | Met (start) |
      | GUG, GUA | Val |
      | CAC | His |
      | CUG | Leu |
      | ACU | Thr |
      | CCU | Pro |
      | GAG, GAA | Glu |
      | UAG, UAA | Stop |
    prompt: |
      A 500-base-pair region spanning this site is amplified by PCR from each person and digested with MstII; the healthy allele is cut 200 base pairs from one end. Which gel result is predicted?
    options:
      - "Healthy: one band at 500 bp; patient: bands at 200 and 300 bp."
      - "Healthy: bands at 200 and 300 bp; patient: one band at 500 bp, because the mutation changes CCTGAGG to CCTGTGG and destroys the recognition site."
      - "Both: bands at 200 and 300 bp, because the enzyme recognises the protein, not the DNA."
      - "Both: one band at 500 bp, because PCR products cannot be cut."
    option_explanations:
      - |
        The assignment is reversed: it is the healthy allele that contains the intact site and is cut.
      - |
        Correct. The healthy sequence CCT GAG G contains the site and gives two fragments; the patient's CCT GTG G does not match, so the product stays whole. A heterozygous carrier would show all three bands.
      - |
        Restriction enzymes recognise DNA sequences; the protein is never involved, and the patient's site is destroyed.
      - |
        A PCR product is ordinary double-stranded DNA and is cut wherever its sequence contains the site.
    answer: 1
    explanation: |
      A mutation that happens to fall in a restriction site can be read directly from a gel: this RFLP was one of the first DNA-based diagnostic tests.

  # ---- DNA and RNA structure (6.1)
  - slug: u06-exam-q07
    type: multiple_choice
    topic_code: "6.1"
    source: "Biology 2e §14.1 Historical Basis of Modern Understanding"
    points: 1
    prompt: |
      Suppose Hershey and Chase had labelled phage with ³⁵S only and found radioactivity in the supernatant but none in the bacterial pellet. Which conclusion would that single result justify on its own?
    options:
      - "DNA is the hereditary material."
      - "Protein does not enter the host cell, so protein is unlikely to be the material that directs phage production; a separate label is needed to show what does enter."
      - "Both DNA and protein enter the host."
      - "Phage do not infect bacteria."
    option_explanations:
      - |
        A sulfur label says nothing about DNA, which contains no sulfur; the positive conclusion about DNA required the ³²P experiment.
      - |
        Correct. The sulfur experiment alone rules protein out as what enters; it is the phosphorus experiment that rules DNA in. Each label answers one question.
      - |
        The result shows protein stayed outside, which argues against protein entering.
      - |
        New phage were produced from the pellet cells, so infection occurred; the question is what went in.
    answer: 1
    explanation: |
      Experimental logic: ruling out one candidate is not the same as confirming the other. Good answers say exactly what each half of the experiment showed.

  - slug: u06-exam-q08
    type: multiple_choice
    topic_code: "6.1"
    source: "Biology 2e §14.2 DNA Structure and Sequencing"
    points: 1
    prompt: |
      A bacterial cell and a human cell each contain about 2 pg of DNA in a particular comparison. Which statement correctly contrasts how the two package it?
    options:
      - "The bacterium wraps its DNA around histones in a nucleus; the human cell supercoils a circular chromosome in a nucleoid."
      - "The bacterium supercoils one circular chromosome in a nucleoid, often with plasmids alongside; the human cell coils linear chromosomes around histones into nucleosomes and higher-order fibres inside a nucleus."
      - "Both use nucleosomes, but only the human cell has plasmids."
      - "Neither packages its DNA; it floats free in the cytoplasm."
    option_explanations:
      - |
        The arrangements are swapped: histones and the nucleus are eukaryotic, the nucleoid and supercoiling prokaryotic.
      - |
        Correct. Two solutions to the same problem: supercoiling with gyrase for a circle, histone coiling for linear chromosomes that must fit a nucleus and be regulated by chromatin state.
      - |
        Bacteria do not have nucleosomes, and plasmids are a prokaryotic feature, not a human one.
      - |
        Both compact their DNA by orders of magnitude; unpackaged DNA would not fit the cell.
    answer: 1
    explanation: |
      Prokaryote versus eukaryote genome organisation is a two-column table worth memorising: shape, location, packaging, extras.

  # ---- Replication (6.2)
  - slug: u06-exam-q09
    type: multiple_choice
    topic_code: "6.2"
    source: "Biology 2e §14.3 Basics of DNA Replication"
    points: 1
    prompt: |
      E. coli grown in ¹⁵N for many generations is moved to ¹⁴N medium and allowed to divide three times. Which banding pattern does semiconservative replication predict in a density gradient?
    options:
      - "25% heavy, 75% light"
      - "25% intermediate, 75% light"
      - "50% intermediate, 50% light"
      - "100% light"
    option_explanations:
      - |
        No heavy band can exist after the first generation in light medium, because every original heavy strand is now paired with a light one.
      - |
        Correct. The two original heavy strands remain, each in a hybrid helix, among 8 helices in total: 2 of 8 intermediate (25%) and 6 of 8 light (75%).
      - |
        Half and half is the generation-2 pattern; one more round of replication halves the intermediate share again.
      - |
        The original heavy strands are never diluted away; they persist in two hybrid helices no matter how many generations pass.
    answer: 1
    explanation: |
      Track the two parental strands: they are conserved forever, each in one hybrid helix, while the total number of helices doubles each generation. Intermediate share = 2 ÷ 2ⁿ.

  - slug: u06-exam-q10
    type: multiple_choice
    topic_code: "6.2"
    source: "Biology 2e §14.4 DNA Replication in Prokaryotes"
    points: 1
    prompt: |
      A drug blocks the activity of primase. Which effect on DNA replication is predicted?
    options:
      - "Replication proceeds normally, because DNA polymerase can start strands on its own."
      - "No new strands can be started, so neither the leading nor the lagging strand is synthesised, although helicase can still unwind the origin."
      - "Only the leading strand is affected, because the lagging strand does not use primers."
      - "Only RNA primers already laid down are removed."
    option_explanations:
      - |
        No DNA polymerase can begin a chain without a 3′-OH; that is the whole reason primase exists.
      - |
        Correct. Both strands begin from RNA primers (one for the leading strand, one per Okazaki fragment); without primase the polymerase has nothing to extend, so synthesis never starts even though the helix opens.
      - |
        The lagging strand depends on primers far more than the leading strand, since every fragment needs one.
      - |
        Primer removal is the job of DNA polymerase I; blocking primase prevents primers being made, not removed.
    answer: 1
    explanation: |
      Loss-of-function questions test whether you know what each enzyme is for. Primase answers the question "where does the first 3′-OH come from?"

  # ---- Transcription and processing (6.3)
  - slug: u06-exam-q11
    type: multiple_choice
    topic_code: "6.3"
    source: "Biology 2e §15.2 Prokaryotic Transcription"
    points: 1
    prompt: |
      The template strand of a gene reads 3′-TAC GGT CAT-5′. Which is the mRNA?
    options:
      - "5′-AUG CCA GUA-3′"
      - "5′-UAC GGU CAU-3′"
      - "3′-AUG CCA GUA-5′"
      - "5′-ATG CCA GTA-3′"
    option_explanations:
      - |
        Correct. Pair each template base with its RNA complement (T→A, A→U, C→G, G→C) and the product runs antiparallel, 5′ → 3′: AUG CCA GUA.
      - |
        This copies the template's letters with U for T; the mRNA must be complementary to the template, not identical to it.
      - |
        The bases are right but the ends are mislabelled; RNA is made and written 5′ → 3′, and the first codon must be the one that pairs with the template's 3′ end.
      - |
        RNA contains uracil, never thymine; a sequence with T is DNA (here the coding strand).
    answer: 0
    explanation: |
      Given the template, complement and keep the ends antiparallel. Given the coding strand, copy with U for T. Know which strand you have been given.

  - slug: u06-exam-q12
    type: multiple_choice
    topic_code: "6.3"
    source: "Biology 2e §15.4 RNA Processing in Eukaryotes"
    points: 1
    prompt: |
      A eukaryotic gene is 12,000 base pairs long, but its mature mRNA is only 2,400 nucleotides. Which explanation accounts for most of the difference?
    options:
      - "The 5′ cap and poly-A tail remove 9,600 nucleotides."
      - "Introns, which make up most of the primary transcript, are removed by the spliceosome in the nucleus, leaving the exons joined together."
      - "The ribosome trims the mRNA as it translates."
      - "Only one strand of the gene is transcribed, halving its length."
    option_explanations:
      - |
        The cap adds one modified nucleotide and the tail adds about 200; both lengthen rather than shorten the transcript.
      - |
        Correct. Most human genes are mostly intron; splicing excises those segments precisely, and the mature mRNA carries only the exons (plus cap, tail and untranslated regions).
      - |
        Ribosomes read the mRNA; they do not cut it, and translation happens after the mRNA is already mature.
      - |
        Transcribing one strand produces a transcript as long as the gene, not half as long; length in nucleotides equals length in base pairs.
    answer: 1
    explanation: |
      Gene length and mRNA length differ by the introns. The same fact explains why cDNA, not genomic DNA, is used to express eukaryotic genes in bacteria.

  # ---- Translation (6.4)
  - slug: u06-exam-q13
    type: multiple_choice
    topic_code: "6.4"
    source: "Biology 2e §15.5 Ribosomes and Protein Synthesis"
    points: 1
    prompt: |
      During one elongation cycle, which event occurs in the ribosome's P site?
    options:
      - "A new aminoacyl-tRNA enters and its anticodon is checked against the codon."
      - "The tRNA holding the growing polypeptide hands the chain to the amino acid on the tRNA in the A site, through a peptide bond formed by rRNA."
      - "An empty tRNA leaves the ribosome."
      - "The mRNA is cleaved at the stop codon."
    option_explanations:
      - |
        Entry and codon-anticodon checking take place in the A (aminoacyl) site.
      - |
        Correct. The P (peptidyl) site holds the tRNA attached to the chain; peptidyl transferase, an rRNA activity, joins that chain's carboxyl end to the amino group of the A-site amino acid, after which the ribosome translocates.
      - |
        Departure of the deacylated tRNA happens from the E (exit) site after translocation.
      - |
        The mRNA is not cleaved during translation; at a stop codon a release factor frees the polypeptide and the ribosome dissociates.
    answer: 1
    explanation: |
      A for arrival, P for the peptide chain, E for exit. The chain moves from the P-site tRNA to the A-site amino acid, which is why the polypeptide grows N → C.

  - slug: u06-exam-q14
    type: multiple_choice
    topic_code: "6.4"
    source: "Biology 2e §15.5 Ribosomes and Protein Synthesis"
    points: 1
    prompt: |
      Erythromycin binds the 50S subunit of bacterial ribosomes and stops translation, yet it does not harm human cells at therapeutic doses. Which explanation is best?
    options:
      - "Human cells do not translate mRNA."
      - "Human cytoplasmic ribosomes are 80S, built from 40S and 60S subunits whose rRNA and proteins differ enough from the bacterial 70S ribosome that the drug does not bind them effectively."
      - "Humans metabolise the drug before it reaches the ribosome."
      - "Human ribosomes use a different genetic code."
    option_explanations:
      - |
        Human cells translate constantly; the drug's selectivity comes from structural differences in the machinery, not from its absence.
      - |
        Correct. The two ribosome types perform the same job with the same code but differ in structure, and antibiotics exploit the differences; mitochondrial ribosomes, which resemble bacterial ones, account for some side effects.
      - |
        The drug circulates and reaches human cells; selectivity is at the level of binding, not clearance.
      - |
        The code is nearly universal; what differs is the ribosome, not the codon assignments.
    answer: 1
    explanation: |
      70S versus 80S is not trivia: it is the basis of a large class of antibiotics and evidence of the prokaryote-eukaryote split.

  # ---- Regulation (6.5)
  - slug: u06-exam-q15
    type: multiple_choice
    topic_code: "6.5"
    source: "Biology 2e §16.2 Prokaryotic Gene Regulation"
    points: 1
    prompt: |
      E. coli is grown with lactose present and glucose absent. Which combination of regulatory states describes the lac operon, and what level of transcription results?
    options:
      - "Repressor bound to the operator, CAP-cAMP absent; no transcription."
      - "Repressor released by allolactose, CAP-cAMP bound beside the promoter; high transcription."
      - "Repressor released, CAP inactive because cAMP is low; low transcription."
      - "Repressor bound, CAP-cAMP bound; moderate transcription."
    option_explanations:
      - |
        With lactose present the repressor is inactivated; it cannot remain on the operator.
      - |
        Correct. Lactose removes the negative control and the absence of glucose raises cAMP so that CAP adds positive control; both conditions for full expression are met.
      - |
        cAMP is high when glucose is absent, so CAP is active; the low-transcription state belongs to glucose-present, lactose-present.
      - |
        A bound repressor blocks the polymerase regardless of CAP, so transcription would be off, and in any case lactose releases the repressor.
    answer: 1
    explanation: |
      Two independent inputs: lactose decides whether the repressor is on the DNA, glucose decides whether CAP is. Only one of the four combinations is "high".

  - slug: u06-exam-q16
    type: multiple_choice
    topic_code: "6.5"
    source: "Biology 2e §16.5 Eukaryotic Post-transcriptional Gene Regulation"
    points: 1
    prompt: |
      In an experiment, the transcription rate of gene R, its mRNA level and its protein level were each measured after a treatment. Transcription rate was unchanged, mRNA fell to 20% of control and protein fell to 15%. At which level is the treatment acting?
    options:
      - "Epigenetic, by methylating the promoter."
      - "Transcriptional, by removing an activator from the enhancer."
      - "Post-transcriptional, by reducing mRNA stability or by RNA interference."
      - "Post-translational, by targeting the protein to the proteasome."
    option_explanations:
      - |
        Promoter methylation would reduce transcription, which was measured and found unchanged.
      - |
        Removing an activator also acts on transcription rate, which did not change.
      - |
        Correct. The gene is transcribed normally but the mRNA does not accumulate; something is degrading or silencing the message after it is made, and protein falls as a consequence.
      - |
        Proteasome targeting would reduce protein while leaving mRNA at the control level; here mRNA fell first.
    answer: 2
    explanation: |
      Three measurements locate the control point: find the first level at which the number departs from control.

  # ---- Specialisation (6.6)
  - slug: u06-exam-q17
    type: multiple_choice
    topic_code: "6.6"
    source: "Biology 2e §9.2 Propagation of the Signal"
    points: 1
    prompt: |
      A developing embryo's cells receive a secreted protein signal from a neighbouring tissue, after which they begin expressing a set of genes they had not expressed before. Which description of the chain of events is most complete?
    options:
      - "The signal enters the nucleus and is transcribed."
      - "The signal binds a surface receptor; a transduction cascade activates a transcription factor, which binds enhancers of target genes, some of which encode further transcription factors, committing the cells to a new fate."
      - "The signal mutates the cells' DNA, creating the new genes."
      - "The signal is translated by the cells' ribosomes into the new proteins."
    option_explanations:
      - |
        A protein signal is not a nucleic acid and is not transcribed; it acts through a receptor.
      - |
        Correct. Induction in development is signalling (Unit 4) ending at gene regulation (Unit 6), and because targets include other transcription factors, one signal can start a cascade that specifies a cell type.
      - |
        No DNA sequence changes in development; the genes were present, silent, and are now switched on.
      - |
        Ribosomes translate mRNA, not external proteins; the new proteins come from newly transcribed genes.
    answer: 1
    explanation: |
      Signal → receptor → cascade → transcription factor → genes → more transcription factors. The cascade is what makes differentiation progressive and stable.

  # ---- Mutations (6.7)
  - slug: u06-exam-q18
    type: multiple_choice
    topic_code: "6.7"
    source: "Biology 2e §15.1 The Genetic Code"
    points: 1
    prompt: |
      Four mutations occur in a 600-codon gene. Rank them from most to least likely to abolish the protein's function.
    options:
      - "Silent at codon 10 > missense at codon 300 > single-base deletion at codon 20 > nonsense at codon 590"
      - "Single-base deletion at codon 20 > nonsense at codon 590 > conservative missense at codon 300 > silent at codon 10"
      - "Nonsense at codon 590 > silent at codon 10 > missense at codon 300 > deletion at codon 20"
      - "All four are equally damaging, because every mutation changes the protein."
    option_explanations:
      - |
        A silent mutation changes nothing and belongs last, and an early frameshift is far more damaging than a late stop.
      - |
        Correct. An early frameshift scrambles 97% of the protein; a stop at codon 590 loses only the last 10 residues; a conservative substitution usually preserves the fold; a silent change leaves the sequence identical.
      - |
        The order is inverted: a late nonsense change is mild and an early frameshift severe, and silent changes do no harm to the protein.
      - |
        Mutations differ enormously in effect; a silent change alters no amino acid at all.
    answer: 1
    explanation: |
      Two questions decide severity: how much of the protein is changed (position for frameshifts and stops) and how different the new residue is (chemistry for missense).

