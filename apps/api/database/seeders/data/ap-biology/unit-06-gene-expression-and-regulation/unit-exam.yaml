  # ---- Biotechnology (6.8)
  - slug: u06-exam-q20
    type: multiple_choice
    topic_code: "6.8"
    source: "Biology 2e §17.1 Biotechnology"
    points: 1
    prompt: |
      A circular plasmid of 5,000 base pairs is cut with an enzyme and gives bands of 3,000, 1,500 and 500 base pairs. The same plasmid, if it were linear, would give how many fragments with the same enzyme, and why?
    options:
      - "Three, because the enzyme cuts the same number of times."
