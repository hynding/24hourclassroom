  # ---- True/false (5)
  - slug: u06-exam-q31
    type: true_false
    topic_code: "6.2"
    source: "Biology 2e §14.4 DNA Replication in Prokaryotes"
    points: 1
    prompt: |
      True or false: Both the leading and the lagging strand are synthesised in the 5′ to 3′ direction; they differ in whether synthesis is continuous or in fragments.
    answer: true
    explanation: |
      True. Every DNA polymerase adds nucleotides only to a free 3′-OH, so every new strand grows 5′ → 3′. On the template running 3′ → 5′ into the fork that direction follows the fork (continuous, leading); on the other template it points away from the fork, so synthesis must restart repeatedly as new template is exposed (Okazaki fragments, lagging). The direction never changes; only the geometry does.

  - slug: u06-exam-q32
    type: true_false
    topic_code: "6.5"
    source: "Biology 2e §16.3 Eukaryotic Epigenetic Gene Regulation"
    points: 1
    prompt: |
      True or false: Methylation of cytosines in a gene's promoter region generally silences the gene, and because the methylation pattern is copied when DNA replicates, the silenced state can be passed to daughter cells without any change in the DNA sequence.
    answer: true
    explanation: |
      True. This is the definition of an epigenetic mark: heritable through cell division, affecting expression, leaving the sequence intact. Methylated CpG islands exclude transcription factors and recruit proteins that condense chromatin. The pattern is reinstated on the new strand after replication, so a differentiated cell's descendants keep its silenced genes silenced. In cancer, tumour-suppressor genes are often silenced this way rather than mutated, and demethylating drugs can reactivate them.

  - slug: u06-exam-q33
    type: true_false
    topic_code: "6.8"
    source: "Biology 2e §17.1 Biotechnology"
    points: 1
    prompt: |
      True or false: PCR requires helicase to separate the template strands at the start of each cycle.
    answer: false
    explanation: |
      False. PCR separates the strands with heat (about 95 °C), which breaks the hydrogen bonds between bases without any enzyme; that is why a heat-stable polymerase such as Taq is needed, since an ordinary polymerase would be denatured at that temperature. Primers replace primase, and no ligase, topoisomerase or single-strand binding proteins are needed because the reaction copies a short region from two primers rather than a whole genome.

  - slug: u06-exam-q34
    type: true_false
    topic_code: "6.7"
    source: "Biology 2e §14.6 DNA Repair"
    points: 1
    prompt: |
      True or false: A silent mutation changes the DNA sequence of a gene but not the amino-acid sequence of its protein, because the genetic code is degenerate.
    answer: true
    explanation: |
      True. Most amino acids are specified by several codons that usually differ in the third base; a substitution that converts one such codon into another synonymous codon leaves the protein unchanged. The DNA is mutated, and the change can be detected by sequencing or sometimes as an RFLP, but the phenotype at the protein level is unaffected. The exception to remember: a silent change can still alter splicing signals or mRNA stability.

