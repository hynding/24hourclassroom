week: 20
unit: 6
title: Regulation of Gene Expression and Cell Specialization
topics: ["6.5", "6.6"]
guide: guides/week-20.md
guide_description: |
  How cells decide which genes to read and how much: the lac and trp operons as the bacterial model (with the
  four-state glucose/lactose table), then the eukaryotic layers of control from chromatin (histone acetylation,
  DNA methylation) through transcription factors and enhancers to RNA interference, mRNA stability and protein
  turnover; and how differential expression of one genome makes two hundred cell types. Three worked examples
  (an operon mutant table, an expression-level comparison, an epigenetics data set), misconceptions, self-check.
flashcards_description: |
  34 cards: operons and their states, the eukaryotic levels of regulation, epigenetic marks, enhancers and transcription factors, RNAi, and the logic of cell specialisation.

flashcards:
  - front: Why do cells regulate gene expression? → the two reasons
    back: |
      Economy: transcription and translation cost ATP and building blocks, so making an unneeded protein is waste. Specialisation: in a multicellular organism every cell has the same genome, and expressing only part of it is what makes a neuron different from a liver cell.
    topic_code: "6.5"
  - front: Operon → the three parts
    back: |
      A promoter (where RNA polymerase binds), an operator (a short sequence where a repressor can bind, overlapping or next to the promoter) and the structural genes transcribed together as one polycistronic mRNA.
    topic_code: "6.5"
  - front: lac operon → how it is switched on
    back: |
      Normally the lac repressor sits on the operator and blocks transcription. When lactose is present, allolactose (the inducer) binds the repressor, changing its shape so it falls off, and the genes for using lactose are transcribed. An inducible operon.
    topic_code: "6.5"
  - front: lac operon → the four glucose/lactose states
    back: |
      Glucose present, lactose absent: off. Glucose present, lactose present: low (repressor off, but no CAP help). Glucose absent, lactose absent: off (repressor on). Glucose absent, lactose present: high (repressor off and CAP-cAMP on).
    hint: Lactose controls the repressor; glucose controls CAP.
    topic_code: "6.5"
  - front: CAP and cAMP → positive control of the lac operon
    back: |
      When glucose is scarce, cAMP rises and binds the catabolite activator protein; CAP-cAMP binds next to the promoter and helps RNA polymerase attach. With glucose present cAMP is low and the operon is transcribed only weakly even if lactose is there.
    topic_code: "6.5"
  - front: trp operon → how it is switched off
    back: |
      The trp repressor is inactive on its own. When tryptophan is plentiful, two tryptophan molecules bind it (corepressor), activating it to bind the operator and block transcription of the tryptophan-synthesis genes. A repressible operon and an example of negative feedback.
    topic_code: "6.5"
  - front: Inducible vs repressible operon
    back: |
      Inducible (lac): usually off, switched on by a small molecule that inactivates the repressor; typical of catabolic pathways. Repressible (trp): usually on, switched off by a small molecule that activates the repressor; typical of anabolic pathways.
    topic_code: "6.5"
  - front: Negative vs positive regulation of transcription
    back: |
      Negative: a repressor protein bound to DNA blocks transcription (lac and trp repressors). Positive: an activator protein bound to DNA increases transcription (CAP-cAMP in bacteria; activators on enhancers in eukaryotes).
    topic_code: "6.5"
  - front: The five levels at which a eukaryotic gene can be regulated
    back: |
      Epigenetic (chromatin packing), transcriptional (transcription factors, enhancers), post-transcriptional (splicing, mRNA stability, RNAi), translational (initiation factors) and post-translational (modification, ubiquitin-tagged degradation).
    topic_code: "6.5"
  - front: Why do bacteria regulate mostly at the transcriptional step?
    back: |
      With no nucleus, transcription and translation are coupled and mRNAs last only seconds, so stopping transcription stops protein production almost at once. There is no processing or export stage to control.
    topic_code: "6.5"
  - front: Epigenetics → definition
    back: |
      Heritable changes in gene expression that do not change the DNA sequence: chemical marks on histones or on DNA that alter how tightly chromatin is packed and so whether a gene can be transcribed. Reversible, but passed on through cell divisions.
    topic_code: "6.5"
  - front: Histone acetylation → effect on transcription
    back: |
      Adding acetyl groups to lysines on histone tails removes their positive charge, weakens their grip on the negatively charged DNA, loosens the nucleosome and opens the gene for transcription. Deacetylation (HDACs) does the reverse.
    topic_code: "6.5"
  - front: DNA methylation → effect on transcription
    back: |
      Methyl groups added to cytosines in CpG islands near a promoter usually silence the gene, by blocking transcription factor binding and recruiting proteins that compact chromatin. Methylation patterns are copied at replication, so silencing is inherited by daughter cells.
    topic_code: "6.5"
  - front: Chromatin remodelling → what moves and why it matters
    back: |
      Nucleosomes can be slid along the DNA, loosened or removed by remodelling complexes, exposing or hiding promoters. A promoter buried in a nucleosome cannot be bound by transcription factors or RNA polymerase.
    topic_code: "6.5"
  - front: General vs specific transcription factors
    back: |
      General (basal) factors bind the core promoter (TATA box) and are needed by every Pol II gene. Specific factors bind enhancers or promoter-proximal elements of particular genes and respond to signals, raising (activators) or lowering (repressors) transcription.
    topic_code: "6.5"
  - front: Enhancer → what it is and how it works at a distance
    back: |
      A DNA sequence, often thousands of bases from the gene (upstream, downstream or in an intron), that binds activator proteins. DNA-bending proteins loop the DNA so the activators contact mediator proteins and the general factors at the promoter, raising the rate of initiation.
    topic_code: "6.5"
  - front: Silencer and repressor → eukaryotic negative control
    back: |
      A silencer is a DNA element that binds a repressor protein; the repressor blocks activators, recruits histone deacetylases or interferes with the pre-initiation complex, lowering transcription.
    topic_code: "6.5"
  - front: Cis-acting vs trans-acting elements
    back: |
      Cis: DNA sequences on the same molecule as the gene they control (promoter, operator, enhancer, silencer). Trans: diffusible molecules, usually proteins such as transcription factors and repressors, that can act on any copy of the sequence.
    topic_code: "6.5"
  - front: RNA interference → miRNA, Dicer and RISC
    back: |
      Short RNAs (about 21-24 nucleotides) are cut from hairpin precursors by Dicer and loaded into the RNA-induced silencing complex. RISC pairs the small RNA with a complementary mRNA and either cleaves it or blocks its translation, lowering protein output without touching the gene.
    topic_code: "6.5"
  - front: Untranslated regions (5′ and 3′ UTR) → their role in regulation
    back: |
      Sequences in the mRNA before the start codon and after the stop codon that are not translated. RNA-binding proteins and miRNAs recognise them to control where the mRNA goes, how long it lasts and how readily it is translated.
    topic_code: "6.5"
  - front: Control of translation initiation → eIF-2
    back: |
      Eukaryotic initiation factor 2 brings the first tRNA to the small subunit using GTP. When eIF-2 is phosphorylated it cannot bind GTP, initiation fails and protein synthesis slows globally, a fast response to stress or starvation.
    topic_code: "6.5"
  - front: Ubiquitin and the proteasome → post-translational control
    back: |
      Attaching a chain of ubiquitin molecules tags a protein for destruction; the proteasome unfolds and digests it. Controlling how long a protein survives is a way of controlling how much of it is active, as with cyclins in the cell cycle.
    topic_code: "6.5"
  - front: Post-translational modification as regulation
    back: |
      Adding or removing phosphate, acetyl, methyl or sugar groups changes a finished protein's activity, location or partners within seconds, far faster than making new protein. Phosphorylation by kinases is the commonest switch.
    topic_code: "6.5"
  - front: Differential gene expression → the basis of cell specialisation
    back: |
      Every nucleated cell of an organism carries the same genome; cell types differ because they transcribe different subsets of it. Specialisation is a pattern of expression, not a loss of genes.
    topic_code: "6.6"
  - front: Housekeeping genes vs cell-specific genes
    back: |
      Housekeeping genes (glycolytic enzymes, ribosomal proteins, actin) are expressed in essentially all cells. Cell-specific genes (haemoglobin in red cell precursors, insulin in beta cells, myosin in muscle) are expressed in a few cell types and define them.
    topic_code: "6.6"
  - front: Master regulatory gene → what it does in development
    back: |
      A transcription factor that switches on a whole programme of cell-type genes, including other transcription factors. MyoD, for example, can convert a fibroblast into a muscle cell by turning on muscle genes in cascade.
    topic_code: "6.6"
  - front: Transcription factor cascade → how timing and sequence are achieved in development
    back: |
      One signal induces a transcription factor, whose targets include the next transcription factors, and so on. Each step restricts the cell's options, so cells become determined (committed) before they visibly differentiate.
    topic_code: "6.6"
  - front: Evidence that differentiated cells keep the whole genome
    back: |
      A nucleus from a differentiated frog intestinal cell, placed in an enucleated egg, could direct development of a whole tadpole; cloning by nuclear transfer (Dolly) and reprogramming to stem cells show the same. Genes are silenced, not deleted.
    topic_code: "6.6"
  - front: Genomic imprinting → an inherited epigenetic mark
    back: |
      For some genes only the copy from one parent is expressed; the other is methylated and silenced in the germ line. The mark survives fertilisation and cell division, so expression depends on parent of origin, not sequence.
    topic_code: "6.6"
  - front: How does a signalling molecule change which genes a cell expresses?
    back: |
      Steroid hormones diffuse in and bind receptors that are themselves transcription factors. Water-soluble signals bind surface receptors and set off kinase cascades that end by phosphorylating transcription factors, which then enter the nucleus and bind enhancers.
    topic_code: "6.6"
  - front: How is gene expression measured and compared between cells?
    back: |
      By counting each gene's mRNA (microarray or RNA sequencing) or its protein (western blot, fluorescent reporter). Expression is usually reported relative to a control sample, so a 16-fold difference means sixteen times as much transcript.
    topic_code: "6.6"
  - front: Environmental control of gene expression → examples
    back: |
      Lactose switches on the lac operon; heat shock turns on chaperone genes; temperature controls pigment enzymes in Himalayan rabbits and Siamese cats; low oxygen induces erythropoietin. Phenotype is genotype read in a context.
    topic_code: "6.6"
  - front: Epigenetic changes in cancer → why they are a drug target
    back: |
      Tumour suppressor genes are often silenced by promoter methylation and histone deacetylation rather than by mutation. Because the marks are reversible, inhibitors of DNA methyltransferases and histone deacetylases can reactivate the genes.
    topic_code: "6.5"
  - front: Reporter gene → how it reveals when and where a gene is expressed
    back: |
      A gene's regulatory DNA is joined to a gene whose product is easy to see (GFP, β-galactosidase). Wherever the reporter appears, the original promoter and enhancers are active, so deleting parts of them maps which element drives which tissue.
    topic_code: "6.6"

quiz:
  description: |
    24 questions · about 30 minutes · about 70% this week (operons, eukaryotic levels of control, epigenetics,
    cell specialisation) and 30% review of cellular respiration (Unit 3), cell signalling and feedback (Unit 4)
    and environmental effects on phenotype (Unit 5). Multiple choice, select-all, true/false and numeric items are
    graded at once; the fill-in-the-blank items are matched automatically; the two short answers and the long
    answer are graded by your teacher against the acceptable-answer summary.
  questions:
    - slug: u06-w20-q01
      type: multiple_choice
      topic_code: "6.5"
      source: "Biology 2e §16.2 Prokaryotic Gene Regulation"
      points: 1
      stimulus: |
        The activity of β-galactosidase, an enzyme encoded by the lac operon, was measured in three E. coli strains grown under four conditions. Values are relative units; the wild type under the best condition is set to 100.

        | Strain | Glucose +, lactose − | Glucose +, lactose + | Glucose −, lactose − | Glucose −, lactose + |
        |---|---|---|---|---|
        | Wild type | 1 | 8 | 1 | 100 |
        | Mutant X | 8 | 8 | 100 | 100 |
        | Mutant Y | 1 | 7 | 1 | 9 |
      prompt: |
        Which statement best explains the wild-type pattern?
      options:
        - "Lactose alone fully activates the operon; glucose has no effect."
        - "Lactose inactivates the lac repressor, and the absence of glucose raises cAMP so that CAP can help RNA polymerase; both are needed for high expression."
        - "Glucose activates the lac repressor directly, and lactose is a corepressor."
        - "The operon is constitutive, and the differences reflect how fast the cells grow."
      option_explanations:
        - |
          With lactose present but glucose also present, expression is only 8, not 100; glucose clearly matters.
        - |
          Correct. Lactose (as allolactose) removes negative control; low glucose, through cAMP and CAP, adds positive control. High expression requires the repressor off and CAP on, which is only the fourth column.
        - |
          Glucose acts through cAMP and CAP, not through the repressor, and lactose is the inducer that removes the repressor, the opposite of a corepressor.
        - |
          A hundredfold difference between conditions is regulation, not a growth artefact; a constitutive operon would show similar values in every column.
      answer: 1
      explanation: |
        Two switches, one gene set: the repressor answers the question "is lactose here?" and CAP answers "is there anything better?". Learn the four-state table as the two answers combined.

    - slug: u06-w20-q02
      type: multiple_choice
      topic_code: "6.5"
      source: "Biology 2e §16.2 Prokaryotic Gene Regulation"
      points: 1
      stimulus: |
        The activity of β-galactosidase, an enzyme encoded by the lac operon, was measured in three E. coli strains grown under four conditions. Values are relative units; the wild type under the best condition is set to 100.

        | Strain | Glucose +, lactose − | Glucose +, lactose + | Glucose −, lactose − | Glucose −, lactose + |
        |---|---|---|---|---|
        | Wild type | 1 | 8 | 1 | 100 |
        | Mutant X | 8 | 8 | 100 | 100 |
        | Mutant Y | 1 | 7 | 1 | 9 |
      prompt: |
        Which defect best accounts for mutant X?
      options:
        - "Its CAP protein cannot bind cAMP."
        - "Its lac repressor cannot bind the operator, or its operator cannot be bound by the repressor."
        - "Its RNA polymerase cannot bind the lac promoter."
        - "It cannot transport lactose into the cell."
      option_explanations:
        - |
          A CAP defect would prevent high expression in the glucose-absent columns; mutant X reaches 100 whenever glucose is absent, so CAP is working.
        - |
          Correct. Expression no longer depends on lactose (it is identical with or without it in each glucose condition) but still depends on glucose; the repressor-operator switch is broken and the operon is constitutive, with CAP still modulating it.
        - |
          If the polymerase could not bind, expression would be near zero everywhere; X expresses the operon strongly.
        - |
          A transport defect would make the cell behave as if lactose were absent, giving low values in every column, not high ones.
      answer: 1
      explanation: |
        A mutant that ignores one input but obeys the other tells you which switch is broken. X ignores lactose: the negative control is gone; it still obeys glucose: the positive control remains.

    - slug: u06-w20-q03
      type: multiple_choice
      topic_code: "6.5"
      source: "Biology 2e §16.2 Prokaryotic Gene Regulation"
      points: 1
      stimulus: |
        The activity of β-galactosidase, an enzyme encoded by the lac operon, was measured in three E. coli strains grown under four conditions. Values are relative units; the wild type under the best condition is set to 100.

        | Strain | Glucose +, lactose − | Glucose +, lactose + | Glucose −, lactose − | Glucose −, lactose + |
        |---|---|---|---|---|
        | Wild type | 1 | 8 | 1 | 100 |
        | Mutant X | 8 | 8 | 100 | 100 |
        | Mutant Y | 1 | 7 | 1 | 9 |
      prompt: |
        Which defect best accounts for mutant Y, and what does the table predict for a strain carrying both the X and the Y defects?
      options:
        - "Y cannot make cAMP or functional CAP; the double mutant would show about 8 in every column."
        - "Y has a repressor that cannot bind allolactose; the double mutant would show 1 in every column."
        - "Y lacks the lac promoter; the double mutant would show 100 in every column."
        - "Y is identical to the wild type; the double mutant would behave like X."
      option_explanations:
        - |
          Correct. Y responds to lactose (1 → 7, 1 → 9) but never gains the glucose-absent boost, so the positive CAP-cAMP control is missing. Combine that with X's missing repressor and the operon is expressed at the basal, CAP-less level, about 8, under every condition.
        - |
          A repressor that cannot be inactivated would keep the operon off even with lactose, giving 1 in the lactose columns; Y rises to 7 and 9, so the repressor does respond to lactose.
        - |
          With no promoter there would be no transcription at all; Y expresses the operon at low but measurable levels.
        - |
          Y's fourth column is 9, not 100; it differs from the wild type exactly where CAP matters.
      answer: 0
      explanation: |
        To predict a double mutant, ask what each remaining control can still do. With neither repressor nor CAP, the promoter is read at its weak unaided rate regardless of sugars.

    - slug: u06-w20-q04
      type: multiple_choice
      topic_code: "6.5"
      source: "Biology 2e §16.2 Prokaryotic Gene Regulation"
      points: 1
      prompt: |
        E. coli growing in a medium without tryptophan is transferred to a medium containing abundant tryptophan. Which change in the trp operon follows, and why?
      options:
        - "Transcription increases, because tryptophan is an inducer that removes the repressor."
        - "Transcription stops, because tryptophan binds the trp repressor as a corepressor, activating it to bind the operator."
        - "Transcription is unchanged, because the trp operon is constitutive."
        - "Transcription stops, because tryptophan binds RNA polymerase and inactivates it."
      option_explanations:
        - |
          Inducers switch catabolic operons on; tryptophan is the product of an anabolic pathway, and its presence should switch synthesis off, not on.
        - |
          Correct. The trp repressor is inactive alone; bound to tryptophan it changes shape, sits on the operator and blocks the polymerase. The cell stops making an amino acid it can now import.
        - |
          The operon is regulated: a hundredfold difference in expression between tryptophan-poor and tryptophan-rich media is typical.
        - |
          Tryptophan acts through a DNA-binding repressor, not on the polymerase; the polymerase is unaffected and continues to transcribe other genes.
      answer: 1
      explanation: |
        The trp operon is negative feedback in molecular form: the end product of the pathway shuts off the genes that make the pathway's enzymes (Unit 4, topic 4.4).

    - slug: u06-w20-q05
      type: multiple_choice
      topic_code: "6.5"
      source: "Biology 2e §16.3 Eukaryotic Epigenetic Gene Regulation"
      points: 1
      prompt: |
        Cultured human cells were treated with a drug that inhibits histone deacetylases (HDACs). After 24 hours, the amount of mRNA from a particular gene had risen tenfold, and the gene's promoter region was found to have more acetylated histones. Which explanation is best?
      options:
        - "Acetylated histones bind DNA more tightly, protecting the gene from degradation so more copies survive."
        - "Blocking deacetylation left acetyl groups on histone lysines, neutralising their positive charge, loosening the nucleosomes and making the promoter accessible to transcription machinery."
        - "The drug mutated the promoter so that RNA polymerase binds more strongly."
        - "Acetylation added a 5′ cap to the mRNA, making it more stable."
      option_explanations:
        - |
          The relationship is the opposite: acetylation weakens histone-DNA binding, and genes are not degraded or protected in this way; the change is in transcription.
        - |
          Correct. Acetylation removes the positive charge of lysine, so the histones grip the negative backbone less tightly; open chromatin lets transcription factors and polymerase reach the promoter, and the mRNA rises.
        - |
          The drug acts on enzymes, not on DNA sequence; epigenetic effects are, by definition, changes in expression without changes in sequence.
        - |
          The cap is added to RNA by capping enzymes, not by histone acetylation, and the measured change is in the promoter's chromatin, not in mRNA stability.
      answer: 1
      explanation: |
        Protein chemistry (Unit 1) predicts the direction: remove a positive charge from a protein that binds a negative polymer and the binding loosens. HDAC inhibitors are used in cancer therapy for this reason.

    - slug: u06-w20-q06
      type: multiple_choice
      topic_code: "6.5"
      source: "Biology 2e §16.3 Eukaryotic Epigenetic Gene Regulation"
      points: 1
      prompt: |
        In a tumour, the CpG island in the promoter of a tumour-suppressor gene is heavily methylated and the gene is not transcribed, yet sequencing shows the gene itself carries no mutation. Which conclusion is best supported?
      options:
        - "The gene has been deleted from the tumour cells."
        - "The gene is epigenetically silenced; methylation blocks transcription without altering the sequence, and the silencing can be inherited by daughter cells."
        - "The gene is being transcribed but its mRNA is destroyed by miRNAs."
        - "Methylation has converted the gene into an oncogene."
      option_explanations:
        - |
          A deleted gene could not have been sequenced; the DNA is present and intact.
        - |
          Correct. Methylated cytosines in a promoter prevent transcription-factor binding and recruit chromatin-compacting proteins; because methylation patterns are copied at replication, every descendant of the cell keeps the gene off.
        - |
          The observation is that the gene is not transcribed, so there is no mRNA to destroy; the block is upstream, at the promoter.
        - |
          Methylation changes expression, not identity; a tumour suppressor that is switched off is still a tumour suppressor, merely absent in function, which is why reversing the methylation is a therapeutic goal.
      answer: 1
      explanation: |
        A cell can lose a gene's function by sequence mutation or by epigenetic silencing. Only the second is reversible, which is why demethylating drugs exist.

    - slug: u06-w20-q07
      type: multiple_choice
      topic_code: "6.5"
      source: "Biology 2e §16.4 Eukaryotic Transcription Gene Regulation"
      points: 1
      prompt: |
        A gene is expressed in liver and in kidney. Deleting a 300-base-pair sequence located 20,000 base pairs upstream of the gene abolishes expression in liver but leaves kidney expression normal. Which description of the deleted sequence is best?
      options:
        - "The gene's TATA box, which is required by all cell types."
        - "A liver-specific enhancer that, when bound by liver transcription factors, loops into contact with the promoter to activate transcription."
        - "An intron whose removal prevents correct splicing in liver."
        - "A silencer that normally keeps the gene off in kidney."
      option_explanations:
        - |
          The TATA box lies about 25-35 bases upstream, not 20,000, and losing it would silence the gene in every tissue, including kidney.
        - |
          Correct. Enhancers act at great distances through DNA looping, and because the activators that bind them differ between cell types, one enhancer can drive expression in one tissue while another drives it elsewhere.
        - |
          Introns lie within the transcribed gene, not 20 kb upstream of it, and a splicing defect would not be tissue-specific in this way.
        - |
          Deleting a silencer would raise expression somewhere; here expression fell, and only in liver, so the element was activating in liver.
      answer: 1
      explanation: |
        Tissue specificity is written in two places: the cis element (the enhancer) is in every cell, but the trans factor that binds it is made only in some.

    - slug: u06-w20-q08
      type: multiple_choice
      topic_code: "6.5"
      source: "Biology 2e §16.5 Eukaryotic Post-transcriptional Gene Regulation"
      points: 1
      prompt: |
        Cells were engineered to express a microRNA complementary to part of the 3′ untranslated region of gene Z's mRNA. Compared with control cells, the Z mRNA level fell to 15% and Z protein to 10% of normal, while transcription of the Z gene, measured directly, was unchanged. Which mechanism do the data support?
      options:
        - "The miRNA binds the promoter and blocks RNA polymerase II."
        - "The miRNA, loaded into RISC, pairs with the Z mRNA and directs its cleavage or blocks its translation, lowering protein output after transcription."
        - "The miRNA is translated into a repressor protein."
        - "The miRNA methylates the Z gene's CpG island."
      option_explanations:
        - |
          Transcription was measured and was unchanged, so the block is not at the promoter; the mRNA is being made and then lost.
        - |
          Correct. Unchanged transcription plus reduced mRNA and protein is the signature of post-transcriptional silencing: RISC degrades the paired message and interferes with the ribosome.
        - |
          miRNAs are about 22 nucleotides, far too short to encode a protein, and they act by base pairing, not by being translated.
        - |
          Methylation would reduce transcription, which did not change; miRNAs act on RNA in the cytoplasm, not on DNA.
      answer: 1
      explanation: |
        Separate the levels: measure transcription, mRNA and protein and see which step the change appears at. RNA interference leaves transcription alone and acts on the message.

    - slug: u06-w20-q09
      type: multiple_choice
      topic_code: "6.5"
      source: "Biology 2e §16.6 Eukaryotic Translational and Post-translational Gene Regulation"
      points: 1
      prompt: |
        Cells treated with a proteasome inhibitor show a rapid rise in the level of a cell-cycle protein, while the protein's mRNA level does not change. Which conclusion is best supported?
      options:
        - "The inhibitor increased transcription of the gene."
        - "The protein's level is normally controlled by ubiquitin-tagged degradation, so blocking the proteasome lets it accumulate."
        - "The inhibitor stabilised the protein's mRNA."
        - "The inhibitor acetylated the protein, making it more active."
      option_explanations:
        - |
          Transcription changes would show as a change in mRNA, which was constant.
        - |
          Correct. Protein level is a balance of synthesis and degradation; if synthesis is unchanged (constant mRNA) and the level rises, degradation must have slowed. Proteasome inhibition is exactly that.
        - |
          mRNA stability would alter the mRNA level, which did not move; the change is downstream of translation.
        - |
          Acetylation might change activity but not amount; the observation is that more protein is present.
      answer: 1
      explanation: |
        Post-translational control works on the finished product. Cyclins (Unit 4) are the textbook case: made steadily, destroyed on schedule.

    - slug: u06-w20-q10
      type: multiple_choice
      topic_code: "6.6"
      source: "Biology 2e §17.1 Biotechnology"
      points: 1
      prompt: |
        A nucleus taken from a fully differentiated intestinal cell of a tadpole was transplanted into an egg whose own nucleus had been destroyed. The egg developed into a normal frog. Which conclusion about cell specialisation is best supported?
      options:
        - "Differentiated cells have discarded the genes they do not use."
        - "Differentiated cells retain the complete genome; specialisation reflects which genes are expressed, and the egg cytoplasm can reprogram that expression."
        - "The intestinal nucleus contained only intestinal genes, and the egg supplied the rest."
        - "Frogs do not have differentiated cells."
      option_explanations:
        - |
          If genes had been discarded, the nucleus could not have directed development of every other tissue; a whole frog requires a whole genome.
        - |
          Correct. The nucleus carried every gene; the differentiated pattern of expression was reset by factors in the egg, showing that specialisation is a reversible pattern of regulation, not a loss of information.
        - |
          The egg's own nucleus was destroyed; the only genome available was the transplanted one.
        - |
          Frogs have the full range of specialised tissues; the experiment was done because the donor cell was clearly specialised.
      answer: 1
      explanation: |
        Nuclear transfer, mammalian cloning and induced stem cells all rest on this result: the genome is constant, the expression pattern is what differs and what can be changed.

    - slug: u06-w20-q11
      type: multiple_choice
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Fibroblasts (connective-tissue cells) were given an active copy of the gene for MyoD, a transcription factor normally expressed only in developing muscle. Within days the cells fused, began expressing myosin and actin, and contracted. Which interpretation is best?
      options:
        - "MyoD is an enzyme that builds myosin from amino acids."
        - "MyoD is a master regulator whose targets include the genes for muscle proteins and other muscle transcription factors, so expressing it switches on the muscle programme in a cell that already has all the genes."
        - "The fibroblasts were contaminated with muscle cells."
        - "MyoD removed the fibroblast genes and inserted muscle genes."
      option_explanations:
        - |
          MyoD binds DNA and controls transcription; it does not synthesise proteins, and myosin is built by ribosomes from the myosin mRNA that MyoD's action switches on.
        - |
          Correct. A single transcription factor at the top of a cascade can commit a cell to a fate because the fibroblast genome already contains every muscle gene; MyoD simply opens the right set.
        - |
          The change required the added gene and occurred throughout the culture; contamination would not explain a dependence on MyoD.
        - |
          No DNA is gained or lost in differentiation; the same genome is read differently.
      answer: 1
      explanation: |
        Development is a series of transcription-factor decisions. Finding one gene that can impose a fate is the strongest evidence that fate is a regulatory state.

    - slug: u06-w20-q12
      type: multiple_choice
      topic_code: "4.3"
      source: "Biology 2e §9.2 Propagation of the Signal"
      points: 1
      prompt: |
        Review. Cortisol, a steroid hormone, raises the transcription of certain liver genes within an hour of reaching the cell. Which pathway from signal to gene is most consistent with cortisol's chemistry?
      options:
        - "Cortisol binds a surface receptor and the receptor itself is transported to the nucleus."
        - "Cortisol diffuses through the plasma membrane, binds an intracellular receptor, and the hormone-receptor complex enters the nucleus and acts as a transcription factor at specific DNA elements."
        - "Cortisol is a nucleotide that pairs with the gene's promoter."
        - "Cortisol activates ribosomes directly to translate stored mRNA."
      option_explanations:
        - |
          Steroids are lipids and do not need a surface receptor; they pass through the bilayer, and surface receptors do not travel to the nucleus with their ligands.
        - |
          Correct. Hydrophobic signals cross the membrane and bind receptors that are themselves transcription factors; the complex binds hormone-response elements (enhancers) and changes transcription.
        - |
          Cortisol is a four-ring steroid, not a nucleotide, and no signal works by base-pairing with DNA.
        - |
          The observed effect is on transcription, which happens in the nucleus; ribosome activation would not change mRNA levels.
      answer: 1
      explanation: |
        Unit 4 signalling and Unit 6 regulation meet at the transcription factor: every signal that changes gene expression ends by changing what binds a promoter or enhancer.

    - slug: u06-w20-q13
      type: multiple_choice
      topic_code: "4.4"
      source: "Biology 2e §16.2 Prokaryotic Gene Regulation"
      points: 1
      prompt: |
        Review. In the trp operon, abundant tryptophan shuts off transcription of the genes for tryptophan synthesis. Which type of control is this, and what is its effect on tryptophan concentration?
      options:
        - "Positive feedback; tryptophan concentration rises without limit."
        - "Negative feedback; the response reduces the stimulus, so tryptophan concentration is held near a set level."
        - "Positive feedback; tryptophan concentration falls to zero."
        - "No feedback; the operon responds to glucose, not to tryptophan."
      option_explanations:
        - |
          Positive feedback amplifies the stimulus; here the product reduces its own production, the opposite of amplification.
        - |
          Correct. The product of the pathway inhibits expression of the pathway; as tryptophan is used up the repressor is released and synthesis resumes, holding the amino acid within a working range.
        - |
          Shutting off synthesis when tryptophan is high does not drive the level to zero, because synthesis restarts as the level falls.
        - |
          The trp operon's regulator is tryptophan itself; glucose and CAP are the lac operon's story.
      answer: 1
      explanation: |
        Negative feedback (topic 4.4) appears at every scale: an enzyme inhibited by its product, an operon repressed by its product, a hormone suppressed by its effect.

    - slug: u06-w20-q14
      type: multiple_choice
      topic_code: "3.5"
      source: "Biology 2e §7.2 Glycolysis"
      points: 1
      prompt: |
        Review. E. coli given both glucose and lactose uses the glucose first and switches to lactose only when the glucose is gone. Which explanation best connects this behaviour to cellular energetics?
      options:
        - "Lactose contains less energy per molecule than glucose."
        - "Glucose enters glycolysis directly, whereas using lactose requires first making enzymes to transport and hydrolyse it; preferring glucose avoids that cost, and CAP-cAMP enforces the preference."
        - "Lactose is toxic to cells that still have glucose."
        - "Glucose is needed to build the lac repressor."
      option_explanations:
        - |
          Lactose is a disaccharide of glucose and galactose, so it contains about twice the energy of one glucose; energy content is not the reason.
        - |
          Correct. Lactose must be imported and split into glucose and galactose, and galactose needs further enzymes before it can enter glycolysis; expressing those enzymes is an investment that pays only when glucose is absent.
        - |
          Lactose is harmless; the cell simply postpones the expense of using it.
        - |
          The repressor is made constitutively from amino acids; glucose's effect runs through cAMP and CAP, not through repressor synthesis.
      answer: 1
      explanation: |
        Regulation is economics: the lac operon exists to let a cell spend on lactose enzymes only when they are the best available route to ATP.

    - slug: u06-w20-q15
      type: multi_select
      topic_code: "6.5"
      source: "Biology 2e §16.4 Eukaryotic Transcription Gene Regulation"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following would be expected to increase transcription of a eukaryotic protein-coding gene? Select all that apply.
      options:
        - "Acetylation of histones in the nucleosomes around the gene's promoter"
        - "Binding of an activator protein to the gene's enhancer"
        - "Methylation of cytosines in the CpG island of the gene's promoter"
        - "Expression of a microRNA complementary to the gene's mRNA"
        - "Removal of methyl groups from the gene's promoter"
      option_explanations:
        - |
          Correct. Acetylation loosens histone-DNA binding and opens the chromatin so the promoter can be bound.
        - |
          Correct. Activators on enhancers contact the mediator and general transcription factors through DNA looping and raise the rate of initiation.
        - |
          Promoter methylation silences genes by blocking transcription-factor binding and recruiting chromatin-compacting proteins; it lowers transcription.
        - |
          A miRNA acts after transcription, on the mRNA; it reduces protein output but does not raise transcription of the gene.
        - |
          Correct. Demethylating a silenced promoter allows transcription factors to bind again; this is how demethylating drugs reactivate silenced genes.
      answer: [0, 1, 4]
      explanation: |
        Sort each change by level and direction: chromatin opening (acetylation, demethylation) and activator binding raise transcription; methylation lowers it; RNAi acts on a different level altogether.

    - slug: u06-w20-q16
      type: multi_select
      topic_code: "5.5"
      source: "Biology 2e §16.1 Regulation of Gene Expression"
      points: 2
      partial_credit: true
      prompt: |
        Review. Which observations are examples of the environment altering phenotype by changing gene expression rather than by changing genotype? Select all that apply.
      options:
        - "Himalayan rabbits grow dark fur only on their cooler extremities, because the pigment-enzyme gene is expressed only below a threshold temperature"
        - "E. coli produce β-galactosidase only when lactose is present"
        - "A plant exposed to UV light accumulates a mutation in a gene for flower colour"
        - "Yeast cells shifted to high temperature increase production of chaperone proteins within minutes"
        - "A child inherits one copy of a gene from each parent"
      option_explanations:
        - |
          Correct. The genotype is the same in every cell; temperature determines whether the enzyme gene is expressed, so the phenotype varies across the body.
        - |
          Correct. The lac operon is the classic case of a nutrient controlling expression; the genes are always present.
        - |
          UV causing a mutation is a change in the DNA sequence, so this is the environment changing genotype, not expression.
        - |
          Correct. The heat-shock response is a transcriptional programme switched on by an environmental signal.
        - |
          Inheritance of alleles is genotype being transmitted, not the environment acting on expression.
      answer: [0, 1, 3]
      explanation: |
        Topic 5.5 and topic 6.5 are the same idea seen from two sides: phenotype is genotype plus environment, and the environment acts mostly by changing which genes are read.

    - slug: u06-w20-q17
      type: true_false
      topic_code: "6.6"
      source: "Biology 2e §16.1 Regulation of Gene Expression"
      points: 1
      prompt: |
        True or false: A mature human neuron and a mature human liver cell from the same person contain the same genes but express different subsets of them.
      answer: true
      explanation: |
        True. With rare exceptions (red blood cells lose their nucleus; some immune cells rearrange antibody genes), every nucleated cell in a body carries the same genome. Specialisation is achieved by regulation: chromatin state, transcription factors, splicing, RNA stability and protein turnover together decide which genes are active. The same principle is why a nucleus from a differentiated cell can direct development of a whole animal.

    - slug: u06-w20-q18
      type: true_false
      topic_code: "4.2"
      source: "Biology 2e §9.2 Propagation of the Signal"
      points: 1
      prompt: |
        Review. True or false: Signal transduction pathways that begin at a cell-surface receptor can end by changing which genes the cell transcribes, because the final kinases in the cascade can phosphorylate transcription factors.
      answer: true
      explanation: |
        True. A water-soluble ligand cannot enter the cell, but its receptor starts a cascade (often through second messengers and a series of kinases) whose last targets include transcription factors; phosphorylation lets them enter the nucleus or bind DNA. This is how growth factors drive the expression of cell-cycle genes and how a hormone at the surface can change a cell's protein composition for hours.

    - slug: u06-w20-q19
      type: fill_blank
      topic_code: "6.5"
      source: "Biology 2e §16.2 Prokaryotic Gene Regulation"
      points: 1
      prompt: |
        In a bacterial operon, the short DNA sequence next to the promoter to which a repressor protein binds, blocking RNA polymerase, is called the ____.
      answer: ["operator"]
      explanation: |
        The operator is a cis-acting sequence; the repressor is the trans-acting protein that binds it. A mutation in the operator affects only the operon it sits in, whereas a mutation in the repressor gene affects every copy of the operator in the cell. "Promoter" is the polymerase's binding site, not the repressor's, so it is not accepted.

    - slug: u06-w20-q20
      type: fill_blank
      topic_code: "4.6"
      source: "Biology 2e §16.7 Cancer and Gene Regulation"
      points: 1
      prompt: |
        Review. The transcription factor that halts the cell cycle or triggers apoptosis in response to DNA damage, and that is mutated or silenced in more than half of human cancers, is the tumour-suppressor protein ____.
      answer: ["p53", "P53", "TP53"]
      explanation: |
        p53 is a transcription factor: when activated by damage it switches on genes that arrest the cycle at G1 or that start apoptosis. Loss of p53 by mutation or epigenetic silencing removes the brake, so cells with damaged DNA keep dividing and accumulate further mutations. Its mechanism is gene regulation (Unit 6) in the service of cell-cycle control (Unit 4).

    - slug: u06-w20-q21
      type: numeric
      topic_code: "6.6"
      source: "general knowledge"
      points: 1
      prompt: |
        An RNA-sequencing experiment counts 4,800 transcripts of the insulin gene per million in pancreatic β cells and 15 per million in liver cells. By what factor is insulin expression higher in β cells than in liver? Give a whole number.
      answer: { value: 320, tolerance: 0 }
      explanation: |
        4,800 ÷ 15 = 320. A fold change is a ratio, not a difference (4,785 would be the difference, which is not what "by what factor" asks). Expression differences of hundreds-fold between cell types are typical of cell-specific genes, while housekeeping genes differ by small factors. The same genome, read 320 times more often in one cell type than another, is what cell specialisation looks like in numbers.

    - slug: u06-w20-q22
