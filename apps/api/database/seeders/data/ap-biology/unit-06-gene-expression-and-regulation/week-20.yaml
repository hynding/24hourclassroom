      answer: |
        Gene 1 is housekeeping, expressed at about 100 in every cell type, while genes 2-4 are each expressed in only one. The cell types differ in regulation, not in genes: cell-specific transcription factors bound to enhancers, open or closed chromatin, methylation. Opening the chromatin would allow some β-globin transcription in muscle, but probably at a low level, because the red-cell transcription factors that activate the gene are absent in muscle.
