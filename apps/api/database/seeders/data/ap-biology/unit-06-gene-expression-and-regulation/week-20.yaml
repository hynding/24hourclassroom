        (b) Explain, 2 pts: 1 pt for the statement that every cell type carries the same genome and differential gene expression, not differential gene content, produces the pattern; 1 pt for naming at least one mechanism: cell-specific transcription factors (activators) bound to the enhancers of myosin, globin or insulin genes; chromatin that is open (acetylated, unmethylated) in the expressing cell and closed (methylated, deacetylated) elsewhere; or a transcription-factor cascade during development that committed each lineage.

        (c) Predict and justify, 1 pt: some increase from zero is possible because the gene becomes accessible, but expression would stay far below the red-cell level because transcription requires the specific activators (red-cell transcription factors) that muscle does not express; accessibility is necessary but not sufficient. Accept either a prediction of low expression or a prediction of no expression if the justification correctly identifies the missing trans factors.

        Zero: answers that say muscle cells lack the globin gene, or that explain the differences by mutation.

    - slug: u06-w20-q23
      type: short_answer
      topic_code: "4.1"
      source: "Biology 2e §9.1 Signaling Molecules and Cellular Receptors"
      points: 4
      prompt: |
        Review. Conceptual analysis. In E. coli, a shortage of glucose is sensed as a rise in cyclic AMP (cAMP), which binds CAP and switches on the lac operon. In a human liver cell, the hormone glucagon binds a surface receptor, cAMP rises, and genes for glucose production are eventually switched on. (a) Describe what the two systems have in common. (b) Explain why the human system needs a receptor and a transduction cascade while the bacterial one does not. (c) Predict the effect, in each system, of a drug that prevents cAMP from being broken down, and justify your prediction.
      answer: |
        Both use cAMP as an intracellular second messenger reporting low glucose, and both end with a protein binding DNA to change transcription. The bacterium senses its own metabolic state internally; the liver cell responds to a signal from another organ that cannot cross the membrane, so a receptor converts the external signal into an internal one and the cascade amplifies and relays it to the nucleus. Persistently high cAMP would keep the lac operon on (if lactose were present) and keep liver glucose-production genes on, as if glucose were low in both cases.
      explanation: |
        Four points.

        (a) Describe, 1 pt: both use cAMP as a small intracellular messenger whose level reports glucose availability, and in both the final effect is on transcription (CAP binding DNA in E. coli; a transcription factor activated through protein kinase A in the liver cell). Either shared feature stated clearly earns the point; both is better.

        (b) Explain, 2 pts: 1 pt for recognising that glucagon is a peptide that cannot cross the membrane and comes from another cell (the pancreas), so a surface receptor is needed to convert an external signal into an internal one; 1 pt for the role of the cascade: amplification and relay from the membrane to the nucleus, with the opportunity for regulation and integration at each step, whereas the bacterium's cAMP is generated directly in response to its own transport of glucose and acts on a nearby protein.

        (c) Predict and justify, 1 pt: in both systems cAMP would stay high, so the cell would behave as if glucose were absent: E. coli would keep CAP active (and express the lac operon whenever lactose was present); the liver cell would keep producing glucose. The justification must connect persistent cAMP to the downstream protein (CAP or the kinase pathway) staying active.

        Zero: answers that describe cAMP as a hormone that leaves the cell, or that have the bacterium using a membrane receptor for glucose signalling.

    - slug: u06-w20-q24
      type: long_answer
      topic_code: "6.5"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. In a strain of mice, the Avy gene controls coat colour and metabolism. Its expression depends on a regulatory DNA element upstream of the gene that can be methylated. Researchers fed pregnant females either a standard diet or a diet supplemented with methyl-donor nutrients (folate, vitamin B12, choline) and examined the offspring. All mice were genetically identical at the Avy locus.

        | Maternal diet | Mean methylation of the Avy regulatory element in offspring (%) | Avy mRNA in offspring skin (relative) | Offspring with yellow coat (%) | Offspring with brown coat (%) | Offspring obese at 1 year (%) |
        |---|---|---|---|---|---|
        | Standard | 22 | 100 | 61 | 39 | 58 |
        | Methyl-supplemented | 58 | 31 | 19 | 81 | 21 |

        (a) Identify the independent and dependent variables, and state why using genetically identical mice was essential to the design.
        (b) Describe the effect of the supplemented diet on methylation and on Avy expression, using the data.
        (c) Explain the mechanism that links the diet to coat colour, naming the level of gene regulation involved.
        (d) The yellow coat and obesity are caused by the Avy protein. Using the data, explain why the brown offspring were less likely to be obese, and evaluate whether the data prove that methylation causes the colour change.
        (e) Propose an experiment, using the brown offspring of supplemented mothers as parents, to test whether the methylation state is inherited across a generation, and state the result that would support inheritance.
      answer: |
        IV: maternal diet; DVs: methylation of the regulatory element, Avy mRNA, coat colour and obesity. Identical genotype rules out sequence differences as the cause, so any difference must be in expression. Supplementation raised methylation from 22% to 58% and cut Avy mRNA to 31%, with yellow coats falling from 61% to 19%. Methyl groups from the diet are added to cytosines in the regulatory element; methylated DNA is bound less by transcription factors and packed more tightly, so transcription falls: epigenetic (chromatin-level) regulation. Less Avy protein gives brown coats and less obesity (58% to 21%), consistent with one protein causing both. The data show a strong correlation and a plausible mechanism but not proof, since the diet could act in other ways; a direct test would alter methylation without changing diet. Mate brown supplemented-line offspring on a standard diet and score their pups; a higher brown fraction and higher methylation than in the standard line would support transgenerational inheritance of the mark.
      explanation: |
        Eight points.

        (a) 1 pt: independent variable, maternal diet (standard versus methyl-supplemented); dependent variables, methylation of the regulatory element, Avy mRNA level, coat colour distribution and obesity; identical genotypes are essential so that differences in expression and phenotype cannot be attributed to differences in DNA sequence, isolating the epigenetic effect. All three parts required.

        (b) 1 pt: the supplemented diet raised methylation from 22% to 58% (more than doubled) and reduced Avy mRNA to 31% of the standard level; the share of yellow offspring fell from 61% to 19% and brown rose from 39% to 81%. At least two numerical comparisons required.

        (c) 2 pts: 1 pt for the mechanism: dietary methyl donors supply methyl groups that enzymes attach to cytosines in the regulatory element, and methylated DNA is less accessible (blocks transcription-factor binding, recruits proteins that condense chromatin), so transcription of Avy falls; 1 pt for naming the level: epigenetic regulation (DNA methylation / chromatin-level control of transcription) that changes expression without changing sequence.

        (d) 2 pts: 1 pt for the explanation that both yellow colour and obesity result from the Avy protein, so animals in which the gene is silenced (brown) make less of it and are less often obese, matching the fall from 58% to 21%; 1 pt for the evaluation: the data show a correlation between diet, methylation, expression and phenotype with a plausible mechanism, but they do not by themselves prove that methylation is the cause, because the diet could affect the mice in other ways; a causal test would manipulate methylation directly (for example a methyltransferase inhibitor or targeted demethylation) or show that within one diet group individual methylation predicts individual colour. Accept "correlation is not causation" only if a specific alternative or a specific further test is given.

        (e) 2 pts: 1 pt for a design: breed brown offspring of supplemented mothers (and, as a control, brown offspring of standard mothers) with all parents and pups on the standard diet, then measure methylation and coat colour in the next generation; 1 pt for the expected result supporting inheritance: pups of the supplemented line show higher methylation and a higher proportion of brown coats than pups of the control line even though neither generation received the supplement; the opposite (both lines alike) would indicate the mark is reset each generation.

        Zero for a part: describing the diet as mutating the gene; claiming the brown mice have a different allele; proposing an experiment that keeps the parents on the supplemented diet (which cannot separate inheritance from continued exposure); describing the effect without numbers.
