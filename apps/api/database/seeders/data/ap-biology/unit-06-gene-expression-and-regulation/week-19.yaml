week: 19
unit: 6
title: Transcription, RNA Processing and Translation
topics: ["6.3", "6.4"]
guide: guides/week-19.md
guide_description: |
  From gene to protein: how RNA polymerase reads a template strand, what a eukaryote does to its pre-mRNA before
  it leaves the nucleus (5′ cap, poly-A tail, splicing, alternative splicing), and how a ribosome turns codons into
  a polypeptide with tRNA as the adapter. Three worked examples (reading a codon table, a frameshift, a
  cell-free translation data set), misconceptions, self-check.
flashcards_description: |
  36 cards: the strands and enzymes of transcription, the three processing steps, the codon table, tRNA, the ribosome and the three stages of translation.

flashcards:
  - front: Central dogma → the two steps and where each happens in a eukaryote
    back: |
      DNA → RNA (transcription, in the nucleus) → protein (translation, on ribosomes in the cytoplasm or on the rough ER). Retroviruses add RNA → DNA by reverse transcriptase.
    topic_code: "6.3"
  - front: Template strand vs coding strand
    back: |
      The template (antisense) strand is read 3′ → 5′ by RNA polymerase and is complementary to the mRNA. The coding (sense, nontemplate) strand has the same sequence as the mRNA, with T where the mRNA has U.
    hint: The mRNA looks like the coding strand but is made from the template.
    topic_code: "6.3"
  - front: Promoter → what it is and who reads it
    back: |
      A DNA sequence upstream of a gene where transcription begins. In bacteria the sigma factor of RNA polymerase recognises the −10 (TATAAT) and −35 (TTGACA) boxes; in eukaryotes transcription factors bind the TATA box about 25-35 bases upstream and recruit RNA polymerase II.
    topic_code: "6.3"
  - front: What does RNA polymerase need that DNA polymerase needs, and what does it not need?
    back: |
      Both need a template and nucleoside triphosphates, both read 3′ → 5′ and build 5′ → 3′. RNA polymerase needs no primer: it can start a chain on its own, which is why primase (an RNA polymerase) can start DNA replication.
    topic_code: "6.3"
  - front: Sigma factor → role in bacterial transcription
    back: |
      The subunit of the bacterial RNA polymerase holoenzyme that recognises the promoter so synthesis starts at the right place. Without it the core enzyme would begin at random; it is released once elongation begins.
    topic_code: "6.3"
  - front: Transcription elongation → direction, bubble and rate
    back: |
      RNA polymerase unwinds about 17 base pairs at a time, adds ribonucleotides to the 3′ end of the growing RNA (5′ → 3′, about 40 per second in bacteria) and rewinds the DNA behind it. The RNA peels away as the helix re-forms.
    topic_code: "6.3"
  - front: Rho-independent termination → how a hairpin stops transcription
    back: |
      A G-C-rich sequence in the new RNA folds back on itself into a stable hairpin; followed by a run of U's that pair weakly with the template, the polymerase stalls and the transcript falls off.
    topic_code: "6.3"
  - front: Three eukaryotic RNA polymerases → what each makes
    back: |
      Pol I: the large rRNAs, in the nucleolus. Pol II: all protein-coding pre-mRNAs (and many regulatory RNAs). Pol III: tRNAs, 5S rRNA and other small RNAs.
    topic_code: "6.3"
  - front: TATA box → sequence, position and binder
    back: |
      TATAAA on the coding strand, about 25-35 bases upstream of the start site. The TATA-binding protein in TFIID binds it, other general transcription factors assemble, and RNA polymerase II joins to form the pre-initiation complex.
    topic_code: "6.3"
  - front: 5′ cap → what, when and why
    back: |
      A modified guanine (7-methylguanosine) added to the 5′ end of the pre-mRNA while it is still being transcribed. It protects the end from nucleases and is recognised by the ribosome to begin translation.
    topic_code: "6.3"
  - front: Poly-A tail → signal, length and why
    back: |
      After the AAUAAA signal the pre-mRNA is cut and poly-A polymerase adds about 200 adenines. The tail protects the 3′ end, helps export from the nucleus and lengthens the mRNA's working life; shortening it marks the message for degradation.
    topic_code: "6.3"
  - front: Intron vs exon
    back: |
      Exons are the segments kept in the mature mRNA (expressed); introns are the intervening segments removed before export. Introns begin with GU and end with AG.
    topic_code: "6.3"
  - front: Spliceosome → what it is made of and what it does
    back: |
      A complex of small nuclear RNAs and proteins (snRNPs) that recognises intron boundaries, cuts the intron out as a loop and joins the flanking exons with single-nucleotide precision, in the nucleus.
    topic_code: "6.3"
  - front: Alternative splicing → what it achieves
    back: |
      Different combinations of exons from one pre-mRNA produce different mature mRNAs and so different proteins from one gene; exon order is always preserved. About 70% of human genes do it, which is why we have far more proteins than genes.
    topic_code: "6.3"
  - front: Why can bacteria translate an mRNA before transcription finishes?
    back: |
      There is no nucleus, so ribosomes reach the 5′ end of the transcript while RNA polymerase is still making the 3′ end, and no processing (cap, tail, splicing) is required first.
    topic_code: "6.3"
  - front: Polycistronic mRNA
    back: |
      A bacterial transcript carrying several genes, usually of one operon, each translated from its own start codon. Eukaryotic mRNAs are monocistronic.
    topic_code: "6.3"
  - front: mRNA lifetime → bacteria vs eukaryotes
    back: |
      Bacterial mRNAs are degraded within seconds to minutes, so protein output follows transcription closely. Capped, tailed eukaryotic mRNAs last hours, so stability is itself a point of control.
    topic_code: "6.3"
  - front: Why is a codon three nucleotides long?
    back: |
      Four bases taken two at a time give only 16 combinations, fewer than the 20 amino acids. Three at a time give 64, enough with room for redundancy. Crick and Brenner confirmed it: inserting one or two bases ruined a gene, inserting three restored it.
    topic_code: "6.4"
  - front: The 64 codons → how they are divided
    back: |
      61 sense codons specify amino acids; 3 stop codons (UAA, UAG, UGA) end translation. AUG is both the start codon and the codon for methionine.
    topic_code: "6.4"
  - front: Degeneracy of the genetic code → meaning and benefit
    back: |
      Most amino acids are specified by more than one codon, often differing only in the third base. A substitution in that position frequently changes nothing (a silent mutation), which buffers the proteome against point mutations.
    topic_code: "6.4"
  - front: Reading frame → what sets it and what breaks it
    back: |
      The grouping of bases into triplets, fixed by the position of the AUG start codon. Inserting or deleting any number of bases that is not a multiple of three shifts every codon downstream (frameshift).
    topic_code: "6.4"
  - front: Reading a codon table → the procedure
    back: |
      Work from the mRNA, 5′ → 3′. Find the first AUG, then take three bases at a time: first base selects the row, second the column, third the entry within the box. Stop at UAA, UAG or UGA, which add no amino acid.
    hint: The table is written for mRNA codons, not DNA and not anticodons.
    topic_code: "6.4"
  - front: tRNA → structure and the anticodon
    back: |
      A small RNA folded into a cloverleaf and then an L shape. One end carries a three-base anticodon that pairs antiparallel with a codon; the opposite 3′ end carries the matching amino acid.
    topic_code: "6.4"
  - front: Aminoacyl-tRNA synthetase → job and energy cost
    back: |
      One enzyme per amino acid attaches that amino acid to every tRNA with a matching anticodon, spending ATP (to AMP and two phosphates). The high-energy bond it makes later pays for the peptide bond. This step is where the code is actually read.
    topic_code: "6.4"
  - front: Ribosome → subunits in bacteria and in eukaryotes
    back: |
      Bacteria: 30S small plus 50S large make 70S. Eukaryotes: 40S plus 60S make 80S. Both are rRNA plus protein; the difference lets antibiotics such as tetracycline hit bacterial ribosomes and spare ours.
    topic_code: "6.4"
  - front: A, P and E sites → what each holds
    back: |
      A (aminoacyl): the incoming charged tRNA. P (peptidyl): the tRNA holding the growing polypeptide. E (exit): the empty tRNA about to leave. The ribosome moves one codon so each tRNA shifts A → P → E.
    topic_code: "6.4"
  - front: Translation initiation → bacteria vs eukaryotes
    back: |
      Bacteria: the small subunit binds the Shine-Dalgarno sequence just upstream of AUG and the initiator carries formyl-methionine. Eukaryotes: the small subunit binds the 5′ cap and scans to the first AUG; the initiator is plain methionine. Both then add the large subunit with GTP.
    topic_code: "6.4"
  - front: Peptidyl transferase → what it is made of
    back: |
      The catalytic activity of the large subunit that joins the carboxyl group of the P-site amino acid to the amino group of the A-site amino acid. It is rRNA, not protein: the ribosome is a ribozyme.
    topic_code: "6.4"
  - front: Translation elongation → the three steps per codon
    back: |
      1) A charged tRNA whose anticodon matches the A-site codon enters (GTP). 2) Peptidyl transferase moves the chain onto the A-site amino acid. 3) The ribosome translocates one codon (GTP), shifting the tRNAs to P and E. About 0.05 s per amino acid in E. coli.
    topic_code: "6.4"
  - front: Translation termination → what happens at a stop codon
    back: |
      No tRNA matches UAA, UAG or UGA; a release factor protein enters the A site instead, water is added to the last bond, the polypeptide is freed and the ribosome subunits separate.
    topic_code: "6.4"
  - front: Polyribosome
    back: |
      Several ribosomes translating one mRNA at the same time, each at a different point along it, so one message yields many copies of the protein quickly.
    topic_code: "6.4"
  - front: Signal sequence → what it does to a growing polypeptide
    back: |
      A short stretch at the amino end that directs the ribosome to the rough ER (or the protein to another compartment). The protein is threaded into the ER as it is made and the signal is usually clipped off.
    topic_code: "6.4"
  - front: Near-universality of the genetic code → what it implies
    back: |
      Almost every organism uses the same codon assignments, so a human gene is translated correctly by a bacterium. The shared code is evidence that all life descends from a common ancestor and is what makes recombinant DNA possible.
    topic_code: "6.4"
  - front: Which direction is the mRNA read and the polypeptide built?
    back: |
      The ribosome reads the mRNA 5′ → 3′ and the polypeptide grows from its amino (N) end to its carboxyl (C) end. The first amino acid in is the N-terminus of the finished protein.
    topic_code: "6.4"
  - front: Transcription vs replication → the three differences
    back: |
      Transcription copies one gene, not the genome; uses one strand as template and makes a single-stranded RNA; needs no primer. Both read 3′ → 5′ and build 5′ → 3′ from nucleoside triphosphates.
    topic_code: "6.3"
  - front: Wobble → why one tRNA can read several codons
    back: |
      The pairing rules are relaxed at the third codon position, so a single tRNA anticodon can pair with more than one synonymous codon. Cells therefore need fewer than 61 tRNAs.
    topic_code: "6.4"

quiz:
  description: |
    25 questions · about 30 minutes · about 70% this week (transcription, RNA processing, translation) and 30%
    review of nucleic acids and proteins (Unit 1), cell structure and compartments (Unit 2), enzymes and energy
    (Unit 3). Multiple choice, select-all, true/false and numeric items are graded at once; the fill-in-the-blank
    items are matched automatically; the two short answers and the long answer are graded by your teacher
    against the acceptable-answer summary.
  questions:
    - slug: u06-w19-q01
      type: multiple_choice
      topic_code: "6.3"
      source: "Biology 2e §15.2 Prokaryotic Transcription"
      points: 1
      prompt: |
        Part of a gene is shown below. The upper strand is the coding (nontemplate) strand.

        5′-ATGGCTTAC-3′
        3′-TACCGAATG-5′

        Which mRNA sequence is transcribed from this region?
      options:
        - "5′-AUGGCUUAC-3′"
        - "5′-UACCGAAUG-3′"
        - "3′-AUGGCUUAC-5′"
        - "5′-ATGGCTTAC-3′"
      option_explanations:
        - |
          Correct. The mRNA is complementary and antiparallel to the template (lower) strand, which makes it identical in sequence to the coding strand with U in place of T, written 5′ → 3′.
        - |
          This is the template strand's sequence rewritten with U; the mRNA is complementary to the template, not a copy of it.
        - |
          The letters match the coding strand but the ends are reversed; RNA is synthesised 5′ → 3′ and is conventionally written that way, and reversing the labels changes which codon comes first.
        - |
          RNA contains uracil, not thymine; a sequence with T is DNA.
      answer: 0
      explanation: |
        Transcription reads the template 3′ → 5′ and builds RNA 5′ → 3′. The shortcut: copy the coding strand and swap T for U. The long way: complement the template and reverse the ends. Both must give the same answer.

    - slug: u06-w19-q02
      type: multiple_choice
      topic_code: "6.3"
      source: "Biology 2e §15.2 Prokaryotic Transcription"
      points: 1
      prompt: |
        A bacterial mutant produces an RNA polymerase core enzyme that can no longer bind the sigma factor. Which outcome is predicted?
      options:
        - "No RNA is made, because the core enzyme cannot form phosphodiester bonds without sigma."
        - "RNA is made, but transcription begins at random sites rather than at promoters."
        - "RNA is made normally, because sigma acts only during termination."
        - "Only rRNA is made, because sigma is needed for protein-coding genes alone."
      option_explanations:
        - |
          The core enzyme carries the catalytic activity; sigma's job is recognition, not catalysis, so RNA can still be synthesised.
        - |
          Correct. Sigma recognises the −10 and −35 promoter sequences and positions the polymerase at the start site. Without it the core enzyme binds DNA nonspecifically and starts transcripts at meaningless positions.
        - |
          Sigma is released shortly after initiation and plays no part in termination, which uses hairpins or the rho protein.
        - |
          Bacteria have one RNA polymerase for all their genes; the three specialised polymerases are a eukaryotic feature.
      answer: 1
      explanation: |
        Specificity and catalysis are separable: a promoter-recognition factor tells a polymerase where to start, and losing it loses the where, not the whether. Eukaryotic transcription factors play the same role for RNA polymerase II.

    - slug: u06-w19-q03
      type: multiple_choice
      topic_code: "6.3"
      source: "Biology 2e §15.4 RNA Processing in Eukaryotes"
      points: 1
      prompt: |
        A eukaryotic gene is engineered so that its transcript lacks the AAUAAA signal and therefore never receives a poly-A tail. The 5′ cap and splicing are normal. Which effect on the gene's protein output is most likely, and why?
      options:
        - "Output increases, because the mRNA is shorter and is translated faster."
        - "Output falls, because the untailed mRNA is exported poorly and is degraded quickly from its 3′ end."
        - "Output is unchanged, because the poly-A tail is not part of the coding sequence."
        - "Output falls, because without the tail the ribosome cannot find the start codon."
      option_explanations:
        - |
          Translation rate is set by elongation along the coding region, which is unchanged; removing 200 untranslated adenines does not speed the ribosome.
        - |
          Correct. The tail protects the 3′ end from exonucleases and is needed for efficient nuclear export and stability; without it the message is short-lived and little protein accumulates.
        - |
          The tail is not translated, but it decides how long the mRNA survives and whether it leaves the nucleus; both affect how much protein is made.
        - |
          Finding the start codon is the job of the 5′ cap, which the ribosome binds before scanning to the first AUG; the cap is intact here.
      answer: 1
      explanation: |
        The two ends of a eukaryotic mRNA have different jobs: cap for recognition and 5′ protection, tail for stability, export and 3′ protection. Each is a point of control in topic 6.5.

    - slug: u06-w19-q04
      type: multiple_choice
      topic_code: "6.3"
      source: "Biology 2e §15.4 RNA Processing in Eukaryotes"
      points: 1
      prompt: |
        A single human gene has five exons (1 to 5). Three different mRNAs are found in three tissues: muscle (exons 1-2-3-4-5), liver (exons 1-2-4-5) and brain (exons 1-3-4-5). Which statement is best supported?
      options:
        - "The three tissues carry different versions of the gene with different numbers of exons."
        - "The three mRNAs arise by alternative splicing of one pre-mRNA, so one gene produces related but different proteins in different cells."
        - "Liver and brain cells have lost exons 3 and 2 respectively from their DNA."
        - "The mRNAs differ because the gene has three promoters, one per tissue."
      option_explanations:
        - |
          Every nucleated cell in the body carries the same gene with all five exons; the differences are in which exons the spliceosome keeps, not in the DNA.
        - |
          Correct. Exon order is preserved (1 before 2 before 3 and so on) and exons are skipped in a tissue-specific way, the signature of regulated alternative splicing, producing protein isoforms.
        - |
          Deleting DNA from differentiated cells would be irreversible and is not how cells specialise; the gene is intact and the choice is made at the RNA level.
        - |
          Different promoters would change where the transcript starts (the 5′ end), but all three mRNAs begin with exon 1 and end with exon 5; the differences are internal.
      answer: 1
      explanation: |
        Alternative splicing is why the number of human proteins exceeds the number of genes several times over, and why one gene can be read differently in different cell types (topic 6.6).

    - slug: u06-w19-q05
      type: multiple_choice
      topic_code: "6.4"
      source: "Biology 2e §15.1 The Genetic Code"
      points: 1
      stimulus: |
        A short gene is shown. The lower strand is the template strand. A partial codon table is provided.

        Coding strand:   5′-ATG CCT GAA GGC TAG-3′
        Template strand: 3′-TAC GGA CTT CCG ATC-5′

        | mRNA codon | Amino acid |
        |---|---|
        | AUG | Met (start) |
        | CCU, CCC, CCA, CCG | Pro |
        | GAA, GAG | Glu |
        | GAU, GAC | Asp |
        | GGC, GGU, GGA, GGG | Gly |
        | AGC, AGU | Ser |
        | UAG, UAA, UGA | Stop |
      prompt: |
        Which polypeptide is produced when this gene is transcribed and translated?
      options:
        - "Met-Pro-Glu-Gly"
        - "Met-Gly-Leu-Pro"
        - "Pro-Glu-Gly-Stop"
        - "Met-Pro-Glu-Gly-Stop, with the stop codon adding a fifth amino acid"
      option_explanations:
        - |
          Correct. The mRNA is 5′-AUG CCU GAA GGC UAG-3′ (coding strand with U for T). AUG = Met, CCU = Pro, GAA = Glu, GGC = Gly, UAG = stop, which adds nothing.
        - |
          This comes from reading the template strand's letters directly as if they were codons; the mRNA is complementary to the template, which means it matches the coding strand.
        - |
          Methionine is not dropped from the list: the start codon AUG encodes Met, which is the first residue of every newly made polypeptide (though it may be removed later).
        - |
          A stop codon is recognised by a release factor, not a tRNA; no amino acid is added for it, so the chain is four residues long.
      answer: 0
      explanation: |
        The reliable route: write the mRNA 5′ → 3′ from the coding strand, find AUG, read in threes, stop at the stop. Every error in this stimulus set comes from skipping one of those steps.

    - slug: u06-w19-q06
      type: multiple_choice
      topic_code: "6.4"
      source: "Biology 2e §15.1 The Genetic Code"
      points: 1
      stimulus: |
        A short gene is shown. The lower strand is the template strand. A partial codon table is provided.

        Coding strand:   5′-ATG CCT GAA GGC TAG-3′
        Template strand: 3′-TAC GGA CTT CCG ATC-5′

        | mRNA codon | Amino acid |
        |---|---|
        | AUG | Met (start) |
        | CCU, CCC, CCA, CCG | Pro |
        | GAA, GAG | Glu |
        | GAU, GAC | Asp |
        | GGC, GGU, GGA, GGG | Gly |
        | AGC, AGU | Ser |
        | UAG, UAA, UGA | Stop |
      prompt: |
        A mutation changes the sixth base of the coding strand from T to C (ATG CCC GAA GGC TAG). Which best describes the effect on the protein?
      options:
        - "No change in the amino-acid sequence, because CCC and CCU both specify proline."
        - "Proline is replaced by serine, altering the protein's shape."
        - "A premature stop codon ends the chain after methionine."
        - "The reading frame shifts, changing every amino acid after the first."
      option_explanations:
        - |
          Correct. The second codon becomes CCC, which is still proline: a silent substitution, made harmless by the degeneracy of the code at the third position.
        - |
          Serine codons in the table are AGC and AGU; a C in the third position of a proline codon stays within the proline box.
        - |
          The stop codons are UAG, UAA and UGA; CCC is nothing like them, and no stop is created.
        - |
          A substitution swaps one base for another without changing the count, so the triplet grouping is unchanged; only insertions and deletions shift the frame.
      answer: 0
      explanation: |
        Degeneracy concentrates in the third codon position, which is why many third-position substitutions are silent. Always re-read the codon table rather than assuming any change must matter.

    - slug: u06-w19-q07
      type: multiple_choice
      topic_code: "6.4"
      source: "Biology 2e §15.1 The Genetic Code"
      points: 1
      stimulus: |
        A short gene is shown. The lower strand is the template strand. A partial codon table is provided.

        Coding strand:   5′-ATG CCT GAA GGC TAG-3′
        Template strand: 3′-TAC GGA CTT CCG ATC-5′

        | mRNA codon | Amino acid |
        |---|---|
        | AUG | Met (start) |
        | CCU, CCC, CCA, CCG | Pro |
        | GAA, GAG | Glu |
        | GAU, GAC | Asp |
        | GGC, GGU, GGA, GGG | Gly |
        | AGC, AGU | Ser |
        | UAG, UAA, UGA | Stop |
      prompt: |
        A different mutation deletes the seventh base of the coding strand (the G of GAA), giving ATG CCT AAG GCT AG. Which prediction about the polypeptide is best supported?
      options:
        - "Only glutamate is lost; the rest of the protein is normal."
        - "Every codon after proline is read in a new frame, so the amino acids from the third position onward are different and the original stop codon is no longer in frame."
        - "Translation stops at the deletion because the ribosome cannot read a gap."
        - "The protein is unchanged because a single base is too small to matter."
      option_explanations:
        - |
          Removing one base does not remove one codon; it shifts the grouping of every base after it, so more than a single residue changes.
        - |
          Correct. After CCU the mRNA reads AAG GCU AG…: lysine, alanine and then whatever follows, with the original UAG stop broken up. A frameshift scrambles the downstream sequence until a new stop appears by chance.
        - |
          The ribosome sees a continuous mRNA with no gap; it simply groups the remaining bases into new triplets.
        - |
          A single-base substitution in a third position can be silent, but a single-base insertion or deletion is among the most damaging changes possible because it alters the frame.
      answer: 1
      explanation: |
        The size of a mutation is not the size of its effect. Count bases: an indel of 1 or 2 shifts the frame; an indel of 3 adds or removes one residue and leaves the rest intact.

    - slug: u06-w19-q08
      type: multiple_choice
      topic_code: "6.4"
      source: "Biology 2e §15.1 The Genetic Code"
      points: 1
      prompt: |
        Which argument best explains why the genetic code uses three-nucleotide codons rather than two?
      options:
        - "Two nucleotides give only 4² = 16 combinations, fewer than the 20 amino acids, whereas three give 4³ = 64, which is enough."
        - "Three nucleotides are the minimum that a tRNA molecule can physically bind."
        - "Codons of three bases are exactly the width of one turn of the double helix."
        - "Two-nucleotide codons would make mRNA too short to leave the nucleus."
      option_explanations:
        - |
          Correct. The combinatorial argument is the reasoning Crick and others used, and experiments inserting one, two or three bases into a gene confirmed that the frame is read in threes.
        - |
          tRNA binding is a consequence of the code being triplet, not the reason for it; the question is why 3 rather than 2 is required, which is a counting argument.
        - |
          A helical turn is 10 base pairs, and the geometry of the helix has nothing to do with how many bases encode an amino acid.
        - |
          mRNA length is not what limits export, and the code length is set by the number of amino acids that must be distinguished.
      answer: 0
      explanation: |
        Sixty-four codons for twenty amino acids leaves a surplus, and the surplus is used: most amino acids have several codons (degeneracy) and three codons mean stop.

    - slug: u06-w19-q09
      type: multiple_choice
      topic_code: "6.4"
      source: "general knowledge"
      points: 1
      prompt: |
        In a classic experiment, tRNA charged with cysteine (Cys-tRNA^Cys) was chemically treated so that the attached cysteine was converted to alanine while it remained on the same tRNA. When this altered tRNA was used in translation, alanine appeared in the polypeptide at the positions where cysteine belonged. Which conclusion is best supported?
      options:
        - "The ribosome checks the amino acid on each tRNA before adding it."
        - "The codon is read by the tRNA's anticodon, not by the amino acid it carries, so accuracy depends on correct charging by the synthetase."
        - "Alanine and cysteine share the same codons."
        - "The chemical treatment altered the mRNA so that it specified alanine."
      option_explanations:
        - |
          If the ribosome checked the amino acid it would have rejected alanine at cysteine codons; the result shows it does not look at the amino acid at all.
        - |
          Correct. Once an amino acid is attached, the tRNA delivers it wherever its anticodon pairs. The fidelity of translation therefore rests on aminoacyl-tRNA synthetases pairing the right amino acid with the right tRNA.
        - |
          Alanine (GCN) and cysteine (UGU, UGC) have different codons; the experiment put alanine at cysteine codons, which is why it was informative.
        - |
          The treatment was applied to the charged tRNA, not to the mRNA, and mRNA codons were unchanged; the misplacement came from the altered tRNA.
      answer: 1
      explanation: |
        The adapter hypothesis in one experiment: the code is read at codon-anticodon pairing, and the amino acid is a passenger. Synthetases, not ribosomes, are the proofreaders of the code.

    - slug: u06-w19-q10
      type: multiple_choice
      topic_code: "6.4"
      source: "Biology 2e §15.5 Ribosomes and Protein Synthesis"
      points: 1
      prompt: |
        Treating a ribosome with enzymes that destroy its proteins leaves peptide-bond formation largely intact, while treatment that destroys its RNA abolishes it. Which interpretation is best supported?
      options:
        - "Peptide bonds form spontaneously without catalysis."
        - "The peptidyl transferase activity of the ribosome is carried out by rRNA, so the ribosome is a ribozyme."
        - "Ribosomal proteins are the catalysts, and the RNA merely holds them in place."
        - "tRNA molecules catalyse peptide-bond formation."
      option_explanations:
        - |
          Peptide-bond formation is far too slow without a catalyst to support life; the experiment shows which component the catalyst is, not that there is none.
        - |
          Correct. Removing protein spares the activity and removing RNA destroys it, so the catalytic centre is RNA; this fits the idea that RNA preceded protein as a catalyst in early life.
        - |
          If proteins were the catalysts, destroying them would have abolished the activity; the data show the opposite.
        - |
          tRNAs are substrates that bring amino acids; the catalytic site is in the large subunit's rRNA, not in the tRNAs.
      answer: 1
      explanation: |
        Loss-of-function logic again: whichever component's removal removes the function is the component that performs it. The rRNA core of the ribosome is a relic of an RNA world.

    - slug: u06-w19-q11
      type: multiple_choice
      topic_code: "1.6"
      source: "Biology 2e §3.5 Nucleic Acids"
      points: 1
      prompt: |
        Review. Unlike DNA, RNA molecules such as tRNA and rRNA fold into stable three-dimensional shapes and can catalyse reactions. Which structural features of RNA make this possible?
      options:
        - "RNA is single-stranded, so its bases are free to pair with other regions of the same molecule, and its 2′-hydroxyl gives it extra chemical reactivity."
        - "RNA is double-stranded, which makes it rigid enough to act as a scaffold."
        - "RNA contains thymine, which forms three hydrogen bonds and stabilises folds."
        - "RNA lacks a sugar-phosphate backbone, so it is flexible."
      option_explanations:
        - |
          Correct. Intramolecular base pairing creates hairpins and loops that build a defined shape, and ribose's 2′-OH, absent in DNA, lets RNA take part in chemistry; together they make RNA a catalyst as well as a message.
        - |
          RNA is normally single-stranded; double-stranded DNA is the rigid, uniform helix that stores rather than acts.
        - |
          RNA has uracil in place of thymine, and it is G–C, not any thymine pair, that forms three hydrogen bonds.
        - |
          RNA has the same kind of backbone as DNA, with ribose in place of deoxyribose; the backbone is what makes self-pairing produce a stable fold.
      answer: 0
      explanation: |
        Structure to function at the molecular level: the chemistry that makes RNA less stable than DNA (the 2′-OH, single strands) is the chemistry that lets it fold and catalyse.

    - slug: u06-w19-q12
      type: multiple_choice
      topic_code: "1.7"
      source: "Biology 2e §3.4 Proteins"
      points: 1
      prompt: |
        Review. During elongation, peptidyl transferase joins the carboxyl group of the amino acid on the P-site tRNA to the amino group of the amino acid on the A-site tRNA. Which statement about the growing polypeptide follows?
      options:
        - "The chain grows at its carboxyl end, so the first amino acid translated is the N-terminus of the finished protein and each addition releases a water molecule equivalent."
        - "The chain grows at its amino end, so the first amino acid translated is the C-terminus."
        - "The peptide bond is a hydrogen bond, which is why it can be broken during folding."
        - "Both ends grow at once, which is why translation is fast."
      option_explanations:
        - |
          Correct. Each new residue's amino group attacks the chain's carboxyl end, so the polypeptide is built N → C, and the linkage is the same dehydration-synthesis peptide bond from Unit 1.
        - |
          The incoming amino acid supplies the amino group, so the chain's free amino end stays fixed and the carboxyl end is where growth happens.
        - |
          A peptide bond is covalent, formed by dehydration synthesis; hydrogen bonds form between backbone groups later, during folding, and are a different thing.
        - |
          A ribosome adds one residue at a time at one end; speed comes from many ribosomes on one mRNA, not from two-ended growth.
      answer: 0
      explanation: |
        The direction of synthesis (mRNA 5′ → 3′, polypeptide N → C) and the chemistry of the bond (covalent, dehydration) are the Unit 1 facts that make the ribosome's mechanism intelligible.

    - slug: u06-w19-q13
      type: multiple_choice
      topic_code: "2.1"
      source: "Biology 2e §4.2 Prokaryotic Cells"
      points: 1
      prompt: |
        Review. Electron micrographs of bacteria show ribosomes attached to an mRNA that is still being transcribed from the DNA. Which structural feature of a prokaryotic cell makes this possible, and why can a eukaryotic cell not do the same?
      options:
        - "Bacteria have more ribosomes than eukaryotes, so some are always near the DNA."
        - "Bacteria lack a nucleus, so transcription and translation occur in the same compartment; in eukaryotes the nuclear envelope separates them and the pre-mRNA must be processed and exported first."
        - "Bacterial ribosomes are smaller and can enter the nucleoid, whereas eukaryotic ribosomes are too large to enter the nucleus."
        - "Bacterial mRNA has no 5′ cap, so ribosomes can bind anywhere along it."
      option_explanations:
        - |
          Ribosome number is not the issue; a eukaryotic cell has millions of ribosomes yet none translate in the nucleus.
        - |
          Correct. Compartmentalisation (Unit 2) separates the two processes in eukaryotes and inserts processing between them; bacteria couple the two because nothing stands between the DNA and the cytoplasm.
        - |
          Ribosomal subunits are assembled in the eukaryotic nucleolus and exported through nuclear pores; size is not what keeps translation out of the nucleus, the organisation of the cell is.
        - |
          Bacterial ribosomes bind at a specific site (the Shine-Dalgarno sequence) upstream of each start codon, not anywhere; and the absence of a cap does not explain simultaneity.
      answer: 1
      explanation: |
        The nuclear envelope is a regulatory boundary: it is why eukaryotes can add processing, export and stability as control points that bacteria do not have (topic 6.5).

    - slug: u06-w19-q14
      type: multiple_choice
      topic_code: "3.1"
      source: "Biology 2e §6.5 Enzymes"
      points: 1
      prompt: |
        Review. There are twenty aminoacyl-tRNA synthetases, one for each amino acid, and each attaches its amino acid only to tRNAs with the appropriate anticodons. Which property of enzymes does this illustrate most directly?
      options:
        - "Enzymes are consumed in the reactions they catalyse."
        - "Enzyme specificity: the shape and chemistry of the active site admit only particular substrates."
        - "Enzymes raise the activation energy of the reactions they catalyse."
        - "Enzymes work only at a single fixed temperature."
      option_explanations:
        - |
          Enzymes are released unchanged after each cycle; a synthetase charges thousands of tRNAs.
        - |
          Correct. Each synthetase must recognise both one amino acid and the set of tRNAs that carry its anticodon; this double specificity is what makes the genetic code accurate.
        - |
          Enzymes lower activation energy; that is the whole point of catalysis.
        - |
          Enzymes have an optimum temperature, not a single fixed one; and temperature dependence is not what the twenty-enzyme arrangement illustrates.
      answer: 1
      explanation: |
        The reliability of translation is an enzyme-specificity problem: the synthetase's active site is where amino acid meets anticodon, so that is where the code is physically enforced.

    - slug: u06-w19-q15
      type: multi_select
      topic_code: "6.3"
      source: "Biology 2e §15.4 RNA Processing in Eukaryotes"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following happen to a eukaryotic pre-mRNA in the nucleus before it is exported for translation? Select all that apply.
      options:
        - "A 7-methylguanosine cap is added to the 5′ end"
        - "An RNA primer is added so that the ribosome can begin"
        - "Introns are removed and exons joined by the spliceosome"
        - "About 200 adenine nucleotides are added to the 3′ end"
        - "Thymine is replaced by uracil throughout the transcript"
      option_explanations:
        - |
          Correct. The cap is added early in transcription, protects the 5′ end and is the ribosome's recognition signal.
        - |
          Primers are a feature of DNA replication, not of RNA processing; ribosomes find the start codon by scanning from the cap.
        - |
          Correct. Splicing removes introns with single-nucleotide precision and, by choosing exons, can produce different mRNAs from one gene.
        - |
          Correct. The poly-A tail is added after cleavage at the AAUAAA signal and stabilises the message.
        - |
          RNA never contains thymine; uracil is incorporated during transcription, not substituted afterwards.
      answer: [0, 2, 3]
      explanation: |
        Cap, splice, tail: the three modifications that turn a pre-mRNA into a mature mRNA. Bacteria do none of them, which is one reason eukaryotic genes cannot simply be dropped into bacteria with their introns intact (week 22).

    - slug: u06-w19-q16
      type: multi_select
      topic_code: "2.9"
      source: "Biology 2e §4.4 The Endomembrane System and Proteins"
      points: 2
      partial_credit: true
      prompt: |
        Review. A pancreatic cell makes the digestive enzyme trypsinogen for secretion. Which structures take part in producing and delivering the finished protein to the outside of the cell? Select all that apply.
      options:
        - "Ribosomes bound to the rough endoplasmic reticulum, directed there by a signal sequence"
        - "The Golgi apparatus, which modifies and sorts the protein into vesicles"
        - "Secretory vesicles that fuse with the plasma membrane"
        - "The mitochondrial matrix, where the protein is folded"
        - "Free ribosomes in the cytosol, which make all secreted proteins"
      option_explanations:
        - |
          Correct. The signal sequence at the N-terminus halts the ribosome and docks it on the ER so the chain is threaded into the lumen as it is made.
        - |
          Correct. Proteins pass from the ER to the Golgi, where they are modified (for example glycosylated) and packaged for their destination.
        - |
          Correct. Exocytosis of vesicles delivers the contents outside the cell, the final step of the secretory pathway.
        - |
          Mitochondria import a few of their own proteins but play no part in secretion; folding of secreted proteins happens in the ER with chaperones.
        - |
          Free ribosomes make cytosolic, nuclear and most mitochondrial proteins; secreted and membrane proteins are made on ER-bound ribosomes.
      answer: [0, 1, 2]
      explanation: |
        Translation decides not only the sequence but the address: a signal sequence sends the ribosome to the ER, and the endomembrane system of Unit 2 does the rest.

    - slug: u06-w19-q17
      type: true_false
      topic_code: "6.4"
      source: "Biology 2e §15.5 Ribosomes and Protein Synthesis"
      points: 1
      prompt: |
        True or false: Because a stop codon is recognised by a release factor protein rather than by a tRNA, no amino acid is added when the ribosome reaches UAA, UAG or UGA.
      answer: true
      explanation: |
        True. The three stop codons have no complementary tRNA. A release factor enters the A site, catalyses the addition of water to the bond between the polypeptide and the P-site tRNA, and the chain is released. This is why the number of amino acids in a protein equals the number of sense codons read, not the total number of codons including the stop.

    - slug: u06-w19-q18
      type: true_false
      topic_code: "3.3"
      source: "Biology 2e §6.4 ATP: Adenosine Triphosphate"
      points: 1
      prompt: |
        Review. True or false: The GTP hydrolysed during tRNA entry and ribosome translocation plays the same role as ATP elsewhere in the cell, coupling an exergonic reaction to an otherwise unfavourable process.
      answer: true
      explanation: |
        True. GTP is a nucleoside triphosphate with the same kind of high-energy phosphoanhydride bonds as ATP; its hydrolysis by elongation factors drives conformational changes that move the ribosome and admit tRNAs. ATP is spent earlier, by the synthetases charging the tRNAs. Translation is among the most energy-expensive activities of a cell, which is one reason cells regulate it so closely.

    - slug: u06-w19-q19
      type: fill_blank
      topic_code: "6.3"
      source: "Biology 2e §15.4 RNA Processing in Eukaryotes"
      points: 1
      prompt: |
        In the eukaryotic nucleus, a complex of small nuclear RNAs and proteins called the ____ removes introns from a pre-mRNA and joins the exons.
      answer: ["spliceosome"]
      explanation: |
        The spliceosome recognises the GU at the 5′ end and the AG at the 3′ end of each intron, excises the intron and ligates the exons. It is itself largely RNA, another ribozyme-like machine. "Ribosome" is the protein-synthesising particle and is not accepted; "snRNP" names a component rather than the complex.

    - slug: u06-w19-q20
      type: fill_blank
      topic_code: "6.4"
      source: "Biology 2e §15.5 Ribosomes and Protein Synthesis"
      points: 1
      prompt: |
        The three-nucleotide sequence on a tRNA that base-pairs with a codon in the mRNA is called the ____.
      answer: ["anticodon"]
      explanation: |
        The anticodon pairs antiparallel with the codon, so a codon 5′-GAA-3′ is read by the anticodon 3′-CUU-5′. The amino acid is attached at the opposite end of the tRNA and plays no part in the pairing, as the cysteine-to-alanine experiment showed. "Codon" is the sequence on the mRNA, not on the tRNA.

    - slug: u06-w19-q21
      type: numeric
      topic_code: "6.4"
      source: "Biology 2e §15.1 The Genetic Code"
      points: 1
      prompt: |
        A mature mRNA has a coding region of 303 nucleotides, counted from the first base of the AUG start codon to the last base of the stop codon inclusive. How many amino acids does the polypeptide contain before any processing? Give a whole number.
      answer: { value: 100, tolerance: 0 }
      explanation: |
        303 ÷ 3 = 101 codons. One of those is the stop codon, which adds no amino acid, so 100 amino acids (including the initial methionine). Forgetting the stop gives 101; dividing the whole mRNA including untranslated regions would overcount. Each amino acid costs about four high-energy phosphate bonds (two in charging, two in elongation), so this small protein costs roughly 400.

    - slug: u06-w19-q22
      type: numeric
      topic_code: "1.7"
      source: "Biology 2e §3.4 Proteins"
      points: 1
      prompt: |
        Review. A polypeptide released from a ribosome contains 150 amino acids. How many water molecules were released in forming its peptide bonds? Give a whole number.
      answer: { value: 149, tolerance: 0 }
      explanation: |
        A linear chain of n monomers has n − 1 bonds, and each peptide bond forms by dehydration synthesis with the loss of one water: 150 − 1 = 149. On the ribosome the water is not released directly; the bond forms from the high-energy aminoacyl-tRNA linkage, but the net chemistry, amino plus carboxyl minus water, is the same as in Unit 1.

    - slug: u06-w19-q23
      type: short_answer
      topic_code: "6.3"
      source: "Biology 2e §15.4 RNA Processing in Eukaryotes"
      points: 4
      prompt: |
        Analyze data. The table shows the lifetime of two mRNAs in cultured human cells, measured as the time for half of the molecules to be degraded, and the amount of protein each produces.

        | mRNA | Poly-A tail length (nucleotides) | Half-life (hours) | Relative protein output |
        |---|---|---|---|
        | Transcript A | 200 | 9.0 | 100 |
        | Transcript B | 25 | 0.5 | 6 |

        (a) Describe the relationship between tail length, half-life and protein output. (b) Explain, in terms of the function of the poly-A tail, why the half-lives differ. (c) Propose one way a cell could use this relationship to regulate how much of a protein it makes without changing transcription of the gene.
      answer: |
        Longer tail, longer half-life, more protein. The tail protects the 3′ end from exonucleases; a short tail leaves the message vulnerable, so it is degraded sooner and is translated fewer times. A cell could lengthen or shorten tails (deadenylation), or bind proteins or miRNAs to the 3′ UTR that change tail length or stability.
      explanation: |
        Four points.

        (a) Describe, 1 pt: as tail length increases, half-life and protein output increase; transcript A with the 200-nucleotide tail lasts 18 times longer and yields about 17 times more protein than B. At least one numerical comparison is required.

        (b) Explain, 2 pts: 1 pt for the protective function of the poly-A tail against 3′ exonucleases, so a short-tailed message is degraded quickly; 1 pt for connecting lifetime to output: an mRNA that survives longer is translated by more ribosomes over its life, so protein accumulates. Accept the point about the tail aiding export or ribosome recruitment as an alternative second point if clearly linked to output.

        (c) Propose, 1 pt: any mechanism acting at the mRNA level, for example enzymes that shorten the tail (deadenylation) to speed degradation, RNA-binding proteins or microRNAs targeting the 3′ untranslated region that alter stability, or regulated tail lengthening in the cytoplasm. The proposal must leave transcription unchanged.

        Zero: answers claiming the tail is translated into part of the protein, or that explain the data by the two genes being transcribed at different rates.

    - slug: u06-w19-q24
      type: short_answer
      topic_code: "6.4"
      source: "general knowledge"
      points: 4
      prompt: |
        Conceptual analysis. A bacterial gene acquires a nonsense mutation that converts a glutamine codon (CAG) to the stop codon UAG, so no functional protein is made. A second mutation elsewhere in the genome then restores production of the full-length protein. Sequencing shows the second mutation is in a tRNA gene: the tRNA that normally carries tyrosine now has the anticodon 3′-AUC-5′. (a) Explain how the second mutation restores the full-length protein. (b) Identify which amino acid is inserted at the position of the original glutamine. (c) Predict one cost to the cell of carrying this suppressor tRNA, and justify it.
      answer: |
        The altered tyrosine tRNA's anticodon now pairs with UAG, so the ribosome inserts tyrosine at the premature stop instead of terminating, and translation continues to the normal stop. Tyrosine replaces glutamine. Cost: the suppressor also reads the genuine UAG stops of other genes, producing abnormally extended proteins, and the cell loses one of its tyrosine tRNAs for normal UAC/UAU codons.
      explanation: |
        Four points.

        (a) Explain, 2 pts: 1 pt for recognising that the mutant anticodon 3′-AUC-5′ is complementary to 5′-UAG-3′, so a charged tRNA, rather than a release factor, now occupies the A site at that codon; 1 pt for the consequence: an amino acid is added and the ribosome reads through to the gene's normal stop codon, producing a full-length chain. Accept the term "suppressor tRNA" if the mechanism is stated.

        (b) Identify, 1 pt: tyrosine, because charging is done by the synthetase, which recognises the tRNA body and attaches its usual amino acid; the anticodon change does not alter which amino acid is loaded. A student who says glutamine has missed that the amino acid follows the tRNA, not the codon.

        (c) Cost and justification, 1 pt: any of: other genes that legitimately end in UAG are now read through, producing longer, possibly nonfunctional proteins; reduced supply of tRNA for tyrosine's normal codons slows translation of other proteins; the substituted tyrosine may only partly restore the protein's function. The cost must be tied to the mechanism.

        Zero: answers that describe the second mutation as reversing the first (it is in a different gene), or that have the ribosome inserting glutamine.

    - slug: u06-w19-q25
      type: long_answer
      topic_code: "6.3"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. Researchers made four versions of the same eukaryotic mRNA in a test tube and added each to a cell-free translation system prepared from eukaryotic cells (containing ribosomes, tRNAs, synthetases, amino acids and energy). The amount of protein made after 60 minutes is shown relative to the complete mRNA. In a second experiment the same four mRNAs were added to a translation system prepared from E. coli.

        | mRNA version | 5′ cap | Poly-A tail | Introns removed | Protein in eukaryotic system (%) | Protein in E. coli system (%) |
        |---|---|---|---|---|---|
        | 1 | yes | yes | yes | 100 | 3 |
        | 2 | no | yes | yes | 8 | 3 |
        | 3 | yes | no | yes | 41 | 3 |
        | 4 | yes | yes | no | 2 | 3 |

        (a) Identify the independent and dependent variables and describe the purpose of including version 1.
        (b) Describe the effect of removing the cap and of removing the tail in the eukaryotic system, using the data.
        (c) Explain why version 2 produced so little protein in the eukaryotic system, and why version 3 produced an intermediate amount, in terms of what each structure does.
        (d) Explain why version 4 produced almost no functional protein even though it was capped and tailed.
        (e) Every version produced about 3% in the E. coli system. Explain this result in terms of how bacterial ribosomes initiate translation, and predict what would need to be added to the eukaryotic mRNA for E. coli ribosomes to translate it efficiently.
      answer: |
        IV: which structures the mRNA carries (and the type of translation system); DV: protein produced; version 1 is the positive control. Removing the cap cut output to 8%, removing the tail to 41%. The cap is what the eukaryotic small subunit binds to find the start codon, so without it initiation almost fails; the tail stabilises the message and helps initiation but ribosomes can still find the cap, so output is reduced rather than abolished. Version 4 still contains introns, so the reading frame is interrupted by non-coding sequence and the translated product is wrong or truncated. E. coli ribosomes initiate at a Shine-Dalgarno sequence just upstream of AUG, which eukaryotic mRNAs lack, and they ignore the cap; adding a Shine-Dalgarno sequence (as in an expression vector) would allow efficient translation.
      explanation: |
        Eight points.

        (a) 1 pt: independent variable, the presence or absence of each processing feature (cap, tail, splicing), with the translation system as a second variable in the comparison; dependent variable, the relative amount of protein produced in 60 minutes; version 1 is the fully processed positive control against which the others are compared (100%).

        (b) 1 pt: removing the cap reduced output from 100% to 8%; removing the tail reduced it to 41%; the cap's loss had the larger effect. Numbers required.

        (c) 2 pts: 1 pt for the cap: the eukaryotic 40S subunit recognises and binds the 5′ cap and scans to the first AUG, so an uncapped mRNA is barely initiated (and is also exposed to 5′ exonucleases); 1 pt for the tail: the poly-A tail protects the 3′ end and promotes initiation by interacting with cap-binding factors, so without it the message is less stable and less efficiently translated, but initiation at the cap still occurs, giving a partial reduction.

        (d) 2 pts: 1 pt for recognising that unspliced mRNA retains introns within the coding region; 1 pt for the consequence: the ribosome reads intron sequence as if it were codons, producing a protein with extra residues, a shifted frame or a premature stop, so little or no functional protein is detected (accept that in cells such an mRNA would normally not be exported at all).

        (e) 2 pts: 1 pt for the explanation that bacterial ribosomes do not use the cap; their 30S subunit binds a Shine-Dalgarno sequence paired with 16S rRNA, which eukaryotic mRNAs lack, so initiation is inefficient for all four versions regardless of processing; 1 pt for the prediction that inserting a Shine-Dalgarno sequence a few bases upstream of the AUG (with or without a bacterial promoter for transcription) would allow efficient bacterial translation. Accept the observation that this is why cDNA (intron-free) in a bacterial expression vector is used to make human proteins in E. coli.

        Zero for a part: describing effects as "less protein" without numbers; claiming the cap or tail is translated; attributing the E. coli result to the genetic code being different in bacteria (it is nearly universal); claiming bacteria cannot translate any eukaryotic sequence.
