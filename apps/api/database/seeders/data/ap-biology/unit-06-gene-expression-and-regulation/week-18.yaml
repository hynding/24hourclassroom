week: 18
unit: 6
title: DNA and RNA Structure; DNA Replication
topics: ["6.1", "6.2"]
guide: guides/week-18.md
guide_description: |
  How we know DNA is the hereditary molecule (Griffith, Avery, Hershey-Chase, Chargaff), what the double helix
  looks like in numbers, how prokaryotes and eukaryotes package their genomes (plasmids, histones, nucleosomes),
  and how the molecule copies itself: Meselson-Stahl as a data item, the enzymes at the fork, leading and lagging
  strands, and why synthesis only ever runs 5′ to 3′. Three worked examples, misconceptions, self-check.
flashcards_description: |
  34 cards: the classic experiments, helix numbers, genome packaging, the replication models and every enzyme at the fork.

flashcards:
  - front: Griffith's transformation experiment → result and conclusion
    back: |
      Heat-killed smooth (virulent) pneumococci mixed with live rough (harmless) cells killed mice, and live smooth cells were recovered. Something from the dead cells, the transforming principle, had changed the live ones heritably.
    topic_code: "6.1"
  - front: Avery, MacLeod and McCarty → how they identified the transforming principle
    back: |
      They destroyed one component of the smooth-cell extract at a time with specific enzymes. Only destroying DNA abolished transformation; removing protein or RNA did not. DNA was the transforming principle.
    hint: Which enzyme treatment broke the effect?
    topic_code: "6.1"
  - front: Hershey-Chase experiment → the two labels and what each result showed
    back: |
      Phage protein was labelled with ³⁵S, phage DNA with ³²P. After infection and blending, ³²P was in the bacterial pellet and ³⁵S stayed in the supernatant with the empty coats. DNA, not protein, enters the host and directs new phage.
    hint: Sulfur is in proteins and not DNA; phosphorus is in DNA and not most proteins.
    topic_code: "6.1"
  - front: Chargaff's rules → the two equalities and what they imply
    back: |
      In double-stranded DNA, A = T and G = C, so purines = pyrimidines, while the A+T : G+C ratio varies between species. The equalities are explained by complementary base pairing; the variable ratio means DNA can carry species-specific information.
    topic_code: "6.1"
  - front: Double helix in numbers → rise per base pair, length per turn, diameter
    back: |
      0.34 nm per base pair, 3.4 nm per turn (so 10 base pairs per turn), 2 nm across. The constant diameter is because every rung is one two-ring purine paired with one one-ring pyrimidine.
    topic_code: "6.1"
  - front: Why is the DNA double helix the same width all the way along?
    back: |
      A purine always pairs with a pyrimidine, two rings plus one ring. Two purines would be too wide and two pyrimidines too narrow; A–T and G–C are the only pairs that both fit and hydrogen-bond correctly.
    topic_code: "6.1"
  - front: Prokaryotic genome → shape, location and packaging
    back: |
      Usually one circular chromosome in the nucleoid (no membrane), compacted by supercoiling with the help of enzymes such as DNA gyrase. E. coli's chromosome is about 4.6 million base pairs.
    topic_code: "6.1"
  - front: Plasmid → what it is and why it matters
    back: |
      A small circular DNA molecule, separate from the chromosome, that replicates on its own. Plasmids often carry genes such as antibiotic resistance, can pass between bacteria, and are the vectors of recombinant DNA work.
    topic_code: "6.1"
  - front: Nucleosome → the structure
    back: |
      About 147 base pairs of DNA wound roughly twice around an octamer of histone proteins (two each of four kinds), with linker DNA between nucleosomes. Under the microscope the chain looks like beads on a string.
    topic_code: "6.1"
  - front: Why do histones bind DNA so tightly?
    back: |
      Histones are rich in lysine and arginine, whose R groups are positively charged at cell pH, and the DNA backbone is a line of negatively charged phosphates. Opposite charges attract; neutralising the histone charge (acetylation) loosens the grip.
    topic_code: "6.1"
  - front: Histone coiling → the levels of eukaryotic DNA packaging
    back: |
      Double helix (2 nm) → nucleosomes on a string (about 10 nm) → 30-nm fibre coiled with the help of a fifth histone → looped domains on a protein scaffold → metaphase chromosome (about 700 nm wide). Packing shortens the molecule thousands of times.
    topic_code: "6.1"
  - front: Heterochromatin vs euchromatin
    back: |
      Heterochromatin is tightly packed, stains densely and is transcriptionally silent (centromeres, telomeres). Euchromatin is loosely packed, nucleosomes spaced out, and is where active genes are read.
    topic_code: "6.1"
  - front: Which genetic material do some viruses use instead of DNA?
    back: |
      RNA. Retroviruses and many other viruses carry a single- or double-stranded RNA genome; retroviruses copy it into DNA with reverse transcriptase before it can be transcribed by the host.
    topic_code: "6.1"
  - front: Three models of DNA replication → what each predicted
    back: |
      Conservative: the parent helix stays intact and a wholly new helix is made. Semiconservative: each daughter helix has one old and one new strand. Dispersive: old and new DNA are interspersed along both strands of both daughters.
    topic_code: "6.2"
  - front: Meselson-Stahl → the design
    back: |
      E. coli grown for many generations in heavy ¹⁵N so all DNA was heavy, then switched to ¹⁴N medium. DNA was extracted after each generation and spun in a caesium chloride density gradient, where it bands at its buoyant density.
    topic_code: "6.2"
  - front: Meselson-Stahl → the result after one and after two generations
    back: |
      Generation 1: a single band at intermediate density, which rules out conservative (no heavy band). Generation 2: one intermediate band and one light band in equal amounts, which rules out dispersive (dispersive would give a single band drifting lighter). Only semiconservative fits.
    hint: Count the bands in generation 2.
    topic_code: "6.2"
  - front: Density gradient centrifugation → the principle
    back: |
      A caesium chloride solution spun at very high speed forms a density gradient; a molecule sinks or floats until it reaches the layer whose density matches its own buoyant density, forming a band there.
    topic_code: "6.2"
  - front: Origin of replication → what marks it
    back: |
      A specific sequence (about 245 base pairs in E. coli) rich in A–T pairs, which need only two hydrogen bonds each and so separate more easily. Initiator proteins bind there and open the helix.
    topic_code: "6.2"
  - front: Helicase → job at the fork
    back: |
      Breaks the hydrogen bonds between the two strands, using ATP, so the helix unzips into two single-stranded templates. Creates the Y-shaped replication fork.
    topic_code: "6.2"
  - front: Single-strand binding proteins → why they are needed
    back: |
      They coat the separated strands so the complementary bases cannot re-pair behind helicase before the polymerase arrives.
    topic_code: "6.2"
  - front: Topoisomerase → the problem it solves
    back: |
      Unwinding at the fork overtwists the DNA ahead of it. Topoisomerase cuts a strand, lets the helix relax, and reseals it, preventing the supercoiling that would otherwise stall the fork.
    topic_code: "6.2"
  - front: Why does DNA polymerase need an RNA primer?
    back: |
      Polymerase can only add a nucleotide to an existing free 3′-OH; it cannot start a strand from nothing. Primase, an RNA polymerase, lays down a 5-10 nucleotide RNA primer that provides the first 3′-OH.
    topic_code: "6.2"
  - front: DNA polymerase III → direction, requirements and energy source
    back: |
      The main replicating enzyme. Reads the template 3′ to 5′ and builds the new strand 5′ to 3′, adding each nucleoside triphosphate to the free 3′-OH; the two phosphates released drive the phosphodiester bond.
    topic_code: "6.2"
  - front: Why does DNA synthesis run only 5′ to 3′?
    back: |
      The energy for each bond comes from the incoming nucleotide's own triphosphate, which sits on its 5′ carbon. That triphosphate must attack the chain's 3′-OH, so the chain can only grow at its 3′ end.
    topic_code: "6.2"
  - front: Leading strand vs lagging strand
    back: |
      Leading: made continuously toward the fork from one primer, on the template that runs 3′ to 5′ into the fork. Lagging: made in short pieces away from the fork, each needing its own primer, on the template that runs 5′ to 3′ into the fork.
    hint: Both are built 5′ to 3′; only the template orientation differs.
    topic_code: "6.2"
  - front: Okazaki fragments → what and where
    back: |
      The short DNA pieces (a few hundred nucleotides in bacteria, shorter in eukaryotes) made on the lagging strand, each begun by its own RNA primer and later joined by ligase.
    topic_code: "6.2"
  - front: DNA polymerase I → its job in replication
    back: |
      Removes the RNA primers with its exonuclease activity and replaces them with DNA nucleotides, working from the 3′-OH of the neighbouring fragment.
    topic_code: "6.2"
  - front: DNA ligase → the bond it makes
    back: |
      Forms the last phosphodiester bond between adjacent Okazaki fragments (or any nick), sealing the sugar-phosphate backbone. Without it the lagging strand stays in pieces.
    topic_code: "6.2"
  - front: Sliding clamp → function
    back: |
      A ring-shaped protein that encircles the DNA and holds the polymerase on the template so it does not fall off after a few nucleotides (PCNA in eukaryotes).
    topic_code: "6.2"
  - front: Replication fork → why there are two per origin
    back: |
      Opening the helix at an origin creates a bubble with a fork on each side; both forks move away from the origin, so replication is bidirectional.
    topic_code: "6.2"
  - front: E. coli replication in numbers
    back: |
      About 4.6 million base pairs, one origin, about 1,000 nucleotides per second per fork, finishing in about 42 minutes.
    topic_code: "6.2"
  - front: How eukaryotic replication differs from prokaryotic
    back: |
      Many origins per chromosome (up to about 100,000 in a human cell), slower forks (about 50-100 nucleotides per second), linear chromosomes with telomeres, nucleosomes to pass, and polymerases α, δ and ε in place of Pol III.
    topic_code: "6.2"
  - front: End-replication problem and telomerase
    back: |
      On a linear chromosome the last lagging-strand primer cannot be replaced with DNA, so each round shortens the 5′ end. Telomerase carries its own RNA template and extends the 3′ end with repeats (TTAGGG in humans), active in germ and stem cells and in most cancers.
    topic_code: "6.2"
  - front: Proofreading by DNA polymerase
    back: |
      The polymerase checks each new base pair; a mismatch is cut out by its 3′ exonuclease activity and the correct nucleotide inserted before synthesis continues. Mismatch repair catches what proofreading misses.
    topic_code: "6.2"

quiz:
  description: |
    25 questions · about 30 minutes · about 70% this week (DNA and RNA structure, genome packaging, replication)
    and 30% review of nucleic acids and proteins (Unit 1), cell structure (Unit 2), energy (Unit 3), the cell
    cycle (Unit 4) and meiosis (Unit 5). Multiple choice, select-all, true/false and numeric items are graded at
    once; the fill-in-the-blank items are matched automatically; the two short answers and the long answer are
    graded by your teacher against the acceptable-answer summary.
  questions:
    - slug: u06-w18-q01
      type: multiple_choice
      topic_code: "6.1"
      source: "Biology 2e §14.1 Historical Basis of Modern Understanding"
      points: 1
      prompt: |
        In the Hershey-Chase experiment, phage labelled with ³²P left most of the radioactivity in the bacterial pellet after blending and centrifugation, while phage labelled with ³⁵S left most of it in the supernatant. Which inference is best supported?
      options:
        - "Protein enters the host cell and directs the production of new phage."
        - "DNA enters the host cell and is the material that directs the production of new phage."
        - "Both DNA and protein enter the host cell in equal amounts."
        - "Sulfur is a component of DNA and phosphorus a component of protein."
      option_explanations:
        - |
          The ³⁵S label marks protein, and it stayed outside the cells with the empty coats; protein did not go in, so it cannot be what directed the infection.
        - |
          Correct. Phosphorus is in DNA and not in the phage coat; its appearance inside the cells, together with the production of new labelled phage from those cells, shows that DNA is the hereditary material.
        - |
          The two labels ended up in different fractions, which is exactly the point: one component went in and the other stayed out.
        - |
          The chemistry is backwards: sulfur is found in proteins (cysteine, methionine) and not in DNA, while phosphorus is in the DNA backbone. The labels were chosen for that reason.
      answer: 1
      explanation: |
        A good experiment uses a label that is unique to one component. Hershey and Chase could separate the two possible hereditary molecules because each carries an element the other lacks.

    - slug: u06-w18-q02
      type: multiple_choice
      topic_code: "6.1"
      source: "Biology 2e §14.1 Historical Basis of Modern Understanding"
      points: 1
      prompt: |
        The base composition of nucleic acid extracted from four samples is shown as a percentage of total bases.

        | Sample | A | T | U | G | C |
        |---|---|---|---|---|---|
        | 1 | 31 | 31 | 0 | 19 | 19 |
        | 2 | 24 | 0 | 33 | 21 | 22 |
        | 3 | 28 | 22 | 0 | 27 | 23 |
        | 4 | 22 | 22 | 0 | 28 | 28 |

        Which sample is most likely single-stranded DNA?
      options:
        - "Sample 1"
        - "Sample 2"
        - "Sample 3"
        - "Sample 4"
      option_explanations:
        - |
          Sample 1 obeys Chargaff's equalities (A = T, G = C) with thymine present, which is the signature of double-stranded DNA, not of a single strand.
        - |
          Sample 2 contains uracil and no thymine, so it is RNA; the question asks about DNA.
        - |
          Correct. Thymine is present (DNA), but A does not equal T and G does not equal C, which is only possible if there is no complementary partner strand enforcing the pairing.
        - |
          Sample 4 has A = T and G = C with thymine: a double-stranded DNA with a different A+T : G+C ratio from sample 1, perhaps from another species.
      answer: 2
      explanation: |
        Chargaff's equalities are a consequence of base pairing between two strands. A DNA that breaks them must be single-stranded; a sample with uracil is RNA regardless of its ratios.

    - slug: u06-w18-q03
      type: multiple_choice
      topic_code: "6.1"
      source: "Biology 2e §14.2 DNA Structure and Sequencing"
      points: 1
      prompt: |
        A human cell nucleus about 6 μm across holds roughly 2 metres of DNA. Which description of how that is achieved is correct?
      options:
        - "The DNA is cut into short pieces during interphase and rejoined before mitosis."
        - "DNA winds around histone octamers to form nucleosomes, which coil into a 30-nm fibre that loops onto a scaffold, with the tightest packing at metaphase."
        - "The DNA is dehydrated so that the helix shrinks to a fraction of its length."
        - "Supercoiling by DNA gyrase in the nucleoid compresses the single circular chromosome."
      option_explanations:
        - |
          The chromosome is a single continuous molecule throughout the cycle; cutting it would create breaks that the cell treats as damage.
        - |
          Correct. Histone coiling is hierarchical: beads on a string, then the 30-nm fibre, then loops and a condensed chromosome, each level shortening the molecule further.
        - |
          The helix dimensions (0.34 nm per base pair) do not change; the length is managed by folding, not shrinking.
        - |
          Supercoiling in a nucleoid is the prokaryotic solution; eukaryotes have linear chromosomes in a nucleus and use histones.
      answer: 1
      explanation: |
        Packaging is also regulation: the levels of coiling that fit DNA into the nucleus are the same levels the cell loosens or tightens to switch genes on and off (topic 6.5).

    - slug: u06-w18-q04
      type: multiple_choice
      topic_code: "6.1"
      source: "Biology 2e §14.2 DNA Structure and Sequencing"
      points: 1
      prompt: |
        A newly discovered bacterium is found to carry, besides its chromosome, several small circular DNA molecules, one of which includes a gene for resistance to tetracycline. Which statement about these molecules is best supported?
      options:
        - "They are plasmids, which replicate independently of the chromosome and can carry genes that benefit the cell under particular conditions."
        - "They are fragments of the chromosome broken off during binary fission and will soon be degraded."
        - "They are the bacterium's histone-bound chromatin."
        - "They are viral genomes that always kill the host cell."
      option_explanations:
        - |
          Correct. Plasmids are extra-chromosomal circles with their own origins; antibiotic-resistance genes are a classic plasmid cargo, which is why resistance spreads so readily between bacteria.
        - |
          Chromosome fragments would be linear, would lack an origin of replication and would not be stably maintained; circular self-replicating molecules carrying useful genes are plasmids.
        - |
          Bacteria do not package DNA with histones in nucleosomes; that is a eukaryotic feature.
        - |
          Some phage DNA can exist in a circular form in a host, but a stably inherited circle carrying a resistance gene is a plasmid, and the cell is clearly thriving, not being killed.
      answer: 0
      explanation: |
        Plasmids are the units of horizontal gene transfer (week 21) and the vectors of genetic engineering (week 22). Their independence from the chromosome is the key property in both roles.

    - slug: u06-w18-q05
      type: multiple_choice
      topic_code: "6.2"
      source: "Biology 2e §14.3 Basics of DNA Replication"
      points: 1
      stimulus: |
        Meselson and Stahl grew E. coli for many generations in medium containing only heavy nitrogen (¹⁵N), then transferred the cells to medium containing only light nitrogen (¹⁴N). DNA was extracted at intervals and centrifuged in a caesium chloride density gradient. The position of each band and its share of the total DNA are shown.

        | Generations in ¹⁴N | Heavy band (¹⁵N/¹⁵N) | Intermediate band (¹⁵N/¹⁴N) | Light band (¹⁴N/¹⁴N) |
        |---|---|---|---|
        | 0 | 100% | 0% | 0% |
        | 1 | 0% | 100% | 0% |
        | 2 | 0% | 50% | 50% |
        | 3 | 0% | 25% | 75% |
      prompt: |
        Which model of replication is ruled out by the result after one generation alone?
      options:
        - "Semiconservative, because it predicts a heavy band after one generation."
        - "Conservative, because it predicts one heavy band and one light band, and no intermediate band, after one generation."
        - "Dispersive, because it predicts a light band after one generation."
        - "No model is ruled out by one generation; two generations are needed."
      option_explanations:
        - |
          Semiconservative predicts exactly what was seen: every daughter helix has one heavy and one light strand, so a single intermediate band. It survives generation 1.
        - |
          Correct. If the parental helix stayed intact, the heavy band would persist and new DNA would form a separate light band; the complete absence of a heavy band after one round eliminates conservative replication.
        - |
          Dispersive replication also predicts a single intermediate band after one generation (each strand half old, half new), so it survives generation 1; it is eliminated only in generation 2.
        - |
          One generation is enough to eliminate conservative replication; two generations are needed to separate the remaining two models.
      answer: 1
      explanation: |
        Read the generation-1 row and ask what each model would have produced. Conservative is the only one that cannot produce a single intermediate band.

    - slug: u06-w18-q06
      type: multiple_choice
      topic_code: "6.2"
      source: "Biology 2e §14.3 Basics of DNA Replication"
      points: 1
      stimulus: |
        Meselson and Stahl grew E. coli for many generations in medium containing only heavy nitrogen (¹⁵N), then transferred the cells to medium containing only light nitrogen (¹⁴N). DNA was extracted at intervals and centrifuged in a caesium chloride density gradient. The position of each band and its share of the total DNA are shown.

        | Generations in ¹⁴N | Heavy band (¹⁵N/¹⁵N) | Intermediate band (¹⁵N/¹⁴N) | Light band (¹⁴N/¹⁴N) |
        |---|---|---|---|
        | 0 | 100% | 0% | 0% |
        | 1 | 0% | 100% | 0% |
        | 2 | 0% | 50% | 50% |
        | 3 | 0% | 25% | 75% |
      prompt: |
        Which feature of the generation-2 result distinguishes semiconservative from dispersive replication?
      options:
        - "The presence of two distinct bands; dispersive replication would give a single band lighter than intermediate."
        - "The absence of a heavy band; dispersive replication would regenerate a heavy band."
        - "The light band is exactly 50%; dispersive replication would give 75% light."
        - "Nothing; both models predict two bands in generation 2."
      option_explanations:
        - |
          Correct. Under dispersive replication every strand is a mosaic, so every helix in generation 2 would be one quarter heavy and all DNA would sit in one band between intermediate and light. Two separate bands mean whole strands are conserved.
        - |
          Neither model regenerates a heavy band after the switch to ¹⁴N; the absence of a heavy band does not separate them.
        - |
          Dispersive replication does not produce a light band at all in generation 2, so there is no 75% to compare; the issue is the number of bands, not the share.
        - |
          Dispersive replication predicts a single band in every generation, gradually drifting lighter; only semiconservative gives two.
      answer: 0
      explanation: |
        Semiconservative replication keeps each parental strand intact, which is why a fully light helix can exist by generation 2. Dispersive replication would smear old material through every strand forever.

    - slug: u06-w18-q07
      type: multiple_choice
      topic_code: "6.2"
      source: "Biology 2e §14.3 Basics of DNA Replication"
      points: 1
      stimulus: |
        Meselson and Stahl grew E. coli for many generations in medium containing only heavy nitrogen (¹⁵N), then transferred the cells to medium containing only light nitrogen (¹⁴N). DNA was extracted at intervals and centrifuged in a caesium chloride density gradient. The position of each band and its share of the total DNA are shown.

        | Generations in ¹⁴N | Heavy band (¹⁵N/¹⁵N) | Intermediate band (¹⁵N/¹⁴N) | Light band (¹⁴N/¹⁴N) |
        |---|---|---|---|
        | 0 | 100% | 0% | 0% |
        | 1 | 0% | 100% | 0% |
        | 2 | 0% | 50% | 50% |
        | 3 | 0% | 25% | 75% |
      prompt: |
        Suppose the generation-2 culture had been returned to ¹⁵N medium for one further generation. Which banding pattern does semiconservative replication predict?
      options:
        - "100% intermediate."
        - "50% heavy, 50% intermediate."
        - "25% heavy, 50% intermediate, 25% light."
        - "50% intermediate, 50% light."
      option_explanations:
        - |
          Only the strands made in this generation would be heavy; the old light and intermediate strands do not disappear, so more than one band must form.
        - |
          Correct. Each helix separates and pairs each old strand with a new heavy strand. The two ¹⁵N strands from the intermediate helices give two heavy helices; the two ¹⁴N strands from each light helix give two intermediate helices. The result is equal heavy and intermediate.
        - |
          A light helix would require two ¹⁴N strands in one molecule, but every new strand in this generation is heavy; no light band can form.
        - |
          This is the pattern the culture already shows; it would persist only if no replication occurred.
      answer: 1
      explanation: |
        To predict a semiconservative result, list the strands present, split every helix, and pair each old strand with a new strand of the current medium. The bookkeeping is the whole skill.

    - slug: u06-w18-q08
      type: multiple_choice
      topic_code: "6.2"
      source: "Biology 2e §14.4 DNA Replication in Prokaryotes"
      points: 1
      prompt: |
        A diagram of a replication fork shows one new strand being built continuously toward the fork and the other being built in short segments pointing away from the fork. Which statement explains why the two strands are built differently?
      options:
        - "The two template strands are antiparallel and DNA polymerase can only add nucleotides to a 3′-OH, so only one new strand can grow continuously toward the fork."
        - "One template strand is made of RNA and the other of DNA, so they require different enzymes."
        - "Helicase unwinds the two strands at different speeds."
        - "The leading strand is built by DNA polymerase and the lagging strand by primase."
      option_explanations:
        - |
          Correct. Both new strands grow 5′ → 3′. On the template that runs 3′ → 5′ into the fork that direction follows the fork; on the other template it points away, so synthesis must restart repeatedly as new template is exposed.
        - |
          Both templates are DNA; the only RNA at the fork is the short primers that start each piece.
        - |
          Helicase unwinds the one double helix at one fork; it does not treat the strands separately. The difference arises from polymerase chemistry, not unwinding speed.
        - |
          Primase makes only the RNA primers; DNA polymerase III builds both the leading and the lagging strand.
      answer: 0
      explanation: |
        Two facts generate the whole picture: strands are antiparallel, and polymerase extends only a 3′ end. Everything else about leading and lagging strands is a consequence.

    - slug: u06-w18-q09
      type: multiple_choice
      topic_code: "6.2"
      source: "Biology 2e §14.4 DNA Replication in Prokaryotes"
      points: 1
      prompt: |
        A researcher adds purified DNA polymerase III, all four deoxynucleoside triphosphates and single-stranded template DNA to a tube, but no DNA is synthesised. Adding one more component starts synthesis. Which component, and why?
      options:
        - "Helicase, because the template must be unwound before polymerase can read it."
        - "A primer with a free 3′-OH, because DNA polymerase can only extend an existing strand, not start one."
        - "DNA ligase, because the new nucleotides must be sealed together as they are added."
        - "Topoisomerase, because the single strand is supercoiled."
      option_explanations:
        - |
          The template is already single-stranded, so there is nothing for helicase to unwind; the missing requirement is a starting point for the polymerase.
        - |
          Correct. Every DNA polymerase needs an existing 3′-hydroxyl to attack the incoming nucleotide's triphosphate; in the cell primase supplies it as an RNA primer, in a tube a short synthetic oligonucleotide will do.
        - |
          Ligase joins the backbone between separately made fragments; polymerase itself forms the phosphodiester bond with each nucleotide it adds.
        - |
          Supercoiling is a property of a double helix under torsion; a single strand has no helix to overtwist.
      answer: 1
      explanation: |
        The primer requirement explains why primase exists, why Okazaki fragments each begin with RNA, why Pol I is needed to replace it, and why linear chromosomes shorten (the end-replication problem).

    - slug: u06-w18-q10
      type: multiple_choice
      topic_code: "6.2"
      source: "Biology 2e §14.4 DNA Replication in Prokaryotes"
      points: 1
      prompt: |
        A bacterial strain carries a mutation that inactivates DNA ligase at 42 °C. If the strain is shifted to 42 °C and allowed to replicate its DNA, which result is predicted?
      options:
        - "No DNA synthesis at all, because ligase initiates replication."
        - "The leading strand is made normally, but the lagging strand accumulates as unjoined short fragments."
        - "Both strands are made in short fragments that are never joined."
        - "RNA primers are never removed, so the DNA remains a DNA-RNA hybrid."
      option_explanations:
        - |
          Replication is initiated by proteins at the origin and by primase and helicase; ligase acts last, so synthesis proceeds without it.
        - |
          Correct. The leading strand is one continuous piece and needs no joining (except at the origin). The lagging strand is made as Okazaki fragments whose backbones must be sealed by ligase; without it they stay separate.
        - |
          Only the lagging strand is made discontinuously; the leading strand grows as a single molecule from one primer.
        - |
          Primer removal and replacement is the job of DNA polymerase I, which is unaffected. The gaps are filled with DNA, but the final phosphodiester bond cannot be made.
      answer: 1
      explanation: |
        Loss-of-function reasoning: ask which step the enzyme performs and which strand depends on it. Okazaki fragments are the ligase-dependent product, which is how they were discovered.

    - slug: u06-w18-q11
      type: multiple_choice
      topic_code: "6.2"
      source: "Biology 2e §14.5 DNA Replication in Eukaryotes"
      points: 1
      prompt: |
        Telomerase is inactive in most human somatic cells but active in germ cells, stem cells and most cancer cells. Which explanation best connects those facts to the end-replication problem?
      options:
        - "Somatic cells do not replicate their DNA, so they do not need telomerase."
        - "Cells that must divide many times need telomerase to extend chromosome ends, because each round of replication otherwise leaves the 5′ end of the lagging strand shorter."
        - "Telomerase repairs mismatches, which occur more often in rapidly dividing cells."
        - "Telomerase adds a primer to the leading strand so that the chromosome can be copied."
      option_explanations:
        - |
          Somatic cells do replicate their DNA when they divide; their telomeres shorten with each division, which is part of why they divide a limited number of times.
        - |
          Correct. The last RNA primer on the lagging strand cannot be replaced by DNA. Telomerase, using its own RNA template, lengthens the 3′ overhang with repeats so that the loss falls on non-coding sequence. Lineages that must divide indefinitely need it.
        - |
          Mismatch repair is a separate system of enzymes; telomerase adds repeat sequence to chromosome ends and does not correct errors.
        - |
          The leading strand has no end problem; it is the lagging strand's final primer that cannot be replaced, and telomerase adds DNA, not a primer.
      answer: 1
      explanation: |
        Telomerase is the cell's answer to a constraint built into polymerase chemistry. Its activity pattern across cell types is a clue to which cells must divide without limit.

    - slug: u06-w18-q12
      type: multiple_choice
      topic_code: "1.6"
      source: "Biology 2e §3.5 Nucleic Acids"
      points: 1
      prompt: |
        Review. A single DNA strand is drawn with its sugar-phosphate backbone. Which statement correctly describes the two ends of the strand?
      options:
        - "One end carries a free phosphate on the 5′ carbon of its sugar; the other carries a free hydroxyl on the 3′ carbon."
        - "Both ends carry a free phosphate, because every nucleotide has one."
        - "One end carries a nitrogenous base and the other does not."
        - "The two ends are chemically identical; direction is assigned arbitrarily."
      option_explanations:
        - |
          Correct. Each phosphodiester bond joins the 3′ carbon of one sugar to the 5′ phosphate of the next, so the chain starts with an unused 5′ phosphate and ends with an unused 3′-OH.
        - |
          Every nucleotide has a phosphate, but each internal phosphate is used in a bond; only the first nucleotide's 5′ phosphate is free.
        - |
          Every nucleotide carries a base; bases project from the backbone along its whole length and do not define the ends.
        - |
          The ends differ chemically, and that difference is what gives the strand a direction that polymerases read and obey.
      answer: 0
      explanation: |
        The 5′ and 3′ ends are the reason DNA has direction, replication has a leading and a lagging strand, and transcription and translation read in a fixed sense.

    - slug: u06-w18-q13
      type: multiple_choice
      topic_code: "1.7"
      source: "Biology 2e §3.4 Proteins"
      points: 1
      prompt: |
        Review. Histone proteins are unusually rich in the amino acids lysine and arginine. Which property of those residues best explains the role of histones?
      options:
        - "Their R groups are nonpolar, which lets histones sit inside the hydrophobic core of chromatin."
        - "Their R groups are positively charged at cellular pH, which attracts the negatively charged phosphate backbone of DNA."
        - "They contain sulfur, which forms disulfide bridges to DNA."
        - "They are the smallest amino acids, letting histones fit between base pairs."
      option_explanations:
        - |
          Lysine and arginine are among the most polar amino acids; a nonpolar core is the wrong picture for a protein that must grip a charged polymer.
        - |
          Correct. Basic R groups carry a positive charge; the DNA backbone is a line of negative phosphates, so histones bind DNA by ionic attraction, a tertiary-structure interaction applied to a partner molecule.
        - |
          Cysteine, not lysine or arginine, provides sulfur, and disulfide bridges form between cysteines within or between proteins, never with DNA.
        - |
          Glycine is the smallest amino acid; lysine and arginine have long side chains, and histones bind the outside of the helix, not between the base pairs.
      answer: 1
      explanation: |
        Unit 1 protein chemistry predicts Unit 6 regulation: acetylating lysine removes its charge, loosens the grip on DNA and opens the gene (topic 6.5).

    - slug: u06-w18-q14
      type: multiple_choice
      topic_code: "4.6"
      source: "Biology 2e §10.3 Control of the Cell Cycle"
      points: 1
      prompt: |
        Review. A cell in which DNA replication has stalled with many unfinished Okazaki fragments does not enter mitosis. Which checkpoint mechanism best explains the arrest?
      options:
        - "The G1 checkpoint, which checks that the cell is large enough to divide."
        - "The G2 checkpoint, which checks that the DNA has been completely and accurately replicated before allowing entry into M phase."
        - "The M checkpoint, which checks that all chromosomes are attached to spindle fibres."
        - "There is no checkpoint for replication; the cell divides and the daughter cells repair the DNA."
      option_explanations:
        - |
          The G1 checkpoint acts before S phase and assesses size, nutrients and DNA damage; it cannot report on replication that has not yet begun.
        - |
          Correct. The G2 checkpoint sits between S phase and mitosis and holds the cell until replication is complete and damage repaired, so unfinished fragments trigger arrest.
        - |
          The M checkpoint acts during metaphase, after the cell has committed to division; the arrest in question happens before mitosis begins.
        - |
          Dividing with incompletely replicated chromosomes would break them at anaphase; the G2 checkpoint exists to prevent exactly that.
      answer: 1
      explanation: |
        Replication is one event in a regulated cycle. Pairing the enzymes of 6.2 with the checkpoints of 4.6 is a typical cross-unit question.

    - slug: u06-w18-q15
      type: multi_select
      topic_code: "6.2"
      source: "Biology 2e §14.4 DNA Replication in Prokaryotes"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are required on the lagging strand more often than on the leading strand during one round of replication? Select all that apply.
      options:
        - "RNA primers made by primase"
        - "Helicase to unwind the parental helix"
        - "Removal of RNA and its replacement by DNA (DNA polymerase I)"
        - "Sealing of backbone nicks by DNA ligase"
        - "Topoisomerase to relieve torsion ahead of the fork"
      option_explanations:
        - |
          Correct. Each Okazaki fragment needs its own primer, while the leading strand needs only one at the origin.
        - |
          Helicase unwinds the one parental helix at the fork; both strands are exposed by the same act of unwinding.
        - |
          Correct. Every primer must be removed and replaced, and the lagging strand has many of them.
        - |
          Correct. Each junction between neighbouring fragments is a nick that ligase must seal; the continuous leading strand has essentially none.
        - |
          Torsional stress builds in the double helix ahead of the fork and is relieved there for both strands at once.
      answer: [0, 2, 3]
      explanation: |
        Enzymes that act per fragment (primase, Pol I, ligase) are the lagging strand's extra burden; enzymes that act on the parental helix (helicase, topoisomerase, SSB) serve both strands.

    - slug: u06-w18-q16
      type: multi_select
      topic_code: "2.1"
      source: "Biology 2e §4.2 Prokaryotic Cells"
      points: 2
      partial_credit: true
      prompt: |
        Review. Which features are shared by a bacterial cell and a human liver cell? Select all that apply.
      options:
        - "DNA as the genetic material"
        - "Ribosomes that build proteins"
        - "A membrane-bound nucleus containing the chromosomes"
        - "A plasma membrane built from a phospholipid bilayer"
        - "Histone-wrapped nucleosomes"
      option_explanations:
        - |
          Correct. All cells use DNA as the hereditary molecule; the difference is in how it is packaged and where it sits.
        - |
          Correct. Ribosomes are universal, though bacterial (70S) and eukaryotic (80S) ribosomes differ in size, which is why some antibiotics can target one and not the other.
        - |
          Bacteria keep their chromosome in a nucleoid with no membrane; only eukaryotes have a nucleus.
        - |
          Correct. Every cell is bounded by a phospholipid bilayer with embedded proteins.
        - |
          Nucleosomes are the eukaryotic packaging system; bacteria compact DNA by supercoiling with other proteins.
      answer: [0, 1, 3]
      explanation: |
        The features all cells share (DNA, ribosomes, membrane, cytoplasm) point to common ancestry; the features that differ (nucleus, histones, linear chromosomes) mark the prokaryote-eukaryote divide.

    - slug: u06-w18-q17
      type: true_false
      topic_code: "6.2"
      source: "Biology 2e §14.4 DNA Replication in Prokaryotes"
      points: 1
      prompt: |
        True or false: On the lagging strand, DNA polymerase III synthesises each Okazaki fragment in the 3′ to 5′ direction so that the fragments can point away from the replication fork.
      answer: false
      explanation: |
        False. No DNA polymerase ever synthesises 3′ to 5′. Every strand, leading or lagging, is built 5′ to 3′. The fragments point away from the fork precisely because that is the only direction in which 5′ → 3′ synthesis can proceed on a template that runs 5′ → 3′ into the fork; the polymerase repeatedly starts near the fork and works backward along template that has already been exposed.

    - slug: u06-w18-q18
      type: true_false
      topic_code: "4.5"
      source: "Biology 2e §10.2 The Cell Cycle"
      points: 1
      prompt: |
        Review. True or false: DNA replication takes place during the S phase of interphase, so a cell entering mitosis already carries two identical copies of each chromosome joined as sister chromatids.
      answer: true
      explanation: |
        True. S phase (synthesis) is when every chromosome is replicated semiconservatively; the two copies remain attached at the centromere as sister chromatids through G2 and prophase, and are separated in anaphase. Replication never occurs during mitosis itself. The same S phase precedes meiosis, which is why meiosis I begins with replicated homologous chromosomes.

