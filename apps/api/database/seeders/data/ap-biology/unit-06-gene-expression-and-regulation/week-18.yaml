      points: 1
      prompt: |
        In eukaryotes, about 147 base pairs of DNA wrapped around an octamer of histone proteins form a structural unit called a ____.
      answer: ["nucleosome"]
      explanation: |
        The nucleosome is the first level of histone coiling, the bead on the beads-on-a-string. Nucleosomes pack into the 30-nm fibre and eventually the metaphase chromosome, and sliding or modifying them is the epigenetic switch of topic 6.5. "Histone" names the protein, not the DNA-protein unit, so it is not accepted; "chromatin" names the whole complex rather than the repeating unit.

    - slug: u06-w18-q20
      type: fill_blank
      topic_code: "5.1"
      source: "Biology 2e §11.1 The Process of Meiosis"
      points: 1
      prompt: |
        Review. The two identical DNA molecules produced when a chromosome is replicated remain attached at the centromere as sister ____ until they are pulled apart in anaphase of mitosis or anaphase II of meiosis.
      answer: ["chromatids", "chromatid"]
      explanation: |
        Sister chromatids are the physical product of semiconservative replication: two double helices, each with one old and one new strand, held together until anaphase. In meiosis I it is homologous chromosomes, not sister chromatids, that separate; sister chromatids part in meiosis II. "Homologues" is therefore not accepted here.

    - slug: u06-w18-q21
      type: numeric
      topic_code: "6.2"
      source: "Biology 2e §14.4 DNA Replication in Prokaryotes"
      points: 1
      prompt: |
        The E. coli chromosome is 4.6 × 10⁶ base pairs and has a single origin from which two replication forks move in opposite directions, each adding about 1,000 nucleotides per second. About how many minutes does one round of replication take? Give your answer to the nearest minute.
      answer: { value: 38, tolerance: 2 }
      explanation: |
        Two forks share the circle, so each copies half: 4.6 × 10⁶ ÷ 2 = 2.3 × 10⁶ base pairs per fork. At 1,000 per second that is 2,300 s, and 2,300 ÷ 60 ≈ 38 minutes (the text's figure of about 42 minutes includes initiation and termination). Forgetting the second fork gives 77 minutes, twice the answer. A human cell, with forks ten times slower, would need weeks with one origin per chromosome, which is why it uses tens of thousands.

    - slug: u06-w18-q22
      type: numeric
      topic_code: "6.1"
      source: "Biology 2e §14.2 DNA Structure and Sequencing"
      points: 1
      prompt: |
        A stretch of B-form double helix measures 3,400 nm along its axis. Using the helix dimensions, how many base pairs does it contain? Give a whole number.
      answer: { value: 10000, tolerance: 0 }
      explanation: |
        Adjacent base pairs are 0.34 nm apart, so 3,400 nm ÷ 0.34 nm = 10,000 base pairs. Equivalently, one turn is 3.4 nm and holds 10 base pairs: 3,400 ÷ 3.4 = 1,000 turns × 10 = 10,000. The number 10,000 base pairs is about the size of a small bacterial operon or a single large eukaryotic gene.

    - slug: u06-w18-q23
      type: short_answer
      topic_code: "6.2"
      source: "Biology 2e §14.5 DNA Replication in Eukaryotes"
      points: 4
      prompt: |
        Conceptual analysis. A human cell holds about 6 × 10⁹ base pairs of DNA across 46 chromosomes, and its replication forks move at about 50 nucleotides per second, yet S phase lasts only about 8 hours. (a) Calculate how long replication would take if each chromosome had a single origin with two forks and the largest chromosome held 2.5 × 10⁸ base pairs. (b) Explain how eukaryotic cells actually complete replication in 8 hours. (c) Describe one other way eukaryotic replication differs from prokaryotic replication besides the number of origins.
      answer: |
        (a) 2.5 × 10⁸ ÷ 2 forks ÷ 50 per second = 2.5 × 10⁶ s, about 29 days. (b) Each chromosome has many origins (up to 100,000 per genome) that fire during S phase, so thousands of forks work at once. (c) Linear chromosomes with telomeres and telomerase; nucleosomes must be displaced; polymerases α, δ and ε; slower forks.
      explanation: |
        Four points.

        (a) Calculation, 1 pt: 2.5 × 10⁸ ÷ 2 ÷ 50 = 2.5 × 10⁶ seconds, converted to about 700 hours or about 29 days (accept 25 to 30 days, or the figure in seconds or hours with a comparison to 8 hours). A student who forgets the second fork and gets about 58 days earns the point if the working is shown and the conclusion is still that it is far too long.

        (b) Explanation, 2 pts: 1 pt for many origins of replication per chromosome, so many replication bubbles grow at the same time; 1 pt for a quantitative or logical link: the total work is divided among thousands of forks, so the time is set by the spacing between origins, not the chromosome length. Accept "replication is initiated at thousands of sites simultaneously" with the consequence stated.

        (c) One difference, 1 pt: any one of: linear chromosomes create the end-replication problem solved by telomerase; DNA must be unwound from nucleosomes and histones reassembled behind the fork; different polymerases (α primes, δ and ε elongate); shorter Okazaki fragments; RNase H rather than Pol I removes primers; slower rate. The difference must be stated correctly, not just named.

        Zero: answers that claim eukaryotic forks are faster, or that eukaryotic DNA is replicated continuously through interphase.

    - slug: u06-w18-q24
      type: short_answer
      topic_code: "3.3"
      source: "Biology 2e §6.4 ATP: Adenosine Triphosphate"
      points: 4
      prompt: |
        Review. Conceptual analysis. DNA polymerase adds each new nucleotide as a deoxynucleoside triphosphate (dATP, dGTP, dCTP, dTTP), not as a monophosphate, and two phosphates are released as pyrophosphate with each addition. (a) Identify what provides the energy for forming the phosphodiester bond. (b) Explain, using the idea of coupled reactions, why the cell supplies nucleotides in triphosphate form. (c) Predict what would happen to the rate of DNA synthesis in a tube containing polymerase, template, primer and only deoxynucleoside monophosphates, and justify your prediction.
      answer: |
        Hydrolysis of the nucleotide's own high-energy phosphate bonds provides the energy; the exergonic release of pyrophosphate is coupled to the endergonic bond formation, and pyrophosphate's further hydrolysis makes the step effectively irreversible. With monophosphates there is no energy source, so no synthesis would occur.
      explanation: |
        Four points.

        (a) Identify, 1 pt: the energy comes from breaking the phosphoanhydride (high-energy phosphate) bonds of the incoming triphosphate, released as pyrophosphate. Accept "the nucleotide is its own energy source" or a comparison to ATP hydrolysis.

        (b) Explain, 2 pts: 1 pt for coupling: forming a phosphodiester bond is endergonic on its own, so the cell pairs it with the exergonic cleavage of the triphosphate in one enzyme-catalysed step; 1 pt for irreversibility or driving force: pyrophosphate is rapidly hydrolysed to two phosphates, which pulls the reaction forward (accept a free-energy argument that the overall ΔG is negative, or the analogy to ATP driving endergonic reactions in topic 3.3).

        (c) Predict and justify, 1 pt: little or no synthesis, because a monophosphate carries no energy to pay for the bond and polymerase has no other energy source; the enzyme requires triphosphates as substrates. Accept "the reaction would be thermodynamically unfavourable".

        Zero: answers that say ATP from respiration is hydrolysed separately to power each addition, or that the polymerase itself supplies the energy.

    - slug: u06-w18-q25
      type: long_answer
      topic_code: "6.2"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. To test how the two new strands are made at a replication fork, researchers gave growing E. coli a very brief pulse of radioactive thymidine (³H-thymidine), then stopped replication and separated the newly made, labelled DNA by size. They used a normal strain and a strain whose DNA ligase is inactive at 42 °C. Both strains were grown at 42 °C. The share of the labelled DNA found in short fragments (1,000 to 2,000 nucleotides) and in long strands (over 10,000 nucleotides) is shown.

        | Strain | Pulse length (s) | Label in short fragments (%) | Label in long strands (%) |
        |---|---|---|---|
        | Normal | 5 | 48 | 52 |
        | Normal | 30 | 22 | 78 |
        | Normal | 120 | 6 | 94 |
        | Ligase-deficient | 5 | 49 | 51 |
        | Ligase-deficient | 30 | 47 | 53 |
        | Ligase-deficient | 120 | 46 | 54 |

        (a) Identify the independent variables and the dependent variable.
        (b) Describe the pattern of the data for the normal strain and for the ligase-deficient strain.
        (c) Explain why, in the normal strain, roughly half of the label is in short fragments after a 5-second pulse but almost none after 120 seconds. Refer to leading and lagging strands in your answer.
        (d) Explain why the ligase-deficient strain keeps about half of its label in short fragments at every pulse length, and state what this tells you about the role of ligase.
        (e) A student claims the data show that both new strands are made in short fragments. Evaluate the claim using the numbers in the table.
      answer: |
        IVs: strain (ligase normal or deficient) and pulse length; DV: share of labelled DNA in short versus long pieces. Normal: short-fragment share falls from 48% to 6% as the pulse lengthens; ligase-deficient: stays near 47% at all pulse lengths. In the normal strain the lagging strand is made as Okazaki fragments that are quickly joined into long DNA, so with longer pulses the label has time to be incorporated into joined strands, while leading-strand label is in long DNA from the start. Without ligase the fragments are never joined, so the lagging-strand half of the label stays short. The claim is wrong: about half the label is always long, even at 5 seconds, which is the continuously made leading strand; if both strands were fragmentary, nearly 100% would be short at 5 seconds and in the ligase mutant.
      explanation: |
        Eight points.

        (a) 1 pt: independent variables are the strain (normal versus ligase-deficient) and the length of the labelling pulse; dependent variable is the percentage of newly made (labelled) DNA in short fragments versus long strands. Both independent variables must be named.

        (b) 1 pt: normal strain, the short-fragment share falls as pulse length increases (48% to 22% to 6%) while long-strand share rises; ligase-deficient strain, the shares stay roughly constant at about half and half (49%, 47%, 46%) regardless of pulse length. Numbers or a correct ordering are required.

        (c) 2 pts: 1 pt for the lagging strand being synthesised as Okazaki fragments, so label incorporated in the last few seconds is still in short pieces; 1 pt for the fragments being joined to the growing strand by ligase within seconds to minutes, so with a longer pulse most of the label has been incorporated into joined, long DNA; the leading strand is continuous, so its label is in long DNA at every pulse length. Accept "pulse-chase" reasoning in other words.

        (d) 2 pts: 1 pt for the explanation that without functional ligase the Okazaki fragments on the lagging strand cannot be sealed to each other, so they accumulate as short pieces no matter how long the pulse; 1 pt for the inference that ligase's role is to join (form phosphodiester bonds between) adjacent fragments rather than to synthesise DNA, since DNA is still made (the label is incorporated) in the mutant.

        (e) 2 pts: 1 pt for rejecting the claim; 1 pt for the quantitative justification: about half the label is in long strands even after a 5-second pulse and even in the ligase mutant, which is what is expected if one strand (the leading strand) is made continuously and the other (the lagging strand) in fragments; if both were made in fragments, close to 100% of the label would be in short pieces at 5 seconds and in the ligase-deficient strain at every pulse length. Accept an alternative justification based on the plateau near 50% in the mutant.

        Zero for a part: describing the data as "it changes" without direction or numbers; attributing the short fragments to DNA damage or degradation; stating that ligase makes new DNA; accepting the claim because "some fragments are short".
