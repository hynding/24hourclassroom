    - slug: u02-w07-q12
      type: multiple_choice
      topic_code: "1.7"
      source: "Biology 2e §3.4 Proteins"
      points: 1
      prompt: |
        Review. A carrier protein transports glucose but not galactose, which differs from glucose only in the orientation of one hydroxyl group. Which principle explains this specificity?
      options:
        - "The carrier recognises the formula C₆H₁₂O₆, which both share."
        - "The carrier's binding site is a three-dimensional pocket formed by its tertiary structure, and R groups in the pocket make hydrogen bonds to specific hydroxyls; a hydroxyl in the wrong orientation cannot bond, so the sugar does not fit."
        - "Galactose is too large to enter the carrier."
        - "Carriers are not specific; the cell simply has no galactose."
      option_explanations:
        - |
          Formulas do not determine shape; glucose and galactose have identical formulas and different three-dimensional structures, which is why isomers matter.
        - |
          Correct. Binding specificity comes from complementary shape and chemistry between a folded protein and its ligand, Unit 1's structure-to-function rule applied to a transporter.
        - |
          The two sugars are the same size and mass; the difference is the position of one –OH group, a matter of shape, not bulk.
        - |
          Carriers are highly specific; in fact the saturation and selectivity of carriers are how they are distinguished from simple diffusion.
      answer: 1
      explanation: |
        Every transporter is a protein, and every protein works by shape. Unit 1's isomers and tertiary structure are why the membrane can tell two near-identical sugars apart.

    - slug: u02-w07-q13
      type: multiple_choice
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        Review. In the dialysis-bag experiment, bags of sucrose placed in water gained mass. Which property of water is most directly responsible for the gain?
      options:
        - "Water's high specific heat."
        - "Water's ability to form hydration shells around solute molecules, which reduces the free water available on the sucrose side so that free water diffuses in from the pure-water side."
        - "Water's surface tension pulling water into the bag."
        - "Water's low density as a solid."
      option_explanations:
        - |
          Specific heat concerns temperature change, which was constant in the experiment.
        - |
          Correct. Osmosis is diffusion of free water; the hydration of solutes is what makes a solution have less free water than pure water, and that difference is the gradient.
        - |
          Surface tension acts at an air-water interface and does not move water through a membrane.
        - |
          Ice is irrelevant at room temperature; density differences play no role in osmosis.
      answer: 1
      explanation: |
        Water as a polar solvent (week 1) is the foundation of osmosis (week 6). Solutes do not pull water; they tie it up, and free water diffuses toward where it is scarce.

    - slug: u02-w07-q14
      type: short_answer
      topic_code: "1.6"
      source: "Biology 2e §3.5 Nucleic Acids"
      points: 4
      prompt: |
        Review. Scientific argumentation. Mitochondrial DNA is a single circular molecule, is not wound on histone proteins, and encodes some of the mitochondrion's own rRNA and tRNA. Nuclear DNA is linear and packaged on histones. (a) Describe two features of nucleotide chemistry that the two genomes share. (b) Explain what the circular, histone-free organisation of mitochondrial DNA suggests about its origin. (c) Explain why encoding its own rRNA and tRNA strengthens that argument. (d) State one observation about mitochondrial DNA that, if made, would weaken the argument.
      answer: |
        Both are polymers of nucleotides joined 3′ to 5′ by phosphodiester bonds, with antiparallel complementary strands held by A-T and G-C hydrogen bonding. Circular, histone-free chromosomes are the prokaryotic pattern, so mitochondrial DNA looks like a bacterial genome, consistent with a bacterial ancestor. Having its own rRNA and tRNA means the organelle retains part of an independent translation system, which a cell-built compartment would never have. If mitochondrial rRNA sequences were most similar to the nuclear rRNA of the same organism rather than to bacterial rRNA, the argument would be weakened.
      explanation: |
        Four points.

        (a) 1 pt: any two of: nucleotides of a pentose, phosphate and base; phosphodiester backbone running 5′ to 3′; complementary base pairing (A-T, G-C) between antiparallel strands; the same four bases. Must be chemistry shared by both, not organisation.

        (b) 1 pt: circular DNA without histones is characteristic of bacteria; the resemblance suggests mitochondrial DNA is descended from the genome of an engulfed prokaryote. Must connect the organisation to prokaryotes and to endosymbiosis.

        (c) 1 pt: rRNA and tRNA are components of a translation system; an organelle that keeps part of its own machinery for making proteins looks like a reduced organism rather than a compartment built by the cell, which would use cytosolic ribosomes entirely.

        (d) 1 pt: any sound refuting observation, e.g. mitochondrial rRNA or protein sequences being closest to the host's nuclear versions rather than to bacterial ones; mitochondrial genes using a purely eukaryotic transcription machinery; or mitochondria being assembled from scratch without pre-existing mitochondria.

        Zero: answers that say mitochondrial DNA is RNA, that treat circular DNA as evidence that it is not real DNA, or that give evidence both hypotheses explain equally.

    # ---- Select all
    - slug: u02-w07-q15
      type: multi_select
      topic_code: "2.8"
      source: "Biology 2e §5.4 Bulk Transport"
      points: 2
      partial_credit: true
      prompt: |
        A cell is treated with a drug that blocks ATP synthesis. Which processes would continue, at least until the cell's gradients run down? Select all that apply.
      options:
        - "Osmotic swelling of the cell in a hypotonic solution"
        - "Diffusion of CO₂ out of the cell"
        - "Uptake of a bacterium by phagocytosis"
        - "Glucose entering a red blood cell through its carrier, down its gradient"
        - "Export of Na⁺ by the sodium-potassium pump"
      option_explanations:
        - |
          Correct. Osmosis is passive and depends only on the water potential gradient; a poisoned cell swells just as a healthy one does, in fact more, as it loses the ability to pump solutes out.
        - |
          Correct. CO₂ is small and nonpolar and diffuses down its gradient through the bilayer with no help from the cell.
        - |
          Phagocytosis requires ATP to rearrange the cytoskeleton and pinch the membrane inward; bulk transport stops without energy.
        - |
          Correct. Facilitated diffusion uses no ATP; the carrier keeps working as long as there is a gradient, which there is until the cell has used or equalised its glucose.
        - |
          The pump hydrolyses ATP every cycle; it stops at once, and the ion gradients then decay through leak channels.
      answer: [0, 1, 3]
      explanation: |
        The energy-poisoning thought experiment sorts every transport mechanism: passive ones carry on until equilibrium, active ones stop at once.

    - slug: u02-w07-q16
      type: multi_select
      topic_code: "2.3"
      source: "Biology 2e §5.1 Components and Structure"
      points: 2
      partial_credit: true
      prompt: |
        Which statements correctly connect a membrane property to its structural cause? Select all that apply.
      options:
        - "Selective permeability is caused by the hydrophobic core of the phospholipid bilayer."
        - "Fluidity is caused by the absence of covalent bonds between neighbouring lipids and by unsaturated tails that resist packing."
        - "Cell-to-cell recognition is caused by carbohydrate chains on the extracellular face."
        - "The membrane's ability to carry ions is caused by cholesterol."
        - "Membrane asymmetry is caused by proteins flipping between leaflets."
      option_explanations:
        - |
          Correct. Whatever cannot dissolve in a nonpolar layer cannot cross without a protein; the core sets the default rule.
        - |
          Correct. Lipids are held by hydrophobic exclusion, so they slide freely; cis double bonds keep tails apart and lower the temperature at which the membrane would solidify.
        - |
          Correct. The glycocalyx is the cell's identity badge, read by other cells and by the immune system.
        - |
          Cholesterol buffers fluidity; ions cross through channel and pump proteins, never through the sterol.
        - |
          Proteins do not flip; asymmetry is established when proteins are inserted in the ER with a fixed orientation and is preserved through vesicle traffic.
      answer: [0, 1, 2]
      explanation: |
        Every membrane property maps to a component: lipid core for selectivity, lipid mobility for fluidity, sugar for identity, protein for transport. Cholesterol tunes, it does not transport.

    # ---- True / false
    - slug: u02-w07-q17
      type: true_false
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: A plant cell with Ψs = −10 bar and Ψp = +6 bar will lose water to an open beaker of 0.1 M sucrose at 22 °C (Ψs ≈ −2.5 bar).
      answer: false
      explanation: |
        False. Add the components first: the cell's Ψ = −10 + 6 = −4 bar; the beaker's Ψ = −2.5 + 0 = −2.5 bar. Water moves from higher to lower Ψ, so from the beaker (−2.5) into the cell (−4). The cell gains water and its turgor rises until Ψp = +7.5 bar. Comparing Ψs values alone would have given the wrong answer; pressure counts.

    - slug: u02-w07-q18
      type: true_false
      topic_code: "1.2"
      source: "Biology 2e §2.3 Carbon"
      points: 1
      prompt: |
        Review. True or false: Oxygen and carbon dioxide cross cell membranes without proteins because they are nonpolar, whereas water, with the same small size, is slowed by its polarity.
      answer: true
      explanation: |
        True. O₂ is a symmetrical molecule with no partial charges; CO₂ is linear with its two polar C=O bonds cancelling, so both are nonpolar and dissolve in the bilayer. Water's bent shape leaves it polar (week 1), so it crosses a bare bilayer about a hundred times slower than oxygen and needs aquaporins to move fast. Polarity, set by bond type and shape, predicts permeability.

    - slug: u02-w07-q19
      type: true_false
      topic_code: "2.10"
      source: "Biology 2e §23.1 Eukaryotic Origins"
      points: 1
      prompt: |
        True or false: Because chloroplasts are found only in some eukaryotic lineages while mitochondria are found in essentially all of them, the endosymbiosis that produced mitochondria is inferred to have occurred before the one that produced chloroplasts.
      answer: true
      explanation: |
        True. A feature shared by every member of a group was most likely present in their common ancestor; a feature present in only a subset arose later, within that subset. Mitochondria are universal (or were secondarily lost), chloroplasts are not, so aerobic endosymbiosis came first. This is phylogenetic reasoning, which Unit 7 formalises.

    # ---- Fill in the blank
    - slug: u02-w07-q20
