    # ---- Numeric
    - slug: u02-w07-q22
      type: numeric
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        In a potato-core experiment at 27 °C, the sucrose molarity at which the cores showed zero change in mass was 0.25 M. Calculate the water potential of the potato tissue in bars. Use Ψs = −iCRT with i = 1, R = 0.0831 L·bar/(mol·K) and T = 300 K, and remember the beaker is open (Ψp = 0). Give the answer to one decimal place with its sign.
      answer: { value: -6.2, tolerance: 0.15 }
      explanation: |
        At zero mass change the tissue is at equilibrium with the solution, so Ψtissue = Ψsolution. The open solution has Ψp = 0, so Ψsolution = Ψs = −(1)(0.25)(0.0831)(300) = −6.23 bar, which rounds to −6.2 bar. The tissue's own Ψs is more negative than this; the difference is its turgor pressure. A common error is to forget the minus sign or to use 27 instead of 300 for T.

    - slug: u02-w07-q23
      type: numeric
      topic_code: "2.2"
      source: "Biology 2e §4.2 Prokaryotic Cells"
      points: 1
      prompt: |
        A spherical cell has a radius of 6 μm. Calculate its surface area to volume ratio in μm⁻¹, using SA = 4πr² and V = (4/3)πr³. Give the number to one decimal place.
      answer: { value: 0.5, tolerance: 0.05 }
      explanation: |
        SA = 4π(6)² = 452.4 μm². V = (4/3)π(6)³ = 904.8 μm³. Ratio = 452.4 ÷ 904.8 = 0.5 μm⁻¹. The shortcut for a sphere is 3/r = 3/6 = 0.5. A cell of radius 3 μm would have ratio 1.0; halving the radius doubles the ratio, which is why small cells exchange more efficiently.

    # ---- Free response
    - slug: u02-w07-q24
      type: short_answer
      topic_code: "2.9"
      source: "Biology 2e §4.4 The Endomembrane System and Proteins"
      points: 4
      prompt: |
        Analyze a visual representation. A diagram shows a cell with the following labelled: a nucleus, rough ER continuous with the nuclear envelope, a Golgi stack with vesicles on both faces, a lysosome, a mitochondrion with cristae, and the plasma membrane with glycoproteins whose sugars face outward. (a) Describe the path a digestive enzyme destined for the lysosome takes through the structures shown. (b) Explain how the sugars on the surface glycoproteins came to face outward, using the diagram. (c) Explain why the mitochondrion is not part of the pathway you described in (a). (d) Predict what would happen to lysosome function if the Golgi failed to tag proteins, and justify.
      answer: |
        Gene in nucleus → mRNA → ribosome on rough ER → ER lumen (folding, first sugars) → vesicle → Golgi cis face → modification and tagging → vesicle from trans face → fusion with lysosome. Sugars are added in the ER and Golgi lumen; the lumen face becomes the outer face when a vesicle fuses with the plasma membrane. Mitochondria are not in the endomembrane system: they exchange no vesicles with it and import most of their proteins directly from the cytosol, consistent with a separate (endosymbiotic) origin. Without tagging, lysosomal enzymes would be mis-sorted (secreted by default), lysosomes would lack enzymes, and undigested material would accumulate.
      explanation: |
        Four points.

        (a) 1 pt: the full ordered path: ribosome on rough ER → ER lumen → transport vesicle → Golgi (cis to trans) → vesicle → lysosome. Must include ER before Golgi and vesicles between; starting at the nucleus with mRNA is welcome but not required.

        (b) 1 pt: carbohydrate is added to proteins inside the ER and Golgi lumen; when a vesicle fuses with the plasma membrane, its lumen-facing surface becomes the extracellular face, so the sugars end up outside. Must connect lumen to outside.

        (c) 1 pt: the mitochondrion is not part of the endomembrane system; it does not send or receive vesicles and makes some of its own proteins on its own ribosomes, importing the rest from the cytosol. Accept reference to its endosymbiotic origin as the reason.

        (d) 1 pt: without the Golgi tag (a phosphorylated sugar), lysosomal enzymes would not be sorted to lysosomes and would follow the default route out of the cell; lysosomes would be empty of enzymes, undigested material would build up, and the cell would be damaged (as in lysosomal storage diseases). The justification must link tagging to sorting.

        Zero: answers that route the enzyme through the mitochondrion, that have sugars added in the cytosol, or that say the Golgi makes proteins.

    - slug: u02-w07-q25
      type: long_answer
      topic_code: "2.7"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. A class tested the claim that "sweet potato tissue has a lower water potential than white potato tissue". Cores of each were weighed, soaked for 24 h at 20 °C (293 K) in sucrose solutions, blotted and reweighed. Means of five cores are shown. R = 0.0831 L·bar/(mol·K).

        | Sucrose (M) | White potato, change in mass (%) | Sweet potato, change in mass (%) |
        |---|---|---|
        | 0.0 | +14 | +22 |
        | 0.2 | +6 | +13 |
        | 0.4 | −3 | +4 |
        | 0.6 | −10 | −5 |
        | 0.8 | −16 | −13 |
        | 1.0 | −22 | −20 |

        (a) Identify the independent and dependent variables and one variable that must be held constant, and explain why percentage change rather than change in grams is used.
        (b) For each tissue, estimate the sucrose molarity at which the change in mass would be zero, and calculate the water potential of each tissue in bars.
        (c) Evaluate the claim using your calculations, and explain in terms of solutes what the result means.
        (d) A student argues that the sweet potato result is explained by its cells having "stronger walls". Explain why the data do not support that explanation, and propose an experiment that would test it.
      answer: |
        IV: sucrose concentration; DV: % change in mass; constant: time, temperature, core size, blotting. Percentage normalises for different starting masses. White potato zero crossing ≈ 0.33 M, Ψ = −(1)(0.33)(0.0831)(293) ≈ −8.0 bar. Sweet potato zero crossing ≈ 0.49 M, Ψ ≈ −11.9 bar. The claim is supported: sweet potato's Ψ is lower (more negative), meaning its cells contain more dissolved solute (sugar), which fits its taste. Wall strength affects Ψp, not the equilibrium point in an open beaker where the tissue matches the solution's Ψ; and stronger walls would, if anything, limit water gain, yet sweet potato gained more. Test: measure Ψs directly by plasmolysing cells in a graded series, or measure sugar content of the sap.
      explanation: |
        Eight points.

        (a) 2 pts: 1 pt for independent variable = sucrose concentration (and tissue type) and dependent variable = percentage change in mass, plus a controlled variable (time, temperature, core dimensions, volume of solution, blotting method); 1 pt for explaining that cores start at different masses, so dividing by initial mass puts all samples on the same scale and allows comparison between tissues.

        (b) 3 pts: 1 pt for each zero crossing, white potato between 0.2 and 0.4 M (accept 0.30-0.36 M) and sweet potato between 0.4 and 0.6 M (accept 0.45-0.52 M); 1 pt for correctly applying Ψs = −iCRT at 293 K to both, giving about −8 bar for white (accept −7.3 to −8.8) and about −12 bar for sweet (accept −11 to −12.7), with the sign negative. An answer that computes only one tissue correctly earns 2 of the 3.

        (c) 2 pts: 1 pt for the evaluation: the claim is supported because the sweet potato's water potential is more negative than the white potato's; 1 pt for the interpretation: a more negative Ψ at equilibrium means a more negative Ψs, which means a higher concentration of dissolved solutes (sugars) in the sweet potato cells, consistent with its sweetness.

        (d) 1 pt: in an open beaker at equilibrium the tissue's Ψ equals the solution's regardless of wall strength; the wall sets how much pressure builds (Ψp), not where the zero crossing falls, and a stiffer wall would reduce water gain in dilute solutions, whereas sweet potato gained more. A test: measure sugar concentration of expressed sap, or determine Ψs by incipient plasmolysis under a microscope, or compare cores with walls removed (protoplasts). Half credit for the refutation without an experiment.

        Zero for a part: using °C in the equation; a positive water potential; concluding the sweet potato has fewer solutes; describing the data without comparing tissues.
