week: 7
unit: 2
title: Cells in Synthesis, Investigation 4 and the Unit 2 Exam
topics: ["2.1", "2.2", "2.3", "2.4", "2.5", "2.6", "2.7", "2.8", "2.9", "2.10"]
guide: guides/week-07.md
guide_description: |
  The whole unit as one argument: a membrane that excludes most things, proteins that let chosen things through,
  pumps that make the inside different, folds and compartments that beat the surface-area limit, and organelles
  that are former bacteria. AP Investigation 4 (Diffusion and Osmosis) worked end to end: the agar cubes, the
  dialysis bags and the potato cores, with the water-potential arithmetic. Three worked examples, a table of the
  transport mechanisms, the misconceptions that cost the most points, self-check, and what the Unit 2 exam asks.
flashcards_description: |
  30 synthesis cards: side-by-side comparisons, decision rules, the Investigation 4 procedures and "given this
  result, which mechanism" cards that pull the ten topics together.

flashcards:
  - front: Decision rule → does this substance need a protein to cross the membrane?
    back: |
      Ask two questions. Is it charged? Then yes, always. Is it polar and larger than water? Then yes. Small and nonpolar (O₂, CO₂, steroids)? No protein needed; it dissolves through the bilayer.
    topic_code: "2.4"
  - front: Decision rule → is this transport active or passive?
    back: |
      Which way is the substance moving relative to its own gradient? Down: passive (simple or facilitated diffusion, osmosis), no ATP. Up: active, ATP spent somewhere (directly by a pump, or earlier by the pump that built a coupled gradient). Vesicle traffic: always active.
    topic_code: "2.5"
  - front: Decision rule → will this cell gain or lose water?
    back: |
      Compare water potentials: water moves from higher Ψ to lower Ψ. If only solute concentrations are given, water moves toward the side with more solute particles. Then ask whether the cell has a wall: wall means pressure builds (turgor); no wall means volume changes (lysis or crenation).
    topic_code: "2.7"
  - front: Simple diffusion vs facilitated diffusion vs active transport → one table
    back: |
      Simple: through the bilayer, down the gradient, no protein, no ATP, rate proportional to gradient. Facilitated: through a channel or carrier, down the gradient, no ATP, can saturate. Active: through a pump, up the gradient, ATP, saturates, can be inhibited by metabolic poisons.
    topic_code: "2.8"
  - front: Which experiment distinguishes facilitated diffusion from active transport?
    back: |
      Poison ATP production (cyanide, cold, no oxygen) or remove the gradient. Facilitated diffusion continues as long as a gradient exists and stops at equilibrium; active transport stops without ATP and can concentrate a substance well past equilibrium.
    topic_code: "2.8"
  - front: Which experiment distinguishes simple diffusion from carrier-mediated transport?
    back: |
      Plot rate against concentration. Simple diffusion gives a straight line without limit; a carrier gives a curve that plateaus (saturation). A competing molecule of similar shape slows a carrier but not simple diffusion.
    topic_code: "2.6"
  - front: AP Investigation 4, procedure 1 → what the agar cubes test and what they show
    back: |
      Cubes of agar with indicator in NaOH model cells of different size. The dye front moves the same distance into every cube, so the fraction of volume reached falls as cube size rises. Shows that SA:V limits how well diffusion supplies a cell.
    topic_code: "2.2"
  - front: AP Investigation 4, procedure 2 → what the dialysis bags test and what they show
    back: |
      Bags of sucrose solutions in beakers of water (or the reverse). Percentage mass change plotted against molarity gives a straight line through the origin: water moves toward the side with lower Ψ, faster the steeper the gradient. Can be used to identify an unknown solution's molarity.
    topic_code: "2.7"
  - front: AP Investigation 4, procedure 3 → what the potato cores test and what they show
    back: |
      Tissue cores soaked in a series of sucrose concentrations. The molarity at which percentage mass change is zero is isotonic to the tissue; converting it with Ψs = −iCRT gives the tissue's water potential. Living tissue is always below 0 bar.
    topic_code: "2.7"
  - front: How to get a tissue's water potential from a mass-change graph
    back: |
      Plot percentage change in mass against sucrose molarity, draw the best-fit line, read the molarity where it crosses zero, then Ψs = −(1)(that molarity)(0.0831)(T in K). At equilibrium with no pressure in the beaker, Ψtissue = Ψs of that solution.
    hint: Zero crossing, then −iCRT.
    topic_code: "2.7"
  - front: Why is percentage change in mass used rather than grams?
    back: |
      Cores and bags start at different masses; dividing the change by the initial mass lets samples of different size be compared on one axis. Always compute (final − initial) ÷ initial × 100.
    topic_code: "2.7"
  - front: Sources of error in the osmosis lab, and what each does to the result
    back: |
      Not blotting bags or cores before weighing (extra water, inflated gain). Too short a soak (not at equilibrium, under-estimated change). Evaporation from beakers (concentrates the solution, pushes results toward loss). Different core sizes (different SA:V, different rates).
    topic_code: "2.7"
  - front: A cell's Ψs is −8 bar and it sits in a 0.1 M sucrose solution at 22 °C at equilibrium. Find Ψp
    back: |
      Solution Ψ = Ψs = −(1)(0.1)(0.0831)(295) = −2.45 bar. At equilibrium Ψcell = −2.45. Ψp = Ψcell − Ψs = −2.45 − (−8) = +5.55 bar of turgor.
    topic_code: "2.7"
  - front: Organelle → the one feature that identifies it in a micrograph
    back: |
      Nucleus: double envelope with pores, dark nucleolus. Mitochondrion: double membrane with inner folds (cristae). Chloroplast: stacks of discs (grana). Rough ER: sheets dotted with ribosomes. Golgi: flattened stacked sacs with vesicles budding. Lysosome: small, dense, single membrane.
    topic_code: "2.1"
  - front: Given this result, which organelle? A cell fraction with its own circular DNA, ribosomes sensitive to bacterial antibiotics, and two membranes
    back: |
      A mitochondrion or chloroplast, the two endosymbiotic organelles. If the fraction also has chlorophyll and thylakoids, chloroplast; if it has cristae and consumes oxygen, mitochondrion.
    topic_code: "2.10"
  - front: Given this result, which organelle? A fraction with hydrolytic enzymes most active at pH 5
    back: |
      Lysosomes. Acid-optimal hydrolases are their signature; their compartment keeps the acid and the enzymes away from the neutral cytosol.
    topic_code: "2.9"
  - front: Given this result, which organelle? A fraction that incorporates radioactive amino acids first, then passes them on within minutes
    back: |
      The rough ER. Pulse-chase experiments show label appearing first in the ER, then in the Golgi, then in secretory vesicles, then outside the cell: the secretory pathway in order.
    topic_code: "2.1"
  - front: Three structures that solve the surface-area problem at three scales
    back: |
      Organelle: cristae and thylakoids fold internal membranes. Cell: microvilli and root hairs fold the plasma membrane outward. Organism: alveoli in lungs, villi in the gut, flat leaves. Same geometry each time.
    topic_code: "2.2"
  - front: What does a eukaryotic cell gain from compartments that a prokaryote cannot have?
    back: |
      Different chemistries side by side (acid in lysosomes, oxidation in peroxisomes), high local concentrations of enzyme and substrate, gradients across internal membranes to drive ATP synthesis, and sequential processing of proteins through ER and Golgi. The cost is more membrane to build and more traffic to manage.
    topic_code: "2.9"
  - front: Endosymbiosis → the four observations and the one that would refute it
    back: |
      Supports: two membranes, own circular DNA, bacterial-type ribosomes, division by fission. Would refute: organelle genes and ribosomes resembling eukaryotic nuclear ones, or new organelles assembled by the cell from scratch. The theory makes predictions; it is testable.
    topic_code: "2.10"
  - front: Why do plant cells have mitochondria as well as chloroplasts?
    back: |
      Chloroplasts make sugar in the light; mitochondria release the sugar's energy as ATP at all times, in every cell including roots that never see light. The two endosymbioses solved different problems and both were kept.
    topic_code: "2.10"
  - front: Membrane proteins by job → six kinds
    back: |
      Channels (pore, passive), carriers (bind and flip, passive), pumps (ATP, active), receptors (bind a signal), enzymes (catalyse at the surface), and recognition or adhesion proteins (glycoproteins that identify the cell or hold it to neighbours).
    topic_code: "2.3"
  - front: What limits the rate of simple diffusion across a membrane?
    back: |
      The concentration gradient (steeper, faster), the membrane's surface area (larger, faster), its thickness (thinner, faster), temperature (warmer, faster), and the diffusing molecule's size and lipid solubility (small and nonpolar, faster).
    topic_code: "2.4"
  - front: Sodium-potassium pump and secondary transport → how one ATP powers two jobs
    back: |
      The pump spends ATP to keep Na⁺ low inside. That Na⁺ gradient is stored energy; Na⁺ flowing back in through a symporter drags glucose or amino acids in against their gradients. One primary pump, many secondary transporters riding its gradient.
    topic_code: "2.5"
  - front: Red blood cell, plant cell, Paramecium → in pure water, what saves each or does not
    back: |
      Red blood cell: nothing, it bursts. Plant cell: the wall; pressure rises until Ψ inside equals 0 and net entry stops. Paramecium: the contractile vacuole pumps water out at a cost in ATP.
    topic_code: "2.7"
  - front: Membrane budget → what balances exocytosis?
    back: |
      Endocytosis. A secretory cell adds membrane to its surface every time a vesicle fuses; it recovers the same area by endocytosis, so surface area stays constant. The same lipids cycle between surface and interior.
    topic_code: "2.8"
  - front: Big Idea connection → how does membrane transport show that systems are built from interacting parts?
    back: |
      No one protein does the job alone: the pump builds a gradient, a symporter spends it, a channel lets water follow, the wall or vacuole handles the volume, and the ER and Golgi delivered every one of those proteins. Change one part and the others fail in predictable ways.
    topic_code: "2.5"
  - front: Big Idea connection → what does Unit 2 say about evolution?
    back: |
      Eukaryotic cells are chimeras: a host lineage plus engulfed bacteria, each with a history we can still read in membranes, genomes and ribosomes. Compartmentalization and endosymbiosis are evolutionary innovations that made large, complex cells possible.
    topic_code: "2.10"
  - front: The most-missed distinction in Unit 2 → tonicity vs water potential
    back: |
      Tonicity describes a solution's effect on cell volume and is about solute that cannot cross. Water potential is a number (bars) combining solute and pressure that predicts direction of water flow for any system, including walled cells where pressure matters. Use Ψ when numbers are given.
    topic_code: "2.7"
  - front: What to do with a question that gives Ψs and Ψp for two compartments
    back: |
      Add Ψs + Ψp for each compartment separately, compare the totals, and send water toward the lower total. Do not compare Ψs values alone; a cell with very negative Ψs but high turgor can still lose water to a dilute solution.
    hint: Total first, then compare.
    topic_code: "2.7"

quiz:
  description: |
    25 questions · about 35 minutes · a synthesis across every Unit 2 topic (2.1 to 2.10), built around AP
    Investigation 4 data, with about 30% review of Unit 1. Two stimulus sets, two numeric items (water potential
    and SA:V). Multiple choice, select-all, true/false and numeric items are graded at once; the fill-in-the-blank
    items are matched automatically; the two short answers and the long answer are graded by your teacher against
    the acceptable-answer summary.
  questions:
    # ---- Stimulus set A: onion epidermis in NaCl (2.7, 2.4)
    - slug: u02-w07-q01
      type: multiple_choice
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      stimulus: |
        Strips of onion epidermis were mounted in NaCl solutions at 25 °C. After 10 minutes, 100 cells in each strip were scored as plasmolysed or not. R = 0.0831 L·bar/(mol·K); 25 °C = 298 K; NaCl i = 2.

        | NaCl (M) | Cells plasmolysed (%) | Solution Ψs (bar) |
        |---|---|---|
        | 0.00 | 0 | 0.0 |
        | 0.10 | 2 | −5.0 |
        | 0.15 | 21 | −7.4 |
        | 0.20 | 52 | −9.9 |
        | 0.25 | 83 | −12.4 |
        | 0.30 | 98 | −14.9 |
      prompt: |
        At which solution is the water potential of the external solution closest to the water potential of a typical cell in the strip, and how do you know?
      options:
        - "0.00 M, because no cells were plasmolysed."
        - "0.20 M, because about half the cells were just at the point of plasmolysis, which is where the cell's Ψ equals the solution's Ψ with Ψp just reaching zero."
        - "0.30 M, because nearly all cells were plasmolysed."
        - "0.10 M, because plasmolysis first appeared there."
      option_explanations:
        - |
          At 0.00 M every cell is turgid, which shows the solution's Ψ is far above the cells'; it tells you water entered, not that the two were equal.
        - |
          Correct. Incipient plasmolysis, when the membrane just leaves the wall, is the point where Ψp = 0 and the cell's Ψ equals its Ψs, which equals the solution's Ψ; the 50% point is the best estimate of the typical cell.
        - |
          At 0.30 M the solution is well below the cells' Ψ; almost every cell has lost water, so this is the hypertonic extreme, not the match.
        - |
          The first few cells plasmolysed are the ones with the least negative Ψs, not the typical cell; the median cell is what the 50% point locates.
      answer: 1
      explanation: |
        A population of cells has a range of water potentials; the midpoint of the plasmolysis curve is the typical one. Plasmolysis is where turgor is zero, so at that moment Ψcell = Ψs(cell) = Ψsolution.

    - slug: u02-w07-q02
      type: multiple_choice
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      stimulus: |
        Strips of onion epidermis were mounted in NaCl solutions at 25 °C. After 10 minutes, 100 cells in each strip were scored as plasmolysed or not. R = 0.0831 L·bar/(mol·K); 25 °C = 298 K; NaCl i = 2.

        | NaCl (M) | Cells plasmolysed (%) | Solution Ψs (bar) |
        |---|---|---|
        | 0.00 | 0 | 0.0 |
        | 0.10 | 2 | −5.0 |
        | 0.15 | 21 | −7.4 |
        | 0.20 | 52 | −9.9 |
        | 0.25 | 83 | −12.4 |
        | 0.30 | 98 | −14.9 |
      prompt: |
        A student repeats the experiment with sucrose instead of NaCl at the same molarities. Which prediction is best justified?
      options:
        - "The same percentages, because molarity is what matters."
        - "More plasmolysis at each molarity, because sucrose molecules are larger."
        - "Less plasmolysis at each molarity, because sucrose does not dissociate (i = 1), so each solution's Ψs is only half as negative."
        - "No plasmolysis at all, because sucrose is a nutrient the cells take up."
      option_explanations:
        - |
          Molarity of formula units is not what matters; the number of dissolved particles is, and NaCl gives twice as many per mole as sucrose.
        - |
          Particle size has no bearing on water potential; a large sucrose molecule and a small Na⁺ ion each count as one particle.
        - |
          Correct. With i = 1, 0.20 M sucrose has Ψs ≈ −5.0 bar, the same as 0.10 M NaCl, so the curve shifts to higher molarities: about 0.40 M sucrose would be needed to plasmolyse half the cells.
        - |
          Sucrose does not cross the membrane freely in this time; it stays outside and lowers the solution's Ψ just as any solute does, only with i = 1.
      answer: 2
      explanation: |
        The i in −iCRT is where students lose points. Count particles: NaCl is two, sucrose is one, so the same molarity of NaCl is twice as effective osmotically.

    - slug: u02-w07-q03
      type: multiple_choice
      topic_code: "2.4"
      source: "Biology 2e §5.2 Passive Transport"
      points: 1
      stimulus: |
        Strips of onion epidermis were mounted in NaCl solutions at 25 °C. After 10 minutes, 100 cells in each strip were scored as plasmolysed or not. R = 0.0831 L·bar/(mol·K); 25 °C = 298 K; NaCl i = 2.

        | NaCl (M) | Cells plasmolysed (%) | Solution Ψs (bar) |
        |---|---|---|
        | 0.00 | 0 | 0.0 |
        | 0.10 | 2 | −5.0 |
        | 0.15 | 21 | −7.4 |
        | 0.20 | 52 | −9.9 |
        | 0.25 | 83 | −12.4 |
        | 0.30 | 98 | −14.9 |
      prompt: |
        Plasmolysis is possible only because water crosses the onion cell's plasma membrane while Na⁺ and Cl⁻ do not, within the time of the experiment. Which statement correctly explains this difference in permeability?
      options:
        - "The cell wall blocks ions but lets water through."
        - "Water is small and uncharged and can pass the hydrophobic core slowly on its own and quickly through aquaporins, whereas Na⁺ and Cl⁻ are charged and hydrated and can cross only through specific channels, which are few and gated."
        - "Ions are too large to fit through the membrane."
        - "The membrane actively pumps water in and ions out."
      option_explanations:
        - |
          The cellulose wall is a porous mesh that ions pass through easily; the barrier to ions is the plasma membrane inside it.
        - |
          Correct. The membrane's selectivity is based on charge and polarity; the two ions would need channels, which an epidermal cell keeps mostly closed, so the salt stays outside and the water potential gradient persists.
        - |
          Na⁺ is smaller than a water molecule; size is not what excludes it, charge is.
        - |
          Water is never pumped, and in this experiment it is leaving the cells, not entering; the movement is passive osmosis down the Ψ gradient.
      answer: 1
      explanation: |
        Every osmosis experiment depends on topic 2.4: the membrane must let water through and hold the solute back. That is why NaCl and sucrose both work as osmotic agents and why urea, which crosses, does not.

    # ---- Stimulus set B: cell fractionation (2.1, 2.9, 2.10)
    - slug: u02-w07-q04
      type: multiple_choice
      topic_code: "2.1"
      source: "Biology 2e §4.3 Eukaryotic Cells"
      points: 1
      stimulus: |
        Liver cells were broken open and the contents separated by spinning at increasing speeds. Each pellet was tested for a set of markers. A plus sign means the marker was detected.

        | Fraction | Spin speed | Circular DNA | Hydrolases active at pH 5 | Oxygen consumption | Membrane-bound ribosomes | Cristae seen in micrographs |
        |---|---|---|---|---|---|---|
        | 1 | low | − | − | − | − | − |
        | 2 | medium | + | − | + | − | + |
        | 3 | medium-high | − | + | − | − | − |
        | 4 | high | − | − | − | + | − |
      prompt: |
        Which fraction contains the mitochondria, and which two markers identify it?
      options:
        - "Fraction 1, because it was the heaviest and mitochondria are the largest organelle."
        - "Fraction 2, identified by oxygen consumption and cristae, with circular DNA as a third."
        - "Fraction 3, identified by acid hydrolases."
        - "Fraction 4, identified by membrane-bound ribosomes."
      option_explanations:
        - |
          The low-speed pellet is nuclei and unbroken cells; it has no markers of respiration, and the nucleus, not the mitochondrion, is the largest organelle.
        - |
          Correct. Respiration (oxygen use) and the folded inner membrane are mitochondrial signatures, and the circular DNA fits the endosymbiotic origin; three independent markers agree.
        - |
          Acid hydrolases are the lysosomal signature; a fraction with them and no respiration is lysosomes.
        - |
          Membrane-bound ribosomes are the rough ER, which fragments into small vesicles and pellets only at high speed.
      answer: 1
      explanation: |
        Identify organelles by what they do, not where they pellet. Each organelle has a marker enzyme or structure, and a good answer uses more than one.

    - slug: u02-w07-q05
      type: multiple_choice
      topic_code: "2.9"
      source: "Biology 2e §4.3 Eukaryotic Cells"
      points: 1
      stimulus: |
        Liver cells were broken open and the contents separated by spinning at increasing speeds. Each pellet was tested for a set of markers. A plus sign means the marker was detected.

        | Fraction | Spin speed | Circular DNA | Hydrolases active at pH 5 | Oxygen consumption | Membrane-bound ribosomes | Cristae seen in micrographs |
        |---|---|---|---|---|---|---|
        | 1 | low | − | − | − | − | − |
        | 2 | medium | + | − | + | − | + |
        | 3 | medium-high | − | + | − | − | − |
        | 4 | high | − | − | − | + | − |
      prompt: |
        When fraction 3 was incubated with a protein at pH 7.2, little digestion occurred; at pH 5 the protein was rapidly hydrolysed. Which conclusion about compartmentalization is best supported?
      options:
        - "The enzymes in fraction 3 are denatured at pH 7, so they cannot exist in a living cell."
        - "The organelle in fraction 3 maintains an internal pH near 5 so that its enzymes work inside it, while the same enzymes are nearly inactive at the pH of the cytosol, protecting the cell if they leak."
        - "The cell must keep its cytosol at pH 5."
        - "The enzymes work only on proteins from fraction 2."
      option_explanations:
        - |
          Low activity at pH 7.2 is not denaturation; the enzymes are simply at the wrong pH for their active site chemistry and recover at pH 5.
        - |
          Correct. The data show enzymes tuned to a compartment with its own pH, which is what compartmentalization is for: a chemistry that would be dangerous or useless in the cytosol is contained and optimised.
        - |
          The cytosol is near pH 7.2; keeping it at 5 would disable cytosolic enzymes, and the whole point of the lysosome is to avoid that.
        - |
          Nothing in the data limits the substrate; lysosomal hydrolases digest proteins, lipids, nucleic acids and polysaccharides from any source.
      answer: 1
      explanation: |
        Fractionation lets you test one compartment's chemistry on its own. A pH-5 optimum in an isolated fraction is direct evidence that the cell keeps that compartment acidic.

    - slug: u02-w07-q06
      type: multiple_choice
      topic_code: "2.10"
      source: "Biology 2e §23.1 Eukaryotic Origins"
      points: 1
      stimulus: |
        Liver cells were broken open and the contents separated by spinning at increasing speeds. Each pellet was tested for a set of markers. A plus sign means the marker was detected.

        | Fraction | Spin speed | Circular DNA | Hydrolases active at pH 5 | Oxygen consumption | Membrane-bound ribosomes | Cristae seen in micrographs |
        |---|---|---|---|---|---|---|
        | 1 | low | − | − | − | − | − |
        | 2 | medium | + | − | + | − | + |
        | 3 | medium-high | − | + | − | − | − |
        | 4 | high | − | − | − | + | − |
      prompt: |
        Fraction 2 is the only fraction with its own circular DNA, and fraction 4 (rough ER) has ribosomes but no DNA. Which argument does this comparison support?
      options:
        - "All organelles were once free-living bacteria."
        - "The ER is a former bacterium because it has ribosomes."
        - "Only the organelle in fraction 2 has features expected of a captured prokaryote; the ER's ribosomes are the cell's own, attached to its surface, so the endomembrane system arose by a different route, probably infolding of the ancestral cell's membrane."
        - "Fraction 2 contains the nucleus, because it has DNA."
      option_explanations:
        - |
          Fractions 3 and 4 have no DNA and no bacterial features; the endosymbiotic argument applies to mitochondria and chloroplasts only.
        - |
          The ER's ribosomes are eukaryotic cytosolic ribosomes docked on its outer face; they are not inside it and are not bacterial in type.
        - |
          Correct. Evidence must discriminate: a genome of its own is what separates the endosymbiotic organelles from the endomembrane system, which is thought to derive from inpocketing of the host cell's own membrane.
        - |
          Nuclear DNA is linear and the nucleus pellets at low speed in fraction 1; circular DNA in a respiring fraction is mitochondrial.
      answer: 2
      explanation: |
        Two origins for two kinds of compartment: the nucleus and endomembrane system by infolding, the mitochondrion and chloroplast by engulfment. The DNA column is what tells them apart.

    # ---- Synthesis across the unit
    - slug: u02-w07-q07
      type: multiple_choice
      topic_code: "2.5"
      source: "Biology 2e §5.3 Active Transport"
      points: 1
      prompt: |
        A gut cell is treated with a poison that stops ATP synthesis. Within minutes, glucose uptake from the gut stops, even though no ATP is used by the glucose transporter itself. Which explanation is best?
      options:
        - "The glucose transporter is a pump that secretly uses ATP."
        - "Without ATP the sodium-potassium pump stops, the Na⁺ gradient runs down, and the Na⁺-glucose symporter has no gradient left to drive glucose uphill."
        - "The poison destroys the membrane."
        - "Glucose uptake needs oxygen directly."
      option_explanations:
        - |
          The symporter binds no ATP; its energy source is the Na⁺ gradient, which is why the dependence on ATP is indirect and delayed by minutes rather than instant.
        - |
          Correct. Secondary active transport borrows energy stored in a gradient; cut off the primary pump and the stored energy drains away through leaks, taking glucose uptake with it.
        - |
          A metabolic poison leaves the bilayer intact; passive processes such as osmosis continue, which is how you can tell the membrane survives.
        - |
          Oxygen matters only as the way the cell makes ATP; the link to glucose transport runs through the pump, not through oxygen itself.
      answer: 1
      explanation: |
        Trace the energy: ATP → pump → Na⁺ gradient → symporter → glucose. A system of coupled parts fails in sequence when one link is cut.

    - slug: u02-w07-q08
      type: multiple_choice
      topic_code: "2.2"
      source: "Biology 2e §4.2 Prokaryotic Cells"
      points: 1
      prompt: |
        A bacterium is 2 μm long, and a eukaryotic cell with similar metabolic demands per unit volume is 20 μm across. Which combination of features would you expect to find in the eukaryote and not the bacterium, and why?
      options:
        - "A thicker membrane, to transport more."
        - "Internal membranes (mitochondrial cristae, ER) and cytoplasmic transport along a cytoskeleton, because at ten times the diameter the cell has one tenth the SA:V and diffusion alone cannot serve its interior."
        - "A smaller nucleus, to save space."
        - "No ribosomes, because large cells make proteins in the nucleus."
      option_explanations:
        - |
          Membrane thickness is fixed at 5-10 nm by the phospholipid, and a thicker barrier would slow transport, not speed it.
        - |
          Correct. Ten times the diameter means a hundred times the surface and a thousand times the volume; the eukaryote compensates with internal membranes for surface and with active transport along microtubules for distance.
        - |
          The nucleus is proportionate to the cell and has nothing to do with the exchange problem.
        - |
          Every cell has ribosomes; translation happens in the cytosol or on the ER, never inside the nucleus.
      answer: 1
      explanation: |
        Topics 2.2 and 2.9 are one argument: compartments and internal membranes are how a cell can be big. The cytoskeleton is how it moves things across distances diffusion cannot cover.

    - slug: u02-w07-q09
      type: multiple_choice
      topic_code: "2.6"
      source: "Biology 2e §5.2 Passive Transport"
      points: 1
      prompt: |
        A neuron at rest has far more K⁺ inside than outside, yet K⁺ does not simply rush out and equalise. Which statement best explains why?
      options:
        - "K⁺ cannot cross the membrane at all."
        - "K⁺ leaks out through channels down its concentration gradient, but the negative interior pulls it back; at rest the two forces nearly balance, so there is only a small net leak, which the pump repairs."
        - "K⁺ is bound to proteins and cannot move."
        - "The sodium-potassium pump pushes K⁺ out faster than it leaks."
      option_explanations:
        - |
          K⁺ crosses readily through leak channels; the resting membrane is more permeable to K⁺ than to any other ion.
        - |
          Correct. An ion responds to its electrochemical gradient, not concentration alone; the membrane potential opposes the outward concentration gradient, and the balance is why the resting potential is close to the K⁺ equilibrium value.
        - |
          Most intracellular K⁺ is free in solution; it is the electrical force, not binding, that holds it.
        - |
          The pump moves K⁺ in, not out; it compensates for the leak outward.
      answer: 1
      explanation: |
        Channels (topic 2.6), gradients (2.5) and membrane potential (2.8) are one system: an ion's movement is set by concentration and charge together.

    - slug: u02-w07-q10
      type: multiple_choice
      topic_code: "2.3"
      source: "Biology 2e §5.1 Components and Structure"
      points: 1
      prompt: |
        Membrane proteins that enter the cell by endocytosis and return to the surface by exocytosis keep the same orientation throughout: the part that faced the outside of the cell faces the inside of the vesicle, then the outside again. Which feature of membrane structure explains this?
      options:
        - "Proteins flip across the bilayer freely, so orientation is random."
        - "The bilayer is asymmetric and proteins cannot flip across it; the extracellular face of the plasma membrane becomes the inner face of a vesicle and is restored on fusion, so sugars and binding sites always end up outside."
        - "Vesicles have no membrane, so there is nothing to orient."
        - "Proteins are rebuilt each time a vesicle forms."
      option_explanations:
        - |
          Flipping a protein would drag its hydrophilic regions through the hydrophobic core, which does not happen; proteins move laterally, not across.
        - |
          Correct. Topology is conserved: the lumen of any vesicle or ER compartment is equivalent to the outside of the cell, which is why glycosylation in the ER lumen ends up on the cell surface.
        - |
          A vesicle is a sphere of bilayer pinched from a membrane; it has a membrane with two distinct faces.
        - |
          Membrane proteins last hours to days and cycle many times; nothing is rebuilt at each budding.
      answer: 1
      explanation: |
        Keep the sidedness straight: inside of ER = inside of Golgi = inside of vesicle = outside of cell. It explains the glycocalyx, the secretory pathway and receptor recycling in one picture.

    - slug: u02-w07-q11
      type: multiple_choice
      topic_code: "1.5"
      source: "Biology 2e §3.3 Lipids"
      points: 1
      prompt: |
        Review. Osmosis experiments use dialysis tubing, a sheet with pores that pass water and small ions but not sucrose. A living membrane achieves a similar selectivity by a different principle. Which comparison is correct?
      options:
        - "Both select by size only."
        - "Dialysis tubing selects by pore size, but the living membrane selects mainly by polarity: its hydrophobic phospholipid core admits nonpolar molecules and excludes polar and charged ones unless a protein provides a path."
        - "The living membrane has larger pores than dialysis tubing."
        - "Both are made of phospholipids."
      option_explanations:
        - |
          Size is the tubing's rule, but the living membrane admits large nonpolar steroids while blocking tiny Na⁺ ions, which no size rule can explain.
        - |
          Correct. The difference matters in experiments: dialysis tubing lets NaCl through, so it cannot be used as the osmotic solute with tubing, whereas a living cell holds NaCl out.
        - |
          A bilayer has no fixed pores at all; its channels are protein-lined and selective, and most of its surface is a continuous hydrophobic sheet.
        - |
          Dialysis tubing is regenerated cellulose, a polysaccharide; the lipid principle belongs to living membranes only.
      answer: 1
      explanation: |
