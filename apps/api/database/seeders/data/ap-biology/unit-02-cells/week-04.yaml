    # ---- Numeric
    - slug: u02-w04-q21
      type: numeric
      topic_code: "2.2"
      source: "Biology 2e §4.2 Prokaryotic Cells"
      points: 1
      prompt: |
        A cube-shaped cell has sides of 3 μm. Calculate its surface area to volume ratio (surface area divided by volume, in μm⁻¹). Give the number only.
      answer: { value: 2, tolerance: 0.05 }
      explanation: |
        Surface area = 6 × 3² = 54 μm². Volume = 3³ = 27 μm³. Ratio = 54 ÷ 27 = 2 μm⁻¹. The shortcut for any cube is 6 ÷ side: a 1 μm cube has ratio 6, a 2 μm cube 3, a 3 μm cube 2. The ratio keeps falling as the cell grows.

    # ---- Free response
    - slug: u02-w04-q22
      type: short_answer
      topic_code: "2.9"
      source: "Biology 2e §4.3 Eukaryotic Cells"
      points: 4
      prompt: |
        Conceptual analysis. The cells lining the small intestine have thousands of microvilli, fingerlike extensions of the plasma membrane, on the side facing the gut contents, and their mitochondria are packed with cristae. (a) Describe how microvilli change the cell's surface area to volume ratio. (b) Explain why that change matters for the cell's job. (c) Explain how the cristae address the same problem at the scale of an organelle. (d) Predict one consequence for an intestinal cell if a disease flattened its microvilli, and justify the prediction.
      answer: |
        Microvilli add membrane surface with almost no added volume, raising SA:V. The cell absorbs nutrients across that surface, so more membrane means more transport proteins and faster uptake. Cristae fold the inner mitochondrial membrane so more ATP-producing surface fits in one organelle. Flattened microvilli would cut absorption; the person would absorb less nutrient and could lose weight or suffer deficiency.
      explanation: |
        Four points, one per task.

        (a) Describe, 1 pt: microvilli increase surface area while adding little volume, so the SA:V ratio rises. "They make the cell bigger" earns nothing; the point is surface without volume.

        (b) Explain, 1 pt: the cell's job is absorption, which happens across the membrane (by transport proteins or diffusion), so the rate of uptake scales with the membrane area exposed to the gut contents. Accept "more area for transporters" or "more area for diffusion".

        (c) Explain, 1 pt: cristae are folds of the inner membrane that carry the electron transport chain and ATP synthase; folding fits more of that membrane, and so more ATP output, into a small organelle. The student must say the folding increases membrane surface for ATP-making machinery; naming cristae alone is a restatement.

        (d) Predict and justify, 1 pt: less surface means less absorption of nutrients (or water, or a specific nutrient); consequence such as malnutrition, weight loss, diarrhoea from unabsorbed solutes, or a deficiency. The justification must connect lost surface to lost absorption. Accept any consequence that follows from reduced uptake.

        Zero: answers that treat microvilli as cilia that move material, or that say cristae store energy.

    - slug: u02-w04-q23
      type: short_answer
      topic_code: "2.10"
      source: "Biology 2e §23.1 Eukaryotic Origins"
      points: 4
      prompt: |
        Scientific argumentation. A student claims that mitochondria are simply compartments the eukaryotic cell builds, like lysosomes, and were never independent organisms. (a) State the alternative claim made by the endosymbiotic theory. (b) Give two observations about mitochondria that the student's claim does not account for, and explain why each supports the alternative. (c) Describe one observation that would be inconsistent with the endosymbiotic theory if it were made.
      answer: |
        Endosymbiosis: mitochondria descend from an aerobic bacterium engulfed by an ancestral cell and retained. Evidence the student's view cannot explain: a separate circular genome and prokaryote-like ribosomes (a home-made compartment would carry no genetic system), and division by binary fission independent of the cell (lysosomes are made from Golgi vesicles, not by self-division); also two membranes. Inconsistent: finding that mitochondrial genes and ribosomes resemble eukaryotic nuclear ones rather than bacterial ones, or that cells assemble new mitochondria from scratch.
      explanation: |
        Four points.

        (a) 1 pt: mitochondria originated as free-living (aerobic) prokaryotes that were engulfed by an ancestral host cell and persisted inside it, the two becoming interdependent. Must mention engulfment or a former free-living prokaryote.

        (b) 2 pts, one per observation with its reasoning: any two of own circular DNA (a cell-built organelle would carry no genome), own ribosomes and tRNAs resembling bacterial ones (a bacterial translation system points to a bacterial ancestor), division by binary fission independent of the cell cycle (lysosomes and Golgi are made by budding, not self-replication; mitochondria come only from mitochondria), double membrane with the inner one bacterial in composition. Naming the observation without saying why the student's claim fails to explain it earns half the point for that observation.

        (c) 1 pt: any observation that would contradict the theory, e.g. mitochondrial ribosomes and gene sequences being eukaryotic in type, mitochondria being assembled de novo by the cell, mitochondria lacking any genome, or a single membrane. The observation must be specific.

        Zero: answers that only assert "scientists agree" or that list features of mitochondria (makes ATP, has cristae) that both claims explain equally.

    - slug: u02-w04-q24
      type: long_answer
      topic_code: "2.2"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. To test the claim that "a cell's size limits how quickly it can be supplied by diffusion", students cut agar blocks containing an indicator into cubes of side 0.5, 1.0, 2.0 and 3.0 cm, placed each in sodium hydroxide for the same time, then measured the depth the colour change reached and calculated the percentage of each cube's volume it had reached.

        | Cube side (cm) | SA:V (cm⁻¹) | Mean depth reached (cm), n = 3 | Volume reached (%) |
        |---|---|---|---|
        | 0.5 | 12 | 0.25 | 100 |
        | 1.0 | 6 | 0.42 | 99 |
        | 2.0 | 3 | 0.41 | 79 |
        | 3.0 | 2 | 0.40 | 59 |

        (a) Identify the independent and dependent variables, and state one variable held constant.
        (b) Describe the relationship between SA:V and the percentage of volume reached, using data.
        (c) The 0.5 cm cube's depth was 0.25 cm rather than about 0.4 cm. Explain why this is not evidence that diffusion was slower in the small cube.
        (d) Evaluate whether the data support the claim, and explain how the result applies to a real cell, naming two ways real cells get around the limit.
      answer: |
        IV: cube size (SA:V); DV: depth reached and percentage of volume reached; constant: time, NaOH concentration, temperature, agar composition. Percentage reached falls as SA:V falls (100% at 12, 59% at 2). The 0.5 cm cube is only 0.25 cm from any face to its centre, so the front reached the middle and could go no further; the depth is capped by geometry, not slowed. The data support the claim: diffusion covers a fixed distance in a fixed time, so only a cell small enough for that distance to reach its centre is fully supplied. Real cells stay small, divide, flatten or elongate, grow microvilli, or fold internal membranes.
      explanation: |
        Eight points.

        (a) 2 pts: 1 pt for independent variable = cube size (or SA:V) and dependent variable = depth reached or percentage of volume reached; 1 pt for a controlled variable (soaking time, NaOH concentration, temperature, agar and indicator composition).

        (b) 1 pt: as SA:V falls the percentage of volume reached falls, with at least two data points quoted (e.g. 100% at 12 cm⁻¹, 79% at 3, 59% at 2). A direction without numbers earns nothing.

        (c) 2 pts: 1 pt for recognising that the centre of a 0.5 cm cube is only 0.25 cm from every face, so the colour front met in the middle and the depth measurement was capped; 1 pt for stating that the cube was therefore fully reached (100%), consistent with diffusion proceeding at the same rate as in the larger cubes rather than slower. Accept "the whole cube changed colour so depth could not exceed half the side".

        (d) 3 pts: 1 pt for the evaluation: the data support the claim because diffusion reached a fixed depth (about 0.4 cm) regardless of size, so the fraction of a block that can be supplied depends on its size; 1 pt for the application: a cell relies on exchange across its surface, and once its interior lies farther from the surface than diffusion covers in a useful time, the centre is undersupplied; 1 pt for two ways cells cope, any two of: staying small, dividing when they grow, being flat or elongated, microvilli or other membrane projections, internal membranes (cristae, thylakoids), or (in large cells) cytoplasmic streaming.

        Zero for a part: restating the table without a comparison; claiming larger cubes diffuse faster because they have more surface area; treating the 0.5 cm result as an error without a geometric reason; naming organelles without connecting them to surface area.
