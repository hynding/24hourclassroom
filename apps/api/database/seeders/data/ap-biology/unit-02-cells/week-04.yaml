week: 4
unit: 2
title: Cell Structure, Cell Size and Compartments
topics: ["2.1", "2.2", "2.9", "2.10"]
guide: guides/week-04.md
guide_description: |
  The organelles as a division of labour, why a cell cannot simply grow bigger (surface area to volume), how
  internal membranes multiply surface and keep incompatible chemistry apart, and the four lines of evidence that
  mitochondria and chloroplasts were once free-living bacteria. Three worked examples (an SA:V table, an agar-cube
  diffusion data set, an endosymbiosis argument), misconceptions, self-check.
flashcards_description: |
  32 cards: organelle structure-to-function, the surface-area arithmetic, compartmentalization and the endosymbiosis
  evidence, with several "what does this data show" cards.

flashcards:
  - front: Cell theory → the three statements
    back: |
      All living things are made of one or more cells; the cell is the basic unit of life; new cells arise only from existing cells (Schleiden, Schwann and Virchow).
    topic_code: "2.1"
  - front: The four components every cell has
    back: |
      A plasma membrane, cytoplasm (cytosol plus whatever is suspended in it), DNA as the genetic material, and ribosomes. Prokaryotes have exactly these; eukaryotes add membrane-bound organelles.
    hint: Membrane, cytoplasm, DNA, ribosomes.
    topic_code: "2.1"
  - front: Prokaryote vs eukaryote → the defining difference
    back: |
      A eukaryotic cell keeps its DNA inside a membrane-bound nucleus and has other membrane-bound organelles; a prokaryotic cell has its DNA in a nucleoid region with no membrane around it and no organelles. Both have ribosomes.
    topic_code: "2.1"
  - front: Typical cell sizes → prokaryote, eukaryote, red blood cell
    back: |
      Prokaryotes about 0.1-5 μm across; eukaryotic cells about 10-100 μm; a human red blood cell about 8 μm. Light microscopes resolve to about 200 nm, electron microscopes far finer, which is why organelle detail needed the electron microscope.
    topic_code: "2.1"
  - front: Nucleus → envelope, pores, nucleolus
    back: |
      The nuclear envelope is two phospholipid bilayers pierced by pores that control traffic of RNA and proteins. Inside, DNA is wound with proteins as chromatin; the nucleolus is the dense region where ribosomal RNA is made and ribosomal subunits are assembled.
    topic_code: "2.1"
  - front: Ribosome → structure and job
    back: |
      Two subunits of rRNA and protein, assembled in the nucleolus and joined in the cytoplasm. Translates mRNA into a polypeptide. Free ribosomes make cytosolic proteins; ribosomes bound to the rough ER make membrane and secreted proteins.
    topic_code: "2.1"
  - front: Rough endoplasmic reticulum → function
    back: |
      Membrane sheets studded with ribosomes, continuous with the nuclear envelope. Newly made polypeptides enter its lumen, fold, and gain sugar side chains; it also makes membrane phospholipids. Abundant in secretory cells such as pancreatic and liver cells.
    topic_code: "2.1"
  - front: Smooth endoplasmic reticulum → function
    back: |
      ER with few or no ribosomes. Synthesises lipids and steroid hormones, detoxifies drugs and poisons (liver), and stores calcium ions (the sarcoplasmic reticulum of muscle).
    topic_code: "2.1"
  - front: Golgi apparatus → what happens between cis and trans
    back: |
      Vesicles from the ER fuse with the cis face; as proteins and lipids pass through the stacked sacs they are modified (mostly by adding or trimming sugars) and tagged for their destination; vesicles bud from the trans face toward lysosomes, the membrane or the outside.
    hint: Cis receives, trans ships.
    topic_code: "2.1"
  - front: Path of a secreted protein → from gene to outside
    back: |
      Nucleus (mRNA) → ribosome on rough ER → ER lumen (folding, first sugars) → transport vesicle → Golgi cis face → modification and tagging → secretory vesicle from the trans face → fusion with the plasma membrane (exocytosis).
    topic_code: "2.1"
  - front: Lysosome → contents and why it is a separate compartment
    back: |
      A single-membrane sac of hydrolytic enzymes that work best at a pH lower than the cytosol's. Digests worn-out organelles, engulfed microbes and macromolecules. Keeping the acid and the enzymes inside protects the rest of the cell.
    topic_code: "2.9"
  - front: Mitochondrion → the four parts and what each does
    back: |
      Outer membrane; inner membrane folded into cristae (site of the electron transport chain and ATP synthase); the intermembrane space between them; and the matrix inside, where the Krebs cycle runs and the organelle's own DNA and ribosomes sit.
    topic_code: "2.1"
  - front: Chloroplast → the three membranes and two spaces
    back: |
      Outer and inner envelope membranes; inside, flattened sacs called thylakoids stacked into grana, where the light reactions happen; the fluid around the thylakoids is the stroma, where the Calvin cycle makes sugar. Has its own DNA and ribosomes.
    topic_code: "2.1"
  - front: Peroxisome → function
    back: |
      A small single-membrane organelle that runs oxidation reactions: breaks down fatty acids and amino acids and detoxifies alcohol and other poisons. Hydrogen peroxide made in the process is destroyed inside, away from the cytosol.
    topic_code: "2.9"
  - front: Central vacuole of a plant cell → two jobs
    back: |
      Stores water and solutes and regulates the cell's water content; its pressure against the wall (turgor) holds non-woody plants upright. Lets a cell grow by taking up water rather than by making more cytoplasm.
    topic_code: "2.1"
  - front: Which structures are found only in plant cells, and which only in animal cells?
    back: |
      Plant only: cell wall of cellulose, chloroplasts, a large central vacuole, plasmodesmata. Animal only: centrosome with centrioles, lysosomes (plant digestion happens in the vacuole), and the extracellular matrix junctions.
    topic_code: "2.1"
  - front: Cytoskeleton → the three fibre types by diameter
    back: |
      Microfilaments (actin, about 7 nm) for movement and shape changes; intermediate filaments (8-10 nm, e.g. keratin) that bear tension and anchor organelles; microtubules (tubulin, about 25 nm) that resist compression, track vesicles and pull chromosomes.
    hint: Thin, middle, thick.
    topic_code: "2.1"
  - front: Surface area to volume ratio → the equations
    back: |
      For a cube of side s, SA = 6s² and V = s³, so SA:V = 6/s. For a sphere of radius r, SA = 4πr² and V = (4/3)πr³, so SA:V = 3/r. Either way the ratio falls as the cell grows.
    topic_code: "2.2"
  - front: Why does doubling a cell's size quarter its efficiency?
    back: |
      Surface area grows with the square of the dimension, volume with the cube. A 1 mm cube has SA:V 6:1; a 2 mm cube has 24:8 = 3:1. Exchange across the surface serves twice as much interior per unit of membrane in the small cell.
    topic_code: "2.2"
  - front: Why are cells small? → the exchange argument
    back: |
      Nutrients, oxygen and wastes cross the plasma membrane (surface) but are needed or produced throughout the cytoplasm (volume). A large cell has too little membrane per unit of interior and too far for molecules to diffuse, so it starves or poisons itself. It divides instead.
    topic_code: "2.2"
  - front: Three ways cells raise surface area without growing
    back: |
      Fold the membrane outward (microvilli of the gut, root hairs), fold internal membranes (mitochondrial cristae, thylakoids), or change shape to something long and thin (neurons, root hairs). Each adds surface without adding much volume.
    topic_code: "2.2"
  - front: Given this data, what's the conclusion? Agar cubes of 1, 2 and 3 cm side in dye for 10 minutes
    back: |
      The dye penetrates the same depth into each cube, so the fraction of the volume reached is largest in the smallest cube (highest SA:V). Conclusion: diffusion alone can supply a small cell but not a large one.
    topic_code: "2.2"
  - front: Compartmentalization → what it buys a eukaryotic cell
    back: |
      Membranes let incompatible reactions run at once (acid hydrolysis in lysosomes, oxidation in peroxisomes), keep enzymes and substrates concentrated together, and create gradients across internal membranes that the cell can use to make ATP.
    topic_code: "2.9"
  - front: How do internal membranes raise a mitochondrion's output?
    back: |
      Folding the inner membrane into cristae multiplies the surface available for electron transport chains and ATP synthase without enlarging the organelle. More cristae, more ATP per unit volume; muscle mitochondria are heavily folded.
    topic_code: "2.9"
  - front: Do prokaryotes compartmentalize at all?
    back: |
      Not with membrane-bound organelles, but they do organise: the nucleoid region concentrates DNA, some photosynthetic bacteria fold their plasma membrane inward to carry the light reactions, and the cell wall and capsule form outer layers. Specialisation, not organelles.
    topic_code: "2.9"
  - front: Endomembrane system → members and the two organelles that are not in it
    back: |
      Nuclear envelope, rough and smooth ER, Golgi, lysosomes, vesicles and vacuoles, and the plasma membrane, all exchanging membrane by vesicle traffic. Mitochondria and chloroplasts are not members: their membranes are not connected by vesicles.
    topic_code: "2.9"
  - front: Endosymbiotic theory → the claim
    back: |
      Mitochondria and chloroplasts descend from free-living prokaryotes that were engulfed by an ancestral host cell and survived inside it, each partner benefiting, until neither could live alone. An aerobic bacterium became the mitochondrion; a cyanobacterium became the chloroplast.
    topic_code: "2.10"
  - front: Four lines of evidence that mitochondria were once bacteria
    back: |
      Two membranes (the inner one bacterial, the outer from the host); their own circular DNA; their own ribosomes and tRNAs that resemble prokaryotic ones; and division by a process like binary fission, independently of the cell. Also bacterial-sized, about 1-5 μm.
    hint: Membranes, DNA, ribosomes, division.
    topic_code: "2.10"
  - front: Why is the mitochondrial inner membrane the bacterial one?
    back: |
      When the host engulfed the bacterium, the bacterium's own plasma membrane became the inner membrane; the host's membrane wrapped around it to become the outer membrane. The cristae still resemble the folded surface of alpha-proteobacteria.
    topic_code: "2.10"
  - front: Which came first, mitochondria or chloroplasts, and how do we know?
    back: |
      Mitochondria. Every eukaryotic lineage has (or once had) mitochondria, while only some have chloroplasts, so the aerobic endosymbiosis happened in the common ancestor and the photosynthetic one later, in a subset. Fossil eukaryotes appear about 2.1 billion years ago.
    topic_code: "2.10"
  - front: Secondary endosymbiosis
    back: |
      A eukaryote engulfs a eukaryotic alga that already has chloroplasts. The resulting plastid is wrapped in three or four membranes and sometimes retains a remnant nucleus (nucleomorph) from the alga. Explains chloroplasts in groups such as euglenids.
    topic_code: "2.10"
  - front: Given this data, what's the conclusion? Mitochondrial ribosomes are blocked by antibiotics that block bacterial ribosomes but not cytosolic ones
    back: |
      The mitochondrial translation machinery is bacterial in type, not eukaryotic, which is what the endosymbiotic origin predicts and a from-scratch origin inside the cell does not.
    topic_code: "2.10"

quiz:
  description: |
    24 questions · about 30 minutes · about 70% this week (cell structure, cell size, compartmentalization and
    endosymbiosis) and 30% review of Unit 1. Multiple choice, select-all, true/false and numeric items are graded
    at once; the fill-in-the-blank items are matched automatically; the two short answers and the long answer are
    graded by your teacher against the acceptable-answer summary.
  questions:
    # ---- Stimulus set: surface area to volume (2.2)
    - slug: u02-w04-q01
      type: multiple_choice
      topic_code: "2.2"
      source: "Biology 2e §4.2 Prokaryotic Cells"
      points: 1
      stimulus: |
        Students cut agar cubes containing a pH indicator and placed each in a sodium hydroxide solution for 10 minutes. The indicator turns pink where the hydroxide has diffused in. Each cube was then cut open and the pink depth measured.

        | Cube side (cm) | Surface area (cm²) | Volume (cm³) | SA:V | Pink depth (cm) | Volume reached by dye (%) |
        |---|---|---|---|---|---|
        | 1 | 6 | 1 | 6.0 | 0.4 | 99 |
        | 2 | 24 | 8 | 3.0 | 0.4 | 78 |
        | 3 | 54 | 27 | 2.0 | 0.4 | 59 |
      prompt: |
        Which statement best describes the pattern in the table?
      options:
        - "The hydroxide diffused to the same depth in every cube, so the fraction of the volume it reached fell as cube size rose."
        - "The hydroxide diffused faster into the larger cubes because they had more surface area."
        - "The surface area to volume ratio rose with cube size, so larger cubes were reached more completely."
        - "The pink depth was proportional to the cube's volume."
      option_explanations:
        - |
          Correct. Diffusion covered 0.4 cm in every cube regardless of size; what changed was how much of the interior lies within 0.4 cm of a face, which is nearly all of a 1 cm cube and barely half of a 3 cm cube.
        - |
          More total surface does not speed diffusion per unit of surface; the depth column shows the same 0.4 cm in each cube, so nothing diffused faster into the large ones.
        - |
          The SA:V column falls, from 6 to 3 to 2, as side length rises; this option reverses the ratio and the outcome.
        - |
          The pink depth is constant at 0.4 cm while volume rises from 1 to 27 cm³; depth depends on time, not on the size of the block.
      answer: 0
      explanation: |
        Describe the data before explaining them: same depth, falling percentage. Diffusion over a fixed time reaches a fixed distance, so a small cell is served throughout and a large cell is not.

    - slug: u02-w04-q02
      type: multiple_choice
      topic_code: "2.2"
      source: "Biology 2e §4.2 Prokaryotic Cells"
      points: 1
      stimulus: |
        Students cut agar cubes containing a pH indicator and placed each in a sodium hydroxide solution for 10 minutes. The indicator turns pink where the hydroxide has diffused in. Each cube was then cut open and the pink depth measured.

        | Cube side (cm) | Surface area (cm²) | Volume (cm³) | SA:V | Pink depth (cm) | Volume reached by dye (%) |
        |---|---|---|---|---|---|
        | 1 | 6 | 1 | 6.0 | 0.4 | 99 |
        | 2 | 24 | 8 | 3.0 | 0.4 | 78 |
        | 3 | 54 | 27 | 2.0 | 0.4 | 59 |
      prompt: |
        If the cubes are models of cells and the hydroxide is a model of oxygen, which conclusion about cell size is best supported?
      options:
        - "A large cell is more efficient because it has more surface area in total."
        - "A cell that grows large will have interior regions that exchange materials too slowly across its surface, so cells stay small or divide."
        - "Cell size has no effect on exchange as long as the membrane is permeable."
        - "Large cells compensate by diffusing materials faster through their cytoplasm."
      option_explanations:
        - |
          Total surface area rose, but surface per unit of volume fell; what matters to each cubic centimetre of interior is the ratio, not the total.
        - |
          Correct. The 3 cm cube has 41% of its volume unreached after 10 minutes; a cell in the same position would have a core starved of oxygen and flooded with waste, which is why cells divide before they get there.
        - |
          The membrane was equally permeable in all three cubes and the outcome still depended on size; permeability does not remove the geometric limit.
        - |
          Diffusion rate inside the agar was identical in all three cubes (same depth); nothing in the data suggests a large block speeds its own diffusion, and cytoplasm does not either.
      answer: 1
      explanation: |
        The model turns geometry into biology: surface area scales with the square and volume with the cube, so exchange per unit of interior gets worse as a cell grows.

    - slug: u02-w04-q03
      type: multiple_choice
      topic_code: "2.2"
      source: "Biology 2e §4.2 Prokaryotic Cells"
      points: 1
      stimulus: |
        Students cut agar cubes containing a pH indicator and placed each in a sodium hydroxide solution for 10 minutes. The indicator turns pink where the hydroxide has diffused in. Each cube was then cut open and the pink depth measured.

        | Cube side (cm) | Surface area (cm²) | Volume (cm³) | SA:V | Pink depth (cm) | Volume reached by dye (%) |
        |---|---|---|---|---|---|
        | 1 | 6 | 1 | 6.0 | 0.4 | 99 |
        | 2 | 24 | 8 | 3.0 | 0.4 | 78 |
        | 3 | 54 | 27 | 2.0 | 0.4 | 59 |
      prompt: |
        A student proposes testing a flat slab 3 cm × 3 cm × 0.5 cm, which has a volume of 4.5 cm³. Which prediction is best justified?
      options:
        - "The slab will be reached less completely than the 2 cm cube because its volume is smaller."
        - "The slab will be reached almost completely, because no point inside it is more than 0.25 cm from a face, so its shape gives it a high SA:V despite its volume."
        - "The slab will behave exactly like the 3 cm cube because one of its dimensions is 3 cm."
        - "The slab cannot be compared with the cubes because its surface area cannot be calculated."
      option_explanations:
        - |
          Smaller volume alone does not predict the outcome; a 0.5 cm thick slab is reached across its whole thickness by a 0.4 cm front from each side, so it will be more complete, not less.
        - |
          Correct. Shape, not just size, sets SA:V: the slab's surface area is 24 cm² for 4.5 cm³ (ratio about 5.3), and a 0.4 cm front from both faces covers its full 0.5 cm thickness. This is why flattened and elongated cells exist.
        - |
          The 3 cm cube has points 1.5 cm from any face; the slab has none farther than 0.25 cm. Sharing one dimension does not make the geometry the same.
        - |
          A rectangular slab's surface area is straightforward (2 × 9 + 4 × 1.5 = 24 cm²); the comparison is exactly what the model is for.
      answer: 1
      explanation: |
        Flattening is one of the ways real cells beat the size limit: the same reasoning explains thin leaves, flat red blood cells and the folded membranes you meet in topic 2.9.

    # ---- Cell structure (2.1)
    - slug: u02-w04-q04
      type: multiple_choice
      topic_code: "2.1"
      source: "Biology 2e §4.4 The Endomembrane System and Proteins"
      points: 1
      prompt: |
        A cell in the pancreas secretes large amounts of digestive enzymes. Compared with a skin cell, which feature would you expect it to have in greater amount, and why?
      options:
        - "More smooth ER, because enzymes are lipids."
        - "More rough ER and Golgi, because secreted proteins are made on ER-bound ribosomes, folded and modified in the ER lumen, then sorted and packaged by the Golgi."
        - "More lysosomes, because secreted enzymes are stored in lysosomes until needed."
        - "More free ribosomes, because secreted proteins are made in the cytosol and pushed through the membrane."
      option_explanations:
        - |
          Enzymes are proteins, not lipids; the smooth ER makes lipids and steroids and detoxifies drugs, which does not match a cell exporting protein.
        - |
          Correct. Proteins destined for export enter the ER as they are made, so a secretory cell is packed with rough ER and has an enlarged Golgi to process and ship the output.
        - |
          Lysosomes digest material inside the cell; secretory enzymes travel in Golgi-derived secretory vesicles, not in lysosomes.
        - |
          Free ribosomes make proteins that stay in the cytosol; a finished folded protein cannot be pushed through a bilayer, which is why export proteins enter the ER while still being made.
      answer: 1
      explanation: |
        Form follows output: count a cell's rough ER and Golgi and you can guess its job. Structure-to-function reasoning about organelles is the heart of topic 2.1.

    - slug: u02-w04-q05
      type: multiple_choice
      topic_code: "2.1"
      source: "Biology 2e §4.3 Eukaryotic Cells"
      points: 1
      prompt: |
        Electron micrographs show that mitochondria in heart muscle have many more cristae than mitochondria in skin cells. Which explanation best connects the structure to the function?
      options:
        - "Cristae store the glucose that muscle burns during exercise."
        - "Cristae are folds of the inner membrane that carry the electron transport chains and ATP synthase; more folds mean more ATP-producing surface in the same volume, which a continuously contracting tissue needs."
        - "Cristae are extra outer membranes that protect the organelle from the stress of contraction."
        - "Cristae hold the mitochondrial DNA, and muscle needs more copies of it."
      option_explanations:
        - |
          Glucose is not stored in mitochondria; muscle stores glycogen in the cytosol, and the organelle receives pyruvate, not whole sugar.
        - |
          Correct. ATP production in the mitochondrion happens on the inner membrane, so folding that membrane is the way to pack more output into one organelle, a direct application of the surface-area idea.
        - |
          Cristae are infoldings of the inner membrane, not additional outer membranes, and they do not play a protective role.
        - |
          Mitochondrial DNA sits in the matrix, the fluid inside the inner membrane; the number of cristae reflects membrane-bound enzyme capacity, not gene copies.
      answer: 1
      explanation: |
        Folded internal membranes are the cell's answer to the SA:V problem at organelle scale. The cristae of a mitochondrion and the thylakoids of a chloroplast are the same trick.

    - slug: u02-w04-q06
      type: multiple_choice
      topic_code: "2.1"
      source: "Biology 2e §4.3 Eukaryotic Cells"
      points: 1
      prompt: |
        In a chloroplast, which pairing of structure and location is correct?
      options:
        - "The light-capturing pigments are in the stroma, and sugar is built on the thylakoid membranes."
        - "The light-capturing pigments are in the thylakoid membranes, which are stacked into grana, and sugar is built in the surrounding fluid, the stroma."
        - "The thylakoids are in the intermembrane space between the two envelope membranes."
        - "The stroma is the space inside a thylakoid where ATP is stored."
      option_explanations:
        - |
          Reversed. Chlorophyll is a membrane-bound pigment and sits in the thylakoid membrane; the enzymes that fix carbon into sugar are dissolved in the stroma.
        - |
          Correct. Membrane-bound light reactions in the thylakoids, soluble Calvin-cycle enzymes in the stroma; the stacking of thylakoids into grana packs a large pigment surface into a small organelle.
        - |
          The thylakoids are inside the inner envelope membrane, suspended in the stroma, not squeezed between the two envelope membranes.
        - |
          The space inside a thylakoid is the thylakoid lumen; the stroma is outside the thylakoids, and ATP is used as it is made rather than stored.
      answer: 1
      explanation: |
        Learn the chloroplast as two places: membrane (thylakoid, light, pigments) and fluid (stroma, sugar synthesis). Unit 3 fills in the chemistry.

    - slug: u02-w04-q07
      type: multiple_choice
      topic_code: "2.9"
      source: "Biology 2e §4.3 Eukaryotic Cells"
      points: 1
      prompt: |
        Lysosomal enzymes work best at about pH 5, while the cytosol is about pH 7.2. Which statement explains why this arrangement benefits the cell?
      options:
        - "The enzymes are inactive at cytosolic pH, so if a lysosome leaks a little, the cytosol is not digested; the compartment lets the cell keep a harsh chemistry in one place and run it at full strength there."
        - "The low pH makes the lysosome membrane impermeable to everything."
        - "The enzymes need the low pH to be synthesised on the ribosome."
        - "Lysosomes keep the cytosol acidic so that all enzymes work faster."
      option_explanations:
        - |
          Correct. Compartmentalization lets the cell maintain a pH and an enzyme set that would be destructive in the cytosol; the pH difference is also a safety margin against accidental leakage.
        - |
          Membrane permeability is set by the membrane's lipids and proteins, not by the pH inside; the lysosome membrane in fact transports digestion products out to the cytosol.
        - |
          Lysosomal enzymes are made on rough ER ribosomes at normal pH and only meet acid after they are delivered; the pH matters for activity, not synthesis.
        - |
          The cytosol is held near neutral; a cytosol at pH 5 would denature most cytosolic enzymes. Keeping acid inside the lysosome is the whole point.
      answer: 0
      explanation: |
        A compartment lets the cell run two incompatible chemistries at once. This is the general argument of topic 2.9, with the lysosome as its cleanest example.

    - slug: u02-w04-q08
      type: multiple_choice
      topic_code: "2.10"
      source: "Biology 2e §23.1 Eukaryotic Origins"
      points: 1
      prompt: |
        Which observation about mitochondria is most difficult to explain if they arose by the cell building them from scratch, and is therefore the strongest support for an endosymbiotic origin?
      options:
        - "They are surrounded by a membrane."
        - "They contain enzymes."
        - "They carry their own circular chromosome and ribosomes that resemble bacterial ones, and they reproduce by dividing in two independently of the cell cycle."
        - "They are found in nearly every eukaryotic cell."
      option_explanations:
        - |
          Every organelle of the endomembrane system is membrane-bound and none of those is thought to be a former bacterium; a membrane alone is not evidence of independent ancestry.
        - |
          All organelles contain enzymes; the point is whether the organelle has its own genetic system, which is what a former organism would carry.
        - |
          Correct. A compartment the cell makes itself has no reason to carry a separate genome, prokaryote-type ribosomes and a binary-fission-like division; a captured bacterium would have all three.
        - |
          Being universal shows the event happened early, before eukaryotes diversified, but it does not by itself distinguish an engulfed bacterium from a home-made compartment.
      answer: 2
      explanation: |
        The best evidence for a historical claim is the feature the rival explanation cannot account for. Here that is the organelle's own genetic machinery and self-replication.

    - slug: u02-w04-q09
      type: multiple_choice
      topic_code: "2.9"
      source: "Biology 2e §4.2 Prokaryotic Cells"
      points: 1
      prompt: |
        Some photosynthetic bacteria have extensive infoldings of their plasma membrane that carry the light-capturing pigments. Which statement about these cells is correct?
      options:
        - "The infoldings make them eukaryotes, because they now have an internal membrane."
        - "The infoldings are chloroplasts, so the cells are plants."
        - "The cells remain prokaryotes, but the folded membrane shows that even without organelles, cells gain surface for membrane-bound reactions by folding the membrane they have."
        - "The infoldings show that the cell has a nucleus."
      option_explanations:
        - |
          Being a eukaryote means having a membrane-bound nucleus and organelles; a folded plasma membrane that is still continuous with the cell surface does not qualify.
        - |
          A chloroplast is a separate double-membrane organelle with its own DNA; an infolded bacterial membrane is part of the cell's own single membrane, and the cell is a bacterium, not a plant.
        - |
          Correct. The principle of topic 2.9 (more membrane, more capacity) applies in prokaryotes too, which is one reason a cyanobacterium with thylakoid-like folds made a plausible ancestor for the chloroplast.
        - |
          The nucleus is a double-membrane compartment around the DNA; photosynthetic infoldings have nothing to do with where the DNA sits, which in bacteria is the unbounded nucleoid.
      answer: 2
      explanation: |
        Prokaryotes specialise their one membrane; eukaryotes multiply membranes into organelles. Both are solving the same surface-area problem.

    - slug: u02-w04-q10
      type: multiple_choice
      topic_code: "1.7"
      source: "Biology 2e §3.4 Proteins"
      points: 1
      prompt: |
        Review. A protein destined for the lysosome is synthesised on the rough ER, passes through the Golgi and arrives in a compartment at pH 5. Which statement about its structure is most reasonable?
      options:
        - "Its primary structure changes when it enters the acidic lysosome."
        - "It must be folded so that its tertiary structure is stable at low pH, because ionic bonds and hydrogen bonds between R groups depend on which groups are protonated."
        - "It has no tertiary structure, because enzymes are linear."
        - "Its peptide bonds are hydrolysed by the acid, which activates it."
      option_explanations:
        - |
          Primary structure is the covalent amino-acid sequence; pH changes which side chains carry charge but does not alter the sequence.
        - |
          Correct. A change in pH changes the charge on acidic and basic R groups, so a protein that must work at pH 5 has evolved a fold whose stabilising interactions hold at that pH, and the same protein is often less active at pH 7.
        - |
          Every enzyme has a three-dimensional fold; a linear chain has no active site.
        - |
          Mild acid does not hydrolyse peptide bonds, and breaking the backbone would destroy the enzyme rather than activate it.
      answer: 1
      explanation: |
        Unit 1's rule that pH shapes proteins is why a compartment with its own pH needs its own set of enzymes. Compartmentalization and protein chemistry are one story.

    - slug: u02-w04-q11
      type: multiple_choice
      topic_code: "1.5"
      source: "Biology 2e §3.3 Lipids"
      points: 1
      prompt: |
        Review. The nuclear envelope, the ER, the Golgi, lysosomes and the plasma membrane can exchange pieces of membrane through vesicles that bud from one and fuse with another. Which property of phospholipids makes this budding and fusion possible without any covalent bonds being made or broken?
      options:
        - "Phospholipids are covalently cross-linked into a rigid sheet that can be cut and pasted."
        - "Phospholipids are amphipathic and held in a bilayer only by hydrophobic exclusion, so a bilayer can pinch off or merge while heads stay in water and tails stay hidden."
        - "Phospholipids are water-soluble, so membranes dissolve and re-form."
        - "Phospholipids are polymers whose chains can be unzipped and re-joined."
      option_explanations:
        - |
          There are no covalent bonds between neighbouring phospholipids; if there were, membranes could not flow, bud or fuse.
        - |
          Correct. Because the bilayer is a self-assembled structure held by water's exclusion of the tails, any rearrangement that keeps tails buried and heads wet is allowed, including pinching off a vesicle and fusing it elsewhere.
        - |
          A membrane does not dissolve in water; its tails are insoluble, which is exactly why it stays as a sheet while being reshaped.
        - |
          Phospholipids are individual molecules, not polymers; a bilayer is a two-dimensional fluid of separate molecules.
      answer: 1
      explanation: |
        Week 2's self-assembling bilayer is what lets the endomembrane system work as a system: membrane is a fluid that can be budded and merged, not a wall that must be rebuilt.

    - slug: u02-w04-q12
      type: multiple_choice
      topic_code: "1.2"
      source: "Biology 2e §2.3 Carbon"
      points: 1
      prompt: |
        Review. A bacterial cell is about 1 μm across and a liver cell about 20 μm. Which comparison of their chemical make-up is correct?
      options:
        - "Only the eukaryotic cell contains carbon-based macromolecules."
        - "Both are built from the same four most abundant elements (C, H, O, N) in the same four classes of macromolecule; the eukaryote differs in organisation, not in chemistry."
        - "The bacterium is made of simpler elements that do not include nitrogen."
        - "The eukaryotic cell contains phosphorus but the bacterium does not."
      option_explanations:
        - |
          Bacteria have cell walls of carbohydrate, membranes of phospholipid, proteins and DNA, all carbon-based.
        - |
          Correct. Cell size and compartmentalization are differences of architecture; the chemistry of life, from water to the four macromolecule classes, is shared across all cells.
        - |
          Bacterial proteins and nucleic acids need nitrogen exactly as a liver cell's do; the elements of life do not change with cell type.
        - |
          Bacterial DNA, ATP and membrane phospholipids all contain phosphate; no cell can do without phosphorus.
      answer: 1
      explanation: |
        Unit 1 is the chemistry; Unit 2 is the architecture. A prokaryote is not a simpler chemical, it is a smaller and less partitioned building made of the same materials.

    - slug: u02-w04-q13
      type: multiple_choice
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        Review. The cytoplasm is 70 to 80% water, yet it behaves as a semi-solid gel rather than a thin liquid. Which combination explains both facts?
      options:
        - "Water in cells is frozen into an ice-like lattice at body temperature."
        - "Water's polarity lets it hydrate the many proteins, nucleic acids and cytoskeletal fibres that are dissolved or suspended in it, so a crowded solution of large molecules in a polar solvent is viscous."
        - "Cytoplasm contains no water at all; the 70% figure refers to oil."
        - "The membrane squeezes the water so hard that it becomes solid."
      option_explanations:
        - |
          Ice forms only below 0 °C; at 37 °C cytoplasmic water is liquid, with hydrogen bonds constantly breaking and re-forming.
        - |
          Correct. Water is the solvent in which the cell's macromolecules and fibres are dispersed; the gel-like consistency comes from the dissolved and suspended material, not from the water being anything but liquid.
        - |
          The 70-80% figure is water; cells that are mostly oil would not be able to dissolve ions, sugars or proteins.
        - |
          Pressure in a cell is modest and does not solidify water; the semi-solid texture is a property of a crowded aqueous solution.
      answer: 1
      explanation: |
        Water as the solvent of life (week 1) is what the cytosol is. Keep that in mind in topic 2.7, where the cell's water content is the thing osmosis changes.

    # ---- Select all
    - slug: u02-w04-q14
      type: multi_select
      topic_code: "2.10"
      source: "Biology 2e §23.1 Eukaryotic Origins"
      points: 2
      partial_credit: true
      prompt: |
        Which observations are evidence that chloroplasts descended from free-living cyanobacteria? Select all that apply.
      options:
        - "Chloroplasts are surrounded by two membranes."
        - "Chloroplasts contain a circular DNA molecule separate from the nuclear genome."
        - "Chloroplasts are green."
        - "Chloroplast ribosomes resemble bacterial ribosomes more than cytosolic eukaryotic ribosomes."
        - "Chloroplasts divide by a process resembling binary fission rather than being assembled anew by the cell."
      option_explanations:
        - |
          Correct. The inner membrane is interpreted as the cyanobacterium's own membrane and the outer as the host's engulfing membrane; a home-made organelle would have no reason for two.
        - |
          Correct. A separate circular chromosome is a bacterial feature; an organelle built by the cell from nuclear instructions would carry no genome of its own.
        - |
          Colour is simply what chlorophyll looks like; it does not distinguish an engulfed cyanobacterium from any other way of acquiring pigment, so it is not evidence of ancestry.
        - |
          Correct. Prokaryote-type ribosomes, sensitive to the same antibiotics as bacterial ribosomes, point to a bacterial origin of the translation machinery.
        - |
          Correct. Chloroplasts arise only from existing chloroplasts by division, as bacteria do; they are never built from scratch.
      answer: [0, 1, 3, 4]
      explanation: |
        The evidence is the same list for both organelles: membranes, genome, ribosomes, division. Any observation that a home-made compartment would share (a membrane, enzymes, colour) is not evidence.

    - slug: u02-w04-q15
      type: multi_select
      topic_code: "2.1"
      source: "Biology 2e §4.3 Eukaryotic Cells"
      points: 2
      partial_credit: true
      prompt: |
        A cell viewed under the electron microscope has a cell wall, a large central vacuole and chloroplasts. Which statements about this cell are correct? Select all that apply.
      options:
        - "It is a eukaryotic cell, because chloroplasts are membrane-bound organelles."
        - "It is a plant cell, and its wall is built mainly of cellulose."
        - "It cannot contain mitochondria, because it has chloroplasts."
        - "Its central vacuole stores water and solutes and helps maintain turgor."
        - "It must be an animal cell, because animal cells are the only cells with a vacuole."
      option_explanations:
        - |
          Correct. Membrane-bound organelles of any kind, chloroplasts included, mark a eukaryote; prokaryotes have none.
        - |
          Correct. The combination of wall, large central vacuole and chloroplasts is the plant signature, and plant walls are cellulose (fungal walls are chitin, bacterial walls peptidoglycan).
        - |
          Plant cells have both: chloroplasts make sugar in the light, mitochondria respire it day and night. A common misconception is that the two are alternatives.
        - |
          Correct. The central vacuole can occupy most of the cell's volume; its water content presses the membrane against the wall and keeps non-woody tissue upright.
        - |
          Animal cells have small vesicles and sometimes vacuoles, but a large central vacuole, a wall and chloroplasts are plant features, and animal cells have none of the three.
      answer: [0, 1, 3]
      explanation: |
        Identify a cell by its combination of parts, and remember that plant cells have everything an animal cell has except centrioles and lysosomes, plus three structures of their own.

    # ---- True / false
    - slug: u02-w04-q16
      type: true_false
      topic_code: "2.2"
      source: "Biology 2e §4.2 Prokaryotic Cells"
      points: 1
      prompt: |
        True or false: As a spherical cell doubles its radius, its surface area doubles and its volume doubles, so the ratio between them is unchanged.
      answer: false
      explanation: |
        False. Surface area is proportional to r² and volume to r³, so doubling the radius multiplies surface area by 4 and volume by 8; the ratio halves. This is the arithmetic behind the whole topic: a growing cell has less and less membrane per unit of interior, which is why cells stay microscopic and why large or active cells fold their membranes.

    - slug: u02-w04-q17
      type: true_false
      topic_code: "1.4"
      source: "Biology 2e §3.2 Carbohydrates"
      points: 1
      prompt: |
        Review. True or false: The plant cell wall is built from cellulose, whose β 1-4 linked glucose chains hydrogen-bond into fibres, which is why the wall is rigid and why the cell's own amylase cannot digest it.
      answer: true
      explanation: |
        True. The wall is a structural polysaccharide, and the β linkage from week 2 explains both its properties: straight chains bundle into microfibrils that resist stretching, and the α-specific enzymes a plant uses on its starch cannot touch them. The wall is also why plant cells respond to water differently from animal cells (topic 2.7).

    - slug: u02-w04-q18
      type: true_false
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        Review. True or false: Ions such as Na⁺ and Cl⁻ dissolve in the cytosol because water molecules surround each ion with their oppositely charged ends, forming a hydration shell.
      answer: true
      explanation: |
        True. Water's partial charges let it pull ions out of a lattice and keep them apart. The same hydration shell is what makes an ion too large and too polar to slip through the hydrophobic core of a membrane, which is why ions need channels (topics 2.4 and 2.6).

    # ---- Fill in the blank
