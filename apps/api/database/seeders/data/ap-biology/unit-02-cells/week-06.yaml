    # ---- True / false
    - slug: u02-w06-q16
      type: true_false
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Water moves across a membrane from the side with the higher (less negative) water potential to the side with the lower (more negative) water potential.
      answer: true
      explanation: |
        True. This is the one rule of water potential. Solutes lower Ψ, pressure raises it, and water runs downhill in Ψ regardless of how the two components combine. A cell at −6 bar loses water to a solution at −9 bar and gains it from pure water at 0 bar.

    - slug: u02-w06-q17
      type: true_false
      topic_code: "2.4"
      source: "Biology 2e §5.2 Passive Transport"
      points: 1
      prompt: |
        Review. True or false: A plant cell in pure water does not burst because its plasma membrane is less permeable to water than an animal cell's membrane.
      answer: false
      explanation: |
        False. Plant cell membranes are highly permeable to water, often more so, thanks to aquaporins. The cell does not burst because the cellulose wall does not stretch: as water enters, pressure (Ψp) builds until the cell's total Ψ equals that of the water and net entry stops. The wall, not the membrane, is the difference.

