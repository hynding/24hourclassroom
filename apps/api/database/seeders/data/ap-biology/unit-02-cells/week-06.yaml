week: 6
unit: 2
title: Facilitated Diffusion, Osmosis and Water Potential
topics: ["2.6", "2.7", "2.8"]
guide: guides/week-06.md
guide_description: |
  Channels versus carriers and why one saturates; osmosis as diffusion of water; tonicity and what it does to an
  animal cell and to a plant cell; water potential as the quantity that predicts which way water moves, with
  Ψ = Ψs + Ψp and Ψs = −iCRT worked through; how cells and organisms osmoregulate; endocytosis and exocytosis.
  Three worked examples (a solute-potential calculation, a potato-core data set, a carrier-saturation graph),
  misconceptions, self-check.
flashcards_description: |
  33 cards on facilitated diffusion, tonicity, water potential arithmetic, osmoregulation and bulk transport.

flashcards:
  - front: Facilitated diffusion
    back: |
      Passive movement of a polar or charged substance down its gradient through a membrane protein. No ATP is spent; the protein supplies a hydrophilic path, not energy.
    topic_code: "2.6"
  - front: Channel protein vs carrier protein → mechanism and speed
    back: |
      A channel is a hydrated pore; the substance passes without binding, tens of millions per second. A carrier binds the substance, changes shape and releases it on the other side, about a thousand to a million per second, and is specific to one substance.
    topic_code: "2.6"
  - front: Why does carrier-mediated transport level off as concentration rises?
    back: |
      Each carrier handles one substrate at a time and takes a fixed time per cycle. Once every carrier is occupied (saturation) the rate cannot rise further however steep the gradient. Simple diffusion through the bilayer never saturates.
    hint: A fixed number of turnstiles.
    topic_code: "2.6"
  - front: Given this data, what's the conclusion? Glucose uptake rises with concentration then plateaus; ethanol uptake rises linearly
    back: |
      Glucose is crossing by a carrier (a limited number of transporters saturate); ethanol is crossing by simple diffusion through the bilayer (rate proportional to gradient, no plateau).
    topic_code: "2.6"
  - front: Aquaporin
    back: |
      A channel protein specific for water. It lets water cross a membrane far faster than it can slip through the bilayer. Abundant in kidney tubules, red blood cells and plant root cells.
    topic_code: "2.6"
  - front: Gated channel
    back: |
      An ion channel that opens or closes in response to a signal: a voltage change, a bound ligand, or mechanical stretch. Lets a cell control when an ion flows; the basis of nerve impulses.
    topic_code: "2.6"
  - front: Why do ions need channels even though they are tiny?
    back: |
      Charge. An ion carries a hydration shell and cannot shed it to enter the nonpolar core; a channel lines a path with polar groups that replace the water. Size is nearly irrelevant.
    topic_code: "2.6"
  - front: Osmosis
    back: |
      Diffusion of water across a selectively permeable membrane, from where free water is more concentrated (fewer solutes) to where it is less concentrated (more solutes). Passive; no ATP.
    topic_code: "2.7"
  - front: Osmolarity
    back: |
      The total concentration of solute particles in a solution, counting each dissolved particle separately (so 1 M NaCl is about 2 osmolar). Higher osmolarity means less free water.
    topic_code: "2.7"
  - front: Hypotonic, isotonic, hypertonic → defined relative to what?
    back: |
      Always relative to the cell. A hypotonic solution has fewer solutes than the cell, so water enters; isotonic, equal, no net movement; hypertonic, more solutes, so water leaves. Tonicity is about the solution's effect on cell volume.
    hint: Hypo = water in. Hyper = water out.
    topic_code: "2.7"
  - front: Red blood cell in pure water, in isotonic saline, in strong salt
    back: |
      Pure water (hypotonic): water enters, the cell swells and bursts (lysis). Isotonic (about 0.9% NaCl): no change. Strong salt (hypertonic): water leaves, the cell shrivels (crenation). No wall, so volume changes freely.
    topic_code: "2.7"
  - front: Plant cell in pure water, in isotonic solution, in strong salt
    back: |
      Pure water: water enters until the wall pushes back; the cell is turgid, which is the healthy state. Isotonic: flaccid, limp. Hypertonic: water leaves, the membrane pulls away from the wall (plasmolysis) and the plant wilts.
    topic_code: "2.7"
  - front: Turgor pressure
    back: |
      The pressure of a water-filled vacuole and cytoplasm pushing the membrane against the cell wall. A positive pressure potential. It holds leaves and stems of non-woody plants upright; loss of it is wilting.
    topic_code: "2.7"
  - front: Plasmolysis
    back: |
      The shrinking of a plant cell's protoplast away from its wall when water leaves in a hypertonic solution. The wall keeps its shape, the membrane does not. Reversible if water is restored in time.
    topic_code: "2.7"
  - front: Water potential → equation and sign convention
    back: |
      Ψ = Ψs + Ψp, in bars or megapascals. Pure water at atmospheric pressure has Ψ = 0. Solutes always lower Ψ (Ψs is zero or negative); pressure raises it (Ψp positive inside a turgid cell, zero in an open beaker). Water moves from higher Ψ to lower Ψ.
    topic_code: "2.7"
  - front: Solute potential → equation and what each symbol means
    back: |
      Ψs = −iCRT. i is the ionisation constant (1 for sucrose, 2 for NaCl); C is molar concentration; R is the pressure constant, 0.0831 L·bar/(mol·K); T is temperature in kelvin (°C + 273). The result is negative.
    hint: Everything on the right is positive; the minus sign makes it negative.
    topic_code: "2.7"
  - front: Ψs of 1.0 M sucrose at 22 °C
    back: |
      Ψs = −(1)(1.0)(0.0831)(295) = −24.5 bar. For 0.1 M it is −2.45 bar. For 1.0 M NaCl at the same temperature, i = 2 gives −49.0 bar.
    topic_code: "2.7"
  - front: A plant cell at equilibrium in an open beaker of solution → what can you conclude?
    back: |
      Its Ψ equals the solution's Ψ, which (with no pressure) is the solution's Ψs. If the cell's Ψs is known, Ψp = Ψcell − Ψs gives the turgor pressure.
    topic_code: "2.7"
  - front: Which way does water move between a cell at Ψ = −6 bar and a solution at Ψ = −9 bar?
    back: |
      Out of the cell. Water moves from higher (less negative) to lower (more negative) water potential; −6 is higher than −9.
    topic_code: "2.7"
  - front: Given this data, what's the conclusion? Potato cores gain mass in 0.0 and 0.2 M sucrose, lose mass in 0.4 M and above
    back: |
      The cores' water potential equals that of a sucrose solution somewhere between 0.2 and 0.4 M (where the line crosses zero change). Below that molarity the solution is hypotonic to the tissue, above it hypertonic.
    topic_code: "2.7"
  - front: Contractile vacuole
    back: |
      An organelle of freshwater protists such as Paramecium that collects the water constantly entering by osmosis and pumps it out, using ATP. Without it the cell would burst.
    topic_code: "2.7"
  - front: Osmoregulation in freshwater fish vs marine fish
    back: |
      Freshwater fish are hypertonic to their water: they take in water, so they excrete lots of dilute urine and actively absorb salt through their gills. Marine fish are hypotonic to sea water: they lose water, so they drink, excrete little concentrated urine and pump salt out through their gills.
    topic_code: "2.7"
  - front: What fraction of its energy does a fish spend on osmoregulation?
    back: |
      About 5% of its metabolic energy. Keeping an internal water balance different from the surroundings is active work, which is one reason an isotonic body fluid is advantageous.
    topic_code: "2.7"
  - front: How does the kidney respond when blood becomes too concentrated?
    back: |
      Osmoreceptors detect the rise in blood solute; a hormone (ADH) is released and the kidney tubules insert aquaporins, reclaiming water and producing small volumes of concentrated urine. Blood is diluted back toward its set point.
    topic_code: "2.7"
  - front: Endocytosis → the three kinds
    back: |
      Phagocytosis (cell eating): large particles or cells engulfed into a vesicle that fuses with a lysosome. Pinocytosis (cell drinking): a droplet of extracellular fluid taken in. Receptor-mediated endocytosis: a specific substance bound to surface receptors, clustered in a clathrin-coated pit, taken in.
    topic_code: "2.8"
  - front: Receptor-mediated endocytosis → the LDL example
    back: |
      Cholesterol travels in blood as LDL particles. Cells with LDL receptors bind the particles, the pit pinches in as a clathrin-coated vesicle, and the cholesterol is released inside. Defective receptors (familial hypercholesterolaemia) leave LDL in the blood.
    topic_code: "2.8"
  - front: Exocytosis
    back: |
      A vesicle fuses with the plasma membrane and releases its contents outside. Used to secrete proteins (enzymes, hormones, antibodies), release neurotransmitters, and add membrane to the cell surface. Requires ATP.
    topic_code: "2.8"
  - front: Why is bulk transport classed as active?
    back: |
      Reshaping membrane, moving vesicles along the cytoskeleton and fusing them all consume ATP, and the material moved is not following its own gradient. A vesicle lets the cell move things that could never cross the bilayer, such as whole proteins.
    topic_code: "2.8"
  - front: Clathrin
    back: |
      A protein that coats the cytosolic face of a membrane pit and pulls it inward into a vesicle during phagocytosis and receptor-mediated endocytosis. The coat is shed once the vesicle forms.
    topic_code: "2.8"
  - front: What happens to the membrane's surface area during endocytosis and exocytosis?
    back: |
      Endocytosis removes membrane from the surface; exocytosis adds it back. A cell that secretes continuously must also take membrane in, or its surface would keep growing. The two are in balance.
    topic_code: "2.8"
  - front: Simple diffusion, facilitated diffusion, active transport, bulk transport → sort by energy and protein
    back: |
      Simple diffusion: no protein, no ATP. Facilitated diffusion: protein, no ATP, down the gradient. Active transport: protein (pump), ATP, against the gradient. Bulk transport: vesicles, ATP, independent of the gradient.
    topic_code: "2.8"
  - front: Which direction is water moving if a cell's Ψ is −8 bar and it is placed in pure water?
    back: |
      Into the cell: pure water is at 0 bar, higher than −8. An animal cell would swell and burst; a plant cell would take up water until its Ψp rose by 8 bar and its total Ψ reached 0.
    topic_code: "2.7"
  - front: Why does the cell count particles, not molecules, in osmosis?
    back: |
      Osmotic effects depend on how much free water is tied up by dissolved particles, whatever they are. NaCl splits into two ions, so each formula unit counts twice; that is the i in Ψs = −iCRT.
    topic_code: "2.7"

quiz:
  description: |
    25 questions · about 30 minutes · about 70% this week (facilitated diffusion, tonicity, water potential,
    osmoregulation and bulk transport) and 30% review of Unit 1 and weeks 4-5. Two numeric items use
    Ψ = Ψs + Ψp and Ψs = −iCRT with R = 0.0831 L·bar/(mol·K). Multiple choice, select-all, true/false and numeric
    items are graded at once; the fill-in-the-blank items are matched automatically; the two short answers and
    the long answer are graded by your teacher against the acceptable-answer summary.
  questions:
    # ---- Stimulus set: potato cores in sucrose (2.7)
    - slug: u02-w06-q01
      type: multiple_choice
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      stimulus: |
        Students cut potato cores of equal size, weighed them, soaked each in a sucrose solution for 24 hours at 22 °C, blotted and reweighed them. Each value is the mean of five cores.

        | Sucrose (M) | Initial mass (g) | Final mass (g) | Change in mass (%) |
        |---|---|---|---|
        | 0.0 | 5.1 | 5.9 | +15.7 |
        | 0.2 | 5.0 | 5.4 | +8.0 |
        | 0.4 | 5.2 | 5.1 | −1.9 |
        | 0.6 | 5.0 | 4.6 | −8.0 |
        | 0.8 | 5.1 | 4.4 | −13.7 |
        | 1.0 | 5.0 | 4.1 | −18.0 |
      prompt: |
        Which statement best describes the pattern in the data?
      options:
        - "The cores gained water in every solution, but gained more in dilute solutions."
        - "The percentage change in mass fell steadily as sucrose concentration rose, from a gain of about 16% in water to a loss of 18% in 1.0 M, crossing zero between 0.2 and 0.4 M."
        - "The cores lost mass in every solution because sucrose dissolves potato tissue."
        - "Mass change was unrelated to sucrose concentration."
      option_explanations:
        - |
          The sign changes: the cores in 0.4 M and above lost mass, so they did not gain water in every solution.
        - |
          Correct. Describing data means giving the direction, the range and the crossing point; the zero crossing is the molarity at which the solution is isotonic to the tissue.
        - |
          The cores in 0.0 and 0.2 M gained mass; sucrose is not dissolving the tissue, it is changing the water potential of the solution.
        - |
          The change in mass falls monotonically with concentration, a clear relationship.
      answer: 1
      explanation: |
        Always locate the zero crossing in an osmosis data set: it is the concentration at which the solution has the same water potential as the tissue, and everything else follows from it.

    - slug: u02-w06-q02
      type: multiple_choice
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      stimulus: |
        Students cut potato cores of equal size, weighed them, soaked each in a sucrose solution for 24 hours at 22 °C, blotted and reweighed them. Each value is the mean of five cores.

        | Sucrose (M) | Initial mass (g) | Final mass (g) | Change in mass (%) |
        |---|---|---|---|
        | 0.0 | 5.1 | 5.9 | +15.7 |
        | 0.2 | 5.0 | 5.4 | +8.0 |
        | 0.4 | 5.2 | 5.1 | −1.9 |
        | 0.6 | 5.0 | 4.6 | −8.0 |
        | 0.8 | 5.1 | 4.4 | −13.7 |
        | 1.0 | 5.0 | 4.1 | −18.0 |
      prompt: |
        Which explanation accounts for the mass gain in the 0.0 M solution?
      options:
        - "Sucrose moved into the cores by active transport, adding mass."
        - "The potato cells have a lower (more negative) water potential than pure water because they contain solutes, so water moved into the cells by osmosis."
        - "The potato cells pumped water in using ATP."
        - "Pure water dissolved starch out of the cells, and the starch solution weighed more."
      option_explanations:
        - |
          There is no sucrose in the 0.0 M beaker to move, and in any case sucrose does not cross the membrane freely; the change is water.
        - |
          Correct. Pure water has Ψ = 0; cell sap with dissolved sugars and ions has a negative Ψ; water moves down the gradient into the tissue until pressure against the walls stops it.
        - |
          Water is never pumped directly; it follows solutes passively. The gain costs the cell nothing.
        - |
          Starch is insoluble and stays in the cells; losing material would reduce mass, not raise it.
      answer: 1
      explanation: |
        Water moves from higher to lower water potential. Living tissue always has solutes, so in pure water it always gains until pressure balances the solute effect.

    - slug: u02-w06-q03
      type: multiple_choice
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      stimulus: |
        Students cut potato cores of equal size, weighed them, soaked each in a sucrose solution for 24 hours at 22 °C, blotted and reweighed them. Each value is the mean of five cores.

        | Sucrose (M) | Initial mass (g) | Final mass (g) | Change in mass (%) |
        |---|---|---|---|
        | 0.0 | 5.1 | 5.9 | +15.7 |
        | 0.2 | 5.0 | 5.4 | +8.0 |
        | 0.4 | 5.2 | 5.1 | −1.9 |
        | 0.6 | 5.0 | 4.6 | −8.0 |
        | 0.8 | 5.1 | 4.4 | −13.7 |
        | 1.0 | 5.0 | 4.1 | −18.0 |
      prompt: |
        Using the zero crossing, which is the best estimate of the water potential of the potato tissue? (Ψs = −iCRT; R = 0.0831 L·bar/(mol·K); 22 °C = 295 K; sucrose i = 1.)
      options:
        - "About −24.5 bar, the solute potential of 1.0 M sucrose."
        - "About −9 bar, the solute potential of a sucrose solution of roughly 0.36 M, where the mass change would be zero."
        - "0 bar, because the cores were in water."
        - "About +9 bar, because the tissue is under turgor pressure."
      option_explanations:
        - |
          1.0 M is the solution in which the cores lost the most water, so the tissue's Ψ must be much higher than −24.5 bar.
        - |
          Correct. Interpolating between +8.0% at 0.2 M and −1.9% at 0.4 M puts zero change near 0.36 M; Ψs = −(1)(0.36)(0.0831)(295) ≈ −8.8 bar, and at equilibrium with no change in mass the tissue's Ψ equals the solution's.
        - |
          Only one beaker held pure water, and the cores in it gained mass, which shows their Ψ was below zero.
        - |
          Water potential of living tissue is negative; turgor raises Ψp but the solutes in the sap keep the total below zero, or the cores would not have gained water from the 0.2 M solution.
      answer: 1
      explanation: |
        This is the AP Investigation 4 calculation: find the isotonic molarity from the graph, convert it to Ψs with −iCRT, and that number is the tissue's water potential.

    # ---- Facilitated diffusion (2.6)
    - slug: u02-w06-q04
      type: multiple_choice
      topic_code: "2.6"
      source: "Biology 2e §5.2 Passive Transport"
      points: 1
      prompt: |
        A graph of the rate of glucose uptake by red blood cells against external glucose concentration rises steeply at first, then flattens into a plateau. Which conclusion is best supported?
      options:
        - "Glucose enters by simple diffusion through the bilayer, which is slow at high concentration."
        - "Glucose enters through a limited number of carrier proteins that become saturated, so once every carrier is occupied the rate cannot rise further."
        - "The cells run out of ATP at high glucose concentration."
        - "High glucose concentration damages the membrane."
      option_explanations:
        - |
          Simple diffusion gives a straight line: the rate stays proportional to the gradient at every concentration, with no plateau.
        - |
          Correct. A plateau is the signature of a carrier: each transporter binds one glucose, changes shape and releases it, taking a fixed time per molecule, so there is a maximum rate set by how many carriers the cell has.
        - |
          Glucose uptake into red blood cells is facilitated diffusion and uses no ATP; energy supply has nothing to do with the plateau.
        - |
          Nothing in the data suggests damage; the rate stays at its maximum rather than falling, which a damaged membrane would not do.
      answer: 1
      explanation: |
        Saturation kinetics identify a protein-mediated process. The same curve returns for enzymes in Unit 3: a limited number of binding sites gives a maximum rate.

    - slug: u02-w06-q05
      type: multiple_choice
      topic_code: "2.6"
      source: "Biology 2e §5.2 Passive Transport"
      points: 1
      prompt: |
        A mutation removes aquaporins from the cells of a kidney tubule. Which effect is predicted, and why?
      options:
        - "Water can no longer cross those cells at all, because the bilayer is completely impermeable to water."
        - "Water still crosses, but far more slowly, because aquaporins give water a fast hydrophilic channel and without them water must slip through the bilayer; the kidney reclaims less water and produces large volumes of dilute urine."
        - "The cells take up more water, because aquaporins normally pump water out."
        - "Nothing changes, because water moves by active transport through other pumps."
      option_explanations:
        - |
          A bare bilayer does let some water through; it is slow, not zero. Aquaporins multiply the rate, they do not create it.
        - |
          Correct. Aquaporins are passive channels that raise the rate of osmosis many fold; a kidney without them cannot concentrate urine, which is the condition nephrogenic diabetes insipidus.
        - |
          Aquaporins are channels, not pumps; water moves through them in whichever direction the water potential gradient dictates.
        - |
          Water is never moved by active transport; it follows solutes by osmosis, and the aquaporin is the route that makes that fast.
      answer: 1
      explanation: |
        Channels change rate, not direction. The direction of water movement is always set by water potential; aquaporins decide how quickly the cell can respond.

    - slug: u02-w06-q06
      type: multiple_choice
      topic_code: "2.7"
      source: "Biology 2e §5.2 Passive Transport"
      points: 1
      prompt: |
        A patient is accidentally given an intravenous drip of pure water instead of isotonic saline. Which effect on red blood cells is predicted, and why?
      options:
        - "The cells shrivel, because pure water is hypertonic to the cells."
        - "The cells swell and burst, because pure water is hypotonic to the cytoplasm and water enters by osmosis, and the cells have no wall to resist the pressure."
        - "Nothing happens, because the cell membrane is impermeable to water."
        - "The cells become turgid and function better."
      option_explanations:
        - |
          Pure water has no solutes, so it is hypotonic, not hypertonic; shrivelling (crenation) happens in salt solutions stronger than the cytoplasm.
        - |
          Correct. Water flows down its potential gradient into the cell; without a wall there is nothing to generate opposing pressure, so the cell lyses. This is why IV fluids are isotonic.
        - |
          Red cells are richly supplied with aquaporins and water crosses quickly; the whole danger lies in how permeable they are.
        - |
          Turgid is a word for walled cells; an animal cell cannot build turgor pressure and simply bursts.
      answer: 1
      explanation: |
        The same solution has opposite consequences for an animal cell and a plant cell. The difference is the wall, which turns water uptake into pressure rather than rupture.

    - slug: u02-w06-q07
      type: multiple_choice
      topic_code: "2.7"
      source: "Biology 2e §5.2 Passive Transport"
      points: 1
      prompt: |
        A Paramecium living in pond water expels water from its contractile vacuole several times a minute. When the same organism is moved into a solution of higher solute concentration, the vacuole contracts much less often. Which explanation is best?
      options:
        - "Pond water is hypotonic to the cell, so water constantly enters by osmosis and must be pumped out; in the more concentrated solution less water enters, so less needs removing."
        - "The organism drinks more in pond water."
        - "The contractile vacuole takes in solutes from the pond, and there are fewer solutes to take in when the solution is concentrated."
        - "Higher solute concentration poisons the vacuole."
      option_explanations:
        - |
          Correct. The vacuole is an osmoregulatory organ; its rate of contraction is a direct read-out of the rate of osmotic water entry, which depends on the water potential gradient between cell and surroundings.
        - |
          The organism does not control water entry by drinking; water enters through its membrane by osmosis whether it wants it or not.
        - |
          The vacuole expels water, it does not collect solutes; it is the response to water entering, not a device for harvesting the pond.
        - |
          The change is a graded response to a smaller water influx, not damage; move the organism back to pond water and contraction rate returns.
      answer: 0
      explanation: |
        A freshwater cell is always being flooded. The contractile vacuole does with ATP what a plant cell wall does with pressure: it keeps the cell from bursting.

    - slug: u02-w06-q08
      type: multiple_choice
      topic_code: "2.8"
      source: "Biology 2e §5.4 Bulk Transport"
      points: 1
      prompt: |
        In familial hypercholesterolaemia, cells carry defective LDL receptors. Which statement correctly describes why blood cholesterol rises?
      options:
        - "Cholesterol can no longer diffuse through the bilayer into cells."
        - "LDL particles cannot be bound and taken up by receptor-mediated endocytosis, so they stay in the blood."
        - "Cells secrete more cholesterol by exocytosis."
        - "Cholesterol is no longer pumped into cells by the sodium-potassium pump."
      option_explanations:
        - |
          Free cholesterol would cross a bilayer, but in blood it travels packaged inside LDL particles, which are far too large to diffuse through a membrane.
        - |
          Correct. Receptor-mediated endocytosis is specific: no functioning receptor, no uptake. The LDL stays in circulation and the person's risk of heart disease rises.
        - |
          The defect is in uptake, not output; cells with the disease are starved of cholesterol while the blood is loaded with it.
        - |
          The sodium-potassium pump moves ions, not lipoprotein particles; a 20 nm particle can only enter a cell inside a vesicle.
      answer: 1
      explanation: |
        Receptor-mediated endocytosis lets a cell take up a specific substance from a dilute solution. A disease in the receptor shows how dependent the cell is on the route.

    - slug: u02-w06-q09
      type: multiple_choice
      topic_code: "2.8"
      source: "Biology 2e §5.4 Bulk Transport"
      points: 1
      prompt: |
        A nerve ending releases neurotransmitter molecules stored in vesicles when a signal arrives. Which statement about the release is correct?
      options:
        - "The molecules diffuse through the bilayer because they are small."
        - "The vesicles fuse with the plasma membrane and release their contents outside, which is exocytosis and requires ATP; the vesicle membrane becomes part of the cell surface."
        - "The vesicles are expelled whole into the gap between cells."
        - "The molecules are carried out one at a time by the sodium-potassium pump."
      option_explanations:
        - |
          Many neurotransmitters are charged or polar and cannot cross the bilayer; in any case the cell releases thousands at once from a vesicle, not by diffusion.
        - |
          Correct. Exocytosis is the mechanism for secreting anything stored in vesicles; the fused membrane is later recovered by endocytosis so the ending does not keep growing.
        - |
          Whole vesicles are not released; the membrane of the vesicle merges with the cell membrane and only the contents leave.
        - |
          The pump moves Na⁺ and K⁺ only, and it moves ions one cycle at a time, far too slowly to release a signal burst.
      answer: 1
      explanation: |
        Exocytosis is how a cell exports in bulk and in bursts. Membrane added by fusion is balanced by endocytosis elsewhere, keeping surface area constant.

    - slug: u02-w06-q10
      type: multiple_choice
      topic_code: "2.1"
      source: "Biology 2e §4.3 Eukaryotic Cells"
      points: 1
      prompt: |
        Review. A wilted houseplant recovers within an hour of being watered. Which organelle is most directly responsible for the recovery, and what happens inside it?
      options:
        - "The chloroplast, which makes sugar that stiffens the leaves."
        - "The central vacuole, which refills with water by osmosis, restoring turgor pressure against the cell wall."
        - "The mitochondrion, which produces ATP to pump the cells back into shape."
        - "The nucleus, which directs the cell to make a new wall."
      option_explanations:
        - |
          Sugar production takes hours of light and does not change the plant's posture; wilting and recovery are a matter of water, not food.
        - |
          Correct. The vacuole is the cell's water store; when soil water is available again its Ψ gradient draws water in, the vacuole swells, the membrane presses on the wall and the tissue stands up.
        - |
          Water is never pumped directly, and no ATP is needed for osmosis; recovery happens because water potential outside the roots rose.
        - |
          The wall is unchanged throughout wilting; it is the pressure against it that was lost and is regained.
      answer: 1
      explanation: |
        Week 4's organelle inventory meets this week's osmosis: the central vacuole is where a plant cell's turgor lives.

    - slug: u02-w06-q11
      type: multiple_choice
      topic_code: "2.5"
      source: "Biology 2e §5.3 Active Transport"
      points: 1
      prompt: |
        Review. A marine fish drinks sea water and excretes the excess salt through its gills. Which statement about the salt excretion is correct?
      options:
        - "Salt leaves by simple diffusion, because sea water has less salt than the fish."
        - "Salt is moved from the fish's less concentrated blood into the more concentrated sea by active transport, which costs ATP."
        - "Salt follows water out of the gills by osmosis."
        - "The fish does not need to excrete salt because it is isotonic with the sea."
      option_explanations:
        - |
          Sea water is more concentrated in salt than the fish's blood; diffusion would carry salt in, not out.
        - |
          Correct. Moving an ion up its gradient is uphill work; gill cells rich in mitochondria and pumps do it, which is part of the roughly 5% of metabolic energy a fish spends on osmoregulation.
        - |
          Osmosis moves water, not salt; and water is leaving the fish, which is why it must drink in the first place.
        - |
          A marine bony fish is hypotonic to sea water; that mismatch is the whole reason it must drink and pump.
      answer: 1
      explanation: |
        Osmoregulation combines last week's active transport with this week's osmosis: water follows gradients passively, and the organism spends ATP on the ions that set those gradients.

    - slug: u02-w06-q12
      type: multiple_choice
      topic_code: "2.3"
      source: "Biology 2e §5.1 Components and Structure"
      points: 1
      prompt: |
        Review. During endocytosis a patch of plasma membrane pinches inward to form a vesicle, and during exocytosis a vesicle fuses back into the membrane. Which feature of the membrane makes these events possible without tearing it?
      options:
        - "The membrane is a rigid sheet with hinges at fixed points."
        - "The membrane is a fluid bilayer held together by hydrophobic exclusion, so it can bend, pinch off and reseal while every tail stays hidden from water."
        - "Proteins stitch the vesicle shut with covalent bonds."
        - "The membrane dissolves and re-forms at the site."
      option_explanations:
        - |
          A rigid sheet would crack; the whole point of the fluid mosaic model is that the membrane has no fixed structure to break.
        - |
          Correct. A bilayer is a self-sealing fluid: any edge exposes tails to water, so a pinched-off patch spontaneously closes into a sphere and a fusing vesicle merges seamlessly.
        - |
          Proteins (clathrin, fusion proteins) guide and drive the shape changes, but the lipid reseals itself by hydrophobic exclusion, not by covalent stitching.
        - |
          The membrane never dissolves; its tails are insoluble, which is why it remains a continuous sheet throughout.
      answer: 1
      explanation: |
        Bulk transport is the fluid mosaic model in action. Every budding and fusing event is the bilayer's self-assembly from week 2 happening in reverse and forward.

