      type: true_false
      topic_code: "2.8"
      source: "Biology 2e §5.4 Bulk Transport"
      points: 1
      prompt: |
        True or false: Endocytosis and exocytosis are forms of passive transport, because the material inside the vesicle is not moving against a concentration gradient.
      answer: false
      explanation: |
        False. Bulk transport is active: forming, moving and fusing vesicles all consume ATP, and the cargo's gradient is irrelevant because it never crosses the bilayer as individual molecules. A cell deprived of ATP stops both processes within minutes.

