      partial_credit: true
      prompt: |
        Which statements about facilitated diffusion are correct? Select all that apply.
      options:
        - "It moves substances down their concentration gradient."
        - "It requires a membrane protein."
        - "It requires ATP hydrolysis by the transporter."
        - "Carrier-mediated facilitated diffusion shows a maximum rate when the carriers are saturated."
        - "It can move a substance from low concentration to high concentration."
      option_explanations:
        - |
          Correct. Facilitated diffusion is still diffusion: the gradient supplies the energy and sets the direction.
        - |
          Correct. The protein (channel or carrier) is what distinguishes facilitated from simple diffusion; it provides a polar path through the hydrophobic core.
        - |
          No ATP is used; a facilitated route changes the speed of diffusion, not its energetics. This is the most common confusion with active transport.
        - |
          Correct. A finite number of carriers each handling one molecule at a time gives a plateau; channels saturate too but at far higher rates.
        - |
          Moving up a gradient is active transport by definition; facilitated diffusion can only equalise concentrations, never concentrate.
      answer: [0, 1, 3]
      explanation: |
        Facilitated means helped, not powered. Protein yes, gradient yes, ATP no, uphill never.

