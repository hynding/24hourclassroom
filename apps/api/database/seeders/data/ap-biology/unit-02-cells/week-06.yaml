    - slug: u02-w06-q21
      type: short_answer
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 4
      prompt: |
        Review. Conceptual analysis. Osmosis is described as the diffusion of "free" water. (a) Describe what happens to water molecules around a dissolved ion such as Na⁺, in terms of water's polarity. (b) Explain why dissolving more solute lowers the concentration of free water and therefore the water potential of a solution. (c) Explain why a molecule of sucrose and an ion of Na⁺ have similar effects on water potential at the same molar concentration, even though one is much larger than the other, and why 1 M NaCl has about twice the effect of 1 M sucrose. (d) Using the properties of water, explain why water can cross a phospholipid bilayer slowly on its own while Na⁺ cannot.
      answer: |
        Water's δ⁻ oxygens orient toward Na⁺ to form a hydration shell, so those water molecules are bound and not free to diffuse. More solute ties up more water, lowering free-water concentration and Ψ. Water potential depends on the number of dissolved particles, not their size; NaCl dissociates into two ions, so i = 2. Water is small and uncharged, so a few molecules slip between tails; Na⁺ carries a full charge and a hydration shell and cannot enter the nonpolar core.
      explanation: |
        Four points.

        (a) 1 pt: water is polar; the partially negative oxygen ends face a cation (or the partially positive hydrogens face an anion), forming a hydration shell of oriented water molecules around the ion. Must mention partial charges or polarity and the shell.

        (b) 1 pt: water in hydration shells is bound to solute and is not free to move; more solute particles bind more water, so the fraction of free water falls and the solution's water potential becomes more negative. Accept "solutes lower Ψ because they reduce free water".

        (c) 1 pt: the osmotic effect counts particles (colligative), so one sucrose molecule and one Na⁺ each lower Ψ by about the same amount regardless of size; NaCl splits into Na⁺ and Cl⁻, two particles per formula unit, so i = 2 and its effect is doubled. Both halves needed.

        (d) 1 pt: water is small and electrically neutral overall, so occasional molecules can pass through transient gaps in the hydrophobic core; Na⁺ is charged, carries a hydration shell, and would have to shed it to enter the nonpolar interior, which is energetically prohibitive. Must contrast charge, not size.

        Zero: answers that say solutes "attract water through the membrane", that explain NaCl's effect by its mass, or that say water crosses because it is nonpolar.

    # ---- Numeric
    - slug: u02-w06-q22
      type: numeric
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Calculate the solute potential, in bars, of a 0.30 M sucrose solution at 22 °C. Use Ψs = −iCRT with i = 1, R = 0.0831 L·bar/(mol·K) and T = 295 K. Give the value to one decimal place, including the sign.
      answer: { value: -7.4, tolerance: 0.15 }
      explanation: |
        Ψs = −(1)(0.30 mol/L)(0.0831 L·bar/mol·K)(295 K) = −7.35 bar, which rounds to −7.4 bar. Check the sign: solutes always lower water potential, so Ψs is negative. In an open beaker Ψp = 0, so this is also the solution's total water potential; a cell with Ψ above −7.4 bar placed in it would lose water.

    - slug: u02-w06-q23
      type: numeric
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        A plant cell has a solute potential of −9.0 bar and a pressure potential of +4.0 bar. It is placed in an open beaker of a solution whose solute potential is −3.0 bar. What is the water potential difference between the solution and the cell, in bars? (Give solution Ψ minus cell Ψ; a positive answer means water moves into the cell.)
      answer: { value: 2, tolerance: 0.1 }
      explanation: |
        Cell: Ψ = Ψs + Ψp = −9.0 + 4.0 = −5.0 bar. Solution in an open beaker: Ψ = Ψs + 0 = −3.0 bar. Difference: −3.0 − (−5.0) = +2.0 bar, so water moves into the cell, and the cell's Ψp rises until its Ψ reaches −3.0 bar (Ψp = +6.0 bar if Ψs is unchanged). Always add the pressure term for a cell and set it to zero for an open solution.

    # ---- Free response
    - slug: u02-w06-q24
      type: short_answer
      topic_code: "2.7"
      source: "Biology 2e §5.2 Passive Transport"
      points: 4
      prompt: |
        Conceptual analysis. A freshwater fish lives in water that is far more dilute than its blood. (a) State the direction in which water moves across the fish's gills and the direction in which salt tends to move, and name the process responsible for each. (b) Describe two things the fish does to stay in balance. (c) Explain why each of those two responses requires energy or not. (d) Predict what would happen to the fish if it were moved suddenly to sea water, and justify.
      answer: |
        Water enters the fish by osmosis (the water's Ψ is higher than the blood's); salt diffuses out down its gradient. The fish excretes large volumes of dilute urine and actively absorbs salt through its gills. Producing dilute urine means reabsorbing salt in the kidney, active and ATP-costly; the gill uptake is active transport against the gradient and costs ATP. In sea water the gradients reverse: water leaves and salt enters, the fish dehydrates unless it can switch to drinking and pumping salt out, which a freshwater species cannot do quickly, so it dies.
      explanation: |
        Four points.

        (a) 1 pt: water moves into the fish by osmosis (from the higher-Ψ pond water into the lower-Ψ blood) and salt tends to move out by diffusion down its concentration gradient. Both directions and both processes are required.

        (b) 1 pt: any two of: excreting large volumes of dilute urine; actively taking up salt ions through the gill cells; not drinking; reabsorbing salt in the kidney. Accept "absorbs salt from food".

        (c) 1 pt: salt uptake across the gills is active transport against the gradient and requires ATP; producing dilute urine requires the kidney to reabsorb ions actively (ATP) while letting water go; the water itself moves passively and costs nothing. The student must link at least one response to ATP and against-the-gradient movement.

        (d) 1 pt: the gradients reverse, so water leaves the fish and salt enters; the fish dehydrates and its blood becomes too salty; a freshwater species cannot reverse its gill pumps and kidney function fast enough, so it would die. Accept a correctly reasoned prediction that it would need to drink and pump salt out.

        Zero: answers that have water leaving a freshwater fish, that call osmosis active, or that say the fish pumps water.

    - slug: u02-w06-q25
      type: long_answer
      topic_code: "2.7"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. Students filled dialysis bags (permeable to water but not sucrose) with 10 mL of sucrose solution, weighed them, placed each in a beaker of distilled water for 30 minutes, blotted and reweighed them. A second set of bags was filled with distilled water and placed in beakers of the same sucrose solutions.

        | Sucrose in bag (M), beaker = water | Mass change (%) | Sucrose in beaker (M), bag = water | Mass change (%) |
        |---|---|---|---|
        | 0.0 | +0.3 | 0.0 | −0.2 |
        | 0.2 | +4.1 | 0.2 | −3.8 |
        | 0.4 | +8.3 | 0.4 | −8.0 |
        | 0.6 | +12.0 | 0.6 | −11.9 |
        | 0.8 | +15.6 | 0.8 | −15.1 |
        | 1.0 | +19.2 | 1.0 | −18.8 |

        (a) Identify the independent and dependent variables, and explain the purpose of the 0.0 M row.
        (b) Describe the relationship in the first pair of columns using data, and explain it in terms of water potential.
        (c) Explain why the second set of bags shows almost exactly the opposite result, and what this tells you about the direction of water movement.
        (d) The 1.0 M bag gained 19.2% but a student predicted it would gain water until the sucrose concentration inside was zero. Evaluate the prediction, and describe what would limit the gain in a real plant cell that no dialysis bag has.
      answer: |
        IV: sucrose concentration (in bag or beaker); DV: percentage change in mass; the 0.0 M row is a control showing that with no gradient there is little change. Mass gain rises with bag sucrose (+4.1% at 0.2 M to +19.2% at 1.0 M) because sucrose lowers Ψ inside the bag, so water moves in from the beaker at Ψ = 0. With sucrose outside, Ψ is lower in the beaker, water leaves the bags; the mirror-image numbers show that water moves down the Ψ gradient whichever side the solute is on. The prediction is wrong: sucrose cannot leave, so the bag cannot reach zero concentration; dilution continues until the bag is physically stretched or time runs out. In a plant cell the wall generates pressure potential, which raises Ψ inside until it equals the outside and net entry stops at a modest gain.
      explanation: |
        Eight points.

        (a) 2 pts: 1 pt for the independent variable (sucrose concentration in the bag, or in the beaker for the second set) and dependent variable (percentage change in mass); 1 pt for the control: the 0.0 M row has no solute gradient and shows the baseline change (about zero), against which the others are compared.

        (b) 2 pts: 1 pt for the description with data (mass gain rises with bag concentration, e.g. +4.1% at 0.2 M to +19.2% at 1.0 M); 1 pt for the explanation: sucrose lowers the water potential inside the bag below that of the distilled water (Ψ = 0), so water diffuses into the bag down the Ψ gradient, and a steeper gradient gives a larger gain in the fixed time.

        (c) 2 pts: 1 pt for recognising that the gradient is reversed (lower Ψ now in the beaker) so water leaves the bags, giving losses of about the same magnitude; 1 pt for the inference that water movement depends only on the direction of the Ψ difference across the membrane, not on which side is "the cell". Accept "osmosis is symmetrical".

        (d) 2 pts: 1 pt for evaluating the prediction: sucrose cannot cross the bag, so the inside can never reach zero sucrose; the bag would keep gaining until it burst or the experiment ended, and 30 minutes was not long enough to reach equilibrium; 1 pt for the plant-cell limit: the cell wall resists expansion, so pressure potential (Ψp) builds as water enters, raising the cell's Ψ until it equals the external Ψ and net uptake stops (turgor), something the elastic bag cannot do.

        Zero for a part: restating numbers with no comparison; saying sucrose moved rather than water; explaining the reversal as the bags leaking; saying the bag stops gaining because the water "runs out".
