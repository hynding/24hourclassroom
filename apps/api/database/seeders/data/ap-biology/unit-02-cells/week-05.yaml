week: 5
unit: 2
title: The Plasma Membrane, Permeability and Transport
topics: ["2.3", "2.4", "2.5"]
guide: guides/week-05.md
guide_description: |
  The fluid mosaic model and what each component contributes; why a bilayer lets oxygen through and stops a sodium
  ion; the difference between moving with a gradient and against it, and how the sodium-potassium pump spends ATP
  to build the gradients everything else runs on. Three worked examples (a permeability table, reading a
  membrane-fluidity graph, pump arithmetic), misconceptions, self-check.
flashcards_description: |
  30 cards on membrane components, the rules of selective permeability, passive versus active transport and the
  sodium-potassium pump.

flashcards:
  - front: Fluid mosaic model → who, when, what
    back: |
      Singer and Nicolson, 1972. The membrane is a two-dimensional fluid of phospholipids in which proteins, cholesterol and carbohydrate-bearing molecules are scattered like tiles in a mosaic, all able to drift sideways.
    topic_code: "2.3"
  - front: Membrane composition by mass → typical human cell
    back: |
      About 50% protein, 40% lipid and 10% carbohydrate by mass, but it varies with the job: myelin, an insulator, is about 76% lipid and 18% protein.
    topic_code: "2.3"
  - front: How thick is a plasma membrane?
    back: |
      About 5-10 nm, roughly a thousandth of a red blood cell's diameter. It cannot be seen with a light microscope, which resolves to about 200 nm.
    topic_code: "2.3"
  - front: Why is the membrane called fluid?
    back: |
      Phospholipids are held together only by hydrophobic exclusion, not covalent bonds, so each molecule drifts sideways past its neighbours; proteins drift too. The membrane flows, self-seals and can bud and fuse.
    topic_code: "2.3"
  - front: Integral membrane protein
    back: |
      A protein embedded in the bilayer; its transmembrane segments are about 20-25 nonpolar amino acids, often an α helix, with hydrophilic regions facing the water on either side. Channels, carriers, pumps and receptors are integral.
    topic_code: "2.3"
  - front: Peripheral membrane protein
    back: |
      A protein that sits on the inner or outer surface, attached to an integral protein or to phospholipid heads, not threaded through the bilayer. Often an enzyme or a structural anchor to the cytoskeleton.
    topic_code: "2.3"
  - front: Glycoprotein and glycolipid → where are the sugars?
    back: |
      Always on the outside face of the plasma membrane. The sugar coat (glycocalyx) is how cells recognise one another, tells the immune system what is self, and lets cells bind to the extracellular matrix.
    hint: Sugar faces out, never in.
    topic_code: "2.3"
  - front: What does cholesterol do to a membrane that is cold, and to one that is hot?
    back: |
      Cold: it wedges between tails and stops them packing into a solid, keeping the membrane fluid. Hot: it restrains tail movement and stops the membrane becoming too loose. A fluidity buffer. Plants use related sterols.
    topic_code: "2.3"
  - front: Three factors that set membrane fluidity
    back: |
      Temperature (warmer, more fluid), fatty-acid saturation (cis double bonds add kinks that keep tails apart, so more unsaturation means more fluid at a given temperature) and cholesterol content (a buffer in both directions).
    topic_code: "2.3"
  - front: Given this data, what's the conclusion? Fish in cold water have membranes richer in unsaturated fatty acids
    back: |
      The cells are keeping fluidity constant: kinked unsaturated tails prevent the membrane from solidifying in the cold. Homeoviscous adaptation; the same logic as olive oil versus butter.
    topic_code: "2.3"
  - front: Selective permeability
    back: |
      The membrane lets some substances cross freely, some slowly and some not at all. The rule follows from the hydrophobic core: small nonpolar molecules pass; polar molecules pass slowly or need help; ions and large polar molecules cannot pass without a protein.
    topic_code: "2.4"
  - front: Which molecules cross a bare phospholipid bilayer easily?
    back: |
      Small nonpolar molecules: O₂, CO₂, N₂, steroid hormones and fat-soluble vitamins (A, D, E, K). They dissolve in the hydrophobic interior and diffuse through.
    topic_code: "2.4"
  - front: Which molecules cannot cross a bare bilayer, and why?
    back: |
      Ions (Na⁺, K⁺, Cl⁻, Ca²⁺) because their charge and hydration shell cannot enter the nonpolar core; large polar molecules (glucose, amino acids) for the same reason. All need channel or carrier proteins.
    topic_code: "2.4"
  - front: Water and the bilayer → does it cross on its own?
    back: |
      A little: water is small enough to slip through slowly despite being polar. Fast water movement, as in kidney and root cells, needs aquaporin channels. Ions never cross without a protein.
    topic_code: "2.4"
  - front: Cell wall → who has one and what it is made of
    back: |
      Plants (cellulose), fungi (chitin) and most prokaryotes (peptidoglycan). It is a structural boundary outside the membrane, freely permeable to water and small solutes, that resists the pressure of water entering the cell.
    topic_code: "2.4"
  - front: Concentration gradient
    back: |
      A difference in concentration of a substance across a space or a membrane. It stores potential energy: molecules move down it (high to low) on their own, and moving them up it costs energy.
    topic_code: "2.5"
  - front: Passive transport → definition and the three kinds
    back: |
      Movement across a membrane down a gradient with no energy spent by the cell. Simple diffusion through the bilayer, facilitated diffusion through a channel or carrier protein, and osmosis (water).
    topic_code: "2.5"
  - front: Active transport → definition and what it needs
    back: |
      Movement against a concentration or electrochemical gradient, which requires energy, usually from ATP, and a carrier protein (a pump). It lets a cell hold an internal composition different from its surroundings.
    topic_code: "2.5"
  - front: Electrochemical gradient
    back: |
      The combined effect of a concentration difference and a charge difference across a membrane on an ion. For K⁺, concentration pushes it out of the cell while the negative interior pulls it in; the two can oppose or reinforce each other.
    topic_code: "2.5"
  - front: Membrane potential → typical value and why it exists
    back: |
      The inside of a resting cell is negative relative to the outside, roughly −70 mV in a neuron. It arises from unequal ion distribution and selective permeability, helped by the sodium-potassium pump moving 3 Na⁺ out for 2 K⁺ in.
    topic_code: "2.5"
  - front: Sodium-potassium pump → the six steps
    back: |
      1) Three Na⁺ bind on the cytosolic side. 2) ATP phosphorylates the pump. 3) It changes shape and releases Na⁺ outside. 4) Two K⁺ bind outside and the phosphate leaves. 5) The pump returns to its original shape. 6) K⁺ is released inside.
    hint: Three out, two in, one ATP.
    topic_code: "2.5"
  - front: Why is the sodium-potassium pump electrogenic?
    back: |
      Each cycle exports three positive charges and imports two, so there is a net loss of one positive charge from the inside per ATP. That helps make the interior negative, which is what electrogenic means.
    topic_code: "2.5"
  - front: Primary vs secondary active transport
    back: |
      Primary uses ATP directly (the Na⁺/K⁺ pump, the proton pump). Secondary uses the gradient a primary pump built: Na⁺ flowing back down its gradient through a cotransporter drags glucose up its gradient. No ATP is hydrolysed by the secondary carrier itself.
    topic_code: "2.5"
  - front: Uniporter, symporter, antiporter
    back: |
      A uniporter moves one substance; a symporter moves two in the same direction (Na⁺ and glucose into gut cells); an antiporter moves two in opposite directions (the Na⁺/K⁺ pump itself).
    topic_code: "2.5"
  - front: Why can't a cell just let everything equilibrate across its membrane?
    back: |
      Life depends on being different from the surroundings: nerve signals need ion gradients, the cell needs higher K⁺ and lower Na⁺ than blood, and pH inside organelles must differ. Keeping those differences costs ATP continuously, which is a large share of a resting cell's energy budget.
    topic_code: "2.5"
  - front: Ouabain blocks the sodium-potassium pump → predict what happens to a cell
    back: |
      Na⁺ accumulates inside and K⁺ leaks out, the membrane potential collapses, and water follows the rising internal solute so the cell swells. Secondary active transport that depends on the Na⁺ gradient (glucose uptake) stops too.
    topic_code: "2.5"
  - front: Where does the energy for passive transport come from?
    back: |
      From the gradient itself, which is potential energy the cell (or the environment) built earlier. The moving molecules spend it as they spread out; the cell spends nothing at the moment of transport.
    topic_code: "2.5"
  - front: Myelin is 76% lipid and 18% protein → what does that tell you?
    back: |
      Composition follows function. A membrane that insulates an axon needs few transporters and lots of insulating lipid; a mitochondrial inner membrane, crowded with electron-transport proteins, is the opposite, about 75% protein.
    topic_code: "2.3"
  - front: What is the glycocalyx and what does it do?
    back: |
      The carbohydrate coat on the outer surface of the membrane, made of the sugar chains of glycoproteins and glycolipids. It identifies the cell to other cells and the immune system, and it is why blood types exist.
    topic_code: "2.3"
  - front: How does a transmembrane α helix stay in the bilayer?
    back: |
      Its 20-25 amino acids have nonpolar R groups that face the hydrophobic tails, so water excludes the helix into the membrane just as it excludes the tails. The hydrophilic ends sit in the water on either side.
    topic_code: "2.3"

quiz:
  description: |
    25 questions · about 30 minutes · about 70% this week (membrane structure, selective permeability, passive and
    active transport) and 30% review of Unit 1 and week 4. Multiple choice, select-all, true/false and numeric items
    are graded at once; the fill-in-the-blank items are matched automatically; the two short answers and the long
    answer are graded by your teacher against the acceptable-answer summary.
  questions:
    # ---- Stimulus set: permeability of an artificial bilayer (2.4)
    - slug: u02-w05-q01
      type: multiple_choice
      topic_code: "2.4"
      source: "Biology 2e §5.2 Passive Transport"
      points: 1
      stimulus: |
        Researchers made artificial membranes of pure phospholipid, with no proteins, and measured how fast each substance crossed. Permeability is shown relative to oxygen, which was set to 1.

        | Substance | Size (relative) | Polar or charged? | Relative permeability |
        |---|---|---|---|
        | Oxygen (O₂) | small | nonpolar | 1 |
        | Carbon dioxide (CO₂) | small | nonpolar | 0.9 |
        | Water (H₂O) | small | polar | 0.01 |
        | Glycerol | medium | polar | 0.0001 |
        | Glucose | large | polar | 0.000001 |
        | Sodium ion (Na⁺) | small | charged | 0.00000000001 |
      prompt: |
        Which generalisation is best supported by the data?
      options:
        - "Permeability depends only on size: the smaller the molecule, the faster it crosses."
        - "Permeability falls with polarity and especially with charge: small nonpolar molecules cross freely, polar molecules cross slowly, and ions essentially cannot cross a bare bilayer."
        - "Polar molecules cross faster than nonpolar ones because they dissolve in water."
        - "All small molecules cross at the same rate."
      option_explanations:
        - |
          Sodium is one of the smallest entries in the table yet the least permeable by far, so size alone cannot be the rule; charge matters more.
        - |
          Correct. The ordering follows polarity, not size: O₂ and CO₂ at the top, water and glycerol a hundred to ten thousand times slower, and the ion a hundred billion times slower, as a hydrophobic core predicts.
        - |
          Dissolving in water is exactly what makes it hard to enter the oily centre of a bilayer; the data show polar molecules crossing slower, not faster.
        - |
          O₂, water and Na⁺ are all small and span eleven orders of magnitude; the data refute any rule that ignores polarity.
      answer: 1
      explanation: |
        The membrane's selectivity is a consequence of its hydrophobic interior. Read the whole table and look for the one property that orders every row.

    - slug: u02-w05-q02
      type: multiple_choice
      topic_code: "2.4"
      source: "Biology 2e §5.2 Passive Transport"
      points: 1
      stimulus: |
        Researchers made artificial membranes of pure phospholipid, with no proteins, and measured how fast each substance crossed. Permeability is shown relative to oxygen, which was set to 1.

        | Substance | Size (relative) | Polar or charged? | Relative permeability |
        |---|---|---|---|
        | Oxygen (O₂) | small | nonpolar | 1 |
        | Carbon dioxide (CO₂) | small | nonpolar | 0.9 |
        | Water (H₂O) | small | polar | 0.01 |
        | Glycerol | medium | polar | 0.0001 |
        | Glucose | large | polar | 0.000001 |
        | Sodium ion (Na⁺) | small | charged | 0.00000000001 |
      prompt: |
        A living kidney cell moves water across its membrane about 100 times faster than the artificial membrane does. Which explanation is most consistent with the table and with what a living membrane contains?
      options:
        - "The living membrane has thinner phospholipids."
        - "The living membrane contains aquaporin channel proteins that give water a hydrophilic path through the bilayer, which the pure-lipid membrane lacks."
        - "Living cells make their water nonpolar before transporting it."
        - "Water in a living cell is at a higher temperature, which explains the whole difference."
      option_explanations:
        - |
          Both membranes are phospholipid bilayers of similar thickness; thinning would not produce a hundredfold change, and the table shows the lipid itself is a poor route for water.
        - |
          Correct. The artificial membrane shows what the bilayer alone can do; the gap between it and a real cell is the contribution of proteins, here channels that let water bypass the hydrophobic core.
        - |
          Water cannot be made nonpolar; its polarity is a fixed property of the O–H bonds. Cells change the membrane, not the water.
        - |
          Temperature affects diffusion modestly, not by a factor of 100, and the artificial membrane was tested at body temperature in any case.
      answer: 1
      explanation: |
        Whatever a bare bilayer does slowly and a cell does fast, a protein is doing. That is the logic of topic 2.6 next week: channels and carriers close the gap in the table.

    - slug: u02-w05-q03
      type: multiple_choice
      topic_code: "2.4"
      source: "Biology 2e §5.2 Passive Transport"
      points: 1
      stimulus: |
        Researchers made artificial membranes of pure phospholipid, with no proteins, and measured how fast each substance crossed. Permeability is shown relative to oxygen, which was set to 1.

        | Substance | Size (relative) | Polar or charged? | Relative permeability |
        |---|---|---|---|
        | Oxygen (O₂) | small | nonpolar | 1 |
        | Carbon dioxide (CO₂) | small | nonpolar | 0.9 |
        | Water (H₂O) | small | polar | 0.01 |
        | Glycerol | medium | polar | 0.0001 |
        | Glucose | large | polar | 0.000001 |
        | Sodium ion (Na⁺) | small | charged | 0.00000000001 |
      prompt: |
        Based on the table, where would the steroid hormone estradiol, a nonpolar four-ring lipid, most likely fall, and what does that imply for how a cell detects it?
      options:
        - "Near sodium, so the cell needs a channel to let it in."
        - "Near oxygen, so it can diffuse through the membrane on its own and bind a receptor inside the cell."
        - "Near glucose, so it needs a carrier protein."
        - "It would not cross at all, because it is too large."
      option_explanations:
        - |
          Sodium is at the bottom because it is charged; estradiol carries no charge and is built of nonpolar rings, the opposite of an ion.
        - |
          Correct. A nonpolar lipid dissolves in the hydrophobic core and crosses freely; this is why steroid hormones have receptors in the cytoplasm or nucleus rather than on the surface, a point Unit 4 returns to.
        - |
          Glucose is slow because it is polar and hydroxyl-rich; a steroid is nonpolar and behaves like the hydrocarbon core, not like a sugar.
        - |
          Size matters far less than polarity in the table; a nonpolar molecule the size of a steroid dissolves into the bilayer rather than needing to fit through a gap.
      answer: 1
      explanation: |
        Use the one rule the table teaches, polarity decides, to place a new molecule. Solubility in the membrane, not size, is what lets steroids reach receptors inside the cell.

    # ---- Membrane structure (2.3)
    - slug: u02-w05-q04
      type: multiple_choice
      topic_code: "2.3"
      source: "Biology 2e §5.1 Components and Structure"
      points: 1
      prompt: |
        In the fluid mosaic model, what makes the membrane a mosaic and what makes it fluid?
      options:
        - "It is a mosaic because the phospholipids are arranged in a fixed grid, and fluid because water fills the gaps."
        - "It is a mosaic because proteins, cholesterol and glycolipids are scattered among the phospholipids, and fluid because those molecules can drift sideways past one another."
        - "It is a mosaic because it has two layers, and fluid because the layers slide over each other like plates."
        - "It is a mosaic of many membranes stitched together, and fluid because it dissolves in water."
      option_explanations:
        - |
          There is no fixed grid; phospholipids are in constant lateral motion, and water does not fill the interior of the bilayer, which is hydrophobic.
        - |
          Correct. Mosaic describes the mixture of different molecules in one sheet; fluid describes their freedom to move laterally within each leaflet, since nothing but hydrophobic exclusion holds them.
        - |
          Having two leaflets is the bilayer part of the model; the leaflets do not slide as rigid plates, and the fluidity is of molecules within a leaflet.
        - |
          A membrane is one continuous sheet, not stitched pieces, and it does not dissolve; its tails are insoluble, which is why it stays intact.
      answer: 1
      explanation: |
        Two words, two ideas: mosaic is composition, fluid is motion. Every membrane property this week, from permeability to budding, follows from one of the two.

    - slug: u02-w05-q05
      type: multiple_choice
      topic_code: "2.3"
      source: "Biology 2e §5.1 Components and Structure"
      points: 1
      prompt: |
        A membrane protein is found to have a stretch of 22 consecutive amino acids with nonpolar R groups, flanked on each side by regions rich in charged and polar R groups. Which conclusion is best supported?
      options:
        - "The protein is peripheral, lying on the membrane surface."
        - "The protein is integral: the nonpolar stretch spans the hydrophobic core of the bilayer, and the polar regions sit in the water on either side."
        - "The protein is secreted, because secreted proteins have hydrophobic regions."
        - "The protein cannot be a membrane protein, because membrane proteins are entirely hydrophobic."
      option_explanations:
        - |
          A peripheral protein sits on the surface and has no need for a 20-residue hydrophobic segment; that segment is the signature of a membrane-spanning region.
        - |
          Correct. A span of about 20-25 nonpolar residues in an α helix is just long enough to cross a 5-10 nm bilayer, and the polar flanks keep the ends in the aqueous compartments.
        - |
          A secreted protein is soluble in extracellular fluid and buries its few nonpolar residues in its core; a long exposed hydrophobic stretch would make it insoluble.
        - |
          An entirely hydrophobic protein could not have the hydrophilic faces that transporters and receptors need; integral proteins are amphipathic, hydrophobic in the middle and hydrophilic at the ends.
      answer: 1
      explanation: |
        You can read a protein's location from its sequence: Unit 1's R-group chemistry predicts where in the cell a protein can sit. A stretch of nonpolar residues is a membrane anchor.

    - slug: u02-w05-q06
      type: multiple_choice
      topic_code: "2.3"
      source: "Biology 2e §5.1 Components and Structure"
      points: 1
      prompt: |
        A person with blood type A has a particular sugar attached to glycoproteins and glycolipids on the red cell surface. Where are those sugars located, and why does the location matter?
      options:
        - "On the inner face of the membrane, where they bind the cytoskeleton."
        - "On the outer face of the membrane, forming the glycocalyx, where they are exposed to other cells and to antibodies, so they serve as identity markers."
        - "Inside the bilayer, between the fatty-acid tails."
        - "Dissolved in the cytosol, where they are stored as glycogen."
      option_explanations:
        - |
          Membrane carbohydrates never face the cytosol; the inner leaflet carries proteins that anchor the cytoskeleton, not sugars.
        - |
          Correct. The sugar coat faces the outside world, which is exactly why a transfusion of the wrong type is attacked: the recipient's antibodies meet foreign surface sugars.
        - |
          Sugars are polar and cannot sit in the hydrophobic interior; they are attached to the exterior heads and proteins and project into the extracellular fluid.
        - |
          Blood-group sugars are covalently attached to membrane molecules, not free in the cytosol, and glycogen is an unrelated storage polymer.
      answer: 1
      explanation: |
        Asymmetry is part of the model: the two faces of a membrane differ, and carbohydrate is strictly extracellular. Cell recognition happens at the sugar coat.

    # ---- Transport (2.5)
    - slug: u02-w05-q07
      type: multiple_choice
      topic_code: "2.5"
      source: "Biology 2e §5.3 Active Transport"
      points: 1
      prompt: |
        A resting cell holds about 140 mM K⁺ inside and 5 mM outside, and about 15 mM Na⁺ inside and 145 mM outside. Which statement correctly describes how these gradients are maintained?
      options:
        - "They maintain themselves, because ions cannot cross the membrane."
        - "The sodium-potassium pump uses ATP to move three Na⁺ out and two K⁺ in per cycle, working against both gradients, and must run continuously because ions leak back through channels."
        - "The gradients are created once during development and never need energy again."
        - "K⁺ diffuses into the cell down its gradient, which pushes Na⁺ out."
      option_explanations:
        - |
          Ions leak through channels all the time; if nothing opposed the leak the gradients would run down to equilibrium.
        - |
          Correct. Both ions are moved against their concentration gradients, which costs ATP, and the pump runs constantly to offset leakage; this is a large part of a resting cell's energy use.
        - |
          A gradient is stored energy that dissipates through any leak; it has to be rebuilt continuously, which is why poisoning the pump collapses the gradients within hours.
        - |
          K⁺ is more concentrated inside, so it diffuses out, not in; and a passive flow of one ion cannot by itself push another ion up its gradient without a coupled carrier.
      answer: 1
      explanation: |
        Being different from the surroundings is work. The pump is the clearest example of active transport: against the gradient, ATP spent, a protein that changes shape.

    - slug: u02-w05-q08
      type: multiple_choice
      topic_code: "2.5"
      source: "Biology 2e §5.3 Active Transport"
      points: 1
      prompt: |
        Intestinal cells take up glucose from the gut even when the glucose concentration inside the cell is higher than in the gut. A cotransporter moves one glucose into the cell for each Na⁺ that enters. Which statement explains the energy source?
      options:
        - "The cotransporter hydrolyses ATP directly to move the glucose."
        - "Na⁺ flows into the cell down the gradient built by the sodium-potassium pump, and the energy released drives glucose up its gradient: secondary active transport."
        - "Glucose moves by simple diffusion because it is small."
        - "The gut contents are warm, and heat drives the glucose in."
      option_explanations:
        - |
          The cotransporter does not bind ATP; the ATP was spent earlier by the sodium-potassium pump to create the Na⁺ gradient the cotransporter uses.
        - |
          Correct. One active transporter (primary, ATP-driven) stores energy as a Na⁺ gradient; a second (secondary) uses that stored energy to move glucose against its gradient. Block the pump and glucose uptake stops.
        - |
          Glucose is large and polar and barely crosses a bilayer, and in any case it is moving against its gradient here, which diffusion can never do.
        - |
          Thermal motion is random and cannot concentrate a substance on one side of a membrane; only a coupled energy source can.
      answer: 1
      explanation: |
        Energy can be stored in a gradient and spent later. Secondary active transport is indirect but still active: trace the ATP back to the pump that built the Na⁺ gradient.

    - slug: u02-w05-q09
      type: multiple_choice
      topic_code: "2.4"
      source: "Biology 2e §4.3 Eukaryotic Cells"
      points: 1
      prompt: |
        A plant cell, a fungal cell and a bacterium each have a cell wall. An animal cell does not. Which statement about the wall's role in permeability and shape is correct?
      options:
        - "The wall is the selectively permeable barrier, and the membrane beneath it is freely permeable."
        - "The wall is freely permeable to water and small solutes; the membrane beneath it is the selective barrier, and the wall's job is to resist pressure and set shape."
        - "The wall is made of phospholipid in all three groups."
        - "Animal cells have no wall because they have no need to control what enters."
      option_explanations:
        - |
          Reversed. Cellulose, chitin and peptidoglycan walls are porous meshes; selectivity is a property of the plasma membrane in every cell.
        - |
          Correct. The wall is a structural boundary outside the selective membrane; because it does not stretch, it lets a walled cell take up water and build pressure instead of bursting.
        - |
          The three walls are polysaccharide or peptidoglycan, not lipid: cellulose in plants, chitin in fungi, peptidoglycan in bacteria. Phospholipid is the membrane.
        - |
          Animal cells control entry at their membrane like every other cell; what they lack is the mechanical support of a wall, which is why they must live in isotonic surroundings.
      answer: 1
      explanation: |
        Two boundaries, two jobs: the membrane chooses what passes, the wall holds the shape. Keep them separate when topic 2.7 asks what happens to each kind of cell in pure water.

    - slug: u02-w05-q10
      type: multiple_choice
      topic_code: "2.2"
      source: "Biology 2e §4.2 Prokaryotic Cells"
      points: 1
      prompt: |
        Review. Membrane transport proteins can only work where there is membrane. A spherical cell of radius 10 μm and one of radius 20 μm have the same density of transport proteins per unit of membrane. Which comparison is correct?
      options:
        - "The larger cell has eight times the transport capacity for eight times the cytoplasm, so it is equally well supplied."
        - "The larger cell has four times the transport capacity but eight times the cytoplasm, so each unit of cytoplasm is supplied by half as much transporter."
        - "The larger cell has twice the transport capacity for twice the cytoplasm."
        - "Transport capacity does not depend on surface area."
      option_explanations:
        - |
          Surface area scales with r², not r³; doubling the radius quadruples the surface and the transporter count, but volume goes up eightfold.
        - |
          Correct. Transport proteins sit in the membrane, so capacity scales with surface (×4) while demand scales with volume (×8); the ratio halves, which is week 4's SA:V argument restated for proteins.
        - |
          Neither quantity doubles: surface quadruples and volume rises eightfold when the radius doubles.
        - |
          Transporters are membrane proteins; the amount of membrane sets how many a cell can have, so capacity depends directly on surface area.
      answer: 1
      explanation: |
        The SA:V limit is really a limit on membrane proteins per unit of cytoplasm. Transport, this week's topic, is what makes week 4's geometry matter.

    - slug: u02-w05-q11
      type: multiple_choice
      topic_code: "1.5"
      source: "Biology 2e §3.3 Lipids"
      points: 1
      prompt: |
        Review. A bacterium moved from 37 °C to 15 °C changes the fatty acids it builds into its membrane. Which change would keep the membrane working, and why?
      options:
        - "More saturated fatty acids, because straight tails pack tightly and keep the membrane stable in the cold."
        - "More cis-unsaturated fatty acids, because their kinks keep the tails from packing into a solid at low temperature, so the membrane stays fluid enough for proteins to work."
        - "Longer fatty acids, because length increases fluidity."
        - "No change, because membrane fluidity does not depend on temperature."
      option_explanations:
        - |
          Tight packing is the problem in the cold, not the solution: a membrane of straight saturated tails would solidify at 15 °C and its transporters would stop.
        - |
          Correct. Week 2's rule (kinks prevent packing, so unsaturated fats are liquid at lower temperature) is used by the cell to keep its membrane fluid when the environment cools.
        - |
          Longer tails have more surface for intermolecular attraction and pack better, which lowers fluidity; cells in the cold shorten tails, not lengthen them.
        - |
          Fluidity rises with temperature; a cooled membrane stiffens, which is why the cell adjusts its composition.
      answer: 1
      explanation: |
        The chemistry of fats from Unit 1 is the chemistry of membranes in Unit 2: saturation sets packing, packing sets fluidity, fluidity sets whether the membrane's proteins can work.

    - slug: u02-w05-q12
      type: multiple_choice
      topic_code: "2.10"
      source: "Biology 2e §23.1 Eukaryotic Origins"
      points: 1
      prompt: |
        Review. The inner mitochondrial membrane is about 75% protein by mass and carries transport proteins and enzymes that resemble those of aerobic bacteria; the outer membrane is more typical of the host cell. Which interpretation is consistent with endosymbiosis?
      options:
        - "The inner membrane is the former bacterium's own plasma membrane, and the outer membrane derives from the host membrane that engulfed it."
        - "Both membranes were built by the host cell from scratch, which is why they differ."
        - "The outer membrane is bacterial and the inner is from the host."
        - "The two membranes prove the mitochondrion was engulfed twice."
      option_explanations:
        - |
          Correct. Engulfment wraps a host membrane around the bacterium's own membrane; the bacterial one ends up inside, and its protein-rich, bacteria-like character is what the data show.
        - |
          A host building both membranes would have no reason to make the inner one resemble a bacterial membrane; the resemblance is the point the theory explains.
        - |
          Geometry rules this out: the engulfing membrane must be on the outside, so the bacterial membrane is the inner one.
        - |
          Two membranes follow from one engulfment (bacterial membrane plus host wrap). Three or four membranes are the signature of secondary endosymbiosis.
      answer: 0
      explanation: |
        Membrane composition is evidence of history. The protein-rich inner membrane is both the working surface for ATP synthesis and a fingerprint of the organelle's bacterial ancestor.

    - slug: u02-w05-q13
      type: multiple_choice
      topic_code: "1.7"
      source: "Biology 2e §3.4 Proteins"
      points: 1
      prompt: |
        Review. The sodium-potassium pump changes shape when it is phosphorylated and changes back when the phosphate is removed, and each shape has a different affinity for Na⁺ and K⁺. Which level of protein structure is being altered, and what does the change depend on?
      options:
        - "Primary structure; adding a phosphate changes the amino-acid sequence."
        - "Tertiary (and quaternary) structure; adding a charged phosphate group alters the weak interactions among R groups, shifting the fold so that different binding sites are exposed on each side of the membrane."
        - "Secondary structure only; the phosphate converts α helices into β sheets."
        - "No level of structure changes; the pump works by moving through the membrane."
      option_explanations:
        - |
          The sequence is covalent and unchanged; phosphorylation is a reversible modification of a side chain, not an edit to the chain.
        - |
          Correct. Protein function depends on shape, and shape depends on weak interactions that a new charge can rearrange; the pump's two conformations are two tertiary structures of one sequence.
        - |
          Phosphorylation does not convert one kind of secondary structure into another wholesale; the change is in how the folded domains sit relative to each other.
        - |
          The pump is anchored in the membrane and does not travel through it; it moves ions by alternating between two shapes.
      answer: 1
      explanation: |
        Every transporter works by the Unit 1 rule that shape is function and shape is held by weak interactions. A pump is a protein that is pushed between two folds by binding and phosphorylation.

    # ---- Select all
    - slug: u02-w05-q14
      type: multi_select
      topic_code: "2.3"
      source: "Biology 2e §5.1 Components and Structure"
      points: 2
      partial_credit: true
      prompt: |
        Which statements correctly pair a membrane component with its contribution? Select all that apply.
      options:
        - "Phospholipids: amphipathic molecules that self-assemble into the bilayer and give it a hydrophobic core"
        - "Cholesterol: a steroid wedged among the tails that buffers fluidity against temperature change"
        - "Integral proteins: channels, carriers, pumps and receptors that span the bilayer with hydrophobic segments"
        - "Carbohydrates: short chains on the cytosolic face that anchor the cytoskeleton"
        - "Peripheral proteins: proteins that span the bilayer many times to form a pore"
      option_explanations:
        - |
          Correct. The bilayer's structure and its selectivity both come from the phospholipid's two faces: heads in water, tails hidden.
        - |
          Correct. Cholesterol keeps a warm membrane from becoming too loose and a cold one from packing solid; it is the fluidity buffer of animal membranes.
        - |
          Correct. Anything that must carry a substance or a signal across the membrane has to reach both sides, which only an integral protein does.
        - |
          Carbohydrates are always on the extracellular face, where they act as recognition markers; cytoskeletal anchoring is done by proteins on the inner face.
        - |
          A peripheral protein sits on one surface and does not span the bilayer; a multi-pass pore is an integral protein.
      answer: [0, 1, 2]
      explanation: |
        Four components, four jobs: lipids make the barrier, cholesterol tunes it, proteins do the work across it, sugars label the outside. The two wrong options each put a component on the wrong side.

    - slug: u02-w05-q15
      type: multi_select
      topic_code: "2.5"
      source: "Biology 2e §5.3 Active Transport"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are examples of active transport? Select all that apply.
      options:
        - "A root cell takes up nitrate ions from soil water in which nitrate is far less concentrated than inside the cell."
        - "Oxygen diffuses from the alveolus into a red blood cell."
        - "The sodium-potassium pump exports Na⁺ while importing K⁺."
        - "A proton pump in the stomach lining moves H⁺ into the stomach, producing a concentration a million times higher than in the cell."
        - "Water enters a plant root by osmosis."
      option_explanations:
        - |
          Correct. Moving an ion from low to high concentration is uphill and must be powered, which is why roots respire heavily and stop taking up minerals when deprived of oxygen.
        - |
          Oxygen moves down its gradient through the bilayer with no energy spent by the cell; this is simple diffusion, the clearest case of passive transport.
        - |
          Correct. Both ions are moved against their gradients by a protein that hydrolyses ATP, the textbook example of primary active transport.
        - |
          Correct. A millionfold gradient is enormous stored energy and can only be built by an ATP-driven pump.
        - |
          Osmosis is the passive diffusion of water down its own gradient; the cell spends nothing on it.
      answer: [0, 2, 3]
      explanation: |
        Ask one question of each case: is the substance moving up its gradient? If yes, energy is being spent somewhere and the transport is active.

    # ---- True / false
    - slug: u02-w05-q16
      type: true_false
      topic_code: "2.4"
      source: "Biology 2e §5.2 Passive Transport"
      points: 1
      prompt: |
        True or false: Because a potassium ion is smaller than a glucose molecule, K⁺ crosses a pure phospholipid bilayer more readily than glucose does.
      answer: false
      explanation: |
        False. Charge matters far more than size. A K⁺ ion carries a full charge and a shell of bound water, and neither can enter the nonpolar core; its permeability through a bare bilayer is many orders of magnitude lower than glucose's, which is itself very low. Both need proteins, but the ion needs one absolutely.

    - slug: u02-w05-q17
      type: true_false
      topic_code: "2.1"
      source: "Biology 2e §4.4 The Endomembrane System and Proteins"
      points: 1
      prompt: |
        Review. True or false: Integral proteins destined for the plasma membrane are inserted into a membrane while being synthesised on the rough ER, and reach the cell surface by vesicles that pass through the Golgi.
      answer: true
      explanation: |
        True. A membrane protein is never free in the cytosol: it threads into the ER membrane as it is made, its sugars are added in the ER and Golgi lumen, and when the transport vesicle fuses with the plasma membrane the lumen-facing side becomes the outside of the cell. That is why membrane carbohydrate is always extracellular.

    - slug: u02-w05-q18
      type: true_false
      topic_code: "1.6"
      source: "Biology 2e §3.5 Nucleic Acids"
      points: 1
      prompt: |
        Review. True or false: Nucleotides such as ATP cross the plasma membrane by simple diffusion because they are small.
      answer: false
      explanation: |
        False. ATP carries three phosphate groups with a total charge of about −4 at cell pH, and it is a fairly large polar molecule besides; it cannot pass the hydrophobic core and is kept inside the cell. This is why the cell must make its own ATP and why ATP released outside cells (as a signal) acts only on surface receptors.

