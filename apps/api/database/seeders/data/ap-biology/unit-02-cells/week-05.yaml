    # ---- Numeric
    - slug: u02-w05-q22
      type: numeric
      topic_code: "2.5"
      source: "Biology 2e §5.3 Active Transport"
      points: 1
      prompt: |
        A sodium-potassium pump completes 1,200 cycles in one second. Over that second, how many more positive charges leave the cell through this pump than enter it? Give a whole number.
      answer: { value: 1200, tolerance: 0 }
      explanation: |
        Each cycle moves 3 Na⁺ out (+3 charges leaving) and 2 K⁺ in (+2 charges entering), a net export of one positive charge. 1,200 cycles × 1 = 1,200 net charges out, at a cost of 1,200 ATP. The net loss of positive charge from the interior is why the pump is called electrogenic and helps make the inside of the cell negative.

    # ---- Free response
    - slug: u02-w05-q23
      type: short_answer
      topic_code: "2.4"
      source: "Biology 2e §5.2 Passive Transport"
      points: 4
      prompt: |
        Conceptual analysis. A pure phospholipid bilayer is placed between two chambers of water. Oxygen, glucose and chloride ions are added to the left chamber. (a) Describe which of the three will appear in the right chamber first, and which last. (b) Explain the structural reason for the order. (c) Describe what a living cell adds to its membrane so that glucose and chloride can cross, and state whether energy is required for each to move down its gradient. (d) Predict how the oxygen result would change if the bilayer were made of fully saturated phospholipids at low temperature, and justify.
      answer: |
        Oxygen first, glucose much later, chloride essentially never. O₂ is small and nonpolar so it dissolves in the hydrophobic core; glucose is large and polar; Cl⁻ is charged and hydrated and cannot enter the core. A cell adds carrier proteins for glucose and channel proteins for Cl⁻; moving down a gradient through either is facilitated diffusion and costs no ATP. A saturated, cold bilayer packs tightly and is less fluid, so even O₂ would cross more slowly.
      explanation: |
        Four points.

        (a) 1 pt: O₂ first, glucose later, Cl⁻ last (effectively not at all). The ordering must be complete and correct.

        (b) 1 pt: the bilayer interior is nonpolar (hydrophobic tails); O₂ is small and nonpolar and dissolves in it; glucose is polar and large; Cl⁻ is charged (and hydrated), and charge is excluded most strongly. Must mention the hydrophobic core and link polarity or charge to exclusion.

        (c) 1 pt: transport proteins; a carrier (or channel) for glucose and an ion channel for chloride; both are facilitated diffusion when moving down the gradient and require no energy from the cell. Half credit if proteins are named but the student says ATP is needed to move down a gradient.

        (d) 1 pt: oxygen crossing would slow, because saturated tails pack tightly in the cold, reducing fluidity and the free space through which small molecules slip. Accept "membrane becomes more solid/less fluid" with the consequence stated.

        Zero: answers that order by size alone, that say glucose cannot cross a living membrane, or that call facilitated diffusion active.

    - slug: u02-w05-q24
      type: short_answer
      topic_code: "2.5"
      source: "Biology 2e §5.3 Active Transport"
      points: 4
      prompt: |
        Analyze a model. A diagram shows the sodium-potassium pump with three Na⁺ bound on the cytosolic side, an ATP molecule approaching, and K⁺ ions in the extracellular fluid. (a) Describe the next two events in the cycle. (b) Explain why the pump's affinity for Na⁺ must drop after it changes shape. (c) Explain how this pump contributes to the negative charge inside the cell. (d) A toxin prevents the phosphate group from being removed from the pump. Predict the effect on the cell's K⁺ gradient and justify.
      answer: |
        ATP phosphorylates the pump; it changes shape, opens to the outside and releases the three Na⁺ because its affinity for Na⁺ falls. If affinity stayed high the Na⁺ would not be released and the pump would be stuck. Each cycle exports three positive charges and imports two, a net loss of one positive charge inside. With the phosphate stuck, the pump cannot return to the inward-facing shape, so K⁺ is never released inside; the K⁺ gradient runs down as K⁺ leaks out.
      explanation: |
        Four points.

        (a) 1 pt: ATP transfers a phosphate to the pump (phosphorylation), the pump changes conformation and opens to the extracellular side, and the three Na⁺ are released outside. Both phosphorylation and the shape change with Na⁺ release are needed.

        (b) 1 pt: release depends on the binding sites losing affinity; if the outward-facing conformation still bound Na⁺ tightly, the ions would stay attached and the pump could not complete the cycle. Accept "so the Na⁺ let go".

        (c) 1 pt: three positive charges leave for every two that enter, so each cycle removes one net positive charge from the interior, making the inside more negative (electrogenic). Must state the 3:2 imbalance or the net charge movement.

        (d) 1 pt: dephosphorylation is what returns the pump to the inward-facing shape and releases K⁺ inside; with the phosphate stuck, K⁺ is not delivered, so the cell's high internal K⁺ is no longer maintained and the gradient decays as K⁺ leaks out through channels. The justification must link dephosphorylation to the K⁺ step.

        Zero: answers that have Na⁺ moving into the cell, that treat the pump as a channel, or that say the pump stores ATP.

    - slug: u02-w05-q25
      type: long_answer
      topic_code: "2.3"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. To test whether membrane proteins can move within the membrane, researchers fused a mouse cell with a human cell. Mouse surface proteins were labelled with a green fluorescent antibody and human surface proteins with a red one. Immediately after fusion the two colours occupied separate halves of the hybrid cell. Cells were then held at different temperatures and the percentage of hybrid cells in which the two colours had fully intermixed was recorded.

        | Time after fusion (min) | Intermixed at 37 °C (%) | Intermixed at 15 °C (%) | Intermixed at 37 °C with ATP synthesis blocked (%) |
        |---|---|---|---|
        | 5 | 3 | 1 | 3 |
        | 20 | 48 | 6 | 46 |
        | 40 | 93 | 15 | 91 |

        (a) State the hypothesis the experiment tests and identify the dependent variable.
        (b) Describe the pattern at 37 °C, using data.
        (c) Explain what the 15 °C column and the ATP-blocked column each tell you about the mechanism by which the proteins intermixed.
        (d) Explain how these results support the fluid mosaic model rather than a model in which proteins are fixed in a rigid lipid layer, and propose one further experiment with a predicted result.
      answer: |
        Hypothesis: membrane proteins move laterally within the membrane. DV: percentage of cells with intermixed labels. At 37 °C intermixing rises from 3% at 5 min to 93% at 40 min. Cooling slows mixing (15% at 40 min), so movement depends on membrane fluidity, which falls with temperature; blocking ATP changes nothing, so mixing is passive diffusion, not active transport. A rigid-layer model predicts no mixing at any temperature; the data show rapid, temperature-dependent, energy-independent lateral diffusion, as the fluid mosaic model predicts. Further test: add cholesterol or saturate the lipids and predict slower mixing.
      explanation: |
        Eight points.

        (a) 2 pts: 1 pt for the hypothesis, that membrane proteins can diffuse laterally within the bilayer (or the membrane is fluid); 1 pt for the dependent variable, the percentage of hybrid cells with fully intermixed red and green labels.

        (b) 1 pt: at 37 °C the percentage intermixed rises with time, with at least two values quoted (e.g. 3% at 5 min to 93% at 40 min).

        (c) 3 pts: 1 pt for recognising that mixing is much slower at 15 °C (15% versus 93% at 40 min); 1 pt for the interpretation that movement depends on membrane fluidity, which falls as tails pack more tightly at lower temperature; 1 pt for recognising that blocking ATP synthesis leaves the result unchanged (91% versus 93%), so the proteins move by passive diffusion rather than by an energy-requiring process. Accept "not active transport" or "no ATP needed".

        (d) 2 pts: 1 pt for the argument: a rigid layer model predicts that the two colours stay in their halves indefinitely, whereas the observed rapid, temperature-sensitive, ATP-independent mixing is what a two-dimensional fluid predicts; 1 pt for a further experiment with a sensible prediction, e.g. incorporate more saturated phospholipids or raise cholesterol and predict slower mixing at 37 °C; or test at 25 °C and predict an intermediate rate; or label a protein known to be anchored to the cytoskeleton and predict it does not mix.

        Zero for a part: restating the table without comparison; attributing the slower mixing at 15 °C to the cells dying; saying the proteins moved because ATP was present; proposing an experiment with no prediction.
