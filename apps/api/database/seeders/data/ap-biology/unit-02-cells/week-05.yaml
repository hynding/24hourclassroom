      prompt: |
        The combined influence of a concentration difference and an electrical charge difference on the movement of an ion across a membrane is called its ____ gradient.
      answer: ["electrochemical"]
      explanation: |
        An ion feels both forces at once. K⁺ is pushed out by concentration and pulled in by the negative interior; the net force is the electrochemical gradient. "Concentration gradient" alone ignores the charge and is not accepted.

