unit: 2
description: |
  44 questions · about 60 minutes · every topic of Unit 2 (2.1 to 2.10) with about a fifth of the items reviewing
  Unit 1, two data-based stimulus sets, two numeric items (water potential and surface area to volume), one short
  free-response item (4 points) and one long free-response item (8 points). Multiple choice, select-all,
  true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the two
  free-response items are graded by your teacher against the acceptable-answer summary.
questions:
  # ---- Stimulus set A: red blood cells in a salt series (2.7, 2.4, 2.6)
  - slug: u02-exam-q01
    type: multiple_choice
    topic_code: "2.7"
    source: "Biology 2e §5.2 Passive Transport"
    points: 1
    stimulus: |
      Human red blood cells were added to NaCl solutions of different concentration at 37 °C. After 5 minutes the percentage of cells that had burst (haemolysed) was counted, and the mean volume of the surviving cells was measured relative to cells in 0.90% NaCl.

      | NaCl (% w/v) | Cells haemolysed (%) | Mean volume of intact cells (relative) |
      |---|---|---|
      | 0.00 | 100 | — |
      | 0.30 | 96 | 1.55 |
      | 0.45 | 48 | 1.38 |
      | 0.60 | 4 | 1.22 |
      | 0.90 | 0 | 1.00 |
      | 1.50 | 0 | 0.78 |
    prompt: |
      Which conclusion about the 0.90% NaCl solution is best supported by the data?
    options:
      - "It is hypotonic to the cells, because none of them burst."
      - "It is isotonic to the cells: there was no net water movement, so volume was unchanged and no cell burst."
      - "It is hypertonic to the cells, because cells in weaker solutions were larger."
      - "It is toxic to the cells, which is why volume was exactly 1.00."
    option_explanations:
      - |
        A hypotonic solution would make the cells swell; here the volume is the reference 1.00, and swelling and bursting appear only below 0.90%.
      - |
        Correct. The isotonic point is where cell volume is unchanged; 0.90% NaCl (physiological saline) matches the solute concentration of the cytoplasm, which is why it is used for intravenous fluids.
      - |
        Cells were larger in weaker solutions because those solutions were hypotonic; at 0.90% the cells neither gained nor lost, and only at 1.50% did they shrink, which is the hypertonic case.
      - |
        A volume of 1.00 is the definition of the reference, not a sign of damage; the cells in 0.90% were healthy, with 0% haemolysis.
    answer: 1
    explanation: |
      Read the volume column for direction and the haemolysis column for consequence. The row with volume 1.00 and 0% bursting is the isotonic one; everything else is interpreted relative to it.

  - slug: u02-exam-q02
    type: multiple_choice
    topic_code: "2.4"
    source: "Biology 2e §5.2 Passive Transport"
    points: 1
    stimulus: |
      Human red blood cells were added to NaCl solutions of different concentration at 37 °C. After 5 minutes the percentage of cells that had burst (haemolysed) was counted, and the mean volume of the surviving cells was measured relative to cells in 0.90% NaCl.

      | NaCl (% w/v) | Cells haemolysed (%) | Mean volume of intact cells (relative) |
      |---|---|---|
      | 0.00 | 100 | — |
      | 0.30 | 96 | 1.55 |
      | 0.45 | 48 | 1.38 |
      | 0.60 | 4 | 1.22 |
      | 0.90 | 0 | 1.00 |
      | 1.50 | 0 | 0.78 |
    prompt: |
      The experiment depends on NaCl staying outside the cells during the 5 minutes while water moves freely. Which statement explains why both things are true?
    options:
      - "The membrane has pores that are larger than water but smaller than sodium ions."
      - "Na⁺ and Cl⁻ are charged and hydrated and cannot pass the hydrophobic core, and the red cell keeps few open channels for them; water is small and uncharged and crosses both through the bilayer and through aquaporins."
      - "Water is pumped into the cells by active transport while ions are pumped out."
      - "Sodium chloride is too large to cross any membrane."
    option_explanations:
      - |
        A bilayer has no fixed pores; the selectivity is chemical, not a sieve, and Na⁺ is in fact smaller than a water molecule.
      - |
        Correct. Selective permeability by polarity and charge is what makes the ions an effective osmotic solute and water the thing that moves; red cells are especially rich in aquaporins, which is why they respond within minutes.
      - |
        Water is never pumped, and the direction of water movement here follows the gradient passively, into the cell in dilute solutions and out in strong ones.
      - |
        Na⁺ and Cl⁻ are among the smallest particles in biology; their exclusion is due to charge, and they do cross membranes through channels when those are open.
    answer: 1
    explanation: |
      Every osmosis experiment is a permeability experiment: the solute must be held back and the water let through. The red cell membrane does both for NaCl, which is why NaCl works as an osmotic agent.

  - slug: u02-exam-q03
    type: multiple_choice
    topic_code: "2.6"
    source: "Biology 2e §5.2 Passive Transport"
    points: 1
    stimulus: |
      Human red blood cells were added to NaCl solutions of different concentration at 37 °C. After 5 minutes the percentage of cells that had burst (haemolysed) was counted, and the mean volume of the surviving cells was measured relative to cells in 0.90% NaCl.

      | NaCl (% w/v) | Cells haemolysed (%) | Mean volume of intact cells (relative) |
      |---|---|---|
      | 0.00 | 100 | — |
      | 0.30 | 96 | 1.55 |
      | 0.45 | 48 | 1.38 |
      | 0.60 | 4 | 1.22 |
      | 0.90 | 0 | 1.00 |
      | 1.50 | 0 | 0.78 |
    prompt: |
      The experiment is repeated with red blood cells whose aquaporins have been blocked by a drug. Which prediction is best justified?
    options:
      - "The cells will no longer burst at any concentration, because water cannot enter."
      - "The final volumes and haemolysis will be similar once equilibrium is reached, but it will take much longer than 5 minutes, because water must now cross the bilayer slowly without its channels."
      - "The cells will shrink in every solution, because aquaporins normally pump water in."
      - "The cells will burst in 0.90% NaCl, because blocking aquaporins makes the solution hypotonic."
    option_explanations:
      - |
        A bare bilayer still passes water, just slowly; the water potential gradient is unchanged, so the cells will still swell and eventually burst in hypotonic solutions.
      - |
        Correct. Aquaporins change the rate of osmosis, not its direction or endpoint; the equilibrium is set by water potential, the kinetics by the channels.
      - |
        Aquaporins are passive channels, not pumps; blocking them cannot reverse the direction of water movement.
      - |
        Tonicity is a property of the solution relative to the cell's solutes, and neither changes when a channel is blocked; 0.90% remains isotonic.
    answer: 1
    explanation: |
      Separate direction from speed. Water potential sets where a cell ends up; aquaporins set how fast it gets there. Nephrogenic diabetes insipidus is this principle in a human kidney.

  # ---- Stimulus set B: ouabain and the sodium-potassium pump (2.5, 2.3, 2.7)
  - slug: u02-exam-q04
    type: multiple_choice
    topic_code: "2.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      Ouabain is a drug that binds the sodium-potassium pump and stops it. Cultured animal cells were exposed to ouabain at time zero and sampled over the next three hours.

      | Time (h) | Intracellular Na⁺ (mM) | Intracellular K⁺ (mM) | Cell volume (relative) | Membrane potential (mV) |
      |---|---|---|---|---|
      | 0 | 15 | 140 | 1.00 | −70 |
      | 1 | 48 | 112 | 1.09 | −52 |
      | 2 | 81 | 84 | 1.21 | −33 |
      | 3 | 110 | 60 | 1.36 | −15 |
    prompt: |
      Which explanation accounts for the changes in Na⁺ and K⁺ over the three hours?
    options:
      - "Ouabain opens the membrane so that ions flow in both directions at random."
      - "With the pump stopped, Na⁺ that leaks in through channels is no longer exported and K⁺ that leaks out is no longer recovered, so both gradients run down toward equilibrium with the surroundings."
      - "Ouabain reverses the pump so that it imports Na⁺ and exports K⁺."
      - "The cells are synthesising Na⁺ and destroying K⁺."
    option_explanations:
      - |
        The changes are orderly and in opposite directions for the two ions, each toward its extracellular concentration; that is leakage down pre-existing gradients, not random flow through a damaged membrane.
      - |
        Correct. The gradients are maintained only because the pump continuously undoes the leak; remove the pump and the stored energy drains over hours through the channels that were always there.
      - |
        A pump cannot be made to run backwards by an inhibitor; it simply stops, and the leak does the rest.
      - |
        Ions are not made or destroyed; they move. The totals inside plus outside are unchanged.
    answer: 1
    explanation: |
      A gradient is a battery that is always discharging. The pump is the charger; this table is what the discharge looks like when the charger is unplugged.

  - slug: u02-exam-q05
    type: multiple_choice
    topic_code: "2.7"
    source: "general knowledge"
    points: 1
    stimulus: |
      Ouabain is a drug that binds the sodium-potassium pump and stops it. Cultured animal cells were exposed to ouabain at time zero and sampled over the next three hours.

      | Time (h) | Intracellular Na⁺ (mM) | Intracellular K⁺ (mM) | Cell volume (relative) | Membrane potential (mV) |
      |---|---|---|---|---|
      | 0 | 15 | 140 | 1.00 | −70 |
      | 1 | 48 | 112 | 1.09 | −52 |
      | 2 | 81 | 84 | 1.21 | −33 |
      | 3 | 110 | 60 | 1.36 | −15 |
    prompt: |
      Cell volume rose by 36% over three hours. Which explanation is best?
    options:
      - "The pump normally exports water, and without it water accumulates."
      - "Na⁺ entered faster than K⁺ left, so total intracellular solute rose, the cell's water potential fell, and water entered by osmosis."
      - "Ouabain is taken up by the cell and takes up space."
      - "The membrane stretched because it lost its charge."
    option_explanations:
      - |
        Water is never pumped; its movement is always osmotic, following solutes.
      - |
        Correct. Compare the ion columns: Na⁺ gained 95 mM while K⁺ lost 80 mM, a net gain of solute (and Cl⁻ follows the Na⁺), which lowers Ψ inside and draws water in. The pump is part of the cell's volume control.
      - |
        Ouabain acts at the outer face of the pump at tiny concentrations; it is not a bulk solute.
      - |
        Membrane potential is a tiny imbalance of charge that has no mechanical effect on area; the swelling is osmotic.
    answer: 1
    explanation: |
      Osmosis and active transport are one system: the pump keeps the cell's solute content, and so its volume, where it should be. Animal cells without a wall depend on it.

  - slug: u02-exam-q06
    type: multiple_choice
    topic_code: "2.3"
    source: "Biology 2e §5.1 Components and Structure"
    points: 1
    stimulus: |
      Ouabain is a drug that binds the sodium-potassium pump and stops it. Cultured animal cells were exposed to ouabain at time zero and sampled over the next three hours.

      | Time (h) | Intracellular Na⁺ (mM) | Intracellular K⁺ (mM) | Cell volume (relative) | Membrane potential (mV) |
      |---|---|---|---|---|
      | 0 | 15 | 140 | 1.00 | −70 |
      | 1 | 48 | 112 | 1.09 | −52 |
      | 2 | 81 | 84 | 1.21 | −33 |
      | 3 | 110 | 60 | 1.36 | −15 |
    prompt: |
      Ouabain binds only to the extracellular face of the pump and does not enter the cell, yet it stops a protein whose ATP-binding site faces the cytosol. Which feature of membrane protein structure makes this possible?
    options:
      - "Peripheral proteins can be reached from either side."
      - "The pump is an integral protein spanning the bilayer, with distinct domains exposed on each face; binding on the outside changes the conformation of the whole protein, including the domains inside."
      - "Ouabain diffuses through the bilayer because it is a steroid-like molecule."
      - "The pump moves across the membrane to reach the drug."
    option_explanations:
      - |
        The pump is not peripheral; a peripheral protein on one face could not transport ions across the membrane at all.
      - |
        Correct. A transmembrane protein is one folded molecule with faces in both compartments; what binds one face alters the shape, and therefore the function, of the rest. Receptors in Unit 4 use the same principle.
      - |
        The stem says ouabain does not enter the cell; and the point of the question is that it does not need to.
      - |
        Integral proteins move laterally within the plane of the membrane but never flip across it; the pump's orientation is fixed.
    answer: 1
    explanation: |
      Integral proteins are two-faced machines. A change on one side is transmitted through the fold to the other, which is how transporters and receptors couple the outside of a cell to the inside.

  # ---- Cell structure (2.1)
  - slug: u02-exam-q07
    type: multiple_choice
    topic_code: "2.1"
    source: "Biology 2e §4.4 The Endomembrane System and Proteins"
    points: 1
    prompt: |
      A protein made on the rough ER is found, a few minutes later, inside a lysosome. Which sequence of structures did it pass through, in order?
    options:
      - "Rough ER → Golgi cis face → Golgi trans face → vesicle → lysosome"
      - "Rough ER → nucleus → Golgi → lysosome"
      - "Rough ER → mitochondrion → vesicle → lysosome"
      - "Rough ER → cytosol → lysosome, by diffusion through the lysosomal membrane"
    option_explanations:
      - |
        Correct. Cargo enters the Golgi at the cis face, is modified and tagged on its way to the trans face, and leaves in a vesicle addressed to the lysosome by its tag.
      - |
        The nucleus is not on the secretory route; proteins enter it through pores only if they are nuclear proteins, and lysosomal enzymes are not.
      - |
        Mitochondria are outside the endomembrane system and exchange no vesicles with it.
      - |
        A folded protein cannot diffuse through a bilayer; it travels the whole way inside membranes, in the lumen of the ER, Golgi and vesicles.
    answer: 0
    explanation: |
      Learn the secretory pathway as a route with stops: ER, Golgi cis, Golgi trans, vesicle, destination. Anything that enters it never sees the cytosol again.

  - slug: u02-exam-q08
    type: multiple_choice
    topic_code: "2.1"
    source: "Biology 2e §4.3 Eukaryotic Cells"
    points: 1
    prompt: |
      Liver cells of people who regularly take a drug that is broken down by the liver develop much more smooth ER than normal. Which explanation is best?
    options:
      - "Smooth ER is where proteins are synthesised, and the liver needs more enzymes."
      - "Smooth ER carries the enzymes that detoxify drugs; the cell builds more of it in response to the load, which also speeds the breakdown of other drugs."
      - "Smooth ER stores the drug until it can be excreted."
      - "Smooth ER is the organelle that makes ATP for the extra work."
    option_explanations:
      - |
        Protein synthesis for export happens on the rough ER; the smooth ER has no ribosomes.
      - |
        Correct. Detoxification is a smooth ER function, and proliferation of the organelle is a structure-to-function response; it is also why tolerance to one drug can reduce the effectiveness of another.
      - |
        The ER does not store drugs; it chemically modifies them so they can be excreted.
      - |
        ATP is made in mitochondria; the smooth ER is a site of lipid synthesis, detoxification and calcium storage.
    answer: 1
    explanation: |
      Organelle abundance follows demand. More smooth ER in a detoxifying cell, more rough ER in a secreting cell, more mitochondria in a contracting cell.

  # ---- Cell size (2.2)
  - slug: u02-exam-q09
    type: multiple_choice
    topic_code: "2.2"
    source: "Biology 2e §4.2 Prokaryotic Cells"
    points: 1
    prompt: |
      Two cells have the same volume. One is a sphere; the other is a long thin cylinder. Which statement about their exchange with the surroundings is correct?
    options:
      - "They exchange equally, because exchange depends on volume."
      - "The cylinder exchanges more efficiently, because for a given volume an elongated shape has more surface area, so a higher SA:V."
      - "The sphere exchanges more efficiently, because a sphere has the largest surface area for its volume."
      - "Neither can exchange, because both are too large."
    option_explanations:
      - |
        Exchange happens across the surface, and the two shapes have very different surface areas for the same volume.
      - |
        Correct. A sphere has the smallest surface for a given volume of any shape; stretching it out adds surface without adding volume, which is why nerve cells, root hairs and many bacteria are elongated.
      - |
        Reversed: the sphere has the least surface area per unit volume, which is why water droplets and bubbles are spheres and why cells that need surface are not.
      - |
        Nothing in the question fixes the absolute size; shape alone changes SA:V at any size.
    answer: 1
    explanation: |
      Shape is a lever on SA:V as much as size is. The exam asks about flat leaves, elongated neurons and folded membranes for the same reason.

  # ---- Membrane (2.3)
  - slug: u02-exam-q10
    type: multiple_choice
    topic_code: "2.3"
    source: "Biology 2e §5.1 Components and Structure"
    points: 1
    prompt: |
      A membrane patch made only of phospholipids becomes much more fluid when warmed from 25 °C to 40 °C. An identical patch containing cholesterol changes far less. Which explanation is best?
    options:
      - "Cholesterol makes the membrane rigid at every temperature."
      - "At higher temperature cholesterol's rigid rings restrain the movement of the fatty-acid tails, so the membrane loosens less; at low temperature the same molecule stops the tails packing, so overall it buffers fluidity."
      - "Cholesterol absorbs the heat so the lipids do not warm."
      - "Cholesterol replaces the phospholipids, so there are fewer tails to move."
    option_explanations:
      - |
        At low temperature cholesterol makes the membrane more fluid, not less; its effect depends on the temperature, which is what buffering means.
      - |
        Correct. The sterol fits among the tails and limits how far they move apart when warm while preventing them from crystallising when cold, keeping fluidity in a working range.
      - |
        Cholesterol has no special heat capacity; the lipids reach the same temperature in both patches.
      - |
        Cholesterol sits among the phospholipids rather than replacing them, and the bilayer still needs them to form at all.
    answer: 1
    explanation: |
      Think of cholesterol as a thermostat for fluidity, not a stiffener. The fish-membrane data of Unit 1 showed the cell raising cholesterol in warm water for this reason.

  - slug: u02-exam-q11
    type: multiple_choice
    topic_code: "2.3"
    source: "Biology 2e §5.1 Components and Structure"
    points: 1
    prompt: |
      The inner mitochondrial membrane is about 75% protein by mass; the myelin sheath that insulates nerve axons is about 18% protein. Which statement best interprets the difference?
    options:
      - "Myelin is not a true membrane."
      - "Membrane composition follows function: the mitochondrial inner membrane is crowded with electron-transport and ATP-synthesising proteins, while myelin's job is to be an inert insulating lipid wrap with little transport."
      - "The mitochondrial membrane has no phospholipid."
      - "Protein-rich membranes are always more fluid."
    option_explanations:
      - |
        Myelin is layer upon layer of a glial cell's plasma membrane, a true fluid mosaic membrane with an unusual composition.
      - |
        Correct. The mosaic is tuned: a membrane that must do chemistry is mostly protein, a membrane that must only separate is mostly lipid. The "typical" 50:40:10 ratio is an average across jobs.
      - |
        No membrane lacks phospholipid; the bilayer is what holds the proteins, however many there are.
      - |
        Fluidity depends on lipid saturation, temperature and cholesterol, not on protein content; crowded protein-rich membranes are if anything less fluid.
    answer: 1
    explanation: |
      Composition is a clue to function. Given a membrane's protein content, you can guess how much it does; given its job, you can predict its composition.

  # ---- Permeability (2.4)
  - slug: u02-exam-q12
    type: multiple_choice
    topic_code: "2.4"
    source: "Biology 2e §5.2 Passive Transport"
    points: 1
    prompt: |
      In the blood, carbon dioxide leaves red blood cells freely, but bicarbonate ions (HCO₃⁻), formed from CO₂ inside the cell, leave only through a specific exchanger protein. Which explanation is best?
    options:
      - "Bicarbonate is heavier than carbon dioxide."
      - "CO₂ is small and nonpolar and dissolves through the bilayer, whereas HCO₃⁻ carries a charge and a hydration shell and cannot enter the hydrophobic core without a protein."
      - "Carbon dioxide is a gas and gases always cross membranes."
      - "Bicarbonate is made inside the cell and is not allowed to leave."
    option_explanations:
      - |
        The mass difference is small and irrelevant; permeability is set by charge and polarity, not weight.
      - |
        Correct. One extra oxygen and a charge turn a freely permeant molecule into one that needs a transporter; the red cell's chloride-bicarbonate exchanger is a carrier working by facilitated diffusion.
      - |
        Being a gas is not the reason; CO₂ crosses because it is nonpolar, and a polar gas such as ammonia crosses less readily.
      - |
        Bicarbonate does leave, in large amounts, through the exchanger; the question is why it needs one.
    answer: 1
    explanation: |
      Charge is the sharpest line the membrane draws. The same atoms rearranged into an ion go from free passage to needing a protein.

  - slug: u02-exam-q13
    type: multiple_choice
    topic_code: "2.4"
    source: "Biology 2e §4.3 Eukaryotic Cells"
    points: 1
    prompt: |
      Penicillin kills bacteria by preventing them from building peptidoglycan. Treated bacteria in dilute medium swell and burst. Which explanation is best?
    options:
      - "Penicillin dissolves the plasma membrane."
      - "Without a complete wall there is nothing to resist the pressure that builds as water enters the hypertonic cell by osmosis, so the membrane alone cannot hold the cell and it lyses."
      - "Penicillin opens water channels in the membrane."
      - "Peptidoglycan is the selectively permeable barrier, and without it everything enters."
    option_explanations:
      - |
        Penicillin targets wall synthesis, not the membrane; the membrane is intact until the cell bursts.
      - |
        Correct. The wall's job is mechanical: a walled cell in dilute medium is like a plant cell in pure water, taking up water until the wall pushes back. Remove the wall and it behaves like an animal cell in pure water.
      - |
        Water entry is unchanged; what changes is the cell's ability to withstand it.
      - |
        The wall is a porous mesh; the membrane beneath it is the selective barrier in bacteria as in every cell.
    answer: 1
    explanation: |
      Wall holds, membrane chooses. Penicillin is an experiment that removes the wall and shows what it was doing.

  # ---- Facilitated diffusion (2.6)
  - slug: u02-exam-q14
    type: multiple_choice
    topic_code: "2.6"
    source: "Biology 2e §5.2 Passive Transport"
    points: 1
    prompt: |
      A neuron's membrane contains Na⁺ channels that are closed at rest and open briefly when the membrane potential changes. Which statement describes what happens to Na⁺ when they open?
    options:
      - "Na⁺ is pumped into the cell using ATP."
      - "Na⁺ flows into the cell down its electrochemical gradient by facilitated diffusion, with no energy spent, because both its concentration gradient and the negative interior favour entry."
      - "Na⁺ flows out of the cell because channels always move ions outward."
      - "Nothing happens, because channels need ATP to work."
    option_explanations:
      - |
        A channel is a pore, not a pump; it cannot hydrolyse ATP or move ions uphill.
      - |
        Correct. Gated channels let the cell control when a passive flow occurs; the energy was stored earlier by the sodium-potassium pump, and the inrush of Na⁺ is the rising phase of a nerve impulse.
      - |
        Direction is set by the gradient, not the channel; Na⁺ is far more concentrated outside, so it enters.
      - |
        Channels are passive; they open and close in response to signals but spend nothing on the flow itself.
    answer: 1
    explanation: |
      Gating is control without cost. The pump charges the battery slowly; the channel discharges it in a millisecond. Unit 4 builds signalling on this.

  - slug: u02-exam-q15
    type: multiple_choice
    topic_code: "2.6"
    source: "Biology 2e §5.2 Passive Transport"
    points: 1
    prompt: |
      Cells take up glucose through a carrier. When a similar sugar that binds the same carrier is added to the medium, glucose uptake falls, even though the glucose concentration is unchanged. Which inference is best?
    options:
      - "The second sugar damages the membrane."
      - "The two sugars compete for a limited number of binding sites on the carriers, so some carriers are occupied by the competitor and fewer are available for glucose."
      - "The second sugar is pumped in using the ATP that glucose needed."
      - "Glucose uptake does not depend on carriers."
    option_explanations:
      - |
        A damaged membrane would raise, not lower, the leakage of small molecules; the specific, reversible fall points to binding.
      - |
        Correct. Competition is a hallmark of carrier (and enzyme) binding: anything that occupies the site blocks the substrate, and the effect is reversed by raising the glucose concentration.
      - |
        Glucose uptake into these cells is facilitated diffusion and uses no ATP; energy is not the resource being competed for.
      - |
        The competition effect is itself evidence that carriers are involved; simple diffusion through the bilayer would be unaffected by another sugar.
    answer: 1
    explanation: |
      Saturation and competition are the two kinetic signatures of a protein with a binding site. You will meet both again as enzyme kinetics in Unit 3.

  # ---- Bulk transport (2.8)
  - slug: u02-exam-q16
    type: multiple_choice
    topic_code: "2.8"
    source: "Biology 2e §5.4 Bulk Transport"
    points: 1
    prompt: |
      A macrophage engulfs a bacterium. Which sequence correctly describes what happens next?
    options:
      - "The bacterium diffuses into the cytosol, where free enzymes digest it."
      - "The plasma membrane folds around the bacterium into a vesicle; the vesicle fuses with a lysosome; hydrolytic enzymes at low pH digest the bacterium; useful products are transported into the cytosol."
      - "The bacterium is held on the cell surface and digested by secreted enzymes."
      - "The bacterium is passed into the Golgi for processing."
    option_explanations:
      - |
        A whole cell cannot cross a membrane, and if digestive enzymes were free in the cytosol they would digest the macrophage.
      - |
        Correct. Phagocytosis followed by lysosomal fusion is both bulk transport and compartmentalization: the prey is kept in a membrane-bound space while it is dismantled.
      - |
        Secreting enzymes would digest neighbouring tissue; the point of phagocytosis is to bring the meal inside, into a sealed compartment.
      - |
        The Golgi processes proteins made in the ER; it does not receive engulfed material.
    answer: 1
    explanation: |
      Phagocytosis delivers, the lysosome digests, the cell keeps the enzymes where they belong. Three topics (2.8, 2.9, 2.1) in one event.

  - slug: u02-exam-q17
    type: multiple_choice
    topic_code: "2.8"
    source: "Biology 2e §5.4 Bulk Transport"
    points: 1
    prompt: |
      A cell that secretes hormone continuously by exocytosis keeps a constant surface area. Which statement explains how?
    options:
      - "The vesicle membrane is destroyed when the vesicle fuses."
      - "Membrane added to the surface by exocytosis is recovered by endocytosis at the same rate, so the two processes balance."
      - "The cell shrinks to compensate."
      - "Exocytosis does not add membrane because the vesicle does not fuse."
    option_explanations:
      - |
        The vesicle membrane merges into the plasma membrane and becomes part of it; nothing is destroyed at fusion.
      - |
        Correct. Membrane cycles: vesicle lipids and proteins join the surface, are retrieved by endocytosis, and are reused, so a secretory cell is in a steady state of membrane traffic.
      - |
        Cell volume is unrelated to how much membrane the cell has at the surface; the issue is area, and it is handled by retrieval.
      - |
        Fusion is the definition of exocytosis; the contents leave because the vesicle membrane becomes continuous with the plasma membrane.
    answer: 1
    explanation: |
      Membrane is conserved and recycled. Any question about one direction of vesicle traffic has the other direction as its answer.

  # ---- Compartmentalization (2.9)
  - slug: u02-exam-q18
    type: multiple_choice
    topic_code: "2.9"
    source: "Biology 2e §4.3 Eukaryotic Cells"
    points: 1
    prompt: |
      Peroxisomes break down fatty acids in reactions that produce hydrogen peroxide, a reactive molecule that damages DNA and proteins, and they also contain an enzyme that destroys hydrogen peroxide. Which statement best explains the advantage of doing this inside an organelle?
