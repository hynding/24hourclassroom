  # ---- Numeric (2)
  - slug: u02-exam-q41
    type: numeric
    topic_code: "2.7"
    source: "general knowledge"
    points: 1
    prompt: |
      A plant cell has a solute potential of −8.0 bar and a pressure potential of +3.0 bar. It is placed in an open beaker of 0.15 M NaCl at 27 °C. Using Ψs = −iCRT with i = 2 for NaCl, R = 0.0831 L·bar/(mol·K) and T = 300 K, calculate the water potential of the solution in bars, to one decimal place and with its sign.
    answer: { value: -7.5, tolerance: 0.15 }
    explanation: |
      Ψs(solution) = −(2)(0.15)(0.0831)(300) = −7.48 bar, which rounds to −7.5 bar; in an open beaker Ψp = 0, so this is the solution's total Ψ. The cell's Ψ = −8.0 + 3.0 = −5.0 bar, which is higher than −7.5, so water leaves the cell and its turgor falls. The two common errors are forgetting i = 2 (giving −3.7 bar and the wrong direction) and comparing the solution's Ψs with the cell's Ψs instead of its total Ψ.

  - slug: u02-exam-q42
    type: numeric
    topic_code: "2.2"
    source: "Biology 2e §4.2 Prokaryotic Cells"
    points: 1
    prompt: |
      A bacterial cell is modelled as a cube with sides of 0.5 μm. Calculate its surface area to volume ratio in μm⁻¹. Give the number only.
    answer: { value: 12, tolerance: 0.1 }
    explanation: |
      Surface area = 6 × (0.5)² = 1.5 μm². Volume = (0.5)³ = 0.125 μm³. Ratio = 1.5 ÷ 0.125 = 12 μm⁻¹, or directly 6 ÷ 0.5 = 12. A eukaryotic cell modelled as a 20 μm cube would have a ratio of 0.3, forty times lower, which is why it needs internal membranes and active transport across its cytoplasm.

