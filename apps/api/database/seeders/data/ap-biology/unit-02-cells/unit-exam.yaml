  - slug: u02-exam-q27
    type: multi_select
    topic_code: "2.5"
    source: "Biology 2e §5.3 Active Transport"
    points: 2
    partial_credit: true
    prompt: |
      Which statements are true of the sodium-potassium pump? Select all that apply.
    options:
      - "It moves both ions against their concentration gradients."
      - "It hydrolyses one ATP per cycle and is phosphorylated during the cycle."
      - "It moves three Na⁺ out and two K⁺ in, so it is electrogenic."
      - "It is a channel through which the ions diffuse."
      - "The Na⁺ gradient it creates powers secondary active transport of glucose in gut cells."
    option_explanations:
      - |
        Correct. Na⁺ is already higher outside and K⁺ already higher inside; the pump makes both differences steeper, which is why it needs energy.
      - |
        Correct. Phosphorylation by ATP drives the conformational change that releases Na⁺ outside; dephosphorylation releases K⁺ inside.
      - |
        Correct. Net export of one positive charge per cycle makes the inside more negative, contributing to the membrane potential.
      - |
        A pump is a carrier that alternates between two shapes with ions bound; a channel is an open pore through which ions move passively, the opposite mechanism.
      - |
        Correct. The symporter that brings glucose in with Na⁺ uses the gradient the pump built; stop the pump and glucose uptake stops.
    answer: [0, 1, 2, 4]
    explanation: |
      Everything about the pump follows from its being an ATP-driven carrier: uphill, stoichiometric, electrogenic, and the energy source for transporters that ride its gradient.

  - slug: u02-exam-q28
    type: multi_select
    topic_code: "2.7"
    source: "Biology 2e §5.2 Passive Transport"
    points: 2
    partial_credit: true
    prompt: |
      A plant cell is placed in distilled water. Which statements describe what happens? Select all that apply.
    options:
      - "Water enters the cell by osmosis because the cell's water potential is lower than that of pure water."
      - "The cell bursts, because it has no way to resist the inflow."
      - "The central vacuole swells and the membrane presses against the wall, producing turgor."
      - "Net water entry stops when pressure potential rises enough to bring the cell's water potential to zero."
      - "The cell plasmolyses."
    option_explanations:
      - |
        Correct. Cell sap has solutes, so its Ψ is negative; pure water is at 0; water moves toward the lower value.
      - |
        The cellulose wall resists the inflow and the cell does not burst; bursting is what an animal cell does in the same solution.
      - |
        Correct. Turgor is the healthy state of a plant cell and what holds non-woody tissue upright.
      - |
        Correct. Ψ = Ψs + Ψp; as Ψp rises it offsets the negative Ψs until the cell's total Ψ equals the water's, 0 bar, and net movement stops.
      - |
        Plasmolysis is the membrane pulling away from the wall when water leaves in a hypertonic solution; in distilled water the opposite happens.
    answer: [0, 2, 3]
    explanation: |
      Water in, pressure up, equilibrium at Ψ = 0. The wall turns an osmotic problem into a mechanical solution.

