      Conceptual analysis. A eukaryotic cell and a bacterium of similar metabolic activity per unit volume are compared. The eukaryote is a hundred times larger in volume. (a) Describe two ways the eukaryotic cell's internal membranes compensate for its lower surface area to volume ratio. (b) Explain how compartmentalization lets the eukaryote run two chemically incompatible processes at the same time, with a specific example. (c) Explain why a prokaryote, which lacks organelles, can still carry out membrane-bound reactions efficiently. (d) Predict one consequence for the eukaryotic cell if its vesicle traffic between the ER and Golgi were blocked, and justify.
    answer: |
      Internal membranes add surface for membrane-bound reactions (cristae, thylakoids, ER) and divide the cell into small compartments within which diffusion distances are short. A lysosome keeps acid hydrolases at pH 5 while the cytosol stays at 7.2, so digestion and ordinary metabolism proceed at once without harm. A bacterium is small (high SA:V) and can fold its single plasma membrane inward to add surface. Blocking ER-to-Golgi traffic would stop delivery of membrane and secreted proteins, so the cell could not secrete, renew its plasma membrane proteins, or supply lysosomes; secretion would fail and material would pile up in the ER.
    explanation: |
      Four points.

      (a) 1 pt for two mechanisms: folded internal membranes (cristae, thylakoids, ER) add membrane surface for reactions without adding volume; organelles create small sub-volumes over which diffusion is fast; the cytoskeleton moves vesicles over distances diffusion cannot cover. Any two, each tied to surface or distance.

      (b) 1 pt: a membrane separates conditions, e.g. lysosome at pH 5 versus cytosol at 7.2, peroxisome generating hydrogen peroxide and destroying it internally, or mitochondrial matrix holding a proton gradient. Must name a specific incompatible pair of conditions and the compartment that separates them.

      (c) 1 pt: a prokaryote's small size gives it a high SA:V so diffusion suffices, and it can specialise or infold its one membrane (e.g. photosynthetic membranes in cyanobacteria); it lacks organelles but not membrane surface or organisation.

      (d) 1 pt: no cargo reaches the Golgi, so no secreted proteins, no new plasma membrane proteins or lipids, and no lysosomal enzymes are delivered; consequence such as loss of secretion, failure to renew surface transporters, or swelling of the ER with trapped protein. The justification must trace the pathway.

      Zero: answers that say the eukaryote has more membrane in total without linking to surface per volume, or that treat prokaryotes as having no membranes.

  - slug: u02-exam-q44
    type: long_answer
    topic_code: "2.7"
    source: "general knowledge"
    points: 8
    prompt: |
      Interpreting and evaluating experimental results. Students filled dialysis bags (permeable to water, not to sucrose) with sucrose solutions of known molarity, weighed them, placed each in distilled water for 30 minutes at 20 °C (293 K), blotted and reweighed. They then tested two bags of unknown solutions, X and Y, in the same way. R = 0.0831 L·bar/(mol·K).

      | Bag contents | Change in mass (%) |
      |---|---|
      | 0.0 M sucrose | +0.2 |
      | 0.2 M sucrose | +4.0 |
      | 0.4 M sucrose | +8.1 |
      | 0.6 M sucrose | +12.2 |
      | 0.8 M sucrose | +16.0 |
      | Unknown X | +6.0 |
      | Unknown Y | +12.0 |

      (a) Describe the relationship between sucrose molarity and percentage change in mass, using data, and explain it in terms of water potential.
      (b) Estimate the sucrose-equivalent molarity of unknowns X and Y, and calculate the solute potential of each in bars.
      (c) Unknown Y is later found to be a NaCl solution. Calculate its actual molarity and explain why it differs from your estimate in (b).
      (d) A student proposes that the 0.8 M bag would have gained 32% if left for 60 minutes. Evaluate this prediction, and identify one source of error in the procedure and its effect on the results.
    answer: |
      Mass gain rises in a straight line with molarity (+4.0% at 0.2 M to +16.0% at 0.8 M, about 20% per mole), because sucrose lowers the bag's Ψ below the water's 0 bar and water enters faster the steeper the gradient. X ≈ 0.30 M, Ψs = −(1)(0.30)(0.0831)(293) ≈ −7.3 bar; Y ≈ 0.60 M, Ψs ≈ −14.6 bar. If Y is NaCl, i = 2, so its molarity is about 0.30 M: the same osmotic effect comes from half the formula units because each dissociates into two particles. The prediction assumes a constant rate, but the gradient falls as water dilutes the bag and the bag's stretching adds pressure, so the gain would be less than double. Errors: not blotting (overstates gain), bags not fully at equilibrium (understates), different bag volumes or surface areas (different rates).
    explanation: |
      Eight points.

      (a) 2 pts: 1 pt for the description with data: percentage gain increases approximately linearly with molarity, quoting at least two values (e.g. +4.0% at 0.2 M and +16.0% at 0.8 M); 1 pt for the explanation: sucrose lowers the water potential inside the bag below that of distilled water (0 bar), water moves into the bag down the Ψ gradient, and a steeper gradient gives more gain in the fixed time.

      (b) 2 pts: 1 pt for reasonable estimates by interpolation, X ≈ 0.3 M (accept 0.28-0.32) and Y ≈ 0.6 M (accept 0.58-0.62); 1 pt for applying Ψs = −iCRT with T = 293 K and the sign negative: X ≈ −7.3 bar (accept −6.8 to −7.8), Y ≈ −14.6 bar (accept −14.0 to −15.2).

      (c) 2 pts: 1 pt for recognising that NaCl dissociates into two particles so i = 2, and the molarity giving the same Ψs is about half, 0.30 M (accept 0.29-0.31); 1 pt for the explanation that osmotic effect depends on the number of dissolved particles, not on formula units, so the mass-change calibration made with sucrose reports a particle concentration, which must be halved for a 1:1 salt.

      (d) 2 pts: 1 pt for evaluating the prediction: gain would not simply double because the rate falls as the bag's contents are diluted (gradient shrinks), and pressure from the stretched bag opposes further entry; the system approaches equilibrium rather than growing linearly. 1 pt for a source of error with its direction: failing to blot bags adds surface water and overstates gain; 30 minutes may not reach equilibrium, understating the final change; bags of unequal volume or surface area have different SA:V and different rates; evaporation or leaking bags. The effect on the results must be stated.

      Zero for a part: restating numbers without comparison; attributing the gain to sucrose entering the bag; using 20 °C in place of 293 K; concluding NaCl should be more concentrated than sucrose for the same effect.
