week: 23
unit: 7
title: Natural Selection, Fitness and Artificial Selection
topics: ["7.1", "7.2", "7.3"]
guide: guides/week-23.md
guide_description: |
  Darwin and Wallace's three conditions, why a population evolves but an individual never does, fitness as
  reproductive success relative to the rest of the population, the three modes of selection read from data,
  frequency-dependent and sexual selection, and artificial selection as the experiment that proves the mechanism.
  Three worked examples (the Daphne Major drought with standard error, relative fitness, an artificial-selection
  response), misconceptions, self-check.
flashcards_description: |
  34 cards: the conditions for natural selection, fitness and the modes of selection, reading selection data,
  sexual and frequency-dependent selection, and artificial selection as evidence.

flashcards:
  - front: Natural selection → the three conditions Darwin and Wallace needed
    back: |
      (1) Traits are heritable; (2) more offspring are produced than the environment can support, so individuals compete; (3) individuals vary, and those whose variations suit the environment survive and reproduce more. Favourable heritable traits therefore become more common each generation.
    hint: Heritable variation plus a struggle for limited resources.
    topic_code: "7.1"
  - front: Descent with modification
    back: |
      Darwin's phrase for evolution: each generation descends from the last with small heritable changes, and natural selection keeps the changes that fit the environment. Over many generations a population becomes adapted to its surroundings, and lineages that split become different species.
    topic_code: "7.1"
  - front: Adaptation (in the evolutionary sense)
    back: |
      A heritable trait that raises an organism's survival and reproduction in its present environment, such as a snow leopard's thick fur or a cheetah's speed. The word also names the process by which a population acquires such traits. Not an individual changing during its life.
    hint: Heritable, and useful in the environment the population is in now.
    topic_code: "7.1"
  - front: Why does a population evolve but an individual never does?
    back: |
      Evolution is a change in the genetic makeup of a population across generations, produced by some individuals leaving more offspring than others. An individual's genotype is fixed at fertilisation; it can develop and learn, but it cannot change the alleles it passes on.
    topic_code: "7.1"
  - front: Two sources of the heritable variation natural selection acts on
    back: |
      Mutation, which creates new alleles, and sexual reproduction, which shuffles existing alleles into new combinations (crossing over, independent assortment, random fertilisation). Selection sorts this variation; it does not create it.
    topic_code: "7.1"
  - front: Does an environmental change cause the mutations that would help?
    back: |
      No. Mutations arise at random with respect to need. Variation is already present before the environment changes; the change only alters which existing variants survive and reproduce. Antibiotic use did not create resistance alleles, it selected bacteria that already carried them.
    hint: Variation first, then selection.
    topic_code: "7.1"
  - front: Is a favourable trait favourable everywhere and always?
    back: |
      No. A trait is favourable only relative to a particular environment. Large leaves are selected in a moist climate (more light captured); if the climate turns dry, the same leaves lose water and small leaves are selected instead.
    topic_code: "7.1"
  - front: Selection pressure
    back: |
      Any feature of the environment (predators, climate, food supply, mates, disease, a farmer's choice) that causes some phenotypes to survive and reproduce better than others. Change the pressure and the direction of selection can change.
    topic_code: "7.1"
  - front: Lamarck's inheritance of acquired characteristics → what was wrong with it
    back: |
      Lamarck proposed that changes an organism makes during its life (a stretched neck, strengthened muscles) are passed to offspring. They are not: acquired traits do not alter the alleles in gametes, so natural selection can act only on heritable variation.
    topic_code: "7.1"
  - front: Heritability
    back: |
      The fraction of the variation in a phenotype that is due to genetic differences between individuals rather than to the environment. Selection changes a population only in proportion to the heritability of the trait: a trait with heritability near zero does not respond.
    topic_code: "7.1"
  - front: Convergent evolution
    back: |
      Similar traits evolving independently in distantly related lineages because they face similar selection pressures, such as the wings of bats and of insects. The similar structures are analogous, not evidence of recent common ancestry.
    hint: Same problem, same solution, different ancestors.
    topic_code: "7.1"
  - front: Divergent evolution
    back: |
      Related lineages becoming more different over time as different selection pressures act on them, such as flowering plants that share a basic body plan but look very different because of their pollinators.
    topic_code: "7.1"
  - front: Darwinian fitness → what it actually measures
    back: |
      An individual's genetic contribution to the next generation: how many surviving, reproducing offspring it leaves. It is not strength, size or lifespan; a short-lived organism that leaves many fertile offspring is fitter than a long-lived one that leaves few.
    hint: Count grandchildren, not muscles.
    topic_code: "7.2"
  - front: Relative fitness
    back: |
      An individual's (or genotype's) reproductive success compared with the most successful in the population, expressed as a fraction of it. Evolution depends on relative, not absolute, fitness: what matters is contributing a larger share of the next gene pool than others.
    topic_code: "7.2"
  - front: Survival of the fittest → what fittest really means
    back: |
      Not the strongest or longest-lived but the individuals that leave the most surviving offspring. Survival matters only because an organism must survive to reproduce; a trait that raises mating success at the cost of survival can still be favoured.
    topic_code: "7.2"
  - front: Stabilizing selection → effect on the mean and the variation
    back: |
      The average phenotype is favoured and both extremes are selected against. The mean stays where it is and the variation shrinks. Example: mice whose coat matches the forest floor survive; very light and very dark mice are seen by predators.
    hint: Middle wins, spread narrows.
    topic_code: "7.2"
  - front: Directional selection → effect on the mean and the variation
    back: |
      One extreme is favoured, so the mean shifts toward it and variation usually falls. Produced by a changed environment: in the 1977 Daphne Major drought only large, hard seeds remained and finches with deeper beaks survived, so mean beak depth rose in the next generation.
    hint: The whole distribution slides one way.
    topic_code: "7.2"
  - front: Disruptive (diversifying) selection → effect on the mean and the variation
    back: |
      Both extremes are favoured over the intermediate, so variation increases and the population may split into two phenotypic groups. Example: beach mice that are either light (sand) or dark (grass patches) are hidden; medium-coloured mice are hidden nowhere.
    hint: Middle loses, spread widens.
    topic_code: "7.2"
  - front: Given a before-and-after histogram, how do you name the mode of selection?
    back: |
      Compare the mean and the spread. Mean moved, spread narrowed: directional. Mean unchanged, spread narrowed: stabilizing. Mean unchanged but two peaks appear or spread widened: disruptive. Always check that the trait is heritable before calling the change evolution.
    topic_code: "7.2"
  - front: The Grants' finch study → what happened to beak depth in the 1977 drought
    back: |
      Small soft seeds disappeared and only large hard seeds remained; finches with deeper beaks could crack them and survived at higher rates. Because beak depth is heritable, the offspring born after the drought had deeper beaks on average than the pre-drought population. When small seeds returned in later wet years, the trend stopped and partly reversed.
    topic_code: "7.2"
  - front: Negative frequency-dependent selection
    back: |
      The fitness of a phenotype falls as it becomes common and rises when it is rare, so no phenotype can take over and several are maintained. Example: the three throat-colour morphs of male side-blotched lizards cycle in frequency, each beating one of the others.
    hint: Rare is good.
    topic_code: "7.2"
  - front: Side-blotched lizard throat morphs → what the cycle shows
    back: |
      Orange males (large territories, many females) beat blue males; blue males (one guarded female) beat yellow sneaker males; yellow males slip into orange territories and beat orange. Each morph's success depends on which others are common, a rock-paper-scissors cycle that keeps all three in the population.
    topic_code: "7.2"
  - front: Sexual selection
    back: |
      Selection produced by competition for mates rather than by survival. Traits that win fights (antlers, size) or attract the other sex (bright plumage, song) spread even if they cost survival, because fitness is measured in offspring.
    topic_code: "7.2"
  - front: Sexual dimorphism
    back: |
      Consistent differences between the males and females of a species beyond the reproductive organs themselves (size, colour, ornaments, weapons). It arises when one sex, usually the male, varies greatly in mating success, so the traits of the few successful individuals are strongly selected.
    topic_code: "7.2"
  - front: Good genes hypothesis vs handicap principle
    back: |
      Good genes: an elaborate ornament signals disease resistance or metabolic efficiency, so a female who chooses it gets better alleles for her offspring. Handicap: only a high-quality male can survive while carrying a costly ornament such as a peacock's tail, so the cost itself makes the signal honest.
    topic_code: "7.2"
  - front: Why can natural selection not produce a perfect organism?
    back: |
      It can only choose among the variants that already exist; it cannot invent a trait from scratch. Alleles are inherited in linked blocks, so a beneficial allele may travel with a harmful one. Traits trade off (speed against stamina, size against agility). And drift and gene flow can push a population away from what selection favours.
    topic_code: "7.2"
  - front: Standard error of the mean → equation and what it is for
    back: |
      SE = s / √n, where s is the sample standard deviation and n the sample size. It estimates how far the sample mean is likely to be from the true population mean. A larger sample shrinks SE. The AP convention: error bars of ±2 SE that do not overlap suggest the two means really differ.
    hint: Bigger n, smaller error.
    topic_code: "7.2"
  - front: Two sample means with error bars → how do you decide whether they differ?
    back: |
      Draw each mean ±2 SE (roughly a 95% confidence interval). If the intervals do not overlap, the difference is unlikely to be sampling chance and you can claim the populations differ. If they overlap, you cannot claim a difference from these data, whatever the means look like.
    topic_code: "7.2"
  - front: Artificial selection
    back: |
      Humans choose which individuals breed on the basis of a trait they want, so the trait changes across generations. Every breed of dog, every crop and every farm animal was made this way. It shows that selection on heritable variation changes a population, which is exactly what natural selection claims.
    topic_code: "7.3"
  - front: Artificial vs natural selection → what differs and what is the same
    back: |
      Same: both act on heritable variation already present, and both change allele frequencies across generations. Different: in artificial selection the breeder decides who reproduces according to a chosen trait; in natural selection the environment decides, according to survival and reproduction, with no goal.
    hint: The agent of selection differs; the mechanism does not.
    topic_code: "7.3"
  - front: Why is artificial selection evidence for evolution by natural selection?
    back: |
      Darwin's argument: if breeders can produce wolves-to-chihuahuas variation in a few thousand years by choosing who breeds, then an environment choosing who survives and breeds over millions of years can produce the differences between species. The mechanism is observed directly, on a human timescale.
    topic_code: "7.3"
  - front: AP Investigation 1 (Artificial Selection) → what is selected and how the response is measured
    back: |
      Students count a heritable trait in Wisconsin Fast Plants, usually the number of hairs (trichomes) on the stem, let only the hairiest (or least hairy) 10% or so cross-pollinate, grow the seeds, and count again. The response is the change in the mean (and the distribution) of the trait between generations, compared with an unselected control.
    topic_code: "7.3"
  - front: Response to selection → the two things it depends on
    back: |
      How strongly the breeder (or environment) selects, that is how different the chosen parents are from the population mean, and how heritable the trait is. Strong selection on a trait that is mostly environmental produces little response; even mild selection on a highly heritable trait moves the mean.
    topic_code: "7.3"
  - front: Evolution has no goal → one sentence
    back: |
      Populations are not progressing toward complexity or perfection; they track whatever environment they are in, using the variation they happen to have, and a trait favoured now may be disfavoured when conditions change.
    topic_code: "7.1"

quiz:
  description: |
    25 questions · about 35 minutes · natural selection as a mechanism, fitness and the modes of selection read
    from data, sexual and frequency-dependent selection, and artificial selection, with spiral review of
    mutation, meiosis, Mendelian ratios, phenotype and protein structure. Multiple choice, select-all,
    true/false and numeric items are graded at once; the fill-in-the-blank items are matched automatically;
    the two short answers and the long answer are graded by your teacher against the acceptable-answer summary.
  questions:
    - slug: u07-w23-q01
      type: multiple_choice
      topic_code: "7.2"
      source: "Biology 2e §18.1 Understanding Evolution"
      points: 1
      stimulus: |
        On the island of Daphne Major (Galapagos), a drought in 1977 killed most of the plants that produce small, soft seeds; the large, hard seeds of Tribulus remained. Researchers measured beak depth in the medium ground finch (Geospiza fortis) before the drought, in the birds that survived it, and in the first generation born afterwards. Beak depth is highly heritable in this species.

        | Group | n | Mean beak depth (mm) | Standard deviation (mm) |
        |---|---|---|---|
        | 1976 population, before the drought | 400 | 9.4 | 1.0 |
        | 1978 survivors of the drought | 100 | 9.9 | 1.0 |
        | 1978 offspring of the survivors | 200 | 9.7 | 1.0 |
      prompt: |
        Which mode of selection do the data best illustrate, and what feature of the data supports that choice?
      options:
        - "Stabilizing selection, because the standard deviation did not change between groups."
        - "Directional selection, because the mean shifted toward one extreme (deeper beaks) after the environment changed."
        - "Disruptive selection, because both deep-beaked and shallow-beaked birds survived the drought."
        - "Sexual selection, because beak depth affects which males attract mates."
      option_explanations:
        - |
          Stabilizing selection keeps the mean in place and narrows the spread. Here the mean moved by half a millimetre; an unchanged standard deviation alone does not identify the mode.
        - |
          Correct. A changed food supply favoured one end of the beak-depth distribution, the survivors' mean rose, and because the trait is heritable the next generation's mean rose too. That is the signature of directional selection.
        - |
          Disruptive selection would favour both extremes and produce two peaks or a wider spread. The table shows a single mean moving one way, not a split.
        - |
          Nothing in the data concerns mating success; survival through a drought with hard seeds is the selective event, so this is survival-based natural selection.
      answer: 1
      explanation: |
        To name a mode of selection, ask what happened to the mean and to the spread. A mean that moves after an environmental change is directional selection; the Grants' finches are the textbook case because the change was measured generation by generation.

    - slug: u07-w23-q02
      type: multiple_choice
      topic_code: "7.1"
      source: "Biology 2e §18.1 Understanding Evolution"
      points: 1
      stimulus: |
        On the island of Daphne Major (Galapagos), a drought in 1977 killed most of the plants that produce small, soft seeds; the large, hard seeds of Tribulus remained. Researchers measured beak depth in the medium ground finch (Geospiza fortis) before the drought, in the birds that survived it, and in the first generation born afterwards. Beak depth is highly heritable in this species.

        | Group | n | Mean beak depth (mm) | Standard deviation (mm) |
        |---|---|---|---|
        | 1976 population, before the drought | 400 | 9.4 | 1.0 |
        | 1978 survivors of the drought | 100 | 9.9 | 1.0 |
        | 1978 offspring of the survivors | 200 | 9.7 | 1.0 |
      prompt: |
        Why is the mean beak depth of the 1978 survivors greater than the mean of the 1976 population?
      options:
        - "Individual finches grew deeper beaks during the drought in response to the harder seeds."
        - "The drought caused mutations for deeper beaks in the finches that were exposed to it."
        - "Finches that already had deeper beaks were more likely to crack the remaining seeds and survive, so the survivors are a non-random subset of the original population."
        - "The survivors were measured with a different instrument that read 0.5 mm high."
      option_explanations:
        - |
          Beak depth in an adult bird is fixed; an individual does not evolve. The survivors are the same birds that were already deep-beaked in 1976, not birds that changed.
        - |
          Mutation is random with respect to need and is far too rare to shift a population mean in one year. The variation in beak depth was present before the drought began.
        - |
          Correct. The drought removed shallow-beaked birds from the population; the survivors' mean is higher because of who died, not because anyone changed. That is selection among existing variation.
        - |
          Inventing a measurement error is not a conclusion the data support; the offspring generation, measured in the same way, confirms the shift is real and heritable.
      answer: 2
      explanation: |
        Populations evolve because the environment sorts the variation that already exists. The individual finches did not change; the composition of the population did, and heritability carried that change into the next generation.

    - slug: u07-w23-q03
      type: numeric
      topic_code: "7.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        On the island of Daphne Major (Galapagos), a drought in 1977 killed most of the plants that produce small, soft seeds; the large, hard seeds of Tribulus remained. Researchers measured beak depth in the medium ground finch (Geospiza fortis) before the drought, in the birds that survived it, and in the first generation born afterwards. Beak depth is highly heritable in this species.

        | Group | n | Mean beak depth (mm) | Standard deviation (mm) |
        |---|---|---|---|
        | 1976 population, before the drought | 400 | 9.4 | 1.0 |
        | 1978 survivors of the drought | 100 | 9.9 | 1.0 |
        | 1978 offspring of the survivors | 200 | 9.7 | 1.0 |
      prompt: |
        Using the AP formula SE = s / √n, calculate the standard error of the mean for the 1976 population. Give your answer in millimetres to two decimal places.
      answer: { value: 0.05, tolerance: 0.005 }
      explanation: |
        SE = s / √n = 1.0 / √400 = 1.0 / 20 = 0.05 mm. For the survivors, SE = 1.0 / √100 = 0.10 mm; the smaller sample has the larger uncertainty even though the standard deviation is the same. The standard error is what you use to build ±2 SE error bars and judge whether two means really differ.

    - slug: u07-w23-q04
      type: multiple_choice
      topic_code: "7.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        On the island of Daphne Major (Galapagos), a drought in 1977 killed most of the plants that produce small, soft seeds; the large, hard seeds of Tribulus remained. Researchers measured beak depth in the medium ground finch (Geospiza fortis) before the drought, in the birds that survived it, and in the first generation born afterwards. Beak depth is highly heritable in this species.

        | Group | n | Mean beak depth (mm) | Standard deviation (mm) |
        |---|---|---|---|
        | 1976 population, before the drought | 400 | 9.4 | 1.0 |
        | 1978 survivors of the drought | 100 | 9.9 | 1.0 |
        | 1978 offspring of the survivors | 200 | 9.7 | 1.0 |
      prompt: |
        Using ±2 SE error bars as an approximate 95% confidence interval, which statement about the 1976 population and the 1978 survivors is best supported?
      options:
        - "The intervals (about 9.3–9.5 mm and 9.7–10.1 mm) do not overlap, so the difference in mean beak depth is unlikely to be due to sampling chance."
        - "The intervals overlap because both groups have the same standard deviation, so no difference can be claimed."
        - "A difference of 0.5 mm is too small to matter biologically, so no statistical test is needed."
        - "The survivors' interval is wider, which shows that the drought increased variation in beak depth."
      option_explanations:
        - |
          Correct. 1976: 9.4 ± 2(0.05) = 9.3 to 9.5. Survivors: 9.9 ± 2(0.10) = 9.7 to 10.1. Non-overlapping intervals support a real difference between the groups.
        - |
          Equal standard deviations do not make intervals overlap; the interval depends on the mean and the standard error. Computed, the two intervals are separated by 0.2 mm.
        - |
          Half a millimetre is about half a standard deviation, a large shift for one generation, and the survivors could crack seeds the others could not. Biological importance is judged from the organism, not from the number alone.
        - |
          The survivors' interval is wider only because their sample is smaller (n = 100 against 400). The standard deviation, the measure of variation, is identical in both groups.
      answer: 0
      explanation: |
        Error bars answer one question: could this difference be sampling noise? Non-overlapping ±2 SE bars say probably not. A wider bar signals a smaller sample, not more biological variation.

    - slug: u07-w23-q05
      type: multiple_choice
      topic_code: "7.1"
      source: "Biology 2e §18.1 Understanding Evolution"
      points: 1
      prompt: |
        A student claims that a population of plants will evolve thicker leaves because its habitat is becoming drier. Which additional fact is necessary for the claim to be reasonable?
      options:
        - "Individual plants can thicken their leaves when water is scarce."
        - "Leaf thickness varies among the plants and the variation is heritable, and thicker-leaved plants survive and reproduce better in dry conditions."
        - "The plants want to survive and will adjust to the new climate."
        - "Dry conditions increase the mutation rate, producing the thicker-leaf allele when it is needed."
      option_explanations:
        - |
          A plastic response within one plant's lifetime is not heritable and is not evolution. The claim concerns the population changing across generations, which needs heritable variation.
        - |
          Correct. Natural selection requires heritable variation in the trait and a fitness difference tied to it. With both, the frequency of thick-leaf alleles rises each generation.
        - |
          Organisms have no capacity to evolve on purpose. Populations change because some individuals leave more offspring, not because any individual intends anything.
        - |
          Mutations are random with respect to need. Dryness does not generate the specific useful allele; if the allele is absent, the population cannot respond and may decline instead.
      answer: 1
      explanation: |
        Every natural-selection claim needs the same checklist: is there variation, is it heritable, does it affect reproductive success in this environment? If any answer is no, the population will not evolve the trait.

    - slug: u07-w23-q06
      type: multiple_choice
      topic_code: "7.1"
      source: "Biology 2e §18.1 Understanding Evolution"
      points: 1
      prompt: |
        A hospital introduces a new antibiotic, and within two years most Staphylococcus infections there are resistant to it. Which statement correctly describes the origin of the resistance?
      options:
        - "Exposure to the antibiotic caused the bacteria to develop resistance so that they could survive."
        - "A few bacteria already carried resistance alleles before the antibiotic was used; the drug killed the rest, so the resistant ones left the descendants."
        - "The antibiotic mutated the bacterial DNA in a way that produced the resistance gene."
        - "Bacteria that survived one dose learned to tolerate higher doses and passed the habit on."
      option_explanations:
        - |
          This is the purpose misconception. Bacteria do not respond to a need; the drug removed the sensitive cells and the resistant minority inherited the population.
        - |
          Correct. Resistance alleles (from random mutation or acquired on plasmids) were present at low frequency. Selection by the antibiotic changed the frequency, not the bacteria.
        - |
          Antibiotics kill or inhibit cells; they are not mutagens that write specific useful genes. The relevant mutations happened independently of, and usually before, exposure.
        - |
          Tolerance acquired by an individual cell is not inherited. Only alleles in the DNA passed to daughter cells persist across generations.
      answer: 1
      explanation: |
        Variation first, selection second. Antibiotic resistance is the clearest modern case: the Lederbergs showed in 1952 that resistant colonies exist on plates that have never seen the drug.

    - slug: u07-w23-q07
      type: multiple_choice
      topic_code: "7.2"
      source: "Biology 2e §19.3 Adaptive Evolution"
      points: 1
      prompt: |
        Beach mice live on pale sand dunes broken by patches of dark grass. Over several generations, light-coated mice and dark-coated mice both increase in frequency while medium-coloured mice decline. Which mode of selection is acting, and why?
      options:
        - "Stabilizing selection, because the population is being held at a stable mix of colours."
        - "Directional selection, because the population is moving toward darker coats."
        - "Disruptive selection, because each extreme is camouflaged in one habitat while the intermediate is hidden in neither."
        - "Frequency-dependent selection, because light mice become more common than dark mice."
      option_explanations:
        - |
          Stabilizing selection favours the middle of the distribution. Here the middle is the losing phenotype, the opposite situation.
        - |
          Both extremes are rising, not one. A shift toward a single extreme would be directional; two extremes rising together is disruptive.
        - |
          Correct. Two habitats, two camouflage solutions, and an intermediate that is conspicuous on both backgrounds: the hallmark of disruptive (diversifying) selection, which raises variation.
        - |
          Frequency-dependent selection means a phenotype's fitness depends on how common it is. Nothing here says light mice do worse when common; their advantage comes from the sand, not from rarity.
      answer: 2
      explanation: |
        Disruptive selection is the one mode that increases variation, and it is the starting point for sympatric divergence later in the unit. Two habitats with two optima are the usual cause.

    - slug: u07-w23-q08
      type: multiple_choice
      topic_code: "7.2"
      source: "Biology 2e §19.3 Adaptive Evolution"
      points: 1
      prompt: |
        In male side-blotched lizards, orange males defeat blue males, blue males defeat yellow males, and yellow males defeat orange males. Over the years the proportion of each morph rises and falls in a cycle. Which conclusion about this system is correct?
      options:
        - "The morph that is currently most common has the highest fitness and will eventually replace the others."
        - "Each morph's fitness falls as it becomes common, so no morph can go to fixation and all three persist."
        - "The cycle shows that the three morphs are different species in the process of merging."
        - "The population is under stabilizing selection toward an intermediate throat colour."
      option_explanations:
        - |
          Being common is the problem, not the advantage: a common morph is the one its counter-strategy exploits most, so its fitness drops and the cycle turns.
        - |
          Correct. This is negative frequency-dependent selection; rarity is favoured, which maintains polymorphism in the population indefinitely.
        - |
          The morphs interbreed freely; they are alleles within one species, not separate species. Throat colour is a mating strategy, not a reproductive barrier.
        - |
          There is no intermediate optimum being favoured; three discrete strategies each do best under a particular mix of the others.
      answer: 1
      explanation: |
        Frequency-dependent selection is the exam's favourite example of selection maintaining variation rather than removing it. Whenever fitness depends on what others are doing, expect cycles rather than fixation.

    - slug: u07-w23-q09
      type: multiple_choice
      topic_code: "7.3"
      source: "Biology 2e §18.1 Understanding Evolution"
      points: 1
      prompt: |
        A breeder produces a line of dogs with much shorter legs in twenty generations by always breeding the shortest-legged puppies. Which statement correctly compares this with natural selection?
      options:
        - "The two are different mechanisms: the breeder creates new short-leg alleles, whereas natural selection only removes alleles."
        - "The mechanism is the same (heritable variation plus non-random reproduction); only the agent choosing who breeds differs."
        - "Artificial selection changes individuals within their lifetime, whereas natural selection changes populations."
        - "Artificial selection cannot produce real evolutionary change because the dogs remain one species."
      option_explanations:
        - |
          The breeder creates nothing; the short-leg alleles existed among the puppies. Selection, by a breeder or an environment, changes allele frequencies, and neither writes new alleles.
        - |
          Correct. Both depend on heritable variation and on some individuals reproducing more than others. A breeder's choice replaces survival and mating success as the cause of that difference.
        - |
          Neither form of selection changes an individual's legs. Both act across generations on the composition of the population.
        - |
          Evolution is a change in allele frequencies across generations, which plainly happened. Speciation is a further step, not the definition of evolution.
      answer: 1
      explanation: |
        Darwin opened the Origin with pigeon breeders for exactly this reason: artificial selection is natural selection with the environment replaced by a human, and it shows the mechanism works on a timescale we can watch.

    - slug: u07-w23-q10
      type: multiple_choice
      topic_code: "7.2"
      source: "Biology 2e §19.3 Adaptive Evolution"
      points: 1
      prompt: |
        Which of these organisms has the highest Darwinian fitness?
      options:
        - "A stag that lives 15 years, wins most of its fights and fathers 3 fawns that reach adulthood."
        - "A stag that lives 6 years and fathers 9 fawns that reach adulthood."
        - "A stag that lives 20 years, is the largest in the herd, and fathers 2 fawns that reach adulthood."
        - "A stag that lives 10 years, is never ill, and fathers no fawns."
      option_explanations:
        - |
          Winning fights and living long are means, not ends. Three surviving offspring is a smaller genetic contribution than nine.
        - |
          Correct. Fitness is the number of surviving, reproducing offspring an individual contributes to the next generation. Nine adult fawns is the largest contribution, whatever the lifespan.
        - |
          Size and longevity are tempting proxies for fitness but they are not the measure. Two surviving offspring is a small contribution.
        - |
          A healthy stag that leaves no offspring has a fitness of zero; its alleles are not represented in the next generation at all.
      answer: 1
      explanation: |
        Fitness is reproductive success relative to others, nothing else. Every exam item on fitness can be solved by counting surviving offspring and ignoring strength, size and lifespan.

    - slug: u07-w23-q11
      type: multiple_choice
      topic_code: "6.7"
      source: "Biology 2e §14.6 DNA Repair"
      points: 1
      prompt: |
        Review. A point mutation changes a codon from GAA to GAG; both codons specify glutamate. Which statement describes the consequence for natural selection?
      options:
        - "The mutation produces a new allele that natural selection will favour because it is harmless."
        - "The mutation is silent: the protein is unchanged, so there is no phenotype for selection to act on and the allele's frequency changes only by chance."
        - "The mutation is a frameshift that destroys the protein and will be removed by selection."
        - "The mutation is a nonsense mutation that shortens the protein and reduces fitness."
      option_explanations:
        - |
          Natural selection cannot favour an allele that makes no difference to the phenotype. A harmless change is invisible to selection, not selected for.
        - |
          Correct. A synonymous substitution leaves the amino-acid sequence intact. Such neutral alleles drift; they matter later for molecular clocks because they accumulate at a steady rate.
        - |
          A frameshift comes from inserting or deleting bases, not from substituting one. The reading frame here is untouched.
        - |
          A nonsense mutation creates a stop codon. GAG is a glutamate codon, so translation continues normally.
      answer: 1
      explanation: |
        Mutations are the raw material of evolution, but only mutations that change the phenotype are visible to selection. Silent changes still matter: they are the ticks of the molecular clock in week 25.

    - slug: u07-w23-q12
      type: multiple_choice
      topic_code: "5.2"
      source: "Biology 2e §11.1 The Process of Meiosis"
      points: 1
      prompt: |
        Review. A sexually reproducing population shows new combinations of alleles in every generation even when no new mutations occur. Which pair of meiotic events is responsible?
      options:
        - "DNA replication in S phase and cytokinesis."
        - "Crossing over between non-sister chromatids in prophase I and independent assortment of homologous pairs at metaphase I."
        - "Separation of sister chromatids at anaphase II and formation of the nuclear envelope."
        - "Spindle attachment in prometaphase and chromosome condensation."
      option_explanations:
        - |
          Replication copies alleles faithfully and cytokinesis divides the cytoplasm; neither makes a new combination of alleles.
        - |
          Correct. Crossing over builds recombinant chromosomes carrying maternal and paternal alleles together, and independent assortment shuffles whole chromosomes into 2ⁿ possible gametes. Selection then acts on these combinations.
        - |
          Anaphase II separates identical sister chromatids; it distributes existing combinations but does not create new ones.
        - |
          These mechanical steps are needed for division but do not shuffle alleles between chromosomes or between homologues.
      answer: 1
      explanation: |
        Mutation creates alleles; meiosis creates combinations. Natural selection needs both sources of variation, which is why sexual reproduction is so widespread despite its costs.

    - slug: u07-w23-q13
      type: multiple_choice
      topic_code: "5.3"
      source: "Biology 2e §12.2 Characteristics and Traits"
      points: 1
      prompt: |
        Review. In a population, allele a is recessive and rare, so most copies of a are carried by heterozygotes, which have the same phenotype as AA individuals. If the aa phenotype is strongly selected against, what does this predict?
      options:
        - "Allele a will be removed from the population within one or two generations."
        - "Allele a will decline only slowly, because selection cannot see the copies hidden in heterozygotes."
        - "Allele a will increase, because heterozygotes are fitter than either homozygote."
        - "Allele a will stay exactly constant, because recessive alleles are never affected by selection."
      option_explanations:
        - |
          Selection removes only aa individuals, and when a is rare almost all a alleles are in Aa carriers, so each generation removes a tiny fraction of the allele.
        - |
          Correct. A recessive allele is sheltered in heterozygotes. The rarer it becomes, the larger the share of copies in carriers, and the slower selection against it works.
        - |
          Nothing in the prompt says heterozygotes are fitter; they are the same as AA. Heterozygote advantage is a separate situation (as with sickle-cell).
        - |
          Recessive alleles are affected by selection whenever homozygotes appear; the effect is slow, not zero.
      answer: 1
      explanation: |
        This Mendelian fact sets up Hardy-Weinberg next week: the carrier frequency 2pq is large even when q² is tiny, so recessive alleles persist in populations for a very long time.

    - slug: u07-w23-q14
      type: multiple_choice
      topic_code: "5.5"
      source: "Biology 2e §19.2 Population Genetics"
      points: 1
      prompt: |
        Review. American alligator eggs incubated at 30 °C produce females and eggs at 33 °C produce males. A warm nesting season produces a generation that is mostly male. Which statement is correct?
      options:
        - "The population has evolved toward a male-biased sex ratio."
        - "The sex ratio is an environmental effect on phenotype and is not itself heritable, so no evolution has occurred."
        - "The warm season caused mutations in the sex-determining genes."
        - "Natural selection favoured males during the warm season."
      option_explanations:
        - |
          Evolution is a change in allele frequencies. Temperature changed which sex developed, not which alleles are present; the next cool season would reverse it.
        - |
          Correct. This is environmental variance: the same genotypes produce different phenotypes under different conditions. Because it is not heritable, selection cannot act on it directly.
        - |
          Temperature-dependent sex determination is a developmental response, not a mutation. No DNA sequence changed.
        - |
          No differential survival or reproduction tied to a heritable trait happened; the environment set the phenotype directly.
      answer: 1
      explanation: |
        Phenotype = genotype + environment. Natural selection works only on the heritable part, which is why the heritability of a trait decides whether a population can respond to selection on it.

    - slug: u07-w23-q15
      type: multiple_choice
      topic_code: "1.7"
      source: "Biology 2e §3.4 Proteins"
      points: 1
      prompt: |
        Review. The sickle-cell allele substitutes valine for glutamate at position 6 of the haemoglobin β chain. Why does a single substitution out of about 150 residues change the protein's behaviour enough for natural selection to act on it?
      options:
        - "Any substitution destroys a protein because every residue is essential."
        - "Valine is nonpolar where glutamate was charged, creating a hydrophobic patch on the surface that makes deoxygenated haemoglobin molecules stick together."
        - "The substitution removes the haem group so the protein can no longer bind oxygen."
        - "The substitution changes the secondary structure from α helix to β sheet throughout the molecule."
      option_explanations:
        - |
          Many substitutions are tolerated, especially conservative ones or those on the surface. What matters is where the change is and what chemistry it alters.
        - |
          Correct. Swapping a charged R group for a hydrophobic one at a surface position lets molecules aggregate into fibres when oxygen is low, distorting the red cell. Structure determines function, and selection acts on the result.
        - |
          The haem group is unaffected; sickle haemoglobin binds oxygen. The problem is polymerisation when oxygen is released.
        - |
          The fold of each subunit is almost unchanged. The defect is a new surface interaction between molecules, not a global change in secondary structure.
      answer: 1
      explanation: |
        A mutation matters to selection according to what it does to the protein's chemistry. The sickle allele returns next week as the classic case of heterozygote advantage maintaining a harmful allele.

    - slug: u07-w23-q16
      type: multi_select
      topic_code: "7.1"
      source: "Biology 2e §18.1 Understanding Evolution"
      points: 2
      partial_credit: true
      prompt: |
        Select every statement that is consistent with natural selection as Darwin and Wallace described it.
      options:
        - "More offspring are produced than can survive, so individuals compete for limited resources."
        - "Individuals that acquire useful traits during their lives pass those traits to their offspring."
        - "Heritable variation exists among individuals before the environment selects among them."
        - "The traits that are favoured depend on the environment and can change when the environment changes."
        - "Populations evolve toward a goal of greater complexity."
      option_explanations:
        - |
          Correct. Overproduction and limited resources are the second of Darwin's three conditions; without competition, no variant would leave more descendants than another.
        - |
          This is Lamarck's mechanism. Acquired traits do not change the alleles in gametes, so they cannot be inherited; natural selection needs heritable variation.
        - |
          Correct. Variation is the raw material. It arises by mutation and recombination independently of need, and selection sorts it afterwards.
        - |
          Correct. Fitness is always relative to a particular environment; large leaves favoured in a wet climate become a liability when the climate dries.
        - |
          Evolution has no direction or goal. Populations track their current environment with the variation they happen to have; many lineages become simpler, not more complex.
      answer: [0, 2, 3]
      explanation: |
        The three conditions (heritability, overproduction with competition, variation) plus the rule that fitness is environment-specific are the whole mechanism. The two wrong statements are the two most common misconceptions.

    - slug: u07-w23-q17
      type: multi_select
      topic_code: "7.2"
      source: "Biology 2e §19.3 Adaptive Evolution"
      points: 2
      partial_credit: true
      prompt: |
        Which statements correctly pair a mode of selection with its effect on a population's distribution of a trait? Select all that apply.
      options:
        - "Stabilizing selection: the mean is unchanged and the variation decreases."
        - "Directional selection: the mean shifts toward one extreme."
        - "Disruptive selection: the variation increases and two phenotypic groups may form."
        - "Stabilizing selection: the mean shifts and the variation increases."
        - "Directional selection: both extremes increase at the expense of the intermediate."
      option_explanations:
        - |
          Correct. Favouring the average phenotype trims both tails, as with human birth weight or forest mice whose coats match the floor.
        - |
          Correct. A changed environment favours one tail, as with finch beaks after the drought, and the whole distribution slides that way.
        - |
          Correct. When each extreme has its own habitat or strategy, intermediates lose and the distribution widens or splits, as with beach mice.
        - |
          Stabilizing selection does the reverse on both counts: the mean stays put and the spread narrows.
        - |
          Two extremes rising together is disruptive selection. Directional selection favours one extreme only.
      answer: [0, 1, 2]
      explanation: |
        Three modes, two questions each: did the mean move, and did the spread change? Stabilizing (no, narrower), directional (yes, usually narrower), disruptive (no, wider or bimodal).

    - slug: u07-w23-q18
      type: true_false
      topic_code: "7.2"
      source: "Biology 2e §19.3 Adaptive Evolution"
      points: 1
      prompt: |
        True or false: Natural selection can favour a trait, such as a peacock's tail, that lowers an individual's chance of surviving, provided the trait raises the number of offspring the individual leaves.
      answer: true
      explanation: |
        True. Fitness is reproductive success, and survival is only a means to it. Sexual selection favours ornaments and weapons that make males more visible to predators or slower to escape because the males that carry them obtain far more matings. The handicap principle goes further: the cost is what makes the signal honest, because only a high-quality male can afford it.

    - slug: u07-w23-q19
      type: true_false
      topic_code: "6.7"
      source: "Biology 2e §14.6 DNA Repair"
      points: 1
      prompt: |
        Review. True or false: Inserting a single nucleotide into the coding region of a gene usually has a milder effect on the protein than substituting a single nucleotide.
      answer: false
      explanation: |
        False. An insertion or deletion that is not a multiple of three shifts the reading frame, so every codon downstream is misread and the protein is usually nonfunctional. A substitution changes at most one codon and may be silent, missense or nonsense. Frameshift alleles are therefore strongly selected against, while many substitutions are neutral and persist.

    - slug: u07-w23-q20
      type: fill_blank
      topic_code: "7.2"
      source: "Biology 2e §19.3 Adaptive Evolution"
      points: 1
      prompt: |
        When predators remove the lightest and the darkest mice from a forest-floor population, leaving the average coat colour most common and narrowing the range, the population is under ____ selection.
      answer: ["stabilizing", "stabilising"]
      explanation: |
        Stabilizing selection favours the intermediate phenotype and removes both extremes, reducing variation without moving the mean. It is the commonest mode in a stable environment. "Directional" would need the mean to move; "disruptive" would need the extremes to be favoured.

    - slug: u07-w23-q21
      type: fill_blank
      topic_code: "5.3"
      source: "Biology 2e §12.2 Characteristics and Traits"
      points: 1
      prompt: |
        Review. Natural selection acts on an organism's observable traits, collectively called its ____, even though what is inherited is the underlying set of alleles.
      answer: ["phenotype"]
      explanation: |
        Selection sees phenotypes; inheritance transmits genotypes. The gap between them is why a recessive allele hides in heterozygotes and why environmental effects on phenotype do not evolve. "Genotype" is the inherited allele set, not what the environment acts on, so it is not accepted.

    - slug: u07-w23-q22
      type: numeric
      topic_code: "7.2"
      source: "Biology 2e §19.3 Adaptive Evolution"
      points: 1
      prompt: |
        In a population of lizards, individuals with genotype GG leave on average 8 surviving offspring and individuals with genotype gg leave on average 6. Taking the most successful genotype as 1.0, what is the relative fitness of gg? Give your answer to two decimal places.
      answer: { value: 0.75, tolerance: 0.01 }
      explanation: |
        Relative fitness = (offspring of this genotype) ÷ (offspring of the most successful genotype) = 6 ÷ 8 = 0.75. GG has relative fitness 1.0. Selection acts on this difference of 0.25: each generation gg contributes a smaller share of the gene pool than GG does, even though gg individuals do reproduce.

    - slug: u07-w23-q23
      type: short_answer
      topic_code: "7.3"
      source: "general knowledge"
      points: 4
      prompt: |
        Scientific investigation. In AP Investigation 1 a class has a tray of 100 Wisconsin Fast Plants in which the number of hairs (trichomes) on the stem varies from 0 to 25 per plant. (a) Describe a procedure to test whether trichome number responds to artificial selection, naming the independent and dependent variables and a control. (b) State the prediction if trichome number is heritable. (c) Explain what result would show that the trait has low heritability and why.
      answer: |
        Count trichomes on every plant; allow only the hairiest 10% to cross-pollinate (IV = whether the parents were selected; DV = mean trichome number in the next generation); grow a control generation from randomly chosen parents under identical conditions. If heritable, the selected line's mean rises above the control's. If the selected line's offspring have the same mean as the control, the variation was mostly environmental and the trait has low heritability.
      explanation: |
        Four points.

        (a) Procedure, 2 pts: 1 pt for a design in which only plants at one extreme of trichome number (for example the top 10%) are allowed to breed, with the independent variable (selected versus unselected parents) and the dependent variable (mean trichome number, or the distribution, in the offspring generation) both identified; 1 pt for a control: an unselected line grown from randomly chosen parents under the same light, water and soil, so that any change in the selected line can be attributed to selection. Accept also measuring the parent generation first so the response can be computed as offspring mean minus parent mean.

        (b) Prediction, 1 pt: the mean trichome number of the selected line's offspring will be higher than that of the control (or than the original population), with a directional statement. A non-directional prediction earns nothing.

        (c) Low heritability, 1 pt: if the offspring of the hairiest parents have a mean no higher than the control's, most of the variation in hairiness was due to environment (light, water, position in the tray) rather than alleles, so choosing hairy parents did not pass hairiness on. Must connect the null result to environmental rather than genetic variation.

        Zero: a design with no control or no measured dependent variable; treating a single plant's change in hairiness over its life as the result; or predicting that selected plants will grow hairier themselves.

    - slug: u07-w23-q24
      type: short_answer
      topic_code: "7.1"
      source: "Biology 2e §18.1 Understanding Evolution"
      points: 4
      prompt: |
        Conceptual analysis. A plant population in a moist region evolved large leaves because large leaves capture more light. The climate then becomes much drier for many centuries, and large leaves lose water faster than small ones. (a) Predict how mean leaf size in the population changes over the dry period. (b) Explain the mechanism, including where the variation comes from. (c) Explain why the original large leaves were not a mistake even though they are now disadvantageous.
      answer: |
        Mean leaf size falls. Leaf size varies heritably among plants; in the dry climate small-leaved plants lose less water, survive and reproduce more, so alleles for small leaves become more common each generation (directional selection). Large leaves were an adaptation to the moist environment in which they evolved; fitness is relative to the environment of the time, and selection cannot anticipate future change.
      explanation: |
        Four points.

        (a) Predict, 1 pt: mean leaf size decreases over the dry period (a directional statement is required).

        (b) Mechanism, 2 pts: 1 pt for the selective step: plants with smaller leaves lose less water, so they survive and reproduce more than large-leaved plants, and small-leaf alleles increase in frequency across generations; 1 pt for the source of variation: heritable variation in leaf size already exists in the population from mutation and sexual recombination, and the drought selects among it rather than causing it. Answers that say the plants shrink their own leaves or that drought produces the needed mutation earn nothing for this point.

        (c) Why not a mistake, 1 pt: an adaptation is defined relative to the environment in which it evolved; large leaves raised fitness in the moist climate. Selection has no foresight and no goal, so it cannot prepare a population for a future environment. Accept "fitness is environment-specific" or "selection acts only on the present environment".

        Zero: an answer that treats the population as choosing to adapt, or that explains the change without reference to differential reproduction.

    - slug: u07-w23-q25
      type: long_answer
      topic_code: "7.2"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. In 2017 two hurricanes struck islands in the Turks and Caicos. Researchers had measured anole lizards (Anolis scriptus) on the islands a few weeks before the storms and returned six weeks afterwards to measure the survivors. Toe pads let anoles cling to branches; longer hindlimbs help running on the ground. Values are means (simplified from a 2018 study).

        | Measure | Before the hurricanes (n = 71) | Survivors after (n = 93) |
        |---|---|---|
        | Front toe-pad area (mm²) | 7.2 | 8.0 |
        | Hindlimb length (mm) | 26.0 | 24.9 |
        | Body length (mm) | 52.0 | 52.1 |

        In a laboratory test, lizards on a perch exposed to a leaf blower clung with their front toe pads while their hindlimbs were pushed off the perch and acted like sails.

        (a) Identify the independent and dependent variables in the field comparison and state why body length was reported.
        (b) Describe the pattern in the data and identify the mode of selection for each limb trait.
        (c) Explain, using the leaf-blower observation, the mechanism by which the hurricanes produced the differences in the survivors.
        (d) A student concludes that the lizard population has evolved. Explain what additional evidence would be needed to justify that conclusion, and predict what the next generation would look like if that evidence were obtained.
      answer: |
        IV: whether the lizards were measured before or after the hurricanes (exposure to the storms); DV: mean toe-pad area and hindlimb length. Body length serves as a check that survivors were not simply larger lizards overall. Survivors have larger toe pads and shorter hindlimbs; both are directional selection. Lizards with larger pads clung more effectively while those with long hindlimbs were torn off, so the survivors are a non-random subset. The survivors' traits must be heritable to call this evolution: measuring the offspring would be needed; if heritable, the next generation should show larger toe pads and shorter hindlimbs than the pre-storm population.
      explanation: |
        Eight points.

        (a) 2 pts: 1 pt for independent variable = timing relative to the hurricanes (before versus survivors after; accept "exposure to hurricane winds") and dependent variables = mean toe-pad area and mean hindlimb length; 1 pt for the purpose of body length: it shows the survivors were not simply larger or older animals overall, so the limb differences are specific rather than a by-product of size (accept "a control measure" or "to rule out overall size differences").

        (b) 2 pts: 1 pt for describing the pattern with numbers or a correct direction: toe-pad area rose (7.2 to 8.0 mm²) and hindlimb length fell (26.0 to 24.9 mm) while body length was unchanged; 1 pt for naming directional selection for both traits (larger pads favoured, shorter hindlimbs favoured). Calling the hindlimb change stabilizing or disruptive earns nothing for this point.

        (c) 2 pts: 1 pt for the mechanism of survival: in high wind, lizards cling with their toe pads, so individuals with larger pads held on while others were blown off; long hindlimbs caught the wind like sails and increased the chance of being torn from the perch; 1 pt for stating that the survivors are therefore a non-random subset of the pre-storm population, selected among variation that already existed, and that no individual lizard changed its limbs. Answers that say lizards grew larger pads in response to the storm earn nothing for this point.

        (d) 2 pts: 1 pt for identifying the missing evidence: that toe-pad area and hindlimb length are heritable, shown by measuring the offspring of the survivors (or by parent-offspring correlation, or a common-garden rearing) and finding that they resemble their parents; survival of a subset is selection, but evolution requires the change to be passed on; 1 pt for a consistent prediction: if heritable, the offspring generation will have larger mean toe pads and shorter hindlimbs than the pre-storm population (accept a prediction that the difference will be smaller than in the survivors because heritability is less than 1, or that it could reverse if later selection favours running).

        Zero for a part: restating the table without a direction or comparison; attributing the differences to individual lizards changing during the storm; or claiming evolution is proven by the survivor data alone without mention of heritability or the next generation.
