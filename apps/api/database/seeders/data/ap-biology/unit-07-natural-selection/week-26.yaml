week: 26
unit: 7
title: Phylogeny and Speciation
topics: ["7.9", "7.10"]
guide: guides/week-26.md
guide_description: |
  Reading and building phylogenetic trees and cladograms: nodes, sister taxa, outgroups, shared derived
  characters, monophyletic groups and parsimony, with BLAST output as the molecular version; then how branches
  form: the biological species concept, allopatric and sympatric speciation, polyploidy, prezygotic and
  postzygotic barriers, hybrid zones, and gradual versus punctuated rates. Three worked examples (a cladogram
  from a character table, reading a BLAST table, a polyploidy chromosome count), misconceptions, self-check.
flashcards_description: |
  36 cards: tree anatomy and reading rules, cladistics vocabulary, BLAST, the species concept, the two routes
  to speciation, every reproductive barrier, and speciation rates.

flashcards:
  - front: Phylogeny
    back: |
      The evolutionary history of a group: the pattern of ancestry and descent that connects its members. A phylogenetic tree is a hypothesis about that history, revised as new fossil, anatomical and molecular evidence arrives.
    topic_code: "7.9"
  - front: Phylogenetic tree vs cladogram → the difference in what branch length means
    back: |
      Both show branching order. In a cladogram branch lengths carry no information; only the sequence of splits matters. In a phylogenetic tree drawn to scale, branch length represents time or amount of genetic change. Unless a scale is shown, assume lengths mean nothing.
    hint: No scale bar, no meaning.
    topic_code: "7.9"
  - front: Branch point (node) on a tree
    back: |
      A point where one lineage splits into two: the most recent common ancestor of everything beyond it. The deeper (closer to the root) a node, the older the ancestor it represents.
    topic_code: "7.9"
  - front: Root of a tree
    back: |
      The base of a rooted tree, representing the common ancestor of every taxon shown. An unrooted tree shows relationships without saying which lineage is oldest.
    topic_code: "7.9"
  - front: Sister taxa
    back: |
      Two lineages that emerge from the same node and are therefore each other's closest relatives on the tree. Lizard and mouse are sister taxa when they share a node that no other taxon on the tree shares.
    topic_code: "7.9"
  - front: Basal taxon
    back: |
      A lineage that branches off nearest the root and remains unbranched on the tree, such as the lamprey on a vertebrate cladogram. Basal does not mean primitive or ancestral; it has evolved for just as long as the other tips.
    topic_code: "7.9"
  - front: Polytomy
    back: |
      A node from which more than two lineages emerge, drawn when the order of splitting is unresolved. It signals missing information, not a real three-way split.
    topic_code: "7.9"
  - front: Rotating branches at a node → does it change the tree?
    back: |
      No. A node is a hinge: swapping the two lineages that come from it changes the drawing but not a single relationship. Two trees are identical if every taxon shares the same nodes with the same other taxa, whatever the left-to-right order of the tips.
    hint: Read nodes, not the order of names along the top.
    topic_code: "7.9"
  - front: How do you decide which two taxa on a tree are most closely related?
    back: |
      Find their most recent common ancestor: the node where their lines meet. The pair whose shared node is nearest the tips is most closely related. Never judge by how close the names are along the edge of the tree.
    topic_code: "7.9"
  - front: Clade (monophyletic group)
    back: |
      An ancestor plus all of its descendants and nothing else: one node and everything beyond it. Clades are the only groups that reflect phylogeny; you can cut a clade off a tree with one snip.
    hint: One snip, whole group.
    topic_code: "7.9"
  - front: Paraphyletic group
    back: |
      An ancestor and some but not all of its descendants. "Reptiles" excluding birds is paraphyletic because birds descend from the same ancestor. "Fish" excluding tetrapods is another. Such groups are convenient but not clades.
    topic_code: "7.9"
  - front: Polyphyletic group
    back: |
      A group whose members come from different ancestors and are united by a convergent trait, such as "warm-blooded animals" (birds and mammals) or "flying animals". Based on analogy, so phylogenetically meaningless.
    topic_code: "7.9"
  - front: Shared derived character (synapomorphy)
    back: |
      A trait that arose in a lineage's ancestor and is present in its descendants but absent in taxa outside the lineage. It marks a clade: four limbs for tetrapods, the amniotic egg for amniotes, hair for mammals. Cladograms are built from these.
    topic_code: "7.9"
  - front: Shared ancestral character
    back: |
      A trait inherited from an ancestor older than the group being studied, and so present in all its members and in the outgroup too, such as a vertebral column among jawed vertebrates. It cannot distinguish members of the group from one another. Ancestral and derived are relative to the question asked.
    topic_code: "7.9"
  - front: Outgroup
    back: |
      A taxon known to have branched off before the group under study. Traits it has are treated as ancestral; traits present in the ingroup but absent from the outgroup are derived. It is how a tree is rooted and polarised.
    topic_code: "7.9"
  - front: Maximum parsimony
    back: |
      The rule for choosing among possible trees: prefer the tree requiring the fewest evolutionary changes (fewest times a trait must arise or be lost). Based on the idea that the simplest explanation consistent with the evidence is the most probable.
    topic_code: "7.9"
  - front: Homoplasy
    back: |
      A trait shared by two taxa that did not inherit it from a common ancestor: convergence or reversal. Homoplasies (wings in bats and birds) are the noise that parsimony is designed to see through; molecular data help identify them.
    topic_code: "7.9"
  - front: Building a cladogram from a character table → the steps
    back: |
      Choose the outgroup; mark every trait it lacks as derived. Order the derived traits from most widely shared to least. The taxon with no derived traits branches first, then the one with only the most widespread derived trait, and so on; taxa sharing the rarest trait are sister taxa. Check that the tree needs each trait to arise only once.
    topic_code: "7.9"
  - front: Molecular systematics → why DNA often beats anatomy
    back: |
      Sequences give thousands of characters, can be compared across all life, and are less prone to convergence than shapes. Combined with morphology, molecular data have confirmed many classifications and overturned others (whales inside the even-toed ungulates, birds inside the dinosaurs).
    topic_code: "7.9"
  - front: BLAST → what it does (AP Investigation 3)
    back: |
      Compares a query sequence with a database and returns the best-matching sequences ranked by similarity. For each hit it reports percent identity, alignment length and an E-value. The hits' identities let you place an unknown gene or organism on a cladogram.
    topic_code: "7.9"
  - front: E-value in a BLAST result → how to read it
    back: |
      The number of matches this good expected by chance alone in a database of this size. Smaller is better: an E-value of 1e-150 means the match is essentially impossible by chance; a value near 1 means the match is probably noise. Rank hits by lowest E-value and highest percent identity.
    hint: Expectation by chance; you want it tiny.
    topic_code: "7.9"
  - front: Biological species concept
    back: |
      A species is a group of populations whose members can interbreed in nature and produce fertile offspring, and are reproductively isolated from other such groups. Poodles and cocker spaniels are one species; bald eagles and African fish eagles are not, because any hybrid would be infertile.
    topic_code: "7.10"
  - front: Speciation
    back: |
      The splitting of one population into two that can no longer interbreed. It requires gene flow between them to stop and their gene pools to diverge, by selection or drift, until reproductive barriers exist. Each split is a node on the tree.
    topic_code: "7.10"
  - front: Allopatric speciation
    back: |
      Speciation after a geographic barrier (river, mountain, sea, distance) separates a population. With no gene flow, the two halves experience different selection and independent drift until they are reproductively isolated. The northern and Mexican spotted owls are diverging this way.
    hint: Allo- = other place.
    topic_code: "7.10"
  - front: Adaptive radiation
    back: |
      One founding species spreads into many unfilled niches and splits into several species in a short time, each adapted to a different resource. Hawaiian honeycreepers evolved beaks for nectar, seeds and insects from one colonist; island chains are the usual setting.
    topic_code: "7.10"
  - front: Sympatric speciation
    back: |
      Speciation without a geographic barrier, within one area. Happens when a subgroup starts exploiting a different resource or breeding at a different time, or when polyploidy makes individuals reproductively incompatible at once. Lake Victoria's cichlids are the classic animal case.
    hint: Sym- = same place.
    topic_code: "7.10"
  - front: Polyploidy → why it causes instant reproductive isolation
    back: |
      An error in meiosis or mitosis leaves an individual with extra whole sets of chromosomes. Its gametes have the wrong number to pair with those of the parent species, so any hybrid is sterile, while it can breed with others like itself. Over half of plant species trace back to a polyploid event; it is rare in animals.
    topic_code: "7.10"
  - front: Autopolyploid vs allopolyploid
    back: |
      Autopolyploid: extra chromosome sets all from one species (a 2n = 6 plant producing diploid gametes gives a 4n = 12 tetraploid). Allopolyploid: a hybrid between two species whose chromosome sets are doubled so they can pair; wheat, cotton and tobacco arose this way.
    topic_code: "7.10"
  - front: Prezygotic barriers → the list
    back: |
      Barriers that prevent fertilisation: habitat isolation, temporal isolation, behavioural isolation, mechanical isolation and gametic isolation. They stop a zygote forming at all.
    topic_code: "7.10"
  - front: Temporal isolation
    back: |
      Populations breed at different times. Rana aurora breeds from January to March and Rana boylii from March to May, so even where both live they rarely mate.
    topic_code: "7.10"
  - front: Behavioural isolation
    back: |
      Courtship signals differ, so individuals do not recognise each other as mates. Male fireflies of each species flash a distinct pattern; females respond only to their own.
    topic_code: "7.10"
  - front: Habitat, mechanical and gametic isolation → one example each
    back: |
      Habitat: two cricket species on sandy versus loamy soil in the same area rarely meet. Mechanical: damselfly genitalia fit only their own species; flower shapes admit only certain pollinators. Gametic: sperm cannot fertilise the other species' egg because the surface proteins do not match.
    topic_code: "7.10"
  - front: Postzygotic barriers → the two kinds
    back: |
      Act after fertilisation. Hybrid inviability: the embryo fails to develop or dies young. Hybrid sterility: the hybrid lives but cannot reproduce, like a mule, because mismatched chromosome sets cannot pair in meiosis.
    topic_code: "7.10"
  - front: Hybrid zone → the three outcomes
    back: |
      Where two diverging species meet and interbreed. Reinforcement: hybrids are less fit, so selection strengthens barriers and the species keep diverging. Fusion: barriers weaken and the two merge back into one. Stability: fit hybrids keep forming but the species remain distinct.
    topic_code: "7.10"
  - front: Gradualism vs punctuated equilibrium
    back: |
      Gradualism: species diverge by many small changes over a long time, with intermediates in the fossil record. Punctuated equilibrium: a new species forms quickly (often in a small, isolated population), then stays much the same for a long period. Both patterns are seen; rapid change follows environmental shifts.
    topic_code: "7.10"
  - front: Why are rates of speciation and extinction uneven over time?
    back: |
      Rapid environmental change (new islands, climate shifts, mass extinctions that empty niches) speeds speciation by creating isolation and new selection pressures; stable environments favour stasis. Small, isolated populations change fastest because drift and selection act without gene flow.
    topic_code: "7.10"

quiz:
  description: |
    25 questions · about 40 minutes · reading and building cladograms from character tables and BLAST output,
    the species concept, allopatric and sympatric speciation, polyploidy, reproductive barriers and speciation
    rates, with spiral review of molecular clocks, the founder effect, Hardy-Weinberg, meiosis, electrophoresis
    and mutation types. Multiple choice, select-all, true/false and numeric items are graded at once; the
    fill-in-the-blank items are matched automatically; the two short answers and the long answer are graded by
    your teacher against the acceptable-answer summary.
  questions:
    - slug: u07-w26-q01
      type: multiple_choice
      topic_code: "7.9"
      source: "Biology 2e §20.2 Determining Evolutionary Relationships"
      points: 1
      stimulus: |
        The table records whether each of six animals has each of six traits (1 = present, 0 = absent). The lamprey is the outgroup.

        | Trait | Lamprey | Shark | Trout | Frog | Lizard | Mouse |
        |---|---|---|---|---|---|---|
        | Vertebral column | 1 | 1 | 1 | 1 | 1 | 1 |
        | Jaws | 0 | 1 | 1 | 1 | 1 | 1 |
        | Bony skeleton | 0 | 0 | 1 | 1 | 1 | 1 |
        | Four limbs | 0 | 0 | 0 | 1 | 1 | 1 |
        | Amniotic egg | 0 | 0 | 0 | 0 | 1 | 1 |
        | Hair | 0 | 0 | 0 | 0 | 0 | 1 |

        A cladogram built from the table by parsimony has the lamprey branching first, then the shark, then the trout, then the frog, with the lizard and the mouse forming the final pair.
      prompt: |
        Which two taxa are sister taxa on the cladogram, and what justifies the pairing?
      options:
        - "Shark and trout, because both are fish and live in water."
        - "Lizard and mouse, because they share the most recent node: both have the amniotic egg, a derived trait no other taxon in the table has."
        - "Frog and lizard, because they are adjacent in the table."
        - "Lamprey and shark, because both lack a bony skeleton."
      option_explanations:
        - |
          Living in water is an ancestral condition shared with the lamprey, and "fish" is not a clade: the trout shares a bony skeleton with the tetrapods that the shark lacks, so the trout is closer to the mouse than to the shark.
        - |
          Correct. The amniotic egg is a shared derived character present only in lizard and mouse, so they share a node that no other taxon joins. Sister taxa are read from nodes, not from position.
        - |
          Adjacency in a table or along the top of a tree carries no information. The frog lacks the amniotic egg, so it branches before the lizard-mouse node.
        - |
          Lacking a trait is not a shared derived character. Absence of a bony skeleton is the ancestral state; it cannot define a clade.
      answer: 1
      explanation: |
        Clades are defined by shared derived traits, read from the rarest trait outward. Shared absences and shared ancestral traits never group taxa.

    - slug: u07-w26-q02
      type: multiple_choice
      topic_code: "7.9"
      source: "Biology 2e §20.2 Determining Evolutionary Relationships"
      points: 1
      stimulus: |
        The table records whether each of six animals has each of six traits (1 = present, 0 = absent). The lamprey is the outgroup.

        | Trait | Lamprey | Shark | Trout | Frog | Lizard | Mouse |
        |---|---|---|---|---|---|---|
        | Vertebral column | 1 | 1 | 1 | 1 | 1 | 1 |
        | Jaws | 0 | 1 | 1 | 1 | 1 | 1 |
        | Bony skeleton | 0 | 0 | 1 | 1 | 1 | 1 |
        | Four limbs | 0 | 0 | 0 | 1 | 1 | 1 |
        | Amniotic egg | 0 | 0 | 0 | 0 | 1 | 1 |
        | Hair | 0 | 0 | 0 | 0 | 0 | 1 |

        A cladogram built from the table by parsimony has the lamprey branching first, then the shark, then the trout, then the frog, with the lizard and the mouse forming the final pair.
      prompt: |
        Which trait is a shared derived character that defines the clade containing the frog, the lizard and the mouse but no other taxon in the table?
      options:
        - "Vertebral column"
        - "Jaws"
        - "Four limbs"
        - "Hair"
      option_explanations:
        - |
          Every taxon including the outgroup has a vertebral column, so it is a shared ancestral character for this table and defines no subgroup.
        - |
          Jaws are shared by five taxa including the shark and trout, so they define a larger clade than the one asked about.
        - |
          Correct. Four limbs appear in frog, lizard and mouse and in nothing else; the trait arose once in their common ancestor and marks the tetrapod clade.
        - |
          Hair is present only in the mouse, so it is a derived trait of one lineage and does not unite the three taxa.
      answer: 2
      explanation: |
        A synapomorphy marks exactly the clade descended from the ancestor in which it arose. Too widespread and it is ancestral for the group; too narrow and it marks a smaller clade.

    - slug: u07-w26-q03
      type: multiple_choice
      topic_code: "7.9"
      source: "Biology 2e §20.1 Organizing Life on Earth"
      points: 1
      stimulus: |
        The table records whether each of six animals has each of six traits (1 = present, 0 = absent). The lamprey is the outgroup.

        | Trait | Lamprey | Shark | Trout | Frog | Lizard | Mouse |
        |---|---|---|---|---|---|---|
        | Vertebral column | 1 | 1 | 1 | 1 | 1 | 1 |
        | Jaws | 0 | 1 | 1 | 1 | 1 | 1 |
        | Bony skeleton | 0 | 0 | 1 | 1 | 1 | 1 |
        | Four limbs | 0 | 0 | 0 | 1 | 1 | 1 |
        | Amniotic egg | 0 | 0 | 0 | 0 | 1 | 1 |
        | Hair | 0 | 0 | 0 | 0 | 0 | 1 |

        A cladogram built from the table by parsimony has the lamprey branching first, then the shark, then the trout, then the frog, with the lizard and the mouse forming the final pair.
      prompt: |
        Which statement about relatedness is correct according to the cladogram?
      options:
        - "The trout is more closely related to the mouse than to the shark."
        - "The shark is more closely related to the lamprey than to the trout."
        - "The frog is equally related to the trout and to the mouse."
        - "The lamprey is the ancestor of the other five animals."
      option_explanations:
        - |
          Correct. Trout and mouse share the node marked by the bony skeleton; trout and shark share only the older node marked by jaws. The more recent common ancestor makes trout and mouse the closer pair, even though trout and shark both look like fish.
        - |
          The shark shares jaws, a derived trait, with the trout and everything beyond; it shares only the ancestral vertebral column with the lamprey. Shark and trout have the more recent common ancestor.
        - |
          The frog shares the four-limb node with the mouse and only the older bony-skeleton node with the trout, so the frog is more closely related to the mouse.
        - |
          The lamprey is a living tip, the basal taxon; it has evolved for as long as every other tip. Ancestors sit at nodes, not at the ends of branches.
      answer: 0
      explanation: |
        Relatedness is recency of common ancestry, read from nodes. Appearance (two "fish") misleads precisely where a shared trait is ancestral rather than derived.

    - slug: u07-w26-q04
      type: multiple_choice
      topic_code: "7.9"
      source: "Biology 2e §20.2 Determining Evolutionary Relationships"
      points: 1
      stimulus: |
        The table records whether each of six animals has each of six traits (1 = present, 0 = absent). The lamprey is the outgroup.

        | Trait | Lamprey | Shark | Trout | Frog | Lizard | Mouse |
        |---|---|---|---|---|---|---|
        | Vertebral column | 1 | 1 | 1 | 1 | 1 | 1 |
        | Jaws | 0 | 1 | 1 | 1 | 1 | 1 |
        | Bony skeleton | 0 | 0 | 1 | 1 | 1 | 1 |
        | Four limbs | 0 | 0 | 0 | 1 | 1 | 1 |
        | Amniotic egg | 0 | 0 | 0 | 0 | 1 | 1 |
        | Hair | 0 | 0 | 0 | 0 | 0 | 1 |

        A cladogram built from the table by parsimony has the lamprey branching first, then the shark, then the trout, then the frog, with the lizard and the mouse forming the final pair.
      prompt: |
        A student proposes a different tree in which the shark and the trout are sister taxa forming a "fish" clade, with the four-limbed animals as their sister group. Why does parsimony reject this tree in favour of the one described?
      options:
        - "Because fish are not real animals and cannot form a clade."
        - "Because the student's tree requires the bony skeleton to have evolved twice (or to have evolved once and then been lost in the shark), whereas the described tree needs each trait to arise only once."
        - "Because the shark has more traits than the lamprey."
        - "Because sister taxa must always be the two taxa with the most traits."
      option_explanations:
        - |
          Groups are judged by descent, not by whether the organisms are real. The problem with "fish" is that it leaves out the tetrapods, which descend from the same bony ancestor; it is paraphyletic.
        - |
          Correct. In the described tree every derived trait arises exactly once (six changes). Putting the shark beside the trout forces an extra event for the bony skeleton, so the tree is less parsimonious and is rejected.
        - |
          Trait counts do not decide trees; the pattern of which traits are shared does. The shark's two traits are both shared with all the taxa beyond it.
        - |
          Sister taxa are the pair sharing the most recent node, which parsimony identifies by the rarest shared derived trait, not by counting traits.
      answer: 1
      explanation: |
        Parsimony picks the tree with the fewest evolutionary changes. The test for any proposed grouping is to count how many times each trait must arise or vanish.

    - slug: u07-w26-q05
      type: numeric
      topic_code: "7.9"
      source: "Biology 2e §20.1 Organizing Life on Earth"
      points: 1
      stimulus: |
        The table records whether each of six animals has each of six traits (1 = present, 0 = absent). The lamprey is the outgroup.

        | Trait | Lamprey | Shark | Trout | Frog | Lizard | Mouse |
        |---|---|---|---|---|---|---|
        | Vertebral column | 1 | 1 | 1 | 1 | 1 | 1 |
        | Jaws | 0 | 1 | 1 | 1 | 1 | 1 |
        | Bony skeleton | 0 | 0 | 1 | 1 | 1 | 1 |
        | Four limbs | 0 | 0 | 0 | 1 | 1 | 1 |
        | Amniotic egg | 0 | 0 | 0 | 0 | 1 | 1 |
        | Hair | 0 | 0 | 0 | 0 | 0 | 1 |

        A cladogram built from the table by parsimony has the lamprey branching first, then the shark, then the trout, then the frog, with the lizard and the mouse forming the final pair.
      prompt: |
        How many branch points (nodes) does the fully resolved cladogram of these six taxa contain? Give a whole number.
      answer: { value: 5, tolerance: 0 }
      explanation: |
        A fully resolved (bifurcating) tree of n taxa has n − 1 nodes: each node splits one lineage into two, and it takes five splits to go from one root lineage to six tips. Here they are the root (the lamprey splitting from all the rest), then the node each new trait leads to: jaws (shark splits from the bony fishes and tetrapods), bony skeleton (trout splits from the tetrapods), four limbs (frog splits from the amniotes) and amniotic egg (the final lizard-mouse split). Hair marks only the mouse's own branch, so it adds no node. A polytomy would reduce the count, which is why it signals unresolved relationships.

    - slug: u07-w26-q06
      type: multiple_choice
      topic_code: "7.9"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student sequences a 600-nucleotide region of a gene from an unidentified reptile and submits it to BLAST. The top hits are shown.

        | Species in database | Percent identity | E-value | Alignment length (nucleotides) |
        |---|---|---|---|
        | Komodo dragon | 98 | 0.0 | 600 |
        | Green iguana | 93 | 1e-150 | 598 |
        | American alligator | 84 | 1e-90 | 590 |
        | Chicken | 83 | 1e-85 | 585 |
        | Mouse | 76 | 1e-40 | 560 |
      prompt: |
        Which species in the table is the closest relative of the unknown reptile, and which features of the output support the choice?
      options:
        - "The mouse, because it has the smallest E-value exponent (−40)."
        - "The Komodo dragon, because it has the highest percent identity and the lowest E-value over the full alignment length."
        - "The chicken, because birds are reptiles."
        - "The green iguana, because 93% identity is the typical value for members of one species."
      option_explanations:
        - |
          An E-value of 1e-40 is the largest in the table (a less significant match than 1e-150 or 0.0). Smaller E-values are better, and −40 is the smallest exponent in magnitude.
        - |
          Correct. Ninety-eight percent identity over all 600 bases with an E-value of 0.0 is the strongest match possible; the ranking of hits by identity and E-value is the ranking of relatedness.
        - |
          Birds do nest within reptiles on the tree, but the chicken shows only 83% identity; relatedness is read from the data, not from a group name.
        - |
          There is no fixed identity threshold for a species, and 93% is clearly below the 98% of the top hit. The iguana is the second-closest relative in the table.
      answer: 1
      explanation: |
        BLAST ranks matches by how unlikely they are to occur by chance (E-value) and how similar they are (percent identity). The top hit over a full-length alignment is the best estimate of the nearest relative in the database.

    - slug: u07-w26-q07
      type: multiple_choice
      topic_code: "7.9"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student sequences a 600-nucleotide region of a gene from an unidentified reptile and submits it to BLAST. The top hits are shown.

        | Species in database | Percent identity | E-value | Alignment length (nucleotides) |
        |---|---|---|---|
        | Komodo dragon | 98 | 0.0 | 600 |
        | Green iguana | 93 | 1e-150 | 598 |
        | American alligator | 84 | 1e-90 | 590 |
        | Chicken | 83 | 1e-85 | 585 |
        | Mouse | 76 | 1e-40 | 560 |
      prompt: |
        What does the E-value of 1e-90 for the alligator alignment mean?
      options:
        - "The alligator sequence is 90% identical to the query."
        - "About 1 × 10⁻⁹⁰ matches this good would be expected by chance in a database of this size, so the match is essentially certain to reflect real similarity."
        - "There is a 90% probability that the alligator is the closest relative."
        - "The alignment contains 90 mismatched bases."
      option_explanations:
        - |
          Percent identity is a separate column (84% for the alligator). The E-value is not a percentage of anything.
        - |
          Correct. The E-value is the expected number of chance hits of equal or better score; a value of 1e-90 means the similarity is far beyond what random sequences produce, so it is evidence of shared ancestry.
        - |
          E-values are not probabilities that a hit is the closest relative; they measure how unlikely the alignment is to be chance. Relatedness is judged by comparing hits.
        - |
          Mismatches are given by identity and length: 16% of 590 is about 94 mismatches. The E-value is a statistic, not a count.
      answer: 1
      explanation: |
        E for expectation: how many hits this good chance alone would give. Tiny means significant; near 1 means noise. It is the molecular equivalent of a null hypothesis.

    - slug: u07-w26-q08
      type: multiple_choice
      topic_code: "7.9"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student sequences a 600-nucleotide region of a gene from an unidentified reptile and submits it to BLAST. The top hits are shown.

        | Species in database | Percent identity | E-value | Alignment length (nucleotides) |
        |---|---|---|---|
        | Komodo dragon | 98 | 0.0 | 600 |
        | Green iguana | 93 | 1e-150 | 598 |
        | American alligator | 84 | 1e-90 | 590 |
        | Chicken | 83 | 1e-85 | 585 |
        | Mouse | 76 | 1e-40 | 560 |
      prompt: |
        Which placement of the unknown reptile on a cladogram is best supported by the BLAST output?
      options:
        - "In a clade with the Komodo dragon and the green iguana (lizards), with the alligator and chicken as the sister group to that clade, and the mouse branching earlier."
        - "As the sister taxon of the chicken, because birds and reptiles are the same group."
        - "In a clade with the mouse, because mammals and reptiles are both amniotes."
        - "As the outgroup to all five species, because it was not previously in the database."
      option_explanations:
        - |
          Correct. Identities fall into three tiers: lizards (98, 93), then alligator and chicken together (84, 83), then the mouse (76). That nested pattern is a lizard clade, a crocodile-bird sister group, and a mammal outgroup, which matches the known amniote tree.
        - |
          The chicken is only the fourth-best hit. Birds are reptiles in the phylogenetic sense, but the data place the unknown far closer to lizards.
        - |
          The mouse has the lowest identity of all, so it shares the oldest common ancestor with the unknown. Both being amniotes is a shared ancestral feature, not grounds for a close pairing.
