      answer: ["allopatric", "geographic"]
      explanation: |
        Allopatric ("other homeland") speciation begins with a geographic barrier that stops gene flow; drift and different selection pressures then drive the halves apart. Sympatric speciation happens without a barrier, within one area, so "sympatric" is not accepted.

    - slug: u07-w26-q21
      type: fill_blank
      topic_code: "6.7"
      source: "Biology 2e §14.6 DNA Repair"
      points: 1
      prompt: |
        Review. A substitution that converts a codon for an amino acid into a stop codon, producing a truncated protein, is called a ____ mutation.
      answer: ["nonsense"]
      explanation: |
        A nonsense mutation ends translation early. It usually destroys the protein's function, so such alleles are strongly selected against and rarely persist in populations; by contrast silent mutations accumulate freely and are what molecular clocks count. "Missense" changes one amino acid to another and "frameshift" needs an insertion or deletion, so neither is accepted.

    - slug: u07-w26-q22
      type: numeric
      topic_code: "7.10"
      source: "Biology 2e §18.2 Formation of New Species"
      points: 1
      prompt: |
        A plant species with 2n = 6 chromosomes hybridises with a species with 2n = 10. The sterile hybrid later undergoes a doubling of its whole chromosome set, producing a fertile allopolyploid. How many chromosomes does each body cell of the fertile allopolyploid contain? Give a whole number.
      answer: { value: 16, tolerance: 0 }
      explanation: |
        The hybrid receives a haploid set from each parent: 3 + 5 = 8 chromosomes, with no homologous partners, so it cannot pair them in meiosis and is sterile. Doubling gives 16 chromosomes, every one now with a partner, so meiosis works and the plant is fertile. It cannot breed with either parent species (16 against 6 or 10 would give unpairable hybrids), so it is a new species in one step; wheat and cotton arose this way.

    - slug: u07-w26-q23
      type: short_answer
      topic_code: "7.9"
      source: "Biology 2e §20.2 Determining Evolutionary Relationships"
      points: 4
      prompt: |
        Visual representation. Four plants were scored for three traits. The moss is the outgroup.

        | Trait | Moss | Fern | Pine | Rose |
        |---|---|---|---|---|
        | Vascular tissue | 0 | 1 | 1 | 1 |
        | Seeds | 0 | 0 | 1 | 1 |
        | Flowers | 0 | 0 | 0 | 1 |

        (a) Describe in words the cladogram that parsimony supports, naming the order of branching and the sister taxa. (b) Identify the shared derived character that defines the clade containing the pine and the rose. (c) Explain why "non-flowering plants" (moss, fern and pine) does not form a clade, and name the kind of group it is.
      answer: |
        Moss branches first, then fern, then pine and rose as sister taxa (a nested series: vascular tissue arises after the moss split, seeds after the fern split, flowers on the rose lineage only). Seeds are the shared derived character uniting pine and rose. Non-flowering plants share only the absence of a trait; the group leaves out the rose, which descends from the same ancestor as the pine, so it is paraphyletic (an ancestor and some but not all descendants).
      explanation: |
        Four points.

        (a) 2 pts: 1 pt for the correct branching order: moss (outgroup) first, then fern, then the pine-rose split last; 1 pt for naming pine and rose as sister taxa, or for stating that each trait arises once along the sequence (vascular tissue before the fern branch, seeds before the pine-rose node, flowers on the rose branch). A tree placing the fern with the pine or the moss with the fern earns 1 pt at most.

        (b) 1 pt: seeds (present in pine and rose, absent in fern and moss). Naming vascular tissue (too widespread, shared with the fern) or flowers (rose only) earns nothing.

        (c) 1 pt: the group is defined by lacking flowers, and absence of a derived trait does not indicate shared ancestry; moreover the rose descends from the same seed-plant ancestor as the pine, so the group omits one descendant of that ancestor and is paraphyletic. Accept "it includes the ancestor but not all its descendants". Calling it polyphyletic earns nothing.

        Zero: reading the table left to right as the tree without reference to shared derived traits, or defining clades by shared absences.

    - slug: u07-w26-q24
      type: short_answer
      topic_code: "7.10"
      source: "Biology 2e §18.2 Formation of New Species"
      points: 4
      prompt: |
        Analyze data. Two frog species share the same ponds. Researchers recorded the weeks in which breeding calls were heard and the outcome of forced laboratory crosses.

        | Species | Breeding period | Lab crosses with the other species: eggs fertilised | Lab crosses: tadpoles surviving to adulthood |
        |---|---|---|---|
        | Rana aurora | January to March | 85% | 2% |
        | Rana boylii | March to May | 85% | 2% |

        (a) Identify the reproductive barrier that keeps the two species separate in nature and classify it as prezygotic or postzygotic. (b) Use the laboratory data to identify a second barrier and classify it. (c) Explain why both barriers together mean the two populations are separate species under the biological species concept, and predict what would happen to gene flow between them if a warming climate shifted both breeding periods to overlap completely.
      answer: |
        Temporal isolation (different breeding months), prezygotic. The lab crosses show hybrid inviability: fertilisation works but almost no hybrids survive, a postzygotic barrier. Members of the two groups do not interbreed in nature and cannot produce viable offspring when forced to, so they are reproductively isolated and therefore separate species. If breeding periods overlapped completely, matings between species would occur but the hybrids would still die, so gene flow would remain near zero, and selection against wasted matings would favour stronger behavioural barriers (reinforcement).
      explanation: |
        Four points.

        (a) 1 pt: temporal (seasonal) isolation, prezygotic: the one-month overlap means the species rarely mate.

        (b) 1 pt: hybrid inviability, postzygotic: 85% of eggs are fertilised, so gametes are compatible, but only 2% of hybrids reach adulthood. Calling it hybrid sterility (no data on hybrid fertility) earns nothing; "gametic isolation" contradicts the 85% fertilisation.

        (c) 2 pts: 1 pt for the species argument: the biological species concept defines species by reproductive isolation, and these populations neither interbreed in nature nor produce viable offspring when they do, so they are distinct species; 1 pt for the prediction with justification: complete overlap would remove the temporal barrier, but the postzygotic barrier would still prevent almost all gene flow (hybrids die before reproducing), and because hybrid matings waste gametes, selection would favour mate recognition or other prezygotic barriers (reinforcement). Accept a prediction that a small amount of gene flow could occur through the 2% survivors, provided it notes that the postzygotic barrier keeps it very low.

        Zero: answers that treat the two as one species because they can be crossed in the laboratory, or that predict the species will merge immediately if breeding seasons overlap.

    - slug: u07-w26-q25
      type: long_answer
      topic_code: "7.10"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. A small island was colonised by a single species of lizard about 10,000 years ago, according to a molecular clock. Today the island has two forms. Researchers measured limb length and perch use, then tested mate choice in the laboratory by giving a female a choice between a male of her own form and a male of the other form, and finally crossed the forms.

        | Measure | Ground form (n = 60) | Tree form (n = 60) |
        |---|---|---|
        | Mean hindlimb length (mm) | 31.2 | 24.5 |
        | Standard error (mm) | 0.4 | 0.4 |
        | Perches on the ground / on narrow branches (%) | 92 / 8 | 11 / 89 |
        | Females choosing a male of their own form (%) | 88 | 85 |
        | Crosses between forms: eggs hatching (%) | 90 | 90 |
        | Hybrid offspring surviving to breed (%) | 70 | 70 |

        (a) Describe the pattern in limb length and perch use and state, using the standard errors, whether the limb-length difference is likely to be real.
        (b) Explain how natural selection could have produced the two limb forms from one founding population on an island with both habitats, naming the mode of selection.
        (c) Using the mate-choice and cross data, identify which reproductive barriers are present, classify each, and judge how complete speciation is.
        (d) The fossil record on the island shows no intermediate limb lengths in the deposits older than 2,000 years, then both forms appearing within a few centuries. State which model of the rate of speciation this pattern fits better, and explain why the island setting makes that model plausible.
      answer: |
        The ground form has longer hindlimbs (31.2 vs 24.5 mm) and perches on the ground; the tree form has shorter limbs and perches on branches. Intervals of ±2 SE (30.4–32.0 and 23.7–25.3) do not overlap, so the difference is real. Long limbs favour running on the ground, short limbs favour gripping narrow branches, and intermediates do neither well, so disruptive selection drove the founding population into two forms. Mate choice within forms (85–88%) is a prezygotic (behavioural) barrier; hybrids hatch and 70% survive to breed, so the postzygotic barrier is weak. Speciation is incomplete: gene flow is reduced but possible. The abrupt appearance of both forms after a long period without them fits punctuated equilibrium; small isolated island populations can change rapidly under new selection and drift.
      explanation: |
        Eight points.

        (a) 2 pts: 1 pt for the pattern: ground form has longer hindlimbs (31.2 mm versus 24.5 mm) and mostly uses the ground (92%), tree form has shorter limbs and mostly uses narrow branches (89%); 1 pt for the standard-error reasoning: ±2 SE gives 30.4–32.0 mm and 23.7–25.3 mm, which do not overlap, so the difference is unlikely to be due to sampling chance.

        (b) 2 pts: 1 pt for the mechanism: heritable variation in limb length existed in the founders; longer limbs give faster running on open ground, shorter limbs give better grip on narrow branches, so lizards at each extreme survived and reproduced better in their habitat while intermediates were poorer at both; 1 pt for naming disruptive (diversifying) selection. Directional selection in two separate populations earns the mechanism point only if the answer explains that both forms arose from one founding population on the same island.

        (c) 2 pts: 1 pt for identifying behavioural (mate-choice) isolation as a prezygotic barrier that is strong but incomplete (85–88% own-form choice, so 12–15% of matings cross forms); 1 pt for using the cross data: eggs hatch (90%) and 70% of hybrids breed, so postzygotic isolation is weak or absent, and the conclusion that speciation is in progress but incomplete because gene flow between forms is reduced rather than eliminated. Accept a mention that reinforcement could strengthen the barrier if hybrids are at a disadvantage in either habitat.

        (d) 2 pts: 1 pt for punctuated equilibrium: a long period of stasis followed by rapid change (both forms appearing within centuries) and then stability; 1 pt for why the island makes it plausible: a small, isolated population with no gene flow from the mainland, facing two new habitats, can respond quickly to strong selection and drift, and a founder population with limited variation can shift fast once selection begins. Accept a note that the fossil record's resolution may hide short-lived intermediates, provided the model is still identified.

        Zero for a part: describing lizards as growing longer or shorter limbs to suit their perch; calling mate choice a postzygotic barrier; or claiming speciation is complete because the forms look different.
