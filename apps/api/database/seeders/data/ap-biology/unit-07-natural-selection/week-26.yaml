        - "Genetic drift, because the lake is small and the fish are few."
      option_explanations:
        - |
          Different depths within one lake are not a geographic barrier; the fish can and sometimes do meet. The isolation is ecological and behavioural, and it is incomplete, so speciation is not finished.
        - |
          Correct. One founder population, no barrier, divergent selection on jaw shape for two diets, and mating preference within groups: the ingredients of sympatric speciation, caught in progress.
        - |
          The lake was colonised once, by a single population; the two groups have arisen from it within the lake, which is why the case is studied.
        - |
