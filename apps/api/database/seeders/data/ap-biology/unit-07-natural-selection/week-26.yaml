      answer: [0, 2, 3]
      explanation: |
        The dividing line is the zygote. Anything that stops mating or fertilisation (habitat, time, behaviour, mechanics, gametes) is prezygotic; inviability and sterility of the hybrid are postzygotic.

    - slug: u07-w26-q17
      type: multi_select
      topic_code: "7.9"
      source: "Biology 2e §20.1 Organizing Life on Earth"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about reading a phylogenetic tree are correct? Select all that apply.
      options:
        - "Rotating the two branches at any node does not change the relationships the tree shows."
        - "Two taxa drawn next to each other along the top of the tree are always the most closely related."
        - "A node represents the most recent common ancestor of the lineages beyond it."
        - "Unless a scale is given, the length of a branch does not indicate how much time has passed."
        - "The taxon drawn at the far left is the ancestor of the taxa to its right."
      option_explanations:
        - |
          Correct. A node is a hinge; swapping its branches changes the picture, not a single ancestor-descendant relationship.
        - |
          Adjacency is an artefact of drawing. After rotating a node, a taxon's neighbour changes while its relatives do not; relatedness is read from shared nodes.
        - |
          Correct. Each branch point is a lineage splitting; everything beyond it descends from the ancestor at that point.
        - |
          Correct. In a cladogram only branching order carries information; branch length means time or change only when the tree is explicitly drawn to scale.
        - |
          Every tip is a living (or terminal) taxon that has evolved for the same length of time. Ancestors are at the nodes, never at the tips; a basal taxon is not an ancestor.
      answer: [0, 2, 3]
      explanation: |
        Three habits prevent most tree-reading errors: find nodes rather than neighbours, remember that tips are not ancestors, and ignore branch length unless there is a scale.

    - slug: u07-w26-q18
      type: true_false
      topic_code: "7.9"
      source: "Biology 2e §20.1 Organizing Life on Earth"
      points: 1
      prompt: |
        True or false: On a cladogram, a taxon connected to the rest of the tree by a longer branch has been evolving for a longer time than a taxon with a short branch.
      answer: false
      explanation: |
        False. All living tips have been evolving for the same time, since the root. In a cladogram branch lengths carry no information at all; only the branching order does. In a phylogram drawn to scale, length represents the amount of genetic change (or time, if the tree is calibrated), which is stated on the figure. A long branch on a scaled tree means more change in that lineage, not a longer existence.

    - slug: u07-w26-q19
      type: true_false
      topic_code: "5.2"
      source: "Biology 2e §11.1 The Process of Meiosis"
      points: 1
      prompt: |
        Review. True or false: In an organism with three pairs of homologous chromosomes, independent assortment at metaphase I alone can produce eight genetically different kinds of gametes.
      answer: true
      explanation: |
        True. Each pair can orient in two ways, independently of the others, so 2³ = 8 combinations of maternal and paternal chromosomes are possible. Crossing over multiplies the number further. This shuffling is the source of the combinations that random mating draws from, and the variation that allows populations to diverge once gene flow between them stops.

    - slug: u07-w26-q20
      type: fill_blank
