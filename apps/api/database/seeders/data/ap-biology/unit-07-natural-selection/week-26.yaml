    - slug: u07-w26-q11
      type: multiple_choice
      topic_code: "7.8"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. A researcher wants to build a tree of ten closely related bird species that diverged within the last million years. Which kind of sequence would be the most informative, and why?
      options:
        - "Ribosomal RNA genes, because they are present in every organism."
        - "A rapidly evolving region such as the mitochondrial control region, because a slow gene would have accumulated too few differences in a million years to separate the species."
        - "The cytochrome c gene, because it gives the correct answer for humans and yeast."
        - "Any gene, because all genes evolve at the same rate."
      option_explanations:
        - |
          rRNA is universal but changes so slowly that ten species a million years apart might show no differences at all; it is the right choice for deep splits, not shallow ones.
        - |
          Correct. The gene must tick fast enough to register differences over the timescale in question. Fast-evolving regions resolve recent splits; slow ones resolve ancient ones.
        - |
          Cytochrome c works for deep divergences because it changes slowly; between birds that diverged recently it would be nearly identical and uninformative.
        - |
          Genes evolve at very different rates depending on how constrained their function is; that difference is exactly what lets you choose a clock for a given depth.
      answer: 1
      explanation: |
        Match the clock to the question. Deep tree, slow gene; recent radiation, fast gene. A clock that has not ticked cannot tell time.

    - slug: u07-w26-q12
      type: multiple_choice
      topic_code: "7.4"
      source: "Biology 2e §18.2 Formation of New Species"
      points: 1
      prompt: |
        Review. A storm carries a dozen finches from a mainland population to a remote island. Which evolutionary force acts on the new island population first, before any selection has occurred, and what is its immediate effect?
      options:
        - "Natural selection, which immediately favours the finches best suited to the island."
        - "The founder effect, a form of genetic drift: the dozen colonists carry an unrepresentative sample of the mainland gene pool, so allele frequencies differ from the start."
        - "Gene flow, which continues between the island and the mainland."
        - "Mutation, which supplies the new alleles the island requires."
      option_explanations:
        - |
          Selection will act, but it needs generations of differential reproduction. The gene pool is already different the moment the colonists land, which is drift, not selection.
        - |
          Correct. Twelve birds cannot carry every allele at mainland frequencies; rare alleles may be absent or over-represented. This chance difference is the founder effect and it starts allopatric divergence.
        - |
          A remote island reached by one storm has essentially no gene flow with the mainland; the absence of gene flow is what allows the island population to diverge.
        - |
          Mutation does not respond to need and is far too rare to change the new population quickly; the immediate change comes from who happened to arrive.
      answer: 1
      explanation: |
        Allopatric speciation often begins with a founder event: isolation plus a small, non-random starting gene pool. Adaptive radiation on islands grows from exactly this.

    - slug: u07-w26-q13
      type: multiple_choice
      topic_code: "5.1"
      source: "Biology 2e §11.1 The Process of Meiosis"
      points: 1
      prompt: |
        Review. A polyploid plant can arise when a parent produces diploid gametes. Which meiotic failure produces a gamete with the full diploid chromosome number?
      options:
        - "Failure of DNA replication in S phase before meiosis."
        - "Failure of homologous chromosomes or sister chromatids to separate (nondisjunction) affecting all chromosomes, so one product receives every chromosome."
        - "Crossing over between non-sister chromatids in prophase I."
        - "Independent assortment of homologous pairs at metaphase I."
      option_explanations:
        - |
          Without replication there would be fewer chromatids, not more; replication failure would halt the cycle rather than double the gamete's chromosome number.
        - |
          Correct. If the spindle fails and no chromosomes are pulled apart, a single product keeps the whole set. Such unreduced gametes, fusing with each other or with normal gametes, give polyploid or triploid offspring.
        - |
          Crossing over exchanges segments between homologues and changes allele combinations; it does not change the number of chromosomes in a gamete.
        - |
          Independent assortment distributes one member of each pair to each gamete; it shuffles maternal and paternal chromosomes but leaves the count at n.
      answer: 1
      explanation: |
        Polyploidy is a meiosis story: an unreduced gamete carries 2n, and the chromosome arithmetic of the offspring decides whether it is fertile (even sets) or sterile (odd sets).

    - slug: u07-w26-q14
      type: multiple_choice
      topic_code: "6.8"
      source: "Biology 2e §17.1 Biotechnology"
      points: 1
      prompt: |
        Review. Before sequencing, a student checks a PCR product by gel electrophoresis. Which statement correctly describes what the gel shows and why?
      options:
        - "DNA migrates toward the negative electrode, with larger fragments moving farther."
        - "DNA, being negatively charged, migrates toward the positive electrode, and smaller fragments move farther through the gel's pores in a given time."
        - "DNA fragments separate by their base sequence, with A-T-rich fragments moving farther."
        - "The gel amplifies the DNA so that a single band becomes visible."
      option_explanations:
        - |
          The phosphate backbone makes DNA negative, so it moves toward the positive electrode; and large fragments are slowed by the gel, so they travel less far, not more.
        - |
          Correct. Electrophoresis separates by size: a single sharp band of the expected length confirms that the PCR amplified one product, which can then be sequenced and compared with other species by BLAST.
        - |
          Standard gels separate by length, not by composition; two fragments of the same size run together whatever their sequence.
        - |
          Amplification is PCR's job; a gel only separates and displays what is already there. Bands are visible because of a dye that binds DNA.
      answer: 1
      explanation: |
        The molecular data behind every cladogram pass through PCR, a gel and a sequencer. Knowing what each step does is part of reading the tree critically.

    - slug: u07-w26-q15
      type: multiple_choice
      topic_code: "7.5"
      source: "Biology 2e §19.1 Population Evolution"
      points: 1
      prompt: |
        Review. On an island, 500 lizards are counted and 20 of them show a recessive colour pattern. Assuming Hardy-Weinberg equilibrium, what is the frequency of the dominant allele?
      options:
        - "0.04"
        - "0.20"
        - "0.80"
        - "0.96"
      option_explanations:
        - |
          0.04 is q², the fraction of recessive homozygotes (20/500). It is the starting point, not the dominant allele frequency.
        - |
          0.20 is q, the recessive allele frequency (√0.04). The question asks for p.
        - |
          Correct. q² = 20/500 = 0.04, so q = 0.2 and p = 1 − q = 0.8. The heterozygotes would be 2pq = 0.32, or about 160 lizards.
        - |
          0.96 is 1 − q², the fraction of lizards showing the dominant phenotype, which includes both homozygotes and heterozygotes; it is not an allele frequency.
      answer: 2
      explanation: |
        Recessive phenotype gives q²; square root gives q; subtract from 1 for p. Island populations founded by few colonists are the ones most likely to violate the equilibrium assumption, so state it when you use it.

    - slug: u07-w26-q16
      type: multi_select
      topic_code: "7.10"
      source: "Biology 2e §18.2 Formation of New Species"
      points: 2
      partial_credit: true
      prompt: |
        Select every example that is a prezygotic reproductive barrier.
      options:
        - "Two frog species in the same ponds breed in different months."
        - "A mule, the offspring of a horse and a donkey, is sterile."
        - "Female fireflies respond only to the flash pattern of males of their own species."
        - "Sperm of one sea-urchin species cannot bind the egg surface proteins of another."
        - "Hybrid embryos between two species of plant die before germinating."
      option_explanations:
        - |
          Correct. Temporal isolation prevents mating from happening at all, so no zygote is formed; it is prezygotic.
        - |
          Hybrid sterility is a postzygotic barrier: fertilisation succeeded and a hybrid developed, but it cannot reproduce.
        - |
          Correct. Behavioural isolation through courtship signals stops mating between species before fertilisation.
        - |
          Correct. Gametic isolation blocks fertilisation itself, which is the last prezygotic step.
        - |
