    - slug: u07-w26-q09
      type: multiple_choice
      topic_code: "7.10"
      source: "Biology 2e §18.2 Formation of New Species"
      points: 1
      prompt: |
        A diploid plant with 2n = 6 produces, through a meiotic error, gametes that are diploid (n = 6 instead of 3). Two such gametes fuse to form a tetraploid (4n = 12) individual that is fertile when crossed with other tetraploids but produces sterile offspring when crossed with the original diploids. Why is this considered speciation, and of what kind?
      options:
        - "Allopatric speciation, because the tetraploid is geographically isolated from its parents."
        - "Sympatric speciation, because the tetraploid is reproductively isolated from the parent species in the same place: tetraploid-diploid hybrids are triploid and cannot pair chromosomes in meiosis."
        - "It is not speciation, because the tetraploid plants look the same as the diploids."
        - "It is not speciation, because speciation requires millions of years."
      option_explanations:
        - |
          No barrier separates the plants; they grow side by side. Geography has nothing to do with this isolation.
        - |
          Correct. Reproductive isolation is the criterion of the biological species concept, and the triploid hybrids' sterility provides it in a single generation, without any geographic separation. This is autopolyploidy, common in plants.
        - |
          Appearance is not the criterion; interbreeding is. Two populations that cannot produce fertile offspring together are separate species however similar they look.
        - |
          Speciation usually takes many generations, but polyploidy is the exception: the barrier appears in one step. More than half of plant species have a polyploid event in their ancestry.
      answer: 1
      explanation: |
        Polyploidy is instant sympatric speciation. Count the chromosome sets in the hybrid: an odd number cannot pair in meiosis, so the hybrid is sterile and the barrier is complete.

    - slug: u07-w26-q10
