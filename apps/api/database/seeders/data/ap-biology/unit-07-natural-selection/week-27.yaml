week: 27
unit: 7
title: Variation in Populations and the Origins of Life
topics: ["7.11", "7.12"]
guide: guides/week-27.md
guide_description: |
  Why a population's genetic variation decides whether it can survive a change, with heterozygosity data,
  bottlenecked species and monocultures as the evidence; then the question natural selection does not answer:
  the timeline of life on Earth, the Miller-Urey experiment and hydrothermal-vent chemistry, the steps to the
  first cell, the RNA world, and the endosymbiotic origin of mitochondria and chloroplasts. Three worked examples
  (a heterozygosity-and-survival table, the Earth timeline with arithmetic, the RNA-first argument), a unit
  synthesis, misconceptions, self-check.
flashcards_description: |
  34 cards: genetic diversity and resilience, heterozygosity, bottlenecks and monocultures, the timeline of
  early Earth, abiogenesis hypotheses and evidence, the RNA world, and endosymbiosis as the origin of eukaryotes.

flashcards:
  - front: Why does genetic variation matter to a population's survival?
    back: |
      Selection can only favour phenotypes that exist. A population with many alleles is likely to contain some individuals that survive a new pathogen, climate or predator, and it can evolve; a population with few alleles may have no such individuals and goes extinct when conditions change.
    hint: Variation is the option list selection chooses from.
    topic_code: "7.11"
  - front: A population with little genetic variation faces a changed environment → the likely outcome
    back: |
      Most individuals respond alike, so a stress that harms one harms all; with few favourable variants to select, the population cannot adapt and numbers fall. Low variation is why bottlenecked species and crop monocultures are at high risk from disease.
    topic_code: "7.11"
  - front: Heterozygosity → what it measures and how it is read
    back: |
      The proportion of loci at which an average individual carries two different alleles (or the proportion of individuals heterozygous at a locus). Higher heterozygosity means more alleles are segregating in the population. Under Hardy-Weinberg it equals 2pq at a two-allele locus, and it falls each generation in a small population.
    topic_code: "7.11"
  - front: Cheetahs → what their low variation shows
    back: |
      Cheetahs are so genetically uniform that skin grafts between unrelated animals are accepted and many males produce abnormal sperm. A severe bottleneck long ago left the species vulnerable: a disease that kills one cheetah is likely to kill them all.
    topic_code: "7.11"
  - front: Monoculture → why a single variety is a risk
    back: |
      A crop grown from one genetically uniform variety has no variation for selection to act on, so one pathogen can destroy the whole crop. The Irish potato famine (one potato clone, one blight) and the threat of fungal disease to the clonal Cavendish banana are the examples.
    topic_code: "7.11"
  - front: Why conservation programs move individuals between isolated populations
    back: |
      To add alleles the receiving population has lost and to raise heterozygosity, reversing inbreeding depression and restoring the variation that lets the population respond to future change. It is deliberate gene flow.
    topic_code: "7.11"
  - front: Phenotypic variation vs genetic variation → which one selection needs
    back: |
      Selection acts on phenotypes but changes a population only through the genetic part of the variation. A population whose phenotypic differences are all environmental cannot evolve, however varied it looks. Heritable variation is what resilience depends on.
    topic_code: "7.11"
  - front: Seed banks and captive breeding → what they are protecting
    back: |
      Alleles. A seed bank stores the genetic diversity of crop relatives so that resistance genes lost from fields can be bred back in; captive breeding programs track pedigrees to keep as many founder alleles as possible and avoid inbreeding.
    topic_code: "7.11"
  - front: Why do diverse immune genes help a population resist a new pathogen?
    back: |
      Immune-recognition genes (such as the MHC) have many alleles, each recognising different pathogen fragments. A population with many alleles is likely to contain individuals that recognise a new pathogen; a uniform population may contain none. Pathogens are a major reason variation itself is favoured.
    topic_code: "7.11"
  - front: Does a bottlenecked species that recovers its numbers recover its variation?
    back: |
      No. Numbers can rebound in decades, but alleles lost in the bottleneck return only by mutation (very slow) or by migration from another population. The recovered population stays genetically uniform and vulnerable, as with elephant seals and cheetahs.
    topic_code: "7.11"
  - front: Which populations are most likely to persist through environmental change?
    back: |
      Those with the most genetic diversity, especially in traits relevant to the change, and those connected by gene flow to other populations that can resupply alleles. Large, variable, connected populations evolve; small, uniform, isolated ones go extinct.
    topic_code: "7.11"
  - front: Age of the Earth and the first evidence of life → the numbers
    back: |
      Earth formed about 4.6 billion years ago. Rocks about 3.8 billion years old carry possible chemical traces of life, and fossil microbial mats (stromatolites) date from about 3.5 billion years ago. Life was prokaryotic for more than a billion years before eukaryotes appeared.
    hint: 4.6, 3.8, 3.5.
    topic_code: "7.12"
  - front: Stromatolites
    back: |
      Layered rocks built by microbial mats that trap sediment and precipitate minerals. Fossil stromatolites 3.5 billion years old are the oldest widely accepted fossils of life, and living ones still form in a few places today, which shows how the fossils were made.
    topic_code: "7.12"
  - front: Oxygenation of the atmosphere → who, when and the consequence
    back: |
      Ancestral cyanobacteria, photosynthesising by splitting water, released oxygen as waste; it began to accumulate in the atmosphere about 2.2 to 2.4 billion years ago. Oxygen was toxic to most existing life, drove the evolution of aerobic respiration, and later formed the ozone layer that made land habitable.
    topic_code: "7.12"
  - front: First eukaryotes → when, and what had to come first
    back: |
      Fossils of eukaryotic cells appear about 2.1 billion years ago, after oxygen had begun to rise. The timing fits endosymbiosis: an aerobic alpha-proteobacterium had to exist before it could become a mitochondrion.
    topic_code: "7.12"
  - front: Primary endosymbiosis of chloroplasts → when and which partners
    back: |
      About 1 to 1.5 billion years ago an aerobic, heterotrophic eukaryote (already carrying mitochondria) engulfed a cyanobacterium and kept it. The cyanobacterium became the chloroplast, which is why chloroplasts have thylakoids, circular DNA and bacterial ribosomes.
    topic_code: "7.12"
  - front: Oparin-Haldane hypothesis
    back: |
      Early Earth's atmosphere had little oxygen and much reducing gas; energy from lightning and ultraviolet light could drive the synthesis of organic molecules from inorganic ones, which accumulated in the oceans as a "primordial soup" from which life assembled.
    topic_code: "7.12"
  - front: Miller-Urey experiment → set-up and result
    back: |
      In 1953 Miller and Urey circulated water vapour with methane, ammonia and hydrogen past electric sparks for a week. The water turned brown and contained amino acids and other organic molecules. It showed that the building blocks of life can form abiotically under conditions thought to resemble early Earth.
    topic_code: "7.12"
  - front: What Miller-Urey did and did not show
    back: |
      Did: organic monomers form spontaneously from inorganic gases given energy. Did not: make polymers, cells or anything alive, and the exact gas mixture of early Earth is still debated. Later versions with other mixtures and with volcanic or vent conditions also produce organic molecules.
    hint: Monomers, not life.
    topic_code: "7.12"
  - front: Hydrothermal vent hypothesis
    back: |
      Deep-sea vents supply heat, hydrogen, sulfides and metal catalysts, with steep chemical gradients across mineral pores. Organic synthesis and the first energy-harvesting reactions may have happened there, shielded from ultraviolet light, rather than in surface pools.
    topic_code: "7.12"
  - front: The four stages hypothesised for the origin of life
    back: |
      (1) Abiotic synthesis of small organic monomers; (2) joining of monomers into polymers, possibly on clay or mineral surfaces; (3) self-replicating molecules that could be inherited; (4) enclosure within membranes to form protocells, so that the products of replication stayed with the replicator. Natural selection begins at stage 3.
    topic_code: "7.12"
  - front: Protocell → why membranes self-assemble
    back: |
      Amphipathic lipids in water spontaneously form bilayer vesicles, with no enzymes needed. A vesicle around a replicating molecule keeps its products together, so a better replicator benefits itself: the first unit on which selection could act.
    topic_code: "7.12"
  - front: RNA world hypothesis → the claim
    back: |
      The first self-replicating, information-carrying molecules were RNA, not DNA or protein. RNA can both store a sequence and fold into catalytic shapes, so a single kind of molecule could copy itself. DNA (more stable storage) and proteins (better catalysts) took over later.
    topic_code: "7.12"
  - front: Ribozyme
    back: |
      An RNA molecule that catalyses a reaction. Ribozymes exist today: the peptidyl-transferase centre of the ribosome, which joins amino acids, is RNA, and self-splicing introns cut themselves out. They show that RNA can do the job proteins now do.
    topic_code: "7.12"
  - front: Why RNA before DNA → three arguments
    back: |
      RNA can catalyse as well as store information, so it could have replicated itself; the modern cell still uses RNA at its core (ribosomal RNA makes peptide bonds, and RNA primers start DNA replication); and ribonucleotides are the precursors from which cells make deoxyribonucleotides, suggesting RNA came first.
    topic_code: "7.12"
  - front: When does natural selection start to apply in the origin of life?
    back: |
      As soon as there are molecules that replicate with heritable variation. Copies that replicate faster or more accurately become more common; enclosed in protocells, variants that keep their products reproduce better. Evolution does not explain how the first replicator formed, but it explains everything after.
    topic_code: "7.12"
  - front: Last universal common ancestor (LUCA)
    back: |
      The most recent population from which all living things descend: already a cell with DNA, the genetic code, ribosomes and ATP, which is why those features are universal. It was not the first life, only the last ancestor shared by every surviving lineage.
    topic_code: "7.12"
  - front: Mitochondria and chloroplasts → the evidence that they began as free-living prokaryotes
    back: |
      Each has two membranes (host vacuole outside, bacterial membrane inside); its own circular chromosome; ribosomes of the bacterial type, inhibited by antibiotics that spare cytosolic ribosomes; division by binary fission on its own schedule; a size and shape like bacteria; and gene sequences closest to alpha-proteobacteria (mitochondria) or cyanobacteria (chloroplasts).
    hint: Two membranes, own circular DNA, bacterial ribosomes, binary fission.
    topic_code: "7.12"
  - front: Where did the genes of the endosymbiont go?
    back: |
      Most were transferred to the host nucleus over time; the organelle keeps only a small genome and imports the proteins it needs. That is why mitochondria cannot live outside the cell today although their ancestors could.
    topic_code: "7.12"
  - front: Secondary endosymbiosis → how to recognise it from the membrane count
    back: |
      A eukaryote engulfed another eukaryote that already had a chloroplast. The resulting plastid has three or four membranes and sometimes a remnant nucleus (nucleomorph) between them. Chlorarachniophytes and many algae got their photosynthesis this way.
    topic_code: "7.12"
  - front: Lynn Margulis → her contribution
    back: |
      In the 1960s she revived and argued the endosymbiotic theory, that mitochondria and chloroplasts descend from engulfed bacteria, against strong resistance. Molecular sequencing later confirmed it, and it is now the accepted account of the eukaryotic cell's origin.
    topic_code: "7.12"
  - front: Nucleus-first vs mitochondrion-first → the open question
    back: |
      Whether the host that engulfed the mitochondrial ancestor already had a nucleus and endomembranes, or whether the engulfment came first and the nucleus evolved afterwards, is unresolved. Both hypotheses agree that the engulfed cell was an aerobic bacterium and the host was related to archaea.
    topic_code: "7.12"
  - front: Horizontal gene transfer and the base of the tree
    back: |
      Early prokaryotes swapped genes so freely that the deepest part of the tree of life looks more like a web or a ring than a branching tree; eukaryotes carry genes from both archaea and bacteria. The tree model works well for the branches; the root was tangled.
    topic_code: "7.12"
  - front: Evolution and the origin of life → two separate questions
    back: |
      Natural selection explains how populations of replicators change; it needs heritable variation to work on. How the first self-replicating molecules arose is a question of chemistry (abiotic synthesis, the RNA world), not of selection. Keep the two apart on the exam.
    topic_code: "7.12"
  - front: Three domains → which is closest to which
    back: |
      Bacteria, Archaea and Eukarya. Ribosomal RNA comparisons show Archaea and Eukarya share a more recent common ancestor than either does with Bacteria, and the mitochondrion is a bacterial lineage living inside an archaeal-related host: the eukaryotic cell is a merger of two domains.
    topic_code: "7.12"

quiz:
  description: |
    24 questions · about 40 minutes · why genetic variation decides a population's resilience, read from
    heterozygosity and survival data; the timeline of life on Earth, abiotic synthesis, the RNA world and
    endosymbiosis; and a synthesis of the whole unit, with spiral review of drift, Hardy-Weinberg, tree reading,
    cell compartmentalisation, photosynthesis, RNA structure and membranes. Multiple choice, select-all,
    true/false and numeric items are graded at once; the fill-in-the-blank items are matched automatically; the
    two short answers and the long answer are graded by your teacher against the acceptable-answer summary.
  questions:
    - slug: u07-w27-q01
      type: multiple_choice
      topic_code: "7.11"
      source: "general knowledge"
      points: 1
      stimulus: |
        Four captive populations of one frog species, each founded from a different number of wild-caught animals and bred for ten generations, were exposed to the chytrid fungus together with a sample from the wild source population. Before exposure, heterozygosity (the mean proportion of 20 marker loci at which an individual carried two different alleles) was measured in each group. Exposure conditions were identical for every group.

        | Population | Number of founders | Heterozygosity | Survival 60 days after exposure (%) |
        |---|---|---|---|
        | A | 4 | 0.12 | 15 |
        | B | 12 | 0.31 | 42 |
        | C | 40 | 0.58 | 71 |
        | Wild source | — | 0.64 | 78 |
      prompt: |
        Which conclusion is best supported by the data?
      options:
        - "Captive breeding itself makes frogs susceptible to the fungus regardless of genetics."
        - "Survival after exposure rises with the genetic variation of the population, consistent with variable populations containing more individuals able to resist a new pathogen."
        - "The fungus is more virulent in small tanks than in large ones."
        - "Heterozygosity is caused by exposure to the fungus."
      option_explanations:
        - |
          Population C, bred in captivity, survived almost as well as the wild sample; what tracks survival is heterozygosity, not captivity as such.
        - |
          Correct. Survival climbs from 15% to 78% in step with heterozygosity from 0.12 to 0.64. A population with more alleles is more likely to include resistant phenotypes for selection to act on.
        - |
          Exposure conditions were identical for all groups; tank size is not a variable in the design.
        - |
          Heterozygosity was measured before exposure and reflects the founding history; it cannot have been caused by an event that came afterwards.
      answer: 1
      explanation: |
        CED 7.11: populations with greater genetic diversity are more likely to persist through environmental change. The data make the link quantitative, and the wild sample shows what the captive groups lost.

    - slug: u07-w27-q02
      type: multiple_choice
      topic_code: "7.11"
      source: "general knowledge"
      points: 1
      stimulus: |
        Four captive populations of one frog species, each founded from a different number of wild-caught animals and bred for ten generations, were exposed to the chytrid fungus together with a sample from the wild source population. Before exposure, heterozygosity (the mean proportion of 20 marker loci at which an individual carried two different alleles) was measured in each group. Exposure conditions were identical for every group.

        | Population | Number of founders | Heterozygosity | Survival 60 days after exposure (%) |
        |---|---|---|---|
        | A | 4 | 0.12 | 15 |
        | B | 12 | 0.31 | 42 |
        | C | 40 | 0.58 | 71 |
        | Wild source | — | 0.64 | 78 |
      prompt: |
        Which mechanism best explains why the more variable populations survived better?
      options:
        - "Heterozygous frogs are larger and can physically resist the fungus."
        - "In a population with many alleles at immune and other genes, some individuals happen to carry combinations that resist the pathogen, so selection has resistant phenotypes to favour; a uniform population may contain none."
        - "Frogs in variable populations learned to avoid the fungus from one another."
        - "Variation lets each frog change its own genotype when it meets the fungus."
      option_explanations:
        - |
          Nothing in the data concerns size, and the marker loci are not genes for body size; the link runs through the availability of resistant phenotypes.
        - |
          Correct. Variation is the raw material of selection. Where many alleles segregate, the chance that some individuals resist a new challenge is high; in population A almost every frog responded alike and died.
        - |
          Learning is not heritable and cannot explain a difference set by marker heterozygosity measured before exposure.
        - |
          An individual's genotype is fixed; selection acts among existing variants, never by changing an individual. This is the individuals-evolve misconception.
      answer: 1
      explanation: |
        Selection chooses among what exists. The number of alleles in a population sets the number of options it has when the environment changes, which is the whole argument for conserving genetic diversity.

    - slug: u07-w27-q03
      type: multiple_choice
      topic_code: "7.11"
      source: "general knowledge"
      points: 1
      stimulus: |
        Four captive populations of one frog species, each founded from a different number of wild-caught animals and bred for ten generations, were exposed to the chytrid fungus together with a sample from the wild source population. Before exposure, heterozygosity (the mean proportion of 20 marker loci at which an individual carried two different alleles) was measured in each group. Exposure conditions were identical for every group.

        | Population | Number of founders | Heterozygosity | Survival 60 days after exposure (%) |
        |---|---|---|---|
        | A | 4 | 0.12 | 15 |
        | B | 12 | 0.31 | 42 |
        | C | 40 | 0.58 | 71 |
        | Wild source | — | 0.64 | 78 |
      prompt: |
        A conservation manager must decide how to rebuild population A. Which action is best justified by the data and by the mechanism of genetic drift?
      options:
        - "Breed population A to a much larger size from its existing animals, since numbers alone restore variation."
        - "Introduce unrelated frogs from the wild source or from population C to add alleles that A has lost, then keep the population large to slow further loss."
        - "Expose population A to the fungus repeatedly so that it develops resistance."
        - "Isolate population A completely to protect its unique gene pool."
      option_explanations:
        - |
          Growth in numbers does not recreate lost alleles; a large population descended from four founders stays as uniform as the founders were. Elephant seals are the cautionary case.
        - |
          Correct. Gene flow is the only quick way to restore alleles, and a large population size afterwards keeps drift weak so the restored variation is not lost again.
        - |
          Exposure selects among existing variants; with heterozygosity of 0.12, population A has few resistant variants to select, so repeated exposure would mostly kill it.
        - |
          Population A's gene pool is a depleted subset of the wild one, not a unique resource; isolation would keep drift acting on a tiny population and make matters worse.
      answer: 1
      explanation: |
        The two tools of genetic rescue are gene flow (add alleles) and population size (stop losing them). Both follow directly from how drift works.

    - slug: u07-w27-q04
      type: multiple_choice
      topic_code: "7.4"
      source: "Biology 2e §19.2 Population Genetics"
      points: 1
      stimulus: |
        Four captive populations of one frog species, each founded from a different number of wild-caught animals and bred for ten generations, were exposed to the chytrid fungus together with a sample from the wild source population. Before exposure, heterozygosity (the mean proportion of 20 marker loci at which an individual carried two different alleles) was measured in each group. Exposure conditions were identical for every group.

        | Population | Number of founders | Heterozygosity | Survival 60 days after exposure (%) |
        |---|---|---|---|
        | A | 4 | 0.12 | 15 |
        | B | 12 | 0.31 | 42 |
        | C | 40 | 0.58 | 71 |
        | Wild source | — | 0.64 | 78 |
      prompt: |
        Review. Why did the population founded from 4 animals end up with far lower heterozygosity than the one founded from 40, when both were bred for the same ten generations?
      options:
        - "Four founders carry a small, unrepresentative sample of the source population's alleles (founder effect), and a small population loses further alleles by genetic drift each generation."
        - "Natural selection in captivity removed alleles from the small population faster."
        - "Mutation rates are lower in small populations."
        - "Frogs from small populations mate less often."
      option_explanations:
        - |
          Correct. Founding is a sampling event and every generation in a small population is another; both are genetic drift, and both remove alleles at random. Forty founders capture most of the source's variation and lose it more slowly.
        - |
          Conditions were the same for all groups, so selection would act alike; and selection could not reduce heterozygosity across 20 neutral marker loci at once. The pattern is drift.
        - |
          Mutation rate per gene is a property of the DNA machinery, not of population size, and ten generations is far too few for mutation to matter either way.
        - |
          Mating frequency does not change allele frequencies; who mates with whom (sampling) does, and that is drift.
      answer: 0
      explanation: |
        Founder effect at the start, drift every generation after: a small captive population is a drift machine. Heterozygosity is the gauge that shows how much it has lost.

    - slug: u07-w27-q05
      type: multiple_choice
      topic_code: "7.12"
      source: "Biology 2e §22.1 Prokaryotic Diversity"
      points: 1
      stimulus: |
        Approximate timeline of major events in the history of life, from the rock and fossil record.

        | Event | Approximate time (billion years ago) |
        |---|---|
        | Earth forms | 4.6 |
        | Oldest rocks with possible chemical traces of life | 3.8 |
        | Oldest stromatolites (fossil microbial mats) | 3.5 |
        | Oxygen begins to accumulate in the atmosphere | 2.3 |
        | Oldest fossils of eukaryotic cells | 2.1 |
        | Primary endosymbiosis giving rise to chloroplasts | 1.5 to 1.0 |
        | Oldest fossils of multicellular animals | 0.6 |
      prompt: |
        Which statement about the order of events is supported by the timeline and consistent with the endosymbiotic theory?
      options:
        - "Eukaryotes appeared before prokaryotes, because eukaryotic cells are more complex and complexity came first."
        - "Prokaryotes existed for more than a billion years before eukaryotes, and atmospheric oxygen was rising before the first eukaryotic fossils, consistent with an aerobic bacterium becoming the mitochondrion."
        - "Chloroplasts arose before mitochondria, because photosynthesis is needed to make the oxygen that mitochondria use."
        - "Multicellular animals appeared at the same time as the first cells."
      option_explanations:
        - |
          The timeline shows prokaryotic stromatolites at 3.5 billion years and eukaryotes at 2.1; the simpler cells came first by more than a billion years.
        - |
          Correct. Cyanobacteria had oxygenated the atmosphere by about 2.3 billion years ago, so aerobic alpha-proteobacteria existed to be engulfed; eukaryotic fossils follow at 2.1. The sequence is what endosymbiosis predicts.
        - |
          The oxygen came from free-living cyanobacteria long before any chloroplast; chloroplasts (1.5 to 1.0 billion years) arose in eukaryotes that already had mitochondria.
        - |
          Multicellular animals appear at 0.6 billion years, nearly three billion years after the first cells.
      answer: 1
      explanation: |
        The timeline is an argument: prokaryotes first, oxygen next, then eukaryotes with mitochondria, then chloroplasts, then animals. Each step depends on the one before.

    - slug: u07-w27-q06
      type: numeric
      topic_code: "7.12"
      source: "Biology 2e §23.1 Eukaryotic Origins"
      points: 1
      stimulus: |
        Approximate timeline of major events in the history of life, from the rock and fossil record.

        | Event | Approximate time (billion years ago) |
        |---|---|
        | Earth forms | 4.6 |
        | Oldest rocks with possible chemical traces of life | 3.8 |
        | Oldest stromatolites (fossil microbial mats) | 3.5 |
        | Oxygen begins to accumulate in the atmosphere | 2.3 |
        | Oldest fossils of eukaryotic cells | 2.1 |
        | Primary endosymbiosis giving rise to chloroplasts | 1.5 to 1.0 |
        | Oldest fossils of multicellular animals | 0.6 |
      prompt: |
        For how many billion years, according to the timeline, was life on Earth exclusively prokaryotic, taking the oldest stromatolites as the start of life and the oldest eukaryotic fossils as the end of that period? Give your answer to one decimal place.
      answer: { value: 1.4, tolerance: 0.05 }
      explanation: |
        3.5 − 2.1 = 1.4 billion years. For comparison, the whole history of multicellular animals is 0.6 billion years. Prokaryotes had more than twice that long on their own, time in which they evolved photosynthesis, oxygenated the planet and evolved the aerobic respiration that a mitochondrion would bring into the eukaryotic cell.

    - slug: u07-w27-q07
      type: multiple_choice
      topic_code: "7.12"
      source: "Biology 2e §23.1 Eukaryotic Origins"
      points: 1
      stimulus: |
        Approximate timeline of major events in the history of life, from the rock and fossil record.

        | Event | Approximate time (billion years ago) |
        |---|---|
        | Earth forms | 4.6 |
        | Oldest rocks with possible chemical traces of life | 3.8 |
        | Oldest stromatolites (fossil microbial mats) | 3.5 |
        | Oxygen begins to accumulate in the atmosphere | 2.3 |
        | Oldest fossils of eukaryotic cells | 2.1 |
        | Primary endosymbiosis giving rise to chloroplasts | 1.5 to 1.0 |
        | Oldest fossils of multicellular animals | 0.6 |
      prompt: |
        Why did oxygen begin to accumulate in the atmosphere only about 2.3 billion years ago, more than a billion years after life appeared?
      options:
        - "Oxygen was delivered by comets at that time."
        - "Oxygen is a waste product of photosynthesis that splits water; it accumulated only after cyanobacteria had evolved that process and after the oxygen they released had first reacted with iron and other minerals."
        - "The first cells produced oxygen but it was immediately used up by animals."
        - "Oxygen was present from the start, and the rocks simply fail to record it."
      option_explanations:
        - |
          The oxygen in the atmosphere is biological in origin; its rise coincides with the spread of cyanobacteria, and comets would not produce a sustained, continuing supply.
        - |
          Correct. Oxygenic photosynthesis evolved in cyanobacteria well after the first cells, and for a long time its oxygen was absorbed by dissolved iron (leaving banded iron formations) before it could build up in the air.
        - |
          Animals appeared about 1.7 billion years later. Early life was anaerobic and oxygen was toxic to much of it.
        - |
          Early rocks contain minerals that form only in the absence of oxygen, which is how we know the atmosphere lacked it. The record is positive evidence, not a gap.
      answer: 1
      explanation: |
        Oxygen was a pollutant before it was a resource. The lag between the first life and the oxygen rise is the time it took to evolve water-splitting photosynthesis and to saturate the planet's chemical oxygen sinks.

    - slug: u07-w27-q08
      type: multiple_choice
      topic_code: "7.12"
      source: "general knowledge"
      points: 1
      prompt: |
        In 1953 Miller and Urey circulated water vapour with methane, ammonia and hydrogen past continuous electric sparks for a week and then analysed the liquid, which contained several amino acids. Which conclusion is justified by the result?
      options:
        - "Living cells can form spontaneously in a week from inorganic gases."
        - "Organic monomers such as amino acids can be synthesised abiotically from simple inorganic molecules given an energy source, supporting the first step of the Oparin-Haldane hypothesis."
        - "Early Earth's atmosphere is now known to have been exactly this mixture."
        - "Amino acids are the only organic molecules that can form without life."
      option_explanations:
        - |
          No cell, polymer or replicating molecule was produced; the experiment addressed monomers only. The step from monomers to cells is a separate and much harder problem.
        - |
          Correct. The experiment tested whether the building blocks could arise without life and found that they could. Later runs with other gas mixtures, including volcanic ones, gave similar products.
        - |
          The composition of the early atmosphere is still debated; the experiment showed what a reducing mixture could do, not what the atmosphere was.
        - |
          Nucleotide bases, sugars and lipids have also been made in abiotic experiments and found in meteorites; amino acids were simply what this run produced most clearly.
      answer: 1
      explanation: |
        Miller-Urey is evidence for the first of four hypothesised steps: monomers, then polymers, then self-replicators, then protocells. Claim no more than the experiment showed.

    - slug: u07-w27-q09
      type: multiple_choice
      topic_code: "7.12"
      source: "general knowledge"
      points: 1
      prompt: |
        The RNA world hypothesis proposes that RNA, rather than DNA or protein, was the first genetic material. Which observation about modern cells gives the hypothesis its strongest support?
      options:
        - "RNA is more chemically stable than DNA, so it is better for long-term storage."
        - "The peptide bonds of every protein are formed by ribosomal RNA, a ribozyme, showing that RNA can act as a catalyst as well as carry information."
        - "DNA cannot be copied without RNA, so RNA must be older."
        - "RNA is found only in the most primitive organisms."
      option_explanations:
        - |
          RNA is less stable than DNA; the 2′ hydroxyl makes it prone to breaking. Its instability is one reason DNA took over storage, not evidence that RNA came first.
        - |
          Correct. A molecule that can both store a sequence and catalyse reactions could in principle copy itself, which neither DNA (no catalysis) nor protein (no template copying) can. The ribosome's catalytic core being RNA is a living relic of that world.
        - |
          DNA replication does use RNA primers, and that is suggestive, but it is a weaker argument than catalysis; priming could have been added later.
        - |
          RNA is in every cell, performing the same core roles in bacteria and in humans; universality, not restriction, is the point.
      answer: 1
      explanation: |
        The origin-of-life problem is which came first, information or catalysis. RNA does both, and the ribosome shows it still does.

    - slug: u07-w27-q10
      type: multiple_choice
      topic_code: "7.11"
      source: "general knowledge"
      points: 1
      prompt: |
        Nearly all bananas sold worldwide are the Cavendish variety, propagated by cuttings so that every plant is genetically identical. A soil fungus to which the Cavendish is susceptible is spreading between plantations. Which statement best describes the risk in evolutionary terms?
      options:
        - "The crop will evolve resistance quickly because there are so many plants."
        - "With no genetic variation, there are no resistant variants for selection to favour, so the fungus can destroy the entire crop; the same fate befell an earlier banana variety and the clonal potatoes of the Irish famine."
        - "The fungus will evolve to become harmless to the bananas."
        - "Clonal propagation protects the crop because every plant is as healthy as the parent."
      option_explanations:
        - |
          Numbers do not supply variation. A million identical plants offer selection exactly one genotype; if it is susceptible, all are.
        - |
          Correct. A monoculture is a population with heterozygosity of zero. Resistance can come only from new mutation (too slow) or from breeding in alleles from wild relatives, which is what seed banks exist for.
        - |
          Selection on the fungus favours strains that exploit the host better, not worse; nothing pushes a pathogen toward harmlessness in a crop that is replanted every cycle.
        - |
          The parent's health is irrelevant to a pathogen the parent has never met. Uniform health is uniform vulnerability.
      answer: 1
      explanation: |
        Monoculture is the human-made version of a bottleneck. CED 7.11 asks you to connect low variation to a population's inability to respond to a changed environment; crops are the clearest case.

    - slug: u07-w27-q11
      type: multiple_choice
      topic_code: "7.9"
      source: "Biology 2e §20.1 Organizing Life on Earth"
      points: 1
      prompt: |
        Review. A phylogenetic tree is written in bracket form as (((human, chimpanzee), gorilla), orangutan). Which statement is correct?
      options:
        - "Gorilla is more closely related to orangutan than to human."
        - "Human and chimpanzee are sister taxa, and gorilla is more closely related to both of them than orangutan is."
        - "Orangutan is the ancestor of the other three."
        - "Human is equally related to chimpanzee and to gorilla."
      option_explanations:
        - |
          Gorilla shares a node with the human-chimpanzee pair that orangutan does not; it is closer to human than to orangutan.
        - |
          Correct. The innermost brackets are the most recent split (human, chimpanzee); gorilla joins at the next node, orangutan at the deepest. Relatedness is read from the nesting of nodes.
        - |
          Orangutan is a living tip and the basal taxon of this tree, not an ancestor. Ancestors are the nodes.
        - |
          Human and chimpanzee share a more recent node than human and gorilla, so human is more closely related to the chimpanzee.
      answer: 1
      explanation: |
        Bracket notation is a tree without the drawing: innermost pair, most recent ancestor. Every rule about nodes applies unchanged.

    - slug: u07-w27-q12
      type: multiple_choice
      topic_code: "2.10"
      source: "Biology 2e §23.1 Eukaryotic Origins"
      points: 1
      prompt: |
        Review. A eukaryotic cell's nuclear envelope and endoplasmic reticulum are thought to have arisen by infolding of the ancestral cell's plasma membrane, whereas its mitochondria arose by endosymbiosis. Which observation distinguishes the two origins?
      options:
        - "The nuclear envelope has its own circular genome and bacterial-type ribosomes, like a mitochondrion."
        - "Mitochondria have two membranes, their own circular DNA, bacterial-type ribosomes and divide by binary fission, none of which is true of the nuclear envelope or the ER."
        - "The ER divides by binary fission independently of the cell."
        - "Mitochondria are continuous with the plasma membrane."
      option_explanations:
        - |
          The nuclear envelope contains no genome of its own and no ribosomes inside it; the DNA it encloses is the host's linear chromosomes.
        - |
          Correct. The endomembrane system is host membrane folded inward, with no genome; the mitochondrion is a captured cell, with the genome, ribosomes and division of one.
        - |
          The ER grows and is partitioned with the cell; it has no independent division because it is not a former organism.
        - |
          Mitochondria are separate, double-membraned bodies in the cytoplasm; it is the ER and nuclear envelope that are continuous with each other and derived from the plasma membrane.
      answer: 1
      explanation: |
        Unit 2 gave two origins for compartments: infolding and engulfment. The tell for engulfment is the genome, ribosomes and division of an independent cell, which is what Margulis argued.

    - slug: u07-w27-q13
      type: multiple_choice
      topic_code: "3.4"
      source: "Biology 2e §23.1 Eukaryotic Origins"
      points: 1
      prompt: |
        Review. Cyanobacteria were the first organisms to release oxygen. Which feature of their photosynthesis is responsible, and what does it imply about the source of the oxygen that chloroplasts release today?
      options:
        - "They split carbon dioxide to obtain carbon, releasing oxygen; chloroplasts do the same."
        - "They use water as the electron donor for photosystem II, splitting it and releasing oxygen; chloroplasts, as descendants of cyanobacteria, release oxygen from water for the same reason."
        - "They respire aerobically and release oxygen as a by-product."
        - "They absorb oxygen from the air and concentrate it in thylakoids."
      option_explanations:
        - |
          The oxygen released by photosynthesis comes from water, not from carbon dioxide; the carbon of CO₂ ends up in sugar and its oxygen stays with the carbon or leaves as water.
        - |
          Correct. Oxygenic photosynthesis takes electrons from water and discards the oxygen. Chloroplasts inherited photosystem II from the engulfed cyanobacterium, so the oxygen a leaf releases today has the same source.
        - |
          Respiration consumes oxygen; it cannot be the source of atmospheric oxygen. Photosynthesis produced it, and aerobic respiration evolved afterwards to use it.
        - |
          Early Earth had almost no oxygen to absorb. Cyanobacteria made it, and only later did it accumulate.
      answer: 1
      explanation: |
        The chemistry of Unit 3 explains the timeline of Unit 7: water-splitting photosynthesis made the oxygen, oxygen made aerobic bacteria possible, and one such bacterium became the mitochondrion.

    - slug: u07-w27-q14
      type: multiple_choice
      topic_code: "1.6"
      source: "Biology 2e §3.5 Nucleic Acids"
      points: 1
      prompt: |
        Review. Which structural feature of RNA, absent from DNA, both lets RNA fold into catalytic shapes and makes it less suitable than DNA for long-term information storage?
      options:
        - "Thymine in place of uracil"
        - "The 2′ hydroxyl group on ribose, which allows extra hydrogen bonding and folding but also makes the backbone prone to cleavage, together with RNA being usually single-stranded"
        - "A double-helical structure with complementary strands"
        - "Phosphodiester bonds between nucleotides"
      option_explanations:
        - |
          RNA has uracil in place of thymine, not the other way round; and the base difference is not what makes RNA foldable or unstable.
        - |
          Correct. Ribose's 2′-OH and the single-stranded state let an RNA strand pair with itself into complex three-dimensional shapes (ribozymes) while leaving it chemically fragile; DNA, lacking the 2′-OH and double-stranded, is the safer archive.
        - |
          The double helix with complementary strands is DNA's feature, and it is what makes DNA stable and repairable; RNA is usually a single strand.
        - |
          Both nucleic acids use phosphodiester bonds; the backbone linkage is not what distinguishes them.
      answer: 1
      explanation: |
        The same chemistry that makes RNA a plausible first replicator (it folds and catalyses) is why it was replaced by DNA for storage. Structure determines function, and function determines history.

    - slug: u07-w27-q15
      type: multi_select
      topic_code: "7.12"
      source: "Biology 2e §23.1 Eukaryotic Origins"
      points: 2
      partial_credit: true
      prompt: |
        Select every observation that supports the hypothesis that mitochondria descend from free-living bacteria engulfed by an ancestral eukaryotic cell.
      options:
        - "Mitochondria have their own circular chromosome."
        - "Mitochondrial ribosomes resemble bacterial ribosomes and are inhibited by antibiotics that do not affect cytosolic ribosomes."
        - "Mitochondria are surrounded by two membranes."
        - "Mitochondria are made fresh by the cell whenever more are needed."
        - "Mitochondria divide by binary fission on their own schedule, independent of mitosis."
      option_explanations:
        - |
          Correct. A circular genome is the bacterial form; eukaryotic nuclear chromosomes are linear. Its genes are most similar to those of alpha-proteobacteria.
        - |
          Correct. The organelle keeps its own translation machinery of the bacterial type, which is why some antibiotics have mitochondrial side effects.
        - |
          Correct. The inner membrane is the bacterium's own plasma membrane and the outer one derives from the host's vacuole formed during engulfment.
        - |
          Mitochondria arise only from the division of existing mitochondria; a cell with none cannot make them. That continuity is itself evidence of descent from an engulfed cell, so the statement as written is false.
        - |
          Correct. Binary fission on an independent schedule is how a bacterium reproduces; a host-built organelle would be assembled, not divided.
      answer: [0, 1, 2, 4]
      explanation: |
        The evidence is a checklist of bacterial properties the organelle retains: genome, ribosomes, membranes, division. The one thing it has lost, independence, is explained by gene transfer to the nucleus.

    - slug: u07-w27-q16
      type: multi_select
      topic_code: "7.11"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about genetic variation and the persistence of populations are correct? Select all that apply.
      options:
        - "A population with high genetic diversity is more likely to contain individuals that survive a new disease, climate shift or predator."
        - "A population that recovers to large numbers after a bottleneck also recovers the alleles it lost."
        - "Gene flow from other populations can restore variation that drift has removed."
        - "Phenotypic variation that is entirely environmental in origin allows a population to evolve in response to selection."
        - "A genetically uniform crop is at greater risk from a single pathogen than a genetically variable one."
      option_explanations:
        - |
          Correct. Variation supplies the phenotypes selection needs; the more alleles, the better the odds that some combination copes with the new condition.
        - |
          Numbers and alleles are separate. Lost alleles return only by mutation or migration; a large population of bottleneck descendants remains uniform, as cheetahs and elephant seals show.
        - |
          Correct. Migration is the fast way to add alleles, which is why conservation programs translocate individuals between isolated populations.
        - |
          Selection changes a population only through heritable variation. Environmental differences in phenotype are not passed on, so they cannot drive evolution.
        - |
          Correct. A clonal crop has no resistant variants to select; one pathogen strain that beats the single genotype beats the whole field.
      answer: [0, 2, 4]
      explanation: |
        Two traps on this topic: confusing population size with genetic diversity, and confusing phenotypic with heritable variation. Persistence depends on heritable diversity, not on numbers or looks.

    - slug: u07-w27-q17
      type: true_false
      topic_code: "7.12"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: The Miller-Urey experiment demonstrated that living cells can arise from a mixture of inorganic gases exposed to electrical energy.
      answer: false
      explanation: |
        False. The experiment produced organic monomers, chiefly amino acids, from methane, ammonia, hydrogen and water with sparks as the energy source. It did not produce polymers, self-replicating molecules, membranes or cells. It supports the first hypothesised step toward life, abiotic synthesis of building blocks, and nothing beyond it. Claiming more is a common exam error.

    - slug: u07-w27-q18
      type: true_false
      topic_code: "7.11"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Two populations of equal size facing the same new pathogen are equally likely to persist, because natural selection acts on all populations in the same way.
      answer: false
      explanation: |
        False. Selection acts the same way, but it can only favour variants that exist. The population with more genetic variation is more likely to contain resistant individuals and so to survive and adapt; the uniform population may have none and decline, whatever its size. Genetic diversity, not population size, is what the pathogen tests.

    - slug: u07-w27-q19
      type: fill_blank
      topic_code: "7.12"
      source: "general knowledge"
      points: 1
      prompt: |
        An RNA molecule that catalyses a chemical reaction, such as the ribosomal RNA that forms peptide bonds, is called a ____.
      answer: ["ribozyme"]
      explanation: |
        Ribozymes are the living evidence for the RNA world: they show that RNA can do the catalytic work now mostly done by proteins, so an RNA molecule could in principle have copied itself before proteins or DNA existed. "Enzyme" alone is not accepted because it implies a protein catalyst.

    - slug: u07-w27-q20
      type: fill_blank
      topic_code: "2.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Membrane lipids form bilayer vesicles spontaneously in water, which is how the first protocells may have formed, because each molecule has a hydrophilic head and hydrophobic tails, a property called being ____.
      answer: ["amphipathic", "amphiphilic"]
      explanation: |
        Amphipathic molecules satisfy both ends only by lining up with heads out and tails in, and the bilayer closes into a vesicle to hide every tail from water. No enzyme or energy input is needed, which is why membrane formation is the easy step in origin-of-life scenarios. "Hydrophobic" describes only the tails, so it is not accepted.

    - slug: u07-w27-q21
      type: numeric
      topic_code: "7.5"
      source: "Biology 2e §19.1 Population Evolution"
      points: 1
      prompt: |
        Review. In a large, randomly mating frog population, the frequency of allele R at a marker locus is 0.3 and the only other allele, r, is 0.7. What proportion of the population is expected to be heterozygous at this locus? Give your answer to two decimal places.
      answer: { value: 0.42, tolerance: 0.005 }
      explanation: |
        Expected heterozygosity = 2pq = 2 × 0.3 × 0.7 = 0.42. This is the Hardy-Weinberg expectation; a captive population descended from a few founders would show less, because drift has removed alleles and inbreeding has concentrated the remainder in homozygotes. Comparing observed heterozygosity with 2pq is how managers measure how much variation a population has lost.

    - slug: u07-w27-q22
      type: short_answer
      topic_code: "7.11"
      source: "general knowledge"
      points: 4
      prompt: |
        Scientific argumentation. A wildlife agency proposes to split a single population of 800 endangered tortoises into eight separate fenced reserves of 100 each to protect them from a disease spreading through the region. A geneticist objects. (a) Explain, using genetic drift, what will happen to genetic variation in each reserve over the following generations compared with the single population. (b) Predict how the split would affect the species' ability to survive a future environmental change, and justify the prediction. (c) Propose one modification to the plan that keeps the disease benefit while reducing the genetic cost, and explain how it works.
      answer: |
        Each reserve of 100 is a small population in which drift is strong, so alleles will be lost by chance and heterozygosity will fall in every reserve, with different alleles lost in different reserves; the single population of 800 would retain more variation. Reduced variation in each reserve lowers the chance that any reserve contains individuals suited to a future change, so each reserve is less likely to persist. Modification: move a few tortoises between reserves every generation (managed gene flow), or keep fewer, larger reserves, so that alleles lost in one reserve are replaced from another while fences still slow the disease.
      explanation: |
        Four points.

        (a) 2 pts: 1 pt for the mechanism: in a population of 100, sampling error (drift) changes allele frequencies more each generation than in a population of 800, so alleles are lost and heterozygosity declines faster in each reserve; 1 pt for the comparison: the eight reserves will each lose variation, and because losses are random, different reserves lose different alleles, so each reserve ends up less variable than the original single population, even though the species as a whole may retain alleles scattered across reserves. Mention of inbreeding and inbreeding depression within reserves is acceptable support.

        (b) 1 pt: each reserve, with less variation, is less likely to contain individuals able to survive a new pathogen, climate shift or other change, so each is more likely to decline; a prediction must be tied to variation as the raw material of selection. Noting that the species as a whole could hedge its bets across reserves, provided alleles can later be recombined, is acceptable if the within-reserve cost is also stated.

        (c) 1 pt: a modification plus its mechanism: periodic translocation of a few individuals between reserves (managed gene flow) to replace alleles lost by drift and raise heterozygosity; or fewer, larger reserves so that drift is weaker; or quarantine and testing of translocated animals so that gene flow does not move the disease. The answer must say how the change counters drift, not just name it.

        Zero: claiming that 100 tortoises is a large enough population for drift to be negligible, or that the tortoises in each reserve will adapt to the reserve by changing themselves.

    - slug: u07-w27-q23
      type: short_answer
      topic_code: "7.12"
      source: "general knowledge"
      points: 4
      prompt: |
        Conceptual analysis. Natural selection requires replication, heritable variation and differential success. (a) Explain why RNA is a better candidate than either DNA or protein for the first molecule on which natural selection could act. (b) Describe one feature of modern cells that is evidence for the RNA world hypothesis. (c) Explain why enclosing self-replicating RNA molecules inside a lipid vesicle would have strengthened natural selection among them.
      answer: |
        RNA both stores information in its sequence and folds into shapes that catalyse reactions, so an RNA molecule could copy itself (and its copies would vary by copying errors); DNA stores but cannot catalyse, and proteins catalyse but cannot be copied from a template. The ribosome's peptide-bond-forming centre is RNA (a ribozyme), a relic of RNA doing catalysis. A membrane keeps a replicator's products and any helpful molecules it makes with itself, so a better replicator benefits its own lineage rather than its neighbours; variation between vesicles then translates into differences in reproduction, which is selection.
      explanation: |
        Four points.

        (a) 2 pts: 1 pt for the dual property of RNA: it carries a copyable sequence and can fold into catalytic structures, so it could in principle replicate itself and vary through copying errors; 1 pt for why DNA and protein fall short: DNA holds information but has no catalytic activity to copy itself, and protein can catalyse but has no template mechanism to be copied, so neither alone satisfies replication plus heritable variation.

        (b) 1 pt: any one of: the ribosome's catalytic core (peptidyl transferase) is RNA; self-splicing introns or other natural ribozymes exist; RNA primers are required to start DNA replication; ribonucleotides are the precursors of deoxyribonucleotides; RNA cofactors (ATP, NAD) sit at the centre of metabolism.

        (c) 1 pt: a vesicle keeps the products of replication (and any catalytic RNAs or useful molecules) together with the replicator, so a variant that copies faster or more accurately benefits its own lineage rather than the whole pool; this makes vesicles the units that differ in reproductive success, which is what natural selection requires. Accept also that the membrane concentrates reactants and protects the RNA.

        Zero: answers that treat RNA as the first living cell, or that say natural selection created the first RNA.

    - slug: u07-w27-q24
      type: long_answer
      topic_code: "7.11"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. A new strain of rust fungus reached a region in year 0. Researchers followed a commercial wheat variety grown from a single inbred line and a population of its wild relative growing nearby. At a resistance gene with alleles R (resistant, dominant) and r, they genotyped 200 plants in each population in year 0 and year 3 and recorded the proportion of plants that produced seed.

        | Population | Year | RR / Rr / rr counts (n = 200) | Frequency of R | Plants producing seed (%) |
        |---|---|---|---|---|
        | Commercial wheat | 0 | 0 / 0 / 200 | 0.00 | 95 |
        | Commercial wheat | 3 | 0 / 0 / 200 | 0.00 | 12 |
        | Wild relative | 0 | 8 / 64 / 128 | 0.20 | 94 |
        | Wild relative | 3 | 72 / 96 / 32 | 0.60 | 70 |

        (a) Identify the independent and dependent variables and describe the pattern in both populations.
        (b) Using Hardy-Weinberg, calculate the expected genotype counts for the wild relative in year 0 and state whether the population was in equilibrium at that time.
        (c) Explain, using natural selection, why the frequency of R rose in the wild relative and why nothing changed in the commercial wheat.
        (d) Evaluate the claim that the commercial variety will evolve resistance on its own if growers keep planting it, and propose one strategy, justified by the mechanism, to produce a resistant commercial variety.
      answer: |
        IV: exposure to the rust fungus over time (year, population); DV: genotype counts, frequency of R, and proportion of plants setting seed. The commercial wheat stayed entirely rr and seed set collapsed from 95% to 12%; in the wild relative R rose from 0.20 to 0.60 and seed set fell only to 70%. Year 0 wild relative: p = 0.2, q = 0.8, expected RR = 8, Rr = 64, rr = 128, exactly matching the observed counts, so the population was in Hardy-Weinberg proportions. The fungus prevented rr plants from setting seed, so RR and Rr plants contributed most of the next generation and R rose (directional selection on pre-existing variation); the commercial line had no R allele, so selection had nothing to favour. The claim is unsupported: with no variation, the variety cannot evolve resistance except by a rare new mutation. Strategy: cross the commercial variety with the wild relative to introduce R, then backcross to recover the commercial traits (introducing variation by gene flow, which selection can then act on).
      explanation: |
        Eight points.

        (a) 2 pts: 1 pt for the variables: independent = exposure to the rust fungus over time (or population type and year); dependent = genotype counts or frequency of R and the percentage of plants producing seed; 1 pt for the pattern with numbers: the commercial wheat remained 100% rr and seed production fell from 95% to 12%, while in the wild relative R rose from 0.20 to 0.60 (rr fell from 128 to 32 plants) and seed production fell only to 70%.

        (b) 2 pts: 1 pt for the calculation: p = 0.2, q = 0.8; expected RR = 0.04 × 200 = 8, Rr = 2 × 0.2 × 0.8 × 200 = 64, rr = 0.64 × 200 = 128; 1 pt for the conclusion: the observed counts equal the expected counts (chi-square of zero), so the year-0 population was in Hardy-Weinberg proportions and there is no evidence of evolutionary forces acting at this locus before the fungus arrived.

        (c) 2 pts: 1 pt for the wild relative: rr plants infected by the fungus produce few seeds, while RR and Rr plants reproduce, so each generation R makes up a larger share of the gene pool, a directional selection acting on variation (R at 0.20) that existed before the fungus arrived; 1 pt for the commercial wheat: the inbred line is genetically uniform and carries no R allele, so there is no variation for selection to act on, and the fungus reduces seed set without changing the population's genetics.

        (d) 2 pts: 1 pt for the evaluation: the claim is not supported, because natural selection cannot create a resistance allele, only increase the frequency of one that exists; the uniform variety could gain R only by a rare new mutation, far too slow to save the crop, so continued planting means continued losses; 1 pt for a strategy with mechanism: introduce variation by crossing the commercial variety with the wild relative (gene flow of the R allele) and then select resistant offspring and backcross to recover commercial traits; or use genetic engineering to insert the R gene; or plant a mixture of varieties so that the crop population contains resistant genotypes. The strategy must state that it supplies the variation selection needs.

        Zero for a part: describing the commercial wheat as needing time to adapt; computing expected counts from the observed genotype counts rather than from p and q; or claiming the wild population will lose r entirely by year 3 (heterozygotes shelter it).
