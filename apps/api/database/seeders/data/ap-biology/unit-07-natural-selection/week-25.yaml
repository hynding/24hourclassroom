week: 25
unit: 7
title: Evidence of Evolution, Common Ancestry and Continuing Evolution
topics: ["7.6", "7.7", "7.8"]
guide: guides/week-25.md
guide_description: |
  The independent lines of evidence (fossils, biogeography, homologous and vestigial structures, embryology,
  molecular sequences) and how to tell homology from analogy; the shared features that point to one common
  ancestor for all life and one for all eukaryotes; evolution observed now in antibiotic and pesticide
  resistance, pathogens and finches; the molecular clock. Three worked examples (a cytochrome c table with a
  clock calculation, percent identity, a replica-plating argument), misconceptions, self-check.
flashcards_description: |
  33 cards: the lines of evidence, homology versus analogy, the universal and eukaryotic core features,
  resistance and horizontal gene transfer, and the molecular clock.

flashcards:
  - front: Fossil record → what it shows and its main limitation
    back: |
      Direct evidence that organisms have changed over time: sequences of fossils in dated rock layers show lineages such as horses and whales changing form across millions of years. Limitation: fossilisation is rare and favours hard parts and certain habitats, so the record is incomplete.
    topic_code: "7.6"
  - front: Transitional fossil
    back: |
      A fossil showing a mix of features of an ancestral group and a descendant group, such as whale ancestors with hind limbs or feathered dinosaurs. It demonstrates that the intermediate forms predicted by descent with modification existed.
    topic_code: "7.6"
  - front: Biogeography → the Proteaceae example
    back: |
      The geographic distribution of species reflects their history. The plant family Proteaceae occurs in Australia, southern Africa and South America, lands that were joined in the supercontinent Gondwana until about 200 million years ago; the family spread before the break-up and the continents carried it apart.
    hint: Where things live records where their ancestors lived.
    topic_code: "7.6"
  - front: Endemic species → what isolation explains
    back: |
      Species found in one place and nowhere else, as with most Australian mammals. Isolation stopped gene flow with mainland populations, so lineages evolved independently; the unusual fauna of islands and isolated continents is predicted by evolution and unexplained by any other idea.
    topic_code: "7.6"
  - front: Homologous structures → definition and an example
    back: |
      Structures in different species that share the same underlying construction and embryonic origin because they were inherited from a common ancestor, even if they now do different jobs: the human arm, dog leg, bird wing and whale flipper all have one upper bone, two forearm bones, wrist bones and digits.
    topic_code: "7.6"
  - front: Analogous structures → definition and an example
    back: |
      Structures with the same function but different construction and origin, produced by convergent evolution rather than common ancestry: the wings of insects and of birds both fly but are built from entirely different parts. Analogy is evidence of similar selection, not relatedness.
    hint: Same job, different blueprint.
    topic_code: "7.6"
  - front: Homology vs analogy → how to tell them apart
    back: |
      Look past the function at the construction and the development. Same bones in the same arrangement from the same embryonic tissue: homologous. Same job achieved with different parts and origins: analogous. Molecular data settle hard cases: homologous structures are built by related genes.
    topic_code: "7.6"
  - front: Vestigial structures → three examples
    back: |
      Reduced structures with little or no function that were functional in an ancestor: the wings of flightless birds, the hind-limb bones buried in a whale's body, and the leaves reduced to spines on some cacti. They make sense only as leftovers of descent.
    topic_code: "7.6"
  - front: Comparative embryology → the gill-slit evidence
    back: |
      All vertebrate embryos, including humans, develop pharyngeal (gill) slits and a tail early on. In fish they become gills; in land vertebrates they are remodelled into other structures or lost. Shared embryonic stages reflect a shared developmental programme inherited from a common ancestor.
    topic_code: "7.6"
  - front: Molecular evidence → why DNA similarity tracks relatedness
    back: |
      Every organism uses DNA and the same genetic code, so sequences can be compared across all life. Mutations accumulate over time, so the more recently two species shared an ancestor, the fewer differences their sequences show. The pattern of similarity matches the pattern predicted from anatomy and fossils.
    topic_code: "7.6"
  - front: Gene duplication → how it lets new proteins evolve
    back: |
      When a gene is copied, one copy keeps the original job while the other is free to accumulate mutations and take on a new function. Many gene families (globins, opsins) arose this way; duplicated genes in related species are evidence of shared ancestry.
    topic_code: "7.6"
  - front: Radiometric dating → how a fossil's age is found
    back: |
      Radioactive isotopes in rock decay at a fixed half-life (carbon-14 about 5,730 years; potassium-40 1.3 billion years). The ratio of parent to daughter isotope in a layer gives its age, which dates the fossils in it and calibrates the timescale of evolution.
    topic_code: "7.6"
  - front: Features shared by all living things → what they imply
    back: |
      DNA as the genetic material, the same genetic code, ribosomes that translate it, ATP as the energy currency, and core pathways such as glycolysis. Shared by bacteria, archaea and eukaryotes alike, they are inherited from a single common ancestor of all life.
    hint: The CED's evidence for one origin of life's lineages.
    topic_code: "7.7"
  - front: Core features shared by all eukaryotes → what they imply
    back: |
      Membrane-bound organelles (including mitochondria), a nucleus with linear chromosomes, and genes that contain introns. Found in protists, fungi, plants and animals alike, they show that all eukaryotes descend from one common eukaryotic ancestor.
    topic_code: "7.7"
  - front: Universal genetic code → why it is evidence for common ancestry
    back: |
      The same 64 codons specify the same amino acids in nearly every organism, which is why a human gene placed in a bacterium makes the human protein. There is no chemical reason the code had to be this one; its universality is best explained by inheritance from one ancestor.
    topic_code: "7.7"
  - front: Conserved protein (cytochrome c) → what the number of differences tells you
    back: |
      Cytochrome c does the same electron-transport job in every aerobic eukaryote, so its sequence changes slowly. The number of amino-acid differences between two species rises with the time since they shared an ancestor: humans and chimpanzees differ at 0 positions, humans and yeast at about 45.
    topic_code: "7.7"
  - front: Three domains → Woese and ribosomal RNA
    back: |
      Carl Woese compared ribosomal RNA sequences across organisms and found that prokaryotes fall into two deeply separate groups. Life has three domains: Bacteria, Archaea and Eukarya, with Archaea closer to Eukarya than to Bacteria.
    topic_code: "7.7"
  - front: Why ribosomal RNA for the tree of all life?
    back: |
      Every cell has ribosomes, so the gene can be compared across all organisms; its function is so essential that it changes very slowly, so even distant relationships leave a readable signal. A fast-changing gene would be saturated with changes over billions of years.
    topic_code: "7.7"
  - front: Humans descended from chimpanzees → what is wrong with the statement
    back: |
      Humans and chimpanzees are sister lineages that share a common ancestor about seven million years ago; neither descends from the other. Modern species are the tips of branches, not the ancestors at the nodes.
    topic_code: "7.7"
  - front: Evolution is continuing → three lines of evidence
    back: |
      Antibiotic, pesticide and herbicide resistance appearing within years of a chemical's introduction; pathogens such as influenza and HIV changing fast enough to need new vaccines and drugs; and measured generation-to-generation change in wild populations such as the Daphne Major finches.
    topic_code: "7.8"
  - front: Antibiotic resistance → the mechanism of its evolution
    back: |
      Random mutation or a plasmid gives a few bacteria an allele that disables the drug or pumps it out. The antibiotic kills the sensitive majority, the resistant minority reproduce, and within a few generations most of the population is resistant. The drug selects; it does not create.
    hint: Selection among variants that already exist.
    topic_code: "7.8"
  - front: Why does resistance spread so fast in bacteria?
    back: |
      Huge populations and generation times of minutes make rare mutations likely and selection quick; resistance genes often sit on plasmids that move between cells and even between species by horizontal gene transfer; and heavy antibiotic use applies the same selection pressure almost everywhere.
    topic_code: "7.8"
  - front: Horizontal gene transfer → the three classic mechanisms
    back: |
      Transformation (taking up naked DNA from the surroundings), transduction (a bacteriophage carrying DNA from one cell to another) and conjugation (a plasmid passed through a pilus). All move genes between cells that are not parent and offspring, and all can spread resistance.
    topic_code: "7.8"
  - front: MRSA
    back: |
      Methicillin-resistant Staphylococcus aureus: a strain carrying a gene for an altered penicillin-binding protein that the drug cannot inhibit. It arose within a few years of methicillin's introduction and spread through hospitals, the standard example of evolution in human medicine.
    topic_code: "7.8"
  - front: Why finish a course of antibiotics?
    back: |
      A partial course kills the most sensitive cells and leaves the least sensitive alive to reproduce, which is a selection experiment for resistance. A full course at full dose aims to kill the whole population before resistant variants can take over.
    topic_code: "7.8"
  - front: Pesticide resistance → why rotating pesticides slows it
    back: |
      Each pesticide selects for its own resistance alleles. Switching between chemicals with different targets means an allele that is favoured under one is not favoured under the next, so no single resistant genotype keeps increasing; resistant variants are often slightly less fit when the chemical is absent.
    topic_code: "7.8"
  - front: Molecular clock → the assumption behind it
    back: |
      That a given gene or protein accumulates substitutions at a roughly constant rate over time, so the number of differences between two species is proportional to the time since they diverged. Calibrated against fossils of known age, it dates divergences with no fossil record.
    topic_code: "7.8"
  - front: Using a molecular clock → the calculation
    back: |
      Rate = differences / time for a pair with a known fossil date; then time = differences / rate for the pair you want. If chicken and human differ at 13 positions and diverged 310 million years ago, the rate is about 1 difference per 24 million years; 29 differences from a fruit fly gives roughly 690 million years.
    topic_code: "7.8"
  - front: Why do neutral mutations make the best molecular clocks?
    back: |
      Selection cannot see them, so they accumulate at the mutation rate alone, which is steadier than the stop-start pace of adaptive change. Silent substitutions and changes in non-coding DNA tick more regularly than changes that alter protein function.
    topic_code: "7.8"
  - front: Calibrating a molecular clock → what fossils are for
    back: |
      The clock gives relative times only until at least one divergence in the tree is dated independently. A fossil of known age for a pair of lineages sets the rate, and different genes need separate calibration because they evolve at different speeds.
    topic_code: "7.8"
  - front: Emergent and changing diseases → evolution in real time
    back: |
      Influenza viruses change their surface proteins every season, so last year's antibodies and vaccine miss them; HIV evolves drug resistance inside one patient. Both are populations under selection by immune systems and drugs, evolving on a timescale of months.
    topic_code: "7.8"
  - front: Percent identity of two aligned sequences → how it is computed
    back: |
      Count the positions at which the two sequences match, divide by the number of positions compared, and multiply by 100. A 300-base alignment with 12 mismatches is 288/300 = 96% identical. Higher identity usually means a more recent common ancestor.
    topic_code: "7.8"
  - front: Why the Daphne Major finches count as evidence that evolution is ongoing
    back: |
      The Grants measured a heritable trait across generations and watched its mean shift after a documented environmental change, then shift back when conditions changed again. That is evolution observed directly in a wild population, not inferred from the past.
    topic_code: "7.8"

quiz:
  description: |
    25 questions · about 40 minutes · the lines of evidence for evolution and how to weigh them, the shared
    features that argue for common ancestry, resistance and pathogen evolution as evolution observed, and
    molecular clocks, with spiral review of Hardy-Weinberg, drift, the universal code, DNA structure, PCR and
    the electron transport chain. Multiple choice, select-all, true/false and numeric items are graded at once;
    the fill-in-the-blank items are matched automatically; the two short answers and the long answer are graded
    by your teacher against the acceptable-answer summary.
  questions:
    - slug: u07-w25-q01
      type: multiple_choice
      topic_code: "7.7"
      source: "general knowledge"
      points: 1
      stimulus: |
        Cytochrome c is a protein of the electron transport chain, about 104 amino acids long, found in every aerobic eukaryote. The table gives the number of amino-acid positions at which each species' cytochrome c differs from the human sequence, and the approximate time since each lineage last shared an ancestor with humans, from the fossil record where known.

        | Species | Amino-acid differences from human | Divergence from the fossil record (million years ago) |
        |---|---|---|
        | Chimpanzee | 0 | 7 |
        | Rhesus monkey | 1 | 25 |
        | Dog | 11 | 95 |
        | Chicken | 13 | 310 |
        | Tuna | 21 | 450 |
        | Fruit fly | 29 | not available |
        | Yeast | 45 | not available |
      prompt: |
        Which conclusion about evolutionary relationships is best supported by the table?
      options:
        - "Humans are more closely related to the dog than to the rhesus monkey, because dogs are mammals."
        - "The fewer the differences, the more recent the common ancestor: humans share a more recent ancestor with the rhesus monkey than with the dog, and with the dog than with the chicken."
        - "Yeast and humans are unrelated, because 45 differences out of 104 is too many to reflect common ancestry."
        - "The chimpanzee's cytochrome c is identical to the human one because chimpanzees are the ancestors of humans."
      option_explanations:
        - |
          Both are mammals, but the table shows 1 difference for the monkey and 11 for the dog; relatedness is read from the data, not from a shared class name.
        - |
          Correct. Differences increase steadily down the table and track the fossil-dated divergence times, exactly what descent with modification predicts: mutations accumulate for longer in lineages that split earlier.
        - |
          Fifty-nine of 104 positions are still identical after roughly a billion years, and the protein does the same job in the same way; that conservation is itself evidence of shared origin.
        - |
          Humans and chimpanzees are sister lineages that split about seven million years ago; neither descends from the other. Zero differences means a recent common ancestor, not ancestry.
      answer: 1
      explanation: |
        A conserved protein is a relatedness ruler: compare sequences, count differences, and the ranking of relatives falls out. The match with fossil-based dates is the independent check that the ruler is honest.

    - slug: u07-w25-q02
      type: multiple_choice
      topic_code: "7.6"
      source: "Biology 2e §18.1 Understanding Evolution"
      points: 1
      stimulus: |
        Cytochrome c is a protein of the electron transport chain, about 104 amino acids long, found in every aerobic eukaryote. The table gives the number of amino-acid positions at which each species' cytochrome c differs from the human sequence, and the approximate time since each lineage last shared an ancestor with humans, from the fossil record where known.

        | Species | Amino-acid differences from human | Divergence from the fossil record (million years ago) |
        |---|---|---|
        | Chimpanzee | 0 | 7 |
        | Rhesus monkey | 1 | 25 |
        | Dog | 11 | 95 |
        | Chicken | 13 | 310 |
        | Tuna | 21 | 450 |
        | Fruit fly | 29 | not available |
        | Yeast | 45 | not available |
      prompt: |
        Why is a protein like cytochrome c a useful choice for comparing species as distant as yeast and humans?
      options:
        - "It evolves very quickly, so even close relatives show many differences."
        - "It is present in all of these organisms doing the same essential job, so the sequences can be aligned across all of them, and it changes slowly enough that distant comparisons are still readable."
        - "It is found only in vertebrates, which keeps the comparison fair."
        - "Its sequence is identical in every species, which makes the alignment simple."
      option_explanations:
        - |
          A fast-evolving protein would be saturated with changes over a billion years, and the signal of relationship would be lost in noise. Slow change is what makes deep comparisons possible.
        - |
          Correct. A universally shared, functionally constrained protein gives a comparison that spans all of life and still has enough variation to rank relatives.
        - |
          The table itself includes a fly and a yeast; cytochrome c is in every aerobic eukaryote, which is precisely why it can be used for such a wide comparison.
        - |
          An identical sequence would carry no information about relatedness; the differences are the data.
      answer: 1
      explanation: |
        The best molecular ruler is shared by everyone being compared and changes at a pace suited to the question: slow genes (rRNA, cytochrome c) for deep branches, fast ones for recent splits.

    - slug: u07-w25-q03
      type: numeric
      topic_code: "7.8"
      source: "general knowledge"
      points: 1
      stimulus: |
        Cytochrome c is a protein of the electron transport chain, about 104 amino acids long, found in every aerobic eukaryote. The table gives the number of amino-acid positions at which each species' cytochrome c differs from the human sequence, and the approximate time since each lineage last shared an ancestor with humans, from the fossil record where known.

        | Species | Amino-acid differences from human | Divergence from the fossil record (million years ago) |
        |---|---|---|
        | Chimpanzee | 0 | 7 |
        | Rhesus monkey | 1 | 25 |
        | Dog | 11 | 95 |
        | Chicken | 13 | 310 |
        | Tuna | 21 | 450 |
        | Fruit fly | 29 | not available |
        | Yeast | 45 | not available |
      prompt: |
        Use the human-chicken comparison to calibrate a molecular clock (rate = differences ÷ million years), then estimate how many million years ago the human and fruit-fly lineages diverged. Give your answer to the nearest 10 million years.
      answer: { value: 690, tolerance: 30 }
      explanation: |
        Rate = 13 differences / 310 million years = 0.0419 differences per million years, or about one difference every 24 million years. Time for the fruit fly = 29 / 0.0419 ≈ 692 million years, about 690. Checking with tuna: 21 / 0.0419 ≈ 500 million years against a fossil estimate of 450, so the clock is roughly right but not exact, as a clock calibrated on one pair never is.

    - slug: u07-w25-q04
      type: multiple_choice
      topic_code: "7.8"
      source: "general knowledge"
      points: 1
      stimulus: |
        Cytochrome c is a protein of the electron transport chain, about 104 amino acids long, found in every aerobic eukaryote. The table gives the number of amino-acid positions at which each species' cytochrome c differs from the human sequence, and the approximate time since each lineage last shared an ancestor with humans, from the fossil record where known.

        | Species | Amino-acid differences from human | Divergence from the fossil record (million years ago) |
        |---|---|---|
        | Chimpanzee | 0 | 7 |
        | Rhesus monkey | 1 | 25 |
        | Dog | 11 | 95 |
        | Chicken | 13 | 310 |
        | Tuna | 21 | 450 |
        | Fruit fly | 29 | not available |
        | Yeast | 45 | not available |
      prompt: |
        A student notes that the dog comparison gives a rate of 11/95 ≈ 0.12 differences per million years while the chicken comparison gives 13/310 ≈ 0.04. Which statement best addresses this?
      options:
        - "The molecular clock assumes a constant rate, and the discrepancy shows that the assumption holds only approximately; estimates should be calibrated with several fossil dates and treated as approximate."
        - "The dog's fossil date must be wrong, because a molecular clock is always exact."
        - "The discrepancy proves that cytochrome c does not evolve and cannot be used as a clock."
        - "The difference arises because dogs are more closely related to humans than chickens are, so their clock runs faster."
      option_explanations:
        - |
          Correct. Rates vary among lineages and over time (generation time, population size and selection all matter), so a clock is calibrated against as many dated points as possible and reports a range.
        - |
          Fossil dates have uncertainty, but the larger lesson is that the clock itself is approximate; declaring the molecular estimate exact inverts the logic of calibration.
        - |
          The table shows differences rising with time, so the protein does evolve and does carry a time signal. Imperfect regularity is not the same as no regularity.
        - |
          Relatedness does not speed a clock; it just shortens the time. A rate is differences per unit time, and nothing about being a mammal makes substitutions accumulate faster.
      answer: 0
      explanation: |
        Molecular clocks are hypotheses with error bars. The constant-rate assumption is a useful approximation whose failures are expected and are corrected by calibrating with multiple fossils.

    - slug: u07-w25-q05
      type: multiple_choice
      topic_code: "7.8"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student started a culture of E. coli from a single colony in broth with no antibiotic and grew it for 24 hours (about 30 generations). She spread equal volumes of the culture on a plain agar plate and on a plate containing ampicillin. About 1,000 colonies grew on the plain plate and 2 colonies grew on the ampicillin plate. She then picked one of the two resistant colonies, grew it for 100 generations in broth with no ampicillin, and plated it the same way: about 1,000 colonies on the plain plate and about 950 on the ampicillin plate.
      prompt: |
        What is the best explanation for the two colonies that grew on the first ampicillin plate?
      options:
        - "Contact with ampicillin on the plate caused those two cells to develop resistance."
        - "During the 24 hours of growth without antibiotic, random mutations produced a few resistant cells, and the ampicillin plate revealed them by killing the rest."
        - "All 1,000 cells were resistant, but only two happened to land where there was no ampicillin."
        - "The two colonies were contaminants from the air, not E. coli."
      option_explanations:
        - |
          This reverses cause and effect. The cells on the ampicillin plate either carried resistance when they landed or died; a dead cell cannot respond. The Lederbergs' replica plating showed resistant cells exist before any exposure.
        - |
          Correct. Thirty generations from one cell produce around a billion cells, enough for a rare resistance mutation to arise by chance; plating on ampicillin is a selection step that lets only those cells form colonies.
        - |
          Ampicillin is mixed uniformly through the agar; there are no drug-free patches. The 998 missing colonies were killed, which is the point of the plate.
        - |
          Contamination is not excluded by the data alone, but the follow-up (the colony grew as E. coli and remained resistant) supports resistance arising within the culture; airborne contaminants would not explain a stable E. coli lineage.
      answer: 1
      explanation: |
        Variation first, selection second. The antibiotic plate does not make resistant bacteria; it finds the ones that mutation already made.

    - slug: u07-w25-q06
      type: multiple_choice
      topic_code: "7.8"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student started a culture of E. coli from a single colony in broth with no antibiotic and grew it for 24 hours (about 30 generations). She spread equal volumes of the culture on a plain agar plate and on a plate containing ampicillin. About 1,000 colonies grew on the plain plate and 2 colonies grew on the ampicillin plate. She then picked one of the two resistant colonies, grew it for 100 generations in broth with no ampicillin, and plated it the same way: about 1,000 colonies on the plain plate and about 950 on the ampicillin plate.
      prompt: |
        What does the result of the second plating (950 of about 1,000 colonies resistant after 100 generations without ampicillin) show?
      options:
        - "Resistance is heritable: it was passed through 100 generations with no antibiotic present to maintain it."
        - "Resistance was lost in the absence of the antibiotic, because 50 colonies failed to grow."
        - "The culture became resistant because the broth contained traces of ampicillin."
        - "Ampicillin resistance is not genetic, because it persisted without the drug."
      option_explanations:
        - |
          Correct. A trait that persists for 100 generations with no selective agent present is inherited through DNA; the resistant cell's descendants carry its allele whether or not the drug is there.
        - |
          A loss of about 5% is consistent with a small fitness cost or a few back-mutations, but 95% resistant after 100 generations is retention, not loss.
        - |
          The broth is stated to contain no ampicillin, and in any case traces of drug would select for, not create, resistance.
        - |
          Persistence without the drug is exactly what a genetic trait does. A non-genetic (physiological) tolerance would vanish within a generation or two of growth without the drug.
      answer: 0
      explanation: |
        Heritability is what makes resistance an evolutionary problem rather than a temporary one. Once the allele is in the population, stopping the drug slows its spread but does not erase it.

    - slug: u07-w25-q07
      type: multiple_choice
      topic_code: "7.8"
      source: "Biology 2e §20.3 Perspectives on the Phylogenetic Tree"
      points: 1
      stimulus: |
        A student started a culture of E. coli from a single colony in broth with no antibiotic and grew it for 24 hours (about 30 generations). She spread equal volumes of the culture on a plain agar plate and on a plate containing ampicillin. About 1,000 colonies grew on the plain plate and 2 colonies grew on the ampicillin plate. She then picked one of the two resistant colonies, grew it for 100 generations in broth with no ampicillin, and plated it the same way: about 1,000 colonies on the plain plate and about 950 on the ampicillin plate.
      prompt: |
        The student next mixes the resistant strain with a sensitive strain of a different bacterial species for one hour and finds that some cells of the second species are now resistant. Which process best explains the transfer?
      options:
        - "Natural selection, because the sensitive species evolved resistance when exposed to the resistant one."
        - "Horizontal gene transfer, most likely conjugation of a plasmid carrying the resistance gene from one species to the other."
        - "Sexual reproduction between the two species producing resistant hybrids."
        - "Genetic drift in the mixed culture."
      option_explanations:
        - |
          Selection changes frequencies of alleles already present; it cannot move a gene from one species into another in an hour. No antibiotic was even present during the mixing.
        - |
          Correct. Bacteria pass plasmids through a pilus (conjugation), take up free DNA (transformation) or receive it from phages (transduction). Resistance genes on plasmids cross species lines this way, which is why resistance spreads faster than mutation alone could explain.
        - |
          Bacteria do not reproduce sexually, and different species would not form hybrids. Gene exchange in prokaryotes is horizontal, between existing cells, not through offspring.
        - |
          Drift is random change in allele frequency within a population; it does not introduce a gene into a species that lacked it.
      answer: 1
      explanation: |
        Horizontal gene transfer is why the tree of life is tangled at its base and why one resistant strain can arm others. It also explains why resistance to a new drug can appear in a species that has never been exposed to it.

    - slug: u07-w25-q08
      type: multiple_choice
      topic_code: "7.6"
      source: "Biology 2e §20.2 Determining Evolutionary Relationships"
      points: 1
      prompt: |
        The wing of a bat and the wing of a bird share the same arrangement of bones (one upper-arm bone, two forearm bones, wrist bones and digits), while the wing of a butterfly has no bones and develops from entirely different tissue. Which statement is correct?
      options:
        - "All three wings are homologous because they all perform the function of flight."
        - "The bat and bird wings are homologous (inherited from a common tetrapod ancestor), while the butterfly wing is analogous to them (convergent evolution)."
        - "The bat and bird wings are analogous because bats are mammals and birds are not."
        - "None of the wings are homologous because they evolved at different times."
      option_explanations:
        - |
          Shared function is the definition of analogy, not homology. Homology is shared construction and origin, which the butterfly wing lacks.
        - |
          Correct. The same bones in the same order from the same embryonic limb bud mark a shared ancestor; the insect wing solves the same problem with a completely different structure.
        - |
          Being in different classes does not remove homology. Bats and birds are both tetrapods, and their forelimb bones are the same inherited set, modified for flight separately.
        - |
          Homology does not require the structures to have arisen at the same time; it requires descent from the same ancestral structure, which the two vertebrate wings share.
      answer: 1
      explanation: |
        Homology is read from construction and development, not from use. The forelimb of a bat, a bird, a whale and a human is one of the clearest cases.

    - slug: u07-w25-q09
      type: multiple_choice
      topic_code: "7.7"
      source: "Biology 2e §23.1 Eukaryotic Origins"
      points: 1
      prompt: |
        A protist, a fungus, a plant and an animal all have mitochondria, a nucleus with linear chromosomes wrapped around histones, and genes interrupted by introns. Which conclusion do these shared features best support?
      options:
        - "These features evolved independently in each group because they are useful."
        - "All four groups descend from a single common eukaryotic ancestor that already possessed these features."
        - "Plants and animals are more closely related to each other than either is to fungi."
        - "Prokaryotes also have all of these features."
      option_explanations:
        - |
          Independent evolution of the same complex suite of features (organelle, chromosome packaging, intron processing) in four lineages is far less parsimonious than inheriting it once.
        - |
          Correct. The CED names membrane-bound organelles, linear chromosomes and introns as the core eukaryotic features; their universality among eukaryotes is evidence of one eukaryotic origin.
        - |
          Shared features common to all four tell you about their joint ancestor, not about which two are closest; ranking relatives needs features shared by some but not others.
        - |
          Prokaryotes have no nucleus or mitochondria, carry a circular chromosome, and almost never have introns. The features are what distinguish the eukaryotic clade.
      answer: 1
      explanation: |
        Features shared by every member of a group and absent outside it are inherited from the group's common ancestor. The same logic at a wider scale, DNA, the genetic code, ribosomes and ATP, argues for one ancestor of all life.

    - slug: u07-w25-q10
      type: multiple_choice
      topic_code: "7.6"
      source: "Biology 2e §18.1 Understanding Evolution"
      points: 1
      prompt: |
        The plant family Proteaceae is found in Australia, southern Africa and South America, which were joined in the supercontinent Gondwana until it began to break apart about 200 million years ago. Which explanation of the distribution is best supported?
      options:
        - "The family evolved separately on each continent because the climates are similar."
        - "Seeds were carried across the oceans by birds in recent times."
        - "The family had already spread across Gondwana before the break-up, and the drifting continents carried its descendants apart."
        - "The family originated in Africa and was introduced to the other continents by humans."
      option_explanations:
        - |
          Independent origin of the same family on three continents would be convergence of an entire lineage, including its DNA, which is not how convergence works; the shared ancestry is what the molecular data show.
        - |
          Transoceanic dispersal would not produce the specific pattern that matches the former Gondwanan landmass, and the family's fossils on these continents are far older than recent.
        - |
          Correct. Biogeography reads distributions as history: the lineage predates the split, so the continents carried it. The fossil record and the age of the family agree with the timing.
        - |
          Humans arrived tens of millions of years after the family was already on all three continents, as its fossils show.
      answer: 2
      explanation: |
        Biogeography is evidence because distributions match history rather than habitat: closely related species cluster where their ancestors lived, and isolated landmasses have their own endemic lineages.

    - slug: u07-w25-q11
      type: multiple_choice
      topic_code: "7.5"
      source: "Biology 2e §19.1 Population Evolution"
      points: 1
      prompt: |
        Review. Albinism, a recessive condition, occurs in about 1 in 10,000 people in a population assumed to be at Hardy-Weinberg equilibrium. Approximately what fraction of the population are heterozygous carriers?
      options:
        - "About 1 in 10,000"
        - "About 1 in 100"
        - "About 1 in 50"
        - "About 1 in 4"
      option_explanations:
        - |
          That is the q² class, the affected homozygotes. Carriers are the 2pq class, which for a rare allele is far larger.
        - |
          1 in 100 is q itself (q = √0.0001 = 0.01), the allele frequency; the carrier frequency is 2pq, roughly twice that.
        - |
          Correct. q² = 0.0001, q = 0.01, p = 0.99, 2pq = 2 × 0.99 × 0.01 ≈ 0.0198, about 1 in 50. Two hundred times as many people carry the allele as express it.
        - |
          One in four is the recessive fraction from a cross of two heterozygotes, not a population carrier frequency.
      answer: 2
      explanation: |
        Square root of the recessive phenotype frequency, then 2pq. The persistence of recessive alleles in carriers is the same fact that makes antibiotic-sensitive alleles survive in heterozygous mosquitoes.

    - slug: u07-w25-q12
      type: multiple_choice
      topic_code: "7.4"
      source: "Biology 2e §19.2 Population Genetics"
      points: 1
      prompt: |
        Review. Which change would most increase the importance of genetic drift relative to natural selection in a population?
      options:
        - "A tenfold increase in population size."
        - "A disease that reduces the population from 50,000 to 50 individuals."
        - "Introduction of a new predator that targets one phenotype."
        - "An increase in gene flow from a neighbouring large population."
      option_explanations:
        - |
          A larger population means each generation is a larger sample of the gene pool, so sampling error, and therefore drift, becomes weaker.
        - |
          Correct. A collapse to 50 individuals is a bottleneck: chance decides which alleles survive and which are lost, and drift dominates until the population is large again.
        - |
          A predator that targets a phenotype is a selective agent; it strengthens selection, which is the opposite of what is asked.
        - |
          Gene flow adds alleles and makes the population behave more like part of a larger one, which reduces the relative influence of drift.
      answer: 1
      explanation: |
        Drift's strength is set by population size and nothing else. Bottlenecks and founder events are drift at its strongest, and their signature is variation lost at random.

    - slug: u07-w25-q13
      type: multiple_choice
      topic_code: "6.8"
      source: "Biology 2e §17.1 Biotechnology"
      points: 1
      prompt: |
        Review. The human insulin gene inserted into a plasmid and placed in E. coli directs the bacterium to make human insulin. Which feature of living things makes this possible, and what does it imply?
      options:
        - "Bacteria and humans use the same genetic code and translation machinery, which is evidence that they share a common ancestor."
        - "Bacteria can read any sequence of DNA regardless of its code, so the origin of the gene is irrelevant."
        - "Insulin is a simple molecule that any cell can make without instructions."
        - "The plasmid contains its own ribosomes that translate the human gene."
      option_explanations:
        - |
          Correct. The same codons specify the same amino acids in E. coli as in a human, and bacterial ribosomes translate the human message. A shared, arbitrary code across all life is inherited from a common ancestor.
        - |
          There is only one code to read; the point is that bacteria and humans both use it. If the codes differed, the bacterial ribosome would produce the wrong protein.
        - |
          Insulin is a protein of 51 amino acids in two chains; it is made only by translating its gene.
        - |
          Plasmids are small DNA circles with no ribosomes. The host cell's ribosomes translate the inserted gene.
      answer: 0
      explanation: |
        Every recombinant-DNA product is a demonstration that the genetic code is universal. Universality has no chemical necessity, so it is best explained by descent from one ancestor.

    - slug: u07-w25-q14
      type: multiple_choice
      topic_code: "1.6"
      source: "Biology 2e §3.5 Nucleic Acids"
      points: 1
      prompt: |
        Review. DNA is the genetic material in every organism from bacteria to mammals, and in every one it is built from the same four nucleotides joined by phosphodiester bonds in antiparallel, complementary strands. Why does this fact serve as evidence for common ancestry rather than merely as a chemical convenience?
      options:
        - "Because DNA is the only molecule capable of storing information, every independent origin of life would have to use it."
        - "Because many other information-storing chemistries are possible, the use of the identical molecule and pairing rules by all life is best explained by inheritance from one ancestor."
        - "Because DNA is made by cells, and cells are all alike."
        - "Because the four bases are the most abundant molecules in the environment."
      option_explanations:
        - |
          RNA stores information too, and chemists have built other base pairs and backbones that work. Nothing forces every lineage to the same molecule.
        - |
          Correct. When a feature could have been otherwise and is nevertheless the same everywhere, the simplest explanation is that it was present once, in the common ancestor, and inherited by all descendants.
        - |
          Cells differ enormously; the point is that one specific molecular system is shared despite that diversity.
        - |
          Nucleotides are not abundant in the environment; organisms synthesise them. Abundance would not explain the identical pairing rules in any case.
      answer: 1
      explanation: |
        The strongest evidence for common ancestry is shared arbitrariness: the same DNA, the same code, the same ribosomes, where other solutions were possible.

    - slug: u07-w25-q15
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Cytochrome c carries electrons between complexes III and IV of the mitochondrial electron transport chain in every aerobic eukaryote. How does its role explain why its sequence has changed so slowly over a billion years?
      options:
        - "Proteins in mitochondria cannot mutate because mitochondrial DNA is protected."
        - "Almost any change to the residues that bind haem or dock with the complexes would stop electron transfer and be lethal, so selection removes most substitutions and only neutral ones accumulate."
        - "Cytochrome c is made of amino acids that cannot be replaced by any others."
        - "Electron transport does not depend on protein shape, so the sequence is irrelevant."
      option_explanations:
        - |
          Cytochrome c is encoded in the nucleus, and mitochondrial DNA mutates faster than nuclear DNA in any case. Protection from mutation is not the explanation.
        - |
          Correct. Strong purifying (stabilizing) selection on an essential protein keeps functional residues fixed; the differences we see are mostly at positions where substitutions are tolerated, which is why it ticks slowly and steadily.
        - |
          Every amino acid can be substituted chemically; whether the substitution survives depends on its effect on function, which is selection, not chemistry.
        - |
          Electron transfer depends precisely on shape: the haem must be held at the right distance and orientation to pass electrons. A misfolded cytochrome c does not work.
      answer: 1
      explanation: |
        Rate of molecular change reflects how much function constrains the molecule. Essential, shape-critical proteins change slowly, which makes them the rulers for deep relationships.

    - slug: u07-w25-q16
