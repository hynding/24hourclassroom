      prompt: |
        Select every feature that is shared by essentially all living organisms and therefore supports descent from a single common ancestor.
      options:
        - "DNA as the hereditary material"
        - "A nucleus enclosing the chromosomes"
        - "The same genetic code relating codons to amino acids"
        - "Ribosomes that translate mRNA into protein"
        - "Mitochondria for aerobic respiration"
      option_explanations:
        - |
          Correct. Bacteria, archaea and eukaryotes all store heredity in double-stranded DNA with the same base-pairing rules.
        - |
          Prokaryotes have no nucleus. The nucleus is a defining feature of the eukaryotic clade, which supports a common eukaryotic ancestor, not a common ancestor of all life.
        - |
          Correct. The same 64 codons mean the same amino acids in nearly every organism, with only minor variants; an arbitrary code shared universally points to one origin.
        - |
          Correct. Every cell has ribosomes built from rRNA and protein, with the same core structure and mechanism, which is why Woese could use rRNA to build the tree of all life.
        - |
          Mitochondria are found only in eukaryotes (and derive from an engulfed bacterium). They are evidence for the eukaryotic ancestor and for endosymbiosis, not for the ancestor of all life.
      answer: [0, 2, 3]
      explanation: |
        Sort shared features by the group that shares them: DNA, the code, ribosomes, ATP and glycolysis for all life; nucleus, mitochondria, linear chromosomes and introns for eukaryotes. The CED tests exactly this distinction.

    - slug: u07-w25-q17
      type: multi_select
      topic_code: "7.6"
      source: "Biology 2e §18.1 Understanding Evolution"
      points: 2
      partial_credit: true
      prompt: |
        Which statements correctly pair a line of evidence with what it shows? Select all that apply.
      options:
        - "Fossils in dated rock layers: lineages have changed form over long periods of time."
        - "Vestigial structures such as whale hind-limb bones: the species once had functioning versions inherited from an ancestor."
        - "Analogous structures such as insect and bird wings: the two groups share a recent common ancestor."
        - "Similar embryonic stages such as pharyngeal slits in all vertebrates: a shared developmental programme inherited from a common ancestor."
        - "Similar DNA sequences in two species: the species are closely related, with more similarity meaning a more recent common ancestor."
      option_explanations:
        - |
          Correct. Fossil sequences such as those of horses and whales record changes in form across millions of years and let the timing be measured by radiometric dating.
        - |
          Correct. A reduced, functionless structure makes sense only as a leftover from an ancestor in which it worked; it is a prediction of descent with modification.
        - |
          Analogous structures are products of convergent evolution in unrelated lineages. They are evidence of similar selection pressures, not of relatedness.
        - |
          Correct. Embryos of fish, birds and mammals pass through shared stages because they inherited the same developmental genes; the later divergence is where modification shows.
        - |
          Correct. Mutations accumulate with time, so sequence similarity decreases with time since the common ancestor; the pattern matches that from anatomy and fossils.
      answer: [0, 1, 3, 4]
      explanation: |
        Evolution rests on several independent lines of evidence that agree. The one trap is analogy: similar function from different parts says nothing about ancestry.

    - slug: u07-w25-q18
      type: true_false
      topic_code: "7.6"
      source: "Biology 2e §18.1 Understanding Evolution"
      points: 1
      prompt: |
        True or false: Gene duplication contributes to the evolution of new protein functions because one copy can continue to perform the original job while the other copy accumulates mutations that selection would otherwise have removed.
      answer: true
      explanation: |
        True. A duplicate is redundant, so mutations in it are not lethal and can be explored; occasionally one produces a useful new activity, which selection then keeps. Gene families such as the globins and the colour-vision opsins arose this way, and the shared duplicates found in related species are themselves evidence of common descent.

    - slug: u07-w25-q19
      type: true_false
      topic_code: "7.1"
      source: "Biology 2e §18.1 Understanding Evolution"
      points: 1
      prompt: |
        Review. True or false: The theory of evolution by natural selection explains how the first living cell arose from non-living matter.
      answer: false
      explanation: |
        False. Natural selection explains how populations change and species diversify once there are self-replicating entities with heritable variation; it does not address how the first such entity formed. The origin of life (week 27) is a separate question about chemistry, and it is a common exam trap to conflate the two. Once a heritable replicating system existed, selection would have applied to it.

    - slug: u07-w25-q20
      type: fill_blank
      topic_code: "7.6"
      source: "Biology 2e §18.1 Understanding Evolution"
      points: 1
      prompt: |
        The tiny pelvic bones inside a whale, the wings of a flightless cormorant and the leaf spines of a cactus are ____ structures: reduced remnants of parts that functioned in an ancestor.
      answer: ["vestigial"]
      explanation: |
        Vestigial structures are predicted by descent with modification and inexplicable without it: there is no reason to build a pelvis for an animal with no hind limbs unless the plan was inherited. "Homologous" describes correspondence between species, not reduction; "analogous" describes convergent similarity. Neither is accepted.

    - slug: u07-w25-q21
      type: fill_blank
      topic_code: "6.8"
      source: "Biology 2e §17.1 Biotechnology"
      points: 1
      prompt: |
        Review. Before a gene from a trace of tissue can be sequenced and compared with other species, it is usually amplified by repeated cycles of denaturation, primer annealing and DNA synthesis in a process called ____.
      answer: ["PCR", "polymerase chain reaction", "the polymerase chain reaction"]
      explanation: |
        PCR doubles the target DNA each cycle, so thirty cycles turn a few molecules into billions, enough to sequence. The sequences compared in BLAST and in molecular clocks are obtained this way. "Gel electrophoresis" separates fragments by size and "cloning" copies DNA in a host; neither is the amplification step asked for.

    - slug: u07-w25-q22
      type: numeric
      topic_code: "7.7"
      source: "general knowledge"
      points: 1
      prompt: |
        A 300-base region of a gene is aligned between two species and differs at 12 positions. What is the percent identity of the two sequences? Give a whole number.
      answer: { value: 96, tolerance: 0.5 }
      explanation: |
        Matching positions = 300 − 12 = 288. Percent identity = 288 / 300 × 100 = 96%. This is the measure BLAST reports; between two more distant species the same region might be 80% identical, and the ranking of identities is the ranking of relatedness. Compare like with like: the same gene, the same region, the same length.

    - slug: u07-w25-q23
      type: short_answer
      topic_code: "7.6"
      source: "Biology 2e §18.1 Understanding Evolution"
      points: 4
      prompt: |
        Scientific argumentation. Island groups far from any mainland have many endemic species (found nowhere else), and those species usually resemble species on the nearest mainland rather than species on similar islands elsewhere. (a) Explain how this pattern is predicted by evolution, naming the processes involved. (b) Describe what pattern would be expected instead if each species had been created separately for its habitat. (c) Identify one additional type of evidence that could test whether an island species is more closely related to the nearest mainland species than to a similar-looking species elsewhere.
      answer: |
        A few colonists from the nearest mainland reached the islands (founder effect), gene flow with the mainland then stopped, and drift and selection in the new environment produced new species that still carry the mainland lineage's features; endemism follows from isolation. If species were matched to habitats without ancestry, similar islands anywhere should hold the same or equally similar species regardless of the nearest mainland. DNA sequence comparison (or a conserved protein such as cytochrome c) would show more similarity to the nearest mainland species if the evolutionary explanation is right.
      explanation: |
        Four points.

        (a) 2 pts: 1 pt for colonisation from the nearest mainland by a small number of founders (founder effect) followed by isolation that cuts off gene flow; 1 pt for divergence on the islands by natural selection in the new environment and genetic drift, producing endemic species that nevertheless resemble their mainland ancestors because they descend from them. Both the source of the resemblance (descent from the nearest mainland) and the source of the difference (isolation plus selection or drift) are needed for full credit.

        (b) 1 pt: if each species were designed for its habitat independently, similar habitats on different islands should hold the same or equally similar species, with no relationship to the nearest mainland; resemblance would track habitat rather than geography.

        (c) 1 pt: comparison of DNA or protein sequences (accept a named gene such as cytochrome c or rRNA, or a BLAST comparison), predicting higher sequence similarity with the nearest mainland species than with the similar-looking species elsewhere. Accept the fossil record of the mainland showing the ancestral form, or shared vestigial or developmental features.

        Zero: explaining the resemblance by the island species migrating to the mainland, or by similar climates causing identical species to arise; answers that describe evidence without a prediction for part (c).

    - slug: u07-w25-q24
      type: short_answer
      topic_code: "7.8"
      source: "general knowledge"
      points: 4
      prompt: |
        Conceptual analysis. Farmers who use the same insecticide every season find it stops working within a few years, while farmers who alternate two insecticides with different modes of action keep both working much longer. (a) Explain, in terms of natural selection, why continuous use of one insecticide fails. (b) Explain why alternating insecticides slows the evolution of resistance. (c) Predict what would happen to the frequency of a resistance allele if the insecticide it resists were withdrawn for several years, and justify the prediction.
      answer: |
        Continuous use kills sensitive insects every generation, so the rare individuals carrying a resistance allele survive and reproduce and the allele spreads to fixation. Alternating chemicals changes the selection pressure: an allele for resistance to chemical A gives no advantage in seasons when B is used, and resistant insects are often slightly less fit without the chemical, so neither allele increases steadily. If the insecticide is withdrawn, the resistance allele should decline slowly because its carriers no longer have an advantage and may pay a fitness cost, but it will not disappear quickly and resistance will return fast if the chemical is reintroduced.
      explanation: |
        Four points.

        (a) 1 pt: the insecticide is a selection pressure; insects carrying pre-existing resistance alleles survive and reproduce while sensitive ones die, so the allele frequency rises each generation until most of the population is resistant. The answer must say the variation existed before use (or that the chemical selects rather than creates resistance).

        (b) 2 pts: 1 pt for the idea that the two chemicals select for different resistance alleles, so the allele favoured in one season is not favoured in the next and no single genotype is selected continuously; 1 pt for the role of fitness cost or relaxed selection: in seasons when a chemical is absent, its resistance allele confers no advantage and may lower fitness, so its frequency falls back, slowing the net increase. Accept an answer that an insect would need both resistance alleles to survive every season, which is much rarer.

        (c) 1 pt: the allele frequency declines gradually (not immediately to zero), because carriers lose their advantage and, if there is a fitness cost, are selected against; the allele persists at low frequency, often in heterozygotes, so resistance re-evolves quickly if spraying resumes. A prediction that the allele vanishes at once, or that it cannot change because the insects "no longer need it", earns nothing.

        Zero: describing insects as becoming immune through exposure, or treating resistance as a learned or acquired trait.

    - slug: u07-w25-q25
      type: long_answer
      topic_code: "7.8"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. A hospital tracked the proportion of Staphylococcus aureus infections caused by methicillin-resistant strains (MRSA). In year 5 it introduced a policy restricting antibiotic prescriptions to cases where they were clearly needed and requiring full courses. Samples of resistant isolates were also tested for a fitness cost by growing them with sensitive strains in antibiotic-free broth.

        | Year | Antibiotic prescriptions per 100 patients | MRSA as % of S. aureus infections |
        |---|---|---|
        | 1 | 62 | 18 |
        | 3 | 65 | 29 |
        | 5 (policy begins) | 64 | 41 |
        | 7 | 38 | 35 |
        | 9 | 36 | 27 |
        | 11 | 35 | 24 |

        In antibiotic-free broth, the resistant strain grew to 92% of the sensitive strain's density after 24 hours.

        (a) Identify the independent and dependent variables in the hospital data and describe the pattern before and after year 5.
        (b) Explain, using natural selection, why MRSA increased during years 1 to 5. Include where the resistance allele came from.
        (c) Explain why MRSA declined after the policy, using the broth result, and explain why the decline is slower than the rise.
        (d) The hospital's director concludes that MRSA will be eliminated by year 20 if the policy continues. Evaluate this claim, and propose one additional measure, justified by the mechanism of resistance spread, that would reduce MRSA further.
      answer: |
        IV: antibiotic prescribing rate (and year); DV: percentage of infections that are MRSA. MRSA rose from 18% to 41% while prescribing was high, then fell to 24% after prescribing dropped. Antibiotics killed sensitive S. aureus, so strains carrying the resistance gene (from mutation or acquired by horizontal transfer on a mobile element) survived and spread. With less antibiotic use the advantage disappeared and the 8% growth cost in drug-free conditions selects against resistant strains, but the cost is small so the decline is slow, and resistant strains persist. Elimination is unlikely: the cost is small, resistance alleles persist at low frequency, and new resistant strains can arrive from other hospitals or by gene transfer. Added measures: infection control (hand hygiene, isolation, screening) to cut transmission between patients, or rotating antibiotic classes.
      explanation: |
        Eight points.

        (a) 2 pts: 1 pt for the independent variable (antibiotic prescribing rate, or the policy, or year) and the dependent variable (percentage of S. aureus infections that are MRSA); 1 pt for the pattern with numbers: MRSA rose steadily from 18% to 41% during years 1 to 5 while prescribing stayed near 62 to 65 per 100, then fell to 35%, 27% and 24% after prescribing dropped to about 36 per 100.

        (b) 2 pts: 1 pt for the selection mechanism: antibiotics killed sensitive S. aureus and left resistant strains to reproduce and colonise patients, so the resistant fraction increased each year; 1 pt for the origin of resistance: the allele arose by random mutation or was acquired by horizontal gene transfer (plasmid, transduction or transformation) before or independent of the hospital's use, and antibiotics selected rather than caused it.

        (c) 2 pts: 1 pt for the explanation of the decline: with fewer prescriptions, resistant strains lose their advantage, and the broth result shows a fitness cost (92% of the sensitive strain's growth, an 8% disadvantage) so sensitive strains outcompete resistant ones where no antibiotic is present; 1 pt for why it is slower: the fitness cost (8%) is much smaller than the advantage under antibiotic treatment (sensitive strains are killed outright), and resistance alleles can persist in patients and on surfaces, so selection against resistance is weak. Accept mention of continued, though reduced, prescribing still selecting for resistance.

        (d) 2 pts: 1 pt for evaluating the claim: elimination by year 20 is not supported, because the decline is slowing (8, 8 then 3 percentage points), the fitness cost is small, resistance genes persist at low frequency and can spread horizontally, and resistant strains can be reintroduced by patients from elsewhere; extrapolating a trend to zero is unjustified. 1 pt for a mechanism-based measure: infection-control steps (hand hygiene, patient screening and isolation, surface cleaning) to reduce transmission of resistant strains between patients; or rotating antibiotics with different targets so no single resistance allele is continuously favoured; or using combination therapy; each must be linked to how resistance spreads or is selected.

        Zero for a part: describing bacteria as becoming resistant in response to need; attributing the decline to bacteria "forgetting" resistance; or proposing a measure (such as a new antibiotic) without explaining how it affects selection or transmission.
