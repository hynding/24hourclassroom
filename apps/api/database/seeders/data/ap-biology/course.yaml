# The AP Biology course map. Week files live under unit-NN-<slug>/week-NN.yaml.
# Titles and slugs are composed by Database\Seeders\ApBiology\Course from the
# numbers here, so nothing in a week file repeats the naming convention.
title: AP Biology
teacher: { name: "AP Biology Teacher", email: apbio@example.com }
student: { name: "AP Biology Student", email: apbio-student@example.com }
# Monday of week 1. Null means no due dates: the whole course is open at once.
# 35 weeks before the exam Monday (2027-05-03); weeks 33-34 review, 35 buffer,
# 36 exam week.
start_date: 2026-08-31
exam_date: 2027-05-03
subject: science
grade_level: "9-12"
review: { prep_guide_week: 33, practice_exam_week: 34 }
attribution: |
  Adapted from *Biology 2e* and *Biology for AP® Courses* by OpenStax, Rice
  University, licensed under CC BY 4.0
  (https://creativecommons.org/licenses/by/4.0/). Adapted from the original.
units:
  - number: 1
    slug: unit-01-chemistry-of-life
    title: Chemistry of Life
    weight: "8–11%"
    weeks: [1, 2, 3]
    topics:
      "1.1": Structure of Water and Hydrogen Bonding
      "1.2": Elements of Life
      "1.3": Introduction to Macromolecules
      "1.4": Carbohydrates
      "1.5": Lipids
      "1.6": Nucleic Acids
      "1.7": Proteins
  - number: 2
    slug: unit-02-cells
    title: Cells
    weight: "10–13%"
    weeks: [4, 5, 6, 7]
    topics:
      "2.1": Cell Structure and Function
      "2.2": Cell Size
      "2.3": Plasma Membrane
      "2.4": Membrane Permeability
      "2.5": Membrane Transport
      "2.6": Facilitated Diffusion
      "2.7": Tonicity and Osmoregulation
      "2.8": Mechanisms of Transport
      "2.9": Cell Compartmentalization
      "2.10": Origins of Cell Compartmentalization
  - number: 3
    slug: unit-03-cellular-energetics
    title: Cellular Energetics
    weight: "12–16%"
    weeks: [8, 9, 10, 11]
    topics:
      "3.1": Enzymes
      "3.2": Environmental Impacts on Enzyme Function
      "3.3": Cellular Energy
      "3.4": Photosynthesis
      "3.5": Cellular Respiration
  - number: 4
    slug: unit-04-cell-communication-and-cell-cycle
    title: Cell Communication and Cell Cycle
    weight: "10–15%"
    weeks: [12, 13, 14]
    topics:
      "4.1": Cell Communication
      "4.2": Introduction to Signal Transduction
      "4.3": Signal Transduction Pathways
      "4.4": Feedback
      "4.5": Cell Cycle
      "4.6": Regulation of Cell Cycle
  - number: 5
    slug: unit-05-heredity
    title: Heredity
    weight: "8–11%"
    weeks: [15, 16, 17]
    topics:
      "5.1": Meiosis
      "5.2": Meiosis and Genetic Diversity
      "5.3": Mendelian Genetics
      "5.4": Non-Mendelian Genetics
      "5.5": Environmental Effects on Phenotype
  - number: 6
    slug: unit-06-gene-expression-and-regulation
    title: Gene Expression and Regulation
    weight: "12–16%"
    weeks: [18, 19, 20, 21, 22]
    topics:
      "6.1": DNA and RNA Structure
      "6.2": DNA Replication
      "6.3": Transcription and RNA Processing
      "6.4": Translation
      "6.5": Regulation of Gene Expression
      "6.6": Gene Expression and Cell Specialization
      "6.7": Mutations
      "6.8": Biotechnology
  - number: 7
    slug: unit-07-natural-selection
    title: Natural Selection
    weight: "13–20%"
    weeks: [23, 24, 25, 26, 27]
    topics:
      "7.1": Introduction to Natural Selection
      "7.2": Natural Selection
      "7.3": Artificial Selection
      "7.4": Population Genetics
      "7.5": Hardy-Weinberg Equilibrium
      "7.6": Evidence of Evolution
      "7.7": Common Ancestry
      "7.8": Continuing Evolution
      "7.9": Phylogeny
      "7.10": Speciation
      "7.11": Variations in Populations
      "7.12": Origins of Life on Earth
  - number: 8
    slug: unit-08-ecology
    title: Ecology
    weight: "10–15%"
    weeks: [28, 29, 30, 31, 32]
    topics:
      "8.1": Responses to the Environment
      "8.2": Energy Flow Through Ecosystems
      "8.3": Population Ecology
      "8.4": Effect of Density on Populations
      "8.5": Community Ecology
      "8.6": Biodiversity
      "8.7": Disruptions in Ecosystems
