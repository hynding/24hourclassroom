week: 17
unit: 5
title: Non-Mendelian Genetics and Environmental Effects
topics: ["5.4", "5.5"]
guide: guides/week-17.md
guide_description: |
  Every way real genes break Mendel's simplifications: incomplete dominance, codominance, multiple alleles,
  X-linkage, linked genes and recombination mapping, epistasis, lethal alleles and non-nuclear inheritance; then
  how the environment shapes phenotype. Three worked examples (Morgan's linkage data to a map distance, ordering
  three genes, an X-linked pedigree), misconceptions, self-check.
flashcards_description: |
  33 cards: the dominance relationships, blood groups, sex linkage, linkage and mapping with the recombination
  equation, epistatic ratios, organelle inheritance, X inactivation, and the environmental effects on phenotype.

flashcards:
  - front: Incomplete dominance → heterozygote phenotype and F2 ratio
    back: |
      The heterozygote is intermediate: red × white snapdragons give pink. Selfing pink gives 1 red : 2 pink : 1 white, so the phenotype ratio equals the genotype ratio.
    topic_code: "5.4"
  - front: Codominance → heterozygote phenotype and an example
    back: |
      Both alleles are fully expressed at once: a person with alleles Lᴹ and Lᴺ makes both M and N antigens on red cells; type AB blood shows both A and B antigens. Still 1:2:1 in the F2.
    topic_code: "5.4"
  - front: How to tell incomplete dominance from codominance
    back: |
      Look at the heterozygote: a blend (pink, intermediate enzyme level) is incomplete dominance; both parental products present and distinguishable (two antigens, red and white patches) is codominance.
    topic_code: "5.4"
  - front: Multiple alleles → the population-level idea
    back: |
      A gene can have more than two alleles in a population, though any diploid individual carries only two. Dominance can form a series, as in rabbit coat colour: C⁺ > cᶜʰ > cʰ > c.
    topic_code: "5.4"
  - front: ABO blood groups → the alleles and the six genotypes
    back: |
      Three alleles: Iᴬ and Iᴮ are codominant with each other and both dominant to i. Genotypes IᴬIᴬ and Iᴬi give A; IᴮIᴮ and Iᴮi give B; IᴬIᴮ gives AB; ii gives O.
    hint: Codominance and complete dominance in one gene.
    topic_code: "5.4"
  - front: Allelic series in rabbit coat colour
    back: |
      Four alleles: wild type C⁺ (full colour) is dominant to all; chinchilla cᶜʰ is incompletely dominant over Himalayan cʰ and albino c; Himalayan is dominant to albino. A heterozygote's phenotype depends on which two it holds.
    topic_code: "5.4"
  - front: Sex-linked (X-linked) gene
    back: |
      A gene on the X chromosome with no counterpart on the Y. Females (XX) have two copies; males (XY) have one, so father-to-son transmission of an X-linked allele is impossible.
    topic_code: "5.4"
  - front: Hemizygous
    back: |
      Having only one copy of a gene, as a male does for every X-linked gene. Whatever allele is on his single X is expressed; dominant and recessive do not apply to him.
    topic_code: "5.4"
  - front: Why X-linked recessive traits appear more often in males
    back: |
      A male needs only one recessive X to show the trait; a female needs two. If an allele has frequency q, affected males are q of the population and affected females q².
    topic_code: "5.4"
  - front: Reciprocal crosses → why they differ for X-linked genes
    back: |
      White-eyed male × red-eyed female: all F1 red. Red-eyed male × white-eyed female: F1 females red (carriers), F1 males white, because sons get their only X from the mother. Autosomal genes give the same F1 either way.
    topic_code: "5.4"
  - front: X-linked recessive in a pedigree → the giveaways
    back: |
      Far more affected males than females; affected males have carrier mothers and usually unaffected parents; an affected father never passes the trait to a son; an affected female must have an affected father.
    topic_code: "5.4"
  - front: Carrier female × unaffected male for an X-linked recessive → the offspring
    back: |
      Xᴬ Xᵃ × Xᴬ Y: daughters 1/2 Xᴬ Xᴬ, 1/2 Xᴬ Xᵃ (all unaffected); sons 1/2 Xᴬ Y, 1/2 Xᵃ Y (half affected). Across all children, 1/4 affected, all of them sons.
    topic_code: "5.4"
  - front: Linked genes
    back: |
      Genes close together on the same chromosome, inherited together more often than independent assortment predicts. They give an excess of parental combinations in a test cross.
    topic_code: "5.4"
  - front: Parental vs recombinant offspring
    back: |
      Parental: the allele combination one of the heterozygote's chromosomes carried. Recombinant: a new combination made by crossing over between the two genes. Recombinants are always the two smaller classes.
    topic_code: "5.4"
  - front: Recombination frequency → equation
    back: |
      Recombination frequency = number of recombinant offspring ÷ total offspring × 100%. From a test cross of a dihybrid, the recombinants are the two least frequent classes.
    hint: Recombinants over total, times 100.
    topic_code: "5.4"
  - front: Map unit (centimorgan)
    back: |
      A 1% recombination frequency = 1 map unit (1 cM). Distances are roughly additive along a chromosome, so pairwise frequencies can be used to order genes.
    topic_code: "5.4"
  - front: Why can recombination frequency never exceed 50%?
    back: |
      Genes on different chromosomes give 50% recombinants by independent assortment, and genes very far apart on one chromosome also reach 50% because multiple crossovers scramble them. 50% means unlinked; it does not say which chromosome.
    topic_code: "5.4"
  - front: Ordering three genes from pairwise recombination frequencies
    back: |
      The largest frequency is between the two outer genes; the middle gene is the one whose distances to the others add up to the largest. A–B 12, B–C 8, A–C 20 gives order A–B–C.
    topic_code: "5.4"
  - front: Epistasis
    back: |
      One gene masks or modifies the expression of another, independently assorting gene. It changes the phenotype ratio of a dihybrid cross from 9:3:3:1 to a variant that still sums to 16, such as 9:3:4 or 12:3:1.
    topic_code: "5.4"
  - front: Recessive epistasis in mouse coat colour → genes and 9:3:4
    back: |
      Gene C makes pigment; cc mice are albino whatever their A genotype. Gene A gives agouti (A_) or solid black (aa). AaCc × AaCc gives 9 agouti : 3 black : 4 albino.
    topic_code: "5.4"
  - front: Dominant epistasis in summer squash → 12:3:1
    back: |
      Any W allele gives white fruit regardless of gene Y; ww Y_ gives yellow and wwyy gives green. WwYy × WwYy gives 12 white : 3 yellow : 1 green.
    topic_code: "5.4"
  - front: Recessive lethal allele → ratio among living offspring
    back: |
      A heterozygote × heterozygote cross produces 1:2:1 at fertilisation, but the homozygous recessive class dies, so the survivors show 2:1 (or 2/3 heterozygotes). Example: yellow coat in mice.
    topic_code: "5.4"
  - front: Non-nuclear (extranuclear) inheritance → where the genes are
    back: |
      Mitochondria and chloroplasts carry their own small circular genomes. Their traits do not follow Mendel's laws because the organelles are inherited with the cytoplasm, almost always from the egg.
    topic_code: "5.4"
  - front: Why mitochondrial traits pass only from mother to child
    back: |
      The egg contributes the zygote's cytoplasm and mitochondria; the sperm contributes almost none. An affected mother passes the trait to all her children; an affected father passes it to none.
    hint: Maternal inheritance.
    topic_code: "5.4"
  - front: Chloroplast inheritance in variegated four o'clock plants
    back: |
      Seeds take their chloroplasts from the egg, so the phenotype of the offspring depends only on which branch (green, white or variegated) bore the flower that made the seed, not on the pollen.
    topic_code: "5.4"
  - front: X inactivation and the Barr body
    back: |
      In each cell of a female mammal one X is condensed into an inactive Barr body early in development, at random, and the choice is inherited by that cell's descendants. It equalises X-linked gene dosage with XY males.
    topic_code: "5.4"
  - front: Tortoiseshell cats → why almost all are female
    back: |
      Orange and black are alleles of an X-linked gene. A heterozygous female shows patches of each colour, depending on which X is active in each patch's founder cell. A male has only one X and so only one colour.
    topic_code: "5.4"
  - front: Polygenic inheritance → the phenotype distribution
    back: |
      Many genes each add a small effect, so the population shows continuous variation in a bell-shaped distribution (height, skin colour), widened further by the environment.
    topic_code: "5.5"
  - front: Phenotypic plasticity
    back: |
      The ability of one genotype to produce different phenotypes in different environments. Phenotype = genotype + environment + their interaction.
    topic_code: "5.5"
  - front: Temperature-sensitive allele → Himalayan rabbit and Siamese cat
    back: |
      The cʰ allele encodes a pigment enzyme (tyrosinase) that works only below about 35 °C, so pigment forms on the cool extremities (ears, nose, paws, tail) and not on the warm trunk. Chill a shaved patch and it regrows dark.
    topic_code: "5.5"
  - front: Hydrangea flower colour → the environmental variable
    back: |
      Soil pH. In acidic soil aluminium is soluble, taken up and turns the flowers blue; in neutral or alkaline soil the same plant produces pink flowers. Same genotype, different phenotype.
    topic_code: "5.5"
  - front: Temperature-dependent sex determination
    back: |
      In many turtles, crocodilians and some lizards the incubation temperature of the egg, not a sex chromosome, decides whether the embryo becomes male or female. A warming climate can skew sex ratios.
    topic_code: "5.5"
  - front: Seasonal coat colour in the arctic fox and snowshoe hare
    back: |
      Day length and temperature trigger a change from brown summer fur to white winter fur. The genotype is constant; the environment switches which pigment genes are expressed.
    topic_code: "5.5"

quiz:
  description: |
    25 questions · about 30 minutes · about 70% non-Mendelian genetics and environmental effects on phenotype
    (5.4, 5.5) and 30% review of Mendelian genetics, meiosis, enzymes, pH and the plasma membrane. Multiple choice,
    select-all, true/false and numeric items are graded at once; the fill-in-the-blank items are matched
    automatically; the two short answers and the long answer are graded by your teacher against the
    acceptable-answer summary.
  questions:
    - slug: u05-w17-q01
      type: multiple_choice
      topic_code: "5.4"
      source: "Biology 2e §12.2 Characteristics and Traits"
      points: 1
      prompt: |
        A red-flowered snapdragon crossed with a white-flowered one gives all pink F1 plants. When the pink plants are self-crossed, which F2 result is expected and why?
      options:
        - "3 pink : 1 white, because pink is dominant to white."
        - "1 red : 2 pink : 1 white, because neither allele masks the other and each genotype has its own phenotype."
        - "All pink, because the alleles have blended permanently."
        - "9 red : 3 pink : 4 white, because a second gene is epistatic to flower colour."
      option_explanations:
        - |
          Pink is not an allele; it is the heterozygote's phenotype. A 3:1 ratio would require one of the two parental alleles to mask the other, which the pink F1 shows is not the case.
        - |
          Correct. With incomplete dominance the heterozygote (CᴿCᵂ) is intermediate, so the 1:2:1 genotype ratio of a monohybrid cross is visible directly as 1 red : 2 pink : 1 white.
        - |
          The return of pure red and pure white plants in the F2 shows the alleles did not blend; the pink heterozygote simply makes half as much red pigment.
        - |
          A single gene with two alleles is enough to explain the data; 9:3:4 arises from two interacting genes in a dihybrid cross.
      answer: 1
      explanation: |
        Incomplete dominance is still Mendelian segregation; what changes is that the heterozygote can be told apart, so the genotype ratio shows through.

    - slug: u05-w17-q02
      type: multiple_choice
      topic_code: "5.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A mother with blood type A and a father with blood type B have a child with blood type O. What are the parents' genotypes, and what is the probability that their next child has type AB?
      options:
        - "IᴬIᴬ and IᴮIᴮ; probability 1"
        - "Iᴬi and Iᴮi; probability 1/4"
        - "Iᴬi and Iᴮi; probability 1/2"
        - "IᴬIᴮ and ii; probability 0"
      option_explanations:
        - |
          Homozygous A and B parents could produce only IᴬIᴮ (type AB) children; the type O child (ii) proves each parent carries a recessive i allele.
        - |
          Correct. The O child received i from each parent, so the parents are Iᴬi and Iᴮi. Their gametes are Iᴬ or i and Iᴮ or i, giving IᴬIᴮ (AB), Iᴬi (A), Iᴮi (B) and ii (O), each with probability 1/4.
        - |
          The genotypes are right, but AB requires the Iᴬ gamete and the Iᴮ gamete to meet: 1/2 × 1/2 = 1/4, not 1/2.
        - |
          A person with IᴬIᴮ has type AB, not type A, and a person with ii has type O, not type B; these genotypes contradict the parents' phenotypes.
      answer: 1
      explanation: |
        The ABO gene shows both codominance (Iᴬ with Iᴮ) and complete dominance (each over i). A recessive child always reveals a hidden i in both parents.

    - slug: u05-w17-q03
      type: multiple_choice
      topic_code: "5.4"
      source: "Biology 2e §12.2 Characteristics and Traits"
      points: 1
      prompt: |
        In fruit flies, white eye colour is an X-linked recessive trait. A white-eyed female is crossed with a red-eyed male. Which description of the F1 is correct?
      options:
        - "All F1 flies are red-eyed, because red is dominant."
        - "All F1 females are red-eyed and all F1 males are white-eyed."
        - "All F1 females are white-eyed and all F1 males are red-eyed."
        - "Half of each sex is red-eyed and half white-eyed."
      option_explanations:
        - |
          Red is dominant, but the sons inherit their only X chromosome from their white-eyed mother and have no second allele to mask it, so they are white-eyed.
        - |
          Correct. Daughters receive Xᵂ from the father and Xʷ from the mother (heterozygous, red); sons receive the mother's Xʷ and the father's Y, so they are hemizygous for white.
        - |
          This is reversed: the daughters get the father's dominant Xᵂ and are red-eyed; the sons get only the mother's recessive X.
        - |
          A 1:1 split within each sex would require the mother to be heterozygous; she is white-eyed and therefore homozygous recessive, so every son is affected.
      answer: 1
      explanation: |
        This is Morgan's reciprocal cross, and it is the exam's favourite way to test whether you know that sons get their X from their mother and nothing X-linked from their father.

    - slug: u05-w17-q04
      type: multiple_choice
      topic_code: "5.4"
      source: "Biology 2e §12.3 Laws of Inheritance"
      points: 1
      prompt: |
        In mice, gene C is needed to make any pigment (cc mice are albino), and gene A determines agouti (A_) versus solid black (aa) in pigmented mice. Two AaCc mice are crossed. Which phenotype ratio is expected among the offspring, and why does it differ from 9:3:3:1?
      options:
        - "9 agouti : 3 black : 4 albino, because the cc genotype masks whatever gene A would have produced, merging two of the four classes."
        - "9 agouti : 3 black : 3 albino : 1 white, because there are two recessive phenotypes."
        - "12 agouti : 3 black : 1 albino, because A is dominant over C."
        - "1 agouti : 1 black : 1 albino, because the genes are linked."
      option_explanations:
        - |
          Correct. The 3/16 A_cc class and the 1/16 aacc class both lack pigment and look identical, so the albino class is 3 + 1 = 4/16. Gene C is epistatic to gene A.
        - |
          There is no separate "white" class; both genotypes without a functional C allele are albino, so the last two Mendelian classes merge rather than remaining distinct.
        - |
          The 12:3:1 pattern is dominant epistasis, where one dominant allele masks the other gene (summer squash). Here the masking genotype is the recessive cc, giving 9:3:4.
        - |
          The genes assort independently; the ratio sums to 16 as in any dihybrid cross. Linkage would produce an excess of parental combinations, not a simple three-class ratio.
      answer: 0
      explanation: |
        Epistasis does not break independent assortment; it changes how genotypes map onto phenotypes. Any modified ratio that sums to 16 is a merged 9:3:3:1.

    - slug: u05-w17-q05
      type: multiple_choice
      topic_code: "5.4"
      source: "Biology 2e §13.1 Chromosomal Theory and Genetic Linkage"
      points: 1
      stimulus: |
        Morgan's group crossed true-breeding gray-bodied, normal-winged fruit flies (b⁺b⁺ vg⁺vg⁺) with black-bodied, vestigial-winged flies (bb vgvg). The F1 females (b⁺b vg⁺vg) were then test-crossed to black, vestigial males and 2,300 offspring were scored.

        | Offspring phenotype | Number |
        |---|---|
        | Gray body, normal wings | 965 |
        | Black body, vestigial wings | 944 |
        | Gray body, vestigial wings | 206 |
        | Black body, normal wings | 185 |
        | Total | 2,300 |
      prompt: |
        Which offspring classes are recombinant, and what does their frequency indicate about the two genes?
      options:
        - "Gray-normal and black-vestigial; their high frequency shows the genes assort independently."
        - "Gray-vestigial and black-normal; their low frequency shows the genes are linked on the same chromosome, with occasional crossing over between them."
        - "Gray-vestigial and black-normal; their low frequency shows the genes are on different chromosomes."
        - "Every class is recombinant, because the F1 females were heterozygous."
      option_explanations:
        - |
          Gray-normal and black-vestigial are the combinations the F1 females inherited from their parents, so they are the parental classes; their excess is the opposite of independent assortment.
        - |
          Correct. The two rare classes carry allele combinations neither parental chromosome had, so they were made by crossing over. Independent assortment would give all four classes at about 575 each; the deficit of recombinants means the genes travel together.
        - |
          Genes on different chromosomes recombine freely at metaphase I and give 50% recombinants, about 1,150 here, not 391.
        - |
          Heterozygosity makes recombination detectable; it does not make every offspring recombinant. Only the classes with new combinations count.
      answer: 1
      explanation: |
        Parental classes are the big ones, recombinant classes the small ones; a recombinant frequency well below 50% is the definition of linkage.

    - slug: u05-w17-q06
      type: numeric
      topic_code: "5.4"
      source: "Biology 2e §13.1 Chromosomal Theory and Genetic Linkage"
      points: 1
      stimulus: |
        Morgan's group crossed true-breeding gray-bodied, normal-winged fruit flies (b⁺b⁺ vg⁺vg⁺) with black-bodied, vestigial-winged flies (bb vgvg). The F1 females (b⁺b vg⁺vg) were then test-crossed to black, vestigial males and 2,300 offspring were scored.

        | Offspring phenotype | Number |
        |---|---|
        | Gray body, normal wings | 965 |
        | Black body, vestigial wings | 944 |
        | Gray body, vestigial wings | 206 |
        | Black body, normal wings | 185 |
        | Total | 2,300 |
      prompt: |
        Calculate the recombination frequency between the body-colour and wing-shape genes as a percentage, to one decimal place.
      answer: { value: 17.0, tolerance: 0.5 }
      explanation: |
        Recombinants = 206 + 185 = 391. Recombination frequency = 391 ÷ 2,300 × 100 = 17.0%. The two genes are therefore about 17 map units apart on chromosome 2, which matches the published positions of 48.5 and 65.5 cM.

    - slug: u05-w17-q07
      type: multiple_choice
      topic_code: "5.4"
      source: "Biology 2e §13.1 Chromosomal Theory and Genetic Linkage"
      points: 1
      stimulus: |
        Morgan's group crossed true-breeding gray-bodied, normal-winged fruit flies (b⁺b⁺ vg⁺vg⁺) with black-bodied, vestigial-winged flies (bb vgvg). The F1 females (b⁺b vg⁺vg) were then test-crossed to black, vestigial males and 2,300 offspring were scored.

        | Offspring phenotype | Number |
        |---|---|
        | Gray body, normal wings | 965 |
        | Black body, vestigial wings | 944 |
        | Gray body, vestigial wings | 206 |
        | Black body, normal wings | 185 |
        | Total | 2,300 |
      prompt: |
        If the same cross had been performed with F1 females in which the two parental chromosomes carried b⁺ vg and b vg⁺ (the alleles in the opposite arrangement), which result would be expected?
      options:
        - "The same four classes in the same numbers, because the genes are the same distance apart."
        - "Gray-vestigial and black-normal would now be the large parental classes and gray-normal and black-vestigial the small recombinant classes, with about 17% recombinants."
        - "All four classes at about 575 each, because changing the arrangement unlinks the genes."
        - "Only gray-vestigial and black-normal offspring, because no crossing over would be possible."
      option_explanations:
        - |
          The distance, and so the recombination frequency, would be unchanged, but which combinations count as parental depends on what the heterozygote's chromosomes carry, so the large and small classes swap identities.
        - |
          Correct. Parental means the combination present on the F1's chromosomes. With b⁺ vg on one homologue and b vg⁺ on the other, those are the common classes and the crossover products (b⁺ vg⁺ and b vg) are the rare 17%.
        - |
          Linkage is a property of physical distance on the chromosome, not of which alleles happen to be together; the recombination frequency stays at 17%.
        - |
          Crossing over depends on the chromosomes pairing, not on the allele arrangement; recombinants still appear at the same frequency.
      answer: 1
      explanation: |
        Recombination frequency measures distance; which classes are "parental" is set by the parents. Always identify the heterozygote's chromosomes before labelling the classes.

    - slug: u05-w17-q08
      type: multiple_choice
      topic_code: "5.4"
      source: "Biology 2e §13.1 Chromosomal Theory and Genetic Linkage"
      points: 1
      prompt: |
        Three genes on one chromosome show these recombination frequencies in test crosses: x–y 5%, y–z 12%, x–z 7%. Which gene order is consistent with the data?
      options:
        - "x – y – z"
        - "y – x – z"
        - "x – z – y, with y and z on different chromosomes"
        - "The order cannot be determined because the frequencies do not add exactly"
      option_explanations:
        - |
          If y were in the middle, x–z would be the largest distance (5 + 12 = 17), but x–z is only 7; the data do not fit this order.
        - |
          Correct. The largest frequency (y–z, 12) is between the outer genes, so x is in the middle: y to x is 5 and x to z is 7, and 5 + 7 = 12 matches y–z.
        - |
          All three frequencies are below 50%, so all three genes are linked on one chromosome; and with z in the middle, x–y would be the largest distance, which it is not.
        - |
          The frequencies do add here (5 + 7 = 12), and even when double crossovers make the sums slightly short, the largest pairwise distance still identifies the outer genes.
      answer: 1
      explanation: |
        Map distances are additive: find the largest pairwise frequency, put those two genes on the outside, and the third gene sits between them.

    - slug: u05-w17-q09
      type: multiple_choice
      topic_code: "5.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A disorder is caused by a mutation in mitochondrial DNA. Which pattern in a pedigree is consistent with this, and why?
      options:
        - "An affected mother passes the disorder to all her children, and an affected father passes it to none, because mitochondria come from the egg's cytoplasm."
        - "Only sons are affected, because the mutation is carried on the Y chromosome."
        - "The disorder appears in a 3:1 ratio among the children of two carriers, because it is autosomal recessive."
        - "An affected father passes the disorder to all his daughters, because mitochondrial genes are X-linked."
      option_explanations:
        - |
          Correct. The zygote's mitochondria are essentially all from the egg; sperm contribute almost none. The trait therefore follows the maternal line without regard to sex and without Mendelian ratios.
        - |
          The Y chromosome carries nuclear genes passed father to son; mitochondrial DNA is in the cytoplasm and passes mother to child of either sex.
        - |
          A 3:1 ratio requires two nuclear alleles segregating at meiosis; organelle genomes are not distributed by the spindle and do not give Mendelian ratios.
        - |
          Mitochondrial genes are not on any chromosome; an affected father transmits them to no one, daughters included.
      answer: 0
      explanation: |
        Mendel's laws describe nuclear chromosomes moved by the spindle. Organelle genomes ride in the cytoplasm, so their inheritance follows the egg.

    - slug: u05-w17-q10
      type: multiple_choice
      topic_code: "5.5"
      source: "Biology 2e §12.2 Characteristics and Traits"
      points: 1
      prompt: |
        A Himalayan rabbit (white body, black ears, nose, paws and tail) has a patch of fur shaved from its back; an ice pack is strapped over the patch while the fur regrows. The new fur on the patch is black. Which conclusion is best supported?
      options:
        - "The cold caused a mutation in the pigment gene of the skin cells."
        - "The pigment enzyme encoded by the rabbit's allele is active only at low temperature, so the phenotype of a region depends on its temperature, not on a change in genotype."
        - "The rabbit was heterozygous, and the cold allowed the recessive allele to be expressed."
        - "Black fur is the rabbit's true phenotype and white fur is an artefact of shaving."
      option_explanations:
        - |
          A mutation would be random and would not reliably produce black in every chilled patch; the effect is reversible and predictable, which points to regulation of an existing enzyme.
        - |
          Correct. The cʰ allele's tyrosinase is heat-sensitive: it works below about 35 °C, so the extremities are dark and the warm trunk is white. Cooling the trunk lets the enzyme work there. Same genotype, different phenotype.
        - |
          The experiment did not change which alleles were present; it changed temperature. Dominance relationships do not depend on the weather.
        - |
          Shaving an unchilled patch regrows white fur; the chilled patch is the one that differs, so the temperature, not the shaving, is responsible.
      answer: 1
      explanation: |
        Phenotype = genotype + environment. The Himalayan allele is the textbook case of an environmental variable (temperature) acting through a protein's stability.

    - slug: u05-w17-q11
      type: multiple_choice
      topic_code: "5.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Cuttings taken from a single hydrangea plant were rooted and grown in two soils. In soil at pH 5, the plants produced blue flowers; in soil at pH 7, pink flowers. Which conclusion is justified, and what does it illustrate?
      options:
        - "The cuttings had different genotypes, so the flower colours are inherited."
        - "The plants share one genotype, so the difference in flower colour is caused by the environment; the same genotype can produce different phenotypes."
        - "Low pH mutated the flower-colour gene, which is why the blue colour is permanent."
        - "Flower colour in hydrangeas is controlled by a dominant blue allele that is only expressed in acid."
      option_explanations:
        - |
          Cuttings from one plant are clones with identical genotypes; genotype cannot be the variable, which is what makes the experiment informative.
        - |
          Correct. With genotype held constant, the only variable is the soil, and the phenotype tracked it. In acidic soil aluminium is soluble and taken up, turning the pigment blue; the effect reverses if the soil is limed.
        - |
          The colour change is reversible when soil pH is changed, which a mutation would not be; and a mutation would not strike every cutting identically.
        - |
          Alleles do not switch between dominant and recessive with pH; the plants all have the same alleles, and it is the chemical environment of the pigment that differs.
      answer: 1
      explanation: |
        Clones in different conditions are the clean test of an environmental effect: when genotype is constant, any phenotypic difference is environmental.

    - slug: u05-w17-q12
      type: multiple_choice
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. A student tests whether the F2 of a snapdragon cross fits a 1 red : 2 pink : 1 white ratio. Observed counts are 28 red, 61 pink and 31 white. Which statement about the chi-square test is correct?
      options:
        - "There are three classes, so df = 2 and the critical value at p = 0.05 is 5.99; expected counts are 30, 60 and 30."
        - "There are three classes, so df = 3 and the critical value at p = 0.05 is 7.81; expected counts are 40, 40 and 40."
        - "There are 120 offspring, so df = 119 and the test cannot be done without a larger table."
        - "The expected counts are 28, 61 and 31 because the expected values are taken from the data."
      option_explanations:
        - |
          Correct. df = classes − 1 = 2, critical value 5.99. Expected = 120 × 1/4, 2/4, 1/4 = 30, 60, 30. χ² = 4/30 + 1/60 + 1/30 = 0.18, far below 5.99, so the 1:2:1 hypothesis is not rejected.
        - |
          Degrees of freedom are one fewer than the number of classes, and the expected values come from the 1:2:1 ratio, not from an even split.
        - |
          Degrees of freedom depend on the number of categories, not on the number of individuals; large samples are what make the test reliable.
        - |
          Expected counts always come from the hypothesis. Using the observed values as expected would give χ² = 0 for every data set and make the test meaningless.
      answer: 0
      explanation: |
        The chi-square recipe does not change with the inheritance pattern: expected from the hypothesised ratio, df from the number of classes, compare with the table.

    - slug: u05-w17-q13
      type: multiple_choice
      topic_code: "5.2"
      source: "Biology 2e §13.1 Chromosomal Theory and Genetic Linkage"
      points: 1
      prompt: |
        Review. The recombinant offspring in a test cross of linked genes exist because of an event in the heterozygous parent's meiosis. Which description of that event is correct?
      options:
        - "Sister chromatids exchange segments during prophase II."
        - "Non-sister chromatids of homologous chromosomes exchange segments during prophase I, producing chromatids with new allele combinations."
        - "Homologous chromosomes orient independently at metaphase I."
        - "The two genes are on different chromosomes that are randomly distributed at anaphase I."
      option_explanations:
        - |
          Sister chromatids are identical, so an exchange between them changes nothing; and homologues are not paired in prophase II.
        - |
          Correct. Crossing over in prophase I between non-sister chromatids breaks and rejoins DNA at matching positions; if the break falls between two linked genes, the resulting chromatids carry one allele from each parental chromosome.
        - |
          Independent assortment produces new combinations of genes on different chromosomes; for linked genes on the same chromosome it does nothing, which is why they are linked.
        - |
          The genes in a linkage test are on the same chromosome by definition; recombinants between them require a physical exchange, not independent assortment.
      answer: 1
      explanation: |
        Week 15's crossing over is week 17's recombination frequency. The further apart two genes are, the more often a prophase I exchange falls between them.

    - slug: u05-w17-q14
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The tyrosinase enzyme encoded by the Himalayan allele converts tyrosine to melanin at 30 °C but not at 38 °C, whereas the wild-type enzyme works at both temperatures. Which explanation is most consistent with what you know about enzymes?
      options:
        - "At 38 °C the substrate tyrosine breaks down before the enzyme can act on it."
        - "The mutant enzyme's tertiary structure is held by weaker interactions, so the warmer temperature disrupts the active site's shape and the enzyme is denatured, while the wild-type fold remains stable."
        - "Higher temperature lowers the kinetic energy of molecules, so collisions between enzyme and substrate become too rare."
        - "At 38 °C the mutant enzyme works faster, using up all the tyrosine so no melanin can form."
      option_explanations:
        - |
          Tyrosine is a stable amino acid at body temperature; the wild-type enzyme makes melanin from it at 38 °C, so the substrate is not the limit.
        - |
          Correct. A substitution in the enzyme has weakened the hydrogen bonds or hydrophobic interactions that hold its shape; above a threshold the active site unfolds and the catalyst stops working. The threshold happens to fall between the temperature of the extremities and that of the trunk.
        - |
          Warming raises kinetic energy and collision frequency; rates rise with temperature until the enzyme denatures. The direction of this option is reversed.
        - |
          If the enzyme worked faster at 38 °C, more melanin, not less, would form; and the trunk, the warmest region, is the region with no pigment.
      answer: 1
      explanation: |
        Unit 3's enzyme biology explains a Unit 5 phenotype: a temperature-sensitive protein makes the environment part of the genotype-to-phenotype pathway.

    - slug: u05-w17-q15
      type: multiple_choice
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        Review. Hydrangeas flower blue in soil at pH 5 and pink in soil at pH 7, because aluminium ions dissolve from soil minerals in acid and are taken up by the roots. By what factor does the hydrogen ion concentration differ between the two soils, and which is more acidic?
      options:
        - "The pH 5 soil has 2 times the hydrogen ion concentration of the pH 7 soil and is more acidic."
        - "The pH 5 soil has 100 times the hydrogen ion concentration of the pH 7 soil and is more acidic."
        - "The pH 7 soil has 100 times the hydrogen ion concentration of the pH 5 soil and is more acidic."
        - "The two soils have the same hydrogen ion concentration; pH measures only dissolved aluminium."
      option_explanations:
        - |
          The pH scale is logarithmic: each unit is a tenfold change in [H⁺], so two units is 10 × 10 = 100, not 2.
        - |
          Correct. pH = −log₁₀[H⁺]; pH 5 is 10⁻⁵ M and pH 7 is 10⁻⁷ M, a hundredfold difference, and the lower pH is the more acidic. The extra H⁺ displaces aluminium from soil particles into solution.
        - |
          Lower pH means more hydrogen ions, not fewer; pH 7 is neutral and pH 5 is acidic.
        - |
          pH measures hydrogen ion concentration directly; the aluminium is a consequence of the acidity, not what pH reports.
      answer: 1
      explanation: |
        Unit 1's pH arithmetic sits underneath a Unit 5 environmental effect: a two-unit pH change is a hundredfold change in the chemistry the roots experience.

    - slug: u05-w17-q16
      type: multiple_choice
      topic_code: "2.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The A and B blood-group antigens are short carbohydrate chains that the Iᴬ and Iᴮ alleles' enzymes attach to lipids and proteins of the red cell membrane. Where are these antigens located, and what general membrane function do they illustrate?
      options:
        - "On the cytoplasmic face of the membrane, illustrating anchorage of the cytoskeleton."
        - "On the extracellular face of the membrane as glycolipids and glycoproteins, illustrating cell recognition and identity."
        - "Dissolved in the hydrophobic core of the bilayer, illustrating membrane fluidity."
        - "In the nucleus, illustrating gene regulation."
      option_explanations:
        - |
          Carbohydrate groups face outward; the cytoplasmic face carries the proteins that link to the cytoskeleton, not sugar chains.
        - |
          Correct. Membrane carbohydrates are added in the Golgi and end up on the outer surface, where they serve as identity tags; the immune system reads them, which is why mismatched transfusions are rejected.
        - |
          Carbohydrates are polar and cannot sit in the nonpolar core; fluidity is set by fatty-acid saturation and cholesterol, not sugars.
        - |
          Antigens are on the cell surface where antibodies can bind them; they are not nuclear molecules.
      answer: 1
      explanation: |
        A blood-group allele is a gene for an enzyme that decorates the membrane. Unit 2's glycocalyx is the physical phenotype that Unit 5's codominance describes.

    - slug: u05-w17-q17
      type: multi_select
      topic_code: "5.4"
      source: "Biology 2e §12.2 Characteristics and Traits"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following correctly describe a non-Mendelian dominance relationship? Select all that apply.
      options:
        - "In codominance both alleles are fully expressed in the heterozygote, as when a person with alleles Lᴹ and Lᴺ carries both M and N antigens."
        - "In incomplete dominance the heterozygote shows an intermediate phenotype, and the F2 phenotype ratio is 1:2:1."
        - "In a multiple-allele system every individual carries all the alleles of the gene."
        - "In the ABO system Iᴬ and Iᴮ are codominant with each other and both are dominant to i."
        - "In codominance the heterozygote's phenotype is a blend halfway between the two homozygotes."
      option_explanations:
        - |
          Correct. Neither allele is reduced; the heterozygote displays both gene products, which is how the MN blood group behaves.
        - |
          Correct. Pink snapdragons make less red pigment than red ones; because every genotype is distinguishable the 1:2:1 genotype ratio is seen directly.
        - |
          A diploid individual carries two alleles at a locus; "multiple alleles" means the population has more than two versions available.
        - |
          Correct. One gene shows two relationships at once: AB people express both antigens, and type A people may be IᴬIᴬ or Iᴬi because i produces no antigen.
        - |
          A halfway blend is incomplete dominance. In codominance both parental phenotypes are present at full strength, not averaged.
      answer: [0, 1, 3]
      explanation: |
        The test is the heterozygote: a blend means incomplete dominance; both products side by side means codominance; and a gene may show different relationships between different pairs of its alleles.

    - slug: u05-w17-q18
      type: multi_select
      topic_code: "5.5"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Select every observation that demonstrates the environment influencing phenotype.
      options:
        - "Arctic foxes grow white fur as day length shortens in autumn and brown fur in spring."
        - "The sex of a developing sea turtle is determined by the temperature of the sand in which the egg incubates."
        - "A person with genotype Iᴬi has type A blood whether raised in a warm or a cold climate."
        - "Siamese cats raised in a warm house have paler points than littermates raised in a cold barn."
        - "Identical twins raised in different countries differ noticeably in adult height."
      option_explanations:
        - |
          Correct. The genotype is constant; day length and temperature switch pigment-gene expression between seasons.
        - |
          Correct. In species with temperature-dependent sex determination no sex chromosome decides the outcome; incubation temperature does.
        - |
          This is an example of a phenotype that does not respond to the environment; ABO type is fixed by genotype, so it demonstrates the opposite.
        - |
          Correct. The temperature-sensitive pigment enzyme works only in cool skin, so the same allele produces darker points in a colder environment.
        - |
          Correct. Identical twins share a genotype, so any height difference must be environmental (nutrition, health), showing that a polygenic trait is still shaped by surroundings.
      answer: [0, 1, 3, 4]
      explanation: |
        To show an environmental effect, hold genotype constant (clones, twins, the same animal in two seasons) and vary the surroundings. A trait that stays put is informative too.

    - slug: u05-w17-q19
      type: true_false
      topic_code: "5.4"
      source: "Biology 2e §13.1 Chromosomal Theory and Genetic Linkage"
      points: 1
      prompt: |
        True or false: A recombination frequency of 50% between two genes proves that they are located on different chromosomes.
      answer: false
      explanation: |
        False. A 50% recombination frequency means the genes assort independently, which is what genes on different chromosomes do, but genes very far apart on the same chromosome also reach 50% because one or more crossovers almost always fall between them. Fifty percent is the ceiling; it says "unlinked", not "different chromosome". Lower than 50% is the only frequency that is informative about physical linkage.

    - slug: u05-w17-q20
      type: true_false
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. True or false: A chi-square test that fails to reject the null hypothesis at p = 0.05 shows that the probability of the null hypothesis being true is greater than 95%.
      answer: false
      explanation: |
        False. The p value is the probability of observing a deviation at least this large if the null hypothesis were true; it is not the probability that the hypothesis is true. Failing to reject means the data are consistent with the hypothesis, nothing more. A small sample can fail to reject a hypothesis that is wrong, which is why the test's conclusion is always phrased as "consistent with" rather than "proves".

    - slug: u05-w17-q21
      type: fill_blank
      topic_code: "5.4"
      source: "Biology 2e §12.2 Characteristics and Traits"
      points: 1
      prompt: |
        Because a male has only one X chromosome, he carries a single allele of every X-linked gene and is described as ____ for those genes.
      answer: ["hemizygous"]
      explanation: |
        Hemi means half: one copy instead of the usual two. The consequence is that dominance has no meaning for X-linked genes in males; the single allele is expressed, which is why X-linked recessive traits are far commoner in males. "Heterozygous" and "homozygous" both describe two copies and are not accepted.

    - slug: u05-w17-q22
      type: fill_blank
      topic_code: "1.7"
      source: "Biology 2e §3.4 Proteins"
      points: 1
      prompt: |
        Review. The temperature-sensitive tyrosinase of a Siamese cat loses its three-dimensional shape and its activity above about 35 °C, a change in protein structure called ____.
      answer: ["denaturation", "denaturing", "denatured"]
      explanation: |
        Denaturation is the loss of secondary, tertiary and quaternary structure when the weak interactions holding the fold are disrupted by heat, pH or salt; the primary sequence survives. In the Siamese cat the threshold is unusually low because the mutant protein's fold is less stable, so the environment decides where pigment forms. "Hydrolysis" breaks peptide bonds and is not accepted.

    - slug: u05-w17-q23
      type: short_answer
      topic_code: "5.4"
      source: "general knowledge"
      points: 4
      prompt: |
        Analyze a pedigree. Red-green colour blindness is X-linked recessive. A woman with normal vision, whose father was colour-blind, marries a man with normal vision. (a) Give the genotypes of the woman, her father and her husband, using Xᴮ for the normal allele and Xᵇ for the colour-blind allele. (b) Calculate the probability that a son of the couple is colour-blind and the probability that a daughter is colour-blind. (c) Calculate the probability that any given child of the couple is colour-blind. (d) Explain why colour blindness is much more common in men than in women.
      answer: |
        Woman XᴮXᵇ (she must have received her father's Xᵇ), father XᵇY, husband XᴮY. Sons: 1/2 colour-blind (they get the mother's Xᵇ half the time); daughters: 0 (every daughter receives the father's Xᴮ). Any child: P(son) × 1/2 + P(daughter) × 0 = 1/2 × 1/2 = 1/4. Men are hemizygous, so one Xᵇ is enough to be affected; a woman needs Xᵇ from both parents, including an affected father, which is far rarer.
      explanation: |
        Four points.

        (a) 1 pt for all three genotypes: woman XᴮXᵇ (an obligate carrier because her father gave her his only X, which carried Xᵇ), father XᵇY, husband XᴮY. Writing the woman as XᴮXᴮ or giving the men two X alleles earns nothing.

        (b) 1 pt: sons 1/2 (a son's X comes from the mother, who passes Xᵇ half the time); daughters 0 (every daughter gets the father's Xᴮ and is at worst a carrier). Both values are required.

        (c) 1 pt: 1/4, from 1/2 (son) × 1/2 (Xᵇ) + 1/2 (daughter) × 0; accept a Punnett square showing one affected square of four. Giving 1/2 (the son-only probability) earns nothing.

        (d) 1 pt: males are hemizygous, so a single Xᵇ produces the phenotype, while a female needs Xᵇ on both chromosomes, which requires an affected (or carrier, for a son of hers) father and a carrier mother; the probability of the two-allele combination is much lower than that of one. Accept a frequency argument (q versus q²).

        Zero: treating the trait as autosomal; stating that daughters of a carrier are "half colour-blind"; attributing the male excess to the Y chromosome.

    - slug: u05-w17-q24
      type: short_answer
      topic_code: "5.5"
      source: "general knowledge"
      points: 4
      prompt: |
        Scientific investigation. A student hypothesises that the dark fur on a Himalayan rabbit's ears, paws, nose and tail is produced because those regions are cooler than the rest of the body, not because the skin there is genetically different. (a) Describe an experiment to test the hypothesis, identifying the independent variable, the dependent variable and at least two controlled variables. (b) State the prediction the hypothesis makes. (c) Describe a result that would refute the hypothesis. (d) Predict the coat of a Himalayan rabbit raised from birth at a constant 32 °C, and justify the prediction.
      answer: |
        Shave matching patches on the back of several rabbits; cool one patch (ice pack or cold chamber) and leave the other at body temperature while the fur regrows; IV = skin temperature of the patch, DV = colour of regrown fur, controlled: same rabbit genotype, same region shaved, same time allowed, same diet and light. Prediction: the cooled patch regrows dark fur, the control patch white. Refutation: both patches regrow white (or the cooled patch no darker than the control). At a constant 32 °C the whole rabbit, extremities included, would be white, because the temperature-sensitive pigment enzyme would be inactive everywhere.
      explanation: |
        Four points.

        (a) 1 pt: a design that manipulates the temperature of a normally white region (shaved back patch cooled with an ice pack or cold chamber versus an uncooled control patch, ideally on the same animal and replicated), with the independent variable (skin temperature), the dependent variable (colour of the regrown fur) and at least two controlled variables (genotype or same animal, patch location and size, regrowth time, diet, light). Warming a normally dark region (an ear in a warm sleeve) is an equally acceptable design. A design with no control patch earns nothing.

        (b) 1 pt: the cooled patch regrows dark fur while the control patch regrows white (or a warmed ear regrows white while the other ear regrows dark). The prediction must be directional.

        (c) 1 pt: both patches regrow the same colour (white), or the cooled patch is no darker than the control, which would mean temperature is not the cause and the regional difference is intrinsic to the skin. Accept any result that is clearly inconsistent with the prediction.

        (d) 1 pt: an all-white rabbit, because the enzyme that makes pigment is inactive above about 35 °C; hold the body (including extremities) at a temperature above the threshold and no region can make pigment. The point requires the mechanism (enzyme inactivated by warmth), not just the prediction. A bonus justification is that a rabbit raised in the cold would be darker overall.

        Zero: a design that varies genotype rather than temperature; a prediction that the cooled patch regrows white; attributing the result to a mutation caused by the cold.

    - slug: u05-w17-q25
      type: long_answer
      topic_code: "5.4"
      source: "Biology 2e §13.1 Chromosomal Theory and Genetic Linkage"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. Geneticists test-crossed heterozygous fruit flies to measure the recombination frequency between pairs of four genes, a, b, c and d. Each value is from at least 2,000 offspring.

        | Gene pair | Recombination frequency (%) |
        |---|---|
        | a – b | 6 |
        | b – c | 14 |
        | a – c | 20 |
        | a – d | 50 |
        | b – d | 50 |
        | c – d | 50 |

        (a) Describe how the recombination frequencies among a, b and c relate to one another, and state the order of the three genes on the chromosome with the distances in map units.
        (b) Explain, in terms of events in prophase I, why genes a and c show more recombination than genes a and b.
        (c) Explain what the 50% frequencies involving gene d indicate about its location, and state what cannot be concluded from them.
        (d) A fly heterozygous for a and b, with alleles A and B on one homologue and a and b on the other, is test-crossed and 1,000 offspring are scored. Predict the number of offspring in each of the four phenotype classes and justify the prediction.
        (e) In a separate experiment the a–c distance measured directly (20) was slightly smaller than the sum of a–b and b–c (6 + 14 = 20 in this table, but 19 in a repeat). Propose an explanation involving double crossovers for why directly measured distances between far-apart genes tend to underestimate the sum of the shorter intervals.
      answer: |
        The a–c frequency equals a–b plus b–c, so b lies between a and c: order a–b–c with a–b 6 and b–c 14 map units. Crossing over can happen anywhere along the paired homologues; the longer the stretch between two genes, the more likely a crossover falls within it, so a and c (20 units) are separated more often than a and b (6 units). Fifty percent is the maximum, produced by independent assortment, so d is either on a different chromosome or so far from a, b and c on the same chromosome that it behaves as unlinked; which of those is true cannot be told from these data. Test cross: 6% recombinants = 60 flies, 30 Ab and 30 aB; the parental classes AB and ab are 470 each. A double crossover between a and c restores the parental combination of a and c, so those offspring are scored as non-recombinant for a–c even though two exchanges occurred; the two shorter intervals each count one of the crossovers, so their sum is larger than the direct measurement.
      explanation: |
        Eight points.

        (a) 2 pts: 1 pt for the observation that the a–c frequency (20) equals the sum of a–b (6) and b–c (14), so the distances are additive; 1 pt for the order a–b–c (or c–b–a) with a–b = 6 map units and b–c = 14 map units. An order with b at an end earns nothing for the second point.

        (b) 1 pt: crossing over between non-sister chromatids occurs at essentially random positions along the synapsed homologues in prophase I; the longer the chromosome segment between two genes, the greater the chance that at least one crossover falls between them, so a and c (20 units apart) are recombined more often than a and b (6 units). Naming prophase I and relating frequency to distance are both required.

        (c) 2 pts: 1 pt for interpreting 50% as independent assortment: d assorts independently of a, b and c, so it is either on a different chromosome or so far away on the same chromosome that crossovers between it and the others are nearly certain; 1 pt for stating that the data cannot distinguish these two possibilities, since 50% is the ceiling for recombination frequency. Claiming that 50% proves a different chromosome earns the first point only.

        (d) 2 pts: 1 pt for recombinants = 6% of 1,000 = 60, split equally into about 30 Ab and 30 aB; 1 pt for parentals = 940, split into about 470 AB and 470 ab, with the justification that the recombination frequency between a and b is 6% and the reciprocal classes of each type are produced in equal numbers by a crossover. Accept small rounding; numbers without the identification of which classes are parental earn one point at most.

        (e) 1 pt: a double crossover between a and c (one in each interval) swaps the segment containing b twice, returning the a and c alleles to their parental combination, so these offspring are counted as parental for a–c; but each of the two crossovers is counted as a recombinant in its own shorter interval (a–b or b–c). The direct a–c measurement therefore misses double crossovers and is smaller than the sum of the two intervals. The explanation must mention that two crossovers restore the parental a–c combination.

        Zero for a part: ordering the genes by listing them alphabetically; explaining recombination as independent assortment of a, b and c; predicting four equal classes of 250 in the test cross; attributing the discrepancy in (e) to measurement error alone.
