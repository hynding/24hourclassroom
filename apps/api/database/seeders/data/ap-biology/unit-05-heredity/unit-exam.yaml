    prompt: |
      Review. True or false: The tyrosinase of a Himalayan rabbit differs from the wild-type enzyme in its primary structure, and that difference is sufficient to lower the temperature at which the enzyme loses its functional shape.
    answer: true
    explanation: |
      True. A change in the amino-acid sequence alters the R-group interactions that hold the tertiary structure, and a fold held by weaker interactions denatures at a lower temperature. In the Himalayan allele that threshold happens to fall between the temperature of the extremities and that of the trunk, so the environment decides where pigment forms. Unit 1's structure-function rule is the molecular basis of this Unit 5 environmental effect.

  # ---- Fill-in-the-blank (5)
  - slug: u05-exam-q41
    type: fill_blank
    topic_code: "5.1"
    source: "Biology 2e §11.1 The Process of Meiosis"
    points: 1
    prompt: |
      Meiosis I is called the ____ division because it halves the number of chromosomes by separating homologous pairs.
    answer: ["reductional", "reduction", "reductive"]
    explanation: |
      The chromosome number goes from 2n to n in meiosis I; meiosis II is the equational division, which separates sister chromatids and leaves the number at n. "Equational" and "mitotic" describe the second division and are not accepted.

  - slug: u05-exam-q42
    type: fill_blank
    topic_code: "5.2"
    source: "Biology 2e §11.1 The Process of Meiosis"
    points: 1
    prompt: |
      The random orientation of each tetrad on the metaphase I plate, which lets maternal and paternal chromosomes be mixed in every combination in the gametes, is called ____.
    answer: ["independent assortment", "random assortment"]
    explanation: |
      Independent assortment gives 2ⁿ possible chromosome combinations per gamete and is the meiotic basis of Mendel's second law. "Crossing over" is the prophase I exchange between non-sister chromatids and "segregation" is the separation of the two alleles of one gene, so neither is accepted.

  - slug: u05-exam-q43
    type: fill_blank
    topic_code: "5.3"
    source: "Biology 2e §12.2 Characteristics and Traits"
    points: 1
    prompt: |
      An individual that carries two identical alleles of a gene, and therefore breeds true for the trait, is described as ____ for that gene.
    answer: ["homozygous", "homozygote"]
    explanation: |
      Homozygotes (AA or aa) produce only one kind of gamete for that gene, which is why true-breeding lines are homozygous. "Heterozygous" individuals (Aa) carry two different alleles and produce two gamete types, so the term is not accepted.

  - slug: u05-exam-q44
    type: fill_blank
    topic_code: "5.4"
    source: "Biology 2e §13.1 Chromosomal Theory and Genetic Linkage"
    points: 1
    prompt: |
      On a genetic map, one map unit (one centimorgan) corresponds to a recombination frequency of ____ percent between two genes.
    answer: ["1", "one", "1%"]
    explanation: |
      Sturtevant defined the unit so that a 0.01 recombination frequency is 1 cM, which makes distances approximately additive along a chromosome. The maximum observable frequency is 50 percent, which corresponds to independent assortment, so the scale is reliable only for genes close enough that double crossovers are rare.

  - slug: u05-exam-q45
    type: fill_blank
    topic_code: "4.5"
    source: "Biology 2e §11.1 The Process of Meiosis"
    points: 1
    prompt: |
      Review. The division of the cytoplasm that follows telophase, by a cleavage furrow in animal cells or a cell plate in plant cells, is called ____.
    answer: ["cytokinesis"]
    explanation: |
      Cytokinesis separates the two new nuclei into two cells; it follows telophase I and telophase II in meiosis as it follows mitotic telophase. "Mitosis" and "karyokinesis" refer to the division of the nucleus and are not accepted.

  # ---- Numeric (second)
  - slug: u05-exam-q46
    type: numeric
    topic_code: "5.3"
    source: "Biology 2e §12.3 Laws of Inheritance"
    points: 1
    prompt: |
      Two plants heterozygous at three independently assorting genes (AaBbCc × AaBbCc), each gene with complete dominance, are crossed. What is the probability that an offspring shows the dominant phenotype for all three genes? Give your answer as a decimal to three places.
    answer: { value: 0.422, tolerance: 0.005 }
    explanation: |
      Each gene is an independent monohybrid cross with P(dominant phenotype) = 3/4. By the product rule, (3/4)³ = 27/64 = 0.422. The complementary probability, that at least one gene shows the recessive phenotype, is 1 − 0.422 = 0.578.

  # ---- Free response
  - slug: u05-exam-q47
    type: short_answer
    topic_code: "5.4"
    source: "general knowledge"
    points: 4
    prompt: |
      Analyze a model. A student is asked to predict the offspring of a woman who is a carrier for an X-linked recessive condition (XᴬXᵃ) and a man who is unaffected (XᴬY). The student draws a Punnett square treating the gene as autosomal, writes the father as "Aa", and concludes that one quarter of the daughters and one quarter of the sons will be affected. (a) Identify two errors in the student's model. (b) Draw or describe the correct Punnett square and state the expected outcomes for sons and for daughters. (c) Explain, in terms of the chromosomes involved, why the outcomes differ between sons and daughters. (d) Predict the outcomes if instead the father were affected (XᵃY) and the mother a carrier.
    answer: |
      Errors: the father has only one X-linked allele (he is hemizygous, XᴬY, not Aa), and the model ignores that sons receive the Y rather than an X from the father. Correct square: mother's gametes Xᴬ and Xᵃ, father's Xᴬ and Y; daughters XᴬXᴬ or XᴬXᵃ (none affected, half carriers), sons XᴬY or XᵃY (half affected). Sons get their single X from the mother, so her Xᵃ is expressed whenever it is passed; daughters always receive the father's normal Xᴬ, which masks the mother's Xᵃ. With an affected father: daughters XᴬXᵃ or XᵃXᵃ (half affected, half carriers); sons XᴬY or XᵃY (half affected).
    explanation: |
      Four points.

      (a) 1 pt for two errors: the father is written with two alleles although he is hemizygous (XᴬY); the model gives sons and daughters the same probabilities although sons receive a Y, not an X, from the father (or: the predicted 1/4 affected daughters is impossible because every daughter receives the father's Xᴬ). Any two distinct errors earn the point.

      (b) 1 pt: the square with gametes Xᴬ and Xᵃ (mother) against Xᴬ and Y (father), giving XᴬXᴬ, XᴬXᵃ, XᴬY, XᵃY; sons 1/2 affected, daughters 0 affected and 1/2 carriers. Both outcomes are required.

      (c) 1 pt: a son's only X comes from his mother, so if he receives Xᵃ there is no second allele to mask it; a daughter receives one X from each parent and the father's Xᴬ is always normal here, so she is at most a carrier. The explanation must mention the source of the son's X or the father's Y.

      (d) 1 pt: XᴬXᵃ × XᵃY gives daughters XᴬXᵃ (carrier) or XᵃXᵃ (affected), each 1/2, and sons XᴬY or XᵃY, each 1/2. Accept "half the daughters and half the sons affected" with genotypes.

      Zero: redrawing the square with the father as XX or the mother as XY; stating that sons inherit the condition from the father; giving probabilities without genotypes.

  - slug: u05-exam-q48
    type: long_answer
    topic_code: "5.4"
    source: "general knowledge"
    points: 8
    prompt: |
      Interpreting and evaluating experimental results. Researchers measured the recombination frequency between two linked genes on chromosome 2 of fruit flies by test-crossing heterozygous females (parental chromosomes AB and ab) raised at three temperatures. They also measured the same frequency in heterozygous males. In this species, crossing over does not occur in males. Each value is from 2,000 offspring. The data are hypothetical.

      | Temperature during the females' development (°C) | Recombinant offspring from females (%) | Recombinant offspring from males (%) |
      |---|---|---|
      | 17 | 12.5 | 0 |
      | 25 | 17.0 | 0 |
      | 30 | 22.0 | 0 |

      (a) Describe the relationship between temperature and recombination frequency in females, and describe the result in males.
      (b) Explain what the recombination frequency measures and what event in meiosis produces the recombinant offspring.
      (c) The physical distance between the two genes on the chromosome is the same in every fly. Explain how the measured map distance can nevertheless change with temperature, and propose a cellular mechanism that could account for it.
      (d) A geneticist uses the 25 °C value to build a chromosome map and then tests the map against data collected from flies raised at 17 °C. Predict what the geneticist will find and justify the prediction.
      (e) Identify one controlled variable essential to this experiment and explain why the male data serve as a useful control.
    answer: |
      In females recombination rises with temperature, from 12.5% at 17 °C to 22.0% at 30 °C; males show no recombinants at any temperature. The frequency is the proportion of offspring with non-parental allele combinations (Ab, aB), produced by crossing over between non-sister chromatids in prophase I in a position between the two genes. Map units are a frequency of crossing over, not a length in base pairs; if temperature changes how often a crossover forms in the interval, the measured distance changes while the DNA does not. A plausible mechanism is that the enzymes and the synaptonemal complex involved in forming crossovers are temperature-sensitive, so warmer development produces more chiasmata per interval. The map built at 25 °C would predict 17% recombinants, but 17 °C flies would give only 12.5%; the map would appear compressed, with the two genes closer together, although gene order would be unchanged. Controlled variables include the genotype of the heterozygotes, the tester strain, and the temperature at which the offspring were raised and scored; the male data show that temperature has no effect where crossing over does not occur, so the female effect is attributable to crossing over rather than to differential survival of recombinant phenotypes.
    explanation: |
      Eight points.

      (a) 1 pt: in females recombination frequency increases with temperature (12.5% at 17 °C, 17.0% at 25 °C, 22.0% at 30 °C), and in males it is 0% at every temperature. Both trends with at least one number are required.

      (b) 2 pts: 1 pt for the definition: recombinants (Ab and aB offspring, the non-parental combinations) divided by total offspring, expressed as a percentage; 1 pt for the event: crossing over between non-sister chromatids of the homologous pair during prophase I, at a point between the two genes.

      (c) 2 pts: 1 pt for the conceptual point that a map distance is a frequency of crossing over in an interval, not a physical length, so anything that changes the probability of a crossover changes the measured distance without changing the chromosome; 1 pt for a plausible mechanism, such as temperature-sensitive enzymes of recombination or temperature affecting the formation of the synaptonemal complex or the number or placement of chiasmata. Accept any mechanism that acts on crossover frequency in prophase I; "the chromosome stretches when warm" earns nothing.

      (d) 1 pt: the 17 °C data would give fewer recombinants (about 12.5%) than the map predicts (17%), so the genes would appear closer together, the map compressed, while the order of genes would be unchanged; justified by the lower crossover frequency at the lower temperature. A prediction that the order changes earns nothing.

      (e) 2 pts: 1 pt for a controlled variable (genotype of the heterozygous parents, the tester strain, the number of offspring scored, the temperature of the offspring during scoring, food); 1 pt for the control value of the males: because crossing over does not occur in males, any temperature effect on recombinant frequency in males would have to come from something other than crossing over (such as differential survival of recombinant phenotypes); the constant 0% shows that temperature is acting on crossing over itself, not on survival. Stating only that the males "show no recombination" without explaining what this rules out earns the first point only.

      Zero for a part: describing the female data as "varies" with no direction; explaining recombinants by independent assortment; stating that temperature mutates the genes; claiming that the males must have the genes on different chromosomes.
