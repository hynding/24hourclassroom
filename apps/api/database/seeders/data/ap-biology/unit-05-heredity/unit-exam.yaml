  # ---- True/false (4 more)
  - slug: u05-exam-q37
    type: true_false
    topic_code: "5.2"
    source: "Biology 2e §11.1 The Process of Meiosis"
    points: 1
    prompt: |
      True or false: Random fertilisation contributes to genetic variation among offspring even when crossing over and independent assortment are not considered.
    answer: true
    explanation: |
      True. Even if every gamete of each parent were identical in chromosome content, two parents contribute different genomes, and which sperm meets which egg is a matter of chance; with the real diversity of gametes (2²³ combinations per human parent from assortment alone) random fertilisation multiplies the possibilities to around 70 trillion. The three sources of variation act at different stages and multiply.

  - slug: u05-exam-q38
    type: true_false
    topic_code: "5.4"
    source: "Biology 2e §13.1 Chromosomal Theory and Genetic Linkage"
    points: 1
    prompt: |
      True or false: In a test cross involving two linked genes, the two recombinant classes are expected to occur in approximately equal numbers, and so are the two parental classes.
    answer: true
    explanation: |
      True. A single crossover between the two genes produces two reciprocal recombinant chromatids, one of each type, so the recombinant classes are equal within sampling error; the two parental classes are likewise the two non-recombinant chromatids of the same tetrads. Morgan's 206 and 185 recombinants, and 965 and 944 parentals, show the pattern. Unequal reciprocal classes point to lethality or a scoring problem rather than to linkage.

  - slug: u05-exam-q39
    type: true_false
    topic_code: "1.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Review. True or false: The A and B blood-group antigens are short carbohydrate chains, built from monosaccharides joined by glycosidic linkages, attached to lipids and proteins on the outer surface of the red cell membrane.
    answer: true
    explanation: |
      True. The Iᴬ and Iᴮ alleles encode enzymes that add one more sugar (N-acetylgalactosamine or galactose) to a common precursor chain; the i allele's enzyme is inactive, so type O cells carry the bare precursor. The antigens are oligosaccharides, joined by glycosidic linkages as in any carbohydrate, and they face outward as part of the glycocalyx, which is why the immune system can read them. A single sugar difference, set by a single gene, is what codominance in the ABO system is made of.

