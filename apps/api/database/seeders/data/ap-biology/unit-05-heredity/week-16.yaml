week: 16
unit: 5
title: Mendelian Genetics
topics: ["5.3"]
guide: guides/week-16.md
guide_description: |
  Mendel's method and why peas; segregation and independent assortment as anaphase I and metaphase I; monohybrid,
  dihybrid and test crosses; the product and sum rules; reading pedigrees; the chi-square test with the AP
  critical-value table. Three worked examples (a dihybrid probability, a chi-square on cross data, a pedigree),
  misconceptions, self-check.
flashcards_description: |
  32 cards: Mendel's vocabulary and evidence, the two laws and their meiotic basis, crosses and ratios, the
  probability rules, pedigree reading and the chi-square test with a worked data card.

flashcards:
  - front: Gene vs allele
    back: |
      A gene is a stretch of DNA that affects a trait; an allele is one version of that gene, arising by mutation and sitting at the same locus on homologous chromosomes. A diploid individual carries two alleles of each gene.
    topic_code: "5.3"
  - front: Genotype vs phenotype
    back: |
      Genotype is the pair of alleles an individual carries (YY, Yy, yy); phenotype is the observable trait. Two genotypes (YY and Yy) can share a phenotype, which is why a test cross is needed.
    topic_code: "5.3"
  - front: Homozygous vs heterozygous
    back: |
      Homozygous: both alleles the same (YY or yy); a homozygote breeds true. Heterozygous: two different alleles (Yy); a heterozygote shows the dominant phenotype but makes two kinds of gamete.
    topic_code: "5.3"
  - front: Dominant allele → what the word does and does not mean
    back: |
      The allele whose phenotype appears in a heterozygote. It says nothing about which allele is more common, better or stronger; many dominant alleles are rare and some are harmful.
    hint: Dominant describes masking, not frequency.
    topic_code: "5.3"
  - front: Recessive allele → when its phenotype shows
    back: |
      Only in a homozygote (yy). In a heterozygote it is present but masked, and it is passed to half the gametes unchanged, which is why it reappears in the F2.
    topic_code: "5.3"
  - front: True-breeding line
    back: |
      A line whose self-fertilised offspring always resemble the parent: homozygous for the trait. Mendel's P generation was true-breeding for each of his seven traits.
    topic_code: "5.3"
  - front: P, F1 and F2 generations
    back: |
      P: the true-breeding parents. F1: their hybrid offspring, all showing the dominant trait. F2: the offspring of F1 self-crosses, showing the 3:1 ratio.
    topic_code: "5.3"
  - front: Why did Mendel choose the garden pea?
    back: |
      Peas self-fertilise inside a closed flower, so lines breed true and crosses can be controlled by removing anthers; they mature in one season; they can be grown by the thousand; and the seven traits he chose each came in two distinct forms.
    topic_code: "5.3"
  - front: Mendel's 3:1 ratio → the arithmetic behind it
    back: |
      Violet × white gave all-violet F1; the F2 was 705 violet : 224 white, 3.15:1. The F1 (Yy) makes equal Y and y gametes; the F2 is 1 YY : 2 Yy : 1 yy, and three of those four show the dominant trait.
    topic_code: "5.3"
  - front: Blending vs particulate inheritance → the F2 evidence
    back: |
      Blending predicts intermediate, permanently mixed offspring. Mendel's white flowers vanished in the F1 and returned unchanged in a quarter of the F2, so the hereditary units are discrete particles that survive passage through a hybrid.
    topic_code: "5.3"
  - front: Continuous vs discontinuous variation
    back: |
      Continuous: a trait with a range of values (height, skin colour), usually many genes plus environment. Discontinuous: distinct classes (violet or white). Mendel deliberately chose discontinuous traits.
    topic_code: "5.3"
  - front: Law of segregation → statement and the meiotic event behind it
    back: |
      The two alleles of a gene separate during gamete formation, so each gamete carries one. The event is anaphase I, when homologous chromosomes carrying the two alleles go to opposite poles.
    hint: Segregation is anaphase I.
    topic_code: "5.3"
  - front: Law of independent assortment → statement and the meiotic event behind it
    back: |
      Alleles of different genes are sorted into gametes independently, so every combination is equally likely. The event is metaphase I, when each tetrad orients at random. Holds for genes on different chromosomes or far apart on one.
    hint: Independent assortment is metaphase I.
    topic_code: "5.3"
  - front: Monohybrid cross → F2 genotype and phenotype ratios
    back: |
      Yy × Yy gives 1 YY : 2 Yy : 1 yy by genotype and 3 dominant : 1 recessive by phenotype. The two ratios differ because YY and Yy look alike.
    topic_code: "5.3"
  - front: Dihybrid cross → F1 gametes and the F2 ratio
    back: |
      YyRr makes four gamete types in equal numbers: YR, Yr, yR, yr. Selfing gives sixteen equally likely boxes and a 9:3:3:1 phenotype ratio (both dominant : first only : second only : both recessive).
    topic_code: "5.3"
  - front: Why is 9:3:3:1 the product of two 3:1 ratios?
    back: |
      If the genes assort independently, P(yellow) = 3/4 and P(round) = 3/4, so P(yellow and round) = 9/16 by the product rule; 3/4 × 1/4 = 3/16 for each single-dominant class and 1/16 for the double recessive.
    topic_code: "5.3"
  - front: Test cross → purpose and how to read the result
    back: |
      Cross an individual of dominant phenotype with a homozygous recessive. All offspring dominant means the unknown was homozygous; about 1:1 dominant : recessive means it was heterozygous, because half its gametes carried the recessive allele.
    topic_code: "5.3"
  - front: Product rule → when to use it and an example
    back: |
      For independent events that must all happen (the word "and"), multiply. P(two heterozygous parents have an aa child and then a second aa child) = 1/4 × 1/4 = 1/16.
    topic_code: "5.3"
  - front: Sum rule → when to use it and an example
    back: |
      For mutually exclusive ways of getting an outcome (the word "or"), add. P(an AaBb × AaBb offspring shows exactly one dominant trait) = (3/4 × 1/4) + (1/4 × 3/4) = 6/16.
    topic_code: "5.3"
  - front: Probability that AaBbCc × AaBbCc gives an aabbcc offspring
    back: |
      Each gene is an independent monohybrid cross with P(recessive) = 1/4, so 1/4 × 1/4 × 1/4 = 1/64. The same logic gives P(dominant at all three) = (3/4)³ = 27/64.
    topic_code: "5.3"
  - front: Forked-line method
    back: |
      Treat each gene as its own 3:1 (or 1:1) branch and multiply along the paths instead of drawing a 64-box square. A trihybrid self-cross gives 27:9:9:9:3:3:3:1.
    topic_code: "5.3"
  - front: Punnett square → what a box represents
    back: |
      One equally likely fertilisation event: a particular gamete from one parent meeting a particular gamete from the other. The ratio of boxes is a prediction about probabilities, not a guarantee about any small family.
    topic_code: "5.3"
  - front: Pedigree symbols
    back: |
      Square = male, circle = female, filled = affected, half-filled = known carrier; a horizontal line joins mates, a vertical line drops to their children, generations are numbered I, II, III and individuals left to right.
    topic_code: "5.3"
  - front: How to spot an autosomal recessive trait in a pedigree
    back: |
      Two unaffected parents have an affected child (both must be carriers), the trait often skips generations, and males and females are affected about equally. An affected daughter of an unaffected father rules out X-linked recessive.
    topic_code: "5.3"
  - front: How to spot an autosomal dominant trait in a pedigree
    back: |
      Every affected person has an affected parent, the trait appears in every generation, and two affected parents can have an unaffected child (both heterozygous).
    topic_code: "5.3"
  - front: Chi-square test → the equation and what o and e mean
    back: |
      χ² = Σ (o − e)² / e, summed over the phenotype classes. o is the observed count in a class; e is the count the hypothesis predicts (ratio × total). Use counts, never percentages.
    hint: It is on the AP formula sheet.
    topic_code: "5.3"
  - front: Degrees of freedom for a chi-square test on a cross
    back: |
      Number of phenotype classes minus one. A 3:1 test has df = 1; a 9:3:3:1 test has df = 3; a 1:1:1:1 test cross has df = 3.
    topic_code: "5.3"
  - front: Chi-square critical values at p = 0.05
    back: |
      df 1: 3.84; df 2: 5.99; df 3: 7.81; df 4: 9.49. If the calculated χ² exceeds the critical value, reject the null hypothesis; the deviation is unlikely to be chance alone.
    topic_code: "5.3"
  - front: What does it mean to fail to reject the null hypothesis in a chi-square test?
    back: |
      The difference between observed and expected counts is small enough to be due to chance (p > 0.05), so the data are consistent with the predicted ratio. It does not prove the hypothesis true.
    topic_code: "5.3"
  - front: Null hypothesis for testing a 9:3:3:1 prediction
    back: |
      That the two genes assort independently and show complete dominance, so any difference between the observed counts and 9:3:3:1 is due to chance. Rejecting it points to linkage, lethality, epistasis or a scoring problem.
    topic_code: "5.3"
  - front: Observed 60 dominant to 40 recessive among 100 F2 offspring against an expected 3 to 1 → conclusion
    back: |
      Expected 75 : 25. χ² = (60 − 75)²/75 + (40 − 25)²/25 = 3.0 + 9.0 = 12.0; df = 1; 12.0 > 3.84, so reject the null: the cross does not fit a simple 3:1 ratio.
    topic_code: "5.3"
  - front: Why does a larger sample make a chi-square test more sensitive to a real deviation?
    back: |
      Each term is (o − e)²/e; if the same proportional deviation occurs in ten times as many offspring, o − e grows tenfold and the squared term grows a hundredfold while e grows only tenfold, so χ² grows tenfold.
    topic_code: "5.3"

quiz:
  description: |
    25 questions · about 30 minutes · about 70% Mendelian genetics (5.3) and 30% review of meiosis, carbohydrates,
    osmosis and the cell cycle. Multiple choice, select-all, true/false and numeric items are graded at once; the
    fill-in-the-blank items are matched automatically; the two short answers and the long answer are graded by your
    teacher against the acceptable-answer summary.
  questions:
    - slug: u05-w16-q01
      type: multiple_choice
      topic_code: "5.3"
      source: "Biology 2e §12.1 Mendel's Experiments and the Laws of Probability"
      points: 1
      prompt: |
        Mendel removed the anthers from the flowers of one pea variety before dusting its stigmas with pollen from another variety. Which problem did this step prevent?
      options:
        - "Self-fertilisation, which would have produced offspring from one parent instead of from the intended cross."
        - "Mutation, which would have introduced new alleles into the F1."
        - "Blending, which would have made the F1 intermediate between the parents."
        - "Independent assortment, which would have scrambled the traits."
      option_explanations:
        - |
          Correct. Pea flowers normally pollinate themselves inside the closed petals; removing the anthers guaranteed that every seed came from the cross Mendel intended.
        - |
          Mutation rates are not changed by handling flowers; the step controls which pollen reaches the stigma, not the DNA sequence.
        - |
          Blending was the hypothesis Mendel's results refuted, not something a surgical step could prevent; the F1 was uniformly violet because of dominance.
        - |
          Independent assortment is a feature of meiosis in the parents and cannot be switched off; it is also what Mendel wanted to observe, not avoid.
      answer: 0
      explanation: |
        The pea's closed flower is what let Mendel control crosses and keep true-breeding lines; controlling who the parents are is the basis of every genetics experiment that follows.

    - slug: u05-w16-q02
      type: multiple_choice
      topic_code: "5.3"
      source: "Biology 2e §12.3 Laws of Inheritance"
      points: 1
      prompt: |
        A heterozygous plant (Yy) produces gametes. Which event of meiosis is the physical basis of the law of segregation, the rule that half the gametes carry Y and half carry y?
      options:
        - "Crossing over between sister chromatids in prophase I"
        - "Separation of homologous chromosomes at anaphase I"
        - "Replication of DNA in S phase"
        - "Fusion of gametes at fertilisation"
      option_explanations:
        - |
          Sister chromatids are identical, and crossing over is between non-sisters; neither is what sends the two alleles into different gametes.
        - |
          Correct. The Y and y alleles sit on the two homologues; when those homologues go to opposite poles at anaphase I, each product receives one allele, and every gamete ends up with Y or y.
        - |
          Replication doubles each allele; it does not separate Y from y, which stay in the same cell until anaphase I.
        - |
          Fertilisation combines alleles from two gametes; segregation is about how each gamete came to carry only one.
      answer: 1
      explanation: |
        Mendel described segregation decades before anyone saw a chromosome. The chromosomal theory matched his law to anaphase I, where the homologues carrying the two alleles part.

    - slug: u05-w16-q03
      type: multiple_choice
      topic_code: "5.3"
      source: "Biology 2e §12.3 Laws of Inheritance"
      points: 1
      prompt: |
        For a plant heterozygous at two genes on different chromosomes (YyRr), which statement correctly describes the gametes it produces and the meiotic event responsible?
      options:
        - "Only YR and yr gametes, because dominant alleles travel together; the event is anaphase II."
        - "YR, Yr, yR and yr in equal proportions, because each tetrad orients independently at metaphase I."
        - "YR, Yr, yR and yr, but mostly YR and yr, because crossing over is rare; the event is prophase I."
        - "Only Yy and Rr gametes, because each gamete receives both alleles of one gene; the event is S phase."
      option_explanations:
        - |
          Dominant alleles have no tendency to travel together; which Y allele goes with which R allele is decided by chance at metaphase I.
        - |
          Correct. The Y/y tetrad and the R/r tetrad line up on the plate in random orientations relative to each other, so Y is as likely to go with R as with r: four gamete types, each 1/4.
        - |
          Crossing over affects genes on the same chromosome. For genes on different chromosomes the four combinations are equal regardless of crossover frequency.
        - |
          A gamete carries one allele of each gene, not both; Yy or Rr gametes would be diploid for that gene and would double the chromosome number at fertilisation.
      answer: 1
      explanation: |
        Independent assortment is metaphase I. It gives a dihybrid four equal gamete types, which is why the F2 of a dihybrid self-cross has sixteen equally likely boxes.

    - slug: u05-w16-q04
      type: multiple_choice
      topic_code: "5.3"
      source: "Biology 2e §12.2 Characteristics and Traits"
      points: 1
      prompt: |
        A breeder has a black guinea pig (black is dominant to white) and wants to know whether it is homozygous or heterozygous. The breeder crosses it with a white guinea pig and obtains 5 black and 4 white offspring. Which conclusion is justified?
      options:
        - "The black parent is heterozygous, because white offspring appeared, which requires a recessive allele from the black parent."
        - "The black parent is homozygous, because more black than white offspring appeared."
        - "No conclusion is possible, because nine offspring is too small a sample."
        - "The white parent must be heterozygous, because black offspring appeared."
      option_explanations:
        - |
          Correct. A white offspring is homozygous recessive and received one recessive allele from each parent; a homozygous dominant black parent has none to give, so the appearance of even one white offspring settles the question.
        - |
          The ratio in a small litter varies by chance; what matters is that white offspring appeared at all, which a homozygous black parent cannot produce.
        - |
          Sample size limits how precisely a ratio is estimated, but a single recessive offspring is decisive evidence that the dominant parent carries the recessive allele.
        - |
          The white parent is homozygous recessive by definition (white shows only in homozygotes); black offspring come from the black parent's dominant allele.
      answer: 0
      explanation: |
        In a test cross, one recessive offspring is proof; a long run with none is strong evidence. Read the cross for what is possible, not for the exact ratio.

    - slug: u05-w16-q05
      type: multiple_choice
      topic_code: "5.3"
      source: "Biology 2e §12.1 Mendel's Experiments and the Laws of Probability"
      points: 1
      prompt: |
        Two parents are both heterozygous for a recessive condition. What is the probability that their first child is unaffected and their second child is affected?
      options:
        - "1/4"
        - "3/16"
        - "1/16"
        - "1/2"
      option_explanations:
        - |
          1/4 is the probability of a single affected child; the question asks for two specified outcomes in sequence, which requires the product rule.
        - |
          Correct. P(unaffected) = 3/4 and P(affected) = 1/4; the births are independent, so P(first unaffected and second affected) = 3/4 × 1/4 = 3/16.
        - |
          1/16 would be the probability that both children are affected (1/4 × 1/4), not one unaffected and one affected.
        - |
          1/2 would describe a test cross or a single-allele event; it does not arise from an Aa × Aa cross for these two outcomes.
      answer: 1
      explanation: |
        "And" means multiply. Each birth is an independent trial with the same probabilities, so earlier children never change the odds for the next.

    - slug: u05-w16-q06
      type: multiple_choice
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        A pedigree for a trait in one family. Squares are males and circles are females; affected individuals are shaded.

        Generation I: I-1 (male, unaffected) is married to I-2 (female, unaffected).
        Generation II: their children are II-1 (female, affected), II-2 (male, unaffected), II-3 (male, unaffected) and II-4 (female, unaffected).
        II-3 (unaffected) marries II-5 (female, unaffected, from outside the family). Their children are III-1 (male, affected) and III-2 (female, unaffected).
      prompt: |
        Which mode of inheritance is most consistent with the pedigree, and what is the decisive evidence?
      options:
        - "Autosomal dominant, because the trait appears in generations II and III."
        - "Autosomal recessive, because unaffected parents (I-1 and I-2) have an affected daughter (II-1), which also rules out X-linked recessive since her father would have to be affected."
        - "X-linked recessive, because an affected male (III-1) has unaffected parents."
        - "X-linked dominant, because an affected female (II-1) appears in generation II."
      option_explanations:
        - |
          A dominant trait requires an affected parent for every affected child; II-1 and III-1 both have two unaffected parents, so dominant inheritance is excluded.
        - |
          Correct. Two unaffected parents with an affected child means the trait is recessive and both parents are carriers. An affected female with an X-linked recessive trait needs an affected father (her only source of a second recessive X), and I-1 is unaffected, so the gene must be autosomal.
        - |
          III-1 alone is consistent with X-linked recessive, but II-1 is an affected female whose father is unaffected, which an X-linked recessive trait cannot produce.
        - |
          An X-linked dominant trait, like any dominant trait, needs an affected parent for every affected child; II-1's parents are both unaffected.
      answer: 1
      explanation: |
        Read a pedigree by elimination: unaffected parents with an affected child means recessive; an affected daughter with an unaffected father means not X-linked. The combination leaves autosomal recessive.

    - slug: u05-w16-q07
      type: multiple_choice
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        A pedigree for a trait in one family. Squares are males and circles are females; affected individuals are shaded.

        Generation I: I-1 (male, unaffected) is married to I-2 (female, unaffected).
        Generation II: their children are II-1 (female, affected), II-2 (male, unaffected), II-3 (male, unaffected) and II-4 (female, unaffected).
        II-3 (unaffected) marries II-5 (female, unaffected, from outside the family). Their children are III-1 (male, affected) and III-2 (female, unaffected).
      prompt: |
        Assuming the trait is autosomal recessive (allele a), what are the genotypes of II-3 and II-5, and what is the probability that their next child is affected?
      options:
        - "II-3 is Aa and II-5 is AA; the probability is 0."
        - "Both are Aa; the probability is 1/4."
        - "Both are Aa; the probability is 1/2, because they already have one affected child."
        - "II-3 is AA and II-5 is Aa; the probability is 1/4."
      option_explanations:
        - |
          III-1 is aa and received one a from each parent, so II-5 cannot be AA; she must be a carrier even though she comes from outside the family.
        - |
          Correct. An affected child (aa) proves both parents carry a. For Aa × Aa the chance of an aa child is 1/4 on every birth, regardless of previous children.
        - |
          The probability of an aa child from Aa × Aa is 1/4 for each birth; earlier children do not change it. Confusing the ratio among existing children with the probability for the next is a common error.
        - |
          II-3 must carry a because his son III-1 is aa and received one a from each parent; an AA father cannot have an aa child.
      answer: 1
      explanation: |
        Work backwards from the affected individual: aa means both parents carried a. Then work forwards with the Punnett square, remembering that each birth is independent.

    - slug: u05-w16-q08
      type: multiple_choice
      topic_code: "5.3"
      source: "Biology 2e §12.3 Laws of Inheritance"
      points: 1
      stimulus: |
        A student crossed true-breeding pea plants with yellow, round seeds (YYRR) to plants with green, wrinkled seeds (yyrr), then allowed the F1 to self-pollinate and scored 320 F2 seeds.

        | F2 phenotype | Observed |
        |---|---|
        | Yellow, round | 176 |
        | Yellow, wrinkled | 64 |
        | Green, round | 58 |
        | Green, wrinkled | 22 |
        | Total | 320 |

        The student tests the null hypothesis that the two genes assort independently and that each shows complete dominance, so that the expected ratio is 9:3:3:1. Critical values of chi-square at p = 0.05: df 1 = 3.84, df 2 = 5.99, df 3 = 7.81, df 4 = 9.49.
      prompt: |
        Under the null hypothesis, how many of the 320 F2 seeds are expected to be green and wrinkled, and how is the number obtained?
      options:
        - "22, because that is the number observed."
        - "20, because the double-recessive class is 1/16 of the total and 320 × 1/16 = 20."
        - "80, because each of the four classes is expected to be equal."
        - "40, because recessive seeds should be one eighth of the total."
      option_explanations:
        - |
          The expected value comes from the hypothesis, not from the data; using the observed count as the expected count would make every chi-square zero.
        - |
          Correct. In a 9:3:3:1 ratio the parts sum to 16 and the double-recessive class is one part, so e = 320 × 1/16 = 20. The other expected values are 180, 60 and 60.
        - |
          Equal classes (1:1:1:1) are expected from a dihybrid test cross (YyRr × yyrr), not from an F1 self-cross.
        - |
          One eighth does not appear in a dihybrid ratio; the double recessive is 1/4 × 1/4 = 1/16 of the offspring.
      answer: 1
      explanation: |
        Expected counts are ratio fractions multiplied by the total. Getting them right is the half of a chi-square calculation that most errors come from.

    - slug: u05-w16-q09
      type: numeric
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student crossed true-breeding pea plants with yellow, round seeds (YYRR) to plants with green, wrinkled seeds (yyrr), then allowed the F1 to self-pollinate and scored 320 F2 seeds.

        | F2 phenotype | Observed |
        |---|---|
        | Yellow, round | 176 |
        | Yellow, wrinkled | 64 |
        | Green, round | 58 |
        | Green, wrinkled | 22 |
        | Total | 320 |

        The student tests the null hypothesis that the two genes assort independently and that each shows complete dominance, so that the expected ratio is 9:3:3:1. Critical values of chi-square at p = 0.05: df 1 = 3.84, df 2 = 5.99, df 3 = 7.81, df 4 = 9.49.
      prompt: |
        Calculate the chi-square value for the student's data against the 9:3:3:1 expectation. Give your answer to two decimal places.
      answer: { value: 0.62, tolerance: 0.05 }
      explanation: |
        Expected counts: 320 × 9/16 = 180, 320 × 3/16 = 60, 60, 320 × 1/16 = 20. χ² = (176 − 180)²/180 + (64 − 60)²/60 + (58 − 60)²/60 + (22 − 20)²/20 = 16/180 + 16/60 + 4/60 + 4/20 = 0.089 + 0.267 + 0.067 + 0.200 = 0.62. With df = 4 − 1 = 3 the critical value is 7.81, so the deviation is well within chance.

    - slug: u05-w16-q10
      type: multiple_choice
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      stimulus: |
        A student crossed true-breeding pea plants with yellow, round seeds (YYRR) to plants with green, wrinkled seeds (yyrr), then allowed the F1 to self-pollinate and scored 320 F2 seeds.

        | F2 phenotype | Observed |
        |---|---|
        | Yellow, round | 176 |
        | Yellow, wrinkled | 64 |
        | Green, round | 58 |
        | Green, wrinkled | 22 |
        | Total | 320 |

        The student tests the null hypothesis that the two genes assort independently and that each shows complete dominance, so that the expected ratio is 9:3:3:1. Critical values of chi-square at p = 0.05: df 1 = 3.84, df 2 = 5.99, df 3 = 7.81, df 4 = 9.49.
      prompt: |
        The student's chi-square value is less than 1. Which statement is the correct conclusion?
      options:
        - "With df = 3 the critical value is 7.81; the calculated value is below it, so the student fails to reject the null hypothesis and the data are consistent with independent assortment and complete dominance."
        - "With df = 4 the critical value is 9.49; the calculated value is below it, so the null hypothesis is proved true."
        - "With df = 3 the critical value is 7.81; the calculated value is below it, so the student rejects the null hypothesis because the data are too close to the expectation."
        - "The chi-square value must be compared with 0.05; since it is larger than 0.05, the genes must be linked."
      option_explanations:
        - |
          Correct. Degrees of freedom are classes minus one (4 − 1 = 3). A χ² of about 0.6 is far below 7.81, so there is more than a 5% chance of a deviation this large by chance alone; the hypothesis stands.
        - |
          There are four classes, so df = 3, not 4; and a chi-square test never proves a hypothesis, it only fails to find evidence against it.
        - |
          A small chi-square means the observed counts are close to expected, which supports the hypothesis; one rejects only when χ² exceeds the critical value.
        - |
          0.05 is the probability threshold, not a chi-square value. The calculated statistic is compared with the critical value from the table at that threshold; a small χ² gives no evidence of linkage.
      answer: 0
      explanation: |
        The decision rule is mechanical: df = classes − 1, find the critical value, compare. The words matter too: "fail to reject", never "prove".

    - slug: u05-w16-q11
      type: multiple_choice
      topic_code: "5.1"
      source: "Biology 2e §11.1 The Process of Meiosis"
      points: 1
      prompt: |
        Review. A diploid cell with 2n = 4 is heterozygous at a gene on each chromosome pair (AaBb). Ignoring crossing over, how many chromosomes does each gamete contain, and how many genetically different gametes can this one cell's meiosis produce?
      options:
        - "2 chromosomes; one meiosis gives all four gamete types (AB, Ab, aB and ab)."
        - "2 chromosomes; one meiosis gives two gamete types (either AB and ab, or Ab and aB), decided by how the two tetrads orient at metaphase I."
        - "4 chromosomes; one meiosis gives four identical gametes."
        - "2 chromosomes; one meiosis gives four identical gametes, because sister chromatids are identical."
      option_explanations:
        - |
          A single meiosis can only realise one orientation of the two tetrads, so it yields two complementary types; all four types appear across many meioses in the same organism.
        - |
          Correct. Each gamete has one chromosome of each pair (n = 2). In one cell the A/a tetrad and the B/b tetrad adopt one of two relative orientations, giving either AB + ab or Ab + aB, two of each among the four products.
        - |
          Gametes are haploid; with 2n = 4 each has 2 chromosomes. And the four products are not identical, since they split the alleles.
        - |
          Sister chromatids are identical, but the two products of meiosis I received different homologues (A versus a), so the four gametes cannot all be identical.
      answer: 1
      explanation: |
        Independent assortment works across many cells: any one meiosis produces two gamete types, and the population of meioses produces all four equally. That is what the dihybrid's 1:1:1:1 gametes mean.

    - slug: u05-w16-q12
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Mendel's wrinkled-seed allele (r) encodes a defective starch-branching enzyme. Developing rr seeds make much less amylopectin and accumulate sucrose instead. Which statement about the carbohydrate chemistry involved is correct?
      options:
        - "Amylopectin is a branched glucose polymer with α 1-6 links at the branch points; without the branching enzyme the seed makes less of it and its glucose stays in smaller, soluble sugars."
        - "Amylopectin is a straight-chain polymer of fructose, and the enzyme adds the fructose units."
        - "Sucrose is a polysaccharide that forms when starch is hydrolysed."
        - "The branching enzyme converts cellulose into starch, so rr seeds have thicker cell walls."
      option_explanations:
        - |
          Correct. Starch is amylose (unbranched α 1-4) plus amylopectin (α 1-4 with α 1-6 branches); the branching enzyme makes the α 1-6 links. Less branching means less starch is laid down and more sugar stays free, which sets up the osmotic effect that wrinkles the seed.
        - |
          Amylopectin is made of glucose, not fructose, and it is branched rather than straight; its branching is exactly what the defective enzyme fails to do.
        - |
          Sucrose is a disaccharide (glucose + fructose), not a polysaccharide, and it accumulates in rr seeds because glucose is not being locked into starch, not because starch is being digested.
        - |
          Cellulose (β 1-4) and starch (α 1-4) are made by different enzymes from the same monomer; no enzyme converts one into the other, and seed wrinkling is about starch content, not walls.
      answer: 0
      explanation: |
        A Mendelian allele is a difference in a protein. Unit 1's starch chemistry explains what the r allele actually changes, and that chemistry is the first link in the chain from genotype to phenotype.

    - slug: u05-w16-q13
      type: multiple_choice
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Developing rr pea seeds accumulate free sucrose where RR seeds store insoluble starch. During development the rr seeds take up more water than RR seeds and swell; when the seeds dry they lose that water and collapse into the wrinkled shape. Which explanation of the water uptake is correct?
      options:
        - "Sucrose lowers the solute potential of the seed cells, making their water potential more negative than the surrounding tissue, so water moves in by osmosis."
        - "Sucrose raises the water potential of the seed cells, so water is pushed in by pressure."
        - "Starch is a strong osmotic solute, so RR seeds should take up more water than rr seeds."
        - "Water enters the seed by active transport powered by the sucrose."
      option_explanations:
        - |
          Correct. Dissolved sucrose adds solute particles; by Ψs = −iCRT the solute potential falls, total water potential falls, and water moves from the higher-potential surroundings into the seed. Insoluble starch grains contribute almost nothing to the solute concentration.
        - |
          Adding solute lowers water potential (makes it more negative); it never raises it. Water moves down a water-potential gradient, not by being pushed.
        - |
          Starch is insoluble and locked into grains, so it adds almost no solute particles; this is exactly why starch is a good storage form that does not disturb the cell's water balance.
        - |
          Water crosses membranes by osmosis (through aquaporins and the bilayer); it is not pumped, and sucrose is a solute, not an energy source for transport.
      answer: 0
      explanation: |
        Unit 2's water potential explains a Mendelian phenotype: more dissolved sugar means more water in, and more water lost on drying means a wrinkled seed. Genotype acts through chemistry and physics.

    - slug: u05-w16-q14
      type: multiple_choice
      topic_code: "4.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. A pea plant grows from a Yy zygote. Which statement about the genotype of its leaf cells, root cells and pollen is correct, and why?
      options:
        - "Leaf and root cells are all Yy because they arose by mitosis from the zygote; pollen grains are Y or y because they arose through meiosis."
        - "Leaf cells are YY and root cells are yy, because mitosis sends one allele to each tissue."
        - "All cells including pollen are Yy, because every cell division copies the whole genome."
        - "Leaf and root cells are Y or y, because mitosis halves the genome; pollen is Yy."
      option_explanations:
        - |
          Correct. Mitosis copies every chromosome and gives each daughter a full set, so every somatic cell keeps the zygote's Yy genotype; meiosis in the anthers separates Y from y, so each pollen grain carries one allele.
        - |
          Mitosis never separates the two alleles of a gene into different cells; both homologues are copied and both copies go to each daughter.
        - |
          Mitosis does copy the whole genome, but pollen is produced by meiosis, which separates homologues and leaves each gamete with one allele.
        - |
          This reverses the two divisions: mitosis conserves the diploid genotype and meiosis halves it.
      answer: 0
      explanation: |
        Mitosis explains why an organism is the same genotype everywhere; meiosis explains why its gametes are not. Keep the two divisions attached to their jobs.

    - slug: u05-w16-q15
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The R allele encodes a starch-branching enzyme; the r allele carries an insertion that produces a truncated protein lacking part of its active site. A heterozygous (Rr) seed makes enough branched starch to be round. Which explanation of why one functional allele is sufficient is best?
      options:
        - "Enzymes are catalysts that are not used up, so half the normal amount of enzyme can still convert most of the substrate within the time the seed develops."
        - "The truncated enzyme from the r allele works at twice the normal rate to compensate."
        - "The R allele is transcribed twice as often in heterozygotes to make up for the missing copy."
        - "Starch forms spontaneously without an enzyme once sucrose concentration is high enough."
      option_explanations:
        - |
          Correct. A single enzyme molecule turns over many substrate molecules; with ample time and substrate, half the normal enzyme concentration still produces enough branched starch for a round seed. This is why many loss-of-function alleles are recessive.
        - |
          A protein missing part of its active site cannot bind or process substrate properly; it is inactive, not hyperactive.
        - |
          There is no general mechanism that doubles transcription of one allele to compensate for the loss of the other; dosage compensation of this kind is not what makes most loss-of-function alleles recessive.
        - |
          Forming the α 1-6 branch requires an enzyme to bring the chain ends together and lower the activation energy; high substrate concentration does not substitute for a catalyst.
      answer: 0
      explanation: |
        Recessiveness usually has a biochemical reason: one working copy of an enzyme gene produces enough catalyst. Unit 3's enzyme kinetics explains why dominance is the common pattern for enzyme genes.

    - slug: u05-w16-q16
      type: multi_select
      topic_code: "5.3"
      source: "Biology 2e §12.1 Mendel's Experiments and the Laws of Probability"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following statements about Mendel's experiments and the inferences he drew from them are correct? Select all that apply.
      options:
        - "The reappearance of the recessive trait in about a quarter of the F2 showed that the hereditary factors are discrete and are not blended in a hybrid."
        - "Because every F1 plant showed one parental trait, Mendel inferred that each individual carries two factors for a trait and that one can mask the other."
        - "Mendel's ratios were close to 3:1 because he scored only a few dozen plants per cross."
        - "Mendel chose traits with continuous variation, such as plant mass, because they are easier to measure."
        - "Mendel's inference that each gamete carries one factor explains why a heterozygote's offspring show a 3:1 ratio."
      option_explanations:
        - |
          Correct. Under blending, the white trait would have been diluted permanently; its return, unchanged, in 1/4 of the F2 is the signature of particulate inheritance.
        - |
          Correct. A uniform F1 that still produced white-flowered F2 plants meant the white factor was present but hidden, so each plant must carry two factors with one dominant.
        - |
          Mendel counted thousands of plants (nearly 30,000 across all traits), and it was the large samples that let the ratios converge on 3:1. Small samples would have given noisier ratios.
        - |
          Mendel deliberately chose discontinuous traits with two clear forms; continuous traits like mass are polygenic and would have hidden the simple ratios.
        - |
          Correct. If a heterozygote's gametes are half Y and half y, random fusion gives 1 YY : 2 Yy : 1 yy, three of which show the dominant trait.
      answer: [0, 1, 4]
      explanation: |
        Mendel's argument runs: large samples, discrete traits, a vanishing-and-returning recessive, therefore two factors per plant that segregate into gametes. Each step is testable on the exam.

    - slug: u05-w16-q17
      type: multi_select
      topic_code: "5.3"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Select every statement that is correct about using the chi-square test on the results of a genetic cross.
      options:
        - "The expected counts come from the hypothesised ratio multiplied by the total number of offspring."
        - "Degrees of freedom equal the number of phenotype classes minus one."
        - "A calculated chi-square larger than the critical value at p = 0.05 means the null hypothesis is rejected."
        - "The test should be run on percentages rather than raw counts so that different sample sizes can be compared."
        - "A chi-square value below the critical value proves that the genes assort independently."
      option_explanations:
        - |
          Correct. For a 3:1 hypothesis with 200 offspring, e = 150 and 50; the hypothesis, not the data, sets the expected values.
        - |
          Correct. Four classes give df = 3; two classes give df = 1. The degrees of freedom select the row of the critical-value table.
        - |
          Correct. Exceeding the critical value means a deviation this large would arise by chance less than 5% of the time, so the hypothesised ratio is rejected.
        - |
          Chi-square must use counts; converting to percentages throws away the sample size, which is exactly what makes a given deviation significant or not.
        - |
          Failing to reject is not proof; it means the data are consistent with the hypothesis. A small sample can fail to reject a hypothesis that a large sample would reject.
      answer: [0, 1, 2]
      explanation: |
        Counts in, expected from the ratio, df from the classes, compare to the table, and say "fail to reject" rather than "prove". Those five habits earn the chi-square points.

    - slug: u05-w16-q18
      type: true_false
      topic_code: "5.3"
      source: "Biology 2e §12.2 Characteristics and Traits"
      points: 1
      prompt: |
        True or false: Because a dominant allele masks a recessive allele in a heterozygote, dominant alleles are always more common in a population than recessive alleles.
      answer: false
      explanation: |
        False. Dominance describes what a heterozygote looks like; it says nothing about allele frequency. Polydactyly (extra fingers) is dominant and rare; blue eyes are recessive and common in some populations. Frequency is set by mutation, selection and chance (Unit 7), not by which allele masks the other.

    - slug: u05-w16-q19
      type: true_false
      topic_code: "5.2"
      source: "Biology 2e §12.3 Laws of Inheritance"
      points: 1
      prompt: |
        Review. True or false: A YyRr plant produces its four gamete types (YR, Yr, yR, yr) in equal proportions only if the two genes are on different chromosomes or far enough apart on one chromosome to be unlinked.
      answer: true
      explanation: |
        True. Equal proportions depend on independent assortment, which comes from the random orientation of different tetrads at metaphase I. If the two genes are close together on the same chromosome they travel together, and the parental combinations outnumber the recombinant ones; only crossing over, which becomes likelier with distance, separates them. Mendel's seven genes happen to be on different chromosomes or far apart, which is why he never saw linkage.

    - slug: u05-w16-q20
      type: fill_blank
      topic_code: "5.3"
      source: "Biology 2e §12.2 Characteristics and Traits"
      points: 1
      prompt: |
        To find out whether an individual showing a dominant phenotype is homozygous or heterozygous, it is crossed with a homozygous recessive individual in a ____ cross.
      answer: ["test", "testcross", "test cross"]
      explanation: |
        The homozygous recessive partner contributes only recessive alleles, so the offspring phenotypes reveal the unknown parent's gametes directly: all dominant means homozygous, about half recessive means heterozygous. "Back cross" is a cross to a parent and is not accepted unless the parent happens to be homozygous recessive.

    - slug: u05-w16-q21
      type: fill_blank
      topic_code: "5.1"
      source: "Biology 2e §12.3 Laws of Inheritance"
      points: 1
      prompt: |
        Review. The two alleles of a gene segregate into different gametes because they lie on the two ____ chromosomes, which are pulled to opposite poles during anaphase I.
      answer: ["homologous", "homologues", "homologs"]
      explanation: |
        Each allele sits at the same locus on one member of a homologous pair; separating the pair separates the alleles. "Sister" chromatids carry the same allele (they are copies) and separate at anaphase II, so "sister" is not accepted.

    - slug: u05-w16-q22
      type: numeric
      topic_code: "5.3"
      source: "Biology 2e §12.3 Laws of Inheritance"
      points: 1
      prompt: |
        In a cross AaBbCc × AaBbCc, where the three genes assort independently and each shows complete dominance, what is the probability that an offspring shows the dominant phenotype for genes A and B and the recessive phenotype for gene C? Give your answer as a decimal to three places.
      answer: { value: 0.141, tolerance: 0.003 }
      explanation: |
        Each gene is an independent Aa × Aa cross: P(dominant phenotype) = 3/4, P(recessive) = 1/4. By the product rule, P(A_ and B_ and cc) = 3/4 × 3/4 × 1/4 = 9/64 = 0.141. The forked-line method gives the same number without a 64-box Punnett square.

    - slug: u05-w16-q23
      type: short_answer
      topic_code: "5.3"
      source: "general knowledge"
      points: 4
      prompt: |
        Scientific investigation. In pea plants, tall (T) is dominant to dwarf (t). A breeder has a tall plant of unknown genotype. (a) Describe a cross that would reveal the plant's genotype and state the prediction for each possible genotype. (b) The cross yields 40 offspring: 23 tall and 17 dwarf. Calculate chi-square against the prediction for a heterozygous parent, state the degrees of freedom and the critical value at p = 0.05, and give the conclusion. (c) Explain why obtaining 40 tall and 0 dwarf offspring would support, but not absolutely prove, that the plant is homozygous.
      answer: |
        Cross the tall plant with a dwarf (tt) plant. TT → all offspring tall; Tt → about 1 tall : 1 dwarf. Expected 20 : 20; χ² = (23 − 20)²/20 + (17 − 20)²/20 = 0.45 + 0.45 = 0.90; df = 1; critical value 3.84; 0.90 < 3.84 so fail to reject: the data fit a heterozygous parent. Forty tall and no dwarf is expected only if TT, but a Tt plant has a probability of (1/2)⁴⁰ of producing 40 tall in a row, which is vanishingly small but not zero, so the evidence is overwhelming without being proof.
      explanation: |
        Four points.

        (a) 1 pt: a test cross with a homozygous recessive (dwarf, tt) plant, with both predictions: TT gives all tall offspring; Tt gives approximately 1:1 tall to dwarf. A cross to another tall plant or a self-cross earns nothing for this part because a Tt × Tt would give 3:1, which is harder to distinguish from all-tall in a small sample, and the prompt asks for the clearest design.

        (b) 2 pts: 1 pt for the calculation: expected 20 tall : 20 dwarf; χ² = 9/20 + 9/20 = 0.90 (accept 0.9); 1 pt for df = 1, critical value 3.84, and the conclusion that 0.90 is below 3.84 so the null hypothesis (parent heterozygous, 1:1 ratio) is not rejected. The word "prove" or "the parent is definitely Tt" costs the second point.

        (c) 1 pt: an all-tall result is the prediction for TT, but a Tt parent produces tall offspring with probability 1/2 at each birth, so 40 tall in a row has probability (1/2)⁴⁰ (about 10⁻¹²); the result is therefore strong evidence, not a proof, and larger numbers of offspring reduce the chance of a false conclusion further. Either the probability argument or the statement that absence of a recessive offspring can never be certain earns the point.

        Zero: crossing with a tall plant; using percentages in the chi-square; comparing χ² with 0.05 instead of with the critical value.

    - slug: u05-w16-q24
      type: short_answer
      topic_code: "5.3"
      source: "Biology 2e §12.1 Mendel's Experiments and the Laws of Probability"
      points: 4
      prompt: |
        Conceptual analysis. Two parents are both carriers (Aa) of a recessive condition. They plan to have four children. (a) Calculate the probability that all four children are unaffected, showing the rule you used. (b) Calculate the probability that at least one child is affected. (c) The couple's first three children are all unaffected. Explain what the probability of the fourth child being affected is and why the earlier births do not change it. (d) A student claims that because the expected ratio is 3:1, a family of four will have exactly three unaffected children and one affected child. Evaluate the claim.
      answer: |
        P(unaffected) = 3/4 per child; by the product rule P(all four unaffected) = (3/4)⁴ = 81/256 ≈ 0.32. P(at least one affected) = 1 − 81/256 = 175/256 ≈ 0.68. The fourth child is affected with probability 1/4, because each fertilisation is an independent event with the same gametes and the same Punnett square. The claim confuses a probability with a guarantee: 3:1 is the expected proportion over many offspring, and exactly 3:1 in a family of four has probability 4 × (3/4)³ × (1/4) = 108/256 ≈ 0.42, so most families of four will not show it.
      explanation: |
        Four points.

        (a) 1 pt: (3/4)⁴ = 81/256 ≈ 0.32 (accept 0.316 or 32%), with the product rule named or the multiplication shown. Using 1/4 for unaffected or adding instead of multiplying earns nothing.

        (b) 1 pt: 1 − 81/256 = 175/256 ≈ 0.68 (accept 0.684 or 68%). Credit also for a correct sum of the probabilities of exactly 1, 2, 3 and 4 affected children if the arithmetic is right. Giving 1/4 or 4 × 1/4 = 1 earns nothing.

        (c) 1 pt: the probability is 1/4; each birth is an independent event because the parents' genotypes and gamete probabilities do not change, so previous outcomes have no effect. Accept any clear statement of independence.

        (d) 1 pt: the claim is wrong because 3:1 is an expected ratio (a probability), not a guaranteed outcome in a small family; the chance of exactly 3 unaffected and 1 affected is 4 × (3/4)³ × (1/4) = 108/256 ≈ 0.42, so families of 4:0, 2:2 and so on are all common. The calculation is a bonus; the point is earned by distinguishing a probability from a guarantee and noting that small samples deviate.

        Zero: an answer that treats the four children as sharing one outcome; an answer that says the fourth child is "due" to be affected.

    - slug: u05-w16-q25
      type: long_answer
      topic_code: "5.3"
      source: "Biology 2e §12.1 Mendel's Experiments and the Laws of Probability"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. The table shows the F2 counts Mendel reported for his seven pea traits. In every case the F1 plants, produced by crossing two true-breeding lines, all showed the first-named trait.

        | Trait | F2 showing the F1 trait | F2 showing the other trait | Ratio |
        |---|---|---|---|
        | Flower colour (violet : white) | 705 | 224 | 3.15 : 1 |
        | Seed texture (round : wrinkled) | 5,474 | 1,850 | 2.96 : 1 |
        | Seed colour (yellow : green) | 6,022 | 2,001 | 3.01 : 1 |
        | Plant height (tall : dwarf) | 787 | 277 | 2.84 : 1 |
        | Pod texture (inflated : constricted) | 882 | 299 | 2.95 : 1 |
        | Flower position (axial : terminal) | 651 | 207 | 3.14 : 1 |
        | Pod colour (green : yellow) | 428 | 152 | 2.82 : 1 |

        Critical values of chi-square at p = 0.05: df 1 = 3.84, df 2 = 5.99, df 3 = 7.81.

        (a) Describe the pattern in the data across the seven traits.
        (b) Explain how the law of segregation accounts for the ratio, using a Punnett square or equivalent reasoning for the F1 self-cross.
        (c) For flower colour, calculate the expected counts under a 3:1 hypothesis and the chi-square value, state the degrees of freedom, and give the conclusion.
        (d) Explain why Mendel's use of hundreds or thousands of plants per trait mattered for the conclusion he drew.
        (e) Mendel allowed the violet-flowered F2 plants to self-pollinate and grew their offspring. Predict the pattern he found among those F2 parents and justify the prediction with the F2 genotype ratio.
      answer: |
        Every trait gives a ratio near 3:1, between 2.82 and 3.15, with the F1 trait in the majority. The F1 is heterozygous (Pp); segregation gives half P and half p gametes, and random fusion gives 1 PP : 2 Pp : 1 pp, three of which show the dominant trait. Flower colour: total 929; expected 696.75 violet and 232.25 white; χ² = (705 − 696.75)²/696.75 + (224 − 232.25)²/232.25 = 0.098 + 0.293 = 0.39; df = 1; 0.39 < 3.84, so fail to reject 3:1. Large samples make chance deviations small relative to the expected counts, so the ratios converge on the true value and the test has power to detect real departures. Among violet F2 plants, about one third (PP) breed true and two thirds (Pp) give 3:1 again, because the violet class is 1 PP : 2 Pp.
      explanation: |
        Eight points.

        (a) 1 pt: all seven traits show the F1 (dominant) form in about three quarters of the F2, with ratios close to 3:1 (range 2.82 to 3.15); must note both the consistency across traits and the approximate value with at least one number.

        (b) 2 pts: 1 pt for the F1 being heterozygous (Pp) and producing P and p gametes in equal numbers by segregation (anaphase I); 1 pt for the F2 genotype ratio 1 PP : 2 Pp : 1 pp from random fertilisation, with the phenotype ratio 3:1 arising because PP and Pp both show the dominant trait. A square with four boxes correctly labelled earns both points.

        (c) 2 pts: 1 pt for expected counts 929 × 3/4 = 696.75 violet and 929 × 1/4 = 232.25 white (accept 697 and 232); 1 pt for χ² = 8.25²/696.75 + 8.25²/232.25 = 0.098 + 0.293 = 0.39 (accept 0.38 to 0.40), df = 1, 0.39 < 3.84, fail to reject the 3:1 hypothesis. Calculation correct but conclusion phrased as "proves 3:1" earns one point only.

        (d) 1 pt: with large numbers the random deviation expected from chance is small compared with the expected counts, so the observed ratio approaches the true probability, and the chi-square test has power to detect a real departure from 3:1; a small sample could give 2:1 or 4:1 by chance alone. Accept an explanation in terms of standard error shrinking with sample size.

        (e) 2 pts: 1 pt for the prediction: about one third of the violet F2 plants breed true (all violet offspring) and about two thirds give a 3:1 ratio of violet to white; 1 pt for the justification: the violet F2 class is 1 PP : 2 Pp, so 1/3 are homozygous and 2/3 heterozygous. A prediction that "all violet plants breed true" or that "half breed true" earns nothing for the first point.

        Zero for a part: describing the data as "mostly dominant" with no ratio; attributing the 3:1 ratio to blending or to the dominant allele being more common; using percentages in the chi-square; comparing 0.39 with 0.05.
