week: 15
unit: 5
title: Meiosis and Genetic Diversity
topics: ["5.1", "5.2"]
guide: guides/week-15.md
guide_description: |
  How one round of DNA replication and two rounds of division turn a diploid cell into four haploid, genetically
  different gametes; what happens only in meiosis I; the three sources of variation (crossing over, independent
  assortment, random fertilisation) and the arithmetic behind them; the Sordaria crossover count from AP
  Investigation 7. Vocabulary, three worked examples, misconceptions, self-check.
flashcards_description: |
  32 cards: stages and ploidy, meiosis against mitosis, the sources of variation and their arithmetic, life cycles,
  nondisjunction and a Sordaria ascus to read.

flashcards:
  - front: Meiosis → what it produces and why organisms need it
    back: |
      One diploid cell → four haploid cells, each genetically different. Halving the chromosome number before fertilisation keeps the number constant from generation to generation; without it each generation would double.
    hint: One replication, two divisions.
    topic_code: "5.1"
  - front: Haploid (n) vs diploid (2n)
    back: |
      Diploid cells carry two sets of chromosomes, one from each parent; haploid cells carry one set. Human body cells are 2n = 46, gametes n = 23.
    topic_code: "5.1"
  - front: Homologous chromosomes → what they share and how they differ
    back: |
      One from each parent, same length, same centromere position, same genes in the same order, but possibly different alleles of those genes. They are not copies of each other.
    hint: Same genes, not necessarily the same alleles.
    topic_code: "5.1"
  - front: Sister chromatids → how they arise and when they separate
    back: |
      Identical copies made in S phase and held together at the centromere by cohesin. They stay joined through all of meiosis I and separate only at anaphase II.
    topic_code: "5.1"
  - front: Cohesin's job in meiosis
    back: |
      The protein ring that holds sister chromatids together. Arm cohesin is removed at anaphase I (letting homologues part at the chiasmata); centromere cohesin is protected until anaphase II.
    topic_code: "5.1"
  - front: Synapsis and the synaptonemal complex
    back: |
      In prophase I each pair of homologues lines up gene for gene (synapsis), zipped together by a protein lattice, the synaptonemal complex. Within it, recombination nodules mark where crossing over will happen.
    topic_code: "5.1"
  - front: Chiasma → what it is and why at least one is needed
    back: |
      The visible point where two non-sister chromatids have exchanged segments. It holds the homologous pair together until anaphase I, so a pair with no chiasma risks going to the same pole (nondisjunction).
    hint: Plural chiasmata.
    topic_code: "5.1"
  - front: Crossing over → which chromatids exchange and in which stage
    back: |
      Non-sister chromatids of a homologous pair break and rejoin at matching positions during prophase I. Sister chromatids are identical, so an exchange between them would change nothing.
    topic_code: "5.2"
  - front: Tetrad (bivalent)
    back: |
      A synapsed pair of homologous chromosomes: four chromatids held together at chiasmata. Tetrads, not single chromosomes, line up at the plate in metaphase I.
    topic_code: "5.1"
  - front: Prophase I → the events unique to it
    back: |
      Synapsis, formation of the synaptonemal complex, crossing over and the appearance of chiasmata, alongside the usual condensing of chromosomes, nuclear envelope breakdown and spindle formation.
    topic_code: "5.1"
  - front: Metaphase I → what lines up at the plate and how
    back: |
      Tetrads line up, one homologue facing each pole. Each pair orients independently of every other pair, which is the physical basis of independent assortment.
    topic_code: "5.1"
  - front: Anaphase I → what separates and what stays joined
    back: |
      Homologous chromosomes are pulled to opposite poles. Sister chromatids stay attached at the centromere, so each chromosome arriving at a pole still has two chromatids.
    hint: Homologues apart, sisters together.
    topic_code: "5.1"
  - front: Telophase I and interkinesis → ploidy of the products
    back: |
      Two haploid cells (one chromosome of each pair) whose chromosomes are still doubled. There is no S phase in interkinesis, so nothing is copied before meiosis II.
    topic_code: "5.1"
  - front: Reduction division → which division and why
    back: |
      Meiosis I. It separates homologues, so the chromosome number falls from 2n to n. Meiosis II is the equational division: it separates chromatids and leaves the number at n.
    topic_code: "5.1"
  - front: Anaphase II → what separates
    back: |
      Sister chromatids, which now count as individual chromosomes. After telophase II and cytokinesis there are four haploid cells with unreplicated chromosomes.
    topic_code: "5.1"
  - front: Meiosis I vs mitosis → three differences
    back: |
      Mitosis: no synapsis, no crossing over, individual chromosomes at the plate, sister chromatids separate, two identical 2n cells. Meiosis I: homologues pair and cross over, tetrads at the plate, homologues separate, two different n cells.
    topic_code: "5.1"
  - front: Meiosis II vs mitosis → the resemblance and the difference
    back: |
      Mechanically alike: individual chromosomes line up and sister chromatids separate. The difference is the starting cell (haploid, chromosomes altered by crossing over) and the result (four different n cells, not two identical 2n cells).
    topic_code: "5.1"
  - front: Independent assortment → the stage and the arithmetic
    back: |
      Each tetrad's orientation at metaphase I is random and independent of the others, so a cell with n pairs can make 2ⁿ different chromosome combinations in its gametes.
    hint: 2 to the power of the haploid number.
    topic_code: "5.2"
  - front: How many chromosome combinations can a human gamete carry from independent assortment alone?
    back: |
      2²³, a little over 8 million. Crossing over multiplies that further, so no two gametes from one person are realistically identical.
    topic_code: "5.2"
  - front: Random fertilisation → how it multiplies variation
    back: |
      Any sperm can fuse with any egg, so the combinations multiply: 2²³ × 2²³ ≈ 70 trillion chromosome combinations in a human zygote before crossing over is even counted.
    topic_code: "5.2"
  - front: The three sources of genetic variation from sexual reproduction
    back: |
      Crossing over (prophase I), independent assortment (metaphase I) and random fertilisation. Mutation creates new alleles; these three shuffle existing ones.
    topic_code: "5.2"
  - front: Recombinant chromatid
    back: |
      A chromatid carrying a combination of alleles that neither parental chromosome had, produced by crossing over. The four products of one meiosis can therefore differ even at linked genes.
    topic_code: "5.2"
  - front: Why does crossing over matter for evolution?
    back: |
      It makes new allele combinations on one chromosome, so a favourable allele can be separated from a harmful neighbour and tested in many backgrounds. Populations with more variation can respond to changing selection.
    topic_code: "5.2"
  - front: Nondisjunction → in meiosis I vs meiosis II, the gametes that result
    back: |
      Failure of homologues to separate in meiosis I gives four abnormal gametes (two n+1, two n−1). Failure of sister chromatids in meiosis II gives two normal, one n+1 and one n−1.
    topic_code: "5.2"
  - front: Red Queen hypothesis
    back: |
      Species coevolve with their predators, prey and parasites, so each must keep changing just to hold its place. Sexual reproduction supplies the steady stream of new combinations that keeps pace.
    hint: Running to stay in the same place.
    topic_code: "5.2"
  - front: Why does sexual reproduction persist when asexual reproduction is faster?
    back: |
      Asexual lineages gain variation only by mutation. Meiosis and fertilisation reshuffle alleles every generation, giving populations the variation that selection acts on when conditions change.
    topic_code: "5.2"
  - front: Diploid-dominant life cycle
    back: |
      Nearly all animals. The multicellular body is diploid; the only haploid cells are the gametes, made by meiosis in the gonads. Fertilisation restores 2n at the zygote.
    topic_code: "5.1"
  - front: Haploid-dominant life cycle
    back: |
      Most fungi and some algae. The body is haploid; two haploid cells fuse to make a short-lived diploid zygote that undergoes meiosis at once to make four haploid spores.
    topic_code: "5.1"
  - front: Alternation of generations → gametophyte and sporophyte
    back: |
      Plants and some algae. A haploid gametophyte makes gametes by mitosis; fertilisation gives a diploid sporophyte, which makes haploid spores by meiosis; spores grow into gametophytes.
    hint: Gametes by mitosis, spores by meiosis.
    topic_code: "5.1"
  - front: Gametes vs spores → how each is made
    back: |
      In animals gametes are the direct products of meiosis. In plants and fungi meiosis makes spores, which divide by mitosis to make haploid cells or bodies that later make gametes by mitosis.
    topic_code: "5.1"
  - front: A cell with 2n = 8 enters meiosis → chromosomes and chromatids at each stage
    back: |
      Metaphase I: 8 chromosomes, 16 chromatids, 4 tetrads. After meiosis I: 4 chromosomes, 8 chromatids per cell. Metaphase II: 4 chromosomes, 8 chromatids. After meiosis II: 4 chromosomes, 4 chromatids per cell.
    topic_code: "5.1"
  - front: Sordaria asci → how to read a crossover ascus
    back: |
      Eight spores in a row. A 4:4 pattern means no crossover between the spore-colour gene and the centromere; 2:2:2:2 or 2:4:2 means a crossover occurred. Map distance = (crossover asci ÷ total) × 100 ÷ 2.
    hint: Divide by two because only two of the four chromatids exchange.
    topic_code: "5.2"

quiz:
  description: |
    24 questions · about 28 minutes · about 70% meiosis and the sources of genetic variation (5.1, 5.2) and 30%
    review of the cell cycle, proteins, nucleic acids, respiration and cell signalling. Multiple choice, select-all,
    true/false and numeric items are graded at once; the fill-in-the-blank items are matched automatically; the two
    short answers and the long answer are graded by your teacher against the acceptable-answer summary.
  questions:
    - slug: u05-w15-q01
      type: multiple_choice
      topic_code: "5.1"
      source: "Biology 2e §11.1 The Process of Meiosis"
      points: 1
      prompt: |
        A species has 2n = 20. If its gametes were produced by mitosis rather than meiosis, what would the chromosome number of the zygote be after one generation, and why is this a problem?
      options:
        - "20; there would be no problem, because fertilisation does not change chromosome number."
        - "40; the number would double every generation, because fertilisation adds the two gametes' sets together."
        - "10; mitosis halves the chromosome number, so the zygote would be haploid."
        - "20; mitosis produces haploid gametes, so fertilisation would restore the diploid number."
      option_explanations:
        - |
          Fertilisation always sums the two gametes' chromosome sets; it is meiosis beforehand that keeps the sum constant. A zygote made from two 2n gametes is 4n.
        - |
          Correct. Mitosis copies the diploid number into each daughter cell, so two 2n gametes would fuse into a 4n zygote, then 8n, and so on. Meiosis exists to halve the number first.
        - |
          Mitosis never halves chromosome number; each daughter cell receives the full parental set. Halving is what meiosis I does.
        - |
          Mitosis produces cells with the same ploidy as the parent, so the gametes would be diploid, not haploid.
      answer: 1
      explanation: |
        The reason for meiosis is arithmetic: fertilisation adds, so something must divide. One reductional division before fertilisation keeps the species' chromosome number constant.

    - slug: u05-w15-q02
      type: multiple_choice
      topic_code: "5.1"
      source: "Biology 2e §11.1 The Process of Meiosis"
      points: 1
      prompt: |
        At which stage of meiosis are homologous chromosomes pulled to opposite poles while sister chromatids remain attached at their centromeres?
      options:
        - "Anaphase I"
        - "Anaphase II"
        - "Metaphase I"
        - "Prophase I"
      option_explanations:
        - |
          Correct. Anaphase I separates the members of each homologous pair; cohesin at the centromere keeps the sister chromatids together, so each pole receives doubled chromosomes.
        - |
          Anaphase II is when sister chromatids finally separate. By then the homologues have been in different cells since the end of meiosis I.
        - |
          In metaphase I the tetrads are lined up at the plate but nothing has moved yet; separation begins when chiasmata are released in anaphase I.
        - |
          Prophase I is when homologues pair and cross over; they are being joined, not pulled apart.
      answer: 0
      explanation: |
        The one-line summary of meiosis I is "homologues apart, sisters together". Reversing it is the most common error on chromosome-counting questions.

    - slug: u05-w15-q03
      type: multiple_choice
      topic_code: "5.1"
      source: "Biology 2e §11.1 The Process of Meiosis"
      points: 1
      prompt: |
        A diploid cell with 2n = 6 completes meiosis I. Which description of each daughter cell is correct?
      options:
        - "Six chromosomes, each with one chromatid; diploid"
        - "Three chromosomes, each with two chromatids; haploid"
        - "Three chromosomes, each with one chromatid; haploid"
        - "Six chromosomes, each with two chromatids; diploid"
      option_explanations:
        - |
          Meiosis I halves the number of chromosomes by separating homologues; a cell with six chromosomes after it would mean nothing had been reduced. Single chromatids appear only after anaphase II.
        - |
          Correct. Each daughter receives one member of each of the three homologous pairs, so it is haploid, but the sister chromatids have not yet separated, so each chromosome is still doubled.
        - |
          Single-chromatid chromosomes exist only after meiosis II; at the end of meiosis I every chromosome still carries its sister chromatid copy.
        - |
          This is the state at the start of meiosis (after S phase), not after meiosis I. Homologues have been separated by then.
      answer: 1
      explanation: |
        Meiosis I changes ploidy (2n → n) without changing the number of chromatids per chromosome; meiosis II does the reverse. Count chromosomes by centromeres, not by chromatids.

    - slug: u05-w15-q04
      type: multiple_choice
      topic_code: "5.2"
      source: "Biology 2e §11.1 The Process of Meiosis"
      points: 1
      prompt: |
        A student's model of crossing over shows two sister chromatids of one chromosome exchanging segments during prophase I. Which statement best evaluates the model?
      options:
        - "It is correct; crossing over exchanges segments between sister chromatids, which is how variation arises."
        - "It is wrong because crossing over exchanges segments between non-sister chromatids of homologous chromosomes; exchanging identical sister chromatids would produce no new combination."
        - "It is wrong because crossing over happens in prophase II, after the homologues have separated."
        - "It is wrong because crossing over exchanges whole chromosomes between the two cells formed by cytokinesis."
      option_explanations:
        - |
          Sister chromatids are copies of the same DNA molecule. Swapping identical segments creates no new combination of alleles, so this cannot be the source of variation.
        - |
          Correct. The two chromatids that exchange belong to different homologues, which may carry different alleles, so the exchange creates recombinant chromatids. The exchange happens within the synaptonemal complex in prophase I.
        - |
          Crossing over requires synapsed homologues, which exist only in prophase I. In prophase II each cell has one homologue of each pair, so there is nothing to exchange with.
        - |
          Crossing over is an exchange of DNA segments between chromatids inside one nucleus, not a transfer of chromosomes between cells.
      answer: 1
      explanation: |
        A crossover is only informative if the two partners can differ. Non-sister chromatids come from different parents; sister chromatids are copies. That is why the drawing matters.

    - slug: u05-w15-q05
      type: multiple_choice
      topic_code: "5.2"
      source: "Biology 2e §11.1 The Process of Meiosis"
      points: 1
      prompt: |
        A plant has 2n = 8. Ignoring crossing over, how many genetically different gametes can one plant produce through independent assortment alone?
      options:
        - "4"
        - "8"
        - "16"
        - "64"
      option_explanations:
        - |
          Four is the haploid number, the number of chromosomes per gamete, not the number of ways those chromosomes can be combined.
        - |
          Eight is the diploid number. The question asks about combinations, which grow as a power of two with the number of pairs.
        - |
          Correct. There are four homologous pairs; each pair orients two ways at metaphase I independently of the others, so 2⁴ = 16 combinations of maternal and paternal chromosomes.
        - |
          64 would be 2⁶, the answer for a species with six pairs (2n = 12), or 4³ for some other scheme; this plant has only four pairs.
      answer: 2
      explanation: |
        The exponent is the haploid number n, not 2n. Humans with n = 23 can make 2²³, over eight million, combinations before crossing over is counted.

    - slug: u05-w15-q06
      type: multiple_choice
      topic_code: "5.1"
      source: "Biology 2e §11.1 The Process of Meiosis"
      points: 1
      prompt: |
        Meiosis II is often described as mechanically similar to mitosis. Which feature is shared by meiosis II and mitosis but absent from meiosis I?
      options:
        - "Pairing of homologous chromosomes at the metaphase plate"
        - "Separation of sister chromatids at anaphase"
        - "A reduction in ploidy from diploid to haploid"
        - "Replication of DNA immediately before the division"
      option_explanations:
        - |
          Homologues pair only in meiosis I. In mitosis and meiosis II, chromosomes line up individually at the plate.
        - |
          Correct. In both mitosis and meiosis II the centromeres split and sister chromatids go to opposite poles; in meiosis I they stay together while homologues separate.
        - |
          Only meiosis I reduces ploidy. Mitosis keeps the parental ploidy, and meiosis II keeps the haploid state produced by meiosis I.
        - |
          DNA replicates before mitosis (S phase) but not before meiosis II; there is no S phase in interkinesis, which is why meiosis II ends with unreplicated chromosomes.
      answer: 1
      explanation: |
        Meiosis II copies the mechanics of mitosis (sisters separate) on cells that are already haploid and whose chromatids are no longer identical after crossing over.

    - slug: u05-w15-q07
      type: multiple_choice
      topic_code: "5.2"
      source: "Biology 2e §11.1 The Process of Meiosis"
      points: 1
      stimulus: |
        In AP Investigation 7 (part 2) students crossed a wild-type strain of the fungus Sordaria fimicola (black spores, +) with a tan-spore mutant (tn) and scored the hybrid asci along the line where the two mycelia met. Each ascus holds eight spores in a row, the products of one meiosis followed by one mitosis. Spore arrangements were classified and counted.

        | Ascus spore pattern | Number of asci |
        |---|---|
        | 4 black : 4 tan (4:4) | 128 |
        | 2 black : 2 tan : 2 black : 2 tan (2:2:2:2) | 52 |
        | 2 black : 4 tan : 2 black, or 2 tan : 4 black : 2 tan (2:4:2) | 40 |
        | Total | 220 |
      prompt: |
        Which asci in the table are the products of a crossover between the spore-colour gene and the centromere, and what is the evidence?
      options:
        - "The 4:4 asci, because they contain equal numbers of both spore colours."
        - "The 2:2:2:2 and 2:4:2 asci, because the two colours are no longer segregated into the two halves of the ascus, which happens only if a crossover moved an allele between non-sister chromatids before meiosis I."
        - "Only the 2:2:2:2 asci, because the 2:4:2 pattern is produced by nondisjunction."
        - "None of them; crossing over cannot be seen in a fungus because it has no homologous chromosomes."
      option_explanations:
        - |
          Every ascus has four black and four tan spores because the hybrid is heterozygous; the 4:4 pattern is the one where the alleles separated cleanly at meiosis I, meaning no crossover between gene and centromere.
        - |
          Correct. Without a crossover, the + and tn alleles separate at anaphase I and each half of the ascus is one colour. A crossover between the gene and the centromere puts both alleles on each homologue, so the alleles separate only at meiosis II and the colours alternate along the ascus.
        - |
          Both alternating patterns come from a crossover; which of the two appears depends only on how the chromatids happen to be arranged at metaphase II. Nondisjunction would change the spore count, not the pattern.
        - |
          Sordaria is diploid for the brief period after the two nuclei fuse, and that zygote undergoes meiosis with normal homologue pairing. The linear ascus is what makes the crossover visible.
      answer: 1
      explanation: |
        The ordered ascus turns an invisible molecular exchange into a countable pattern: colours in blocks of four mean first-division segregation, alternating colours mean second-division segregation after a crossover.

    - slug: u05-w15-q08
      type: multiple_choice
      topic_code: "5.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        In AP Investigation 7 (part 2) students crossed a wild-type strain of the fungus Sordaria fimicola (black spores, +) with a tan-spore mutant (tn) and scored the hybrid asci along the line where the two mycelia met. Each ascus holds eight spores in a row, the products of one meiosis followed by one mitosis. Spore arrangements were classified and counted.

        | Ascus spore pattern | Number of asci |
        |---|---|
        | 4 black : 4 tan (4:4) | 128 |
        | 2 black : 2 tan : 2 black : 2 tan (2:2:2:2) | 52 |
        | 2 black : 4 tan : 2 black, or 2 tan : 4 black : 2 tan (2:4:2) | 40 |
        | Total | 220 |
      prompt: |
        The lab manual instructs students to divide the percentage of crossover asci by two to obtain the distance between the gene and the centromere in map units. Why is the division by two necessary?
      options:
        - "Because each ascus holds eight spores but only four are produced by meiosis."
        - "Because a crossover involves only two of the four chromatids in a tetrad, so half the spores in a crossover ascus still carry the parental arrangement."
        - "Because half of the asci are produced by the wild-type parent and half by the mutant parent."
        - "Because map units are defined as twice the recombination frequency."
      option_explanations:
        - |
          The mitosis after meiosis doubles every spore equally, so it does not bias the count of crossover versus non-crossover asci; the correction is about chromatids, not spore number.
        - |
          Correct. In any one crossover, two chromatids exchange and two do not, so a crossover ascus is only half recombinant spores. Dividing by two converts the ascus frequency into the fraction of recombinant chromatids, which is what a map unit measures.
        - |
          The asci scored are all hybrid (one nucleus from each parent); if a parent self-fertilised its asci would be all one colour and would not be counted.
        - |
          One map unit is one percent recombinant products, not twice that. The division is a correction to the raw ascus count, not part of the definition of the unit.
      answer: 1
      explanation: |
        Recombination frequency counts recombinant chromatids, not tetrads that experienced a crossover. In every tetrad with one crossover, exactly half the products are recombinant.

    - slug: u05-w15-q09
      type: numeric
      topic_code: "5.2"
      source: "general knowledge"
      points: 1
      stimulus: |
        In AP Investigation 7 (part 2) students crossed a wild-type strain of the fungus Sordaria fimicola (black spores, +) with a tan-spore mutant (tn) and scored the hybrid asci along the line where the two mycelia met. Each ascus holds eight spores in a row, the products of one meiosis followed by one mitosis. Spore arrangements were classified and counted.

        | Ascus spore pattern | Number of asci |
        |---|---|
        | 4 black : 4 tan (4:4) | 128 |
        | 2 black : 2 tan : 2 black : 2 tan (2:2:2:2) | 52 |
        | 2 black : 4 tan : 2 black, or 2 tan : 4 black : 2 tan (2:4:2) | 40 |
        | Total | 220 |
      prompt: |
        Using the data in the table, calculate the distance in map units between the spore-colour gene and the centromere. Give your answer to one decimal place.
      answer: { value: 20.9, tolerance: 0.5 }
      explanation: |
        Crossover asci = 52 + 40 = 92. Percentage of crossover asci = 92 ÷ 220 × 100 = 41.8%. Map distance = 41.8 ÷ 2 = 20.9 map units. The published value for the tan gene is about 26 map units; a class count that falls short usually reflects asci scored before the spores were mature or 2:4:2 asci mistaken for 4:4.

    - slug: u05-w15-q10
      type: multiple_choice
      topic_code: "5.2"
      source: "Biology 2e §13.2 Chromosomal Basis of Inherited Disorders"
      points: 1
      prompt: |
        During the formation of sperm, one pair of homologous chromosomes fails to separate in anaphase I, while every other pair behaves normally. Which description of the four resulting sperm is correct?
      options:
        - "All four have the normal chromosome number, because meiosis II corrects the error."
        - "Two have one extra chromosome (n + 1) and two are missing one chromosome (n − 1)."
        - "Two are normal, one has an extra chromosome and one is missing a chromosome."
        - "One has two extra chromosomes and three are normal."
      option_explanations:
        - |
          Meiosis II separates whatever sister chromatids are present; it cannot restore a chromosome to a cell that never received a homologue, nor remove the extra one.
        - |
          Correct. Both homologues go into one of the two meiosis I products, and neither goes into the other. Meiosis II then splits each cell faithfully, so both products of the first cell are n + 1 and both products of the second are n − 1.
        - |
          Two normal plus one n + 1 and one n − 1 is the signature of nondisjunction in meiosis II, where only one of the two cells is affected.
        - |
          A single failure of one pair moves one extra chromosome, not two, and it leaves one cell short; no outcome of a meiosis I error produces three normal gametes.
      answer: 1
      explanation: |
        When the error is in meiosis I every product is wrong; when it is in meiosis II, half are. The difference is a frequent AP item because it tests whether you know what separates when.

    - slug: u05-w15-q11
      type: multiple_choice
      topic_code: "4.5"
      source: "Biology 2e §11.1 The Process of Meiosis"
      points: 1
      prompt: |
        Review. A skin cell from an organism with 2n = 16 divides by mitosis. Compared with a gamete from the same organism, how many chromosomes does each daughter cell of the mitotic division contain, and how do the two daughters compare genetically?
      options:
        - "8 chromosomes each, genetically different from one another."
        - "16 chromosomes each, genetically identical to one another and to the parent cell."
        - "16 chromosomes each, genetically different because of crossing over in prophase."
        - "32 chromosomes each, because DNA was replicated before division."
      option_explanations:
        - |
          Eight is the gamete number; mitosis does not reduce the chromosome number. The daughters keep all 16.
        - |
          Correct. Mitosis separates sister chromatids, so each daughter receives a full copy of every chromosome: 16 chromosomes, identical sequences, as in the parent. That is why it serves growth and repair.
        - |
          Crossing over requires the synapsis of homologues, which happens only in prophase I of meiosis; mitotic prophase has no pairing, so the daughters are identical.
        - |
          Replication doubles the chromatids, not the chromosome count, and the two chromatids of each chromosome go to different daughters, returning each to 16.
      answer: 1
      explanation: |
        Mitosis conserves; meiosis reduces and reshuffles. Keep the contrast clear: identical 2n cells from mitosis, four different n cells from meiosis.

    - slug: u05-w15-q12
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. A sperm cell's midpiece is packed with mitochondria wrapped around the base of the flagellum. Which process supplies most of the ATP that powers the flagellum, and where in the mitochondrion does it occur?
      options:
        - "Glycolysis, in the mitochondrial matrix"
        - "Oxidative phosphorylation, across the inner mitochondrial membrane"
        - "The Calvin cycle, in the intermembrane space"
        - "Fermentation, on the outer mitochondrial membrane"
      option_explanations:
        - |
          Glycolysis takes place in the cytosol, not the matrix, and yields only 2 ATP per glucose; it is not the main source of a flagellum's energy.
        - |
          Correct. The electron transport chain in the inner membrane pumps protons into the intermembrane space, and ATP synthase uses that gradient to make the bulk of the cell's ATP, which is why mitochondria cluster where the power is needed.
        - |
          The Calvin cycle is a chloroplast process that fixes carbon; it consumes ATP rather than producing it, and sperm have no chloroplasts.
        - |
          Fermentation occurs in the cytosol when oxygen is scarce and regenerates NAD⁺ without producing extra ATP beyond glycolysis.
      answer: 1
      explanation: |
        Structure follows energy demand: the cell that must swim furthest puts its mitochondria at the base of the motor. Unit 3's chemiosmosis is the reason.

    - slug: u05-w15-q13
      type: multiple_choice
      topic_code: "1.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Shugoshin is a protein that protects cohesin at the centromere during meiosis I so that sister chromatids stay together. A mutation replaces a nonpolar amino acid buried in the protein's core with a charged one. What is the most likely consequence and why?
      options:
        - "No effect, because the protein's function depends only on its primary sequence, which is still almost the same."
        - "The protein misfolds because a charged R group in the hydrophobic core disrupts the tertiary structure, so centromere cohesin is lost early and sister chromatids may separate in meiosis I."
        - "The protein becomes more stable because ionic bonds are stronger than hydrophobic interactions."
        - "The protein is unaffected because the mutation changes only its quaternary structure."
      option_explanations:
        - |
          Function depends on the folded shape, and the fold depends on the chemistry of the R groups. A single substitution in the core can change the shape, as sickle-cell haemoglobin shows.
        - |
          Correct. Nonpolar R groups cluster in the core to escape water; a charged group there cannot be satisfied and the chain rearranges or aggregates. A non-functional shugoshin would let sister chromatids part early, an error in chromosome distribution.
        - |
          A charged group buried away from water has no partner to bond with; it destabilises rather than stabilises the fold. Stability is not about which bond type is nominally stronger.
        - |
          A single substitution changes the primary structure and, through folding, the tertiary structure of that chain; quaternary structure concerns how separate chains associate.
      answer: 1
      explanation: |
        Unit 1's rule that R-group chemistry sets the fold is the reason a one-residue change can derail a meiotic division. Where a substitution sits decides what it does.

    - slug: u05-w15-q14
      type: multiple_choice
      topic_code: "4.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Follicle-stimulating hormone (FSH), a large glycoprotein released into the blood by the pituitary, stimulates cells in the ovary to support the cells beginning meiosis. Which description of how FSH delivers its signal is most consistent with its chemistry?
      options:
        - "FSH diffuses through the plasma membrane and binds a receptor in the cytoplasm, which then enters the nucleus."
        - "FSH binds a receptor on the cell surface; the receptor activates a G protein, which raises a second messenger such as cAMP inside the cell."
        - "FSH enters through a channel protein and binds directly to DNA."
        - "FSH acts only on the cell that secreted it, so no receptor is needed."
      option_explanations:
        - |
          Large, polar glycoproteins cannot cross the hydrophobic interior of the bilayer. Intracellular receptors are for small hydrophobic ligands such as steroid hormones.
        - |
          Correct. A hydrophilic ligand must be recognised at the surface. FSH binds a G-protein-coupled receptor; the signal is passed inside and amplified by second messengers, so a few hormone molecules change the activity of many enzymes.
        - |
          Channels pass ions and small molecules, not proteins, and no hormone binds DNA without first being received and relayed.
        - |
          FSH is an endocrine signal: it travels through the blood from the pituitary to a distant target, which is the definition of a signal that needs a receptor.
      answer: 1
      explanation: |
        Unit 4's rule, hydrophilic ligands use surface receptors and second messengers, hydrophobic ones use intracellular receptors, applies to the hormones that start meiosis.

    - slug: u05-w15-q15
      type: multi_select
      topic_code: "5.1"
      source: "Biology 2e §11.1 The Process of Meiosis"
      points: 2
      partial_credit: true
      prompt: |
        Select every event that occurs in meiosis I but not in mitosis.
      options:
        - "Homologous chromosomes pair along their length (synapsis)"
        - "Non-sister chromatids exchange segments (crossing over)"
        - "Sister chromatids separate at anaphase"
        - "Tetrads, rather than individual chromosomes, line up at the metaphase plate"
        - "The nuclear envelope breaks down in prophase"
      option_explanations:
        - |
          Correct. Synapsis, held by the synaptonemal complex, happens only in prophase I; mitotic chromosomes never pair with their homologues.
        - |
          Correct. Crossing over requires synapsed homologues and so is unique to meiosis I. It is the first source of new allele combinations.
        - |
          Sister chromatids separate in mitosis and in meiosis II, not in meiosis I, where they stay attached while homologues part.
        - |
          Correct. In metaphase I each tetrad straddles the plate with one homologue facing each pole; in mitosis each chromosome lines up on its own.
        - |
          Nuclear envelope breakdown happens in the prophase of every division, mitosis included, so it does not distinguish meiosis I.
      answer: [0, 1, 3]
      explanation: |
        Everything that makes meiosis different happens in the first division: pairing, exchange and the lining up of pairs. The second division is mitosis on a haploid set.

    - slug: u05-w15-q16
      type: multi_select
      topic_code: "5.2"
      source: "Biology 2e §11.2 Sexual Reproduction"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following processes generate new combinations of existing alleles in the offspring of sexually reproducing organisms? Select all that apply.
      options:
        - "Random orientation of each tetrad at metaphase I"
        - "Exchange of segments between non-sister chromatids in prophase I"
        - "DNA replication in S phase before meiosis"
        - "Fusion of any one of many sperm with any one of many eggs"
        - "Separation of sister chromatids at anaphase II"
      option_explanations:
        - |
          Correct. Independent assortment gives 2ⁿ possible chromosome combinations per gamete, with maternal and paternal chromosomes mixed at random.
        - |
          Correct. Crossing over produces recombinant chromatids with allele combinations neither parent carried on one chromosome.
        - |
          Replication copies each chromosome exactly; it preserves combinations rather than creating them. Errors in replication can make new alleles (mutation), but that is not reshuffling.
        - |
          Correct. Random fertilisation multiplies the gamete combinations of the two parents, around 2²³ × 2²³ in humans.
        - |
          Anaphase II parts two chromatids that are copies of each other (apart from any crossover already made in prophase I); it distributes variation that already exists rather than creating it.
      answer: [0, 1, 3]
      explanation: |
        Mutation makes new alleles; sexual reproduction shuffles them three ways: crossing over, independent assortment and random fertilisation. Know which stage does which.

    - slug: u05-w15-q17
      type: true_false
      topic_code: "5.1"
      source: "Biology 2e §11.1 The Process of Meiosis"
      points: 1
      prompt: |
        True or false: The two cells produced by meiosis I are genetically identical to each other, and genetic differences among gametes arise only during meiosis II.
      answer: false
      explanation: |
        False. The two products of meiosis I differ: each received a different random mixture of maternal and paternal homologues (independent assortment), and crossing over in prophase I has already made the chromatids recombinant. Meiosis II then separates chromatids that are no longer identical. Both sources of variation act before or during the first division; meiosis II only distributes them.

    - slug: u05-w15-q18
      type: true_false
      topic_code: "4.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. True or false: A cell whose DNA is damaged can be held at the G2/M checkpoint, giving it time to repair the damage before it divides, or be directed to apoptosis if the damage cannot be repaired.
      answer: true
      explanation: |
        True. Checkpoints are where the cycle's regulatory proteins (cyclin-Cdk complexes, with p53 as the damage sensor) decide whether conditions permit the next step. Holding a damaged cell before mitosis, or before meiosis, prevents a mutated or broken chromosome from being handed to daughter cells or gametes; apoptosis removes cells that fail. Loss of these controls is one route to cancer.

    - slug: u05-w15-q19
      type: true_false
      topic_code: "1.6"
      source: "Biology 2e §3.5 Nucleic Acids"
      points: 1
      prompt: |
        Review. True or false: When non-sister chromatids are cut and rejoined during crossing over, the bonds that are broken and re-formed in each DNA backbone are hydrogen bonds between complementary bases.
      answer: false
      explanation: |
        False. The backbone of a DNA strand is held together by covalent phosphodiester bonds between the 3′ carbon of one nucleotide and the 5′ phosphate of the next; crossing over cuts and reseals those covalent bonds with enzymes. Hydrogen bonds join the two strands across the helix (A–T two, G–C three) and are broken and re-formed when strands separate and re-pair, but they are not what holds the backbone together.

    - slug: u05-w15-q20
      type: fill_blank
      topic_code: "5.1"
      source: "Biology 2e §11.1 The Process of Meiosis"
      points: 1
      prompt: |
        The X-shaped point where two non-sister chromatids have exchanged segments, which holds a homologous pair together until anaphase I, is called a ____.
      answer: ["chiasma", "chiasmata"]
      explanation: |
        A chiasma is the visible result of a crossover and does mechanical work: at least one per pair is needed so that the homologues are held facing opposite poles. "Synaptonemal complex" is the protein zipper that holds the pair earlier in prophase I and disassembles before the chiasmata become visible, so it is not accepted; "centromere" is where sister chromatids are joined, not homologues.

    - slug: u05-w15-q21
      type: fill_blank
      topic_code: "4.5"
      source: "Biology 2e §11.1 The Process of Meiosis"
      points: 1
      prompt: |
        Review. The sister chromatids that are separated at anaphase II were produced during the ____ phase of interphase, before meiosis began.
      answer: ["S", "S phase", "synthesis"]
      explanation: |
        DNA is replicated once, in S phase, and that single replication supplies the chromatids for both meiotic divisions; there is no second S phase during interkinesis. "G2" is the gap after replication in which the cell prepares to divide, and "prophase" is part of division, so neither is accepted.

    - slug: u05-w15-q22
      type: short_answer
      topic_code: "5.1"
      source: "Biology 2e §11.1 The Process of Meiosis"
      points: 4
      prompt: |
        Conceptual analysis. A cell of a species with 2n = 6 divides. (a) State the number of chromosomes in each product and the number of products if the division is mitosis, and if it is meiosis. (b) Explain why the products of meiosis differ from one another genetically while the products of mitosis do not. (c) Identify the stage at which the chromosome number is halved and the event responsible. (d) Predict how the products of meiosis would be affected if crossing over were prevented but every other step occurred normally, and justify your prediction.
      answer: |
        Mitosis: two cells with 6 chromosomes; meiosis: four cells with 3. Meiosis products differ because homologues carrying different alleles are shuffled independently at metaphase I and exchanged segments in prophase I, whereas mitosis separates identical sister chromatids. The number is halved at anaphase I when homologues separate. Without crossing over the four cells would still be haploid and still vary by independent assortment (2³ = 8 combinations), but every chromosome would be entirely maternal or paternal, so fewer combinations would be possible and, since chiasmata hold pairs together, nondisjunction would become more frequent.
      explanation: |
        Four points, one per task.

        (a) 1 pt: mitosis gives two cells each with 6 chromosomes; meiosis gives four cells each with 3. Both numbers of cells and both chromosome counts are required.

        (b) 1 pt: the products of meiosis differ because homologous chromosomes (which may carry different alleles) are distributed at random at metaphase I/anaphase I and because crossing over in prophase I makes recombinant chromatids; mitosis separates sister chromatids, which are identical copies, so the daughters match. Either independent assortment or crossing over, correctly tied to its stage, plus the identical-sisters point about mitosis earns the point.

        (c) 1 pt: anaphase I (accept "meiosis I"), when homologous chromosomes are pulled to opposite poles. Naming anaphase II or "when sister chromatids separate" earns nothing.

        (d) 1 pt: prediction that the products remain haploid and still differ by independent assortment but carry only whole parental chromosomes (no recombinant chromatids), reducing the number of possible combinations; a bonus justification is that without chiasmata homologues are not held together and may fail to separate (nondisjunction). The prediction must be accompanied by a reason that references what crossing over normally contributes.

        Zero: answers claiming mitosis produces four cells or meiosis produces identical cells; attributing the halving to meiosis II; predicting that without crossing over the gametes would be diploid.

    - slug: u05-w15-q23
      type: short_answer
      topic_code: "5.2"
      source: "Biology 2e §11.2 Sexual Reproduction"
      points: 4
      prompt: |
        Argumentation. An asexually reproducing population of water fleas can, in principle, grow twice as fast as a sexually reproducing one because every individual produces offspring. Yet in lakes where a fungal parasite is common, sexually reproducing populations persist and asexual clones tend to disappear within a few years. (a) Describe the cost of sexual reproduction that the growth comparison refers to. (b) Explain how meiosis and fertilisation produce variation in the offspring that an asexual clone cannot. (c) Using the Red Queen hypothesis, explain why the parasite makes variation valuable. (d) Predict what would happen to the two populations if the parasite were eliminated from the lake, and justify your prediction.
      answer: |
        Half the sexual population (males) produces no offspring directly, so per-capita growth is slower. Crossing over, independent assortment and random fertilisation reshuffle alleles each generation, so offspring carry new combinations, whereas a clone's offspring are identical apart from rare mutations. Parasites evolve to infect the common genotypes; a population that keeps producing new combinations stays ahead, while a clone is a fixed target that the parasite adapts to. Without the parasite the asexual clone's faster growth would let it outnumber the sexual population, at least until conditions changed again.
      explanation: |
        Four points.

        (a) 1 pt: in a sexual population only females produce offspring (or: each parent contributes only half its genome to each offspring), so the population's growth rate is about half that of an all-reproducing asexual population. Either statement of the "twofold cost" earns the point.

        (b) 1 pt: at least two of crossing over (prophase I), independent assortment (metaphase I) and random fertilisation, with the consequence that offspring have allele combinations neither parent had; and the contrast that an asexual clone's offspring are genetically identical to the parent except for new mutations. Naming the processes without the contrast earns nothing.

        (c) 1 pt: the parasite coevolves with its host, adapting to infect the genotypes that are currently most common; a sexual population continually presents new genotypes the parasite is not adapted to, while a clone is genetically uniform and, once the parasite adapts, every individual is susceptible. Accept "arms race" or "running to stay in place" if the coevolution is explicit.

        (d) 1 pt: the asexual clone's higher growth rate would let it increase relative to the sexual population (or even replace it) because the advantage of variation no longer applies; justified by the removal of the selective pressure. A prediction in the other direction earns nothing; an answer noting that a different change in the environment could restore the advantage of variation is a valid extension.

        Zero: answers that say asexual reproduction is "primitive" or sexual reproduction is "more advanced"; answers that attribute variation in the sexual population solely to mutation.

    - slug: u05-w15-q24
      type: long_answer
      topic_code: "5.2"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. In fruit flies, the c(3)G mutation prevents formation of the synaptonemal complex in females, and crossing over does not occur. Researchers mated wild-type females and c(3)G females, each heterozygous at four linked genes on chromosome 3 and at two genes on chromosome 2, to tester males, and examined 400 offspring from each. They scored (i) how many distinct allele combinations appeared among the offspring at the four chromosome-3 genes, (ii) how many distinct combinations appeared at the two chromosome-2 genes (which are on different homologues from each other's partner, so they assort independently), and (iii) how many offspring had an abnormal chromosome number for chromosome 3.

        | Female genotype | Distinct combinations at the four chromosome-3 genes | Distinct combinations at the two chromosome-2 genes | Offspring with abnormal chromosome-3 number (of 400) |
        |---|---|---|---|
        | Wild type | 14 | 4 | 2 |
        | c(3)G | 2 | 4 | 41 |

        (a) Describe the differences between the two groups in each of the three columns.
        (b) Explain why the c(3)G females produced only two allele combinations at the four linked genes, and identify what the two combinations must be.
        (c) Explain why the number of combinations at the chromosome-2 genes was the same in both groups.
        (d) Propose a mechanism for the twenty-fold increase in offspring with an abnormal chromosome-3 number in the c(3)G group, referring to the role of chiasmata in meiosis I.
        (e) Predict the result in the first column if the four genes were instead located on four different chromosomes, and justify your prediction.
      answer: |
        Wild-type females gave 14 combinations at the linked genes, c(3)G only 2; both gave 4 at the chromosome-2 genes; abnormal chromosome counts rose from 2 to 41. Without a synaptonemal complex there is no crossing over, so each chromosome 3 is passed on intact: the offspring receive either the whole maternal or the whole paternal allele set, the two parental combinations. Independent assortment at metaphase I does not depend on crossing over, so the two chromosome-2 genes still give 2 × 2 = 4 combinations. Chiasmata hold homologues together so that they face opposite poles; without them, both homologues of chromosome 3 can go to the same pole (nondisjunction), producing n + 1 and n − 1 gametes. On four separate chromosomes the four genes would assort independently and 2⁴ = 16 combinations would appear in both groups, because that variation comes from orientation at metaphase I, not from crossing over.
      explanation: |
        Eight points.

        (a) 1 pt: all three comparisons with numbers: 14 versus 2 combinations at the linked genes; 4 versus 4 at the chromosome-2 genes (no difference); 2 versus 41 offspring with abnormal chromosome-3 number. Two of the three with numbers earns the point; a description with no numbers earns nothing.

        (b) 2 pts: 1 pt for the mechanism: with no synaptonemal complex homologues do not synapse, so there is no crossing over and no recombinant chromatids; each chromosome 3 is inherited as a block. 1 pt for identifying the two combinations as the two parental arrangements, the full set of alleles on the mother's maternal chromosome 3 and the full set on her paternal chromosome 3.

        (c) 1 pt: the two chromosome-2 genes are on different homologous pairs from each other's partner (they assort independently), and independent assortment arises from the random orientation of tetrads at metaphase I, which does not require crossing over; so 2 × 2 = 4 combinations appear regardless of the mutation. The answer must separate the two sources of variation.

        (d) 2 pts: 1 pt for stating that chiasmata physically hold a homologous pair together after the synaptonemal complex disassembles, which is what positions one homologue toward each pole at metaphase I; 1 pt for the consequence: without a crossover there is no chiasma, the homologues are free to orient independently and can both travel to the same pole at anaphase I (nondisjunction), producing gametes with two copies or no copy of chromosome 3 and hence offspring with abnormal numbers. Accept "the homologues are not held together" plus "both go to one pole" for full credit.

        (e) 2 pts: 1 pt for the prediction of 16 combinations (2⁴) in both groups; 1 pt for the justification that genes on different chromosomes recombine by independent assortment at metaphase I, which is intact in c(3)G females, so crossing over is irrelevant to them. A prediction of 16 for wild type and 2 for c(3)G shows the two sources have not been separated and earns the first point only if the number is right.

        Zero for a part: attributing the loss of combinations to the flies "not reproducing"; describing nondisjunction as a failure of sister chromatids to separate (that is meiosis II, and the mutation acts in prophase I); predicting that without crossing over the chromosome-2 genes would also give fewer combinations.
