  - slug: review-practice-q61
    type: long_answer
    topic_code: "7.2"
    source: "general knowledge"
    points: 10
    prompt: |
      Interpreting and evaluating experimental results. A grass species grows both on salt-sprayed coastal cliffs and in inland meadows. To test whether the coastal population has evolved salt tolerance, researchers collected seeds from each population, germinated them in a greenhouse, and grew 20 seedlings from each population at each of three sodium chloride concentrations in the watering solution. After six weeks they measured seedling height. Means and twice the standard error (2 SE) are shown.

      | NaCl in watering solution (mmol/L) | Coastal population: mean height (cm) ± 2 SE | Inland population: mean height (cm) ± 2 SE |
      |---|---|---|
      | 0 | 12.4 ± 0.8 | 13.1 ± 0.9 |
      | 100 | 11.6 ± 0.7 | 8.2 ± 1.0 |
      | 200 | 9.8 ± 0.9 | 3.1 ± 0.8 |

      (a) Describe the graph you would construct to present these data: the type of graph, what goes on each axis with units and a sensible scale, what is plotted for each population and each concentration, and how you would show the variability in the data.
      (b) State the null hypothesis the researchers were testing. Using the 2 SE values, determine whether the two populations differ in height at 0 mmol/L and at 200 mmol/L, and justify each determination.
      (c) Explain, in terms of natural selection, how a heritable difference in salt tolerance between the two populations could have arisen.
      (d) The researchers propose a reciprocal transplant: seedlings of each population planted at both the coastal and the inland site. Predict the outcome for the inland seedlings at the coastal site and for the coastal seedlings at the inland site, and justify each prediction with the data.
      (e) Identify one feature of the design that allows the difference between populations to be attributed to genotype rather than to the environment in which the parent plants grew, and describe one additional measurement that would strengthen the claim that the coastal population's tolerance is an adaptation.
    answer: |
      (a) A bar graph (or line graph) with NaCl concentration (mmol/L: 0, 100, 200) on the x-axis and mean seedling height (cm, scale 0 to 15) on the y-axis; two bars (or lines) per concentration, one per population, with a key; error bars of ±2 SE on every mean. (b) Null: salt concentration has the same effect on height in both populations (no difference between populations). At 0 mmol/L the intervals (11.6-13.2 and 12.2-14.0) overlap, so no difference is supported; at 200 mmol/L (8.9-10.7 and 2.3-3.9) they do not overlap, so the populations differ. (c) Coastal plants vary in salt tolerance; in salt-sprayed soil the more tolerant individuals survive and reproduce more, passing on tolerance alleles, so their frequency rises over generations; the inland population experiences no such selection. (d) Inland seedlings at the coast will grow poorly or die (their height fell to 3.1 cm at 200 mmol/L); coastal seedlings inland will grow about as well as inland plants (12.4 versus 13.1 at 0 mmol/L, overlapping). (e) A common garden: all seedlings were grown from seed under identical greenhouse conditions, so a difference must be genetic; strengthen with a second generation grown from greenhouse seed (heritability), with survival or seed set rather than height (fitness), or with a measure of soil salinity at each site.
    explanation: |
      Ten points.

      (a) Graph, 2 pts: 1 pt for a correctly labelled bar graph or line graph with the independent variable (NaCl concentration, mmol/L) on the x-axis and the dependent variable (mean seedling height, cm) on the y-axis, both with units and a scale that spans the data (0 to about 15 cm; x at 0, 100, 200), with both populations shown and distinguished by a key; 1 pt for error bars of ±2 SE drawn on each mean (naming the error bars as 2 SE, or standard error, is required; "error bars" alone without saying what they show earns the point only if the student says they represent variability around the mean). A graph with the axes reversed or with no units earns at most 1 pt.

      (b) Hypothesis and error bars, 2 pts: 1 pt for a null hypothesis stating that there is no difference between the populations in their response to salt (or that salt has no effect on height, with the comparison then made between populations); 1 pt for both determinations with the overlap reasoning: at 0 mmol/L the 2 SE intervals overlap (11.6 to 13.2 and 12.2 to 14.0), so the data do not support a difference; at 200 mmol/L the intervals do not overlap (8.9 to 10.7 versus 2.3 to 3.9), so the populations differ. A student who gives the right calls but no interval reasoning earns 1 pt total for the part.

      (c) Natural selection, 2 pts: 1 pt for the mechanism: variation in salt tolerance exists in the coastal population, individuals with greater tolerance survive and reproduce more in salt-sprayed soil (differential reproductive success), and the trait is heritable; 1 pt for the population-level outcome: the frequency of alleles conferring tolerance increases over generations in the coastal population while the inland population, not exposed to salt, experiences no such selection and keeps the ancestral distribution. Answers that say plants "developed" tolerance because they "needed" it, or that individual plants adapted, earn zero for the part.

      (d) Reciprocal transplant, 2 pts: 1 pt for predicting that inland seedlings at the coastal site grow poorly or die, justified by their collapse to 3.1 cm at 200 mmol/L; 1 pt for predicting that coastal seedlings at the inland site grow about as well as inland seedlings, justified by the overlapping heights at 0 mmol/L (12.4 versus 13.1). A prediction that coastal plants do worse inland is acceptable for the point only if the student argues from a cost of tolerance and notes the data show at most a small, non-significant difference.

      (e) Design and extension, 2 pts: 1 pt for identifying the common-garden feature: seeds from both populations were germinated and grown under the same greenhouse conditions, so environmental differences between the field sites cannot explain the difference in response; 1 pt for a sensible additional measurement: growing a second generation from greenhouse-produced seed to confirm heritability, measuring survival or seed production (fitness) rather than height, measuring soil salinity at each site to confirm the selective agent, or genotyping candidate tolerance genes in both populations.

      Zero for a part: a graph description with no axes or no units; "they are different" with no reference to the error bars; selection explained as the environment causing mutations; a transplant prediction with no reference to any value in the table; "repeat the experiment" with no stated purpose.

  - slug: review-practice-q62
    type: long_answer
    topic_code: "3.4"
    source: "general knowledge"
    points: 9
    prompt: |
      Interpreting and evaluating experimental results. Researchers measured the net rate of oxygen exchange of a leaf (μmol O₂ per m² per second; positive values are net release, negative values are net uptake) at a series of light intensities and at two concentrations of carbon dioxide. Temperature was held at 25 °C. Each value is the mean of six leaves; standard errors were all below 0.4.

      | Light intensity (μmol photons per m² per second) | Net O₂ exchange at 400 ppm CO₂ | Net O₂ exchange at 800 ppm CO₂ |
      |---|---|---|
      | 0 | −1.0 | −1.0 |
      | 100 | 2.0 | 2.1 |
      | 200 | 4.5 | 4.8 |
      | 400 | 8.0 | 9.5 |
      | 800 | 10.0 | 15.0 |
      | 1200 | 10.2 | 17.8 |

      (a) Describe the relationship between light intensity and net oxygen exchange at 400 ppm CO₂, and identify the light intensity above which further increases in light produce little or no increase in rate.
      (b) Explain why the net oxygen exchange is negative at a light intensity of zero.
      (c) Calculate the average rate of change in net oxygen exchange between 100 and 400 μmol photons per m² per second at 400 ppm CO₂, and give the units.
      (d) Explain, with reference to the light-dependent reactions and the Calvin cycle, why the rate levels off at high light intensity at 400 ppm CO₂ but continues to rise at 800 ppm CO₂.
      (e) A student claims that "doubling the CO₂ concentration doubles the rate of photosynthesis." Evaluate the claim using specific values from the table.
      (f) The leaf is treated with a herbicide that blocks the flow of electrons out of photosystem II and the measurement at 800 μmol photons and 800 ppm CO₂ is repeated. Predict the result and justify your prediction.
    answer: |
      (a) Net O₂ release rises steeply with light from −1.0 at darkness, then flattens; above about 800 μmol photons per m² per second the rate barely changes (10.0 to 10.2), so 800 is the saturating intensity. (b) In darkness there is no photosynthesis, but the leaf still respires, consuming O₂, so net exchange is negative. (c) (8.0 − 2.0) / (400 − 100) = 6.0 / 300 = 0.02 μmol O₂ per μmol photons (per m² per s, per unit light). (d) At high light the light reactions make ATP and NADPH faster than the Calvin cycle can use them because rubisco is limited by CO₂ at 400 ppm; the Calvin cycle becomes the bottleneck, so more light cannot raise the rate. At 800 ppm rubisco has more substrate, the Calvin cycle regenerates NADP⁺ and ADP faster, and the light reactions can keep going. (e) The claim fails: at 100 μmol photons the rates are 2.0 and 2.1 (no real difference, light-limited); at 1200 they are 10.2 and 17.8, a 1.7-fold increase, not 2-fold. CO₂ matters only when light is not limiting, and never exactly doubles the rate. (f) Net exchange would fall to about −1.0: with no electron flow from PSII, water is not split, no O₂ is released, no NADPH or ATP is made so the Calvin cycle stops, and only respiration continues, regardless of light or CO₂.
    explanation: |
      Nine points.

      (a) Description, 1 pt: net O₂ exchange increases with light intensity (steeply at first, from −1.0 to 8.0 between 0 and 400) and then levels off; the saturating intensity is about 800 μmol photons per m² per second (accept 400 to 800 if justified by the small gains beyond that point). Must give the trend and the plateau with at least one number from the table.

      (b) Respiration, 1 pt: in darkness no photosynthesis occurs, but cellular respiration continues in the leaf's mitochondria, consuming O₂ (and releasing CO₂), so the net exchange is uptake, shown as a negative value. Saying "no light so no oxygen is made" without naming respiration as the reason for consumption earns zero.

      (c) Calculation, 1 pt: (8.0 − 2.0) / (400 − 100) = 0.02 μmol O₂ per μmol photons (equivalently 0.02 (μmol O₂ per m² per s) per (μmol photons per m² per s)). The numerical value and a correct unit are both required; 6.0/300 shown with the answer 0.02 and units earns the point.

      (d) Mechanism, 2 pts: 1 pt for identifying that at saturating light the light-dependent reactions are producing ATP and NADPH faster than the Calvin cycle can consume them, so the Calvin cycle (carbon fixation by rubisco, limited by CO₂ supply at 400 ppm) becomes the rate-limiting step and additional light cannot increase the overall rate; 1 pt for explaining that at 800 ppm the higher CO₂ concentration increases the rate of fixation by rubisco, so NADP⁺ and ADP are regenerated faster and the light reactions continue to be used, letting the rate keep rising with light. An answer that names only "CO₂ is limiting" without connecting the two stages earns 1 pt.

      (e) Evaluation, 2 pts: 1 pt for citing a light-limited comparison where doubling CO₂ had essentially no effect (100 μmol: 2.0 versus 2.1; or 200: 4.5 versus 4.8); 1 pt for citing a high-light comparison and computing that the increase is less than twofold (1200 μmol: 17.8/10.2 ≈ 1.7; or 800: 15.0/10.0 = 1.5) and concluding that the effect of CO₂ depends on light and is never a doubling. A bare "the claim is wrong" with no values earns zero.

      (f) Prediction, 2 pts: 1 pt for predicting that net O₂ exchange falls to about −1.0 (net uptake, the dark value); 1 pt for the justification: blocking electron flow from photosystem II stops the splitting of water, so no O₂ is produced, no NADPH (and, with no electron transport, no proton gradient and no ATP) reaches the Calvin cycle, so carbon fixation stops too; respiration continues, so the leaf is a net consumer of O₂ regardless of the light and CO₂ supplied. Predicting zero rather than −1.0 earns the second point only, if the justification is complete.

      Zero for a part: a description with no numbers; "the plant is asleep" or "the plant breathes at night" without the word respiration or the idea of O₂ consumption by mitochondria; a rate with no units; invoking "the plant has enough light" without identifying which stage limits; evaluating the claim without any value from the table; predicting that CO₂ or light "compensates" for a blocked photosystem.

  - slug: review-practice-q63
    type: short_answer
    topic_code: "2.6"
    source: "Biology 2e §5.2 Passive Transport"
    points: 4
    prompt: |
      Scientific investigation. Yeast cells take up the sugar glucose from their medium. A student wants to determine whether glucose enters yeast cells by simple diffusion through the lipid bilayer or by facilitated diffusion through a transport protein. The student can measure the rate of glucose uptake (micromoles per minute per gram of yeast) at any external glucose concentration and can add other sugars to the medium. (a) State a hypothesis and a prediction that would distinguish the two mechanisms. (b) Describe a procedure to test the prediction, identifying the independent variable, the dependent variable and at least two variables to hold constant. (c) Describe the result that would support facilitated diffusion and explain why. (d) Identify a result that would refute facilitated diffusion.
    answer: |
      Hypothesis: glucose enters through a transport protein. Prediction: uptake rate rises with external concentration and then levels off (saturates) because the transporters are all occupied, and a structurally similar sugar (such as 2-deoxyglucose or galactose) added to the medium competes and lowers the glucose uptake rate; simple diffusion would rise linearly with concentration without saturation or competition. Procedure: IV = external glucose concentration (a series, e.g. 0 to 100 mmol/L); DV = initial rate of glucose uptake; hold constant temperature, pH, yeast mass, time of measurement and absence or fixed amount of competitor; replicate. Supporting result: a curve that plateaus at high concentration (and a lower rate when a competing sugar is present), because a finite number of carriers sets a maximum rate. Refuting result: uptake rate increases in direct proportion to concentration with no plateau and no effect of a competing sugar.
    explanation: |
      Four points.

      (a) Hypothesis and prediction, 1 pt: a hypothesis naming one mechanism (either is acceptable) and a prediction that differs between the mechanisms: facilitated diffusion predicts saturation of the uptake rate at high glucose concentration and/or inhibition by a competing, structurally similar sugar; simple diffusion predicts a rate proportional to concentration with no saturation and no competition. A prediction that would be the same under both mechanisms (for example "uptake increases with concentration") earns zero.

      (b) Procedure, 1 pt: a workable design that names the independent variable (external glucose concentration across a range, or presence versus absence of a competing sugar at fixed glucose), the dependent variable (rate of glucose uptake, in the stated units, measured over a fixed short interval) and at least two controlled variables from: temperature, pH, mass or number of yeast cells, incubation time, volume, stirring, no other sugars present. Replication is a bonus but not required for the point.

      (c) Supporting result, 1 pt: the uptake rate rises with concentration and then levels off at a maximum (a plateau), and/or the rate is lower when the competing sugar is present; explanation that a limited number of transport proteins can each move only so many molecules per second, so once they are all occupied the rate cannot rise further (or the competitor occupies some of them). Both the result and the reason are required.

      (d) Refuting result, 1 pt: the uptake rate increases linearly with concentration with no sign of levelling off across the range tested, or the competing sugar has no effect on uptake, which would be expected if glucose crossed the bilayer directly. Accept either observation.

      Zero: a design with no measurable rate; "glucose is polar so it must use a protein" offered as a result rather than reasoning; testing temperature or pH instead of concentration; predictions that do not differ between the two mechanisms.

  - slug: review-practice-q64
    type: short_answer
    topic_code: "4.6"
    source: "general knowledge"
    points: 4
    prompt: |
      Conceptual analysis. In normal cells, a growth factor binds a receptor tyrosine kinase at the cell surface, which activates a cascade of kinases that ends by increasing the production of a cyclin needed to pass the G1 checkpoint. A tumour is found in which the receptor gene carries a mutation that makes the receptor's kinase domain permanently active, with or without growth factor. (a) Describe how the normal pathway ensures that cells divide only when growth factor is present. (b) Explain why the mutation leads to uncontrolled cell division. (c) Predict the effect on the tumour cells of a drug that binds the receptor's ATP-binding site and blocks its kinase activity, and justify your prediction. (d) The same tumour later acquires a second mutation that inactivates p53. Explain why the combination is more dangerous than the receptor mutation alone.
    answer: |
      (a) Without growth factor the receptor is inactive, the cascade is off, cyclin is not made and the cell stops at the G1 checkpoint; the external signal is the switch. (b) The mutant receptor signals constantly, so the cascade is always on, cyclin is produced continuously, the G1 checkpoint is passed regardless of external conditions and the cells keep dividing. (c) The drug blocks the kinase, so even the mutant receptor cannot phosphorylate its targets; the cascade shuts off, cyclin production falls and the cells stop dividing (or slow greatly). (d) p53 normally halts the cycle when DNA is damaged and triggers apoptosis if repair fails; a cell dividing continuously accumulates replication errors, and without p53 those errors are neither repaired nor eliminated, so further mutations accumulate and the tumour evolves faster and resists control.
    explanation: |
      Four points.

      (a) Normal control, 1 pt: the receptor is active only when growth factor is bound, so the kinase cascade and the cyclin production downstream depend on the external signal; in the absence of growth factor the cell cannot pass the G1 checkpoint. Must link signal presence to checkpoint passage, not merely list the pathway.

      (b) Effect of mutation, 1 pt: a constitutively active receptor sends the signal continuously, independent of growth factor, so the cascade is always on, cyclin is always produced, the G1 checkpoint is always passed and division no longer waits for the external signal. Accept "oncogene" or "gain of function" as labels only if the mechanism is stated.

      (c) Prediction, 1 pt: the drug inhibits the receptor's kinase, so the mutant receptor can no longer phosphorylate the next component; the cascade stops, cyclin production falls and the cells stop or slow their division. The prediction (division stops or slows) and the justification (the block is downstream of the mutation's cause but upstream of the cascade) are both required; "the drug kills the cells" without reasoning earns zero.

      (d) Second mutation, 1 pt: p53 is the checkpoint protein that stops the cycle when DNA is damaged and promotes apoptosis if repair fails; without it, the rapidly dividing cells accumulate unrepaired mutations and are not eliminated, so the tumour gains additional mutations faster (including ones that could confer drug resistance), making it more aggressive. Must give p53's function and connect it to the consequence.

      Zero: describing the receptor as producing growth factor; "the cells grow faster" with no reference to the checkpoint or cyclin; predicting the drug has no effect because the receptor is mutated; naming p53 as an oncogene or as a positive regulator.

  - slug: review-practice-q65
    type: short_answer
    topic_code: "7.9"
    source: "Biology 2e §20.2 Determining Evolutionary Relationships"
    points: 4
    prompt: |
      Analyze a model. A cladogram of five plant lineages is drawn as follows. A green alga branches off first. Of the remaining four, moss branches next. Of the remaining three, fern branches next. The last two, pine and sunflower, share the final node. Three derived characters are marked on the tree: vascular tissue appears on the branch after moss splits off; seeds appear on the branch after fern splits off; flowers appear on the sunflower branch only. (a) Identify the shared derived character that defines the clade containing pine and sunflower, and state which lineages in the tree lack it. (b) Explain the role of the green alga in this cladogram. (c) A student says that moss is "less evolved" than sunflower because it branches off lower on the tree. Evaluate the claim. (d) A newly discovered fossil plant has vascular tissue but produces no seeds. Describe where it should be placed on the cladogram and justify your placement.
    answer: |
      (a) Seeds; green alga, moss and fern lack seeds. (b) The alga is the outgroup, a lineage that split off before the others and so shows which character states are ancestral; it roots the tree and lets each later character be read as derived. (c) The claim is wrong: every lineage at the tips has been evolving for the same length of time since the root; moss branching earlier means it shares a more distant common ancestor with sunflower, not that it is primitive or stopped evolving. Branch order shows relatedness, not rank. (d) It belongs on the branch between the moss split and the seed node, alongside fern (or as a branch off that segment), because it has the derived character vascular tissue but not the later derived character seeds, so it shares the vascular-plant ancestor but not the seed-plant ancestor.
    explanation: |
      Four points.

      (a) Shared derived character, 1 pt: seeds (not vascular tissue, which also includes fern, and not flowers, which only sunflower has); the lineages lacking seeds are green alga, moss and fern. Both the character and the three seedless lineages are needed.

      (b) Outgroup, 1 pt: the green alga is the outgroup, a lineage known to have diverged before the group of interest; it is used to root the tree and to decide which state of each character is ancestral and which is derived (for example, lacking vascular tissue is ancestral because the alga lacks it). Either the rooting function or the ancestral-state function earns the point.

      (c) Evaluation, 1 pt: the claim is incorrect because all living lineages are equally old (each has evolved for the same time since the common ancestor at the root); branching lower means moss's lineage separated earlier from the line leading to sunflower, which is a statement about relatedness, not about being less advanced. An answer that points out that the tree could be drawn with moss on the right by rotating nodes also earns the point. "Moss is simpler" without addressing the claim earns zero.

      (d) Placement, 1 pt: the fossil joins the tree on the branch after moss (it has vascular tissue, so it is inside the vascular-plant clade) but before the seed node (it lacks seeds, so it is outside the seed-plant clade), that is, as a lineage branching near fern; justification must name both characters. Placing it with pine and sunflower, or before moss, earns zero.

      Zero: treating vascular tissue as the character defining the pine-sunflower clade; calling the alga "the first plant" without saying what it is for in the analysis; agreeing with the "less evolved" claim; placing the fossil by its age rather than by its characters.

  - slug: review-practice-q66
    type: short_answer
    topic_code: "8.5"
    source: "Biology 2e §45.6 Community Ecology"
    points: 4
    prompt: |
      Analyze data. In a greenhouse, a plant bed was stocked with a herbivorous mite and a predatory mite that eats it. Both populations were counted on a fixed set of leaves every two weeks.

      | Week | Herbivorous mites (per 100 leaves) | Predatory mites (per 100 leaves) |
      |---|---|---|
      | 0 | 40 | 4 |
      | 2 | 160 | 8 |
      | 4 | 420 | 30 |
      | 6 | 300 | 85 |
      | 8 | 90 | 70 |
      | 10 | 30 | 20 |
      | 12 | 60 | 8 |
      | 14 | 210 | 14 |

      (a) Describe the pattern in the two populations over the 14 weeks, using data from the table. (b) Explain why the predator population peaks after the herbivore population does. (c) Explain whether predation here is acting as a density-dependent or a density-independent factor on the herbivorous mite. (d) Predict what would happen to the herbivorous mite population if the predatory mites were removed at week 12, and justify your prediction.
    answer: |
      (a) Both populations oscillate: herbivores rise from 40 to a peak of 420 at week 4, crash to 30 by week 10 and begin rising again (210 at week 14); predators rise more slowly to a peak of 85 at week 6, two weeks after the herbivore peak, then fall to 8 by week 12 and start to rise again at week 14. Predator peaks lag herbivore peaks. (b) Predators depend on prey for food; their numbers can only grow after prey become abundant, since reproduction takes time, and they decline only after they have reduced the prey. (c) Density-dependent: the predators' impact rises with herbivore density (the crash follows the herbivore peak and the predator build-up), and it is weak when herbivores are scarce, so the per-capita effect depends on population density. (d) Without predators the herbivorous mites would grow rapidly, approximately exponentially at first (they were already rising, 30 to 60 to 210), until food (the leaves) or space limited them and the population approached a carrying capacity set by the plant bed, possibly overshooting and damaging the plants.
    explanation: |
      Four points.

      (a) Description, 1 pt: both populations rise and fall in cycles, with the herbivore peak (420 at week 4) preceding the predator peak (85 at week 6) and the herbivore crash (to 30 at week 10) preceding the predator crash (to 8 at week 12), after which both begin to rise again. Must mention the oscillation or lag and cite at least two values from the table. "Both go up and down" with no data earns zero.

      (b) Lag, 1 pt: predator numbers depend on prey availability; predators reproduce only after prey are abundant (energy from feeding is converted into offspring over time), so their peak follows the prey peak; once predators are numerous they drive prey down, after which predators starve and decline, which lets prey recover. The explanation must connect the lag to predator reproduction or food supply.

      (c) Density dependence, 1 pt: density-dependent, because the predators' effect on the herbivore population grows as herbivore density grows (the crash occurs at and after the herbivore peak, when predators have built up) and is small at low density; the proportion of herbivores killed changes with density. Accept the argument from predator numerical response. Calling it density-independent, or giving no reasoning, earns zero.

      (d) Prediction, 1 pt: the herbivorous mite population grows rapidly (exponentially at first) and continues to rise instead of being driven down, until resource limitation (leaf area, food) slows growth toward a carrying capacity, possibly with overshoot and damage to the plants; justification must refer to the removal of the regulating factor and to a resource limit or carrying capacity. A prediction of unlimited growth with no mention of any limit earns the point only if it cites the data showing growth was already under way.

      Zero: a description with no numbers; "predators are slower" as the reason for the lag; confusing which species is the predator; predicting the herbivores would decline without predators.
