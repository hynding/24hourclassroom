week: 34
description: |
  A full-length practice version of the AP Biology exam, built to the real paper's shape. The real exam has two
  sections. Section I is 60 multiple-choice questions in 90 minutes and is half the score. Section II is 6
  free-response questions in 90 minutes and is the other half: two long questions on interpreting and evaluating
  experimental results (8-10 points each, always with a data set to describe, graph and reason from) and four
  short questions (4 points each), one each on scientific investigation, conceptual analysis, analysing a model
  or visual representation, and analysing data. Starting with the 2027 exam, graphing calculators are NOT
  permitted; a four-function calculator (with square root) is allowed in both sections and the formula sheet
  is provided, so practise here with nothing more than that. Multiple-choice weighting across the eight units
  follows the course weights (Unit 7 heaviest, Units 1 and 5 lightest), and about a third of the items come in
  sets that share one data table, figure or passage. In the app, items 1-60 (1 point each) are graded at once
  and items 61-66 (10, 9, 4, 4, 4 and 4 points) are graded by your teacher against the acceptable-answer summary
  attached to each, so the paper is out of 95 points and the free-response half counts for less here than on
  exam day; score the two halves separately to see your real standing. Sit it in one block if you can: 90
  minutes for items 1-60, a short break, then 90 minutes for items 61-66.
questions:
  # ======================================================================
  # Section I: 60 multiple choice. Unit 1 (6 items): q01-q06
  # ======================================================================
  # ---- Stimulus set A: macromolecule identification tests (1.4, 1.7, 1.5)
  - slug: review-practice-q01
    type: multiple_choice
    topic_code: "1.4"
    source: "general knowledge"
    points: 1
    stimulus: |
      Four unknown solutions were tested with four reagents. A plus sign means a positive result (colour change); a minus sign means no change. Solubility was judged by shaking 1 mL of the unknown into 10 mL of water.

      | Unknown | Benedict's (reducing sugar) | Iodine (starch) | Biuret (peptide bonds) | Sudan IV (lipid) | Mixes with water? |
      |---|---|---|---|---|---|
      | W | + | − | − | − | Yes |
      | X | − | + | − | − | Forms a cloudy suspension |
      | Y | − | − | + | − | Yes |
      | Z | − | − | − | + | No, forms a separate layer |
    prompt: |
      Which unknown is most likely a polysaccharide, and which covalent linkage joins its monomers?
    options:
      - "W; glycosidic linkages, because it reacts with Benedict's reagent."
      - "Y; phosphodiester bonds, because it is soluble and gives exactly one positive test."
      - "X; peptide bonds, because a cloudy suspension is characteristic of a protein."
      - "X; α 1-4 glycosidic linkages between glucose units, because iodine binds the coiled amylose chain of starch."
    option_explanations:
      - |
        Benedict's reagent detects free reducing sugars (monosaccharides and some disaccharides), not polymers. A polysaccharide's glucose units are locked in glycosidic bonds and do not reduce copper, so W is a small sugar, not a polymer.
      - |
        Y is Biuret-positive, so it contains peptide bonds and is a protein. Phosphodiester bonds join nucleotides, and none of the four tests detects nucleic acids at all.
      - |
        Peptide bonds are what Biuret detects, and X is Biuret-negative. Cloudiness tells you about size and solubility, not about which class of macromolecule is present.
      - |
        Correct. Iodine slips inside the helix formed by α 1-4-linked glucose chains and turns blue-black; the cloudy suspension fits a large, poorly soluble polymer. Both lines of evidence point to starch.
    answer: 3
    explanation: |
      Read the table by test, not by row: each reagent reports one bond or group. Iodine reports the coiled α-glucose chain of starch, which is the only polysaccharide the panel can see.

  - slug: review-practice-q02
    type: multiple_choice
    topic_code: "1.7"
    source: "general knowledge"
    points: 1
    stimulus: |
      Four unknown solutions were tested with four reagents. A plus sign means a positive result (colour change); a minus sign means no change. Solubility was judged by shaking 1 mL of the unknown into 10 mL of water.

      | Unknown | Benedict's (reducing sugar) | Iodine (starch) | Biuret (peptide bonds) | Sudan IV (lipid) | Mixes with water? |
      |---|---|---|---|---|---|
      | W | + | − | − | − | Yes |
      | X | − | + | − | − | Forms a cloudy suspension |
      | Y | − | − | + | − | Yes |
      | Z | − | − | − | + | No, forms a separate layer |
    prompt: |
      Unknown Y speeds up the breakdown of hydrogen peroxide. After Y is held at 95 °C for ten minutes and cooled, it no longer speeds up the reaction, yet it still gives a positive Biuret test. Which explanation accounts for both results?
    options:
      - "Heat broke the hydrogen bonds, ionic bonds and hydrophobic interactions that hold the tertiary structure, deforming the active site, but left the covalent peptide bonds that Biuret detects intact."
      - "Heat broke the peptide bonds, which is why the catalytic activity was lost; the Biuret test is detecting the free amino acids."
      - "Heat converted the protein into a carbohydrate, which cannot act as a catalyst but still reacts with Biuret reagent."
      - "The activity was lost because the hydrogen peroxide, not the protein, was destroyed by the heat."
    option_explanations:
      - |
        Correct. Denaturation unfolds a protein by breaking the weak interactions of its secondary and tertiary structure while the primary structure stays covalently linked. The active site depends on the fold, so function is lost; the peptide bonds remain, so the test is still positive.
      - |
        Biuret reagent reacts with peptide bonds, not with free amino acids; a solution of free amino acids is Biuret-negative. A positive result after heating means the backbone is still joined, so the peptide bonds survived.
      - |
        Heat cannot change one class of macromolecule into another; it only breaks bonds. A carbohydrate would also be Biuret-negative, so this explanation fails the second observation.
      - |
        Fresh hydrogen peroxide was added for the second assay; the protein, not the substrate, was heated. The question is about what happened to Y.
    answer: 0
    explanation: |
      Denaturation versus hydrolysis: heat unfolds, it does not cut. Any time a test that reads covalent bonds stays positive while function disappears, the weak interactions of the fold are what changed.

  - slug: review-practice-q03
    type: multiple_choice
    topic_code: "1.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      Four unknown solutions were tested with four reagents. A plus sign means a positive result (colour change); a minus sign means no change. Solubility was judged by shaking 1 mL of the unknown into 10 mL of water.

      | Unknown | Benedict's (reducing sugar) | Iodine (starch) | Biuret (peptide bonds) | Sudan IV (lipid) | Mixes with water? |
      |---|---|---|---|---|---|
      | W | + | − | − | − | Yes |
      | X | − | + | − | − | Forms a cloudy suspension |
      | Y | − | − | + | − | Yes |
      | Z | − | − | − | + | No, forms a separate layer |
    prompt: |
      Which structural feature of the molecules in unknown Z best explains both its positive Sudan IV result and its refusal to mix with water?
    options:
      - "Z is a polymer with many charged phosphate groups along its backbone, so it is too large to dissolve."
      - "Z contains many hydroxyl groups that bind the dye and repel water molecules."
      - "Z consists mostly of long hydrocarbon chains with few or no groups that can form hydrogen bonds, so water excludes it and the nonpolar dye dissolves in it."
      - "Z is a protein whose hydrophobic R groups face outward, so it floats on water."
    option_explanations:
      - |
        A charged phosphate backbone is what makes nucleic acids highly water-soluble; charged polymers dissolve, they do not form a separate layer. Size alone does not prevent dissolving, and Sudan IV does not detect nucleic acids.
      - |
        Hydroxyl groups are polar and would make Z hydrogen-bond with water, which is the opposite of what was observed. Molecules rich in hydroxyls (sugars, glycerol) mix freely with water.
      - |
        Correct. Triglycerides are glycerol plus three fatty-acid chains of C–H bonds. Water hydrogen-bonds to itself and pushes out molecules that cannot join that network; the nonpolar dye partitions into the same nonpolar phase.
      - |
        Z is Biuret-negative, so it has no peptide bonds. A protein with hydrophobic residues outward would aggregate, but it would not give a positive lipid stain or be described as a liquid layer.
    answer: 2
    explanation: |
      Solubility is a question about hydrogen bonding: molecules that cannot join water's network are excluded. The Sudan IV stain and the separate layer are two readings of the same nonpolar hydrocarbon structure.

  # ---- Standalone Unit 1 items (1.1, 1.2, 1.7)
  - slug: review-practice-q04
    type: multiple_choice
    topic_code: "1.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Two weather stations lie at the same latitude. Station A sits on an ocean coast and records a difference of 9 °C between its warmest and coldest monthly mean temperatures. Station B, 800 km inland, records a difference of 34 °C. Which property of water, and which molecular cause, best explain the smaller range at Station A?
    options:
      - "Water's high specific heat: hydrogen bonds absorb much of the energy the ocean gains in summer and release it in winter, so the water and the air above it change temperature slowly."
      - "Water's cohesion: hydrogen bonds hold the surface together, which traps warm air over the ocean in winter."
      - "Water's low density as ice: sea ice forms in winter and insulates the coast from cold."
      - "Water's role as a solvent: dissolved salts in the ocean release heat when they react with cold air."
    option_explanations:
      - |
        Correct. Because energy goes into breaking hydrogen bonds before it raises molecular motion, water needs about four times more energy per degree than air or rock. The ocean is a thermal buffer, warming and cooling slowly and moderating coastal air.
      - |
        Cohesion explains surface tension and water transport in plants, not heat storage. The surface does not trap air; heat capacity, not stickiness, slows the ocean's temperature change.
      - |
        Most ocean coasts at temperate latitudes never freeze, and the moderation holds in summer too, when the coast stays cooler than inland. Ice insulation cannot explain a smaller summer peak.
      - |
        Dissolved salts do not react with air to release heat. Salinity slightly lowers the freezing point but is not what buffers seasonal temperature.
    answer: 0
    explanation: |
      Climate moderation by oceans is the same specific-heat story as a cell resisting temperature swings: hydrogen bonds soak up energy, so temperature lags energy gain and loss.

  - slug: review-practice-q05
    type: multiple_choice
    topic_code: "1.2"
    source: "general knowledge"
    points: 1
    prompt: |
      A culture of algae is moved to a growth medium that contains every nutrient except phosphorus. Over the next days cell division stops, but the cells continue to make new starch and new protein. Which set of molecules can the cells no longer synthesise, and why?
    options:
      - "Proteins and starch, because phosphorus forms the backbone of both."
      - "Nucleic acids, ATP and phospholipids, because each is built around phosphate groups that the cells can no longer obtain."
      - "Only nucleic acids, because phosphorus is found nowhere else in a cell."
      - "Cellulose and other carbohydrates, because sugars are phosphorylated before they are polymerised."
    option_explanations:
      - |
        The observation says protein and starch are still being made, which rules this out. Proteins are built from C, H, O, N and S; starch from C, H and O. Neither backbone contains phosphorus.
      - |
        Correct. Phosphate links nucleotides in DNA and RNA, carries the energy of ATP, and forms the hydrophilic head of every phospholipid. Without phosphorus the cell cannot replicate its DNA, so division stops, while carbon- and nitrogen-based polymers continue.
      - |
        Phosphorus is also essential in ATP, in phospholipid membranes and in the phosphate groups that regulate proteins. Naming only nucleic acids misses the cell's energy currency and its membranes.
      - |
        Although sugars are phosphorylated during metabolism, the cells here are still making starch from their existing phosphate pool; carbohydrates contain no phosphorus once polymerised. The data contradict this choice.
    answer: 1
    explanation: |
      Match each element to what it builds: N to amino groups and bases, P to nucleotides, ATP and phospholipid heads, S to two amino acids. A missing element shuts down exactly the molecules that contain it.

  - slug: review-practice-q06
    type: multiple_choice
    topic_code: "1.7"
    source: "general knowledge"
    points: 1
    prompt: |
      A purified enzyme is treated with a chemical that unfolds it completely; it loses all activity. The chemical is then removed by dialysis and the enzyme is left in buffer at room temperature with no other cellular components. Within an hour it has recovered 95% of its original activity. Which conclusion is best supported?
    options:
      - "Other proteins in the cell are required to fold this enzyme into its active shape."
      - "Folding requires an input of ATP, which must have been present as a contaminant."
      - "The unfolding chemical broke the peptide bonds, and the enzyme re-synthesised itself after the chemical was removed."
      - "The enzyme's tertiary structure is specified by its amino-acid sequence, because the correct fold re-formed from the primary structure alone."
    option_explanations:
      - |
        Refolding happened in buffer with no other cellular components present, so no helper protein was needed for this enzyme. The result argues against, not for, a requirement for other proteins.
      - |
        Nothing in the design supplied ATP, and the fold forms because it is the thermodynamically favoured arrangement of the chain in water, not because energy is pumped in. Invoking a contaminant is not a supported conclusion.
      - |
        A chain whose peptide bonds were cut cannot re-synthesise itself; building peptide bonds needs ribosomes, mRNA, tRNA and energy. The denaturant broke weak interactions, not covalent bonds.
      - |
        Correct. If the sequence alone carries the information for the fold, removing the denaturant should let the chain find its lowest-energy shape again, and it did. Hydrogen bonds, ionic bonds, hydrophobic clustering and disulfide bridges re-form in the arrangement the sequence dictates.
    answer: 3
    explanation: |
      This is the classic refolding experiment: primary structure determines higher structure. When a result is obtained with pure components, the conclusion is that nothing else was required.

  # ======================================================================
  # Unit 2 (7 items): q07-q13
  # ======================================================================
  # ---- Stimulus set B: potato cores in sucrose (2.7, 2.7, 2.4, 2.7)
  - slug: review-practice-q07
    type: multiple_choice
    topic_code: "2.7"
    source: "Biology 2e §5.2 Passive Transport"
    points: 1
    stimulus: |
      Students cut cylinders of potato tissue, weighed each one, and placed it in a sucrose solution for 24 hours at 22 °C. Each cylinder was blotted and reweighed. Three cylinders were used per concentration; the mean percentage change in mass is shown. (R = 0.0831 L·bar/mol·K.)

      | Sucrose concentration (mol/L) | Mean change in mass (%) |
      |---|---|
      | 0.0 | +18 |
      | 0.2 | +6 |
      | 0.4 | −5 |
      | 0.6 | −14 |
      | 0.8 | −22 |
      | 1.0 | −28 |
    prompt: |
      Based on the data, which sucrose concentration is closest to the one at which there would be no net movement of water into or out of the potato cells, and what does that concentration tell you?
    options:
      - "About 0.3 mol/L; at that concentration the water potential of the solution equals the water potential of the potato cells."
      - "0.0 mol/L; pure water is isotonic to all living cells."
      - "About 0.5 mol/L; the halfway point of the range is where the cells are in balance."
      - "1.0 mol/L; the largest loss of mass shows the cells have reached equilibrium with the solution."
    option_explanations:
      - |
        Correct. The sign of the mass change flips between 0.2 (+6%) and 0.4 (−5%); interpolating puts zero change near 0.3 mol/L. No net water movement means no water potential difference, so Ψ of the tissue equals Ψ of that solution.
      - |
        In pure water the cores gained 18% of their mass, the largest gain in the table, so water was flooding in; pure water is hypotonic to almost every living cell, not isotonic.
      - |
        The isotonic point is where the measured change crosses zero, which the data put between 0.2 and 0.4, not at the midpoint of the concentrations the students happened to test. Read the data, not the design.
      - |
        A large mass loss shows a steep water potential gradient out of the cells, not equilibrium. Equilibrium with a solution means the cell neither gains nor loses water.
    answer: 0
    explanation: |
      On a graph of percent change versus concentration, the x-intercept is the isotonic concentration. That intercept is the single most useful number from this lab because it hands you the tissue's water potential.

  - slug: review-practice-q08
    type: multiple_choice
    topic_code: "2.7"
    source: "general knowledge"
    points: 1
    stimulus: |
      Students cut cylinders of potato tissue, weighed each one, and placed it in a sucrose solution for 24 hours at 22 °C. Each cylinder was blotted and reweighed. Three cylinders were used per concentration; the mean percentage change in mass is shown. (R = 0.0831 L·bar/mol·K.)

      | Sucrose concentration (mol/L) | Mean change in mass (%) |
      |---|---|
      | 0.0 | +18 |
      | 0.2 | +6 |
      | 0.4 | −5 |
      | 0.6 | −14 |
      | 0.8 | −22 |
      | 1.0 | −28 |
    prompt: |
      Using Ψs = −iCRT and taking the isotonic sucrose concentration to be 0.3 mol/L, which value is closest to the water potential of the potato tissue? (Sucrose does not ionise; the solutions were in open beakers, so their pressure potential is zero.)
    options:
      - "+7.4 bars"
      - "−0.74 bars"
      - "−7.4 bars"
      - "−2.5 bars"
    option_explanations:
      - |
        The sign is wrong. Solute potential is always negative or zero, because dissolved particles lower water's free energy; a positive water potential for an open solution is impossible.
      - |
        This answer comes from using 22 instead of 295 for T. The equation requires temperature in kelvins: 22 °C + 273 = 295 K.
      - |
        Correct. Ψs = −(1)(0.3 mol/L)(0.0831 L·bar/mol·K)(295 K) = −7.35 bars. With Ψp = 0 in an open beaker, Ψ of the solution is −7.4 bars, and at the isotonic point the tissue's Ψ matches it.
      - |
        This value would result from a concentration of about 0.1 mol/L, not 0.3. Check that the concentration from the graph's x-intercept was carried into the formula.
    answer: 2
    explanation: |
      Kelvins, not degrees; i = 1 for sucrose; Ψp = 0 for a solution in an open container. With those three habits the formula-sheet calculation is one line.

  - slug: review-practice-q09
    type: multiple_choice
    topic_code: "2.4"
    source: "general knowledge"
    points: 1
    stimulus: |
      Students cut cylinders of potato tissue, weighed each one, and placed it in a sucrose solution for 24 hours at 22 °C. Each cylinder was blotted and reweighed. Three cylinders were used per concentration; the mean percentage change in mass is shown. (R = 0.0831 L·bar/mol·K.)

      | Sucrose concentration (mol/L) | Mean change in mass (%) |
      |---|---|
      | 0.0 | +18 |
      | 0.2 | +6 |
      | 0.4 | −5 |
      | 0.6 | −14 |
      | 0.8 | −22 |
      | 1.0 | −28 |
    prompt: |
      A student examines cells from the cylinder that was in 0.8 mol/L sucrose under the microscope. Which observation is expected, and which movement of molecules explains it?
    options:
      - "The cells are swollen and pressed hard against their walls, because sucrose entered the cells and drew water in after it."
      - "The cells look unchanged, because the rigid cell wall prevents any water movement."
      - "The cell membranes have pulled away from the cell walls, because water left the cells down its water potential gradient while sucrose, which cannot cross the membrane freely, stayed outside."
      - "The cells have burst, because 0.8 mol/L sucrose is hypotonic to potato cells."
    option_explanations:
      - |
        The cylinder lost 22% of its mass, so water left the cells, not entered. Sucrose is a large polar disaccharide and does not diffuse across the lipid bilayer, so it could not have pulled water in.
      - |
        A wall limits expansion but cannot stop water from leaving; the mass data prove water moved. The wall is freely permeable to water and solutes; only the membrane is selective.
      - |
        Correct. The solution's water potential (about −20 bars) is far below the tissue's (about −7 bars), so water moves out, the protoplast shrinks and plasmolysis occurs. Membrane permeability explains why sucrose stays put and water does not.
      - |
        Bursting would require water to rush in, which occurs only in solutions with higher water potential than the cell, and a walled cell resists bursting anyway. 0.8 mol/L sucrose is strongly hypertonic.
    answer: 2
    explanation: |
      Water crosses; sucrose does not. Selective permeability is what turns a concentration difference into a water potential gradient, and plasmolysis is the visible result in a walled cell.

  - slug: review-practice-q10
    type: multiple_choice
    topic_code: "2.7"
    source: "general knowledge"
    points: 1
    stimulus: |
      Students cut cylinders of potato tissue, weighed each one, and placed it in a sucrose solution for 24 hours at 22 °C. Each cylinder was blotted and reweighed. Three cylinders were used per concentration; the mean percentage change in mass is shown. (R = 0.0831 L·bar/mol·K.)

      | Sucrose concentration (mol/L) | Mean change in mass (%) |
      |---|---|
      | 0.0 | +18 |
      | 0.2 | +6 |
      | 0.4 | −5 |
      | 0.6 | −14 |
      | 0.8 | −22 |
      | 1.0 | −28 |
    prompt: |
      The students recorded percentage change in mass rather than the change in grams. Which statement gives the best justification for that choice?
    options:
      - "The cylinders differed in starting mass, and expressing each change as a fraction of its own starting mass lets cylinders of different size be compared on one scale."
      - "Percentages are always more accurate than measurements in grams."
      - "A percentage removes the need to weigh the cylinders before the experiment."
      - "Percentage change converts the mass data directly into water potential in bars."
    option_explanations:
      - |
        Correct. A 0.5 g gain means something different for a 2 g cylinder than for a 6 g cylinder. Normalising to initial mass makes the dependent variable independent of cylinder size so that the only remaining variable is sucrose concentration.
      - |
        A percentage is a calculation, not a measurement; it is exactly as accurate as the balance readings that go into it. Precision comes from the instrument and the replication, not from the unit.
      - |
        Percentage change requires the initial mass, since it is (final − initial) divided by initial. The students had to weigh twice to compute it.
      - |
        Water potential is obtained from the isotonic concentration via Ψs = −iCRT, not from the percentage itself. The percentage locates the intercept; it is not the potential.
    answer: 0
    explanation: |
      Normalising to a starting value is a core data-representation move: it controls for a variable (initial size) that the students could not hold constant, so differences reflect only the treatment.

  # ---- Standalone Unit 2 items (2.2, 2.8, 2.10)
  - slug: review-practice-q11
    type: multiple_choice
    topic_code: "2.2"
    source: "Biology 2e §4.2 Prokaryotic Cells"
    points: 1
    prompt: |
      Agar cubes containing a pH indicator were placed in acid, and the depth the colour change had reached was measured after 10 minutes. The 1 cm cube was coloured all the way through; the 2 cm cube was coloured to a depth of about 0.5 cm; the 4 cm cube was coloured only in a thin outer shell. Which statement correctly uses surface area-to-volume ratio to interpret the result?
    options:
      - "The acid diffused faster into the larger cubes, so they will finish changing colour sooner."
      - "The 1 cm cube has the smallest surface area, which is why it changed colour fastest."
      - "The larger cubes have more surface area, so they should have changed colour completely; the result must be an error."
      - "Each doubling of edge length halves the surface area-to-volume ratio (6, 3, 1.5 cm⁻¹), so a larger cube has less surface through which to take up acid for each unit of volume it must supply, and its centre is reached much later."
    option_explanations:
      - |
        The acid moved inward at the same speed (about 0.5 cm in 10 min) in every cube; what differed is how far the centre is from the surface. Larger cubes take longer, not shorter, to fill.
      - |
        The smallest cube has the smallest absolute surface area but the largest ratio of surface to volume, and the ratio, not the total, governs how well diffusion serves the interior.
      - |
        More total surface area is true but irrelevant; what matters is surface area relative to volume, and that ratio falls as the cube grows. The result is exactly what the ratio predicts.
      - |
        Correct. SA:V for a cube of edge s is 6s²/s³ = 6/s. Volume (demand) grows as the cube of size while surface (supply) grows as the square, which is why cells stay small or change shape to keep diffusion distances short.
    answer: 3
    explanation: |
      Diffusion speed was constant; distance was not. Compute SA:V for a cube as 6/s and the three ratios tell the whole story, and the same arithmetic explains why a flat leaf or a folded intestine works.

  - slug: review-practice-q12
    type: multiple_choice
    topic_code: "2.8"
    source: "Biology 2e §5.3 Active Transport"
    points: 1
    prompt: |
      Animal cells in culture are treated with a drug that blocks the sodium-potassium pump. Over several hours the cells swell and some burst. Which chain of events best explains the swelling?
    options:
      - "Without the pump, three K⁺ ions leak out for every two Na⁺ ions that enter, so the cell becomes negative and attracts water."
      - "Without the pump, Na⁺ that leaks into the cell is no longer pumped out, intracellular solute concentration rises, water potential inside falls and water enters by osmosis."
      - "The drug opens aquaporins, so water enters faster than it can leave."
      - "Blocking the pump stops ATP synthesis, and the cell swells because it can no longer make membranes."
    option_explanations:
      - |
        The pump normally moves three Na⁺ out and two K⁺ in; when it stops, the ions that leak are Na⁺ in and K⁺ out, but the problem is total solute, not charge. The stoichiometry and the direction are both reversed here.
      - |
        Correct. The pump's steady export of Na⁺ is what keeps the cell's solute concentration from climbing. Stop it and Na⁺ accumulates by leakage, the cytoplasm's water potential drops below the medium's, and water follows the gradient inward.
      - |
        The drug targets the pump, not aquaporins, and water channels only let water follow an existing gradient; they do not create one. The gradient was created by the solute change.
      - |
        The pump consumes ATP; it does not produce it. Cells with a blocked pump still make ATP, and the swelling is osmotic, not a failure of membrane synthesis.
    answer: 1
    explanation: |
      Active transport sets up gradients, and those gradients are also what keep osmotic balance. The question connects 2.8 to 2.7: an ion pump is, among other things, a water-regulating device.

  - slug: review-practice-q13
    type: multiple_choice
    topic_code: "2.10"
    source: "general knowledge"
    points: 1
    prompt: |
      A student lists four observations about mitochondria. Which one provides the strongest support for the hypothesis that mitochondria descend from a free-living prokaryote engulfed by an ancestral eukaryotic cell?
    options:
      - "Mitochondria are found in nearly all eukaryotic cells."
      - "Mitochondria are the site of most ATP production in the cell."
      - "Mitochondria carry their own circular DNA and ribosomes resembling those of bacteria, and they reproduce by dividing in two independently of the cell cycle."
      - "Mitochondria are about the same size as a nucleus."
    option_explanations:
      - |
        Being widespread shows mitochondria are ancient and important, but it is equally consistent with the organelle having evolved inside the cell. It does not point to an external origin.
      - |
        Function tells you what the organelle does, not where it came from. A compartment that evolved internally could just as well be the site of ATP synthesis.
      - |
        Correct. Circular chromosomes, 70S-type ribosomes and binary fission are prokaryotic traits that a descendant of an engulfed bacterium would retain. The double membrane fits too: the inner one is the bacterium's, the outer one the host's vesicle.
      - |
        Size alone is not evidence of ancestry. Many structures of similar size have unrelated origins, and the nucleus is not thought to be a captured cell.
    answer: 2
    explanation: |
      Endosymbiosis is argued from the traits an organelle would inherit from a bacterial ancestor and could not easily acquire any other way: its own genome, its own ribosomes, its own division.

  # ======================================================================
  # Unit 3 (8 items): q14-q21
  # ======================================================================
  # ---- Stimulus set C: respirometers with germinating peas (3.5, 3.5, 3.2)
  - slug: review-practice-q14
    type: multiple_choice
    topic_code: "3.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      Three respirometers were set up: germinating peas at 22 °C, germinating peas at 10 °C, and dry (non-germinating) peas plus glass beads at 22 °C. Each contained potassium hydroxide (KOH) to absorb carbon dioxide. The volume of gas consumed, read from the movement of a drop in a graduated pipette, was recorded every 5 minutes.

      | Time (min) | Germinating, 22 °C (mL) | Germinating, 10 °C (mL) | Dry peas + beads, 22 °C (mL) |
      |---|---|---|---|
      | 0 | 0.00 | 0.00 | 0.00 |
      | 5 | 0.28 | 0.12 | 0.01 |
      | 10 | 0.55 | 0.25 | 0.02 |
      | 15 | 0.84 | 0.37 | 0.02 |
      | 20 | 1.10 | 0.50 | 0.03 |
    prompt: |
      What is the rate of oxygen consumption by the germinating peas at 22 °C over the 20 minutes?
    options:
      - "1.10 mL/min"
      - "0.22 mL/min"
      - "0.025 mL/min"
      - "0.055 mL/min"
    option_explanations:
      - |
        1.10 mL is the total volume consumed at 20 minutes, not a rate. A rate is a change in the dependent variable divided by a change in time.
      - |
        This value divides by the number of readings rather than by elapsed time; the time axis is in minutes, so divide by 20.
      - |
        This is the rate for the 10 °C peas: 0.50 mL / 20 min. Check that you read the 22 °C column.
      - |
        Correct. Rate = (1.10 mL − 0.00 mL) / (20 min − 0 min) = 0.055 mL/min. Because the readings rise almost linearly, the slope between any two points gives nearly the same answer.
    answer: 3
    explanation: |
      Rate is slope. When data are nearly linear, Δy/Δx between the first and last points is the expected method, and the units (mL per minute) should appear in the answer.

  - slug: review-practice-q15
    type: multiple_choice
    topic_code: "3.5"
    source: "Biology 2e §7.4 Oxidative Phosphorylation"
    points: 1
    stimulus: |
      Three respirometers were set up: germinating peas at 22 °C, germinating peas at 10 °C, and dry (non-germinating) peas plus glass beads at 22 °C. Each contained potassium hydroxide (KOH) to absorb carbon dioxide. The volume of gas consumed, read from the movement of a drop in a graduated pipette, was recorded every 5 minutes.

      | Time (min) | Germinating, 22 °C (mL) | Germinating, 10 °C (mL) | Dry peas + beads, 22 °C (mL) |
      |---|---|---|---|
      | 0 | 0.00 | 0.00 | 0.00 |
      | 5 | 0.28 | 0.12 | 0.01 |
      | 10 | 0.55 | 0.25 | 0.02 |
      | 15 | 0.84 | 0.37 | 0.02 |
      | 20 | 1.10 | 0.50 | 0.03 |
    prompt: |
      If the KOH were omitted from the respirometers, which result would be expected for the germinating peas at 22 °C, and why?
    options:
      - "The gas volume would change very little, because the CO₂ released by respiration would roughly replace the O₂ consumed as the final electron acceptor."
      - "The gas volume would fall faster, because without KOH the oxygen would be consumed more quickly."
      - "The gas volume would rise rapidly, because KOH normally produces the oxygen the peas use."
      - "There would be no change, because respiration requires KOH as a cofactor."
    option_explanations:
      - |
        Correct. Aerobic respiration consumes O₂ at the end of the electron transport chain and releases CO₂ from pyruvate oxidation and the citric acid cycle in roughly equal volumes. The drop measures net gas change, so without a CO₂ absorber there is almost nothing to measure.
      - |
        KOH does not affect how fast the peas respire; it only removes CO₂ from the gas phase. Without it the O₂ consumption continues unchanged but becomes invisible to the pipette.
      - |
        KOH produces no oxygen; it absorbs carbon dioxide (forming potassium carbonate). The peas get their O₂ from the air sealed in the respirometer.
      - |
        KOH is not a biological cofactor; it is a laboratory reagent outside the cells. Respiration proceeds normally with or without it, which is exactly why a CO₂ absorber is needed to see the O₂ loss.
    answer: 0
    explanation: |
      Every respirometer question comes back to one idea: the device reads net gas volume, so the CO₂ produced must be removed before the O₂ consumed can be seen.

  - slug: review-practice-q16
    type: multiple_choice
    topic_code: "3.2"
    source: "Biology 2e §6.5 Enzymes"
    points: 1
    stimulus: |
      Three respirometers were set up: germinating peas at 22 °C, germinating peas at 10 °C, and dry (non-germinating) peas plus glass beads at 22 °C. Each contained potassium hydroxide (KOH) to absorb carbon dioxide. The volume of gas consumed, read from the movement of a drop in a graduated pipette, was recorded every 5 minutes.

      | Time (min) | Germinating, 22 °C (mL) | Germinating, 10 °C (mL) | Dry peas + beads, 22 °C (mL) |
      |---|---|---|---|
      | 0 | 0.00 | 0.00 | 0.00 |
      | 5 | 0.28 | 0.12 | 0.01 |
      | 10 | 0.55 | 0.25 | 0.02 |
      | 15 | 0.84 | 0.37 | 0.02 |
      | 20 | 1.10 | 0.50 | 0.03 |
    prompt: |
      The germinating peas consumed oxygen about twice as fast at 22 °C as at 10 °C. Which explanation is best supported, and what does the dry-pea respirometer contribute to the conclusion?
    options:
      - "Warmer peas contain more mitochondria; the dry peas show that beads do not respire."
      - "The gas in the warmer respirometer expanded, which pushed the drop farther; the dry peas confirm this expansion."
      - "At the higher temperature, molecules move faster, so the enzyme-catalysed reactions of respiration run at a higher rate; the dry peas with beads show that the small volume change at 22 °C without active metabolism is negligible, so the difference is biological, not physical."
      - "Warm peas were larger, so they held more oxygen; the dry peas were a smaller volume."
    option_explanations:
      - |
        Twelve hours is not long enough for peas to build a different number of mitochondria, and the respirometers held the same peas at two temperatures. The temperature effect is on reaction rate, not on organelle number.
      - |
        Gas expansion from warming would move the drop outward, registering as an increase, and would happen at the start, not steadily for 20 minutes. The dry-pea control at the same 22 °C shows almost no movement, which rules out a physical artefact.
      - |
        Correct. Within the physiological range, a temperature rise increases the frequency and energy of collisions between enzymes and substrates, so the whole pathway speeds up. The dry-pea control (0.03 mL) shows that any physical change in gas volume at 22 °C is tiny compared with the 1.10 mL from living, germinating tissue.
      - |
        The beads were added precisely to equalise the volume of each respirometer, so size is controlled. Volume of tissue cannot explain a difference between the same germinating peas at two temperatures.
    answer: 2
    explanation: |
      Two science practices in one item: identify the mechanism (enzyme kinetics with temperature) and say what the control is for (to show that the measured change needs living, metabolising tissue and is not an artefact of the apparatus).

  # ---- Standalone Unit 3 items (3.1, 3.2, 3.3, 3.4, 3.5)
  - slug: review-practice-q17
    type: multiple_choice
    topic_code: "3.1"
    source: "Biology 2e §6.5 Enzymes"
    points: 1
    prompt: |
      An enzyme's reaction rate was measured across substrate concentrations with and without inhibitor Q. Without Q, the rate reached a maximum of 100 units at high substrate and half-maximal rate at 2 mmol/L substrate. With Q, the rate still reached 100 units at very high substrate, but half-maximal rate required 8 mmol/L substrate. How does Q act?
    options:
      - "Q binds the active site reversibly, competing with substrate; adding more substrate outcompetes it, which is why the maximum rate is unchanged."
      - "Q binds an allosteric site and changes the active site's shape; the maximum rate is lowered."
      - "Q denatures the enzyme; the unchanged maximum shows denaturation is reversible."
      - "Q is a cofactor that the enzyme requires; without enough Q the enzyme works slowly."
    option_explanations:
      - |
        Correct. The signature of a competitive inhibitor is that the maximum rate can still be reached because at saturating substrate the inhibitor rarely finds an empty active site, but more substrate is needed to get there, so the half-maximal concentration rises (2 to 8 mmol/L).
      - |
        A noncompetitive (allosteric) inhibitor lowers the maximum rate, because no amount of substrate can displace it from its separate site. Here the maximum was unchanged, which rules this mechanism out.
      - |
        A denaturing agent would reduce the number of working enzyme molecules and so lower the maximum rate at every substrate concentration. The data show full recovery with substrate, not loss of enzyme.
      - |
        Q was added, and adding it slowed the reaction; a cofactor would do the opposite. The data describe an inhibitor, not a required partner.
    answer: 0
    explanation: |
      Read two numbers from any enzyme-inhibitor data set: does the maximum rate change (noncompetitive if yes) and does the substrate needed for half-maximal rate change (competitive if yes). Here only the second changed.

  - slug: review-practice-q18
    type: multiple_choice
    topic_code: "3.2"
    source: "general knowledge"
    points: 1
    prompt: |
      An enzyme purified from a fish that lives in polar water at −1 °C has its highest activity at 5 °C and is inactivated by 25 °C. The same enzyme from a human has its highest activity at 37 °C and is almost inactive at 5 °C. Which explanation best accounts for the two optima?
    options:
      - "The fish enzyme has a different active site and catalyses a different reaction."
      - "The human enzyme is denatured at 5 °C, which is why it is inactive at low temperature."
      - "The fish enzyme is not a protein, so temperature does not affect it in the same way."
      - "The fish enzyme's structure is held by fewer or weaker interactions, so it is flexible enough to work in the cold but unfolds at temperatures the human enzyme tolerates."
    option_explanations:
      - |
        They are the same enzyme catalysing the same reaction; the difference is in the stability of the fold, not the chemistry of the active site. Evolution tuned the structure, not the function.
      - |
        Low temperature does not denature proteins; it slows molecular motion so collisions are rarer and the fold is too stiff to work. Denaturation is unfolding, which heat causes and cold generally does not.
      - |
        Enzymes from fish are proteins like any other. The question is why two versions of a protein have different temperature responses, which is a question about their amino-acid sequences and folds.
      - |
        Correct. Catalysis needs the protein to flex. In cold water, a fold with many stabilising bonds would be too rigid; natural selection favoured variants with fewer stabilising interactions, and the price is that modest heat is enough to unfold them.
    answer: 3
    explanation: |
      Temperature optima are evolved properties of a protein's fold. Flexibility and stability trade off, and each organism's enzymes are tuned to its own thermal environment.

  - slug: review-practice-q19
    type: multiple_choice
    topic_code: "3.3"
    source: "general knowledge"
    points: 1
    prompt: |
      Joining glutamate and ammonia to make glutamine has a free-energy change of about +14 kJ/mol, yet cells make glutamine constantly. The enzyme responsible first transfers a phosphate from ATP to glutamate, then replaces the phosphate with ammonia. Which statement best explains why the overall process proceeds?
    options:
      - "The enzyme lowers the activation energy so much that the reaction becomes spontaneous."
      - "The hydrolysis of ATP (about −30 kJ/mol) is coupled to the unfavourable step through a phosphorylated intermediate, so the combined reaction has a negative free-energy change."
      - "Ammonia is a high-energy molecule that supplies the missing energy."
      - "The cell keeps glutamine concentration so high that the reaction is pushed forward."
    option_explanations:
      - |
        Lowering activation energy changes how fast a reaction reaches equilibrium, not where the equilibrium lies. An enzyme cannot make an endergonic reaction exergonic on its own.
      - |
        Correct. Energy coupling: the phosphorylated glutamate is a less stable intermediate, so the second step is downhill. Adding +14 to −30 gives about −16 kJ/mol for the whole sequence, which is spontaneous. This is how ATP drives most biosynthesis.
      - |
        Ammonia is a small reactant, not an energy carrier; nothing about it changes the free energy of forming the amide bond. The energy comes from ATP.
      - |
        A high product concentration would push the reaction backward, not forward. Cells keep product low and use ATP, not concentration tricks, to drive synthesis.
    answer: 1
    explanation: |
      ATP does not power reactions by being hot or by lowering barriers; it does so by changing the reaction pathway so that an exergonic hydrolysis is part of the same sequence as the endergonic step.

  - slug: review-practice-q20
    type: multiple_choice
    topic_code: "3.4"
    source: "Biology 2e §8.2 The Light-Dependent Reactions of Photosynthesis"
    points: 1
    prompt: |
      Leaf disks were infiltrated with sodium bicarbonate solution so they sank, then placed under lamps covered with coloured filters. The time for half the disks to float (ET50) was: white light, 6 minutes; blue light, 8 minutes; red light, 9 minutes; green light, 25 minutes. Which conclusion is best supported, and why do the disks float?
    options:
      - "Green light drives photosynthesis slowest because chlorophyll reflects rather than absorbs green wavelengths; the disks float because O₂ released by the light reactions accumulates in the air spaces."
      - "Green light drives photosynthesis fastest; the disks float because they absorb water."
      - "The colours have no effect; the disks float because warm light makes the solution less dense."
      - "Red light is the only wavelength chlorophyll absorbs; the disks float because CO₂ is released."
    option_explanations:
      - |
        Correct. Chlorophyll absorbs blue and red strongly and green poorly, so green light splits little water at photosystem II and yields little O₂. The bicarbonate supplies CO₂ so that the Calvin cycle can keep using the ATP and NADPH; O₂ bubbles then make the disks buoyant.
      - |
        A longer ET50 means a slower rate; green light took four times as long as white. And the disks start full of solution; they rise when gas, not water, fills them.
      - |
        The ET50 values differ fourfold between colours at the same lamp distance, so colour clearly matters. Temperature was the same for every filter and cannot produce a colour-specific result.
      - |
        Blue light worked almost as well as red, so chlorophyll absorbs more than one band. CO₂ is consumed in photosynthesis, not released; the gas that lifts the disks is O₂.
    answer: 0
    explanation: |
      Floating-disk assays measure O₂ from the light reactions, and ET50 is an inverse rate: a short time is a fast rate. The green-light result is the absorption spectrum of chlorophyll made visible.

  - slug: review-practice-q21
    type: multiple_choice
    topic_code: "3.5"
    source: "Biology 2e §7.4 Oxidative Phosphorylation"
    points: 1
    prompt: |
      Isolated mitochondria were given substrate and their O₂ consumption, ATP production and heat output were measured before and after adding a chemical that lets H⁺ pass freely through the inner membrane. After the addition, O₂ consumption increased, ATP production fell almost to zero, and heat output rose. Which explanation fits all three observations?
    options:
      - "The chemical blocked the electron transport chain, so electrons were diverted to oxygen."
      - "The chemical caused the mitochondria to switch to fermentation, which uses more oxygen."
      - "The chemical inhibited ATP synthase directly, which stopped the electron transport chain."
      - "The chemical dissipated the proton gradient, so ATP synthase had no gradient to use, while the electron transport chain kept running (even faster, with no back-pressure) and its energy was released as heat."
    option_explanations:
      - |
        A blocked chain would consume less oxygen, not more, because oxygen is only reduced when electrons reach the end of the chain. The data show the chain running faster.
      - |
        Fermentation occurs in the cytoplasm, not in isolated mitochondria, and it does not consume oxygen at all. The increased O₂ use shows aerobic electron transport, not fermentation.
      - |
        Inhibiting ATP synthase would cause the gradient to build up until it stalled the pumps, so O₂ consumption would fall. The rise in O₂ use is the opposite of what synthase inhibition produces.
      - |
        Correct. Chemiosmosis couples electron transport to ATP synthesis only through the H⁺ gradient. An uncoupler short-circuits the gradient: the chain pumps protons that immediately leak back, so oxygen is reduced rapidly and the energy, with no ATP to store it, appears as heat.
    answer: 3
    explanation: |
      The proton gradient is the only link between electron flow and ATP synthesis. Remove it and the two processes come apart: electron transport continues, ATP stops, and the energy becomes heat, which is how some animals generate warmth.

  # ======================================================================
  # Unit 4 (7 items): q22-q28
  # ======================================================================
  - slug: review-practice-q22
    type: multiple_choice
    topic_code: "4.1"
    source: "general knowledge"
    points: 1
    prompt: |
      A marine bacterium glows only when its culture reaches a high cell density. A mutant strain never glows on its own, but it glows when it is grown in liquid taken from a dense culture of normal cells after the cells have been filtered out. Which conclusion is best supported?
    options:
      - "Normal cells secrete a small signalling molecule that accumulates with density; the mutant cannot make the signal but can still detect it and respond."
      - "Normal cells pass the glowing trait to the mutant by direct contact."
      - "The mutant lacks the receptor for the signal, which is why it needs the liquid from normal cells."
      - "Glowing is triggered by nutrient depletion in old cultures, not by any signal."
    option_explanations:
      - |
        Correct. This is quorum sensing: each cell releases an autoinducer, the concentration tracks population density, and above a threshold the signal switches on the light genes. The mutant is defective in producing the signal but not in detecting it.
      - |
        The normal cells were filtered out before the mutant was added, so no cell-to-cell contact was possible. Whatever triggered glowing was dissolved in the liquid.
      - |
        A receptor-less mutant could not respond to the signal no matter how much was supplied; the fact that the liquid restored glowing shows the mutant's detection machinery is intact. The defect is in signal production.
      - |
        Fresh medium plus the filtered liquid, with normal nutrients, triggered glowing; and the mutant alone, however old its culture became, never glowed. Something in the liquid, not the absence of something, was responsible.
    answer: 0
    explanation: |
      Separate the two halves of any signalling system: making the signal and reading it. A mutant that is rescued by someone else's secretions is missing the first half and keeps the second.

  - slug: review-practice-q23
    type: multiple_choice
    topic_code: "4.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Hormone X is a steroid; hormone Y is a short peptide. A researcher adds each hormone to its target cells with and without a treatment that prevents any molecule from crossing the plasma membrane. X's effect disappears under the treatment; Y's effect is unchanged. Which explanation fits?
    options:
      - "X binds a receptor on the cell surface and Y binds a receptor inside the cell."
      - "Both hormones must enter the cell, but Y enters through a channel the treatment does not affect."
      - "X, being hydrophobic, normally diffuses through the lipid bilayer to an intracellular receptor, so blocking entry stops it; Y, being polar, binds a receptor on the cell surface and never needs to enter."
      - "The treatment destroyed X but not Y."
    option_explanations:
      - |
        This reverses the usual rule and contradicts the data: the hormone that lost its effect when entry was blocked (X) is the one that needs to get in, so it is the one with the intracellular receptor.
      - |
        Peptide hormones act without entering; there is no channel that admits them, and their receptors are on the outside precisely because they cannot cross the lipid interior. The treatment result for Y is explained by its surface receptor.
      - |
        Correct. Steroids are lipids and pass the bilayer to bind receptors in the cytoplasm or nucleus that then act as transcription factors. Peptides cannot cross the bilayer; their receptors face outward and relay the signal across the membrane, so blocking entry leaves them unaffected.
      - |
        The treatment was applied to the cells, not to the hormones, and a destroyed hormone would be an uncontrolled artefact rather than an explanation. The design asks you to reason from the receptor location.
    answer: 2
    explanation: |
      Receptor location follows the chemistry of the ligand: hydrophobic signals go inside, hydrophilic signals stop at the surface. An experiment that blocks entry is the classic way to tell them apart.

  - slug: review-practice-q24
    type: multiple_choice
    topic_code: "4.3"
    source: "Biology 2e §9.2 Propagation of the Signal"
    points: 1
    prompt: |
      In liver cells, binding of a single molecule of epinephrine to its receptor leads to the release of roughly 10⁸ glucose molecules from glycogen. Which feature of the pathway accounts for this amplification?
    options:
      - "The receptor is a channel that lets 10⁸ glucose molecules pass through once it opens."
      - "Each activated enzyme in the cascade (adenylyl cyclase, protein kinase A, phosphorylase kinase, glycogen phosphorylase) acts on many substrate molecules before it is inactivated, so the number of activated molecules multiplies at every step."
      - "Epinephrine is converted into cAMP inside the cell, and each cAMP releases one glucose."
      - "The hormone binds 10⁸ receptors at once, one for each glucose molecule released."
    option_explanations:
      - |
        The epinephrine receptor is a G protein-coupled receptor, not a channel, and glucose leaves the cell through transporters after being released from glycogen; no channel could make glucose from glycogen in any case.
      - |
        Correct. Amplification is the product of the turnover numbers of a chain of enzymes. One receptor activates many G proteins; one adenylyl cyclase makes many cAMP; one kinase phosphorylates many targets. Four or five such steps multiply to 10⁸.
      - |
        cAMP is made from ATP by adenylyl cyclase, not from epinephrine, and cAMP activates a kinase rather than releasing glucose itself. The hormone never enters the cell.
      - |
        The question states one epinephrine molecule and one receptor. Even with many receptors, a one-to-one count would give no amplification at all; the gain comes from catalysis downstream.
    answer: 1
    explanation: |
      Signal amplification is just enzyme catalysis arranged in series. Any step that is an enzyme, not a stoichiometric partner, multiplies the signal, and the second messenger is one such step.

  - slug: review-practice-q25
    type: multiple_choice
    topic_code: "4.3"
    source: "Biology 2e §9.2 Propagation of the Signal"
    points: 1
    prompt: |
      Cells are briefly exposed to a growth factor and the activity of a kinase late in the pathway is measured over time. Normally the kinase activity rises, peaks at 10 minutes, and returns to baseline by 40 minutes. In cells treated with a drug that inhibits protein phosphatases, the activity rises to the same peak but stays high for over three hours. Which conclusion is best supported?
    options:
      - "The drug increased the amount of growth factor, prolonging the signal."
      - "Phosphatases are needed to activate the kinase, which is why the peak was reached."
      - "The drug converted the kinase into a phosphatase."
      - "Phosphatases normally remove the phosphate groups that kinases add, and that removal is what switches the pathway off; without it the activated state persists."
    option_explanations:
      - |
        The exposure to growth factor was brief and identical in both treatments; the drug acted inside the cells. A prolonged response with the same stimulus points to a failure of the off-switch.
      - |
        The peak was reached at the same height with phosphatases blocked, so phosphatases are not required for activation. Their role shows up in the decline, which disappeared.
      - |
        Enzymes do not change identity under a drug; the kinase still phosphorylates, which is why activity stayed high. The drug removed the opposing activity.
      - |
        Correct. Phosphorylation cascades are reversible: kinases turn components on by adding phosphate and phosphatases turn them off by removing it. Blocking phosphatases does not change how high the signal rises, only how long it lasts, exactly as observed.
    answer: 3
    explanation: |
      Signal termination is as regulated as signal initiation. Reading a time course for peak height and for duration separately tells you which part of the system a treatment affected.

  - slug: review-practice-q26
    type: multiple_choice
    topic_code: "4.4"
    source: "general knowledge"
    points: 1
    prompt: |
      When a blood clot begins to form, activated platelets release chemicals that recruit and activate more platelets, which release more of the same chemicals, until a plug seals the wound. By contrast, when blood glucose rises after a meal, insulin is released and drives glucose into cells until the glucose level, and then the insulin level, fall. Which statement correctly classifies the two mechanisms?
    options:
      - "Both are negative feedback, because both end when the problem is resolved."
      - "Clotting is negative feedback because it stops bleeding; glucose regulation is positive feedback because insulin increases glucose uptake."
      - "Clotting is positive feedback, in which the response amplifies the stimulus until an endpoint is reached; glucose regulation is negative feedback, in which the response reduces the stimulus and returns the variable to its set point."
      - "Neither is feedback, because both involve hormones rather than nerves."
    option_explanations:
      - |
        The test for feedback type is the direction of the response relative to the stimulus, not whether the process eventually stops. Platelet activation increases platelet activation, which is amplification, not correction.
      - |
        Stopping bleeding is the outcome, but the loop itself amplifies: more platelets cause more platelets. Insulin reducing the very stimulus (glucose) that released it is the definition of negative feedback.
      - |
        Correct. Positive feedback moves a system away from its starting state toward a discrete endpoint (a finished clot, a born baby). Negative feedback counteracts a change, which is how set points such as blood glucose are held.
      - |
        Feedback describes the logic of a control loop, not its wiring; hormonal and neural loops can be either type. Both examples are feedback.
    answer: 2
    explanation: |
      Ask whether the response increases or decreases the original stimulus. That single question classifies every feedback loop on the exam, whatever the molecules involved.

  - slug: review-practice-q27
    type: multiple_choice
    topic_code: "4.5"
    source: "general knowledge"
    points: 1
    prompt: |
      A flow cytometer sorts cultured cells by DNA content. In an untreated culture, 60% of cells have the normal diploid (2n) amount, 25% have an intermediate amount, and 15% have twice the diploid (4n) amount. After 24 hours with drug D, 92% of cells have the 2n amount and only 2% have 4n. Where in the cell cycle does drug D act?
    options:
      - "It blocks the transition from G1 into S phase, so cells accumulate before DNA replication with the diploid amount of DNA."
      - "It blocks cytokinesis, so cells accumulate with two nuclei."
      - "It blocks the metaphase-to-anaphase transition, so cells accumulate with duplicated chromosomes."
      - "It speeds up S phase, so cells spend less time replicating."
    option_explanations:
      - |
        Correct. Cells in G1 have the 2n DNA content; cells in S are intermediate; cells in G2 and M are 4n. A pile-up at 2n with S and G2/M nearly empty means cells reached the G1 checkpoint and could not pass it to start replication.
      - |
        A cell that completes mitosis but not cytokinesis keeps both sets of chromosomes, so it would register as 4n or more, swelling the 4n fraction rather than shrinking it to 2%.
      - |
        A metaphase block would trap cells with fully replicated DNA, so the 4n fraction would grow, the opposite of what was measured.
      - |
        Shortening S phase would reduce the intermediate fraction but would not empty G2/M; cells would still reach 4n. The near-disappearance of 4n means cells never replicated at all.
    answer: 0
    explanation: |
      DNA content is a clock: 2n means G1, between 2n and 4n means S, 4n means G2 or M. Wherever cells pile up is the phase just before the blocked step.

  - slug: review-practice-q28
    type: multiple_choice
    topic_code: "4.6"
    source: "Biology 2e §10.3 Control of the Cell Cycle"
    points: 1
    prompt: |
      Two cell lines are exposed to the same dose of ultraviolet light, which damages DNA. In line 1, cell division pauses for several hours and then resumes, and most daughter cells are normal. In line 2, division continues without pause and many daughter cells carry chromosome abnormalities. Line 2 is most likely defective in which component, and why?
    options:
      - "A cyclin, because cyclins are required for the cell to pause."
      - "Growth-factor receptors, because without them cells cannot stop dividing."
      - "DNA polymerase, because the damage would otherwise be copied."
      - "The p53 protein, which normally halts the cycle at the G1 checkpoint when DNA damage is detected so that repair can occur, or triggers apoptosis if it cannot."
    option_explanations:
      - |
        Cyclins are positive regulators: they drive the cycle forward when paired with their kinases. A cyclin defect would make cells stop or slow, not race through with damaged DNA.
      - |
        Growth-factor receptors promote division when a signal is present; losing them makes cells less likely to divide. Line 2's fault is a missing brake, not a missing accelerator.
      - |
        Both lines copied their DNA, and line 2 copied it faster than it should. The problem is not the copying enzyme but the absence of a signal to wait before copying.
      - |
        Correct. p53 is the negative regulator that responds to damage. With it, line 1 paused, repaired and divided normally; without it, line 2 replicated damaged DNA and segregated broken chromosomes. Loss of p53 is among the most common steps toward cancer.
    answer: 3
    explanation: |
      Checkpoint logic: positive regulators (cyclin-Cdk) push, negative regulators (p53, Rb) hold. A cell that ignores damage has lost a holder, and that is the start of the cancer story the free-response section may ask you to tell.

  # ======================================================================
  # Unit 5 (6 items): q29-q34
  # ======================================================================
  # ---- Stimulus set E: chi-square on a dihybrid cross (5.3, 5.3, 5.3)
  - slug: review-practice-q29
    type: multiple_choice
    topic_code: "5.3"
    source: "Biology 2e §12.3 Laws of Inheritance"
    points: 1
    stimulus: |
      In tomatoes, tall (T) is dominant to dwarf (t) and round fruit (R) is dominant to pear-shaped fruit (r). Plants heterozygous for both genes were crossed with each other and 160 offspring were scored.

      | Phenotype | Observed |
      |---|---|
      | Tall, round | 95 |
      | Tall, pear | 25 |
      | Dwarf, round | 30 |
      | Dwarf, pear | 10 |

      Critical values of chi-square at p = 0.05: df 1 = 3.84; df 2 = 5.99; df 3 = 7.82; df 4 = 9.49.
    prompt: |
      If the two genes assort independently, how many tall, pear-shaped offspring are expected among the 160?
    options:
      - "90"
      - "30"
      - "40"
      - "25"
    option_explanations:
      - |
        90 is the expected count for the double-dominant class, tall and round (9/16 of 160). Tall and pear is a single-dominant class, 3/16.
      - |
        Correct. A dihybrid cross between heterozygotes gives a 9:3:3:1 ratio under independent assortment, so each 3/16 class is expected at 3/16 × 160 = 30 plants.
      - |
        40 would be one quarter of 160, which is the expected fraction for a dominant-recessive class in a monohybrid cross, not in a two-gene cross with a 9:3:3:1 ratio.
      - |
        25 is the observed number, not the expected one. The chi-square test compares what was seen with what the hypothesis predicts; the prediction is derived from the ratio, not read from the data.
    answer: 1
    explanation: |
      Expected values come from the null hypothesis, never from the observations. For a dihybrid heterozygote cross, multiply each class fraction (9, 3, 3, 1 over 16) by the total.

  - slug: review-practice-q30
    type: multiple_choice
    topic_code: "5.3"
    source: "general knowledge"
    points: 1
    stimulus: |
      In tomatoes, tall (T) is dominant to dwarf (t) and round fruit (R) is dominant to pear-shaped fruit (r). Plants heterozygous for both genes were crossed with each other and 160 offspring were scored.

      | Phenotype | Observed |
      |---|---|
      | Tall, round | 95 |
      | Tall, pear | 25 |
      | Dwarf, round | 30 |
      | Dwarf, pear | 10 |

      Critical values of chi-square at p = 0.05: df 1 = 3.84; df 2 = 5.99; df 3 = 7.82; df 4 = 9.49.
    prompt: |
      Which pair gives the chi-square value for these data against a 9:3:3:1 expectation and the correct number of degrees of freedom?
    options:
      - "χ² ≈ 1.1, df = 3"
      - "χ² ≈ 1.1, df = 4"
      - "χ² ≈ 11.1, df = 3"
      - "χ² ≈ 0.28, df = 1"
    option_explanations:
      - |
        Correct. Expected: 90, 30, 30, 10. χ² = (95−90)²/90 + (25−30)²/30 + (30−30)²/30 + (10−10)²/10 = 0.28 + 0.83 + 0 + 0 = 1.11. Degrees of freedom = number of classes − 1 = 3.
      - |
        The chi-square arithmetic is right but the degrees of freedom are one too many: with four phenotypic classes, df = 4 − 1 = 3. Using df = 4 would compare against the wrong critical value.
      - |
        A value near 11 would come from forgetting to divide each squared difference by its expected count (25 + 25 = 50) and then misplacing a decimal, or from dividing by the observed values. Each term is (O − E)² / E.
      - |
        0.28 is only the first term, for the tall-round class. The statistic is the sum over all four classes, and df counts classes, not genes.
    answer: 0
    explanation: |
      Write the table of O, E, (O − E)² / E and sum the last column; then df = classes − 1. Carrying the formula-sheet procedure through in full is worth more than remembering any one number.

  - slug: review-practice-q31
    type: multiple_choice
    topic_code: "5.3"
    source: "general knowledge"
    points: 1
    stimulus: |
      In tomatoes, tall (T) is dominant to dwarf (t) and round fruit (R) is dominant to pear-shaped fruit (r). Plants heterozygous for both genes were crossed with each other and 160 offspring were scored.

      | Phenotype | Observed |
      |---|---|
      | Tall, round | 95 |
      | Tall, pear | 25 |
      | Dwarf, round | 30 |
      | Dwarf, pear | 10 |

      Critical values of chi-square at p = 0.05: df 1 = 3.84; df 2 = 5.99; df 3 = 7.82; df 4 = 9.49.
    prompt: |
      Which conclusion about the two genes is justified by the chi-square test?
    options:
      - "The null hypothesis is rejected; the genes are linked on the same chromosome."
      - "The null hypothesis is rejected; the small classes show that pear shape is lethal."
      - "The null hypothesis is not rejected; the data are consistent with the two genes assorting independently, as expected if they lie on different chromosomes or far apart on one chromosome."
      - "The test is inconclusive because fewer than 1,000 offspring were scored."
    option_explanations:
      - |
        The calculated χ² (about 1.1) is far below the critical value of 7.82 for df = 3, so the deviation from 9:3:3:1 is the kind that chance produces more than 5% of the time. Linkage would produce an excess of the two parental combinations and a large χ².
      - |
        The 10 dwarf-pear plants match the 1/16 expectation exactly. A lethal allele would make its class smaller than expected and would push the statistic up, not leave it near 1.
      - |
        Correct. Failing to reject the null hypothesis does not prove it, but it does mean the observed deviation is within chance variation. Independent assortment, the hypothesis behind 9:3:3:1, stands.
      - |
        Chi-square has no minimum sample of 1,000; the usual rule is that expected counts should be at least 5, and the smallest here is 10. The test is valid.
    answer: 2
    explanation: |
      Compare the statistic with the critical value and say what that means in biology. Below the critical value: the deviation is chance, keep the null hypothesis. Above it: something, perhaps linkage, is producing a non-random pattern.

  # ---- Standalone Unit 5 items (5.1, 5.4, 5.5)
  - slug: review-practice-q32
    type: multiple_choice
    topic_code: "5.1"
    source: "Biology 2e §11.1 The Process of Meiosis"
    points: 1
    prompt: |
      A gamete is found to contain two copies of chromosome 7 instead of one. Using a marker close to the centromere, where crossing over is rare, a geneticist finds that the two copies carry different alleles at that marker, one from each of the individual's parents. In which division did the error most likely occur, and why?
    options:
      - "Meiosis II, because sister chromatids failed to separate."
      - "Mitosis of the gamete, because the chromosome was copied twice."
      - "Meiosis I, because the two homologous chromosomes, which carry different parental alleles, failed to separate."
      - "Either division; the alleles do not distinguish between them."
    option_explanations:
      - |
        If sister chromatids failed to separate in meiosis II, the two copies would be identical near the centromere, since sisters are copies of one chromosome. Two different parental alleles rule this out.
      - |
        Gametes are the product of meiosis and do not undergo mitosis. A chromosome copied twice would also produce identical, not different, alleles.
      - |
        Correct. Homologous chromosomes, one maternal and one paternal, pair and separate in meiosis I. A gamete carrying both homologs must have come from a failure at that separation. The marker near the centromere makes crossing over an unlikely alternative explanation.
      - |
        The alleles do distinguish: homologs differ, sisters do not (apart from crossing over, excluded here by the centromere-proximal marker). This is the standard way to assign a nondisjunction to meiosis I or II.
    answer: 2
    explanation: |
      Meiosis I separates homologs; meiosis II separates sisters. The genotype of the extra chromosome tells you which pair failed to part, which is the logic of the whole reduction division in one question.

  - slug: review-practice-q33
    type: multiple_choice
    topic_code: "5.4"
    source: "general knowledge"
    points: 1
    prompt: |
      A rare trait appears in a family as follows: an unaffected mother and unaffected father have three sons, two of whom are affected, and two daughters, both unaffected. The mother's brother is affected; her parents were not. No affected individual in the family has an affected father. Which mode of inheritance best fits, and what is the mother's genotype?
    options:
      - "Autosomal dominant; the mother is heterozygous."
      - "Mitochondrial; the mother passed the trait to all her children."
      - "Autosomal recessive; both parents are heterozygous and the sons were affected by chance."
      - "X-linked recessive; the mother is a heterozygous carrier."
    option_explanations:
      - |
        A dominant trait cannot appear in children of two unaffected parents, because at least one parent would carry, and show, the allele. Two unaffected parents with affected sons excludes dominance.
      - |
        Mitochondrial traits pass from a mother to all her children, daughters included, and the mother herself would typically be affected. Here two daughters and one son are unaffected, which rules this out.
      - |
        Autosomal recessive is possible in principle but fits worse: it predicts affected daughters as often as sons, and it does not explain why the trait tracks the maternal lineage while skipping the mother herself. The sex bias and family pattern favour X-linkage.
      - |
        Correct. Affected males, unaffected parents, transmission through the mother's side (her brother is affected, her parents are not) and no father-to-son pattern are the signature of X-linked recessive inheritance. The mother carries one recessive X; each son has a 1/2 chance of receiving it.
    answer: 3
    explanation: |
      Read a pedigree for three things: do unaffected parents have affected children (recessive), are affected individuals mostly male (X-linked), and does the trait ever pass father to son (not X-linked if so).

  - slug: review-practice-q34
    type: multiple_choice
    topic_code: "5.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Seedlings from a single genetically uniform (clonal) line of a plant were grown at three temperatures. Leaf width averaged 4.1 cm at 15 °C, 6.3 cm at 22 °C and 7.8 cm at 29 °C, with little overlap between groups. Which statement is best supported?
    options:
      - "Leaf width is controlled by a single gene with three alleles."
      - "Temperature caused mutations that changed leaf width."
      - "Leaf width is a phenotype shaped by the environment as well as the genotype, since genetically identical plants produced different phenotypes under different conditions."
      - "The plants were not genetically identical after all, because identical genotypes always produce identical phenotypes."
    option_explanations:
      - |
        The plants share one genotype, so allele differences cannot explain the variation. A single-gene, three-allele model would require three genotypes, which the clonal line does not have.
      - |
        Mutations are rare, random and would not produce a smooth, directional and reproducible response across every plant at each temperature. Environmental effects on gene expression and growth are the parsimonious explanation.
      - |
        Correct. Phenotype = genotype + environment. The same genotype expressed at different temperatures yields different leaf sizes, which is phenotypic plasticity; the same principle underlies temperature-dependent coat colour and nutrition-dependent height.
      - |
        The premise is false: identical genotypes routinely produce different phenotypes under different conditions, which is why identical twins are not identical in every trait. Clonal lines are the standard tool for showing exactly this.
    answer: 2
    explanation: |
      Holding genotype constant and varying the environment is the cleanest demonstration that phenotype is not written in the genes alone. Expect to see this design with clones, twins or inbred lines.

  # ======================================================================
  # Unit 6 (8 items): q35-q42
  # ======================================================================
  - slug: review-practice-q35
    type: multiple_choice
    topic_code: "6.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Nucleic acid was extracted from two viruses and its base composition measured. Virus 1: adenine 31%, thymine 31%, guanine 19%, cytosine 19%. Virus 2: adenine 20%, uracil 32%, guanine 26%, cytosine 22%. Which description of the two genomes is best supported?
    options:
      - "Virus 1 has double-stranded DNA, because A equals T and G equals C as base pairing requires; virus 2 has single-stranded RNA, because it contains uracil and its bases do not pair off in equal amounts."
      - "Both are double-stranded DNA; virus 2 simply has more mutations."
      - "Virus 1 has single-stranded DNA and virus 2 has double-stranded RNA."
      - "Both are RNA, because viruses do not use DNA."
    option_explanations:
      - |
        Correct. In a double helix every A pairs with a T and every G with a C, so the complementary strand forces A = T and G = C. Virus 2's unequal A and U, and G and C, mean no complementary partner strand exists: it is single-stranded.
      - |
        Virus 2 contains uracil, which is found in RNA and not DNA; no pattern of mutation converts thymine into uracil across a whole genome. The two genomes are chemically different.
      - |
        A single-stranded genome has no reason for A to equal T; the perfect equality in virus 1 is the fingerprint of base pairing. And double-stranded RNA would show A = U and G = C, which virus 2 does not.
      - |
        Many viruses carry DNA genomes, and virus 1's composition includes thymine, which is a DNA base. The question is answered from the chemistry, not from a rule about viruses.
    answer: 0
    explanation: |
      Chargaff's rule is a consequence of complementary base pairing, so it can be run backwards: equal A and T, equal G and C, means double-stranded. Uracil means RNA.

  - slug: review-practice-q36
    type: multiple_choice
    topic_code: "6.2"
    source: "Biology 2e §14.4 DNA Replication in Prokaryotes"
    points: 1
    prompt: |
      Bacteria were grown for many generations in a medium containing only heavy nitrogen (¹⁵N) so that all their DNA was heavy, then transferred to a medium with only light nitrogen (¹⁴N). DNA was extracted after exactly two rounds of replication and separated by density. Which result is expected, and why?
    options:
      - "All DNA at a single intermediate density, because the strands are mixed at random during replication."
      - "One quarter heavy and three quarters light, because the original molecule is kept intact and three new molecules are made."
      - "Half the DNA at intermediate density and half at light density, because each original heavy strand is still paired with a new light strand while the strands made in round one have been copied with light partners."
      - "All light, because the heavy DNA was broken down and reused."
    option_explanations:
      - |
        A single intermediate band after one round is what semiconservative and dispersive models both predict, but after two rounds dispersive replication would give a single band lighter than intermediate, not two bands. The data distinguish the models at round two.
      - |
        This is the prediction of conservative replication, which keeps the original double helix intact; it would give a heavy band and light bands. Experiments showed no heavy band after the first round, ruling conservative replication out.
      - |
        Correct. Semiconservative replication keeps each parental strand and pairs it with a new one. After round one, every molecule is heavy-light. After round two, those split: the heavy strands again get light partners (intermediate), while the light strands from round one get light partners (light). Two bands, equal amounts.
      - |
        Parental strands are templates, not raw material; they persist and are passed on. The heavy nitrogen does not leave the DNA.
    answer: 2
    explanation: |
      Track the strands, not the molecules: each old strand is conserved and gets a new partner every round. Drawing the two generations as pairs of lines is faster than reasoning in words.

  - slug: review-practice-q37
    type: multiple_choice
    topic_code: "6.3"
    source: "Biology 2e §15.4 RNA Processing in Eukaryotes"
    points: 1
    prompt: |
      Researchers injected three versions of the same eukaryotic mRNA into cells and measured protein output. The complete mRNA produced abundant protein. A version lacking the 5′ cap produced almost none. A version lacking the poly-A tail produced protein at first but output fell quickly as the mRNA disappeared. Which statement best explains the results?
    options:
      - "The cap and tail carry the codons for the first and last amino acids, so without them the protein is incomplete."
      - "Both modifications are needed only in the nucleus, so neither should affect translation."
      - "The cap and tail are introns that must be spliced out before translation."
      - "The 5′ cap is required for the ribosome to recognise and begin translating the mRNA, while the poly-A tail protects the mRNA from degradation and so determines how long it can be translated."
    option_explanations:
      - |
        Neither the cap (a modified guanine nucleotide) nor the tail (a run of adenines) is translated; the codons begin at AUG and end at a stop codon within the body of the mRNA. The cap and tail affect use and lifetime, not the sequence.
      - |
        The cap and tail do help export the mRNA from the nucleus, but the experiment injected mRNA directly into the cytoplasm and still found effects, which shows they act during translation and on stability too.
      - |
        Introns are internal sequences removed by the spliceosome; the cap and tail are added to the ends and retained. Spliced-out sequences would not be present in a mature mRNA at all.
      - |
        Correct. The cap is the ribosome's docking signal, so its absence blocks initiation; the tail is nibbled away over time and shields the coding region, so its absence lets nucleases reach the message sooner. The two phenotypes map onto the two functions.
    answer: 3
    explanation: |
      Two added features, two measurable jobs: the cap governs whether translation starts, the tail governs how long it continues. Experiments that remove one at a time are how those jobs were assigned.

  - slug: review-practice-q38
    type: multiple_choice
    topic_code: "6.4"
    source: "general knowledge"
    points: 1
    prompt: |
      An antibiotic blocks the formation of peptide bonds on bacterial (70S) ribosomes but has no effect on the 80S ribosomes of the eukaryotic cytoplasm. Patients taking it for a long time sometimes develop reduced function in tissues with very high energy demand. Which explanation of the side effect is most consistent with the structure of eukaryotic cells?
    options:
      - "The antibiotic enters the nucleus and blocks transcription of human genes."
      - "Mitochondria contain their own ribosomes of the bacterial type, so the antibiotic inhibits the synthesis of some mitochondrial proteins and reduces ATP production in energy-hungry tissues."
      - "The antibiotic kills gut bacteria, and human cells cannot make proteins without bacterial help."
      - "The antibiotic binds haemoglobin, reducing oxygen delivery."
    option_explanations:
      - |
        The drug acts on ribosomes, which are cytoplasmic; it is described as having no effect on the 80S ribosomes of human cells, and nothing in the premise concerns transcription. The side effect needs a bacterial-type target inside human cells.
      - |
        Correct. Mitochondria descend from bacteria and keep 70S-type ribosomes that translate the few proteins encoded by mitochondrial DNA, including subunits of the electron transport chain. Inhibiting them lowers ATP output, which hurts tissues such as muscle and nerve first.
      - |
        Human cells make their own proteins on their own ribosomes; gut bacteria are not involved in translation. Loss of gut flora has other effects but not reduced protein synthesis in human tissues.
      - |
        Nothing in the premise links the drug to haemoglobin, and the side effect was specific to high-energy tissues rather than general oxygen shortage. Stay with the ribosome mechanism given.
    answer: 1
    explanation: |
      Translation on 70S versus 80S ribosomes is a difference antibiotics exploit, and the mitochondrion is the exception inside your own cells. Endosymbiosis (2.10) explains a pharmacology side effect.

  - slug: review-practice-q39
    type: multiple_choice
    topic_code: "6.5"
    source: "Biology 2e §16.2 Prokaryotic Gene Regulation"
    points: 1
    prompt: |
      E. coli were grown in a medium containing both glucose and lactose. The activity of β-galactosidase, the lactose-digesting enzyme, stayed low for several hours, then rose sharply once glucose had been used up. Which explanation of the delay is correct?
    options:
      - "While glucose is abundant, cAMP is low, so the activator protein CAP does not bind the lac promoter and transcription stays weak even though lactose has removed the repressor; when glucose falls, cAMP rises, CAP binds and transcription increases."
      - "Lactose cannot enter the cell while glucose is present."
      - "The lac repressor binds glucose, which keeps it on the operator until glucose is gone."
      - "Glucose inhibits β-galactosidase directly, so the enzyme is made but inactive."
    option_explanations:
      - |
        Correct. The lac operon has two controls: the repressor (negative; lactose removes it) and CAP-cAMP (positive; needed for strong transcription). Both must favour expression. With glucose present the positive signal is missing, so the cell waits.
      - |
        Lactose enters through a permease that is itself a product of the operon; a little gets in and lifts the repressor, which is why expression is low rather than zero. Entry is not the limiting step.
      - |
        The lac repressor binds allolactose, not glucose; glucose's effect is routed through cAMP and CAP. This option confuses the two regulators.
      - |
        The measurement is of enzyme activity rising sharply later; if the enzyme were present all along and merely inhibited, there would be no synthesis delay to explain. The operon is transcribed only after glucose runs out.
    answer: 0
    explanation: |
      The lac operon is an AND gate: no repressor and CAP bound. Each regulator answers one question (is lactose here? is glucose gone?), and the diauxic growth curve is the cell waiting for both answers to be yes.

  - slug: review-practice-q40
    type: multiple_choice
    topic_code: "6.6"
    source: "general knowledge"
    points: 1
    prompt: |
      A table shows that liver cells and neurons from the same person contain identical copies of the gene for the enzyme albumin, but only liver cells contain albumin mRNA. In liver cells the gene's promoter region is bound by transcription factors and its histones are acetylated; in neurons the same region is heavily methylated and the histones are not acetylated. Which conclusion best explains the difference?
    options:
      - "Neurons have lost the albumin gene during development."
      - "The albumin gene in neurons has mutated into a different gene."
      - "Neurons transcribe the gene but destroy the mRNA before it can be detected."
      - "Cell types differ by which genes they express, not by which genes they carry; in neurons the albumin gene is packed in a closed, methylated chromatin state that transcription factors cannot access, so it is not transcribed."
    option_explanations:
      - |
        The table states the gene is present and identical in both cell types. Differentiation almost never involves losing genes; it involves switching them.
      - |
        The sequence is stated to be identical in both cell types, so there was no mutation. Epigenetic marks change expression without changing the sequence.
      - |
        The chromatin and transcription-factor data say the gene is not transcribed in the first place; invoking mRNA destruction ignores the evidence given and is a less parsimonious explanation.
      - |
        Correct. DNA methylation and the absence of histone acetylation are marks of closed chromatin. The same genome yields a liver cell or a neuron depending on which promoters are open and which transcription factors are present, which is the molecular meaning of specialisation.
    answer: 3
    explanation: |
      Specialisation is differential gene expression. When you see methylation and histone state in the data, the answer is about access to the promoter, not about the gene itself.

  - slug: review-practice-q41
    type: multiple_choice
    topic_code: "6.7"
    source: "general knowledge"
    points: 1
    prompt: |
      Four variants of a 900-nucleotide protein-coding sequence were found in different individuals: (1) a substitution at nucleotide 12 that changes a codon's third base and leaves the amino acid unchanged; (2) a substitution at nucleotide 450 that changes one amino acid to a similar one; (3) a deletion of one nucleotide at position 30; (4) a deletion of three nucleotides at position 600. Which variant is most likely to abolish the protein's function, and why?
    options:
      - "Variant 3, because a single-nucleotide deletion early in the sequence shifts the reading frame for every codon that follows, producing a different sequence of amino acids and usually an early stop."
      - "Variant 1, because any change in the DNA sequence changes the protein."
      - "Variant 4, because deleting three nucleotides removes the most DNA."
      - "Variant 2, because changing an amino acid in the middle of the protein always destroys the fold."
    option_explanations:
      - |
        Correct. Ribosomes read in threes from the start codon, so losing one nucleotide re-groups all downstream codons. From position 30 onward, 290 codons are misread and a stop codon usually appears early, leaving a short, nonfunctional product.
      - |
        Variant 1 is a silent mutation: because the genetic code is redundant, the new codon specifies the same amino acid and the protein is unchanged. Not every DNA change is a protein change.
      - |
        Deleting three nucleotides removes one amino acid (or alters two) but keeps the reading frame, so the remaining protein is intact. In-frame deletions are often tolerated; what matters is the frame, not the count.
      - |
        A conservative substitution (similar amino acid) in one position often has little effect, especially outside the active site. It may matter, but it is far less likely to abolish function than a frameshift.
    answer: 0
    explanation: |
      Rank mutations by what they do to the reading frame and to the amino acid, not by how many nucleotides change. Frameshifts near the start are the most destructive; silent and conservative changes the least.

  - slug: review-practice-q42
    type: multiple_choice
    topic_code: "6.8"
    source: "Biology 2e §17.1 Biotechnology"
    points: 1
    prompt: |
      A circular plasmid of 5,000 base pairs has two recognition sites for the restriction enzyme EcoRI, at positions 500 and 2,000. A linear DNA fragment of 5,000 base pairs has EcoRI sites at the same two positions. Each is digested completely with EcoRI and run on an agarose gel. Which description of the gel is correct?
    options:
      - "Both lanes show two bands at 1,500 and 3,500 base pairs."
      - "The plasmid lane shows one band because circular DNA cannot be cut."
      - "The plasmid lane shows two bands (1,500 and 3,500 bp); the linear lane shows three bands (500, 1,500 and 3,000 bp), and in both lanes the smallest fragment has travelled farthest from the wells."
      - "The linear lane shows two bands and the plasmid lane shows three, with the largest fragment farthest from the wells."
    option_explanations:
      - |
        Cutting a circle at two points gives two pieces, but cutting a line at two points gives three, because the two ends are not joined. The linear molecule yields 500, 1,500 and 3,000 bp.
      - |
        Restriction enzymes cut any DNA containing their recognition sequence; circularity does not protect it. A circle with n sites gives n fragments.
      - |
        Correct. Circle: 500 to 2,000 is 1,500 bp and 2,000 around to 500 is 3,500 bp. Line: 0 to 500, 500 to 2,000, 2,000 to 5,000. DNA is negatively charged and moves toward the positive electrode; smaller fragments move through the gel faster, so they sit farthest from the wells.
      - |
        The counts are reversed, and so is the direction of migration: the smallest fragment, not the largest, is farthest from the wells because it threads through the gel matrix most easily.
    answer: 2
    explanation: |
      Count fragments as cuts for a circle and cuts plus one for a line, then order the bands by size with small at the bottom. Both rules are quick to re-derive from a sketch, so draw one.

  # ======================================================================
  # Unit 7 (10 items): q43-q52
  # ======================================================================
  # ---- Stimulus set G: Hardy-Weinberg in a lizard population (7.4, 7.5, 7.5, 7.5)
  - slug: review-practice-q43
    type: multiple_choice
    topic_code: "7.4"
    source: "Biology 2e §19.2 Population Genetics"
    points: 1
    stimulus: |
      In a lizard, a single gene controls back colour: BB and Bb lizards are brown and bb lizards are grey. Researchers genotyped 500 lizards from one island population and returned ten years later to genotype 500 more.

      | Genotype | Census 1 | Census 2 (ten years later) |
      |---|---|---|
      | BB | 320 | 360 |
      | Bb | 160 | 110 |
      | bb | 20 | 30 |
      | Total | 500 | 500 |
    prompt: |
      What is the frequency of the b allele in census 1?
    options:
      - "0.04"
      - "0.20"
      - "0.36"
      - "0.10"
    option_explanations:
      - |
        0.04 is the frequency of the bb genotype (20 of 500), which equals q² if the population is in equilibrium. The allele frequency is its square root, 0.20, and should in any case be counted from the genotypes directly.
      - |
        Correct. Count alleles: 1,000 alleles in 500 lizards; b alleles = 2 × 20 (from bb) + 160 (from Bb) = 200; q = 200 / 1,000 = 0.20. Then p = 0.80.
      - |
        0.36 is the fraction of lizards that carry at least one b allele (180 of 500). Carriers are not alleles; heterozygotes contribute one b each, homozygotes two.
      - |
        0.10 would result from counting only the heterozygotes' b alleles (160) over the full 1,000 and then halving, or from dividing bb individuals by 200. Count every copy of b in the whole population.
    answer: 1
    explanation: |
      Always compute allele frequencies by counting alleles from genotype numbers; square roots of q² are only valid if the population is already assumed to be in equilibrium, which is the thing you are usually testing.

  - slug: review-practice-q44
    type: multiple_choice
    topic_code: "7.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      In a lizard, a single gene controls back colour: BB and Bb lizards are brown and bb lizards are grey. Researchers genotyped 500 lizards from one island population and returned ten years later to genotype 500 more.

      | Genotype | Census 1 | Census 2 (ten years later) |
      |---|---|---|
      | BB | 320 | 360 |
      | Bb | 160 | 110 |
      | bb | 20 | 30 |
      | Total | 500 | 500 |
    prompt: |
      Under Hardy-Weinberg equilibrium, how many heterozygotes are expected in census 1, and what does the comparison with the observed number indicate?
    options:
      - "250, because half the population should be heterozygous; the observed 160 shows heterozygotes are being selected against."
      - "160, but because p and q are unequal the population cannot be in equilibrium."
      - "80, because 2pq = 2 × 0.8 × 0.2 × 0.5; the observed 160 shows an excess of heterozygotes."
      - "160, matching the observed number exactly; the genotype frequencies are those the Hardy-Weinberg model predicts, so the data give no evidence of evolutionary forces acting on this gene at that time."
    option_explanations:
      - |
        The expected heterozygote frequency is 2pq, not 1/2; with p = 0.8 and q = 0.2 it is 0.32. There is no basis for a 50% expectation, and no selection is indicated.
      - |
        Equilibrium does not require p = q; it requires that genotype frequencies be p², 2pq and q² for whatever p and q are. Unequal allele frequencies are perfectly consistent with equilibrium.
      - |
        2pq = 2 × 0.8 × 0.2 = 0.32, and 0.32 × 500 = 160. The extra factor of 0.5 is an error; there is no excess of heterozygotes.
      - |
        Correct. Expected: p² = 0.64 (320 BB), 2pq = 0.32 (160 Bb), q² = 0.04 (20 bb). All three observed counts equal the expectations, so the null hypothesis stands.
    answer: 3
    explanation: |
      Equilibrium is a statement about the relationship between allele and genotype frequencies, not about their values. When observed equals expected, you have failed to detect evolution, which is what the model is for.

  - slug: review-practice-q45
    type: multiple_choice
    topic_code: "7.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      In a lizard, a single gene controls back colour: BB and Bb lizards are brown and bb lizards are grey. Researchers genotyped 500 lizards from one island population and returned ten years later to genotype 500 more.

      | Genotype | Census 1 | Census 2 (ten years later) |
      |---|---|---|
      | BB | 320 | 360 |
      | Bb | 160 | 110 |
      | bb | 20 | 30 |
      | Total | 500 | 500 |
    prompt: |
      In census 2 the allele frequencies (p ≈ 0.83, q ≈ 0.17) predict about 141 heterozygotes and about 14 bb lizards, but 110 and 30 were observed, a deviation too large to be chance (χ² ≈ 24). Both homozygote classes are in excess and heterozygotes are deficient, while allele frequencies have barely moved. Which process is most consistent with that pattern?
    options:
      - "Strong selection against grey lizards."
      - "Gene flow from a population consisting entirely of heterozygotes."
      - "Non-random mating in which lizards tend to mate with others of their own colour, which raises both homozygote frequencies and lowers heterozygote frequency without much changing allele frequencies."
      - "A new mutation converting B alleles to b alleles."
    option_explanations:
      - |
        Selection against bb would make the bb class smaller than expected, but there are more bb lizards than expected (30 versus 14). Selection changes allele frequencies over time; here the pattern is in genotype proportions.
      - |
        Immigrants that are all heterozygous would raise, not lower, the heterozygote count. Gene flow typically moves genotype frequencies toward those of the source population, which is the opposite of this deficit.
      - |
        Correct. Assortative mating (like with like) does not by itself change p and q, but it pairs similar genotypes, producing more homozygotes and fewer heterozygotes than random mating would. Inbreeding or hidden subdivision of the population gives the same signature.
      - |
        Mutation would shift allele frequencies very slowly and would not create a heterozygote deficit; p and q are nearly unchanged over ten years in any case. Mutation rates are far too small to explain a shift of this size.
    answer: 2
    explanation: |
      Match the fingerprint to the force. Selection and drift change allele frequencies; non-random mating changes how alleles are packaged into genotypes. A heterozygote deficit with stable p and q points to the latter.

  - slug: review-practice-q46
    type: multiple_choice
    topic_code: "7.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      In a lizard, a single gene controls back colour: BB and Bb lizards are brown and bb lizards are grey. Researchers genotyped 500 lizards from one island population and returned ten years later to genotype 500 more.

      | Genotype | Census 1 | Census 2 (ten years later) |
      |---|---|---|
      | BB | 320 | 360 |
      | Bb | 160 | 110 |
      | bb | 20 | 30 |
      | Total | 500 | 500 |
    prompt: |
      Which statement best describes the role the Hardy-Weinberg model plays in a study like this one?
    options:
      - "It is a null hypothesis: it predicts the genotype frequencies a population would show if no evolutionary forces were acting, so a significant deviation is evidence that at least one of its conditions is not met, though it does not by itself say which."
      - "It is a law that real populations obey, so any deviation indicates a measurement error."
      - "It identifies which allele is being favoured by natural selection."
      - "It proves that a population is not evolving whenever allele frequencies are between 0 and 1."
    option_explanations:
      - |
        Correct. Like any null hypothesis, Hardy-Weinberg specifies the expectation under 'nothing is happening'. Rejecting it tells you something is happening; finding what requires further data, as in the comparison of the two censuses here.
      - |
        No real population meets all five conditions (large size, random mating, no mutation, no migration, no selection) perfectly; the model is a reference point, not a law populations must follow. Deviations are the interesting result, not errors.
      - |
        The model is silent about selection's direction or target. It can only flag that genotype frequencies are not those expected under random mating with no evolutionary forces.
      - |
        Allele frequencies are always between 0 and 1; that is arithmetic, not evidence. Equilibrium is about the relationship between allele frequencies and genotype frequencies, and about their constancy over generations.
    answer: 0
    explanation: |
      Hardy-Weinberg is a null model. The exam asks what a deviation means and what it does not mean; the honest answer is 'something is violating a condition' and then you reach for more evidence.

  # ---- Standalone Unit 7 items (7.2, 7.8, 7.7, 7.10, 7.11, 7.12)
  - slug: review-practice-q47
    type: multiple_choice
    topic_code: "7.2"
    source: "Biology 2e §18.1 Understanding Evolution"
    points: 1
    prompt: |
      Before a drought, the mean beak depth in a population of seed-eating finches was 9.4 mm (standard error 0.1 mm, n = 200). After the drought, which killed most birds and left mainly large, hard seeds, the mean beak depth of the survivors' offspring was 9.9 mm (standard error 0.1 mm, n = 180). Which conclusion is best supported?
    options:
      - "The ±2 SE intervals overlap, so the two means are not distinguishable."
      - "The sample sizes are too small to draw any conclusion."
      - "The finches grew deeper beaks during the drought because they needed them to crack the hard seeds."
      - "The ±2 SE intervals (9.2 to 9.6 mm versus 9.7 to 10.1 mm) do not overlap, so the increase is unlikely to be chance; because the measurement is in the offspring, the trait must be heritable, consistent with natural selection for deeper beaks."
    option_explanations:
      - |
        Twice the standard error gives 9.2–9.6 for the first mean and 9.7–10.1 for the second; the intervals miss each other by 0.1 mm. Non-overlapping ±2 SE bars are the usual criterion for a difference that is unlikely to be chance.
      - |
        Standard error already accounts for sample size (SE = s / √n), and samples of 180 to 200 are large for a field study. The non-overlapping intervals are the conclusion the data support.
      - |
        Individuals do not change their inherited traits in response to need, and the question measures the next generation, not the survivors' own beaks. Selection sorted among existing variants; it did not induce change in individuals.
      - |
        Correct. The data satisfy the three requirements of natural selection: variation existed, deeper-beaked birds survived the hard-seed environment better, and the offspring inherited the difference. The offspring measurement is what distinguishes evolution from mere survivorship.
    answer: 3
    explanation: |
      Error bars of ±2 SE that fail to overlap are your evidence that a difference is real; heritability, shown by measuring the offspring, is your evidence that the difference is evolution and not just survival.

  - slug: review-practice-q48
    type: multiple_choice
    topic_code: "7.8"
    source: "general knowledge"
    points: 1
    prompt: |
      Bacteria that had never been exposed to an antibiotic were spread on a plate without antibiotic and grew into hundreds of colonies. A velvet pad was pressed onto the plate and then onto three new plates containing the antibiotic, copying the colony pattern. On each antibiotic plate, a few colonies grew, and they appeared at the same positions on all three copies. Which conclusion does this result support?
    options:
      - "The antibiotic caused the bacteria at those positions to mutate to resistance."
      - "Resistance mutations arose by chance in a few cells before the bacteria ever met the antibiotic; the antibiotic merely selected the cells that already carried them."
      - "All the bacteria were resistant, but only a few survived the transfer."
      - "The velvet pad transferred the antibiotic back to the master plate."
    option_explanations:
      - |
        If the antibiotic induced resistance, the resistant colonies would appear at random, different positions on each copy, because each copy was exposed separately. Identical positions mean the resistant cells were already in those colonies on the master plate.
      - |
        Correct. The master plate never saw antibiotic, yet it already contained resistant colonies, as the matching positions prove. Variation first, selection second: this is the order natural selection requires and the experiment demonstrates.
      - |
        Hundreds of colonies were transferred and only a few grew; and the few grew at reproducible positions. Random transfer losses would not reproduce the same positions three times.
      - |
        The master plate was pressed first, before the pad touched any antibiotic, and the question is about which colonies grew on the antibiotic plates, not on the master.
    answer: 1
    explanation: |
      Antibiotic resistance is evolution observed in real time, and this design settles the old question of whether the environment creates or selects variation: the replicas show the variants were there before the challenge.

  - slug: review-practice-q49
    type: multiple_choice
    topic_code: "7.7"
    source: "general knowledge"
    points: 1
    prompt: |
      The number of amino-acid differences between human cytochrome c and the same protein in other species is: rhesus monkey 1, dog 11, chicken 13, tuna 21, yeast 44. Which statement best interprets these data?
    options:
      - "Yeast has evolved faster than the other species, which is why it has the most differences."
      - "Cytochrome c works poorly in tuna and yeast, which is why their sequences differ."
      - "The number of differences increases with the time since each lineage last shared a common ancestor with humans, consistent with substitutions accumulating at a roughly steady rate in a protein that all these organisms still use for the same job."
      - "Humans are more closely related to dogs than to chickens because dogs are mammals, so the data must be wrong."
    option_explanations:
      - |
        Each pair of lineages has been evolving for the same length of time since their split, so a larger difference reflects an older split, not a faster rate in one branch. Half the yeast-human differences accumulated on the human side.
      - |
        Cytochrome c carries electrons just as well in yeast as in humans; conserved function is why the protein is useful for comparison. Differences accumulate in positions where change is tolerated.
      - |
        Correct. Cytochrome c is a conserved protein shared by all aerobic eukaryotes, which is evidence of common ancestry; the graded differences are what a molecular clock predicts and match the fossil order of divergence.
      - |
        The data agree with the expectation: dog (11) is closer than chicken (13). There is no contradiction to explain away.
    answer: 2
    explanation: |
      A shared protein argues for common ancestry; the pattern of differences dates the branches. Both lines of evidence come from one table once you ask what each number means.

  - slug: review-practice-q50
    type: multiple_choice
    topic_code: "7.10"
    source: "general knowledge"
    points: 1
    prompt: |
      Fruit flies from one population were split into two groups and reared for many generations on different foods, one on a starch medium and one on a maltose medium. When flies from the two groups were then mixed, about 70% of matings were between flies raised on the same food, instead of the 50% expected if mating were random. Which conclusion is best supported?
    options:
      - "The two groups have become separate species."
      - "The maltose flies have accumulated mutations that make them infertile with starch flies."
      - "The flies learned to prefer the smell of their own food, which has no bearing on evolution."
      - "Adaptation to different environments has produced a partial behavioural (prezygotic) barrier to mating, an early stage in the process by which speciation can occur, although the groups are not yet separate species."
    option_explanations:
      - |
        The groups still interbreed 30% of the time and nothing suggests the hybrids are inviable or sterile. Separate species require reproductive isolation, and this is partial at most.
      - |
        The matings that did occur between groups produced normal offspring in such experiments; the barrier observed is in who mates with whom (prezygotic), not in the fertility of hybrids (postzygotic).
      - |
        The preference was inherited across generations in flies that never experienced the other medium, so it is evolved, not learned. And mate preference is one of the central mechanisms of reproductive isolation.
      - |
        Correct. Divergent selection on the two media changed traits (likely cuticle chemicals used in mate choice) that incidentally influence mate preference. That is how reproductive isolation can begin as a by-product of adaptation in allopatry.
    answer: 3
    explanation: |
      Speciation is a process, not an event, and it starts with partial barriers. Classify the barrier (pre- or postzygotic) and ask whether gene flow is reduced or stopped before you call anything a species.

  - slug: review-practice-q51
    type: multiple_choice
    topic_code: "7.11"
    source: "general knowledge"
    points: 1
    prompt: |
      Two populations of the same amphibian are surveyed. Population X passed through a severe bottleneck a century ago and now shows heterozygosity of 0.02 across sampled genes; population Y never bottlenecked and shows 0.30. A new fungal pathogen reaches both populations. Which prediction is best supported?
    options:
      - "Population Y is more likely to persist, because its greater genetic variation makes it more likely that some individuals carry alleles conferring resistance on which selection can act."
      - "Population X is more likely to persist, because a bottleneck removes harmful alleles."
      - "Both populations are equally likely to persist, because the pathogen is new to both."
      - "Population X will evolve resistance faster, because a smaller population responds to selection more quickly."
    option_explanations:
      - |
        Correct. Natural selection can only act on variation that exists. A population with many alleles is more likely to include some that happen to resist the new pathogen, and the survivors can rebuild the population; a nearly uniform population may have no resistant individuals at all.
      - |
        Bottlenecks remove alleles at random, harmful and helpful alike, and leave a population with little to select among. A low heterozygosity is a warning sign, not an advantage.
      - |
        Novelty of the threat is the same for both, but their capacity to respond is not. The question hinges on standing variation, which differs fifteen-fold between them.
      - |
        Small populations are more subject to drift, not more responsive to selection; and population X has almost no variation for selection to work with. Speed of response depends on the presence of resistant alleles, not on being small.
    answer: 0
    explanation: |
      Genetic diversity is a population's insurance policy. The link between variation and resilience is why conservation biology measures heterozygosity and why monocultures fail.

  - slug: review-practice-q52
    type: multiple_choice
    topic_code: "7.12"
    source: "general knowledge"
    points: 1
    prompt: |
      Which finding most directly supports the hypothesis that RNA, rather than DNA or protein, was the first molecule to both carry genetic information and catalyse reactions in early life?
    options:
      - "Experiments simulating early Earth conditions produced amino acids from simple gases."
      - "DNA is chemically more stable than RNA, which is why cells store information in DNA."
      - "Some RNA molecules act as enzymes (ribozymes), and in every living cell the peptide bond is formed by the ribosomal RNA, not by a protein."
      - "Proteins can fold into more varied shapes than nucleic acids."
    option_explanations:
      - |
        Producing amino acids abiotically supports the idea that organic monomers could form on early Earth, but it says nothing about which polymer first combined information storage with catalysis.
      - |
        DNA's stability explains why it later took over information storage, but it argues that DNA came after a less stable predecessor rather than that RNA came first; it is indirect at best.
      - |
        Correct. The 'RNA world' hypothesis needs one molecule that could do both jobs. Ribozymes show RNA can catalyse, and the ribosome's catalytic core being RNA is a living fossil of a time before protein enzymes.
      - |
        Protein versatility explains why proteins took over catalysis, not what came first. Proteins cannot copy themselves, which is the problem the RNA hypothesis solves.
    answer: 2
    explanation: |
      Ask what the hypothesis requires and which evidence meets that requirement. 'RNA first' requires an RNA that can act as a catalyst, and the ribosome supplies the most important example.

  # ======================================================================
  # Unit 8 (8 items): q53-q60
  # ======================================================================
  # ---- Stimulus set H: Simpson's diversity index in two meadows (8.6, 8.6, 8.7)
  - slug: review-practice-q53
    type: multiple_choice
    topic_code: "8.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      Students counted every flowering plant in a 10 m × 10 m plot in each of two meadows. Simpson's diversity index is 1 − Σ(n/N)², where n is the number of individuals of one species and N is the total number of individuals.

      | Species | Meadow 1 | Meadow 2 |
      |---|---|---|
      | Yarrow | 60 | 25 |
      | Clover | 20 | 25 |
      | Buttercup | 10 | 20 |
      | Knapweed | 10 | 15 |
      | Oxeye daisy | 0 | 15 |
      | Total (N) | 100 | 100 |
    prompt: |
      What is Simpson's diversity index for Meadow 1?
    options:
      - "0.42"
      - "4"
      - "0.79"
      - "0.58"
    option_explanations:
      - |
        0.42 is Σ(n/N)², the probability that two individuals drawn at random are the same species. The index subtracts that from 1, so 0.42 is the step before the answer.
      - |
        4 is the species richness of Meadow 1 (the number of species present). Richness is one ingredient of diversity, but the index also weighs how evenly individuals are spread among species.
      - |
        0.79 is the index for Meadow 2: 1 − (0.0625 + 0.0625 + 0.04 + 0.0225 + 0.0225) = 1 − 0.21. Check which column you used.
      - |
        Correct. (60/100)² + (20/100)² + (10/100)² + (10/100)² = 0.36 + 0.04 + 0.01 + 0.01 = 0.42; 1 − 0.42 = 0.58. Higher values mean greater diversity.
    answer: 3
    explanation: |
      Work the formula-sheet index as a table: n/N, square it, sum, subtract from 1. Keep the intermediate sum visible, since it is the most common place to stop one step early.

  - slug: review-practice-q54
    type: multiple_choice
    topic_code: "8.6"
    source: "Biology 2e §47.1 The Biodiversity Crisis"
    points: 1
    stimulus: |
      Students counted every flowering plant in a 10 m × 10 m plot in each of two meadows. Simpson's diversity index is 1 − Σ(n/N)², where n is the number of individuals of one species and N is the total number of individuals.

      | Species | Meadow 1 | Meadow 2 |
      |---|---|---|
      | Yarrow | 60 | 25 |
      | Clover | 20 | 25 |
      | Buttercup | 10 | 20 |
      | Knapweed | 10 | 15 |
      | Oxeye daisy | 0 | 15 |
      | Total (N) | 100 | 100 |
    prompt: |
      Meadow 2 has a higher Simpson's index (0.79) than Meadow 1 (0.58). Which statement correctly identifies what produces the difference?
    options:
      - "Meadow 2 has more individual plants, so its index is higher."
      - "Meadow 2 has both greater species richness (five species versus four) and greater evenness (no single species dominates), and the index rewards both."
      - "Meadow 2 has a higher index only because it contains oxeye daisy, a rare species."
      - "The indices cannot be compared because the plots were in different meadows."
    option_explanations:
      - |
        Both plots contained exactly 100 plants; N is the same. The index depends on proportions, not on the total count.
      - |
        Correct. Diversity has two components. Richness: 5 versus 4. Evenness: Meadow 1 is 60% yarrow, so two random picks are often the same species; Meadow 2's most common species is only 25%. Both push Meadow 2's index up.
      - |
        Adding one species helps, but the larger effect is evenness: even with four species, Meadow 2's first four (25, 25, 20, 15 of 85) would score about 0.74, well above 0.58. Dominance by yarrow is what pulls Meadow 1 down.
      - |
        Comparing sites is exactly what a standardised index with equal plot size and equal N is for. The method controls for area and sampling effort.
    answer: 1
    explanation: |
      When two communities differ in diversity, say which component differs: richness (how many species), evenness (how equally they share the individuals) or both. The index quantifies the combination.

  - slug: review-practice-q55
    type: multiple_choice
    topic_code: "8.7"
    source: "general knowledge"
    points: 1
    stimulus: |
      Students counted every flowering plant in a 10 m × 10 m plot in each of two meadows. Simpson's diversity index is 1 − Σ(n/N)², where n is the number of individuals of one species and N is the total number of individuals.

      | Species | Meadow 1 | Meadow 2 |
      |---|---|---|
      | Yarrow | 60 | 25 |
      | Clover | 20 | 25 |
      | Buttercup | 10 | 20 |
      | Knapweed | 10 | 15 |
      | Oxeye daisy | 0 | 15 |
      | Total (N) | 100 | 100 |
    prompt: |
      A fungal disease that kills only yarrow spreads through both meadows. Which prediction about the two communities is best supported, and what general principle does it illustrate?
    options:
      - "Meadow 1 loses 60% of its individuals and Meadow 2 loses 25%, so the more diverse community keeps more of its structure and function; higher diversity tends to make a community more resilient to disturbance."
      - "Both meadows lose the same fraction of their plants, because the disease kills one species in each."
      - "Meadow 2 is harmed more because it has more species for the disease to spread to."
      - "Neither meadow is affected, because the loss of one species is always replaced by another."
    option_explanations:
      - |
        Correct. A community dominated by one species stakes most of its productivity, pollinator support and ground cover on that species. Diversity spreads the risk, so a disturbance that removes one species removes less of the whole.
      - |
        The same species is lost, but its share of the community is very different: 60 of 100 plants in Meadow 1, 25 of 100 in Meadow 2. Fraction lost depends on dominance, which is what the index was measuring.
      - |
        The disease kills only yarrow; other species are not hosts. More species means more of the community is untouched, not more targets.
      - |
        Replacement by other species takes time and is not guaranteed; in the short term the loss is real. The principle is that diverse communities lose less and recover faster, not that they lose nothing.
    answer: 0
    explanation: |
      Diversity is not an abstract score: a dominant species is a single point of failure. The index tells you how exposed a community is before the disturbance arrives.

  # ---- Standalone Unit 8 items (8.1, 8.2, 8.3, 8.4, 8.7)
  - slug: review-practice-q56
    type: multiple_choice
    topic_code: "8.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Grass seedlings were grown in a box with a window on one side. Intact seedlings bent toward the window. Seedlings whose tips were covered with an opaque cap grew straight up. Seedlings whose tips were left uncovered but whose lower stems were wrapped in opaque sleeves still bent toward the window. Which conclusion is best supported?
    options:
      - "Light is detected by the whole shoot, and each region bends independently."
      - "Seedlings grow toward windows because glass gives off warmth."
      - "The caps and sleeves physically prevented the stems from bending."
      - "The tip detects the light, and a signal passes from the tip to the region below it, where the bending response occurs."
    option_explanations:
      - |
        If every region detected light, covering only the tip would not abolish bending; the lower stem, still lit, would respond. It did not, so detection is localised to the tip.
      - |
        The seedlings with capped tips received the same warmth and did not bend, which separates the light signal from any temperature effect. The design tests light reception, not heat.
      - |
        The sleeved seedlings bent normally, so the sleeve did not restrain growth; and a cap on the tip leaves the bending region completely free. The treatments altered what received light, not what could move.
      - |
        Correct. Covering the tip removed the response; covering the bending region did not. Detection and response are therefore in different places and must be connected by a transmitted signal, which was later identified as the hormone auxin moving down the shaded side.
    answer: 3
    explanation: |
      The logic is the same as any signalling question: find where the stimulus is perceived, find where the response happens, and if they differ, infer a signal between them. Phototropism is 8.1 and 4.1 at once.

  - slug: review-practice-q57
    type: multiple_choice
    topic_code: "8.2"
    source: "Biology 2e §46.2 Energy Flow through Ecosystems"
    points: 1
    prompt: |
      In a grassland, net primary productivity is 8,000 kJ per square metre per year. About 10% of the energy at each trophic level is incorporated into the next. Approximately how much energy is available to secondary consumers each year per square metre, and what happens to the rest?
    options:
      - "80 kJ; the rest is lost mainly as heat from the respiration of organisms at each level, with some left in uneaten remains and waste that pass to decomposers."
      - "800 kJ; the rest is stored permanently in the soil."
      - "80 kJ; the rest is recycled back to the producers."
      - "7,200 kJ; the rest is transferred to tertiary consumers."
    option_explanations:
      - |
        Correct. 8,000 → 800 (herbivores) → 80 (secondary consumers). The 90% lost at each step is used to run metabolism and is released as heat, or remains in material that was not eaten or not assimilated. This is why food chains are short.
      - |
        800 kJ is the energy at the primary consumer level (10% of 8,000); secondary consumers get 10% of that. And energy is not stored permanently in soil; it is dissipated as heat.
      - |
        Energy is not recycled; matter is. Producers must capture new energy from sunlight every year because the heat released by respiration cannot be reused.
      - |
        7,200 kJ is the amount NOT transferred from producers to herbivores; it is lost, not passed up. Tertiary consumers would receive about 8 kJ.
    answer: 0
    explanation: |
      Matter cycles, energy flows through and leaves as heat. The ten-percent approximation gives the arithmetic; the second law of thermodynamics gives the reason.

  - slug: review-practice-q58
    type: multiple_choice
    topic_code: "8.3"
    source: "Biology 2e §45.3 Environmental Limits to Population Growth"
    points: 1
    prompt: |
      A deer population of 2,000 lives on a reserve with a carrying capacity of 5,000. The population's maximum per-capita growth rate is 0.2 per year. Using the logistic model dN/dt = rmax N (K − N)/K, what is the population's growth rate this year, and how does it compare with unlimited growth?
    options:
      - "400 deer per year, the same as exponential growth, because the population is well below K."
      - "160 deer per year, because 2,000/5,000 of the capacity is already used."
      - "240 deer per year, which is 60% of the 400 that exponential growth would give, because the (K − N)/K term reduces growth as the population fills the available capacity."
      - "600 deer per year, because the population is still growing rapidly."
    option_explanations:
      - |
        400 is rmax N, the exponential rate. The logistic model multiplies it by (K − N)/K = 3,000/5,000 = 0.6, which is not negligible even at 40% of capacity.
      - |
        160 comes from multiplying 400 by N/K (0.4) instead of (K − N)/K (0.6). The factor represents the fraction of capacity still unused.
      - |
        Correct. dN/dt = 0.2 × 2,000 × (5,000 − 2,000)/5,000 = 400 × 0.6 = 240 deer per year. As N approaches K the factor approaches 0 and growth stops.
      - |
        No formula gives 600; it would require a growth factor greater than 1, which the logistic model never produces. Growth below K is always less than the exponential rate.
    answer: 2
    explanation: |
      The logistic equation is the exponential one times the unused fraction of carrying capacity. Compute the exponential rate first, then scale it; the comparison between the two is usually the point of the question.

  - slug: review-practice-q59
    type: multiple_choice
    topic_code: "8.4"
    source: "general knowledge"
    points: 1
    prompt: |
      Researchers recorded the proportion of songbird nests destroyed by a nest parasite at sites with different nest densities: 10 nests per hectare, 5% parasitised; 50 per hectare, 22%; 100 per hectare, 48%. Which conclusion is best supported?
    options:
      - "Parasitism is a density-independent factor, because it occurs at every density."
      - "Parasitism is a density-dependent factor: its per-nest impact rises with population density, so it can slow population growth as the population approaches carrying capacity."
      - "The parasite prefers crowded sites, so it has no effect on population size."
      - "Nest density has no effect, because the number of parasitised nests is small at low density."
    option_explanations:
      - |
        A factor that occurs everywhere can still be density-dependent; the test is whether its proportional effect changes with density. Here the percentage rises almost tenfold across the range.
      - |
        Correct. The fraction, not just the number, of nests lost increases with density, which is the definition of a density-dependent factor. Such factors are the negative feedback that produces the logistic curve's plateau.
      - |
        A parasite that destroys half the nests at high density has a very large effect on population size. Preference for crowded sites is precisely what makes it a regulating factor.
      - |
        The absolute number is small at low density because few nests exist, but the proportion is what matters for the per-capita growth rate, and that changes strongly.
    answer: 1
    explanation: |
      Density dependence is about proportions. Predation, parasitism, disease and competition intensify per individual as crowding rises; weather does not. That distinction is what the exam is testing.

  - slug: review-practice-q60
    type: multiple_choice
    topic_code: "8.7"
    source: "general knowledge"
    points: 1
    prompt: |
      After heavy rain washed fertiliser from farmland into a lake, the water turned green within a week, and two weeks later dead fish were found along the shore and dissolved oxygen near the bottom was close to zero. Which chain of events best explains the fish kill?
    options:
      - "The fertiliser was directly toxic to the fish."
      - "The green colour blocked light, and fish cannot survive in darkness."
      - "The algae used up the oxygen in the water by photosynthesis."
      - "Nitrate and phosphate from the fertiliser fuelled a bloom of algae; when the algae died, decomposers consumed oxygen as they respired on the dead material, depleting the water of oxygen the fish needed."
    option_explanations:
      - |
        Agricultural nitrate and phosphate are nutrients, not toxins at these concentrations; the two-week delay and the near-zero oxygen point to an indirect, biological cause.
      - |
        Shading can kill rooted plants and alter the community, but fish do not need light to breathe. The measured variable was oxygen, and that is what killed them.
      - |
        Photosynthesis releases oxygen, it does not consume it; during the bloom surface oxygen may actually rise by day. The oxygen is consumed by respiration, chiefly of decomposers, after the algae die.
      - |
        Correct. Eutrophication: nutrient input removes the limit on producer growth, the bloom crashes, and the surge of decomposition pulls oxygen out of the water. The bottom water goes hypoxic first because that is where the dead material settles.
    answer: 3
    explanation: |
      Follow the matter and the energy: nutrients become algal biomass, biomass becomes decomposer respiration, respiration consumes oxygen. The disruption is a nutrient cycle thrown out of balance, not a poisoning.

