week: 30
unit: 8
title: Density, Regulation and Community Ecology
topics: ["8.4", "8.5"]
guide: guides/week-30.md
guide_description: |
  What holds a population near its carrying capacity: density-dependent factors (competition, predation,
  disease, waste) versus density-independent ones (weather, fire, flood), r- and K-selected life histories,
  dispersion patterns and mark-recapture. Then the community: niche, competitive exclusion and resource
  partitioning, predator-prey cycles, defences and mimicry, the three symbioses, foundation and keystone
  species, trophic cascades and succession. Three worked examples (a mark-recapture estimate, the Pisaster
  removal data, reading a lynx-hare graph), misconceptions, self-check.
flashcards_description: |
  30 cards: the vocabulary of population regulation and life-history strategy, the sampling methods, and the
  interactions, species roles and dynamics that structure a community.

flashcards:
  - front: Density-dependent factor → definition and four examples
    back: |
      A limit on population growth whose effect per individual grows as density rises. Competition for food or space, predation, parasitism and disease, and accumulation of waste. Mostly biotic. These are what make the logistic curve bend.
    topic_code: "8.4"
  - front: Density-independent factor → definition and examples
    back: |
      A cause of mortality that removes the same proportion of a population whatever its density. Weather, drought, floods, wildfire, volcanic eruptions, pollution. Mostly abiotic. A forest fire kills deer at the same rate in a crowded forest and an empty one.
    topic_code: "8.4"
  - front: How do density-dependent factors produce logistic growth?
    back: |
      As N rises, each individual gets less food and space, meets more predators and parasites, and lives among more waste, so per-capita births fall and per-capita deaths rise. When the two meet, dN/dt is zero and the population sits at K. The (K − N)/K term is these factors in arithmetic form.
    topic_code: "8.4"
  - front: Ascaris fecundity data → what it shows
    back: |
      In the intestinal roundworm, the number of eggs per female falls steeply as the number of worms per host rises, then levels off above about 30 to 50 worms. Fecundity depends on density, the textbook case of density-dependent regulation. The mechanism is still unknown; smaller females were ruled out in 2009.
    topic_code: "8.4"
  - front: After a density-independent disaster, which recovers faster, a dense or a sparse population?
    back: |
      The dense one. A fire removes the same proportion of each, but the dense population has more survivors left to reproduce, and with density now low, per-capita growth is near rmax. Density-independent events reset N; density-dependent factors then govern the rebound.
    topic_code: "8.4"
  - front: K-selected species → traits and examples
    back: |
      Adapted to stable environments near carrying capacity: few, large offspring; long gestation; extended parental care; late maturity; long life; intense intraspecific competition. Elephants, primates, oaks (an oak waits 20 years to make its first acorns).
    topic_code: "8.4"
  - front: r-selected species → traits and examples
    back: |
      Adapted to unpredictable or disturbed environments: many small offspring; little or no parental care; early maturity; short life; populations often far below K. Dandelions, jellyfish, many insects. Survival is by numbers, not by investment in each offspring.
    topic_code: "8.4"
  - front: Why have ecologists moved beyond simple r/K selection?
    back: |
      Many species fit neither extreme and the scheme ignored age-specific mortality; it has been replaced by life-history models built on life tables and survivorship. r and K are still useful as the two ends of a trade-off between number of offspring and investment per offspring.
    topic_code: "8.4"
  - front: Dispersion patterns → uniform, random, clumped and what causes each
    back: |
      Uniform: individuals evenly spaced, from territoriality or allelopathy (sage releases chemicals that stop neighbours growing). Random: no pattern, as with wind-blown dandelion seeds. Clumped: groups, from patchy resources, social behaviour (elephant herds) or seeds dropping beneath the parent (oaks). Clumped is the most common.
    topic_code: "8.4"
  - front: Mark-recapture → formula and the deer example
    back: |
      N = (number marked in the first catch × total caught in the second) ÷ number marked in the second catch. Tag 80 deer; later catch 100 of which 20 are tagged; N = 80 × 100 ÷ 20 = 400. Assumes marks are not lost, marked animals mix back in and are caught at the same rate as unmarked ones.
    topic_code: "8.4"
  - front: Predator-prey cycles → the lynx and the snowshoe hare
    back: |
      Hare numbers swing between roughly 10,000 and 150,000 on a cycle of about ten years; lynx numbers follow one to two years behind. More hares feed more lynx; more lynx crash the hares; fewer hares starve the lynx; fewer lynx let hares recover. Predation is a density-dependent factor acting with a lag.
    topic_code: "8.4"
  - front: Community vs ecosystem
    back: |
      A community is all the populations of different species living and interacting in an area. An ecosystem is the community plus the abiotic environment it exchanges energy and matter with. Community ecology is about the interactions between species; ecosystem ecology is about energy and nutrients.
    topic_code: "8.5"
  - front: Ecological niche → definition, and fundamental vs realised
    back: |
      The sum of a species' use of resources and conditions: what it eats, where and when it feeds, what temperature it tolerates, who eats it. The fundamental niche is everything it could occupy without competitors; the realised niche is the part it actually occupies when competitors and predators are present.
    topic_code: "8.5"
  - front: Competitive exclusion principle → the Paramecium experiment
    back: |
      Two species cannot occupy the same niche in the same habitat indefinitely; the better competitor drives the other out. Grown alone, Paramecium aurelia and P. caudatum each thrive; grown together on the same food, P. aurelia wins and P. caudatum goes extinct in the culture.
    topic_code: "8.5"
  - front: Resource partitioning → how competitors coexist
    back: |
      Species that would otherwise compete divide the resource: different prey sizes, different parts of a tree, different feeding times, different depths. Each occupies a narrower realised niche than its fundamental niche, and both persist. The pattern is the evolutionary outcome of past competition.
    topic_code: "8.5"
  - front: Interspecific vs intraspecific competition
    back: |
      Intraspecific is between members of one species and is what limits a population at K. Interspecific is between species that use the same resource; it shrinks the realised niche of each and, if complete, excludes one. Both are −/− interactions.
    topic_code: "8.5"
  - front: Predation vs herbivory → the difference in the prey's options
    back: |
      Predation is one animal killing and eating another; herbivory is an animal eating a plant or alga, often without killing it. Animals can flee, hide or fight; plants cannot move, so their defences are structural (thorns), chemical (foxglove toxins) or tolerant (regrowth).
    topic_code: "8.5"
  - front: Four categories of defence against being eaten
    back: |
      Mechanical (thorns, shells, spines); chemical (toxins, foul tastes); camouflage, matching the background (stick insects, chameleons); and behavioural (playing dead, alarm calls, moving in groups). Many species combine several.
    topic_code: "8.5"
  - front: Aposematic coloration
    back: |
      Bright warning colours on a species that is toxic or dangerous, such as the strawberry poison dart frog or a skunk. Predators that sample one learn to avoid the pattern, so the conspicuous colour raises survival. It works only if predators can learn and the signal is honest often enough.
    topic_code: "8.5"
  - front: Batesian vs Mullerian mimicry
    back: |
      Batesian: a harmless species copies the warning colours of a dangerous one (a robber fly that looks like a bumblebee); it works while the mimic stays rarer than the model. Mullerian: several dangerous species share one warning pattern (Heliconius butterflies), so each predator lesson protects all of them.
    hint: Batesian is a bluff; Mullerian is a shared honest signal.
    topic_code: "8.5"
  - front: Symbiosis → the three types and the sign of each partner's outcome
    back: |
      Close, long-term interactions between species. Mutualism +/+: both benefit. Commensalism +/0: one benefits, the other is unaffected. Parasitism +/−: the parasite benefits at the host's expense. Predation and competition are also interactions but not usually called symbioses.
    topic_code: "8.5"
  - front: Mutualism → two examples and what each partner gets
    back: |
      Termites and the protozoa in their guts: the protozoa digest cellulose the termite cannot, and get shelter and a steady food supply. Lichens: a fungus provides structure and water, the alga or cyanobacterium provides sugar. Also Rhizobium and legumes, corals and their zooxanthellae.
    topic_code: "8.5"
  - front: Commensalism → example and why it is hard to prove
    back: |
      A bird nesting in a tree gains shelter while the tree is unaffected. Proving that the second partner is truly unaffected, rather than slightly helped or harmed, is difficult, so many commensalisms may be weak mutualisms or parasitisms.
    topic_code: "8.5"
  - front: Parasitism → why parasites rarely kill their hosts quickly
    back: |
      A parasite that kills its host loses its home and food; selection favours parasites that take enough to reproduce while the host survives and keeps transmitting them. A tapeworm can live for years in an intestine; Plasmodium uses a mosquito to reach new hosts before the current one dies.
    topic_code: "8.5"
  - front: Foundation species
    back: |
      A species that forms the physical base of a community and so creates habitat for the rest: kelp forming a forest, reef-building corals, trees in a forest. Usually a producer that also brings in most of the energy. Remove it and the community has nowhere to live.
    topic_code: "8.5"
  - front: Keystone species → the Pisaster experiment
    back: |
      A species whose effect on community structure is far larger than its abundance suggests. Removing the sea star Pisaster ochraceus from an intertidal shore let mussels, its main prey, crowd out most other species, cutting species richness roughly in half. Keystones are often predators that keep a dominant competitor in check.
    topic_code: "8.5"
  - front: Trophic cascade → Yellowstone wolves
    back: |
      An effect that passes down a food chain from a top predator. Wolves reintroduced in 1995 reduced elk numbers and changed elk behaviour; willows and cottonwoods along streams recovered; beavers and songbirds returned; stream banks stabilised. The predator's effect reached the plants and the river.
    topic_code: "8.5"
  - front: Species richness vs species evenness
    back: |
      Richness is the number of species present. Evenness is how equally the individuals are shared among them. A community of 10 species with 91% of individuals in one species is rich but uneven; diversity indices combine both, and evenness is what the Simpson's index in week 31 is sensitive to.
    topic_code: "8.5"
  - front: Primary vs secondary succession
    back: |
      Primary: on new land with no soil, such as fresh lava or a retreating glacier; lichens and mosses as pioneer species build soil over centuries. Secondary: after a disturbance that leaves soil, such as fire or farming; grasses and annuals first, then shrubs and pines, then the climax forest, over decades.
    topic_code: "8.5"
  - front: Pioneer species → what they do for the species that follow
    back: |
      Hardy colonisers of bare substrate (lichens, mosses, annual weeds) that tolerate harsh conditions, weather rock, add organic matter and shade, and so create the soil and microclimate that less hardy, longer-lived species need. They are then usually outcompeted by what they made possible.
    topic_code: "8.5"

quiz:
  description: |
    24 questions · about 30 minutes · density-dependent and density-independent regulation, life-history
    strategies and sampling, then community interactions, keystone species and trophic cascades, with a
    sea-star removal data set and a mark-recapture calculation, plus spiral review of population growth,
    natural selection, enzymes, feedback, speciation, genetic drift and carbohydrates. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the two short answers and the long answer are graded by your teacher against the
    acceptable-answer summary.
  questions:
    - slug: u08-w30-q01
      type: multiple_choice
      topic_code: "8.5"
      source: "Biology 2e §45.6 Community Ecology"
      points: 1
      stimulus: |
        An ecologist removed every sea star (Pisaster ochraceus) from an 8 m stretch of rocky intertidal shore once a month for five years and left an adjacent stretch untouched as a control. Each year the number of species of attached animals and algae and the percentage of rock covered by mussels were recorded in both plots.

        | Year | Species in control plot | Species in removal plot | Mussel cover, control (%) | Mussel cover, removal (%) |
        |---|---|---|---|---|
        | 0 | 15 | 15 | 30 | 30 |
        | 1 | 15 | 12 | 32 | 55 |
        | 2 | 15 | 10 | 31 | 70 |
        | 3 | 15 | 8 | 29 | 85 |
        | 5 | 15 | 8 | 30 | 90 |
      prompt: |
        Which conclusion is best supported by the data?
      options:
        - "Pisaster is a keystone species: although it is one of fifteen species, its removal roughly halved the species richness of the plot while the control plot was unchanged."
        - "Mussels are a keystone species, because their cover rose more than any other variable changed."
        - "Species richness in rocky intertidal communities naturally declines over time."
        - "Pisaster is a foundation species, because the other species live on its surface."
      option_explanations:
        - |
          Correct. Richness fell from 15 to 8 only where the sea star was removed, and the control shows the shore itself was stable; a disproportionate effect from one species of modest abundance is the definition of a keystone.
        - |
          Mussels rose because they were released from predation; they are the dominant competitor, not the keystone. A keystone holds the community's structure by its effect, usually by suppressing a dominant like the mussel.
        - |
          The control plot held 15 species for all five years, so the decline cannot be a natural trend; it happened only where the manipulation was applied.
        - |
          A foundation species builds the physical habitat (kelp, corals, trees). Pisaster is a mobile predator; nothing lives on it, and its effect is through what it eats.
      answer: 0
      explanation: |
        A keystone is identified by removal: take it away and the community reorganises far out of proportion to the keystone's biomass. The control plot is what lets you attribute the change to the removal.

    - slug: u08-w30-q02
      type: multiple_choice
      topic_code: "8.5"
      source: "Biology 2e §45.6 Community Ecology"
      points: 1
      stimulus: |
        An ecologist removed every sea star (Pisaster ochraceus) from an 8 m stretch of rocky intertidal shore once a month for five years and left an adjacent stretch untouched as a control. Each year the number of species of attached animals and algae and the percentage of rock covered by mussels were recorded in both plots.

        | Year | Species in control plot | Species in removal plot | Mussel cover, control (%) | Mussel cover, removal (%) |
        |---|---|---|---|---|
        | 0 | 15 | 15 | 30 | 30 |
        | 1 | 15 | 12 | 32 | 55 |
        | 2 | 15 | 10 | 31 | 70 |
        | 3 | 15 | 8 | 29 | 85 |
        | 5 | 15 | 8 | 30 | 90 |
      prompt: |
        Which mechanism best explains why species richness fell when the sea stars were removed?
      options:
        - "Freed from predation, mussels spread across the rock and competitively excluded the barnacles, algae and other species that need bare rock to settle on."
        - "The sea stars had been protecting the other species from the cold, and without them the other species froze."
        - "The removal of sea stars reduced the amount of light reaching the rock."
        - "Mussels released a toxin that killed the other species once the sea stars were gone."
      option_explanations:
        - |
          Correct. Pisaster eats mussels; without it the mussel population grew until it covered 90% of the surface, and space, the limiting resource on a rocky shore, was taken from everyone else. The predator kept the dominant competitor in check.
        - |
          Sea stars do not insulate anything; and the control plot, with sea stars, experienced the same temperatures as the removal plot, which the data show changed.
        - |
          Removing a mobile predator does not alter light; the physical environment of the two adjacent plots was the same, so a physical explanation cannot account for the difference.
        - |
          Mussels compete for space by growing over it, not by poisoning. Inventing a toxin ignores the clear link in the table between rising mussel cover and falling richness.
      answer: 0
      explanation: |
        Predation can increase diversity. By eating the species that would otherwise win the competition for space, the keystone predator leaves room for the weaker competitors, and the community stays rich.

    - slug: u08-w30-q03
      type: multiple_choice
      topic_code: "8.5"
      source: "Biology 2e §45.6 Community Ecology"
      points: 1
      stimulus: |
        An ecologist removed every sea star (Pisaster ochraceus) from an 8 m stretch of rocky intertidal shore once a month for five years and left an adjacent stretch untouched as a control. Each year the number of species of attached animals and algae and the percentage of rock covered by mussels were recorded in both plots.

        | Year | Species in control plot | Species in removal plot | Mussel cover, control (%) | Mussel cover, removal (%) |
        |---|---|---|---|---|
        | 0 | 15 | 15 | 30 | 30 |
        | 1 | 15 | 12 | 32 | 55 |
        | 2 | 15 | 10 | 31 | 70 |
        | 3 | 15 | 8 | 29 | 85 |
        | 5 | 15 | 8 | 30 | 90 |
      prompt: |
        If the ecologist had instead removed all the mussels every month and left the sea stars, which outcome would the model of this community predict?
      options:
        - "Species richness would stay high or rise slightly, because the dominant competitor for space is gone and the sea stars would switch to other prey."
        - "Species richness would fall to zero, because the mussels are the base of the food web."
        - "The sea stars would go extinct immediately, because they eat only mussels."
        - "Mussel cover in the control plot would rise to 90% to compensate."
      option_explanations:
        - |
          Correct. Mussels are the species that excludes others when unchecked; removing them removes that pressure entirely, and Pisaster feeds on barnacles, limpets and snails as well, so the predator would persist at lower numbers.
        - |
          Mussels are filter feeders, not producers; the algae, plankton and detritus at the base of this food web do not depend on them. Richness depends on space being available, which removing mussels increases.
        - |
          Pisaster has a broad diet; prey switching is routine for generalist predators. A decline in sea star numbers is plausible, immediate extinction is not.
        - |
          Plots are independent; a manipulation in one plot has no effect on the other. That independence is exactly why the control is informative.
      answer: 0
      explanation: |
        Good data questions ask you to run the model forward. Here the model is: predator suppresses dominant competitor, which preserves space for the rest. Remove the competitor and the rest keep their space.

    - slug: u08-w30-q04
      type: true_false
      topic_code: "8.5"
      source: "Biology 2e §45.6 Community Ecology"
      points: 1
      stimulus: |
        An ecologist removed every sea star (Pisaster ochraceus) from an 8 m stretch of rocky intertidal shore once a month for five years and left an adjacent stretch untouched as a control. Each year the number of species of attached animals and algae and the percentage of rock covered by mussels were recorded in both plots.

        | Year | Species in control plot | Species in removal plot | Mussel cover, control (%) | Mussel cover, removal (%) |
        |---|---|---|---|---|
        | 0 | 15 | 15 | 30 | 30 |
        | 1 | 15 | 12 | 32 | 55 |
        | 2 | 15 | 10 | 31 | 70 |
        | 3 | 15 | 8 | 29 | 85 |
        | 5 | 15 | 8 | 30 | 90 |
      prompt: |
        True or false: Because richness in the removal plot stopped falling after year 3, the data show that the sea stars had returned and restored the community.
      answer: false
      explanation: |
        False. The sea stars were removed every month for all five years, so they did not return; the plateau at 8 species means the community reached a new, poorer equilibrium in which the mussel bed and the few species that can live on or among mussels persist. A plateau after a disturbance is a new steady state, not a recovery, unless the data show richness climbing back toward the control.

    - slug: u08-w30-q05
      type: multiple_choice
      topic_code: "8.4"
      source: "Biology 2e §45.4 Population Dynamics and Regulation"
      points: 1
      prompt: |
        In the intestinal roundworm Ascaris, the number of eggs produced per female falls steeply as the number of worms per host rises, then levels off above about 30 to 50 worms. What kind of regulation does this illustrate, and why?
      options:
        - "Density-dependent regulation: each female's fecundity falls as the density of worms rises, so per-capita reproduction depends on N."
        - "Density-independent regulation: the host's immune system kills worms whatever their number."
        - "Exponential growth: the eggs produced per female are constant, so the population grows without limit."
        - "A density-independent event, because parasites are not affected by their own numbers."
      option_explanations:
        - |
          Correct. The defining feature of a density-dependent factor is that the per-capita effect changes with density; here, more worms per host means fewer eggs per worm.
        - |
          The data are about fecundity changing with worm number; a factor that acted the same at every density would leave eggs per female flat across the graph.
        - |
          Eggs per female are not constant; they fall with density. That is the opposite of the assumption behind exponential growth.
        - |
          The graph shows the parasites are affected by their own numbers; the levelling off is a population approaching a limit set by crowding inside the host.
      answer: 0
      explanation: |
        To classify a factor, ask whether its effect on each individual changes with N. Crowding, competition, predation and disease do; weather and fire do not.

    - slug: u08-w30-q06
      type: multiple_choice
      topic_code: "8.4"
      source: "Biology 2e §45.4 Population Dynamics and Regulation"
      points: 1
      prompt: |
        A wildfire kills 60% of the deer in a dense population and 60% of the deer in a sparse population of the same species nearby. Which prediction about the two populations in the years after the fire is best justified?
      options:
        - "The fire was density-independent, but the dense population will recover faster, because it has more survivors to reproduce and, with density now reduced, per-capita growth is high."
        - "Both populations will recover at the same rate, because the fire killed the same percentage of each."
        - "The sparse population will recover faster, because it has fewer deer competing for food."
        - "Neither population can recover, because wildfire sets a new carrying capacity of zero."
      option_explanations:
        - |
          Correct. Mortality independent of density resets N; what happens next depends on births, and more survivors in the dense population plus relaxed density-dependent limits give a faster absolute rebound.
        - |
          The same percentage killed leaves very different numbers of survivors; growth in individuals per year is rmax × N, so the larger remaining N grows faster in absolute terms.
        - |
          The sparse population's per-capita rate may be similar, but it starts from fewer individuals; dN/dt depends on N as well as on r.
        - |
          Fire often raises carrying capacity for deer by opening the canopy and stimulating browse; it is a disturbance, not a permanent loss of habitat.
      answer: 0
      explanation: |
        Density-independent and density-dependent factors act together: the first sets how many survive, the second governs how fast the survivors grow back.

    - slug: u08-w30-q07
      type: multiple_choice
      topic_code: "8.4"
      source: "Biology 2e §45.4 Population Dynamics and Regulation"
      points: 1
      prompt: |
        A dandelion produces hundreds of tiny wind-borne seeds within weeks of germinating; an oak waits about 20 years, then drops thousands of large acorns each year for a century. Which statement correctly places the two on the r/K continuum and explains the difference?
      options:
        - "The dandelion is r-selected and the oak K-selected: in disturbed, unpredictable habitats many cheap offspring win, while in a stable forest near carrying capacity a few well-provisioned offspring that can compete win."
        - "The dandelion is K-selected because it reaches carrying capacity quickly, and the oak is r-selected because it produces so many acorns."
        - "Both are r-selected, because both produce many seeds."
        - "Both are K-selected, because both are plants and plants cannot disperse."
      option_explanations:
        - |
          Correct. The trade-off is between number of offspring and investment per offspring; which side wins depends on whether the environment rewards rapid colonisation or competitive ability.
        - |
          Reaching K quickly is not what K-selected means; it refers to living near K under stable conditions and investing in competitive offspring. Seed number alone does not define r-selection either; the oak's acorns are large and energy-rich, and the tree delays reproduction for decades.
        - |
          The oak's late maturity, long life and large, energy-rich seeds are K-selected traits even though acorns are numerous; r versus K is about the whole life history, not one trait.
        - |
          Plants disperse by seed, and the dandelion's life history (early maturity, short life, many small seeds) is the textbook r-selected pattern.
      answer: 0
      explanation: |
        r and K describe a trade-off, not a rule. Ask what the environment rewards: rapid growth from low density (r) or competitive ability at high density (K).

    - slug: u08-w30-q08
      type: multiple_choice
      topic_code: "8.5"
      source: "Biology 2e §45.6 Community Ecology"
      points: 1
      prompt: |
        Grown separately on the same bacterial food, Paramecium aurelia and Paramecium caudatum each reach a stable population. Grown together, P. aurelia reaches a stable population while P. caudatum declines to extinction within about two weeks. Which principle do the results illustrate, and what is the key condition?
      options:
        - "Competitive exclusion: two species using the same limiting resource in the same way cannot coexist indefinitely, and the superior competitor eliminates the other."
        - "Predation: P. aurelia eats P. caudatum when the two are mixed."
        - "Mutualism: P. aurelia benefits from the presence of P. caudatum."
        - "Resource partitioning: the two species divided the food between them."
      option_explanations:
        - |
          Correct. Both species need the same food and get it the same way, so their niches overlap completely; the one that converts food into offspring faster wins, and the other has no refuge.
        - |
          Both species feed on bacteria; neither eats the other. The decline of P. caudatum is from losing a competition for food, not from being consumed.
        - |
          P. caudatum goes extinct in the mixed culture, so it certainly did not benefit, and P. aurelia reaches the same level alone as in competition, so it did not benefit either.
        - |
          Partitioning is what allows coexistence; the outcome here is the opposite. Had the two species used different food or fed at different times, both would have persisted.
      answer: 0
      explanation: |
        Competitive exclusion is the null outcome of complete niche overlap. Coexisting species in nature are coexisting because they have partitioned the resource in some way.

    - slug: u08-w30-q09
      type: multiple_choice
      topic_code: "8.4"
      source: "Biology 2e §45.6 Community Ecology"
      points: 1
      prompt: |
        Trapping records show snowshoe hare numbers rising and falling on a roughly ten-year cycle, with lynx numbers following the same cycle but peaking one to two years after the hares. Which explanation accounts for the lag?
      options:
        - "Lynx reproduction responds to food supply, so lynx numbers rise only after hares have become abundant; the enlarged lynx population then drives hares down, and lynx starve and decline a year or two after the hares crash."
        - "Lynx cause the hare cycle by migrating into the area every ten years."
        - "The hares and lynx are responding independently to a ten-year climate cycle, and the lag is coincidence."
        - "Hares eat young lynx, so hare peaks suppress lynx until the hares decline."
      option_explanations:
        - |
          Correct. Predator numbers track prey with a delay because it takes time to turn extra food into extra predators, and time for starvation to remove predators once prey are scarce; the delay is what makes the two curves offset.
        - |
          Lynx are resident; the cycle is in births and deaths, not in arrivals. Migration would not produce the consistent one-to-two-year lag.
        - |
          A shared external driver would make the two species peak together, not with a consistent lag in a fixed order; the lag is the signature of predator depending on prey.
        - |
          Hares are herbivores and never eat lynx; the direction of consumption is lynx eating hares, which is why hare declines precede lynx declines.
      answer: 0
      explanation: |
        Predation is a density-dependent factor with a time delay built in, and delays in negative feedback produce oscillation. Hare-plant interactions and food quality contribute, but the lag between the two curves is the predator-prey signature.

    - slug: u08-w30-q10
      type: multi_select
      topic_code: "8.5"
      source: "Biology 2e §45.6 Community Ecology"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following interactions are correctly classified? Select all that apply.
      options:
        - "Protozoa in a termite's gut digest cellulose for the termite and receive shelter and food: mutualism (+/+)."
        - "A bird builds its nest in a tree, gaining shelter while the tree is unaffected: commensalism (+/0)."
        - "A tapeworm absorbs nutrients from a human intestine for years without killing its host: parasitism (+/−)."
        - "A lynx kills and eats a snowshoe hare: mutualism, because the lynx benefits and the hare population is kept healthy."
        - "Two warbler species feed on insects in different parts of the same spruce tree: competitive exclusion."
      option_explanations:
        - |
          Correct. Both partners gain: the termite can use wood as food and the protozoa get a protected, food-rich habitat.
        - |
          Correct. The bird benefits and the tree neither gains nor loses measurably, the textbook commensalism.
        - |
          Correct. The parasite gains and the host loses nutrients and health; that the host survives is typical of parasitism, not a reason to reclassify it.
        - |
          Predation is +/− for the individuals involved; the hare that is eaten does not benefit. Effects on the prey population are a separate question from the classification of the interaction.
        - |
          Feeding in different parts of the tree is resource partitioning, which allows coexistence; competitive exclusion is the outcome when partitioning does not occur and one species is eliminated.
      answer: [0, 1, 2]
      explanation: |
        Classify by the sign of the effect on each partner's fitness: +/+ mutualism, +/0 commensalism, +/− parasitism or predation, −/− competition. Population-level side effects do not change the sign for the individual.

    - slug: u08-w30-q11
      type: multi_select
      topic_code: "8.4"
      source: "Biology 2e §45.4 Population Dynamics and Regulation"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are density-dependent limits on population growth? Select all that apply.
      options:
        - "A fungal disease that spreads faster through a crowded roost of bats"
        - "An unusually cold winter that kills half the insects in a field regardless of how many there were"
        - "Competition for nest sites that leaves more birds without a territory as the population grows"
        - "A volcanic eruption that buries a valley"
        - "Predators that concentrate their hunting on the most abundant prey species"
      option_explanations:
        - |
          Correct. Transmission depends on contact rate, which rises with density, so each bat's risk of infection grows as the roost fills.
        - |
          A cold snap removes the same proportion whatever the density; its per-capita effect does not depend on N, so it is density-independent.
        - |
          Correct. With a fixed number of sites, the fraction of birds that fail to breed rises with N, a per-capita effect that depends on density.
        - |
          An eruption kills everything in its path regardless of how many organisms were there; the proportion lost does not depend on population density.
        - |
          Correct. Prey switching means per-capita predation risk rises for a species as it becomes more abundant, a classic density-dependent effect.
      answer: [0, 2, 4]
      explanation: |
        The test is per-capita: does each individual's chance of dying or failing to reproduce change as the population gets denser? Biotic factors usually pass the test; abiotic disasters usually do not.

    - slug: u08-w30-q12
      type: fill_blank
      topic_code: "8.5"
      source: "Biology 2e §45.6 Community Ecology"
      points: 1
      prompt: |
        The principle that two species cannot indefinitely occupy the same niche in the same habitat, demonstrated when Paramecium aurelia eliminated P. caudatum in mixed culture, is called the ____ principle.
      answer: ["competitive exclusion", "competitive exclusion principle", "Gause's"]
      explanation: |
        Competitive exclusion follows from the logistic model applied to two species sharing one limiting resource: the one with the higher growth rate on that resource drives the other's realised growth below zero. "Resource partitioning" is the way species escape exclusion, so it is not accepted here.

    - slug: u08-w30-q13
      type: fill_blank
      topic_code: "8.4"
      source: "Biology 2e §45.4 Population Dynamics and Regulation"
      points: 1
      prompt: |
        A limiting factor whose per-capita effect becomes stronger as a population becomes more crowded, such as competition for food or the spread of disease, is described as ____.
      answer: ["density-dependent", "density dependent"]
      explanation: |
        Density-dependent factors are the mechanism behind carrying capacity: they lower births and raise deaths as N climbs until the two balance. Density-independent factors, such as weather, kill a fixed proportion whatever N is, so they cannot by themselves hold a population at K.

    - slug: u08-w30-q14
      type: numeric
      topic_code: "8.4"
      source: "Biology 2e §45.1 Population Demography"
      points: 1
      prompt: |
        Biologists capture, tag and release 60 turtles from a lake. Two weeks later they capture 90 turtles, of which 15 carry tags. Using the mark-recapture formula, estimate the size of the turtle population.
      answer: { value: 360, tolerance: 1 }
      explanation: |
        N = (marked in first catch × total in second catch) ÷ (marked in second catch) = 60 × 90 ÷ 15 = 360. The logic is a proportion: tagged turtles are 15/90 = 1/6 of the second sample, so the 60 tagged turtles should be 1/6 of the whole population, giving 360. The estimate assumes tags are not lost, tagged animals mix back into the population, and tagged and untagged turtles are equally likely to be caught.

    - slug: u08-w30-q15
      type: short_answer
      topic_code: "8.5"
      source: "general knowledge"
      points: 4
      prompt: |
        Analyze data. Five species of warbler feed on insects in the same spruce trees of a New England forest. An ecologist recorded where in the tree each species spent most of its feeding time.

        | Species | Main feeding zone | Share of feeding time in that zone (%) |
        |---|---|---|
        | Cape May warbler | outer tips of the top branches | 70 |
        | Blackburnian warbler | outer tips of the middle branches | 65 |
        | Black-throated green warbler | inner middle branches | 60 |
        | Bay-breasted warbler | inner lower branches near the trunk | 68 |
        | Yellow-rumped warbler | lowest branches and the ground | 72 |

        (a) Describe the pattern in the table. (b) Explain how this pattern allows five species with similar diets to coexist in one tree without violating the competitive exclusion principle. (c) Distinguish each species' fundamental niche from its realised niche using this example. (d) Predict what would happen to the feeding zone of the Blackburnian warbler if the Cape May warbler disappeared from the forest, and justify.
      answer: |
        Each species concentrates its feeding in a different part of the tree; this resource partitioning means they are not using the same niche, so exclusion does not apply. Fundamental niche: the whole tree each could use; realised niche: the zone it actually uses in the presence of the others. Without the Cape May, the Blackburnian would expand upward into the vacated outer top branches, since competition had confined it.
      explanation: |
        Four points, one per task.

        (a) Describe, 1 pt: each species spends most (60–72%) of its feeding time in a different zone of the tree, from the top outer tips (Cape May) to the ground (Yellow-rumped), so the zones are stacked and barely overlap.

        (b) Explain, 1 pt: the species have partitioned the resource (insects in the tree) by location, so each occupies a different niche; competitive exclusion applies only to species in the same niche, and partitioning reduces interspecific competition enough for all five to persist.

        (c) Distinguish, 1 pt: the fundamental niche is the full range of tree positions a species could use in the absence of the others; the realised niche is the narrower zone it actually uses when the other four are present. Both terms must be defined and tied to the data.

        (d) Predict and justify, 1 pt: the Blackburnian warbler would expand its feeding into the outer top branches (its realised niche would widen toward its fundamental niche), because competition from the Cape May warbler is what had excluded it from that zone. Accept the prediction that another species expands instead if justified by adjacency.

        Zero: saying the warblers "prefer" different zones with no reference to competition; claiming the species are not competing because they are different species.

    - slug: u08-w30-q16
      type: short_answer
      topic_code: "8.4"
      source: "Biology 2e §45.6 Community Ecology"
      points: 4
      prompt: |
        Conceptual analysis. Snowshoe hare numbers in a region of the boreal forest cycle between about 10,000 and 150,000 roughly every ten years, and lynx numbers cycle with them, peaking one to two years later. (a) Identify the type of population-limiting factor that lynx predation represents, and justify. (b) Explain why the lynx peak lags the hare peak. (c) Explain why hare numbers do not simply settle at a carrying capacity. (d) Hares also strip their winter food plants when abundant. Predict how this second factor would affect the cycle if lynx were removed, and justify.
      answer: |
        Density-dependent: predation pressure per hare rises as lynx build up on abundant hares. Lynx need time to convert extra food into offspring, and starve only after hares decline, so their curve trails. The delay in the negative feedback causes overshoot and oscillation rather than a steady K. Without lynx, hares would still cycle, driven by overbrowsing and food recovery, likely with higher peaks and deeper crashes.
      explanation: |
        Four points, one per task.

        (a) Identify and justify, 1 pt: density-dependent, because the number of lynx, and so the predation rate per hare, rises with hare density; a factor whose effect depends on N.

        (b) Explain, 1 pt: lynx numbers respond to food with a delay: extra hares must first be turned into surviving lynx kittens, and when hares crash, lynx die of starvation only after a further interval; the delay produces the one-to-two-year offset.

        (c) Explain, 1 pt: a negative feedback with a time delay overshoots: lynx keep increasing after hares have begun to fall, driving hares far below the level that would balance, and then hares rebound while lynx are still scarce; the system oscillates around K rather than settling on it.

        (d) Predict and justify, 1 pt: hares would still cycle, because overbrowsing (a density-dependent resource limit with its own delay as plants recover) can produce oscillation on its own; peaks would likely be higher and crashes driven by starvation rather than predation. Accept a prediction of damped or longer cycles if justified by the plant-recovery delay.

        Zero: calling predation density-independent; explaining the lag as "lynx are slower animals"; predicting a flat population without lynx with no reference to the food plants.

    - slug: u08-w30-q17
      type: long_answer
      topic_code: "8.5"
      source: "Biology 2e §47.4 Preserving Biodiversity"
      points: 8
      prompt: |
        Interpreting and evaluating results. Wolves were reintroduced to Yellowstone National Park in 1995 after an absence of about 70 years. Researchers monitored elk (the wolves' main prey), the height of willows along streams (the elk's preferred winter browse), the number of active beaver colonies (beavers depend on willow) and the number of songbird species in streamside willow thickets.

        | Year | Wolves | Elk (thousands) | Mean willow height on stream banks (cm) | Active beaver colonies | Songbird species in willow thickets |
        |---|---|---|---|---|---|
        | 1995 | 14 | 17 | 40 | 1 | 6 |
        | 1999 | 72 | 14 | 60 | 2 | 8 |
        | 2003 | 170 | 11 | 150 | 5 | 12 |
        | 2007 | 170 | 7 | 230 | 9 | 14 |
        | 2011 | 100 | 6 | 260 | 12 | 15 |

        (a) Describe the trends in the data. (b) Explain, step by step, how the reintroduction of a predator could cause the changes in willow height, beaver colonies and songbird species, naming the ecological concept. (c) Researchers also found that elk spent less time grazing in open stream valleys after 1995 even where few were killed. Explain how this behavioural change could contribute to the willow recovery. (d) An alternative explanation is that a wetter climate after 1995 caused the willow recovery. Describe one comparison or piece of evidence that would help distinguish the two explanations. (e) The wolf population fell from 170 to 100 between 2007 and 2011 while elk continued to decline. Propose one explanation consistent with population ecology.
      answer: |
        Wolves rose then fell; elk fell steadily; willow height, beaver colonies and songbird species all rose. Trophic cascade: wolves reduce elk, fewer elk means less browsing, willows grow tall, beavers have food and building material, songbirds get nesting habitat. Fear of predation keeps elk out of open valleys where willows grow, so browsing falls more than elk numbers alone would predict. Compare willow growth in fenced plots or on a nearby range without wolves over the same years. Wolves overshot the prey base and declined with their food; disease or intraspecific conflict can also reduce a dense wolf population.
      explanation: |
        Eight points.

        (a) 1 pt: wolves increased to a peak of 170 by 2003 then declined to 100; elk declined from 17,000 to 6,000; willow height, beaver colonies and songbird richness all rose steadily; at least three trends with numbers.

        (b) 3 pts: 1 pt for naming the trophic cascade (an effect passing down from a top predator through consumers to producers); 1 pt for the chain: more wolves, fewer elk, less browsing on willows, taller willows; 1 pt for extending the chain to other species: tall willows supply beavers with food and dam material, and beaver ponds and willow thickets provide nesting habitat and insects for songbirds, so richness rises.

        (c) 1 pt: predation risk changes prey behaviour (a non-lethal effect): elk avoid open stream valleys where they are easy to catch, so willows there are browsed less even by surviving elk; the recovery is larger than the fall in elk numbers alone would produce.

        (d) 1 pt: any comparison that isolates the predator effect, such as willow growth over the same years in a similar valley without wolves, in fenced exclosures that keep elk out versus unfenced plots inside Yellowstone, or a check of precipitation records against willow height; the comparison must hold climate constant or test it directly.

        (e) 2 pts: 1 pt for a mechanism: wolves, a K-limited predator, overshot the carrying capacity set by a shrinking elk herd, so starvation, lower reproduction or dispersal reduced the pack; accept density-dependent disease (mange, distemper) or conflict between packs; 1 pt for noting that elk could continue to fall because 100 wolves still exert pressure, because elk recovery is slow (K-selected, low rmax), or because other factors (hunting outside the park, drought) also act on elk.

        Zero for a part: listing numbers without stating a direction; explaining the cascade as wolves "protecting" willows directly; attributing the wolf decline to the elk decline with no mechanism; a climate test that does not control for the predator.

    - slug: u08-w30-q18
      type: multiple_choice
      topic_code: "8.3"
      source: "Biology 2e §45.4 Population Dynamics and Regulation"
      points: 1
      prompt: |
        Review. In the logistic equation dN/dt = rmax N (K − N)/K, which biological reality does the factor (K − N)/K represent?
      options:
        - "Density-dependent limits such as competition, predation and disease, whose per-capita effect grows as N approaches K and reduces the realised growth rate toward zero."
        - "Density-independent events such as storms, which remove a fixed fraction of the population."
        - "The intrinsic rate of increase of the species, which is fixed by its genome."
        - "Immigration from neighbouring populations, which adds individuals as N rises."
      option_explanations:
        - |
          Correct. The factor is the unused fraction of the carrying capacity; biologically it is the sum of density-dependent pressures that rise with crowding, and it is why the curve bends into an S.
        - |
          Density-independent mortality does not depend on N and so cannot be represented by a term that changes with N; the model treats such events as resetting N, not as part of the equation.
        - |
          rmax is a separate constant in the equation; the (K − N)/K factor is what scales it down as the population fills its environment.
        - |
          The basic logistic model treats the population as closed; immigration would be an added term and would not shrink as N approaches K.
      answer: 0
      explanation: |
        Week 29 gave the equation; this week gives its meaning. Every density-dependent factor you can name is hidden inside (K − N)/K.

    - slug: u08-w30-q19
      type: multiple_choice
      topic_code: "7.2"
      source: "Biology 2e §45.6 Community Ecology"
      points: 1
      prompt: |
        Review. Strawberry poison dart frogs are brilliantly coloured and highly toxic. Which account of how such aposematic coloration could evolve by natural selection is correct?
      options:
        - "Predators that attacked a conspicuous toxic frog learned to avoid that pattern, so brightly coloured toxic individuals were attacked less often and left more offspring than duller toxic individuals."
        - "The frogs chose bright colours to warn predators, and the choice was inherited."
        - "Bright colours attract predators, so the trait must have spread by genetic drift against selection."
        - "The toxin produces the colour as a by-product, so colour was never under selection."
      option_explanations:
        - |
          Correct. Selection acts on heritable variation in colour; where predators learn, a conspicuous and memorable pattern on a toxic animal raises survival, so the alleles for it increase in frequency.
        - |
          Organisms do not choose traits and acquired choices are not inherited; this is the Lamarckian error. Variation arose by mutation and was sorted by predator behaviour.
        - |
          Drift is random and weak in large populations; a trait that consistently raises survival spreads by selection, and the data on predator learning show conspicuousness is an advantage once toxicity is present.
        - |
          Colour and toxin are separate traits with separate genetic bases; the pairing is the product of selection, since bright colour on a non-toxic frog would be fatal.
      answer: 0
      explanation: |
        Community interactions are the selective pressures of Unit 7 seen from the other side: predators shape prey colour, prey shape predator speed, parasites shape host immunity.

    - slug: u08-w30-q20
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. A heat wave raises a shallow pond to 38 °C and most of its trout die within days while nearby carp survive. Which explanation links this density-independent event to cell biology?
      options:
        - "Trout enzymes have a lower optimum temperature; above it they begin to denature and metabolic reactions fail, and warm water also holds less dissolved oxygen for a species with high oxygen demand."
        - "Heat causes the trout's DNA to mutate rapidly, which kills them."
        - "Trout cannot swim in warm water because it is less dense."
        - "Carp survive because they are endotherms and regulate their body temperature."
      option_explanations:
        - |
          Correct. Each species' enzymes are adapted to a temperature range; past the optimum, weak bonds holding the active site's shape break, rates fall and the fish's oxygen demand outruns the supply in warm, oxygen-poor water.
        - |
          Heat at 38 °C does not cause rapid mutation; the lethal effect is on protein shape and function, which is immediate and reversible only within limits.
        - |
          Warm water is slightly less dense but still supports a fish; buoyancy is not the problem, metabolism is.
        - |
          All fish are ectotherms; carp survive because their enzymes and oxygen demands are adapted to warmer, stiller water, not because they regulate body temperature.
      answer: 0
      explanation: |
        Abiotic limits on where a species lives are ultimately limits on its proteins. Temperature is density-independent in its action but it kills through the enzyme chemistry of Unit 3.

    - slug: u08-w30-q21
      type: multiple_choice
      topic_code: "4.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. A predator-prey cycle in which more prey leads to more predators, which leads to fewer prey, which leads to fewer predators, is best described as which kind of control system?
      options:
        - "Negative feedback with a time delay: each change triggers a response that opposes it, and the delay in the response causes the system to oscillate rather than settle."
        - "Positive feedback: each increase in prey causes a further increase in prey."
        - "No feedback: the two populations change independently."
        - "Negative feedback without delay, which is why the populations stay perfectly constant."
      option_explanations:
        - |
          Correct. Predators respond to prey abundance in a direction that reduces it, and prey scarcity reduces predators; that is negative feedback, and the lag in each response is what converts a steady state into a cycle.
        - |
          Positive feedback amplifies change in the same direction, as in oxytocin during labour; here each change calls up a response that reverses it.
        - |
          The one-to-two-year lag between the two curves shows that each population's change depends on the other's; they are coupled, not independent.
        - |
          The populations are not constant, they cycle; it is precisely the delay (time to breed, time to starve) that prevents the feedback from holding them steady.
      answer: 0
      explanation: |
        Homeostasis at the cell and body level and population regulation at the ecosystem level are the same logic: negative feedback stabilises, delay in it makes oscillation, and positive feedback drives a system to a new state.

    - slug: u08-w30-q22
      type: multiple_choice
      topic_code: "7.10"
      source: "Biology 2e §47.1 The Biodiversity Crisis"
      points: 1
      prompt: |
        Review. Lake Victoria once held about 500 species of cichlid fish, descended from a few ancestors, each specialised to eat plankton, scrape algae, crush snails, or prey on other fishes' eggs. Which process produced this diversity, and how does it relate to the niche concept?
      options:
        - "Adaptive radiation: a single lineage diversified into many species as populations specialised on different food resources, each occupying a different niche and so avoiding competitive exclusion."
        - "Convergent evolution: unrelated fish species evolved to look alike because they lived in one lake."
        - "Genetic drift alone: random changes split the lineage into species with no relation to feeding."
        - "Artificial selection by local fishermen for different body forms."
      option_explanations:
        - |
          Correct. Rapid speciation from one ancestor into many niches is adaptive radiation; the specialisations that distinguish the species are resource partitioning written into their anatomy.
        - |
          Convergence is unrelated lineages becoming similar; the cichlids are a single clade that became different, the opposite pattern.
        - |
          The specialisations track food resources too closely to be random; selection on feeding apparatus in different niches, with reproductive isolation, drove the radiation, even if drift contributed.
        - |
          The radiation took place over thousands of years before intensive fishing and produced wild feeding specialists, not bred forms.
      answer: 0
      explanation: |
        Speciation and community ecology meet at the niche: open resources invite specialisation, specialisation becomes isolation, and the result is a community of partitioned species. Week 31 returns to what happened when the Nile perch was introduced.

    - slug: u08-w30-q23
      type: true_false
      topic_code: "7.4"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. True or false: A density-independent disaster that reduces a population from 10,000 to 50 individuals makes the population more vulnerable to genetic drift, so allele frequencies in the survivors and their descendants may change by chance alone.
      answer: true
      explanation: |
        True. Drift is strongest in small populations; a bottleneck of 50 individuals carries only a sample of the original alleles, and chance in who survives and who breeds can fix or lose alleles regardless of fitness. The population may rebound in numbers (Unit 8) while remaining genetically depleted (Unit 7), which is why conservation biologists worry about more than head counts.

    - slug: u08-w30-q24
      type: fill_blank
      topic_code: "1.4"
      source: "Biology 2e §45.6 Community Ecology"
      points: 1
      prompt: |
        Review. Termites depend on protozoa in their guts because the protozoa produce enzymes that hydrolyse ____, the β-linked glucose polymer of plant cell walls, which the termite's own enzymes cannot digest.
      answer: ["cellulose"]
      explanation: |
        Cellulose is made of glucose joined by β 1-4 linkages, which animal amylases cannot break; only certain microbes make cellulase. The termite-protozoa mutualism, like the cow-rumen partnership, is a community interaction built on a Unit 1 fact about carbohydrate structure. "Starch" is not accepted: starch is α-linked and termites can digest it themselves.
