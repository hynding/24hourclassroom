week: 32
unit: 8
title: Synthesis and Cumulative Data
topics: ["8.1", "8.2", "8.3", "8.4", "8.5", "8.6", "8.7"]
guide: guides/week-32.md
guide_description: |
  The unit's synthesis week: the five formula-sheet tools (dN/dt in both forms, Simpson's index, chi-square,
  standard error) applied to whole-course data sets, a map of where each Unit 8 idea connects back to Units
  1 to 7, and the habits of mind the exam rewards on data and free-response items. Three worked examples
  (a deer-exclosure experiment read with Simpson's index and a chi-square, a nutrient-addition lake experiment,
  a life table turned into a survivorship curve), misconceptions, self-check.
flashcards_description: |
  30 cards: the equations and critical values, "given this data, what do you say" cards for every kind of
  ecology figure, and one card for each link between Unit 8 and an earlier unit.

flashcards:
  - front: The AP formula sheet for Unit 8 → the equations to know cold
    back: |
      Population growth dN/dt = B − D; exponential dN/dt = rmax N; logistic dN/dt = rmax N (K − N)/K; Simpson's diversity index 1 − Σ (n/N)²; chi-square χ² = Σ (o − e)²/e; standard error SE = s/√n; mean, median, mode and standard deviation. Know what each symbol is before the exam, because the sheet gives symbols, not definitions.
    topic_code: "8.3"
  - front: Reading a J-curve vs an S-curve → what to say about each
    back: |
      J: growth rate rises with N, no resource limit yet, dN/dt = rmax N; say "exponential, resources not yet limiting". S: increments rise then fall, plateau at K, dN/dt = rmax N (K − N)/K; say "logistic, density-dependent factors reduce per-capita growth as N approaches K". Name the phase the question is about.
    topic_code: "8.3"
  - front: Chi-square critical values at p = 0.05 → df 1, 2 and 3
    back: |
      df 1: 3.84. df 2: 5.99. df 3: 7.81. Degrees of freedom are categories minus one. Calculated value above the critical value: reject the null hypothesis. Below it: fail to reject. The expected values come from the hypothesis (equal chambers, a 3:1 ratio, Hardy-Weinberg), never from the observed data.
    topic_code: "8.1"
  - front: Standard error of the mean → formula and the error-bar rule
    back: |
      SE = s/√n, where s is the sample standard deviation and n the sample size. A 95% confidence interval is about the mean ± 2 SE. Larger samples give smaller error bars. If two means' 2-SE bars do not overlap, the difference is likely real; if they overlap substantially, the data do not support a difference.
    topic_code: "8.3"
  - front: Given overlapping 95% error bars → what can you conclude?
    back: |
      That the data do not provide evidence of a difference between the groups, not that the groups are the same. The honest conclusion is "no significant difference detected"; a larger sample might reveal one. Never write "proves".
    topic_code: "8.6"
  - front: Given a population that overshoots and crashes → the explanation to give
    back: |
      The population grew near rmax past the carrying capacity because density-dependent limits act with a delay; it consumed its resource faster than the resource renewed, so K itself fell, deaths exceeded births (negative (K − N)/K) and N dropped below the original K. Name the resource, the delay, and the density-dependent factor.
    topic_code: "8.4"
  - front: Given two species' resource-use data → predicting coexistence
    back: |
      Large overlap in a limiting resource: expect competitive exclusion of the weaker competitor, or a shrinking of its realised niche. Small overlap, or overlap in a non-limiting resource: coexistence by resource partitioning. Ask whether the shared resource is limiting before predicting exclusion.
    topic_code: "8.5"
  - front: Given energy values for four trophic levels → the three things to do
    back: |
      Calculate the transfer efficiency between the levels asked (upper ÷ lower × 100); account for the loss (respired as heat, not consumed, egested to decomposers); and apply the efficiency once more to say whether another level could be supported. Check whether a producer value is gross or net before dividing.
    topic_code: "8.2"
  - front: Given a Simpson's index that fell with no species lost → the explanation
    back: |
      Evenness fell: one species' share grew (released from a predator or competitor, or favoured by a disturbance), so its squared term dominates Σ (n/N)². Richness is unchanged; dominance is what the index is reporting. Expect species loss to follow if the dominance continues.
    topic_code: "8.6"
  - front: Given an unchanged control and a changed treatment → the inference
    back: |
      The change is attributable to the treatment, because the control experienced everything else (weather, time, observers) and did not change. Without a control, a change over time cannot be separated from the background. Always say what the control rules out.
    topic_code: "8.5"
  - front: Mark-recapture assumptions → what breaks the estimate
    back: |
      Marks must not be lost or kill the animal; marked animals must mix back in; marked and unmarked must be equally catchable; no births, deaths or migration between samples. Trap-shy marked animals make the second sample under-marked and N overestimated; trap-happy ones do the reverse.
    topic_code: "8.4"
  - front: Life table → how to tell the survivorship type from the numbers
    back: |
      Look at where most of the 1,000 die. Most deaths in the last intervals, Type I (Dall sheep, humans). A similar fraction of survivors dying in every interval, Type II (many birds). Most of the cohort dead in the first interval, Type III (fish, trees). Mortality rate per interval = deaths ÷ survivors at its start.
    topic_code: "8.4"
  - front: Carbon cycle ↔ Unit 3 → which processes are the arrows
    back: |
      The arrow from atmosphere to organisms is photosynthesis (Calvin cycle fixing CO₂ with ATP and NADPH from the light reactions); the arrow back is cellular respiration (glycolysis, Krebs cycle, oxidative phosphorylation releasing CO₂). GPP is photosynthesis at ecosystem scale; the GPP − NPP gap is producer respiration.
    topic_code: "8.2"
  - front: Nitrogen cycle ↔ Unit 1 → why bacteria are needed
    back: |
      N₂ is held by a triple bond that only prokaryotic nitrogenase can break, so fixation is the cycle's bottleneck. Nitrogen matters because every amino acid and nucleotide contains it. The Unit 1 fact about bond strength explains the Unit 8 fact that nitrogen limits growth in most terrestrial ecosystems.
    topic_code: "8.2"
  - front: Water potential ↔ biogeography → how osmoregulation sets range limits
    back: |
      A freshwater fish gains water and excretes dilute urine; a marine fish loses water and drinks; an estuary mussel closes up and respires anaerobically when salinity drops. The water-potential rules of Unit 2 decide which salinity a species can tolerate, and salinity is one of the abiotic factors that bound its distribution.
    topic_code: "8.7"
  - front: Surface-to-volume ratio ↔ metabolic rate ↔ energy pyramid → the link
    back: |
      Small organisms have a large surface-to-volume ratio, lose heat fast, and so have a high metabolic rate per gram; endotherms respire most of what they assimilate as heat. That is why net production efficiency is low in warm-blooded consumers and why so little energy climbs each trophic step.
    topic_code: "8.2"
  - front: Signal transduction ↔ pheromones and courtship → the link
    back: |
      A pheromone or a visual display is a signal between organisms; inside the receiver it is a ligand binding a receptor and triggering a transduction pathway whose output is a behaviour. Unit 4's receptor-cascade-response model applies to every communication question in Unit 8.
    topic_code: "8.1"
  - front: Negative feedback ↔ predator-prey cycles → the link
    back: |
      More prey, more predators, fewer prey, fewer predators: each change provokes a response that opposes it, which is negative feedback, and the breeding and starvation delays make it oscillate rather than settle. Homeostasis in Unit 4 and population regulation in Unit 8 share one logic.
    topic_code: "8.4"
  - front: Natural selection ↔ invasive species → why natives lack defences
    back: |
      Defences evolve only against pressures a population has experienced; island birds that never met a snake had no selection for snake avoidance. An invader also arrives without its own enemies. Both facts are Unit 7 selection history explaining a Unit 8 outcome.
    topic_code: "8.7"
  - front: Hardy-Weinberg ↔ a bottleneck after a disruption → the link
    back: |
      A density-independent disaster that cuts a population to a few survivors leaves a small, non-random sample of alleles; drift then changes frequencies by chance and heterozygosity falls. The population can recover in numbers while remaining genetically depleted and less able to adapt to the next disruption.
    topic_code: "8.7"
  - front: Enzymes ↔ temperature limits on where species live → the link
    back: |
      Few organisms survive below 0 °C or above 45 °C because their enzymes denature or freeze; each species' enzymes have an optimum range. Temperature is the main abiotic factor defining biomes, and its action on populations is density-independent but its mechanism is protein chemistry.
    topic_code: "8.7"
  - front: Photosynthesis ↔ coral bleaching → the link
    back: |
      Reef corals get most of their energy from sugars made by zooxanthellae living in their tissue. Heat stress makes the coral expel the algae; bleached coral has lost its primary producer and starves unless the water cools. A climate disruption acting through a photosynthetic mutualism.
    topic_code: "8.7"
  - front: Density-dependent vs density-independent → the one-question test
    back: |
      Ask whether each individual's chance of dying or failing to breed changes with how crowded the population is. Yes (competition, predation, disease, waste): density-dependent, and it can regulate toward K. No (weather, fire, flood, eruption): density-independent, and it resets N without regard to K.
    topic_code: "8.4"
  - front: Keystone vs foundation vs dominant species → telling them apart
    back: |
      Dominant: the most abundant or highest-biomass species (the mussels on a shore). Foundation: builds the physical habitat (kelp, coral, trees). Keystone: effect on the community far larger than its abundance, usually a predator that keeps the dominant in check (Pisaster, wolves). Remove each and ask what happens.
    topic_code: "8.5"
  - front: Resistance vs resilience → telling them apart on a graph
    back: |
      Plot a community property against time across a disturbance. Resistance is how little the line dips; resilience is how quickly it returns to the pre-disturbance level. A diverse community shows a small dip and a fast return; a monoculture shows a deep dip and a slow or incomplete return.
    topic_code: "8.6"
  - front: Proximate vs ultimate → the test question
    back: |
      Ask "how" and "why". How does the behaviour happen (cue, hormone, circuit, learning)? That is proximate. Why did individuals who did it leave more offspring? That is ultimate. An exam answer that gives only one is half an answer when the prompt says "explain the behaviour".
    topic_code: "8.1"
  - front: Innate vs learned → the test question
    back: |
      Ask whether a naive individual performs the behaviour correctly on first exposure. Yes: innate (taxis, kinesis, fixed action pattern, web-building). No, it depends on experience: learned (habituation, imprinting, conditioning, cognition). The capacity to learn is inherited; the content is not.
    topic_code: "8.1"
  - front: The numbers of Unit 8 worth memorising
    back: |
      Transfer efficiency about 10% (range 5–20%); χ² critical 3.84 for df 1; CO₂ 180–300 ppm in ice cores, 280 ppm in 1750, over 400 now; 2.5% of water fresh, 0.3% of that in lakes and rivers; 78% of air N₂; Silver Springs GPP 20,810 and NPP 7,633 kcal/m²/yr; hotspots 2.3% of land, 42% of vertebrates; 500 cichlids, 200 lost.
    topic_code: "8.7"
  - front: Free-response verbs → what each one requires
    back: |
      Describe: state the pattern with numbers from the data. Explain: give the mechanism, cause to effect. Predict: state what will happen. Justify: say why, using a concept or the data. Identify: name it. Calculate: show the set-up and the answer with units. Each verb is a separate point; answer each with its own sentence.
    topic_code: "8.3"
  - front: Designing an ecology experiment → the checklist
    back: |
      A null hypothesis; one independent variable; a control that differs only in that variable; replicates (several quadrats, several chambers); a measurable dependent variable; a statistical decision rule (chi-square against the critical value, or non-overlapping 2-SE bars); and a prediction for each outcome. Name every item in the answer.
    topic_code: "8.5"

quiz:
  description: |
    25 questions · about 35 minutes · a synthesis of the whole unit on cumulative data sets: a deer-exclosure
    experiment read with Simpson's index and a chi-square, population growth, energy flow, nutrient cycles,
    keystone effects and climate disruption, with heavier spiral review from Units 1 to 7 (gene regulation,
    Mendelian ratios, phylogeny, osmoregulation, mutation, lipids and energy). Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the
    two short answers and the long answer are graded by your teacher against the acceptable-answer summary.
  questions:
    - slug: u08-w32-q01
      type: numeric
      topic_code: "8.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        Ecologists fenced a 20 m × 20 m plot of forest floor to exclude white-tailed deer and left an identical unfenced plot 50 m away as a control. Both plots had been clear-cut three years earlier. After five years they counted the plants in ten randomly placed 1 m² quadrats in each plot and pooled the counts.

        | Plant group | Inside fence (deer excluded) | Outside fence (deer present) |
        |---|---|---|
        | Oak seedlings | 40 | 8 |
        | Maple seedlings | 30 | 12 |
        | Wildflowers | 25 | 5 |
        | Grasses | 20 | 60 |
        | Ferns | 15 | 15 |
        | Total | 130 | 100 |
      prompt: |
        Calculate Simpson's diversity index, 1 − Σ (n/N)², for the plot outside the fence. Give your answer to two decimal places.
      answer: { value: 0.594, tolerance: 0.015 }
      explanation: |
        Outside: shares 0.08, 0.12, 0.05, 0.60, 0.15; squares 0.0064, 0.0144, 0.0025, 0.36, 0.0225; sum 0.4058; index 1 − 0.4058 = 0.594, about 0.59. For comparison, inside the fence the shares are 0.308, 0.231, 0.192, 0.154, 0.115, the squares sum to 0.222, and the index is 0.78. The grasses' share of 0.60 outside the fence contributes 0.36 on its own, which is why the index differs so much even though both plots contain the same five groups.

    - slug: u08-w32-q02
      type: multiple_choice
      topic_code: "8.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        Ecologists fenced a 20 m × 20 m plot of forest floor to exclude white-tailed deer and left an identical unfenced plot 50 m away as a control. Both plots had been clear-cut three years earlier. After five years they counted the plants in ten randomly placed 1 m² quadrats in each plot and pooled the counts.

        | Plant group | Inside fence (deer excluded) | Outside fence (deer present) |
        |---|---|---|
        | Oak seedlings | 40 | 8 |
        | Maple seedlings | 30 | 12 |
        | Wildflowers | 25 | 5 |
        | Grasses | 20 | 60 |
        | Ferns | 15 | 15 |
        | Total | 130 | 100 |
      prompt: |
        Simpson's index is about 0.78 inside the fence and about 0.59 outside. Which statement is the best interpretation?
      options:
        - "Deer browsing lowers plant diversity by removing the seedlings and wildflowers they prefer, which lets the grasses they avoid dominate; both plots have the same five groups, so the difference is in evenness."
        - "The fence increased richness, because more plant groups grow inside it."
        - "Deer increase diversity by spreading seeds, which is why the outside plot has more grass."
        - "The two indices cannot be compared because the plots have different total counts."
      option_explanations:
        - |
          Correct. Richness is five in both plots; the index differs because deer herbivory shifted the shares, with grasses at 60% outside and no group above 31% inside. Selective herbivory is acting like the reverse of a keystone predator.
        - |
          Both plots contain all five groups; richness is identical. The fence changed the abundance of each group, not the number of groups.
        - |
          Grasses dominate outside because deer eat the seedlings and wildflowers and leave the grass, not because deer disperse grass seed; the data show the browsed groups lower, not higher, outside.
        - |
          The index uses each group's share of its own plot's total, so plots of different size or count are directly comparable; that is the point of using proportions.
      answer: 0
      explanation: |
        Equal richness with unequal indices means the story is evenness. Ask which species a herbivore or predator removes selectively, and the dominance pattern follows.

    - slug: u08-w32-q03
      type: multiple_choice
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        Ecologists fenced a 20 m × 20 m plot of forest floor to exclude white-tailed deer and left an identical unfenced plot 50 m away as a control. Both plots had been clear-cut three years earlier. After five years they counted the plants in ten randomly placed 1 m² quadrats in each plot and pooled the counts.

        | Plant group | Inside fence (deer excluded) | Outside fence (deer present) |
        |---|---|---|
        | Oak seedlings | 40 | 8 |
        | Maple seedlings | 30 | 12 |
        | Wildflowers | 25 | 5 |
        | Grasses | 20 | 60 |
        | Ferns | 15 | 15 |
        | Total | 130 | 100 |
      prompt: |
        To test whether deer affect oak seedlings, a student takes the null hypothesis that oak seedlings should be equally numerous inside and outside the fence, so that the 48 seedlings counted would split 24 and 24. The chi-square value is (40 − 24)²/24 + (8 − 24)²/24 ≈ 21.3. Which conclusion is correct?
      options:
        - "With one degree of freedom the critical value is 3.84; 21.3 exceeds it, so the null hypothesis is rejected and the difference in oak seedlings is unlikely to be due to chance."
        - "With two categories there are two degrees of freedom, the critical value is 5.99, and 21.3 is too large to be a valid chi-square value."
        - "Because 21.3 is greater than 3.84, the null hypothesis is supported."
        - "The test is invalid because the expected values should be 40 and 8, taken from the data."
      option_explanations:
        - |
          Correct. Two categories give df = 1; a calculated value above 3.84 means a split this uneven would arise by chance in fewer than 5% of samples, so the deer effect on oak seedlings is supported.
        - |
          Degrees of freedom are categories minus one, so 2 − 1 = 1, and a chi-square value has no upper limit; a large value simply means a large departure from expectation.
        - |
          A calculated value above the critical value is evidence against the null hypothesis, not for it; the direction of the decision rule is the commonest chi-square error.
        - |
          Expected values must come from the hypothesis being tested, here equal numbers; taking them from the observed counts would make every chi-square zero and the test meaningless.
      answer: 0
      explanation: |
        The chi-square recipe is the same whether the counts are pill bugs, offspring phenotypes or seedlings: expected values from the null, df from the number of categories, compare with the critical value.

    - slug: u08-w32-q04
      type: multiple_choice
      topic_code: "8.5"
      source: "general knowledge"
      points: 1
      stimulus: |
        Ecologists fenced a 20 m × 20 m plot of forest floor to exclude white-tailed deer and left an identical unfenced plot 50 m away as a control. Both plots had been clear-cut three years earlier. After five years they counted the plants in ten randomly placed 1 m² quadrats in each plot and pooled the counts.

        | Plant group | Inside fence (deer excluded) | Outside fence (deer present) |
        |---|---|---|
        | Oak seedlings | 40 | 8 |
        | Maple seedlings | 30 | 12 |
        | Wildflowers | 25 | 5 |
        | Grasses | 20 | 60 |
        | Ferns | 15 | 15 |
        | Total | 130 | 100 |
      prompt: |
        Which prediction about the two plots fifty years from now is best supported by the data and by the model of secondary succession?
      options:
        - "The fenced plot will become a closed oak-maple forest, while the unfenced plot, if deer remain abundant, will stay a grassy opening with few trees, because browsing removes the seedlings that succession depends on."
        - "Both plots will become identical forest, because succession always ends at the same climax community."
        - "The unfenced plot will become forest first, because grasses are pioneer species that prepare the soil for trees."
        - "The fenced plot will remain in its current state, because fences stop succession."
      option_explanations:
        - |
          Correct. Secondary succession proceeds through the recruitment of tree seedlings; a herbivore that removes most of them holds the community at an earlier stage, which is exactly what deer overabundance does in many eastern forests.
        - |
          The climax community depends on conditions, including herbivory; a persistent disturbance such as heavy browsing can hold a site indefinitely at an earlier stage.
        - |
          Grasses were pioneers in both plots after the clear-cut; the question is what happens next, and the trees that would replace them are being eaten outside the fence, not inside.
        - |
          The fence removes a disturbance; it does not stop seedlings growing. The fenced plot is the one on the normal successional path.
      answer: 0
      explanation: |
        Succession is not automatic; it requires the next stage's species to establish. An abundant herbivore, like a keystone predator in reverse, can decide which trajectory a community follows.

    - slug: u08-w32-q05
      type: multiple_choice
      topic_code: "8.3"
      source: "Biology 2e §45.5 Human Population Growth"
      points: 1
      prompt: |
        An age-structure diagram for a country has a very wide base of children and narrows sharply with each older age class. Which prediction about the country's population is best supported?
      options:
        - "Rapid growth for decades to come, because a large cohort has yet to reach reproductive age, so births will exceed deaths even if family size falls."
        - "Immediate decline, because so few people are old."
        - "Zero growth, because the diagram is symmetrical."
        - "Nothing can be predicted, because age structure does not affect birth rate."
      option_explanations:
        - |
          Correct. Age structure carries momentum: the children in the wide base will become parents, so the number of births rises even at a constant or falling fertility rate; this pyramid shape is typical of rapidly growing, less economically developed countries.
        - |
          Few old people reflects past growth and high mortality, not impending decline; the youngest cohorts are the largest, which means more future parents.
        - |
          A pyramid is not a column; a stable population has roughly equal cohorts up to old age, with a rounded top, as in Italy.
        - |
          Birth rate depends directly on how many individuals are of reproductive age, which is what the diagram shows; age structure is one of the main predictors of growth.
      answer: 0
      explanation: |
        Humans obey the same demography as any population: the proportion of reproductive-age individuals sets the birth rate. The world passed 1 billion in 1800, 7 billion in 2012, and age structure is why the growth has momentum.

    - slug: u08-w32-q06
      type: multiple_choice
      topic_code: "8.2"
      source: "Biology 2e §46.2 Energy Flow through Ecosystems"
      points: 1
      prompt: |
        Producing 1,000 kcal of food energy costs about $0.01 as corn but about $0.19 as beef. Which ecological principle best explains the difference?
      options:
        - "Energy is lost at each trophic transfer and cattle are endotherms with low net production efficiency, so far more plant energy, land and resources are needed to produce a kilocalorie of beef than a kilocalorie of grain."
        - "Beef contains more energy per gram than corn, so it must cost more."
        - "Cattle are primary producers that need expensive fertiliser."
        - "The price difference is purely economic and unrelated to energy flow."
      option_explanations:
        - |
          Correct. Eating at the second trophic level means paying for the roughly 90% of plant energy that cattle respire or do not assimilate; a squirrel-like net production efficiency of a few percent makes animal protein energetically expensive.
        - |
          Energy density per gram does not set the cost per kilocalorie; the question already compares equal energy amounts.
        - |
          Cattle are primary consumers; the fertiliser goes on the plants they eat, which is part of why so much input underlies each kilocalorie of beef.
        - |
          The price tracks the land, feed and water consumed, which are set by the energetics of feeding a warm-blooded consumer; economics is reflecting ecology.
      answer: 0
      explanation: |
        The 10% rule has a human consequence: the same land feeds about ten times as many people on grain as on the animals that eat the grain, which is why diet is a lever on carrying capacity.

    - slug: u08-w32-q07
      type: multiple_choice
      topic_code: "8.7"
      source: "Biology 2e §47.3 Threats to Biodiversity"
      points: 1
      prompt: |
        Polar bears hunt seals from sea ice, and Arctic sea-ice coverage has declined since measurements began in the mid-twentieth century. Grizzly bears are meanwhile expanding north into polar bear range, and the first wild grizzly-polar hybrid was documented in 2006. Which pair of consequences of climate change do these observations illustrate?
      options:
        - "Loss of the habitat a specialist depends on, and new contact between formerly separate species that creates competition and hybridisation."
        - "Increased productivity in the Arctic, and the evolution of a new species in a decade."
        - "A density-independent factor that affects polar bears and grizzlies equally, and random genetic drift."
        - "Phenological mismatch between seals and bears, and resource partitioning."
      option_explanations:
        - |
          Correct. The polar bear's range shrinks with its hunting platform, while warming moves a competitor's range poleward; the species meet, compete, and in this case interbreed, a new community interaction created by climate.
        - |
          Warming lowers, not raises, the sea-ice productivity polar bears rely on, and a hybrid is not a new species; the two parent species remain distinct ecological species.
        - |
          The two species are affected in opposite directions, one losing habitat and one gaining; and hybridisation is gene flow between species, not drift within one.
        - |
          The polar bear's problem is the physical loss of ice, not timing; and hybridisation is the opposite of partitioning, which keeps species apart.
      answer: 0
      explanation: |
        Climate change disrupts by moving the boundaries of ranges. Specialists at the edge of a shrinking habitat lose; generalists at the edge of an expanding one gain; where they meet, the community is rewritten.

    - slug: u08-w32-q08
      type: multiple_choice
      topic_code: "8.4"
      source: "Biology 2e §45.1 Population Demography"
      points: 1
      prompt: |
        A life table for Dall mountain sheep follows 1,000 lambs. About 200 die in their first year, then only 10 to 20 die in each year from age 1 to age 7, and from age 8 onward more than 100 die each year until none remain at age 14. Which survivorship pattern does this describe, and what life history does it imply?
      options:
        - "Mainly Type I: once past the vulnerable first year, most sheep survive to old age, consistent with few offspring and substantial parental care."
        - "Type III: most of the cohort dies young, consistent with many offspring and no parental care."
        - "Type II: a constant number dies in every age interval."
        - "No type applies, because the first-year mortality is too high."
      option_explanations:
        - |
          Correct. Apart from the first-year dip, the curve stays nearly flat until old age and then drops, which is the Type I shape of large mammals that invest in each offspring.
        - |
          Type III would lose most of the 1,000 in the first interval and leave a tiny number to survive long; here 800 of 1,000 survive year one and most live past age 8.
        - |
          Deaths per interval here range from about 10 to over 100, not a constant; Type II is the straight-line pattern of many birds.
        - |
          Early vulnerability of the young is common in Type I species (including humans before modern medicine); the overall shape, not the first interval alone, classifies the curve.
      answer: 0
      explanation: |
        Read where the cohort is lost. Late loss is Type I, steady loss is Type II, early loss is Type III, and each maps onto a strategy for how much to invest in each offspring.

    - slug: u08-w32-q09
      type: multi_select
      topic_code: "8.5"
      source: "Biology 2e §47.4 Preserving Biodiversity"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about keystone species and trophic cascades are supported by the Pisaster removal and Yellowstone wolf studies? Select all that apply.
      options:
        - "Removing a predator can lower species richness by allowing its prey to outcompete other species."
        - "A predator's effect can reach the producers and even the physical environment, such as stream banks."
        - "A keystone species is always the most abundant species in its community."
        - "Predators can change prey behaviour, with effects on plants beyond those from the reduction in prey numbers."
        - "Trophic cascades occur only in aquatic ecosystems."
      option_explanations:
        - |
          Correct. Without Pisaster, mussels covered the rock and excluded most other species; richness fell by about half.
        - |
          Correct. Wolves reduced elk browsing, willows recovered, beavers returned and streambanks stabilised: a cascade that reached the landscape.
        - |
          A keystone is defined by the size of its effect relative to its abundance; Pisaster and wolves are both scarce compared with their prey.
        - |
          Correct. Elk avoided open valleys where wolves could catch them, so willows there were browsed less than the fall in elk numbers alone would explain.
        - |
          The intertidal and Yellowstone examples are marine and terrestrial; cascades occur wherever a consumer controls a dominant species at the level below.
      answer: [0, 1, 3]
      explanation: |
        Two studies, one lesson: a scarce predator can determine the structure of a whole community, by what it eats and by what it frightens.

    - slug: u08-w32-q10
      type: multi_select
      topic_code: "8.2"
      source: "Biology 2e §46.3 Biogeochemical Cycles"
      points: 2
      partial_credit: true
      prompt: |
        Which comparisons between the biogeochemical cycles are correct? Select all that apply.
      options:
        - "Carbon and nitrogen both have large atmospheric reservoirs; phosphorus does not."
        - "The nitrogen cycle depends on prokaryotes at its fixation, nitrification and denitrification steps, whereas the carbon cycle's main biological fluxes are photosynthesis and respiration in all kinds of organisms."
        - "Human activity has increased the atmospheric reservoir of carbon by burning fossil fuels and the supply of fixed nitrogen by manufacturing fertiliser."
        - "The water cycle is driven mainly by the energy of decomposers."
        - "Phosphate enters ecosystems mainly through the weathering of rock, which is why phosphorus is often the limiting nutrient in lakes."
      option_explanations:
        - |
          Correct. CO₂ and N₂ are both atmospheric gases; phosphorus occurs as phosphate in rock, soil, water and organisms with no significant gaseous form.
        - |
          Correct. Nitrogenase, nitrifying enzymes and denitrification are bacterial; carbon fixation and respiration occur in plants, animals, fungi and microbes alike.
        - |
          Correct. Both are cases of a flux into the fast cycle at a rate far above the natural return rate, with CO₂ rise and eutrophication as the results.
        - |
          The water cycle is driven by solar energy, which evaporates water from surfaces and drives the winds that carry vapour; decomposers play no role in it.
        - |
          Correct. With no atmospheric source, the slow release from rock sets the supply, so a small addition from fertiliser or sewage produces a large response.
      answer: [0, 1, 2, 4]
      explanation: |
        Compare cycles by three questions: is there an atmospheric reservoir, which organisms do the converting, and what has human activity added. Those three cover every cycle item on the exam.

    - slug: u08-w32-q11
      type: true_false
      topic_code: "8.3"
      source: "Biology 2e §45.5 Human Population Growth"
      points: 1
      prompt: |
        True or false: Humans have repeatedly raised the carrying capacity of their environment through agriculture, technology and public health, but environmental damage from those same activities, such as climate change and soil loss, could lower the carrying capacity in the future.
      answer: true
      explanation: |
        True. The human population took 123 years to add its second billion (1930) and 12 years to add its sixth (1999), because each advance raised K rather than N approaching a fixed limit. The logistic model still applies: K is not a constant, and the activities that raised it (fossil fuels, fertiliser, land conversion) are the same ones degrading the resources K depends on. Projections for 2100 range from 6 to 16 billion precisely because future K is uncertain.

    - slug: u08-w32-q12
      type: true_false
      topic_code: "8.6"
      source: "Biology 2e §47.4 Preserving Biodiversity"
      points: 1
      prompt: |
        True or false: DNA barcoding identifies species by sequencing a short, rapidly evolving region of the mitochondrial gene for cytochrome c oxidase 1 in most eukaryotes, and has revealed species that had been mistaken for a single species.
      answer: true
      explanation: |
        True. About 200,000 named species had been barcoded by 2017; plants, whose mitochondrial gene evolves too slowly, are barcoded with chloroplast genes instead. Barcoding speeds the cataloguing of diversity, which at current description rates would otherwise take about 500 years, and it exposes cryptic sibling species, which matters for conservation because an endemic hidden inside a widespread species can be lost unnoticed.

    - slug: u08-w32-q13
      type: fill_blank
      topic_code: "8.5"
      source: "Biology 2e §45.6 Community Ecology"
      points: 1
      prompt: |
        Lichens and mosses that colonise bare lava, weather the rock and begin to form soil for later plants are called ____ species.
      answer: ["pioneer", "pioneer species"]
      explanation: |
        Pioneer species tolerate the harsh conditions of new or disturbed ground and change it, building soil and shade, so that less hardy, longer-lived species can follow; they are usually outcompeted by the species they made possible. "Keystone" and "foundation" are not accepted: those describe roles in an established community, not the first colonisers of succession.

    - slug: u08-w32-q14
      type: fill_blank
      topic_code: "8.7"
      source: "Biology 2e §44.5 Climate and the Effects of Global Climate Change"
      points: 1
      prompt: |
        Carbon dioxide, methane, water vapour, nitrous oxide and ozone trap infrared radiation emitted by Earth's surface and warm the atmosphere; they are known collectively as ____ gases.
      answer: ["greenhouse", "greenhouse gases"]
      explanation: |
        Greenhouse gases let visible sunlight through to warm the surface and absorb the infrared the surface radiates, re-emitting part of it downward. The effect is natural and keeps Earth habitable; human emissions of CO₂ from fossil fuels and methane from livestock, rice paddies and landfills have strengthened it. "Ozone" alone is not accepted, because it is one of several and the question asks for the group.

    - slug: u08-w32-q15
      type: numeric
      topic_code: "8.3"
      source: "Biology 2e §45.3 Environmental Limits to Population Growth"
      points: 1
      prompt: |
        A culture is started with 50 bacteria that divide every 20 minutes with no limit on resources. How many bacteria are present after 2 hours?
      answer: { value: 3200, tolerance: 0 }
      explanation: |
        Two hours is 120 minutes, which is 120 ÷ 20 = 6 doublings. N = 50 × 2⁶ = 50 × 64 = 3,200. Doubling is exponential growth with a constant per-capita rate; the increase in the last 20 minutes (1,600 cells) is more than the entire population after 100 minutes, which is what a J-curve looks like in numbers. Continue for 24 hours and 50 cells become 50 × 2⁷², about 2 × 10²³ cells weighing roughly 240,000 tonnes, grown from one test tube in a day; resources run out long before that, which is why no population grows exponentially for long.

    - slug: u08-w32-q16
      type: short_answer
      topic_code: "8.6"
      source: "Biology 2e §47.4 Preserving Biodiversity"
      points: 4
      prompt: |
        Apply a model. A conservation agency can protect 100 km² of forest for a population of a large carnivore whose individuals each need a home range of several square kilometres. It must choose between one 100 km² reserve and four separate 25 km² reserves of the same total area, and whether to spend extra money on strips of forest connecting the four. (a) Using the principles of reserve design derived from island biogeography, state which option supports more species and justify. (b) Explain why the shape of a reserve matters, using the idea of edge versus core habitat. (c) Explain what a wildlife corridor does for the carnivore population in genetic terms. (d) Describe one situation in which several smaller reserves would be preferable to one large one.
      answer: |
        One large reserve: it holds more core habitat, supports viable populations of wide-ranging species and more species overall. Compact shapes have less edge, where conditions and predators differ; thin strips are nearly all edge. Corridors allow individuals to move between fragments, maintaining gene flow and preventing inbreeding and drift in small isolated populations. Several reserves are better when they capture different habitats or endemics, or spread the risk of a single disaster or disease.
      explanation: |
        Four points, one per task.

        (a) State and justify, 1 pt: one large reserve; it contains more core habitat and can hold a breeding population of a species needing large home ranges, and larger "islands" of habitat support more species and lower extinction rates. Both the choice and a reason are needed.

        (b) Explain, 1 pt: edges are exposed to different light, wind, predators and invasive species from the surrounding land, so edge habitat supports fewer interior species; a compact square or circle has the least edge for its area, while a long thin reserve is almost all edge.

        (c) Explain, 1 pt: a corridor allows individuals to move between reserves, so the fragments function as one larger population; gene flow prevents the loss of heterozygosity by drift and the inbreeding depression that small, isolated populations suffer. Accept "maintains genetic diversity" with a mechanism.

        (d) Describe, 1 pt: any of: the four sites contain different habitats or different endemic species; separation spreads the risk that one fire, flood or disease outbreak eliminates everything; the species of concern have small home ranges; the single large site is unavailable. The situation must be tied to a reason.

        Zero: choosing the large reserve "because bigger is better" with no mechanism; describing a corridor as a place animals live; saying edge is good because it has more species without reference to interior specialists.

    - slug: u08-w32-q17
      type: short_answer
      topic_code: "8.1"
      source: "general knowledge"
      points: 4
      prompt: |
        Conceptual analysis. A migratory songbird winters in Africa and flies to Europe each spring to breed, timing its departure by day length. Its chicks are fed on caterpillars, whose peak abundance in the breeding woods now occurs about two weeks earlier than it did forty years ago because springs have warmed. The birds' arrival date has not changed. (a) Identify the proximate cue for migration and explain why it has not shifted with the warming. (b) Explain, in terms of fitness, the consequence for the birds of arriving at the old time. (c) Predict the direction of natural selection on migration timing and identify what must be true of the trait for selection to produce a response. (d) Propose one observation that would show the population is responding.
      answer: |
        Day length, which is set by the calendar and does not change with temperature. Chicks hatch after the caterpillar peak, so fewer are fed and fewer fledge: lower reproductive success. Selection favours earlier departure or a response to temperature cues; the timing trait must be heritable (variation in the day-length threshold). Observe mean arrival dates advancing across years, or earlier-arriving birds fledging more chicks.
      explanation: |
        Four points, one per task.

        (a) Identify and explain, 1 pt: the proximate cue is photoperiod (day length), an innate response; it has not shifted because day length on a given date is fixed by Earth's orbit, unaffected by temperature, so the cue no longer predicts the food peak.

        (b) Fitness, 1 pt: a phenological mismatch: chicks hatch after the caterpillar peak, so parents find less food, fewer chicks survive to fledge, and the birds' reproductive success (fitness) falls.

        (c) Predict and condition, 1 pt: selection favours individuals that depart earlier (a lower day-length threshold) or that use temperature as an additional cue; for the population to respond, the variation in timing must be heritable. Both the direction and the heritability condition are needed.

        (d) Observation, 1 pt: any of: the mean arrival date advancing over successive years; earlier-arriving individuals fledging more chicks than later ones; a correlation between arrival date of parents and offspring; or, as an alternative response, birds shifting to a different food. The observation must bear on the population's timing or its fitness consequences.

        Zero: calling the cue "instinct" with no stimulus named; saying the birds will "decide" to leave earlier; predicting evolution without mentioning heritable variation.

    - slug: u08-w32-q18
      type: long_answer
      topic_code: "8.2"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. To find out which nutrient limits algal growth in temperate lakes, ecologists divided a small lake into two basins with a plastic curtain. For eight summers they added carbon (as sucrose) and nitrogen (as nitrate) to both basins, and phosphorus (as phosphate) to one basin only. They measured chlorophyll a (a proxy for phytoplankton biomass), dissolved oxygen 1 m above the bottom in late summer, and the diversity of zooplankton.

        | Measurement | Basin with C + N | Basin with C + N + P |
        |---|---|---|
        | Mean summer chlorophyll a (μg/L) | 4 | 38 |
        | Late-summer dissolved oxygen near bottom (mg/L) | 7.5 | 0.8 |
        | Zooplankton species recorded | 14 | 7 |
        | Dominant phytoplankton | mixed diatoms and green algae | nitrogen-fixing cyanobacteria |

        (a) Identify the limiting nutrient for phytoplankton in this lake and justify using the data and the design. (b) Explain why phosphorus, rather than nitrogen or carbon, is so often limiting in fresh water, with reference to its biogeochemical cycle. (c) Explain the oxygen result in the phosphorus-treated basin, naming the process responsible. (d) The phosphorus basin became dominated by nitrogen-fixing cyanobacteria. Explain why adding phosphorus alone was enough to favour them, and what this implies for a policy that reduces nitrogen pollution but not phosphorus pollution. (e) Explain why the zooplankton diversity fell, using the concepts of this unit. (f) Describe one limitation of the design and how you would improve it.
      answer: |
        Phosphorus: both basins got C and N, so the only difference is P, and chlorophyll rose almost tenfold. Phosphorus has no atmospheric reservoir and enters only by slow rock weathering, while nitrogen can be fixed from the air and CO₂ dissolves from it. The bloom died and bacterial decomposition consumed the oxygen (eutrophication). Cyanobacteria fix their own nitrogen, so once phosphorus was supplied they were not nitrogen-limited and outcompeted the others; cutting nitrogen without cutting phosphorus will not stop blooms. Dominance by one algal group and anoxic deep water removed habitat and food for many zooplankton, lowering evenness and richness. Only one lake, no replication; add more lakes or alternate treatments across basins over years.
      explanation: |
        Eight points.

        (a) 1 pt: phosphorus, because the basins differed only in phosphate and chlorophyll a rose from 4 to 38 μg/L (about tenfold) where it was added; the C + N basin serves as the control that shows carbon and nitrogen alone did not produce a bloom.

        (b) 1 pt: the phosphorus cycle has no gaseous phase, so phosphate enters a lake only through slow weathering of rock and runoff; nitrogen can be fixed from the atmosphere by cyanobacteria and CO₂ dissolves from the air, so neither is as scarce. Reference to the missing atmospheric reservoir is required.

        (c) 1 pt: the bloom died and sank, and bacterial decomposition (cellular respiration by decomposers) consumed dissolved oxygen in the deep water faster than it could be replaced, leaving near-anoxic conditions; naming decomposition or decomposer respiration is required.

        (d) 2 pts: 1 pt for explaining that cyanobacteria fix N₂, so once phosphorus was no longer limiting they could grow without depending on added nitrate, whereas diatoms and green algae remained constrained, giving the cyanobacteria the competitive advantage; 1 pt for the policy inference: reducing nitrogen inputs alone will not prevent blooms, because nitrogen fixers can supply their own, so phosphorus must be controlled.

        (e) 1 pt: the bloom was dominated by a single group (often inedible or toxic cyanobacteria), reducing the variety of food, and the anoxic deep water removed habitat, so some zooplankton species were lost and the community became less even; accept a Simpson's-index framing (dominance raises Σ (n/N)²).

        (f) 2 pts: 1 pt for a limitation: a single lake and a single pair of basins with no replication, so the result could reflect something unique to one basin; or the curtain may have leaked; or the two basins may have differed before the experiment; 1 pt for an improvement that addresses it: repeat on several lakes, swap treatments between basins in later years, or measure both basins for a season before any addition to establish a baseline.

        Zero for a part: naming nitrogen as limiting; explaining low oxygen by algae "using it up" with no decomposition step; a policy inference not linked to nitrogen fixation; a limitation such as "too expensive".

    - slug: u08-w32-q19
      type: multiple_choice
      topic_code: "6.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Nitrogen-fixing bacteria express their nitrogenase genes only when usable nitrogen such as ammonium is scarce; in ammonium-rich soil the genes are switched off. Which statement best explains this pattern in terms of gene regulation?
      options:
        - "Fixation costs a large amount of ATP, so cells that repress nitrogenase genes when ammonium is available save energy and outgrow cells that fix nitrogen needlessly; the regulation works like an operon responding to the level of a metabolite."
        - "Ammonium denatures the nitrogenase enzyme, so the genes have no effect when it is present."
        - "The genes are lost from the chromosome when ammonium is present and regained when it is scarce."
        - "Bacteria cannot regulate gene expression, so the pattern must be due to the cells dying in ammonium-rich soil."
      option_explanations:
        - |
          Correct. Like the lac operon switching on only when lactose is present and glucose absent, nitrogenase expression responds to a signal (ammonium level) through regulatory proteins, and the energetic logic is the same: make an expensive enzyme only when it pays.
        - |
          Ammonium does not denature nitrogenase; the control is at transcription, before any enzyme is made, which is the cheaper point to regulate.
        - |
          Genes are not gained and lost with conditions; expression changes while the DNA stays the same, which is what gene regulation means.
        - |
          Bacterial operons were the first regulated genes discovered; prokaryotes adjust transcription constantly in response to nutrients.
      answer: 0
      explanation: |
        The nitrogen cycle runs on regulated bacterial genes. Unit 6's operon logic, express a pathway only when its substrate is present and its product absent, is why fixation happens where and when the ecosystem needs it.

    - slug: u08-w32-q20
      type: multiple_choice
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. A cross between two heterozygous pea plants for two independently assorting genes yields 160 offspring: 95 tall green, 29 tall yellow, 27 short green and 9 short yellow. Using a 9:3:3:1 expectation, which statement is correct?
      options:
        - "Expected counts are 90, 30, 30 and 10; χ² ≈ 0.49 with 3 degrees of freedom, below the critical value of 7.81, so the data are consistent with independent assortment."
        - "The expected counts are 40 each, and the result is significant."
        - "There is 1 degree of freedom because there are two genes."
        - "Because the observed counts are not exactly 90, 30, 30 and 10, independent assortment is rejected."
      option_explanations:
        - |
          Correct. (95 − 90)²/90 + (29 − 30)²/30 + (27 − 30)²/30 + (9 − 10)²/10 = 0.28 + 0.03 + 0.30 + 0.10 = 0.71 at most, well under 7.81 (accept small rounding differences); the null hypothesis stands.
        - |
          Equal expected counts would be the null hypothesis for a choice chamber with four arms, not for a dihybrid cross, whose null is the 9:3:3:1 ratio.
        - |
          Degrees of freedom are phenotype categories minus one, 4 − 1 = 3, regardless of how many genes are involved.
        - |
          Observed counts never match expected exactly; the chi-square test exists precisely to decide whether the deviation is larger than chance would produce, and here it is not.
      answer: 0
      explanation: |
        The same chi-square, with the expected values supplied by Mendel's ratios instead of by a no-preference hypothesis, is on the AP exam in Unit 5 and Unit 8 alike. Know where the expected values come from in each.

    - slug: u08-w32-q21
      type: multiple_choice
      topic_code: "7.9"
      source: "Biology 2e §47.1 The Biodiversity Crisis"
      points: 1
      prompt: |
        Review. DNA sequencing shows that the roughly 500 cichlid species of Lake Victoria share a more recent common ancestor with one another than any of them shares with cichlids from other African lakes. Which statement about a phylogenetic tree of these fish is correct?
      options:
        - "The Lake Victoria cichlids form a monophyletic group (a clade) descended from a single colonising lineage, and the many branches within it record a recent adaptive radiation."
        - "The Lake Victoria cichlids are polyphyletic, each species having arrived separately from a different lake."
        - "The tree shows that the Lake Victoria species evolved from the species in other lakes that look most like them."
        - "Because they diversified recently, the species cannot be placed on a tree."
      option_explanations:
        - |
          Correct. A clade is an ancestor and all its descendants; sharing a more recent ancestor with each other than with outsiders is the definition, and short branches within it reflect the rapid, recent speciation.
        - |
          Separate arrivals would make each species closer to a relative in another lake than to its lake-mates, the opposite of what the sequences show.
        - |
          Trees record ancestry, not resemblance; similar feeding specialists in different lakes are usually convergent, not ancestor and descendant.
        - |
          Recent divergence makes the branches short and the resolution harder, but molecular data can still recover the tree; this is where DNA phylogenetics is most useful.
      answer: 0
      explanation: |
        Community structure has a history. The partitioned niches of a species-rich lake are the branches of a clade, and the phylogeny is how you tell a radiation from a collection of immigrants.

    - slug: u08-w32-q22
      type: multiple_choice
      topic_code: "2.7"
      source: "Biology 2e §44.4 Aquatic Biomes"
      points: 1
      prompt: |
        Review. In an estuary, salinity swings between nearly fresh and nearly marine with the tides and rainfall. Mussels there respond to a drop in salinity by closing their shells, stopping feeding, and switching to anaerobic respiration until the salt water returns. Which explanation of the behaviour is best?
      options:
        - "Closing the shell isolates the mussel's tissues from water that is hypotonic to them, preventing a damaging influx of water by osmosis, at the cost of oxygen, which anaerobic respiration temporarily replaces."
        - "The mussel closes to avoid being swept away by the river current."
        - "Fresh water contains no oxygen, so the mussel must stop breathing."
        - "The mussel is hibernating until the temperature rises."
      option_explanations:
        - |
          Correct. Fresh water has a higher water potential than the mussel's cells, so without a barrier water would flood in and cells would swell; sealing the shell is an osmoregulatory response that trades oxygen supply for solute balance.
        - |
          Mussels are anchored by byssal threads and are not swept away by currents; the trigger is salinity, and the response involves metabolism, not attachment.
        - |
          River water carries dissolved oxygen like any water; the mussel loses access to oxygen because it has closed, not because the water lacks it.
        - |
          The response is to salinity, not temperature, and lasts for hours or days with the tide, not a season.
      answer: 0
      explanation: |
        Where an organism can live is set by its physiology. The tonicity rules of Unit 2 decide which species occupy an estuary and what each must do to survive the tide.

    - slug: u08-w32-q23
      type: true_false
      topic_code: "6.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. True or false: When an ecosystem is disrupted, the populations that persist are those in which pre-existing heritable variation, originally produced by mutation, happens to include individuals suited to the new conditions; the disruption does not cause the needed mutations to arise.
      answer: true
      explanation: |
        True. Mutation is random with respect to need; it supplies variation continuously, and selection after a disruption sorts whatever variation is already present. A population with little genetic diversity, from a bottleneck or from uniform breeding, has less to be sorted and is more likely to be lost. This is why the CED phrases topic 8.7 as the interaction between the environment and random or pre-existing variation.

    - slug: u08-w32-q24
      type: fill_blank
      topic_code: "1.5"
      source: "Biology 2e §46.2 Energy Flow through Ecosystems"
      points: 1
      prompt: |
        Review. DDT and PCBs biomagnify up food chains because they are nonpolar and dissolve in the ____ of an animal's tissues rather than in its blood, so they are stored instead of excreted and are passed intact to whatever eats the animal.
      answer: ["lipids", "fat", "fats", "lipid", "fatty tissue", "adipose tissue"]
      explanation: |
        Hydrophobic molecules partition into lipid, the hydrophobic store of Unit 1, and the kidney, which filters water-soluble wastes, cannot remove them. Each predator therefore inherits the whole burden of its prey, and concentration rises with trophic level; walleye in Saginaw Bay carried more than four times the PCB concentration of the phytoplankton, and fish-eating birds an order of magnitude more. "Water" is the opposite of the answer and is not accepted.

    - slug: u08-w32-q25
      type: multiple_choice
      topic_code: "3.3"
      source: "Biology 2e §46.1 Ecology of Ecosystems"
      points: 1
      prompt: |
        Review. At Silver Springs, the gross productivity of the producers (20,810 kcal/m²/yr) was found to equal the total of all the heat released by respiration across the whole ecosystem plus the small amount exported. Which principle explains why the two totals must match?
      options:
        - "Energy is conserved: every kilocalorie captured by photosynthesis is eventually converted to heat by the respiration of some organism or leaves the system, so inputs equal outputs over a year."
        - "Producers respire exactly as much as they photosynthesise, so GPP and respiration are the same thing."
        - "Decomposers return energy to the producers, so the totals balance."
        - "The ecosystem creates energy at the same rate that it is used."
      option_explanations:
        - |
          Correct. The first law of thermodynamics applies to an ecosystem as to a cell; and the second law explains why the energy comes out as heat, which no organism can recapture, so the system needs a constant input of light.
        - |
          Producers respire about two thirds of their GPP; the rest is passed to consumers and decomposers, who respire it. The total over all organisms, not the producers alone, matches GPP.
        - |
          Decomposers recycle matter; the energy they obtain is respired to heat like everyone else's and never returns to the producers.
        - |
          Energy is never created; the sun supplies it and the ecosystem degrades it to heat. A steady state is an equal flow in and out, not generation.
      answer: 0
      explanation: |
        Unit 3's thermodynamics and Unit 8's energy pyramid are one lesson: energy enters once, is coupled to work with losses at every step, and leaves as heat. That is why energy flows while matter cycles.
