week: 29
unit: 8
title: Biogeochemical Cycles and Population Growth
topics: ["8.2", "8.3"]
guide: guides/week-29.md
guide_description: |
  The second half of energy flow: matter cycles while energy does not, traced through the water, carbon,
  nitrogen and phosphorus cycles with their reservoirs, the bacteria that run the nitrogen cycle, and what
  humans have changed. Then population ecology: dN/dt = B − D, exponential growth with rmax, logistic growth
  with K, and how to read both from data. Three worked examples (an exponential and a logistic calculation, a
  yeast growth table, an Investigation 10 energy budget), misconceptions, self-check.
flashcards_description: |
  30 cards: the four biogeochemical cycles with their key steps and organisms, human disruptions of each, and
  the vocabulary and equations of exponential and logistic population growth.

flashcards:
  - front: Biogeochemical cycle → definition and the elements that matter most
    back: |
      The movement of an element between living organisms and the abiotic reservoirs of air, water, soil and rock, through biological, geological and chemical processes. Carbon, nitrogen, hydrogen, oxygen, phosphorus and sulfur are the six most common elements in organic molecules; the CED asks for water, carbon, nitrogen and phosphorus.
    topic_code: "8.2"
  - front: Water cycle → the processes in order
    back: |
      Solar energy drives evaporation from surface water and sublimation from ice; plants add vapour by transpiration; vapour condenses into clouds and falls as precipitation; water then infiltrates to groundwater, runs off into streams, or evaporates again.
    topic_code: "8.2"
  - front: Where is Earth's fresh water?
    back: |
      Only 2.5% of all water is fresh. Of that, about 69% is frozen in glaciers and permanent snow, 31% is groundwater, and only 0.3% is in lakes and rivers where organisms can easily reach it.
    hint: The accessible fraction is less than one hundredth of the fresh water.
    topic_code: "8.2"
  - front: Residence time → meaning and two contrasting values
    back: |
      The average time a molecule spends in a reservoir. Water stays about 1.5 weeks in the atmosphere and about a week in living things, but thousands of years in the oceans and up to 10,000 years in glaciers and deep groundwater.
    topic_code: "8.2"
  - front: Carbon cycle → the fast biological loop
    back: |
      Autotrophs fix atmospheric CO₂ into glucose by photosynthesis; heterotrophs eat the organic carbon; every organism returns CO₂ by cellular respiration; decomposers return the carbon in dead material the same way. Photosynthesis and respiration are the two arrows.
    topic_code: "8.2"
  - front: Carbon cycle → the slow geological reservoirs
    back: |
      Oceans (mostly as bicarbonate), ocean sediments and limestone (the largest reservoir), soil, fossil fuels and Earth's interior. Carbon leaves these through weathering, volcanic eruptions and, since the Industrial Revolution, the burning of fossil fuels.
    topic_code: "8.2"
  - front: How does atmospheric CO₂ end up as limestone?
    back: |
      CO₂ dissolves in seawater to form carbonic acid, which ionises to bicarbonate and carbonate; marine organisms combine carbonate with calcium to build CaCO₃ shells, which settle as sediment and are compressed over geological time into limestone.
    topic_code: "8.2"
  - front: Why does burning fossil fuels raise atmospheric CO₂ when respiration does not?
    back: |
      Respiration returns carbon that photosynthesis removed recently, so the two balance. Fossil fuels hold carbon buried for millions of years; burning them moves that carbon into the air in decades, far faster than any process returns it to rock, so the atmospheric reservoir grows.
    topic_code: "8.2"
  - front: Nitrogen fixation → what it does and who does it
    back: |
      Converts inert N₂ (triple-bonded, 78% of the air) into ammonium that organisms can use. Done only by prokaryotes: free-living bacteria such as Azotobacter, cyanobacteria in water, and Rhizobium living symbiotically in the root nodules of legumes.
    topic_code: "8.2"
  - front: Ammonification, nitrification, denitrification → inputs, outputs and organisms
    back: |
      Ammonification: bacteria and fungi turn nitrogen in dead organisms and wastes into ammonium (NH₄⁺). Nitrification: Nitrosomonas and relatives oxidise ammonium to nitrite (NO₂⁻) and then nitrate (NO₃⁻), the form plants take up most. Denitrification: Pseudomonas and Clostridium reduce nitrate back to N₂ gas, closing the cycle.
    hint: Fix, ammonify, nitrify, denitrify.
    topic_code: "8.2"
  - front: Why do legumes grow well in nitrogen-poor soil?
    back: |
      Rhizobium bacteria in their root nodules fix N₂ into ammonium and pass it to the plant in exchange for sugars. The mutualism gives peas, beans and peanuts their own nitrogen supply, which is why farmers rotate them with other crops.
    topic_code: "8.2"
  - front: Phosphorus cycle → what makes it different from the carbon and nitrogen cycles
    back: |
      Phosphorus has no significant atmospheric phase. It enters ecosystems as phosphate (PO₄³⁻) by weathering of rock, moves through organisms, and returns to sediment; uplift brings sediment back to land over geological time. Because it is released only slowly from rock, it is usually the limiting nutrient in fresh water.
    topic_code: "8.2"
  - front: Eutrophication and dead zones → the causal chain
    back: |
      Fertiliser and sewage add nitrate and phosphate to water; algae bloom; the algae die and sink; decomposers respire the dead material and consume dissolved oxygen; fish and shellfish suffocate. The Gulf of Mexico dead zone exceeds 8,000 square miles, fed by Mississippi runoff.
    topic_code: "8.2"
  - front: Why are nitrogen and phosphorus the usual limiting nutrients?
    back: |
      Both are needed in quantity (nitrogen for every protein and nucleic acid, phosphorus for nucleic acids, ATP and phospholipids) yet both are scarce in usable form: nitrogen because N₂ must be fixed by bacteria, phosphorus because it comes only from slow rock weathering. Add either and producers respond.
    topic_code: "8.2"
  - front: Human changes to the nitrogen cycle
    back: |
      Burning fossil fuels releases nitrogen oxides, which form nitric acid in rain and nitrous oxide, a greenhouse gas; synthetic fertiliser adds fixed nitrogen that runs off into water and drives eutrophication. People now fix about as much nitrogen as all natural processes combined.
    topic_code: "8.2"
  - front: Population → the AP definition and the two numbers that describe it
    back: |
      All the individuals of one species in an area that can interact and interbreed. Described by size (N, the number of individuals) and density (number per unit area or volume). Smaller organisms tend to live at higher densities than larger ones.
    topic_code: "8.3"
  - front: dN/dt = B − D → what each symbol means
    back: |
      The rate of change of population size equals births minus deaths over the same interval (immigration and emigration are added when the population is open). If B > D the population grows; if B < D it shrinks; equal means zero growth.
    topic_code: "8.3"
  - front: Exponential growth → equation and curve shape
    back: |
      dN/dt = rmax N. Growth rate is proportional to population size, so the curve is J-shaped: slow at first, then steeper and steeper. It describes a population with unlimited resources, which real populations experience only briefly.
    topic_code: "8.3"
  - front: rmax (intrinsic rate of increase, biotic potential)
    back: |
      The maximum per-capita growth rate a species can achieve under ideal conditions: births per individual minus deaths per individual, per unit time. Positive means growth, negative means decline, zero means a stable size. It is a property of the species, not of a particular population.
    topic_code: "8.3"
  - front: How do you read the per-capita growth rate from a data table?
    back: |
      Take the change in N over an interval, divide by the interval length to get dN/dt, then divide by N at the start of the interval. If a population goes from 100 to 130 in one year, dN/dt = 30 per year and r = 30 ÷ 100 = 0.30 per year.
    topic_code: "8.3"
  - front: Why do 1,000 bacteria dividing hourly exceed 16 billion in a day?
    back: |
      Each division doubles N: 1,000 × 2²⁴ ≈ 16.8 billion after 24 doublings. Doubling is exponential growth with a constant per-capita rate; the absolute increase in each hour is larger than in the hour before because more cells are dividing.
    topic_code: "8.3"
  - front: Logistic growth → equation and curve shape
    back: |
      dN/dt = rmax N (K − N) / K. Growth is nearly exponential when N is small, slows as N approaches K, and stops at K. The curve is S-shaped (sigmoid).
    topic_code: "8.3"
  - front: Carrying capacity (K)
    back: |
      The maximum population size a particular environment can sustain indefinitely with its available resources. It is a property of the environment and the species together, and it changes if resources, space or predators change.
    topic_code: "8.3"
  - front: What does the factor (K − N)/K do to the growth rate?
    back: |
      It scales the exponential rate by the fraction of carrying capacity still unused. Near zero population it is close to 1 (growth is almost exponential); at N = K it is 0 (no growth); if N overshoots K it is negative and the population declines.
    topic_code: "8.3"
  - front: When is dN/dt largest in logistic growth?
    back: |
      At N = K/2. Below that, there are too few individuals reproducing; above it, competition cuts the per-capita rate too far. The steepest part of the S-curve is its middle, which matters when harvesting a population sustainably.
    hint: Half of K.
    topic_code: "8.3"
  - front: Yeast in a flask vs harbor seals → how real populations fit the logistic model
    back: |
      Yeast grown in a nutrient flask trace an almost perfect S-curve and plateau as nutrients run out. Harbor seal numbers oscillate above and below K rather than settling on it, because the real carrying capacity shifts with seasons and other species. The model describes the trend, not every data point.
    topic_code: "8.3"
  - front: Intraspecific competition
    back: |
      Competition between members of the same species for food, water, space, light or mates. It is what makes per-capita birth rates fall and death rates rise as N approaches K, and it is the biological content of the (K − N)/K term.
    topic_code: "8.3"
  - front: AP Investigation 10 Energy Dynamics → what is measured and why
    back: |
      Fast-growing Brassica plants are grown and their dry biomass gain measured; cabbage-white caterpillars are fed the plants and their mass gain and frass (faeces) collected and dried. Converting dry mass to energy with known kcal/g values gives the fraction of plant energy that became caterpillar, respired, or passed as frass.
    topic_code: "8.3"
  - front: Life table → what it records and how to compute a mortality rate
    back: |
      For each age interval: how many of an original cohort (usually 1,000) are alive at the start, how many die during the interval, the mortality rate and the remaining life expectancy. Mortality rate = (number dying in the interval ÷ number alive at its start) × 1,000; for Dall sheep aged 3–4, 12 ÷ 776 × 1,000 ≈ 15.5 per 1,000.
    topic_code: "8.3"
  - front: Survivorship curves → Type I, II and III with examples
    back: |
      Type I: most survive to old age, then die (humans, large mammals; few offspring, much parental care). Type II: constant death rate at every age (many birds, some rodents). Type III: most die young, survivors live long (trees, marine invertebrates, most fish; huge numbers of offspring, no care).
    topic_code: "8.3"

quiz:
  description: |
    25 questions · about 30 minutes · the water, carbon, nitrogen and phosphorus cycles and the exponential and
    logistic models of population growth, with a yeast growth data set and two dN/dt calculations, plus spiral
    review of behaviour, photosynthesis, the elements of life, Hardy-Weinberg, membrane transport, osmoregulation
    and respiration. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the two short answers and the long answer are graded by
    your teacher against the acceptable-answer summary.
  questions:
    - slug: u08-w29-q01
      type: multiple_choice
      topic_code: "8.3"
      source: "Biology 2e §45.3 Environmental Limits to Population Growth"
      points: 1
      stimulus: |
        A culture of yeast was started in a flask of sugar medium and the number of cells per millilitre (in thousands) was counted every two hours. The flask was kept at a constant 30 °C and no medium was added or removed.

        | Time (h) | Cells (thousands/mL) |
        |---|---|
        | 0 | 10 |
        | 2 | 20 |
        | 4 | 40 |
        | 6 | 80 |
        | 8 | 150 |
        | 10 | 250 |
        | 12 | 340 |
        | 14 | 390 |
        | 16 | 400 |
        | 18 | 400 |
      prompt: |
        Which description of the population's growth over the 18 hours is best supported by the data?
      options:
        - "Logistic growth: the population doubled every two hours until about hour 6, then its growth slowed and stopped near 400 thousand cells per millilitre."
        - "Exponential growth throughout, since the population never decreased."
        - "Linear growth, since the population increased in every interval."
        - "A population crash after hour 16, since the count stopped rising."
      option_explanations:
        - |
          Correct. The early intervals double (10, 20, 40, 80), the later increments shrink (90, 50, 10, 0) and the count plateaus, which is the S-shaped logistic pattern with K near 400 thousand/mL.
        - |
          Exponential growth would keep doubling: 160, 320, 640 and so on. The increments fall after hour 8 and growth stops, which exponential growth never does.
        - |
          Linear growth adds the same number each interval; here the increments are 10, 20, 40, 70, 100, 90, 50, 10, 0, nothing like a constant.
        - |
          A crash would show the count falling. A count that holds steady at 400 is a population at carrying capacity, where births balance deaths.
      answer: 0
      explanation: |
        Look at the increments, not just the totals. Rising increments mean the exponential phase; falling increments mean the population is approaching K; a flat line means it is there.

    - slug: u08-w29-q02
      type: multiple_choice
      topic_code: "8.3"
      source: "Biology 2e §45.3 Environmental Limits to Population Growth"
      points: 1
      stimulus: |
        A culture of yeast was started in a flask of sugar medium and the number of cells per millilitre (in thousands) was counted every two hours. The flask was kept at a constant 30 °C and no medium was added or removed.

        | Time (h) | Cells (thousands/mL) |
        |---|---|
        | 0 | 10 |
        | 2 | 20 |
        | 4 | 40 |
        | 6 | 80 |
        | 8 | 150 |
        | 10 | 250 |
        | 12 | 340 |
        | 14 | 390 |
        | 16 | 400 |
        | 18 | 400 |
      prompt: |
        During which interval was the population's growth rate, in cells added per hour, the largest, and why does that interval make sense in the logistic model?
      options:
        - "Hours 8 to 10, when about 50 thousand cells/mL were added per hour; growth is fastest near K/2, where many cells are dividing but competition is not yet severe."
        - "Hours 0 to 2, when the per-capita growth rate was highest; the model says growth is always fastest at the start."
        - "Hours 16 to 18, when the population was largest; more cells always means more growth."
        - "Hours 2 to 4, because doubling is the fastest kind of growth."
      option_explanations:
        - |
          Correct. 250 − 150 = 100 thousand over 2 h, or 50 thousand/mL per hour, the largest increment. With K ≈ 400, N ≈ 200 is where the logistic curve is steepest.
        - |
          Per-capita rate (r) is highest at the start, but dN/dt = rN is a product; with only 10 thousand cells the absolute growth is just 5 thousand/mL per hour, the smallest of all.
        - |
          At K the per-capita rate has fallen to zero; large N multiplied by zero is zero growth, which is exactly what hours 16 to 18 show.
        - |
          Doubling from 20 to 40 adds only 10 thousand/mL per hour. Doubling describes the per-capita rate; the question asks about total cells added, which depends on N as well.
      answer: 0
      explanation: |
        The logistic equation is a product, rmax × N × (K − N)/K. The first factor falls as N rises and the second rises, so their product peaks in the middle, at N = K/2.

    - slug: u08-w29-q03
      type: numeric
      topic_code: "8.3"
      source: "Biology 2e §45.3 Environmental Limits to Population Growth"
      points: 1
      stimulus: |
        A culture of yeast was started in a flask of sugar medium and the number of cells per millilitre (in thousands) was counted every two hours. The flask was kept at a constant 30 °C and no medium was added or removed.

        | Time (h) | Cells (thousands/mL) |
        |---|---|
        | 0 | 10 |
        | 2 | 20 |
        | 4 | 40 |
        | 6 | 80 |
        | 8 | 150 |
        | 10 | 250 |
        | 12 | 340 |
        | 14 | 390 |
        | 16 | 400 |
        | 18 | 400 |
      prompt: |
        Take the carrying capacity from the data as K = 400 thousand cells/mL and assume rmax = 0.40 per hour. Using the logistic equation dN/dt = rmax N (K − N)/K, calculate the predicted growth rate, in thousands of cells per mL per hour, when N = 250.
      answer: { value: 37.5, tolerance: 0.5 }
      explanation: |
        dN/dt = 0.40 × 250 × (400 − 250)/400 = 0.40 × 250 × 0.375 = 37.5 thousand cells/mL per hour. Compare the observed rate across hours 10 to 12: (340 − 250)/2 = 45, in the same range. The (K − N)/K factor, 0.375 here, is the fraction of the carrying capacity still available; it is what turns the exponential rate (100) into the logistic one (37.5).

    - slug: u08-w29-q04
      type: multiple_choice
      topic_code: "8.3"
      source: "Biology 2e §45.3 Environmental Limits to Population Growth"
      points: 1
      stimulus: |
        A culture of yeast was started in a flask of sugar medium and the number of cells per millilitre (in thousands) was counted every two hours. The flask was kept at a constant 30 °C and no medium was added or removed.

        | Time (h) | Cells (thousands/mL) |
        |---|---|
        | 0 | 10 |
        | 2 | 20 |
        | 4 | 40 |
        | 6 | 80 |
        | 8 | 150 |
        | 10 | 250 |
        | 12 | 340 |
        | 14 | 390 |
        | 16 | 400 |
        | 18 | 400 |
      prompt: |
        Which is the most likely explanation for the population levelling off at about 400 thousand cells/mL?
      options:
        - "Intraspecific competition for the finite sugar, together with accumulating ethanol and other wastes, raised the death rate and lowered the birth rate until they balanced."
        - "The yeast cells reached their maximum size and stopped dividing because they were too large."
        - "The temperature of 30 °C became lethal after 16 hours."
        - "Yeast have an intrinsic rate of increase of exactly zero after 16 hours of growth."
      option_explanations:
        - |
          Correct. Nothing was added to the flask, so the sugar was being used up and wastes were building; both are density-dependent pressures that reduce per-capita growth to zero at K.
        - |
          Cell size does not set a population ceiling; yeast divide by budding at a fixed size, and the limit is on the number of cells the medium can support, not on the size of each.
        - |
          Temperature was held constant throughout; a factor that did not change cannot explain a change that appeared at hour 16.
        - |
          rmax is a constant property of the species; it is the realised per-capita rate, r × (K − N)/K, that falls to zero at K. The growth stopped because resources ran out, not because the species changed.
      answer: 0
      explanation: |
        Carrying capacity is set by the environment: in a closed flask, by the finite medium. The biological mechanism behind the (K − N)/K term is intraspecific competition plus the accumulation of waste.

    - slug: u08-w29-q05
      type: multiple_choice
      topic_code: "8.2"
      source: "Biology 2e §46.3 Biogeochemical Cycles"
      points: 1
      prompt: |
        A farmer alternates maize with soybeans and finds the maize grows better in the year after soybeans even without fertiliser. Which explanation is best?
      options:
        - "Rhizobium bacteria in soybean root nodules fix atmospheric N₂ into ammonium, and nitrogen left in the soil from the soybean crop is available to the maize."
        - "Soybeans absorb nitrogen gas through their leaves and store it in their seeds."
        - "Soybean roots release phosphate that the maize then uses to fix nitrogen."
        - "The soybeans shade the soil, which stops nitrogen evaporating."
      option_explanations:
        - |
          Correct. Legumes host nitrogen-fixing bacteria in root nodules; when roots and residues decompose, ammonification and nitrification release that nitrogen to the next crop.
        - |
          No plant can use N₂ directly; the triple bond is broken only by prokaryotic nitrogenase. The fixing is done by the bacteria in the nodules, not by the plant's leaves.
        - |
          Phosphate is a different nutrient in a different cycle, and plants do not fix nitrogen at all, with or without phosphate.
        - |
          Nitrogen leaves soil as gas through denitrification by bacteria, not by evaporation, and shade does not stop it. The benefit comes from nitrogen added, not nitrogen retained.
      answer: 0
      explanation: |
        The nitrogen cycle has one entry point for most ecosystems: prokaryotic fixation. Legume rotation is agriculture borrowing that step from Rhizobium.

    - slug: u08-w29-q06
      type: multiple_choice
      topic_code: "8.2"
      source: "Biology 2e §46.3 Biogeochemical Cycles"
      points: 1
      prompt: |
        Phosphorus is usually the nutrient that limits algal growth in lakes, even though it is required in smaller amounts than carbon or nitrogen. Which feature of the phosphorus cycle best explains this?
      options:
        - "Phosphorus has no significant gaseous phase, so it enters ecosystems only by the slow weathering of phosphate rock and is lost to sediments that return only by geological uplift."
        - "Phosphorus is destroyed when organisms respire, so ecosystems constantly run out."
        - "Phosphate is highly volatile and escapes from lakes into the atmosphere."
        - "Phosphorus is only needed by animals, so plants cannot absorb it."
      option_explanations:
        - |
          Correct. Carbon and nitrogen have atmospheric reservoirs that can be tapped by photosynthesis and fixation; phosphorus must be weathered from rock, so its supply to a lake is small and slow.
        - |
          Elements are never destroyed by metabolism; phosphorus atoms cycle intact. The limitation is in the rate of supply, not in any loss of atoms.
        - |
          Phosphate is an ion dissolved in water or bound in sediment; it does not become a gas under natural conditions, which is precisely why the cycle has no atmospheric step.
        - |
          Every organism needs phosphorus for nucleic acids, ATP and phospholipids; algae take up phosphate readily, which is why a small addition from fertiliser produces a bloom.
      answer: 0
      explanation: |
        Of the four cycles, phosphorus is the only one with no atmospheric reservoir. That one fact explains both why it limits growth and why fertiliser runoff has such a large effect.

    - slug: u08-w29-q07
      type: multiple_choice
      topic_code: "8.2"
      source: "Biology 2e §46.3 Biogeochemical Cycles"
      points: 1
      prompt: |
        Cellular respiration by all the organisms on Earth releases far more CO₂ each year than the burning of fossil fuels does, yet it is fossil-fuel burning that is raising atmospheric CO₂. Which statement resolves the apparent contradiction?
      options:
        - "Respiration returns carbon that photosynthesis removed from the air recently, so the two roughly balance; fossil-fuel carbon was buried for millions of years and is being returned to the air far faster than any process puts it back into rock."
        - "Respiration releases CO₂ into the oceans rather than the atmosphere."
        - "Fossil-fuel CO₂ is chemically different from biological CO₂ and cannot be absorbed by plants."
        - "Respiration has only been occurring since the Industrial Revolution."
      option_explanations:
        - |
          Correct. The biological loop is a fast cycle in near-balance; fossil-fuel burning is a one-way transfer from the slow geological reservoir to the atmosphere on human timescales.
        - |
          Terrestrial respiration releases CO₂ to the air directly, and marine respiration to water that exchanges with the air; the location is not the explanation.
        - |
          CO₂ is CO₂ regardless of origin, and plants fix fossil-fuel carbon freely; indeed the ocean and land absorb about half of what is emitted. The rest accumulates because emission outruns uptake.
        - |
          Respiration is as old as life; the Industrial Revolution is when fossil-fuel burning began at scale, roughly 1750 onwards.
      answer: 0
      explanation: |
        Think in reservoirs and fluxes. A flux that moves carbon between two parts of a closed loop changes nothing in the long run; a flux from a slow reservoir into a fast one accumulates.

    - slug: u08-w29-q08
      type: multiple_choice
      topic_code: "8.3"
      source: "Biology 2e §45.3 Environmental Limits to Population Growth"
      points: 1
      prompt: |
        A graph of harbor seal numbers over several decades rises, then fluctuates above and below a roughly constant level without ever settling on it. Which interpretation is most consistent with the logistic model?
      options:
        - "The population is at carrying capacity, but K itself shifts with season and food supply and the population lags behind, so it overshoots and undershoots a long-term average."
        - "The logistic model is refuted, because it predicts a perfectly flat plateau."
        - "The seals have no carrying capacity, because their numbers keep changing."
        - "The fluctuations show exponential growth alternating with extinction."
      option_explanations:
        - |
          Correct. Real environments are not constant flasks; the model's plateau is a long-run average around which a real population oscillates as resources and births lag one another.
        - |
          The model is idealised, not refuted; it describes the trend of growth toward a limit, and the seal data show exactly that trend with noise around the limit.
        - |
          A population that fluctuates around a stable average is the signature of a carrying capacity; without one, the numbers would keep rising.
        - |
          The population never goes to zero, and the rises are modest corrections after an undershoot, not J-curves.
      answer: 0
      explanation: |
        Lab populations (yeast, bacteria) fit the S-curve closely; field populations oscillate around K. The CED expects you to apply the model to messy data and say what it does and does not capture.

    - slug: u08-w29-q09
      type: multi_select
      topic_code: "8.2"
      source: "Biology 2e §46.3 Biogeochemical Cycles"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the nitrogen cycle are correct? Select all that apply.
      options:
        - "Nitrogen fixation, which converts N₂ to ammonium, is carried out only by prokaryotes."
        - "Nitrification converts ammonium to nitrite and then to nitrate, the form plants take up most readily."
        - "Denitrifying bacteria return nitrogen to the atmosphere as N₂, so the cycle is closed."
        - "Plants obtain most of their nitrogen by absorbing N₂ directly through their stomata."
        - "Fertiliser runoff adds usable nitrogen to water and can trigger eutrophication."
      option_explanations:
        - |
          Correct. Nitrogenase, the enzyme that breaks the N≡N bond, occurs only in bacteria and archaea, free-living or symbiotic.
        - |
          Correct. Nitrosomonas and relatives oxidise NH₄⁺ to NO₂⁻ and other bacteria oxidise NO₂⁻ to NO₃⁻, which roots absorb.
        - |
          Correct. Pseudomonas and Clostridium reduce nitrate to N₂ gas under low-oxygen conditions, balancing fixation over the long run.
        - |
          N₂ enters leaves through stomata but plants cannot use it; the triple bond is inert to plant enzymes. Plants depend on fixed nitrogen taken up through roots as nitrate or ammonium.
        - |
          Correct. Nitrate washed into lakes and coastal waters drives algal blooms whose decomposition strips oxygen from the water.
      answer: [0, 1, 2, 4]
      explanation: |
        The nitrogen cycle is run by bacteria at every step except uptake and assimilation. If a statement has a plant or animal breaking or making N₂, it is wrong.

    - slug: u08-w29-q10
      type: multi_select
      topic_code: "8.3"
      source: "Biology 2e §45.3 Environmental Limits to Population Growth"
      points: 2
      partial_credit: true
      prompt: |
        Under which conditions would a population be expected to grow approximately exponentially? Select all that apply.
      options:
        - "A few bacteria introduced into a large flask of fresh nutrient medium"
        - "A population that has just reached its carrying capacity"
        - "A small number of rabbits released on an island with abundant food and no predators"
        - "A population in which the birth rate equals the death rate"
        - "A fast-growing population early in logistic growth, when N is far below K"
      option_explanations:
        - |
          Correct. With resources effectively unlimited, each cell divides at the maximum rate and N doubles each generation.
        - |
          At K, births equal deaths and dN/dt is zero; this is the opposite of exponential growth.
        - |
          Correct. Abundant resources and no predation mean per-capita growth near rmax, giving a J-curve until the island's resources begin to bind.
        - |
          Equal birth and death rates give r = 0 and a stable size; exponential growth requires r greater than zero.
        - |
          Correct. When N is small, (K − N)/K is close to 1 and the logistic equation reduces to dN/dt ≈ rmax N.
      answer: [0, 2, 4]
      explanation: |
        Exponential growth is the logistic model's early phase, not a different kind of population. The question is always whether resources are limiting yet.

    - slug: u08-w29-q11
      type: true_false
      topic_code: "8.2"
      source: "Biology 2e §46.3 Biogeochemical Cycles"
      points: 1
      prompt: |
        True or false: Denitrifying bacteria make nitrogen more available to plants by converting nitrate into nitrogen gas.
      answer: false
      explanation: |
        False. Denitrification removes usable nitrogen from an ecosystem: nitrate is reduced to N₂, which escapes to the atmosphere where plants cannot use it. It is nitrification (ammonium to nitrate) and fixation (N₂ to ammonium) that increase what plants can take up. Students often reverse the two because both names contain "nitr"; attach each to its product.

    - slug: u08-w29-q12
      type: true_false
      topic_code: "8.3"
      source: "Biology 2e §45.3 Environmental Limits to Population Growth"
      points: 1
      prompt: |
        True or false: In the logistic model, the per-capita growth rate stays constant at rmax while the population grows toward its carrying capacity.
      answer: false
      explanation: |
        False. The realised per-capita rate is rmax × (K − N)/K, which falls steadily from rmax toward zero as N climbs to K. A constant per-capita rate is the exponential model. The total growth rate, dN/dt, rises and then falls because it is this shrinking per-capita rate multiplied by a growing N.

    - slug: u08-w29-q13
      type: fill_blank
      topic_code: "8.2"
      source: "Biology 2e §46.3 Biogeochemical Cycles"
      points: 1
      prompt: |
        Soil bacteria such as Nitrosomonas oxidise ammonium to nitrite, and others oxidise nitrite to nitrate, in a two-step process called ____.
      answer: ["nitrification"]
      explanation: |
        Nitrification is the oxidation of ammonium through nitrite to nitrate, the form of nitrogen most plants absorb. "Nitrogen fixation" starts from N₂ gas, not ammonium, and "denitrification" runs the other way, nitrate to N₂, so neither is accepted. "Ammonification" produces the ammonium that nitrification then uses.

    - slug: u08-w29-q14
      type: fill_blank
      topic_code: "8.3"
      source: "Biology 2e §45.3 Environmental Limits to Population Growth"
      points: 1
      prompt: |
        The maximum population size that a particular environment can sustain over time, represented by K in the logistic equation, is called the ____.
      answer: ["carrying capacity", "carrying capacity (K)"]
      explanation: |
        Carrying capacity is set by the environment's resources (food, water, space, nesting sites) for a given species. It is not fixed for all time: it falls in a drought and rises when a competitor disappears. "Biotic potential" is rmax, the species' maximum per-capita growth rate, and is not accepted.

    - slug: u08-w29-q15
      type: numeric
      topic_code: "8.3"
      source: "Biology 2e §45.3 Environmental Limits to Population Growth"
      points: 1
      prompt: |
        A population of 400 water fleas in a pond with no shortage of food has a maximum per-capita growth rate of 0.35 per day. Using dN/dt = rmax N, how many individuals per day is the population growing at this moment?
      answer: { value: 140, tolerance: 1 }
      explanation: |
        dN/dt = rmax × N = 0.35 × 400 = 140 individuals per day. The per-capita rate 0.35 means each individual contributes, on average, 0.35 net new individuals per day; multiply by how many individuals there are. Note the units: the answer is a rate in individuals per day, not a new population size.

    - slug: u08-w29-q16
      type: short_answer
