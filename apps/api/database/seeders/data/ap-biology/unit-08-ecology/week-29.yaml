      answer: |
        0.20 ÷ 2.00 = 10%; 0.80 g egested as frass (40%) and 1.00 g respired (50%); respired carbon leaves as CO₂ and water vapour, with the energy as heat; the energy content (kcal per g dry mass) of leaf, caterpillar and frass, from bomb calorimetry or published values.
      explanation: |
        Four points, one per task.

        (a) Calculate, 1 pt: 0.20 ÷ 2.00 × 100 = 10% of consumed mass stored as new biomass.

        (b) Account, 1 pt: frass, 0.80 g (40%), the part never assimilated; and respiration, 2.00 − 0.20 − 0.80 = 1.00 g (50%), the assimilated mass oxidised for energy. Both fates with correct masses are needed for the point.

        (c) Explain, 1 pt: respired biomass leaves as CO₂ and water vapour, gases that escape, and the energy it carried is released as heat; neither can be collected by drying and weighing.

        (d) Energy, 1 pt: the energy content per gram of dry mass for each component (leaf, caterpillar, frass), obtained by calorimetry or from reference values, so that each mass can be multiplied into kcal and the transfer efficiency recalculated in energy terms.

        Zero: calling the frass "respired" or the respired portion "lost"/"wasted" with no mechanism; reporting 10% as a law rather than as the measured value for this trial.

    - slug: u08-w29-q17
      type: short_answer
      topic_code: "8.2"
      source: "Biology 2e §46.3 Biogeochemical Cycles"
      points: 4
      prompt: |
        Conceptual analysis. Atmospheric CO₂ cycled between about 180 and 300 ppm for hundreds of thousands of years but has risen from about 280 ppm to over 400 ppm since 1750. (a) Describe the two biological processes that move carbon between the atmosphere and organisms, and the direction each moves it. (b) Explain how deforestation and the burning of fossil fuels each change the balance of the carbon cycle. (c) Describe what happens to CO₂ that dissolves in the ocean and one consequence for marine organisms with calcium carbonate shells. (d) Predict what would happen to atmospheric CO₂ if all fossil-fuel burning stopped today, and justify your prediction with reference to reservoirs.
      answer: |
        Photosynthesis removes CO₂ into organic carbon; respiration (including decomposition) returns it. Deforestation removes photosynthetic uptake and releases stored carbon; fossil fuels move carbon from a reservoir buried for millions of years into the air faster than it is returned. Dissolved CO₂ forms carbonic acid, lowering pH and reducing carbonate available for shells. CO₂ would stop rising and slowly fall as the ocean and regrowing vegetation absorbed it, but over centuries, because uptake into rock and deep ocean is slow.
      explanation: |
        Four points, one per task.

        (a) Describe, 1 pt: photosynthesis fixes atmospheric CO₂ into organic molecules (air to organisms), and cellular respiration, including that of decomposers, releases CO₂ from organic molecules (organisms to air). Both processes and both directions are needed.

        (b) Explain, 1 pt: deforestation removes producers that would take up CO₂ and, when the wood is burned or decays, releases the carbon stored in it; fossil-fuel burning transfers carbon from a geological reservoir that had been out of the fast cycle for millions of years into the atmosphere, at a rate far above the rate of burial. Each activity must be tied to a change in a flux or reservoir, not just named.

        (c) Describe, 1 pt: CO₂ reacts with water to form carbonic acid, which releases H⁺ and lowers ocean pH; the extra H⁺ reacts with carbonate ions, reducing the carbonate available to build calcium carbonate shells and skeletons, so corals, molluscs and plankton calcify more slowly or dissolve. Accept "ocean acidification interferes with calcification".

        (d) Predict and justify, 1 pt: CO₂ would stop rising and gradually decline, but only over centuries, because the processes that remove it (uptake by the ocean, regrowth of forests, eventual burial as sediment and rock) are slow compared with the rate at which it was added; accept any prediction that distinguishes stopping the increase from reversing it quickly.

        Zero: saying plants "breathe in" CO₂ with no process named; claiming CO₂ is destroyed; a prediction that the atmosphere returns to 280 ppm within years.

    - slug: u08-w29-q18
      type: long_answer
      topic_code: "8.3"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating results. In 1911, 25 reindeer were introduced to a small Alaskan island with no predators, abundant lichen (the reindeer's main winter food) and no human harvest. The population was counted at intervals. Lichen grows back only a few millimetres a year.

        | Year | Reindeer |
        |---|---|
        | 1911 | 25 |
        | 1920 | 250 |
        | 1930 | 1,000 |
        | 1938 | 2,000 |
        | 1942 | 1,500 |
        | 1946 | 300 |
        | 1950 | 8 |

        (a) Describe the pattern in the data, using numbers. (b) Calculate the approximate per-capita growth rate per year between 1911 and 1920, and explain why the growth in this period can be described as exponential. (c) Explain, using the concepts of carrying capacity and density-dependent limitation, why the population collapsed after 1938 rather than levelling off. (d) Identify the factor that limited the population as density-dependent or density-independent and justify your choice. (e) Predict how the population would have behaved if a predator such as wolves had also been introduced in 1911, and justify the prediction with the logistic model.
      answer: |
        Rose from 25 to 2,000 by 1938, then crashed to 8 by 1950. (250 − 25)/9 = 25 per year ÷ 25 = about 1.0 per year, or roughly a tenfold rise in nine years with no resource limit yet. Lichen was consumed far faster than it regrew, so the population overshot K; K then fell because the food base was destroyed, and starvation drove N far below the original K. Density-dependent: the effect of food shortage grew with population size. Wolves would have slowed growth and held the herd nearer K, preventing the overshoot by keeping lichen from being exhausted.
      explanation: |
        Eight points.

        (a) 1 pt: a J-shaped rise from 25 (1911) to about 2,000 (1938), roughly doubling every few years, followed by a collapse to 8 by 1950; at least two numbers must be cited.

        (b) 2 pts: 1 pt for a calculation such as (250 − 25) ÷ 9 ≈ 25 reindeer per year, so r ≈ 25 ÷ 25 ≈ 1.0 per year (accept any method giving 0.25–1.0 per year if the steps are shown, including a doubling-time approach: 25 to 250 is about 3.3 doublings in 9 years); 1 pt for explaining that with no predators, no harvest and abundant food, nothing limited the per-capita rate, so growth followed dN/dt ≈ rmax N and the increments rose with N.

        (c) 2 pts: 1 pt for identifying that the population overshot the carrying capacity set by lichen because the reindeer kept reproducing while the slow-growing lichen was being eaten faster than it recovered; 1 pt for explaining that overgrazing destroyed the food base, so K itself fell, and starvation (deaths far exceeding births, negative (K − N)/K) drove the population well below the original K rather than to it.

        (d) 1 pt: density-dependent, because the shortage of lichen per animal became more severe as the number of reindeer rose; the mortality it caused depended on N. A student who argues that a severe winter contributed (density-independent) earns the point only if they also identify the food shortage as density-dependent.

        (e) 2 pts: 1 pt for predicting slower growth and a population held near, or oscillating around, a lower level without the extreme overshoot; 1 pt for the justification: predation raises the death rate as N rises, so the realised per-capita rate falls earlier, the herd approaches K gradually, and the lichen is not exhausted, so K does not collapse.

        Zero for a part: describing the table without numbers; calling the crash density-independent because "the lichen ran out" without linking the shortage to population size; saying wolves would have "eaten all the reindeer" with no reference to growth rates.

    - slug: u08-w29-q19
      type: multiple_choice
      topic_code: "8.1"
      source: "Biology 2e §45.7 Behavioral Biology: Proximate and Ultimate Causes of Behavior"
      points: 1
      prompt: |
        Review. Chinook salmon migrate from the ocean to the stream where they hatched, spawn once, and die. Which pair correctly gives a proximate and an ultimate explanation of the migration?
      options:
        - "Proximate: the fish follow the chemical signature of their home stream; ultimate: individuals that returned to a proven spawning site left more surviving offspring."
        - "Proximate: salmon want to see their birthplace; ultimate: the stream is cooler."
        - "Proximate: the species needs to survive; ultimate: hormone levels rise in autumn."
        - "Proximate: natural selection favours migration; ultimate: the fish detect day length."
      option_explanations:
        - |
          Correct. The proximate cause is the mechanism (chemotaxis to the imprinted odour of the natal stream); the ultimate cause is the fitness advantage that made the behaviour spread.
        - |
          Wanting is not a mechanism, and a cooler stream is a proximate condition, not an evolutionary reason. Neither half is placed correctly.
        - |
          The order is reversed: a hormonal trigger is proximate, and species survival is not how selection works in any case; selection acts on individual reproductive success.
        - |
          Again reversed: detecting day length is the immediate mechanism (proximate) and the selective advantage is the ultimate explanation.
      answer: 0
      explanation: |
        Proximate answers "how does it happen"; ultimate answers "why did it evolve". Every behaviour question on the exam can be sorted into one of the two.

    - slug: u08-w29-q20
      type: multiple_choice
      topic_code: "3.4"
      source: "Biology 2e §46.3 Biogeochemical Cycles"
      points: 1
      prompt: |
        Review. In the carbon cycle, photosynthesis is the flux that removes CO₂ from the atmosphere. Which statement about the chemistry of that removal is correct?
      options:
        - "CO₂ is reduced to carbohydrate in the Calvin cycle using ATP and NADPH produced by the light-dependent reactions; the oxygen released comes from water, not from CO₂."
        - "CO₂ is split into carbon and oxygen by chlorophyll, and the carbon is stored as coal."
        - "CO₂ is absorbed by the mitochondria and converted into ATP."
        - "CO₂ is combined with oxygen in the thylakoids to make glucose."
      option_explanations:
        - |
          Correct. Carbon fixation reduces inorganic carbon to organic carbon with electrons that originated in water; the O₂ released is the leftover of water splitting in photosystem II.
        - |
          CO₂ is not split; it is reduced and attached to RuBP. Coal forms over millions of years from buried plant matter, not inside a leaf.
        - |
          Mitochondria release CO₂ in respiration; they do not absorb it. ATP is made in both organelles but from energy, not from carbon.
        - |
          Glucose is built in the stroma, not the thylakoid, and from CO₂ plus hydrogen from water; oxygen is a product, not a reactant.
      answer: 0
      explanation: |
        Every arrow in the carbon cycle is a reaction you learned in Unit 3: photosynthesis down into organisms, respiration back up. Knowing the chemistry lets you predict what changes when either is disturbed.

    - slug: u08-w29-q21
      type: multiple_choice
      topic_code: "1.2"
      source: "Biology 2e §46.3 Biogeochemical Cycles"
      points: 1
      prompt: |
        Review. Air is 78% nitrogen, yet nitrogen is the element that most often limits plant growth on land. Which statement connects the chemistry of N₂ to the nitrogen cycle?
      options:
        - "The N≡N triple bond is so strong that only the nitrogenase enzyme of certain prokaryotes can break it, so usable nitrogen enters ecosystems only through bacterial fixation."
        - "Nitrogen gas is too heavy to enter soil, so roots cannot reach it."
        - "Plants cannot use nitrogen in any form and rely on animals to supply protein."
        - "Nitrogen is toxic to plants until bacteria detoxify it."
      option_explanations:
        - |
          Correct. Bond strength is the barrier; the energy and enzyme needed to break the triple bond are found only in nitrogen-fixing bacteria and archaea, so the usable supply, not the total, is small.
        - |
          N₂ (28 g/mol) diffuses through soil air freely and is lighter than CO₂; mass is not the obstacle, chemistry is.
        - |
          Plants take up nitrate and ammonium readily and build all their own amino acids; they are the source of protein for animals, not the reverse.
        - |
          N₂ is inert, not toxic; the problem is that it does nothing, so it must be converted before it can be used.
      answer: 0
      explanation: |
        The Unit 1 fact about the triple bond is the reason the whole nitrogen cycle has a fixation step, and why that step is the one humans now short-circuit with industrial fertiliser.

    - slug: u08-w29-q22
      type: multiple_choice
      topic_code: "7.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. A biologist counts genotypes in a population of 200 reindeer at a locus with alleles A and a: 98 AA, 84 Aa and 18 aa. Treating Hardy-Weinberg as a null hypothesis, which statement is correct?
      options:
        - "p ≈ 0.70 and q ≈ 0.30, so the expected counts are 98 AA, 84 Aa and 18 aa; the observed counts match, so there is no evidence the locus is evolving."
        - "Because the three genotypes are not equally common, the population must be evolving."
        - "The allele frequency of a is 18/200 = 0.09."
        - "Hardy-Weinberg cannot be applied because the population is smaller than 1,000."
      option_explanations:
        - |
          Correct. p = (2 × 98 + 84)/400 = 0.70, q = 0.30; expected AA = 0.49 × 200 = 98, Aa = 0.42 × 200 = 84, aa = 0.09 × 200 = 18. A match with the null expectation means no evidence of selection, drift or non-random mating at this locus.
        - |
          Hardy-Weinberg does not predict equal genotype frequencies; it predicts p², 2pq and q². Unequal counts are expected whenever p ≠ q.
        - |
          18/200 is the frequency of the aa genotype (q²), not of the allele; q = √0.09 = 0.30, or count alleles: (2 × 18 + 84)/400 = 0.30.
        - |
          The equations can be applied to any sample; small size makes drift more likely to disturb the equilibrium, which is a reason to test, not a reason to abstain.
      answer: 0
      explanation: |
        Hardy-Weinberg is used as a null hypothesis: compute expected genotypes from allele frequencies, compare with observed (a chi-square if needed), and only a mismatch is evidence of evolution.

    - slug: u08-w29-q23
      type: multiple_choice
      topic_code: "2.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Soil water around a root contains nitrate at a lower concentration than the root cells' cytoplasm, yet the root keeps absorbing nitrate. Which mechanism must the root be using?
      options:
        - "Active transport through membrane carrier proteins, using ATP to move nitrate against its concentration gradient."
        - "Simple diffusion through the phospholipid bilayer, since nitrate is small."
        - "Osmosis, because nitrate moves with the water."
        - "Facilitated diffusion through channels, which can move ions against a gradient without energy."
      option_explanations:
        - |
          Correct. Moving a solute from low to high concentration is uphill; only energy-coupled transport can do it, and ion uptake by roots is one of the major ATP costs of a plant.
        - |
          Nitrate is a charged ion and cannot cross the hydrophobic core of a bilayer; and diffusion runs down a gradient, not up it.
        - |
          Osmosis is the movement of water, not solutes; water entering cannot drag nitrate against its own gradient.
        - |
          Facilitated diffusion is passive and can only run down a gradient; against a gradient, a channel would leak nitrate out, not in.
      answer: 0
      explanation: |
        Nutrient cycles end at a membrane. Uptake of nitrate and phosphate against their gradients is why roots respire, and why waterlogged, oxygen-poor soils starve plants of nutrients even when the nutrients are present.

    - slug: u08-w29-q24
      type: true_false
      topic_code: "2.7"
      source: "Biology 2e §44.2 Biogeography"
      points: 1
      prompt: |
        Review. True or false: A freshwater fish lives in water that is hypotonic to its body fluids, so it constantly gains water by osmosis and must excrete large volumes of dilute urine to maintain its internal solute concentration.
      answer: true
      explanation: |
        True. In fresh water the external solute concentration is far below the fish's, so water enters across the gills and gut; the kidney responds by producing copious dilute urine while the gills actively take up salts. A marine fish faces the reverse problem and drinks sea water while excreting salt. The same water-potential reasoning from Unit 2 sets where each species can live, one of the abiotic factors in biogeography.

