      type: fill_blank
      topic_code: "3.5"
      source: "Biology 2e §46.3 Biogeochemical Cycles"
      points: 1
      prompt: |
        Review. In the carbon cycle, the process by which organisms, including decomposers, oxidise organic molecules and return carbon to the atmosphere as CO₂ is ____.
      answer: ["cellular respiration", "respiration", "aerobic respiration"]
      explanation: |
        Cellular respiration releases the carbon fixed by photosynthesis, so the biological carbon loop is driven by the two processes you studied in Unit 3. Decomposers respire too, which is how the carbon in dead material gets back to the air. "Decomposition" alone is not accepted: it names the ecological role, and the chemical step that releases CO₂ is respiration.
