week: 31
unit: 8
title: Biodiversity and Disruptions in Ecosystems
topics: ["8.6", "8.7"]
guide: guides/week-31.md
guide_description: |
  How to measure biodiversity with Simpson's index and why evenness matters as much as richness; resistance,
  resilience and the link between diversity and stability; where diversity is concentrated and why. Then the
  disruptions: invasive species, habitat loss, overharvesting, nutrient pollution, climate change read from ice
  cores and the Keeling curve, El Niño, and geological events such as the K-Pg impact. Three worked examples
  (a Simpson's index comparison, the ice-core CO₂ record, a Nile perch cascade), misconceptions, self-check.
flashcards_description: |
  30 cards: the kinds of biodiversity and how to quantify them, resilience vocabulary, and one card for each
  class of ecosystem disruption with its textbook example and numbers.

flashcards:
  - front: Biodiversity → the kinds the CED and the textbook distinguish
    back: |
      Species diversity (how many species and how evenly individuals are spread among them), genetic diversity (variation within a species, the raw material for adaptation), ecosystem diversity (the variety of ecosystems in a region) and, as a consequence of genetic diversity, chemical diversity, the source of many drugs.
    topic_code: "8.6"
  - front: Simpson's diversity index → the AP formula and what a value near 1 means
    back: |
      Diversity index = 1 − Σ (n/N)², where n is the number of individuals of one species and N the total of all species. It is the probability that two individuals drawn at random belong to different species. Near 1 means high diversity; near 0 means one species dominates.
    hint: Square each species' share, add, subtract from one.
    topic_code: "8.6"
  - front: Why does Simpson's index reward evenness as well as richness?
    back: |
      Squaring each species' share makes a dominant species count heavily: one species at 90% contributes 0.81 to the sum by itself, leaving an index below 0.19 whatever else is present. Five species at 20% each give 5 × 0.04 = 0.20 and an index of 0.80. Same richness, very different diversity.
    topic_code: "8.6"
  - front: How to compute Simpson's index from a quadrat count
    back: |
      Total the individuals (N). For each species divide its count by N, square the result, and add the squares. Subtract the sum from 1. Counts of 50, 30 and 20: shares 0.5, 0.3, 0.2; squares 0.25, 0.09, 0.04; sum 0.38; index 0.62.
    topic_code: "8.6"
  - front: Species richness alone → why it can mislead
    back: |
      Richness is just the number of species; a plot with 10 species where one makes up 95% of individuals is rich but functionally almost a monoculture. Evenness, how equally the individuals are shared, is what makes the extra species matter, and an index captures both.
    topic_code: "8.6"
  - front: Resistance vs resilience
    back: |
      Resistance is an ecosystem's ability to stay at equilibrium despite a disturbance (a diverse forest barely changes in a dry year). Resilience is the speed with which it returns to equilibrium after being disturbed (a grassland regrowing after fire). Both are higher in diverse ecosystems.
    topic_code: "8.6"
  - front: Why does higher diversity make an ecosystem more resilient?
    back: |
      Several species usually perform each role (fixing nitrogen, pollinating, decomposing), so if one is lost to disease, drought or a new predator, another with slightly different tolerances carries on. Genetic diversity within species does the same job at the population level. Monocultures have no spare capacity.
    topic_code: "8.6"
  - front: Latitudinal diversity gradient → pattern and the proposed reasons
    back: |
      Species richness of almost every group is highest near the equator and falls toward the poles. Proposed reasons: tropical ecosystems are older, so there has been more time for speciation; more solar energy and productivity; more habitat heterogeneity and niches; a stable climate that allows specialists to persist.
    topic_code: "8.6"
  - front: Biodiversity hotspot → definition and the numbers
    back: |
      A region with at least 1,500 endemic plant species that has lost at least 70% of its original habitat (Norman Myers, 1988). The 34 hotspots cover 2.3% of Earth's land but hold 42% of terrestrial vertebrate species and 50% of plants: Madagascar, the Mediterranean basin, California, New Zealand.
    topic_code: "8.6"
  - front: Genetic diversity → why it matters, and the Irish potato famine
    back: |
      Variation within a species is what selection acts on when conditions change. Ireland grew a single potato variety; when blight arrived nothing resisted it, the crop failed, over a million people died and nearly two million emigrated. Andean farmers growing thousands of varieties never lost everything at once.
    topic_code: "8.6"
  - front: Ecosystem services → examples and one number
    back: |
      Benefits ecosystems provide for free: pollination (honey bees are worth about $1.6 billion a year to US agriculture), water purification by wetlands, soil formation by decomposers, pest control by predators and parasites, carbon storage, flood control. Loss of diversity threatens each.
    topic_code: "8.6"
  - front: How many species are there? → described vs estimated
    back: |
      About 1.5 million eukaryotic species have been described; the estimated total is around 8.7 million, so fewer than 20% are known. At 17,000 to 20,000 new descriptions a year, cataloguing the rest would take about 500 years, and many will go extinct unnamed.
    topic_code: "8.6"
  - front: How does removing a keystone predator change Simpson's index?
    back: |
      The dominant competitor it was suppressing takes over, so one species' share rises toward 1 and the squared term swamps the sum; the index falls even before any species is lost, and falls further as the weaker competitors are excluded. Richness and evenness both decline.
    topic_code: "8.6"
  - front: Disruption of an ecosystem → the categories the CED lists
    back: |
      Invasive species; human activities (habitat loss, overharvesting, pollution, nutrient runoff, fossil-fuel emissions); climate change; geological and meteorological events (volcanic eruptions, meteor impacts, continental drift, El Niño); natural disturbances such as fire and flood. Each changes which species persist and can drive adaptive radiation afterwards.
    topic_code: "8.7"
  - front: Invasive (exotic) species → definition and why they succeed
    back: |
      A species introduced, deliberately or by accident, to an ecosystem where it did not evolve, that then spreads and harms native species. It arrives without the predators, parasites and competitors that controlled it at home, often reproduces fast (r-selected), and meets native species with no evolved defences.
    topic_code: "8.7"
  - front: Four invasive species and what each did
    back: |
      Kudzu, planted for soil conservation in 1876, grows a foot a day and covers 7 million acres of the US South. The brown tree snake, carried to Guam in aircraft about 1950, wiped out three bird and several reptile species. Nile perch, introduced to Lake Victoria in the 1960s, drove about 200 cichlid species extinct. Asian carp now make up 95% of the biomass in parts of the Illinois River.
    topic_code: "8.7"
  - front: Chytrid fungus and white-nose syndrome → disease as an introduced disruption
    back: |
      Batrachochytrium dendrobatidis, spread worldwide with African clawed frogs used in laboratories, causes chytridiomycosis and is a main cause of the global amphibian decline; bullfrogs carry it without dying. The fungus of white-nose syndrome, introduced from Europe, has killed millions of hibernating bats in eastern North America.
    topic_code: "8.7"
  - front: Habitat loss → the leading cause of extinction and its numbers
    back: |
      Clearing, draining and fragmenting habitat removes species faster than any other human activity. Sumatra and Borneo have lost about half their forest to timber and palm oil, endangering orangutans, the Sumatran tiger and elephant; 2.4% of humid tropical forest went in 2000–2005 alone; 91% of US rivers have been dammed, dredged or rerouted.
    topic_code: "8.7"
  - front: Overharvesting → the Atlantic cod collapse and the tragedy of the commons
    back: |
      The cod fishery off eastern Canada fed Europe for 400 years and collapsed within a decade of factory trawlers arriving in the 1980s. When a resource is shared and unregulated, each user gains by taking more and everyone loses when it is gone. Fishery collapse is not biological extinction, but recovery can take decades or never come.
    topic_code: "8.7"
  - front: Biomagnification vs eutrophication → which pollution problem is which
    back: |
      Biomagnification: a persistent toxin (DDT, PCBs, mercury) concentrates up the food chain and hits top consumers hardest. Eutrophication: nutrients (nitrate, phosphate) feed an algal bloom whose decomposition strips oxygen from the water and creates a dead zone. One is about toxins climbing trophic levels, the other about nutrients and oxygen.
    topic_code: "8.7"
  - front: Greenhouse effect → mechanism and the gases
    back: |
      Sunlight passes through the atmosphere and warms the surface; the surface radiates infrared, and greenhouse gases (CO₂, methane, water vapour, nitrous oxide, ozone) absorb and re-emit it back down. More greenhouse gas means more trapped heat. The effect is natural and necessary; human emissions have strengthened it.
    topic_code: "8.7"
  - front: Ice-core and Keeling-curve CO₂ record → the numbers to know
    back: |
      Air bubbles in Antarctic ice show CO₂ cycling between about 180 and 300 ppm over the last 400,000 years, each rise taking tens of thousands of years, with temperature tracking it. Since about 1750 CO₂ has climbed from about 280 ppm to over 400 ppm in under 300 years, far faster than any natural change in the record.
    topic_code: "8.7"
  - front: Documented effects of climate change → glaciers, sea level, timing
    back: |
      Glacier National Park had about 150 glaciers in 1850 and 24 larger than 25 acres by 2010; Greenland and Antarctica are losing 150–250 km³ of ice a year; sea level is rising about 3 mm a year from thermal expansion and meltwater; 385 British plant species now flower 4.5 days earlier than 40 years ago.
    topic_code: "8.7"
  - front: Range shifts and phenological mismatch
    back: |
      As climates warm, species move poleward and uphill (European birds have shifted 91 km north) and seasonal events shift earlier. When a plant flowers before its pollinator emerges, or chicks hatch after the insect peak they depend on, the mismatch lowers reproduction. Mountaintop species run out of uphill.
    topic_code: "8.7"
  - front: El Niño → what it is and what it does to ecosystems
    back: |
      A periodic warming of the eastern tropical Pacific every few years when the trade winds weaken. Warm surface water blocks the upwelling of nutrient-rich deep water off Peru, so phytoplankton, anchovies and the seabirds and sea lions that eat them crash, while rainfall shifts bring floods to some regions and drought and fire to others. A meteorological disruption that acts through productivity.
    topic_code: "8.7"
  - front: Geological and meteorological disruptions → three kinds
    back: |
      Volcanic eruptions bury habitat and cool the climate with ash and sulfur aerosols (the 1783 Icelandic eruptions gave Europe a record-cold winter). Meteor impacts cause mass extinction. Continental drift separates and joins land masses over millions of years, isolating lineages and creating new climates. Each resets which species persist.
    topic_code: "8.7"
  - front: The K-Pg extinction → evidence and effect
    back: |
      About 66 million years ago roughly 75% of species, including the non-avian dinosaurs, disappeared. A layer enriched in iridium, an element rare on Earth but common in meteorites, marks the boundary worldwide, and the impact crater lies off the Yucatan peninsula. Mammals radiated into the emptied niches over the next 10 million years.
    topic_code: "8.7"
  - front: Adaptive radiation after a disruption → why extinction opens doors
    back: |
      A mass extinction or a new island empties niches; surviving lineages with the right pre-adaptations diversify rapidly to fill them. Mammals after the dinosaurs, Darwin's finches on the Galapagos, cichlids in Lake Victoria. Disruption removes competitors, and selection does the rest.
    topic_code: "8.7"
  - front: Fire as a disturbance some ecosystems depend on
    back: |
      Savannas, chaparral and temperate grasslands are maintained by periodic fire: deep-rooted grasses resprout, jack pine cones open only in heat, chaparral seeds germinate after burning, and ash returns nitrogen to the soil. Suppressing fire lets shrubs and trees invade; a disruption can be a community's normal state.
    topic_code: "8.7"
  - front: Why are island and endemic species especially vulnerable?
    back: |
      Endemic species exist in one place, so one local disaster or one introduced predator can remove the whole species. Island species evolved without mainland predators and often lost flight, fear or chemical defences; the dodo on Mauritius and Guam's birds had no response to humans, rats or snakes.
    topic_code: "8.7"

quiz:
  description: |
    24 questions · about 30 minutes · measuring biodiversity with Simpson's index, resistance and resilience,
    and the disruptions of ecosystems from invasive species and habitat loss to climate change and El Niño,
    with a two-quadrat diversity data set, plus spiral review of keystone species, eutrophication,
    photosynthesis, pH, variation, artificial selection and the fossil record. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the two
    short answers and the long answer are graded by your teacher against the acceptable-answer summary.
  questions:
    - slug: u08-w31-q01
      type: numeric
      topic_code: "8.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        Students counted the insects and spiders in one 1 m² quadrat in each of two neighbouring meadow plots. The managed plot had been mown twice a year and fertilised for five years; the unmanaged plot had been left alone for the same period.

        | Species | Managed plot | Unmanaged plot |
        |---|---|---|
        | Grasshopper (species A) | 80 | 25 |
        | Ground beetle (species B) | 10 | 20 |
        | Meadow brown butterfly (species C) | 5 | 20 |
        | Black ant (species D) | 5 | 20 |
        | Wolf spider (species E) | 0 | 15 |
        | Total individuals | 100 | 100 |
      prompt: |
        Calculate Simpson's diversity index for the managed plot using the AP formula, diversity index = 1 − Σ (n/N)². Give your answer to two decimal places.
      answer: { value: 0.345, tolerance: 0.01 }
      explanation: |
        Shares: A 80/100 = 0.80, B 0.10, C 0.05, D 0.05, E 0. Squares: 0.64, 0.01, 0.0025, 0.0025, 0. Sum = 0.655. Index = 1 − 0.655 = 0.345, about 0.35. For comparison the unmanaged plot gives shares of 0.25, 0.20, 0.20, 0.20, 0.15, squares summing to 0.0625 + 0.04 + 0.04 + 0.04 + 0.0225 = 0.205, and an index of 0.795. The managed plot's low value comes almost entirely from the grasshopper's 0.64 term.

    - slug: u08-w31-q02
      type: multiple_choice
      topic_code: "8.6"
      source: "general knowledge"
      points: 1
      stimulus: |
        Students counted the insects and spiders in one 1 m² quadrat in each of two neighbouring meadow plots. The managed plot had been mown twice a year and fertilised for five years; the unmanaged plot had been left alone for the same period.

        | Species | Managed plot | Unmanaged plot |
        |---|---|---|
        | Grasshopper (species A) | 80 | 25 |
        | Ground beetle (species B) | 10 | 20 |
        | Meadow brown butterfly (species C) | 5 | 20 |
        | Black ant (species D) | 5 | 20 |
        | Wolf spider (species E) | 0 | 15 |
        | Total individuals | 100 | 100 |
      prompt: |
        Simpson's index is about 0.35 for the managed plot and about 0.80 for the unmanaged plot. Which statement best explains the difference?
      options:
        - "The unmanaged plot is more diverse because it has both one more species and a far more even spread of individuals, whereas 80% of the managed plot's individuals belong to a single species."
        - "The two plots are equally diverse because both contain 100 individuals."
        - "The managed plot is more diverse because the grasshopper population is larger."
        - "The difference is entirely due to the extra species in the unmanaged plot; evenness does not affect Simpson's index."
      option_explanations:
        - |
          Correct. The index combines richness and evenness, and here both favour the unmanaged plot; the grasshopper's share of 0.80 alone contributes 0.64 to the sum of squares in the managed plot.
        - |
          Total abundance is not diversity; the formula uses each species' share of the total, so two plots with the same N can have very different indices.
        - |
          A large population of one species lowers the index, because its squared share dominates the sum; abundance of one species is the opposite of diversity.
        - |
          Evenness is exactly what the squared terms measure. Remove the spider from the unmanaged plot and spread its 15 individuals evenly and the index still stays near 0.75, far above 0.35.
      answer: 0
      explanation: |
        Richness counts species; evenness asks how the individuals are shared among them. Simpson's index needs both to be high, which is why a plot dominated by one species scores low even with several species present.

    - slug: u08-w31-q03
      type: multiple_choice
      topic_code: "8.6"
      source: "Biology 2e §46.1 Ecology of Ecosystems"
      points: 1
      stimulus: |
        Students counted the insects and spiders in one 1 m² quadrat in each of two neighbouring meadow plots. The managed plot had been mown twice a year and fertilised for five years; the unmanaged plot had been left alone for the same period.

        | Species | Managed plot | Unmanaged plot |
        |---|---|---|
        | Grasshopper (species A) | 80 | 25 |
        | Ground beetle (species B) | 10 | 20 |
        | Meadow brown butterfly (species C) | 5 | 20 |
        | Black ant (species D) | 5 | 20 |
        | Wolf spider (species E) | 0 | 15 |
        | Total individuals | 100 | 100 |
      prompt: |
        A fungal disease that infects only grasshoppers spreads through both plots the following summer. Which prediction about the two plots is best supported by the concepts of resistance and resilience?
      options:
        - "The unmanaged plot will be more resistant, because grasshoppers are only a quarter of its individuals and the other species continue their roles, while the managed plot loses most of its community at once."
        - "The managed plot will be more resistant, because its large grasshopper population can absorb more losses."
        - "Both plots will be affected equally, because the disease infects the same species in each."
        - "Neither plot will be affected, because insect diseases do not alter community structure."
      option_explanations:
        - |
          Correct. In a diverse community the loss of one species removes a small fraction of the individuals and of the functions performed, so the community changes less (resistance) and recovers sooner (resilience); the managed plot has no such buffer.
        - |
          A large population of the susceptible species means more hosts, faster transmission and a larger share of the community lost; abundance of the vulnerable species is a weakness here, not a strength.
        - |
          The disease affects the same species, but that species is 80% of one community and 25% of the other; the effect on each community as a whole is very different.
        - |
          A pathogen that removes the dominant species is a major disturbance; whether the community persists depends on the diversity available to fill the gap.
      answer: 0
      explanation: |
        Diversity is insurance: several species doing overlapping jobs means no single loss is catastrophic. The CED ties ecosystem stability to diversity for exactly this reason.

    - slug: u08-w31-q04
      type: multiple_choice
      topic_code: "8.7"
      source: "general knowledge"
      points: 1
      stimulus: |
        Students counted the insects and spiders in one 1 m² quadrat in each of two neighbouring meadow plots. The managed plot had been mown twice a year and fertilised for five years; the unmanaged plot had been left alone for the same period.

        | Species | Managed plot | Unmanaged plot |
        |---|---|---|
        | Grasshopper (species A) | 80 | 25 |
        | Ground beetle (species B) | 10 | 20 |
        | Meadow brown butterfly (species C) | 5 | 20 |
        | Black ant (species D) | 5 | 20 |
        | Wolf spider (species E) | 0 | 15 |
        | Total individuals | 100 | 100 |
      prompt: |
        Which is the most plausible mechanism by which five years of mowing and fertilising reduced the diversity of the managed plot?
      options:
        - "Fertiliser let a few fast-growing grasses outcompete the flowering plants, and mowing removed flowers and tall structure, so the species that depend on those plants (the butterfly, the spider's prey) declined while a grass-feeding grasshopper flourished."
        - "Fertiliser is directly toxic to all insects except grasshoppers."
        - "Mowing increased the number of plant species, which attracted grasshoppers that ate the other insects."
        - "The managed plot became more diverse in plants, and diverse plants support fewer insects."
      option_explanations:
        - |
          Correct. Human management changed the producers, and the change propagated to the consumers that depend on them; adding a limiting nutrient typically favours dominant competitors and reduces plant diversity, with insect diversity following.
        - |
          Nitrogen and phosphate fertilisers are plant nutrients, not insecticides; their effect on insects is indirect, through the plants.
        - |
          Mowing removes flowering plants and reduces plant diversity rather than increasing it, and grasshoppers are herbivores that do not prey on other insects.
        - |
          Higher plant diversity supports more insect species, not fewer; the direction of the relationship is reversed, and the managed plot's insect data point to fewer plant resources, not more.
      answer: 0
      explanation: |
        Human disruption usually acts through the base of the food web. Change the producers, by nutrient addition, mowing or clearing, and the whole community reorganises above them.

    - slug: u08-w31-q05
      type: multiple_choice
      topic_code: "8.7"
      source: "Biology 2e §47.3 Threats to Biodiversity"
      points: 1
      prompt: |
        Kudzu, introduced to the United States from Japan in 1876 for soil conservation, now covers more than 7 million acres and smothers native trees and shrubs. Which combination of factors best explains why an introduced species can spread so much faster than it does at home?
      options:
        - "It arrives without the herbivores, pathogens and competitors that limit it in its native range, and the native species it meets have not evolved defences against it."
        - "Introduced species always have a higher mutation rate, which lets them adapt faster."
        - "The new habitat is always richer in nutrients than the native one."
        - "Native species deliberately make room for newcomers to increase diversity."
      option_explanations:
        - |
          Correct. Release from natural enemies raises the invader's realised growth rate toward rmax, and naive natives are outcompeted or eaten; kudzu's foot-a-day growth is what it does when nothing is holding it back.
        - |
          Mutation rates do not change on arrival; the invader succeeds with the traits it already has, in a community that lacks what controlled it.
        - |
          Kudzu spread across ordinary southern soils; it is the absence of enemies, not an unusual richness of resources, that makes the difference.
        - |
          Species do not act to raise diversity; invasions typically lower it, as the invader excludes or consumes natives.
      answer: 0
      explanation: |
        Think of an invasion as a population growth problem: the density-dependent factors that held N near K at home are missing, so N climbs toward a new, much higher K at the natives' expense.

    - slug: u08-w31-q06
      type: multiple_choice
      topic_code: "8.7"
      source: "Biology 2e §44.5 Climate and the Effects of Global Climate Change"
      points: 1
      prompt: |
        Air bubbles in Antarctic ice show atmospheric CO₂ cycling between about 180 and 300 ppm over the past 400,000 years, with each rise taking tens of thousands of years. Direct measurements show CO₂ rising from about 280 ppm around 1750 to over 400 ppm today. Which conclusion is best supported?
      options:
        - "The recent rise is unprecedented in rate and has carried CO₂ above any level in the ice record, consistent with a new source, fossil-fuel burning, rather than with the natural cycles."
        - "The recent rise is simply the next natural cycle, since CO₂ has risen before."
        - "CO₂ has no effect on temperature, because it has varied in the past without consequence."
        - "The ice record proves that CO₂ follows temperature and cannot cause warming."
      option_explanations:
        - |
          Correct. Natural rises of about 100 ppm took roughly 50,000 years; the recent rise of over 120 ppm took under 300 years and has passed the 300 ppm ceiling of the record, which no natural driver in the record explains.
        - |
          The natural cycles never exceeded about 300 ppm and moved a hundred times more slowly; a change that differs in both size and speed is not the same phenomenon.
        - |
          The ice cores show temperature tracking CO₂ through every cycle; the past variation is evidence of a link, not of its absence.
        - |
          In the glacial cycles, orbital changes started warming and CO₂ release then amplified it; CO₂ being a feedback in one context does not stop it being a forcing when it is added directly, as it is now.
      answer: 0
      explanation: |
        Read the two time scales. The ice-core cycles are the Milankovitch-driven natural range; the Keeling curve is a departure from it in both rate and level, which is what identifies a new cause.

    - slug: u08-w31-q07
      type: multiple_choice
      topic_code: "8.7"
      source: "Biology 2e §44.5 Climate and the Effects of Global Climate Change"
      points: 1
      prompt: |
        A survey of 385 British plant species found that they now flower an average of 4.5 days earlier than 40 years ago, and that insect-pollinated species have advanced more than wind-pollinated ones. Which consequence for ecosystems does this finding point to?
      options:
        - "A possible phenological mismatch: if flowers open before their pollinators emerge, pollination and seed set fall, threatening both the plants and the insects that depend on their nectar."
        - "Earlier flowering means a longer growing season, so productivity and diversity must increase."
        - "The plants have evolved to flower earlier, so no mismatch is possible."
        - "Wind-pollinated plants are at greater risk, because they advanced less."
      option_explanations:
        - |
          Correct. Timed interactions between species evolved under a stable climate; when the partners respond to warming at different rates, the interaction can fail, which is a documented effect of climate change.
        - |
          A longer season does not help a plant whose pollinator arrives after its flowers have gone; the risk is in the timing of interactions, not the length of the season.
        - |
          A shift of 4.5 days in 40 years is a plastic response to warmer springs, not evolution; and even an evolved shift creates mismatch if the pollinator does not shift equally.
        - |
          Wind-pollinated plants do not depend on an animal partner's timing, so their smaller advance carries less risk; it is the insect-pollinated species whose timing must match another organism's.
      answer: 0
      explanation: |
        Climate change disrupts ecosystems not only by killing but by desynchronising. Any interaction with a schedule, flowering and pollination, hatching and insect emergence, migration and food peaks, is exposed.

    - slug: u08-w31-q08
      type: multiple_choice
      topic_code: "8.7"
      source: "general knowledge"
      points: 1
      prompt: |
        In an El Niño year the trade winds weaken and warm surface water spreads across the eastern Pacific, suppressing the upwelling of cold, nutrient-rich water off the coast of Peru. Which chain of consequences follows for the marine ecosystem there?
      options:
        - "Nutrient supply to the surface falls, phytoplankton productivity collapses, anchovy populations crash, and the seabirds and sea lions that eat anchovies starve or fail to breed."
        - "Warmer water raises phytoplankton productivity, so fish and seabird populations boom."
        - "The anchovies migrate to the warm water, increasing the seabird food supply."
        - "The ecosystem is unaffected because El Niño is a weather event, not a climate change."
      option_explanations:
        - |
          Correct. Upwelling is what makes the Peruvian coast one of the most productive fisheries on Earth; remove the nutrients and the energy entering the food web drops, and the loss passes up every trophic level.
        - |
          Warmth without nutrients does not raise productivity; nitrogen and phosphorus, not temperature, limit phytoplankton in the open ocean, and El Niño cuts their supply.
        - |
          Anchovies depend on the plankton that upwelling feeds; warm, nutrient-poor water holds fewer of them, and the fishery and the birds decline together.
        - |
          Short-term meteorological events are among the disruptions the CED names; a one-year collapse in productivity reshapes populations for years afterwards.
      answer: 0
      explanation: |
        El Niño is the clearest example of a meteorological disruption acting through energy flow: change the nutrient input and the whole pyramid shrinks from the base.

    - slug: u08-w31-q09
      type: multi_select
      topic_code: "8.7"
      source: "Biology 2e §47.3 Threats to Biodiversity"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are disruptions to ecosystems caused directly by human activity? Select all that apply.
      options:
        - "Clearing of Sumatran rainforest for palm-oil plantations"
        - "Collapse of the Atlantic cod fishery after the arrival of factory trawlers"
        - "The spread of chytrid fungus among amphibians through the international trade in African clawed frogs"
        - "The eruption of a volcano that buries a forest in ash"
        - "A dead zone in the Gulf of Mexico fed by fertiliser runoff from the Mississippi"
      option_explanations:
        - |
          Correct. Habitat loss for agriculture is the leading human cause of extinction; the islands of Sumatra and Borneo have lost about half their forest.
        - |
          Correct. Overharvesting with industrial technology took the cod stock below the level from which it could recover.
        - |
          Correct. The pathogen was moved around the world by human transport of a host species; an introduced disease is an introduced species.
        - |
          Volcanism is a geological disruption that would occur with or without people; it belongs to a different category in the CED.
        - |
          Correct. Nutrient pollution from agriculture drives eutrophication and the oxygen depletion that creates dead zones.
      answer: [0, 1, 2, 4]
      explanation: |
        The CED separates human disruptions (habitat loss, overharvesting, introductions, pollution, emissions) from geological and meteorological ones. Both reorganise communities; only the first set is a policy choice.

    - slug: u08-w31-q10
      type: multi_select
      topic_code: "8.6"
      source: "general knowledge"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about Simpson's diversity index, 1 − Σ (n/N)², are correct? Select all that apply.
      options:
        - "It equals the probability that two individuals chosen at random from the community belong to different species."
        - "A community in which every individual belongs to the same species has an index of 0."
        - "Adding a rare species to a community always raises the index more than making the existing species more even."
        - "Two communities with the same number of species can have very different indices."
        - "The index can exceed 1 if the community is very rich."
      option_explanations:
        - |
          Correct. Σ (n/N)² is the probability that two random draws are the same species; one minus that is the probability they differ.
        - |
          Correct. With one species, n/N = 1, the square is 1, and 1 − 1 = 0: no diversity at all.
        - |
          A rare species adds a tiny squared term and barely moves the index; shifting individuals from a dominant species to the others reduces a large squared term and raises the index far more.
        - |
          Correct. Richness fixes only the number of terms; their sizes depend on evenness, so five species at 80/10/5/5/0 and five at 20 each give 0.35 versus 0.80.
        - |
          Σ (n/N)² is at least 1/number of species and at most 1, so the index lies between 0 and just under 1; it cannot exceed 1.
      answer: [0, 1, 3]
      explanation: |
        Treat the index as a probability and the properties follow: 0 for a monoculture, approaching 1 for many equally common species, and most sensitive to the dominant species' share.

    - slug: u08-w31-q11
      type: true_false
      topic_code: "8.7"
      source: "Biology 2e §47.1 The Biodiversity Crisis"
      points: 1
      prompt: |
        True or false: A worldwide layer of sediment enriched in iridium, an element rare in Earth's crust but common in meteorites, is the key evidence that a meteor impact caused the mass extinction at the Cretaceous-Paleogene boundary 66 million years ago.
      answer: true
      explanation: |
        True. The iridium spike, found in 1980, pointed to an extraterrestrial source, and the Chicxulub crater off the Yucatan peninsula, identified in 1991, supplied the impact. About 75% of species, including the non-avian dinosaurs, disappeared, and mammals radiated into the vacated niches over the following 10 million years. Volcanism in India at the same time may have contributed. A meteor impact is the CED's example of a geological event that disrupts ecosystems on a global scale.

    - slug: u08-w31-q12
      type: true_false
      topic_code: "8.6"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: A community with eight species must have a higher Simpson's diversity index than a community with five species.
      answer: false
      explanation: |
        False. Richness is only one input to the index; evenness is the other. Eight species in which one makes up 90% of individuals gives Σ (n/N)² of at least 0.81 and an index below 0.19, while five species at 20% each give an index of 0.80. When comparing communities, calculate; do not count species and stop.

    - slug: u08-w31-q13
      type: fill_blank
      topic_code: "8.7"
      source: "Biology 2e §47.3 Threats to Biodiversity"
      points: 1
      prompt: |
        A species such as the brown tree snake on Guam, introduced to an ecosystem in which it did not evolve and spreading at the expense of native species, is called an ____ species.
      answer: ["invasive", "invasive species", "exotic", "introduced"]
      explanation: |
        Invasive (or exotic, introduced, non-native) species succeed because they arrive without the enemies that limited them at home and meet natives with no evolved defences. The brown tree snake, carried to Guam in aircraft around 1950, eliminated three bird species and several reptiles. "Keystone" is not accepted: a keystone is a native species whose effect maintains diversity, the opposite role.

    - slug: u08-w31-q14
      type: fill_blank
      topic_code: "8.6"
      source: "Biology 2e §46.1 Ecology of Ecosystems"
      points: 1
      prompt: |
        The speed at which an ecosystem returns to its equilibrium after a disturbance such as a fire or flood is its ____.
      answer: ["resilience"]
      explanation: |
        Resilience is recovery speed; resistance is the ability not to change in the first place. Both rise with diversity, because a community with several species in each role has replacements ready. "Stability" is not accepted on its own, because it does not distinguish between resisting change and recovering from it.

    - slug: u08-w31-q15
      type: short_answer
      topic_code: "8.7"
      source: "Biology 2e §47.1 The Biodiversity Crisis"
      points: 4
      prompt: |
        Analyze a case. Lake Victoria held about 500 species of cichlid fish, many of them algae-grazers, when the Nile perch, a large predator, was introduced in the 1960s for fishing. Its population exploded in the 1980s. Since then about 200 cichlid species have gone extinct, algal blooms have become common, and oxygen-depleted zones have spread in the lake's deeper water. Agricultural runoff into the lake also increased over the same decades. (a) Classify the Nile perch introduction as a type of ecosystem disruption and explain why the perch population could grow so rapidly. (b) Explain how the loss of grazing cichlids could lead to algal blooms and oxygen depletion. (c) Explain why it is difficult to separate the effect of the perch from the effect of runoff, and describe one comparison that would help. (d) Predict the effect of the changes on the lake's Simpson's diversity index for fish and justify.
      answer: |
        An invasive species; no predators or competitors in the lake and abundant naive prey. Fewer grazers, more algae; dead algae decomposed by bacteria that consume dissolved oxygen, creating anoxic zones. Both changes happened together and both raise algae; compare parts of the lake, or neighbouring lakes, with runoff but no perch (or the reverse), or examine the timing of blooms relative to the perch explosion. The index falls: 200 species lost and the perch now dominates the fish biomass, so both richness and evenness decline.
      explanation: |
        Four points, one per task.

        (a) Classify and explain, 1 pt: invasive (introduced, exotic) species; it grew rapidly because the lake contained no predator or competitor able to control a large predatory fish, and the cichlids, which had evolved without such a predator, were abundant and defenceless, so the perch's realised growth rate was near rmax.

        (b) Explain, 1 pt: cichlids that grazed algae were eaten, so algal populations were released from herbivory and bloomed; when the extra algae die, bacterial decomposition consumes dissolved oxygen, producing anoxic deep water (the eutrophication chain). Both the release from grazing and the decomposition step are needed.

        (c) Confound and comparison, 1 pt: runoff adds nutrients that also cause blooms, and it rose over the same decades, so a correlation with time cannot attribute the blooms to either cause alone; a comparison such as bays with heavy runoff but few perch versus the reverse, neighbouring lakes with runoff and no perch, or the timing of bloom onset relative to the perch explosion versus the rise in runoff, would help separate them.

        (d) Predict and justify, 1 pt: the index for fish falls, because richness has dropped (about 200 species gone) and evenness has dropped (the Nile perch dominates the biomass), both of which increase Σ (n/N)².

        Zero: calling the perch a keystone species; explaining oxygen loss by the perch "using it up"; a comparison that does not hold one cause constant.

    - slug: u08-w31-q16
      type: short_answer
      topic_code: "8.6"
      source: "Biology 2e §47.1 The Biodiversity Crisis"
      points: 4
      prompt: |
        Argue from data. Biodiversity hotspots were defined in 1988 as regions with at least 1,500 endemic plant species that have lost at least 70% of their original habitat. The 34 recognised hotspots cover 2.3% of Earth's land surface but contain 42% of terrestrial vertebrate species and 50% of plant species. (a) Explain what makes an endemic species particularly vulnerable to extinction. (b) Use the figures to make an argument for concentrating conservation spending on hotspots. (c) Identify one limitation of a hotspot strategy and explain it. (d) Describe how the latitudinal pattern of biodiversity predicts where most hotspots will be found.
      answer: |
        An endemic species lives in only one area, so one local loss removes the whole species. Protecting 2.3% of land safeguards 42% of vertebrates and half of plants, a far better ratio of species per hectare than anywhere else, and these are the species with nowhere else to go. Limits: species outside hotspots, ecosystems and services outside them, climate shifting ranges out of fixed reserves, and the 70% habitat loss means much is already gone. Most hotspots are tropical, because richness and endemism peak near the equator.
      explanation: |
        Four points, one per task.

        (a) Explain, 1 pt: an endemic species has a single, usually small, range, so a disturbance there (clearing, an introduced predator, a drought) can eliminate every individual; there is no other population to recolonise from.

        (b) Argue, 1 pt: a quantitative comparison such as 42% of vertebrates and 50% of plants on 2.3% of land gives roughly 20 times the species per unit area of the rest of the planet, so each hectare protected saves more species, and because these are endemics they cannot be saved anywhere else. Both the ratio and the "nowhere else" point, or an equivalent argument from the numbers, are needed.

        (c) Limitation, 1 pt: any one of: species and ecosystems outside hotspots (and their ecosystem services) receive less protection; the criteria are based on plants and may miss other groups; climate change moves species' ranges outside fixed reserves; the definition requires 70% habitat loss, so much of each hotspot is already degraded; political and enforcement difficulties in tropical countries. The limitation must be explained, not just named.

        (d) Describe, 1 pt: species richness and endemism rise toward the equator (older ecosystems, more energy, more niches, stable climate), so most hotspots are in the tropics and subtropics, such as Madagascar, the Andes and Southeast Asia, with Mediterranean-climate regions as the main temperate exceptions.

        Zero: defining endemic as "endangered"; an argument for hotspots that uses no numbers; a limitation stated as "it is expensive" with no ecological content.

    - slug: u08-w31-q17
      type: long_answer
      topic_code: "8.7"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating results. Zebra mussels, small filter-feeding molluscs from the Caspian Sea region, reached a North American lake in ballast water. Researchers monitored the lake for eight years after their arrival. Native unionid mussels are large, slow-growing filter feeders that live in the same sediments.

        | Year after arrival | Zebra mussels (per m²) | Phytoplankton (μg chlorophyll/L) | Water clarity (m) | Native mussel species present | Native mussel density (per m²) | Yellow perch (relative abundance) |
        |---|---|---|---|---|---|---|
        | 0 | 0 | 12 | 2.0 | 9 | 6.0 | 100 |
        | 2 | 4,000 | 6 | 3.5 | 9 | 3.5 | 95 |
        | 4 | 25,000 | 3 | 5.5 | 7 | 1.2 | 70 |
        | 6 | 30,000 | 2 | 6.5 | 4 | 0.3 | 45 |
        | 8 | 28,000 | 2 | 7.0 | 3 | 0.1 | 40 |

        (a) Describe the trends in the data, using numbers. (b) Explain how the zebra mussels could have caused the changes in phytoplankton and water clarity. (c) Explain two different mechanisms by which zebra mussels could have reduced native mussel species and density. (d) Explain how a decline in phytoplankton could reduce yellow perch, a fish that feeds on zooplankton, even though perch do not eat phytoplankton. (e) The zebra mussel population levelled off at about 28,000–30,000 per m² after year 6. Interpret this in terms of population ecology, and predict one density-dependent factor likely to be acting. (f) Water clarity rose from 2.0 m to 7.0 m. Explain why this change, which looks like an improvement, could reduce the lake's overall diversity.
      answer: |
        Zebra mussels rose to about 30,000/m² and plateaued; phytoplankton fell from 12 to 2 and clarity rose from 2 to 7 m; native species fell from 9 to 3 and density from 6 to 0.1/m²; perch fell by 60%. Filter feeding removed phytoplankton. Natives lost food through competition and were smothered by zebra mussels attaching to their shells. Less phytoplankton means less zooplankton, so less perch food. The plateau is carrying capacity, limited by food (phytoplankton) and space. Clearer water lets light reach the bottom, shifting production to rooted plants and algae and changing which species can live there.
      explanation: |
        Eight points.

        (a) 1 pt: at least three trends with numbers: zebra mussels rose to about 30,000/m² then levelled; phytoplankton fell from 12 to 2 μg/L; clarity rose from 2.0 to 7.0 m; native species fell from 9 to 3 and density from 6.0 to 0.1/m²; perch fell from 100 to 40.

        (b) 1 pt: zebra mussels at tens of thousands per square metre filter huge volumes of water and remove phytoplankton; with fewer suspended cells, light penetrates deeper and clarity rises. Both the removal and its link to clarity are needed.

        (c) 2 pts, 1 per mechanism: competition for food (both groups filter the same phytoplankton, now scarce, and the invader at 30,000/m² takes most of it); physical fouling (zebra mussels attach to the shells of native mussels, blocking their siphons and preventing feeding and movement). Also accept competition for space on the sediment.

        (d) 1 pt: a trophic chain: phytoplankton feed zooplankton, which feed perch; when the base of the pelagic food web shrinks, zooplankton decline and the energy available to perch falls. The decline passes up through a level the perch depend on.

        (e) 2 pts: 1 pt for interpreting the plateau as the zebra mussel population reaching the lake's carrying capacity, with births balancing deaths; 1 pt for a density-dependent factor consistent with the data: food limitation now that phytoplankton is down to 2 μg/L, or competition for attachment space, or disease spreading through the dense bed. Accept slight decline from 30,000 to 28,000 as overshoot.

        (f) 1 pt: clearer water lets light reach the bottom, so production shifts from phytoplankton in open water to rooted plants and bottom algae; species of the open-water food web (zooplankton, perch) lose while bottom species gain, and the lake's community is reorganised rather than simply enriched. Accept an answer that explains the appearance of improvement as a human judgement not matching the ecological change.

        Zero for a part: describing without numbers; saying zebra mussels "ate" the native mussels; attributing the perch decline to zebra mussels eating perch eggs without reference to the food web; calling the plateau extinction or a crash.

    - slug: u08-w31-q18
      type: multiple_choice
      topic_code: "8.5"
      source: "Biology 2e §45.6 Community Ecology"
      points: 1
      prompt: |
        Review. In the intertidal zone, removing the sea star Pisaster allowed mussels to cover the rock and reduced species richness from 15 to 8. Which statement correctly connects this result to the measurement of diversity?
      options:
        - "Simpson's index would fall even before any species was lost, because the mussels' growing share of individuals raises the Σ (n/N)² term, and then fall further as species were excluded."
        - "Simpson's index would be unaffected until the number of species changed, because it measures richness only."
        - "Simpson's index would rise, because the mussel population grew."
        - "Simpson's index cannot be applied to sessile organisms."
      option_explanations:
        - |
          Correct. The index responds to evenness as well as richness; a keystone predator maintains both by keeping the dominant competitor's share small.
        - |
          The index is built from each species' share of the total, so a change in dominance moves it without any change in the species count.
        - |
          Growth of one species' share lowers the index; abundance concentrated in one species is low diversity by definition.
        - |
          The index needs only counts (or percentage cover) per species; it is routinely applied to plants, barnacles and mussels in quadrats.
      answer: 0
      explanation: |
        A keystone species is what keeps a community's evenness high. Lose it and the index drops in two stages: dominance first, extinction second.

    - slug: u08-w31-q19
      type: multiple_choice
      topic_code: "8.2"
      source: "Biology 2e §46.3 Biogeochemical Cycles"
      points: 1
      prompt: |
        Review. The dead zone in the Gulf of Mexico forms each summer where the Mississippi River enters the sea. Which sequence correctly orders the events that create it?
      options:
        - "Fertiliser nitrate and phosphate arrive in runoff; phytoplankton bloom; the dead algae sink and are decomposed by bacteria; bacterial respiration depletes dissolved oxygen; fish and shellfish die or leave."
        - "Fertiliser poisons the fish directly; dead fish decompose; the algae bloom on the nutrients from the fish."
        - "Warm river water reduces oxygen; fish die; algae grow on the dead fish."
        - "Phytoplankton bloom and consume all the oxygen by photosynthesis during the day."
      option_explanations:
        - |
          Correct. Eutrophication is a nutrient problem that becomes an oxygen problem through decomposition; the respiration of bacteria feeding on the bloom is what strips the water of oxygen.
        - |
          Nitrate and phosphate are plant nutrients, not fish poisons at these concentrations; the fish die of oxygen starvation after the bloom decays.
        - |
          Temperature alone does not create an 8,000-square-mile anoxic zone; the oxygen is consumed by decomposers of the nutrient-driven bloom.
        - |
          Photosynthesis produces oxygen; it is the bacterial respiration of the dead bloom, especially in deep water where no light reaches, that consumes it.
      answer: 0
      explanation: |
        Eutrophication links the nutrient cycles of week 29 to the disruptions of this week: an excess of a limiting nutrient is as disruptive as a shortage, because it feeds a bloom that decomposers turn into anoxia.

    - slug: u08-w31-q20
      type: multiple_choice
      topic_code: "3.4"
      source: "Biology 2e §44.4 Aquatic Biomes"
      points: 1
      prompt: |
        Review. Reef-building corals house photosynthetic algae (zooxanthellae) in their tissues. When sea temperature stays too high the corals expel the algae and turn white, and if the water does not cool they starve. Which statement best explains why losing the algae starves the coral?
      options:
        - "The algae's photosynthesis supplies most of the coral's organic carbon and energy; without that input the coral's own feeding cannot meet its metabolic demand."
        - "The algae digest the coral's food for it, like gut bacteria."
        - "The algae provide the calcium carbonate from which the coral builds its skeleton."
        - "The white colour reflects sunlight, so the coral can no longer absorb energy from light itself."
      option_explanations:
        - |
          Correct. The coral-alga relationship is a mutualism in which sugars fixed by the algae feed the animal; bleaching cuts off the producer at the base of the coral's energy budget.
        - |
          Corals capture plankton with their tentacles and digest it themselves; the algae contribute new organic carbon by photosynthesis, not digestion.
        - |
          The coral polyp secretes its own calcium carbonate skeleton; the algae's photosynthesis does assist calcification chemically, but the carbonate is not made by the algae.
        - |
          Animals cannot photosynthesise whatever their colour; the coral was never absorbing light for energy, the algae were.
      answer: 0
      explanation: |
        A reef is an ecosystem whose primary producers live inside its foundation species. Climate change disrupts it by breaking a photosynthetic mutualism, which is Unit 3 chemistry failing inside a Unit 8 community.

    - slug: u08-w31-q21
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Since 1750 the average pH of ocean surface water has fallen from about 8.2 to about 8.1 as it absorbs CO₂. Which statement correctly interprets the size of that change?
      options:
        - "Because pH is logarithmic, a fall of 0.1 units is an increase of about 26% in hydrogen ion concentration, large enough to reduce the carbonate available to shell-building organisms."
        - "A fall of 0.1 units is a 1% change in acidity and biologically negligible."
        - "The ocean has become acidic, since any decrease in pH makes a solution acidic."
        - "The change means the ocean now contains 10% more CO₂."
      option_explanations:
        - |
          Correct. [H⁺] = 10⁻ᵖᴴ, so 10⁻⁸·¹ ÷ 10⁻⁸·² = 10⁰·¹ ≈ 1.26; a seemingly small shift on the pH scale is a substantial shift in chemistry.
        - |
          Reading pH as a linear scale is the standard error; each unit is tenfold, so a tenth of a unit is a factor of about 1.26, not 1.01.
        - |
          pH 8.1 is still basic (above 7). The process is called acidification because the pH is moving toward the acidic end, not because the ocean is acidic.
        - |
          pH measures hydrogen ion concentration, not dissolved CO₂, and the relationship between the two is not a simple percentage; the ocean has in fact absorbed about a quarter of all fossil-fuel CO₂.
      answer: 0
      explanation: |
        The Unit 1 pH arithmetic is what makes ocean acidification a disruption: the carbonate chemistry that corals and plankton depend on is sensitive to hydrogen ion concentration, and that has risen by a quarter.

    - slug: u08-w31-q22
      type: multiple_choice
      topic_code: "7.6"
      source: "Biology 2e §47.1 The Biodiversity Crisis"
      points: 1
      prompt: |
        Review. The fossil record shows five mass extinctions, each followed over millions of years by the appearance of many new species in groups that survived. Which statement about what this pattern shows is correct?
      options:
        - "The fossil record provides evidence that extinction and speciation are ongoing processes, and that the removal of many species opens niches into which surviving lineages radiate."
        - "The fossil record shows that species are fixed and that new ones appear only by special creation after each catastrophe."
        - "Mass extinctions prove that natural selection does not operate, since the fittest species died."
        - "The pattern shows that the same species reappear after each extinction."
      option_explanations:
        - |
          Correct. Fossils document both the disappearance of lineages and the origin of new ones in sequence, and the post-extinction radiations (mammals after the dinosaurs) are speciation into vacated niches.
        - |
          The fossils show gradual and branching change within surviving groups, with transitional forms, which is the opposite of fixity.
        - |
          Selection acts on fitness in a given environment; a sudden global change alters the environment so that previously well-adapted species are no longer suited. Survivors were those with traits that happened to work under the new conditions.
        - |
          Extinct species never reappear; the new species that follow are descendants of survivors, which is why post-extinction faunas differ from those before.
      answer: 0
      explanation: |
        Unit 7's evidence for evolution and Unit 8's disruptions are the same history: a disruption removes species, and the evolutionary processes of Unit 7 fill the gap with new ones, which is why extinction and adaptive radiation are paired in the CED.

    - slug: u08-w31-q23
      type: true_false
      topic_code: "7.11"
      source: "Biology 2e §47.2 The Importance of Biodiversity to Human Life"
      points: 1
      prompt: |
        Review. True or false: A crop grown as a single genetically uniform variety is more likely to be destroyed by a new disease than a crop grown as many varieties, because low genetic variation leaves no individuals with resistance for selection to act on.
      answer: true
      explanation: |
        True. Variation within a population is what allows some individuals to survive a new pressure; the Irish potato crop was a single variety, blight found no resistance, over a million people died and nearly two million emigrated. The same principle, from Unit 7, is why genetic diversity is listed as a component of biodiversity and why seed banks such as the Svalbard vault store thousands of varieties.

    - slug: u08-w31-q24
      type: fill_blank
      topic_code: "7.3"
      source: "Biology 2e §47.2 The Importance of Biodiversity to Human Life"
      points: 1
      prompt: |
        Review. The thousands of potato varieties grown in the Andes, each adapted to a particular altitude, soil and climate, were produced over about 7,000 years by farmers choosing which plants to propagate, a process called ____ selection.
      answer: ["artificial", "artificial selection"]
      explanation: |
        Artificial selection is humans acting as the selective agent, choosing which individuals reproduce; it produced crop and livestock diversity and depends, like natural selection, on heritable variation. That variety is now a resource: wild and traditional crop relatives supply genes for disease resistance when a modern uniform variety fails. "Natural" is not accepted, because the selective agent here is the farmer.
