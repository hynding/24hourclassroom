week: 28
unit: 8
title: Responses to the Environment and Energy Flow
topics: ["8.1", "8.2"]
guide: guides/week-28.md
guide_description: |
  How organisms respond to their environment: innate versus learned behaviour, taxis and kinesis, signalling,
  cooperation and kin selection, and how AP Investigation 12 turns a pill-bug choice chamber into a chi-square
  test. Then the first half of energy flow: autotrophs, gross and net primary productivity, trophic levels and
  why only about a tenth of the energy climbs each step. Three worked examples (a choice-chamber chi-square, a
  Silver Springs energy pyramid, a biomass pyramid that is upside down), misconceptions, self-check.
flashcards_description: |
  30 cards: behaviour vocabulary, learning types, signalling and cooperation, the chi-square set-up for a choice
  chamber, and the productivity and trophic-efficiency terms of energy flow.

flashcards:
  - front: Innate behaviour → defining features and an example
    back: |
      A behaviour with a strong genetic component, performed correctly the first time without practice and largely independent of experience. A newly hatched cuckoo pushing host eggs out of the nest, or a spider spinning its first web.
    hint: Hard-wired; low risk of getting it wrong, but inflexible.
    topic_code: "8.1"
  - front: Learned behaviour → defining features and the trade-off with innate behaviour
    back: |
      A behaviour shaped by experience; flexible and adjustable as the environment changes, but it can be learned wrongly or too late. Innate behaviours are reliable but rigid; learned ones are adaptable but risky.
    topic_code: "8.1"
  - front: Proximate vs ultimate cause of a behaviour
    back: |
      Proximate: the immediate mechanism (a hormone surge, a day-length cue, a neural circuit). Ultimate: the evolutionary reason the behaviour increased fitness. A bird sings in spring because day length raises testosterone (proximate) and because singing attracts mates (ultimate).
    topic_code: "8.1"
  - front: Kinesis vs taxis
    back: |
      Kinesis is undirected movement whose speed or turning rate changes with stimulus intensity (woodlice move more in dry air, so they end up in damp places). Taxis is directed movement toward or away from a stimulus (a moth flying toward light).
    hint: One has a direction; the other only has a rate.
    topic_code: "8.1"
  - front: Phototaxis, chemotaxis and geotaxis → the stimulus each names
    back: |
      Phototaxis: movement with respect to light. Chemotaxis: movement up or down a chemical gradient (Tetrahymena swimming toward an attractant). Geotaxis: movement with respect to gravity. Positive means toward the stimulus, negative means away.
    topic_code: "8.1"
  - front: Fixed action pattern → the stickleback example
    back: |
      A sequence of movements triggered by a sign stimulus and run to completion even if the stimulus is removed. A male three-spined stickleback attacks any red-bottomed object, fish-shaped or not, because red belly is the sign stimulus.
    topic_code: "8.1"
  - front: Phototropism and photoperiodism → two plant responses to the environment
    back: |
      Phototropism: a shoot bends toward light because auxin accumulates on the shaded side and those cells elongate. Photoperiodism: a plant times flowering by the length of the uninterrupted dark period, measured with the pigment phytochrome. Plants respond without a nervous system.
    topic_code: "8.1"
  - front: Habituation
    back: |
      A simple form of learning in which an animal stops responding to a repeated stimulus that brings neither reward nor harm. Prairie dogs stop alarm-calling at human footsteps but still call at a hawk.
    topic_code: "8.1"
  - front: Imprinting → the ducklings and the crane costume
    back: |
      Rapid learning limited to a critical period early in life, in which a young animal fixes on the first large moving object as its parent. Ducklings follow a human if they see one first; whooping-crane chicks are raised by keepers in full crane costume so they do not imprint on people.
    topic_code: "8.1"
  - front: Classical conditioning → Pavlov's four terms
    back: |
      Unconditioned stimulus (food) produces an unconditioned response (salivation). A neutral stimulus (bell) paired repeatedly with food becomes a conditioned stimulus that alone produces the conditioned response (salivating at the bell).
    topic_code: "8.1"
  - front: Operant conditioning → the Skinner box
    back: |
      Learning in which a behaviour is strengthened or weakened by its consequences. A rat that presses a lever and gets food presses it more often; positive and negative reinforcement keep modifying the behaviour. Dolphins at marine parks are trained this way.
    topic_code: "8.1"
  - front: Cognitive learning → Kohler's chimpanzees
    back: |
      Learning by mentally manipulating information rather than by trial and error. Kohler's chimpanzees stacked boxes to reach hanging bananas, apparently visualising the result before acting. Tolman's rats built cognitive maps of mazes.
    topic_code: "8.1"
  - front: Pheromone → definition and three uses
    back: |
      A chemical signal secreted by one individual that changes the behaviour of another member of the same species. Used to attract mates, to raise an alarm, and to mark trails to food (ants) or territory.
    topic_code: "8.1"
  - front: Honeybee waggle dance → what it encodes
    back: |
      A returning forager dances on the comb: the angle of the waggle run relative to vertical gives the direction of food relative to the sun, and the duration of the run gives the distance. The colony's foraging efficiency rises, which is the fitness pay-off.
    topic_code: "8.1"
  - front: Why must a signal be received to affect fitness?
    back: |
      A courtship display, song or pheromone only changes behaviour if another individual detects and responds to it. Communication is a signal plus a response; selection acts on both the sender's signal and the receiver's response, and the response is what alters survival or reproduction.
    topic_code: "8.1"
  - front: Altruism and kin selection → why sterile worker bees make evolutionary sense
    back: |
      Altruism lowers the actor's own fitness and raises another's. Kin selection explains it: helping relatives passes on shared genes. Workers rear the queen's offspring, who carry the workers' genes, so their inclusive fitness is high even though they never reproduce.
    topic_code: "8.1"
  - front: Reciprocal altruism → the conditions it needs
    back: |
      Unrelated individuals help each other with the expectation of future return, as when monkeys groom each other. It requires repeated encounters, recognition of individuals, and some way of punishing cheaters; otherwise cheating wins.
    topic_code: "8.1"
  - front: Cooperative behaviour → how it raises fitness
    back: |
      Pack hunting lets wolves take prey no single wolf could; alarm calls warn group members; schooling confuses predators. Each individual's probability of surviving and reproducing is higher in the group than alone, so the behaviour is favoured by natural selection.
    topic_code: "8.1"
  - front: Choice chamber → what AP Investigation 12 measures and its null hypothesis
    back: |
      Two connected chambers differ in one condition (wet vs dry, light vs dark). Animals are released in equal numbers and their positions counted over time. Null hypothesis: the animals show no preference, so equal numbers are expected on each side.
    topic_code: "8.1"
  - front: Chi-square on choice-chamber data → formula and degrees of freedom
    back: |
      χ² = Σ (observed − expected)² / expected, summed over the chambers. Degrees of freedom = number of categories − 1, so two chambers give df = 1 and a critical value of 3.84 at p = 0.05. A χ² above the critical value rejects the null hypothesis of no preference.
    topic_code: "8.1"
  - front: Photoautotroph vs chemoautotroph
    back: |
      Both build organic molecules from inorganic carbon. Photoautotrophs (plants, algae, cyanobacteria) use light energy; chemoautotrophs (vent bacteria) oxidise inorganic molecules such as hydrogen sulfide. Either way the autotroph is the base of its food web.
    topic_code: "8.2"
  - front: Gross primary productivity vs net primary productivity
    back: |
      GPP is the rate at which producers capture energy by photosynthesis. NPP = GPP − the producers' own respiration. At Silver Springs, GPP was 20,810 kcal/m²/yr and NPP 7,633, so producers used about two thirds of what they captured just to stay alive.
    topic_code: "8.2"
  - front: Why is NPP, not GPP, the energy available to consumers?
    back: |
      Energy a producer respires has already left as heat and work; only the energy stored in new biomass is there to be eaten. Consumers can only ever eat net production.
    topic_code: "8.2"
  - front: Trophic level transfer efficiency → formula and the Silver Springs value
    back: |
      TLTE = (production at one trophic level ÷ production at the level below) × 100. Primary consumers at Silver Springs produced 1,103 kcal/m²/yr from 7,633 available, about 14%. Most ecosystems fall between 5% and 20%.
    topic_code: "8.2"
  - front: The 10% rule → what it says and why it is only a rule of thumb
    back: |
      Roughly a tenth of the energy at one trophic level ends up as biomass at the next. The rest is respired as heat, never eaten, or egested. Real values range from about 5% to 20%, so treat 10% as an estimate, not a law.
    topic_code: "8.2"
  - front: Why do food chains rarely exceed four or five links?
    back: |
      With about 10% passing each step, 10,000 kcal of producer becomes 1,000 in herbivores, 100 in first carnivores, 10 in second carnivores and 1 in a third. After four to six transfers there is too little energy to support another level's population.
    topic_code: "8.2"
  - front: Net production efficiency → ectotherm vs endotherm
    back: |
      NPE = (net consumer productivity ÷ assimilation) × 100, the share of assimilated energy that becomes new biomass. Ectotherms are about ten times more efficient (caterpillar 18%) than endotherms (squirrel 1.6%) because endotherms burn most assimilated energy generating body heat.
    topic_code: "8.2"
  - front: Pyramid of energy vs pyramid of biomass → which can be inverted and why
    back: |
      An energy pyramid is always upright because energy is lost at every transfer. A biomass pyramid can be inverted in water: English Channel phytoplankton (4 g/m²) support 21 g/m² of zooplankton because the phytoplankton reproduce and are eaten so fast that their standing crop stays small.
    topic_code: "8.2"
  - front: Metabolic rate per unit mass vs body size
    back: |
      Smaller organisms have a higher metabolic rate per gram than larger ones; a mouse burns far more energy per gram per hour than an elephant. Small endotherms lose heat fast through a large surface-to-volume ratio, so they must eat almost constantly.
    topic_code: "8.2"
  - front: Biomagnification → mechanism and the DDT example
    back: |
      A persistent, fat-soluble toxin is not broken down or excreted, so each consumer accumulates everything its prey contained. Concentration rises at each trophic level; DDT in fish-eating birds thinned eggshells and crashed populations until it was banned in the 1970s.
    topic_code: "8.2"

quiz:
  description: |
    24 questions · about 30 minutes · behaviour as a response to the environment, a choice-chamber data set with
    its chi-square, and the first half of energy flow, with spiral review of respiration, photosynthesis,
    signalling, water, natural selection and cell size. Multiple choice, select-all, true/false and numeric items
    are graded at once; fill-in-the-blank items are matched automatically; the two short answers and the long
    answer are graded by your teacher against the acceptable-answer summary.
  questions:
    - slug: u08-w28-q01
      type: multiple_choice
      topic_code: "8.1"
      source: "Biology 2e §45.7 Behavioral Biology: Proximate and Ultimate Causes of Behavior"
      points: 1
      stimulus: |
        Students built a choice chamber from two petri-dish halves joined by a short tunnel. One side was lined with damp filter paper, the other with dry filter paper; both were covered so light was equal. Ten pill bugs (isopods) were placed five on each side and the number on each side was counted every two minutes. The trial was then repeated with three more groups of ten, and the position of all 40 animals at minute 10 was pooled.

        | Minute | On damp side | On dry side |
        |---|---|---|
        | 0 | 5 | 5 |
        | 2 | 6 | 4 |
        | 4 | 7 | 3 |
        | 6 | 8 | 2 |
        | 8 | 9 | 1 |
        | 10 | 9 | 1 |

        Pooled position of all 40 animals at minute 10: damp side 31, dry side 9. Students also noted that animals on the dry side walked faster and turned less often than animals on the damp side, which mostly stopped moving.
      prompt: |
        Which conclusion is best supported by the data from the first group of ten animals?
      options:
        - "Pill bugs end up in the damp chamber because they respond to moisture, an abiotic environmental cue."
        - "Pill bugs are attracted to the tunnel and pass through it at random, so the counts are noise."
        - "The damp side was warmer, and the animals were responding to temperature rather than moisture."
        - "The animals learned over ten minutes that the damp side was safer."
      option_explanations:
        - |
          Correct. The only variable that differed between the sides was moisture, and the count on the damp side rose steadily from 5 to 9, so the distribution is a response to that cue.
        - |
          Random passage would leave the counts hovering around 5 and 5; a steady one-way drift to 9 and 1 is not what chance produces.
        - |
          Nothing in the design or the data mentions temperature; inventing a second variable that was not measured is not a conclusion the data support, and the sides were covered and treated identically apart from the paper.
        - |
          Learning requires experience with a consequence; the animals were not rewarded or harmed on either side. Moving to moisture is an innate response, not something acquired in ten minutes.
      answer: 0
      explanation: |
        A choice chamber isolates one abiotic variable. When the count on one side climbs steadily while everything else is held equal, the organism is responding to that variable (CED 8.1: organisms respond to environmental cues through behaviour).

    - slug: u08-w28-q02
      type: multiple_choice
      topic_code: "8.1"
      source: "Biology 2e §45.7 Behavioral Biology: Proximate and Ultimate Causes of Behavior"
      points: 1
      stimulus: |
        Students built a choice chamber from two petri-dish halves joined by a short tunnel. One side was lined with damp filter paper, the other with dry filter paper; both were covered so light was equal. Ten pill bugs (isopods) were placed five on each side and the number on each side was counted every two minutes. The trial was then repeated with three more groups of ten, and the position of all 40 animals at minute 10 was pooled.

        | Minute | On damp side | On dry side |
        |---|---|---|
        | 0 | 5 | 5 |
        | 2 | 6 | 4 |
        | 4 | 7 | 3 |
        | 6 | 8 | 2 |
        | 8 | 9 | 1 |
        | 10 | 9 | 1 |

        Pooled position of all 40 animals at minute 10: damp side 31, dry side 9. Students also noted that animals on the dry side walked faster and turned less often than animals on the damp side, which mostly stopped moving.
      prompt: |
        The observation that animals walked faster on the dry side and stopped on the damp side suggests which mechanism for the final distribution?
      options:
        - "A kinesis: movement is undirected, but its speed depends on moisture, so animals keep moving until they happen to reach the damp side and then stay."
        - "A taxis: each animal detects the direction of the damp side from a distance and walks straight toward it."
        - "A fixed action pattern released by the sign stimulus of dry paper."
        - "Habituation to the dry paper after repeated contact."
      option_explanations:
        - |
          Correct. In a kinesis the stimulus changes the rate of movement, not its direction; fast, straight walking in dry conditions and stopping in damp conditions produces accumulation on the damp side without any sense of direction.
        - |
          A taxis would show animals turning toward the damp side and walking directly to it; the description of faster, straighter movement on the dry side and stopping on the damp side is about rate, not orientation.
        - |
          A fixed action pattern is a stereotyped sequence that runs to completion once triggered, like a stickleback attack. Changing walking speed with humidity is a continuous adjustment, not a released sequence.
        - |
          Habituation is a decline in response to a repeated harmless stimulus; the animals did not stop responding to dryness, they responded to it more, by moving faster.
      answer: 0
      explanation: |
        Kinesis and taxis both produce aggregation, but by different mechanisms. The question to ask of any movement data is whether the animal oriented (taxis) or merely changed how much it moved (kinesis).

    - slug: u08-w28-q03
      type: numeric
      topic_code: "8.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        Students built a choice chamber from two petri-dish halves joined by a short tunnel. One side was lined with damp filter paper, the other with dry filter paper; both were covered so light was equal. Ten pill bugs (isopods) were placed five on each side and the number on each side was counted every two minutes. The trial was then repeated with three more groups of ten, and the position of all 40 animals at minute 10 was pooled.

        | Minute | On damp side | On dry side |
        |---|---|---|
        | 0 | 5 | 5 |
        | 2 | 6 | 4 |
        | 4 | 7 | 3 |
        | 6 | 8 | 2 |
        | 8 | 9 | 1 |
        | 10 | 9 | 1 |

        Pooled position of all 40 animals at minute 10: damp side 31, dry side 9. Students also noted that animals on the dry side walked faster and turned less often than animals on the damp side, which mostly stopped moving.
      prompt: |
        Using the pooled minute-10 data for all 40 animals and the null hypothesis that the animals have no preference, calculate the chi-square value. Use χ² = Σ (o − e)² / e and give your answer to one decimal place.
      answer: { value: 12.1, tolerance: 0.2 }
      explanation: |
        Under the null hypothesis the 40 animals split 20 and 20. Damp side: (31 − 20)² / 20 = 121 / 20 = 6.05. Dry side: (9 − 20)² / 20 = 121 / 20 = 6.05. χ² = 6.05 + 6.05 = 12.1. Note that the expected values come from the null hypothesis, not from the data, and that both chambers contribute a term even though the deviations are mirror images.

    - slug: u08-w28-q04
      type: multiple_choice
      topic_code: "8.1"
      source: "general knowledge"
      points: 1
      stimulus: |
        Students built a choice chamber from two petri-dish halves joined by a short tunnel. One side was lined with damp filter paper, the other with dry filter paper; both were covered so light was equal. Ten pill bugs (isopods) were placed five on each side and the number on each side was counted every two minutes. The trial was then repeated with three more groups of ten, and the position of all 40 animals at minute 10 was pooled.

        | Minute | On damp side | On dry side |
        |---|---|---|
        | 0 | 5 | 5 |
        | 2 | 6 | 4 |
        | 4 | 7 | 3 |
        | 6 | 8 | 2 |
        | 8 | 9 | 1 |
        | 10 | 9 | 1 |

        Pooled position of all 40 animals at minute 10: damp side 31, dry side 9. Students also noted that animals on the dry side walked faster and turned less often than animals on the damp side, which mostly stopped moving.
      prompt: |
        The chi-square value for the pooled data is about 12.1. The critical value at p = 0.05 with one degree of freedom is 3.84. Which statement is the correct interpretation?
      options:
        - "The null hypothesis is rejected: a split this uneven would arise by chance in fewer than 5% of trials, so the animals show a real preference for moisture."
        - "The null hypothesis is accepted: 12.1 is larger than 3.84, so the result is consistent with no preference."
        - "The test is invalid because the experiment has two chambers and therefore two degrees of freedom."
        - "The chi-square value proves that moisture is the only variable that could ever influence pill-bug movement."
      option_explanations:
        - |
          Correct. A calculated χ² larger than the critical value means the observed deviation from the expected 20:20 split is too large to attribute to sampling chance at the 5% level, so the no-preference hypothesis is rejected.
        - |
          The direction is backwards: a χ² above the critical value is evidence against the null hypothesis, not for it. Accepting it here would mean ignoring a deviation that chance produces less than one time in twenty.
        - |
          Degrees of freedom are the number of categories minus one. Two chambers give 2 − 1 = 1, and 3.84 is the correct critical value for df = 1.
        - |
          Rejecting one null hypothesis says nothing about other variables; the test only shows that the observed split is unlikely under no preference in this set-up. Temperature, light or texture would each need their own experiment.
      answer: 0
      explanation: |
        The chi-square logic is the same here as in genetics: compare the calculated value with the critical value for the right df; above it, reject the null; below it, fail to reject. What changes is only where the expected values come from, here an equal split from the no-preference hypothesis.

    - slug: u08-w28-q05
      type: multiple_choice
      topic_code: "8.1"
      source: "Biology 2e §45.7 Behavioral Biology: Proximate and Ultimate Causes of Behavior"
      points: 1
      prompt: |
        A male three-spined stickleback in breeding colour attacks a crude wooden model with a red underside but ignores a lifelike model of a male stickleback painted without red. Which interpretation is best?
      options:
        - "The attack is a fixed action pattern released by a sign stimulus, the red belly; the behaviour is innate and runs regardless of how fish-like the object is."
        - "The fish has learned by operant conditioning that red objects are rivals and wooden ones are safe."
        - "The fish is showing habituation to the lifelike model after repeated exposure."
        - "The fish is imprinting on the red model as a potential mate."
      option_explanations:
        - |
          Correct. A fixed action pattern is triggered by a specific sign stimulus and is largely independent of experience; the red patch, not the overall shape, is what the circuit responds to.
        - |
          Operant conditioning would need the fish to have been reinforced for attacking red objects; naive males do this on first exposure, which is the hallmark of innate behaviour.
        - |
          Habituation is a fading response to a repeated stimulus; the fish never responded to the realistic model, because it lacks the releasing stimulus, not because it became bored with it.
        - |
          Imprinting is parent or mate recognition fixed in a critical period early in life; a territorial attack on a rival-coloured object is aggression, not attachment.
      answer: 0
      explanation: |
        The classic test for an innate behaviour is whether a naive animal performs it correctly on the first exposure to a simple cue. The stickleback shows how much of behaviour can be keyed to a single stimulus feature.

    - slug: u08-w28-q06
      type: multiple_choice
      topic_code: "8.2"
      source: "Biology 2e §46.2 Energy Flow through Ecosystems"
      points: 1
      prompt: |
        At Silver Springs, Florida, the producers' gross primary productivity was measured at 20,810 kcal/m²/yr and their net primary productivity at 7,633 kcal/m²/yr. What happened to the difference of about 13,000 kcal/m²/yr?
      options:
        - "It was used by the producers themselves in cellular respiration and left the system as heat."
        - "It was eaten by primary consumers before it could be counted as net productivity."
        - "It was stored as dead organic matter and passed to decomposers."
        - "It was reflected by the leaves and never entered the plants."
      option_explanations:
        - |
          Correct. NPP = GPP − producer respiration. Plants spend most of the energy they capture maintaining themselves, and that energy is released as heat and cannot be eaten.
        - |
          Energy eaten by consumers comes out of net productivity, not out of the gap between gross and net; consumers can only eat biomass that was actually built.
        - |
          Dead plant matter is part of net production that goes to the detrital food web; the GPP−NPP difference was never built into biomass at all.
        - |
          Reflected light never counts in GPP, which is defined as energy actually fixed by photosynthesis. The 20,810 figure is what was captured, not what arrived.
      answer: 0
      explanation: |
        Gross is what photosynthesis captures; net is what is left after the producer's own respiration. Only net primary productivity is on the menu for the rest of the ecosystem.

    - slug: u08-w28-q07
      type: multiple_choice
      topic_code: "8.2"
      source: "Biology 2e §46.2 Energy Flow through Ecosystems"
      points: 1
      prompt: |
        The energy pyramid for Silver Springs gives 3,368 kcal/m²/yr at the primary-consumer level, 383 at the secondary-consumer level and 21 at the tertiary-consumer level. Which statement about these transfers is correct?
      options:
        - "About 11% of primary-consumer energy reached secondary consumers and about 5% of secondary-consumer energy reached tertiary consumers, both within the usual 5–20% range."
        - "Exactly 10% of the energy passed at each step, which is why the 10% rule is called a rule."
        - "The tertiary consumers received so little energy because they are ectotherms."
        - "The missing energy at each level is recycled by decomposers back to the producers."
      option_explanations:
        - |
          Correct. 383 ÷ 3,368 ≈ 0.11 and 21 ÷ 383 ≈ 0.055. Transfer efficiency varies from level to level and ecosystem to ecosystem; 10% is an approximation to this range.
        - |
          The numbers give 11.4% and 5.5%, not 10% at each step. The rule is a rule of thumb for order-of-magnitude estimates, not an exact constant.
        - |
          Ectotherms are more efficient, not less, at turning assimilated energy into biomass. The small value reflects cumulative losses through two transfers, not the physiology of the top level.
        - |
          Decomposers recycle matter, not energy. Energy lost as heat in respiration is gone from the ecosystem; it is not returned to the producers, who must capture new light.
      answer: 0
      explanation: |
        Always compute the ratio the question asks for before choosing. Energy pyramids are upright because each ratio is well under one, and after a few steps there is too little left to feed another level.

    - slug: u08-w28-q08
      type: multiple_choice
      topic_code: "8.2"
      source: "Biology 2e §46.2 Energy Flow through Ecosystems"
      points: 1
      prompt: |
        In the English Channel the standing biomass of phytoplankton is about 4 g/m² while that of the zooplankton that eat them is about 21 g/m². How can the consumers outweigh the producers without violating the laws of energy flow?
      options:
        - "Phytoplankton reproduce and are eaten so rapidly that their biomass at any instant is small although their productivity over a year is far larger than the zooplankton's."
        - "Zooplankton are chemoautotrophs and do not depend on the phytoplankton for energy."
        - "Energy flows upward from consumers to producers in marine ecosystems."
        - "The measurement must be wrong, because biomass pyramids are always upright."
      option_explanations:
        - |
          Correct. A biomass pyramid is a snapshot of standing crop; an energy pyramid is a rate over time. A small, fast-turning-over producer population can support a larger, slower consumer population, so biomass can invert while energy cannot.
        - |
          Zooplankton are heterotrophs that graze phytoplankton; chemoautotrophy belongs to bacteria at vents and in sediments, not to animal plankton.
        - |
          Energy never flows up a food chain; producers capture it from light and it is lost at every transfer. The inversion is in biomass, not in energy.
        - |
          Inverted biomass pyramids are well documented in aquatic systems. The error is in assuming a snapshot of mass behaves like a rate of energy flow.
      answer: 0
      explanation: |
        Energy pyramids are always upright; biomass and numbers pyramids can be inverted when the lower level turns over much faster than the level above. Ask whether a figure is a rate or a snapshot.

    - slug: u08-w28-q09
      type: multi_select
      topic_code: "8.1"
      source: "Biology 2e §45.7 Behavioral Biology: Proximate and Ultimate Causes of Behavior"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are examples of innate behaviour? Select all that apply.
      options:
        - "A moth flies toward a porch light on its first night as an adult."
        - "A male stickleback attacks a red-bottomed model it has never seen before."
        - "Prairie dogs stop alarm-calling at the footsteps of a familiar, harmless person."
        - "Ducklings follow a farmer who was the first moving object they saw after hatching."
        - "A newly hatched spider spins a web of its species' pattern with no model to copy."
      option_explanations:
        - |
          Correct. Positive phototaxis on first exposure, with no opportunity to learn, is the signature of a genetically programmed response.
        - |
          Correct. The attack is a fixed action pattern released by a sign stimulus, performed correctly by naive males.
        - |
          This is habituation, a learned decline in response to a repeated stimulus that proves harmless; the prairie dogs still call at predators, so the change came from experience.
        - |
          Following the farmer is imprinting, a form of learning in a critical period; which object is followed depends entirely on experience, even though the readiness to imprint is innate.
        - |
          Correct. Web-building is species-typical and performed correctly without practice or a model, the classic test for innate behaviour.
      answer: [0, 1, 4]
      explanation: |
        The test for innate: is the behaviour performed correctly the first time, by naive individuals, without experience? Habituation and imprinting fail that test even though the capacity for them is inherited.

    - slug: u08-w28-q10
      type: multi_select
      topic_code: "8.2"
      source: "Biology 2e §46.2 Energy Flow through Ecosystems"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about energy and matter in an ecosystem are correct? Select all that apply.
      options:
        - "Energy enters as light or inorganic chemical energy, passes through the food web once, and leaves as heat."
        - "Decomposers return the energy in dead organisms to the producers so that it can be used again."
        - "Nutrients such as carbon and nitrogen are recycled between organisms and the abiotic environment."
        - "A pyramid of energy is always widest at the producer level."
        - "Chemoautotrophs at hydrothermal vents are heterotrophs because they live in the dark."
      option_explanations:
        - |
          Correct. Energy flow is one way: captured by autotrophs, transferred with losses at each level, and dissipated as heat through respiration at every step.
        - |
          Decomposers recycle matter, not energy. The energy they obtain from dead organic material is respired as heat like everyone else's; producers must capture new energy from light or chemicals.
        - |
          Correct. Matter cycles: the same carbon atom can move from CO₂ to glucose to a consumer to a decomposer and back to CO₂ indefinitely.
        - |
          Correct. Because energy is lost at every transfer, each level has less than the one below; this is why the energy pyramid, unlike a biomass pyramid, can never be inverted.
        - |
          Chemoautotrophs are autotrophs: they fix inorganic carbon using energy from oxidising inorganic molecules such as hydrogen sulfide. Living in the dark changes the energy source, not the trophic role.
      answer: [0, 2, 3]
      explanation: |
        The sentence to memorise: energy flows, matter cycles. Every wrong answer about ecosystems that involves energy being recycled or stored indefinitely is the same mistake.

    - slug: u08-w28-q11
      type: true_false
      topic_code: "8.1"
      source: "Biology 2e §45.7 Behavioral Biology: Proximate and Ultimate Causes of Behavior"
      points: 1
      prompt: |
        True or false: Sterile worker honeybees can increase their own inclusive fitness by rearing the queen's offspring, because those offspring share many of the workers' genes.
      answer: true
      explanation: |
        True. Kin selection explains altruism toward relatives: a gene that makes a worker help its sisters is passed on through the queen's reproduction even though the worker never breeds. Inclusive fitness counts the copies of one's genes passed on by relatives, weighted by relatedness, not only one's own offspring.

    - slug: u08-w28-q12
      type: true_false
      topic_code: "8.2"
      source: "general knowledge"
      points: 1
      prompt: |
        True or false: Gram for gram, a shrew has a lower metabolic rate than a horse, because a small animal has less tissue to maintain.
      answer: false
      explanation: |
        False. Metabolic rate per unit mass rises as body size falls. A shrew's large surface-area-to-volume ratio loses heat quickly, so each gram of shrew must respire far faster than each gram of horse to hold body temperature; shrews eat close to their own mass in food each day. Total metabolic rate is of course larger in the horse, which is the confusion the statement invites.

    - slug: u08-w28-q13
      type: fill_blank
      topic_code: "8.1"
      source: "Biology 2e §45.7 Behavioral Biology: Proximate and Ultimate Causes of Behavior"
      points: 1
      prompt: |
        A chemical secreted by one ant that causes other ants of the same colony to follow a trail to food is an example of a ____.
      answer: ["pheromone", "pheromones"]
      explanation: |
        A pheromone is a chemical signal released by one individual that changes the behaviour of another member of the same species. Trail-marking, alarm and mate attraction are the standard examples. "Hormone" is not accepted: hormones act inside the body of the individual that made them, pheromones act between individuals.

    - slug: u08-w28-q14
      type: fill_blank
      topic_code: "8.2"
      source: "Biology 2e §46.2 Energy Flow through Ecosystems"
      points: 1
      prompt: |
        The energy that producers store as new biomass after subtracting what they use in their own respiration is called ____ primary productivity.
      answer: ["net", "net primary productivity", "NPP"]
      explanation: |
        Net primary productivity is gross primary productivity minus producer respiration; it is the energy actually available to herbivores and decomposers. "Gross" would be the total captured, before the plants' own costs. On data questions, check which of the two a table reports before you calculate a transfer efficiency.

    - slug: u08-w28-q15
      type: short_answer
      topic_code: "8.2"
      source: "Biology 2e §46.2 Energy Flow through Ecosystems"
      points: 4
      prompt: |
        Analyze data. The table gives the energy content of each trophic level of the Silver Springs ecosystem, in kcal/m²/yr.

        | Trophic level | Energy (kcal/m²/yr) |
        |---|---|
        | Producers (gross primary productivity) | 20,810 |
        | Primary consumers | 3,368 |
        | Secondary consumers | 383 |
        | Tertiary consumers | 21 |
        | Decomposers | 5,060 |

        (a) Calculate the percentage of primary-consumer energy that reached the secondary consumers. (b) Explain, with two specific fates, what happened to the energy that did not reach the next level. (c) Explain why this ecosystem is unlikely to support a fourth level of consumer. (d) Explain why the decomposers received more energy than the secondary and tertiary consumers combined.
      answer: |
        383 ÷ 3,368 ≈ 11%; the rest was respired as heat or was never eaten or was egested; after two more ~10% steps only ~2 kcal would remain, too little to support a population; decomposers receive dead material and waste from every level, not just one.
      explanation: |
        Four points, one per task.

        (a) Calculate, 1 pt: 383 ÷ 3,368 × 100 ≈ 11.4%; accept 11% to 12%, and accept a correct method with an arithmetic slip only if the set-up is shown.

        (b) Explain, 1 pt: any two of: energy respired by the primary consumers and lost as heat; energy in biomass that was never consumed (died and went to decomposers); energy ingested but not assimilated (egested as faeces, also to decomposers). Naming only "lost as heat" with no second fate earns zero for this part.

        (c) Explain, 1 pt: with roughly 10% (here 5–11%) passing each step, a fourth consumer level would receive on the order of 1–2 kcal/m²/yr, far too little to sustain a breeding population; accept any argument that applies the transfer efficiency once more and judges the result insufficient.

        (d) Explain, 1 pt: decomposers (and detritivores) take in dead organisms, shed parts and wastes from every trophic level, including the producers, so their input is drawn from the whole ecosystem rather than from a single level above them in the chain.

        Zero: restating the table; claiming energy is recycled to the producers; attributing the losses to the ecosystem being "inefficient" without a mechanism.

    - slug: u08-w28-q16
      type: short_answer
      topic_code: "8.1"
      source: "general knowledge"
      points: 4
      prompt: |
        Experimental design. A class wants to test whether pill bugs prefer dark over lit conditions. They have a two-chamber choice chamber, black and clear covers, a lamp and 40 animals. (a) State a null hypothesis for the test. (b) Describe how you would set up the chambers so that light is the only variable, naming one factor you would hold constant. (c) Describe what you would record and how you would decide whether the animals showed a preference, naming the statistical test and its critical value. (d) Predict the result if pill bugs are negatively phototactic.
      answer: |
        H0: equal numbers on each side; one side black-covered, one clear, same paper moisture and temperature, animals started equally; count positions at fixed intervals, pool final counts, chi-square against 20:20, df = 1, critical 3.84; more than half on the dark side with χ² > 3.84.
      explanation: |
        Four points, one per task.

        (a) Null hypothesis, 1 pt: the animals show no preference, so equal numbers (20 and 20) are expected on each side; accept "light has no effect on distribution".

        (b) Set-up, 1 pt: one chamber under a black cover and one under a clear cover with the lamp above both, AND at least one controlled factor: same filter paper and moisture on both sides, same temperature, equal numbers placed on each side at the start, animals handled identically. A set-up that puts the lamp over only one side without a cover, so the sides also differ in heat, does not earn the point unless the student says the lamp is placed equidistant.

        (c) Measurement and decision, 1 pt: count the number on each side at fixed intervals (every minute or two) for a set time, pool or use the final count, compute χ² = Σ (o − e)²/e against the expected 20:20, and compare with 3.84 for df = 1 at p = 0.05; reject the null if the calculated value is larger. All three elements (what is counted, the test, the decision rule) are needed.

        (d) Prediction, 1 pt: a majority on the dark side, large enough that χ² exceeds 3.84; accept a specific illustration such as 30 dark and 10 lit.

        Zero: a design with no control of moisture or temperature, or a decision rule such as "if more are on one side" with no statistical test.

    - slug: u08-w28-q17
      type: long_answer
      topic_code: "8.1"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. Belding's ground squirrels live in colonies and give alarm calls when a predator approaches. In this species daughters settle near their mothers for life, while sons disperse to other colonies at weaning. Researchers watched a colony for several seasons and recorded, for every predator approach, which squirrels were present and which gave the first alarm call. They also recorded which squirrels were attacked by predators.

        | Category of squirrel | Share of squirrels present (%) | Share of first alarm calls given (%) |
        |---|---|---|
        | Adult females with mother, sisters or daughters nearby | 30 | 62 |
        | Adult females with no relatives nearby | 15 | 8 |
        | Adult males | 20 | 6 |
        | Juveniles | 35 | 24 |

        | Behaviour during the approach | Attacked by the predator (%) |
        |---|---|
        | Gave an alarm call | 8 |
        | Did not call | 4 |

        (a) Describe the pattern in the first table, using the numbers. (b) Explain, using the second table, why alarm calling is considered altruistic. (c) Use kin selection to explain the pattern in the first table, and explain why adult males, specifically, call so rarely. (d) Identify one alternative hypothesis for why females call more than males, and describe how the data in the first table help to rule it out. (e) Propose one further observation or experiment that would test the kin-selection explanation, and predict its result.
      answer: |
        Females with kin nearby call far more than their share of the population (62% vs 30%); callers are attacked twice as often, so calling costs the caller. Calling warns relatives who share genes, so the caller's inclusive fitness rises; males disperse and live among non-relatives, so there is no kin benefit. Alternative: females simply call more for any reason; but females without kin call less than their share, so relatedness, not sex, predicts calling. Test: compare the same female before and after her relatives die or are removed; predict she calls less.
      explanation: |
        Eight points.

        (a) 2 pts: 1 pt for stating that adult females with relatives nearby give far more than their share of alarm calls (62% of calls from 30% of the population), 1 pt for a second comparison such as adult males giving 6% of calls from 20% of the population, or females without kin calling less than their share (8% vs 15%). Numbers must be used.

        (b) 1 pt: callers are attacked at twice the rate of non-callers (8% vs 4%), so calling lowers the caller's own chance of survival while warning others; that combination (cost to self, benefit to others) is the definition of altruism.

        (c) 3 pts: 1 pt for the mechanism: the squirrels warned by a call near a female with kin are her mother, sisters or daughters, who share many of her genes, so a gene that makes her call is passed on through the relatives she saves even if she is killed (inclusive fitness / kin selection); 1 pt for stating that the benefit must outweigh the cost in terms of related individuals saved; 1 pt for the males: sons disperse at weaning and live among non-relatives, so their call would protect unrelated squirrels and bring no inclusive-fitness benefit, so selection does not favour calling in males. Accept "Hamilton's rule" or "rB > C" phrasing for the second point.

        (d) 1 pt: an alternative such as "females are simply more vigilant, or more vocal, than males regardless of kin", with the refutation that females with no relatives nearby call less than their share (8% vs 15%), so being female is not sufficient; relatedness is what tracks calling. Also accept "callers are the dominant individuals" refuted by juveniles calling at close to their share.

        (e) 1 pt: a proposal plus a prediction consistent with kin selection, e.g. follow females whose relatives die or are experimentally removed and predict their calling rate falls; or compare immigrant females (no kin) with natives and predict immigrants call less; or compare calling frequency with the number of relatives within earshot and predict a positive correlation.

        Zero for a part: describing the table without numbers; saying calling is "for the good of the species" (group selection, not kin selection); explaining male silence by males being "less caring" with no reference to dispersal and relatedness.

    - slug: u08-w28-q18
      type: multiple_choice
