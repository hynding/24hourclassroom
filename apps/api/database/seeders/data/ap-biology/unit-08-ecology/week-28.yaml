      source: "Biology 2e §46.2 Energy Flow through Ecosystems"
      points: 1
      prompt: |
        Review. A caterpillar converts about 18% of the energy it assimilates into new biomass, while a squirrel converts about 1.6%. Which process accounts for most of the difference?
      options:
        - "The squirrel, an endotherm, respires most of its assimilated energy to generate body heat, releasing it to the environment rather than storing it in biomass."
        - "The caterpillar performs photosynthesis in its gut, supplementing the energy in its food."
        - "The squirrel's digestive enzymes are less efficient, so most of its food leaves undigested."
        - "The caterpillar stores energy as ATP, which is heavier than the squirrel's fat."
      option_explanations:
        - |
          Correct. Endotherms oxidise fuel continuously in cellular respiration to maintain body temperature; the energy leaves as heat, so only a small fraction of what is assimilated remains to become tissue.
        - |
          Animals do not photosynthesise; the caterpillar is efficient because, as an ectotherm, it does not spend assimilated energy on heating itself.
        - |
          Net production efficiency is calculated from assimilated energy, after digestion and egestion are already accounted for, so digestive efficiency cannot be the explanation.
        - |
          ATP is a short-term energy currency, not a storage form, and it is made and used within seconds; neither organism stores appreciable energy as ATP.
      answer: 0
      explanation: |
        Cellular respiration is where ecosystem energy disappears: every organism oxidises glucose to drive ATP synthesis and releases the rest as heat, and endotherms do far more of it per gram than ectotherms.

    - slug: u08-w28-q19
