      points: 1
      prompt: |
        Review. Gross primary productivity measures the rate at which producers fix energy. Which statement correctly links it to the chemistry of photosynthesis?
      options:
        - "Light energy captured in the light-dependent reactions is used to make ATP and NADPH, which the Calvin cycle spends to reduce CO₂ into carbohydrate; GPP is the rate of that carbon fixation in energy terms."
        - "GPP measures the oxygen plants absorb from the air, since oxygen is the raw material for sugar."
        - "GPP is the rate at which plants break down glucose in their mitochondria to release energy."
        - "GPP depends only on the amount of chlorophyll, not on light, water or CO₂."
      option_explanations:
        - |
          Correct. GPP is photosynthesis measured at ecosystem scale: light to ATP and NADPH, ATP and NADPH to reduced carbon, with the product's energy content being what the pyramid counts.
        - |
          Plants release oxygen as a by-product of splitting water; they do not consume it in photosynthesis. The raw materials are CO₂ and water.
        - |
          Breaking down glucose in mitochondria is cellular respiration, the process that is subtracted from GPP to give NPP, not GPP itself.
        - |
          Photosynthetic rate is limited by light intensity, CO₂ concentration, water and temperature as well as pigment; that is why productivity differs so much between biomes.
      answer: 0
      explanation: |
        Unit 3 and Unit 8 describe the same process at two scales: the Calvin cycle in a chloroplast is the ecosystem's gross primary production, and mitochondrial respiration is the subtraction that leaves net production.

    - slug: u08-w28-q20
      type: multiple_choice
      topic_code: "4.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. A female moth releases a pheromone; a male several hundred metres away turns and flies upwind toward her. Which description of the events in the male is most accurate?
      options:
        - "The pheromone binds receptor proteins on sensory neurons in the male's antennae, triggering a signal transduction cascade that changes his flight behaviour."
        - "The pheromone enters the male's cells through the membrane and acts directly as a transcription factor in his brain."
        - "The pheromone is a hormone that travels in the male's blood to his wing muscles."
        - "The male detects the female visually and the chemical only confirms her identity."
      option_explanations:
        - |
          Correct. Like any ligand, a pheromone acts by binding a specific receptor; the bound receptor activates a transduction pathway whose output here is a neural signal that steers flight. The signal is chemical between individuals and electrical inside the receiver.
        - |
          Most pheromones are detected by membrane receptors on the surface of sensory cells, not by entering nuclei; even steroid-like signals would act over hours, not in the seconds a turn in flight takes.
        - |
          A hormone is a signal made by and acting within one organism's body; a pheromone passes between organisms. The male's own neurons, not his blood, carry the message to the muscles.
        - |
          At several hundred metres the female is invisible; the chemical gradient is the only information available, and that is what the receptors on the antennae read.
      answer: 0
      explanation: |
        Behaviour sits on top of the cell signalling of Unit 4: a signal molecule, a receptor, a transduction cascade, a response. Between individuals the signal is called a pheromone; the receiver's machinery is the same.

    - slug: u08-w28-q21
      type: multiple_choice
      topic_code: "1.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. A squirrel's low net production efficiency is partly the cost of staying warm, yet on a hot day it must also shed heat. Which property of water makes panting and sweating effective ways for an endotherm to lose heat?
      options:
        - "Water's high heat of vaporization: the molecules that evaporate carry away a large amount of energy because every hydrogen bond must be broken for them to escape."
        - "Water's low specific heat: it warms quickly on the skin and carries the heat off as it drips away."
        - "Water's high density: liquid water sinks away from the body, taking heat with it."
        - "Water's surface tension: droplets bead on the skin and reflect sunlight."
      option_explanations:
        - |
          Correct. Evaporative cooling works because about 586 cal must be absorbed per gram of water evaporated, and the most energetic molecules leave first, so the surface left behind is cooler.
        - |
          Water's specific heat is high, not low, and specific heat describes how a liquid warms; heat loss by evaporation depends on the energy of vaporisation, not on warming.
        - |
          Density has nothing to do with heat loss; water does not sink off an animal, it evaporates, and that phase change is what removes heat.
        - |
          Beaded droplets reflect negligible energy; sweat cools by changing phase, not by acting as a mirror.
      answer: 0
      explanation: |
        An ecosystem's energy budget ends in heat, and water's hydrogen bonding is why evaporating water is the most effective way an organism has of exporting it.

    - slug: u08-w28-q22
      type: multiple_choice
      topic_code: "7.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Courtship display in sage grouse is costly: displaying males lose weight and are more often taken by predators. Which statement best explains how such a behaviour persists under natural selection?
      options:
        - "Males that display obtain more matings, so despite the survival cost the alleles underlying the display leave more copies in the next generation."
        - "The display benefits the species by keeping the population from growing too large."
        - "Natural selection cannot act on behaviour, only on anatomy, so the display is not selected at all."
        - "The display is learned fresh each generation, so selection has nothing heritable to act on."
      option_explanations:
        - |
          Correct. Fitness is reproductive success, not survival alone. A trait that costs survival but raises mating success can be favoured as long as the net effect is more offspring (sexual selection).
        - |
          Selection acts on individuals, not for the good of the species; a male that displayed less and survived more would spread if it also mated as often, which it does not.
        - |
          Behaviour with a heritable component is as much a phenotype as a feather, and the lek display is largely innate; selection acts on anything that affects reproductive success and is heritable.
        - |
          The lek display is performed by naive males and is species-typical; even if learning contributed, the capacity to learn it would be heritable and subject to selection.
      answer: 0
      explanation: |
        Behaviour is a phenotype. If it is heritable and changes reproductive success, natural selection shapes it, which is why "ultimate cause" questions always come back to fitness.

    - slug: u08-w28-q23
      type: true_false
      topic_code: "2.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. True or false: Because a small animal has a larger surface-area-to-volume ratio than a large one, it loses heat to its surroundings faster per gram of body mass, which is one reason small endotherms have high mass-specific metabolic rates.
      answer: true
      explanation: |
        True. Surface area scales with length squared while volume scales with length cubed, so halving an animal's linear size doubles its surface-to-volume ratio. Heat is lost across the surface and generated throughout the volume, so a small endotherm must burn fuel faster per gram to keep up. The same geometry that limits cell size in Unit 2 sets the energy budget of a shrew.

    - slug: u08-w28-q24
      type: fill_blank
      topic_code: "7.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. In evolutionary terms, an individual's ____ is measured by its contribution of offspring, and therefore alleles, to the next generation, not by how long or how safely it lives.
      answer: ["fitness", "reproductive fitness", "Darwinian fitness"]
      explanation: |
        Fitness is reproductive success relative to other individuals. The distinction matters in this unit because many behaviours (costly displays, alarm calls, migration) reduce survival yet increase fitness, either directly through matings or indirectly through relatives. "Survival" is not accepted: it is a component of fitness, not the measure.
