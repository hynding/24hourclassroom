unit: 8
description: |
  49 questions · about 70 minutes · every topic of Unit 8 (8.1 to 8.7) with about a fifth cumulative review of
  Units 1 to 7, three data-based stimulus sets, one short free-response item (4 points) and one long
  free-response item (8 points). Multiple choice, select-all, true/false and numeric items are graded at once;
  fill-in-the-blank items are matched automatically; the two free-response items are graded by your teacher
  against the acceptable-answer summary.
questions:
  # ---- Stimulus set A: a duckweed population-growth data set (8.3, 8.4)
  - slug: u08-exam-q01
    type: multiple_choice
    topic_code: "8.3"
    source: "Biology 2e §45.3 Environmental Limits to Population Growth"
    points: 1
    stimulus: |
      Students grew duckweed (Lemna minor), a small floating plant that reproduces by budding off new fronds, in beakers of nutrient solution on a sunny windowsill. Six beakers held full-strength solution and six held quarter-strength solution (one quarter of every nutrient). Each beaker started with 20 fronds. Fronds were counted every 3 days and the means are shown. Water lost to evaporation was replaced with distilled water.

      | Day | Fronds, full-strength | Fronds, quarter-strength |
      |---|---|---|
      | 0 | 20 | 20 |
      | 3 | 46 | 43 |
      | 6 | 100 | 79 |
      | 9 | 196 | 121 |
      | 12 | 318 | 154 |
      | 15 | 420 | 174 |
      | 18 | 486 | 183 |
      | 21 | 520 | 187 |
      | 24 | 532 | 189 |
    prompt: |
      Which description of the growth of the full-strength cultures is best supported by the data?
    options:
      - "Exponential growth throughout, because the number of fronds rose in every interval."
      - "Logistic growth: the increase per interval grew larger up to days 9–12 and then shrank, as the population levelled off at a carrying capacity a little above 530 fronds."
      - "Linear growth, because roughly the same number of fronds was added in each 3-day interval."
      - "Logistic growth with a carrying capacity of about 270 fronds, the point at which growth was fastest."
    option_explanations:
      - |
        Rising in every interval is true of logistic growth too. Exponential growth needs increments that keep getting larger; here they peak at 122 fronds (days 9–12) and fall to 12 by days 21–24, the signature of a population approaching a limit.
      - |
        Correct. The increments run 26, 54, 96, 122, 102, 66, 34, 12: growth accelerates, peaks, then slows as N approaches a plateau near 535. An S-shaped curve with shrinking increments near the top is logistic growth.
      - |
        The increments are far from constant, ranging from 12 to 122 fronds per interval. Linear growth would give a straight line; these data trace an S.
      - |
        This confuses K with K/2. Growth is fastest when N is about half of K; the population carried on growing past 270 to about 535, which is the carrying capacity.
    answer: 1
    explanation: |
      Read the increments, not just the totals. A population whose increments rise and then fall toward zero is growing logistically; the plateau estimates K and the steepest stretch sits near K/2.

  - slug: u08-exam-q02
    type: multiple_choice
    topic_code: "8.3"
    source: "Biology 2e §45.3 Environmental Limits to Population Growth"
    points: 1
    stimulus: |
      Students grew duckweed (Lemna minor), a small floating plant that reproduces by budding off new fronds, in beakers of nutrient solution on a sunny windowsill. Six beakers held full-strength solution and six held quarter-strength solution (one quarter of every nutrient). Each beaker started with 20 fronds. Fronds were counted every 3 days and the means are shown. Water lost to evaporation was replaced with distilled water.

      | Day | Fronds, full-strength | Fronds, quarter-strength |
      |---|---|---|
      | 0 | 20 | 20 |
      | 3 | 46 | 43 |
      | 6 | 100 | 79 |
      | 9 | 196 | 121 |
      | 12 | 318 | 154 |
      | 15 | 420 | 174 |
      | 18 | 486 | 183 |
      | 21 | 520 | 187 |
      | 24 | 532 | 189 |
    prompt: |
      A student argues that the full-strength population was growing fastest between days 0 and 3, because each frond was then producing new fronds at the highest rate it ever reached. Which response is correct?
    options:
      - "The student is right on both counts: per-frond growth and the total rate of increase were both greatest at the start."
      - "The student is right that per-frond growth was highest at the start, but wrong about the population: only 26 fronds were added in days 0–3, while 122 were added in days 9–12, when N was near half the carrying capacity."
      - "The student is wrong on both counts: per-frond growth was highest at the end, when the most fronds were present."
      - "The student is right, because in the logistic model dN/dt is largest when N is smallest."
    option_explanations:
      - |
        The per-capita half is right (26 new fronds from 20 is 1.3 per frond in 3 days, the highest in the table), but the total increase was only 26, smaller than in every later interval up to day 21. Total rate is per-capita rate times N.
      - |
        Correct. Per frond, days 0–3 gave 26/20 = 1.3 and days 9–12 only 122/196 ≈ 0.62, so per-capita growth falls steadily. But dN/dt is per-capita rate times N, and that product is largest near K/2 (about 270), where neither N nor the per-capita rate is small.
      - |
        Per-frond growth was lowest at the end: in days 21–24, 12 new fronds from 520 is about 0.02 per frond. Crowding depresses the per-capita rate, which is exactly what the (K − N)/K term describes.
      - |
        When N is small, rmax N is small too. In the logistic model dN/dt = rmax N (K − N)/K is largest at N = K/2, not when N is close to zero.
    answer: 1
    explanation: |
      Keep the two rates apart. The per-capita rate is highest at low density and falls as crowding increases; the population's total growth rate is the per-capita rate multiplied by N and peaks at K/2.

  - slug: u08-exam-q03
    type: numeric
    topic_code: "8.3"
    source: "Biology 2e §45.3 Environmental Limits to Population Growth"
    points: 1
    stimulus: |
      Students grew duckweed (Lemna minor), a small floating plant that reproduces by budding off new fronds, in beakers of nutrient solution on a sunny windowsill. Six beakers held full-strength solution and six held quarter-strength solution (one quarter of every nutrient). Each beaker started with 20 fronds. Fronds were counted every 3 days and the means are shown. Water lost to evaporation was replaced with distilled water.

      | Day | Fronds, full-strength | Fronds, quarter-strength |
      |---|---|---|
      | 0 | 20 | 20 |
      | 3 | 46 | 43 |
      | 6 | 100 | 79 |
      | 9 | 196 | 121 |
      | 12 | 318 | 154 |
      | 15 | 420 | 174 |
      | 18 | 486 | 183 |
      | 21 | 520 | 187 |
      | 24 | 532 | 189 |
    prompt: |
      Take K = 540 fronds for the full-strength cultures and rmax = 0.30 per day. Using the logistic equation dN/dt = rmax N (K − N)/K, calculate the predicted growth rate, in fronds per day, on day 12, when N = 318. Give your answer to one decimal place.
    answer: { value: 39.2, tolerance: 0.5 }
    explanation: |
      (K − N)/K = (540 − 318)/540 = 222/540 = 0.411. rmax N = 0.30 × 318 = 95.4 fronds per day. dN/dt = 95.4 × 0.411 = 39.2 fronds per day. The data agree: about 40.7 fronds per day were added in days 9–12 (122 ÷ 3) and 34 per day in days 12–15 (102 ÷ 3), and day 12 sits between them. Without the (K − N)/K factor the exponential model would predict 95.4 per day, more than twice what was observed: by day 12 crowding had already removed about 59% of the population's potential growth.

  - slug: u08-exam-q04
    type: multiple_choice
    topic_code: "8.4"
    source: "Biology 2e §45.4 Population Dynamics and Regulation"
    points: 1
    stimulus: |
      Students grew duckweed (Lemna minor), a small floating plant that reproduces by budding off new fronds, in beakers of nutrient solution on a sunny windowsill. Six beakers held full-strength solution and six held quarter-strength solution (one quarter of every nutrient). Each beaker started with 20 fronds. Fronds were counted every 3 days and the means are shown. Water lost to evaporation was replaced with distilled water.

      | Day | Fronds, full-strength | Fronds, quarter-strength |
      |---|---|---|
      | 0 | 20 | 20 |
      | 3 | 46 | 43 |
      | 6 | 100 | 79 |
      | 9 | 196 | 121 |
      | 12 | 318 | 154 |
      | 15 | 420 | 174 |
      | 18 | 486 | 183 |
      | 21 | 520 | 187 |
      | 24 | 532 | 189 |
    prompt: |
      In the first 3 days the two treatments grew almost identically (46 and 43 fronds), but the quarter-strength cultures levelled off near 190 fronds, about a third of the full-strength plateau. Which explanation is best supported?
    options:
      - "Quarter-strength solution lowered the duckweed's maximum per-capita growth rate, rmax, so the population could never grow fast enough to reach a large size."
      - "Carrying capacity depends on resources: with a quarter of the nutrients, competition among fronds for the scarce nutrients slowed budding at a lower density, so K was lower while rmax, seen when the populations were small, was about the same."
      - "The quarter-strength beakers received less light, a density-independent factor that set a lower plateau."
      - "The quarter-strength population was still growing exponentially at day 24 and would have reached the same plateau with more time."
    option_explanations:
      - |
        If rmax were lower the two curves would separate from the start. At low density, when resources were not yet limiting, both populations more than doubled in 3 days; the difference appears only as the fronds become crowded.
      - |
        Correct. rmax is a property of the species and shows when N is small; K belongs to the species and its environment together. Fewer nutrients per beaker means each frond's share falls below what budding needs at a lower N, so growth stops sooner.
      - |
        Both treatments sat on the same windowsill; the stimulus gives nutrient strength as the only difference. Shading by neighbours would in any case be density-dependent, since crowded fronds shade one another.
      - |
        The quarter-strength increments fell to 4 and then 2 fronds per 3 days; that is a plateau, not exponential growth. Nothing in the data suggests the cultures would catch up.
    answer: 1
    explanation: |
      Compare the curves at low density to judge rmax and at the plateau to judge K. Changing a resource moves K and leaves the intrinsic rate of increase, seen at low density, largely untouched.

  - slug: u08-exam-q05
    type: multiple_choice
    topic_code: "8.4"
    source: "Biology 2e §45.4 Population Dynamics and Regulation"
    points: 1
    stimulus: |
      Students grew duckweed (Lemna minor), a small floating plant that reproduces by budding off new fronds, in beakers of nutrient solution on a sunny windowsill. Six beakers held full-strength solution and six held quarter-strength solution (one quarter of every nutrient). Each beaker started with 20 fronds. Fronds were counted every 3 days and the means are shown. Water lost to evaporation was replaced with distilled water.

      | Day | Fronds, full-strength | Fronds, quarter-strength |
      |---|---|---|
      | 0 | 20 | 20 |
      | 3 | 46 | 43 |
      | 6 | 100 | 79 |
      | 9 | 196 | 121 |
      | 12 | 318 | 154 |
      | 15 | 420 | 174 |
      | 18 | 486 | 183 |
      | 21 | 520 | 187 |
      | 24 | 532 | 189 |
    prompt: |
      Which additional result would provide the strongest evidence that the plateau in the quarter-strength cultures was caused by density-dependent factors?
    options:
      - "A heat wave on day 14 killed about a third of the fronds in every beaker, whatever the number of fronds it held."
      - "Quarter-strength beakers started with 100 fronds instead of 20 also levelled off near 190, and in every beaker the number of new fronds per existing frond fell as the frond count rose."
      - "The full-strength cultures reached a higher plateau than the quarter-strength cultures."
      - "All twelve beakers, at both strengths, stopped growing on the same day, the day a cold front passed."
    option_explanations:
      - |
        A loss that takes the same proportion regardless of density is the definition of a density-independent factor. It would reset N, but it could not explain why populations settle at a particular size.
      - |
        Correct. Density dependence predicts that per-capita growth falls as density rises and that populations converge on the same K from different starting sizes; both observations test that prediction directly.
      - |
        This is already in the table and shows that resources matter, but it does not show that the effect of those resources depends on how crowded the fronds are.
      - |
        Stopping on a shared calendar day, coinciding with a weather event, points to an external density-independent cause. Under density dependence each beaker stops when it reaches its own K, whatever the date.
    answer: 1
    explanation: |
      A density-dependent factor is identified by its per-capita effect changing with density and by populations converging on K from different starting points. An equal proportional loss or a shared calendar date points to density-independent causes.

  # ---- Stimulus set B: an energy and methylmercury data set from a lake (8.2)
  - slug: u08-exam-q06
    type: multiple_choice
    topic_code: "8.2"
    source: "Biology 2e §46.2 Energy Flow through Ecosystems"
    points: 1
    stimulus: |
      Ecologists measured the annual net production of each trophic level in a small northern lake, and the mean concentration of methylmercury, a toxic form of mercury that reaches the lake from the air, in the tissues of the organisms at each level. The gross primary productivity of the producers was 40,000 kJ/m²/yr.

      | Trophic level | Main organisms | Net production (kJ/m²/yr) | Methylmercury in tissue (ng/g) |
      |---|---|---|---|
      | Producers | phytoplankton, pondweeds | 18,000 | 4 |
      | Primary consumers | zooplankton, snails | 1,800 | 22 |
      | Secondary consumers | yellow perch | 160 | 140 |
      | Tertiary consumers | northern pike | 8 | 900 |
    prompt: |
      Which trophic transfer in this lake is the least efficient?
    options:
      - "Producers to primary consumers, about 10%"
      - "Primary consumers to secondary consumers, about 9%"
      - "Secondary consumers to tertiary consumers, about 5%"
      - "All three transfers are exactly 10%, as the 10% rule requires"
    option_explanations:
      - |
        1,800 ÷ 18,000 = 10%, the most efficient transfer in the table rather than the least. Divide each level by the one below it before comparing.
      - |
        160 ÷ 1,800 = 8.9%, slightly lower than the first transfer but still nearly twice as efficient as the last one.
      - |
        Correct. 8 ÷ 160 = 5%. Pike are large, active predators that spend much of what they assimilate on movement and maintenance, and much of the perch production is never eaten by pike at all.
      - |
        The 10% rule is an approximation; real transfers range from about 5 to 20%. Calculated from these data, the three transfers are 10%, 8.9% and 5%.
    answer: 2
    explanation: |
      Transfer efficiency is production at one level divided by production at the level below. Calculate each step from the data rather than assuming 10%; the last step here is half as efficient as the first.

  - slug: u08-exam-q07
    type: multiple_choice
    topic_code: "8.2"
    source: "Biology 2e §46.2 Energy Flow through Ecosystems"
    points: 1
    stimulus: |
      Ecologists measured the annual net production of each trophic level in a small northern lake, and the mean concentration of methylmercury, a toxic form of mercury that reaches the lake from the air, in the tissues of the organisms at each level. The gross primary productivity of the producers was 40,000 kJ/m²/yr.

      | Trophic level | Main organisms | Net production (kJ/m²/yr) | Methylmercury in tissue (ng/g) |
      |---|---|---|---|
      | Producers | phytoplankton, pondweeds | 18,000 | 4 |
      | Primary consumers | zooplankton, snails | 1,800 | 22 |
      | Secondary consumers | yellow perch | 160 | 140 |
      | Tertiary consumers | northern pike | 8 | 900 |
    prompt: |
      Net production falls by a factor of 10 to 20 at each step up the table, while methylmercury concentration rises by a factor of about 5 to 7. Which explanation accounts for both trends?
    options:
      - "Methylmercury is produced inside the bodies of predators, so larger predators make more of it."
      - "Most of the energy each level assimilates is respired and lost as heat, but methylmercury is retained in tissue rather than broken down or excreted; each predator eats many times its own mass of prey over its life and keeps the mercury from all of it."
      - "Energy is recycled from the top predators back to the producers, so less is left at the top, while mercury moves the other way."
      - "Organisms at higher levels take in more lake water, so they absorb more mercury directly from the water."
    option_explanations:
      - |
        The stimulus says methylmercury reaches the lake from the air; animals do not synthesise it. Its concentration rises because it is passed up the food chain, not because predators manufacture it.
      - |
        Correct. Energy leaves at every step as heat from respiration, so less is available above; the toxin does not leave, so it is concentrated into an ever smaller mass of consumers. That is biomagnification, the mirror image of the energy pyramid.
      - |
        Energy flows one way through an ecosystem and leaves as heat; it is never recycled to producers. Matter, not energy, cycles through decomposers.
      - |
        Most of a fish's methylmercury comes from its food, not across its gills. Uptake from water would give similar concentrations at every level, not a consistent five- to sevenfold rise per step.
    answer: 1
    explanation: |
      Energy is lost at each transfer; a persistent toxin is not. One food chain therefore produces two opposite pyramids: production shrinking upward and toxin concentration growing upward.

  - slug: u08-exam-q08
    type: multiple_choice
    topic_code: "8.2"
    source: "Biology 2e §46.2 Energy Flow through Ecosystems"
    points: 1
    stimulus: |
      Ecologists measured the annual net production of each trophic level in a small northern lake, and the mean concentration of methylmercury, a toxic form of mercury that reaches the lake from the air, in the tissues of the organisms at each level. The gross primary productivity of the producers was 40,000 kJ/m²/yr.

      | Trophic level | Main organisms | Net production (kJ/m²/yr) | Methylmercury in tissue (ng/g) |
      |---|---|---|---|
      | Producers | phytoplankton, pondweeds | 18,000 | 4 |
      | Primary consumers | zooplankton, snails | 1,800 | 22 |
      | Secondary consumers | yellow perch | 160 | 140 |
      | Tertiary consumers | northern pike | 8 | 900 |
    prompt: |
      A health agency wants to advise people who catch and eat fish from this lake. Which advice is best supported by the data?
    options:
      - "Eat yellow perch rather than northern pike, because perch feed one trophic level lower and carry about one sixth of the methylmercury concentration."
      - "Eat northern pike rather than perch, because a larger fish dilutes the mercury into more tissue."
      - "Either species is equally safe, because both live in the same water and are exposed to the same mercury."
      - "Eat only the oldest, largest perch, because older fish have had more time to excrete their mercury."
    option_explanations:
      - |
        Correct. 900 ÷ 140 ≈ 6.4, so a meal of pike delivers more than six times the methylmercury of the same mass of perch. Eating lower on the food chain is the standard advice for any biomagnifying toxin.
      - |
        Pike tissue holds 900 ng/g against 140 for perch. Concentration is per gram, so a larger body does not dilute it; the pike has eaten many perch and kept their mercury.
      - |
        Sharing the water does not mean sharing the dose. The mercury arrives mostly through food, and the table shows a sixfold difference between the two species.
      - |
        Methylmercury is retained rather than efficiently excreted, so older and larger fish of a species have had longer to accumulate it and usually carry more, not less.
    answer: 0
    explanation: |
      Biomagnification turns trophic position into a health risk. Advice to eat lower on the food chain, and smaller fish, follows directly from the concentration column.

  - slug: u08-exam-q09
    type: multi_select
    topic_code: "8.2"
    source: "Biology 2e §46.2 Energy Flow through Ecosystems"
    points: 2
    partial_credit: true
    stimulus: |
      Ecologists measured the annual net production of each trophic level in a small northern lake, and the mean concentration of methylmercury, a toxic form of mercury that reaches the lake from the air, in the tissues of the organisms at each level. The gross primary productivity of the producers was 40,000 kJ/m²/yr.

      | Trophic level | Main organisms | Net production (kJ/m²/yr) | Methylmercury in tissue (ng/g) |
      |---|---|---|---|
      | Producers | phytoplankton, pondweeds | 18,000 | 4 |
      | Primary consumers | zooplankton, snails | 1,800 | 22 |
      | Secondary consumers | yellow perch | 160 | 140 |
      | Tertiary consumers | northern pike | 8 | 900 |
    prompt: |
      Which statements are supported by the data and by the principles of energy flow? Select all that apply.
    options:
      - "The producers used more than half of the energy they fixed in their own respiration."
      - "Each step up the food chain raised methylmercury concentration about five- to sevenfold."
      - "Energy not passed to the next level was recycled by decomposers back to the producers."
      - "The pike population must have a greater total biomass than the perch population, because pike are the larger fish."
      - "The energy of primary-consumer production that did not become perch production was eventually released as heat by the respiration of perch, decomposers and other organisms."
    option_explanations:
      - |
        Correct. Gross primary productivity of 40,000 minus net production of 18,000 leaves 22,000 kJ/m²/yr respired by the producers, 55% of what they fixed.
      - |
        Correct. 22 ÷ 4 = 5.5, 140 ÷ 22 = 6.4 and 900 ÷ 140 = 6.4: a consistent multiplication at each transfer.
      - |
        Decomposers recycle matter such as nitrogen and phosphorus, but the energy they extract from dead material is respired as heat. Energy enters as light and leaves as heat; it does not cycle.
      - |
        Individual size is not population biomass. Pike production is 8 kJ/m²/yr against 160 for perch, and with so little energy available a top-predator population supports far less total biomass.
      - |
        Correct. Of 1,800 kJ of primary-consumer production only 160 became perch tissue; the rest was respired by the perch, eaten and respired by other consumers, or decomposed after death or egestion, and left as heat.
    answer: [0, 1, 4]
    explanation: |
      Each correct statement comes from a calculation or a principle the table supports: respiration by producers, a constant biomagnification factor, and the one-way flow of energy. The wrong ones confuse matter with energy or individuals with populations.

  # ---- Responses to the environment (8.1)
  - slug: u08-exam-q10
    type: multiple_choice
    topic_code: "8.1"
    source: "general knowledge"
    points: 1
    prompt: |
      Sixty brine shrimp were placed in a horizontal tube divided into three equal sections and lit from one end. After 15 minutes the sections were closed off and the shrimp counted: 30 in the brightly lit section, 18 in the middle section and 12 in the dark section. Using a null hypothesis of no preference and the chi-square test (critical value 5.99 at p = 0.05 with 2 degrees of freedom), which conclusion is correct?
    options:
      - "χ² = 8.4, which exceeds 5.99, so the null hypothesis is rejected: the shrimp were not distributed at random, consistent with a preference for light."
      - "χ² = 8.4, which is less than the critical value of 9.49, so the null hypothesis is not rejected."
      - "χ² = 0, because the deviations from 20 (+10, −2 and −8) add up to zero, so the shrimp show no preference."
      - "χ² = 8.4, which proves that the shrimp swim directly toward light by positive phototaxis."
    option_explanations:
      - |
        Correct. Expected = 20 per section. 10²/20 + 2²/20 + 8²/20 = 5.0 + 0.2 + 3.2 = 8.4. With three categories df = 2, and 8.4 > 5.99, so a split this uneven would arise by chance less than 5% of the time.
      - |
        9.49 is the critical value for 4 degrees of freedom. Degrees of freedom are the number of categories minus one, here 3 − 1 = 2, with a critical value of 5.99.
      - |
        Deviations always sum to zero when the expected total equals the observed total; that is why chi-square squares each deviation before adding. Squared and divided by 20, they give 8.4.
      - |
        Rejecting the null shows a non-random distribution, not its mechanism. The shrimp could have collected in the light by a kinesis (slowing down in bright light) as well as by a directed taxis; only tracking individual paths would tell them apart.
    answer: 0
    explanation: |
      Chi-square tells you whether a pattern is unlikely to be chance; it does not tell you how the animals produced it. Take the expected values from the null, square every deviation, use categories − 1 for df, and keep the statistical conclusion separate from the mechanism.

  - slug: u08-exam-q11
    type: multiple_choice
    topic_code: "8.1"
    source: "general knowledge"
    points: 1
    prompt: |
      A plant flowers only when it receives at least 14 hours of darkness in each 24-hour cycle. Plants given 14 hours of darkness interrupted halfway by a 5-minute flash of red light do not flower; plants whose red flash is followed at once by a flash of far-red light do flower. Which interpretation is best supported?
    options:
      - "The plant measures the length of the uninterrupted dark period with the pigment phytochrome, which red light converts to its active form and far-red light converts back."
      - "The plant measures the total number of hours of light it receives, and the red flash added enough light to exceed its limit."
      - "The red flash damaged the plant's chloroplasts, and the far-red flash repaired them."
      - "The plant responds only to far-red light, so the red flash had no effect in either treatment."
    option_explanations:
      - |
        Correct. A brief flash that breaks the night prevents flowering, so the plant is timing continuous darkness; reversal by far-red immediately after red is the fingerprint of phytochrome, which switches between red-absorbing and far-red-absorbing forms.
      - |
        Five minutes of light adds almost nothing to the day; the effect comes from splitting the night into two short dark periods, neither of them long enough.
      - |
        Damage to the photosynthetic machinery would not be undone in seconds by a different wavelength. The red/far-red reversal points to a photoreversible receptor pigment, not to injury.
      - |
        The red flash alone prevented flowering, so it clearly had an effect; far-red mattered only because it cancelled the red.
    answer: 0
    explanation: |
      Photoperiodism is a plant's way of reading the season: it measures night length with a photoreversible receptor and times flowering to it. The red/far-red reversal is the experimental signature to recognise.

  - slug: u08-exam-q12
    type: multiple_choice
    topic_code: "8.1"
    source: "Biology 2e §45.7 Behavioral Biology: Proximate and Ultimate Causes of Behavior"
    points: 1
    prompt: |
      When a fox approaches its ground nest, a killdeer runs away from the nest dragging one wing as if it were broken, calling loudly, and flies off once the fox has followed it some distance. Which statement is an ultimate explanation of this behaviour?
    options:
      - "The sight of the predator triggers a neural and hormonal response that produces the wing-dragging display."
      - "Over many generations, parents that performed the display had more surviving chicks than parents that did not, so the alleles underlying the display increased in frequency."
      - "Young killdeer learn the display by watching their parents perform it."
      - "The killdeer performs the display to protect the species from losing its young."
    option_explanations:
      - |
        This is a proximate explanation: it describes how the behaviour is triggered and produced in an individual, not why it evolved.
      - |
        Correct. An ultimate explanation states the fitness payoff that caused selection to favour the behaviour: luring predators away from the nest raised the number of offspring that survived to reproduce.
      - |
        How a behaviour develops in an individual, whether by learning or by inherited circuitry, is a proximate question; it does not say why the behaviour raised fitness.
      - |
        Selection acts on individuals and their alleles, not for the good of the species. The display spreads because it raises the displaying parent's own reproductive success.
    answer: 1
    explanation: |
      Ask two questions of every behaviour: how does it happen (proximate: stimulus, nerves, hormones, development) and why did it evolve (ultimate: its effect on fitness).

  # ---- The four biogeochemical cycles (8.2)
  - slug: u08-exam-q13
    type: multiple_choice
    topic_code: "8.2"
    source: "Biology 2e §46.3 Biogeochemical Cycles"
    points: 1
    prompt: |
      In an experiment, all the trees in one small forested watershed are cut and regrowth is suppressed, while a neighbouring forested watershed is left untouched. Which change is expected in the water cycle of the cut watershed?
    options:
      - "Stream flow decreases, because without trees the soil holds less water."
      - "Stream flow increases, because transpiration falls sharply, so more of the precipitation runs off or drains through the soil to the stream instead of returning to the air through leaves."
      - "Nothing changes, because precipitation, not vegetation, controls stream flow."
      - "Evaporation from the bare soil rises enough to replace all the water the trees used to transpire, so stream flow is unchanged."
    option_explanations:
      - |
        Losing trees does reduce the soil's ability to hold water, but it also removes the plants pumping water back to the air; the net result is more water reaching the stream, not less.
      - |
        Correct. Trees return a large share of precipitation to the atmosphere by transpiration. Remove them and that water instead runs off or infiltrates and reaches the stream, carrying soil and dissolved nutrients with it.
      - |
        Precipitation sets the input, but vegetation decides how that input is divided between transpiration, runoff and infiltration. Changing the plants changes the outputs.
      - |
        Bare soil loses some water from its surface, but it cannot draw water from deep in the soil the way roots do, so it does not make up for the lost transpiration.
    answer: 1
    explanation: |
      In the water cycle, plants are a pump from soil to air. Deforestation shifts precipitation from transpiration to runoff, raising stream flow, erosion and nutrient loss downstream.

  - slug: u08-exam-q14
    type: multiple_choice
    topic_code: "8.2"
    source: "Biology 2e §46.3 Biogeochemical Cycles"
    points: 1
    prompt: |
      Which sequence moves carbon from the atmosphere into the slow, geological part of the carbon cycle, where it can stay for millions of years?
    options:
      - "CO₂ is fixed by photosynthesis in leaves and returned by the respiration of the plant and its consumers within days to years."
      - "CO₂ dissolves in seawater and forms bicarbonate; marine organisms use it to build calcium carbonate shells; the shells settle on the sea floor and are compressed into limestone."
      - "CO₂ is taken up by nitrogen-fixing bacteria and converted to ammonium in the soil."
      - "CO₂ is released by volcanoes and the burning of fossil fuels and accumulates in the atmosphere."
    option_explanations:
      - |
        Photosynthesis and respiration are the fast, biological loop of the cycle; carbon passes through it in days to decades, not the millions of years asked about.
      - |
        Correct. More than 90% of the ocean's carbon is bicarbonate; shell-building turns it into calcium carbonate, and buried shells become sedimentary rock that releases carbon only through weathering, volcanism or human extraction.
      - |
        Nitrogen fixation converts N₂, not CO₂, and its product is ammonium; it belongs to the nitrogen cycle.
      - |
        This describes carbon leaving geological reservoirs and entering the atmosphere: the reverse of the direction asked about.
    answer: 1
    explanation: |
      The carbon cycle runs at two speeds. Biology moves carbon quickly between air and organisms; the ocean, sediments and rock store it for geological time, and burning fossil fuels short-circuits that slow return.

  - slug: u08-exam-q15
    type: multiple_choice
    topic_code: "8.2"
    source: "Biology 2e §46.3 Biogeochemical Cycles"
    points: 1
    prompt: |
      A field is flooded for two weeks after heavy rain, filling the pore spaces of the soil with water. Afterwards soil nitrate has fallen sharply, although no crop was growing, and the soil has released nitrogen gas. Which process explains the loss?
    options:
      - "Nitrogen fixation, because waterlogged soil favours Rhizobium."
      - "Nitrification, because flooding speeds the conversion of ammonium to nitrate."
      - "Denitrification, because in soil with little oxygen, bacteria such as Pseudomonas use nitrate in place of oxygen in their respiration and release N₂ to the air."
      - "Ammonification, because decomposers convert nitrate into the proteins of dead matter."
    option_explanations:
      - |
        Fixation adds usable nitrogen by converting N₂ to ammonium; it cannot explain a loss of nitrate and a release of N₂, which run in the opposite direction.
      - |
        Nitrification produces nitrate, so it would raise nitrate rather than lower it, and the nitrifying bacteria need oxygen, which flooding removes.
      - |
        Correct. Denitrification reduces nitrate to N₂ and returns it to the atmosphere. It is favoured in waterlogged, oxygen-poor soil, where nitrate serves as the final electron acceptor that oxygen normally would.
      - |
        Ammonification converts the nitrogen in dead organic matter into ammonium. It does not turn nitrate into proteins or release N₂.
    answer: 2
    explanation: |
      Each step of the nitrogen cycle is run by particular prokaryotes under particular conditions. Oxygen-poor soil shifts the balance toward denitrification, which returns nitrogen to the air and away from plants (Unit 3 link: anaerobic respiration can use an electron acceptor other than oxygen).

  - slug: u08-exam-q16
    type: multiple_choice
    topic_code: "8.2"
    source: "Biology 2e §46.3 Biogeochemical Cycles"
    points: 1
    prompt: |
      Sediment cores from a lake show that the amount of phosphorus settling to the lake bottom each year rose sharply in the decades after the forests around the lake were cleared for farming. Which explanation fits the phosphorus cycle?
    options:
      - "Clearing released phosphorus gas from the trees into the air, and rain washed it into the lake."
      - "The exposed farmland lost soil to erosion and runoff, carrying phosphate, much of it attached to soil particles, into the lake, where it settled into the sediment."
      - "Farm animals breathed out phosphorus, which dissolved in the lake."
      - "Clearing increased nitrogen fixation, which converts nitrogen into phosphorus."
    option_explanations:
      - |
        Phosphorus has no significant gaseous phase; it moves through rock, soil, water and organisms, never through the atmosphere as a gas.
      - |
        Correct. Phosphate travels with water and soil. Removing vegetation increases erosion and runoff, and fertiliser and manure add more phosphate; in the lake it feeds algae or settles to the sediment, where it can stay for thousands of years.
      - |
        Animals do not exhale phosphorus. They excrete it in urine and faeces, which reach water through runoff, not through the air.
      - |
        Biological processes do not convert one element into another; nitrogen fixation changes N₂ into ammonium and has nothing to do with phosphorus.
    answer: 1
    explanation: |
      With no atmospheric route, phosphorus follows water downhill, from rock and soil to lakes and ocean sediments, and returns to land only by geological uplift. Anything that speeds erosion or adds fertiliser loads lakes with phosphorus.

  # ---- Stimulus set C: a stream-invertebrate diversity data set (8.6, 8.7)
  - slug: u08-exam-q17
    type: numeric
    topic_code: "8.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      Students took six kick-net samples of stream-bed invertebrates at a site 200 m upstream of a sewage treatment outfall and six at a site 200 m downstream, on the same day, and pooled the samples from each site. Dissolved oxygen averaged 9.5 mg/L upstream and 3.1 mg/L downstream. Simpson's diversity index = 1 − Σ (n/N)², where n is the number of individuals of one taxon and N is the total at the site.

      | Taxon | Upstream | Downstream |
      |---|---|---|
      | Mayfly nymphs | 30 | 4 |
      | Stonefly nymphs | 20 | 0 |
      | Caddisfly larvae | 25 | 6 |
      | Midge larvae | 15 | 40 |
      | Aquatic worms | 10 | 150 |
      | Total (N) | 100 | 200 |
    prompt: |
      Calculate Simpson's diversity index for the downstream site. Give your answer to two decimal places.
    answer: { value: 0.40, tolerance: 0.01 }
    explanation: |
      Shares: mayflies 4/200 = 0.02, stoneflies 0, caddisflies 6/200 = 0.03, midges 40/200 = 0.20, worms 150/200 = 0.75. Squares: 0.0004 + 0 + 0.0009 + 0.04 + 0.5625 = 0.6038. Index = 1 − 0.6038 = 0.40. For the upstream site the squares are 0.09 + 0.04 + 0.0625 + 0.0225 + 0.01 = 0.225, giving 0.78 (0.775). The worms alone contribute 0.56 to the downstream sum: one dominant taxon is enough to halve the index. The downstream site has twice as many animals, but the index uses proportions, so N itself neither raises nor lowers it.

  - slug: u08-exam-q18
    type: multiple_choice
    topic_code: "8.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      Students took six kick-net samples of stream-bed invertebrates at a site 200 m upstream of a sewage treatment outfall and six at a site 200 m downstream, on the same day, and pooled the samples from each site. Dissolved oxygen averaged 9.5 mg/L upstream and 3.1 mg/L downstream. Simpson's diversity index = 1 − Σ (n/N)², where n is the number of individuals of one taxon and N is the total at the site.

      | Taxon | Upstream | Downstream |
      |---|---|---|
      | Mayfly nymphs | 30 | 4 |
      | Stonefly nymphs | 20 | 0 |
      | Caddisfly larvae | 25 | 6 |
      | Midge larvae | 15 | 40 |
      | Aquatic worms | 10 | 150 |
      | Total (N) | 100 | 200 |
    prompt: |
      Simpson's index is about 0.78 upstream and 0.40 downstream. Which statement best describes what produced the difference?
    options:
      - "The downstream site held twice as many animals, and larger samples always give lower index values."
      - "Richness fell only from five taxa to four, but evenness collapsed: aquatic worms made up 75% of the downstream sample, and a single dominant taxon pulls the index down sharply."
      - "The loss of the stoneflies alone accounts for the difference, because each missing taxon lowers the index by about 0.4."
      - "The downstream site is more diverse, because it contained more midge larvae and worms."
    option_explanations:
      - |
        The index is built from proportions (n/N), so doubling every count leaves it unchanged. The difference comes from how the animals are shared among taxa, not from how many there are.
      - |
        Correct. Squaring each share makes a dominant taxon count heavily: 0.75² = 0.56 by itself. Upstream, where no taxon exceeds 30% of the sample, the sum of squares stays small and the index stays high.
      - |
        The missing stoneflies matter little here; with even one stonefly downstream the index would still be about 0.40. What lowers it is the dominance of the worms.
      - |
        More individuals is abundance, not diversity. Diversity combines richness and evenness, and both are lower downstream.
    answer: 1
    explanation: |
      Simpson's index rewards evenness as well as richness. When one taxon dominates, its squared share swamps the sum, so ask whether a community is dominated before you count its species.

  - slug: u08-exam-q19
    type: multiple_choice
    topic_code: "8.7"
    source: "Biology 2e §46.3 Biogeochemical Cycles"
    points: 1
    stimulus: |
      Students took six kick-net samples of stream-bed invertebrates at a site 200 m upstream of a sewage treatment outfall and six at a site 200 m downstream, on the same day, and pooled the samples from each site. Dissolved oxygen averaged 9.5 mg/L upstream and 3.1 mg/L downstream. Simpson's diversity index = 1 − Σ (n/N)², where n is the number of individuals of one taxon and N is the total at the site.

      | Taxon | Upstream | Downstream |
      |---|---|---|
      | Mayfly nymphs | 30 | 4 |
      | Stonefly nymphs | 20 | 0 |
      | Caddisfly larvae | 25 | 6 |
      | Midge larvae | 15 | 40 |
      | Aquatic worms | 10 | 150 |
      | Total (N) | 100 | 200 |
    prompt: |
      Which chain of events best explains the change in the invertebrate community below the outfall?
    options:
      - "The effluent cooled the stream, slowing the metabolism of the mayflies and stoneflies until they starved."
      - "Organic matter and nutrients in the effluent fed bacterial decomposers, whose respiration consumed dissolved oxygen; oxygen-demanding mayfly, stonefly and caddisfly larvae declined, while worms and midge larvae that tolerate low oxygen thrived on the abundant organic food."
      - "The worms and midges outcompeted the mayflies for space, and the low oxygen was a result of the change in the community rather than a cause of it."
      - "The effluent contained a toxin that killed every taxon equally, so the community changed by chance."
    option_explanations:
      - |
        Nothing in the data concerns temperature, and treated effluent is usually warmer than the stream, not cooler. The measured difference between the sites is in dissolved oxygen.
      - |
        Correct. This is the decomposition-driven oxygen depletion that also drives eutrophication: added organic matter and nutrients raise microbial respiration, and only taxa tolerant of low oxygen persist. A human activity has rearranged the community through the carbon and nutrient cycles.
      - |
        A few hundred small invertebrates cannot strip 6 mg/L of oxygen from flowing water; decomposer respiration fuelled by the effluent is the better explanation, and the sensitive taxa fell exactly where oxygen fell.
      - |
        A toxin that killed every taxon equally would leave the proportions unchanged; instead worms rose fifteenfold while stoneflies vanished. The change is selective, not random.
    answer: 1
    explanation: |
      Human activities disrupt ecosystems through processes you already know. Here an organic and nutrient load raises decomposer respiration, oxygen falls, and the environment sorts species by their tolerance of low oxygen.

  - slug: u08-exam-q20
    type: multiple_choice
    topic_code: "8.6"
    source: "general knowledge"
    points: 1
    stimulus: |
      Students took six kick-net samples of stream-bed invertebrates at a site 200 m upstream of a sewage treatment outfall and six at a site 200 m downstream, on the same day, and pooled the samples from each site. Dissolved oxygen averaged 9.5 mg/L upstream and 3.1 mg/L downstream. Simpson's diversity index = 1 − Σ (n/N)², where n is the number of individuals of one taxon and N is the total at the site.

      | Taxon | Upstream | Downstream |
      |---|---|---|
      | Mayfly nymphs | 30 | 4 |
      | Stonefly nymphs | 20 | 0 |
      | Caddisfly larvae | 25 | 6 |
      | Midge larvae | 15 | 40 |
      | Aquatic worms | 10 | 150 |
      | Total (N) | 100 | 200 |
    prompt: |
      A critic says the two sites might differ for reasons that have nothing to do with the outfall, such as the size of the stream-bed gravel or the amount of shade. Which change to the study would best address that criticism?
    options:
      - "Count the downstream sample a second time to check for counting errors."
      - "Sample several sites above and below the outfall, compare them with matching sites on a similar nearby stream that has no outfall, and, if possible, compare with samples taken before the outfall began operating."
      - "Take one larger sample at the downstream site only."
      - "Recalculate diversity with a different index to see whether it gives the same ranking."
    option_explanations:
      - |
        Recounting checks the arithmetic but cannot separate the outfall's effect from differences in habitat between the two sites.
      - |
        Correct. Replicated sites, a reference stream and before-and-after data together rule out habitat, season and natural upstream-downstream change, leaving the outfall as the remaining explanation.
      - |
        A larger sample improves precision at one site, but the study still compares one site with one other site; the confounding habitat differences remain.
      - |
        Changing the index changes how diversity is summarised, not whether the outfall caused the difference. A design problem needs a design fix.
    answer: 1
    explanation: |
      A difference between two sites is a correlation until controls rule out other causes. Replication, a reference site and a before-and-after comparison are the standard tools of field ecology.

  # ---- Density (8.4)
  - slug: u08-exam-q21
    type: multiple_choice
    topic_code: "8.4"
    source: "Biology 2e §45.4 Population Dynamics and Regulation"
    points: 1
    prompt: |
      Ecologists recorded the percentage of voles killed over one winter by two causes at sites with different vole densities. At 20, 80 and 200 voles per hectare, an ice storm killed 30%, 31% and 29% of the voles, while a parasitic disease killed 4%, 15% and 38%. Which conclusion is best supported?
    options:
      - "Both causes are density-dependent, because both killed more voles in total at the densest sites."
      - "The disease is density-dependent and can regulate vole numbers, because its per-capita effect rises with density; the ice storm is density-independent, because it killed the same proportion at every density."
      - "The ice storm is density-dependent, because it killed the largest share of voles at the lowest density."
      - "Neither cause can affect population growth, because each killed less than half of the voles."
    option_explanations:
      - |
        Total deaths rise with density for almost any cause, simply because there are more voles. Density dependence is about the proportion killed, which rose only for the disease.
      - |
        Correct. A factor regulates a population only if its per-capita effect strengthens as density rises: the disease's share climbs from 4% to 38%, while the storm takes about 30% regardless of density.
      - |
        30% at 20 per hectare and 29% at 200 per hectare are essentially equal; a one-point difference is not a trend, and certainly not one that would push the population toward a set size.
      - |
        A loss of 30 to 38% in one winter is large. Any mortality slows growth; the question is whether it depends on density, which decides whether it can hold a population near K.
    answer: 1
    explanation: |
      Plot the proportion killed against density. A flat line is density-independent and resets N; a rising line is density-dependent, acts as negative feedback, and can hold a population near its carrying capacity.

  # ---- Community ecology (8.5)
  - slug: u08-exam-q22
    type: multiple_choice
    topic_code: "8.5"
    source: "Biology 2e §45.6 Community Ecology"
    points: 1
    prompt: |
      Hoverflies are harmless flies with black-and-yellow stripes resembling those of stinging wasps, and birds that are stung by a wasp learn to avoid striped insects. In a summer when hoverflies vastly outnumber wasps in a meadow, which outcome is most likely?
    options:
      - "The hoverflies are protected more than ever, because with more striped insects the birds see the warning pattern more often."
      - "Protection weakens for both hoverflies and wasps, because young birds mostly catch harmless striped insects and learn that the pattern means food rather than pain."
      - "The wasps lose their stings, because the warning pattern is no longer needed."
      - "Nothing changes, because the birds' avoidance of stripes is innate and cannot be altered by experience."
    option_explanations:
      - |
        Seeing the pattern often protects only if seeing it is usually followed by a sting. When most striped insects are harmless, the pattern's message is diluted.
      - |
        Correct. Batesian mimicry is a bluff that works only while mimics are rare relative to their models. When mimics dominate, predators' learning is reinforced by meals rather than stings, and attacks on mimic and model both rise.
      - |
        A heritable trait does not disappear within a summer because it is less useful; stings are the wasps' defence, and any change would take selection over generations.
      - |
        The stem says birds learn to avoid stripes after being stung, so the avoidance is learned and experience changes it. That learning is exactly why the ratio of mimics to models matters.
    answer: 1
    explanation: |
      In Batesian mimicry the harmless species free-rides on the model's honest warning. Its success is frequency-dependent: the commoner the mimic, the weaker the protection for every insect wearing the pattern.

  - slug: u08-exam-q23
    type: multiple_choice
    topic_code: "8.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Soybean plants grown in nitrate-rich soil form far fewer root nodules, and so host far fewer nitrogen-fixing Rhizobium bacteria, than soybeans grown in nitrate-poor soil. Which interpretation is best supported?
    options:
      - "The relationship is a mutualism with a cost: the plant pays the bacteria in sugars, so when usable nitrogen is already plentiful in the soil, plants that limit nodule formation keep more sugar for their own growth."
      - "Nitrate kills Rhizobium, so in rich soil the relationship becomes parasitism."
      - "The relationship is commensalism, because the plant gains nothing from the bacteria."
      - "In nitrate-rich soil the bacteria fix nitrate instead of N₂, so fewer of them are needed."
    option_explanations:
      - |
        Correct. Each partner in a mutualism pays a cost for the benefit it receives. The plant regulates nodule formation, investing in its partner when nitrogen is scarce and cutting back when the soil already supplies it.
      - |
        Nothing in the observation shows that the bacteria are killed or that either partner is harmed; the plant forms fewer nodules, which is a regulated response, not damage.
      - |
        In nitrate-poor soil the plant gains nitrogen from the bacteria and the bacteria gain sugars: +/+, a mutualism. Commensalism (+/0) would require one partner to be unaffected.
      - |
        Fixation reduces N₂ to ammonium. Nitrate is already a fixed, usable form of nitrogen, so there is nothing for the bacteria to fix in it.
    answer: 0
    explanation: |
      Symbioses are classified by the sign of each partner's outcome, and the signs can depend on conditions. A mutualism persists because, where the resource is scarce, each partner gains more than it pays.

  - slug: u08-exam-q24
    type: multiple_choice
    topic_code: "8.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Along a rocky Pacific coast, sea otters eat sea urchins, and sea urchins graze kelp. Where otters were hunted out, urchins multiplied and kelp forests were reduced to bare rock; where otters returned, urchins declined and kelp forests, with the fish that shelter in them, grew back. Which description is best supported?
    options:
      - "Sea otters are a keystone predator whose effect passes down a trophic cascade to the kelp, a foundation species that creates habitat for many others."
      - "Sea otters are a foundation species, because they build the kelp-forest habitat."
      - "Sea otters and kelp are competitors, because both are reduced when urchins are abundant."
      - "Kelp is the keystone species, because it is the most abundant organism in the forest."
    option_explanations:
      - |
        Correct. The otter's effect on the whole community, from urchins to kelp to fish, far exceeds its own abundance, the defining feature of a keystone species; kelp builds the physical habitat, the defining feature of a foundation species.
      - |
        Otters do not build habitat; kelp does. The otters matter because they control the herbivore that would otherwise remove the habitat builder.
      - |
        Otters and kelp do not share a limiting resource. Otters help kelp indirectly by eating its grazer: an indirect positive effect through the food chain, not competition.
      - |
        Abundance and habitat-building make kelp a foundation species. A keystone species is defined by an effect out of proportion to its abundance, which describes the otter.
    answer: 0
    explanation: |
      Trace effects through the food web: predator down, herbivore up, producer down, and the reverse when the predator returns. Separate the species that builds the habitat (foundation) from the one that holds the system in place (keystone).

  # ---- Biodiversity (8.6)
  - slug: u08-exam-q25
    type: multiple_choice
    topic_code: "8.6"
    source: "general knowledge"
    points: 1
    prompt: |
      Grassland plots were sown with 1, 4 or 16 plant species. During a severe drought, total plant biomass fell by 70% in the 1-species plots, 45% in the 4-species plots and 25% in the 16-species plots, and in the year after the drought only the 16-species plots returned to their pre-drought biomass. Which conclusion is best supported?
    options:
      - "The diverse plots were both more resistant (smaller loss) and more resilient (faster recovery), because species differ in drought tolerance, so surviving species can expand into the gaps left by others."
      - "The diverse plots lost less biomass because their soils held more water."
      - "Diversity made no difference, because every plot lost biomass during the drought."
      - "The 1-species plots recovered fastest, because they had the most room to grow back."
    option_explanations:
      - |
        Correct. With many species, the chance that some tolerate drought is high, and those species compensate for the losses of others. Resistance and resilience both rise with diversity, as the drought-year and recovery-year data show.
      - |
        The data say nothing about soil water, and all plots experienced the same drought. An explanation must come from the variable that differed, the number of species.
      - |
        Every plot lost biomass, but the size of the loss fell steadily from 70% to 25% as species number rose; that graded response is the effect of diversity.
      - |
        The stem says only the 16-species plots returned to their pre-drought biomass the following year; nothing indicates the monocultures recovered fastest.
    answer: 0
    explanation: |
      Diversity is insurance. A community with several species able to perform each role can lose some and keep functioning, which is why diverse ecosystems resist disturbance and recover from it faster.

  # ---- Disruptions (8.7)
  - slug: u08-exam-q26
    type: multiple_choice
    topic_code: "8.7"
    source: "Biology 2e §44.5 Climate and the Effects of Global Climate Change"
    points: 1
    prompt: |
      Over 60 years, the lowest elevation at which a small, cold-adapted mammal is found in a mountain range has risen by about 150 m, while its upper limit has stayed at the summits. Which inference about this population is best supported?
    options:
      - "Its suitable habitat is shrinking as warming pushes its lower limit upslope, and because it cannot move above the summits, it faces an increasing risk of local extinction."
      - "It is expanding its range, because it now occupies higher ground than before."
      - "It has evolved tolerance of warmer temperatures, which is why it no longer needs the lower slopes."
      - "Its range has not changed, because its upper limit is unchanged."
    option_explanations:
      - |
        Correct. A rising lower limit with a fixed upper limit means a narrowing band of habitat, and because mountains taper, the area at higher elevations is smaller. Mountaintop and polar species have nowhere to go once the top is reached.
      - |
        The upper limit was already at the summits, so no new ground was occupied. Losing the lower slopes contracts the range.
      - |
        Evolving heat tolerance would let the species keep or extend its lower range; instead it has withdrawn from the warmer, lower slopes, which suggests it has not adapted fast enough.
      - |
        A range has two edges; the lower edge moved 150 m upward, so the occupied band is narrower even though the top is the same.
    answer: 0
    explanation: |
      Climate change shifts where conditions suit a species, typically poleward and upslope. Species already at the top of a mountain or the edge of a continent cannot follow, and their habitat shrinks.

  - slug: u08-exam-q27
    type: multiple_choice
    topic_code: "8.7"
    source: "general knowledge"
    points: 1
    prompt: |
      The fungus that causes white-nose syndrome is common in European caves, where hibernating bats carry it with little mortality. After it reached North America, some hibernating bat colonies there lost more than 90% of their members within a few years. Which explanation is most consistent with evolution and community ecology?
    options:
      - "European bats share a long evolutionary history with the fungus, so selection has already favoured bats that tolerate it; North American bats met it as a novel pathogen with no evolved defences."
      - "The fungus mutated into a deadlier form in response to the colder North American caves, in order to spread faster."
      - "North American bats are weaker because they are larger and need more food in winter."
      - "The fungus is a density-independent factor, so it killed the same proportion of bats on both continents."
    option_explanations:
      - |
        Correct. An introduced pathogen, like an introduced predator, is most destructive where the hosts have never been selected to resist it. The same logic explains the chytrid fungus in amphibians and the brown tree snake on Guam.
      - |
        Mutations do not arise in response to need, and the observation is explained without a new strain: the same fungus has very different effects on hosts with and without a shared evolutionary history.
      - |
        Nothing in the observation compares body size; the contrast is between hosts with and without a history of exposure, and that is what an explanation must address.
      - |
        The data show very different proportions killed on the two continents, so the effect is not the same everywhere; the spread of a contagious disease is also usually density-dependent, rising in crowded hibernation sites.
    answer: 0
    explanation: |
      Invasive species and introduced pathogens succeed because native species were never selected to cope with them. The disruption then selects among whatever variation the natives already carry.

  - slug: u08-exam-q28
    type: multiple_choice
    topic_code: "8.7"
    source: "general knowledge"
    points: 1
    prompt: |
      When Mount St. Helens erupted in 1980, parts of the surrounding land were buried under deep, sterile pumice, while in other parts late snow still covered the ground and protected the soil, roots and burrowing animals beneath it. Which prediction about recovery is best supported?
    options:
      - "Both areas recover at the same rate, because both experienced the same eruption."
      - "The snow-protected areas recover faster, by secondary succession from surviving soil, roots, seeds and animals, while the pumice areas must go through primary succession starting with pioneer species."
      - "The pumice areas recover faster, because the eruption fertilised them with fresh minerals."
      - "Neither area can recover, because volcanic eruptions permanently remove the species living there."
    option_explanations:
      - |
        The eruption was the same, but what survived it was not. Recovery depends on the biological legacy left behind: soil, roots, seeds and animals.
      - |
        Correct. Where soil and survivors remain, secondary succession starts from them and is fast; on bare pumice there is no soil, so lichens, mosses and other pioneers must build it first, which takes far longer.
      - |
        Volcanic material does weather into fertile soil, but over decades to centuries; fresh pumice holds little water, no organic matter and almost no nitrogen.
      - |
        Communities recover from eruptions by succession, as on new lava in Hawaii; a geological disruption resets a community rather than ending it.
    answer: 1
    explanation: |
      Geological and meteorological disruptions reset communities. How fast they recover depends on what survives: soil and survivors mean secondary succession, bare rock means primary succession.

  # ---- Cumulative review, multiple choice (Units 1-7)
  - slug: u08-exam-q29
    type: multiple_choice
    topic_code: "1.6"
    source: "Biology 2e §3.5 Nucleic Acids"
    points: 1
    prompt: |
      Review. Rapidly dividing algae in a lake need far more phosphorus than slowly growing cells do. Which molecules account for most of that demand?
    options:
      - "Cellulose and starch, because phosphorus links their glucose units together."
      - "Nucleic acids, especially the ribosomal RNA of the many ribosomes a growing cell builds, because every nucleotide carries a phosphate in the sugar-phosphate backbone; ATP and membrane phospholipids add to the demand."
      - "Proteins, because every amino acid contains a phosphate group."
      - "Triglycerides, because each fatty acid ends in a phosphate group."
    option_explanations:
      - |
        Polysaccharides are built from carbon, hydrogen and oxygen; glycosidic linkages contain no phosphorus.
      - |
        Correct. Every nucleotide in DNA and RNA contributes one phosphate to the backbone, and fast growth needs many ribosomes, so rRNA is a large phosphorus sink. That is one reason phosphorus limits algal growth in lakes.
      - |
        Amino acids contain C, H, O, N and sometimes S, but not phosphorus; phosphate is added to some proteins afterwards as a regulatory tag, a small share of a cell's phosphorus.
      - |
        A triglyceride is glycerol plus three fatty acids and contains no phosphate; it is the phospholipids, with their phosphate heads, that contain phosphorus.
    answer: 1
    explanation: |
      Link the cycle to the molecule: phosphorus is scarce in nature and essential to nucleic acids, ATP and phospholipids, so fast growth needs phosphorus, and adding phosphate to a lake releases algae from limitation.

  - slug: u08-exam-q30
    type: multiple_choice
    topic_code: "2.7"
    source: "Biology 2e §5.2 Passive Transport"
    points: 1
    prompt: |
      Review. Rising sea level pushes seawater into a coastal freshwater marsh. Although the soil remains soaked, the freshwater plants wilt and many die. Which explanation is correct?
    options:
      - "The soil water has become hypertonic to the root cells, so water moves out of the roots by osmosis toward the higher solute concentration, and the plants lose turgor."
      - "Salt enters the roots and makes them hypertonic, so the root cells burst."
      - "The plants are drowned by the extra water, because roots cannot take up water when the soil is saturated."
      - "Salt water has a higher water potential than fresh water, so it floods into the roots and damages them."
    option_explanations:
      - |
        Correct. Dissolved salt lowers the solute potential, and therefore the water potential, of the soil water below that of the root cells, so water leaves the plant even though it is surrounded by water. Wilting is the loss of turgor pressure.
      - |
        If the roots became hypertonic to the soil, water would move in, not out, and plant cells are protected from bursting by their walls. The observation is wilting, which means water loss.
      - |
        The marsh plants grew in saturated soil before the seawater arrived, so saturation alone did not kill them. What changed was the solute concentration.
      - |
        Adding solute lowers water potential (Ψs = −iCRT becomes more negative), so salt water has a lower water potential than fresh water, and water moves from the plant into it.
    answer: 0
    explanation: |
      Water moves from higher to lower water potential. A salt intrusion turns the soil water into a hypertonic solution, which is why sea-level rise disrupts coastal ecosystems before the land is submerged.

  - slug: u08-exam-q31
    type: multiple_choice
    topic_code: "3.2"
    source: "Biology 2e §6.5 Enzymes"
    points: 1
    prompt: |
      Review. In a coastal fish whose range runs from cold northern waters to warm southern ones, northern populations carry a form of the enzyme lactate dehydrogenase that works fastest at low temperatures, and southern populations a form that works fastest at warm temperatures. Which explanation is best supported?
    options:
      - "Each enzyme form has a temperature optimum suited to its environment; selection has favoured the form whose structure keeps catalysis efficient at local temperatures, which helps set where each population can live."
      - "Cold water denatures the southern form, which is why it works best in warm water."
      - "Individual fish change their enzyme's amino-acid sequence when they move into colder water."
      - "Temperature does not affect enzyme activity in fish, because fish are ectotherms."
    option_explanations:
      - |
        Correct. Enzyme activity depends on temperature, and different forms of an enzyme have different optima. Where body temperature follows the water, natural selection matches the enzyme to the habitat, linking a species' distribution to its biochemistry.
      - |
        Cold slows enzymes by reducing molecular motion; it does not usually denature them. Denaturation comes from heat, extreme pH or salt that break the bonds holding the fold.
      - |
        An individual's amino-acid sequences are fixed by its genes; the two forms differ between populations because of different alleles, not because fish rewrite their proteins.
      - |
        Ectotherms are the animals most affected by temperature, because their body temperature follows the environment and so does the rate of every enzyme they carry.
    answer: 0
    explanation: |
      Where a species can live is often decided at the level of its proteins. Enzyme temperature optima, set by structure and shaped by selection, are one link between Unit 3 and the distribution of populations in Unit 8.

  - slug: u08-exam-q32
    type: multiple_choice
    topic_code: "4.2"
    source: "general knowledge"
    points: 1
    prompt: |
      Review. A plant detects the length of the night with the pigment phytochrome in its leaves. When nights become long enough, the leaves produce a mobile signal that travels to the shoot tip, where it changes the expression of genes that turn a growing shoot into a flower. In the language of cell signaling, which matching is correct?
    options:
      - "Light is the response, phytochrome is the second messenger and flowering is the receptor."
      - "The change in light is the environmental signal, phytochrome is the receptor, the mobile signal relays the message to target cells, and the change in gene expression that leads to flowering is the response."
      - "Phytochrome is the ligand, the shoot tip is the receptor and flowering is transduction."
      - "Flowering is controlled directly by the light that reaches the shoot tip, so no signal transduction is involved."
    option_explanations:
      - |
        This reverses the pathway: light is the input the cell detects and flowering is the eventual output; a second messenger is a small intracellular relay molecule such as cAMP.
      - |
        Correct. Reception, transduction and response apply to plants as to animals: phytochrome receives the light signal, a relay carries it between tissues, and target cells respond by changing which genes they transcribe.
      - |
        Phytochrome is a protein that absorbs light and changes shape, which makes it the receptor; a ligand is the molecule or stimulus that activates a receptor.
      - |
        The stem says night length is detected in the leaves and the message carried to the shoot tip; detection and response happen in different places, joined by a signal.
    answer: 1
    explanation: |
      Every response to the environment, in a plant or an animal, runs through the same three stages: reception, transduction and response. Recognising them in an unfamiliar system is a common cross-unit question.

  - slug: u08-exam-q33
    type: multiple_choice
    topic_code: "5.5"
    source: "general knowledge"
    points: 1
    prompt: |
      Review. Genetically identical water fleas (Daphnia) from a single clone were raised in two tanks. Those raised in water that had held predatory insect larvae developed a pointed helmet and spines that make them harder to swallow; those raised in clean water did not. Which statement is correct?
    options:
      - "The predator chemicals caused mutations in the helmet genes of the exposed water fleas."
      - "This is an environmental effect on phenotype: one genotype produces different phenotypes depending on a chemical cue, and the ability to respond in this way is itself a heritable trait shaped by predation."
      - "The two groups must differ genetically, because they look different."
      - "The helmet is a learned behaviour, acquired by watching the predators."
    option_explanations:
      - |
        The groups are clones; a cue that switches on development of the helmet in every exposed individual is regulating gene expression, not mutating genes. Mutations are random and would not appear in every exposed animal.
      - |
        Correct. This is phenotypic plasticity: the environment acting on gene expression during development. Because a defence has a cost, producing it only when predators are present is favoured by selection.
      - |
        Different phenotypes from identical genotypes is the definition of an environmental effect on phenotype; the clonal design rules out genetic differences.
      - |
        A helmet is a body structure produced during development, not a behaviour, and water fleas do not acquire structures by observation.
    answer: 1
    explanation: |
      Phenotype depends on genotype and environment together. Inducible defences show the environment switching genes on during development, and the capacity to respond is what selection acts on.

  - slug: u08-exam-q34
    type: multiple_choice
    topic_code: "7.4"
    source: "Biology 2e §19.2 Population Genetics"
    points: 1
    prompt: |
      Review. Genetic surveys show that an invasive plant in North America descends from a handful of individuals introduced in one shipment of ornamental seed, and that it has far less genetic variation than populations in its native range. Which process best explains the low variation?
    options:
      - "The founder effect: the few introduced individuals carried only a small sample of the native population's alleles, and drift in the small early population lost still more."
      - "Natural selection in North America removed every allele that was not beneficial."
      - "Gene flow from the native range reduced variation in the invasive population."
      - "The plant's mutation rate fell after it was introduced to a new continent."
    option_explanations:
      - |
        Correct. A population founded by a few individuals is a small sample, and small samples miss rare alleles; drift keeps removing variation while the population stays small. The cause is chance, not selection.
      - |
        Selection can remove some alleles, but it would not reduce variation across the whole genome, including at neutral sites; the very small founding number is the simpler explanation.
      - |
        Gene flow from a diverse source population adds alleles and raises variation; a single introduction with no later arrivals is what keeps variation low.
      - |
        There is no reason a new continent would lower the mutation rate, and new mutations accumulate far too slowly to explain a large difference in standing variation.
    answer: 0
    explanation: |
      Low variation in an introduced population is the signature of a founder event. That such populations can still be invasive shows how much release from natural enemies matters, though low variation may limit their later adaptation.

  # ---- Select-all (4, including set B)
  - slug: u08-exam-q35
    type: multi_select
    topic_code: "8.1"
    source: "Biology 2e §45.7 Behavioral Biology: Proximate and Ultimate Causes of Behavior"
    points: 2
    partial_credit: true
    prompt: |
      Which of the following are behavioural or physiological responses of organisms to a predictable seasonal change in their environment? Select all that apply.
    options:
      - "Ground squirrels entering hibernation as autumn days shorten"
      - "Songbirds migrating south as day length shortens in late summer"
      - "A maple tree shedding its leaves before winter"
      - "A rabbit developing a new allele for thicker fur after the first frost"
      - "The water of a pond warming during the summer"
    option_explanations:
      - |
        Correct. Hibernation is a physiological response, cued by day length and temperature, that lowers metabolic rate through a season when food is scarce.
      - |
        Correct. Migration is a behavioural response to a seasonal cue, day length, that moves the animal to where resources will be available.
      - |
        Correct. Leaf shedding is a physiological response that saves water and avoids frost damage in a season when leaves would return little photosynthesis.
      - |
        Individuals do not produce new alleles in response to the environment; mutations are random. A seasonal coat change in an individual is a response, but a new allele is not.
      - |
        A pond warming is a change in the abiotic environment itself, not a response by an organism to that change.
    answer: [0, 1, 2]
    explanation: |
      A response belongs to an organism, is triggered by a cue such as day length or temperature, and raises fitness by matching activity to the season. Neither a random genetic change nor a change in the environment itself counts.

  - slug: u08-exam-q36
    type: multi_select
    topic_code: "8.2"
    source: "Biology 2e §46.3 Biogeochemical Cycles"
    points: 2
    partial_credit: true
    prompt: |
      Which processes convert nitrogen from a form plants cannot absorb into ammonium or nitrate that they can? Select all that apply.
    options:
      - "Fixation of atmospheric N₂ by Rhizobium in legume root nodules"
      - "Ammonification of the proteins in fallen leaves by soil bacteria and fungi"
      - "Industrial fixation of N₂ to make ammonia fertiliser"
      - "Denitrification of nitrate by Pseudomonas in waterlogged soil"
      - "Assimilation of nitrate into amino acids by root cells"
    option_explanations:
      - |
        Correct. The bacteria's nitrogenase breaks the N≡N triple bond and produces ammonium, which is passed to the plant.
      - |
        Correct. Plants cannot absorb proteins; decomposers break down the organic nitrogen of dead tissue and release it as ammonium.
      - |
        Correct. Industrial fixation now rivals natural fixation; it makes the same conversion of N₂ into a usable form, at a large energy cost.
      - |
        Denitrification runs the other way, turning usable nitrate into N₂ gas that plants cannot use.
      - |
        Assimilation uses nitrate that the plant has already absorbed and builds it into organic molecules; it does not make any new nitrogen available to plants.
    answer: [0, 1, 2]
    explanation: |
      The nitrogen cycle has entry points into the pool plants can use (fixation, ammonification) and an exit from it (denitrification). Nitrification and assimilation move nitrogen between forms but do not change whether plants can reach it.

  - slug: u08-exam-q37
    type: multi_select
    topic_code: "3.5"
    source: "Biology 2e §46.3 Biogeochemical Cycles"
    points: 2
    partial_credit: true
    prompt: |
      Review. Which processes in a forest return carbon to the atmosphere as CO₂? Select all that apply.
    options:
      - "Aerobic respiration in the mitochondria of tree roots"
      - "Respiration by fungi decomposing fallen logs"
      - "The Calvin cycle in leaf chloroplasts"
      - "The splitting of water in the light-dependent reactions"
      - "Combustion of wood in a forest fire"
    option_explanations:
      - |
        Correct. Pyruvate oxidation and the citric acid cycle release the carbon of glucose as CO₂ in every living cell of the tree, including root cells that never photosynthesise.
      - |
        Correct. Decomposers respire the organic carbon of dead wood; without them, carbon would pile up as dead matter instead of returning to the air.
      - |
        The Calvin cycle fixes CO₂ into sugar; it removes carbon from the atmosphere rather than returning it.
      - |
        Splitting water at photosystem II releases O₂, not CO₂; no carbon is involved in that step.
      - |
        Correct. Burning oxidises the same organic molecules that respiration does, but rapidly and without capturing the energy as ATP; it returns their carbon to the air as CO₂.
    answer: [0, 1, 4]
    explanation: |
      Every oxidation of organic carbon, by mitochondria, by decomposers or by fire, returns CO₂; only photosynthesis takes it out. The carbon cycle is cellular respiration and photosynthesis at the scale of the planet.

  # ---- True/false (5)
  - slug: u08-exam-q38
    type: true_false
    topic_code: "8.2"
    source: "Biology 2e §46.3 Biogeochemical Cycles"
    points: 1
    prompt: |
      True or false: Of the liquid fresh water on Earth, most is held in lakes and rivers rather than underground.
    answer: false
    explanation: |
      False. Only about 2.5% of Earth's water is fresh; of that, about 69% is frozen in glaciers and ice caps and about 31% is groundwater, leaving roughly 0.3% in lakes and rivers. Even counting only liquid water, groundwater holds about a hundred times as much as lakes and rivers. Residence times explain why that matters: water spends weeks in a river but can spend thousands of years in deep groundwater, so an overdrawn aquifer recharges very slowly.

  - slug: u08-exam-q39
    type: true_false
    topic_code: "8.6"
    source: "general knowledge"
    points: 1
    prompt: |
      True or false: For a community containing S species, Simpson's diversity index 1 − Σ (n/N)² reaches its largest possible value, 1 − 1/S, when all S species are equally abundant.
    answer: true
    explanation: |
      True. With S equally common species each share is 1/S, so Σ (n/N)² = S × (1/S)² = 1/S and the index is 1 − 1/S: 0.50 for two species, 0.75 for four, 0.90 for ten. Any unevenness raises the sum of squares and lowers the index. That is why the index measures evenness as well as richness, and why its ceiling approaches 1 only as species are added.

  - slug: u08-exam-q40
    type: true_false
    topic_code: "8.5"
    source: "Biology 2e §45.6 Community Ecology"
    points: 1
    prompt: |
      True or false: In Mullerian mimicry, a harmless species gains protection from predators by resembling a toxic one.
    answer: false
    explanation: |
      False. That describes Batesian mimicry, a harmless copier of a dangerous model. In Mullerian mimicry several species that are all genuinely toxic or distasteful share one warning pattern, as Heliconius butterflies do, so a predator that learns from any one of them avoids them all. Mullerian mimicry is an honest shared signal; Batesian mimicry is a bluff that works only while the mimics are rare.

  - slug: u08-exam-q41
    type: true_false
    topic_code: "8.3"
    source: "Biology 2e §45.1 Population Demography"
    points: 1
    prompt: |
      True or false: A species whose females release millions of eggs into open water and provide no parental care would be expected to show a Type I survivorship curve.
    answer: false
    explanation: |
      False. Releasing huge numbers of unprotected eggs means most offspring die in the first interval of life, which gives a Type III curve: a steep early drop that flattens for the few survivors, as in most fish, marine invertebrates and many plants. A Type I curve, with most individuals surviving to old age, goes with few offspring and heavy parental care, as in humans and large mammals.

  - slug: u08-exam-q42
    type: true_false
    topic_code: "7.2"
    source: "Biology 2e §19.3 Adaptive Evolution"
    points: 1
    prompt: |
      Review. True or false: When a drought leaves only large, hard seeds and most small-beaked finches starve, the surviving finches' beaks grow larger during their lifetimes, and this is how the population evolves larger beaks.
    answer: false
    explanation: |
      False. Individuals do not evolve; populations do. The drought selects among beak sizes that already exist: larger-beaked birds survive and reproduce more, and because beak size is heritable, the next generation's average beak is larger. An individual's beak does not grow to match the seed supply, and a change acquired during life would not be inherited. Every ecological disruption in Unit 8 works the same way: it changes which pre-existing variants leave offspring.

  # ---- Fill in the blank (5)
  - slug: u08-exam-q43
    type: fill_blank
    topic_code: "8.1"
    source: "Biology 2e §45.7 Behavioral Biology: Proximate and Ultimate Causes of Behavior"
    points: 1
    prompt: |
      Crows in a city park at first take flight whenever a jogger passes, but after several weeks of harmless encounters they ignore joggers while still fleeing from dogs. This simple form of learning, a loss of response to a repeated stimulus that proves harmless, is called ____.
    answer: ["habituation"]
    explanation: |
      Habituation saves the time and energy of responding to stimuli that carry no consequence, while the response to genuine threats stays intact; that selectivity is what makes it adaptive, and it is why the crows still flee from dogs. Fatigue would dull every response, not just this one. Imprinting and conditioning are other forms of learning and are not accepted.

  - slug: u08-exam-q44
    type: fill_blank
    topic_code: "8.2"
    source: "Biology 2e §46.3 Biogeochemical Cycles"
    points: 1
    prompt: |
      Bacteria such as Rhizobium in legume root nodules, free-living Azotobacter and many cyanobacteria break the triple bond of atmospheric N₂ and convert it to ammonium, a process called nitrogen ____.
    answer: ["fixation", "nitrogen fixation"]
    explanation: |
      Nitrogen fixation is the only natural route by which atmospheric N₂ enters living things, and only prokaryotes carry nitrogenase, the enzyme that does it. Ammonification, nitrification and denitrification move nitrogen between other forms and are not accepted.

  - slug: u08-exam-q45
    type: fill_blank
    topic_code: "8.4"
    source: "Biology 2e §45.4 Population Dynamics and Regulation"
    points: 1
    prompt: |
      Elephants mature late, produce one calf every four or five years and care for each calf for years. Species with this life history, adapted to live near the carrying capacity of a stable environment, are described as ____-selected.
    answer: ["K"]
    explanation: |
      K-selected species invest heavily in a few offspring because, near carrying capacity, competition is intense and a well-provisioned offspring is more likely to survive it. r-selected species, such as dandelions and many insects, do the opposite, producing many cheap offspring to exploit disturbed habitats at low density. "r" is not accepted.

  - slug: u08-exam-q46
    type: fill_blank
    topic_code: "3.4"
    source: "Biology 2e §8.3 Using Light Energy to Make Organic Molecules"
    points: 1
    prompt: |
      Review. The enzyme that attaches CO₂ to ribulose bisphosphate in the Calvin cycle, and so moves carbon from the atmosphere into the biological part of the carbon cycle, is ____.
    answer: ["rubisco", "RuBisCO", "ribulose bisphosphate carboxylase"]
    explanation: |
      Rubisco catalyses carbon fixation, the first step of the Calvin cycle and the largest flux of carbon from the atmosphere into living things each year. It is probably the most abundant protein on Earth, partly because it is slow. ATP synthase and other enzymes of photosynthesis are not accepted.

  - slug: u08-exam-q47
    type: fill_blank
    topic_code: "6.8"
    source: "Biology 2e §17.1 Biotechnology"
    points: 1
    prompt: |
      Review. To survey a pond for a rare salamander without catching any, ecologists filter the water, extract the traces of DNA shed by animals, and copy a species-specific sequence millions of times by the technique known as ____.
    answer: ["PCR", "polymerase chain reaction"]
    explanation: |
      PCR uses a heat-stable DNA polymerase and primers specific to one species' sequence; each cycle of heating and cooling doubles the target, so a handful of shed molecules becomes enough to detect. Environmental DNA surveys use it to record species that are rare, hidden or nocturnal. Gel electrophoresis, which separates the products, and sequencing are not accepted.

  # ---- Free response
  - slug: u08-exam-q48
    type: short_answer
    topic_code: "8.5"
    source: "general knowledge"
    points: 4
    prompt: |
      Analyze data. On a rocky shore, small barnacles of species C are found only in the upper intertidal zone, while a larger barnacle, species B, covers the rocks of the lower zone. An ecologist marked young C barnacles that had settled in both zones. On half the rocks in each zone she removed every B barnacle (in the upper zone, where B is naturally absent, she carried out the same scraping procedure without removing anything); the other rocks were left alone. Survival of C after one year:

      | Zone | C survival, rocks left alone (%) | C survival, removal procedure (%) |
      |---|---|---|
      | Upper (B naturally absent) | 85 | 86 |
      | Lower | 10 | 79 |

      (a) Using the data, describe the fundamental niche and the realised niche of species C on this shore.
      (b) Explain the most likely mechanism by which B reduces the survival of C in the lower zone.
      (c) Explain why the upper-zone comparison is needed to support your answer to (b).
      (d) Predict what would happen to species C in the lower zone if a predator that eats B, but not C, became common there, and justify your prediction.
    answer: |
      C can survive in both zones (fundamental niche: upper and lower), but in the presence of B it persists only in the upper zone (realised niche). B outcompetes C for space on the rock, overgrowing, crushing or prying it off. In the upper zone the procedure made no difference (85% versus 86%), so the scraping itself did not raise survival and the lower-zone rise (10% to 79%) is due to the removal of B. A predator of B would free space in the lower zone, so C survival there would rise toward 79% and C would extend its range downward.
    explanation: |
      Four points.

      (a) Niches, 1 pt: the fundamental niche includes both zones, because with B removed C survives 79% in the lower zone, close to its 85–86% in the upper zone; the realised niche is the upper zone only, because with B present C survives just 10% in the lower zone. Both niches and at least one number are required.

      (b) Mechanism, 1 pt: interspecific competition for a limiting resource, space on the rock; the larger, faster-growing B overgrows, smothers, crushes or undercuts C. Accept "competitive exclusion" with space named as the resource. Saying that B eats C earns zero, since barnacles are filter feeders.

      (c) Control, 1 pt: the upper zone is a control for the procedure: B is absent there, yet the same scraping was applied, and survival was unchanged (85% versus 86%), so disturbance by the procedure does not itself raise survival; the large lower-zone difference (10% versus 79%) can therefore be attributed to removing B. Saying only "it is a control" without explaining what it controls for earns zero.

      (d) Prediction, 1 pt: C survival in the lower zone would rise toward the 79% seen with B removed, and C's realised niche would expand downward, because the predator reduces B and frees space. Both the prediction and the link through reduced competition are required.

      Zero: describing the niche only as "where C lives" without distinguishing fundamental from realised; explaining the lower-zone deaths by abiotic factors alone, which the 79% survival with B removed contradicts.

  - slug: u08-exam-q49
    type: long_answer
    topic_code: "8.4"
    source: "general knowledge"
    points: 8
    prompt: |
      Interpreting and evaluating experimental results. To test how crowding affects a frog population, researchers placed tadpoles of one species into outdoor tanks at three densities and gave every tank the same daily ration of food. A fourth treatment held the highest density with four times the standard ration. Each value is the mean of four tanks; standard errors were all less than 5% of the mean.

      | Tadpoles per tank | Daily food ration | Survival to metamorphosis (%) | Mean mass at metamorphosis (mg) | Mean days to metamorphosis |
      |---|---|---|---|---|
      | 10 | standard | 90 | 410 | 42 |
      | 40 | standard | 78 | 290 | 51 |
      | 160 | standard | 41 | 170 | 66 |
      | 160 | 4 × standard | 80 | 300 | 50 |

      (a) Identify the independent variable in the first three treatments, and explain the purpose of the fourth treatment.
      (b) Describe how increasing density affected survival and mass at metamorphosis in the standard-ration tanks, and calculate the mean number of tadpoles per tank that reached metamorphosis at each of the three densities.
      (c) Explain how these results show density-dependent regulation, and how they relate to the term (K − N)/K in the logistic growth equation.
      (d) Evaluate the claim that competition for food, rather than some other effect of crowding such as accumulated waste or physical contact, is the main cause of the density effect. Support your evaluation with a comparison of specific values.
      (e) Frog populations can also lose a whole cohort of tadpoles when a pond dries out early. State whether early drying is a density-dependent or a density-independent factor, and predict how survival and mass at metamorphosis would change for the survivors if drying killed half the tadpoles in a crowded pond. Justify your prediction with the data.
    answer: |
      The independent variable is tadpole density (10, 40 and 160 per tank); the fourth treatment keeps density at 160 but gives each tadpole the same food as in the 40-tadpole tanks, to test whether food is the mechanism. As density rose, survival fell from 90% to 78% to 41% and mass from 410 to 290 to 170 mg (and development slowed from 42 to 66 days); metamorphs per tank were 9, 31.2 and 65.6, so total output rose while per-capita success fell. The per-capita effect of crowding grows with density, a negative feedback that is the biology behind the shrinking (K − N)/K term. The claim is supported: at 160 tadpoles with 4 × food, results (80%, 300 mg, 50 days) match the 40-tadpole tanks (78%, 290 mg, 51 days) despite four times the crowding, waste and contact. Drying is density-independent; halving a crowded pond's tadpoles would raise the survivors' survival and mass to values between those of the 160- and 40-tadpole tanks, because each would have more food.
    explanation: |
      Eight points.

      (a) 1 pt: the independent variable is the number of tadpoles per tank (10, 40, 160); the fourth treatment holds density at 160 while multiplying the food by four, so that food per tadpole equals that in the 40-tadpole tanks, separating the effect of food per tadpole from the effect of crowding itself. Both parts are required.

      (b) 2 pts: 1 pt for the description with numbers: survival fell from 90% to 78% to 41% and mass at metamorphosis from 410 to 290 to 170 mg as density rose from 10 to 40 to 160 (mention of slower development, 42 to 66 days, is welcome but not required); 1 pt for the calculation: 10 × 0.90 = 9, 40 × 0.78 = 31.2 (accept 31) and 160 × 0.41 = 65.6 (accept 66) metamorphs per tank. A note that total output still rose while per-capita success fell is credited within this point, not required.

      (c) 2 pts: 1 pt for density dependence: survival and growth per individual fall as density rises, so the factor's per-capita effect strengthens with crowding, a negative feedback that slows population growth as the population grows; 1 pt for the link to the equation: (K − N)/K shrinks toward zero as N approaches K, reducing realised per-capita growth below rmax, and these data show the biological cause, intraspecific competition lowering survival (and producing smaller metamorphs, which are likely to survive and reproduce less, lowering future births).

      (d) 2 pts: 1 pt for a supported conclusion with a comparison: at 160 tadpoles with 4 × food, survival (80%), mass (300 mg) and development time (50 days) are close to the 40-tadpole standard tanks (78%, 290 mg, 51 days), which had the same food per tadpole, and far from the 160-tadpole standard tanks (41%, 170 mg, 66 days); 1 pt for the evaluation: waste and physical contact were still four times higher in the 4 × food tanks, yet the results matched, so they contribute little and food is the main cause; or a reasoned limitation, such as extra food possibly changing water quality, only four tanks per treatment, or one species, with a suggested further test. Accept either kind of evaluation if it is tied to the data.

      (e) 1 pt: early drying is density-independent, because it kills tadpoles regardless of how crowded the pond is; the surviving tadpoles of a crowded pond would have more food each, so their survival and mass at metamorphosis would rise (at about 80 tadpoles in place of 160, to values between the 41% and 170 mg of the 160-tadpole tanks and the 78% and 290 mg of the 40-tadpole tanks), partly compensating for the loss. Classification, prediction and justification from the data are all required.

      Zero for a part: describing the data as "tadpoles did worse" without numbers; calling the density effect density-independent; concluding that food is the cause from the standard-ration tanks alone without using the fourth treatment; predicting that survivors in a thinned pond do no better or worse than before.
