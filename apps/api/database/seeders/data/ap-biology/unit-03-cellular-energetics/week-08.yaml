week: 8
unit: 3
title: Enzymes and Their Environment
topics: ["3.1", "3.2"]
guide: guides/week-08.md
guide_description: |
  How an enzyme lowers activation energy without touching ΔG; why the active site's chemistry makes it specific;
  induced fit; cofactors and coenzymes. Then what the environment does to an enzyme: substrate concentration,
  temperature, pH, competitive and noncompetitive inhibitors, allosteric regulation and feedback inhibition.
  Three worked examples (an energy diagram, a rate from a product-versus-time table, telling competitive from
  noncompetitive inhibition in data), misconceptions, self-check. AP Investigation 13 (Enzyme Activity) is this week.
flashcards_description: |
  30 cards: terms, mechanism-to-consequence, and "what does this curve show" cards for enzymes and the factors that change their activity.

flashcards:
  - front: Enzyme → what it is and what it changes about a reaction
    back: |
      A biological catalyst, almost always a protein, that speeds a reaction by lowering its activation energy. It does not change the reaction's ΔG, its direction, or its equilibrium, and it is unchanged at the end.
    hint: It changes how fast, never how far.
    topic_code: "3.1"
  - front: Activation energy (Eₐ)
    back: |
      The energy input needed to push reactants into the unstable transition state so a reaction can proceed. Every reaction has one, including exergonic ones. Catalysts lower it.
    topic_code: "3.1"
  - front: Does an enzyme change the ΔG of the reaction it catalyses?
    back: |
      No. The free-energy difference between reactants and products is fixed by the molecules themselves. An enzyme lowers the hill between them (Eₐ), so the reaction happens faster, but the starting and ending energy levels are the same with or without it.
    hint: Same start, same finish, lower hill.
    topic_code: "3.1"
  - front: Transition state
    back: |
      The brief, high-energy, strained arrangement of atoms that reactants must pass through on the way to products. Reaching it is what activation energy pays for. Enzymes stabilise it.
    topic_code: "3.1"
  - front: Active site → what gives it its specificity
    back: |
      The pocket where the substrate binds. Its particular combination of amino-acid R groups (their charges, polarity and positions) creates a chemical environment that fits one substrate or one small family of substrates and no others.
    topic_code: "3.1"
  - front: Substrate
    back: |
      The reactant an enzyme acts on. It binds the active site to form an enzyme-substrate complex, is converted to product, and the product is released.
    topic_code: "3.1"
  - front: Induced fit versus lock and key
    back: |
      Lock and key pictured a rigid active site that the substrate simply slots into. Induced fit, the current model, says binding causes both enzyme and substrate to shift shape slightly, tightening the fit and straining the substrate's bonds toward the transition state.
    hint: The glove tightens around the hand.
    topic_code: "3.1"
  - front: Four ways an active site lowers activation energy
    back: |
      Holding two substrates in the right orientation; providing a micro-environment (for example an acidic pocket) that favours the reaction; bending or stretching the substrate toward the transition state; briefly forming a covalent bond with the substrate.
    topic_code: "3.1"
  - front: Why is an enzyme reusable?
    back: |
      The enzyme binds the substrate, catalyses the change, and releases the product without being consumed or permanently altered, so one enzyme molecule can turn over thousands of substrate molecules per second.
    topic_code: "3.1"
  - front: Why are most enzymes proteins, and what is the exception?
    back: |
      Only proteins offer twenty chemically different building blocks that fold into a precise three-dimensional pocket. The exception is RNA: ribozymes such as the ribosome's peptidyl-transferase centre catalyse reactions too.
    topic_code: "3.1"
  - front: Cofactor versus coenzyme
    back: |
      Both are non-protein helpers an enzyme needs to work. Cofactors are inorganic ions such as Mg²⁺, Zn²⁺ or Fe²⁺; coenzymes are organic molecules, often made from vitamins, such as NAD⁺ (from niacin) or coenzyme A.
    hint: Co-factor, ion; co-enzyme, organic.
    topic_code: "3.1"
  - front: Why does a vitamin deficiency slow metabolism?
    back: |
      Many coenzymes are built from vitamins. Without the vitamin the coenzyme cannot be made, the enzymes that depend on it stall, and every pathway downstream of them slows.
    topic_code: "3.1"
  - front: How does an enzyme's amino-acid sequence set what it does?
    back: |
      Sequence sets the fold; the fold places particular R groups in the active site; those R groups decide which substrate binds and how it is transformed. Change a residue in the active site and specificity or rate changes.
    topic_code: "3.1"
  - front: Enzyme-substrate complex
    back: |
      The short-lived combination of enzyme and substrate bound at the active site. Its formation is what distinguishes catalysed reactions: the substrate is held, strained and converted while attached.
    topic_code: "3.1"
  - front: Effect of substrate concentration on reaction rate (fixed enzyme)
    back: |
      Rate rises steeply at first because more collisions reach active sites, then levels off at a maximum when every active site is occupied all the time. Beyond saturation, adding substrate changes nothing.
    hint: Rising then flat, because active sites are finite.
    topic_code: "3.2"
  - front: Saturation of an enzyme
    back: |
      The state in which all active sites are continuously occupied. Rate is then limited by how fast each enzyme molecule can process substrate; the only way to raise it is more enzyme.
    topic_code: "3.2"
  - front: Effect of enzyme concentration on rate (excess substrate)
    back: |
      Rate rises in direct proportion to enzyme amount, because each added enzyme molecule adds an active site and substrate is not limiting.
    topic_code: "3.2"
  - front: Temperature curve for an enzyme → why it rises, then falls
    back: |
      Warming increases molecular motion and collision energy, so rate rises up to an optimum. Above it, heat breaks the weak bonds that hold the tertiary structure, the active site deforms (denaturation) and rate collapses.
    topic_code: "3.2"
  - front: pH optimum → how pepsin and trypsin differ
    back: |
      Each enzyme works best at the pH of its normal environment. Pepsin, in the stomach, peaks near pH 2; trypsin, in the small intestine, near pH 8. Away from the optimum, changed charges on R groups alter the active site's shape and attraction for substrate.
    topic_code: "3.2"
  - front: Can a denatured enzyme recover?
    back: |
      Sometimes. The sequence is intact, so if the stress (heat, pH, salt) is mild and brief, the protein may refold. After severe or prolonged stress, misfolded chains aggregate and activity is lost for good, as with a boiled egg white.
    topic_code: "3.2"
  - front: Competitive inhibitor
    back: |
      A molecule shaped enough like the substrate to bind the active site and block it. Because it competes, raising substrate concentration overcomes it: the maximum rate is unchanged, but more substrate is needed to reach it.
    hint: Same finish line, longer race.
    topic_code: "3.2"
  - front: Noncompetitive inhibitor
    back: |
      A molecule that binds the enzyme somewhere other than the active site (an allosteric site) and changes its shape so it works poorly or not at all. Extra substrate does not overcome it: the maximum rate falls.
    topic_code: "3.2"
  - front: How do you tell competitive from noncompetitive inhibition in a rate-versus-substrate table?
    back: |
      Look at high substrate concentrations. If the inhibited rate catches up with the uninhibited rate, the inhibitor is competitive. If the inhibited rate plateaus well below the uninhibited maximum no matter how much substrate is added, it is noncompetitive.
    topic_code: "3.2"
  - front: Allosteric site
    back: |
      A binding site on an enzyme away from the active site. A regulator molecule binding there changes the enzyme's shape and therefore its activity, either up (activator) or down (inhibitor). Most allosteric enzymes have several subunits.
    topic_code: "3.2"
  - front: Allosteric activator versus allosteric inhibitor
    back: |
      An activator binds the allosteric site and shifts the enzyme into a shape whose active site binds substrate better. An inhibitor binds and shifts it into a shape that binds substrate poorly. ADP activates and ATP inhibits several respiration enzymes this way.
    topic_code: "3.2"
  - front: Feedback inhibition → mechanism and the usual example
    back: |
      The end product of a pathway binds an allosteric site on an enzyme early in the pathway and switches it off. When product is plentiful the pathway slows; when product is used up, the enzyme is released and the pathway resumes. ATP inhibiting phosphofructokinase is the classic case.
    hint: The product polices its own production.
    topic_code: "3.2"
  - front: Reaction rate from a product-versus-time table
    back: |
      Rate = change in product ÷ change in time (Δy/Δx), taken over the interval asked for. Use the initial, straight part of the curve for the true rate: later the curve bends as substrate runs out.
    topic_code: "3.2"
  - front: Why is an enzyme's initial rate the one worth measuring?
    back: |
      At the start, substrate is plentiful and product is near zero, so the rate reflects the enzyme and the conditions alone. Later the rate falls because substrate is depleted or product accumulates, not because the enzyme has changed.
    topic_code: "3.2"
  - front: Peroxidase and catalase → the reactions in AP Investigation 13
    back: |
      Both act on hydrogen peroxide. Catalase splits 2 H₂O₂ → 2 H₂O + O₂, measured as oxygen produced. Peroxidase uses H₂O₂ to oxidise a dye (guaiacol turns brown), measured as colour change over time with a spectrophotometer.
    topic_code: "3.2"
  - front: Why does a cell keep enzymes with their substrates in the same compartment?
    back: |
      Compartmentalisation raises the local concentration of enzyme and substrate, lets each organelle hold its own best pH (the lysosome is acidic), and keeps incompatible reactions apart, so pathways run faster and can be regulated separately.
    topic_code: "3.2"

quiz:
  description: |
    24 questions · about 30 minutes · enzyme mechanism and the environmental factors that change enzyme activity,
    with a peroxidase (AP Investigation 13) data set, plus spiral review of protein structure, pH and hydrolysis
    from Unit 1 and compartmentalisation from Unit 2. Multiple choice, select-all, true/false and numeric items are
    graded at once; fill-in-the-blank items are matched automatically; the two short answers and the long answer
    are graded by your teacher against the acceptable-answer summary.
  questions:
    - slug: u03-w08-q01
      type: multiple_choice
      topic_code: "3.1"
      source: "Biology 2e §6.5 Enzymes"
      points: 1
      prompt: |
        A reaction-energy diagram shows the same exergonic reaction with and without its enzyme. Which feature of the diagram changes when the enzyme is present?
      options:
        - "The height of the peak between reactants and products is lower, while the energy of reactants and products stays the same."
        - "The energy of the products is lower, so more free energy is released."
        - "The energy of the reactants is raised so that they fall further to the products."
        - "The reaction becomes exergonic where it was endergonic before."
      option_explanations:
        - |
          Correct. The peak is the activation energy; an enzyme stabilises the transition state and lowers it. The reactant and product levels, and therefore ΔG, are properties of the molecules and do not move.
        - |
          This is the misreading that enzymes add energy. The product level is fixed by the chemistry of the products; catalysts cannot make a reaction release more energy than it would uncatalysed.
        - |
          Raising reactant energy would require an energy input; enzymes supply none. They make the path easier, not the starting point higher.
        - |
          A catalyst never changes the sign of ΔG. An endergonic reaction stays endergonic and still needs an energy source such as ATP; the enzyme only speeds whatever direction is thermodynamically allowed.
      answer: 0
      explanation: |
        On any energy diagram the enzyme changes one thing: the hill. Start and finish, and the gap between them, are untouched. That single fact answers most enzyme questions on the exam.

    - slug: u03-w08-q02
      type: multiple_choice
      topic_code: "3.1"
      source: "Biology 2e §6.5 Enzymes"
      points: 1
      prompt: |
        Sucrase hydrolyses sucrose rapidly but does nothing to lactose, even though both are disaccharides joined by a glycosidic linkage. Which explanation is best?
      options:
        - "The R groups lining sucrase's active site create a shape and chemical environment that fits sucrose and not lactose."
        - "Lactose is too large to enter any enzyme's active site."
        - "Sucrase is a protein and lactose is a carbohydrate, and proteins cannot bind carbohydrates."
        - "Lactose lacks the activation energy needed for hydrolysis."
      option_explanations:
        - |
          Correct. Specificity comes from the active site's particular residues: their positions, charges and polarity match one substrate's geometry. Lactose, with galactose rather than fructose, does not fit the pocket's chemistry.
        - |
          Lactose and sucrose are about the same size, both C₁₂H₂₂O₁₁. Size is not the issue; shape and chemical complementarity are, and lactase binds lactose readily.
        - |
          Sucrase binds sucrose, which is a carbohydrate, so the premise fails. Proteins bind carbohydrates, lipids, nucleic acids and other proteins all the time.
        - |
          Activation energy is a property of a reaction, not something a molecule has or lacks. Lactose hydrolysis has its own activation energy, which lactase lowers.
      answer: 0
      explanation: |
        Enzyme specificity is a Unit 1 idea wearing a Unit 3 coat: the amino-acid sequence sets the fold, the fold sets the active site, the active site sets the substrate.

    - slug: u03-w08-q03
      type: multiple_choice
      topic_code: "3.1"
      source: "Biology 2e §6.5 Enzymes"
      points: 1
      prompt: |
        Structural studies show that when hexokinase binds glucose, two lobes of the enzyme close around the sugar, excluding water and bringing catalytic residues against the glucose. Which model of enzyme action does this observation support, and why?
      options:
        - "Induced fit, because binding changes the enzyme's shape to improve the fit and position the catalytic groups."
        - "Lock and key, because the glucose fits a pre-formed rigid site exactly."
        - "Feedback inhibition, because the enzyme is switched off by its own product."
        - "Denaturation, because the enzyme's shape changes on binding."
      option_explanations:
        - |
          Correct. A conformational change triggered by substrate binding that tightens the fit and arranges the active site is the definition of induced fit, the model that replaced the rigid picture.
        - |
          A lock does not close around a key. Lock and key assumes a rigid, pre-shaped site; the observed closing of the lobes is exactly what that model cannot explain.
        - |
          Nothing in the observation involves the product binding anywhere or activity falling. It describes substrate binding and catalysis, not regulation.
        - |
          Denaturation is the loss of functional shape under heat or pH stress. The change here is reversible, specific and productive; it improves function rather than destroying it.
      answer: 0
      explanation: |
        Induced fit is more than a better metaphor: the closing of the enzyme is part of catalysis. It strains the substrate toward the transition state and, in hexokinase, keeps water from stealing the phosphate that should go to glucose.

    - slug: u03-w08-q04
      type: multiple_choice
      topic_code: "3.2"
      source: "Biology 2e §6.5 Enzymes"
      points: 1
      prompt: |
        A fixed amount of enzyme is mixed with increasing concentrations of substrate and the initial rate is measured each time. Rate rises quickly at low concentrations, then levels off. What limits the rate on the flat part of the curve?
      options:
        - "Every active site is already occupied, so rate depends only on how fast each enzyme molecule turns over substrate."
        - "The substrate has become a competitive inhibitor at high concentration."
        - "The enzyme has denatured because the solution became too concentrated."
        - "Product accumulation has reversed the reaction."
      option_explanations:
        - |
          Correct. This is saturation. Once active sites are continuously full, collisions with extra substrate find nowhere to bind, and the only way to raise the rate is to add enzyme.
        - |
          A competitive inhibitor is a different molecule that blocks the site. Substrate binding the site is the reaction, not inhibition; the plateau is a ceiling, not a decline.
        - |
          Denaturation would make the rate fall, not level off, and the measurement is of initial rates in the same buffer at the same temperature. Substrate concentration does not unfold a protein.
        - |
          These are initial rates, measured before product accumulates. The plateau appears in the first seconds of each run, so reversal cannot be the cause.
      answer: 0
      explanation: |
        The rate-versus-substrate curve has two regimes: substrate-limited (rising) and enzyme-limited (flat). Which regime a cell sits in decides whether adding substrate or adding enzyme will speed a pathway.

    - slug: u03-w08-q05
      type: multiple_choice
      topic_code: "3.2"
      source: "Biology 2e §6.5 Enzymes"
      points: 1
      prompt: |
        An enzyme from a human (optimum 37 °C) and the homologous enzyme from a bacterium living in a 75 °C hot spring are each tested across a range of temperatures. Which prediction is most reasonable?
      options:
        - "The bacterial enzyme will keep working at 75 °C because its tertiary structure is held by more or stronger stabilising interactions, while the human enzyme denatures well below that."
        - "Both enzymes will show the same optimum, because all enzymes work fastest at 37 °C."
        - "The human enzyme will work faster at every temperature, because humans are more complex organisms."
        - "The bacterial enzyme will have no temperature optimum, because bacteria lack tertiary structure."
      option_explanations:
        - |
          Correct. Thermophile proteins have evolved extra ionic bonds, disulfide bridges and tighter hydrophobic cores that resist unfolding at temperatures that strip a human enzyme of its shape.
        - |
          The optimum is set by the environment the enzyme evolved in, not by a universal constant. 37 °C is a mammalian body temperature, not a rule of chemistry.
        - |
          Organism complexity has no bearing on a single enzyme's kinetics, and the human enzyme would be unfolded and inactive at hot-spring temperatures.
        - |
          Bacterial enzymes are proteins with full tertiary structure. Every enzyme has a temperature optimum; the thermophile's is simply higher.
      answer: 0
      explanation: |
        Temperature does two things: it speeds collisions (rate rises) and it shakes weak bonds apart (rate crashes). Where the crash begins depends on how strongly the fold is held, which natural selection tunes to the organism's habitat.

    - slug: u03-w08-q06
      type: multiple_choice
      topic_code: "3.2"
      source: "Biology 2e §6.5 Enzymes"
      points: 1
      prompt: |
        Pepsin digests protein in the stomach at pH 2 but is almost inactive at pH 8, while trypsin in the small intestine shows the reverse pattern. What is the most direct molecular reason that pH changes an enzyme's activity?
      options:
        - "Changing H⁺ concentration changes the charges on acidic and basic R groups, altering the shape and attractions of the active site."
        - "Hydrogen ions act as competitive inhibitors by binding the active site in place of the substrate."
        - "Low pH breaks the peptide bonds of the enzyme's backbone, destroying its primary structure."
        - "Enzymes only work in water, and acidic solutions contain less water."
      option_explanations:
        - |
          Correct. Carboxyl and amino groups gain or lose protons as pH changes; the ionic bonds and hydrogen bonds they make with each other and with the substrate are what hold the active site's shape and pull the substrate in.
        - |
          H⁺ is far too small and too abundant to act as a shaped competitor for an active site. The effect of pH is on the enzyme's own charges, not on occupancy of the site.
        - |
          Peptide bonds are covalent and survive the pH range of the body; primary structure is not lost. What changes are the weak interactions of tertiary structure.
        - |
          A pH 2 solution is still almost entirely water. The amount of water is not what differs; the concentration of H⁺ is.
      answer: 0
      explanation: |
        pH works through charge. Because ionic bonds are part of tertiary structure, shifting the charges on R groups reshapes the protein. Each enzyme's optimum is the pH at which its native charges are in place.

    - slug: u03-w08-q07
      type: multiple_choice
      topic_code: "3.2"
      source: "Biology 2e §6.5 Enzymes"
      points: 1
      stimulus: |
        Students repeated AP Investigation 13 using turnip peroxidase. Peroxidase catalyses the oxidation of the colourless dye guaiacol by hydrogen peroxide; the oxidised dye is brown, so the absorbance at 500 nm rises as product forms. Equal volumes of enzyme extract, substrate (H₂O₂ plus guaiacol) and pH 7 buffer were mixed and absorbance was read every 30 seconds. Four water baths were used. A tube with boiled extract was run as a control and showed no change at any temperature.

        | Time (s) | 4 °C | 23 °C | 37 °C | 60 °C |
        |---|---|---|---|---|
        | 0 | 0.00 | 0.00 | 0.00 | 0.00 |
        | 30 | 0.04 | 0.12 | 0.20 | 0.03 |
        | 60 | 0.08 | 0.24 | 0.40 | 0.05 |
        | 90 | 0.12 | 0.36 | 0.58 | 0.06 |
        | 120 | 0.16 | 0.47 | 0.70 | 0.06 |
        | 150 | 0.20 | 0.56 | 0.78 | 0.06 |
        | 180 | 0.24 | 0.63 | 0.82 | 0.06 |
      prompt: |
        Which temperature gave the highest initial rate of reaction, and what does the pattern across 4, 23 and 37 °C indicate?
      options:
        - "37 °C; over this range, higher temperature increases molecular motion and the frequency of productive collisions between enzyme and substrate."
        - "4 °C; cold slows the reaction least because the enzyme is most stable there."
        - "60 °C; the hottest bath always gives the fastest enzyme reaction."
        - "23 °C; room temperature is the optimum for every plant enzyme."
      option_explanations:
        - |
          Correct. In the first 30 s the absorbance rose 0.04, 0.12 and 0.20 at 4, 23 and 37 °C. More kinetic energy means more collisions that reach the active site with enough energy to react.
        - |
          Stability is not rate. The 4 °C tube made product most slowly (0.24 by 180 s), because cold molecules collide less often and less energetically.
        - |
          The 60 °C column rose only to 0.06 and then stopped: the enzyme denatured almost immediately. Hot is faster only up to the temperature the fold survives.
        - |
          23 °C was slower than 37 °C in every interval. Optimum temperature is a property of each enzyme, not a universal room-temperature rule.
      answer: 0
      explanation: |
        Read initial rates from the first interval, when substrate is plentiful. The three cooler tubes rank in the order kinetic theory predicts; the 60 °C tube is the denaturation story.

    - slug: u03-w08-q08
      type: multiple_choice
      topic_code: "3.2"
      source: "Biology 2e §6.5 Enzymes"
      points: 1
      stimulus: |
        Students repeated AP Investigation 13 using turnip peroxidase. Peroxidase catalyses the oxidation of the colourless dye guaiacol by hydrogen peroxide; the oxidised dye is brown, so the absorbance at 500 nm rises as product forms. Equal volumes of enzyme extract, substrate (H₂O₂ plus guaiacol) and pH 7 buffer were mixed and absorbance was read every 30 seconds. Four water baths were used. A tube with boiled extract was run as a control and showed no change at any temperature.

        | Time (s) | 4 °C | 23 °C | 37 °C | 60 °C |
        |---|---|---|---|---|
        | 0 | 0.00 | 0.00 | 0.00 | 0.00 |
        | 30 | 0.04 | 0.12 | 0.20 | 0.03 |
        | 60 | 0.08 | 0.24 | 0.40 | 0.05 |
        | 90 | 0.12 | 0.36 | 0.58 | 0.06 |
        | 120 | 0.16 | 0.47 | 0.70 | 0.06 |
        | 150 | 0.20 | 0.56 | 0.78 | 0.06 |
        | 180 | 0.24 | 0.63 | 0.82 | 0.06 |
      prompt: |
        At 60 °C the absorbance rose slightly in the first minute and then stayed at 0.06 for the rest of the run. Which explanation is best supported?
      options:
        - "The enzyme catalysed a little product before heat broke the weak bonds holding its tertiary structure, after which the deformed active site could no longer bind substrate."
        - "The substrate was used up within the first minute at 60 °C because the reaction was so fast."
        - "The dye cannot turn brown at 60 °C, so product formed but was not detected."
        - "Peroxidase needs cold temperatures to bind hydrogen peroxide."
      option_explanations:
        - |
          Correct. A small early rise followed by a permanent plateau is the signature of denaturation in progress: activity while some enzyme is still folded, then none once it is not.
        - |
          If substrate had been exhausted, the absorbance would have climbed to at least the 0.82 seen at 37 °C, where the same amount of substrate was present. A plateau at 0.06 means almost no product was made.
        - |
          Oxidised guaiacol is brown at any temperature in this range; the boiled-extract control, not the dye's chemistry, is the comparison that shows the plateau is an enzyme effect.
        - |
          Rate increased from 4 to 37 °C, so the enzyme does not need cold. It needs its shape, which 60 °C destroys.
      answer: 0
      explanation: |
        Two curves can plateau for opposite reasons: substrate exhaustion (a high plateau after fast production) or enzyme loss (a low plateau after little production). The height of the plateau tells you which.

    - slug: u03-w08-q09
      type: numeric
      topic_code: "3.2"
      source: "Biology 2e §6.5 Enzymes"
      points: 1
      stimulus: |
        Students repeated AP Investigation 13 using turnip peroxidase. Peroxidase catalyses the oxidation of the colourless dye guaiacol by hydrogen peroxide; the oxidised dye is brown, so the absorbance at 500 nm rises as product forms. Equal volumes of enzyme extract, substrate (H₂O₂ plus guaiacol) and pH 7 buffer were mixed and absorbance was read every 30 seconds. Four water baths were used. A tube with boiled extract was run as a control and showed no change at any temperature.

        | Time (s) | 4 °C | 23 °C | 37 °C | 60 °C |
        |---|---|---|---|---|
        | 0 | 0.00 | 0.00 | 0.00 | 0.00 |
        | 30 | 0.04 | 0.12 | 0.20 | 0.03 |
        | 60 | 0.08 | 0.24 | 0.40 | 0.05 |
        | 90 | 0.12 | 0.36 | 0.58 | 0.06 |
        | 120 | 0.16 | 0.47 | 0.70 | 0.06 |
        | 150 | 0.20 | 0.56 | 0.78 | 0.06 |
        | 180 | 0.24 | 0.63 | 0.82 | 0.06 |
      prompt: |
        Using rate = Δy/Δx, calculate the rate of reaction at 37 °C over the first 90 seconds, in absorbance units per minute. Give your answer to two decimal places.
      answer: { value: 0.39, tolerance: 0.02 }
      explanation: |
        Δy = 0.58 − 0.00 = 0.58 absorbance units; Δx = 90 s = 1.5 min. Rate = 0.58 ÷ 1.5 = 0.387, which rounds to 0.39 absorbance units per minute. The unit conversion is where marks are lost: dividing by 90 gives 0.0064 per second, a correct rate in the wrong units. For comparison, the same calculation at 23 °C gives 0.36 ÷ 1.5 = 0.24 per minute.

    - slug: u03-w08-q10
      type: multiple_choice
      topic_code: "3.2"
      source: "Biology 2e §6.5 Enzymes"
      points: 1
      stimulus: |
        Students repeated AP Investigation 13 using turnip peroxidase. Peroxidase catalyses the oxidation of the colourless dye guaiacol by hydrogen peroxide; the oxidised dye is brown, so the absorbance at 500 nm rises as product forms. Equal volumes of enzyme extract, substrate (H₂O₂ plus guaiacol) and pH 7 buffer were mixed and absorbance was read every 30 seconds. Four water baths were used. A tube with boiled extract was run as a control and showed no change at any temperature.

        | Time (s) | 4 °C | 23 °C | 37 °C | 60 °C |
        |---|---|---|---|---|
        | 0 | 0.00 | 0.00 | 0.00 | 0.00 |
        | 30 | 0.04 | 0.12 | 0.20 | 0.03 |
        | 60 | 0.08 | 0.24 | 0.40 | 0.05 |
        | 90 | 0.12 | 0.36 | 0.58 | 0.06 |
        | 120 | 0.16 | 0.47 | 0.70 | 0.06 |
        | 150 | 0.20 | 0.56 | 0.78 | 0.06 |
        | 180 | 0.24 | 0.63 | 0.82 | 0.06 |
      prompt: |
        At 37 °C the absorbance rose by 0.20 in the first 30 seconds but by only 0.04 between 150 and 180 seconds. A student claims this shows the enzyme was denaturing at 37 °C. Which response is the best evaluation of that claim?
      options:
        - "The claim is weak: a falling rate late in a run is expected when substrate is being used up, and the 23 °C tube, which cannot be denaturing, shows the same slowing."
        - "The claim is strong: any decrease in rate during a run proves the enzyme is losing its shape."
        - "The claim is strong: 37 °C is close to 60 °C, where denaturation was obvious."
        - "The claim is weak: enzymes never lose activity at body temperature under any conditions."
      option_explanations:
        - |
          Correct. Product-versus-time curves bend as substrate is depleted; the 23 °C curve slows in the same way (0.12 then 0.07 per interval). To test denaturation you would add fresh substrate and see whether the rate recovers.
        - |
          Rate falling within a run is the normal consequence of substrate depletion. Denaturation is one possible cause of a falling rate, not the only one, so the pattern alone proves nothing.
        - |
          Proximity to 60 °C is not evidence; 37 °C is a normal temperature for many enzymes and the tube produced four times the product of the 23 °C tube. Comparison with the 60 °C column argues against the claim.
        - |
          Some enzymes do denature at 37 °C, so this rebuttal is wrong in general. The claim fails because of the data pattern, not because denaturation is impossible.
      answer: 0
      explanation: |
        Argument from data means naming an alternative explanation and checking it against a comparison in the table. Here the comparison (the 23 °C tube slows too) favours substrate depletion.

    - slug: u03-w08-q11
      type: multiple_choice
      topic_code: "3.2"
      source: "Biology 2e §6.5 Enzymes"
      points: 1
      prompt: |
        Malonate resembles succinate closely enough to bind the active site of succinate dehydrogenase, and it slows the enzyme. A researcher finds that adding a large excess of succinate restores the original rate. Which conclusion follows?
      options:
        - "Malonate is a competitive inhibitor: it and succinate compete for the same site, so flooding the site with substrate outcompetes it."
        - "Malonate is a noncompetitive inhibitor that was displaced from its allosteric site by succinate."
        - "Malonate denatured the enzyme and succinate refolded it."
        - "Malonate is a coenzyme that succinate dehydrogenase requires in limited amounts."
      option_explanations:
        - |
          Correct. Structural similarity to the substrate plus reversal by excess substrate are the two hallmarks of competitive inhibition. The maximum rate is unchanged; only the substrate needed to reach it rises.
        - |
          Excess substrate does not displace a noncompetitive inhibitor, because it binds a different site. If malonate were noncompetitive, the rate would stay depressed no matter how much succinate was added.
        - |
          Denaturation is caused by heat, pH or salt disrupting weak bonds; substrate cannot refold a protein. The reversibility by competition shows the enzyme was never unfolded.
        - |
          A coenzyme would speed the reaction, not slow it, and would not be overcome by substrate. Malonate's effect is inhibitory.
      answer: 0
      explanation: |
        The experimental test for competitive inhibition is the rescue by substrate. Noncompetitive inhibitors are immune to it because they do not occupy the active site.

    - slug: u03-w08-q12
      type: multiple_choice
      topic_code: "3.2"
      source: "Biology 2e §6.5 Enzymes"
      points: 1
      prompt: |
        A bacterium synthesises the amino acid isoleucine in five enzyme-catalysed steps from threonine. When isoleucine accumulates, it binds the first enzyme of the pathway at a site other than the active site and the whole pathway slows. When the cell uses isoleucine up, the pathway resumes. What is this mechanism called, and what is its advantage?
      options:
        - "Feedback inhibition by an allosteric inhibitor; it prevents the cell from wasting materials and energy making a product it already has."
        - "Competitive inhibition; isoleucine blocks threonine from the active site."
        - "Denaturation; isoleucine unfolds the first enzyme until it is degraded."
        - "Cofactor depletion; isoleucine consumes the Mg²⁺ the enzyme needs."
      option_explanations:
        - |
          Correct. The end product regulating an early enzyme through an allosteric site is feedback inhibition. It is reversible, fast, and tunes production to need with no gene expression required.
        - |
          The prompt states the binding is away from the active site, which rules out competition. Isoleucine does not resemble threonine closely enough to occupy the site anyway.
        - |
          The effect reverses as soon as isoleucine falls; a denatured enzyme would not recover its activity on cue. Allosteric regulation is a controlled shape change, not an unfolding.
        - |
          Nothing in the scenario involves ions. The inhibitor is the pathway's own product, binding the enzyme itself.
      answer: 0
      explanation: |
        Feedback inhibition is the cell's thermostat: the product switches off the first committed step so intermediates do not pile up. The same logic runs phosphofructokinase in glycolysis, which you meet in week 10.

    - slug: u03-w08-q13
      type: multiple_choice
      topic_code: "1.7"
      source: "Biology 2e §3.4 Proteins"
      points: 1
      prompt: |
        Review. A single amino-acid substitution replaces a nonpolar leucine deep in the core of an enzyme with a charged lysine. The enzyme's activity falls to nearly zero even though the substitution is far from the active site. Which explanation is best?
      options:
        - "Burying a charged R group in the hydrophobic core destabilises the tertiary fold, and the altered fold deforms the active site at a distance."
        - "Lysine is larger than leucine and physically blocks the active site."
        - "The substitution changes the primary structure, and primary structure is the only level that matters for function."
        - "Charged amino acids cannot be part of any enzyme."
      option_explanations:
        - |
          Correct. Tertiary structure is held together by a hydrophobic core and weak interactions; forcing a charge into the core disrupts the fold, and because the fold positions the active-site residues, the site is reshaped even though the mutation is elsewhere.
        - |
          The prompt says the residue is far from the active site and in the core, so it cannot physically occupy the site. The effect is transmitted through the fold.
        - |
          Primary structure matters because it determines the higher levels, but function is carried out by the three-dimensional shape. The question asks how a sequence change becomes a function change.
        - |
          Charged residues are essential on protein surfaces and in many active sites. The problem is a charge in the wrong place, the nonpolar core, not charge as such.
      answer: 0
      explanation: |
        Enzyme function is tertiary structure in action. Anything that disturbs the fold, a mutation, heat or pH, reaches the active site whether or not it touches it directly.

    - slug: u03-w08-q14
      type: multiple_choice
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        Review. An enzyme assay is run in a buffer at pH 6 and again at pH 4. Which statement about hydrogen ion concentration in the two runs is correct?
      options:
        - "The pH 4 buffer has 100 times the H⁺ concentration of the pH 6 buffer."
        - "The pH 4 buffer has twice the H⁺ concentration of the pH 6 buffer."
        - "The pH 6 buffer has 100 times the H⁺ concentration of the pH 4 buffer."
        - "The two buffers have the same H⁺ concentration because both are buffered."
      option_explanations:
        - |
          Correct. pH = −log₁₀[H⁺], so pH 4 is 10⁻⁴ M and pH 6 is 10⁻⁶ M; two units is a hundredfold difference, with the lower pH more acidic.
        - |
          Reading a two-unit difference as a doubling ignores the logarithmic scale. Each unit is tenfold, so two units is a factor of 100.
        - |
          The direction is backwards: lower pH means more H⁺. The pH 4 solution is the more acidic one.
        - |
          A buffer resists change in pH; it does not make every solution the same pH. Buffers are prepared at a chosen pH, and these two differ by two units.
      answer: 0
      explanation: |
        Enzyme pH curves are plotted on a log scale without saying so. A shift from the optimum of two pH units is a hundredfold change in H⁺, which is why R-group charges, and therefore shape, change so sharply.

    - slug: u03-w08-q15
      type: multi_select
      topic_code: "3.1"
      source: "Biology 2e §6.5 Enzymes"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about enzymes are correct? Select all that apply.
      options:
        - "An enzyme lowers the activation energy of the reaction it catalyses."
        - "An enzyme is consumed by the reaction and must be re-synthesised after each use."
        - "An enzyme's specificity comes from the chemistry and shape of its active site."
        - "An enzyme makes an endergonic reaction exergonic."
        - "Some enzymes require an inorganic ion or an organic coenzyme to function."
      option_explanations:
        - |
          Correct. Lowering the activation-energy barrier is the defining action of any catalyst, and the only thing on an energy diagram that an enzyme changes.
        - |
          Enzymes are released unchanged after each catalytic cycle and are reused thousands of times. Being unconsumed is part of what makes a catalyst a catalyst.
        - |
          Correct. The arrangement of R groups in the active site provides the fit and the chemical environment that admit one substrate and exclude others.
        - |
          ΔG is fixed by reactants and products. An enzyme cannot change the sign of ΔG; an endergonic reaction still needs energy, typically from coupling to ATP hydrolysis.
        - |
          Correct. Cofactors such as Mg²⁺ or Zn²⁺ and coenzymes such as NAD⁺ or coenzyme A are non-protein helpers without which many enzymes are inactive.
      answer: [0, 2, 4]
      explanation: |
        The two wrong statements are the two classic misconceptions: enzymes being used up, and enzymes supplying energy. Hold on to "faster, not farther, and not consumed".

    - slug: u03-w08-q16
      type: multi_select
      topic_code: "1.7"
      source: "Biology 2e §3.4 Proteins"
      points: 2
      partial_credit: true
      prompt: |
        Review. Which of the following interactions help hold an enzyme's tertiary structure, and are therefore the ones disrupted when heat or extreme pH denatures it? Select all that apply.
      options:
        - "Hydrogen bonds between polar R groups"
        - "Ionic bonds between oppositely charged R groups"
        - "Hydrophobic interactions among nonpolar R groups in the core"
        - "Peptide bonds between adjacent amino acids"
        - "Disulfide bridges between cysteine residues"
      option_explanations:
        - |
          Correct. Hydrogen bonds between side chains are weak individually and are among the first to break as temperature rises.
        - |
          Correct. Ionic bonds depend on the charges of acidic and basic R groups, which is exactly why a change in pH, which alters those charges, unfolds a protein.
        - |
          Correct. The clustering of nonpolar R groups away from water is the main driver of the fold; heat increases motion enough to loosen the core.
        - |
          Peptide bonds are covalent links of the primary structure. They survive denaturation; that is why a mildly denatured protein can sometimes refold.
        - |
          Correct. Disulfide bridges are covalent and the strongest of the tertiary interactions, but reducing conditions or harsh treatment can break them, and they are part of what sets the fold.
      answer: [0, 1, 2, 4]
      explanation: |
        Denaturation attacks the weak interactions of tertiary structure and leaves the primary structure alone. The distinction matters for the enzyme topic: a denatured enzyme is a still-intact chain in the wrong shape.

    - slug: u03-w08-q17
      type: true_false
      topic_code: "3.1"
      source: "Biology 2e §6.5 Enzymes"
      points: 1
      prompt: |
        True or false: Because an enzyme lowers activation energy, a reaction that would be endergonic without the enzyme becomes exergonic in its presence.
      answer: false
      explanation: |
        False. Activation energy and ΔG are independent. The enzyme lowers the barrier that both reactants and products must cross, which speeds the reaction in whichever direction is thermodynamically favourable, but it does nothing to the free energies of reactants and products themselves. An endergonic reaction stays endergonic and must be coupled to an energy source such as ATP hydrolysis to proceed.

    - slug: u03-w08-q18
      type: true_false
      topic_code: "1.3"
      source: "Biology 2e §3.1 Synthesis of Biological Macromolecules"
      points: 1
      prompt: |
        Review. True or false: Hydrolysis of a polymer releases free energy, yet in the body it still requires an enzyme to proceed at a useful rate.
      answer: true
      explanation: |
        True. Hydrolysis is exergonic (ΔG is negative), which is why digestion yields usable energy, but exergonic does not mean fast. Sucrose in a sugar bowl does not hydrolyse measurably for years because the activation energy is high. Sucrase lowers that barrier so the reaction runs in seconds in the gut. The sign of ΔG says whether a reaction can happen; the activation energy says how quickly it will.

    - slug: u03-w08-q19
      type: true_false
      topic_code: "1.6"
      source: "Biology 2e §3.5 Nucleic Acids"
      points: 1
      prompt: |
        Review. True or false: ATP is a nucleotide, built from the nitrogenous base adenine, the five-carbon sugar ribose and a chain of three phosphate groups.
      answer: true
      explanation: |
        True. ATP is the RNA nucleotide adenosine monophosphate with two extra phosphates attached. That shared chemistry is why ATP can serve both as the cell's energy currency and as a building block of RNA, and why the negative charges crowded along its phosphate chain make the terminal phosphate easy to transfer, a point next week's topic (3.3) turns into the engine of coupled reactions.

    - slug: u03-w08-q20
      type: fill_blank
      topic_code: "3.2"
      source: "Biology 2e §6.5 Enzymes"
      points: 1
      prompt: |
        A regulatory molecule that binds an enzyme at a site other than the active site and changes the enzyme's shape, either increasing or decreasing its activity, is binding at an ____ site.
      answer: ["allosteric"]
      explanation: |
        Allosteric means "other shape": binding at the second site shifts the enzyme between active and inactive conformations. Feedback inhibition and most noncompetitive inhibition work through allosteric sites. "Active" is not accepted because the prompt explicitly excludes the active site, and "regulatory" describes what the site does rather than naming it.

    - slug: u03-w08-q21
      type: fill_blank
      topic_code: "1.7"
      source: "Biology 2e §3.4 Proteins"
      points: 1
      prompt: |
        Review. The specific three-dimensional fold of a single polypeptide chain, produced by interactions among R groups and responsible for the shape of an enzyme's active site, is its ____ structure.
      answer: ["tertiary"]
      explanation: |
        Tertiary structure is the full three-dimensional shape of one chain, held by hydrogen bonds, ionic bonds, hydrophobic interactions and disulfide bridges among R groups. It is the level that an active site lives at, so it is the level that temperature and pH disrupt. "Secondary" refers to the backbone's helices and sheets, and "quaternary" to the assembly of several chains, so neither fits the prompt.

    - slug: u03-w08-q22
      type: short_answer
      topic_code: "3.2"
      source: "Biology 2e §6.5 Enzymes"
      points: 4
      prompt: |
        Analyze data. An enzyme's initial rate was measured at increasing substrate concentrations with no inhibitor, with inhibitor A, and with inhibitor B. Enzyme concentration was the same in every run.

        | Substrate (mM) | No inhibitor (μmol/min) | With A (μmol/min) | With B (μmol/min) |
        |---|---|---|---|
        | 1 | 25 | 10 | 12 |
        | 4 | 60 | 38 | 30 |
        | 16 | 88 | 80 | 44 |
        | 64 | 96 | 95 | 48 |

        (a) Identify the type of inhibition shown by A and by B. (b) Justify each identification with specific values from the table. (c) Explain, at the level of where each inhibitor binds, why the two patterns differ.
      answer: |
        A is competitive (its rate catches up to the uninhibited rate at 64 mM, 95 vs 96); B is noncompetitive (it plateaus at about half the maximum, 48 vs 96, however much substrate is added). A competes for the active site and is outcompeted by excess substrate; B binds an allosteric site and disables a fraction of enzyme regardless of substrate.
      explanation: |
        Four points.

        (a) Identify, 1 pt: A competitive, B noncompetitive. Both must be correct for the point.

        (b) Justify, 2 pts: 1 pt for A: at low substrate A depresses the rate (10 vs 25 at 1 mM) but at high substrate the gap closes (95 vs 96 at 64 mM), so the inhibition is overcome by substrate; 1 pt for B: the rate levels off near 48, about half of the uninhibited maximum of 96, and the gap does not close as substrate rises. Numbers must be quoted; a verbal "catches up" with no values earns at most 1 of the 2.

        (c) Explain, 1 pt: A binds the active site in competition with the substrate, so when substrate is abundant almost every binding event is substrate; B binds an allosteric site and changes the enzyme's shape, so the inhibited enzyme molecules are out of action whatever the substrate concentration, which lowers the maximum rate. Accept "B reduces the amount of functional enzyme".

        Zero: identifying both as the same type, or justifying by the low-substrate values alone (both inhibitors lower the rate there, which does not distinguish them).

    - slug: u03-w08-q23
      type: short_answer
      topic_code: "2.9"
      source: "Biology 2e §6.5 Enzymes"
      points: 4
      prompt: |
        Review. Conceptual analysis. Lysosomal hydrolases work best at about pH 5, while the cytosol is held near pH 7.2. (a) Describe how the lysosome maintains an interior pH different from the cytosol. (b) Explain how this difference protects the cell if a lysosome leaks. (c) Explain one further advantage of keeping these enzymes in their own compartment rather than dispersed in the cytosol.
      answer: |
        Proton pumps in the lysosomal membrane use ATP to move H⁺ into the lumen; leaked hydrolases meet pH 7.2, far from their optimum, so their activity is low and the cytosol is not digested; compartmentalisation also concentrates enzyme and substrate together, speeding digestion and allowing separate regulation.
      explanation: |
        Four points.

        (a) Describe, 1 pt: ATP-driven proton pumps (active transport) in the lysosomal membrane move H⁺ into the lysosome against its gradient. Accept "H⁺ pumps" without naming ATP if active transport is implied.

        (b) Explain, 2 pts: 1 pt for noting that the leaked enzymes are at pH 7.2, roughly a hundredfold lower H⁺ than their optimum; 1 pt for connecting this to activity: the changed charges on R groups alter the active site so the enzymes work poorly, limiting damage to the cytosol. A bare "the enzymes denature" earns 1 pt; the link from pH to charge to shape earns both.

        (c) Explain, 1 pt: any one of: higher local concentration of enzyme and substrate increases reaction rate; incompatible reactions are kept apart; the compartment can be regulated (fusion with vesicles, pH) independently of the cytosol; the membrane increases surface area for the pumps and transporters involved.

        Zero: saying the lysosome is acidic "because it contains acids" with no transport mechanism, or that pH does not affect enzymes.

    - slug: u03-w08-q24
      type: long_answer
      topic_code: "3.2"
      source: "general knowledge"
      points: 8
      prompt: |
        Designing an experiment. A student proposes to test the claim that catalase from potato has a pH optimum near 7. Catalase breaks hydrogen peroxide into water and oxygen; the oxygen can be collected and measured. The student has potato extract, 3% hydrogen peroxide, buffers at pH 3, 5, 7, 9 and 11, a water bath, graduated gas-collection tubes and a stopwatch.

        (a) State a hypothesis and identify the independent variable, the dependent variable and two variables that must be held constant.
        (b) Describe a procedure, including a control and the number of trials, that would produce an initial rate of reaction for each pH.
        (c) Predict the results in the form of a described graph if the claim is correct, and explain the shape of the graph at both the low-pH and high-pH ends in terms of enzyme structure.
        (d) A classmate suggests measuring the total oxygen produced after 30 minutes instead of the initial rate. Explain one reason this change would make the test of the hypothesis less valid.
      answer: |
        Hypothesis: catalase activity peaks at pH 7 and falls on either side. IV: pH of buffer; DV: initial rate of O₂ production (mL/min); constants: temperature, enzyme volume and concentration, substrate concentration, timing. Procedure: mix equal volumes of extract and buffer, add H₂O₂, record O₂ volume every 30 s for 3 min, compute rate from the initial linear portion; control with boiled extract or buffer alone; three trials per pH, averaged. Prediction: a peaked curve with maximum at 7 and low rates at 3 and 11 because extreme H⁺ or OH⁻ changes R-group charges, breaks ionic and hydrogen bonds, and deforms the active site. Total O₂ after 30 minutes could be the same at several pH values because all substrate is eventually consumed, hiding differences in rate.
      explanation: |
        Eight points.

        (a) 2 pts: 1 pt for a testable hypothesis naming pH 7 as the optimum (or a null version), plus IV = pH and DV = rate of oxygen production (volume per unit time); 1 pt for two controlled variables from: temperature, volume and concentration of extract, concentration and volume of H₂O₂, timing of readings, mixing method.

        (b) 3 pts: 1 pt for a procedure in which extract, buffer and peroxide are combined in fixed volumes and oxygen volume is read at regular short intervals so that a rate (Δvolume/Δtime) over the early, linear part can be computed; 1 pt for a sensible control (boiled extract, or buffer plus peroxide with no extract) that shows oxygen release depends on active enzyme; 1 pt for replication (at least three trials per pH) with averaging. A procedure that measures a single end-point rather than readings over time earns at most 1 of the 3.

        (c) 2 pts: 1 pt for the prediction: rate low at pH 3, rising to a maximum at 7, falling at 9 and lower again at 11, described as a peaked or bell-shaped curve; 1 pt for the mechanism at the extremes: high H⁺ (low pH) or low H⁺ (high pH) changes the ionisation of acidic and basic R groups, breaking ionic and hydrogen bonds of tertiary structure and distorting the active site so substrate binds poorly, with denaturation at the extremes. Either end explained correctly earns the point if the student makes clear the same logic applies to both.

        (d) 1 pt: after 30 minutes the substrate may be exhausted in several tubes, so total oxygen would be the same even where rates differed, or the enzyme in some tubes may have denatured over the long run; either way the end-point no longer measures the enzyme's activity at that pH. Accept "it measures amount of substrate, not rate".

        Zero for a part: a hypothesis that is a question rather than a claim; a procedure with no measurement of time; a prediction that rate keeps rising with pH; explaining the extremes by "the enzyme dies" with no reference to structure.
