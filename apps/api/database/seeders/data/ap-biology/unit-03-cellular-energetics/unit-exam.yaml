  # ---- Numeric (second item; the first is in stimulus set B)
  - slug: u03-exam-q42
    type: numeric
    topic_code: "3.5"
    source: "Biology 2e §7.4 Oxidative Phosphorylation"
    points: 1
    prompt: |
      Per glucose, aerobic respiration yields 2 ATP from glycolysis, 2 ATP from the citric acid cycle, 10 NADH and 2 FADH₂. Assuming each NADH yields 2.5 ATP and each FADH₂ yields 1.5 ATP through oxidative phosphorylation, what is the maximum total number of ATP per glucose? Give a whole number.
    answer: { value: 32, tolerance: 0 }
    explanation: |
      Oxidative phosphorylation: 10 NADH × 2.5 = 25 ATP, and 2 FADH₂ × 1.5 = 3 ATP, so 28 ATP. Substrate-level phosphorylation: 2 + 2 = 4 ATP. Total = 28 + 4 = 32 ATP. That makes 28 of 32, about 88%, the product of the chain and ATP synthase, and it is sixteen times the 2 ATP of fermentation. Real cells often make about 30, because moving the NADH of glycolysis into the mitochondrion can cost energy.

  # ---- Free response
  - slug: u03-exam-q43
    type: short_answer
    topic_code: "3.3"
    source: "Biology 2e §6.4 ATP: Adenosine Triphosphate"
    points: 4
    prompt: |
      Conceptual analysis. The first step of glycolysis converts glucose into glucose 6-phosphate (G6P). The reaction glucose + Pi → G6P + H₂O has ΔG = +3.3 kcal/mol, and ATP + H₂O → ADP + Pi has ΔG = −7.3 kcal/mol. The enzyme hexokinase catalyses glucose + ATP → G6P + ADP. (a) Calculate ΔG for the hexokinase reaction and state whether it is exergonic or endergonic. (b) Explain how the enzyme couples the two reactions, and why simply hydrolysing ATP elsewhere in the same cell would not drive the phosphorylation of glucose. (c) G6P cannot leave through the glucose transporter. Explain how this helps maintain the concentration gradient that brings glucose into the cell by facilitated diffusion. (d) Explain why glycolysis spends ATP at its start even though it is a pathway that makes ATP.
    answer: |
      ΔG = +3.3 + (−7.3) = −4.0 kcal/mol, exergonic. Hexokinase binds both glucose and ATP and transfers ATP's terminal phosphate directly to glucose, so the energy released by breaking the phosphate bond is used in the same reaction; ATP hydrolysed elsewhere just releases heat. G6P is trapped in the cell, so the free glucose concentration inside stays low and glucose keeps diffusing in down its gradient. The phosphorylated sugar is more reactive and can be split; the investment of 2 ATP is repaid by the 4 ATP made later, a net gain of 2.
    explanation: |
      Four points, one per part.

      (a) 1 pt: ΔG = +3.3 + (−7.3) = −4.0 kcal/mol, with the statement that the coupled reaction is exergonic (spontaneous). The arithmetic and the classification are both required: −4.0 kcal/mol with "exergonic" earns the point; the right number with "endergonic" does not.

      (b) 1 pt: hexokinase binds glucose and ATP together in its active site and transfers the terminal phosphate of ATP directly to glucose, so the two reactions happen as one and share the phosphate; the energy released by ATP is used where it is released. Must also say, or clearly imply, that ATP hydrolysed separately would release its energy as heat, which cannot be used to drive another reaction. Saying "ATP gives energy to glucose" with no mention of phosphate transfer or of a shared enzyme earns zero.

      (c) 1 pt: because G6P cannot use the glucose transporter (it is a different, charged molecule), it stays in the cell; converting each glucose that enters into G6P keeps the concentration of free glucose inside the cell low, so glucose continues to move in down its concentration gradient through the transporter without any energy spent on transport. Accept "traps glucose in the cell" only if the link to the low internal glucose concentration and the gradient is made.

      (d) 1 pt: the early phosphorylations make the sugar less stable and more reactive (priming it so that it can be split into two three-carbon molecules), and the investment is repaid later in the pathway, which makes 4 ATP for the 2 spent, a net gain of 2 ATP per glucose. Either the priming idea or the investment-and-return idea with numbers earns the point.

      Zero: treating ΔG values as multiplied rather than added; claiming the enzyme "adds energy"; saying G6P leaves the cell faster than glucose.

  - slug: u03-exam-q44
    type: long_answer
    topic_code: "3.4"
    source: "general knowledge"
    points: 8
    prompt: |
      Interpreting and evaluating experimental results. Chloroplasts were isolated from spinach in cold buffer and mixed with the blue dye DCPIP, which becomes colourless when it accepts electrons. Absorbance at 600 nm (a measure of blue colour) was read every 5 minutes. Tube 1: chloroplasts in light. Tube 2: chloroplasts in darkness. Tube 3: boiled chloroplasts in light. Tube 4: chloroplasts in light with DCMU, a herbicide. Tube 5: no chloroplasts, buffer and dye only, in light. Each value is the mean of three trials; standard errors were all 0.02 or less.

      | Time (min) | Tube 1: light | Tube 2: dark | Tube 3: boiled, light | Tube 4: light + DCMU | Tube 5: no chloroplasts, light |
      |---|---|---|---|---|---|
      | 0 | 0.62 | 0.62 | 0.62 | 0.62 | 0.62 |
      | 5 | 0.47 | 0.61 | 0.61 | 0.60 | 0.62 |
      | 10 | 0.33 | 0.61 | 0.60 | 0.59 | 0.61 |
      | 15 | 0.20 | 0.60 | 0.60 | 0.59 | 0.61 |
      | 20 | 0.11 | 0.60 | 0.60 | 0.58 | 0.61 |

      (a) Describe the result in Tube 1 compared with the other tubes, and calculate the rate of change of absorbance in Tube 1 over the first 15 minutes.
      (b) In the chloroplast, DCPIP is standing in for a natural molecule. Identify that molecule, and explain why the loss of blue colour in Tube 1 shows that the light-dependent reactions are running.
      (c) Explain what Tubes 2, 3 and 5 each rule out.
      (d) DCMU blocks the transfer of electrons out of photosystem II. Explain the result in Tube 4, and predict how O₂ release in Tube 4 would compare with Tube 1.
      (e) A student claims that these data show the chloroplasts in Tube 1 were making glucose. Evaluate the claim.
    answer: |
      In Tube 1 absorbance falls steadily from 0.62 to 0.11 in 20 minutes while every other tube stays within 0.04 of 0.62; rate = (0.20 − 0.62)/15 = −0.028 absorbance units per minute. DCPIP replaces NADP⁺, the final electron acceptor; it turns colourless only when it receives electrons, which the light-driven chain removes from water. Dark rules out a light-independent reaction; boiled rules out light alone acting on the chloroplast material and shows intact proteins are needed; no-chloroplast rules out light bleaching the dye. DCMU stops electrons leaving photosystem II, so none reach DCPIP and water splitting stops: O₂ release near zero, far below Tube 1. The claim is not supported: the data show only electron transport; no CO₂ was supplied or measured, and DCPIP diverts electrons away from NADP⁺, so the Calvin cycle lacks NADPH; measuring sugar or ¹⁴CO₂ fixation would be needed.
    explanation: |
      Eight points.

      (a) 2 pts: 1 pt for the description: absorbance in Tube 1 falls steadily, from 0.62 to 0.11 over 20 minutes (the blue fades), while all four other tubes stay essentially unchanged, within about 0.04 of 0.62. At least one number and the comparison are required. 1 pt for the calculation: (0.20 − 0.62) / 15 min = −0.028 absorbance units per minute (accept 0.027 to 0.029, with or without the minus sign, if units are given; a 20-minute calculation, 0.0255 per minute, earns the point only if the student notes the curve is less steep after 15 minutes).

      (b) 2 pts: 1 pt for identifying NADP⁺ as the natural final electron acceptor that DCPIP replaces (accept "the electron acceptor at the end of the chain that becomes NADPH"). 1 pt for the explanation: DCPIP loses its colour only when it is reduced, so the fading shows electrons are being moved; in the chloroplast those electrons are removed from water at photosystem II and driven along the chain by light energy, so continuing reduction means the light-dependent reactions are operating. Saying "the dye shows photosynthesis" without the electron link earns zero for this point.

      (c) 2 pts: Tube 2 (dark) shows the reduction needs light, so the chloroplasts do not reduce DCPIP by some light-independent reaction; Tube 3 (boiled) shows that intact, functioning chloroplast proteins (photosystems, carriers) are required, so light acting on pigment or membrane material alone is not enough; Tube 5 (no chloroplasts) shows light does not bleach the dye by itself. All three correctly explained earn 2 pts; two earn 1 pt.

      (d) 1 pt: with electrons unable to leave photosystem II, no electrons reach DCPIP, so its colour stays (0.58 at 20 minutes against 0.11 in Tube 1); and the prediction that O₂ release in Tube 4 would be near zero, far less than in Tube 1, because a photosystem II that cannot pass electrons on cannot keep taking electrons from water, so water splitting, the source of the O₂, stops. Both the explanation and the prediction are required.

      (e) 1 pt: the claim is not supported. The data show only that electrons are being transported, the light-dependent reactions. Glucose is made by the Calvin cycle, which was not measured, no CO₂ source was mentioned, and DCPIP diverts the electrons that would have reduced NADP⁺, so little NADPH is available for carbon fixation. A valid answer names what would be needed, such as supplying CO₂ (bicarbonate) and measuring sugar production or ¹⁴CO₂ incorporation.

      Zero for a part: describing Tube 1 as "changing" without direction or numbers; saying DCPIP "absorbs light" or is a pigment; explaining controls only as "for comparison" without saying what each rules out; saying DCMU "kills" the chloroplasts; accepting the glucose claim because "photosynthesis makes glucose".
