  # ---- Cellular respiration and fermentation (3.5)
  - slug: u03-exam-q22
    type: multiple_choice
    topic_code: "3.5"
    source: "Biology 2e §7.5 Metabolism without Oxygen"
    points: 1
    prompt: |
      Mature mammalian red blood cells have no mitochondria, yet they carry oxygen all their lives. How do they make their ATP, and what is the end product of their glucose breakdown?
    options:
      - "By aerobic respiration using the oxygen they carry; the products are CO₂ and water."
      - "By glycolysis followed by lactic acid fermentation; the product is lactate, and the yield is 2 ATP per glucose."
      - "By alcohol fermentation; the products are ethanol and CO₂."
      - "By the citric acid cycle running in the cytosol; the product is acetyl CoA."
    option_explanations:
      - |
        Without mitochondria there is no citric acid cycle or electron transport chain, so the oxygen bound to haemoglobin cannot be used to make ATP; it is delivered to other cells.
      - |
        Correct. Glycolysis runs in the cytosol and needs no organelle; converting pyruvate to lactate regenerates NAD⁺ so glycolysis can continue. Two ATP per glucose suffice for a cell that does little biosynthesis.
      - |
        Alcohol fermentation occurs in yeast and some bacteria; animal cells, red blood cells included, ferment pyruvate to lactate and release no CO₂.
      - |
        The citric acid cycle enzymes are in the mitochondrial matrix; a cell without mitochondria cannot run the cycle at all.
    answer: 1
    explanation: |
      Fermentation is a way of keeping glycolysis going, not an extra source of ATP. The red blood cell is the clean example: plenty of oxygen, no machinery to use it.

  - slug: u03-exam-q23
    type: multiple_choice
    topic_code: "3.5"
    source: "Biology 2e §7.5 Metabolism without Oxygen"
    points: 1
    prompt: |
      Some bacteria in oxygen-free marsh mud pass electrons from NADH down a membrane electron transport chain to sulfate, producing hydrogen sulfide, and make ATP with an ATP synthase. How should their metabolism be classified?
    options:
      - "Fermentation, because no oxygen is used."
      - "Anaerobic respiration, because an electron transport chain and chemiosmosis are used with an inorganic final electron acceptor other than oxygen."
      - "Aerobic respiration, because sulfate contains oxygen atoms."
      - "Photosynthesis, because a sulfur compound is released."
    option_explanations:
      - |
        Fermentation uses no electron transport chain; it passes electrons from NADH to an organic molecule such as pyruvate. A chain plus ATP synthase is respiration.
      - |
        Correct. Respiration is defined by the chain and the gradient, not by oxygen; sulfate takes oxygen's place as the terminal acceptor and yields less energy per pair of electrons.
      - |
        Aerobic respiration means molecular oxygen (O₂) is the final electron acceptor; oxygen atoms bound inside sulfate do not count.
      - |
        Photosynthesis uses light energy to reduce CO₂; these bacteria live in dark mud and oxidise a fuel, which is respiration.
    answer: 1
    explanation: |
      Classify by mechanism: a chain plus a gradient is respiration (aerobic if O₂ is the acceptor, anaerobic if another molecule is); no chain, with NAD⁺ regenerated on an organic molecule, is fermentation.

  # ---- Units 1 and 2 review (multiple choice)
  - slug: u03-exam-q24
    type: multiple_choice
    topic_code: "1.1"
    source: "Biology 2e §2.2 Water"
    points: 1
    prompt: |
      Review. In an illuminated chloroplast the thylakoid lumen reaches about pH 5 while the stroma is about pH 8. How does the hydrogen ion concentration in the lumen compare with that in the stroma?
    options:
      - "About 3 times higher"
      - "About 1,000 times higher"
      - "About 1,000 times lower"
      - "About 10 times higher"
    option_explanations:
      - |
        Subtracting the pH values (8 − 5 = 3) gives the number of tenfold steps, not the ratio; the pH scale is logarithmic.
      - |
        Correct. Each pH unit is a tenfold change in H⁺ concentration, and three units is 10 × 10 × 10 = 1,000. The lower pH is the more acidic side, so the lumen holds more H⁺.
      - |
        The direction is reversed: a lower pH means a higher hydrogen ion concentration, so the lumen at pH 5 has more H⁺ than the stroma at pH 8.
      - |
        A tenfold difference corresponds to a single pH unit; the lumen and stroma differ by three units, which is three tenfold steps.
    answer: 1
    explanation: |
      A thousandfold H⁺ difference across a membrane a few nanometres thick is a large store of potential energy, and it is what ATP synthase spends. Read pH differences as powers of ten.

  - slug: u03-exam-q25
    type: multiple_choice
    topic_code: "1.4"
    source: "Biology 2e §3.2 Carbohydrates"
    points: 1
    prompt: |
      Review. A cow and a human both eat grass. Grass cellulose is made of glucose, yet a human gains almost no ATP from it while a cow gains a great deal. Which explanation is correct?
    options:
      - "The glucose in cellulose is a different isomer from the glucose that glycolysis uses."
      - "Human digestive enzymes cannot hydrolyse the β 1-4 linkages of cellulose, so its glucose never reaches the cells; microbes in the cow's gut break those linkages and ferment the sugar, and the cow absorbs and respires the products."
      - "Cows have a different version of glycolysis that uses polysaccharides directly."
      - "Cellulose contains less energy per glucose unit than starch."
    option_explanations:
      - |
        Cellulose is built from glucose; what differs from starch is the β orientation of the linkage between units, not the identity of the monomer released.
      - |
        Correct. Enzyme specificity is the barrier: amylase fits α linkages, not β. The cow houses microbes with cellulose-digesting enzymes, and their fermentation products are absorbed and respired by the cow.
      - |
        Glycolysis is essentially the same in all organisms and begins with a single sugar; no organism feeds a polysaccharide into it whole.
      - |
        A glucose unit holds about the same energy whether it is linked α or β; what differs is whether an enzyme can release it.
    answer: 1
    explanation: |
      Respiration can use only what digestion releases, and digestion depends on enzymes that match the linkage. Unit 1 structure meets Unit 3 enzyme specificity.

  - slug: u03-exam-q26
    type: multiple_choice
    topic_code: "2.10"
    source: "Biology 2e §23.1 Eukaryotic Origins"
    points: 1
    prompt: |
      Review. The inner membranes of mitochondria contain electron transport chains and ATP synthases closely resembling those in the plasma membranes of aerobic bacteria, and mitochondria also have their own circular DNA and small ribosomes. Which explanation do these observations support?
    options:
      - "Mitochondria are descended from aerobic bacteria engulfed by an ancestral host cell, and the inner membrane derives from the bacterium's plasma membrane."
      - "Mitochondria formed by infolding of the host cell's plasma membrane, which explains their double membrane."
      - "Bacteria evolved from mitochondria that escaped from eukaryotic cells."
      - "Similar enzymes arose independently in bacteria and mitochondria because both need ATP."
    option_explanations:
      - |
        Correct. Endosymbiotic theory predicts exactly these features: a bacterial-type chain in the inner membrane, a separate circular genome and bacterial-sized ribosomes, all inherited from the engulfed ancestor.
