  - slug: u03-exam-q31
    type: multi_select
    topic_code: "3.3"
    source: "Biology 2e §6.4 ATP: Adenosine Triphosphate"
    points: 2
    partial_credit: true
    prompt: |
      Which of these cellular processes are endergonic, so that a cell must couple them to an exergonic reaction such as ATP hydrolysis? Select all that apply.
    options:
      - "The sodium-potassium pump moving ions against their concentration gradients"
      - "Myosin pulling on actin filaments during muscle contraction"
      - "Diffusion of O₂ from the blood into a muscle cell"
      - "Joining amino acids into a polypeptide"
      - "Hydrolysis of sucrose into glucose and fructose by sucrase"
    option_explanations:
      - |
        Correct. Pumping ions against a gradient requires free energy; the pump is phosphorylated by ATP, which changes its shape and moves the ions.
      - |
        Correct. Each cycle of myosin binding, pulling and releasing is powered by hydrolysis of one ATP; mechanical work needs an energy input.
      - |
        Diffusion down a concentration gradient is exergonic and spontaneous; no ATP is needed for O₂ to move from high to low concentration.
      - |
        Correct. Forming peptide bonds by dehydration synthesis is endergonic; the energy comes from ATP spent attaching each amino acid to its tRNA, and from GTP during elongation.
      - |
        Hydrolysis of a disaccharide releases free energy; the enzyme speeds it up, but no ATP is needed to drive it.
    answer: [0, 1, 3]
    explanation: |
      Building, pumping and moving cost energy; breaking down and flowing down a gradient release it. ATP links the second kind of process to the first.

  # ---- True/false (5)
  - slug: u03-exam-q32
    type: true_false
    topic_code: "3.2"
    source: "Biology 2e §6.5 Enzymes"
    points: 1
    prompt: |
      True or false: Below an enzyme's optimum temperature, the rate of the reaction it catalyses rises with temperature mainly because enzyme and substrate molecules move faster and collide more often and with more energy.
    answer: true
    explanation: |
      True. Warming increases kinetic energy, so substrate molecules reach active sites more often and more of them reach the transition state. Below the optimum the enzyme's fold is stable, so the effect is reversible; above the optimum the same motion begins breaking the weak bonds that hold the active site, and denaturation outweighs the faster collisions.

  - slug: u03-exam-q33
    type: true_false
    topic_code: "3.3"
    source: "Biology 2e §6.2 Potential, Kinetic, Free, and Activation Energy"
    points: 1
    prompt: |
      True or false: A cell that keeps a constant composition and temperature from hour to hour is at chemical equilibrium with its surroundings.
    answer: false
    explanation: |
      False. A steady state is not equilibrium. A living cell holds its reactions far from equilibrium by continually taking in free energy (as food or light) and exporting heat and waste; the constancy is maintained by constant flow. A cell whose reactions actually reached equilibrium would have no free energy left to do work, which is to say it would be dead.

  - slug: u03-exam-q34
    type: true_false
    topic_code: "3.4"
    source: "Biology 2e §8.2 The Light-Dependent Reactions of Photosynthesis"
    points: 1
    prompt: |
      True or false: The electrons that reduce NADP⁺ to NADPH in the light-dependent reactions ultimately come from water molecules split at photosystem II.
    answer: true
    explanation: |
      True. P680 loses an excited electron to the chain and replaces it with an electron taken from water; that electron is passed along, boosted again at photosystem I, and handed to NADP⁺. Splitting water also releases the protons that add to the lumen's gradient and the O₂ given off as a by-product.

  - slug: u03-exam-q35
    type: true_false
    topic_code: "3.5"
    source: "Biology 2e §7.2 Glycolysis"
    points: 1
    prompt: |
      True or false: Glycolysis itself produces more ATP per glucose when oxygen is present than when it is absent.
    answer: false
    explanation: |
      False. Glycolysis makes a net 2 ATP per glucose either way. Oxygen raises the cell's total yield because pyruvate and NADH can then feed the citric acid cycle and oxidative phosphorylation, which make most of the ATP. Without oxygen, fermentation only regenerates NAD⁺ so that glycolysis can continue at its 2 ATP.

  - slug: u03-exam-q36
    type: true_false
    topic_code: "2.3"
    source: "Biology 2e §5.1 Components and Structure"
    points: 1
    prompt: |
      Review. True or false: The large complexes of the electron transport chain are integral membrane proteins, with nonpolar regions that sit in the hydrophobic interior of the inner mitochondrial membrane.
    answer: true
    explanation: |
      True. Integral proteins are embedded in or span the bilayer; their membrane-crossing segments are rich in nonpolar amino acids, while the parts facing the matrix and the intermembrane space are polar. That arrangement lets the complexes move protons from one side to the other, which a peripheral protein sitting on one surface could not do. The small mobile carriers, ubiquinone and cytochrome c, are the exceptions.

  # ---- Fill in the blank (5)
  - slug: u03-exam-q37
