      Chemiosmosis in the mitochondrion is a bacterial mechanism in a new home. The resemblances are evidence of common ancestry, linking Unit 2's origins topic to Unit 3's pathways.

  - slug: u03-exam-q27
    type: multiple_choice
    topic_code: "2.4"
    source: "Biology 2e §5.2 Passive Transport"
    points: 1
    prompt: |
      Review. A respiring mitochondrion must take in O₂, pyruvate and ADP across its inner membrane. Which of these crosses the phospholipid bilayer by simple diffusion, without a transport protein?
    options:
      - "Pyruvate, because it is a small three-carbon molecule."
      - "ADP, because it is the substrate of ATP synthase."
      - "O₂, because it is small and nonpolar and dissolves in the hydrophobic core of the bilayer."
      - "All three, because the inner membrane is unusually permeable."
    option_explanations:
      - |
        Size alone does not decide permeability; pyruvate is charged at cellular pH and is carried across by a specific transport protein.
      - |
        ADP carries several negative charges on its phosphates and cannot cross the hydrophobic core; a dedicated exchanger swaps it for ATP.
      - |
        Correct. Small nonpolar gases such as O₂ and CO₂ pass straight through the bilayer down their concentration gradients.
      - |
