      - "CO₂ can no longer diffuse into the leaf, so the CO₂ inside the leaf falls and the Calvin cycle slows."
      - "Oxygen floods into the leaf and is used as the final electron acceptor of photosynthesis."
      - "Salt enters the chloroplasts and denatures the chlorophyll."
