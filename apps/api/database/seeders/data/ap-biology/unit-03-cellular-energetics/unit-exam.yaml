unit: 3
description: |
  44 questions · about 60 minutes · every topic of Unit 3 (3.1 to 3.5) with about a fifth of the items reviewing
  Units 1 and 2, three data-based stimulus sets (an enzyme-inhibition table, an aquatic-plant light curve and an
  oxygen-electrode run with isolated mitochondria), two numeric items (gross photosynthesis and ATP yield per
  glucose), one short free-response item (4 points) and one long free-response item (8 points). Multiple choice,
  select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the
  two free-response items are graded by your teacher against the acceptable-answer summary.
questions:
  # ---- Stimulus set A: β-galactosidase with a product inhibitor and a heavy metal (3.2, 3.1, 1.7)
  - slug: u03-exam-q01
    type: multiple_choice
    topic_code: "3.2"
    source: "Biology 2e §6.5 Enzymes"
    points: 1
    stimulus: |
      β-Galactosidase hydrolyses the colourless substrate ONPG into galactose and o-nitrophenol, which is yellow, so the initial rate can be followed by the rise in absorbance at 420 nm. Initial rates (μmol product per minute) were measured at five ONPG concentrations under four conditions, at 30 °C and pH 7. Each value is the mean of three trials.

      | ONPG (mM) | Standard enzyme | Standard enzyme + 20 mM galactose | Standard enzyme + 0.05 mM Hg²⁺ | Twice the standard enzyme |
      |---|---|---|---|---|
      | 0.25 | 18 | 7 | 9 | 36 |
      | 0.5 | 30 | 13 | 15 | 60 |
      | 1 | 45 | 23 | 23 | 89 |
      | 4 | 68 | 52 | 34 | 135 |
      | 16 | 76 | 72 | 38 | 151 |
    prompt: |
      Which addition acts as a competitive inhibitor of β-galactosidase, and which row of the table is the strongest evidence for that identification?
    options:
      - "Galactose; at 16 mM ONPG its rate (72) is almost the uninhibited rate (76), so enough substrate outcompetes it."
      - "Galactose; at 0.25 mM ONPG its rate (7) is the lowest in the row, so it binds most strongly."
      - "Hg²⁺; at 16 mM ONPG its rate (38) is the lowest in the row, so it must be competing for the active site."
      - "Hg²⁺; at 1 mM ONPG its rate equals the galactose rate (23), so the two inhibitors work the same way."
    option_explanations:
      - |
        Correct. The signature of competitive inhibition is that a high substrate concentration rescues the rate: at 16 mM ONPG, galactose costs only 4 of 76 units, because ONPG molecules now win most of the contests for the active site.
      - |
        The low-substrate row shows that galactose inhibits, but every inhibitor depresses the rate there. Only the high-substrate rows distinguish a competitive inhibitor from a noncompetitive one.
      - |
        The low plateau is evidence against competition, not for it. A competitor can be outcompeted; a rate stuck at half the maximum even with 64 times more substrate means the inhibitor is not fighting substrate for the site.
      - |
        A single shared value at one concentration says nothing about mechanism. The two columns diverge sharply at high ONPG (72 versus 38), which is exactly where the mechanisms differ.
    answer: 0
    explanation: |
      Decide the type of inhibition from the high-substrate end of the table: rescue by substrate means competition for the active site, a lowered ceiling means binding elsewhere. Galactose is also the reaction's own product, a common source of competitive inhibition.

  - slug: u03-exam-q02
    type: multiple_choice
    topic_code: "3.2"
    source: "Biology 2e §6.5 Enzymes"
    points: 1
    stimulus: |
      β-Galactosidase hydrolyses the colourless substrate ONPG into galactose and o-nitrophenol, which is yellow, so the initial rate can be followed by the rise in absorbance at 420 nm. Initial rates (μmol product per minute) were measured at five ONPG concentrations under four conditions, at 30 °C and pH 7. Each value is the mean of three trials.

      | ONPG (mM) | Standard enzyme | Standard enzyme + 20 mM galactose | Standard enzyme + 0.05 mM Hg²⁺ | Twice the standard enzyme |
      |---|---|---|---|---|
      | 0.25 | 18 | 7 | 9 | 36 |
      | 0.5 | 30 | 13 | 15 | 60 |
      | 1 | 45 | 23 | 23 | 89 |
      | 4 | 68 | 52 | 34 | 135 |
      | 16 | 76 | 72 | 38 | 151 |
    prompt: |
      A student proposes overcoming the mercury inhibition simply by adding still more ONPG. Which evaluation of the proposal is best supported by the data?
    options:
      - "It will work, because raising ONPG from 0.25 to 16 mM more than quadrupled the rate with Hg²⁺ present."
      - "It will not work, because raising ONPG from 4 to 16 mM lifted the Hg²⁺ rate only from 34 to 38, levelling off at half the uninhibited maximum; Hg²⁺ has put part of the enzyme out of action rather than competing with substrate."
      - "It will not work, because Hg²⁺ destroys ONPG before the enzyme can bind it."
      - "It will work, because the Hg²⁺ rate at 1 mM ONPG equals the galactose rate, and galactose is overcome by substrate."
    option_explanations:
      - |
        The rise at low concentrations is real but misleading: it is the ordinary approach to saturation. What matters is where the curve levels off, and the Hg²⁺ column flattens near 38, half the uninhibited 76.
      - |
        Correct. A ceiling that more substrate cannot lift means fewer working active sites. Hg²⁺ binds the enzyme away from the substrate's place in the active site and distorts it, so the molecules it affects are out of action whatever the ONPG concentration.
      - |
        If ONPG were being destroyed, the rate would keep falling as substrate disappeared, and adding more ONPG would help. The data show a stable plateau, which points to the enzyme, not the substrate, being affected.
      - |
        Matching values at one concentration do not mean matching mechanisms; at 16 mM the galactose rate has recovered to 72 while the Hg²⁺ rate is stuck at 38.
    answer: 1
    explanation: |
      Noncompetitive inhibition lowers the maximum rate, and no amount of substrate restores it. The practical consequence is that only removing the inhibitor, or making more enzyme, brings the rate back.

  - slug: u03-exam-q03
    type: multiple_choice
    topic_code: "3.1"
    source: "Biology 2e §6.5 Enzymes"
    points: 1
    stimulus: |
      β-Galactosidase hydrolyses the colourless substrate ONPG into galactose and o-nitrophenol, which is yellow, so the initial rate can be followed by the rise in absorbance at 420 nm. Initial rates (μmol product per minute) were measured at five ONPG concentrations under four conditions, at 30 °C and pH 7. Each value is the mean of three trials.

      | ONPG (mM) | Standard enzyme | Standard enzyme + 20 mM galactose | Standard enzyme + 0.05 mM Hg²⁺ | Twice the standard enzyme |
      |---|---|---|---|---|
      | 0.25 | 18 | 7 | 9 | 36 |
      | 0.5 | 30 | 13 | 15 | 60 |
      | 1 | 45 | 23 | 23 | 89 |
      | 4 | 68 | 52 | 34 | 135 |
      | 16 | 76 | 72 | 38 | 151 |
    prompt: |
      Doubling the amount of enzyme roughly doubled the rate at every ONPG concentration, including 16 mM, where the standard enzyme had almost levelled off. Which explanation is best?
    options:
      - "Twice the enzyme provides twice as many active sites; at 16 mM nearly every site is occupied, so the maximum rate is set by how many enzyme molecules are present."
      - "Extra enzyme lowers the activation energy further, so each enzyme molecule works twice as fast."
      - "Extra enzyme supplies energy to the reaction, making it more exergonic."
      - "The enzyme is used up in each reaction, so twice the enzyme can make twice the product before running out."
    option_explanations:
      - |
        Correct. On the plateau the enzyme, not the substrate, is limiting; each active site turns over substrate at its maximum speed, so the total rate scales with the number of sites (76 rising to 151).
      - |
        Every molecule of a given enzyme lowers activation energy by the same amount; more molecules do not lower it further. The rate doubles because there are more catalysts, not better ones.
      - |
        Enzymes do not supply energy and cannot change ΔG; the hydrolysis of ONPG releases the same free energy with one portion of enzyme or two.
      - |
        Enzymes are not consumed; each molecule catalyses the reaction thousands of times. The table reports initial rates, measured long before anything could run out.
    answer: 0
    explanation: |
      The plateau is the enzyme's ceiling, and the ceiling is proportional to the amount of enzyme. That is why cells regulate many pathways by changing how much enzyme they make, a theme Unit 6 returns to.

  - slug: u03-exam-q04
    type: multiple_choice
    topic_code: "1.7"
    source: "Biology 2e §3.4 Proteins"
    points: 1
    stimulus: |
      β-Galactosidase hydrolyses the colourless substrate ONPG into galactose and o-nitrophenol, which is yellow, so the initial rate can be followed by the rise in absorbance at 420 nm. Initial rates (μmol product per minute) were measured at five ONPG concentrations under four conditions, at 30 °C and pH 7. Each value is the mean of three trials.

      | ONPG (mM) | Standard enzyme | Standard enzyme + 20 mM galactose | Standard enzyme + 0.05 mM Hg²⁺ | Twice the standard enzyme |
      |---|---|---|---|---|
      | 0.25 | 18 | 7 | 9 | 36 |
      | 0.5 | 30 | 13 | 15 | 60 |
      | 1 | 45 | 23 | 23 | 89 |
      | 4 | 68 | 52 | 34 | 135 |
      | 16 | 76 | 72 | 38 | 151 |
    prompt: |
      Review. Mercury ions bind tightly to the sulfur atoms in the R groups of cysteine, including cysteines that would otherwise form disulfide bridges. Using protein structure, which explanation accounts for inhibition even when the affected cysteines lie far from the active site?
    options:
      - "Hg²⁺ breaks the peptide bonds next to cysteine, shortening the enzyme's primary structure."
      - "Disrupting disulfide bridges and other R-group interactions changes the enzyme's tertiary structure, and the change in the overall fold distorts the active site."
      - "Hg²⁺ changes the sequence of amino acids, replacing cysteine with another residue."
      - "Hg²⁺ binds the substrate ONPG, so less substrate reaches the enzyme."
    option_explanations:
      - |
        Peptide bonds are not cut by Hg²⁺ under these conditions; the chain stays intact. The inhibition comes from a change in folding, not from breaking the backbone.
      - |
        Correct. Disulfide bridges are covalent cross-links that help hold a polypeptide's tertiary structure. Interfering with them anywhere in the chain can shift the fold, and the active site, which is formed by that fold, loses its precise shape.
      - |
        Sequence is set when the protein is made from its gene; a metal ion can bind an R group but cannot swap one amino acid for another.
      - |
        If Hg²⁺ were tying up the substrate, extra ONPG would compensate, as it does for galactose. The table shows it does not.
    answer: 1
    explanation: |
      The active site is a product of the whole fold, so a disturbance anywhere in tertiary structure can reach it. This is the structural basis of noncompetitive and allosteric effects.

  # ---- Enzymes (3.1), their environment (3.2) and cellular energy (3.3)
  - slug: u03-exam-q05
    type: multiple_choice
    topic_code: "3.1"
    source: "Biology 2e §6.5 Enzymes"
    points: 1
    prompt: |
      Carbonic anhydrase holds a zinc ion in its active site. When the zinc is removed with a chelating agent the protein still folds normally but is inactive; adding Zn²⁺ back restores full activity. What does this show?
    options:
      - "Zinc is a cofactor: an inorganic ion that the active site needs in order to catalyse the reaction."
      - "Zinc is the enzyme's substrate, which is consumed during the reaction."
      - "Zinc is a coenzyme derived from a vitamin that carries electrons between reactions."
      - "Zinc is needed for the enzyme to fold, so without it the enzyme is denatured."
    option_explanations:
      - |
        Correct. A cofactor is a non-protein helper; metal ions such as Zn²⁺, Mg²⁺ and Fe²⁺ often sit in active sites and take part in catalysis. Restoring the ion restores activity because the protein itself was never damaged.
      - |
        A substrate is changed into product; the zinc is recovered unchanged and simply re-added, and the enzyme acts on CO₂ and water, not on zinc.
      - |
        Coenzymes are organic molecules (NAD⁺, FAD, coenzyme A) usually made from vitamins. Zinc is an inorganic ion, which makes it a cofactor.
      - |
        The prompt states that the protein still folds normally without zinc, and a denatured enzyme would not recover simply because an ion was added back.
    answer: 0
    explanation: |
      Proteins supply the shape; cofactors and coenzymes often supply the chemistry. A trace element in the diet can matter because a single ion is essential at an enzyme's active site.

  - slug: u03-exam-q06
    type: multiple_choice
    topic_code: "3.1"
    source: "general knowledge"
    points: 1
    prompt: |
      In lysozyme, an enzyme that cuts the polysaccharides of bacterial cell walls, replacing one glutamate in the active site with glutamine (similar in size, but with no acidic carboxyl group) abolishes catalysis, yet the substrate still binds. What does this show about the active site?
    options:
      - "The active site only needs the right shape; the chemistry of its R groups does not matter."
      - "Particular R groups in the active site take part in the reaction itself, for example by donating a proton, so binding the substrate and catalysing the reaction are separate jobs."
      - "Glutamine is a much larger amino acid that blocks the substrate from entering."
      - "The substitution changed the enzyme's quaternary structure."
    option_explanations:
      - |
        The substrate still binds, so the shape is intact, yet catalysis is lost. That result shows the chemistry of particular R groups matters beyond shape.
      - |
        Correct. An active site lowers activation energy partly by providing a chemical microenvironment, such as an acidic group that donates H⁺ to a bond being broken. Remove that group and the substrate sits in the site unchanged.
      - |
        The prompt specifies that the two residues are similar in size, and the substrate still binds, so nothing is physically blocking it.
      - |
        Lysozyme is a single polypeptide with no quaternary structure; the change is one residue's chemistry within the active site.
    answer: 1
    explanation: |
      Specificity (binding) and catalysis (lowering activation energy) depend on different features of the active site. Biochemists separate them experimentally exactly this way, one substitution at a time.

  - slug: u03-exam-q07
    type: multiple_choice
    topic_code: "3.2"
    source: "Biology 2e §6.5 Enzymes"
    points: 1
    prompt: |
      An enzyme with a pH optimum of 7 loses about half its activity at pH 6. A sample held at pH 6 for an hour and returned to pH 7 recovers full activity, but a sample held at pH 12 for an hour and returned to pH 7 recovers only 10%. Which interpretation is best?
    options:
      - "At pH 6 the charges on some R groups change and reversibly alter the active site; at pH 12 so many of the bonds holding tertiary structure are disrupted that the enzyme denatures and cannot refold."
      - "At pH 6 the enzyme was hydrolysed into amino acids and then reassembled; at pH 12 it could not reassemble."
      - "pH affects only the substrate, so the enzyme itself is unchanged at both pH values."
      - "pH 12 is closer to the optimum than pH 6, so the enzyme worked too fast and wore out."
    option_explanations:
      - |
        Correct. Gaining or losing H⁺ changes the charge on acidic and basic R groups. Near the optimum this shifts a few ionic and hydrogen bonds slightly and reversibly; an extreme pH disrupts so many that the fold is lost.
      - |
        Hydrolysing peptide bonds would destroy the chain, and a cell-free sample cannot rebuild a protein from its amino acids. A small, fully reversible loss is better explained by altered R-group charges.
      - |
        If only the substrate were affected, both samples would show full activity as soon as pH 7 was restored. The pH 12 sample did not recover, so the enzyme itself was changed.
      - |
        pH 12 is five units from the optimum and pH 6 only one. Enzymes do not wear out by working; they are not consumed by the reactions they catalyse.
    answer: 0
    explanation: |
      Distinguish a reversible change in activity (altered charges, shape restored when conditions return) from irreversible denaturation (the fold is lost). A recovery test is how you tell the two apart.

  - slug: u03-exam-q08
    type: multiple_choice
    topic_code: "3.2"
    source: "Biology 2e §6.5 Enzymes"
    points: 1
    prompt: |
      In a bacterial pathway A → B → C → D, the end product D binds an allosteric site on the enzyme that converts A to B and inhibits it. A mutant form of that enzyme has an altered allosteric site that D can no longer bind. Which outcome is most likely in the mutant?
    options:
      - "The pathway stops, because the first enzyme can no longer be regulated."
      - "D is produced continuously even when it is abundant, wasting A and the energy used to make D."
      - "D is produced only when the cell has run out of D."
      - "The first enzyme's active site can no longer bind A."
    option_explanations:
      - |
        Losing regulation does not inactivate the enzyme; its active site is untouched, so it keeps converting A to B, now without an off-switch.
      - |
        Correct. Feedback inhibition is how the cell matches D production to demand. Without the allosteric site the brake is gone, and the pathway runs at full speed regardless of how much D is present.
      - |
        This describes the normal, regulated cell, which makes D when D is scarce. The mutant makes D whether or not D is scarce.
      - |
        The allosteric site is separate from the active site, which is why altering one need not affect the other; the mutant enzyme still binds A.
    answer: 1
    explanation: |
      Inhibiting the first committed step saves the most material and energy. Mutants that have lost feedback control are how bacteria are engineered to overproduce amino acids commercially.

  - slug: u03-exam-q09
    type: multiple_choice
    topic_code: "3.3"
    source: "Biology 2e §6.1 Energy and Metabolism"
    points: 1
    prompt: |
      A three-step metabolic pathway has these free-energy changes: step 1, +2 kcal/mol; step 2, −6 kcal/mol; step 3, −4 kcal/mol. Which statement about the pathway in a living cell is correct?
    options:
      - "The pathway cannot run, because step 1 is endergonic."
      - "The pathway as a whole is exergonic (ΔG = −8 kcal/mol); steps 2 and 3 continually remove the product of step 1, so step 1 keeps proceeding."
      - "The pathway is endergonic overall, because the first step sets the direction for the rest."
      - "The pathway releases 10 kcal/mol, the sum of the two negative steps."
    option_explanations:
      - |
        An endergonic step can run in a cell when the steps after it are strongly exergonic and keep its product scarce, pulling the reaction forward. Pathways are judged as a whole.
      - |
        Correct. +2 − 6 − 4 = −8 kcal/mol. Because the later steps consume the intermediate, step 1 never reaches equilibrium, and the pathway flows forward as a sequence.
      - |
        The direction of a pathway is not set by its first step; free-energy changes along a pathway add, and the sum here is negative.
      - |
        The uphill step must be included: summing only the downhill steps overstates the energy released by 2 kcal/mol.
    answer: 1
    explanation: |
      Free-energy changes are additive. Sequential pathways let cells run individually unfavourable steps by linking them to favourable ones, and they break energy release into controllable pieces.

  - slug: u03-exam-q10
    type: multiple_choice
    topic_code: "3.3"
    source: "Biology 2e §7.1 Energy in Living Systems"
    points: 1
    prompt: |
      Burning glucose in a flame and oxidising it in a cell release the same total free energy. Why does a cell oxidise glucose through more than twenty enzyme-catalysed steps rather than in a single reaction?
    options:
      - "Each step needs less activation energy, so the overall ΔG of the oxidation becomes larger."
      - "Breaking the release into small steps lets much of the energy be captured in ATP and in reduced carriers such as NADH, instead of all of it escaping at once as heat, and gives many points for regulation."
      - "A single-step oxidation would be endergonic, so the cell must use many steps to make it exergonic."
      - "Multiple steps allow the cell to recover all of the energy in glucose as ATP, with no loss as heat."
    option_explanations:
      - |
        ΔG between glucose and CO₂ plus water is fixed by the starting and ending states; the route cannot change it. Small steps lower the activation barriers, not the total energy released.
      - |
        Correct. Energy released in small packets can be coupled to making ATP or transferred as electrons to NAD⁺ and FAD; a single explosive release could only become heat. Each enzyme is also a potential control point.
      - |
        Oxidation of glucose is strongly exergonic (about −686 kcal/mol) whichever path it takes; dividing it into steps does not change its sign.
      - |
        The second law guarantees some loss: a cell captures only about a third of glucose's energy in ATP, and the rest is released as heat.
    answer: 1
    explanation: |
      Stepwise pathways trade speed of release for capture and control. That is why the pathways of Unit 3 are long and why heat is always one of their products.

  # ---- Stimulus set B: an Elodea light curve (3.4, 3.5)
  - slug: u03-exam-q11
    type: multiple_choice
    topic_code: "3.4"
    source: "Biology 2e §8.1 Overview of Photosynthesis"
    points: 1
    stimulus: |
      A sprig of the pondweed Elodea was sealed in a chamber of pond water containing 0.5% sodium bicarbonate at 25 °C, fitted with a dissolved-oxygen sensor. A lamp was set at different distances from the chamber, behind a water-filled screen that kept the temperature constant, and the change in dissolved O₂ was recorded over 10 minutes at each light intensity. The lamp was then switched off for the dark reading. Values are means of four sprigs, expressed per gram of plant per hour.

      | Light intensity (relative units) | Net change in dissolved O₂ (μmol g⁻¹ h⁻¹) |
      |---|---|
      | 0 (dark) | −6 |
      | 10 | 0 |
      | 25 | +10 |
      | 50 | +24 |
      | 100 | +38 |
      | 200 | +40 |
      | 400 | +40 |
    prompt: |
      At which light intensity is the rate of photosynthesis equal to the rate of cellular respiration in the sprig, and how can you tell?
    options:
      - "At 0 units, because without light neither process is running."
      - "At 10 units, because the net change in O₂ is zero: oxygen released by photosynthesis exactly balances oxygen used by respiration."
      - "At 200 units, because that is where the rate stops rising."
      - "At no intensity, because photosynthesis and respiration never occur at the same time in one plant."
    option_explanations:
      - |
        In the dark the sprig still uses O₂ (−6), so respiration continues without light. Only photosynthesis stops.
      - |
        Correct. A net change of zero does not mean nothing is happening; it means O₂ production and O₂ consumption are equal. This is the light compensation point.
      - |
        200 units is where the curve levels off, the point at which light stops being limiting, not the point where the two processes balance.
      - |
        Plant cells respire all the time, in light and in dark; every reading in the light is photosynthesis minus that ongoing respiration.
    answer: 1
    explanation: |
      A gas-exchange measurement always reports a net value. Read zero as balance, not inactivity, and read the negative dark value as the plant's own respiration.

  - slug: u03-exam-q12
    type: numeric
    topic_code: "3.4"
    source: "Biology 2e §8.1 Overview of Photosynthesis"
    points: 1
    stimulus: |
      A sprig of the pondweed Elodea was sealed in a chamber of pond water containing 0.5% sodium bicarbonate at 25 °C, fitted with a dissolved-oxygen sensor. A lamp was set at different distances from the chamber, behind a water-filled screen that kept the temperature constant, and the change in dissolved O₂ was recorded over 10 minutes at each light intensity. The lamp was then switched off for the dark reading. Values are means of four sprigs, expressed per gram of plant per hour.

      | Light intensity (relative units) | Net change in dissolved O₂ (μmol g⁻¹ h⁻¹) |
      |---|---|
      | 0 (dark) | −6 |
      | 10 | 0 |
      | 25 | +10 |
      | 50 | +24 |
      | 100 | +38 |
      | 200 | +40 |
      | 400 | +40 |
    prompt: |
      Assuming the sprig respires at the same rate in the light as in the dark, calculate the gross rate of photosynthesis (total O₂ produced) at 100 light units, in μmol O₂ g⁻¹ h⁻¹. Give a whole number.
    answer: { value: 44, tolerance: 0.5 }
    explanation: |
      Gross photosynthesis = net O₂ change + O₂ used by respiration. The dark reading shows respiration consuming 6 μmol g⁻¹ h⁻¹, so gross = 38 + 6 = 44 μmol O₂ g⁻¹ h⁻¹. The assumption matters: if respiration ran faster in the light, 44 would be an underestimate, which is why a good answer states it.

  - slug: u03-exam-q13
    type: multiple_choice
    topic_code: "3.4"
    source: "Biology 2e §8.3 Using Light Energy to Make Organic Molecules"
    points: 1
    stimulus: |
      A sprig of the pondweed Elodea was sealed in a chamber of pond water containing 0.5% sodium bicarbonate at 25 °C, fitted with a dissolved-oxygen sensor. A lamp was set at different distances from the chamber, behind a water-filled screen that kept the temperature constant, and the change in dissolved O₂ was recorded over 10 minutes at each light intensity. The lamp was then switched off for the dark reading. Values are means of four sprigs, expressed per gram of plant per hour.

      | Light intensity (relative units) | Net change in dissolved O₂ (μmol g⁻¹ h⁻¹) |
      |---|---|
      | 0 (dark) | −6 |
      | 10 | 0 |
      | 25 | +10 |
      | 50 | +24 |
      | 100 | +38 |
      | 200 | +40 |
      | 400 | +40 |
    prompt: |
      Doubling the light from 200 to 400 units produced no further rise in net O₂ release. Which explanation is best supported, and which follow-up test would check it?
    options:
      - "Light is still limiting; a brighter lamp would raise the rate further."
      - "Another factor, most likely the CO₂ supply to the Calvin cycle, now limits the rate; repeating the 400-unit reading with more bicarbonate in the water should raise it."
      - "The sprig was killed by the bright light; returning it to 50 units would give no O₂ release."
      - "Respiration rose to match photosynthesis; a dark reading taken after the 400-unit reading would be −40."
    option_explanations:
      - |
        If light were limiting, doubling it would raise the rate, as it did between 25 and 50 units. A flat line means light is no longer the factor in short supply.
      - |
        Correct. Once the light reactions supply ATP and NADPH faster than the Calvin cycle can use them, carbon fixation by RuBisCO, which depends on the CO₂ concentration, sets the pace. Adding bicarbonate tests the idea directly.
      - |
        A dead sprig would stop producing O₂ altogether; instead the rate holds steady at +40. Nothing in the data suggests damage.
      - |
        The temperature was held constant and nothing indicates respiration changed; had it risen that much, the net value would have fallen toward zero rather than holding at +40.
    answer: 1
    explanation: |
      A plateau means a different factor has become limiting. Name the likely factor and propose the experiment that would raise the ceiling: that is the move the AP exam rewards.

  - slug: u03-exam-q14
    type: multiple_choice
    topic_code: "3.5"
    source: "Biology 2e §7.1 Energy in Living Systems"
    points: 1
    stimulus: |
      A sprig of the pondweed Elodea was sealed in a chamber of pond water containing 0.5% sodium bicarbonate at 25 °C, fitted with a dissolved-oxygen sensor. A lamp was set at different distances from the chamber, behind a water-filled screen that kept the temperature constant, and the change in dissolved O₂ was recorded over 10 minutes at each light intensity. The lamp was then switched off for the dark reading. Values are means of four sprigs, expressed per gram of plant per hour.

      | Light intensity (relative units) | Net change in dissolved O₂ (μmol g⁻¹ h⁻¹) |
      |---|---|
      | 0 (dark) | −6 |
      | 10 | 0 |
      | 25 | +10 |
      | 50 | +24 |
      | 100 | +38 |
      | 200 | +40 |
      | 400 | +40 |
    prompt: |
      Which process accounts for the negative value in the dark, and what does that value tell you about the sprig in the light?
    options:
      - "Photosynthesis running in reverse; in the light it runs forward instead."
      - "Cellular respiration in the plant's mitochondria, which uses O₂ continuously; in the light it is still running, hidden within the net value."
      - "Oxygen dissolving into the plant's cell walls, which happens only in the dark."
      - "Fermentation, which plants switch to when there is no light."
    option_explanations:
      - |
        The light reactions and the Calvin cycle do not run backward to consume O₂ in the dark; they simply stop. Steady O₂ uptake is the signature of aerobic respiration.
      - |
        Correct. Plant cells have mitochondria and oxidise sugar for ATP day and night. The light readings are net values: photosynthetic O₂ release minus this continuing O₂ use.
      - |
        Dissolving would quickly reach equilibrium and stop; a steady uptake over the whole reading is the sign of a metabolic process.
      - |
        Fermentation uses no O₂ at all; the sprig was taking up O₂, so it was respiring aerobically. Darkness does not remove oxygen from the water.
    answer: 1
    explanation: |
      Plants respire too. The dark reading is the respiration rate, and it must be added back to any light reading to find the true (gross) rate of photosynthesis.

  # ---- Photosynthesis (3.4) with Unit 1 and 2 links
  - slug: u03-exam-q15
    type: multiple_choice
    topic_code: "3.4"
    source: "general knowledge"
    points: 1
    prompt: |
      The rock record shows that free oxygen began to accumulate in Earth's atmosphere roughly 2.4 billion years ago, long after the first cells appeared but well before eukaryotic algae and plants. Which inference is best supported?
    options:
      - "Photosynthesis first evolved in eukaryotic plants, which released the first oxygen."
      - "Oxygen-releasing photosynthesis evolved in prokaryotes such as the ancestors of cyanobacteria, and eukaryotes later inherited the pathway when a cyanobacterium became the chloroplast."
      - "Early cells used oxygen for aerobic respiration before any oxygen had been released into the atmosphere."
      - "The first oxygen was produced by the Calvin cycle of the earliest cells."
    option_explanations:
      - |
        The timing rules this out: oxygen accumulated before eukaryotic algae and plants existed, so the first oxygen producers must have been prokaryotes.
      - |
        Correct. Oxygenic photosynthesis arose in prokaryotes; chloroplasts are descended from an engulfed cyanobacterium, which is why the plant pathway is a prokaryotic pathway housed in an organelle.
      - |
        Aerobic respiration needs O₂ as its final electron acceptor; it could become widespread only after photosynthesis had made oxygen available, not before.
      - |
        The O₂ of photosynthesis comes from splitting water in the light-dependent reactions; the Calvin cycle fixes CO₂ and releases no oxygen.
    answer: 1
    explanation: |
      Photosynthesis is older than eukaryotes, and its oxygen changed the planet: it made aerobic respiration, with its much larger ATP yield, possible. The CED expects you to connect the pathway to its prokaryotic origin.

