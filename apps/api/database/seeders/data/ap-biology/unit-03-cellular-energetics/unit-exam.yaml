    prompt: |
      The process in which ATP synthase uses the energy of a hydrogen ion gradient across a membrane to make ATP is called ____.
    answer: ["chemiosmosis"]
    explanation: |
      Chemiosmosis is the shared mechanism of mitochondria and chloroplasts: a chain pumps H⁺, and ATP synthase lets it back. "Oxidative phosphorylation" names the whole mitochondrial process, chain plus chemiosmosis, and does not cover the same mechanism in the thylakoid, so it is not accepted for this definition.

