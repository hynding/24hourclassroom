    answer: 1
    explanation: |
      Tonicity reaches photosynthesis through the guard cells: water loss closes the stomata and starves the Calvin cycle of CO₂. Saving water and gaining carbon are a constant trade-off for a plant.

  # ---- Stimulus set C: an oxygen-electrode run with isolated mitochondria (3.5)
  - slug: u03-exam-q18
    type: multiple_choice
    topic_code: "3.5"
    source: "general knowledge"
    points: 1
    stimulus: |
      Mitochondria isolated from rat liver were suspended in a sealed, stirred chamber fitted with an oxygen electrode. The buffer contained phosphate and the fuels pyruvate and malate, which the mitochondria oxidise to supply NADH. Compounds were added one after another, and the rate of O₂ consumption was calculated for each interval. Oligomycin blocks the proton channel of ATP synthase; DNP carries H⁺ across the inner membrane; cyanide blocks complex IV.

      | Interval | Chamber contents (additions are cumulative) | O₂ consumption (nmol O₂ per min per mg mitochondrial protein) |
      |---|---|---|
      | 1 | Mitochondria, phosphate, pyruvate and malate | 6 |
      | 2 | + ADP | 38 |
      | 3 | No further addition (all the added ADP now converted to ATP) | 7 |
      | 4 | + a second dose of ADP, together with oligomycin | 5 |
      | 5 | + DNP | 55 |
      | 6 | + cyanide | 0 |
    prompt: |
      O₂ consumption rose from 6 to 38 when ADP was added and fell back to 7 once that ADP had been converted to ATP. Which explanation is best?
    options:
      - "ADP is a fuel that is oxidised by the electron transport chain."
      - "Electron transport is coupled to ATP synthesis through the proton gradient: without ADP, ATP synthase cannot let protons back, the gradient builds until it resists further pumping, and electron flow to O₂ slows."
      - "ADP activates complex IV directly, and ATP inhibits it."
      - "The mitochondria ran out of pyruvate and malate during interval 2."
    option_explanations:
      - |
        ADP is not oxidised; it is phosphorylated to ATP. The electrons reaching O₂ come from NADH produced from pyruvate and malate.
      - |
        Correct. Protons can re-enter the matrix through ATP synthase only when there is ADP to phosphorylate. With the ADP gone the gradient stays steep, pumping becomes harder, and the whole chain slows; adding ADP releases the brake.
      - |
        Nothing in the data requires a direct effect on complex IV, and interval 5 shows the chain can run fast with no ATP synthesis at all once the gradient is dissipated.
      - |
        If the fuel had run out, neither the second dose of ADP nor the DNP could have restarted O₂ consumption; in interval 5 the rate reached 55, so fuel was plentiful.
    answer: 1
    explanation: |
      The chain runs only as fast as protons can return across the membrane. This coupling, called respiratory control, lets a cell burn fuel in step with its demand for ATP.

