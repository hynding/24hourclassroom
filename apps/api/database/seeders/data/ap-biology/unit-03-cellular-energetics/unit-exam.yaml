    points: 1
    prompt: |
      Organic helper molecules such as NAD⁺ and FAD, often made from vitamins, that an enzyme needs in order to function are called ____.
    answer: ["coenzymes", "coenzyme"]
    explanation: |
      Coenzymes are organic and often carry electrons or chemical groups from one reaction to another; NAD⁺ is made from niacin and FAD from riboflavin. Biology 2e reserves "cofactor" for inorganic helpers such as Zn²⁺ and Mg²⁺, so that word is not accepted here, and "vitamins" names the dietary source rather than the helper molecule.

  - slug: u03-exam-q38
    type: fill_blank
    topic_code: "3.3"
    source: "Biology 2e §6.4 ATP: Adenosine Triphosphate"
    points: 1
    prompt: |
      Transferring a phosphate group from ATP to another molecule, which raises that molecule's free energy and makes it more reactive, is called ____.
    answer: ["phosphorylation"]
    explanation: |
      Phosphorylation is the coupling step: the phosphate carries part of ATP's free energy to a substrate or a protein, which then reacts or changes shape. "Hydrolysis" names the breaking of ATP by water, which on its own would release the energy as heat, so it is not accepted.

  - slug: u03-exam-q39
    type: fill_blank
    topic_code: "3.4"
    source: "Biology 2e §8.3 Using Light Energy to Make Organic Molecules"
    points: 1
    prompt: |
      The three-carbon sugar ____ is the product that leaves the Calvin cycle and is used to build glucose, sucrose, starch and other organic molecules.
    answer: ["G3P", "glyceraldehyde 3-phosphate", "glyceraldehyde-3-phosphate", "glyceraldehyde 3 phosphate"]
    explanation: |
      G3P is the true output of the Calvin cycle: one in every six made leaves the cycle, and the other five regenerate RuBP. Two G3P make one glucose. "3-PGA" is not accepted, because it is the product of fixation that must still be reduced by ATP and NADPH; "glucose" is a downstream product, not the cycle's own.

  - slug: u03-exam-q40
    type: fill_blank
