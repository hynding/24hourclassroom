    answer: 2
    explanation: |
      Polarity and charge, not just size, decide what crosses a bilayer unaided. The inner membrane's impermeability to ions is the foundation of chemiosmosis.

  # ---- Select-all (4)
  - slug: u03-exam-q28
    type: multi_select
    topic_code: "3.1"
    source: "Biology 2e §6.5 Enzymes"
    points: 2
    partial_credit: true
    prompt: |
      Which of the following are ways in which an enzyme's active site can lower the activation energy of a reaction? Select all that apply.
    options:
      - "Holding two substrates close together in the orientation needed for them to react"
      - "Straining or bending a bond in the substrate so that it breaks more easily"
      - "Providing a local environment, such as an acidic or nonpolar pocket, that favours the transition state"
      - "Making the reaction's ΔG more negative so that more energy is released"
      - "Supplying heat from the enzyme to push the substrate over the energy barrier"
    option_explanations:
      - |
        Correct. Bringing reactants together in the right orientation removes the need for a lucky collision, a major part of the activation barrier.
      - |
        Correct. Distorting the substrate toward the shape of the transition state makes the bonds that must break easier to break.
      - |
        Correct. R groups in the site can create a microenvironment, for example donating H⁺ or excluding water, that would not exist in open solution.
      - |
        Enzymes leave ΔG unchanged; the products hold the same free energy whether the reaction is catalysed or not. Only the barrier is lowered.
      - |
        Enzymes are not heat sources; the substrate still crosses the barrier using ordinary thermal energy. The enzyme lowers the barrier so that ordinary energy suffices.
    answer: [0, 1, 2]
    explanation: |
      Orientation, strain and microenvironment (and sometimes a brief covalent bond to the substrate) all reduce activation energy. None of them changes how much energy the reaction releases.

