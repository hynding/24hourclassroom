        - "The chloroplast uses a proton gradient but the mitochondrion makes ATP directly from electron transfer."
        - "The two organelles pump protons in the same direction relative to the cytosol, so the mechanisms are identical in every detail."
        - "Only the mitochondrion has ATP synthase; the chloroplast makes ATP by substrate-level phosphorylation."
      option_explanations:
        - |
          Correct. The mechanism is the same; the geography is mirrored. The energy source differs too: light drives the chloroplast's chain, electrons from food drive the mitochondrion's, and the final acceptors are NADP⁺ and O₂ respectively.
        - |
          Both organelles make ATP only through ATP synthase driven by a proton gradient. Uncouplers abolish ATP synthesis in both, which is the evidence.
        - |
