week: 11
unit: 3
title: Oxidative Phosphorylation, Fermentation and the Energetics Synthesis
topics: ["3.5"]
guide: guides/week-11.md
guide_description: |
  Respiration part two: the electron transport chain of the inner mitochondrial membrane, oxygen as the final
  electron acceptor, the proton gradient and chemiosmosis, ATP synthase, the ATP count and why it varies, poisons
  and uncouplers as experiments. What happens without oxygen: lactic acid and alcohol fermentation, anaerobic
  respiration, and why regenerating NAD⁺ is the point. Regulation of the whole pathway, and a synthesis that sets
  photosynthesis beside respiration. Three worked examples (a respirometer rate from AP Investigation 6, an ATP
  yield calculation, predicting the effect of a poison), misconceptions, self-check. The Unit 3 exam is this week.
flashcards_description: |
  32 cards: the electron transport chain, chemiosmosis and ATP synthase, the ATP yield, fermentation, regulation, respirometer logic, and the comparison of the two chemiosmotic systems.

flashcards:
  - front: Electron transport chain (mitochondrion) → location and components
    back: |
      In the inner mitochondrial membrane: four protein complexes (I to IV) plus two mobile carriers, ubiquinone (Q) and cytochrome c. Electrons from NADH and FADH₂ pass through a series of redox reactions, falling in energy toward oxygen.
    topic_code: "3.5"
  - front: Complex I versus complex II → why NADH yields more ATP than FADH₂
    back: |
      NADH delivers electrons to complex I, which pumps protons; FADH₂ delivers to complex II, which does not. Electrons from FADH₂ therefore skip one pumping site, fewer protons cross per pair, and about 1.5 ATP result instead of about 2.5.
    hint: Entering later means skipping a pump.
    topic_code: "3.5"
  - front: Ubiquinone and cytochrome c → roles
    back: |
      Ubiquinone (Q) is a small lipid-soluble molecule that carries electron pairs from complexes I and II to complex III within the membrane. Cytochrome c is a small protein that carries electrons one at a time from complex III to complex IV along the membrane surface.
    topic_code: "3.5"
  - front: Why is oxygen the final electron acceptor, and what does it become?
    back: |
      Oxygen is highly electronegative, so it pulls electrons strongly and sits at the bottom of the energy staircase. At complex IV each O₂ accepts four electrons and four protons to form two water molecules. This is where the O₂ you breathe goes.
    topic_code: "3.5"
  - front: What happens to the chain, and the cell, if oxygen runs out?
    back: |
      Electrons have nowhere to go, so every carrier backs up in its reduced form, proton pumping stops, the gradient collapses and ATP synthase halts. NADH cannot be reoxidised, so the citric acid cycle and pyruvate oxidation stop too. Only glycolysis plus fermentation remain.
    topic_code: "3.5"
  - front: Proton-motive force
    back: |
      The stored energy of the H⁺ gradient across the inner membrane: both a concentration difference and a charge difference, with the intermembrane space acidic and positive relative to the matrix. ATP synthase taps it.
    topic_code: "3.5"
  - front: Chemiosmosis (mitochondrion) → the sequence of events
    back: |
      Electron transport pumps H⁺ from the matrix into the intermembrane space; the membrane is impermeable to H⁺ except through ATP synthase; H⁺ flows back down its gradient through the synthase, which rotates and phosphorylates ADP to ATP in the matrix.
    topic_code: "3.5"
  - front: ATP synthase → how it works
    back: |
      A membrane-embedded rotary enzyme. Protons flowing through its membrane portion turn a rotor; the rotation changes the shape of the catalytic sites in the matrix portion, binding ADP and Pi and forcing them together into ATP. Facilitated diffusion of H⁺ coupled to an endergonic synthesis.
    topic_code: "3.5"
  - front: Oxidative phosphorylation → definition and share of the yield
    back: |
      ATP synthesis driven by the proton gradient that electron transport builds; the term covers the chain and chemiosmosis together. It makes about 26 to 28 of the roughly 30 to 32 ATP per glucose, about 90% of the total.
    topic_code: "3.5"
  - front: ATP yield per glucose → the accounting
    back: |
      Substrate-level: 2 (glycolysis) + 2 (citric acid cycle) = 4. Oxidative: 10 NADH × about 2.5 = 25, plus 2 FADH₂ × about 1.5 = 3. Total about 30 to 32; older texts say 36 to 38 by assuming 3 and 2 per carrier.
    hint: Four direct, the rest from carriers.
    topic_code: "3.5"
  - front: Why is the ATP yield of respiration not a fixed number?
    back: |
      Protons are also used for other transport (pyruvate and phosphate import), the NADH made in the cytosol by glycolysis may enter as FADH₂ depending on the shuttle, intermediates are siphoned into biosynthesis, and some of the gradient leaks. Yield varies by cell type and condition.
    topic_code: "3.5"
  - front: Efficiency of respiration
    back: |
      Roughly 34% of glucose's free energy ends up in ATP; the rest is released as heat. That heat is the second law collecting its fee, and in endotherms it is also what keeps the body warm.
    topic_code: "3.5"
  - front: Uncoupler (for example DNP) → what it does and what you observe
    back: |
      Makes the inner membrane leaky to H⁺, so the gradient dissipates without passing through ATP synthase. Electron transport and O₂ consumption continue, even speed up, but ATP production falls and the energy appears as heat. Brown fat uses a natural uncoupler protein to warm newborn mammals.
    topic_code: "3.5"
  - front: Cyanide → what it blocks and what follows
    back: |
      Binds complex IV and stops the transfer of electrons to oxygen. The whole chain backs up, proton pumping stops, ATP synthesis stops, O₂ consumption stops, and the cell is left with fermentation alone. Lethal within minutes for tissues that cannot survive on glycolysis.
    topic_code: "3.5"
  - front: Fermentation → the one thing it must achieve
    back: |
      Regenerate NAD⁺ from NADH so that glycolysis can continue to make its 2 ATP without oxygen. The electrons are dumped onto an organic molecule (pyruvate or a derivative), not onto oxygen, and no extra ATP is made by the fermentation steps themselves.
    hint: The product is a waste; NAD⁺ is the point.
    topic_code: "3.5"
  - front: Lactic acid fermentation
    back: |
      Lactate dehydrogenase transfers electrons from NADH directly to pyruvate, making lactate and NAD⁺. No CO₂ is released. Used by muscle during intense exercise and by red blood cells, which lack mitochondria; lactate goes to the liver to be converted back.
    topic_code: "3.5"
  - front: Alcohol fermentation
    back: |
      Pyruvate first loses CO₂ (pyruvate decarboxylase) to make acetaldehyde, which then accepts electrons from NADH (alcohol dehydrogenase) to make ethanol and NAD⁺. Yeast does this; the CO₂ raises bread and the ethanol makes wine.
    topic_code: "3.5"
  - front: Fermentation versus anaerobic respiration
    back: |
      Fermentation uses no electron transport chain and passes electrons to an organic acceptor; yield is 2 ATP per glucose. Anaerobic respiration uses a chain with an inorganic acceptor other than O₂ (sulfate, nitrate, CO₂) and yields more. Some prokaryotes do the second; animals and yeast do only the first.
    topic_code: "3.5"
  - front: Obligate anaerobe
    back: |
      An organism poisoned by oxygen, which lives by fermentation or anaerobic respiration only; Clostridium species are examples. Contrast facultative anaerobes such as yeast, which use oxygen when present and ferment when not.
    topic_code: "3.5"
  - front: Why does fermentation yield so little ATP compared with respiration?
    back: |
      Only glycolysis's 2 ATP are made; the energy-rich electrons on NADH are given back to pyruvate instead of to the chain, and most of glucose's energy leaves the cell still inside lactate or ethanol. Respiration oxidises the carbon fully to CO₂ and captures the difference.
    topic_code: "3.5"
  - front: Control points of respiration → the three enzymes to name
    back: |
      Phosphofructokinase (glycolysis; ATP and citrate inhibit, AMP activates), pyruvate dehydrogenase (acetyl CoA and NADH inhibit), and the cycle's isocitrate dehydrogenase (ATP and NADH inhibit, ADP activates). The chain itself speeds up when ADP is high.
    topic_code: "3.5"
  - front: How do GLUT transporters regulate respiration before it starts?
    back: |
      Glucose enters cells by facilitated diffusion through GLUT proteins. Different tissues express different GLUTs; GLUT4 in muscle and fat is inserted into the membrane in response to insulin, so supply to the pathway is itself regulated.
    topic_code: "3.5"
  - front: Respirometer → what it actually measures
    back: |
      The change in gas volume in a sealed chamber. KOH absorbs the CO₂ produced, so the only net change is O₂ consumed, which pulls water into the pipette. The distance moved per minute, corrected by a non-living control, is the rate of respiration.
    topic_code: "3.5"
  - front: Why does a respirometer need KOH?
    back: |
      Respiration consumes O₂ and releases CO₂ in about equal volumes, so without removing CO₂ the net gas change would be near zero. Potassium hydroxide converts CO₂ to solid potassium carbonate, leaving O₂ uptake as the only volume change.
    topic_code: "3.5"
  - front: Why include a respirometer of glass beads alone?
    back: |
      It is the control for everything that is not respiration: temperature or pressure changes that expand or contract the gas. Its reading is subtracted from the living samples before a rate is calculated.
    topic_code: "3.5"
  - front: Germinating versus dormant peas → the expected result
    back: |
      Germinating seeds are growing, synthesising and dividing, so they respire fast; dormant dry seeds respire at a very low rate. The germinating set consumes several times more O₂ per minute, and the difference widens at higher temperature.
    topic_code: "3.5"
  - front: Effect of temperature on respiration rate in a respirometer
    back: |
      Within the physiological range, warmer is faster, because every step is enzyme-catalysed and collision rates rise; a 10 °C rise roughly doubles the rate. Above the optimum, enzymes denature and the rate falls, just as in week 8.
    topic_code: "3.5"
  - front: Chemiosmosis in chloroplast and mitochondrion → the same mechanism, mirrored
    back: |
      Both: an electron transport chain pumps H⁺ across a membrane and ATP synthase lets it back, making ATP. Chloroplast: protons into the thylakoid lumen, ATP made in the stroma, electrons from water to NADP⁺, energy from light. Mitochondrion: protons into the intermembrane space, ATP made in the matrix, electrons from NADH to O₂, energy from food.
    topic_code: "3.5"
  - front: Photosynthesis and respiration → reactants, products and energy
    back: |
      Photosynthesis: CO₂ + H₂O + light → sugar + O₂; endergonic, builds reduced carbon. Respiration: sugar + O₂ → CO₂ + H₂O + ATP + heat; exergonic, oxidises it. Matter cycles between them; energy enters as light and leaves as heat.
    topic_code: "3.5"
  - front: Do plants respire?
    back: |
      Yes, all the time, in every living cell, using the sugar they made. In daylight photosynthesis usually outpaces respiration, so there is net O₂ release and CO₂ uptake; at night only respiration runs. A plant with no mitochondria could not survive the night.
    topic_code: "3.5"
  - front: Where in respiration does each reactant and product appear?
    back: |
      Glucose: consumed in glycolysis. O₂: consumed only at complex IV. CO₂: released in pyruvate oxidation and the citric acid cycle. H₂O: made at complex IV. ATP: glycolysis (2), cycle (2), ATP synthase (about 26 to 28). Heat: every step.
    topic_code: "3.5"
  - front: Evolution of energy metabolism → the order and the evidence
    back: |
      Glycolysis first, universal and anaerobic; then photosynthesis, which filled the air with O₂ about 2.5 billion years ago; then aerobic respiration, which uses that O₂ for a tenfold gain. Mitochondria and chloroplasts were free-living bacteria that were engulfed, which is why they keep their own DNA and chemiosmotic membranes.
    topic_code: "3.5"

quiz:
  description: |
    25 questions · about 32 minutes · the electron transport chain, chemiosmosis, the ATP yield, uncouplers and
    poisons, fermentation and regulation, with a respirometer (AP Investigation 6) data set, plus spiral review
    that sets respiration beside photosynthesis and brings back enzymes, free energy and membranes from earlier in
    this unit and Unit 2. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the two short answers and the long answer are graded by
    your teacher against the acceptable-answer summary. The Unit 3 exam follows this quiz.
  questions:
    - slug: u03-w11-q01
      type: multiple_choice
      topic_code: "3.5"
      source: "Biology 2e §7.4 Oxidative Phosphorylation"
      points: 1
      prompt: |
        What is the role of molecular oxygen in aerobic respiration?
      options:
        - "It is the final electron acceptor at the end of the electron transport chain, combining with electrons and protons to form water."
        - "It reacts directly with glucose in the cytosol to release energy as heat."
        - "It is converted into CO₂ in the citric acid cycle."
        - "It carries electrons from NADH to complex I."
      option_explanations:
        - |
          Correct. Oxygen's high electronegativity makes it the lowest-energy destination for electrons; complex IV passes them to O₂, which with four H⁺ becomes two H₂O. Without that final pull, the whole chain stops.
        - |
          Glucose never meets oxygen directly in a cell. Its electrons are removed stepwise onto NAD⁺ and FAD, and only the chain delivers them to O₂; a direct reaction would release the energy uselessly as heat.
        - |
          The oxygen atoms of CO₂ come from glucose and water, not from O₂; CO₂ is released in the matrix stages before the chain. O₂ becomes water, not carbon dioxide.
        - |
          NADH delivers electrons to complex I itself; no oxygen is involved at that end. Oxygen waits at the opposite end of the chain.
      answer: 0
      explanation: |
        Oxygen is consumed at exactly one point in respiration, the last. Everything upstream depends on it only because the chain must keep accepting electrons for NAD⁺ to be regenerated.

    - slug: u03-w11-q02
      type: multiple_choice
      topic_code: "3.5"
      source: "Biology 2e §7.4 Oxidative Phosphorylation"
      points: 1
      prompt: |
        Electrons from NADH yield about 2.5 ATP each, but electrons from FADH₂ yield only about 1.5. Which explanation is correct?
      options:
        - "FADH₂ delivers its electrons to complex II, which does not pump protons, so the electrons bypass one of the three pumping sites and fewer protons cross the membrane per electron pair."
        - "FADH₂ carries only one electron, whereas NADH carries two."
        - "FADH₂ electrons are delivered to oxygen directly, skipping the chain altogether."
        - "FADH₂ is made in the cytosol and must pay ATP to enter the mitochondrion."
      option_explanations:
        - |
          Correct. Complex I pumps protons; complex II does not. Electrons entering at complex II still pass complexes III and IV, so they drive two pumping sites rather than three, and the smaller gradient contribution makes less ATP.
        - |
          Both carriers deliver a pair of electrons. The difference is the entry point into the chain, not the number of electrons.
        - |
          FADH₂ electrons pass through ubiquinone, complex III, cytochrome c and complex IV before reaching oxygen. They skip only complex I.
        - |
          FADH₂ is produced inside the matrix by the citric acid cycle (succinate dehydrogenase is embedded in the inner membrane) and never has to cross a membrane.
      answer: 0
      explanation: |
        ATP per carrier is proportional to protons pumped per carrier. Counting pumping sites passed is the way to reason about any carrier, inhibitor or mutant in the chain.

    - slug: u03-w11-q03
      type: multiple_choice
      topic_code: "3.5"
      source: "Biology 2e §7.4 Oxidative Phosphorylation"
      points: 1
      prompt: |
        In an actively respiring mitochondrion, where is the pH lowest, and why?
      options:
        - "In the intermembrane space, because the electron transport chain pumps protons out of the matrix across the inner membrane."
        - "In the matrix, because the citric acid cycle releases H⁺ as it oxidises acetyl groups."
        - "In the cytosol, because glycolysis produces pyruvic acid."
        - "Everywhere equally, because membranes are freely permeable to small ions."
      option_explanations:
        - |
          Correct. Complexes I, III and IV move H⁺ from the matrix into the intermembrane space, which becomes acidic and positively charged relative to the matrix. That difference is the proton-motive force.
        - |
          The dehydrogenases of the cycle hand protons and electrons to NAD⁺ and FAD; the chain then pumps protons out of the matrix, so the matrix becomes slightly basic, not acidic.
        - |
          Pyruvate is a weak acid, but the cytosol is buffered near pH 7.2 and is not the site of the gradient that matters for ATP. The question is about the mitochondrion.
        - |
          The lipid bilayer is nearly impermeable to H⁺, which is exactly why a gradient can be built and held. Protons re-enter the matrix mainly through ATP synthase.
      answer: 0
      explanation: |
        Mitochondrion: protons pumped out of the matrix into the intermembrane space. Chloroplast: protons pumped into the thylakoid lumen. In both cases ATP is made on the side the protons flow back to.

    - slug: u03-w11-q04
      type: multiple_choice
      topic_code: "3.5"
      source: "Biology 2e §7.4 Oxidative Phosphorylation"
      points: 1
      prompt: |
        Which statement best describes how ATP synthase makes ATP?
      options:
        - "Protons flow down their electrochemical gradient through the enzyme, rotating part of it, and the rotation changes the shape of catalytic sites so that ADP and Pi are joined."
        - "The enzyme hydrolyses NADH and uses the energy released to phosphorylate ADP."
        - "The enzyme pumps protons out of the matrix, and the energy of pumping is stored in ATP."
        - "Electrons pass through the enzyme to oxygen, and the drop in energy forms ATP directly."
      option_explanations:
        - |
          Correct. ATP synthase is a rotary motor: facilitated diffusion of H⁺ down its gradient (exergonic) is coupled to the endergonic synthesis of ATP through mechanical shape changes in the catalytic subunits.
        - |
          NADH is oxidised by complex I, not by ATP synthase, and there is no direct hydrolysis of NADH to make ATP. The link between NADH and ATP is the proton gradient.
        - |
          Pumping protons out is the job of the chain complexes and consumes energy. ATP synthase works in the opposite direction, letting protons back in and harvesting the energy of their return.
        - |
          No electrons pass through ATP synthase, and no ATP is made directly from electron transfer. The chain builds a gradient; the synthase spends it.
      answer: 0
      explanation: |
        Think of two machines: the chain is a pump that stores energy as a gradient, and the synthase is a turbine that converts the gradient to ATP. Separating them is what uncouplers do.

    - slug: u03-w11-q05
      type: multiple_choice
      topic_code: "3.5"
      source: "Biology 2e §7.4 Oxidative Phosphorylation"
      points: 1
      prompt: |
        Dinitrophenol (DNP) carries protons freely across the inner mitochondrial membrane. A person who takes DNP consumes oxygen at a high rate, loses weight and runs a dangerous fever. Which explanation accounts for all three observations?
      options:
        - "DNP dissipates the proton gradient, so ATP synthesis falls; the cell oxidises more fuel and consumes more O₂ trying to restore ATP, and the energy that would have made ATP is released as heat."
        - "DNP blocks complex IV, so oxygen cannot be consumed and heat builds up in the blood."
        - "DNP inhibits glycolysis, forcing the cell to burn fat for heat."
        - "DNP is itself a high-energy fuel that the cell burns rapidly."
      option_explanations:
        - |
          Correct. An uncoupler separates electron transport from phosphorylation: the chain runs faster than ever (high O₂ use, fuel stores burned) but the gradient leaks away as heat instead of turning ATP synthase.
        - |
          Blocking complex IV would stop oxygen consumption, the opposite of what is observed. The chain is running; what is missing is the gradient that couples it to ATP.
        - |
          Glycolysis is not DNP's target, and burning fat "for heat" skips the mechanism: fat is still oxidised through the chain, and the heat comes from the uncoupled gradient.
        - |
          DNP is not metabolised for energy; it shuttles protons. The fuel being burned is the person's own glycogen and fat.
      answer: 0
      explanation: |
        Uncouplers are the clearest evidence that the gradient, not the electron flow itself, is what makes ATP. Brown fat uses a natural uncoupler protein for exactly this heat.

    - slug: u03-w11-q06
      type: multiple_choice
      topic_code: "3.5"
      source: "Biology 2e §7.4 Oxidative Phosphorylation"
      points: 1
      prompt: |
        Cyanide binds complex IV and prevents it from passing electrons to oxygen. Which set of consequences follows most directly?
      options:
        - "Every carrier upstream becomes stuck in its reduced form, proton pumping stops, the gradient collapses, ATP synthase halts, and NADH cannot be reoxidised, so the citric acid cycle stops as well."
        - "Electrons are diverted to complex II, and ATP production continues at a reduced rate."
        - "Oxygen accumulates in the matrix and oxidises the citric acid cycle enzymes."
        - "Glycolysis stops first, because it is the stage that depends on oxygen."
      option_explanations:
        - |
          Correct. The chain is a one-way bucket brigade; block the last hand-off and the whole line fills. Because the matrix NADH pool is no longer regenerated, the NAD⁺-dependent steps upstream stop too, and only fermentation remains.
        - |
          Complex II is an entry point, not an exit; its electrons also must pass complex IV to reach oxygen. There is no bypass around the block.
        - |
          Oxygen is not consumed, so it is present, but O₂ does not spontaneously attack the cycle's enzymes; the damage is energetic, not oxidative. Cells die for lack of ATP.
        - |
          Glycolysis is the one stage that does not need oxygen and keeps running, with fermentation regenerating its NAD⁺. It is the last stage to stop, not the first.
      answer: 0
      explanation: |
        Trace the dependency chain backwards: no acceptor, no electron flow, no gradient, no ATP, no NAD⁺, no cycle. A poison at the end of the chain shuts down everything that feeds it.

    - slug: u03-w11-q07
      type: multiple_choice
      topic_code: "3.5"
      source: "Biology 2e §7.5 Metabolism without Oxygen"
      points: 1
      prompt: |
        Muscle cells working harder than their oxygen supply allows convert pyruvate to lactate. What is the purpose of this reaction?
      options:
        - "To regenerate NAD⁺ from NADH so that glycolysis can continue producing ATP by substrate-level phosphorylation."
        - "To produce additional ATP from pyruvate without using oxygen."
        - "To store energy in lactate for later use by the muscle."
        - "To remove pyruvate, which is toxic to muscle cells."
      option_explanations:
        - |
          Correct. Glycolysis needs NAD⁺ at the G3P dehydrogenase step. With the chain stalled, NADH would accumulate and glycolysis would stop within seconds; passing the electrons onto pyruvate frees NAD⁺ and keeps the 2 ATP per glucose coming.
        - |
          The lactate step makes no ATP. The only ATP in fermentation is glycolysis's own net 2, which the lactate step merely permits to continue.
        - |
          Lactate still holds most of glucose's energy, but the muscle cannot use it; lactate is exported to the liver, where it is converted back to pyruvate or glucose when oxygen is available.
        - |
          Pyruvate is a normal intermediate, not a toxin. It is lactate, and the accompanying H⁺, that accumulate; the cell accepts that cost for the NAD⁺.
      answer: 0
      explanation: |
        Fermentation is not an energy-producing pathway; it is a bookkeeping fix that lets the one anaerobic energy-producing pathway keep running. The product is waste.

    - slug: u03-w11-q08
      type: multiple_choice
      topic_code: "3.5"
      source: "Biology 2e §7.5 Metabolism without Oxygen"
      points: 1
      prompt: |
        A student seals yeast with glucose in one balloon-topped flask and a muscle-cell culture with glucose in another, both without oxygen. Only the yeast flask's balloon inflates. Which explanation is correct?
      options:
        - "Yeast performs alcohol fermentation, which releases CO₂ when pyruvate is decarboxylated to acetaldehyde; lactic acid fermentation in muscle releases no gas."
        - "Muscle cells do not ferment; they simply stop metabolising without oxygen."
        - "Yeast cells respire aerobically using oxygen dissolved in the medium, producing CO₂, whereas muscle cells cannot."
        - "The gas from the yeast is oxygen, released by the breakdown of glucose."
      option_explanations:
        - |
          Correct. The two fermentations differ in whether a carbon is lost: yeast removes CO₂ from pyruvate before reducing the fragment to ethanol; muscle reduces pyruvate directly to lactate, keeping all three carbons.
        - |
          Muscle cells ferment vigorously under these conditions, making lactate; they just do so without producing a gas, so the balloon stays flat.
        - |
          Dissolved oxygen would be exhausted in minutes and would be available to both flasks equally. The sustained gas production is the signature of alcohol fermentation, not aerobic respiration.
        - |
          Oxygen is never released by any form of glucose breakdown; only photosynthesis produces O₂. The gas is CO₂, as a lime-water test would show.
      answer: 0
      explanation: |
        Same purpose (regenerate NAD⁺), different chemistry: decarboxylate then reduce (ethanol plus CO₂) versus reduce directly (lactate). The CO₂ is why bread rises.

    - slug: u03-w11-q09
      type: multiple_choice
      topic_code: "3.5"
      source: "Biology 2e §7.7 Regulation of Cellular Respiration"
      points: 1
      prompt: |
        Citrate, the first product of the citric acid cycle, is an allosteric inhibitor of phosphofructokinase in the cytosol. What does this regulatory link accomplish?
      options:
        - "When the citric acid cycle is backed up and citrate accumulates, glycolysis slows, so the cell stops feeding pyruvate into a pathway that is already saturated."
        - "When citrate is high, glycolysis speeds up to provide more acetyl CoA for the cycle."
        - "Citrate blocks the entry of glucose into the cell through GLUT transporters."
        - "Citrate competes with fructose 6-phosphate for the active site of phosphofructokinase."
      option_explanations:
        - |
          Correct. Citrate is a signal that the downstream pathway has enough substrate. Inhibiting the committed step upstream matches the supply of pyruvate to the cycle's capacity, a feedback loop spanning two compartments.
        - |
          Citrate inhibits phosphofructokinase; high citrate slows glycolysis. Speeding it up would deepen the backlog it signals.
        - |
          GLUT transporters are regulated by insulin and tissue type, not by citrate, and citrate's target is an enzyme of glycolysis inside the cell.
        - |
          Citrate binds an allosteric site, not the active site, so the inhibition is noncompetitive in character and is not overcome by more substrate.
      answer: 0
      explanation: |
        Respiration is regulated at its committed steps by the molecules that report its status: ATP, AMP, NADH and citrate. Each control point is week 8's allosteric regulation with a specific messenger.

    - slug: u03-w11-q10
      type: multiple_choice
      topic_code: "3.5"
      source: "Biology 2e §7.1 Energy in Living Systems"
      points: 1
      stimulus: |
        In AP Investigation 6, students built respirometers: sealed vials containing a sample, a layer of cotton soaked in potassium hydroxide (KOH) solution, and a graduated pipette through the stopper. Each vial was submerged in a water bath and the position of a water droplet in the pipette was read every 5 minutes. Three samples were run at each of two temperatures. Readings are the volume change in mL (cumulative, mean of three vials).

        | Sample | Temperature | 0 min | 5 min | 10 min | 15 min | 20 min |
        |---|---|---|---|---|---|---|
        | Germinating peas | 25 °C | 0.00 | 0.21 | 0.42 | 0.64 | 0.85 |
        | Dry peas + glass beads | 25 °C | 0.00 | 0.03 | 0.06 | 0.08 | 0.11 |
        | Glass beads only | 25 °C | 0.00 | 0.01 | 0.02 | 0.02 | 0.03 |
        | Germinating peas | 10 °C | 0.00 | 0.09 | 0.19 | 0.28 | 0.38 |
        | Dry peas + glass beads | 10 °C | 0.00 | 0.02 | 0.03 | 0.04 | 0.05 |
        | Glass beads only | 10 °C | 0.00 | 0.00 | 0.01 | 0.01 | 0.02 |
      prompt: |
        Why is KOH included in each respirometer, and what does the movement of the water droplet therefore measure?
      options:
        - "KOH absorbs the CO₂ the peas release, so the only net gas change is the O₂ they consume, and the droplet moves in proportion to oxygen uptake."
        - "KOH supplies oxygen to the peas, and the droplet measures how much they take up."
        - "KOH kills microorganisms on the peas so that only pea respiration is measured."
        - "KOH dissolves the pea seed coats so that gas can escape, and the droplet measures CO₂ release."
      option_explanations:
        - |
          Correct. Respiration consumes O₂ and releases roughly equal volumes of CO₂, so with no absorbent the net volume change would be near zero. KOH converts CO₂ to solid potassium carbonate, unmasking the O₂ consumption.
        - |
