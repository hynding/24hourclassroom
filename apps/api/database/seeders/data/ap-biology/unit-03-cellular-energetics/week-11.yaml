    - slug: u03-w11-q15
      type: multiple_choice
      topic_code: "2.5"
      source: "Biology 2e §7.4 Oxidative Phosphorylation"
      points: 1
      prompt: |
        Review. Protons move through ATP synthase from the intermembrane space into the matrix, and they are moved from the matrix into the intermembrane space by the electron transport chain. Which classification of these two movements is correct?
      options:
        - "Movement through ATP synthase is facilitated diffusion down the gradient (passive); movement by the chain is active transport against the gradient, powered by the energy of electron transfer."
        - "Both are active transport, because both involve membrane proteins."
        - "Both are simple diffusion through the lipid bilayer."
        - "Movement through ATP synthase is active transport, because it produces ATP."
      option_explanations:
        - |
          Correct. Unit 2's rules apply: passive transport goes down a gradient and releases free energy (here captured as ATP); active transport goes up a gradient and requires an energy input (here the redox energy of electrons falling toward oxygen).
        - |
          Involving a protein does not make transport active. Direction relative to the gradient does; protons through the synthase are moving downhill.
        - |
          Protons cross the lipid bilayer so slowly that the gradient can be maintained; both movements require protein channels or pumps.
        - |
          Producing ATP is the consequence of the downhill flow, not evidence of energy input. The synthase is a channel coupled to an enzyme, not a pump.
      answer: 0
      explanation: |
        Chemiosmosis is membrane transport from Unit 2 turned into an energy source: the chain does active transport, and the synthase lets the resulting gradient run back down through a turbine.

    - slug: u03-w11-q16
      type: multiple_choice
      topic_code: "3.3"
      source: "Biology 2e §7.4 Oxidative Phosphorylation"
      points: 1
      prompt: |
        Review. Complete oxidation of a mole of glucose releases about 686 kcal, yet a cell captures only about 234 kcal of it in ATP. What becomes of the rest, and which law explains it?
      options:
        - "It is released as heat; the second law of thermodynamics says no energy transformation is completely efficient."
        - "It is destroyed; the first law allows small losses in biological systems."
        - "It remains stored in CO₂ and water, the products of respiration."
        - "It is converted to mass, so respiring cells slowly gain weight."
      option_explanations:
        - |
          Correct. About 34% ends up in ATP and 66% leaves as heat, which in mammals keeps the body warm and in all organisms raises the entropy of the surroundings. Every transfer in the course pays this tax.
        - |
          The first law forbids destruction of energy in any amount. The unaccounted energy has not vanished; it has become heat.
        - |
          CO₂ and water are the low-energy, fully oxidised end products; they hold almost no extractable free energy, which is why they are the end of the line.
        - |
          Mass-energy conversion is irrelevant at the scale of chemistry. Respiring cells lose mass as CO₂ and water leave.
      answer: 0
      explanation: |
        34% is high for an engine and low for a dream. Expect a question that asks you to name the law and the fate of the missing energy.

