    - slug: u03-w11-q18
      type: multi_select
      topic_code: "2.3"
      source: "Biology 2e §7.4 Oxidative Phosphorylation"
      points: 2
      partial_credit: true
      prompt: |
        Review. Which structural features of the inner mitochondrial membrane are necessary for chemiosmosis to work? Select all that apply.
      options:
        - "A phospholipid bilayer that is nearly impermeable to H⁺, so a proton gradient can be held."
        - "Embedded protein complexes that span the membrane and can move protons across it."
        - "Extensive folding into cristae, increasing the area available for chains and synthases."
        - "Large pores that allow protons and other ions to pass freely in both directions."
        - "A high proportion of cholesterol to make the membrane rigid."
      option_explanations:
        - |
          Correct. If protons could slip back through the lipid, the gradient would never build; uncouplers cause exactly that leak, and ATP synthesis stops.
        - |
          Correct. The chain complexes and ATP synthase are integral membrane proteins; pumping across a membrane requires a protein that reaches both sides.
        - |
          Correct. Surface area limits the number of complexes; cristae pack more membrane into the organelle, which is why energy-hungry cells have densely folded mitochondria.
        - |
          Free passage of protons is the definition of an uncoupled membrane. The outer mitochondrial membrane has large pores; the inner one must not, or there would be no gradient.
        - |
          Cholesterol is scarce in mitochondrial inner membranes, which are protein-rich and fluid. Rigidity would hinder the movement of ubiquinone and cytochrome c between complexes.
      answer: [0, 1, 2]
      explanation: |
        Unit 2's fluid mosaic model is what makes a gradient possible: a selectively permeable bilayer, with proteins doing the selecting. Chemiosmosis is that model doing work.

    - slug: u03-w11-q19
      type: true_false
      topic_code: "3.5"
      source: "Biology 2e §7.4 Oxidative Phosphorylation"
      points: 1
      prompt: |
        True or false: Most of the ATP produced in aerobic respiration is made by substrate-level phosphorylation in glycolysis and the citric acid cycle.
      answer: false
      explanation: |
        False. Substrate-level phosphorylation yields only 4 ATP per glucose (2 in glycolysis, 2 in the cycle). The remaining 26 to 28, around 90% of the total, are made by oxidative phosphorylation: the electron transport chain builds a proton gradient and ATP synthase spends it. This is why oxygen matters so much and why fermentation, which keeps only the substrate-level ATP, yields roughly fifteen times less per glucose.

    - slug: u03-w11-q20
      type: true_false
      topic_code: "2.4"
      source: "Biology 2e §7.4 Oxidative Phosphorylation"
      points: 1
      prompt: |
        Review. True or false: Because H⁺ is a small ion, it diffuses freely through the lipid bilayer of the inner mitochondrial membrane, and this free movement is what drives ATP synthase.
      answer: false
      explanation: |
        False. Small size is not enough; charge matters. Ions, including H⁺, cannot cross the nonpolar core of a bilayer at any useful rate, which is the selective permeability rule from Unit 2 (small nonpolar molecules cross freely, ions and large polar molecules need proteins). That impermeability is essential: it is what allows the chain to build a gradient and what forces returning protons through ATP synthase, the one route open to them. A membrane that let protons through freely would be uncoupled and would make no ATP.

    - slug: u03-w11-q21
      type: fill_blank
      topic_code: "3.5"
      source: "Biology 2e §7.5 Metabolism without Oxygen"
      points: 1
      prompt: |
        In the absence of oxygen, fermentation transfers electrons from NADH to pyruvate or acetaldehyde so that ____ is regenerated and glycolysis can continue.
      answer: ["NAD+", "NAD⁺", "NAD"]
      explanation: |
        NAD⁺ is the oxidised carrier that the G3P dehydrogenase step of glycolysis requires. In aerobic cells the electron transport chain reoxidises NADH; without oxygen, fermentation does the job by dumping the electrons onto an organic acceptor. "ATP" is not accepted: fermentation makes no ATP itself, and its purpose is to permit glycolysis's ATP production to continue. "NADH" is the reduced form, the input rather than the product.

    - slug: u03-w11-q22
      type: fill_blank
      topic_code: "2.1"
      source: "Biology 2e §7.4 Oxidative Phosphorylation"
      points: 1
      prompt: |
        Review. The electron transport chain and ATP synthase are embedded in the inner mitochondrial membrane, whose folds, called ____, increase the surface area available for them.
      answer: ["cristae", "crista"]
      explanation: |
        Cristae are the folds of the inner membrane that project into the matrix. The folding is Unit 2's surface-area principle at the level of an organelle: more membrane in the same volume means more chains and more synthases, so more ATP per mitochondrion. "Matrix" is the fluid enclosed by the inner membrane and "thylakoids" are the chloroplast's equivalent folds, so neither is accepted.

    - slug: u03-w11-q23
      type: short_answer
      topic_code: "3.5"
      source: "Biology 2e §7.4 Oxidative Phosphorylation"
      points: 4
      prompt: |
        Conceptual analysis. A mutant yeast strain has an inner mitochondrial membrane that leaks protons at about half the rate that ATP synthase normally passes them. The strain grows on glucose but slowly. (a) Predict how the mutant's rate of oxygen consumption per cell compares with the normal strain's, and (b) justify the prediction. (c) Predict how its ATP yield per glucose compares, and (d) explain why the mutant culture is warmer than a normal culture growing at the same rate.
      answer: |
        Oxygen consumption per cell is higher, because the leak lowers the gradient and ATP, so the chain runs faster (more NADH oxidised, more O₂ reduced) in an attempt to maintain the gradient; ATP yield per glucose is lower, since part of the gradient's energy is dissipated without passing through ATP synthase; the dissipated energy appears as heat, which is why the culture is warmer, the same principle as an uncoupler or brown fat.
      explanation: |
        Four points.

        (a) Predict, 1 pt: O₂ consumption per cell is higher than normal (accept "higher per unit ATP made").

        (b) Justify, 1 pt: the leak dissipates part of the gradient, ATP falls, ADP and NADH signals speed up the chain, and faster electron flow means more electrons delivered to O₂; or, equivalently, the chain is partially uncoupled from ATP synthesis so more fuel must be oxidised per ATP. The link between the leak, the gradient and the chain's rate must be stated.

        (c) Predict, 1 pt: ATP per glucose is lower than the normal roughly 30, because protons that leak through the lipid do no work at ATP synthase; the substrate-level 4 ATP are unaffected.

        (d) Explain, 1 pt: the energy of the gradient that leaks back without driving ATP synthase is released as heat (first law: the energy must go somewhere; second law: a less efficient transformation releases more heat). Accept comparison with DNP or brown-fat thermogenin as support.

        Zero: predicting lower O₂ consumption "because the mitochondria are damaged"; saying ATP yield is unchanged because glycolysis still runs; attributing the warmth to "faster growth" when the prompt states equal growth rates.

    - slug: u03-w11-q24
      type: short_answer
      topic_code: "3.4"
      source: "Biology 2e §8.1 Overview of Photosynthesis"
      points: 4
      prompt: |
        Review. Conceptual analysis. A sealed, lit aquarium contains a water plant and a fish, and dissolved O₂ and CO₂ are stable over a 24-hour cycle. (a) Describe the flow of carbon atoms between the plant and the fish over one day, naming the process that moves carbon in each direction. (b) Describe the flow of energy into and out of the aquarium. (c) Explain why the two flows are different in kind, and (d) predict what happens to dissolved O₂ during the night and why.
      answer: |
        Carbon cycles: photosynthesis in the plant fixes CO₂ (from fish and plant respiration) into sugar; respiration in the fish and in the plant returns it as CO₂. Energy flows one way: in as light, captured as chemical energy in sugar, released as ATP and then heat by both organisms, and lost from the system as heat. Matter is conserved and recycled while energy is transformed and degraded (first and second laws). At night photosynthesis stops but both organisms respire, so dissolved O₂ falls and CO₂ rises until light returns.
      explanation: |
        Four points.

        (a) Describe, 1 pt: CO₂ from the fish's (and the plant's own) respiration is fixed by the plant's photosynthesis into sugar; sugar eaten by the fish, or respired by the plant, is oxidised back to CO₂. Both processes must be named with the direction of carbon movement.

        (b) Describe, 1 pt: energy enters as light, is converted to chemical energy (sugar, then ATP) by the plant, passes to the fish in food, and leaves both organisms as heat; heat leaves the aquarium through the glass.

        (c) Explain, 1 pt: matter (carbon) is conserved and can be cycled indefinitely; energy is conserved (first law) but each transformation degrades some to heat that cannot be reused (second law), so the system needs continuous light input and energy flows through once. Both laws, or the words "cycles" versus "flows through", should appear.

        (d) Predict and explain, 1 pt: at night O₂ falls (and CO₂ rises) because photosynthesis stops while respiration in both the fish and the plant continues; the plant is a net consumer of O₂ in darkness. A prediction without the plant's respiration mentioned earns the point only if the reasoning is otherwise correct.

        Zero: saying the plant "breathes in CO₂ and breathes out O₂" and stops there; claiming energy is recycled; claiming plants do not respire.

    - slug: u03-w11-q25
      type: long_answer
      topic_code: "3.5"
      source: "general knowledge"
      points: 8
      prompt: |
        Interpreting and evaluating experimental results. A class measured fermentation by yeast at 30 °C. Each tube held the same mass of yeast in a solution of one sugar at the same concentration, sealed with a gas-collecting cap; the volume of gas produced in 20 minutes was recorded. Three trials per sugar.

        | Solution | Trial 1 (mL) | Trial 2 (mL) | Trial 3 (mL) | Mean (mL) |
        |---|---|---|---|---|
        | Glucose | 11.8 | 12.3 | 11.9 | 12.0 |
        | Fructose | 11.0 | 11.6 | 11.1 | 11.2 |
        | Sucrose | 11.4 | 11.9 | 11.2 | 11.5 |
        | Lactose | 0.4 | 0.2 | 0.3 | 0.3 |
        | Water (no sugar) | 0.3 | 0.1 | 0.2 | 0.2 |

        (a) Identify the gas collected and the reaction that produces it. Explain why the yeast must ferment in this set-up rather than respire aerobically after the first few minutes.
        (b) Describe the pattern in the means and state what the water tube shows.
        (c) The lactose result is indistinguishable from water. Propose an explanation at the level of enzymes, and describe an experiment that would test it.
        (d) A student argues that sucrose "must be a worse fuel than glucose" because its mean is lower. Evaluate the argument using the trial values, and state what the comparison would need in order to be convincing.
      answer: |
        The gas is CO₂ from the decarboxylation of pyruvate to acetaldehyde in alcohol fermentation; the sealed tube's oxygen is exhausted quickly, after which yeast, a facultative anaerobe, must ferment to regenerate NAD⁺. Glucose, fructose and sucrose all gave about 11 to 12 mL; lactose gave about 0.3 mL, no different from the water tube, which shows gas production requires a usable sugar and that the apparatus itself produces negligible gas. Yeast lacks lactase, so it cannot hydrolyse lactose's β-galactosidic bond and the monosaccharides never enter glycolysis; test it by adding purified lactase to a lactose tube (predict gas like glucose) or by using a yeast strain engineered to make lactase. The sucrose argument fails: the trial ranges overlap (sucrose 11.2 to 11.9, glucose 11.8 to 12.3), three trials cannot resolve a 0.5 mL difference, and sucrose provides two hexoses per molecule; a convincing comparison would need more replicates, standard errors or error bars, and equal moles of hexose rather than equal mass.
      explanation: |
        Eight points.

        (a) 2 pts: 1 pt for CO₂ released when pyruvate is decarboxylated to acetaldehyde (then reduced to ethanol) in alcohol fermentation; 1 pt for the reason: the tube is sealed, dissolved and headspace O₂ is used up in minutes by aerobic respiration, and after that only fermentation can regenerate NAD⁺ so glycolysis continues. Naming yeast as a facultative anaerobe is a bonus, not required.

        (b) 1 pt: glucose, fructose and sucrose produced similar large volumes (about 11 to 12 mL), lactose produced almost none (0.3 mL), equal to the no-sugar control; the water tube shows that without a fermentable sugar the apparatus and the yeast alone produce negligible gas, so the gas in the other tubes is from sugar metabolism.

        (c) 3 pts: 1 pt for the explanation: yeast lacks the enzyme lactase (β-galactosidase) needed to hydrolyse lactose into glucose and galactose, so lactose cannot enter glycolysis; enzyme specificity means the enzymes yeast does have (for sucrose, for example) cannot act on lactose's bond; 1 pt for a test with a manipulation: add purified lactase to a lactose tube, or supply glucose plus galactose instead of lactose, or use a yeast strain that expresses lactase; 1 pt for the prediction and control: the treated tube should produce gas comparable to glucose, while lactose plus heat-denatured lactase (or lactose alone) should remain at the control level. A proposal that only "repeats the experiment" earns no credit for this part.

        (d) 2 pts: 1 pt for using the trials: the individual values overlap (sucrose's highest trial, 11.9, exceeds glucose's lowest, 11.8), and with three trials a 0.5 mL difference in means is within the spread, so the data do not show a real difference; 1 pt for what would be needed: more replicates with standard error or error bars (non-overlapping ±2 SE), and a fair basis of comparison such as equal moles of hexose units, since sucrose yields two monosaccharides per molecule and may even be expected to give more CO₂ per mole. Accept also "a longer run, because the 20-minute volume may reflect hydrolysis speed rather than fuel value".

        Zero for a part: identifying the gas as O₂; saying lactose "has less energy"; evaluating the sucrose claim from the means alone without reference to the spread of trials; a test with no prediction.
