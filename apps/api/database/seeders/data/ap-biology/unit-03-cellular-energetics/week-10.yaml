      points: 1
      prompt: |
        Each turn of the Calvin cycle fixes one CO₂ and uses 3 ATP (2 in the reduction stage, 1 in regeneration) and 2 NADPH. One glucose (six carbons) requires six turns. How many ATP molecules does the Calvin cycle consume to make one glucose?
      answer: { value: 18, tolerance: 0 }
      explanation: |
        Six turns × 3 ATP per turn = 18 ATP. The parallel calculation for NADPH is 6 × 2 = 12. Per three-carbon G3P (three turns) the figures are 9 ATP and 6 NADPH. The numbers are worth knowing because they show why the light reactions must run so much faster than the Calvin cycle: each glucose costs 18 ATP and 12 NADPH to build, and respiration recovers only about 30 ATP from it, with the difference reflecting the inefficiency that the second law demands.

