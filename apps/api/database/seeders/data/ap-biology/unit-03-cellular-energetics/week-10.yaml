week: 10
unit: 3
title: The Calvin Cycle and the First Stages of Respiration
topics: ["3.4", "3.5"]
guide: guides/week-10.md
guide_description: |
  Photosynthesis part two: the Calvin cycle in the stroma, RuBisCO, the three stages (fixation, reduction,
  regeneration), the ATP and NADPH budget, and why the "light-independent" reactions stop in the dark. Then
  respiration part one: glycolysis in the cytosol, the energy-investment and payoff phases, phosphofructokinase as
  the gatekeeper, pyruvate oxidation, and the citric acid cycle in the matrix, with a running account of where
  every carbon and every electron goes. Three worked examples (a Calvin-cycle budget, carbon accounting through
  respiration, a carbon-14 tracer experiment), misconceptions, self-check.
flashcards_description: |
  32 cards: the Calvin cycle step by step, how the two stages of photosynthesis depend on each other, and the inputs, outputs and regulation of glycolysis, pyruvate oxidation and the citric acid cycle.

flashcards:
  - front: Calvin cycle → where it runs and what it needs
    back: |
      In the stroma of the chloroplast. It needs CO₂, plus the ATP and NADPH made by the light reactions, and returns ADP, Pi and NADP⁺ to them. Its product is the three-carbon sugar G3P.
    topic_code: "3.4"
  - front: The three stages of the Calvin cycle
    back: |
      1. Carbon fixation: RuBisCO attaches CO₂ to RuBP (5 C), which splits into two 3-PGA (3 C each). 2. Reduction: ATP and NADPH convert 3-PGA to G3P. 3. Regeneration: ATP rearranges five G3P back into three RuBP so the cycle can continue.
    hint: Fix, reduce, regenerate.
    topic_code: "3.4"
  - front: RuBisCO
    back: |
      Ribulose bisphosphate carboxylase/oxygenase, the enzyme that fixes CO₂ onto RuBP. Probably the most abundant protein on Earth; slow, and able to bind O₂ by mistake (photorespiration), which is why plants make so much of it.
    topic_code: "3.4"
  - front: RuBP, 3-PGA and G3P → carbon counts and roles
    back: |
      RuBP (ribulose bisphosphate) is the 5-carbon acceptor of CO₂. 3-PGA (3-phosphoglycerate) is the first stable 3-carbon product of fixation. G3P (glyceraldehyde 3-phosphate) is the 3-carbon sugar made by reduction, the cycle's export and the raw material for glucose.
    topic_code: "3.4"
  - front: Why is G3P, not glucose, the product of the Calvin cycle?
    back: |
      The cycle makes three-carbon G3P. Two G3P leaving the cycle are joined to make one glucose outside it; G3P is also the starting point for sucrose, starch, cellulose, fatty acids and amino acids.
    topic_code: "3.4"
  - front: Calvin cycle budget for one G3P exported
    back: |
      Three turns: 3 CO₂ fixed onto 3 RuBP, giving 6 3-PGA; 6 ATP and 6 NADPH reduce them to 6 G3P; 1 G3P leaves and 5 G3P are rebuilt into 3 RuBP using 3 more ATP. Total 9 ATP and 6 NADPH per G3P, so 18 ATP and 12 NADPH per glucose.
    hint: Three turns, nine ATP, six NADPH.
    topic_code: "3.4"
  - front: Why do the "light-independent" reactions stop in the dark?
    back: |
      They do not use light directly, but they consume ATP and NADPH that only the light reactions make. In darkness those run out within seconds, 3-PGA cannot be reduced, RuBP is not regenerated and the cycle halts.
    topic_code: "3.4"
  - front: What happens to the Calvin cycle intermediates when CO₂ is removed in the light?
    back: |
      RuBP accumulates (nothing to fix it to) and 3-PGA falls (it is still reduced and recycled but not replaced). The reverse pattern, 3-PGA up and RuBP down, means ATP and NADPH ran out, as when the light is switched off.
    topic_code: "3.4"
  - front: Photorespiration
    back: |
      RuBisCO binding O₂ instead of CO₂, which wastes RuBP and releases CO₂ without making sugar. O₂ competes with CO₂ for the same active site, so it is worst when CO₂ is low and O₂ high, as on hot days with stomata closed.
    topic_code: "3.4"
  - front: How do the two stages of photosynthesis depend on each other?
    back: |
      The light reactions supply ATP and NADPH; the Calvin cycle returns ADP, Pi and NADP⁺. Without CO₂ fixation the acceptors are not regenerated and the light reactions back up; without light the Calvin cycle starves. O₂ output tracks sugar output for this reason.
    topic_code: "3.4"
  - front: Cellular respiration → overall equation and the point of it
    back: |
      C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + energy (ATP and heat). It is the controlled oxidation of glucose, releasing energy in small steps that are captured as ATP rather than lost in one burst.
    topic_code: "3.5"
  - front: The four stages of aerobic respiration and where each happens
    back: |
      Glycolysis (cytosol); pyruvate oxidation (mitochondrial matrix); citric acid cycle (matrix); oxidative phosphorylation, that is the electron transport chain and chemiosmosis (inner mitochondrial membrane). Prokaryotes do the last on the plasma membrane.
    topic_code: "3.5"
  - front: Glycolysis → inputs and outputs per glucose
    back: |
      In: 1 glucose, 2 ATP (invested), 2 NAD⁺, 4 ADP + 4 Pi. Out: 2 pyruvate (3 C each), 4 ATP (net 2), 2 NADH. No oxygen is used and no CO₂ is released.
    hint: Six carbons in, two threes out, net two ATP.
    topic_code: "3.5"
  - front: Energy-investment phase of glycolysis
    back: |
      The first five steps spend 2 ATP to phosphorylate glucose twice (hexokinase, then phosphofructokinase), making fructose 1,6-bisphosphate, which aldolase splits into two 3-carbon sugars that are both converted to G3P. Investment makes the sugar unstable and traps it in the cell.
    topic_code: "3.5"
  - front: Energy-payoff phase of glycolysis
    back: |
      Each G3P is oxidised (NAD⁺ → NADH) and phosphorylated, then two substrate-level phosphorylations per G3P hand phosphates to ADP, giving pyruvate. Per glucose: 4 ATP and 2 NADH out, for a net of 2 ATP.
    topic_code: "3.5"
  - front: Hexokinase → what its step accomplishes
    back: |
      It phosphorylates glucose to glucose 6-phosphate using ATP. The charged phosphate keeps the sugar from leaving through the membrane and commits it to metabolism. Inhibited by its own product.
    topic_code: "3.5"
  - front: Phosphofructokinase → why it is the control point of glycolysis
    back: |
      It catalyses the first committed, irreversible step (fructose 6-phosphate → fructose 1,6-bisphosphate). ATP and citrate inhibit it allosterically; ADP and AMP activate it. So glycolysis speeds up when the cell is short of ATP and slows when ATP is abundant: feedback inhibition.
    topic_code: "3.5"
  - front: Where in respiration is NAD⁺ reduced to NADH?
    back: |
      Once per G3P in glycolysis (2 per glucose), once per pyruvate in pyruvate oxidation (2), and three times per turn of the citric acid cycle (6). Ten NADH per glucose, all headed for the electron transport chain.
    topic_code: "3.5"
  - front: Why is glycolysis evidence for common ancestry?
    back: |
      It occurs in the cytosol of essentially every organism, uses no oxygen and no organelle, and its enzymes are homologous across all domains. The simplest explanation is that it evolved once, in a common ancestor living before oxygen was in the atmosphere.
    topic_code: "3.5"
  - front: Pyruvate oxidation → the three things that happen to each pyruvate
    back: |
      A carboxyl group leaves as CO₂ (the first carbon of glucose lost); the remaining 2-carbon fragment is oxidised, reducing NAD⁺ to NADH; and the acetyl group is attached to coenzyme A, giving acetyl CoA. Happens in the matrix after pyruvate is transported in.
    topic_code: "3.5"
  - front: Acetyl CoA
    back: |
      A two-carbon acetyl group carried by coenzyme A. It is the entry molecule of the citric acid cycle, delivering its acetyl group to oxaloacetate, and the common funnel for carbohydrate, fat and some amino-acid breakdown.
    topic_code: "3.5"
  - front: Citric acid cycle → inputs and outputs per turn
    back: |
      In: 1 acetyl CoA (2 C), 3 NAD⁺, 1 FAD, 1 ADP or GDP. Out: 2 CO₂, 3 NADH, 1 FADH₂, 1 ATP (or GTP), and the regenerated 4-carbon oxaloacetate. Two turns per glucose.
    hint: Two carbons in, two CO₂ out, four carriers loaded.
    topic_code: "3.5"
  - front: Why is the citric acid cycle a cycle?
    back: |
      The 4-carbon oxaloacetate that accepts the acetyl group at the start is regenerated at the end, so a small amount of it can process an unlimited supply of acetyl CoA. The carbons released as CO₂ in a given turn are not the ones that entered that turn.
    topic_code: "3.5"
  - front: Where does the CO₂ you exhale come from?
    back: |
      Two carbons per glucose leave during pyruvate oxidation and four during the two turns of the citric acid cycle. None is released in glycolysis or the electron transport chain. The oxygen you inhale does not become CO₂; it becomes water.
    topic_code: "3.5"
  - front: Tally of carriers and ATP per glucose through the citric acid cycle
    back: |
      Glycolysis: 2 ATP net, 2 NADH. Pyruvate oxidation: 2 NADH. Citric acid cycle: 2 ATP, 6 NADH, 2 FADH₂. Running total: 4 ATP by substrate-level phosphorylation, 10 NADH, 2 FADH₂, all six carbons gone as CO₂.
    topic_code: "3.5"
  - front: Mitochondrion → matrix, inner membrane, cristae, intermembrane space
    back: |
      The matrix is the inner fluid, home of pyruvate oxidation and the citric acid cycle. The inner membrane, folded into cristae for surface area, holds the electron transport chain and ATP synthase. The intermembrane space, between the two membranes, is where protons are pumped.
    topic_code: "3.5"
  - front: Regulation of the citric acid cycle
    back: |
      Isocitrate dehydrogenase and α-ketoglutarate dehydrogenase slow when ATP and NADH are plentiful and speed up when ADP rises. Pyruvate dehydrogenase, upstream, is inhibited by acetyl CoA and NADH. The cycle runs at the rate the cell's energy demand sets.
    topic_code: "3.5"
  - front: How do fats enter respiration?
    back: |
      Triglycerides are hydrolysed to glycerol, which is converted to G3P and enters glycolysis, and fatty acids, which beta-oxidation in the matrix chops into 2-carbon acetyl CoA units that enter the citric acid cycle. A fatty acid yields many acetyl CoA and many NADH and FADH₂.
    topic_code: "3.5"
  - front: How do proteins enter respiration?
    back: |
      Amino acids are deaminated (the amino group removed, converted to ammonia and then urea in the liver); the carbon skeletons enter as pyruvate, acetyl CoA or citric acid cycle intermediates depending on the amino acid.
    topic_code: "3.5"
  - front: Why are metabolic pathways described as porous?
    back: |
      Intermediates of glycolysis and the citric acid cycle are drawn off to build amino acids, fatty acids and nucleotides, and sugars, fats and proteins all feed in at different points. The pathways are a network, not sealed pipes.
    topic_code: "3.5"
  - front: Compare the carbon flow of photosynthesis and respiration
    back: |
      Photosynthesis reduces CO₂ to sugar using electrons from water, storing energy. Respiration oxidises sugar back to CO₂, passing the electrons to oxygen and releasing the energy. The atoms cycle; the energy flows through once, ending as heat.
    topic_code: "3.5"
  - front: Carbon-14 tracer logic → how to read a labelling experiment
    back: |
      Supply a labelled reactant, sample at intervals, and see which compounds carry the label and in what order. The first labelled compound is the first product; where the label appears later tells you the pathway. Calvin used ¹⁴CO₂ this way to find 3-PGA.
    topic_code: "3.4"

quiz:
  description: |
    25 questions · about 32 minutes · the Calvin cycle, glycolysis, pyruvate oxidation and the citric acid cycle,
    with a carbon-14 tracer data set in the Calvin style, plus spiral review of carbohydrates, lipids, mitochondrial
    structure and surface area from Units 1 and 2, and enzymes, inhibition and free energy from earlier in this
    unit. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items
    are matched automatically; the two short answers and the long answer are graded by your teacher against the
    acceptable-answer summary.
  questions:
    - slug: u03-w10-q01
      type: multiple_choice
      topic_code: "3.4"
      source: "Biology 2e §8.3 Using Light Energy to Make Organic Molecules"
      points: 1
      prompt: |
        Which statement correctly describes the first step of the Calvin cycle?
      options:
        - "RuBisCO attaches a CO₂ molecule to the five-carbon RuBP, producing an unstable six-carbon compound that immediately splits into two molecules of 3-PGA."
        - "RuBisCO splits CO₂ into carbon and oxygen, releasing the oxygen as O₂."
        - "ATP synthase phosphorylates CO₂ to activate it for fixation."
        - "NADPH reduces CO₂ directly to glucose in a single step."
      option_explanations:
        - |
          Correct. Carbon fixation is the covalent attachment of inorganic CO₂ to an organic acceptor. The six-carbon intermediate is so unstable it is never isolated; the two 3-PGA are the first stable products.
        - |
          CO₂ is never split in photosynthesis. The O₂ released comes from water in the light reactions; the carbon and both oxygens of CO₂ end up in sugar and water.
        - |
          ATP synthase makes ATP from ADP using a proton gradient; it does not act on CO₂. ATP is used later in the cycle, to phosphorylate 3-PGA and to regenerate RuBP.
        - |
          Reduction of fixed carbon to G3P takes ATP as well as NADPH and happens after fixation; glucose is assembled from two G3P outside the cycle. There is no single-step route from CO₂ to glucose.
      answer: 0
      explanation: |
        Fixation first, reduction second, regeneration third. The exam expects the carbon counts: 5 + 1 → 6 → 3 + 3.

    - slug: u03-w10-q02
      type: multiple_choice
      topic_code: "3.4"
      source: "Biology 2e §8.3 Using Light Energy to Make Organic Molecules"
      points: 1
      prompt: |
        After three turns of the Calvin cycle, six molecules of G3P have been made. Why does only one of them leave the cycle to become sugar?
      options:
        - "Five G3P (15 carbons) must be rearranged into three RuBP (15 carbons) so the cycle can accept the next three CO₂; the sixth G3P is the net gain from the three carbons fixed."
        - "Five G3P are broken down to release the ATP needed for the next turn."
        - "Five G3P are oxidised back to CO₂ in photorespiration."
        - "Only one G3P is reduced enough to count as a sugar; the others are still 3-PGA."
      option_explanations:
        - |
          Correct. The carbon arithmetic closes: three CO₂ in, three carbons out as one G3P, and the fifteen carbons of the three RuBP are returned to their starting state using three ATP.
        - |
          The Calvin cycle consumes ATP; it never produces it. The ATP for the next turn comes from the light reactions, not from G3P.
        - |
          Photorespiration is a wasteful side reaction of RuBisCO with O₂, not part of the normal cycle's accounting. Regeneration conserves the carbons; it does not lose them.
        - |
          All six G3P are fully reduced sugars; the difference is fate, not chemistry. Five are spent regenerating the acceptor so the cycle can continue.
      answer: 0
      explanation: |
        The cycle is a carbon-conserving loop: to keep running it must rebuild its acceptor. That is why nine ATP and six NADPH buy only one three-carbon sugar.

    - slug: u03-w10-q03
      type: multiple_choice
      topic_code: "3.4"
      source: "Biology 2e §8.3 Using Light Energy to Make Organic Molecules"
      points: 1
      prompt: |
        The Calvin cycle is often called the light-independent reactions, yet in a leaf it stops within seconds of darkness. Which explanation is correct?
      options:
        - "The cycle depends on a steady supply of ATP and NADPH from the light reactions, which are exhausted almost at once when light stops."
        - "RuBisCO is a light-activated enzyme that unfolds in darkness."
        - "CO₂ cannot enter leaves in the dark because the stomata are closed."
        - "The cycle is actually the light reactions under another name."
      option_explanations:
        - |
          Correct. "Light-independent" means light is not a reactant, not that the cycle can run without the light reactions' products. The reduction step needs both carriers continuously.
        - |
          RuBisCO is regulated, but it does not denature in the dark; it is present and folded at night. The limitation is on its downstream steps, which need ATP and NADPH.
        - |
          Stomatal closure takes minutes and is not universal; and a leaf in darkness with its stomata held open still stops fixing carbon. The problem is energy, not CO₂.
        - |
          The light reactions and the Calvin cycle are separate processes in separate compartments (thylakoid membrane versus stroma). They are linked by what one makes and the other uses.
      answer: 0
      explanation: |
        The two stages are coupled by ATP and NADPH going one way and ADP and NADP⁺ returning. Remove either stage and the other stalls; the leaf disk assay and the tracer data both show it.

    - slug: u03-w10-q04
      type: multiple_choice
      topic_code: "3.4"
      source: "Biology 2e §8.3 Using Light Energy to Make Organic Molecules"
      points: 1
      stimulus: |
        In a classic experiment, the green alga Chlorella was grown in bright light with a steady supply of CO₂ and the concentrations of two Calvin cycle intermediates were measured. The light was then switched off (CO₂ still supplied) and the culture sampled 30 seconds later. In a separate run, the light was left on but CO₂ was removed, and the culture was again sampled 30 seconds later. Concentrations are relative to the steady state.

        | Condition | RuBP | 3-PGA |
        |---|---|---|
        | Light on, CO₂ supplied (steady state) | 1.0 | 1.0 |
        | 30 s after light switched off, CO₂ still supplied | 0.2 | 2.4 |
        | 30 s after CO₂ removed, light still on | 2.6 | 0.3 |
      prompt: |
        Which explanation best accounts for the changes when the light was switched off?
      options:
        - "Without ATP and NADPH, 3-PGA could not be reduced to G3P, so it accumulated; and because no G3P was made, RuBP could not be regenerated, so the remaining RuBP was used up by fixation."
        - "Darkness stops RuBisCO, so 3-PGA built up from an alternative pathway while RuBP was broken down to release energy."
        - "In the dark the cells switched to respiration, which converts RuBP into 3-PGA."
        - "The measurements are reversed: RuBP should have risen because fixation stopped."
      option_explanations:
        - |
          Correct. Fixation continued briefly (CO₂ was present and RuBisCO needs no ATP), draining RuBP into 3-PGA, while the reduction step and the regeneration step, both ATP-dependent, halted.
        - |
          RuBisCO does not require light and kept working while RuBP lasted. The 3-PGA that accumulated came from that fixation, not from an alternative route, and RuBP is not an energy store.
        - |
          Respiration runs in the mitochondria on sugars; it does not act on Calvin cycle intermediates in the stroma. The pattern is explained within the cycle itself.
        - |
          The data are consistent: fixation went on for a short time after the light went off because CO₂ and RuBP were still there, so RuBP fell. It is CO₂ removal, not darkness, that makes RuBP rise.
      answer: 0
      explanation: |
        Ask of each intermediate: what makes it and what uses it? Darkness removes the maker of G3P and the regenerator of RuBP but not the fixer of CO₂, so 3-PGA piles up and RuBP drains.

    - slug: u03-w10-q05
      type: multiple_choice
      topic_code: "3.4"
      source: "Biology 2e §8.3 Using Light Energy to Make Organic Molecules"
      points: 1
      stimulus: |
        In a classic experiment, the green alga Chlorella was grown in bright light with a steady supply of CO₂ and the concentrations of two Calvin cycle intermediates were measured. The light was then switched off (CO₂ still supplied) and the culture sampled 30 seconds later. In a separate run, the light was left on but CO₂ was removed, and the culture was again sampled 30 seconds later. Concentrations are relative to the steady state.

        | Condition | RuBP | 3-PGA |
        |---|---|---|
        | Light on, CO₂ supplied (steady state) | 1.0 | 1.0 |
        | 30 s after light switched off, CO₂ still supplied | 0.2 | 2.4 |
        | 30 s after CO₂ removed, light still on | 2.6 | 0.3 |
      prompt: |
        When CO₂ was removed in the light, RuBP rose to 2.6 and 3-PGA fell to 0.3. Which explanation is best supported?
      options:
        - "With no CO₂ to fix, RuBP was no longer consumed but continued to be regenerated from the existing 3-PGA, which the still-abundant ATP and NADPH reduced and recycled."
        - "Without CO₂ the light reactions stopped, so RuBP accumulated because it needs NADPH to break down."
        - "CO₂ removal denatured RuBisCO, which released its bound RuBP."
        - "The cells converted 3-PGA directly into RuBP by adding CO₂ from an internal store."
      option_explanations:
        - |
          Correct. ATP and NADPH were plentiful, so every remaining 3-PGA was reduced and the resulting G3P rebuilt into RuBP; nothing drained RuBP because fixation had nothing to fix.
        - |
          The light reactions do slow when the Calvin cycle stalls, but only after the acceptors ADP and NADP⁺ stop returning; RuBP does not need NADPH to be consumed. Its consumer is CO₂ fixation.
        - |
          Lack of substrate does not unfold an enzyme. RuBisCO sat idle with its active site empty; the RuBP accumulated in solution because nothing used it.
        - |
          Converting 3-PGA to RuBP removes carbon (five G3P make three RuBP) rather than adding it; no CO₂ is added in regeneration, and there is no internal CO₂ store.
      answer: 0
      explanation: |
        The two runs are mirror images: remove the energy supply and the reduced intermediate's precursor (3-PGA) accumulates; remove the carbon supply and the acceptor (RuBP) accumulates. Together they map which step depends on what.

    - slug: u03-w10-q06
      type: multiple_choice
      topic_code: "3.4"
      source: "Biology 2e §8.3 Using Light Energy to Make Organic Molecules"
      points: 1
      stimulus: |
        In a classic experiment, the green alga Chlorella was grown in bright light with a steady supply of CO₂ and the concentrations of two Calvin cycle intermediates were measured. The light was then switched off (CO₂ still supplied) and the culture sampled 30 seconds later. In a separate run, the light was left on but CO₂ was removed, and the culture was again sampled 30 seconds later. Concentrations are relative to the steady state.

        | Condition | RuBP | 3-PGA |
        |---|---|---|
        | Light on, CO₂ supplied (steady state) | 1.0 | 1.0 |
        | 30 s after light switched off, CO₂ still supplied | 0.2 | 2.4 |
        | 30 s after CO₂ removed, light still on | 2.6 | 0.3 |
      prompt: |
        A student concludes from this table that "the Calvin cycle requires light". Which evaluation of the conclusion is most accurate?
      options:
        - "The conclusion needs refining: the data show the cycle requires products of the light reactions (ATP and NADPH), not light as a reactant, because fixation itself continued briefly in the dark."
        - "The conclusion is fully supported: 3-PGA rose in the dark, which proves light is a reactant of fixation."
        - "The conclusion is refuted: RuBP fell in the dark, which proves the cycle ran faster without light."
        - "The data cannot bear on the conclusion because the experiment did not measure sugar."
      option_explanations:
        - |
          Correct. RuBP was consumed and 3-PGA produced after the light went off, so the fixation step ran without light. What stopped was the ATP- and NADPH-dependent reduction, which is the precise sense in which the cycle depends on light.
        - |
          3-PGA rising shows that fixation continued and reduction stopped. It is evidence that light is not needed for fixation, the opposite of what the student claims about that step.
        - |
          RuBP fell because it was still being fixed while no new RuBP was regenerated, not because the whole cycle accelerated; 3-PGA then had nowhere to go.
        - |
          Intermediate concentrations are informative: a block in a pathway makes the substrate of the blocked step accumulate and the product of that step fall. Sugar measurements are not needed to locate the block.
      answer: 0
      explanation: |
        Scientific argument means stating exactly what the data support. "Needs light" is approximately true and precisely wrong; "needs the light reactions' ATP and NADPH" is what the intermediates show.

    - slug: u03-w10-q07
      type: multiple_choice
      topic_code: "3.5"
      source: "Biology 2e §7.2 Glycolysis"
      points: 1
      prompt: |
        Glycolysis occurs in the cytosol of nearly every cell, uses no oxygen and no organelle, and its ten enzymes are recognisably the same across bacteria, plants and animals. Which inference is best supported?
      options:
        - "Glycolysis evolved early in a common ancestor of all living things, before oxygen was abundant in the atmosphere, and has been conserved ever since."
        - "Glycolysis evolved separately in each domain of life, which is why it is so widespread."
        - "Glycolysis is the most efficient way to extract energy from glucose, which is why cells rely on it alone."
        - "Glycolysis must be a recent innovation, because recent features are the most widely shared."
      option_explanations:
        - |
          Correct. A process that is universal, oxygen-independent and homologous in detail is best explained by a single origin in a shared ancestor living in an anaerobic world. This is the CED's example of a conserved process supporting common ancestry.
        - |
          Independent evolution would not produce ten homologous enzymes in the same order with the same intermediates in every lineage. Shared detail is the signature of shared descent.
        - |
          Glycolysis captures only about 2 ATP of the 30 or more a glucose can yield; it is the least efficient stage. Cells that can do so continue to the citric acid cycle and electron transport.
        - |
          Features shared by all life are the oldest, inherited from the last common ancestor, not the newest. A recent trait would be confined to the lineage in which it arose.
      answer: 0
      explanation: |
        Energetics meets evolution: the universality of glycolysis and of ATP is itself evidence for common ancestry, which is why 3.3 and 3.5 both mention it.

    - slug: u03-w10-q08
      type: multiple_choice
      topic_code: "3.5"
      source: "Biology 2e §7.2 Glycolysis"
      points: 1
      prompt: |
        Glycolysis produces four ATP per glucose yet its net yield is only two. Which statement explains the difference?
      options:
        - "Two ATP are invested in the first phase to phosphorylate glucose and fructose 6-phosphate, destabilising the sugar so it can be split and oxidised."
        - "Two of the four ATP are used to pump pyruvate into the mitochondrion."
        - "Two ATP are lost as heat when NADH is formed."
        - "Two ATP are consumed converting pyruvate to lactate."
      option_explanations:
        - |
          Correct. Hexokinase and phosphofructokinase each spend an ATP in the energy-investment phase. The payoff phase then makes four by substrate-level phosphorylation, leaving a net of two.
        - |
          Pyruvate enters the mitochondrion by a transporter driven by the proton gradient, not by ATP spent inside glycolysis, and the net count of two is the same in cells with no mitochondria.
        - |
          ATP is not converted to heat when NAD⁺ is reduced; the electrons come from the sugar. Heat loss is real but is not an ATP subtraction in the accounting.
        - |
          Lactate formation (fermentation) uses NADH, not ATP, and happens only when oxygen is absent. The net of two is intrinsic to glycolysis in every condition.
      answer: 0
      explanation: |
        Investment then payoff: the cell spends two ATP to make glucose reactive and recovers four. Keeping the gross and net counts straight is worth a point on most respiration items.

    - slug: u03-w10-q09
      type: multiple_choice
      topic_code: "3.5"
      source: "Biology 2e §7.7 Regulation of Cellular Respiration"
      points: 1
      prompt: |
        Phosphofructokinase is inhibited when ATP binds an allosteric site, and activated when AMP or ADP binds. Which prediction about a resting muscle cell with abundant ATP follows?
      options:
        - "Glycolysis slows, conserving glucose, because the cell's energy currency is already plentiful; it will speed up again when ATP is spent and ADP rises."
        - "Glycolysis speeds up, because ATP is the substrate phosphofructokinase needs."
        - "Glycolysis stops permanently, because ATP denatures the enzyme."
        - "Glycolysis is unaffected, because phosphofructokinase acts only in the mitochondrion."
      option_explanations:
        - |
          Correct. This is feedback inhibition by the pathway's ultimate product: ATP signals "enough", AMP signals "demand". The enzyme sits at the first committed step, so the whole pathway responds.
        - |
