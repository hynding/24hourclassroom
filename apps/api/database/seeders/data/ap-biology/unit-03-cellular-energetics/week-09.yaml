      options:
        - "The enzymes of photosynthesis, which are proteins, lost their tertiary structure at 45 °C; a little activity remained early, then denaturation stopped the process."
        - "Photosynthesis has no enzymes, so temperature should not matter; the result must be an error."
        - "At 45 °C the enzymes worked faster, used all the CO₂ in 8 minutes, and then stopped for lack of substrate."
