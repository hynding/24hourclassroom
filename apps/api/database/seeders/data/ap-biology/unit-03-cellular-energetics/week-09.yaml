week: 9
unit: 3
title: Cellular Energy and the Light Reactions
topics: ["3.3", "3.4"]
guide: guides/week-09.md
guide_description: |
  The two laws of thermodynamics as biology sees them; free energy, exergonic and endergonic reactions; why ATP
  hydrolysis releases energy and how coupling it to an endergonic step drives the cell; redox and the carriers
  NAD⁺, FAD and NADP⁺. Then photosynthesis part one: chloroplast anatomy, pigments and spectra, photosystems II
  and I, water splitting, the thylakoid electron transport chain and chemiosmosis. Three worked examples (a
  coupled-reaction energy budget, an absorption-versus-action spectrum, the floating leaf disk ET50), misconceptions,
  self-check. AP Investigation 5 (Photosynthesis) starts this week.
flashcards_description: |
  32 cards: thermodynamics, free energy, ATP and coupling, redox carriers, and the light-dependent reactions from photon to NADPH.

flashcards:
  - front: Metabolism → anabolic versus catabolic pathways
    back: |
      Metabolism is all the chemical reactions of a cell. Anabolic pathways build complex molecules from simple ones and consume energy (photosynthesis, protein synthesis). Catabolic pathways break complex molecules down and release energy (cellular respiration).
    hint: Anabolic adds up; catabolic cuts.
    topic_code: "3.3"
  - front: First law of thermodynamics → the biological version
    back: |
      Energy cannot be created or destroyed, only transferred or transformed. A plant does not make energy; it converts light energy into chemical energy in sugar. An animal converts that chemical energy into ATP, movement and heat.
    topic_code: "3.3"
  - front: Second law of thermodynamics → why organisms must keep eating
    back: |
      Every energy transfer loses some energy as heat and increases the entropy (disorder) of the universe. An organism keeps itself ordered only by taking in a constant supply of free energy and releasing heat, raising entropy outside itself.
    topic_code: "3.3"
  - front: Entropy
    back: |
      A measure of disorder or randomness. High entropy means dispersed, low-usability energy. Living things are low-entropy islands maintained at the cost of greater entropy in their surroundings.
    topic_code: "3.3"
  - front: Why is a cell an open system, and why does that matter?
    back: |
      It exchanges both energy and matter with its surroundings. That exchange is what lets it stay far from equilibrium; a cell whose reactions reached equilibrium would do no work and would be dead.
    topic_code: "3.3"
  - front: Free energy (G) and ΔG → sign convention
    back: |
      Free energy is the energy available to do work. ΔG = G(products) − G(reactants). Negative ΔG: exergonic, energy released, spontaneous. Positive ΔG: endergonic, energy required, non-spontaneous. ΔG = ΔH − TΔS.
    topic_code: "3.3"
  - front: Exergonic versus endergonic reaction
    back: |
      Exergonic: products hold less free energy than reactants, so energy is released (ΔG negative), as in hydrolysis and respiration. Endergonic: products hold more, so energy must be supplied (ΔG positive), as in dehydration synthesis and photosynthesis.
    topic_code: "3.3"
  - front: Does spontaneous mean fast?
    back: |
      No. Spontaneous means ΔG is negative, so the reaction can proceed without net energy input. Rusting is spontaneous and takes years. Speed depends on activation energy, which is the enzyme's business.
    topic_code: "3.3"
  - front: ATP → structure
    back: |
      Adenosine (adenine plus ribose) with three phosphate groups in a row: alpha, beta and gamma, counted outward from the sugar. The two outer phosphate-to-phosphate bonds are the energy-rich phosphoanhydride bonds.
    topic_code: "3.3"
  - front: Why does ATP hydrolysis release energy?
    back: |
      Three negatively charged phosphates are crowded together and repel one another; removing the terminal phosphate relieves that strain and gives products (ADP + Pi) that are more stable and better solvated. ΔG is about −7.3 kcal/mol under standard conditions and nearer −14 kcal/mol in a cell.
    hint: Think of a compressed spring of negative charges.
    topic_code: "3.3"
  - front: Energy coupling
    back: |
      Using an exergonic reaction (ATP hydrolysis) to drive an endergonic one, usually by transferring ATP's terminal phosphate onto a reactant or a protein (phosphorylation) so the combined ΔG of the two steps is negative.
    topic_code: "3.3"
  - front: Phosphorylation → what the transferred phosphate does
    back: |
      Attaching a phosphate from ATP makes the recipient less stable and more reactive (a phosphorylated intermediate), or changes a protein's shape. Either way, the energy of ATP is handed on rather than released as heat.
    topic_code: "3.3"
  - front: The sodium-potassium pump as an example of coupling
    back: |
      Hydrolysis of one ATP phosphorylates the pump, the phosphorylated protein changes shape, and in the cycle three Na⁺ leave the cell and two K⁺ enter, both against their gradients. An endergonic transport is paid for by an exergonic hydrolysis.
    topic_code: "3.3"
  - front: The ATP cycle → why ATP is a currency and not a store
    back: |
      ATP is spent (hydrolysed to ADP + Pi) and re-made (ADP phosphorylated) continuously; a cell turns over its own weight in ATP daily. Long-term energy is stored in glycogen and fat; ATP is the coin that passes between catabolism and work.
    topic_code: "3.3"
  - front: Substrate-level versus oxidative phosphorylation
    back: |
      Substrate-level: an enzyme moves a phosphate directly from a phosphorylated intermediate onto ADP (glycolysis, citric acid cycle). Oxidative: ATP synthase makes ATP using a proton gradient built by an electron transport chain (mitochondria, and the equivalent photophosphorylation in chloroplasts).
    topic_code: "3.3"
  - front: Oxidation versus reduction → OIL RIG
    back: |
      Oxidation Is Loss of electrons; Reduction Is Gain. In biology, losing electrons usually goes with losing hydrogen atoms and gaining oxygen. The two always happen together: one molecule is oxidised as another is reduced.
    topic_code: "3.3"
  - front: NAD⁺ and FAD → what they do
    back: |
      Electron carriers (coenzymes made from B vitamins). NAD⁺ accepts two electrons and one proton to become NADH; FAD accepts two of each to become FADH₂. They shuttle high-energy electrons from fuel molecules to the electron transport chain.
    topic_code: "3.3"
  - front: Why do cells release the energy of glucose in many small steps?
    back: |
      Burning glucose in one step would release its energy as a burst of heat that the cell could not capture. A chain of small redox steps lets each step's energy be caught as ATP, NADH or a gradient instead of being lost.
    topic_code: "3.3"
  - front: Energy flows, matter cycles
    back: |
      Energy enters ecosystems as light, passes through organisms as chemical energy and leaves as heat; it is not recycled. The atoms in CO₂, water and sugar go round and round between photosynthesis and respiration.
    topic_code: "3.3"
  - front: Photoautotroph versus heterotroph
    back: |
      A photoautotroph (plant, alga, cyanobacterium) builds its own organic molecules from CO₂ using light energy. A heterotroph (animal, fungus, most bacteria) must eat organic molecules made by others.
    topic_code: "3.4"
  - front: Chloroplast anatomy → thylakoid, granum, stroma, lumen
    back: |
      Thylakoids are flattened membrane sacs; a stack of them is a granum. The stroma is the fluid around the thylakoids where the Calvin cycle runs. The lumen is the space inside a thylakoid where protons accumulate during the light reactions.
    topic_code: "3.4"
  - front: The overall equation of photosynthesis
    back: |
      6 CO₂ + 6 H₂O + light energy → C₆H₁₂O₆ + 6 O₂. The carbon of the sugar comes from CO₂; the oxygen gas comes from water, not from CO₂.
    topic_code: "3.4"
  - front: The two stages of photosynthesis and what links them
    back: |
      Light-dependent reactions in the thylakoid membranes turn light into ATP and NADPH and release O₂. The Calvin cycle in the stroma uses that ATP and NADPH to reduce CO₂ to sugar. ATP and NADPH are the link, with ADP and NADP⁺ returning.
    topic_code: "3.4"
  - front: Wavelength and photon energy
    back: |
      Shorter wavelength, more energy per photon. Visible light runs from about 380 nm (violet, highest energy) to 750 nm (red, lowest). Chlorophyll absorbs at both ends and reflects the middle, which is why leaves look green.
    topic_code: "3.4"
  - front: Absorption spectrum versus action spectrum
    back: |
      An absorption spectrum plots how much light a purified pigment absorbs at each wavelength. An action spectrum plots the rate of photosynthesis of a whole organism at each wavelength. The action spectrum is broader because several pigments contribute.
    topic_code: "3.4"
  - front: Chlorophyll a, chlorophyll b and carotenoids → roles
    back: |
      Chlorophyll a is the only pigment that directly drives the photoact (P680, P700). Chlorophyll b and carotenoids are accessory pigments that absorb other wavelengths and pass the energy to chlorophyll a; carotenoids also dump excess light energy as heat, protecting the apparatus.
    topic_code: "3.4"
  - front: Photosystem II → P680 and water splitting
    back: |
      Light energy funnelled to the P680 chlorophyll pair excites an electron that leaves the photosystem. P680⁺ is the strongest biological oxidant and pulls replacement electrons from water: 2 H₂O → 4 e⁻ + 4 H⁺ + O₂. This is where the O₂ we breathe comes from.
    topic_code: "3.4"
  - front: Photosystem I → P700 and NADPH
    back: |
      Electrons arriving from the cytochrome complex, re-energised by light at P700, are passed to ferredoxin and then to NADP⁺ reductase, which reduces NADP⁺ to NADPH, the reducing power the Calvin cycle needs.
    topic_code: "3.4"
  - front: The thylakoid electron transport chain → order of carriers
    back: |
      Water → photosystem II (P680) → plastoquinone → cytochrome complex → plastocyanin → photosystem I (P700) → ferredoxin → NADP⁺ reductase → NADPH. The cytochrome complex pumps protons into the lumen as the electrons pass.
    hint: Two photosystems, numbered in the order they were discovered, not the order electrons use them.
    topic_code: "3.4"
  - front: Where do protons build up in a chloroplast, and what happens next?
    back: |
      In the thylakoid lumen, from water splitting and from pumping by the cytochrome complex. They flow back out into the stroma through ATP synthase, which uses the flow to phosphorylate ADP. ATP is therefore made on the stroma side, where the Calvin cycle needs it.
    topic_code: "3.4"
  - front: Products of the light-dependent reactions
    back: |
      ATP and NADPH, both released into the stroma, plus O₂ as a by-product of water splitting. No sugar is made in the light reactions.
    topic_code: "3.4"
  - front: Floating leaf disk assay → what the disks rising measures
    back: |
      Vacuum infiltration replaces the air in the leaf's spaces with bicarbonate solution so the disks sink. In light, photosynthesis produces O₂ that refills the spaces and the disks float. The time for half the disks to float (ET50) is the index of rate; a faster rate means a smaller ET50, and 1/ET50 rises with rate.
    topic_code: "3.4"

quiz:
  description: |
    24 questions · about 30 minutes · thermodynamics, free energy, ATP and coupling, redox carriers, and the
    light-dependent reactions of photosynthesis, with a floating leaf disk (AP Investigation 5) data set, plus
    spiral review of enzymes, the elements of life, water, nucleotides, lipids and macromolecule synthesis from
    Units 1 and 3, and compartmentalisation from Unit 2. Multiple choice, select-all, true/false and numeric items
    are graded at once; fill-in-the-blank items are matched automatically; the two short answers and the long
    answer are graded by your teacher against the acceptable-answer summary.
  questions:
    - slug: u03-w09-q01
      type: multiple_choice
      topic_code: "3.3"
      source: "Biology 2e §6.3 The Laws of Thermodynamics"
      points: 1
      prompt: |
        A student says that plants "create energy" from sunlight. Which correction is consistent with the first law of thermodynamics?
      options:
        - "Plants transform light energy into chemical energy stored in sugar; no energy is created, only converted from one form to another."
        - "Plants create chemical energy but destroy an equal amount of light energy, so the total is unchanged."
        - "Plants create energy, but only a small amount, which the first law permits."
        - "Plants do not use energy at all; they build sugar from CO₂ and water with no energy input."
      option_explanations:
        - |
          Correct. The first law says energy is conserved. Photosynthesis is an energy transformation: photon energy becomes the potential energy of bonds in glucose, with some lost as heat.
        - |
          Energy is neither created nor destroyed; it is converted. Phrasing it as creation balanced by destruction is still a violation of the first law.
        - |
          The first law allows no creation of energy, in any amount. The student's error is in kind, not in degree.
        - |
          Building sugar from CO₂ and water is strongly endergonic. Without light energy it cannot happen, which is why plants in the dark stop making sugar.
      answer: 0
      explanation: |
        Every energy question in biology starts with the first law: organisms are transformers of energy, never sources. The second law adds that each transformation leaks heat.

    - slug: u03-w09-q02
      type: multiple_choice
      topic_code: "3.3"
      source: "Biology 2e §6.3 The Laws of Thermodynamics"
      points: 1
      prompt: |
        A living cell is highly ordered, yet the second law of thermodynamics says that the entropy of the universe always increases. Which statement resolves the apparent contradiction?
      options:
        - "The cell maintains its own low entropy by taking in free energy and releasing heat and simpler molecules, so the entropy of its surroundings rises by more than the cell's falls."
        - "Living things are exempt from the second law because they are alive."
        - "The cell's order shows that its entropy is increasing, since order and entropy are the same thing."
        - "The cell is a closed system, so the second law does not apply inside it."
      option_explanations:
        - |
          Correct. The second law applies to the universe, cell plus surroundings. A cell is an open system that exports disorder: the heat and waste it releases raise entropy outside by more than the order it builds inside.
        - |
          No system is exempt. Life obeys the second law by paying for its order with a continuous intake of energy; stop the intake and the order decays.
        - |
          Order is low entropy, not high. The claim reverses the definition and does not explain how the cell keeps its order.
        - |
          A cell is an open system, exchanging both matter and energy. It is precisely because it is open that it can stay ordered.
      answer: 0
      explanation: |
        Local order is bought with global disorder. That is why organisms must keep eating or keep absorbing light, and why every energy transfer in the course comes with heat leaving.

    - slug: u03-w09-q03
      type: multiple_choice
      topic_code: "3.3"
      source: "Biology 2e §6.4 ATP: Adenosine Triphosphate"
      points: 1
      prompt: |
        Converting glutamate to glutamine has ΔG = +3.4 kcal/mol. Hydrolysis of ATP has ΔG = −7.3 kcal/mol. Cells make glutamine readily. How?
      options:
        - "The enzyme couples the two reactions, transferring a phosphate from ATP to glutamate; the combined process has ΔG = −3.9 kcal/mol and proceeds."
        - "The enzyme lowers the ΔG of the glutamine reaction until it is negative."
        - "ATP releases heat that warms the glutamate until it reacts."
        - "The reaction proceeds anyway because +3.4 kcal/mol is a small positive value."
      option_explanations:
        - |
          Correct. Energy coupling: ATP phosphorylates glutamate to a reactive intermediate, which then accepts the amino group. The sum of −7.3 and +3.4 is negative, so the overall pathway is exergonic.
        - |
          Enzymes lower activation energy, never ΔG. The free-energy change of a reaction is set by its reactants and products and no catalyst can alter it.
        - |
          ATP's energy is used through phosphate transfer, not heat. Heat released into the cell would be lost; coupling captures the energy in a chemical intermediate.
        - |
          Any positive ΔG means the reaction will not proceed spontaneously in the forward direction. The size of the value sets how much energy is needed, not whether it is needed.
      answer: 0
      explanation: |
        Coupling is the cell's accounting trick: pair an endergonic step with a more exergonic one through a shared intermediate so the sum is negative. Most ATP in a cell is spent this way, not as heat.

    - slug: u03-w09-q04
      type: multiple_choice
      topic_code: "3.3"
      source: "Biology 2e §7.1 Energy in Living Systems"
      points: 1
      prompt: |
        Why does removing the terminal phosphate from ATP release a large amount of free energy?
      options:
        - "The three phosphates carry negative charges that repel one another, so the molecule is strained and the products are more stable."
        - "The bond between the phosphates is unusually strong, and breaking a strong bond always releases energy."
        - "Phosphate is a toxic ion, and the cell gains energy by getting rid of it."
        - "ATP contains a nitrogenous base, and bases release energy when they lose a phosphate."
      option_explanations:
        - |
          Correct. Like charges crowded together store potential energy; hydrolysis relieves the repulsion and yields products (ADP and Pi) that are more stable and better stabilised by water, so ΔG is strongly negative.
        - |
          Breaking any bond costs energy; energy is released when the new bonds formed are more stable than the ones broken. The phosphoanhydride bond is called high-energy because of the strain it holds, not because it is strong.
        - |
          Phosphate is not toxic; it is immediately reused. Energy release has to do with the stability of reactants versus products, not with disposal.
        - |
          The adenine base is a structural part of the nucleotide and plays no part in the energy of hydrolysis. The phosphate chain is where the energy is.
      answer: 0
      explanation: |
        The phrase "high-energy bond" is shorthand for "a strained molecule whose hydrolysis products are much more stable". Keep the physics in mind: repulsion in, relief out.

    - slug: u03-w09-q05
      type: multiple_choice
      topic_code: "3.3"
      source: "Biology 2e §7.1 Energy in Living Systems"
      points: 1
      prompt: |
        In the reaction glucose + NAD⁺ → oxidised intermediate + NADH, which statement correctly describes what has happened?
      options:
        - "Glucose has been oxidised (lost electrons) and NAD⁺ has been reduced (gained electrons), with energy now carried by NADH."
        - "Glucose has been reduced and NAD⁺ has been oxidised, with energy released as heat."
        - "Both molecules have been oxidised, because oxidation means reacting with oxygen."
        - "Neither molecule changed its electrons; NAD⁺ simply added a hydrogen atom to glucose."
      option_explanations:
        - |
          Correct. OIL RIG: glucose loses electrons (with H) and is oxidised; NAD⁺ gains them and is reduced to NADH. The electrons carry potential energy that the electron transport chain will later harvest.
        - |
          The direction is reversed. The fuel molecule is the electron donor in catabolism; the carrier is the acceptor. NADH is the reduced, energy-rich form.
        - |
          No oxygen is involved. Oxidation in biology means loss of electrons, often along with hydrogen, and it always pairs with a reduction of something else.
        - |
          Hydrogen atoms carry electrons, so transferring hydrogen to NAD⁺ is a transfer of electrons: a redox reaction, not a simple addition.
      answer: 0
      explanation: |
        Catabolism is a controlled oxidation of fuel. Each dehydrogenase step loads electrons onto NAD⁺ or FAD, and those carriers are the link between glucose and the ATP made later.

    - slug: u03-w09-q06
      type: multiple_choice
      topic_code: "3.4"
      source: "Biology 2e §8.2 The Light-Dependent Reactions of Photosynthesis"
      points: 1
      prompt: |
        A purified chlorophyll a solution absorbs strongly at about 430 nm and 660 nm and barely at 550 nm. A whole leaf, however, photosynthesises at a measurable rate under 550 nm light. Which explanation is best?
      options:
        - "Accessory pigments such as chlorophyll b and carotenoids absorb wavelengths chlorophyll a misses and pass the energy on, so the action spectrum is broader than chlorophyll a's absorption spectrum."
        - "Green light is reflected by leaves, and reflected light drives photosynthesis."
        - "Chlorophyll a changes its absorption spectrum when it is inside a leaf."
        - "The leaf converts 550 nm light into 660 nm light before absorbing it."
      option_explanations:
        - |
          Correct. Several pigments with different absorption peaks sit in the antenna complex; whatever any of them absorbs ends up at the reaction-centre chlorophyll a. The action spectrum sums their contributions.
        - |
          Reflected light has left the leaf; it cannot do work there. Leaves look green because green is the light used least, not because it drives photosynthesis especially well.
        - |
          Chlorophyll a's spectrum shifts only slightly in a membrane. The difference between the absorption and action spectra is explained by additional pigments, not by a changed chlorophyll.
        - |
          Photons are not converted from one wavelength to another before absorption. A photon is absorbed by a pigment with a matching absorption band or it is not absorbed at all.
      answer: 0
      explanation: |
        Absorption spectrum: one purified pigment. Action spectrum: a whole organism. The gap between them is the accessory pigments, and the near-match of their peaks is the evidence that absorbed light drives the process.

    - slug: u03-w09-q07
      type: multiple_choice
      topic_code: "3.4"
      source: "Biology 2e §8.2 The Light-Dependent Reactions of Photosynthesis"
      points: 1
      prompt: |
        Algae were supplied with water containing the heavy isotope ¹⁸O and ordinary CO₂. The oxygen gas they released contained ¹⁸O. In a second culture, the CO₂ carried ¹⁸O and the water was ordinary; the oxygen gas released contained no ¹⁸O. What do these results show?
      options:
        - "The O₂ released by photosynthesis comes from the splitting of water at photosystem II, not from CO₂."
        - "The O₂ released comes from CO₂, which is split in the light reactions."
        - "Oxygen atoms are exchanged freely between water and CO₂ before being released."
        - "Isotopes of oxygen cannot be used by photosynthesis, so the labelled oxygen was excluded."
      option_explanations:
        - |
          Correct. The label appears in O₂ only when it starts in water. Photosystem II's oxidised P680 pulls electrons from water, and the oxygen atoms left behind pair up as O₂.
        - |
          If CO₂ were the source, labelling CO₂ would have labelled the O₂. It did not. CO₂'s oxygen ends up in sugar and in water, not in oxygen gas.
        - |
          Free exchange would have labelled the O₂ in both experiments. The clean result in the second culture rules it out.
        - |
          ¹⁸O is chemically identical to ¹⁶O and was used normally; that is what makes it a tracer. The first culture released labelled O₂, so the isotope was not excluded.
      answer: 0
      explanation: |
        A tracer experiment reasons from where a label ends up. The CED expects you to know that water is the electron source and the oxygen source of photosynthesis, and this is the evidence.

    - slug: u03-w09-q08
      type: multiple_choice
      topic_code: "3.4"
      source: "Biology 2e §8.2 The Light-Dependent Reactions of Photosynthesis"
      points: 1
      prompt: |
        Which sequence correctly traces an electron through the light-dependent reactions?
      options:
        - "Water → photosystem II → plastoquinone → cytochrome complex → plastocyanin → photosystem I → NADP⁺"
        - "Water → photosystem I → cytochrome complex → photosystem II → NADP⁺"
        - "CO₂ → photosystem II → ATP synthase → photosystem I → NADPH"
        - "NADPH → photosystem I → plastocyanin → photosystem II → water"
      option_explanations:
        - |
          Correct. Electrons stripped from water replace those that light drives out of P680; they drop through the chain (pumping protons at the cytochrome complex), are re-energised at P700, and finish on NADP⁺.
        - |
          The photosystems are numbered by discovery, not by use. Electrons enter at photosystem II and reach photosystem I afterwards.
        - |
          CO₂ is not an electron donor and ATP synthase carries protons, not electrons. CO₂ is reduced in the Calvin cycle using the NADPH these reactions make.
        - |
          This is the chain run backwards. NADPH is the final product, water is the source; electrons flow from the strongest donor (water, after P680⁺ pulls on it) to the final acceptor.
      answer: 0
      explanation: |
        Draw the Z-scheme once: two light-driven jumps (P680, P700) separated by a downhill run that pumps protons. The order of the carriers between them is the part students lose points on.

    - slug: u03-w09-q09
      type: multiple_choice
      topic_code: "3.4"
      source: "Biology 2e §8.2 The Light-Dependent Reactions of Photosynthesis"
      points: 1
      prompt: |
        Isolated thylakoids are illuminated in a buffer. A chemical that makes the thylakoid membrane freely permeable to H⁺ is then added. Electron transport and O₂ release continue, but ATP production stops. Which explanation is best?
      options:
        - "ATP synthesis depends on a proton gradient across the thylakoid membrane; letting protons leak through the lipid bilayer dissipates the gradient, so ATP synthase has nothing to drive it."
        - "The chemical blocked photosystem II, so no electrons entered the chain."
        - "The chemical destroyed NADP⁺, so electrons had nowhere to go."
        - "ATP synthase requires a sealed membrane to bind ADP, and the leak washed ADP away."
      option_explanations:
        - |
          Correct. This is the chemiosmotic test: separate electron flow from ATP synthesis by removing the gradient. Electrons still move (so O₂ still forms) but the proton-motive force is gone.
        - |
          If photosystem II were blocked, water would not be split and O₂ release would stop. The prompt says both electron transport and O₂ release continue.
        - |
          NADP⁺ reduction is downstream of electron transport, which continued. Nothing in the result points to the terminal acceptor; it points to the link between the chain and ATP synthase.
        - |
          ADP binding does not need a sealed membrane. What the membrane must be sealed for is the H⁺ concentration difference between lumen and stroma that powers the synthase.
      answer: 0
      explanation: |
        Uncouplers are the experiment that proved chemiosmosis in both chloroplasts and mitochondria. Whenever a question separates electron flow from ATP output, think "gradient".

    - slug: u03-w09-q10
      type: multiple_choice
      topic_code: "3.4"
      source: "Biology 2e §8.1 Overview of Photosynthesis"
      points: 1
      stimulus: |
        Students ran the floating leaf disk assay (AP Investigation 5). Ten spinach leaf disks were vacuum-infiltrated with each solution so that they sank, placed in a cup under a lamp (or in darkness), and the number floating was recorded every 2 minutes. Each row is the mean of three cups.

        | Condition | 0 min | 2 | 4 | 6 | 8 | 10 | 12 | 14 |
        |---|---|---|---|---|---|---|---|---|
        | 0.2% bicarbonate, light, 25 °C | 0 | 0 | 1 | 3 | 5 | 7 | 9 | 10 |
        | Water (no bicarbonate), light, 25 °C | 0 | 0 | 0 | 0 | 0 | 1 | 1 | 1 |
        | 0.2% bicarbonate, dark, 25 °C | 0 | 0 | 0 | 0 | 0 | 0 | 0 | 0 |
        | 0.2% bicarbonate, light, 45 °C | 0 | 0 | 0 | 1 | 2 | 2 | 2 | 2 |
      prompt: |
        Why do the disks in bicarbonate solution under the lamp rise, while those in bicarbonate in the dark do not?
      options:
        - "In the light, photosynthesis releases O₂ into the leaf's air spaces, making the disks buoyant; in the dark no O₂ is made and respiration consumes what is there."
        - "Light heats the solution, and warm water is less dense, so the disks float."
        - "The lamp's light pushes the disks upward by radiation pressure."
        - "Bicarbonate decomposes to CO₂ gas only in the light, and the CO₂ bubbles lift the disks."
      option_explanations:
        - |
          Correct. Vacuum infiltration replaced the air with solution; oxygen produced by the light reactions refills the spaces. The dark cup shows that the rise needs light, and respiration there can only remove gas.
        - |
          The 45 °C cup was warmer than the 25 °C light cup and its disks rose less, not more, so warmth is not the lifting agent. Density changes of water over this range are negligible anyway.
        - |
          Radiation pressure from a lamp is many orders of magnitude too weak to move a leaf disk. The lift is from gas produced inside the disk.
        - |
          Bicarbonate supplies dissolved CO₂ regardless of light. If CO₂ gas lifted the disks, the dark bicarbonate cup would also float; it did not.
      answer: 0
      explanation: |
        The assay measures net oxygen production. Light supplies the energy to split water, which is where the O₂ comes from; the dark cup is the control that shows nothing else in the set-up makes the disks rise.

    - slug: u03-w09-q11
      type: multiple_choice
      topic_code: "3.4"
      source: "Biology 2e §8.1 Overview of Photosynthesis"
      points: 1
      stimulus: |
        Students ran the floating leaf disk assay (AP Investigation 5). Ten spinach leaf disks were vacuum-infiltrated with each solution so that they sank, placed in a cup under a lamp (or in darkness), and the number floating was recorded every 2 minutes. Each row is the mean of three cups.

        | Condition | 0 min | 2 | 4 | 6 | 8 | 10 | 12 | 14 |
        |---|---|---|---|---|---|---|---|---|
        | 0.2% bicarbonate, light, 25 °C | 0 | 0 | 1 | 3 | 5 | 7 | 9 | 10 |
        | Water (no bicarbonate), light, 25 °C | 0 | 0 | 0 | 0 | 0 | 1 | 1 | 1 |
        | 0.2% bicarbonate, dark, 25 °C | 0 | 0 | 0 | 0 | 0 | 0 | 0 | 0 |
        | 0.2% bicarbonate, light, 45 °C | 0 | 0 | 0 | 1 | 2 | 2 | 2 | 2 |
      prompt: |
        The disks in plain water under the lamp barely rose. Which conclusion do the data best support?
      options:
        - "Photosynthesis needs a supply of CO₂ (provided by bicarbonate); without it the Calvin cycle cannot consume ATP and NADPH, the light reactions back up, and little O₂ is released."
        - "Water inhibits photosynthesis, so leaves must avoid absorbing it."
        - "The lamp was not bright enough for the water cup."
        - "Leaf disks in water produce O₂ but it dissolves instead of forming gas."
      option_explanations:
        - |
          Correct. The two light cups differ only in bicarbonate. Without CO₂ to fix, NADP⁺ and ADP are not regenerated, so the electron chain has no acceptor and water splitting slows. Oxygen output tracks carbon fixation.
        - |
          Water is a reactant of photosynthesis and fills every cell. What the water cup lacks is dissolved CO₂, and that is the difference being tested.
        - |
          The same lamp at the same distance lit both cups. Attributing the difference to light ignores the single variable the students changed.
        - |
          Oxygen solubility is the same in both cups; it is not a property of the water cup alone. The bicarbonate cup floated under identical conditions, so the difference is in production, not dissolving.
      answer: 0
      explanation: |
        The assay links the two stages of photosynthesis: a shortage of CO₂ for the Calvin cycle shows up as a shortage of O₂ from the light reactions, because ATP and NADPH are not being recycled.

    - slug: u03-w09-q12
      type: numeric
      topic_code: "3.4"
      source: "Biology 2e §8.1 Overview of Photosynthesis"
      points: 1
      stimulus: |
        Students ran the floating leaf disk assay (AP Investigation 5). Ten spinach leaf disks were vacuum-infiltrated with each solution so that they sank, placed in a cup under a lamp (or in darkness), and the number floating was recorded every 2 minutes. Each row is the mean of three cups.

        | Condition | 0 min | 2 | 4 | 6 | 8 | 10 | 12 | 14 |
        |---|---|---|---|---|---|---|---|---|
        | 0.2% bicarbonate, light, 25 °C | 0 | 0 | 1 | 3 | 5 | 7 | 9 | 10 |
        | Water (no bicarbonate), light, 25 °C | 0 | 0 | 0 | 0 | 0 | 1 | 1 | 1 |
        | 0.2% bicarbonate, dark, 25 °C | 0 | 0 | 0 | 0 | 0 | 0 | 0 | 0 |
        | 0.2% bicarbonate, light, 45 °C | 0 | 0 | 0 | 1 | 2 | 2 | 2 | 2 |
      prompt: |
        The ET50 is the time at which half the disks (5 of 10) are floating, and the rate of photosynthesis is reported as 1/ET50. Calculate the rate for the 0.2% bicarbonate, light, 25 °C cup, in min⁻¹, to three decimal places.
      answer: { value: 0.125, tolerance: 0.006 }
      explanation: |
        Read down the 25 °C bicarbonate row: 5 disks are floating at 8 minutes, so ET50 = 8 min. Rate = 1/ET50 = 1 ÷ 8 = 0.125 min⁻¹. The reciprocal is used because a faster photosynthetic rate gives a shorter ET50; taking 1/ET50 turns the index the right way up so that bigger means faster. For the 45 °C cup, ET50 was never reached (only 2 disks floated), so its rate cannot be computed this way and must be reported as lower than the 25 °C cup's.

