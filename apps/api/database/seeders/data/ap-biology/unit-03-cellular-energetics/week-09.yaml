    - slug: u03-w09-q14
      type: multiple_choice
      topic_code: "1.2"
      source: "Biology 2e §2.1 Atoms, Isotopes, Ions, and Molecules"
      points: 1
      prompt: |
        Review. Phosphorus makes up less than 1% of body mass, yet a phosphorus-deficient organism cannot grow or store energy. Which pairing of molecule and phosphorus-containing part best explains why?
      options:
        - "ATP's phosphate chain, the phosphate groups of the DNA and RNA backbones, and the heads of membrane phospholipids all require phosphorus."
        - "Only glucose contains phosphorus, so a shortage stops photosynthesis."
        - "Phosphorus forms the amino groups of proteins and the bases of nucleotides."
        - "Phosphorus is the central atom of chlorophyll, so plants cannot absorb light without it."
      option_explanations:
        - |
          Correct. Phosphate is the working part of the energy currency, the link in the sugar-phosphate backbone, and the polar head of the lipid bilayer. Each is a reason growth and energy storage fail without phosphorus.
        - |
          Glucose (C₆H₁₂O₆) contains no phosphorus. Phosphorylated sugars exist as intermediates, but the point is the phosphate group, which comes from ATP.
        - |
          Amino groups and nucleotide bases are nitrogen's job. Phosphorus is in the phosphate groups that link nucleotides, not in the bases.
        - |
          Chlorophyll's central atom is magnesium. Phosphorus is important to plants, but through ATP, nucleic acids and membranes, not through the pigment.
      answer: 0
      explanation: |
        Unit 1's element-to-molecule map matters again now that ATP is the central molecule: no phosphate, no energy currency, no nucleic acid backbone, no membrane.

    - slug: u03-w09-q15
      type: multiple_choice
      topic_code: "1.1"
      source: "Biology 2e §2.2 Water"
      points: 1
      prompt: |
        Review. Photosystem II splits water: 2 H₂O → 4 e⁻ + 4 H⁺ + O₂. Which bonds are broken in this reaction?
      options:
        - "The polar covalent O–H bonds within each water molecule."
        - "The hydrogen bonds between neighbouring water molecules."
        - "The ionic bonds between H⁺ and OH⁻ in water."
        - "The double bond of O₂, which is split to release oxygen atoms."
      option_explanations:
        - |
          Correct. Removing hydrogen as protons and electrons from oxygen means breaking the covalent O–H bonds inside the molecule, which is why it takes the strongest oxidant in biology, P680⁺, to do it.
        - |
          Hydrogen bonds are the weak attractions between molecules. They break and re-form constantly in liquid water without any chemistry happening; splitting water is a different and far more energetic event.
        - |
          Water is a covalent molecule, not an ionic compound. H⁺ and OH⁻ form only in tiny amounts by dissociation; the bonds in H₂O are shared-electron bonds.
        - |
          O₂ is a product, not a reactant. Its double bond is formed in this reaction, not broken, when two oxygen atoms left over from water join.
      answer: 0
      explanation: |
        Week 1's distinction between covalent bonds within water and hydrogen bonds between water molecules is the key to reading the water-splitting equation correctly.

    - slug: u03-w09-q16
      type: multi_select
      topic_code: "3.4"
      source: "Biology 2e §8.2 The Light-Dependent Reactions of Photosynthesis"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are products of the light-dependent reactions of photosynthesis? Select all that apply.
      options:
        - "ATP, released into the stroma"
        - "NADPH, released into the stroma"
        - "O₂, from the splitting of water"
        - "Glucose, assembled on the thylakoid membrane"
        - "CO₂, released from the thylakoid lumen"
      option_explanations:
        - |
          Correct. Protons flowing from the lumen back to the stroma through ATP synthase phosphorylate ADP on the stroma side, where the Calvin cycle will use the ATP.
        - |
          Correct. NADP⁺ reductase, on the stroma side of photosystem I, loads electrons onto NADP⁺; NADPH is the reducing power for carbon fixation.
        - |
          Correct. Water is the electron donor; the oxygen atoms left behind pair up and leave as O₂, the by-product that the leaf disk assay measures.
        - |
          No sugar is made in the light reactions. Glucose is built in the stroma by the Calvin cycle from CO₂, using the ATP and NADPH the light reactions supply.
        - |
          CO₂ is consumed, not produced, by photosynthesis, and in the Calvin cycle rather than the light reactions. Confusing this with respiration's CO₂ output is the common error.
      answer: [0, 1, 2]
      explanation: |
        The light reactions convert light to two chemical forms (ATP and NADPH) and give off O₂. Everything carbon-related belongs to the Calvin cycle, next week.

    - slug: u03-w09-q17
      type: multi_select
      topic_code: "1.6"
      source: "Biology 2e §3.5 Nucleic Acids"
      points: 2
      partial_credit: true
      prompt: |
        Review. ATP is a modified nucleotide. Which statements about its structure are correct? Select all that apply.
      options:
        - "It contains the nitrogenous base adenine."
        - "Its sugar is ribose, the same sugar found in RNA."
        - "It carries three phosphate groups, the outer two attached by energy-rich bonds."
        - "It contains the base thymine, which pairs with adenine."
        - "Its sugar is deoxyribose, the same sugar found in DNA."
      option_explanations:
        - |
          Correct. The A in ATP is adenine, the same purine base that appears in DNA and RNA.
        - |
          Correct. ATP is adenosine triphosphate; adenosine is adenine joined to ribose, so ATP is in effect an RNA building block with two extra phosphates.
        - |
          Correct. Alpha, beta and gamma phosphates in a row; the beta and gamma are joined by phosphoanhydride bonds whose hydrolysis powers the cell.
        - |
          ATP is a single nucleotide with one base, adenine. Thymine is a DNA base and does not occur in ATP; the pairing idea belongs to double-stranded DNA.
        - |
          The sugar is ribose, with a 2′ hydroxyl. The deoxy form, dATP, is used only for building DNA.
      answer: [0, 1, 2]
      explanation: |
        Knowing ATP as a nucleotide links Units 1, 3 and 6: the molecule that pays for reactions is a cousin of the monomers that store information.

    - slug: u03-w09-q18
      type: true_false
      topic_code: "3.3"
      source: "Biology 2e §6.2 Potential, Kinetic, Free, and Activation Energy"
      points: 1
      prompt: |
        True or false: A reaction with a negative ΔG always proceeds rapidly once its reactants are mixed.
      answer: false
      explanation: |
        False. A negative ΔG means the reaction is spontaneous in the thermodynamic sense: it can proceed without a net input of energy and will release free energy when it does. It says nothing about speed. Speed is governed by activation energy; iron rusts and glucose oxidises spontaneously, yet both are extremely slow without a catalyst or heat. Cells pair spontaneity (ΔG) with enzymes (Eₐ) to get reactions that are both possible and fast.

    - slug: u03-w09-q19
      type: true_false
      topic_code: "1.5"
      source: "Biology 2e §3.3 Lipids"
      points: 1
      prompt: |
        Review. True or false: Gram for gram, fat stores more than twice the energy of carbohydrate because its fatty-acid chains are rich in C–H bonds, which hold electrons in a highly reduced state that can be oxidised to release energy.
      answer: true
      explanation: |
        True. Fat yields about 9 kcal/g against about 4 kcal/g for carbohydrate. A fatty-acid chain is mostly C–H bonds, which means the carbons are highly reduced and carry many electrons that dehydrogenases can strip onto NAD⁺ and FAD during respiration. Carbohydrate carbons are already partly oxidised (each carries an oxygen), so there is less to harvest. This is also why the energetics of this unit are a story about electrons, not about bonds "containing" energy.

    - slug: u03-w09-q20
      type: fill_blank
      topic_code: "3.4"
      source: "Biology 2e §8.1 Overview of Photosynthesis"
      points: 1
      prompt: |
        During the light-dependent reactions, protons accumulate inside the thylakoid and then flow through ATP synthase into the surrounding fluid of the chloroplast, called the ____, where the Calvin cycle will use the ATP.
      answer: ["stroma"]
      explanation: |
        The stroma is the fluid that fills the chloroplast around the thylakoids, the site of carbon fixation. The protons come from the thylakoid lumen, the space inside each thylakoid sac. "Cytoplasm" is not accepted: the chloroplast has its own internal compartments, and the Calvin cycle runs inside the organelle, not in the cell's cytosol. "Matrix" is the mitochondrial equivalent and belongs to respiration.

    - slug: u03-w09-q21
      type: fill_blank
      topic_code: "1.3"
      source: "Biology 2e §3.1 Synthesis of Biological Macromolecules"
      points: 1
      prompt: |
        Review. Building a polymer from monomers by removing a water molecule at each new bond is an endergonic, anabolic process called ____ synthesis, and the energy it needs is supplied by ATP.
      answer: ["dehydration", "condensation"]
      explanation: |
        Dehydration (or condensation) synthesis stores energy in new covalent bonds and therefore has a positive ΔG; it is the reverse of hydrolysis, which releases energy. Linking it to ATP is the point of this week: anabolic reactions run only because they are coupled to ATP hydrolysis through phosphorylated intermediates. "Hydrolysis" is the opposite reaction and is not accepted.

    - slug: u03-w09-q22
      type: short_answer
      topic_code: "3.3"
      source: "Biology 2e §6.4 ATP: Adenosine Triphosphate"
      points: 4
      prompt: |
        Conceptual analysis. The sodium-potassium pump moves three Na⁺ out of a cell and two K⁺ in, both against their concentration gradients, for every ATP it hydrolyses. (a) Explain why this transport cannot occur without an energy input. (b) Describe how the energy of ATP is transferred to the pump. (c) Predict what will happen to the pump's activity, and to the cell's ion gradients, if a poison stops ATP synthesis, and (d) justify the prediction using the idea of coupled reactions.
      answer: |
        Moving ions up their gradients is endergonic (ΔG positive). ATP phosphorylates the pump protein, which changes shape and moves the ions. Without ATP the pump stops, the gradients run down by leakage, and the cell swells or dies, because the endergonic transport was only possible when coupled to the exergonic hydrolysis of ATP.
      explanation: |
        Four points.

        (a) Explain, 1 pt: moving a solute from low to high concentration increases order or potential energy, so ΔG for the transport is positive and it is non-spontaneous; it will not happen on its own. Accept "against the gradient, so endergonic".

        (b) Describe, 1 pt: ATP hydrolysis transfers its terminal phosphate to the pump (phosphorylation), the phosphorylated protein changes conformation, and the conformational change carries the ions across; dephosphorylation returns the pump to its first shape. The phosphate transfer must be mentioned; "ATP gives the pump energy" with no mechanism earns nothing.

        (c) Predict, 1 pt: the pump stops; Na⁺ leaks into the cell and K⁺ leaks out until the gradients disappear; the membrane potential collapses and the cell may swell by osmosis.

        (d) Justify, 1 pt: the endergonic transport proceeds only because it is coupled to the exergonic hydrolysis of ATP (overall ΔG negative); remove the exergonic half and the sum becomes positive, so the coupled process cannot continue.

        Zero: treating ATP as a molecule that releases heat to warm the pump, or claiming the gradient maintains itself once established.

    - slug: u03-w09-q23
      type: short_answer
      topic_code: "2.9"
      source: "Biology 2e §8.1 Overview of Photosynthesis"
      points: 4
      prompt: |
        Review. Conceptual analysis. The chloroplast contains an extensive system of thylakoid membranes folded into stacks (grana), enclosing a separate internal space (the lumen). (a) Explain how this membrane organisation increases the rate of the light-dependent reactions. (b) Explain why a separate, enclosed lumen is necessary for ATP synthesis. (c) Describe one other advantage of carrying out photosynthesis inside a membrane-bound organelle rather than in the cytosol.
      answer: |
        Folding and stacking give a large membrane area, so many photosystems and electron carriers fit in one chloroplast; the enclosed lumen lets protons accumulate on one side, creating the gradient ATP synthase needs; the organelle also concentrates enzymes and intermediates, keeps the Calvin cycle's conditions separate from the cytosol, and allows independent regulation.
      explanation: |
        Four points.

        (a) Explain, 1 pt: the folded, stacked thylakoids provide a large surface area of membrane per chloroplast, so more photosystems, electron carriers and ATP synthases can be packed in and more light harvested per unit volume. Accept "more membrane, more complexes, higher rate".

        (b) Explain, 2 pts: 1 pt for recognising that chemiosmosis requires a difference in H⁺ concentration across a membrane; 1 pt for connecting that to enclosure: only a sealed compartment can hold protons at a higher concentration than the stroma, and the flow back through ATP synthase is what makes ATP. A membrane open at the edges could not maintain the gradient.

        (c) Describe, 1 pt: any one of: enzymes and substrates of the Calvin cycle are concentrated in the stroma, increasing reaction rate; the stroma's pH and ion conditions can differ from the cytosol's; incompatible reactions (photosynthesis and respiration, for instance) are kept apart; regulation of the pathway can be independent of the rest of the cell.

        Zero: answers that treat the membranes only as a physical "container" with no reference to surface area or to the gradient.

    - slug: u03-w09-q24
      type: long_answer
      topic_code: "3.4"
      source: "general knowledge"
      points: 8
      prompt: |
        Designing and evaluating an experiment. A class wants to test whether the colour of light affects the rate of photosynthesis in spinach, using the floating leaf disk assay (AP Investigation 5). They have identical lamps, coloured filters that pass only red (about 660 nm), green (about 550 nm) or blue (about 450 nm) light, 0.2% sodium bicarbonate solution, syringes, cups, a hole punch, spinach leaves and stopwatches.

        (a) State a hypothesis based on the absorption spectrum of chlorophyll, and identify the independent and dependent variables.
        (b) Describe a procedure, including how the disks are prepared, what is held constant, the controls and the number of replicates, that would yield an ET50 for each colour.
        (c) Predict the ET50 results for the three colours if the hypothesis is correct, and explain the prediction in terms of pigment absorption and the light-dependent reactions.
        (d) A group obtained the predicted order but found that the green-light cup still floated all ten disks by 20 minutes. Explain one reason the green result is not zero and one way the experiment could be improved to make the comparison fairer.
      answer: |
        Hypothesis: red and blue light will give faster photosynthesis (shorter ET50) than green, because chlorophyll absorbs red and blue and reflects green. IV: wavelength of light; DV: ET50. Procedure: punch 10 disks per cup, infiltrate with bicarbonate solution by syringe vacuum until they sink, place cups at a fixed distance under identical lamps with each filter, count floating disks every minute, record the time for 5 to float; hold constant bicarbonate concentration, temperature, lamp distance and intensity, leaf source; controls: a dark cup and a cup with water instead of bicarbonate; three cups per colour. Prediction: blue and red ET50 short and similar, green much longer. Green is not zero because accessory pigments (carotenoids, chlorophyll b) absorb some green and filters are imperfect; improve by measuring light intensity behind each filter with a light meter and equalising it, since filters transmit different amounts of energy.
      explanation: |
        Eight points.

        (a) 2 pts: 1 pt for a hypothesis that predicts red and blue faster than green (or a null form) explicitly tied to chlorophyll's absorption spectrum; 1 pt for IV = light colour or wavelength and DV = time for half the disks to float (ET50), or rate as 1/ET50.

        (b) 3 pts: 1 pt for preparation: equal numbers of disks per cup, vacuum-infiltrated with bicarbonate solution so they sink, in identical volumes; 1 pt for controls and constants: a dark cup and/or a no-bicarbonate cup, with bicarbonate concentration, temperature, lamp distance, leaf source and volume held constant; 1 pt for replication, at least three cups per colour, with ET50 read from the time at which five disks float and the results averaged. A procedure that measures end-point floating rather than time to half earns at most 2 of the 3.

        (c) 2 pts: 1 pt for the prediction: blue and red short ET50 (fast), green long ET50 (slow), with blue and red similar; 1 pt for the explanation: chlorophylls absorb strongly in blue and red, so those wavelengths excite photosystems II and I, drive water splitting and O₂ release; green is mostly reflected or transmitted, so fewer photons are captured and less O₂ is produced per minute.

        (d) 1 pt: either reason earns the point: accessory pigments (carotenoids, chlorophyll b) absorb some green wavelengths and pass the energy to chlorophyll a, or coloured filters are not perfectly selective and leak some other wavelengths; plus an improvement such as measuring light intensity (photons or lux) behind each filter and adjusting lamp distance so the cups receive equal intensity, since the comparison is otherwise confounded by how much light each filter transmits. Both a reason and an improvement are needed for the point.

        Zero for a part: a hypothesis that green is best "because plants are green"; a procedure with no infiltration step or no timing; a prediction with no reference to pigments; an improvement that is merely "repeat it more times".
