unit: 1
description: |
  20 questions · about 40 minutes · every standard of Unit 1: factor pairs and finding all the factors of a
  number, multiples and common multiples, prime and composite numbers, and the area and perimeter of rectangles,
  including a missing side length. Two sets of questions share a picture. Multiple choice, select-all,
  true/false and number answers are graded at once; the fill-in word is matched automatically; the short answer
  is checked by your teacher against the scoring notes.
questions:
  # ---- Stimulus set: multiples on a number chart (4.OA.B.4)
  - slug: g4math-u01-check-q01
    type: multiple_choice
    topic_code: "4.OA.B.4"
    source: "IM K–5 Math Grade 4, Unit 1, Section A"
    points: 1
    stimulus: |
      Use the number chart. It shows the numbers 1 to 30 in rows of 6, and some of the numbers are shaded.
    figure: figures/u01-number-chart.svg
    figure_alt: "A chart of the numbers 1 to 30 in 5 rows of 6. The shaded numbers are 3, 6, 9, 12, 15, 18, 21, 24, 27 and 30. They fill the third and sixth columns. All the other numbers are white."
    prompt: |
      The shaded numbers are all the multiples of one number up to 30. Which number?
    options:
      - "3"
      - "6"
      - "9"
      - "2"
    option_explanations:
      - |
        Correct. The shaded numbers 3, 6, 9, 12, ... are what you say when you count by 3s, so they are the multiples of 3.
      - |
        The multiples of 6 are 6, 12, 18, 24 and 30. But 3, 9 and 15 are shaded too, and they are not multiples of 6.
      - |
        9 is shaded, but so are 3 and 6, which are smaller than 9. Multiples of 9 start at 9 and go 9, 18, 27.
      - |
        The multiples of 2 are the even numbers. 3, 9 and 15 are shaded but odd, and 2, 4 and 8 are not shaded.
    answer: 0

  - slug: g4math-u01-check-q02
    type: numeric
    topic_code: "4.OA.B.4"
    source: "IM K–5 Math Grade 4, Unit 1, Section A"
    points: 1
    stimulus: |
      Use the number chart. It shows the numbers 1 to 30 in rows of 6, and some of the numbers are shaded.
    prompt: |
      How many of the shaded numbers are also multiples of 5?
    answer: { value: 2, tolerance: 0 }
    explanation: |
      The multiples of 5 up to 30 are 5, 10, 15, 20, 25 and 30. Of these, only 15 and 30 are shaded, so 2 numbers are multiples of both 3 and 5.

  # ---- Factors, primes and composites (4.OA.B.4)
  - slug: g4math-u01-check-q03
    type: multiple_choice
    topic_code: "4.OA.B.4"
    source: "IM K–5 Math Grade 4, Unit 1, Section A"
    points: 1
    prompt: |
      Which list shows every factor pair of 28?
    options:
      - "2 and 14, 4 and 7"
      - "1 and 28, 2 and 14, 4 and 7"
      - "1 and 28, 2 and 14, 3 and 9, 4 and 7"
      - "1 and 28, 4 and 7"
    option_explanations:
      - |
        This leaves out 1 and 28. Every number has 1 and itself as a factor pair.
      - |
        Correct. Trying 1, 2, 3, 4, 5, 6 in order: 1 × 28, 2 × 14 and 4 × 7 work, and 3, 5 and 6 do not.
      - |
        3 and 9 is not a factor pair of 28, because 3 × 9 = 27.
      - |
        This leaves out 2 and 14. 28 is even, so 2 is a factor: 2 × 14 = 28.
    answer: 1

  - slug: g4math-u01-check-q04
    type: multiple_choice
    topic_code: "4.OA.B.4"
    source: "IM K–5 Math Grade 4, Unit 1, Section B"
    points: 1
    prompt: |
      Lockers 39, 49, 43 and 51 are in a row. Which locker number is prime?
    options:
      - "39"
      - "49"
      - "43"
      - "51"
    option_explanations:
      - |
        39 is composite: 3 × 13 = 39, so it has a second factor pair.
      - |
        49 is composite: 7 × 7 = 49, so it has a second factor pair.
      - |
        Correct. 2, 3, 5 and 7 are not factors of 43, so 1 × 43 is its only factor pair.
      - |
        51 is composite: 3 × 17 = 51, so it has a second factor pair.
    answer: 2

  - slug: g4math-u01-check-q05
    type: true_false
    topic_code: "4.OA.B.4"
    source: "IM K–5 Math Grade 4, Unit 1, Section B"
    points: 1
    prompt: |
      True or false: every odd number greater than 1 is a prime number.
    answer: false
    explanation: |
      False. Many odd numbers are composite. For example, 9 = 3 × 3, 15 = 3 × 5 and 25 = 5 × 5. Being odd only means 2 is not a factor.

  - slug: g4math-u01-check-q06
    type: multi_select
    topic_code: "4.OA.B.4"
    source: "IM K–5 Math Grade 4, Unit 1, Section A"
    points: 2
    partial_credit: true
    prompt: |
      Select all the numbers that are factors of 45.
    options:
      - "3"
      - "6"
      - "9"
      - "15"
      - "90"
    option_explanations:
      - |
        A factor. 3 × 15 = 45, so 45 objects can be split into 3 equal groups.
      - |
        Not a factor. 45 is odd, and every multiple of 6 is even, so 6 does not go into 45.
      - |
        A factor. 9 × 5 = 45, so 9 and 5 are a factor pair of 45.
      - |
        A factor. 15 × 3 = 45, so 15 and 3 are a factor pair of 45.
      - |
        Not a factor. 90 is bigger than 45; it is a multiple of 45, because 45 × 2 = 90.
    answer: [0, 2, 3]

  - slug: g4math-u01-check-q07
    type: fill_blank
    topic_code: "4.OA.B.4"
    source: "IM K–5 Math Grade 4, Unit 1, Section B"
    points: 1
    prompt: |
      A whole number greater than 1 whose only factors are 1 and itself is called a ____ number.
    answer: ["prime", "a prime"]
    explanation: |
      A prime number has exactly one factor pair: 1 and the number. 2, 3, 5, 7 and 11 are prime.

  - slug: g4math-u01-check-q08
    type: numeric
    topic_code: "4.OA.B.4"
    source: "IM K–5 Math Grade 4, Unit 1, Section A"
    points: 1
    prompt: |
      How many factors does 36 have? Count each different factor once.
    answer: { value: 9, tolerance: 0 }
    explanation: |
      The factor pairs are 1 × 36, 2 × 18, 3 × 12, 4 × 9 and 6 × 6. The factors are 1, 2, 3, 4, 6, 9, 12, 18 and 36. 6 appears twice in a pair but counts once, so there are 9 factors.

  - slug: g4math-u01-check-q09
    type: multiple_choice
    topic_code: "4.OA.B.4"
    source: "IM K–5 Math Grade 4, Unit 1, Section A"
    points: 1
    prompt: |
      Ms. Ramos has 42 students for field day. She wants teams that are all the same size, with no one left out. Which team size works?
    options:
      - "4 students"
      - "5 students"
      - "8 students"
      - "6 students"
    option_explanations:
      - |
        4 × 10 = 40 and 4 × 11 = 44, so teams of 4 would leave 2 students out.
      - |
        42 does not end in 0 or 5, so 5 is not a factor. Teams of 5 would leave 2 students out.
      - |
        8 × 5 = 40 and 8 × 6 = 48, so teams of 8 would leave 2 students out.
      - |
        Correct. 6 × 7 = 42, so 7 teams of 6 students use everyone.
    answer: 3

  - slug: g4math-u01-check-q10
    type: multiple_choice
    topic_code: "4.OA.B.4"
    source: "IM K–5 Math Grade 4, Unit 1, Section A"
    points: 1
    prompt: |
      Which number is a common multiple of 3 and 5?
    options:
      - "45"
      - "8"
      - "25"
      - "35"
    option_explanations:
      - |
        Correct. 3 × 15 = 45 and 5 × 9 = 45, so 45 is on both counting lists.
      - |
        8 is 3 + 5. It is not on the 3s list (6, 9) or the 5s list (5, 10).
      - |
        25 is a multiple of 5, but counting by 3s goes 24, 27 and skips 25.
      - |
        35 is a multiple of 5 and of 7, but counting by 3s goes 33, 36 and skips 35.
    answer: 0

  # ---- Stimulus set: the dog run (4.MD.A.3)
  - slug: g4math-u01-check-q11
    type: multiple_choice
    topic_code: "4.MD.A.3"
    source: "IM K–5 Math Grade 4, Unit 1, Section B"
    points: 1
    stimulus: |
      Use the drawing of the dog run. It is a rectangle 12 meters long and 7 meters wide.
    figure: figures/u01-dog-run.svg
    figure_alt: "A rectangle. The bottom side is labeled 12 m and the left side is labeled 7 m."
    prompt: |
      How much ground does the dog run cover? (What is its area?)
    options:
      - "38 square meters"
      - "84 square meters"
      - "19 square meters"
      - "84 meters"
    option_explanations:
      - |
        38 is the perimeter (12 + 7 + 12 + 7), the distance around. Covering ground is area: multiply.
      - |
        Correct. Area = length × width = 12 × 7 = 84 square meters.
      - |
        19 is 12 + 7. Area multiplies the length and width; it does not add them.
      - |
        The number is right, 12 × 7 = 84, but area is measured in square meters, not meters.
    answer: 1

  - slug: g4math-u01-check-q12
    type: numeric
    topic_code: "4.MD.A.3"
    source: "IM K–5 Math Grade 4, Unit 1, Section B"
    points: 1
    stimulus: |
      Use the drawing of the dog run. It is a rectangle 12 meters long and 7 meters wide.
    prompt: |
      How many meters of fence go all the way around the dog run?
    answer: { value: 38, tolerance: 0 }
    explanation: |
      The fence is the perimeter: 12 + 7 + 12 + 7 = 38 meters. (Or 2 × 12 + 2 × 7 = 24 + 14 = 38.)

  # ---- Area and perimeter (4.MD.A.3)
  - slug: g4math-u01-check-q13
    type: numeric
    topic_code: "4.MD.A.3"
    source: "IM K–5 Math Grade 4, Unit 1, Section B"
    points: 1
    figure: figures/u01-area-72.svg
    figure_alt: "A rectangle. The left side is labeled 8 ft. The top side is labeled with a question mark. Written inside: Area = 72 square feet."
    prompt: |
      The rectangle has an area of 72 square feet. How many feet long is the side marked with a question mark?
    answer: { value: 9, tolerance: 0 }
    explanation: |
      Length × width = area, so 8 × ? = 72. 8 × 9 = 72, so the missing side is 9 feet. (Or 72 ÷ 8 = 9.)

  - slug: g4math-u01-check-q14
    type: multiple_choice
    topic_code: "4.MD.A.3"
    source: "IM K–5 Math Grade 4, Unit 1, Section B"
    points: 1
    prompt: |
      A square tile has a perimeter of 32 centimeters. What is its area?
    options:
      - "8 square centimeters"
      - "32 square centimeters"
      - "64 square centimeters"
      - "256 square centimeters"
    option_explanations:
      - |
        8 centimeters is the length of one side (32 ÷ 4). The area is side × side.
      - |
        32 is the perimeter. Area and perimeter of a square are not the same number here.
      - |
        Correct. A square has 4 equal sides, so each side is 32 ÷ 4 = 8 cm. Area = 8 × 8 = 64 square centimeters.
      - |
        256 is 32 × 8, which multiplies the perimeter by a side. Use side × side: 8 × 8.
    answer: 2

  - slug: g4math-u01-check-q15
    type: multiple_choice
    topic_code: "4.MD.A.3"
    source: "IM K–5 Math Grade 4, Unit 1, Section B"
    points: 1
    prompt: |
      Four rectangles each have an area of 24 square feet. Which one has the smallest perimeter?
    options:
      - "1 foot by 24 feet"
      - "2 feet by 12 feet"
      - "3 feet by 8 feet"
      - "4 feet by 6 feet"
    option_explanations:
      - |
        This long, thin rectangle has the biggest perimeter of all: 1 + 24 + 1 + 24 = 50 feet.
      - |
        The perimeter is 2 + 12 + 2 + 12 = 28 feet, which is more than for 4 by 6.
      - |
        The perimeter is 3 + 8 + 3 + 8 = 22 feet, which is more than for 4 by 6.
      - |
        Correct. 4 + 6 + 4 + 6 = 20 feet, the smallest. The closer a rectangle is to a square, the smaller its perimeter for the same area.
    answer: 3

  - slug: g4math-u01-check-q16
    type: numeric
    topic_code: "4.MD.A.3"
    source: "IM K–5 Math Grade 4, Unit 1, Section B"
    points: 1
    prompt: |
      A rectangular rug has a perimeter of 30 feet. It is 9 feet long. How many feet wide is it?
    answer: { value: 6, tolerance: 0 }
    explanation: |
      Two lengths use 9 + 9 = 18 feet. That leaves 30 − 18 = 12 feet for the two widths, so each width is 6 feet. Check: 9 + 6 + 9 + 6 = 30.

  - slug: g4math-u01-check-q17
    type: multiple_choice
    topic_code: "4.OA.B.4"
    source: "IM K–5 Math Grade 4, Unit 1, Section B"
    points: 1
    prompt: |
      Which sentence about prime numbers is true?
    options:
      - "2 is the only even prime number."
      - "1 is the smallest prime number."
      - "9 is prime because it is odd."
      - "Every number that ends in 1 is prime."
    option_explanations:
      - |
        Correct. 2 has only the factor pair 1 × 2. Every other even number also has 2 as a factor, so it is composite.
      - |
        1 has only one factor, so it is neither prime nor composite. The smallest prime is 2.
      - |
        9 is odd, but 3 × 3 = 9, so it has a second factor pair and is composite.
      - |
        21 ends in 1, but 3 × 7 = 21, so it is composite. The last digit does not decide.
    answer: 0

  - slug: g4math-u01-check-q18
    type: multiple_choice
    topic_code: "4.OA.B.4"
    source: "IM K–5 Math Grade 4, Unit 1, Section A"
    points: 1
    prompt: |
      Theo listed these factor pairs of 60: 1 × 60, 2 × 30, 3 × 20, 5 × 12, 6 × 10. Which factor pair did he miss?
    options:
      - "7 × 8"
      - "4 × 15"
      - "10 × 6"
      - "4 × 16"
    option_explanations:
      - |
        7 × 8 = 56, not 60. 7 is not a factor of 60.
      - |
        Correct. Theo skipped 4. 4 × 15 = 60, so 4 and 15 are a factor pair he left out.
      - |
        10 × 6 is the same pair as 6 × 10, which Theo already has.
      - |
        4 × 16 = 64, not 60. The partner of 4 is 15.
    answer: 1

  - slug: g4math-u01-check-q19
    type: short_answer
    topic_code: "4.MD.A.3"
    source: "IM K–5 Math Grade 4, Unit 1, Section B"
    points: 3
    prompt: |
      A class is planning a rectangular garden with an area of 36 square meters. The side lengths must be whole meters.

      (a) List every rectangle the class could make.
      (b) Which of your rectangles needs the least fence to go around it?
      (c) How many meters of fence does that rectangle need? Show your work.
    answer: |
      (a) 1 m by 36 m, 2 m by 18 m, 3 m by 12 m, 4 m by 9 m and 6 m by 6 m.
      (b) The 6 m by 6 m square.
      (c) 6 + 6 + 6 + 6 = 24 meters. (The others need 74, 40, 30 and 26 meters.)
    explanation: |
      Three points.

      (a) 1 pt: all five rectangles from the factor pairs of 36, with no wrong ones.

      (b) 1 pt: the 6 by 6 square (or the rectangle with the smallest perimeter from the student's own list).

      (c) 1 pt: 24 meters, with work that adds four sides or uses 4 × 6.

  - slug: g4math-u01-check-q20
    type: multiple_choice
    topic_code: "4.OA.B.4"
    source: "IM K–5 Math Grade 4, Unit 1, Section B"
    points: 1
    prompt: |
      Which number has exactly two factor pairs?
    options:
      - "7"
      - "12"
      - "6"
      - "16"
    option_explanations:
      - |
        7 is prime, so it has only one factor pair: 1 and 7.
      - |
        12 has three factor pairs: 1 × 12, 2 × 6 and 3 × 4.
      - |
        Correct. 6 has the factor pairs 1 × 6 and 2 × 3, and no others.
      - |
        16 has three factor pairs: 1 × 16, 2 × 8 and 4 × 4.
    answer: 2
