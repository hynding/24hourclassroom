week: 2
unit: 1
title: "Prime and Composite Numbers, Area and Perimeter"
topics: ["4.OA.B.4", "4.MD.A.3"]
guide: guides/week-02.md
guide_description: |
  How to tell a prime number from a composite number by its factor pairs, why 1 is neither, and how to use
  the area and perimeter of a rectangle (length × width, and the distance around) to find a missing side.
flashcards_description: |
  19 cards on prime and composite numbers, the primes up to 20, testing a number for factors, the area and
  perimeter of rectangles and squares, and finding a missing side length.

flashcards:
  - front: Prime number → what it is
    back: |
      A whole number greater than 1 with exactly one factor pair: 1 and itself. 13 is prime because only 1 × 13 makes 13.
    topic_code: "4.OA.B.4"
  - front: Composite number → what it is
    back: |
      A whole number greater than 1 with more than one factor pair. 15 is composite because 1 × 15 = 15 and 3 × 5 = 15.
    topic_code: "4.OA.B.4"
  - front: The number 1 → prime or composite?
    back: |
      Neither. 1 has only one factor, itself. A prime needs exactly two different factors, 1 and the number.
    topic_code: "4.OA.B.4"
  - front: The number 2 → what is special about it
    back: |
      It is the only even prime number. Every other even number has 2 as a factor, so it is composite.
    topic_code: "4.OA.B.4"
  - front: Prime numbers up to 20 → the list
    back: |
      2, 3, 5, 7, 11, 13, 17 and 19.
    topic_code: "4.OA.B.4"
  - front: 21 → prime or composite?
    back: |
      Composite. 3 × 7 = 21, so it has a factor pair besides 1 and 21.
    topic_code: "4.OA.B.4"
  - front: 51 → prime or composite?
    back: |
      Composite, even though it looks prime. 3 × 17 = 51.
    topic_code: "4.OA.B.4"
  - front: Testing whether a number is prime → how
    back: |
      Try small factors in order: 2, 3, 5, 7. If one of them multiplies by a whole number to make the number, it is composite. If none do, check up to where the pairs would repeat.
    topic_code: "4.OA.B.4"
  - front: Prime number of square tiles → how many rectangles
    back: |
      Just one: a single row. 7 tiles make only a 1 by 7 rectangle.
    topic_code: "4.OA.B.4"
  - front: Odd number → is it always prime?
    back: |
      No. 9, 15, 21, 25 and 27 are odd but composite. Being odd only tells you 2 is not a factor.
    topic_code: "4.OA.B.4"
  - front: Area of a rectangle → the formula
    back: |
      Area = length × width. A rectangle 6 cm long and 4 cm wide has an area of 24 square centimeters.
    topic_code: "4.MD.A.3"
  - front: Perimeter of a rectangle → the formula
    back: |
      Add all four sides, or use 2 × length + 2 × width. A 6 cm by 4 cm rectangle has a perimeter of 6 + 4 + 6 + 4 = 20 cm.
    topic_code: "4.MD.A.3"
  - front: Area → the kind of units it uses
    back: |
      Square units: square centimeters, square meters, square feet. Area counts squares that cover the shape.
    topic_code: "4.MD.A.3"
  - front: Perimeter → the kind of units it uses
    back: |
      Length units: centimeters, meters, feet. Perimeter measures the distance around, like a fence.
    topic_code: "4.MD.A.3"
  - front: Missing side from the area → how to find it
    back: |
      Divide the area by the side you know, or ask "what times the known side makes the area?" Area 35 square m, width 5 m: 5 × 7 = 35, so the length is 7 m.
    topic_code: "4.MD.A.3"
  - front: Missing side from the perimeter → how to find it
    back: |
      Half the perimeter is one length plus one width. Perimeter 26 ft, length 9 ft: half is 13, and 13 − 9 = 4, so the width is 4 ft.
    topic_code: "4.MD.A.3"
  - front: Square with sides of 7 cm → its area and perimeter
    back: |
      Area 7 × 7 = 49 square centimeters. Perimeter 4 × 7 = 28 centimeters.
    topic_code: "4.MD.A.3"
  - front: Same area, different perimeter → an example
    back: |
      12 square tiles as 1 by 12 have a perimeter of 26 units; as 3 by 4 they have a perimeter of 14 units. Long, thin rectangles have bigger perimeters.
    topic_code: "4.MD.A.3"
  - front: Area and factor pairs → the link
    back: |
      The side lengths of a rectangle with whole-number sides are a factor pair of its area. Area 20 square units can be 1 by 20, 2 by 10 or 4 by 5.
    topic_code: "4.MD.A.3"

quiz:
  description: |
    14 questions · about 30 minutes · prime and composite numbers, why 1 is neither, the area and perimeter of
    rectangles, and finding a missing side length, with review of factors and multiples from week 1. Multiple
    choice, select-all, true/false and number answers are graded at once; the fill-in word is matched
    automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w02-q01
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      prompt: |
        Zara has four cards: 21, 27, 29 and 33. Which card shows a prime number?
      options:
        - "21"
        - "27"
        - "29"
        - "33"
      option_explanations:
        - |
          21 is composite. Besides 1 × 21, it has the factor pair 3 × 7.
        - |
          27 is composite. Besides 1 × 27, it has the factor pair 3 × 9.
        - |
          Correct. 2, 3, 5 and 7 are not factors of 29, so its only factor pair is 1 and 29.
        - |
          33 is composite. Besides 1 × 33, it has the factor pair 3 × 11.
      answer: 2

    - slug: g4math-w02-q02
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      prompt: |
        A team's jersey numbers are 2, 13, 31 and 39. Which jersey number is composite?
      options:
        - "2"
        - "13"
        - "31"
        - "39"
      option_explanations:
        - |
          2 is prime: its only factor pair is 1 and 2. It is the only even prime number.
        - |
          13 is prime: 1 × 13 is its only factor pair.
        - |
          31 is prime: 2, 3, 5 and 7 are not factors of 31, so 1 × 31 is its only pair.
        - |
          Correct. 39 has two factor pairs, 1 × 39 and 3 × 13, so it is composite.
      answer: 3

    - slug: g4math-w02-q03
      type: true_false
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      prompt: |
        True or false: 1 is a prime number.
      answer: false
      explanation: |
        False. A prime number has exactly two different factors, 1 and itself. The number 1 has only one factor, so it is neither prime nor composite.

    - slug: g4math-w02-q04
      type: multi_select
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Select all the prime numbers.
      options:
        - "5"
        - "9"
        - "11"
        - "15"
        - "23"
      option_explanations:
        - |
          Prime. The only way to make 5 by multiplying whole numbers is 1 × 5.
        - |
          Not prime. 9 is odd, but 3 × 3 = 9, so it has a second factor pair.
        - |
          Prime. 11 has only one factor pair, 1 and 11.
        - |
          Not prime. 15 ends in 5, so 5 is a factor: 3 × 5 = 15.
        - |
          Prime. 2, 3 and 5 do not go into 23, so its only factor pair is 1 and 23.
      answer: [0, 2, 4]

    - slug: g4math-w02-q05
      type: multiple_choice
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      stimulus: |
        Use the rectangle. It is 9 centimeters long and 5 centimeters wide.
      figure: figures/w02-rectangle-9-by-5.svg
      figure_alt: "A rectangle. The bottom side is labeled 9 cm and the left side is labeled 5 cm."
      prompt: |
        What is the perimeter of the rectangle?
      options:
        - "28 centimeters"
        - "45 centimeters"
        - "14 centimeters"
        - "23 centimeters"
      option_explanations:
        - |
          Correct. The perimeter is the distance all the way around: 9 + 5 + 9 + 5 = 28 centimeters.
        - |
          45 is 9 × 5, which is the area in square centimeters, not the distance around.
        - |
          14 is 9 + 5, which is only two of the four sides. Add the other length and width too.
        - |
          23 is 9 + 5 + 9, which leaves out the last side of 5 centimeters.
      answer: 0

    - slug: g4math-w02-q06
      type: numeric
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      stimulus: |
        Use the rectangle. It is 9 centimeters long and 5 centimeters wide.
      prompt: |
        What is the area of the rectangle in square centimeters?
      answer: { value: 45, tolerance: 0 }
      explanation: |
        Area = length × width = 9 × 5 = 45 square centimeters. (Think of 5 rows of 9 square centimeters.)

    - slug: g4math-w02-q07
      type: numeric
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      figure: figures/w02-garden-56.svg
      figure_alt: "A rectangle. The left side is labeled 7 ft. The top side is labeled with a question mark. Written inside: Area = 56 square feet."
      prompt: |
        The garden is a rectangle with an area of 56 square feet. One side is 7 feet. How many feet long is the side marked with a question mark?
      answer: { value: 8, tolerance: 0 }
      explanation: |
        The side lengths multiply to give the area. 7 × 8 = 56, so the missing side is 8 feet. (Or 56 ÷ 7 = 8.)

    - slug: g4math-w02-q08
      type: multiple_choice
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      figure: figures/w02-two-rectangles.svg
      figure_alt: "Two rectangles of square tiles. Rectangle A has 2 rows of 8 tiles. Rectangle B has 4 rows of 4 tiles, a square."
      prompt: |
        Each tile is 1 square unit. Which sentence about rectangles A and B is true?
      options:
        - "Both have an area of 16 square units, and B has the greater perimeter."
        - "Both have an area of 16 square units, and A has the greater perimeter."
        - "A has a greater area than B, because it is longer."
        - "A and B have the same perimeter, because they have the same area."
      option_explanations:
        - |
          The areas are both 16, but B's perimeter is 4 + 4 + 4 + 4 = 16 units and A's is 8 + 2 + 8 + 2 = 20 units, so A's is greater.
        - |
          Correct. 2 × 8 = 16 and 4 × 4 = 16. A's perimeter is 8 + 2 + 8 + 2 = 20 units; B's is 16 units.
        - |
          A is longer, but it is also thinner. Counting tiles, both have 16, so the areas are equal.
        - |
          The same area does not mean the same perimeter. A's perimeter is 20 units and B's is 16 units.
      answer: 1

    - slug: g4math-w02-q09
      type: fill_blank
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      prompt: |
        A whole number greater than 1 that has more than one factor pair is called a ____ number.
      answer: ["composite", "a composite"]
      explanation: |
        Composite. For example, 10 has the factor pairs 1 × 10 and 2 × 5, so it is composite. A number with only one factor pair (1 and itself) is prime.

    - slug: g4math-w02-q10
      type: multiple_choice
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      prompt: |
        A rectangular rug has a perimeter of 24 feet. One side is 8 feet long. How long is the side next to it?
      options:
        - "4 feet"
        - "16 feet"
        - "3 feet"
        - "8 feet"
      option_explanations:
        - |
          Correct. Two 8-foot sides use 16 feet, which leaves 24 − 16 = 8 feet for the two other sides, so each is 4 feet. Check: 8 + 4 + 8 + 4 = 24.
        - |
          16 is 24 − 8, which takes away only one of the two 8-foot sides. A rectangle has two lengths and two widths.
        - |
          3 is 24 ÷ 8. Dividing works for area, but 24 feet is the distance around, not the area.
        - |
          If every side were 8 feet, the perimeter would be 32 feet, not 24.
      answer: 0

    - slug: g4math-w02-q11
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      prompt: |
        Which number is a multiple of 6 AND a factor of 36?
      options:
        - "9"
        - "12"
        - "24"
        - "30"
      option_explanations:
        - |
          9 is a factor of 36 (9 × 4 = 36), but it is not a multiple of 6: counting by 6s skips from 6 to 12.
        - |
          Correct. 12 = 6 × 2, so it is a multiple of 6, and 12 × 3 = 36, so it is a factor of 36.
        - |
          24 is a multiple of 6, but it is not a factor of 36: 24 × 1 = 24 and 24 × 2 = 48.
        - |
          30 is a multiple of 6 (6 × 5), but no whole number times 30 makes 36.
      answer: 1

    - slug: g4math-w02-q12
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      prompt: |
        Tomás says 57 is prime because it is odd. Which reply is correct?
      options:
        - "Tomás is right: odd numbers are prime."
        - "57 is prime because 7 is prime."
        - "57 is composite because 3 × 19 = 57."
        - "57 is composite because 5 + 7 = 12."
      option_explanations:
        - |
          Being odd only means 2 is not a factor. Many odd numbers, like 9 and 15, are composite.
        - |
          The last digit does not decide whether a number is prime. We have to look for factor pairs of 57 itself.
        - |
          Correct. 57 has the factor pairs 1 × 57 and 3 × 19, so it has more than one pair and is composite.
        - |
          Adding the digits does not give a factor pair. Composite means there is a pair that multiplies to 57.
      answer: 2

    - slug: g4math-w02-q13
      type: numeric
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      prompt: |
        A square sandbox has sides that are each 9 feet long. What is its perimeter in feet?
      answer: { value: 36, tolerance: 0 }
      explanation: |
        A square has 4 equal sides. 9 + 9 + 9 + 9 = 4 × 9 = 36 feet.

    - slug: g4math-w02-q14
      type: short_answer
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 2
      prompt: |
        Mei uses all 24 of her square tiles to make a rectangle that is 3 tiles wide. Each tile side is 1 unit.

        (a) How many tiles long is the rectangle?
        (b) What is the perimeter of the rectangle? Show your work.
      answer: |
        (a) 8 tiles long, because 3 × 8 = 24.
        (b) 3 + 8 + 3 + 8 = 22 units.
      explanation: |
        Two points.

        (a) 1 pt: 8 tiles (from 3 × 8 = 24 or 24 ÷ 3 = 8).

        (b) 1 pt: 22 units, with work that adds all four sides or uses 2 × 8 + 2 × 3. Give this point if the perimeter is correct for a wrong length from (a).
