week: 1
unit: 1
title: "Factor Pairs and Multiples"
topics: ["4.OA.B.4"]
guide: guides/week-01.md
guide_description: |
  How rectangles made of square tiles show factor pairs, how to find every factor pair of a number without
  missing any, what a multiple is, and how factors and multiples are two sides of the same multiplication fact.
flashcards_description: |
  19 cards on factors, factor pairs, multiples, rectangles of a given area, a system for finding every factor
  pair, and quick checks for 2, 5 and 10 as factors.

flashcards:
  - front: Factor → what it is
    back: |
      A whole number that multiplies with another whole number to make a given number. 4 is a factor of 28 because 4 × 7 = 28.
    topic_code: "4.OA.B.4"
  - front: Factor pair → what it is
    back: |
      Two whole numbers that multiply to make a number. 3 and 8 are a factor pair of 24, because 3 × 8 = 24.
    topic_code: "4.OA.B.4"
  - front: Multiple → what it is
    back: |
      The result of multiplying a number by a whole number. The multiples of 6 are 6, 12, 18, 24, 30 and so on: the numbers you say when you count by 6s.
    topic_code: "4.OA.B.4"
  - front: Factor and multiple → how they are linked
    back: |
      They come from the same fact. 5 × 7 = 35 means 5 and 7 are factors of 35, and 35 is a multiple of 5 and a multiple of 7.
    topic_code: "4.OA.B.4"
  - front: Rectangle of square tiles → what it shows about factors
    back: |
      Its number of rows and number of columns are a factor pair of the number of tiles. A rectangle 4 rows by 5 columns uses 20 tiles, so 4 and 5 are a factor pair of 20.
    topic_code: "4.OA.B.4"
  - front: Rectangles with an area of 18 square units → the whole-number side lengths
    back: |
      1 by 18, 2 by 9 and 3 by 6. These are the three factor pairs of 18.
    topic_code: "4.OA.B.4"
  - front: Factor pairs of 36 → all of them
    back: |
      1 and 36, 2 and 18, 3 and 12, 4 and 9, 6 and 6.
    topic_code: "4.OA.B.4"
  - front: Factors of 20 → the full list
    back: |
      1, 2, 4, 5, 10 and 20. They come from the pairs 1 × 20, 2 × 10 and 4 × 5.
    topic_code: "4.OA.B.4"
  - front: Finding every factor pair → a system that misses nothing
    back: |
      Start with 1, then try 2, 3, 4 and so on, in order. Write each pair that works. Stop when the numbers you are trying meet the numbers you already found.
    topic_code: "4.OA.B.4"
  - front: The number 1 → why it is a factor of every whole number
    back: |
      Any number times 1 is itself, so 1 and the number always make a factor pair: 1 × 45 = 45.
    topic_code: "4.OA.B.4"
  - front: A number and itself → is it a factor?
    back: |
      Yes. Every whole number is a factor of itself, because the number × 1 = the number.
    topic_code: "4.OA.B.4"
  - front: Is 7 a factor of 42? → how to check
    back: |
      Ask whether 7 times a whole number makes 42. 7 × 6 = 42, so yes. You can also count by 7s and see if you land on 42.
    topic_code: "4.OA.B.4"
  - front: Multiples of 4 up to 40 → the list
    back: |
      4, 8, 12, 16, 20, 24, 28, 32, 36, 40.
    topic_code: "4.OA.B.4"
  - front: Square number of tiles → what is special about its rectangles
    back: |
      One of its rectangles is a square. 25 tiles can make a 5 by 5 square, because 5 × 5 = 25: the factor pair uses the same number twice.
    topic_code: "4.OA.B.4"
  - front: Even number → a factor it always has
    back: |
      2. Every even number can be split into 2 equal groups, so 2 is a factor. 2 is a factor of 38 because 2 × 19 = 38.
    topic_code: "4.OA.B.4"
  - front: Number ending in 0 or 5 → a factor it always has
    back: |
      5. Numbers that end in 0 or 5 are the numbers you say when you count by 5s, so they are multiples of 5.
    topic_code: "4.OA.B.4"
  - front: Number ending in 0 → three factors it always has
    back: |
      2, 5 and 10. For example 70 = 2 × 35 = 5 × 14 = 10 × 7.
    topic_code: "4.OA.B.4"
  - front: A 3 by 8 rectangle and an 8 by 3 rectangle → same or different factor pair?
    back: |
      The same pair, 3 and 8, just turned. When you list factor pairs, write each pair only once.
    topic_code: "4.OA.B.4"
  - front: Common multiple → what it is
    back: |
      A number that is a multiple of two numbers at once. 12 is a common multiple of 3 and 4, because it is on both counting lists.
    topic_code: "4.OA.B.4"

quiz:
  description: |
    14 questions · about 30 minutes · factor pairs from rectangles of square tiles, listing all the factors of a
    number, multiples and skip-counting, and how factors and multiples are linked. Multiple choice, select-all,
    true/false and number answers are graded at once; the fill-in word is matched automatically; the short
    answer is checked by your teacher.
  questions:
    - slug: g4math-w01-q01
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      figure: figures/w01-tile-rectangles.svg
      figure_alt: "Two rectangles made of square tiles. Rectangle A is 1 row of 12 tiles. Rectangle B is 2 rows of 6 tiles. Each rectangle uses 12 tiles."
      prompt: |
        Noor made rectangles A and B, each with all 12 of her square tiles. Which other rectangle can she make with all 12 tiles?
      options:
        - "4 tiles by 4 tiles"
        - "5 tiles by 7 tiles"
        - "3 tiles by 4 tiles"
        - "3 tiles by 5 tiles"
      option_explanations:
        - |
          A 4 by 4 square uses 4 × 4 = 16 tiles. That is 4 more tiles than Noor has.
        - |
          5 + 7 = 12, but the sides of a rectangle multiply to give the number of tiles: 5 × 7 = 35 tiles.
        - |
          Correct. 3 × 4 = 12, so 3 rows of 4 tiles uses all 12 tiles. 3 and 4 are the third factor pair of 12.
        - |
          3 rows of 5 tiles uses 3 × 5 = 15 tiles, which is 3 too many. 5 is not a factor of 12.
      answer: 2

    - slug: g4math-w01-q02
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      figure: figures/w01-tiles-3-by-8.svg
      figure_alt: "A rectangle made of square tiles with 3 rows and 8 tiles in each row, 24 tiles in all."
      prompt: |
        This rectangle is made of 24 square tiles. Which factor pair of 24 does it show?
      options:
        - "3 and 8"
        - "4 and 6"
        - "3 and 21"
        - "2 and 12"
      option_explanations:
        - |
          Correct. The rectangle has 3 rows of 8 tiles, and 3 × 8 = 24.
        - |
          4 and 6 is a factor pair of 24, but this rectangle has 3 rows and 8 columns, not 4 rows of 6.
        - |
          3 + 21 = 24, but factors multiply to make the number. 3 × 21 = 63, not 24.
        - |
          2 and 12 is another factor pair of 24, but the picture shows 3 rows, not 2.
      answer: 0

    - slug: g4math-w01-q03
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      prompt: |
        Which list shows ALL the factors of 18?
      options:
        - "2, 3, 6, 9"
        - "18, 36, 54, 72"
        - "1, 2, 3, 4, 6, 9, 18"
        - "1, 2, 3, 6, 9, 18"
      option_explanations:
        - |
          These are factors of 18, but 1 and 18 are missing. 1 × 18 = 18, so 1 and 18 are a factor pair too.
        - |
          These are multiples of 18 (18 × 1, 18 × 2, 18 × 3, 18 × 4), not factors.
        - |
          4 is not a factor of 18. Counting by 4s goes 16, 20 and skips 18.
        - |
          Correct. The factor pairs are 1 × 18, 2 × 9 and 3 × 6, so the factors are 1, 2, 3, 6, 9 and 18.
      answer: 3

    - slug: g4math-w01-q04
      type: multi_select
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 2
      partial_credit: true
      prompt: |
        Which numbers are factors of 30? Select all that apply.
      options:
        - "2"
        - "4"
        - "5"
        - "15"
        - "60"
      option_explanations:
        - |
          A factor. 30 is even, so it splits into 2 equal groups: 2 × 15 = 30.
        - |
          Not a factor. Counting by 4s goes 28, 32 and skips 30, so 30 tiles cannot make rows of 4.
        - |
          A factor. 30 ends in 0, so it is on the 5s list: 5 × 6 = 30.
        - |
          A factor. 15 × 2 = 30, so 15 and 2 are a factor pair of 30.
        - |
          Not a factor. 60 is bigger than 30; it is a multiple of 30, because 30 × 2 = 60.
      answer: [0, 2, 3]

    - slug: g4math-w01-q05
      type: true_false
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      prompt: |
        True or false: 8 is a factor of 4.
      answer: false
      explanation: |
        False. It is the other way around: 4 is a factor of 8, because 4 × 2 = 8. No whole number times 8 makes 4, so 8 is a multiple of 4, not a factor of it.

    - slug: g4math-w01-q06
      type: numeric
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      figure: figures/w01-jumps-of-6.svg
      figure_alt: "A number line labeled 0, 6, 12, 18, 24, 30 and 36, with the marks spaced evenly. Four curved arrows jump from 0 to 6, 6 to 12, 12 to 18 and 18 to 24."
      prompt: |
        A frog starts at 0 and makes jumps that are all the same size, as shown. If it keeps jumping, which number will it land on after 9 jumps?
      answer: { value: 54, tolerance: 0 }
      explanation: |
        Each jump is 6, so the frog lands on the multiples of 6. After 9 jumps it is at 9 × 6 = 54. (Counting by 6s: 6, 12, 18, 24, 30, 36, 42, 48, 54.)

    - slug: g4math-w01-q07
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      prompt: |
        Dev counts by 7s starting at 7. Which of these numbers will he say?
      options:
        - "17"
        - "49"
        - "27"
        - "74"
      option_explanations:
        - |
          17 ends in 7, but that does not make it a multiple of 7. Counting by 7s goes 14, 21 and skips 17.
        - |
          Correct. 7 × 7 = 49, so 49 is on the list of multiples of 7.
        - |
          27 ends in 7, but 7 × 3 = 21 and 7 × 4 = 28, so 27 is skipped when you count by 7s.
        - |
          74 has a 7 in it, but 7 × 10 = 70 and 7 × 11 = 77. 74 falls between them.
      answer: 1

    - slug: g4math-w01-q08
      type: fill_blank
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      prompt: |
        Because 6 × 9 = 54, the number 54 is a ____ of 6.
      answer: ["multiple", "a multiple", "multiples"]
      explanation: |
        54 is a multiple of 6: it is a number you say when you count by 6s. The same fact also tells us that 6 is a factor of 54.

    - slug: g4math-w01-q09
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      prompt: |
        Which equation shows that 9 is a factor of 63?
      options:
        - "63 + 9 = 72"
        - "9 × 6 = 63"
        - "63 − 9 = 54"
        - "9 × 7 = 63"
      option_explanations:
        - |
          This is a true sum, but adding does not show a factor. A factor must multiply by a whole number to make 63.
        - |
          This equation is not true: 9 × 6 = 54. It is one group of 9 short of 63.
        - |
          This subtraction is true, but taking 9 away does not show that 9 multiplies to make 63.
        - |
          Correct. 9 times the whole number 7 makes 63, so 9 (and 7) are factors of 63.
      answer: 3

    - slug: g4math-w01-q10
      type: numeric
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      prompt: |
        A class garden is a rectangle with an area of 32 square meters. It is 4 meters wide. How many meters long is it?
      answer: { value: 8, tolerance: 0 }
      explanation: |
        The side lengths are a factor pair of the area. 4 × 8 = 32, so the garden is 8 meters long. (Or 32 ÷ 4 = 8.)

    - slug: g4math-w01-q11
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      prompt: |
        Hana listed the factor pairs of 40: 1 and 40, 2 and 20, 4 and 10, 5 and 8. Is her list complete?
      options:
        - "Yes. Those are all the factor pairs of 40."
        - "No. She is missing 3 and 13."
        - "No. She is missing 8 and 5."
        - "No. She is missing 6 and 7."
      option_explanations:
        - |
          Correct. 3, 6 and 7 do not go into 40, and after 5 and 8 the pairs would repeat (8 and 5), so her list has every pair.
        - |
          3 × 13 = 39, not 40. 3 is not a factor of 40, so there is no pair with 3.
        - |
          8 and 5 is the same pair as 5 and 8, just turned around. Hana already has it.
        - |
          6 + 7 = 13 and 6 × 7 = 42, so 6 and 7 are not a factor pair of 40.
      answer: 0

    - slug: g4math-w01-q12
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      prompt: |
        Mr. Osei is setting up 20 chairs in equal rows, with no chairs left over. Which number of rows will NOT work?
      options:
        - "2 rows"
        - "4 rows"
        - "6 rows"
        - "5 rows"
      option_explanations:
        - |
          2 rows works: 2 rows of 10 chairs is 20, because 2 × 10 = 20.
        - |
          4 rows works: 4 rows of 5 chairs is 20, because 4 × 5 = 20.
        - |
          Correct. 6 is not a factor of 20. 6 rows of 3 is 18 and 6 rows of 4 is 24, so 6 rows cannot hold exactly 20 chairs.
        - |
          5 rows works: 5 rows of 4 chairs is 20, because 5 × 4 = 20.
      answer: 2

    - slug: g4math-w01-q13
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      prompt: |
        Which number is a multiple of 4 AND a multiple of 6?
      options:
        - "10"
        - "12"
        - "18"
        - "20"
      option_explanations:
        - |
          10 is 4 + 6. It is not on the 4s list (8, 12) or on the 6s list (6, 12).
        - |
          Correct. 4 × 3 = 12 and 6 × 2 = 12, so 12 is on both counting lists. It is a common multiple of 4 and 6.
        - |
          18 is a multiple of 6 (6 × 3), but counting by 4s goes 16, 20 and skips 18.
        - |
          20 is a multiple of 4 (4 × 5), but counting by 6s goes 18, 24 and skips 20.
      answer: 1

    - slug: g4math-w01-q14
      type: short_answer
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 2
      prompt: |
        Priya has 16 square tiles. She wants to make rectangles that use all 16 tiles.

        (a) List every rectangle she can make. Give the side lengths in tiles.
        (b) Explain how you know you found all of them.
      answer: |
        (a) 1 by 16, 2 by 8 and 4 by 4.
        (b) I tried each number in order. 1 × 16 = 16, 2 × 8 = 16 and 4 × 4 = 16 work. 3 does not work (3 × 5 = 15, 3 × 6 = 18). After 4 the pairs repeat (8 by 2 is the same as 2 by 8), so there are no more.
      explanation: |
        Two points.

        (a) 1 pt: all three rectangles, 1 by 16, 2 by 8 and 4 by 4, and no wrong ones. (16 by 1 written as well as 1 by 16 is fine.)

        (b) 1 pt: a reason the list is complete, such as trying 1, 2, 3, 4 in order and noticing the pairs start to repeat, or showing that 3 is not a factor of 16.
