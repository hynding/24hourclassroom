week: 26
unit: 8
title: "Sorting Triangles and Quadrilaterals by Sides and Angles"
topics: ["4.G.A.2"]
guide: guides/week-26.md
guide_description: |
  How to sort shapes by their sides (equal, parallel, perpendicular) and their angles (right, acute, obtuse):
  right, acute and obtuse triangles, equilateral, isosceles and scalene triangles, and the family of
  quadrilaterals, where every square is a rectangle, a rhombus and a parallelogram.
flashcards_description: |
  20 cards on right, acute and obtuse triangles, sorting triangles by their sides, parallel and perpendicular
  sides, parallelograms, rectangles, rhombuses and squares, and which shape names include which.

flashcards:
  - front: Right triangle → what makes a triangle one
    back: |
      It has one right angle, a square corner of 90°. The other two angles are acute.
    topic_code: "4.G.A.2"
  - front: Acute triangle → what makes a triangle one
    back: |
      All three of its angles are acute, which means each one is less than 90°.
    topic_code: "4.G.A.2"
  - front: Obtuse triangle → what makes a triangle one
    back: |
      One of its angles is obtuse: more than 90° but less than 180°. The other two angles are acute.
    topic_code: "4.G.A.2"
  - front: Triangle with two right angles → can you draw one?
    back: |
      No. Both of the other sides would stand straight up from the same side, so they would be parallel and never meet to close the triangle.
    topic_code: "4.G.A.2"
  - front: Triangle with two obtuse angles → can you draw one?
    back: |
      No. The two sides would lean away from each other and never meet. A triangle has at most one angle that is right or obtuse.
    topic_code: "4.G.A.2"
  - front: Equilateral triangle → what makes a triangle one
    back: |
      All three sides are the same length. Its three angles are equal too, and each one is acute.
    topic_code: "4.G.A.2"
  - front: Isosceles triangle → what makes a triangle one
    back: |
      At least two of its sides are the same length. So an equilateral triangle is also isosceles.
    topic_code: "4.G.A.2"
  - front: Scalene triangle → what makes a triangle one
    back: |
      No two of its sides are the same length. All three sides are different.
    topic_code: "4.G.A.2"
  - front: Right triangle with two equal sides → is it possible?
    back: |
      Yes. Cut a square from one corner to the opposite corner. Each half is a right triangle with two equal sides, so it is right and isosceles.
    topic_code: "4.G.A.2"
  - front: Parallel sides in a shape → how to spot them
    back: |
      Two sides that point the same way and stay the same distance apart. If you made them longer, they would never meet.
    topic_code: "4.G.A.2"
  - front: Perpendicular sides in a shape → how to spot them
    back: |
      Two sides that meet at a right angle. A small square drawn in the corner shows it.
    topic_code: "4.G.A.2"
  - front: Parallelogram → what makes a shape one
    back: |
      It is a quadrilateral with 2 pairs of parallel sides. Its opposite sides are also the same length.
    topic_code: "4.G.A.2"
  - front: Rectangle → its sides and angles
    back: |
      4 right angles. Its opposite sides are parallel and the same length, so every rectangle is a parallelogram.
    topic_code: "4.G.A.2"
  - front: Rhombus → its sides and angles
    back: |
      4 sides of the same length. Its opposite sides are parallel, so every rhombus is a parallelogram. Its angles do not have to be right angles.
    topic_code: "4.G.A.2"
  - front: Square → its sides and angles
    back: |
      4 sides of the same length and 4 right angles. So a square is a rectangle, a rhombus and a parallelogram all at once.
    topic_code: "4.G.A.2"
  - front: Parallelogram → is it always a rectangle?
    back: |
      No. A parallelogram can lean over so that it has two acute angles and two obtuse angles. Only a parallelogram with right angles is a rectangle.
    topic_code: "4.G.A.2"
  - front: Quadrilateral with no parallel sides → is it still a quadrilateral?
    back: |
      Yes. Any closed shape with exactly 4 straight sides is a quadrilateral, whether or not its sides are parallel.
    topic_code: "4.G.A.2"
  - front: Perpendicular sides in a rectangle → how many pairs
    back: |
      4 pairs: at every corner, the two sides that meet are perpendicular, because every corner is a right angle.
    topic_code: "4.G.A.2"
  - front: Sorting shapes → what to check
    back: |
      Sides: how many, which are equal, which are parallel, which are perpendicular. Angles: right, acute or obtuse. Color, size and which way it is turned do not matter.
    topic_code: "4.G.A.2"
  - front: Square turned onto a corner → is it still a square?
    back: |
      Yes. Turning a shape does not change its sides or its angles, so it keeps every one of its names.
    topic_code: "4.G.A.2"

quiz:
  description: |
    14 questions · about 25 minutes · right, acute and obtuse triangles, parallel and perpendicular sides,
    parallelograms, rectangles, rhombuses and squares, plus review of angle types, unknown angles and
    multiplication. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in
    word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w26-q01
      type: multiple_choice
      topic_code: "4.G.A.2"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 1
      stimulus: |
        Use the four triangles. A small square in a corner marks a right angle.
      figure: figures/w26-four-triangles.svg
      figure_alt: "Four triangles in a row. Shape 1 has a right angle mark in its bottom left corner; its other two angles are acute. Shape 2 is long and flat with one obtuse angle at its bottom right corner, much wider than a square corner; its other two angles are acute. Shape 3 has three equal sides and three equal acute angles. Shape 4 has three sides of different lengths, and all three of its angles are acute."
      prompt: |
        Which shape is a right triangle?
      options:
        - "Shape 1"
        - "Shape 2"
        - "Shape 3"
        - "Shape 4"
      option_explanations:
        - |
          Correct. Shape 1 has a right angle mark in one corner, and a triangle with a right angle is a right triangle.
        - |
          Shape 2's widest angle is more than a right angle, so it is obtuse. Shape 2 is an obtuse triangle.
        - |
          Shape 3's angles are all equal and all smaller than a square corner, so it is an acute triangle.
        - |
          Shape 4 has three angles that are all smaller than a square corner. It is an acute triangle, not a right triangle.
      answer: 0

    - slug: g4math-w26-q02
      type: multi_select
      topic_code: "4.G.A.2"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 2
      partial_credit: true
      stimulus: |
        Use the four triangles. A small square in a corner marks a right angle.
      prompt: |
        Which shapes are acute triangles? Select all that apply.
      options:
        - "Shape 1"
        - "Shape 2"
        - "Shape 3"
        - "Shape 4"
      option_explanations:
        - |
          No. Shape 1 has two acute angles, but its third angle is a right angle, so it is a right triangle.
        - |
          No. Shape 2 has one obtuse angle, so it is an obtuse triangle, even though its other two angles are acute.
        - |
          Yes. All three angles of Shape 3 are smaller than a right angle, so it is an acute triangle.
        - |
          Yes. All three angles of Shape 4 are smaller than a right angle. Its sides are all different, but that does not change the angle name.
      answer: [2, 3]

    - slug: g4math-w26-q03
      type: multiple_choice
      topic_code: "4.G.A.2"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 1
      stimulus: |
        Use the four triangles. A small square in a corner marks a right angle.
      prompt: |
        Which shape is an obtuse triangle?
      options:
        - "Shape 1"
        - "Shape 2"
        - "Shape 3"
        - "Shape 4"
      option_explanations:
        - |
          Shape 1 has a right angle, which is exactly 90°. An obtuse angle must be more than 90°, so Shape 1 is a right triangle.
        - |
          Correct. The angle at the bottom right of Shape 2 opens wider than a square corner, so it is obtuse.
        - |
          Shape 3 has three equal angles, and each one is smaller than a square corner, so none of them is obtuse.
        - |
          Shape 4 may look wide, but each of its three angles is still smaller than a square corner, so it is acute.
      answer: 1

    - slug: g4math-w26-q04
      type: multiple_choice
      topic_code: "4.G.A.2"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 1
      prompt: |
        A triangle has angles that measure 90°, 50° and 40°. What kind of triangle is it?
      options:
        - "Acute triangle"
        - "Obtuse triangle"
        - "Right triangle"
        - "It cannot be a triangle"
      option_explanations:
        - |
          Two of the angles, 50° and 40°, are acute, but an acute triangle needs all three angles to be acute. The 90° angle is not.
        - |
          An obtuse triangle needs an angle of more than 90°. The biggest angle here is exactly 90°, which is a right angle.
        - |
          Correct. One angle is exactly 90°, which is a right angle, so this is a right triangle.
        - |
          This triangle can be drawn: a right angle with two acute angles is a right triangle, like half of a rectangle cut corner to corner.
      answer: 2

    - slug: g4math-w26-q05
      type: true_false
      topic_code: "4.G.A.2"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 1
      prompt: |
        True or false: a triangle can have two right angles.
      answer: false
      explanation: |
        False. If two corners of a triangle were right angles, the two sides going up from those corners would both stand straight up from the same side. They would be parallel and never meet, so the triangle could not close. A right triangle has exactly one right angle.

    - slug: g4math-w26-q06
      type: fill_blank
      topic_code: "4.G.A.2"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 1
      prompt: |
        A quadrilateral with 2 pairs of parallel sides is called a ____.
      answer: ["parallelogram", "a parallelogram", "parallelograms"]
      explanation: |
        A quadrilateral whose opposite sides are parallel, two pairs of them, is a parallelogram. Rectangles, rhombuses and squares are all special parallelograms.

    - slug: g4math-w26-q07
      type: multi_select
      topic_code: "4.G.A.2"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 2
      partial_credit: true
      stimulus: |
        Use the five quadrilaterals drawn on a grid of equal squares. A small square in a corner marks a right angle. Each side of Shape 3 is 5 grid units long.
      figure: figures/w26-quads-grid.svg
      figure_alt: "Five quadrilaterals on a square grid. Shape 1: 4 by 4 units, right angle marks in all 4 corners. Shape 2: 6 units long, 3 units tall, right angle marks in all 4 corners. Shape 3: level top and bottom sides joined by two slanted sides leaning right; all 4 sides are 5 units. Shape 4: level top and bottom sides 5 units long joined by two shorter slanted sides leaning right. Shape 5: a level bottom and three slanted sides, none parallel. Shapes 3, 4 and 5 have no right angles."
      prompt: |
        Which shapes have 2 pairs of parallel sides? Select all that apply.
      options:
        - "Shape 1"
        - "Shape 2"
        - "Shape 3"
        - "Shape 4"
        - "Shape 5"
      option_explanations:
        - |
          Yes. Shape 1's top and bottom sides are parallel, and so are its left and right sides.
        - |
          Yes. Shape 2's top and bottom are parallel, and its two short sides are parallel too. Every rectangle has 2 pairs.
        - |
          Yes. Shape 3's top and bottom are parallel, and its two slanted sides lean the same way, so they are parallel too.
        - |
          Yes. Shape 4's two slanted sides lean exactly the same way and stay the same distance apart, so it has 2 pairs.
        - |
          No. Shape 5's sides all point in different directions, so it has no parallel sides at all.
      answer: [0, 1, 2, 3]

    - slug: g4math-w26-q08
      type: multiple_choice
      topic_code: "4.G.A.2"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 1
      stimulus: |
        Use the five quadrilaterals drawn on a grid of equal squares. A small square in a corner marks a right angle. Each side of Shape 3 is 5 grid units long.
      prompt: |
        Which shape is a rhombus but not a square?
      options:
        - "Shape 1"
        - "Shape 2"
        - "Shape 4"
        - "Shape 3"
      option_explanations:
        - |
          Shape 1 has 4 equal sides, so it is a rhombus, but it also has 4 right angles, so it is a square.
        - |
          Shape 2's sides are 6 units and 3 units long. A rhombus needs all 4 sides to be the same length.
        - |
          Shape 4's top and bottom are 5 units, but its slanted sides are shorter, so its sides are not all equal.
        - |
          Correct. All 4 sides of Shape 3 are 5 units, so it is a rhombus, and it has no right angles, so it is not a square.
      answer: 3

    - slug: g4math-w26-q09
      type: numeric
      topic_code: "4.G.A.2"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 1
      stimulus: |
        Use the five quadrilaterals drawn on a grid of equal squares. A small square in a corner marks a right angle. Each side of Shape 3 is 5 grid units long.
      prompt: |
        How many of the five shapes have at least one right angle?
      answer: { value: 2, tolerance: 0 }
      explanation: |
        Only Shapes 1 and 2 have right angle marks, and they have 4 each. Shapes 3 and 4 lean over, so their angles are acute and obtuse, and Shape 5 has no square corners. So 2 shapes have a right angle.

    - slug: g4math-w26-q10
      type: multiple_choice
      topic_code: "4.G.A.2"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 1
      prompt: |
        Which sentence is always true?
      options:
        - "Every rhombus is a square."
        - "Every parallelogram is a rectangle."
        - "A rectangle has no parallel sides."
        - "Every square is a rectangle."
      option_explanations:
        - |
          A rhombus only needs 4 equal sides. A rhombus that leans over has no right angles, so it is not a square.
        - |
          A parallelogram only needs 2 pairs of parallel sides. One that leans over has no right angles, so it is not a rectangle.
        - |
          A rectangle's opposite sides are parallel, so it has 2 pairs of parallel sides. It is a kind of parallelogram.
        - |
          Correct. A rectangle needs 4 right angles, and a square always has 4 right angles, so every square is a rectangle.
      answer: 3

    - slug: g4math-w26-q11
      type: multiple_choice
      topic_code: "4.MD.C.5"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      prompt: |
        Review: which angle measure is an obtuse angle?
      options:
        - "135°"
        - "45°"
        - "90°"
        - "180°"
      option_explanations:
        - |
          Correct. 135° is more than a right angle (90°) and less than a straight angle (180°), so it is obtuse.
        - |
          45° is less than 90°, so it is an acute angle. It is half of a right angle.
        - |
          90° is exactly a right angle. An obtuse angle has to be more than 90°.
        - |
          180° makes a straight line, so it is a straight angle. An obtuse angle is less than 180°.
      answer: 0

    - slug: g4math-w26-q12
      type: numeric
      topic_code: "4.MD.C.7"
      source: "IM K–5 Math Grade 4, Unit 7, Section C"
      points: 1
      prompt: |
        Review: a ray splits a right angle into two smaller angles. One of them measures 35°. What does the other angle measure, in degrees?
      answer: { value: 55, tolerance: 0 }
      explanation: |
        A right angle measures 90°, and the two parts add up to it. 90 − 35 = 55, so the other angle measures 55°.

    - slug: g4math-w26-q13
      type: numeric
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      prompt: |
        Review: a mosaic on the gym wall has 6 rows of triangle tiles with 124 tiles in each row. How many triangle tiles are there in all?
      answer: { value: 744, tolerance: 0 }
      explanation: |
        6 × 124 = 6 × 100 + 6 × 20 + 6 × 4 = 600 + 120 + 24 = 744 tiles.

    - slug: g4math-w26-q14
      type: short_answer
      topic_code: "4.G.A.2"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 2
      prompt: |
        Leo says, "My shape has 4 right angles, so it must be a square."

        (a) Is Leo right? Explain.
        (b) Draw or describe a shape with 4 right angles that is not a square.
      answer: |
        (a) No. 4 right angles make a shape a rectangle. It is a square only if its 4 sides are also all the same length.
        (b) A rectangle 7 cm long and 2 cm wide. It has 4 right angles, but its sides are 7, 2, 7 and 2 cm, so they are not all equal and it is not a square.
      explanation: |
        Two points.

        (a) 1 pt: says Leo is not right and explains that a square also needs 4 equal sides (4 right angles only make a rectangle).

        (b) 1 pt: draws or describes a quadrilateral with 4 right angles and sides that are not all equal (any long, thin rectangle).
