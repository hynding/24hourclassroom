week: 27
unit: 8
title: "Lines of Symmetry"
topics: ["4.G.A.3"]
guide: guides/week-27.md
guide_description: |
  What a line of symmetry is, how to test one by folding or by matching points, how many lines of symmetry
  squares, rectangles, rhombuses, parallelograms and triangles have, and how to finish a symmetric shape on a
  grid.
flashcards_description: |
  19 cards on lines of symmetry: the fold test and the mirror test, how many lines each common shape has,
  why a rectangle's diagonal is not one, and how to complete a symmetric shape on a grid.

flashcards:
  - front: Line of symmetry → what it is
    back: |
      A line that cuts a shape into two halves that match exactly. Fold along it and the halves land right on top of each other.
    topic_code: "4.G.A.3"
  - front: Fold test → how to check a line of symmetry
    back: |
      Trace or cut out the shape and fold it along the line. If every edge and corner of one half lands on the other half, it is a line of symmetry.
    topic_code: "4.G.A.3"
  - front: Mirror test → another way to check a line of symmetry
    back: |
      Every corner on one side of the line has a matching corner on the other side, straight across and the same distance from the line.
    topic_code: "4.G.A.3"
  - front: Square → how many lines of symmetry
    back: |
      4: one up and down, one across, and two from corner to opposite corner.
    topic_code: "4.G.A.3"
  - front: Rectangle that is not a square → how many lines of symmetry
    back: |
      2: one through the middles of the top and bottom, and one through the middles of the two sides. Its corner-to-corner lines do not work.
    topic_code: "4.G.A.3"
  - front: Rhombus that is not a square → how many lines of symmetry
    back: |
      2: the two lines from a corner to the opposite corner.
    topic_code: "4.G.A.3"
  - front: Parallelogram that is not a rectangle or a rhombus → how many lines of symmetry
    back: |
      0. However you fold it, one half sticks out past the other.
    topic_code: "4.G.A.3"
  - front: Equilateral triangle → how many lines of symmetry
    back: |
      3: from each corner to the middle of the side across from it.
    topic_code: "4.G.A.3"
  - front: Isosceles triangle that is not equilateral → how many lines of symmetry
    back: |
      1: from the corner between the two equal sides to the middle of the third side.
    topic_code: "4.G.A.3"
  - front: Scalene triangle → how many lines of symmetry
    back: |
      0. All three sides are different lengths, so no fold can make two halves match.
    topic_code: "4.G.A.3"
  - front: Circle → how many lines of symmetry
    back: |
      Too many to count: every straight line through the center of a circle is a line of symmetry.
    topic_code: "4.G.A.3"
  - front: Regular hexagon → how many lines of symmetry
    back: |
      6. A regular hexagon has 6 equal sides and 6 equal angles. 3 lines join opposite corners and 3 join the middles of opposite sides.
    topic_code: "4.G.A.3"
  - front: Regular pentagon → how many lines of symmetry
    back: |
      5. Each one goes from a corner to the middle of the side across from it.
    topic_code: "4.G.A.3"
  - front: Line of symmetry → must it go straight up and down?
    back: |
      No. It can go up and down, across or on a slant, as long as the two halves match when you fold.
    topic_code: "4.G.A.3"
  - front: Diagonal of a rectangle → is it a line of symmetry?
    back: |
      Only if the rectangle is a square. In a long rectangle, folding corner to corner leaves two corners sticking out.
    topic_code: "4.G.A.3"
  - front: Two halves with the same area → is that enough for symmetry?
    back: |
      No. A long rectangle cut corner to corner gives two halves with the same area, but they do not land on each other when you fold.
    topic_code: "4.G.A.3"
  - front: Completing a symmetric shape on a grid → how to do it
    back: |
      For each square, count how far it is from the line of symmetry. Shade a square the same distance away on the other side, in the same row.
    topic_code: "4.G.A.3"
  - front: Dashed line on a shape → what it usually shows
    back: |
      In a drawing, a line of symmetry is often drawn dashed, so you can tell it apart from the sides of the shape.
    topic_code: "4.G.A.3"
  - front: Shape with no line of symmetry → an example
    back: |
      A triangle with sides of 3 cm, 4 cm and 6 cm. No fold makes its two parts match.
    topic_code: "4.G.A.3"

quiz:
  description: |
    15 questions · about 25 minutes · testing lines of symmetry by folding, counting the lines of symmetry of
    squares, rectangles, triangles and other shapes, and finishing a symmetric shape on a grid, plus review of
    shape names, unknown angles, division and converting feet to inches. Multiple choice, select-all,
    true/false and number answers are graded at once; the fill-in word is matched automatically; the short
    answer is checked by your teacher.
  questions:
    - slug: g4math-w27-q01
      type: multi_select
      topic_code: "4.G.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 2
      partial_credit: true
      stimulus: |
        Each of the five shapes has one red dashed line drawn on it. A small square in a corner marks a right angle.
      figure: figures/w27-dashed-lines.svg
      figure_alt: "Five shapes, each with one dashed line. Shape 1: a rectangle, longer than tall, dashed line straight up and down through its middle. Shape 2: the same rectangle, dashed line from top left corner to bottom right corner. Shape 3: a rhombus on a corner, dashed line from top corner to bottom corner. Shape 4: a parallelogram leaning right, dashed line straight up and down through its middle. Shape 5: a tall triangle with two equal sides, dashed line from top corner to middle of bottom."
      prompt: |
        On which shapes is the dashed line a line of symmetry? Select all that apply.
      options:
        - "Shape 1"
        - "Shape 2"
        - "Shape 3"
        - "Shape 4"
        - "Shape 5"
      option_explanations:
        - |
          Yes. Folding Shape 1 along the up-and-down line puts its left half exactly on its right half.
        - |
          No. Folding Shape 2 from corner to corner leaves two corners sticking out, because the rectangle is longer than it is tall.
        - |
          Yes. The line joins two opposite corners of the rhombus, and its left and right halves match exactly when folded.
        - |
          No. Shape 4 leans to the right, so when you fold it along the up-and-down line the slanted sides do not land on each other.
        - |
          Yes. The two slanted sides of Shape 5 are equal, so the line from the top corner to the middle of the bottom folds one half onto the other.
      answer: [0, 2, 4]

    - slug: g4math-w27-q02
      type: multiple_choice
      topic_code: "4.G.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 1
      stimulus: |
        Each of the five shapes has one red dashed line drawn on it. A small square in a corner marks a right angle.
      prompt: |
        Why is the dashed line on Shape 2 not a line of symmetry?
      options:
        - "It does not pass through the middle of the shape."
        - "If you fold along it, the two halves do not land on top of each other."
        - "A line of symmetry must go straight up and down."
        - "The two halves do not have the same area."
      option_explanations:
        - |
          The line from corner to corner does pass through the very middle of the rectangle, so that is not the reason.
        - |
          Correct. The two triangles are the same size, but folding on the slanted line leaves a corner of each sticking out past the other.
        - |
          Lines of symmetry can go across or on a slant too. A square's corner-to-corner lines are lines of symmetry.
        - |
          The two triangles do have the same area, each half of the rectangle. Equal area is not enough: the halves must match when folded.
      answer: 1

    - slug: g4math-w27-q03
      type: multiple_choice
      topic_code: "4.G.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 1
      prompt: |
        How many lines of symmetry does a square have?
      options:
        - "2"
        - "8"
        - "4"
        - "1"
      option_explanations:
        - |
          2 counts only the up-and-down and across lines. A square also folds onto itself along both corner-to-corner lines.
        - |
          8 counts each line twice, once for each end. A square has 4 different fold lines.
        - |
          Correct. Up and down, across, and the two corner-to-corner lines: 4 lines of symmetry.
        - |
          A square folds onto itself in more than one way. The up-and-down line is only one of its 4 lines.
      answer: 2

    - slug: g4math-w27-q04
      type: multiple_choice
      topic_code: "4.G.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 1
      prompt: |
        Which shape has exactly 3 lines of symmetry?
      options:
        - "A triangle with 3 equal sides"
        - "A square"
        - "A rectangle that is not a square"
        - "A circle"
      option_explanations:
        - |
          Correct. An equilateral triangle has a line from each of its 3 corners to the middle of the side across from it.
        - |
          A square has 4 lines of symmetry: up and down, across and two corner-to-corner lines.
        - |
          A rectangle that is not a square has 2 lines of symmetry, through the middles of opposite sides.
        - |
          Every line through the center of a circle is a line of symmetry, so a circle has far more than 3.
      answer: 0

    - slug: g4math-w27-q05
      type: true_false
      topic_code: "4.G.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 1
      prompt: |
        True or false: in every rectangle, the line from one corner to the opposite corner is a line of symmetry.
      answer: false
      explanation: |
        False. That is only true when the rectangle is a square. In a rectangle that is longer than it is tall, folding from corner to corner leaves two corners sticking out, so the halves do not match.

    - slug: g4math-w27-q06
      type: fill_blank
      topic_code: "4.G.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 1
      prompt: |
        A line that cuts a shape into two halves that match exactly when you fold along it is called a line of ____.
      answer: ["symmetry"]
      explanation: |
        It is a line of symmetry. Folding along it puts one half exactly on top of the other.

    - slug: g4math-w27-q07
      type: numeric
      topic_code: "4.G.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 1
      stimulus: |
        The red dashed line is a line of symmetry for a whole shape. Only the half of the shape on the left of the line is shaded so far.
      figure: figures/w27-half-grid.svg
      figure_alt: "A grid 12 squares wide and 7 squares tall with a red dashed line going up and down through the middle, 6 squares from each edge. On the left of the line, 10 squares are shaded, and every shaded row touches the line. From the top: the first row is empty, then 1 shaded square, then 2 shaded squares, then 3 shaded squares, then 3 shaded squares, then 1 shaded square, and the bottom row is empty. The right side of the grid is empty."
      prompt: |
        Imagine the other half drawn in. How many grid squares does the whole shape cover?
      answer: { value: 20, tolerance: 0 }
      explanation: |
        The left half covers 1 + 2 + 3 + 3 + 1 = 10 squares. The right half is its mirror image, so it covers 10 squares too. 10 + 10 = 20 squares.

    - slug: g4math-w27-q08
      type: numeric
      topic_code: "4.G.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 1
      stimulus: |
        The red dashed line is a line of symmetry for a whole shape. Only the half of the shape on the left of the line is shaded so far.
      prompt: |
        Each grid square is 1 cm on a side. What is the perimeter of the whole shape, in centimeters?
      answer: { value: 22, tolerance: 0 }
      explanation: |
        The whole shape has rows of 2, 4, 6, 6 and 2 squares. Count the outside edges. Up and down: each of the 5 rows has a left edge and a right edge, 10 cm. Across: 2 on top, 1 + 1 where the second row sticks out, 1 + 1 where the third row sticks out, 2 + 2 under the fourth row beside the last row, and 2 on the bottom, 12 cm. 10 + 12 = 22 cm.

    - slug: g4math-w27-q09
      type: numeric
      topic_code: "4.G.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 1
      figure: figures/w27-plus-tile.svg
      figure_alt: "A plus-sign tile made of 5 equal squares: one square in the middle, with one more square attached to each of its 4 sides, above, below, left and right. No lines are drawn across it."
      prompt: |
        How many lines of symmetry does this plus-sign tile have?
      answer: { value: 4, tolerance: 0 }
      explanation: |
        It folds onto itself up and down and across, which makes 2. It also folds along the two slanted lines through the corners of the middle square, because each arm lands on the arm next to it. That makes 4 lines of symmetry.

    - slug: g4math-w27-q10
      type: multiple_choice
      topic_code: "4.G.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 1
      prompt: |
        Jada folds a paper heart along a straight line, and the two halves match exactly. What is the fold line?
      options:
        - "A line of symmetry"
        - "A ray"
        - "A perpendicular side"
        - "An obtuse angle"
      option_explanations:
        - |
          Correct. A fold line that makes two halves match exactly is a line of symmetry.
        - |
          A ray starts at a point and goes on forever in one direction. The fold is a line through the heart, and what matters is that the halves match.
        - |
          The fold is not a side of the heart. Perpendicular describes two lines meeting at a right angle.
        - |
          An angle is made by two rays that share an endpoint. The fold is a single straight line, not an angle.
      answer: 0

    - slug: g4math-w27-q11
      type: multiple_choice
      topic_code: "4.G.A.2"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 1
      prompt: |
        Review: a quadrilateral has 4 sides of the same length and no right angles. What is its most exact name?
      options:
        - "Square"
        - "Rectangle"
        - "Parallelogram"
        - "Rhombus"
      option_explanations:
        - |
          A square needs 4 right angles as well as 4 equal sides. This shape has no right angles.
        - |
          A rectangle needs 4 right angles. This shape has none, so it is not a rectangle.
        - |
          It is a parallelogram, but that name only says its opposite sides are parallel. A more exact name also says all 4 sides are equal.
        - |
          Correct. 4 equal sides make a rhombus. With no right angles, it is not a square, so rhombus is the most exact name.
      answer: 3

    - slug: g4math-w27-q12
      type: numeric
      topic_code: "4.MD.C.7"
      source: "IM K–5 Math Grade 4, Unit 7, Section C"
      points: 1
      prompt: |
        Review: two angles side by side make a straight angle. One of them measures 112°. What does the other angle measure, in degrees?
      answer: { value: 68, tolerance: 0 }
      explanation: |
        A straight angle measures 180°. 180 − 112 = 68, so the other angle measures 68°.

    - slug: g4math-w27-q13
      type: numeric
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 6, Section C"
      points: 1
      prompt: |
        Review: a ribbon 96 inches long is cut into 4 equal pieces for banners. How long is each piece, in inches?
      answer: { value: 24, tolerance: 0 }
      explanation: |
        96 ÷ 4: 80 ÷ 4 = 20 and 16 ÷ 4 = 4, so 96 ÷ 4 = 24 inches. Check: 4 × 24 = 96.

    - slug: g4math-w27-q14
      type: short_answer
      topic_code: "4.G.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section A"
      points: 2
      prompt: |
        (a) Draw or describe a triangle that has exactly 1 line of symmetry. Show or tell where the line goes.
        (b) Draw or describe a triangle that has no lines of symmetry, and explain why.
      answer: |
        (a) A triangle with sides of 5 cm, 5 cm and 3 cm. Its line of symmetry goes from the corner between the two 5 cm sides down to the middle of the 3 cm side.
        (b) A triangle with sides of 3 cm, 4 cm and 6 cm. All three sides are different lengths, so no fold can make one part land exactly on the other.
      explanation: |
        Two points.

        (a) 1 pt: an isosceles triangle that is not equilateral (exactly two equal sides), with the line from the corner between the equal sides to the middle of the opposite side.

        (b) 1 pt: a triangle with three different side lengths (scalene), with a reason such as "the sides are all different, so the halves cannot match."

    - slug: g4math-w27-q15
      type: multiple_choice
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 1
      prompt: |
        Review: a poster is 3 feet tall. How many inches tall is it?
      options:
        - "15"
        - "30"
        - "36"
        - "4"
      option_explanations:
        - |
          15 comes from adding 3 + 12. Each of the 3 feet is 12 inches, so multiply: 3 × 12.
        - |
          30 uses 10 inches in a foot. A foot is 12 inches, so 3 feet is 3 × 12 inches.
        - |
          Correct. 1 foot is 12 inches, so 3 feet is 3 × 12 = 36 inches.
        - |
          Feet are bigger than inches, so the number of inches must be bigger than 3, not about the same.
      answer: 2
