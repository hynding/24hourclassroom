unit: 8
description: |
  22 questions · about 40 minutes · every standard of Unit 8: sorting triangles and quadrilaterals by their
  sides and angles, parallel and perpendicular sides, the quadrilateral family, lines of symmetry, area and
  perimeter of rectangles and plans made of rectangles, and finding a missing side. Three stimulus sets share
  a picture across consecutive questions. Multiple choice, select-all, true/false and number answers are graded
  at once; the fill-in word is matched automatically; the short answer is checked by your teacher against the
  scoring notes.
questions:
  # ---- Stimulus set A: six shapes on a grid (4.G.A.2)
  - slug: g4math-u08-check-q01
    type: multiple_choice
    topic_code: "4.G.A.2"
    source: "IM K–5 Math Grade 4, Unit 8, Section A"
    points: 1
    stimulus: |
      Use the six shapes drawn on a grid of equal squares. A small square in a corner marks a right angle.
    figure: figures/u08-six-shapes.svg
    figure_alt: "Six shapes on a grid. 1: triangle, bottom 5 units, upright left side 3 units, right angle mark between them. 2: flat triangle, bottom 3 units, obtuse corner at the right end of the bottom. 3: rectangle 5 by 3 units, 4 right angle marks. 4: parallelogram, top and bottom 5 units, sides leaning right, no right angles. 5: bottom 5 units, upright right side 4 units, top 3 units, slanted left side; right angle marks in both right corners. 6: triangle, bottom 4 units, two equal sides, all angles acute."
    prompt: |
      Which shape is a right triangle?
    options:
      - "Shape 2"
      - "Shape 1"
      - "Shape 6"
      - "Shape 4"
    option_explanations:
      - |
        Shape 2 is a triangle, but its biggest angle is wider than a square corner, so it is an obtuse triangle.
      - |
        Correct. Shape 1 is a triangle with a right angle mark where its bottom and left sides meet.
      - |
        Shape 6 is a triangle, but all three of its angles are smaller than a square corner, so it is an acute triangle.
      - |
        Shape 4 has 4 sides, so it is not a triangle at all, and none of its angles are right angles.
    answer: 1

  - slug: g4math-u08-check-q02
    type: multi_select
    topic_code: "4.G.A.2"
    source: "IM K–5 Math Grade 4, Unit 8, Section A"
    points: 2
    partial_credit: true
    stimulus: |
      Use the six shapes drawn on a grid of equal squares. A small square in a corner marks a right angle.
    prompt: |
      Which shapes have at least one pair of perpendicular sides? Select all that apply.
    options:
      - "Shape 1"
      - "Shape 2"
      - "Shape 3"
      - "Shape 4"
      - "Shape 5"
      - "Shape 6"
    option_explanations:
      - |
        Yes. The bottom and left sides of Shape 1 meet at a right angle, so they are perpendicular.
      - |
        No. Shape 2 has one obtuse angle and two acute angles. No two of its sides meet at a right angle.
      - |
        Yes. Shape 3 is a rectangle, so every pair of sides that meet at a corner is perpendicular.
      - |
        No. Shape 4 leans over, so its angles are acute and obtuse, and none of its sides are perpendicular.
      - |
        Yes. The upright right side of Shape 5 is perpendicular to its bottom side and to its top side.
      - |
        No. All three angles of Shape 6 are acute, so no two of its sides meet at a right angle.
    answer: [0, 2, 4]

  - slug: g4math-u08-check-q03
    type: numeric
    topic_code: "4.G.A.2"
    source: "IM K–5 Math Grade 4, Unit 8, Section A"
    points: 1
    stimulus: |
      Use the six shapes drawn on a grid of equal squares. A small square in a corner marks a right angle.
    prompt: |
      How many of the six shapes have 2 pairs of parallel sides?
    answer: { value: 2, tolerance: 0 }
    explanation: |
      Shape 3 (a rectangle) and Shape 4 (a parallelogram) each have 2 pairs of parallel sides. Shape 5 has only 1 pair, its level top and bottom, and the three triangles have none. So the answer is 2.

  - slug: g4math-u08-check-q04
    type: multiple_choice
    topic_code: "4.G.A.2"
    source: "IM K–5 Math Grade 4, Unit 8, Section A"
    points: 1
    prompt: |
      Which of these sentences about shape families is always true?
    options:
      - "Every parallelogram is a rhombus."
      - "Every rhombus is a parallelogram."
      - "Every rectangle is a square."
      - "Every quadrilateral is a parallelogram."
    option_explanations:
      - |
        A parallelogram can have two long sides and two short sides. A rhombus needs all 4 sides equal, so not every parallelogram is one.
      - |
        Correct. A rhombus has 4 equal sides, and its opposite sides are always parallel, so it is a parallelogram.
      - |
        A rectangle only needs 4 right angles. A long, thin rectangle does not have 4 equal sides, so it is not a square.
      - |
        A quadrilateral only needs 4 sides. Many quadrilaterals have one pair of parallel sides or none at all.
    answer: 1

  - slug: g4math-u08-check-q05
    type: multiple_choice
    topic_code: "4.G.A.2"
    source: "IM K–5 Math Grade 4, Unit 8, Section A"
    points: 1
    prompt: |
      A triangle has angles that measure 30°, 45° and 105°. What kind of triangle is it?
    options:
      - "Right triangle"
      - "Acute triangle"
      - "Obtuse triangle"
      - "Equilateral triangle"
    option_explanations:
      - |
        A right triangle needs an angle of exactly 90°. None of these angles is 90°.
      - |
        30° and 45° are acute, but 105° is not. An acute triangle needs all three angles to be less than 90°.
      - |
        Correct. 105° is more than 90°, so it is an obtuse angle, and the triangle is an obtuse triangle.
      - |
        An equilateral triangle has three equal angles. These three angles are all different.
    answer: 2

  - slug: g4math-u08-check-q06
    type: true_false
    topic_code: "4.G.A.2"
    source: "IM K–5 Math Grade 4, Unit 8, Section A"
    points: 1
    prompt: |
      True or false: a triangle can have two obtuse angles.
    answer: false
    explanation: |
      False. If both corners at the ends of one side opened wider than a right angle, the other two sides would lean away from each other and never meet. A triangle has at most one obtuse angle.

  - slug: g4math-u08-check-q07
    type: fill_blank
    topic_code: "4.G.A.2"
    source: "IM K–5 Math Grade 4, Unit 8, Section A"
    points: 1
    prompt: |
      A triangle with one right angle is called a ____ triangle.
    answer: ["right", "right-angled", "right angled"]
    explanation: |
      A triangle with one right angle is a right triangle. Its other two angles are acute.

  # ---- Stimulus set B: four shapes with dashed lines (4.G.A.3)
  - slug: g4math-u08-check-q08
    type: multi_select
    topic_code: "4.G.A.3"
    source: "IM K–5 Math Grade 4, Unit 8, Section A"
    points: 2
    partial_credit: true
    stimulus: |
      Each of the four shapes has one red dashed line drawn on it. A small square in a corner marks a right angle. Shape 3 has 6 equal sides and 6 equal angles.
    figure: figures/u08-dashed-lines.svg
    figure_alt: "Four shapes, each with one dashed line. Shape 1: a square with right angle marks, dashed line from its top left corner to its bottom right corner. Shape 2: a right triangle, level bottom longer than its upright left side, dashed line from the right angle corner to the middle of the slanted side. Shape 3: a hexagon with 6 equal sides, dashed line straight across from its left corner to its right corner. Shape 4: a rhombus leaning right, dashed line joining the middles of its top and bottom."
    prompt: |
      On which shapes is the dashed line a line of symmetry? Select all that apply.
    options:
      - "Shape 1"
      - "Shape 2"
      - "Shape 3"
      - "Shape 4"
    option_explanations:
      - |
        Yes. Folding a square from corner to opposite corner puts one triangle exactly on the other.
      - |
        No. The two sides of this right triangle are different lengths, so the two parts do not match when folded.
      - |
        Yes. The line joins two opposite corners of the hexagon, and its top half folds exactly onto its bottom half.
      - |
        No. This rhombus leans, so folding on the line through the middles of its top and bottom leaves corners sticking out. Its lines of symmetry go corner to corner.
    answer: [0, 2]

  - slug: g4math-u08-check-q09
    type: multiple_choice
    topic_code: "4.G.A.3"
    source: "IM K–5 Math Grade 4, Unit 8, Section A"
    points: 1
    stimulus: |
      Each of the four shapes has one red dashed line drawn on it. A small square in a corner marks a right angle. Shape 3 has 6 equal sides and 6 equal angles.
    prompt: |
      The dashed line is one line of symmetry of Shape 1. How many lines of symmetry does Shape 1 have in all?
    options:
      - "4"
      - "1"
      - "2"
      - "8"
    option_explanations:
      - |
        Correct. A square has 4: the two corner-to-corner lines, one up and down and one across.
      - |
        The dashed line is one of them, but a square folds onto itself in other ways too.
      - |
        2 counts only the corner-to-corner lines, or only the up-and-down and across lines. A square has both kinds.
      - |
        8 counts each line twice, once for each end. A square has 4 different fold lines.
    answer: 0

  - slug: g4math-u08-check-q10
    type: numeric
    topic_code: "4.G.A.3"
    source: "IM K–5 Math Grade 4, Unit 8, Section A"
    points: 1
    prompt: |
      How many lines of symmetry does an equilateral triangle have?
    answer: { value: 3, tolerance: 0 }
    explanation: |
      An equilateral triangle has 3 equal sides. A line from each of its 3 corners to the middle of the opposite side folds it onto itself, so it has 3 lines of symmetry.

  - slug: g4math-u08-check-q11
    type: numeric
    topic_code: "4.G.A.3"
    source: "IM K–5 Math Grade 4, Unit 8, Section A"
    points: 1
    prompt: |
      A rectangle is 10 cm long and 4 cm wide. How many lines of symmetry does it have?
    answer: { value: 2, tolerance: 0 }
    explanation: |
      It has 2: one through the middles of the two long sides and one through the middles of the two short sides. Its corner-to-corner lines are not lines of symmetry, because it is not a square.

  - slug: g4math-u08-check-q12
    type: multiple_choice
    topic_code: "4.G.A.3"
    source: "IM K–5 Math Grade 4, Unit 8, Section A"
    points: 1
    prompt: |
      Which shape has no lines of symmetry?
    options:
      - "A square"
      - "A triangle with sides of 4 cm, 4 cm and 3 cm"
      - "A triangle with sides of 3 cm, 5 cm and 7 cm"
      - "A circle"
    option_explanations:
      - |
        A square has 4 lines of symmetry: up and down, across and two from corner to corner.
      - |
        This triangle has two equal sides, so it has 1 line of symmetry, from the corner between the 4 cm sides to the middle of the 3 cm side.
      - |
        Correct. All three sides are different lengths, so no fold can make two parts of this triangle match.
      - |
        A circle has more lines of symmetry than you can count: every line through its center.
    answer: 2

  # ---- Stimulus set C: a garden plan (4.MD.A.3)
  - slug: g4math-u08-check-q13
    type: numeric
    topic_code: "4.MD.A.3"
    source: "IM K–5 Math Grade 4, Unit 8, Section B"
    points: 1
    stimulus: |
      Use the plan of a school garden. Every corner is a square corner. Two of the sides are not labeled.
    figure: figures/u08-garden.svg
    figure_alt: "An L-shaped garden plan with square corners. The bottom side is 15 m, the right side is 6 m, the top side is 8 m and the left side is 10 m. The bottom part of the garden is 15 m wide and 6 m tall; above it, on the left, the garden is only 8 m wide and goes up to the top. Two sides are not labeled: the level side that steps in from the top of the 6 m side, and the side that goes up from that step to the top side."
    prompt: |
      What is the perimeter of the garden, in meters?
    answer: { value: 50, tolerance: 0 }
    explanation: |
      The hidden level step is 15 − 8 = 7 m, and the hidden upright side is 10 − 6 = 4 m. Add all six sides: 15 + 6 + 7 + 4 + 8 + 10 = 50 m.

  - slug: g4math-u08-check-q14
    type: numeric
    topic_code: "4.MD.A.3"
    source: "IM K–5 Math Grade 4, Unit 8, Section B"
    points: 1
    stimulus: |
      Use the plan of a school garden. Every corner is a square corner. Two of the sides are not labeled.
    prompt: |
      What is the area of the garden, in square meters?
    answer: { value: 122, tolerance: 0 }
    explanation: |
      Split it into two rectangles. The bottom part is 15 m by 6 m: 90 square meters. The part above it is 8 m wide and 10 − 6 = 4 m tall: 32 square meters. 90 + 32 = 122 square meters.

  - slug: g4math-u08-check-q15
    type: numeric
    topic_code: "4.MD.A.3"
    source: "IM K–5 Math Grade 4, Unit 8, Section B"
    points: 1
    prompt: |
      A rectangle rug has an area of 54 square feet. It is 6 feet wide. How long is it, in feet?
    answer: { value: 9, tolerance: 0 }
    explanation: |
      Area = length × width, so ? × 6 = 54. 54 ÷ 6 = 9, so the rug is 9 feet long.

  - slug: g4math-u08-check-q16
    type: multiple_choice
    topic_code: "4.MD.A.3"
    source: "IM K–5 Math Grade 4, Unit 8, Section B"
    points: 1
    prompt: |
      A rectangle has a perimeter of 46 cm. Its width is 8 cm. What is its length?
    options:
      - "15 cm"
      - "23 cm"
      - "38 cm"
      - "30 cm"
    option_explanations:
      - |
        Correct. Half of 46 is 23, which is one length plus one width. 23 − 8 = 15 cm. Check: 15 + 8 + 15 + 8 = 46.
      - |
        23 is half the perimeter, which is a length and a width together. Take away the 8 cm width.
      - |
        46 − 8 = 38 takes away only one width. The rectangle has two widths and two lengths.
      - |
        46 − 16 = 30 takes away both widths, but 30 cm is shared by the two lengths. Each length is 30 ÷ 2 = 15 cm.
    answer: 0

  - slug: g4math-u08-check-q17
    type: multiple_choice
    topic_code: "4.MD.A.3"
    source: "IM K–5 Math Grade 4, Unit 8, Section B"
    points: 1
    prompt: |
      A square patio has sides of 11 meters. What is its area?
    options:
      - "44 square meters"
      - "22 square meters"
      - "110 square meters"
      - "121 square meters"
    option_explanations:
      - |
        44 is 4 × 11, the perimeter of the patio in meters. Area multiplies the length by the width.
      - |
        22 is 11 + 11. For area, multiply the two sides instead of adding them.
      - |
        110 is 11 × 10, one group of 11 too few. 11 × 11 is 110 + 11.
      - |
        Correct. Area = length × width = 11 × 11 = 121 square meters.
    answer: 3

  - slug: g4math-u08-check-q18
    type: numeric
    topic_code: "4.MD.A.3"
    source: "IM K–5 Math Grade 4, Unit 8, Section B"
    points: 1
    prompt: |
      A playground is a rectangle 25 meters long and 16 meters wide. What is its area, in square meters?
    answer: { value: 400, tolerance: 0 }
    explanation: |
      Area = 25 × 16. 25 × 4 = 100, and 16 is 4 groups of 4, so 25 × 16 = 4 × 100 = 400 square meters.

  - slug: g4math-u08-check-q19
    type: multiple_choice
    topic_code: "4.G.A.2"
    source: "IM K–5 Math Grade 4, Unit 8, Section B"
    points: 1
    prompt: |
      Guess my shape: I am a quadrilateral with 2 pairs of parallel sides. All 4 of my sides are the same length, and one of my angles is a right angle. What is my most exact name?
    options:
      - "Rhombus"
      - "Rectangle"
      - "Parallelogram"
      - "Square"
    option_explanations:
      - |
        It is a rhombus, because all 4 sides are equal, but that name leaves out the right angles.
      - |
        It is a rectangle, because one square corner in a parallelogram makes all 4 corners square, but that name leaves out the equal sides.
      - |
        It is a parallelogram, but that name only tells about the parallel sides. A more exact name tells about the sides and the angles.
      - |
        Correct. One right angle in a parallelogram makes all 4 angles right angles, and all 4 sides are equal, so it is a square.
    answer: 3

  - slug: g4math-u08-check-q20
    type: multiple_choice
    topic_code: "4.MD.A.3"
    source: "IM K–5 Math Grade 4, Unit 8, Section B"
    points: 1
    prompt: |
      A rectangle has an area of 40 square meters and a perimeter of 26 meters. What are its length and width?
    options:
      - "8 m by 5 m"
      - "10 m by 4 m"
      - "20 m by 2 m"
      - "6 m by 7 m"
    option_explanations:
      - |
        Correct. 8 × 5 = 40 square meters, and 8 + 5 + 8 + 5 = 26 meters. Both numbers match.
      - |
        10 × 4 = 40, so the area matches, but the perimeter is 10 + 4 + 10 + 4 = 28 meters, not 26.
      - |
        20 × 2 = 40, so the area matches, but the perimeter is 20 + 2 + 20 + 2 = 44 meters.
      - |
        6 + 7 + 6 + 7 = 26, so the perimeter matches, but the area is 6 × 7 = 42 square meters, not 40.
    answer: 0

  - slug: g4math-u08-check-q21
    type: short_answer
    topic_code: "4.G.A.3"
    source: "IM K–5 Math Grade 4, Unit 8, Section A"
    points: 3
    prompt: |
      Kofi says, "Every rectangle has 4 lines of symmetry, just like a square."

      (a) Is Kofi right?
      (b) Draw or describe a rectangle that is not a square, and show or tell where all of its lines of symmetry go.
      (c) Explain why a line from one corner to the opposite corner is not a line of symmetry of your rectangle.
    answer: |
      (a) No. Only a square has 4 lines of symmetry. A rectangle that is not a square has 2.
      (b) A rectangle 8 cm long and 3 cm wide. One line of symmetry goes up and down through the middles of the two long sides. The other goes across through the middles of the two short sides.
      (c) If you fold the 8 cm by 3 cm rectangle from corner to corner, the two triangles do not land on each other: a corner of each sticks out past the other. The halves have the same area, but they do not match, so it is not a line of symmetry.
    explanation: |
      Three points.

      (a) 1 pt: says Kofi is not right (a rectangle that is not a square has only 2 lines of symmetry).

      (b) 1 pt: a rectangle with unequal sides and both lines of symmetry, through the middles of opposite sides. No point if a diagonal is shown as a line of symmetry.

      (c) 1 pt: explains that folding on the diagonal leaves corners sticking out, so the halves do not match exactly.

  - slug: g4math-u08-check-q22
    type: multiple_choice
    topic_code: "4.G.A.2"
    source: "IM K–5 Math Grade 4, Unit 8, Section A"
    points: 1
    prompt: |
      Which attribute does every parallelogram have?
    options:
      - "4 right angles"
      - "2 pairs of parallel sides"
      - "4 sides of the same length"
      - "Exactly 1 line of symmetry"
    option_explanations:
      - |
        Only some parallelograms, the rectangles, have 4 right angles. A parallelogram can lean over.
      - |
        Correct. Having 2 pairs of parallel sides is exactly what makes a quadrilateral a parallelogram.
      - |
        Only some parallelograms, the rhombuses, have 4 equal sides. Many have two long sides and two short sides.
      - |
        A parallelogram that leans with unequal sides has no lines of symmetry, and a rectangle has 2, so this is not true of every one.
    answer: 1
