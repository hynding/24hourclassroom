week: 28
unit: 8
title: "Reasoning About Shapes, Area and Perimeter"
topics: ["4.MD.A.3", "4.G.A.2"]
guide: guides/week-28.md
guide_description: |
  How to use the area and perimeter formulas for rectangles to find a missing side, how to find hidden sides
  and the area of a plan made of rectangles, how to choose between area and perimeter for a job, and how to
  reason from clues about a shape's sides and angles to name it.
flashcards_description: |
  18 cards on the area and perimeter formulas, finding a missing side from the area or the perimeter, plans
  made of rectangles, area or perimeter for a job, and what a shape must be when you know some of its
  attributes.

flashcards:
  - front: Area formula A = l × w → what it says
    back: |
      The area of a rectangle is its length times its width. A rectangle 7 m by 4 m covers 7 × 4 = 28 square meters.
    topic_code: "4.MD.A.3"
  - front: Perimeter formula P = 2 × l + 2 × w → what it says
    back: |
      A rectangle has two lengths and two widths, so its perimeter is 2 lengths plus 2 widths. A 7 m by 4 m rectangle: 14 + 8 = 22 m.
    topic_code: "4.MD.A.3"
  - front: Perimeter of a rectangle → a shortcut
    back: |
      Add one length and one width, then double: (7 + 4) × 2 = 22. It gives the same answer as 2 × 7 + 2 × 4.
    topic_code: "4.MD.A.3"
  - front: Rectangle with a known area and one known side → finding the other side
    back: |
      Divide the area by the side you know. Area 96 square cm and one side 8 cm: 96 ÷ 8 = 12 cm.
    topic_code: "4.MD.A.3"
  - front: Rectangle with a known perimeter and one known side → finding the other side
    back: |
      Halve the perimeter to get one length plus one width, then subtract the side you know. Perimeter 30 m, length 9 m: 15 − 9 = 6 m.
    topic_code: "4.MD.A.3"
  - front: Square with a perimeter of 36 cm → its area
    back: |
      Each of the 4 equal sides is 36 ÷ 4 = 9 cm, so the area is 9 × 9 = 81 square centimeters.
    topic_code: "4.MD.A.3"
  - front: Units for area and perimeter → which is which
    back: |
      Perimeter is a length, so it is in cm, m, in or ft. Area covers a surface, so it is in square cm, square m, square in or square ft.
    topic_code: "4.MD.A.3"
  - front: L-shaped plan → how to find its area
    back: |
      Split it into two rectangles, find the area of each with length × width, and add the two areas.
    topic_code: "4.MD.A.3"
  - front: Hidden side on a plan with square corners → how to find it
    back: |
      Opposite sides balance. The short pieces on one side add up to the long side across from them, so subtract to find the missing piece.
    topic_code: "4.MD.A.3"
  - front: Same area, different perimeters → an example
    back: |
      A 2 by 8 rectangle and a 4 by 4 square both cover 16 square units, but their perimeters are 20 units and 16 units.
    topic_code: "4.MD.A.3"
  - front: Same perimeter, different areas → an example
    back: |
      A 1 by 5 rectangle and a 3 by 3 square both have a perimeter of 12 units, but they cover 5 and 9 square units.
    topic_code: "4.MD.A.3"
  - front: Carpet for a floor → area or perimeter?
    back: |
      Area. Carpet covers the whole floor, so you need to know how many square units are inside.
    topic_code: "4.MD.A.3"
  - front: Fence around a garden → area or perimeter?
    back: |
      Perimeter. A fence goes around the outside edge, so you need the total length of the sides.
    topic_code: "4.MD.A.3"
  - front: Big rectangle → area with tens
    back: |
      A field 30 m by 40 m: 3 × 4 = 12, and tens times tens makes hundreds, so the area is 1,200 square meters.
    topic_code: "4.MD.A.3"
  - front: Parallelogram with one right angle → what it must be
    back: |
      A rectangle. Its opposite sides are parallel, so once one corner is square, all 4 corners are square.
    topic_code: "4.G.A.2"
  - front: Rhombus with one right angle → what it must be
    back: |
      A square. It has 4 equal sides, and like any parallelogram, one square corner makes all 4 corners square.
    topic_code: "4.G.A.2"
  - front: Shape clues → how to use them
    back: |
      Take one clue at a time and cross out every shape that does not fit. The shape that fits every clue is the answer, and its most exact name says the most.
    topic_code: "4.G.A.2"
  - front: Most exact name → what it means
    back: |
      The name that tells the most about a shape. A square is also a rectangle, a rhombus and a parallelogram, but "square" says the most.
    topic_code: "4.G.A.2"

quiz:
  description: |
    15 questions · about 30 minutes · area and perimeter of rectangles and plans made of rectangles, finding a
    missing side, choosing area or perimeter for a job, and naming shapes from clues about their sides and
    angles, plus review of comparing decimals. Multiple choice, select-all, true/false and number answers are
    graded at once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w28-q01
      type: numeric
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section B"
      points: 1
      stimulus: |
        Use the plan of a reading room. Every corner is a square corner. Two of the sides are not labeled.
      figure: figures/w28-l-plan.svg
      figure_alt: "An L-shaped room plan with square corners. The bottom side is 12 ft, the right side is 4 ft, the top side is 5 ft and the left side is 9 ft. The bottom part of the room is 12 ft wide and 4 ft tall; above it, on the left, the room is only 5 ft wide and goes up to the top. Two sides are not labeled: the level side that steps in from the top of the 4 ft side, and the side that goes up from that step to the top side."
      prompt: |
        What is the perimeter of the room, in feet?
      answer: { value: 42, tolerance: 0 }
      explanation: |
        First find the hidden sides. The level step is 12 − 5 = 7 ft, and the tall inside side is 9 − 4 = 5 ft. Then add all six sides: 12 + 4 + 7 + 5 + 5 + 9 = 42 ft.

    - slug: g4math-w28-q02
      type: numeric
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section B"
      points: 1
      stimulus: |
        Use the plan of a reading room. Every corner is a square corner. Two of the sides are not labeled.
      prompt: |
        What is the area of the room, in square feet?
      answer: { value: 73, tolerance: 0 }
      explanation: |
        Split the L into two rectangles. The bottom part is 12 ft by 4 ft: 12 × 4 = 48 square feet. The part above it is 5 ft wide and 9 − 4 = 5 ft tall: 5 × 5 = 25 square feet. 48 + 25 = 73 square feet.

    - slug: g4math-w28-q03
      type: multiple_choice
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section B"
      points: 1
      stimulus: |
        Use the plan of a reading room. Every corner is a square corner. Two of the sides are not labeled.
      prompt: |
        Kai says the area of the room is 12 × 9 = 108 square feet. What mistake did Kai make?
      options:
        - "He counted the empty corner at the top right as if it were part of the room."
        - "He should have added: 12 + 9 = 21 square feet."
        - "He found the perimeter instead of the area."
        - "He should have multiplied all four labels: 12 × 9 × 5 × 4."
      option_explanations:
        - |
          Correct. 12 × 9 is the area of a whole 12 by 9 rectangle. The room has a 7 ft by 5 ft corner cut out, so the area is 108 − 35 = 73 square feet.
        - |
          Adding two side lengths gives a length, not an area. Area needs multiplying, and Kai's problem is the cut-out corner.
        - |
          Kai did multiply, which is how area works. His product is too big because the room is not a full rectangle.
        - |
          Multiplying all four labels gives a huge number that is not an area of anything. Split the L into two rectangles instead.
      answer: 0

    - slug: g4math-w28-q04
      type: numeric
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section B"
      points: 1
      figure: figures/w28-rect-area.svg
      figure_alt: "A rectangle with right angle marks in all 4 corners. Inside it says Area = 96 square cm. The short side on the left is labeled 8 cm, and the long side along the bottom is labeled with a question mark and cm."
      prompt: |
        How long is the side marked with a question mark, in centimeters?
      answer: { value: 12, tolerance: 0 }
      explanation: |
        Area = length × width, so 8 × ? = 96. Think 96 ÷ 8: 80 ÷ 8 = 10 and 16 ÷ 8 = 2, so the side is 12 cm. Check: 8 × 12 = 96.

    - slug: g4math-w28-q05
      type: multiple_choice
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section B"
      points: 1
      prompt: |
        A rectangle has a perimeter of 30 m. Its length is 9 m. What is its width?
      options:
        - "21 m"
        - "6 m"
        - "12 m"
        - "15 m"
      option_explanations:
        - |
          30 − 9 = 21 takes away only one length. The rectangle has two lengths, and the leftover is shared by two widths.
        - |
          Correct. Half of 30 is 15, which is one length plus one width. 15 − 9 = 6 m. Check: 9 + 6 + 9 + 6 = 30.
        - |
          30 − 18 = 12 takes away both lengths, but 12 m is what is left for both widths together. Each width is 12 ÷ 2 = 6 m.
        - |
          15 is half the perimeter, which is one length and one width together. Take away the 9 m length to find the width.
      answer: 1

    - slug: g4math-w28-q06
      type: multiple_choice
      topic_code: "4.G.A.2"
      source: "IM K–5 Math Grade 4, Unit 8, Section B"
      points: 1
      prompt: |
        Guess my shape: I have 4 sides and 4 right angles. My sides are not all the same length. What is my most exact name?
      options:
        - "Square"
        - "Rhombus"
        - "Rectangle"
        - "Parallelogram"
      option_explanations:
        - |
          A square needs 4 equal sides, and this shape's sides are not all the same length.
        - |
          A rhombus needs 4 sides of the same length, so this shape cannot be a rhombus.
        - |
          Correct. 4 right angles make a rectangle, and since the sides are not all equal, it is not a square.
        - |
          The shape is a parallelogram, but that name leaves out the right angles. Rectangle says more, so it is more exact.
      answer: 2

    - slug: g4math-w28-q07
      type: multi_select
      topic_code: "4.G.A.2"
      source: "IM K–5 Math Grade 4, Unit 8, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Tia drew a square with sides of 5 cm. Which other names also fit her shape? Select all that apply.
      options:
        - "Rectangle"
        - "Rhombus"
        - "Parallelogram"
        - "Quadrilateral"
        - "Triangle"
      option_explanations:
        - |
          Yes. A rectangle needs 4 right angles, and a square has them.
        - |
          Yes. A rhombus needs 4 sides of the same length, and every side of Tia's square is 5 cm.
        - |
          Yes. A square's opposite sides are parallel, so it has 2 pairs of parallel sides.
        - |
          Yes. A square has exactly 4 sides, so it is a quadrilateral.
        - |
          No. A triangle has 3 sides, and a square has 4.
      answer: [0, 1, 2, 3]

    - slug: g4math-w28-q08
      type: true_false
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section B"
      points: 1
      prompt: |
        True or false: two rectangles with the same area always have the same perimeter.
      answer: false
      explanation: |
        False. A 2 cm by 8 cm rectangle and a 4 cm by 4 cm square both have an area of 16 square cm, but their perimeters are 20 cm and 16 cm.

    - slug: g4math-w28-q09
      type: fill_blank
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section B"
      points: 1
      prompt: |
        The total length all the way around the outside of a shape is called its ____.
      answer: ["perimeter", "the perimeter", "perimeters"]
      explanation: |
        The perimeter is the distance around a shape: add the lengths of all its sides.

    - slug: g4math-w28-q10
      type: multiple_choice
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section B"
      points: 1
      prompt: |
        A square tile has a perimeter of 36 cm. What is its area?
      options:
        - "36 square cm"
        - "81 square cm"
        - "144 square cm"
        - "9 square cm"
      option_explanations:
        - |
          36 is the perimeter, the length around the tile. The area is found from the side length, not copied from the perimeter.
        - |
          Correct. Each side is 36 ÷ 4 = 9 cm, and the area is 9 × 9 = 81 square cm.
        - |
          144 is 36 × 4. The perimeter should be divided by 4 to get one side, not multiplied.
        - |
          9 cm is the length of one side. The area is that side times itself: 9 × 9.
      answer: 1

    - slug: g4math-w28-q11
      type: multiple_choice
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section B"
      points: 1
      prompt: |
        Which job needs you to find an area, not a perimeter?
      options:
        - "Putting a fence around a garden"
        - "Gluing ribbon around the edge of a poster"
        - "Painting a line all the way around a basketball court"
        - "Buying carpet to cover a classroom floor"
      option_explanations:
        - |
          A fence goes around the outside edge of the garden, so this job needs the perimeter.
        - |
          Ribbon around the edge only follows the sides of the poster, so this job needs the perimeter.
        - |
          A line around the court follows its outside edge, so this job needs the perimeter.
        - |
          Correct. Carpet covers the whole floor, so you need to know the area in square units.
      answer: 3

    - slug: g4math-w28-q12
      type: multiple_choice
      topic_code: "4.G.A.2"
      source: "IM K–5 Math Grade 4, Unit 8, Section B"
      points: 1
      prompt: |
        Which shape always has 4 right angles?
      options:
        - "Rhombus"
        - "Parallelogram"
        - "Square"
        - "Quadrilateral"
      option_explanations:
        - |
          A rhombus needs only 4 equal sides. It can lean over and have no right angles at all.
        - |
          A parallelogram needs only 2 pairs of parallel sides. Many parallelograms lean and have no right angles.
        - |
          Correct. Every square has 4 right angles, as well as 4 equal sides.
        - |
          A quadrilateral is any shape with 4 sides. Most quadrilaterals have no right angles.
      answer: 2

    - slug: g4math-w28-q13
      type: numeric
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section B"
      points: 1
      prompt: |
        A soccer field is a rectangle 120 meters long and 45 meters wide. What is its area, in square meters?
      answer: { value: 5400, tolerance: 0 }
      explanation: |
        Area = length × width = 120 × 45. 100 × 45 = 4,500 and 20 × 45 = 900, so 120 × 45 = 4,500 + 900 = 5,400 square meters.

    - slug: g4math-w28-q14
      type: short_answer
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 8, Section B"
      points: 2
      prompt: |
        A rectangle garden bed has an area of 48 square feet. Its length is 8 feet.

        (a) What is its width? Show how you know.
        (b) What is its perimeter? Show your work.
      answer: |
        (a) 6 feet. 8 × ? = 48, and 48 ÷ 8 = 6.
        (b) 28 feet. 2 × 8 + 2 × 6 = 16 + 12 = 28.
      explanation: |
        Two points.

        (a) 1 pt: width 6 ft, found by dividing 48 by 8 or by solving 8 × ? = 48.

        (b) 1 pt: perimeter 28 ft with work that adds all four sides (8 + 6 + 8 + 6) or uses 2 × 8 + 2 × 6. If the width in (a) is wrong, give this point when the perimeter is right for that width.

    - slug: g4math-w28-q15
      type: multiple_choice
      topic_code: "4.NF.C.7"
      source: "IM K–5 Math Grade 4, Unit 4, Section A"
      points: 1
      prompt: |
        Review: which decimal is greater than 0.6?
      options:
        - "0.58"
        - "0.06"
        - "0.59"
        - "0.65"
      option_explanations:
        - |
          0.58 has 5 tenths and 0.6 has 6 tenths, so 0.58 is less. More digits do not make a decimal bigger.
        - |
          0.06 is 6 hundredths, which is much less than 6 tenths.
        - |
          0.59 has 5 tenths, and 0.6 has 6 tenths, so 0.59 is less than 0.6.
        - |
          Correct. 0.6 is the same as 0.60, and 65 hundredths is more than 60 hundredths.
      answer: 3
