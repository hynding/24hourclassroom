<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" font-family="sans-serif" font-size="16">
  <title>A right angle split into two parts by a ray</title>
  <rect x="0" y="0" width="440" height="290" fill="#ffffff"/>
  <line x1="110" y1="260" x2="410" y2="260" stroke="#1c2733" stroke-width="2.5"/>
  <polygon points="410,260 400,264.5 400,255.5" fill="#1c2733"/>
  <line x1="110" y1="260" x2="110" y2="35" stroke="#1c2733" stroke-width="2.5"/>
  <polygon points="110,35 114.5,45 105.5,45" fill="#1c2733"/>
  <line x1="110" y1="260" x2="331.2" y2="105.1" stroke="#2457c5" stroke-width="2.5"/>
  <polygon points="331.2,105.1 325.5,114.6 320.4,107.2" fill="#2457c5"/>
  <path d="M 180 260 A 70 70 0 0 0 167.3 219.8" fill="none" stroke="#1f6f54" stroke-width="2.5"/>
  <path d="M 152.6 230.2 A 52 52 0 0 0 110 208" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="205.4" y="235.9" text-anchor="middle" fill="#1f6f54" font-weight="bold">35°</text>
  <text x="146.9" y="195" text-anchor="middle" fill="#c0392b" font-weight="bold">?</text>
  <circle cx="110" cy="260" r="4.5" fill="#1c2733"/>
  <text x="300" y="60" text-anchor="middle" fill="#1c2733" font-weight="bold">The whole angle is 90°.</text>
</svg>
