<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" font-family="sans-serif" font-size="16">
  <title>A plus-sign tile made of five equal squares</title>
  <rect x="0" y="0" width="340" height="220" fill="#ffffff"/>
  <polygon points="140,20 200,20 200,80 260,80 260,140 200,140 200,200 140,200 140,140 80,140 80,80 140,80" fill="#1f6f54" stroke="#1f6f54" stroke-width="3" stroke-linejoin="round" fill-opacity="0.25"/>
  <line x1="140" y1="80" x2="200" y2="80" stroke="#1f6f54" stroke-width="1.5"/>
  <line x1="140" y1="140" x2="200" y2="140" stroke="#1f6f54" stroke-width="1.5"/>
  <line x1="140" y1="80" x2="140" y2="140" stroke="#1f6f54" stroke-width="1.5"/>
  <line x1="200" y1="80" x2="200" y2="140" stroke="#1f6f54" stroke-width="1.5"/>
</svg>
