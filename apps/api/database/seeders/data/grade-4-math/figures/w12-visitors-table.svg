  <text x="76" y="108" fill="#1c2733">Maple Park</text>
  <text x="416" y="108" text-anchor="end" fill="#1c2733">86,402</text>
  <text x="76" y="146" fill="#1c2733">River Park</text>
  <text x="416" y="146" text-anchor="end" fill="#1c2733">86,240</text>
  <text x="76" y="184" fill="#1c2733">Hill Park</text>
  <text x="416" y="184" text-anchor="end" fill="#1c2733">9,875</text>
  <text x="76" y="222" fill="#1c2733">Lake Park</text>
