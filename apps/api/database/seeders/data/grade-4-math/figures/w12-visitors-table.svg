  <line x1="60" y1="83" x2="440" y2="83" stroke="#1c2733" stroke-width="2"/>
  <line x1="60" y1="121" x2="440" y2="121" stroke="#1c2733" stroke-width="1"/>
  <line x1="60" y1="159" x2="440" y2="159" stroke="#1c2733" stroke-width="1"/>
  <line x1="60" y1="197" x2="440" y2="197" stroke="#1c2733" stroke-width="1"/>
  <line x1="60" y1="235" x2="440" y2="235" stroke="#1c2733" stroke-width="2"/>
  <line x1="60" y1="45" x2="60" y2="235" stroke="#1c2733" stroke-width="2"/>
