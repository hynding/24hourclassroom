<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 255" font-family="sans-serif" font-size="16">
  <title>Visitors to Four Parks in One Year</title>
  <rect x="0" y="0" width="500" height="255" fill="#ffffff"/>
  <text x="250" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c2733">Visitors to Four Parks in One Year</text>
  <rect x="60" y="45" width="380" height="38" fill="#b8bfc6"/>
  <text x="160" y="70" text-anchor="middle" font-weight="bold" fill="#1c2733">Park</text>
