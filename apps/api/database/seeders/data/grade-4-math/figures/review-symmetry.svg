  <rect x="25" y="80" width="110" height="70" fill="#ffffff" stroke="#2457c5" stroke-width="3"/>
  <line x1="25" y1="80" x2="135" y2="150" stroke="#1c2733" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="80" y="200" text-anchor="middle" fill="#1c2733" font-weight="bold">Shape A</text>
  <polygon points="215,60 165,165 265,165" fill="#ffffff" stroke="#2457c5" stroke-width="3"/>
  <line x1="215" y1="50" x2="215" y2="175" stroke="#1c2733" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="215" y="200" text-anchor="middle" fill="#1c2733" font-weight="bold">Shape B</text>
  <polygon points="320,150 360,80 430,80 390,150" fill="#ffffff" stroke="#2457c5" stroke-width="3"/>
  <line x1="375" y1="65" x2="375" y2="165" stroke="#1c2733" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="375" y="200" text-anchor="middle" fill="#1c2733" font-weight="bold">Shape C</text>
  <polygon points="490,60 490,160 560,160" fill="#ffffff" stroke="#2457c5" stroke-width="3"/>
  <line x1="478" y1="110" x2="572" y2="110" stroke="#1c2733" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="525" y="200" text-anchor="middle" fill="#1c2733" font-weight="bold">Shape D</text>
</svg>
