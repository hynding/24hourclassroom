<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 165" font-family="sans-serif" font-size="16">
  <title>Trees for the Town</title>
  <rect x="0" y="0" width="600" height="165" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c2733">Trees for the Town</text>
  <line x1="50" y1="72" x2="550" y2="72" stroke="#1c2733" stroke-width="2"/>
  <line x1="50" y1="64" x2="50" y2="80" stroke="#1c2733" stroke-width="2"/>
  <line x1="550" y1="64" x2="550" y2="80" stroke="#1c2733" stroke-width="2"/>
  <text x="300" y="60" text-anchor="middle" font-weight="bold" fill="#1c2733">25,000 trees in all</text>
  <rect x="50" y="92" width="327.0" height="50" fill="#2457c5" stroke="#1c2733" stroke-width="2"/>
  <text x="213.5" y="123" text-anchor="middle" font-weight="bold" fill="#ffffff">16,348 planted</text>
  <rect x="377.0" y="92" width="173.0" height="50" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <text x="463.5" y="123" text-anchor="middle" font-weight="bold" fill="#1c2733">t to plant</text>
</svg>
