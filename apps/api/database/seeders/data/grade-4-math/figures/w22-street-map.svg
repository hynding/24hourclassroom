<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="sans-serif" font-size="16">
  <title>Street map with four straight streets</title>
  <rect x="0" y="0" width="520" height="300" fill="#ffffff"/>
  <line x1="240" y1="80" x2="20" y2="80" stroke="#2457c5" stroke-width="4"/>
  <polygon points="20,80 30,75.5 30,84.5" fill="#2457c5"/>
  <line x1="240" y1="80" x2="500" y2="80" stroke="#2457c5" stroke-width="4"/>
  <polygon points="500,80 490,84.5 490,75.5" fill="#2457c5"/>
  <text x="330" y="68" text-anchor="middle" fill="#1c2733">Oak Street</text>
  <line x1="240" y1="220" x2="20" y2="220" stroke="#2457c5" stroke-width="4"/>
  <polygon points="20,220 30,215.5 30,224.5" fill="#2457c5"/>
  <line x1="240" y1="220" x2="500" y2="220" stroke="#2457c5" stroke-width="4"/>
  <polygon points="500,220 490,224.5 490,215.5" fill="#2457c5"/>
  <text x="330" y="208" text-anchor="middle" fill="#1c2733">Pine Street</text>
  <line x1="150" y1="150" x2="150" y2="18" stroke="#2457c5" stroke-width="4"/>
  <polygon points="150,18 154.5,28 145.5,28" fill="#2457c5"/>
  <line x1="150" y1="150" x2="150" y2="292" stroke="#2457c5" stroke-width="4"/>
  <polygon points="150,292 145.5,282 154.5,282" fill="#2457c5"/>
  <text x="138" y="150" text-anchor="middle" fill="#1c2733" transform="rotate(-90 138 150)">Main Street</text>
  <polyline points="166,80 166,64 150,64" fill="none" stroke="#1c2733" stroke-width="1.5"/>
  <polyline points="166,220 166,204 150,204" fill="none" stroke="#1c2733" stroke-width="1.5"/>
  <line x1="395" y1="290" x2="494.2" y2="17.5" stroke="#2457c5" stroke-width="4"/>
  <polygon points="494.2,17.5 495,28.5 486.5,25.4" fill="#2457c5"/>
  <line x1="494.2" y1="17.5" x2="391.6" y2="299.4" stroke="#2457c5" stroke-width="4"/>
  <polygon points="391.6,299.4 390.8,288.4 399.2,291.5" fill="#2457c5"/>
  <text x="470" y="160" text-anchor="middle" fill="#1c2733" transform="rotate(-70 470 160)">Hill Road</text>
</svg>
