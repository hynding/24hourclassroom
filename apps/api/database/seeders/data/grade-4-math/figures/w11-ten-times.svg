<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" font-family="sans-serif" font-size="16">
  <title>Ten Times as Much</title>
  <rect x="0" y="0" width="600" height="140" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c2733">Ten Times as Much</text>
  <rect x="30" y="60" width="130" height="56" rx="6" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <text x="95" y="96" text-anchor="middle" font-size="24" font-weight="bold" fill="#2457c5">500</text>
  <rect x="235" y="60" width="130" height="56" rx="6" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <text x="300" y="96" text-anchor="middle" font-size="24" font-weight="bold" fill="#2457c5">5,000</text>
  <rect x="440" y="60" width="130" height="56" rx="6" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <text x="505" y="96" text-anchor="middle" font-size="24" font-weight="bold" fill="#2457c5">50,000</text>
  <line x1="168" y1="88" x2="217" y2="88" stroke="#1f6f54" stroke-width="3"/>
  <polygon points="227,88 215,81 215,95" fill="#1f6f54"/>
  <text x="197.5" y="76" text-anchor="middle" font-weight="bold" fill="#1f6f54">× 10</text>
  <line x1="373" y1="88" x2="422" y2="88" stroke="#1f6f54" stroke-width="3"/>
  <polygon points="432,88 420,81 420,95" fill="#1f6f54"/>
  <text x="402.5" y="76" text-anchor="middle" font-weight="bold" fill="#1f6f54">× 10</text>
</svg>
