<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 166" font-family="sans-serif" font-size="16">
  <title>Place-Value Chart</title>
  <rect x="0" y="0" width="580" height="166" fill="#ffffff"/>
  <text x="290" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c2733">Place-Value Chart</text>
  <rect x="20" y="45" width="540" height="50" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
