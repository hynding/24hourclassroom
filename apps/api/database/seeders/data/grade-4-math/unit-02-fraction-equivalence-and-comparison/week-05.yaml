week: 5
unit: 2
title: "Comparing Fractions"
topics: ["4.NF.A.2"]
guide: guides/week-05.md
guide_description: |
  Four ways to compare two fractions: same denominator, same numerator, a benchmark such as 1/2 or 1, and
  rewriting one or both fractions as equivalent fractions with a common denominator, plus putting several
  fractions in order and explaining which is greater.
flashcards_description: |
  18 cards on comparing fractions with the same denominator or the same numerator, comparing with 1/2 and 1,
  finding a common denominator, the "missing piece" idea, ordering fractions, and common comparing mistakes.

flashcards:
  - front: Same denominator → how to compare
    back: |
      The parts are the same size, so compare the numerators. 5/8 is greater than 3/8, because 5 eighths is more than 3 eighths.
    topic_code: "4.NF.A.2"
  - front: Same numerator → how to compare
    back: |
      You have the same number of parts, so compare the part sizes. A smaller denominator means bigger parts: 3/5 is greater than 3/10.
    topic_code: "4.NF.A.2"
  - front: Comparing with 1/2 → when it helps
    back: |
      When one fraction is more than 1/2 and the other is less. 4/6 is more than 1/2 and 3/8 is less, so 4/6 is greater.
    topic_code: "4.NF.A.2"
  - front: Missing piece → how it helps compare fractions near 1
    back: |
      Look at how far each fraction is from 1. 7/8 is missing 1/8 and 9/10 is missing 1/10. 1/10 is the smaller gap, so 9/10 is greater.
    topic_code: "4.NF.A.2"
  - front: Common denominator → what it means
    back: |
      A denominator both fractions can be written with. Twelfths work for thirds and fourths, because 3 and 4 are both factors of 12.
    topic_code: "4.NF.A.2"
  - front: 2/3 and 3/4 → compare with a common denominator
    back: |
      2/3 = 8/12 and 3/4 = 9/12. 9/12 is greater, so 3/4 is greater than 2/3.
    topic_code: "4.NF.A.2"
  - front: 3/4 and 5/8 → compare
    back: |
      Rewrite 3/4 as 6/8. 6/8 is greater than 5/8, so 3/4 is greater.
    topic_code: "4.NF.A.2"
  - front: 2/3 and 5/6 → compare
    back: |
      Rewrite 2/3 as 4/6. 5/6 is greater than 4/6, so 5/6 is greater.
    topic_code: "4.NF.A.2"
  - front: 5/12 and 1/2 → compare
    back: |
      1/2 = 6/12, and 5/12 is less than 6/12, so 5/12 is less than 1/2.
    topic_code: "4.NF.A.2"
  - front: 7/10 and 70/100 → compare
    back: |
      They are equal. 7/10 = 70/100, because each tenth is 10 hundredths.
    topic_code: "4.NF.A.2"
  - front: 1/8 and 1/12 → which is greater
    back: |
      1/8. A whole cut into 8 parts has bigger parts than a whole cut into 12.
    topic_code: "4.NF.A.2"
  - front: 3/5 and 3/8 → which is greater
    back: |
      3/5. Both have 3 parts, but fifths are bigger than eighths.
    topic_code: "4.NF.A.2"
  - front: 5/4 and 9/10 → which is greater
    back: |
      5/4. It is more than 1 whole, and 9/10 is less than 1.
    topic_code: "4.NF.A.2"
  - front: Ordering three fractions → a plan
    back: |
      Sort them first by benchmark (near 0, below 1/2, above 1/2, near 1). Then compare any two in the same group with a common denominator or numerator.
    topic_code: "4.NF.A.2"
  - front: Comparing fractions → the same-size-whole rule
    back: |
      Only compare fractions of wholes that are the same size. 1/2 of a large melon is more than 3/4 of a tiny one.
    topic_code: "4.NF.A.2"
  - front: Comparing mistake → judging by the denominator alone
    back: |
      A bigger denominator does not mean a bigger fraction. 1/6 is less than 1/4, because sixths are smaller parts.
    topic_code: "4.NF.A.2"
  - front: Comparing mistake → "one piece short means equal"
    back: |
      3/4 and 7/8 are each one piece short of 1, but the pieces differ. A missing 1/4 is bigger than a missing 1/8, so 7/8 is greater.
    topic_code: "4.NF.A.2"
  - front: Comparison words → how to write them
    back: |
      Write "is greater than", "is less than" or "is equal to": 2/3 is greater than 1/2. Always say which fraction is which.
    topic_code: "4.NF.A.2"

quiz:
  description: |
    14 questions · about 30 minutes · comparing fractions with the same denominator or numerator, with the
    benchmarks 1/2 and 1, and with a common denominator, and ordering fractions, with review of equivalent
    fractions and Unit 1. Multiple choice, select-all, true/false and number answers are graded at once; the
    fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w05-q01
      type: multiple_choice
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section C"
      points: 1
      figure: figures/w05-strips-fifths-eighths.svg
      figure_alt: "Two strips of the same length, one above the other. Strip A is cut into 5 equal parts with the first 3 shaded blue. Strip B is cut into 8 equal parts with the first 3 shaded blue. The shaded part of strip A is longer."
      prompt: |
        Strip A shows 3/5 and strip B shows 3/8. Which comparison is true?
      options:
        - "3/8 is greater than 3/5, because 8 is greater than 5."
        - "3/5 and 3/8 are equal, because both have 3 shaded parts."
        - "They cannot be compared, because the denominators are different."
        - "3/5 is greater than 3/8."
      option_explanations:
        - |
          A bigger denominator means the whole is cut into more, smaller parts. Eighths are smaller than fifths.
        - |
          Both have 3 parts, but the parts are different sizes. The 3 fifths cover more of the strip than the 3 eighths.
        - |
          Fractions with different denominators can be compared. Here the numerators match, so compare the part sizes.
        - |
          Correct. Both fractions have 3 parts, and fifths are bigger parts than eighths, so 3/5 covers more of the same-size strip.
      answer: 3

    - slug: g4math-w05-q02
      type: multiple_choice
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section C"
      points: 1
      stimulus: |
        Use the two pizzas. They are the same size. Pizza A was cut into 4 equal slices, and the 3 shaded slices are left. Pizza B was cut into 8 equal slices, and the 5 shaded slices are left.
      figure: figures/w05-pizzas.svg
      figure_alt: "Two circles of the same size labeled Pizza A and Pizza B. Pizza A is cut into 4 equal slices with 3 shaded blue. Pizza B is cut into 8 equal slices with 5 shaded blue."
      prompt: |
        Which pizza has more left?
      options:
        - "Pizza B, because 5 slices is more than 3 slices."
        - "Pizza A, because 3/4 = 6/8, and 6/8 is more than 5/8."
        - "They have the same amount left."
        - "Pizza B, because 8 is more than 4."
      option_explanations:
        - |
          Pizza B's slices are smaller, so counting slices is not fair. Write both in eighths first.
        - |
          Correct. Each fourth of pizza A is the same as 2 eighths, so 3/4 = 6/8. 6 eighths is more than 5 eighths.
        - |
          3/4 is 6/8, which is one eighth more than 5/8, so the amounts are not equal.
        - |
          The denominator tells how many slices the whole pizza was cut into, not how much is left.
      answer: 1

    - slug: g4math-w05-q03
      type: numeric
      topic_code: "4.NF.A.1"
      source: "IM K–5 Math Grade 4, Unit 2, Section B"
      points: 1
      stimulus: |
        Use the two pizzas. They are the same size. Pizza A was cut into 4 equal slices, and the 3 shaded slices are left. Pizza B was cut into 8 equal slices, and the 5 shaded slices are left.
      prompt: |
        If every slice of pizza A were cut in half, how many eighths of pizza A would be left?
      answer: { value: 6, tolerance: 0 }
      explanation: |
        Each of the 3 slices left becomes 2 eighths, so 3 × 2 = 6 eighths. 3/4 = 6/8.

    - slug: g4math-w05-q04
      type: multiple_choice
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section C"
      points: 1
      prompt: |
        Which is greater, 2/3 or 5/12? Choose the best answer.
      options:
        - "2/3, because it is more than 1/2 and 5/12 is less than 1/2."
        - "5/12, because 5 and 12 are bigger numbers."
        - "They are equal."
        - "5/12, because twelfths are bigger parts than thirds."
      option_explanations:
        - |
          Correct. 2/3 is more than half (half of 3 is 1 1/2), and 5/12 is less than half (half of 12 is 6). So 2/3 is greater.
        - |
          Bigger numbers do not make a bigger fraction. 5/12 is less than 6/12, which is one half.
        - |
          In twelfths, 2/3 = 8/12, which is 3 twelfths more than 5/12, so they are not equal.
        - |
          It is the other way around: twelfths are smaller parts than thirds, because the whole is cut into more parts.
      answer: 0

    - slug: g4math-w05-q05
      type: multi_select
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section C"
      points: 2
      partial_credit: true
      prompt: |
        Select every comparison that is true.
      options:
        - "4/10 is less than 1/2."
        - "5/6 is greater than 5/8."
        - "7/12 is less than 5/12."
        - "2/5 is greater than 3/5."
        - "9/10 is greater than 3/4."
      option_explanations:
        - |
          True. 1/2 = 5/10, and 4/10 is one tenth less than that.
        - |
          True. Both have 5 parts, and sixths are bigger parts than eighths.
        - |
          False. The denominators are the same, so compare numerators: 7 twelfths is more than 5 twelfths.
        - |
          False. Same denominator, so compare numerators: 2 fifths is less than 3 fifths.
        - |
          True. 9/10 is only 1/10 away from 1, and 3/4 is 1/4 away. The smaller gap means the bigger fraction.
      answer: [0, 1, 4]

    - slug: g4math-w05-q06
      type: true_false
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section C"
      points: 1
      prompt: |
        True or false: 1/6 is greater than 1/4, because 6 is greater than 4.
      answer: false
      explanation: |
        False. A whole cut into 6 equal parts has smaller parts than a whole cut into 4. So one sixth is less than one fourth.

    - slug: g4math-w05-q07
      type: fill_blank
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section C"
      points: 1
      prompt: |
        A friendly number such as 0, 1/2 or 1 that we use to compare fractions is called a ____.
      answer: ["benchmark", "a benchmark", "benchmarks", "benchmark number"]
      explanation: |
        A benchmark is a number we know well and can compare to. If one fraction is more than the benchmark 1/2 and the other is less, we know which is greater.

    - slug: g4math-w05-q08
      type: multiple_choice
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section C"
      points: 1
      prompt: |
        Three friends ate 5/6, 1/2 and 1/8 of their same-size sandwiches. Which list puts these fractions in order from least to greatest?
      options:
        - "5/6, 1/2, 1/8"
        - "1/2, 1/8, 5/6"
        - "1/8, 1/2, 5/6"
        - "1/8, 5/6, 1/2"
      option_explanations:
        - |
          This list goes from greatest to least. The question asks for least first.
        - |
          1/8 is less than 1/2 (it is close to 0), so 1/8 must come before 1/2.
        - |
          Correct. 1/8 is close to 0, 1/2 is in the middle, and 5/6 is close to 1.
        - |
          5/6 is more than 1/2 (half of 6 is 3, and 5 is more), so 5/6 goes last.
      answer: 2

    - slug: g4math-w05-q09
      type: numeric
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section C"
      points: 1
      prompt: |
        Ella wants a fraction in eighths that is greater than 3/4 but less than 1. What is its numerator?
      answer: { value: 7, tolerance: 0 }
      explanation: |
        3/4 = 6/8 and 1 = 8/8. The only eighth between them is 7/8, so the numerator is 7.

    - slug: g4math-w05-q10
      type: multiple_choice
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section C"
      points: 1
      figure: figures/w05-walk-number-lines.svg
      figure_alt: "Two number lines from 0 to 1 of the same length, one above the other. The top line is split into 8 equal parts with a dot labeled Mia on the seventh tick mark after 0. The bottom line is split into 10 equal parts with a dot labeled Omar on the ninth tick mark after 0. Omar's dot is a little closer to 1."
      prompt: |
        Mia walked 7/8 of a mile and Omar walked 9/10 of a mile. Who walked farther?
      options:
        - "Mia, because eighths are bigger pieces than tenths."
        - "Omar, because he was 1/10 of a mile from 1 mile and Mia was 1/8 of a mile from it, and 1/10 is smaller."
        - "They walked the same distance, because each was one piece short of 1 mile."
        - "You cannot tell without knowing how long they walked."
      option_explanations:
        - |
          Eighths are bigger, but that makes Mia's missing piece bigger too. She is 1/8 short of a mile, which is farther from 1.
        - |
          Correct. Each is one piece short of 1 mile. Omar's missing piece, 1/10, is smaller than Mia's, 1/8, so Omar is closer to 1 mile.
        - |
          The missing pieces are different sizes: 1/8 is bigger than 1/10. On the number lines Omar's dot is closer to 1.
        - |
          The fractions are parts of the same whole, 1 mile, so they can be compared. The number lines show it.
      answer: 1

    - slug: g4math-w05-q11
      type: multiple_choice
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section C"
      points: 1
      prompt: |
        Kenji and Lila have ribbons of the same length. Kenji uses 2/3 of his ribbon and Lila uses 3/4 of hers. Who used more ribbon?
      options:
        - "Kenji, because thirds are bigger than fourths."
        - "They used the same, because each has one part left."
        - "Lila, because 2/3 = 8/12 and 3/4 = 9/12."
        - "Kenji, because 2/3 = 8/12 and 3/4 = 6/12."
      option_explanations:
        - |
          Thirds are bigger, but Kenji uses only 2 of them. Write both fractions in twelfths to compare fairly.
        - |
          Each has one part left, but Kenji's leftover third is bigger than Lila's leftover fourth, so they did not use the same.
        - |
          Correct. Twelfths work for both: 2/3 = 8/12 and 3/4 = 9/12. 9 twelfths is more, so Lila used more.
        - |
          3/4 is not 6/12: 6/12 is one half. Multiply both parts of 3/4 by 3 to get 9/12.
      answer: 2

    - slug: g4math-w05-q12
      type: numeric
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      prompt: |
        A rectangular picture frame is 11 centimeters long and 4 centimeters wide. What is its perimeter in centimeters?
      answer: { value: 30, tolerance: 0 }
      explanation: |
        Add all four sides: 11 + 4 + 11 + 4 = 30 centimeters.

    - slug: g4math-w05-q13
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      prompt: |
        Which number has 7 as a factor?
      options:
        - "56"
        - "27"
        - "47"
        - "75"
      option_explanations:
        - |
          Correct. 7 × 8 = 56, so 7 is a factor of 56.
        - |
          27 ends in 7, but 7 × 3 = 21 and 7 × 4 = 28. 7 is not a factor of 27.
        - |
          47 ends in 7, but 7 × 6 = 42 and 7 × 7 = 49. 7 is not a factor of 47.
        - |
          75 starts with 7, but 7 × 10 = 70 and 7 × 11 = 77. 7 is not a factor of 75.
      answer: 0

    - slug: g4math-w05-q14
      type: short_answer
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section C"
      points: 2
      prompt: |
        Two friends compare 5/8 and 2/5.

        (a) Which fraction is greater?
        (b) Explain how you know, using 1/2 as a benchmark.
      answer: |
        (a) 5/8.
        (b) Half of 8 is 4, and 5 is more than 4, so 5/8 is more than 1/2. Half of 5 is 2 1/2, and 2 is less than that, so 2/5 is less than 1/2. A fraction more than 1/2 is greater than a fraction less than 1/2.
      explanation: |
        Two points.

        (a) 1 pt: 5/8.

        (b) 1 pt: places each fraction against 1/2 (5/8 above, 2/5 below) with a reason for each, such as half of the denominator. Number lines or strips that show this also earn the point.
