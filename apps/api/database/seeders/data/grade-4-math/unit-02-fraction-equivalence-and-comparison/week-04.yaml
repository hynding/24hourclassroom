week: 4
unit: 2
title: "Equivalent Fractions"
topics: ["4.NF.A.1"]
guide: guides/week-04.md
guide_description: |
  Why two different fractions can name the same amount, how cutting every part into smaller equal parts makes
  an equivalent fraction, how to find one by multiplying the numerator and denominator by the same number, and
  how to check with area diagrams and number lines.
flashcards_description: |
  18 cards on equivalent fractions with halves, thirds, fourths, fifths, sixths, eighths, tenths, twelfths and
  hundredths, the multiply-top-and-bottom rule and why it works, and the add-the-same-number mistake.

flashcards:
  - front: Equivalent fractions → what they are
    back: |
      Different fractions that name the same amount, or the same point on a number line. 3/4 and 6/8 are equivalent.
    topic_code: "4.NF.A.1"
  - front: Making an equivalent fraction → the rule
    back: |
      Multiply the numerator and the denominator by the same number. 2/3 = (2 × 4)/(3 × 4) = 8/12.
    topic_code: "4.NF.A.1"
  - front: Multiplying top and bottom by the same number → why it works
    back: |
      It is like cutting every part into that many smaller equal parts. There are more parts in the whole and more parts shaded, but the shaded amount does not change.
    topic_code: "4.NF.A.1"
  - front: 1/2 → equivalent fractions in tenths and twelfths
    back: |
      5/10 and 6/12. In each, the numerator is half of the denominator.
    topic_code: "4.NF.A.1"
  - front: 3/4 → equivalent fractions in eighths, twelfths and hundredths
    back: |
      6/8, 9/12 and 75/100.
    topic_code: "4.NF.A.1"
  - front: 2/5 → equivalent fractions in tenths and hundredths
    back: |
      4/10 and 40/100.
    topic_code: "4.NF.A.1"
  - front: 1/3 → equivalent fractions in sixths and twelfths
    back: |
      2/6 and 4/12.
    topic_code: "4.NF.A.1"
  - front: 7/10 → the equivalent fraction in hundredths
    back: |
      70/100. Each tenth is cut into 10 hundredths: 7 × 10 = 70 and 10 × 10 = 100.
    topic_code: "4.NF.A.1"
  - front: 5/6 = ?/12 → the missing numerator
    back: |
      10. The denominator was multiplied by 2 (6 × 2 = 12), so the numerator is too: 5 × 2 = 10.
    topic_code: "4.NF.A.1"
  - front: 9/12 = ?/4 → the missing numerator
    back: |
      3. Going from twelfths to fourths divides the denominator by 3, so divide the numerator by 3: 9 ÷ 3 = 3.
    topic_code: "4.NF.A.1"
  - front: 3/5 = ?/100 → the missing numerator
    back: |
      60. 5 × 20 = 100, so 3 × 20 = 60.
    topic_code: "4.NF.A.1"
  - front: Adding the same number to top and bottom → does it make an equivalent fraction?
    back: |
      No. 1/2 and 2/3 (adding 1 to each) are not equal: 2/3 is more than 1/2. Only multiplying (or dividing) top and bottom by the same number works.
    topic_code: "4.NF.A.1"
  - front: Equivalent fractions on a number line → what to look for
    back: |
      They land on the same point. On lines from 0 to 1 in fifths and in tenths, 3/5 and 6/10 line up.
    topic_code: "4.NF.A.1"
  - front: Area diagram for 2/3 = 4/6 → how to draw it
    back: |
      Draw a rectangle in 3 equal columns and shade 2. Draw one line across the middle. Now there are 6 equal parts and 4 are shaded.
    topic_code: "4.NF.A.1"
  - front: Fraction strips for 1/4 = 2/8 → what you see
    back: |
      One 1/4 piece is exactly as long as two 1/8 pieces laid end to end.
    topic_code: "4.NF.A.1"
  - front: Fractions equal to 1 → some examples
    back: |
      2/2, 5/5, 10/10, 12/12. Any fraction whose numerator equals its denominator is 1 whole.
    topic_code: "4.NF.A.1"
  - front: Twice as many parts → what happens to their size
    back: |
      Each part is half as big. Cutting fourths into eighths doubles the number of parts and halves their size, so 3/4 = 6/8.
    topic_code: "4.NF.A.1"
  - front: Is 4/6 equivalent to 6/8? → how to check
    back: |
      Not equivalent. 4/6 = 8/12 and 6/8 = 9/12, so they name different amounts. Rewrite both with the same denominator to check.
    topic_code: "4.NF.A.1"

quiz:
  description: |
    14 questions · about 30 minutes · equivalent fractions from area diagrams and number lines, multiplying the
    numerator and denominator by the same number, finding a missing numerator, and the add-the-same-number
    mistake, with review of benchmarks and Unit 1. Multiple choice, select-all, true/false and number answers are
    graded at once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w04-q01
      type: multiple_choice
      topic_code: "4.NF.A.1"
      source: "IM K–5 Math Grade 4, Unit 2, Section B"
      points: 1
      stimulus: |
        Use the rectangle. It was split into 4 equal columns, and 3 columns were shaded to show 3/4. Then every column was cut into 3 equal pieces.
      figure: figures/w04-area-model-fourths.svg
      figure_alt: "A rectangle split by thick lines into 4 equal columns. The 3 columns on the left are shaded blue and the column on the right is white. Thin lines cut every column into 3 equal pieces, so the rectangle has 12 equal pieces and 9 of them are shaded."
      prompt: |
        What fraction of the rectangle is shaded, written in twelfths?
      options:
        - "3/12"
        - "6/12"
        - "9/12"
        - "7/12"
      option_explanations:
        - |
          3/12 multiplies only the denominator. Each of the 3 shaded columns now has 3 pieces, so 9 pieces are shaded.
        - |
          6/12 would be half the rectangle. Here 3 of 4 columns are shaded, which is more than half: 9 of the 12 pieces.
        - |
          Correct. There are 4 × 3 = 12 equal pieces, and the 3 shaded columns hold 3 × 3 = 9 of them, so 3/4 = 9/12.
        - |
          7/12 comes from adding 3 + 4. Count the shaded pieces: 3 in each of 3 columns makes 9.
      answer: 2

    - slug: g4math-w04-q02
      type: numeric
      topic_code: "4.NF.A.1"
      source: "IM K–5 Math Grade 4, Unit 2, Section B"
      points: 1
      stimulus: |
        Use the rectangle. It was split into 4 equal columns, and 3 columns were shaded to show 3/4. Then every column was cut into 3 equal pieces.
      prompt: |
        Going from 3/4 to the new fraction in twelfths, both the numerator and the denominator were multiplied by the same number. What number?
      answer: { value: 3, tolerance: 0 }
      explanation: |
        Every column was cut into 3 pieces, so there are 3 times as many parts in the whole and 3 times as many shaded parts: 3/4 = (3 × 3)/(4 × 3) = 9/12.

    - slug: g4math-w04-q03
      type: multiple_choice
      topic_code: "4.NF.A.1"
      source: "IM K–5 Math Grade 4, Unit 2, Section B"
      points: 1
      figure: figures/w04-number-lines-fifths-tenths.svg
      figure_alt: "Two number lines from 0 to 1, one above the other, with 0 and 1 lined up. The top line is split into 5 equal parts, and a dot labeled A sits on the third tick mark after 0. The bottom line is split into 10 equal parts. Only 0 and 1 are labeled on each line."
      prompt: |
        Point A is on the top line. Which fraction on the bottom line is at the same place as A?
      options:
        - "3/10"
        - "6/10"
        - "5/10"
        - "8/10"
      option_explanations:
        - |
          3/10 keeps the same numerator. Tenths are half the size of fifths, so it takes twice as many: 6 tenths.
        - |
          Correct. A is at 3/5. Every fifth on the top line matches 2 tenths on the bottom line, so 3/5 = 6/10.
        - |
          5/10 is the same as 1/2, which is to the left of A. A is past the middle of the line.
        - |
          8/10 comes from adding 5 to the numerator. Line up the marks: A sits above the sixth tick after 0 on the bottom line.
      answer: 1

    - slug: g4math-w04-q04
      type: multiple_choice
      topic_code: "4.NF.A.1"
      source: "IM K–5 Math Grade 4, Unit 2, Section B"
      points: 1
      prompt: |
        A recipe uses 2/5 of a bag of flour. Which fraction of the bag is the same amount?
      options:
        - "4/7"
        - "2/10"
        - "5/2"
        - "4/10"
      option_explanations:
        - |
          4/7 adds 2 to the top and the bottom. Adding the same number does not keep the amount the same.
        - |
          2/10 changes only the denominator. Tenths are smaller pieces, so 2 tenths is less than 2 fifths.
        - |
          5/2 swaps the numerator and denominator. 5/2 is more than 2 wholes, while 2/5 is less than 1.
        - |
          Correct. Multiply the numerator and the denominator by 2: (2 × 2)/(5 × 2) = 4/10.
      answer: 3

    - slug: g4math-w04-q05
      type: multi_select
      topic_code: "4.NF.A.1"
      source: "IM K–5 Math Grade 4, Unit 2, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Select all the fractions that are equivalent to 3/4.
      options:
        - "6/8"
        - "9/12"
        - "4/5"
        - "75/100"
        - "6/12"
      option_explanations:
        - |
          Equivalent. Multiply the top and bottom of 3/4 by 2: 6/8.
        - |
          Equivalent. Multiply the top and bottom of 3/4 by 3: 9/12.
        - |
          Not equivalent. 4/5 adds 1 to the top and the bottom of 3/4, which changes the amount.
        - |
          Equivalent. Multiply the top and bottom of 3/4 by 25: 75/100.
        - |
          Not equivalent. 6/12 is the same as 1/2. To keep 3/4, twelfths need a numerator of 9.
      answer: [0, 1, 3]

    - slug: g4math-w04-q06
      type: true_false
      topic_code: "4.NF.A.1"
      source: "IM K–5 Math Grade 4, Unit 2, Section B"
      points: 1
      prompt: |
        True or false: 2/3 and 3/4 are equivalent, because you can add 1 to the numerator and the denominator of 2/3 to get 3/4.
      answer: false
      explanation: |
        False. Adding the same number to the top and bottom changes the amount. In twelfths, 2/3 = 8/12 and 3/4 = 9/12, so 3/4 is a little more than 2/3.

    - slug: g4math-w04-q07
      type: fill_blank
      topic_code: "4.NF.A.1"
      source: "IM K–5 Math Grade 4, Unit 2, Section B"
      points: 1
      prompt: |
        Fractions that name the same amount, like 1/2 and 5/10, are called ____ fractions.
      answer: ["equivalent", "equal"]
      explanation: |
        Equivalent fractions name the same amount and sit at the same point on a number line, even though their numbers are different.

    - slug: g4math-w04-q08
      type: numeric
      topic_code: "4.NF.A.1"
      source: "IM K–5 Math Grade 4, Unit 2, Section B"
      points: 1
      prompt: |
        5/6 = ?/12. What number is the missing numerator?
      answer: { value: 10, tolerance: 0 }
      explanation: |
        6 × 2 = 12, so the denominator was multiplied by 2. Multiply the numerator by 2 as well: 5 × 2 = 10. So 5/6 = 10/12.

    - slug: g4math-w04-q09
      type: multiple_choice
      topic_code: "4.NF.A.1"
      source: "IM K–5 Math Grade 4, Unit 2, Section B"
      points: 1
      prompt: |
        Rosa cuts a sandwich into 4 equal parts and eats 1 part. Jamal cuts the same size sandwich into 8 equal parts. How many of his parts must Jamal eat to eat the same amount as Rosa?
      options:
        - "2"
        - "1"
        - "4"
        - "5"
      option_explanations:
        - |
          Correct. Each fourth is cut into 2 eighths, so 1/4 = 2/8. Jamal must eat 2 parts.
        - |
          Jamal's parts are smaller, because his sandwich is cut into 8 parts instead of 4. One eighth is less than one fourth.
        - |
          4 eighths is half the sandwich, which is more than Rosa's one fourth.
        - |
          5 comes from adding 4 to Rosa's 1 part. To make an equal amount, multiply: 1/4 = (1 × 2)/(4 × 2) = 2/8.
      answer: 0

    - slug: g4math-w04-q10
      type: multiple_choice
      topic_code: "4.NF.A.1"
      source: "IM K–5 Math Grade 4, Unit 2, Section B"
      points: 1
      prompt: |
        Which fraction is equivalent to 6/10?
      options:
        - "3/5"
        - "3/10"
        - "4/8"
        - "60/10"
      option_explanations:
        - |
          Correct. 3/5 = (3 × 2)/(5 × 2) = 6/10. Each fifth is the same as 2 tenths.
        - |
          3/10 halves only the numerator. 3 tenths is half of 6 tenths, not the same amount.
        - |
          4/8 takes 2 away from the top and the bottom. 4/8 equals 1/2, which is 5/10, not 6/10.
        - |
          60/10 multiplies only the numerator by 10. 60/10 is 6 wholes, much more than 6/10.
      answer: 0

    - slug: g4math-w04-q11
      type: multiple_choice
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section A"
      points: 1
      prompt: |
        Four students each ate part of a same-size apple. Which student's fraction is less than 1/2?
      options:
        - "5/8"
        - "5/12"
        - "4/6"
        - "7/10"
      option_explanations:
        - |
          Half of 8 is 4, and 5 is more than 4, so 5/8 is more than 1/2.
        - |
          Correct. Half of 12 is 6, and 5 is less than 6, so 5/12 is less than 1/2.
        - |
          Half of 6 is 3, and 4 is more than 3, so 4/6 is more than 1/2.
        - |
          Half of 10 is 5, and 7 is more than 5, so 7/10 is more than 1/2.
      answer: 1

    - slug: g4math-w04-q12
      type: numeric
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      prompt: |
        Ines counts by 9s: 9, 18, 27, ... What is the sixth number she says?
      answer: { value: 54, tolerance: 0 }
      explanation: |
        The sixth multiple of 9 is 6 × 9 = 54. (9, 18, 27, 36, 45, 54.)

    - slug: g4math-w04-q13
      type: multiple_choice
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      prompt: |
        A rectangle has an area of 40 square meters. One side is 5 meters long. What is its perimeter?
      options:
        - "13 meters"
        - "45 meters"
        - "26 meters"
        - "40 meters"
      option_explanations:
        - |
          13 is 5 + 8, one length and one width. The perimeter goes all the way around: 5 + 8 + 5 + 8.
        - |
          45 is 40 + 5, which mixes up the area with a side. First find the other side: 5 × 8 = 40, so it is 8 meters.
        - |
          Correct. The other side is 8 meters, because 5 × 8 = 40. The perimeter is 5 + 8 + 5 + 8 = 26 meters.
        - |
          40 is the area in square meters. The perimeter is a different measurement: the distance around.
      answer: 2

    - slug: g4math-w04-q14
      type: short_answer
      topic_code: "4.NF.A.1"
      source: "IM K–5 Math Grade 4, Unit 2, Section B"
      points: 2
      prompt: |
        (a) Write two fractions equivalent to 2/3: one with denominator 6 and one with denominator 12.
        (b) Explain why multiplying the numerator and the denominator by the same number gives an equivalent fraction. You may draw a picture.
      answer: |
        (a) 4/6 and 8/12.
        (b) Multiplying both by 2 is like cutting every third into 2 equal pieces. The whole now has twice as many pieces (6) and the shaded part has twice as many pieces (4), but no shading was added or taken away, so the amount is the same.
      explanation: |
        Two points.

        (a) 1 pt: both 4/6 and 8/12.

        (b) 1 pt: explains that each part is cut into the same number of smaller equal parts, so the number of parts in the whole and the number of shaded parts both change but the amount does not. An area diagram or two lined-up number lines with a sentence also earns the point.
