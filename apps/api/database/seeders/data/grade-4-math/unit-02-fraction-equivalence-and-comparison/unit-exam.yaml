unit: 2
description: |
  20 questions · about 40 minutes · every standard of Unit 2: the size and location of fractions on strips and
  number lines, benchmarks, equivalent fractions (including tenths and hundredths) and why they are equal, and
  comparing and ordering fractions with different numerators and denominators. Two sets of questions share a
  picture. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word is
  matched automatically; the short answer is checked by your teacher against the scoring notes.
questions:
  # ---- Stimulus set: the area diagram (4.NF.A.1)
  - slug: g4math-u02-check-q01
    type: multiple_choice
    topic_code: "4.NF.A.1"
    source: "IM K–5 Math Grade 4, Unit 2, Section B"
    points: 1
    stimulus: |
      Use the rectangle. It was split into 5 equal columns and 2 columns were shaded. Then one line was drawn across the middle of the whole rectangle.
    figure: figures/u02-area-model-fifths.svg
    figure_alt: "A rectangle split by thick lines into 5 equal columns. The 2 columns on the left are shaded blue and the other 3 are white. A thin line across the middle cuts every column into a top piece and a bottom piece, so there are 10 equal pieces and 4 are shaded."
    prompt: |
      What fraction of the rectangle is shaded now?
    options:
      - "2/10"
      - "4/10"
      - "4/5"
      - "3/10"
    option_explanations:
      - |
        2/10 changes only the denominator. Each shaded column was also cut in two, so there are 4 shaded pieces.
      - |
        Correct. The whole now has 5 × 2 = 10 equal pieces, and the 2 shaded columns hold 2 × 2 = 4 of them.
      - |
        4/5 counts the 4 shaded pieces but keeps the old denominator. The whole now has 10 pieces, not 5.
      - |
        3/10 is not shaded anywhere. Count the shaded pieces: 2 on top and 2 on the bottom make 4.
    answer: 1

  - slug: g4math-u02-check-q02
    type: multiple_choice
    topic_code: "4.NF.A.1"
    source: "IM K–5 Math Grade 4, Unit 2, Section B"
    points: 1
    stimulus: |
      Use the rectangle. It was split into 5 equal columns and 2 columns were shaded. Then one line was drawn across the middle of the whole rectangle.
    prompt: |
      The picture shows that 2/5 = 4/10. Which sentence explains why?
    options:
      - "The number of shaded parts and the number of parts in the whole were both multiplied by 2, and the shaded amount did not change."
      - "2 was added to the numerator and the denominator."
      - "The shaded part got bigger when the line was drawn."
      - "The number of parts in the whole doubled, but the number of shaded parts stayed the same."
    option_explanations:
      - |
        Correct. Cutting every column in two doubles both counts, 2 × 2 = 4 shaded and 5 × 2 = 10 in all, while the shaded area stays the same.
      - |
        Adding 2 to both would give 4/7, which is a different amount. The numbers were multiplied, not added.
      - |
        Drawing a line does not add any shading. The shaded area is the same; it is just cut into more pieces.
      - |
        The shaded parts were cut too. There were 2 shaded parts and now there are 4.
    answer: 0

  # ---- Stimulus set: the number line in twelfths (4.NF.A.1)
  - slug: g4math-u02-check-q03
    type: multiple_choice
    topic_code: "4.NF.A.1"
    source: "IM K–5 Math Grade 4, Unit 2, Section B"
    points: 1
    stimulus: |
      Use the number line from 0 to 1. It is split into 12 equal parts. Point A is at 3/12 and point B is at 8/12.
    figure: figures/u02-number-line-twelfths.svg
    figure_alt: "A number line from 0 to 1 split into 12 equal parts by 13 tick marks. Only 0 and 1 are labeled. A dot labeled A sits on the third tick mark after 0. A dot labeled B sits on the eighth tick mark after 0."
    prompt: |
      Which fraction with a denominator of 4 is at point A?
    options:
      - "3/4"
      - "1/3"
      - "1/4"
      - "2/4"
    option_explanations:
      - |
        3/4 keeps the numerator 3. But fourths are bigger than twelfths: 3/4 is 9/12, much farther along the line.
      - |
        1/3 does not have a denominator of 4, and 1/3 = 4/12, which is one tick past A.
      - |
        Correct. Each fourth is 3 twelfths (12 ÷ 4 = 3), so 3/12 = 1/4.
      - |
        2/4 is one half, which is 6/12, in the middle of the line. A is only 3 parts from 0.
    answer: 2

  - slug: g4math-u02-check-q04
    type: numeric
    topic_code: "4.NF.A.1"
    source: "IM K–5 Math Grade 4, Unit 2, Section B"
    points: 1
    stimulus: |
      Use the number line from 0 to 1. It is split into 12 equal parts. Point A is at 3/12 and point B is at 8/12.
    prompt: |
      Point B can also be named with a fraction in thirds. What is the numerator of that fraction?
    answer: { value: 2, tolerance: 0 }
    explanation: |
      Each third is 4 twelfths (12 ÷ 3 = 4). B is 8 twelfths from 0, and 8 ÷ 4 = 2, so B is at 2/3.

  # ---- Equivalence (4.NF.A.1)
  - slug: g4math-u02-check-q05
    type: multiple_choice
    topic_code: "4.NF.A.1"
    source: "IM K–5 Math Grade 4, Unit 2, Section B"
    points: 1
    figure: figures/u02-hundredths-grid.svg
    figure_alt: "A large square split into a grid of 10 rows and 10 columns, 100 small squares in all. The 6 columns on the left are shaded blue, 60 small squares. The 4 columns on the right are white."
    prompt: |
      The large square is 1 whole. Which fraction is equivalent to the shaded part?
    options:
      - "6/100"
      - "60/10"
      - "4/10"
      - "6/10"
    option_explanations:
      - |
        6/100 counts the shaded columns but uses the hundredths denominator. 6 columns hold 60 small squares, so it is 60/100.
      - |
        60/10 would be 6 wholes. The shaded part is less than the whole square.
      - |
        4/10 is the white part: 4 of the 10 columns. The question asks about the shaded part.
      - |
        Correct. 6 of the 10 equal columns are shaded, which is 6/10. It is also 60/100, because each column is 10 small squares.
    answer: 3

  - slug: g4math-u02-check-q06
    type: multi_select
    topic_code: "4.NF.A.1"
    source: "IM K–5 Math Grade 4, Unit 2, Section B"
    points: 2
    partial_credit: true
    prompt: |
      Select all the fractions that are equivalent to 2/3.
    options:
      - "4/6"
      - "3/4"
      - "8/12"
      - "4/5"
      - "2/6"
    option_explanations:
      - |
        Equivalent. Multiply the top and bottom of 2/3 by 2: 4/6.
      - |
        Not equivalent. 3/4 adds 1 to the top and bottom of 2/3, which changes the amount: 3/4 = 9/12, but 2/3 = 8/12.
      - |
        Equivalent. Multiply the top and bottom of 2/3 by 4: 8/12.
      - |
        Not equivalent. 4/5 doubles the top but adds 2 to the bottom. Both numbers must be multiplied by the same number.
      - |
        Not equivalent. 2/6 changes only the denominator. It equals 1/3, half as much as 2/3.
    answer: [0, 2]

  - slug: g4math-u02-check-q07
    type: true_false
    topic_code: "4.NF.A.1"
    source: "IM K–5 Math Grade 4, Unit 2, Section B"
    points: 1
    prompt: |
      True or false: 5/10 is equivalent to 1/2.
    answer: true
    explanation: |
      True. Multiply the top and bottom of 1/2 by 5: (1 × 5)/(2 × 5) = 5/10. On a number line in tenths, 5/10 is exactly halfway between 0 and 1.

  - slug: g4math-u02-check-q08
    type: fill_blank
    topic_code: "4.NF.A.2"
    source: "IM K–5 Math Grade 4, Unit 2, Section A"
    points: 1
    prompt: |
      In the fraction 5/8, the number 5 tells how many equal parts we are counting. It is called the ____.
    answer: ["numerator", "the numerator"]
    explanation: |
      The numerator is the top number: the count of parts. The bottom number, 8, is the denominator: how many equal parts make the whole.

  - slug: g4math-u02-check-q09
    type: numeric
    topic_code: "4.NF.A.1"
    source: "IM K–5 Math Grade 4, Unit 2, Section B"
    points: 1
    prompt: |
      4/5 = ?/10. What number is the missing numerator?
    answer: { value: 8, tolerance: 0 }
    explanation: |
      5 × 2 = 10, so multiply the numerator by 2 as well: 4 × 2 = 8. So 4/5 = 8/10.

  # ---- Comparing and ordering (4.NF.A.2)
  - slug: g4math-u02-check-q10
    type: multiple_choice
    topic_code: "4.NF.A.2"
    source: "IM K–5 Math Grade 4, Unit 2, Section A"
    points: 1
    prompt: |
      Four water bottles are 3/8, 5/12, 4/10 and 7/12 full. Which bottle is more than half full?
    options:
      - "3/8"
      - "5/12"
      - "4/10"
      - "7/12"
    option_explanations:
      - |
        Half of 8 is 4, and 3 is less than 4, so 3/8 is less than half full.
      - |
        Half of 12 is 6, and 5 is less than 6, so 5/12 is less than half full.
      - |
        Half of 10 is 5, and 4 is less than 5, so 4/10 is less than half full.
      - |
        Correct. Half of 12 is 6, and 7 is more than 6, so 7/12 is more than half full.
    answer: 3

  - slug: g4math-u02-check-q11
    type: multiple_choice
    topic_code: "4.NF.A.2"
    source: "IM K–5 Math Grade 4, Unit 2, Section C"
    points: 1
    prompt: |
      Four students wrote fraction comparisons on the board. Which student's comparison is true?
    options:
      - "3/10 is less than 3/8."
      - "5/6 is less than 4/6."
      - "1/3 is less than 1/5."
      - "3/4 is less than 3/5."
    option_explanations:
      - |
        Correct. Both have 3 parts, and tenths are smaller parts than eighths, so 3/10 is less.
      - |
        Same denominator, so compare numerators: 5 sixths is more than 4 sixths, not less.
      - |
        Thirds are bigger parts than fifths, so 1/3 is greater than 1/5.
      - |
        Both have 3 parts, and fourths are bigger than fifths, so 3/4 is greater than 3/5.
    answer: 0

  - slug: g4math-u02-check-q12
    type: multiple_choice
    topic_code: "4.NF.A.2"
    source: "IM K–5 Math Grade 4, Unit 2, Section C"
    points: 1
    prompt: |
      Three snails crawled 9/10, 1/12 and 5/8 of a meter. Which list puts the distances in order from least to greatest?
    options:
      - "9/10, 5/8, 1/12"
      - "5/8, 1/12, 9/10"
      - "1/12, 5/8, 9/10"
      - "1/12, 9/10, 5/8"
    option_explanations:
      - |
        This is from greatest to least. The question asks for the least first.
      - |
        1/12 is close to 0, so it is less than 5/8 and must come first.
      - |
        Correct. 1/12 is close to 0, 5/8 is a little more than 1/2, and 9/10 is close to 1.
      - |
        9/10 is only 1/10 from 1, while 5/8 is just past 1/2. So 9/10 is greater and goes last.
    answer: 2

  - slug: g4math-u02-check-q13
    type: multiple_choice
    topic_code: "4.NF.A.2"
    source: "IM K–5 Math Grade 4, Unit 2, Section C"
    points: 1
    prompt: |
      Sam ate 3/6 of a melon. Kira ate 4/8 of a melon the same size. Who ate more?
    options:
      - "Kira, because 4 is more than 3."
      - "They ate the same amount."
      - "Sam, because sixths are bigger than eighths."
      - "Kira, because 8 is more than 6."
    option_explanations:
      - |
        Kira has more pieces, but her pieces are smaller. Compare the amounts, not the piece counts.
      - |
        Correct. 3/6 and 4/8 are both equal to 1/2: 3 is half of 6, and 4 is half of 8.
      - |
        Sixths are bigger, but Sam has fewer of them. 3/6 and 4/8 are both exactly half.
      - |
        A bigger denominator means smaller pieces, not more melon. Both fractions equal 1/2.
    answer: 1

  - slug: g4math-u02-check-q14
    type: numeric
    topic_code: "4.NF.A.1"
    source: "IM K–5 Math Grade 4, Unit 2, Section B"
    points: 1
    prompt: |
      9/12 = ?/4. What number is the missing numerator?
    answer: { value: 3, tolerance: 0 }
    explanation: |
      12 ÷ 3 = 4, so divide the numerator by 3 as well: 9 ÷ 3 = 3. So 9/12 = 3/4. Check: 3/4 = (3 × 3)/(4 × 3) = 9/12.

  - slug: g4math-u02-check-q15
    type: multiple_choice
    topic_code: "4.NF.A.2"
    source: "IM K–5 Math Grade 4, Unit 2, Section C"
    points: 1
    prompt: |
      Ivan says 4/5 is greater than 5/6 because fifths are bigger parts than sixths. Who is right?
    options:
      - "5/6 is greater: it is 1/6 away from 1 and 4/5 is 1/5 away, and 1/6 is the smaller gap."
      - "Ivan is right, because fifths are bigger parts."
      - "They are equal, because each is one part short of 1."
      - "4/5 is greater, because 5 is less than 6."
    option_explanations:
      - |
        Correct. Each fraction is one piece short of 1. The missing sixth is smaller than the missing fifth, so 5/6 is closer to 1 and greater.
      - |
        Fifths are bigger, but that makes the missing piece of 4/5 bigger too. Ivan's reason works only when the numerators match.
      - |
        The missing pieces, 1/5 and 1/6, are different sizes, so the fractions are not equal.
      - |
        Comparing only the denominators does not work here, because the numerators are different too. Look at the missing pieces.
    answer: 0

  - slug: g4math-u02-check-q16
    type: multiple_choice
    topic_code: "4.NF.A.2"
    source: "IM K–5 Math Grade 4, Unit 2, Section A"
    points: 1
    prompt: |
      Which fraction is between 1/2 and 1 on the number line?
    options:
      - "2/5"
      - "3/8"
      - "7/10"
      - "6/5"
    option_explanations:
      - |
        Half of 5 is 2 1/2, and 2 is less than that, so 2/5 is between 0 and 1/2.
      - |
        Half of 8 is 4, and 3 is less than 4, so 3/8 is between 0 and 1/2.
      - |
        Correct. 7/10 is more than 5/10 (which is 1/2) and less than 10/10 (which is 1).
      - |
        6/5 has a numerator bigger than its denominator, so it is more than 1.
    answer: 2

  - slug: g4math-u02-check-q17
    type: numeric
    topic_code: "4.NF.A.1"
    source: "IM K–5 Math Grade 4, Unit 2, Section B"
    points: 1
    prompt: |
      2/5 = ?/100. What number is the missing numerator?
    answer: { value: 40, tolerance: 0 }
    explanation: |
      5 × 20 = 100, so multiply the numerator by 20 as well: 2 × 20 = 40. So 2/5 = 40/100. (Or: 2/5 = 4/10, and 4 tenths = 40 hundredths.)

  - slug: g4math-u02-check-q18
    type: multiple_choice
    topic_code: "4.NF.A.2"
    source: "IM K–5 Math Grade 4, Unit 2, Section C"
    points: 1
    prompt: |
      Bea painted 4/6 of a fence. Cal painted 7/12 of a fence the same size. Who painted more?
    options:
      - "Cal, because 7 is more than 4."
      - "Bea, because 4/6 = 8/12, and 8/12 is more than 7/12."
      - "They painted the same amount."
      - "Cal, because twelfths are smaller, so he needed more of them."
    option_explanations:
      - |
        Cal has more parts, but twelfths are smaller than sixths. Write both in twelfths to compare.
      - |
        Correct. Multiply the top and bottom of 4/6 by 2 to get 8/12. 8 twelfths is more than 7 twelfths.
      - |
        In twelfths, Bea painted 8/12 and Cal painted 7/12. That is one twelfth apart, so not the same.
      - |
        Smaller parts do mean Cal needs more of them, but he would need 8 twelfths to match Bea, and he has only 7.
    answer: 1

  - slug: g4math-u02-check-q19
    type: short_answer
    topic_code: "4.NF.A.2"
    source: "IM K–5 Math Grade 4, Unit 2, Section C"
    points: 3
    prompt: |
      Mateo says, "3/4 and 6/8 are equivalent, so 3/4 is greater than 5/8."

      (a) Show that 3/4 = 6/8. Use a drawing, a number line or the multiplying rule.
      (b) Which is greater, 3/4 or 5/8?
      (c) Explain how 3/4 = 6/8 helps you compare 3/4 and 5/8.
    answer: |
      (a) Multiply the top and bottom of 3/4 by 2: (3 × 2)/(4 × 2) = 6/8. (Or: a strip in fourths with 3 shaded, with each fourth cut in half, shows 6 of 8 parts shaded.)
      (b) 3/4.
      (c) 3/4 is the same amount as 6/8. Now both fractions are eighths, so compare the numerators: 6 eighths is more than 5 eighths, so 3/4 is greater than 5/8.
    explanation: |
      Three points.

      (a) 1 pt: a correct reason that 3/4 = 6/8, by multiplying both numbers by 2 or with a drawing or number lines that show the same amount.

      (b) 1 pt: 3/4.

      (c) 1 pt: uses the common denominator: 6/8 and 5/8 have the same-size parts, and 6 parts is more than 5 parts.

  - slug: g4math-u02-check-q20
    type: multiple_choice
    topic_code: "4.NF.A.1"
    source: "IM K–5 Math Grade 4, Unit 2, Section B"
    points: 1
    prompt: |
      Which pair of fractions is NOT equivalent?
    options:
      - "1/2 and 6/12"
      - "3/5 and 6/10"
      - "2/4 and 3/6"
      - "3/4 and 4/5"
    option_explanations:
      - |
        These are equivalent: multiply the top and bottom of 1/2 by 6 to get 6/12.
      - |
        These are equivalent: multiply the top and bottom of 3/5 by 2 to get 6/10.
      - |
        These are equivalent: both are one half, because 2 is half of 4 and 3 is half of 6.
      - |
        Correct. 4/5 adds 1 to the top and bottom of 3/4, which changes the amount. 3/4 is 1/4 away from 1 and 4/5 is only 1/5 away, so 4/5 is greater.
    answer: 3
