week: 3
unit: 2
title: "The Size and Location of Fractions"
topics: ["4.NF.A.2"]
guide: guides/week-03.md
guide_description: |
  How fraction strips and number lines show the size of a fraction, why more parts in a whole means smaller
  parts, how to place fractions (including fractions greater than 1) on a number line, and how to use 0, 1/2
  and 1 as benchmarks.
flashcards_description: |
  19 cards on numerators and denominators, the size of unit fractions, placing fractions on a number line,
  fractions greater than 1, and deciding whether a fraction is near 0, near 1/2 or near 1.

flashcards:
  - front: Numerator → what it tells you
    back: |
      The top number of a fraction: how many equal parts we are counting. In 3/8 the numerator is 3.
    topic_code: "4.NF.A.2"
  - front: Denominator → what it tells you
    back: |
      The bottom number of a fraction: how many equal parts make one whole. In 3/8 the denominator is 8.
    topic_code: "4.NF.A.2"
  - front: Fraction strip → what it is
    back: |
      A strip one whole long, cut into equal parts. Strips of the same length let you compare the sizes of the parts.
    topic_code: "4.NF.A.2"
  - front: More equal parts in a whole → what happens to each part
    back: |
      Each part gets smaller. A whole cut into 12 parts has smaller parts than a whole cut into 6, so 1/12 is less than 1/6.
    topic_code: "4.NF.A.2"
  - front: 1/3 or 1/4 → which is bigger
    back: |
      1/3. Splitting a whole among 3 gives bigger shares than splitting it among 4.
    topic_code: "4.NF.A.2"
  - front: Benchmark → what it means for fractions
    back: |
      A friendly number we compare to, such as 0, 1/2 or 1. "Is it more or less than 1/2?" is a benchmark question.
    topic_code: "4.NF.A.2"
  - front: Fraction close to 0 → how to spot one
    back: |
      The numerator is very small compared with the denominator, like 1/10 or 1/12: only a sliver of the whole.
    topic_code: "4.NF.A.2"
  - front: Fraction close to 1 → how to spot one
    back: |
      The numerator is just one less than the denominator, with small parts, like 11/12 or 9/10: only a little is missing from the whole.
    topic_code: "4.NF.A.2"
  - front: More or less than 1/2? → a quick test
    back: |
      Find half of the denominator. If the numerator is bigger than that, the fraction is more than 1/2; if smaller, less than 1/2. 5/8: half of 8 is 4, and 5 is more, so 5/8 is more than 1/2.
    topic_code: "4.NF.A.2"
  - front: 3/8 → more or less than 1/2?
    back: |
      Less. Half of 8 is 4, and 3 is less than 4.
    topic_code: "4.NF.A.2"
  - front: 4/6 → more or less than 1/2?
    back: |
      More. Half of 6 is 3, and 4 is more than 3.
    topic_code: "4.NF.A.2"
  - front: 2/5 → more or less than 1/2?
    back: |
      Less. Half of 5 is 2 1/2, and 2 is less than 2 1/2.
    topic_code: "4.NF.A.2"
  - front: Fraction with numerator equal to denominator → its value
    back: |
      1 whole. 8/8, 5/5 and 12/12 all equal 1.
    topic_code: "4.NF.A.2"
  - front: Fraction with numerator bigger than denominator → what it means
    back: |
      It is more than 1 whole. 7/5 is 5/5 (one whole) and 2/5 more.
    topic_code: "4.NF.A.2"
  - front: Placing 5/8 on a number line → the steps
    back: |
      Split the space from 0 to 1 into 8 equal parts. Start at 0 and count 5 parts. That point is 5/8.
    topic_code: "4.NF.A.2"
  - front: Number line from 0 to 1 in sixths → how many tick marks
    back: |
      7 tick marks: one at 0, one at 1 and 5 in between. There are 6 equal spaces, and the spaces are what we count.
    topic_code: "4.NF.A.2"
  - front: 6/4 on a number line → where it is
    back: |
      Past 1. 4/4 is at 1, and 6/4 is two more fourths, halfway between 1 and 2.
    topic_code: "4.NF.A.2"
  - front: Hundredths → how small is 1/100
    back: |
      Very small: one of 100 equal parts of a whole. 1/100 is much closer to 0 than 1/10 is.
    topic_code: "4.NF.A.2"
  - front: Same-size wholes → why they matter
    back: |
      Fractions can only be compared fairly when they are parts of the same size whole. Half of a small pizza is less than half of a big one.
    topic_code: "4.NF.A.2"

quiz:
  description: |
    15 questions · about 30 minutes · fraction strips and the size of unit fractions, fractions on the number line
    (including past 1), and comparing fractions with the benchmarks 0, 1/2 and 1, with review of factors, primes,
    area and perimeter from Unit 1. Multiple choice, select-all, true/false and number answers are graded at once;
    the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w03-q01
      type: multiple_choice
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section A"
      points: 1
      figure: figures/w03-number-line-eighths.svg
      figure_alt: "A number line from 0 to 1 with 9 tick marks spaced the same distance apart, making 8 equal parts. Only 0 and 1 are labeled. A dot labeled P sits on the fifth tick mark after 0, three parts before 1."
      prompt: |
        What fraction is at point P?
      options:
        - "5/9"
        - "5/8"
        - "6/8"
        - "3/8"
      option_explanations:
        - |
          There are 9 tick marks, but only 8 equal spaces between 0 and 1. The denominator counts the spaces, so it is 8.
        - |
          Correct. The line from 0 to 1 is split into 8 equal parts, and P is 5 parts from 0.
        - |
          6/8 counts the tick mark at 0 as a jump. Count the spaces from 0: P is 5 spaces along.
        - |
          3/8 is how far P is from 1, counting backward. Fractions on a number line are counted from 0.
      answer: 1

    - slug: g4math-w03-q02
      type: multiple_choice
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section A"
      points: 1
      stimulus: |
        Use the fraction strips. Every strip is one whole, and all the strips are the same length.
      figure: figures/w03-fraction-strips.svg
      figure_alt: "Five fraction strips of the same length, one under another. The top strip is one whole piece labeled 1. The next is cut into 2 equal pieces labeled 1/2, then 3 pieces labeled 1/3, then 4 pieces labeled 1/4, then 6 pieces labeled 1/6."
      prompt: |
        Which list puts 1/3, 1/6 and 1/4 in order from smallest to greatest?
      options:
        - "1/6, 1/4, 1/3"
        - "1/3, 1/4, 1/6"
        - "1/4, 1/3, 1/6"
        - "1/3, 1/6, 1/4"
      option_explanations:
        - |
          Correct. On the strips, a 1/6 piece is the shortest, then 1/4, then 1/3. More parts in the whole means smaller parts.
        - |
          This is from greatest to smallest. The 1/3 piece is the longest of the three, so it goes last.
        - |
          The 1/6 piece is the shortest on the strips, so it must come first, not last.
        - |
          The 1/3 piece is the longest of these, so it cannot come first in an order from smallest.
      answer: 0

    - slug: g4math-w03-q03
      type: true_false
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section A"
      points: 1
      stimulus: |
        Use the fraction strips. Every strip is one whole, and all the strips are the same length.
      prompt: |
        True or false: one 1/2 piece is longer than one 1/3 piece.
      answer: true
      explanation: |
        True. The half strip is cut into 2 parts and the third strip into 3 parts. Fewer parts in the same whole means each part is bigger, so 1/2 is longer than 1/3.

    - slug: g4math-w03-q04
      type: numeric
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section A"
      points: 1
      figure: figures/w03-number-line-fifths-to-2.svg
      figure_alt: "A number line from 0 to 2. 0, 1 and 2 are labeled. The space from 0 to 1 is split into 5 equal parts, and so is the space from 1 to 2. A dot labeled Q sits on the second tick mark after 1."
      prompt: |
        Point Q is at a fraction with denominator 5. What is its numerator? (How many fifths is Q from 0?)
      answer: { value: 7, tolerance: 0 }
      explanation: |
        Each whole is split into fifths. From 0 to 1 is 5 fifths, and Q is 2 more fifths past 1. 5 + 2 = 7, so Q is at 7/5.

    - slug: g4math-w03-q05
      type: multiple_choice
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section A"
      points: 1
      prompt: |
        Four jars are filled to 1/2, 3/4, 2/10 and 11/12 of the way to the top. Which fraction is closest to 1 full jar?
      options:
        - "1/2"
        - "3/4"
        - "2/10"
        - "11/12"
      option_explanations:
        - |
          1/2 is halfway between 0 and 1, so it is half a whole away from 1.
        - |
          3/4 is close to 1, but it is 1/4 away. 11/12 is only 1/12 away, and 1/12 is a smaller piece than 1/4.
        - |
          2/10 is close to 0, not 1: it is only 2 of 10 small parts.
        - |
          Correct. 11/12 is only one twelfth short of 12/12, which is 1. Twelfths are small, so it is very close.
      answer: 3

    - slug: g4math-w03-q06
      type: multi_select
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section A"
      points: 2
      partial_credit: true
      prompt: |
        Select every fraction that is greater than 1/2.
      options:
        - "3/8"
        - "5/6"
        - "7/12"
        - "2/5"
        - "6/10"
      option_explanations:
        - |
          Not greater. Half of 8 is 4, and 3 is less than 4, so 3/8 is less than 1/2.
        - |
          Greater. Half of 6 is 3, and 5 is more than 3.
        - |
          Greater. Half of 12 is 6, and 7 is more than 6.
        - |
          Not greater. Half of 5 is 2 1/2, and 2 is less than that, so 2/5 is less than 1/2.
        - |
          Greater. Half of 10 is 5, and 6 is more than 5.
      answer: [1, 2, 4]

    - slug: g4math-w03-q07
      type: fill_blank
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section A"
      points: 1
      prompt: |
        In the fraction 3/8, the number 8 tells how many equal parts make one whole. It is called the ____.
      answer: ["denominator", "the denominator"]
      explanation: |
        The denominator is the bottom number. It tells how many equal parts the whole is split into. The top number, 3, is the numerator.

    - slug: g4math-w03-q08
      type: multiple_choice
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section A"
      points: 1
      prompt: |
        Ana ran 5/6 of a mile. Ben ran 3/8 of a mile. Which sentence is true?
      options:
        - "Both ran more than half a mile."
        - "Ben ran farther, because 8 is greater than 6."
        - "Ana ran more than half a mile and Ben ran less than half a mile."
        - "Both ran less than half a mile."
      option_explanations:
        - |
          Ana did, but half of 8 is 4, and Ben's 3 eighths is less than 4 eighths, so Ben ran less than half a mile.
        - |
          A bigger denominator means smaller parts, not a longer run. Compare each fraction to 1/2 instead.
        - |
          Correct. Half of 6 is 3, and 5 is more than 3. Half of 8 is 4, and 3 is less than 4. So 5/6 is more than 1/2 and 3/8 is less.
        - |
          Ben did, but half of 6 is 3 and Ana ran 5 sixths, so Ana ran more than half a mile.
      answer: 2

    - slug: g4math-w03-q09
      type: multiple_choice
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section A"
      points: 1
      prompt: |
        Kai splits a number line from 0 to 1 into 10 equal parts. Where does 7/10 go?
      options:
        - "7 parts to the left of 1"
        - "Between 0 and 1/2"
        - "Past 1"
        - "3 parts to the left of 1"
      option_explanations:
        - |
          7 parts to the left of 1 is 3 parts from 0, which is 3/10. Count 7/10 from 0, not from 1.
        - |
          1/2 is 5/10. 7/10 is 2 parts past 5/10, so it is between 1/2 and 1.
        - |
          7/10 has a numerator smaller than its denominator, so it is less than 10/10, which is 1.
        - |
          Correct. 7/10 is 7 parts from 0. The whole is 10 parts, so it is 10 − 7 = 3 parts before 1.
      answer: 3

    - slug: g4math-w03-q10
      type: numeric
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section A"
      points: 1
      prompt: |
        A number line from 0 to 1 is split into 12 equal parts. How many tick marks does it have, counting the marks at 0 and at 1?
      answer: { value: 13, tolerance: 0 }
      explanation: |
        12 equal parts need 11 tick marks between 0 and 1, plus the marks at 0 and 1: 11 + 2 = 13. There is always one more tick mark than there are spaces.

    - slug: g4math-w03-q11
      type: short_answer
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section A"
      points: 2
      prompt: |
        Leo says 4/10 is more than 1/2 because 4 and 10 are bigger numbers than 1 and 2.

        (a) Is Leo right? Answer yes or no.
        (b) Explain using 1/2 as a benchmark.
      answer: |
        (a) No.
        (b) Half of 10 is 5, so 1/2 is the same as 5/10. 4/10 is one tenth less than 5/10, so 4/10 is less than 1/2. Big numbers in a fraction do not make it big; what matters is the numerator compared with the denominator.
      explanation: |
        Two points.

        (a) 1 pt: no.

        (b) 1 pt: a benchmark reason, such as half of 10 is 5 and 4 is less than 5, or 4/10 is just before 5/10 on a number line. A drawing of a strip in tenths with 4 shaded, less than half, also earns the point.

    - slug: g4math-w03-q12
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      prompt: |
        Ravi is checking numbers from 35 to 49. Which of these numbers is prime?
      options:
        - "35"
        - "45"
        - "41"
        - "49"
      option_explanations:
        - |
          35 ends in 5, so 5 is a factor: 5 × 7 = 35. It is composite.
        - |
          45 ends in 5, so 5 is a factor: 5 × 9 = 45. It is composite.
        - |
          Correct. 2, 3, 5 and 7 are not factors of 41, so its only factor pair is 1 and 41.
        - |
          49 is 7 × 7, so it has a second factor pair and is composite.
      answer: 2

    - slug: g4math-w03-q13
      type: numeric
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      prompt: |
        A rectangular poster is 6 feet long and 3 feet wide. What is its perimeter in feet?
      answer: { value: 18, tolerance: 0 }
      explanation: |
        Add all four sides: 6 + 3 + 6 + 3 = 18 feet. (Or 2 × 6 + 2 × 3 = 12 + 6 = 18.)

    - slug: g4math-w03-q14
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      prompt: |
        Which is a factor pair of 48?
      options:
        - "6 and 8"
        - "4 and 14"
        - "40 and 8"
        - "7 and 7"
      option_explanations:
        - |
          Correct. 6 × 8 = 48, so 6 and 8 are a factor pair of 48.
        - |
          4 × 14 = 56, not 48. The partner of 4 is 12, because 4 × 12 = 48.
        - |
          40 + 8 = 48, but a factor pair multiplies to make the number: 40 × 8 = 320.
        - |
          7 × 7 = 49, one more than 48. 7 is not a factor of 48.
      answer: 0

    - slug: g4math-w03-q15
      type: numeric
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      prompt: |
        A rectangular rug has an area of 42 square feet. It is 6 feet wide. How many feet long is it?
      answer: { value: 7, tolerance: 0 }
      explanation: |
        Length × width = area, so 6 × ? = 42. 6 × 7 = 42, so the rug is 7 feet long.
