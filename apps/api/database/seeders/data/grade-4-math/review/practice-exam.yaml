      - "1 2/6 cups"
      - "7 cups"
      - "2 2/6 cups"
    option_explanations:
      - |
        2 4/6 takes 1/6 from 5/6, the wrong way round. Trade a whole first: 4 1/6 = 3 7/6.
      - |
        Correct. Trade 1 whole for 6/6: 4 1/6 = 3 7/6. Then 3 7/6 − 2 5/6 = 1 2/6 cups.
      - |
        7 cups adds the amounts. Sam used flour, so subtract 2 5/6 from 4 1/6.
