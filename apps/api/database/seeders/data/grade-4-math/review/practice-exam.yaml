  - slug: g4math-final-q24
    type: multiple_choice
    topic_code: "4.NBT.B.5"
    source: "IM K–5 Math Grade 4, Unit 6, Section B"
    points: 1
    prompt: |
      What is 52 × 38?
    options:
      - "1,516"
      - "1,900"
      - "1,876"
      - "1,976"
    option_explanations:
      - |
        1,516 is 50 × 30 + 2 × 8, only two of the four partial products. 50 × 8 = 400 and 2 × 30 = 60 are missing.
      - |
        1,900 is 50 × 38 only. The 2 in 52 adds 2 × 38 = 76 more.
      - |
        1,876 is 100 short. The partial products are 1,500, 400, 60 and 16, which add to 1,976.
      - |
        Correct. 50 × 30 = 1,500, 50 × 8 = 400, 2 × 30 = 60 and 2 × 8 = 16. The sum is 1,976.
