  - slug: g4math-final-q25
    type: multiple_choice
    topic_code: "4.NBT.B.6"
    source: "IM K–5 Math Grade 4, Unit 6, Section C"
    points: 1
    prompt: |
      What is 4,536 ÷ 6?
    options:
      - "706"
      - "756"
      - "760"
      - "27,216"
    option_explanations:
      - |
        706 leaves out a chunk. After 6 × 700 = 4,200, there are 336 left, and 6 × 50 = 300 of that is still to take out.
      - |
        Correct. 6 × 700 = 4,200, leaving 336. 6 × 50 = 300, leaving 36. 6 × 6 = 36. 700 + 50 + 6 = 756.
      - |
        760 is 4 too many. 6 × 760 = 4,560, which is more than 4,536, so the last chunk is 6, not 10.
      - |
        27,216 is 4,536 × 6. The ÷ sign asks how many groups of 6 are in 4,536.
    answer: 1

  - slug: g4math-final-q26
    type: short_answer
    topic_code: "4.OA.A.3"
    source: "IM K–5 Math Grade 4, Unit 6, Section D"
    points: 3
    prompt: |
      27 students and 3 adults go to the science center. A student ticket costs $6 and an adult ticket costs $9.

      (a) What is the total cost of the tickets? Show your work.
      (b) They ride in vans that hold 7 people each. How many vans do they need?
      (c) Explain what you did with the remainder in part (b).
    answer: |
      (a) Students: 27 × $6 = $162. Adults: 3 × $9 = $27. Total: $162 + $27 = $189.
      (b) There are 27 + 3 = 30 people. 30 ÷ 7 = 4 R 2, so they need 5 vans.
      (c) Four vans carry 28 people, and the other 2 people still need a seat, so I rounded up to one more van.
    explanation: |
      Three points.

      (a) 1 pt: $189, with both products (27 × 6 = 162 and 3 × 9 = 27) or an equivalent method shown.

      (b) 1 pt: 5 vans, using all 30 people.

      (c) 1 pt: an explanation that the 2 left over are people who need a seat, so the quotient is rounded up. "4 R 2" alone does not earn this point.

  - slug: g4math-final-q27
    type: multi_select
    topic_code: "4.NBT.B.6"
    source: "IM K–5 Math Grade 4, Unit 6, Section C"
    points: 2
    partial_credit: true
    prompt: |
      Which of these divisions leave a remainder of 2 when you finish? Select all that apply.
    options:
      - "45 ÷ 5"
      - "38 ÷ 4"
      - "31 ÷ 3"
      - "50 ÷ 6"
      - "65 ÷ 7"
    option_explanations:
      - |
        No. 5 × 9 = 45 exactly, so the remainder is 0.
      - |
        Yes. 4 × 9 = 36, and 38 − 36 = 2. So 38 ÷ 4 = 9 R 2.
      - |
        No. 3 × 10 = 30, and 31 − 30 = 1. So 31 ÷ 3 = 10 R 1.
      - |
        Yes. 6 × 8 = 48, and 50 − 48 = 2. So 50 ÷ 6 = 8 R 2.
      - |
        Yes. 7 × 9 = 63, and 65 − 63 = 2. So 65 ÷ 7 = 9 R 2.
    answer: [1, 3, 4]

  # ---- Unit 7 · Set C: protractor (4.MD.C.6, 4.MD.C.7)
  - slug: g4math-final-q28
    type: multiple_choice
    topic_code: "4.MD.C.6"
    source: "IM K–5 Math Grade 4, Unit 7, Section B"
    points: 1
    stimulus: |
      Use the protractor picture. Points D, B and A are on one straight line, and ray BA passes through 0 on the protractor.
    figure: figures/review-protractor.svg
    figure_alt: "A protractor titled Measuring angle ABC. Its scale is labeled every 10 degrees from 0 on the right to 180 on the left, with small marks for single degrees. Its center is on point B. Ray BA goes right along the 0 mark. Ray BC goes up and to the left and crosses the scale halfway between 120 and 130, at 125. Point D is on the straight line through A and B, to the left of B."
    prompt: |
      What is the measure of angle ABC?
    options:
      - "55°"
      - "135°"
      - "125°"
      - "120°"
    option_explanations:
      - |
        55° is angle CBD, the angle on the other side of ray BC. Ray BA is on 0, so read up from 0 to where ray BC crosses.
      - |
        135° goes one 5-degree mark past ray BC. Ray BC crosses halfway between 120 and 130, which is 125°.
      - |
        Correct. Ray BA is on 0, and ray BC crosses the scale halfway between 120 and 130, so angle ABC measures 125°.
      - |
        120° stops at the labeled mark before ray BC. The ray crosses 5 small marks past 120, at 125°.
    answer: 2

  - slug: g4math-final-q29
