week: 33
description: |
  The End-of-Year Check for Grade 4 Math: 39 questions, about 80 minutes, covering all nine units in course
  order. Each unit's share follows its number of weeks: Unit 1 Factors and Multiples (3 questions), Unit 2
  Fraction Equivalence and Comparison (4), Unit 3 Extending Operations to Fractions (5), Unit 4 From
  Hundredths to Hundred-thousands (5), Unit 5 Multiplicative Comparison and Measurement (4), Unit 6
  Multiplying and Dividing Multi-digit Numbers (6), Unit 7 Angles and Angle Measurement (5), Unit 8
  Properties of Two-dimensional Shapes (4) and Unit 9 Putting It All Together (3). Six questions have a
  picture, and three pairs of questions share a picture. Multiple choice, true/false, fill-in and number
  answers are worth 1 point each; the select-all question is worth 2 points with partial credit; the two
  short answers are worth 3 points each and are checked by your teacher against the scoring notes. The check
  is out of 44 points. Take it in one sitting if you can, or in two halves (questions 1–20, then 21–39), and
  leave a few minutes to look back over your answers.
questions:
  # ======================================================================
  # Unit 1 (3): q01-q03 · Unit 2 (4): q04-q07 · Unit 3 (5): q08-q12
  # Unit 4 (5): q13-q17 · Unit 5 (4): q18-q21 · Unit 6 (6): q22-q27
  # Unit 7 (5): q28-q32 · Unit 8 (4): q33-q36 · Unit 9 (3): q37-q39
  # ======================================================================
  # ---- Unit 1 · Factors and multiples, area and perimeter
  - slug: g4math-final-q01
    type: multiple_choice
    topic_code: "4.OA.B.4"
    source: "IM K–5 Math Grade 4, Unit 1, Section A"
    points: 1
    prompt: |
      Which list shows every factor pair of 24?
    options:
      - "1 and 24, 2 and 12, 4 and 6"
      - "2 and 12, 3 and 8, 4 and 6"
      - "1 and 24, 2 and 12, 3 and 8, 4 and 6"
      - "1 and 24, 2 and 12, 3 and 8, 4 and 6, 5 and 5"
    option_explanations:
      - |
        This list skips 3 and 8. 3 × 8 = 24, so it is a factor pair too.
      - |
        This list skips 1 and 24. Every number has 1 and itself as a factor pair: 1 × 24 = 24.
      - |
        Correct. Try each number from 1 up: 1 × 24, 2 × 12, 3 × 8 and 4 × 6. 5 is not a factor, and after 4 × 6 the pairs repeat.
      - |
        5 and 5 is not a factor pair of 24, because 5 × 5 = 25. Also 24 ÷ 5 leaves a remainder.
    answer: 2

  - slug: g4math-final-q02
    type: true_false
    topic_code: "4.OA.B.4"
    source: "IM K–5 Math Grade 4, Unit 1, Section B"
    points: 1
    prompt: |
      True or false: 51 is a prime number.
    answer: false
    explanation: |
      False. 51 = 3 × 17, so it has the factors 1, 3, 17 and 51. A prime number has exactly two factors, so 51 is composite.

  - slug: g4math-final-q03
    type: numeric
    topic_code: "4.MD.A.3"
    source: "IM K–5 Math Grade 4, Unit 1, Section B"
    points: 1
    prompt: |
      A rectangular vegetable patch has an area of 56 square feet. It is 8 feet long. How many feet wide is it?
    answer: { value: 7, tolerance: 0 }
    explanation: |
      Area = length × width, so 8 × ? = 56. Since 8 × 7 = 56, the patch is 7 feet wide.

  # ---- Unit 2 · Equivalent fractions and comparing
  - slug: g4math-final-q04
    type: multiple_choice
    topic_code: "4.NF.A.1"
    source: "IM K–5 Math Grade 4, Unit 2, Section B"
    points: 1
    figure: figures/review-fraction-strips.svg
    figure_alt: "Two fraction strips of the same length, one above the other. The top strip is cut into 4 equal parts labeled 1/4, and the first 3 are shaded blue. The bottom strip is cut into 12 equal parts labeled 1/12, and the first 9 are shaded green. The shaded parts end at the same place."
    prompt: |
      The strips show that 3/4 is equal to which fraction?
    options:
      - "9/12"
      - "3/12"
      - "9/4"
      - "6/12"
    option_explanations:
      - |
        Correct. The green part covers 9 of the 12 twelfths and ends exactly where 3/4 ends. 3/4 = 9/12.
      - |
        3/12 keeps the 3 but changes the piece size. Each fourth is 3 twelfths, so 3 fourths are 9 twelfths.
      - |
        9/4 would be 9 fourths, more than 2 wholes. The 9 counts twelfths, the smaller pieces.
      - |
        6/12 is only 2/4, half the strip. Count the green pieces again: there are 9.
    answer: 0

  - slug: g4math-final-q05
    type: numeric
    topic_code: "4.NF.A.1"
    source: "IM K–5 Math Grade 4, Unit 2, Section B"
    points: 1
    prompt: |
      2/5 = ?/10. What number makes the two fractions equivalent?
    answer: { value: 4, tolerance: 0 }
    explanation: |
      10 is 5 × 2, so each fifth splits into 2 tenths. Multiply the top by 2 too: 2 × 2 = 4. So 2/5 = 4/10.

  - slug: g4math-final-q06
    type: multiple_choice
    topic_code: "4.NF.A.2"
    source: "IM K–5 Math Grade 4, Unit 2, Section C"
    points: 1
    prompt: |
      Only one of these four comparisons is true. Which one?
    options:
      - "4/6 is greater than 4/5"
      - "3/8 is greater than 1/2"
      - "5/12 is greater than 5/6"
      - "7/10 is greater than 1/2"
    option_explanations:
      - |
        Both have 4 pieces, but fifths are bigger than sixths. So 4/5 is greater than 4/6, not the other way.
      - |
        Half of 8 is 4, so 1/2 = 4/8. 3/8 is one eighth less than that.
      - |
        Both have 5 pieces, but sixths are bigger than twelfths. So 5/6 is greater.
      - |
        Correct. Half of 10 is 5, so 1/2 = 5/10. 7/10 is 2 tenths more than 1/2.
    answer: 3

  - slug: g4math-final-q07
    type: fill_blank
    topic_code: "4.NF.A.1"
    source: "IM K–5 Math Grade 4, Unit 2, Section B"
    points: 1
    prompt: |
      2/3 and 8/12 are at the same point on a number line. Fractions that name the same amount are called ____ fractions.
    answer: ["equivalent", "equivalent fractions", "equal", "equal fractions"]
    explanation: |
      Equivalent fractions name the same amount. Multiplying the top and bottom of 2/3 by 4 gives 8/12.

  # ---- Unit 3 · Set A: seedling line plot (4.MD.B.4, 4.NF.B.3)
  - slug: g4math-final-q08
    type: multiple_choice
    topic_code: "4.MD.B.4"
    source: "IM K–5 Math Grade 4, Unit 3, Section B"
    points: 1
    stimulus: |
      Use the line plot "Seedling Heights". Each X is one seedling in the class garden.
    figure: figures/review-seedling-line-plot.svg
    figure_alt: "A line plot titled Seedling Heights. The scale is Height in inches and goes from 2 to 3 in eighths: 2, 2 1/8, 2 2/8, 2 3/8, 2 4/8, 2 5/8, 2 6/8, 2 7/8, 3. There is 1 X above 2 1/8, 2 Xs above 2 3/8, 3 Xs above 2 4/8, 1 X above 2 6/8 and 1 X above 3."
    prompt: |
      How many seedlings are taller than 2 1/2 inches?
    options:
      - "5"
      - "2"
      - "3"
      - "8"
    option_explanations:
      - |
        5 includes the 3 seedlings at 2 4/8. But 2 4/8 is exactly 2 1/2, so those are not taller.
      - |
        Correct. 2 1/2 = 2 4/8. Only the seedlings at 2 6/8 and at 3 are taller: 1 + 1 = 2.
      - |
        3 is the stack at 2 4/8, which is exactly 2 1/2 inches. Look to the right of 2 4/8 instead.
      - |
        8 is every seedling on the plot. Count only the Xs to the right of 2 4/8.
    answer: 1

  - slug: g4math-final-q09
    type: multiple_choice
    topic_code: "4.NF.B.3"
    source: "IM K–5 Math Grade 4, Unit 3, Section B"
    points: 1
    stimulus: |
      Use the line plot "Seedling Heights". Each X is one seedling in the class garden.
    prompt: |
      How much taller is the tallest seedling than the shortest seedling?
    options:
      - "1 1/8 inches"
      - "8/8 inch"
      - "7/8 inch"
      - "5 1/8 inches"
    option_explanations:
      - |
        1 1/8 subtracts the wholes, 3 − 2 = 1, and keeps the 1/8. Write 3 as 2 8/8 instead: 2 8/8 − 2 1/8 = 7/8.
      - |
        8/8 counts the tick marks from 2 1/8 to 3. Count the spaces between them: there are 7.
      - |
        Correct. The tallest is 3 inches and the shortest is 2 1/8 inches. 3 = 2 8/8, and 2 8/8 − 2 1/8 = 7/8 inch.
      - |
        5 1/8 adds the two heights. "How much taller" asks for the difference.
    answer: 2

  - slug: g4math-final-q10
    type: multiple_choice
    topic_code: "4.NF.B.4"
    source: "IM K–5 Math Grade 4, Unit 3, Section A"
    points: 1
    prompt: |
      Ravi drinks 3/4 cup of milk each day. How much milk does he drink in 5 days?
    options:
      - "3 3/4 cups"
      - "15/20 cup"
      - "5 3/4 cups"
      - "8/4 cups"
    option_explanations:
      - |
        Correct. 5 × 3/4 = 15/4. Three sets of 4/4 make 3 wholes, with 3/4 left, so 3 3/4 cups.
      - |
        15/20 multiplies the denominator too. The pieces stay fourths: 5 groups of 3 fourths is 15 fourths.
      - |
        5 3/4 writes the 5 days as 5 whole cups. Each day is only 3/4 cup, so it is 5 × 3/4.
      - |
        8/4 adds 5 + 3 on top. There are 5 equal groups of 3/4, so multiply: 15/4.
    answer: 0

  - slug: g4math-final-q11
    type: numeric
    topic_code: "4.NF.C.5"
    source: "IM K–5 Math Grade 4, Unit 3, Section C"
    points: 1
    prompt: |
      3/10 + 46/100 = ?/100. What number goes in the numerator?
    answer: { value: 76, tolerance: 0 }
    explanation: |
      3 tenths is 30 hundredths. 30/100 + 46/100 = 76/100.

  - slug: g4math-final-q12
    type: multiple_choice
    topic_code: "4.NF.B.3"
    source: "IM K–5 Math Grade 4, Unit 3, Section B"
    points: 1
    prompt: |
      What is 3 3/8 + 2 7/8?
    options:
      - "5 10/16"
      - "5 2/8"
      - "6 10/8"
      - "6 2/8"
    option_explanations:
      - |
        5 10/16 adds the denominators. Eighths plus eighths stay eighths: 3/8 + 7/8 = 10/8.
      - |
        5 2/8 drops the whole inside 10/8. 10/8 = 1 2/8, so the wholes become 5 + 1 = 6.
      - |
        6 10/8 counts the extra whole twice. The 1 whole came out of 10/8, so only 2/8 is left.
      - |
        Correct. Wholes: 3 + 2 = 5. Eighths: 3/8 + 7/8 = 10/8 = 1 2/8. Then 5 + 1 2/8 = 6 2/8.
    answer: 3

  # ---- Unit 4 · Decimals and big numbers
  - slug: g4math-final-q13
    type: multiple_choice
    topic_code: "4.NF.C.6"
    source: "IM K–5 Math Grade 4, Unit 4, Section A"
    points: 1
    figure: figures/review-hundredths-grid.svg
    figure_alt: "A 10 by 10 grid titled One whole: 100 equal squares. The first 6 columns are fully shaded blue, and the top 3 squares of the 7th column are shaded too. That is 63 shaded squares."
    prompt: |
      The grid is one whole. What decimal names the shaded part?
    options:
      - "0.36"
      - "0.63"
      - "6.3"
      - "0.6"
    option_explanations:
      - |
        0.36 swaps the digits. There are 6 full columns (6 tenths) and 3 more squares (3 hundredths), so 0.63.
      - |
        Correct. 63 of the 100 squares are shaded, which is 63 hundredths, or 0.63.
      - |
        6.3 would be more than 6 wholes. The whole grid is 1, and only part of it is shaded.
      - |
        0.6 counts only the 6 full columns. The 3 extra squares are 3 hundredths, so it is 0.63.
    answer: 1

  - slug: g4math-final-q14
    type: true_false
    topic_code: "4.NF.C.7"
    source: "IM K–5 Math Grade 4, Unit 4, Section A"
    points: 1
    prompt: |
      True or false: 0.5 is greater than 0.45.
    answer: true
    explanation: |
      True. 0.5 is 5 tenths, which is 50 hundredths. 0.45 is 45 hundredths, and 50 is more than 45.

  - slug: g4math-final-q15
    type: multiple_choice
    topic_code: "4.NBT.A.2"
    source: "IM K–5 Math Grade 4, Unit 4, Section B"
    points: 1
    prompt: |
      In the number 472,816, what is the value of the digit 7?
    options:
      - "7,000"
      - "700,000"
      - "70,000"
      - "7"
    option_explanations:
      - |
        7,000 puts the 7 in the thousands place. In 472,816 the thousands digit is 2.
      - |
        700,000 puts the 7 in the hundred-thousands place, where the 4 is.
      - |
        Correct. The 7 is in the ten-thousands place, so it is worth 7 ten-thousands, or 70,000.
      - |
        7 is the digit itself. Its value depends on its place, which is ten-thousands.
    answer: 2

  - slug: g4math-final-q16
    type: multiple_choice
    topic_code: "4.NBT.A.3"
    source: "IM K–5 Math Grade 4, Unit 4, Section C"
    points: 1
    prompt: |
      Round 368,529 to the nearest ten thousand.
    options:
      - "370,000"
      - "360,000"
      - "369,000"
      - "400,000"
    option_explanations:
      - |
        Correct. 368,529 is between 360,000 and 370,000. The thousands digit is 8, so it is closer to 370,000.
      - |
        360,000 rounds down, but the thousands digit is 8, which is 5 or more, so round up.
      - |
        369,000 is rounded to the nearest thousand. The nearest ten thousand ends in four zeros.
      - |
        400,000 is rounded to the nearest hundred thousand. Look at the ten-thousands place instead.
