  - slug: g4math-final-q39
    type: short_answer
    topic_code: "4.NBT.B.5"
    source: "IM K–5 Math Grade 4, Unit 9, Section B"
    points: 3
    prompt: |
      A school garden has 24 rows of bean plants with 16 plants in each row.

      (a) Find 24 × 16 with an area model or partial products. Show all the partial products.
      (b) The plants are shared equally among 8 classes. How many plants does each class care for?
      (c) Check your answer to (b) by multiplying.
    answer: |
      (a) 20 × 10 = 200, 20 × 6 = 120, 4 × 10 = 40, 4 × 6 = 24. 200 + 120 + 40 + 24 = 384 plants.
      (b) 384 ÷ 8: 8 × 40 = 320, leaving 64, and 8 × 8 = 64. So 48 plants for each class.
      (c) 8 × 48 = 320 + 64 = 384, which matches.
    explanation: |
      Three points.

      (a) 1 pt: 384, with four partial products (or two, such as 24 × 10 = 240 and 24 × 6 = 144) shown.

      (b) 1 pt: 48 plants, from dividing the answer to (a) by 8. If (a) is wrong, award this point for a correct division of the student's own product.

      (c) 1 pt: a multiplication of the quotient by 8 that gets back to the total, with a note that it matches.
