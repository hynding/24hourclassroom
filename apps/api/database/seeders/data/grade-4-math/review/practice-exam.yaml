    topic_code: "4.MD.A.3"
    source: "IM K–5 Math Grade 4, Unit 8, Section B"
    points: 1
    prompt: |
      A rectangular rug has a perimeter of 26 feet. It is 8 feet long. How many feet wide is it?
    answer: { value: 5, tolerance: 0 }
    explanation: |
      The two 8-foot sides use 16 feet. 26 − 16 = 10 feet for the other two sides, so each is 10 ÷ 2 = 5 feet. Check: 8 + 5 + 8 + 5 = 26.

  # ---- Unit 9 · Putting it all together
  - slug: g4math-final-q37
    type: multiple_choice
    topic_code: "4.NF.B.3"
    source: "IM K–5 Math Grade 4, Unit 9, Section A"
    points: 1
    prompt: |
      Sam has 4 1/6 cups of flour. He uses 2 5/6 cups for pancakes. How much flour is left?
    options:
