  - slug: g4math-final-q17
    type: numeric
    topic_code: "4.NBT.B.4"
    source: "IM K–5 Math Grade 4, Unit 4, Section D"
    points: 1
    prompt: |
      What is 60,003 − 27,458?
    answer: { value: 32545, tolerance: 0 }
    explanation: |
      Regroup 60,003 as 5 ten-thousands, 9 thousands, 9 hundreds, 9 tens and 13 ones. Then 13 − 8 = 5, 9 − 5 = 4, 9 − 4 = 5, 9 − 7 = 2, 5 − 2 = 3: 32,545. Check: 32,545 + 27,458 = 60,003.

  # ---- Unit 5 · Set B: feet and inches table (4.MD.A.1)
  - slug: g4math-final-q18
    type: multiple_choice
    topic_code: "4.MD.A.1"
    source: "IM K–5 Math Grade 4, Unit 5, Section B"
    points: 1
    stimulus: |
      Use the table "Feet and Inches".
    figure: figures/review-conversion-table.svg
    figure_alt: "A table titled Feet and Inches with two columns. 1 foot is 12 inches, 2 feet is 24 inches, 3 feet is 36 inches, the inches for 4 feet show a question mark, and 5 feet is 60 inches."
    prompt: |
      What number belongs in the table for 4 feet?
    options:
      - "16"
      - "40"
      - "36"
      - "48"
    option_explanations:
      - |
        16 is 4 + 12. Each foot is 12 inches, so 4 feet is 4 × 12.
      - |
        40 is 4 × 10, as if a foot were 10 inches. A foot is 12 inches.
      - |
        36 is the number of inches in 3 feet. One more foot adds 12: 36 + 12 = 48.
      - |
        Correct. 4 × 12 = 48 inches. The table also goes up by 12 each row: 36 + 12 = 48.
    answer: 3

  - slug: g4math-final-q19
    type: numeric
    topic_code: "4.MD.A.1"
    source: "IM K–5 Math Grade 4, Unit 5, Section B"
    points: 1
    stimulus: |
      Use the table "Feet and Inches".
    prompt: |
      Zoe's jump rope is 6 feet 5 inches long. How many inches long is it?
    answer: { value: 77, tolerance: 0 }
    explanation: |
      6 feet is 6 × 12 = 72 inches (or 60 + 12 from the table). 72 + 5 = 77 inches.

  - slug: g4math-final-q20
    type: multiple_choice
    topic_code: "4.OA.A.2"
    source: "IM K–5 Math Grade 4, Unit 5, Section A"
    points: 1
    prompt: |
      A young tree is 9 feet tall. The school building is 6 times as tall as the tree. How tall is the building?
    options:
      - "15 feet"
      - "54 feet"
      - "3 feet"
      - "45 feet"
    option_explanations:
      - |
        15 is 9 + 6, which would be "6 feet taller". "6 times as tall" means multiply: 6 × 9.
      - |
        Correct. 6 times as tall as 9 feet is 6 × 9 = 54 feet.
      - |
        3 is 9 − 6. The building is taller than the tree, 6 times as tall, so multiply.
      - |
        45 is 5 × 9, one group of 9 short. The building is 6 times as tall: 6 × 9 = 54.
    answer: 1

  - slug: g4math-final-q21
    type: multiple_choice
    topic_code: "4.MD.A.2"
    source: "IM K–5 Math Grade 4, Unit 5, Section C"
    points: 1
    prompt: |
      Mei has $10.00. She buys a book for $6.45. How much money does she have left?
    options:
      - "$4.55"
      - "$16.45"
      - "$3.55"
      - "$3.45"
    option_explanations:
      - |
        $4.55 forgets that a dollar was traded for 100 cents. Count up from $6.45: 55 cents to $7.00, then $3.00 to $10.00.
      - |
        $16.45 adds the two amounts. Mei spent money, so subtract $6.45 from $10.00.
      - |
        Correct. Count up from $6.45: 5 cents to $6.50, 50 cents to $7.00, and $3.00 to $10.00. That is $3.55.
      - |
        $3.45 is 10 cents short. From $6.45, it takes 55 cents (not 45) to reach $7.00.
    answer: 2

  # ---- Unit 6 · Patterns, multiplying and dividing
  - slug: g4math-final-q22
    type: multiple_choice
    topic_code: "4.OA.C.5"
    source: "IM K–5 Math Grade 4, Unit 6, Section A"
    points: 1
    prompt: |
      A pattern starts at 5 and follows the rule "add 4": 5, 9, 13, 17, ... Which sentence is true about every number in the pattern?
    options:
      - "Every number is odd."
      - "Every number is even."
      - "The numbers take turns being odd and even."
      - "Every number is a multiple of 4."
    option_explanations:
      - |
        Correct. The pattern starts with an odd number, and adding 4, an even number, keeps an odd number odd.
      - |
        5, 9, 13 and 17 all end in an odd digit, so none of them is even.
      - |
        The numbers would take turns only if the rule added an odd number. Adding 4 keeps each number odd.
      - |
        The rule adds 4, but the pattern starts at 5, not 0 or 4. 5 is not a multiple of 4, and neither is 9.
    answer: 0

  - slug: g4math-final-q23
    type: numeric
    topic_code: "4.NBT.B.5"
    source: "IM K–5 Math Grade 4, Unit 6, Section B"
