unit: 6
description: |
  20 questions · about 40 minutes · every standard of Unit 6: number and shape patterns that follow a rule,
  multiplying up to four digits by one digit and two digits by two digits, dividing up to four digits by one
  digit with remainders, and multistep word problems with remainders and estimates. Two stimulus sets share a
  toothpick pattern or an area diagram across consecutive items. Multiple choice, select-all, true/false and
  number answers are graded at once; the fill-in word is matched automatically; the short answer is checked by
  your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: a toothpick pattern (4.OA.C.5)
  - slug: g4math-u06-check-q01
    type: multiple_choice
    topic_code: "4.OA.C.5"
    source: "IM K–5 Math Grade 4, Unit 6, Section A"
    points: 1
    stimulus: |
      Use the picture. Owen makes a row of squares out of toothpicks. Each step adds one more square to the row.
    figure: figures/u06-toothpicks.svg
    figure_alt: "Three rows of squares made of red toothpicks, labeled Step 1, Step 2 and Step 3. Step 1 is 1 square made of 4 toothpicks. Step 2 is 2 squares side by side sharing a middle toothpick, 7 toothpicks in all. Step 3 is 3 squares in a row, 10 toothpicks in all."
    prompt: |
      How many toothpicks will Step 5 use?
    options:
      - "20"
      - "13"
      - "16"
      - "15"
    option_explanations:
      - |
        20 counts 4 toothpicks for each of 5 squares. Squares next to each other share a toothpick, so each new square adds only 3.
      - |
        13 is Step 4. Step 5 adds 3 more toothpicks.
      - |
        Correct. The steps use 4, 7, 10 ... toothpicks, so the rule is "add 3": 10, 13, 16. Step 5 uses 16.
      - |
        15 is 5 × 3. It forgets the very first toothpick on the left end of the row.
    answer: 2

  - slug: g4math-u06-check-q02
    type: numeric
    topic_code: "4.OA.C.5"
    source: "IM K–5 Math Grade 4, Unit 6, Section A"
    points: 1
    stimulus: |
      Use the picture. Owen makes a row of squares out of toothpicks. Each step adds one more square to the row.
    prompt: |
      Owen keeps going. Which step uses exactly 25 toothpicks?
    answer: { value: 8, tolerance: 0 }
    explanation: |
      Keep adding 3: Step 4 uses 13, Step 5 uses 16, Step 6 uses 19, Step 7 uses 22 and Step 8 uses 25.

  # ---- More patterns (4.OA.C.5)
  - slug: g4math-u06-check-q03
    type: multiple_choice
    topic_code: "4.OA.C.5"
    source: "IM K–5 Math Grade 4, Unit 6, Section A"
    points: 1
    prompt: |
      A pattern starts at 40, and the rule is "add 15". Which number is a term in the pattern?
    options:
      - "85"
      - "90"
      - "95"
      - "105"
    option_explanations:
      - |
        Correct. The terms are 40, 55, 70, 85, 100 ... so 85 is the 4th term.
      - |
        90 is not a term. The pattern goes from 85 to 100, so it skips 90.
      - |
        95 is not a term. It falls between 85 and 100.
      - |
        105 is not a term. After 100 the next term is 115.
    answer: 0

  - slug: g4math-u06-check-q04
    type: multiple_choice
    topic_code: "4.OA.C.5"
    source: "IM K–5 Math Grade 4, Unit 6, Section A"
    points: 1
    prompt: |
      A pattern starts at 6, and the rule is "add 3". Which sentence about the pattern is true?
    options:
      - "Every term is even."
      - "The terms take turns: even, odd, even, odd."
      - "Every term is odd."
      - "Every term is a multiple of 6."
    option_explanations:
      - |
        The 2nd term is 6 + 3 = 9, which is odd. Adding an odd number changes even to odd.
      - |
        Correct. The terms are 6, 9, 12, 15, 18 ... Adding 3, an odd number, switches between even and odd every time.
      - |
        The 1st term, 6, is even, and so are 12 and 18. The terms take turns.
      - |
        9 and 15 are terms, and they are not multiples of 6. The terms are the multiples of 3, starting at 6.
    answer: 1

  # ---- Stimulus set B: an area diagram for 46 × 37 (4.NBT.B.5)
  - slug: g4math-u06-check-q05
    type: multiple_choice
    topic_code: "4.NBT.B.5"
    source: "IM K–5 Math Grade 4, Unit 6, Section B"
    points: 1
    stimulus: |
      Use the area diagram. It shows 46 × 37 split into four parts.
    figure: figures/u06-area-46x37.svg
    figure_alt: "A rectangle with its top split into parts labeled 40 and 6 and its left side split into parts labeled 30 and 7. The four parts have these numbers inside: top left 1,200, top right 180, bottom left 280, bottom right 42."
    prompt: |
      What is 46 × 37?
    options:
      - "1,242"
      - "1,522"
      - "83"
      - "1,702"
    option_explanations:
      - |
        1,242 is 1,200 + 42, only tens times tens and ones times ones. The parts 180 and 280 are missing.
      - |
        1,522 is 1,200 + 280 + 42. It leaves out the top right part, 6 × 30 = 180.
      - |
        83 is 46 + 37. The diagram shows a product: add the areas of all four parts.
      - |
        Correct. 1,200 + 180 + 280 + 42 = 1,702.
    answer: 3

  - slug: g4math-u06-check-q06
    type: multi_select
    topic_code: "4.NBT.B.5"
    source: "IM K–5 Math Grade 4, Unit 6, Section B"
    points: 2
    partial_credit: true
    stimulus: |
      Use the area diagram. It shows 46 × 37 split into four parts.
    prompt: |
      Which expressions are equal to 46 × 37? Select all that apply.
    options:
      - "1,200 + 180 + 280 + 42"
      - "46 × 30 + 46 × 7"
      - "40 × 30 + 6 × 7"
      - "40 × 37 + 6 × 37"
      - "40 × 37 + 6"
    option_explanations:
      - |
        Equal. These are the four parts of the diagram, and together they make the whole rectangle.
      - |
        Equal. The top row of the diagram is 46 × 30 and the bottom row is 46 × 7.
      - |
        Not equal. This is only the top left and bottom right parts. 6 × 30 and 40 × 7 are missing.
      - |
        Equal. The left column of the diagram is 40 × 37 and the right column is 6 × 37.
      - |
        Not equal. The 6 must be multiplied by 37 too, not just added.
    answer: [0, 1, 3]

  # ---- More multiplication (4.NBT.B.5)
  - slug: g4math-u06-check-q07
    type: numeric
    topic_code: "4.NBT.B.5"
    source: "IM K–5 Math Grade 4, Unit 6, Section B"
    points: 1
    prompt: |
      What is 8 × 1,409?
    answer: { value: 11272, tolerance: 0 }
    explanation: |
      8 × 1,000 = 8,000, 8 × 400 = 3,200, 8 × 0 = 0 and 8 × 9 = 72. 8,000 + 3,200 + 72 = 11,272.

  - slug: g4math-u06-check-q08
    type: multiple_choice
    topic_code: "4.NBT.B.5"
    source: "IM K–5 Math Grade 4, Unit 6, Section B"
    points: 1
    prompt: |
      Which sum is equal to 7 × 365?
    options:
      - "2,100 + 420 + 35"
      - "2,100 + 60 + 5"
      - "210 + 42 + 35"
      - "7 + 300 + 60 + 5"
    option_explanations:
      - |
        Correct. 7 × 300 = 2,100, 7 × 60 = 420 and 7 × 5 = 35. The total is 2,555.
      - |
        Only the 300 was multiplied by 7. The 60 and the 5 must be multiplied by 7 too.
      - |
        7 × 300 is 21 hundreds, 2,100, not 210. And 7 × 60 is 420, not 42.
      - |
        This adds 7 instead of multiplying each part of 365 by 7.
    answer: 0

  - slug: g4math-u06-check-q09
    type: numeric
    topic_code: "4.NBT.B.5"
    source: "IM K–5 Math Grade 4, Unit 6, Section B"
    points: 1
    prompt: |
      An animal shelter orders 24 bags of dog food. Each bag weighs 15 pounds. How many pounds of dog food is that?
    answer: { value: 360, tolerance: 0 }
    explanation: |
      24 × 15: 20 × 10 = 200, 4 × 10 = 40, 20 × 5 = 100 and 4 × 5 = 20. 200 + 40 + 100 + 20 = 360 pounds.

  # ---- Division (4.NBT.B.6)
  - slug: g4math-u06-check-q10
    type: multiple_choice
    topic_code: "4.NBT.B.6"
    source: "IM K–5 Math Grade 4, Unit 6, Section C"
    points: 1
    figure: figures/u06-division-1275.svg
    figure_alt: "A rectangle with its left side labeled 5, split into three parts with 1,000, 250 and 25 written inside. The top of each part is labeled with a bold question mark."
    prompt: |
      Zoe drew this area diagram to find 1,275 ÷ 5. What is 1,275 ÷ 5?
    options:
      - "250"
      - "55"
      - "255"
      - "1,270"
    option_explanations:
      - |
        250 leaves out the smallest part. Its top is 5, because 5 × 5 = 25.
      - |
        55 leaves out the biggest part. Its top is 200, because 5 × 200 = 1,000.
      - |
        Correct. The tops are 200, 50 and 5, because 5 × 200 = 1,000, 5 × 50 = 250 and 5 × 5 = 25. 200 + 50 + 5 = 255.
      - |
        1,270 is 1,275 − 5. The quotient is the length of the top side, found part by part.
    answer: 2

  - slug: g4math-u06-check-q11
    type: fill_blank
    topic_code: "4.NBT.B.6"
    source: "IM K–5 Math Grade 4, Unit 6, Section C"
    points: 1
    prompt: |
      In 1,275 ÷ 5 = 255, the answer 255 is called the ____.
    answer: ["quotient", "the quotient", "quotients"]
    explanation: |
      Quotient. The answer to a division is the quotient; 1,275 is the number being divided and 5 is the divisor.

  - slug: g4math-u06-check-q12
    type: numeric
    topic_code: "4.NBT.B.6"
    source: "IM K–5 Math Grade 4, Unit 6, Section C"
    points: 1
    prompt: |
      What is 672 ÷ 4?
    answer: { value: 168, tolerance: 0 }
    explanation: |
      400 ÷ 4 = 100, 240 ÷ 4 = 60 and 32 ÷ 4 = 8. 100 + 60 + 8 = 168. Check: 4 × 168 = 672.

  - slug: g4math-u06-check-q13
    type: multiple_choice
    topic_code: "4.NBT.B.6"
    source: "IM K–5 Math Grade 4, Unit 6, Section C"
    points: 1
    prompt: |
      What is 86 ÷ 6?
    options:
      - "13 R 8"
      - "14 R 2"
      - "14"
      - "15 R 4"
    option_explanations:
      - |
        A remainder of 8 is more than 6, so one more group of 6 fits. That makes 14 R 2.
      - |
        Correct. 6 × 14 = 84 and 86 − 84 = 2, so 86 ÷ 6 = 14 R 2.
      - |
        14 is the number of whole groups, but 6 × 14 = 84, so 2 are left. Write the remainder too.
      - |
        6 × 15 = 90, which is more than 86, so 15 groups of 6 do not fit.
    answer: 1

  - slug: g4math-u06-check-q14
    type: multiple_choice
    topic_code: "4.NBT.B.6"
    source: "IM K–5 Math Grade 4, Unit 6, Section C"
    points: 1
    prompt: |
      Kenji found 945 ÷ 7 with partial quotients. He took away 700, then 210, then 35, which left 0. What is 945 ÷ 7?
    options:
      - "130"
      - "35"
      - "105"
      - "135"
    option_explanations:
      - |
        130 counts the groups in 700 and 210 but forgets the 5 groups of 7 in 35.
      - |
        35 is the last amount Kenji took away, not a number of groups. 35 is 5 groups of 7.
      - |
        105 forgets the 30 groups of 7 that Kenji took away as 210.
      - |
        Correct. 700 is 100 sevens, 210 is 30 sevens and 35 is 5 sevens. 100 + 30 + 5 = 135. Check: 7 × 135 = 945.
    answer: 3

  - slug: g4math-u06-check-q15
    type: numeric
    topic_code: "4.NBT.B.6"
    source: "IM K–5 Math Grade 4, Unit 6, Section C"
    points: 1
    prompt: |
      A library puts 4,236 books on 6 shelves, the same number on each shelf. How many books go on each shelf?
    answer: { value: 706, tolerance: 0 }
    explanation: |
      4,200 ÷ 6 = 700 and 36 ÷ 6 = 6. 700 + 6 = 706 books. There are no tens in the quotient. Check: 6 × 706 = 4,236.

  # ---- Multistep problems (4.OA.A.3)
  - slug: g4math-u06-check-q16
    type: multiple_choice
    topic_code: "4.OA.A.3"
    source: "IM K–5 Math Grade 4, Unit 6, Section D"
    points: 1
    prompt: |
      122 students and 10 teachers go to a play. Each row in the theater has 9 seats. How many rows do they need so that everyone has a seat?
    options:
      - "15"
      - "14"
      - "6"
      - "132"
    option_explanations:
      - |
        Correct. 122 + 10 = 132 people. 132 ÷ 9 = 14 R 6, and the last 6 people need a 15th row.
      - |
        14 rows seat 126 people, so 6 people would have no seat. The remainder means one more row.
      - |
        6 is the remainder, the people left after 14 full rows. The question asks for the number of rows.
      - |
        132 is how many people there are, the first step. Divide by 9 to find the rows.
    answer: 0

  - slug: g4math-u06-check-q17
    type: numeric
    topic_code: "4.OA.A.3"
    source: "IM K–5 Math Grade 4, Unit 6, Section D"
    points: 1
    prompt: |
      Ms. Lee buys 5 boxes of markers that cost $9 each and 3 packs of paper that cost $4 each. How many dollars does she spend in all?
    answer: { value: 57, tolerance: 0 }
    explanation: |
      Markers: 5 × 9 = $45. Paper: 3 × 4 = $12. Total: 45 + 12 = $57.

  - slug: g4math-u06-check-q18
    type: multiple_choice
    topic_code: "4.OA.A.3"
    source: "IM K–5 Math Grade 4, Unit 6, Section D"
    points: 1
    prompt: |
      Ari says that 38 × 21 = 7,980. Which estimate shows that his answer is not reasonable?
    options:
      - "38 + 21 is about 60, so the answer should be near 60."
      - "40 × 20 = 800, so the answer should be near 800."
      - "40 × 20 = 8,000, so 7,980 is close."
      - "30 × 20 = 600, so the answer should be less than 600."
    option_explanations:
      - |
        Adding the factors does not estimate a product. 38 × 21 means 38 groups of 21.
      - |
        Correct. Rounding gives 40 × 20 = 800, and 7,980 is about ten times too big. (The exact product is 798.)
      - |
        4 tens × 2 tens = 8 hundreds, which is 800, not 8,000.
      - |
        38 rounds to 40, not 30. And 38 × 21 is more than 30 × 20, so "less than 600" is not true.
    answer: 1

  - slug: g4math-u06-check-q19
    type: true_false
    topic_code: "4.OA.A.3"
    source: "IM K–5 Math Grade 4, Unit 6, Section D"
    points: 1
    prompt: |
      True or false: a ribbon 100 inches long can be cut into 12 pieces that are each 8 inches long, with 4 inches left over.
    answer: true
    explanation: |
      True. 12 × 8 = 96 inches, and 100 − 96 = 4 inches left. That is 100 ÷ 8 = 12 R 4.

  - slug: g4math-u06-check-q20
    type: short_answer
    topic_code: "4.OA.A.3"
    source: "IM K–5 Math Grade 4, Unit 6, Section D"
    points: 3
    prompt: |
      A school has 6 fourth-grade classes with 28 students in each class. On art day, the students sit 4 at each table.

      (a) How many fourth graders are there?
      (b) How many tables do they need?
      (c) Each table gets 1 jar of paint. Paint comes in boxes of 8 jars. How many boxes must the school open so every table gets a jar? Explain what the remainder means.
    answer: |
      (a) 6 × 28 = 168 students.
      (b) 168 ÷ 4 = 42 tables.
      (c) 6 boxes. 42 ÷ 8 = 5 R 2: 5 boxes give only 40 jars, so the last 2 tables need a 6th box.
    explanation: |
      Three points.

      (a) 1 pt: 168 students (6 × 28 = 120 + 48).

      (b) 1 pt: 42 tables, or a correct division of their own answer to (a) by 4.

      (c) 1 pt: 6 boxes, with a reason that the 2 tables left over still need jars, so the remainder means one more box. "5 R 2" or "5 boxes" alone earns no point.
