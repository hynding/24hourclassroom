week: 19
unit: 6
title: "Multiplying Two-Digit Numbers by Two-Digit Numbers"
topics: ["4.NBT.B.5"]
guide: guides/week-19.md
guide_description: |
  How to multiply two two-digit numbers: split both into tens and ones, draw an area diagram with four parts
  or a partial-product table, add the four partial products, and estimate to check.
flashcards_description: |
  18 cards on tens times tens, four-part area diagrams, partial-product tables, the "tens with tens, ones
  with ones" mistake and estimating two-digit products.

flashcards:
  - front: 20 × 30 → product using tens
    back: |
      2 tens × 3 tens = 6 hundreds = 600. Think 2 × 3 = 6, then 10 × 10 = 100.
    topic_code: "4.NBT.B.5"
  - front: 40 × 50 → product using tens
    back: |
      4 × 5 = 20, and 10 × 10 = 100, so 20 hundreds = 2,000.
    topic_code: "4.NBT.B.5"
  - front: 60 × 70 → product using tens
    back: |
      6 × 7 = 42 and 10 × 10 = 100, so 42 hundreds = 4,200.
    topic_code: "4.NBT.B.5"
  - front: Two-digit times two-digit → how many partial products
    back: |
      Four. Each factor splits into tens and ones, and every part of one factor is multiplied by every part of the other: tens × tens, tens × ones, ones × tens and ones × ones.
    topic_code: "4.NBT.B.5"
  - front: Area diagram for 23 × 15 → what it looks like
    back: |
      A rectangle with the top split into 20 and 3 and the side split into 10 and 5. Its four parts are 200, 30, 100 and 15.
    topic_code: "4.NBT.B.5"
  - front: 23 × 15 → by partial products
    back: |
      20 × 10 = 200, 3 × 10 = 30, 20 × 5 = 100, 3 × 5 = 15. 200 + 30 + 100 + 15 = 345.
    topic_code: "4.NBT.B.5"
  - front: Partial-product table → how to fill it
    back: |
      Write the tens and ones of one factor across the top and the other's down the side. Each box is its column number times its row number.
    topic_code: "4.NBT.B.5"
  - front: 34 × 26 → by partial products
    back: |
      30 × 20 = 600, 4 × 20 = 80, 30 × 6 = 180, 4 × 6 = 24. The total is 884.
    topic_code: "4.NBT.B.5"
  - front: 12 × 14 → by partial products
    back: |
      10 × 10 = 100, 2 × 10 = 20, 10 × 4 = 40, 2 × 4 = 8. 100 + 20 + 40 + 8 = 168.
    topic_code: "4.NBT.B.5"
  - front: 45 × 22 → by partial products
    back: |
      40 × 20 = 800, 5 × 20 = 100, 40 × 2 = 80, 5 × 2 = 10. The total is 990.
    topic_code: "4.NBT.B.5"
  - front: Tens with tens and ones with ones → the mistake
    back: |
      23 × 15 is not 20 × 10 + 3 × 5 = 215. That leaves out two parts, 3 × 10 and 20 × 5. All four parts are needed: 345.
    topic_code: "4.NBT.B.5"
  - front: Splitting only one factor, like 23 × 15 = 23 × 10 + 23 × 5 → does it work
    back: |
      Yes. 230 + 115 = 345. Splitting one factor gives two partial products, each a bigger multiplication.
    topic_code: "4.NBT.B.5"
  - front: 25 × 40 → a friendly way
    back: |
      Four 25s make 100, so 40 × 25 is 10 times that: 1,000.
    topic_code: "4.NBT.B.5"
  - front: 11 × 37 → a friendly way
    back: |
      10 × 37 + 1 × 37 = 370 + 37 = 407.
    topic_code: "4.NBT.B.5"
  - front: Estimating 61 × 39 → how
    back: |
      Round both to the nearest ten: 60 × 40 = 2,400. The exact product, 2,379, is close.
    topic_code: "4.NBT.B.5"
  - front: Product of two two-digit numbers → how big it can be
    back: |
      At least 100 (10 × 10) and less than 10,000 (100 × 100). So it has three or four digits.
    topic_code: "4.NBT.B.5"
  - front: 30 × 40 written as 120 → what went wrong
    back: |
      3 × 4 = 12, but both factors are tens. Tens times tens makes hundreds: 12 hundreds = 1,200.
    topic_code: "4.NBT.B.5"
  - front: Checking a product → two ways
    back: |
      Estimate (round the factors and multiply) to see it is about right, or multiply again with the factors switched or split a different way.
    topic_code: "4.NBT.B.5"

quiz:
  description: |
    14 questions · about 25 minutes · multiplying two-digit numbers by two-digit numbers with area diagrams,
    partial-product tables and estimates, plus review of one-digit multiplication, patterns and converting
    units. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word is
    matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w19-q01
      type: multiple_choice
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      stimulus: |
        Use the area diagram. It shows 23 × 15 split into four parts.
      figure: figures/w19-area-23x15.svg
      figure_alt: "A rectangle with its top split into parts labeled 20 and 3 and its left side split into parts labeled 10 and 5. The four parts have these numbers inside: top left 200, top right 30, bottom left 100, bottom right 15."
      prompt: |
        What is 23 × 15?
      options:
        - "215"
        - "345"
        - "245"
        - "38"
      option_explanations:
        - |
          215 is 200 + 15, only the tens-by-tens part and the ones-by-ones part. The diagram has two more parts, 30 and 100.
        - |
          Correct. Add all four parts: 200 + 30 + 100 + 15 = 345.
        - |
          245 is 200 + 30 + 15. It leaves out the bottom left part, 20 × 5 = 100.
        - |
          38 is 23 + 15. The diagram shows a product, so add the areas of the four parts.
      answer: 1

    - slug: g4math-w19-q02
      type: true_false
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      stimulus: |
        Use the area diagram. It shows 23 × 15 split into four parts.
      prompt: |
        True or false: the diagram also shows that 23 × 15 = 20 × 15 + 3 × 15.
      answer: true
      explanation: |
        True. The left column is 20 by 15, and its parts make 200 + 100 = 300 = 20 × 15. The right column is 3 by 15, and its parts make 30 + 15 = 45 = 3 × 15. 300 + 45 = 345.

    - slug: g4math-w19-q03
      type: numeric
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      stimulus: |
        Use the table. Marco is finding 34 × 26 with a partial-product table. One box is empty: it shows a question mark.
      figure: figures/w19-grid-34x26.svg
      figure_alt: "A table with a times sign in the top left corner. The top row is labeled 30 and 4. The side column is labeled 20 and 6. The boxes are: row 20, column 30: 600; row 20, column 4: 80; row 6, column 30: a bold question mark; row 6, column 4: 24."
      prompt: |
        What number goes in the box with the question mark?
      answer: { value: 180, tolerance: 0 }
      explanation: |
        The box is in row 6 and column 30. 6 × 30 = 6 × 3 tens = 18 tens = 180.

    - slug: g4math-w19-q04
      type: multiple_choice
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      stimulus: |
        Use the table. Marco is finding 34 × 26 with a partial-product table. One box is empty: it shows a question mark.
      prompt: |
        What is 34 × 26?
      options:
        - "624"
        - "704"
        - "60"
        - "884"
      option_explanations:
        - |
          624 is 600 + 24, only tens times tens and ones times ones. The boxes 80 and 180 are part of the product too.
        - |
          704 is 600 + 80 + 24. It leaves out the empty box, which is 6 × 30 = 180.
        - |
          60 is 34 + 26. The table is for multiplying, so add the four boxes.
        - |
          Correct. Add all four boxes, including the empty one: 600 + 80 + 180 + 24 = 884.
      answer: 3

    - slug: g4math-w19-q05
      type: multiple_choice
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      prompt: |
        Which expression shows 47 × 52 broken into four partial products?
      options:
        - "40 × 50 + 40 × 2 + 7 × 50 + 7 × 2"
        - "40 × 50 + 7 × 2"
        - "4 × 5 + 4 × 2 + 7 × 5 + 7 × 2"
        - "47 × 50 + 2"
      option_explanations:
        - |
          Correct. 47 = 40 + 7 and 52 = 50 + 2, and each part of one is multiplied by each part of the other.
        - |
          This has only two partial products, tens times tens and ones times ones. 40 × 2 and 7 × 50 are missing.
        - |
          This uses the digits but loses their values: the 4 in 47 is 40 and the 5 in 52 is 50.
        - |
          47 × 50 is fine, but the 2 must be multiplied by 47 as well: 47 × 2, not just 2.
      answer: 0

    - slug: g4math-w19-q06
      type: numeric
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      prompt: |
        What is 36 × 14?
      answer: { value: 504, tolerance: 0 }
      explanation: |
        30 × 10 = 300, 6 × 10 = 60, 30 × 4 = 120 and 6 × 4 = 24. 300 + 60 + 120 + 24 = 504.

    - slug: g4math-w19-q07
      type: numeric
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      prompt: |
        A school theater has 28 rows of seats with 35 seats in each row. How many seats does it have?
      answer: { value: 980, tolerance: 0 }
      explanation: |
        28 × 35: 20 × 30 = 600, 20 × 5 = 100, 8 × 30 = 240 and 8 × 5 = 40. 600 + 100 + 240 + 40 = 980 seats.

    - slug: g4math-w19-q08
      type: multiple_choice
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      prompt: |
        Which is the best estimate for 61 × 39?
      options:
        - "240"
        - "24,000"
        - "2,400"
        - "100"
      option_explanations:
        - |
          240 is 6 × 40. 61 is about 6 tens, so the estimate is 60 × 40, and tens times tens gives hundreds.
        - |
          24,000 is ten times too big. 6 tens × 4 tens = 24 hundreds, not 24 thousands.
        - |
          Correct. Round to 60 × 40. 6 × 4 = 24 and tens times tens is hundreds, so 2,400. (The exact product is 2,379.)
        - |
          100 is 60 + 40. To estimate a product, multiply the rounded numbers.
      answer: 2

    - slug: g4math-w19-q09
      type: fill_blank
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      prompt: |
        A rectangle with sides of 23 and 15, split into parts to show a product, is called an area ____.
      answer: ["diagram", "diagrams", "model", "models"]
      explanation: |
        Area diagram (some books say area model). The area of the whole rectangle is the product, and the parts are the partial products.

    - slug: g4math-w19-q10
      type: multi_select
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which of these are equal to 40 × 30? Select all that apply.
      options:
        - "1,200"
        - "120"
        - "4 × 3 × 100"
        - "12 tens"
        - "120 tens"
      option_explanations:
        - |
          Equal. 4 tens × 3 tens = 12 hundreds = 1,200.
        - |
          Not equal. 120 is 4 × 30. Both factors are tens, so the product is hundreds.
        - |
          Equal. 40 × 30 = 4 × 10 × 3 × 10, which is 4 × 3 × 100 = 1,200.
        - |
          Not equal. 12 tens is 120. The product is 12 hundreds.
        - |
          Equal. 120 tens is 1,200, because 120 × 10 = 1,200.
      answer: [0, 2, 4]

    - slug: g4math-w19-q11
      type: multiple_choice
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      prompt: |
        What is 5 × 2,306?
      options:
        - "10,530"
        - "11,530"
        - "11,500"
        - "2,311"
      option_explanations:
        - |
          10,530 uses 5 × 300 = 500. But 5 × 3 hundreds = 15 hundreds = 1,500.
        - |
          Correct. 5 × 2,000 = 10,000, 5 × 300 = 1,500, 5 × 0 = 0 and 5 × 6 = 30. The total is 11,530.
        - |
          11,500 leaves out the last partial product, 5 × 6 = 30.
        - |
          2,311 is 5 + 2,306. Multiply each part by 5 instead.
      answer: 1

    - slug: g4math-w19-q12
      type: multiple_choice
      topic_code: "4.OA.C.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section A"
      points: 1
      prompt: |
        Step 1 of a dot pattern has 3 dots, Step 2 has 6 dots and Step 3 has 9 dots. The rule is "add 3". How many dots does Step 8 have?
      options:
        - "27"
        - "21"
        - "11"
        - "24"
      option_explanations:
        - |
          27 is Step 9. Count again: Steps 4 to 8 have 12, 15, 18, 21 and 24 dots.
        - |
          21 is Step 7. One more jump of 3 reaches Step 8.
        - |
          11 is 8 + 3. Each step adds 3 dots to the step before it, starting from 3.
        - |
          Correct. Each step has 3 times its step number of dots, so Step 8 has 8 × 3 = 24.
      answer: 3

    - slug: g4math-w19-q13
      type: numeric
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 1
      prompt: |
        A bag of flour weighs 5 pounds. How many ounces is that?
      answer: { value: 80, tolerance: 0 }
      explanation: |
        1 pound is 16 ounces, so 5 pounds is 5 × 16 = 80 ounces.

    - slug: g4math-w19-q14
      type: short_answer
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 2
      prompt: |
        Priya found 32 × 24 like this: "30 × 20 = 600 and 2 × 4 = 8, so 32 × 24 = 608."

        (a) What is 32 × 24?
        (b) Explain what Priya left out.
      answer: |
        (a) 768.
        (b) She multiplied only tens by tens and ones by ones. She left out 2 × 20 = 40 and 30 × 4 = 120. 600 + 40 + 120 + 8 = 768.
      explanation: |
        Two points.

        (a) 1 pt: 768.

        (b) 1 pt: names the two missing partial products, 2 × 20 = 40 and 30 × 4 = 120 (or says she left out the tens times ones and ones times tens parts). An area diagram with all four parts also earns the point.
