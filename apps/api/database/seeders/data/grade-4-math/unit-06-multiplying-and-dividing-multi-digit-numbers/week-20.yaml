week: 20
unit: 6
title: "Dividing by a One-Digit Number"
topics: ["4.NBT.B.6"]
guide: guides/week-20.md
guide_description: |
  How to divide numbers up to four digits by a one-digit number: take away friendly multiples of the divisor
  (partial quotients), draw a division area diagram, write any remainder as "R", and check by multiplying.
flashcards_description: |
  18 cards on dividing multiples of 10 and 100, partial quotients, division area diagrams, remainders and
  checking a quotient with multiplication.

flashcards:
  - front: 240 ÷ 6 → quotient using tens
    back: |
      240 is 24 tens. 24 tens ÷ 6 = 4 tens = 40.
    topic_code: "4.NBT.B.6"
  - front: 3,500 ÷ 7 → quotient using hundreds
    back: |
      3,500 is 35 hundreds. 35 hundreds ÷ 7 = 5 hundreds = 500.
    topic_code: "4.NBT.B.6"
  - front: Partial quotients → what they are
    back: |
      A way to divide in friendly chunks. Take away an easy multiple of the divisor again and again, write down how many groups each chunk is, then add those numbers.
    topic_code: "4.NBT.B.6"
  - front: 852 ÷ 4 → by partial quotients
    back: |
      800 ÷ 4 = 200, 40 ÷ 4 = 10, 12 ÷ 4 = 3. 200 + 10 + 3 = 213.
    topic_code: "4.NBT.B.6"
  - front: 576 ÷ 3 → by partial quotients
    back: |
      Take away 300 (100 groups), 270 (90 groups) and 6 (2 groups). 100 + 90 + 2 = 192.
    topic_code: "4.NBT.B.6"
  - front: Division area diagram → what is known and what is missing
    back: |
      The total area (the number being divided) and one side (the divisor) are known. The other side is the quotient, built from the tops of the parts.
    topic_code: "4.NBT.B.6"
  - front: Friendly chunks for dividing by 6 → examples
    back: |
      600 (100 groups of 6), 60 (10 groups), 120 (20 groups), 300 (50 groups). Use the biggest one that fits.
    topic_code: "4.NBT.B.6"
  - front: Remainder → what it is
    back: |
      The amount left over when a total cannot be split into equal groups exactly. 38 ÷ 5 = 7 R 3: 7 groups of 5 use 35, and 3 are left.
    topic_code: "4.NBT.B.6"
  - front: "R 3 in 38 ÷ 5 = 7 R 3 → what it means"
    back: |
      R stands for remainder. After making 7 groups of 5, 3 are left over.
    topic_code: "4.NBT.B.6"
  - front: Remainder bigger than the divisor, like 13 R 7 for 59 ÷ 4 → what it means
    back: |
      You are not finished. 7 more is enough for another group of 4. The answer is 14 R 3.
    topic_code: "4.NBT.B.6"
  - front: Checking 157 ÷ 6 = 26 R 1 → how
    back: |
      Multiply and add the remainder: 6 × 26 = 156, and 156 + 1 = 157. It matches.
    topic_code: "4.NBT.B.6"
  - front: 434 ÷ 7 → quotient
    back: |
      62. 420 ÷ 7 = 60 and 14 ÷ 7 = 2. Check: 7 × 62 = 434.
    topic_code: "4.NBT.B.6"
  - front: 1,345 ÷ 5 → by partial quotients
    back: |
      1,000 ÷ 5 = 200, 300 ÷ 5 = 60, 45 ÷ 5 = 9. The quotient is 269.
    topic_code: "4.NBT.B.6"
  - front: 3,248 ÷ 8 → a zero in the quotient
    back: |
      3,200 ÷ 8 = 400 and 48 ÷ 8 = 6. 3,248 ÷ 8 = 406: there are no tens.
    topic_code: "4.NBT.B.6"
  - front: Sharing base-ten blocks to divide 96 ÷ 4 → how
    back: |
      9 tens into 4 groups is 2 tens each, with 1 ten left. Trade it for 10 ones: 16 ones into 4 groups is 4 each. Each group has 24.
    topic_code: "4.NBT.B.6"
  - front: Estimating 812 ÷ 4 → how
    back: |
      800 ÷ 4 = 200, so the quotient is a little more than 200. (It is 203.)
    topic_code: "4.NBT.B.6"
  - front: Division and multiplication → how they are related
    back: |
      Division finds a missing factor. 852 ÷ 4 = ? asks 4 × ? = 852. That is why multiplying checks a division.
    topic_code: "4.NBT.B.6"
  - front: Quotient → what it is
    back: |
      The answer to a division. In 852 ÷ 4 = 213, the quotient is 213.
    topic_code: "4.NBT.B.6"

quiz:
  description: |
    14 questions · about 25 minutes · dividing two-, three- and four-digit numbers by a one-digit number with
    partial quotients, division area diagrams and remainders, plus review of multiplying, converting time and
    factor pairs. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in
    word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w20-q01
      type: numeric
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 6, Section C"
      points: 1
      stimulus: |
        Use the area diagram. It shows 852 ÷ 4. The area of the whole rectangle is 852 and one side is 4.
      figure: figures/w20-area-852.svg
      figure_alt: "A rectangle with its left side labeled 4, split into three parts with 800, 40 and 12 written inside. The tops of the parts are labeled 200, a bold question mark, and 3."
      prompt: |
        What number goes where the question mark is?
      answer: { value: 10, tolerance: 0 }
      explanation: |
        The middle part has an area of 40 and a side of 4. 4 × 10 = 40, so its top is 10.

    - slug: g4math-w20-q02
      type: multiple_choice
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 6, Section C"
      points: 1
      stimulus: |
        Use the area diagram. It shows 852 ÷ 4. The area of the whole rectangle is 852 and one side is 4.
      prompt: |
        What is 852 ÷ 4?
      options:
        - "213"
        - "203"
        - "13"
        - "848"
      option_explanations:
        - |
          Correct. The top side is 200 + 10 + 3 = 213. Check: 4 × 213 = 800 + 40 + 12 = 852.
        - |
          203 leaves out the middle part. Its top is 10, because 4 × 10 = 40.
        - |
          13 leaves out the biggest part, whose top is 200 because 4 × 200 = 800.
        - |
          848 is 852 − 4. Dividing by 4 asks how long the other side is, not what is left after taking away 4.
      answer: 0

    - slug: g4math-w20-q03
      type: multiple_choice
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 6, Section C"
      points: 1
      stimulus: |
        Use the picture. Ines put her 38 stickers into 5 bags, the same number in each bag, and some were left over.
      figure: figures/w20-stickers-38.svg
      figure_alt: "Five circles labeled Bag 1 to Bag 5, each holding 7 blue dots. Below them, a dashed box labeled left over holds 3 red dots. There are 38 dots in all."
      prompt: |
        Which equation matches the whole picture?
      options:
        - "38 ÷ 5 = 8"
        - "35 ÷ 5 = 7"
        - "38 ÷ 5 = 7 R 3"
        - "38 ÷ 5 = 6 R 8"
      option_explanations:
        - |
          8 in each bag would need 5 × 8 = 40 stickers. Ines has only 38, so each bag gets 7.
        - |
          35 ÷ 5 = 7 is true, but it leaves out the 3 stickers left over. The picture shows all 38.
        - |
          Correct. 38 stickers make 5 bags of 7 (35 stickers) with 3 left over.
        - |
          A remainder of 8 is more than 5, so another sticker could go in every bag. Keep sharing until fewer than 5 are left.
      answer: 2

    - slug: g4math-w20-q04
      type: true_false
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 6, Section C"
      points: 1
      stimulus: |
        Use the picture. Ines put her 38 stickers into 5 bags, the same number in each bag, and some were left over.
      prompt: |
        True or false: with 2 more stickers, Ines could fill the 5 bags equally with none left over.
      answer: true
      explanation: |
        True. 38 + 2 = 40, and 40 ÷ 5 = 8 with no remainder. The 3 left over plus 2 more make 5, one more for each bag.

    - slug: g4math-w20-q05
      type: numeric
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 6, Section C"
      points: 1
      prompt: |
        What is 576 ÷ 3?
      answer: { value: 192, tolerance: 0 }
      explanation: |
        Take away 300 (100 groups of 3), leaving 276. Take away 270 (90 groups), leaving 6. Take away 6 (2 groups). 100 + 90 + 2 = 192. Check: 3 × 192 = 576.

    - slug: g4math-w20-q06
      type: multiple_choice
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 6, Section C"
      points: 1
      prompt: |
        Ravi found 1,345 ÷ 5 in parts: 1,000 ÷ 5 = 200, then 300 ÷ 5 = 60, then 45 ÷ 5 = 9. What is 1,345 ÷ 5?
      options:
        - "260"
        - "69"
        - "1,340"
        - "269"
      option_explanations:
        - |
          260 adds 200 and 60 but forgets the last part, 45 ÷ 5 = 9.
        - |
          69 forgets the first and biggest part, 1,000 ÷ 5 = 200.
        - |
          1,340 is 1,345 − 5. Ravi split 1,345 into parts that are easy to divide by 5.
        - |
          Correct. Add the partial quotients: 200 + 60 + 9 = 269. Check: 5 × 269 = 1,345.
      answer: 3

    - slug: g4math-w20-q07
      type: numeric
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 6, Section C"
      points: 1
      prompt: |
        A baker has 434 muffins. She packs 7 muffins in each box. How many boxes does she fill?
      answer: { value: 62, tolerance: 0 }
      explanation: |
        434 ÷ 7. 7 × 60 = 420, leaving 14, and 7 × 2 = 14. 60 + 2 = 62 boxes, with none left over.

    - slug: g4math-w20-q08
      type: multiple_choice
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 6, Section C"
      points: 1
      prompt: |
        What is 59 ÷ 4?
      options:
        - "14"
        - "14 R 3"
        - "13 R 7"
        - "15 R 1"
      option_explanations:
        - |
          14 is the number of whole groups, but 4 × 14 = 56, so 3 are left. Write the remainder too.
        - |
          Correct. 4 × 14 = 56 and 59 − 56 = 3, so 59 ÷ 4 = 14 R 3.
        - |
          A remainder of 7 is more than 4, so another group of 4 fits. That makes 14 R 3.
        - |
          4 × 15 = 60, which is more than 59, so 15 groups of 4 do not fit.
      answer: 1

    - slug: g4math-w20-q09
      type: fill_blank
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 6, Section C"
      points: 1
      prompt: |
        In 59 ÷ 4 = 14 R 3, the amount left over, 3, is called the ____.
      answer: ["remainder", "the remainder", "remainders"]
      explanation: |
        Remainder. 14 groups of 4 use 56, and the 3 that are left over are the remainder.

    - slug: g4math-w20-q10
      type: multi_select
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 6, Section C"
      points: 2
      partial_credit: true
      prompt: |
        Which divisions have a remainder of 2? Select all that apply.
      options:
        - "50 ÷ 4"
        - "38 ÷ 6"
        - "45 ÷ 5"
        - "23 ÷ 3"
        - "29 ÷ 8"
      option_explanations:
        - |
          Remainder 2. 4 × 12 = 48 and 50 − 48 = 2, so 50 ÷ 4 = 12 R 2.
        - |
          Remainder 2. 6 × 6 = 36 and 38 − 36 = 2, so 38 ÷ 6 = 6 R 2.
        - |
          No remainder. 5 × 9 = 45 exactly, so 45 ÷ 5 = 9.
        - |
          Remainder 2. 3 × 7 = 21 and 23 − 21 = 2, so 23 ÷ 3 = 7 R 2.
        - |
          Remainder 5, not 2. 8 × 3 = 24 and 29 − 24 = 5, so 29 ÷ 8 = 3 R 5.
      answer: [0, 1, 3]

    - slug: g4math-w20-q11
      type: multiple_choice
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      prompt: |
        What is 43 × 21?
      options:
        - "803"
        - "863"
        - "903"
        - "64"
      option_explanations:
        - |
          803 is 40 × 20 + 3 × 1, only two of the four partial products. 3 × 20 = 60 and 40 × 1 = 40 are missing.
        - |
          863 leaves out one partial product, 40 × 1 = 40.
        - |
          Correct. 40 × 20 = 800, 3 × 20 = 60, 40 × 1 = 40 and 3 × 1 = 3. 800 + 60 + 40 + 3 = 903.
        - |
          64 is 43 + 21. Multiplying 43 by 21 makes a much bigger number.
      answer: 2

    - slug: g4math-w20-q12
      type: numeric
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 1
      prompt: |
        A movie lasts 2 hours 15 minutes. How many minutes long is the movie?
      answer: { value: 135, tolerance: 0 }
      explanation: |
        1 hour is 60 minutes, so 2 hours is 120 minutes. 120 + 15 = 135 minutes.

    - slug: g4math-w20-q13
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      prompt: |
        Which list shows all the factor pairs of 18?
      options:
        - "1 × 18, 2 × 9, 3 × 6"
        - "2 × 9, 3 × 6"
        - "1 × 18, 2 × 8, 3 × 6"
        - "1 × 18, 2 × 9, 3 × 6, 4 × 5"
      option_explanations:
        - |
          Correct. 1 × 18, 2 × 9 and 3 × 6 all make 18. 4 and 5 are not factors of 18, so there are no more pairs.
        - |
          This forgets 1 × 18. Every whole number has 1 and itself as a factor pair.
        - |
          2 × 8 is 16, not 18. The pair with 2 is 2 × 9.
        - |
          4 × 5 is 20, not 18. 18 cannot be split into 4 equal rows.
      answer: 0

    - slug: g4math-w20-q14
      type: short_answer
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 6, Section C"
      points: 2
      prompt: |
        Mr. Okafor has 157 crayons to share equally among 6 tables.

        (a) How many crayons does each table get, and how many are left over?
        (b) Show how you found it.
      answer: |
        (a) Each table gets 26 crayons, and 1 crayon is left over (157 ÷ 6 = 26 R 1).
        (b) 6 × 20 = 120, and 157 − 120 = 37. 6 × 6 = 36, and 37 − 36 = 1. 20 + 6 = 26, with 1 left. Check: 6 × 26 + 1 = 157.
      explanation: |
        Two points.

        (a) 1 pt: 26 each with 1 left over (26 R 1 is fine).

        (b) 1 pt: work that shows the division, such as partial quotients, an area diagram, sharing base-ten blocks, or a multiplication check (6 × 26 = 156, plus 1 is 157).
