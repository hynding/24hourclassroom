week: 17
unit: 6
title: "Number and Shape Patterns That Follow a Rule"
topics: ["4.OA.C.5"]
guide: guides/week-17.md
guide_description: |
  How to make a number pattern from a rule, find the rule of a pattern, describe growing and repeating shape
  patterns, and notice features the rule does not say, such as "every term is odd".
flashcards_description: |
  19 cards on pattern words (rule, term, feature), making terms from a rule, finding a rule, odd and even
  patterns, growing shape patterns and repeating patterns.

flashcards:
  - front: Pattern rule → what it is
    back: |
      An instruction that tells how to get from one term to the next, such as "start at 5 and add 4".
    topic_code: "4.OA.C.5"
  - front: Term of a pattern → what it is
    back: |
      Each number or shape in a pattern is a term. In 3, 7, 11, 15, the third term is 11.
    topic_code: "4.OA.C.5"
  - front: Rule "start at 2, add 5" → first five terms
    back: |
      2, 7, 12, 17, 22.
    topic_code: "4.OA.C.5"
  - front: Rule "start at 1, multiply by 3" → first five terms
    back: |
      1, 3, 9, 27, 81. Each term is 3 times the term before it.
    topic_code: "4.OA.C.5"
  - front: Rule "start at 100, subtract 8" → first four terms
    back: |
      100, 92, 84, 76.
    topic_code: "4.OA.C.5"
  - front: Pattern 6, 11, 16, 21 → its rule
    back: |
      Start at 6 and add 5. Check every pair: 11 − 6 = 5, 16 − 11 = 5, 21 − 16 = 5.
    topic_code: "4.OA.C.5"
  - front: Pattern 9, 16, ___, 30 → missing term
    back: |
      23. The rule is "add 7": 9 + 7 = 16, 16 + 7 = 23, 23 + 7 = 30.
    topic_code: "4.OA.C.5"
  - front: Pattern 3, 6, 12, 24 → next term
    back: |
      48. The rule is "multiply by 2" (double), and 24 × 2 = 48.
    topic_code: "4.OA.C.5"
  - front: Checking a pattern rule → how
    back: |
      Test it on every pair of neighbours, not only the first two. 2, 4, 8, 16 looks like "add 2" at first, but 4 to 8 is 4 more. The rule is "multiply by 2".
    topic_code: "4.OA.C.5"
  - front: Feature of a pattern → what it means
    back: |
      Something true about the terms that the rule does not say out loud, such as "every term ends in 0 or 5" or "the terms take turns odd and even".
    topic_code: "4.OA.C.5"
  - front: Odd start, add an even number → odd or even terms
    back: |
      Every term is odd, because odd + even = odd. Start at 3, add 4: 3, 7, 11, 15, 19.
    topic_code: "4.OA.C.5"
  - front: Even start, add an even number → odd or even terms
    back: |
      Every term is even, because even + even = even. Start at 2, add 6: 2, 8, 14, 20.
    topic_code: "4.OA.C.5"
  - front: Adding an odd number each time → odd or even terms
    back: |
      The terms take turns: odd, even, odd, even (or even, odd, even, odd). Start at 4, add 3: 4, 7, 10, 13.
    topic_code: "4.OA.C.5"
  - front: Rule "start at 5, add 5" → a feature
    back: |
      Every term ends in 5 or 0: 5, 10, 15, 20, 25. The terms are the multiples of 5.
    topic_code: "4.OA.C.5"
  - front: Growing shape pattern → how to describe it
    back: |
      Say what stays the same and what changes from step to step. In a plus sign that grows, the middle tile stays and each of the 4 arms gets 1 more tile, so each step adds 4 tiles.
    topic_code: "4.OA.C.5"
  - front: Rule "add 4" from 5 → the 10th term without listing
    back: |
      From the 1st term to the 10th term there are 9 jumps of 4, which is 36. 5 + 36 = 41.
    topic_code: "4.OA.C.5"
  - front: Repeating pattern → what it is
    back: |
      A pattern where the same group of shapes or numbers repeats again and again, like circle, triangle, square, circle, triangle, square.
    topic_code: "4.OA.C.5"
  - front: Repeating group of 3 shapes → which shape is at 3, 6, 9, 12
    back: |
      The last shape of the group. 3, 6, 9 and 12 are multiples of 3, and every group of 3 ends there.
    topic_code: "4.OA.C.5"
  - front: Repeating group of 4 shapes → which shape is 21st
    back: |
      The 1st shape of the group. The 20th shape ends a group (20 is a multiple of 4), so the 21st starts a new one.
    topic_code: "4.OA.C.5"

quiz:
  description: |
    14 questions · about 25 minutes · making patterns from a rule, finding a rule, growing and repeating shape
    patterns and odd-and-even features, plus review of subtracting, converting units and "times as many".
    Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word is matched
    automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w17-q01
      type: multiple_choice
      topic_code: "4.OA.C.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section A"
      points: 1
      stimulus: |
        Use the picture. Amara builds plus signs out of square tiles. Each step follows the same rule.
      figure: figures/w17-plus-pattern.svg
      figure_alt: "Three plus signs made of square tiles, labeled Step 1, Step 2 and Step 3. Each has one green tile in the middle and four blue arms. In Step 1 each arm is 1 tile long, 5 tiles in all. In Step 2 each arm is 2 tiles long, 9 tiles in all. In Step 3 each arm is 3 tiles long, 13 tiles in all."
      prompt: |
        How many tiles will Step 4 have?
      options:
        - "16"
        - "13"
        - "21"
        - "17"
      option_explanations:
        - |
          16 counts 4 arms of 4 tiles but forgets the green tile in the middle. Add 1 more to get 17.
        - |
          13 is the number of tiles in Step 3. Each new step adds 1 tile to each of the 4 arms.
        - |
          21 adds 8 tiles instead of 4. Each step adds only 1 tile to each arm, so 4 tiles in all.
        - |
          Correct. The steps have 5, 9 and 13 tiles, so the rule is "add 4". 13 + 4 = 17.
      answer: 3

    - slug: g4math-w17-q02
      type: numeric
      topic_code: "4.OA.C.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section A"
      points: 1
      stimulus: |
        Use the picture. Amara builds plus signs out of square tiles. Each step follows the same rule.
      prompt: |
        How many tiles will Step 10 have?
      answer: { value: 41, tolerance: 0 }
      explanation: |
        Step 10 has 4 arms of 10 tiles plus the middle tile: 4 × 10 + 1 = 41. You can also count on from Step 1: 9 more jumps of 4 is 36, and 5 + 36 = 41.

    - slug: g4math-w17-q03
      type: true_false
      topic_code: "4.OA.C.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section A"
      points: 1
      stimulus: |
        Use the picture. Amara builds plus signs out of square tiles. Each step follows the same rule.
      prompt: |
        True or false: one of the steps in this pattern will use exactly 30 tiles.
      answer: false
      explanation: |
        False. The steps have 5, 9, 13, 17 ... tiles. The pattern starts odd and adds 4, an even number, so every step has an odd number of tiles. 30 is even, so no step has 30 tiles.

    - slug: g4math-w17-q04
      type: multiple_choice
      topic_code: "4.OA.C.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section A"
      points: 1
      stimulus: |
        Use the picture. The shapes repeat in the same order forever: circle, triangle, square.
      figure: figures/w17-repeating-shapes.svg
      figure_alt: "A row of 9 shapes with their positions 1 to 9 written under them. The shapes go blue circle, red triangle, green square, then repeat: circle at 1, 4 and 7; triangle at 2, 5 and 8; square at 3, 6 and 9."
      prompt: |
        Which position will show a triangle?
      options:
        - "14"
        - "15"
        - "13"
        - "18"
      option_explanations:
        - |
          Correct. 12 is a multiple of 3, so position 12 is a square and a new group starts at 13. Then 13 is a circle and 14 is a triangle.
        - |
          15 is a multiple of 3, so position 15 ends a group of three. That is a square, like positions 3, 6 and 9.
        - |
          13 comes right after 12, a square, so it starts a new group. Position 13 is a circle, like 1, 4 and 7.
        - |
          18 is a multiple of 3, so position 18 ends a group of three. That is a square, not a triangle.
      answer: 0

    - slug: g4math-w17-q05
      type: multi_select
      topic_code: "4.OA.C.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section A"
      points: 2
      partial_credit: true
      stimulus: |
        Use the picture. The shapes repeat in the same order forever: circle, triangle, square.
      prompt: |
        Which positions will show a square? Select all that apply.
      options:
        - "21"
        - "24"
        - "25"
        - "30"
        - "32"
      option_explanations:
        - |
          Square. 21 is a multiple of 3 (3 × 7 = 21), and every multiple of 3 ends a group with a square.
        - |
          Square. 24 is a multiple of 3 (3 × 8 = 24), so it is the last shape of a group.
        - |
          Not a square. 24 is a square, so 25 starts a new group with a circle.
        - |
          Square. 30 is a multiple of 3 (3 × 10 = 30), so it ends a group.
        - |
          Not a square. 30 is a square, 31 is a circle and 32 is a triangle.
      answer: [0, 1, 3]

    - slug: g4math-w17-q06
      type: multiple_choice
      topic_code: "4.OA.C.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section A"
      points: 1
      prompt: |
        A pattern starts at 7, and the rule is "add 6". What is the 5th term?
      options:
        - "37"
        - "31"
        - "25"
        - "30"
      option_explanations:
        - |
          37 is the 6th term. Count again: 7 is the 1st term, so 13, 19, 25 and 31 are the 2nd to 5th.
        - |
          Correct. The terms are 7, 13, 19, 25, 31. The 5th term is 31.
        - |
          25 is the 4th term. One more jump of 6 gives the 5th term.
        - |
          30 is 5 × 6. The pattern starts at 7, not 0, so add the jumps of 6 to 7.
      answer: 1

    - slug: g4math-w17-q07
      type: numeric
      topic_code: "4.OA.C.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section A"
      points: 1
      prompt: |
        A pattern starts at 90, and the rule is "subtract 7". What is the 4th term?
      answer: { value: 69, tolerance: 0 }
      explanation: |
        The terms are 90, 83, 76, 69. The 4th term is 69.

    - slug: g4math-w17-q08
      type: multiple_choice
      topic_code: "4.OA.C.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section A"
      points: 1
      prompt: |
        Which rule makes the pattern 4, 12, 36, 108?
      options:
        - "Start at 4 and add 8."
        - "Start at 4 and add 3."
        - "Start at 4 and multiply by 3."
        - "Start at 4 and multiply by 4."
      option_explanations:
        - |
          Adding 8 works from 4 to 12, but 12 + 8 is 20, not 36. Test a rule on every pair of terms.
        - |
          4 + 3 is 7, not 12. The terms grow much faster than 3 each time.
        - |
          Correct. 4 × 3 = 12, 12 × 3 = 36 and 36 × 3 = 108. The rule works for every pair.
        - |
          4 × 4 is 16, not 12. Each term is 3 times the term before it.
      answer: 2

    - slug: g4math-w17-q09
      type: fill_blank
      topic_code: "4.OA.C.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section A"
      points: 1
      prompt: |
        Each number in a pattern, like 11 in the pattern 3, 7, 11, 15, is called a ____.
      answer: ["term", "terms", "a term", "the term"]
      explanation: |
        Term. 11 is the 3rd term of the pattern 3, 7, 11, 15.

    - slug: g4math-w17-q10
      type: multiple_choice
      topic_code: "4.OA.C.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section A"
      points: 1
      prompt: |
        Mila's pattern starts at 3, and the rule is "add 4". Which sentence about her pattern is true?
      options:
        - "Every term is even."
        - "The terms take turns odd and even."
        - "Every term is a multiple of 4."
        - "Every term is odd."
      option_explanations:
        - |
          The first term, 3, is already odd. An odd number plus 4 stays odd, so no term is even.
        - |
          Terms only take turns when you add an odd number. Mila adds 4, an even number, so they stay odd.
        - |
          3 is not a multiple of 4, and adding 4 keeps every term 3 more than a multiple of 4: 3, 7, 11, 15.
        - |
          Correct. The terms are 3, 7, 11, 15, 19 ... An odd number plus an even number is odd, every time.
      answer: 3

    - slug: g4math-w17-q11
      type: multiple_choice
      topic_code: "4.NBT.B.4"
      source: "IM K–5 Math Grade 4, Unit 4, Section D"
      points: 1
      prompt: |
        What is 6,045 − 2,378?
      options:
        - "3,667"
        - "4,333"
        - "3,767"
        - "8,423"
      option_explanations:
        - |
          Correct. Regroup a thousand into 10 hundreds, a hundred into 10 tens and a ten into 10 ones. Check: 2,378 + 3,667 = 6,045.
        - |
          4,333 takes the smaller digit from the bigger one in each place. 5 − 8 needs regrouping, not 8 − 5.
        - |
          3,767 forgets that one of the 10 hundreds was regrouped into tens. Only 9 hundreds are left, and 9 − 3 = 6.
        - |
          8,423 is 6,045 + 2,378. The problem asks you to subtract.
      answer: 0

    - slug: g4math-w17-q12
      type: numeric
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 1
      prompt: |
        A jump rope is 3 meters long. How many centimeters long is it?
      answer: { value: 300, tolerance: 0 }
      explanation: |
        1 meter is 100 centimeters, so 3 meters is 3 × 100 = 300 centimeters.

    - slug: g4math-w17-q13
      type: multiple_choice
      topic_code: "4.OA.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section A"
      points: 1
      prompt: |
        A maple tree is 4 times as tall as a rose bush. The rose bush is 9 feet tall. How tall is the maple tree?
      options:
        - "13 feet"
        - "36 feet"
        - "5 feet"
        - "45 feet"
      option_explanations:
        - |
          13 is 9 + 4. "4 times as tall" means 4 copies of the bush's height, so multiply.
        - |
          Correct. 4 times as tall as 9 feet is 4 × 9 = 36 feet.
        - |
          5 is 9 − 4. The tree is taller than the bush, and "times as tall" means multiply.
        - |
          45 is 5 × 9, the tree and the bush stacked together. The question asks for the tree only: 4 × 9.
      answer: 1

    - slug: g4math-w17-q14
      type: short_answer
      topic_code: "4.OA.C.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section A"
      points: 2
      prompt: |
        A pattern starts at 2, and the rule is "add 6".

        (a) Write the first five terms.
        (b) Kiran says every term in this pattern will be even. Is he right? Explain why.
      answer: |
        (a) 2, 8, 14, 20, 26.
        (b) Yes. The pattern starts at an even number, and adding an even number (6) to an even number always makes an even number. So every term stays even.
      explanation: |
        Two points.

        (a) 1 pt: 2, 8, 14, 20, 26, all five correct.

        (b) 1 pt: says Kiran is right and gives a reason about even numbers, such as "even plus even is even" or "6 is even, so the terms stay even". Only listing more even terms, with no reason, earns no point.
