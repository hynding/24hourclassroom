week: 21
unit: 6
title: "Multistep Problems, Remainders and Estimates"
topics: ["4.OA.A.3"]
guide: guides/week-21.md
guide_description: |
  How to solve word problems that take more than one step, write an equation with a letter for the unknown,
  decide what a remainder means in a story, and use an estimate to tell whether an answer makes sense.
flashcards_description: |
  18 cards on planning a multistep problem, letters for unknowns, the four ways to handle a remainder, tape
  diagrams and checking answers with estimates.

flashcards:
  - front: Multistep problem → what it is
    back: |
      A word problem that needs two or more calculations, where the answer to one step is used in the next.
    topic_code: "4.OA.A.3"
  - front: Solving a multistep problem → four steps
    back: |
      1. Read and say what the question asks. 2. Plan the steps. 3. Solve each step. 4. Check that the answer makes sense.
    topic_code: "4.OA.A.3"
  - front: Letter for the unknown → what it does
    back: |
      It stands for the number you are looking for. "3 packs of 24 cards, 15 given away": n = 3 × 24 − 15.
    topic_code: "4.OA.A.3"
  - front: n = 3 × 24 − 15 → value of n
    back: |
      Multiply first: 3 × 24 = 72. Then 72 − 15 = 57.
    topic_code: "4.OA.A.3"
  - front: Remainder that means "round up" → when
    back: |
      When everyone or everything must fit. 139 people in vans of 8: 17 R 3, so 18 vans are needed for the last 3 people.
    topic_code: "4.OA.A.3"
  - front: Remainder that means "drop it" → when
    back: |
      When only full groups count. 52 bars in bags of 6: 8 R 4, so 8 full bags. The 4 extra bars do not make a bag.
    topic_code: "4.OA.A.3"
  - front: Remainder as the answer → when
    back: |
      When the question asks what is left. 52 bars in bags of 6: 4 bars are left over.
    topic_code: "4.OA.A.3"
  - front: Remainder that is shared or split → when
    back: |
      When the leftover can be cut. 3 friends share 7 pizzas: 2 each, and the last pizza is cut into thirds, so each gets 2 1/3.
    topic_code: "4.OA.A.3"
  - front: "R in an answer → how to write it"
    back: |
      Write the leftover after R, as in 17 R 3, or explain it in words: "17 full vans and 3 people left."
    topic_code: "4.OA.A.3"
  - front: Tape diagram for a multistep problem → how it helps
    back: |
      It shows the known parts and the unknown part. 4 equal parts of 125 and an unknown part make 650, so the unknown is 650 − 500 = 150.
    topic_code: "4.OA.A.3"
  - front: Estimate in a word problem → what it is
    back: |
      A number close to the exact answer, found by rounding to friendly numbers. 289 + 312 is about 300 + 300 = 600.
    topic_code: "4.OA.A.3"
  - front: Checking with an estimate → example
    back: |
      Someone says 38 × 21 = 7,980. Estimate: 40 × 20 = 800. 7,980 is ten times too big, so it is wrong. (It is 798.)
    topic_code: "4.OA.A.3"
  - front: Order in 6 × 48 − 135 → which step first
    back: |
      Multiply first, then subtract: 6 × 48 = 288, and 288 − 135 = 153.
    topic_code: "4.OA.A.3"
  - front: '"How many more are needed" → which operation'
    back: |
      Subtract what you have from the goal, or count up from what you have to the goal.
    topic_code: "4.OA.A.3"
  - front: '"Each" and "in all" in one problem → what they usually mean'
    back: |
      Equal groups. "8 seats in each van" and "how many seats in all" point to multiplication; "how many vans" points to division.
    topic_code: "4.OA.A.3"
  - front: Money in a multistep problem → an example
    back: |
      6 tickets at $4 and 4 snacks at $3: 24 + 12 = $36. Paying with $50 leaves $50 − $36 = $14 change.
    topic_code: "4.OA.A.3"
  - front: Answer that does not make sense → signs to look for
    back: |
      A part bigger than the whole, a fraction of a bus or a person, or an answer far from your estimate.
    topic_code: "4.OA.A.3"
  - front: Label an answer → why
    back: |
      Writing "18 vans" or "$14" shows what the number counts and helps you see whether it answers the question.
    topic_code: "4.OA.A.3"

quiz:
  description: |
    15 questions · about 30 minutes · multistep word problems with whole numbers, letters for unknowns, what
    a remainder means in a story and estimating to check, plus review of dividing, multiplying, rounding and
    patterns. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word
    is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w21-q01
      type: numeric
      topic_code: "4.OA.A.3"
      source: "IM K–5 Math Grade 4, Unit 6, Section D"
      points: 1
      stimulus: |
        Use the tape diagram. A class wants to collect 650 cans of food. From Monday to Thursday they collected 125 cans each day.
      figure: figures/w21-cans-tape.svg
      figure_alt: "A tape diagram. A bracket over the whole tape says Goal: 650 cans. The tape has four equal parts labeled 125, marked Monday to Thursday underneath, and a fifth part with a bold question mark, marked Still needed."
      prompt: |
        How many more cans does the class need to reach its goal?
      answer: { value: 150, tolerance: 0 }
      explanation: |
        Step 1: 4 × 125 = 500 cans collected. Step 2: 650 − 500 = 150 cans still needed.

    - slug: g4math-w21-q02
      type: multiple_choice
      topic_code: "4.OA.A.3"
      source: "IM K–5 Math Grade 4, Unit 6, Section D"
      points: 1
      stimulus: |
        Use the tape diagram. A class wants to collect 650 cans of food. From Monday to Thursday they collected 125 cans each day.
      prompt: |
        Let c stand for the cans still needed. Which equation matches the tape diagram?
      options:
        - "4 + 125 + c = 650"
        - "4 × 125 + c = 650"
        - "125 + c = 650"
        - "650 × 4 = c"
      option_explanations:
        - |
          This adds the 4 days as if they were 4 cans. The diagram shows 4 parts of 125, which is 4 × 125.
        - |
          Correct. Four parts of 125 and the unknown part c together make the whole tape, 650.
        - |
          This shows only one day of 125 cans. The tape has four parts of 125.
        - |
          The goal is the whole tape. The unknown is one part of it, so it must be less than 650.
      answer: 1

    - slug: g4math-w21-q03
      type: multiple_choice
      topic_code: "4.OA.A.3"
      source: "IM K–5 Math Grade 4, Unit 6, Section D"
      points: 1
      stimulus: |
        Use the table. It shows the plan for a fourth-grade field trip.
      figure: figures/w21-trip-table.svg
      figure_alt: "A table titled Field trip plan. Students going: 127. Adults going: 12. Seats in each van: 8. Cost of one ticket: $6."
      prompt: |
        How many vans are needed so that every student and every adult has a seat?
      options:
        - "17"
        - "16"
        - "3"
        - "18"
      option_explanations:
        - |
          17 vans hold 17 × 8 = 136 people, so 3 people would have no seat. The remainder means one more van.
        - |
          16 vans would be enough for the 127 students alone, but the 12 adults need seats too.
        - |
          3 is the remainder: the people left after 17 full vans. They still need a van.
        - |
          Correct. 127 + 12 = 139 people. 139 ÷ 8 = 17 R 3, and the last 3 people need an 18th van.
      answer: 3

    - slug: g4math-w21-q04
      type: numeric
      topic_code: "4.OA.A.3"
      source: "IM K–5 Math Grade 4, Unit 6, Section D"
      points: 1
      stimulus: |
        Use the table. It shows the plan for a fourth-grade field trip.
      prompt: |
        Every student and every adult needs a ticket. How many dollars do all the tickets cost?
      answer: { value: 834, tolerance: 0 }
      explanation: |
        Step 1: 127 + 12 = 139 people. Step 2: 139 × 6 = 600 + 180 + 54 = $834.

    - slug: g4math-w21-q05
      type: multiple_choice
      topic_code: "4.OA.A.3"
      source: "IM K–5 Math Grade 4, Unit 6, Section D"
      points: 1
      prompt: |
        Coach Tran packs 52 granola bars into bags of 6. How many bags can she fill all the way?
      options:
        - "8"
        - "9"
        - "4"
        - "58"
      option_explanations:
        - |
          Correct. 52 ÷ 6 = 8 R 4. 8 bags are full, and the 4 extra bars are not enough for another full bag.
        - |
          9 bags would need 9 × 6 = 54 bars. The question asks for full bags, so the remainder is dropped.
        - |
          4 is the remainder, the bars left over. The question asks how many full bags.
        - |
          58 is 52 + 6. Packing into bags of 6 is division.
      answer: 0

    - slug: g4math-w21-q06
      type: true_false
      topic_code: "4.OA.A.3"
      source: "IM K–5 Math Grade 4, Unit 6, Section D"
      points: 1
      prompt: |
        True or false: when 3 friends share 47 stickers equally, each friend can get 16 stickers.
      answer: false
      explanation: |
        False. 3 × 16 = 48, which is 1 more than 47. 47 ÷ 3 = 15 R 2, so each friend gets 15 stickers and 2 are left over.

    - slug: g4math-w21-q07
      type: multiple_choice
      topic_code: "4.NBT.A.3"
      source: "IM K–5 Math Grade 4, Unit 4, Section C"
      points: 1
      prompt: |
        Lucia read 289 pages in March and 312 pages in April. Round each number to the nearest hundred to estimate how many pages she read in all.
      options:
        - "500"
        - "700"
        - "600"
        - "60"
      option_explanations:
        - |
          500 rounds 289 down to 200. 289 is closer to 300, because its tens and ones, 89, are past 50.
        - |
          700 rounds 312 up to 400. 312 is closer to 300, because 12 is less than 50.
        - |
          Correct. 289 rounds to 300 and 312 rounds to 300. 300 + 300 = 600. (The exact total is 601.)
        - |
          60 is ten times too small. 3 hundreds + 3 hundreds = 6 hundreds = 600.
      answer: 2

    - slug: g4math-w21-q08
      type: numeric
      topic_code: "4.OA.A.3"
      source: "IM K–5 Math Grade 4, Unit 6, Section D"
      points: 1
      prompt: |
        A farm stand has 6 crates with 48 apples in each crate. They sell 135 apples. How many apples are left?
      answer: { value: 153, tolerance: 0 }
      explanation: |
        Step 1: 6 × 48 = 240 + 48 = 288 apples. Step 2: 288 − 135 = 153 apples left.

    - slug: g4math-w21-q09
      type: multiple_choice
      topic_code: "4.OA.A.3"
      source: "IM K–5 Math Grade 4, Unit 6, Section D"
      points: 1
      prompt: |
        Tomás has 3 packs of trading cards with 24 cards in each pack. He gives away 15 cards. Which equation finds n, the number of cards he has left?
      options:
        - "n = 3 × 24 − 15"
        - "n = 3 + 24 − 15"
        - "n = 3 × 24 + 15"
        - "n = 24 − 15"
      option_explanations:
        - |
          Correct. 3 × 24 is the cards he starts with, and he takes away the 15 he gives away. n = 72 − 15 = 57.
        - |
          3 packs of 24 is 3 × 24, not 3 + 24. Adding treats the 3 packs like 3 cards.
        - |
          Giving cards away makes fewer cards, so subtract the 15, not add it.
        - |
          This uses only one pack. Tomás has 3 packs, so start with 3 × 24.
      answer: 0

    - slug: g4math-w21-q10
      type: fill_blank
      topic_code: "4.OA.A.3"
      source: "IM K–5 Math Grade 4, Unit 6, Section D"
      points: 1
      prompt: |
        A number close to the exact answer, found by rounding, is called an ____.
      answer: ["estimate", "estimates", "estimation"]
      explanation: |
        Estimate. Rounding 289 + 312 to 300 + 300 gives the estimate 600, close to the exact answer, 601.

    - slug: g4math-w21-q11
      type: multi_select
      topic_code: "4.OA.A.3"
      source: "IM K–5 Math Grade 4, Unit 6, Section D"
      points: 2
      partial_credit: true
      prompt: |
        Which problems have the answer 9? Select all that apply.
      options:
        - "58 students ride in vans that hold 7 students each. How many vans are needed?"
        - "64 crayons go in boxes of 7. How many boxes are full?"
        - "40 muffins go on plates of 5. How many plates are used?"
        - "75 beads are shared equally by 8 kids. How many beads does each kid get?"
        - "30 kids make teams of 4. How many full teams are there?"
      option_explanations:
        - |
          Answer 9. 58 ÷ 7 = 8 R 2, and the last 2 students need a van too, so 9 vans.
        - |
          Answer 9. 64 ÷ 7 = 9 R 1. 9 boxes are full and 1 crayon is left over.
        - |
          Answer 8, not 9. 40 ÷ 5 = 8 with nothing left over.
        - |
          Answer 9. 75 ÷ 8 = 9 R 3, so each kid gets 9 beads and 3 are left over.
        - |
          Answer 7, not 9. 30 ÷ 4 = 7 R 2, so there are 7 full teams.
      answer: [0, 1, 3]

    - slug: g4math-w21-q12
      type: multiple_choice
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 6, Section C"
      points: 1
      prompt: |
        What is 2,016 ÷ 8?
      options:
        - "202"
        - "252"
        - "52"
        - "2,008"
      option_explanations:
        - |
          202 leaves out a chunk. 1,600 ÷ 8 = 200 and 16 ÷ 8 = 2, but 400 is still left: 400 ÷ 8 = 50.
        - |
          Correct. 1,600 ÷ 8 = 200, 400 ÷ 8 = 50 and 16 ÷ 8 = 2. 200 + 50 + 2 = 252. Check: 8 × 252 = 2,016.
        - |
          52 forgets the biggest chunk, 1,600 ÷ 8 = 200.
        - |
          2,008 is 2,016 − 8. Dividing by 8 asks how many groups of 8 are in 2,016.
      answer: 1

    - slug: g4math-w21-q13
      type: numeric
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      prompt: |
        What is 27 × 43? (Type the digits without a comma.)
      answer: { value: 1161, tolerance: 0 }
      explanation: |
        20 × 40 = 800, 7 × 40 = 280, 20 × 3 = 60 and 7 × 3 = 21. 800 + 280 + 60 + 21 = 1,161.

    - slug: g4math-w21-q14
      type: multiple_choice
      topic_code: "4.OA.C.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section A"
      points: 1
      prompt: |
        A pattern starts at 1, and the rule is "multiply by 2". What is the 6th term?
      options:
        - "16"
        - "11"
        - "32"
        - "64"
      option_explanations:
        - |
          16 is the 5th term. Double it once more for the 6th term.
        - |
          11 comes from adding 2 each time: 1, 3, 5, 7, 9, 11. The rule says multiply by 2.
        - |
          Correct. The terms are 1, 2, 4, 8, 16, 32. The 6th term is 32.
        - |
          64 is the 7th term. Count again: 1 is the 1st term and 32 is the 6th.
      answer: 2

    - slug: g4math-w21-q15
      type: short_answer
      topic_code: "4.OA.A.3"
      source: "IM K–5 Math Grade 4, Unit 6, Section D"
      points: 2
      prompt: |
        The art club has $90 to spend. Paint sets cost $8 each.

        (a) How many paint sets can the club buy?
        (b) How much money will be left? Explain how the remainder tells you.
      answer: |
        (a) 11 paint sets.
        (b) $2. 90 ÷ 8 = 11 R 2. Eleven sets cost 11 × 8 = $88, and $90 − $88 = $2. The remainder is the money left, which is not enough for a 12th set.
      explanation: |
        Two points.

        (a) 1 pt: 11 paint sets (not 12: a 12th set would cost $96, more than $90).

        (b) 1 pt: $2 left, with a reason that links it to the remainder or to 11 × 8 = 88 and 90 − 88 = 2.
