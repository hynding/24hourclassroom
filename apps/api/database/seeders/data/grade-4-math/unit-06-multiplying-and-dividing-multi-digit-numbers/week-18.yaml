week: 18
unit: 6
title: "Multiplying by a One-Digit Number"
topics: ["4.NBT.B.5"]
guide: guides/week-18.md
guide_description: |
  How to multiply a number with up to four digits by a one-digit number: split it by place value, draw an
  area diagram, write the partial products, add them, and check the answer with an estimate.
flashcards_description: |
  18 cards on multiplying by a multiple of 10, 100 or 1,000, area diagrams, partial products, splitting a
  number by place value and estimating a product.

flashcards:
  - front: 6 × 40 → product using tens
    back: |
      40 is 4 tens. 6 × 4 tens = 24 tens = 240.
    topic_code: "4.NBT.B.5"
  - front: 7 × 300 → product using hundreds
    back: |
      300 is 3 hundreds. 7 × 3 hundreds = 21 hundreds = 2,100.
    topic_code: "4.NBT.B.5"
  - front: 5 × 6,000 → product using thousands
    back: |
      6,000 is 6 thousands. 5 × 6 thousands = 30 thousands = 30,000.
    topic_code: "4.NBT.B.5"
  - front: 8 × 50 → a product with an extra zero
    back: |
      400. 8 × 5 tens = 40 tens = 400. The fact 8 × 5 = 40 already ends in 0, so 400 has two zeros.
    topic_code: "4.NBT.B.5"
  - front: Expanded form → how it helps you multiply
    back: |
      It splits a number by place value. 326 = 300 + 20 + 6, so 4 × 326 = 4 × 300 + 4 × 20 + 4 × 6.
    topic_code: "4.NBT.B.5"
  - front: Area diagram for 4 × 326 → what it looks like
    back: |
      A rectangle with one side 4 and the other side split into 300, 20 and 6. The parts have areas 1,200, 80 and 24.
    topic_code: "4.NBT.B.5"
  - front: Partial product → what it is
    back: |
      The product of one part. For 4 × 326 the partial products are 4 × 300 = 1,200, 4 × 20 = 80 and 4 × 6 = 24.
    topic_code: "4.NBT.B.5"
  - front: Partial products → the last step
    back: |
      Add them all. 1,200 + 80 + 24 = 1,304, so 4 × 326 = 1,304.
    topic_code: "4.NBT.B.5"
  - front: 3 × 52 → by partial products
    back: |
      3 × 50 = 150 and 3 × 2 = 6. 150 + 6 = 156.
    topic_code: "4.NBT.B.5"
  - front: 7 × 68 → by partial products
    back: |
      7 × 60 = 420 and 7 × 8 = 56. 420 + 56 = 476.
    topic_code: "4.NBT.B.5"
  - front: 5 × 418 → by partial products
    back: |
      5 × 400 = 2,000, 5 × 10 = 50, 5 × 8 = 40. 2,000 + 50 + 40 = 2,090.
    topic_code: "4.NBT.B.5"
  - front: 2 × 3,415 → by partial products
    back: |
      2 × 3,000 = 6,000, 2 × 400 = 800, 2 × 10 = 20, 2 × 5 = 10. The total is 6,830.
    topic_code: "4.NBT.B.5"
  - front: A zero in the middle, like 6 × 507 → what to do
    back: |
      The 0 tens make a partial product of 0. 6 × 500 = 3,000 and 6 × 7 = 42, so 6 × 507 = 3,042.
    topic_code: "4.NBT.B.5"
  - front: Multiplying only the first part → the mistake
    back: |
      4 × 326 is not 4 × 300 + 26. Every part of 326 must be multiplied by 4.
    topic_code: "4.NBT.B.5"
  - front: Losing place value, like 4 × 300 = 12 → the mistake
    back: |
      4 × 3 = 12, but 4 × 3 hundreds = 12 hundreds = 1,200. Keep each digit's value.
    topic_code: "4.NBT.B.5"
  - front: Estimating 6 × 712 → how
    back: |
      Round 712 to 700. 6 × 700 = 4,200, so the answer is a little more than 4,200. (It is 4,272.)
    topic_code: "4.NBT.B.5"
  - front: Why estimate a product → reason
    back: |
      To check that your answer is about the right size. If 8 × 395 came out near 300 or 30,000, something went wrong: it should be near 8 × 400 = 3,200.
    topic_code: "4.NBT.B.5"
  - front: 9 × 25 → a friendly way
    back: |
      9 × 25 is 10 × 25 minus one 25. 250 − 25 = 225.
    topic_code: "4.NBT.B.5"

quiz:
  description: |
    15 questions · about 25 minutes · multiplying two-, three- and four-digit numbers by a one-digit number
    with area diagrams and partial products, and estimating products, plus review of patterns, rounding, money
    and "times as many". Multiple choice, select-all, true/false and number answers are graded at once; the
    fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w18-q01
      type: numeric
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      stimulus: |
        Use the area diagram. It shows 4 × 326 split into three parts.
      figure: figures/w18-area-4x326.svg
      figure_alt: "A rectangle with its left side labeled 4. Its top is split into three parts labeled 300, 20 and 6. The parts have 1,200, a bold question mark, and 24 written inside them."
      prompt: |
        What number belongs in the part with the question mark?
      answer: { value: 80, tolerance: 0 }
      explanation: |
        That part is 4 by 20. 4 × 20 = 4 × 2 tens = 8 tens = 80.

    - slug: g4math-w18-q02
      type: multiple_choice
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      stimulus: |
        Use the area diagram. It shows 4 × 326 split into three parts.
      prompt: |
        What is 4 × 326?
      options:
        - "224"
        - "1,280"
        - "1,304"
        - "330"
      option_explanations:
        - |
          224 uses 4 × 300 = 120. But 4 × 3 hundreds is 12 hundreds, which is 1,200, as the diagram shows.
        - |
          1,280 adds 1,200 and 80 but leaves out the last part, 4 × 6 = 24.
        - |
          Correct. Add the three parts: 1,200 + 80 + 24 = 1,304.
        - |
          330 is 4 + 326. The diagram shows 4 rows of 326, so multiply.
      answer: 2

    - slug: g4math-w18-q03
      type: true_false
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      stimulus: |
        Use the area diagram. It shows 4 × 326 split into three parts.
      prompt: |
        True or false: 4 × 326 is equal to 4 × 300 + 4 × 20 + 4 × 6.
      answer: true
      explanation: |
        True. 326 = 300 + 20 + 6. Multiplying each part by 4 and adding gives the same answer as multiplying the whole number, which is what the three parts of the diagram show.

    - slug: g4math-w18-q04
      type: numeric
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      stimulus: |
        Use the picture. Jada used partial products to find 3 × 2,148. One partial product is hidden by a question mark.
      figure: figures/w18-partial-products.svg
      figure_alt: "Jada's work, written in a column. 2,148 times 3, then a line, then four partial products: 24 labeled 3 × 8, 120 labeled 3 × 40, a bold question mark labeled 3 × 100, and 6,000 labeled 3 × 2,000."
      prompt: |
        What is 3 × 2,148? (Type the digits without a comma.)
      answer: { value: 6444, tolerance: 0 }
      explanation: |
        The hidden partial product is 3 × 100 = 300. Add all four: 24 + 120 + 300 + 6,000 = 6,444.

    - slug: g4math-w18-q05
      type: multiple_choice
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      stimulus: |
        Use the picture. Jada used partial products to find 3 × 2,148. One partial product is hidden by a question mark.
      prompt: |
        Which number is hidden by the question mark?
      options:
        - "30"
        - "300"
        - "3,000"
        - "100"
      option_explanations:
        - |
          30 is 3 × 10. The 1 in 2,148 is in the hundreds place, so it stands for 100.
        - |
          Correct. The line says 3 × 100, and 3 × 1 hundred = 3 hundreds = 300.
        - |
          3,000 is 3 × 1,000. The 1 in 2,148 is 1 hundred, not 1 thousand.
        - |
          100 is the part of 2,148 being multiplied. The partial product is 3 times that.
      answer: 1

    - slug: g4math-w18-q06
      type: numeric
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      prompt: |
        A school orders 8 boxes of pencils. Each box holds 144 pencils. How many pencils does the school order? (Type the digits without a comma.)
      answer: { value: 1152, tolerance: 0 }
      explanation: |
        8 × 144 = 8 × 100 + 8 × 40 + 8 × 4 = 800 + 320 + 32 = 1,152 pencils.

    - slug: g4math-w18-q07
      type: multiple_choice
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      prompt: |
        Which expression is equal to 5 × 473?
      options:
        - "5 × 400 + 70 + 3"
        - "5 × 4 + 5 × 7 + 5 × 3"
        - "5 + 400 + 70 + 3"
        - "5 × 400 + 5 × 70 + 5 × 3"
      option_explanations:
        - |
          This multiplies only the 400 by 5. The 70 and the 3 must be multiplied by 5 too.
        - |
          This uses the digits 4, 7 and 3 but forgets what they are worth: 4 hundreds and 7 tens.
        - |
          This adds 5 instead of multiplying. 5 × 473 means 5 groups of 473.
        - |
          Correct. 473 = 400 + 70 + 3, and each part is multiplied by 5. The total is 2,000 + 350 + 15 = 2,365.
      answer: 3

    - slug: g4math-w18-q08
      type: multiple_choice
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      prompt: |
        Which is the best estimate for 6 × 712?
      options:
        - "4,200"
        - "420"
        - "42,000"
        - "718"
      option_explanations:
        - |
          Correct. 712 is close to 700, and 6 × 700 = 6 × 7 hundreds = 42 hundreds = 4,200.
        - |
          420 is 6 × 70. 712 is about 7 hundreds, not 7 tens.
        - |
          42,000 is 6 × 7,000. 712 is about 7 hundreds, not 7 thousands.
        - |
          718 is 6 + 712. An estimate of a product still multiplies.
      answer: 0

    - slug: g4math-w18-q09
      type: fill_blank
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      prompt: |
        In 6 × 245 = 1,200 + 240 + 30, the numbers 1,200, 240 and 30 are called partial ____.
      answer: ["products", "product"]
      explanation: |
        Partial products. Each one is 6 times one part of 245: 6 × 200 = 1,200, 6 × 40 = 240 and 6 × 5 = 30. Together they make 1,470.

    - slug: g4math-w18-q10
      type: multi_select
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which of these are equal to 9 × 36? Select all that apply.
      options:
        - "9 × 30 + 9 × 6"
        - "270 + 54"
        - "9 × 30 + 6"
        - "324"
        - "9 × 3 + 9 × 6"
      option_explanations:
        - |
          Equal. 36 = 30 + 6, and both parts are multiplied by 9.
        - |
          Equal. 9 × 30 = 270 and 9 × 6 = 54, so this is the same sum written as numbers.
        - |
          Not equal. The 6 was never multiplied by 9. This is 270 + 6 = 276.
        - |
          Equal. 270 + 54 = 324, and that is the value of 9 × 36.
        - |
          Not equal. The 3 in 36 means 3 tens, so it should be 9 × 30. This is only 27 + 54 = 81.
      answer: [0, 1, 3]

    - slug: g4math-w18-q11
      type: multiple_choice
      topic_code: "4.OA.C.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section A"
      points: 1
      prompt: |
        A pattern starts at 9, and the rule is "add 9". Which number will never be a term in this pattern?
      options:
        - "45"
        - "72"
        - "84"
        - "81"
      option_explanations:
        - |
          45 is in the pattern: 9, 18, 27, 36, 45. It is the 5th term.
        - |
          72 is in the pattern. The terms are the multiples of 9, and 9 × 8 = 72.
        - |
          Correct. The terms are the multiples of 9: 72, 81, 90 ... 84 falls between 81 and 90, so it is never a term.
        - |
          81 is in the pattern. It is 9 × 9, the 9th term.
      answer: 2

    - slug: g4math-w18-q12
      type: numeric
      topic_code: "4.NBT.A.3"
      source: "IM K–5 Math Grade 4, Unit 4, Section C"
      points: 1
      prompt: |
        Round 48,617 to the nearest thousand. (Type the digits without a comma.)
      answer: { value: 49000, tolerance: 0 }
      explanation: |
        48,617 is between 48,000 and 49,000. The hundreds digit is 6, so it is past halfway (48,500). It rounds up to 49,000.

    - slug: g4math-w18-q13
      type: multiple_choice
      topic_code: "4.MD.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section C"
      points: 1
      prompt: |
        Ana buys a book that costs $6.25. She pays with a $10 bill. How much change does she get?
      options:
        - "$4.75"
        - "$3.75"
        - "$4.25"
        - "$16.25"
      option_explanations:
        - |
          $4.75 forgets that one of the 10 dollars was traded for 100 cents to take away the 25 cents. Only 3 whole dollars are left.
        - |
          Correct. $6.25 + $3.75 = $10.00. Count up: $6.25 to $7.00 is 75 cents, and $7.00 to $10.00 is $3.
        - |
          $4.25 takes away the dollars but keeps the 25 cents instead of taking them away too.
        - |
          $16.25 is $10 + $6.25. Change is what is left, so subtract.
      answer: 1

    - slug: g4math-w18-q14
      type: numeric
      topic_code: "4.OA.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section A"
      points: 1
      prompt: |
        Lena's dog weighs 7 times as much as her cat. The cat weighs 9 pounds. How many pounds does the dog weigh?
      answer: { value: 63, tolerance: 0 }
      explanation: |
        7 times as much as 9 pounds is 7 × 9 = 63 pounds.

    - slug: g4math-w18-q15
      type: short_answer
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 2
      prompt: |
        Diego wants to find 6 × 1,234.

        (a) What is 6 × 1,234?
        (b) Show the partial products you used.
      answer: |
        (a) 7,404.
        (b) 6 × 1,000 = 6,000; 6 × 200 = 1,200; 6 × 30 = 180; 6 × 4 = 24. 6,000 + 1,200 + 180 + 24 = 7,404.
      explanation: |
        Two points.

        (a) 1 pt: 7,404.

        (b) 1 pt: four correct partial products (6,000, 1,200, 180 and 24) or another correct split, such as an area diagram, added to the total. A small adding slip with correct partial products still earns this point.
