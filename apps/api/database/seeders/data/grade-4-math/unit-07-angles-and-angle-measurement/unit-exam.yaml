unit: 7
description: |
  20 questions · about 40 minutes · every standard of Unit 7: points, lines, segments, rays and angles,
  parallel and perpendicular lines, angles as turns measured in degrees, acute, right, obtuse and straight
  angles, measuring and drawing angles with a protractor, and adding angles to find unknown angles. Two
  stimulus sets share a picture across consecutive questions. Multiple choice, select-all, true/false and
  number answers are graded at once; the fill-in word is matched automatically; the short answer is checked
  by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: four lines (4.G.A.1)
  - slug: g4math-u07-check-q01
    type: multiple_choice
    topic_code: "4.G.A.1"
    source: "IM K–5 Math Grade 4, Unit 7, Section A"
    points: 1
    stimulus: |
      Use the picture of four lines. Each line goes on forever in both directions, and a small square marks a right angle.
    figure: figures/u07-lines.svg
    figure_alt: "Four lines with arrows at both ends. Line AB goes straight across near the top, through points A and B. Line CD goes straight across near the bottom, through points C and D, always the same distance from line AB. Line EF goes straight up and down through points E and F and crosses both, with a small square marking a right angle at each crossing. Line GH slants up to the right through points G and H and crosses line CD and line AB, not at right angles."
    prompt: |
      Which line is parallel to line AB?
    options:
      - "line EF"
      - "line GH"
      - "line CD"
      - "No line in the picture"
    option_explanations:
      - |
        Line EF crosses line AB and makes right angles, so it is perpendicular to line AB, not parallel.
      - |
        Line GH crosses line AB on the right side of the picture. Lines that cross are never parallel.
      - |
        Correct. Line CD runs the same way as line AB and stays the same distance from it, so they never meet.
      - |
        There is a parallel line in the picture: line CD never crosses line AB and stays the same distance away.
    answer: 2

  - slug: g4math-u07-check-q02
    type: multiple_choice
    topic_code: "4.G.A.1"
    source: "IM K–5 Math Grade 4, Unit 7, Section A"
    points: 1
    stimulus: |
      Use the picture of four lines. Each line goes on forever in both directions, and a small square marks a right angle.
    prompt: |
      Which line is perpendicular to line CD?
    options:
      - "line EF"
      - "line AB"
      - "line GH"
      - "line CD itself"
    option_explanations:
      - |
        Correct. Line EF crosses line CD, and the small square shows the angle there is a right angle.
      - |
        Line AB never meets line CD; the two are parallel. Perpendicular lines must cross at right angles.
      - |
        Line GH crosses line CD, but on a slant. The angles it makes are not right angles, so it is not perpendicular.
      - |
        A line cannot be perpendicular to itself. Perpendicular means two different lines crossing at right angles.
    answer: 0

  - slug: g4math-u07-check-q03
    type: multi_select
    topic_code: "4.G.A.1"
    source: "IM K–5 Math Grade 4, Unit 7, Section A"
    points: 2
    partial_credit: true
    stimulus: |
      Use the picture of four lines. Each line goes on forever in both directions, and a small square marks a right angle.
    prompt: |
      Which sentences are true? Select all that apply.
    options:
      - "Line GH intersects line AB."
      - "Line EF and line GH are parallel."
      - "Line AB and line CD make right angles where they meet."
      - "Line EF is perpendicular to line AB."
    option_explanations:
      - |
        True. Line GH crosses line AB near the top right of the picture, so the lines intersect.
      - |
        False. Line EF goes straight up and down while line GH slants, so if they kept going they would cross.
      - |
        False. Line AB and line CD are parallel, so they never meet and make no angles with each other.
      - |
        True. Line EF crosses line AB, and the small square marks a right angle there.
    answer: [0, 3]

  - slug: g4math-u07-check-q04
    type: multiple_choice
    topic_code: "4.G.A.1"
    source: "IM K–5 Math Grade 4, Unit 7, Section A"
    points: 1
    prompt: |
      Which figure has exactly one endpoint?
    options:
      - "a line"
      - "a ray"
      - "a line segment"
      - "a pair of parallel lines"
    option_explanations:
      - |
        A line goes on forever in both directions, so it has no endpoints at all.
      - |
        Correct. A ray starts at one endpoint and goes on forever in one direction.
      - |
        A line segment stops at both ends, so it has two endpoints.
      - |
        Parallel lines go on forever in both directions and never meet, so they have no endpoints at all.
    answer: 1

  - slug: g4math-u07-check-q05
    type: fill_blank
    topic_code: "4.G.A.1"
    source: "IM K–5 Math Grade 4, Unit 7, Section A"
    points: 1
    prompt: |
      Two lines in the same flat surface that never cross, and are always the same distance apart, are called ____ lines.
    answer: ["parallel", "parrallel", "paralel"]
    explanation: |
      Parallel lines never meet, like the two rails of a train track. Lines that cross at right angles are perpendicular.

  # ---- Stimulus set B: a protractor on a 115° angle (4.MD.C.6, 4.MD.C.5, 4.MD.C.7)
  - slug: g4math-u07-check-q06
    type: multiple_choice
    topic_code: "4.MD.C.6"
    source: "IM K–5 Math Grade 4, Unit 7, Section B"
    points: 1
    stimulus: |
      Use the protractor picture. One ray of the angle points to the right along the protractor's bottom edge.
    figure: figures/u07-protractor-115.svg
    figure_alt: "A protractor on an angle, its center dot on the vertex. One red ray points right along the bottom edge, through the inner blue 0. Marks show every degree; the outer black numbers run 0 to 180 from left to right and the inner blue numbers 0 to 180 from right to left. The other red ray points up and a little left, crossing halfway between 110 and 120 on the blue row (115) and halfway between 60 and 70 on the black row (65). A green arc marks the angle."
    prompt: |
      What is the measure of the angle?
    options:
      - "65°"
      - "105°"
      - "125°"
      - "115°"
    option_explanations:
      - |
        65 is on the black row, which starts at 0 on the left. The first ray is on the blue 0, and this angle is wider than a square corner.
      - |
        105 is ten too few. On the blue row the ray is past 110, halfway to 120.
      - |
        125 is ten too many. The ray crosses before 120 on the blue row, at the half-way mark after 110.
      - |
        Correct. The first ray is on the blue 0, so read the blue row: the other ray crosses halfway between 110 and 120, at 115.
    answer: 3

  - slug: g4math-u07-check-q07
    type: multiple_choice
    topic_code: "4.MD.C.5"
    source: "IM K–5 Math Grade 4, Unit 7, Section B"
    points: 1
    stimulus: |
      Use the protractor picture. One ray of the angle points to the right along the protractor's bottom edge.
    prompt: |
      What kind of angle is it?
    options:
      - "acute"
      - "right"
      - "obtuse"
      - "straight"
    option_explanations:
      - |
        An acute angle is less than 90°. This angle is 115°, wider than a square corner.
      - |
        A right angle is exactly 90°, with the ray pointing straight up. This ray leans past 90 to 115.
      - |
        Correct. 115° is more than 90° and less than 180°, so the angle is obtuse.
      - |
        A straight angle is 180°, with the rays making a straight line. This angle is only 115°.
    answer: 2

  - slug: g4math-u07-check-q08
    type: numeric
    topic_code: "4.MD.C.7"
    source: "IM K–5 Math Grade 4, Unit 7, Section C"
    points: 1
    stimulus: |
      Use the protractor picture. One ray of the angle points to the right along the protractor's bottom edge.
    prompt: |
      How many more degrees would the angle need to open to become a straight angle?
    answer: { value: 65, tolerance: 0 }
    explanation: |
      A straight angle is 180°. 180 − 115 = 65, so the angle needs 65° more. (That is also the black-row reading, because the two readings on a ray add to 180.)

  - slug: g4math-u07-check-q09
    type: multiple_choice
    topic_code: "4.MD.C.5"
    source: "IM K–5 Math Grade 4, Unit 7, Section B"
    points: 1
    prompt: |
      An angle turns through 1/6 of a full turn. What is its measure?
    options:
      - "60°"
      - "6°"
      - "30°"
      - "160°"
    option_explanations:
      - |
        Correct. A full turn is 360°, and 360 ÷ 6 = 60, so 1/6 of a turn is 60°.
      - |
        6 is the number of equal parts in the turn, not the size of one part. Each part is 360 ÷ 6 degrees.
      - |
        30° is 1/12 of a full turn (360 ÷ 12). One sixth is twice as big.
      - |
        160° is close to a half turn. One sixth of a turn is much smaller: 360 ÷ 6 = 60.
    answer: 0

  - slug: g4math-u07-check-q10
    type: numeric
    topic_code: "4.MD.C.5"
    source: "IM K–5 Math Grade 4, Unit 7, Section B"
    points: 1
    prompt: |
      A wheel at a fair has 10 seats spaced evenly around it. What is the angle, in degrees, between the lines from the center to two seats next to each other?
    answer: { value: 36, tolerance: 0 }
    explanation: |
      The 10 equal angles fill a full turn of 360°. 360 ÷ 10 = 36°.

  - slug: g4math-u07-check-q11
    type: true_false
    topic_code: "4.MD.C.7"
    source: "IM K–5 Math Grade 4, Unit 7, Section C"
    points: 1
    prompt: |
      True or false: two right angles placed side by side, sharing a ray and not overlapping, make a straight angle.
    answer: true
    explanation: |
      True. 90 + 90 = 180, and a 180° angle is a straight angle: the two outside rays point in opposite directions.

  - slug: g4math-u07-check-q12
    type: multiple_choice
    topic_code: "4.MD.C.6"
    source: "IM K–5 Math Grade 4, Unit 7, Section B"
    points: 1
    prompt: |
      Sam is drawing a 25° angle. He put the protractor's center mark on his ray's endpoint, and his ray passes through the 0 on the outer row. Where should he make his dot?
    options:
      - "at 25 on the inner row"
      - "at 25 on the outer row"
      - "at 155 on the outer row"
      - "at 65 on the outer row"
    option_explanations:
      - |
        The inner row starts at 180 on Sam's ray, not 0, so a dot at 25 on that row would make a 155° angle.
      - |
        Correct. Sam's ray is on the outer row's 0, so he counts on that same row to 25.
      - |
        155 on the outer row would make a 155° angle, an obtuse angle, not 25°.
      - |
        65 is 90 − 25. Drawing a 25° angle does not need a right angle; he counts from 0 to 25.
    answer: 1

  - slug: g4math-u07-check-q13
    type: numeric
    topic_code: "4.MD.C.6"
    source: "IM K–5 Math Grade 4, Unit 7, Section B"
    points: 1
    prompt: |
      Neither ray of an angle lies on 0. On the same row of a protractor, one ray crosses 35 and the other crosses 120. What is the measure of the angle, in degrees?
    answer: { value: 85, tolerance: 0 }
    explanation: |
      Read both rays on the same row and subtract: 120 − 35 = 85°.

  - slug: g4math-u07-check-q14
    type: numeric
    topic_code: "4.MD.C.7"
    source: "IM K–5 Math Grade 4, Unit 7, Section C"
    points: 1
    figure: figures/u07-straight-unknown.svg
    figure_alt: "A straight line with arrows at both ends and a vertex dot in the middle. One blue ray goes up and to the right from the vertex and splits the straight angle into two angles. The angle on the right, between the blue ray and the right part of the line, has a red arc and is labeled x. The angle on the left, between the blue ray and the left part of the line, has a green arc and is labeled 128°."
    prompt: |
      The two angles make a straight angle. What is the value of x, in degrees?
    answer: { value: 52, tolerance: 0 }
    explanation: |
      The two angles make 180°, so 128 + x = 180 and x = 180 − 128 = 52°.

  - slug: g4math-u07-check-q15
    type: multiple_choice
    topic_code: "4.MD.C.7"
    source: "IM K–5 Math Grade 4, Unit 7, Section C"
    points: 1
    prompt: |
      Angle ABD is a right angle. Ray BC is inside it and splits it into angle ABC, which is 27°, and angle CBD, which is x. Which equation can be used to find x?
    options:
      - "x = 90 + 27"
      - "27 + x = 180"
      - "x − 27 = 90"
      - "27 + x = 90"
    option_explanations:
      - |
        Adding 27 to 90 makes x bigger than the whole right angle. A part must be smaller than the whole.
      - |
        180 is a straight angle. Angle ABD is a right angle, so the parts add to 90.
      - |
        x − 27 = 90 would make x equal 117, bigger than the whole right angle.
      - |
        Correct. The two parts make the right angle: 27 + x = 90, so x = 63°.
    answer: 3

  - slug: g4math-u07-check-q16
    type: multiple_choice
    topic_code: "4.MD.C.7"
    source: "IM K–5 Math Grade 4, Unit 7, Section C"
    points: 1
    prompt: |
      Three angles fill the space all the way around a point with no gaps or overlaps. Two of them are 150° and 110°. What is the third angle?
    options:
      - "100°"
      - "260°"
      - "210°"
      - "80°"
    option_explanations:
      - |
        Correct. All the way around a point is 360°. 150 + 110 = 260, and 360 − 260 = 100°.
      - |
        260° is the sum of the two known angles. The third angle is what is left from 360°.
      - |
        210° is 360 − 150. The 110° angle must be subtracted too.
      - |
        80° is a subtraction slip. 360 − 260 = 100, because 260 + 100 = 360.
    answer: 0

  - slug: g4math-u07-check-q17
    type: multi_select
    topic_code: "4.MD.C.7"
    source: "IM K–5 Math Grade 4, Unit 7, Section C"
    points: 2
    partial_credit: true
    prompt: |
      A 35° angle is joined side by side, with no overlap, to another angle. Which angles could be joined to it to make an obtuse angle? Select all that apply.
    options:
      - "50°"
      - "60°"
      - "55°"
      - "100°"
      - "150°"
    option_explanations:
      - |
        No. 35 + 50 = 85, which is less than 90, so the new angle is acute.
      - |
        Yes. 35 + 60 = 95, which is more than 90 and less than 180, so it is obtuse.
      - |
        No. 35 + 55 = 90 exactly, which is a right angle, not obtuse.
      - |
        Yes. 35 + 100 = 135, which is between 90 and 180, so it is obtuse.
      - |
        No. 35 + 150 = 185, which is more than a straight angle. Obtuse angles are less than 180°.
    answer: [1, 3]

  - slug: g4math-u07-check-q18
    type: multiple_choice
    topic_code: "4.MD.C.5"
    source: "IM K–5 Math Grade 4, Unit 7, Section B"
    points: 1
    prompt: |
      Which of these angle measures is acute?
    options:
      - "90°"
      - "91°"
      - "89°"
      - "180°"
    option_explanations:
      - |
        90° is a right angle exactly. Acute angles are less than 90°.
      - |
        91° is just more than a right angle, so it is obtuse.
      - |
        Correct. 89° is less than 90°, so it is acute, even though it is very close to a right angle.
      - |
        180° is a straight angle, the widest of these, not acute.
    answer: 2

  - slug: g4math-u07-check-q19
    type: numeric
    topic_code: "4.MD.C.7"
    source: "IM K–5 Math Grade 4, Unit 7, Section C"
    points: 1
    prompt: |
      A skater spins 90°, then 45°, then 90° more, always in the same direction. How many degrees does she turn in all?
    answer: { value: 225, tolerance: 0 }
    explanation: |
      Turns in the same direction add: 90 + 45 + 90 = 225°.

  - slug: g4math-u07-check-q20
    type: short_answer
    topic_code: "4.MD.C.7"
    source: "IM K–5 Math Grade 4, Unit 7, Section C"
    points: 3
    prompt: |
      A straight angle is split into three angles with no gaps or overlaps. Two of them measure 48° and 67°.

      (a) Write an equation with a letter for the unknown angle.
      (b) Find the unknown angle.
      (c) Is the unknown angle acute, right or obtuse? Explain.
    answer: |
      (a) 48 + 67 + x = 180.
      (b) 48 + 67 = 115, and 180 − 115 = 65. The unknown angle is 65°.
      (c) Acute, because 65° is less than 90°.
    explanation: |
      Three points.

      (a) 1 pt: a correct equation with a letter, such as 48 + 67 + x = 180 or x = 180 − 48 − 67.

      (b) 1 pt: 65°. Allow the point for a correct method with one small adding or subtracting slip.

      (c) 1 pt: acute, with a reason that compares the angle with 90° (or follows correctly from a wrong answer in part b).
