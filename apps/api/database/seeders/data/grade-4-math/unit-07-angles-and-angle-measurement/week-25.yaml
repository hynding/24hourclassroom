week: 25
unit: 7
title: "Adding Angles and Finding Unknown Angles"
topics: ["4.MD.C.7"]
guide: guides/week-25.md
guide_description: |
  Angle measures add: when an angle is split into parts that do not overlap, the whole is the sum of the
  parts. Using that idea with right angles (90°), straight angles (180°) and full turns (360°) to find a
  missing angle, writing an equation with a letter for the unknown, and solving word problems about turns.
flashcards_description: |
  18 cards on adding angle measures, finding a missing part of a right angle, a straight angle or a full
  turn, writing equations with a letter for the unknown angle, and angle word problems.

flashcards:
  - front: Adding angles → the big idea
    back: |
      When an angle is split into parts that do not overlap, the measure of the whole angle is the sum of the parts.
    topic_code: "4.MD.C.7"
  - front: Angles of 30° and 25° side by side → whole angle
    back: |
      55°, because 30 + 25 = 55. The two angles share a ray and do not overlap.
    topic_code: "4.MD.C.7"
  - front: Unknown part of an angle → how to find it
    back: |
      Subtract the part you know from the whole. Whole 80°, one part 30°: 80 − 30 = 50°.
    topic_code: "4.MD.C.7"
  - front: Two parts of a right angle → they add to
    back: |
      90°. If one part is 20°, the other is 90 − 20 = 70°.
    topic_code: "4.MD.C.7"
  - front: Parts of a straight angle → they add to
    back: |
      180°. If one part is 130°, the other is 180 − 130 = 50°.
    topic_code: "4.MD.C.7"
  - front: Angles all the way around a point → they add to
    back: |
      360°, a full turn. If the angles you know add to 300°, the missing one is 360 − 300 = 60°.
    topic_code: "4.MD.C.7"
  - front: Letter for an unknown angle → what it means
    back: |
      A letter such as x or a stands for the angle we do not know yet. In 40 + x = 90, x is 50.
    topic_code: "4.MD.C.7"
  - front: Equation for a missing part of a straight angle with 65°
    back: |
      65 + x = 180, or x = 180 − 65. So x = 115.
    topic_code: "4.MD.C.7"
  - front: "Straight angle in three parts, 50°, 60° and x → x"
    back: |
      70°. 50 + 60 = 110, and 180 − 110 = 70.
    topic_code: "4.MD.C.7"
  - front: Three equal angles fill a straight angle → each one
    back: |
      60°, because 180 ÷ 3 = 60. Check: 60 + 60 + 60 = 180.
    topic_code: "4.MD.C.7"
  - front: Four equal angles around a point → each one
    back: |
      90°, because 360 ÷ 4 = 90. Think of the four corners of square tiles meeting at one point.
    topic_code: "4.MD.C.7"
  - front: Hexagon pattern block corner → why it is 120°
    back: |
      Three hexagon corners fit around a point with no gaps, and 360 ÷ 3 = 120.
    topic_code: "4.MD.C.7"
  - front: Triangle pattern block corner → why it is 60°
    back: |
      Six triangle corners fit around a point with no gaps, and 360 ÷ 6 = 60.
    topic_code: "4.MD.C.7"
  - front: Checking an unknown angle → one good habit
    back: |
      Add all the parts back together. They should make the whole: 90, 180, 360 or the angle you were given.
    topic_code: "4.MD.C.7"
  - front: Turning 90° then 45° in the same direction → total turn
    back: |
      135°, because 90 + 45 = 135.
    topic_code: "4.MD.C.7"
  - front: Angle split by a ray on a protractor → how to read both parts
    back: |
      Read all three rays on the same row of numbers, then subtract neighbors. Rays at 0, 40 and 100 make parts of 40° and 60°.
    topic_code: "4.MD.C.7"
  - front: Adding angles that overlap → why it does not work
    back: |
      The shared part would be counted twice. Angle measures add only when the parts touch along a ray without overlapping.
    topic_code: "4.MD.C.7"
  - front: Unknown angle → a common mix-up
    back: |
      Using 180 when the whole is a right angle, or 90 when it is a straight line. First ask: is the whole 90, 180 or 360?
    topic_code: "4.MD.C.7"

quiz:
  description: |
    14 questions · about 30 minutes · adding angle measures, finding unknown angles inside a right angle, a
    straight angle and a full turn, equations with a letter for the unknown, and angle word problems, plus
    review of protractors, turns and rays. Multiple choice, select-all, true/false and number answers are graded
    at once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w25-q01
      type: multiple_choice
      topic_code: "4.MD.C.7"
      source: "IM K–5 Math Grade 4, Unit 7, Section C"
      points: 1
      figure: figures/w25-right-angle-split.svg
      figure_alt: "A right angle with its vertex at the bottom left: one black ray points straight to the right and one points straight up. Words in the picture say the whole angle is 90°. A blue ray from the vertex splits it into two parts. The bottom part, between the right-pointing ray and the blue ray, has a green arc and is labeled 35°. The top part, between the blue ray and the up-pointing ray, has a red arc and is labeled with a question mark."
      prompt: |
        The whole angle is a right angle. What is the measure of the angle marked with the question mark?
      options:
        - "145°"
        - "55°"
        - "65°"
        - "35°"
      option_explanations:
        - |
          145° comes from 180 − 35. The whole angle here is a right angle, 90°, not a straight angle.
        - |
          Correct. The two parts make the right angle, so 35 + ? = 90, and 90 − 35 = 55°.
        - |
          65° is a subtraction slip: 90 − 35 is 55, because 35 + 55 = 90.
        - |
          35° is the part that is already labeled. The top part is wider than the bottom part in the picture.
      answer: 1

    - slug: g4math-w25-q02
      type: numeric
      topic_code: "4.MD.C.7"
      source: "IM K–5 Math Grade 4, Unit 7, Section C"
      points: 1
      figure: figures/w25-straight-angle-three.svg
      figure_alt: "A straight line with arrows at both ends and a vertex dot in the middle. Two blue rays go up from the vertex and split the straight angle into three angles that do not overlap. From right to left: the first angle is labeled 65°, the middle angle is labeled x, and the angle on the left is labeled 40°."
      prompt: |
        The three angles make a straight angle. What is the value of x, in degrees?
      answer: { value: 75, tolerance: 0 }
      explanation: |
        A straight angle is 180°. The known parts are 65 + 40 = 105, and 180 − 105 = 75. So x = 75°. Check: 65 + 75 + 40 = 180.

    - slug: g4math-w25-q03
      type: multiple_choice
      topic_code: "4.MD.C.7"
      source: "IM K–5 Math Grade 4, Unit 7, Section C"
      points: 1
      figure: figures/w25-around-a-point.svg
      figure_alt: "Four rays start from one point: right, straight up, down-left and down-right. They make four angles that fill the space around the point with no gaps. The angle between the right ray and the up ray has a small square and is labeled 90°. Going around, the angle between the up ray and the down-left ray is 120°, the angle between the down-left and down-right rays is 100°, and the last angle, between the down-right ray and the right ray, is labeled with a question mark."
      prompt: |
        The four angles fill the space all the way around the point. What is the measure of the angle marked with the question mark?
      options:
        - "50°"
        - "140°"
        - "310°"
        - "150°"
      option_explanations:
        - |
          Correct. All the way around a point is 360°. The known angles add to 90 + 120 + 100 = 310, and 360 − 310 = 50°.
        - |
          140° leaves out the right angle: 360 − 120 − 100 = 140. The 90° angle must be subtracted too.
        - |
          310° is the sum of the three known angles. The question asks for the angle that is left over from 360°.
        - |
          150° leaves out the 100° angle: 360 − 90 − 120 = 150. All three known angles must be subtracted.
      answer: 0

    - slug: g4math-w25-q04
      type: multiple_choice
      topic_code: "4.MD.C.7"
      source: "IM K–5 Math Grade 4, Unit 7, Section C"
      points: 1
      stimulus: |
        Use the protractor picture. Three rays start at the center: one through the blue 0 on the right, one through the blue 50 and one through the blue 130.
      figure: figures/w25-protractor-two-parts.svg
      figure_alt: "A protractor with three red rays from its center dot. Marks show every degree; the outer black numbers run 0 to 180 from left to right and the inner blue numbers 0 to 180 from right to left. The first ray points right along the bottom edge, through blue 0. The second points up and right, crossing blue 50 (black 130). The third points up and left, crossing blue 130 (black 50). Green arcs mark the angle from the first ray to the second and from the second to the third."
      prompt: |
        What is the measure of the whole angle between the first ray (through blue 0) and the third ray (through blue 130)?
      options:
        - "50°"
        - "80°"
        - "180°"
        - "130°"
      option_explanations:
        - |
          50° is only the first part, from the blue 0 to the blue 50. The whole angle goes on to the third ray.
        - |
          80° is only the second part, from blue 50 to blue 130. The whole angle includes the first part too.
        - |
          180° would be a straight angle, with the third ray along the bottom edge to the left. The third ray is at 130.
        - |
          Correct. The first ray is on the blue 0 and the third ray crosses the blue 130, so the whole angle is 130°. Also 50 + 80 = 130.
      answer: 3

    - slug: g4math-w25-q05
      type: numeric
      topic_code: "4.MD.C.7"
      source: "IM K–5 Math Grade 4, Unit 7, Section C"
      points: 1
      stimulus: |
        Use the protractor picture. Three rays start at the center: one through the blue 0 on the right, one through the blue 50 and one through the blue 130.
      prompt: |
        What is the measure, in degrees, of the angle between the second ray (through blue 50) and the third ray (through blue 130)?
      answer: { value: 80, tolerance: 0 }
      explanation: |
        Both rays are read on the blue row: 130 − 50 = 80°. Check with adding: 50 + 80 = 130, the whole angle.

    - slug: g4math-w25-q06
      type: fill_blank
      topic_code: "4.MD.C.7"
      source: "IM K–5 Math Grade 4, Unit 7, Section C"
      points: 1
      prompt: |
        When an angle is split into parts that do not overlap, the measure of the whole angle is the ____ of the measures of the parts.
      answer: ["sum", "the sum", "total", "the total"]
      explanation: |
        Angle measures add. The whole is the sum of its parts, so 30° and 45° side by side make a 75° angle.

    - slug: g4math-w25-q07
      type: multi_select
      topic_code: "4.MD.C.7"
      source: "IM K–5 Math Grade 4, Unit 7, Section C"
      points: 2
      partial_credit: true
      prompt: |
        Which pairs of angles, placed side by side with no overlap, make exactly a right angle? Select all that apply.
      options:
        - "45° and 45°"
        - "30° and 60°"
        - "40° and 60°"
        - "25° and 65°"
        - "90° and 90°"
      option_explanations:
        - |
          Yes. 45 + 45 = 90, so the two angles make a right angle.
        - |
          Yes. 30 + 60 = 90, so the two angles make a right angle.
        - |
          No. 40 + 60 = 100, which is 10° more than a right angle.
        - |
          Yes. 25 + 65 = 90, so the two angles make a right angle.
        - |
          No. 90 + 90 = 180, which is a straight angle, not a right angle.
      answer: [0, 1, 3]

    - slug: g4math-w25-q08
      type: multiple_choice
      topic_code: "4.MD.C.7"
      source: "IM K–5 Math Grade 4, Unit 7, Section C"
      points: 1
      prompt: |
        A straight angle is split into two angles. One of them is 112°. Which equation can be used to find the other angle, x?
      options:
        - "112 + x = 90"
        - "x = 180 + 112"
        - "112 + x = 180"
        - "112 + x = 360"
      option_explanations:
        - |
          90 is a right angle. The whole here is a straight angle, and 112 is already more than 90.
        - |
          Adding 112 to 180 makes x bigger than the whole straight angle. The part must be smaller than 180.
        - |
          Correct. The two parts make the straight angle: 112 + x = 180, so x = 68°.
        - |
          360 is a full turn. A straight angle is half a turn, 180°.
      answer: 2

    - slug: g4math-w25-q09
      type: true_false
      topic_code: "4.MD.C.7"
      source: "IM K–5 Math Grade 4, Unit 7, Section C"
      points: 1
      prompt: |
        True or false: a 60° angle and a 45° angle are placed side by side, sharing one ray and not overlapping. The new, bigger angle measures 105°.
      answer: true
      explanation: |
        True. Angle measures add when the parts do not overlap: 60 + 45 = 105°.

    - slug: g4math-w25-q10
      type: multiple_choice
      topic_code: "4.MD.C.7"
      source: "IM K–5 Math Grade 4, Unit 7, Section C"
      points: 1
      prompt: |
        Each corner of a square tile is a right angle. How many square tiles can meet at one point so their corners fill the space around it with no gaps or overlaps?
      options:
        - "4"
        - "3"
        - "2"
        - "6"
      option_explanations:
        - |
          Correct. All the way around a point is 360°, and 360 ÷ 90 = 4. Four corners of 90° fill it.
        - |
          3 corners make 90 + 90 + 90 = 270°, which leaves a 90° gap.
        - |
          2 corners make only 180°, a straight angle. Half the space around the point is still empty.
        - |
          6 corners would make 540°, so the tiles would overlap. 6 is the number for triangle corners of 60°.
      answer: 0

    - slug: g4math-w25-q11
      type: multiple_choice
      topic_code: "4.MD.C.6"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      prompt: |
        One ray of an angle lies on the 0 of a protractor's inner row. The other ray crosses 70 on the inner row and 110 on the outer row. What does the angle measure?
      options:
        - "110°"
        - "180°"
        - "70°"
        - "40°"
      option_explanations:
        - |
          110 is on the outer row, which does not start at 0 on the first ray. Read the inner row, which does.
        - |
          180 is what the two rows add to, not the measure of the angle.
        - |
          Correct. The first ray is on the inner row's 0, so read the inner row: 70°.
        - |
          40 is the difference between the two readings, 110 − 70. Only one row is read for this angle.
      answer: 2

    - slug: g4math-w25-q12
      type: numeric
      topic_code: "4.MD.C.5"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      prompt: |
        The minute hand of a clock moves from the 12 to the 7. How many degrees does it turn?
      answer: { value: 210, tolerance: 0 }
      explanation: |
        Each step from one number to the next is 360 ÷ 12 = 30°. From 12 to 7 is 7 steps: 7 × 30 = 210°.

    - slug: g4math-w25-q13
      type: multiple_choice
      topic_code: "4.G.A.1"
      source: "IM K–5 Math Grade 4, Unit 7, Section A"
      points: 1
      prompt: |
        Ray PQ and ray PR make a straight angle. Which sentence must be true?
      options:
        - "Ray PQ and ray PR are perpendicular."
        - "Points Q, P and R lie on one line, with P between Q and R."
        - "Ray PQ and ray PR are parallel."
        - "Angle QPR measures 90°."
      option_explanations:
        - |
          Perpendicular rays make a right angle, 90°. A straight angle is 180°.
        - |
          Correct. In a straight angle the two rays point opposite ways from the vertex P, so Q, P and R lie on one straight line.
        - |
          Parallel lines never meet. These two rays meet at their shared endpoint, P.
        - |
          90° is a right angle. A straight angle measures 180°.
      answer: 1

    - slug: g4math-w25-q14
      type: short_answer
      topic_code: "4.MD.C.7"
      source: "IM K–5 Math Grade 4, Unit 7, Section C"
      points: 2
      prompt: |
        Three angles that are all the same size fit together, with no gaps or overlaps, to make a straight angle.

        (a) Write an equation with a letter for the measure of one angle.
        (b) Solve it. How many degrees is each angle?
      answer: |
        (a) a + a + a = 180, or 3 × a = 180.
        (b) a = 180 ÷ 3 = 60. Each angle is 60°. Check: 60 + 60 + 60 = 180.
      explanation: |
        Two points.

        (a) 1 pt: a correct equation with a letter for one angle, such as a + a + a = 180, 3 × a = 180 or a = 180 ÷ 3.

        (b) 1 pt: 60°.
