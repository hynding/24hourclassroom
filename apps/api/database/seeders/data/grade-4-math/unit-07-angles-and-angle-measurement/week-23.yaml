week: 23
unit: 7
title: "Angles as Turns: Degrees and Kinds of Angles"
topics: ["4.MD.C.5"]
guide: guides/week-23.md
guide_description: |
  An angle as a turn around its vertex, why a full turn is 360 degrees and a one-degree angle is 1/360 of a
  turn, quarter, half and three-quarter turns, the clock face as a circle of 30-degree steps, and sorting
  angles as acute, right, obtuse or straight by their size in degrees.
flashcards_description: |
  19 cards on angles as turns, the degree, full, half and quarter turns, clock-face angles, why ray length
  does not change an angle, and acute, right, obtuse and straight angles.

flashcards:
  - front: Angle as a turn → what it means
    back: |
      Picture one ray staying still while the other ray spins around the vertex. How far it spins is the size of the angle.
    topic_code: "4.MD.C.5"
  - front: Full turn → how many degrees
    back: |
      360°. Spinning all the way around a circle, back to where you started, is a 360-degree turn.
    topic_code: "4.MD.C.5"
  - front: Degree (angle unit) → what it is
    back: |
      The unit for measuring angles. A one-degree angle (1°) turns through 1/360 of a full circle.
    topic_code: "4.MD.C.5"
  - front: Degree sign → how to write 45 degrees
    back: |
      45°. The small raised circle means "degrees".
    topic_code: "4.MD.C.5"
  - front: Half turn → how many degrees
    back: |
      180°. Half of 360 is 180. A half turn makes you face the opposite way.
    topic_code: "4.MD.C.5"
  - front: Quarter turn → how many degrees
    back: |
      90°, because 360 ÷ 4 = 90. A quarter turn makes a right angle.
    topic_code: "4.MD.C.5"
  - front: Three-quarter turn → how many degrees
    back: |
      270°. Three quarter turns: 90 + 90 + 90 = 270.
    topic_code: "4.MD.C.5"
  - front: Angle made of 25 one-degree angles → its measure
    back: |
      25°. An angle that turns through n one-degree angles measures n degrees.
    topic_code: "4.MD.C.5"
  - front: Circle cut into 12 equal angles → size of each
    back: |
      30°, because 360 ÷ 12 = 30. This is the angle between two numbers next to each other on a clock.
    topic_code: "4.MD.C.5"
  - front: Minute hand from 12 to 6 → degrees turned
    back: |
      180°. That is half of the clock, a half turn: 6 steps of 30°.
    topic_code: "4.MD.C.5"
  - front: Clock hands at 3:00 → angle between them
    back: |
      90°. The hands are 3 numbers apart, and 3 × 30 = 90. That is a right angle.
    topic_code: "4.MD.C.5"
  - front: Acute angle → size in degrees
    back: |
      More than 0° and less than 90°. It is narrower than a square corner.
    topic_code: "4.MD.C.5"
  - front: Right angle → size in degrees
    back: |
      Exactly 90°, a quarter turn. It looks like a square corner.
    topic_code: "4.MD.C.5"
  - front: Obtuse angle → size in degrees
    back: |
      More than 90° and less than 180°. It is wider than a square corner but not a straight line.
    topic_code: "4.MD.C.5"
  - front: Straight angle → what it looks like
    back: |
      Two rays pointing in opposite directions from the vertex, making a straight line. It measures 180°.
    topic_code: "4.MD.C.5"
  - front: Longer rays → does the angle get bigger?
    back: |
      No. The size of an angle is how far it turns, not how long its rays are drawn.
    topic_code: "4.MD.C.5"
  - front: 1/4 of a turn vs 90° → are they the same?
    back: |
      Yes. 360 ÷ 4 = 90, so a quarter of a full turn and a 90° angle are the same size.
    topic_code: "4.MD.C.5"
  - front: Benchmark angles → four to know
    back: |
      90° (square corner), 180° (straight line), 45° (half a right angle) and 360° (a full turn).
    topic_code: "4.MD.C.5"
  - front: 45° angle → how it compares with a right angle
    back: |
      It is half of a right angle, because 90 ÷ 2 = 45. A square corner folded in half makes it.
    topic_code: "4.MD.C.5"

quiz:
  description: |
    14 questions · about 30 minutes · angles as turns, degrees and fractions of a full turn, angles on a clock,
    and acute, right, obtuse and straight angles, plus review of perpendicular lines, equivalent fractions and
    dividing. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word
    is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w23-q01
      type: multiple_choice
      topic_code: "4.MD.C.5"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      stimulus: |
        Use the circle. It is cut into 12 equal parts by lines from its center, and the shaded angle has its vertex at the center.
      figure: figures/w23-circle-twelfths.svg
      figure_alt: "A circle cut into 12 equal parts by thin lines from its center, like the hour marks on a clock. Two thick rays from the center make an angle: one points straight to the right and the other points up and to the left. The angle between them is shaded blue and covers exactly 4 of the 12 equal parts, with a green arc drawn at the vertex."
      prompt: |
        How many degrees does the shaded angle measure?
      options:
        - "4°"
        - "30°"
        - "120°"
        - "90°"
      option_explanations:
        - |
          4 is the number of parts the angle covers. Each part is 360 ÷ 12 = 30 degrees, so the angle is bigger than 4°.
        - |
          30° is the size of only one of the 12 parts. The shaded angle covers 4 of them.
        - |
          Correct. A full turn is 360°, so each of the 12 parts is 30°. Four parts make 4 × 30 = 120°.
        - |
          90° would cover 3 parts, a quarter of the circle. The shaded angle covers 4 parts, which is more than a quarter.
      answer: 2

    - slug: g4math-w23-q02
      type: numeric
      topic_code: "4.MD.C.5"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      stimulus: |
        Use the circle. It is cut into 12 equal parts by lines from its center, and the shaded angle has its vertex at the center.
      prompt: |
        How many degrees is the angle of just one of the 12 equal parts?
      answer: { value: 30, tolerance: 0 }
      explanation: |
        The 12 equal angles fill a full turn of 360°. 360 ÷ 12 = 30, so each part is 30°.

    - slug: g4math-w23-q03
      type: multiple_choice
      topic_code: "4.MD.C.5"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      stimulus: |
        Use the circle. It is cut into 12 equal parts by lines from its center, and the shaded angle has its vertex at the center.
      prompt: |
        What fraction of a full turn is the shaded angle?
      options:
        - "1/3"
        - "1/4"
        - "4/360"
        - "1/12"
      option_explanations:
        - |
          Correct. The angle covers 4 of 12 equal parts, and 4/12 is equivalent to 1/3. Check: 120 is one third of 360.
        - |
          1/4 of a turn would cover 3 of the 12 parts (90°). The shaded angle covers 4 parts.
        - |
          4/360 would be an angle of only 4 degrees. The 12 parts are not degrees; each part is 30 degrees.
        - |
          1/12 is just one part. The shaded angle covers 4 parts, which is 4/12 of the turn.
      answer: 0

    - slug: g4math-w23-q04
      type: fill_blank
      topic_code: "4.MD.C.5"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      prompt: |
        Angles are measured in units called ____. A full turn is 360 of them.
      answer: ["degrees", "degree", "the degree", "the degrees"]
      explanation: |
        Degrees are the units for angles. A one-degree angle turns through 1/360 of a circle, so a full turn is 360 degrees (360°).

    - slug: g4math-w23-q05
      type: multiple_choice
      topic_code: "4.MD.C.5"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      stimulus: |
        Use the four angles. A small square marks a right angle.
      figure: figures/w23-four-angles.svg
      figure_alt: "Four angles in four boxes. In each one, the bottom ray points straight to the right. Angle 1: the other ray points up and to the right, much narrower than a square corner. Angle 2: the other ray points straight up, with a small square marking a right angle. Angle 3: the other ray points up and to the left, much wider than a square corner but not a straight line. Angle 4: the other ray points steeply up and to the right, a little narrower than a square corner."
      prompt: |
        Which angle is obtuse?
      options:
        - "Angle 1"
        - "Angle 2"
        - "Angle 4"
        - "Angle 3"
      option_explanations:
        - |
          Angle 1 is narrower than a square corner, so it is acute, not obtuse.
        - |
          Angle 2 has the small square: it is a right angle of exactly 90°, not an obtuse angle.
        - |
          Angle 4 is a little narrower than a square corner, so it is acute. Obtuse angles are wider than a right angle.
        - |
          Correct. Angle 3 opens wider than a square corner but is not a straight line, so it is between 90° and 180°: obtuse.
      answer: 3

    - slug: g4math-w23-q06
      type: multi_select
      topic_code: "4.MD.C.5"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 2
      partial_credit: true
      stimulus: |
        Use the four angles. A small square marks a right angle.
      prompt: |
        Which angles are acute? Select all that apply.
      options:
        - "Angle 1"
        - "Angle 2"
        - "Angle 3"
        - "Angle 4"
      option_explanations:
        - |
          Yes. Angle 1 is much narrower than a square corner, so it measures less than 90°.
        - |
          No. Angle 2 is marked as a right angle. It is exactly 90°, and acute angles are less than 90°.
        - |
          No. Angle 3 is wider than a square corner, so it is obtuse.
        - |
          Yes. Angle 4 is close to a square corner but a little narrower, so it is still less than 90°.
      answer: [0, 3]

    - slug: g4math-w23-q07
      type: true_false
      topic_code: "4.MD.C.5"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      prompt: |
        True or false: an angle that turns through half of a full turn is a straight angle, and it measures 180°.
      answer: true
      explanation: |
        True. Half of 360° is 180°. After a half turn the moving ray points the opposite way, so the two rays make a straight line: a straight angle.

    - slug: g4math-w23-q08
      type: multiple_choice
      topic_code: "4.MD.C.5"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      figure: figures/w23-clock-four.svg
      figure_alt: "A round clock face with the numbers 1 to 12 and a small mark for every minute. The short hour hand points exactly at the 4 and the long minute hand points exactly at the 12. The time is 4:00."
      prompt: |
        The clock shows 4:00. What is the measure of the smaller angle between the two hands?
      options:
        - "4°"
        - "120°"
        - "40°"
        - "240°"
      option_explanations:
        - |
          4 is how many numbers apart the hands are. Each step from one number to the next is 30°, so the angle is much bigger.
        - |
          Correct. The 12 numbers split a full turn into 12 angles of 360 ÷ 12 = 30°. The hands are 4 steps apart: 4 × 30 = 120°.
        - |
          40° counts 10 degrees for each number. The steps are 30° each, because 360 ÷ 12 = 30.
        - |
          240° is the bigger angle, going the long way around from 4 to 12. The question asks for the smaller angle.
      answer: 1

    - slug: g4math-w23-q09
      type: multiple_choice
      topic_code: "4.MD.C.5"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      prompt: |
        A one-degree angle turns through what fraction of a full circle?
      options:
        - "1/100"
        - "1/180"
        - "1/90"
        - "1/360"
      option_explanations:
        - |
          A full turn is not 100 degrees. It is 360 degrees, so one degree is 1 of 360 equal parts.
        - |
          180 degrees is only a half turn. A full circle is 360 degrees, so one degree is 1/360 of it.
        - |
          90 degrees is a quarter turn. One degree is a much smaller piece: 1 of the 360 equal parts of a circle.
        - |
          Correct. A full turn is 360°, so a one-degree angle is 1 of 360 equal parts: 1/360 of the circle.
      answer: 3

    - slug: g4math-w23-q10
      type: numeric
      topic_code: "4.MD.C.5"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      prompt: |
        Mateo spins on the ice through 3/4 of a full turn. How many degrees does he turn?
      answer: { value: 270, tolerance: 0 }
      explanation: |
        A quarter turn is 360 ÷ 4 = 90°. Three quarter turns are 3 × 90 = 270°.

    - slug: g4math-w23-q11
      type: multiple_choice
      topic_code: "4.G.A.1"
      source: "IM K–5 Math Grade 4, Unit 7, Section A"
      points: 1
      prompt: |
        Each letter is written in block capitals with straight segments. Which letter has two segments that are perpendicular?
      options:
        - "T"
        - "V"
        - "Z"
        - "N"
      option_explanations:
        - |
          Correct. The bar across the top of a T meets the stem in square corners, so those segments are perpendicular.
        - |
          The two segments of a V meet at a narrow point. That angle is acute, not a right angle.
        - |
          A Z has two parallel segments joined by a slanted one. The slanted segment does not make square corners.
        - |
          In an N the two upright segments are parallel, and the slanted middle segment meets them at angles that are not right angles.
      answer: 0

    - slug: g4math-w23-q12
      type: multiple_choice
      topic_code: "4.NF.A.1"
      source: "IM K–5 Math Grade 4, Unit 2, Section B"
      points: 1
      prompt: |
        A quarter turn is 1/4 of a circle. A clock face splits the circle into twelfths. Which fraction is equivalent to 1/4?
      options:
        - "4/12"
        - "3/12"
        - "1/12"
        - "6/12"
      option_explanations:
        - |
          4/12 is equivalent to 1/3, not 1/4. Multiply 1/4 by 3/3 to get twelfths: 3/12.
        - |
          Correct. Multiply the top and bottom of 1/4 by 3: 1/4 = 3/12. On a clock that is 3 steps, from 12 to 3.
        - |
          1/12 is only one step on a clock. A quarter of the clock face takes 3 steps.
        - |
          6/12 is equivalent to 1/2, which is a half turn, twice as much as a quarter turn.
      answer: 1

    - slug: g4math-w23-q13
      type: numeric
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 6, Section C"
      points: 1
      prompt: |
        A wheel has spokes spaced evenly all the way around. The angle between any two spokes next to each other is 9°. The spokes fill the whole 360° turn. How many spokes does the wheel have?
      answer: { value: 40, tolerance: 0 }
      explanation: |
        Find how many 9s are in 360: 360 ÷ 9 = 40, because 9 × 4 = 36, so 9 × 40 = 360. The wheel has 40 spokes and 40 equal angles.

    - slug: g4math-w23-q14
      type: short_answer
      topic_code: "4.MD.C.5"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 2
      prompt: |
        The minute hand of a clock moves from the 12 to the 3.

        (a) How many degrees does it turn?
        (b) Explain how you know. Use the fact that a full turn is 360°.
      answer: |
        (a) 90°.
        (b) The 12 numbers split the full 360° turn into 12 equal steps of 360 ÷ 12 = 30°. From 12 to 3 is 3 steps, and 3 × 30 = 90°. (Or: 12 to 3 is a quarter of the clock, and 360 ÷ 4 = 90.)
      explanation: |
        Two points.

        (a) 1 pt: 90°.

        (b) 1 pt: uses 360°, either as 12 steps of 30° (3 × 30 = 90) or as a quarter turn (360 ÷ 4 = 90). Saying "it is a right angle, a square corner" without numbers earns the point only if it also says a quarter of 360 is 90.
