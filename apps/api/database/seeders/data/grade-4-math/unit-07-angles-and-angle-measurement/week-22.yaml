week: 22
unit: 7
title: "Points, Lines, Rays and Angles"
topics: ["4.G.A.1"]
guide: guides/week-22.md
guide_description: |
  The building blocks of geometry: points, lines, line segments and rays, how to name each one with letters,
  what an angle and its vertex are, and how to spot parallel, perpendicular and intersecting lines on maps,
  letters and shapes.
flashcards_description: |
  20 cards on points, lines, segments and rays, naming them with letters, angles and their vertex, right,
  acute and obtuse angles compared with a square corner, and parallel, perpendicular and intersecting lines.

flashcards:
  - front: Point (geometry) → what it is
    back: |
      An exact spot. It has no length or width. We draw it as a dot and name it with a capital letter, like point P.
    topic_code: "4.G.A.1"
  - front: Line (geometry) → what it is
    back: |
      A perfectly straight path that goes on forever in both directions. We draw arrows on both ends to show that.
    topic_code: "4.G.A.1"
  - front: Line segment → what it is
    back: |
      A part of a line with two endpoints. It has a length you can measure, like the edge of a ruler.
    topic_code: "4.G.A.1"
  - front: Ray → what it is
    back: |
      A part of a line that starts at one endpoint and goes on forever in one direction, like a beam from a flashlight.
    topic_code: "4.G.A.1"
  - front: Endpoint → what it is
    back: |
      A point where a segment or a ray stops. A segment has 2 endpoints, a ray has 1 and a line has none.
    topic_code: "4.G.A.1"
  - front: Naming a line through points P and Q
    back: |
      Line PQ or line QP. The order of the letters does not matter for a line.
    topic_code: "4.G.A.1"
  - front: Naming a segment with endpoints J and K
    back: |
      Segment JK or segment KJ. Both endpoints are named, in either order.
    topic_code: "4.G.A.1"
  - front: Naming a ray → which letter goes first
    back: |
      The endpoint always comes first. A ray that starts at M and goes through N is ray MN, not ray NM.
    topic_code: "4.G.A.1"
  - front: Angle (geometry) → what it is
    back: |
      Two rays that share the same endpoint. The rays are the sides of the angle.
    topic_code: "4.G.A.1"
  - front: Vertex of an angle → what it is
    back: |
      The shared endpoint where the two rays of an angle meet. Its letter goes in the middle of the angle's name.
    topic_code: "4.G.A.1"
  - front: Naming angle ABC → which point is the vertex
    back: |
      B, the middle letter. Angle ABC is made of ray BA and ray BC. It can also be called angle CBA.
    topic_code: "4.G.A.1"
  - front: Right angle → what it looks like
    back: |
      A square corner, like the corner of a sheet of paper or a book. It is often marked with a small square.
    topic_code: "4.G.A.1"
  - front: Acute angle → compared with a square corner
    back: |
      Narrower than a square corner. If you hold a paper corner in it, the paper corner sticks out past one ray.
    topic_code: "4.G.A.1"
  - front: Obtuse angle → compared with a square corner
    back: |
      Wider than a square corner but not opened all the way into a straight line.
    topic_code: "4.G.A.1"
  - front: Intersecting lines → what they are
    back: |
      Lines that cross each other at one point.
    topic_code: "4.G.A.1"
  - front: Perpendicular lines → what they are
    back: |
      Lines that cross and make right angles (square corners). The sides of a window frame next to each other are perpendicular.
    topic_code: "4.G.A.1"
  - front: Parallel lines → what they are
    back: |
      Lines in the same flat surface that never cross, however far they go. They stay the same distance apart, like train rails.
    topic_code: "4.G.A.1"
  - front: Parallel vs perpendicular → how to remember
    back: |
      Parallel lines never meet (the two l's in "parallel" stand side by side). Perpendicular lines meet at square corners.
    topic_code: "4.G.A.1"
  - front: Letter T in block capitals → what its segments show
    back: |
      Perpendicular segments: the bar across the top meets the stem at right angles.
    topic_code: "4.G.A.1"
  - front: Checking for a right angle → a handy tool
    back: |
      The corner of an index card or a sheet of paper. Line it up with the vertex and one ray, then see if the other ray lies along the paper's edge.
    topic_code: "4.G.A.1"

quiz:
  description: |
    14 questions · about 30 minutes · points, lines, segments and rays and how to name them, angles and their
    vertex, square corners, and parallel and perpendicular lines, plus review of multiplying, dividing,
    measurement and two-step problems. Multiple choice, select-all, true/false and number answers are graded
    at once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w22-q01
      type: multiple_choice
      topic_code: "4.G.A.1"
      source: "IM K–5 Math Grade 4, Unit 7, Section A"
      points: 1
      stimulus: |
        Use the four figures. A dot is a point, and an arrow means the figure keeps going forever in that direction.
      figure: figures/w22-four-figures.svg
      figure_alt: "Four figures in four boxes. Figure 1: a straight path between point J and point K, with a dot at each end and no arrows. Figure 2: a straight path that starts at a dot at point M, passes through point N and ends in an arrow on the right. Figure 3: a straight path with arrows at both ends that passes through points P and Q. Figure 4: two straight paths that start at the same dot, point B. One goes right through point C to an arrow; the other goes up and to the right through point A to an arrow."
      prompt: |
        Which figure is a single ray?
      options:
        - "Figure 1"
        - "Figure 2"
        - "Figure 3"
        - "Figure 4"
      option_explanations:
        - |
          Figure 1 has an endpoint at J and another at K and no arrows, so it is a line segment, not a ray.
        - |
          Correct. Figure 2 starts at the endpoint M and has an arrow on one end only, so it goes on forever in one direction.
        - |
          Figure 3 has arrows on both ends, so it goes on forever both ways. That makes it a line, not a ray.
        - |
          Figure 4 is made of two rays that share the endpoint B, so it is an angle, not one single ray.
      answer: 1

    - slug: g4math-w22-q02
      type: multiple_choice
      topic_code: "4.G.A.1"
      source: "IM K–5 Math Grade 4, Unit 7, Section A"
      points: 1
      stimulus: |
        Use the four figures. A dot is a point, and an arrow means the figure keeps going forever in that direction.
      prompt: |
        What is the correct name for Figure 2?
      options:
        - "segment MN"
        - "line MN"
        - "ray NM"
        - "ray MN"
      option_explanations:
        - |
          A segment has two endpoints. Figure 2 has an arrow on the right, so it does not stop at N.
        - |
          A line has arrows on both ends. Figure 2 stops at M on the left, so it is not a line.
        - |
          Ray NM would start at N and go toward M forever. Figure 2 starts at M, and a ray's name starts with its endpoint.
        - |
          Correct. The ray starts at the endpoint M and goes through N, and the endpoint is always written first: ray MN.
      answer: 3

    - slug: g4math-w22-q03
      type: multiple_choice
      topic_code: "4.G.A.1"
      source: "IM K–5 Math Grade 4, Unit 7, Section A"
      points: 1
      stimulus: |
        Use the four figures. A dot is a point, and an arrow means the figure keeps going forever in that direction.
      prompt: |
        Which is a correct name for the angle in Figure 4?
      options:
        - "angle BAC"
        - "angle ACB"
        - "angle ABC"
        - "angle CAB"
      option_explanations:
        - |
          Angle BAC would have its vertex at A, the middle letter. The rays in Figure 4 meet at B, not at A.
        - |
          Angle ACB would have its vertex at C. In Figure 4, C is just a point on one ray; the rays meet at B.
        - |
          Correct. The two rays meet at B, so B is the vertex and goes in the middle: angle ABC (or angle CBA).
        - |
          Angle CAB puts A in the middle as the vertex. The vertex in Figure 4 is B, where the two rays start.
      answer: 2

    - slug: g4math-w22-q04
      type: fill_blank
      topic_code: "4.G.A.1"
      source: "IM K–5 Math Grade 4, Unit 7, Section A"
      points: 1
      prompt: |
        The point where the two rays of an angle meet is called the ____ of the angle.
      answer: ["vertex", "the vertex", "a vertex", "vertices"]
      explanation: |
        The vertex is the shared endpoint of the two rays. In angle ABC the vertex is B, the middle letter.

    - slug: g4math-w22-q05
      type: multiple_choice
      topic_code: "4.G.A.1"
      source: "IM K–5 Math Grade 4, Unit 7, Section A"
      points: 1
      stimulus: |
        Use the street map. Each street is drawn as a straight line, and a small square marks a right angle.
      figure: figures/w22-street-map.svg
      figure_alt: "A street map with four straight streets drawn as lines with arrows at both ends. Oak Street runs straight across near the top and Pine Street straight across near the bottom, always the same distance apart. Main Street runs straight up and down on the left and crosses both, with a small square marking a right angle at each crossing. Hill Road slants up to the right on the right side and crosses both Oak Street and Pine Street, not at right angles."
      prompt: |
        Which street is parallel to Oak Street?
      options:
        - "Pine Street"
        - "Main Street"
        - "Hill Road"
        - "No street on the map"
      option_explanations:
        - |
          Correct. Pine Street runs the same way as Oak Street and stays the same distance from it, so they never meet.
        - |
          Main Street crosses Oak Street and makes right angles, so it is perpendicular to Oak Street, not parallel.
        - |
          Hill Road crosses Oak Street on the right side of the map. Lines that cross are never parallel.
        - |
          There is a parallel street: Pine Street never crosses Oak Street and stays the same distance away from it.
      answer: 0

    - slug: g4math-w22-q06
      type: multi_select
      topic_code: "4.G.A.1"
      source: "IM K–5 Math Grade 4, Unit 7, Section A"
      points: 2
      partial_credit: true
      stimulus: |
        Use the street map. Each street is drawn as a straight line, and a small square marks a right angle.
      prompt: |
        Which sentences about the map are true? Select all that apply.
      options:
        - "Main Street is perpendicular to Oak Street."
        - "Hill Road is parallel to Pine Street."
        - "Hill Road intersects Oak Street."
        - "Oak Street and Pine Street would never meet, even if they went on forever."
        - "Main Street is parallel to Hill Road."
      option_explanations:
        - |
          True. Main Street crosses Oak Street and the small square shows a right angle, so they are perpendicular.
        - |
          False. Hill Road crosses Pine Street near the bottom right, and lines that cross are not parallel.
        - |
          True. Hill Road crosses Oak Street near the top right, so the two streets intersect.
        - |
          True. Oak Street and Pine Street are parallel, so they stay the same distance apart and never meet.
        - |
          False. Main Street goes straight up and down but Hill Road slants, so if they kept going they would cross.
      answer: [0, 2, 3]

    - slug: g4math-w22-q07
      type: true_false
      topic_code: "4.G.A.1"
      source: "IM K–5 Math Grade 4, Unit 7, Section A"
      points: 1
      prompt: |
        True or false: a line segment goes on forever in both directions.
      answer: false
      explanation: |
        False. A line segment has two endpoints, so it stops at both ends and has a length you can measure. A line is the figure that goes on forever both ways.

    - slug: g4math-w22-q08
      type: multiple_choice
      topic_code: "4.G.A.1"
      source: "IM K–5 Math Grade 4, Unit 7, Section A"
      points: 1
      prompt: |
        Two lines cross and make four square corners where they meet. What are these lines called?
      options:
        - "parallel lines"
        - "perpendicular lines"
        - "rays"
        - "line segments"
      option_explanations:
        - |
          Parallel lines never cross at all. These lines do cross, so they cannot be parallel.
        - |
          Correct. Lines that cross and make right angles (square corners) are perpendicular lines.
        - |
          A ray has an endpoint and goes one way. The question says the figures are lines, and asks how they meet.
        - |
          Segments have two endpoints. The question is about how two lines cross, and square corners mean perpendicular.
      answer: 1

    - slug: g4math-w22-q09
      type: numeric
      topic_code: "4.G.A.1"
      source: "IM K–5 Math Grade 4, Unit 7, Section A"
      points: 1
      figure: figures/w22-house-shape.svg
      figure_alt: "A five-sided shape shaped like a house. The bottom side is flat, the two walls go straight up from it, and two slanted sides meet at a point on top like a roof. The two bottom corners, where the walls meet the floor, are square corners. The two corners where the walls meet the roof and the corner at the top of the roof are all wider than a square corner."
      prompt: |
        The house shape has 5 angles inside it. How many of them are right angles?
      answer: { value: 2, tolerance: 0 }
      explanation: |
        Only the two bottom corners, where each straight-up wall meets the flat floor, are square corners. The two corners where the walls meet the roof and the corner at the top of the roof are all wider than a square corner, so they are obtuse. 2 right angles.

    - slug: g4math-w22-q10
      type: multiple_choice
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 6, Section B"
      points: 1
      prompt: |
        A school buys 24 boxes of rulers with 36 rulers in each box. How many rulers is that?
      options:
        - "624"
        - "744"
        - "864"
        - "60"
      option_explanations:
        - |
          624 is only 20 × 30 = 600 and 4 × 6 = 24. The parts 20 × 6 = 120 and 4 × 30 = 120 were left out.
        - |
          744 has three of the four partial products (600 + 120 + 24) but leaves out one 120.
        - |
          Correct. 20 × 30 = 600, 20 × 6 = 120, 4 × 30 = 120 and 4 × 6 = 24. 600 + 120 + 120 + 24 = 864 rulers.
        - |
          60 is 24 + 36. The boxes are equal groups of 36, so multiply 24 × 36 instead of adding.
      answer: 2

    - slug: g4math-w22-q11
      type: numeric
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 6, Section C"
      points: 1
      prompt: |
        Mr. Osei has 156 straws to share equally among 6 groups for a building project. How many straws does each group get?
      answer: { value: 26, tolerance: 0 }
      explanation: |
        156 ÷ 6. Take out 20 groups of 6 (120), leaving 36, then 6 more groups of 6 (36), leaving 0. 20 + 6 = 26 straws each. Check: 26 × 6 = 156.

    - slug: g4math-w22-q12
      type: multiple_choice
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 1
      prompt: |
        Ruby draws a line segment on the playground with chalk. It is 3 meters long. How many centimeters long is it?
      options:
        - "300"
        - "30"
        - "3,000"
        - "103"
      option_explanations:
        - |
          Correct. 1 meter is 100 centimeters, so 3 meters is 3 × 100 = 300 centimeters.
        - |
          30 would be right if 1 meter were 10 centimeters, but 1 meter is 100 centimeters.
        - |
          3,000 uses 1,000 for each meter. 1,000 is how many meters are in a kilometer; a meter is 100 centimeters.
        - |
          103 adds 3 to 100. Each of the 3 meters is 100 centimeters, so multiply: 3 × 100.
      answer: 0

    - slug: g4math-w22-q13
      type: numeric
      topic_code: "4.OA.A.3"
      source: "IM K–5 Math Grade 4, Unit 6, Section D"
      points: 1
      prompt: |
        Kiri has 85 craft sticks. She uses 6 sticks to make each of 12 shapes. How many sticks does she have left?
      answer: { value: 13, tolerance: 0 }
      explanation: |
        Two steps. First the sticks used: 12 × 6 = 72. Then the sticks left: 85 − 72 = 13 sticks.

    - slug: g4math-w22-q14
      type: short_answer
      topic_code: "4.G.A.1"
      source: "IM K–5 Math Grade 4, Unit 7, Section A"
      points: 2
      prompt: |
        Ana says ray CD and ray DC are two names for the same ray.

        (a) Is Ana right? Write yes or no.
        (b) Explain how you know. Tell where each ray starts and which way it goes.
      answer: |
        (a) No.
        (b) Ray CD starts at point C and goes through D forever. Ray DC starts at point D and goes through C forever, the other way. They start at different points and point in opposite directions, so they are different rays.
      explanation: |
        Two points.

        (a) 1 pt: no.

        (b) 1 pt: says that the first letter is the endpoint, so ray CD starts at C and ray DC starts at D, or that the two rays go in opposite directions. A labeled drawing of both rays also earns the point.
