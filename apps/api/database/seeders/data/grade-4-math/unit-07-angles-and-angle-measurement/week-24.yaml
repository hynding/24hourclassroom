week: 24
unit: 7
title: "Measuring and Drawing Angles With a Protractor"
topics: ["4.MD.C.6"]
guide: guides/week-24.md
guide_description: |
  How a protractor works, how to line it up on an angle, how to choose between its two rows of numbers,
  how to measure an angle whose rays are not on 0, and how to draw an angle of a given size, with the
  common mix-ups and how to catch them.
flashcards_description: |
  18 cards on the parts of a protractor, the steps for measuring and drawing an angle, choosing the right
  scale, checking with benchmark angles, and measuring when neither ray is on 0.

flashcards:
  - front: Protractor → what it is
    back: |
      A tool for measuring and drawing angles in degrees. Most are half circles marked from 0° to 180°.
    topic_code: "4.MD.C.6"
  - front: Center mark of a protractor → where it goes
    back: |
      Exactly on the vertex of the angle. It is the small hole, dot or cross in the middle of the straight edge.
    topic_code: "4.MD.C.6"
  - front: Baseline of a protractor → what it is
    back: |
      The straight line through the center mark that runs from 0 on one side to 180 on the other. One ray of the angle lies along it.
    topic_code: "4.MD.C.6"
  - front: Two rows of numbers on a protractor → why
    back: |
      So you can measure from either side. One row starts at 0 on the right, the other starts at 0 on the left.
    topic_code: "4.MD.C.6"
  - front: Measuring an angle → step 1
    back: |
      Put the protractor's center mark on the vertex.
    topic_code: "4.MD.C.6"
  - front: Measuring an angle → step 2
    back: |
      Turn the protractor so one ray lies along the baseline and passes through a 0.
    topic_code: "4.MD.C.6"
  - front: Measuring an angle → step 3
    back: |
      Follow the row of numbers that starts at 0 on your first ray. Read where the other ray crosses that same row.
    topic_code: "4.MD.C.6"
  - front: Ray crosses 60 and 120 → how to choose
    back: |
      Check the angle's size. A narrow (acute) angle is 60°; a wide (obtuse) angle is 120°. Or use the row that starts at 0 on the other ray.
    topic_code: "4.MD.C.6"
  - front: Ray too short to reach the numbers → what to do
    back: |
      Make the ray longer with a ruler. A longer ray does not change the angle, and now it reaches the scale.
    topic_code: "4.MD.C.6"
  - front: Neither ray on 0 → how to measure
    back: |
      Read both rays on the same row and subtract. Rays at 25 and 90 make 90 − 25 = 65°.
    topic_code: "4.MD.C.6"
  - front: Drawing a 70° angle → step 1
    back: |
      Draw one ray with a ruler. Its endpoint will be the vertex.
    topic_code: "4.MD.C.6"
  - front: Drawing a 70° angle → step 2
    back: |
      Put the center mark on the endpoint and line up the baseline with the ray, so the ray passes through a 0.
    topic_code: "4.MD.C.6"
  - front: Drawing a 70° angle → step 3
    back: |
      On the row that starts at 0 on your ray, make a dot at 70. Remove the protractor and draw a ray from the vertex through the dot.
    topic_code: "4.MD.C.6"
  - front: Checking a measurement → a quick test
    back: |
      Compare with a square corner. If the angle is acute, the number must be less than 90; if obtuse, more than 90.
    topic_code: "4.MD.C.6"
  - front: Wrong-row mistake → how to spot it
    back: |
      The two readings on a ray always add to 180, like 40 and 140. If your answer does not fit the angle's size, you used the other one.
    topic_code: "4.MD.C.6"
  - front: Small marks on a protractor → what each one is
    back: |
      1 degree. Longer marks show every 5 and every 10 degrees, so count on from the nearest 10.
    topic_code: "4.MD.C.6"
  - front: Measuring a 180° angle → what you see
    back: |
      The two rays lie along the whole baseline, one through each 0 end. It is a straight angle.
    topic_code: "4.MD.C.6"
  - front: Measuring an angle bigger than the protractor's edge → tip
    back: |
      It does not matter how long the rays are. Line up the vertex and one ray, extend the other ray if needed, then read.
    topic_code: "4.MD.C.6"

quiz:
  description: |
    14 questions · about 30 minutes · reading a protractor, choosing the right row of numbers, measuring when
    neither ray is on 0, and drawing angles, plus review of degrees and turns, naming rays and rounding large
    numbers. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word is
    matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w24-q01
      type: multiple_choice
      topic_code: "4.MD.C.6"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      figure: figures/w24-protractor-50.svg
      figure_alt: "A protractor on an angle, its center dot on the vertex. One red ray points straight to the right along the protractor's bottom edge. Marks show every degree; the outer black numbers run 0 to 180 from left to right and the inner blue numbers 0 to 180 from right to left. The other red ray points up and to the right and crosses the edge at the inner blue 50 and the outer black 130. A green arc marks the angle between the two rays."
      prompt: |
        What is the measure of the angle?
      options:
        - "50°"
        - "130°"
        - "40°"
        - "90°"
      option_explanations:
        - |
          Correct. The first ray passes through the blue 0 on the right, so read the blue row: the other ray crosses at 50.
        - |
          130 is on the black row, which starts at 0 on the left, not on this angle's first ray. The angle is narrower than a square corner, so it cannot be 130°.
        - |
          40 is one ten short. Count the blue numbers from 0: 10, 20, 30, 40, 50. The ray crosses at 50.
        - |
          90 is a square corner, where the ray would point straight up. This ray leans to the right, so the angle is less than 90°.
      answer: 0

    - slug: g4math-w24-q02
      type: multiple_choice
      topic_code: "4.MD.C.6"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      stimulus: |
        Use the protractor picture. One ray points to the left along the bottom edge of the protractor.
      figure: figures/w24-protractor-135.svg
      figure_alt: "A protractor on an angle, its center dot on the vertex. One red ray points left along the bottom edge, through the outer black 0. Marks show every degree; the outer black numbers run 0 to 180 from left to right and the inner blue numbers 0 to 180 from right to left. The other red ray points up and to the right, crossing halfway between 130 and 140 on the black row (135) and halfway between 40 and 50 on the blue row (45). A green arc marks the wide angle between the rays."
      prompt: |
        What is the measure of the angle?
      options:
        - "45°"
        - "125°"
        - "135°"
        - "145°"
      option_explanations:
        - |
          45 is on the blue row, which starts at 0 on the right. The first ray points left through the black 0, and this angle is wider than a square corner.
        - |
          125 counts back from 130 instead of on. The ray is halfway past 130 toward 140, at 135.
        - |
          Correct. The first ray passes through the black 0 on the left, so read the black row: the other ray crosses halfway between 130 and 140, at 135.
        - |
          145 is past 140. The ray crosses before 140, at the long half-way mark between 130 and 140.
      answer: 2

    - slug: g4math-w24-q03
      type: numeric
      topic_code: "4.MD.C.6"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      stimulus: |
        Use the protractor picture. One ray points to the left along the bottom edge of the protractor.
      prompt: |
        How many more degrees would the angle need to open to become a straight angle?
      answer: { value: 45, tolerance: 0 }
      explanation: |
        The angle measures 135°. A straight angle is 180°, and 180 − 135 = 45. So it needs 45 more degrees.

    - slug: g4math-w24-q04
      type: numeric
      topic_code: "4.MD.C.6"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      figure: figures/w24-protractor-between.svg
      figure_alt: "A protractor on an angle whose rays are not on 0, its center dot on the vertex. Marks show every degree; the outer black numbers run 0 to 180 from left to right and the inner blue numbers 0 to 180 from right to left. One red ray crosses the edge at the inner blue 20 (outer black 160). The other red ray crosses at the inner blue 95, halfway between 90 and 100 (outer black 85). A green arc marks the angle between the two rays."
      prompt: |
        Neither ray of this angle is on 0. What is the measure of the angle in degrees?
      answer: { value: 75, tolerance: 0 }
      explanation: |
        Read both rays on the same row. On the blue row they cross at 20 and at 95, so the angle is 95 − 20 = 75°. The black row gives the same answer: 160 − 85 = 75°.

    - slug: g4math-w24-q05
      type: multiple_choice
      topic_code: "4.MD.C.6"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      figure: figures/w24-protractor-lin.svg
      figure_alt: "Lin's angle on a protractor, its center dot on the vertex. One red ray points straight to the right along the bottom edge, through the inner blue 0. Marks show every degree; the outer black numbers run 0 to 180 from left to right and the inner blue numbers 0 to 180 from right to left. The other red ray points up and a little to the left and crosses the edge at the outer black 70 and the inner blue 110. A green arc marks the angle between the two rays, which is wider than a square corner."
      prompt: |
        Lin wanted to draw a 70° angle. Her first ray goes through the blue 0 on the right. Which sentence describes her drawing?
      options:
        - "She drew a 70° angle correctly."
        - "She made her dot at 70 on the black row, so she drew a 110° angle."
        - "She drew a 60° angle, because she counted one ten short."
        - "She put the vertex on the wrong spot, so the angle cannot be measured."
      option_explanations:
        - |
          A 70° angle is narrower than a square corner. Lin's angle is wider than a square corner, so it is not 70°.
        - |
          Correct. Her first ray is on the blue 0, so she should have used the blue row. She used 70 on the black row, and on the blue row that ray is at 110°.
        - |
          The ray crosses at 70 on the black row and 110 on the blue row. Neither row shows 60 where her ray crosses.
        - |
          The vertex is on the center dot, which is the right place. The mistake is the row of numbers she used.
      answer: 1

    - slug: g4math-w24-q06
      type: fill_blank
      topic_code: "4.MD.C.6"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      prompt: |
        A tool shaped like a half circle that is used to measure and draw angles in degrees is called a ____.
      answer: ["protractor", "a protractor", "the protractor", "protractors"]
      explanation: |
        A protractor has a center mark for the vertex, a straight baseline, and two rows of numbers from 0° to 180°.

    - slug: g4math-w24-q07
      type: multi_select
      topic_code: "4.MD.C.6"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which steps are part of measuring an angle with a protractor? Select all that apply.
      options:
        - "Put the center mark of the protractor on the vertex."
        - "Line up one ray with the baseline so it passes through a 0."
        - "Read where the other ray crosses the row of numbers that starts at 0 on the first ray."
        - "Always read the outside row of numbers."
        - "Line up the end of the protractor with the end of a ray instead of the vertex."
      option_explanations:
        - |
          Yes. The center mark must sit exactly on the vertex, where the two rays meet.
        - |
          Yes. One ray lies along the baseline through a 0, so you start counting from 0.
        - |
          Yes. Follow the row that starts at 0 on the first ray, and read where the second ray crosses it.
        - |
          No. Which row you read depends on which side your first ray is on. Sometimes it is the inside row.
        - |
          No. The ends of the rays do not matter. The center mark always goes on the vertex.
      answer: [0, 1, 2]

    - slug: g4math-w24-q08
      type: multiple_choice
      topic_code: "4.MD.C.6"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      prompt: |
        Max measured an angle and wrote 120°. Then he noticed the angle is narrower than a square corner. What is the most likely measure of the angle?
      options:
        - "120°, because the protractor showed 120"
        - "210°, because 90 + 120 = 210"
        - "20°, because he should drop the 1"
        - "60°, because he read the other row and 180 − 120 = 60"
      option_explanations:
        - |
          An angle narrower than a square corner is less than 90°, so it cannot be 120°. The reading must be from the wrong row.
        - |
          210° is more than a straight angle. Adding 90 does not fix a reading; the angle is less than 90°.
        - |
          Dropping a digit is not how the two rows are related. The two numbers where a ray crosses always add to 180.
        - |
          Correct. Where the ray crossed 120 on one row, the other row shows 180 − 120 = 60. Since the angle is acute, it is 60°.
      answer: 3

    - slug: g4math-w24-q09
      type: multiple_choice
      topic_code: "4.MD.C.6"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      prompt: |
        To draw a 35° angle, Tamika draws a ray. She puts the protractor's center mark on the ray's endpoint and lines up the ray with a 0. What should she do next?
      options:
        - "Make a dot at 35 on the row that starts at 0 on her ray, then draw a ray from the endpoint through the dot."
        - "Make a dot at 35 on the other row, then draw a ray from the endpoint through the dot."
        - "Draw a ray 35 centimeters long along the baseline."
        - "Make a dot at 35 on the row that starts at 0 on her ray, then draw a ray from that dot to the 0 mark."
      option_explanations:
        - |
          Correct. Counting from the 0 on her ray to 35 opens the angle 35°, and the new ray must start at the vertex.
        - |
          On the other row, the 35 mark is 145° away from her ray, so she would draw a 145° angle.
        - |
          The length of a ray has nothing to do with the angle. Degrees measure the turn, not centimeters.
        - |
          An angle's rays must both start at the vertex. A line from the dot to the 0 mark would not start at the vertex.
      answer: 0

    - slug: g4math-w24-q10
      type: numeric
      topic_code: "4.MD.C.5"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      prompt: |
        A fan blade turns through 1/10 of a full turn. How many degrees does it turn?
      answer: { value: 36, tolerance: 0 }
      explanation: |
        A full turn is 360°. One tenth of it is 360 ÷ 10 = 36°.

    - slug: g4math-w24-q11
      type: multiple_choice
      topic_code: "4.G.A.1"
      source: "IM K–5 Math Grade 4, Unit 7, Section A"
      points: 1
      prompt: |
        A figure starts at point G and goes on forever through point H. What is its name?
      options:
        - "segment GH"
        - "ray HG"
        - "ray GH"
        - "line GH"
      option_explanations:
        - |
          A segment stops at both ends. This figure goes on forever past H, so it is not a segment.
        - |
          Ray HG would start at H. A ray's name begins with its endpoint, and this figure starts at G.
        - |
          Correct. It has one endpoint, G, and goes on forever through H, so it is a ray, named endpoint first: ray GH.
        - |
          A line goes on forever in both directions. This figure starts at G, so it only goes one way.
      answer: 2

    - slug: g4math-w24-q12
      type: multiple_choice
      topic_code: "4.NBT.A.3"
      source: "IM K–5 Math Grade 4, Unit 4, Section C"
      points: 1
      prompt: |
        A factory made 148,562 protractors last year. What is that number rounded to the nearest thousand?
      options:
        - "148,000"
        - "149,000"
        - "150,000"
        - "148,600"
      option_explanations:
        - |
          148,000 rounds down, but the hundreds digit is 5, so the number is at least halfway to 149,000 and rounds up.
        - |
          Correct. 148,562 is between 148,000 and 149,000. The hundreds digit is 5, so it rounds up to 149,000.
        - |
          150,000 is the number rounded to the nearest ten thousand, not the nearest thousand.
        - |
          148,600 is the number rounded to the nearest hundred, not the nearest thousand.
      answer: 1

    - slug: g4math-w24-q13
      type: true_false
      topic_code: "4.MD.C.5"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 1
      prompt: |
        True or false: if you draw the same angle twice, once with long rays and once with short rays, the angle with the long rays has a bigger measure.
      answer: false
      explanation: |
        False. An angle's measure is how far one ray turns from the other, not how long the rays are drawn. Both angles have the same measure.

    - slug: g4math-w24-q14
      type: short_answer
      topic_code: "4.MD.C.6"
      source: "IM K–5 Math Grade 4, Unit 7, Section B"
      points: 2
      prompt: |
        (a) Write the steps to draw a 140° angle with a protractor.
        (b) Is a 140° angle acute, right or obtuse? Explain how you know.
      answer: |
        (a) Draw a ray with a ruler. Put the protractor's center mark on the ray's endpoint and line the ray up with a 0 on the baseline. On the row of numbers that starts at that 0, make a dot at 140. Remove the protractor and draw a ray from the endpoint through the dot.
        (b) Obtuse, because 140° is more than 90° and less than 180°.
      explanation: |
        Two points.

        (a) 1 pt: the steps include the center mark on the endpoint, the ray on 0, a dot at 140 on the row that starts at 0 on the ray, and a ray from the endpoint through the dot. Missing the "same row" idea is fine only if the steps otherwise make a 140° angle.

        (b) 1 pt: obtuse, with a reason comparing 140 with 90 (and 180).
