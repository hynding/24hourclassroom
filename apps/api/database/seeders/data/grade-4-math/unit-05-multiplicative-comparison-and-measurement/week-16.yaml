week: 16
unit: 5
title: "Measurement Word Problems: Distance, Time, Liquid, Mass and Money"
topics: ["4.MD.A.2"]
guide: guides/week-16.md
guide_description: |
  How to solve word problems about distance, elapsed time, liquid volume, mass and money: change the amounts
  to the same unit, draw a number line or a tape diagram, use all four operations, work in cents for money,
  and check that the answer makes sense.
flashcards_description: |
  18 cards on putting measurements in the same unit before you add or subtract, elapsed time on a number
  line, sharing liquid and mass equally, fractions of an hour, dollars and cents, making change, and
  checking an answer.

flashcards:
  - front: Measurement word problem → first step
    back: |
      Check the units. If the story uses two units, such as km and m, change them to the same unit before you add or subtract.
    topic_code: "4.MD.A.2"
  - front: Elapsed time → what it is
    back: |
      The amount of time that passes from the start to the end. 2:00 to 2:45 is 45 minutes of elapsed time.
    topic_code: "4.MD.A.2"
  - front: Elapsed time on a number line → how
    back: |
      Jump to the next full hour, then by hours, then the minutes that are left. Add the jumps: 8:50 to 10:20 is 10 min + 1 hr + 20 min = 1 hr 30 min.
    topic_code: "4.MD.A.2"
  - front: Elapsed time mistake → subtracting like ordinary numbers
    back: |
      10:20 − 8:50 is not 1 hr 70 min. An hour has 60 minutes, not 100. Count on with jumps instead.
    topic_code: "4.MD.A.2"
  - front: 110 minutes → hours and minutes
    back: |
      110 = 60 + 50, so 110 minutes is 1 hour 50 minutes.
    topic_code: "4.MD.A.2"
  - front: 1/2 hour → minutes
    back: |
      60 ÷ 2 = 30 minutes.
    topic_code: "4.MD.A.2"
  - front: 1/4 hour → minutes
    back: |
      60 ÷ 4 = 15 minutes. So 3/4 hour is 3 × 15 = 45 minutes.
    topic_code: "4.MD.A.2"
  - front: Dollars to cents → the fact
    back: |
      $1 = 100 cents. So $3.45 is 345 cents: 3 dollars and 45 cents.
    topic_code: "4.MD.A.2"
  - front: Coin values → quarter, dime, nickel
    back: |
      A quarter is 25¢, a dime is 10¢ and a nickel is 5¢. Four quarters make $1.00.
    topic_code: "4.MD.A.2"
  - front: Making change → how
    back: |
      Subtract the cost from the money paid, in cents. Pay $5.00 for a $3.70 book: 500 − 370 = 130¢, which is $1.30 change.
    topic_code: "4.MD.A.2"
  - front: Money mistake → mixing dollars and cents
    back: |
      $2 + 50¢ is not 52¢. Write both in cents first: 200 + 50 = 250¢, which is $2.50.
    topic_code: "4.MD.A.2"
  - front: Sharing liquid equally → example
    back: |
      3 L of juice poured equally into 6 bottles: 3 L = 3,000 mL, and 3,000 ÷ 6 = 500 mL in each bottle.
    topic_code: "4.MD.A.2"
  - front: Mass left over → example
    back: |
      A 3 kg bag of rice, and 800 g is used. 3 kg = 3,000 g, and 3,000 − 800 = 2,200 g left.
    topic_code: "4.MD.A.2"
  - front: Distance in two units → example
    back: |
      Bike 4 km and then 700 m. 4 km = 4,000 m, and 4,000 + 700 = 4,700 m in all.
    topic_code: "4.MD.A.2"
  - front: Tape diagram in a measurement problem → when it helps
    back: |
      When a total is cut into equal parts or two amounts are compared, such as a 3 m rope cut into pieces of 50 cm.
    topic_code: "4.MD.A.2"
  - front: Mixed units like 3 hr 25 min → one unit
    back: |
      Change the larger unit and add the rest: 3 hr = 180 min, and 180 + 25 = 205 min.
    topic_code: "4.MD.A.2"
  - front: Measurement answer → always write the unit
    back: |
      "4,700" alone does not say how far. "4,700 m" does. The unit is part of the answer.
    topic_code: "4.MD.A.2"
  - front: Measurement answer check → does it make sense?
    back: |
      Ask whether the size fits. A cup of water is a few hundred mL, not 5 L, and a walk to school is not 3,000 km.
    topic_code: "4.MD.A.2"

quiz:
  description: |
    15 questions · about 30 minutes · word problems about distance, elapsed time, liquid volume, mass and
    money, with an open number line and a picture of bills and coins, fractions of an hour, making change,
    plus review of unit conversions, comparing by multiplying and adding mixed numbers. Multiple choice,
    select-all, true/false and number answers are graded at once; the fill-in word is matched automatically;
    the short answer is checked by your teacher.
  questions:
    - slug: g4math-w16-q01
      type: numeric
      topic_code: "4.MD.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section C"
      points: 1
      stimulus: |
        Use the number line. Soccer practice starts at 9:40 and ends at 11:15 in the morning.
      figure: figures/w16-elapsed-time.svg
      figure_alt: "An open number line for time with tick marks labeled 9:40, 10:00, 11:00 and 11:15. Three jumps are drawn above it: 9:40 to 10:00 is labeled 20 min, 10:00 to 11:00 is labeled 1 hour, and 11:00 to 11:15 is labeled 15 min."
      prompt: |
        How many minutes long is soccer practice?
      answer: { value: 95, tolerance: 0 }
      explanation: |
        Add the jumps. 1 hour is 60 minutes, so 20 + 60 + 15 = 95 minutes.

    - slug: g4math-w16-q02
      type: multiple_choice
      topic_code: "4.MD.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section C"
      points: 1
      stimulus: |
        Use the number line. Soccer practice starts at 9:40 and ends at 11:15 in the morning.
      prompt: |
        How long is soccer practice in hours and minutes?
      options:
        - "1 hour 35 minutes"
        - "1 hour 75 minutes"
        - "9 hours 5 minutes"
        - "2 hours 35 minutes"
      option_explanations:
        - |
          Correct. The jumps add to 95 minutes, and 95 = 60 + 35, so practice is 1 hour 35 minutes.
        - |
          This subtracts 11:15 − 9:40 like ordinary numbers, as if an hour had 100 minutes. An hour has 60 minutes.
        - |
          This reads the 95 minutes as 9 and 5. 95 minutes is 60 minutes and 35 more, which is 1 hour 35 minutes.
        - |
          This counts the hour between 10:00 and 11:00 twice. The jumps are 20 minutes, 1 hour and 15 minutes.
      answer: 0

    - slug: g4math-w16-q03
      type: multiple_choice
      topic_code: "4.MD.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section C"
      points: 1
      stimulus: |
        Use the picture. It shows the money Ravi saved.
      figure: figures/w16-money.svg
      figure_alt: "Ravi's money: two one-dollar bills, each labeled $1, then 3 quarters labeled 25¢, 1 dime labeled 10¢ and 2 nickels labeled 5¢."
      prompt: |
        How much money did Ravi save?
      options:
        - "$8.00"
        - "$2.75"
        - "$2.95"
        - "$2.90"
      option_explanations:
        - |
          $8.00 counts each of the 8 bills and coins as one dollar. Only the bills are worth $1 each.
        - |
          $2.75 counts the bills and quarters but leaves out the dime and the 2 nickels, which add 20¢ more.
        - |
          Correct. 200¢ + 75¢ + 10¢ + 10¢ = 295¢, which is $2.95.
        - |
          $2.90 counts only one nickel. There are 2 nickels, so they are worth 10¢ together.
      answer: 2

    - slug: g4math-w16-q04
      type: numeric
      topic_code: "4.MD.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section C"
      points: 1
      stimulus: |
        Use the picture. It shows the money Ravi saved.
      prompt: |
        Ravi wants to have $5.00. How many more cents does he need? Answer in cents.
      answer: { value: 205, tolerance: 0 }
      explanation: |
        Ravi has $2.95, which is 295 cents. $5.00 is 500 cents, and 500 − 295 = 205 cents (that is $2.05).

    - slug: g4math-w16-q05
      type: multiple_choice
      topic_code: "4.MD.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section C"
      points: 1
      prompt: |
        Inés ran 3 km on Saturday and 1,500 m on Sunday. How many meters did she run in all?
      options:
        - "1,503 m"
        - "4,500 m"
        - "1,800 m"
        - "1,500 m"
      option_explanations:
        - |
          1,503 adds 3 and 1,500 without changing units. 3 km is 3,000 m, so add 3,000 + 1,500.
        - |
          Correct. 3 km = 3,000 m, and 3,000 + 1,500 = 4,500 m.
        - |
          1,800 uses 1 km = 100 m, so 3 km becomes 300 m. A kilometer is 1,000 meters.
        - |
          1,500 is 3,000 − 1,500, the difference. "In all" asks for the total, so add.
      answer: 1

    - slug: g4math-w16-q06
      type: numeric
      topic_code: "4.MD.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section C"
      points: 1
      prompt: |
        Mr. Okafor pours 2 L of water equally into 4 bottles. How many milliliters of water go in each bottle?
      answer: { value: 500, tolerance: 0 }
      explanation: |
        2 L = 2 × 1,000 = 2,000 mL. Shared into 4 bottles: 2,000 ÷ 4 = 500 mL in each bottle. Check: 4 × 500 = 2,000.

    - slug: g4math-w16-q07
      type: multiple_choice
      topic_code: "4.MD.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section C"
      points: 1
      prompt: |
        A bag of flour has a mass of 5 kg. Ama uses 1,250 g of it to bake bread. How much flour is left?
      options:
        - "1,245 g"
        - "6,250 g"
        - "4,750 g"
        - "3,750 g"
      option_explanations:
        - |
          1,245 subtracts 5 from 1,250 without changing units. 5 kg is 5,000 g, so find 5,000 − 1,250.
        - |
          6,250 g is 5,000 + 1,250. Ama used some flour, so there is less left, not more.
        - |
          4,750 forgets to take 1 thousand away in the thousands place. 5,000 − 1,000 − 250 = 3,750.
        - |
          Correct. 5 kg = 5,000 g, and 5,000 − 1,250 = 3,750 g are left.
      answer: 3

    - slug: g4math-w16-q08
      type: true_false
      topic_code: "4.MD.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section C"
      points: 1
      prompt: |
        True or false: a movie that is 2 hours 10 minutes long is 130 minutes long.
      answer: true
      explanation: |
        True. 2 hours = 2 × 60 = 120 minutes, and 120 + 10 = 130 minutes.

    - slug: g4math-w16-q09
      type: fill_blank
      topic_code: "4.MD.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section C"
      points: 1
      prompt: |
        The amount of time that passes from the start of an event to its end is called ____ time.
      answer: ["elapsed", "the elapsed"]
      explanation: |
        Elapsed time is the time that passes. A lesson from 1:15 to 2:00 has an elapsed time of 45 minutes.

    - slug: g4math-w16-q10
      type: multi_select
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which amounts of time are longer than 1 hour? Select all that apply.
      options:
        - "75 minutes"
        - "3,600 seconds"
        - "50 minutes"
        - "4,000 seconds"
        - "1 hour 5 minutes"
      option_explanations:
        - |
          Yes. 1 hour is 60 minutes, and 75 minutes is 15 minutes more.
        - |
          No. 1 hour = 60 minutes = 60 × 60 = 3,600 seconds, so this is exactly 1 hour, not longer.
        - |
          No. 50 minutes is 10 minutes short of an hour.
        - |
          Yes. 1 hour is 3,600 seconds, and 4,000 seconds is 400 seconds more.
        - |
          Yes. It is 1 hour and 5 more minutes, which is 65 minutes.
      answer: [0, 3, 4]

    - slug: g4math-w16-q11
      type: multiple_choice
      topic_code: "4.MD.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section C"
      points: 1
      prompt: |
        Jalen practices piano for 1/4 of an hour each day. How many minutes is that?
      options:
        - "15 minutes"
        - "25 minutes"
        - "4 minutes"
        - "30 minutes"
      option_explanations:
        - |
          Correct. An hour is 60 minutes. Split it into 4 equal parts: 60 ÷ 4 = 15 minutes.
        - |
          25 treats an hour as 100 minutes, like a dollar is 100 cents. An hour has 60 minutes, so 60 ÷ 4.
        - |
          4 is the denominator of 1/4. It tells how many equal parts the hour is split into, not the minutes.
        - |
          30 minutes is 1/2 of an hour. 1/4 of an hour is half of that, 15 minutes.
      answer: 0

    - slug: g4math-w16-q12
      type: short_answer
      topic_code: "4.MD.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section C"
      points: 2
      prompt: |
        Gel pens cost 65¢ each. Lucía has $3.00.

        (a) How many cents do 4 gel pens cost? Does Lucía have enough money to buy 4 pens?
        (b) If she buys 4 pens, how much change does she get? Show your work.
      answer: |
        (a) 4 × 65 = 260 cents ($2.60). Yes: $3.00 is 300 cents, and 260 is less than 300.
        (b) 300 − 260 = 40 cents of change.
      explanation: |
        Two points.

        (a) 1 pt: 260 cents (or $2.60) and yes, with a comparison to 300 cents or $3.00.

        (b) 1 pt: 40 cents (or $0.40), with work that subtracts 300 − 260.

    - slug: g4math-w16-q13
      type: multiple_choice
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 1
      prompt: |
        How many seconds are in 4 minutes?
      options:
        - "400 seconds"
        - "64 seconds"
        - "240 seconds"
        - "24 seconds"
      option_explanations:
        - |
          400 uses 100 seconds in a minute. A minute has 60 seconds, so multiply 4 × 60.
        - |
          64 is 60 + 4. Each of the 4 minutes has 60 seconds, so multiply instead of adding.
        - |
          Correct. 1 min = 60 sec, so 4 minutes = 4 × 60 = 240 seconds.
        - |
          24 is 4 × 6. The fact is 60 seconds in a minute, so the answer has one more zero: 240.
      answer: 2

    - slug: g4math-w16-q14
      type: numeric
      topic_code: "4.OA.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section A"
      points: 1
      prompt: |
        A sunflower is 72 inches tall. That is 8 times as tall as a seedling beside it. How many inches tall is the seedling?
      answer: { value: 9, tolerance: 0 }
      explanation: |
        The sunflower is the larger amount, so divide: 72 ÷ 8 = 9 inches. Check: 8 × 9 = 72.

    - slug: g4math-w16-q15
      type: multiple_choice
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      prompt: |
        Pita walked 2 3/8 miles in the morning and 1 2/8 miles in the afternoon. How far did she walk in all?
      options:
        - "3 5/16 miles"
        - "3 5/8 miles"
        - "1 1/8 miles"
        - "5/8 mile"
      option_explanations:
        - |
          3 5/16 adds the denominators too. Eighths plus eighths are still eighths: 3/8 + 2/8 = 5/8.
        - |
          Correct. Add the wholes, 2 + 1 = 3, and the eighths, 3/8 + 2/8 = 5/8. That makes 3 5/8 miles.
        - |
          1 1/8 is the difference, 2 3/8 − 1 2/8. "In all" asks for the total, so add.
        - |
          5/8 adds only the fraction parts. Add the whole miles too: 2 + 1 = 3, so 3 5/8 miles.
      answer: 1
