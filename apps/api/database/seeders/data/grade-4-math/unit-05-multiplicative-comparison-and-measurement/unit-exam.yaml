unit: 5
description: |
  22 questions · about 45 minutes · every standard of Unit 5: "times as many" statements and equations,
  comparison word problems with tape diagrams, telling "times as many" from "how many more", the conversion
  facts for length, mass, liquid volume and time, conversion tables, and word problems about distance, time,
  liquid volume, mass and money. Two stimulus sets share a tape diagram or a conversion table across
  consecutive items. Multiple choice, select-all, true/false and number answers are graded at once; the
  fill-in word is matched automatically; the short answer is checked by your teacher against the scoring
  notes.
questions:
  # ---- Comparing by multiplying (4.OA.A.1)
  - slug: g4math-u05-check-q01
    type: multiple_choice
    topic_code: "4.OA.A.1"
    source: "IM K–5 Math Grade 4, Unit 5, Section A"
    points: 1
    prompt: |
      Which statement matches the equation 32 = 4 × 8?
    options:
      - "32 is 4 more than 8."
      - "8 is 4 times as many as 32."
      - "32 is 4 times as many as 8."
      - "4 is 8 times as many as 32."
    option_explanations:
      - |
        4 more than 8 is 8 + 4 = 12, not 32. The equation multiplies, so it is a "times as many" statement.
      - |
        This makes 8 the larger amount, but 8 is less than 32. The larger amount, 32, is the one that is 4 times as many.
      - |
        Correct. 4 times as many as 8 is 4 × 8, which is 32.
      - |
        4 is much less than 32, so it cannot be 8 times as many as 32. The equation says 32 is 4 times 8.
    answer: 2

  - slug: g4math-u05-check-q02
    type: numeric
    topic_code: "4.OA.A.1"
    source: "IM K–5 Math Grade 4, Unit 5, Section A"
    points: 1
    prompt: |
      What number is 7 times as many as 6?
    answer: { value: 42, tolerance: 0 }
    explanation: |
      7 times as many as 6 is 7 × 6 = 42.

  # ---- Stimulus set A: a comparison tape diagram (4.OA.A.2)
  - slug: g4math-u05-check-q03
    type: numeric
    topic_code: "4.OA.A.2"
    source: "IM K–5 Math Grade 4, Unit 5, Section A"
    points: 1
    stimulus: |
      Use the tape diagram. Bea picked 54 pumpkins. That is 6 times as many pumpkins as Omar picked.
    figure: figures/u05-tape-pumpkins.svg
    figure_alt: "A tape diagram with two bars. The bar labeled Bea is 6 equal boxes, with a bracket over the whole bar labeled 54. The bar labeled Omar is one box the same size, labeled with a question mark."
    prompt: |
      How many pumpkins did Omar pick?
    answer: { value: 9, tolerance: 0 }
    explanation: |
      Bea's 54 pumpkins are 6 equal boxes, and Omar's amount is one box: 54 ÷ 6 = 9 pumpkins. Check: 6 × 9 = 54.

  - slug: g4math-u05-check-q04
    type: multiple_choice
    topic_code: "4.OA.A.2"
    source: "IM K–5 Math Grade 4, Unit 5, Section A"
    points: 1
    stimulus: |
      Use the tape diagram. Bea picked 54 pumpkins. That is 6 times as many pumpkins as Omar picked.
    prompt: |
      How many more pumpkins did Bea pick than Omar?
    options:
      - "48"
      - "45"
      - "63"
      - "6"
    option_explanations:
      - |
        48 is 54 − 6, which takes away the number of times. Omar picked 9, so subtract 54 − 9.
      - |
        Correct. Omar picked 54 ÷ 6 = 9, so Bea picked 54 − 9 = 45 more. That is 5 of the 6 boxes.
      - |
        63 is 54 + 9, the pumpkins they picked together. "How many more" asks for the difference.
      - |
        6 is how many times as many Bea picked. "How many more" asks for a difference in pumpkins.
    answer: 1

  - slug: g4math-u05-check-q05
    type: multiple_choice
    topic_code: "4.OA.A.2"
    source: "IM K–5 Math Grade 4, Unit 5, Section A"
    points: 1
    prompt: |
      A red bin holds 12 markers. A green bin holds 5 times as many markers as the red bin. How many markers does the green bin hold?
    options:
      - "60"
      - "17"
      - "7"
      - "72"
    option_explanations:
      - |
        Correct. 5 times as many as 12 is 5 × 12 = 60 markers.
      - |
        17 is 12 + 5. The green bin holds 5 times as many, not 5 more.
      - |
        7 is 12 − 5. The green bin holds more than the red bin, so its number is bigger than 12.
      - |
        72 is 6 × 12, one group too many. The green bin holds 5 groups of 12.
    answer: 0

  - slug: g4math-u05-check-q06
    type: true_false
    topic_code: "4.OA.A.1"
    source: "IM K–5 Math Grade 4, Unit 5, Section A"
    points: 1
    prompt: |
      True or false: if 40 is 8 times as many as 5, then 40 is also 5 times as many as 8.
    answer: true
    explanation: |
      True. Both sentences come from the same equation: 8 × 5 = 40 and 5 × 8 = 40.

  - slug: g4math-u05-check-q07
    type: multiple_choice
    topic_code: "4.OA.A.2"
    source: "IM K–5 Math Grade 4, Unit 5, Section A"
    points: 1
    prompt: |
      Tia has 24 beads and Lu has 6 beads. Which question is answered by 24 − 6?
    options:
      - "How many times as many beads does Tia have as Lu?"
      - "How many beads do they have together?"
      - "If Tia had 6 times as many beads as Lu's 24, how many would she have?"
      - "How many more beads does Tia have than Lu?"
    option_explanations:
      - |
        "How many times as many" is answered by dividing: 24 ÷ 6 = 4 times as many.
      - |
        "Together" asks for a total, so it is answered by adding: 24 + 6 = 30 beads.
      - |
        This one is answered by multiplying, 6 × 24. It also gives Lu 24 beads, but Lu has 6.
      - |
        Correct. "How many more" compares by subtracting: 24 − 6 = 18 more beads.
    answer: 3

  - slug: g4math-u05-check-q08
    type: numeric
    topic_code: "4.OA.A.2"
    source: "IM K–5 Math Grade 4, Unit 5, Section A"
    points: 1
    prompt: |
      A hiking trail is 48 km long. That is 6 times as long as the nature walk. How many kilometers long is the nature walk?
    answer: { value: 8, tolerance: 0 }
    explanation: |
      The trail is the longer one, so divide: 48 ÷ 6 = 8 km. Check: 6 × 8 = 48.

  - slug: g4math-u05-check-q09
    type: multi_select
    topic_code: "4.OA.A.2"
    source: "IM K–5 Math Grade 4, Unit 5, Section A"
    points: 2
    partial_credit: true
    prompt: |
      Which stories can be solved with 4 × 9? Select all that apply.
    options:
      - "Nia has 9 shells. Lou has 4 times as many shells. How many shells does Lou have?"
      - "Ivy has 9 stamps. She gets 4 more. How many stamps does she have now?"
      - "Max is 9 years old. His aunt is 4 times as old. How old is his aunt?"
      - "A box has 4 rows of crayons with 9 crayons in each row. How many crayons are in the box?"
      - "4 friends share 36 grapes equally. How many grapes does each friend get?"
    option_explanations:
      - |
        Yes. Lou has 4 times as many as 9, which is 4 × 9 = 36 shells.
      - |
        No. Getting 4 more is adding: 9 + 4 = 13 stamps.
      - |
        Yes. 4 times as old as 9 is 4 × 9 = 36 years old.
      - |
        Yes. 4 equal rows of 9 is 4 × 9 = 36 crayons.
      - |
        No. Sharing 36 equally is dividing: 36 ÷ 4 = 9 grapes each. The 36 is given, not found.
    answer: [0, 2, 3]

  # ---- Converting units (4.MD.A.1)
  - slug: g4math-u05-check-q10
    type: multiple_choice
    topic_code: "4.MD.A.1"
    source: "IM K–5 Math Grade 4, Unit 5, Section B"
    points: 1
    prompt: |
      A hallway is 8 m long. How many centimeters long is it?
    options:
      - "80 cm"
      - "800 cm"
      - "8,000 cm"
      - "108 cm"
    option_explanations:
      - |
        80 cm uses 1 m = 10 cm. A meter is 100 centimeters, so multiply 8 × 100.
      - |
        Correct. 1 m = 100 cm, so 8 m = 8 × 100 = 800 cm.
      - |
        8,000 uses 1 m = 1,000 cm, the kilometers-to-meters fact. A meter is 100 centimeters.
      - |
        108 is 100 + 8. Each of the 8 meters is 100 cm, so multiply instead of adding.
    answer: 1

  # ---- Stimulus set B: a conversion table (4.MD.A.1)
  - slug: g4math-u05-check-q11
    type: numeric
    topic_code: "4.MD.A.1"
    source: "IM K–5 Math Grade 4, Unit 5, Section B"
    points: 1
    stimulus: |
      Use the conversion table. It shows hours and the same amounts of time in minutes.
    figure: figures/u05-hours-table.svg
    figure_alt: "A table with two columns, Hours and Minutes. The rows read 1 hour, 60 minutes; 2 hours, 120 minutes; 3 hours, an empty box; 4 hours, 240 minutes; 5 hours, 300 minutes."
    prompt: |
      What number belongs in the empty box beside 3 hours?
    answer: { value: 180, tolerance: 0 }
    explanation: |
      1 hr = 60 min, so 3 hours = 3 × 60 = 180 minutes. The pattern agrees: 120 + 60 = 180.

  - slug: g4math-u05-check-q12
    type: multiple_choice
    topic_code: "4.MD.A.1"
    source: "IM K–5 Math Grade 4, Unit 5, Section B"
    points: 1
    stimulus: |
      Use the conversion table. It shows hours and the same amounts of time in minutes.
    prompt: |
      Which pair could be a new row in the table?
    options:
      - "4 hours and 400 minutes"
      - "10 hours and 160 minutes"
      - "8 hours and 420 minutes"
      - "6 hours and 360 minutes"
    option_explanations:
      - |
        400 treats an hour as 100 minutes. The table already shows 4 hours as 240 minutes.
      - |
        160 is 100 + 60. Every row multiplies hours by 60, and 10 × 60 is 600.
      - |
        420 minutes is 7 × 60, which is 7 hours. For 8 hours the table would need 8 × 60 = 480.
      - |
        Correct. 6 × 60 = 360, and it continues the pattern: 300 + 60 = 360.
    answer: 3

  - slug: g4math-u05-check-q13
    type: multiple_choice
    topic_code: "4.MD.A.1"
    source: "IM K–5 Math Grade 4, Unit 5, Section B"
    points: 1
    prompt: |
      Four packages are on a scale, one at a time. Which package is the heaviest?
    options:
      - "3 kg"
      - "2,500 g"
      - "3,100 g"
      - "900 g"
    option_explanations:
      - |
        3 kg is 3,000 g. That is close, but 3,100 g is 100 g more.
      - |
        2,500 g has a big number, but it is less than 3 kg, which is 3,000 g.
      - |
        Correct. Write them all in grams: 3,000 g, 2,500 g, 3,100 g and 900 g. 3,100 g is the most.
      - |
        900 g is less than 1 kg, so it is the lightest package, not the heaviest.
    answer: 2

  - slug: g4math-u05-check-q14
    type: fill_blank
    topic_code: "4.MD.A.1"
    source: "IM K–5 Math Grade 4, Unit 5, Section B"
    points: 1
    prompt: |
      Writing 2 km as 2,000 m, or 3 hours as 180 minutes, is called a unit ____.
    answer: ["conversion", "conversions", "converting"]
    explanation: |
      A unit conversion writes the same amount in a different unit. Changing to a smaller unit means multiplying.

  - slug: g4math-u05-check-q15
    type: numeric
    topic_code: "4.MD.A.1"
    source: "IM K–5 Math Grade 4, Unit 5, Section B"
    points: 1
    prompt: |
      A bag of dog food weighs 6 lb. How many ounces is that?
    answer: { value: 96, tolerance: 0 }
    explanation: |
      1 lb = 16 oz, so 6 lb = 6 × 16 = 96 ounces.

  - slug: g4math-u05-check-q16
    type: multiple_choice
    topic_code: "4.MD.A.1"
    source: "IM K–5 Math Grade 4, Unit 5, Section B"
    points: 1
    prompt: |
      A garden bed is 5 yd long. How many feet long is it?
    options:
      - "15 ft"
      - "60 ft"
      - "8 ft"
      - "50 ft"
    option_explanations:
      - |
        Correct. 1 yd = 3 ft, so 5 yd = 5 × 3 = 15 feet.
      - |
        60 uses 12, the feet-to-inches fact. A yard is 3 feet, so multiply 5 × 3.
      - |
        8 is 5 + 3. Each of the 5 yards is 3 feet, so multiply instead of adding.
      - |
        50 uses 10 feet in a yard. A yard is 3 feet, so 5 yards is 15 feet.
    answer: 0

  # ---- Measurement word problems (4.MD.A.2)
  - slug: g4math-u05-check-q17
    type: multiple_choice
    topic_code: "4.MD.A.2"
    source: "IM K–5 Math Grade 4, Unit 5, Section C"
    points: 1
    figure: figures/u05-measuring-jug.svg
    figure_alt: "A measuring jug with a scale in milliliters on its left side. Labeled marks are 0, 250, 500, 750 and 1,000, with small marks every 50 mL between them. Blue water fills the jug up to the 750 mark."
    prompt: |
      Mei wants exactly 1 L of water in the jug. How much more water should she add?
    options:
      - "750 mL"
      - "1,750 mL"
      - "250 mL"
      - "350 mL"
    option_explanations:
      - |
        750 mL is the water already in the jug. The question asks how much more is needed to reach 1 L.
      - |
        1,750 adds 1,000 + 750. Mei needs the difference between 1,000 mL and 750 mL.
      - |
        Correct. 1 L = 1,000 mL, and 1,000 − 750 = 250 mL more.
      - |
        350 is a regrouping slip in 1,000 − 750. Count up from 750: 250 more makes 1,000.
    answer: 2

  - slug: g4math-u05-check-q18
    type: numeric
    topic_code: "4.MD.A.2"
    source: "IM K–5 Math Grade 4, Unit 5, Section C"
    points: 1
    prompt: |
      Leah walks 750 m to school and 750 m back home every school day. How many meters does she walk in 5 school days? (Type the digits without a comma.)
    answer: { value: 7500, tolerance: 0 }
    explanation: |
      Each day she walks 750 + 750 = 1,500 m. In 5 days: 5 × 1,500 = 7,500 m (that is 7 km 500 m).

  - slug: g4math-u05-check-q19
    type: multiple_choice
    topic_code: "4.MD.A.2"
    source: "IM K–5 Math Grade 4, Unit 5, Section C"
    points: 1
    prompt: |
      A bus leaves at 2:50 p.m. The ride lasts 1 hour 20 minutes. When does the bus arrive?
    options:
      - "3:10 p.m."
      - "4:10 p.m."
      - "4:20 p.m."
      - "5:10 p.m."
    option_explanations:
      - |
        3:10 adds only the 20 minutes. Add the 1 hour too: 3:10 + 1 hour = 4:10.
      - |
        Correct. 2:50 + 1 hour = 3:50. Then 10 minutes gets to 4:00, and 10 more makes 4:10 p.m.
      - |
        4:20 starts counting from 3:00 instead of 2:50. Starting at 2:50 lands 10 minutes earlier.
      - |
        5:10 adds 2 hours. The ride is 1 hour 20 minutes, so add 1 hour and then 20 minutes.
    answer: 1

  - slug: g4math-u05-check-q20
    type: multiple_choice
    topic_code: "4.MD.A.2"
    source: "IM K–5 Math Grade 4, Unit 5, Section C"
    points: 1
    prompt: |
      A bottle of juice costs $1.35. Kim pays with $2.00. How much change does she get?
    options:
      - "$3.35"
      - "$1.65"
      - "$0.75"
      - "$0.65"
    option_explanations:
      - |
        $3.35 is $2.00 + $1.35. Change is what is left after paying, so subtract.
      - |
        $1.65 subtracts only the 35 cents and forgets the $1. In cents: 200 − 135 = 65.
      - |
        $0.75 is a regrouping slip. In cents, 200 − 135: count up 5 to 140, then 60 to 200, which is 65.
      - |
        Correct. $2.00 is 200 cents and $1.35 is 135 cents. 200 − 135 = 65 cents, or $0.65.
    answer: 3

  - slug: g4math-u05-check-q21
    type: multiple_choice
    topic_code: "4.MD.A.2"
    source: "IM K–5 Math Grade 4, Unit 5, Section C"
    points: 1
    prompt: |
      The art club meets for 3/4 of an hour. How many minutes is that?
    options:
      - "45 minutes"
      - "34 minutes"
      - "75 minutes"
      - "15 minutes"
    option_explanations:
      - |
        Correct. 1/4 of 60 minutes is 60 ÷ 4 = 15, so 3/4 hour is 3 × 15 = 45 minutes.
      - |
        34 writes the digits of 3/4 side by side. An hour is 60 minutes; 1/4 of it is 15, and 3 of those is 45.
      - |
        75 treats an hour as 100 minutes, like 3/4 of a dollar is 75 cents. An hour has only 60 minutes.
      - |
        15 minutes is 1/4 of an hour. The club meets for 3 of those quarters: 3 × 15 = 45.
    answer: 0

  - slug: g4math-u05-check-q22
    type: short_answer
    topic_code: "4.MD.A.2"
    source: "IM K–5 Math Grade 4, Unit 5, Section C"
    points: 3
    prompt: |
      Ella has a ribbon 2 m long. She cuts 6 pieces from it, and each piece is 25 cm long.

      (a) How many centimeters long was the ribbon at the start?
      (b) How many centimeters of ribbon does she use for the 6 pieces?
      (c) How many centimeters of ribbon are left? Show your work.
    answer: |
      (a) 2 m = 2 × 100 = 200 cm.
      (b) 6 × 25 = 150 cm.
      (c) 200 − 150 = 50 cm left.
    explanation: |
      Three points.

      (a) 1 pt: 200 cm, using 1 m = 100 cm.

      (b) 1 pt: 150 cm, from 6 × 25 (or adding six 25s).

      (c) 1 pt: 50 cm, from subtracting the answer to (b) from the answer to (a). Give this point for a correct subtraction that follows from a wrong (a) or (b).
