week: 15
unit: 5
title: "Converting to Smaller Units"
topics: ["4.MD.A.1"]
guide: guides/week-15.md
guide_description: |
  How big units compare with small ones in length, mass, liquid volume and time: 1 km = 1,000 m,
  1 m = 100 cm, 1 kg = 1,000 g, 1 L = 1,000 mL, 1 lb = 16 oz, 1 ft = 12 in, 1 yd = 3 ft, 1 hr = 60 min,
  1 min = 60 sec. Convert a larger unit to a smaller one by multiplying, fill in conversion tables and
  double number lines, and compare amounts written in different units.
flashcards_description: |
  20 cards on the conversion facts for length, mass, liquid volume and time, why converting to a smaller unit
  means multiplying, conversion tables, mixed measurements such as 5 lb 2 oz, and comparing amounts in
  different units.

flashcards:
  - front: Kilometers to meters → the fact
    back: |
      1 km = 1,000 m. A kilometer is 1,000 times as long as a meter.
    topic_code: "4.MD.A.1"
  - front: Meters to centimeters → the fact
    back: |
      1 m = 100 cm. A meter is 100 times as long as a centimeter.
    topic_code: "4.MD.A.1"
  - front: Kilograms to grams → the fact
    back: |
      1 kg = 1,000 g. A kilogram is 1,000 times as heavy as a gram.
    topic_code: "4.MD.A.1"
  - front: Liters to milliliters → the fact
    back: |
      1 L = 1,000 mL. A liter holds 1,000 times as much as a milliliter.
    topic_code: "4.MD.A.1"
  - front: Pounds to ounces → the fact
    back: |
      1 lb = 16 oz. A pound is 16 times as heavy as an ounce.
    topic_code: "4.MD.A.1"
  - front: Feet to inches → the fact
    back: |
      1 ft = 12 in. A foot is 12 times as long as an inch.
    topic_code: "4.MD.A.1"
  - front: Yards to feet → the fact
    back: |
      1 yd = 3 ft. A yard is 3 times as long as a foot.
    topic_code: "4.MD.A.1"
  - front: Hours to minutes → the fact
    back: |
      1 hr = 60 min. An hour is 60 times as long as a minute.
    topic_code: "4.MD.A.1"
  - front: Minutes to seconds → the fact
    back: |
      1 min = 60 sec. A minute is 60 times as long as a second.
    topic_code: "4.MD.A.1"
  - front: Converting to a smaller unit → multiply or divide?
    back: |
      Multiply. It takes more of the small unit to measure the same thing: 4 m = 4 × 100 = 400 cm.
    topic_code: "4.MD.A.1"
  - front: Conversion table → what it shows
    back: |
      Matching amounts in two units, side by side. Feet 1, 2, 3 match inches 12, 24, 36. Each row adds one more 12.
    topic_code: "4.MD.A.1"
  - front: Double number line for units → how to read it
    back: |
      Two lines with tick marks lined up. Kilometers 0, 1, 2 on the top line match meters 0, 1,000, 2,000 on the bottom line.
    topic_code: "4.MD.A.1"
  - front: 9 kg → grams
    back: |
      9 × 1,000 = 9,000 g.
    topic_code: "4.MD.A.1"
  - front: 7 hr → minutes
    back: |
      7 × 60 = 420 min.
    topic_code: "4.MD.A.1"
  - front: 5 lb 2 oz → ounces
    back: |
      5 lb = 5 × 16 = 80 oz. Then 80 + 2 = 82 oz.
    topic_code: "4.MD.A.1"
  - front: 3 yd → inches
    back: |
      3 yd = 9 ft, and 9 ft = 9 × 12 = 108 in.
    topic_code: "4.MD.A.1"
  - front: Comparing 6 m and 540 cm → how
    back: |
      Write both in the same unit. 6 m = 600 cm, and 600 cm is more than 540 cm, so 6 m is longer by 60 cm.
    topic_code: "4.MD.A.1"
  - front: Kilo- in a unit name → what it means
    back: |
      A thousand. A kilometer is 1,000 meters and a kilogram is 1,000 grams.
    topic_code: "4.MD.A.1"
  - front: Milli- in a unit name → what it means
    back: |
      A tiny part of the main unit: it takes 1,000 milliliters to make 1 liter. One milliliter is about 20 drops of water.
    topic_code: "4.MD.A.1"
  - front: Conversion mistake → using the wrong fact
    back: |
      A meter is 100 cm, not 10 cm or 1,000 cm. Say the fact out loud before you multiply: 7 m = 7 × 100 = 700 cm.
    topic_code: "4.MD.A.1"

quiz:
  description: |
    15 questions · about 25 minutes · conversion facts for length, mass, liquid volume and time, conversion
    tables and double number lines, converting a larger unit to a smaller one, comparing amounts in different
    units, plus review of comparing by multiplying, decimals and adding big numbers. Multiple choice,
    select-all, true/false and number answers are graded at once; the fill-in word is matched automatically;
    the short answer is checked by your teacher.
  questions:
    - slug: g4math-w15-q01
      type: multiple_choice
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 1
      stimulus: |
        Use the conversion table. It shows feet and the same lengths in inches.
      figure: figures/w15-feet-inches-table.svg
      figure_alt: "A table with two columns, Feet and Inches. The rows read 1 foot, 12 inches; 2 feet, 24 inches; 3 feet, 36 inches; 4 feet, an empty box; 5 feet, 60 inches."
      prompt: |
        What number belongs in the empty box beside 4 feet?
      options:
        - "16"
        - "48"
        - "40"
        - "60"
      option_explanations:
        - |
          16 is 4 + 12. Each foot is 12 inches, so 4 feet is 4 groups of 12, not 12 plus 4.
        - |
          Correct. 4 feet is 4 × 12 = 48 inches. It also fits the pattern: 36 + 12 = 48.
        - |
          40 counts by 10s. The inches column goes up by 12 each row: 12, 24, 36, so next is 48.
        - |
          60 is the number of inches in 5 feet, the row below. The box is beside 4 feet.
      answer: 1

    - slug: g4math-w15-q02
      type: numeric
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 1
      stimulus: |
        Use the conversion table. It shows feet and the same lengths in inches.
      prompt: |
        If the table kept going, how many inches would be beside 7 feet?
      answer: { value: 84, tolerance: 0 }
      explanation: |
        Each foot is 12 inches, so 7 feet is 7 × 12 = 84 inches. Counting on from the table: 60, 72, 84.

    - slug: g4math-w15-q03
      type: multiple_choice
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 1
      figure: figures/w15-km-m-number-line.svg
      figure_alt: "A double number line. The top line is labeled kilometers, with tick marks 0, 1, 2, 3 and 4. The bottom line is labeled meters, with tick marks lined up under them labeled 0, 1,000, 2,000, a question mark under 3, and 4,000."
      prompt: |
        What number of meters belongs where the question mark is?
      options:
        - "300"
        - "2,500"
        - "3,000"
        - "4,000"
      option_explanations:
        - |
          300 would mean 1 km is 100 m. The line shows 1 km lines up with 1,000 m, so 3 km is 3 × 1,000.
        - |
          2,500 is halfway between 2,000 and 3,000. The question mark is right under 3 km, not between ticks.
        - |
          Correct. 1 km = 1,000 m, so 3 km = 3 × 1,000 = 3,000 m.
        - |
          4,000 m is the label under 4 km, at the end of the line. The question mark is under 3 km.
      answer: 2

    - slug: g4math-w15-q04
      type: fill_blank
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 1
      prompt: |
        Meters, grams, liters and minutes are each a ____ of measurement.
      answer: ["unit", "units", "a unit"]
      explanation: |
        Each one is a unit: a fixed amount we use to measure. Meters measure length, grams mass, liters liquid volume and minutes time.

    - slug: g4math-w15-q05
      type: true_false
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 1
      prompt: |
        True or false: 3 L = 300 mL.
      answer: false
      explanation: |
        False. 1 L = 1,000 mL, so 3 L = 3 × 1,000 = 3,000 mL. 300 mL is less than half a liter.

    - slug: g4math-w15-q06
      type: multiple_choice
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 1
      prompt: |
        A bag of potatoes has a mass of 6 kg. What is its mass in grams?
      options:
        - "6,000 g"
        - "60 g"
        - "600 g"
        - "60,000 g"
      option_explanations:
        - |
          Correct. 1 kg = 1,000 g, so 6 kg = 6 × 1,000 = 6,000 g.
        - |
          60 g uses 1 kg = 10 g. A kilogram is 1,000 grams, so multiply 6 by 1,000.
        - |
          600 g uses 1 kg = 100 g, the meters-to-centimeters fact. A kilogram is 1,000 grams.
        - |
          60,000 g uses 1 kg = 10,000 g, which is too many. A kilogram is 1,000 grams.
      answer: 0

    - slug: g4math-w15-q07
      type: numeric
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 1
      prompt: |
        A class trip to the science museum lasts 5 hours. How many minutes is that?
      answer: { value: 300, tolerance: 0 }
      explanation: |
        1 hr = 60 min, so 5 hours is 5 × 60 = 300 minutes.

    - slug: g4math-w15-q08
      type: multi_select
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which lengths are the same as 2 yards? Select all that apply.
      options:
        - "6 feet"
        - "24 inches"
        - "72 inches"
        - "5 feet"
        - "200 inches"
      option_explanations:
        - |
          Yes. 1 yd = 3 ft, so 2 yd = 2 × 3 = 6 feet.
        - |
          No. 24 inches is 2 feet, because 2 × 12 = 24. Two yards is 6 feet, which is longer.
        - |
          Yes. 2 yd = 6 ft, and 6 ft = 6 × 12 = 72 inches.
        - |
          No. 2 yards is 2 × 3 = 6 feet, so 5 feet is 1 foot too short.
        - |
          No. 200 inches treats a yard as 100 inches. Two yards is 72 inches.
      answer: [0, 2]

    - slug: g4math-w15-q09
      type: multiple_choice
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 1
      prompt: |
        A kilometer is how many times as long as a meter?
      options:
        - "10 times"
        - "100 times"
        - "60 times"
        - "1,000 times"
      option_explanations:
        - |
          10 times is too few. It takes 1,000 meters to make 1 kilometer.
        - |
          100 times is the meter-to-centimeter fact: 1 m = 100 cm. A kilometer is 1,000 meters.
        - |
          60 belongs to time: 60 minutes in an hour, 60 seconds in a minute. Kilometers and meters use 1,000.
        - |
          Correct. 1 km = 1,000 m, so a kilometer is 1,000 times as long as a meter.
      answer: 3

    - slug: g4math-w15-q10
      type: multiple_choice
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 1
      prompt: |
        Kai's ribbon is 4 m long. Lena's ribbon is 350 cm long. Whose ribbon is longer, and by how much?
      options:
        - "Lena's, by 346 cm"
        - "Kai's, by 50 cm"
        - "Lena's, by 310 cm"
        - "Kai's, by 3,650 cm"
      option_explanations:
        - |
          This compares 350 with 4 as if they were the same unit. First change 4 m to 400 cm.
        - |
          Correct. 4 m = 4 × 100 = 400 cm, and 400 − 350 = 50. Kai's ribbon is 50 cm longer.
        - |
          This uses 1 m = 10 cm, so 4 m becomes 40 cm. A meter is 100 cm, so 4 m is 400 cm.
        - |
          This uses 1 m = 1,000 cm, so 4 m becomes 4,000 cm. A meter is 100 cm, so 4 m is 400 cm.
      answer: 1

    - slug: g4math-w15-q11
      type: short_answer
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 2
      prompt: |
        1 pound is 16 ounces.

        (a) Make a conversion table for 1, 2, 3 and 4 pounds, with the matching number of ounces.
        (b) A bag of apples weighs 3 lb 5 oz. How many ounces is that? Show your work.
      answer: |
        (a) 1 lb = 16 oz, 2 lb = 32 oz, 3 lb = 48 oz, 4 lb = 64 oz.
        (b) 3 lb = 3 × 16 = 48 oz, and 48 + 5 = 53 oz.
      explanation: |
        Two points.

        (a) 1 pt: all four rows right: 16, 32, 48 and 64 ounces.

        (b) 1 pt: 53 ounces, with work that changes 3 lb to 48 oz and then adds the 5 oz.

    - slug: g4math-w15-q12
      type: multiple_choice
      topic_code: "4.OA.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section A"
      points: 1
      prompt: |
        A school bus is 12 m long. A bike is 2 m long. The bus is how many times as long as the bike?
      options:
        - "10 times"
        - "24 times"
        - "6 times"
        - "14 times"
      option_explanations:
        - |
          10 is 12 − 2, which says the bus is 10 m longer. The question asks how many times as long.
        - |
          24 is 12 × 2. To find how many times as long, ask: 2 times what is 12?
        - |
          Correct. 12 ÷ 2 = 6, because 6 × 2 = 12. The bus is 6 times as long as the bike.
        - |
          14 is 12 + 2. That adds the two lengths, but the question compares them.
      answer: 2

    - slug: g4math-w15-q13
      type: numeric
      topic_code: "4.OA.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section A"
      points: 1
      prompt: |
        Find the missing number: 63 is 9 times as many as ____.
      answer: { value: 7, tolerance: 0 }
      explanation: |
        63 = 9 × ?, and 9 × 7 = 63, so the missing number is 7.

    - slug: g4math-w15-q14
      type: multiple_choice
      topic_code: "4.NF.C.7"
      source: "IM K–5 Math Grade 4, Unit 4, Section A"
      points: 1
      prompt: |
        Which number is the greatest?
      options:
        - "0.45"
        - "0.09"
        - "0.5"
        - "0.6"
      option_explanations:
        - |
          0.45 has more digits, but it is 4 tenths and 5 hundredths. 0.6 has 6 tenths, which is more.
        - |
          0.09 is only 9 hundredths, which is less than 1 tenth. It is the smallest of the four.
        - |
          0.5 is 5 tenths. 0.6 is 6 tenths, which is greater.
        - |
          Correct. 0.6 is 6 tenths, or 60 hundredths. That is more than 45, 9 or 50 hundredths.
      answer: 3

    - slug: g4math-w15-q15
      type: numeric
      topic_code: "4.NBT.B.4"
      source: "IM K–5 Math Grade 4, Unit 4, Section D"
      points: 1
      prompt: |
        A town library had 12,450 books. It got 3,875 new books. How many books does it have now?
      answer: { value: 16325, tolerance: 0 }
      explanation: |
        12,450 + 3,875: 0 + 5 = 5 ones; 5 + 7 = 12 tens, write 2 and regroup 1 hundred; 4 + 8 + 1 = 13 hundreds, write 3 and regroup 1 thousand; 2 + 3 + 1 = 6 thousands; 1 ten thousand. The library has 16,325 books.
