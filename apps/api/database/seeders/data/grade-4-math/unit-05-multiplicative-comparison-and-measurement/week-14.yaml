week: 14
unit: 5
title: "Times As Many: Comparing by Multiplying"
topics: ["4.OA.A.1", "4.OA.A.2"]
guide: guides/week-14.md
guide_description: |
  How to compare two amounts by multiplying: read and write "times as many" statements, turn them into
  equations, draw tape diagrams for comparisons, solve for the larger amount or the smaller one, and tell a
  "times as many" story from a "how many more" story.
flashcards_description: |
  18 cards on "times as many" statements, writing comparison equations, tape diagrams for comparing, finding
  the larger or smaller amount, and the difference between comparing by multiplying and by subtracting.

flashcards:
  - front: Multiplicative comparison → what it is
    back: |
      A comparison that says one amount is some number of times as many as another. "18 is 3 times as many as 6."
    topic_code: "4.OA.A.1"
  - front: '"21 is 3 times as many as 7" → equation'
    back: |
      21 = 3 × 7. The 3 tells how many times, and 7 is the smaller amount.
    topic_code: "4.OA.A.1"
  - front: 35 = 5 × 7 → two comparison sentences
    back: |
      35 is 5 times as many as 7. 35 is 7 times as many as 5.
    topic_code: "4.OA.A.1"
  - front: Comparison tape diagram → how to draw it
    back: |
      Draw one box for the smaller amount. Draw the larger amount as a bar of the same boxes, repeated as many times as the comparison says.
    topic_code: "4.OA.A.2"
  - front: '"4 times as many as 9" → what to do'
    back: |
      Multiply: 4 × 9 = 36.
    topic_code: "4.OA.A.2"
  - front: Larger amount unknown in a comparison → which operation
    back: |
      Multiply the smaller amount by the number of times. A cat weighs 5 kg and a dog weighs 6 times as much: 6 × 5 = 30 kg.
    topic_code: "4.OA.A.2"
  - front: Smaller amount unknown in a comparison → which operation
    back: |
      Divide the larger amount by the number of times. 40 is 5 times as many as what? 40 ÷ 5 = 8.
    topic_code: "4.OA.A.2"
  - front: Number of times unknown in a comparison → which operation
    back: |
      Divide the larger amount by the smaller one. 42 is how many times as many as 6? 42 ÷ 6 = 7 times.
    topic_code: "4.OA.A.2"
  - front: '"How many more" vs. "how many times as many" → the difference'
    back: |
      "How many more" compares by subtracting: 24 − 6 = 18 more. "How many times as many" compares by multiplying or dividing: 24 ÷ 6 = 4 times as many.
    topic_code: "4.OA.A.2"
  - front: '"3 times as many" is not "3 more" → example'
    back: |
      If Ari has 5 cards, 3 more is 8 cards, but 3 times as many is 15 cards.
    topic_code: "4.OA.A.1"
  - front: '"Times as long" → example'
    back: |
      A 4-inch pencil and a ribbon 6 times as long: the ribbon is 6 × 4 = 24 inches.
    topic_code: "4.OA.A.2"
  - front: '"Times as heavy" → example'
    back: |
      A 3-pound puppy and a dog 9 times as heavy: the dog weighs 9 × 3 = 27 pounds.
    topic_code: "4.OA.A.2"
  - front: Symbol for the unknown in a comparison → example
    back: |
      "Some number is 8 times as many as 7" can be written n = 8 × 7. Then n = 56.
    topic_code: "4.OA.A.2"
  - front: '"72 is 9 times as many as ?" → answer'
    back: |
      72 ÷ 9 = 8, because 9 × 8 = 72. So 72 is 9 times as many as 8.
    topic_code: "4.OA.A.2"
  - front: Checking a comparison answer → multiply back
    back: |
      If you found that 56 is 7 times as many as 8, check: 7 × 8 = 56.
    topic_code: "4.OA.A.2"
  - front: Comparison mistake → adding instead of multiplying
    back: |
      "5 times as many as 6" is not 5 + 6 = 11. It is 5 × 6 = 30.
    topic_code: "4.OA.A.1"
  - front: Comparison mistake → multiplying when the larger amount is given
    back: |
      "A rope is 30 feet, 5 times as long as a string." The string is shorter: 30 ÷ 5 = 6 feet, not 30 × 5.
    topic_code: "4.OA.A.2"
  - front: Comparison reasonableness → which amount is bigger
    back: |
      The amount that is "times as many" is the bigger one. If your answer for the smaller amount is bigger than the given amount, check again.
    topic_code: "4.OA.A.2"

quiz:
  description: |
    14 questions · about 25 minutes · "times as many" statements and equations, comparison tape diagrams,
    finding a larger or smaller amount, telling "times as many" from "how many more", plus review of
    subtracting big numbers, rounding and factor pairs. Multiple choice, select-all, true/false and number
    answers are graded at once; the fill-in word is matched automatically; the short answer is checked by
    your teacher.
  questions:
    - slug: g4math-w14-q01
      type: multiple_choice
      topic_code: "4.OA.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section A"
      points: 1
      stimulus: |
        Use the tape diagram. Jon has 3 times as many stickers as Mia. Mia has 7 stickers.
      figure: figures/w14-tape-stickers.svg
      figure_alt: "A tape diagram with two bars. The bar labeled Mia is one box with 7 in it. The bar labeled Jon is three boxes the same size, each with 7 in it. A bracket under Jon's whole bar is labeled with a question mark."
      prompt: |
        How many stickers does Jon have?
      options:
        - "10"
        - "28"
        - "21"
        - "4"
      option_explanations:
        - |
          10 is 3 + 7. Jon has 3 times as many, not 3 more, so his bar is 3 boxes of 7.
        - |
          28 counts all four boxes, Mia's and Jon's together. The question asks only about Jon's bar.
        - |
          Correct. Jon's bar is 3 boxes of 7, so he has 3 × 7 = 21 stickers.
        - |
          4 is 7 − 3. Jon's bar is longer than Mia's, so he must have more than 7 stickers.
      answer: 2

    - slug: g4math-w14-q02
      type: multiple_choice
      topic_code: "4.OA.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section A"
      points: 1
      stimulus: |
        Use the tape diagram. Jon has 3 times as many stickers as Mia. Mia has 7 stickers.
      prompt: |
        Which equation matches the tape diagram?
      options:
        - "3 × 7 = ?"
        - "3 + 7 = ?"
        - "7 − 3 = ?"
        - "7 ÷ 3 = ?"
      option_explanations:
        - |
          Correct. Jon's bar is 3 copies of Mia's 7, and his total is unknown, so 3 × 7 = ?.
        - |
          Adding 3 and 7 would mean Jon has 3 more than Mia. The diagram shows 3 times as many.
        - |
          Subtraction finds a difference, but the bracket is over Jon's whole bar of 3 boxes of 7.
        - |
          Dividing 7 into 3 parts does not match: Jon's bar is made of whole boxes of 7.
      answer: 0

    - slug: g4math-w14-q03
      type: numeric
      topic_code: "4.OA.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section A"
      points: 1
      stimulus: |
        Use the tape diagram. Jon has 3 times as many stickers as Mia. Mia has 7 stickers.
      prompt: |
        How many more stickers does Jon have than Mia?
      answer: { value: 14, tolerance: 0 }
      explanation: |
        Jon has 3 × 7 = 21 stickers and Mia has 7. "How many more" means subtract: 21 − 7 = 14. In the diagram, Jon's bar is 2 boxes of 7 longer than Mia's.

    - slug: g4math-w14-q04
      type: multiple_choice
      topic_code: "4.OA.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section A"
      points: 1
      figure: figures/w14-tape-trees.svg
      figure_alt: "A tape diagram with two bars. The bar labeled Tall tree is 5 equal boxes, with a bracket over the whole bar labeled 45 feet. The bar labeled Short tree is one box the same size, labeled with a question mark."
      prompt: |
        The tall tree is 5 times as tall as the short tree. How tall is the short tree?
      options:
        - "40 feet"
        - "50 feet"
        - "225 feet"
        - "9 feet"
      option_explanations:
        - |
          40 is 45 − 5. The tall tree is 5 times as tall, not 5 feet taller, so split 45 into 5 equal boxes.
        - |
          50 is 45 + 5. The short tree is shorter than the tall tree, so its height must be less than 45 feet.
        - |
          225 is 45 × 5. The 45 feet is already the tall tree, so divide to find one box.
        - |
          Correct. 45 feet is 5 equal boxes, so one box is 45 ÷ 5 = 9 feet. Check: 5 × 9 = 45.
      answer: 3

    - slug: g4math-w14-q05
      type: fill_blank
      topic_code: "4.OA.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section A"
      points: 1
      prompt: |
        "35 is 5 times as many as 7" is a multiplicative ____, because it compares two amounts by multiplying.
      answer: ["comparison", "comparisons"]
      explanation: |
        A multiplicative comparison says how many times as many one amount is as another: 35 = 5 × 7.

    - slug: g4math-w14-q06
      type: multiple_choice
      topic_code: "4.OA.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section A"
      points: 1
      prompt: |
        Which equation says "48 is 6 times as many as 8"?
      options:
        - "48 = 40 + 8"
        - "48 = 6 × 8"
        - "8 = 6 × 48"
        - "6 = 48 × 8"
      option_explanations:
        - |
          48 = 40 + 8 says 48 is 40 more than 8. That is a comparison by adding, not by multiplying.
        - |
          Correct. 6 times as many as 8 is 6 × 8, and that equals 48.
        - |
          This makes 8 the bigger amount. In the sentence, 48 is the amount that is 6 times as many.
        - |
          This says 6 is 48 times as many as 8, which is not true. The 6 tells how many times.
      answer: 1

    - slug: g4math-w14-q07
      type: true_false
      topic_code: "4.OA.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section A"
      points: 1
      prompt: |
        True or false: "Rosa has 4 times as many shells as Ben" means Rosa has 4 more shells than Ben.
      answer: false
      explanation: |
        False. 4 times as many means 4 × Ben's number. If Ben has 6 shells, Rosa has 4 × 6 = 24 shells, which is 18 more, not 4 more.

    - slug: g4math-w14-q08
      type: multi_select
      topic_code: "4.OA.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section A"
      points: 2
      partial_credit: true
      prompt: |
        Which statements match the equation 45 = 5 × 9? Select all that apply.
      options:
        - "45 is 5 times as many as 9."
        - "45 is 9 times as many as 5."
        - "45 is 5 more than 9."
        - "9 is 5 times as many as 45."
        - "45 is the same as 5 plus 9."
      option_explanations:
        - |
          Yes. 5 times as many as 9 is 5 × 9, which is 45.
        - |
          Yes. 9 times as many as 5 is 9 × 5, which is also 45, so the equation fits both ways.
        - |
          No. 5 more than 9 is 9 + 5 = 14. The equation multiplies 5 and 9.
        - |
          No. This makes 9 the larger amount, but 9 is much less than 45.
        - |
          No. 5 + 9 = 14, not 45. The equation uses multiplication.
      answer: [0, 1]

    - slug: g4math-w14-q09
      type: numeric
      topic_code: "4.OA.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section A"
      points: 1
      prompt: |
        A puppy weighs 8 pounds. Its mother weighs 7 times as much as the puppy. How many pounds does the mother weigh?
      answer: { value: 56, tolerance: 0 }
      explanation: |
        The mother is the larger amount: 7 times as much as 8 pounds is 7 × 8 = 56 pounds.

    - slug: g4math-w14-q10
      type: multiple_choice
      topic_code: "4.OA.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section A"
      points: 1
      prompt: |
        Ana read 36 pages. That is 4 times as many pages as Theo read. How many pages did Theo read?
      options:
        - "144"
        - "32"
        - "9"
        - "40"
      option_explanations:
        - |
          144 is 36 × 4. Ana read more than Theo, so Theo's number must be smaller than 36.
        - |
          32 is 36 − 4. Ana read 4 times as many, not 4 more, so divide by 4.
        - |
          Correct. Ana's 36 pages are 4 times Theo's, so Theo read 36 ÷ 4 = 9 pages. Check: 4 × 9 = 36.
        - |
          40 is 36 + 4. Theo read fewer pages than Ana, so his number is less than 36.
      answer: 2

    - slug: g4math-w14-q11
      type: short_answer
      topic_code: "4.OA.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section A"
      points: 2
      prompt: |
        The school garden has 8 tomato plants. It has 3 times as many bean plants as tomato plants.

        (a) Write an equation with a symbol for the number of bean plants, and solve it.
        (b) How many more bean plants than tomato plants are there? Show how you know.
      answer: |
        (a) b = 3 × 8, so b = 24 bean plants.
        (b) 24 − 8 = 16. There are 16 more bean plants than tomato plants.
      explanation: |
        Two points.

        (a) 1 pt: an equation with a symbol for the unknown, such as b = 3 × 8 or 3 × 8 = ?, and the answer 24 bean plants.

        (b) 1 pt: 16 more, with work that subtracts 24 − 8 (or shows 2 more groups of 8 on a tape diagram).

    - slug: g4math-w14-q12
      type: multiple_choice
      topic_code: "4.NBT.B.4"
      source: "IM K–5 Math Grade 4, Unit 4, Section D"
      points: 1
      prompt: |
        5,302 − 1,476 = ?
      options:
        - "4,174"
        - "6,778"
        - "3,836"
        - "3,826"
      option_explanations:
        - |
          4,174 comes from taking the smaller digit from the larger one in each place. You need to regroup instead.
        - |
          6,778 is 5,302 + 1,476. The minus sign asks for the difference, so subtract.
        - |
          3,836 regroups for the ones but forgets that the tens place lent a ten. After lending, it has 9 tens, and 9 − 7 = 2.
        - |
          Correct. Regroup to get 12 − 6 = 6 ones, 9 − 7 = 2 tens, 12 − 4 = 8 hundreds and 4 − 1 = 3 thousands: 3,826.
      answer: 3

    - slug: g4math-w14-q13
      type: numeric
      topic_code: "4.NBT.A.3"
      source: "IM K–5 Math Grade 4, Unit 4, Section C"
      points: 1
      prompt: |
        Round 486,512 to the nearest thousand. (Type the digits without a comma.)
      answer: { value: 487000, tolerance: 0 }
      explanation: |
        486,512 is between 486,000 and 487,000. The hundreds digit is 5, so it rounds up to 487,000.

    - slug: g4math-w14-q14
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      prompt: |
        Mr. Díaz sets out all 28 chairs for a class play in equal rows, with no chairs left over. Which way can he set them out?
      options:
        - "4 rows of 7 chairs"
        - "6 rows of 5 chairs"
        - "3 rows of 9 chairs"
        - "8 rows of 4 chairs"
      option_explanations:
        - |
          Correct. 4 × 7 = 28, so 4 and 7 are a factor pair of 28 and every chair is used.
        - |
          6 rows of 5 needs 6 × 5 = 30 chairs, 2 more than Mr. Díaz has.
        - |
          3 rows of 9 uses 3 × 9 = 27 chairs, so 1 chair would be left over.
        - |
          8 rows of 4 needs 8 × 4 = 32 chairs, 4 more than Mr. Díaz has.
      answer: 0
