unit: 9
description: |
  22 questions · about 40 minutes · every standard of Unit 9: adding and subtracting fractions and mixed
  numbers with like denominators (4.NF.B.3), comparing fractions (4.NF.A.2), multi-digit multiplication
  (4.NBT.B.5) and division (4.NBT.B.6), multistep word problems with remainders (4.OA.A.3) and money and time
  problems (4.MD.A.2). Two stimulus sets share a line plot and a school fair price list. Multiple choice,
  select-all, true/false and number answers are graded at once; the fill-in word is matched automatically;
  the short answer is checked by your teacher against the scoring notes.
questions:
  # ---- Adding and subtracting fractions and mixed numbers (4.NF.B.3)
  - slug: g4math-u09-check-q01
    type: multiple_choice
    topic_code: "4.NF.B.3"
    source: "IM K–5 Math Grade 4, Unit 9, Section A"
    points: 1
    prompt: |
      What is 5/12 + 6/12?
    options:
      - "11/24"
      - "11/12"
      - "1/12"
      - "30/12"
    option_explanations:
      - |
        11/24 adds the denominators too. Twelfths plus twelfths are still twelfths, so the answer is 11/12.
      - |
        Correct. 5 twelfths and 6 twelfths make 11 twelfths: 11/12.
      - |
        1/12 is 6/12 − 5/12, a subtraction. The plus sign means put the pieces together.
      - |
        30/12 multiplies the numerators. To add, count the pieces: 5 + 6 = 11 twelfths.
    answer: 1

  - slug: g4math-u09-check-q02
    type: multiple_choice
    topic_code: "4.NF.B.3"
    source: "IM K–5 Math Grade 4, Unit 9, Section A"
    points: 1
    prompt: |
      What is 5 2/6 − 2 5/6?
    options:
      - "3 3/6"
      - "8 1/6"
      - "1 3/6"
      - "2 3/6"
    option_explanations:
      - |
        3 3/6 subtracts 2/6 from 5/6, the wrong way round. Trade a whole first: 5 2/6 = 4 8/6.
      - |
        8 1/6 adds the two mixed numbers. The minus sign means take 2 5/6 away from 5 2/6.
      - |
        1 3/6 takes away one whole too many. After trading, 4 8/6 − 2 5/6 leaves 2 wholes, not 1.
      - |
        Correct. Trade 1 whole for 6/6: 5 2/6 = 4 8/6. Then 4 8/6 − 2 5/6 = 2 3/6.
    answer: 3

  - slug: g4math-u09-check-q03
    type: numeric
    topic_code: "4.NF.B.3"
    source: "IM K–5 Math Grade 4, Unit 9, Section A"
    points: 1
    prompt: |
      How many fifths are in 3 2/5? (3 2/5 = ?/5)
    answer: { value: 17, tolerance: 0 }
    explanation: |
      Each whole is 5 fifths, so 3 wholes are 15 fifths. 15 fifths and 2 more fifths make 17 fifths: 3 2/5 = 17/5.

  - slug: g4math-u09-check-q04
    type: multi_select
    topic_code: "4.NF.B.3"
    source: "IM K–5 Math Grade 4, Unit 9, Section A"
    points: 2
    partial_credit: true
    prompt: |
      Which of these are ways to decompose 7/10? Select all that apply.
    options:
      - "5/10 + 3/10"
      - "3/10 + 4/10"
      - "1/10 + 6/10"
      - "4/5 + 3/5"
      - "2/10 + 2/10 + 3/10"
    option_explanations:
      - |
        No. 5 + 3 = 8, so this makes 8/10, one tenth too many.
      - |
        Yes. 3 tenths and 4 tenths make 7 tenths.
      - |
        Yes. 1 tenth and 6 tenths make 7 tenths.
      - |
        No. These are fifths, and 4/5 + 3/5 = 7/5, which is more than 1 whole. 7/10 is less than 1.
      - |
        Yes. 2 + 2 + 3 = 7, so the three parts make 7/10.
    answer: [1, 2, 4]

  # ---- Comparing fractions (4.NF.A.2)
  - slug: g4math-u09-check-q05
    type: multiple_choice
    topic_code: "4.NF.A.2"
    source: "IM K–5 Math Grade 4, Unit 9, Section A"
    points: 1
    prompt: |
      Which fraction is the greatest: 5/8, 5/6, 5/12 or 5/10?
    options:
      - "5/6"
      - "5/8"
      - "5/12"
      - "5/10"
    option_explanations:
      - |
        Correct. Every fraction has 5 pieces. Sixths are the biggest pieces here, so 5/6 is the greatest.
      - |
        5/8 has 5 eighths, but eighths are smaller than sixths, so 5/8 is less than 5/6.
      - |
        5/12 has the smallest pieces of all, so it is the least, not the greatest. It is even less than 1/2.
      - |
        5/10 is exactly 1/2. Sixths are bigger than tenths, so 5/6 is greater.
    answer: 0

  - slug: g4math-u09-check-q06
    type: true_false
    topic_code: "4.NF.A.2"
    source: "IM K–5 Math Grade 4, Unit 9, Section A"
    points: 1
    prompt: |
      True or false: 7/12 and 5/8 are both greater than 1/2.
    answer: true
    explanation: |
      True. Half of 12 is 6, so 1/2 = 6/12, and 7/12 is more. Half of 8 is 4, so 1/2 = 4/8, and 5/8 is more.

  - slug: g4math-u09-check-q07
    type: multiple_choice
    topic_code: "4.NF.A.2"
    source: "IM K–5 Math Grade 4, Unit 9, Section A"
    points: 1
    prompt: |
      Leo ate 2/3 of a small pizza. Ava ate 7/12 of a pizza the same size. Who ate more?
    options:
      - "Ava, because 7 is greater than 2."
      - "They ate the same amount."
      - "Leo, because 2/3 = 8/12, which is more than 7/12."
      - "Ava, because twelfths are more pieces than thirds."
    option_explanations:
      - |
        Comparing only the numerators works when the pieces are the same size. Thirds are much bigger pieces than twelfths.
      - |
        2/3 and 7/12 are not equal. Write 2/3 in twelfths: 2/3 = 8/12, which is one twelfth more than 7/12.
      - |
        Correct. Multiply the top and bottom of 2/3 by 4 to get 8/12. Eight twelfths is more than seven, so Leo ate more.
      - |
        More pieces in a whole means each piece is smaller. Count equal-size pieces instead: 2/3 = 8/12.
    answer: 2

  # ---- Stimulus set: ribbon line plot (4.NF.B.3)
  - slug: g4math-u09-check-q08
    type: multiple_choice
    topic_code: "4.NF.B.3"
    source: "IM K–5 Math Grade 4, Unit 9, Section A"
    points: 1
    stimulus: |
      Use the line plot "Lengths of Ribbon Pieces". Each X is one piece of ribbon from the craft box.
    figure: figures/u09-ribbon-line-plot.svg
    figure_alt: "A line plot titled Lengths of Ribbon Pieces. The scale is Length in feet and goes from 0 to 2 in fourths: 0, 1/4, 2/4, 3/4, 1, 1 1/4, 1 2/4, 1 3/4, 2. There is 1 X above 1/4, 2 Xs above 2/4, 3 Xs above 3/4, 2 Xs above 1 1/4 and 1 X above 1 3/4."
    prompt: |
      How much longer is the longest piece than the shortest piece?
    options:
      - "1 2/4 feet"
      - "1 3/4 feet"
      - "2 feet"
      - "1 1/4 feet"
    option_explanations:
      - |
        Correct. The longest piece is 1 3/4 feet and the shortest is 1/4 foot. 1 3/4 − 1/4 = 1 2/4 feet.
      - |
        1 3/4 feet is the length of the longest piece. Take away the shortest piece, 1/4 foot, to find the difference.
      - |
        2 feet adds the two lengths, 1 3/4 + 1/4. "How much longer" asks for the difference.
      - |
        1 1/4 takes away 2/4 instead of 1/4. The shortest X is on the first tick after 0, which is 1/4.
    answer: 0

  - slug: g4math-u09-check-q09
    type: multiple_choice
    topic_code: "4.NF.B.3"
    source: "IM K–5 Math Grade 4, Unit 9, Section A"
    points: 1
    stimulus: |
      Use the line plot "Lengths of Ribbon Pieces". Each X is one piece of ribbon from the craft box.
    prompt: |
      Mia lays all the 3/4-foot pieces end to end. How long is the line of ribbon?
    options:
      - "9/12 foot"
      - "3 3/4 feet"
      - "1 1/4 feet"
      - "2 1/4 feet"
    option_explanations:
      - |
        9/12 adds the denominators too. Fourths plus fourths stay fourths: 3/4 + 3/4 + 3/4 = 9/4.
      - |
        3 3/4 writes the 3 pieces as 3 whole feet. Each piece is only 3/4 foot, so add 3/4 three times.
      - |
        1 1/4 takes only one whole out of 9/4. 9/4 has two full sets of 4/4, so it is 2 1/4.
      - |
        Correct. There are 3 Xs above 3/4. 3/4 + 3/4 + 3/4 = 9/4, and 9/4 = 8/4 + 1/4 = 2 1/4 feet.
    answer: 3

  # ---- Multiplication (4.NBT.B.5)
  - slug: g4math-u09-check-q10
    type: multiple_choice
    topic_code: "4.NBT.B.5"
    source: "IM K–5 Math Grade 4, Unit 9, Section B"
    points: 1
    figure: figures/u09-area-model.svg
    figure_alt: "An area model titled Area model for 3 × 2,416, not drawn to scale. A rectangle with a side of 3 is split into 4 parts with tops labeled 2,000, 400, 10 and 6. The parts hold 6,000, a question mark, 30 and 18."
    prompt: |
      Use the area model. What is 3 × 2,416?
    options:
      - "6,048"
      - "6,248"
      - "7,248"
      - "2,419"
    option_explanations:
      - |
        6,048 adds only the parts you can see. The part with the question mark is 3 × 400 = 1,200, and it belongs in the sum.
      - |
        6,248 counts 3 × 400 as 200. It is 1,200, which adds 1 more thousand.
      - |
        Correct. The missing part is 3 × 400 = 1,200. Then 6,000 + 1,200 + 30 + 18 = 7,248.
      - |
        2,419 adds 3 to 2,416. The model shows 3 rows of 2,416, so multiply each part.
    answer: 2

  - slug: g4math-u09-check-q11
    type: numeric
    topic_code: "4.NBT.B.5"
    source: "IM K–5 Math Grade 4, Unit 9, Section B"
    points: 1
    prompt: |
      What is 63 × 48?
    answer: { value: 3024, tolerance: 0 }
    explanation: |
      Partial products: 60 × 40 = 2,400, 60 × 8 = 480, 3 × 40 = 120 and 3 × 8 = 24. 2,400 + 480 + 120 + 24 = 3,024. Estimate: 60 × 50 = 3,000.

  - slug: g4math-u09-check-q12
    type: multiple_choice
    topic_code: "4.NBT.B.5"
    source: "IM K–5 Math Grade 4, Unit 9, Section B"
    points: 1
    prompt: |
      A school theater has 28 rows with 45 seats in each row. How many seats are there?
    options:
      - "1,220"
      - "1,260"
      - "73"
      - "840"
    option_explanations:
      - |
        1,220 has a slip in 8 × 45. 8 × 40 = 320 and 8 × 5 = 40, so 8 × 45 = 360, and 900 + 360 = 1,260.
      - |
        Correct. 20 × 45 = 900 and 8 × 45 = 360. 900 + 360 = 1,260 seats.
      - |
        73 is 28 + 45. There are 28 equal rows of 45, so multiply.
      - |
        840 is 20 × 40 + 8 × 5, only tens times tens and ones times ones. The parts 20 × 5 and 8 × 40 are missing.
    answer: 1

  - slug: g4math-u09-check-q13
    type: fill_blank
    topic_code: "4.NBT.B.5"
    source: "IM K–5 Math Grade 4, Unit 9, Section B"
    points: 1
    prompt: |
      To find 23 × 14, Theo adds 200 + 80 + 30 + 12. Each of those four numbers is called a partial ____.
    answer: ["product", "products", "partial product", "partial products"]
    explanation: |
      They are partial products: 20 × 10 = 200, 20 × 4 = 80, 3 × 10 = 30 and 3 × 4 = 12. Their sum, 322, is the product 23 × 14.

  # ---- Division (4.NBT.B.6)
  - slug: g4math-u09-check-q14
    type: multiple_choice
    topic_code: "4.NBT.B.6"
    source: "IM K–5 Math Grade 4, Unit 9, Section B"
    points: 1
    prompt: |
      What is 3,248 ÷ 8?
    options:
      - "406"
      - "46"
      - "460"
      - "416"
    option_explanations:
      - |
        Correct. 8 × 400 = 3,200, leaving 48. 8 × 6 = 48, leaving 0. 400 + 6 = 406.
      - |
        46 drops the hundreds. The first chunk is 400, not 40, because 8 × 400 = 3,200.
      - |
        460 puts the 6 in the tens place. After taking out 3,200, only 48 is left, and 48 is 6 eights, not 60.
      - |
        8 × 416 = 3,328, which is 80 too many. After 8 × 400 = 3,200, only 48 is left, and that is 6 more eights.
    answer: 0

  - slug: g4math-u09-check-q15
    type: numeric
    topic_code: "4.NBT.B.6"
    source: "IM K–5 Math Grade 4, Unit 9, Section B"
    points: 1
    prompt: |
      What is 925 ÷ 5?
    answer: { value: 185, tolerance: 0 }
    explanation: |
      5 × 100 = 500, leaving 425. 5 × 80 = 400, leaving 25. 5 × 5 = 25, leaving 0. 100 + 80 + 5 = 185. Check: 5 × 185 = 925.

  - slug: g4math-u09-check-q16
    type: multiple_choice
    topic_code: "4.NBT.B.6"
    source: "IM K–5 Math Grade 4, Unit 9, Section B"
    points: 1
    prompt: |
      What is 59 ÷ 7?
    options:
      - "7 R 10"
      - "9"
      - "8"
      - "8 R 3"
    option_explanations:
      - |
        7 R 10 leaves 10 over, but 10 is more than 7, so one more group of 7 fits. That gives 8 R 3.
      - |
        7 × 9 = 63, which is more than 59. Nine groups of 7 do not fit.
      - |
        7 × 8 = 56, not 59. The 3 left over must be written as a remainder.
      - |
        Correct. 7 × 8 = 56, and 59 − 56 = 3 left over. So 59 ÷ 7 = 8 R 3.
    answer: 3

  # ---- Stimulus set: school fair prices (4.MD.A.2)
  - slug: g4math-u09-check-q17
    type: multiple_choice
    topic_code: "4.MD.A.2"
    source: "IM K–5 Math Grade 4, Unit 9, Section C"
    points: 1
    stimulus: |
      At the school fair, a cup of lemonade costs $1.25 and a bag of popcorn costs $0.75.
    prompt: |
      Diego buys 2 cups of lemonade and 1 bag of popcorn. How much does he spend?
    options:
      - "$2.00"
      - "$4.00"
      - "$3.25"
      - "$2.50"
    option_explanations:
      - |
        $2.00 is one lemonade and one popcorn. Diego buys 2 lemonades: $1.25 + $1.25 = $2.50, then add $0.75.
      - |
        $4.00 is 2 lemonades and 2 bags of popcorn. Diego buys only 1 bag of popcorn.
      - |
        Correct. 2 × $1.25 = $2.50, and $2.50 + $0.75 = $3.25.
      - |
        $2.50 is the 2 lemonades only. The bag of popcorn adds $0.75 more.
    answer: 2

  - slug: g4math-u09-check-q18
    type: numeric
    topic_code: "4.MD.A.2"
    source: "IM K–5 Math Grade 4, Unit 9, Section C"
    points: 1
    stimulus: |
      At the school fair, a cup of lemonade costs $1.25 and a bag of popcorn costs $0.75.
    prompt: |
      Amara buys 3 bags of popcorn and pays with a $5 bill. How much change does she get, in dollars? (Type a decimal, such as 1.50.)
    answer: { value: 2.75, tolerance: 0.001 }
    explanation: |
      3 × $0.75 = $2.25. Count up from $2.25 to $5.00: 75 cents to $3.00, then $2.00 to $5.00. Her change is $2.75.

  # ---- Multistep problems (4.OA.A.3) and time (4.MD.A.2)
  - slug: g4math-u09-check-q19
    type: multiple_choice
    topic_code: "4.OA.A.3"
    source: "IM K–5 Math Grade 4, Unit 9, Section C"
    points: 1
    prompt: |
      The fair has 230 prizes. Volunteers pack them into bags of 6 prizes. How many bags can they fill completely, and how many prizes are left over?
    options:
      - "38 full bags, 2 prizes left over"
      - "39 full bags"
      - "37 full bags, 8 prizes left over"
      - "38 full bags, 12 prizes left over"
    option_explanations:
      - |
        Correct. 6 × 38 = 228, and 230 − 228 = 2. So 38 bags are full and 2 prizes are left.
      - |
        39 bags would need 6 × 39 = 234 prizes, but there are only 230. The last bag cannot be filled.
      - |
        8 left over is more than 6, so one more bag can be filled. That makes 38 bags with 2 left.
      - |
        38 × 6 = 228, which leaves 230 − 228 = 2, not 12. Check the subtraction.
    answer: 0

  - slug: g4math-u09-check-q20
    type: multiple_choice
    topic_code: "4.MD.A.2"
    source: "IM K–5 Math Grade 4, Unit 9, Section C"
    points: 1
    prompt: |
      The school concert starts at 5:35 p.m. and lasts 2 hours 40 minutes. When does it end?
    options:
      - "7:75 p.m."
      - "8:15 p.m."
      - "7:15 p.m."
      - "9:15 p.m."
    option_explanations:
      - |
        7:75 adds 35 + 40 = 75 minutes but never trades 60 minutes for an hour. 75 minutes is 1 hour 15 minutes.
      - |
        Correct. 5:35 + 2 hours = 7:35. Then 25 minutes gets to 8:00 and 15 more minutes gets to 8:15.
      - |
        7:15 forgets the extra hour made by 75 minutes. 7:35 plus 40 minutes goes past 8:00.
      - |
        9:15 adds one hour too many. 5:35 + 2 hours is 7:35, and 40 more minutes is 8:15.
    answer: 1

  - slug: g4math-u09-check-q21
    type: numeric
    topic_code: "4.OA.A.3"
    source: "IM K–5 Math Grade 4, Unit 9, Section C"
    points: 1
    prompt: |
      A class collects 6 bags of cans with 125 cans in each bag. Then a neighbor brings 87 more cans. How many cans does the class have now?
    answer: { value: 837, tolerance: 0 }
    explanation: |
      Step 1: 6 × 125 = 750 cans. Step 2: 750 + 87 = 837 cans. Estimate: 6 × 125 is 750, and about 90 more is about 840.

  - slug: g4math-u09-check-q22
    type: short_answer
    topic_code: "4.OA.A.3"
    source: "IM K–5 Math Grade 4, Unit 9, Section C"
    points: 3
    prompt: |
      A bakery bakes 4 trays of rolls with 36 rolls on each tray. It packs the rolls in bags of 8.

      (a) Write an equation with a letter for the number of bags.
      (b) Solve your equation. Show your work.
      (c) Use an estimate to explain why your answer is reasonable.
    answer: |
      (a) (4 × 36) ÷ 8 = b.
      (b) 4 × 36 = 144 rolls. 144 ÷ 8: 8 × 10 = 80, leaving 64, and 8 × 8 = 64. So b = 18 bags.
      (c) 4 × 36 is about 4 × 40 = 160, and 160 ÷ 8 = 20. 18 is close to 20, so it makes sense.
    explanation: |
      Three points.

      (a) 1 pt: an equation with a letter that shows both steps, such as (4 × 36) ÷ 8 = b, or 4 × 36 = r and r ÷ 8 = b.

      (b) 1 pt: 18 bags, with 4 × 36 = 144 shown.

      (c) 1 pt: an estimate with rounded numbers (for example 160 ÷ 8 = 20, or 150 ÷ 8 is about 19) and a sentence comparing it to the answer.
