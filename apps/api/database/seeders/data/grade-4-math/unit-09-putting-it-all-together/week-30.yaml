week: 30
unit: 9
title: "Multiplying and Dividing Big Numbers With Confidence"
topics: ["4.NBT.B.5", "4.NBT.B.6"]
guide: guides/week-30.md
guide_description: |
  A look back at multi-digit multiplication and division: area models and partial products for a one-digit
  number times up to four digits and for two-digit times two-digit, partial quotients for dividing by one
  digit, remainders, and quick checks by estimating and by multiplying back.
flashcards_description: |
  20 cards on partial products, area models, multiplying tens by tens, estimating a product, partial
  quotients, dividing hundreds and thousands, remainders, and checking a division by multiplying.

flashcards:
  - front: Year-end multiplying · 3 × 2,104 → with expanded form
    back: |
      6,312. 3 × 2,000 = 6,000, 3 × 100 = 300, 3 × 0 tens = 0 and 3 × 4 = 12. Then 6,000 + 300 + 12 = 6,312.
    topic_code: "4.NBT.B.5"
  - front: Year-end multiplying · 6 × 47 → partial products
    back: |
      282. 6 × 40 = 240 and 6 × 7 = 42. 240 + 42 = 282.
    topic_code: "4.NBT.B.5"
  - front: Year-end multiplying · 21 × 13 → area model
    back: |
      273. Split 21 into 20 + 1 and 13 into 10 + 3. The four parts are 200, 60, 10 and 3, and 200 + 60 + 10 + 3 = 273.
    topic_code: "4.NBT.B.5"
  - front: Year-end multiplying · two-digit × two-digit → how many partial products
    back: |
      Four. Each part of one factor (tens and ones) multiplies each part of the other, so there are 2 × 2 = 4 parts to add.
    topic_code: "4.NBT.B.5"
  - front: Year-end multiplying · 40 × 30 → think in tens
    back: |
      1,200. 4 tens × 3 tens = 12 hundreds, because a ten times a ten is a hundred.
    topic_code: "4.NBT.B.5"
  - front: Year-end multiplying · 50 × 60 → the product
    back: |
      3,000. 5 × 6 = 30, and tens times tens make hundreds, so it is 30 hundreds.
    topic_code: "4.NBT.B.5"
  - front: Year-end multiplying · 25 × 4 → a handy fact
    back: |
      100. Four quarters make a dollar, and 4 groups of 25 make 100. So 25 × 8 = 200 and 25 × 12 = 300.
    topic_code: "4.NBT.B.5"
  - front: Year-end multiplying · 99 × 6 → use a nearby hundred
    back: |
      594. 100 × 6 = 600, and 99 sixes is one 6 less: 600 − 6 = 594.
    topic_code: "4.NBT.B.5"
  - front: Year-end multiplying · estimate 48 × 31
    back: |
      About 1,500. Round to 50 × 30 = 1,500. (The exact product is 1,488, which is close.)
    topic_code: "4.NBT.B.5"
  - front: Year-end multiplying · 4 × 1,250 → the product
    back: |
      5,000. 4 × 1,000 = 4,000 and 4 × 250 = 1,000. 4,000 + 1,000 = 5,000.
    topic_code: "4.NBT.B.5"
  - front: Year-end multiplying · forgetting a partial product → how to catch it
    back: |
      Count the parts. One digit times a three-digit number gives up to 3 parts; two-digit times two-digit gives 4. Then compare with an estimate.
    topic_code: "4.NBT.B.5"
  - front: Year-end dividing · 96 ÷ 4 → partial quotients
    back: |
      24. Take out 4 × 20 = 80, leaving 16. Take out 4 × 4 = 16, leaving 0. 20 + 4 = 24.
    topic_code: "4.NBT.B.6"
  - front: Year-end dividing · 738 ÷ 6 → partial quotients
    back: |
      123. 6 × 100 = 600, leaving 138. 6 × 20 = 120, leaving 18. 6 × 3 = 18, leaving 0. 100 + 20 + 3 = 123.
    topic_code: "4.NBT.B.6"
  - front: Year-end dividing · remainder → what it is
    back: |
      The amount left over when no more full groups can be made. It is always smaller than the number you divide by.
    topic_code: "4.NBT.B.6"
  - front: Year-end dividing · 47 ÷ 5 → quotient and remainder
    back: |
      9 R 2. Nine groups of 5 make 45, and 2 are left over.
    topic_code: "4.NBT.B.6"
  - front: Year-end dividing · checking 47 ÷ 5 = 9 R 2
    back: |
      Multiply and add the remainder: 5 × 9 = 45, and 45 + 2 = 47. It matches, so the answer is right.
    topic_code: "4.NBT.B.6"
  - front: Year-end dividing · 2,400 ÷ 6 → think in hundreds
    back: |
      400. 2,400 is 24 hundreds. 24 hundreds ÷ 6 = 4 hundreds, which is 400.
    topic_code: "4.NBT.B.6"
  - front: Year-end dividing · 1,624 ÷ 8 → the quotient
    back: |
      203. 8 × 200 = 1,600, leaving 24. 8 × 3 = 24. There are no tens in the quotient, so it is 203, not 23.
    topic_code: "4.NBT.B.6"
  - front: Year-end dividing · a remainder as big as the divisor means
    back: |
      You stopped too soon. If 7 ÷ 3 leaves 4 left over, another group of 3 still fits. Take out one more group.
    topic_code: "4.NBT.B.6"
  - front: Year-end dividing · division as an area model
    back: |
      You know the area and one side of a rectangle and look for the other side. 945 ÷ 7: split 945 into 700, 210 and 35; the sides are 100, 30 and 5, so the answer is 135.
    topic_code: "4.NBT.B.6"

quiz:
  description: |
    14 questions · about 30 minutes · multiplying up to four digits by one digit and two digits by two digits
    with area models and partial products, dividing by one digit with partial quotients and remainders, plus
    review of estimating, subtracting with the standard algorithm and "times as many". Multiple choice,
    select-all, true/false and number answers are graded at once; the fill-in word is matched automatically;
    the short answer is checked by your teacher.
  questions:
    - slug: g4math-w30-q01
      type: numeric
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 9, Section B"
      points: 1
      stimulus: |
        Use the area model for 38 × 27. The rectangle is split into 30 + 8 across the top and 20 + 7 down the side.
      figure: figures/w30-area-model.svg
      figure_alt: "An area model titled Area model for 38 × 27. A rectangle is split into 4 parts. The top side is labeled 30 and 8, and the left side is labeled 20 and 7. The part for 30 and 20 says 600, the part for 8 and 20 says 160, the part for 30 and 7 says 210, and the part for 8 and 7 shows a question mark."
      prompt: |
        What number belongs in the part with the question mark?
      answer: { value: 56, tolerance: 0 }
      explanation: |
        That part is 8 wide and 7 tall, so its area is 8 × 7 = 56.

    - slug: g4math-w30-q02
      type: multiple_choice
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 9, Section B"
      points: 1
      stimulus: |
        Use the area model for 38 × 27. The rectangle is split into 30 + 8 across the top and 20 + 7 down the side.
      prompt: |
        What is 38 × 27?
      options:
        - "970"
        - "1,026"
        - "656"
        - "760"
      option_explanations:
        - |
          970 adds only three parts, 600 + 160 + 210. The fourth part, 8 × 7 = 56, belongs in the total too.
        - |
          Correct. Add all four parts: 600 + 160 + 210 + 56 = 1,026.
        - |
          656 is 30 × 20 + 8 × 7, tens times tens and ones times ones only. The two other parts, 160 and 210, are missing.
        - |
          760 is only the top row, 600 + 160, which is 38 × 20. The bottom row, 38 × 7 = 266, still has to be added.
      answer: 1

    - slug: g4math-w30-q03
      type: multiple_choice
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 9, Section B"
      points: 1
      prompt: |
        What is 5 × 1,328?
      options:
        - "5,640"
        - "1,333"
        - "6,600"
        - "6,640"
      option_explanations:
        - |
          5,640 leaves out a thousand. The parts are 5,000 + 1,500 + 100 + 40, and the 1,500 holds another 1,000.
        - |
          1,333 adds 5 to 1,328. The × sign means 5 groups of 1,328, so multiply each place.
        - |
          6,600 forgets the ones: 5 × 8 = 40 must be added to 5,000 + 1,500 + 100.
        - |
          Correct. 5 × 1,000 = 5,000, 5 × 300 = 1,500, 5 × 20 = 100 and 5 × 8 = 40. The sum is 6,640.
      answer: 3

    - slug: g4math-w30-q04
      type: numeric
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 9, Section B"
      points: 1
      prompt: |
        A school orders 18 boxes of pencils. Each box holds 24 pencils. How many pencils does the school order?
      answer: { value: 432, tolerance: 0 }
      explanation: |
        18 × 24: 10 × 24 = 240 and 8 × 24 = 192. 240 + 192 = 432 pencils. (Estimate: 20 × 24 = 480, so 432 is reasonable.)

    - slug: g4math-w30-q05
      type: multiple_choice
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 9, Section B"
      points: 1
      figure: figures/w30-division-area-model.svg
      figure_alt: "A rectangle titled 945 ÷ 7 as an area model, not drawn to scale. Its left side is labeled 7. It is split into 3 parts with areas 700, 210 and 35. Above each part is a question mark for its unknown width. Below it says Total area: 945."
      prompt: |
        The area model shows 945 ÷ 7. What is 945 ÷ 7?
      options:
        - "135"
        - "1,305"
        - "130"
        - "6,615"
      option_explanations:
        - |
          Correct. 7 × 100 = 700, 7 × 30 = 210 and 7 × 5 = 35. The widths add to 100 + 30 + 5 = 135.
        - |
          1,305 writes the widths 100, 30 and 5 side by side. Add them instead: 100 + 30 + 5 = 135.
        - |
          130 leaves out the last part. 7 × 5 = 35 is part of 945 too, so add 5 more: 135.
        - |
          6,615 is 945 × 7. The model shows a total area of 945 split by a side of 7, which is division.
      answer: 0

    - slug: g4math-w30-q06
      type: multiple_choice
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 9, Section B"
      points: 1
      prompt: |
        What is 75 ÷ 4?
      options:
        - "17 R 7"
        - "19 R 1"
        - "18 R 3"
        - "18"
      option_explanations:
        - |
          17 R 7 leaves 7 over, but 7 is more than 4, so another group of 4 still fits. One more group gives 18 R 3.
        - |
          4 × 19 = 76, which is more than 75. Nineteen groups of 4 do not fit, so the quotient is 18.
        - |
          Correct. 4 × 18 = 72, and 75 − 72 = 3 left over. So 75 ÷ 4 = 18 R 3.
        - |
          4 × 18 = 72, not 75. There are 3 left over, so the answer needs the remainder: 18 R 3.
      answer: 2

    - slug: g4math-w30-q07
      type: numeric
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 9, Section B"
      points: 1
      prompt: |
        Ms. Ruiz has 1,260 stickers. She shares them equally among 6 classrooms. How many stickers does each classroom get?
      answer: { value: 210, tolerance: 0 }
      explanation: |
        1,260 ÷ 6: 6 × 200 = 1,200, leaving 60. 6 × 10 = 60, leaving 0. 200 + 10 = 210 stickers. Check: 6 × 210 = 1,260.

    - slug: g4math-w30-q08
      type: true_false
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 9, Section B"
      points: 1
      prompt: |
        True or false: 60 × 40 = 240.
      answer: false
      explanation: |
        False. 6 tens × 4 tens = 24 hundreds, which is 2,400. 240 is only 6 × 40.

    - slug: g4math-w30-q09
      type: fill_blank
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 9, Section B"
      points: 1
      prompt: |
        In 47 ÷ 5 = 9 R 2, the 2 that is left over is called the ____.
      answer: ["remainder", "the remainder", "remainders"]
      explanation: |
        The remainder is what is left after making as many full groups as you can. Nine groups of 5 use 45, and 2 are left.

    - slug: g4math-w30-q10
      type: multi_select
      topic_code: "4.NBT.B.5"
      source: "IM K–5 Math Grade 4, Unit 9, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which of these are equal to 16 × 25? Select all that apply.
      options:
        - "16 × 20 + 16 × 5"
        - "10 × 25 + 6 × 25"
        - "16 × 2 + 16 × 5"
        - "400"
        - "10 × 20 + 6 × 5"
      option_explanations:
        - |
          Yes. 25 = 20 + 5, so 16 × 25 = 320 + 80 = 400.
        - |
          Yes. 16 = 10 + 6, so 16 × 25 = 250 + 150 = 400.
        - |
          No. The 2 in 25 means 2 tens, so the first part must be 16 × 20, not 16 × 2. This is only 32 + 80 = 112.
        - |
          Yes. 16 × 25 = 400. (Four 25s make 100, and 16 is four groups of 4, so 4 × 100 = 400.)
        - |
          No. This leaves out two partial products, 10 × 5 and 6 × 20. It is only 200 + 30 = 230.
      answer: [0, 1, 3]

    - slug: g4math-w30-q11
      type: multiple_choice
      topic_code: "4.OA.A.3"
      source: "IM K–5 Math Grade 4, Unit 6, Section D"
      points: 1
      prompt: |
        Which is the best estimate for 39 × 52?
      options:
        - "200"
        - "1,500"
        - "20,000"
        - "2,000"
      option_explanations:
        - |
          200 is 4 × 50, which loses a zero. 39 is about 40, which is 4 tens, so 40 × 50 is 2,000.
        - |
          1,500 is 30 × 50. 39 is much closer to 40 than to 30, so round it up.
        - |
          20,000 has one zero too many. 4 tens × 5 tens = 20 hundreds, which is 2,000.
        - |
          Correct. 39 rounds to 40 and 52 rounds to 50. 40 × 50 = 2,000. (The exact product is 2,028.)
      answer: 3

    - slug: g4math-w30-q12
      type: multiple_choice
      topic_code: "4.NBT.B.4"
      source: "IM K–5 Math Grade 4, Unit 4, Section D"
      points: 1
      prompt: |
        What is 7,005 − 2,468?
      options:
        - "5,463"
        - "4,537"
        - "9,473"
        - "4,547"
      option_explanations:
        - |
          5,463 takes the smaller digit from the bigger one in each place. The top has 5 ones and 0 tens, so you must regroup first.
        - |
          Correct. Regroup 7,005 as 6 thousands, 9 hundreds, 9 tens and 15 ones. Then 15 − 8 = 7, 9 − 6 = 3, 9 − 4 = 5, 6 − 2 = 4: 4,537.
        - |
          9,473 adds the two numbers. The minus sign means take 2,468 away from 7,005.
        - |
          4,547 forgets that a ten was traded to the ones. After regrouping, the tens digit is 9, so 9 − 6 = 3, not 4.
      answer: 1

    - slug: g4math-w30-q13
      type: multiple_choice
      topic_code: "4.OA.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section A"
      points: 1
      prompt: |
        Ben's puppy weighs 9 pounds. His aunt's dog weighs 7 times as much. How much does his aunt's dog weigh?
      options:
        - "63 pounds"
        - "16 pounds"
        - "56 pounds"
        - "2 pounds"
      option_explanations:
        - |
          Correct. 7 times as much as 9 pounds is 7 × 9 = 63 pounds.
        - |
          16 is 9 + 7, which would be "7 pounds more". "7 times as much" means multiply: 7 × 9.
        - |
          56 is 7 × 8, one pound short in each group. The puppy weighs 9 pounds, so it is 7 × 9 = 63.
        - |
          2 is 9 − 7. The aunt's dog is heavier, 7 times the puppy's weight, so multiply.
      answer: 0

    - slug: g4math-w30-q14
      type: short_answer
      topic_code: "4.NBT.B.6"
      source: "IM K–5 Math Grade 4, Unit 9, Section B"
      points: 2
      prompt: |
        (a) Find 1,148 ÷ 4 with partial quotients. Show each step.
        (b) Check your answer by multiplying.
      answer: |
        (a) 4 × 200 = 800, leaving 1,148 − 800 = 348. 4 × 80 = 320, leaving 28. 4 × 7 = 28, leaving 0. 200 + 80 + 7 = 287.
        (b) 4 × 287 = 800 + 320 + 28 = 1,148, so 1,148 ÷ 4 = 287 is right.
      explanation: |
        Two points.

        (a) 1 pt: 287, with partial quotients that each take out a multiple of 4 and end at 0. Other correct chunks (such as 250 + 37) earn the point.

        (b) 1 pt: a multiplication of 287 by 4 that gives 1,148, with a sentence or mark saying it matches.
