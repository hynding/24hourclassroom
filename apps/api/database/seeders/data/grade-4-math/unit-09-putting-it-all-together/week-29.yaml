week: 29
unit: 9
title: "Reasoning With Fractions and Mixed Numbers"
topics: ["4.NF.B.3", "4.NF.A.2"]
guide: guides/week-29.md
guide_description: |
  A look back at the year's fraction work: adding and subtracting fractions and mixed numbers with the same
  denominator, trading a whole for fourths or eighths when you subtract, breaking a fraction into parts, and
  comparing fractions with 1/2, with the missing piece, or with a common denominator.
flashcards_description: |
  20 cards on adding and subtracting fractions and mixed numbers, writing mixed numbers as fractions and back,
  decomposing fractions, comparing fractions four ways, tenths plus hundredths, and line plots with eighths.

flashcards:
  - front: Year-end fractions · 3/8 + 4/8 → the sum
    back: |
      7/8. Three eighths and four eighths make seven eighths. The denominator stays 8 because the pieces are still eighths.
    topic_code: "4.NF.B.3"
  - front: Year-end fractions · 9/10 − 4/10 → the difference
    back: |
      5/10. Nine tenths take away four tenths leaves five tenths.
    topic_code: "4.NF.B.3"
  - front: Year-end fractions · why the denominator does not change when you add
    back: |
      The denominator names the size of the pieces. Adding eighths to eighths gives more eighths, not a new size. Only the numerator, the count of pieces, changes.
    topic_code: "4.NF.B.3"
  - front: Year-end fractions · 7/5 → as a mixed number
    back: |
      1 2/5. Five fifths make 1 whole, and 2 fifths are left over.
    topic_code: "4.NF.B.3"
  - front: Year-end fractions · 2 3/4 → as a fraction
    back: |
      11/4. Each whole is 4 fourths, so 2 wholes are 8 fourths. 8 fourths and 3 more fourths make 11 fourths.
    topic_code: "4.NF.B.3"
  - front: Year-end fractions · 1 5/6 + 2 4/6 → the sum
    back: |
      4 3/6. Add the wholes: 1 + 2 = 3. Add the sixths: 5/6 + 4/6 = 9/6, which is 1 3/6. Then 3 + 1 3/6 = 4 3/6.
    topic_code: "4.NF.B.3"
  - front: Year-end fractions · 4 1/8 − 1 3/8 → the difference
    back: |
      2 6/8. You cannot take 3/8 from 1/8, so trade 1 whole for 8/8: 4 1/8 = 3 9/8. Then 3 9/8 − 1 3/8 = 2 6/8.
    topic_code: "4.NF.B.3"
  - front: Year-end fractions · trading a whole when you subtract
    back: |
      Take 1 from the whole number and add it to the fraction as a full set of pieces. For fourths, 1 whole is 4/4, so 5 1/4 becomes 4 5/4.
    topic_code: "4.NF.B.3"
  - front: Year-end fractions · 5/6 → as a sum of unit fractions
    back: |
      1/6 + 1/6 + 1/6 + 1/6 + 1/6. A unit fraction has a numerator of 1, and five of them make 5/6.
    topic_code: "4.NF.B.3"
  - front: Year-end fractions · 5/6 → two more ways to decompose it
    back: |
      2/6 + 3/6 and 1/6 + 4/6. Any parts whose numerators add to 5 work, as long as they are all sixths.
    topic_code: "4.NF.B.3"
  - front: Year-end fractions · 3 × 2/5 → the product
    back: |
      6/5, which is 1 1/5. Three groups of 2 fifths is 6 fifths.
    topic_code: "4.NF.B.4"
  - front: Year-end fractions · 5/8 or 5/12 → which is greater
    back: |
      5/8. Both have 5 pieces, but eighths are bigger pieces than twelfths, so 5 eighths is more.
    topic_code: "4.NF.A.2"
  - front: Year-end fractions · 7/10 or 3/10 → which is greater
    back: |
      7/10. The pieces are the same size (tenths), so the one with more pieces is greater.
    topic_code: "4.NF.A.2"
  - front: Year-end fractions · 3/8 or 4/6 → compare each with 1/2
    back: |
      4/6 is greater. Half of 8 is 4, so 3/8 is less than 1/2. Half of 6 is 3, so 4/6 is more than 1/2.
    topic_code: "4.NF.A.2"
  - front: Year-end fractions · 2/3 or 3/4 → compare the missing pieces
    back: |
      3/4 is greater. Each is one piece short of 1 whole. A missing fourth is smaller than a missing third, so 3/4 is closer to 1.
    topic_code: "4.NF.A.2"
  - front: Year-end fractions · 3/5 or 7/10 → use a common denominator
    back: |
      7/10 is greater. 3/5 = 6/10 (multiply the top and bottom by 2), and 6/10 is less than 7/10.
    topic_code: "4.NF.A.2"
  - front: Year-end fractions · comparing only makes sense when
    back: |
      The fractions are parts of the same-size whole. Half of a big pizza is more pizza than half of a small one.
    topic_code: "4.NF.A.2"
  - front: Year-end fractions · 6/10 + 25/100 → the sum
    back: |
      85/100. Write 6/10 as 60/100 first, then add hundredths: 60/100 + 25/100 = 85/100.
    topic_code: "4.NF.C.5"
  - front: Year-end fractions · line plot in eighths → finding the longest minus the shortest
    back: |
      Find the X farthest to the right and the X farthest to the left, then subtract their values. Count the spaces between tick marks, not the tick marks.
    topic_code: "4.MD.B.4"
  - front: Year-end fractions · checking 7/8 − 3/8 = 4/8
    back: |
      Add back what you took away: 4/8 + 3/8 = 7/8. You are back where you started, so the subtraction is right.
    topic_code: "4.NF.B.3"

quiz:
  description: |
    14 questions · about 30 minutes · adding and subtracting fractions and mixed numbers with the same
    denominator, comparing fractions, a number line in fourths, fraction strips and a line plot in eighths, plus
    review of multiplying a fraction by a whole number and adding tenths and hundredths. Multiple choice,
    select-all, true/false and number answers are graded at once; the fill-in word is matched automatically;
    the short answer is checked by your teacher.
  questions:
    - slug: g4math-w29-q01
      type: multiple_choice
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 9, Section A"
      points: 1
      stimulus: |
        Use the number line from 0 to 3. It is marked in fourths, and points P and Q are on it.
      figure: figures/w29-mixed-number-line.svg
      figure_alt: "A number line titled Number line from 0 to 3, in fourths. The whole numbers 0, 1, 2 and 3 are labeled, with 3 small tick marks between each pair, so each space is one fourth. Point P is on the first small tick after 1. Point Q is on the third small tick after 2."
      prompt: |
        What mixed number is at point Q?
      options:
        - "2 1/4"
        - "3 3/4"
        - "2 3/4"
        - "1 3/4"
      option_explanations:
        - |
          2 1/4 counts the one space from Q to 3. Count forward from 2 instead: Q is 3 spaces past 2, so it is 2 3/4.
        - |
          3 3/4 would be past the end of this number line. Q sits between 2 and 3, so its whole number part is 2.
        - |
          Correct. Q is past 2 and 3 fourth-spaces further on, so it is at 2 3/4.
        - |
          1 3/4 is 3 fourths past 1. Q is 3 fourths past 2, one whole further to the right.
      answer: 2

    - slug: g4math-w29-q02
      type: numeric
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 9, Section A"
      points: 1
      stimulus: |
        Use the number line from 0 to 3. It is marked in fourths, and points P and Q are on it.
      prompt: |
        How far is it from point P to point Q? Give your answer as a number of fourths.
      answer: { value: 6, tolerance: 0 }
      explanation: |
        P is at 1 1/4 and Q is at 2 3/4. From 1 1/4 to 2 1/4 is 1 whole, which is 4 fourths. Then 2 more fourths reach 2 3/4. 4 + 2 = 6 fourths, which is 1 2/4.

    - slug: g4math-w29-q03
      type: multiple_choice
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 9, Section A"
      points: 1
      stimulus: |
        Use the number line from 0 to 3. It is marked in fourths, and points P and Q are on it.
      prompt: |
        Mira starts at point P and jumps forward 1 3/4. Where does she land?
      options:
        - "3"
        - "2 4/8"
        - "2"
        - "3 1/4"
      option_explanations:
        - |
          Correct. 1 1/4 + 1 3/4: the wholes make 2, and 1/4 + 3/4 = 4/4, which is 1 more whole. 2 + 1 = 3.
        - |
          2 4/8 adds the denominators too. Fourths plus fourths are still fourths: 1/4 + 3/4 = 4/4.
        - |
          2 adds only the whole numbers, 1 + 1. The fourths add to 4/4, one more whole, so she lands on 3.
        - |
          3 1/4 is one fourth too far. 1/4 + 3/4 = 4/4 exactly, so nothing is left over past 3.
      answer: 0

    - slug: g4math-w29-q04
      type: multiple_choice
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 9, Section A"
      points: 1
      figure: figures/w29-fraction-strips.svg
      figure_alt: "Three fraction strips of the same length. The top strip is 1 whole. The middle strip is cut into 6 equal parts labeled 1/6, and 5 of them are shaded blue, marked 5/6. The bottom strip is cut into 4 equal parts labeled 1/4, and 3 of them are shaded green, marked 3/4. The shaded part of the middle strip reaches a little farther than the shaded part of the bottom strip."
      prompt: |
        Use the fraction strips. Which sentence is true?
      options:
        - "3/4 is greater than 5/6."
        - "5/6 is greater than 3/4."
        - "5/6 and 3/4 are equal."
        - "Sixths and fourths cannot be compared."
      option_explanations:
        - |
          Fourths are bigger pieces, but 3/4 is missing a whole fourth, while 5/6 is missing only a smaller sixth. The blue part reaches farther.
        - |
          Correct. Each strip is one piece short of a whole. A missing sixth is smaller than a missing fourth, so 5/6 is greater. The strips show it too.
        - |
          Both are one piece short of 1, but the missing pieces are different sizes. The shaded parts end in different places, so they are not equal.
        - |
          Any two fractions of the same whole can be compared. Here the strips are the same length, so you can see which shaded part is longer.
      answer: 1

    - slug: g4math-w29-q05
      type: multiple_choice
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 9, Section A"
      points: 1
      prompt: |
        Four friends ate 3/8, 5/12, 4/10 and 4/6 of the same-size sandwiches. Which amount is more than 1/2 of a sandwich?
      options:
        - "3/8"
        - "5/12"
        - "4/10"
        - "4/6"
      option_explanations:
        - |
          Half of 8 eighths is 4 eighths. 3/8 is one eighth less than that, so it is less than 1/2.
        - |
          Half of 12 twelfths is 6 twelfths. 5/12 is one twelfth short of 1/2, so it is less than 1/2.
        - |
          Half of 10 tenths is 5 tenths. 4/10 is one tenth less than 5/10, so it is less than 1/2.
        - |
          Correct. Half of 6 sixths is 3 sixths, and 4/6 is one sixth more than that, so it is greater than 1/2.
      answer: 3

    - slug: g4math-w29-q06
      type: true_false
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 9, Section A"
      points: 1
      prompt: |
        True or false: 3/5 is greater than 7/10.
      answer: false
      explanation: |
        False. Multiply the top and bottom of 3/5 by 2 to get 6/10. Six tenths is less than seven tenths, so 3/5 is less than 7/10.

    - slug: g4math-w29-q07
      type: numeric
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 9, Section A"
      points: 1
      prompt: |
        A loaf of banana bread is cut into 12 equal slices. The family eats 5/12 of the loaf at breakfast and 4/12 at lunch. How many twelfths of the loaf are left?
      answer: { value: 3, tolerance: 0 }
      explanation: |
        They ate 5/12 + 4/12 = 9/12. The whole loaf is 12/12, so 12/12 − 9/12 = 3/12 is left. That is 3 twelfths.

    - slug: g4math-w29-q08
      type: multiple_choice
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 9, Section A"
      points: 1
      prompt: |
        Ana has a ribbon 3 1/4 feet long. She cuts off 1 3/4 feet for a bow. How much ribbon is left?
      options:
        - "2 2/4 feet"
        - "1 2/4 feet"
        - "5 feet"
        - "2 1/4 feet"
      option_explanations:
        - |
          2 2/4 takes 1/4 from 3/4, the wrong way round. You cannot take 3/4 from 1/4, so trade a whole first: 3 1/4 = 2 5/4.
        - |
          Correct. Trade 1 whole for 4/4: 3 1/4 = 2 5/4. Then 2 5/4 − 1 3/4 = 1 2/4 feet.
        - |
          5 feet adds the two lengths. Ana cut ribbon off, so subtract 1 3/4 from 3 1/4.
        - |
          2 1/4 takes away only the 1 whole foot. The 3/4 foot must come off too, which leaves 1 2/4 feet.
      answer: 1

    - slug: g4math-w29-q09
      type: fill_blank
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 9, Section A"
      points: 1
      prompt: |
        3 5/8 has a whole number and a fraction together. A number written this way is called a ____.
      answer: ["mixed number", "a mixed number", "mixed numbers", "mixed"]
      explanation: |
        A mixed number is a whole number and a fraction written together. 3 5/8 means 3 wholes and 5/8 more, which is the same as 29/8.

    - slug: g4math-w29-q10
      type: multi_select
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 9, Section A"
      points: 2
      partial_credit: true
      prompt: |
        Which of these are equal to 7/8? Select all that apply.
      options:
        - "4/8 + 3/8"
        - "2/8 + 5/8"
        - "3/4 + 4/4"
        - "1 − 1/8"
        - "3/8 + 4/8 + 1/8"
      option_explanations:
        - |
          Yes. 4 eighths and 3 eighths make 7 eighths.
        - |
          Yes. 2 eighths and 5 eighths make 7 eighths.
        - |
          No. These are fourths: 3/4 + 4/4 = 7/4, which is 1 3/4, much more than 7/8.
        - |
          Yes. 1 whole is 8/8, and 8/8 − 1/8 = 7/8.
        - |
          No. 3 + 4 + 1 = 8, so this is 8/8, which is 1 whole, one eighth more than 7/8.
      answer: [0, 1, 3]

    - slug: g4math-w29-q11
      type: multiple_choice
      topic_code: "4.MD.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      figure: figures/w29-sprout-line-plot.svg
      figure_alt: "A line plot titled Lengths of Bean Sprouts. The scale is Length in inches and goes from 1 to 2 in eighths: 1, 1 1/8, 1 2/8, 1 3/8, 1 4/8, 1 5/8, 1 6/8, 1 7/8, 2. There is 1 X above 1 1/8, 2 Xs above 1 3/8, 3 Xs above 1 4/8, 2 Xs above 1 6/8 and 1 X above 1 7/8."
      prompt: |
        Each X on the line plot is one bean sprout. How much longer is the longest sprout than the shortest sprout?
      options:
        - "7/8 inch"
        - "3 inches"
        - "6/8 inch"
        - "2 8/8 inches"
      option_explanations:
        - |
          7/8 counts the tick marks from 1 1/8 to 1 7/8. Count the spaces between them instead: there are 6, so the difference is 6/8 inch.
        - |
          3 is the tallest stack of Xs, which tells how many sprouts have one length. The question asks about inches between two lengths.
        - |
          Correct. The longest sprout is 1 7/8 inches and the shortest is 1 1/8 inches. 1 7/8 − 1 1/8 = 6/8 inch.
        - |
          2 8/8 adds the two lengths, 1 7/8 + 1 1/8. "How much longer" asks for the difference, so subtract.
      answer: 2

    - slug: g4math-w29-q12
      type: multiple_choice
      topic_code: "4.NF.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section A"
      points: 1
      prompt: |
        Tomás gives each of his 3 rabbits 2/5 of a carrot. How many carrots is that in all?
      options:
        - "6/5"
        - "6/15"
        - "5/5"
        - "3 2/5"
      option_explanations:
        - |
          Correct. 3 groups of 2 fifths is 6 fifths: 3 × 2/5 = 6/5, which is 1 1/5 carrots.
        - |
          6/15 multiplies the denominator too. The pieces are still fifths, so only the number of pieces changes: 6 fifths.
        - |
          5/5 adds 3 + 2 on top. There are 3 equal groups of 2/5, so multiply: 3 × 2 = 6 fifths.
        - |
          3 2/5 writes the 3 rabbits as 3 whole carrots. Each rabbit gets only 2/5 of a carrot, so the total is 6/5.
      answer: 0

    - slug: g4math-w29-q13
      type: multiple_choice
      topic_code: "4.NF.C.5"
      source: "IM K–5 Math Grade 4, Unit 3, Section C"
      points: 1
      prompt: |
        What is 4/10 + 35/100?
      options:
        - "39/100"
        - "39/110"
        - "75/10"
        - "75/100"
      option_explanations:
        - |
          39/100 adds 4 + 35 without changing the tenths first. 4 tenths is 40 hundredths, so add 40 + 35.
        - |
          39/110 adds the tops and the bottoms. Make the denominators match first: 4/10 = 40/100.
        - |
          75 is the right count, but of hundredths, not tenths. 75/10 would be more than 7 wholes.
        - |
          Correct. 4/10 = 40/100, and 40/100 + 35/100 = 75/100.
      answer: 3

    - slug: g4math-w29-q14
      type: short_answer
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 9, Section A"
      points: 2
      prompt: |
        Lily hiked 2 3/8 miles on Saturday. Kai hiked 1 7/8 miles.

        (a) How many miles did they hike together? Show your work.
        (b) How much farther did Lily hike than Kai? Show your work.
      answer: |
        (a) 2 3/8 + 1 7/8: wholes 2 + 1 = 3, eighths 3/8 + 7/8 = 10/8 = 1 2/8. Together 3 + 1 2/8 = 4 2/8 miles.
        (b) 2 3/8 − 1 7/8: trade 1 whole, so 2 3/8 = 1 11/8. Then 1 11/8 − 1 7/8 = 4/8 mile.
      explanation: |
        Two points.

        (a) 1 pt: 4 2/8 miles (or 34/8, or 4 1/4), with work that adds the wholes and the eighths or counts on a number line.

        (b) 1 pt: 4/8 mile (or 1/2), with work that trades a whole for 8/8, counts up from 1 7/8, or subtracts 15/8 from 19/8.
