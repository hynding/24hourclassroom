week: 31
unit: 9
title: "Solving Problems With Everything We Know"
topics: ["4.OA.A.3", "4.MD.A.2"]
guide: guides/week-31.md
guide_description: |
  How to plan and solve multistep word problems: draw a diagram, write an equation with a letter for the
  unknown, decide what a remainder means, change units before you compute, work with money and elapsed time,
  and check every answer with an estimate.
flashcards_description: |
  20 cards on a plan for multistep problems, letters for unknowns, three ways to use a remainder, unit
  conversions you need most, money, elapsed time, fractions in measurement, and "times as many" versus
  "more than".

flashcards:
  - front: Year-end problems · a multistep problem → a plan
    back: |
      Read it twice. Draw a picture or diagram. Write an equation with a letter for the unknown. Solve one step at a time. Check with an estimate.
    topic_code: "4.OA.A.3"
  - front: Year-end problems · a letter in an equation → what it stands for
    back: |
      The number you do not know yet. In 4 × 12 + 9 = t, the letter t stands for the total.
    topic_code: "4.OA.A.3"
  - front: Year-end problems · 50 students, vans of 6 → how many vans
    back: |
      9 vans. 50 ÷ 6 = 8 R 2. Eight vans leave 2 students behind, so one more van is needed. Round the quotient up.
    topic_code: "4.OA.A.3"
  - front: Year-end problems · 50 muffins, boxes of 6 → how many full boxes
    back: |
      8 full boxes. 50 ÷ 6 = 8 R 2. The 2 extra muffins cannot fill a box, so drop the remainder.
    topic_code: "4.OA.A.3"
  - front: Year-end problems · 50 cards dealt to 6 players → how many left in the deck
    back: |
      2 cards. 50 ÷ 6 = 8 R 2. The question asks what is left over, so the remainder is the answer.
    topic_code: "4.OA.A.3"
  - front: Year-end problems · checking with an estimate
    back: |
      Round the numbers, solve the easy problem, and compare. If 6 × 48 + 19 is about 6 × 50 + 20 = 320, an answer of 3,107 cannot be right.
    topic_code: "4.OA.A.3"
  - front: Year-end problems · "3 times as many as 8" vs. "3 more than 8"
    back: |
      3 times as many as 8 is 3 × 8 = 24. 3 more than 8 is 8 + 3 = 11. Read which one the problem says.
    topic_code: "4.OA.A.2"
  - front: Year-end problems · 1 hour and 1 minute → in smaller units
    back: |
      1 hour = 60 minutes, and 1 minute = 60 seconds.
    topic_code: "4.MD.A.1"
  - front: Year-end problems · 3 hours 15 minutes → in minutes
    back: |
      195 minutes. 3 × 60 = 180 minutes, and 180 + 15 = 195.
    topic_code: "4.MD.A.1"
  - front: Year-end problems · 2 kilometers → in meters
    back: |
      2,000 meters. 1 kilometer = 1,000 meters, so 2 × 1,000 = 2,000.
    topic_code: "4.MD.A.1"
  - front: Year-end problems · 4 kilograms → in grams
    back: |
      4,000 grams. 1 kilogram = 1,000 grams.
    topic_code: "4.MD.A.1"
  - front: Year-end problems · 3 liters → in milliliters
    back: |
      3,000 milliliters. 1 liter = 1,000 milliliters.
    topic_code: "4.MD.A.1"
  - front: Year-end problems · 5 pounds → in ounces
    back: |
      80 ounces. 1 pound = 16 ounces, and 5 × 16 = 80.
    topic_code: "4.MD.A.1"
  - front: Year-end problems · 4 yards → in feet and in inches
    back: |
      12 feet, which is 144 inches. 1 yard = 3 feet and 1 foot = 12 inches, so 12 × 12 = 144.
    topic_code: "4.MD.A.1"
  - front: Year-end problems · change from $5.00 for $3.65
    back: |
      $1.35. Count up: $3.65 + 5 cents = $3.70, + 30 cents = $4.00, + $1.00 = $5.00. 5 cents + 30 cents + $1.00 = $1.35.
    topic_code: "4.MD.A.2"
  - front: Year-end problems · 3 × $1.25 → the cost
    back: |
      $3.75. Three dollars and three quarters: $3.00 + 75 cents.
    topic_code: "4.MD.A.2"
  - front: Year-end problems · 2 3/4 cups + 1 3/4 cups → the total
    back: |
      4 2/4 cups. Wholes: 2 + 1 = 3. Fourths: 3/4 + 3/4 = 6/4 = 1 2/4. Then 3 + 1 2/4 = 4 2/4.
    topic_code: "4.MD.A.2"
  - front: Year-end problems · from 9:40 a.m. to 11:15 a.m. → how long
    back: |
      1 hour 35 minutes. 9:40 to 10:00 is 20 minutes, 10:00 to 11:00 is 1 hour, 11:00 to 11:15 is 15 minutes. 20 + 15 = 35 minutes.
    topic_code: "4.MD.A.2"
  - front: Year-end problems · 100 cm of ribbon cut into 30 cm pieces
    back: |
      3 pieces with 10 cm left over. 100 ÷ 30 = 3 R 10, because 3 × 30 = 90.
    topic_code: "4.MD.A.2"
  - front: Year-end problems · mixed units like 2 m and 40 cm → what to do first
    back: |
      Change to the smaller unit before you add or compare. 2 m = 200 cm, so 2 m 40 cm is 240 cm.
    topic_code: "4.MD.A.2"

quiz:
  description: |
    14 questions · about 35 minutes · multistep word problems with whole numbers, what to do with a remainder,
    liquid volume, mass, length, money and elapsed time, a conversion table, a time number line and a tape
    diagram, plus review of perimeter and area and of unknown angles. Multiple choice, select-all, true/false
    and number answers are graded at once; the fill-in word is matched automatically; the short answer is
    checked by your teacher.
  questions:
    - slug: g4math-w31-q01
      type: multiple_choice
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 1
      stimulus: |
        Use the table "Liters and Milliliters". The class garden club uses it to measure water for its plants.
      figure: figures/w31-liters-table.svg
      figure_alt: "A table titled Liters and Milliliters with two columns. 1 liter is 1,000 milliliters, 2 liters is 2,000, 3 liters is 3,000, 4 liters is 4,000, and the milliliters for 5 liters show a question mark."
      prompt: |
        What number belongs in the table for 5 liters?
      options:
        - "500"
        - "50,000"
        - "5,000"
        - "1,005"
      option_explanations:
        - |
          500 is only half a liter. Each liter is 1,000 milliliters, so 5 liters is 5 × 1,000.
        - |
          50,000 has one zero too many. The table goes up by 1,000 each row, so 4,000 + 1,000 = 5,000.
        - |
          Correct. Each liter is 1,000 milliliters, so 5 liters is 5 × 1,000 = 5,000 milliliters.
        - |
          1,005 adds 5 to 1,000. The pattern multiplies: 5 liters is 5 groups of 1,000 milliliters.
      answer: 2

    - slug: g4math-w31-q02
      type: numeric
      topic_code: "4.MD.A.2"
      source: "IM K–5 Math Grade 4, Unit 9, Section C"
      points: 1
      stimulus: |
        Use the table "Liters and Milliliters". The class garden club uses it to measure water for its plants.
      prompt: |
        The club has 3 liters of water. Each tomato plant gets 250 milliliters. How many tomato plants can the club water?
      answer: { value: 12, tolerance: 0 }
      explanation: |
        3 liters is 3,000 milliliters. 4 plants use 4 × 250 = 1,000 milliliters, which is 1 liter. So 3 liters water 3 × 4 = 12 plants. (Or 3,000 ÷ 250 = 12.)

    - slug: g4math-w31-q03
      type: multiple_choice
      topic_code: "4.OA.A.3"
      source: "IM K–5 Math Grade 4, Unit 9, Section C"
      points: 1
      prompt: |
        75 students are going on a field trip. Each van holds 8 students. How many vans are needed so every student has a seat?
      options:
        - "10"
        - "9"
        - "9 R 3"
        - "3"
      option_explanations:
        - |
          Correct. 75 ÷ 8 = 9 R 3. Nine vans carry 72 students, and the last 3 students need one more van, so 10 vans.
        - |
          9 vans hold only 9 × 8 = 72 students. The other 3 students would have no seat.
        - |
          9 R 3 is the division answer, but you cannot order part of a van. The 3 extra students need a whole van.
        - |
          3 is the remainder, the students left after filling 9 vans. The question asks for the number of vans.
      answer: 0

    - slug: g4math-w31-q04
      type: multiple_choice
      topic_code: "4.OA.A.3"
      source: "IM K–5 Math Grade 4, Unit 9, Section C"
      points: 1
      prompt: |
        Kenji buys 4 packs of stickers with 36 stickers in each pack. He gives 58 stickers to his cousins. How many stickers does he have now?
      options:
        - "144"
        - "202"
        - "98"
        - "86"
      option_explanations:
        - |
          144 is the first step, 4 × 36. Kenji then gives 58 away, so subtract: 144 − 58.
        - |
          202 adds the 58 stickers. He gave them away, so take them away from 144.
        - |
          98 comes from 4 × 36 = 156, a slip. 4 × 30 = 120 and 4 × 6 = 24, so 4 × 36 = 144, and 144 − 58 = 86.
        - |
          Correct. 4 × 36 = 144 stickers, and 144 − 58 = 86 stickers left.
      answer: 3

    - slug: g4math-w31-q05
      type: numeric
      topic_code: "4.MD.A.2"
      source: "IM K–5 Math Grade 4, Unit 9, Section C"
      points: 1
      prompt: |
        Rosa buys a notebook for $2.75 and a pen for $1.60. She pays with a $5 bill. How much change does she get, in dollars? (Type a decimal, such as 1.50.)
      answer: { value: 0.65, tolerance: 0.001 }
      explanation: |
        $2.75 + $1.60 = $4.35. Count up from $4.35 to $5.00: 5 cents to $4.40, then 60 cents to $5.00. 5 + 60 = 65 cents, which is $0.65.

    - slug: g4math-w31-q06
      type: multiple_choice
      topic_code: "4.MD.A.2"
      source: "IM K–5 Math Grade 4, Unit 9, Section C"
      points: 1
      figure: figures/w31-time-jumps.svg
      figure_alt: "A number line titled Reading club: 2:45 p.m. to 4:10 p.m. It is marked 2:45, 3:00, 4:00 and 4:10. A jump labeled plus 15 min goes from 2:45 to 3:00, a jump labeled plus 1 hour goes from 3:00 to 4:00, and a jump labeled plus 10 min goes from 4:00 to 4:10."
      prompt: |
        The reading club met from 2:45 p.m. to 4:10 p.m. How long did it meet?
      options:
        - "1 hour 65 minutes"
        - "1 hour 25 minutes"
        - "2 hours 25 minutes"
        - "1 hour 35 minutes"
      option_explanations:
        - |
          1 hour 65 minutes comes from 410 − 245 = 165, as if an hour had 100 minutes. Follow the jumps instead: 15 min + 1 hour + 10 min.
        - |
          Correct. The jumps are 15 minutes, 1 hour and 10 minutes. 15 + 10 = 25 minutes, so 1 hour 25 minutes.
        - |
          2 hours 25 minutes counts one hour too many. There is only one full-hour jump, from 3:00 to 4:00.
        - |
          1 hour 35 minutes counts 25 minutes from 2:45 to 3:00. That first jump is only 15 minutes, so 15 + 10 = 25 minutes.
      answer: 1

    - slug: g4math-w31-q07
      type: true_false
      topic_code: "4.MD.A.2"
      source: "IM K–5 Math Grade 4, Unit 9, Section C"
      points: 1
      prompt: |
        True or false: a board that is 3 feet 4 inches long is 40 inches long.
      answer: true
      explanation: |
        True. 3 feet is 3 × 12 = 36 inches, and 36 + 4 = 40 inches.

    - slug: g4math-w31-q08
      type: fill_blank
      topic_code: "4.OA.A.3"
      source: "IM K–5 Math Grade 4, Unit 9, Section C"
      points: 1
      prompt: |
        Before solving 48 × 6, Maya rounds it to 50 × 6 = 300 to get a close answer. The number 300 is an ____ of the product.
      answer: ["estimate", "an estimate", "estimates", "estimation"]
      explanation: |
        An estimate is a close answer found with rounded numbers. The exact product is 288, which is close to 300, so the estimate helps Maya check her work.

    - slug: g4math-w31-q09
      type: multi_select
      topic_code: "4.MD.A.1"
      source: "IM K–5 Math Grade 4, Unit 5, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Bags of garden soil come in different sizes. Which bags weigh more than 2 kilograms? Select all that apply.
      options:
        - "2,500 grams"
        - "1,900 grams"
        - "3 kilograms"
        - "200 grams"
        - "2 kilograms 50 grams"
      option_explanations:
        - |
          Yes. 2 kilograms is 2,000 grams, and 2,500 grams is 500 grams more.
        - |
          No. 1,900 grams is 100 grams less than 2,000 grams.
        - |
          Yes. 3 kilograms is 1 kilogram more than 2 kilograms.
        - |
          No. 200 grams is far less than 2,000 grams. It is only one tenth of 2 kilograms.
        - |
          Yes. 2 kilograms 50 grams is 2,050 grams, which is 50 grams more than 2,000.
      answer: [0, 2, 4]

    - slug: g4math-w31-q10
      type: multiple_choice
      topic_code: "4.OA.A.2"
      source: "IM K–5 Math Grade 4, Unit 5, Section A"
      points: 1
      figure: figures/w31-tape-diagram.svg
      figure_alt: "A tape diagram titled Pages read. Omar's tape is 1 box with a question mark. Lena's tape is 3 boxes of the same size, each with a question mark. A bracket next to both tapes says 96 pages in all."
      prompt: |
        Lena read 3 times as many pages as Omar. Together they read 96 pages. How many pages did Lena read?
      options:
        - "72"
        - "24"
        - "32"
        - "288"
      option_explanations:
        - |
          Correct. There are 4 equal boxes in all, so each box is 96 ÷ 4 = 24 pages. Lena has 3 boxes: 3 × 24 = 72 pages.
        - |
          24 is one box, which is Omar's pages. Lena has 3 of those boxes.
        - |
          32 is 96 ÷ 3, which leaves out Omar's box. The 96 pages fill all 4 boxes, so divide by 4.
        - |
          288 is 96 × 3. The 96 pages are the total for both readers, so share them into 4 equal boxes.
      answer: 0

    - slug: g4math-w31-q11
      type: multiple_choice
      topic_code: "4.MD.C.7"
      source: "IM K–5 Math Grade 4, Unit 7, Section C"
      points: 1
      prompt: |
        Two angles together make a straight angle. One of them measures 65°. What does the other angle measure?
      options:
        - "25°"
        - "295°"
        - "115°"
        - "125°"
      option_explanations:
        - |
          25° is 90° − 65°, which would finish a right angle. A straight angle is 180°.
        - |
          295° is 360° − 65°, which would finish a full turn. A straight angle is half a turn, 180°.
        - |
          Correct. A straight angle measures 180°, and 180° − 65° = 115°.
        - |
          125° is a subtraction slip. Count up from 65°: 35° more is 100°, and 80° more is 180°. 35 + 80 = 115°.
      answer: 2

    - slug: g4math-w31-q12
      type: multiple_choice
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      prompt: |
        A rectangular flower bed has a perimeter of 30 meters. One side is 9 meters long. What is the area of the flower bed?
      options:
        - "270 square meters"
        - "21 square meters"
        - "189 square meters"
        - "54 square meters"
      option_explanations:
        - |
          270 is 30 × 9, the perimeter times one side. Find the other side first: 30 − 9 − 9 = 12, and half of 12 is 6.
        - |
          21 is 30 − 9, which takes away only one 9-meter side. A rectangle has two 9-meter sides and two other equal sides.
        - |
          189 is 21 × 9, using 21 as the other side. The other side is (30 − 18) ÷ 2 = 6 meters.
        - |
          Correct. The two 9-meter sides use 18 meters, leaving 12 for the other two sides, so each is 6 meters. Area = 9 × 6 = 54 square meters.
      answer: 3

    - slug: g4math-w31-q13
      type: numeric
      topic_code: "4.OA.A.3"
      source: "IM K–5 Math Grade 4, Unit 9, Section C"
      points: 1
      prompt: |
        A school buys 6 boxes of crayons with 144 crayons in each box. It shares all the crayons equally among 8 classes. How many crayons does each class get?
      answer: { value: 108, tolerance: 0 }
      explanation: |
        Step 1: 6 × 144 = 864 crayons. Step 2: 864 ÷ 8: 8 × 100 = 800, leaving 64, and 8 × 8 = 64. So 108 crayons for each class. Check: 8 × 108 = 864.

    - slug: g4math-w31-q14
      type: short_answer
      topic_code: "4.OA.A.3"
      source: "IM K–5 Math Grade 4, Unit 9, Section C"
      points: 2
      prompt: |
        The art club has 150 beads. Each bracelet uses 8 beads.

        (a) How many bracelets can the club make, and how many beads are left over?
        (b) The club wants to make 20 bracelets. How many more beads does it need? Show your work.
      answer: |
        (a) 150 ÷ 8 = 18 R 6, because 8 × 18 = 144 and 150 − 144 = 6. So 18 bracelets, with 6 beads left over.
        (b) 20 bracelets need 20 × 8 = 160 beads. 160 − 150 = 10 more beads.
      explanation: |
        Two points.

        (a) 1 pt: 18 bracelets and 6 beads left over (18 R 6 with a sentence saying what each number means).

        (b) 1 pt: 10 more beads, with 20 × 8 = 160 shown (or: 2 more bracelets need 16 beads, and the 6 left over cover 6 of them, so 10 more).
