week: 6
unit: 3
title: "Equal Groups of Fractions: Multiplying a Fraction by a Whole Number"
topics: ["4.NF.B.4"]
guide: guides/week-06.md
guide_description: |
  How a fraction like 5/8 is made of unit fractions (5 × 1/8), how to find equal groups of a fraction such as
  4 × 2/3 with pictures and jumps on a number line, and how to solve story problems where each person or each
  batch gets the same fraction.
flashcards_description: |
  19 cards on unit fractions, writing a fraction as a whole number times a unit fraction, multiplying a whole
  number by a fraction, jumps on a number line, and telling which two whole numbers a product is between.

flashcards:
  - front: Unit fraction → what it is
    back: |
      A fraction with 1 as its numerator, such as 1/3, 1/8 or 1/100. It is one of the equal parts of a whole.
    topic_code: "4.NF.B.4"
  - front: 5/8 → as a whole number times a unit fraction
    back: |
      5 × 1/8. Five-eighths is 5 copies of one-eighth.
    topic_code: "4.NF.B.4"
  - front: 7/3 → as a whole number times a unit fraction
    back: |
      7 × 1/3. Seven thirds is 7 copies of one third, which is more than 2 wholes.
    topic_code: "4.NF.B.4"
  - front: Multiple of 1/5 → what it means
    back: |
      A number you get by taking 1/5 again and again: 2/5, 3/5, 4/5, 5/5, 6/5 and so on. 4/5 = 4 × 1/5.
    topic_code: "4.NF.B.4"
  - front: 3 × 4/5 → product
    back: |
      12/5. Three groups of 4 fifths make 12 fifths.
    topic_code: "4.NF.B.4"
  - front: 7 × 2/3 → product
    back: |
      14/3. Seven groups of 2 thirds make 14 thirds.
    topic_code: "4.NF.B.4"
  - front: 5 × 3/10 → product
    back: |
      15/10. Five groups of 3 tenths make 15 tenths.
    topic_code: "4.NF.B.4"
  - front: 6 × 5/12 → product
    back: |
      30/12. Six groups of 5 twelfths make 30 twelfths.
    topic_code: "4.NF.B.4"
  - front: Whole number × fraction → the quick rule
    back: |
      Multiply the whole number by the numerator and keep the denominator. 3 × 4/6 = 12/6. The size of the parts does not change.
    topic_code: "4.NF.B.4"
  - front: Why the denominator stays the same in 5 × 2/3
    back: |
      The denominator names the size of the parts. You are making more thirds, not smaller parts, so the answer is still in thirds: 10/3.
    topic_code: "4.NF.B.4"
  - front: Common mistake → 2 × 3/8 = 6/16
    back: |
      Only the number of parts is multiplied. 2 groups of 3 eighths is 6 eighths, so 2 × 3/8 = 6/8, not 6/16.
    topic_code: "4.NF.B.4"
  - front: 3 jumps of 5/8 on a number line → where you land
    back: |
      At 15/8. Start at 0 and jump 5 eighths three times: 5/8, 10/8, 15/8.
    topic_code: "4.NF.B.4"
  - front: Equal jumps on a number line → which multiplication
    back: |
      Number of jumps × size of one jump. 4 jumps that are each 2/10 long show 4 × 2/10 = 8/10.
    topic_code: "4.NF.B.4"
  - front: 2 × 3/8 and 3 × 2/8 → are they equal?
    back: |
      Yes. Both make 6/8. Different equal groups can make the same amount.
    topic_code: "4.NF.B.4"
  - front: 10/3 → between which two whole numbers
    back: |
      Between 3 and 4. 9/3 = 3 and 12/3 = 4, and 10 thirds is between 9 thirds and 12 thirds.
    topic_code: "4.NF.B.4"
  - front: 13/6 → between which two whole numbers
    back: |
      Between 2 and 3. 12/6 = 2, so 13/6 is just 1/6 more than 2.
    topic_code: "4.NF.B.4"
  - front: Story with "each gets the same fraction" → which operation
    back: |
      Multiplication. 5 friends each drink 2/4 cup of milk: 5 × 2/4 = 10/4 cups in all.
    topic_code: "4.NF.B.4"
  - front: 6 × 1/6 → product
    back: |
      6/6, which is 1 whole. Six sixths fill the whole.
    topic_code: "4.NF.B.4"
  - front: Equal groups of a fraction → a picture that helps
    back: |
      Draw one shape for each group and shade the fraction in each one, or draw equal jumps on a number line. Then count all the shaded parts.
    topic_code: "4.NF.B.4"

quiz:
  description: |
    15 questions · about 30 minutes · writing fractions as groups of unit fractions, multiplying a whole number
    by a fraction with pictures and number lines, story problems, and review of comparing fractions, equivalent
    fractions, factor pairs and perimeter. Multiple choice, select-all, true/false and number answers are graded
    at once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w06-q01
      type: multiple_choice
      topic_code: "4.NF.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section A"
      points: 1
      stimulus: |
        Use the number line. Each whole is split into 5 equal parts, and the arrows show 3 equal jumps that start at 0.
      figure: figures/w06-jumps-of-two-fifths.svg
      figure_alt: "A number line from 0 to 2 with 0, 1 and 2 labeled. Each whole is split into 5 equal parts by tick marks. Three equal arrows jump from 0: each arrow covers 2 parts. The first lands on 2/5, the second on 4/5 and the third lands 1 part past 1, on 6/5."
      prompt: |
        Which equation matches the jumps?
      options:
        - "5 × 2/5 = 10/5"
        - "3 × 2/5 = 6/15"
        - "3 × 2/5 = 6/5"
        - "2 × 1/5 = 2/5"
      option_explanations:
        - |
          5 is the number of parts in each whole, not the number of jumps. There are 3 jumps, and they stop at 6/5, not at 2.
        - |
          The jumps are fifths, so the answer is still in fifths. 3 jumps of 2 fifths is 6 fifths, not 6 fifteenths.
        - |
          Correct. There are 3 jumps and each jump is 2/5 long. Together they reach 6/5, so 3 × 2/5 = 6/5.
        - |
          2 × 1/5 describes only the first jump (two fifths). The picture shows 3 jumps of that size.
      answer: 2

    - slug: g4math-w06-q02
      type: numeric
      topic_code: "4.NF.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section A"
      points: 1
      stimulus: |
        Use the number line. Each whole is split into 5 equal parts, and the arrows show 3 equal jumps that start at 0.
      prompt: |
        The last jump lands on a point. How many fifths is that point from 0? Type the number of fifths.
      answer: { value: 6, tolerance: 0 }
      explanation: |
        Each jump covers 2 fifths: 2, 4, 6. The last jump lands on 6/5, which is 6 fifths from 0 (one fifth past 1).

    - slug: g4math-w06-q03
      type: multiple_choice
      topic_code: "4.NF.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section A"
      points: 1
      prompt: |
        What is 4 × 2/3?
      options:
        - "8/12"
        - "6/3"
        - "4/3"
        - "8/3"
      option_explanations:
        - |
          8/12 multiplies the denominator too. Four groups of 2 thirds are still thirds, so the denominator stays 3.
        - |
          6/3 comes from adding 4 + 2. We need 4 groups of 2 thirds, and 4 × 2 = 8 thirds.
        - |
          4/3 is 4 × 1/3. Each group here is 2 thirds, not 1 third, so there are twice as many: 8/3.
        - |
          Correct. Four groups of 2 thirds make 8 thirds: 2/3 + 2/3 + 2/3 + 2/3 = 8/3.
      answer: 3

    - slug: g4math-w06-q04
      type: numeric
      topic_code: "4.NF.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section A"
      points: 1
      prompt: |
        Find the missing numerator: 6 × 3/10 = □/10. Type the number that goes in the box.
      answer: { value: 18, tolerance: 0 }
      explanation: |
        Six groups of 3 tenths make 6 × 3 = 18 tenths. The parts are still tenths, so 6 × 3/10 = 18/10.

    - slug: g4math-w06-q05
      type: multiple_choice
      topic_code: "4.NF.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section A"
      points: 1
      stimulus: |
        Use the picture of 5 circles. Each circle is one whole cut into 4 equal parts, and 3 parts of each circle are shaded.
      figure: figures/w06-circles-three-fourths.svg
      figure_alt: "Five circles in a row, all the same size. Each circle is cut into 4 equal parts by a straight line across and a straight line down. In every circle, 3 of the 4 parts are shaded blue and the top left part is white."
      prompt: |
        Which expression tells how much of the circles is shaded in all?
      options:
        - "5 × 3/4"
        - "5 × 1/4"
        - "3 × 1/4"
        - "5 + 3/4"
      option_explanations:
        - |
          Correct. There are 5 equal groups (circles), and 3/4 of each one is shaded, so the shaded amount is 5 × 3/4.
        - |
          5 × 1/4 would mean only one part of each circle is shaded. Each circle has 3 shaded parts.
        - |
          3 × 1/4 is the shaded part of just one circle. There are 5 circles like it.
        - |
          5 + 3/4 would mean 5 whole circles plus 3/4 more. No circle here is fully shaded.
      answer: 0

    - slug: g4math-w06-q06
      type: multiple_choice
      topic_code: "4.NF.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section A"
      points: 1
      stimulus: |
        Use the picture of 5 circles. Each circle is one whole cut into 4 equal parts, and 3 parts of each circle are shaded.
      prompt: |
        The shaded parts make 15/4 in all. Between which two whole numbers is 15/4?
      options:
        - "15 and 16"
        - "3 and 4"
        - "4 and 5"
        - "2 and 3"
      option_explanations:
        - |
          15 is the number of shaded fourths, not the number of wholes. 4 fourths make 1 whole, so 15 fourths is far less than 15.
        - |
          Correct. 12/4 = 3 and 16/4 = 4. Since 15 fourths is between 12 fourths and 16 fourths, 15/4 is between 3 and 4.
        - |
          4 wholes would need 16 fourths. There are only 15 shaded fourths, so the amount is less than 4.
        - |
          3 wholes is 12 fourths, and there are 15 shaded fourths, more than 12. So the amount is more than 3.
      answer: 1

    - slug: g4math-w06-q07
      type: true_false
      topic_code: "4.NF.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section A"
      points: 1
      prompt: |
        True or false: 3 × 2/7 = 6/21.
      answer: false
      explanation: |
        False. Three groups of 2 sevenths make 6 sevenths, so 3 × 2/7 = 6/7. The parts stay sevenths; only the number of parts is multiplied.

    - slug: g4math-w06-q08
      type: multi_select
      topic_code: "4.NF.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section A"
      points: 2
      partial_credit: true
      prompt: |
        Which expressions are equal to 6/8? Select all that apply.
      options:
        - "6 × 1/8"
        - "3 × 2/8"
        - "2 × 3/4"
        - "2 × 3/8"
        - "6 × 1/6"
      option_explanations:
        - |
          Equal. Six copies of one-eighth make 6/8.
        - |
          Equal. Three groups of 2 eighths make 6 eighths.
        - |
          Not equal. Two groups of 3 fourths make 6 fourths, and fourths are bigger parts than eighths.
        - |
          Equal. Two groups of 3 eighths make 6 eighths.
        - |
          Not equal. Six copies of one-sixth make 6/6, which is 1 whole, more than 6/8.
      answer: [0, 1, 3]

    - slug: g4math-w06-q09
      type: fill_blank
      topic_code: "4.NF.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section A"
      points: 1
      prompt: |
        7/5 = 7 × 1/5. So 7/5 is a ____ of 1/5, just as 21 is one of the numbers you get by counting by 7s.
      answer: ["multiple", "a multiple"]
      explanation: |
        A multiple of 1/5 is what you get by taking 1/5 a whole number of times: 1/5, 2/5, 3/5 and so on. Seven of them make 7/5.

    - slug: g4math-w06-q10
      type: multiple_choice
      topic_code: "4.NF.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section A"
      points: 1
      prompt: |
        One lap around the school field is 3/10 of a kilometer. Amira runs 7 laps. How far does she run?
      options:
        - "10/10 kilometer"
        - "21/70 kilometer"
        - "21/10 kilometers"
        - "7/10 kilometer"
      option_explanations:
        - |
          10/10 comes from adding 7 + 3. Amira runs 7 equal laps, so multiply: 7 × 3/10.
        - |
          The laps are measured in tenths, so the answer stays in tenths. 7 × 3 = 21 tenths, not 21 seventieths.
        - |
          Correct. 7 laps of 3 tenths each is 7 × 3/10 = 21/10 kilometers, a bit more than 2 kilometers.
        - |
          7/10 would be 7 laps of 1/10 kilometer. Each lap is 3/10, so she runs 3 times as far.
      answer: 2

    # ---- spiral review
    - slug: g4math-w06-q11
      type: multiple_choice
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section C"
      points: 1
      prompt: |
        Both fractions are parts of the same size whole. Which is greater, 3/8 or 3/5?
      options:
        - "3/5"
        - "3/8"
        - "They are equal."
        - "There is no way to compare them."
      option_explanations:
        - |
          Correct. Both have 3 parts. A whole cut into 5 parts has bigger parts than a whole cut into 8, so 3 fifths is more than 3 eighths.
        - |
          8 is greater than 5, but more parts in the whole means each part is smaller. So 3/8 is the smaller fraction.
        - |
          Both have 3 parts, but the parts are different sizes: fifths are bigger than eighths, so the amounts are not equal.
        - |
          We can compare them: when the numerators are the same, compare the size of the parts. Fifths are bigger than eighths.
      answer: 0

    - slug: g4math-w06-q12
      type: numeric
      topic_code: "4.NF.A.1"
      source: "IM K–5 Math Grade 4, Unit 2, Section B"
      points: 1
      prompt: |
        Find the missing numerator so the fractions are equivalent: 2/3 = □/12.
      answer: { value: 8, tolerance: 0 }
      explanation: |
        3 × 4 = 12, so each third is cut into 4 equal parts. Multiply the numerator by 4 too: 2 × 4 = 8. So 2/3 = 8/12.

    - slug: g4math-w06-q13
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      prompt: |
        Which list shows every factor pair of 18?
      options:
        - "2 and 9, 3 and 6"
        - "1 and 18, 2 and 9, 4 and 5"
        - "1 and 18, 3 and 6"
        - "1 and 18, 2 and 9, 3 and 6"
      option_explanations:
        - |
          This list leaves out 1 and 18. Every number has the factor pair 1 and itself, because 1 × 18 = 18.
        - |
          4 and 5 is not a factor pair of 18, because 4 × 5 = 20. Also 3 and 6 is missing from this list.
        - |
          This list leaves out 2 and 9. 18 is even, so 2 is a factor: 2 × 9 = 18.
        - |
          Correct. 1 × 18, 2 × 9 and 3 × 6 all make 18. Neither 4 nor 5 divides 18 evenly, and after 3 and 6 the pairs only repeat.
      answer: 3

    - slug: g4math-w06-q14
      type: multiple_choice
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      figure: figures/w06-garden-rectangle.svg
      figure_alt: "A rectangle labeled Garden. The top side is labeled 9 m and the right side is labeled 6 m."
      prompt: |
        The garden is a rectangle 9 meters long and 6 meters wide. What is its perimeter?
      options:
        - "54 m"
        - "30 m"
        - "15 m"
        - "24 m"
      option_explanations:
        - |
          54 is 9 × 6, the area in square meters. Perimeter is the distance around the edge, so add all four sides.
        - |
          Correct. The sides are 9, 6, 9 and 6 meters. 9 + 6 + 9 + 6 = 30, or 2 × 9 + 2 × 6 = 30 meters.
        - |
          15 adds only two sides, 9 + 6. A rectangle has four sides, so the distance around is twice as much.
        - |
          24 adds three sides, 9 + 9 + 6. Do not forget the fourth side, another 6 meters.
      answer: 1

    - slug: g4math-w06-q15
      type: short_answer
      topic_code: "4.NF.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section A"
      points: 2
      prompt: |
        A muffin recipe uses 3/4 cup of oats for one batch. Lin makes 3 batches.

        (a) Write a multiplication equation for the cups of oats Lin needs, and give the answer as a fraction.
        (b) Between which two whole numbers of cups is your answer? Explain how you know.
      answer: |
        (a) 3 × 3/4 = 9/4 cups of oats.
        (b) Between 2 and 3 cups. 8/4 = 2 and 12/4 = 3. 9 fourths is more than 8 fourths and less than 12 fourths, so 9/4 is a little more than 2 (it is 1/4 more than 2).
      explanation: |
        Two points.

        (a) 1 pt: 3 × 3/4 = 9/4 (or 3/4 + 3/4 + 3/4 = 9/4). The answer 9/4 alone with no equation earns the point only if work such as a drawing shows 3 groups of 3/4.

        (b) 1 pt: between 2 and 3, with a reason, such as 8/4 = 2 and 12/4 = 3, or a number line or drawing showing 9 fourths is 2 wholes and 1 fourth.
