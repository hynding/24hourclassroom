week: 8
unit: 3
title: "Mixed Numbers and Line Plots With Fractions"
topics: ["4.NF.B.3", "4.MD.B.4"]
guide: guides/week-08.md
guide_description: |
  How to write an amount more than 1 as a mixed number like 2 1/4 or as a fraction like 9/4, how to add and
  subtract mixed numbers with the same denominator (trading a whole for parts when you need to), and how to
  read a line plot of measurements in fourths and eighths of an inch.
flashcards_description: |
  20 cards on mixed numbers, changing between mixed numbers and fractions, adding and subtracting mixed numbers
  with like denominators, trading 1 whole for fourths or eighths, and answering questions from line plots.

flashcards:
  - front: Mixed number → what it is
    back: |
      A whole number and a fraction written together, such as 2 1/4. It means 2 + 1/4.
    topic_code: "4.NF.B.3"
  - front: 2 3/4 → as a fraction
    back: |
      11/4. Each whole is 4 fourths, so 2 wholes are 8 fourths, and 8/4 + 3/4 = 11/4.
    topic_code: "4.NF.B.3"
  - front: 3 2/5 → as a fraction
    back: |
      17/5. Three wholes are 15 fifths, and 15/5 + 2/5 = 17/5.
    topic_code: "4.NF.B.3"
  - front: 13/8 → as a mixed number
    back: |
      1 5/8. 8 of the 13 eighths make 1 whole, and 5 eighths are left.
    topic_code: "4.NF.B.3"
  - front: 13/5 → as a mixed number
    back: |
      2 3/5. 10 of the 13 fifths make 2 wholes, and 3 fifths are left.
    topic_code: "4.NF.B.3"
  - front: Fraction greater than 1 → how to spot it
    back: |
      The numerator is bigger than the denominator, as in 7/4. There are more parts than make 1 whole.
    topic_code: "4.NF.B.3"
  - front: Adding mixed numbers with like denominators → one way
    back: |
      Add the wholes, then add the fractions. 2 1/5 + 1 3/5 = 3 + 4/5 = 3 4/5.
    topic_code: "4.NF.B.3"
  - front: 2 3/4 + 1 2/4 → sum
    back: |
      4 1/4. The wholes make 3 and the fourths make 5/4 = 1 1/4, so 3 + 1 1/4 = 4 1/4.
    topic_code: "4.NF.B.3"
  - front: Fraction part of a sum is 6/4 → what to do
    back: |
      Make a whole from it. 6/4 = 4/4 + 2/4 = 1 2/4, so add 1 to the whole number and keep 2/4.
    topic_code: "4.NF.B.3"
  - front: Subtracting mixed numbers with like denominators → one way
    back: |
      Subtract the wholes and subtract the fractions. 5 7/8 − 2 3/8 = 3 4/8.
    topic_code: "4.NF.B.3"
  - front: 3 1/4 − 1 3/4 → why you trade a whole
    back: |
      1/4 is less than 3/4, so trade 1 whole for 4/4: 3 1/4 = 2 5/4. Then 2 5/4 − 1 3/4 = 1 2/4.
    topic_code: "4.NF.B.3"
  - front: 5 1/8 written with more eighths
    back: |
      4 9/8. Trade 1 of the 5 wholes for 8/8, and 8/8 + 1/8 = 9/8.
    topic_code: "4.NF.B.3"
  - front: Subtracting mixed numbers → another way
    back: |
      Change both to fractions first. 3 1/4 − 1 3/4 = 13/4 − 7/4 = 6/4, which is 1 2/4.
    topic_code: "4.NF.B.3"
  - front: Mixed number on a number line → how to find it
    back: |
      Go to the whole number, then count the fraction parts past it. For 2 3/8, go to 2, then 3 eighths more.
    topic_code: "4.NF.B.3"
  - front: Line plot → what it is
    back: |
      A number line with an X for each measurement. Stacked Xs show the same measurement more than once.
    topic_code: "4.MD.B.4"
  - front: Line plot → how many things were measured
    back: |
      Count every X. Each X is one thing that was measured.
    topic_code: "4.MD.B.4"
  - front: Line plot → difference between the longest and shortest
    back: |
      Find the X farthest right and the X farthest left, then subtract. 3 3/4 inches − 2 1/4 inches = 1 2/4 inches.
    topic_code: "4.MD.B.4"
  - front: Line plot in eighths → reading the scale
    back: |
      Each space between tick marks is 1/8 of an inch, so the marks go 1, 1 1/8, 1 2/8, 1 3/8 and so on up to 2.
    topic_code: "4.MD.B.4"
  - front: Line plot → total length of all the Xs at one mark
    back: |
      Add that length once for each X, or multiply. 3 Xs at 2 1/4 inches: 2 1/4 + 2 1/4 + 2 1/4 = 6 3/4 inches.
    topic_code: "4.MD.B.4"
  - front: Making a line plot → the steps
    back: |
      Draw a number line that covers the smallest and largest data, mark the fractions evenly, then put one X above the mark for each measurement.
    topic_code: "4.MD.B.4"

quiz:
  description: |
    15 questions · about 30 minutes · mixed numbers on a number line and as fractions, adding and subtracting
    mixed numbers with the same denominator, a line plot of plant heights in fourths of an inch, and review of
    multiplying and comparing fractions. Multiple choice, select-all, true/false and number answers are graded at
    once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w08-q01
      type: multiple_choice
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      stimulus: |
        Use the number line from 0 to 3. Each whole is split into 4 equal parts, and point P is marked with a dot.
      figure: figures/w08-number-line-mixed.svg
      figure_alt: "A number line from 0 to 3 with 0, 1, 2 and 3 labeled. Each whole is split into 4 equal parts by 3 small tick marks. A red dot labeled P sits on the first small tick mark after 2."
      prompt: |
        What mixed number names point P?
      options:
        - "2 1/3"
        - "2 1/4"
        - "1 1/4"
        - "2 3/4"
      option_explanations:
        - |
          There are 3 small tick marks between 2 and 3, but they make 4 equal spaces. Count spaces, not marks: the parts are fourths.
        - |
          Correct. P is past 2 by one space, and each space is 1/4. So P is 2 1/4.
        - |
          P is past 2, not past 1. Count the wholes from 0: 1, 2, then 1 fourth more.
        - |
          P is 1 fourth after 2. 2 3/4 would be 3 fourths after 2, just before 3.
      answer: 1

    - slug: g4math-w08-q02
      type: numeric
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      stimulus: |
        Use the number line from 0 to 3. Each whole is split into 4 equal parts, and point P is marked with a dot.
      prompt: |
        Name point P as a fraction in fourths. Type the missing numerator: □/4.
      answer: { value: 9, tolerance: 0 }
      explanation: |
        Count the fourths from 0. Each whole is 4 fourths, so 2 wholes are 8 fourths, and P is 1 more: 9/4.

    - slug: g4math-w08-q03
      type: multiple_choice
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      figure: figures/w08-circles-three-eighths.svg
      figure_alt: "Three circles the same size, each cut into 8 equal parts. The first two circles have all 8 parts shaded blue. The third circle has 3 of its 8 parts shaded blue and 5 parts white."
      prompt: |
        Each circle is one whole cut into 8 equal parts. The shaded amount is 2 3/8. Which fraction also names it?
      options:
        - "5/8"
        - "16/8"
        - "19/8"
        - "23/8"
      option_explanations:
        - |
          5/8 adds the 2 and the 3. The 2 means 2 whole circles, which are 16 eighths, not 2 eighths.
        - |
          16/8 counts only the 2 full circles. Add the 3 shaded eighths in the third circle.
        - |
          Correct. Two full circles are 8 + 8 = 16 eighths, and 3 more make 19 eighths: 19/8.
        - |
          23/8 writes the 2 and the 3 side by side. Count the shaded eighths instead: 8 + 8 + 3 = 19.
      answer: 2

    - slug: g4math-w08-q04
      type: multiple_choice
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      prompt: |
        What is 3 2/5 + 1 1/5?
      options:
        - "4 3/5"
        - "4 3/10"
        - "2 1/5"
        - "3 3/5"
      option_explanations:
        - |
          Correct. Add the wholes, 3 + 1 = 4, and add the fifths, 2/5 + 1/5 = 3/5. The sum is 4 3/5.
        - |
          The denominators were added. Fifths plus fifths are still fifths, so the fraction part is 3/5.
        - |
          2 1/5 is the difference, 3 2/5 − 1 1/5. The problem asks for the sum.
        - |
          This adds the fifths but forgets the 1 whole in 1 1/5. The wholes make 3 + 1 = 4.
      answer: 0

    - slug: g4math-w08-q05
      type: multiple_choice
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      prompt: |
        What is 4 1/6 − 1 5/6?
      options:
        - "3 4/6"
        - "6"
        - "3 2/6"
        - "2 2/6"
      option_explanations:
        - |
          This subtracts 1/6 from 5/6, the wrong way round. You cannot take 5 sixths from 1 sixth, so trade a whole first.
        - |
          6 is the sum, 4 1/6 + 1 5/6. The problem asks for the difference.
        - |
          This trades a whole for 6/6 to make 7/6 but forgets to take that whole away from the 4. It should start from 3 7/6.
        - |
          Correct. Trade 1 whole: 4 1/6 = 3 7/6. Then 3 7/6 − 1 5/6 = 2 2/6. (Check: 25/6 − 11/6 = 14/6 = 2 2/6.)
      answer: 3

    - slug: g4math-w08-q06
      type: numeric
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      prompt: |
        Write 14/6 as a mixed number: 14/6 = 2 □/6. What number goes in the box?
      answer: { value: 2, tolerance: 0 }
      explanation: |
        Two wholes are 12 sixths. 14 − 12 = 2 sixths are left over, so 14/6 = 2 2/6.

    - slug: g4math-w08-q07
      type: true_false
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      prompt: |
        True or false: 7/4 and 1 3/4 name the same number.
      answer: true
      explanation: |
        True. 4 of the 7 fourths make 1 whole, and 3 fourths are left, so 7/4 = 1 3/4.

    - slug: g4math-w08-q08
      type: fill_blank
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      prompt: |
        A number like 3 1/2, made of a whole number and a fraction, is called a ____ number.
      answer: ["mixed"]
      explanation: |
        It is a mixed number: it mixes a whole number (3) with a fraction (1/2). It means 3 + 1/2.

    - slug: g4math-w08-q09
      type: multi_select
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which name the same amount as 2 1/3? Select all that apply.
      options:
        - "7/3"
        - "1 4/3"
        - "1 + 1 + 1/3"
        - "5/3"
        - "21/3"
      option_explanations:
        - |
          Equal. Two wholes are 6 thirds, and 6/3 + 1/3 = 7/3.
        - |
          Equal. 4/3 is 1 whole and 1 third, so 1 4/3 is 1 + 1 + 1/3 = 2 1/3.
        - |
          Equal. Two wholes and one third is exactly what 2 1/3 means.
        - |
          Not equal. 5/3 is 1 2/3, because 3 of the thirds make 1 whole and 2 are left.
        - |
          Not equal. 21/3 writes the 2 and 1 side by side. 21 thirds is 7 wholes.
      answer: [0, 1, 2]

    - slug: g4math-w08-q10
      type: numeric
      topic_code: "4.MD.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      stimulus: |
        Use the line plot "Bean Plant Heights". Each X is one bean plant, and the heights are in inches.
      figure: figures/w08-line-plot-bean-plants.svg
      figure_alt: "A line plot titled Bean Plant Heights, labeled Height in inches. The marks are 3, 3 1/4, 3 1/2, 3 3/4, 4, 4 1/4 and 4 1/2. The number of Xs above each mark is: 3 has 1, 3 1/4 has 2, 3 1/2 has 4, 3 3/4 has 3, 4 has 1, 4 1/4 has 0 and 4 1/2 has 2."
      prompt: |
        How many bean plants were measured?
      answer: { value: 13, tolerance: 0 }
      explanation: |
        Count every X: 1 + 2 + 4 + 3 + 1 + 0 + 2 = 13 plants.

    - slug: g4math-w08-q11
      type: multiple_choice
      topic_code: "4.MD.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      stimulus: |
        Use the line plot "Bean Plant Heights". Each X is one bean plant, and the heights are in inches.
      prompt: |
        How much taller is the tallest plant than the shortest plant?
      options:
        - "1 1/4 inches"
        - "1 1/2 inches"
        - "4 1/2 inches"
        - "1 inch"
      option_explanations:
        - |
          The tallest plants are at 4 1/2, not 4 1/4 (there are no Xs at 4 1/4). 4 1/2 − 3 = 1 1/2.
        - |
          Correct. The tallest plants are 4 1/2 inches and the shortest is 3 inches. 4 1/2 − 3 = 1 1/2 inches.
        - |
          4 1/2 inches is the height of the tallest plants. The question asks how much taller they are than the shortest.
        - |
          1 inch would be the difference between 4 and 3. The tallest plants reach 4 1/2 inches.
      answer: 1

    - slug: g4math-w08-q12
      type: multiple_choice
      topic_code: "4.MD.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      stimulus: |
        Use the line plot "Bean Plant Heights". Each X is one bean plant, and the heights are in inches.
      prompt: |
        How many plants are taller than 3 3/4 inches?
      options:
        - "3"
        - "6"
        - "2"
        - "4"
      option_explanations:
        - |
          Correct. Taller than 3 3/4 means the marks to its right: 4 has 1, 4 1/4 has 0 and 4 1/2 has 2. That is 3 plants.
        - |
          6 also counts the 3 plants at exactly 3 3/4. Those are not taller than 3 3/4 inches.
        - |
          2 counts only the plants at 4 1/2. The plant at 4 inches is also taller than 3 3/4 inches.
        - |
          4 counts one plant too many. Look again: 1 X at 4, none at 4 1/4 and 2 at 4 1/2 make 3.
      answer: 0

    # ---- spiral review
    - slug: g4math-w08-q13
      type: multiple_choice
      topic_code: "4.NF.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section A"
      points: 1
      prompt: |
        Jamal makes 6 bracelets. Each bracelet uses 2/3 meter of string. How much string does he use?
      options:
        - "8/3 meters"
        - "12/18 meter"
        - "12/3 meters"
        - "2/18 meter"
      option_explanations:
        - |
          8/3 comes from adding 6 + 2. Six equal bracelets need 6 groups of 2/3, so multiply: 6 × 2 = 12 thirds.
        - |
          12/18 multiplies the denominator too. Six groups of 2 thirds are still thirds.
        - |
          Correct. 6 × 2/3 = 12/3 meters. That is 4 whole meters, because 12 thirds make 4 wholes.
        - |
          2/18 is a very small amount. Each bracelet alone uses 2/3 meter, so six use much more.
      answer: 2

    - slug: g4math-w08-q14
      type: multiple_choice
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section C"
      points: 1
      prompt: |
        Which comparison is true?
      options:
        - "1/10 is greater than 1/5"
        - "3/12 is greater than 3/4"
        - "4/8 is greater than 1/2"
        - "5/6 is greater than 5/8"
      option_explanations:
        - |
          Tenths are smaller parts than fifths, so 1/10 is less than 1/5.
        - |
          Both have 3 parts, but twelfths are much smaller than fourths, so 3/12 is less than 3/4.
        - |
          4/8 is exactly one half, so the two fractions are equal. Neither is greater.
        - |
          Correct. Both have 5 parts, and sixths are bigger parts than eighths, so 5/6 is greater than 5/8.
      answer: 3

    - slug: g4math-w08-q15
      type: short_answer
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 2
      prompt: |
        Ravi walks his dog 1 3/4 kilometers in the morning and 2 3/4 kilometers in the evening.

        (a) How far does Ravi walk the dog in all? Show your work.
        (b) How much farther does he walk in the evening than in the morning?
      answer: |
        (a) 1 3/4 + 2 3/4: the wholes make 3 and the fourths make 6/4 = 1 2/4. 3 + 1 2/4 = 4 2/4 kilometers.
        (b) 2 3/4 − 1 3/4 = 1 kilometer farther.
      explanation: |
        Two points.

        (a) 1 pt: 4 2/4 kilometers (also accept 18/4 or 4 1/2) with work, such as adding wholes and fourths, or 7/4 + 11/4 = 18/4.

        (b) 1 pt: 1 kilometer.
