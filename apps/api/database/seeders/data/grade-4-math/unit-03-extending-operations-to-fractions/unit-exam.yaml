unit: 3
description: |
  22 questions · about 45 minutes · every standard of Unit 3: multiplying a fraction by a whole number, adding
  and subtracting fractions and mixed numbers with the same denominator, decomposing fractions, reading a line
  plot of measurements in eighths of an inch, and adding tenths and hundredths. Three sets of questions share a
  picture. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word is
  matched automatically; the short answer is checked by your teacher against the scoring notes.
questions:
  # ---- Multiplying a fraction by a whole number (4.NF.B.4)
  - slug: g4math-u03-check-q01
    type: multiple_choice
    topic_code: "4.NF.B.4"
    source: "IM K–5 Math Grade 4, Unit 3, Section A"
    points: 1
    stimulus: |
      Use the number line. Each whole is split into 8 equal parts, and the arrows show 4 equal jumps that start at 0.
    figure: figures/u03-jumps-of-three-eighths.svg
    figure_alt: "A number line from 0 to 2 with 0, 1 and 2 labeled. Each whole is split into 8 equal parts by tick marks. Four equal arrows jump from 0, and each arrow covers 3 parts. They land on 3/8, 6/8, 9/8 and 12/8. The last arrow lands 4 parts past 1."
    prompt: |
      Which equation do the jumps show?
    options:
      - "4 × 3/8 = 12/32"
      - "4 × 3/8 = 12/8"
      - "3 × 1/8 = 3/8"
      - "8 × 3/8 = 24/8"
    option_explanations:
      - |
        The jumps are in eighths, so the answer stays in eighths. 4 jumps of 3 eighths is 12 eighths, not 12 thirty-seconds.
      - |
        Correct. There are 4 jumps, each 3/8 long, landing at 12/8. So 4 × 3/8 = 12/8.
      - |
        3 × 1/8 describes just the first jump. The picture shows 4 jumps of that size.
      - |
        8 is the number of parts in each whole, not the number of jumps. There are 4 jumps.
    answer: 1

  - slug: g4math-u03-check-q02
    type: multiple_choice
    topic_code: "4.NF.B.4"
    source: "IM K–5 Math Grade 4, Unit 3, Section A"
    points: 1
    stimulus: |
      Use the number line. Each whole is split into 8 equal parts, and the arrows show 4 equal jumps that start at 0.
    prompt: |
      Between which two whole numbers does the last jump land?
    options:
      - "0 and 1"
      - "1 and 2"
      - "12 and 13"
      - "2 and 3"
    option_explanations:
      - |
        Only the first two jumps land between 0 and 1. The third jump passes 1, and the last one goes even farther.
      - |
        Correct. The last jump lands on 12/8. Since 8/8 = 1 and 16/8 = 2, 12/8 is between 1 and 2 (it is 1 4/8).
      - |
        12 is the number of eighths, not the number of wholes. 12 eighths is only 1 whole and 4 eighths.
      - |
        2 wholes would be 16/8. The jumps stop at 12/8, before 2.
    answer: 1

  - slug: g4math-u03-check-q03
    type: numeric
    topic_code: "4.NF.B.4"
    source: "IM K–5 Math Grade 4, Unit 3, Section A"
    points: 1
    prompt: |
      Multiply: 5 × 4/12 = □/12. Type the number that goes in the box.
    answer: { value: 20, tolerance: 0 }
    explanation: |
      Five groups of 4 twelfths make 5 × 4 = 20 twelfths. The parts stay twelfths, so 5 × 4/12 = 20/12.

  - slug: g4math-u03-check-q04
    type: multiple_choice
    topic_code: "4.NF.B.4"
    source: "IM K–5 Math Grade 4, Unit 3, Section A"
    points: 1
    prompt: |
      Which expression is equal to 9/5?
    options:
      - "5 × 1/9"
      - "9 × 5"
      - "9 × 1/5"
      - "1/5 + 9"
    option_explanations:
      - |
        5 × 1/9 is 5 ninths. The numbers are flipped: 9/5 is 9 fifths.
      - |
        9 × 5 is 45, a whole number. 9/5 is 9 copies of one fifth, a little less than 2.
      - |
        Correct. 9/5 is 9 copies of the unit fraction 1/5, so 9/5 = 9 × 1/5.
      - |
        1/5 + 9 is 9 wholes and one fifth more. 9/5 is only 1 whole and 4 fifths.
    answer: 2

  - slug: g4math-u03-check-q05
    type: multiple_choice
    topic_code: "4.NF.B.4"
    source: "IM K–5 Math Grade 4, Unit 3, Section A"
    points: 1
    prompt: |
      In a relay race, each of 4 runners runs 5/6 kilometer. How far do they run in all?
    options:
      - "9/6 kilometers"
      - "20/24 kilometer"
      - "5/24 kilometer"
      - "20/6 kilometers"
    option_explanations:
      - |
        9/6 comes from adding 4 + 5. Four runners each run 5/6, so multiply: 4 × 5 = 20 sixths.
      - |
        20/24 multiplies the denominator too. Four groups of 5 sixths are still sixths.
      - |
        5/24 is less than one runner's part. Four runners together run 4 times as far as one runner.
      - |
        Correct. 4 × 5/6 = 20/6 kilometers, which is between 3 and 4 kilometers.
    answer: 3

  # ---- Adding and subtracting fractions and mixed numbers (4.NF.B.3)
  - slug: g4math-u03-check-q06
    type: multiple_choice
    topic_code: "4.NF.B.3"
    source: "IM K–5 Math Grade 4, Unit 3, Section B"
    points: 1
    prompt: |
      What is 7/12 + 4/12?
    options:
      - "11/12"
      - "11/24"
      - "3/12"
      - "28/12"
    option_explanations:
      - |
        Correct. 7 twelfths and 4 twelfths make 11 twelfths: 11/12.
      - |
        11/24 adds the denominators. The parts are twelfths and stay twelfths.
      - |
        3/12 is the difference, 7/12 − 4/12. The problem asks for the sum.
      - |
        28/12 multiplies 7 × 4. To add fractions with like denominators, add the numerators.
    answer: 0

  - slug: g4math-u03-check-q07
    type: numeric
    topic_code: "4.NF.B.3"
    source: "IM K–5 Math Grade 4, Unit 3, Section B"
    points: 1
    prompt: |
      Subtract from 1 whole: 1 − 3/10 = □/10. Type the number that goes in the box.
    answer: { value: 7, tolerance: 0 }
    explanation: |
      1 whole is 10/10. Take away 3 tenths: 10/10 − 3/10 = 7/10.

  - slug: g4math-u03-check-q08
    type: multi_select
    topic_code: "4.NF.B.3"
    source: "IM K–5 Math Grade 4, Unit 3, Section B"
    points: 2
    partial_credit: true
    prompt: |
      Which sums are ways to decompose 6/8? Select all that apply.
    options:
      - "2/8 + 4/8"
      - "1/8 + 1/8 + 4/8"
      - "3/4 + 3/4"
      - "3/8 + 2/8"
      - "5/8 + 1/8"
    option_explanations:
      - |
        Yes. 2 eighths and 4 eighths make 6 eighths.
      - |
        Yes. 1 + 1 + 4 = 6, so the sum is 6 eighths.
      - |
        No. These are fourths: 3/4 + 3/4 = 6/4, which is more than 1 whole.
      - |
        No. The numerators add to 3 + 2 = 5, so this sum is only 5/8.
      - |
        Yes. 5 eighths and 1 eighth make 6 eighths.
    answer: [0, 1, 4]

  - slug: g4math-u03-check-q09
    type: fill_blank
    topic_code: "4.NF.B.3"
    source: "IM K–5 Math Grade 4, Unit 3, Section B"
    points: 1
    prompt: |
      3/7 and 5/7 have the same denominator. We say they have ____ denominators, so we can add them by adding the numerators.
    answer: ["like", "common", "the same", "same"]
    explanation: |
      They have like (or common) denominators: the parts are the same size, sevenths, so 3/7 + 5/7 = 8/7.

  - slug: g4math-u03-check-q10
    type: multiple_choice
    topic_code: "4.NF.B.3"
    source: "IM K–5 Math Grade 4, Unit 3, Section B"
    points: 1
    prompt: |
      What is 5 1/4 − 2 3/4?
    options:
      - "3 2/4"
      - "8"
      - "1 2/4"
      - "2 2/4"
    option_explanations:
      - |
        This takes 1/4 from 3/4, the wrong way round. You cannot take 3 fourths from 1 fourth, so trade 1 whole first: 5 1/4 = 4 5/4.
      - |
        8 is the sum, 5 1/4 + 2 3/4. The problem asks for the difference.
      - |
        This takes away one whole too many. After trading, 4 5/4 − 2 3/4 = 2 2/4.
      - |
        Correct. Trade 1 whole for 4/4: 5 1/4 = 4 5/4. Then 4 5/4 − 2 3/4 = 2 2/4. (Check: 21/4 − 11/4 = 10/4 = 2 2/4.)
    answer: 3

  - slug: g4math-u03-check-q11
    type: multiple_choice
    topic_code: "4.NF.B.3"
    source: "IM K–5 Math Grade 4, Unit 3, Section B"
    points: 1
    prompt: |
      Which fraction is equal to 3 5/6?
    options:
      - "23/6"
      - "8/6"
      - "35/6"
      - "18/6"
    option_explanations:
      - |
        Correct. 3 wholes are 18 sixths, and 18/6 + 5/6 = 23/6.
      - |
        8/6 adds 3 + 5. The 3 means 3 wholes, which are 18 sixths, not 3 sixths.
      - |
        35/6 writes the 3 and the 5 side by side. 35 sixths is almost 6 wholes.
      - |
        18/6 is only the 3 wholes. Add the 5 sixths too.
    answer: 0

  - slug: g4math-u03-check-q12
    type: true_false
    topic_code: "4.NF.B.3"
    source: "IM K–5 Math Grade 4, Unit 3, Section B"
    points: 1
    prompt: |
      True or false: 2 4/5 + 1 3/5 = 3 7/5, and 3 7/5 is the same number as 4 2/5.
    answer: true
    explanation: |
      True. The wholes make 2 + 1 = 3 and the fifths make 4/5 + 3/5 = 7/5. Since 7/5 = 1 2/5, the sum 3 7/5 is 4 2/5.

  - slug: g4math-u03-check-q13
    type: short_answer
    topic_code: "4.NF.B.3"
    source: "IM K–5 Math Grade 4, Unit 3, Section B"
    points: 3
    prompt: |
      Pablo's family hikes 2 5/8 miles before lunch and 1 6/8 miles after lunch. The whole trail is 6 miles long.

      (a) How far have they hiked in all?
      (b) How much farther do they need to hike to finish the trail?
      (c) Explain how you found your answer to (b).
    answer: |
      (a) The wholes make 2 + 1 = 3 and the eighths make 5/8 + 6/8 = 11/8 = 1 3/8. So 3 + 1 3/8 = 4 3/8 miles.
      (b) 1 5/8 miles.
      (c) 6 − 4 3/8: trade 1 of the 6 wholes for 8/8, so 6 = 5 8/8. Then 5 8/8 − 4 3/8 = 1 5/8. (Or count up: 4 3/8 + 5/8 = 5, and 1 more mile makes 6, so 1 5/8.)
    explanation: |
      Three points.

      (a) 1 pt: 4 3/8 miles (also accept 35/8).

      (b) 1 pt: 1 5/8 miles (also accept 13/8), or an answer that correctly follows from a wrong total in (a).

      (c) 1 pt: a clear method for (b), such as trading a whole for 8/8, counting up on a number line, or changing to eighths (48/8 − 35/8 = 13/8).

  # ---- Line plots with fractions (4.MD.B.4)
  - slug: g4math-u03-check-q14
    type: numeric
    topic_code: "4.MD.B.4"
    source: "IM K–5 Math Grade 4, Unit 3, Section B"
    points: 1
    stimulus: |
      Use the line plot "Leaf Lengths". Each X is one leaf, and the lengths are in inches.
    figure: figures/u03-line-plot-leaf-lengths.svg
    figure_alt: "A line plot titled Leaf Lengths, labeled Length in inches. The marks go up by eighths: 1, 1 1/8, 1 2/8, 1 3/8, 1 4/8, 1 5/8, 1 6/8, 1 7/8 and 2. The number of Xs above each mark is: 1 has 0, 1 1/8 has 1, 1 2/8 has 3, 1 3/8 has 2, 1 4/8 has 0, 1 5/8 has 4, 1 6/8 has 1, 1 7/8 has 0 and 2 has 1. There are 12 Xs in all."
    prompt: |
      How many leaves are shorter than 1 4/8 inches?
    answer: { value: 6, tolerance: 0 }
    explanation: |
      Count the Xs to the left of 1 4/8: 1 at 1 1/8, 3 at 1 2/8 and 2 at 1 3/8. 1 + 3 + 2 = 6 leaves.

  - slug: g4math-u03-check-q15
    type: multiple_choice
    topic_code: "4.MD.B.4"
    source: "IM K–5 Math Grade 4, Unit 3, Section B"
    points: 1
    stimulus: |
      Use the line plot "Leaf Lengths". Each X is one leaf, and the lengths are in inches.
    prompt: |
      What is the difference in length between the longest leaf and the shortest leaf?
    options:
      - "1 1/8 inches"
      - "6/8 inch"
      - "7/8 inch"
      - "1 inch"
    option_explanations:
      - |
        1 1/8 inches is the length of the shortest leaf. The question asks for the difference: 2 − 1 1/8.
      - |
        6/8 starts from 1 2/8, the mark with a tall stack. The shortest leaf is at 1 1/8, so the difference is 7/8.
      - |
        Correct. The longest leaf is 2 inches and the shortest is 1 1/8 inches. 2 − 1 1/8 = 7/8 inch.
      - |
        1 inch would be the difference between 2 and 1, but no leaf is exactly 1 inch long. The shortest is 1 1/8 inches.
    answer: 2

  - slug: g4math-u03-check-q16
    type: multiple_choice
    topic_code: "4.MD.B.4"
    source: "IM K–5 Math Grade 4, Unit 3, Section B"
    points: 1
    stimulus: |
      Use the line plot "Leaf Lengths". Each X is one leaf, and the lengths are in inches.
    prompt: |
      Nia lays all the leaves that are 1 5/8 inches long end to end. How long is the row of leaves?
    options:
      - "4 20/32 inches"
      - "5 5/8 inches"
      - "6 4/8 inches"
      - "4 5/8 inches"
    option_explanations:
      - |
        The parts are eighths and stay eighths. 4 groups of 5/8 make 20/8, not 20/32.
      - |
        5 5/8 adds 4 + 1 5/8. There are 4 leaves, each 1 5/8 inches, so add 1 5/8 four times.
      - |
        Correct. There are 4 leaves at 1 5/8. The wholes make 4 and the eighths make 20/8 = 2 4/8, so 4 + 2 4/8 = 6 4/8 inches.
      - |
        This adds the 4 wholes but only one 5/8. Each of the 4 leaves has 5/8 more, which is 20/8.
    answer: 2

  # ---- Tenths and hundredths (4.NF.C.5)
  - slug: g4math-u03-check-q17
    type: multiple_choice
    topic_code: "4.NF.C.5"
    source: "IM K–5 Math Grade 4, Unit 3, Section C"
    points: 1
    stimulus: |
      Use the grid. It is one whole split into 100 equal small squares. Some squares are shaded blue and some are shaded green.
    figure: figures/u03-grid-65.svg
    figure_alt: "A square grid of 10 rows and 10 columns, 100 small squares in all. The first 6 columns on the left are shaded blue, all 10 squares in each. In the seventh column, the top 5 squares are shaded green. The rest of the squares are white."
    prompt: |
      What fraction of the grid is shaded?
    options:
      - "65/10"
      - "65/100"
      - "6/10"
      - "11/100"
    option_explanations:
      - |
        The grid has 100 small squares, so the parts are hundredths. 65/10 would be more than 6 whole grids.
      - |
        Correct. 6 blue columns are 60 squares, and 5 green squares make 65 of the 100 squares: 65/100.
      - |
        6/10 is only the blue columns. The 5 green squares are shaded too.
      - |
        11/100 adds 6 + 5 as if every column were 1 square. Each blue column is 10 squares.
    answer: 1

  - slug: g4math-u03-check-q18
    type: numeric
    topic_code: "4.NF.C.5"
    source: "IM K–5 Math Grade 4, Unit 3, Section C"
    points: 1
    stimulus: |
      Use the grid. It is one whole split into 100 equal small squares. Some squares are shaded blue and some are shaded green.
    prompt: |
      How many more hundredths must be shaded to fill the whole grid?
    answer: { value: 35, tolerance: 0 }
    explanation: |
      The whole grid is 100/100 and 65/100 is shaded. 100 − 65 = 35, so 35 more hundredths (35 small squares) are needed.

  - slug: g4math-u03-check-q19
    type: multiple_choice
    topic_code: "4.NF.C.5"
    source: "IM K–5 Math Grade 4, Unit 3, Section C"
    points: 1
    prompt: |
      What is 8/10 + 14/100?
    options:
      - "22/110"
      - "22/100"
      - "148/100"
      - "94/100"
    option_explanations:
      - |
        22/110 adds the tops and the bottoms. Write 8/10 as 80/100 first, then add the hundredths.
      - |
        22/100 treats the 8 tenths as 8 hundredths. 8 tenths are 80 hundredths.
      - |
        148/100 would be 14/10 + 8/100. Here the 8 is tenths and the 14 is hundredths.
      - |
        Correct. 8/10 = 80/100, and 80/100 + 14/100 = 94/100.
    answer: 3

  - slug: g4math-u03-check-q20
    type: multiple_choice
    topic_code: "4.NF.C.5"
    source: "IM K–5 Math Grade 4, Unit 3, Section C"
    points: 1
    prompt: |
      Which fraction is equal to 3/10?
    options:
      - "30/100"
      - "3/100"
      - "300/10"
      - "13/100"
    option_explanations:
      - |
        Correct. Each tenth is 10 hundredths, so 3 tenths are 30 hundredths: 3/10 = 30/100.
      - |
        3/100 is only 3 small squares on a grid. 3 tenths are 3 whole columns, 30 small squares.
      - |
        300/10 is 300 tenths, which is 30 wholes. Multiply the top and the bottom by the same number: 30/100.
      - |
        13/100 adds 10 to the numerator. To make hundredths from tenths, multiply the top and bottom by 10.
    answer: 0

  - slug: g4math-u03-check-q21
    type: numeric
    topic_code: "4.NF.C.5"
    source: "IM K–5 Math Grade 4, Unit 3, Section C"
    points: 1
    prompt: |
      Find the missing number: □/10 + 7/100 = 57/100.
    answer: { value: 5, tolerance: 0 }
    explanation: |
      57/100 − 7/100 = 50/100, and 50 hundredths are 5 tenths. So 5/10 + 7/100 = 57/100.

  - slug: g4math-u03-check-q22
    type: multi_select
    topic_code: "4.NF.C.5"
    source: "IM K–5 Math Grade 4, Unit 3, Section C"
    points: 2
    partial_credit: true
    prompt: |
      Which of these are equal to 80/100? Select all that apply.
    options:
      - "5/10 + 30/100"
      - "40/100 + 4/10"
      - "8/100"
      - "70/100 + 1/10"
      - "6/10 + 2/100"
    option_explanations:
      - |
        Equal. 5/10 = 50/100, and 50/100 + 30/100 = 80/100.
      - |
        Equal. 4/10 = 40/100, and 40/100 + 40/100 = 80/100.
      - |
        Not equal. 8/100 is only 8 small squares. 80/100 is 8 tenths.
      - |
        Equal. 1/10 = 10/100, and 70/100 + 10/100 = 80/100.
      - |
        Not equal. 6/10 = 60/100, and 60/100 + 2/100 = 62/100.
    answer: [0, 1, 3]
