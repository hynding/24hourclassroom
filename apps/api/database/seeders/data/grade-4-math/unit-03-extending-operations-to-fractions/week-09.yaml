week: 9
unit: 3
title: "Tenths and Hundredths: Equivalent Fractions and Sums"
topics: ["4.NF.C.5"]
guide: guides/week-09.md
guide_description: |
  How tenths and hundredths are related (1/10 = 10/100), how to show them on a grid of 100 squares, how to
  rewrite a number of tenths as hundredths, and how to add tenths and hundredths by first writing both in
  hundredths, as in 3/10 + 7/100 = 37/100.
flashcards_description: |
  18 cards on tenths, hundredths, rewriting tenths as hundredths, hundredths grids, dimes and pennies as parts
  of a dollar, and adding tenths and hundredths.

flashcards:
  - front: Tenth → what it is
    back: |
      One of 10 equal parts of a whole, written 1/10. On a 100-square grid, one tenth is a whole column of 10 squares.
    topic_code: "4.NF.C.5"
  - front: Hundredth → what it is
    back: |
      One of 100 equal parts of a whole, written 1/100. On a 100-square grid, one hundredth is one small square.
    topic_code: "4.NF.C.5"
  - front: 1/10 → in hundredths
    back: |
      10/100. Cut each tenth into 10 equal parts and one tenth becomes 10 hundredths.
    topic_code: "4.NF.C.5"
  - front: 3/10 → in hundredths
    back: |
      30/100. Multiply the numerator and the denominator by 10.
    topic_code: "4.NF.C.5"
  - front: 9/10 → in hundredths
    back: |
      90/100. Nine columns of 10 squares are 90 small squares.
    topic_code: "4.NF.C.5"
  - front: 60/100 → in tenths
    back: |
      6/10. Every 10 hundredths make 1 tenth, and 60 hundredths make 6 tenths.
    topic_code: "4.NF.C.5"
  - front: 1 whole → in tenths and in hundredths
    back: |
      10/10 and 100/100. The whole grid is 10 columns or 100 small squares.
    topic_code: "4.NF.C.5"
  - front: Adding tenths and hundredths → the first step
    back: |
      Write the tenths as hundredths, so both fractions have the same denominator. Then add the numerators.
    topic_code: "4.NF.C.5"
  - front: 4/10 + 3/100 → sum
    back: |
      43/100. 4/10 = 40/100, and 40/100 + 3/100 = 43/100.
    topic_code: "4.NF.C.5"
  - front: 2/10 + 35/100 → sum
    back: |
      55/100. 2/10 = 20/100, and 20/100 + 35/100 = 55/100.
    topic_code: "4.NF.C.5"
  - front: 4/100 + 5/10 → sum
    back: |
      54/100. 5/10 = 50/100, and 4/100 + 50/100 = 54/100.
    topic_code: "4.NF.C.5"
  - front: Common mistake → 7/10 + 1/100 = 8/110
    back: |
      You cannot add the tops and the bottoms. Write 7/10 as 70/100 first: 70/100 + 1/100 = 71/100.
    topic_code: "4.NF.C.5"
  - front: 52/100 on a grid → how to shade it
    back: |
      Shade 5 full columns (5 tenths, or 50 hundredths) and 2 more small squares.
    topic_code: "4.NF.C.5"
  - front: Dime → what fraction of a dollar
    back: |
      1/10 of a dollar, because 10 dimes make 1 dollar. A dime is also 10/100 of a dollar, since it is worth 10 cents.
    topic_code: "4.NF.C.5"
  - front: Penny → what fraction of a dollar
    back: |
      1/100 of a dollar, because 100 pennies make 1 dollar.
    topic_code: "4.NF.C.5"
  - front: 7 dimes and 3 pennies → fraction of a dollar
    back: |
      73/100. 7 dimes are 7/10 = 70/100, and 3 pennies are 3/100. 70/100 + 3/100 = 73/100.
    topic_code: "4.NF.C.5"
  - front: Why 1/10 is greater than 1/100
    back: |
      A whole cut into 10 parts has much bigger parts than a whole cut into 100. One tenth is as much as ten hundredths.
    topic_code: "4.NF.C.5"
  - front: 20/100 → in tenths
    back: |
      2/10. Two columns of the grid are 20 small squares.
    topic_code: "4.NF.C.5"

quiz:
  description: |
    15 questions · about 30 minutes · tenths and hundredths on 100-square grids, writing tenths as hundredths,
    adding tenths and hundredths, dimes and pennies as fractions of a dollar, and review of multiplying fractions,
    mixed numbers, equivalent fractions and multiples. Multiple choice, select-all, true/false and number answers
    are graded at once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w09-q01
      type: multiple_choice
      topic_code: "4.NF.C.5"
      source: "IM K–5 Math Grade 4, Unit 3, Section C"
      points: 1
      stimulus: |
        Use the grid. It is one whole split into 100 equal small squares. Some squares are shaded blue and some are shaded green.
      figure: figures/w09-grid-37.svg
      figure_alt: "A square grid of 10 rows and 10 columns, 100 small squares in all. The first 3 columns on the left are shaded blue, all 10 squares in each. In the fourth column, the top 7 squares are shaded green. The rest of the squares are white."
      prompt: |
        What fraction of the grid is shaded blue or green?
      options:
        - "37/10"
        - "3/10"
        - "7/100"
        - "37/100"
      option_explanations:
        - |
          The grid has 100 small squares, so the parts are hundredths. 37/10 would be more than 3 whole grids.
        - |
          3/10 is only the 3 blue columns. The 7 green squares are shaded too.
        - |
          7/100 is only the green squares. The 3 blue columns add 30 more hundredths.
        - |
          Correct. 3 blue columns are 30 squares and 7 green squares make 37 squares out of 100: 37/100.
      answer: 3

    - slug: g4math-w09-q02
      type: multiple_choice
      topic_code: "4.NF.C.5"
      source: "IM K–5 Math Grade 4, Unit 3, Section C"
      points: 1
      stimulus: |
        Use the grid. It is one whole split into 100 equal small squares. Some squares are shaded blue and some are shaded green.
      prompt: |
        Which sum also names the shaded part?
      options:
        - "3/100 + 7/10"
        - "3/10 + 7/100"
        - "3/10 + 7/10"
        - "30/10 + 7/100"
      option_explanations:
        - |
          This mixes up the two colors. The 3 blue columns are tenths and the 7 green squares are hundredths. 3/100 + 7/10 = 73/100.
        - |
          Correct. 3 full columns are 3/10, and the 7 green squares are 7/100. 3/10 + 7/100 = 30/100 + 7/100 = 37/100.
        - |
          The 7 green squares are small squares, so they are hundredths, not tenths. 3/10 + 7/10 would be the whole grid.
        - |
          30/10 is 3 whole grids. The blue part is 30 hundredths, which is 3 tenths, not 30 tenths.
      answer: 1

    - slug: g4math-w09-q03
      type: numeric
      topic_code: "4.NF.C.5"
      source: "IM K–5 Math Grade 4, Unit 3, Section C"
      points: 1
      figure: figures/w09-grid-four-tenths.svg
      figure_alt: "A square grid that is one whole. Dark lines split it into 10 equal columns, and light lines split each column into 10 small squares, 100 small squares in all. The first 4 columns on the left are shaded blue, and the other 6 columns are white."
      prompt: |
        The grid shows 4/10 shaded. How many hundredths are shaded? Type the missing numerator: 4/10 = □/100.
      answer: { value: 40, tolerance: 0 }
      explanation: |
        Each column (one tenth) has 10 small squares (10 hundredths). 4 columns have 4 × 10 = 40 squares, so 4/10 = 40/100.

    - slug: g4math-w09-q04
      type: numeric
      topic_code: "4.NF.C.5"
      source: "IM K–5 Math Grade 4, Unit 3, Section C"
      points: 1
      prompt: |
        Add: 6/10 + 25/100 = □/100. Type the number that goes in the box.
      answer: { value: 85, tolerance: 0 }
      explanation: |
        Write the tenths as hundredths first: 6/10 = 60/100. Then 60/100 + 25/100 = 85/100.

    - slug: g4math-w09-q05
      type: multiple_choice
      topic_code: "4.NF.C.5"
      source: "IM K–5 Math Grade 4, Unit 3, Section C"
      points: 1
      prompt: |
        What is 2/10 + 9/100?
      options:
        - "11/110"
        - "29/100"
        - "11/100"
        - "92/100"
      option_explanations:
        - |
          11/110 adds the numerators and the denominators. First make both hundredths: 2/10 = 20/100.
        - |
          Correct. 2/10 = 20/100, and 20/100 + 9/100 = 29/100.
        - |
          11/100 treats the 2 tenths as 2 hundredths. 2 tenths are 20 hundredths, so the sum is 29/100.
        - |
          92/100 would be 9/10 + 2/100. Here the 2 is tenths and the 9 is hundredths.
      answer: 1

    - slug: g4math-w09-q06
      type: true_false
      topic_code: "4.NF.C.5"
      source: "IM K–5 Math Grade 4, Unit 3, Section C"
      points: 1
      prompt: |
        True or false: 5/10 + 5/100 = 10/100.
      answer: false
      explanation: |
        False. 5/10 is 50/100, so 5/10 + 5/100 = 50/100 + 5/100 = 55/100. The 5 tenths are worth much more than 5 hundredths.

    - slug: g4math-w09-q07
      type: fill_blank
      topic_code: "4.NF.C.5"
      source: "IM K–5 Math Grade 4, Unit 3, Section C"
      points: 1
      prompt: |
        When a whole is cut into 100 equal parts, each part is called one ____.
      answer: ["hundredth", "hundredths", "a hundredth", "1 hundredth"]
      explanation: |
        Each part is one hundredth, written 1/100. One small square on a 100-square grid is one hundredth of the grid.

    - slug: g4math-w09-q08
      type: multi_select
      topic_code: "4.NF.C.5"
      source: "IM K–5 Math Grade 4, Unit 3, Section C"
      points: 2
      partial_credit: true
      prompt: |
        Which are equal to 50/100? Select all that apply.
      options:
        - "5/10"
        - "1/2"
        - "50/10"
        - "30/100 + 2/10"
        - "5/100"
      option_explanations:
        - |
          Equal. 5 tenths are 5 columns of 10 squares, which is 50 hundredths.
        - |
          Equal. 50 of the 100 squares is half of the grid.
        - |
          Not equal. 50/10 is 50 tenths, which is 5 whole grids.
        - |
          Equal. 2/10 = 20/100, and 30/100 + 20/100 = 50/100.
        - |
          Not equal. 5/100 is only 5 small squares, a tenth of 50/100.
      answer: [0, 1, 3]

    - slug: g4math-w09-q09
      type: multiple_choice
      topic_code: "4.NF.C.5"
      source: "IM K–5 Math Grade 4, Unit 3, Section C"
      points: 1
      prompt: |
        In the class garden, 3/10 of the ground is planted with carrots and 45/100 is planted with lettuce. What fraction of the garden is carrots or lettuce?
      options:
        - "48/110"
        - "48/100"
        - "75/100"
        - "15/100"
      option_explanations:
        - |
          48/110 adds the tops and the bottoms. Write 3/10 as 30/100 first, then add the hundredths.
        - |
          48/100 treats 3 tenths as 3 hundredths. 3/10 is 30/100.
        - |
          Correct. 3/10 = 30/100, and 30/100 + 45/100 = 75/100 of the garden.
        - |
          15/100 is the difference, 45/100 − 30/100. The question asks for both crops together, so add.
      answer: 2

    - slug: g4math-w09-q10
      type: multiple_choice
      topic_code: "4.NF.C.5"
      source: "IM K–5 Math Grade 4, Unit 3, Section C"
      points: 1
      prompt: |
        A dime is 1/10 of a dollar and a penny is 1/100 of a dollar. Ana has 4 dimes and 6 pennies. What fraction of a dollar does she have?
      options:
        - "46/100"
        - "10/100"
        - "64/100"
        - "46/10"
      option_explanations:
        - |
          Correct. 4 dimes are 4/10 = 40/100 of a dollar, and 6 pennies are 6/100. 40/100 + 6/100 = 46/100.
        - |
          10/100 counts every coin as a penny. Each dime is worth 10 pennies, so 4 dimes are 40/100.
        - |
          64/100 swaps the coins: it would be 6 dimes and 4 pennies.
        - |
          46/10 would be more than 4 whole dollars. The amount is 46 cents, which is 46 hundredths of a dollar.
      answer: 0

    # ---- spiral review
    - slug: g4math-w09-q11
      type: multiple_choice
      topic_code: "4.NF.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section A"
      points: 1
      prompt: |
        What is 3 × 3/10?
      options:
        - "9/30"
        - "6/10"
        - "3/30"
        - "9/10"
      option_explanations:
        - |
          9/30 multiplies the denominator too. Three groups of 3 tenths are still tenths.
        - |
          6/10 comes from adding 3 + 3. Three groups of 3 tenths are 3 × 3 = 9 tenths.
        - |
          3/30 changes the parts to thirtieths. Tenths stay tenths, and there are 9 of them.
        - |
          Correct. Three groups of 3 tenths make 9 tenths: 3 × 3/10 = 9/10.
      answer: 3

    - slug: g4math-w09-q12
      type: multiple_choice
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      prompt: |
        What is 2 3/8 + 1 7/8?
      options:
        - "3 10/16"
        - "3 2/8"
        - "4 2/8"
        - "5 2/8"
      option_explanations:
        - |
          The denominators were added. Eighths plus eighths are still eighths: 3/8 + 7/8 = 10/8.
        - |
          10/8 is 1 2/8, but the extra whole was left out. 3 + 1 2/8 = 4 2/8.
        - |
          Correct. The wholes make 3 and the eighths make 10/8 = 1 2/8. 3 + 1 2/8 = 4 2/8.
        - |
          This counts the extra whole twice. 2 + 1 = 3 wholes, and 10/8 adds only 1 more whole.
      answer: 2

    - slug: g4math-w09-q13
      type: multiple_choice
      topic_code: "4.NF.A.1"
      source: "IM K–5 Math Grade 4, Unit 2, Section B"
      points: 1
      prompt: |
        Which fraction is equivalent to 2/5?
      options:
        - "4/10"
        - "2/10"
        - "4/5"
        - "5/2"
      option_explanations:
        - |
          Correct. Multiply the numerator and the denominator by 2: 2 × 2 = 4 and 5 × 2 = 10, so 2/5 = 4/10.
        - |
          2/10 changes only the denominator. Tenths are half the size of fifths, so 2 tenths is half of 2/5.
        - |
          4/5 doubles only the numerator. That is twice as much as 2/5.
        - |
          5/2 flips the fraction. It is more than 2 wholes, and 2/5 is less than 1.
      answer: 0

    - slug: g4math-w09-q14
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      prompt: |
        Which number is a multiple of 6?
      options:
        - "16"
        - "26"
        - "36"
        - "46"
      option_explanations:
        - |
          16 is not a multiple of 6: 6 × 2 = 12 and 6 × 3 = 18, so 6 skips over 16.
        - |
          26 is not a multiple of 6: 6 × 4 = 24 and 6 × 5 = 30, so 6 skips over 26.
        - |
          Correct. 6 × 6 = 36, so 36 is a multiple of 6.
        - |
          46 is not a multiple of 6: 6 × 7 = 42 and 6 × 8 = 48, so 6 skips over 46.
      answer: 2

    - slug: g4math-w09-q15
      type: short_answer
      topic_code: "4.NF.C.5"
      source: "IM K–5 Math Grade 4, Unit 3, Section C"
      points: 2
      prompt: |
        Jun shaded 6/10 of a 100-square grid. Mia shaded 18/100 of another grid the same size.

        (a) How much did they shade in all? Write your answer in hundredths.
        (b) Explain why 6/10 is the same as 60/100.
      answer: |
        (a) 6/10 = 60/100, and 60/100 + 18/100 = 78/100 of a grid.
        (b) On a 100-square grid, each tenth is one column of 10 small squares. 6 columns have 6 × 10 = 60 small squares, so 6 tenths cover the same amount as 60 hundredths.
      explanation: |
        Two points.

        (a) 1 pt: 78/100.

        (b) 1 pt: explains that each tenth is 10 hundredths (a column of 10 squares, or multiplying the top and bottom by 10), so 6 tenths = 60 hundredths.
