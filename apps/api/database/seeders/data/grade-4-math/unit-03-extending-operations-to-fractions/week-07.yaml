week: 7
unit: 3
title: "Adding and Subtracting Fractions With the Same Denominator"
topics: ["4.NF.B.3"]
guide: guides/week-07.md
guide_description: |
  How to join and take away parts of the same whole when the fractions have the same denominator, why the
  denominator stays the same, how to break a fraction into a sum of smaller fractions in more than one way, and
  how to subtract a fraction from 1 whole.
flashcards_description: |
  19 cards on adding and subtracting fractions with like denominators, decomposing a fraction into a sum,
  taking a fraction away from 1 whole, and the mistake of adding the denominators.

flashcards:
  - front: Like denominators → what it means
    back: |
      Fractions with the same bottom number, such as 2/8 and 5/8. Their parts are the same size, so you can add or subtract them by counting parts.
    topic_code: "4.NF.B.3"
  - front: Adding fractions with like denominators → the rule
    back: |
      Add the numerators and keep the denominator. 2/8 + 5/8 = 7/8, because 2 eighths and 5 eighths make 7 eighths.
    topic_code: "4.NF.B.3"
  - front: Subtracting fractions with like denominators → the rule
    back: |
      Subtract the numerators and keep the denominator. 7/10 − 3/10 = 4/10.
    topic_code: "4.NF.B.3"
  - front: Why 2/8 + 5/8 is not 7/16
    back: |
      Adding does not change the size of the parts. Eighths plus eighths are still eighths, so the sum is 7/8.
    topic_code: "4.NF.B.3"
  - front: 3/12 + 4/12 → sum
    back: |
      7/12. Three twelfths and four twelfths make seven twelfths.
    topic_code: "4.NF.B.3"
  - front: 11/12 − 4/12 → difference
    back: |
      7/12. Start with 11 twelfths and take away 4 twelfths.
    topic_code: "4.NF.B.3"
  - front: 4/5 + 3/5 → sum
    back: |
      7/5. That is more than 1 whole, because 5/5 = 1.
    topic_code: "4.NF.B.3"
  - front: Decompose → what it means for a fraction
    back: |
      Break the fraction into a sum of smaller fractions with the same denominator. 4/6 = 1/6 + 3/6.
    topic_code: "4.NF.B.3"
  - front: 3/8 → two ways to decompose
    back: |
      1/8 + 1/8 + 1/8, or 1/8 + 2/8. Any sum of eighths whose numerators add to 3 works.
    topic_code: "4.NF.B.3"
  - front: 5/10 → decomposed into unit fractions
    back: |
      1/10 + 1/10 + 1/10 + 1/10 + 1/10. Five copies of one tenth.
    topic_code: "4.NF.B.3"
  - front: 1 whole → written in fourths, sixths and tenths
    back: |
      4/4, 6/6 and 10/10. All the parts of the whole are there.
    topic_code: "4.NF.B.3"
  - front: 1 − 3/8 → difference
    back: |
      5/8. Write 1 as 8/8, then 8/8 − 3/8 = 5/8.
    topic_code: "4.NF.B.3"
  - front: 1 − 7/12 → difference
    back: |
      5/12. Write 1 as 12/12, then 12/12 − 7/12 = 5/12.
    topic_code: "4.NF.B.3"
  - front: Subtracting on a number line → which way to jump
    back: |
      Start at the first fraction and jump back (to the left) by the fraction you take away. 7/8 − 3/8: start at 7/8, jump back 3 eighths, land on 4/8.
    topic_code: "4.NF.B.3"
  - front: Adding on a number line → which way to jump
    back: |
      Start at the first fraction and jump forward (to the right). 2/5 + 2/5: start at 2/5, jump 2 fifths, land on 4/5.
    topic_code: "4.NF.B.3"
  - front: '"How much more" with fractions → which operation'
    back: |
      Subtract. Ana read 7/10 of her book and Ben read 4/10 of the same book: 7/10 − 4/10 = 3/10 more.
    topic_code: "4.NF.B.3"
  - front: Fraction story with "in all" or "together" → which operation
    back: |
      Usually add. 2/6 of a pan of corn bread at lunch and 3/6 at snack is 5/6 of the pan in all.
    topic_code: "4.NF.B.3"
  - front: Adding fractions → the wholes must match
    back: |
      Only add fractions of the same whole. 1/4 of a small pizza plus 1/4 of a big pizza is not 2/4 of either pizza.
    topic_code: "4.NF.B.3"
  - front: 2/3 + 2/3 → sum, and is it more than 1?
    back: |
      4/3. Yes: 3/3 is 1 whole, and 4/3 is one third more than 1.
    topic_code: "4.NF.B.3"

quiz:
  description: |
    15 questions · about 30 minutes · adding and subtracting fractions with the same denominator on strips and
    number lines, decomposing fractions, subtracting from 1 whole, story problems, and review of multiplying a
    fraction by a whole number, equivalent fractions, comparing fractions and prime numbers. Multiple choice,
    select-all, true/false and number answers are graded at once; the fill-in word is matched automatically;
    the short answer is checked by your teacher.
  questions:
    - slug: g4math-w07-q01
      type: multiple_choice
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      stimulus: |
        Use the fraction strip. It is one whole cut into 8 equal parts. 3 parts are blue, 2 parts are green and the rest are white.
      figure: figures/w07-strip-eighths.svg
      figure_alt: "A long strip cut into 8 equal parts, each labeled 1/8. From the left, the first 3 parts are shaded blue, the next 2 parts are shaded green and the last 3 parts are white."
      prompt: |
        Which equation tells how much of the strip is blue or green?
      options:
        - "3/8 + 2/8 = 5/16"
        - "3/8 + 2/8 = 5/8"
        - "3/8 + 5/8 = 8/8"
        - "3/5 + 2/5 = 5/5"
      option_explanations:
        - |
          5/16 adds the denominators too. The parts are all eighths, and adding does not make them smaller, so the sum is 5 eighths.
        - |
          Correct. 3 blue eighths and 2 green eighths make 5 eighths: 3/8 + 2/8 = 5/8.
        - |
          This adds the blue parts to all 5 shaded parts. Only 2 parts are green, so the blue and green parts make 5/8, not the whole strip.
        - |
          The whole strip has 8 equal parts, not 5. The white parts count in the denominator too.
      answer: 1

    - slug: g4math-w07-q02
      type: numeric
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      stimulus: |
        Use the fraction strip. It is one whole cut into 8 equal parts. 3 parts are blue, 2 parts are green and the rest are white.
      prompt: |
        What fraction of the strip is white? Type the missing numerator: □/8.
      answer: { value: 3, tolerance: 0 }
      explanation: |
        The whole strip is 8/8. The shaded part is 5/8, so the white part is 8/8 − 5/8 = 3/8. You can also count the 3 white parts.

    - slug: g4math-w07-q03
      type: multiple_choice
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      figure: figures/w07-jump-back-sixths.svg
      figure_alt: "A number line from 0 to 1 with tick marks labeled 0, 1/6, 2/6, 3/6, 4/6, 5/6 and 1. A red arrow starts at 5/6 and curves back to the left, landing on 3/6. The arrow covers 2 sixths."
      prompt: |
        On the number line, the arrow starts at 5/6 and jumps back. Which equation does the arrow show?
      options:
        - "5/6 + 2/6 = 7/6"
        - "5/6 − 3/6 = 2/6"
        - "3/6 − 2/6 = 1/6"
        - "5/6 − 2/6 = 3/6"
      option_explanations:
        - |
          The arrow points back, to the left, so it shows taking away, not adding. Adding 2/6 would land past 1.
        - |
          The arrow lands on 3/6, but it is 2 sixths long. Taking away 3/6 from 5/6 would land on 2/6.
        - |
          The arrow starts at 5/6, not at 3/6. 3/6 is where it lands.
        - |
          Correct. Start at 5/6 and jump back 2 sixths to land on 3/6: 5/6 − 2/6 = 3/6.
      answer: 3

    - slug: g4math-w07-q04
      type: multiple_choice
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      prompt: |
        Which sum is a way to decompose 5/8?
      options:
        - "2/8 + 3/8"
        - "2/4 + 3/4"
        - "1/8 + 4/8 + 1/8"
        - "2/3 + 3/5"
      option_explanations:
        - |
          Correct. Both parts are eighths, and 2 eighths and 3 eighths make 5 eighths.
        - |
          These are fourths, which are bigger parts than eighths. 2/4 + 3/4 = 5/4, which is more than 1 whole.
        - |
          The numerators add to 1 + 4 + 1 = 6, so this sum is 6/8, one eighth too much.
        - |
          This splits the 5 and the 8 into pieces, but a decomposition keeps the same denominator in every part: 5/8 = 2/8 + 3/8.
      answer: 0

    - slug: g4math-w07-q05
      type: multi_select
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which sums are equal to 7/10? Select all that apply.
      options:
        - "3/10 + 4/10"
        - "1/10 + 6/10"
        - "3/5 + 4/5"
        - "2/10 + 2/10 + 3/10"
        - "5/10 + 2/10 + 1/10"
      option_explanations:
        - |
          Equal. 3 tenths and 4 tenths make 7 tenths.
        - |
          Equal. 1 tenth and 6 tenths make 7 tenths.
        - |
          Not equal. These are fifths: 3/5 + 4/5 = 7/5, which is more than 1 whole.
        - |
          Equal. 2 + 2 + 3 = 7, so the sum is 7 tenths.
        - |
          Not equal. 5 + 2 + 1 = 8, so the sum is 8/10.
      answer: [0, 1, 3]

    - slug: g4math-w07-q06
      type: true_false
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      prompt: |
        True or false: 1 − 2/6 = 4/6.
      answer: true
      explanation: |
        True. 1 whole is 6/6. Take away 2 sixths: 6/6 − 2/6 = 4/6.

    - slug: g4math-w07-q07
      type: fill_blank
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      prompt: |
        Writing 3/5 as 1/5 + 2/5 breaks the fraction into a sum of smaller parts. This is called ____ the fraction.
      answer: ["decomposing", "decomposing it", "breaking apart", "breaking it apart"]
      explanation: |
        Decomposing means breaking a number into parts that add up to it. 3/5 can be decomposed as 1/5 + 2/5 or as 1/5 + 1/5 + 1/5.

    - slug: g4math-w07-q08
      type: multiple_choice
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      stimulus: |
        Use the garden plan. The garden is cut into 12 equal plots. T marks a plot of tomatoes and B marks a plot of beans. The other plots are empty.
      figure: figures/w07-garden-twelfths.svg
      figure_alt: "A rectangle garden plan cut into 12 equal plots, 3 rows of 4. The top row has 4 red plots marked T. The middle row has 1 red plot marked T and 3 green plots marked B. The bottom row has 1 green plot marked B and 3 empty white plots. A key says T = tomatoes and B = beans. In all there are 5 tomato plots, 4 bean plots and 3 empty plots."
      prompt: |
        What fraction of the garden is planted with tomatoes or beans?
      options:
        - "9/24"
        - "5/12"
        - "9/12"
        - "3/12"
      option_explanations:
        - |
          9/24 adds the denominators. Every plot is one twelfth of the garden, so the sum is still in twelfths.
        - |
          5/12 is only the tomato plots. Add the 4/12 for beans too.
        - |
          Correct. Tomatoes are 5/12 and beans are 4/12, so together 5/12 + 4/12 = 9/12 of the garden is planted.
        - |
          3/12 is the empty part of the garden, not the planted part.
      answer: 2

    - slug: g4math-w07-q09
      type: numeric
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      stimulus: |
        Use the garden plan. The garden is cut into 12 equal plots. T marks a plot of tomatoes and B marks a plot of beans. The other plots are empty.
      prompt: |
        The gardener plants beans in 2 of the empty plots. What fraction of the whole garden is beans then? Type the missing numerator: □/12.
      answer: { value: 6, tolerance: 0 }
      explanation: |
        Beans start at 4/12. Adding 2 more plots: 4/12 + 2/12 = 6/12 of the garden is beans.

    - slug: g4math-w07-q10
      type: multiple_choice
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      prompt: |
        A full water bottle holds 1 liter. Sami drinks 3/10 liter in the morning and 4/10 liter after lunch. How much water is left in the bottle?
      options:
        - "7/10 liter"
        - "3/10 liter"
        - "4/10 liter"
        - "7/20 liter"
      option_explanations:
        - |
          7/10 liter is how much Sami drank in all. The question asks how much is left, so take that away from 1 whole.
        - |
          Correct. Sami drank 3/10 + 4/10 = 7/10 liter. The bottle held 10/10, and 10/10 − 7/10 = 3/10 liter is left.
        - |
          4/10 liter is what Sami drank after lunch. After both drinks, less than that is left.
        - |
          7/20 adds the denominators. Tenths plus tenths are still tenths, and the question asks what is left, not what was drunk.
      answer: 1

    # ---- spiral review
    - slug: g4math-w07-q11
      type: multiple_choice
      topic_code: "4.NF.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section A"
      points: 1
      prompt: |
        What is 5 × 2/6?
      options:
        - "10/30"
        - "7/6"
        - "5/6"
        - "10/6"
      option_explanations:
        - |
          10/30 multiplies the denominator too. Five groups of 2 sixths are still sixths.
        - |
          7/6 comes from adding 5 + 2. There are 5 groups of 2 sixths, so multiply: 5 × 2 = 10.
        - |
          5/6 is 5 × 1/6. Each group is 2 sixths, so there are twice as many sixths.
        - |
          Correct. Five groups of 2 sixths make 10 sixths: 5 × 2/6 = 10/6.
      answer: 3

    - slug: g4math-w07-q12
      type: multiple_choice
      topic_code: "4.NF.A.1"
      source: "IM K–5 Math Grade 4, Unit 2, Section B"
      points: 1
      prompt: |
        Which fraction is equivalent to 3/4?
      options:
        - "3/8"
        - "5/6"
        - "9/12"
        - "4/3"
      option_explanations:
        - |
          3/8 has the same numerator, but eighths are half the size of fourths. 3/4 is the same as 6/8.
        - |
          5/6 comes from adding 2 to the top and bottom. Equivalent fractions come from multiplying both by the same number.
        - |
          Correct. Multiply the numerator and the denominator by 3: 3 × 3 = 9 and 4 × 3 = 12, so 3/4 = 9/12.
        - |
          4/3 flips the fraction. It is more than 1 whole, and 3/4 is less than 1.
      answer: 2

    - slug: g4math-w07-q13
      type: multiple_choice
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section C"
      points: 1
      prompt: |
        Which fraction is greater than 1/2?
      options:
        - "5/8"
        - "3/8"
        - "2/6"
        - "4/10"
      option_explanations:
        - |
          Correct. Half of 8 is 4, so 4/8 = 1/2. 5/8 is one eighth more than a half.
        - |
          Half of 8 is 4, so 1/2 = 4/8. 3/8 is one eighth less than a half.
        - |
          Half of 6 is 3, so 1/2 = 3/6. 2/6 is less than a half.
        - |
          Half of 10 is 5, so 1/2 = 5/10. 4/10 is less than a half.
      answer: 0

    - slug: g4math-w07-q14
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      prompt: |
        Which number is prime?
      options:
        - "21"
        - "27"
        - "15"
        - "29"
      option_explanations:
        - |
          21 is composite: 3 × 7 = 21, so it has more factors than 1 and itself.
        - |
          27 is composite: 3 × 9 = 27, so 3 and 9 are factors.
        - |
          15 is composite: 3 × 5 = 15, so 3 and 5 are factors.
        - |
          Correct. The only factor pair of 29 is 1 and 29, so it is prime.
      answer: 3

    - slug: g4math-w07-q15
      type: short_answer
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 2
      prompt: |
        A ribbon is 9/10 meter long. Bea cuts off 4/10 meter to make a bow.

        (a) How long is the ribbon that is left? Write an equation.
        (b) Ravi says the answer is 5/0 because 10 − 10 = 0. Explain why the denominator stays 10.
      answer: |
        (a) 9/10 − 4/10 = 5/10 meter.
        (b) The denominator tells the size of the parts: tenths of a meter. Cutting off 4 tenths leaves 5 tenths, and those pieces are still tenths. Only the number of tenths changes, so the answer is 5/10, not 5/0.
      explanation: |
        Two points.

        (a) 1 pt: 5/10 meter (an equation such as 9/10 − 4/10 = 5/10, or an equivalent answer like 1/2 meter with work).

        (b) 1 pt: explains that the denominator names the size of the parts (tenths), which does not change when you take some away; a strip or number line in tenths also earns the point.
