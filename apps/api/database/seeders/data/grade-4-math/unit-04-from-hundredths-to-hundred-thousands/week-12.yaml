week: 12
unit: 4
title: "Comparing, Ordering and Rounding Big Numbers"
topics: ["4.NBT.A.3"]
guide: guides/week-12.md
guide_description: |
  How to compare and order numbers up to a million by looking at the biggest place first, and how to round a
  big number to the nearest ten, hundred, thousand, ten thousand or hundred thousand on a number line, then
  use rounded numbers to estimate.
flashcards_description: |
  18 cards on comparing and ordering big numbers, what rounding means, the digit to look at, halfway numbers,
  rounding to each place, and estimating with rounded numbers.

flashcards:
  - front: Comparing big numbers → first step
    back: |
      Count the digits. A number with more digits is greater: 100,000 is greater than 99,999.
    topic_code: "4.NBT.A.2"
  - front: Comparing two six-digit numbers → how
    back: |
      Start at the biggest place on the left and move right. The first place where the digits differ tells you which number is greater.
    topic_code: "4.NBT.A.2"
  - front: 86,402 or 86,240 → which is greater
    back: |
      86,402. Both have 86 thousands, and 4 hundreds is more than 2 hundreds.
    topic_code: "4.NBT.A.2"
  - front: Ordering numbers from least to greatest → meaning
    back: |
      Start with the smallest number and end with the biggest: 9,875; 86,240; 120,050.
    topic_code: "4.NBT.A.2"
  - front: Rounding a big number → what it means
    back: |
      Finding the nearest "friendly" number with zeros at the end, such as the nearest thousand or the nearest ten thousand.
    topic_code: "4.NBT.A.3"
  - front: Rounding → which digit to look at
    back: |
      The digit one place to the right of the place you are rounding to. To round to the nearest thousand, look at the hundreds digit.
    topic_code: "4.NBT.A.3"
  - front: Rounding rule → 0 to 4 or 5 to 9
    back: |
      If the digit you look at is 0, 1, 2, 3 or 4, round down. If it is 5, 6, 7, 8 or 9, round up.
    topic_code: "4.NBT.A.3"
  - front: Halfway number when rounding → what to do
    back: |
      Round up. 45,000 is exactly halfway between 40,000 and 50,000, so it rounds to 50,000.
    topic_code: "4.NBT.A.3"
  - front: Rounding on a number line → how
    back: |
      Mark the two friendly numbers on each side and the halfway point between them. See which end the number is closer to.
    topic_code: "4.NBT.A.3"
  - front: 47,600 → nearest thousand
    back: |
      48,000. 47,600 is past the halfway point, 47,500.
    topic_code: "4.NBT.A.3"
  - front: 8,451 → nearest hundred
    back: |
      8,500. The tens digit is 5, so round up.
    topic_code: "4.NBT.A.3"
  - front: 362,519 → nearest ten thousand
    back: |
      360,000. It is between 360,000 and 370,000, and the thousands digit is 2, so round down.
    topic_code: "4.NBT.A.3"
  - front: 638,200 → nearest hundred thousand
    back: |
      600,000. The ten thousands digit is 3, so round down.
    topic_code: "4.NBT.A.3"
  - front: 96,700 → nearest thousand
    back: |
      97,000. The hundreds digit is 7, so round up: 96 thousands becomes 97 thousands.
    topic_code: "4.NBT.A.3"
  - front: 59,800 → nearest thousand
    back: |
      60,000. Rounding up 59 thousands gives 60 thousands, which is written 60,000.
    topic_code: "4.NBT.A.3"
  - front: Round the starting number → why
    back: |
      Always round the number you started with. 14,480 rounds to 14,000 for the nearest thousand. Rounding it to 14,500 first and then to 15,000 is wrong.
    topic_code: "4.NBT.A.3"
  - front: Estimate → what it is
    back: |
      A close answer found with rounded numbers. 4,826 + 3,189 is about 5,000 + 3,000 = 8,000.
    topic_code: "4.NBT.A.3"
  - front: Why estimate → reason
    back: |
      An estimate tells you if an exact answer makes sense. If an exact sum is far from the estimate, check the work.
    topic_code: "4.NBT.A.3"

quiz:
  description: |
    15 questions · about 30 minutes · comparing and ordering numbers to a million, rounding to any place on a
    number line and with the digit to the right, and estimating with rounded numbers, plus review of place
    value, decimals and factor pairs. Multiple choice, select-all, true/false and number answers are graded at
    once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w12-q01
      type: multiple_choice
      topic_code: "4.NBT.A.3"
      source: "IM K–5 Math Grade 4, Unit 4, Section C"
      points: 1
      stimulus: |
        Use the number line. It goes from 47,000 to 48,000 with a tick mark every 100, and the dot is at 47,600.
      figure: figures/w12-round-number-line.svg
      figure_alt: "A number line titled Rounding to the Nearest Thousand, from 47,000 to 48,000, with a tick mark every 100. The ticks at 47,000, 47,500 and 48,000 are labeled and taller. A red dot sits on the sixth tick after 47,000 and is labeled 47,600."
      prompt: |
        What is 47,600 rounded to the nearest thousand?
      options:
        - "47,000"
        - "48,000"
        - "47,600"
        - "50,000"
      option_explanations:
        - |
          47,000 is the thousand below. The dot is past the halfway mark, 47,500, so it is closer to 48,000.
        - |
          Correct. The dot is 4 ticks (400) from 48,000 and 6 ticks (600) from 47,000, so it is closer to 48,000.
        - |
          47,600 is the number itself, already rounded to the nearest hundred. The nearest thousand ends in three zeros.
        - |
          50,000 is the nearest ten thousand. The question asks for the nearest thousand.
      answer: 1

    - slug: g4math-w12-q02
      type: numeric
      topic_code: "4.NBT.A.3"
      source: "IM K–5 Math Grade 4, Unit 4, Section C"
      points: 1
      stimulus: |
        Use the number line. It goes from 47,000 to 48,000 with a tick mark every 100, and the dot is at 47,600.
      prompt: |
        How far is the dot from 48,000?
      answer: { value: 400, tolerance: 0 }
      explanation: |
        From the dot to 48,000 there are 4 jumps of 100, so the distance is 400. (48,000 − 47,600 = 400.)

    - slug: g4math-w12-q03
      type: multiple_choice
      topic_code: "4.NBT.A.2"
      source: "IM K–5 Math Grade 4, Unit 4, Section C"
      points: 1
      stimulus: |
        Use the table "Visitors to Four Parks in One Year".
      figure: figures/w12-visitors-table.svg
      figure_alt: "A table titled Visitors to Four Parks in One Year with two columns, Park and Visitors. Maple Park had 86,402 visitors. River Park had 86,240. Hill Park had 9,875. Lake Park had 120,050."
      prompt: |
        Which park had the most visitors?
      options:
        - "Maple Park"
        - "River Park"
        - "Hill Park"
        - "Lake Park"
      option_explanations:
        - |
          Maple Park had 86,402, a five-digit number. Lake Park's 120,050 has six digits, so it is greater.
        - |
          River Park had 86,240, which is even fewer than Maple Park.
        - |
          Hill Park's number starts with a 9, but 9,875 has only four digits. It is the fewest visitors.
        - |
          Correct. 120,050 is the only number with six digits, so it is more than one hundred thousand and greater than the others.
      answer: 3

    - slug: g4math-w12-q04
      type: multiple_choice
      topic_code: "4.NBT.A.2"
      source: "IM K–5 Math Grade 4, Unit 4, Section C"
      points: 1
      stimulus: |
        Use the table "Visitors to Four Parks in One Year".
      prompt: |
        Which sentence compares Maple Park and River Park correctly?
      options:
        - "Maple Park had more: both have 86 thousands, and 4 hundreds is more than 2 hundreds."
        - "River Park had more: its tens digit, 4, is greater than Maple Park's tens digit, 0."
        - "They had the same number: the two numbers use the same digits."
        - "We cannot tell which is greater until both numbers are rounded."
      option_explanations:
        - |
          Correct. Compare from the left: the ten thousands and the thousands match, and the hundreds are the first place that differs.
        - |
          The tens place comes after the hundreds. Once the hundreds differ (4 and 2), the tens do not matter.
        - |
          Both use the digits 8, 6, 4, 2 and 0, but in different places. 86,402 and 86,240 are different numbers.
        - |
          Rounding is not needed to compare. Both round to 86,000, so rounding would actually hide the difference.
      answer: 0

    - slug: g4math-w12-q05
      type: multiple_choice
      topic_code: "4.NBT.A.3"
      source: "IM K–5 Math Grade 4, Unit 4, Section C"
      points: 1
      prompt: |
        Round 362,519 to the nearest ten thousand.
      options:
        - "370,000"
        - "363,000"
        - "360,000"
        - "400,000"
      option_explanations:
        - |
          370,000 rounds up, but the thousands digit is 2, which means round down.
        - |
          363,000 is 362,519 rounded to the nearest thousand, not the nearest ten thousand.
        - |
          Correct. 362,519 is between 360,000 and 370,000. The thousands digit is 2, so it is closer to 360,000.
        - |
          400,000 is the nearest hundred thousand. The question asks for the nearest ten thousand.
      answer: 2

    - slug: g4math-w12-q06
      type: numeric
      topic_code: "4.NBT.A.3"
      source: "IM K–5 Math Grade 4, Unit 4, Section C"
      points: 1
      prompt: |
        Round 8,451 to the nearest hundred. (Type the digits without a comma.)
      answer: { value: 8500, tolerance: 0 }
      explanation: |
        8,451 is between 8,400 and 8,500. Look at the tens digit: it is 5, so round up to 8,500. (8,451 is past the halfway point, 8,450.)

    - slug: g4math-w12-q07
      type: multi_select
      topic_code: "4.NBT.A.3"
      source: "IM K–5 Math Grade 4, Unit 4, Section C"
      points: 2
      partial_credit: true
      prompt: |
        Which numbers round to 50,000 when rounded to the nearest ten thousand? Select all that apply.
      options:
        - "45,000"
        - "54,999"
        - "55,000"
        - "44,999"
        - "50,712"
      option_explanations:
        - |
          Yes. 45,000 is exactly halfway between 40,000 and 50,000, and a halfway number rounds up.
        - |
          Yes. The thousands digit is 4, so 54,999 rounds down to 50,000.
        - |
          No. 55,000 is halfway between 50,000 and 60,000, so it rounds up to 60,000.
        - |
          No. The thousands digit is 4, so 44,999 rounds down to 40,000.
        - |
          Yes. 50,712 is just past 50,000, and its thousands digit is 0, so it rounds down to 50,000.
      answer: [0, 1, 4]

    - slug: g4math-w12-q08
      type: fill_blank
      topic_code: "4.NBT.A.3"
      source: "IM K–5 Math Grade 4, Unit 4, Section C"
      points: 1
      prompt: |
        Changing 6,812 to 7,000, the closest thousand, is called ____ to the nearest thousand.
      answer: ["rounding", "round", "rounded"]
      explanation: |
        Rounding finds a nearby friendly number. 6,812 is between 6,000 and 7,000, and its hundreds digit is 8, so it rounds to 7,000.

    - slug: g4math-w12-q09
      type: true_false
      topic_code: "4.NBT.A.2"
      source: "IM K–5 Math Grade 4, Unit 4, Section C"
      points: 1
      prompt: |
        True or false: 99,999 is greater than 100,000.
      answer: false
      explanation: |
        False. 99,999 has five digits and 100,000 has six. 100,000 is one more than 99,999, so it is the greater number.

    - slug: g4math-w12-q10
      type: multiple_choice
      topic_code: "4.NBT.A.3"
      source: "IM K–5 Math Grade 4, Unit 4, Section C"
      points: 1
      prompt: |
        A school library has 4,826 books and 3,189 magazines. Round each number to the nearest thousand. About how many books and magazines are there in all?
      options:
        - "7,000"
        - "8,000"
        - "9,000"
        - "8,015"
      option_explanations:
        - |
          7,000 rounds both numbers down (4,000 + 3,000). 4,826 has 8 hundreds, so it rounds up to 5,000.
        - |
          Correct. 4,826 rounds to 5,000 and 3,189 rounds to 3,000. 5,000 + 3,000 = 8,000.
        - |
          9,000 rounds both numbers up (5,000 + 4,000). 3,189 has only 1 hundred, so it rounds down to 3,000.
        - |
          8,015 is the exact sum. The question asks for an estimate made from rounded numbers.
      answer: 1

    - slug: g4math-w12-q11
      type: multiple_choice
      topic_code: "4.NBT.A.1"
      source: "IM K–5 Math Grade 4, Unit 4, Section B"
      points: 1
      prompt: |
        How many hundreds are in 6,000?
      options:
        - "6"
        - "600"
        - "6,000"
        - "60"
      option_explanations:
        - |
          6 is the number of thousands. Each thousand is 10 hundreds, so there are more hundreds than that.
        - |
          600 is the number of tens in 6,000. Hundreds are bigger than tens, so there are fewer of them.
        - |
          6,000 is the number of ones, not the number of hundreds.
        - |
          Correct. Each thousand is 10 hundreds, so 6 thousands is 6 × 10 = 60 hundreds. Check: 60 × 100 = 6,000.
      answer: 3

    - slug: g4math-w12-q12
      type: numeric
      topic_code: "4.NF.C.6"
      source: "IM K–5 Math Grade 4, Unit 4, Section A"
      points: 1
      prompt: |
        Write the mixed number 5 4/10 as a decimal.
      answer: { value: 5.4, tolerance: 0.001 }
      explanation: |
        5 wholes and 4 tenths: 5.4. The 4 goes in the tenths place, right after the decimal point.

    - slug: g4math-w12-q13
      type: multiple_choice
      topic_code: "4.NF.C.7"
      source: "IM K–5 Math Grade 4, Unit 4, Section A"
      points: 1
      prompt: |
        Which list shows 0.4, 0.35 and 0.5 in order from least to greatest?
      options:
        - "0.4, 0.5, 0.35"
        - "0.5, 0.4, 0.35"
        - "0.35, 0.4, 0.5"
        - "0.4, 0.35, 0.5"
      option_explanations:
        - |
          This puts 0.35 last, as if it were the greatest because it has more digits. 0.35 has only 3 tenths, so it is the least.
        - |
          This list goes from greatest to least. The question asks for least to greatest.
        - |
          Correct. In hundredths the numbers are 40, 35 and 50. From least to greatest: 35, 40, 50, so 0.35, 0.4, 0.5.
        - |
          0.4 is 40 hundredths and 0.35 is 35 hundredths, so 0.4 is greater and cannot come first.
      answer: 2

    - slug: g4math-w12-q14
      type: multiple_choice
      topic_code: "4.OA.B.4"
      source: "IM K–5 Math Grade 4, Unit 1, Section A"
      points: 1
      prompt: |
        Which is a factor pair of 36?
      options:
        - "4 and 9"
        - "6 and 7"
        - "3 and 13"
        - "5 and 7"
      option_explanations:
        - |
          Correct. 4 × 9 = 36, so 4 and 9 are a factor pair of 36.
        - |
          6 × 7 = 42. The factor pair with 6 is 6 and 6.
        - |
          3 × 13 = 39. The factor pair with 3 is 3 and 12.
        - |
          5 × 7 = 35, one less than 36. 5 is not a factor of 36.
      answer: 0

    - slug: g4math-w12-q15
      type: short_answer
      topic_code: "4.NBT.A.3"
      source: "IM K–5 Math Grade 4, Unit 4, Section C"
      points: 2
      prompt: |
        A stadium has 68,450 seats.

        (a) Round 68,450 to the nearest thousand.
        (b) Diego rounded 68,450 and got 70,000. Which place did he round to? Explain how you know.
      answer: |
        (a) 68,000. 68,450 is between 68,000 and 69,000, and the hundreds digit is 4, so it rounds down.
        (b) The nearest ten thousand. 68,450 is between 60,000 and 70,000. The thousands digit is 8, so it rounds up to 70,000.
      explanation: |
        Two points.

        (a) 1 pt: 68,000.

        (b) 1 pt: the nearest ten thousand, with a reason (the thousands digit 8 means round up, or a number line from 60,000 to 70,000 showing 68,450 is past 65,000).
