week: 10
unit: 4
title: "Decimals: Tenths and Hundredths"
topics: ["4.NF.C.6", "4.NF.C.7"]
guide: guides/week-10.md
guide_description: |
  How to write tenths and hundredths as decimals, read them on a hundredths grid and a number line, see why 0.5
  and 0.50 are the same number, and compare two decimals by thinking in tenths and hundredths.
flashcards_description: |
  19 cards on decimal words (decimal point, tenths place, hundredths place), changing fractions to decimals and
  back, mixed numbers as decimals, money, grids and number lines, and comparing decimals.

flashcards:
  - front: Decimal → what it is
    back: |
      A way to write a fraction with a denominator of 10 or 100 by using a decimal point. 3/10 is written 0.3.
    topic_code: "4.NF.C.6"
  - front: Decimal point → what it does
    back: |
      It separates the whole number part from the part that is less than one. In 2.45, the 2 is two wholes and .45 is 45 hundredths.
    topic_code: "4.NF.C.6"
  - front: Tenths place → where it is
    back: |
      The first digit just to the right of the decimal point. In 0.7, the 7 means 7 tenths.
    topic_code: "4.NF.C.6"
  - front: Hundredths place → where it is
    back: |
      The second digit to the right of the decimal point. In 0.36, the 6 means 6 hundredths.
    topic_code: "4.NF.C.6"
  - front: 3/10 → as a decimal
    back: |
      0.3. Three tenths: the 3 goes in the tenths place.
    topic_code: "4.NF.C.6"
  - front: 45/100 → as a decimal
    back: |
      0.45. Forty-five hundredths is 4 tenths and 5 hundredths.
    topic_code: "4.NF.C.6"
  - front: 6/100 → as a decimal
    back: |
      0.06. There are no tenths, so a 0 holds the tenths place and the 6 goes in the hundredths place.
    topic_code: "4.NF.C.6"
  - front: 0.8 → as a fraction
    back: |
      8/10. It is also 80/100, because 8 tenths is the same amount as 80 hundredths.
    topic_code: "4.NF.C.6"
  - front: 0.09 → how to say it
    back: |
      "Nine hundredths." It is the fraction 9/100.
    topic_code: "4.NF.C.6"
  - front: 1 3/10 → as a decimal
    back: |
      1.3. One whole, then 3 in the tenths place.
    topic_code: "4.NF.C.6"
  - front: 2 25/100 → as a decimal
    back: |
      2.25. Two wholes, 2 tenths and 5 hundredths.
    topic_code: "4.NF.C.6"
  - front: Hundredths grid → what one small square shows
    back: |
      One hundredth of the whole, 0.01. A full column of 10 small squares is one tenth, 0.1.
    topic_code: "4.NF.C.6"
  - front: 0.6 on a number line → how to find it
    back: |
      Split the space from 0 to 1 into 10 equal parts. Count 6 parts from 0.
    topic_code: "4.NF.C.6"
  - front: $0.35 → as part of a dollar
    back: |
      35/100 of a dollar. A dollar is 100 cents, so $0.35 is 35 cents.
    topic_code: "4.NF.C.6"
  - front: 0.5 and 0.50 → same or different
    back: |
      The same number. 5 tenths is the same amount as 50 hundredths, so adding a zero at the end does not change the value.
    topic_code: "4.NF.C.7"
  - front: Comparing decimals → where to start
    back: |
      Compare the wholes first, then the tenths, then the hundredths. The first place that is different decides.
    topic_code: "4.NF.C.7"
  - front: 0.5 or 0.38 → which is greater
    back: |
      0.5. It has 5 tenths and 0.38 has only 3 tenths. (0.50 is 50 hundredths, and 50 is more than 38.)
    topic_code: "4.NF.C.7"
  - front: More digits after the decimal point → does that mean bigger
    back: |
      No. 0.4 is greater than 0.39, even though 0.39 has more digits. Compare place by place instead.
    topic_code: "4.NF.C.7"
  - front: Comparing decimals → why the wholes must match
    back: |
      0.5 of a big pizza is more pizza than 0.5 of a small one. Two decimals can only be compared when they are parts of the same size whole.
    topic_code: "4.NF.C.7"

quiz:
  description: |
    15 questions · about 30 minutes · writing tenths and hundredths as decimals, reading decimals on a hundredths
    grid and a number line, and comparing decimals, plus review of equivalent fractions, adding tenths and
    hundredths, adding fractions and multiplying a fraction by a whole number. Multiple choice, select-all,
    true/false and number answers are graded at once; the fill-in word is matched automatically; the short
    answer is checked by your teacher.
  questions:
    - slug: g4math-w10-q01
      type: multiple_choice
      topic_code: "4.NF.C.6"
      source: "IM K–5 Math Grade 4, Unit 4, Section A"
      points: 1
      stimulus: |
        Use the hundredths grid. The whole grid is 1, and it has 100 small squares.
      figure: figures/w10-grid-47.svg
      figure_alt: "A 10 by 10 grid of 100 small squares titled The Whole Grid Is 1. The first 4 columns on the left are fully shaded blue, and the fifth column has its top 7 squares shaded. That is 47 shaded squares. The other 53 squares are white."
      prompt: |
        What decimal names the shaded part?
      options:
        - "0.47"
        - "4.7"
        - "0.4"
        - "0.74"
      option_explanations:
        - |
          Correct. 4 full columns are 4 tenths and 7 more squares are 7 hundredths, so 47 of 100 squares are shaded: 0.47.
        - |
          4.7 would mean more than 4 whole grids. The whole grid is 1, and less than the whole grid is shaded, so the decimal is less than 1.
        - |
          0.4 counts only the 4 full columns. The 7 squares in the fifth column are 7 more hundredths, so the shaded part is 0.47.
        - |
          0.74 swaps the digits. There are 4 full columns (4 tenths) and 7 extra squares (7 hundredths), so the tenths digit is 4.
      answer: 0

    - slug: g4math-w10-q02
      type: numeric
      topic_code: "4.NF.C.6"
      source: "IM K–5 Math Grade 4, Unit 4, Section A"
      points: 1
      stimulus: |
        Use the hundredths grid. The whole grid is 1, and it has 100 small squares.
      prompt: |
        What decimal names the part of the grid that is NOT shaded?
      answer: { value: 0.53, tolerance: 0.001 }
      explanation: |
        47 of the 100 squares are shaded, so 100 − 47 = 53 squares are white. 53 hundredths is written 0.53.

    - slug: g4math-w10-q03
      type: multiple_choice
      topic_code: "4.NF.C.6"
      source: "IM K–5 Math Grade 4, Unit 4, Section A"
      points: 1
      prompt: |
        Which fraction is equal to 0.09?
      options:
        - "9/10"
        - "9/100"
        - "90/100"
        - "1/9"
      option_explanations:
        - |
          9/10 is 0.9. In 0.09 the 9 is in the second place after the decimal point, the hundredths place.
        - |
          Correct. 0.09 has 0 tenths and 9 hundredths, which is 9/100.
        - |
          90/100 is the same as 9/10, or 0.9. That is ten times as much as 0.09.
        - |
          1/9 is not a tenths or hundredths fraction. Read the digit and its place: 9 in the hundredths place is 9/100.
      answer: 1

    - slug: g4math-w10-q04
      type: multiple_choice
      topic_code: "4.NF.C.6"
      source: "IM K–5 Math Grade 4, Unit 4, Section A"
      points: 1
      stimulus: |
        Use the number line from 0 to 1. The tick marks split it into 10 equal parts.
      figure: figures/w10-number-line.svg
      figure_alt: "A number line titled Tenths on a Number Line, from 0 to 1, with tick marks that split it into 10 equal parts. Only 0 and 1 are labeled. A red point labeled A sits on the fourth tick after 0. A red point labeled B sits on the ninth tick after 0."
      prompt: |
        What decimal is at point A?
      options:
        - "0.04"
        - "0.5"
        - "0.4"
        - "0.6"
      option_explanations:
        - |
          0.04 is 4 hundredths. Each part of this line is one tenth, not one hundredth, so 4 parts make 0.4.
        - |
          0.5 comes from counting the tick at 0 as one. Count the jumps from 0 instead: there are 4 jumps to point A.
        - |
          Correct. Point A is 4 jumps of one tenth from 0, so it is at 4 tenths, 0.4.
        - |
          0.6 counts the 6 jumps from point A up to 1. The value is the distance from 0, which is 4 tenths.
      answer: 2

    - slug: g4math-w10-q05
      type: multiple_choice
      topic_code: "4.NF.C.7"
      source: "IM K–5 Math Grade 4, Unit 4, Section A"
      points: 1
      stimulus: |
        Use the number line from 0 to 1. The tick marks split it into 10 equal parts.
      prompt: |
        Point B is at 0.9. Which decimal would sit between point A and point B?
      options:
        - "0.35"
        - "0.09"
        - "0.95"
        - "0.62"
      option_explanations:
        - |
          0.35 is 3 tenths and 5 hundredths. That is less than 0.4, so it sits to the left of point A.
        - |
          0.09 is only 9 hundredths, which is less than one tenth. It sits just past 0, far to the left of point A.
        - |
          0.95 is 9 tenths and 5 hundredths, a little more than 0.9. It sits to the right of point B.
        - |
          Correct. 0.62 is 6 tenths and 2 hundredths. It is more than 0.4 and less than 0.9, so it sits between A and B.
      answer: 3

    - slug: g4math-w10-q06
      type: multiple_choice
      topic_code: "4.NF.C.7"
      source: "IM K–5 Math Grade 4, Unit 4, Section A"
      points: 1
      figure: figures/w10-two-grids.svg
      figure_alt: "Two hundredths grids of the same size, titled Two Hundredths Grids. The left grid, labeled 0.3, has its first 3 columns shaded blue. The right grid, labeled 0.28, has its first 2 columns shaded and the top 8 squares of its third column shaded."
      prompt: |
        Lena says 0.28 is greater than 0.3 because 28 is greater than 3. Use the grids. Which sentence is right?
      options:
        - "Lena is right, because 28 is greater than 3."
        - "0.3 is greater, because 3 tenths is 30 hundredths, and 30 is more than 28."
        - "They are equal, because both grids have some columns shaded."
        - "0.28 is greater, because it has more digits after the decimal point."
      option_explanations:
        - |
          The 3 in 0.3 means 3 tenths, not 3 hundredths. The grids show 0.3 covering more squares than 0.28.
        - |
          Correct. 0.3 shades 3 full columns, which is 30 small squares. 0.28 shades only 28 squares, so 0.3 is greater.
        - |
          The grids are not shaded the same: the left one has 30 squares shaded and the right one has 28.
        - |
          More digits does not mean a bigger number. Compare the tenths first: 3 tenths is more than 2 tenths.
      answer: 1

    - slug: g4math-w10-q07
      type: multi_select
      topic_code: "4.NF.C.7"
      source: "IM K–5 Math Grade 4, Unit 4, Section A"
      points: 2
      partial_credit: true
      prompt: |
        Which comparisons are true? Select all that apply.
      options:
        - "0.6 is greater than 0.59."
        - "0.40 is equal to 0.4."
        - "0.07 is greater than 0.1."
        - "1.2 is less than 0.95."
        - "0.81 is less than 0.9."
      option_explanations:
        - |
          True. 0.6 is 60 hundredths and 0.59 is 59 hundredths, so 0.6 is greater.
        - |
          True. 40 hundredths and 4 tenths are the same amount. The zero at the end does not change the value.
        - |
          False. 0.07 is 7 hundredths and 0.1 is 10 hundredths, so 0.07 is less than 0.1.
        - |
          False. 1.2 has 1 whole and 0.95 has no wholes. Any number with 1 whole is greater than one with 0 wholes.
        - |
          True. 0.81 has 8 tenths and 0.9 has 9 tenths, so 0.81 is less than 0.9.
      answer: [0, 1, 4]

    - slug: g4math-w10-q08
      type: numeric
      topic_code: "4.NF.C.6"
      source: "IM K–5 Math Grade 4, Unit 4, Section A"
      points: 1
      prompt: |
        Write the mixed number 4 9/100 as a decimal.
      answer: { value: 4.09, tolerance: 0.001 }
      explanation: |
        4 wholes, 0 tenths and 9 hundredths: 4.09. The 0 holds the tenths place. (4.9 would be 4 and 9 tenths.)

    - slug: g4math-w10-q09
      type: fill_blank
      topic_code: "4.NF.C.6"
      source: "IM K–5 Math Grade 4, Unit 4, Section A"
      points: 1
      prompt: |
        In the decimal 0.36, the digit 6 is in the ____ place.
      answer: ["hundredths", "hundredth", "the hundredths", "the hundredth"]
      explanation: |
        The first place after the decimal point is tenths and the second is hundredths. The 6 is second, so it means 6 hundredths.

    - slug: g4math-w10-q10
      type: true_false
      topic_code: "4.NF.C.6"
      source: "IM K–5 Math Grade 4, Unit 4, Section A"
      points: 1
      prompt: |
        True or false: 0.7 is equal to 7/100.
      answer: false
      explanation: |
        False. In 0.7 the 7 is in the tenths place, so 0.7 = 7/10 (or 70/100). The fraction 7/100 is written 0.07.

    - slug: g4math-w10-q11
      type: multiple_choice
      topic_code: "4.NF.C.5"
      source: "IM K–5 Math Grade 4, Unit 3, Section C"
      points: 1
      prompt: |
        What is 3/10 + 45/100?
      options:
        - "48/100"
        - "48/110"
        - "75/100"
        - "7/10"
      option_explanations:
        - |
          48/100 adds 3 and 45 without changing 3 tenths into hundredths first. 3/10 is 30/100.
        - |
          48/110 adds the tops and the bottoms. Fractions are added by making the same denominator: 30/100 + 45/100.
        - |
          Correct. 3/10 = 30/100, and 30/100 + 45/100 = 75/100.
        - |
          7/10 adds the 3 tenths and the 4 tenths inside 45/100 but drops the 5 hundredths. The sum is 75/100.
      answer: 2

    - slug: g4math-w10-q12
      type: numeric
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      prompt: |
        Mateo walked 5/8 of a mile before lunch and 2/8 of a mile after lunch. How many eighths of a mile did he walk in all?
      answer: { value: 7, tolerance: 0 }
      explanation: |
        The pieces are all eighths, so add the numerators: 5 + 2 = 7. He walked 7/8 of a mile, which is 7 eighths.

    - slug: g4math-w10-q13
      type: multiple_choice
      topic_code: "4.NF.A.1"
      source: "IM K–5 Math Grade 4, Unit 2, Section B"
      points: 1
      prompt: |
        Which fraction names the same amount as 2/5?
      options:
        - "4/10"
        - "2/10"
        - "4/5"
        - "3/6"
      option_explanations:
        - |
          Correct. Multiply the top and the bottom by 2: 2 × 2 = 4 and 5 × 2 = 10, so 2/5 = 4/10.
        - |
          2/10 changes only the denominator. The pieces get smaller but there are not more of them, so it is less than 2/5.
        - |
          4/5 changes only the numerator. That is twice as much as 2/5, not the same amount.
        - |
          3/6 adds 1 to the top and the bottom. Adding does not keep a fraction the same; 3/6 is 1/2, which is more than 2/5.
      answer: 0

    - slug: g4math-w10-q14
      type: multiple_choice
      topic_code: "4.NF.B.4"
      source: "IM K–5 Math Grade 4, Unit 3, Section A"
      points: 1
      prompt: |
        What is 3 × 2/5?
      options:
        - "6/15"
        - "2/15"
        - "5/5"
        - "6/5"
      option_explanations:
        - |
          6/15 multiplies the denominator too. Three groups of 2 fifths are still fifths, so the denominator stays 5.
        - |
          2/15 multiplies only the denominator. 3 × 2/5 means 3 groups of 2 fifths, which is 6 fifths.
        - |
          5/5 adds 3 to the numerator instead of multiplying. 2/5 + 2/5 + 2/5 is 6/5.
        - |
          Correct. 3 groups of 2 fifths make 6 fifths: 3 × 2/5 = 6/5 (which is 1 1/5).
      answer: 3

    - slug: g4math-w10-q15
      type: short_answer
      topic_code: "4.NF.C.7"
      source: "IM K–5 Math Grade 4, Unit 4, Section A"
      points: 2
      prompt: |
        Ava ran 0.8 kilometer. Ben ran 0.75 kilometer.

        (a) Who ran farther?
        (b) Explain how you know. Use tenths and hundredths, a hundredths grid or a number line.
      answer: |
        (a) Ava ran farther.
        (b) 0.8 is 8 tenths, which is the same as 80 hundredths (0.80). Ben ran 75 hundredths. 80 hundredths is more than 75 hundredths, so 0.8 is greater than 0.75. (Or: on a number line, 0.75 is halfway between 0.7 and 0.8, so it is to the left of 0.8.)
      explanation: |
        Two points.

        (a) 1 pt: Ava.

        (b) 1 pt: a correct reason, such as rewriting 0.8 as 0.80 and comparing 80 and 75 hundredths, comparing tenths (8 tenths is more than 7 tenths), or placing both on a number line or grid. Saying "75 is bigger than 8" does not earn the point.
