unit: 4
description: |
  22 questions · about 45 minutes · every standard of Unit 4: tenths and hundredths as decimals, comparing and
  ordering decimals, place value to a million and the ten times rule, standard, word and expanded form,
  comparing, ordering and rounding big numbers, and adding and subtracting with the standard algorithm. Two
  sets of questions share a picture. Multiple choice, select-all, true/false and number answers are graded at
  once; the fill-in word is matched automatically; the two short answers are checked by your teacher against
  the scoring notes.
questions:
  # ---- Decimals (Section A: 4.NF.C.6, 4.NF.C.7)
  - slug: g4math-u04-check-q01
    type: multiple_choice
    topic_code: "4.NF.C.6"
    source: "IM K–5 Math Grade 4, Unit 4, Section A"
    points: 1
    stimulus: |
      Use the hundredths grid. The whole grid is 1, and it has 100 small squares.
    figure: figures/u04-grid-62.svg
    figure_alt: "A 10 by 10 grid of 100 small squares titled The Whole Grid Is 1. The first 6 columns on the left are fully shaded blue, and the seventh column has its top 2 squares shaded. That is 62 shaded squares. The other 38 squares are white."
    prompt: |
      Which decimal does the shaded part of the grid show?
    options:
      - "6.2"
      - "0.62"
      - "0.26"
      - "0.6"
    option_explanations:
      - |
        6.2 would mean more than 6 whole grids. Less than one grid is shaded, so the decimal is less than 1.
      - |
        Correct. 6 full columns are 6 tenths and 2 more squares are 2 hundredths: 62 hundredths, or 0.62.
      - |
        0.26 swaps the digits. There are 6 full columns, so the tenths digit is 6, and 2 extra squares, so the hundredths digit is 2.
      - |
        0.6 counts only the 6 full columns and leaves out the 2 extra squares in the seventh column.
    answer: 1

  - slug: g4math-u04-check-q02
    type: numeric
    topic_code: "4.NF.C.7"
    source: "IM K–5 Math Grade 4, Unit 4, Section A"
    points: 1
    stimulus: |
      Use the hundredths grid. The whole grid is 1, and it has 100 small squares.
    prompt: |
      How many more small squares must be shaded so that the grid shows 0.7?
    answer: { value: 8, tolerance: 0 }
    explanation: |
      0.7 is 7 tenths, which is 70 hundredths, or 70 small squares. 62 are shaded, and 70 − 62 = 8 more squares. (That fills the rest of the seventh column.)

  - slug: g4math-u04-check-q03
    type: multiple_choice
    topic_code: "4.NF.C.6"
    source: "IM K–5 Math Grade 4, Unit 4, Section A"
    points: 1
    prompt: |
      Which decimal is equal to 3 4/100?
    options:
      - "3.4"
      - "34.0"
      - "3.04"
      - "0.34"
    option_explanations:
      - |
        3.4 is 3 and 4 tenths. The fraction 4/100 is 4 hundredths, so the 4 goes in the second place after the decimal point.
      - |
        34.0 is thirty-four wholes. The number is 3 wholes and a small part of one more.
      - |
        Correct. 3 wholes, 0 tenths and 4 hundredths: 3.04. The 0 holds the tenths place.
      - |
        0.34 has no wholes. The mixed number 3 4/100 has 3 wholes, so the digit before the decimal point is 3.
    answer: 2

  - slug: g4math-u04-check-q04
    type: numeric
    topic_code: "4.NF.C.6"
    source: "IM K–5 Math Grade 4, Unit 4, Section A"
    points: 1
    prompt: |
      Write 72/100 as a decimal.
    answer: { value: 0.72, tolerance: 0.001 }
    explanation: |
      72 hundredths is 7 tenths and 2 hundredths: 0.72.

  - slug: g4math-u04-check-q05
    type: multiple_choice
    topic_code: "4.NF.C.7"
    source: "IM K–5 Math Grade 4, Unit 4, Section A"
    points: 1
    prompt: |
      Which of these decimal comparisons is true?
    options:
      - "0.3 is less than 0.25."
      - "0.70 is greater than 0.7."
      - "1.5 is less than 0.95."
      - "0.09 is less than 0.1."
    option_explanations:
      - |
        False. 0.3 is 30 hundredths and 0.25 is 25 hundredths, so 0.3 is greater.
      - |
        False. 0.70 and 0.7 are equal: 70 hundredths is the same as 7 tenths.
      - |
        False. 1.5 has a whole one and 0.95 does not, so 1.5 is greater.
      - |
        Correct. 0.09 is 9 hundredths and 0.1 is 10 hundredths, so 0.09 is less than 0.1.
    answer: 3

  - slug: g4math-u04-check-q06
    type: true_false
    topic_code: "4.NF.C.7"
    source: "IM K–5 Math Grade 4, Unit 4, Section A"
    points: 1
    prompt: |
      True or false: 2.3 and 2.30 name the same number.
    answer: true
    explanation: |
      True. 3 tenths is the same amount as 30 hundredths, so 2.3 = 2.30. A zero at the end after the decimal point does not change the value.

  - slug: g4math-u04-check-q07
    type: multiple_choice
    topic_code: "4.NF.C.7"
    source: "IM K–5 Math Grade 4, Unit 4, Section A"
    points: 1
    prompt: |
      Which list shows 0.8, 0.85 and 0.08 in order from greatest to least?
    options:
      - "0.85, 0.8, 0.08"
      - "0.8, 0.85, 0.08"
      - "0.08, 0.8, 0.85"
      - "0.85, 0.08, 0.8"
    option_explanations:
      - |
        Correct. In hundredths the numbers are 85, 80 and 8. From greatest to least: 0.85, 0.8, 0.08.
      - |
        0.85 is 85 hundredths and 0.8 is 80 hundredths, so 0.85 is the greatest and comes first.
      - |
        This list goes from least to greatest. The question asks for greatest to least.
      - |
        0.08 is only 8 hundredths, the least of the three, so it belongs at the end.
    answer: 0

  # ---- Place value to a million (Section B: 4.NBT.A.1, 4.NBT.A.2)
  - slug: g4math-u04-check-q08
    type: multiple_choice
    topic_code: "4.NBT.A.2"
    source: "IM K–5 Math Grade 4, Unit 4, Section B"
    points: 1
    stimulus: |
      Use the place-value chart. It shows the number 805,316.
    figure: figures/u04-place-value-chart.svg
    figure_alt: "A place-value chart with six columns. The headings, left to right, are Hundred thousands, Ten thousands, Thousands, Hundreds, Tens and Ones, with a thicker line between Thousands and Hundreds. The digits under them are 8, 0, 5, 3, 1 and 6."
    prompt: |
      What is the value of the digit 8?
    options:
      - "800,000"
      - "80,000"
      - "8,000"
      - "8"
    option_explanations:
      - |
        Correct. The 8 is in the hundred thousands place, so it is worth 8 hundred thousands, 800,000.
      - |
        80,000 would put the 8 in the ten thousands place. That place holds a 0 in this number.
      - |
        8,000 would put the 8 in the thousands place, where the 5 is.
      - |
        8 is the digit itself. Its value comes from its place, the hundred thousands place.
    answer: 0

  - slug: g4math-u04-check-q09
    type: multiple_choice
    topic_code: "4.NBT.A.2"
    source: "IM K–5 Math Grade 4, Unit 4, Section B"
    points: 1
    stimulus: |
      Use the place-value chart. It shows the number 805,316.
    prompt: |
      Which is the word form of the number?
    options:
      - "eighty-five thousand, three hundred sixteen"
      - "eight hundred fifty thousand, three hundred sixteen"
      - "eight hundred five thousand, three hundred sixteen"
      - "eight hundred five, three hundred sixteen"
    option_explanations:
      - |
        Eighty-five thousand, three hundred sixteen is 85,316, a five-digit number. The chart shows six digits.
      - |
        Eight hundred fifty thousand is 850,000. The chart has 0 ten thousands and 5 thousands, so it is eight hundred five thousand.
      - |
        Correct. Read 805 before the comma and say "thousand", then read 316.
      - |
        This leaves out the word "thousand". Without it the words describe a much smaller number.
    answer: 2

  - slug: g4math-u04-check-q10
    type: numeric
    topic_code: "4.NBT.A.1"
    source: "IM K–5 Math Grade 4, Unit 4, Section B"
    points: 1
    prompt: |
      How many tens are in 5,600?
    answer: { value: 560, tolerance: 0 }
    explanation: |
      5,600 is 56 hundreds, and each hundred is 10 tens. 56 × 10 = 560 tens. Check: 560 × 10 = 5,600.

  - slug: g4math-u04-check-q11
    type: multi_select
    topic_code: "4.NBT.A.1"
    source: "IM K–5 Math Grade 4, Unit 4, Section B"
    points: 2
    partial_credit: true
    prompt: |
      Which of these are 10 times as much as 6,000? Select all that apply.
    options:
      - "60,000"
      - "600"
      - "6,000 + 6,000"
      - "60 thousands"
      - "600 hundreds"
    option_explanations:
      - |
        Yes. 6,000 × 10 = 60,000: the 6 moves one place to the left.
      - |
        No. 600 is one tenth of 6,000. It is 10 times smaller, not 10 times as much.
      - |
        No. 6,000 + 6,000 = 12,000, which is only 2 times as much as 6,000.
      - |
        Yes. 60 thousands is 60 × 1,000 = 60,000.
      - |
        Yes. 600 hundreds is 600 × 100 = 60,000.
    answer: [0, 3, 4]

  - slug: g4math-u04-check-q12
    type: multiple_choice
    topic_code: "4.NBT.A.2"
    source: "IM K–5 Math Grade 4, Unit 4, Section B"
    points: 1
    prompt: |
      Which is the expanded form of 70,429?
    options:
      - "7,000 + 400 + 20 + 9"
      - "70,000 + 400 + 20 + 9"
      - "70,000 + 4,000 + 200 + 9"
      - "7 + 0 + 4 + 2 + 9"
    option_explanations:
      - |
        7,000 puts the 7 in the thousands place. In 70,429 the 7 is in the ten thousands place, so it is worth 70,000.
      - |
        Correct. 7 ten thousands, 0 thousands, 4 hundreds, 2 tens and 9 ones.
      - |
        This moves the 4 and the 2 one place too far left. 70,429 has 0 thousands, 4 hundreds and 2 tens.
      - |
        This adds the digits, not their values. Expanded form adds what each digit is worth.
    answer: 1

  - slug: g4math-u04-check-q13
    type: fill_blank
    topic_code: "4.NBT.A.2"
    source: "IM K–5 Math Grade 4, Unit 4, Section B"
    points: 1
    prompt: |
      Writing a number with digits and commas, like 506,213, is called writing it in ____ form.
    answer: ["standard", "standard form"]
    explanation: |
      Standard form uses digits: 506,213. Word form uses words, and expanded form adds the values of the digits.

  # ---- Comparing and rounding (Section C: 4.NBT.A.2, 4.NBT.A.3)
  - slug: g4math-u04-check-q14
    type: multiple_choice
    topic_code: "4.NBT.A.2"
    source: "IM K–5 Math Grade 4, Unit 4, Section C"
    points: 1
    prompt: |
      Which list is in order from least to greatest?
    options:
      - "102,050; 120,500; 98,700"
      - "120,500; 102,050; 98,700"
      - "98,700; 120,500; 102,050"
      - "98,700; 102,050; 120,500"
    option_explanations:
      - |
        98,700 has only five digits, so it is the least and must come first, not last.
      - |
        This list goes from greatest to least. The question asks for least to greatest.
      - |
        102,050 and 120,500 are out of order. Their ten thousands digits are 0 and 2, so 102,050 is less.
      - |
        Correct. 98,700 has five digits, so it is least. Of the six-digit numbers, 102,050 has 0 ten thousands and 120,500 has 2, so 102,050 comes next.
    answer: 3

  - slug: g4math-u04-check-q15
    type: multiple_choice
    topic_code: "4.NBT.A.3"
    source: "IM K–5 Math Grade 4, Unit 4, Section C"
    points: 1
    figure: figures/u04-round-number-line.svg
    figure_alt: "A number line titled Rounding to the Nearest Ten Thousand, from 230,000 to 240,000, with a tick mark every 1,000. The ticks at 230,000, 235,000 and 240,000 are labeled and taller. A red dot sits on the sixth tick after 230,000 and is labeled 236,000."
    prompt: |
      Use the number line. What is 236,000 rounded to the nearest ten thousand?
    options:
      - "230,000"
      - "236,000"
      - "240,000"
      - "200,000"
    option_explanations:
      - |
        230,000 is the ten thousand below. The dot is past the halfway mark, 235,000, so it is closer to 240,000.
      - |
        236,000 is the number itself. Rounding to the nearest ten thousand leaves zeros in the thousands place.
      - |
        Correct. The dot is 4 ticks (4,000) from 240,000 and 6 ticks (6,000) from 230,000, so it rounds to 240,000.
      - |
        200,000 is the nearest hundred thousand. The question asks for the nearest ten thousand.
    answer: 2

  - slug: g4math-u04-check-q16
    type: numeric
    topic_code: "4.NBT.A.3"
    source: "IM K–5 Math Grade 4, Unit 4, Section C"
    points: 1
    prompt: |
      Round 74,682 to the nearest hundred. (Type the digits without a comma.)
    answer: { value: 74700, tolerance: 0 }
    explanation: |
      74,682 is between 74,600 and 74,700. The tens digit is 8, so round up to 74,700.

  - slug: g4math-u04-check-q17
    type: multiple_choice
    topic_code: "4.NBT.A.3"
    source: "IM K–5 Math Grade 4, Unit 4, Section C"
    points: 1
    prompt: |
      Ming rounded a number to the nearest thousand and got 9,000. Which could be her number?
    options:
      - "8,499"
      - "8,750"
      - "9,500"
      - "9,612"
    option_explanations:
      - |
        8,499 has 4 hundreds after the 8 thousands, so it rounds down to 8,000.
      - |
        Correct. 8,750 is between 8,000 and 9,000, and its hundreds digit is 7, so it rounds up to 9,000.
      - |
        9,500 is exactly halfway between 9,000 and 10,000, and a halfway number rounds up to 10,000.
      - |
        9,612 has 6 hundreds after the 9 thousands, so it rounds up to 10,000.
    answer: 1

  # ---- Adding and subtracting (Section D: 4.NBT.B.4)
  - slug: g4math-u04-check-q18
    type: numeric
    topic_code: "4.NBT.B.4"
    source: "IM K–5 Math Grade 4, Unit 4, Section D"
    points: 1
    prompt: |
      What is 45,217 + 36,894? (Type the digits without a comma.)
    answer: { value: 82111, tolerance: 0 }
    explanation: |
      Ones 7 + 4 = 11 (write 1, regroup 1). Tens 1 + 9 + 1 = 11 (write 1, regroup 1). Hundreds 2 + 8 + 1 = 11 (write 1, regroup 1). Thousands 5 + 6 + 1 = 12 (write 2, regroup 1). Ten thousands 4 + 3 + 1 = 8. The sum is 82,111.

  - slug: g4math-u04-check-q19
    type: multiple_choice
    topic_code: "4.NBT.B.4"
    source: "IM K–5 Math Grade 4, Unit 4, Section D"
    points: 1
    prompt: |
      What is 60,005 − 23,148?
    options:
      - "43,143"
      - "46,857"
      - "83,153"
      - "36,857"
    option_explanations:
      - |
        43,143 takes the smaller digit from the bigger digit in each place. In the ones, 5 − 8 needs decomposing first.
      - |
        46,857 decomposes across the zeros but forgets that the ten thousands digit goes down from 6 to 5.
      - |
        83,153 is the sum, 60,005 + 23,148. The problem asks for the difference.
      - |
        Correct. 60,005 is 5 ten thousands, 9 thousands, 9 hundreds, 9 tens and 15 ones. 15 − 8 = 7, 9 − 4 = 5, 9 − 1 = 8, 9 − 3 = 6, 5 − 2 = 3. Check: 36,857 + 23,148 = 60,005.
    answer: 3

  - slug: g4math-u04-check-q20
    type: multiple_choice
    topic_code: "4.NBT.B.4"
    source: "IM K–5 Math Grade 4, Unit 4, Section D"
    points: 1
    prompt: |
      A stadium sold 18,725 tickets on Friday and 23,480 tickets on Saturday. How many more tickets did it sell on Saturday than on Friday?
    options:
      - "4,755"
      - "42,205"
      - "15,365"
      - "5,755"
    option_explanations:
      - |
        Correct. 23,480 − 18,725 = 4,755. Check: 4,755 + 18,725 = 23,480.
      - |
        42,205 adds the two days. "How many more" asks for the difference, so subtract.
      - |
        15,365 takes the smaller digit from the bigger digit in each place. Several places need decomposing first.
      - |
        5,755 forgets that the thousands digit went down from 3 to 2 when a thousand was broken into hundreds, so the thousands come out 5 instead of 4.
    answer: 0

  - slug: g4math-u04-check-q21
    type: short_answer
    topic_code: "4.NBT.B.4"
    source: "IM K–5 Math Grade 4, Unit 4, Sections C and D"
    points: 3
    prompt: |
      A museum had 52,374 visitors in spring and 38,915 visitors in summer.

      (a) Round each number to the nearest thousand and estimate the total.
      (b) Find the exact total with the standard algorithm. Show your work.
      (c) Is your exact answer reasonable? Use your estimate to explain.
    answer: |
      (a) 52,374 rounds to 52,000 and 38,915 rounds to 39,000. 52,000 + 39,000 = 91,000.
      (b) 52,374 + 38,915 = 91,289. Ones 4 + 5 = 9. Tens 7 + 1 = 8. Hundreds 3 + 9 = 12 (write 2, regroup 1). Thousands 2 + 8 + 1 = 11 (write 1, regroup 1). Ten thousands 5 + 3 + 1 = 9.
      (c) Yes. 91,289 is very close to the estimate of 91,000.
    explanation: |
      Three points.

      (a) 1 pt: both numbers rounded correctly (52,000 and 39,000) and an estimate of 91,000.

      (b) 1 pt: 91,289 with the algorithm and regrouping shown.

      (c) 1 pt: says the answer is reasonable because it is close to the estimate.

  - slug: g4math-u04-check-q22
    type: short_answer
    topic_code: "4.NF.C.7"
    source: "IM K–5 Math Grade 4, Unit 4, Section A"
    points: 2
    prompt: |
      Kai says 0.45 is greater than 0.5 because 45 is greater than 5.

      (a) Is Kai right? Which number is greater?
      (b) Explain using tenths and hundredths, a hundredths grid or a number line.
    answer: |
      (a) No. 0.5 is greater.
      (b) 0.5 is 5 tenths, which is 50 hundredths (0.50). 0.45 is 45 hundredths. 50 hundredths is more than 45 hundredths. On a grid, 0.5 shades 50 squares and 0.45 shades only 45. Kai compared 45 and 5 as whole numbers, but the 5 in 0.5 stands for 5 tenths.
    explanation: |
      Two points.

      (a) 1 pt: Kai is not right; 0.5 is greater.

      (b) 1 pt: a correct reason, such as writing 0.5 as 0.50, comparing tenths (5 tenths is more than 4 tenths), or a grid or number line showing 0.45 is less than 0.5.
