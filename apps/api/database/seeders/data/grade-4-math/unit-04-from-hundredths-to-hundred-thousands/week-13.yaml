week: 13
unit: 4
title: "Adding and Subtracting With the Standard Algorithm"
topics: ["4.NBT.B.4"]
guide: guides/week-13.md
guide_description: |
  How to add and subtract numbers up to a million with the standard algorithm: lining up places, regrouping 10
  of one place into 1 of the next, decomposing across zeros, checking subtraction with addition, and using an
  estimate to see if an answer makes sense.
flashcards_description: |
  18 cards on the standard algorithm for adding and subtracting, lining up places, regrouping and decomposing,
  subtracting across zeros, checking with the inverse operation and with an estimate, and tape diagrams.

flashcards:
  - front: Standard algorithm → what it is
    back: |
      A step-by-step way to add or subtract in columns, one place at a time, starting with the ones.
    topic_code: "4.NBT.B.4"
  - front: Lining up numbers to add or subtract → rule
    back: |
      Line up the places: ones under ones, tens under tens, and so on. Line up from the right, not the left.
    topic_code: "4.NBT.B.4"
  - front: Where to start the standard algorithm → which place
    back: |
      The ones place, on the right. Then move left one place at a time.
    topic_code: "4.NBT.B.4"
  - front: Regroup when adding → meaning
    back: |
      When a place adds up to 10 or more, trade 10 of that place for 1 of the next place. 13 ones is 1 ten and 3 ones: write 3 and carry 1 ten.
    topic_code: "4.NBT.B.4"
  - front: 7 + 6 in the hundreds place → what to write
    back: |
      13 hundreds is 1 thousand and 3 hundreds. Write 3 in the hundreds place and add 1 to the thousands.
    topic_code: "4.NBT.B.4"
  - front: Decompose when subtracting → meaning
    back: |
      When the top digit is too small, break 1 of the next place into 10. 1 ten becomes 10 ones, 1 hundred becomes 10 tens.
    topic_code: "4.NBT.B.4"
  - front: 2 − 7 in the ones place → what to do
    back: |
      2 is less than 7, so decompose a ten into 10 ones. Now there are 12 ones, and 12 − 7 = 5. The tens digit goes down by 1.
    topic_code: "4.NBT.B.4"
  - front: Subtracting across zeros → 7,000 − 2,465
    back: |
      Trade 1 thousand: 7,000 becomes 6 thousands, 9 hundreds, 9 tens and 10 ones. Then 10 − 5 = 5, 9 − 6 = 3, 9 − 4 = 5, 6 − 2 = 4. The answer is 4,535.
    topic_code: "4.NBT.B.4"
  - front: Subtract the smaller digit from the bigger one → why that is a mistake
    back: |
      In 52 − 37, doing 7 − 2 gives 25, which is wrong. You must take the bottom digit from the top digit, decomposing when needed: 52 − 37 = 15.
    topic_code: "4.NBT.B.4"
  - front: Checking subtraction → how
    back: |
      Add the answer to the number you took away. You should get the number you started with. 6,213 − 2,874 = 3,339 because 3,339 + 2,874 = 6,213.
    topic_code: "4.NBT.B.4"
  - front: Checking addition → how
    back: |
      Subtract one of the addends from the sum. You should get the other addend.
    topic_code: "4.NBT.B.4"
  - front: Sum → meaning
    back: |
      The answer to an addition problem. In 4,687 + 2,546 = 7,233, the sum is 7,233.
    topic_code: "4.NBT.B.4"
  - front: Difference → meaning
    back: |
      The answer to a subtraction problem. In 25,000 − 16,348 = 8,652, the difference is 8,652.
    topic_code: "4.NBT.B.4"
  - front: Estimate before you add or subtract → why
    back: |
      A quick estimate tells you about how big the answer should be. 38,605 + 24,798 is about 40,000 + 20,000 = 60,000.
    topic_code: "4.NBT.B.4"
  - front: Tape diagram for "how many more" → how to draw it
    back: |
      Draw one long tape for the whole amount. Split it into the part you know and the unknown part. The unknown part is the whole minus the known part.
    topic_code: "4.NBT.B.4"
  - front: Adding three numbers with the standard algorithm → how
    back: |
      Line up all three. Add each column the same way, regrouping when a column reaches 10 or more. A column can make 2 to carry, like 21 ones.
    topic_code: "4.NBT.B.4"
  - front: 10,000 − 1 → answer
    back: |
      9,999. Decompose all the way across: 10,000 is 9 thousands, 9 hundreds, 9 tens and 10 ones.
    topic_code: "4.NBT.B.4"
  - front: Two-step word problem with big numbers → plan
    back: |
      Find what happens first and work it out, then use that answer for the second step. Read the question again before you stop.
    topic_code: "4.NBT.B.4"

quiz:
  description: |
    15 questions · about 35 minutes · adding and subtracting numbers up to a million with the standard algorithm,
    regrouping and decomposing, subtracting across zeros, tape diagrams, checking work and story problems, plus
    review of rounding, place value, decimals and mixed numbers. Multiple choice, select-all, true/false and
    number answers are graded at once; the fill-in word is matched automatically; the short answer is checked
    by your teacher.
  questions:
    - slug: g4math-w13-q01
      type: multiple_choice
      topic_code: "4.NBT.B.4"
      source: "IM K–5 Math Grade 4, Unit 4, Section D"
      points: 1
      stimulus: |
        Noah added 4,687 + 2,546 with the standard algorithm. His work is shown.
      figure: figures/w13-addition-work.svg
      figure_alt: "Noah's Work: an addition problem written in columns. The top number is 4,687 and below it is + 2,546, with a line underneath. Noah's answer under the line, in red, is 6,123. No regrouping marks are written above the columns."
      prompt: |
        What mistake did Noah make?
      options:
        - "He did not regroup. In each place he wrote only the ones digit of the sum and never added the extra 1 to the next place."
        - "He subtracted the smaller digit from the larger digit in each place."
        - "He lined up the thousands digit of one number with the hundreds digit of the other."
        - "He started with the thousands place instead of the ones place."
      option_explanations:
        - |
          Correct. 7 + 6 = 13, 8 + 4 = 12 and 6 + 5 = 11 all need regrouping. Noah wrote 3, 2 and 1 but never carried the 1s, so his thousands digit is 6 instead of 7.
        - |
          Subtracting would give 1 in the ones (7 − 6), but Noah wrote 3. He added each place; he just did not regroup.
        - |
          Both numbers are lined up correctly: ones under ones and thousands under thousands.
        - |
          Starting on the left alone would not change these digits. Each of Noah's digits is the ones digit of a column sum, which shows he skipped regrouping.
      answer: 0

    - slug: g4math-w13-q02
      type: numeric
      topic_code: "4.NBT.B.4"
      source: "IM K–5 Math Grade 4, Unit 4, Section D"
      points: 1
      stimulus: |
        Noah added 4,687 + 2,546 with the standard algorithm. His work is shown.
      prompt: |
        What is the correct sum? (Type the digits without a comma.)
      answer: { value: 7233, tolerance: 0 }
      explanation: |
        Ones: 7 + 6 = 13, write 3 and regroup 1 ten. Tens: 8 + 4 + 1 = 13, write 3 and regroup 1 hundred. Hundreds: 6 + 5 + 1 = 12, write 2 and regroup 1 thousand. Thousands: 4 + 2 + 1 = 7. The sum is 7,233.

    - slug: g4math-w13-q03
      type: multiple_choice
      topic_code: "4.NBT.B.4"
      source: "IM K–5 Math Grade 4, Unit 4, Section D"
      points: 1
      prompt: |
        What is 38,605 + 24,798?
      options:
        - "52,393"
        - "63,303"
        - "63,403"
        - "13,807"
      option_explanations:
        - |
          52,393 never regroups. 5 + 8 = 13 ones, 0 + 9 + 1 = 10 tens, 6 + 7 + 1 = 14 hundreds and 8 + 4 + 1 = 13 thousands all make an extra 1 for the next place.
        - |
          63,303 forgets the hundred made by the 10 tens. With it, the hundreds are 6 + 7 + 1 = 14, so the hundreds digit is 4.
        - |
          Correct. Ones 13 (write 3), tens 0 + 9 + 1 = 10 (write 0), hundreds 6 + 7 + 1 = 14 (write 4), thousands 8 + 4 + 1 = 13 (write 3), ten thousands 3 + 2 + 1 = 6. The sum is 63,403.
        - |
          13,807 is 38,605 − 24,798. The problem asks for the sum.
      answer: 2

    - slug: g4math-w13-q04
      type: numeric
      topic_code: "4.NBT.B.4"
      source: "IM K–5 Math Grade 4, Unit 4, Section D"
      points: 1
      prompt: |
        Find 7,000 − 2,465. (Type the digits without a comma.)
      answer: { value: 4535, tolerance: 0 }
      explanation: |
        Decompose 1 thousand across the zeros: 7,000 is 6 thousands, 9 hundreds, 9 tens and 10 ones. 10 − 5 = 5, 9 − 6 = 3, 9 − 4 = 5, 6 − 2 = 4. The answer is 4,535. Check: 4,535 + 2,465 = 7,000.

    - slug: g4math-w13-q05
      type: multiple_choice
      topic_code: "4.NBT.B.4"
      source: "IM K–5 Math Grade 4, Unit 4, Section D"
      points: 1
      stimulus: |
        Use the tape diagram. A town wants to plant 25,000 trees. So far it has planted 16,348. The letter t stands for the trees still to plant.
      figure: figures/w13-tape-diagram.svg
      figure_alt: "A tape diagram titled Trees for the Town. A bracket over the whole tape says 25,000 trees in all. The tape is split into two parts: a longer blue part labeled 16,348 planted and a shorter white part labeled t to plant."
      prompt: |
        Which equation finds t?
      options:
        - "25,000 + 16,348 = t"
        - "25,000 − 16,348 = t"
        - "16,348 − 25,000 = t"
        - "t − 16,348 = 25,000"
      option_explanations:
        - |
          Adding makes a number bigger than the whole tape. t is one part of the 25,000, so it must be less than 25,000.
        - |
          Correct. The whole is 25,000 and one part is 16,348, so the other part is the whole minus the known part.
        - |
          This takes the whole away from the part, which is backwards. Subtract the part from the whole.
        - |
          This says t is 16,348 more than 25,000. But t is a part of the 25,000, not bigger than it.
      answer: 1

    - slug: g4math-w13-q06
      type: numeric
      topic_code: "4.NBT.B.4"
      source: "IM K–5 Math Grade 4, Unit 4, Section D"
      points: 1
      stimulus: |
        Use the tape diagram. A town wants to plant 25,000 trees. So far it has planted 16,348. The letter t stands for the trees still to plant.
      prompt: |
        How many trees does the town still need to plant? (Type the digits without a comma.)
      answer: { value: 8652, tolerance: 0 }
      explanation: |
        25,000 − 16,348. Decompose across the zeros: 25,000 is 2 ten thousands, 4 thousands, 9 hundreds, 9 tens and 10 ones. 10 − 8 = 2, 9 − 4 = 5, 9 − 3 = 6, 4 − 6 needs one more trade: 14 − 6 = 8, and 1 − 1 = 0. t = 8,652. Check: 8,652 + 16,348 = 25,000.

    - slug: g4math-w13-q07
      type: multi_select
      topic_code: "4.NBT.B.4"
      source: "IM K–5 Math Grade 4, Unit 4, Section D"
      points: 2
      partial_credit: true
      prompt: |
        Which equations are true? Select all that apply.
      options:
        - "5,206 + 3,895 = 9,101"
        - "9,000 − 4,321 = 5,789"
        - "62,350 − 1,350 = 61,000"
        - "47,000 + 3,000 = 50,000"
        - "80,402 − 30,402 = 5,000"
      option_explanations:
        - |
          True. 6 + 5 = 11, 0 + 9 + 1 = 10, 2 + 8 + 1 = 11, 5 + 3 + 1 = 9, so the sum is 9,101.
        - |
          False. 9,000 − 4,321 = 4,679. A check shows it: 5,789 + 4,321 = 10,110, not 9,000.
        - |
          True. The 1,350 parts cancel: 62,350 − 1,350 leaves 61,000.
        - |
          True. 47 thousands + 3 thousands = 50 thousands.
        - |
          False. 80,402 − 30,402 is 50,000. The 5 is in the ten thousands place, not the thousands place.
      answer: [0, 2, 3]

    - slug: g4math-w13-q08
      type: fill_blank
      topic_code: "4.NBT.B.4"
      source: "IM K–5 Math Grade 4, Unit 4, Section D"
      points: 1
      prompt: |
        The step-by-step way of adding in columns, starting with the ones and regrouping when needed, is called the standard ____.
      answer: ["algorithm", "algorithms"]
      explanation: |
        An algorithm is a set of steps that always works. The standard algorithm adds or subtracts one place at a time, from the ones to the left.

    - slug: g4math-w13-q09
      type: true_false
      topic_code: "4.NBT.B.4"
      source: "IM K–5 Math Grade 4, Unit 4, Section D"
      points: 1
      prompt: |
        True or false: you can check 6,213 − 2,874 = 3,339 by adding 3,339 + 2,874 and seeing if the sum is 6,213.
      answer: true
      explanation: |
        True. Addition undoes subtraction. 3,339 + 2,874 = 6,213, so the subtraction is right.

    - slug: g4math-w13-q10
      type: multiple_choice
      topic_code: "4.NBT.B.4"
      source: "IM K–5 Math Grade 4, Unit 4, Section D"
      points: 1
      prompt: |
        A library had 12,450 books. It gave away 1,875 old books and then bought 2,300 new books. How many books does it have now?
      options:
        - "16,625"
        - "10,575"
        - "8,275"
        - "12,875"
      option_explanations:
        - |
          16,625 adds all three numbers. The books given away should be subtracted, not added.
        - |
          10,575 is the number after giving books away (12,450 − 1,875). The library then bought 2,300 more.
        - |
          8,275 subtracts both numbers. The 2,300 new books were bought, so they are added.
        - |
          Correct. 12,450 − 1,875 = 10,575, and then 10,575 + 2,300 = 12,875.
      answer: 3

    - slug: g4math-w13-q11
      type: multiple_choice
      topic_code: "4.NBT.A.3"
      source: "IM K–5 Math Grade 4, Unit 4, Section C"
      points: 1
      prompt: |
        Rosa found 41,286 − 18,904 = 32,382. She rounds each number to the nearest ten thousand to check. What does her estimate show?
      options:
        - "Her answer is reasonable, because it is close to 30,000."
        - "Her answer is not reasonable: the estimate is 40,000 − 20,000 = 20,000, far from 32,382."
        - "Her answer is reasonable, because 32,382 rounds to 30,000 and so does 41,286."
        - "The estimate is 60,000, so her answer is much too small."
      option_explanations:
        - |
          30,000 is not the estimate. Rounded, the problem is 40,000 − 20,000, which is 20,000.
        - |
          Correct. 41,286 rounds to 40,000 and 18,904 rounds to 20,000. 20,000 is far from 32,382. The exact answer is 22,382, so Rosa should check her work.
        - |
          41,286 rounds to 40,000, not 30,000. Compare her answer with the estimate of the whole problem, 20,000.
        - |
          60,000 adds the rounded numbers. The problem is a subtraction, so the estimate is 40,000 − 20,000.
      answer: 1

    - slug: g4math-w13-q12
      type: multiple_choice
      topic_code: "4.NBT.A.2"
      source: "IM K–5 Math Grade 4, Unit 4, Section B"
      points: 1
      prompt: |
        Which number is 10,000 more than 254,618?
      options:
        - "264,618"
        - "255,618"
        - "354,618"
        - "254,628"
      option_explanations:
        - |
          Correct. 10,000 more adds 1 to the ten thousands digit: 5 becomes 6, so 264,618.
        - |
          255,618 is 1,000 more. The thousands digit changed instead of the ten thousands digit.
        - |
          354,618 is 100,000 more. The hundred thousands digit changed.
        - |
          254,628 is only 10 more. The tens digit changed.
      answer: 0

    - slug: g4math-w13-q13
      type: numeric
      topic_code: "4.NF.C.6"
      source: "IM K–5 Math Grade 4, Unit 4, Section A"
      points: 1
      prompt: |
        A ribbon is 1 6/100 meters long. Write its length as a decimal.
      answer: { value: 1.06, tolerance: 0.001 }
      explanation: |
        1 whole, 0 tenths and 6 hundredths: 1.06 meters. The 0 holds the tenths place.

    - slug: g4math-w13-q14
      type: multiple_choice
      topic_code: "4.NF.B.3"
      source: "IM K–5 Math Grade 4, Unit 3, Section B"
      points: 1
      prompt: |
        What is 3 2/6 + 1 3/6?
      options:
        - "4 5/12"
        - "5 5/6"
        - "4 5/6"
        - "3 5/6"
      option_explanations:
        - |
          4 5/12 adds the denominators too. Sixths plus sixths are still sixths: 2/6 + 3/6 = 5/6.
        - |
          5 5/6 adds an extra whole. 3 + 1 = 4 wholes, and 5/6 is less than one whole, so nothing more to add.
        - |
          Correct. Add the wholes: 3 + 1 = 4. Add the sixths: 2/6 + 3/6 = 5/6. Together: 4 5/6.
        - |
          3 5/6 forgets the whole number 1 in 1 3/6. The wholes add to 4.
      answer: 2

    - slug: g4math-w13-q15
      type: short_answer
      topic_code: "4.NBT.B.4"
      source: "IM K–5 Math Grade 4, Unit 4, Section D"
      points: 2
      prompt: |
        A school collected 3,708 cans in October and 4,596 cans in November.

        (a) How many cans did the school collect in the two months? Show the standard algorithm.
        (b) How many more cans did it collect in November than in October? Show your work.
      answer: |
        (a) 3,708 + 4,596 = 8,304 cans. Ones 8 + 6 = 14 (write 4, regroup 1 ten). Tens 0 + 9 + 1 = 10 (write 0, regroup 1 hundred). Hundreds 7 + 5 + 1 = 13 (write 3, regroup 1 thousand). Thousands 3 + 4 + 1 = 8.
        (b) 4,596 − 3,708 = 888 more cans. Ones 6 − 8: decompose a ten, 16 − 8 = 8. Tens 8 − 0 = 8. Hundreds 5 − 7: decompose a thousand, 15 − 7 = 8. Thousands 3 − 3 = 0. Check: 888 + 3,708 = 4,596.
      explanation: |
        Two points.

        (a) 1 pt: 8,304 with the algorithm shown, including the regrouping.

        (b) 1 pt: 888 with work shown (the algorithm with decomposing, counting up, or a check by adding).
