week: 11
unit: 4
title: "Place Value to a Million"
topics: ["4.NBT.A.1", "4.NBT.A.2"]
guide: guides/week-11.md
guide_description: |
  How the places grow from ones to hundred thousands and on to one million, why a digit is worth ten times as
  much as the same digit one place to its right, and how to read and write big numbers in standard form, word
  form and expanded form.
flashcards_description: |
  19 cards on the names of the places to one million, the ten times rule, how many tens, hundreds or thousands
  make a bigger number, the value of a digit, and standard, word and expanded form.

flashcards:
  - front: Place value → what it means
    back: |
      The value of a digit depends on its place. In 5,382 the 5 is worth 5,000, but in 852 the 5 is worth only 50.
    topic_code: "4.NBT.A.1"
  - front: Places in a six-digit number → names from left to right
    back: |
      Hundred thousands, ten thousands, thousands, hundreds, tens, ones. In 352,618 the 3 is in the hundred thousands place.
    topic_code: "4.NBT.A.2"
  - front: Ten times rule → what it says
    back: |
      A digit in one place is worth 10 times as much as the same digit in the place to its right. The 4 in 4,000 is 10 times the 4 in 400.
    topic_code: "4.NBT.A.1"
  - front: 10 hundreds → make
    back: |
      1 thousand. 10 × 100 = 1,000.
    topic_code: "4.NBT.A.1"
  - front: 10 thousands → make
    back: |
      1 ten thousand. 10 × 1,000 = 10,000.
    topic_code: "4.NBT.A.1"
  - front: 10 ten thousands → make
    back: |
      1 hundred thousand. 10 × 10,000 = 100,000.
    topic_code: "4.NBT.A.1"
  - front: 10 hundred thousands → make
    back: |
      1 million. 10 × 100,000 = 1,000,000.
    topic_code: "4.NBT.A.1"
  - front: 1,000,000 → how many thousands
    back: |
      1,000 thousands. One million is a thousand thousands.
    topic_code: "4.NBT.A.1"
  - front: 3,000 → how many tens
    back: |
      300 tens. Each hundred is 10 tens, and 3,000 is 30 hundreds, so 30 × 10 = 300 tens.
    topic_code: "4.NBT.A.1"
  - front: 700 ÷ 70 → answer
    back: |
      10. 700 is 10 times as much as 70, because the 7 moved one place to the left.
    topic_code: "4.NBT.A.1"
  - front: 80,000 and 800 → how many times as much
    back: |
      100 times. Moving two places to the left is × 10 and then × 10 again.
    topic_code: "4.NBT.A.1"
  - front: Standard form → what it is
    back: |
      A number written with digits and commas, like 63,507.
    topic_code: "4.NBT.A.2"
  - front: Word form → what it is
    back: |
      A number written in words, like sixty-three thousand, five hundred seven.
    topic_code: "4.NBT.A.2"
  - front: Expanded form → what it is
    back: |
      A number written as the sum of the values of its digits: 63,507 = 60,000 + 3,000 + 500 + 7.
    topic_code: "4.NBT.A.2"
  - front: Zero in a number like 30,405 → why it matters
    back: |
      A zero holds a place that has nothing in it. Without the zeros, 30,405 would become 345.
    topic_code: "4.NBT.A.2"
  - front: Commas in big numbers → where they go
    back: |
      Count three digits from the right and put a comma, then three more: 1,250,000. The comma comes right after the thousands digit.
    topic_code: "4.NBT.A.2"
  - front: 208,040 → how to read it
    back: |
      Two hundred eight thousand, forty. Read the part before the comma, say "thousand", then read the rest.
    topic_code: "4.NBT.A.2"
  - front: Digit 6 in 846,215 → its value
    back: |
      6,000. The 6 is in the thousands place.
    topic_code: "4.NBT.A.2"
  - front: 500,000 + 4,000 + 20 → standard form
    back: |
      504,020. Zeros fill the ten thousands, hundreds and ones places.
    topic_code: "4.NBT.A.2"

quiz:
  description: |
    15 questions · about 30 minutes · the places to one million, the ten times rule, the value of a digit, and
    standard, word and expanded form, plus review of decimals, comparing fractions and perimeter. Multiple
    choice, select-all, true/false and number answers are graded at once; the fill-in word is matched
    automatically; the short answer is checked by your teacher.
  questions:
    - slug: g4math-w11-q01
      type: multiple_choice
      topic_code: "4.NBT.A.2"
      source: "IM K–5 Math Grade 4, Unit 4, Section B"
      points: 1
      stimulus: |
        Use the place-value chart. It shows the number 472,305.
      figure: figures/w11-place-value-chart.svg
      figure_alt: "A place-value chart with six columns. The headings, left to right, are Hundred thousands, Ten thousands, Thousands, Hundreds, Tens and Ones, with a thicker line between Thousands and Hundreds. The digits under them are 4, 7, 2, 3, 0 and 5."
      prompt: |
        What is the value of the digit 7?
      options:
        - "7,000"
        - "70,000"
        - "700,000"
        - "7"
      option_explanations:
        - |
          7,000 would put the 7 in the thousands place. In 472,305 the thousands digit is 2; the 7 is one place to the left.
        - |
          Correct. The 7 is in the ten thousands place, so it is worth 7 ten thousands, 70,000.
        - |
          700,000 would put the 7 in the hundred thousands place, where the 4 is.
        - |
          7 is the digit itself. Its value depends on its place, and it sits in the ten thousands place.
      answer: 1

    - slug: g4math-w11-q02
      type: multiple_choice
      topic_code: "4.NBT.A.2"
      source: "IM K–5 Math Grade 4, Unit 4, Section B"
      points: 1
      stimulus: |
        Use the place-value chart. It shows the number 472,305.
      prompt: |
        Which shows the number in expanded form?
      options:
        - "400,000 + 70,000 + 2,000 + 300 + 50"
        - "40,000 + 7,000 + 200 + 30 + 5"
        - "4 + 7 + 2 + 3 + 0 + 5"
        - "400,000 + 70,000 + 2,000 + 300 + 5"
      option_explanations:
        - |
          This puts the 5 in the tens place. The chart has 0 tens and 5 ones, so the last part is 5, not 50.
        - |
          Every part here is one place too small. The 4 is in the hundred thousands place, so it is worth 400,000.
        - |
          This adds only the digits, which makes 21. Expanded form adds the value of each digit.
        - |
          Correct. 4 hundred thousands, 7 ten thousands, 2 thousands, 3 hundreds, 0 tens and 5 ones. The zero tens adds nothing, so it can be left out.
      answer: 3

    - slug: g4math-w11-q03
      type: numeric
      topic_code: "4.NBT.A.1"
      source: "IM K–5 Math Grade 4, Unit 4, Section B"
      points: 1
      figure: figures/w11-ten-times.svg
      figure_alt: "Three boxes in a row titled Ten Times as Much. The first box says 500, the second says 5,000 and the third says 50,000. An arrow labeled × 10 goes from the first box to the second, and another arrow labeled × 10 goes from the second to the third."
      prompt: |
        Use the arrows. 50,000 is how many times as much as 500?
      answer: { value: 100, tolerance: 0 }
      explanation: |
        Each arrow is × 10. Two arrows are × 10 and then × 10 again, which is × 100. Check: 500 × 100 = 50,000.

    - slug: g4math-w11-q04
      type: multiple_choice
      topic_code: "4.NBT.A.1"
      source: "IM K–5 Math Grade 4, Unit 4, Section B"
      points: 1
      prompt: |
        In 66,000, the 6 in the ten thousands place is worth how many times as much as the 6 in the thousands place?
      options:
        - "6"
        - "100"
        - "10"
        - "1,000"
      option_explanations:
        - |
          6 is the digit in both places. The question asks how the values compare: 60,000 and 6,000.
        - |
          100 times would be two places apart, like 600,000 and 6,000. These two 6s are side by side.
        - |
          Correct. The left 6 is worth 60,000 and the right 6 is worth 6,000. One place to the left is 10 times as much.
        - |
          1,000 times would need the digits to be three places apart. These are next to each other.
      answer: 2

    - slug: g4math-w11-q05
      type: multiple_choice
      topic_code: "4.NBT.A.2"
      source: "IM K–5 Math Grade 4, Unit 4, Section B"
      points: 1
      prompt: |
        Which is the word form of 208,040?
      options:
        - "two hundred eight thousand, forty"
        - "two hundred eighty thousand, forty"
        - "two hundred eight thousand, four hundred"
        - "twenty thousand, eight hundred forty"
      option_explanations:
        - |
          Correct. The part before the comma is 208, so say "two hundred eight thousand". The part after is 040, which is forty.
        - |
          Two hundred eighty thousand is 280,000. The number has 0 ten thousands and 8 thousands, so it is two hundred eight thousand.
        - |
          Four hundred would put the 4 in the hundreds place (208,400). Here the 4 is in the tens place, so it is forty.
        - |
          Twenty thousand, eight hundred forty is 20,840, a five-digit number. 208,040 has six digits.
      answer: 0

    - slug: g4math-w11-q06
      type: numeric
      topic_code: "4.NBT.A.2"
      source: "IM K–5 Math Grade 4, Unit 4, Section B"
      points: 1
      prompt: |
        Write sixty thousand, four hundred nine in standard form. (Type the digits without a comma.)
      answer: { value: 60409, tolerance: 0 }
      explanation: |
        Sixty thousand is 60,000. Four hundred nine is 409. Together: 60,409. There are 0 thousands and 0 tens, so zeros hold those places.

    - slug: g4math-w11-q07
      type: multi_select
      topic_code: "4.NBT.A.1"
      source: "IM K–5 Math Grade 4, Unit 4, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which statements are true? Select all that apply.
      options:
        - "10 hundreds make 1 thousand."
        - "In 3,333, each 3 is worth 10 times as much as the 3 just to its right."
        - "1,000 tens make 1 million."
        - "800 is 10 times as much as 80."
        - "The 2 in 25,000 is worth 2,000."
      option_explanations:
        - |
          True. 10 groups of 100 make 1,000, because 10 × 100 = 1,000.
        - |
          True. The 3s are worth 3,000, 300, 30 and 3. Each one is 10 times the next one to the right.
        - |
          False. 1,000 tens is 10,000. It takes 100,000 tens to make 1 million.
        - |
          True. 80 × 10 = 800: the 8 moves one place to the left.
        - |
          False. The 2 is in the ten thousands place, so it is worth 20,000.
      answer: [0, 1, 3]

    - slug: g4math-w11-q08
      type: fill_blank
      topic_code: "4.NBT.A.2"
      source: "IM K–5 Math Grade 4, Unit 4, Section B"
      points: 1
      prompt: |
        Writing 35,072 as 30,000 + 5,000 + 70 + 2 shows the number in ____ form.
      answer: ["expanded", "expanded form"]
      explanation: |
        Expanded form writes a number as the sum of the values of its digits. 35,072 is 3 ten thousands, 5 thousands, 0 hundreds, 7 tens and 2 ones.

    - slug: g4math-w11-q09
      type: true_false
      topic_code: "4.NBT.A.1"
      source: "IM K–5 Math Grade 4, Unit 4, Section B"
      points: 1
      prompt: |
        True or false: the 4 in 4,000 is worth 10 times as much as the 4 in 400.
      answer: true
      explanation: |
        True. 400 × 10 = 4,000. The 4 in 4,000 is in the thousands place, one place to the left of the hundreds place.

    - slug: g4math-w11-q10
      type: multiple_choice
      topic_code: "4.NBT.A.1"
      source: "IM K–5 Math Grade 4, Unit 4, Section B"
      points: 1
      prompt: |
        A craft store packs straws in bundles of 10. How many bundles can it make from 3,000 straws?
      options:
        - "30"
        - "3,000"
        - "300"
        - "3"
      option_explanations:
        - |
          30 bundles of 10 is only 300 straws. 3,000 is 10 times as much as 300.
        - |
          3,000 is the number of straws, not the number of bundles of 10.
        - |
          Correct. 3,000 is 30 hundreds, and each hundred is 10 tens, so 3,000 is 300 tens. 300 × 10 = 3,000.
        - |
          3 bundles of 10 is only 30 straws. 3 is the number of thousands, not the number of tens.
      answer: 2

    - slug: g4math-w11-q11
      type: multiple_choice
      topic_code: "4.NF.C.7"
      source: "IM K–5 Math Grade 4, Unit 4, Section A"
      points: 1
      prompt: |
        Which decimal is greater than 0.6?
      options:
        - "0.58"
        - "0.61"
        - "0.06"
        - "0.5"
      option_explanations:
        - |
          0.58 has 5 tenths and 0.6 has 6 tenths, so 0.58 is less than 0.6.
        - |
          Correct. 0.6 = 0.60, and 61 hundredths is one more than 60 hundredths.
        - |
          0.06 is 6 hundredths, which is much less than 6 tenths.
        - |
          0.5 is 5 tenths, which is one tenth less than 0.6.
      answer: 1

    - slug: g4math-w11-q12
      type: numeric
      topic_code: "4.NF.C.6"
      source: "IM K–5 Math Grade 4, Unit 4, Section A"
      points: 1
      prompt: |
        Write 37/100 as a decimal.
      answer: { value: 0.37, tolerance: 0.001 }
      explanation: |
        37 hundredths is 3 tenths and 7 hundredths: 0.37.

    - slug: g4math-w11-q13
      type: multiple_choice
      topic_code: "4.MD.A.3"
      source: "IM K–5 Math Grade 4, Unit 1, Section B"
      points: 1
      prompt: |
        A garden is a rectangle 9 meters long and 4 meters wide. What is its perimeter?
      options:
        - "36 meters"
        - "13 meters"
        - "18 meters"
        - "26 meters"
      option_explanations:
        - |
          36 is 9 × 4, the area in square meters. Perimeter is the distance around: 9 + 4 + 9 + 4.
        - |
          13 meters adds only one length and one width. A rectangle has two of each.
        - |
          18 meters adds the two lengths but leaves out the two widths.
        - |
          Correct. 9 + 4 + 9 + 4 = 26, or 2 × 9 + 2 × 4 = 18 + 8 = 26 meters.
      answer: 3

    - slug: g4math-w11-q14
      type: multiple_choice
      topic_code: "4.NF.A.2"
      source: "IM K–5 Math Grade 4, Unit 2, Section C"
      points: 1
      prompt: |
        Which of these fractions is more than 1/2?
      options:
        - "5/8"
        - "3/8"
        - "2/6"
        - "4/10"
      option_explanations:
        - |
          Correct. Half of 8 is 4, so 4/8 = 1/2. 5/8 is one eighth more than a half.
        - |
          Half of 8 is 4, and 3 is less than 4, so 3/8 is less than 1/2.
        - |
          Half of 6 is 3, so 3/6 = 1/2. 2/6 is less than that.
        - |
          Half of 10 is 5, so 5/10 = 1/2. 4/10 is one tenth less than a half.
      answer: 0

    - slug: g4math-w11-q15
      type: short_answer
      topic_code: "4.NBT.A.1"
      source: "IM K–5 Math Grade 4, Unit 4, Section B"
      points: 2
      prompt: |
        Zara says the 5 in 254,000 is worth 5,000.

        (a) What is the 5 really worth?
        (b) Explain Zara's mistake using place value.
      answer: |
        (a) 50,000.
        (b) In 254,000 the 2 is in the hundred thousands place, the 5 is in the ten thousands place and the 4 is in the thousands place. Zara read the 5 as if it were in the thousands place. One place to the left is worth 10 times as much, so the 5 is worth 5,000 × 10 = 50,000.
      explanation: |
        Two points.

        (a) 1 pt: 50,000.

        (b) 1 pt: names the ten thousands place (for example with a place-value chart or expanded form 200,000 + 50,000 + 4,000) and says Zara used the wrong place.
