  - slug: trig-final-q63
    type: short_answer
    topic_code: "1.6"
    source: "Original item; Common Core HSG-SRT.C.8"
    points: 3
    prompt: |
      (Calculator.) A fishing boat leaves port and sails 18 miles on a bearing of N 52° E (hypothetical).
      (a) How far north of the port is the boat? Give your answer to the nearest hundredth of a mile.
      (b) How far east of the port is the boat? Give your answer to the nearest hundredth of a mile.
      (c) On what bearing must the boat sail to return directly to port? Give it both in the form N/S θ E/W and as a three-digit azimuth.
    answer: |
      (a) The 52° is measured from north, so the northward leg is adjacent to it: 18 cos 52° ≈ 11.08 miles.
      (b) The eastward leg is opposite the 52° angle: 18 sin 52° ≈ 14.18 miles.
      (c) The reverse direction is S 52° W, which is 180° + 52° = 232° as an azimuth.
    explanation: |
      Three points, one per part. (a) 11.08 with cosine used for the northward component. (b) 14.18 with sine used for the eastward component. Swapping sine and cosine in (a) and (b) loses both points but (c) can still earn its point. (c) both forms, S 52° W and 232°; one correct form alone earns no point.
  - slug: trig-final-q64
    type: short_answer
    topic_code: "2.10"
    source: "Original item; Common Core HSF-TF.B.6"
    points: 3
    prompt: |
      Give exact values in (a) and (b), and an algebraic expression in (c).
      (a) cos⁻¹(cos(5π/3))
      (b) sin(tan⁻¹(−2))
      (c) sec(sin⁻¹ x), for −1 < x < 1
    answer: |
      (a) cos(5π/3) = 1/2, and cos⁻¹(1/2) = π/3, which is in [0, π]. So the value is π/3, not 5π/3.
      (b) θ = tan⁻¹(−2) lies in (−π/2, 0). Draw a reference triangle with opposite −2 and adjacent 1; the hypotenuse is √5. sin θ = −2/√5 = −2√5/5.
      (c) θ = sin⁻¹ x has sin θ = x and cos θ = √(1 − x²) ≥ 0, so sec θ = 1/√(1 − x²).
    explanation: |
      Three points, one per part. (a) π/3, with the range [0, π] noted or implied; 5π/3 earns no point. (b) −2√5/5 or −2/√5; the positive value earns no point. (c) 1/√(1 − x²) or an equivalent form such as √(1 − x²)/(1 − x²).
  - slug: trig-final-q65
    type: short_answer
    topic_code: "3.4"
    source: "Original item; Common Core HSF-TF.C.9"
    points: 3
    prompt: |
      sin α = 2/3 with α in Quadrant II, and cos β = 1/4 with β in Quadrant IV.
      (a) Find cos α and sin β exactly.
      (b) Find sin(α + β) exactly.
      (c) Find cos 2α exactly.
    answer: |
      (a) cos α = −√(1 − 4/9) = −√5/3 (negative in Quadrant II). sin β = −√(1 − 1/16) = −√15/4 (negative in Quadrant IV).
      (b) sin(α + β) = sin α cos β + cos α sin β = (2/3)(1/4) + (−√5/3)(−√15/4) = 2/12 + √75/12 = (2 + 5√3)/12.
      (c) cos 2α = 1 − 2 sin²α = 1 − 8/9 = 1/9.
    explanation: |
      Three points, one per part. (a) both values with correct signs. (b) (2 + 5√3)/12 or an equivalent exact form; follow-through from a sign error in (a) earns the point if the formula is used correctly. (c) 1/9 by any form of the double-angle formula.
  - slug: trig-final-q66
    type: short_answer
    topic_code: "5.8"
    source: "Original item; Common Core HSN-CN.B.5 (extension)"
    points: 3
    prompt: |
      Let w = −8 + 8√3 i.
      (a) Write w in trigonometric form, with 0 ≤ θ < 2π.
      (b) Find all four fourth roots of w, in trigonometric form.
      (c) Write the root with the smallest positive argument in the form a + bi.
    answer: |
      (a) |w| = √(64 + 192) = 16. The point (−8, 8√3) is in Quadrant II with reference angle π/3, so θ = 2π/3: w = 16(cos 2π/3 + i sin 2π/3).
      (b) The roots have modulus 16^(1/4) = 2 and arguments (2π/3 + 2πk)/4 = π/6 + kπ/2: 2 cis(π/6), 2 cis(2π/3), 2 cis(7π/6), 2 cis(5π/3).
      (c) 2(cos π/6 + i sin π/6) = 2(√3/2 + i/2) = √3 + i. Check: (√3 + i)⁴ = 16 cis(2π/3) = w.
    explanation: |
      Three points, one per part. (a) modulus 16 and argument 2π/3. (b) all four roots with modulus 2, arguments π/6 apart by π/2; three roots earn no point. (c) √3 + i.
  - slug: trig-final-q67
    type: long_answer
    topic_code: "1.8"
    source: "Original item; Common Core HSF-TF.A.1"
    points: 6
    prompt: |
      A carousel has radius 9 m and turns counterclockwise at a constant rate, making one revolution every 40 seconds. Place the centre at the origin; a rider on the outer edge starts at (9, 0) at t = 0 (hypothetical).

      (A) Find the carousel's angular speed in radians per second, and the rider's linear speed in metres per second (exact, then to the nearest hundredth).

      (B) Find the angle, in radians, that the rider has turned through after 25 seconds. Give the rider's coordinates at that moment exactly, and state the quadrant and the reference angle.

      (C) Find the arc length the rider travels in those 25 seconds and the area of the sector the rider's radius sweeps, each exactly and to the nearest hundredth.
    answer: |
      (A) ω = 2π rad/40 s = π/20 rad/s. v = rω = 9 · π/20 = 9π/20 ≈ 1.41 m/s.
      (B) θ = ωt = (π/20)(25) = 5π/4. Position (9 cos 5π/4, 9 sin 5π/4) = (−9√2/2, −9√2/2). Quadrant III, reference angle π/4.
      (C) s = rθ = 9 · 5π/4 = 45π/4 ≈ 35.34 m. A = ½r²θ = ½ · 81 · 5π/4 = 405π/8 ≈ 159.04 m².
    explanation: |
      Six points.
      (A) 1 point: ω = π/20 rad/s. 1 point: v = 9π/20 ≈ 1.41 m/s (follow-through from a wrong ω).
      (B) 1 point: θ = 5π/4. 1 point: (−9√2/2, −9√2/2) with Quadrant III and reference angle π/4; positive coordinates earn no point.
      (C) 1 point: 45π/4 ≈ 35.34 m. 1 point: 405π/8 ≈ 159.04 m². Answers computed with θ in degrees earn no points in (C).
  - slug: trig-final-q68
    type: long_answer
    topic_code: "2.7"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 6
    prompt: |
      A Ferris wheel is 40 m in diameter and its lowest point is 3 m above the ground. It turns at a constant speed, making one revolution every 8 minutes. A rider boards at the lowest point at t = 0 (hypothetical).

      (A) Write a function h(t) for the rider's height above the ground, in metres, t minutes after boarding. State the amplitude, period and midline.

      (B) Find the rider's height at t = 3 minutes, exactly and to the nearest hundredth of a metre.

      (C) For how many minutes of each revolution is the rider more than 33 m above the ground? Show the equation or inequality you solve.
    answer: |
      (A) Amplitude 20 (the radius), midline h = 3 + 20 = 23, period 8 so b = 2π/8 = π/4. Starting at the minimum: h(t) = 23 − 20 cos(πt/4).
      (B) h(3) = 23 − 20 cos(3π/4) = 23 − 20(−√2/2) = 23 + 10√2 ≈ 37.14 m.
      (C) 23 − 20 cos(πt/4) > 33 gives cos(πt/4) < −1/2. In one cycle, 0 ≤ πt/4 < 2π, this holds for 2π/3 < πt/4 < 4π/3, so 8/3 < t < 16/3. The rider is above 33 m for 16/3 − 8/3 = 8/3 ≈ 2.67 minutes per revolution.
    explanation: |
      Six points.
      (A) 1 point: amplitude 20, period 8 min and midline h = 23. 1 point: a correct equation, such as 23 − 20 cos(πt/4) or 23 + 20 sin(π(t − 2)/4); a function starting at the maximum or the midline earns no point.
      (B) 1 point: 23 + 10√2. 1 point: ≈ 37.14 m.
      (C) 1 point: the inequality cos(πt/4) < −1/2 (or the boundary equation) with boundary times 8/3 and 16/3. 1 point: 8/3 ≈ 2.67 minutes with the reasoning that it is the length of the interval between the boundary times.
  - slug: trig-final-q69
    type: long_answer
    topic_code: "3.11"
    source: "Original item; Common Core HSF-TF.B.7"
    points: 6
    prompt: |
      No calculator. Let g(x) = cos 2x + 3 sin x − 2.

      (A) Verify the identity (1 − cos 2x)/sin 2x = tan x, working on one side only, and state one value of x for which it is not defined.

      (B) Solve g(x) = 0 on [0, 2π). Give exact values.

      (C) Use your work in (B) to solve g(x) ≥ 0 on [0, 2π). Explain how you know.
    answer: |
      (A) (1 − cos 2x)/sin 2x = (1 − (1 − 2 sin²x))/(2 sin x cos x) = 2 sin²x/(2 sin x cos x) = sin x/cos x = tan x. It is not defined where sin 2x = 0, for example x = 0 (or x = π/2, where tan x is also undefined).
      (B) cos 2x = 1 − 2 sin²x, so g(x) = −2 sin²x + 3 sin x − 1 = −(2 sin x − 1)(sin x − 1). g(x) = 0 when sin x = 1/2 (x = π/6, 5π/6) or sin x = 1 (x = π/2). Solutions: π/6, π/2, 5π/6.
      (C) g(x) ≥ 0 means (2 sin x − 1)(sin x − 1) ≤ 0. Since sin x − 1 ≤ 0 always, this holds when 2 sin x − 1 ≥ 0 or sin x = 1, that is sin x ≥ 1/2: x in [π/6, 5π/6]. Check a test point: g(π/3) = −1/2 + 3√3/2 − 2 ≈ 0.10 ≥ 0, and g(0) = −1 < 0.
    explanation: |
      Six points.
      (A) 1 point: a correct chain of equivalent expressions from one side, using a correct form of cos 2x and sin 2x. 1 point: a value where the identity is undefined (any x with sin 2x = 0).
      (B) 1 point: rewriting g as a quadratic in sin x and factoring. 1 point: all three solutions and no extras.
      (C) 1 point: the interval [π/6, 5π/6], endpoints included. 1 point: a valid reason, such as the sign analysis of the factors or test points in each interval.
  - slug: trig-final-q70
    type: long_answer
    topic_code: "4.10"
    source: "Original item; Common Core HSN-VM.A.3"
    points: 6
    prompt: |
      (Calculator.) A plane flies with a heading of 060° and an airspeed of 420 mph. A 45 mph wind blows toward the bearing 150° (hypothetical). Use the x-axis for east and the y-axis for north.

      (A) Write the plane's air velocity and the wind velocity as component vectors, to the nearest hundredth.

      (B) Find the plane's ground speed, to the nearest hundredth of a mph, and its course (the bearing of its actual path), to the nearest tenth of a degree.

      (C) The pilot wants the actual course to be exactly 060°, with the same airspeed and wind. What heading should the pilot fly, to the nearest tenth of a degree, and what will the ground speed be?
    answer: |
      (A) A bearing of 060° is a direction angle of 30°: air velocity 420⟨cos 30°, sin 30°⟩ ≈ ⟨363.73, 210.00⟩. A bearing of 150° is a direction angle of −60°: wind 45⟨cos(−60°), sin(−60°)⟩ ≈ ⟨22.50, −38.97⟩.
      (B) Ground velocity ≈ ⟨386.23, 171.03⟩. Ground speed = √(386.23² + 171.03²) ≈ 422.40 mph (the wind is perpendicular to the heading, so this is √(420² + 45²)). Direction angle tan⁻¹(171.03/386.23) ≈ 23.9°, so the course is 90° − 23.9° = 066.1°.
      (C) The wind is perpendicular to the desired track and pushes the plane to the right, so the pilot turns left by an angle α with 420 sin α = 45: α = sin⁻¹(45/420) ≈ 6.2°. Heading ≈ 060° − 6.2° = 053.8°. Ground speed = √(420² − 45²) ≈ 417.58 mph.
    explanation: |
      Six points.
      (A) 1 point: both vectors with bearings correctly converted to direction angles (swapping sine and cosine earns no point).
      (B) 1 point: ground speed 422.40 mph. 1 point: course 066.1° (a direction angle of 23.9° without conversion to a bearing earns no point).
      (C) 1 point: a correct setup, such as 420 sin α = 45 or components of air velocity plus wind lying along 060°. 1 point: heading 053.8°. 1 point: ground speed 417.58 mph.
