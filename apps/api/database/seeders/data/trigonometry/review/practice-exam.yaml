      sin x = −0.4. The calculator gives sin⁻¹(−0.4) ≈ −0.4115, which is outside [0, 2π). Sine is negative in Quadrants III and IV: x = π + 0.4115 ≈ 3.55 and x = 2π − 0.4115 ≈ 5.87. The larger is 5.87.
  # ---- q44-q46 share the hikers' triangle (degree mode).
  - slug: trig-final-q44
    type: numeric
    topic_code: "4.3"
    source: "Original item; Common Core HSG-SRT.D.10"
    points: 1
    stimulus: |
      Two hikers leave the same trailhead T at the same time (hypothetical). Hiker P walks 4.2 km on a bearing of 040°, and hiker Q walks 5.6 km on a bearing of 115°. Both walk in straight lines over level ground.
    prompt: |
      (Calculator.) To the nearest hundredth of a kilometre, how far apart are the hikers when they stop?
    answer: { value: 6.07, tolerance: 0.01 }
    explanation: |
      The angle at T between bearings 040° and 115° is 75°. By the Law of Cosines, PQ² = 4.2² + 5.6² − 2(4.2)(5.6) cos 75° ≈ 36.825, so PQ ≈ 6.07 km.
  - slug: trig-final-q45
    type: multiple_choice
    topic_code: "4.5"
    source: "Original item; Common Core HSG-SRT.D.11"
    points: 1
    stimulus: |
      Two hikers leave the same trailhead T at the same time (hypothetical). Hiker P walks 4.2 km on a bearing of 040°, and hiker Q walks 5.6 km on a bearing of 115°. Both walk in straight lines over level ground.
    prompt: |
      (Calculator.) To the nearest degree, what is the bearing from hiker P to hiker Q?
    options:
      - "103°"
      - "157°"
      - "63°"
      - "337°"
    option_explanations:
      - |
        This adds the 63° angle at P to the bearing 040°. Angles in the triangle must be measured from the line P→T, whose bearing is 220°.
      - |
        Correct. By the Law of Sines the angle at P is sin⁻¹(5.6 sin 75°/6.068) ≈ 63.0°. From P the bearing back to T is 040° + 180° = 220°; Q lies 63° counterclockwise of that line, so the bearing is 220° − 63° = 157°.
      - |
        63° is the interior angle at P, not a bearing; a bearing is measured clockwise from north.
      - |
        337° is the bearing from Q back to P, the reverse direction (157° + 180°).
    answer: 1
  - slug: trig-final-q46
    type: numeric
    topic_code: "4.4"
    source: "Original item; Common Core HSG-SRT.D.9"
    points: 1
    stimulus: |
      Two hikers leave the same trailhead T at the same time (hypothetical). Hiker P walks 4.2 km on a bearing of 040°, and hiker Q walks 5.6 km on a bearing of 115°. Both walk in straight lines over level ground.
    prompt: |
