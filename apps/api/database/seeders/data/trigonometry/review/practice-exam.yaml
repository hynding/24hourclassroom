  - slug: trig-final-q47
    type: multiple_choice
    topic_code: "4.10"
    source: "Original item; Common Core HSN-VM.A.3"
    points: 1
    prompt: |
      (Calculator.) A 150-lb crate rests on a frictionless ramp inclined at 18° to the horizontal. To the nearest tenth of a pound, what force parallel to the ramp keeps the crate from sliding down?
    options:
      - "142.7 lb"
      - "46.4 lb"
      - "48.7 lb"
      - "150.0 lb"
    option_explanations:
