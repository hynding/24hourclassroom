      - "2.154(cos 7.2 + i sin 7.2)"
      - "2.154(cos 2.894 + i sin 2.894)"
      - "2.154(cos 2.371 + i sin 2.371)"
    option_explanations:
      - |
        This divides the modulus by 3. The modulus of a cube root is the cube root of 10.
      - |
        This multiplies the argument by 3, which is what cubing does. Taking a cube root divides the argument by 3.
      - |
