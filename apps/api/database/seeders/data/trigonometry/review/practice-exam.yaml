  # ---- Part C: select-all, true/false and fill-in (q51-q62).
  - slug: trig-final-q51
    type: multi_select
    topic_code: "1.11"
    source: "Original item; Common Core HSF-TF.A.3"
    points: 2
    partial_credit: true
    prompt: |
      Which of these values are equal to −1/2? Select all that apply.
    options:
      - "sin(7π/6)"
      - "cos(5π/3)"
      - "cos(2π/3)"
      - "sin(4π/3)"
      - "sin(−π/6)"
    option_explanations:
      - |
        Correct. 7π/6 is in Quadrant III with reference angle π/6, and sine is negative there: −1/2.
      - |
        5π/3 is in Quadrant IV, where cosine is positive: cos(5π/3) = +1/2.
      - |
        Correct. 2π/3 is in Quadrant II with reference angle π/3; cosine is negative there: −1/2.
      - |
        4π/3 has reference angle π/3, so sin(4π/3) = −√3/2, not −1/2.
      - |
        Correct. Sine is odd: sin(−π/6) = −sin(π/6) = −1/2.
    answer: [0, 2, 4]
