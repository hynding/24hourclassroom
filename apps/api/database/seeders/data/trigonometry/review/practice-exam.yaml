    source: "Original item; Common Core HSN-VM.A.3 (extension)"
    points: 1
    prompt: |
      (Calculator.) A ball is thrown from a height of 1.5 m at 22 m/s, at 35° above the horizontal: x = (22 cos 35°)t and y = 1.5 + (22 sin 35°)t − 4.9t², in metres. To the nearest tenth of a metre, how far away horizontally does it land?
    answer: { value: 48.5, tolerance: 0.1 }
