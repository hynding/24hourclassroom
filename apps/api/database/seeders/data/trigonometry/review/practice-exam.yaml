  - slug: trig-final-q50
    type: multiple_choice
    topic_code: "5.10"
    source: "Original item; Common Core HSN-VM.A.3 (extension)"
    points: 1
    prompt: |
      (Calculator.) A ball is hit from 3 ft above the ground at 96 ft/s, at 28° above the horizontal: y = 3 + (96 sin 28°)t − 16t². To the nearest foot, what is its maximum height?
