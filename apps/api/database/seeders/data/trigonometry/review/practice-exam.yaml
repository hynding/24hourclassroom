  - slug: trig-final-q48
    type: multiple_choice
    topic_code: "5.8"
    source: "Original item; Common Core HSN-CN.B.5 (extension)"
    points: 1
    prompt: |
      (Calculator.) Which of these is a cube root of 10(cos 2.4 + i sin 2.4), with angles in radians, to three decimal places?
