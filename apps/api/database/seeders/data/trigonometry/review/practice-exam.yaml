        150 cos 18° ≈ 142.7 lb is the component pressing into the ramp (perpendicular to it), not the one pulling down the slope.
      - |
        Correct. The component of the weight along the ramp is 150 sin 18° ≈ 46.4 lb, so a force of that size up the ramp holds the crate.
      - |
        150 tan 18° ≈ 48.7 lb is the horizontal force needed, not a force parallel to the ramp.
      - |
        Only a vertical lift would need the full weight. Along the slope only the component 150 sin 18° has to be balanced.
