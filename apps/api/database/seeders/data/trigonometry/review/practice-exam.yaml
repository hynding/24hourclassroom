  - slug: trig-final-q33
    type: multiple_choice
    topic_code: "5.3"
    source: "Original item; Common Core HSN-CN.B.4 (extension)"
    points: 1
    prompt: |
      Which best describes the graph of r = 2 + 5 cos θ?
    options:
      - "a cardioid"
      - "a limaçon with an inner loop"
      - "a dimpled limaçon"
      - "a convex limaçon"
    option_explanations:
      - |
        A cardioid needs a = b (ratio 1), as in r = 5 + 5 cos θ.
      - |
        Correct. For r = a + b cos θ with a/b = 2/5 < 1, r becomes negative for some θ, which draws an inner loop.
      - |
        A dimple appears when 1 < a/b < 2. Here a/b = 0.4.
      - |
        A convex limaçon needs a/b ≥ 2, as in r = 10 + 5 cos θ.
    answer: 1
  - slug: trig-final-q34
    type: multiple_choice
    topic_code: "5.5"
    source: "Original item; Common Core HSN-CN.B.4"
    points: 1
    prompt: |
      Which is the trigonometric form of −3 − 3i?
    options:
      - "3√2 (cos π/4 + i sin π/4)"
      - "18 (cos 5π/4 + i sin 5π/4)"
      - "3√2 (cos 7π/4 + i sin 7π/4)"
      - "3√2 (cos 5π/4 + i sin 5π/4)"
    option_explanations:
      - |
        tan⁻¹(−3/−3) = tan⁻¹(1) = π/4, but the point (−3, −3) is in Quadrant III, so add π.
      - |
        18 is r² = a² + b². The modulus is its square root, 3√2.
      - |
        7π/4 is in Quadrant IV, where the real part is positive. −3 − 3i has negative real part.
      - |
        Correct. r = √(9 + 9) = 3√2. The point (−3, −3) is in Quadrant III with reference angle π/4, so θ = 5π/4.
    answer: 3
  - slug: trig-final-q35
    type: multiple_choice
    topic_code: "5.6"
    source: "Original item; Common Core HSN-CN.B.5"
    points: 1
    prompt: |
      Let z = 6(cos 5π/6 + i sin 5π/6) and w = 2(cos π/3 + i sin π/3). What is z/w?
    options:
      - "−3i"
      - "12(cos 7π/6 + i sin 7π/6)"
      - "4i"
      - "3i"
    option_explanations:
      - |
        This subtracts the arguments in the wrong order, π/3 − 5π/6 = −π/2.
      - |
        This is the product zw: moduli multiplied and arguments added.
      - |
        This subtracts the moduli, 6 − 2. Moduli are divided in a quotient.
      - |
        Correct. Divide the moduli and subtract the arguments: 3(cos(5π/6 − π/3) + i sin(5π/6 − π/3)) = 3(cos π/2 + i sin π/2) = 3i.
    answer: 3
  - slug: trig-final-q36
    type: multiple_choice
    topic_code: "5.7"
    source: "Original item; Common Core HSN-CN.B.5 (extension)"
    points: 1
    prompt: |
      What is (1 − i)⁶?
    options:
      - "8i"
      - "−8i"
      - "64i"
      - "−8"
    option_explanations:
      - |
        Correct. 1 − i = √2 (cos(−π/4) + i sin(−π/4)). By De Moivre, (√2)⁶ = 8 and 6(−π/4) = −3π/2, which is coterminal with π/2: 8i. Check: (1 − i)² = −2i and (−2i)³ = 8i.
      - |
        −8i is (1 + i)⁶. The argument of 1 − i is −π/4, not π/4.
      - |
        This raises 2 to the sixth. The modulus of 1 − i is √2, and (√2)⁶ = 8.
      - |
        This reads −3π/2 as pointing along the negative real axis. −3π/2 + 2π = π/2 points along the positive imaginary axis.
    answer: 0
  # ---- Part B: calculator (q37-q50). Degree mode wherever an angle is given in degrees; radian mode elsewhere.
  - slug: trig-final-q37
    type: multiple_choice
    topic_code: "1.6"
    source: "Original item; Common Core HSG-SRT.C.8"
    points: 1
    prompt: |
      (Calculator.) From a point on level ground, the angle of elevation to the top of a radio mast is 24°. After walking 50 m straight toward the mast, the angle of elevation is 37°. To the nearest tenth of a metre, how tall is the mast? (Hypothetical.)
    options:
      - "22.3 m"
      - "37.7 m"
      - "11.5 m"
      - "54.4 m"
    option_explanations:
      - |
        22.3 is 50 tan 24°, which treats the 50 m walk as the whole distance to the base.
      - |
        37.7 is 50 tan 37°, which treats 50 m as the distance from the second point to the base. It is about 72 m.
      - |
        11.5 is 50 tan 13°, using the difference of the angles. Tangent of a difference is not a difference of heights.
      - |
        Correct. With x the final distance to the base, h = x tan 37° = (x + 50) tan 24°. So x = 50 tan 24°/(tan 37° − tan 24°) ≈ 72.20 m and h ≈ 72.20 tan 37° ≈ 54.4 m.
    answer: 3
  - slug: trig-final-q38
    type: numeric
    topic_code: "1.8"
    source: "Original item; Common Core HSF-TF.A.1"
    points: 1
    prompt: |
      (Calculator.) A bicycle wheel 28 inches in diameter turns at 310 revolutions per minute. How fast is the bicycle moving, in miles per hour? Give your answer to the nearest tenth. (1 mile = 63,360 inches.)
    answer: { value: 25.8, tolerance: 0.1 }
    explanation: |
      ω = 310 rev/min · 2π = 620π rad/min, and r = 14 in, so v = rω = 8680π ≈ 27,269 in/min. Multiply by 60 for inches per hour and divide by 63,360: 27,269 · 60/63,360 ≈ 25.8 mph. (Using the diameter as the radius doubles the answer.)
  - slug: trig-final-q39
    type: numeric
    topic_code: "2.7"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    prompt: |
      (Calculator.) The depth of water at a pier, in metres, is modelled by d(t) = 2.6 cos(πt/6.2) + 7.1, where t is hours after a high tide (hypothetical). During the first 12.4 hours, for how many hours is the depth greater than 8 m? Give your answer to the nearest hundredth.
    answer: { value: 4.8, tolerance: 0.01 }
    explanation: |
      d(t) > 8 means cos(πt/6.2) > 0.9/2.6 ≈ 0.3462. The cosine is above this value near t = 0 and near t = 12.4, the two ends of the cycle. cos⁻¹(0.3462) ≈ 1.2172 rad, so πt/6.2 < 1.2172 gives t < 2.402, and by symmetry the depth is above 8 m again for the last 2.402 hours. Total ≈ 2 · 2.402 ≈ 4.80 hours. Radian mode is essential.
  - slug: trig-final-q40
    type: multiple_choice
    topic_code: "2.11"
    source: "Original item; Common Core HSF-TF.B.5 (extension)"
    points: 1
    prompt: |
      (Calculator.) A plucked string's displacement is y = 6e^(−0.15t) cos(2t), t in seconds. Its envelope is y = ±6e^(−0.15t). To the nearest tenth of a second, when does the envelope first fall to 1?
    options:
      - "11.9 s"
      - "33.3 s"
      - "5.2 s"
      - "0.8 s"
    option_explanations:
      - |
        Correct. 6e^(−0.15t) = 1 gives e^(−0.15t) = 1/6, so t = ln 6/0.15 ≈ 11.9 s.
      - |
        This solves 6 − 0.15t = 1, treating the decay as linear. The envelope decays exponentially.
      - |
        This uses the common logarithm, log 6/0.15 ≈ 5.2. The base is e, so the natural logarithm is needed: ln 6/0.15 ≈ 11.9.
      - |
        This solves cos(2t) = 0 for the first zero of the displacement. The question asks about the envelope, not the oscillation.
    answer: 0
  - slug: trig-final-q41
    type: multiple_choice
    topic_code: "3.9"
    source: "Original item; Common Core HSF-TF.C.9 (extension)"
    points: 1
    prompt: |
      (Calculator.) 5 sin x − 12 cos x is written as R sin(x + φ) with R > 0 and −π < φ ≤ π. To the nearest hundredth, what are R and φ?
    options:
      - "R = 13, φ ≈ −1.18"
      - "R = 13, φ ≈ 1.18"
      - "R = 13, φ ≈ −0.39"
      - "R = 17, φ ≈ −1.18"
    option_explanations:
      - |
        Correct. R = √(5² + 12²) = 13. Matching R cos φ = 5 and R sin φ = −12 puts φ in Quadrant IV: φ = tan⁻¹(−12/5) ≈ −1.18.
      - |
        This drops the sign: R sin φ = −12 needs a negative sine, so φ is in Quadrant IV.
      - |
        This uses tan φ = −5/12, swapping the coefficients. tan φ = (coefficient of cos x)/(coefficient of sin x) = −12/5.
      - |
        17 is 5 + 12. R = √(a² + b²), the length of the hypotenuse.
    answer: 0
  - slug: trig-final-q42
    type: multiple_choice
    topic_code: "3.12"
    source: "Original item; Common Core HSF-TF.B.7"
    points: 1
    prompt: |
      (Calculator.) To the nearest hundredth, what is the solution set of cos x ≤ 0.3 on [0, 2π)?
    options:
      - "[0, 1.27] ∪ [5.02, 2π)"
      - "[1.27, 4.41]"
      - "[1.27, 5.02]"
      - "(1.27, 5.02)"
    option_explanations:
      - |
        These are the intervals where cos x ≥ 0.3. Test a point: cos π = −1 ≤ 0.3, so x = π belongs.
      - |
        4.41 is π + 1.27, the second-solution rule for tangent-like reflection. For cosine, the second boundary is 2π − 1.27.
      - |
        Correct. cos x = 0.3 at x = cos⁻¹(0.3) ≈ 1.27 and x = 2π − 1.27 ≈ 5.02. Between them cosine is below 0.3, and the boundaries are included because of ≤.
      - |
        With ≤ the boundary points, where cos x = 0.3 exactly, are solutions and must be included.
    answer: 2
  - slug: trig-final-q43
    type: numeric
    topic_code: "3.12"
    source: "Original item; Common Core HSF-TF.B.7"
    points: 1
    prompt: |
