    answer: false
    explanation: |
      False. e^(iπ/2) = cos(π/2) + i sin(π/2) = i. Multiplying by it adds π/2 to the argument, a 90° COUNTERCLOCKWISE rotation; for example 1 · i = i moves from the positive real axis to the positive imaginary axis.
