week: 34
description: |
  A full practice final: 70 questions · about 3 hours · all five units. Part A (questions 1–36, about
  70 minutes) is multiple choice without a calculator. Part B (questions 37–50, about 35 minutes) needs a
  scientific or graphing calculator: multiple choice and numeric entry, in degree mode for the triangle and
  navigation items and any angle given in degrees, radian mode elsewhere. Part C (questions 51–62, about 20 minutes) is select-all,
  true/false and fill-in-the-blank, no calculator. Part D (questions 63–70, about 55 minutes) is free
  response: four short answers worth 3 points and four longer questions worth 6 points, calculator allowed
  only where the question says so. Three question sets share a stimulus: a point on a terminal side, a
  sinusoid given by its extremes, and two hikers' triangle. Multiple choice, select-all, true/false and
  numeric items are graded at once; fill-in-the-blank items are matched automatically; Part D is graded by
  your teacher against the scoring notes.
questions:
  # ---- Part A: no calculator (q01-q36). q01-q03 share a point on a terminal side.
  - slug: trig-final-q01
    type: multiple_choice
    topic_code: "1.9"
    source: "Original item; Common Core HSF-TF.A.2"
    points: 1
    stimulus: |
      The point P(−7, −24) lies on the terminal side of an angle θ in standard position.
    prompt: |
      What is the exact value of cos θ?
    options:
      - "−7/25"
      - "7/25"
      - "−24/25"
      - "−25/7"
    option_explanations:
      - |
        Correct. r = √((−7)² + (−24)²) = √625 = 25, and cos θ = x/r = −7/25.
      - |
        This has the right size but the wrong sign: x = −7 is negative, so cos θ = x/r is negative in Quadrant III.
      - |
        −24/25 is y/r, which is sin θ. Cosine pairs with the x-coordinate.
      - |
        −25/7 is r/x, the reciprocal ratio sec θ, not cos θ.
    answer: 0
  - slug: trig-final-q02
    type: multiple_choice
    topic_code: "1.10"
    source: "Original item; Common Core HSF-TF.A.2"
    points: 1
    stimulus: |
      The point P(−7, −24) lies on the terminal side of an angle θ in standard position.
    prompt: |
      What is the exact value of tan θ?
    options:
      - "−24/7"
      - "7/24"
      - "24/7"
      - "−24/25"
    option_explanations:
      - |
        This gives tangent a negative sign. In Quadrant III x and y are both negative, so y/x is positive: tangent and cotangent are the positive ratios there.
      - |
        7/24 is x/y, which is cot θ. Tangent is y/x.
      - |
        Correct. tan θ = y/x = (−24)/(−7) = 24/7. In Quadrant III both coordinates are negative, so tangent is positive.
      - |
        −24/25 is y/r, the value of sin θ. Tangent divides y by x, not by r.
    answer: 2
  - slug: trig-final-q03
    type: multiple_choice
    topic_code: "1.3"
    source: "Original item; Common Core HSG-SRT.C.6"
    points: 1
    stimulus: |
      The point P(−7, −24) lies on the terminal side of an angle θ in standard position.
    prompt: |
      What is the exact value of csc θ + cot θ?
    options:
      - "4/3"
      - "−4/3"
      - "3/4"
      - "−3/4"
    option_explanations:
      - |
        This takes csc θ as +25/24. Cosecant has the sign of y, and y = −24 is negative.
      - |
        This takes cot θ as −7/24. Cotangent is x/y = (−7)/(−24), a quotient of two negatives, so it is positive.
      - |
        Both signs are flipped: csc θ is negative and cot θ is positive in Quadrant III, so the sum is −25/24 + 7/24.
      - |
        Correct. csc θ = r/y = 25/(−24) = −25/24 and cot θ = x/y = (−7)/(−24) = 7/24, so the sum is −18/24 = −3/4.
    answer: 3
  - slug: trig-final-q04
    type: multiple_choice
    topic_code: "1.1"
    source: "Original item; Common Core HSF-TF.A.1"
    points: 1
    prompt: |
      Which angle is coterminal with −250°?
    options:
      - "110°"
      - "250°"
      - "70°"
      - "−70°"
    option_explanations:
      - |
        Correct. Adding one full turn: −250° + 360° = 110°. Coterminal angles differ by a multiple of 360°.
      - |
        Dropping the minus sign reflects the angle in the x-axis; 250° and −250° end in different quadrants (III and II).
      - |
        70° is the reference angle of −250° (180° − 110°), not an angle with the same terminal side.
      - |
        This adds 180° instead of 360°. A half turn lands on the opposite ray, not the same one.
    answer: 0
  - slug: trig-final-q05
    type: multiple_choice
    topic_code: "1.2"
    source: "Original item; Common Core HSG-SRT.C.6"
    points: 1
    prompt: |
      In a 30°-60°-90° triangle, the leg opposite the 60° angle is 9 units long. How long is the hypotenuse?
    options:
      - "18"
      - "6√3"
      - "9√3"
      - "3√3"
    option_explanations:
      - |
        18 doubles the long leg. The hypotenuse is twice the SHORT leg, the side opposite 30°.
      - |
        Correct. The long leg is √3 times the short leg, so the short leg is 9/√3 = 3√3, and the hypotenuse is twice that, 6√3.
      - |
        This multiplies the long leg by √3 instead of dividing: 9√3 would be the long leg of a triangle whose short leg is 9.
      - |
        3√3 is the short leg, opposite the 30° angle. One more step, doubling it, gives the hypotenuse.
    answer: 1
  - slug: trig-final-q06
    type: multiple_choice
    topic_code: "1.4"
    source: "Original item; Common Core HSG-SRT.C.7"
    points: 1
    prompt: |
      Which expression is equal to sin 28°?
    options:
      - "sin 62°"
      - "cos 28°"
      - "sec 62°"
      - "cos 62°"
    option_explanations:
      - |
        sin 62° is the cosine of 28°, not its sine. The cofunction identity swaps the function as well as the angle.
      - |
        cos 28° ≈ 0.88 while sin 28° ≈ 0.47. The angle must change to its complement when the function changes.
      - |
        sec 62° = 1/cos 62°, the reciprocal of the right answer. Reciprocal and cofunction are different relationships.
      - |
        Correct. Sine and cosine are cofunctions: sin θ = cos(90° − θ), and 90° − 28° = 62°.
    answer: 3
  - slug: trig-final-q07
    type: multiple_choice
    topic_code: "1.8"
    source: "Original item; Common Core HSF-TF.A.1"
    points: 1
    prompt: |
      A sector of a circle of radius 6 cm has a central angle of 5π/6 radians. What is the length of its arc?
    options:
      - "15π cm"
      - "900 cm"
      - "5π/2 cm"
      - "5π cm"
    option_explanations:
      - |
        15π is the sector's area in cm², from A = ½r²θ = ½ · 36 · 5π/6. Arc length is rθ.
      - |
        This uses 150°, the degree measure, in s = rθ. The formula needs the angle in radians.
      - |
        This includes a factor ½ that belongs to the sector area formula, not to s = rθ.
      - |
        Correct. s = rθ = 6 · 5π/6 = 5π cm (about 15.7 cm).
    answer: 3
  # ---- q08-q10 share a sinusoid described by its extremes.
  - slug: trig-final-q08
    type: multiple_choice
    topic_code: "2.2"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    stimulus: |
      A sinusoidal function f (x in radians) has a maximum value of 7 at x = π/3, and its next minimum value, −1, occurs at x = 4π/3.
    prompt: |
      What are the amplitude and the period of f?
    options:
      - "amplitude 8, period 2π"
      - "amplitude 4, period 2π"
      - "amplitude 4, period π"
      - "amplitude 7, period 2π"
    option_explanations:
      - |
        8 is the distance from the maximum to the minimum. Amplitude is half of it, measured from the midline.
      - |
        Correct. Amplitude = (7 − (−1))/2 = 4. A maximum to the next minimum is half a period: 4π/3 − π/3 = π, so the period is 2π.
      - |
        π is the gap from a maximum to the next minimum, which is only half a cycle.
      - |
        7 is the maximum value. Amplitude is the distance from the midline y = 3 to the maximum, 4.
    answer: 1
  - slug: trig-final-q09
    type: multiple_choice
    topic_code: "2.4"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    stimulus: |
      A sinusoidal function f (x in radians) has a maximum value of 7 at x = π/3, and its next minimum value, −1, occurs at x = 4π/3.
    prompt: |
      Which equation could define f?
    options:
      - "f(x) = 4 cos(x + π/3) + 3"
      - "f(x) = 4 cos(x − π/3) + 3"
      - "f(x) = 4 sin(x − π/3) + 3"
      - "f(x) = 4 cos(2x − π/3) + 3"
    option_explanations:
      - |
        x + π/3 shifts the graph LEFT, putting the maximum at x = −π/3. The maximum is at x = +π/3, so the factor is x − π/3.
      - |
        Correct. Midline (7 + (−1))/2 = 3, amplitude 4, period 2π so b = 1, and a cosine starts at its maximum, which is at x = π/3: a shift right of π/3.
      - |
        A sine curve shifted right π/3 is on its midline at x = π/3, rising. f has its maximum there.
      - |
        b = 2 gives period π, so a maximum and the next minimum would be only π/2 apart; here they are π apart. (Its maximum is also at x = π/6.)
    answer: 1
  - slug: trig-final-q10
    type: multiple_choice
    topic_code: "2.3"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    stimulus: |
      A sinusoidal function f (x in radians) has a maximum value of 7 at x = π/3, and its next minimum value, −1, occurs at x = 4π/3.
    prompt: |
      What is the value of f(0)?
    options:
      - "5"
      - "3 + 2√3"
      - "1"
      - "7"
    option_explanations:
      - |
        Correct. f(0) = 4 cos(−π/3) + 3 = 4 · ½ + 3 = 5, since cosine is even.
      - |
        This uses sin(π/3) = √3/2 in place of cos(−π/3) = ½.
      - |
        This takes cos(−π/3) as −½. Cosine is even: cos(−π/3) = cos(π/3) = ½.
      - |
        7 is the maximum value, which f reaches at x = π/3, not at x = 0.
    answer: 0
  - slug: trig-final-q11
    type: multiple_choice
    topic_code: "2.5"
    source: "Original item; Common Core HSF-TF.A.4"
    points: 1
    prompt: |
      What is the period of y = 3 tan(πx/4)?
    options:
      - "8"
      - "4π"
      - "4"
      - "π/4"
    option_explanations:
      - |
        8 is 2π/b, the period formula for sine and cosine. Tangent repeats every π/|b|.
      - |
        This treats b as 1/4 instead of π/4: π ÷ (1/4) = 4π. The coefficient of x is π/4.
      - |
        Correct. The period of tan(bx) is π/|b| = π ÷ (π/4) = 4.
      - |
        π/4 is the coefficient b itself. The period is π divided by b.
    answer: 2
  - slug: trig-final-q12
    type: multiple_choice
    topic_code: "2.6"
    source: "Original item; Common Core HSF-TF.A.4"
    points: 1
    prompt: |
      Which line is a vertical asymptote of the graph of y = sec(2x)?
    options:
      - "x = π/2"
      - "x = π/4"
      - "x = 0"
      - "x = π"
    option_explanations:
      - |
        At x = π/2, cos(2x) = cos π = −1, so sec(2x) = −1: a turning point of the graph, not an asymptote. This is where cos x (not cos 2x) is 0.
      - |
        Correct. sec(2x) = 1/cos(2x), undefined when cos(2x) = 0, that is 2x = π/2 + πn, so x = π/4 + πn/2.
      - |
        At x = 0, sec 0 = 1, the low point of an upward branch. Asymptotes come from zeros of cos(2x), not from zeros of sin(2x).
      - |
        At x = π, cos(2π) = 1 and sec(2π) = 1, a point on the graph.
    answer: 1
  - slug: trig-final-q13
    type: multiple_choice
    topic_code: "2.9"
    source: "Original item; Common Core HSF-TF.B.6"
    points: 1
    prompt: |
      What is the exact value of cos⁻¹(−√2/2)?
    options:
      - "3π/4"
      - "−π/4"
      - "5π/4"
      - "π/4"
    option_explanations:
      - |
        Correct. cos⁻¹ returns an angle in [0, π]; the angle there with cosine −√2/2 is 3π/4.
      - |
        −π/4 lies outside the range [0, π] of inverse cosine; it is in the range of inverse sine, and cos(−π/4) = +√2/2 anyway.
      - |
        cos(5π/4) = −√2/2, but 5π/4 is not in [0, π]. The inverse function returns one value, from its range.
      - |
        cos(π/4) = +√2/2. A negative input to inverse cosine gives an angle in (π/2, π].
    answer: 0
  - slug: trig-final-q14
    type: multiple_choice
    topic_code: "2.10"
    source: "Original item; Common Core HSF-TF.B.6"
    points: 1
    prompt: |
      For −1 < x < 1, which expression is equal to cos(sin⁻¹ x)?
    options:
      - "1/√(1 − x²)"
      - "x/√(1 − x²)"
      - "−√(1 − x²)"
      - "√(1 − x²)"
    option_explanations:
      - |
        This is sec(sin⁻¹ x), the reciprocal of the cosine.
      - |
        This is tan(sin⁻¹ x): opposite x over adjacent √(1 − x²).
      - |
        sin⁻¹ x lies in [−π/2, π/2], Quadrants I and IV, where cosine is never negative, so the negative root is wrong.
      - |
        Correct. Let θ = sin⁻¹ x, so sin θ = x with θ in [−π/2, π/2], where cos θ ≥ 0. Then cos θ = √(1 − sin²θ) = √(1 − x²).
    answer: 3
  - slug: trig-final-q15
    type: multiple_choice
    topic_code: "3.1"
    source: "Original item; Common Core HSF-TF.C.8"
    points: 1
    prompt: |
      Which expression is equivalent to (1 − sin²x) · sec x · tan x, wherever it is defined?
    options:
      - "sin x"
      - "cos x"
      - "tan x"
      - "sin x cos x"
    option_explanations:
      - |
        Correct. 1 − sin²x = cos²x, so the product is cos²x · (1/cos x) · (sin x/cos x) = sin x.
      - |
        This cancels one cos x too few: cos²x is divided by cos x twice, once for sec x and once inside tan x.
      - |
        This drops the factor cos²x, as if 1 − sin²x were 1. It equals cos²x.
      - |
        This forgets the cos x in the denominator of tan x = sin x/cos x.
    answer: 0
  - slug: trig-final-q16
    type: multiple_choice
    topic_code: "3.2"
    source: "Original item; Common Core HSF-TF.C.8"
    points: 1
    prompt: |
      Which expression is equivalent to (cos²x − 1)/(cos x + 1), wherever it is defined?
    options:
      - "1 − cos x"
      - "cos x + 1"
      - "cos x − 1"
      - "sin²x/(cos x + 1)"
    option_explanations:
      - |
        The sign is reversed. Factoring cos²x − 1 gives (cos x − 1)(cos x + 1), and the remaining factor is cos x − 1.
      - |
        This cancels the wrong factor. The denominator cos x + 1 cancels with the matching factor, leaving cos x − 1.
      - |
        Correct. cos²x − 1 is a difference of squares, (cos x − 1)(cos x + 1), and the factor cos x + 1 cancels.
      - |
        cos²x − 1 equals −sin²x, not sin²x: from sin²x + cos²x = 1, cos²x − 1 = −sin²x.
    answer: 2
  - slug: trig-final-q17
    type: multiple_choice
    topic_code: "3.4"
    source: "Original item; Common Core HSF-TF.C.9"
    points: 1
    prompt: |
      What is the exact value of cos 105°?
    options:
      - "(√6 + √2)/4"
      - "(√2 − √6)/4"
      - "(√6 − √2)/4"
      - "(1 + √2)/2"
    option_explanations:
      - |
        This uses + in the cosine sum formula; (√6 + √2)/4 is cos 15°. The formula is cos(α + β) = cos α cos β − sin α sin β.
      - |
        Correct. cos(60° + 45°) = cos 60° cos 45° − sin 60° sin 45° = √2/4 − √6/4. It is negative, as a Quadrant II cosine should be.
      - |
        This is cos 75°, which is positive. 105° is in Quadrant II, where cosine is negative.
      - |
        This adds cos 60° + cos 45°. Cosine does not distribute over a sum of angles.
    answer: 1
  - slug: trig-final-q18
    type: multiple_choice
    topic_code: "3.5"
    source: "Original item; Common Core HSF-TF.C.9"
    points: 1
    prompt: |
      Which expression is equal to sin(x + 3π/2) for every x?
    options:
      - "cos x"
      - "−cos x"
      - "−sin x"
      - "sin x"
    option_explanations:
      - |
        This takes sin(3π/2) as +1. At 3π/2 the unit-circle point is (0, −1), so sin(3π/2) = −1.
      - |
        Correct. sin x cos(3π/2) + cos x sin(3π/2) = sin x · 0 + cos x · (−1) = −cos x.
      - |
        This would be sin(x + π). Adding 3π/2 swaps sine for cosine because cos(3π/2) = 0.
      - |
        Adding 3π/2 is not a full period; only adding 2πn returns sin x.
    answer: 1
  - slug: trig-final-q19
    type: multiple_choice
    topic_code: "3.6"
    source: "Original item; Common Core HSF-TF.C.9"
    points: 1
    prompt: |
      If cos θ = −5/13 and θ is in Quadrant II, what is sin 2θ?
    options:
      - "120/169"
      - "−60/169"
      - "−120/169"
      - "−119/169"
    option_explanations:
      - |
        This takes sin θ or cos θ with the wrong sign. In Quadrant II sine is positive and cosine is negative, so their product is negative.
      - |
        This is sin θ cos θ, missing the factor 2 in sin 2θ = 2 sin θ cos θ.
      - |
        Correct. sin θ = +12/13 in Quadrant II, so sin 2θ = 2 sin θ cos θ = 2(12/13)(−5/13) = −120/169.
      - |
        −119/169 is cos 2θ = 1 − 2 sin²θ = 1 − 288/169. The question asks for sin 2θ.
    answer: 2
  - slug: trig-final-q20
    type: multiple_choice
    topic_code: "3.7"
    source: "Original item; Common Core HSF-TF.C.9 (extension)"
    points: 1
    prompt: |
      What is the exact value of tan(π/8)?
    options:
      - "√2 + 1"
      - "1/2"
      - "√2 − 1"
      - "√(2 − √2)/2"
    option_explanations:
      - |
        √2 + 1 is tan(3π/8). It comes from (1 + cos u)/sin u, which is cot(u/2), not tan(u/2).
      - |
        This halves tan(π/4) = 1. A half-angle value is not half the value; tangent is not linear.
      - |
        Correct. tan(u/2) = (1 − cos u)/sin u with u = π/4: (1 − √2/2)/(√2/2) = 2/√2 − 1 = √2 − 1.
      - |
        This is sin(π/8), from the sine half-angle formula. Tangent needs the tangent half-angle formula.
    answer: 2
  - slug: trig-final-q21
    type: multiple_choice
    topic_code: "3.10"
    source: "Original item; Common Core HSF-TF.B.7"
    points: 1
    prompt: |
      Which describes all solutions of 2 cos x + √3 = 0?
    options:
      - "x = π/6 + 2πn or x = 11π/6 + 2πn, n an integer"
      - "x = 5π/6 + 2πn or x = 7π/6 + 2πn, n an integer"
      - "x = 5π/6 + πn, n an integer"
      - "x = 2π/3 + 2πn or x = 4π/3 + 2πn, n an integer"
    option_explanations:
      - |
        These solve cos x = +√3/2. The equation gives cos x = −√3/2, so the angles are in Quadrants II and III.
      - |
        Correct. cos x = −√3/2 has reference angle π/6 and cosine is negative in Quadrants II and III: 5π/6 and 7π/6, each repeating every 2π.
      - |
        Adding π to 5π/6 gives 11π/6, where cosine is +√3/2. Cosine solutions repeat every 2π, not every π.
      - |
        These solve cos x = −1/2. The reference angle for √3/2 is π/6, not π/3.
    answer: 1
  - slug: trig-final-q22
    type: multiple_choice
    topic_code: "3.11"
    source: "Original item; Common Core HSF-TF.B.7"
    points: 1
    prompt: |
      How many solutions does sin 3x = 1 have on the interval [0, 2π)?
    options:
      - "1"
      - "6"
      - "3"
      - "2"
    option_explanations:
      - |
        This solves sin x = 1. As x covers [0, 2π), the argument 3x covers [0, 6π), three periods, each with one maximum.
      - |
        Six would be right for a value strictly between −1 and 1, which is reached twice per period. The value 1 is the maximum, reached once per period.
      - |
        Correct. 3x = π/2 + 2πn gives x = π/6 + 2πn/3: π/6, 5π/6 and 3π/2 lie in [0, 2π). As x runs over [0, 2π), 3x runs over three full periods.
      - |
        Two solutions per period is the usual count for sine, but 1 is the maximum (one solution per period), and there are three periods.
    answer: 2
  - slug: trig-final-q23
    type: multiple_choice
    topic_code: "4.1"
    source: "Original item; Common Core HSG-SRT.D.10"
    points: 1
    prompt: |
      In triangle ABC, A = 30°, B = 45° and a = 8. What is the exact length of b?
    options:
      - "8√2"
      - "4√2"
      - "12"
      - "16"
    option_explanations:
      - |
        Correct. b/sin B = a/sin A gives b = 8 sin 45°/sin 30° = 8(√2/2)/(1/2) = 8√2.
      - |
        This inverts the ratio: 8 sin 30°/sin 45°. The side opposite the larger angle, B, must be the longer one.
      - |
        This sets up a proportion with the angles themselves, 8 · 45/30. Sides are proportional to the SINES of opposite angles.
      - |
        16 is a/sin A, the common ratio of the triangle. Multiply it by sin B to get b.
    answer: 0
  - slug: trig-final-q24
    type: multiple_choice
    topic_code: "4.2"
    source: "Original item; Common Core HSG-SRT.D.10"
    points: 1
    prompt: |
      In triangle ABC, A = 30°, a = 6 and b = 10. How many triangles fit these measurements?
    options:
      - "No triangle, since a < b"
      - "Exactly one triangle, since a > b sin A"
      - "Exactly one triangle, a right triangle"
      - "Exactly two triangles"
    option_explanations:
      - |
        a < b alone does not rule a triangle out. Compare a with h = b sin A = 5: a = 6 is long enough to reach the base.
      - |
        a > h gives at least one triangle, but when a is also shorter than b it gives two.
      - |
        A right triangle needs a = h exactly, that is a = 5. Here a = 6.
      - |
        Correct. The height is h = b sin A = 10 · ½ = 5. Since h < a < b (5 < 6 < 10), side a can swing to meet the base in two places.
    answer: 3
  - slug: trig-final-q25
    type: multiple_choice
    topic_code: "4.3"
    source: "Original item; Common Core HSG-SRT.D.10"
    points: 1
    prompt: |
      In triangle ABC, a = 3, b = 8 and C = 60°. What is c?
    options:
      - "√97"
      - "√73"
      - "11"
      - "7"
    option_explanations:
      - |
        This adds 2ab cos C instead of subtracting it: 9 + 64 + 24 = 97.
      - |
        This leaves out the −2ab cos C term, which only vanishes when C = 90°.
      - |
        Adding the two sides breaks the triangle inequality: the third side must be less than 3 + 8.
      - |
        Correct. c² = a² + b² − 2ab cos C = 9 + 64 − 48 · ½ = 49, so c = 7.
    answer: 3
  - slug: trig-final-q26
    type: multiple_choice
    topic_code: "4.4"
    source: "Original item; Common Core HSG-SRT.D.9"
    points: 1
    prompt: |
      A triangle has sides of 10 and 12 with an included angle of 150°. What is its area?
    options:
      - "30"
      - "60"
      - "30√3"
      - "−30√3"
    option_explanations:
      - |
        Correct. Area = ½ab sin C = ½ · 10 · 12 · sin 150° = 60 · ½ = 30.
      - |
        60 is ab sin C: the factor ½ in the area formula has been left out.
      - |
        This uses √3/2, which is sin 60° (or −cos 150°). sin 150° = sin 30° = ½.
      - |
        This uses cos 150° = −√3/2. The area formula uses the sine of the included angle, and an area cannot be negative.
    answer: 0
  - slug: trig-final-q27
    type: multiple_choice
    topic_code: "4.7"
    source: "Original item; Common Core HSN-VM.B.4"
    points: 1
    prompt: |
      Let u = ⟨3, −4⟩ and v = ⟨−1, 6⟩. What is |2u + v|?
    options:
      - "29"
      - "10 + √37"
      - "7"
      - "√29"
    option_explanations:
      - |
        29 is the square of the magnitude. |⟨a, b⟩| = √(a² + b²).
      - |
        This adds the magnitudes 2|u| + |v|. Magnitudes add only when the vectors point the same way.
      - |
        7 is |5| + |−2|, the sum of the absolute values of the components, not the length of the vector.
      - |
        Correct. 2u + v = ⟨6 − 1, −8 + 6⟩ = ⟨5, −2⟩, and |⟨5, −2⟩| = √(25 + 4) = √29.
    answer: 3
  - slug: trig-final-q28
    type: multiple_choice
    topic_code: "4.8"
    source: "Original item; Common Core HSN-VM.B.4 (extension)"
    points: 1
    prompt: |
      For what value of k are the vectors ⟨k, 3⟩ and ⟨6, −4⟩ orthogonal?
    options:
      - "−2"
      - "−9/2"
      - "9/2"
      - "2"
    option_explanations:
      - |
        This loses the sign of −4: 6k + 12 = 0. The dot product is 6k − 12.
      - |
        k = −9/2 makes the vectors parallel (k/6 = 3/(−4)), not perpendicular.
      - |
        This pairs mismatched components, k(−4) + 3 · 6 = 0. The dot product multiplies first with first and second with second.
      - |
        Correct. Orthogonal means the dot product is 0: 6k + 3(−4) = 6k − 12 = 0, so k = 2.
    answer: 3
  - slug: trig-final-q29
    type: multiple_choice
    topic_code: "5.1"
    source: "Original item; Common Core HSN-CN.B.4 (extension)"
    points: 1
    prompt: |
      Which polar coordinates name the same point as (3, π/4)?
    options:
      - "(−3, π/4)"
      - "(3, −π/4)"
      - "(−3, 5π/4)"
      - "(3, 5π/4)"
    option_explanations:
      - |
        Negating r alone sends the point through the pole to the opposite side: (−3, π/4) is the reflection of (3, π/4) in the origin.
      - |
        (3, −π/4) is the reflection in the polar axis (the x-axis): it is in Quadrant IV.
      - |
        Correct. Adding π to the angle points the opposite way, and the negative r walks back through the pole to the original point.
      - |
        Turning by π with positive r lands on the opposite ray; this is the point opposite (3, π/4).
    answer: 2
  - slug: trig-final-q30
    type: multiple_choice
    topic_code: "5.2"
    source: "Original item; Common Core HSN-CN.B.4 (extension)"
    points: 1
    prompt: |
      Which polar coordinates (r, θ), with r > 0 and 0 ≤ θ < 2π, name the rectangular point (−2, 2√3)?
    options:
      - "(4, 2π/3)"
      - "(4, 5π/3)"
      - "(16, 2π/3)"
      - "(4, 5π/6)"
    option_explanations:
      - |
        Correct. r = √(4 + 12) = 4. The point is in Quadrant II with reference angle tan⁻¹(√3) = π/3, so θ = π − π/3 = 2π/3.
      - |
        tan⁻¹(−√3) = −π/3, and adding 2π gives 5π/3, a Quadrant IV angle. The point (−2, 2√3) is in Quadrant II.
      - |
        16 is r² = x² + y². Take the square root: r = 4.
      - |
        This uses tan θ = x/y instead of y/x, which gives reference angle π/6.
    answer: 0
  - slug: trig-final-q31
    type: multiple_choice
    topic_code: "5.2"
    source: "Original item; Common Core HSN-CN.B.4 (extension)"
    points: 1
    prompt: |
      Which rectangular equation is equivalent to r = 6 cos θ?
    options:
      - "x² + (y − 3)² = 9"
      - "(x − 6)² + y² = 36"
      - "(x − 3)² + y² = 9"
      - "x = 6"
    option_explanations:
      - |
        This is r = 6 sin θ, a circle centred on the y-axis. Cosine gives x = r cos θ.
      - |
        The circle r = 6 cos θ passes through the pole and has diameter 6, not radius 6.
      - |
        Correct. Multiply by r: r² = 6r cos θ, so x² + y² = 6x; completing the square gives (x − 3)² + y² = 9.
      - |
        x = 6 is r cos θ = 6, i.e. r = 6 sec θ. Here r itself equals 6 cos θ.
    answer: 2
  - slug: trig-final-q32
    type: multiple_choice
    topic_code: "5.3"
    source: "Original item; Common Core HSN-CN.B.4 (extension)"
    points: 1
    prompt: |
      How many petals does the rose r = 5 sin(4θ) have?
    options:
      - "4"
      - "5"
      - "8"
      - "10"
    option_explanations:
      - |
        n petals is the rule for odd n. With n = 4 (even) the rose has 2n petals.
      - |
        5 is the petal length, the maximum of |r|. The number of petals depends on n, not a.
      - |
        Correct. For r = a sin(nθ) with n even, the rose has 2n petals: 2 · 4 = 8.
      - |
        This doubles a = 5. Double n, the coefficient of θ, when it is even.
