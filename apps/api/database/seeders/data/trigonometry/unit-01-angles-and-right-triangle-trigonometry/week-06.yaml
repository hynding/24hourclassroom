week: 6
unit: 1
title: "The Unit Circle and Fundamental Identities"
topics: ["1.11", "1.12"]
guide: guides/week-06.md
guide_description: |
  Why the point at angle θ on the unit circle is (cos θ, sin θ), the special points in degrees and radians
  built from the 30-60-90 and 45-45-90 triangles, periodicity, the even/odd identities, and the reciprocal,
  quotient and three Pythagorean identities used to find values and simplify. Worked examples: the points for
  5π/6, 4π/3 and 7π/4, sin(25π/6), cos(−2π/3) and tan(−π/3), cos θ from sin θ = 0.6 in quadrant II, all
  values from sec θ = −3 in quadrant III, and simplifying sec θ − sin θ tan θ.
flashcards_description: |
  30 cards on unit-circle coordinates, special points in both measures, periodicity, even and odd functions,
  the reciprocal, quotient and Pythagorean identities, finding values with identities and short
  simplifications.

flashcards:
  - front: Point at angle θ on the unit circle → coordinates and why
    back: |
      (cos θ, sin θ). With r = 1, cos θ = x/1 and sin θ = y/1.
    topic_code: "1.11"
  - front: Arc of length θ on the unit circle → angle it subtends
    back: |
      θ radians, since s = rθ and r = 1. Arc length and radian angle are the same number.
    topic_code: "1.11"
  - front: Unit-circle point at π/6 (30°) → coordinates
    back: |
      (√3/2, 1/2). Close to the x-axis, so the x-coordinate is the larger one.
    topic_code: "1.11"
  - front: Unit-circle point at π/3 (60°) → coordinates
    back: |
      (1/2, √3/2). Close to the y-axis, so the y-coordinate is the larger one.
    topic_code: "1.11"
  - front: Unit-circle point at π/4 (45°) → coordinates
    back: |
      (√2/2, √2/2); tan(π/4) = 1.
    topic_code: "1.11"
  - front: Unit-circle point at 5π/6 (150°) → coordinates
    back: |
      Quadrant II, reference angle π/6: (−√3/2, 1/2).
    topic_code: "1.11"
  - front: Unit-circle point at 4π/3 (240°) → coordinates
    back: |
      Quadrant III, reference angle π/3: (−1/2, −√3/2).
    topic_code: "1.11"
  - front: Unit-circle point at 7π/4 (315°) → coordinates
    back: |
      Quadrant IV, reference angle π/4: (√2/2, −√2/2).
    topic_code: "1.11"
  - front: The four angles in [0, 2π) with reference angle π/3 → list
    back: |
      π/3, 2π/3, 4π/3, 5π/3, with points (1/2, √3/2), (−1/2, √3/2), (−1/2, −√3/2), (1/2, −√3/2).
    topic_code: "1.11"
  - front: tan(4π/3) → exact value from the unit circle
    back: |
      (−√3/2)/(−1/2) = √3.
    topic_code: "1.11"
  - front: sin(25π/6) → value using periodicity
    back: |
      25π/6 = 4π + π/6, so sin(25π/6) = sin(π/6) = 1/2.
    topic_code: "1.11"
  - front: Periods of sine, cosine and tangent → values
    back: |
      Sine and cosine: 2π (360°). Tangent: π (180°), since θ and θ + π lie on the same line.
    topic_code: "1.11"
  - front: Range of sin θ and cos θ on the unit circle → interval and reason
    back: |
      [−1, 1]: they are coordinates of points on a circle of radius 1.
    topic_code: "1.11"
  - front: cos(−θ) → even/odd identity
    back: |
      cos(−θ) = cos θ (even). Reflecting across the x-axis keeps x.
    topic_code: "1.12"
  - front: sin(−θ) and tan(−θ) → even/odd identities
    back: |
      sin(−θ) = −sin θ and tan(−θ) = −tan θ (odd). Reflecting across the x-axis negates y.
    topic_code: "1.12"
  - front: cos(−2π/3) → value using symmetry
    back: |
      Cosine is even: cos(2π/3) = −1/2.
    topic_code: "1.12"
  - front: Reciprocal identities → list
    back: |
      csc θ = 1/sin θ, sec θ = 1/cos θ, cot θ = 1/tan θ.
    topic_code: "1.12"
  - front: Quotient identities → list
    back: |
      tan θ = sin θ/cos θ and cot θ = cos θ/sin θ.
    topic_code: "1.12"
  - front: sin²θ + cos²θ = 1 → where it comes from
    back: |
      (cos θ, sin θ) is on x² + y² = 1. Equivalently, x² + y² = r² divided by r².
    topic_code: "1.12"
  - front: 1 + tan²θ = sec²θ → how to derive it
    back: |
      Divide sin²θ + cos²θ = 1 by cos²θ: tan²θ + 1 = sec²θ.
    topic_code: "1.12"
  - front: 1 + cot²θ = csc²θ → how to derive it
    back: |
      Divide sin²θ + cos²θ = 1 by sin²θ: 1 + cot²θ = csc²θ.
    topic_code: "1.12"
  - front: sin θ = 0.6 with θ in quadrant II → cos θ and tan θ
    back: |
      cos²θ = 0.64, and cosine is negative in II: cos θ = −0.8, tan θ = −0.75.
    topic_code: "1.12"
  - front: sec θ = −3 with θ in quadrant III → tan θ
    back: |
      tan²θ = 9 − 1 = 8; tangent is positive in III: tan θ = 2√2.
    topic_code: "1.12"
  - front: cos θ = 5/13 with θ in quadrant IV → sin θ via an identity
    back: |
      sin²θ = 1 − 25/169 = 144/169; sine is negative in IV: sin θ = −12/13.
    topic_code: "1.12"
  - front: sec θ − sin θ tan θ → simplified
    back: |
      (1 − sin²θ)/cos θ = cos²θ/cos θ = cos θ.
    topic_code: "1.12"
  - front: tan θ csc θ → simplified
    back: |
      (sin θ/cos θ)(1/sin θ) = 1/cos θ = sec θ.
    topic_code: "1.12"
  - front: sec²θ − tan²θ → simplified
    back: |
      1, by rearranging 1 + tan²θ = sec²θ.
    topic_code: "1.12"
  - front: Error-spot → "sin(−π/6) = 1/2 because sine of a negative angle is positive"
    back: |
      Sine is odd: sin(−π/6) = −sin(π/6) = −1/2.
    topic_code: "1.12"
  - front: Error-spot → "cos θ = √(1 − sin²θ) for every θ"
    back: |
      The square root gives ±. The positive root is right only where cosine is positive (quadrants I and IV).
    topic_code: "1.12"
  - front: Error-spot → "The point at π/6 on the unit circle is (1/2, √3/2)"
    back: |
      Those are the coordinates for π/3. At π/6 the point is (√3/2, 1/2).
    topic_code: "1.11"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 1.11 and 1.12: unit-circle coordinates,
    exact values in both measures, periodicity, even/odd symmetry and the reciprocal, quotient and Pythagorean
    identities), with about a third reviewing weeks 3–5 (solving right triangles, bearings, radian measure,
    sector area, reference angles and the any-angle definitions). Includes a shared-context set on a point of
    the unit circle. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by
    your teacher against the scoring notes. Items marked (Calculator.) need a calculator; the rest are designed
    to be done by hand.
  questions:
    # ---- Stimulus set: a point on the unit circle (1.11, 1.12)
    - slug: trig-u01-w06-q01
      type: multiple_choice
      topic_code: "1.11"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      stimulus: |
        The point P(−√5/3, 2/3) lies on the unit circle. Let θ be the angle in standard position, with 0 < θ < π, whose terminal side passes through P.
      prompt: |
        What is sin θ?
      options:
        - "−√5/3"
        - "2/3"
        - "−2√5/5"
        - "3/2"
      option_explanations:
        - |
          −√5/3 is the x-coordinate, which is cos θ; sine is the y-coordinate.
        - |
          Correct. On the unit circle the point at angle θ is (cos θ, sin θ), so sin θ is the y-coordinate, 2/3.
        - |
          −2√5/5 is y/x, which is tan θ; on the unit circle sin θ is simply y.
        - |
          3/2 is 1/y = csc θ, and no sine can exceed 1.
      answer: 1
    - slug: trig-u01-w06-q02
      type: multiple_choice
      topic_code: "1.12"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      stimulus: |
        The point P(−√5/3, 2/3) lies on the unit circle. Let θ be the angle in standard position, with 0 < θ < π, whose terminal side passes through P.
      prompt: |
        What is tan θ?
      options:
        - "−√5/2"
        - "2√5/5"
        - "−2/3"
        - "−2√5/5"
      option_explanations:
        - |
          −√5/2 is cos θ/sin θ, which is cot θ; tangent is sin θ/cos θ.
        - |
          The size is right, but sin θ > 0 and cos θ < 0, so their quotient is negative.
        - |
          −2/3 attaches a negative sign to sin θ; tangent divides sin θ by cos θ.
        - |
          Correct. tan θ = sin θ/cos θ = (2/3)/(−√5/3) = −2/√5 = −2√5/5.
      answer: 3
    - slug: trig-u01-w06-q03
      type: multiple_choice
      topic_code: "1.12"
      source: "Original item; Common Core HSF-TF.A.4"
      points: 1
      stimulus: |
        The point P(−√5/3, 2/3) lies on the unit circle. Let θ be the angle in standard position, with 0 < θ < π, whose terminal side passes through P.
      prompt: |
        What is sin(−θ)?
      options:
        - "−2/3"
        - "2/3"
        - "√5/3"
        - "−√5/3"
      option_explanations:
        - |
          Correct. Sine is odd: sin(−θ) = −sin θ = −2/3. The angle −θ ends at P reflected across the x-axis, (−√5/3, −2/3).
        - |
          2/3 treats sine as even; that property belongs to cosine.
        - |
          √5/3 negates cos θ; sin(−θ) is the y-coordinate of the reflected point, not a changed x-coordinate.
        - |
          −√5/3 is cos(−θ) = cos θ, the x-coordinate of the reflected point.
      answer: 0
    - slug: trig-u01-w06-q04
      type: multiple_choice
      topic_code: "1.11"
      source: "Original item; Common Core HSF-TF.A.4"
      points: 1
      stimulus: |
        The point P(−√5/3, 2/3) lies on the unit circle. Let θ be the angle in standard position, with 0 < θ < π, whose terminal side passes through P.
      prompt: |
        Which point on the unit circle corresponds to the angle θ + π?
      options:
        - "(−√5/3, −2/3)"
        - "(√5/3, 2/3)"
        - "(√5/3, −2/3)"
        - "(2/3, −√5/3)"
      option_explanations:
        - |
          This reflects P across the x-axis, which gives the angle −θ, not a half-turn.
        - |
          This reflects P across the y-axis, which gives the angle π − θ.
        - |
          Correct. Adding π is a half-turn, which sends (x, y) to (−x, −y): (√5/3, −2/3).
        - |
          This swaps the coordinates as well as changing signs; a half-turn keeps each coordinate in its place and negates it.
      answer: 2
    # ---- Topics 1.11 and 1.12
    - slug: trig-u01-w06-q05
      type: multiple_choice
      topic_code: "1.11"
      source: "Original item; Common Core HSF-TF.A.3"
      points: 1
      prompt: |
        What is the exact value of cos(4π/3)?
      options:
        - "−√3/2"
        - "1/2"
        - "√3/2"
        - "−1/2"
      option_explanations:
        - |
          −√3/2 is sin(4π/3); the point is (−1/2, −√3/2), and cosine is the x-coordinate.
        - |
          The size is right for reference angle π/3, but 4π/3 is in quadrant III, where cosine is negative.
        - |
          √3/2 is the cosine of π/6; 4π/3 has reference angle π/3, and the sign is wrong as well.
        - |
          Correct. 4π/3 is in quadrant III with reference angle π/3, so its point is (−1/2, −√3/2) and cos(4π/3) = −1/2.
      answer: 3
    - slug: trig-u01-w06-q06
      type: multiple_choice
      topic_code: "1.11"
      source: "Original item; Common Core HSF-TF.A.4"
      points: 1
      prompt: |
        What is the exact value of sin(−7π/4)?
      options:
        - "−√2/2"
        - "√2/2"
        - "−1/2"
        - "1"
      option_explanations:
        - |
          This treats −7π/4 as a quadrant IV angle; rotating 7π/4 clockwise ends in quadrant I.
        - |
          Correct. −7π/4 + 2π = π/4, so −7π/4 is coterminal with π/4 and sin(−7π/4) = sin(π/4) = √2/2.
        - |
          −1/2 belongs to a reference angle of π/6; −7π/4 has reference angle π/4.
        - |
          1 is tan(π/4); the question asks for sine.
      answer: 1
    - slug: trig-u01-w06-q07
      type: multiple_choice
      topic_code: "1.11"
      source: "Original item; Common Core HSF-TF.A.3"
      points: 1
      prompt: |
        Which point on the unit circle corresponds to 5π/6?
      options:
        - "(−√3/2, 1/2)"
        - "(−1/2, √3/2)"
        - "(√3/2, −1/2)"
        - "(−√3/2, −1/2)"
      option_explanations:
        - |
          Correct. 5π/6 (150°) is in quadrant II with reference angle π/6, whose point is (√3/2, 1/2); in quadrant II x is negative.
        - |
          (−1/2, √3/2) is the point for 2π/3, which has reference angle π/3, not π/6.
        - |
          (√3/2, −1/2) is the point for 11π/6, in quadrant IV.
        - |
          (−√3/2, −1/2) is the point for 7π/6, in quadrant III; 5π/6 is above the x-axis.
      answer: 0
    - slug: trig-u01-w06-q08
      type: multiple_choice
      topic_code: "1.12"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        If sin θ = 0.6 and θ is in quadrant II, what is cos θ?
      options:
        - "0.8"
        - "0.4"
        - "−0.8"
        - "−0.64"
      option_explanations:
        - |
          √(1 − 0.36) = 0.8 is the size, but cosine is negative in quadrant II.
        - |
          0.4 = 1 − 0.6 subtracts sine instead of sine squared; the identity is sin²θ + cos²θ = 1.
        - |
          Correct. cos²θ = 1 − 0.36 = 0.64, so cos θ = ±0.8, and quadrant II makes it −0.8.
        - |
          −0.64 is cos²θ with a sign attached; take the square root before choosing the sign.
      answer: 2
    - slug: trig-u01-w06-q09
      type: multiple_choice
      topic_code: "1.12"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        For every θ where both are defined, sec²θ − tan²θ equals which of these?
      options:
        - "−1"
        - "sin²θ"
        - "cos²θ"
        - "1"
      option_explanations:
        - |
          This reverses the order: tan²θ − sec²θ = −1, but sec²θ − tan²θ = 1.
        - |
          sin²θ would come from 1 − cos²θ, a different identity.
        - |
          cos²θ is the reciprocal of sec²θ alone; subtracting tan²θ leaves a constant.
        - |
          Correct. From 1 + tan²θ = sec²θ, subtracting tan²θ gives sec²θ − tan²θ = 1.
      answer: 3
    - slug: trig-u01-w06-q10
      type: multiple_choice
      topic_code: "1.12"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        Which expression equals tan θ · cos θ wherever cos θ ≠ 0?
      options:
        - "sin θ"
        - "1"
        - "sin θ/cos²θ"
        - "cot θ"
      option_explanations:
        - |
          Correct. tan θ · cos θ = (sin θ/cos θ) · cos θ = sin θ.
        - |
          tan θ and cos θ are not reciprocals; cos θ · sec θ is the product equal to 1.
        - |
          This divides by cos θ again instead of cancelling it; multiplying by cos θ removes the denominator.
        - |
          cot θ = cos θ/sin θ; multiplying tangent by cosine does not invert it.
      answer: 0
    - slug: trig-u01-w06-q11
      type: multiple_choice
      topic_code: "1.11"
      source: "Original item; Common Core HSF-TF.A.4"
      points: 1
      prompt: |
        What is the exact value of sin(25π/6)?
      options:
        - "−1/2"
        - "√3/2"
        - "1/2"
        - "−√3/2"
      option_explanations:
        - |
          25π/6 is two full turns plus π/6, which ends in quadrant I, where sine is positive.
        - |
          √3/2 is cos(π/6); the reduced angle is π/6, and sine of π/6 is 1/2.
        - |
          Correct. 25π/6 = 4π + π/6, and sine has period 2π, so sin(25π/6) = sin(π/6) = 1/2.
        - |
          This uses the wrong coordinate and the wrong sign; the angle reduces to π/6 in quadrant I.
      answer: 2
    # ---- Spiral review
    - slug: trig-u01-w06-q12
      type: multiple_choice
      topic_code: "1.10"
      source: "Original item; Common Core HSF-TF.A.3"
      points: 1
      prompt: |
        Which expression has the same value as cos 160°?
      options:
        - "cos 20°"
        - "−cos 20°"
        - "−sin 20°"
        - "cos 340°"
      option_explanations:
        - |
          20° is the reference angle, so the size is right, but 160° is in quadrant II, where cosine is negative.
        - |
          Correct. 160° has reference angle 20° and lies in quadrant II, where cosine is negative, so cos 160° = −cos 20°.
        - |
          The reference-angle rule keeps the same function; switching to sine is only valid for complementary angles.
        - |
          340° is in quadrant IV, where cosine is positive: cos 340° = cos 20°, the opposite sign.
      answer: 1
    - slug: trig-u01-w06-q13
      type: multiple_choice
      topic_code: "1.8"
      source: "Original item; Common Core HSG-C.B.5"
      points: 1
      prompt: |
        A sector of a circle of radius 9 cm has an arc length of 6π cm. What is the area of the sector?
      options:
        - "54π cm²"
        - "2π/3 cm²"
        - "81π cm²"
        - "27π cm²"
      option_explanations:
        - |
          54π is r · s = 9 · 6π, missing the factor ½ in A = ½r²θ = ½rs.
        - |
          2π/3 is the central angle θ = s/r, not the area.
        - |
          81π is the area of the whole circle, πr².
        - |
          Correct. θ = s/r = 6π/9 = 2π/3, so A = ½ · 81 · 2π/3 = 27π ≈ 84.82 cm².
      answer: 3
    - slug: trig-u01-w06-q14
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        (Calculator.) A hypothetical hiker walks 5 km due east and then 3 km due north. To the nearest degree, on what bearing (measured clockwise from north) is she from her starting point?
      options:
        - "059°"
        - "031°"
        - "121°"
        - "301°"
      option_explanations:
        - |
          Correct. Her direction makes tan⁻¹(3/5) ≈ 30.96° with east, so it makes 90° − 30.96° ≈ 59° with north: bearing 059°.
        - |
          31° is the angle above due east; a bearing is measured clockwise from north, so subtract it from 90°.
        - |
          121° points south of east (90° + 31°); she walked north, not south.
        - |
          301° points north-west; this measures 59° counterclockwise from north instead of clockwise.
      answer: 0
    - slug: trig-u01-w06-q15
      type: multi_select
      topic_code: "1.12"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 2
      partial_credit: true
      prompt: |
        Which of these equations are identities, true wherever both sides are defined? Select all that apply.
      options:
        - "sin²θ = 1 − cos²θ"
        - "1 + cot²θ = csc²θ"
        - "tan²θ − 1 = sec²θ"
        - "cos(−θ) = −cos θ"
        - "sin θ · csc θ = 1"
      option_explanations:
        - |
          Correct. This is sin²θ + cos²θ = 1 with cos²θ subtracted from both sides.
        - |
          Correct. Dividing sin²θ + cos²θ = 1 by sin²θ gives 1 + cot²θ = csc²θ.
        - |
          The identity is 1 + tan²θ = sec²θ; at θ = 0 this equation says −1 = 1.
        - |
          Cosine is even, cos(−θ) = cos θ; at θ = 0 this equation says 1 = −1.
        - |
          Correct. csc θ = 1/sin θ, so the product is 1 wherever csc θ is defined.
      answer: [0, 1, 4]
    - slug: trig-u01-w06-q16
      type: multi_select
      topic_code: "1.11"
      source: "Original item; Common Core HSF-TF.A.3"
      points: 2
      partial_credit: true
      prompt: |
        For which angles θ in [0, 2π) is cos θ = −1/2? Select all that apply.
      options:
        - "π/3"
        - "2π/3"
        - "5π/6"
        - "4π/3"
        - "7π/6"
      option_explanations:
        - |
          cos(π/3) = 1/2: the right size, but quadrant I has a positive cosine.
        - |
          Correct. 2π/3 is in quadrant II with reference angle π/3, so its point is (−1/2, √3/2).
        - |
          cos(5π/6) = −√3/2; reference angle π/6 gives the larger coordinate √3/2 on the x-axis side.
        - |
          Correct. 4π/3 is in quadrant III with reference angle π/3, so its point is (−1/2, −√3/2).
        - |
          cos(7π/6) = −√3/2, since 7π/6 has reference angle π/6, not π/3.
      answer: [1, 3]
    - slug: trig-u01-w06-q17
      type: true_false
      topic_code: "1.4"
      source: "Original item; Common Core HSG-SRT.C.7"
      points: 1
      prompt: |
        True or false: tan 40° = cot 50°.
      answer: true
      explanation: |
        True. 40° and 50° are complementary, and tangent and cotangent are cofunctions: tan θ = cot(90° − θ). In a right triangle, the leg opposite 40° is adjacent to 50°, so both ratios are the same fraction of legs.
    - slug: trig-u01-w06-q18
      type: true_false
      topic_code: "1.7"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 1
      prompt: |
        True or false: An angle of 1 radian is larger than an angle of 60°.
      answer: false
      explanation: |
        False. 1 radian = 180°/π ≈ 57.30°, which is a little less than 60°. (π/3 ≈ 1.047 radians is 60°.)
    - slug: trig-u01-w06-q19
      type: fill_blank
      topic_code: "1.11"
      source: "Original item; Common Core HSF-TF.A.3"
      points: 1
      prompt: |
        The exact value of tan(3π/4) is ____.
      answer: ["-1", "−1", "- 1"]
      explanation: |
        The point for 3π/4 is (−√2/2, √2/2), so tan(3π/4) = (√2/2)/(−√2/2) = −1.
    - slug: trig-u01-w06-q20
      type: fill_blank
      topic_code: "1.10"
      source: "Original item; Common Core HSF-TF.A.3"
      points: 1
      prompt: |
        The reference angle of 250°, in degrees, is ____.
      answer: ["70", "70°", "70 degrees"]
      explanation: |
