    - slug: trig-u01-w06-q23
      type: short_answer
      topic_code: "1.12"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 3
      prompt: |
        sec θ = −3 and θ is in quadrant III. Answer without drawing a triangle, using identities.

        (a) Find cos θ.
        (b) Use 1 + tan²θ = sec²θ to find tan θ exactly, and explain the sign.
        (c) Find sin θ exactly, and check your answer with sin²θ + cos²θ = 1.
      answer: |
        (a) cos θ = 1/sec θ = −1/3.
        (b) tan²θ = sec²θ − 1 = 9 − 1 = 8, so tan θ = ±2√2. Tangent is positive in quadrant III, so tan θ = 2√2.
        (c) sin θ = tan θ · cos θ = 2√2 · (−1/3) = −2√2/3. Check: (−2√2/3)² + (−1/3)² = 8/9 + 1/9 = 1.
      explanation: |
        Three points, one per part. (a) −1/3. (b) 2√2 with the sign justified by quadrant III. (c) −2√2/3 and a correct check; follow-through from an error in (a) or (b) earns this point if the check is carried out correctly.
    - slug: trig-u01-w06-q24
      type: short_answer
      topic_code: "1.9"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 3
      prompt: |
        The terminal side of an angle θ in standard position lies along the line y = −2x, in quadrant II.

        (a) Name a point on the terminal side and find r for that point.
        (b) Find sin θ and cos θ exactly, with rationalised denominators.
        (c) Find tan θ and sec θ exactly.
      answer: |
        (a) In quadrant II x < 0: x = −1 gives y = 2, so (−1, 2) is on the terminal side, with r = √(1 + 4) = √5. (Any point (−k, 2k) with k > 0 works.)
        (b) sin θ = 2/√5 = 2√5/5; cos θ = −1/√5 = −√5/5.
        (c) tan θ = 2/(−1) = −2; sec θ = √5/(−1) = −√5.
      explanation: |
        Three points, one per part. (a) a correct quadrant II point and its r. (b) both values with correct signs, rationalised. (c) tan θ = −2 and sec θ = −√5.
    - slug: trig-u01-w06-q25
      type: long_answer
      topic_code: "1.11"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 6
      prompt: |
        A marker starts at (1, 0) and moves counterclockwise around the unit circle. After it has travelled an arc of length t (for negative t, it moves clockwise), its position is P(t) = (cos t, sin t).

        (A) (i) Find the exact coordinates of P(5π/6) and P(7π/4).
        (ii) Explain why the distance travelled, t, is also the radian measure of the angle the marker has turned through.

        (B) (i) Use periodicity to find the exact coordinates of P(26π/3).
        (ii) Find P(π/3) and P(−π/3), and explain how they illustrate that cosine is even and sine is odd.

        (C) At one moment the marker is in quadrant III with sin t = −0.6.
        (i) Use an identity to find cos t and tan t.
        (ii) Show that your values satisfy 1 + tan²t = sec²t.
      answer: |
        (A) (i) P(5π/6) = (−√3/2, 1/2); P(7π/4) = (√2/2, −√2/2).
        (ii) The radian measure of an angle is s/r. On the unit circle r = 1, so an arc of length t subtends an angle of t/1 = t radians.
        (B) (i) 26π/3 = 8π + 2π/3, four full turns plus 2π/3, so P(26π/3) = P(2π/3) = (−1/2, √3/2).
        (ii) P(π/3) = (1/2, √3/2) and P(−π/3) = (1/2, −√3/2). The two points are reflections across the x-axis: the x-coordinates agree, cos(−π/3) = cos(π/3), and the y-coordinates are opposites, sin(−π/3) = −sin(π/3).
        (C) (i) cos²t = 1 − 0.36 = 0.64, and cosine is negative in quadrant III, so cos t = −0.8. tan t = (−0.6)/(−0.8) = 0.75.
        (ii) 1 + 0.75² = 1 + 0.5625 = 1.5625, and sec t = 1/(−0.8) = −1.25, with (−1.25)² = 1.5625. The two sides agree.
      explanation: |
        Six points. (A) 1 point for both points; 1 point for using θ = s/r with r = 1. (B) 1 point for (−1/2, √3/2) with the turns removed; 1 point for both points and a correct link to even cosine and odd sine. (C) 1 point for cos t = −0.8 (sign justified) and tan t = 0.75; 1 point for a correct numerical check of the identity.
