week: 2
unit: 1
title: "The Six Trigonometric Ratios"
topics: ["1.3", "1.4"]
guide: guides/week-02.md
guide_description: |
  Opposite, adjacent and hypotenuse relative to an acute angle; sine, cosine and tangent (SOH-CAH-TOA) and
  their reciprocals cosecant, secant and cotangent; finding all six ratios from a triangle or from one given
  ratio with the Pythagorean theorem; exact values at 30°, 45° and 60° from the special right triangles; and
  the cofunction identities sin θ = cos(90° − θ), tan θ = cot(90° − θ), sec θ = csc(90° − θ). Worked
  examples: all six ratios in a 5-12-13 triangle, the other five from sin θ = 3/7 and from tan θ = 8/15,
  sin 30° · cos 60° + tan² 45°, and the cofunction equation cos(2x + 10°) = sin(x + 20°).
flashcards_description: |
  30 cards on labelling sides, SOH-CAH-TOA, the reciprocal ratios, finding five ratios from one, exact values
  at 30°, 45° and 60°, and cofunctions of complementary angles.

flashcards:
  - front: Opposite, adjacent, hypotenuse → how to label them for an acute angle θ
    back: |
      Hypotenuse: across from the right angle. Opposite: the leg across from θ. Adjacent: the leg that forms θ with the hypotenuse.
    topic_code: "1.3"
  - front: Switching to the other acute angle of the same right triangle → what changes in the labels
    back: |
      Opposite and adjacent swap; the hypotenuse stays the same.
    topic_code: "1.3"
  - front: SOH-CAH-TOA → the three ratios
    back: |
      sin θ = opp/hyp, cos θ = adj/hyp, tan θ = opp/adj.
    topic_code: "1.3"
  - front: csc θ, sec θ, cot θ in terms of sides → definitions
    back: |
      csc θ = hyp/opp, sec θ = hyp/adj, cot θ = adj/opp.
    topic_code: "1.3"
  - front: Reciprocal pairs among the six ratios → which goes with which
    back: |
      sin and csc, cos and sec, tan and cot. Each product is 1; the reciprocal of sine starts with c, the reciprocal of cosine with s.
    topic_code: "1.3"
  - front: tan θ in terms of sin θ and cos θ → identity and why
    back: |
      tan θ = sin θ/cos θ: (opp/hyp) ÷ (adj/hyp) = opp/adj, the hypotenuse cancels.
    topic_code: "1.3"
  - front: Possible sizes of sin θ, cos θ, sec θ, csc θ for acute θ → ranges
    back: |
      sin θ and cos θ lie between 0 and 1 (a leg is shorter than the hypotenuse); sec θ and csc θ are greater than 1. tan θ and cot θ can be any positive number.
    topic_code: "1.3"
  - front: Triangle PQR with right angle R, PR = 12, QR = 5, PQ = 13 → six ratios of angle P
    back: |
      sin 5/13, cos 12/13, tan 5/12, csc 13/5, sec 13/12, cot 12/5.
    topic_code: "1.3"
  - front: Given one ratio of an acute angle → steps to find the other five
    back: |
      Sketch a right triangle with those two sides, find the third side by the Pythagorean theorem, then read off the ratios (rationalise if asked).
    topic_code: "1.3"
  - front: Acute θ with sin θ = 3/7 → cos θ and tan θ
    back: |
      Adjacent √(49 − 9) = 2√10. cos θ = 2√10/7, tan θ = 3/(2√10) = 3√10/20.
    topic_code: "1.3"
  - front: Acute θ with tan θ = 8/15 → sin θ and sec θ
    back: |
      Hypotenuse √(64 + 225) = 17. sin θ = 8/17, sec θ = 17/15.
    topic_code: "1.3"
  - front: Acute θ with cos θ = 2/3 → tan θ and csc θ
    back: |
      Opposite √(9 − 4) = √5. tan θ = √5/2, csc θ = 3/√5 = 3√5/5.
    topic_code: "1.3"
  - front: sin, cos, tan of 30° → exact values
    back: |
      sin 30° = 1/2, cos 30° = √3/2, tan 30° = 1/√3 = √3/3.
    hint: 30°-60°-90° triangle with sides 1, √3, 2; the side of 1 is opposite 30°.
    topic_code: "1.3"
  - front: sin, cos, tan of 45° → exact values
    back: |
      sin 45° = cos 45° = 1/√2 = √2/2, and tan 45° = 1.
    topic_code: "1.3"
  - front: sin, cos, tan of 60° → exact values
    back: |
      sin 60° = √3/2, cos 60° = 1/2, tan 60° = √3.
    topic_code: "1.3"
  - front: csc, sec, cot of 30° → exact values
    back: |
      csc 30° = 2, sec 30° = 2/√3 = 2√3/3, cot 30° = √3.
    topic_code: "1.3"
  - front: csc, sec, cot of 60° → exact values
    back: |
      csc 60° = 2√3/3, sec 60° = 2, cot 60° = √3/3.
    topic_code: "1.3"
  - front: csc 45°, sec 45°, cot 45° → exact values
    back: |
      csc 45° = sec 45° = √2, cot 45° = 1.
    topic_code: "1.3"
  - front: sin 30° · cos 60° + tan² 45° → exact value
    back: |
      (1/2)(1/2) + 1² = 1/4 + 1 = 5/4.
    topic_code: "1.3"
  - front: sec² 30° → exact value
    back: |
      sec 30° = 2/√3, so sec² 30° = 4/3.
    topic_code: "1.3"
  - front: Rationalising 1/√3 and 3/(2√10) → results
    back: |
      1/√3 = √3/3 and 3/(2√10) = 3√10/20. Multiply top and bottom by the radical; the value does not change.
    topic_code: "1.3"
  - front: Cofunction identities → the three pairs
    back: |
      sin θ = cos(90° − θ), tan θ = cot(90° − θ), sec θ = csc(90° − θ), and each also with the names swapped.
    topic_code: "1.4"
  - front: Why sin θ = cos(90° − θ) → reason from a right triangle
    back: |
      The acute angles θ and 90° − θ share a triangle; the side opposite θ is adjacent to 90° − θ, so opp/hyp for one is adj/hyp for the other.
    topic_code: "1.4"
  - front: Where the "co" in cosine comes from → meaning
    back: |
      The cosine of θ is the sine of the complement of θ: cos θ = sin(90° − θ).
    topic_code: "1.4"
  - front: tan 72° as a cofunction → rewrite
    back: |
      tan 72° = cot 18°, since 72° + 18° = 90°.
    topic_code: "1.4"
  - front: sec x = csc 35° for acute x → x
    back: |
      Secant and cosecant are cofunctions, so x + 35° = 90° and x = 55°.
    topic_code: "1.4"
  - front: cos(2x + 10°) = sin(x + 20°), acute angles → x
    back: |
      The angles are complementary: 3x + 30° = 90°, so x = 20°. Check: cos 50° = sin 40°.
    topic_code: "1.4"
  - front: Error-spot → "sec θ = 1/sin θ"
    back: |
      Secant is the reciprocal of cosine: sec θ = 1/cos θ. The reciprocal of sine is cosecant.
    topic_code: "1.3"
  - front: Error-spot → "acute θ with sin θ = 3/7 has adjacent side 4"
    back: |
      Subtracting 7 − 3 is not the Pythagorean theorem. The adjacent side is √(7² − 3²) = √40 = 2√10.
    topic_code: "1.3"
  - front: Error-spot → "sin 30° = cos 30°, because sine and cosine are cofunctions"
    back: |
      Cofunctions match at complementary angles: sin 30° = cos 60° = 1/2, while cos 30° = √3/2.
    topic_code: "1.4"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 1.3 and 1.4: the six ratios, finding five from
    one, exact values at 30°, 45° and 60°, and cofunctions), with about 30% reviewing week 1 (coterminal angles,
    DMS, complements, similar right triangles and the special right triangles). Includes a shared-context set
    on an 8-15-17 right triangle. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes. Items marked (Calculator.) need a calculator; the rest are designed to be
    done by hand.
  questions:
    # ---- Stimulus set: an 8-15-17 right triangle (1.3)
    - slug: trig-u01-w02-q01
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      stimulus: |
        Right triangle DEF has its right angle at F, with DF = 15, EF = 8 and hypotenuse DE = 17.
      prompt: |
        What is sin D?
      options:
        - "15/17"
        - "8/15"
        - "8/17"
        - "17/8"
      option_explanations:
        - |
          15/17 is adjacent/hypotenuse for angle D, which is cos D; sine uses the opposite side.
        - |
          8/15 is opposite/adjacent, which is tan D; sine divides by the hypotenuse.
        - |
          Correct. The side opposite D is EF = 8 and the hypotenuse is 17, so sin D = 8/17.
        - |
          17/8 is hypotenuse/opposite, which is csc D, the reciprocal of the sine.
      answer: 2
    - slug: trig-u01-w02-q02
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      stimulus: |
        Right triangle DEF has its right angle at F, with DF = 15, EF = 8 and hypotenuse DE = 17.
      prompt: |
        What is sec E?
      options:
        - "17/8"
        - "17/15"
        - "8/17"
        - "15/8"
      option_explanations:
        - |
          Correct. From E the adjacent leg is EF = 8, so cos E = 8/17 and sec E = 1/cos E = 17/8.
        - |
          17/15 is sec D; from E, the leg DF = 15 is opposite, not adjacent.
        - |
          8/17 is cos E; secant is its reciprocal, hypotenuse over adjacent.
        - |
          15/8 is opposite/adjacent from E, which is tan E, not a ratio involving the hypotenuse.
      answer: 0
    - slug: trig-u01-w02-q03
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      stimulus: |
        Right triangle DEF has its right angle at F, with DF = 15, EF = 8 and hypotenuse DE = 17.
      prompt: |
        What is cot D?
      options:
        - "8/15"
        - "17/15"
        - "15/17"
        - "15/8"
      option_explanations:
        - |
          8/15 is tan D, opposite over adjacent; cotangent is the reciprocal, adjacent over opposite.
        - |
          17/15 is hypotenuse/adjacent, which is sec D, not the cotangent.
        - |
          15/17 is cos D; cotangent compares the two legs and never uses the hypotenuse.
        - |
          Correct. From D the adjacent leg is DF = 15 and the opposite leg is EF = 8, so cot D = 15/8.
      answer: 3
    # ---- Topics 1.3 and 1.4
    - slug: trig-u01-w02-q04
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      prompt: |
        θ is an acute angle with cos θ = 5/9. What is the exact value of tan θ?
      options:
        - "5√14/28"
        - "2√14/5"
        - "2√14/9"
        - "2/5"
      option_explanations:
        - |
          5√14/28 = 5/(2√14) is adjacent/opposite, which is cot θ, the reciprocal of the tangent.
        - |
          Correct. The opposite side is √(81 − 25) = √56 = 2√14, so tan θ = opp/adj = 2√14/5.
        - |
          2√14/9 is opposite/hypotenuse, which is sin θ; tangent divides by the adjacent side 5.
        - |
          This takes √(9 − 5) = 2 for the opposite side; the Pythagorean theorem needs the squares, 81 − 25.
      answer: 1
    - slug: trig-u01-w02-q05
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      prompt: |
        What is the exact value of tan 60° · cos 30°?
      options:
        - "√3/2"
        - "3/2"
        - "3/4"
        - "1/2"
      option_explanations:
        - |
          √3/2 is cos 30° alone; it still has to be multiplied by tan 60° = √3.
        - |
          Correct. tan 60° = √3 and cos 30° = √3/2, so the product is 3/2.
        - |
          3/4 uses sin 60° = √3/2 in place of tan 60° = √3.
        - |
          1/2 uses tan 30° = √3/3 instead of tan 60°: (√3/3)(√3/2) = 1/2.
      answer: 1
    - slug: trig-u01-w02-q06
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; Common Core HSG-SRT.C.7"
      points: 1
      prompt: |
        Which expression is equal to sin 58°?
      options:
        - "cos 58°"
        - "sin 32°"
        - "cos 122°"
        - "cos 32°"
      option_explanations:
        - |
          Sine and cosine of the same acute angle are equal only at 45°; cofunctions match at complementary angles.
        - |
          sin 32° keeps the function and changes the angle; the cofunction identity changes both.
        - |
          122° = 180° − 58° is the supplement; cofunction identities use the complement, 90° − 58°.
        - |
          Correct. 58° + 32° = 90°, and sin θ = cos(90° − θ), so sin 58° = cos 32°.
      answer: 3
    - slug: trig-u01-w02-q07
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; Common Core HSG-SRT.C.7"
      points: 1
      prompt: |
        Both angles are acute and tan(x + 15°) = cot(2x). What is x?
      options:
        - "25°"
        - "15°"
        - "75°"
        - "35°"
      option_explanations:
        - |
          Correct. Tangent and cotangent are cofunctions, so (x + 15°) + 2x = 90°, 3x = 75° and x = 25°. Check: tan 40° = cot 50°.
        - |
          This sets x + 15° = 2x, making the angles equal; cofunctions are equal when the angles are complementary.
        - |
          75° is the value of 3x; divide by 3 to find x.
        - |
          This adds 15° to 90° instead of subtracting it: 3x = 105° gives 35°, and then the angles sum to 120°.
      answer: 0
    - slug: trig-u01-w02-q08
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      prompt: |
        What is the exact value of csc 60°?
      options:
        - "2"
        - "√3/2"
        - "2√3/3"
        - "√3"
      option_explanations:
        - |
          2 is csc 30°, from sin 30° = 1/2; at 60° the sine is √3/2.
        - |
          √3/2 is sin 60° itself; cosecant is its reciprocal.
        - |
          Correct. csc 60° = 1/sin 60° = 2/√3 = 2√3/3.
        - |
          √3 is tan 60°, opposite/adjacent, not hypotenuse/opposite.
      answer: 2
    # ---- Spiral review (week 1)
    - slug: trig-u01-w02-q09
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      prompt: |
        A 45°-45°-90° triangle has legs of length 4√2. How long is its hypotenuse?
      options:
        - "4"
        - "8√2"
        - "4√6"
        - "8"
      option_explanations:
        - |
          4 divides the leg by √2; from a leg to the hypotenuse you multiply by √2.
        - |
          8√2 doubles the leg; doubling is the 30°-60°-90° rule from the short leg, not the 45°-45°-90° rule.
        - |
          4√6 multiplies by √3, the long-leg factor of a 30°-60°-90° triangle.
        - |
          Correct. hypotenuse = leg × √2 = 4√2 × √2 = 4 × 2 = 8.
      answer: 3
    - slug: trig-u01-w02-q10
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; Common Core HSF-TF.A.2 (extension)"
      points: 1
      prompt: |
        Which angle in the interval 0° ≤ θ < 360° is coterminal with 845°?
      options:
        - "125°"
        - "485°"
        - "−235°"
        - "55°"
      option_explanations:
        - |
          Correct. 845° − 2 × 360° = 125°, which ends in quadrant II.
        - |
          485° is coterminal but outside the interval; subtract 360° a second time.
        - |
          −235° is coterminal with 845°, but it is negative, so it is not in 0° ≤ θ < 360°.
        - |
          55° = 180° − 125° is the acute angle to the x-axis, not an angle with the same terminal side.
      answer: 0
    - slug: trig-u01-w02-q11
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; Common Core HSF-TF.A.2 (extension)"
      points: 1
      prompt: |
        What is 64°48′ in decimal degrees?
      options:
        - "64.48°"
        - "64.133°"
        - "64.8°"
        - "64.0133°"
      option_explanations:
        - |
          64.48° copies the minutes as hundredths of a degree; 48 minutes is 48/60 of a degree.
        - |
          This divides 48 by 360 instead of 60; there are 60 minutes in a degree.
        - |
          Correct. 48′ = 48/60 = 0.8°, so 64°48′ = 64.8°.
        - |
          This divides by 3600, which treats the 48 as seconds rather than minutes.
      answer: 2
    - slug: trig-u01-w02-q12
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; Common Core HSF-TF.A.2 (extension)"
      points: 1
      prompt: |
        One acute angle of a right triangle measures 27°18′. What does the other acute angle measure?
      options:
        - "62°82′"
        - "62°42′"
        - "152°42′"
        - "63°18′"
      option_explanations:
        - |
          This borrows 100 minutes from a degree; a degree has 60 minutes, so 90° = 89°60′.
        - |
          Correct. The acute angles are complementary: 89°60′ − 27°18′ = 62°42′.
        - |
          152°42′ is the supplement, 180° − 27°18′; the two acute angles of a right triangle sum to 90°.
        - |
          This subtracts only the degrees, 90 − 27 = 63, and copies the 18′ instead of subtracting it.
      answer: 1
    - slug: trig-u01-w02-q13
      type: multi_select
      topic_code: "1.3"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 2
      partial_credit: true
      prompt: |
        θ is an acute angle with sin θ = 0.6. Which statements about the other ratios of θ are true? Select all that apply.
      options:
        - "cos θ = 0.8"
        - "csc θ = 5/3"
        - "tan θ = 4/3"
        - "sec θ = 1.6"
        - "cos(90° − θ) = 0.6"
      option_explanations:
        - |
          Correct. sin θ = 3/5, so the triangle is 3-4-5 and cos θ = 4/5 = 0.8.
        - |
          Correct. Cosecant is the reciprocal of sine: csc θ = 1/sin θ = 1/0.6 = 5/3.
        - |
          4/3 is adjacent/opposite, which is cot θ; tan θ = opposite/adjacent = 3/4.
        - |
          1.6 adds 1 to 0.6; sec θ = 1/cos θ = 1/0.8 = 1.25.
        - |
          Correct. By the cofunction identity, cos(90° − θ) = sin θ = 0.6.
      answer: [0, 1, 4]
    - slug: trig-u01-w02-q14
      type: multi_select
      topic_code: "1.2"
      source: "Original item; Common Core HSG-SRT.B.5"
      points: 2
      partial_credit: true
      prompt: |
        Which right triangles are similar to a right triangle with legs 3 and 4? Select all that apply.
      options:
        - "A right triangle with legs 6 and 8"
        - "A right triangle with legs 4 and 5"
        - "A right triangle with legs 3 and 5"
        - "A right triangle with hypotenuse 15 and one leg 9"
        - "A right triangle with legs 5 and 6"
      option_explanations:
        - |
          Correct. Every side is doubled (6-8-10 from 3-4-5), so the triangles are similar with scale factor 2.
        - |
          Adding 1 to each leg does not scale the triangle: 4/5 ≠ 3/4, so the angles change.
        - |
          The legs 3 and 5 have ratio 3/5, not 3/4; the 5 of the original is the hypotenuse, not a leg.
        - |
          Correct. The other leg is √(225 − 81) = 12, giving 9-12-15, which is 3-4-5 scaled by 3.
        - |
          5/6 ≠ 3/4, so the legs are not in the same ratio and the acute angles differ.
      answer: [0, 3]
    - slug: trig-u01-w02-q15
      type: true_false
      topic_code: "1.4"
      source: "Original item; Common Core HSG-SRT.C.7"
      points: 1
      prompt: |
        True or false: sin 20° = cos 70°.
      answer: true
      explanation: |
        True. 20° and 70° are complementary, and sin θ = cos(90° − θ). In a right triangle with acute angles 20° and 70°, the side opposite 20° is adjacent to 70°.
    - slug: trig-u01-w02-q16
      type: true_false
      topic_code: "1.2"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      prompt: |
        True or false: A 30°-60°-90° triangle with a short leg of 4 has a long leg of 8.
      answer: false
      explanation: |
        False. The long leg is the short leg times √3, so it is 4√3 ≈ 6.93. The hypotenuse is 8, twice the short leg.
    - slug: trig-u01-w02-q17
      type: fill_blank
      topic_code: "1.3"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      prompt: |
        If θ is acute and tan θ = 2/5, then cot θ = ____.
      answer: ["5/2", "2.5", "2.50", "2.500", "5 / 2"]
      explanation: |
        Cotangent is the reciprocal of tangent: cot θ = 1/(2/5) = 5/2 = 2.5.
    - slug: trig-u01-w02-q18
      type: fill_blank
      topic_code: "1.4"
      source: "Original item; Common Core HSG-SRT.C.7"
      points: 1
      prompt: |
        If sec 50° = csc x and x is acute, then x = ____ degrees.
      answer: ["40", "40°", "40 degrees"]
      explanation: |
        Secant and cosecant are cofunctions: sec θ = csc(90° − θ). So x = 90° − 50° = 40°.
    - slug: trig-u01-w02-q19
      type: numeric
      topic_code: "1.3"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      prompt: |
        (Calculator.) θ is acute and sin θ = 3/7. Find sec θ to the nearest hundredth.
      answer: { value: 1.11, tolerance: 0.01 }
      explanation: |
        The adjacent side is √(49 − 9) = √40, so cos θ = √40/7 and sec θ = 7/√40 ≈ 1.1068, which is 1.11.
    - slug: trig-u01-w02-q20
      type: numeric
      topic_code: "1.1"
      source: "Original item; Common Core HSF-TF.A.2 (extension)"
      points: 1
      prompt: |
        (Calculator.) Convert 12°34′30″ to decimal degrees, to the nearest thousandth of a degree.
      answer: { value: 12.575, tolerance: 0.001 }
      explanation: |
        12 + 34/60 + 30/3600 = 12 + 0.5667 + 0.0083 = 12.575° (exactly 12.575).
    - slug: trig-u01-w02-q21
      type: short_answer
      topic_code: "1.3"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 3
      prompt: |
        θ is an acute angle with cos θ = √5/3.

        (a) Sketch a right triangle for θ and find the exact length of the side opposite θ.
        (b) Find the exact values of sin θ, tan θ and csc θ, with rationalised denominators.
        (c) Find the exact value of sin(90° − θ), and name the identity you used.
      answer: |
        (a) Adjacent √5 and hypotenuse 3, so the opposite side is √(9 − 5) = √4 = 2.
        (b) sin θ = 2/3; tan θ = 2/√5 = 2√5/5; csc θ = 3/2.
        (c) sin(90° − θ) = cos θ = √5/3, by the cofunction identity sin(90° − θ) = cos θ.
      explanation: |
        Three points, one per part. (a) opposite side 2 with a correctly labelled triangle. (b) all three values correct (rationalised tan θ = 2√5/5; accept 2/√5 only with a rationalised form shown). (c) √5/3 with the cofunction identity named or written.
    - slug: trig-u01-w02-q22
      type: short_answer
      topic_code: "1.4"
      source: "Original item; Common Core HSG-SRT.C.7"
      points: 3
      prompt: |
        Answer without a calculator.

        (a) Write cos 27° as the sine of an acute angle.
        (b) Both angles are acute and sin(2x − 5°) = cos(x + 5°). Find x, and check your answer.
        (c) Explain, using a right triangle with acute angles θ and 90° − θ, why tan θ · tan(90° − θ) = 1.
      answer: |
        (a) cos 27° = sin 63°, because 27° + 63° = 90°.
        (b) The angles must be complementary: (2x − 5°) + (x + 5°) = 90°, so 3x = 90° and x = 30°. Check: sin 55° = cos 35°, and 55° + 35° = 90°.
        (c) Call the legs a (opposite θ) and b (adjacent to θ). Then tan θ = a/b. From the other acute angle the roles swap, so tan(90° − θ) = b/a. The product is (a/b)(b/a) = 1. Equivalently, tan(90° − θ) = cot θ = 1/tan θ.
      explanation: |
        Three points, one per part. (a) sin 63°. (b) x = 30° with a check showing the two angles are complementary (55° and 35°). (c) a labelled-triangle argument that the two tangents are reciprocals (or tan(90° − θ) = cot θ with the reason).
    - slug: trig-u01-w02-q23
      type: long_answer
      topic_code: "1.3"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 6
      prompt: |
        A hypothetical roof truss is symmetric. Each half is a right triangle: a horizontal run of 24 ft from the outer wall to the centre, a vertical rise of 7 ft at the centre, and a sloping rafter as the hypotenuse. Let θ be the pitch angle between the rafter and the horizontal, and let φ be the angle between the rafter and the vertical rise at the peak.

        (A) (i) Find the length of the rafter.
        (ii) Write all six trigonometric ratios of θ as fractions.

        (B) (i) Write sin φ and tan φ as fractions.
        (ii) Explain, using the cofunction identities, why sin φ equals one of the ratios of θ, and name which one.

        (C) A builder redesigns the roof with the same 24 ft run but a pitch angle of exactly 30°.
        (i) Find the exact rise at the centre, and its value to the nearest hundredth of a foot.
        (ii) Find the exact rafter length, and its value to the nearest hundredth of a foot.
      answer: |
        (A) (i) √(24² + 7²) = √(576 + 49) = √625 = 25 ft.
        (ii) sin θ = 7/25, cos θ = 24/25, tan θ = 7/24, csc θ = 25/7, sec θ = 25/24, cot θ = 24/7.
        (B) (i) From the peak, the run of 24 ft is opposite φ and the rise of 7 ft is adjacent: sin φ = 24/25, tan φ = 24/7.
        (ii) θ and φ are the two acute angles of a right triangle, so φ = 90° − θ. By the cofunction identity sin(90° − θ) = cos θ, so sin φ = cos θ = 24/25.
        (C) (i) tan 30° = rise/24, so rise = 24 tan 30° = 24/√3 = 8√3 ≈ 13.86 ft. (Equivalently, the run is the long leg of a 30°-60°-90° triangle, so the short leg is 24/√3.)
        (ii) The rafter is the hypotenuse, twice the short leg: 16√3 ≈ 27.71 ft. (Or 24/cos 30° = 48/√3.)
      explanation: |
        Six points. (A) 1 point for 25 ft; 1 point for all six ratios (all six needed). (B) 1 point for sin φ = 24/25 and tan φ = 24/7; 1 point for φ = 90° − θ with the cofunction identity giving sin φ = cos θ. (C) 1 point for 8√3 ≈ 13.86 ft; 1 point for 16√3 ≈ 27.71 ft (accept equivalent exact forms such as 48/√3).
