week: 4
unit: 1
title: "Radian Measure and Circular Motion"
topics: ["1.7", "1.8"]
guide: guides/week-04.md
guide_description: |
  The radian as arc length divided by radius, why a full turn is 2π, converting between degrees and radians
  exactly and as decimals, coterminal angles in radians, arc length s = rθ, sector area A = ½r²θ, and angular
  and linear speed with v = rω and revolutions-per-minute conversions. Worked examples: converting 150°, −225°,
  7π/4 and 2.5 radians, arcs on circles of radius 12 cm and 9 m, a sprinkler's watered area, the angle from an
  arc of 15 cm, and a bicycle's speed from its wheel's rpm.
flashcards_description: |
  30 cards on the definition of a radian, degree–radian conversions, common radian angles, coterminal angles
  in radians, arc length, sector area, angular and linear speed, rpm conversions and the classic errors.

flashcards:
  - front: One radian → what it is geometrically
    back: |
      The central angle whose arc is exactly as long as the radius. Lay the radius along the circle: the angle it spans is 1 radian.
    topic_code: "1.7"
  - front: Radian measure θ = s/r → why it does not depend on the circle
    back: |
      Doubling the radius doubles the arc (the pictures are similar), so the ratio s/r stays the same for a given angle.
    topic_code: "1.7"
  - front: A full turn in radians → value and reason
    back: |
      2π. The arc is the whole circumference 2πr, and 2πr ÷ r = 2π.
    topic_code: "1.7"
  - front: 1 radian in degrees → approximate value
    back: |
      180°/π ≈ 57.30°, a little under 60°.
    topic_code: "1.7"
  - front: Degrees to radians → conversion factor
    back: |
      Multiply by π/180. Example: 150° · π/180 = 5π/6.
    topic_code: "1.7"
  - front: Radians to degrees → conversion factor
    back: |
      Multiply by 180/π. Example: 7π/4 · 180/π = 315°.
    topic_code: "1.7"
  - front: −225° in radians → value
    back: |
      −225 · π/180 = −5π/4. The negative sign (clockwise) carries through the conversion.
    topic_code: "1.7"
  - front: 2.5 radians in degrees → value to the nearest hundredth
    back: |
      2.5 · 180/π ≈ 143.24°.
    topic_code: "1.7"
  - front: π/6, π/4, π/3, π/2 → degree equivalents
    back: |
      30°, 45°, 60°, 90°. Count pieces: 5π/6 = five 30° pieces = 150°; 4π/3 = four 60° pieces = 240°.
    topic_code: "1.7"
  - front: 3π/2 and 2π/3 → degree equivalents
    back: |
      3π/2 = 270° (three quarter-turns); 2π/3 = 120° (two 60° pieces). Easy to swap; check by counting pieces.
    topic_code: "1.7"
  - front: Coterminal angle for 11π/4 in [0, 2π) → value
    back: |
      Subtract 2π = 8π/4: 11π/4 − 8π/4 = 3π/4.
    topic_code: "1.7"
  - front: Coterminal angle for −π/3 in [0, 2π) → value
    back: |
      Add 2π = 6π/3: −π/3 + 6π/3 = 5π/3.
    topic_code: "1.7"
  - front: An angle written with no degree sign → which unit
    back: |
      Radians. "θ = 2" means 2 radians, about 114.6°.
    topic_code: "1.7"
  - front: Arc length formula s = rθ → condition on θ
    back: |
      θ must be in radians. Convert degrees with π/180 first.
    topic_code: "1.8"
  - front: Arc on a circle of radius 12 cm, central angle 2π/3 → length
    back: |
      s = 12 · 2π/3 = 8π ≈ 25.13 cm.
    topic_code: "1.8"
  - front: Arc on a circle of radius 9 m, central angle 40° → length
    back: |
      40° = 2π/9, so s = 9 · 2π/9 = 2π ≈ 6.28 m.
    topic_code: "1.8"
  - front: Sector area formula A = ½r²θ → where it comes from
    back: |
      The sector is the fraction θ/(2π) of the circle, so A = (θ/2π) · πr² = ½r²θ, θ in radians.
    topic_code: "1.8"
  - front: Sprinkler reaching 15 ft, sweeping 120° → watered area
    back: |
      120° = 2π/3; A = ½ · 225 · 2π/3 = 75π ≈ 235.62 ft². Check: a third of 225π.
    topic_code: "1.8"
  - front: Arc 15 cm on a circle of radius 6 cm → central angle
    back: |
      θ = s/r = 15/6 = 2.5 radians (about 143.24°).
    topic_code: "1.8"
  - front: Sector of radius 10 cm with area 40 cm² → central angle
    back: |
      40 = ½ · 100 · θ, so θ = 0.8 radians.
    topic_code: "1.8"
  - front: Angular speed ω → definition and units
    back: |
      Angle turned per unit time, ω = θ/t, in radians per second or radians per minute. Every point of a rigid wheel shares it.
    topic_code: "1.8"
  - front: Linear speed v = rω → meaning
    back: |
      Distance per unit time along the circular path. Points farther from the centre move faster at the same ω.
    topic_code: "1.8"
  - front: rpm to radians per minute → conversion
    back: |
      Multiply by 2π: 180 rpm = 360π radians per minute.
    topic_code: "1.8"
  - front: 45 rpm in radians per second → value
    back: |
      45 · 2π = 90π rad/min; ÷ 60 gives 1.5π ≈ 4.71 rad/s.
    topic_code: "1.8"
  - front: 26-inch bicycle wheel at 180 rpm → bicycle speed
    back: |
      r = 13 in, ω = 360π rad/min, v = 4,680π ≈ 14,702.65 in/min ≈ 13.92 mph (× 60 ÷ 63,360).
    topic_code: "1.8"
  - front: Fan blade 30 cm long at 600 rpm → tip speed
    back: |
      ω = 600 · 2π/60 = 20π rad/s; v = 0.30 · 20π = 6π ≈ 18.85 m/s.
    topic_code: "1.8"
  - front: Doubling the radius at a fixed central angle → effect on arc and sector area
    back: |
      The arc doubles (s = rθ) but the sector area quadruples (A = ½r²θ has r²).
    topic_code: "1.8"
  - front: Error-spot → "An arc of 50° on a circle of radius 6 m is 6 · 50 = 300 m long"
    back: |
      The angle must be in radians: 50° = 5π/18, so s = 6 · 5π/18 = 5π/3 ≈ 5.24 m.
    topic_code: "1.8"
  - front: Error-spot → "A wheel at 30 rpm has angular speed 30 radians per minute"
    back: |
      One revolution is 2π radians, so 30 rpm is 60π ≈ 188.50 radians per minute.
    topic_code: "1.8"
  - front: Error-spot → "A 24-inch wheel turning at ω rad/min moves at 24ω in/min"
    back: |
      24 inches is the diameter. Use the radius: v = 12ω inches per minute.
    topic_code: "1.8"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 1.7 and 1.8: radian measure, conversions,
    coterminal angles in radians, arc length, sector area, angular and linear speed), with about a third
    reviewing weeks 1–3 (degrees and minutes, special right triangles, the six ratios, cofunctions, solving
    right triangles, elevation and bearings). Includes a shared-context set on a carousel. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
    Items marked (Calculator.) need a calculator; the rest are designed to be done by hand.
  questions:
    # ---- Stimulus set: a carousel (1.8)
    - slug: trig-u01-w04-q01
      type: multiple_choice
      topic_code: "1.8"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 1
      stimulus: |
        A hypothetical carousel has a radius of 8 m and turns at a steady 3 revolutions per minute. A rider sits on the outer edge.
      prompt: |
        What is the angular speed of the carousel?
      options:
        - "3π radians per minute"
        - "6π radians per minute"
        - "3 radians per minute"
        - "48π radians per minute"
      option_explanations:
        - |
          This counts each revolution as π radians, which is only half a turn; a full revolution is 2π.
        - |
          Correct. Each revolution is 2π radians, so ω = 3 · 2π = 6π radians per minute.
        - |
          This treats one revolution as one radian. A revolution is 2π ≈ 6.28 radians, not 1.
        - |
          48π is r · ω, the rider's linear speed in metres per minute, not the angular speed.
      answer: 1
    - slug: trig-u01-w04-q02
      type: multiple_choice
      topic_code: "1.8"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 1
      stimulus: |
        A hypothetical carousel has a radius of 8 m and turns at a steady 3 revolutions per minute. A rider sits on the outer edge.
      prompt: |
        What is the rider's linear speed?
      options:
        - "24π metres per minute"
        - "6π metres per minute"
        - "24 metres per minute"
        - "48π metres per minute"
      option_explanations:
        - |
          This multiplies the radius by 3π, using π radians per revolution instead of 2π, so the result is half the true speed.
        - |
          6π is the angular speed in radians per minute; it has to be multiplied by the radius to give a distance per minute.
        - |
          This multiplies 8 by 3 revolutions without converting revolutions to radians (×2π).
        - |
          Correct. v = rω = 8 · 6π = 48π ≈ 150.80 metres per minute.
      answer: 3
    - slug: trig-u01-w04-q03
      type: multiple_choice
      topic_code: "1.8"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 1
      stimulus: |
        A hypothetical carousel has a radius of 8 m and turns at a steady 3 revolutions per minute. A rider sits on the outer edge.
      prompt: |
        How far does the rider travel along the circle in 20 seconds?
      options:
        - "16π m"
        - "8π m"
        - "960π m"
        - "64π m"
      option_explanations:
        - |
          Correct. 20 seconds is 1/3 of a minute, so the carousel makes 1 revolution, and one circumference is 2π · 8 = 16π ≈ 50.27 m.
        - |
          8π is half a circumference, the distance for half a revolution; in 20 s the carousel makes a full revolution.
        - |
          This multiplies 48π m per minute by 20 as if the time were 20 minutes; convert 20 s to 1/3 minute first.
        - |
          64π is π · 8², the area of the carousel's floor, not a distance travelled.
      answer: 0
    - slug: trig-u01-w04-q04
      type: numeric
      topic_code: "1.8"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 1
      stimulus: |
        A hypothetical carousel has a radius of 8 m and turns at a steady 3 revolutions per minute. A rider sits on the outer edge.
      prompt: |
        (Calculator.) What is the rider's linear speed in kilometres per hour, to the nearest hundredth?
      answer: { value: 9.05, tolerance: 0.01 }
      explanation: |
        v = rω = 8 · 6π = 48π metres per minute ≈ 150.80 m/min. Multiply by 60 for metres per hour (≈ 9,047.79 m/h) and divide by 1,000: about 9.05 km/h.
    # ---- Topics 1.7 and 1.8
    - slug: trig-u01-w04-q05
      type: multiple_choice
      topic_code: "1.7"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 1
      prompt: |
        What is 240° in radians?
      options:
        - "2π/3"
        - "3π/4"
        - "4π/3"
        - "240π"
      option_explanations:
        - |
          2π/3 is 120°, half of 240°; 240° is four 60° pieces, 4 · π/3.
        - |
          3π/4 is 135°; it comes from inverting the fraction 240/180 = 4/3.
        - |
          Correct. 240 · π/180 = 4π/3 (four pieces of π/3 = 60°).
        - |
          This multiplies by π without dividing by 180; the factor is π/180, not π.
      answer: 2
    - slug: trig-u01-w04-q06
      type: multiple_choice
      topic_code: "1.7"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 1
      prompt: |
        Which angle in [0, 2π) is coterminal with 11π/4?
      options:
        - "3π/4"
        - "7π/4"
        - "11π/8"
        - "π/4"
      option_explanations:
        - |
          Correct. Subtract one full turn, 2π = 8π/4: 11π/4 − 8π/4 = 3π/4.
        - |
          This subtracts π (4π/4) instead of 2π; a half-turn leads to the opposite ray, not the same one.
        - |
          Halving an angle does not give a coterminal angle; coterminal angles differ by whole turns of 2π.
        - |
          This subtracts 10π/4 = 5π/2, which is a turn and a quarter, not a whole number of turns.
      answer: 0
    - slug: trig-u01-w04-q07
      type: multiple_choice
      topic_code: "1.8"
      source: "Original item; Common Core HSG-C.B.5"
      points: 1
      prompt: |
        A sector of a circle of radius 6 cm has a central angle of 5π/6. What is its area?
      options:
        - "5π cm²"
        - "30π cm²"
        - "2,700 cm²"
        - "15π cm²"
      option_explanations:
        - |
          5π cm is the arc length rθ = 6 · 5π/6; the area needs ½r²θ.
        - |
          This computes r²θ = 36 · 5π/6 and forgets the factor ½.
        - |
          This uses 150 (the angle in degrees) in ½r²θ; the formula needs radians.
        - |
          Correct. A = ½ · 6² · 5π/6 = ½ · 36 · 5π/6 = 15π ≈ 47.12 cm².
      answer: 3
    - slug: trig-u01-w04-q08
      type: multiple_choice
      topic_code: "1.8"
      source: "Original item; Common Core HSG-C.B.5"
      points: 1
      prompt: |
        An arc 18 cm long lies on a circle of radius 4 cm. What central angle does it subtend?
      options:
        - "72 radians"
        - "4.5 radians"
        - "0.22 radians"
        - "4.5°"
      option_explanations:
        - |
          This multiplies s by r; the formula s = rθ gives θ = s/r, a division.
        - |
          Correct. θ = s/r = 18/4 = 4.5 radians (about 257.8°).
        - |
          This divides r by s; the angle is arc length over radius, 18/4.
        - |
          s/r gives the angle in radians, not degrees; 4.5 radians is about 257.8°.
      answer: 1
    - slug: trig-u01-w04-q09
      type: multiple_choice
      topic_code: "1.8"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 1
      prompt: |
        A hypothetical record turntable spins at 45 revolutions per minute. What is its angular speed in radians per second?
      options:
        - "90π radians per second"
        - "0.75 radians per second"
        - "1.5π radians per second"
        - "45π/60 radians per second"
      option_explanations:
        - |
          90π is the angular speed in radians per minute; divide by 60 to get radians per second.
        - |
          This converts minutes to seconds (45/60) but forgets that each revolution is 2π radians.
        - |
          Correct. 45 · 2π = 90π radians per minute, and 90π/60 = 1.5π ≈ 4.71 radians per second.
        - |
          This uses π radians per revolution; one revolution is 2π, so the result is half the true speed.
      answer: 2
    # ---- Spiral review
    - slug: trig-u01-w04-q10
      type: multiple_choice
      topic_code: "1.5"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        (Calculator.) A right triangle has a hypotenuse of 20 cm and an acute angle of 35°. To the nearest hundredth, how long is the leg opposite the 35° angle?
      options:
        - "11.47 cm"
        - "16.38 cm"
        - "14.00 cm"
        - "34.87 cm"
      option_explanations:
        - |
          Correct. sin 35° = opposite/20, so the opposite leg is 20 sin 35° ≈ 11.47 cm.
        - |
          16.38 cm is 20 cos 35°, the leg adjacent to the 35° angle.
        - |
          14.00 is 20 tan 35°; tangent relates the two legs, not a leg and the hypotenuse.
        - |
          34.87 is 20/sin 35°; a leg is shorter than the hypotenuse, so this cannot be a leg.
      answer: 0
    - slug: trig-u01-w04-q11
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      prompt: |
        For an acute angle θ, sin θ = 5/13. What is sec θ?
      options:
        - "13/5"
        - "12/13"
        - "5/12"
        - "13/12"
      option_explanations:
        - |
          13/5 is csc θ, the reciprocal of sine; secant is the reciprocal of cosine.
        - |
          12/13 is cos θ itself; secant is its reciprocal.
        - |
          5/12 is tan θ, opposite over adjacent; secant is hypotenuse over adjacent.
        - |
          Correct. With opposite 5 and hypotenuse 13 the adjacent side is √(169 − 25) = 12, so cos θ = 12/13 and sec θ = 13/12.
      answer: 3
    - slug: trig-u01-w04-q12
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        (Calculator.) From a point on level ground 40 m from the base of a hypothetical tree, the angle of elevation to the top of the tree is 28°. To the nearest hundredth of a metre, how tall is the tree?
      options:
        - "18.78 m"
        - "75.23 m"
        - "21.27 m"
        - "35.32 m"
      option_explanations:
        - |
          18.78 is 40 sin 28°, which treats the 40 m as the line of sight; 40 m is the horizontal leg.
        - |
          75.23 is 40/tan 28°, which puts the height in the adjacent position instead of opposite.
        - |
          Correct. tan 28° = height/40, so height = 40 tan 28° ≈ 21.27 m.
        - |
          35.32 is 40 cos 28°; cosine relates the horizontal leg to the hypotenuse, not to the height.
      answer: 2
    - slug: trig-u01-w04-q13
      type: multi_select
      topic_code: "1.7"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about radian measure are true? Select all that apply.
      options:
        - "An angle of 1 radian is larger than an angle of 1°."
        - "π radians is a full turn."
        - "An angle of 3 radians is less than a straight angle."
        - "The radian measure of an angle depends on the radius of the circle used to measure it."
        - "5π/6 radians is 150°."
      option_explanations:
        - |
          Correct. 1 radian ≈ 57.3°, so it is much larger than 1°.
        - |
          π radians is 180°, a half-turn; a full turn is 2π.
        - |
          Correct. A straight angle is π ≈ 3.14 radians, and 3 < 3.14.
        - |
          The ratio s/r is the same on every circle centred at the vertex, because a larger circle has a proportionally longer arc.
        - |
          Correct. 5π/6 · 180/π = 5 · 30° = 150°, five pieces of π/6.
      answer: [0, 2, 4]
    - slug: trig-u01-w04-q14
      type: multi_select
      topic_code: "1.2"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 2
      partial_credit: true
      prompt: |
        A 30-60-90 triangle has a shortest side of 5 cm. Which statements are true? Select all that apply.
      options:
        - "The hypotenuse is 5√2 cm."
        - "The hypotenuse is 10 cm."
        - "The longer leg is 5√3 cm."
        - "The longer leg is opposite the 30° angle."
        - "The longer leg is 10√3 cm."
      option_explanations:
        - |
          5√2 is the hypotenuse of a 45-45-90 triangle with leg 5; in a 30-60-90 triangle the hypotenuse is twice the short leg.
        - |
          Correct. The sides are in the ratio 1 : √3 : 2, so the hypotenuse is 2 · 5 = 10 cm.
        - |
          Correct. The longer leg is √3 times the shorter leg: 5√3 ≈ 8.66 cm.
        - |
          The shortest side is opposite the smallest angle, 30°; the longer leg is opposite the 60° angle.
        - |
          10√3 multiplies the hypotenuse by √3; the longer leg is √3 times the shorter leg, 5√3.
      answer: [1, 2]
    - slug: trig-u01-w04-q15
      type: true_false
      topic_code: "1.8"
      source: "Original item; Common Core HSG-C.B.5"
      points: 1
      prompt: |
        True or false: Doubling the radius of a sector while keeping its central angle the same doubles the sector's area.
      answer: false
      explanation: |
        False. A = ½r²θ, so replacing r by 2r multiplies the area by 2² = 4. The arc length s = rθ is the quantity that doubles.
    - slug: trig-u01-w04-q16
      type: true_false
      topic_code: "1.4"
      source: "Original item; Common Core HSG-SRT.C.7"
      points: 1
      prompt: |
        True or false: sin 25° = cos 65°.
      answer: true
      explanation: |
        True. 25° and 65° are complementary, and the sine of an acute angle equals the cosine of its complement: sin θ = cos(90° − θ). In a right triangle, the side opposite 25° is the side adjacent to 65°.
    - slug: trig-u01-w04-q17
      type: fill_blank
      topic_code: "1.7"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 1
      prompt: |
        An angle of π/9 radians measures ____ degrees.
      answer: ["20", "20°", "20 degrees", "20.0"]
      explanation: |
        π/9 · 180/π = 180/9 = 20°.
    - slug: trig-u01-w04-q18
      type: fill_blank
      topic_code: "1.1"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      prompt: |
        Written in degrees and minutes, 47.25° = 47° ____′. (Give the number of minutes.)
      answer: ["15", "15′", "15'", "15 minutes"]
      explanation: |
        One degree is 60 minutes, so 0.25° = 0.25 · 60 = 15′. Therefore 47.25° = 47° 15′.
    - slug: trig-u01-w04-q19
      type: numeric
      topic_code: "1.8"
      source: "Original item; Common Core HSG-C.B.5"
      points: 1
      prompt: |
        (Calculator.) The bob of a hypothetical pendulum 75 cm long swings through an angle of 16°. To the nearest hundredth of a centimetre, how long is the arc the bob traces in one swing?
      answer: { value: 20.94, tolerance: 0.01 }
      explanation: |
        Convert first: 16° = 16π/180 = 4π/45 radians. Then s = rθ = 75 · 4π/45 = 20π/3 ≈ 20.94 cm.
    - slug: trig-u01-w04-q20
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        A hypothetical ship sails 12 km on a bearing of 060° (60° clockwise from north). How far east of its starting point is it?
      options:
        - "6 km"
        - "6√3 km"
        - "12√3 km"
        - "4√3 km"
      option_explanations:
        - |
          6 km is 12 cos 60°, the distance north. The bearing is measured from north, so the eastward leg is opposite the 60° angle.
        - |
          Correct. The 60° angle is at the start, between north and the course, so the eastward leg is 12 sin 60° = 12 · √3/2 = 6√3 ≈ 10.39 km.
        - |
          12√3 is 12 tan 60°, which treats 12 km as a leg; it is the hypotenuse, the distance sailed.
        - |
          4√3 is 12 tan 30°; tangent relates two legs, and the 12 km course is the hypotenuse.
      answer: 1
    - slug: trig-u01-w04-q21
      type: short_answer
      topic_code: "1.8"
      source: "Original item; Common Core HSG-C.B.5"
      points: 3
      prompt: |
        A hypothetical flower bed is a sector of a circle of radius 9 m with a central angle of 100°.

        (a) Write the central angle in radians, exactly.
        (b) Find the length of the curved edge of the bed, exactly and to the nearest hundredth of a metre.
        (c) Find the area of the bed, exactly and to the nearest hundredth of a square metre.
      answer: |
        (a) 100 · π/180 = 5π/9.
        (b) s = rθ = 9 · 5π/9 = 5π ≈ 15.71 m.
        (c) A = ½r²θ = ½ · 81 · 5π/9 = 45π/2 = 22.5π ≈ 70.69 m².
      explanation: |
        Three points, one per part. (a) 5π/9. (b) 5π and 15.71 m (the work must use the radian angle). (c) 22.5π (or 45π/2) and 70.69 m². Using 100 in place of 5π/9 in (b) or (c) earns no credit for that part.
    - slug: trig-u01-w04-q22
      type: short_answer
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 3
      prompt: |
        From a point A on level ground, the angle of elevation to the top of a hypothetical tower is 30°. After walking 50 m straight towards the tower to point B, the angle of elevation is 45°. Let h be the height of the tower in metres.

        (a) Express the distances from A and from B to the base of the tower in terms of h, exactly.
        (b) Write an equation in h using the 50 m between A and B.
        (c) Solve for h, exactly and to the nearest hundredth of a metre.
      answer: |
        (a) From B: tan 45° = h/(BC), so BC = h. From A: tan 30° = h/(AC), so AC = h/tan 30° = h√3.
        (b) AC − BC = 50, so h√3 − h = 50.
        (c) h(√3 − 1) = 50, h = 50/(√3 − 1) = 25(√3 + 1) ≈ 68.30 m.
      explanation: |
        Three points, one per part. (a) both distances, h√3 and h (accept h/tan 30° and h/tan 45°). (b) a correct equation equivalent to h√3 − h = 50. (c) 25(√3 + 1) or 50/(√3 − 1), and 68.30 m.
    - slug: trig-u01-w04-q23
      type: long_answer
      topic_code: "1.8"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 6
      prompt: |
        A hypothetical electric motor turns a pulley of radius 4 cm at 1,500 revolutions per minute. A belt runs around this pulley and around a second pulley of radius 10 cm. The belt does not slip.

        (A) (i) Find the angular speed of the motor's pulley in radians per minute, exactly.
        (ii) Find the same angular speed in radians per second, exactly and to the nearest hundredth.

        (B) (i) Find the linear speed of the belt in centimetres per second, exactly and to the nearest hundredth.
        (ii) Explain why the belt moves at the same linear speed as a point on the rim of each pulley.

        (C) (i) Find the angular speed of the larger pulley in radians per second and in revolutions per minute.
        (ii) Through what angle, in radians, does the larger pulley turn in 0.1 second? Describe this angle in words.
      answer: |
        (A) (i) ω = 1,500 · 2π = 3,000π radians per minute.
        (ii) 3,000π/60 = 50π ≈ 157.08 radians per second.
        (B) (i) v = rω = 4 · 50π = 200π ≈ 628.32 cm per second.
        (ii) The belt is in contact with each rim and does not slip, so in any time interval the length of belt that passes equals the arc length a rim point travels. Equal distances in equal times mean equal linear speeds.
        (C) (i) The rim of the larger pulley moves at 200π cm/s, so ω = v/r = 200π/10 = 20π ≈ 62.83 radians per second. In revolutions per minute: 20π · 60 / 2π = 600 rpm.
        (ii) θ = ωt = 20π · 0.1 = 2π radians: exactly one full revolution.
      explanation: |
        Six points. (A) 1 point for 3,000π rad/min; 1 point for 50π ≈ 157.08 rad/s. (B) 1 point for 200π ≈ 628.32 cm/s; 1 point for explaining that no slipping means the belt and each rim cover equal distances in equal times. (C) 1 point for 20π rad/s and 600 rpm (both needed); 1 point for 2π radians described as one full revolution.
