week: 1
unit: 1
title: "Angles and Special Right Triangles"
topics: ["1.1", "1.2"]
guide: guides/week-01.md
guide_description: |
  Angles as rotations from an initial side to a terminal side, positive and negative angles, standard position,
  quadrants and quadrantal angles, coterminal angles, complements and supplements, and degrees–minutes–seconds;
  then why AA similarity makes every ratio of sides of a right triangle depend only on its acute angle, and the
  exact side ratios of the 45°-45°-90° and 30°-60°-90° triangles. Worked examples: the angle coterminal with
  −510°, 47°15′36″ and 23.42° converted, a tree's height from shadows, a square tile's side from its diagonal,
  a 12 ft ramp at 30°, and a 30°-60°-90° triangle from its long leg.
flashcards_description: |
  30 cards on angles as rotations, standard position, coterminal and quadrantal angles, DMS conversions,
  complements and supplements, AA similarity and the 45°-45°-90° and 30°-60°-90° triangles.

flashcards:
  - front: An angle in trigonometry → what it measures
    back: |
      An amount of turning: a ray rotates about the vertex from the initial side to the terminal side. More than one full turn is allowed.
    topic_code: "1.1"
  - front: Sign of an angle's measure → which direction is positive
    back: |
      Counterclockwise rotation is positive; clockwise rotation is negative. −60° turns 60° clockwise.
    topic_code: "1.1"
  - front: Standard position of an angle → the two conditions
    back: |
      Vertex at the origin, and initial side along the positive x-axis. The terminal side then shows where the rotation ends.
    topic_code: "1.1"
  - front: Quadrants I to IV for angles in standard position → degree ranges
    back: |
      I: 0° to 90°. II: 90° to 180°. III: 180° to 270°. IV: 270° to 360°. The endpoints themselves are quadrantal, in no quadrant.
    topic_code: "1.1"
  - front: Quadrantal angle → definition and examples
    back: |
      An angle in standard position whose terminal side lies on an axis: 0°, 90°, 180°, 270°, 360°, −90°, 450°, …
    topic_code: "1.1"
  - front: Coterminal angles of θ (degrees) → general form
    back: |
      θ + 360°k for any integer k. They share a terminal side because a full turn returns the ray to where it was.
    topic_code: "1.1"
  - front: Angle in [0°, 360°) coterminal with −510° → value and quadrant
    back: |
      −510° + 720° = 210°, in quadrant III.
    hint: Add 360° until the result lands between 0° and 360°.
    topic_code: "1.1"
  - front: Positive and negative angles coterminal with 125° → one of each
    back: |
      125° + 360° = 485° and 125° − 360° = −235°. Both end in quadrant II.
    topic_code: "1.1"
  - front: 450° in standard position → where it ends
    back: |
      One full turn plus 90°: on the positive y-axis. It is quadrantal and coterminal with 90°.
    topic_code: "1.1"
  - front: Degrees, minutes, seconds → the conversion factors
    back: |
      1° = 60′ and 1′ = 60″, so 1° = 3600″.
    topic_code: "1.1"
  - front: DMS to decimal degrees → the rule
    back: |
      degrees + minutes/60 + seconds/3600. 47°15′36″ = 47 + 0.25 + 0.01 = 47.26°.
    topic_code: "1.1"
  - front: Decimal degrees to DMS for 23.42° → method and result
    back: |
      Keep 23°. 0.42 × 60 = 25.2′, keep 25′. 0.2 × 60 = 12″. So 23°25′12″.
    topic_code: "1.1"
  - front: 108°45′ → decimal degrees
    back: |
      45′ = 45/60 = 0.75°, so 108.75°.
    topic_code: "1.1"
  - front: Complement and supplement of θ → formulas
    back: |
      Complement 90° − θ; supplement 180° − θ. For 62°: complement 28°, supplement 118°.
    topic_code: "1.1"
  - front: Angle with no complement → which angles
    back: |
      Any angle of 90° or more: 90° − θ would be zero or negative. Angles of 180° or more also have no supplement.
    topic_code: "1.1"
  - front: The two acute angles of a right triangle → relationship
    back: |
      Complementary: they sum to 90°, because the right angle uses 90° of the triangle's 180°.
    topic_code: "1.2"
  - front: AA similarity for right triangles → what one acute angle decides
    back: |
      Two right triangles with one equal acute angle have all three angles equal, so they are similar: scaled copies of each other.
    topic_code: "1.2"
  - front: Ratio of two sides within one right triangle → why it depends only on the angle
    back: |
      In a similar triangle with scale factor k both sides become k times as long, and k cancels: (ka)/(kc) = a/c.
    topic_code: "1.2"
  - front: 1.6 m student with 2.4 m shadow, tree with 18 m shadow → tree height
    back: |
      Similar triangles: 1.6/2.4 = h/18, so h = 12 m.
    topic_code: "1.2"
  - front: 45°-45°-90° triangle → side ratio
    back: |
      leg : leg : hypotenuse = 1 : 1 : √2. The hypotenuse is a leg times √2.
    topic_code: "1.2"
  - front: Where the 45°-45°-90° ratio comes from → derivation
    back: |
      Halve a square of side a along a diagonal: hypotenuse √(a² + a²) = a√2.
    topic_code: "1.2"
  - front: 30°-60°-90° triangle → side ratio and which side is where
    back: |
      short leg : long leg : hypotenuse = 1 : √3 : 2. The short leg is opposite 30°, the long leg opposite 60°.
    topic_code: "1.2"
  - front: Where the 30°-60°-90° ratio comes from → derivation
    back: |
      Halve an equilateral triangle of side 2s with an altitude: hypotenuse 2s, short leg s, long leg √(4s² − s²) = s√3.
    topic_code: "1.2"
  - front: Square tile with a 10 cm diagonal → side length
    back: |
      10/√2 = 5√2 ≈ 7.07 cm.
    topic_code: "1.2"
  - front: 12 ft ramp at 30° to the ground → rise and run
    back: |
      Rise = short leg = 6 ft. Run = long leg = 6√3 ≈ 10.39 ft.
    topic_code: "1.2"
  - front: 30°-60°-90° triangle with long leg 9 → other two sides
    back: |
      Short leg 9/√3 = 3√3 ≈ 5.20; hypotenuse 6√3 ≈ 10.39.
    topic_code: "1.2"
  - front: Altitude of an equilateral triangle with side 8 → exact value
    back: |
      The altitude is the long leg of a 30°-60°-90° triangle with short leg 4: 4√3 ≈ 6.93.
    topic_code: "1.2"
  - front: Error-spot → "23.42° is the same as 23°42′"
    back: |
      Decimal digits are hundredths of a degree, not minutes. 0.42° × 60 = 25.2′, so 23.42° = 23°25′12″.
    topic_code: "1.1"
  - front: Error-spot → "−60° ends in quadrant II"
    back: |
      Negative angles turn clockwise from the positive x-axis, so −60° ends in quadrant IV (coterminal with 300°).
    topic_code: "1.1"
  - front: Error-spot → "a 30°-60°-90° triangle with hypotenuse 10 has a short leg of 5√3"
    back: |
      The short leg is half the hypotenuse, 5. The long leg is 5√3.
    topic_code: "1.2"

quiz:
  description: |
    23 questions · about 40 minutes · all on this week (topics 1.1 and 1.2: angles as rotations, standard
    position, coterminal and quadrantal angles, DMS conversions, complements and supplements, similar right
    triangles and the 45°-45°-90° and 30°-60°-90° triangles). Includes a shared-context set on a 30°-60°-90°
    triangle. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank
    items are matched automatically; the short answers and the long answer are graded by your teacher against
    the scoring notes. Items marked (Calculator.) need a calculator; the rest are designed to be done by hand.
  questions:
    # ---- Stimulus set: a 30°-60°-90° triangle (1.2)
    - slug: trig-u01-w01-q01
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      stimulus: |
        Right triangle ABC has its right angle at C, angle A = 30°, and hypotenuse AB = 14.
      prompt: |
        What is the length of BC, the side opposite angle A?
      options:
        - "7√3"
        - "7"
        - "14√3"
        - "28"
      option_explanations:
        - |
          7√3 is the long leg, which sits opposite the 60° angle B, not opposite the 30° angle A.
        - |
          Correct. BC is opposite 30°, so it is the short leg, half the hypotenuse: 14/2 = 7.
        - |
          14√3 multiplies the hypotenuse by √3; no leg can be longer than the hypotenuse.
        - |
          28 doubles the hypotenuse instead of halving it; the hypotenuse is the longest side.
      answer: 1
    - slug: trig-u01-w01-q02
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      stimulus: |
        Right triangle ABC has its right angle at C, angle A = 30°, and hypotenuse AB = 14.
      prompt: |
        What is the exact length of AC?
      options:
        - "14√3"
        - "7√2"
        - "21"
        - "7√3"
      option_explanations:
        - |
          This multiplies the hypotenuse by √3; the long leg is the short leg times √3, and the short leg is 7.
        - |
          7√2 uses the 45°-45°-90° ratio, but this triangle has angles of 30° and 60°.
        - |
          21 is 7 + 14, adding sides; side lengths of a right triangle combine through the Pythagorean theorem.
        - |
          Correct. AC is opposite the 60° angle B, so it is the long leg: 7√3. Check: 7² + (7√3)² = 49 + 147 = 196 = 14².
      answer: 3
    - slug: trig-u01-w01-q03
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      stimulus: |
        Right triangle ABC has its right angle at C, angle A = 30°, and hypotenuse AB = 14.
      prompt: |
        A second right triangle DEF has its right angle at F, angle D = 30°, and hypotenuse DE = 35. What is the scale factor from triangle ABC to triangle DEF, and how long is EF?
      options:
        - "Scale factor 2.5; EF = 17.5"
        - "Scale factor 21; EF = 28"
        - "Scale factor 2.5; EF = 7"
        - "Scale factor 0.4; EF = 2.8"
      option_explanations:
        - |
          Correct. The triangles are similar by AA (90° and 30°). The factor is 35/14 = 2.5, and EF corresponds to BC = 7, so EF = 17.5.
        - |
          21 is the difference 35 − 14; similar figures are related by a ratio (a multiplier), not by adding a length.
        - |
          The factor 2.5 is right, but EF must be scaled too: the matching side BC = 7 becomes 2.5 × 7.
        - |
          0.4 = 14/35 is the factor from DEF back to ABC; going from ABC to the larger DEF the sides grow.
      answer: 0
    # ---- Topics 1.1 and 1.2
    - slug: trig-u01-w01-q04
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; Common Core HSF-TF.A.2 (extension)"
      points: 1
      prompt: |
        Which angle in the interval 0° ≤ θ < 360° is coterminal with −510°?
      options:
        - "150°"
        - "−150°"
        - "210°"
        - "30°"
      option_explanations:
        - |
          150° comes from 510° − 360°, which drops the minus sign; a clockwise turn of 510° does not end at 150°.
        - |
          −150° is coterminal with −510°, but it is not in the interval 0° ≤ θ < 360°; add 360° once more.
        - |
          Correct. −510° + 360° = −150°, and −150° + 360° = 210°, which ends in quadrant III.
        - |
          30° is the acute angle between 210° and the x-axis, not an angle with the same terminal side.
      answer: 2
    - slug: trig-u01-w01-q05
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; Common Core HSF-TF.A.2 (extension)"
      points: 1
      prompt: |
        What is 32°24′36″ in decimal degrees?
      options:
        - "32.2436°"
        - "32.24°"
        - "32.41°"
        - "33°"
      option_explanations:
        - |
          Writing the minutes and seconds as decimal digits treats them as hundredths and ten-thousandths of a degree.
        - |
          This reads 24′ as 0.24°; minutes are sixtieths of a degree, so 24′ = 0.4°.
        - |
          Correct. 32 + 24/60 + 36/3600 = 32 + 0.4 + 0.01 = 32.41°.
        - |
          This adds 24 and 36 as if both were minutes (60′ = 1°); the 36 is seconds, worth 36/3600 of a degree.
      answer: 2
    - slug: trig-u01-w01-q06
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; Common Core HSF-TF.A.2 (extension)"
      points: 1
      prompt: |
        A surveyor's hypothetical instrument reads 58.35°. What is this angle in degrees and minutes?
      options:
        - "58°21′"
        - "58°35′"
        - "58°0′21″"
        - "58°2′6″"
      option_explanations:
        - |
          Correct. 0.35° × 60 = 21′ exactly, so 58.35° = 58°21′.
        - |
          This copies the decimal digits as minutes; 0.35 of a degree is 0.35 × 60 = 21 minutes.
        - |
          21 is the right number, but it is minutes, not seconds: multiplying degrees by 60 gives minutes.
        - |
          This multiplies 0.035 instead of 0.35 by 60 (a misplaced decimal point), giving 2.1′ = 2′6″.
      answer: 0
    - slug: trig-u01-w01-q07
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; Common Core HSF-TF.A.2 (extension)"
      points: 1
      prompt: |
        In standard position, in which quadrant does the terminal side of −300° lie?
      options:
        - "II"
        - "III"
        - "IV"
        - "I"
      option_explanations:
        - |
          Quadrant II would hold a counterclockwise turn of 90° to 180°; −300° turns clockwise almost a full circle.
        - |
          Quadrant III is passed through on the way, but the clockwise turn continues for another 30° beyond −270°.
        - |
          Quadrant IV holds −60° or 300°; this uses the size 300° but ignores the clockwise direction.
        - |
          Correct. −300° + 360° = 60°, so −300° is coterminal with 60° and ends in quadrant I.
      answer: 3
    - slug: trig-u01-w01-q08
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; Common Core HSF-TF.A.2 (extension)"
      points: 1
      prompt: |
        What is the complement of a 37° angle?
      options:
        - "143°"
        - "53°"
        - "323°"
        - "127°"
      option_explanations:
        - |
          143° = 180° − 37° is the supplement; complementary angles add to 90°, not 180°.
        - |
          Correct. Complementary angles sum to 90°, and 90° − 37° = 53°.
        - |
          323° = 360° − 37° completes a full turn; that is neither the complement nor the supplement.
        - |
          127° = 90° + 37° adds instead of subtracting; the two angles together must make 90°.
      answer: 1
    - slug: trig-u01-w01-q09
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      prompt: |
        The hypotenuse of a 45°-45°-90° triangle is 9. What is the exact length of each leg?
      options:
        - "9√2/2"
        - "9√2"
        - "4.5"
        - "9√3/2"
      option_explanations:
        - |
          Correct. leg × √2 = 9, so leg = 9/√2 = 9√2/2 ≈ 6.36.
        - |
          9√2 multiplies by √2, which goes from a leg to the hypotenuse; here the hypotenuse is given, so divide.
        - |
          Halving the hypotenuse gives the short leg of a 30°-60°-90° triangle, not a leg of a 45°-45°-90° one.
        - |
          9√3/2 is the long leg of a 30°-60°-90° triangle with hypotenuse 9; the angles here are both 45°.
      answer: 0
    - slug: trig-u01-w01-q10
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; Common Core HSG-SRT.B.5"
      points: 1
      prompt: |
        At the same moment, a hypothetical 1.8 m fence post casts a 1.2 m shadow and a flagpole casts an 8 m shadow on level ground. How tall is the flagpole?
      options:
        - "5.33 m"
        - "8.6 m"
        - "14.4 m"
        - "12 m"
      option_explanations:
        - |
          This uses shadow/height = 1.8/1.2 upside down: 8 × 1.2/1.8 ≈ 5.33, but the flagpole must be taller than its shadow.
        - |
          8.6 adds the 0.6 m difference between the post and its shadow; similar triangles keep ratios, not differences.
        - |
          14.4 = 8 × 1.8 multiplies by the post's height without dividing by its shadow length of 1.2 m.
        - |
          Correct. The triangles are similar by AA, so h/8 = 1.8/1.2 = 1.5 and h = 12 m.
      answer: 3
    - slug: trig-u01-w01-q11
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      prompt: |
        Two right triangles each have an acute angle of 40°. One has hypotenuse 5 and the other has hypotenuse 20. Which statement about the ratio (leg opposite the 40° angle)/(hypotenuse) is true?
      options:
        - "The larger triangle's ratio is 4 times the smaller triangle's ratio."
        - "The ratios are equal, because the triangles are similar and the scale factor cancels."
        - "The ratios cannot be compared without measuring the legs."
        - "The ratios are equal only if the two triangles are congruent."
      option_explanations:
        - |
          Both the leg and the hypotenuse grow by the factor 4, so the factor appears on top and bottom and cancels.
        - |
          Correct. Both triangles have angles 40°, 50° and 90°, so they are similar by AA; (4a)/(4c) = a/c.
        - |
          No measuring is needed: similarity alone guarantees the ratio is the same in both triangles.
        - |
          Congruence is not required; similar triangles of any size share every ratio of corresponding sides.
      answer: 1
    - slug: trig-u01-w01-q12
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; Common Core HSF-TF.A.2 (extension)"
      points: 1
      prompt: |
        Which of these angles in standard position is a quadrantal angle?
      options:
        - "45°"
        - "−135°"
        - "−270°"
        - "300°"
      option_explanations:
        - |
          45° ends halfway between the axes in quadrant I; a quadrantal angle ends on an axis.
        - |
          −135° ends in quadrant III, on the line y = x, not on an axis.
        - |
          Correct. −270° turns three quarter turns clockwise and ends on the positive y-axis, coterminal with 90°.
        - |
          300° ends in quadrant IV, 60° short of a full turn, so it is not on an axis.
      answer: 2
    - slug: trig-u01-w01-q13
      type: multi_select
      topic_code: "1.1"
      source: "Original item; Common Core HSF-TF.A.2 (extension)"
      points: 2
      partial_credit: true
      prompt: |
        Which angles are coterminal with 75°? Select all that apply.
      options:
        - "435°"
        - "−285°"
        - "255°"
        - "−75°"
        - "795°"
      option_explanations:
        - |
          Correct. 435° = 75° + 360°, one extra full turn, which ends on the same terminal side.
        - |
          Correct. −285° = 75° − 360°: turning 285° clockwise ends on the same ray as turning 75° counterclockwise.
        - |
          255° = 75° + 180° points in the opposite direction; coterminal angles differ by multiples of 360°.
        - |
          −75° is the reflection of 75° across the x-axis, ending in quadrant IV, not quadrant I.
        - |
          Correct. 795° = 75° + 2 × 360°, two extra full turns, so it is coterminal with 75°.
      answer: [0, 1, 4]
    - slug: trig-u01-w01-q14
      type: multi_select
      topic_code: "1.2"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 2
      partial_credit: true
      prompt: |
        A 30°-60°-90° triangle has a short leg of 5. Which statements about this triangle are true? Select all that apply.
      options:
        - "The hypotenuse is 10."
        - "The long leg is 5√2."
        - "The long leg is 5√3."
        - "The angle opposite the short leg is 60°."
        - "The hypotenuse is 5√3."
      option_explanations:
        - |
          Correct. In a 30°-60°-90° triangle the hypotenuse is twice the short leg: 2 × 5 = 10.
        - |
          The factor √2 belongs to the 45°-45°-90° triangle; here the long leg is the short leg times √3.
        - |
          Correct. long leg = short leg × √3 = 5√3. Check: 25 + 75 = 100 = 10².
        - |
          The shortest side is opposite the smallest angle, so the short leg is opposite 30°, not 60°.
        - |
          5√3 ≈ 8.66 is the long leg; the hypotenuse is 10, the longest side.
      answer: [0, 2]
    - slug: trig-u01-w01-q15
      type: true_false
      topic_code: "1.1"
      source: "Original item; Common Core HSF-TF.A.2 (extension)"
      points: 1
      prompt: |
        True or false: In standard position, the angles 130° and −230° are coterminal.
      answer: true
      explanation: |
        True. 130° − (−230°) = 360°, one full turn, so the two angles share a terminal side in quadrant II.
    - slug: trig-u01-w01-q16
      type: true_false
      topic_code: "1.2"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      prompt: |
        True or false: In every 45°-45°-90° triangle, the hypotenuse is twice as long as each leg.
      answer: false
      explanation: |
        False. The hypotenuse is √2 ≈ 1.414 times a leg, from √(a² + a²) = a√2. "Twice" is the relationship between the hypotenuse and the short leg of a 30°-60°-90° triangle.
    - slug: trig-u01-w01-q17
      type: fill_blank
      topic_code: "1.1"
      source: "Original item; Common Core HSF-TF.A.2 (extension)"
      points: 1
      prompt: |
        The complement of a 64° angle measures ____ degrees.
      answer: ["26", "26°", "26 degrees"]
      explanation: |
        Complementary angles sum to 90°, so the complement is 90° − 64° = 26°.
    - slug: trig-u01-w01-q18
      type: fill_blank
      topic_code: "1.2"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      prompt: |
        A 45°-45°-90° triangle has legs of length 6. The exact length of its hypotenuse is ____.
      answer: ["6√2", "6 √2", "6√(2)", "6sqrt(2)", "6 sqrt(2)", "6sqrt2", "6*sqrt(2)", "6 * sqrt(2)", "sqrt(72)", "√72"]
      explanation: |
        The hypotenuse of a 45°-45°-90° triangle is a leg times √2: 6√2 ≈ 8.49. Check: √(36 + 36) = √72 = 6√2.
    - slug: trig-u01-w01-q19
      type: numeric
      topic_code: "1.1"
      source: "Original item; Common Core HSF-TF.A.2 (extension)"
      points: 1
      prompt: |
        (Calculator.) Convert 73°8′42″ to decimal degrees, to the nearest thousandth of a degree.
      answer: { value: 73.145, tolerance: 0.001 }
      explanation: |
        73 + 8/60 + 42/3600 = 73 + 0.13333… + 0.01167 = 73.145° (exactly 73.145).
    - slug: trig-u01-w01-q20
      type: numeric
      topic_code: "1.2"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      prompt: |
        (Calculator.) An equilateral triangle has sides of 12 cm. To the nearest hundredth of a centimetre, how long is its altitude?
      answer: { value: 10.39, tolerance: 0.01 }
      explanation: |
        The altitude splits the triangle into two 30°-60°-90° triangles with hypotenuse 12 and short leg 6. The altitude is the long leg, 6√3 ≈ 10.392, which is 10.39 cm.
    - slug: trig-u01-w01-q21
      type: short_answer
      topic_code: "1.1"
      source: "Original item; Common Core HSF-TF.A.2 (extension)"
      points: 3
      prompt: |
        A hypothetical telescope mount is turned through 141.6°.

        (a) Write 141.6° in degrees and minutes.
        (b) Find the supplement of 141.6° in degrees and minutes, and explain why 141.6° has no complement.
        (c) The mount is then reset by turning it through −1000°. Find the angle in the interval 0° ≤ θ < 360° that is coterminal with −1000°, and name the quadrant where its terminal side lies.
      answer: |
        (a) 0.6° × 60 = 36′, so 141.6° = 141°36′.
        (b) 180° − 141.6° = 38.4° = 38°24′ (0.4 × 60 = 24′). A complement would be 90° − 141.6° = −51.6°, which is negative; only angles less than 90° have a complement.
        (c) −1000° + 3 × 360° = −1000° + 1080° = 80°, which lies in quadrant I.
      explanation: |
        Three points, one per part. (a) 141°36′. (b) 38°24′ (accept 38.4° only if also written in degrees and minutes) with a correct reason there is no complement (the angle exceeds 90°). (c) 80° and quadrant I.
