      type: long_answer
      topic_code: "1.2"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 6
      prompt: |
        A hypothetical solar-panel frame on a flat roof is a right triangle. The panel itself is the hypotenuse, 2.4 m long, and it is tilted at 30° to the roof. A vertical support joins the top edge of the panel to the roof, and the roof forms the horizontal leg.

        (A) (i) Find the exact height of the vertical support.
        (ii) Find the exact horizontal length of roof the frame covers, and its value to the nearest hundredth of a metre.

        (B) A smaller frame is built with the same 30° tilt and a panel 1.5 m long.
        (i) Explain why the two frames are similar triangles.
        (ii) Use similarity (not a new 30°-60°-90° calculation) to find the smaller frame's support height, and explain why (support height)/(panel length) is the same for both frames.

        (C) The installer considers tilting the 2.4 m panel at 45° instead.
        (i) Find the exact support height at a 45° tilt.
        (ii) To the nearest hundredth of a metre, how much taller is the support at 45° than at 30°?
      answer: |
        (A) (i) At a 30° tilt the support is opposite the 30° angle, the short leg: 2.4/2 = 1.2 m.
        (ii) The roof length is the long leg: 1.2√3 m ≈ 2.08 m.
        (B) (i) Both frames have a 90° angle at the support and a 30° tilt, so by the angle sum both also have a 60° angle; two pairs of equal angles make them similar by AA.
        (ii) The scale factor is 1.5/2.4 = 0.625, so the support is 0.625 × 1.2 = 0.75 m. In each frame (support)/(panel) = 1/2: scaling a triangle multiplies both lengths by the same factor, which cancels in the ratio, so the ratio depends only on the 30° angle.
        (C) (i) At 45° the frame is a 45°-45°-90° triangle, so support = 2.4/√2 = 1.2√2 m (≈ 1.70 m).
        (ii) 1.2√2 − 1.2 ≈ 1.697 − 1.2 = 0.497, so about 0.50 m taller.
      explanation: |
        Six points. (A) 1 point for 1.2 m; 1 point for 1.2√3 ≈ 2.08 m. (B) 1 point for a correct AA argument naming both pairs of equal angles; 1 point for 0.75 m found by scaling, with the ratio 1/2 explained by the factor cancelling. (C) 1 point for 1.2√2 (accept 2.4/√2); 1 point for 0.50 m (accept 0.49 to 0.50 from a rounded intermediate).
