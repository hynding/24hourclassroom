      source: "Original item; Common Core HSG-SRT.C.6"
      points: 3
      prompt: |
        In a 30°-60°-90° triangle, the leg opposite the 60° angle has length 12.

        (a) Find the exact length of the short leg.
        (b) Find the exact length of the hypotenuse, and its value to the nearest hundredth.
        (c) A student says the short leg is 12/2 = 6. Explain the student's error.
      answer: |
        (a) The long leg is the short leg times √3, so s√3 = 12 and s = 12/√3 = 12√3/3 = 4√3 (≈ 6.93).
        (b) The hypotenuse is 2s = 8√3 ≈ 13.86.
        (c) Halving gives the short leg only when you start from the hypotenuse. The side given is the long leg, opposite 60°, so the student should divide by √3, not by 2.
      explanation: |
        Three points, one per part. (a) 4√3 (accept 12/√3). (b) 8√3 and 13.86. (c) identifies that 12 is the long leg (not the hypotenuse) and that the correct step divides by √3.
