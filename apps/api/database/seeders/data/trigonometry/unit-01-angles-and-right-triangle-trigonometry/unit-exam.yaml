unit: 1
description: |
  47 questions · about 90 minutes · every topic of Unit 1 (1.1 to 1.12): angles, degrees and minutes and
  coterminal angles, similar triangles and the special right triangles, the six trigonometric ratios and
  cofunctions, solving right triangles, elevation, depression and bearings, radian measure, arc length, sector
  area and angular speed, the trigonometric functions of any angle, reference angles and signs by quadrant,
  the unit circle and the fundamental identities. Includes four shared-context sets (a right triangle, a
  bicycle wheel, an angle through a point, and an angle given by its cosine), select-all, true/false,
  fill-in-the-blank and numeric items, two short-answer questions (3 points each) and two free-response
  questions (6 points each: a fire-tower sighting problem and a Ferris wheel on a coordinate grid). Items
  marked (Calculator.) need a calculator; the rest are designed to be done by hand. Multiple choice,
  select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
  automatically; the free-response items are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: a right triangle (1.3, 1.4, 1.5)
  - slug: trig-u01-exam-q01
    type: multiple_choice
    topic_code: "1.3"
    source: "Original item; Common Core HSG-SRT.C.6"
    points: 1
    stimulus: |
      In right triangle ABC, angle C is the right angle, AC = 20, BC = 21 and AB = 29.
    prompt: |
      What is tan A?
    options:
      - "20/21"
      - "21/29"
      - "21/20"
      - "29/20"
    option_explanations:
      - |
        20/21 is adjacent over opposite for angle A, which is cot A (and tan B).
      - |
        21/29 is opposite over hypotenuse, which is sin A; tangent compares the two legs.
      - |
        Correct. The side opposite A is BC = 21 and the side adjacent to A is AC = 20, so tan A = 21/20.
      - |
        29/20 is hypotenuse over adjacent, which is sec A.
    answer: 2
  - slug: trig-u01-exam-q02
    type: multiple_choice
    topic_code: "1.4"
    source: "Original item; Common Core HSG-SRT.C.7"
    points: 1
    stimulus: |
      In right triangle ABC, angle C is the right angle, AC = 20, BC = 21 and AB = 29.
    prompt: |
      Which ratio is equal to cos B?
    options:
      - "sin A"
      - "cos A"
      - "tan A"
      - "sec A"
    option_explanations:
      - |
        Correct. The side adjacent to B is BC = 21, which is opposite A, so cos B = 21/29 = sin A. A and B are complementary, and cosine is the cofunction of sine.
      - |
        cos A = 20/29, but cos B = 21/29; cosines of complementary angles are not equal unless both are 45°.
      - |
        tan A = 21/20 is a ratio of two legs and is greater than 1, so it cannot equal a cosine.
      - |
        sec A = 29/20 is greater than 1; no cosine of an acute angle can exceed 1.
    answer: 0
  - slug: trig-u01-exam-q03
    type: multiple_choice
    topic_code: "1.3"
    source: "Original item; Common Core HSG-SRT.C.6"
    points: 1
    stimulus: |
      In right triangle ABC, angle C is the right angle, AC = 20, BC = 21 and AB = 29.
    prompt: |
      What is csc A?
    options:
      - "29/20"
      - "21/29"
      - "20/29"
      - "29/21"
    option_explanations:
      - |
        29/20 is hypotenuse over adjacent, which is sec A, the reciprocal of cosine.
      - |
        21/29 is sin A itself; cosecant is its reciprocal.
      - |
        20/29 is cos A; cosecant is built from the opposite side, not the adjacent side.
      - |
        Correct. csc A = 1/sin A = hypotenuse/opposite = 29/21.
    answer: 3
  - slug: trig-u01-exam-q04
    type: numeric
    topic_code: "1.5"
    source: "Original item; Common Core HSG-SRT.C.8"
    points: 1
    stimulus: |
      In right triangle ABC, angle C is the right angle, AC = 20, BC = 21 and AB = 29.
    prompt: |
      (Calculator.) Find the measure of angle A in degrees, to the nearest hundredth.
    answer: { value: 46.40, tolerance: 0.01 }
    explanation: |
      tan A = 21/20, so A = tan⁻¹(21/20) ≈ 46.40°. (sin⁻¹(21/29) and cos⁻¹(20/29) give the same angle.)
  # ---- Angles, special triangles, ratios and right-triangle applications (1.1 to 1.6)
  - slug: trig-u01-exam-q05
    type: multiple_choice
    topic_code: "1.1"
    source: "Original item; Common Core HSF-TF.A.2"
    points: 1
    prompt: |
      Which angle is coterminal with −130°?
    options:
      - "130°"
      - "230°"
      - "50°"
      - "310°"
    option_explanations:
      - |
        130° is the same rotation in the opposite direction; it ends in quadrant II, not quadrant III.
      - |
        Correct. Adding a full turn: −130° + 360° = 230°, which ends on the same ray.
      - |
        50° is the reference angle of −130° (and of 230°), not a coterminal angle.
      - |
        310° = 180° + 130°, which adds a half-turn and changes the direction of 130°; coterminal angles differ by 360°.
    answer: 1
  - slug: trig-u01-exam-q06
    type: multiple_choice
    topic_code: "1.1"
    source: "Original item; Common Core HSF-TF.A.2"
    points: 1
    prompt: |
      Which is 38.4° written in degrees and minutes?
    options:
      - "38° 40′"
      - "38° 4′"
      - "38° 6.67′"
      - "38° 24′"
    option_explanations:
      - |
        This reads the decimal 0.4 as 40 minutes; a degree has 60 minutes, so 0.4° = 0.4 · 60 = 24′.
      - |
        This reads the digit 4 as 4 minutes; minutes are sixtieths of a degree, so 0.4° is 24′.
      - |
        6.67 = 0.4 ÷ 0.06 is an inverted conversion; multiply the decimal part by 60.
      - |
        Correct. 0.4° · 60′ per degree = 24′, so 38.4° = 38° 24′.
    answer: 3
  - slug: trig-u01-exam-q07
    type: multiple_choice
    topic_code: "1.2"
    source: "Original item; Common Core HSG-SRT.C.6"
    points: 1
    prompt: |
      A 45-45-90 triangle has a hypotenuse of 10 cm. How long is each leg?
    options:
      - "5√2 cm"
      - "10√2 cm"
      - "5 cm"
      - "5√3 cm"
    option_explanations:
      - |
        Correct. The sides are in the ratio 1 : 1 : √2, so each leg is 10/√2 = 5√2 ≈ 7.07 cm.
      - |
        10√2 multiplies the hypotenuse by √2; that would be the hypotenuse for legs of 10, longer than the given one.
      - |
        5 cm halves the hypotenuse, which is the short leg of a 30-60-90 triangle, not a leg of a 45-45-90 triangle.
      - |
        5√3 is the longer leg of a 30-60-90 triangle with hypotenuse 10; this triangle has two equal legs.
    answer: 0
  - slug: trig-u01-exam-q08
    type: multiple_choice
    topic_code: "1.2"
    source: "Original item; Common Core HSG-SRT.C.6"
    points: 1
    prompt: |
      The longer leg of a 30-60-90 triangle is 9 cm. How long is the hypotenuse?
    options:
      - "18 cm"
      - "9√3 cm"
      - "6√3 cm"
      - "3√3 cm"
    option_explanations:
      - |
        18 doubles the longer leg; the hypotenuse is twice the shorter leg, not the longer one.
      - |
        9√3 multiplies by √3, which turns a shorter leg into a longer leg; here 9 is already the longer leg.
      - |
        Correct. The shorter leg is 9/√3 = 3√3, and the hypotenuse is twice that, 6√3 ≈ 10.39 cm.
      - |
        3√3 is the shorter leg; the question asks for the hypotenuse, which is twice as long.
    answer: 2
  - slug: trig-u01-exam-q09
    type: multiple_choice
    topic_code: "1.3"
    source: "Original item; Common Core HSG-SRT.C.6"
    points: 1
    prompt: |
      What is the exact value of sin 60° · tan 60°?
    options:
      - "3/2"
      - "1/2"
      - "√3/2"
      - "3"
    option_explanations:
      - |
        Correct. sin 60° = √3/2 and tan 60° = √3, so the product is √3/2 · √3 = 3/2.
      - |
        1/2 is sin 60° · tan 30° = (√3/2)(√3/3); tan 60° is √3, not √3/3.
      - |
        √3/2 is √3 · 1/2, which uses sin 30° = 1/2 in place of sin 60° = √3/2.
      - |
        3 is (√3)², which forgets the denominator 2 of sin 60° = √3/2.
    answer: 0
  - slug: trig-u01-exam-q10
    type: multiple_choice
    topic_code: "1.4"
    source: "Original item; Common Core HSG-SRT.C.7"
    points: 1
    prompt: |
      The angles (2x + 10)° and (x + 20)° are acute, and sin(2x + 10)° = cos(x + 20)°. What is x?
    options:
      - "10"
      - "26.67"
      - "20"
      - "60"
    option_explanations:
      - |
        x = 10 would make the angles 30° and 30°, which are not complementary; sin 30° ≠ cos 30°.
      - |
        26.67 solves 3x + 30 = 110, using a sum of 110°; complementary angles add to 90°.
      - |
        Correct. Sine equals cosine for complementary angles, so (2x + 10) + (x + 20) = 90, 3x = 60, x = 20. The angles are 50° and 40°.
      - |
        60 is the value of 3x, not x; divide both sides of 3x = 60 by 3.
    answer: 2
  - slug: trig-u01-exam-q11
    type: multiple_choice
    topic_code: "1.5"
    source: "Original item; Common Core HSG-SRT.C.8"
    points: 1
    prompt: |
      (Calculator.) In a right triangle, the leg adjacent to a 52° angle is 15 cm. To the nearest hundredth, how long is the hypotenuse?
    options:
      - "9.23 cm"
      - "19.04 cm"
      - "24.36 cm"
      - "19.20 cm"
    option_explanations:
      - |
        9.23 is 15 cos 52°, which is shorter than the 15 cm leg; the hypotenuse must be longer, so divide by cos 52°.
      - |
        19.04 is 15/sin 52°, which treats the 15 cm leg as opposite the 52° angle.
      - |
        Correct. cos 52° = 15/h, so h = 15/cos 52° ≈ 24.36 cm.
      - |
        19.20 is 15 tan 52°, the other leg, not the hypotenuse.
    answer: 2
  - slug: trig-u01-exam-q12
    type: multiple_choice
    topic_code: "1.6"
    source: "Original item; Common Core HSG-SRT.C.8"
    points: 1
    prompt: |
      (Calculator.) From the top of a hypothetical lighthouse 45 m above the sea, the angles of depression to two boats directly in line with the lighthouse are 20° and 32°. To the nearest hundredth of a metre, how far apart are the boats?
    options:
      - "11.74 m"
      - "51.62 m"
      - "211.71 m"
      - "123.64 m"
    option_explanations:
      - |
        11.74 is 45 tan 32° − 45 tan 20°, which puts the height in the adjacent position; the distances are 45/tan of each angle.
      - |
        Correct. The boats are 45/tan 20° ≈ 123.64 m and 45/tan 32° ≈ 72.02 m from the foot of the lighthouse, so they are about 51.62 m apart.
      - |
        211.71 is 45/tan 12°, using the difference of the angles; subtract the distances, not the angles.
      - |
        123.64 m is the distance to the farther boat alone; the question asks for the distance between the boats.
    answer: 1
  - slug: trig-u01-exam-q13
    type: multiple_choice
    topic_code: "1.6"
    source: "Original item; Common Core HSG-SRT.C.8"
    points: 1
    prompt: |
      A hypothetical plane flies 300 km on a bearing of 210°. How far south of its starting point is it?
    options:
      - "150 km"
      - "300 km"
      - "100√3 km"
      - "150√3 km"
    option_explanations:
      - |
        150 km is 300 sin 30°, the distance west; the 30° angle is measured from south, so the southward leg is adjacent to it.
      - |
        300 km is the length of the whole flight; the southward distance is one leg of the right triangle.
      - |
        100√3 is 300 tan 30°; the 300 km course is the hypotenuse, so cosine is needed.
      - |
        Correct. A bearing of 210° is 30° west of due south, so the southward leg is 300 cos 30° = 150√3 ≈ 259.81 km.
    answer: 3
  # ---- Radian measure and circular motion (1.7, 1.8)
  - slug: trig-u01-exam-q14
    type: multiple_choice
    topic_code: "1.7"
    source: "Original item; Common Core HSF-TF.A.1"
    points: 1
    prompt: |
      What is 3π/8 radians in degrees?
    options:
      - "135°"
      - "22.5°"
      - "33.75°"
      - "67.5°"
    option_explanations:
      - |
        135° is 3π/4; this doubles the angle by misreading the denominator 8 as 4.
      - |
        22.5° is π/8; the numerator 3 has been dropped.
      - |
        33.75° comes from treating π as 90°; π radians is 180°.
      - |
        Correct. 3π/8 · 180/π = 540/8 = 67.5°, three pieces of 22.5°.
    answer: 3
  - slug: trig-u01-exam-q15
    type: multiple_choice
    topic_code: "1.7"
    source: "Original item; Common Core HSF-TF.A.1"
    points: 1
    prompt: |
      What is −420° in radians?
    options:
      - "−7π/6"
      - "−7π/3"
      - "−4π/3"
      - "7π/3"
    option_explanations:
      - |
        −7π/6 is −210°, from dividing by 360 instead of 180.
      - |
        Correct. −420 · π/180 = −7π/3. (It is coterminal with −π/3.)
      - |
        −4π/3 is −240°; it comes from an arithmetic slip in simplifying 420/180.
      - |
        The size is right, but the angle is negative (clockwise), and the conversion keeps the sign.
    answer: 1
  # ---- Stimulus set B: a bicycle wheel (1.8)
  - slug: trig-u01-exam-q16
    type: multiple_choice
    topic_code: "1.8"
    source: "Original item; Common Core HSF-TF.A.1"
    points: 1
    stimulus: |
      A hypothetical bicycle wheel has a diameter of 70 cm and turns at a steady 150 revolutions per minute while the bicycle rolls without slipping.
    prompt: |
      What is the angular speed of the wheel?
    options:
      - "150π radians per minute"
      - "150 radians per minute"
      - "300π radians per minute"
      - "10,500π radians per minute"
    option_explanations:
      - |
        This counts each revolution as π radians; a full revolution is 2π.
      - |
        This treats one revolution as one radian; each revolution is 2π ≈ 6.28 radians.
      - |
        Correct. ω = 150 · 2π = 300π radians per minute (5π radians per second).
      - |
        10,500π is r · ω with the diameter 70 in place of the radius, and it is a linear speed in cm/min, not an angular speed.
    answer: 2
  - slug: trig-u01-exam-q17
    type: multiple_choice
    topic_code: "1.8"
    source: "Original item; Common Core HSF-TF.A.1"
    points: 1
    stimulus: |
      A hypothetical bicycle wheel has a diameter of 70 cm and turns at a steady 150 revolutions per minute while the bicycle rolls without slipping.
    prompt: |
      What is the linear speed of the bicycle?
    options:
      - "10,500π cm per minute"
      - "21,000π cm per minute"
      - "5,250π cm per minute"
      - "300π cm per minute"
    option_explanations:
      - |
        Correct. v = rω = 35 · 300π = 10,500π ≈ 32,986.72 cm per minute.
      - |
        21,000π uses the diameter 70 cm as the radius, doubling the speed.
      - |
        5,250π uses π radians per revolution, halving the angular speed.
      - |
        300π is the angular speed in radians per minute; multiply by the radius to get a distance per minute.
    answer: 0
  - slug: trig-u01-exam-q18
    type: numeric
    topic_code: "1.8"
    source: "Original item; Common Core HSF-TF.A.1"
    points: 1
    stimulus: |
      A hypothetical bicycle wheel has a diameter of 70 cm and turns at a steady 150 revolutions per minute while the bicycle rolls without slipping.
    prompt: |
      (Calculator.) What is the speed of the bicycle in kilometres per hour, to the nearest hundredth?
    answer: { value: 19.79, tolerance: 0.01 }
    explanation: |
      v = 35 · 300π = 10,500π cm/min ≈ 32,986.72 cm/min. Multiply by 60 minutes per hour (≈ 1,979,203 cm/h) and divide by 100,000 cm per km: about 19.79 km/h.
  - slug: trig-u01-exam-q19
    type: multiple_choice
    topic_code: "1.8"
    source: "Original item; Common Core HSG-C.B.5"
    points: 1
    prompt: |
      A sector of a circle of radius 12 m has a central angle of 75°. What is its area?
    options:
      - "5,400 m²"
      - "5π m²"
      - "30π m²"
      - "60π m²"
    option_explanations:
      - |
        5,400 = ½ · 144 · 75 uses the angle in degrees; A = ½r²θ needs radians.
      - |
        5π is the arc length, rθ = 12 · 5π/12; the area is ½r²θ.
      - |
        Correct. 75° = 5π/12, so A = ½ · 144 · 5π/12 = 30π ≈ 94.25 m².
      - |
        60π is r²θ = 144 · 5π/12, missing the factor ½.
    answer: 2
  - slug: trig-u01-exam-q20
    type: multiple_choice
    topic_code: "1.8"
    source: "Original item; Common Core HSG-C.B.5"
    points: 1
    prompt: |
      An arc of length 10π cm lies on a circle of radius 15 cm. What is the central angle in degrees?
    options:
      - "150π°"
      - "1.5°"
      - "240°"
      - "120°"
    option_explanations:
      - |
        150π multiplies s by r; the angle is s/r.
      - |
        1.5 is r/s with π dropped; the angle is s/r = 10π/15.
      - |
        240° comes from 4π/3, doubling the correct radian angle 2π/3.
      - |
        Correct. θ = s/r = 10π/15 = 2π/3 radians, which is 2π/3 · 180/π = 120°.
    answer: 3
  # ---- Stimulus set C: an angle through a point (1.9, 1.10)
  - slug: trig-u01-exam-q21
    type: multiple_choice
    topic_code: "1.9"
    source: "Original item; Common Core HSF-TF.A.2"
    points: 1
    stimulus: |
      The terminal side of an angle θ in standard position passes through the point (12, −5).
    prompt: |
      What is cos θ?
    options:
      - "12/13"
      - "−5/13"
      - "−12/13"
      - "12/5"
    option_explanations:
      - |
        Correct. r = √(144 + 25) = 13, and cos θ = x/r = 12/13, positive in quadrant IV.
      - |
        −5/13 is y/r, which is sin θ; cosine uses the x-coordinate.
      - |
        x = 12 is positive and r is positive, so cosine is positive; the point is in quadrant IV.
      - |
        12/5 is x/y with the sign dropped; cosine is x/r.
    answer: 0
  - slug: trig-u01-exam-q22
    type: multiple_choice
    topic_code: "1.9"
    source: "Original item; Common Core HSF-TF.A.2"
    points: 1
    stimulus: |
      The terminal side of an angle θ in standard position passes through the point (12, −5).
    prompt: |
      What is cot θ?
    options:
      - "−5/12"
      - "−12/5"
      - "12/5"
      - "−13/5"
    option_explanations:
      - |
        −5/12 is y/x, which is tan θ; cotangent is its reciprocal.
      - |
        Correct. cot θ = x/y = 12/(−5) = −12/5, the reciprocal of tan θ.
      - |
        y = −5 is negative, so x/y is negative; cotangent is negative in quadrant IV.
      - |
        −13/5 is r/y, which is csc θ; cotangent is x/y.
    answer: 1
  - slug: trig-u01-exam-q23
    type: multiple_choice
    topic_code: "1.10"
    source: "Original item; Common Core HSF-TF.A.2"
    points: 1
    stimulus: |
      The terminal side of an angle θ in standard position passes through the point (12, −5).
    prompt: |
      Which of these is positive?
    options:
      - "sin θ"
      - "sec θ"
      - "tan θ"
      - "csc θ"
    option_explanations:
      - |
        sin θ = −5/13 is negative: y is negative in quadrant IV.
      - |
        Correct. In quadrant IV only cosine and secant are positive; sec θ = 13/12.
      - |
        tan θ = −5/12 is negative, since x and y have opposite signs.
      - |
        csc θ = −13/5 has the same sign as sine, negative in quadrant IV.
    answer: 1
  # ---- Stimulus set D: an angle given by its cosine (1.12)
  - slug: trig-u01-exam-q24
    type: multiple_choice
    topic_code: "1.12"
    source: "Original item; Common Core HSF-TF.C.8"
    points: 1
    stimulus: |
      An angle θ satisfies cos θ = −2/3, and θ is in quadrant III.
    prompt: |
      What is sin θ?
    options:
      - "−√5/3"
      - "√5/3"
      - "−1/3"
      - "−5/9"
    option_explanations:
      - |
        Correct. sin²θ = 1 − 4/9 = 5/9, so sin θ = ±√5/3, and sine is negative in quadrant III.
      - |
        √5/3 is the right size, but in quadrant III sine is negative.
      - |
        −1/3 = −(1 − 2/3) subtracts cosine instead of cosine squared.
      - |
        −5/9 is sin²θ with a sign attached; take the square root first.
    answer: 0
  - slug: trig-u01-exam-q25
    type: multiple_choice
    topic_code: "1.12"
    source: "Original item; Common Core HSF-TF.C.8"
    points: 1
    stimulus: |
      An angle θ satisfies cos θ = −2/3, and θ is in quadrant III.
    prompt: |
      What is tan θ?
    options:
      - "−√5/2"
      - "2/√5"
      - "−2√5/5"
      - "√5/2"
    option_explanations:
      - |
        The size is right, but sine and cosine are both negative in quadrant III, so their quotient is positive.
      - |
        2/√5 is cos θ/sin θ, which is cot θ; tangent is sin θ/cos θ.
      - |
        This is cot θ with the wrong sign; tangent is sin θ/cos θ.
      - |
        Correct. tan θ = sin θ/cos θ = (−√5/3)/(−2/3) = √5/2, positive in quadrant III.
    answer: 3
  - slug: trig-u01-exam-q26
    type: multiple_choice
    topic_code: "1.12"
    source: "Original item; Common Core HSF-TF.A.4"
    points: 1
    stimulus: |
      An angle θ satisfies cos θ = −2/3, and θ is in quadrant III.
    prompt: |
      What is sec(−θ)?
    options:
      - "3/2"
      - "−2/3"
      - "−3/2"
      - "−3/√5"
    option_explanations:
      - |
        3/2 treats secant as odd; secant, like cosine, is even, so the sign does not change.
      - |
        −2/3 is cos(−θ); secant is its reciprocal.
      - |
        Correct. Secant is even, so sec(−θ) = sec θ = 1/cos θ = −3/2.
      - |
        −3/√5 is 1/sin θ = csc θ, not the secant.
    answer: 2
  # ---- Any angle, the unit circle and identities (1.9 to 1.12)
  - slug: trig-u01-exam-q27
    type: multiple_choice
    topic_code: "1.10"
    source: "Original item; Common Core HSF-TF.A.3"
    points: 1
    prompt: |
      What is the reference angle of 13π/9?
    options:
      - "5π/9"
      - "4π/9"
      - "π/18"
      - "17π/18"
    option_explanations:
      - |
        5π/9 = 2π − 13π/9 uses the quadrant IV rule; 13π/9 is in quadrant III, and 5π/9 is not acute.
      - |
        Correct. 13π/9 lies between π = 9π/9 and 3π/2 = 13.5π/9, so it is in quadrant III and θ′ = 13π/9 − π = 4π/9.
      - |
