    options:
      - "cos x"
      - "sec x"
      - "1"
      - "cot x"
    option_explanations:
      - |
        cos x is the reciprocal of the simplified result; the cos x is left in the denominator.
      - |
        Correct. csc x · tan x = (1/sin x)(sin x/cos x) = 1/cos x = sec x.
      - |
