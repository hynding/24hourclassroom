  - slug: trig-u01-exam-q44
    type: short_answer
    topic_code: "1.12"
    source: "Original item; Common Core HSF-TF.C.8"
    points: 3
    prompt: |
      (a) Starting from sin²θ + cos²θ = 1, derive the identity 1 + cot²θ = csc²θ, and state where it holds.
      (b) cot θ = −2 and θ is in quadrant IV. Use the identity from (a) to find csc θ exactly, and explain the sign.
      (c) Find sin θ and cos θ exactly, with rationalised denominators.
    answer: |
      (a) Divide every term by sin²θ: sin²θ/sin²θ + cos²θ/sin²θ = 1/sin²θ, that is 1 + cot²θ = csc²θ. It holds wherever sin θ ≠ 0.
      (b) csc²θ = 1 + (−2)² = 5, so csc θ = ±√5. In quadrant IV sine is negative, and csc θ has the sign of sine, so csc θ = −√5.
      (c) sin θ = 1/csc θ = −1/√5 = −√5/5. cos θ = cot θ · sin θ = (−2)(−√5/5) = 2√5/5. (Check: 1/5 + 4/5 = 1.)
    explanation: |
      Three points, one per part. (a) the division by sin²θ shown, with the restriction sin θ ≠ 0. (b) −√5 with the sign justified by quadrant IV. (c) both values, rationalised and with correct signs; follow-through from an error in (b) earns this point if the work is consistent.
  - slug: trig-u01-exam-q45
    type: short_answer
    topic_code: "1.10"
    source: "Original item; Common Core HSF-TF.A.3"
    points: 3
    prompt: |
      Find each exact value. For each, state the reference angle and the quadrant you used.

      (a) cos 330°
      (b) tan(−5π/4)
      (c) csc(2π/3)
    answer: |
      (a) 330° is in quadrant IV with reference angle 30°; cosine is positive there: cos 330° = cos 30° = √3/2.
      (b) −5π/4 + 2π = 3π/4, in quadrant II with reference angle π/4; tangent is negative there: tan(−5π/4) = −tan(π/4) = −1.
      (c) 2π/3 is in quadrant II with reference angle π/3; sine (and so cosecant) is positive there: csc(2π/3) = 1/sin(π/3) = 2/√3 = 2√3/3.
    explanation: |
      Three points, one per part, each needing the correct value with a correct reference angle and quadrant: (a) √3/2; (b) −1; (c) 2√3/3 (accept 2/√3).
  - slug: trig-u01-exam-q46
    type: long_answer
    topic_code: "1.6"
    source: "Original item; Common Core HSG-SRT.C.8"
    points: 6
    prompt: |
      (Calculator.) A ranger stands at the top of a hypothetical fire tower, 30 m above level ground. She sees smoke on the ground at an angle of depression of 8°, on a bearing of 120° from the tower.

      (A) (i) Find the horizontal distance from the base of the tower to the smoke, to the nearest hundredth of a metre.
      (ii) Explain why the angle of depression from the ranger equals the angle of elevation from the smoke to the ranger.

      (B) (i) Find how far east and how far south of the tower's base the smoke is, each to the nearest hundredth of a metre.
      (ii) Write the bearing 120° in the form N or S, an angle, then E or W.

      (C) Later, she sees the smoke on the same bearing at an angle of depression of 5°.
      (i) How much farther from the tower is the smoke now, to the nearest hundredth of a metre?
      (ii) Explain, using the tangent ratio, why a smaller angle of depression means the smoke is farther away.
    answer: |
      (A) (i) tan 8° = 30/d, so d = 30/tan 8° ≈ 213.46 m.
      (ii) The ranger's horizontal line of sight and the ground are parallel, and the line of sight to the smoke crosses both. The angle of depression and the angle of elevation are alternate interior angles, so they are equal; that is why 8° can be used in the right triangle at the smoke.
      (B) (i) A bearing of 120° is 60° east of due south (180° − 120° = 60°). East: 213.46 sin 60° ≈ 184.86 m. South: 213.46 cos 60° ≈ 106.73 m.
      (ii) S 60° E.
      (C) (i) The new distance is 30/tan 5° ≈ 342.90 m, so the smoke is about 342.90 − 213.46 = 129.44 m farther away.
      (ii) The distance is d = 30/tan θ. As the acute angle θ gets smaller, tan θ gets smaller (the ratio of the 30 m height to the distance shrinks), so dividing 30 by a smaller number gives a larger distance.
    explanation: |
      Six points. (A) 1 point for 213.46 m (accept within 0.01); 1 point for the parallel-lines (alternate angles) reason. (B) 1 point for both 184.86 m east and 106.73 m south (follow-through from (A)); 1 point for S 60° E. (C) 1 point for 129.44 m (accept 129.43–129.45 from rounded intermediate values); 1 point for an explanation that tan θ decreases as θ decreases, so 30/tan θ increases.
  - slug: trig-u01-exam-q47
    type: long_answer
    topic_code: "1.11"
    source: "Original item; Common Core HSF-TF.A.2"
    points: 6
    prompt: |
      A hypothetical Ferris wheel has a radius of 20 m. On a coordinate grid in metres with its centre at the origin, a rider starts at (20, 0) and the wheel turns counterclockwise at a steady rate of one revolution every 6 minutes.

      (A) (i) Find the angular speed of the wheel in radians per minute, exactly.
      (ii) Find the rider's linear speed in metres per minute, exactly and to the nearest hundredth.

      (B) (i) Find the angle the rider has turned through after 2.5 minutes, and the rider's exact coordinates at that moment.
      (ii) Explain how you used the unit circle to get the coordinates.

      (C) (i) Find the rider's exact coordinates after 13 minutes, and the distance the rider has travelled along the circle, exactly and to the nearest hundredth of a metre.
      (ii) Explain why the rider is in the same position after 13 minutes as after 1 minute.
    answer: |
      (A) (i) ω = 2π/6 = π/3 radians per minute.
      (ii) v = rω = 20 · π/3 = 20π/3 ≈ 20.94 m per minute.
      (B) (i) θ = (π/3)(2.5) = 5π/6. The rider is at (20 cos(5π/6), 20 sin(5π/6)) = (20 · (−√3/2), 20 · 1/2) = (−10√3, 10).
      (ii) The unit-circle point for 5π/6 is (−√3/2, 1/2): quadrant II, reference angle π/6. A circle of radius 20 scales both coordinates by 20.
      (C) (i) θ = (π/3)(13) = 13π/3 = 4π + π/3, so the rider is at (20 cos(π/3), 20 sin(π/3)) = (10, 10√3). Distance travelled: s = rθ = 20 · 13π/3 = 260π/3 ≈ 272.27 m.
      (ii) The wheel's period is 6 minutes, so 13 minutes is two full revolutions (12 minutes) plus 1 minute. After whole turns the rider is back where the turn began, and 13π/3 is coterminal with π/3; cosine and sine have period 2π.
    explanation: |
      Six points. (A) 1 point for π/3 rad/min; 1 point for 20π/3 ≈ 20.94 m/min. (B) 1 point for 5π/6 and (−10√3, 10); 1 point for an explanation using the unit-circle point (quadrant and reference angle) scaled by the radius. (C) 1 point for (10, 10√3) and 260π/3 ≈ 272.27 m (both needed); 1 point for linking the 6-minute period, or removing 4π, to the repeated position.
