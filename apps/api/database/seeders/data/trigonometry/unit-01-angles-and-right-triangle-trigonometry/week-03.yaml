week: 3
unit: 1
title: "Solving Right Triangles and Applications"
topics: ["1.5", "1.6"]
guide: guides/week-03.md
guide_description: |
  Solving a right triangle from one side and an acute angle or from two sides, choosing the ratio that links
  the known and unknown parts, dividing when the unknown is in the denominator, and using sin⁻¹, cos⁻¹ and
  tan⁻¹ on a calculator as "the angle whose ratio is"; then angles of elevation and depression, two-triangle
  problems where an observer moves closer, and bearings as quadrant bearings (N 35° E) and three-digit azimuths
  (035°). Worked examples: a triangle with A = 34° and c = 20, a triangle from legs 7 and 11, a building's height
  from an instrument 1.6 m up, a boat seen from a lighthouse, a radio mast from two sightings, and two ships'
  courses turned into distances and bearings.
flashcards_description: |
  30 cards on choosing a ratio, solving for sides and angles, inverse ratios on a calculator, angles of
  elevation and depression, two-triangle problems, and quadrant bearings and azimuths.

flashcards:
  - front: Solve a right triangle → what the answer must include
    back: |
      All three sides and all three angles. With C = 90°, find a, b, c and A, B.
    topic_code: "1.5"
  - front: Routine for solving a right triangle → four steps
    back: |
      Sketch and label; pick a ratio linking a known side, a known angle and the unknown; solve; get the other angle from A + B = 90° and check with the Pythagorean theorem.
    topic_code: "1.5"
  - front: Right triangle with A = 34°, c = 20 → a and b
    back: |
      a = 20 sin 34° ≈ 11.18 and b = 20 cos 34° ≈ 16.58; B = 56°.
    topic_code: "1.5"
  - front: Right triangle with legs a = 7, b = 11 → angle A
    back: |
      tan A = 7/11, so A = tan⁻¹(7/11) ≈ 32.47°; B ≈ 57.53° and c = √170 ≈ 13.04.
    topic_code: "1.5"
  - front: Unknown side in the denominator, e.g. sin 28° = 9/c → how to solve
    back: |
      Multiply both sides by c, then divide: c = 9/sin 28° ≈ 19.17. Not 9 sin 28°.
    topic_code: "1.5"
  - front: Sense check for a computed hypotenuse → what must be true
    back: |
      It must be longer than both legs. If it comes out shorter, you multiplied where you should have divided.
    topic_code: "1.5"
  - front: sin⁻¹(0.6) in a right-triangle problem → how to read it
    back: |
      "The acute angle whose sine is 0.6", about 36.87°. It is not 1/sin 0.6; that would be csc.
    topic_code: "1.5"
  - front: Which inverse key to use for an angle → how to decide
    back: |
      Look at the two known sides relative to the angle: opposite and hypotenuse → sin⁻¹; adjacent and hypotenuse → cos⁻¹; opposite and adjacent → tan⁻¹.
    topic_code: "1.5"
  - front: Acute angle A with sin A = 4/9 → value
    back: |
      A = sin⁻¹(4/9) ≈ 26.4°.
    topic_code: "1.5"
  - front: Calculator mode for this unit → setting and quick test
    back: |
      Degree mode. Test: sin 30 should give 0.5. In radian mode sin 34 shows about 0.53 instead of 0.56.
    topic_code: "1.5"
  - front: Rounding in a multi-step triangle problem → when to round
    back: |
      Only at the end. Keep full calculator values (or stored memory) through the middle steps.
    topic_code: "1.5"
  - front: Angle of elevation → measured from where to where
    back: |
      From the horizontal through the observer's eye up to the line of sight.
    topic_code: "1.6"
  - front: Angle of depression → measured from where to where
    back: |
      From the horizontal through the observer's eye down to the line of sight. Never from the vertical.
    topic_code: "1.6"
  - front: Angle of depression from A to B vs angle of elevation from B to A → relationship
    back: |
      Equal: they are alternate interior angles between parallel horizontal lines.
    topic_code: "1.6"
  - front: Instrument 1.6 m high, 50 m from a building, elevation 38° → building height
    back: |
      50 tan 38° ≈ 39.06 m above the instrument, plus 1.6 m: about 40.66 m.
    topic_code: "1.6"
  - front: 32 m lighthouse, angle of depression 9° to a boat → distance to the boat
    back: |
      tan 9° = 32/x, so x = 32/tan 9° ≈ 202.04 m.
    topic_code: "1.6"
  - front: Two-triangle height problem (elevations 25° and 35°, 40 m apart) → the setup
    back: |
      h = d tan 35° and h = (d + 40) tan 25°. Equate, solve d = 40 tan 25°/(tan 35° − tan 25°) ≈ 79.74 m, then h ≈ 55.84 m.
    topic_code: "1.6"
  - front: Observer walks towards a tower → how the angle of elevation changes
    back: |
      It increases: the same height over a shorter horizontal distance makes a steeper line of sight.
    topic_code: "1.6"
  - front: Quadrant bearing such as N 35° E → how to read it
    back: |
      Face north, then turn 35° towards east. The first letter is N or S, the last is E or W, and the angle is acute.
    topic_code: "1.6"
  - front: Azimuth (three-digit bearing) → definition
    back: |
      An angle from 000° to 360° measured clockwise from north, written with three digits: 035°, 122°, 288°.
    topic_code: "1.6"
  - front: Converting S 58° E, S 40° W and N 72° W to azimuths → rules
    back: |
      S θ E → 180° − θ (122°); S θ W → 180° + θ (220°); N θ W → 360° − θ (288°); N θ E → θ.
    topic_code: "1.6"
  - front: Azimuths of due east, south and west → values
    back: |
      090°, 180° and 270°. Due north is 000° (or 360°).
    topic_code: "1.6"
  - front: Azimuth 035° vs a standard-position angle of 35° → difference
    back: |
      Azimuth starts at north and turns clockwise; standard position starts at east and turns counterclockwise. 035° is a standard-position angle of 55°.
    topic_code: "1.6"
  - front: Ship sails 12 km on bearing 035° → north and east distances
    back: |
      North 12 cos 35° ≈ 9.83 km; east 12 sin 35° ≈ 6.88 km. The bearing angle is measured from north, so north uses cosine.
    topic_code: "1.6"
  - front: 8 km east then 5 km south → distance and bearing from the start
    back: |
      √89 ≈ 9.43 km. tan θ = 8/5 measured from south towards east: θ ≈ 58.0°, so S 58.0° E, azimuth ≈ 122.0°.
    topic_code: "1.6"
  - front: Bearing back to the start after sailing on azimuth 140° → reverse bearing
    back: |
      Add or subtract 180°: 140° + 180° = 320°, which is N 40° W.
    topic_code: "1.6"
  - front: Height of an object from an observer's eye level → what to add
    back: |
      The observer's (or instrument's) eye height, when the angle is measured from eye level rather than the ground.
    topic_code: "1.6"
  - front: Error-spot → "c = 9 sin 28° because sin 28° = 9/c"
    back: |
      The unknown is in the denominator, so divide: c = 9/sin 28° ≈ 19.17. 9 sin 28° ≈ 4.23 is shorter than the leg, which is impossible.
    topic_code: "1.5"
  - front: Error-spot → "the angle of depression is measured down from the vertical wall"
    back: |
      It is measured down from the horizontal. An angle from the vertical is its complement.
    topic_code: "1.6"
  - front: Error-spot → "a bearing of 060° means 60° counterclockwise from east"
    back: |
      Azimuths start at north and turn clockwise: 060° is N 60° E, which is 30° above east.
    topic_code: "1.6"

quiz:
  description: |
    23 questions · about 45 minutes · mostly on this week (topics 1.5 and 1.6: solving right triangles, inverse
    ratios on a calculator, angles of elevation and depression, two-triangle problems and bearings), with about
    30% reviewing weeks 1 and 2 (DMS, special right triangles, the six ratios and cofunctions). Includes a
    shared-context set on a cliff and two buoys. Multiple choice, select-all, true/false and numeric items are
    graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are
    graded by your teacher against the scoring notes. Items marked (Calculator.) need a calculator in degree
    mode; the rest are designed to be done by hand.
  questions:
    # ---- Stimulus set: a cliff and two buoys (1.6)
    - slug: trig-u01-w03-q01
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      stimulus: |
        An observer stands at the top of a hypothetical vertical cliff, 45 m above sea level (ignore the observer's height). Two buoys float on a straight line out from the foot of the cliff. The angle of depression from the observer to the nearer buoy is 14°, and to the farther buoy it is 8°.
      prompt: |
        What is the angle of elevation from the nearer buoy up to the observer?
      options:
        - "76°"
        - "104°"
        - "8°"
        - "14°"
      option_explanations:
        - |
          76° is the complement of 14°, the angle measured from the vertical cliff rather than from the horizontal.
        - |
          104° = 90° + 14° is not an angle in the right triangle; elevation is an acute angle above the horizontal.
        - |
          8° is the angle of depression to the farther buoy, not the nearer one.
        - |
          Correct. The horizontal through the observer is parallel to the sea, so the angle of depression and the angle of elevation are alternate interior angles: both 14°.
      answer: 3
    - slug: trig-u01-w03-q02
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      stimulus: |
        An observer stands at the top of a hypothetical vertical cliff, 45 m above sea level (ignore the observer's height). Two buoys float on a straight line out from the foot of the cliff. The angle of depression from the observer to the nearer buoy is 14°, and to the farther buoy it is 8°.
      prompt: |
        (Calculator.) To the nearest hundredth of a metre, how far is the nearer buoy from the foot of the cliff?
      options:
        - "11.22 m"
        - "180.49 m"
        - "186.01 m"
        - "43.66 m"
      option_explanations:
        - |
          11.22 = 45 tan 14° multiplies by the tangent; the unknown distance is in the denominator of tan 14° = 45/x.
        - |
          Correct. At the buoy, tan 14° = 45/x, so x = 45/tan 14° ≈ 180.49 m.
        - |
          186.01 = 45/sin 14° is the length of the line of sight (the hypotenuse), not the distance along the water.
        - |
          43.66 = 45 cos 14° treats 45 m as a hypotenuse; 45 m is the cliff, the leg opposite the 14° angle.
      answer: 1
    - slug: trig-u01-w03-q03
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      stimulus: |
        An observer stands at the top of a hypothetical vertical cliff, 45 m above sea level (ignore the observer's height). Two buoys float on a straight line out from the foot of the cliff. The angle of depression from the observer to the nearer buoy is 14°, and to the farther buoy it is 8°.
      prompt: |
        (Calculator.) To the nearest hundredth of a metre, how far apart are the two buoys?
      options:
        - "139.71 m"
        - "320.19 m"
        - "428.15 m"
        - "4.90 m"
      option_explanations:
        - |
          Correct. Farther buoy: 45/tan 8° ≈ 320.19 m. Nearer: 45/tan 14° ≈ 180.49 m. The difference is ≈ 139.71 m.
        - |
          320.19 m is the distance from the cliff to the farther buoy; subtract the nearer buoy's distance.
        - |
          This uses one triangle with the 6° difference between the angles, but no right triangle has a 6° angle at a buoy.
        - |
          4.90 = 45(tan 14° − tan 8°) multiplies by tangents; each distance is 45 divided by a tangent.
      answer: 0
    # ---- Topics 1.5 and 1.6
    - slug: trig-u01-w03-q04
      type: multiple_choice
      topic_code: "1.5"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        (Calculator.) In right triangle ABC with the right angle at C, A = 28° and a = 9. To the nearest hundredth, what is the hypotenuse c?
      options:
        - "4.23"
        - "10.19"
        - "19.17"
        - "16.93"
      option_explanations:
        - |
          4.23 = 9 sin 28° multiplies when the unknown is the denominator of sin 28° = 9/c; it is shorter than the leg.
        - |
          10.19 = 9/cos 28° uses cosine, but a = 9 is opposite A, not adjacent to it.
        - |
          Correct. sin 28° = 9/c, so c = 9/sin 28° ≈ 19.17.
        - |
          16.93 = 9/tan 28° is the other leg b, not the hypotenuse.
      answer: 2
    - slug: trig-u01-w03-q05
      type: multiple_choice
      topic_code: "1.5"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        (Calculator.) In right triangle ABC with the right angle at C, a = 5 and c = 13. To the nearest tenth of a degree, what is angle A?
      options:
        - "22.6°"
        - "21.0°"
        - "67.4°"
        - "0.4°"
      option_explanations:
        - |
          Correct. a is opposite A and c is the hypotenuse, so A = sin⁻¹(5/13) ≈ 22.6°.
        - |
          21.0° = tan⁻¹(5/13) uses tangent, but 13 is the hypotenuse, not the adjacent leg (which is 12).
        - |
          67.4° = cos⁻¹(5/13) is angle B; 5 is adjacent to B but opposite A.
        - |
          0.4 is sin⁻¹(5/13) in radians (≈ 0.395); the calculator was in radian mode instead of degree mode.
      answer: 0
    - slug: trig-u01-w03-q06
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        What is the quadrant bearing S 25° W written as a three-digit azimuth?
      options:
        - "155°"
        - "245°"
        - "205°"
        - "335°"
      option_explanations:
        - |
          155° = 180° − 25° is S 25° E; turning from south towards west adds to 180°.
        - |
          245° = 270° − 25° is 25° south of west, which is S 65° W, not S 25° W.
        - |
          Correct. Azimuths run clockwise from north; south is 180°, and 25° further towards west gives 205°.
        - |
          335° = 360° − 25° is N 25° W; this starts from north instead of south.
      answer: 2
    - slug: trig-u01-w03-q07
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        (Calculator.) A kite is flown on a taut string 60 m long, held at ground level. The string makes an angle of elevation of 50°. To the nearest hundredth of a metre, how high is the kite?
      options:
        - "38.57 m"
        - "71.51 m"
        - "78.32 m"
        - "45.96 m"
      option_explanations:
        - |
          38.57 = 60 cos 50° is the horizontal distance to the point below the kite; height is opposite the 50° angle.
        - |
          71.51 = 60 tan 50° treats the string as the horizontal leg, but the string is the hypotenuse.
        - |
          78.32 = 60/sin 50° divides; the hypotenuse is known here, so the height is 60 times the sine.
        - |
          Correct. The string is the hypotenuse and the height is opposite 50°: 60 sin 50° ≈ 45.96 m.
      answer: 3
    - slug: trig-u01-w03-q08
      type: multiple_choice
      topic_code: "1.5"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        In right triangle ABC with the right angle at C, A = 40° and c = 15. Which equation gives the length of b, the leg adjacent to A?
      options:
        - "b = 15 sin 40°"
        - "b = 15 cos 40°"
        - "b = 15 tan 40°"
        - "b = 15/cos 40°"
      option_explanations:
        - |
          15 sin 40° ≈ 9.64 is the leg opposite A, which is a, not b.
        - |
          Correct. cos 40° = b/15 (adjacent over hypotenuse), so b = 15 cos 40° ≈ 11.49.
        - |
          Tangent compares the two legs; using it with the hypotenuse 15 treats c as a leg.
        - |
          15/cos 40° is longer than the hypotenuse; divide only when the unknown is in the denominator.
      answer: 1
    # ---- Spiral review (weeks 1 and 2)
    - slug: trig-u01-w03-q09
      type: multiple_choice
      topic_code: "1.3"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      prompt: |
        θ is acute and tan θ = 9/40. What is cos θ?
      options:
        - "9/41"
        - "40/41"
        - "41/40"
        - "40/9"
      option_explanations:
        - |
          9/41 is opposite/hypotenuse, which is sin θ.
        - |
          Correct. The hypotenuse is √(81 + 1600) = 41, so cos θ = adjacent/hypotenuse = 40/41.
        - |
          41/40 is hypotenuse/adjacent, which is sec θ, the reciprocal of the cosine.
        - |
          40/9 is cot θ, the reciprocal of the tangent, and no cosine can exceed 1.
      answer: 1
    - slug: trig-u01-w03-q10
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; Common Core HSG-SRT.C.7"
      points: 1
      prompt: |
        Which expression is equal to cos 18°?
      options:
        - "sin 18°"
        - "cos 72°"
        - "sin 162°"
        - "sin 72°"
      option_explanations:
        - |
          Sine and cosine of the same acute angle are equal only at 45°; 18° is not 45°.
        - |
          cos 72° keeps the same function; a cofunction identity switches the function as well as the angle.
        - |
          162° = 180° − 18° is the supplement; cofunctions pair complementary angles.
        - |
          Correct. 18° + 72° = 90°, and cos θ = sin(90° − θ), so cos 18° = sin 72°.
      answer: 3
    - slug: trig-u01-w03-q11
      type: multiple_choice
      topic_code: "1.2"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      prompt: |
        A 30°-60°-90° triangle has a hypotenuse of 16. What is the exact length of the leg opposite the 60° angle?
      options:
        - "8√3"
        - "8"
        - "16√3"
        - "8√2"
      option_explanations:
        - |
          Correct. The short leg is 16/2 = 8, and the long leg (opposite 60°) is 8√3.
        - |
          8 is the short leg, opposite 30°; the leg opposite 60° is longer.
        - |
          16√3 multiplies the hypotenuse by √3; a leg can never be longer than the hypotenuse.
        - |
          8√2 uses the 45°-45°-90° pattern, which does not apply to a 30°-60°-90° triangle.
      answer: 0
    - slug: trig-u01-w03-q12
      type: multiple_choice
      topic_code: "1.1"
      source: "Original item; Common Core HSF-TF.A.2 (extension)"
      points: 1
      prompt: |
        A surveyor records a hypothetical angle of 47.65°. What is it in degrees and minutes?
      options:
        - "47°65′"
        - "48°5′"
        - "47°39′"
        - "47°6′30″"
      option_explanations:
        - |
          47°65′ copies the decimal digits as minutes, and 65′ is not even a valid minute count (it exceeds 60).
        - |
          48°5′ treats .65 as 65 minutes and then carries 60′ into a degree; the decimal must be multiplied by 60 first.
        - |
          Correct. 0.65 × 60 = 39′, so 47.65° = 47°39′.
        - |
          This multiplies 0.065 instead of 0.65 by 60, a misplaced decimal point.
      answer: 2
    - slug: trig-u01-w03-q13
      type: multi_select
      topic_code: "1.3"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 2
      partial_credit: true
      prompt: |
        θ is an acute angle with cos θ = 0.28. Which statements about the other ratios of θ are true? Select all that apply.
      options:
        - "sin θ = 0.96"
        - "tan θ = 7/24"
        - "sec θ = 25/7"
        - "cot θ = 24/7"
        - "sin(90° − θ) = 0.96"
      option_explanations:
        - |
          Correct. cos θ = 7/25, so the triangle is 7-24-25 and sin θ = 24/25 = 0.96.
        - |
          7/24 is adjacent/opposite, which is cot θ; tan θ = opposite/adjacent = 24/7.
        - |
          Correct. sec θ = 1/cos θ = 1/0.28 = 25/7.
        - |
          24/7 is tan θ; cotangent is its reciprocal, 7/24.
        - |
          sin(90° − θ) = cos θ by the cofunction identity, so it equals 0.28, not 0.96.
      answer: [0, 2]
    - slug: trig-u01-w03-q14
      type: multi_select
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about bearings and azimuths are true? Select all that apply.
      options:
        - "An azimuth of 120° is the same direction as S 60° E."
        - "N 30° W is the same direction as an azimuth of 330°."
        - "An azimuth of 060° points in the same direction as a standard-position angle of 60°."
        - "Due west is an azimuth of 090°."
        - "S 20° W is the same direction as an azimuth of 160°."
      option_explanations:
        - |
          Correct. 120° clockwise from north is 60° short of south, on the east side: S 60° E.
        - |
          Correct. N 30° W turns 30° from north towards west, which is 360° − 30° = 330° clockwise.
        - |
          060° is clockwise from north, which is 30° above east: a standard-position angle of 30°, not 60°.
        - |
          090° is due east; turning clockwise from north reaches west at 270°.
        - |
          160° is S 20° E; turning from south towards west adds to 180°, giving 200°.
      answer: [0, 1]
    - slug: trig-u01-w03-q15
      type: true_false
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        True or false: If the angle of depression from a window to a bench is 20°, then the angle of elevation from the bench to the window is 70°.
      answer: false
      explanation: |
        False. Both angles are measured from horizontal lines, which are parallel, so they are alternate interior angles and are equal: the angle of elevation is also 20°. 70° would be the angle measured from the vertical wall.
    - slug: trig-u01-w03-q16
      type: true_false
      topic_code: "1.3"
      source: "Original item; Common Core HSG-SRT.C.6"
      points: 1
      prompt: |
        True or false: Because cot θ = 1/tan θ, the exact value of cot 60° is √3/3.
      answer: true
      explanation: |
        True. tan 60° = √3, so cot 60° = 1/√3 = √3/3. It also equals tan 30°, by the cofunction identity.
    - slug: trig-u01-w03-q17
      type: fill_blank
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        The quadrant bearing N 72° W, written as a three-digit azimuth, is ____ degrees.
      answer: ["288", "288°", "288 degrees"]
      explanation: |
        Azimuths are measured clockwise from north. N 72° W is 72° counterclockwise from north, which is 360° − 72° = 288° clockwise.
    - slug: trig-u01-w03-q18
      type: fill_blank
      topic_code: "1.4"
      source: "Original item; Common Core HSG-SRT.C.7"
      points: 1
      prompt: |
        If sin(x + 12°) = cos 40° and x + 12° is acute, then x = ____ degrees.
      answer: ["38", "38°", "38 degrees"]
      explanation: |
        sin(x + 12°) = cos 40° when x + 12° is the complement of 40°, that is 50°. So x = 38°.
    - slug: trig-u01-w03-q19
      type: numeric
      topic_code: "1.5"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        (Calculator.) A hypothetical wheelchair ramp rises 0.9 m over a horizontal run of 10.8 m. To the nearest tenth of a degree, what angle does the ramp make with the ground?
      answer: { value: 4.8, tolerance: 0.05 }
      explanation: |
        The rise is opposite the angle and the run is adjacent, so tan θ = 0.9/10.8 and θ = tan⁻¹(0.9/10.8) ≈ 4.76°, which is 4.8°.
    - slug: trig-u01-w03-q20
      type: numeric
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        (Calculator.) From a point on level ground, the angle of elevation to the top of a hypothetical water tower is 22°. After walking 50 m straight towards the tower, the angle of elevation is 37°. To the nearest tenth of a metre, how tall is the tower? (Measure the angles from ground level.)
      answer: { value: 43.6, tolerance: 0.1 }
      explanation: |
        Let d be the distance from the second point to the base and h the height. Then h = d tan 37° and h = (d + 50) tan 22°. Equating: d = 50 tan 22°/(tan 37° − tan 22°) ≈ 57.80 m, so h = d tan 37° ≈ 43.55 m, which is 43.6 m.
    - slug: trig-u01-w03-q21
      type: short_answer
      topic_code: "1.5"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 3
      prompt: |
        (Calculator.) In right triangle ABC with the right angle at C, B = 63° and b = 14.

        (a) Find angle A.
        (b) Find side a to the nearest hundredth, showing the ratio you used.
        (c) Find the hypotenuse c to the nearest hundredth, and check your three sides with the Pythagorean theorem.
      answer: |
        (a) A = 90° − 63° = 27°.
        (b) From B, side b = 14 is opposite and side a is adjacent: tan 63° = 14/a, so a = 14/tan 63° ≈ 7.13. (Equivalently, tan 27° = a/14, so a = 14 tan 27°.)
        (c) sin 63° = 14/c, so c = 14/sin 63° ≈ 15.71. Check: 7.13² + 14² ≈ 50.88 + 196 = 246.88, and 15.71² ≈ 246.8, which agree to rounding.
      explanation: |
        Three points, one per part. (a) 27°. (b) 7.13 with a correct ratio (dividing by tan 63° or multiplying by tan 27°). (c) 15.71 with a Pythagorean check that agrees to rounding.
    - slug: trig-u01-w03-q22
      type: short_answer
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 3
      prompt: |
        (Calculator.) A hypothetical hiker walks 5 km in a straight line on an azimuth of 140°.

        (a) Write the hiker's direction as a quadrant bearing.
        (b) How far south and how far east of the start does she end, to the nearest hundredth of a kilometre?
        (c) Give the azimuth she must follow to walk straight back to the start, and explain how you found it.
      answer: |
        (a) 140° is 40° short of south on the east side: S 40° E.
        (b) The angle at the start between due south and her path is 40°, and the 5 km path is the hypotenuse. South: 5 cos 40° ≈ 3.83 km. East: 5 sin 40° ≈ 3.21 km.
        (c) The return direction is opposite, so add 180°: 140° + 180° = 320° (N 40° W).
      explanation: |
        Three points, one per part. (a) S 40° E. (b) 3.83 km south and 3.21 km east (both needed, not swapped). (c) 320° or N 40° W, with the reason that the reverse direction differs by 180°.
    - slug: trig-u01-w03-q23
      type: long_answer
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 6
      prompt: |
        (Calculator.) An inspector stands on level ground 120 m from the base of a hypothetical wind turbine tower. The angle of elevation from the ground at her position to the hub at the top of the tower is 31°. Treat the tower as vertical and ignore the inspector's height.

        (A) (i) Find the height of the hub to the nearest hundredth of a metre.
        (ii) Find the distance from the inspector straight to the hub (along her line of sight), to the nearest hundredth of a metre.

        (B) A technician at the hub looks down at a parked truck with an angle of depression of 52°.
        (i) Explain why the angle of elevation from the truck to the hub is also 52°.
        (ii) Find how far the truck is from the base of the tower, to the nearest hundredth of a metre.

        (C) The truck then drives straight away from the tower along level ground, and the angle of depression from the hub becomes 40°.
        (i) Find how far the truck drove, to the nearest hundredth of a metre.
        (ii) Explain why the angle of depression decreased as the truck drove away.
      answer: |
        (A) (i) tan 31° = h/120, so h = 120 tan 31° ≈ 72.10 m.
        (ii) cos 31° = 120/L, so L = 120/cos 31° ≈ 140.00 m. (Check: √(120² + 72.10²) ≈ 140.0.)
        (B) (i) The horizontal line through the hub is parallel to the level ground. The line of sight is a transversal, so the angle of depression at the hub and the angle of elevation at the truck are alternate interior angles and are equal.
        (ii) tan 52° = h/x, so x = h/tan 52° ≈ 72.103/1.2799 ≈ 56.33 m.
        (C) (i) New distance: h/tan 40° ≈ 72.103/0.8391 ≈ 85.93 m. The truck drove about 85.93 − 56.33 = 29.60 m.
        (ii) The height stays the same while the horizontal distance grows, so the ratio h/x = tan θ gets smaller, and for acute angles a smaller tangent means a smaller angle: the line of sight is flatter.
      explanation: |
        Six points. (A) 1 point for 72.10 m; 1 point for 140.00 m (accept 140.0). (B) 1 point for a parallel-lines / alternate-interior-angles reason; 1 point for 56.33 m (accept 56.32 to 56.34 from a rounded height). (C) 1 point for 29.60 m (accept 29.59 to 29.61); 1 point for explaining that a fixed height over a longer distance gives a smaller tangent and so a smaller angle.
