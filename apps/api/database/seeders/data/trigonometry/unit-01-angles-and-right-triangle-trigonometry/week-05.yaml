week: 5
unit: 1
title: "Trigonometric Functions of Any Angle"
topics: ["1.9", "1.10"]
guide: guides/week-05.md
guide_description: |
  The six trigonometric functions defined from a point (x, y) on the terminal side and r = √(x² + y²), values
  at quadrantal angles and why some are undefined, signs by quadrant (ASTC), reference angles in degrees and
  radians, exact values from a reference angle and a sign, and finding all six functions from one value and a
  quadrant condition. Worked examples: the point (−8, −15), sin 270° + cos 180°, reference angles of 310°,
  −150°, 500° and 11π/8, sin 225°, cos 300° and tan(7π/6), and all six values from sin θ = −2/3 with tan θ > 0.
flashcards_description: |
  30 cards on the any-angle definitions, r, quadrantal values, undefined values, signs by quadrant, reference
  angles in degrees and radians, exact values through reference angles, and finding all six from one value.

flashcards:
  - front: sin θ, cos θ, tan θ from a point (x, y) on the terminal side → definitions
    back: |
      sin θ = y/r, cos θ = x/r, tan θ = y/x, where r = √(x² + y²) is the distance from the origin.
    topic_code: "1.9"
  - front: csc θ, sec θ, cot θ from a point (x, y) on the terminal side → definitions
    back: |
      csc θ = r/y, sec θ = r/x, cot θ = x/y: the reciprocals of sine, cosine and tangent.
    topic_code: "1.9"
  - front: The sign of r in the any-angle definitions → rule
    back: |
      Always positive: r is a distance. Negative values of the functions come from x or y.
    topic_code: "1.9"
  - front: Choosing a different point on the same terminal side → effect on the values
    back: |
      None. Scaling the point scales x, y and r together, so every ratio is unchanged.
    topic_code: "1.9"
  - front: Terminal side through (−8, −15) → r, sin θ and tan θ
    back: |
      r = 17; sin θ = −15/17; tan θ = 15/8 (positive in quadrant III).
    topic_code: "1.9"
  - front: Terminal side through (5, −12) → sec θ and cot θ
    back: |
      r = 13; sec θ = 13/5; cot θ = −5/12.
    topic_code: "1.9"
  - front: sin, cos, tan at 90° (π/2) → values
    back: |
      Point (0, 1): sin 90° = 1, cos 90° = 0, tan 90° undefined (division by x = 0).
    topic_code: "1.9"
  - front: sin, cos, tan at 180° (π) → values
    back: |
      Point (−1, 0): sin 180° = 0, cos 180° = −1, tan 180° = 0.
    topic_code: "1.9"
  - front: sin, cos, tan at 270° (3π/2) → values
    back: |
      Point (0, −1): sin 270° = −1, cos 270° = 0, tan 270° undefined.
    topic_code: "1.9"
  - front: Which functions are undefined on the y-axis (90°, 270°) → list and reason
    back: |
      Tangent and secant: both divide by x, and x = 0 on the y-axis.
    topic_code: "1.9"
  - front: Which functions are undefined on the x-axis (0°, 180°) → list and reason
    back: |
      Cotangent and cosecant: both divide by y, and y = 0 on the x-axis.
    topic_code: "1.9"
  - front: sin 270° + cos 180° → value
    back: |
      −1 + (−1) = −2.
    topic_code: "1.9"
  - front: sin θ = −2/3 and tan θ > 0 → cos θ and tan θ
    back: |
      Quadrant III: y = −2, r = 3, x = −√5. cos θ = −√5/3, tan θ = 2√5/5.
    topic_code: "1.9"
  - front: cos θ = −3/5 with θ in quadrant II → sin θ and tan θ
    back: |
      x = −3, r = 5, y = 4 (positive in II). sin θ = 4/5, tan θ = −4/3.
    topic_code: "1.9"
  - front: ASTC → what it stands for
    back: |
      All positive in I; Sine (and csc) in II; Tangent (and cot) in III; Cosine (and sec) in IV.
    topic_code: "1.10"
  - front: sin θ < 0 and tan θ > 0 → quadrant
    back: |
      III. Sine negative rules out I and II; tangent positive rules out II and IV.
    topic_code: "1.10"
  - front: sec θ < 0 and csc θ > 0 → quadrant
    back: |
      II. sec has cosine's sign (negative in II, III); csc has sine's sign (positive in I, II).
    topic_code: "1.10"
  - front: Reference angle → definition
    back: |
      The acute angle between the terminal side and the x-axis (never the y-axis), between 0° and 90°.
    topic_code: "1.10"
  - front: Reference angle formulas in degrees → by quadrant
    back: |
      I: θ. II: 180° − θ. III: θ − 180°. IV: 360° − θ.
    topic_code: "1.10"
  - front: Reference angle formulas in radians → by quadrant
    back: |
      I: θ. II: π − θ. III: θ − π. IV: 2π − θ.
    topic_code: "1.10"
  - front: Reference angle of 310° → value
    back: |
      Quadrant IV: 360° − 310° = 50°.
    topic_code: "1.10"
  - front: Reference angle of −150° → value
    back: |
      Coterminal with 210° (quadrant III): 210° − 180° = 30°.
    topic_code: "1.10"
  - front: Reference angle of 500° → value
    back: |
      500° − 360° = 140° (quadrant II): 180° − 140° = 40°.
    topic_code: "1.10"
  - front: Reference angle of 11π/8 → value
    back: |
      Between π and 3π/2, so quadrant III: 11π/8 − π = 3π/8.
    topic_code: "1.10"
  - front: Value of a function at θ from its reference angle θ′ → rule
    back: |
      Same size as the function at θ′; the sign comes from θ's quadrant.
    topic_code: "1.10"
  - front: sin 225° → exact value
    back: |
      θ′ = 45°, quadrant III (sine negative): −√2/2.
    topic_code: "1.10"
  - front: tan(7π/6) → exact value
    back: |
      θ′ = π/6, quadrant III (tangent positive): √3/3.
    topic_code: "1.10"
  - front: Error-spot → "The reference angle of 310° is 310° − 270° = 40°"
    back: |
      Reference angles are measured to the x-axis: 360° − 310° = 50°.
    topic_code: "1.10"
  - front: Error-spot → "sec 90° = 0 because cos 90° = 0"
    back: |
      sec 90° = 1/cos 90° = 1/0, which is undefined, not 0.
    topic_code: "1.9"
  - front: Error-spot → "For the point (−3, 4), r = −5 because x is negative"
    back: |
      r = √(9 + 16) = 5 is a distance and is always positive; the negative x gives cos θ = −3/5.
    topic_code: "1.9"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 1.9 and 1.10: the six functions from a point
    on the terminal side, quadrantal values, signs by quadrant, reference angles, exact values and finding all
    six from one value), with about 30% reviewing weeks 2–4 (cofunctions, elevation and depression, radian
    measure, arc length and angular speed). Includes a shared-context set on an angle through (−8, −15).
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes. Items marked (Calculator.) need a calculator; the rest are designed to be done by hand.
  questions:
    # ---- Stimulus set: an angle through a point (1.9, 1.10)
    - slug: trig-u01-w05-q01
      type: multiple_choice
      topic_code: "1.9"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      stimulus: |
        An angle θ in standard position, with 0° ≤ θ < 360°, has its terminal side passing through the point (−8, −15).
      prompt: |
        What is sin θ?
      options:
        - "15/17"
        - "−8/17"
        - "−15/17"
        - "−15/8"
      option_explanations:
        - |
          The size is right, but y = −15 is negative and r is positive, so sin θ = y/r is negative.
        - |
          −8/17 is x/r, which is cos θ; sine uses the y-coordinate.
        - |
          Correct. r = √(64 + 225) = 17, and sin θ = y/r = −15/17.
        - |
          −15/8 divides y by x without the sign of x; y/x is tangent, and here it is (−15)/(−8) = 15/8.
      answer: 2
    - slug: trig-u01-w05-q02
      type: multiple_choice
      topic_code: "1.9"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      stimulus: |
        An angle θ in standard position, with 0° ≤ θ < 360°, has its terminal side passing through the point (−8, −15).
      prompt: |
        What is sec θ?
      options:
        - "−17/8"
        - "−17/15"
        - "17/8"
        - "−8/17"
      option_explanations:
        - |
          Correct. sec θ = r/x = 17/(−8) = −17/8, the reciprocal of cos θ = −8/17.
        - |
          −17/15 is r/y, which is csc θ; secant divides r by x.
        - |
          x = −8 is negative and r is positive, so secant is negative in quadrant III.
        - |
          −8/17 is cos θ; secant is the reciprocal of cosine, r/x.
      answer: 0
    - slug: trig-u01-w05-q03
      type: multiple_choice
      topic_code: "1.10"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      stimulus: |
        An angle θ in standard position, with 0° ≤ θ < 360°, has its terminal side passing through the point (−8, −15).
      prompt: |
        What is tan θ?
      options:
        - "−15/8"
        - "8/15"
        - "−8/15"
        - "15/8"
      option_explanations:
        - |
          Both coordinates are negative, so y/x = (−15)/(−8) is positive; tangent is positive in quadrant III.
        - |
          8/15 is x/y, which is cot θ; tangent is y/x.
        - |
          This is x/y with a wrong sign; tangent is y/x, and two negatives give a positive.
        - |
          Correct. tan θ = y/x = (−15)/(−8) = 15/8, positive as ASTC predicts for quadrant III.
      answer: 3
    - slug: trig-u01-w05-q04
      type: numeric
      topic_code: "1.10"
      source: "Original item; Common Core HSF-TF.A.3"
      points: 1
      stimulus: |
        An angle θ in standard position, with 0° ≤ θ < 360°, has its terminal side passing through the point (−8, −15).
      prompt: |
        (Calculator.) Find θ in degrees, to the nearest hundredth.
      answer: { value: 241.93, tolerance: 0.01 }
      explanation: |
        The reference angle is θ′ = tan⁻¹(15/8) ≈ 61.93°. The point is in quadrant III, so θ = 180° + θ′ ≈ 241.93°. (Entering tan⁻¹(−15/−8) gives 61.93°, the reference angle, not θ.)
    # ---- Topics 1.9 and 1.10
    - slug: trig-u01-w05-q05
      type: multiple_choice
      topic_code: "1.10"
      source: "Original item; Common Core HSF-TF.A.3"
      points: 1
      prompt: |
        What is the reference angle of 310°?
      options:
        - "130°"
        - "50°"
        - "40°"
        - "−50°"
      option_explanations:
        - |
          130° = 310° − 180° uses the quadrant III rule; 310° is in quadrant IV, and a reference angle must be acute.
        - |
          Correct. 310° is in quadrant IV, so θ′ = 360° − 310° = 50°.
        - |
          40° = 310° − 270° measures to the negative y-axis; reference angles are measured to the x-axis.
        - |
          −50° is coterminal with 310°, but a reference angle is a positive acute angle.
      answer: 1
    - slug: trig-u01-w05-q06
      type: multiple_choice
      topic_code: "1.10"
      source: "Original item; Common Core HSF-TF.A.3"
      points: 1
      prompt: |
        What is the reference angle of 11π/8?
      options:
        - "π/8"
        - "5π/8"
        - "7π/8"
        - "3π/8"
      option_explanations:
        - |
          π/8 = 3π/2 − 11π/8 measures to the y-axis; reference angles are measured to the x-axis.
        - |
          5π/8 = 2π − 11π/8 uses the quadrant IV rule, and 5π/8 is not acute.
        - |
          7π/8 = 11π/8 − π/2 subtracts a quarter-turn; in quadrant III subtract π.
        - |
          Correct. 11π/8 lies between π and 3π/2 (quadrant III), so θ′ = 11π/8 − π = 3π/8.
      answer: 3
    - slug: trig-u01-w05-q07
      type: multiple_choice
      topic_code: "1.10"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      prompt: |
        An angle θ satisfies sin θ < 0 and tan θ > 0. In which quadrant does its terminal side lie?
      options:
        - "Quadrant I"
        - "Quadrant II"
        - "Quadrant III"
        - "Quadrant IV"
      option_explanations:
        - |
          Every function is positive in quadrant I, so sin θ < 0 is impossible there.
        - |
          In quadrant II sine is positive and tangent is negative, the opposite of both conditions.
        - |
          Correct. Sine is negative in III and IV; tangent is positive in I and III. Only quadrant III satisfies both.
        - |
          In quadrant IV sine is negative, but tangent y/x is negative too, since x > 0 and y < 0.
      answer: 2
    - slug: trig-u01-w05-q08
      type: multiple_choice
      topic_code: "1.9"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      prompt: |
        Which of these values is undefined?
      options:
        - "tan 270°"
        - "sin 270°"
        - "cos 270°"
        - "cot 270°"
      option_explanations:
        - |
          Correct. Using (0, −1), tan 270° = y/x = −1/0, which is undefined.
        - |
          sin 270° = y/r = −1/1 = −1, which is defined; sine never divides by zero.
        - |
          cos 270° = x/r = 0/1 = 0. A value of 0 is defined.
        - |
          cot 270° = x/y = 0/(−1) = 0; zero in the numerator is fine, only a zero denominator is undefined.
      answer: 0
    - slug: trig-u01-w05-q09
      type: multiple_choice
      topic_code: "1.9"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      prompt: |
        If cos θ = −3/5 and θ is in quadrant II, what is tan θ?
      options:
        - "4/3"
        - "−4/3"
        - "−3/4"
        - "4/5"
      option_explanations:
        - |
          The size is right, but in quadrant II x < 0 and y > 0, so tangent y/x is negative.
        - |
          Correct. Take x = −3, r = 5; then y = √(25 − 9) = 4 (positive in II), and tan θ = 4/(−3) = −4/3.
        - |
          −3/4 is x/y, which is cot θ; tangent is y/x.
        - |
          4/5 is y/r = sin θ; tangent divides by x, not r.
      answer: 1
    - slug: trig-u01-w05-q10
      type: multiple_choice
      topic_code: "1.10"
      source: "Original item; Common Core HSF-TF.A.3"
      points: 1
      prompt: |
        What is the exact value of sin 225°?
      options:
        - "√2/2"
        - "−1/2"
        - "−√3/2"
        - "−√2/2"
      option_explanations:
        - |
          The reference angle 45° gives the size √2/2, but 225° is in quadrant III, where sine is negative.
        - |
          −1/2 is the sine of an angle with reference angle 30°; 225° has reference angle 45°.
        - |
          −√3/2 belongs to a 60° reference angle; 225° − 180° = 45°.
        - |
          Correct. 225° is in quadrant III with reference angle 45°, and sine is negative there: −sin 45° = −√2/2.
      answer: 3
    # ---- Spiral review
    - slug: trig-u01-w05-q11
      type: multiple_choice
      topic_code: "1.4"
      source: "Original item; Common Core HSG-SRT.C.7"
      points: 1
      prompt: |
        For which acute angle α is sin α = cos 62°?
      options:
        - "28°"
        - "62°"
        - "118°"
        - "38°"
      option_explanations:
        - |
          Correct. Cofunctions of complementary angles are equal: cos 62° = sin(90° − 62°) = sin 28°.
        - |
          sin 62° ≈ 0.883 while cos 62° ≈ 0.469; sine and cosine of the same acute angle are equal only at 45°.
        - |
          118° is not acute, and sin 118° = sin 62°, not cos 62°; this confuses supplements with complements.
        - |
          38° is neither the complement of 62° (28°) nor related to it; sin 38° ≈ 0.616 ≠ cos 62°.
      answer: 0
    - slug: trig-u01-w05-q12
      type: multiple_choice
      topic_code: "1.7"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 1
      prompt: |
        What is 5π/12 radians in degrees?
      options:
        - "150°"
        - "37.5°"
        - "75°"
        - "105°"
      option_explanations:
        - |
          150° comes from multiplying by 360/π; the conversion factor is 180/π.
        - |
          37.5° is half the correct value, from treating π as 90° instead of 180°.
        - |
          Correct. 5π/12 · 180/π = 5 · 15° = 75°, since π/12 is 15°.
        - |
          105° is 7π/12; this misreads the numerator.
      answer: 2
    - slug: trig-u01-w05-q13
      type: multiple_choice
      topic_code: "1.8"
      source: "Original item; Common Core HSG-C.B.5"
      points: 1
      prompt: |
        A central angle of 140° cuts off an arc on a circle of radius 9 cm. How long is the arc?
      options:
        - "1,260 cm"
        - "7π cm"
        - "14π cm"
        - "7π/2 cm"
      option_explanations:
        - |
          1,260 = 9 · 140 uses the angle in degrees; s = rθ needs radians.
        - |
          Correct. 140° = 7π/9, so s = 9 · 7π/9 = 7π ≈ 21.99 cm.
        - |
          14π uses the diameter 18 cm in s = rθ; the formula uses the radius.
        - |
          7π/2 is half the arc length, as if the formula were ½rθ; the ½ belongs in the sector-area formula.
      answer: 1
    - slug: trig-u01-w05-q14
      type: multi_select
      topic_code: "1.10"
      source: "Original item; Common Core HSF-TF.A.3"
      points: 2
      partial_credit: true
      prompt: |
        Which angles have a reference angle of 40°? Select all that apply.
      options:
        - "230°"
        - "140°"
        - "−50°"
        - "500°"
        - "320°"
      option_explanations:
        - |
          230° is in quadrant III with reference angle 230° − 180° = 50°, not 40°.
        - |
          Correct. 140° is in quadrant II with reference angle 180° − 140° = 40°.
        - |
          −50° is coterminal with 310°, whose reference angle is 50°.
        - |
          Correct. 500° is coterminal with 140°, which has reference angle 40°.
        - |
          Correct. 320° is in quadrant IV with reference angle 360° − 320° = 40°.
      answer: [1, 3, 4]
    - slug: trig-u01-w05-q15
      type: multi_select
      topic_code: "1.9"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 2
      partial_credit: true
      prompt: |
        An angle θ has sin θ < 0 and cos θ > 0. Which statements must be true? Select all that apply.
      options:
        - "csc θ > 0"
        - "tan θ < 0"
        - "θ could be 160°"
        - "sec θ > 0"
        - "cot θ > 0"
      option_explanations:
        - |
          csc θ = 1/sin θ has the same sign as sine, so it is negative.
        - |
          Correct. θ is in quadrant IV (x > 0, y < 0), so tan θ = y/x < 0.
        - |
          160° is in quadrant II, where sine is positive and cosine negative, the opposite of the conditions.
        - |
          Correct. sec θ = 1/cos θ has the same sign as cosine, which is positive.
        - |
          cot θ = x/y with x > 0 and y < 0 is negative, the same sign as tangent.
      answer: [1, 3]
    - slug: trig-u01-w05-q16
      type: true_false
      topic_code: "1.9"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      prompt: |
        True or false: Because cos 90° = 0, it follows that sec 90° = 0.
      answer: false
      explanation: |
        False. sec 90° = 1/cos 90° = 1/0, which is undefined. Using the point (0, 1), sec 90° = r/x = 1/0. A reciprocal of 0 does not exist; it is not 0.
    - slug: trig-u01-w05-q17
      type: true_false
      topic_code: "1.8"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 1
      prompt: |
        True or false: A wheel turning at 1 revolution per second has an angular speed of 2π radians per second.
      answer: true
      explanation: |
        True. One revolution is a full turn, 2π radians, so 1 revolution per second is 2π ≈ 6.28 radians per second.
    - slug: trig-u01-w05-q18
      type: fill_blank
      topic_code: "1.10"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      prompt: |
        If sec θ < 0 and csc θ > 0, the terminal side of θ lies in quadrant ____.
      answer: ["II", "2", "quadrant II", "quadrant 2", "second", "two", "ii"]
      explanation: |
        sec θ has the sign of cos θ, negative in quadrants II and III; csc θ has the sign of sin θ, positive in quadrants I and II. Both hold only in quadrant II.
    - slug: trig-u01-w05-q19
      type: fill_blank
      topic_code: "1.7"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 1
      prompt: |
        To the nearest whole degree, an angle of 2 radians measures ____ degrees.
      answer: ["115", "115°", "115 degrees"]
      explanation: |
        2 · 180/π = 360/π ≈ 114.59°, which rounds to 115°.
    - slug: trig-u01-w05-q20
      type: numeric
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        (Calculator.) From the top of a hypothetical cliff 60 m above sea level, the angle of depression to a boat is 14°. To the nearest hundredth of a metre, how far is the boat from the foot of the cliff?
      answer: { value: 240.65, tolerance: 0.01 }
      explanation: |
        The angle of depression equals the angle of elevation from the boat (alternate angles), so tan 14° = 60/d and d = 60/tan 14° ≈ 240.65 m.
    - slug: trig-u01-w05-q21
      type: short_answer
      topic_code: "1.9"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 3
      prompt: |
        An angle θ satisfies tan θ = −7/24 and cos θ > 0.

        (a) In which quadrant is θ? Give a reason.
        (b) Find sin θ and cos θ exactly.
        (c) Find csc θ, sec θ and cot θ exactly.
      answer: |
        (a) Tangent is negative in quadrants II and IV, and cosine is positive in quadrants I and IV, so θ is in quadrant IV.
        (b) In quadrant IV take x = 24, y = −7; r = √(576 + 49) = √625 = 25. sin θ = −7/25, cos θ = 24/25.
        (c) csc θ = −25/7, sec θ = 25/24, cot θ = −24/7.
      explanation: |
        Three points, one per part. (a) quadrant IV with a reason based on both signs. (b) both values with correct signs (r = 25 shown or implied). (c) all three reciprocals correct; follow-through from an error in (b) earns this point if the reciprocals are consistent.
    - slug: trig-u01-w05-q22
      type: short_answer
      topic_code: "1.8"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 3
      prompt: |
        A hypothetical observation wheel has a radius of 20 m and makes one full turn every 4 minutes.

        (a) Find its angular speed in radians per minute, exactly.
        (b) Find the linear speed of a cabin on the rim in metres per minute, exactly and to the nearest hundredth.
        (c) How far along the circle does a cabin travel in 90 seconds? Give the exact value and a decimal to the nearest hundredth of a metre.
      answer: |
        (a) ω = 2π/4 = π/2 radians per minute.
        (b) v = rω = 20 · π/2 = 10π ≈ 31.42 m per minute.
        (c) 90 seconds is 1.5 minutes. θ = ωt = (π/2)(1.5) = 3π/4, so s = rθ = 20 · 3π/4 = 15π ≈ 47.12 m.
      explanation: |
        Three points, one per part. (a) π/2 rad/min. (b) 10π and 31.42 m/min. (c) 15π and 47.12 m; using t = 90 minutes earns no credit for (c).
    - slug: trig-u01-w05-q23
      type: long_answer
      topic_code: "1.10"
      source: "Original item; Common Core HSF-TF.A.3"
      points: 6
      prompt: |
        The arm of a hypothetical robot is 40 cm long and pivots at the origin of a coordinate grid measured in centimetres. Angles are measured in degrees, counterclockwise from the positive x-axis.

        (A) (i) The arm points at an angle of 210°. Use a reference angle to find the exact coordinates of its tip.
        (ii) Explain how you chose the signs of the coordinates.

        (B) At another moment the tip is at (−24, 32).
        (i) Find sin θ, cos θ and tan θ for the arm's angle θ, exactly.
        (ii) Using a calculator, find θ in degrees to the nearest hundredth, and state its reference angle.

        (C) (i) Find the other angle in [0°, 360°) that has the same sine as the angle in (B), and the coordinates of the tip when the arm points there.
        (ii) Explain, using reference angles and signs by quadrant, why the two angles share a sine but not a cosine.
      answer: |
        (A) (i) 210° has reference angle 30°. The tip is at (40 cos 210°, 40 sin 210°) = (−40 cos 30°, −40 sin 30°) = (−20√3, −20).
        (ii) 210° is in quadrant III, where x and y are both negative, so both coordinates take the negative sign; their sizes come from the 30° reference angle.
        (B) (i) r = √(576 + 1024) = 40 (the arm's length). sin θ = 32/40 = 4/5, cos θ = −24/40 = −3/5, tan θ = 32/(−24) = −4/3.
        (ii) The reference angle is tan⁻¹(32/24) ≈ 53.13°. The tip is in quadrant II, so θ = 180° − 53.13° ≈ 126.87°.
        (C) (i) The other angle is the quadrant I angle with the same reference angle, about 53.13°. The tip is then at (24, 32).
        (ii) Both angles have reference angle 53.13°, so all their function values have the same size. Sine is positive in quadrants I and II, so both sines are +4/5. Cosine is positive in quadrant I but negative in quadrant II, so the cosines are 3/5 and −3/5.
      explanation: |
        Six points. (A) 1 point for (−20√3, −20); 1 point for linking the negative signs to quadrant III. (B) 1 point for all three exact values; 1 point for 126.87° with reference angle 53.13°. (C) 1 point for 53.13° and (24, 32); 1 point for an explanation using the shared reference angle and the signs of sine and cosine in quadrants I and II.
