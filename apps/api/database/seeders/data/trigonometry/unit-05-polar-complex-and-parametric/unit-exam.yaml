  - slug: trig-u05-exam-q43
    type: short_answer
    topic_code: "5.2"
    source: "Original item; Common Core HSN-CN.B.4 (extension)"
    points: 3
    prompt: |
      (a) Convert r = 4/(2 cos θ − sin θ) to a rectangular equation and identify its graph.
      (b) Convert the circle (x − 3)² + y² = 9 to a polar equation.
      (c) Decide whether the polar point (3√2, π/4) lies on the circle in (b), and justify your answer in both coordinate systems.
    answer: |
      (a) r(2 cos θ − sin θ) = 4, so 2r cos θ − r sin θ = 4, that is 2x − y = 4: a straight line (slope 2, y-intercept −4).
      (b) Expanding, x² − 6x + 9 + y² = 9, so x² + y² = 6x. Then r² = 6r cos θ, so r = 6 cos θ.
      (c) Yes. Polar: 6 cos(π/4) = 6(√2/2) = 3√2, which matches r. Rectangular: (3√2, π/4) is (3√2 · √2/2, 3√2 · √2/2) = (3, 3), and (3 − 3)² + 3² = 9.
    explanation: |
      Three points, one per part. (a) 2x − y = 4 and "line". (b) r = 6 cos θ with work. (c) "yes" with both checks (polar substitution and the rectangular point (3, 3) in the equation).
  - slug: trig-u05-exam-q44
    type: short_answer
    topic_code: "5.8"
    source: "Original item; Common Core HSN-CN.B.5 (extension)"
    points: 3
    prompt: |
      Consider the equation z⁶ = 1.

      (a) Write all six solutions (the sixth roots of unity) in trigonometric form.
      (b) Write them in the form a + bi.
      (c) Explain, using their arrangement in the complex plane, why the six solutions add up to 0.
    answer: |
      (a) cis(2πk/6) = cis(kπ/3) for k = 0, 1, …, 5: cis 0, cis(π/3), cis(2π/3), cis π, cis(4π/3), cis(5π/3).
      (b) 1, 1/2 + (√3/2)i, −1/2 + (√3/2)i, −1, −1/2 − (√3/2)i, 1/2 − (√3/2)i.
      (c) They are the vertices of a regular hexagon centred at 0, 60° apart, so each root z has its opposite −z (rotated by π) in the list: 1 and −1, 1/2 + (√3/2)i and −1/2 − (√3/2)i, −1/2 + (√3/2)i and 1/2 − (√3/2)i. Each pair adds to 0, so the total is 0.
    explanation: |
      Three points, one per part. (a) all six arguments kπ/3 with modulus 1. (b) all six rectangular forms. (c) a valid argument: opposite pairs cancel (or the symmetry of a regular hexagon about its centre), not just adding the numbers without explanation.
  # ---- Free response
  - slug: trig-u05-exam-q45
    type: long_answer
    topic_code: "5.10"
    source: "Original item; Common Core HSN-VM.A.3"
    points: 6
    prompt: |
      (Calculator.) In a hypothetical ballpark, a baseball is hit 3 ft above the ground at 120 ft/s, 30° above the horizontal, straight towards a fence 10 ft high that stands 360 ft from home plate. Ignore air resistance.

      (A) (i) Write parametric equations for the ball's position, with x and y in feet and t in seconds.
      (ii) Find the time at which the ball is highest and its maximum height.

      (B) (i) Find the exact time at which the ball reaches the fence, and its height there, exactly and to the nearest hundredth of a foot.
      (ii) Does the ball clear the fence? By how much, or by how much does it fall short?

      (C) (i) Eliminate the parameter to write y as a function of x.
      (ii) If there were no fence, how far from home plate would the ball land, to the nearest hundredth of a foot?
    answer: |
      (A) (i) x = (120 cos 30°)t = 60√3 t ≈ 103.92t; y = 3 + (120 sin 30°)t − 16t² = 3 + 60t − 16t².
      (ii) The vertex is at t = 60/32 = 1.875 s, where y = 3 + 60(1.875) − 16(1.875)² = 3 + 112.5 − 56.25 = 59.25 ft.
      (B) (i) 60√3 t = 360 gives t = 6/√3 = 2√3 ≈ 3.46 s. Then y = 3 + 60(2√3) − 16(12) = 120√3 − 189 ≈ 18.85 ft.
      (ii) Yes: 18.85 ft is above the 10 ft fence, so the ball clears it by about 8.85 ft.
      (C) (i) t = x/(60√3), so y = 3 + 60x/(60√3) − 16x²/10800 = 3 + x/√3 − x²/675.
      (ii) 16t² − 60t − 3 = 0 gives t = (60 + √(3600 + 192))/32 ≈ 3.7994 s, so x ≈ 60√3 × 3.7994 ≈ 394.84 ft.
    explanation: |
      Six points. (A) 1 point for both equations with the components 60√3 and 60, the launch height 3 and −16t²; 1 point for t = 1.875 s and 59.25 ft. (B) 1 point for t = 2√3 s and y = 120√3 − 189 ≈ 18.85 ft; 1 point for a conclusion that it clears, by about 8.85 ft, consistent with the height found. (C) 1 point for y = 3 + x/√3 − x²/675 (or an equivalent exact form); 1 point for 394.84 ft (accept 394.83 to 394.85).
  - slug: trig-u05-exam-q46
    type: long_answer
    topic_code: "5.12"
    source: "Original item; Common Core HSN-CN.B.5 (extension)"
    points: 6
    prompt: |
      A hypothetical robot arm has two segments in a plane. The shoulder is at the origin. The upper arm has length 4 and makes angle α with the positive x-axis; the forearm has length 2 and is turned through a further angle β at the elbow. Using complex numbers, the elbow is at 4e^(iα) and the hand is at h = 4e^(iα) + 2e^(i(α + β)) = e^(iα)(4 + 2e^(iβ)). Angles are in radians.

      (A) Let α = π/6 and β = π/2.
      (i) Find the elbow and the hand positions exactly in the form a + bi.
      (ii) Find the distance from the shoulder to the hand.

      (B) (i) Use the form h = e^(iα)(4 + 2e^(iβ)) to explain why the distance from the shoulder to the hand does not depend on α.
      (ii) Find the greatest and least possible distances from the shoulder to the hand, and the values of β that give them.

      (C) Now let β = π/3.
      (i) Find |4 + 2e^(iπ/3)| exactly, and check your answer with the Law of Cosines in the triangle shoulder–elbow–hand.
      (ii) Find α, to four decimal places, so that the hand lies on the positive y-axis.
    answer: |
      (A) (i) Elbow: 4e^(iπ/6) = 4(√3/2 + i/2) = 2√3 + 2i. Forearm: 2e^(i2π/3) = 2(−1/2 + (√3/2)i) = −1 + √3 i. Hand: (2√3 − 1) + (2 + √3)i ≈ 2.464 + 3.732i.
      (ii) |h| = |e^(iπ/6)| · |4 + 2e^(iπ/2)| = |4 + 2i| = √20 = 2√5 ≈ 4.47.
      (B) (i) |h| = |e^(iα)| · |4 + 2e^(iβ)| = 1 · |4 + 2e^(iβ)|. Multiplying by e^(iα) only rotates the arm about the shoulder, which never changes distances from the origin.
      (ii) |4 + 2e^(iβ)| is greatest when 2e^(iβ) points the same way as 4, at β = 0: 6. It is least when it points the opposite way, at β = π: 2.
      (C) (i) 4 + 2e^(iπ/3) = 4 + 1 + √3 i = 5 + √3 i, so |·| = √(25 + 3) = √28 = 2√7 ≈ 5.29. Law of Cosines: the angle at the elbow inside the triangle is π − π/3 = 2π/3, so d² = 4² + 2² − 2(4)(2) cos(2π/3) = 20 + 8 = 28, d = 2√7.
      (ii) arg(5 + √3 i) = tan⁻¹(√3/5) ≈ 0.3335. The hand's argument is α + 0.3335, which must equal π/2, so α ≈ 1.5708 − 0.3335 = 1.2373.
    explanation: |
      Six points. (A) 1 point for the elbow 2√3 + 2i and the hand (2√3 − 1) + (2 + √3)i; 1 point for 2√5 (accept √20 or 4.47). (B) 1 point for |e^(iα)| = 1, so rotation does not change the distance; 1 point for maximum 6 at β = 0 and minimum 2 at β = π. (C) 1 point for 2√7 (or √28) with a correct Law of Cosines check using the angle 2π/3; 1 point for α ≈ 1.2373 (accept 1.237).
