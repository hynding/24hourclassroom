unit: 5
description: |
  46 questions · about 90 minutes · every topic of Unit 5 (5.1 to 5.12): polar coordinates and converting points
  and equations, graphs of polar equations, the complex plane, trigonometric form, products and quotients, De
  Moivre's theorem and complex roots, parametric equations, projectile motion, polar conics, and Euler's formula and
  rotations, with a little review of Units 1, 3 and 4. Includes four shared-context sets (a complex number, a
  limaçon, a golf drive and a polar conic), select-all, true/false, fill-in-the-blank and numeric items, two
  short-answer questions (3 points each) and two free-response questions (6 points each: a baseball over a fence
  and a two-segment robot arm described with complex numbers). Items marked (Calculator.) need a calculator; the
  rest are designed to be done by hand. Multiple choice, select-all, true/false and numeric items are graded at
  once; fill-in-the-blank items are matched automatically; the free-response items are graded by your teacher
  against the scoring notes.
questions:
  # ---- Stimulus set A: a complex number (5.5, 5.7, 5.8)
  - slug: trig-u05-exam-q01
    type: multiple_choice
    topic_code: "5.5"
    source: "Original item; Common Core HSN-CN.B.4"
    points: 1
    stimulus: |
      Let z = −2 + 2√3 i.
    prompt: |
      Which is the trigonometric form of z, with 0 ≤ θ < 2π?
    options:
      - "4 cis(π/3)"
      - "16 cis(2π/3)"
      - "4 cis(2π/3)"
      - "4 cis(5π/3)"
    option_explanations:
      - |
        π/3 is the reference angle. z has a negative real part and a positive imaginary part, so it is in quadrant II.
      - |
        16 is a² + b², the square of the modulus; |z| = √(4 + 12) = 4.
      - |
        Correct. |z| = √((−2)² + (2√3)²) = 4, and z is in quadrant II with reference angle π/3, so θ = 2π/3.
      - |
        5π/3 is in quadrant IV, where the imaginary part would be negative; z = −2 + 2√3 i is in quadrant II.
    answer: 2
  - slug: trig-u05-exam-q02
    type: multiple_choice
    topic_code: "5.7"
    source: "Original item; Common Core HSN-CN.B.5 (extension)"
    points: 1
    stimulus: |
      Let z = −2 + 2√3 i.
    prompt: |
      What is z³?
    options:
      - "64"
      - "−64"
      - "64i"
      - "−8 − 24√3 i"
    option_explanations:
      - |
        Correct. z = 4 cis(2π/3), so z³ = 4³ cis(2π) = 64(1 + 0i) = 64.
      - |
        −64 would need an argument of π after cubing; 3 · 2π/3 = 2π, a full turn, which points along the positive real axis.
      - |
        64i has argument π/2; tripling 2π/3 gives 2π, not π/2.
      - |
        This cubes the real and imaginary parts separately; (a + b)³ is not a³ + b³.
    answer: 0
  - slug: trig-u05-exam-q03
    type: multiple_choice
    topic_code: "5.8"
    source: "Original item; Common Core HSN-CN.B.5 (extension)"
    points: 1
    stimulus: |
      Let z = −2 + 2√3 i.
    prompt: |
      What are the two square roots of z?
    options:
      - "2 cis(π/3) and 2 cis(2π/3)"
      - "4 cis(π/3) and 4 cis(4π/3)"
      - "1 + √3 i and 1 − √3 i"
      - "1 + √3 i and −1 − √3 i"
    option_explanations:
      - |
        Square roots are π apart (2π/2), not π/3 apart; 2 cis(2π/3) squared is 4 cis(4π/3), not z.
      - |
        The arguments are right, but the modulus of each root is √4 = 2, not 4.
      - |
        Conjugates are not opposite each other; (1 − √3 i)² = −2 − 2√3 i, the conjugate of z.
      - |
        Correct. The roots are 2 cis(π/3) = 1 + √3 i and 2 cis(π/3 + π) = −1 − √3 i; each squares to 4 cis(2π/3) = z.
    answer: 3
  # ---- Stimulus set B: a limaçon (5.3)
  - slug: trig-u05-exam-q04
    type: multiple_choice
    topic_code: "5.3"
    source: "Original item; Common Core HSF-TF.C.8 (extension)"
    points: 1
    stimulus: |
      Consider the polar equation r = 1 + 2 sin θ, with θ in radians.
    prompt: |
      Which best describes its graph?
    options:
      - "A cardioid"
      - "A limaçon with an inner loop"
      - "A dimpled limaçon with no inner loop"
      - "A rose with 2 petals"
    option_explanations:
      - |
        A cardioid needs the two coefficients equal, as in 1 + sin θ or 2 + 2 sin θ; here |1| < |2|.
      - |
        Correct. In a + b sin θ with |a| < |b| (1 < 2), r becomes negative for part of each turn, which makes an inner loop.
      - |
        A dimpled limaçon needs b < a < 2b; here a = 1 is smaller than b = 2, so r goes negative and loops.
      - |
        Roses have the form a sin(nθ); this equation has a constant added to sin θ, which makes a limaçon.
    answer: 1
  - slug: trig-u05-exam-q05
    type: multiple_choice
    topic_code: "5.3"
    source: "Original item; Common Core HSF-TF.C.8 (extension)"
    points: 1
    stimulus: |
      Consider the polar equation r = 1 + 2 sin θ, with θ in radians.
    prompt: |
      For which values of θ in [0, 2π) does the graph pass through the pole?
    options:
      - "θ = π/6 and 5π/6"
      - "θ = 3π/2 only"
      - "θ = 4π/3 and 5π/3"
      - "θ = 7π/6 and 11π/6"
    option_explanations:
      - |
        At π/6 and 5π/6, sin θ = +1/2 and r = 2; the pole needs sin θ = −1/2.
      - |
        At 3π/2, r = 1 − 2 = −1, which is the point (0, 1), not the pole.
      - |
        At 4π/3 and 5π/3, sin θ = −√3/2, so r = 1 − √3 ≠ 0.
      - |
        Correct. r = 0 when sin θ = −1/2, which happens at 7π/6 and 11π/6 in [0, 2π).
    answer: 3
  - slug: trig-u05-exam-q06
    type: multiple_choice
    topic_code: "5.3"
    source: "Original item; Common Core HSF-TF.C.8 (extension)"
    points: 1
    stimulus: |
      Consider the polar equation r = 1 + 2 sin θ, with θ in radians.
    prompt: |
      What is the maximum value of |r|, and at which rectangular point is the graph farthest from the pole?
    options:
      - "3, at (0, 3)"
      - "1, at (1, 0)"
      - "3, at (0, −3)"
      - "2, at (0, 2)"
    option_explanations:
      - |
        Correct. sin θ = 1 at θ = π/2 gives r = 3, the point (0, 3). The smallest r is −1, so |r| never exceeds 3.
      - |
        r = 1 at θ = 0 is not the largest value; at θ = π/2, r = 3.
      - |
        At θ = 3π/2, r = −1, which is the point (0, 1), not (0, −3); |r| = 3 occurs only at θ = π/2.
      - |
        2 is the coefficient b; the maximum is a + b = 1 + 2 = 3.
    answer: 0
  - slug: trig-u05-exam-q07
    type: multiple_choice
    topic_code: "5.3"
    source: "Original item; Common Core HSF-TF.C.8 (extension)"
    points: 1
    stimulus: |
      Consider the polar equation r = 1 + 2 sin θ, with θ in radians.
    prompt: |
      About which of the following is the graph symmetric?
    options:
      - "The polar axis"
      - "The pole"
      - "The line θ = π/2"
      - "The line θ = π/4"
    option_explanations:
      - |
        Replacing θ by −θ gives 1 − 2 sin θ, a different equation, and the graph's farthest point (0, 3) has no mirror image (0, −3).
      - |
        Replacing r by −r gives a different equation, and (0, 3) is on the graph while (0, −3) is not.
      - |
        Correct. Replacing θ by π − θ leaves sin θ unchanged, so the graph is symmetric about the vertical line θ = π/2.
      - |
        There is no reason for symmetry about θ = π/4; the test would replace θ by π/2 − θ, which turns sin θ into cos θ.
    answer: 2
  # ---- Stimulus set C: a golf drive (5.10)
  - slug: trig-u05-exam-q08
    type: multiple_choice
    topic_code: "5.10"
    source: "Original item; Common Core HSN-VM.A.3"
    points: 1
    stimulus: |
      A hypothetical golf ball is struck from level ground at 40 m/s at 30° above the horizontal. Ignore air resistance; x and y are in metres and t is in seconds.
    prompt: |
      Which parametric equations model the ball's flight?
    options:
      - "x = 20t, y = 20√3 t − 4.9t²"
      - "x = 20√3 t, y = 20t − 4.9t²"
      - "x = 20√3 t, y = 20t − 16t²"
      - "x = 40t, y = 40t − 4.9t²"
    option_explanations:
      - |
        This swaps the components; horizontal is 40 cos 30° = 20√3 and vertical is 40 sin 30° = 20.
      - |
        Correct. x = (40 cos 30°)t = 20√3 t and y = (40 sin 30°)t − 4.9t², with −4.9t² for metres.
      - |
        −16t² is the gravity term in feet; in metres it is −4.9t².
      - |
        The whole speed cannot be both horizontal and vertical; it must be split into 40 cos 30° and 40 sin 30°.
    answer: 1
  - slug: trig-u05-exam-q09
    type: multiple_choice
    topic_code: "5.10"
    source: "Original item; Common Core HSN-VM.A.3"
    points: 1
    stimulus: |
      A hypothetical golf ball is struck from level ground at 40 m/s at 30° above the horizontal. Ignore air resistance; x and y are in metres and t is in seconds.
    prompt: |
      (Calculator.) To the nearest hundredth of a metre, what is the ball's maximum height?
    options:
      - "2.04 m"
      - "40.82 m"
      - "81.63 m"
      - "20.41 m"
    option_explanations:
      - |
        2.04 is the time of the maximum, t = 20/9.8 seconds, not the height reached.
      - |
        40.82 = 20²/9.8 forgets the factor 2 in the vertex height 20²/(2 · 9.8).
      - |
        81.63 = 20²/4.9 divides by half of g instead of 2g.
      - |
        Correct. The top is at t = 20/9.8 ≈ 2.041 s, where y = 20(2.041) − 4.9(2.041)² ≈ 20.41 m.
    answer: 3
  - slug: trig-u05-exam-q10
    type: multiple_choice
    topic_code: "5.10"
    source: "Original item; Common Core HSN-VM.A.3"
    points: 1
    stimulus: |
      A hypothetical golf ball is struck from level ground at 40 m/s at 30° above the horizontal. Ignore air resistance; x and y are in metres and t is in seconds.
    prompt: |
      (Calculator.) To the nearest hundredth of a metre, how far from the tee does the ball land?
    options:
      - "141.39 m"
      - "81.63 m"
      - "70.70 m"
      - "163.27 m"
    option_explanations:
      - |
        Correct. y = t(20 − 4.9t) = 0 at t = 20/4.9 ≈ 4.082 s, and x = 20√3 × 4.082 ≈ 141.39 m.
      - |
        81.63 = 20 × 4.082 multiplies the flight time by the vertical component instead of the horizontal one.
      - |
        70.70 is the horizontal distance at the top of the flight, after only half of the flight time.
      - |
        163.27 = 40 × 4.082 uses the full speed as if all of it were horizontal.
    answer: 0
  # ---- Stimulus set D: a polar conic (5.11)
  - slug: trig-u05-exam-q11
    type: multiple_choice
    topic_code: "5.11"
    source: "Original item; Common Core HSG-GPE.A.3 (extension)"
    points: 1
    stimulus: |
      A conic has polar equation r = 12/(3 + 6 cos θ), with a focus at the pole.
    prompt: |
      What are its eccentricity and type?
    options:
      - "e = 6, a hyperbola"
      - "e = 1/2, an ellipse"
      - "e = 2, a hyperbola"
      - "e = 4, a hyperbola"
    option_explanations:
      - |
        6 is the coefficient before dividing; with the constant made 1, r = 4/(1 + 2 cos θ).
      - |
        This inverts the ratio; e is the cos θ coefficient over the constant, 6/3 = 2.
      - |
        Correct. Dividing by 3 gives r = 4/(1 + 2 cos θ), so e = 2 > 1: a hyperbola.
      - |
        4 is ed, the numerator in standard form, not the eccentricity.
    answer: 2
  - slug: trig-u05-exam-q12
    type: multiple_choice
    topic_code: "5.11"
    source: "Original item; Common Core HSG-GPE.A.3 (extension)"
    points: 1
    stimulus: |
      A conic has polar equation r = 12/(3 + 6 cos θ), with a focus at the pole.
    prompt: |
      What is the equation of its directrix?
    options:
      - "x = 4"
      - "x = 2"
      - "x = −2"
      - "y = 2"
    option_explanations:
      - |
        4 is ed, the numerator in standard form. With e = 2, d = 4/2 = 2.
      - |
        Correct. ed = 4 and e = 2 give d = 2, and + cos θ puts the directrix to the right of the pole: x = 2.
      - |
        A plus sign, 1 + e cos θ, puts the directrix on the right, x = d, not x = −d.
      - |
        cos θ goes with a vertical directrix x = ±d; y = ±d belongs to equations with sin θ.
    answer: 1
  - slug: trig-u05-exam-q13
    type: multiple_choice
    topic_code: "5.11"
    source: "Original item; Common Core HSG-GPE.A.3 (extension)"
    points: 1
    stimulus: |
      A conic has polar equation r = 12/(3 + 6 cos θ), with a focus at the pole.
    prompt: |
      What are its vertices, in rectangular coordinates?
    options:
      - "(4/3, 0) and (4, 0)"
      - "(4/3, 0) and (−4, 0)"
      - "(4, 0) and (−4/3, 0)"
      - "(0, 4/3) and (0, −4)"
    option_explanations:
      - |
        Correct. θ = 0 gives r = 12/9 = 4/3, the point (4/3, 0); θ = π gives r = 12/(3 − 6) = −4, and (−4, π) is the point (4, 0).
      - |
        At θ = π, r = −4; a negative r points opposite to θ = π, so the point is (4, 0), not (−4, 0).
      - |
        At θ = 0, r = 4/3, not 4, and r = −4 at θ = π lands on the positive x-axis.
      - |
        With cos θ the vertices lie on the horizontal axis, found at θ = 0 and θ = π.
    answer: 0
  # ---- Polar coordinates, complex numbers, parametric equations, conics, Euler
  - slug: trig-u05-exam-q14
    type: multiple_choice
    topic_code: "5.1"
    source: "Original item; Common Core HSN-CN.B.4 (extension)"
    points: 1
    prompt: |
      What are the rectangular coordinates of the polar point (−3, π/4)?
    options:
      - "(3√2/2, 3√2/2)"
      - "(−3√2/2, 3√2/2)"
      - "(3√2/2, −3√2/2)"
      - "(−3√2/2, −3√2/2)"
    option_explanations:
      - |
        This ignores the negative r. With r = −3 the point is in the direction opposite to π/4, in quadrant III.
      - |
        Only x is negated here; x = −3 cos(π/4) and y = −3 sin(π/4) are both negative.
      - |
        Only y is negated here; both coordinates pick up the factor r = −3.
      - |
        Correct. x = −3 cos(π/4) = −3√2/2 and y = −3 sin(π/4) = −3√2/2.
    answer: 3
  - slug: trig-u05-exam-q15
    type: multiple_choice
    topic_code: "5.1"
    source: "Original item; Common Core HSN-CN.B.4 (extension)"
    points: 1
    prompt: |
      Which polar coordinates, with r > 0 and 0 ≤ θ < 2π, name the rectangular point (2, −2√3)?
    options:
      - "(4, π/3)"
      - "(4, −π/3)"
      - "(4, 5π/3)"
      - "(16, 5π/3)"
    option_explanations:
      - |
        π/3 is the reference angle; the point has y < 0, so it is in quadrant IV, not quadrant I.
      - |
        This names the right point, but −π/3 is outside the required interval 0 ≤ θ < 2π.
      - |
        Correct. r = √(4 + 12) = 4 and the point is in quadrant IV with reference angle π/3, so θ = 2π − π/3 = 5π/3.
      - |
        16 is r², x² + y²; r is its square root, 4.
    answer: 2
  - slug: trig-u05-exam-q16
    type: multiple_choice
    topic_code: "5.2"
    source: "Original item; Common Core HSN-CN.B.4 (extension)"
    points: 1
    prompt: |
      Which rectangular equation has the same graph as r = −4 cos θ?
    options:
      - "(x − 2)² + y² = 4"
      - "(x + 2)² + y² = 4"
      - "x² + (y + 2)² = 4"
      - "x = −4"
    option_explanations:
      - |
        This is r = 4 cos θ; the minus sign moves the centre to the left of the pole.
      - |
        Correct. r² = −4r cos θ gives x² + y² = −4x, and completing the square gives (x + 2)² + y² = 4.
      - |
        A circle centred on the y-axis comes from r = ±4 sin θ; cos θ gives a centre on the x-axis.
      - |
        r = −4 cos θ is not r cos θ = −4; multiplying both sides by r gives x² + y² = −4x, a circle.
    answer: 1
  - slug: trig-u05-exam-q17
    type: multiple_choice
    topic_code: "5.2"
    source: "Original item; Common Core HSN-CN.B.4 (extension)"
    points: 1
    prompt: |
      Which polar equation has the same graph as the parabola y = x²?
    options:
      - "r = tan θ sec θ"
      - "r = tan θ"
      - "r = sin θ cos²θ"
      - "r² = tan θ"
    option_explanations:
      - |
        Correct. r sin θ = r² cos²θ; dividing by r cos²θ gives r = sin θ/cos²θ = tan θ sec θ (r = 0 is included at θ = 0).
      - |
        This loses one factor of cos θ; r sin θ = r² cos²θ gives r = sin θ/cos²θ.
      - |
        This multiplies by cos²θ instead of dividing by it.
      - |
        After substituting, one factor of r cancels, leaving r to the first power, not r².
    answer: 0
  - slug: trig-u05-exam-q18
    type: multiple_choice
    topic_code: "5.4"
    source: "Original item; Common Core HSN-CN.B.6"
    points: 1
    prompt: |
      What is the distance between the points 1 + 2i and 4 − 2i in the complex plane?
    options:
      - "7"
      - "3√5"
      - "1"
      - "5"
    option_explanations:
      - |
        7 = 3 + 4 adds the horizontal and vertical gaps; the distance is the hypotenuse √(3² + 4²).
      - |
        3√5 = √5 + 2√5 adds the two moduli; the distance between the points is the modulus of their difference.
      - |
        1 = −3 + 4 adds the parts of the difference; the distance uses √(a² + b²).
      - |
        Correct. The difference is (1 + 2i) − (4 − 2i) = −3 + 4i, and |−3 + 4i| = √(9 + 16) = 5.
    answer: 3
  - slug: trig-u05-exam-q19
    type: multiple_choice
    topic_code: "5.6"
    source: "Original item; Common Core HSN-CN.B.5 (extension)"
    points: 1
    prompt: |
      What is 10 cis(7π/12) ÷ 2 cis(π/4)?
    options:
      - "5 cis(7π/48)"
      - "8 cis(π/3)"
      - "5/2 + (5√3/2)i"
      - "20 cis(5π/6)"
    option_explanations:
      - |
        Dividing complex numbers subtracts arguments; it does not divide them.
      - |
        The moduli are divided, 10/2 = 5, not subtracted.
      - |
        Correct. 5 cis(7π/12 − 3π/12) = 5 cis(π/3) = 5(1/2 + (√3/2)i) = 5/2 + (5√3/2)i.
      - |
        This multiplies (moduli 20, arguments added); the question asks for the quotient.
    answer: 2
  - slug: trig-u05-exam-q20
    type: multiple_choice
    topic_code: "5.6"
    source: "Original item; Common Core HSN-CN.B.5 (extension)"
    points: 1
    prompt: |
      What is 3 cis(π/5) · 2 cis(3π/10) in the form a + bi?
    options:
      - "5i"
      - "6i"
      - "6"
      - "6 cis(3π/50)"
    option_explanations:
      - |
        Moduli multiply, 3 · 2 = 6; adding them gives 5.
      - |
        Correct. 6 cis(π/5 + 3π/10) = 6 cis(π/2) = 6i.
      - |
        The modulus is right, but the arguments add to π/2, which points along the imaginary axis.
      - |
        Arguments add when complex numbers multiply; multiplying them gives 3π/50.
    answer: 1
  - slug: trig-u05-exam-q21
    type: multiple_choice
    topic_code: "5.7"
    source: "Original item; Common Core HSN-CN.B.5 (extension)"
    points: 1
    prompt: |
      What is (1 − i)⁸?
    options:
      - "16"
      - "−16"
      - "16i"
      - "256"
    option_explanations:
      - |
        Correct. 1 − i = √2 cis(−π/4), so (1 − i)⁸ = (√2)⁸ cis(−2π) = 16.
      - |
        The argument 8 · (−π/4) = −2π is a full turn, which points along the positive real axis, not the negative one.
      - |
        16i would need a final argument of π/2; −2π is coterminal with 0.
      - |
        256 = 2⁸ uses 2 as the modulus; |1 − i| = √2, and (√2)⁸ = 16.
    answer: 0
  - slug: trig-u05-exam-q22
    type: multiple_choice
    topic_code: "5.8"
    source: "Original item; Common Core HSN-CN.B.5 (extension)"
    points: 1
    prompt: |
      Which statement describes the five fifth roots of 32i?
    options:
      - "Each has modulus 32/5, and consecutive roots are 2π/5 apart."
      - "Each has modulus 2, and consecutive roots are π/5 apart."
      - "Each has modulus 2, and one root is the real number 2."
      - "Each has modulus 2, and consecutive roots are 2π/5 apart."
    option_explanations:
      - |
        The modulus of an nth root is the nth root of the modulus, ⁵√32 = 2, not 32 divided by 5.
      - |
        Five roots share a full turn, so they are 2π/5 apart; π/5 would fit ten of them.
      - |
        2⁵ = 32, which is real, not 32i. The roots have arguments (π/2 + 2πk)/5, and none of these is 0, so no root is real.
      - |
        Correct. ⁵√32 = 2, and the arguments (π/2 + 2πk)/5 differ by 2π/5, so the roots form a regular pentagon on the circle of radius 2.
    answer: 3
  - slug: trig-u05-exam-q23
    type: multiple_choice
    topic_code: "5.9"
    source: "Original item; Common Core HSF-TF.C.8 (extension)"
    points: 1
    prompt: |
      Which rectangular equation describes the curve x = 2t², y = 4t, for all real t?
    options:
      - "y = x²/8"
      - "x = y²/8"
      - "x = 2y²"
      - "y² = 2x"
    option_explanations:
      - |
        This treats x as the input. From y = 4t, t = y/4, and substituting into x = 2t² makes x a function of y: x = 2(y/4)².
      - |
        Correct. t = y/4, so x = 2(y/4)² = 2y²/16 = y²/8, a parabola opening to the right.
      - |
        This substitutes y for t; since y = 4t, t must be replaced by y/4, which brings in a factor 1/16.
      - |
        y² = 2x means x = y²/2; the correct relation is x = y²/8, that is y² = 8x.
    answer: 1
  - slug: trig-u05-exam-q24
    type: multiple_choice
    topic_code: "5.9"
    source: "Original item; Common Core HSF-TF.C.8 (extension)"
    points: 1
    prompt: |
      Which parametric equations, for 0 ≤ t ≤ 2π, trace the circle with centre (−1, 4) and radius 3 once clockwise, starting at (2, 4)?
    options:
      - "x = −1 + 3 cos t, y = 4 + 3 sin t"
      - "x = 1 + 3 cos t, y = −4 − 3 sin t"
