      prompt: |
        Find the cube roots of 8i.

        (a) Write 8i in trigonometric form.
        (b) Write all three cube roots in trigonometric form.
        (c) Write the three cube roots in the form a + bi, and name the polygon they form.
      answer: |
        (a) 8i = 8 cis(π/2).
        (b) 2 cis((π/2 + 2πk)/3) for k = 0, 1, 2: 2 cis(π/6), 2 cis(5π/6), 2 cis(3π/2).
        (c) √3 + i, −√3 + i and −2i. They are the vertices of an equilateral triangle inscribed in the circle of radius 2 about 0.
