      answer: |
        (a) zw = 8 cis(7π/12 + π/4) = 8 cis(5π/6) = 8(−√3/2) + 8(1/2)i = −4√3 + 4i.
        (b) z/w = 2 cis(7π/12 − π/4) = 2 cis(π/3) = 1 + √3 i.
        (c) (z/w)³ = 2³ cis(3 · π/3) = 8 cis π = −8.
      explanation: |
        Three points, one per part. (a) 8 cis(5π/6) and −4√3 + 4i. (b) 2 cis(π/3) and 1 + √3 i. (c) −8, by De Moivre or by multiplying out.
    - slug: trig-u05-w29-q23
      type: long_answer
      topic_code: "5.8"
      source: "Original item; Common Core HSN-CN.B.5 (extension)"
      points: 6
      prompt: |
        Let z = −1 + √3 i.

        (A) (i) Write z in trigonometric form.
        (ii) Use De Moivre's theorem to find z³, and explain what your answer says about z and the equation w³ = 8.

        (B) Use De Moivre's theorem to write z⁵ in the form a + bi.

        (C) (i) Find all four fourth roots of z in trigonometric form.
        (ii) Write the root with the smallest argument in the form a + bi, exactly, and explain why the four roots form a square.
      answer: |
        (A) (i) |z| = √(1 + 3) = 2; tan θ = −√3 with z in quadrant II, so θ = 2π/3 and z = 2 cis(2π/3).
        (ii) z³ = 2³ cis(3 · 2π/3) = 8 cis(2π) = 8. So z is one of the three solutions of w³ = 8 (a cube root of 8), along with 2 and −1 − √3 i.
        (B) z⁵ = 32 cis(10π/3) = 32 cis(4π/3) = 32(−1/2) + 32(−√3/2)i = −16 − 16√3 i.
        (C) (i) ⁴√2 cis((2π/3 + 2πk)/4) = ⁴√2 cis(π/6 + kπ/2) for k = 0, 1, 2, 3: ⁴√2 cis(π/6), ⁴√2 cis(2π/3), ⁴√2 cis(7π/6), ⁴√2 cis(5π/3).
        (ii) ⁴√2 cis(π/6) = ⁴√2(√3/2) + ⁴√2(1/2)i = (⁴√2 · √3)/2 + (⁴√2/2)i ≈ 1.03 + 0.59i. All four roots have modulus ⁴√2 and their arguments are π/2 apart, so they are equally spaced on the circle of radius ⁴√2: the vertices of a square.
      explanation: |
        Six points. (A) 1 point for 2 cis(2π/3); 1 point for z³ = 8 with the conclusion that z is a cube root of 8. (B) 1 point for −16 − 16√3 i (argument reduced correctly). (C) 1 point for modulus ⁴√2 with the correct general argument; 1 point for all four arguments π/6, 2π/3, 7π/6, 5π/3; 1 point for the exact rectangular form and the square explained by equal modulus and spacing π/2.
