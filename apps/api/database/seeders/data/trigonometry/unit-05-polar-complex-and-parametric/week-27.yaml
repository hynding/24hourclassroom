      prompt: |
        Consider the polar equation r = 8 cos θ.

        (a) Convert it to rectangular form.
        (b) Give the centre and radius of the graph.
        (c) Explain why the whole graph is traced on 0 ≤ θ < π, so that π ≤ θ < 2π traces it again.
      answer: |
        (a) r² = 8r cos θ, so x² + y² = 8x, which completes to (x − 4)² + y² = 16.
        (b) Centre (4, 0), radius 4.
        (c) For any θ, 8 cos(θ + π) = −8 cos θ, so the point at θ + π is (−r, θ + π), which is the same point as (r, θ). Every point plotted on [π, 2π) repeats a point already plotted on [0, π).
      explanation: |
        Three points, one per part. (a) a correct rectangular equation. (b) centre (4, 0) and radius 4. (c) an argument using cos(θ + π) = −cos θ and (−r, θ + π) = (r, θ), or an equivalent table showing the repeat.
    - slug: trig-u05-w27-q23
      type: long_answer
      topic_code: "5.3"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 6
      prompt: |
        A hypothetical microphone's sensitivity in each direction is modelled by r = 2 − 2 sin θ, where θ is the direction of a sound source measured counterclockwise from the polar axis and r is the relative sensitivity (larger r means the microphone picks the sound up more strongly).

        (A) (i) Find r at θ = 0, π/2, π and 3π/2.
        (ii) Use a symmetry test to show that the graph is symmetric about the line θ = π/2.

        (B) (i) Name the shape of the graph, with a reason.
        (ii) In which direction is the microphone completely insensitive, and in which direction is it most sensitive? Give the rectangular point that marks the most sensitive direction.

        (C) An engineer tries r = 2 − 4 sin θ instead.
        (i) Name the new shape, with a reason.
        (ii) Find the values of θ in [0, 2π) where the new graph passes through the pole, and find the rectangular point plotted at θ = π/2.
      answer: |
        (A) (i) r(0) = 2, r(π/2) = 0, r(π) = 2, r(3π/2) = 4.
        (ii) Replace (r, θ) by (r, π − θ): r = 2 − 2 sin(π − θ) = 2 − 2 sin θ, the same equation, so the graph is symmetric about θ = π/2.
        (B) (i) A cardioid: it is a limaçon r = a − b sin θ with a = b = 2 (a/b = 1).
        (ii) Insensitive where r = 0: sin θ = 1, θ = π/2 (sound from straight "up" the axis θ = π/2). Most sensitive where r is largest: r = 4 at θ = 3π/2, the rectangular point (0, −4).
        (C) (i) A limaçon with an inner loop, because a/b = 2/4 = 1/2 < 1.
        (ii) 2 − 4 sin θ = 0 gives sin θ = 1/2, so θ = π/6 and 5π/6. At θ = π/2, r = 2 − 4 = −2, which plots at x = −2 cos(π/2) = 0, y = −2 sin(π/2) = −2: the point (0, −2), the far end of the inner loop.
      explanation: |
        Six points. (A) 1 point for all four values; 1 point for a correct symmetry substitution using sin(π − θ) = sin θ. (B) 1 point for cardioid with a = b; 1 point for θ = π/2 insensitive and θ = 3π/2 with (0, −4) most sensitive. (C) 1 point for inner loop with a/b < 1; 1 point for θ = π/6, 5π/6 and the point (0, −2).
