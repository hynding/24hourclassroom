week: 27
unit: 5
title: "Graphs of Polar Equations"
topics: ["5.3"]
guide: guides/week-27.md
guide_description: |
  Sketching polar graphs from tables by reading r as a function of θ first; the three symmetry tests and their
  alternatives (a failed test proves nothing); circles; limaçons classified by a/b into inner-loop, cardioid,
  dimpled and convex; roses with n or 2n petals; lemniscates and the θ-intervals where they exist; and the
  Archimedean spiral; finding zeros, maximum |r| and the interval that traces a graph once. Worked examples:
  r = 2 + 4 cos θ with its inner loop, the symmetry of r = sin 2θ, the cardioid r = 3 − 3 sin θ, the rose
  r = 4 sin 3θ and the lemniscate r² = 9 cos 2θ.
flashcards_description: |
  30 cards on symmetry tests, the circle, limaçon, rose, lemniscate and spiral families, classifying limaçons
  by a/b, counting petals, zeros and maximum |r|, negative r on a graph, and tracing intervals.

flashcards:
  - front: Polar-axis symmetry test → substitutions
    back: |
      Replace (r, θ) by (r, −θ); if that fails, try (−r, π − θ). Either one giving an equivalent equation proves symmetry about the x-axis.
    topic_code: "5.3"
  - front: Symmetry test for the line θ = π/2 → substitutions
    back: |
      Replace (r, θ) by (r, π − θ); if that fails, try (−r, −θ).
    topic_code: "5.3"
  - front: Pole symmetry test → substitutions
    back: |
      Replace (r, θ) by (−r, θ) or by (r, θ + π).
    topic_code: "5.3"
  - front: A polar symmetry test fails → what you can conclude
    back: |
      Nothing yet. The mirror point may satisfy the equation under another name; try the alternative test or plot the graph.
    topic_code: "5.3"
  - front: r = sin 2θ and the polar-axis test → how symmetry is shown
    back: |
      (r, −θ) gives r = −sin 2θ (fails), but (−r, π − θ) gives −r = sin(2π − 2θ) = −sin 2θ, so r = sin 2θ. Symmetric.
    topic_code: "5.3"
  - front: r = f(cos θ), with θ only inside cosines → symmetry to expect
    back: |
      About the polar axis, because cos(−θ) = cos θ.
    topic_code: "5.3"
  - front: r = f(sin θ), with θ only inside sines → symmetry to expect
    back: |
      About the line θ = π/2, because sin(π − θ) = sin θ.
    topic_code: "5.3"
  - front: Limaçon r = a ± b cos θ with a/b < 1 → shape
    back: |
      An inner loop: r changes sign, and the negative-r stretch traces a small loop inside the large one.
    topic_code: "5.3"
  - front: Limaçon with a/b = 1 → shape
    back: |
      A cardioid: heart-shaped, touching the pole exactly once (a cusp).
    topic_code: "5.3"
  - front: Limaçon with 1 < a/b < 2 → shape
    back: |
      Dimpled: an inward dent, but r never reaches 0. Example r = 4 + 3 sin θ (a/b = 4/3).
    topic_code: "5.3"
  - front: Limaçon with a/b ≥ 2 → shape
    back: |
      Convex: no dent and no loop. Example r = 5 − 2 cos θ (a/b = 5/2).
    topic_code: "5.3"
  - front: r = 2 + 4 cos θ → zeros and maximum |r|
    back: |
      Zeros where cos θ = −1/2: θ = 2π/3 and 4π/3. Maximum |r| = 6 at θ = 0. Inner loop for 2π/3 < θ < 4π/3.
    topic_code: "5.3"
  - front: r = 2 + 4 cos θ at θ = π → where the point plots
    back: |
      r = −2, so the point is 2 units along the ray θ = 0: the rectangular point (2, 0), the far end of the inner loop.
    topic_code: "5.3"
  - front: r = 3 − 3 sin θ → shape, cusp and farthest point
    back: |
      Cardioid symmetric about θ = π/2; cusp at the pole when θ = π/2; farthest point r = 6 at θ = 3π/2, the rectangular point (0, −6).
    topic_code: "5.3"
  - front: Rose r = a cos nθ with n odd → petals and tracing interval
    back: |
      n petals of length |a|, traced once on [0, π).
    topic_code: "5.3"
  - front: Rose r = a cos nθ with n even → petals and tracing interval
    back: |
      2n petals of length |a|, traced once on [0, 2π).
    topic_code: "5.3"
  - front: r = 4 sin 3θ → petals and tip directions
    back: |
      3 petals of length 4, tips towards θ = π/6, 5π/6 and 3π/2 (the last from r = −4 at θ = π/2).
    topic_code: "5.3"
  - front: r = 2 cos 2θ → petals and tips
    back: |
      4 petals of length 2, tips at θ = 0, π/2, π, 3π/2 (two of them from r = −2).
    topic_code: "5.3"
  - front: r = 5 cos 4θ → number of petals
    back: |
      8: n = 4 is even, so 2n petals, each of length 5.
    topic_code: "5.3"
  - front: Zeros of a rose r = a sin nθ → where
    back: |
      Where sin nθ = 0: θ = kπ/n. The graph passes through the pole between every pair of petals.
    topic_code: "5.3"
  - front: r² = 9 cos 2θ → where it exists
    back: |
      Only where cos 2θ ≥ 0: θ in [−π/4, π/4] or [3π/4, 5π/4]. A figure-eight along the x-axis with maximum |r| = 3.
    topic_code: "5.3"
  - front: r² = a² sin 2θ → orientation
    back: |
      A figure-eight along the line y = x, in quadrants I and III, where sin 2θ ≥ 0.
    topic_code: "5.3"
  - front: Spiral r = θ, θ ≥ 0 → distance gained per turn
    back: |
      2π per full turn: r ≈ 1.57 at θ = π/2 and r ≈ 6.28 at θ = 2π. No symmetry, not periodic.
    topic_code: "5.3"
  - front: Circle r = a cos θ → tracing interval
    back: |
      [0, π): on [π, 2π) the values are negatives of earlier ones at θ + π, which name the same points again.
    topic_code: "5.3"
  - front: Maximum |r| of r = a ± b cos θ (a, b > 0) → value
    back: |
      a + b, where cos θ = ±1 makes the two terms add.
    topic_code: "5.3"
  - front: Sketching r = f(θ) → the θr-plane first
    back: |
      Graph r against θ like a sinusoid (midline, amplitude, zeros), then wrap it around the pole: large r is far out, r = 0 is the pole, negative r flips to the opposite ray.
    topic_code: "5.3"
  - front: r = 1 + 3 cos θ → first positive zero
    back: |
      cos θ = −1/3, so θ = cos⁻¹(−1/3) ≈ 1.91 radians.
    topic_code: "5.3"
  - front: Error-spot → "r = 3 sin 5θ has 10 petals, since roses have 2n"
    back: |
      Only even n gives 2n petals. n = 5 is odd, so there are 5 petals.
    topic_code: "5.3"
  - front: Error-spot → "r = 4 + 3 sin θ has an inner loop because 3 < 4"
    back: |
      Inner loops need a/b < 1. Here a/b = 4/3, between 1 and 2: dimpled, no loop.
    topic_code: "5.3"
  - front: Error-spot → "At θ = π, r = 2 + 4 cos θ is the point (−2, 0)"
    back: |
      r = −2 at θ = π plots 2 units along θ = 0, the rectangular point (2, 0), not (−2, 0).
    topic_code: "5.3"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topic 5.3: symmetry tests, limaçons, roses,
    lemniscates, zeros and maximum |r|), with about a third reviewing week 26 (polar points and converting
    equations) and Units 2 and 3 (period, reduction formulas, multiple-angle equations). Includes a
    shared-context set on r = 2 + 4 cos θ. Multiple choice, select-all, true/false and numeric items are graded
    at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded
    by your teacher against the scoring notes. Items marked (Calculator.) need a calculator; the rest are
    designed to be done by hand. Angles are in radians.
  questions:
    # ---- Stimulus set: a limaçon with an inner loop (5.3)
    - slug: trig-u05-w27-q01
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      stimulus: |
        Consider the polar equation r = 2 + 4 cos θ for 0 ≤ θ < 2π.
      prompt: |
        Which best describes its graph?
      options:
        - "A cardioid"
        - "A dimpled limaçon"
        - "A limaçon with an inner loop"
        - "A convex limaçon"
      option_explanations:
        - |
          A cardioid needs a = b; here a = 2 and b = 4, so r goes negative and makes a loop rather than a single cusp.
        - |
          Dimpled limaçons have 1 < a/b < 2; here a/b = 1/2, below 1.
        - |
          Correct. a/b = 2/4 = 1/2 < 1, so r takes negative values (from 2π/3 to 4π/3), which trace an inner loop.
        - |
          Convex limaçons need a/b ≥ 2, a constant much larger than the coefficient; here it is smaller.
      answer: 2
    - slug: trig-u05-w27-q02
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      stimulus: |
        Consider the polar equation r = 2 + 4 cos θ for 0 ≤ θ < 2π.
      prompt: |
        About which of the following is the graph symmetric?
      options:
        - "The polar axis (the x-axis) only"
        - "The line θ = π/2 (the y-axis) only"
        - "The pole only"
        - "The polar axis, the line θ = π/2 and the pole"
      option_explanations:
        - |
          Correct. Replacing θ by −θ leaves 2 + 4 cos(−θ) = 2 + 4 cos θ, and the graph reaches x = 6 on the right but never gets further left than x = −1/4, so there is no other symmetry.
        - |
          Symmetry about θ = π/2 belongs to sine limaçons; this graph reaches x = 6 on the right but never gets further left than x = −1/4.
        - |
          Pole symmetry would put (−6, 0) on the graph opposite (6, 0), but the graph never reaches x = −6.
        - |
          Only the polar-axis test succeeds; the lopsided extent along the x-axis rules out the other two.
      answer: 0
    - slug: trig-u05-w27-q03
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      stimulus: |
        Consider the polar equation r = 2 + 4 cos θ for 0 ≤ θ < 2π.
      prompt: |
        For which values of θ does the graph pass through the pole?
      options:
        - "θ = π/3 and θ = 5π/3"
        - "θ = π/2 and θ = 3π/2"
        - "θ = π only"
        - "θ = 2π/3 and θ = 4π/3"
      option_explanations:
        - |
          These solve cos θ = 1/2; the equation 2 + 4 cos θ = 0 needs cos θ = −1/2.
        - |
          At θ = π/2 and 3π/2, cos θ = 0 and r = 2, not 0.
        - |
          At θ = π, r = 2 − 4 = −2: that is the far end of the inner loop, not the pole.
        - |
          Correct. 2 + 4 cos θ = 0 gives cos θ = −1/2, which on [0, 2π) means θ = 2π/3 or 4π/3.
      answer: 3
    - slug: trig-u05-w27-q04
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      stimulus: |
        Consider the polar equation r = 2 + 4 cos θ for 0 ≤ θ < 2π.
      prompt: |
        What is the maximum value of |r|, and where does it occur?
      options:
        - "2, at θ = π/2"
        - "6, at θ = 0"
        - "4, at every θ"
        - "2, at θ = π, where r = −2"
      option_explanations:
        - |
          r = 2 at θ = π/2, but that is the midline value of r as a function of θ, not its largest size.
        - |
          Correct. |r| is largest when cos θ = 1: r = 2 + 4 = 6 at θ = 0, the rectangular point (6, 0).
        - |
          4 is the coefficient b, the amplitude of r as a function of θ; |r| varies between 0 and 6.
        - |
          |r| = 2 at θ = π marks the far end of the small inner loop; the outer loop reaches 6.
      answer: 1
    # ---- Topic 5.3
    - slug: trig-u05-w27-q05
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        How many petals does the rose r = 5 cos 4θ have?
      options:
        - "8"
        - "4"
        - "5"
        - "16"
      option_explanations:
        - |
          Correct. n = 4 is even, so the rose has 2n = 8 petals, each of length 5.
        - |
          n petals is the rule for odd n; for even n the negative-r values make n more petals.
        - |
          5 is the petal length |a|, not the number of petals.
        - |
          16 doubles twice; the even-n rule gives 2 · 4 = 8.
      answer: 0
    - slug: trig-u05-w27-q06
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        Which describes the rose r = 3 sin 5θ?
      options:
        - "10 petals of length 3"
        - "5 petals of length 6"
        - "5 petals of length 3"
        - "3 petals of length 5"
      option_explanations:
        - |
          2n petals is the rule for even n; n = 5 is odd, so negative r retraces petals instead of adding new ones.
        - |
          The petal length is |a| = 3, measured from the pole to the tip, not the width across two petals.
        - |
          Correct. n = 5 is odd, so there are 5 petals, each reaching |a| = 3 from the pole.
        - |
          This swaps the roles: the coefficient 3 is the length and the multiplier 5 sets the petal count.
      answer: 2
    - slug: trig-u05-w27-q07
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        Which best describes the graph of r = 4 + 3 sin θ?
      options:
        - "A limaçon with an inner loop"
        - "A dimpled limaçon"
        - "A cardioid"
        - "A convex limaçon"
      option_explanations:
        - |
          An inner loop needs a/b < 1 so that r becomes negative; here r ≥ 4 − 3 = 1 is always positive.
        - |
          Correct. a/b = 4/3 lies between 1 and 2, so the graph has a dent near θ = 3π/2 but never reaches the pole.
        - |
          A cardioid needs a = b so that r reaches 0; here the smallest r is 1.
        - |
          Convex limaçons need a/b ≥ 2; 4/3 is too small, so a dent remains.
      answer: 1
    - slug: trig-u05-w27-q08
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        At which angle does the cardioid r = 3 + 3 cos θ pass through the pole?
      options:
        - "θ = 0"
        - "θ = π/2"
        - "θ = 3π/2"
        - "θ = π"
      option_explanations:
        - |
          At θ = 0, r = 3 + 3 = 6, the farthest point from the pole, not the pole itself.
        - |
          At θ = π/2, cos θ = 0 and r = 3, so the point is (0, 3) in rectangular form.
        - |
          At θ = 3π/2, cos θ = 0 and r = 3; zeros of a cosine cardioid come from cos θ = −1.
        - |
          Correct. 3 + 3 cos θ = 0 needs cos θ = −1, so θ = π; the cusp is at the pole, pointing left.
      answer: 3
    - slug: trig-u05-w27-q09
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        For which values of θ in [0, 2π) does the lemniscate r² = 16 sin 2θ have points?
      options:
        - "[0, π]"
        - "[0, π/4] ∪ [3π/4, π]"
        - "[π/2, π] ∪ [3π/2, 2π)"
        - "[0, π/2] ∪ [π, 3π/2]"
      option_explanations:
        - |
          On (π/2, π), 2θ is between π and 2π, where sin 2θ < 0, so r² would be negative.
        - |
          These are the intervals where cos 2θ ≥ 0 (within [0, π]), which belong to r² = 16 cos 2θ.
        - |
          These are exactly the intervals where sin 2θ ≤ 0, where r² would be negative and no points exist.
        - |
          Correct. r² ≥ 0 needs sin 2θ ≥ 0, so 2θ in [0, π] or [2π, 3π], that is θ in [0, π/2] or [π, 3π/2]: quadrants I and III.
      answer: 3
    # ---- Spiral review
    - slug: trig-u05-w27-q10
      type: multiple_choice
      topic_code: "5.2"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        What is the graph of the polar equation r = 2 sec θ?
      options:
        - "The circle x² + y² = 4"
        - "The vertical line x = 2"
        - "The horizontal line y = 2"
        - "The circle (x − 1)² + y² = 1"
      option_explanations:
        - |
          That circle is r = 2; secant changes the graph from a circle to a line.
        - |
          Correct. r = 2/cos θ gives r cos θ = 2, and r cos θ = x, so x = 2.
        - |
          y = 2 is r sin θ = 2, that is r = 2 csc θ; secant pairs with cosine and x.
        - |
          That circle is r = 2 cos θ, where cosine multiplies 2 rather than dividing it.
      answer: 1
    - slug: trig-u05-w27-q11
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        Graphed on an ordinary θr-plane (θ across, r up), r = 5 cos 4θ is a sinusoid. What is its period?
      options:
        - "π/2"
        - "8π"
        - "4"
        - "2π"
      option_explanations:
        - |
          Correct. The period of a cos bθ is 2π/|b| = 2π/4 = π/2.
        - |
          8π multiplies 2π by 4; a larger b squeezes the graph, so the period divides by b.
        - |
          4 is the value of b, not the period; the period is 2π/b.
        - |
          2π is the period of cos θ; the factor 4 inside shortens it.
      answer: 0
    - slug: trig-u05-w27-q12
      type: multiple_choice
      topic_code: "3.11"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      prompt: |
        The lemniscate r² = 9 cos 2θ passes through the pole wherever cos 2θ = 0. What are all solutions of cos 2θ = 0 on [0, 2π)?
      options:
        - "π/4 and 3π/4 only"
        - "π/2 and 3π/2"
        - "π/4, 3π/4, 5π/4 and 7π/4"
        - "π/4 and 5π/4 only"
      option_explanations:
        - |
          These come from 2θ in [0, 2π) only; since θ runs over [0, 2π), 2θ runs over [0, 4π), which doubles the solutions.
        - |
          These solve cos θ = 0; the equation is about cos 2θ, so solve 2θ = π/2 + kπ first and then halve.
        - |
          Correct. 2θ = π/2 + kπ gives θ = π/4 + kπ/2, so θ = π/4, 3π/4, 5π/4, 7π/4 on [0, 2π).
        - |
          This adds π (the period of cos 2θ is π) but misses the solutions π/4 + π/2 and π/4 + 3π/2.
      answer: 2
    - slug: trig-u05-w27-q13
      type: multi_select
      topic_code: "5.3"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the rose r = 2 cos 2θ are true? Select all that apply.
      options:
        - "It has 4 petals."
        - "Each petal has length 4."
        - "It passes through the pole at θ = π/4."
        - "It is traced exactly once on [0, π)."
        - "One petal tip is at the rectangular point (0, −2)."
      option_explanations:
        - |
          Correct. n = 2 is even, so there are 2n = 4 petals.
        - |
          Each petal reaches |a| = 2 from the pole; 4 is the distance from one tip to the opposite tip.
        - |
          Correct. 2 cos(π/2) = 0, so the graph is at the pole when θ = π/4.
        - |
          For even n the graph needs [0, 2π); on [0, π) only two of the four petals are drawn.
        - |
          Correct. At θ = π/2, r = 2 cos π = −2, which plots at x = −2 cos(π/2) = 0, y = −2 sin(π/2) = −2.
      answer: [0, 2, 4]
    - slug: trig-u05-w27-q14
      type: multi_select
      topic_code: "3.5"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 2
      partial_credit: true
      prompt: |
        Polar symmetry tests use reduction and even/odd identities. Which of these equations are identities (true for every θ)? Select all that apply.
      options:
        - "cos(π − θ) = cos θ"
        - "cos(−θ) = cos θ"
        - "sin(−θ) = sin θ"
        - "sin(π − θ) = sin θ"
        - "sin(θ + π) = −sin θ"
      option_explanations:
        - |
          cos(π − θ) = cos π cos θ + sin π sin θ = −cos θ: reflecting across the y-axis negates the x-coordinate.
        - |
          Correct. Cosine is even: reflecting across the x-axis keeps the x-coordinate.
        - |
          Sine is odd: sin(−θ) = −sin θ, because reflecting across the x-axis negates the y-coordinate.
        - |
          Correct. sin(π − θ) = sin π cos θ − cos π sin θ = sin θ; the y-coordinate survives a reflection across the y-axis.
        - |
          Correct. Adding π moves to the opposite point of the circle, negating both coordinates.
      answer: [1, 3, 4]
    - slug: trig-u05-w27-q15
      type: true_false
      topic_code: "5.3"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        True or false: If replacing (r, θ) by (r, −θ) changes a polar equation into a different equation, then its graph cannot be symmetric about the polar axis.
      answer: false
      explanation: |
        False. A failed test proves nothing, because the mirror point may satisfy the equation under a different name. For r = sin 2θ the substitution (r, −θ) gives r = −sin 2θ, but the alternative (−r, π − θ) gives back r = sin 2θ, and the four-petal rose is symmetric about the polar axis.
    - slug: trig-u05-w27-q16
      type: true_false
      topic_code: "5.1"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        True or false: The polar points (−2, π/3) and (2, 4π/3) are the same point.
      answer: true
      explanation: |
        True. (r, θ) = (−r, θ + π): negating r and adding π gives (2, π/3 + π) = (2, 4π/3). Both are the rectangular point (−1, −√3).
    - slug: trig-u05-w27-q17
      type: fill_blank
      topic_code: "5.3"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        The rose r = 7 cos 6θ has ____ petals.
      answer: ["12", "twelve"]
      explanation: |
        n = 6 is even, so the rose has 2n = 12 petals, each of length 7.
    - slug: trig-u05-w27-q18
      type: fill_blank
      topic_code: "5.2"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        In rectangular form, the polar circle r = 10 sin θ is x² + (y − k)² = 25, where k = ____.
      answer: ["5", "k = 5", "k=5"]
      explanation: |
        r² = 10r sin θ gives x² + y² = 10y; completing the square, x² + (y − 5)² = 25. The circle has centre (0, 5) and radius 5.
    - slug: trig-u05-w27-q19
      type: numeric
      topic_code: "5.3"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        (Calculator.) Find the smallest positive value of θ, in radians to the nearest hundredth, at which the graph of r = 1 + 3 cos θ passes through the pole.
      answer: { value: 1.91, tolerance: 0.01 }
      explanation: |
        1 + 3 cos θ = 0 gives cos θ = −1/3, and θ = cos⁻¹(−1/3) ≈ 1.911, which is 1.91 to the nearest hundredth. (The other zero in [0, 2π) is 2π − 1.911 ≈ 4.37.)
    - slug: trig-u05-w27-q20
