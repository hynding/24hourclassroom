    - slug: trig-u05-w31-q22
      type: short_answer
      topic_code: "5.11"
      source: "Original item; Common Core HSG-GPE.A.3 (extension)"
      points: 3
      prompt: |
        A conic has polar equation r = 15/(5 + 3 cos θ), with a focus at the pole.

        (a) Write the equation in standard form, find the eccentricity and classify the conic.
        (b) Find the directrix.
        (c) Find the vertices in rectangular coordinates, and the length of the major axis.
      answer: |
        (a) Dividing by 5: r = 3/(1 + 0.6 cos θ). e = 3/5 < 1, so it is an ellipse.
        (b) ed = 3, so d = 3/0.6 = 5; with + cos θ the directrix is x = 5.
        (c) θ = 0: r = 15/8, the point (15/8, 0). θ = π: r = 15/2, the point (−15/2, 0). The major axis has length 15/8 + 15/2 = 75/8.
      explanation: |
        Three points, one per part. (a) standard form with e = 3/5 and "ellipse". (b) x = 5. (c) both vertices, (15/8, 0) and (−15/2, 0), and 75/8 (accept 9.375).
    - slug: trig-u05-w31-q23
      type: short_answer
      topic_code: "5.8"
      source: "Original item; Common Core HSN-CN.B.5 (extension)"
      points: 3
      prompt: |
        Solve z³ = −27i.

        (a) Write −27i in trigonometric form.
        (b) Find all three solutions, in trigonometric form and in the form a + bi.
        (c) Describe how the three solutions are arranged in the complex plane.
      answer: |
        (a) −27i = 27(cos(3π/2) + i sin(3π/2)).
        (b) z = 3 cis((3π/2 + 2πk)/3) for k = 0, 1, 2: 3 cis(π/2) = 3i; 3 cis(7π/6) = −3√3/2 − (3/2)i; 3 cis(11π/6) = 3√3/2 − (3/2)i.
        (c) They lie on the circle of radius 3 centred at the origin, 2π/3 (120°) apart: the vertices of an equilateral triangle.
      explanation: |
        Three points, one per part. (a) modulus 27 and argument 3π/2 (or −π/2). (b) all three roots, modulus 3 and arguments π/2, 7π/6, 11π/6 (or equivalents), with correct rectangular forms. (c) circle of radius 3, equally spaced by 2π/3, equilateral triangle.
    - slug: trig-u05-w31-q24
      type: long_answer
      topic_code: "5.10"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 6
      prompt: |
        (Calculator.) In a hypothetical penalty-area drill, a soccer ball is kicked from the ground with speed 20 m/s at 25° above the horizontal, straight towards a goal whose goal line is 30 m away. The crossbar is 2.44 m above the ground. Ignore air resistance and spin.

        (A) (i) Write parametric equations for the ball's position, with x and y in metres and t in seconds.
        (ii) Find the ball's maximum height and when it occurs, to the nearest hundredth.

        (B) (i) Find when the ball reaches the goal line and its height there, to the nearest hundredth.
        (ii) Decide whether the ball crosses the goal line under the crossbar without first touching the ground, and justify your answer.

        (C) (i) Eliminate the parameter to write y as a function of x, with coefficients to four decimal places.
        (ii) If there were no goal, how far from the kick would the ball land, to the nearest hundredth of a metre?
      answer: |
        (A) (i) x = (20 cos 25°)t ≈ 18.126t, y = (20 sin 25°)t − 4.9t² ≈ 8.452t − 4.9t².
        (ii) The vertex is at t = 8.452/9.8 ≈ 0.86 s, where y ≈ 8.452²/19.6 ≈ 3.65 m.
        (B) (i) 18.126t = 30 gives t ≈ 1.66 s (1.655), and y ≈ 8.452(1.655) − 4.9(1.655)² ≈ 0.57 m.
        (ii) The ball lands only at t = 8.452/4.9 ≈ 1.72 s, after it reaches the goal line at 1.66 s, so it is still in the air there, at about 0.57 m, which is between 0 and 2.44 m. It crosses under the crossbar.
        (C) (i) t = x/18.126, so y = (tan 25°)x − 4.9x²/18.126² ≈ 0.4663x − 0.0149x².
        (ii) y = 0 at x = 2(18.126)(8.452)/9.8 ≈ 31.27 m (or x ≈ 0.4663/0.014914 ≈ 31.27 m).
      explanation: |
        Six points. (A) 1 point for both equations with 20 cos 25° and 20 sin 25° and −4.9t²; 1 point for 0.86 s and 3.65 m. (B) 1 point for t ≈ 1.66 s (accept 1.65 or 1.66) and height ≈ 0.57 m; 1 point for a justified conclusion: height between 0 and 2.44 m, and the ball has not yet landed (landing time ≈ 1.72 s, or range > 30 m). (C) 1 point for y = 0.4663x − 0.0149x² (accept the exact form with tan 25° and 4.9/(20 cos 25°)²); 1 point for 31.27 m.
