week: 31
unit: 5
title: "Projectile Motion and Polar Conics"
topics: ["5.10", "5.11"]
guide: guides/week-31.md
guide_description: |
  Projectiles as parametric models: splitting the launch velocity into v₀ cos θ and v₀ sin θ, the models
  x = (v₀ cos θ)t, y = h + (v₀ sin θ)t − 16t² (feet) or − 4.9t² (metres), maximum height, time of flight, range,
  clearing an obstacle, and why the path is a parabola. Then conics with a focus at the pole, r = ed/(1 ± e cos θ)
  and r = ed/(1 ± e sin θ): eccentricity, directrix, vertices and writing equations. Worked examples: a ball hit at
  80 ft/s and 30°, a kick at 25 m/s and 50°, a fence 150 ft away, r = 8/(4 − 2 cos θ), r = 6/(2 + 3 sin θ) and the
  ellipse with e = 2/3 and directrix y = −3.
flashcards_description: |
  30 cards on projectile models in feet and metres, maximum height, time of flight, range and obstacles, and on
  polar conics: standard form, eccentricity, directrix, vertices and writing equations.

flashcards:
  - front: Launch velocity v₀ at angle θ → horizontal and vertical components
    back: |
      Horizontal v₀ cos θ, vertical v₀ sin θ, the components of the velocity vector.
    topic_code: "5.10"
  - front: Projectile model in feet → x(t) and y(t)
    back: |
      x = (v₀ cos θ)t, y = h + (v₀ sin θ)t − 16t², with h the launch height in feet and t in seconds.
    topic_code: "5.10"
  - front: Projectile model in metres → x(t) and y(t)
    back: |
      x = (v₀ cos θ)t, y = h + (v₀ sin θ)t − 4.9t². The 4.9 is half of g = 9.8 m/s².
    topic_code: "5.10"
  - front: Why x(t) for a projectile has no t² term → reason
    back: |
      Ignoring air resistance, nothing pushes sideways, so the horizontal velocity stays v₀ cos θ. Gravity acts only on y.
    topic_code: "5.10"
  - front: Time of maximum height for y = h + (v₀ sin θ)t − 16t² → formula
    back: |
      The vertex of the quadratic: t = v₀ sin θ/32 (feet) or v₀ sin θ/9.8 (metres). Substitute it into y for the height.
    topic_code: "5.10"
  - front: Ball hit from 4 ft at 80 ft/s and 30° → model
    back: |
      x = 40√3 t ≈ 69.28t, y = 4 + 40t − 16t².
    topic_code: "5.10"
  - front: Ball with y = 4 + 40t − 16t² → maximum height
    back: |
      At t = 40/32 = 1.25 s, y = 4 + 50 − 25 = 29 ft.
    topic_code: "5.10"
  - front: Time of flight for a projectile launched from height h → how to find it
    back: |
      Solve y(t) = 0 with the quadratic formula and keep the positive root; the other root is before launch.
    topic_code: "5.10"
  - front: Ground launch (h = 0) → time of flight and range formulas
    back: |
      Time 2v₀ sin θ/g; range v₀² sin 2θ/g, using 2 sin θ cos θ = sin 2θ. The range is greatest at θ = 45°.
    topic_code: "5.10"
  - front: Kick from the ground at 25 m/s and 50° → time of flight and range
    back: |
      y = 19.151t − 4.9t² = 0 at t ≈ 3.91 s; the range is x at that time, about 62.81 m.
    topic_code: "5.10"
  - front: Does a projectile clear a wall at horizontal distance D → two steps
    back: |
      Solve x(t) = D for the time, then compare y at that time with the wall's height.
    topic_code: "5.10"
  - front: Ball x = 40√3 t, y = 4 + 40t − 16t² and a 10 ft fence 150 ft away → clears?
    back: |
      t = 150/(40√3) ≈ 2.165 s and y ≈ 15.60 ft > 10 ft, so it clears by about 5.6 ft.
    topic_code: "5.10"
  - front: Eliminating t from a projectile model → shape and equation
    back: |
      t = x/(v₀ cos θ) gives y = h + (tan θ)x − 16x²/(v₀² cos²θ) (feet): a parabola opening downward.
    topic_code: "5.10"
  - front: Velocity components 12 m/s horizontal, 5 m/s vertical → launch speed and angle
    back: |
      v₀ = √(12² + 5²) = 13 m/s and θ = tan⁻¹(5/12) ≈ 22.62°.
    topic_code: "5.10"
  - front: Focus–directrix definition of a conic → statement
    back: |
      The points P whose distance to the focus is e times their distance to the directrix, for a fixed e > 0.
    topic_code: "5.11"
  - front: Eccentricity e → conic type
    back: |
      0 < e < 1 ellipse; e = 1 parabola; e > 1 hyperbola.
    topic_code: "5.11"
  - front: r = ed/(1 + e cos θ) → where the directrix is
    back: |
      The vertical line x = d, to the right of the focus at the pole. With 1 − e cos θ it is x = −d.
    topic_code: "5.11"
  - front: r = ed/(1 − e sin θ) → where the directrix is
    back: |
      The horizontal line y = −d, below the pole. With 1 + e sin θ it is y = d.
    topic_code: "5.11"
  - front: Reading e from r = 8/(4 − 2 cos θ) → first step
    back: |
      Divide numerator and denominator by 4 so the constant is 1: r = 2/(1 − 0.5 cos θ). Then e = 1/2 and ed = 2.
    topic_code: "5.11"
  - front: r = 8/(4 − 2 cos θ) → type, directrix and vertices
    back: |
      Ellipse, e = 1/2, d = 4, directrix x = −4. Vertices (4, 0) at θ = 0 and (−4/3, 0) at θ = π.
    topic_code: "5.11"
  - front: Vertices of a polar conic with cos θ → which angles
    back: |
      θ = 0 and θ = π, on the horizontal axis through the focus. With sin θ use θ = π/2 and 3π/2.
    topic_code: "5.11"
  - front: r = 6/(2 + 3 sin θ) → type and directrix
    back: |
      r = 3/(1 + 1.5 sin θ): e = 3/2, a hyperbola; ed = 3 gives d = 2, directrix y = 2.
    topic_code: "5.11"
  - front: Vertex of r = 6/(2 + 3 sin θ) at θ = 3π/2 → rectangular point
    back: |
      r = 6/(2 − 3) = −6, and (−6, 3π/2) is the point (0, 6): negative r points the opposite way.
    topic_code: "5.11"
  - front: r = 5/(1 − cos θ) → type, directrix and vertex
    back: |
      e = 1, a parabola, d = 5: directrix x = −5. Vertex at θ = π: r = 5/2, the point (−5/2, 0), halfway to the directrix.
    topic_code: "5.11"
  - front: Focus at the pole, e = 2/3, directrix y = −3 → polar equation
    back: |
      r = (2/3)(3)/(1 − (2/3) sin θ) = 6/(3 − 2 sin θ), an ellipse.
    topic_code: "5.11"
  - front: Focus at the pole, e = 1/2, directrix x = 6 → polar equation
    back: |
      ed = 3, so r = 3/(1 + 0.5 cos θ) = 6/(2 + cos θ).
    topic_code: "5.11"
  - front: Ellipse r = 8/(4 − 2 cos θ) → check e with the centre
    back: |
      Vertices at x = 4 and x = −4/3: centre (4/3, 0), a = 8/3, and the focus is c = 4/3 from the centre, so c/a = 1/2 = e.
    topic_code: "5.11"
  - front: Error-spot → "A projectile in metres has y = h + (v₀ sin θ)t − 16t²"
    back: |
      −16t² is for feet. In metres the term is −4.9t².
    topic_code: "5.10"
  - front: Error-spot → "r = 8/(4 − 2 cos θ) has e = 2, so it is a hyperbola"
    back: |
      The constant in the denominator must be 1 first: r = 2/(1 − 0.5 cos θ), so e = 1/2, an ellipse.
    topic_code: "5.11"
  - front: Error-spot → "r = 2/(1 − 0.5 cos θ) has directrix x = −2"
    back: |
      2 is ed, not d. With e = 1/2, d = 4, so the directrix is x = −4.
    topic_code: "5.11"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topic 5.10, projectile models in feet and metres,
    maximum height, time of flight and range; topic 5.11, polar conics, eccentricity, directrices and vertices),
    with about a third reviewing earlier weeks (parametric equations, complex roots and powers, vector components,
    polar graphs, polar conversions and the modulus). Includes a shared-context set on a ball thrown at 64 ft/s.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes. Items marked (Calculator.) need a calculator; the rest are designed to be done by hand.
  questions:
    # ---- Stimulus set: a thrown ball (5.10)
    - slug: trig-u05-w31-q01
      type: multiple_choice
      topic_code: "5.10"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 1
      stimulus: |
        A hypothetical ball is thrown from 6 ft above level ground with a speed of 64 ft/s at an angle of 30° above the horizontal. Ignore air resistance; t is in seconds, and x and y are in feet.
      prompt: |
        Which parametric equations model the ball's position?
      options:
        - "x = 32t, y = 6 + 32√3 t − 16t²"
        - "x = 32√3 t, y = 6 + 32t − 16t²"
        - "x = 32√3 t, y = 6 + 32t − 4.9t²"
        - "x = 32√3 t − 16t², y = 6 + 32t"
      option_explanations:
        - |
          This swaps sine and cosine. The horizontal component is 64 cos 30° = 32√3 and the vertical is 64 sin 30° = 32.
        - |
          Correct. x = (64 cos 30°)t = 32√3 t and y = 6 + (64 sin 30°)t − 16t², using −16t² for feet.
        - |
          −4.9t² is the gravity term in metres; this problem is in feet, so the term is −16t².
        - |
          Gravity acts only vertically, so the −16t² belongs in y, and x grows at a constant rate.
      answer: 1
    - slug: trig-u05-w31-q02
      type: multiple_choice
      topic_code: "5.10"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 1
      stimulus: |
        A hypothetical ball is thrown from 6 ft above level ground with a speed of 64 ft/s at an angle of 30° above the horizontal. Ignore air resistance; t is in seconds, and x and y are in feet.
      prompt: |
        What is the ball's maximum height above the ground?
      options:
        - "1 ft"
        - "16 ft"
        - "38 ft"
        - "22 ft"
      option_explanations:
        - |
          1 is the time of the maximum, t = 32/32 = 1 s, not the height; substitute it into y.
        - |
          16 ft is the rise above the launch point, 32(1) − 16(1)², without the 6 ft starting height.
        - |
          38 = 6 + 32 leaves out the gravity term −16t² at t = 1.
        - |
          Correct. y = 6 + 32t − 16t² peaks at t = 1 s, where y = 6 + 32 − 16 = 22 ft.
      answer: 3
    - slug: trig-u05-w31-q03
      type: multiple_choice
      topic_code: "5.10"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 1
      stimulus: |
        A hypothetical ball is thrown from 6 ft above level ground with a speed of 64 ft/s at an angle of 30° above the horizontal. Ignore air resistance; t is in seconds, and x and y are in feet.
      prompt: |
        (Calculator.) To the nearest hundredth of a second, when does the ball hit the ground?
      options:
        - "2.17 s"
        - "2.00 s"
        - "1.00 s"
        - "0.17 s"
      option_explanations:
        - |
          Correct. 16t² − 32t − 6 = 0 gives t = (32 + √1408)/32 ≈ 2.17 s, the positive root.
        - |
          2 s is when y returns to 6 ft, the launch height (32t − 16t² = 0); the ball still has 6 ft to fall.
        - |
          1 s is the time of the maximum height, halfway to the launch height, not the landing time.
        - |
          The other root of the quadratic is about −0.17 s, a time before the throw; dropping its sign does not make it the landing time.
      answer: 0
    - slug: trig-u05-w31-q04
      type: multiple_choice
      topic_code: "5.10"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 1
      stimulus: |
        A hypothetical ball is thrown from 6 ft above level ground with a speed of 64 ft/s at an angle of 30° above the horizontal. Ignore air resistance; t is in seconds, and x and y are in feet.
      prompt: |
        (Calculator.) To the nearest foot, how far does the ball travel horizontally before it lands?
      options:
        - "70 ft"
        - "111 ft"
        - "120 ft"
        - "128 ft"
      option_explanations:
        - |
          This multiplies the landing time by 32, the vertical component; horizontal distance uses 32√3 ≈ 55.43 ft/s.
        - |
          This uses t = 2 s, when the ball is back at launch height, instead of the landing time ≈ 2.173 s.
        - |
          Correct. x = 32√3 × 2.1726 ≈ 120.4 ft, which is 120 ft to the nearest foot.
        - |
          128 = 64 × 2 treats the full speed as horizontal and uses the wrong time; only 64 cos 30° moves the ball sideways.
      answer: 2
    # ---- Topics 5.10 and 5.11
    - slug: trig-u05-w31-q05
      type: multiple_choice
      topic_code: "5.10"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 1
      prompt: |
        (Calculator.) A hypothetical ball's position is x = 12t, y = 1.8 + 5t − 4.9t², in metres, t seconds after launch. What were its launch speed and launch angle above the horizontal?
      options:
        - "17 m/s at 22.62°"
        - "13 m/s at 67.38°"
        - "13 m/s at 22.62°"
        - "13 m/s at 24.62°"
      option_explanations:
        - |
          17 = 12 + 5 adds the components; the speed is the magnitude √(12² + 5²) = 13 m/s.
        - |
          67.38° is tan⁻¹(12/5), measured from the vertical; the angle above the horizontal is tan⁻¹(5/12).
        - |
          Correct. The velocity components are 12 and 5, so v₀ = √(144 + 25) = 13 m/s and θ = tan⁻¹(5/12) ≈ 22.62°.
        - |
          The speed is right, but tan⁻¹(5/12) ≈ 22.62°; the launch height 1.8 m does not change the angle.
      answer: 2
    - slug: trig-u05-w31-q06
      type: multiple_choice
      topic_code: "5.11"
      source: "Original item; Common Core HSG-GPE.A.3 (extension)"
      points: 1
      prompt: |
        What kind of conic is r = 6/(1 + 2 cos θ)?
      options:
        - "A hyperbola, because e = 2"
        - "An ellipse, because e = 1/2"
        - "A parabola, because e = 1"
        - "A circle, because the focus is at the pole"
      option_explanations:
        - |
          Correct. The constant in the denominator is already 1, so e = 2 > 1: a hyperbola.
        - |
          e is the coefficient of cos θ once the constant is 1, here 2, not its reciprocal.
        - |
          e = 1 would need the coefficient of cos θ to equal the constant term, 1; here it is 2.
        - |
          Every conic in this form has a focus at the pole; the type is decided by e, which is 2.
      answer: 0
    - slug: trig-u05-w31-q07
      type: multiple_choice
      topic_code: "5.11"
      source: "Original item; Common Core HSG-GPE.A.3 (extension)"
      points: 1
      prompt: |
        What is the directrix of the parabola r = 12/(4 + 4 sin θ)?
      options:
        - "y = 12"
        - "x = 3"
        - "y = −3"
        - "y = 3"
      option_explanations:
        - |
          12 is the numerator before dividing by 4; in standard form r = 3/(1 + sin θ), so ed = 3.
        - |
          A sin θ in the denominator means a horizontal directrix, y = ±d, not a vertical line.
        - |
          A plus sign, 1 + e sin θ, puts the directrix above the pole, at y = d, not below.
        - |
          Correct. r = 3/(1 + sin θ) gives e = 1 and ed = 3, so d = 3, and + sin θ puts the directrix at y = 3.
      answer: 3
    - slug: trig-u05-w31-q08
      type: multiple_choice
      topic_code: "5.11"
      source: "Original item; Common Core HSG-GPE.A.3 (extension)"
      points: 1
      prompt: |
        What is the eccentricity of r = 10/(5 − 3 cos θ)?
      options:
        - "3"
        - "3/5"
        - "5/3"
        - "2"
      option_explanations:
        - |
          3 is the coefficient before dividing; with the constant made 1 the equation is r = 2/(1 − (3/5) cos θ).
        - |
          Correct. Dividing by 5 gives r = 2/(1 − 0.6 cos θ), so e = 3/5 and the conic is an ellipse.
        - |
          This divides the wrong way; e is the cos θ coefficient divided by the constant, 3/5.
        - |
          2 is ed in standard form, the numerator after dividing by 5, not the eccentricity.
      answer: 1
    - slug: trig-u05-w31-q09
      type: multiple_choice
      topic_code: "5.11"
      source: "Original item; Common Core HSG-GPE.A.3 (extension)"
      points: 1
      prompt: |
        Which is the polar equation of the conic with a focus at the pole, eccentricity 1/2 and directrix x = 6?
      options:
        - "r = 6/(2 − cos θ)"
        - "r = 6/(2 + cos θ)"
        - "r = 3/(2 + cos θ)"
        - "r = 6/(2 + sin θ)"
      option_explanations:
        - |
          The minus sign belongs to a directrix on the left, x = −6; x = 6 is to the right of the pole.
        - |
          Correct. ed = 3, so r = 3/(1 + 0.5 cos θ); multiplying top and bottom by 2 gives 6/(2 + cos θ).
        - |
          Multiplying the denominator by 2 needs the numerator multiplied by 2 as well: 3 becomes 6.
        - |
          sin θ goes with a horizontal directrix y = ±d; a vertical directrix x = 6 needs cos θ.
      answer: 1
    # ---- Spiral review
    - slug: trig-u05-w31-q10
      type: multiple_choice
      topic_code: "5.9"
      source: "Original item; Common Core HSF-TF.C.8 (extension)"
      points: 1
      prompt: |
        Which equation describes the curve x = 1 + cos t, y = 2 sin t?
      options:
        - "(x + 1)² + y²/4 = 1"
        - "(x − 1)² + y²/2 = 1"
        - "x² + y² = 5"
        - "(x − 1)² + y²/4 = 1"
      option_explanations:
        - |
          cos t = x − 1, so the centre is at x = 1, not x = −1.
        - |
          sin t = y/2, so squaring gives y²/4, not y²/2.
        - |
          Adding x² and y² does not remove t here, because the coefficients 1 and 2 differ and x has a shift.
        - |
          Correct. cos t = x − 1 and sin t = y/2; cos²t + sin²t = 1 gives an ellipse centred at (1, 0).
      answer: 3
    - slug: trig-u05-w31-q11
      type: multiple_choice
      topic_code: "5.8"
      source: "Original item; Common Core HSN-CN.B.5 (extension)"
      points: 1
      prompt: |
        Which number is one of the three cube roots of 8?
      options:
        - "−2"
        - "2i"
        - "−1 + i√3"
        - "1 + i√3"
      option_explanations:
        - |
          (−2)³ = −8, not 8. The cube roots of 8 are 2 cis(0), 2 cis(2π/3) and 2 cis(4π/3).
        - |
          (2i)³ = 8i³ = −8i, which lies on the imaginary axis and is not 8.
        - |
          Correct. −1 + i√3 = 2 cis(2π/3), and its cube is 8 cis(2π) = 8.
        - |
          1 + i√3 = 2 cis(π/3), and its cube is 8 cis(π) = −8, so it is a cube root of −8.
      answer: 2
    - slug: trig-u05-w31-q12
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 1
      prompt: |
        (Calculator.) A hypothetical ball is kicked at 50 ft/s at 35° above the horizontal. To the nearest hundredth, what is the horizontal component of its initial velocity, in ft/s?
      options:
        - "28.68"
        - "61.04"
        - "50.00"
        - "40.96"
      option_explanations:
        - |
          28.68 = 50 sin 35° is the vertical component; the horizontal component uses cosine.
        - |
          61.04 = 50/cos 35° is larger than the speed itself; a component can never exceed the magnitude.
        - |
          50 is the whole speed; only part of it, 50 cos 35°, is horizontal when the angle is 35°.
        - |
          Correct. The horizontal component is 50 cos 35° ≈ 40.96 ft/s.
      answer: 3
    - slug: trig-u05-w31-q13
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; Common Core HSF-TF.C.8 (extension)"
      points: 1
      prompt: |
        How many petals does the rose r = 4 sin(3θ) have?
      options:
        - "3"
        - "6"
        - "4"
        - "12"
      option_explanations:
        - |
          Correct. For r = a sin(nθ) with n odd, the rose has n petals, so 3.
        - |
          2n petals happen when n is even; with n = 3 each petal is traced twice on [0, 2π], so there are only 3.
        - |
          4 is the petal length |a|, not the number of petals.
        - |
          12 multiplies the length by n; the number of petals depends only on n.
      answer: 0
    - slug: trig-u05-w31-q14
      type: multi_select
      topic_code: "5.10"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 2
      partial_credit: true
      prompt: |
        (Calculator.) A hypothetical ball launched from the ground has position x = 15t, y = 20t − 4.9t², in metres, t seconds after launch. Which statements about this ball are true? Select all that apply.
      options:
        - "Its launch speed is 25 m/s."
        - "Its horizontal velocity decreases as it rises."
        - "Its launch angle is about 53.13° above the horizontal."
        - "It reaches its maximum height at about t = 4.08 s."
        - "It lands at about t = 4.08 s."
      option_explanations:
        - |
          Correct. The velocity components are 15 and 20, so the speed is √(225 + 400) = 25 m/s.
        - |
          x = 15t has no t² term: the horizontal velocity stays 15 m/s throughout the flight.
        - |
          Correct. The launch angle is θ = tan⁻¹(20/15) ≈ 53.13° above the horizontal.
        - |
          The top comes halfway through the flight, at t = 20/9.8 ≈ 2.04 s; 4.08 s is the whole flight.
        - |
          Correct. y = t(20 − 4.9t) = 0 at t = 20/4.9 ≈ 4.08 s.
      answer: [0, 2, 4]
    - slug: trig-u05-w31-q15
      type: multi_select
      topic_code: "5.11"
      source: "Original item; Common Core HSG-GPE.A.3 (extension)"
      points: 2
      partial_credit: true
      prompt: |
        Which of these polar equations, each with a focus at the pole, are ellipses? Select all that apply.
      options:
        - "r = 4/(2 + 3 sin θ)"
        - "r = 4/(1 + 0.8 cos θ)"
        - "r = 5/(1 − cos θ)"
        - "r = 9/(3 − sin θ)"
        - "r = 6/(1 + 2 sin θ)"
      option_explanations:
        - |
          Dividing by 2 gives r = 2/(1 + 1.5 sin θ), so e = 3/2 > 1: a hyperbola.
        - |
          Correct. The constant is 1 and e = 0.8 < 1, so this is an ellipse.
        - |
          e = 1 here, which makes a parabola, not an ellipse.
        - |
          Correct. Dividing by 3 gives r = 3/(1 − (1/3) sin θ), so e = 1/3 < 1.
        - |
          The constant is already 1 and e = 2 > 1, so this is a hyperbola, not an ellipse.
      answer: [1, 3]
    - slug: trig-u05-w31-q16
      type: true_false
      topic_code: "5.10"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 1
      prompt: |
        True or false: In the model x = (v₀ cos θ)t, y = h + (v₀ sin θ)t − 16t², the projectile's horizontal velocity is the same at every moment of the flight.
      answer: true
      explanation: |
        True. x grows by v₀ cos θ feet every second, a linear function of t. Gravity, the −16t² term, changes only the vertical motion (air resistance is ignored).
    - slug: trig-u05-w31-q17
      type: true_false
      topic_code: "5.2"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        True or false: The polar equation r = 4 sec θ describes the vertical line x = 4.
      answer: true
      explanation: |
        True. r = 4/cos θ gives r cos θ = 4, and r cos θ = x, so x = 4.
