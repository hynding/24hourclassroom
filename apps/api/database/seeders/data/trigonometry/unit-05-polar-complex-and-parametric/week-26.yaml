      points: 1
      prompt: |
        (Calculator.) The rectangular point (−2, 5) is written in polar form (r, θ) with r > 0 and 0 ≤ θ < 2π. Find θ in radians, to the nearest hundredth.
      answer: { value: 1.95, tolerance: 0.01 }
      explanation: |
        tan⁻¹(5/(−2)) = tan⁻¹(−2.5) ≈ −1.190, a quadrant IV angle. The point is in quadrant II, so θ ≈ −1.190 + π ≈ 1.951, which is 1.95 to the nearest hundredth. (r = √29 ≈ 5.39.)
