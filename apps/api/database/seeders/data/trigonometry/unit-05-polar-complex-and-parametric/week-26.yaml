      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 3
      prompt: |
        Consider the polar equation r = 4 sin θ.

        (a) Convert the equation to rectangular form, showing the substitution.
        (b) Identify the graph, giving its centre and radius.
        (c) Show that the polar point (2√2, π/4) satisfies the polar equation, convert it to rectangular coordinates, and check that it satisfies your equation from (a).
      answer: |
        (a) Multiply by r: r² = 4r sin θ. Replace r² with x² + y² and r sin θ with y: x² + y² = 4y, which completes to x² + (y − 2)² = 4.
        (b) A circle with centre (0, 2) and radius 2 (it passes through the pole).
        (c) 4 sin(π/4) = 4(√2/2) = 2√2, so the point satisfies r = 4 sin θ. In rectangular form x = 2√2 cos(π/4) = 2 and y = 2√2 sin(π/4) = 2, so the point is (2, 2), and 2² + (2 − 2)² = 4. ✓
      explanation: |
        Three points, one per part. (a) a correct rectangular equation, x² + y² = 4y or the completed-square form, with the substitution shown. (b) centre (0, 2) and radius 2. (c) both checks: 4 sin(π/4) = 2√2 and (2, 2) satisfying the rectangular equation.
    - slug: trig-u05-w26-q22
      type: short_answer
      topic_code: "4.6"
      source: "Original item; Common Core HSN-VM.A.1"
      points: 3
      prompt: |
        A vector v has magnitude 10 and direction angle 210° (degrees, measured counterclockwise from the positive x-axis).

        (a) Find the exact component form of v.
        (b) The tip of v, drawn from the origin, is a point. Give its polar coordinates with r > 0, and a second set with r < 0, both in degrees.
        (c) Explain why the components in (a) are both negative.
      answer: |
        (a) v = ⟨10 cos 210°, 10 sin 210°⟩ = ⟨10(−√3/2), 10(−1/2)⟩ = ⟨−5√3, −5⟩.
        (b) (10, 210°), and with r < 0, (−10, 30°) (any (10, 210° + 360°n) or (−10, 30° + 360°n) is acceptable).
        (c) 210° is in quadrant III (reference angle 30°), where both cosine and sine are negative, so the horizontal and vertical components both point in the negative directions.
      explanation: |
        Three points, one per part. (a) ⟨−5√3, −5⟩ exactly. (b) one valid name with r > 0 and one with r < 0. (c) a reason that refers to quadrant III and the signs of cosine and sine.
    - slug: trig-u05-w26-q23
      type: long_answer
      topic_code: "5.1"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 6
      prompt: |
        A hypothetical coastal radar station sits at the pole of a polar grid measured in kilometres, with the polar axis pointing due east and θ in radians measured counterclockwise.

        (A) Boat A is reported at (8, 2π/3).
        (i) Find Boat A's exact rectangular coordinates.
        (ii) Give another polar name for Boat A's position with r < 0, and explain why it names the same point.

        (B) Boat B is at the rectangular point (−6, −6).
        (i) Write Boat B's position in polar form with r > 0 and 0 ≤ θ < 2π.
        (ii) Find the distance between the boats to the nearest hundredth of a kilometre.

        (C) A third boat travels along the east–west line 4 km south of the station, y = −4.
        (i) Write this line as a polar equation.
        (ii) Use your equation to find r when θ = 7π/6, and confirm that the resulting point lies on y = −4.
      answer: |
        (A) (i) x = 8 cos(2π/3) = −4 and y = 8 sin(2π/3) = 4√3, so (−4, 4√3).
        (ii) (−8, 5π/3) (or (−8, −π/3)). The ray 5π/3 = 2π/3 + π points the opposite way from 2π/3, and a negative r walks 8 km backwards along it, which lands at the same point.
        (B) (i) r = √(36 + 36) = 6√2; tan θ = 1 with the point in quadrant III, so θ = 5π/4. Boat B is at (6√2, 5π/4).
        (ii) Distance formula: d² = (−6 − (−4))² + (−6 − 4√3)² = 4 + 36 + 48√3 + 48 = 88 + 48√3 ≈ 171.14, so d ≈ 13.08 km. (Law of Cosines with included angle 5π/4 − 2π/3 = 7π/12 gives the same: 64 + 72 − 2(8)(6√2) cos(7π/12) ≈ 171.14.)
        (C) (i) r sin θ = −4, so r = −4 csc θ (r = −4/sin θ).
        (ii) r = −4/sin(7π/6) = −4/(−1/2) = 8. The point (8, 7π/6) has x = 8 cos(7π/6) = −4√3 and y = 8 sin(7π/6) = −4, so it lies on y = −4.
      explanation: |
        Six points. (A) 1 point for (−4, 4√3); 1 point for a correct r < 0 name with the reason (opposite ray, θ + π). (B) 1 point for (6√2, 5π/4) with the quadrant handled; 1 point for 13.08 km (accept 13.07–13.09) by either method. (C) 1 point for r = −4 csc θ or equivalent; 1 point for r = 8 and the check y = −4.
