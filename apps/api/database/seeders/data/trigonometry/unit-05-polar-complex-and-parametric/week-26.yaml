week: 26
unit: 5
title: "Polar Coordinates"
topics: ["5.1", "5.2"]
guide: guides/week-26.md
guide_description: |
  Locating points by a direction and a directed distance: the pole and polar axis, plotting (r, θ) with
  negative r and any angle, the two rules that give a point infinitely many polar names, converting points
  with x = r cos θ, y = r sin θ, r = √(x² + y²) and tan θ = y/x (locating the quadrant first), and converting
  equations both ways. Worked examples: other names for (3, 5π/6), (−4, 2π/3) to rectangular, (−3, −3√3) and
  (−2, 5) to polar, r = 4 sin θ as the circle x² + (y − 2)² = 4, the lines x = 3, y = −2 and 2x − 3y = 6 in
  polar form, and the distance between two polar points by the Law of Cosines.
flashcards_description: |
  31 cards on plotting polar points, negative r, multiple names for one point, point conversions with quadrant
  care, converting circles and lines between polar and rectangular form, and the polar distance formula.

flashcards:
  - front: Polar point (r, θ) → how to plot it
    back: |
      Turn through θ from the polar axis (counterclockwise if θ > 0), then move a directed distance r along that ray.
    topic_code: "5.1"
  - front: The pole and the polar axis → what each is
    back: |
      The pole is the origin; the polar axis is the ray from the pole along the positive x-axis, from which θ is measured.
    topic_code: "5.1"
  - front: Polar point with negative r, such as (−3, θ) → where it lands
    back: |
      3 units along the ray opposite θ, that is, along θ + π. (−3, θ) = (3, θ + π).
    topic_code: "5.1"
  - front: Adding 2πn to the angle of a polar point → effect
    back: |
      None: (r, θ) = (r, θ + 2πn) for every integer n, because a full turn faces the same ray.
    topic_code: "5.1"
  - front: Negating r in a polar point → matching change to θ
    back: |
      Add π (or any odd multiple of π): (r, θ) = (−r, θ + π + 2πn).
    topic_code: "5.1"
  - front: Polar names of the pole → which ones
    back: |
      (0, θ) for every θ. The pole is the one point with no single angle.
    topic_code: "5.1"
  - front: (3, 5π/6) with r < 0 and 0 ≤ θ < 2π → name
    back: |
      (−3, 11π/6). The ray 11π/6 points into quadrant IV, and walking backwards lands in quadrant II at 5π/6.
    topic_code: "5.1"
  - front: (3, 5π/6) with r > 0 and a negative angle → name
    back: |
      (3, −7π/6), since 5π/6 − 2π = −7π/6.
    topic_code: "5.1"
  - front: Polar → rectangular formulas → state them
    back: |
      x = r cos θ and y = r sin θ. They hold for negative r too.
    hint: Multiply cos θ = x/r and sin θ = y/r through by r.
    topic_code: "5.1"
  - front: Rectangular → polar formulas → state them
    back: |
      r = √(x² + y²) and tan θ = y/x (x ≠ 0), with θ chosen in the quadrant of the point.
    topic_code: "5.1"
  - front: (−4, 2π/3) in rectangular coordinates → point
    back: |
      x = −4(−1/2) = 2, y = −4(√3/2) = −2√3, so (2, −2√3), in quadrant IV.
    topic_code: "5.1"
  - front: (−3, −3√3) in polar form, r > 0, 0 ≤ θ < 2π → point
    back: |
      r = 6; tan θ = √3 with the point in quadrant III, so θ = 4π/3. Answer (6, 4π/3).
    topic_code: "5.1"
  - front: (−2, 5) in polar form → why add π to the calculator's angle
    back: |
      tan⁻¹(−2.5) ≈ −1.190 is a quadrant IV angle, but (−2, 5) is in quadrant II. θ ≈ −1.190 + π ≈ 1.95; r = √29 ≈ 5.39.
    topic_code: "5.1"
  - front: (0, −5) and (−7, 0) in polar form → points
    back: |
      (5, 3π/2) and (7, π). Quadrantal points need no tangent.
    topic_code: "5.1"
  - front: Distance between polar points (r₁, θ₁) and (r₂, θ₂) → formula
    back: |
      d² = r₁² + r₂² − 2r₁r₂ cos(θ₂ − θ₁), the Law of Cosines in the triangle with the pole.
    topic_code: "5.1"
  - front: Distance from (5, π/6) to (3, π/2) → value
    back: |
      Included angle π/3: d² = 25 + 9 − 30(1/2) = 19, so d = √19 ≈ 4.36.
    topic_code: "5.1"
  - front: Converting a polar equation to rectangular → the usual move
    back: |
      Make r cos θ, r sin θ or r² appear (often by multiplying both sides by r), then replace them with x, y and x² + y².
    topic_code: "5.2"
  - front: r = 4 sin θ in rectangular form → equation and graph
    back: |
      r² = 4r sin θ gives x² + y² = 4y, so x² + (y − 2)² = 4: a circle of radius 2 centred at (0, 2).
    topic_code: "5.2"
  - front: r = 6 cos θ in rectangular form → equation and graph
    back: |
      x² + y² = 6x, so (x − 3)² + y² = 9: a circle of radius 3 centred at (3, 0), through the pole.
    topic_code: "5.2"
  - front: r = 2a cos θ and r = 2a sin θ → family of graphs
    back: |
      Circles of radius |a| through the pole, centred on the x-axis (cosine) or the y-axis (sine).
    topic_code: "5.2"
  - front: x = 3 in polar form → equation
    back: |
      r cos θ = 3, so r = 3 sec θ.
    topic_code: "5.2"
  - front: y = −2 in polar form → equation
    back: |
      r sin θ = −2, so r = −2 csc θ.
    topic_code: "5.2"
  - front: 2x − 3y = 6 in polar form → equation
    back: |
      2r cos θ − 3r sin θ = 6, so r = 6/(2 cos θ − 3 sin θ).
    topic_code: "5.2"
  - front: r = 5 in rectangular form → equation
    back: |
      x² + y² = 25, a circle of radius 5 centred at the pole.
    topic_code: "5.2"
  - front: θ = π/3 in rectangular form → why a whole line
    back: |
      The equation allows every r, negative included, so it gives the full line y = √3x through the pole, not just a ray.
    topic_code: "5.2"
  - front: xy = 4 in polar form → equation
    back: |
      r² sin θ cos θ = 4, and with sin 2θ = 2 sin θ cos θ, r² sin 2θ = 8.
    topic_code: "5.2"
  - front: Multiplying r = 4 sin θ by r → risk and why it is safe here
    back: |
      It can add the pole as a solution, but r = 4 sin θ already contains the pole (θ = 0), so nothing extraneous appears.
    topic_code: "5.2"
  - front: Polar point (r, θ) and vector ⟨x, y⟩ → shared calculation
    back: |
      r is the vector's magnitude and θ its direction angle; converting a point to polar form is week 23's magnitude-and-direction problem.
    topic_code: "5.1"
  - front: Error-spot → "(−2, π/4) and (2, π/4) are the same point"
    back: |
      Negating r sends the point to the opposite ray: (−2, π/4) = (2, 5π/4), in quadrant III.
    topic_code: "5.1"
  - front: Error-spot → "(−1, √3) is (2, −π/3) because tan⁻¹(−√3) = −π/3"
    back: |
      The point is in quadrant II, so θ = −π/3 + π = 2π/3. Answer (2, 2π/3).
    topic_code: "5.1"
  - front: Error-spot → "(−1, 5π/4) is not on r = sin 2θ, because sin(5π/2) = 1 ≠ −1"
    back: |
      (−1, 5π/4) is the same point as (1, π/4), and sin(π/2) = 1, so it is on the graph. A point lies on a polar graph if any one of its names satisfies the equation.
    topic_code: "5.1"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 5.1 and 5.2: plotting and naming polar points,
    converting points and equations between polar and rectangular form), with about a third reviewing Units 1,
    2 and 4 (exact values, functions of any angle, inverse tangent, the Law of Cosines, vector magnitude and
    direction). Includes a shared-context set on the point (−4, 2π/3). Multiple choice, select-all, true/false
    and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers
    and the long answer are graded by your teacher against the scoring notes. Items marked (Calculator.) need a
    calculator; the rest are designed to be done by hand. Angles are in radians unless an item says otherwise.
  questions:
    # ---- Stimulus set: one point with negative r (5.1)
    - slug: trig-u05-w26-q01
      type: multiple_choice
      topic_code: "5.1"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      stimulus: |
        A point P has polar coordinates (−4, 2π/3).
      prompt: |
        In which quadrant does P lie?
      options:
        - "Quadrant I"
        - "Quadrant II"
        - "Quadrant III"
        - "Quadrant IV"
      option_explanations:
        - |
          Quadrant I is opposite quadrant III; neither the ray 2π/3 nor its opposite ray points there.
        - |
          The ray 2π/3 points into quadrant II, but r = −4 sends the point the opposite way along the line.
        - |
          Quadrant III would come from an angle between π and 3π/2 with positive r, or from flipping a quadrant I ray.
        - |
          Correct. The ray 2π/3 points into quadrant II; a negative r moves 4 units along the opposite ray, 2π/3 + π = 5π/3, in quadrant IV.
      answer: 3
    - slug: trig-u05-w26-q02
      type: multiple_choice
      topic_code: "5.1"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      stimulus: |
        A point P has polar coordinates (−4, 2π/3).
      prompt: |
        What are the rectangular coordinates of P?
      options:
        - "(−2, 2√3)"
        - "(2, −2√3)"
        - "(−2√3, 2)"
        - "(2√3, −2)"
      option_explanations:
        - |
          This uses r = 4 instead of −4: it is the point (4, 2π/3), on the opposite side of the pole from P.
        - |
          Correct. x = −4 cos(2π/3) = −4(−1/2) = 2 and y = −4 sin(2π/3) = −4(√3/2) = −2√3.
        - |
          This swaps sine and cosine and drops the sign of r: x uses cosine, y uses sine.
        - |
          The signs fit quadrant IV, but sine and cosine are swapped: x = r cos θ = 2, not 2√3.
      answer: 1
    - slug: trig-u05-w26-q03
      type: multiple_choice
      topic_code: "5.1"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      stimulus: |
        A point P has polar coordinates (−4, 2π/3).
      prompt: |
        Which polar coordinates name P with r > 0 and 0 ≤ θ < 2π?
      options:
        - "(4, 5π/3)"
        - "(4, 2π/3)"
        - "(4, π/3)"
        - "(4, 4π/3)"
      option_explanations:
        - |
          Correct. Negating r requires adding π to the angle: (−4, 2π/3) = (4, 2π/3 + π) = (4, 5π/3).
        - |
          Changing the sign of r without changing the angle moves the point to the other side of the pole.
        - |
          π/3 is the reference angle of 2π/3, and (4, π/3) is in quadrant I, not quadrant IV.
        - |
          This negates the angle (−2π/3, coterminal with 4π/3) instead of adding π; that point is in quadrant III.
      answer: 0
    - slug: trig-u05-w26-q04
      type: multiple_choice
      topic_code: "5.1"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      stimulus: |
        A point P has polar coordinates (−4, 2π/3).
      prompt: |
        How far is P from the pole?
      options:
        - "−4"
        - "2"
        - "4"
        - "16"
      option_explanations:
        - |
          A distance cannot be negative; the sign of r only says which way along the line to move.
        - |
          2 is the x-coordinate of P, its horizontal distance from the y-axis, not its distance from the pole.
        - |
          Correct. The distance from the pole is |r| = 4; check with √(2² + (−2√3)²) = √16 = 4.
        - |
          16 is x² + y² = r²; the distance is its square root.
      answer: 2
    # ---- Topics 5.1 and 5.2
    - slug: trig-u05-w26-q05
      type: multiple_choice
      topic_code: "5.1"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        Which polar coordinates, with r > 0 and 0 ≤ θ < 2π, name the rectangular point (−3, −3√3)?
      options:
        - "(6, π/3)"
        - "(6, 4π/3)"
        - "(36, 4π/3)"
        - "(6, 7π/6)"
      option_explanations:
        - |
          tan(π/3) = √3 matches y/x, but π/3 is a quadrant I angle and the point is in quadrant III.
        - |
          Correct. r = √(9 + 27) = 6; tan θ = √3 gives reference angle π/3, and quadrant III gives θ = π + π/3 = 4π/3.
        - |
          36 is x² + y² = 9 + 27; the distance r is its square root, 6.
        - |
          7π/6 has tangent 1/√3, which is x/y; tan θ = y/x = √3.
      answer: 1
    - slug: trig-u05-w26-q06
      type: multiple_choice
      topic_code: "5.2"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        Which rectangular equation has the same graph as the polar equation r = 6 cos θ?
      options:
        - "x² + (y − 3)² = 9"
        - "x = 6"
        - "(x − 6)² + y² = 36"
        - "(x − 3)² + y² = 9"
      option_explanations:
        - |
          That circle comes from r = 6 sin θ; cosine produces the x-term, so the centre is on the x-axis.
        - |
          x = 6 would be r cos θ = 6, that is r = 6 sec θ; here cos θ multiplies 6 rather than dividing it.
        - |
          The circle passes through the pole with diameter 6, so its radius is 3, not 6.
        - |
          Correct. Multiply by r: x² + y² = 6x. Completing the square gives (x − 3)² + y² = 9, a circle of radius 3 centred at (3, 0).
      answer: 3
    - slug: trig-u05-w26-q07
      type: multiple_choice
      topic_code: "5.2"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        Which polar equation has the same graph as the horizontal line y = −2?
      options:
        - "r = −2 csc θ"
        - "r = −2 sec θ"
        - "r = −2 sin θ"
        - "θ = −2"
      option_explanations:
        - |
          Correct. y = r sin θ, so r sin θ = −2 and r = −2/sin θ = −2 csc θ.
        - |
          sec θ comes from x = r cos θ; r = −2 sec θ is the vertical line x = −2.
        - |
          r = −2 sin θ is a circle through the pole (x² + (y + 1)² = 1); the sine must divide, not multiply.
        - |
          θ = −2 is a line through the pole at angle −2 radians, but y = −2 does not pass through the pole.
      answer: 0
    - slug: trig-u05-w26-q08
      type: multiple_choice
      topic_code: "5.2"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        Which polar equation has the same graph as the line 2x − 3y = 6?
      options:
        - "r = 6/(2 sin θ − 3 cos θ)"
        - "r = 6(2 cos θ − 3 sin θ)"
        - "r = 6/(2 cos θ − 3 sin θ)"
        - "θ = tan⁻¹(2/3)"
      option_explanations:
        - |
          This swaps the substitutions: x is r cos θ and y is r sin θ, not the other way round.
        - |
          r(2 cos θ − 3 sin θ) = 6 must be solved by dividing by the bracket, not multiplying.
        - |
          Correct. 2r cos θ − 3r sin θ = 6, so r(2 cos θ − 3 sin θ) = 6 and r = 6/(2 cos θ − 3 sin θ).
        - |
          That is the line through the pole with slope 2/3; the given line has slope 2/3 but does not pass through the pole.
      answer: 2
    - slug: trig-u05-w26-q09
      type: multiple_choice
      topic_code: "5.1"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        Which polar coordinates do NOT name the same point as (2, π/4)?
      options:
        - "(2, 9π/4)"
        - "(−2, 5π/4)"
        - "(−2, π/4)"
        - "(2, −7π/4)"
      option_explanations:
        - |
          9π/4 = π/4 + 2π, a full extra turn with the same r, so this is the same point.
        - |
          Negating r and adding π to the angle gives the same point: walking backwards along 5π/4 reaches π/4.
        - |
          Correct. Negating r without adding π sends the point to the opposite ray, so (−2, π/4) = (2, 5π/4), in quadrant III.
        - |
          −7π/4 = π/4 − 2π, coterminal with π/4, and r is unchanged, so this is the same point.
      answer: 2
    # ---- Spiral review
    - slug: trig-u05-w26-q10
      type: multiple_choice
      topic_code: "1.11"
      source: "Original item; Common Core HSF-TF.A.3"
      points: 1
      prompt: |
        Converting the polar point (2, 7π/6) to rectangular form needs cos(7π/6). What is its exact value?
      options:
        - "−√3/2"
        - "−1/2"
        - "√3/2"
        - "1/2"
      option_explanations:
        - |
          Correct. 7π/6 is in quadrant III with reference angle π/6, and cosine is negative there: −cos(π/6) = −√3/2.
        - |
          −1/2 is sin(7π/6); the reference angle π/6 has cosine √3/2, not 1/2.
        - |
          The size is right, but 7π/6 is in quadrant III, where x-coordinates (cosines) are negative.
        - |
          1/2 is sin(π/6), and its sign is wrong for quadrant III as well.
      answer: 0
    - slug: trig-u05-w26-q11
      type: multiple_choice
      topic_code: "4.3"
      source: "Original item; Common Core HSG-SRT.D.10"
      points: 1
      prompt: |
        Use the Law of Cosines to find the distance between the polar points (5, π/6) and (3, π/2).
      options:
        - "2"
        - "√34"
        - "7"
        - "√19"
      option_explanations:
        - |
          5 − 3 = 2 would be right only if both points were on the same ray from the pole.
        - |
          √(25 + 9) treats the angle at the pole as a right angle; the included angle is π/2 − π/6 = π/3.
        - |
          7 comes from adding 2·5·3·cos(π/3) = 15 instead of subtracting it: 25 + 9 + 15 = 49.
        - |
          Correct. The included angle is π/3, so d² = 25 + 9 − 2(5)(3)(1/2) = 19 and d = √19.
      answer: 3
    - slug: trig-u05-w26-q12
      type: multiple_choice
      topic_code: "2.9"
      source: "Original item; Common Core HSF-TF.B.6"
      points: 1
      prompt: |
        A student converting (−1, √3) to polar form presses tan⁻¹(√3 ÷ −1) on a calculator. What exact value does tan⁻¹(−√3) have?
      options:
        - "2π/3"
        - "−π/3"
        - "5π/3"
        - "−π/6"
      option_explanations:
        - |
          2π/3 is the polar angle of (−1, √3), but it is outside (−π/2, π/2), so tan⁻¹ cannot return it.
        - |
          Correct. tan⁻¹ returns the angle in (−π/2, π/2) with tangent −√3, which is −π/3; the student must then add π.
        - |
          5π/3 is coterminal with −π/3 but outside the range (−π/2, π/2) of inverse tangent.
        - |
          tan(−π/6) = −1/√3; this mixes up the π/6 and π/3 values.
      answer: 1
    - slug: trig-u05-w26-q13
      type: multi_select
      topic_code: "5.1"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 2
      partial_credit: true
      prompt: |
        Which polar coordinates name the same point as (3, 5π/6)? Select all that apply.
      options:
        - "(3, −7π/6)"
        - "(−3, −π/6)"
        - "(−3, 5π/6)"
        - "(3, 17π/6)"
        - "(3, π/6)"
      option_explanations:
        - |
          Correct. −7π/6 = 5π/6 − 2π, a coterminal angle with the same r.
        - |
          Correct. The ray −π/6 points into quadrant IV; r = −3 walks the opposite way, to 5π/6.
        - |
          Negating r without adding π gives the opposite point, (3, −π/6), in quadrant IV.
        - |
          Correct. 17π/6 = 5π/6 + 2π, one extra full turn.
        - |
          π/6 is the reference angle; (3, π/6) is the reflection of the point across the y-axis, in quadrant I.
      answer: [0, 1, 3]
    - slug: trig-u05-w26-q14
      type: multi_select
      topic_code: "1.9"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 2
      partial_credit: true
      prompt: |
        The terminal side of an angle θ in standard position passes through (−5, 12), so this point has polar coordinates (r, θ) with r > 0. Which statements are true? Select all that apply.
      options:
        - "θ is in quadrant III."
        - "sin θ = 12/13"
        - "tan θ = −5/12"
        - "r = 13"
        - "cos θ = −5/13"
      option_explanations:
        - |
          x < 0 and y > 0 put the point in quadrant II, not quadrant III.
        - |
          Correct. r = √(25 + 144) = 13 and sin θ = y/r = 12/13.
        - |
          tan θ = y/x = 12/(−5) = −12/5; −5/12 is x/y, the cotangent.
        - |
          Correct. r = √((−5)² + 12²) = √169 = 13.
        - |
          Correct. cos θ = x/r = −5/13, negative as cosine is in quadrant II.
      answer: [1, 3, 4]
    - slug: trig-u05-w26-q15
      type: true_false
      topic_code: "5.2"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        True or false: The polar equation θ = π/3 has the same graph as the rectangular equation y = √3x.
      answer: true
      explanation: |
        True. θ = π/3 places no restriction on r, so negative r is allowed and the graph is the whole line through the pole at angle π/3, not only the ray. Its slope is tan(π/3) = √3, so it is y = √3x.
    - slug: trig-u05-w26-q16
      type: true_false
      topic_code: "1.10"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      prompt: |
        True or false: The rule (r, θ) = (−r, θ + π) relies on the fact that sin(θ + π) = sin θ for every angle θ.
      answer: false
      explanation: |
        False. sin(θ + π) = −sin θ and cos(θ + π) = −cos θ: adding π moves the terminal point to the opposite side of the origin, so both coordinates change sign. That sign change is exactly what the negative r undoes: (−r) cos(θ + π) = r cos θ and (−r) sin(θ + π) = r sin θ.
    - slug: trig-u05-w26-q17
      type: fill_blank
      topic_code: "5.1"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        The rectangular point (0, −5) has polar coordinates (5, θ) with 0 ≤ θ < 2π, where the exact value of θ in radians is ____.
      answer: ["3π/2", "3pi/2", "3π / 2", "3pi / 2", "3 π/2", "3 pi/2", "(3/2)π", "1.5π", "1.5pi", "3π/2 radians"]
      explanation: |
        The point lies on the negative y-axis, 5 units from the pole, so θ = 3π/2. No tangent is needed (and tan θ = y/x is undefined there anyway).
    - slug: trig-u05-w26-q18
      type: fill_blank
      topic_code: "1.7"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 1
      prompt: |
        A radar display gives a point as (4, 150°). Rewriting it in radians, 150° is exactly ____ radians.
      answer: ["5π/6", "5pi/6", "5π / 6", "5pi / 6", "5 π/6", "5 pi/6", "(5/6)π", "5/6π", "5/6 π"]
      explanation: |
        Multiply by π/180: 150 · π/180 = 5π/6. So the point is (4, 5π/6).
