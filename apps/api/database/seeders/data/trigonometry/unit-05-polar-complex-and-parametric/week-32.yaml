      points: 6
      prompt: |
        In a hypothetical logo design, O is the origin and A is the point (4, 2), which is the complex number a = 4 + 2i.

        (A) (i) Write a in exponential form re^(iθ), with r exact and θ in radians to four decimal places.
        (ii) Explain why the point b = a · e^(iπ/3) is the third vertex of an equilateral triangle OAB.

        (B) (i) Find b exactly in the form x + yi, using the rotation formula.
        (ii) Show that the distance from A to B equals the distance from O to A.

        (C) The designer keeps rotating A by π/3 about O to get six points a, a·e^(iπ/3), a·e^(2πi/3), and so on.
        (i) Explain why the six points are the vertices of a regular hexagon, and find the vertex opposite A.
        (ii) The six points are the solutions of z⁶ = a⁶. Use De Moivre's theorem to find the modulus and an argument of a⁶ (argument to four decimal places).
      answer: |
        (A) (i) r = √(16 + 4) = √20 = 2√5, and θ = tan⁻¹(2/4) ≈ 0.4636 (quadrant I), so a = 2√5 e^(0.4636i).
        (ii) Multiplying by e^(iπ/3) keeps the modulus (|e^(iπ/3)| = 1), so OB = OA, and adds π/3 to the argument, so angle AOB = 60°. A triangle with two equal sides enclosing 60° is isosceles with base angles (180° − 60°)/2 = 60°, so it is equilateral.
        (B) (i) b = (4 cos 60° − 2 sin 60°) + (4 sin 60° + 2 cos 60°)i = (2 − √3) + (2√3 + 1)i ≈ 0.268 + 4.464i.
        (ii) b − a = (−2 − √3) + (2√3 − 1)i, so AB² = (2 + √3)² + (2√3 − 1)² = (7 + 4√3) + (13 − 4√3) = 20. AB = √20 = OA.
        (C) (i) Each point is the previous one rotated by π/3 about O, so all six are √20 from O and consecutive ones are 60° apart; six equally spaced points on a circle form a regular hexagon. The opposite vertex is a rotated by π: −a = −4 − 2i, the point (−4, −2).
        (ii) |a⁶| = (√20)⁶ = 20³ = 8000, and an argument is 6 tan⁻¹(1/2) ≈ 2.7819 radians (a⁶ = −7488 + 2816i).
      explanation: |
        Six points. (A) 1 point for 2√5 (or √20) and 0.4636; 1 point for the explanation: modulus unchanged and a 60° angle at O give an equilateral triangle. (B) 1 point for b = (2 − √3) + (2√3 + 1)i; 1 point for showing AB² = 20 (exact, or decimals that round to 4.472 for both lengths). (C) 1 point for a reason (equal distances, equal 60° steps) and the opposite vertex (−4, −2); 1 point for modulus 8000 and argument ≈ 2.7819 (accept 2.7818 or 2.782).
