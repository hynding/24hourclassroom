      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 3
      prompt: |
        Use Euler's formula, e^(iθ) = cos θ + i sin θ.

        (a) Expand (cos θ + i sin θ)² in the form (real part) + i(imaginary part).
        (b) Since (e^(iθ))² = e^(2iθ) = cos 2θ + i sin 2θ, state the two identities that follow from (a), and explain why comparing parts is allowed.
        (c) Check both identities at θ = π/6.
      answer: |
        (a) cos²θ + 2i sin θ cos θ + i² sin²θ = (cos²θ − sin²θ) + i(2 sin θ cos θ).
        (b) cos 2θ = cos²θ − sin²θ and sin 2θ = 2 sin θ cos θ. Two complex numbers are equal exactly when their real parts are equal and their imaginary parts are equal, and all of cos θ, sin θ, cos 2θ, sin 2θ are real.
        (c) cos(π/3) = 1/2 and cos²(π/6) − sin²(π/6) = 3/4 − 1/4 = 1/2. sin(π/3) = √3/2 and 2 sin(π/6) cos(π/6) = 2(1/2)(√3/2) = √3/2.
      explanation: |
        Three points, one per part. (a) correct expansion using i² = −1. (b) both identities and the reason (equal complex numbers have equal real and imaginary parts). (c) both checks with correct exact values.
    - slug: trig-u05-w32-q23
      type: short_answer
