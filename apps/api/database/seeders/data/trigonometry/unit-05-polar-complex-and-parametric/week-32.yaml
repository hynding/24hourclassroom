      points: 3
      prompt: |
        A point P moves around a circle so that its position, as a complex number, is z(t) = 5e^(iπt/2), with t in seconds. Its vertical coordinate is y(t) = 5 sin(πt/2), a simple harmonic motion.

        (a) Find the amplitude, period and frequency of y(t).
        (b) Find z(3) in the form a + bi, and give P's coordinates at t = 3.
        (c) Find the first time t > 0 at which y(t) = 2.5.
      answer: |
        (a) Amplitude 5; period 2π/(π/2) = 4 s; frequency 1/4 cycle per second.
        (b) z(3) = 5e^(3πi/2) = 5(cos(3π/2) + i sin(3π/2)) = −5i, so P is at (0, −5).
        (c) 5 sin(πt/2) = 2.5 gives sin(πt/2) = 1/2; the first positive solution is πt/2 = π/6, so t = 1/3 s.
      explanation: |
        Three points, one per part. (a) all three of amplitude 5, period 4 s and frequency 1/4. (b) −5i and (0, −5). (c) t = 1/3 s (accept 0.333).
