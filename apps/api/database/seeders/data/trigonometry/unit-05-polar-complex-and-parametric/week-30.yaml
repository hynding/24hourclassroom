    - slug: trig-u05-w30-q23
      type: short_answer
      topic_code: "5.9"
      source: "Original item; Common Core HSF-TF.C.8 (extension)"
      points: 3
      prompt: |
        A curve C is given by x = 2 sin t, y = cos 2t for 0 ≤ t ≤ π.

        (a) Find the points of C at t = 0, t = π/2 and t = π.
        (b) Eliminate the parameter to write an equation for C in x and y.
        (c) State the possible values of x on C, and describe how the point moves as t increases from 0 to π.
      answer: |
        (a) t = 0: (0, 1). t = π/2: (2, −1). t = π: (0, 1).
        (b) sin t = x/2 and cos 2t = 1 − 2sin²t, so y = 1 − 2(x/2)² = 1 − x²/2.
        (c) On [0, π], sin t ≥ 0, so 0 ≤ x ≤ 2. The point starts at (0, 1), moves right and down along the parabola y = 1 − x²/2 to (2, −1) at t = π/2, then returns along the same arc to (0, 1) at t = π.
      explanation: |
        Three points, one per part. (a) all three points correct. (b) y = 1 − x²/2 (or an equivalent form) with the double-angle identity used. (c) 0 ≤ x ≤ 2 and a description of going out to (2, −1) and back along the same arc.
    - slug: trig-u05-w30-q24
      type: short_answer
      topic_code: "5.6"
      source: "Original item; Common Core HSN-CN.B.5 (extension)"
      points: 3
      prompt: |
        Let z = 4(cos(π/3) + i sin(π/3)) and w = 2(cos(π/6) + i sin(π/6)).

        (a) Find zw in trigonometric form and in the form a + bi.
        (b) Find z/w in trigonometric form and in the form a + bi.
        (c) Describe, in terms of distance from the origin and rotation, what multiplying a complex number by w does to its point in the complex plane.
      answer: |
        (a) zw = 8(cos(π/2) + i sin(π/2)) = 8i.
        (b) z/w = 2(cos(π/6) + i sin(π/6)) = √3 + i.
        (c) Multiplying by w doubles the distance from the origin (|w| = 2) and rotates the point counterclockwise about the origin by π/6 (30°).
      explanation: |
        Three points, one per part. (a) multiply moduli (8), add arguments (π/2), and give 8i. (b) divide moduli (2), subtract arguments (π/6), and give √3 + i. (c) both the scaling by 2 and the counterclockwise rotation by π/6.
    - slug: trig-u05-w30-q25
      type: long_answer
      topic_code: "5.9"
      source: "Original item; Common Core HSF-TF.C.8 (extension)"
      points: 6
      prompt: |
        A hypothetical survey drone flies one lap of a circular path given by x = 40 + 30 cos(πt/10), y = 50 + 30 sin(πt/10) for 0 ≤ t ≤ 20, where x and y are in metres and t is in seconds.

        (A) (i) Eliminate the parameter and identify the centre and radius of the path.
        (ii) Find the drone's starting point, and state whether it flies clockwise or counterclockwise, with a reason.

        (B) (i) Find the drone's position at t = 5 and at t = 15.
        (ii) Show that the interval 0 ≤ t ≤ 20 gives exactly one lap, and find the drone's speed in metres per second to the nearest hundredth.

        (C) After the lap, the drone flies in a straight line at constant speed from its finishing point to a landing pad at (10, 10), taking 20 seconds.
        (i) Write parametric equations for this flight, with s seconds measured from the start of the flight, 0 ≤ s ≤ 20.
        (ii) Find the drone's position at s = 5, and the length of the straight flight to the nearest hundredth of a metre.
      answer: |
        (A) (i) cos(πt/10) = (x − 40)/30 and sin(πt/10) = (y − 50)/30, so (x − 40)² + (y − 50)² = 900: a circle with centre (40, 50) and radius 30 m.
        (ii) At t = 0 the drone is at (70, 50). At t = 5 it is at (40, 80), a quarter-turn later above the centre, so it moves counterclockwise (x decreases and y increases just after t = 0).
        (B) (i) t = 5: (40 + 30 cos(π/2), 50 + 30 sin(π/2)) = (40, 80). t = 15: (40 + 30 cos(3π/2), 50 + 30 sin(3π/2)) = (40, 20).
        (ii) The angle πt/10 runs from 0 to 2π as t runs from 0 to 20, which is exactly one full turn (period 2π/(π/10) = 20 s). The lap is 2π · 30 = 60π m long, so the speed is 60π/20 = 3π ≈ 9.42 m/s.
        (C) (i) The drone finishes the lap at (70, 50). The displacement to (10, 10) is ⟨−60, −40⟩, covered in 20 s, so x = 70 − 3s, y = 50 − 2s, 0 ≤ s ≤ 20.
        (ii) At s = 5: (55, 40). The length is √(60² + 40²) = √5200 ≈ 72.11 m.
      explanation: |
        Six points. (A) 1 point for (x − 40)² + (y − 50)² = 900 with centre (40, 50) and radius 30; 1 point for the start (70, 50) and counterclockwise with a valid reason (a later point, or the signs of the changes). (B) 1 point for (40, 80) and (40, 20); 1 point for showing one lap (angle 0 to 2π or period 20 s) and 9.42 m/s. (C) 1 point for x = 70 − 3s, y = 50 − 2s (or equivalent with correct start and end); 1 point for (55, 40) and 72.11 m.
