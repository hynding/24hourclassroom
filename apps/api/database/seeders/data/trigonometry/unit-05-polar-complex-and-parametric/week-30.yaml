      points: 1
      prompt: |
        (Calculator.) A mark on a hypothetical wheel of radius 0.4 m has position x = 0.4 cos(4πt), y = 0.4 sin(4πt) metres at time t seconds, so the wheel turns at 120 revolutions per minute. To the nearest hundredth, what is the linear speed of the mark in metres per second?
      answer: { value: 5.03, tolerance: 0.01 }
      explanation: |
