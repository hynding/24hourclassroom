        True or false: The parametric equations x = t², y = t² for all real t trace the entire line y = x.
      answer: false
      explanation: |
        False. Every point satisfies y = x, but x = t² is never negative, so only the ray y = x with x ≥ 0 is traced (each point twice, at t and −t, except the origin).
