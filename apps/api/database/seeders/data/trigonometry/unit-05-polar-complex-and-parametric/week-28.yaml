week: 28
unit: 5
title: "Complex Numbers in Trigonometric Form"
topics: ["5.4", "5.5", "5.6"]
guide: guides/week-28.md
guide_description: |
  Complex numbers as points: the complex plane, the modulus |a + bi| = √(a² + b²), distance |z − w| and
  midpoint; the argument with quadrant care; trigonometric form z = r(cos θ + i sin θ) = r cis θ and converting
  both ways; and products and quotients (multiply moduli and add arguments, divide and subtract), derived from
  the sum formulas and read as a rotation plus a scaling. Worked examples: the distance from 1 + 2i to 4 − 2i,
  −2 + 2√3 i = 4 cis(2π/3), 3 − 4i with a calculator, 6 cis(5π/4) in rectangular form, 2 cis(π/3) · 5 cis(π/6)
  = 10i checked by FOIL, and (−2 + 2√3 i)/(1 + i) = 2√2 cis(5π/12).
flashcards_description: |
  31 cards on plotting complex numbers, modulus, distance and midpoint, arguments by quadrant, trigonometric
  form and back, products, quotients, conjugates, and multiplication as rotation and scaling.

flashcards:
  - front: Complex number a + bi in the complex plane → where it goes
    back: |
      At the point (a, b): real part on the horizontal (real) axis, imaginary part on the vertical (imaginary) axis.
    topic_code: "5.4"
  - front: Modulus |a + bi| → formula and meaning
    back: |
      √(a² + b²), the distance from 0 to the point (a, b).
    topic_code: "5.4"
  - front: "|7 − 24i| → value"
    back: |
      √(49 + 576) = √625 = 25.
    topic_code: "5.4"
  - front: Distance between complex numbers z and w → formula
    back: |
      |z − w|, the modulus of the difference.
    topic_code: "5.4"
  - front: Distance from 1 + 2i to 4 − 2i → value
    back: |
      |(1 + 2i) − (4 − 2i)| = |−3 + 4i| = 5.
    topic_code: "5.4"
  - front: Midpoint of complex numbers z and w → formula
    back: |
      (z + w)/2: average the real parts and the imaginary parts.
    topic_code: "5.4"
  - front: Adding complex numbers in the plane → picture
    back: |
      Like adding vectors: z + w is the fourth corner of the parallelogram on 0, z and w.
    topic_code: "5.4"
  - front: Argument of a complex number → definition
    back: |
      An angle θ from the positive real axis to the ray through z. Arguments differ by multiples of 2π; this course uses 0 ≤ θ < 2π unless told otherwise.
    topic_code: "5.5"
  - front: Trigonometric form of a + bi → formula
    back: |
      r(cos θ + i sin θ) = r cis θ, with r = √(a² + b²) and a = r cos θ, b = r sin θ.
    topic_code: "5.5"
  - front: cis θ → what it abbreviates
    back: |
      cos θ + i sin θ, a complex number of modulus 1 at angle θ.
    topic_code: "5.5"
  - front: −2 + 2√3 i in trigonometric form → result
    back: |
      r = 4; tan θ = −√3 with the point in quadrant II, so θ = 2π/3. Answer 4 cis(2π/3).
    topic_code: "5.5"
  - front: 3 − 4i in trigonometric form, θ in [0, 2π) → result
    back: |
      r = 5; tan⁻¹(−4/3) ≈ −0.927 is in quadrant IV already, so add 2π: θ ≈ 5.36. Answer ≈ 5 cis 5.36.
    topic_code: "5.5"
  - front: 5i, −7 and −5i in trigonometric form → results
    back: |
      5 cis(π/2), 7 cis π and 5 cis(3π/2). Points on the axes need no tangent.
    topic_code: "5.5"
  - front: 6 cis(5π/4) in the form a + bi → result
    back: |
      6(−√2/2) + 6(−√2/2)i = −3√2 − 3√2 i.
    topic_code: "5.5"
  - front: 1 + i in trigonometric form → result
    back: |
      √2 cis(π/4).
    topic_code: "5.5"
  - front: −2 cis(π/6) → why it is not in trigonometric form
    back: |
      Trigonometric form needs r ≥ 0. The number equals 2 cis(π/6 + π) = 2 cis(7π/6).
    topic_code: "5.5"
  - front: Product r₁ cis θ₁ · r₂ cis θ₂ → rule
    back: |
      r₁r₂ cis(θ₁ + θ₂): multiply the moduli, add the arguments.
    topic_code: "5.6"
  - front: Quotient r₁ cis θ₁ ÷ r₂ cis θ₂ → rule
    back: |
      (r₁/r₂) cis(θ₁ − θ₂): divide the moduli, subtract the arguments (numerator minus denominator).
    topic_code: "5.6"
  - front: Why products add arguments → which identities
    back: |
      FOIL gives real part cos θ₁ cos θ₂ − sin θ₁ sin θ₂ = cos(θ₁ + θ₂) and imaginary part sin θ₁ cos θ₂ + cos θ₁ sin θ₂ = sin(θ₁ + θ₂): the sum formulas.
    topic_code: "5.6"
  - front: 2 cis(π/3) · 5 cis(π/6) → result
    back: |
      10 cis(π/2) = 10i. FOIL on (1 + √3 i)(5√3/2 + 5i/2) confirms it.
    topic_code: "5.6"
  - front: (−2 + 2√3 i)/(1 + i) in trigonometric form → result
    back: |
      4 cis(2π/3) ÷ √2 cis(π/4) = 2√2 cis(5π/12), which is (√3 − 1) + (√3 + 1)i.
    topic_code: "5.6"
  - front: Multiplying by r cis φ → geometric effect
    back: |
      Stretches distances from 0 by r and rotates counterclockwise by φ about 0.
    topic_code: "5.6"
  - front: Multiplying a complex number by i → geometric effect
    back: |
      A 90° (π/2) counterclockwise rotation about 0, with the modulus unchanged, since i = cis(π/2).
    topic_code: "5.6"
  - front: Conjugate of r cis θ → trigonometric form
    back: |
      r cis(−θ): the mirror image across the real axis.
    topic_code: "5.6"
  - front: z · z̄ in trigonometric form → result
    back: |
      r cis θ · r cis(−θ) = r² cis 0 = r² = |z|², a real number.
    topic_code: "5.6"
  - front: 12 cis(5π/6) ÷ 3 cis(π/3) → result
    back: |
      4 cis(π/2) = 4i.
    topic_code: "5.6"
  - front: Argument sum beyond 2π, such as 2π/3 + 5π/3 → what to do
    back: |
      7π/3 is coterminal with π/3; reduce it if the item asks for 0 ≤ θ < 2π.
    topic_code: "5.6"
  - front: Complex number a + bi and polar point (a, b) → shared numbers
    back: |
      The modulus is the polar r and an argument is the polar θ: r cis θ is the complex version of the polar point (r, θ).
    topic_code: "5.5"
  - front: Error-spot → "|3 − 4i| = 3 + 4 = 7"
    back: |
      The modulus is a distance: √(9 + 16) = 5.
    topic_code: "5.4"
  - front: Error-spot → "The argument of −1 − i is π/4, since tan θ = 1"
    back: |
      −1 − i is in quadrant III, so the argument is π + π/4 = 5π/4.
    topic_code: "5.5"
  - front: Error-spot → "3 cis(π/4) · 2 cis(π/4) = 5 cis(π/2)"
    back: |
      Moduli multiply, not add: 6 cis(π/2) = 6i.
    topic_code: "5.6"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 5.4 to 5.6: the complex plane, modulus and
    distance, arguments and trigonometric form, products and quotients), with about a third reviewing weeks 26
    and 27 (polar equations and graphs) and Units 1, 3 and 4 (exact values, sum formulas, vectors and the dot
    product). Includes a shared-context set on z = −2 + 2√3 i and w = 1 + i. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the
    short answers and the long answer are graded by your teacher against the scoring notes. Items marked
    (Calculator.) need a calculator; the rest are designed to be done by hand. Arguments are in radians with
    0 ≤ θ < 2π unless an item says otherwise.
  questions:
    # ---- Stimulus set: two complex numbers (5.4-5.6)
    - slug: trig-u05-w28-q01
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; Common Core HSN-CN.B.4"
      points: 1
      stimulus: |
        Let z = −2 + 2√3 i and w = 1 + i.
      prompt: |
        What is |z|?
      options:
        - "16"
        - "4"
        - "2 + 2√3"
        - "√8"
      option_explanations:
        - |
          16 is a² + b² = 4 + 12; the modulus is its square root.
        - |
          Correct. |z| = √((−2)² + (2√3)²) = √(4 + 12) = √16 = 4.
        - |
          The modulus is not the sum of the sizes of the parts; it is a distance found by Pythagoras.
        - |
          √8 uses 2 instead of 2√3 for the imaginary part: (2√3)² = 12, not 4.
      answer: 1
    - slug: trig-u05-w28-q02
      type: multiple_choice
      topic_code: "5.5"
      source: "Original item; Common Core HSN-CN.B.4"
      points: 1
      stimulus: |
        Let z = −2 + 2√3 i and w = 1 + i.
      prompt: |
        What is the argument of z, with 0 ≤ θ < 2π?
      options:
        - "−π/3"
        - "π/3"
        - "5π/3"
        - "2π/3"
      option_explanations:
        - |
          −π/3 is what tan⁻¹(−√3) returns, a quadrant IV angle, and it is outside [0, 2π) as well.
        - |
          π/3 is the reference angle; z has a negative real part, so it is not in quadrant I.
        - |
          5π/3 is coterminal with −π/3, a quadrant IV angle; z is in quadrant II.
        - |
          Correct. tan θ = 2√3/(−2) = −√3 gives reference angle π/3, and z is in quadrant II, so θ = π − π/3 = 2π/3.
      answer: 3
    - slug: trig-u05-w28-q03
      type: multiple_choice
      topic_code: "5.5"
      source: "Original item; Common Core HSN-CN.B.4"
      points: 1
      stimulus: |
        Let z = −2 + 2√3 i and w = 1 + i.
      prompt: |
        Which is the trigonometric form of w?
      options:
        - "2 cis(π/4)"
        - "√2 cis(3π/4)"
        - "√2 cis(π/4)"
        - "√2 cis(π/2)"
      option_explanations:
        - |
          2 is 1² + 1², the square of the modulus; |w| = √2.
        - |
          3π/4 points into quadrant II, but w = 1 + i has positive real and imaginary parts.
        - |
          Correct. |w| = √(1 + 1) = √2 and tan θ = 1 in quadrant I gives θ = π/4.
        - |
          π/2 points straight up the imaginary axis, which would mean a real part of 0.
      answer: 2
    - slug: trig-u05-w28-q04
      type: multiple_choice
      topic_code: "5.6"
      source: "Original item; Common Core HSN-CN.B.5"
      points: 1
      stimulus: |
        Let z = −2 + 2√3 i and w = 1 + i.
      prompt: |
        Which is the trigonometric form of the product zw?
      options:
        - "4√2 cis(11π/12)"
        - "2√2 cis(5π/12)"
        - "(4 + √2) cis(11π/12)"
        - "4√2 cis(5π/12)"
      option_explanations:
        - |
          Correct. zw = 4 cis(2π/3) · √2 cis(π/4) = 4√2 cis(2π/3 + π/4) = 4√2 cis(11π/12).
        - |
          This is the quotient z/w: dividing the moduli and subtracting the arguments.
        - |
          The arguments are added correctly, but moduli multiply; they do not add.
        - |
          The moduli are multiplied correctly, but the arguments must be added, not subtracted.
      answer: 0
    # ---- Topics 5.4-5.6
    - slug: trig-u05-w28-q05
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; Common Core HSN-CN.B.4"
      points: 1
      prompt: |
        What is the modulus of 7 − 24i?
      options:
        - "31"
        - "17"
        - "625"
        - "25"
      option_explanations:
        - |
          31 adds the sizes of the parts, 7 + 24; the modulus is a hypotenuse, not a sum.
        - |
          17 is 24 − 7; the parts combine by Pythagoras, and the sign of −24 disappears when squared.
        - |
          625 = 49 + 576 is the square of the modulus; take the square root.
        - |
          Correct. |7 − 24i| = √(7² + (−24)²) = √625 = 25.
      answer: 3
    - slug: trig-u05-w28-q06
      type: multiple_choice
      topic_code: "5.5"
      source: "Original item; Common Core HSN-CN.B.4"
      points: 1
      prompt: |
        Write 6 cis(5π/4) in the form a + bi.
      options:
        - "−3√2 − 3√2 i"
        - "3√2 + 3√2 i"
        - "−3√3 − 3i"
        - "−3√2 + 3√2 i"
      option_explanations:
        - |
          Correct. cos(5π/4) = sin(5π/4) = −√2/2, so 6 cis(5π/4) = −3√2 − 3√2 i, in quadrant III.
        - |
          These are the values at π/4; at 5π/4 (quadrant III) both cosine and sine are negative.
        - |
          This uses the π/6 values √3/2 and 1/2; 5π/4 has reference angle π/4.
        - |
          The sine of 5π/4 is negative as well, so the imaginary part is −3√2, not +3√2.
      answer: 0
    - slug: trig-u05-w28-q07
      type: multiple_choice
      topic_code: "5.6"
      source: "Original item; Common Core HSN-CN.B.5"
      points: 1
      prompt: |
        Simplify 12 cis(5π/6) ÷ 3 cis(π/3).
      options:
        - "4 cis(7π/6)"
        - "4i"
        - "36 cis(π/2)"
        - "9 cis(π/2)"
      option_explanations:
        - |
          7π/6 = 5π/6 + π/3 adds the arguments; a quotient subtracts them.
        - |
          Correct. Divide moduli and subtract arguments: 4 cis(5π/6 − π/3) = 4 cis(π/2) = 4i.
        - |
          36 multiplies the moduli; for a quotient divide them, 12/3 = 4.
        - |
          9 = 12 − 3 subtracts the moduli; arguments subtract, but moduli divide.
      answer: 1
    - slug: trig-u05-w28-q08
      type: multiple_choice
      topic_code: "5.4"
      source: "Original item; Common Core HSN-CN.B.6"
      points: 1
      prompt: |
        What is the distance between 2 + 3i and −4 − 5i in the complex plane?
      options:
        - "2√2"
        - "14"
        - "10"
        - "100"
      option_explanations:
        - |
          2√2 is |z + w| = |−2 − 2i|; distance uses the difference z − w.
        - |
          14 = 6 + 8 adds the horizontal and vertical gaps; the straight-line distance is the hypotenuse.
        - |
          Correct. (2 + 3i) − (−4 − 5i) = 6 + 8i, and |6 + 8i| = √(36 + 64) = 10.
        - |
          100 is the square of the distance; take the square root.
      answer: 2
    - slug: trig-u05-w28-q09
      type: multiple_choice
      topic_code: "5.5"
      source: "Original item; Common Core HSN-CN.B.4"
      points: 1
      prompt: |
        Which is the trigonometric form of −5i, with 0 ≤ θ < 2π?
      options:
        - "5 cis(3π/2)"
        - "5 cis(π/2)"
        - "5 cis π"
        - "25 cis(3π/2)"
      option_explanations:
        - |
          Correct. −5i lies 5 units down the imaginary axis, so r = 5 and θ = 3π/2.
        - |
          5 cis(π/2) = 5i, which is 5 units up the imaginary axis, not down.
        - |
          5 cis π = −5, on the negative real axis; −5i is on the imaginary axis.
        - |
          The modulus is 5, the distance from 0; 25 is its square.
      answer: 0
    # ---- Spiral review
    - slug: trig-u05-w28-q10
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; Common Core HSN-VM.A.1"
      points: 1
      prompt: |
        The complex number −3 + 3i and the vector ⟨−3, 3⟩ share a magnitude and a direction angle. What are they (direction in degrees)?
      options:
        - "Magnitude 6, direction 135°"
        - "Magnitude 3√2, direction 45°"
        - "Magnitude 3√2, direction 135°"
        - "Magnitude 3√2, direction −45°"
      option_explanations:
        - |
          The direction is right, but the magnitude is √(9 + 9) = 3√2, not 3 + 3.
        - |
          45° is the reference angle; the vector points left and up, into quadrant II.
        - |
          Correct. √((−3)² + 3²) = 3√2, and tan θ = −1 in quadrant II gives θ = 135°.
        - |
          −45° is what tan⁻¹(−1) returns, but that points into quadrant IV; add 180°.
      answer: 2
    - slug: trig-u05-w28-q11
      type: multiple_choice
      topic_code: "3.4"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        The product 4 cis(2π/3) · √2 cis(π/4) has argument 11π/12 = 2π/3 + π/4. Use a sum formula to find the exact value of cos(11π/12).
      options:
        - "(√6 − √2)/4"
        - "(√6 + √2)/4"
        - "−(√6 − √2)/4"
        - "−(√6 + √2)/4"
      option_explanations:
        - |
          (√6 − √2)/4 is cos(5π/12), a positive value; 11π/12 is in quadrant II, where cosine is negative.
        - |
          (√6 + √2)/4 is cos(π/12); the sign must be negative for an angle in quadrant II.
        - |
          −(√6 − √2)/4 is cos(7π/12); it comes from a sign slip in the second product of the formula.
        - |
          Correct. cos(2π/3)cos(π/4) − sin(2π/3)sin(π/4) = (−1/2)(√2/2) − (√3/2)(√2/2) = −(√2 + √6)/4.
      answer: 3
    - slug: trig-u05-w28-q12
      type: multiple_choice
      topic_code: "5.3"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 1
      prompt: |
        Which best describes the graph of the polar equation r = 5 − 2 cos θ?
      options:
        - "A dimpled limaçon"
        - "A convex limaçon"
        - "A cardioid"
        - "A limaçon with an inner loop"
      option_explanations:
        - |
          Dimpled limaçons have 1 < a/b < 2; here a/b = 5/2 = 2.5.
        - |
          Correct. a/b = 5/2 ≥ 2, so the limaçon is convex: no dent and no loop.
        - |
          A cardioid needs a = b; here r never drops below 5 − 2 = 3.
        - |
          An inner loop needs r to turn negative, which requires a/b < 1.
      answer: 1
    - slug: trig-u05-w28-q13
      type: multi_select
      topic_code: "5.6"
      source: "Original item; Common Core HSN-CN.B.5"
      points: 2
      partial_credit: true
      prompt: |
        Let z = 2 cis(π/6) and w = 3 cis(π/2). Which statements about z and w are true? Select all that apply.
      options:
        - "zw = 6 cis(2π/3)"
        - "|z + w| = 5"
        - "w/z = (3/2) cis(π/3)"
        - "The conjugate of z is 2 cis(11π/6)."
        - "iz = 2 cis(7π/6)"
      option_explanations:
        - |
          Correct. Multiply the moduli and add the arguments: 6 cis(π/6 + π/2) = 6 cis(2π/3).
        - |
          Moduli add only for numbers in the same direction. z + w = √3 + 4i, so |z + w| = √19 ≈ 4.36.
        - |
          Correct. Divide the moduli and subtract the arguments: (3/2) cis(π/2 − π/6) = (3/2) cis(π/3).
        - |
          Correct. The conjugate is 2 cis(−π/6), and −π/6 is coterminal with 11π/6.
        - |
          Multiplying by i = cis(π/2) adds π/2, giving 2 cis(2π/3); adding π would be multiplying by −1.
      answer: [0, 2, 3]
    - slug: trig-u05-w28-q14
      type: multi_select
      topic_code: "5.2"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 2
      partial_credit: true
      prompt: |
        Which polar equations have a straight line as their graph? Select all that apply.
      options:
        - "r = 3"
        - "θ = π/6"
        - "r = 3 sec θ"
        - "r = 2 sin θ"
        - "r = 4/(cos θ + sin θ)"
      option_explanations:
        - |
          r = 3 is x² + y² = 9, a circle of radius 3 about the pole.
        - |
          Correct. Every r is allowed, so this is the whole line through the pole with slope tan(π/6) = √3/3.
        - |
          Correct. r cos θ = 3 is the vertical line x = 3.
        - |
          r = 2 sin θ is x² + y² = 2y, a circle of radius 1 centred at (0, 1).
        - |
          Correct. r cos θ + r sin θ = 4 is the line x + y = 4.
      answer: [1, 2, 4]
    - slug: trig-u05-w28-q15
      type: true_false
      topic_code: "5.6"
      source: "Original item; Common Core HSN-CN.B.5"
      points: 1
      prompt: |
        True or false: Multiplying any nonzero complex number by i rotates its point 90° counterclockwise about 0 and leaves its modulus unchanged.
      answer: true
      explanation: |
        True. i = 1 cis(π/2), so multiplying by i multiplies the modulus by 1 and adds π/2 (90°) to the argument. For example i(3 + 2i) = −2 + 3i, which has the same modulus √13 and is a quarter turn further round.
    - slug: trig-u05-w28-q16
      type: true_false
      topic_code: "1.10"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      prompt: |
        True or false: sin(5π/4) = sin(π/4), because the two angles have the same reference angle.
      answer: false
      explanation: |
        False. They share the reference angle π/4, so the values have the same size, but 5π/4 is in quadrant III, where sine is negative: sin(5π/4) = −√2/2, while sin(π/4) = √2/2.
    - slug: trig-u05-w28-q17
      type: fill_blank
      topic_code: "5.5"
      source: "Original item; Common Core HSN-CN.B.4"
      points: 1
      prompt: |
        The exact argument of the real number −7, with 0 ≤ θ < 2π and in radians, is ____.
      answer: ["π", "pi", "1π", "π radians", "pi radians"]
      explanation: |
        −7 lies on the negative real axis, half a turn from the positive real axis, so θ = π and −7 = 7 cis π.
    - slug: trig-u05-w28-q18
      type: fill_blank
      topic_code: "4.8"
      source: "Original item; Common Core HSN-VM.B.4 (extension)"
      points: 1
      prompt: |
        The dot product ⟨3, −4⟩ · ⟨2, 5⟩ equals ____.
      answer: ["-14", "−14"]
      explanation: |
        Multiply matching components and add: 3 · 2 + (−4) · 5 = 6 − 20 = −14. The negative value means the angle between the vectors is obtuse.
    - slug: trig-u05-w28-q19
      type: numeric
      topic_code: "5.5"
      source: "Original item; Common Core HSN-CN.B.4"
      points: 1
      prompt: |
        (Calculator.) Find the argument of 3 − 4i with 0 ≤ θ < 2π, in radians to the nearest hundredth.
      answer: { value: 5.36, tolerance: 0.01 }
      explanation: |
        tan⁻¹(−4/3) ≈ −0.927, which is in quadrant IV like 3 − 4i but outside [0, 2π). Add 2π: θ ≈ 5.356, which is 5.36 to the nearest hundredth.
    - slug: trig-u05-w28-q20
      type: numeric
      topic_code: "4.8"
      source: "Original item; Common Core HSN-VM.B.4 (extension)"
      points: 1
      prompt: |
        (Calculator.) Find the angle between the vectors ⟨3, 1⟩ and ⟨1, 2⟩, in degrees to the nearest tenth.
      answer: { value: 45.0, tolerance: 0.05 }
      explanation: |
        cos θ = (3 + 2)/(√10 · √5) = 5/√50 = 1/√2, so θ = 45.0°. (As complex numbers, (1 + 2i)/(3 + i) = (1 + i)/2, whose argument is 45°: the angle between two numbers is the difference of their arguments.)
    - slug: trig-u05-w28-q21
      type: short_answer
      topic_code: "5.6"
      source: "Original item; Common Core HSN-CN.B.5"
      points: 3
      prompt: |
        Let z = 3 − 3√3 i and w = 2 cis(π/6).

        (a) Write z in trigonometric form with 0 ≤ θ < 2π.
        (b) Find zw in trigonometric form and in the form a + bi.
        (c) Find z/w in trigonometric form and in the form a + bi.
      answer: |
        (a) |z| = √(9 + 27) = 6; tan θ = −√3 with z in quadrant IV, so θ = 5π/3. z = 6 cis(5π/3).
        (b) zw = 12 cis(5π/3 + π/6) = 12 cis(11π/6) = 12(√3/2 − (1/2)i) = 6√3 − 6i.
        (c) z/w = 3 cis(5π/3 − π/6) = 3 cis(3π/2) = −3i.
      explanation: |
        Three points, one per part. (a) 6 cis(5π/3), with the quadrant handled. (b) 12 cis(11π/6) and 6√3 − 6i. (c) 3 cis(3π/2) and −3i.
    - slug: trig-u05-w28-q22
      type: short_answer
      topic_code: "5.3"
      source: "Original item; Common Core HSN-CN.B.4 (extension)"
      points: 3
      prompt: |
        Consider the polar equation r = 3 cos 2θ.

        (a) State the number of petals and the length of each.
        (b) Find every θ in [0, 2π) where the graph passes through the pole.
        (c) Use symmetry tests to show that the graph is symmetric about the polar axis and about the pole.
      answer: |
        (a) n = 2 is even, so 4 petals, each of length 3.
        (b) cos 2θ = 0 gives 2θ = π/2 + kπ, so θ = π/4, 3π/4, 5π/4, 7π/4.
        (c) Polar axis: replacing (r, θ) by (r, −θ) gives r = 3 cos(−2θ) = 3 cos 2θ, unchanged. Pole: replacing (r, θ) by (r, θ + π) gives r = 3 cos(2θ + 2π) = 3 cos 2θ, unchanged.
      explanation: |
        Three points, one per part. (a) 4 petals of length 3. (b) all four zeros. (c) both substitutions carried out correctly (any valid alternative substitution is acceptable).
    - slug: trig-u05-w28-q23
      type: long_answer
      topic_code: "5.6"
      source: "Original item; Common Core HSN-CN.B.5"
      points: 6
      prompt: |
        Let z = 1 + √3 i and w = √3 + i.

        (A) (i) Write z and w in trigonometric form.
        (ii) Plot both numbers in the complex plane and state the angle between their rays from 0.

        (B) (i) Find zw by multiplying in rectangular form (FOIL).
        (ii) Find zw in trigonometric form, and show that it agrees with (i).

        (C) (i) Find z/w in trigonometric form and in the form a + bi.
        (ii) Find a complex number u such that multiplying any complex number by u rotates its point 90° counterclockwise about 0 and doubles its distance from 0. Explain your choice.
      answer: |
        (A) (i) |z| = √(1 + 3) = 2 and z is in quadrant I with tan θ = √3, so z = 2 cis(π/3). |w| = 2 and tan θ = 1/√3 in quadrant I, so w = 2 cis(π/6).
        (ii) z is at (1, √3) and w at (√3, 1), both 2 units from 0; the angle between their rays is π/3 − π/6 = π/6 (30°). They are mirror images across the line y = x.
        (B) (i) (1 + √3 i)(√3 + i) = √3 + i + 3i + √3 i² = √3 − √3 + 4i = 4i.
        (ii) zw = 4 cis(π/3 + π/6) = 4 cis(π/2) = 4(0 + i) = 4i, the same as (i).
        (C) (i) z/w = (2/2) cis(π/3 − π/6) = cis(π/6) = √3/2 + (1/2)i.
        (ii) u = 2 cis(π/2) = 2i. Multiplying by u multiplies every modulus by |u| = 2 and adds arg u = π/2 to every argument, which is a 90° counterclockwise rotation combined with doubling the distance from 0.
      explanation: |
        Six points. (A) 1 point for both trigonometric forms; 1 point for a correct plot description and the angle π/6. (B) 1 point for 4i by FOIL with i² = −1 used; 1 point for 4 cis(π/2) = 4i and the agreement stated. (C) 1 point for cis(π/6) = √3/2 + i/2; 1 point for u = 2i with a reason referring to modulus 2 and argument π/2.
