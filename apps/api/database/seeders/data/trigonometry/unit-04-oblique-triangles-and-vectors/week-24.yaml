      points: 1
      prompt: |
        (Calculator.) From point A on level ground, the angle of elevation to the top of a hypothetical tower is 32°. From point B, 50 m closer to the tower along the same line, the angle of elevation is 47°. To the nearest hundredth of a metre, how tall is the tower?
      answer: { value: 74.87, tolerance: 0.01 }
      explanation: |
        In the triangle formed by A, B and the top T, the angle at A is 32°, the angle at B is 180° − 47° = 133°, and the angle at T is 15°. Law of sines: BT = 50 sin 32°/sin 15° ≈ 102.37 m. The height is BT sin 47° ≈ 74.87 m.
    - slug: trig-u04-w24-q23
      type: short_answer
      topic_code: "4.8"
      source: "Original item; Common Core HSN-VM.B.4 (extension)"
      points: 3
      prompt: |
        Let u = ⟨2, −1⟩, v = ⟨3, 6⟩ and w = ⟨−4, 1⟩.

        (a) Show that u and v are orthogonal.
        (b) (Calculator.) Find the angle between u and w to the nearest hundredth of a degree.
        (c) Find both unit vectors that are orthogonal to u, in exact form.
      answer: |
        (a) u · v = 2·3 + (−1)·6 = 6 − 6 = 0, so u and v are orthogonal.
        (b) u · w = −8 − 1 = −9; |u| = √5, |w| = √17; cos θ = −9/√85 ≈ −0.9762, so θ ≈ 167.47°.
        (c) ⟨1, 2⟩ is orthogonal to u (2 − 2 = 0) and has length √5, so the unit vectors are ⟨1/√5, 2/√5⟩ and ⟨−1/√5, −2/√5⟩ (that is, ±⟨√5/5, 2√5/5⟩).
      explanation: |
        Three points, one per part. (a) dot product computed as 0 with the conclusion. (b) 167.47° (accept 167.5°), with the work shown. (c) both unit vectors, in any equivalent exact form; one correct vector earns half credit at the teacher's discretion.
    - slug: trig-u04-w24-q24
      type: short_answer
      topic_code: "4.2"
      source: "Original item; Common Core HSG-SRT.D.11"
      points: 3
      prompt: |
        (Calculator.) In triangle ABC, A = 42°, a = 9 and b = 12.

        (a) Use the height h = b sin A to show that two triangles fit these measurements.
        (b) Find both possible values of B, to the nearest hundredth of a degree.
        (c) Find the value of C in each triangle.
      answer: |
        (a) h = 12 sin 42° ≈ 8.03. Since h < a < b (8.03 < 9 < 12), side a can reach the base at two points, so there are two triangles.
        (b) sin B = 12 sin 42°/9 ≈ 0.8922, so B ≈ 63.15° or B ≈ 180° − 63.15° = 116.85°.
        (c) C ≈ 180° − 42° − 63.15° = 74.85° in the first triangle and C ≈ 180° − 42° − 116.85° = 21.15° in the second.
      explanation: |
        Three points, one per part. (a) h ≈ 8.03 and the comparison h < a < b. (b) both 63.15° and 116.85° (accept within 0.01). (c) both 74.85° and 21.15°, with follow-through from (b).
    - slug: trig-u04-w24-q25
      type: long_answer
      topic_code: "4.9"
      source: "Original item; Common Core HSN-VM.B.5 (extension)"
      points: 6
      prompt: |
        (Calculator.) A hypothetical robot arm pushes a block across a flat table with a constant force F = ⟨12, 5⟩ newtons while the block moves in a straight line with displacement d = ⟨8, 15⟩ metres.

        (A) (i) Find the work done by F.
        (ii) Find the angle between F and d to the nearest hundredth of a degree.

        (B) (i) Find proj_d F, and write F as the sum of a vector parallel to d and a vector orthogonal to d, with components to the nearest thousandth.
        (ii) Explain why only the parallel part does work, and check the work in (A) as (comp_d F) · |d|.

        (C) (i) A force with the same magnitude as F could be aimed in any direction. Find the direction (as a vector) that would do the most work over the same displacement, and the maximum work.
        (ii) Describe every direction in which a force of this size would do no work over d, and explain why.
      answer: |
        (A) (i) W = F · d = 12·8 + 5·15 = 96 + 75 = 171 J.
        (ii) |F| = 13, |d| = 17; cos θ = 171/221 ≈ 0.7738, θ ≈ 39.31°.
        (B) (i) proj_d F = (171/289)⟨8, 15⟩ ≈ ⟨4.734, 8.875⟩. The orthogonal part is F − proj_d F ≈ ⟨7.266, −3.875⟩, so F ≈ ⟨4.734, 8.875⟩ + ⟨7.266, −3.875⟩. Check: ⟨7.266, −3.875⟩ · ⟨8, 15⟩ ≈ 58.13 − 58.13 = 0.
        (ii) Work is F · d, and the orthogonal part has dot product 0 with d: a push across the direction of motion transfers no energy along it. comp_d F = 171/17 ≈ 10.059 N, and 10.059 · 17 = 171 J, matching (A).
        (C) (i) The work |F||d| cos θ is largest when cos θ = 1, that is when the force points along d: F′ = 13 · ⟨8, 15⟩/17 = ⟨104/17, 195/17⟩ ≈ ⟨6.118, 11.471⟩. The maximum work is 13 · 17 = 221 J.
        (ii) No work is done when cos θ = 0, so when the force is perpendicular to d: the directions of ⟨15, −8⟩ and ⟨−15, 8⟩, that is ±(13/17)⟨15, −8⟩ for a force of magnitude 13. Their dot product with d is 120 − 120 = 0.
      explanation: |
        Six points. (A) 1 point for 171 J; 1 point for 39.31° (accept 39.3°). (B) 1 point for the projection and the orthogonal part (within 0.01); 1 point for explaining that the orthogonal part's dot product with d is zero and confirming 10.059 × 17 = 171. (C) 1 point for the direction along d (any positive multiple of ⟨8, 15⟩ scaled to length 13) and 221 J; 1 point for both perpendicular directions with the reason cos 90° = 0.
