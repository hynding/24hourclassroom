      prompt: |
        True or false: The dot product of two vectors in the plane is another vector in the plane.
      answer: false
      explanation: |
        False. u · v = u₁v₁ + u₂v₂ is a single real number (a scalar). For example, ⟨1, 2⟩ · ⟨3, 4⟩ = 3 + 8 = 11.
