      prompt: |
        In triangle ABC, A = 30°, a = 6 and b = 10. The number of different triangles that fit these measurements is ____.
      answer: ["2", "two"]
      explanation: |
        The height from C is h = b sin A = 10 sin 30° = 5. Since h < a < b (5 < 6 < 10), side a can swing to meet the base in two places: two triangles, one with B acute and one with B obtuse.
