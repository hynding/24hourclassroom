    - slug: trig-u04-w23-q21
      type: numeric
      topic_code: "4.5"
      source: "Original item; Common Core HSG-SRT.D.11"
      points: 1
      prompt: |
        (Calculator.) A ferry sails 12 miles on a bearing of 050°, then turns and sails 9 miles on a bearing of 160°. To the nearest hundredth of a mile, how far is it from its starting point?
      answer: { value: 12.29, tolerance: 0.01 }
      explanation: |
        The course turns through 160° − 50° = 110°, so the angle inside the triangle at the turn is 180° − 110° = 70°. Law of cosines: d² = 12² + 9² − 2(12)(9) cos 70° ≈ 225 − 73.88 = 151.12, so d ≈ 12.29 miles. (Adding the vectors ⟨12 cos 40°, 12 sin 40°⟩ and ⟨9 cos(−70°), 9 sin(−70°)⟩ gives the same distance.)
    - slug: trig-u04-w23-q22
      type: short_answer
