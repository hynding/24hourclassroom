week: 23
unit: 4
title: "Vectors"
topics: ["4.6", "4.7"]
guide: guides/week-23.md
guide_description: |
  Vectors as directed segments with magnitude and direction; component form from initial and terminal points;
  magnitude √(a² + b²); direction angles with the quadrant check; converting between bearings and direction
  angles; v = |v|⟨cos θ, sin θ⟩; scalar multiplication, addition by the triangle and parallelogram rules,
  subtraction, unit vectors and i, j. Worked examples: the vector from (−2, 1) to (4, −7), the direction of
  ⟨−5, 12⟩, an airplane on a bearing of N 40° E, 2u − 3v, a unit vector, and a resultant found by components and
  checked with the law of cosines.
flashcards_description: |
  30 cards on component form, magnitude, direction angles and the quadrant check, bearings, building a vector
  from magnitude and direction, scalar multiples, sums and differences, unit vectors and i, j notation.

flashcards:
  - front: Vector versus scalar → what tells them apart
    back: |
      A vector has a magnitude and a direction (a velocity of 40 mph due west); a scalar has size only (a speed of 40 mph).
    topic_code: "4.6"
  - front: Two directed segments are equivalent vectors → when
    back: |
      When they have the same length and the same direction, wherever their tails are. They have the same component form.
    topic_code: "4.6"
  - front: Vector from P(x₁, y₁) to Q(x₂, y₂) → component form
    back: |
      PQ = ⟨x₂ − x₁, y₂ − y₁⟩: terminal point minus initial point.
    topic_code: "4.6"
  - front: Vector from (−2, 1) to (4, −7) → components and length
    back: |
      ⟨6, −8⟩, with magnitude √(36 + 64) = 10.
    topic_code: "4.6"
  - front: Magnitude of ⟨a, b⟩ → formula and source
    back: |
      |v| = √(a² + b²), the Pythagorean theorem on the horizontal and vertical changes.
    topic_code: "4.6"
  - front: Direction angle of a vector → how it is measured
    back: |
      Counterclockwise from the positive x-axis, reported in [0°, 360°).
    topic_code: "4.6"
  - front: Direction angle of ⟨a, b⟩ with a < 0 → why tan⁻¹(b/a) alone fails
    back: |
      tan⁻¹ returns angles in (−90°, 90°), which point right. A vector pointing left needs 180° added (or use the reference angle and its quadrant).
    topic_code: "4.6"
  - front: Direction angle of ⟨−5, 12⟩ → value
    back: |
      Quadrant II; reference angle tan⁻¹(12/5) ≈ 67.38°, so θ ≈ 180° − 67.38° = 112.62°.
    topic_code: "4.6"
  - front: Direction angle of ⟨6, −8⟩ → value in [0°, 360°)
    back: |
      Quadrant IV; tan⁻¹(−8/6) ≈ −53.13°, so θ ≈ 306.87°.
    topic_code: "4.6"
  - front: Direction angle of ⟨0, −3⟩ → value
    back: |
      270°: the vector points straight down. No tangent is needed (it would divide by zero).
    topic_code: "4.6"
  - front: Vector of magnitude |v| at direction angle θ → component form
    back: |
      v = ⟨|v| cos θ, |v| sin θ⟩ = |v|⟨cos θ, sin θ⟩.
    topic_code: "4.6"
  - front: Magnitude 20 at direction angle 210° → exact components
    back: |
      ⟨20 cos 210°, 20 sin 210°⟩ = ⟨−10√3, −10⟩ ≈ ⟨−17.32, −10⟩.
    topic_code: "4.6"
  - front: Bearing to direction angle → conversion rule
    back: |
      θ = 90° − bearing, adding 360° if negative. Bearings run clockwise from north; direction angles counterclockwise from east.
    topic_code: "4.6"
  - front: 300 mph on a bearing of N 40° E → east and north components
    back: |
      θ = 50°: ⟨300 cos 50°, 300 sin 50°⟩ ≈ ⟨192.84, 229.81⟩ mph.
    topic_code: "4.6"
  - front: Velocity on a bearing of S 30° W → direction angle
    back: |
      The bearing is 210°, so θ = 90° − 210° = −120°, which is 240°. Both components are negative.
    topic_code: "4.6"
  - front: Scalar multiple kv for v = ⟨a, b⟩ → components, length and direction
    back: |
      kv = ⟨ka, kb⟩, |kv| = |k||v|. Same direction if k > 0; reversed if k < 0.
    topic_code: "4.7"
  - front: −v compared with v → what changes
    back: |
      Same magnitude, opposite direction: the direction angle changes by 180°. ⟨3, −2⟩ becomes ⟨−3, 2⟩.
    topic_code: "4.7"
  - front: Triangle (head-to-tail) rule for u + v → picture
    back: |
      Put the tail of v at the head of u. The sum runs from the tail of u to the head of v, like two legs of a trip.
    topic_code: "4.7"
  - front: Parallelogram rule for u + v → picture
    back: |
      Put both tails at one point and complete the parallelogram. The sum is the diagonal from the common tail, like two forces pulling one object.
    topic_code: "4.7"
  - front: u − v with both tails at one point → where the arrow runs
    back: |
      From the head of v to the head of u, because v + (u − v) = u. In components, ⟨u₁ − v₁, u₂ − v₂⟩.
    topic_code: "4.7"
  - front: 2u − 3v for u = ⟨3, −2⟩, v = ⟨−1, 4⟩ → result
    back: |
      ⟨6, −4⟩ − ⟨−3, 12⟩ = ⟨9, −16⟩, with magnitude √337 ≈ 18.36.
    topic_code: "4.7"
  - front: "|u + v| compared with |u| + |v| → which is larger"
    back: |
      |u + v| ≤ |u| + |v| (the triangle inequality); equal only when u and v point the same way.
    topic_code: "4.7"
  - front: Unit vector in the direction of v → formula
    back: |
      v/|v|: divide each component by the magnitude. Its components satisfy a² + b² = 1.
    topic_code: "4.7"
  - front: Unit vector in the direction of −5i + 12j → value
    back: |
      (−5/13)i + (12/13)j, since |−5i + 12j| = 13.
    topic_code: "4.7"
  - front: i and j → what they are
    back: |
      The standard unit vectors i = ⟨1, 0⟩ and j = ⟨0, 1⟩, so ⟨a, b⟩ = ai + bj.
    topic_code: "4.7"
  - front: Unit vector at direction angle θ → components
    back: |
      ⟨cos θ, sin θ⟩, the point at angle θ on the unit circle.
    topic_code: "4.7"
  - front: Resultant of 8 at 30° and 5 at 135° → method
    back: |
      Add components: ⟨6.928, 4.000⟩ + ⟨−3.536, 3.536⟩ ≈ ⟨3.393, 7.536⟩; magnitude ≈ 8.26, direction ≈ 65.76°.
    topic_code: "4.7"
  - front: Error-spot → "The vector from P(1, 5) to Q(4, 1) is ⟨−3, 4⟩."
    back: |
      That is P − Q, the reverse vector. PQ = Q − P = ⟨3, −4⟩.
    topic_code: "4.6"
  - front: Error-spot → "⟨−3, 3⟩ has direction angle tan⁻¹(−1) = −45°."
    back: |
      The vector points left and up, quadrant II: θ = 135°. The calculator answer points the opposite way.
    topic_code: "4.6"
  - front: Error-spot → "|u + v| = |u| + |v| = 7 for u = ⟨3, 0⟩, v = ⟨0, 4⟩."
    back: |
      Add first: u + v = ⟨3, 4⟩ and |u + v| = 5. Magnitudes add only for vectors in the same direction.
    topic_code: "4.7"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 4.6 and 4.7: component form, magnitude,
    direction angles and bearings, scalar multiples, sums and differences, unit vectors), with about a third
    reviewing weeks 20–22 (the laws of sines and cosines, the ambiguous case, triangle area, navigation) and
    Units 1 and 2 (bearings, inverse tangent). Includes a shared-context set on the vector from P(−3, 2) to
    Q(5, −4). Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank
    items are matched automatically; the short answers and the long answer are graded by your teacher against
    the scoring notes. Items marked (Calculator.) need a calculator; the rest are designed to be done by hand.
    Angles are in degrees.
  questions:
    # ---- Stimulus set: the vector from P to Q (4.6, 4.7)
    - slug: trig-u04-w23-q01
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; Common Core HSN-VM.A.2"
      points: 1
      stimulus: |
        Let P = (−3, 2) and Q = (5, −4), and let v be the vector from P to Q.
      prompt: |
        What is the component form of v?
      options:
        - "⟨−8, 6⟩"
        - "⟨2, −2⟩"
        - "⟨8, −6⟩"
        - "⟨8, 6⟩"
      option_explanations:
        - |
          This is P − Q, the vector from Q back to P: same length, opposite direction.
        - |
          This adds the coordinates of P and Q instead of subtracting the initial point from the terminal point.
        - |
          Correct. Terminal minus initial: ⟨5 − (−3), −4 − 2⟩ = ⟨8, −6⟩.
        - |
          The horizontal change is right, but Q is below P, so the vertical change −4 − 2 = −6 is negative.
      answer: 2
    - slug: trig-u04-w23-q02
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; Common Core HSN-VM.A.1"
      points: 1
      stimulus: |
        Let P = (−3, 2) and Q = (5, −4), and let v be the vector from P to Q.
      prompt: |
        What is the magnitude of v?
      options:
        - "10"
        - "14"
        - "√28"
        - "100"
      option_explanations:
        - |
          Correct. |v| = √(8² + (−6)²) = √(64 + 36) = √100 = 10.
        - |
          14 is 8 + 6, adding the component sizes; the magnitude uses the Pythagorean theorem, not a sum.
        - |
          √28 comes from 64 − 36; the squares of the components are added, never subtracted.
        - |
          100 is the sum of the squares, |v|²; the square root is still to be taken.
      answer: 0
    - slug: trig-u04-w23-q03
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; Common Core HSN-VM.A.1"
      points: 1
      stimulus: |
        Let P = (−3, 2) and Q = (5, −4), and let v be the vector from P to Q.
      prompt: |
        To the nearest hundredth of a degree, what is the direction angle of v, measured in [0°, 360°)?
      options:
        - "36.87°"
        - "143.13°"
        - "216.87°"
        - "323.13°"
      option_explanations:
        - |
          36.87° is the reference angle tan⁻¹(6/8) placed in quadrant I; v points right and down, into quadrant IV.
        - |
          143.13° is the quadrant II direction, which is the direction of −v, the vector from Q to P.
        - |
          216.87° is in quadrant III, where both components would be negative; v has a positive first component.
        - |
          Correct. v = ⟨8, −6⟩ is in quadrant IV with reference angle tan⁻¹(6/8) ≈ 36.87°, so θ ≈ 360° − 36.87° = 323.13°.
      answer: 3
    - slug: trig-u04-w23-q04
      type: multiple_choice
      topic_code: "4.7"
      source: "Original item; Common Core HSN-VM.B.5"
      points: 1
      stimulus: |
        Let P = (−3, 2) and Q = (5, −4), and let v be the vector from P to Q.
      prompt: |
        What is the unit vector in the direction of v?
      options:
        - "⟨8/14, −6/14⟩"
        - "⟨4/5, −3/5⟩"
        - "⟨−4/5, 3/5⟩"
        - "⟨1, −1⟩"
      option_explanations:
        - |
          Dividing by 14, the sum of the component sizes, gives a vector of length 10/14, not 1; divide by |v| = 10.
        - |
          Correct. v/|v| = ⟨8/10, −6/10⟩ = ⟨4/5, −3/5⟩, and (16 + 9)/25 = 1.
        - |
          This has length 1 but points the opposite way, from Q towards P; it is the unit vector for −v.
        - |
          ⟨1, −1⟩ has magnitude √2 and a different direction (315°); replacing each component by its sign is not normalising.
      answer: 1
    # ---- Topics 4.6 and 4.7
    - slug: trig-u04-w23-q05
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; Common Core HSN-VM.A.1"
      points: 1
      prompt: |
        What is the direction angle of ⟨−4, −4⟩?
      options:
        - "45°"
        - "135°"
        - "225°"
        - "315°"
      option_explanations:
        - |
          tan⁻¹((−4)/(−4)) = tan⁻¹(1) = 45° points into quadrant I, but both components are negative.
        - |
          135° is in quadrant II, where the first component is negative but the second is positive.
        - |
          Correct. Both components are negative, so the vector is in quadrant III: θ = 180° + 45° = 225°.
        - |
          315° is in quadrant IV, which would need a positive first component.
      answer: 2
    - slug: trig-u04-w23-q06
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; Common Core HSN-VM.A.1"
      points: 1
      prompt: |
        Which is the component form of the vector with magnitude 12 and direction angle 150°?
      options:
        - "⟨−6√3, 6⟩"
        - "⟨−6, 6√3⟩"
        - "⟨6√3, −6⟩"
        - "⟨−6√3, −6⟩"
      option_explanations:
        - |
          Correct. ⟨12 cos 150°, 12 sin 150°⟩ = ⟨12(−√3/2), 12(1/2)⟩ = ⟨−6√3, 6⟩, a quadrant II vector.
        - |
          These are the components for 120°, where cos = −1/2 and sin = √3/2; the 30° and 60° values are swapped.
        - |
          The sizes are right but the signs are reversed: this is the quadrant IV vector at 330°, the opposite of the one asked for.
        - |
          sin 150° = 1/2 is positive, so the second component must be positive; this vector is at 210°.
      answer: 0
    - slug: trig-u04-w23-q07
      type: multiple_choice
      topic_code: "4.7"
      source: "Original item; Common Core HSN-VM.B.4"
      points: 1
      prompt: |
        For u = ⟨2, −1⟩ and v = ⟨−3, 4⟩, what is 3u − 2v?
      options:
        - "⟨0, 5⟩"
        - "⟨5, −5⟩"
        - "⟨12, 5⟩"
        - "⟨12, −11⟩"
      option_explanations:
        - |
          ⟨0, 5⟩ is 3u + 2v; subtracting 2v = ⟨−6, 8⟩ changes the signs of both its components.
        - |
          ⟨5, −5⟩ is u − v; the scalars 3 and 2 were left out.
        - |
          The first component is right, but the second adds 8 instead of subtracting it: −3 − 8 = −11.
        - |
          Correct. 3u = ⟨6, −3⟩ and 2v = ⟨−6, 8⟩, so 3u − 2v = ⟨6 + 6, −3 − 8⟩ = ⟨12, −11⟩.
      answer: 3
    - slug: trig-u04-w23-q08
      type: multiple_choice
      topic_code: "4.7"
      source: "Original item; Common Core HSN-VM.B.5"
      points: 1
      prompt: |
        Which of these is a unit vector?
      options:
        - "⟨1/2, 1/2⟩"
        - "⟨1, 1⟩"
        - "⟨3/5, −4/5⟩"
        - "⟨2/3, 1/3⟩"
      option_explanations:
        - |
          Its magnitude is √(1/4 + 1/4) = √2/2 ≈ 0.707; components adding to 1 do not make the length 1.
        - |
          Its magnitude is √2 ≈ 1.414; having components equal to 1 is not the same as having length 1.
        - |
          Correct. √(9/25 + 16/25) = √1 = 1. A negative component does not stop a vector from being a unit vector.
        - |
          Its magnitude is √(4/9 + 1/9) = √5/3 ≈ 0.745, not 1.
      answer: 2
    - slug: trig-u04-w23-q09
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        A ship's course is given as the three-digit bearing 300°. How is the same course written as a quadrant bearing?
      options:
        - "N 30° W"
        - "N 60° W"
        - "S 60° W"
        - "N 60° E"
      option_explanations:
        - |
          N 30° W is the bearing 330°; 300° is 60° short of 360°, so it is 60° west of north.
        - |
          Correct. 300° is 60° counterclockwise from north (360° − 300° = 60°), measured towards the west: N 60° W.
        - |
          S 60° W is the bearing 180° + 60° = 240°, which points into the southwest quarter.
        - |
          N 60° E is the bearing 060°; bearings past 180° point west of the north–south line.
      answer: 1
    - slug: trig-u04-w23-q10
      type: multiple_choice
      topic_code: "4.6"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 1
      prompt: |
        A small plane flies at 250 mph on a bearing of S 30° W. Taking east and north as the positive directions, which is its velocity in component form?
      options:
        - "⟨−125√3, −125⟩"
        - "⟨125, −125√3⟩"
        - "⟨−125, 125√3⟩"
        - "⟨−125, −125√3⟩"
      option_explanations:
        - |
          This uses 210° (the three-digit bearing) as if it were a direction angle; bearings are measured clockwise from north.
        - |
          The plane heads west of south, so its east component must be negative; this is S 30° E.
        - |
          The north component must be negative for a southward flight; this vector points northwest.
        - |
          Correct. The bearing 210° gives θ = 90° − 210° = −120°, that is 240°: ⟨250 cos 240°, 250 sin 240°⟩ = ⟨−125, −125√3⟩ ≈ ⟨−125, −216.51⟩.
      answer: 3
    # ---- Spiral review
    - slug: trig-u04-w23-q11
      type: multiple_choice
      topic_code: "4.3"
      source: "Original item; Common Core HSG-SRT.D.10"
      points: 1
      prompt: |
        In triangle ABC, a = 7, b = 9 and C = 60°. What is c?
      options:
        - "√67 ≈ 8.19"
        - "√193 ≈ 13.89"
        - "√130 ≈ 11.40"
        - "2"
      option_explanations:
        - |
          Correct. c² = 49 + 81 − 2(7)(9) cos 60° = 130 − 63 = 67, so c = √67 ≈ 8.19.
        - |
          This adds 2ab cos C instead of subtracting it: 130 + 63 = 193.
        - |
          This leaves out the −2ab cos C term, which only vanishes when C = 90°.
        - |
          This subtracts 2ab = 126 without the factor cos 60° = 1/2: 130 − 126 = 4.
      answer: 0
    - slug: trig-u04-w23-q12
      type: multiple_choice
      topic_code: "4.1"
      source: "Original item; Common Core HSG-SRT.D.10"
      points: 1
      prompt: |
        (Calculator.) In triangle ABC, A = 40°, B = 75° and a = 10. To the nearest hundredth, what is b?
      options:
        - "6.65"
        - "15.03"
        - "14.10"
        - "18.75"
      option_explanations:
        - |
          This is 10 sin 40°/sin 75°, with the ratio upside down; the longer side b must face the larger angle B.
        - |
          Correct. b/sin 75° = 10/sin 40°, so b = 10 sin 75°/sin 40° ≈ 15.03.
        - |
          14.10 = 10 sin 65°/sin 40° is side c, opposite C = 180° − 40° − 75° = 65°.
        - |
          18.75 = 10 · 75/40 treats sides as proportional to the angles; they are proportional to the sines of the angles.
      answer: 1
    - slug: trig-u04-w23-q13
      type: multiple_choice
      topic_code: "2.9"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      prompt: |
        In degrees, what is the value of tan⁻¹(−√3)?
      options:
        - "−60°"
        - "120°"
        - "300°"
        - "−30°"
      option_explanations:
        - |
          Correct. The range of tan⁻¹ is (−90°, 90°), and tan(−60°) = −√3. (This is why a vector such as ⟨−1, √3⟩ needs the quadrant check: its direction is 120°.)
        - |
          tan 120° = −√3, but 120° is outside (−90°, 90°), the range of inverse tangent.
        - |
          300° is coterminal with −60°, but the inverse tangent returns the angle in (−90°, 90°).
        - |
          tan(−30°) = −√3/3; this mixes up the 30° and 60° values.
      answer: 0
    - slug: trig-u04-w23-q14
      type: multi_select
      topic_code: "4.7"
      source: "Original item; Common Core HSN-VM.B.4"
      points: 2
      partial_credit: true
      prompt: |
        Let u = ⟨1, 3⟩ and v = ⟨4, −1⟩. Which statements about u and v are true? Select all that apply.
      options:
        - "u + v = ⟨5, 2⟩"
        - "|u + v| = |u| + |v|"
        - "u − v = ⟨3, −4⟩"
        - "|2v| = 2√17"
        - "−u has the same direction angle as u."
      option_explanations:
        - |
          Correct. Add matching components: ⟨1 + 4, 3 + (−1)⟩ = ⟨5, 2⟩.
        - |
          |u + v| = √29 ≈ 5.39, while |u| + |v| = √10 + √17 ≈ 7.29; they are equal only for vectors in the same direction.
        - |
          ⟨3, −4⟩ is v − u. u − v = ⟨1 − 4, 3 − (−1)⟩ = ⟨−3, 4⟩.
        - |
          Correct. |v| = √(16 + 1) = √17, and multiplying by 2 doubles the length: |2v| = 2√17.
        - |
          Multiplying by −1 reverses the direction, so the direction angle changes by 180°.
      answer: [0, 3]
    - slug: trig-u04-w23-q15
      type: multi_select
      topic_code: "4.6"
      source: "Original item; Common Core HSN-VM.A.1"
      points: 2
      partial_credit: true
      prompt: |
        Let v = ⟨−6, 8⟩. Which statements about v are true? Select all that apply.
      options:
        - "−v = ⟨6, 8⟩"
        - "|v| = 10"
        - "v lies in quadrant III."
        - "The direction angle of v is about 126.87°."
        - "The unit vector in the direction of v is ⟨−0.6, 0.8⟩."
      option_explanations:
        - |
          Negating a vector negates both components: −v = ⟨6, −8⟩.
        - |
          Correct. |v| = √((−6)² + 8²) = √(36 + 64) = √100 = 10.
        - |
          The first component is negative and the second positive, so v points left and up, into quadrant II.
        - |
          Correct. Reference angle tan⁻¹(8/6) ≈ 53.13°, placed in quadrant II: 180° − 53.13° = 126.87°.
        - |
          Correct. v/|v| = ⟨−6/10, 8/10⟩ = ⟨−0.6, 0.8⟩, and 0.36 + 0.64 = 1.
      answer: [1, 3, 4]
    - slug: trig-u04-w23-q16
      type: true_false
      topic_code: "4.7"
      source: "Original item; Common Core HSN-VM.B.4"
      points: 1
      prompt: |
        True or false: For every pair of vectors u and v, |u + v| = |u| + |v|.
      answer: false
      explanation: |
        False. By the triangle rule, u, v and u + v form a triangle, and one side of a triangle is shorter than the other two together. For example, u = ⟨3, 0⟩ and v = ⟨0, 4⟩ give |u + v| = 5 but |u| + |v| = 7. Equality holds only when u and v point the same way.
    - slug: trig-u04-w23-q17
      type: true_false
      topic_code: "4.4"
      source: "Original item; Common Core HSG-SRT.D.9"
      points: 1
      prompt: |
        True or false: A triangle with two sides of lengths 6 and 10 and an included angle of 150° has area 15.
      answer: true
      explanation: |
        True. Area = ½ab sin C = ½ · 6 · 10 · sin 150° = 30 · ½ = 15. The sine of an obtuse angle is positive, so the formula works for any included angle.
