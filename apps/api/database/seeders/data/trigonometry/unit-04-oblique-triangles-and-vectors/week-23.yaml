        (b) Find |u + v| in simplest radical form.
        (c) Find the unit vector in the direction of u + v.
      answer: |
        (a) u + v = ⟨−2 + 4, 5 + 1⟩ = ⟨2, 6⟩; 2u − v = ⟨−4 − 4, 10 − 1⟩ = ⟨−8, 9⟩.
        (b) |u + v| = √(4 + 36) = √40 = 2√10.
        (c) ⟨2, 6⟩/(2√10) = ⟨1/√10, 3/√10⟩ = ⟨√10/10, 3√10/10⟩ (about ⟨0.316, 0.949⟩).
      explanation: |
        Three points, one per part. (a) both vectors correct. (b) 2√10 (accept √40). (c) the unit vector, in any equivalent exact form; follow-through from an error in (a) or (b) earns the point if the division by the magnitude is done correctly.
    - slug: trig-u04-w23-q23
      type: short_answer
      topic_code: "4.4"
      source: "Original item; Common Core HSG-SRT.D.9"
      points: 3
      prompt: |
        (Calculator.) A hypothetical triangular garden has two sides of 40 m and 50 m that meet at an angle of 65°.

        (a) Find the area of the garden to the nearest square metre.
        (b) Find the length of the third side to the nearest hundredth of a metre, and name the law you used.
        (c) Use Heron's formula with your side lengths to check the area in (a).
      answer: |
        (a) Area = ½ · 40 · 50 · sin 65° ≈ 1000 · 0.9063 ≈ 906 m².
        (b) Law of cosines: c² = 40² + 50² − 2(40)(50) cos 65° ≈ 4100 − 1690.5 = 2409.5, so c ≈ 49.09 m.
        (c) s = (40 + 50 + 49.09)/2 ≈ 69.54; √(69.54 · 29.54 · 19.54 · 20.46) ≈ √821 400 ≈ 906 m², matching (a).
      explanation: |
        Three points, one per part. (a) 906 m² from ½ab sin C. (b) 49.09 m with the law of cosines named (SAS). (c) correct semiperimeter and a Heron's-formula value of about 906 m² (small rounding differences accepted).
    - slug: trig-u04-w23-q24
      type: long_answer
      topic_code: "4.7"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 6
      prompt: |
        (Calculator.) A hypothetical hiker walks 3 km on a bearing of N 30° E, then 5 km on a bearing of S 70° E. Use east and north as the positive directions.

        (A) (i) Write each leg of the walk as a vector in component form, to the nearest thousandth.
        (ii) Explain how you converted each bearing to a direction angle.

        (B) (i) Find the hiker's displacement from the start (the resultant vector), its magnitude to the nearest hundredth of a km, and its bearing to the nearest tenth of a degree.
        (ii) Explain why the distance from the start is less than 8 km, the total distance walked.

        (C) (i) Find the angle at the turn inside the triangle formed by the two legs and the displacement, and use the law of cosines to check the distance in (B).
        (ii) Explain which method also gives the bearing back to the start more directly, and give that bearing.
      answer: |
        (A) (i) Leg 1: θ = 90° − 30° = 60°, so ⟨3 cos 60°, 3 sin 60°⟩ ≈ ⟨1.500, 2.598⟩. Leg 2: the bearing S 70° E is 110°, so θ = 90° − 110° = −20° and ⟨5 cos(−20°), 5 sin(−20°)⟩ ≈ ⟨4.698, −1.710⟩.
        (ii) A bearing is measured clockwise from north and a direction angle counterclockwise from east, so θ = 90° − bearing; S 70° E is first written as the three-digit bearing 180° − 70° = 110°.
        (B) (i) Resultant ≈ ⟨6.198, 0.888⟩. Magnitude √(6.198² + 0.888²) ≈ 6.26 km. Direction angle tan⁻¹(0.888/6.198) ≈ 8.15° (quadrant I), so the bearing is 90° − 8.15° ≈ N 81.8° E (081.8°).
        (ii) The legs point in different directions, so by the triangle inequality the straight-line displacement is shorter than the sum of the leg lengths; only walking in one constant direction would make them equal.
        (C) (i) The course turns from 030° to 110°, a turn of 80°, so the interior angle at the turn is 180° − 80° = 100°. d² = 3² + 5² − 2(3)(5) cos 100° ≈ 34 + 5.21 = 39.21, d ≈ 6.26 km, agreeing with (B).
        (ii) The component method gives the direction at once: the displacement points at 081.8°, so the way back is the opposite direction, 081.8° + 180° = 261.8° (S 81.8° W). The law of cosines gives only the length; a direction needs a further law-of-sines step.
      explanation: |
        Six points. (A) 1 point for both component vectors (accept answers within 0.01); 1 point for the conversion θ = 90° − bearing, including writing S 70° E as 110°. (B) 1 point for the resultant, 6.26 km and the bearing N 81.8° E (accept 081.8° or 81.9°); 1 point for a triangle-inequality explanation in context. (C) 1 point for the 100° interior angle and a law-of-cosines check of 6.26; 1 point for naming the component method and giving the return bearing 261.8° (S 81.8° W).
