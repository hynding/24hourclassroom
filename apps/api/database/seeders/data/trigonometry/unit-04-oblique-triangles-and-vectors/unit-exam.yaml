unit: 4
description: |
  46 questions · about 90 minutes · every topic of Unit 4 (4.1 to 4.10): the law of sines and the ambiguous case,
  the law of cosines, triangle area and Heron's formula, surveying and navigation, vectors in component form,
  vector operations and unit vectors, the dot product and the angle between vectors, projections and work, and
  forces, equilibrium and velocity, with a little review of Units 1 to 3 (angles of depression, the sum and
  difference formulas, inverse cosine). Includes four shared-context sets (an SSA triangle, a triangle with sides
  7, 8 and 13, a pair of vectors, and a plane in a cross-wind), select-all, true/false, fill-in-the-blank and
  numeric items, two short-answer questions (3 points each) and two extended questions (6 points each: a surveyed
  plot and a pilot correcting for wind). Items marked (Calculator.) need a calculator in degree mode; the rest are
  designed to be done by hand. Multiple choice, select-all, true/false and numeric items are graded at once;
  fill-in-the-blank items are matched automatically; the short and extended answers are graded by your teacher
  against the scoring notes. All angles are in degrees.
questions:
  # ---- Stimulus set A: an SSA triangle (4.1, 4.2)
  - slug: trig-u04-exam-q01
    type: multiple_choice
    topic_code: "4.2"
    source: "Original item; Common Core HSG-SRT.D.11"
    points: 1
    stimulus: |
      (Calculator.) In triangle ABC, A = 35°, a = 12 and b = 18.
    prompt: |
      How many different triangles fit these measurements?
    options:
      - "Exactly one"
      - "None"
      - "Exactly two"
      - "It cannot be decided without knowing side c"
    option_explanations:
      - |
        One triangle needs a = h or a ≥ b; here h ≈ 10.32 < a = 12 < b = 18, so side a meets the base twice.
      - |
        No triangle would need a < h = 18 sin 35° ≈ 10.32, but a = 12 is longer than the height.
      - |
        Correct. h = b sin A = 18 sin 35° ≈ 10.32, and h < a < b, so there are two triangles: one with B acute and one with B obtuse.
      - |
        The SSA test needs only A, a and b: compare a with the height h = b sin A and with b.
    answer: 2
  - slug: trig-u04-exam-q02
    type: multiple_choice
    topic_code: "4.2"
    source: "Original item; Common Core HSG-SRT.D.11"
    points: 1
    stimulus: |
      (Calculator.) In triangle ABC, A = 35°, a = 12 and b = 18.
    prompt: |
      To the nearest hundredth of a degree, what is the acute value of B?
    options:
      - "59.36°"
      - "120.64°"
      - "22.48°"
      - "52.50°"
    option_explanations:
      - |
        Correct. sin B = 18 sin 35°/12 ≈ 0.8603, so the acute value is B = sin⁻¹(0.8603) ≈ 59.36°.
      - |
        120.64° = 180° − 59.36° is the obtuse value of B, from the second triangle.
      - |
        22.48° comes from sin B = 12 sin 35°/18, with the sides swapped; b is the side opposite B.
      - |
        52.50° = 35° · 18/12 scales the angle by the side ratio; the law of sines relates the sides to the sines of the angles.
    answer: 0
  - slug: trig-u04-exam-q03
    type: multiple_choice
    topic_code: "4.1"
    source: "Original item; Common Core HSG-SRT.D.10"
    points: 1
    stimulus: |
      (Calculator.) In triangle ABC, A = 35°, a = 12 and b = 18.
    prompt: |
      In the triangle in which B is acute, what is side c, to the nearest hundredth?
    options:
      - "31.29"
      - "8.63"
      - "6.90"
      - "20.86"
    option_explanations:
      - |
        31.29 = 18 sin C/sin 35° pairs side b with angle A; the known ratio is a/sin A = 12/sin 35°.
      - |
        8.63 is side c in the other triangle, where B ≈ 120.64° and C ≈ 24.36°.
      - |
        6.90 = 12 sin 35°/sin C inverts the ratio; c must face the largest angle of this triangle, so it is the longest side.
      - |
        Correct. C = 180° − 35° − 59.36° ≈ 85.64°, and c = 12 sin 85.64°/sin 35° ≈ 20.86.
    answer: 3
  # ---- Stimulus set B: a triangle with sides 7, 8 and 13 (4.3, 4.4, 4.1)
  - slug: trig-u04-exam-q04
    type: multiple_choice
    topic_code: "4.3"
    source: "Original item; Common Core HSG-SRT.D.10"
    points: 1
    stimulus: |
      A triangle has sides of lengths 7, 8 and 13.
    prompt: |
      What is the exact measure of its largest angle?
    options:
      - "60°"
      - "120°"
      - "90°"
      - "150°"
    option_explanations:
      - |
        cos θ = −1/2 here, not +1/2; the negative sign makes the angle obtuse.
      - |
        Correct. The largest angle faces 13: cos θ = (49 + 64 − 169)/(2 · 7 · 8) = −56/112 = −1/2, so θ = 120°.
      - |
        A right angle needs 7² + 8² = 13², but 113 < 169, so the angle is obtuse.
      - |
        cos 150° = −√3/2 ≈ −0.866, but the law of cosines gives exactly −1/2.
    answer: 1
  - slug: trig-u04-exam-q05
    type: multiple_choice
    topic_code: "4.4"
    source: "Original item; Common Core HSG-SRT.D.9"
    points: 1
    stimulus: |
      A triangle has sides of lengths 7, 8 and 13.
    prompt: |
      What is the exact area of the triangle?
    options:
      - "28√3"
      - "28"
      - "14"
      - "14√3"
    option_explanations:
      - |
        28√3 = 7 · 8 · sin 120° leaves out the factor ½ in ½ab sin C.
      - |
        28 = ½ · 7 · 8 treats the sides as perpendicular; the angle between them is 120°, so the sine is √3/2.
      - |
        14 uses sin 120° = 1/2, the value of cos 60°; sin 120° = √3/2.
      - |
        Correct. ½ · 7 · 8 · sin 120° = 28 · √3/2 = 14√3. Heron agrees: s = 14 and √(14 · 7 · 6 · 1) = √588 = 14√3.
    answer: 3
  - slug: trig-u04-exam-q06
    type: multiple_choice
    topic_code: "4.1"
    source: "Original item; Common Core HSG-SRT.D.10"
    points: 1
    stimulus: |
      A triangle has sides of lengths 7, 8 and 13.
    prompt: |
      (Calculator.) To the nearest hundredth of a degree, what is the smallest angle of the triangle?
    options:
      - "27.80°"
      - "32.20°"
      - "152.20°"
      - "60.00°"
    option_explanations:
      - |
        Correct. The smallest angle faces 7: sin θ = 7 sin 120°/13 ≈ 0.4663, θ ≈ 27.80°. It must be acute, since the triangle already has a 120° angle.
      - |
        32.20° faces the side 8, the middle side, not the shortest.
      - |
        152.20° is the obtuse partner of 27.80°; with a 120° angle already in the triangle, another obtuse angle is impossible.
      - |
        60° is the sum of the two smaller angles (180° − 120°), not either one of them.
    answer: 0
  # ---- Stimulus set C: a pair of vectors (4.8, 4.9)
  - slug: trig-u04-exam-q07
    type: multiple_choice
    topic_code: "4.8"
    source: "Original item; Common Core HSN-VM.B.4 (extension)"
    points: 1
    stimulus: |
      Let u = ⟨5, −1⟩ and v = ⟨2, 3⟩.
    prompt: |
      What is u · v?
    options:
      - "13"
      - "⟨10, −3⟩"
      - "7"
      - "−7"
    option_explanations:
      - |
        13 = 10 + 3 ignores the negative sign of −1 · 3; the second product is −3.
      - |
        These are the component products, but a dot product adds them to give a scalar.
      - |
        Correct. u · v = 5 · 2 + (−1) · 3 = 10 − 3 = 7.
      - |
        The sign is wrong: 10 − 3 is positive, so the angle between u and v is acute.
    answer: 2
  - slug: trig-u04-exam-q08
    type: multiple_choice
    topic_code: "4.8"
    source: "Original item; Common Core HSN-VM.B.4 (extension)"
    points: 1
    stimulus: |
      Let u = ⟨5, −1⟩ and v = ⟨2, 3⟩.
    prompt: |
      (Calculator.) To the nearest hundredth of a degree, what is the angle between u and v?
    options:
      - "22.38°"
      - "67.62°"
      - "112.38°"
      - "88.81°"
    option_explanations:
      - |
        22.38° is the complement of the angle; cos θ = 7/(√26 · √13) gives the angle itself.
      - |
        Correct. cos θ = 7/(√26 · √13) = 7/√338 ≈ 0.3807, so θ ≈ 67.62°.
      - |
        112.38° would need a negative dot product; u · v = 7 is positive, so the angle is acute.
      - |
        88.81° comes from dividing by |u|²|v|² = 338 instead of |u||v| = √338.
    answer: 1
  - slug: trig-u04-exam-q09
    type: multiple_choice
    topic_code: "4.9"
    source: "Original item; Common Core HSN-VM.B.5 (extension)"
    points: 1
    stimulus: |
      Let u = ⟨5, −1⟩ and v = ⟨2, 3⟩.
    prompt: |
      What is projᵥ u, the projection of u onto v?
    options:
      - "⟨35/26, −7/26⟩"
      - "⟨14/√13, 21/√13⟩"
      - "7/√13"
      - "⟨14/13, 21/13⟩"
    option_explanations:
      - |
        This is proj_u v = (7/26)⟨5, −1⟩, the projection of v onto u; the order matters.
      - |
        This divides by |v| = √13 instead of |v|² = 13, so the vector is too long by a factor of √13.
      - |
        7/√13 is the scalar component compᵥ u, a number; the projection is a vector along v.
      - |
        Correct. (u · v)/|v|² = 7/13, and (7/13)⟨2, 3⟩ = ⟨14/13, 21/13⟩.
    answer: 3
  # ---- Stimulus set D: a plane in a cross-wind (4.10, 4.6)
  - slug: trig-u04-exam-q10
    type: multiple_choice
    topic_code: "4.6"
    source: "Original item; Common Core HSN-VM.A.3"
    points: 1
    stimulus: |
      (Calculator.) A hypothetical airliner flies on a heading of 150° with an airspeed of 400 mph. The wind blows at 50 mph towards the bearing 060°. Use east and north as the positive directions.
    prompt: |
      Which is the wind velocity in component form, in mph?
    options:
      - "⟨25√3, 25⟩"
      - "⟨25, 25√3⟩"
      - "⟨−25√3, −25⟩"
      - "⟨25√3, −25⟩"
    option_explanations:
      - |
        Correct. The bearing 060° is the direction angle 90° − 60° = 30°: ⟨50 cos 30°, 50 sin 30°⟩ = ⟨25√3, 25⟩.
      - |
        This uses 60° as the direction angle; bearings are measured clockwise from north, so 060° is 30° above east.
      - |
        This is a wind blowing from 060°, towards 240°; the wind here blows towards 060°.
      - |
        A direction of 060° points north of east, so the north component must be positive.
    answer: 0
  - slug: trig-u04-exam-q11
    type: numeric
    topic_code: "4.10"
    source: "Original item; Common Core HSN-VM.A.3"
    points: 1
    stimulus: |
      (Calculator.) A hypothetical airliner flies on a heading of 150° with an airspeed of 400 mph. The wind blows at 50 mph towards the bearing 060°. Use east and north as the positive directions.
    prompt: |
      What is the airliner's ground speed, to the nearest hundredth of a mph?
    answer: { value: 403.11, tolerance: 0.01 }
    explanation: |
      Air velocity: θ = 90° − 150° = −60°, so ⟨400 cos(−60°), 400 sin(−60°)⟩ ≈ ⟨200, −346.410⟩. Wind ≈ ⟨43.301, 25⟩. Ground velocity ≈ ⟨243.301, −321.410⟩, with magnitude ≈ 403.11 mph. (The wind is at 90° to the heading, so √(400² + 50²) gives the same value.)
  - slug: trig-u04-exam-q12
    type: multiple_choice
    topic_code: "4.10"
    source: "Original item; Common Core HSN-VM.A.3"
    points: 1
    stimulus: |
      (Calculator.) A hypothetical airliner flies on a heading of 150° with an airspeed of 400 mph. The wind blows at 50 mph towards the bearing 060°. Use east and north as the positive directions.
    prompt: |
      To the nearest tenth of a degree, what is the airliner's course, as a bearing?
    options:
      - "157.1°"
      - "150.0°"
      - "142.9°"
      - "007.1°"
    option_explanations:
      - |
        The wind pushes towards 060°, which is counterclockwise from the heading, so the course is less than 150°, not more.
      - |
        150° is the heading; a cross-wind always turns the course away from the heading.
      - |
        Correct. The drift angle is tan⁻¹(50/400) ≈ 7.1°, towards the wind's direction, so the course is 150° − 7.1° ≈ 142.9°. Components agree: ⟨243.301, −321.410⟩ has direction angle ≈ −52.9°, bearing 90° + 52.9° = 142.9°.
      - |
        7.1° is the drift angle alone; it has to be applied to the heading of 150°.
    answer: 2
  # ---- Law of sines and the ambiguous case (4.1, 4.2)
  - slug: trig-u04-exam-q13
    type: multiple_choice
    topic_code: "4.1"
    source: "Original item; Common Core HSG-SRT.D.10"
    points: 1
    prompt: |
      (Calculator.) In triangle ABC, A = 40°, C = 65° and c = 20. To the nearest hundredth, what is a?
    options:
      - "28.20"
      - "14.18"
      - "21.32"
      - "12.31"
    option_explanations:
      - |
        28.20 = 20 sin 65°/sin 40° has the ratio upside down; a faces the smaller angle, so a < c.
      - |
        Correct. a/sin 40° = 20/sin 65°, so a = 20 sin 40°/sin 65° ≈ 14.18.
      - |
        21.32 is side b, opposite B = 180° − 40° − 65° = 75°.
      - |
        12.31 = 20 · 40/65 makes the sides proportional to the angles, not to their sines.
    answer: 1
  - slug: trig-u04-exam-q14
    type: multiple_choice
    topic_code: "4.1"
    source: "Original item; Common Core HSG-SRT.D.10"
    points: 1
    prompt: |
      In an acute triangle ABC, the altitude from C to side c has length h. Which pair of equations leads directly to the law of sines a/sin A = b/sin B?
    options:
      - "h = b sin A and h = a sin B"
      - "h = a sin A and h = b sin B"
      - "h = b cos A and h = a cos B"
      - "h² = a² − b² and h = c sin C"
    option_explanations:
      - |
        Correct. In the right triangle containing A, h is opposite A with hypotenuse b; in the one containing B, h is opposite B with hypotenuse a. Setting b sin A = a sin B and dividing by sin A sin B gives the law.
      - |
        Side a is not the hypotenuse of the right triangle that contains angle A; each angle pairs with the other side.
      - |
        Cosine gives the adjacent pieces of side c, not the altitude, which is opposite the angles.
      - |
        The altitude splits the triangle into two right triangles that share h; neither equation comes from those right triangles.
    answer: 0
  - slug: trig-u04-exam-q15
    type: multiple_choice
    topic_code: "4.2"
    source: "Original item; Common Core HSG-SRT.D.11"
    points: 1
    prompt: |
      In triangle ABC, A = 50°, a = 15 and b = 12. How many triangles fit these measurements?
    options:
      - "None"
      - "Exactly two"
      - "Exactly one, a right triangle"
      - "Exactly one"
    option_explanations:
      - |
        No triangle would need a < b sin A = 12 sin 50° ≈ 9.19; a = 15 is much longer.
      - |
        Two triangles need h < a < b; here a > b, so the obtuse choice for B would leave no room for C.
      - |
        A right triangle needs a = h exactly; here a is longer than h ≈ 9.19.
      - |
        Correct. a ≥ b with A acute gives exactly one triangle: sin B = 12 sin 50°/15 ≈ 0.613, B ≈ 37.8°, and 180° − 37.8° is too large to add to A.
    answer: 3
  - slug: trig-u04-exam-q16
    type: multiple_choice
    topic_code: "4.2"
    source: "Original item; Common Core HSG-SRT.D.11"
    points: 1
    prompt: |
      In triangle ABC, A = 120°, a = 7 and b = 9. How many triangles fit these measurements?
    options:
      - "Exactly one, with B acute"
      - "Exactly two"
      - "None"
      - "Exactly one right triangle"
    option_explanations:
      - |
        With A obtuse, the side opposite A must be the longest side; a = 7 < b = 9 is impossible.
      - |
        Two triangles can only happen when A is acute; an obtuse angle leaves room for at most one triangle.
      - |
        Correct. A is obtuse, so a must be longer than b; since 7 < 9, no triangle exists (sin B = 9 sin 120°/7 ≈ 1.11 > 1).
      - |
        A triangle cannot hold a 120° angle and a right angle together.
    answer: 2
  # ---- Law of cosines and area (4.3, 4.4)
  - slug: trig-u04-exam-q17
    type: multiple_choice
    topic_code: "4.3"
    source: "Original item; Common Core HSG-SRT.D.10"
    points: 1
    prompt: |
      (Calculator.) In triangle ABC, b = 10, c = 14 and A = 72°. To the nearest hundredth, what is a?
    options:
      - "17.20"
      - "14.47"
      - "19.56"
      - "23.81"
    option_explanations:
      - |
        17.20 = √(100 + 196) leaves out −2bc cos A, which is zero only when A = 90°.
      - |
        Correct. a² = 100 + 196 − 280 cos 72° ≈ 296 − 86.53 = 209.47, so a ≈ 14.47.
      - |
        19.56 adds 280 cos 72° instead of subtracting it.
      - |
        23.81 is what a calculator in radian mode gives: cos(72 radians) ≈ −0.967. Set degree mode.
    answer: 1
  - slug: trig-u04-exam-q18
    type: multiple_choice
    topic_code: "4.3"
    source: "Original item; Common Core HSG-SRT.D.11"
    points: 1
    prompt: |
      A surveyor has measured all three sides of a triangular field and wants all three angles. Which plan is safest?
    options:
      - "Find the largest angle with the law of cosines, then another angle with the law of sines."
      - "Find the smallest angle with the law of sines first."
      - "Use Heron's formula to find the angles."
      - "Find any angle with the law of sines, since no angle is known yet."
    option_explanations:
      - |
        Correct. The law of cosines gives the largest angle with no ambiguity, even if it is obtuse; the other two must then be acute, so sin⁻¹ gives them correctly.
      - |
        The law of sines needs a known angle–side pair; with SSS data, no angle is known yet.
      - |
        Heron's formula gives the area, not any angle.
      - |
        No angle–side pair is known, so the law of sines has nothing to start from.
    answer: 0
  - slug: trig-u04-exam-q19
    type: multiple_choice
    topic_code: "4.4"
    source: "Original item; Common Core HSG-SRT.D.9"
    points: 1
    prompt: |
      (Calculator.) A parallelogram has sides 9 cm and 15 cm, with an angle of 40° between them. To the nearest hundredth, what is its area?
    options:
      - "43.39 cm²"
      - "103.42 cm²"
      - "86.78 cm²"
      - "135.00 cm²"
    option_explanations:
      - |
        43.39 = ½ · 9 · 15 · sin 40° is one of the two triangles a diagonal cuts the parallelogram into.
      - |
        103.42 = 135 cos 40° uses cosine; the height is 9 sin 40°, so the area uses sine.
      - |
        Correct. A parallelogram is two congruent triangles: area = ab sin θ = 9 · 15 · sin 40° ≈ 86.78 cm².
      - |
        135 = 9 · 15 would be the area only if the angle were 90°.
    answer: 2
  - slug: trig-u04-exam-q20
    type: multiple_choice
    topic_code: "4.4"
    source: "Original item; Common Core HSG-SRT.D.9"
    points: 1
    prompt: |
      A regular octagon is inscribed in a circle of radius 10. What is the exact area of the octagon?
    options:
      - "400√2"
      - "400"
      - "25√2"
      - "200√2"
    option_explanations:
      - |
        400√2 leaves out the ½ in each triangle's area, ½r² sin 45°.
      - |
        400 = 8 · ½ · 100 drops the factor sin 45°; the two radii meet at 45°, not 90°.
      - |
        25√2 is the area of one of the eight central triangles; the octagon is made of eight of them.
      - |
        Correct. Eight triangles, each with two sides 10 and a 45° angle between them: 8 · ½ · 100 · sin 45° = 400 · √2/2 = 200√2 ≈ 282.84.
    answer: 3
  # ---- Surveying and navigation (4.5)
  - slug: trig-u04-exam-q21
    type: multiple_choice
    topic_code: "4.5"
    source: "Original item; Common Core HSG-SRT.D.11"
    points: 1
    prompt: |
      (Calculator.) To find the distance AB across a hypothetical lake, a surveyor stands at C, where CA = 250 m, CB = 310 m and angle ACB = 58°. To the nearest hundredth of a metre, what is AB?
    options:
      - "398.25 m"
      - "276.52 m"
      - "490.65 m"
      - "560.00 m"
    option_explanations:
      - |
        398.25 = √(250² + 310²) treats angle C as a right angle.
      - |
        Correct. AB² = 250² + 310² − 2(250)(310) cos 58° ≈ 158 600 − 82 139 = 76 461, so AB ≈ 276.52 m.
      - |
        490.65 adds 2ab cos C instead of subtracting it.
      - |
        560 = 250 + 310 would need A, C and B to lie on one straight line with C between them.
    answer: 1
  - slug: trig-u04-exam-q22
    type: multiple_choice
    topic_code: "4.5"
    source: "Original item; Common Core HSG-SRT.D.11"
    points: 1
    prompt: |
      The bearing from lighthouse L to buoy B is 215°. What is the bearing from B back to L?
    options:
      - "035°"
      - "145°"
      - "305°"
      - "125°"
    option_explanations:
      - |
        Correct. The reverse direction differs by 180°: 215° − 180° = 035°.
      - |
        145° = 360° − 215° reflects the direction across the north–south line instead of reversing it.
      - |
        305° = 215° + 90° is a quarter turn, not a half turn.
      - |
        125° = 215° − 90° is also a quarter turn; reversing a direction takes 180°.
    answer: 0
  - slug: trig-u04-exam-q23
    type: multiple_choice
    topic_code: "4.5"
    source: "Original item; Common Core HSG-SRT.D.11"
    points: 1
    prompt: |
      (Calculator.) From point A on level ground, the angle of elevation to the top of a hypothetical radio mast is 25°. From point B, 60 m closer to the mast along the same line, it is 40°. To the nearest hundredth of a metre, how tall is the mast?
    options:
      - "149.01 m"
      - "97.97 m"
      - "41.40 m"
      - "62.98 m"
    option_explanations:
      - |
        149.01 m is the slant distance from A to the top, not the height.
      - |
        97.97 m is the slant distance from B to the top; one more step, times sin 40°, gives the height.
      - |
        41.40 = 97.97 sin 25° uses the wrong angle: from B the top is at 40° elevation.
      - |
        Correct. In triangle ABT the angles are 25°, 140° and 15°, so BT = 60 sin 25°/sin 15° ≈ 97.97 m and the height is 97.97 sin 40° ≈ 62.98 m.
    answer: 3
  # ---- Vectors (4.6, 4.7)
  - slug: trig-u04-exam-q24
    type: multiple_choice
    topic_code: "4.6"
    source: "Original item; Common Core HSN-VM.A.1"
    points: 1
    prompt: |
      Which gives the magnitude and the direction angle (in [0°, 360°)) of ⟨5, −12⟩?
    options:
      - "13 and 67.38°"
      - "17 and 292.62°"
      - "13 and 292.62°"
      - "13 and 112.62°"
    option_explanations:
      - |
        67.38° is the reference angle placed in quadrant I; the vector points right and down, into quadrant IV.
      - |
        17 = 5 + 12 adds the component sizes; the magnitude is √(25 + 144) = 13.
      - |
