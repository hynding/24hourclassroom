  - slug: trig-u04-exam-q43
    type: short_answer
    topic_code: "4.9"
    source: "Original item; Common Core HSN-VM.B.5 (extension)"
    points: 3
    prompt: |
      (Calculator.) A constant force F = ⟨3, 4⟩ newtons moves an object along the displacement d = ⟨12, 5⟩ metres.

      (a) Find the work done by F.
      (b) Find the angle between F and d to the nearest hundredth of a degree.
      (c) Find the scalar component of F along d, and the vector projection proj_d F with components to the nearest hundredth.
    answer: |
      (a) W = F · d = 36 + 20 = 56 J.
      (b) |F| = 5, |d| = 13, cos θ = 56/65 ≈ 0.8615, θ ≈ 30.51°.
      (c) comp_d F = 56/13 ≈ 4.31 N; proj_d F = (56/169)⟨12, 5⟩ ≈ ⟨3.98, 1.66⟩.
    explanation: |
      Three points, one per part. (a) 56 J. (b) 30.51° (accept 30.5°). (c) both the scalar component 56/13 ≈ 4.31 and the projection ⟨3.98, 1.66⟩; follow-through from an error in (a) is accepted.
  - slug: trig-u04-exam-q44
    type: short_answer
    topic_code: "4.5"
    source: "Original item; Common Core HSG-SRT.D.11"
    points: 3
    prompt: |
      (Calculator.) A hypothetical patrol boat sails 40 nautical miles on a bearing of 075°, then turns and sails 25 nautical miles on a bearing of 200°.

      (a) Find the angle at the turn inside the triangle formed by the two legs and the line back to the start.
      (b) Find the boat's distance from its start to the nearest hundredth of a nautical mile.
      (c) Find the bearing from the start to the boat's final position, to the nearest tenth of a degree.
    answer: |
      (a) The course turns clockwise from 075° to 200°, a turn of 125°, so the interior angle at the turn is 180° − 125° = 55°.
      (b) d² = 40² + 25² − 2(40)(25) cos 55° ≈ 2225 − 1147.2 = 1077.8, so d ≈ 32.83 nautical miles.
      (c) Law of sines at the start: sin S = 25 sin 55°/32.83 ≈ 0.6238, S ≈ 38.6° (acute, since it faces the shorter leg). The boat turned clockwise, so the bearing is 075° + 38.6° ≈ 113.6°. (Components: ⟨40 cos 15°, 40 sin 15°⟩ + ⟨25 cos(−110°), 25 sin(−110°)⟩ ≈ ⟨30.087, −13.140⟩, bearing 90° + 23.6° ≈ 113.6°.)
    explanation: |
      Three points, one per part. (a) 55° with a reason from the bearings. (b) 32.83 nautical miles. (c) a bearing of 113.6° (accept 113.5° to 113.7°) by the law of sines or by components.
  # ---- Extended response
  - slug: trig-u04-exam-q45
    type: long_answer
    topic_code: "4.3"
    source: "Original item; Common Core HSG-SRT.D.10"
    points: 6
    prompt: |
      (Calculator.) A hypothetical triangular building plot ABC has AB = 85 m and AC = 120 m, and the angle at corner A is 48°.

      (A) (i) Find the length of the third side, BC, to the nearest hundredth of a metre, and name the law you used.
      (ii) Explain why the law of sines could not be used first.

      (B) (i) Find the area of the plot to the nearest square metre.
      (ii) Use Heron's formula with your three side lengths to check the area.

      (C) (i) Find angle C (opposite AB) to the nearest hundredth of a degree, and then angle B.
      (ii) Explain why it is safer to use the law of sines for angle C than for angle B.
    answer: |
      (A) (i) Law of cosines (SAS): BC² = 85² + 120² − 2(85)(120) cos 48° ≈ 21 625 − 13 650.2 = 7974.8, so BC ≈ 89.30 m.
      (ii) The law of sines needs a known angle together with the side opposite it. The given angle A is between the two known sides, and the side opposite it, BC, is the unknown, so no complete ratio is available.
      (B) (i) Area = ½ · 85 · 120 · sin 48° = 5100 sin 48° ≈ 3790 m².
      (ii) s = (85 + 120 + 89.30)/2 ≈ 147.15; √(147.15 · 62.15 · 27.15 · 57.85) ≈ √14 364 000 ≈ 3790 m², which agrees.
      (C) (i) sin C = 85 sin 48°/89.30 ≈ 0.7073, so C ≈ 45.02°. Then B = 180° − 48° − 45.02° ≈ 86.98°.
      (ii) C faces AB = 85, the shortest side, so C is the smallest angle and must be acute; sin⁻¹ gives it correctly. B faces the longest side and could be obtuse, in which case sin⁻¹ would return its acute supplement. (Here B ≈ 86.98° happens to be acute; the law of cosines confirms it, since 89.30² + 85² − 120² > 0.)
    explanation: |
      Six points. (A) 1 point for BC ≈ 89.30 m with the law of cosines named; 1 point for explaining that no angle–opposite side pair is known. (B) 1 point for 3790 m²; 1 point for a correct Heron's-formula check (semiperimeter about 147.15 and an area of about 3790). (C) 1 point for C ≈ 45.02° and B ≈ 86.98° (accept within 0.02); 1 point for explaining that the smallest angle must be acute while the largest might be obtuse, so sin⁻¹ is safe only for the smaller angle.
  - slug: trig-u04-exam-q46
    type: long_answer
    topic_code: "4.10"
    source: "Original item; Common Core HSN-VM.A.3"
    points: 6
    prompt: |
      (Calculator.) A hypothetical pilot must fly from airport P to airport Q, 900 miles due east (course 090°). Her airspeed is 360 mph. A 45 mph wind blows from the bearing 020° (that is, towards 200°). Use east and north as the positive directions.

      (A) (i) Write the wind velocity in component form, to the nearest thousandth.
      (ii) Explain why flying on a heading of 090° would not take her to Q.

      (B) (i) Find the heading she must fly, to the nearest tenth of a degree, so that her course is due east.
      (ii) Find her ground speed to the nearest hundredth of a mph.

      (C) (i) Find the flight time to the nearest minute.
      (ii) Explain why the ground speed is less than the airspeed even though the wind is not a direct head wind.
    answer: |
      (A) (i) The wind blows towards 200°, a direction angle of 90° − 200° = −110°: ⟨45 cos(−110°), 45 sin(−110°)⟩ ≈ ⟨−15.391, −42.286⟩.
      (ii) On a heading of 090° the air velocity is ⟨360, 0⟩, so the ground velocity would be ⟨344.609, −42.286⟩, which points south of east (course about 097.0°). The wind's southward component pushes her off the line to Q.
      (B) (i) Her air velocity 360⟨cos θ, sin θ⟩ must cancel the wind's north component: 360 sin θ = 42.286, sin θ ≈ 0.11746, θ ≈ 6.75°. That direction angle is north of east, so the heading is 90° − 6.75° ≈ 083.3°.
      (ii) Ground speed = 360 cos 6.75° − 15.391 ≈ 357.508 − 15.391 ≈ 342.12 mph.
      (C) (i) 900/342.12 ≈ 2.631 h ≈ 158 minutes (2 h 38 min).
      (ii) The wind has a westward component of about 15.39 mph that directly opposes her eastward travel, and part of her airspeed (360 sin θ ≈ 42.29 mph) is spent cancelling the wind's southward push, which leaves only 360 cos θ ≈ 357.51 mph eastward before the head-wind part is subtracted.
    explanation: |
      Six points. (A) 1 point for ⟨−15.391, −42.286⟩ (within 0.01); 1 point for explaining the southward drift (a computed course is not required). (B) 1 point for the heading 083.3° (accept 083.2° to 083.3°); 1 point for 342.12 mph (accept within 0.05). (C) 1 point for about 158 minutes, with follow-through from (B); 1 point for naming both effects: the westward wind component and the airspeed spent cancelling the cross-wind.
