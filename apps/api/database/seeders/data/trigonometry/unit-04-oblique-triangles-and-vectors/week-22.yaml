week: 22
unit: 4
title: "Surveying and Navigation"
topics: ["4.5"]
guide: guides/week-22.md
guide_description: |
  Compass and three-digit bearings, reverse bearings and the angle inside a triangle at a turn; then the
  standard applications of the laws of sines and cosines: the distance and bearing back after a two-leg
  course, a distance across a lake, the height of an inaccessible tower from two angles of elevation,
  locating a fire by triangulation, and a table for choosing the right law. Worked examples: a 40-mile and
  25-mile course on 060° and 110°, a lake 415 m across, a tower seen at 28° and 41°, two fire lookouts
  12 km apart, and a three-sided field.
flashcards_description: |
  30 cards on converting bearings, reverse bearings, interior angles at a turn, two-leg courses, distances
  across obstacles, the two-sighting tower triangle, triangulation, choosing a law, and the common slips.

flashcards:
  - front: Three-digit bearing → how it is measured
    back: |
      Clockwise from north, written with three digits: 035°, 145°, 320°.
    topic_code: "4.5"
  - front: Compass bearing S 35° E → three-digit form
    back: |
      145°: south is 180°, and turning 35° towards east goes back, 180° − 35°.
    topic_code: "4.5"
  - front: Compass bearing S 20° W → three-digit form
    back: |
      200°: 180° + 20°.
    topic_code: "4.5"
  - front: Compass bearing N 40° W → three-digit form
    back: |
      320°: 360° − 40°.
    topic_code: "4.5"
  - front: Three-digit bearing 250° → compass form
    back: |
      S 70° W: 250° − 180° = 70° past south, towards west.
    topic_code: "4.5"
  - front: Reverse of a bearing of 060° → value and rule
    back: |
      240°. Add 180° to the outbound bearing, or subtract 180° if the result would pass 360° (the reverse of 300° is 120°).
    topic_code: "4.5"
  - front: Why draw a north line at every vertex of a course → reason
    back: |
      North lines are parallel, so alternate angles and reverse bearings convert bearings into the angles inside the triangle.
    topic_code: "4.5"
  - front: Course on 060° then 110° → interior angle at the turn
    back: |
      Back-direction 240° minus new heading 110° = 130°. Equivalently the boat turned 50° right, and 180° − 50° = 130°.
    topic_code: "4.5"
  - front: Course on 040° then 115° → interior angle at the turn
    back: |
      180° − (115° − 40°) = 105°.
    topic_code: "4.5"
  - front: Two-leg course, distance back to the start → which law
    back: |
      Law of cosines: two legs and the interior angle between them are SAS.
    topic_code: "4.5"
  - front: 40 miles on 060°, then 25 miles on 110° → distance from the start
    back: |
      AC² = 40² + 25² − 2(40)(25) cos 130° ≈ 3510.6, so AC ≈ 59.25 miles.
    topic_code: "4.5"
  - front: 40 miles on 060°, then 25 miles on 110° → bearing from the start to the end
    back: |
      sin A = 25 sin 130°/59.25, A ≈ 18.9°, so the bearing is 060° + 18.9° ≈ 078.9°; the return bearing is 258.9°.
    topic_code: "4.5"
  - front: Bearing to the end of a course → add or subtract the angle at the start
    back: |
      Decide from the sketch: if the end point lies clockwise from the first leg, add the angle to the first bearing; if counterclockwise, subtract it.
    topic_code: "4.5"
  - front: Distance across a lake → the measurements to make
    back: |
      From a third point C on land: the distances CA and CB and the angle ACB (SAS), then the law of cosines for AB.
    topic_code: "4.5"
  - front: CA = 320 m, CB = 410 m, angle C = 68° → distance AB
    back: |
      AB² = 320² + 410² − 2(320)(410) cos 68° ≈ 172 203, so AB ≈ 415.0 m.
    topic_code: "4.5"
  - front: Tower from two sightings with elevations α (far) and β (near) → angle at the top
    back: |
      β − α. The angle at the near point inside the oblique triangle is 180° − β, so the angle sum leaves β − α.
    topic_code: "4.5"
  - front: Tower from two sightings, distance d between the points → line of sight from the near point
    back: |
      QT = d sin α/sin(β − α), by the law of sines (QT is opposite the angle α at the far point).
    topic_code: "4.5"
  - front: Tower from two sightings → height from the near line of sight
    back: |
      h = QT sin β, using the right triangle at the base. The horizontal distance to the base is QT cos β.
    topic_code: "4.5"
  - front: Elevations 28° and 41° measured 50 m apart → tower height
    back: |
      QT = 50 sin 28°/sin 13° ≈ 104.35 m, so h = 104.35 sin 41° ≈ 68.46 m.
    topic_code: "4.5"
  - front: Triangulation from two stations → what data and which law
    back: |
      A measured baseline and the angle to the object at each end (ASA). Angle sum for the third angle, then the law of sines.
    topic_code: "4.5"
  - front: Lookouts 12 km apart, B east of A, fire at N 52° E from A and N 25° W from B → angles of the triangle
    back: |
      At A 90° − 52° = 38°, at B 90° − 25° = 65°, at the fire 77°.
    topic_code: "4.5"
  - front: Fire lookouts 12 km apart with angles 38° and 65° → distance from A
    back: |
      AF = 12 sin 65°/sin 77° ≈ 11.16 km (and BF = 12 sin 38°/sin 77° ≈ 7.58 km).
    topic_code: "4.5"
  - front: Distance of a triangulated point from the baseline → how to find it
    back: |
      Multiply a station's distance to the point by the sine of the angle at that station: AF sin A (check with BF sin B).
    topic_code: "4.5"
  - front: Right-angle turn in a course (e.g. 070° then 160°) → shortcut
    back: |
      The interior angle is 90°, so the Pythagorean theorem and tan⁻¹ replace the oblique laws.
    topic_code: "4.5"
  - front: Navigation problem with two sides and the included angle → tool
    back: |
      Law of cosines for the third side; then the law of sines for the smaller remaining angle.
    topic_code: "4.5"
  - front: Navigation problem with two angles and one side → tool
    back: |
      Angle sum, then the law of sines for the other two sides.
    topic_code: "4.5"
  - front: Field with sides 120 m, 150 m, 200 m → largest angle and area
    back: |
      cos θ = −3100/36 000, θ ≈ 94.9°. Heron: s = 235, area ≈ 8967 m².
    topic_code: "4.5"
  - front: 'Error-spot → "The boat sailed on 060°, so the angle at the start of the triangle is 60°"'
    back: |
      A bearing is measured from north, not from the other side of the triangle. Find interior angles with north lines and differences of bearings.
    topic_code: "4.5"
  - front: 'Error-spot → "Tower: QT = 104.35 m, so the tower is 104.35 m tall"'
    back: |
      QT is the slant line of sight. The height is QT sin 41° ≈ 68.46 m.
    topic_code: "4.5"
  - front: 'Error-spot → "The reverse of a bearing of 130° is 220°"'
    back: |
      That adds 90°. The reverse bearing is 130° + 180° = 310°.
    topic_code: "4.5"

quiz:
  description: |
    24 questions · about 45 minutes · mostly on this week (topic 4.5: bearings, multi-leg courses, distances
    across obstacles, heights from two sightings and triangulation), with about a third reviewing weeks 20
    and 21 (the law of sines, the ambiguous case, the law of cosines, triangle area) and week 3 (angles of
    depression). Includes a shared-context set on a two-leg fishing-boat course. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the
    short answers and the long answer are graded by your teacher against the scoring notes. All angles are in
    degrees. Items marked (Calculator.) need a calculator.
  questions:
    # ---- Stimulus set: a two-leg course (4.5)
    - slug: trig-u04-w22-q01
      type: multiple_choice
      topic_code: "4.5"
      source: "Original item; Common Core HSG-SRT.D.11"
      points: 1
      stimulus: |
        (Calculator.) A hypothetical fishing boat leaves harbour H and sails 30 nautical miles on a bearing of 040° to point P. It then turns and sails 18 nautical miles on a bearing of 115° to point Q. All angles are in degrees.
      prompt: |
        What is the angle HPQ inside triangle HPQ?
      options:
        - "75°"
        - "105°"
        - "155°"
        - "115°"
      option_explanations:
        - |
          75° = 115° − 40° is how far the boat turned, not the angle inside the triangle; the interior angle is its supplement.
        - |
          Correct. From P the direction back to H is 220°, and the new heading is 115°, so the angle between them is 220° − 115° = 105°.
        - |
          155° = 115° + 40° adds the two bearings, which has no geometric meaning here.
        - |
          115° is the second bearing, measured from north, not from the line back to H.
      answer: 1
    - slug: trig-u04-w22-q02
      type: numeric
      topic_code: "4.5"
      source: "Original item; Common Core HSG-SRT.D.11"
      points: 1
      stimulus: |
        (Calculator.) A hypothetical fishing boat leaves harbour H and sails 30 nautical miles on a bearing of 040° to point P. It then turns and sails 18 nautical miles on a bearing of 115° to point Q. All angles are in degrees.
      prompt: |
        How far is the boat from the harbour at Q? Give the distance in nautical miles to the nearest tenth.
      answer: { value: 38.8, tolerance: 0.1 }
      explanation: |
        SAS with the angle 105° at P: HQ² = 30² + 18² − 2(30)(18) cos 105° ≈ 900 + 324 + 279.5 = 1503.5, so HQ ≈ 38.8 nautical miles.
    - slug: trig-u04-w22-q03
      type: multiple_choice
      topic_code: "4.5"
      source: "Original item; Common Core HSG-SRT.D.11"
      points: 1
      stimulus: |
        (Calculator.) A hypothetical fishing boat leaves harbour H and sails 30 nautical miles on a bearing of 040° to point P. It then turns and sails 18 nautical miles on a bearing of 115° to point Q. All angles are in degrees.
      prompt: |
        To the nearest tenth of a degree, what is angle PHQ, at the harbour?
      options:
        - "48.4°"
        - "75.0°"
        - "26.6°"
        - "153.4°"
      option_explanations:
        - |
          48.4° is the angle at Q, opposite the 30-mile leg; the angle at H is opposite the 18-mile leg.
        - |
          75.0° is the turn angle, 115° − 40°, which belongs at P, not at H.
        - |
          Correct. sin H = 18 sin 105°/38.78 ≈ 0.448, so H ≈ 26.6°; it is opposite the shorter leg, so it must be acute.
        - |
          153.4° is the obtuse angle with the same sine, but the triangle already has an obtuse angle of 105° at P.
      answer: 2
    - slug: trig-u04-w22-q04
      type: multiple_choice
      topic_code: "4.5"
      source: "Original item; Common Core HSG-SRT.D.11"
      points: 1
      stimulus: |
        (Calculator.) A hypothetical fishing boat leaves harbour H and sails 30 nautical miles on a bearing of 040° to point P. It then turns and sails 18 nautical miles on a bearing of 115° to point Q. All angles are in degrees.
      prompt: |
        To the nearest tenth of a degree, what is the bearing from H to Q?
      options:
        - "066.6°"
        - "013.4°"
        - "246.6°"
        - "088.4°"
      option_explanations:
        - |
          Correct. Q lies clockwise from the first leg (the boat turned right), so the bearing is 040° + 26.6° = 066.6°.
        - |
          013.4° subtracts the angle at H from 040°, but the boat turned clockwise, so Q is further clockwise than P.
        - |
          246.6° is the reverse bearing, the course from Q back to H.
        - |
          088.4° adds the angle at Q (48.4°) instead of the angle at H.
      answer: 0
    # ---- Topic 4.5
    - slug: trig-u04-w22-q05
      type: multiple_choice
      topic_code: "4.5"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        Which three-digit bearing describes the same direction as S 35° E?
      options:
        - "035°"
        - "215°"
        - "125°"
        - "145°"
      option_explanations:
        - |
          035° is N 35° E. S 35° E starts from south (180°), not north.
        - |
          215° is S 35° W: 180° + 35° turns towards west.
        - |
          125° is S 55° E, which measures 35° from east instead of from south.
        - |
          Correct. South is 180°, and turning 35° towards east brings the clockwise angle back to 180° − 35° = 145°.
      answer: 3
    - slug: trig-u04-w22-q06
      type: multiple_choice
      topic_code: "4.5"
      source: "Original item; Common Core HSG-SRT.D.11"
      points: 1
      prompt: |
        (Calculator.) To find the distance AB across a hypothetical pond, a surveyor stands at C and measures CA = 250 m, CB = 380 m and angle ACB = 74°. To the nearest metre, what is AB?
      options:
        - "455 m"
        - "393 m"
        - "509 m"
        - "425 m"
      option_explanations:
        - |
          455 m is √(250² + 380²), which assumes a right angle at C; the angle is 74°.
        - |
          Correct. AB² = 250² + 380² − 2(250)(380) cos 74° ≈ 154 529, so AB ≈ 393 m.
        - |
          509 m adds 2(250)(380) cos 74° instead of subtracting it.
        - |
          425 m leaves out the factor 2 in 2ab cos C.
      answer: 1
    - slug: trig-u04-w22-q07
      type: multiple_choice
      topic_code: "4.5"
      source: "Original item; Common Core HSG-SRT.D.11"
      points: 1
      prompt: |
        (Calculator.) From point P the angle of elevation to the top of a hypothetical water tower is 32°. From point Q, 60 m closer along a straight level line towards the tower, the angle is 47°. To the nearest tenth of a metre, how tall is the tower?
      options:
        - "89.8 m"
        - "122.8 m"
        - "64.3 m"
        - "65.1 m"
      option_explanations:
        - |
          Correct. The angle at the top is 47° − 32° = 15°, so QT = 60 sin 32°/sin 15° ≈ 122.85 m, and the height is QT sin 47° ≈ 89.8 m.
        - |
          122.8 m is QT, the slant line of sight from Q; the height is that times sin 47°.
        - |
          64.3 m is 60 tan 47°, which treats 60 m as the distance from Q to the base; 60 m is the distance between P and Q.
        - |
          65.1 m multiplies QT by sin 32°, the angle at P; the right triangle with the height uses the angle at Q.
      answer: 0
    - slug: trig-u04-w22-q08
      type: multiple_choice
      topic_code: "4.5"
      source: "Original item; Common Core HSG-SRT.D.10"
      points: 1
      prompt: |
        Two lookouts on a straight shoreline 5 km apart each measure the angle between the shoreline and their line of sight to a ship. Which plan finds the distance from the first lookout to the ship?
      options:
        - "Use the law of cosines with the two measured angles"
        - "Use the Pythagorean theorem with the 5 km baseline"
        - "Find the angle at the ship from the angle sum, then use the law of sines"
        - "Use Heron's formula, then divide the area by the baseline"
      option_explanations:
        - |
          The law of cosines needs two sides with the included angle, or three sides; here only one side is known.
        - |
          Nothing says the triangle has a right angle, so the Pythagorean theorem does not apply.
        - |
          Correct. Two angles and the included side are ASA: the angle sum gives the third angle, and then each unknown side faces a known angle.
        - |
          Heron's formula needs all three sides, and two of them are what you are trying to find.
      answer: 2
    - slug: trig-u04-w22-q09
      type: multiple_choice
      topic_code: "4.5"
      source: "Original item; Common Core HSG-SRT.D.11"
      points: 1
      prompt: |
        (Calculator.) Fire lookouts A and B are 8 km apart, with B due east of A. Smoke is seen from A on a bearing of N 40° E and from B on a bearing of N 30° W. To the nearest hundredth of a kilometre, how far is the fire from A?
      options:
        - "6.52 km"
        - "5.47 km"
        - "8.68 km"
        - "7.37 km"
      option_explanations:
        - |
          6.52 km is the distance from B, opposite the 50° angle at A.
        - |
          5.47 km uses sin 40°, the bearing angle, instead of the interior angle at B, which is 90° − 30° = 60°.
        - |
          8.68 km inverts the ratio, 8 sin 70°/sin 60°.
        - |
          Correct. Interior angles: A = 90° − 40° = 50°, B = 90° − 30° = 60°, fire = 70°. AF = 8 sin 60°/sin 70° ≈ 7.37 km.
      answer: 3
    - slug: trig-u04-w22-q10
      type: multiple_choice
      topic_code: "4.5"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        (Calculator.) A hypothetical light aircraft flies 200 miles on a bearing of 070° and then 150 miles on a bearing of 160°. To the nearest tenth of a degree, what is the bearing from its starting point to where it ends?
      options:
        - "106.9°"
        - "036.9°"
        - "286.9°"
        - "123.1°"
      option_explanations:
        - |
          Correct. The turn is exactly 90°, so the angle at the start is tan⁻¹(150/200) ≈ 36.9°, and the bearing is 070° + 36.9° = 106.9° (the distance is 250 miles).
        - |
          036.9° is the angle at the start of the triangle, not a bearing; it must be added to the first leg's 070°.
        - |
          286.9° is the reverse bearing, from the end point back to the start.
        - |
          123.1° adds tan⁻¹(200/150) ≈ 53.1°, the angle at the end point, not at the start.
      answer: 0
    - slug: trig-u04-w22-q11
      type: multi_select
      topic_code: "4.5"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about bearings are true? Select all that apply.
      options:
        - "250° is the same direction as S 70° W."
        - "S 40° E is the same direction as 220°."
        - "N 30° W is the same direction as 330°."
        - "If the bearing from A to B is 050°, then the bearing from B to A is 230°."
        - "Three-digit bearings are measured counterclockwise from east."
      option_explanations:
        - |
          Correct. 250° − 180° = 70° past south, towards west.
        - |
          S 40° E is 180° − 40° = 140°; 220° is S 40° W.
        - |
          Correct. N 30° W starts at north and turns 30° counterclockwise, so the clockwise angle is 360° − 30° = 330°.
        - |
          Correct. The reverse bearing is 050° + 180° = 230°.
        - |
          That describes angles in standard position. Bearings are measured clockwise from north.
      answer: [0, 2, 3]
    - slug: trig-u04-w22-q12
      type: multi_select
      topic_code: "4.5"
      source: "Original item; Common Core HSG-SRT.D.11"
      points: 2
      partial_credit: true
      prompt: |
        A tower's top T is sighted at angle of elevation α from point P and at a larger angle β from point Q, which is d metres closer to the tower on a straight level line. For the oblique triangle PQT, which statements are true? Select all that apply.
      options:
        - "The height of the tower equals d sin β."
        - "The angle at T is β − α."
        - "The angle at Q inside triangle PQT is 180° − β."
        - "The law of cosines must be used first, because two sides are known."
        - "QT = d sin α/sin(β − α)."
      option_explanations:
        - |
          d is the distance between the sighting points, not the line of sight; the height is QT sin β.
        - |
          Correct. The angles are α at P and 180° − β at Q, so the angle sum leaves β − α at T.
        - |
          Correct. The angle inside the triangle at Q and the angle of elevation β lie on a straight line, so they are supplementary.
        - |
          Only one side, d, is known; with two angles it is ASA, so the law of sines is the tool.
        - |
          Correct. By the law of sines, QT (opposite α) over sin α equals d (opposite β − α) over sin(β − α).
      answer: [1, 2, 4]
    - slug: trig-u04-w22-q13
      type: true_false
      topic_code: "4.5"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        True or false: The bearing from Q back to P always differs from the bearing from P to Q by exactly 180°.
      answer: true
      explanation: |
        True. The two directions point along the same line in opposite directions, so the clockwise angles from north differ by a half-turn: add 180° if the outbound bearing is under 180°, subtract 180° otherwise.
    - slug: trig-u04-w22-q14
      type: true_false
      topic_code: "4.4"
      source: "Original item; Common Core HSG-SRT.D.9"
      points: 1
      prompt: |
        True or false: A triangle with two sides of length 10 and an included angle of 30° has area 50.
      answer: false
      explanation: |
        False. Area = ½ · 10 · 10 · sin 30° = 50 · ½ = 25. The value 50 forgets the factor sin 30°, treating the angle as if it were 90°.
    - slug: trig-u04-w22-q15
      type: fill_blank
      topic_code: "4.5"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        Written as a three-digit bearing, the compass direction S 20° W is ____ degrees.
      answer: ["200", "200°", "200 degrees"]
      explanation: |
        South is 180°, and turning a further 20° clockwise towards west gives 180° + 20° = 200°.
    - slug: trig-u04-w22-q16
      type: fill_blank
      topic_code: "4.3"
      source: "Original item; Common Core HSG-SRT.D.11"
      points: 1
      prompt: |
        The largest angle of the triangle with sides 3, 5 and 7 measures exactly ____ degrees.
      answer: ["120", "120°", "120 degrees"]
      explanation: |
        The largest angle is opposite 7: cos C = (9 + 25 − 49)/(2 · 3 · 5) = −15/30 = −1/2, so C = 120°.
    - slug: trig-u04-w22-q17
      type: numeric
      topic_code: "4.4"
      source: "Original item; Common Core HSG-SRT.D.9"
      points: 1
      prompt: |
        (Calculator.) A hypothetical triangular field has sides 120 m, 150 m and 200 m. Use Heron's formula to find its area, to the nearest square metre.
      answer: { value: 8967, tolerance: 1 }
      explanation: |
        s = (120 + 150 + 200)/2 = 235, so the area is √(235 · 115 · 85 · 35) = √80 399 375 ≈ 8966.6, which is 8967 m² to the nearest square metre.
    # ---- Spiral review
    - slug: trig-u04-w22-q18
      type: multiple_choice
      topic_code: "4.2"
      source: "Original item; Common Core HSG-SRT.D.11"
      points: 1
      prompt: |
        In triangle ABC, A = 70°, a = 12 and b = 12. How many triangles fit these data?
      options:
        - "Two, because sin B = sin 70° has two solutions"
        - "Exactly one"
        - "None, because a must be longer than b"
        - "Exactly one, and it is a right triangle"
      option_explanations:
        - |
          B = 110° also has sine sin 70°, but 70° + 110° = 180° leaves nothing for C, so it is rejected.
        - |
          Correct. a ≥ b gives one triangle: B = 70°, C = 40°, an isosceles triangle.
        - |
          a must exceed b only when A is obtuse; here A is acute and a = b is allowed.
        - |
          A right triangle would need a = b sin A ≈ 11.28; here a = 12, and the triangle is isosceles with angles 70°, 70°, 40°.
      answer: 1
    - slug: trig-u04-w22-q19
      type: multiple_choice
      topic_code: "4.1"
      source: "Original item; Common Core HSG-SRT.D.11"
      points: 1
      prompt: |
        (Calculator.) In triangle ABC, A = 52°, B = 63° and a = 40. To the nearest hundredth, what is c?
      options:
        - "45.23"
        - "34.78"
        - "40.00"
        - "46.00"
      option_explanations:
        - |
          45.23 is side b, opposite the 63° angle; c is opposite C = 65°.
        - |
          34.78 is 40 sin 52°/sin 65°, the ratio upside down.
        - |
          40 is side a; c faces a larger angle (65° > 52°), so it must be longer.
        - |
          Correct. C = 180° − 52° − 63° = 65°, and c = 40 sin 65°/sin 52° ≈ 46.00.
      answer: 3
    - slug: trig-u04-w22-q20
      type: multiple_choice
      topic_code: "4.3"
      source: "Original item; Common Core HSG-SRT.D.11"
      points: 1
      prompt: |
        (Calculator.) In triangle ABC, a = 14, b = 9 and C = 38°. To the nearest hundredth, what is c?
      options:
        - "16.64"
        - "21.81"
        - "8.86"
        - "13.33"
      option_explanations:
        - |
          16.64 is √(14² + 9²), the Pythagorean theorem; C is 38°, not 90°.
        - |
          21.81 adds 2ab cos C instead of subtracting it.
        - |
          Correct. c² = 196 + 81 − 2(14)(9) cos 38° ≈ 78.42, so c ≈ 8.86.
        - |
          13.33 drops the factor 2 from 2ab cos C.
      answer: 2
    - slug: trig-u04-w22-q21
      type: multiple_choice
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        (Calculator.) From the top of a hypothetical lighthouse 35 m above the water, the angle of depression to a boat is 9°. To the nearest tenth of a metre, how far is the boat from the base of the lighthouse?
      options:
        - "221.0 m"
        - "5.5 m"
        - "223.7 m"
        - "34.6 m"
      option_explanations:
        - |
          Correct. The angle of elevation from the boat is also 9°, so tan 9° = 35/x and x = 35/tan 9° ≈ 221.0 m.
        - |
          5.5 m is 35 tan 9°, which puts the 35 m beside the angle instead of opposite it.
        - |
          223.7 m is 35/sin 9°, the slant distance along the line of sight, not the horizontal distance.
        - |
          34.6 m is 35 cos 9°, which uses the wrong ratio and treats the height as a hypotenuse.
      answer: 0
    - slug: trig-u04-w22-q22
      type: short_answer
      topic_code: "4.5"
      source: "Original item; Common Core HSG-SRT.D.11"
      points: 3
      prompt: |
        (Calculator.) From point P on level ground, the angle of elevation to the top T of a hypothetical cliff is 24°. From point Q, 80 m closer to the cliff on a straight line towards it, the angle of elevation is 39°.

        (a) Find the angles of triangle PQT at Q and at T.
        (b) Find the distance QT to the nearest hundredth of a metre.
        (c) Find the height of the cliff and the horizontal distance from Q to its base, each to the nearest tenth of a metre.
      answer: |
        (a) The angle at Q is 180° − 39° = 141°, and the angle at T is 39° − 24° = 15° (check: 24° + 141° + 15° = 180°).
        (b) By the law of sines, QT = 80 sin 24°/sin 15° ≈ 125.72 m.
        (c) Height = QT sin 39° ≈ 79.1 m; horizontal distance = QT cos 39° ≈ 97.7 m.
      explanation: |
        Three points, one per part. (a) 141° and 15°. (b) QT ≈ 125.72 m (accept ±0.02). (c) both ≈ 79.1 m and ≈ 97.7 m, using the right triangle at the base.
    - slug: trig-u04-w22-q23
      type: short_answer
      topic_code: "4.4"
      source: "Original item; Common Core HSG-SRT.D.9"
      points: 3
      prompt: |
        (Calculator.) The floor of a hypothetical gazebo is a regular pentagon whose vertices lie on a circle of radius 3 m.

        (a) Find the central angle of the pentagon.
        (b) Find the area of the floor to the nearest hundredth of a square metre.
        (c) Use the law of cosines to find the length of one side, and the perimeter, to the nearest hundredth of a metre.
      answer: |
        (a) 360°/5 = 72°.
        (b) Area = ½ · 5 · 3² · sin 72° = 22.5 sin 72° ≈ 21.40 m².
        (c) Each side is the third side of a triangle with two sides 3 and included angle 72°: s² = 9 + 9 − 18 cos 72° ≈ 12.44, so s ≈ 3.53 m, and the perimeter is 5s ≈ 17.63 m.
      explanation: |
        Three points, one per part. (a) 72°. (b) ≈ 21.40 m² (accept ±0.01). (c) side ≈ 3.53 m and perimeter ≈ 17.63 m (accept 17.65 from a rounded side).
    - slug: trig-u04-w22-q24
      type: long_answer
      topic_code: "4.5"
      source: "Original item; Common Core HSG-SRT.D.11"
      points: 6
      prompt: |
        (Calculator.) Two hypothetical coast-guard stations, A and B, stand on a straight east–west coastline 20 km apart, with B due east of A. A distress signal from a boat F at sea (north of the coastline) is detected from A on a bearing of 058° and from B on a bearing of 312°.

        (A) (i) Find the three angles of triangle ABF, explaining how you got the angles at A and B from the bearings.
        (ii) Explain why the law of sines, not the law of cosines, is the right tool for this triangle.

        (B) Find the distance from each station to the boat, to the nearest hundredth of a kilometre.

        (C) (i) Find how far the boat is from the coastline, to the nearest hundredth of a kilometre, and check your answer using the other station.
        (ii) A rescue boat leaves B at 30 km/h on a bearing of 312°. To the nearest minute, how long does it take to reach F?
      answer: |
        (A) (i) At A the line to B points due east (090°), and the signal is on 058°, so angle A = 90° − 58° = 32°. At B the line to A points due west (270°), and the signal is on 312°, so angle B = 312° − 270° = 42°. Angle F = 180° − 32° − 42° = 106°.
        (ii) The known parts are two angles and the side between them (ASA). No two sides are known, so the law of cosines cannot start; once the third angle is known, each unknown side is opposite a known angle, which is what the law of sines needs.
        (B) AF = 20 sin 42°/sin 106° ≈ 13.92 km and BF = 20 sin 32°/sin 106° ≈ 11.03 km.
        (C) (i) The distance from the coastline is the height from F: AF sin 32° ≈ 13.92 × 0.5299 ≈ 7.38 km. Check: BF sin 42° ≈ 11.03 × 0.6691 ≈ 7.38 km.
        (ii) Time = 11.03/30 ≈ 0.3675 h ≈ 22 minutes.
      explanation: |
        Six points. (A) 1 point for 32°, 42° and 106° with the bearing reasoning; 1 point for identifying ASA and why the law of sines applies. (B) 1 point for AF ≈ 13.92 km; 1 point for BF ≈ 11.03 km (accept ±0.01). (C) 1 point for ≈ 7.38 km with a check from the other station; 1 point for ≈ 22 minutes.
