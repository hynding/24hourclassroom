week: 25
unit: 4
title: "Forces, Equilibrium and Velocity"
topics: ["4.10"]
guide: guides/week-25.md
guide_description: |
  Vectors at work: resultant forces and equilibrants; equilibrium as a zero resultant, with both component
  equations, to find the tensions in cables; weights on inclined planes split into w sin θ along the slope and
  w cos θ into it; heading and airspeed versus course and ground speed; choosing a heading against a cross-wind;
  and boats crossing a current, aimed straight across or aimed upstream to land opposite. Worked examples: two
  ropes on a crate, a sign on two cables, a crate on a 20° ramp, a plane in a north wind, a pilot correcting for a
  south wind, and a boat on a 2 mph river.
flashcards_description: |
  30 cards on resultants and equilibrants, equilibrium equations and cable tensions, inclined-plane components,
  air and ground velocity, wind and current directions, and the heading needed to cancel a cross-wind or current.

flashcards:
  - front: Resultant of several forces on one point → how to find it
    back: |
      Write each as |F|⟨cos θ, sin θ⟩, add the components, then find the magnitude and direction of the sum.
    topic_code: "4.10"
  - front: 40 N at 0° plus 60 N at 50° → resultant
    back: |
      ⟨40, 0⟩ + ⟨38.567, 45.963⟩ ≈ ⟨78.567, 45.963⟩: about 91.02 N at 30.33°.
    topic_code: "4.10"
  - front: Equilibrant of a set of forces → definition
    back: |
      The single force that balances them: the negative of their resultant, same magnitude, direction + 180°.
    topic_code: "4.10"
  - front: Equilibrium condition for forces on an object → statement
    back: |
      The resultant is the zero vector: horizontal components add to 0 and vertical components add to 0.
    topic_code: "4.10"
  - front: Forces ⟨3, −5⟩ and ⟨−7, 2⟩ on one point → third force for equilibrium
    back: |
      Their sum is ⟨−4, −3⟩, so the third force is ⟨4, 3⟩ (magnitude 5).
    topic_code: "4.10"
  - front: Tension in a cable → direction of the force
    back: |
      Along the cable, pulling away from the object towards the point where the cable is fixed.
    topic_code: "4.10"
  - front: 200 N sign on cables at 35° and 50° → the two equations
    back: |
      −T₁ cos 35° + T₂ cos 50° = 0 and T₁ sin 35° + T₂ sin 50° = 200, giving T₁ ≈ 129.05 N, T₂ ≈ 164.46 N.
    topic_code: "4.10"
  - front: Unequal cables holding a weight → which carries more
    back: |
      The steeper cable (larger angle with the horizontal) carries the larger tension.
    topic_code: "4.10"
  - front: Weight w on two symmetric cables at angle θ to the horizontal → tension
    back: |
      2T sin θ = w, so T = w/(2 sin θ). At θ = 30°, T = w.
    topic_code: "4.10"
  - front: Why a loaded washing line can never be perfectly straight → reason
    back: |
      T = w/(2 sin θ) grows without bound as θ → 0°; a straight line would need infinite tension.
    topic_code: "4.10"
  - front: Weight w on a ramp at angle θ → component down the slope
    back: |
      w sin θ: the force that tends to make the object slide, and the force needed to hold it (no friction).
    topic_code: "4.10"
  - front: Weight w on a ramp at angle θ → component into the slope
    back: |
      w cos θ, balanced by the normal force from the ramp.
    topic_code: "4.10"
  - front: Ramp components → quick check of sine versus cosine
    back: |
      On a flat surface (θ = 0°) nothing pulls along it: w sin 0° = 0, and all the weight presses in: w cos 0° = w.
    topic_code: "4.10"
  - front: 300 lb crate on a 20° ramp → holding force and normal component
    back: |
      300 sin 20° ≈ 102.61 lb along the ramp; 300 cos 20° ≈ 281.91 lb into it.
    topic_code: "4.10"
  - front: Heading and airspeed → meaning
    back: |
      The direction the plane points and its speed relative to the air.
    topic_code: "4.10"
  - front: Course and ground speed → meaning
    back: |
      The direction the plane actually travels over the ground and its speed relative to the ground.
    topic_code: "4.10"
  - front: Ground velocity of a plane → vector equation
    back: |
      Ground velocity = air velocity + wind velocity.
    topic_code: "4.10"
  - front: A wind "from the north" → direction of its vector
    back: |
      It blows towards the south: ⟨0, −speed⟩. Winds are named for where they come from.
    topic_code: "4.10"
  - front: Heading 060° at 420 mph with a 40 mph north wind → ground speed and course
    back: |
      ⟨363.731, 210⟩ + ⟨0, −40⟩ = ⟨363.731, 170⟩: about 401.50 mph on a course of about 065.0°.
    topic_code: "4.10"
  - front: Flying due east at 300 mph airspeed in a 50 mph south wind → heading
    back: |
      Aim south of east by α with 300 sin α = 50: α ≈ 9.59°, heading ≈ 099.6°; ground speed √(300² − 50²) ≈ 295.80 mph.
    topic_code: "4.10"
  - front: Plane heading due north at 300 mph, 40 mph wind from the west → ground speed
    back: |
      ⟨40, 300⟩, so √(40² + 300²) ≈ 302.65 mph, on a course of about 007.6°.
    topic_code: "4.10"
  - front: Boat aimed straight across a river → what happens
    back: |
      It drifts downstream. Its bank velocity is (boat speed across) + (current downstream); the crossing time uses only the across part.
    topic_code: "4.10"
  - front: Boat 6 mph aimed across a 0.5 mi river with a 2 mph current → time and drift
    back: |
      Time 0.5/6 h = 5 min; drift 2 · (1/12) = 1/6 mi downstream; speed over the ground √40 ≈ 6.32 mph.
    topic_code: "4.10"
  - front: Boat speed b, current c, to land directly opposite → aiming angle
    back: |
      Aim upstream by α with sin α = c/b; crossing speed √(b² − c²). Impossible if c > b.
    topic_code: "4.10"
  - front: Boat 8 km/h, current 3 km/h, landing opposite → angle upstream
    back: |
      sin α = 3/8, α ≈ 22.02°, crossing speed √55 ≈ 7.42 km/h.
    topic_code: "4.10"
  - front: Aiming straight across versus aiming upstream → which crossing is faster
    back: |
      Straight across is faster (all the boat's speed goes across), but lands downstream; aiming upstream lands opposite but takes longer.
    topic_code: "4.10"
  - front: Two perpendicular forces of 5 N and 12 N → resultant
    back: |
      √(25 + 144) = 13 N, at tan⁻¹(12/5) ≈ 67.38° from the 5 N force.
    topic_code: "4.10"
  - front: Error-spot → "A 420 mph plane in a 40 mph cross-wind has ground speed 460 mph."
    back: |
      Speeds add only when the wind is directly behind. Add the velocity vectors and take the magnitude.
    topic_code: "4.10"
  - front: Error-spot → "A 150 lb box on a 25° ramp needs 150 cos 25° to hold it."
    back: |
      150 cos 25° ≈ 135.95 lb is the part into the ramp. The holding force is 150 sin 25° ≈ 63.39 lb.
    topic_code: "4.10"
  - front: Error-spot → "A 120 N lantern on two 30° cables puts 60 N in each."
    back: |
      Only the vertical parts share the weight: 2T sin 30° = 120 gives T = 120 N in each cable.
    topic_code: "4.10"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topic 4.10: resultant forces, equilibrium and cable
    tensions, inclined planes, airplanes in wind and boats in a current), with about a third reviewing weeks 23
    and 24 (vector operations, the dot product, projections, work) and weeks 21–22 (the law of cosines, triangle
    area, navigation). Includes a shared-context set on a plane flying in a cross-wind. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
    Items marked (Calculator.) need a calculator; the rest are designed to be done by hand. Angles are in degrees.
  questions:
    # ---- Stimulus set: a plane in a cross-wind (4.10)
    - slug: trig-u04-w25-q01
      type: multiple_choice
      topic_code: "4.10"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 1
      stimulus: |
        A hypothetical small plane has an airspeed of 300 mph and a heading of due north (bearing 000°). A steady wind blows from the west at 40 mph. Use east and north as the positive directions.
      prompt: |
        Which vector is the plane's ground velocity, in mph?
      options:
        - "⟨−40, 300⟩"
        - "⟨300, 40⟩"
        - "⟨40, 300⟩"
        - "⟨0, 340⟩"
      option_explanations:
        - |
          A wind from the west blows towards the east, so its east component is +40, not −40.
        - |
          The components are swapped: the plane's 300 mph is northward (second component) and the wind's 40 mph eastward.
        - |
          Correct. Air velocity ⟨0, 300⟩ plus wind velocity ⟨40, 0⟩ gives ⟨40, 300⟩.
        - |
          This adds the speeds as if the wind were a tail wind; a cross-wind adds a perpendicular component instead.
      answer: 2
    - slug: trig-u04-w25-q02
      type: multiple_choice
      topic_code: "4.10"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 1
      stimulus: |
        A hypothetical small plane has an airspeed of 300 mph and a heading of due north (bearing 000°). A steady wind blows from the west at 40 mph. Use east and north as the positive directions.
      prompt: |
        (Calculator.) To the nearest hundredth, what is the plane's ground speed?
      options:
        - "302.65 mph"
        - "340.00 mph"
        - "297.32 mph"
        - "260.00 mph"
      option_explanations:
        - |
          Correct. |⟨40, 300⟩| = √(1600 + 90 000) = √91 600 ≈ 302.65 mph.
        - |
          340 adds the two speeds, which is right only for a wind directly from behind.
        - |
          297.32 = √(300² − 40²) is the ground speed after turning into the wind to fly due north, not the speed on this heading.
        - |
          260 subtracts the wind speed, as for a head wind; a cross-wind slightly increases the ground speed here.
      answer: 0
    - slug: trig-u04-w25-q03
      type: multiple_choice
      topic_code: "4.10"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 1
      stimulus: |
        A hypothetical small plane has an airspeed of 300 mph and a heading of due north (bearing 000°). A steady wind blows from the west at 40 mph. Use east and north as the positive directions.
      prompt: |
        (Calculator.) To the nearest tenth of a degree, what is the plane's course, as a three-digit bearing?
      options:
        - "082.4°"
        - "352.4°"
        - "007.7°"
        - "007.6°"
      option_explanations:
        - |
          82.4° is the direction angle of ⟨40, 300⟩ measured from east; the bearing is 90° minus that.
        - |
          352.4° is west of north; the wind pushes the plane to the east, so the course is east of north.
        - |
          7.7° ≈ sin⁻¹(40/300) is the correction angle for a heading, not the drift angle tan⁻¹(40/300).
        - |
          Correct. The plane drifts east of north by tan⁻¹(40/300) ≈ 7.6°, so the course is the bearing 007.6°.
      answer: 3
    - slug: trig-u04-w25-q04
      type: multiple_choice
      topic_code: "4.10"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 1
      stimulus: |
        A hypothetical small plane has an airspeed of 300 mph and a heading of due north (bearing 000°). A steady wind blows from the west at 40 mph. Use east and north as the positive directions.
      prompt: |
        (Calculator.) The pilot changes heading so that the plane's course is due north. To the nearest tenth of a degree, what heading should she fly?
      options:
        - "N 7.6° W"
        - "N 7.7° W"
        - "N 7.7° E"
        - "N 82.3° W"
      option_explanations:
        - |
          tan⁻¹(40/300) is the drift angle when pointed north; to cancel the wind exactly, the westward part of the air velocity, 300 sin α, must equal 40.
        - |
          Correct. 300 sin α = 40 gives α = sin⁻¹(40/300) ≈ 7.7°, pointing into the wind: N 7.7° W (bearing 352.3°).
        - |
          Turning east would add to the wind's push; the plane must point into the wind, towards the west.
        - |
          82.3° is the complement of the correction angle; the plane points only slightly west of north.
      answer: 1
    # ---- Topic 4.10
    - slug: trig-u04-w25-q05
      type: multiple_choice
      topic_code: "4.10"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 1
      prompt: |
        Forces of 30 N due east and 40 N due north act on the same point. Which describes the resultant?
      options:
        - "50 N at a direction angle of about 53.13°"
        - "70 N at a direction angle of about 53.13°"
        - "50 N at a direction angle of about 36.87°"
        - "10 N at a direction angle of 90°"
      option_explanations:
        - |
          Correct. |⟨30, 40⟩| = 50 N, and the direction angle is tan⁻¹(40/30) ≈ 53.13°.
        - |
          70 = 30 + 40 adds magnitudes of perpendicular forces; the resultant is the hypotenuse, 50 N.
        - |
          36.87° = tan⁻¹(30/40) measures from north, not from east; the larger northward force tilts the resultant past 45°.
        - |
          10 = 40 − 30 treats the forces as opposing; they are perpendicular, not opposite.
      answer: 0
    - slug: trig-u04-w25-q06
      type: multiple_choice
      topic_code: "4.10"
      source: "Original item; Common Core HSN-VM.B.4"
      points: 1
      prompt: |
        Forces F₁ = ⟨3, −5⟩ and F₂ = ⟨−7, 2⟩ act on an object. Which third force F₃ puts the object in equilibrium?
      options:
        - "⟨−4, −3⟩"
        - "⟨10, −7⟩"
        - "⟨4, 3⟩"
        - "⟨−10, 7⟩"
      option_explanations:
        - |
          ⟨−4, −3⟩ is F₁ + F₂, the resultant; equilibrium needs its opposite so the total is zero.
        - |
          ⟨10, −7⟩ is F₁ − F₂; equilibrium depends on the sum of the forces, not their difference.
        - |
          Correct. F₁ + F₂ = ⟨−4, −3⟩, so F₃ = −(F₁ + F₂) = ⟨4, 3⟩ makes the total ⟨0, 0⟩.
        - |
          ⟨−10, 7⟩ is F₂ − F₁; adding it to F₁ + F₂ leaves ⟨−14, 4⟩, not the zero vector.
      answer: 2
    - slug: trig-u04-w25-q07
      type: multiple_choice
      topic_code: "4.10"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 1
      prompt: |
        (Calculator.) A 150 lb box rests on a frictionless ramp inclined at 25°. To the nearest hundredth, what force parallel to the ramp keeps it from sliding?
      options:
        - "135.95 lb"
        - "69.95 lb"
        - "150.00 lb"
        - "63.39 lb"
      option_explanations:
        - |
          135.95 = 150 cos 25° is the part of the weight pressing into the ramp, not the part along it.
        - |
          69.95 = 150 tan 25° uses tangent; the down-slope component of the weight is w sin θ.
        - |
          The whole weight acts straight down; only part of it pulls along a 25° slope.
        - |
          Correct. The down-slope component is 150 sin 25° ≈ 63.39 lb, so that force up the ramp holds the box.
      answer: 3
    - slug: trig-u04-w25-q08
      type: multiple_choice
      topic_code: "4.10"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 1
      prompt: |
        A 120 N lantern hangs from two cables, each making an angle of 30° with the horizontal. What is the tension in each cable?
      options:
        - "60 N"
        - "69.28 N"
        - "120 N"
        - "240 N"
      option_explanations:
        - |
          60 N assumes each cable holds half the weight directly; only the vertical part of each tension, T sin 30°, lifts.
        - |
          69.28 N = 60/cos 30° uses cosine; the vertical part of a cable at 30° to the horizontal is T sin 30°.
        - |
          Correct. 2T sin 30° = 120, so T = 120 N: at 30° each cable carries as much as the whole lantern weighs.
        - |
          240 N = 120/sin 30° forgets that two cables share the load.
      answer: 2
    - slug: trig-u04-w25-q09
      type: multiple_choice
      topic_code: "4.10"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 1
      prompt: |
        (Calculator.) A boat that moves at 8 km/h in still water is aimed straight across a river whose current is 3 km/h. To the nearest hundredth, what is its speed relative to the bank?
      options:
        - "11.00 km/h"
        - "8.54 km/h"
        - "7.42 km/h"
        - "5.00 km/h"
      option_explanations:
        - |
          11 = 8 + 3 would need the current to flow in the boat's direction; here it flows across the boat's path.
        - |
          Correct. The velocities are perpendicular: √(8² + 3²) = √73 ≈ 8.54 km/h.
        - |
          7.42 = √(8² − 3²) is the crossing speed when the boat aims upstream to land directly opposite.
        - |
          5 = 8 − 3 treats the current as a head-on opposing flow; it is perpendicular to the boat's heading.
      answer: 1
    - slug: trig-u04-w25-q10
      type: multiple_choice
      topic_code: "4.10"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 1
      prompt: |
        (Calculator.) The same boat (8 km/h in still water, current 3 km/h) must land directly opposite its starting point. To the nearest hundredth of a degree, at what angle upstream from straight across should it aim?
      options:
        - "20.56°"
        - "67.98°"
        - "22.02°"
        - "69.44°"
      option_explanations:
        - |
          20.56° = tan⁻¹(3/8) is the drift angle when aimed straight across; cancelling the current needs 8 sin α = 3.
        - |
          67.98° is the complement of the correct angle, measured from the bank rather than from straight across.
        - |
          Correct. The upstream part of the boat's velocity must cancel the current: 8 sin α = 3, α = sin⁻¹(3/8) ≈ 22.02°.
        - |
          69.44° = 90° − 20.56° is the drift angle of a boat aimed straight across, measured from the bank; it does not cancel the current.
      answer: 2
    # ---- Spiral review
    - slug: trig-u04-w25-q11
      type: multiple_choice
      topic_code: "4.8"
      source: "Original item; Common Core HSN-VM.B.4 (extension)"
      points: 1
      prompt: |
        (Calculator.) To the nearest hundredth of a degree, what is the angle between ⟨3, 1⟩ and ⟨−1, 2⟩?
      options:
        - "81.87°"
        - "98.13°"
        - "−8.13°"
        - "135.00°"
      option_explanations:
        - |
          81.87° = cos⁻¹(+1/√50) drops the negative sign of the dot product −3 + 2 = −1.
        - |
          Correct. The dot product is −1, the magnitudes are √10 and √5, so cos θ = −1/√50 ≈ −0.1414 and θ ≈ 98.13°.
        - |
          The angle between vectors is in [0°, 180°]; cos⁻¹ never returns a negative angle.
        - |
          135° would need cos θ = −√2/2 ≈ −0.707, but here cos θ ≈ −0.141, only slightly obtuse.
      answer: 1
    - slug: trig-u04-w25-q12
      type: multiple_choice
      topic_code: "4.9"
      source: "Original item; Common Core HSN-VM.B.5 (extension)"
      points: 1
      prompt: |
        A force F = ⟨10, −4⟩ newtons moves an object along the displacement d = ⟨5, 6⟩ metres. How much work does F do?
      options:
        - "74 J"
        - "⟨50, −24⟩ J"
        - "−26 J"
        - "26 J"
      option_explanations:
        - |
          74 = 50 + 24 ignores the negative sign: the downward part of F works against the upward motion.
        - |
          Work is a scalar: add the products of matching components rather than listing them.
        - |
          The sign is reversed; 50 − 24 is positive, so F does positive work overall.
        - |
          Correct. W = F · d = 10·5 + (−4)·6 = 50 − 24 = 26 J.
      answer: 3
    - slug: trig-u04-w25-q13
      type: multiple_choice
      topic_code: "4.7"
      source: "Original item; Common Core HSN-VM.B.4"
      points: 1
      prompt: |
        For u = ⟨−1, 3⟩ and v = ⟨4, −2⟩, what is |2u + v|?
      options:
        - "2√5"
        - "2√10 + 2√5"
        - "6"
        - "√52"
      option_explanations:
        - |
          Correct. 2u + v = ⟨−2 + 4, 6 − 2⟩ = ⟨2, 4⟩, and √(4 + 16) = √20 = 2√5.
        - |
          This adds |2u| = 2√10 and |v| = 2√5; the magnitude of a sum must be found from the sum's components, ⟨2, 4⟩.
        - |
          6 = 2 + 4 adds the components of ⟨2, 4⟩ instead of using the Pythagorean theorem.
        - |
          √52 = |⟨6, 4⟩| comes from adding the components of 2u and v with a sign error in the first: −2 + 4 is 2, not 6.
      answer: 0
    - slug: trig-u04-w25-q14
      type: multiple_choice
      topic_code: "4.5"
      source: "Original item; Common Core HSG-SRT.D.11"
      points: 1
      prompt: |
        (Calculator.) Two ships leave the same port. One sails 15 miles on a bearing of 040°; the other sails 20 miles on a bearing of 160°. To the nearest hundredth, how far apart are they?
      options:
        - "25.00 mi"
        - "18.03 mi"
        - "35.00 mi"
        - "30.41 mi"
      option_explanations:
        - |
          25 would be right if the bearings differed by 90°; they differ by 160° − 40° = 120°.
        - |
          18.03 = √325 uses −2ab cos 120° with the wrong sign, as if the angle were 60°.
        - |
          35 = 15 + 20 would need the ships to sail in exactly opposite directions.
        - |
          Correct. The angle at the port is 120°: d² = 15² + 20² − 2(15)(20) cos 120° = 625 + 300 = 925, d ≈ 30.41 mi.
      answer: 3
    - slug: trig-u04-w25-q15
      type: multi_select
      topic_code: "4.10"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 2
      partial_credit: true
      prompt: |
        A crate of weight w rests on a frictionless ramp inclined at angle θ, where 0° < θ < 90°. Which statements about the crate are true? Select all that apply.
      options:
        - "The component of the weight down the ramp is w sin θ."
        - "The component of the weight into the ramp is w tan θ."
        - "As θ increases, the force needed to hold the crate increases."
        - "The force needed to hold the crate can exceed w."
        - "At θ = 45°, the components along and into the ramp are equal."
      option_explanations:
        - |
          Correct. The angle between the weight and the perpendicular to the ramp equals θ, so the down-slope part is w sin θ.
        - |
          The component into the ramp is w cos θ; tangent is not a component of a vector of length w.
        - |
          Correct. w sin θ increases on 0° < θ < 90°, so steeper ramps need larger holding forces.
        - |
          w sin θ < w for θ < 90°; a force parallel to the ramp never needs to exceed the weight.
        - |
          Correct. sin 45° = cos 45°, so w sin 45° = w cos 45° = w√2/2.
      answer: [0, 2, 4]
    - slug: trig-u04-w25-q16
      type: multi_select
      topic_code: "4.8"
      source: "Original item; Common Core HSN-VM.B.4 (extension)"
      points: 2
      partial_credit: true
      prompt: |
        Let a = ⟨6, −2⟩ and b = ⟨1, 3⟩. Which statements about a and b are true? Select all that apply.
      options:
        - "a · b = 12"
        - "a and b are orthogonal."
        - "The angle between a and b is acute."
        - "a · a = 40"
        - "a is parallel to ⟨−3, 1⟩."
      option_explanations:
        - |
          a · b = 6·1 + (−2)·3 = 6 − 6 = 0, not 12; the second product is negative.
        - |
          Correct. a · b = 6 − 6 = 0, so the two vectors are perpendicular.
        - |
          A zero dot product means a right angle, which is neither acute nor obtuse.
        - |
          Correct. a · a = 6² + (−2)² = 36 + 4 = 40, which is |a|².
        - |
          Correct. ⟨6, −2⟩ = −2⟨−3, 1⟩, a scalar multiple, so the vectors are parallel (pointing in opposite directions).
      answer: [1, 3, 4]
    - slug: trig-u04-w25-q17
      type: true_false
      topic_code: "4.10"
      source: "Original item; Common Core HSN-VM.B.4"
      points: 1
      prompt: |
        True or false: If three forces acting on an object hold it in equilibrium, then their vector sum is the zero vector.
      answer: true
      explanation: |
        True. Equilibrium means the resultant force is zero, so the horizontal components add to 0 and the vertical components add to 0. Any one of the three forces is the equilibrant (the negative of the sum) of the other two.
    - slug: trig-u04-w25-q18
      type: true_false
      topic_code: "4.9"
      source: "Original item; Common Core HSN-VM.B.5 (extension)"
      points: 1
      prompt: |
        True or false: For any nonzero vectors u and v, projᵥ u points in the same direction as v.
      answer: false
      explanation: |
        False. projᵥ u = ((u · v)/|v|²) v, and the multiplier is negative whenever u · v < 0 (an obtuse angle), so the projection then points opposite to v. If u · v = 0 the projection is the zero vector.
    - slug: trig-u04-w25-q19
