    - slug: trig-u04-w25-q23
      type: short_answer
      topic_code: "4.10"
      source: "Original item; Common Core HSN-VM.B.4"
      points: 3
      prompt: |
        (Calculator.) A hypothetical 80 lb stage light hangs at rest from two cables. Cable 1 pulls up and to the left at 40° above the horizontal; cable 2 pulls up and to the right at 55° above the horizontal.

        (a) Write the two equilibrium equations (horizontal and vertical) for the tensions T₁ and T₂.
        (b) Solve for T₁ and T₂ to the nearest hundredth of a pound.
        (c) Explain why T₂ is larger than T₁.
      answer: |
        (a) Horizontal: −T₁ cos 40° + T₂ cos 55° = 0. Vertical: T₁ sin 40° + T₂ sin 55° − 80 = 0.
        (b) From the first, T₁ = T₂ cos 55°/cos 40°. Substituting, T₂(cos 55° tan 40° + sin 55°) = 80, so T₂ ≈ 61.52 lb and T₁ ≈ 46.06 lb. (Check: 46.06 cos 40° ≈ 35.29 ≈ 61.52 cos 55°, and 46.06 sin 40° + 61.52 sin 55° ≈ 80.)
        (c) The horizontal pulls must cancel, and cable 2 is steeper, so each pound of its tension gives less horizontal pull (cos 55° < cos 40°); it therefore needs more tension, and it also carries more of the weight.
      explanation: |
        Three points, one per part. (a) both equations with correct signs and trigonometric functions. (b) T₁ ≈ 46.06 lb and T₂ ≈ 61.52 lb (accept within 0.02). (c) a reason based on the horizontal balance or the steeper angle.
    - slug: trig-u04-w25-q24
      type: short_answer
      topic_code: "4.9"
      source: "Original item; Common Core HSN-VM.B.5 (extension)"
      points: 3
      prompt: |
        Let u = ⟨7, 1⟩ and v = ⟨1, 1⟩.

        (a) Find projᵥ u.
        (b) Write u as the sum of a vector parallel to v and a vector orthogonal to v.
        (c) Show that your two parts in (b) are orthogonal to each other.
      answer: |
        (a) u · v = 7 + 1 = 8 and |v|² = 2, so projᵥ u = (8/2)⟨1, 1⟩ = ⟨4, 4⟩.
        (b) u − projᵥ u = ⟨7 − 4, 1 − 4⟩ = ⟨3, −3⟩, so u = ⟨4, 4⟩ + ⟨3, −3⟩.
        (c) ⟨4, 4⟩ · ⟨3, −3⟩ = 12 − 12 = 0.
      explanation: |
        Three points, one per part. (a) ⟨4, 4⟩ with the formula dividing by |v|². (b) the orthogonal part ⟨3, −3⟩ and the sum written out. (c) a dot product of 0 (follow-through accepted from an error in (a)).
    - slug: trig-u04-w25-q25
      type: long_answer
      topic_code: "4.10"
      source: "Original item; Common Core HSN-VM.A.3"
      points: 6
      prompt: |
        (Calculator.) A hypothetical river is 300 m wide, with straight parallel banks and a current of 1.5 m/s. A motorboat moves at 4 m/s relative to the water.

        (A) The boat is aimed straight across.
        (i) Find its speed relative to the bank to the nearest hundredth of a m/s, and its angle downstream from straight across to the nearest hundredth of a degree.
        (ii) Find how long the crossing takes and how far downstream it lands.

        (B) The boat is instead aimed upstream so that it lands directly opposite.
        (i) Find the aiming angle (upstream from straight across) to the nearest hundredth of a degree, and the crossing speed to the nearest hundredth of a m/s.
        (ii) Find the crossing time to the nearest tenth of a second, and explain why it is longer than in (A).

        (C) (i) After heavy rain the current rises to 5 m/s. Show algebraically that no heading lets the boat land directly opposite.
        (ii) Explain in terms of vector components what the boat can still do, and which heading gets it across in the least time.
      answer: |
        (A) (i) The velocities ⟨4, 0⟩ across and ⟨0, 1.5⟩ downstream are perpendicular: speed √(16 + 2.25) = √18.25 ≈ 4.27 m/s, at tan⁻¹(1.5/4) ≈ 20.56° downstream of straight across.
        (ii) Only the across component moves the boat across: 300/4 = 75 s. In 75 s the current carries it 1.5 · 75 = 112.5 m downstream.
        (B) (i) The upstream part of the boat's velocity must cancel the current: 4 sin α = 1.5, α = sin⁻¹(0.375) ≈ 22.02°. Crossing speed 4 cos α = √(16 − 2.25) = √13.75 ≈ 3.71 m/s.
        (ii) 300/√13.75 ≈ 80.9 s. Part of the boat's 4 m/s is spent holding position against the current, so less of it is left to cross (3.71 < 4 m/s).
        (C) (i) Landing opposite needs 4 sin α = 5, that is sin α = 1.25, which is impossible because a sine never exceeds 1: the boat's upstream component can be at most 4 m/s, less than the 5 m/s current.
        (ii) The boat can still cross, but it always drifts downstream; aiming partly upstream only reduces the drift. The crossing time is 300/(4 cos α), which is least when cos α = 1, so aiming straight across (α = 0°) crosses fastest, in 75 s, with all of the boat's speed going across.
      explanation: |
        Six points. (A) 1 point for 4.27 m/s and 20.56°; 1 point for 75 s and 112.5 m. (B) 1 point for 22.02° and 3.71 m/s; 1 point for 80.9 s with the explanation that part of the velocity cancels the current. (C) 1 point for sin α = 1.25 > 1 (or an equivalent component argument); 1 point for explaining that the boat drifts downstream regardless and that aiming straight across minimises the time.
