week: 9
unit: 2
title: "Graphs of Tangent, Cotangent, Secant and Cosecant"
topics: ["2.5", "2.6"]
guide: guides/week-09.md
guide_description: |
  The graphs of y = tan x and y = cot x from the quotients sin x/cos x and cos x/sin x: period π, vertical
  asymptotes, zeros, direction on each branch and odd symmetry; transformed tangent and cotangent with period
  π/|b|; then secant and cosecant drawn as reciprocals of their cosine and sine guides, with asymptotes at the
  guide's zeros, U-shaped branches at the guide's peaks and troughs, and ranges that leave out the open
  interval between them. Worked examples: y = 2 tan(x/2), y = −cot(2x), y = tan(x − π/4) + 1, y = 3 sec x and
  y = −2 csc(2x) + 1.
flashcards_description: |
  30 cards on the tangent and cotangent graphs, their asymptotes, zeros and periods, transformed tangent and
  cotangent, and secant and cosecant graphed from guide functions, with their domains and ranges.

flashcards:
  - front: Where y = tan x is 0 and where it is undefined → from sin x/cos x
    back: |
      Zero where sin x = 0 (x = kπ); undefined, with vertical asymptotes, where cos x = 0 (x = π/2 + kπ).
    topic_code: "2.5"
  - front: Period of y = tan x on the graph → value and reason
    back: |
      π. x and x + π are opposite points on the unit circle; both coordinates change sign, so their quotient is unchanged.
    topic_code: "2.5"
  - front: tan x as x → π/2 from the left and from the right → behaviour
    back: |
      From the left, cos x is small and positive, so tan x → ∞; from the right, cos x is small and negative, so tan x → −∞.
    topic_code: "2.5"
  - front: One branch of y = tan x → endpoints and three key points
    back: |
      Between asymptotes x = −π/2 and x = π/2, through (−π/4, −1), (0, 0), (π/4, 1), rising from −∞ to ∞.
    topic_code: "2.5"
  - front: Asymptotes and zeros of y = cot x → where
    back: |
      Asymptotes x = kπ (sin x = 0); zeros x = π/2 + kπ (cos x = 0). The reverse of tangent.
    topic_code: "2.5"
  - front: One branch of y = cot x → interval and direction
    back: |
      On (0, π), falling from ∞ to −∞ through (π/4, 1), (π/2, 0), (3π/4, −1).
    topic_code: "2.5"
  - front: Range and amplitude of y = tan x and y = cot x → state them
    back: |
      Range all real numbers; no amplitude, no maximum, no minimum.
    topic_code: "2.5"
  - front: Period of y = a tan(bx) or y = a cot(bx) → formula
    back: |
      π/|b|, not 2π/|b|.
    topic_code: "2.5"
  - front: Period of y = 4 tan(3x) → value
    back: |
      π/3.
    topic_code: "2.5"
  - front: Branch of y = 2 tan(x/2) through the origin → asymptotes and key points
    back: |
      Period 2π; asymptotes x = −π and x = π; key points (−π/2, −2), (0, 0), (π/2, 2).
    topic_code: "2.5"
  - front: Asymptotes of a tan(b(x − h)) + k on one branch → how to find
    back: |
      Solve b(x − h) = −π/2 and b(x − h) = π/2; the branch's centre is where b(x − h) = 0, at height k.
    topic_code: "2.5"
  - front: Asymptotes of y = tan(x + π/3) → general form
    back: |
      x + π/3 = π/2 + kπ, so x = π/6 + kπ. The centre of the branch through the y-axis is (−π/3, 0).
    topic_code: "2.5"
  - front: y = −cot(2x) on (0, π/2) → zero, key points, direction
    back: |
      Zero at π/4; (π/8, −1) and (3π/8, 1). The minus sign makes the branch rise.
    topic_code: "2.5"
  - front: Period of y = cot(πx/3) → value
    back: |
      π ÷ (π/3) = 3.
    topic_code: "2.5"
  - front: Guide function for y = a sec(bx) → which graph
    back: |
      y = a cos(bx), its reciprocal partner; for y = a csc(bx), the guide is y = a sin(bx).
    topic_code: "2.6"
  - front: Vertical asymptotes of a secant graph → where on the guide
    back: |
      At the zeros of the cosine guide, where 1/cos x has a zero denominator.
    topic_code: "2.6"
  - front: Turning points of y = sec x on [0, 2π] → list them
    back: |
      Local minimum (0, 1) and (2π, 1) where cos x = 1; local maximum (π, −1) where cos x = −1.
    topic_code: "2.6"
  - front: Domain and range of y = sec x → state them
    back: |
      Domain x ≠ π/2 + kπ; range (−∞, −1] ∪ [1, ∞).
    topic_code: "2.6"
  - front: Domain and range of y = csc x → state them
    back: |
      Domain x ≠ kπ; range (−∞, −1] ∪ [1, ∞).
    topic_code: "2.6"
  - front: Why y = sec x never takes a value strictly between −1 and 1 → reason
    back: |
      cos x lies in [−1, 1], and the reciprocal of a nonzero number in [−1, 1] has size at least 1.
    topic_code: "2.6"
  - front: Which way a secant branch opens → rule
    back: |
      Away from the guide's midline: upward over a peak of the guide, downward under a trough.
    topic_code: "2.6"
  - front: y = csc x on (0, π) → shape and turning point
    back: |
      A U opening upward with local minimum (π/2, 1), between asymptotes x = 0 and x = π.
    topic_code: "2.6"
  - front: Symmetry of y = sec x vs y = csc x → even or odd
    back: |
      sec is even (like cos); csc is odd (like sin).
    topic_code: "2.6"
  - front: y = 3 sec x → turning points and range
    back: |
      Local min (0, 3), local max (π, −3); range (−∞, −3] ∪ [3, ∞).
    topic_code: "2.6"
  - front: Range of y = −2 csc(2x) + 1 → value
    back: |
      Guide runs from −1 to 3, so the range is (−∞, −1] ∪ [3, ∞).
    topic_code: "2.6"
  - front: Asymptotes of y = 2 sec(πx/4) + 1 → general form
    back: |
      πx/4 = π/2 + kπ, so x = 2 + 4k. The period is 8.
    topic_code: "2.6"
  - front: sec(1.2) on a calculator → how to enter it
    back: |
      1 ÷ cos(1.2) in radian mode ≈ 2.760. Not the cos⁻¹ key.
    topic_code: "2.6"
  - front: Error-spot → "y = tan(2x) has period π"
    back: |
      Tangent's period is divided by b: π/2.
    topic_code: "2.5"
  - front: Error-spot → "the range of y = 3 sec x is [−3, 3]"
    back: |
      That is the guide's range. Secant takes the outside: (−∞, −3] ∪ [3, ∞).
    topic_code: "2.6"
  - front: Error-spot → "y = csc x crosses the x-axis where sin x = 0"
    back: |
      Where sin x = 0, csc x is undefined: those are asymptotes. Cosecant has no zeros.
    topic_code: "2.6"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 2.5 and 2.6: the tangent and cotangent graphs,
    transformed tangent and cotangent, secant and cosecant from guide functions, domains and ranges), with about
    a third reviewing weeks 7 and 8 (amplitude, period, phase shift, writing sinusoids) and Unit 1 (the unit
    circle, the Pythagorean identities, bearings). Includes a shared-context set on g(x) = 2 sec(πx/4) + 1.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes. Angles are in radians unless an item says degrees. Items marked (Calculator.) need a calculator; the
    rest are designed to be done by hand.
  questions:
    # ---- Stimulus set: a transformed secant (2.6)
    - slug: trig-u02-w09-q01
      type: multiple_choice
      topic_code: "2.6"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      stimulus: |
        Let g(x) = 2 sec(πx/4) + 1, with the input of secant in radians. Its guide function is y = 2 cos(πx/4) + 1.
      prompt: |
        What is the period of g?
      options:
        - "4"
        - "2π"
        - "π/4"
        - "8"
      option_explanations:
        - |
          4 divides π by π/4, the tangent rule; secant repeats with its cosine guide, every 2π/|b|.
        - |
          2π is the period of sec x; the factor π/4 on x changes it to 2π ÷ (π/4).
        - |
          π/4 is b itself; the period is 2π divided by b.
        - |
          Correct. Secant has the period of its guide: 2π ÷ (π/4) = 8.
      answer: 3
    - slug: trig-u02-w09-q02
      type: multiple_choice
      topic_code: "2.6"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      stimulus: |
        Let g(x) = 2 sec(πx/4) + 1, with the input of secant in radians. Its guide function is y = 2 cos(πx/4) + 1.
      prompt: |
        Which line is a vertical asymptote of the graph of g?
      options:
        - "x = 4"
        - "x = 2"
        - "x = π/2"
        - "x = 0"
      option_explanations:
        - |
          At x = 4, cos π = −1, so g(4) = −2 + 1 = −1: a local maximum of a downward branch, not an asymptote.
        - |
          Correct. At x = 2, πx/4 = π/2 and cos(π/2) = 0, so sec(π/2) is undefined: x = 2 is an asymptote.
        - |
          x = π/2 is an asymptote of sec x, but here the input is πx/4, which is π/2 when x = 2.
        - |
          At x = 0, cos 0 = 1 and g(0) = 3: a local minimum, not an asymptote.
      answer: 1
    - slug: trig-u02-w09-q03
      type: multiple_choice
      topic_code: "2.6"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      stimulus: |
        Let g(x) = 2 sec(πx/4) + 1, with the input of secant in radians. Its guide function is y = 2 cos(πx/4) + 1.
      prompt: |
        What is the range of g?
      options:
        - "(−∞, −1] ∪ [3, ∞)"
        - "[−1, 3]"
        - "(−∞, −2] ∪ [2, ∞)"
        - "(−∞, 1] ∪ [3, ∞)"
      option_explanations:
        - |
          Correct. 2 sec takes values outside (−2, 2), and adding 1 gives everything outside (−1, 3).
        - |
          [−1, 3] is the range of the guide 2 cos(πx/4) + 1; secant takes exactly the values outside that interval, plus its endpoints.
        - |
          This is the range of 2 sec(πx/4) before the vertical shift of +1.
        - |
          The lower part should end at the guide's minimum, 1 − 2 = −1, not at the midline 1.
      answer: 0
    - slug: trig-u02-w09-q04
      type: multiple_choice
      topic_code: "2.6"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      stimulus: |
        Let g(x) = 2 sec(πx/4) + 1, with the input of secant in radians. Its guide function is y = 2 cos(πx/4) + 1.
      prompt: |
        What is the exact value of g(4/3)?
      options:
        - "2"
        - "4√3/3 + 1"
        - "5"
        - "3"
      option_explanations:
        - |
          This uses cos(π/3) = 1/2 in place of sec(π/3): 2 · 1/2 + 1 = 2 is the guide's value, not g's.
        - |
          4√3/3 + 1 uses sec(π/6) = 2/√3; the input is π/4 · 4/3 = π/3, not π/6.
        - |
          Correct. π/4 · 4/3 = π/3, sec(π/3) = 1/cos(π/3) = 2, so g(4/3) = 2 · 2 + 1 = 5.
        - |
          3 is g(0), the local minimum, where the secant is 1.
      answer: 2
    # ---- Topics 2.5 and 2.6
    - slug: trig-u02-w09-q05
      type: multiple_choice
      topic_code: "2.5"
      source: "Original item; Common Core HSF-TF.A.4"
      points: 1
      prompt: |
        What is the period of y = 4 tan(3x)?
      options:
        - "2π/3"
        - "3π"
        - "π/3"
        - "4π"
      option_explanations:
        - |
          2π/3 uses the sine and cosine rule; tangent's basic period is π, so the period is π/3.
        - |
          3π multiplies π by b; a larger b shortens the period.
        - |
          Correct. The period of a tangent is π/|b| = π/3; the factor 4 stretches vertically only.
        - |
          The 4 is a vertical stretch and has no effect on the period.
      answer: 2
    - slug: trig-u02-w09-q06
      type: multiple_choice
      topic_code: "2.5"
      source: "Original item; Common Core HSF-TF.A.4"
      points: 1
      prompt: |
        Where are the vertical asymptotes of y = cot x? (k is any integer.)
      options:
        - "x = kπ"
        - "x = π/2 + kπ"
        - "x = 2kπ"
        - "x = π/4 + kπ"
      option_explanations:
        - |
          Correct. cot x = cos x/sin x is undefined where sin x = 0, that is at x = kπ.
        - |
          Those are the asymptotes of tan x; cotangent has its zeros there, because cos x = 0.
        - |
          This misses half of the asymptotes: sin x is also 0 at odd multiples of π, such as x = π.
        - |
          At x = π/4, cot x = 1; these are points on the graph, not asymptotes.
      answer: 0
    - slug: trig-u02-w09-q07
      type: multiple_choice
      topic_code: "2.5"
      source: "Original item; Common Core HSF-TF.A.4"
      points: 1
      prompt: |
        Which line is a vertical asymptote of y = tan(x + π/3)?
      options:
        - "x = π/2"
        - "x = −π/3"
        - "x = 5π/6"
        - "x = π/6"
      option_explanations:
        - |
          x = π/2 is an asymptote of tan x; this graph is shifted π/3 to the left, so the asymptotes move too.
        - |
          At x = −π/3 the inside is 0 and tan 0 = 0: this is the centre of a branch, a zero.
        - |
          5π/6 shifts the asymptote π/2 to the right by π/3; at x = 5π/6 the inside is 7π/6, where tangent is defined.
        - |
          Correct. Asymptotes are where x + π/3 = π/2 + kπ; k = 0 gives x = π/6.
      answer: 3
    - slug: trig-u02-w09-q08
      type: multiple_choice
      topic_code: "2.6"
      source: "Original item; Common Core HSF-TF.A.4"
      points: 1
      prompt: |
        Which statement describes the graph of y = csc x on the interval (0, π)?
      options:
        - "It has a local maximum of −1 at x = π/2."
        - "It has a local minimum of 1 at x = π/2."
        - "It is undefined at x = π/2."
        - "It decreases on the whole interval."
      option_explanations:
        - |
          On (0, π), sin x is positive, so csc x is positive; the downward branch with a local maximum of −1 is on (π, 2π).
        - |
          Correct. sin x peaks at 1 at x = π/2, so its reciprocal is smallest there: a U opening upward with local minimum (π/2, 1).
        - |
          sin(π/2) = 1 ≠ 0, so csc(π/2) = 1 is defined; the asymptotes are at x = 0 and x = π.
        - |
          The branch falls from ∞ to 1 on (0, π/2) and then rises back to ∞ on (π/2, π).
      answer: 1
    - slug: trig-u02-w09-q09
      type: multiple_choice
      topic_code: "2.6"
      source: "Original item; Common Core HSF-TF.A.4"
      points: 1
      prompt: |
        What is the domain of y = sec x?
      options:
        - "all real numbers"
        - "all real x except x = π/2 + kπ, k an integer"
        - "all real x except x = kπ, k an integer"
        - "[−1, 1]"
      option_explanations:
        - |
          sec x = 1/cos x is undefined wherever cos x = 0, so some real numbers are excluded.
        - |
          Correct. cos x = 0 exactly at x = π/2 + kπ; everywhere else 1/cos x is defined.
        - |
          These are where sin x = 0, the excluded values for csc x and cot x.
        - |
          [−1, 1] is the range of cosine, a set of outputs; the domain of secant is a set of inputs, and it is almost every real number.
      answer: 1
    # ---- Spiral review (weeks 7–8 and Unit 1)
    - slug: trig-u02-w09-q10
      type: multiple_choice
      topic_code: "2.3"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        What is the phase shift of y = cos(2x − π/2)?
      options:
        - "π/2 to the right"
        - "π/4 to the left"
        - "π/2 to the left"
        - "π/4 to the right"
      option_explanations:
        - |
          π/2 is the constant inside; factoring out the 2 gives 2(x − π/4), a shift of π/4.
        - |
          The size is right, but x − π/4 moves the graph to the right.
        - |
          Both the size and the direction are off: the inside is 0 at x = π/4, to the right of 0.
        - |
          Correct. 2x − π/2 = 2(x − π/4), so the graph of cos(2x) moves π/4 to the right.
      answer: 3
    - slug: trig-u02-w09-q11
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        Which equation has amplitude 3 and period 6π?
      options:
        - "y = 3 sin(3x)"
        - "y = 6 sin(x/3)"
        - "y = 3 sin(x/3)"
        - "y = 3 sin(6πx)"
      option_explanations:
        - |
          b = 3 gives period 2π/3, much shorter than 6π.
        - |
          The period 6π is right, but the amplitude is 6.
        - |
          Correct. Amplitude 3, and period 2π ÷ (1/3) = 6π.
        - |
          b = 6π gives period 2π/(6π) = 1/3; the period goes in the denominator of b, not as b.
      answer: 2
    - slug: trig-u02-w09-q12
      type: multiple_choice
      topic_code: "1.12"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        If cos θ = −1/3 and θ is in quadrant II, what is sin θ?
      options:
        - "2√2/3"
        - "−2√2/3"
        - "2/3"
        - "8/9"
      option_explanations:
        - |
          Correct. sin²θ = 1 − 1/9 = 8/9, so sin θ = √8/3 = 2√2/3, positive in quadrant II.
        - |
          The size is right, but sine is positive in quadrant II.
        - |
          2/3 is 1 − 1/3, which skips squaring: the identity is sin²θ + cos²θ = 1.
        - |
          8/9 is sin²θ; take the square root to get sin θ.
      answer: 0
    - slug: trig-u02-w09-q13
      type: multi_select
      topic_code: "2.5"
      source: "Original item; Common Core HSF-TF.A.4"
      points: 2
      partial_credit: true
      prompt: |
        For y = −2 tan(x/2), with x in radians, which statements are true? Select all that apply.
      options:
        - "The period is 2π."
        - "The line x = π is a vertical asymptote."
        - "The function is increasing on each interval between consecutive asymptotes."
        - "The range is [−2, 2]."
        - "The graph passes through (π/2, −2)."
      option_explanations:
        - |
          Correct. The period of a tangent is π/|b| = π ÷ (1/2) = 2π.
        - |
          Correct. At x = π the inside is π/2, where tangent is undefined.
        - |
          The factor −2 reflects each branch, so the function is decreasing between asymptotes.
        - |
          Tangent has no maximum or minimum; the range is all real numbers.
        - |
          Correct. At x = π/2 the inside is π/4, and −2 tan(π/4) = −2 · 1 = −2.
      answer: [0, 1, 4]
    - slug: trig-u02-w09-q14
      type: multi_select
      topic_code: "2.4"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 2
      partial_credit: true
      prompt: |
        A sinusoid has a minimum at (0, −3) and the next maximum at (π, 5). Which equations describe it? Select all that apply.
      options:
        - "y = 4 cos x + 1"
        - "y = −4 cos x + 1"
        - "y = −4 sin x + 1"
        - "y = 4 sin(x − π/2) + 1"
        - "y = 4 cos(x − π) + 1"
      option_explanations:
        - |
          This has its maximum 5 at x = 0; the sinusoid has its minimum there.
        - |
          Correct. Midline 1, amplitude 4, period 2π, and a reflected cosine starts at a minimum: y(0) = −4 + 1 = −3.
        - |
          At x = 0 this gives 1, the midline, not the minimum −3.
        - |
          Correct. At x = 0, 4 sin(−π/2) + 1 = −4 + 1 = −3, and at x = π, 4 sin(π/2) + 1 = 5.
        - |
          Correct. Cosine moved π to the right has its maximum at x = π and its minimum at x = 0: 4 cos(−π) + 1 = −3.
      answer: [1, 3, 4]
    - slug: trig-u02-w09-q15
      type: true_false
      topic_code: "2.6"
      source: "Original item; Common Core HSF-TF.A.4"
      points: 1
      prompt: |
        True or false: The range of y = 3 csc x is [−3, 3].
      answer: false
      explanation: |
        False. [−3, 3] is the range of the guide y = 3 sin x. Since csc x takes values in (−∞, −1] ∪ [1, ∞), 3 csc x takes values in (−∞, −3] ∪ [3, ∞).
    - slug: trig-u02-w09-q16
      type: true_false
      topic_code: "1.11"
      source: "Original item; Common Core HSF-TF.A.3"
      points: 1
      prompt: |
        True or false: tan(5π/4) = −1.
      answer: false
      explanation: |
        False. 5π/4 is in quadrant III, where sine and cosine are both negative (each −√2/2), so tan(5π/4) = (−√2/2)/(−√2/2) = 1.
    - slug: trig-u02-w09-q17
      type: fill_blank
      topic_code: "2.5"
      source: "Original item; Common Core HSF-TF.A.4"
      points: 1
      prompt: |
        The period of y = cot(πx/3) is ____.
      answer: ["3"]
      explanation: |
        Cotangent has period π/|b| = π ÷ (π/3) = 3.
    - slug: trig-u02-w09-q18
      type: fill_blank
      topic_code: "2.3"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        The maximum value of y = 5 cos(x + π/6) + 8 is ____.
      answer: ["13"]
      explanation: |
        The midline is y = 8 and the amplitude is 5, so the maximum is 8 + 5 = 13. The phase shift π/6 moves where it occurs, not its value.
    - slug: trig-u02-w09-q19
      type: numeric
      topic_code: "2.6"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      prompt: |
        (Calculator.) Find sec(1.2), where 1.2 is in radians, to the nearest hundredth.
      answer: { value: 2.76, tolerance: 0.01 }
      explanation: |
        sec(1.2) = 1/cos(1.2) ≈ 1/0.3624 ≈ 2.760, which is 2.76. Use radian mode, and divide 1 by the cosine rather than pressing cos⁻¹.
    - slug: trig-u02-w09-q20
      type: numeric
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        (Calculator.) A hypothetical ship sails 30 km on a bearing of 040° (measured clockwise from north). How far north of its starting point is it? Give your answer to the nearest tenth of a kilometre.
      answer: { value: 23.0, tolerance: 0.1 }
      explanation: |
        The course makes a 40° angle with due north, so the northward distance is the side adjacent to that angle: 30 cos 40° ≈ 22.98, which is 23.0 km. (Calculator in degree mode.)
    - slug: trig-u02-w09-q21
      type: short_answer
      topic_code: "2.5"
      source: "Original item; Common Core HSF-TF.A.4"
      points: 3
      prompt: |
        Let k(x) = 3 tan(2x − π/2), with x in radians.

        (a) Find the period of k.
        (b) Find the two vertical asymptotes of the branch that contains x = π/4, and the zero of k on that branch.
        (c) Find k(3π/8) and k(π/8), and say whether k is increasing or decreasing on that branch.
      answer: |
        (a) Period π/2.
        (b) Factor: 2x − π/2 = 2(x − π/4). Asymptotes where 2(x − π/4) = ±π/2, so x = π/4 ± π/4: x = 0 and x = π/2. The zero is at x = π/4, where the inside is 0.
        (c) k(3π/8) = 3 tan(π/4) = 3 and k(π/8) = 3 tan(−π/4) = −3. The outputs rise from −3 to 3 as x goes from π/8 to 3π/8 (and a = 3 > 0), so k is increasing on the branch.
      explanation: |
        Three points, one per part. (a) π/2. (b) asymptotes x = 0 and x = π/2 and the zero x = π/4. (c) both values 3 and −3, and increasing.
    - slug: trig-u02-w09-q22
      type: short_answer
