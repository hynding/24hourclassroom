      source: "Original item; Common Core HSF-TF.A.4"
      points: 3
      prompt: |
        Let r(x) = 2 csc(x − π/4), with x in radians.

        (a) Give the guide function of r, and find the vertical asymptotes of r on [0, 2π].
        (b) Find the local minimum point and the local maximum point of r on [0, 2π].
        (c) State the range of r.
      answer: |
        (a) Guide y = 2 sin(x − π/4). Asymptotes where sin(x − π/4) = 0: x − π/4 = kπ, so x = π/4 and x = 5π/4 on [0, 2π].
        (b) The guide's maximum 2 is at x − π/4 = π/2, x = 3π/4, giving the local minimum (3π/4, 2); its minimum −2 is at x − π/4 = 3π/2, x = 7π/4, giving the local maximum (7π/4, −2).
        (c) (−∞, −2] ∪ [2, ∞).
      explanation: |
        Three points, one per part. (a) the guide and both asymptotes x = π/4 and 5π/4. (b) both turning points (3π/4, 2) and (7π/4, −2), correctly labelled. (c) (−∞, −2] ∪ [2, ∞).
    - slug: trig-u02-w09-q23
      type: long_answer
      topic_code: "2.5"
      source: "Original item; Common Core HSF-TF.A.4"
      points: 6
      prompt: |
        A hypothetical rotating beacon stands on a small island 2 km from a straight coastline. At t = 0 seconds it points straight at the nearest point P of the coast, and it turns at a steady π/8 radians per second. While the beam hits the coast (−4 < t < 4), the lit spot is d(t) = 2 tan(πt/8) km along the coast from P, and the beam is L(t) = 2 sec(πt/8) km long.

        (A) (i) Find d(2) and L(2) exactly, and L(2) as a decimal to the nearest hundredth.
        (ii) Describe what happens to d(t) as t → 4 from the left, and explain it using the tangent graph and the context.

        (B) (i) Treating y = 2 tan(πt/8) and y = 2 sec(πt/8) as functions of all real t, find the period of each.
        (ii) The beacon takes 16 seconds for a full turn. Explain why the tangent function nevertheless repeats after half that time.

        (C) (i) State the shortest beam length and when it occurs, using the range of secant.
        (ii) Use an identity to show that L(t)² = d(t)² + 4, and explain what this equation says about the triangle formed by the beacon, P and the lit spot.
      answer: |
        (A) (i) d(2) = 2 tan(π/4) = 2 km. L(2) = 2 sec(π/4) = 2 · √2 = 2√2 ≈ 2.83 km.
        (ii) As t → 4⁻, the angle πt/8 → π/2⁻, so tan(πt/8) → ∞ and d(t) → ∞. t = 4 is a vertical asymptote of d: the beam is turning towards a direction parallel to the coast, so the lit spot races further and further along the shore without bound.
        (B) (i) Tangent: π ÷ (π/8) = 8 s. Secant: 2π ÷ (π/8) = 16 s.
        (ii) After 8 s the beacon has turned π radians, so the beam points the opposite way along the same line. Tangent depends only on the slope of that line, which is unchanged, so tan(πt/8) repeats every 8 s (although physically the beam then points out to sea).
        (C) (i) sec takes values of size at least 1, and on −4 < t < 4 the cosine is positive, so L(t) ≥ 2 · 1 = 2. The shortest beam is 2 km, at t = 0, when it points straight at P.
        (ii) By 1 + tan²θ = sec²θ with θ = πt/8: L² = 4 sec²θ = 4(1 + tan²θ) = 4 + 4 tan²θ = d² + 4. This is the Pythagorean theorem for the right triangle with legs 2 km (beacon to P) and d (P to the spot), whose hypotenuse is the beam L.
      explanation: |
        Six points. (A) 1 point for d(2) = 2 and L(2) = 2√2 ≈ 2.83; 1 point for d → ∞ with a reason (asymptote at t = 4, angle → π/2) and a contextual description. (B) 1 point for periods 8 and 16; 1 point for a half-turn explanation (same line, same slope). (C) 1 point for 2 km at t = 0 with a reference to sec ≥ 1; 1 point for the identity step and the Pythagorean interpretation.
