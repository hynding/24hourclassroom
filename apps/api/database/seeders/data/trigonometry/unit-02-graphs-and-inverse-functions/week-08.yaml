week: 8
unit: 2
title: "Phase Shifts and Writing Sinusoids"
topics: ["2.3", "2.4"]
guide: guides/week-08.md
guide_description: |
  The four numbers in y = a sin(b(x − h)) + k and what each does: amplitude, period, phase shift and midline;
  the range [k − |a|, k + |a|]; why y = a sin(bx − c) + d must be factored to b(x − c/b) before reading the
  shift; sketching a shifted cycle from x = h in quarter-period steps; and writing a sinusoid as a sine and as a
  cosine from a graph, a description or a table. Worked examples: y = 2 sin(x − π/3) + 1,
  y = 3 cos(2x + π/2) − 1, a sinusoid through a maximum (1, 7) and minimum (4, −1), an equation from a table,
  and 3 sin(x + π/2) = 3 cos x.
flashcards_description: |
  30 cards on phase shift and vertical shift, factoring out b, midline and range, shifted key points, and
  writing sinusoid equations from graphs and tables in sine and cosine form.

flashcards:
  - front: y = a sin(b(x − h)) + k → the job of each of a, b, h, k
    back: |
      |a| amplitude (a < 0 reflects), 2π/|b| period, h phase shift (right if h > 0), k midline y = k.
    topic_code: "2.3"
  - front: Range of y = a cos(b(x − h)) + k → formula
    back: |
      [k − |a|, k + |a|]. Neither b nor h affects the range.
    topic_code: "2.3"
  - front: Direction of the shift in y = sin(x − π/3) → which way
    back: |
      π/3 to the right: the input must be π/3 larger to give the same output as sin x.
    topic_code: "2.3"
  - front: Direction of the shift in y = cos(x + π/4) → which way
    back: |
      π/4 to the left, because x + π/4 = x − (−π/4).
    topic_code: "2.3"
  - front: Phase shift of y = a sin(bx − c) + d → formula
    back: |
      c/b. Factor: bx − c = b(x − c/b). It is not c.
    topic_code: "2.3"
  - front: Phase shift of y = sin(4x + π) → value and direction
    back: |
      4x + π = 4(x + π/4): π/4 to the left.
    topic_code: "2.3"
  - front: Phase shift of y = sin(3x − π) by setting the inside to 0 → value
    back: |
      3x − π = 0 gives x = π/3: the cycle starts π/3 to the right.
    topic_code: "2.3"
  - front: Features of y = 2 sin(x − π/3) + 1 → amplitude, period, shift, midline
    back: |
      Amplitude 2, period 2π, π/3 right, midline y = 1; range [−1, 3].
    topic_code: "2.3"
  - front: Key points of y = 2 sin(x − π/3) + 1 → one cycle
    back: |
      (π/3, 1), (5π/6, 3), (4π/3, 1), (11π/6, −1), (7π/3, 1).
    topic_code: "2.3"
  - front: y = 3 cos(2x + π/2) − 1 in standard form → rewrite
    back: |
      y = 3 cos(2(x + π/4)) − 1: period π, π/4 left, midline −1, range [−4, 2].
    topic_code: "2.3"
  - front: Where a shifted cycle starts when sketching → x-value
    back: |
      At x = h (where the inside b(x − h) equals 0), not at x = 0. Then step by period ÷ 4.
    topic_code: "2.3"
  - front: Midline of y = 6 sin(x − π) − 4 → equation
    back: |
      y = −4. The vertical shift k is the midline; the max is 2 and the min −10.
    topic_code: "2.3"
  - front: Maximum and minimum of y = −5 cos(x/2) + 8 → values
    back: |
      Max 8 + 5 = 13, min 8 − 5 = 3. The negative a changes where they occur, not their values.
    topic_code: "2.3"
  - front: Midline from a graph with max M and min m → formula
    back: |
      k = (M + m)/2.
    topic_code: "2.4"
  - front: Amplitude from a graph with max M and min m → formula
    back: |
      |a| = (M − m)/2.
    topic_code: "2.4"
  - front: Period from a maximum at x₁ and the next minimum at x₂ → formula
    back: |
      Period = 2(x₂ − x₁): max to next min is half a cycle.
    topic_code: "2.4"
  - front: Choosing h for a cosine model → which point
    back: |
      The x-value of any maximum (with a > 0), or of any minimum with a < 0.
    topic_code: "2.4"
  - front: Choosing h for a sine model → which point
    back: |
      The x-value where the graph crosses the midline going up (with a > 0), a quarter period before a maximum.
    topic_code: "2.4"
  - front: Max (1, 7), next min (4, −1) → cosine equation
    back: |
      Midline 3, amplitude 4, period 6, b = π/3: y = 4 cos((π/3)(x − 1)) + 3.
    topic_code: "2.4"
  - front: Max (1, 7), next min (4, −1) → sine equation
    back: |
      Upward midline crossing at x = 1 − 1.5 = −0.5: y = 4 sin((π/3)(x + 0.5)) + 3.
    topic_code: "2.4"
  - front: Table with min −2 at x = 0 and max 4 at x = π/2 → cosine equation
    back: |
      Midline 1, amplitude 3, period π, starts at a minimum: y = −3 cos(2x) + 1.
    topic_code: "2.4"
  - front: 3 cos x as a shifted sine → equation
    back: |
      3 cos x = 3 sin(x + π/2): sine moved π/2 left starts at its maximum like cosine.
    topic_code: "2.4"
  - front: sin x as a shifted cosine → equation
    back: |
      sin x = cos(x − π/2): cosine moved π/2 right starts on the midline going up.
    topic_code: "2.4"
  - front: Why a sinusoid has infinitely many correct equations → reason
    back: |
      Any maximum can serve as h (shifts by whole periods), and a sign change on a moves the start to a minimum.
    topic_code: "2.4"
  - front: b from a period of 4π, written y = a cos(bx) + d with b > 0 → value
    back: |
      b = 2π/(4π) = 1/2.
    topic_code: "2.4"
  - front: Checking a written sinusoid equation → quickest test
    back: |
      Substitute the x of a known maximum or minimum and confirm the height; a wrong sign or shift shows at once.
    topic_code: "2.4"
  - front: Min (0, 2), next max (5, 12) → cosine equation
    back: |
      Midline 7, amplitude 5, period 10, b = π/5, starts at a minimum: y = −5 cos(πx/5) + 7.
    topic_code: "2.4"
  - front: Error-spot → "y = sin(2x − π/3) is sin(2x) moved π/3 right"
    back: |
      Factor first: 2(x − π/6). The shift is π/6 right.
    topic_code: "2.3"
  - front: Error-spot → "max 9 and min 1 give midline 4 and amplitude 8"
    back: |
      Midline (9 + 1)/2 = 5; amplitude (9 − 1)/2 = 4. 8 is the full height.
    topic_code: "2.4"
  - front: Error-spot → "max at x = 2, next min at x = 5, so the period is 3"
    back: |
      Max to next min is half a period: the period is 2 · 3 = 6.
    topic_code: "2.4"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 2.3 and 2.4: phase shift, vertical shift,
    factoring out b, midline and range, and writing sinusoids from graphs and tables), with about a third
    reviewing week 7 (amplitude, period, the cosine graph) and Unit 1 (the unit circle, angular speed, the
    Pythagorean identities, functions of any angle, solving a right triangle). Includes a shared-context set on
    h(x) = 2 cos(3x − π) + 5. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by
    your teacher against the scoring notes. Angles are in radians unless an item says degrees. Items marked
    (Calculator.) need a calculator; the rest are designed to be done by hand.
  questions:
    # ---- Stimulus set: a shifted cosine (2.3)
    - slug: trig-u02-w08-q01
      type: multiple_choice
      topic_code: "2.3"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      stimulus: |
        Let h(x) = 2 cos(3x − π) + 5, with x in radians.
      prompt: |
        What is the horizontal shift of the graph of h relative to the graph of y = 2 cos(3x) + 5?
      options:
        - "π to the right"
        - "π/3 to the left"
        - "π/3 to the right"
        - "3π to the right"
      option_explanations:
        - |
          π is the constant c in 3x − π; the shift is c/b, found by factoring 3 out of the inside.
        - |
          The size is right, but 3(x − π/3) has a minus sign inside, which moves the graph to the right.
        - |
          Correct. 3x − π = 3(x − π/3), so the graph of y = 2 cos(3x) + 5 is moved π/3 to the right.
        - |
          3π multiplies c by b instead of dividing; the inside is 0 when x = π/3, not 3π.
      answer: 2
    - slug: trig-u02-w08-q02
      type: multiple_choice
      topic_code: "2.3"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      stimulus: |
        Let h(x) = 2 cos(3x − π) + 5, with x in radians.
      prompt: |
        What is the range of h?
      options:
        - "[3, 7]"
        - "[−2, 2]"
        - "[1, 9]"
        - "[5, 7]"
      option_explanations:
        - |
          Correct. The midline is y = 5 and the amplitude is 2, so h runs from 5 − 2 = 3 to 5 + 2 = 7.
        - |
          [−2, 2] is the range of 2 cos(3x − π) before the vertical shift of +5 is applied.
        - |
          This uses 4 as the amplitude, treating the full height 2 · 2 as the distance from the midline.
        - |
          This treats 5 as the minimum; the midline is halfway between the minimum and maximum, so values also fall below 5.
      answer: 0
    - slug: trig-u02-w08-q03
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      stimulus: |
        Let h(x) = 2 cos(3x − π) + 5, with x in radians.
      prompt: |
        What is the period of h?
      options:
        - "2π"
        - "6π"
        - "π/3"
        - "2π/3"
      option_explanations:
        - |
          2π is the period of cos x; the factor 3 on x shortens it.
        - |
          6π multiplies 2π by b; a larger b means a shorter period, 2π/b.
        - |
          π/3 is the phase shift, which moves the graph without changing how long a cycle takes.
        - |
          Correct. The period is 2π/|b| = 2π/3; the shift and the +5 do not change it.
      answer: 3
    - slug: trig-u02-w08-q04
      type: multiple_choice
      topic_code: "2.3"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      stimulus: |
        Let h(x) = 2 cos(3x − π) + 5, with x in radians.
      prompt: |
        What is the value of h(0)?
      options:
        - "7"
        - "3"
        - "5"
        - "−2"
      option_explanations:
        - |
          7 would need cos(−π) = 1, but cos(−π) = cos π = −1; 7 is the maximum, reached at x = π/3.
        - |
          Correct. h(0) = 2 cos(−π) + 5 = 2(−1) + 5 = 3, the minimum value of h.
        - |
          5 is the midline, which h reaches where the cosine is 0, not at x = 0.
        - |
          −2 is 2 cos(−π), but the vertical shift +5 has been left off.
      answer: 1
    # ---- Topics 2.3 and 2.4
    - slug: trig-u02-w08-q05
      type: multiple_choice
      topic_code: "2.3"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        What is the phase shift of y = sin(4x + π)?
      options:
        - "π to the left"
        - "π/4 to the left"
        - "π/4 to the right"
        - "4π to the left"
      option_explanations:
        - |
          π is the constant inside, but the 4 must be factored out first: 4x + π = 4(x + π/4).
        - |
          Correct. 4x + π = 4(x + π/4), so the graph of sin(4x) moves π/4 to the left.
        - |
          The size is right, but x + π/4 means the input reaches 0 at x = −π/4, a shift to the left.
        - |
          4π multiplies instead of dividing by b; setting 4x + π = 0 gives x = −π/4.
      answer: 1
    - slug: trig-u02-w08-q06
      type: multiple_choice
      topic_code: "2.4"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        A sinusoid has maximum value 9 and minimum value 1. What are its amplitude and midline?
      options:
        - "amplitude 8, midline y = 5"
        - "amplitude 4, midline y = 4"
        - "amplitude 5, midline y = 4"
        - "amplitude 4, midline y = 5"
      option_explanations:
        - |
          The midline is right, but 8 is the full height from minimum to maximum; the amplitude is half of it.
        - |
          The amplitude is right, but the midline is the average of 9 and 1, which is 5, not their difference halved.
        - |
          These two numbers are swapped: (9 − 1)/2 = 4 is the amplitude and (9 + 1)/2 = 5 is the midline.
        - |
          Correct. Amplitude (9 − 1)/2 = 4 and midline (9 + 1)/2 = 5.
      answer: 3
    - slug: trig-u02-w08-q07
      type: multiple_choice
      topic_code: "2.4"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        Which equation has a maximum at (0, 6), midline y = 2 and period π?
      options:
        - "y = 4 cos(2x) + 2"
        - "y = 6 cos(2x) + 2"
        - "y = 4 sin(2x) + 2"
        - "y = 4 cos(x/2) + 2"
      option_explanations:
        - |
          Correct. Amplitude 6 − 2 = 4, b = 2π/π = 2, and cosine with a > 0 has its maximum at x = 0: y(0) = 4 + 2 = 6.
        - |
          This puts the maximum at 6 + 2 = 8; the amplitude is the distance from the midline, 6 − 2 = 4.
        - |
          Sine starts on the midline, so y(0) = 2, not the maximum 6.
        - |
          b = 1/2 gives period 4π; period π needs b = 2.
      answer: 0
    - slug: trig-u02-w08-q08
      type: multiple_choice
      topic_code: "2.4"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        Which equation describes the same function as y = 3 cos x?
      options:
        - "y = 3 sin(x − π/2)"
        - "y = −3 sin x"
        - "y = 3 sin(x + π/2)"
        - "y = 3 cos(x + π/2)"
      option_explanations:
        - |
          Sine moved π/2 to the right is at its minimum at x = 0: 3 sin(−π/2) = −3, so this is −3 cos x.
        - |
          −3 sin x is 0 at x = 0, but 3 cos 0 = 3; the graphs start at different heights.
        - |
          Correct. Moving sine π/2 to the left puts its maximum at x = 0, which is the cosine graph: 3 sin(π/2) = 3 = 3 cos 0.
        - |
          Cosine moved π/2 to the left gives −3 sin x, which is 0 at x = 0, not 3.
      answer: 2
    # ---- Spiral review (week 7 and Unit 1)
    - slug: trig-u02-w08-q09
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        What is the period of y = −2 sin(πx/5)?
      options:
        - "10"
        - "10π"
        - "5"
        - "2π²/5"
      option_explanations:
        - |
          Correct. The period is 2π ÷ (π/5) = 2π · 5/π = 10.
        - |
          10π divides 2π by 1/5 and ignores the π in b = π/5.
        - |
          5 is half a period; dividing 2π by π/5 gives 10, not 5.
        - |
          2π²/5 multiplies 2π by b instead of dividing by it.
      answer: 0
    - slug: trig-u02-w08-q10
      type: multiple_choice
      topic_code: "2.1"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      prompt: |
        On [0, 2π], at which x does y = cos x reach its minimum value?
      options:
        - "0"
        - "π/2"
        - "π"
        - "3π/2"
      option_explanations:
        - |
          At x = 0 the point on the unit circle is (1, 0), so cos 0 = 1, its maximum value, not its minimum.
        - |
          At x = π/2, cos x = 0, a zero of the graph.
        - |
          Correct. At x = π the point on the unit circle is (−1, 0), so cos π = −1, the minimum.
        - |
          3π/2 is where sine has its minimum; cos(3π/2) = 0.
      answer: 2
    - slug: trig-u02-w08-q11
      type: multiple_choice
      topic_code: "1.11"
      source: "Original item; Common Core HSF-TF.A.3"
      points: 1
      prompt: |
        Which point is on the unit circle at the terminal side of the angle 5π/4?
      options:
        - "(√2/2, √2/2)"
        - "(−√2/2, √2/2)"
        - "(√2/2, −√2/2)"
        - "(−√2/2, −√2/2)"
      option_explanations:
        - |
          This is the point for π/4, in quadrant I; 5π/4 is half a turn further.
        - |
          This is the point for 3π/4, in quadrant II, where only cosine is negative.
        - |
          This is the point for 7π/4, in quadrant IV, where only sine is negative.
        - |
          Correct. 5π/4 is in quadrant III with reference angle π/4, so both coordinates are −√2/2.
      answer: 3
    - slug: trig-u02-w08-q12
      type: multiple_choice
      topic_code: "1.8"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 1
      prompt: |
        A hypothetical wheel of radius 0.4 m turns at 150 revolutions per minute. What is the linear speed of a point on its rim?
      options:
        - "60 m/min"
        - "120π m/min"
        - "60π m/min"
        - "300π m/min"
      option_explanations:
        - |
          This multiplies the radius by revolutions per minute; one revolution is 2π radians, so ω = 300π rad/min.
        - |
          Correct. ω = 150 · 2π = 300π rad/min and v = rω = 0.4 · 300π = 120π ≈ 377 m/min.
        - |
          This converts each revolution to π radians; a full revolution is 2π radians.
        - |
          300π rad/min is the angular speed; the linear speed multiplies it by the radius 0.4 m.
      answer: 1
    - slug: trig-u02-w08-q13
      type: multi_select
      topic_code: "2.3"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 2
      partial_credit: true
      prompt: |
        For y = −4 sin(2x − π/2) − 3, with x in radians, which statements are true? Select all that apply.
      options:
        - "The phase shift is π/2 to the right."
        - "The midline is y = −3."
        - "The range is [−7, 1]."
        - "The period is π."
        - "The amplitude is −4."
      option_explanations:
        - |
          Factor first: 2x − π/2 = 2(x − π/4), so the phase shift is π/4 to the right.
        - |
          Correct. The vertical shift −3 is the midline.
        - |
          Correct. The amplitude 4 above and below the midline −3 gives [−7, 1].
        - |
          Correct. The period is 2π/|b| = 2π/2 = π; the shift and the reflection do not change it.
        - |
          Amplitude is a distance, |−4| = 4; the minus sign reflects the graph across its midline.
      answer: [1, 2, 3]
    - slug: trig-u02-w08-q14
      type: multi_select
      topic_code: "1.12"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 2
      partial_credit: true
      prompt: |
        Which of these equations hold for every real x at which both sides are defined? Select all that apply.
      options:
        - "1 + tan²x = sec²x"
        - "sin(−x) = sin x"
        - "cos²x = 1 − sin²x"
        - "1 + sec²x = tan²x"
        - "cot²x − 1 = csc²x"
      option_explanations:
        - |
          Correct. Dividing sin²x + cos²x = 1 by cos²x gives tan²x + 1 = sec²x.
        - |
          Sine is odd: sin(−x) = −sin x. For example sin(−π/2) = −1, not 1.
        - |
          Correct. This is sin²x + cos²x = 1 solved for cos²x.
        - |
          The terms are in the wrong places; the identity is 1 + tan²x = sec²x, and here x = 0 gives 2 = 0.
        - |
          Dividing sin²x + cos²x = 1 by sin²x gives 1 + cot²x = csc²x, with a plus sign.
      answer: [0, 2]
    - slug: trig-u02-w08-q15
      type: true_false
      topic_code: "2.3"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        True or false: The graph of y = sin(2x − π/3) is the graph of y = sin(2x) shifted π/3 units to the right.
      answer: false
      explanation: |
        False. Factor out b: 2x − π/3 = 2(x − π/6), so the shift is π/6 to the right. Equivalently, the inside is 0 when x = π/6.
    - slug: trig-u02-w08-q16
      type: true_false
      topic_code: "1.9"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      prompt: |
        True or false: If the terminal side of θ in standard position passes through (−5, 12), then cos θ = −5/13.
      answer: true
      explanation: |
        True. r = √((−5)² + 12²) = √169 = 13, and cos θ = x/r = −5/13. The angle is in quadrant II, where cosine is negative.
    - slug: trig-u02-w08-q17
      type: fill_blank
      topic_code: "2.3"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        The midline of the graph of y = 6 sin(x − π) − 4 is the line y = ____.
      answer: ["−4", "-4", "− 4", "- 4"]
      explanation: |
        The vertical shift k = −4 is the midline. The graph runs from −4 − 6 = −10 to −4 + 6 = 2; the phase shift π does not affect the midline.
    - slug: trig-u02-w08-q18
      type: fill_blank
      topic_code: "2.2"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        A sinusoid has period 4π. If it is written as y = a cos(bx) + d with b > 0, then b = ____.
      answer: ["1/2", "0.5", ".5", "0.50", "1 / 2"]
      explanation: |
        The period is 2π/b = 4π, so b = 2π/(4π) = 1/2.
    - slug: trig-u02-w08-q19
      type: numeric
      topic_code: "2.3"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        (Calculator.) Let f(x) = 3 sin(2(x − 0.4)) + 1, with x in radians. Find f(1) to the nearest hundredth.
      answer: { value: 3.80, tolerance: 0.01 }
      explanation: |
        f(1) = 3 sin(2 · 0.6) + 1 = 3 sin(1.2) + 1 ≈ 3(0.9320) + 1 ≈ 3.796, which is 3.80. The calculator must be in radian mode.
    - slug: trig-u02-w08-q20
      type: numeric
      topic_code: "1.5"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        (Calculator.) A right triangle has legs of length 7 and 11. Find the measure of its smallest angle to the nearest tenth of a degree.
      answer: { value: 32.5, tolerance: 0.1 }
      explanation: |
        The smallest angle is opposite the shortest leg, 7, with the leg 11 adjacent: tan θ = 7/11, so θ = tan⁻¹(7/11) ≈ 32.47°, which is 32.5°.
    - slug: trig-u02-w08-q21
      type: short_answer
      topic_code: "2.4"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 3
      prompt: |
        The table gives values of a sinusoid f.

        | x | 0 | 1 | 2 | 3 | 4 |
        |---|---|---|---|---|---|
        | f(x) | 5 | 2 | −1 | 2 | 5 |

        (a) Find the amplitude, the midline and the period of f.
        (b) Write an equation for f using cosine.
        (c) Write an equation for f using sine.
      answer: |
        (a) The maximum is 5 (at x = 0 and 4) and the minimum is −1 (at x = 2). Amplitude (5 − (−1))/2 = 3, midline y = (5 + (−1))/2 = 2, period 4 (from one maximum to the next).
        (b) b = 2π/4 = π/2, maximum at x = 0: f(x) = 3 cos(πx/2) + 2.
        (c) The graph crosses the midline going up at x = 3 (from −1 at x = 2 to 5 at x = 4): f(x) = 3 sin((π/2)(x − 3)) + 2. Check x = 0: 3 sin(−3π/2) + 2 = 3 + 2 = 5.
      explanation: |
        Three points, one per part. (a) amplitude 3, midline y = 2 and period 4. (b) 3 cos(πx/2) + 2 or any equivalent cosine form. (c) any correct sine form, such as 3 sin((π/2)(x − 3)) + 2, 3 sin((π/2)(x + 1)) + 2 or −3 sin((π/2)(x − 1)) + 2.
