      prompt: |
        Let p(x) = −2 cos(x/2 + π/4) + 1, with x in radians.

        (a) Find the amplitude, the period and the phase shift of p.
        (b) Find the midline and the range of p.
        (c) Find the smallest positive x at which p reaches its maximum value, and state that maximum value.
      answer: |
        (a) Factor: x/2 + π/4 = (1/2)(x + π/2). Amplitude 2, period 2π ÷ (1/2) = 4π, phase shift π/2 to the left.
        (b) Midline y = 1; range [1 − 2, 1 + 2] = [−1, 3].
        (c) Because a = −2 < 0, the maximum occurs where cos(x/2 + π/4) = −1, that is x/2 + π/4 = π + 2kπ, so x = 3π/2 + 4kπ. The smallest positive value is x = 3π/2, where p = −2(−1) + 1 = 3.
      explanation: |
        Three points, one per part. (a) amplitude 2, period 4π and phase shift π/2 left (all three needed). (b) midline y = 1 and range [−1, 3]. (c) x = 3π/2 and maximum value 3.
