      prompt: |
        The graph of a sinusoid f, with x in radians, has a maximum at (π/6, 5) and the next minimum at (2π/3, −1).

        (A) (i) Find the amplitude, the midline and the period of f.
        (ii) Find b > 0 for an equation of the form a cos(b(x − h)) + k.

        (B) (i) Write an equation for f using cosine.
        (ii) Write an equation for f using sine, and rewrite it in the form a sin(bx + c) + d.

        (C) (i) Find f(0) exactly, using either of your equations.
        (ii) A classmate reads the sine equation 3 sin(2x + π/6) + 2 and says its phase shift is π/6 to the left. Explain the error and give the correct phase shift.
      answer: |
        (A) (i) Amplitude (5 − (−1))/2 = 3; midline y = (5 + (−1))/2 = 2; maximum to next minimum is half a period, 2π/3 − π/6 = π/2, so the period is π.
        (ii) b = 2π/π = 2.
        (B) (i) Starting at the maximum: f(x) = 3 cos(2(x − π/6)) + 2.
        (ii) The upward midline crossing is a quarter period (π/4) before the maximum: π/6 − π/4 = −π/12. So f(x) = 3 sin(2(x + π/12)) + 2 = 3 sin(2x + π/6) + 2.
        (C) (i) f(0) = 3 cos(−π/3) + 2 = 3 · 1/2 + 2 = 7/2 (and 3 sin(π/6) + 2 = 7/2 agrees).
        (ii) The constant π/6 is not the phase shift because b = 2 has not been factored out. 2x + π/6 = 2(x + π/12), so the phase shift is π/12 to the left.
      explanation: |
        Six points. (A) 1 point for amplitude 3, midline y = 2 and period π; 1 point for b = 2. (B) 1 point for a correct cosine equation; 1 point for a correct sine equation and its expanded form 3 sin(2x + π/6) + 2 (accept equivalent forms that check at the maximum). (C) 1 point for f(0) = 7/2; 1 point for identifying the unfactored b and giving π/12 to the left.
