week: 11
unit: 2
title: "Inverse Trigonometric Functions"
topics: ["2.9", "2.10"]
guide: guides/week-11.md
guide_description: |
  Why sine, cosine and tangent are not one-to-one, the restricted domains that fix this, and the domains,
  ranges and graphs of sin⁻¹, cos⁻¹ and tan⁻¹; exact and calculator values, always inside the range; then
  compositions: when sin(sin⁻¹ x) and sin⁻¹(sin θ) return their inputs, reference triangles for expressions
  like cos(tan⁻¹(−5/12)), and algebraic forms such as tan(sin⁻¹ x) = x/√(1 − x²). Worked examples: four exact
  values, three inverse-after-function compositions, two triangle evaluations, two algebraic expressions, a
  hypothetical rocket's angle of elevation, and both solutions of sin x = 0.3.
flashcards_description: |
  32 cards on restricted domains, the domains, ranges and graphs of the inverse functions, exact values,
  compositions in both orders, reference triangles with signs, and algebraic expressions.

flashcards:
  - front: Why y = sin x has no inverse on all reals → reason
    back: |
      It is not one-to-one: sin(π/6) = sin(5π/6) = sin(13π/6) = 1/2, so a horizontal line meets the graph infinitely often.
    topic_code: "2.9"
  - front: Three requirements for a restricted domain → list
    back: |
      Always increasing or always decreasing there; takes every output value once; contains the angles from 0 to π/2.
    topic_code: "2.9"
  - front: Restricted domain of sine for sin⁻¹ → interval
    back: |
      [−π/2, π/2], where sine increases from −1 to 1.
    topic_code: "2.9"
  - front: Restricted domain of cosine for cos⁻¹ → interval
    back: |
      [0, π], where cosine decreases from 1 to −1.
    topic_code: "2.9"
  - front: Why cos⁻¹ cannot use [−π/2, π/2] → reason
    back: |
      On that interval cos(−θ) = cos θ, so cosine repeats values, and it is never negative there.
    topic_code: "2.9"
  - front: Domain and range of y = sin⁻¹ x → state them
    back: |
      Domain [−1, 1]; range [−π/2, π/2].
    topic_code: "2.9"
  - front: Domain and range of y = cos⁻¹ x → state them
    back: |
      Domain [−1, 1]; range [0, π].
    topic_code: "2.9"
  - front: Domain and range of y = tan⁻¹ x → state them
    back: |
      Domain all real numbers; range (−π/2, π/2), open at both ends.
    topic_code: "2.9"
  - front: Which half of the unit circle each inverse answers on → sin⁻¹, cos⁻¹, tan⁻¹
    back: |
      sin⁻¹ and tan⁻¹: the right half (quadrants I and IV). cos⁻¹: the top half (quadrants I and II).
    topic_code: "2.9"
  - front: Graph of y = sin⁻¹ x → endpoints and shape
    back: |
      Rises from (−1, −π/2) through (0, 0) to (1, π/2); an odd function.
    topic_code: "2.9"
  - front: Graph of y = cos⁻¹ x → three key points
    back: |
      (−1, π), (0, π/2), (1, 0): decreasing, neither odd nor even.
    topic_code: "2.9"
  - front: Horizontal asymptotes of y = tan⁻¹ x → equations and origin
    back: |
      y = −π/2 and y = π/2: tangent's vertical asymptotes, reflected across y = x.
    topic_code: "2.9"
  - front: cos⁻¹(−1/2) → value and why not 4π/3
    back: |
      2π/3. The answer must be in [0, π]; 4π/3 has the same cosine but is outside the range.
    topic_code: "2.9"
  - front: tan⁻¹(−1) → value and why not 3π/4
    back: |
      −π/4. The range is (−π/2, π/2), so a negative input gives a quadrant IV angle written as a negative.
    topic_code: "2.9"
  - front: sin⁻¹(√3/2) and sin⁻¹(−√2/2) → values
    back: |
      π/3 and −π/4.
    topic_code: "2.9"
  - front: cos⁻¹(−√3/2) → value
    back: |
      5π/6: quadrant II, reference angle π/6.
    topic_code: "2.9"
  - front: sin⁻¹(1.3) on a calculator → result and reason
    back: |
      An error: no angle has sine 1.3, because the domain of sin⁻¹ is [−1, 1].
    topic_code: "2.9"
  - front: cos⁻¹(−0.4) in radian mode → value
    back: |
      ≈ 1.982, a quadrant II angle, as every cos⁻¹ of a negative input is.
    topic_code: "2.9"
  - front: Rocket h km up, observer 5 km away → angle as a function of h
    back: |
      θ(h) = tan⁻¹(h/5). θ(8) ≈ 1.012; θ approaches π/2 but never reaches it.
    topic_code: "2.9"
  - front: sin x = 0.3 on [0, 2π) → both solutions
    back: |
      sin⁻¹(0.3) ≈ 0.305 and π − 0.305 ≈ 2.837. The inverse gives only the first.
    topic_code: "2.9"
  - front: sin(sin⁻¹ x) → when it equals x
    back: |
      For every x in [−1, 1]. Same for cos(cos⁻¹ x); tan(tan⁻¹ x) = x for all x.
    topic_code: "2.10"
  - front: sin⁻¹(sin θ) → when it equals θ
    back: |
      Only for θ in [−π/2, π/2]. Otherwise evaluate sin θ first, then take sin⁻¹.
    topic_code: "2.10"
  - front: sin⁻¹(sin(2π/3)) → value
    back: |
      sin(2π/3) = √3/2 and sin⁻¹(√3/2) = π/3.
    topic_code: "2.10"
  - front: tan⁻¹(tan(5π/6)) → value
    back: |
      tan(5π/6) = −√3/3, so −π/6 (which is 5π/6 − π).
    topic_code: "2.10"
  - front: cos⁻¹(cos(4π/3)) → value
    back: |
      cos(4π/3) = −1/2 and cos⁻¹(−1/2) = 2π/3.
    topic_code: "2.10"
  - front: cos(tan⁻¹(−5/12)) → value with a triangle
    back: |
      Quadrant IV, x = 12, y = −5, r = 13: cos = 12/13.
    topic_code: "2.10"
  - front: sin(cos⁻¹(−3/5)) → value and sign reason
    back: |
      4/5. cos⁻¹ answers on the top half of the circle, where y (and so sine) is never negative.
    topic_code: "2.10"
  - front: tan(sin⁻¹ x) → algebraic expression
    back: |
      x/√(1 − x²) for −1 < x < 1 (opposite x, hypotenuse 1, adjacent √(1 − x²)).
    topic_code: "2.10"
  - front: cos(tan⁻¹ x) → algebraic expression
    back: |
      1/√(1 + x²), positive for every x (opposite x, adjacent 1, hypotenuse √(1 + x²)).
    topic_code: "2.10"
  - front: Error-spot → "sin⁻¹(sin(5π/6)) = 5π/6"
    back: |
      5π/6 is outside [−π/2, π/2]. sin(5π/6) = 1/2, so the value is π/6.
    topic_code: "2.10"
  - front: Error-spot → "cos(sin⁻¹(−0.6)) = −0.8"
    back: |
      sin⁻¹(−0.6) is in quadrant IV, where cosine is positive: the value is 0.8.
    topic_code: "2.10"
  - front: Error-spot → "sin⁻¹ x is the same as 1/sin x"
    back: |
      The −1 marks the inverse function. 1/sin x is csc x.
    topic_code: "2.9"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 2.9 and 2.10: restricted domains, ranges and
    graphs of the inverse functions, exact and calculator values, compositions, reference triangles and
    algebraic expressions), with a third reviewing weeks 3, 6 and 8–10 (right-triangle angles, exact values,
    tangent period, writing sinusoids, models and harmonic motion). Includes a shared-context set on
    θ = tan⁻¹(−4/3). Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes. Items marked (Calculator.) need a calculator in radian mode; the rest are
    designed to be done by hand.
  questions:
    # ---- Stimulus set: one inverse tangent value (2.9, 2.10)
    - slug: trig-u02-w11-q01
      type: multiple_choice
      topic_code: "2.9"
      source: "Original item; Common Core HSF-TF.B.6"
      points: 1
      stimulus: |
        Let θ = tan⁻¹(−4/3), in radians.
      prompt: |
        In which interval does θ lie?
      options:
        - "(0, π/2)"
        - "(π/2, π)"
        - "(−π/2, 0)"
        - "(3π/2, 2π)"
      option_explanations:
        - |
          A negative input gives a negative tangent, which never happens for angles in quadrant I.
        - |
          Quadrant II angles do have negative tangents, but tan⁻¹ only returns angles in (−π/2, π/2).
        - |
          Correct. The range of tan⁻¹ is (−π/2, π/2), and a negative tangent there means a quadrant IV angle, written as a negative.
        - |
          These angles are coterminal with the right answer, but tan⁻¹ returns the principal value, between −π/2 and π/2.
      answer: 2
    - slug: trig-u02-w11-q02
      type: multiple_choice
      topic_code: "2.10"
      source: "Original item; Common Core HSF-TF.B.6"
      points: 1
      stimulus: |
        Let θ = tan⁻¹(−4/3), in radians.
      prompt: |
        What is the exact value of cos θ?
      options:
        - "3/5"
        - "−3/5"
        - "4/5"
        - "−4/5"
      option_explanations:
        - |
          Correct. In quadrant IV take x = 3, y = −4, so r = 5 and cos θ = x/r = 3/5, positive in quadrant IV.
        - |
          Cosine is positive in quadrant IV; a negative cosine would put θ in quadrant II, outside the range of tan⁻¹.
        - |
          4/5 is |sin θ|, opposite over hypotenuse. Cosine uses the adjacent side, 3.
        - |
          This is sin θ, opposite over hypotenuse with the quadrant IV sign, not cos θ.
      answer: 0
    - slug: trig-u02-w11-q03
      type: multiple_choice
      topic_code: "2.10"
      source: "Original item; Common Core HSF-TF.B.6"
      points: 1
      stimulus: |
        Let θ = tan⁻¹(−4/3), in radians.
      prompt: |
        What is the exact value of sin θ?
      options:
        - "4/5"
        - "3/5"
        - "−3/5"
        - "−4/5"
      option_explanations:
        - |
          The size is right, but θ is in quadrant IV, where sine (the y-coordinate) is negative.
        - |
          3/5 uses the adjacent side; it is cos θ.
        - |
          This uses the adjacent side 3 with a negative sign; sine is opposite over hypotenuse, −4/5.
        - |
          Correct. With x = 3, y = −4 and r = 5, sin θ = y/r = −4/5.
      answer: 3
    - slug: trig-u02-w11-q04
      type: multiple_choice
      topic_code: "2.10"
      source: "Original item; Common Core HSF-TF.B.6"
      points: 1
      stimulus: |
        Let θ = tan⁻¹(−4/3), in radians.
      prompt: |
        Which expression equals cos⁻¹(cos θ)?
      options:
        - "θ"
        - "−θ"
        - "π − θ"
        - "π + θ"
      option_explanations:
        - |
          θ is negative, and cos⁻¹ never returns a negative angle, so cos⁻¹(cos θ) cannot be θ.
        - |
          Correct. cos θ = cos(−θ) = 3/5, and −θ ≈ 0.927 lies in [0, π], so cos⁻¹(cos θ) = −θ.
        - |
          π − θ is about 4.07, which is outside [0, π]; it cannot be a value of cos⁻¹.
        - |
          π + θ ≈ 2.21 is in [0, π], but its cosine is −3/5, the opposite of cos θ.
      answer: 1
    # ---- This week (2.9, 2.10)
    - slug: trig-u02-w11-q05
      type: multiple_choice
      topic_code: "2.9"
      source: "Original item; Common Core HSF-TF.B.6"
      points: 1
      prompt: |
        What is the exact value of cos⁻¹(−√3/2), in radians?
      options:
        - "−π/6"
        - "7π/6"
        - "5π/6"
        - "π/6"
      option_explanations:
        - |
          cos⁻¹ never returns a negative angle; its range is [0, π]. Also cos(−π/6) is positive.
        - |
          cos(7π/6) = −√3/2, but 7π/6 is in quadrant III, outside the range [0, π].
        - |
          Correct. In [0, π], a negative cosine means quadrant II; the reference angle is π/6, so the angle is 5π/6.
        - |
          π/6 has cosine +√3/2. The negative input needs a quadrant II angle.
      answer: 2
    - slug: trig-u02-w11-q06
      type: multiple_choice
      topic_code: "2.9"
      source: "Original item; Common Core HSF-TF.B.6"
      points: 1
      prompt: |
        What is the range of y = tan⁻¹ x?
      options:
        - "(−π/2, π/2)"
        - "[−π/2, π/2]"
        - "[0, π]"
        - "All real numbers"
      option_explanations:
        - |
          Correct. Tangent is restricted to (−π/2, π/2), open because tan(±π/2) is undefined; that interval becomes the range of tan⁻¹.
        - |
          The endpoints cannot be included: no number has tangent equal to tan(π/2), which does not exist.
        - |
          [0, π] is the range of cos⁻¹; tangent is undefined at π/2, in the middle of that interval.
        - |
          All real numbers is the domain of tan⁻¹ (and the range of tan), not its range.
      answer: 0
    - slug: trig-u02-w11-q07
      type: multiple_choice
      topic_code: "2.10"
      source: "Original item; Common Core HSF-TF.B.6"
      points: 1
      prompt: |
        What is the exact value of sin⁻¹(sin(7π/6))?
      options:
        - "7π/6"
        - "π/6"
        - "11π/6"
        - "−π/6"
      option_explanations:
        - |
          7π/6 is outside [−π/2, π/2], so sin⁻¹ cannot return it; the composition does not cancel here.
        - |
          π/6 has sine +1/2, but sin(7π/6) = −1/2.
        - |
          11π/6 has sine −1/2 but lies outside the range [−π/2, π/2]; the coterminal angle −π/6 is the value.
        - |
          Correct. sin(7π/6) = −1/2, and the angle in [−π/2, π/2] with sine −1/2 is −π/6.
      answer: 3
    - slug: trig-u02-w11-q08
      type: multiple_choice
      topic_code: "2.10"
      source: "Original item; Common Core HSF-TF.B.6"
      points: 1
      prompt: |
        For −1 < x < 1, which algebraic expression equals tan(sin⁻¹ x)?
      options:
        - "x/√(1 + x²)"
        - "x/√(1 − x²)"
        - "√(1 − x²)/x"
        - "1/√(1 − x²)"
      option_explanations:
        - |
          √(1 + x²) is the hypotenuse when tangent is x; here sine is x, so the hypotenuse is 1.
        - |
          Correct. Opposite x, hypotenuse 1, adjacent √(1 − x²), so tangent = x/√(1 − x²), with the sign of x as required.
        - |
          This is adjacent over opposite, the cotangent of the angle, not the tangent.
        - |
          This is hypotenuse over adjacent, the secant of sin⁻¹ x.
      answer: 1
    - slug: trig-u02-w11-q09
      type: multiple_choice
      topic_code: "1.5"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        (Calculator.) A hypothetical ramp rises 1.5 m over a horizontal run of 6 m. To three decimal places, what angle, in radians, does the ramp make with the horizontal?
      options:
        - "0.253"
        - "0.245"
        - "14.036"
        - "1.318"
      option_explanations:
        - |
          This is sin⁻¹(1.5/6), which treats the 6 m run as the hypotenuse. The run is the adjacent side.
        - |
          Correct. Rise over run is opposite over adjacent, so θ = tan⁻¹(1.5/6) = tan⁻¹(0.25) ≈ 0.245 radians.
        - |
          14.036 is the angle in degrees; the question asks for radians.
        - |
          This is cos⁻¹(0.25), which treats 0.25 as a cosine (adjacent over hypotenuse). But 0.25 is rise over run, opposite over adjacent, so it is a tangent.
      answer: 1
    # ---- Spiral review
    - slug: trig-u02-w11-q10
      type: multiple_choice
      topic_code: "2.7"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        A hypothetical buoy bobs between 0.8 m and 2.4 m above the sea floor and reaches its highest point every 6 seconds. It is at its highest at t = 0. Which model gives its height h in metres after t seconds?
      options:
        - "h = 1.6 + 1.6 cos(πt/3)"
        - "h = 1.6 + 0.8 cos(πt/6)"
        - "h = 1.6 + 0.8 cos(πt/3)"
        - "h = 0.8 + 1.6 cos(πt/3)"
      option_explanations:
        - |
          1.6 is the full swing, 2.4 − 0.8. The amplitude is half of it, 0.8.
        - |
          π/6 gives a period of 12 seconds; a 6-second period needs b = 2π/6 = π/3.
        - |
          Correct. Midline (2.4 + 0.8)/2 = 1.6, amplitude 0.8, b = π/3, and cosine starts at the maximum.
        - |
          Midline and amplitude are swapped; this model dips to −0.8 m, below the sea floor.
      answer: 2
    - slug: trig-u02-w11-q11
      type: multiple_choice
      topic_code: "2.8"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        What is the period of the motion d = 6 cos(5πt), t in seconds?
      options:
        - "2.5 s"
        - "5π s"
        - "6 s"
        - "0.4 s"
      option_explanations:
        - |
          2.5 is the frequency in hertz, ω/(2π). The period is its reciprocal.
        - |
          5π is ω, the angular frequency in radians per second; the period is 2π divided by ω.
        - |
          6 is the amplitude, the farthest distance from rest in the units of d, not a time.
        - |
          Correct. P = 2π/ω = 2π/(5π) = 0.4 s, so the motion repeats 2.5 times per second.
      answer: 3
    - slug: trig-u02-w11-q12
      type: multiple_choice
      topic_code: "2.4"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        A sinusoid, x in radians, has a maximum at (π/4, 3) and the next minimum at (3π/4, −1). Which equation describes it?
      options:
        - "y = 1 + 2 cos(2(x − π/4))"
        - "y = 1 + 2 cos(2x − π/4)"
        - "y = 1 + 2 cos(x − π/4)"
        - "y = 2 + cos(2(x − π/4))"
      option_explanations:
        - |
          Correct. Midline 1, amplitude 2, half-period π/2 so period π and b = 2, and the cosine peak is shifted to x = π/4.
        - |
          The shift was not factored: cos(2x − π/4) = cos(2(x − π/8)) peaks at x = π/8.
        - |
          b = 1 gives period 2π, so the minimum would be at 5π/4, not 3π/4.
        - |
          Midline 2 and amplitude 1 give a range of [1, 3]; the minimum must be −1.
      answer: 0
    - slug: trig-u02-w11-q13
      type: multiple_choice
      topic_code: "1.11"
      source: "Original item; Common Core HSF-TF.A.3"
      points: 1
      prompt: |
        What is the exact value of sin(−2π/3)?
      options:
        - "√3/2"
        - "−1/2"
        - "−√3/2"
        - "1/2"
      option_explanations:
        - |
          −2π/3 is in quadrant III, where sine is negative; sine is odd, so sin(−2π/3) = −sin(2π/3).
        - |
          −1/2 is cos(−2π/3), the x-coordinate; sine is the y-coordinate.
        - |
          Correct. sin(−2π/3) = −sin(2π/3) = −√3/2; the point is (−1/2, −√3/2).
        - |
          1/2 is the size of the cosine coordinate; the sine of the reference angle π/3 is √3/2, negative in quadrant III.
      answer: 2
    - slug: trig-u02-w11-q14
      type: multi_select
      topic_code: "2.9"
      source: "Original item; Common Core HSF-TF.B.6"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the domains, ranges and graphs of the inverse sine, cosine and tangent functions are true? Select all that apply.
      options:
        - "The domain of sin⁻¹ x is [−1, 1]."
        - "cos⁻¹ x returns a negative angle when x < 0."
        - "The graph of y = tan⁻¹ x has horizontal asymptotes y = −π/2 and y = π/2."
        - "sin⁻¹(1.5) ≈ 1.571"
        - "Cosine is decreasing on [0, π], so it has an inverse when restricted to that interval."
      option_explanations:
        - |
          Correct. Sine only takes values from −1 to 1, so those are the only inputs sin⁻¹ accepts.
        - |
          cos⁻¹ returns angles in [0, π]; a negative input gives an angle in quadrant II, between π/2 and π, still positive.
        - |
          Correct. Tangent's vertical asymptotes at ±π/2 become horizontal asymptotes of its inverse.
        - |
          No angle has sine 1.5, so sin⁻¹(1.5) is undefined. 1.571 ≈ π/2 is sin⁻¹(1).
        - |
          Correct. A function that is always decreasing on an interval is one-to-one there, which is what an inverse needs.
      answer: [0, 2, 4]
    - slug: trig-u02-w11-q15
      type: multi_select
      topic_code: "2.10"
      source: "Original item; Common Core HSF-TF.B.6"
      points: 2
      partial_credit: true
      prompt: |
        Which of these compositions return exactly the number they started with? Select all that apply.
      options:
        - "cos⁻¹(cos(3π/2)) = 3π/2"
        - "sin(sin⁻¹(0.4)) = 0.4"
        - "tan⁻¹(tan(π/5)) = π/5"
        - "cos(cos⁻¹(−0.9)) = −0.9"
        - "sin⁻¹(sin(3π/4)) = 3π/4"
      option_explanations:
        - |
          3π/2 is outside [0, π]. cos(3π/2) = 0 and cos⁻¹(0) = π/2.
        - |
          Correct. 0.4 is in [−1, 1], so sin⁻¹(0.4) exists and its sine is 0.4.
        - |
          Correct. π/5 is in (−π/2, π/2), the restricted domain of tangent, so tan⁻¹ undoes tan.
        - |
          Correct. −0.9 is in [−1, 1], and the cosine of the angle cos⁻¹ returns is the input.
        - |
          3π/4 is outside [−π/2, π/2]. sin(3π/4) = √2/2 and sin⁻¹(√2/2) = π/4.
      answer: [1, 2, 3]
    - slug: trig-u02-w11-q16
      type: true_false
      topic_code: "2.9"
      source: "Original item; Common Core HSF-TF.B.6"
      points: 1
      prompt: |
        True or false: The notation sin⁻¹ x means 1/sin x.
      answer: false
      explanation: |
        False. sin⁻¹ x is the inverse sine function, the angle in [−π/2, π/2] whose sine is x. The reciprocal 1/sin x is csc x. For example sin⁻¹(1) = π/2, but 1/sin(1) ≈ 1.188.
    - slug: trig-u02-w11-q17
      type: true_false
      topic_code: "2.8"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        True or false: The motion d = 3 sin(πt), with t in seconds, has a frequency of 0.5 Hz.
      answer: true
      explanation: |
        True. ω = π, so f = ω/(2π) = π/(2π) = 1/2 Hz. The period is 2 s: one back-and-forth cycle every 2 seconds.
    - slug: trig-u02-w11-q18
      type: fill_blank
      topic_code: "2.5"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        The period of y = tan(3x), x in radians, is ____.
      answer: ["π/3", "pi/3", "π / 3", "pi / 3", "(1/3)π", "1.047", "1.05"]
      explanation: |
        Tangent has period π, and the period of tan(bx) is π/|b| = π/3. (It is not 2π/3: that would use the period of sine.)
