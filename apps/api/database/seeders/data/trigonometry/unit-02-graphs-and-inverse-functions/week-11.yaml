    - slug: trig-u02-w11-q22
      type: short_answer
      topic_code: "2.10"
      source: "Original item; Common Core HSF-TF.B.6"
      points: 3
      prompt: |
        (a) Write cos(sin⁻¹ x) as an algebraic expression in x, for −1 ≤ x ≤ 1, and explain why no ± sign is needed.
        (b) Write tan(cos⁻¹ x) as an algebraic expression in x, for −1 ≤ x ≤ 1 with x ≠ 0.
        (c) Use your expression from (b) to find tan(cos⁻¹(−0.6)), and check that its sign matches the quadrant of cos⁻¹(−0.6).
      answer: |
        (a) Let θ = sin⁻¹ x: opposite x, hypotenuse 1, adjacent √(1 − x²), so cos(sin⁻¹ x) = √(1 − x²). θ is in [−π/2, π/2], where cosine is never negative, so the positive root is always right.
        (b) Let φ = cos⁻¹ x: adjacent x, hypotenuse 1, opposite √(1 − x²), so tan(cos⁻¹ x) = √(1 − x²)/x.
        (c) √(1 − 0.36)/(−0.6) = 0.8/(−0.6) = −4/3. cos⁻¹(−0.6) is in quadrant II (between π/2 and π), where tangent is negative, so the sign matches.
      explanation: |
        Three points, one per part. (a) √(1 − x²) with a reason based on the range [−π/2, π/2]. (b) √(1 − x²)/x. (c) −4/3 with the quadrant II check. Accept answers that reach (c) directly from a triangle if the sign is justified.
    - slug: trig-u02-w11-q23
      type: short_answer
      topic_code: "2.9"
      source: "Original item; Common Core HSF-TF.B.6"
      points: 3
      prompt: |
        (a) State the restricted domain used to define cos⁻¹, and give one reason [−π/2, π/2] would not work.
        (b) State the domain and range of y = cos⁻¹ x, and give the coordinates of the graph's two endpoints and the point where x = 0.
        (c) Find cos⁻¹(1/2) and cos⁻¹(−1/2) exactly, and show that their sum is π.
      answer: |
        (a) [0, π]. On [−π/2, π/2] cosine takes each positive value twice (cos(−θ) = cos θ) and never takes a negative value, so it is not one-to-one and misses half its outputs.
        (b) Domain [−1, 1], range [0, π]. Endpoints (−1, π) and (1, 0); the graph passes through (0, π/2).
        (c) cos⁻¹(1/2) = π/3 and cos⁻¹(−1/2) = 2π/3; π/3 + 2π/3 = π.
      explanation: |
        Three points, one per part. (a) [0, π] and a correct reason (not one-to-one, or never negative). (b) domain, range and all three points. (c) both values and the sum.
    - slug: trig-u02-w11-q24
      type: long_answer
      topic_code: "2.10"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 6
      prompt: |
        A hypothetical drone rises vertically from a point on level ground 120 m from an observer. When the drone is h metres high, the observer's angle of elevation to it is θ(h) = tan⁻¹(h/120), in radians.

        (A) (i) Find θ(120) exactly, and θ(200) to the nearest thousandth (calculator).
        (ii) Explain, in terms of the graph of tan⁻¹ and the context, why θ(h) < π/2 for every height h.

        (B) (i) Use a reference triangle to show that cos(θ(h)) = 120/√(h² + 14400).
        (ii) Find the exact values of cos θ and sin θ when h = 50.

        (C) (i) The observer's camera can tilt at most 1.2 radians above the horizontal. Using h = 120 tan θ, find the greatest height at which the camera can film the drone, to the nearest metre (calculator).
        (ii) A student claims tan⁻¹(tan 4) = 4. Explain why this is false, give the correct value to three decimal places, and explain why the same problem never arises for the camera's tilt angles 0 ≤ θ ≤ 1.2.
      answer: |
        (A) (i) θ(120) = tan⁻¹(1) = π/4. θ(200) = tan⁻¹(5/3) ≈ 1.030.
        (ii) The graph of y = tan⁻¹ x has horizontal asymptote y = π/2: as h → ∞, h/120 → ∞ and θ approaches π/2 without reaching it. In context, from 120 m away the drone is never directly overhead, however high it goes.
        (B) (i) θ is acute, with opposite side h and adjacent side 120, so the hypotenuse (the line of sight) is √(h² + 120²) = √(h² + 14400) and cos θ = 120/√(h² + 14400).
        (ii) √(2500 + 14400) = √16900 = 130, so cos θ = 120/130 = 12/13 and sin θ = 50/130 = 5/13.
        (C) (i) h = 120 tan(1.2) ≈ 308.66, so about 309 m.
        (ii) 4 is not in (−π/2, π/2), the range of tan⁻¹, so tan⁻¹ cannot return it. Tangent has period π, so tan 4 = tan(4 − π), and 4 − π ≈ 0.858 is in the range: tan⁻¹(tan 4) ≈ 0.858. The camera's angles 0 ≤ θ ≤ 1.2 all lie inside (−π/2, π/2) (1.2 < π/2 ≈ 1.571), so tan⁻¹(tan θ) = θ for each of them.
      explanation: |
        Six points. (A) 1 point for π/4 and 1.030; 1 point for the horizontal asymptote y = π/2 linked to the context. (B) 1 point for a correct triangle (sides h, 120, √(h² + 14400)) leading to the cosine; 1 point for 12/13 and 5/13. (C) 1 point for 309 m (accept 308.66); 1 point for explaining that 4 is outside the range, the value 0.858, and that the camera's angles lie in (−π/2, π/2).
