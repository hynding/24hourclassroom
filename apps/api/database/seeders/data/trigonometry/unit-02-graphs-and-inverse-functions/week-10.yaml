        (Calculator.) A hypothetical tide model gives the water depth at a dock as D(t) = 3 + 1.5 cos(πt/6) metres, t hours after midnight. To the nearest hundredth of an hour, when does the depth first fall to 2 m after midnight?
      answer: { value: 4.39, tolerance: 0.01 }
      explanation: |
        3 + 1.5 cos(πt/6) = 2 gives cos(πt/6) = −2/3. In radian mode cos⁻¹(−2/3) ≈ 2.3005, the first angle after 0 with that cosine, so πt/6 ≈ 2.3005 and t ≈ 6(2.3005)/π ≈ 4.39 hours (about 4:24 a.m.).
