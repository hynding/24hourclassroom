week: 10
unit: 2
title: "Sinusoidal Models and Harmonic Motion"
topics: ["2.7", "2.8"]
guide: guides/week-10.md
guide_description: |
  Building a sinusoidal model from a story: midline and amplitude from the maximum and minimum, b from the
  period, and cosine, −cosine or sine chosen to match the starting point; interpreting each parameter with
  units; finding when a quantity is above a level with an inverse function or a graph; then simple harmonic
  motion d = a sin ωt or a cos ωt, with period 2π/ω and frequency ω/(2π). Worked examples: a hypothetical
  Ferris wheel, a tide, hours of daylight, the time a rider spends above 45 m, a spring pulled down and
  released, and a tuning fork at 440 Hz.
flashcards_description: |
  31 cards on building sinusoidal models from a maximum, minimum, period and starting time, interpreting
  parameters in context, "when is it above…" questions, and simple harmonic motion, period and frequency.

flashcards:
  - front: Midline of a model with max 55 m and min 5 m → value
    back: |
      k = (55 + 5)/2 = 30 m, the average height.
    topic_code: "2.7"
  - front: Amplitude of a model with max 4.6 m and min 1.0 m → value
    back: |
      |a| = (4.6 − 1.0)/2 = 1.8 m. Half the full swing, never the whole of it.
    topic_code: "2.7"
  - front: b for a quantity repeating every 8 minutes → value
    back: |
      b = 2π/8 = π/4 (radians per minute).
    topic_code: "2.7"
  - front: High tide at 2:00, next low tide at 8:15 → the period
    back: |
      High to low is half a cycle, 6.25 hours, so the period is 12.5 hours.
    topic_code: "2.7"
  - front: Model starts at a maximum → which basic function
    back: |
      Cosine: a cos(b(t − h)) + k with h the time of the maximum.
    topic_code: "2.7"
  - front: Model starts at a minimum → which basic function
    back: |
      Negative cosine: k − |a| cos(b(t − h)), with h the time of the minimum (a Ferris wheel boarded at the bottom).
    topic_code: "2.7"
  - front: Model starts on the midline, rising → which basic function
    back: |
      Sine: |a| sin(b(t − h)) + k, with h the time of the rising midline crossing.
    topic_code: "2.7"
  - front: Ferris wheel, diameter 50 m, centre 30 m up, 8 min per turn, board at bottom → model
    back: |
      h(t) = 30 − 25 cos(πt/4), metres after t minutes.
    hint: Lowest point 5 m, highest 55 m.
    topic_code: "2.7"
  - front: h(t) = 30 − 25 cos(πt/4) at t = 2 → value and meaning
    back: |
      cos(π/2) = 0, so h = 30 m: a quarter turn after boarding the rider is level with the centre.
    topic_code: "2.7"
  - front: Tide, high 4.6 m at t = 2, low 1.0 m at t = 8.25 → model
    back: |
      D(t) = 2.8 + 1.8 cos(0.16π(t − 2)): midline 2.8, amplitude 1.8, period 12.5 h, maximum at t = 2.
    topic_code: "2.7"
  - front: Daylight model 12.1 + 3.1 cos(2π(t − 172)/365) → meaning of 172
    back: |
      The day of the year with the most daylight (15.2 hours), where the cosine starts its cycle.
    topic_code: "2.7"
  - front: Daylight model 12.1 + 3.1 cos(2π(t − 172)/365) → meaning of 3.1
    back: |
      The longest day has 3.1 hours more than the yearly average of 12.1 hours, and the shortest 3.1 hours fewer.
    topic_code: "2.7"
  - front: Two equations for the same wheel → why both earn credit
    back: |
      30 − 25 cos(πt/4) and 30 + 25 sin(π(t − 2)/4) agree at every t. Any equation matching max, min, period and start is correct.
    topic_code: "2.7"
  - front: "When is 30 − 25 cos(πt/4) above 45? → first step"
    back: |
      Set it equal to 45 and isolate: cos(πt/4) = −0.6. Then cos⁻¹ gives one angle and 2π minus it gives the other.
    topic_code: "2.7"
  - front: cos(πt/4) = −0.6 in the first cycle → the two times
    back: |
      πt/4 ≈ 2.214 or 2π − 2.214 ≈ 4.069, so t ≈ 2.82 and 5.18 (radian mode).
    topic_code: "2.7"
  - front: Deciding which side of the boundary times you want → method
    back: |
      Test a time between them, such as the time of the maximum, or look at the graph.
    topic_code: "2.7"
  - front: Simple harmonic motion → two standard equations
    back: |
      d = a sin ωt (starts at rest position) or d = a cos ωt (starts at an extreme), d measured from rest.
    topic_code: "2.8"
  - front: Period of d = a cos ωt → formula
    back: |
      P = 2π/ω, the time for one full back-and-forth cycle.
    topic_code: "2.8"
  - front: Frequency of d = a sin ωt → formula and unit
    back: |
      f = ω/(2π) = 1/P cycles per unit of time; cycles per second are hertz (Hz).
    topic_code: "2.8"
  - front: d = 0.4 sin(880πt), t in seconds → frequency
    back: |
      f = 880π/(2π) = 440 Hz; the period is 1/440 s.
    topic_code: "2.8"
  - front: d = 3 cos(6πt), t in seconds → period and frequency
    back: |
      Period 2π/(6π) = 1/3 s; frequency 3 Hz.
    topic_code: "2.8"
  - front: Spring pulled 6 cm down and released, period 1.5 s, up positive → equation
    back: |
      d(t) = −6 cos(4πt/3), since ω = 2π/1.5 = 4π/3.
    topic_code: "2.8"
  - front: d(t) = −6 cos(4πt/3) at t = 1 → position
    back: |
      −6 cos(4π/3) = −6(−1/2) = 3: 3 cm above rest.
    topic_code: "2.8"
  - front: Pendulum starting at rest position moving positive, 8 cm swing, 0.5 Hz → equation
    back: |
      ω = 2π(0.5) = π, so d = 8 sin(πt).
    topic_code: "2.8"
  - front: Frequency 2 Hz → ω
    back: |
      ω = 2πf = 4π radians per second.
    topic_code: "2.8"
  - front: Larger ω in d = a sin ωt → effect on period and frequency
    back: |
      Shorter period and higher frequency. Doubling ω halves the period and doubles the frequency.
    topic_code: "2.8"
  - front: Harmonic motion with no midline term → why
    back: |
      d is measured from the rest position, so the motion is centred on d = 0.
    topic_code: "2.8"
  - front: Wheel at 4 revolutions per minute → ω in radians per second
    back: |
      4 · 2π = 8π rad/min, and 8π/60 = 2π/15 rad/s. That ω is the b of the height model.
    topic_code: "2.8"
  - front: Error-spot → "Max 55, min 5, so the amplitude is 50"
    back: |
      50 is the full swing. The amplitude is half: 25.
    topic_code: "2.7"
  - front: Error-spot → "A 12-hour cycle has b = 12"
    back: |
      b = 2π/P = 2π/12 = π/6. The period is 12; b is not.
    topic_code: "2.7"
  - front: Error-spot → "d = 5 sin(4πt) has frequency 4π Hz"
    back: |
      4π is ω, in radians per second. The frequency is 4π/(2π) = 2 Hz.
    topic_code: "2.8"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 2.7 and 2.8: building and interpreting
    sinusoidal models, "when is it above…" questions, simple harmonic motion, period and frequency), with about
    a third reviewing weeks 4 and 7–9 (angular speed, zeros, amplitude and period, phase shift, writing
    sinusoids, tangent and secant graphs). Includes a shared-context set on a hypothetical Ferris wheel.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes. Items marked (Calculator.) need a calculator in radian mode; the rest are designed to be done by hand.
  questions:
    # ---- Stimulus set: a hypothetical Ferris wheel (2.7)
    - slug: trig-u02-w10-q01
      type: multiple_choice
      topic_code: "2.7"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      stimulus: |
        A hypothetical Ferris wheel has a diameter of 40 m, and its centre is 24 m above the ground. It turns at a constant rate, making one revolution every 10 minutes. A rider boards at the lowest point at t = 0. Let h(t) be the rider's height in metres t minutes after boarding.
      prompt: |
        Which function models h?
      options:
        - "h(t) = 24 + 20 cos(πt/5)"
        - "h(t) = 24 − 20 cos(πt/10)"
        - "h(t) = 24 − 20 cos(πt/5)"
        - "h(t) = 24 − 40 cos(πt/5)"
      option_explanations:
        - |
          This starts at h(0) = 44, the top of the wheel. The rider boards at the bottom, so the cosine must be negated.
        - |
          b = π/10 gives a period of 2π/(π/10) = 20 minutes, twice the time the wheel takes for one revolution.
        - |
          Correct. Midline 24, amplitude 20 (the radius), b = 2π/10 = π/5, and −cosine starts at the minimum: h(0) = 4 m.
        - |
          40 is the diameter. The amplitude is the radius, 20; this model would send the rider 16 m below the ground.
      answer: 2
    - slug: trig-u02-w10-q02
      type: multiple_choice
      topic_code: "2.7"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      stimulus: |
        A hypothetical Ferris wheel has a diameter of 40 m, and its centre is 24 m above the ground. It turns at a constant rate, making one revolution every 10 minutes. A rider boards at the lowest point at t = 0. Let h(t) be the rider's height in metres t minutes after boarding.
      prompt: |
        How high is the rider 2.5 minutes after boarding?
      options:
        - "4 m"
        - "24 m"
        - "44 m"
        - "34 m"
      option_explanations:
        - |
          4 m is the boarding height at t = 0. After 2.5 minutes the wheel has turned a quarter of a revolution.
        - |
          Correct. h(2.5) = 24 − 20 cos(π/2) = 24. A quarter turn after the bottom, the rider is level with the centre.
        - |
          44 m is the top of the wheel, reached after half a revolution, at t = 5 minutes.
        - |
          34 m is halfway between the centre and the top; the rider reaches it at t = 10/3, not at a quarter turn.
      answer: 1
    - slug: trig-u02-w10-q03
      type: multiple_choice
      topic_code: "2.7"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      stimulus: |
        A hypothetical Ferris wheel has a diameter of 40 m, and its centre is 24 m above the ground. It turns at a constant rate, making one revolution every 10 minutes. A rider boards at the lowest point at t = 0. Let h(t) be the rider's height in metres t minutes after boarding.
      prompt: |
        For how long during each revolution is the rider more than 34 m above the ground?
      options:
        - "5 minutes"
        - "20/3 minutes (6 minutes 40 seconds)"
        - "5/3 minutes (1 minute 40 seconds)"
        - "10/3 minutes (3 minutes 20 seconds)"
      option_explanations:
        - |
          The rider is above the centre, 24 m, for half of each turn (5 minutes). Above 34 m is a shorter stretch near the top.
        - |
          20/3 is the time the rider drops back to 34 m, a boundary time, not the length of the interval.
        - |
          5/3 minutes is only the time from 34 m up to the top at t = 5; the rider is also above 34 m on the way down.
        - |
          Correct. 24 − 20 cos(πt/5) > 34 means cos(πt/5) < −1/2, so 2π/3 < πt/5 < 4π/3 and 10/3 < t < 20/3: a span of 10/3 minutes.
      answer: 3
    - slug: trig-u02-w10-q04
      type: multiple_choice
      topic_code: "2.7"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      stimulus: |
        A hypothetical Ferris wheel has a diameter of 40 m, and its centre is 24 m above the ground. It turns at a constant rate, making one revolution every 10 minutes. A rider boards at the lowest point at t = 0. Let h(t) be the rider's height in metres t minutes after boarding.
      prompt: |
        What does the midline of the model, h = 24, represent in this context?
      options:
        - "The height of the centre of the wheel, which is also the rider's average height over a revolution"
        - "The radius of the wheel"
        - "The greatest height the rider reaches"
        - "The number of seconds the rider spends level with the centre"
      option_explanations:
        - |
          Correct. The midline is (44 + 4)/2 = 24 m, the centre's height; the rider spends equal time above and below it.
        - |
          The radius, 20 m, is the amplitude, the distance from the midline to the top or bottom.
        - |
          The greatest height is midline plus amplitude, 24 + 20 = 44 m.
        - |
          The midline is a height in metres, not a time; the rider only passes through 24 m twice each turn.
      answer: 0
    # ---- Harmonic motion and models (2.7, 2.8)
    - slug: trig-u02-w10-q05
      type: multiple_choice
      topic_code: "2.8"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        A point on a vibrating string has displacement d = 5 sin(4πt) millimetres, t in seconds. What is the frequency of the vibration?
      options:
        - "0.5 Hz"
        - "4π Hz"
        - "2 Hz"
        - "5 Hz"
      option_explanations:
        - |
          0.5 s is the period, 2π/(4π). The frequency is its reciprocal, the number of cycles per second.
        - |
          4π is ω, the angular frequency in radians per second. Divide by 2π to get cycles per second.
        - |
          Correct. f = ω/(2π) = 4π/(2π) = 2 cycles per second, that is 2 Hz.
        - |
          5 is the amplitude in millimetres; it says how far the point moves, not how often.
      answer: 2
    - slug: trig-u02-w10-q06
      type: multiple_choice
      topic_code: "2.8"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        A weight on a spring is lifted 10 cm above its rest position and released at t = 0. It returns to that highest point every 2 seconds. Taking up as positive, which equation gives its displacement d in centimetres after t seconds?
      options:
        - "d = 10 sin(πt)"
        - "d = −10 cos(πt)"
        - "d = 10 cos(2t)"
        - "d = 10 cos(πt)"
      option_explanations:
        - |
          Sine starts at d = 0, the rest position. This weight starts at its highest point, an extreme.
        - |
          The negative sign starts the weight 10 cm below rest; it was lifted above rest.
        - |
          ω = 2 gives a period of 2π/2 = π ≈ 3.14 s. A 2-second period needs ω = 2π/2 = π.
        - |
          Correct. Starting at the top means cosine with a = 10, and a period of 2 s means ω = 2π/2 = π.
      answer: 3
    - slug: trig-u02-w10-q07
      type: multiple_choice
      topic_code: "2.7"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        At a hypothetical pier, the water depth reaches a high of 5.0 m at 3:00 a.m. and the following low of 1.0 m at 9:00 a.m. Which function gives the depth D in metres t hours after midnight?
      options:
        - "D(t) = 3 + 2 cos(π(t − 3)/6)"
        - "D(t) = 3 + 2 cos(π(t − 3)/12)"
        - "D(t) = 3 + 2 cos(π(t + 3)/6)"
        - "D(t) = 2 + 3 cos(π(t − 3)/6)"
      option_explanations:
        - |
          Correct. Midline 3, amplitude 2, and high to low in 6 hours is half a period, so P = 12 and b = π/6; the maximum is at t = 3.
        - |
          π/12 gives a period of 24 hours, treating the 6 hours from high to low as a quarter cycle.
        - |
          (t + 3) puts a maximum at t = −3, and so at t = 9 as well, which is the time of low tide.
        - |
          Midline and amplitude are swapped: this model runs from −1 m to 5 m.
      answer: 0
    - slug: trig-u02-w10-q08
      type: multiple_choice
      topic_code: "2.7"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        A hypothetical model gives the hours of daylight in a city as L(t) = 12.3 + 2.9 cos(2π(t − 170)/365), where t is the day of the year. Which statement interprets the number 2.9 correctly?
      options:
        - "The shortest day of the year has 2.9 hours of daylight."
        - "Over the whole year, daylight varies by a total of 2.9 hours."
        - "On the longest day, daylight is 2.9 hours more than the yearly average of 12.3 hours."
        - "Daylight changes by 2.9 hours from one day to the next."
      option_explanations:
        - |
          The shortest day has 12.3 − 2.9 = 9.4 hours. The amplitude is a distance from the midline, not a daylight total.
        - |
          The total variation, from shortest to longest day, is twice the amplitude: 5.8 hours.
        - |
          Correct. 2.9 is the amplitude: the longest day (day 170) has 12.3 + 2.9 = 15.2 hours.
        - |
          Day-to-day change is small and varies through the year; the amplitude describes the extremes, not a daily rate.
      answer: 2
    # ---- Spiral review
    - slug: trig-u02-w10-q09
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        What is the period of y = 3 sin(πx/4)?
      options:
        - "π/4"
        - "8"
        - "3"
        - "8π"
      option_explanations:
        - |
          π/4 is b, the coefficient of x. The period is 2π divided by b.
        - |
          Correct. Period = 2π/|b| = 2π/(π/4) = 8.
        - |
          3 is the amplitude, which stretches the graph vertically and does not change the period.
        - |
          8π comes from multiplying 2π by 4 and forgetting the π in b; 2π/(π/4) = 2π · 4/π = 8.
      answer: 1
    - slug: trig-u02-w10-q10
      type: multiple_choice
      topic_code: "2.3"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        Which describes the phase shift of y = cos(2x − π/3), x in radians?
      options:
        - "Right π/3"
        - "Left π/6"
        - "Right 2π/3"
        - "Right π/6"
      option_explanations:
        - |
          π/3 is the shift only before factoring. cos(2x − π/3) = cos(2(x − π/6)), so the shift is π/6.
        - |
          The size π/6 is right, but x − π/6 means a shift to the right, not the left.
        - |
          2π/3 multiplies π/3 by 2; factoring the 2 out of 2x − π/3 divides instead.
        - |
          Correct. Factor b out: 2x − π/3 = 2(x − π/6), so the graph shifts π/6 to the right.
      answer: 3
    - slug: trig-u02-w10-q11
      type: multiple_choice
      topic_code: "2.5"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        Where are the vertical asymptotes of y = tan(x/2), x in radians? (k is any integer.)
      options:
        - "x = π/2 + kπ"
        - "x = π + 2kπ"
        - "x = π/4 + kπ/2"
        - "x = 2kπ"
      option_explanations:
        - |
          These are the asymptotes of tan x. Here the inside x/2 must equal π/2 + kπ, which stretches them apart.
        - |
          Correct. x/2 = π/2 + kπ gives x = π + 2kπ; the period is π/(1/2) = 2π.
        - |
          This divides by 2 instead of multiplying; it would be right for tan(2x).
        - |
          At x = 2kπ the inside is kπ and tan(x/2) = 0: these are zeros, not asymptotes.
      answer: 1
    - slug: trig-u02-w10-q12
      type: multiple_choice
      topic_code: "1.8"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 1
      prompt: |
        A wheel turns at 12 revolutions per minute. What is its angular speed in radians per minute?
      options:
        - "24π rad/min"
        - "12π rad/min"
        - "12 rad/min"
        - "6/π rad/min"
      option_explanations:
        - |
          Correct. Each revolution is 2π radians, so 12 rev/min = 12 · 2π = 24π rad/min.
        - |
          12π uses π radians per revolution, which is half a turn; a full turn is 2π.
        - |
          12 is the number of revolutions; it must be multiplied by 2π radians per revolution.
        - |
          6/π divides 12 by 2π instead of multiplying, converting the wrong way.
      answer: 0
    - slug: trig-u02-w10-q13
      type: multiple_choice
      topic_code: "2.1"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      prompt: |
        On the interval [0, 2π], where are the zeros of y = cos x?
      options:
        - "x = 0, π and 2π"
        - "x = π/2 and 3π/2"
        - "x = π only"
        - "x = π/2, π and 3π/2"
      option_explanations:
        - |
          These are the zeros of sin x, where the unit-circle point is on the x-axis. cos x is zero where the point is on the y-axis.
        - |
          Correct. cos x is the x-coordinate on the unit circle, which is 0 at the top (π/2) and the bottom (3π/2).
        - |
          At x = π, cos x = −1, the minimum of cosine, not a zero.
        - |
          π does not belong: cos π = −1. Only the points at the top and bottom of the circle have x-coordinate 0.
      answer: 1
    - slug: trig-u02-w10-q14
      type: multi_select
      topic_code: "2.8"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 2
      partial_credit: true
      prompt: |
        A hypothetical spring model gives the displacement of a weight as d(t) = −4 cos(πt/3) centimetres, with up positive and t in seconds. Which statements about this model are true? Select all that apply.
      options:
        - "The amplitude is 4 cm."
        - "The weight starts 4 cm below its rest position."
        - "The period is 3 seconds."
        - "The frequency is 1/6 Hz."
        - "At t = 3 the weight is at its rest position."
      option_explanations:
        - |
          Correct. The amplitude is |−4| = 4 cm; the negative sign only flips the starting side.
        - |
          Correct. d(0) = −4 cos 0 = −4, so the weight starts 4 cm below rest.
        - |
          The period is 2π/(π/3) = 6 seconds; 3 seconds is half a period, from the bottom to the top.
        - |
          Correct. The frequency is 1/P = 1/6 Hz, one oscillation every 6 seconds.
        - |
          d(3) = −4 cos π = 4, so at t = 3 the weight is at its highest point, 4 cm above rest.
      answer: [0, 1, 3]
    - slug: trig-u02-w10-q15
      type: multi_select
      topic_code: "2.4"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 2
      partial_credit: true
      prompt: |
        A sinusoid, x in radians, has a maximum at (0, 5) and the next minimum at (π, 1). Which equations describe it? Select all that apply.
      options:
        - "y = 3 + 2 sin x"
        - "y = 3 + 2 cos x"
        - "y = 3 + 2 cos(2x)"
        - "y = 3 − 2 cos(x − π)"
        - "y = 3 + 2 sin(x + π/2)"
      option_explanations:
        - |
          At x = 0 this gives 3, the midline, not the maximum 5; sine starts on the midline.
        - |
          Correct. Midline 3, amplitude 2, period 2π (max to min is π, half a period), and cosine starts at its maximum.
        - |
          The period is π, so the minimum would come at x = π/2 and the graph would be back at its maximum at x = π.
        - |
          Correct. cos(x − π) = −cos x, so 3 − 2 cos(x − π) = 3 + 2 cos x.
        - |
          Correct. Shifting sine left by π/2 gives cosine: sin(x + π/2) = cos x.
      answer: [1, 3, 4]
    - slug: trig-u02-w10-q16
      type: true_false
      topic_code: "2.8"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        True or false: In the harmonic-motion model d = a sin ωt, doubling ω doubles the period.
      answer: false
      explanation: |
        False. The period is 2π/ω, so doubling ω halves the period (and doubles the frequency): the motion goes back and forth twice as often.
    - slug: trig-u02-w10-q17
      type: true_false
      topic_code: "2.6"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        True or false: The range of y = sec x is all y with y ≤ −1 or y ≥ 1.
      answer: true
      explanation: |
        True. sec x = 1/cos x and cos x takes values in [−1, 1] (excluding 0 where sec x is undefined). Reciprocals of numbers in (0, 1] are at least 1, and reciprocals of numbers in [−1, 0) are at most −1.
    - slug: trig-u02-w10-q18
