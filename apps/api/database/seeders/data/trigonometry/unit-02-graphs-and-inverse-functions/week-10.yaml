      source: "Original item; Common Core HSF-TF.B.5"
      points: 3
      prompt: |
        A hypothetical pendulum bob passes through its rest position moving right at t = 0. It swings at most 12 cm to each side and completes 3 full back-and-forth swings every 4 seconds. Take right as positive.

        (a) Find the frequency and the period of the motion.
        (b) Write an equation for the displacement d(t) in centimetres after t seconds.
        (c) Find d(1) exactly and describe where the bob is at that moment.
      answer: |
        (a) Frequency 3/4 Hz (3 cycles in 4 seconds); period 4/3 s.
        (b) ω = 2π(3/4) = 3π/2, and starting at rest moving in the positive direction means sine: d(t) = 12 sin(3πt/2).
        (c) d(1) = 12 sin(3π/2) = −12: the bob is 12 cm to the left of rest, at the far left of its swing.
      explanation: |
        Three points, one per part. (a) both 3/4 Hz and 4/3 s. (b) d = 12 sin(3πt/2) or an equivalent (accept 12 cos(3πt/2 − π/2)). (c) −12 with the correct description (12 cm left, at an extreme). Follow through from an incorrect ω in (b).
    - slug: trig-u02-w10-q23
      type: short_answer
      topic_code: "2.7"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 3
      prompt: |
        In a hypothetical town, the longest day of the year, day 172, has 14.8 hours of daylight, and the shortest, half a year later, has 9.4 hours. Use a 365-day year.

        (a) Find the midline and the amplitude of a sinusoidal model for daylight L(t) on day t, with units.
        (b) Write L(t) using cosine.
        (c) Show that L(263.25) equals the midline and explain why that makes sense in terms of the cycle.
      answer: |
        (a) Midline (14.8 + 9.4)/2 = 12.1 hours; amplitude (14.8 − 9.4)/2 = 2.7 hours.
        (b) L(t) = 12.1 + 2.7 cos(2π(t − 172)/365).
        (c) 263.25 − 172 = 91.25 = 365/4, so the inside is 2π/4 = π/2 and cos(π/2) = 0: L = 12.1. Day 263.25 is a quarter period after the maximum, where a cosine model crosses its midline on the way down.
      explanation: |
        Three points, one per part. (a) both values with hours. (b) correct b = 2π/365 and shift 172 (accept equivalent forms). (c) the computation and a reason referring to a quarter period after the maximum.
    - slug: trig-u02-w10-q24
      type: long_answer
      topic_code: "2.7"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 6
      prompt: |
        A hypothetical water wheel has radius 3 m, and its axle is 1.2 m above the surface of a river, so the lower part of the wheel turns under water. The wheel makes 4 revolutions per minute. A paddle tip is at its highest point at t = 0. Let h(t) be the height of the paddle tip above the water surface, in metres, t seconds later (negative values mean under water).

        (A) (i) Find the angular speed of the wheel in radians per second.
        (ii) Write a sinusoidal model for h(t).

        (B) (i) Find h(5) and interpret it in context.
        (ii) Find the lowest value of h and the first time it occurs.

        (C) (Calculator.) (i) Find, to the nearest hundredth of a second, the two times in the first revolution when the paddle tip is at the water surface.
        (ii) For how long during each revolution is the paddle tip under water?
      answer: |
        (A) (i) 4 rev/min = 8π rad/min = 8π/60 = 2π/15 rad/s.
        (ii) Midline 1.2 (the axle), amplitude 3 (the radius), period 15 s (b = 2π/15), maximum at t = 0: h(t) = 1.2 + 3 cos(2πt/15).
        (B) (i) h(5) = 1.2 + 3 cos(2π/3) = 1.2 − 1.5 = −0.3: five seconds in, the paddle tip is 0.3 m below the water surface.
        (ii) The lowest value is 1.2 − 3 = −1.8 m (1.8 m under water), at half a period, t = 7.5 s.
        (C) (i) h = 0 when cos(2πt/15) = −0.4. cos⁻¹(−0.4) ≈ 1.9823, so 2πt/15 ≈ 1.9823 or 2π − 1.9823 ≈ 4.3009, giving t ≈ 4.73 s and t ≈ 10.27 s.
        (ii) The tip is lowest at t = 7.5, between these times, so it is under water for 4.73 < t < 10.27: about 5.54 s of every 15-second revolution.
      explanation: |
        Six points. (A) 1 point for 2π/15 rad/s; 1 point for a correct model (accept equivalent forms, such as 1.2 + 3 sin(2π(t + 3.75)/15)). (B) 1 point for −0.3 with the interpretation "0.3 m under water"; 1 point for −1.8 m at t = 7.5 s. (C) 1 point for both times 4.73 and 10.27 (accept within 0.01); 1 point for about 5.54 s with a reason that the interval between the times is the one containing the minimum.
