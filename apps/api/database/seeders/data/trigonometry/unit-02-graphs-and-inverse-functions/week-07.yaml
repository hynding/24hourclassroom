      source: "Original item; Common Core HSF-TF.B.5"
      points: 6
      prompt: |
        A hypothetical buoy bobs on regular waves. Its height above calm-water level is d(t) = −1.2 cos(πt/4) metres, t seconds after a stopwatch is started (t in radians inside the cosine).

        (A) (i) Find the amplitude and the period of d, with units.
        (ii) Explain what the negative coefficient −1.2 tells you about the buoy at t = 0.

        (B) (i) List the five key points of d on [0, 8].
        (ii) On which part of [0, 8] is the buoy rising? Justify using your key points.

        (C) (i) Find d(1) exactly, and as a decimal to the nearest hundredth of a metre.
        (ii) On a stormier day the waves have the same shape but a period of 4 seconds and an amplitude of 1.5 m, and the buoy is again at a trough when t = 0. Write an equation for its height.
      answer: |
        (A) (i) Amplitude |−1.2| = 1.2 m. Period 2π ÷ (π/4) = 8 seconds.
        (ii) d(0) = −1.2 cos 0 = −1.2: the cosine graph is reflected across the midline, so at t = 0 the buoy is at its lowest point, 1.2 m below calm-water level (in a trough).
        (B) (i) Step 8/4 = 2: (0, −1.2), (2, 0), (4, 1.2), (6, 0), (8, −1.2).
        (ii) The buoy rises from its minimum at t = 0 to its maximum at t = 4, so it is rising on (0, 4), and falling on (4, 8).
        (C) (i) d(1) = −1.2 cos(π/4) = −1.2 · √2/2 = −0.6√2 ≈ −0.85 m (0.85 m below calm water).
        (ii) b = 2π/4 = π/2, and a trough at t = 0 with midline 0 means a negative cosine: d(t) = −1.5 cos(πt/2).
      explanation: |
        Six points. (A) 1 point for amplitude 1.2 m and period 8 s; 1 point for explaining that the buoy starts at its lowest point (a trough) because the cosine is reflected. (B) 1 point for all five key points; 1 point for rising on (0, 4) justified by minimum at 0 and maximum at 4. (C) 1 point for −0.6√2 ≈ −0.85; 1 point for d(t) = −1.5 cos(πt/2) or an equivalent form such as 1.5 sin(π(t − 1)/2).
