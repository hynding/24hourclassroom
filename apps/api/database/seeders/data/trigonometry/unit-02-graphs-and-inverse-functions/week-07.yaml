      prompt: |
        Answer without a calculator.

        (a) Use the unit circle to explain why sin(x + 2π) = sin x for every real x.
        (b) Use periodicity to find the exact value of cos(−11π/3).
        (c) Find every zero of y = cos x on the interval [−2π, 2π].
      answer: |
        (a) Turning x + 2π radians from (1, 0) is turning x radians and then one more full turn, which ends at the same point on the unit circle. The same point has the same y-coordinate, so the sines are equal.
        (b) −11π/3 + 4π = π/3, so cos(−11π/3) = cos(π/3) = 1/2.
        (c) Cosine is 0 at x = π/2 + kπ; in [−2π, 2π] these are x = −3π/2, −π/2, π/2 and 3π/2.
      explanation: |
        Three points, one per part. (a) an explanation that x and x + 2π end at the same point on the circle, so the y-coordinate (sine) is the same. (b) 1/2, with a coterminal angle such as π/3. (c) all four zeros and no others.
