week: 7
unit: 2
title: "Graphs of Sine and Cosine"
topics: ["2.1", "2.2"]
guide: guides/week-07.md
guide_description: |
  Periodic functions and their periods; building the graphs of y = sin x and y = cos x from the height and
  horizontal position of a point turning on the unit circle; the five key points, domain, range, zeros,
  extremes and symmetry of each graph; then amplitude |a| and period 2π/|b| for y = a sin(bx) and
  y = a cos(bx), reflections, and sketching one cycle in quarter-period steps. Worked examples: sin(17π/6) and
  the zeros of cosine on [−2π, 2π], y = 3 cos x, y = −2 sin(3x), y = 4 cos(πx/2), and reading y = 5 sin(x/3)
  from a graph.
flashcards_description: |
  30 cards on periodic functions, the sine and cosine graphs and their key points, zeros and symmetry,
  amplitude, period, reflections and quarter-period sketching.

flashcards:
  - front: Periodic function with period P → defining equation
    back: |
      f(x + P) = f(x) for every x in the domain, and the period is the smallest positive P that works.
    topic_code: "2.1"
  - front: Graph of y = sin x built from the unit circle → which coordinate is plotted
    back: |
      The height (y-coordinate) of the point reached after turning x radians from (1, 0).
    topic_code: "2.1"
  - front: Graph of y = cos x built from the unit circle → which coordinate is plotted
    back: |
      The horizontal position (x-coordinate) of the point reached after turning x radians from (1, 0).
    topic_code: "2.1"
  - front: Five key points of y = sin x on [0, 2π] → list them
    back: |
      (0, 0), (π/2, 1), (π, 0), (3π/2, −1), (2π, 0): zero, max, zero, min, zero.
    topic_code: "2.1"
  - front: Five key points of y = cos x on [0, 2π] → list them
    back: |
      (0, 1), (π/2, 0), (π, −1), (3π/2, 0), (2π, 1): max, zero, min, zero, max.
    topic_code: "2.1"
  - front: Domain and range of y = sin x and y = cos x → state both
    back: |
      Domain all real numbers; range [−1, 1] for each.
    topic_code: "2.1"
  - front: Why the period of y = sin x is 2π → reason from the circle
    back: |
      After a full turn of 2π the point is back where it started, and no smaller turn returns it to the same point every time.
    topic_code: "2.1"
  - front: Zeros of y = sin x → general form
    back: |
      x = kπ for every integer k, where the point on the circle is (±1, 0).
    topic_code: "2.1"
  - front: Zeros of y = cos x → general form
    back: |
      x = π/2 + kπ for every integer k, where the point on the circle is (0, ±1).
    topic_code: "2.1"
  - front: Where y = cos x has its minimum −1 → x-values
    back: |
      x = π + 2kπ, where the point on the circle is (−1, 0).
    topic_code: "2.1"
  - front: Symmetry of the sine graph vs the cosine graph → which is which
    back: |
      Sine is odd (symmetric about the origin, sin(−x) = −sin x); cosine is even (symmetric about the y-axis, cos(−x) = cos x).
    topic_code: "2.1"
  - front: sin(17π/6) by periodicity → value
    back: |
      17π/6 − 2π = 5π/6, so sin(17π/6) = sin(5π/6) = 1/2.
    topic_code: "2.1"
  - front: Cosine graph as a slid sine graph → which slide
    back: |
      cos x = sin(x + π/2): the sine graph moved π/2 to the left.
    topic_code: "2.1"
  - front: Shape of the sine curve near a zero vs near a peak → describe
    back: |
      Steepest at the zeros, flat at the maximum and minimum; the curve is smooth, not a zigzag of straight segments.
    topic_code: "2.1"
  - front: Amplitude of y = a sin(bx) → formula and meaning
    back: |
      |a|: the distance from the midline to a maximum. It is never negative.
    topic_code: "2.2"
  - front: Period of y = a cos(bx) → formula
    back: |
      2π/|b|. Only b changes the period; a does not.
    topic_code: "2.2"
  - front: y = −sin x compared with y = sin x → effect of the minus sign
    back: |
      Reflection across the x-axis: it starts at 0 and goes down first. Amplitude is still 1.
    topic_code: "2.2"
  - front: Range of y = −4 cos(5x) → state it
    back: |
      [−4, 4]. The amplitude is |−4| = 4, and b does not affect the range.
    topic_code: "2.2"
  - front: Period of y = sin(3x) → value and how many cycles on [0, 2π]
    back: |
      2π/3; three full cycles fit on [0, 2π].
    topic_code: "2.2"
  - front: Period of y = cos(x/2) → value and effect
    back: |
      2π/(1/2) = 4π. A b between 0 and 1 stretches the graph horizontally.
    topic_code: "2.2"
  - front: Quarter-period step for sketching y = a sin(bx) → size
    back: |
      (2π/|b|) ÷ 4 = π/(2|b|). Each step moves to the next key point.
    topic_code: "2.2"
  - front: Key points of y = −2 sin(3x) over one cycle → list them
    back: |
      (0, 0), (π/6, −2), (π/3, 0), (π/2, 2), (2π/3, 0). Step π/6; the negative a makes it go down first.
    topic_code: "2.2"
  - front: Key points of y = 4 cos(πx/2) over one cycle → list them
    back: |
      Period 4, step 1: (0, 4), (1, 0), (2, −4), (3, 0), (4, 4).
    topic_code: "2.2"
  - front: Period of y = 7 sin(πx/6) → value
    back: |
      2π ÷ (π/6) = 12. A π inside b usually gives a period without π.
    topic_code: "2.2"
  - front: b from the period, y = sin(bx) with period 8 → value
    back: |
      b = 2π/8 = π/4 (taking b > 0).
    topic_code: "2.2"
  - front: sin(−3x) and cos(−3x) → rewrite with a positive b
    back: |
      sin(−3x) = −sin(3x) (odd); cos(−3x) = cos(3x) (even).
    topic_code: "2.2"
  - front: Graph through the origin rising, max 5 at 3π/2, cycle ends at 6π → equation
    back: |
      y = 5 sin(x/3): amplitude 5, period 6π, so b = 2π/(6π) = 1/3.
    topic_code: "2.2"
  - front: Error-spot → "the period of y = sin(4x) is 8π"
    back: |
      That multiplies by b. The period is 2π/4 = π/2.
    topic_code: "2.2"
  - front: Error-spot → "the amplitude of y = −6 cos x is −6"
    back: |
      Amplitude is a distance: |−6| = 6. The minus sign is a reflection, not a negative amplitude.
    topic_code: "2.2"
  - front: Error-spot → "a wave from −3 up to 3 has amplitude 6"
    back: |
      6 is the full height, max − min. The amplitude is half of it: 3.
    topic_code: "2.2"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 2.1 and 2.2: periodic functions, the graphs of
    sine and cosine, key points, amplitude, period and reflections), with about a third reviewing Unit 1
    (radians, arc length, special angles on the unit circle, reference angles, cofunctions, fundamental
    identities and a right-triangle application). Includes a shared-context set on f(x) = −3 sin(4x).
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes. Angles are in radians unless an item says degrees. Items marked (Calculator.) need a calculator; the
    rest are designed to be done by hand.
  questions:
    # ---- Stimulus set: amplitude, period and reflection (2.2)
    - slug: trig-u02-w07-q01
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      stimulus: |
        Let f(x) = −3 sin(4x), with x in radians.
      prompt: |
        What is the amplitude of f?
      options:
        - "−3"
        - "3"
        - "4"
        - "6"
      option_explanations:
        - |
          Amplitude is a distance from the midline, so it is |a|; the minus sign only reflects the graph across the x-axis.
        - |
          Correct. The amplitude is |a| = |−3| = 3, so f takes values from −3 to 3.
        - |
          4 is b, which controls the period (how fast the wave repeats), not how tall it is.
        - |
          6 is the full height of the wave, from −3 up to 3; the amplitude is half of that distance.
      answer: 1
    - slug: trig-u02-w07-q02
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      stimulus: |
        Let f(x) = −3 sin(4x), with x in radians.
      prompt: |
        What is the period of f?
      options:
        - "8π"
        - "2π"
        - "π/2"
        - "π/4"
      option_explanations:
        - |
          8π multiplies 2π by b; a larger b squeezes the graph, so the period must be shorter than 2π, not longer.
        - |
          2π is the period of sin x itself; the factor 4 inside changes it to 2π/4.
        - |
          Correct. The period is 2π/|b| = 2π/4 = π/2.
        - |
          π/4 is not a full cycle; a quarter of the period, π/8, is the step between key points, and π/4 is half a cycle.
      answer: 2
    - slug: trig-u02-w07-q03
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      stimulus: |
        Let f(x) = −3 sin(4x), with x in radians.
      prompt: |
        What is the value of f(π/8)?
      options:
        - "3"
        - "0"
        - "−3√2/2"
        - "−3"
      option_explanations:
        - |
          sin(π/2) = 1 is right, but the factor −3 makes the output −3; this answer drops the reflection.
        - |
          The zeros of f are at multiples of π/4; x = π/8 is a quarter-period in, where f reaches an extreme value.
        - |
          This evaluates −3 sin(π/4), as if the input were multiplied by 2 instead of 4.
        - |
          Correct. 4 · π/8 = π/2 and sin(π/2) = 1, so f(π/8) = −3 · 1 = −3, the minimum.
      answer: 3
    - slug: trig-u02-w07-q04
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      stimulus: |
        Let f(x) = −3 sin(4x), with x in radians.
      prompt: |
        At which x in the first cycle, [0, π/2], does f reach its maximum value of 3?
      options:
        - "3π/8"
        - "π/8"
        - "π/4"
        - "π/2"
      option_explanations:
        - |
          Correct. The maximum of −3 sin(4x) needs sin(4x) = −1, so 4x = 3π/2 and x = 3π/8, three quarter-steps into the cycle.
        - |
          At π/8, sin(4x) = 1 and f = −3; because a is negative, this is the minimum, not the maximum.
        - |
          At π/4, 4x = π and sin π = 0, so f(π/4) = 0: a zero halfway through the cycle.
        - |
          At π/2 the cycle ends with 4x = 2π, where sine is 0, so f is back on the midline.
      answer: 0
    # ---- Topics 2.1 and 2.2
    - slug: trig-u02-w07-q05
      type: multiple_choice
      topic_code: "2.1"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      prompt: |
        Which list gives the five key points of one cycle of y = cos x on [0, 2π]?
      options:
        - "(0, 1), (π/2, 0), (π, −1), (3π/2, 0), (2π, 1)"
        - "(0, 0), (π/2, 1), (π, 0), (3π/2, −1), (2π, 0)"
        - "(0, 1), (π, 0), (2π, −1), (3π, 0), (4π, 1)"
        - "(0, 1), (π/2, −1), (π, 1), (3π/2, −1), (2π, 1)"
      option_explanations:
        - |
          Correct. Cosine is the horizontal coordinate on the unit circle: 1 at 0, 0 at π/2, −1 at π, 0 at 3π/2 and 1 again at 2π.
        - |
          These are the key points of y = sin x, which starts at the midline; cosine starts at its maximum.
        - |
          These use steps of π, which stretches the cycle to 4π; the quarter-period step for cos x is π/2.
        - |
          This skips the zeros: cosine passes through 0 at π/2 and 3π/2 on its way between 1 and −1.
      answer: 0
    - slug: trig-u02-w07-q06
      type: multiple_choice
      topic_code: "2.1"
      source: "Original item; Common Core HSF-TF.A.4"
      points: 1
      prompt: |
        Use the period of sine to find the exact value of sin(17π/6).
      options:
        - "−1/2"
        - "√3/2"
        - "−√3/2"
        - "1/2"
      option_explanations:
        - |
          17π/6 is coterminal with 5π/6, a quadrant II angle, where sine is positive, so the sign is wrong.
        - |
          √3/2 is the sine of π/3 or 2π/3; the reference angle of 5π/6 is π/6, whose sine is 1/2.
        - |
          −√3/2 is cos(5π/6), the horizontal coordinate; the question asks for the sine, the height.
        - |
          Correct. 17π/6 − 2π = 5π/6, and sin(5π/6) = 1/2 because the period of sine is 2π.
      answer: 3
    - slug: trig-u02-w07-q07
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        What is the period of y = 5 cos(x/3)?
      options:
        - "2π/3"
        - "6π"
        - "10π"
        - "3π/2"
      option_explanations:
        - |
          2π/3 multiplies 2π by b = 1/3 instead of dividing by it; a b less than 1 stretches the graph, so the period grows.
        - |
          Correct. The period is 2π/|b| = 2π ÷ (1/3) = 6π.
        - |
          10π uses the amplitude 5, but the amplitude has no effect on the period.
        - |
          3π/2 is one quarter of the period, the step between key points, not a full cycle.
      answer: 1
    - slug: trig-u02-w07-q08
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        Which equation has amplitude 4 and period π?
      options:
        - "y = 4 sin(πx)"
        - "y = π sin(4x)"
        - "y = 4 sin(2x)"
        - "y = 2 sin(4x)"
      option_explanations:
        - |
          The amplitude is 4, but b = π gives period 2π/π = 2, not π.
        - |
          This has amplitude π and period 2π/4 = π/2: both numbers are in the wrong places.
        - |
          Correct. The amplitude is |4| = 4 and the period is 2π/2 = π.
        - |
          The amplitude is 2 and the period is 2π/4 = π/2; neither matches.
      answer: 2
    # ---- Spiral review (Unit 1)
    - slug: trig-u02-w07-q09
      type: multiple_choice
      topic_code: "1.11"
      source: "Original item; Common Core HSF-TF.A.3"
      points: 1
      prompt: |
        What is the exact value of cos(7π/6)?
      options:
        - "1/2"
        - "−1/2"
        - "√3/2"
        - "−√3/2"
      option_explanations:
        - |
          1/2 is the sine of the reference angle π/6, with the wrong sign as well.
        - |
          −1/2 is sin(7π/6); cosine is the horizontal coordinate, which is −√3/2 here.
        - |
          The size is right, but 7π/6 is in quadrant III, where cosine is negative.
        - |
          Correct. The reference angle is π/6 and cos(π/6) = √3/2; in quadrant III cosine is negative.
      answer: 3
    - slug: trig-u02-w07-q10
      type: multiple_choice
      topic_code: "1.7"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 1
      prompt: |
        Convert 225° to radians.
      options:
        - "5π/4"
        - "3π/4"
        - "4π/5"
        - "5π/2"
      option_explanations:
        - |
          Correct. 225° · π/180° = 225π/180 = 5π/4.
        - |
          3π/4 is 135°, the angle in quadrant II with the same reference angle; 225° is in quadrant III.
        - |
          4π/5 flips the fraction 225/180 = 5/4 upside down; the multiplier is π/180, giving 5π/4.
        - |
          5π/2 divides by 90 instead of 180; it is 450°, more than a full turn.
      answer: 0
    - slug: trig-u02-w07-q11
      type: multiple_choice
      topic_code: "1.12"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        If sin θ = −8/17 and θ is in quadrant III, what is tan θ?
      options:
        - "−8/15"
        - "15/8"
        - "8/15"
        - "−15/17"
      option_explanations:
        - |
          In quadrant III both sine and cosine are negative, so their quotient, tangent, is positive.
        - |
          15/8 is cos θ / sin θ, which is cot θ, not tan θ.
        - |
          Correct. cos²θ = 1 − 64/289 = 225/289 and cos θ = −15/17 in quadrant III, so tan θ = (−8/17)/(−15/17) = 8/15.
        - |
          −15/17 is cos θ, an intermediate step; tangent is sin θ divided by cos θ.
      answer: 2
    - slug: trig-u02-w07-q12
      type: multiple_choice
      topic_code: "1.10"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      prompt: |
        What is the reference angle of 11π/6?
      options:
        - "5π/6"
        - "π/6"
        - "π/3"
        - "−π/6"
      option_explanations:
        - |
          5π/6 is π − π/6, an angle in quadrant II; a reference angle is always acute.
        - |
          Correct. 11π/6 is in quadrant IV, and its distance to the x-axis is 2π − 11π/6 = π/6.
        - |
          π/3 is the complement of π/6, the distance to the y-axis; reference angles are measured to the x-axis.
        - |
          −π/6 is coterminal with 11π/6, but a reference angle is a positive acute angle.
      answer: 1
    - slug: trig-u02-w07-q13
      type: multi_select
      topic_code: "2.1"
      source: "Original item; Common Core HSF-TF.A.4"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the graphs of y = sin x and y = cos x, with x in radians, are true? Select all that apply.
      options:
        - "Both have range [−1, 1]."
        - "y = sin x has zeros at x = π/2 + kπ for every integer k."
        - "y = cos x is an even function: cos(−x) = cos x."
        - "Both reach their maximum value at x = 0."
        - "Both have period π."
      option_explanations:
        - |
          Correct. Both are coordinates of a point on the unit circle, so each lies between −1 and 1 and reaches both.
        - |
          Those are the zeros of cosine; sine is 0 at x = kπ, where the point on the circle is on the x-axis.
        - |
          Correct. Turning by −x lands on the reflection across the x-axis, which has the same horizontal coordinate.
        - |
          Only cosine has its maximum at x = 0; sin 0 = 0, and sine's maximum is at π/2.
        - |
          Both have period 2π: a full turn is needed to return to the same point on the circle.
      answer: [0, 2]
    - slug: trig-u02-w07-q14
      type: multi_select
      topic_code: "1.12"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 2
      partial_credit: true
      prompt: |
        Given cos θ = 5/13 with θ in quadrant IV, which statements are true? Select all that apply.
      options:
        - "sin θ = −12/13"
        - "tan θ = 12/5"
        - "sec θ = 13/5"
        - "csc θ = 13/12"
        - "cot θ = −5/12"
      option_explanations:
        - |
          Correct. sin²θ = 1 − 25/169 = 144/169, and sine is negative in quadrant IV, so sin θ = −12/13.
        - |
          tan θ = sin θ / cos θ = (−12/13)/(5/13) = −12/5; tangent is negative in quadrant IV.
        - |
          Correct. sec θ is the reciprocal of cos θ: 13/5, positive like cosine in quadrant IV.
        - |
          csc θ is the reciprocal of sin θ = −12/13, so csc θ = −13/12; the sign has been lost.
        - |
          Correct. cot θ = cos θ / sin θ = (5/13)/(−12/13) = −5/12.
      answer: [0, 2, 4]
    - slug: trig-u02-w07-q15
      type: true_false
      topic_code: "2.2"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        True or false: The graph of y = sin(x/2) is a horizontal compression of y = sin x, so it completes a cycle in less than 2π.
      answer: false
      explanation: |
        False. Here b = 1/2, so the period is 2π ÷ (1/2) = 4π. A b between 0 and 1 stretches the graph horizontally, and one cycle takes twice as long as for sin x.
    - slug: trig-u02-w07-q16
      type: true_false
      topic_code: "1.4"
      source: "Original item; Common Core HSG-SRT.C.7"
      points: 1
      prompt: |
        True or false: In a right triangle with acute angles of 34° and 56°, tan 34° = cot 56°.
      answer: true
      explanation: |
        True. 34° and 56° are complementary, and tangent and cotangent are cofunctions: tan θ = cot(90° − θ). The side opposite the 34° angle is the side adjacent to the 56° angle, so both ratios are the same quotient of the two legs.
    - slug: trig-u02-w07-q17
      type: fill_blank
      topic_code: "2.2"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        The amplitude of y = −7 cos(2x) is ____.
      answer: ["7"]
      explanation: |
        The amplitude is |a| = |−7| = 7. The minus sign reflects the graph, so it starts at its minimum −7, and the 2 halves the period to π; neither changes the amplitude.
    - slug: trig-u02-w07-q18
      type: fill_blank
      topic_code: "1.8"
      source: "Original item; Common Core HSF-TF.A.1"
      points: 1
      prompt: |
        A circle has radius 6 cm. The exact length, in centimetres, of the arc cut off by a central angle of 2π/3 radians is ____.
      answer: ["4π", "4pi", "4 π", "4 pi", "4π cm", "4pi cm", "4 π cm", "4 pi cm"]
      explanation: |
        Arc length s = rθ with θ in radians: s = 6 · 2π/3 = 4π cm.
    - slug: trig-u02-w07-q19
      type: numeric
      topic_code: "2.2"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        (Calculator.) The function y = 2.5 sin(bx), with b > 0 and x in radians, has period 8. Find b to the nearest thousandth.
      answer: { value: 0.785, tolerance: 0.001 }
      explanation: |
        The period is 2π/b = 8, so b = 2π/8 = π/4 ≈ 0.7854, which is 0.785 to the nearest thousandth. The amplitude 2.5 plays no part.
    - slug: trig-u02-w07-q20
      type: numeric
      topic_code: "1.6"
      source: "Original item; Common Core HSG-SRT.C.8"
      points: 1
      prompt: |
        (Calculator.) From a point on level ground 40 m from the base of a hypothetical tower, the angle of elevation to the top of the tower is 52°. Find the height of the tower to the nearest tenth of a metre.
      answer: { value: 51.2, tolerance: 0.1 }
      explanation: |
        The height is opposite the 52° angle and the 40 m distance is adjacent, so tan 52° = h/40 and h = 40 tan 52° ≈ 51.198, which is 51.2 m. (Calculator in degree mode.)
    - slug: trig-u02-w07-q21
      type: short_answer
      topic_code: "2.2"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 3
      prompt: |
        Let g(x) = 4 cos(πx/3).

        (a) Find the amplitude and the period of g.
        (b) List the five key points of the cycle of g that starts at x = 0.
        (c) State the range of g, and find every x in [0, 6] at which g(x) = −4.
      answer: |
        (a) Amplitude |4| = 4. Period 2π ÷ (π/3) = 6.
        (b) Quarter step 6/4 = 1.5: (0, 4), (1.5, 0), (3, −4), (4.5, 0), (6, 4).
        (c) Range [−4, 4]. g(x) = −4 requires cos(πx/3) = −1, so πx/3 = π and x = 3 is the only such x in [0, 6].
      explanation: |
        Three points, one per part. (a) amplitude 4 and period 6. (b) all five points with step 1.5 in the order max, zero, min, zero, max. (c) range [−4, 4] and x = 3 (no other value in the interval).
