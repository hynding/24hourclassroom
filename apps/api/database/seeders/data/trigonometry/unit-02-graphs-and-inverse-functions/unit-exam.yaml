  # ---- Short answer
  - slug: trig-u02-exam-q45
    type: short_answer
    topic_code: "2.4"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 3
    prompt: |
      A sinusoid, x in radians, has a maximum at (π/6, 5) and the next minimum at (2π/3, −1).

      (a) Find its amplitude, period and midline.
      (b) Write an equation for it using cosine.
      (c) Write an equation for it using sine, and check it at x = π/6.
    answer: |
      (a) Amplitude (5 − (−1))/2 = 3; maximum to minimum is 2π/3 − π/6 = π/2, half a period, so the period is π; midline y = 2.
      (b) b = 2π/π = 2 and the maximum is at x = π/6: y = 2 + 3 cos(2(x − π/6)).
      (c) Sine rises through the midline a quarter period (π/4) before the maximum, at x = π/6 − π/4 = −π/12: y = 2 + 3 sin(2(x + π/12)). Check: at x = π/6, 2(π/6 + π/12) = π/2 and y = 2 + 3 sin(π/2) = 5.
    explanation: |
      Three points, one per part. (a) all three of amplitude 3, period π and midline y = 2. (b) a correct cosine equation (accept any equivalent shift, such as π/6 + kπ). (c) a correct sine equation with the check. Follow through from an incorrect period in (a).
  - slug: trig-u02-exam-q46
    type: short_answer
    topic_code: "2.10"
    source: "Original item; Common Core HSF-TF.B.6"
    points: 3
    prompt: |
      Answer without a calculator.

      (a) Find the exact value of tan(cos⁻¹(−12/13)), and explain its sign.
      (b) Find the exact value of cos⁻¹(cos(7π/4)), and explain why it is not 7π/4.
      (c) Write csc(tan⁻¹ x), for x ≠ 0, as an algebraic expression in x.
    answer: |
      (a) θ = cos⁻¹(−12/13) is in [0, π] with negative cosine, so in quadrant II. With x = −12 and r = 13, y = 5, so tan θ = 5/(−12) = −5/12; tangent is negative in quadrant II.
      (b) cos(7π/4) = √2/2 and cos⁻¹(√2/2) = π/4. The answer must lie in [0, π], the range of cos⁻¹, and 7π/4 does not.
      (c) Let α = tan⁻¹ x: opposite x, adjacent 1, hypotenuse √(1 + x²). csc α = hypotenuse/opposite = √(1 + x²)/x.
    explanation: |
      Three points, one per part. (a) −5/12 with the quadrant II reason. (b) π/4 with a reference to the range [0, π]. (c) √(1 + x²)/x (the sign is carried by x, as csc α has the sign of x on (−π/2, π/2)).
  # ---- Free response
  - slug: trig-u02-exam-q47
    type: long_answer
    topic_code: "2.7"
    source: "Original item; Common Core HSF-TF.B.7"
    points: 6
    prompt: |
      In a hypothetical greenhouse, the air temperature follows a daily sinusoidal cycle. The lowest temperature, 12 °C, occurs at 4 a.m. (t = 4) and the highest, 30 °C, at 4 p.m. (t = 16), where t is hours after midnight. The cycle repeats every 24 hours.

      (A) (i) Find the midline, amplitude and period of the model, with units.
      (ii) Write a sinusoidal model T(t).

      (B) (i) Find T(8) and T(10), and interpret T(10) in context.
      (ii) Explain why the temperature is rising fastest at t = 10.

      (C) (Calculator.) A cooling fan runs whenever the temperature is above 27 °C.
      (i) Find, to the nearest hundredth of an hour, the times during the day when the fan switches on and off.
      (ii) For how many hours per day does the fan run?
    answer: |
      (A) (i) Midline (30 + 12)/2 = 21 °C; amplitude (30 − 12)/2 = 9 °C; period 24 hours.
      (ii) b = 2π/24 = π/12. The minimum is at t = 4, so use −cosine: T(t) = 21 − 9 cos(π(t − 4)/12).
      (B) (i) T(8) = 21 − 9 cos(π/3) = 21 − 4.5 = 16.5 °C. T(10) = 21 − 9 cos(π/2) = 21 °C: at 10 a.m. the temperature equals its daily average, halfway between the minimum and the maximum.
      (ii) t = 10 is a quarter period after the minimum, where the graph crosses its midline going up. A sinusoid changes fastest at its midline crossings (it is steepest there and flattens out towards the peaks and troughs), so the temperature is rising fastest at 10 a.m.
      (C) (i) 21 − 9 cos(π(t − 4)/12) = 27 gives cos(π(t − 4)/12) = −2/3. cos⁻¹(−2/3) ≈ 2.3005, so π(t − 4)/12 ≈ 2.3005 or 2π − 2.3005 ≈ 3.9827. Then t ≈ 4 + 8.787 = 12.79 and t ≈ 4 + 15.213 = 19.21. The fan switches on at about t = 12.79 (12:47 p.m.) and off at about t = 19.21 (7:13 p.m.).
      (ii) The maximum at t = 16 lies between these times, so the fan runs for 19.21 − 12.79 ≈ 6.43 hours per day.
    explanation: |
      Six points. (A) 1 point for 21 °C, 9 °C and 24 hours; 1 point for a correct model (accept equivalent forms, such as 21 + 9 cos(π(t − 16)/12) or 21 + 9 sin(π(t − 10)/12)). (B) 1 point for 16.5 and 21 with the interpretation as the daily average; 1 point for linking t = 10 to the rising midline crossing as the steepest point. (C) 1 point for both times 12.79 and 19.21 (accept within 0.01); 1 point for about 6.43 hours with the interval correctly chosen (accept 6.42 from rounded times).
  - slug: trig-u02-exam-q48
    type: long_answer
    topic_code: "2.6"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 6
    prompt: |
      Let g(x) = 2 sec(x − π/4), x in radians.

      (A) (i) State the guide function for g and the period of g.
      (ii) Find the vertical asymptotes of g on the interval [0, 2π].

      (B) (i) Find the local minimum point of the branch of g that opens upward on (−π/4, 3π/4), and the local maximum point of the branch that opens downward on (3π/4, 7π/4).
      (ii) State the range of g, and explain why g never takes a value between −2 and 2.

      (C) (i) Solve g(x) = 4 exactly on [0, 2π).
      (ii) (Calculator.) Solve g(x) = −3 on [0, 2π), to the nearest thousandth.
    answer: |
      (A) (i) The guide function is y = 2 cos(x − π/4); g has period 2π.
      (ii) Asymptotes where cos(x − π/4) = 0: x − π/4 = π/2 + kπ, so x = 3π/4 + kπ. On [0, 2π]: x = 3π/4 and x = 7π/4.
      (B) (i) The guide reaches its maximum 2 at x = π/4, so g has a local minimum at (π/4, 2). The guide reaches −2 at x = 5π/4, so g has a local maximum at (5π/4, −2).
      (ii) Range: y ≤ −2 or y ≥ 2. Since |cos(x − π/4)| ≤ 1, its reciprocal has size at least 1, so |g(x)| = 2|sec(x − π/4)| ≥ 2.
      (C) (i) 2 sec(x − π/4) = 4 means cos(x − π/4) = 1/2, so x − π/4 = π/3 or x − π/4 = −π/3 (+ 2πk). x = 7π/12 or x = −π/12 + 2π = 23π/12.
      (ii) 2 sec(x − π/4) = −3 means cos(x − π/4) = −2/3. cos⁻¹(−2/3) ≈ 2.3005, so x − π/4 ≈ ±2.3005. x ≈ π/4 + 2.3005 ≈ 3.086, and x ≈ π/4 − 2.3005 + 2π ≈ 4.768. Both lie on the downward branch (3π/4, 7π/4), as they must for a negative value.
    explanation: |
      Six points. (A) 1 point for the guide function and period 2π; 1 point for both asymptotes 3π/4 and 7π/4. (B) 1 point for (π/4, 2) and (5π/4, −2); 1 point for the range with a reason based on |cos| ≤ 1. (C) 1 point for 7π/12 and 23π/12; 1 point for 3.086 and 4.768 (accept within 0.001).
