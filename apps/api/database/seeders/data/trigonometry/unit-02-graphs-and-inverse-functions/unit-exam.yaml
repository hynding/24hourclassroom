unit: 2
description: |
  48 questions · about 90 minutes · every topic of Unit 2 (2.1 to 2.12): the graphs of sine and cosine,
  amplitude, period, phase and vertical shift, writing sinusoids, the graphs of tangent, cotangent, secant and
  cosecant, sinusoidal models and simple harmonic motion, inverse sine, cosine and tangent and their
  compositions, sums of sinusoids and damped oscillation, and inverse cotangent, secant and cosecant, with a
  little review of Unit 1 (radians, arc length, exact values, reference angles). Includes three shared-context
  sets (a transformed sine, a hypothetical tide and an inverse sine value), select-all, true/false,
  fill-in-the-blank and numeric items, two short-answer questions (3 points each) and two free-response
  questions (6 points each: a hypothetical greenhouse temperature model and a transformed secant graph). Items
  marked (Calculator.) need a calculator in radian mode; the rest are designed to be done by hand. Multiple
  choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
  automatically; the short and free-response items are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: a transformed sine (2.2, 2.3)
  - slug: trig-u02-exam-q01
    type: multiple_choice
    topic_code: "2.2"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    stimulus: |
      Let f(x) = 3 sin(2x − π/2) − 1, x in radians.
    prompt: |
      What is the period of f?
    options:
      - "2π"
      - "π"
      - "π/2"
      - "4π"
    option_explanations:
      - |
        2π is the period of sin x; the 2 multiplying x compresses the graph horizontally.
      - |
        Correct. Period = 2π/|b| = 2π/2 = π. The 3, the shift and the −1 do not change it.
      - |
        π/2 is the size of the inside constant, which (after factoring) produces a shift, not the period.
      - |
        4π multiplies 2π by b instead of dividing by it.
    answer: 1
  - slug: trig-u02-exam-q02
    type: multiple_choice
    topic_code: "2.3"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    stimulus: |
      Let f(x) = 3 sin(2x − π/2) − 1, x in radians.
    prompt: |
      What is the phase shift of f compared with y = 3 sin(2x) − 1?
    options:
      - "Right π/2"
      - "Left π/4"
      - "Right π"
      - "Right π/4"
    option_explanations:
      - |
        π/2 is the shift only before factoring out b = 2: 2x − π/2 = 2(x − π/4).
      - |
        The size π/4 is right, but x − π/4 shifts the graph to the right, not the left.
      - |
        This multiplies π/2 by 2; factoring the 2 out of 2x − π/2 divides by 2 instead.
      - |
        Correct. 2x − π/2 = 2(x − π/4), so the graph of 3 sin(2x) − 1 moves π/4 to the right.
    answer: 3
  - slug: trig-u02-exam-q03
    type: multiple_choice
    topic_code: "2.3"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    stimulus: |
      Let f(x) = 3 sin(2x − π/2) − 1, x in radians.
    prompt: |
      What is the range of f?
    options:
      - "[−4, 2]"
      - "[−3, 3]"
      - "[−2, 4]"
      - "[−1, 3]"
    option_explanations:
      - |
        Correct. The midline is y = −1 and the amplitude is 3, so f runs from −1 − 3 = −4 to −1 + 3 = 2.
      - |
        [−3, 3] ignores the vertical shift of −1; that is the range of 3 sin(2x − π/2).
      - |
        This shifts up by 1 instead of down; the −1 moves the midline to y = −1.
      - |
        This starts at the midline instead of centring the interval on it; the graph goes 3 above and 3 below y = −1.
    answer: 0
  - slug: trig-u02-exam-q04
    type: multiple_choice
    topic_code: "2.3"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    stimulus: |
      Let f(x) = 3 sin(2x − π/2) − 1, x in radians.
    prompt: |
      At which x in [0, π) does f reach its maximum value?
    options:
      - "x = 0"
      - "x = π/4"
      - "x = π/2"
      - "x = 3π/4"
    option_explanations:
      - |
        f(0) = 3 sin(−π/2) − 1 = −4, the minimum, not the maximum.
      - |
        At x = π/4 the inside is 0 and f = −1: the graph is on its midline, rising.
      - |
        Correct. The maximum needs 2x − π/2 = π/2, so x = π/2, where f = 3 − 1 = 2.
      - |
        At x = 3π/4 the inside is π, so sin π = 0 and f is back on the midline, falling.
    answer: 2
  # ---- Graphs of sine and cosine, amplitude, period, shifts (2.1–2.4)
  - slug: trig-u02-exam-q05
    type: multiple_choice
    topic_code: "2.1"
    source: "Original item; Common Core HSF-TF.A.2"
    points: 1
    prompt: |
      Which describes y = sin x on the interval [π/2, 3π/2]?
    options:
      - "Increasing from −1 to 1"
      - "Increasing from 0 to 1, then decreasing"
      - "Constant at 0"
      - "Decreasing from 1 to −1"
    option_explanations:
      - |
        This is sine on [−π/2, π/2]; from the top of the unit circle round to the bottom, the y-coordinate falls.
      - |
        Sine is at its maximum 1 at π/2 and only falls from there to 3π/2; it does not rise again until after 3π/2.
      - |
        sin x is 0 only at π inside this interval; elsewhere the y-coordinate is non-zero.
      - |
        Correct. From π/2 (the top of the unit circle) to 3π/2 (the bottom) the y-coordinate falls from 1 to −1.
    answer: 3
  - slug: trig-u02-exam-q06
    type: multiple_choice
    topic_code: "2.2"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    prompt: |
      What are the amplitude and the period of y = 0.5 cos(4x), x in radians?
    options:
      - "Amplitude 4, period π/2"
      - "Amplitude 0.5, period π/2"
      - "Amplitude 0.5, period 8π"
      - "Amplitude 2, period 2π"
    option_explanations:
      - |
        The amplitude is |a| = 0.5; 4 is b, which sets the period.
      - |
        Correct. Amplitude |0.5| = 0.5, and the period is 2π/4 = π/2.
      - |
        8π multiplies 2π by 4 instead of dividing.
      - |
        This multiplies 0.5 by 4; amplitude and period come from different constants and do not combine.
    answer: 1
  - slug: trig-u02-exam-q07
    type: multiple_choice
    topic_code: "2.2"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    prompt: |
      Which function has amplitude 2 and period 6π?
    options:
      - "y = 2 sin(x/3)"
      - "y = 2 sin(3x)"
      - "y = 3 sin(x/2)"
      - "y = 6π sin(2x)"
    option_explanations:
      - |
        Correct. Amplitude 2, and b = 1/3 gives period 2π/(1/3) = 6π.
      - |
        b = 3 gives period 2π/3, a compression rather than a stretch.
      - |
        This has amplitude 3 and period 4π; the roles of the two numbers are reversed.
      - |
        The period is not written as a coefficient; this has amplitude 6π and period π.
    answer: 0
  - slug: trig-u02-exam-q08
    type: multiple_choice
    topic_code: "2.4"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    prompt: |
      A sinusoid passes through the points in the table, which cover one full cycle (x in radians). Which equation fits?

      | x | 0 | π/2 | π | 3π/2 | 2π |
      |---|---|---|---|---|---|
      | y | 3 | 1 | −1 | 1 | 3 |
    options:
      - "y = 3 cos x"
      - "y = 1 + 2 sin x"
      - "y = 1 + 2 cos x"
      - "y = 2 + cos x"
    option_explanations:
      - |
        This gives −3 at x = π; the table's minimum is −1, so the midline is not 0.
      - |
        This starts at 1, the midline, at x = 0; the table starts at its maximum, 3.
      - |
        Correct. Midline (3 + (−1))/2 = 1, amplitude 2, period 2π, and the cycle starts at a maximum, so cosine.
      - |
        Amplitude 1 gives a range of [1, 3]; the table reaches −1.
    answer: 2
  - slug: trig-u02-exam-q09
    type: multiple_choice
    topic_code: "2.3"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    prompt: |
      What is the midline of y = 5 − 2 sin(x + π)?
    options:
      - "y = −2"
      - "y = 5"
      - "y = π"
      - "y = 3"
    option_explanations:
      - |
        −2 is the coefficient of the sine; it gives the amplitude 2 and a reflection, not the midline.
      - |
        Correct. The added constant 5 is the vertical shift, so the midline is y = 5; the graph runs from 3 to 7.
      - |
        π inside the sine is a horizontal shift; it does not move the graph up or down.
      - |
        3 is the minimum value, 5 − 2; the midline is the average of the maximum 7 and the minimum 3.
    answer: 1
  # ---- Tangent, cotangent, secant, cosecant (2.5, 2.6)
  - slug: trig-u02-exam-q10
    type: multiple_choice
    topic_code: "2.5"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    prompt: |
      Where are the vertical asymptotes of y = 2 tan(x − π/4), x in radians? (k is any integer.)
    options:
      - "x = π/2 + kπ"
      - "x = π/4 + kπ"
      - "x = 3π/4 + 2kπ"
      - "x = 3π/4 + kπ"
    option_explanations:
      - |
        These are the asymptotes of tan x before the shift; the graph has moved π/4 to the right.
      - |
        At x = π/4 the inside is 0, so y = 0: this is a zero, the centre of a branch.
      - |
        Tangent's asymptotes repeat every π, not every 2π; this misses half of them.
      - |
        Correct. x − π/4 = π/2 + kπ gives x = 3π/4 + kπ. The factor 2 does not move the asymptotes.
    answer: 3
  - slug: trig-u02-exam-q11
    type: multiple_choice
    topic_code: "2.5"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    prompt: |
      Where are the zeros of y = cot(2x), x in radians? (k is any integer.)
    options:
      - "x = π/4 + kπ/2"
      - "x = kπ/2"
      - "x = π/2 + kπ"
      - "x = kπ"
    option_explanations:
      - |
        Correct. cot(2x) = cos(2x)/sin(2x) is 0 where cos(2x) = 0: 2x = π/2 + kπ, so x = π/4 + kπ/2.
      - |
        At x = kπ/2, sin(2x) = 0 and cot(2x) is undefined: these are the asymptotes.
      - |
        These are the zeros of cot x; the 2 inside halves the spacing.
      - |
        At x = kπ, sin(2x) = 0, so these are asymptotes of cot(2x), not zeros.
    answer: 0
  - slug: trig-u02-exam-q12
    type: multiple_choice
    topic_code: "2.6"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    prompt: |
      What is the range of y = 3 sec x?
    options:
      - "[−3, 3]"
      - "y ≤ −1 or y ≥ 1"
      - "y ≤ −3 or y ≥ 3"
      - "All real numbers"
    option_explanations:
      - |
        [−3, 3] is the range of the guide function 3 cos x; secant takes exactly the values outside it.
      - |
        That is the range of sec x; the factor 3 stretches the branches away from the x-axis.
      - |
        Correct. |sec x| ≥ 1, so |3 sec x| ≥ 3: the U-shaped branches turn at y = 3 and y = −3.
      - |
        Secant never takes values strictly between −1 and 1, so 3 sec x misses (−3, 3).
    answer: 2
  - slug: trig-u02-exam-q13
    type: multiple_choice
    topic_code: "2.6"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    prompt: |
      On the interval (0, π), the graph of y = csc x has a turning point. Which point is it?
    options:
      - "A local minimum at (π/2, 1)"
      - "A local maximum at (π/2, 1)"
      - "A local minimum at (π/2, 0)"
      - "A local minimum at (π/4, √2/2)"
    option_explanations:
      - |
        Correct. sin x reaches its maximum 1 at π/2, so its reciprocal reaches its smallest value there, 1, and rises towards the asymptotes at 0 and π.
      - |
        The branch is U-shaped: near x = 0 and x = π, csc x grows without bound, so (π/2, 1) is a minimum.
      - |
        csc x is never 0; it is a reciprocal of sine, so its values have size at least 1.
      - |
        csc(π/4) = 1/sin(π/4) = √2 ≈ 1.414, not √2/2, and it is not the turning point.
    answer: 0
  # ---- Stimulus set B: a hypothetical tide (2.7)
  - slug: trig-u02-exam-q14
    type: multiple_choice
    topic_code: "2.7"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    stimulus: |
      At a hypothetical harbour, the water depth varies sinusoidally between 1.2 m at low tide and 6.8 m at high tide. One high tide occurs at t = 4, where t is hours after midnight, and the time from one high tide to the next is 12.4 hours.
    prompt: |
      Which function models the depth D(t) in metres?
    options:
      - "D(t) = 4 + 5.6 cos(2π(t − 4)/12.4)"
      - "D(t) = 4 + 2.8 cos(2π(t + 4)/12.4)"
      - "D(t) = 4 + 2.8 sin(2π(t − 4)/12.4)"
      - "D(t) = 4 + 2.8 cos(2π(t − 4)/12.4)"
    option_explanations:
      - |
        5.6 is the full range, 6.8 − 1.2; the amplitude is half of it, 2.8.
      - |
        (t + 4) puts the cosine's maximum at t = −4, which is not a high-tide time (the high tides are at 4, 16.4, …).
      - |
        Sine is on its midline at t = 4, rising; the model needs the maximum at t = 4.
      - |
        Correct. Midline (6.8 + 1.2)/2 = 4, amplitude 2.8, b = 2π/12.4, and cosine shifted to the high tide at t = 4.
    answer: 3
  - slug: trig-u02-exam-q15
    type: multiple_choice
    topic_code: "2.7"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    stimulus: |
      At a hypothetical harbour, the water depth varies sinusoidally between 1.2 m at low tide and 6.8 m at high tide. One high tide occurs at t = 4, where t is hours after midnight, and the time from one high tide to the next is 12.4 hours.
    prompt: |
      What is the depth at t = 7.1?
    options:
      - "6.8 m"
      - "4 m"
      - "1.2 m"
      - "5.4 m"
    option_explanations:
      - |
        6.8 m is high tide at t = 4; 3.1 hours later the water has fallen.
      - |
        Correct. 7.1 − 4 = 3.1 hours is a quarter of the 12.4-hour period, so the depth is at the midline, 4 m, falling.
      - |
        Low tide comes half a period after high tide, at t = 10.2, not after a quarter period.
      - |
        5.4 m is halfway between the midline and high tide; the cosine is 0 at a quarter period, not 1/2.
    answer: 1
  - slug: trig-u02-exam-q16
    type: multiple_choice
    topic_code: "2.7"
    source: "Original item; Common Core HSF-TF.B.7"
    points: 1
    stimulus: |
      At a hypothetical harbour, the water depth varies sinusoidally between 1.2 m at low tide and 6.8 m at high tide. One high tide occurs at t = 4, where t is hours after midnight, and the time from one high tide to the next is 12.4 hours.
    prompt: |
      (Calculator.) A boat needs more than 5.5 m of water. To the nearest hundredth of an hour, for how long around each high tide is the depth greater than 5.5 m?
    options:
      - "6.20 hours"
      - "1.98 hours"
      - "3.97 hours"
      - "2.02 hours"
    option_explanations:
      - |
        6.20 hours is half the period, the time the depth is above the midline of 4 m, not above 5.5 m.
      - |
        1.98 hours is only the time from 5.5 m up to high tide; the depth stays above 5.5 m for as long again afterwards.
      - |
        Correct. 4 + 2.8 cos u > 5.5 means cos u > 1.5/2.8, so |u| < cos⁻¹(0.5357) ≈ 1.0055. That is |t − 4| < 1.0055 · 12.4/(2π) ≈ 1.984, a span of about 3.97 hours.
      - |
        2.02 is the clock time (about 2:01 a.m.) when the depth first rises above 5.5 m, not the length of the interval.
    answer: 2
  # ---- Models and harmonic motion (2.7, 2.8)
  - slug: trig-u02-exam-q17
    type: multiple_choice
    topic_code: "2.7"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    prompt: |
      A hypothetical observation wheel has radius 12 m, its centre is 14 m above the ground, and it turns once every 4 minutes. A rider boards at the lowest point at t = 0. Which function gives the rider's height in metres after t minutes?
    options:
      - "h(t) = 14 + 12 cos(πt/2)"
      - "h(t) = 12 − 14 cos(πt/2)"
      - "h(t) = 14 − 12 cos(πt/4)"
      - "h(t) = 14 − 12 cos(πt/2)"
    option_explanations:
      - |
        This starts at the top, 26 m; boarding at the bottom needs −cosine.
      - |
        Centre and radius are swapped; this model starts 2 m below the ground.
      - |
        π/4 gives a period of 8 minutes; a 4-minute turn needs b = 2π/4 = π/2.
      - |
        Correct. Midline 14, amplitude 12, b = π/2, and −cosine starts at the minimum, 2 m.
    answer: 3
  - slug: trig-u02-exam-q18
    type: multiple_choice
    topic_code: "2.8"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    prompt: |
      A point on a loudspeaker cone moves with displacement d = 0.2 sin(500πt) millimetres, t in seconds. What is the frequency of the motion?
    options:
      - "250 Hz"
      - "500π Hz"
      - "500 Hz"
      - "0.004 Hz"
    option_explanations:
      - |
        Correct. f = ω/(2π) = 500π/(2π) = 250 cycles per second.
      - |
        500π is ω in radians per second; divide by 2π for cycles per second.
      - |
        This divides 500π by π instead of 2π; each cycle is 2π radians.
      - |
        0.004 s is the period, 1/250; the frequency is its reciprocal.
    answer: 0
  - slug: trig-u02-exam-q19
    type: multiple_choice
    topic_code: "2.8"
    source: "Original item; Common Core HSF-TF.B.5"
    points: 1
    prompt: |
      A weight on a spring is pulled 5 cm below its rest position and released at t = 0. It oscillates with a frequency of 2 Hz. Taking up as positive, which equation gives its displacement d in centimetres after t seconds?
    options:
      - "d = −5 cos(2t)"
      - "d = −5 cos(4πt)"
      - "d = 5 cos(4πt)"
      - "d = −5 sin(4πt)"
    option_explanations:
      - |
        ω is not the frequency; ω = 2πf = 4π. With ω = 2 the frequency would be 1/π Hz.
      - |
        Correct. Starting 5 cm below rest is −5 cos ωt, and ω = 2π(2) = 4π.
      - |
        This starts 5 cm above rest; the weight was pulled below, so the cosine is negated.
      - |
        Sine starts at rest position; this weight starts at an extreme, so cosine is needed.
    answer: 1
  # ---- Stimulus set C: an inverse sine value (2.9, 2.10, 2.12)
  - slug: trig-u02-exam-q20
    type: multiple_choice
    topic_code: "2.9"
    source: "Original item; Common Core HSF-TF.B.6"
    points: 1
    stimulus: |
      Let α = sin⁻¹(−8/17), in radians.
    prompt: |
      In which interval does α lie?
    options:
      - "(π, 3π/2)"
      - "(π/2, π)"
      - "(−π/2, 0)"
      - "(0, π/2)"
    option_explanations:
      - |
        Quadrant III angles have negative sines, but sin⁻¹ only returns angles in [−π/2, π/2].
      - |
        Angles in (π/2, π) have positive sines; the input here is negative.
      - |
        Correct. sin⁻¹ answers in [−π/2, π/2], and a negative input gives an angle below 0: quadrant IV, written as a negative.
      - |
        Angles in quadrant I have positive sines; a negative input needs a negative angle.
    answer: 2
  - slug: trig-u02-exam-q21
    type: multiple_choice
    topic_code: "2.10"
    source: "Original item; Common Core HSF-TF.B.6"
    points: 1
    stimulus: |
      Let α = sin⁻¹(−8/17), in radians.
    prompt: |
      What is the exact value of cos α?
    options:
      - "15/17"
      - "−15/17"
      - "8/15"
      - "−8/17"
    option_explanations:
      - |
        Correct. Opposite −8, hypotenuse 17, so adjacent √(289 − 64) = 15; cosine is positive in quadrant IV.
      - |
        α is in quadrant IV, where cosine (the x-coordinate) is positive.
      - |
        8/15 is the size of the tangent, opposite over adjacent, not the cosine.
      - |
        −8/17 is sin α, the number the inverse function was given.
    answer: 0
  - slug: trig-u02-exam-q22
    type: multiple_choice
    topic_code: "2.10"
    source: "Original item; Common Core HSF-TF.B.6"
    points: 1
    stimulus: |
      Let α = sin⁻¹(−8/17), in radians.
    prompt: |
      What is the exact value of tan α?
    options:
      - "8/15"
      - "−15/8"
      - "−8/17"
      - "−8/15"
    option_explanations:
      - |
        The size is right, but tangent is negative in quadrant IV (y negative, x positive).
      - |
        −15/8 is adjacent over opposite, the cotangent of α.
      - |
        −8/17 is the sine; tangent divides the opposite side by the adjacent side, 15.
      - |
        Correct. tan α = sin α/cos α = (−8/17)/(15/17) = −8/15.
    answer: 3
  - slug: trig-u02-exam-q23
    type: multiple_choice
    topic_code: "2.12"
    source: "Original item; Common Core HSF-TF.B.6 (extension)"
    points: 1
    stimulus: |
      Let α = sin⁻¹(−8/17), in radians.
    prompt: |
      Using the range (0, π) for inverse cotangent, which expression equals cot⁻¹(cot α)?
    options:
      - "α"
      - "α + π"
      - "−α"
      - "π − α"
    option_explanations:
      - |
        α is negative, so it is outside (0, π); cot⁻¹ cannot return it.
      - |
        Correct. Cotangent has period π, so cot(α + π) = cot α, and α + π ≈ 2.65 lies in (0, π).
      - |
        −α ≈ 0.49 is in (0, π), but cot(−α) = −cot α, the opposite value.
      - |
        π − α ≈ 3.63 is greater than π, outside the range of cot⁻¹.
    answer: 1
  # ---- Inverse functions and compositions (2.9, 2.10)
  - slug: trig-u02-exam-q24
    type: multiple_choice
    topic_code: "2.9"
    source: "Original item; Common Core HSF-TF.B.6"
    points: 1
    prompt: |
      What is the exact value of sin⁻¹(−1), in radians?
    options:
      - "3π/2"
      - "π"
      - "−π/2"
      - "−1"
    option_explanations:
      - |
        sin(3π/2) = −1, but 3π/2 is outside the range [−π/2, π/2].
      - |
        sin π = 0, not −1; π is where cosine equals −1.
      - |
        Correct. −π/2 is in [−π/2, π/2] and sin(−π/2) = −1.
      - |
        −1 is the input, a sine value; sin⁻¹ returns an angle, and sin(−1 radian) ≈ −0.84.
    answer: 2
