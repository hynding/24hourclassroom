week: 12
unit: 2
title: "Inverse Reciprocal Functions, Sums of Sinusoids and Damping"
topics: ["2.11", "2.12"]
guide: guides/week-12.md
guide_description: |
  The inverse cotangent, secant and cosecant functions with this course's range conventions (cot⁻¹ in (0, π),
  sec⁻¹ in [0, π] without π/2, csc⁻¹ in [−π/2, π/2] without 0), evaluated by rewriting as cos⁻¹(1/x),
  sin⁻¹(1/x) and π/2 − tan⁻¹ x; then adding ordinates to graph sums such as sin x + cos x and x + sin x, the
  period of a sum of sinusoids, damped oscillation a e^(−ct) cos ωt with its envelopes, and beats. Worked
  examples: five exact inverse values, sec⁻¹(−3) and cot⁻¹(−0.5) by calculator, sin(sec⁻¹(−3)), a table for
  sin x + cos x, the envelope of e^(−0.2t) cos t, and a hypothetical damped spring.
flashcards_description: |
  30 cards on the range conventions and calculator rewrites for cot⁻¹, sec⁻¹ and csc⁻¹, exact values and
  compositions, adding ordinates, periods of sums, damped oscillation, envelopes and beats.

flashcards:
  - front: Range of cot⁻¹ x in this course → interval
    back: |
      (0, π). cot⁻¹ x is defined for every real x.
    topic_code: "2.12"
  - front: Range of sec⁻¹ x in this course → interval
    back: |
      [0, π], excluding π/2 (where secant is undefined). Domain: x ≤ −1 or x ≥ 1.
    topic_code: "2.12"
  - front: Range of csc⁻¹ x in this course → interval
    back: |
      [−π/2, π/2], excluding 0. Domain: x ≤ −1 or x ≥ 1.
    topic_code: "2.12"
  - front: sec⁻¹ x on a calculator → rewrite
    back: |
      sec⁻¹ x = cos⁻¹(1/x), for |x| ≥ 1.
    topic_code: "2.12"
  - front: csc⁻¹ x on a calculator → rewrite
    back: |
      csc⁻¹ x = sin⁻¹(1/x), for |x| ≥ 1.
    topic_code: "2.12"
  - front: cot⁻¹ x on a calculator → rewrite valid for every x
    back: |
      cot⁻¹ x = π/2 − tan⁻¹ x. (tan⁻¹(1/x) works only for x > 0.)
    topic_code: "2.12"
  - front: cot⁻¹(−1) → value and why not −π/4
    back: |
      3π/4. cot⁻¹ answers in (0, π), so a negative input gives a quadrant II angle.
    topic_code: "2.12"
  - front: sec⁻¹(−√2) → value
    back: |
      cos⁻¹(−√2/2) = 3π/4.
    topic_code: "2.12"
  - front: csc⁻¹(−2) → value
    back: |
      sin⁻¹(−1/2) = −π/6.
    topic_code: "2.12"
  - front: cot⁻¹(√3) → value
    back: |
      π/6, since cot(π/6) = (√3/2)/(1/2) = √3.
    topic_code: "2.12"
  - front: cot⁻¹ 0 → value
    back: |
      π/2: cot(π/2) = cos(π/2)/sin(π/2) = 0.
    topic_code: "2.12"
  - front: sec⁻¹(0.5) → value
    back: |
      Undefined: |sec θ| ≥ 1 for every θ, so 0.5 is not in the domain.
    topic_code: "2.12"
  - front: cot⁻¹(−0.5) by calculator → value
    back: |
      π/2 − tan⁻¹(−0.5) ≈ 2.034, a quadrant II angle.
    topic_code: "2.12"
  - front: sin(sec⁻¹(−3)) → exact value
    back: |
      cos θ = −1/3 in quadrant II, so y = √8 = 2√2 and sin θ = 2√2/3.
    topic_code: "2.12"
  - front: tan(csc⁻¹(−5/3)) → exact value
    back: |
      sin θ = −3/5 in quadrant IV: x = 4, so tan θ = −3/4.
    topic_code: "2.12"
  - front: Addition of ordinates → method
    back: |
      Graph y = f(x) + g(x) by adding the two y-values at each x; where one function is 0, the sum equals the other.
    topic_code: "2.11"
  - front: y = sin x + cos x at x = π/4 → value
    back: |
      √2/2 + √2/2 = √2 ≈ 1.414, the maximum of the sum.
    topic_code: "2.11"
  - front: y = sin x + cos x as one sinusoid → equation
    back: |
      √2 sin(x + π/4): amplitude √2, period 2π, shifted π/4 left.
    topic_code: "2.11"
  - front: Period of y = sin x + sin 2x → value and reason
    back: |
      2π, the least common multiple of 2π and π, the first time both pieces repeat together.
    topic_code: "2.11"
  - front: Period of y = sin 2x + cos 3x → value
    back: |
      Periods π and 2π/3 first line up at 2π.
    topic_code: "2.11"
  - front: y = x + sin x → the band it stays in
    back: |
      Between y = x − 1 and y = x + 1, oscillating about y = x. Not periodic.
    topic_code: "2.11"
  - front: Envelope of y = a e^(−ct) cos ωt → curves
    back: |
      y = a e^(−ct) and y = −a e^(−ct), touched where cos ωt = ±1.
    topic_code: "2.11"
  - front: Effect of damping on the zeros of a cos ωt → effect
    back: |
      None: the zeros are still where cos ωt = 0, spaced π/ω apart. Only the heights shrink.
    topic_code: "2.11"
  - front: y = e^(−0.2t) cos t at t = 2π → value
    back: |
      e^(−0.4π) ≈ 0.285, a point on the upper envelope.
    topic_code: "2.11"
  - front: When does e^(−0.2t) fall below 0.1? → time
    back: |
      −0.2t < ln 0.1, so t > 5 ln 10 ≈ 11.51.
    topic_code: "2.11"
  - front: d(t) = 8e^(−0.5t) cos(2πt) at t = 1 and t = 2 → values and their ratio
    back: |
      ≈ 4.85 and ≈ 2.94, both on the upper envelope; each is e^(−0.5) ≈ 0.607 of the value one second earlier.
    topic_code: "2.11"
  - front: Tones of 440 Hz and 444 Hz together → beat frequency
    back: |
      |444 − 440| = 4 beats per second: the loudness swells and fades 4 times a second.
    topic_code: "2.11"
  - front: Error-spot → "cot⁻¹(−2) = tan⁻¹(−1/2) ≈ −0.464"
    back: |
      cot⁻¹ answers in (0, π). The correct value is π/2 − tan⁻¹(−2) ≈ 2.678.
    topic_code: "2.12"
  - front: Error-spot → "sec⁻¹ 2 = 1/cos⁻¹ 2"
    back: |
      Take the reciprocal of the input, not the output: sec⁻¹ 2 = cos⁻¹(1/2) = π/3. (cos⁻¹ 2 does not exist.)
    topic_code: "2.12"
  - front: Error-spot → "sin x + sin 2x has period 3π"
    back: |
      Periods are not added. The sum repeats after the least common multiple of 2π and π: 2π.
    topic_code: "2.11"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 2.11 and 2.12: damped oscillation and
    envelopes, sums of sinusoids, inverse cotangent, secant and cosecant), with a third reviewing weeks 6–11
    (Pythagorean identity, amplitude and period, cosecant graphs, models, frequency, inverse sine and cosine,
    compositions). Includes a shared-context set on a hypothetical damped spring. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the
    short answers and the long answer are graded by your teacher against the scoring notes. Items marked
    (Calculator.) need a calculator in radian mode; the rest are designed to be done by hand.
  questions:
    # ---- Stimulus set: a hypothetical damped spring (2.11)
    - slug: trig-u02-w12-q01
      type: multiple_choice
      topic_code: "2.11"
      source: "Original item; Common Core HSF-TF.B.5 (extension)"
      points: 1
      stimulus: |
        A hypothetical damped spring has displacement d(t) = 6e^(−0.4t) cos(πt) centimetres from its rest position, t seconds after release.
      prompt: |
        Which pair of curves forms the envelope of the graph of d?
      options:
        - "y = ±6 cos(πt)"
        - "y = ±6e^(−0.4t)"
        - "y = ±e^(−0.4t)"
        - "y = ±6e^(0.4t)"
      option_explanations:
        - |
          ±6 cos(πt) is the undamped oscillation itself; the envelope is the shrinking amplitude that multiplies the cosine.
        - |
          Correct. Since −1 ≤ cos(πt) ≤ 1, d stays between −6e^(−0.4t) and 6e^(−0.4t), touching them where cos(πt) = ±1.
        - |
          The factor 6 belongs to the envelope too: at t = 0 the spring starts 6 cm from rest, not 1 cm.
        - |
          A positive exponent would make the envelope grow; the spring loses energy, so the exponent is −0.4t.
      answer: 1
    - slug: trig-u02-w12-q02
      type: multiple_choice
      topic_code: "2.11"
      source: "Original item; Common Core HSF-TF.B.5 (extension)"
      points: 1
      stimulus: |
        A hypothetical damped spring has displacement d(t) = 6e^(−0.4t) cos(πt) centimetres from its rest position, t seconds after release.
      prompt: |
        How much time passes between successive points where the graph of d touches its upper envelope?
      options:
        - "π s"
        - "0.4 s"
        - "1 s"
        - "2 s"
      option_explanations:
        - |
          π is ω, the coefficient of t inside the cosine; the time per cycle is 2π/ω.
        - |
          0.4 is the damping constant; it controls how fast the heights shrink, not how often the cycle repeats.
        - |
          1 s is half a cycle: from touching the upper envelope to touching the lower one, where cos(πt) = −1.
        - |
          Correct. The graph touches the upper envelope where cos(πt) = 1, every 2π/π = 2 s; damping does not change this spacing.
      answer: 3
    - slug: trig-u02-w12-q03
      type: multiple_choice
      topic_code: "2.11"
      source: "Original item; Common Core HSF-TF.B.5 (extension)"
      points: 1
      stimulus: |
        A hypothetical damped spring has displacement d(t) = 6e^(−0.4t) cos(πt) centimetres from its rest position, t seconds after release.
      prompt: |
        (Calculator.) What is d(2), to the nearest hundredth of a centimetre?
      options:
        - "6.00 cm"
        - "4.02 cm"
        - "2.70 cm"
        - "−2.70 cm"
      option_explanations:
        - |
          6.00 ignores the damping factor: cos(2π) = 1, but e^(−0.8) ≈ 0.449 shrinks the height.
        - |
          4.02 is 6e^(−0.4), the damping after only 1 second; at t = 2 the exponent is −0.8.
        - |
          Correct. d(2) = 6e^(−0.8) cos(2π) = 6e^(−0.8) ≈ 2.70 cm, a point on the upper envelope.
        - |
          cos(2π) = 1, not −1, so d(2) is positive: the spring is above rest, on the upper envelope.
      answer: 2
    - slug: trig-u02-w12-q04
      type: multiple_choice
      topic_code: "2.11"
      source: "Original item; Common Core HSF-TF.B.5 (extension)"
      points: 1
      stimulus: |
        A hypothetical damped spring has displacement d(t) = 6e^(−0.4t) cos(πt) centimetres from its rest position, t seconds after release.
      prompt: |
        (Calculator.) After about what time does the envelope stay below 1 cm?
      options:
        - "t ≈ 4.48 s"
        - "t ≈ 1.95 s"
        - "t ≈ 0.72 s"
        - "t ≈ 15 s"
      option_explanations:
        - |
          Correct. 6e^(−0.4t) < 1 means e^(−0.4t) < 1/6, so −0.4t < ln(1/6) and t > ln 6/0.4 ≈ 4.48 s.
        - |
          This uses the common logarithm, log 6/0.4. Undoing e needs the natural logarithm, ln.
        - |
          This multiplies 0.4 by ln 6 instead of dividing ln 6 by 0.4.
        - |
          6/0.4 = 15 treats the decay as linear, losing 0.4 cm each second; exponential decay is faster at first.
      answer: 0
    # ---- Inverse reciprocal functions and sums (2.11, 2.12)
    - slug: trig-u02-w12-q05
      type: multiple_choice
      topic_code: "2.12"
      source: "Original item; Common Core HSF-TF.B.6 (extension)"
      points: 1
      prompt: |
        Using the range [0, π] excluding π/2 for inverse secant, what is the exact value of sec⁻¹(−2)?
      options:
        - "−π/3"
        - "2π/3"
        - "4π/3"
        - "π/3"
      option_explanations:
        - |
          sec⁻¹ never returns a negative angle in this convention; also sec(−π/3) = 2, not −2.
        - |
          Correct. sec⁻¹(−2) = cos⁻¹(−1/2) = 2π/3, and sec(2π/3) = 1/(−1/2) = −2.
        - |
          sec(4π/3) = −2 as well, but 4π/3 is outside the range [0, π].
        - |
          sec(π/3) = 2; a negative input needs a quadrant II angle.
      answer: 1
    - slug: trig-u02-w12-q06
      type: multiple_choice
      topic_code: "2.12"
      source: "Original item; Common Core HSF-TF.B.6 (extension)"
      points: 1
      prompt: |
        Using the range (0, π) for inverse cotangent, what is the exact value of cot⁻¹(−√3)?
      options:
        - "−π/6"
        - "π/6"
        - "−π/3"
        - "5π/6"
      option_explanations:
        - |
          This is tan⁻¹(1/(−√3)), which lands in quadrant IV; cot⁻¹ must answer in (0, π).
        - |
          cot(π/6) = +√3; the negative input needs a quadrant II angle.
        - |
          −π/3 is tan⁻¹(−√3), mixing up cotangent with tangent, and it is outside (0, π).
        - |
          Correct. cot(5π/6) = (−√3/2)/(1/2) = −√3, and 5π/6 is in (0, π). Check: π/2 − tan⁻¹(−√3) = π/2 + π/3 = 5π/6.
      answer: 3
    - slug: trig-u02-w12-q07
      type: multiple_choice
      topic_code: "2.12"
      source: "Original item; Common Core HSF-TF.B.6 (extension)"
      points: 1
      prompt: |
        In this course's convention, what is the range of y = sec⁻¹ x?
      options:
        - "[0, π], excluding π/2"
        - "[−π/2, π/2], excluding 0"
        - "(0, π)"
        - "x ≤ −1 or x ≥ 1"
      option_explanations:
        - |
          Correct. sec⁻¹ x = cos⁻¹(1/x), so it shares the range of cos⁻¹, minus π/2, where secant is undefined.
        - |
          This is the range of csc⁻¹, which follows sin⁻¹ with 0 removed.
        - |
          (0, π) is the range of cot⁻¹; sec⁻¹ includes 0 and π (sec⁻¹ 1 = 0, sec⁻¹(−1) = π).
        - |
          These are the inputs sec⁻¹ accepts, its domain, not the angles it returns.
      answer: 0
    - slug: trig-u02-w12-q08
      type: multiple_choice
      topic_code: "2.11"
      source: "Original item; Common Core HSF-TF.B.5 (extension)"
      points: 1
      prompt: |
        What is the period of y = sin(2x) + cos(3x), x in radians?
      options:
        - "π"
        - "5π/3"
        - "2π"
        - "2π/3"
      option_explanations:
        - |
          π is the period of sin(2x) alone; cos(3x) is not back to its start at x = π.
        - |
          5π/3 adds the two periods, π + 2π/3. A sum repeats when both pieces repeat together.
        - |
          Correct. The periods are π and 2π/3; the smallest length that is a whole number of each is 2π (2 and 3 cycles).
        - |
          2π/3 is the period of cos(3x) alone; sin(2x) has not finished a whole number of cycles by then.
      answer: 2
    # ---- Spiral review
    - slug: trig-u02-w12-q09
      type: multiple_choice
      topic_code: "1.12"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        If sin θ = 3/5 and θ is in quadrant II, what is cos θ?
      options:
        - "4/5"
        - "−4/5"
        - "−3/4"
        - "−5/4"
      option_explanations:
        - |
          sin²θ + cos²θ = 1 gives |cos θ| = 4/5, but cosine is negative in quadrant II.
        - |
          Correct. cos²θ = 1 − 9/25 = 16/25, and in quadrant II cosine is negative: −4/5.
        - |
          −3/4 is tan θ, sine over cosine, not the cosine itself.
        - |
          −5/4 is sec θ, the reciprocal of the cosine.
      answer: 1
    - slug: trig-u02-w12-q10
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        What are the amplitude and period of y = −3 cos(x/2), x in radians?
      options:
        - "Amplitude 3, period 4π"
        - "Amplitude −3, period 4π"
        - "Amplitude 3, period π"
        - "Amplitude 3/2, period 2π"
      option_explanations:
        - |
          Correct. Amplitude |−3| = 3, and period 2π/(1/2) = 4π.
        - |
          Amplitude is a distance, |a|, so it is never negative; the sign reflects the graph.
        - |
          π comes from multiplying 2π by 1/2; the period divides 2π by b = 1/2.
        - |
          This divides the amplitude by 2 as well; the 1/2 inside affects only the period.
      answer: 0
    - slug: trig-u02-w12-q11
      type: multiple_choice
      topic_code: "2.9"
      source: "Original item; Common Core HSF-TF.B.6"
      points: 1
      prompt: |
        What is the exact value of sin⁻¹(−√3/2), in radians?
      options:
        - "4π/3"
        - "−π/6"
        - "5π/3"
        - "−π/3"
      option_explanations:
        - |
          sin(4π/3) = −√3/2, but 4π/3 is outside [−π/2, π/2], the range of sin⁻¹.
        - |
          sin(−π/6) = −1/2; the input −√3/2 belongs to the reference angle π/3.
        - |
          5π/3 is coterminal with the answer but outside the range [−π/2, π/2].
        - |
          Correct. −π/3 is in [−π/2, π/2] and sin(−π/3) = −√3/2.
      answer: 3
    - slug: trig-u02-w12-q12
      type: multiple_choice
      topic_code: "2.10"
      source: "Original item; Common Core HSF-TF.B.6"
      points: 1
      prompt: |
        What is the exact value of cos(sin⁻¹(−5/13))?
      options:
        - "−12/13"
        - "−5/12"
        - "12/13"
        - "−5/13"
      option_explanations:
        - |
          sin⁻¹(−5/13) is in quadrant IV, where cosine is positive.
        - |
          −5/12 is the tangent of the angle, opposite over adjacent.
        - |
          Correct. Opposite −5, hypotenuse 13, adjacent 12; in quadrant IV the cosine is +12/13.
        - |
          −5/13 is the sine of the angle, which the inverse function was given.
      answer: 2
    - slug: trig-u02-w12-q13
      type: multiple_choice
      topic_code: "2.6"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        Where are the vertical asymptotes of y = csc(2x), x in radians? (k is any integer.)
      options:
        - "x = kπ"
        - "x = kπ/2"
        - "x = π/4 + kπ/2"
        - "x = π/2 + kπ"
      option_explanations:
        - |
          These are the asymptotes of csc x. With 2x inside, sin(2x) = 0 twice as often.
        - |
          Correct. csc(2x) = 1/sin(2x) is undefined where 2x = kπ, so x = kπ/2.
        - |
          At x = π/4 + kπ/2, sin(2x) = ±1 and csc(2x) = ±1: these are the turning points, not asymptotes.
        - |
          These are where cos x = 0, the asymptotes of sec x, not of csc(2x).
      answer: 1
    - slug: trig-u02-w12-q14
      type: multi_select
      topic_code: "2.11"
      source: "Original item; Common Core HSF-TF.B.5 (extension)"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the graphs of y = x + sin x and y = e^(−0.2t) cos t are true? Select all that apply.
      options:
        - "y = x + sin x is periodic with period 2π."
        - "The graph of y = x + sin x stays between the lines y = x − 1 and y = x + 1."
        - "The graph of y = e^(−0.2t) cos t touches the curve y = e^(−0.2t) wherever cos t = 1."
        - "The zeros of y = e^(−0.2t) cos t are where e^(−0.2t) = 0."
        - "Multiplying by e^(−0.2t) leaves the spacing between the zeros of cos t unchanged."
      option_explanations:
        - |
          Its values keep growing with x (it never repeats them), so it is not periodic; only its wiggle about y = x repeats.
        - |
          Correct. −1 ≤ sin x ≤ 1, so x − 1 ≤ x + sin x ≤ x + 1.
        - |
          Correct. Where cos t = 1 the product equals e^(−0.2t), the upper envelope.
        - |
          e^(−0.2t) is always positive and is never 0; the zeros come from cos t = 0.
        - |
          Correct. The zeros are still at t = π/2 + kπ, spaced π apart; damping shrinks only the heights.
      answer: [1, 2, 4]
    - slug: trig-u02-w12-q15
      type: multi_select
      topic_code: "2.12"
      source: "Original item; Common Core HSF-TF.B.6 (extension)"
      points: 2
      partial_credit: true
      prompt: |
        Using this course's range conventions for inverse cotangent, secant and cosecant, which statements are true? Select all that apply.
      options:
        - "sec⁻¹ x = cos⁻¹(1/x) for every x with |x| ≥ 1."
        - "cot⁻¹(−1) = −π/4"
        - "csc⁻¹(0.5) is undefined."
        - "sec⁻¹ x = 1/cos⁻¹ x"
        - "The range of csc⁻¹ x includes 0."
      option_explanations:
        - |
          Correct. If sec θ = x then cos θ = 1/x, and the range of sec⁻¹ matches that of cos⁻¹ apart from π/2.
        - |
          cot⁻¹ answers in (0, π): cot⁻¹(−1) = 3π/4. −π/4 is what tan⁻¹(1/(−1)) gives.
        - |
          Correct. |csc θ| ≥ 1 for every θ, so no angle has cosecant 0.5.
        - |
          The reciprocal goes on the input, not the output: sec⁻¹ 2 = cos⁻¹(1/2) = π/3, while 1/cos⁻¹ 2 does not exist.
        - |
          csc 0 is undefined (sin 0 = 0), so 0 is removed from the range [−π/2, π/2].
      answer: [0, 2]
    - slug: trig-u02-w12-q16
      type: true_false
      topic_code: "2.12"
      source: "Original item; Common Core HSF-TF.B.6 (extension)"
      points: 1
      prompt: |
        True or false: For every negative number x, cot⁻¹ x = tan⁻¹(1/x).
      answer: false
      explanation: |
        False. For x < 0, tan⁻¹(1/x) is a negative angle, but cot⁻¹ x lies in (0, π). The two differ by π: cot⁻¹ x = π + tan⁻¹(1/x) for x < 0. For example cot⁻¹(−1) = 3π/4 while tan⁻¹(−1) = −π/4. The formula π/2 − tan⁻¹ x works for every x.
    - slug: trig-u02-w12-q17
      type: true_false
      topic_code: "2.7"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        True or false: If high tide is at 3:00 a.m. and the next low tide is at 9:20 a.m., a sinusoidal model of the tide has a period of 6 hours 20 minutes.
      answer: false
      explanation: |
        False. High tide to the next low tide is half a cycle, so the period is twice 6 hours 20 minutes: 12 hours 40 minutes.
    - slug: trig-u02-w12-q18
      type: fill_blank
      topic_code: "2.12"
      source: "Original item; Common Core HSF-TF.B.6 (extension)"
      points: 1
      prompt: |
