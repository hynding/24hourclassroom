    - slug: trig-u02-w12-q22
      type: short_answer
      topic_code: "2.11"
      source: "Original item; Common Core HSF-TF.B.5 (extension)"
      points: 3
      prompt: |
        Let f(x) = sin x + cos x, x in radians.

        (a) Find f(0), f(π/4) and f(π/2) exactly, by adding ordinates.
        (b) State the maximum value of f and an x in [0, 2π) where it occurs, and explain why f has period 2π.
        (c) Show that f(3π/4) and √2 sin(3π/4 + π/4) are equal, as they should be if f(x) = √2 sin(x + π/4).
      answer: |
        (a) f(0) = 0 + 1 = 1; f(π/4) = √2/2 + √2/2 = √2; f(π/2) = 1 + 0 = 1.
        (b) Maximum √2 at x = π/4. Both sin x and cos x have period 2π, so their sum repeats every 2π (and the single-sinusoid form √2 sin(x + π/4) also has period 2π).
        (c) f(3π/4) = √2/2 + (−√2/2) = 0, and √2 sin(π) = 0. They agree.
      explanation: |
        Three points, one per part. (a) all three values. (b) √2 at π/4 with a reason for the period. (c) both computations, each 0.
    - slug: trig-u02-w12-q23
      type: short_answer
      topic_code: "2.12"
      source: "Original item; Common Core HSF-TF.B.6 (extension)"
      points: 3
      prompt: |
        Use the range [0, π] excluding π/2 for inverse secant.

        (a) Explain why sec⁻¹(0.5) is undefined.
        (b) Rewrite sec⁻¹(−√2) using inverse cosine and find its exact value.
        (c) Find the exact value of tan(sec⁻¹(−3)), and explain its sign.
      answer: |
        (a) sec θ = 1/cos θ and |cos θ| ≤ 1, so |sec θ| ≥ 1 for every θ: no angle has secant 0.5, so 0.5 is not in the domain of sec⁻¹.
        (b) sec⁻¹(−√2) = cos⁻¹(−1/√2) = cos⁻¹(−√2/2) = 3π/4.
        (c) Let θ = sec⁻¹(−3): cos θ = −1/3 with θ in [0, π], so θ is in quadrant II. With x = −1, r = 3, y = √8 = 2√2, tan θ = 2√2/(−1) = −2√2. Tangent is negative in quadrant II.
      explanation: |
        Three points, one per part. (a) a reason based on |sec θ| ≥ 1 (or 1/0.5 = 2 being outside the domain of cos⁻¹). (b) cos⁻¹(−√2/2) = 3π/4. (c) −2√2 with the quadrant II reason.
    - slug: trig-u02-w12-q24
      type: long_answer
      topic_code: "2.11"
      source: "Original item; Common Core HSF-TF.B.5 (extension)"
      points: 6
      prompt: |
        After a hypothetical car hits a bump, the vertical displacement of its body from rest is modelled by d(t) = 10e^(−0.8t) cos(2πt) centimetres, t seconds after the bump.

        (A) (i) Write the equations of the two envelope curves.
        (ii) Find d(0) and, to the nearest hundredth, d(1) and d(0.5). Explain what d(1) shows about the effect of damping over one cycle.

        (B) (i) Find the two zeros of d in the interval 0 < t < 1.
        (ii) State the period and frequency of the oscillation, and explain why the damping factor does not change them.

        (C) (Calculator.) (i) Find, to the nearest hundredth of a second, when the envelope falls to 1 cm.
        (ii) A design target says the envelope must fall to 1 cm within 2 seconds. Keeping the form 10e^(−ct) cos(2πt), find the smallest damping constant c that meets the target, to the nearest hundredth.
      answer: |
        (A) (i) y = 10e^(−0.8t) and y = −10e^(−0.8t).
        (ii) d(0) = 10 cos 0 = 10. d(1) = 10e^(−0.8) cos(2π) ≈ 4.49. d(0.5) = 10e^(−0.4) cos(π) ≈ −6.70. t = 1 is one period after t = 0, and both are points where the graph touches the upper envelope: the height there has fallen from 10 cm to about 4.49 cm, so each cycle keeps only e^(−0.8) ≈ 45% of the previous height.
        (B) (i) cos(2πt) = 0 when 2πt = π/2 or 3π/2: t = 0.25 and t = 0.75.
        (ii) Period 2π/(2π) = 1 s; frequency 1 Hz. The zeros and the times where the graph touches its envelopes are set by cos(2πt); e^(−0.8t) is always positive, so it scales the heights without moving those times.
        (C) (i) 10e^(−0.8t) = 1 gives e^(−0.8t) = 0.1, so t = ln 10/0.8 ≈ 2.88 s.
        (ii) 10e^(−2c) ≤ 1 means e^(−2c) ≤ 0.1, so 2c ≥ ln 10 and c ≥ ln 10/2 ≈ 1.15. The smallest damping constant is about 1.15 (more than the current 0.8).
      explanation: |
        Six points. (A) 1 point for both envelopes; 1 point for 10, 4.49 and −6.70 with the interpretation of d(1) as a shrunken height one cycle later. (B) 1 point for t = 0.25 and 0.75; 1 point for period 1 s, frequency 1 Hz and a reason (zeros come from the cosine; the exponential factor is never 0). (C) 1 point for 2.88 s; 1 point for c ≈ 1.15 with correct work (accept 1.16 if the student rounds up to guarantee the target).
