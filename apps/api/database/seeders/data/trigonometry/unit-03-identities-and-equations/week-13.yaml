week: 13
unit: 3
title: "Simplifying Trigonometric Expressions"
topics: ["3.1", "3.2"]
guide: guides/week-13.md
guide_description: |
  The reciprocal, quotient and Pythagorean identities as rewriting rules; converting to sines and cosines;
  factoring common factors, differences of squares and trinomials that are quadratic in sin x; combining
  trigonometric fractions over a common denominator; clearing 1 − cos x with a conjugate; and the
  substitution x = 3 sin θ, where a restricted range removes an absolute value. Worked examples:
  (sec x − cos x)/sin x = tan x, (1 − sin²x)(1 + tan²x) = 1, sin⁴x − cos⁴x, (2 sin²x + sin x − 1)/(sin x + 1),
  cos x/(1 + sin x) + (1 + sin x)/cos x = 2 sec x, and sin x/(1 − cos x) = csc x + cot x.
flashcards_description: |
  31 cards on the Pythagorean substitutions, rewriting in sines and cosines, factoring trigonometric
  expressions, common denominators, conjugates, domain restrictions after cancelling, and the errors that
  cost the most points.

flashcards:
  - front: 1 − sin²x → single square it equals
    back: |
      cos²x, from sin²x + cos²x = 1. Read the identity right to left whenever you see 1 minus a square.
    topic_code: "3.1"
  - front: 1 − cos²x → single square it equals
    back: |
      sin²x. It turns the numerator of (1 − cos²x)/cos x into sin²x/cos x.
    topic_code: "3.1"
  - front: sec²x − 1 → single square it equals
    back: |
      tan²x. Divide sin²x + cos²x = 1 by cos²x to get tan²x + 1 = sec²x, then subtract 1.
    topic_code: "3.1"
  - front: csc²x − 1 → single square it equals
    back: |
      cot²x. Divide sin²x + cos²x = 1 by sin²x to get 1 + cot²x = csc²x.
    topic_code: "3.1"
  - front: Default strategy when an expression has tan, sec, csc, cot → first move
    back: |
      Rewrite every function in sines and cosines, then clear compound fractions. Not always shortest, but it always gives you something to simplify.
    hint: tan = sin/cos, sec = 1/cos, csc = 1/sin, cot = cos/sin
    topic_code: "3.1"
  - front: (sec x − cos x)/sin x → simplified form
    back: |
      sec x − cos x = (1 − cos²x)/cos x = sin²x/cos x; dividing by sin x leaves sin x/cos x = tan x.
    topic_code: "3.1"
  - front: (1 − sin²x)(1 + tan²x) → simplified form
    back: |
      cos²x · sec²x = 1, wherever cos x ≠ 0.
    topic_code: "3.1"
  - front: csc x tan x → simplified form
    back: |
      (1/sin x)(sin x/cos x) = 1/cos x = sec x.
    topic_code: "3.1"
  - front: cot x sec x sin x → simplified form
    back: |
      (cos x/sin x)(1/cos x)(sin x) = 1, wherever sin x and cos x are nonzero.
    topic_code: "3.1"
  - front: (cos x sin²x + cos³x)/sin x → simplified form
    back: |
      Factor cos x: cos x(sin²x + cos²x)/sin x = cos x/sin x = cot x.
    topic_code: "3.1"
  - front: √(9 − x²) with x = 3 sin θ, −π/2 ≤ θ ≤ π/2 → in terms of θ
    back: |
      √(9 cos²θ) = 3|cos θ| = 3 cos θ, because cos θ ≥ 0 on [−π/2, π/2].
    topic_code: "3.1"
  - front: √(cos²θ) → what it equals in general
    back: |
      |cos θ|. It equals cos θ only where cos θ ≥ 0 (quadrants I and IV); in quadrants II and III it is −cos θ.
    topic_code: "3.1"
  - front: sin x cos²x − sin x → factored and simplified
    back: |
      sin x(cos²x − 1) = sin x(−sin²x) = −sin³x.
    topic_code: "3.2"
  - front: sin⁴x − cos⁴x → factored and simplified
    back: |
      (sin²x − cos²x)(sin²x + cos²x) = sin²x − cos²x, which is also 2 sin²x − 1.
    topic_code: "3.2"
  - front: sin²x − cos²x → factored form
    back: |
      (sin x − cos x)(sin x + cos x), a difference of squares. It is not (sin x − cos x)².
    topic_code: "3.2"
  - front: 2 sin²x + sin x − 1 → factored form
    back: |
      (2 sin x − 1)(sin x + 1). Factor 2u² + u − 1 with u = sin x.
    topic_code: "3.2"
  - front: (2 sin²x + sin x − 1)/(sin x + 1) → simplified, with restriction
    back: |
      2 sin x − 1, valid where sin x ≠ −1 (x ≠ 3π/2 + 2πn). At 3π/2 the original is 0/0.
    topic_code: "3.2"
  - front: tan²x − 5 tan x + 6 → factored form
    back: |
      (tan x − 2)(tan x − 3): two numbers with product 6 and sum −5.
    topic_code: "3.2"
  - front: (sec²x − 1)/(sec x + 1) → simplified form
    back: |
      Difference of squares: (sec x − 1)(sec x + 1)/(sec x + 1) = sec x − 1.
    topic_code: "3.2"
  - front: cos x/(1 + sin x) + (1 + sin x)/cos x → simplified form
    back: |
      Numerator over cos x(1 + sin x) is cos²x + 1 + 2 sin x + sin²x = 2(1 + sin x); cancel to get 2/cos x = 2 sec x.
    topic_code: "3.2"
  - front: 1/(1 + cos x) + 1/(1 − cos x) → simplified form
    back: |
      2/(1 − cos²x) = 2/sin²x = 2 csc²x.
    topic_code: "3.2"
  - front: Least common denominator of 1/sin x and 1/(1 + sin x) → what it is
    back: |
      sin x(1 + sin x). Multiply the factors that differ, exactly as with rational expressions.
    topic_code: "3.2"
  - front: Conjugate of 1 − cos x → what it is and why use it
    back: |
      1 + cos x. Their product is 1 − cos²x = sin²x, a single term, so the denominator stops being a difference.
    topic_code: "3.2"
  - front: sin x/(1 − cos x) → rewritten with a conjugate
    back: |
      sin x(1 + cos x)/sin²x = (1 + cos x)/sin x = csc x + cot x.
    topic_code: "3.2"
  - front: cos x/(1 − sin x) → rewritten with a conjugate
    back: |
      cos x(1 + sin x)/cos²x = (1 + sin x)/cos x = sec x + tan x.
    topic_code: "3.2"
  - front: (1 + sin x)² → expanded
    back: |
      1 + 2 sin x + sin²x. The middle term is easy to lose and is often the one that factors later.
    topic_code: "3.2"
  - front: Cancelling a factor in a trig fraction → what happens to the domain
    back: |
      Nothing grows: the simplified form equals the original only where the original was defined. State the excluded values when asked.
    topic_code: "3.2"
  - front: (sin x + cos x)/sin x → simplified correctly
    back: |
      Split the fraction: sin x/sin x + cos x/sin x = 1 + cot x.
    topic_code: "3.2"
  - front: Error-spot → "(sin x + cos x)/sin x = 1 + cos x"
    back: |
      sin x is a factor of only one term, so it cannot cancel. Split the fraction instead: 1 + cot x.
    topic_code: "3.2"
  - front: Error-spot → "√(1 − sin²x) = 1 − sin x"
    back: |
      A square root does not split over a difference. √(1 − sin²x) = √(cos²x) = |cos x|.
    topic_code: "3.1"
  - front: Error-spot → "(1 − cos x)(1 + cos x) = 1 − cos x²"
    back: |
      The product is 1 − cos²x, the square of cos x, which equals sin²x. cos(x²) is a different function.
    topic_code: "3.2"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 3.1 and 3.2: rewriting in sines and
    cosines, Pythagorean substitutions, factoring, combining fractions and conjugates), with about a third
    reviewing weeks 5, 6, 9 and 11 (signs by quadrant, unit-circle values, the fundamental identities, the
    graph of tangent and inverse compositions). Includes a shared-context set on E(x) = (csc x − sin x)/cos x.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the
    scoring notes. Items marked (Calculator.) need a calculator; the rest are designed to be done by hand.
  questions:
    # ---- Stimulus set: simplifying one expression (3.1)
    - slug: trig-u03-w13-q01
      type: multiple_choice
      topic_code: "3.1"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      stimulus: |
        Let E(x) = (csc x − sin x)/cos x.
      prompt: |
        Rewritten in sines and cosines, the numerator csc x − sin x equals which single fraction?
      options:
        - "(1 − sin x)/sin x"
        - "(sin²x − 1)/sin x"
        - "(1 − sin²x)/sin x"
        - "1/(sin x − sin²x)"
      option_explanations:
        - |
          Over the common denominator sin x, the term sin x becomes sin²x/sin x, not sin x/sin x; the square is missing.
        - |
          The subtraction is in the wrong order: csc x − sin x gives 1 − sin²x on top, the opposite sign of sin²x − 1.
        - |
          Correct. 1/sin x − sin x = 1/sin x − sin²x/sin x = (1 − sin²x)/sin x.
        - |
          This inverts the result. Subtracting fractions combines numerators over a common denominator; it does not take a reciprocal of the difference.
      answer: 2
    - slug: trig-u03-w13-q02
      type: multiple_choice
      topic_code: "3.1"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      stimulus: |
        Let E(x) = (csc x − sin x)/cos x.
      prompt: |
        Which is E(x) fully simplified, wherever E is defined?
      options:
        - "cot x"
        - "tan x"
        - "cos x"
        - "csc x sec x"
      option_explanations:
        - |
          Correct. The numerator is (1 − sin²x)/sin x = cos²x/sin x; dividing by cos x leaves cos x/sin x = cot x.
        - |
          tan x is the reciprocal of the correct answer; this comes from dividing cos²x/sin x by cos x the wrong way up.
        - |
          cos x is the numerator cos²x/sin x divided by cos x with the sin x denominator dropped; that denominator stays.
        - |
          csc x sec x = 1/(sin x cos x) would come from a numerator of 1; the numerator is cos²x/sin x after the Pythagorean step.
      answer: 0
    - slug: trig-u03-w13-q03
      type: multiple_choice
      topic_code: "3.1"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      stimulus: |
        Let E(x) = (csc x − sin x)/cos x.
      prompt: |
        What is the exact value of E(π/3)?
      options:
        - "√3"
        - "1/2"
        - "2√3/3"
        - "√3/3"
      option_explanations:
        - |
          √3 is tan(π/3). E simplifies to cot x, the reciprocal, so the value is 1/√3.
        - |
          1/2 is cos(π/3), one ingredient of the expression, not the value of E at π/3.
        - |
          2√3/3 is csc(π/3) = 2/√3, the first term of the numerator before subtracting sin(π/3).
        - |
          Correct. E(x) = cot x, and cot(π/3) = 1/√3 = √3/3. Directly: (2/√3 − √3/2)/(1/2) = (1/(2√3))·2 = 1/√3.
      answer: 3
    - slug: trig-u03-w13-q04
      type: multiple_choice
      topic_code: "3.1"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        Which expression equals csc x tan x wherever both sides are defined?
      options:
        - "csc x"
        - "sec x"
        - "1"
        - "cos x"
      option_explanations:
        - |
          tan x does not cancel to 1; (1/sin x)(sin x/cos x) leaves 1/cos x, not 1/sin x.
        - |
          Correct. (1/sin x)(sin x/cos x) = 1/cos x = sec x.
        - |
          The product would be 1 only for reciprocal pairs such as tan x cot x; csc x and tan x are not reciprocals.
        - |
          cos x is the reciprocal of the correct answer: the cos x from tan x stays in the denominator.
      answer: 1
    - slug: trig-u03-w13-q05
      type: multiple_choice
      topic_code: "3.2"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        Which is the complete factorisation of sin²x − 3 sin x + 2?
      options:
        - "(sin x + 1)(sin x + 2)"
        - "(sin x − 3)(sin x + 1)"
        - "(sin x − 1)(sin x − 2)"
        - "sin x(sin x − 3) + 2"
      option_explanations:
        - |
          These factors expand to sin²x + 3 sin x + 2; the middle term has the wrong sign.
        - |
          These factors expand to sin²x − 2 sin x − 3; the constant should be +2 and the middle term −3 sin x.
        - |
          Correct. With u = sin x, u² − 3u + 2 needs two numbers with product 2 and sum −3: −1 and −2.
        - |
          This is a rearrangement, not a factorisation: the whole expression is not written as a product.
      answer: 2
    - slug: trig-u03-w13-q06
      type: multiple_choice
      topic_code: "3.2"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        Simplify (tan²x − 1)/(tan x − 1), for x where tan x is defined and tan x ≠ 1.
      options:
        - "tan x + 1"
        - "tan x − 1"
        - "sec²x"
        - "tan x"
      option_explanations:
        - |
          Correct. The numerator is a difference of squares, (tan x − 1)(tan x + 1); cancel tan x − 1.
        - |
          This keeps the factor that cancels and drops the one that remains; the leftover factor is tan x + 1.
        - |
          tan²x + 1 = sec²x, but the numerator here is tan²x − 1, which is not a Pythagorean expression.
        - |
          Cancelling the 1s and one tan x term by term is not legal; only common factors cancel.
      answer: 0
    - slug: trig-u03-w13-q07
      type: multiple_choice
      topic_code: "3.2"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        Combine and simplify sin x/(1 + cos x) + (1 + cos x)/sin x.
      options:
        - "2 sec x"
        - "1"
        - "2 csc²x"
        - "2 csc x"
      option_explanations:
        - |
          2 sec x is the answer to the companion expression with cos x and 1 + sin x; here the leftover denominator is sin x.
        - |
          The fractions are not reciprocals that multiply to 1; they are added, so a common denominator is needed.
        - |
          2 csc²x is the sum 1/(1 + cos x) + 1/(1 − cos x); this sum's denominator is sin x(1 + cos x), not sin²x.
        - |
          Correct. The numerator sin²x + 1 + 2 cos x + cos²x = 2(1 + cos x); over sin x(1 + cos x) it leaves 2/sin x.
      answer: 3
    - slug: trig-u03-w13-q08
      type: multiple_choice
      topic_code: "3.2"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        Multiplying by a conjugate, which expression equals cos x/(1 + sin x) wherever both are defined?
      options:
        - "sec x + tan x"
        - "sec x − tan x"
        - "1 − sin x"
        - "cos x − cot x"
      option_explanations:
        - |
          This is cos x/(1 − sin x); using 1 + sin x in the denominator flips the sign of the tan x term.
        - |
          Correct. cos x(1 − sin x)/(1 − sin²x) = cos x(1 − sin x)/cos²x = (1 − sin x)/cos x = sec x − tan x.
        - |
          After multiplying by (1 − sin x)/(1 − sin x) the denominator is cos²x, not cos x, so one factor of cos x remains below.
        - |
          Dividing cos x by each term of the denominator separately is not legal; a fraction does not split over its denominator.
      answer: 1
    - slug: trig-u03-w13-q09
      type: multiple_choice
      topic_code: "1.12"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        If sin θ = −3/5 and θ is in quadrant III, what is tan θ?
      options:
        - "3/4"
        - "−3/4"
        - "4/3"
        - "−4/5"
      option_explanations:
        - |
          Correct. cos²θ = 1 − 9/25 = 16/25 and cosine is negative in quadrant III, so cos θ = −4/5 and tan θ = (−3/5)/(−4/5) = 3/4.
        - |
          Tangent is positive in quadrant III, where sine and cosine are both negative; the sign is wrong.
        - |
          4/3 is cot θ, the cosine over the sine instead of the sine over the cosine.
        - |
          −4/5 is cos θ; tangent is the quotient sin θ/cos θ.
      answer: 0
    - slug: trig-u03-w13-q10
      type: multiple_choice
      topic_code: "2.10"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      prompt: |
        For 0 < x ≤ 1, which expression equals tan(cos⁻¹ x)?
      options:
        - "x/√(1 − x²)"
        - "√(1 − x²)"
        - "√(1 − x²)/x"
        - "1/x"
      option_explanations:
        - |
          This is the cotangent of the angle: adjacent over opposite. Tangent is opposite over adjacent.
        - |
          √(1 − x²) is sin(cos⁻¹ x), the opposite side over a hypotenuse of 1, not the tangent.
        - |
          Correct. With θ = cos⁻¹ x, adjacent x and hypotenuse 1 give opposite √(1 − x²); tan θ = √(1 − x²)/x.
        - |
          1/x is sec(cos⁻¹ x), hypotenuse over adjacent.
      answer: 2
    - slug: trig-u03-w13-q11
      type: multiple_choice
      topic_code: "1.11"
      source: "Original item; Common Core HSF-TF.A.3"
      points: 1
      prompt: |
        What is the exact value of csc(5π/4)?
      options:
        - "√2"
        - "−√2/2"
        - "−1"
        - "−√2"
      option_explanations:
        - |
          5π/4 is in quadrant III, where sine and therefore cosecant are negative.
        - |
          −√2/2 is sin(5π/4) itself; cosecant is its reciprocal.
        - |
          −1 would need sin(5π/4) = −1, which happens only at 3π/2.
        - |
          Correct. sin(5π/4) = −√2/2, so csc(5π/4) = −2/√2 = −√2.
      answer: 3
    - slug: trig-u03-w13-q12
      type: multiple_choice
      topic_code: "2.5"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        After simplifying, the graph of y = sin x · sec x matches the graph of which function, and what is its period?
      options:
        - "y = 1, no period"
        - "y = tan x, period π"
        - "y = tan x, period 2π"
        - "y = cot x, period π"
      option_explanations:
        - |
          sin x and sec x are not reciprocals; sin x · (1/cos x) is a quotient of two different functions.
        - |
          Correct. sin x · sec x = sin x/cos x = tan x, which repeats every π.
        - |
          The simplification is right but tangent's period is π: θ and θ + π give the same slope.
        - |
          cot x is cos x/sin x; here sine is on top, which gives tangent.
      answer: 1
    - slug: trig-u03-w13-q13
      type: multi_select
      topic_code: "3.1"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 2
      partial_credit: true
      prompt: |
        Which expressions equal 1 for every x at which they are defined? Select all that apply.
      options:
        - "sec²x − tan²x"
        - "csc²x + cot²x"
        - "tan x · cot x"
        - "sin x + cos x"
        - "cos²x − sin²x"
      option_explanations:
        - |
          Correct. 1 + tan²x = sec²x, so sec²x − tan²x = 1 wherever cos x ≠ 0.
        - |
          csc²x = 1 + cot²x, so the sum is 1 + 2cot²x, which equals 1 only where cot x = 0.
        - |
          Correct. tan x and cot x are reciprocals, so their product is 1 wherever both are defined.
        - |
          At x = π/4 the sum is √2/2 + √2/2 = √2, so it is not always 1; it is sin²x + cos²x that is.
        - |
          At x = π/2 this is 0 − 1 = −1. The identity with value 1 has a plus sign, sin²x + cos²x.
      answer: [0, 2]
    - slug: trig-u03-w13-q14
      type: multi_select
      topic_code: "1.10"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 2
      partial_credit: true
      prompt: |
        An angle θ has its terminal side in quadrant III. Which of these values are positive? Select all that apply.
      options:
        - "sin θ"
        - "cos θ"
        - "tan θ"
        - "sec θ"
        - "cot θ"
      option_explanations:
        - |
          In quadrant III the point (x, y) has y < 0, so sin θ = y/r is negative.
        - |
          In quadrant III x < 0, so cos θ = x/r is negative.
        - |
          Correct. tan θ = y/x is a negative over a negative, which is positive.
        - |
          sec θ = r/x has the sign of cos θ, which is negative in quadrant III.
        - |
          Correct. cot θ = x/y is a negative over a negative, so it is positive, matching tan θ.
      answer: [2, 4]
    - slug: trig-u03-w13-q15
      type: true_false
      topic_code: "1.12"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        True or false: (1 + tan²x) cos²x = 1 for every x at which tan x is defined.
      answer: true
      explanation: |
        True. 1 + tan²x = sec²x = 1/cos²x, so the product is (1/cos²x)·cos²x = 1. Tangent is defined exactly where cos x ≠ 0, so nothing is divided by zero.
    - slug: trig-u03-w13-q16
      type: true_false
      topic_code: "3.2"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        True or false: sin²x − cos²x factors as (sin x − cos x)².
      answer: false
      explanation: |
        False. sin²x − cos²x is a difference of squares, (sin x − cos x)(sin x + cos x). The square (sin x − cos x)² expands to sin²x − 2 sin x cos x + cos²x = 1 − 2 sin x cos x; at x = 0 the two expressions are −1 and 1.
    - slug: trig-u03-w13-q17
      type: fill_blank
      topic_code: "3.1"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        For every x that is not a multiple of π, (1 − cos²x) csc²x = ____.
      answer: ["1", "1.0", "one"]
      explanation: |
        1 − cos²x = sin²x and csc²x = 1/sin²x, so the product is 1. The restriction x ≠ πn keeps sin x ≠ 0, where csc x is undefined.
    - slug: trig-u03-w13-q18
      type: fill_blank
      topic_code: "1.12"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        If cos θ = 0.6, then sin²θ = ____.
      answer: ["0.64", ".64", "16/25"]
      explanation: |
        sin²θ = 1 − cos²θ = 1 − 0.36 = 0.64. The square removes any question of sign, so the quadrant is not needed.
    - slug: trig-u03-w13-q19
      type: numeric
      topic_code: "1.12"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        If tan θ = 2.4 and θ is in quadrant III, find the exact value of sec θ as a decimal.
      answer: { value: -2.6, tolerance: 0.001 }
      explanation: |
        sec²θ = 1 + tan²θ = 1 + 5.76 = 6.76, so sec θ = ±2.6. In quadrant III cosine is negative, and secant has the sign of cosine, so sec θ = −2.6.
    - slug: trig-u03-w13-q20
      type: numeric
      topic_code: "3.1"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        (Calculator.) Simplify (sin³x + sin x cos²x)/cos x, then evaluate it at x = 1.2 radians. Give your answer to the nearest hundredth.
      answer: { value: 2.57, tolerance: 0.01 }
      explanation: |
        Factor sin x from the numerator: sin x(sin²x + cos²x)/cos x = sin x/cos x = tan x. In radian mode tan 1.2 ≈ 2.572, which is 2.57 to the nearest hundredth.
    - slug: trig-u03-w13-q21
      type: short_answer
      topic_code: "3.2"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 3
      prompt: |
        Let R(x) = (2 cos²x − cos x − 1)/(cos x − 1).

        (a) Factor the numerator 2 cos²x − cos x − 1.
        (b) Simplify R(x).
        (c) Find every x in [0, 2π) at which R is undefined, and explain why your simplified form from (b) does not equal R there.
      answer: |
        (a) With u = cos x, 2u² − u − 1 = (2u + 1)(u − 1), so the numerator is (2 cos x + 1)(cos x − 1).
        (b) R(x) = (2 cos x + 1)(cos x − 1)/(cos x − 1) = 2 cos x + 1, for cos x ≠ 1.
        (c) R is undefined where cos x = 1, which in [0, 2π) is only x = 0. There R(0) is 0/0, undefined, while 2 cos 0 + 1 = 3. Cancelling a factor gives an expression equal to R only where R was defined.
      explanation: |
        Three points, one per part. (a) the correct factorisation (2 cos x + 1)(cos x − 1). (b) 2 cos x + 1. (c) x = 0 only, with the reason that the cancelled factor is zero there (the original is 0/0); accept a statement that the simplified form "fills in" a value the original does not have.
    - slug: trig-u03-w13-q22
      type: short_answer
      topic_code: "3.1"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 3
      prompt: |
        Consider tan x + cot x.

        (a) Write each term using only sin x and cos x.
        (b) Combine the terms over a common denominator and simplify the result to a product of two reciprocal functions.
        (c) Use your answer to (b) to find the exact value of tan x + cot x at x = π/4, and check it using tan(π/4) and cot(π/4) directly.
      answer: |
        (a) tan x = sin x/cos x and cot x = cos x/sin x.
        (b) (sin²x + cos²x)/(sin x cos x) = 1/(sin x cos x) = sec x csc x.
        (c) sec(π/4) csc(π/4) = √2 · √2 = 2. Directly, tan(π/4) + cot(π/4) = 1 + 1 = 2.
      explanation: |
        Three points, one per part. (a) both quotients. (b) the common denominator sin x cos x, the Pythagorean step to 1, and sec x csc x (accept csc x sec x). (c) 2 from both routes.
    - slug: trig-u03-w13-q23
      type: long_answer
      topic_code: "3.1"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 6
      prompt: |
        A trigonometric substitution rewrites expressions in x as expressions in an angle. Let x = 3 sin θ, where −π/2 ≤ θ ≤ π/2.

        (A) (i) Show that √(9 − x²) = 3|cos θ|.
        (ii) Explain why the absolute value can be dropped, so that √(9 − x²) = 3 cos θ.

        (B) (i) For −π/2 < θ < π/2, write x/√(9 − x²) as a single trigonometric function of θ.
        (ii) Write (9 − x²)/x² as a single squared trigonometric function of θ, for θ ≠ 0.

        (C) (i) Express θ in terms of x.
        (ii) For x = 3/2, find θ exactly and check that √(9 − x²) and 3 cos θ give the same exact value.
      answer: |
        (A) (i) 9 − x² = 9 − 9 sin²θ = 9(1 − sin²θ) = 9 cos²θ, so √(9 − x²) = √(9 cos²θ) = 3|cos θ|.
        (ii) On −π/2 ≤ θ ≤ π/2 the angle is in quadrant I or IV (or on the y-axis), where cos θ ≥ 0, so |cos θ| = cos θ.
        (B) (i) x/√(9 − x²) = 3 sin θ/(3 cos θ) = tan θ (cos θ > 0 on the open interval, so there is no division by zero).
        (ii) (9 − x²)/x² = 9 cos²θ/(9 sin²θ) = cot²θ.
        (C) (i) sin θ = x/3, and θ is in the range of sin⁻¹, so θ = sin⁻¹(x/3).
        (ii) θ = sin⁻¹(1/2) = π/6. √(9 − 9/4) = √(27/4) = 3√3/2, and 3 cos(π/6) = 3 · √3/2 = 3√3/2. They agree.
      explanation: |
        Six points. (A) 1 point for factoring 9 out and using 1 − sin²θ = cos²θ to reach 3|cos θ|; 1 point for the sign argument from the interval [−π/2, π/2]. (B) 1 point for tan θ; 1 point for cot²θ. (C) 1 point for θ = sin⁻¹(x/3), with or without a reference to the range; 1 point for θ = π/6 and both values 3√3/2.
