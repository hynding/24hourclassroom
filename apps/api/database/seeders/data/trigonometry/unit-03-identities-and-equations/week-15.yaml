      prompt: |
        Angle α satisfies cos α = 12/13 with 3π/2 < α < 2π, and angle β satisfies sin β = 3/5 with π/2 < β < π.

        (a) Find sin α and cos β.
        (b) Find sin(α − β) and cos(α − β) exactly.
        (c) Find tan(α − β), and state the quadrant of α − β.
      answer: |
        (a) sin α = −5/13 (quadrant IV, sine negative); cos β = −4/5 (quadrant II, cosine negative).
        (b) sin(α − β) = sin α cos β − cos α sin β = (−5/13)(−4/5) − (12/13)(3/5) = 20/65 − 36/65 = −16/65. cos(α − β) = cos α cos β + sin α sin β = (12/13)(−4/5) + (−5/13)(3/5) = −48/65 − 15/65 = −63/65.
        (c) tan(α − β) = (−16/65)/(−63/65) = 16/63. Sine and cosine are both negative, so α − β is in quadrant III.
      explanation: |
        Three points, one per part. (a) both values with correct signs. (b) both exact values (follow through from a sign error in (a) earns at most this point if the formulas are correct). (c) 16/63 and quadrant III from the signs.
