week: 15
unit: 3
title: "Sum and Difference Formulas"
topics: ["3.4", "3.5"]
guide: guides/week-15.md
guide_description: |
  The sum and difference formulas for sine, cosine and tangent with their sign patterns; a derivation of
  cos(α − β) from the distance between two unit-circle points and how the other five formulas follow; exact
  values at 75°, 105°, 15° and π/12; recognising an expansion in reverse; combining two angles given one
  ratio and a quadrant each; and cofunction and reduction formulas such as sin(π − x) = sin x and
  cos(x + π/2) = −sin x, with a quick sign check. Worked examples: sin 75°, cos(π/12) and tan(π/12) = 2 − √3,
  sin(α + β) and cos(α − β) with quadrants, four reduction formulas, and sin(x + y) sin(x − y) = sin²x − sin²y.
flashcards_description: |
  31 cards on the six sum and difference formulas and their sign patterns, the derivation, exact values from
  special angles, reverse recognition, two-angle problems with quadrants, cofunction and reduction formulas,
  and the errors that cost the most points.

flashcards:
  - front: sin(α + β) → expansion
    back: |
      sin α cos β + cos α sin β. Sine keeps the sign of the operation and mixes the functions.
    topic_code: "3.4"
  - front: sin(α − β) → expansion
    back: |
      sin α cos β − cos α sin β. Order matters: the sin α term comes first.
    topic_code: "3.4"
  - front: cos(α + β) → expansion
    back: |
      cos α cos β − sin α sin β. Cosine flips the sign and matches the functions.
    topic_code: "3.4"
  - front: cos(α − β) → expansion
    back: |
      cos α cos β + sin α sin β. A difference inside gives a plus outside.
    topic_code: "3.4"
  - front: tan(α + β) → formula
    back: |
      (tan α + tan β)/(1 − tan α tan β). Undefined when tan α tan β = 1, that is when α + β is an odd multiple of π/2.
    topic_code: "3.4"
  - front: tan(α − β) → formula
    back: |
      (tan α − tan β)/(1 + tan α tan β). The signs in numerator and denominator are opposite.
    topic_code: "3.4"
  - front: Derivation of cos(α − β) on the unit circle → the idea
    back: |
      Compute the squared distance between (cos α, sin α) and (cos β, sin β) from coordinates, then again after rotating Q to (1, 0). Equate: 2 − 2(cos α cos β + sin α sin β) = 2 − 2 cos(α − β).
    topic_code: "3.4"
  - front: Getting cos(α + β) from cos(α − β) → the move
    back: |
      Replace β with −β and use cos(−β) = cos β and sin(−β) = −sin β; the plus becomes a minus.
    topic_code: "3.4"
  - front: Getting tan(α + β) from the sine and cosine formulas → the move
    back: |
      Divide sin(α + β) by cos(α + β), then divide numerator and denominator by cos α cos β.
    topic_code: "3.4"
  - front: sin 75° → exact value
    back: |
      sin(45° + 30°) = (√2/2)(√3/2) + (√2/2)(1/2) = (√6 + √2)/4 ≈ 0.966.
    topic_code: "3.4"
  - front: sin 105° → exact value
    back: |
      sin(60° + 45°) = (√3/2)(√2/2) + (1/2)(√2/2) = (√6 + √2)/4, the same as sin 75°, since 105° and 75° are supplementary.
    topic_code: "3.4"
  - front: cos 105° → exact value
    back: |
      cos(60° + 45°) = (1/2)(√2/2) − (√3/2)(√2/2) = (√2 − √6)/4 ≈ −0.259.
    topic_code: "3.4"
  - front: cos(π/12) → exact value
    back: |
      cos(π/3 − π/4) = (1/2)(√2/2) + (√3/2)(√2/2) = (√2 + √6)/4 ≈ 0.966.
    topic_code: "3.4"
  - front: sin 15° → exact value
    back: |
      sin(45° − 30°) = (√2/2)(√3/2) − (√2/2)(1/2) = (√6 − √2)/4 ≈ 0.259. It equals cos 75°.
    topic_code: "3.4"
  - front: tan(π/12) → exact simplified value
    back: |
      (√3 − 1)/(1 + √3), rationalised to 2 − √3 ≈ 0.268.
    topic_code: "3.4"
  - front: tan(5π/12) → exact simplified value
    back: |
      tan(π/4 + π/6) = (1 + √3/3)/(1 − √3/3) = (√3 + 1)/(√3 − 1) = 2 + √3 ≈ 3.732.
    topic_code: "3.4"
  - front: sin 50° cos 20° − cos 50° sin 20° → value
    back: |
      The shape of sin(α − β): sin 30° = 1/2.
    topic_code: "3.4"
  - front: cos 100° cos 40° + sin 100° sin 40° → value
    back: |
      The shape of cos(α − β): cos 60° = 1/2.
    topic_code: "3.4"
  - front: sin α = 3/5 (QII), cos β = −5/13 (QIII) → sin(α + β)
    back: |
      cos α = −4/5, sin β = −12/13. sin(α + β) = (3/5)(−5/13) + (−4/5)(−12/13) = 33/65.
    topic_code: "3.4"
  - front: sin α = 3/5 (QII), cos β = −5/13 (QIII) → cos(α − β)
    back: |
      (−4/5)(−5/13) + (3/5)(−12/13) = 20/65 − 36/65 = −16/65.
    topic_code: "3.4"
  - front: Quadrant of α + β from the signs of sin(α + β) and cos(α + β) → method
    back: |
      Read the signs: both positive gives quadrant I, sin + cos − gives II, both negative gives III, sin − cos + gives IV.
    topic_code: "3.4"
  - front: sin(x + y) sin(x − y) → simplified
    back: |
      sin²x cos²y − cos²x sin²y, which reduces to sin²x − sin²y.
    topic_code: "3.4"
  - front: sin(π/2 − x) via the difference formula → result
    back: |
      sin(π/2)cos x − cos(π/2)sin x = cos x: the cofunction identity, now for every x.
    topic_code: "3.5"
  - front: sin(π − x) → reduced form
    back: |
      sin π cos x − cos π sin x = sin x. Supplementary angles have equal sines.
    topic_code: "3.5"
  - front: cos(x + π/2) → reduced form
    back: |
      cos x · 0 − sin x · 1 = −sin x.
    topic_code: "3.5"
  - front: sin(3π/2 − x) → reduced form
    back: |
      sin(3π/2)cos x − cos(3π/2)sin x = −cos x.
    topic_code: "3.5"
  - front: tan(x + π) via the tangent sum formula → result
    back: |
      (tan x + 0)/(1 − 0) = tan x: the period of tangent is π.
    topic_code: "3.5"
  - front: Reduction formula sign check → shortcut
    back: |
      Treat x as small and acute, find the quadrant of the new angle, and take that quadrant's sign. Adding π/2 or 3π/2 switches to the cofunction; adding π or 2π keeps the function.
    topic_code: "3.5"
  - front: Error-spot → "sin(α + β) = sin α + sin β"
    back: |
      False in general: at α = β = π/2, sin π = 0 but sin α + sin β = 2. Use sin α cos β + cos α sin β.
    topic_code: "3.4"
  - front: Error-spot → "cos(α + β) = cos α cos β + sin α sin β"
    back: |
      That is cos(α − β). The sum formula for cosine has a minus sign.
    topic_code: "3.4"
  - front: Error-spot → "cos(x + π/2) = −cos x"
    back: |
      Adding π/2 switches to the cofunction: cos(x + π/2) = −sin x.
    topic_code: "3.5"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 3.4 and 3.5: sum and difference formulas,
    exact values, two-angle problems with quadrants, reverse recognition, cofunction and reduction formulas),
    with about a third reviewing weeks 13 and 14 (simplifying, factoring, verifying identities) and Units 1
    and 2 (the Pythagorean identity with quadrants, reference angles, inverse functions and compositions).
    Includes a shared-context set on two angles given by one ratio and a quadrant each. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes. Items marked (Calculator.) need a calculator; the rest are designed to be done by hand.
  questions:
    # ---- Stimulus set: two angles with quadrants (3.4)
    - slug: trig-u03-w15-q01
      type: multiple_choice
      topic_code: "1.12"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      stimulus: |
        Angle α satisfies sin α = 4/5 with π/2 < α < π. Angle β satisfies tan β = 5/12 with π < β < 3π/2.
      prompt: |
        What is cos α?
      options:
        - "3/5"
        - "−4/5"
        - "4/3"
        - "−3/5"
      option_explanations:
        - |
          The size 3/5 is right (a 3-4-5 triangle), but α is in quadrant II, where cosine is negative.
        - |
          −4/5 reuses the sine's numerator; cos²α = 1 − 16/25 = 9/25, so the size is 3/5.
        - |
          4/3 is the size of tan α, opposite over adjacent; cosine is adjacent over hypotenuse.
        - |
          Correct. cos²α = 1 − (4/5)² = 9/25, and cosine is negative in quadrant II, so cos α = −3/5.
      answer: 3
    - slug: trig-u03-w15-q02
      type: multiple_choice
      topic_code: "3.4"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      stimulus: |
        Angle α satisfies sin α = 4/5 with π/2 < α < π. Angle β satisfies tan β = 5/12 with π < β < 3π/2.
      prompt: |
        What is the exact value of sin(α + β)?
      options:
        - "−63/65"
        - "−33/65"
        - "27/65"
        - "56/65"
      option_explanations:
        - |
          This uses sin α cos β − cos α sin β, the difference formula, instead of the sum formula.
        - |
          Correct. sin β = −5/13 and cos β = −12/13 in quadrant III, so sin(α + β) = (4/5)(−12/13) + (−3/5)(−5/13) = −48/65 + 15/65 = −33/65.
        - |
          27/65 is sin α + sin β = 4/5 − 5/13; the sine of a sum is not the sum of the sines.
        - |
          56/65 is cos(α + β) = (−3/5)(−12/13) − (4/5)(−5/13); the question asks for the sine.
      answer: 1
    - slug: trig-u03-w15-q03
      type: multiple_choice
      topic_code: "3.4"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      stimulus: |
        Angle α satisfies sin α = 4/5 with π/2 < α < π. Angle β satisfies tan β = 5/12 with π < β < 3π/2.
      prompt: |
        What is the exact value of cos(α − β)?
      options:
        - "16/65"
        - "56/65"
        - "21/65"
        - "−16/65"
      option_explanations:
        - |
          Correct. cos(α − β) = cos α cos β + sin α sin β = (−3/5)(−12/13) + (4/5)(−5/13) = 36/65 − 20/65 = 16/65.
        - |
          56/65 uses a minus sign between the products, which is the formula for cos(α + β).
        - |
          21/65 is cos α − cos β = −3/5 + 12/13; the formula does not distribute.
        - |
          The sign is lost by taking sin β = +5/13; in quadrant III sine is negative, which makes sin α sin β = −20/65.
      answer: 0
    - slug: trig-u03-w15-q04
      type: multiple_choice
      topic_code: "3.4"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      stimulus: |
        Angle α satisfies sin α = 4/5 with π/2 < α < π. Angle β satisfies tan β = 5/12 with π < β < 3π/2.
      prompt: |
        In which quadrant does the terminal side of α + β lie?
      options:
        - "Quadrant II"
        - "Quadrant III"
        - "Quadrant IV"
        - "Quadrant I"
      option_explanations:
        - |
          Quadrant II needs a positive sine; here sin(α + β) = −33/65 is negative.
        - |
          Quadrant III needs a negative cosine; here cos(α + β) = 56/65 is positive.
        - |
          Correct. sin(α + β) = −33/65 < 0 and cos(α + β) = 56/65 > 0, which is quadrant IV (consistent with 3π/2 < α + β < 5π/2).
        - |
          Adding the angle bounds gives 3π/2 < α + β < 5π/2, which allows quadrant I, but the negative sine rules it out.
      answer: 2
    - slug: trig-u03-w15-q05
      type: multiple_choice
      topic_code: "3.4"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        What is the exact value of sin 105°?
      options:
        - "(√6 + √2)/4"
        - "(√6 − √2)/4"
        - "(√2 − √6)/4"
        - "(√3 + √2)/2"
      option_explanations:
        - |
          Correct. sin(60° + 45°) = (√3/2)(√2/2) + (1/2)(√2/2) = (√6 + √2)/4 ≈ 0.966.
        - |
          (√6 − √2)/4 ≈ 0.259 is sin 15°; it comes from subtracting the products, the difference formula.
        - |
          (√2 − √6)/4 is cos 105°, which is negative; sin 105° is positive because 105° is in quadrant II.
        - |
          (√3 + √2)/2 is sin 60° + sin 45°; the sine of a sum is not a sum of sines, and this value (about 1.57) exceeds 1.
      answer: 0
    - slug: trig-u03-w15-q06
      type: multiple_choice
      topic_code: "3.4"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        What is the exact value of cos 80° cos 20° + sin 80° sin 20°?
      options:
        - "cos 100°"
        - "√3/2"
        - "−1/2"
        - "1/2"
      option_explanations:
        - |
          "cos cos + sin sin" is the difference formula, so the angle is 80° − 20°, not 80° + 20°.
        - |
          √3/2 is cos 30° or sin 60°; the angle here is 60° and the function is cosine, so the value is 1/2.
        - |
          −1/2 is cos 120°; the expression is cos(80° − 20°) with a positive result.
        - |
          Correct. The expression is cos(80° − 20°) = cos 60° = 1/2.
      answer: 3
    - slug: trig-u03-w15-q07
      type: multiple_choice
      topic_code: "3.4"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        What is the exact value of tan(5π/12)?
      options:
        - "2 − √3"
        - "(3 + √3)/3"
        - "2 + √3"
        - "−2 − √3"
      option_explanations:
        - |
          2 − √3 is tan(π/12); 5π/12 is close to π/2, so its tangent is large.
        - |
          (3 + √3)/3 is tan(π/4) + tan(π/6); the tangent sum formula also divides by 1 − tan(π/4)tan(π/6).
        - |
          Correct. tan(π/4 + π/6) = (1 + √3/3)/(1 − √3/3) = (√3 + 1)/(√3 − 1) = (4 + 2√3)/2 = 2 + √3.
        - |
          5π/12 is in quadrant I, where tangent is positive.
      answer: 2
    - slug: trig-u03-w15-q08
      type: multiple_choice
      topic_code: "3.5"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        Which expression equals sin(x − π/2) for every x?
      options:
        - "cos x"
        - "−cos x"
        - "sin x − 1"
        - "−sin x"
      option_explanations:
        - |
          The sign is lost: sin x cos(π/2) − cos x sin(π/2) = −cos x. cos x is sin(π/2 − x), with the angles in the other order.
        - |
          Correct. sin x cos(π/2) − cos x sin(π/2) = sin x · 0 − cos x · 1 = −cos x.
        - |
          sin(π/2) = 1 is not subtracted from sin x; the sine of a difference does not distribute.
        - |
          Shifting by π/2 switches sine to its cofunction, so the answer involves cos x, not sin x.
      answer: 1
    - slug: trig-u03-w15-q09
      type: multiple_choice
      topic_code: "3.1"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        Simplify sin(x + y)/(cos x cos y), where cos x ≠ 0 and cos y ≠ 0.
      options:
        - "tan(x + y)"
        - "tan x tan y"
        - "sin x + sin y"
        - "tan x + tan y"
      option_explanations:
        - |
          tan(x + y) would need cos(x + y) in the denominator, not the product cos x cos y.
        - |
          The numerator is a sum of two products, so the quotient is a sum of two terms, not a single product.
        - |
          The cosines do not vanish: each term keeps a sine over a cosine.
        - |
          Correct. (sin x cos y + cos x sin y)/(cos x cos y) = sin x/cos x + sin y/cos y = tan x + tan y.
      answer: 3
    - slug: trig-u03-w15-q10
      type: multiple_choice
      topic_code: "3.3"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        Which choice of α and β is a counterexample to the false claim sin(α + β) = sin α + sin β?
      options:
        - "α = β = π/2"
        - "α = 0, β = π/3"
        - "α = β = 0"
        - "α = β = π"
      option_explanations:
        - |
          Correct. sin(π/2 + π/2) = sin π = 0, but sin(π/2) + sin(π/2) = 2.
        - |
          With α = 0 both sides are sin(π/3), so the claim happens to hold here.
        - |
          Both sides are 0, so these values do not disprove the claim.
        - |
          sin 2π = 0 and sin π + sin π = 0: the sides agree, so this is not a counterexample.
      answer: 0
    - slug: trig-u03-w15-q11
      type: multiple_choice
      topic_code: "2.9"
      source: "Original item; Common Core HSF-TF.B.6"
      points: 1
      prompt: |
        What is the exact value of cos⁻¹(−√3/2)?
      options:
        - "−π/6"
        - "5π/6"
        - "7π/6"
        - "2π/3"
      option_explanations:
        - |
          The range of cos⁻¹ is [0, π]; it never returns a negative angle.
        - |
          Correct. 5π/6 is in [0, π] and cos(5π/6) = −√3/2.
        - |
          cos(7π/6) = −√3/2, but 7π/6 is outside the range [0, π] of inverse cosine.
        - |
          cos(2π/3) = −1/2, not −√3/2; the angle with cosine −√3/2 in [0, π] has reference angle π/6.
      answer: 1
    - slug: trig-u03-w15-q12
      type: multiple_choice
      topic_code: "1.10"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      prompt: |
        In which quadrant is the terminal side of 23π/12, and what is its reference angle?
      options:
        - "Quadrant I, π/12"
        - "Quadrant IV, 11π/12"
        - "Quadrant IV, π/12"
        - "Quadrant III, π/12"
      option_explanations:
        - |
          23π/12 is just short of 2π (24π/12), so it is in quadrant IV, not quadrant I.
        - |
          The reference angle is measured to the nearest part of the x-axis: 2π − 23π/12 = π/12, never more than π/2.
        - |
          Correct. 3π/2 < 23π/12 < 2π, and the reference angle is 2π − 23π/12 = π/12.
        - |
          Quadrant III runs from π to 3π/2 (12π/12 to 18π/12); 23π/12 is beyond that.
      answer: 2
    - slug: trig-u03-w15-q13
      type: multi_select
      topic_code: "3.4"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 2
      partial_credit: true
      prompt: |
        Which expressions are equal to sin 15°? Select all that apply.
      options:
        - "(√6 − √2)/4"
        - "cos 75°"
        - "sin 45° − sin 30°"
        - "sin 45° cos 30° − cos 45° sin 30°"
        - "(√6 + √2)/4"
      option_explanations:
        - |
          Correct. sin(45° − 30°) = (√2/2)(√3/2) − (√2/2)(1/2) = (√6 − √2)/4 ≈ 0.259.
        - |
          Correct. 15° and 75° are complementary, so sin 15° = cos(90° − 15°) = cos 75°.
        - |
          sin 45° − sin 30° = √2/2 − 1/2 ≈ 0.207; the sine of a difference is not the difference of the sines.
        - |
          Correct. This is the expansion of sin(45° − 30°) by the difference formula.
        - |
          (√6 + √2)/4 ≈ 0.966 is sin 75° = cos 15°, the value with a plus sign.
      answer: [0, 1, 3]
    - slug: trig-u03-w15-q14
      type: multi_select
      topic_code: "3.5"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 2
      partial_credit: true
      prompt: |
        Which expressions equal cos x for every real x? Select all that apply.
      options:
        - "sin(π/2 − x)"
        - "cos(π − x)"
        - "sin(x + π/2)"
        - "sin(x − π/2)"
        - "cos(x + π)"
      option_explanations:
        - |
          Correct. sin(π/2)cos x − cos(π/2)sin x = cos x, the cofunction identity.
        - |
          cos π cos x + sin π sin x = −cos x; supplementary angles have opposite cosines.
        - |
          Correct. sin x cos(π/2) + cos x sin(π/2) = cos x.
        - |
          sin x · 0 − cos x · 1 = −cos x, the opposite of what is needed.
        - |
          cos x cos π − sin x sin π = −cos x; adding π reverses the sign of cosine.
      answer: [0, 2]
    - slug: trig-u03-w15-q15
      type: true_false
      topic_code: "3.4"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        True or false: cos(α − β) = cos α − cos β for all angles α and β.
      answer: false
      explanation: |
        False. With α = π and β = 0, cos π = −1 but cos π − cos 0 = −2. The correct formula is cos(α − β) = cos α cos β + sin α sin β.
    - slug: trig-u03-w15-q16
      type: true_false
      topic_code: "3.2"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        True or false: (cos²x − sin²x)/(cos x − sin x) = cos x + sin x for every x with cos x ≠ sin x.
      answer: true
      explanation: |
        True. The numerator is a difference of squares, (cos x − sin x)(cos x + sin x), and the factor cos x − sin x cancels wherever it is nonzero.
    - slug: trig-u03-w15-q17
      type: fill_blank
      topic_code: "3.4"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        Working in degrees, sin 50° cos 10° + cos 50° sin 10° = sin ____°.
      answer: ["60", "60°", "60 degrees"]
      explanation: |
        The expression has the shape sin α cos β + cos α sin β = sin(α + β), so it is sin(50° + 10°) = sin 60°.
    - slug: trig-u03-w15-q18
      type: fill_blank
      topic_code: "3.5"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        Written in terms of sin x alone, sin(π + x) = ____.
      answer: ["−sin x", "-sin x", "−sinx", "-sinx", "−sin(x)", "-sin(x)", "- sin x", "−1 sin x", "-1sin x"]
      explanation: |
        sin π cos x + cos π sin x = 0 · cos x + (−1) sin x = −sin x. Adding π reflects the point through the origin, reversing both coordinates.
    - slug: trig-u03-w15-q19
      type: numeric
      topic_code: "2.10"
