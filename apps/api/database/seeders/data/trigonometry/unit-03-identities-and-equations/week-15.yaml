      answer: { value: -0.966, tolerance: 0.001 }
      explanation: |
        cos 165° = cos 120° cos 45° − sin 120° sin 45° = (−1/2)(√2/2) − (√3/2)(√2/2) = −(√2 + √6)/4 ≈ −0.966. The value is negative because 165° is in quadrant II.
