      prompt: |
        (a) Verify the identity sin(x + y) + sin(x − y) = 2 sin x cos y.
        (b) Use the identity to find the exact value of sin 75° + sin 15°.
        (c) State and verify the matching identity for cos(x + y) + cos(x − y).
      answer: |
        (a) (sin x cos y + cos x sin y) + (sin x cos y − cos x sin y) = 2 sin x cos y; the cos x sin y terms cancel.
        (b) With x = 45° and y = 30°: sin 75° + sin 15° = 2 sin 45° cos 30° = 2(√2/2)(√3/2) = √6/2.
        (c) cos(x + y) + cos(x − y) = (cos x cos y − sin x sin y) + (cos x cos y + sin x sin y) = 2 cos x cos y.
      explanation: |
        Three points, one per part. (a) both expansions and the cancellation. (b) x = 45°, y = 30° and √6/2 (accept ≈ 1.225 only with the exact value). (c) the identity 2 cos x cos y with a one-side verification.
    - slug: trig-u03-w15-q23
      type: long_answer
      topic_code: "3.4"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 6
      prompt: |
        On a hypothetical town map with the usual x- and y-axes, two straight roads leave a junction at the origin. A road with slope m makes an angle θ with the positive x-axis, where tan θ = m.

        (A) (i) Starting from the sine and cosine difference formulas, derive tan(α − β) = (tan α − tan β)/(1 + tan α tan β).
        (ii) State the condition on α and β under which the formula cannot be used.

        (B) Road P has slope 3 and road Q has slope 1/2.
        (i) Use (A) to find the exact angle between the roads.
        (ii) (Calculator.) Road R has slope 2 and road S has slope 0.75. Find the angle between R and S to the nearest hundredth of a radian.

        (C) Road T has slope 2 and road U has slope −1/2. Explain what happens when you apply the formula, and what it tells you about the roads.
      answer: |
        (A) (i) tan(α − β) = sin(α − β)/cos(α − β) = (sin α cos β − cos α sin β)/(cos α cos β + sin α sin β). Divide numerator and denominator by cos α cos β: (tan α − tan β)/(1 + tan α tan β).
        (ii) It fails when 1 + tan α tan β = 0 (that is, α − β is an odd multiple of π/2) or when tan α or tan β is undefined.
        (B) (i) tan(θ_P − θ_Q) = (3 − 1/2)/(1 + 3 · 1/2) = (5/2)/(5/2) = 1, so the angle is π/4 (45°).
        (ii) tan(θ_R − θ_S) = (2 − 0.75)/(1 + 1.5) = 1.25/2.5 = 0.5, so the angle is tan⁻¹(0.5) ≈ 0.46 radians.
        (C) The denominator is 1 + 2(−1/2) = 0, so the formula gives a division by zero: tan(θ_T − θ_U) is undefined, which means θ_T − θ_U = π/2 (up to a multiple of π). The roads are perpendicular, matching the slope test m₁m₂ = −1.
      explanation: |
        Six points. (A) 1 point for writing the quotient of the difference formulas and dividing by cos α cos β; 1 point for the condition 1 + tan α tan β = 0 (or an undefined tangent). (B) 1 point for tan = 1 and π/4; 1 point for 0.46 radians (accept 0.46 ± 0.01, or 26.57° with a note that radians were asked). (C) 1 point for the zero denominator; 1 point for concluding the roads are perpendicular.
