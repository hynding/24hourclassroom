        Find sin(sin⁻¹(3/5) + cos⁻¹(5/13)) exactly using a sum formula, then give it to the nearest thousandth.
      answer: { value: 0.969, tolerance: 0.001 }
      explanation: |
        Let A = sin⁻¹(3/5) and B = cos⁻¹(5/13), both in quadrant I. Then cos A = 4/5 and sin B = 12/13. sin(A + B) = (3/5)(5/13) + (4/5)(12/13) = 15/65 + 48/65 = 63/65 ≈ 0.969.
