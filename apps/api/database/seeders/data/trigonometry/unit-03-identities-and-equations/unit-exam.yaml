unit: 3
description: |
  44 questions · about 90 minutes · every topic of Unit 3 (3.1 to 3.12): simplifying and factoring trigonometric
  expressions, verifying identities, sum and difference, cofunction and reduction, double-angle, power-reducing
  and half-angle formulas, product-to-sum and sum-to-product formulas, combining a sin x + b cos x, and solving
  equations and inequalities with multiple angles, identities and a calculator, with a little review of Units 1
  and 2. Includes three shared-context sets (two angles given by a ratio and a quadrant, the sinusoid
  cos x − √3 sin x, and a hypothetical temperature model), select-all, true/false, fill-in-the-blank and numeric
  items, two short-answer questions (3 points each) and two free-response questions (6 points each: a triple-angle
  identity and its equation, and a hypothetical daylight model). Angles are in radians unless degrees are shown,
  and n stands for any integer. Seven items are marked (Calculator.); the rest are designed to be done by hand.
  Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
  automatically; the short-answer and free-response items are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: two angles from ratios and quadrants (3.4, 3.6, 3.7)
  - slug: trig-u03-exam-q01
    type: multiple_choice
    topic_code: "3.4"
    source: "Original item; Common Core HSF-TF.C.9"
    points: 1
    stimulus: |
      Angle α is in quadrant II with sin α = 5/13. Angle β satisfies 3π/2 < β < 2π (quadrant IV) with cos β = 3/5.
    prompt: |
      What is the exact value of sin(α + β)?
    options:
      - "−33/65"
      - "33/65"
      - "63/65"
      - "−63/65"
    option_explanations:
      - |
        One sign slip (cos α = +12/13 or sin β = +4/5) gives 15/65 − 48/65 = −33/65; in quadrants II and IV both are negative.
      - |
        33/65 = 48/65 − 15/65 is sin(β − α), the difference formula; sin(α + β) adds the two products.
      - |
        Correct. cos α = −12/13 and sin β = −4/5, so sin(α + β) = (5/13)(3/5) + (−12/13)(−4/5) = 15/65 + 48/65 = 63/65.
      - |
        The two products are both positive here, (5/13)(3/5) and (−12/13)(−4/5), so the sum cannot be negative.
    answer: 2
  - slug: trig-u03-exam-q02
    type: multiple_choice
    topic_code: "3.6"
    source: "Original item; Common Core HSF-TF.C.9"
    points: 1
    stimulus: |
      Angle α is in quadrant II with sin α = 5/13. Angle β satisfies 3π/2 < β < 2π (quadrant IV) with cos β = 3/5.
    prompt: |
      What is the exact value of cos 2α?
    options:
      - "119/169"
      - "−119/169"
      - "10/13"
      - "−120/169"
    option_explanations:
      - |
        Correct. cos 2α = 1 − 2 sin²α = 1 − 2(25/169) = 119/169. The quadrant of α does not matter for this form.
      - |
        This is sin²α − cos²α, the negative of the double-angle formula cos²α − sin²α.
      - |
        This doubles sin α; the double-angle formula for cosine is not 2 times a sine or cosine.
      - |
        −120/169 is sin 2α = 2(5/13)(−12/13), not cos 2α.
    answer: 0
  - slug: trig-u03-exam-q03
    type: multiple_choice
    topic_code: "3.7"
    source: "Original item; Common Core HSF-TF.C.9"
    points: 1
    stimulus: |
      Angle α is in quadrant II with sin α = 5/13. Angle β satisfies 3π/2 < β < 2π (quadrant IV) with cos β = 3/5.
    prompt: |
      What is the exact value of tan(β/2)?
    options:
      - "1/2"
      - "−2"
      - "−4/3"
      - "−1/2"
    option_explanations:
      - |
        The size is right, but β/2 lies between 3π/4 and π, in quadrant II, where tangent is negative.
      - |
        This is sin β/(1 − cos β) = (−4/5)/(2/5) inverted from the formula tan(β/2) = (1 − cos β)/sin β.
      - |
        −4/3 is tan β itself; the half-angle tangent needs the formula, not the original ratio.
      - |
        Correct. tan(β/2) = (1 − cos β)/sin β = (2/5)/(−4/5) = −1/2, negative as quadrant II requires.
    answer: 3
  # ---- Topics 3.1 to 3.8
  - slug: trig-u03-exam-q04
    type: multiple_choice
    topic_code: "3.1"
    source: "Original item; Common Core HSF-TF.C.8"
    points: 1
    prompt: |
      Where it is defined, cot x · sec x · sin x simplifies to which expression?
    options:
      - "sin x"
      - "1"
      - "cos x"
      - "tan x"
    option_explanations:
      - |
        One factor of sin x appears in the numerator and one in the denominator of cot x, so they cancel completely.
      - |
        Correct. (cos x/sin x)(1/cos x)(sin x) = 1: every factor cancels.
      - |
        sec x = 1/cos x cancels the cos x from cot x, so no cosine is left.
      - |
        This treats cot x as tan x; cot x = cos x/sin x, which cancels with sec x and sin x.
    answer: 1
  - slug: trig-u03-exam-q05
    type: multiple_choice
    topic_code: "3.1"
    source: "Original item; Common Core HSF-TF.C.8"
    points: 1
    prompt: |
      Where it is defined, (1 + tan²x)/csc²x simplifies to which expression?
    options:
      - "1"
      - "cot²x"
      - "sec²x csc²x"
      - "tan²x"
    option_explanations:
      - |
        1 + tan²x is sec²x, not csc²x, so the quotient does not cancel to 1.
      - |
        This inverts the result: sec²x/csc²x = sin²x/cos²x, which is tan²x.
      - |
        Dividing by csc²x means multiplying by sin²x, not by csc²x.
      - |
        Correct. 1 + tan²x = sec²x, and sec²x/csc²x = (1/cos²x)(sin²x) = tan²x.
    answer: 3
  - slug: trig-u03-exam-q06
    type: multiple_choice
    topic_code: "3.2"
    source: "Original item; Common Core HSF-TF.C.8"
    points: 1
    prompt: |
      Treating sin x as a single variable, which is the complete factorisation of sin²x − 3 sin x + 2?
    options:
      - "(sin x − 1)(sin x − 2)"
      - "(sin x + 1)(sin x + 2)"
      - "(sin x − 1)(sin x + 2)"
      - "sin x (sin x − 3) + 2"
    option_explanations:
      - |
        Correct. Treat sin x as u: u² − 3u + 2 = (u − 1)(u − 2), and expanding gives back the original.
      - |
        Expanding gives sin²x + 3 sin x + 2; the middle term has the wrong sign.
      - |
        Expanding gives sin²x + sin x − 2; the factors' constants must multiply to +2 and add to −3.
      - |
        This is a rearrangement, not a factorisation: the expression is still a sum.
    answer: 0
  - slug: trig-u03-exam-q07
    type: multiple_choice
    topic_code: "3.2"
    source: "Original item; Common Core HSF-TF.C.8"
    points: 1
    prompt: |
      Multiplying by a conjugate, which expression is equal to sin x/(1 − cos x) wherever both are defined?
    options:
      - "(1 − cos x)/sin x"
      - "1 + cos x"
      - "(1 + cos x)/sin x"
      - "sin x/(1 + cos x)"
    option_explanations:
      - |
        This is the reciprocal of the expression; at x = π/3 it gives 1/√3, but the original is (√3/2)/(1/2) = √3.
      - |
        After multiplying by (1 + cos x)/(1 + cos x), the denominator is sin²x, which leaves a sin x in the denominator.
      - |
        Correct. sin x(1 + cos x)/(1 − cos²x) = sin x(1 + cos x)/sin²x = (1 + cos x)/sin x.
      - |
        Changing the sign in the denominator changes the value: at x = π/3 this is 1/√3, but the original is √3.
    answer: 2
  - slug: trig-u03-exam-q08
    type: multiple_choice
    topic_code: "3.4"
    source: "Original item; Common Core HSF-TF.C.9"
    points: 1
    prompt: |
      Using π/12 = π/3 − π/4, what is the exact value of cos(π/12)?
    options:
      - "(√6 − √2)/4"
      - "(√6 + √2)/4"
      - "(√3 − 1)/2"
      - "1/2 − √2/2"
    option_explanations:
      - |
        This is sin(π/12); the cosine difference formula adds the two products.
      - |
        Correct. cos(π/3 − π/4) = cos(π/3)cos(π/4) + sin(π/3)sin(π/4) = √2/4 + √6/4.
      - |
        (√3 − 1)/2 is cos(π/6) − cos(π/3), a guess that treats cosine as linear; it is about 0.366, while cos(π/12) ≈ 0.966.
      - |
        This is cos(π/3) − cos(π/4), treating cosine as linear.
    answer: 1
  - slug: trig-u03-exam-q09
    type: multiple_choice
    topic_code: "3.5"
    source: "Original item; Common Core HSF-TF.C.9"
    points: 1
    prompt: |
      Which expression is equal to sin(π + x) for every x?
    options:
      - "−sin x"
      - "sin x"
      - "−cos x"
      - "cos x"
    option_explanations:
      - |
        Correct. sin π cos x + cos π sin x = 0 − sin x = −sin x; a half-turn sends the point to the opposite side of the circle.
      - |
        sin(π − x) = sin x; with π + x the sign changes because cos π = −1.
      - |
        A half-turn does not swap sine and cosine; that needs a quarter-turn, π/2.
      - |
        cos x = sin(π/2 + x); adding π instead of π/2 gives −sin x.
    answer: 0
  - slug: trig-u03-exam-q10
    type: multiple_choice
    topic_code: "3.6"
    source: "Original item; Common Core HSF-TF.C.9"
    points: 1
    prompt: |
      If tan x = 3, what is tan 2x?
    options:
      - "6"
      - "3/4"
      - "−3/8"
      - "−3/4"
    option_explanations:
      - |
        Doubling the tangent ignores the denominator of the double-angle formula.
      - |
        The denominator is 1 − tan²x = 1 − 9 = −8, so the result is negative.
      - |
        This leaves out the factor 2 in the numerator: 3/(1 − 9) = −3/8. The formula is 2 tan x/(1 − tan²x).
      - |
        Correct. tan 2x = 2 tan x/(1 − tan²x) = 6/(1 − 9) = −3/4.
    answer: 3
  - slug: trig-u03-exam-q11
    type: multiple_choice
    topic_code: "3.7"
    source: "Original item; Common Core HSF-TF.C.9"
    points: 1
    prompt: |
      Using a half-angle formula with 45°, what is the exact value of sin 22.5°?
    options:
      - "√(2 + √2)/2"
      - "√2/4"
      - "√(2 − √2)/2"
      - "−√(2 − √2)/2"
    option_explanations:
      - |
        This is cos 22.5°; the sine half-angle formula uses 1 − cos 45°.
      - |
        This halves sin 45°; halving an angle does not halve its sine.
      - |
        Correct. sin 22.5° = +√((1 − cos 45°)/2) = √((2 − √2)/4) = √(2 − √2)/2, positive in quadrant I.
      - |
        22.5° is in quadrant I, so the positive root is required.
    answer: 2
  - slug: trig-u03-exam-q12
    type: multiple_choice
    topic_code: "3.7"
    source: "Original item; Common Core HSF-TF.C.9"
    points: 1
    prompt: |
      Applying power-reducing formulas twice, which expression is equal to cos⁴x for every x?
    options:
      - "(1 + cos 2x)²"
      - "(3 + 4 cos 2x + cos 4x)/8"
      - "(1 + cos 4x)/2"
      - "(3 − 4 cos 2x + cos 4x)/8"
    option_explanations:
      - |
        cos²x is (1 + cos 2x)/2, so its square has a denominator of 4; this is 4 cos⁴x.
      - |
        Correct. cos⁴x = ((1 + cos 2x)/2)² = (1 + 2 cos 2x + cos²2x)/4, and cos²2x = (1 + cos 4x)/2, giving (3 + 4 cos 2x + cos 4x)/8.
      - |
        This is cos²2x, not cos⁴x; at x = π/4 it gives (1 + cos π)/2 = 0, but cos⁴(π/4) = 1/4.
      - |
        This is sin⁴x, which uses (1 − cos 2x)/2.
    answer: 1
  - slug: trig-u03-exam-q13
    type: multiple_choice
    topic_code: "3.8"
    source: "Original item; Common Core HSF-TF.C.9 (extension)"
    points: 1
    prompt: |
      Which expression is equal to sin 4x cos 2x for every x?
    options:
      - "½(sin 6x + sin 2x)"
      - "½(sin 6x − sin 2x)"
      - "sin 6x + sin 2x"
      - "½(cos 2x − cos 6x)"
    option_explanations:
      - |
        Correct. sin A cos B = ½[sin(A + B) + sin(A − B)] with A = 4x and B = 2x.
      - |
        The minus sign belongs to cos A sin B; sin A cos B adds the two sines.
      - |
        The product-to-sum formula carries a factor of ½; this is 2 sin 4x cos 2x.
      - |
        This is the formula for sin 4x sin 2x, a product of two sines.
    answer: 0
  - slug: trig-u03-exam-q14
    type: multiple_choice
    topic_code: "3.8"
    source: "Original item; Common Core HSF-TF.C.9 (extension)"
    points: 1
    prompt: |
      Using a sum-to-product formula, what is the exact value of sin 105° − sin 15°?
    options:
      - "sin 90° = 1"
      - "√6/2"
      - "−√2/2"
      - "√2/2"
    option_explanations:
      - |
        Sine is not linear, so sin 105° − sin 15° is not sin(105° − 15°).
      - |
        This uses the sum formula, 2 sin 60° cos 45°, which gives sin 105° + sin 15°.
      - |
        sin 105° > sin 15° (about 0.966 and 0.259), so the difference is positive.
      - |
        Correct. sin u − sin v = 2 cos((u + v)/2) sin((u − v)/2) = 2 cos 60° sin 45° = 2 · ½ · √2/2 = √2/2.
    answer: 3
  # ---- Stimulus set B: one sinusoid (3.9, 3.11, 3.12)
  - slug: trig-u03-exam-q15
    type: multiple_choice
    topic_code: "3.9"
    source: "Original item; Common Core HSF-TF.C.9 (extension)"
    points: 1
    stimulus: |
      Let g(x) = cos x − √3 sin x, where x is in radians.
    prompt: |
      Which expression is equal to g(x) for every x?
    options:
      - "2 sin(x − π/6)"
      - "2 sin(x + π/6)"
      - "2 sin(x + 5π/6)"
      - "2 sin(x − 5π/6)"
    option_explanations:
      - |
        tan⁻¹(1/(−√3)) = −π/6 ignores the quadrant: here a = −√3 < 0. This option is −g(x).
      - |
        2 sin(x + π/6) expands to √3 sin x + cos x; the sine coefficient has the wrong sign.
      - |
        Correct. Writing g as −√3 sin x + 1 cos x: R = 2, cos φ = −√3/2, sin φ = 1/2, so φ = 5π/6 in quadrant II.
      - |
        sin φ must be +1/2 (b = 1 > 0); −5π/6 has sine −1/2.
    answer: 2
  - slug: trig-u03-exam-q16
    type: multiple_choice
    topic_code: "3.9"
    source: "Original item; Common Core HSF-TF.C.9 (extension)"
    points: 1
    stimulus: |
      Let g(x) = cos x − √3 sin x, where x is in radians.
    prompt: |
      What is the maximum value of g, and where in [0, 2π) does it occur?
    options:
      - "Maximum 1 + √3, at x = 0"
      - "Maximum 2, at x = 5π/3"
      - "Maximum 2, at x = π/2"
      - "Maximum 2, at x = 2π/3"
    option_explanations:
      - |
        Adding coefficients does not give the amplitude, and g(0) = 1.
      - |
        Correct. g(x) = 2 sin(x + 5π/6) is 2 when x + 5π/6 = 5π/2, so x = 5π/3. Check: 1/2 − √3(−√3/2) = 2.
      - |
        g(π/2) = 0 − √3 = −√3, near the minimum; π/2 is where an unshifted sine peaks.
      - |
        g(2π/3) = −1/2 − 3/2 = −2: that is the minimum, half a period from the maximum.
    answer: 1
  - slug: trig-u03-exam-q17
    type: multiple_choice
    topic_code: "3.11"
    source: "Original item; Common Core HSF-TF.B.7"
    points: 1
    stimulus: |
      Let g(x) = cos x − √3 sin x, where x is in radians.
    prompt: |
      Which list gives every solution of g(x) = 1 in [0, 2π)?
    options:
      - "π/3 and 5π/3"
      - "0 only"
      - "π/6 and 5π/6"
      - "0 and 4π/3"
    option_explanations:
      - |
        g(π/3) = 1/2 − 3/2 = −1, not 1; these solve cos x = 1/2, ignoring the sine term.
      - |
        0 works, but sin(x + 5π/6) = 1/2 has a second solution in the interval, x = 4π/3.
      - |
        These solve sin x = 1/2; the equation is sin(x + 5π/6) = 1/2, whose angle is shifted.
      - |
        Correct. sin(x + 5π/6) = 1/2 with x + 5π/6 in [5π/6, 17π/6) gives 5π/6 and 13π/6, so x = 0 and 4π/3.
    answer: 3
  - slug: trig-u03-exam-q18
    type: multiple_choice
    topic_code: "3.12"
    source: "Original item; Common Core HSF-TF.B.7"
    points: 1
    stimulus: |
      Let g(x) = cos x − √3 sin x, where x is in radians.
    prompt: |
      Which is the solution set of g(x) > 1 on [0, 2π)?
    options:
      - "4π/3 < x < 2π"
      - "0 < x < 4π/3"
      - "4π/3 ≤ x < 2π"
      - "π/6 < x < 5π/6"
    option_explanations:
      - |
        Correct. The boundary points are 0 and 4π/3; a test value 5π/3 gives g = 2 > 1, and a test value π gives g = −1.
      - |
        On this interval g stays below 1 (it equals 1 only at x = 0); a test value x = π gives g(π) = −1.
      - |
        The inequality is strict, and g(4π/3) = 1 exactly, so 4π/3 is excluded.
      - |
        This solves sin x > 1/2 without the shift; g(π/2) = −√3, which fails.
    answer: 0
  - slug: trig-u03-exam-q19
    type: multiple_choice
    topic_code: "3.9"
    source: "Original item; Common Core HSF-TF.C.9 (extension)"
    points: 1
    prompt: |
      What is the minimum value of y = 7 sin x − 24 cos x?
    options:
      - "−31"
      - "−24"
      - "−25"
      - "−17"
    option_explanations:
      - |
        −31 adds the sizes of the coefficients; the two terms cannot reach their extremes at the same x.
      - |
        −24 is only the cosine term's extreme; the combined amplitude is larger.
      - |
        Correct. y = 25 sin(x + φ) with R = √(49 + 576) = 25, so the minimum is −25.
      - |
        This subtracts the coefficients; R comes from the square root of the sum of their squares.
    answer: 2
  # ---- Topics 3.10 to 3.12
  - slug: trig-u03-exam-q20
    type: multiple_choice
    topic_code: "3.10"
    source: "Original item; Common Core HSF-TF.B.7"
    points: 1
    prompt: |
      Which describes all solutions of 2 cos x − √3 = 0 (n any integer)?
    options:
      - "x = π/6 + 2πn or x = 5π/6 + 2πn"
      - "x = π/6 + 2πn or x = 11π/6 + 2πn"
      - "x = π/6 + πn"
      - "x = π/3 + 2πn or x = 5π/3 + 2πn"
    option_explanations:
      - |
        5π/6 has cosine −√3/2; this uses sine's quadrants (I and II) instead of cosine's (I and IV).
      - |
        Correct. cos x = √3/2: reference angle π/6, cosine positive in quadrants I and IV.
      - |
        π/6 + π = 7π/6 has cosine −√3/2; cosine solutions are not π apart.
      - |
        cos(π/3) = 1/2; the value √3/2 belongs to the reference angle π/6.
    answer: 1
  - slug: trig-u03-exam-q21
    type: multiple_choice
    topic_code: "3.10"
    source: "Original item; Common Core HSF-TF.B.7"
    points: 1
    prompt: |
      Which list gives every solution of cos²x = cos x in [0, 2π)?
    options:
      - "0, π/2, 3π/2"
      - "0 only"
      - "π/2, 3π/2"
      - "0, π"
    option_explanations:
      - |
        Correct. cos x (cos x − 1) = 0: cos x = 0 gives π/2, 3π/2 and cos x = 1 gives 0.
      - |
        Dividing by cos x leaves cos x = 1 and loses π/2 and 3π/2, where both sides are 0.
      - |
        This drops the factor cos x − 1 = 0, which gives x = 0.
      - |
        cos π = −1, so cos²π = 1 ≠ −1; π does not satisfy the equation.
    answer: 0
  - slug: trig-u03-exam-q22
    type: multiple_choice
    topic_code: "3.11"
    source: "Original item; Common Core HSF-TF.B.7"
    points: 1
    prompt: |
      How many solutions does cos 4x = 0 have in [0, 2π)?
    options:
      - "2"
      - "4"
      - "6"
      - "8"
    option_explanations:
      - |
        2 is the number of solutions of cos x = 0 in one turn; 4x makes four turns.
      - |
        This counts one solution per turn; cosine is zero twice in every turn.
      - |
        The angle 4x runs over [0, 8π), four full turns, each with two zeros; six stops a turn short.
      - |
        Correct. With u = 4x on [0, 8π), cos u = 0 at π/2 + πn for n = 0 to 7: eight values, so x = π/8 + πn/4 gives eight solutions.
    answer: 3
  - slug: trig-u03-exam-q23
    type: multiple_choice
    topic_code: "3.12"
    source: "Original item; Common Core HSF-TF.B.7"
    points: 1
    prompt: |
      (Calculator.) Which list gives the solutions of tan x = 2 in [0, 2π), to three decimal places?
    options:
      - "1.107 only"
      - "1.107 and 2.034"
      - "1.107 and 4.249"
      - "63.435 and 243.435"
    option_explanations:
      - |
        The calculator returns one principal value; tangent repeats every π, so there is a second solution in [0, 2π).
      - |
        2.034 = π − 1.107 is the second-solution rule for sine; tangent is negative in quadrant II.
      - |
        Correct. tan⁻¹ 2 ≈ 1.107, and adding the period π gives 4.249 in quadrant III, where tangent is also positive.
      - |
        These are degrees; the interval [0, 2π) calls for radians.
    answer: 2
  - slug: trig-u03-exam-q24
    type: multiple_choice
    topic_code: "3.12"
    source: "Original item; Common Core HSF-TF.B.7"
    points: 1
    prompt: |
      Which is the solution set of sin x < −√3/2 on [0, 2π)?
    options:
      - "π/3 < x < 2π/3"
      - "4π/3 < x < 5π/3"
      - "7π/6 < x < 11π/6"
      - "x < 4π/3 or x > 5π/3"
    option_explanations:
      - |
        Here sin x > √3/2, the reflection of the correct arc across the x-axis.
      - |
        Correct. sin x = −√3/2 at 4π/3 and 5π/3, and a test value 3π/2 gives −1 < −√3/2.
      - |
        These are the boundaries for sin x < −1/2; the value √3/2 belongs to the reference angle π/3.
      - |
        This is the complement: at x = 0, sin x = 0, which is not less than −√3/2.
    answer: 1
  # ---- Stimulus set C: a hypothetical temperature model (3.10, 3.12)
  - slug: trig-u03-exam-q25
    type: multiple_choice
    topic_code: "3.10"
    source: "Original item; Common Core HSF-TF.B.7"
    points: 1
    stimulus: |
      In a hypothetical model, the temperature in a greenhouse is T(t) = 18 − 6 cos(πt/12) degrees Celsius, t hours after midnight, for 0 ≤ t ≤ 24.
