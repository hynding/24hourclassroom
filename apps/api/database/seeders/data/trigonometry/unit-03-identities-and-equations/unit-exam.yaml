  # ---- Select-all, true/false, fill-in-the-blank and numeric
  - slug: trig-u03-exam-q31
    type: multi_select
    topic_code: "3.3"
    source: "Original item; Common Core HSF-TF.C.8"
    points: 2
    partial_credit: true
    prompt: |
      Which of these five trigonometric equations are identities (each true wherever both of its sides are defined)? Select all that apply.
    options:
      - "cos 2x = (cos x − sin x)²"
      - "sin⁴x − cos⁴x = sin²x − cos²x"
      - "tan x + 1 = sec x"
      - "sin 2x/(1 + cos 2x) = tan x"
      - "csc x − sin x = cos x cot x"
    option_explanations:
      - |
        (cos x − sin x)² = 1 − 2 sin x cos x = 1 − sin 2x, not cos 2x: at x = π/2 the left side is cos π = −1 but the right side is (0 − 1)² = 1.
      - |
        Correct. sin⁴x − cos⁴x = (sin²x − cos²x)(sin²x + cos²x), and the second factor is 1.
      - |
        At x = π/4 the left side is 2 and the right side is √2; one counterexample shows it is not an identity.
      - |
        Correct. 2 sin x cos x/(1 + 2cos²x − 1) = 2 sin x cos x/(2cos²x) = sin x/cos x = tan x.
      - |
        Correct. csc x − sin x = (1 − sin²x)/sin x = cos²x/sin x = cos x · (cos x/sin x) = cos x cot x.
    answer: [1, 3, 4]
  - slug: trig-u03-exam-q32
    type: multi_select
    topic_code: "3.5"
    source: "Original item; Common Core HSF-TF.C.9"
    points: 2
    partial_credit: true
    prompt: |
      Which expressions are equal to cos x for every x? Select all that apply.
    options:
      - "sin(π/2 − x)"
      - "cos(π − x)"
      - "sin(x + π/2)"
      - "sin(π − x)"
      - "cos(x + π/2)"
    option_explanations:
      - |
        Correct. This is the cofunction identity: sin(π/2 − x) = sin(π/2)cos x − cos(π/2)sin x = cos x.
      - |
        cos π cos x + sin π sin x = −cos x; reflecting across the y-axis changes the sign of the cosine.
      - |
        Correct. sin x cos(π/2) + cos x sin(π/2) = cos x: shifting sine left by π/2 gives cosine.
      - |
        sin(π − x) = sin x, the supplementary-angle reduction; it does not turn sine into cosine.
      - |
        cos x cos(π/2) − sin x sin(π/2) = −sin x.
    answer: [0, 2]
  - slug: trig-u03-exam-q33
    type: multi_select
    topic_code: "3.10"
    source: "Original item; Common Core HSF-TF.B.7"
    points: 2
    partial_credit: true
    prompt: |
      Which values of x are solutions of tan²x − tan x = 0? Select all that apply.
    options:
      - "0"
      - "π/4"
      - "π/2"
      - "3π/4"
      - "5π/4"
    option_explanations:
      - |
        Correct. tan 0 = 0, so tan x (tan x − 1) = 0 holds.
      - |
        Correct. tan(π/4) = 1, so the factor tan x − 1 is zero.
      - |
        tan(π/2) is undefined, so π/2 cannot be a solution of an equation in tan x.
      - |
        tan(3π/4) = −1, and (−1)² − (−1) = 2 ≠ 0.
      - |
        Correct. tan(5π/4) = 1, since tangent repeats every π.
    answer: [0, 1, 4]
  - slug: trig-u03-exam-q34
    type: true_false
    topic_code: "3.3"
    source: "Original item; Common Core HSF-TF.C.8"
    points: 1
    prompt: |
      True or false: If an equation in x is true at x = π/6 and at x = π/4, it must be an identity.
    answer: false
    explanation: |
      False. Agreeing at two values only shows that π/6 and π/4 are solutions. For example, sin 2x = cos x holds at x = π/6 (both sides √3/2) but fails at x = 0 (0 versus 1). Values can disprove an identity; only an algebraic argument proves one.
  - slug: trig-u03-exam-q35
    type: true_false
    topic_code: "3.12"
    source: "Original item; Common Core HSF-TF.B.7"
    points: 1
    prompt: |
      True or false: On [0, 2π), tan x > 0 exactly when 0 < x < π/2 or π < x < 3π/2.
