  # ---- Short answer
  - slug: trig-u03-exam-q41
    type: short_answer
    topic_code: "3.3"
    source: "Original item; Common Core HSF-TF.C.8"
    points: 3
    prompt: |
      Verify the identity cos x/(1 − sin x) = sec x + tan x, working on one side only.

      (a) Multiply the left side by a suitable conjugate and simplify the denominator.
      (b) Complete the simplification to sec x + tan x.
      (c) State the values of x in [0, 2π) at which the identity does not apply, and why.
    answer: |
      (a) Multiply by (1 + sin x)/(1 + sin x): cos x(1 + sin x)/(1 − sin²x) = cos x(1 + sin x)/cos²x.
      (b) Cancel a factor of cos x: (1 + sin x)/cos x = 1/cos x + sin x/cos x = sec x + tan x.
      (c) x = π/2 and x = 3π/2. At π/2 the left side's denominator 1 − sin x is 0, and at both values cos x = 0, so sec x and tan x are undefined.
    explanation: |
      Three points, one per part. (a) the conjugate and the denominator cos²x. (b) cancelling a factor (not a term) and splitting into sec x + tan x, with no work done on the right side. (c) both values with a reason (accept π/2 and 3π/2 justified by cos x = 0).
  - slug: trig-u03-exam-q42
    type: short_answer
    topic_code: "3.11"
    source: "Original item; Common Core HSF-TF.C.8"
    points: 3
    prompt: |
      Solve 2 sin²x − cos x − 1 = 0 on [0, 2π), with x in radians.

      (a) Use an identity to rewrite the equation in terms of cos x only.
      (b) Factor the result.
      (c) Find every solution in [0, 2π).
    answer: |
      (a) sin²x = 1 − cos²x gives 2 − 2cos²x − cos x − 1 = 0, that is 2cos²x + cos x − 1 = 0.
      (b) (2 cos x − 1)(cos x + 1) = 0.
      (c) cos x = 1/2 gives π/3 and 5π/3; cos x = −1 gives π. Solutions: π/3, π, 5π/3.
    explanation: |
      Three points, one per part. (a) the substitution and a correct quadratic in cos x (either sign arrangement). (b) a correct factorisation. (c) all three solutions (no credit with one missing).
  # ---- Free response
  - slug: trig-u03-exam-q43
    type: long_answer
    topic_code: "3.6"
    source: "Original item; Common Core HSF-TF.C.9"
    points: 6
    prompt: |
      This question builds a triple-angle formula and uses it (radians throughout).

      (A) (i) Write cos 3x = cos(2x + x) and use the sum and double-angle formulas to show that cos 3x = 4cos³x − 3 cos x.
      (ii) Explain why it is correct to start from the left side and transform it, rather than writing the equation and manipulating both sides.

      (B) (i) If cos θ = 1/3, find the exact value of cos 3θ.
      (ii) Check the formula at x = π/3 by evaluating both sides.

      (C) (i) Use the formula to solve cos 3x = cos x on [0, 2π).
      (ii) Solve the same equation using a sum-to-product formula, and confirm that you get the same solutions.
    answer: |
      (A) (i) cos(2x + x) = cos 2x cos x − sin 2x sin x = (2cos²x − 1)cos x − 2 sin x cos x · sin x = 2cos³x − cos x − 2(1 − cos²x)cos x = 4cos³x − 3 cos x.
      (ii) An identity is what we are trying to prove, so we may not assume it. Transforming one side by known identities produces a chain of equal expressions ending at the other side; manipulating both sides of the claimed equation assumes it is true.
      (B) (i) cos 3θ = 4(1/27) − 3(1/3) = 4/27 − 1 = −23/27.
      (ii) Left side: cos π = −1. Right side: 4(1/2)³ − 3(1/2) = 1/2 − 3/2 = −1. They agree.
      (C) (i) 4cos³x − 3 cos x = cos x gives 4cos³x − 4 cos x = 0, so 4 cos x(cos²x − 1) = −4 cos x sin²x = 0. cos x = 0 gives π/2, 3π/2; sin x = 0 gives 0, π. Solutions: 0, π/2, π, 3π/2.
      (ii) cos 3x − cos x = −2 sin 2x sin x = 0. sin 2x = 0 with 2x in [0, 4π) gives x = 0, π/2, π, 3π/2; sin x = 0 gives 0, π. Same four solutions.
    explanation: |
      Six points. (A) 1 point for a complete derivation with the sum formula, cos 2x = 2cos²x − 1, sin 2x = 2 sin x cos x and sin²x = 1 − cos²x; 1 point for a correct reason about not assuming the identity. (B) 1 point for −23/27; 1 point for both sides equal to −1. (C) 1 point for factoring without dividing and all four solutions; 1 point for the sum-to-product route reaching the same four solutions.
  - slug: trig-u03-exam-q44
    type: long_answer
    topic_code: "3.12"
    source: "Original item; Common Core HSF-TF.B.7"
    points: 6
    prompt: |
      In a hypothetical model, the number of hours of daylight in a northern town on day t of the year is D(t) = 12 + 3 sin(2π(t − 80)/365), for 0 ≤ t ≤ 365 (radians throughout).

      (A) (i) Find the greatest number of hours of daylight and the value of t at which it occurs.
      (ii) Find both values of t in [0, 365] at which D(t) = 12, and say what they represent.

      (B) (i) Solve D(t) > 13.5 on [0, 365]. Give the boundary values exactly, then to the nearest hundredth.
      (ii) For about how many days of the year does the town get more than 13.5 hours of daylight? Explain how the answer relates to the period.

      (C) (i) (Calculator.) Solve D(t) ≥ 14 on [0, 365], giving the boundary values to the nearest hundredth.
      (ii) Explain how you found the second boundary value from the single angle the calculator gave.
    answer: |
      (A) (i) The maximum is 12 + 3 = 15 hours, when 2π(t − 80)/365 = π/2, that is t − 80 = 365/4, so t = 171.25.
      (ii) sin(2π(t − 80)/365) = 0 when 2π(t − 80)/365 = 0 or π: t = 80 and t = 80 + 182.5 = 262.5. These are the days with 12 hours of daylight, the equinoxes of the model.
      (B) (i) 3 sin u > 1.5 with u = 2π(t − 80)/365 means sin u > 1/2, so π/6 < u < 5π/6 (u runs from about −1.38 to 4.91 on [0, 365], so this is the only such interval). Then 365/12 < t − 80 < 5 · 365/12, so 80 + 365/12 < t < 80 + 1825/12, that is 110.42 < t < 232.08.
      (ii) 232.08 − 110.42 ≈ 121.67, about 122 days. That is (5π/6 − π/6)/(2π) = 1/3 of the period of 365 days.
      (C) (i) sin u ≥ 2/3. sin⁻¹(2/3) ≈ 0.7297, so 0.7297 ≤ u ≤ π − 0.7297 ≈ 2.4119. Converting with t = 80 + 365u/(2π): 122.39 ≤ t ≤ 220.11.
      (ii) The calculator gives only α = sin⁻¹(2/3) in [−π/2, π/2]. Sine takes the same value at π − α in quadrant II, and sine stays above 2/3 between α and π − α, so π − α is the other boundary.
    explanation: |
      Six points. (A) 1 point for 15 hours at t = 171.25; 1 point for t = 80 and 262.5 with an interpretation (12 hours of daylight). (B) 1 point for 110.42 < t < 232.08 with exact forms 80 + 365/12 and 80 + 1825/12; 1 point for about 122 days (accept 121.67) linked to one third of the period. (C) 1 point for 122.39 ≤ t ≤ 220.11 (accept ±0.01); 1 point for the π − α explanation.
