      prompt: |
        Find the exact value of sin(2 tan⁻¹(1/2)), written as a decimal.
      answer: { value: 0.8, tolerance: 0.001 }
      explanation: |
        Let θ = tan⁻¹(1/2), in quadrant I. A right triangle with opposite 1 and adjacent 2 has hypotenuse √5, so sin θ = 1/√5 and cos θ = 2/√5. Then sin 2θ = 2(1/√5)(2/√5) = 4/5 = 0.8.
    - slug: trig-u03-w16-q21
      type: short_answer
      topic_code: "3.6"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 3
      prompt: |
        (a) Write cos 3x = cos(2x + x) and expand it with the cosine sum formula.
        (b) Use double-angle formulas and the Pythagorean identity to write cos 3x in terms of cos x only.
        (c) Check your formula from (b) at x = π/3.
      answer: |
        (a) cos 3x = cos 2x cos x − sin 2x sin x.
        (b) = (2cos²x − 1)cos x − 2 sin²x cos x = 2cos³x − cos x − 2(1 − cos²x)cos x = 4cos³x − 3cos x.
        (c) cos π = −1, and 4(1/2)³ − 3(1/2) = 1/2 − 3/2 = −1. They agree.
      explanation: |
        Three points, one per part. (a) the correct expansion. (b) uses cos 2x = 2cos²x − 1, sin 2x = 2 sin x cos x and sin²x = 1 − cos²x to reach 4cos³x − 3cos x. (c) both values equal −1.
    - slug: trig-u03-w16-q22
      type: short_answer
      topic_code: "3.7"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 3
      prompt: |
        Rewrite sin⁴x with no powers of trigonometric functions higher than 1.

        (a) Write sin⁴x as (sin²x)² and apply a power-reducing formula once.
        (b) Expand, and apply a power-reducing formula to the squared cosine term.
        (c) Simplify to a single fraction, and check the result at x = π/2.
      answer: |
        (a) sin⁴x = ((1 − cos 2x)/2)² = (1 − 2 cos 2x + cos²2x)/4.
        (b) cos²2x = (1 + cos 4x)/2, so sin⁴x = [1 − 2 cos 2x + (1 + cos 4x)/2]/4.
        (c) sin⁴x = (3 − 4 cos 2x + cos 4x)/8. At x = π/2: sin⁴(π/2) = 1, and (3 − 4 cos π + cos 2π)/8 = (3 + 4 + 1)/8 = 1.
      explanation: |
        Three points, one per part. (a) the squared power-reduced form expanded correctly (middle term −2 cos 2x). (b) cos²2x = (1 + cos 4x)/2 with 4x. (c) (3 − 4 cos 2x + cos 4x)/8 and a correct check.
    - slug: trig-u03-w16-q23
      type: long_answer
      topic_code: "3.6"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 6
      prompt: |
        A hypothetical garden bed is a semicircle of radius 5 m. A rectangular planter is placed inside it with one side along the diameter and its two upper corners on the arc. The upper-right corner is at (5 cos θ, 5 sin θ), where the centre of the diameter is the origin and 0 < θ < π/2.

        (A) (i) Show that the area of the planter is A(θ) = 50 sin θ cos θ.
        (ii) Use a double-angle formula to write A(θ) as a single sine function.

        (B) (i) Find the largest possible area and the angle θ at which it occurs.
        (ii) Give the planter's dimensions at that angle, exactly.

        (C) (i) Find both angles θ in (0, π/2) for which the area is 12.5 m².
        (ii) (Calculator.) For the smaller angle, find the planter's width and height to the nearest hundredth of a metre, and check that their product is 12.5.
      answer: |
        (A) (i) The rectangle runs from x = −5 cos θ to x = 5 cos θ, so its width is 10 cos θ, and its height is 5 sin θ. A(θ) = 10 cos θ · 5 sin θ = 50 sin θ cos θ.
        (ii) A(θ) = 25 · 2 sin θ cos θ = 25 sin 2θ.
        (B) (i) sin 2θ ≤ 1, with equality when 2θ = π/2, so the maximum area is 25 m² at θ = π/4.
        (ii) Width 10 cos(π/4) = 5√2 m and height 5 sin(π/4) = 5√2/2 m (product 25).
        (C) (i) 25 sin 2θ = 12.5 gives sin 2θ = 1/2; with 0 < 2θ < π, 2θ = π/6 or 5π/6, so θ = π/12 or 5π/12.
        (ii) For θ = π/12: width 10 cos(π/12) ≈ 9.66 m and height 5 sin(π/12) ≈ 1.29 m; 9.659 × 1.294 ≈ 12.5.
      explanation: |
        Six points. (A) 1 point for width 10 cos θ and height 5 sin θ giving 50 sin θ cos θ; 1 point for 25 sin 2θ. (B) 1 point for 25 m² at θ = π/4 with a reason (sin 2θ ≤ 1); 1 point for 5√2 by 5√2/2. (C) 1 point for both angles π/12 and 5π/12; 1 point for 9.66 and 1.29 with a product of about 12.5.
