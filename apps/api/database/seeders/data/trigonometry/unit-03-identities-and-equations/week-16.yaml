week: 16
unit: 3
title: "Double-Angle, Power-Reducing and Half-Angle Formulas"
topics: ["3.6", "3.7"]
guide: guides/week-16.md
guide_description: |
  The double-angle formulas from the sum formulas with β = α, the three forms of cos 2x and when to use each,
  tan 2x, and the triple angle sin 3x = 3 sin x − 4 sin³x; the power-reducing formulas and why y = sin²x is a
  sinusoid of period π; the half-angle formulas, with the sign chosen from the quadrant of the half angle and
  the sign-free form of tan(x/2). Worked examples: sin 2θ, cos 2θ and tan 2θ from sin θ = 5/13 in quadrant II,
  sin 3x, cos⁴x = (3 + 4 cos 2x + cos 4x)/8, sin 15° = √(2 − √3)/2 compared with (√6 − √2)/4, and the
  half-angle values when cos θ = −7/25 in quadrant III.
flashcards_description: |
  31 cards on the double-angle formulas and the three forms of cos 2x, double angles from one ratio and a
  quadrant, triple angles, power reduction, half-angle formulas and their signs, and the errors that cost
  the most points.

flashcards:
  - front: sin 2x → double-angle formula
    back: |
      2 sin x cos x, from sin(x + x) = sin x cos x + cos x sin x.
    topic_code: "3.6"
  - front: cos 2x in terms of both sin x and cos x → formula
    back: |
      cos²x − sin²x, from cos(x + x) = cos x cos x − sin x sin x.
    topic_code: "3.6"
  - front: cos 2x in terms of cos x only → formula
    back: |
      2cos²x − 1. Replace sin²x with 1 − cos²x in cos²x − sin²x.
    topic_code: "3.6"
  - front: cos 2x in terms of sin x only → formula
    back: |
      1 − 2sin²x. Replace cos²x with 1 − sin²x in cos²x − sin²x.
    topic_code: "3.6"
  - front: tan 2x → double-angle formula
    back: |
      2 tan x/(1 − tan²x), the tangent sum formula with β = α. Undefined where tan²x = 1.
    topic_code: "3.6"
  - front: sin(π/3) vs 2 sin(π/6) → why they differ
    back: |
      sin(π/3) = √3/2 ≈ 0.866 but 2 sin(π/6) = 1. Doubling the angle does not double the sine.
    topic_code: "3.6"
  - front: sin θ = 5/13 in quadrant II → sin 2θ and cos 2θ
    back: |
      cos θ = −12/13. sin 2θ = 2(5/13)(−12/13) = −120/169; cos 2θ = 1 − 2(25/169) = 119/169.
    topic_code: "3.6"
  - front: cos θ = −3/5 in quadrant II → sin 2θ and cos 2θ
    back: |
      sin θ = 4/5. sin 2θ = 2(4/5)(−3/5) = −24/25; cos 2θ = 2(9/25) − 1 = −7/25. Both negative, so 2θ is in quadrant III.
    topic_code: "3.6"
  - front: Quadrant of 2θ → two ways to find it
    back: |
      Double the interval for θ (π/2 < θ < π gives π < 2θ < 2π), then use the signs of sin 2θ and cos 2θ to choose.
    topic_code: "3.6"
  - front: 2 sin(π/12) cos(π/12) → value
    back: |
      sin(2 · π/12) = sin(π/6) = 1/2.
    topic_code: "3.6"
  - front: cos²(π/8) − sin²(π/8) → value
    back: |
      cos(2 · π/8) = cos(π/4) = √2/2.
    topic_code: "3.6"
  - front: sin 3x in terms of sin x → formula and route
    back: |
      3 sin x − 4 sin³x: expand sin(2x + x), use sin 2x and cos 2x = 1 − 2sin²x, then cos²x = 1 − sin²x.
    topic_code: "3.6"
  - front: cos 3x in terms of cos x → formula
    back: |
      4cos³x − 3cos x, from cos(2x + x) with cos 2x = 2cos²x − 1. Check: x = π/3 gives −1 on both sides.
    topic_code: "3.6"
  - front: (sin x + cos x)² → in terms of sin 2x
    back: |
      sin²x + cos²x + 2 sin x cos x = 1 + sin 2x.
    topic_code: "3.6"
  - front: cos⁴x − sin⁴x → in terms of a double angle
    back: |
      (cos²x − sin²x)(cos²x + sin²x) = cos 2x.
    topic_code: "3.6"
  - front: sin²x → power-reducing formula
    back: |
      (1 − cos 2x)/2, from cos 2x = 1 − 2sin²x.
    topic_code: "3.7"
  - front: cos²x → power-reducing formula
    back: |
      (1 + cos 2x)/2, from cos 2x = 2cos²x − 1.
    topic_code: "3.7"
  - front: tan²x → power-reducing formula
    back: |
      (1 − cos 2x)/(1 + cos 2x), the quotient of the sin²x and cos²x formulas.
    topic_code: "3.7"
  - front: Graph of y = sin²x via power reduction → midline, amplitude, period
    back: |
      sin²x = 1/2 − (1/2)cos 2x: midline 1/2, amplitude 1/2, period π.
    topic_code: "3.7"
  - front: cos⁴x with no powers → result
    back: |
      (3 + 4 cos 2x + cos 4x)/8. Square (1 + cos 2x)/2, then reduce cos²2x = (1 + cos 4x)/2.
    topic_code: "3.7"
  - front: sin²x cos²x with first powers only → result
    back: |
      (sin 2x/2)² = sin²2x/4 = (1 − cos 4x)/8.
    topic_code: "3.7"
  - front: sin(x/2) → half-angle formula
    back: |
      ±√((1 − cos x)/2), with one sign chosen by the quadrant of x/2.
    topic_code: "3.7"
  - front: cos(x/2) → half-angle formula
    back: |
      ±√((1 + cos x)/2), with one sign chosen by the quadrant of x/2.
    topic_code: "3.7"
  - front: tan(x/2) → sign-free half-angle formulas
    back: |
      (1 − cos x)/sin x = sin x/(1 + cos x). The sign takes care of itself.
    topic_code: "3.7"
  - front: sin 15° by a half-angle formula → exact value
    back: |
      √((1 − cos 30°)/2) = √(2 − √3)/2 ≈ 0.259, the same number as (√6 − √2)/4.
    topic_code: "3.7"
  - front: cos 22.5° by a half-angle formula → exact value
    back: |
      √((1 + cos 45°)/2) = √(2 + √2)/2 ≈ 0.924. Positive because 22.5° is in quadrant I.
    topic_code: "3.7"
  - front: tan(π/8) by tan(x/2) = (1 − cos x)/sin x → exact value
    back: |
      (1 − √2/2)/(√2/2) = √2 − 1 ≈ 0.414.
    topic_code: "3.7"
  - front: cos θ = −7/25, π < θ < 3π/2 → sin(θ/2) and cos(θ/2)
    back: |
      θ/2 is in (π/2, 3π/4), quadrant II. sin(θ/2) = √(16/25) = 4/5; cos(θ/2) = −√(9/25) = −3/5.
    topic_code: "3.7"
  - front: Error-spot → "cos 2x = 2 cos x"
    back: |
      At x = 0, cos 0 = 1 but 2 cos 0 = 2. Use cos²x − sin²x, 2cos²x − 1 or 1 − 2sin²x.
    topic_code: "3.6"
  - front: Error-spot → "θ is in quadrant III, so sin(θ/2) is negative"
    back: |
      The sign comes from θ/2, not θ. For π < θ < 3π/2, θ/2 is in quadrant II, where sine is positive.
    topic_code: "3.7"
  - front: Error-spot → "sin²x = 1 − cos 2x"
    back: |
      The factor 1/2 is missing: sin²x = (1 − cos 2x)/2. At x = π/2 the wrong version gives 2.
    topic_code: "3.7"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 3.6 and 3.7: double-angle formulas,
    triple angles, power reduction and half-angle formulas with signs), with about a third reviewing weeks
    14 and 15 (verifying identities, sum, difference and reduction formulas) and Units 1 and 2 (quadrants,
    amplitude and period, inverse compositions). Includes a shared-context set on an angle with
    cos θ = −3/5 in quadrant II. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by
    your teacher against the scoring notes. Items marked (Calculator.) need a calculator; the rest are
    designed to be done by hand.
  questions:
    # ---- Stimulus set: double and half angles from one ratio (3.6, 3.7)
    - slug: trig-u03-w16-q01
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      stimulus: |
        An angle θ satisfies cos θ = −3/5 with π/2 < θ < π.
      prompt: |
        What is the exact value of sin 2θ?
      options:
        - "24/25"
        - "−24/25"
        - "−12/25"
        - "8/5"
      option_explanations:
        - |
          The size is right, but cos θ is negative, so 2 sin θ cos θ = 2(4/5)(−3/5) is negative.
        - |
          Correct. sin θ = 4/5 in quadrant II, so sin 2θ = 2(4/5)(−3/5) = −24/25.
        - |
          −12/25 is sin θ cos θ; the factor 2 in sin 2θ = 2 sin θ cos θ was dropped.
        - |
          8/5 is 2 sin θ, which doubles the value instead of the angle; it is also greater than 1, impossible for a sine.
      answer: 1
    - slug: trig-u03-w16-q02
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      stimulus: |
        An angle θ satisfies cos θ = −3/5 with π/2 < θ < π.
      prompt: |
        What is the exact value of cos 2θ?
      options:
        - "7/25"
        - "−6/5"
        - "−7/25"
        - "−3/5"
      option_explanations:
        - |
          7/25 is sin²θ − cos²θ = 16/25 − 9/25, the formula with its terms reversed.
        - |
          −6/5 is 2 cos θ, which doubles the value instead of the angle; a cosine cannot be less than −1.
        - |
          Correct. cos 2θ = 2cos²θ − 1 = 2(9/25) − 1 = −7/25 (or cos²θ − sin²θ = 9/25 − 16/25).
        - |
          −3/5 comes from 1 − 2 sin θ = 1 − 8/5, which drops the square in 1 − 2sin²θ.
      answer: 2
    - slug: trig-u03-w16-q03
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      stimulus: |
        An angle θ satisfies cos θ = −3/5 with π/2 < θ < π.
      prompt: |
        In which quadrant does the terminal side of 2θ lie?
      options:
        - "Quadrant III"
        - "Quadrant II"
        - "Quadrant IV"
        - "Quadrant I"
      option_explanations:
        - |
          Correct. sin 2θ = −24/25 and cos 2θ = −7/25 are both negative, and π < 2θ < 2π allows quadrant III.
        - |
          Quadrant II is where θ itself lies; doubling the angle moves it, and sin 2θ is negative.
        - |
          Quadrant IV needs a positive cosine, but cos 2θ = −7/25.
        - |
          Doubling π/2 < θ < π gives π < 2θ < 2π, which excludes quadrant I.
      answer: 0
    - slug: trig-u03-w16-q04
      type: multiple_choice
      topic_code: "3.7"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      stimulus: |
        An angle θ satisfies cos θ = −3/5 with π/2 < θ < π.
      prompt: |
        What is the exact value of sin(θ/2)?
      options:
        - "√5/5"
        - "−2√5/5"
        - "2/5"
        - "2√5/5"
      option_explanations:
        - |
          √5/5 = √((1 + cos θ)/2) is cos(θ/2); the sine formula uses 1 − cos θ.
        - |
          θ/2 is between π/4 and π/2, in quadrant I, where sine is positive.
        - |
          2/5 is half of sin θ; the half-angle formula halves the angle, not the value.
        - |
          Correct. θ/2 is in quadrant I, so sin(θ/2) = +√((1 − (−3/5))/2) = √(4/5) = 2√5/5.
      answer: 3
    - slug: trig-u03-w16-q05
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      prompt: |
        Which expression is NOT equal to cos 2x for all x?
      options:
        - "cos²x − sin²x"
        - "2cos²x − 1"
        - "1 − 2sin²x"
        - "2 sin x cos x"
      option_explanations:
        - |
          This is equal to cos 2x: it is cos(x + x) expanded by the cosine sum formula, so it is not the answer.
        - |
          This is equal to cos 2x: replace sin²x with 1 − cos²x in cos²x − sin²x, so it is not the answer.
        - |
          This is equal to cos 2x: replace cos²x with 1 − sin²x in cos²x − sin²x, so it is not the answer.
        - |
          Correct. 2 sin x cos x is sin 2x; at x = 0 it is 0 while cos 0 = 1.
      answer: 3
    - slug: trig-u03-w16-q06
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      prompt: |
        What is the exact value of 2 sin(π/8) cos(π/8)?
      options:
        - "√2/2"
        - "√2/4"
        - "sin(π/16)"
        - "√(2 − √2)/2"
      option_explanations:
        - |
          Correct. 2 sin x cos x = sin 2x, so the expression is sin(π/4) = √2/2.
        - |
          √2/4 is sin(π/8)cos(π/8) without the factor 2, which is half of sin(π/4).
        - |
          The formula doubles the angle, giving π/4, not halves it to π/16.
        - |
          √(2 − √2)/2 is sin(π/8) alone; the product with 2 cos(π/8) has the doubled angle.
      answer: 0
    - slug: trig-u03-w16-q07
      type: multiple_choice
      topic_code: "3.7"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      prompt: |
        Which expression equals sin²x for every x?
      options:
        - "(1 + cos 2x)/2"
        - "1 − cos 2x"
        - "(1 − cos 2x)/2"
        - "(1 − cos x)/2"
      option_explanations:
        - |
          (1 + cos 2x)/2 is cos²x; at x = 0 it gives 1, but sin²0 = 0.
        - |
          The factor 1/2 is missing; at x = π/2 this gives 2, but sin²(π/2) = 1.
        - |
          Correct. Solve cos 2x = 1 − 2sin²x for sin²x.
        - |
          (1 − cos x)/2 is sin²(x/2); the angle inside the cosine must be 2x to give sin²x.
      answer: 2
    - slug: trig-u03-w16-q08
      type: multiple_choice
      topic_code: "3.7"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      prompt: |
        What is the exact value of sin 22.5°?
      options:
        - "√(2 + √2)/2"
        - "√(2 − √2)/2"
        - "−√(2 − √2)/2"
        - "√2/4"
      option_explanations:
        - |
          √(2 + √2)/2 is cos 22.5°, from (1 + cos 45°)/2; sine uses 1 − cos 45°.
        - |
          Correct. sin 22.5° = √((1 − cos 45°)/2) = √((2 − √2)/4) = √(2 − √2)/2 ≈ 0.383, positive in quadrant I.
        - |
          22.5° is in quadrant I, so the sine is positive; the half-angle ± is one sign, chosen by quadrant.
        - |
          √2/4 is half of sin 45°; halving the angle does not halve the sine.
      answer: 1
    - slug: trig-u03-w16-q09
      type: multiple_choice
      topic_code: "1.10"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 1
      prompt: |
        An angle θ satisfies 2π < θ < 5π/2. Where is θ/2, and what are the signs of sin(θ/2) and cos(θ/2)?
      options:
        - "Quadrant III: sin(θ/2) < 0 and cos(θ/2) < 0"
        - "Quadrant I: sin(θ/2) > 0 and cos(θ/2) > 0"
        - "Quadrant II: sin(θ/2) > 0 and cos(θ/2) < 0"
        - "Quadrant IV: sin(θ/2) < 0 and cos(θ/2) > 0"
      option_explanations:
        - |
          Correct. Halving the interval gives π < θ/2 < 5π/4, which is in quadrant III, where both are negative.
        - |
          This reduces θ by 2π first and then halves, but θ/2 and (θ − 2π)/2 differ by π, so the quadrant changes.
        - |
          Quadrant II runs from π/2 to π; θ/2 is greater than π.
        - |
          Quadrant IV runs from 3π/2 to 2π; θ/2 is less than 5π/4.
      answer: 0
    - slug: trig-u03-w16-q10
      type: multiple_choice
      topic_code: "3.4"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        What is the exact value of cos(π/3 + π/4)?
      options:
        - "(√2 + √6)/4"
        - "(√2 − √6)/4"
        - "(1 + √2)/2"
        - "(√6 − √2)/4"
      option_explanations:
        - |
          A plus between the products is the difference formula, giving cos(π/12); the sum formula subtracts.
        - |
          Correct. cos(π/3)cos(π/4) − sin(π/3)sin(π/4) = √2/4 − √6/4 = (√2 − √6)/4 ≈ −0.259.
        - |
          (1 + √2)/2 is cos(π/3) + cos(π/4); the cosine of a sum does not distribute.
        - |
          This has the right size with the wrong sign; 7π/12 is in quadrant II, where cosine is negative.
      answer: 1
    - slug: trig-u03-w16-q11
      type: multiple_choice
      topic_code: "3.5"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        Which expression equals cos(π − x) for every x?
      options:
        - "cos x"
        - "sin x"
        - "−sin x"
        - "−cos x"
      option_explanations:
        - |
          The sign is lost: cos π = −1, so cos π cos x is −cos x.
        - |
          Subtracting from π keeps the same function; only adding or subtracting π/2 or 3π/2 switches to the cofunction.
        - |
          The function stays cosine because π (not π/2) is involved, and sin π sin x = 0.
        - |
          Correct. cos π cos x + sin π sin x = −cos x + 0 = −cos x.
      answer: 3
    - slug: trig-u03-w16-q12
      type: multiple_choice
      topic_code: "2.2"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        Rewriting y = sin²x with a power-reducing formula shows that its graph is a sinusoid. What are its period and amplitude?
      options:
        - "Period 2π, amplitude 1"
        - "Period π, amplitude 1"
        - "Period π, amplitude 1/2"
        - "Period π/2, amplitude 1/2"
      option_explanations:
        - |
          These belong to y = sin x. Squaring makes every value nonnegative and the graph repeats twice as often.
        - |
          The period is right, but sin²x runs only from 0 to 1, so the amplitude is half of that range.
        - |
          Correct. sin²x = 1/2 − (1/2)cos 2x: amplitude 1/2, midline 1/2 and period 2π/2 = π.
        - |
          The cosine inside is cos 2x, giving period 2π/2 = π, not π/2.
      answer: 2
    - slug: trig-u03-w16-q13
      type: multi_select
      topic_code: "3.6"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 2
      partial_credit: true
      prompt: |
        Which expressions equal sin 2x for every x at which they are defined? Select all that apply.
      options:
        - "2 sin x cos x"
        - "2 sin x"
        - "2 tan x/(1 + tan²x)"
        - "sin x cos x"
        - "cos(π/2 − 2x)"
      option_explanations:
        - |
          Correct. This is the double-angle formula, from sin(x + x).
        - |
          At x = π/2, sin π = 0 but 2 sin(π/2) = 2: doubling the angle does not double the sine.
        - |
          Correct. 1 + tan²x = sec²x, so the expression is 2 tan x cos²x = 2 sin x cos x wherever cos x ≠ 0.
        - |
          sin x cos x is half of sin 2x; at x = π/4 it is 1/2, but sin(π/2) = 1.
        - |
          Correct. By the cofunction identity, cos(π/2 − u) = sin u with u = 2x.
      answer: [0, 2, 4]
    - slug: trig-u03-w16-q14
      type: multi_select
      topic_code: "3.7"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 2
      partial_credit: true
      prompt: |
        Which of these power-reducing and half-angle statements are true for every x at which both sides are defined? Select all that apply.
      options:
        - "sin(x/2) = (1/2) sin x"
        - "cos²x = (1 + cos 2x)/2"
        - "tan(x/2) = (1 + cos x)/sin x"
        - "sin²(x/2) = (1 − cos x)/2"
        - "sin²x = (1 + cos 2x)/2"
      option_explanations:
        - |
          At x = π, sin(π/2) = 1 but (1/2) sin π = 0: halving the angle does not halve the sine.
        - |
          Correct. Solve cos 2x = 2cos²x − 1 for cos²x.
        - |
          The formula is (1 − cos x)/sin x; with a plus sign, x = π/3 gives (3/2)/(√3/2) = √3 instead of tan(π/6) = √3/3.
        - |
          Correct. This is the sin²x power-reducing formula with x replaced by x/2.
        - |
          (1 + cos 2x)/2 is cos²x; the sin²x formula has 1 − cos 2x.
      answer: [1, 3]
    - slug: trig-u03-w16-q15
      type: true_false
      topic_code: "3.3"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      prompt: |
        True or false: sin 2x = 2 sin x is an identity.
      answer: false
      explanation: |
        False. x = π/2 is a counterexample: sin π = 0 but 2 sin(π/2) = 2, and both sides are defined. The identity is sin 2x = 2 sin x cos x; the two agree only where cos x = 1 or sin x = 0.
    - slug: trig-u03-w16-q16
      type: true_false
      topic_code: "3.5"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        True or false: cos(x − π) = cos(π − x) for every real x.
      answer: true
      explanation: |
        True. x − π and π − x are opposites, and cosine is even. Both equal −cos x by the difference formula.
    - slug: trig-u03-w16-q17
      type: fill_blank
      topic_code: "3.6"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      prompt: |
        If sin x = 0.6 and cos x = 0.8, then sin 2x = ____.
      answer: ["0.96", ".96", "24/25"]
      explanation: |
        sin 2x = 2 sin x cos x = 2(0.6)(0.8) = 0.96.
    - slug: trig-u03-w16-q18
      type: fill_blank
      topic_code: "3.4"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        Working in degrees, cos 75° cos 15° − sin 75° sin 15° = ____.
      answer: ["0", "0.0", "zero"]
      explanation: |
        The expression is cos(75° + 15°) = cos 90° = 0.
    - slug: trig-u03-w16-q19
      type: numeric
      topic_code: "3.7"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      prompt: |
        Use tan(x/2) = (1 − cos x)/sin x with x = 3π/4 to find tan(3π/8) exactly, then give it to the nearest thousandth.
      answer: { value: 2.414, tolerance: 0.001 }
      explanation: |
        tan(3π/8) = (1 − cos(3π/4))/sin(3π/4) = (1 + √2/2)/(√2/2) = 2/√2 + 1 = √2 + 1 ≈ 2.414.
    - slug: trig-u03-w16-q20
      type: numeric
