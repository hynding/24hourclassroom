week: 19
unit: 3
title: "Multiple Angles, Identities and Inequalities"
topics: ["3.11", "3.12"]
guide: guides/week-19.md
guide_description: |
  Solving equations with multiple angles by stretching the interval (u = kx), rewriting equations with
  Pythagorean, double-angle, sum-to-product and combined-form identities until one function of one angle
  remains, finding every solution in an interval from a calculator's principal value in radian mode, and solving
  inequalities with boundary points and test intervals. Worked examples: sin 2x = 1/2 and tan 3x = 1 on [0, 2π),
  cos 2x + sin x = 0, sin 2x = sin x, 2 cos²x + 3 sin x − 3 = 0, sin 3x + sin x = 0, sin x + √3 cos x = 1,
  5 sin x = 2 and 3 cos x = −2 with a calculator, 2 cos²x − cos x < 0, and a hypothetical Ferris wheel.
flashcards_description: |
  30 cards on multiple-angle equations, choosing the right identity, calculator principal values and second
  solutions in radian mode, boundary points and test intervals, and inequality answers written as intervals.

flashcards:
  - front: Solving sin(kx) = c on [0, 2π) → first step
    back: |
      Let u = kx and solve on [0, 2kπ), k full turns, then divide every solution by k.
    topic_code: "3.11"
  - front: sin 2x = 1/2 on [0, 2π) → solutions
    back: |
      2x = π/6, 5π/6, 13π/6, 17π/6, so x = π/12, 5π/12, 13π/12, 17π/12.
    topic_code: "3.11"
  - front: tan 3x = 1 → general solution
    back: |
      3x = π/4 + πn, so x = π/12 + πn/3. Divide the period by 3 as well.
    topic_code: "3.11"
  - front: tan 3x = 1 on [0, 2π) → number of solutions
    back: |
      Six: π/12, 5π/12, 3π/4, 13π/12, 17π/12, 7π/4, spaced π/3 apart.
    topic_code: "3.11"
  - front: cos 3x = 0 on [0, π) → solutions
    back: |
      3x = π/2, 3π/2, 5π/2, so x = π/6, π/2, 5π/6.
    topic_code: "3.11"
  - front: cos 2x = −√3/2 on [0, 2π) → solutions
    back: |
      2x = 5π/6, 7π/6, 17π/6, 19π/6, so x = 5π/12, 7π/12, 17π/12, 19π/12.
    topic_code: "3.11"
  - front: Which form of cos 2x to use in an equation → rule
    back: |
      The one that matches the other function: 1 − 2 sin²x beside sin x, 2 cos²x − 1 beside cos x.
    topic_code: "3.11"
  - front: cos 2x + sin x = 0 on [0, 2π) → solutions
    back: |
      1 − 2 sin²x + sin x = 0, so (2 sin x + 1)(sin x − 1) = 0: π/2, 7π/6, 11π/6.
    topic_code: "3.11"
  - front: cos 2x = cos x on [0, 2π) → solutions
    back: |
      2 cos²x − cos x − 1 = 0, so (2 cos x + 1)(cos x − 1) = 0: 0, 2π/3, 4π/3.
    topic_code: "3.11"
  - front: sin 2x = sin x on [0, 2π) → solutions
    back: |
      sin x (2 cos x − 1) = 0: 0, π (from sin x = 0) and π/3, 5π/3 (from cos x = 1/2).
    topic_code: "3.11"
  - front: 2 cos²x + 3 sin x − 3 = 0 → identity to use and solutions on [0, 2π)
    back: |
      cos²x = 1 − sin²x gives (2 sin x − 1)(sin x − 1) = 0: π/6, π/2, 5π/6.
    topic_code: "3.11"
  - front: sin 3x + sin x = 0 → first rewrite
    back: |
      Sum-to-product: 2 sin 2x cos x = 0. On [0, 2π) the solutions are 0, π/2, π, 3π/2.
    topic_code: "3.11"
  - front: sin x + √3 cos x = 1 on [0, 2π) → method and solutions
    back: |
      Combine: 2 sin(x + π/3) = 1, so x + π/3 = 5π/6 or 13π/6: x = π/2, 11π/6. No squaring needed.
    topic_code: "3.11"
  - front: Equation with sin x and cos²x → identity to reach one function
    back: |
      Replace cos²x with 1 − sin²x to get a quadratic in sin x. (With cos x and sin²x, replace sin²x.)
    topic_code: "3.11"
  - front: Calculator mode for trigonometric equations in this unit → setting
    back: |
      Radian mode, unless the question is in degrees. sin⁻¹ 0.4 is 0.412 in radians, 23.578 in degrees.
    topic_code: "3.12"
  - front: sin x = k with a calculator → both solutions in [0, 2π)
    back: |
      α = sin⁻¹ k and π − α; if α is negative, use α + 2π in place of α.
    topic_code: "3.12"
  - front: cos x = k with a calculator → both solutions in [0, 2π)
    back: |
      α = cos⁻¹ k and 2π − α (cos⁻¹ always returns α in [0, π]).
    topic_code: "3.12"
  - front: tan x = k with a calculator → both solutions in [0, 2π)
    back: |
      α = tan⁻¹ k and α + π; if α < 0, use α + π and α + 2π.
    topic_code: "3.12"
  - front: 5 sin x − 2 = 0 on [0, 2π) → solutions to three decimals
    back: |
      sin x = 0.4: x ≈ 0.412 and π − 0.412 ≈ 2.730.
    topic_code: "3.12"
  - front: 3 cos x + 2 = 0 on [0, 2π) → solutions to three decimals
    back: |
      cos x = −2/3: x ≈ 2.301 and 2π − 2.301 ≈ 3.983.
    topic_code: "3.12"
  - front: tan x = −3 on [0, 2π) → solutions to three decimals
    back: |
      tan⁻¹(−3) ≈ −1.249, so x ≈ 1.893 and 5.034.
    topic_code: "3.12"
  - front: Boundary points of a trig inequality → what they are
    back: |
      The solutions of the related equation (plus any points where a function is undefined). The truth of the inequality can change only there.
    topic_code: "3.12"
  - front: Steps for solving a trig inequality on [0, 2π) → list them
    back: |
      Solve the equation for boundary points; split the interval; test one value in each piece; keep the pieces that work, with endpoints for ≤ and ≥.
    topic_code: "3.12"
  - front: sin x ≥ 1/2 on [0, 2π) → solution set
    back: |
      π/6 ≤ x ≤ 5π/6, the arc of the unit circle at or above height 1/2.
    topic_code: "3.12"
  - front: cos x < −1/2 on [0, 2π) → solution set
    back: |
      2π/3 < x < 4π/3, the arc to the left of x = −1/2 on the unit circle.
    topic_code: "3.12"
  - front: tan x > 1 on [0, 2π) → solution set
    back: |
      π/4 < x < π/2 or 5π/4 < x < 3π/2. The asymptotes at π/2 and 3π/2 are boundary points too.
    topic_code: "3.12"
  - front: 2 cos²x − cos x < 0 on [0, 2π) → solution set
    back: |
      cos x (2 cos x − 1) < 0 means 0 < cos x < 1/2: π/3 < x < π/2 or 3π/2 < x < 5π/3.
    topic_code: "3.12"
  - front: Ferris seat h(t) = 10 − 8 cos(πt/15) m → when h ≥ 14 in the first 30 s
    back: |
      cos(πt/15) ≤ −1/2 gives 2π/3 ≤ πt/15 ≤ 4π/3, so 10 ≤ t ≤ 20: ten seconds per revolution.
    topic_code: "3.12"
  - front: Error-spot → "sin 2x = 1/2, so 2x = π/6 or 5π/6, so x = π/12 or 5π/12 on [0, 2π)"
    back: |
      Only one turn of 2x was used. 2x runs over [0, 4π), adding x = 13π/12 and 17π/12.
    topic_code: "3.11"
  - front: Error-spot → "sin x > 0.4 on [0, 2π) means x > 0.412"
    back: |
      Sine falls back below 0.4 after π − 0.412 ≈ 2.730. The solution is 0.412 < x < 2.730.
    topic_code: "3.12"

quiz:
  description: |
    25 questions · about 45 minutes · mostly on this week (topics 3.11 and 3.12: multiple-angle equations,
    equations solved with identities, calculator solutions in radian mode, and inequalities by boundary points and
    test intervals), with about a third reviewing earlier weeks (factoring, sinusoidal models, verifying
    identities, sum, double-angle and half-angle formulas, and basic equations). Includes a shared-context set on a
    hypothetical Ferris wheel. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes. Angles are in radians unless degrees are shown, and n stands for any
    integer. Items marked (Calculator.) need a calculator in radian mode; the rest are designed to be done by hand.
  questions:
    # ---- Stimulus set: a hypothetical Ferris wheel (3.11, 3.12)
    - slug: trig-u03-w19-q01
      type: multiple_choice
      topic_code: "3.11"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      stimulus: |
        In a hypothetical model, a Ferris wheel seat is h(t) = 10 − 8 cos(πt/15) metres above the ground t seconds after a rider boards at the lowest point. One revolution takes 30 seconds.
      prompt: |
        What is the first time t > 0 at which the seat is 14 m above the ground?
      options:
        - "t = 5 s"
        - "t = 20 s"
        - "t = 7.5 s"
        - "t = 10 s"
      option_explanations:
        - |
          At t = 5, πt/15 = π/3 and cos(π/3) = 1/2, so h = 10 − 4 = 6 m; this solves cos = +1/2 instead of −1/2.
        - |
          At t = 20 the seat is also at 14 m, but on the way down; it reached 14 m earlier, at t = 10.
        - |
          At t = 7.5 the angle is π/2, so cos = 0 and h = 10 m, the midline, not 14 m.
        - |
          Correct. 10 − 8 cos(πt/15) = 14 gives cos(πt/15) = −1/2, so πt/15 = 2π/3 and t = 10.
      answer: 3
    - slug: trig-u03-w19-q02
      type: multiple_choice
      topic_code: "3.12"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      stimulus: |
        In a hypothetical model, a Ferris wheel seat is h(t) = 10 − 8 cos(πt/15) metres above the ground t seconds after a rider boards at the lowest point. One revolution takes 30 seconds.
      prompt: |
        During the first revolution, 0 ≤ t ≤ 30, for which times is the seat at least 14 m above the ground?
      options:
        - "0 ≤ t ≤ 10 or 20 ≤ t ≤ 30"
        - "10 ≤ t ≤ 20"
        - "5 ≤ t ≤ 25"
        - "t ≥ 10"
      option_explanations:
        - |
          These are the times when h ≤ 14; the seat starts at the bottom (h(0) = 2), so the early times fail the test.
        - |
          Correct. h ≥ 14 means cos(πt/15) ≤ −1/2, so 2π/3 ≤ πt/15 ≤ 4π/3 and 10 ≤ t ≤ 20; a test value t = 15 gives h = 18.
        - |
          5 and 25 are where h = 6 m; at t = 5 the seat is far below 14 m.
        - |
          The boundary t = 10 is right, but the seat comes back below 14 m after t = 20; an inequality needs every boundary point.
      answer: 1
    - slug: trig-u03-w19-q03
      type: multiple_choice
      topic_code: "3.12"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      stimulus: |
        In a hypothetical model, a Ferris wheel seat is h(t) = 10 − 8 cos(πt/15) metres above the ground t seconds after a rider boards at the lowest point. One revolution takes 30 seconds.
      prompt: |
        (Calculator.) To the nearest hundredth of a second, what is the first time t > 0 at which the seat is 5 m above the ground?
      options:
        - "4.28 s"
        - "25.72 s"
        - "0.90 s"
        - "10.72 s"
      option_explanations:
        - |
          Correct. cos(πt/15) = 5/8, so πt/15 = cos⁻¹(0.625) ≈ 0.8957 and t = 15(0.8957)/π ≈ 4.28 s.
        - |
          25.72 = 30 − 4.28 is the second time in the revolution the seat is at 5 m, on the way down.
        - |
          0.90 is the angle cos⁻¹(0.625) in radians; it still has to be converted to time by multiplying by 15/π.
        - |
          This solves cos(πt/15) = −5/8, a sign slip when isolating the cosine (8 cos = 10 − 5 = 5, so cos = +5/8).
      answer: 0
    - slug: trig-u03-w19-q04
      type: multiple_choice
      topic_code: "3.12"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      stimulus: |
        In a hypothetical model, a Ferris wheel seat is h(t) = 10 − 8 cos(πt/15) metres above the ground t seconds after a rider boards at the lowest point. One revolution takes 30 seconds.
      prompt: |
        For how many seconds of each revolution is the seat at most 6 m above the ground?
      options:
        - "5 s"
        - "20 s"
        - "10 s"
        - "15 s"
      option_explanations:
        - |
          5 s counts only 0 ≤ t ≤ 5 and forgets the stretch 25 ≤ t ≤ 30 at the end of the revolution, when the seat comes back down.
        - |
          20 s is the time the seat spends above 6 m, the complement of the answer.
        - |
          Correct. h ≤ 6 means cos(πt/15) ≥ 1/2, so 0 ≤ t ≤ 5 or 25 ≤ t ≤ 30: 10 seconds in all.
        - |
          15 s is half a revolution, the time below the midline of 10 m, not below 6 m.
      answer: 2
    # ---- Topics 3.11 and 3.12
    - slug: trig-u03-w19-q05
      type: multiple_choice
      topic_code: "3.11"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      prompt: |
        Which list gives every solution of sin 2x = 1/2 in [0, 2π)?
      options:
        - "π/12, 5π/12"
        - "π/6, 5π/6"
        - "π/12, 5π/12, 13π/12, 17π/12"
        - "π/3, 5π/3"
      option_explanations:
        - |
          This finds 2x on the first turn only; 2x runs over [0, 4π), which adds 13π/12 and 17π/12.
        - |
          These solve sin x = 1/2; they were not divided by 2. sin(2 · π/6) = sin(π/3) = √3/2.
        - |
          Correct. 2x = π/6, 5π/6, 13π/6, 17π/6 on [0, 4π); dividing by 2 gives these four values.
        - |
          These multiply the angle by 2 instead of dividing, and sin(2π/3) = √3/2, not 1/2.
      answer: 2
    - slug: trig-u03-w19-q06
      type: multiple_choice
      topic_code: "3.11"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      prompt: |
        Which describes all solutions of tan 3x = 1 (n any integer)?
      options:
        - "x = π/12 + πn/3"
        - "x = π/12 + πn"
        - "x = 3π/4 + 3πn"
        - "x = π/12 + 2πn/3"
      option_explanations:
        - |
          Correct. 3x = π/4 + πn, and dividing every term by 3 gives π/12 + πn/3.
        - |
          The period must be divided by 3 too; this misses solutions such as 5π/12, where tan(5π/4) = 1.
        - |
          This multiplies by 3 instead of dividing; tan(3 · 3π/4) = tan(9π/4) = 1 happens to work, but most solutions are missed.
        - |
          2π/3 comes from using 2π as tangent's period; tangent repeats every π, so solutions are π/3 apart.
      answer: 0
    - slug: trig-u03-w19-q07
      type: multiple_choice
      topic_code: "3.11"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        Which list gives every solution of cos 2x + sin x = 0 in [0, 2π)?
      options:
        - "π/6, 5π/6, 3π/2"
        - "7π/6, 11π/6"
        - "π/2, 3π/2"
        - "π/2, 7π/6, 11π/6"
      option_explanations:
        - |
          These solve (2 sin x − 1)(sin x + 1) = 0, the factoring with both signs reversed; cos(π/3) + sin(π/6) = 1 ≠ 0.
        - |
          This keeps only sin x = −1/2 and drops the factor sin x − 1 = 0, which gives π/2: cos π + sin(π/2) = 0.
        - |
          cos(3π) + sin(3π/2) = −1 − 1 = −2, so 3π/2 fails; only sin x = 1 gives π/2.
        - |
          Correct. cos 2x = 1 − 2 sin²x gives 2 sin²x − sin x − 1 = (2 sin x + 1)(sin x − 1) = 0, so sin x = 1 or −1/2.
      answer: 3
    - slug: trig-u03-w19-q08
      type: multiple_choice
      topic_code: "3.11"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        Which list gives every solution of sin 2x = sin x in [0, 2π)?
      options:
        - "π/3, 5π/3"
        - "0, π/3, π, 5π/3"
        - "0, π"
        - "0, π/6, π, 5π/6"
      option_explanations:
        - |
          Dividing by sin x lost the solutions where sin x = 0; at x = 0 both sides are 0.
        - |
          Correct. 2 sin x cos x − sin x = sin x (2 cos x − 1) = 0: sin x = 0 gives 0, π and cos x = 1/2 gives π/3, 5π/3.
        - |
          This keeps only sin x = 0 and drops the factor 2 cos x − 1 = 0.
        - |
          π/6 and 5π/6 solve sin x = 1/2; the factor is 2 cos x − 1, which needs cos x = 1/2.
      answer: 1
    - slug: trig-u03-w19-q09
      type: multiple_choice
      topic_code: "3.12"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      prompt: |
        (Calculator.) Which list gives the solutions of 5 sin x = 2 in [0, 2π), to three decimal places?
      options:
        - "0.412 and 2.730"
        - "0.412 and 5.871"
        - "23.578 and 156.422"
        - "0.412 only"
      option_explanations:
        - |
          Correct. sin⁻¹(0.4) ≈ 0.412, and the second angle with the same sine is π − 0.412 ≈ 2.730.
        - |
          5.871 = 2π − 0.412 has sine −0.4; that is the second-solution rule for cosine, not sine.
        - |
          These are degree values; the question works in radians on [0, 2π).
        - |
          The calculator gives only the principal value; sine is also positive in quadrant II, giving π − 0.412.
      answer: 0
    - slug: trig-u03-w19-q10
      type: multiple_choice
      topic_code: "3.12"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      prompt: |
        Which is the solution set of cos x < −1/2 on [0, 2π)?
      options:
        - "2π/3 ≤ x ≤ 4π/3"
        - "x < 2π/3"
        - "π/3 < x < 5π/3"
        - "2π/3 < x < 4π/3"
      option_explanations:
        - |
          The inequality is strict, so the boundary points, where cos x = −1/2 exactly, are excluded.
        - |
          At x = 0, cos x = 1, which is not less than −1/2; the solution lies between the two boundary points.
        - |
          This is where cos x < 1/2; the boundaries for −1/2 are 2π/3 and 4π/3.
        - |
          Correct. cos x = −1/2 at 2π/3 and 4π/3, and a test value x = π gives cos π = −1 < −1/2.
      answer: 3
    - slug: trig-u03-w19-q11
      type: multiple_choice
      topic_code: "3.12"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      prompt: |
        Which is the solution set of 2 cos²x − cos x < 0 on [0, 2π)?
      options:
        - "π/3 < x < 5π/3"
        - "π/2 < x < 3π/2"
        - "π/3 < x < π/2 or 3π/2 < x < 5π/3"
        - "0 < x < π/3 or 5π/3 < x < 2π"
      option_explanations:
        - |
          This is where cos x < 1/2, which includes negative cosines; there cos x (2 cos x − 1) is positive.
        - |
          Here cos x < 0 and 2 cos x − 1 < 0, so the product is positive, not negative.
        - |
          Correct. cos x (2 cos x − 1) < 0 needs 0 < cos x < 1/2; the boundary points are π/3, π/2, 3π/2, 5π/3.
        - |
          Here cos x > 1/2, so both factors are positive and the product is positive.
      answer: 2
    # ---- Spiral review
    - slug: trig-u03-w19-q12
      type: multiple_choice
      topic_code: "3.10"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      prompt: |
        Which describes all solutions of 2 sin x + √2 = 0 (n any integer)?
      options:
        - "x = π/4 + 2πn or x = 3π/4 + 2πn"
        - "x = 5π/4 + 2πn or x = 7π/4 + 2πn"
        - "x = 5π/4 + πn"
        - "x = 3π/4 + 2πn or x = 5π/4 + 2πn"
      option_explanations:
        - |
          These solve sin x = +√2/2; the equation gives sin x = −√2/2.
        - |
          Correct. sin x = −√2/2: reference angle π/4, sine negative in quadrants III and IV.
        - |
          5π/4 + π = 9π/4 has sine +√2/2; the two sine solutions are not π apart here.
        - |
          These are where cosine is negative; sine is negative in quadrants III and IV.
      answer: 1
    - slug: trig-u03-w19-q13
      type: multiple_choice
      topic_code: "3.2"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        Where it is defined, (sin²x − cos²x)/(sin x − cos x) simplifies to which expression?
      options:
        - "sin x + cos x"
        - "sin x − cos x"
        - "1"
        - "−cos 2x"
      option_explanations:
        - |
          Correct. The numerator is a difference of squares, (sin x − cos x)(sin x + cos x), and the common factor cancels.
        - |
          This is the factor that cancels; what remains is the other factor of the difference of squares.
        - |
          This treats sin²x − cos²x as sin²x + cos²x = 1; the minus sign makes it a difference of squares, not the Pythagorean identity.
        - |
          The numerator equals −cos 2x, but the denominator has not been divided out.
      answer: 0
    - slug: trig-u03-w19-q14
      type: multiple_choice
      topic_code: "2.7"
      source: "Original item; Common Core HSF-TF.B.5"
      points: 1
      prompt: |
        In a hypothetical harbour, the water depth reaches a maximum of 5 m at t = 3 hours and the next minimum of 1 m at t = 9 hours. Which sinusoidal model fits?
      options:
        - "d(t) = 3 + 2 cos(π(t − 3)/12)"
        - "d(t) = 2 + 3 cos(π(t − 3)/6)"
        - "d(t) = 3 − 2 cos(π(t − 3)/6)"
        - "d(t) = 3 + 2 cos(π(t − 3)/6)"
      option_explanations:
        - |
          π/12 gives a period of 24 hours; maximum to minimum is half a period, so the period is 12 hours and b = π/6.
        - |
          The midline and amplitude are swapped: midline (5 + 1)/2 = 3 and amplitude (5 − 1)/2 = 2.
        - |
          The negated cosine puts the minimum, 1 m, at t = 3; the maximum belongs there.
        - |
          Correct. Midline 3, amplitude 2, period 12 so b = π/6, and cosine shifted to t = 3 puts the maximum 5 there.
      answer: 3
    - slug: trig-u03-w19-q15
      type: multi_select
      topic_code: "3.11"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 2
      partial_credit: true
      prompt: |
        Which values of x are solutions of sin 3x + sin x = 0? Select all that apply.
      options:
        - "0"
        - "π/4"
        - "π/2"
        - "2π/3"
        - "π"
      option_explanations:
        - |
          Correct. sin 0 + sin 0 = 0; in product form, sin 2x = 0 at x = 0.
        - |
          sin(3π/4) + sin(π/4) = √2/2 + √2/2 = √2 ≠ 0; neither sin 2x nor cos x is zero at π/4.
        - |
          Correct. sin(3π/2) + sin(π/2) = −1 + 1 = 0; both sin 2x and cos x are zero there.
        - |
          sin 2π + sin(2π/3) = 0 + √3/2 ≠ 0; at 2π/3, sin 2x = sin(4π/3) ≠ 0 and cos x = −1/2 ≠ 0.
        - |
          Correct. sin 3π + sin π = 0 + 0 = 0; sin 2x = sin 2π = 0.
      answer: [0, 2, 4]
    - slug: trig-u03-w19-q16
      type: multi_select
      topic_code: "3.6"
