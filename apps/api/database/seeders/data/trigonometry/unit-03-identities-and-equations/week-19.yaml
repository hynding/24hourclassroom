      option_explanations:
        - |
          Correct. This is the double-angle formula, from sin(x + x) = sin x cos x + cos x sin x.
        - |
          Doubling the angle does not double the sine: at x = π/2, sin π = 0 but 2 sin(π/2) = 2.
        - |
          Correct. 1 + tan²x = sec²x, so 2 tan x/sec²x = 2 (sin x/cos x) cos²x = 2 sin x cos x.
