        (Calculator.) Find the larger solution of 3 cos x + 2 = 0 in [0, 2π), in radians, to the nearest hundredth.
      answer: { value: 3.98, tolerance: 0.01 }
      explanation: |
        cos x = −2/3. The calculator gives cos⁻¹(−2/3) ≈ 2.301, in quadrant II. The other solution, in quadrant III, is 2π − 2.301 ≈ 3.983, which is 3.98 to the nearest hundredth.
    - slug: trig-u03-w19-q22
      type: numeric
      topic_code: "3.7"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        Use a power-reducing formula to find sin²(π/8) to the nearest thousandth.
      answer: { value: 0.146, tolerance: 0.001 }
      explanation: |
        sin²θ = (1 − cos 2θ)/2, so sin²(π/8) = (1 − cos(π/4))/2 = (1 − √2/2)/2 = (2 − √2)/4 ≈ 0.146.
    - slug: trig-u03-w19-q23
      type: short_answer
      topic_code: "3.11"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 3
      prompt: |
        Solve 2 cos²x + 3 sin x − 3 = 0 on [0, 2π), with x in radians.

        (a) Use an identity to rewrite the equation in terms of sin x only.
        (b) Factor the result.
        (c) Find every solution in [0, 2π).
      answer: |
        (a) cos²x = 1 − sin²x gives 2 − 2 sin²x + 3 sin x − 3 = 0, that is 2 sin²x − 3 sin x + 1 = 0.
        (b) (2 sin x − 1)(sin x − 1) = 0.
        (c) sin x = 1/2 gives π/6 and 5π/6; sin x = 1 gives π/2. Solutions: π/6, π/2, 5π/6.
      explanation: |
        Three points, one per part. (a) the substitution and a correct quadratic in sin x (either sign arrangement). (b) a correct factorisation of that quadratic. (c) all three solutions (no credit with one missing).
    - slug: trig-u03-w19-q24
      type: short_answer
      topic_code: "3.3"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 3
      prompt: |
        Verify the identity (1 − cos 2x)/sin 2x = tan x.

        (a) Rewrite the numerator 1 − cos 2x using a double-angle formula.
        (b) Rewrite the denominator and simplify the fraction to tan x.
        (c) Name one value of x in [0, 2π) where the left side is undefined but tan x is defined, and explain why the identity holds only where both sides are defined.
      answer: |
        (a) cos 2x = 1 − 2 sin²x, so 1 − cos 2x = 2 sin²x.
        (b) sin 2x = 2 sin x cos x, so (2 sin²x)/(2 sin x cos x) = sin x/cos x = tan x.
        (c) At x = 0 (or x = π), sin 2x = 0, so the left side is undefined, but tan 0 = 0 is defined. An identity is a claim about every x in the domains of both sides; dividing by sin 2x excludes the x where sin 2x = 0.
      explanation: |
        Three points, one per part. (a) 2 sin²x from the correct form of cos 2x. (b) the denominator 2 sin x cos x and the simplification to tan x, working on one side only. (c) a correct value (0 or π) with a reason that refers to the domain.
    - slug: trig-u03-w19-q25
      type: long_answer
      topic_code: "3.12"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 6
      prompt: |
        In a hypothetical harbour, the water depth over a loading berth is w(t) = 4 + 2 sin(πt/6) metres, t hours after midnight, for 0 ≤ t < 24 (radians throughout). A barge can use the berth only when the depth is at least 5 m.

        (A) (i) Find, exactly, every time in [0, 24) at which the depth is 5 m.
        (ii) Explain why the equation has four solutions in [0, 24) rather than two.

        (B) (i) Solve w(t) ≥ 5 on [0, 24), showing how you decided which intervals to keep.
        (ii) For how many hours in the day can the barge use the berth?

        (C) (i) (Calculator.) A larger barge needs at least 5.5 m. Find the interval of times during the first cycle (0 ≤ t < 12) when it can use the berth, to the nearest hundredth of an hour.
        (ii) The calculator's sin⁻¹ key returned only one angle in (C)(i). Explain how you found the other boundary time.
      answer: |
        (A) (i) 4 + 2 sin(πt/6) = 5 gives sin(πt/6) = 1/2. With u = πt/6 on [0, 4π): u = π/6, 5π/6, 13π/6, 17π/6, so t = 1, 5, 13, 17 hours.
        (ii) The period is 2π/(π/6) = 12 hours, so [0, 24) holds two full cycles, and each cycle contains two times when sine equals 1/2.
        (B) (i) The boundary points 1, 5, 13 and 17 split [0, 24) into five pieces. Test values: t = 0 gives 4 (fails), t = 3 gives 6 (works), t = 9 gives 2 (fails), t = 15 gives 6 (works), t = 20 gives 4 + 2 sin(10π/3) ≈ 2.27 (fails). Including the boundaries (≥): 1 ≤ t ≤ 5 or 13 ≤ t ≤ 17.
        (ii) 4 + 4 = 8 hours.
        (C) (i) sin(πt/6) ≥ 0.75. sin⁻¹(0.75) ≈ 0.8481, so πt/6 is between 0.8481 and π − 0.8481 ≈ 2.2935, giving 1.62 ≤ t ≤ 4.38 hours.
        (ii) sin⁻¹ returns only the angle in [−π/2, π/2]. Sine takes the same value at π − α, so the second boundary angle is π − 0.8481; converting with t = 6u/π gives 4.38.
      explanation: |
        Six points. (A) 1 point for t = 1, 5, 13, 17 (all four); 1 point for linking the four solutions to the 12-hour period and two cycles. (B) 1 point for 1 ≤ t ≤ 5 or 13 ≤ t ≤ 17 with test values or a sign argument; 1 point for 8 hours. (C) 1 point for 1.62 ≤ t ≤ 4.38 (accept ±0.01); 1 point for the π − α explanation.
