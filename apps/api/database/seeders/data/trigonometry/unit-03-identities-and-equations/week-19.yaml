      prompt: |
        True or false: On [0, 2π), the solution set of sin x > 0 is 0 < x < π.
      answer: true
      explanation: |
        True. sin x = 0 at the boundary points 0 and π; a test value π/2 gives 1 > 0, and a test value 3π/2 gives −1 < 0. So sin x > 0 exactly on (0, π).
