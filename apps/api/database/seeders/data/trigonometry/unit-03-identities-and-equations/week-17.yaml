    - slug: trig-u03-w17-q22
      type: short_answer
      topic_code: "3.4"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 3
      prompt: |
        Angle α is in quadrant I with sin α = 4/5, and angle β is in quadrant II with cos β = −5/13.

        (a) Find cos α and sin β.
        (b) Find the exact value of sin(α + β).
        (c) Find cos(α + β), and state the quadrant in which α + β lies.
      answer: |
        (a) cos α = 3/5 (positive in quadrant I) and sin β = 12/13 (positive in quadrant II).
        (b) sin(α + β) = sin α cos β + cos α sin β = (4/5)(−5/13) + (3/5)(12/13) = (−20 + 36)/65 = 16/65.
        (c) cos(α + β) = cos α cos β − sin α sin β = (3/5)(−5/13) − (4/5)(12/13) = (−15 − 48)/65 = −63/65. Sine positive and cosine negative, so α + β is in quadrant II.
      explanation: |
        Three points, one per part. (a) both values with correct signs. (b) 16/65 from the sine sum formula. (c) −63/65 and quadrant II, with the sign reasoning (accept a follow-through quadrant from an incorrect but consistent cosine).
    - slug: trig-u03-w17-q23
      type: short_answer
      topic_code: "3.8"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 3
      prompt: |
        Answer without a calculator.

        (a) Write sin 6x sin 2x as a sum or difference of cosines.
        (b) Use a sum-to-product formula to find the exact value of cos 105° + cos 15°.
        (c) Write cos 3x + cos x as a product, and use it to find every x in [0, π) for which cos 3x + cos x = 0.
      answer: |
        (a) sin A sin B = ½[cos(A − B) − cos(A + B)], so sin 6x sin 2x = ½(cos 4x − cos 8x).
        (b) cos 105° + cos 15° = 2 cos 60° cos 45° = 2 · ½ · √2/2 = √2/2.
        (c) cos 3x + cos x = 2 cos 2x cos x. It is zero when cos 2x = 0 or cos x = 0. On [0, π), 2x is in [0, 2π), so 2x = π/2 or 3π/2, giving x = π/4 or 3π/4; and cos x = 0 gives x = π/2. Solutions: x = π/4, π/2, 3π/4.
      explanation: |
        Three points, one per part. (a) ½(cos 4x − cos 8x), with the order correct. (b) √2/2 with the formula shown. (c) the product 2 cos 2x cos x and all three solutions π/4, π/2, 3π/4 (the product earns no credit alone if solutions are missing).
    - slug: trig-u03-w17-q24
      type: long_answer
      topic_code: "3.9"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 6
      prompt: |
        A hypothetical mass on a spring has displacement d(t) = 3 sin 2t + 4 cos 2t centimetres from its rest position, t seconds after it is released (radians throughout).

        (A) (i) Write d(t) in the form R sin(2t + φ), with R > 0 and φ in (−π, π], giving φ to the nearest thousandth.
        (ii) State the amplitude and the period of the motion.

        (B) (i) Find the greatest displacement and the first time t > 0 at which it occurs, to the nearest hundredth of a second.
        (ii) Find the first time t > 0 at which the mass is farthest below its rest position (d is least), to the nearest hundredth of a second.

        (C) (i) (Calculator.) Find the first time t > 0 at which the mass passes through its rest position (d = 0), to the nearest hundredth of a second.
        (ii) A student claims that at some moment the displacement is 6 cm, because 3 + 4 > 6. Explain why the claim is wrong.
      answer: |
        (A) (i) R = √(3² + 4²) = 5. cos φ = 3/5 and sin φ = 4/5, both positive, so φ is in quadrant I: φ = tan⁻¹(4/3) ≈ 0.927. d(t) = 5 sin(2t + 0.927).
        (ii) Amplitude 5 cm; period 2π/2 = π ≈ 3.14 s.
        (B) (i) Greatest displacement 5 cm, when 2t + 0.927 = π/2: t = (1.5708 − 0.9273)/2 ≈ 0.32 s.
        (ii) Least displacement −5 cm, when 2t + 0.927 = 3π/2: t = (4.7124 − 0.9273)/2 ≈ 1.89 s.
        (C) (i) d = 0 when 2t + 0.927 = nπ. n = 0 gives a negative t, so take n = 1: t = (π − 0.9273)/2 ≈ 1.11 s.
        (ii) The two terms do not reach their maxima at the same time: sin 2t = 1 forces cos 2t = 0. The combined motion is a single sinusoid of amplitude 5, so −5 ≤ d(t) ≤ 5 and d(t) = 6 never happens.
      explanation: |
        Six points. (A) 1 point for R = 5 and φ ≈ 0.927 (quadrant reasoning shown); 1 point for amplitude 5 cm and period π s. (B) 1 point for 5 cm at t ≈ 0.32 s; 1 point for t ≈ 1.89 s. (C) 1 point for t ≈ 1.11 s (reject the negative solution); 1 point for explaining that the amplitude is √(9 + 16) = 5, so the range is [−5, 5].
