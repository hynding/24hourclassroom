        False. The power-reducing formula for cosine has a plus sign: cos²θ = (1 + cos 2θ)/2, so cos²(π/8) = (1 + √2/2)/2 = (2 + √2)/4 ≈ 0.854. The expression with the minus sign is sin²(π/8).
