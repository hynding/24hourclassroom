week: 17
unit: 3
title: "Product-to-Sum and Combining a sin x + b cos x"
topics: ["3.8", "3.9"]
guide: guides/week-17.md
guide_description: |
  The product-to-sum and sum-to-product formulas, derived by adding and subtracting week 15's sum and difference
  formulas, and the combined form a sin x + b cos x = R sin(x + φ) with R = √(a² + b²) and φ placed in the
  quadrant of the point (a, b). Worked examples: sin 5x cos 3x as a sum, cos 75° cos 15° exactly, sin 75° + sin 15°
  and cos 5x + cos x as products, beats from two hypothetical tuning forks, sin x + √3 cos x = 2 sin(x + π/3),
  the quadrant trap in −sin x + cos x, and a hypothetical spring 3 sin 2t + 4 cos 2t.
flashcards_description: |
  30 cards on the four product-to-sum and four sum-to-product formulas, exact values from them, beats, R and φ
  for a sin x + b cos x, maximum values and phase, and the sign and quadrant errors to avoid.

flashcards:
  - front: Product-to-sum for sin A cos B → formula
    back: |
      sin A cos B = ½[sin(A + B) + sin(A − B)]. It comes from adding the formulas for sin(A + B) and sin(A − B).
    topic_code: "3.8"
  - front: Product-to-sum for cos A sin B → formula
    back: |
      cos A sin B = ½[sin(A + B) − sin(A − B)]. Subtract the sin(A − B) formula from the sin(A + B) formula.
    topic_code: "3.8"
  - front: Product-to-sum for cos A cos B → formula
    back: |
      cos A cos B = ½[cos(A − B) + cos(A + B)]. Add the two cosine formulas: the sine terms cancel.
    topic_code: "3.8"
  - front: Product-to-sum for sin A sin B → formula and order
    back: |
      sin A sin B = ½[cos(A − B) − cos(A + B)]. Difference first, then subtract the sum.
    topic_code: "3.8"
  - front: Rebuilding product-to-sum from week 15 → which two formulas to combine
    back: |
      Write cos(A − B) and cos(A + B) (or the two sine formulas) one above the other, then add or subtract so that one kind of product cancels.
    topic_code: "3.8"
  - front: sin 5x cos 3x → as a sum
    back: |
      ½(sin 8x + sin 2x), with A = 5x and B = 3x.
    topic_code: "3.8"
  - front: cos 4x cos 2x → as a sum
    back: |
      ½(cos 2x + cos 6x).
    topic_code: "3.8"
  - front: sin 6x sin 2x → as a difference
    back: |
      ½(cos 4x − cos 8x).
    topic_code: "3.8"
  - front: cos 75° cos 15° → exact value via product-to-sum
    back: |
      ½(cos 60° + cos 90°) = ½(½ + 0) = ¼.
    topic_code: "3.8"
  - front: sin A sin A in the product-to-sum formula → which week 16 formula appears
    back: |
      ½[cos 0 − cos 2A] = ½(1 − cos 2A), the power-reducing formula for sin²A.
    topic_code: "3.8"
  - front: sin u + sin v → product form
    back: |
      2 sin((u + v)/2) cos((u − v)/2): sine of half the sum times cosine of half the difference.
    topic_code: "3.8"
  - front: sin u − sin v → product form
    back: |
      2 cos((u + v)/2) sin((u − v)/2).
    topic_code: "3.8"
  - front: cos u + cos v → product form
    back: |
      2 cos((u + v)/2) cos((u − v)/2).
    topic_code: "3.8"
  - front: cos u − cos v → product form and the sign
    back: |
      −2 sin((u + v)/2) sin((u − v)/2). The leading minus is the part most often lost.
    topic_code: "3.8"
  - front: sin 75° + sin 15° → exact value via sum-to-product
    back: |
      2 sin 45° cos 30° = 2(√2/2)(√3/2) = √6/2 ≈ 1.225.
    topic_code: "3.8"
  - front: cos 5x + cos x → as a product
    back: |
      2 cos 3x cos 2x (half the sum 3x, half the difference 2x).
    topic_code: "3.8"
  - front: Tones of 442 Hz and 438 Hz sounding together → beats per second and why
    back: |
      4 per second. The sum is 2 sin(2π·440t) cos(2π·2t); loudness peaks twice per cycle of the 2 Hz factor, so the beat rate is the difference of the frequencies.
    topic_code: "3.8"
  - front: a sin x + b cos x → combined form and R
    back: |
      R sin(x + φ) with R = √(a² + b²), cos φ = a/R, sin φ = b/R.
    topic_code: "3.9"
  - front: Where a sin x + b cos x = R sin(x + φ) comes from → expansion to match
    back: |
      R sin(x + φ) = (R cos φ) sin x + (R sin φ) cos x, so R cos φ = a and R sin φ = b.
    topic_code: "3.9"
  - front: Quadrant of φ in a sin x + b cos x = R sin(x + φ) → how to decide
    back: |
      φ is the direction angle of the point (a, b): the sign of a is the sign of cos φ and the sign of b is the sign of sin φ.
    hint: When a < 0, tan⁻¹(b/a) is off by π.
    topic_code: "3.9"
  - front: sin x + √3 cos x → combined form
    back: |
      2 sin(x + π/3): R = √(1 + 3) = 2, cos φ = 1/2, sin φ = √3/2.
    topic_code: "3.9"
  - front: √3 sin x + cos x → combined form and first maximum for x ≥ 0
    back: |
      2 sin(x + π/6). Maximum 2 where x + π/6 = π/2, at x = π/3.
    topic_code: "3.9"
  - front: −sin x + cos x → combined form
    back: |
      √2 sin(x + 3π/4). The point (−1, 1) is in quadrant II, so φ = 3π/4, not −π/4.
    topic_code: "3.9"
  - front: Maximum of 5 sin x + 12 cos x → value
    back: |
      13 = √(25 + 144). The minimum is −13.
    topic_code: "3.9"
  - front: Range of R sin(x + φ) → interval
    back: |
      [−R, R]. The period is unchanged (2π, or 2π/|k| when the angle is kx); the graph is R sin x shifted φ left.
    topic_code: "3.9"
  - front: Spring d(t) = 3 sin 2t + 4 cos 2t cm → amplitude and phase
    back: |
      d(t) = 5 sin(2t + φ) with φ = tan⁻¹(4/3) ≈ 0.927 (quadrant I). Amplitude 5 cm, period π s.
    topic_code: "3.9"
  - front: a sin x + b cos x as a cosine → form
    back: |
      R cos(x − θ) with the same R, cos θ = b/R and sin θ = a/R.
    topic_code: "3.9"
  - front: Error-spot → "2 sin 3x sin x = cos 4x − cos 2x"
    back: |
      Order reversed. 2 sin 3x sin x = cos 2x − cos 4x: the cosine of the difference comes first.
    topic_code: "3.8"
  - front: Error-spot → "The maximum of 3 sin x + 4 cos x is 7"
    back: |
      Amplitudes do not add unless the waves peak together. R = √(9 + 16) = 5.
    topic_code: "3.9"
  - front: Error-spot → "cos 5x − cos x = 2 sin 3x sin 2x"
    back: |
      The formula carries a minus: cos 5x − cos x = −2 sin 3x sin 2x. Check x = π/6: cos(5π/6) − cos(π/6) = −√3, and −2 sin(π/2) sin(π/3) = −√3.
    topic_code: "3.8"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 3.8 and 3.9: product-to-sum and sum-to-product
    formulas, exact values from them, beats, and writing a sin x + b cos x as one sinusoid), with about a third
    reviewing weeks 12–16 (envelopes of damped waves, simplifying, verifying identities, sum and difference
    formulas, double-angle and half-angle formulas). Includes a shared-context set on f(x) = √3 sin x + cos x.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes. Angles are in radians unless degrees are shown. Items marked (Calculator.) need a calculator; the rest
    are designed to be done by hand.
  questions:
    # ---- Stimulus set: one sinusoid from two (3.9)
    - slug: trig-u03-w17-q01
      type: multiple_choice
      topic_code: "3.9"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      stimulus: |
        Let f(x) = √3 sin x + cos x, where x is in radians.
      prompt: |
        Which expression is equal to f(x) for every x?
      options:
        - "2 sin(x + π/3)"
        - "2 sin(x + π/6)"
        - "4 sin(x + π/6)"
        - "(√3 + 1) sin(x + π/4)"
      option_explanations:
        - |
          This swaps the roles of a and b: cos φ must equal a/R = √3/2, which gives π/6, not π/3. 2 sin(x + π/3) expands to sin x + √3 cos x.
        - |
          Correct. R = √(3 + 1) = 2, cos φ = √3/2 and sin φ = 1/2, so φ = π/6. Expanding: 2(sin x · √3/2 + cos x · 1/2) = √3 sin x + cos x.
        - |
          4 is a² + b² = 3 + 1; R is the square root of that sum, so the amplitude is 2.
        - |
          Adding the coefficients does not give the amplitude; the two waves do not peak at the same x. R = √(a² + b²) = 2.
      answer: 1
    - slug: trig-u03-w17-q02
      type: multiple_choice
      topic_code: "3.9"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      stimulus: |
        Let f(x) = √3 sin x + cos x, where x is in radians.
      prompt: |
        What is the maximum value of f, and what is the smallest x ≥ 0 at which it occurs?
      options:
        - "Maximum 2, at x = π/2"
        - "Maximum √3 + 1, at x = π/4"
        - "Maximum 2, at x = π/6"
        - "Maximum 2, at x = π/3"
      option_explanations:
        - |
          π/2 is where sin x alone peaks; the shift φ = π/6 moves the peak left, to x = π/2 − π/6.
        - |
          √3 + 1 ≈ 2.73 adds the coefficients, but the two terms never reach their maxima at the same x. f(π/4) = (√6 + √2)/2 ≈ 1.93.
        - |
          π/6 is the phase angle φ itself, not the x where the maximum occurs. f(π/6) = √3/2 + √3/2 = √3.
        - |
          Correct. f(x) = 2 sin(x + π/6) has maximum 2 when x + π/6 = π/2, so x = π/3. Check: √3 · √3/2 + 1/2 = 2.
      answer: 3
    - slug: trig-u03-w17-q03
      type: multiple_choice
      topic_code: "3.9"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      stimulus: |
        Let f(x) = √3 sin x + cos x, where x is in radians.
      prompt: |
        What are the zeros of f on the interval [0, 2π)?
      options:
        - "x = 5π/6 and x = 11π/6"
        - "x = π/6 and x = 7π/6"
        - "x = 2π/3 and x = 5π/3"
        - "x = 0 and x = π"
      option_explanations:
        - |
          Correct. 2 sin(x + π/6) = 0 when x + π/6 = π or 2π, so x = 5π/6 or 11π/6. Check: √3 · 1/2 + (−√3/2) = 0.
        - |
          These solve x − π/6 = nπ, shifting the wrong way; f(π/6) = √3/2 + √3/2 = √3, not 0.
        - |
          These come from the wrong phase angle π/3; f(2π/3) = √3 · √3/2 − 1/2 = 1, not 0.
        - |
          These are the zeros of sin x alone; f(0) = 0 + 1 = 1 because of the cosine term.
      answer: 0
    - slug: trig-u03-w17-q04
      type: multiple_choice
      topic_code: "3.9"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      stimulus: |
        Let f(x) = √3 sin x + cos x, where x is in radians.
      prompt: |
        Which describes how the graph of f is obtained from the graph of y = sin x?
      options:
        - "Stretch vertically by 2, then shift π/6 to the right"
        - "Stretch vertically by √3, then shift π/6 to the left"
        - "Stretch vertically by 2, then shift π/6 to the left"
        - "Stretch vertically by 2, then shift π/3 to the left"
      option_explanations:
        - |
          In 2 sin(x + π/6) the + inside the argument moves the graph left; a right shift would be sin(x − π/6).
        - |
          √3 is only the coefficient of sin x; the cosine term also contributes, and the amplitude is √(3 + 1) = 2.
        - |
          Correct. f(x) = 2 sin(x + π/6): amplitude 2 and a horizontal shift of π/6 to the left, with period 2π unchanged.
        - |
          π/3 would come from cos φ = 1/2, but cos φ = a/R = √3/2, which gives φ = π/6.
      answer: 2
    # ---- Topics 3.8 and 3.9
    - slug: trig-u03-w17-q05
      type: multiple_choice
      topic_code: "3.8"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      prompt: |
        Which expression is equal to sin 5x cos 3x for every x?
      options:
        - "½(sin 8x − sin 2x)"
        - "sin 8x + sin 2x"
        - "½(sin 8x + sin 2x)"
        - "½(cos 2x + cos 8x)"
      option_explanations:
        - |
          The minus sign belongs to cos A sin B; for sin A cos B the two sines are added.
        - |
          This is 2 sin 5x cos 3x: the product-to-sum formula carries a factor of ½.
        - |
          Correct. sin A cos B = ½[sin(A + B) + sin(A − B)] with A = 5x and B = 3x.
        - |
          This is the formula for cos 5x cos 3x; a sine times a cosine gives a sum of sines.
      answer: 2
    - slug: trig-u03-w17-q06
      type: multiple_choice
      topic_code: "3.8"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      prompt: |
        What is the exact value of cos 75° cos 15°?
      options:
        - "1/4"
        - "1/2"
        - "0"
        - "−1/4"
      option_explanations:
        - |
          Correct. cos A cos B = ½[cos(A − B) + cos(A + B)] = ½(cos 60° + cos 90°) = ½(½ + 0) = ¼.
        - |
          This is cos 60° + cos 90° without the factor ½ from the product-to-sum formula.
        - |
          This replaces the product with cos(75° + 15°) = cos 90°; a product of cosines is not the cosine of the sum.
        - |
          This uses ½[cos(A + B) − cos(A − B)], a misremembered sine–sine formula; a product of two positive cosines cannot be negative.
      answer: 0
    - slug: trig-u03-w17-q07
      type: multiple_choice
      topic_code: "3.8"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      prompt: |
        Which product is equal to cos 5x − cos x for every x?
      options:
        - "2 sin 3x sin 2x"
        - "−2 cos 3x cos 2x"
        - "cos 4x"
        - "−2 sin 3x sin 2x"
      option_explanations:
        - |
          This drops the minus sign: cos u − cos v = −2 sin((u + v)/2) sin((u − v)/2). At x = π/6 it gives +√3 but cos(5π/6) − cos(π/6) = −√3.
        - |
          This negates the formula for cos 5x + cos x; a difference of cosines becomes a product of sines.
        - |
          Cosine is not linear, so cos 5x − cos x is not cos(5x − x). At x = 0 the left side is 0 but cos 0 = 1.
        - |
          Correct. Half the sum is 3x and half the difference is 2x, and the difference-of-cosines formula has a leading minus.
      answer: 3
    - slug: trig-u03-w17-q08
      type: multiple_choice
      topic_code: "3.9"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      prompt: |
        Which expression is equal to −sin x + cos x for every x?
      options:
        - "√2 sin(x + 3π/4)"
        - "√2 sin(x − π/4)"
        - "√2 sin(x + π/4)"
        - "2 sin(x + 3π/4)"
      option_explanations:
        - |
          Correct. R = √2, cos φ = −1/√2 and sin φ = 1/√2 put φ in quadrant II, so φ = 3π/4. Check x = 0: √2 sin(3π/4) = 1.
        - |
          tan⁻¹(1/(−1)) = −π/4 ignores the quadrant; this is the negative of the expression (at x = 0 it gives −1, not 1).
        - |
          √2 sin(x + π/4) equals sin x + cos x; the sign of the sine term is wrong.
        - |
          The angle is right but R = √((−1)² + 1²) = √2, not the sum of the absolute values of the coefficients.
      answer: 0
    - slug: trig-u03-w17-q09
      type: multiple_choice
      topic_code: "3.9"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      prompt: |
        What is the maximum value of y = 5 sin x + 12 cos x?
      options:
        - "17"
        - "12"
        - "13"
        - "169"
      option_explanations:
        - |
          17 adds the amplitudes, which would need both terms to peak at the same x; sin x and cos x never both equal 1.
        - |
          12 is the larger coefficient alone; combining the waves gives a larger amplitude than either piece.
        - |
          Correct. y = 13 sin(x + φ) with R = √(25 + 144) = 13, and a sine reaches 1.
        - |
          169 is a² + b²; the amplitude R is its square root.
      answer: 2
    # ---- Spiral review
    - slug: trig-u03-w17-q10
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        If sin x = 3/5 and π/2 < x < π, what is sin 2x?
      options:
        - "24/25"
        - "−24/25"
        - "6/5"
        - "7/25"
      option_explanations:
        - |
          This uses cos x = +4/5, but cosine is negative in quadrant II.
        - |
          Correct. cos x = −4/5 in quadrant II, so sin 2x = 2 sin x cos x = 2(3/5)(−4/5) = −24/25.
        - |
          6/5 doubles sin x; doubling the angle does not double the sine, and no sine exceeds 1.
        - |
          7/25 is cos 2x = 1 − 2 sin²x, not sin 2x.
      answer: 1
    - slug: trig-u03-w17-q11
      type: multiple_choice
      topic_code: "3.4"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        Using tan 165° = tan(120° + 45°), what is the exact value of tan 165°?
      options:
        - "2 − √3"
        - "−(2 + √3)"
        - "1 − √3"
        - "√3 − 2"
      option_explanations:
        - |
          The size is right but 165° is in quadrant II, where tangent is negative.
        - |
          −(2 + √3) ≈ −3.73 is tan 105°; check the denominator 1 − tan 120° tan 45° = 1 + √3.
        - |
          This adds tan 120° + tan 45° and forgets the denominator of the tangent sum formula.
        - |
          Correct. (tan 120° + tan 45°)/(1 − tan 120° tan 45°) = (1 − √3)/(1 + √3) = (1 − √3)²/(1 − 3) = √3 − 2 ≈ −0.268.
      answer: 3
    - slug: trig-u03-w17-q12
      type: multiple_choice
      topic_code: "2.11"
      source: "Original item; Common Core HSF-TF.B.5 (extension)"
      points: 1
      prompt: |
        Which pair of curves forms the envelope of the damped wave y = 3e^(−0.5t) sin 4t?
      options:
        - "y = 3 and y = −3"
        - "y = 3e^(−0.5t) and y = −3e^(−0.5t)"
        - "y = e^(−0.5t) and y = −e^(−0.5t)"
        - "y = 3 sin 4t and y = −3 sin 4t"
      option_explanations:
        - |
          Constant lines would bound an undamped wave; the factor e^(−0.5t) makes the bound shrink over time.
        - |
          Correct. Since −1 ≤ sin 4t ≤ 1, the wave stays between ±3e^(−0.5t) and touches them where sin 4t = ±1.
        - |
          This drops the coefficient 3, so the wave would cross outside these curves wherever |sin 4t| is near 1.
        - |
          These are oscillating curves, not bounds; the envelope is the decaying amplitude factor.
      answer: 1
    - slug: trig-u03-w17-q13
      type: multiple_choice
      topic_code: "3.1"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 1
      prompt: |
        Where it is defined, (sec x − cos x)/tan x simplifies to which expression?
      options:
        - "cos x"
        - "tan x"
        - "sin x"
        - "sec x"
      option_explanations:
        - |
          This cancels sec x with tan x term by term; a quotient of a difference cannot be split that way.
        - |
          tan x appears in the denominator; after rewriting in sines and cosines it divides out rather than remaining.
        - |
          Correct. sec x − cos x = (1 − cos²x)/cos x = sin²x/cos x; dividing by sin x/cos x leaves sin x.
        - |
          This keeps the first term and drops the rest; sec x − cos x simplifies to sin²x/cos x before dividing.
      answer: 2
    - slug: trig-u03-w17-q14
      type: multi_select
      topic_code: "3.8"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 2
      partial_credit: true
      prompt: |
        Which of these product-to-sum and sum-to-product equations are true for every real x? Select all that apply.
      options:
        - "2 sin 3x cos x = sin 4x + sin 2x"
        - "2 sin 3x sin x = cos 4x − cos 2x"
        - "cos 3x + cos x = 2 cos 2x cos x"
        - "sin 3x + sin x = sin 4x"
        - "sin 3x − sin x = 2 sin 2x cos x"
      option_explanations:
        - |
          Correct. 2 sin A cos B = sin(A + B) + sin(A − B) with A = 3x and B = x.
        - |
          The order is reversed: 2 sin A sin B = cos(A − B) − cos(A + B) = cos 2x − cos 4x.
        - |
          Correct. Half the sum of 3x and x is 2x and half the difference is x, so the sum is 2 cos 2x cos x.
        - |
          Sine is not linear. At x = π/6 the left side is sin(π/2) + sin(π/6) = 3/2, but sin(2π/3) = √3/2.
        - |
          The sine and cosine are swapped: sin u − sin v = 2 cos((u + v)/2) sin((u − v)/2) = 2 cos 2x sin x.
      answer: [0, 2]
    - slug: trig-u03-w17-q15
      type: multi_select
      topic_code: "3.3"
      source: "Original item; Common Core HSF-TF.C.8"
      points: 2
      partial_credit: true
      prompt: |
        A student lists five equations and claims each one is an identity. Which really are identities (true wherever both sides are defined)? Select all that apply.
      options:
        - "(1 − cos²x)/sin x = sin x"
        - "sin x + cos x = 1"
        - "tan x + cot x = sec x csc x"
        - "sec²x − tan²x = 1"
        - "(sin x + cos x)² = 1"
      option_explanations:
        - |
          Correct. 1 − cos²x = sin²x, and sin²x/sin x = sin x wherever sin x ≠ 0.
        - |
          A counterexample settles it: at x = π/4 the left side is √2. This is an equation true only for some x, not an identity.
        - |
          Correct. sin x/cos x + cos x/sin x = (sin²x + cos²x)/(sin x cos x) = 1/(sin x cos x) = sec x csc x.
        - |
          Correct. Rearranging the Pythagorean identity 1 + tan²x = sec²x gives sec²x − tan²x = 1.
        - |
          Expanding gives 1 + 2 sin x cos x, which equals 1 only where sin 2x = 0; at x = π/4 the left side is 2.
      answer: [0, 2, 3]
    - slug: trig-u03-w17-q16
      type: true_false
      topic_code: "3.8"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      prompt: |
        True or false: For every real x, sin 3x cos x = ½(sin 4x + sin 2x).
      answer: true
      explanation: |
        True. sin A cos B = ½[sin(A + B) + sin(A − B)] with A = 3x and B = x gives ½(sin 4x + sin 2x).
