    - slug: trig-u03-w18-q22
      type: short_answer
      topic_code: "3.10"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 3
      prompt: |
        Consider 2 cos²x + cos x = 0, with x in radians.

        (a) Factor the left side, and explain why dividing both sides by cos x would be a mistake.
        (b) Find every solution in [0, 2π).
        (c) Write the general solution (n any integer).
      answer: |
        (a) cos x (2 cos x + 1) = 0. Dividing by cos x assumes cos x ≠ 0 and would lose the solutions where cos x = 0.
        (b) cos x = 0 gives π/2 and 3π/2; cos x = −1/2 gives 2π/3 and 4π/3. Solutions: π/2, 2π/3, 4π/3, 3π/2.
        (c) x = π/2 + πn, x = 2π/3 + 2πn or x = 4π/3 + 2πn.
      explanation: |
        Three points, one per part. (a) the factorisation and a reason that refers to losing cos x = 0 solutions. (b) all four values (no credit with one missing). (c) all three families; accept π/2 + 2πn and 3π/2 + 2πn written separately.
    - slug: trig-u03-w18-q23
      type: short_answer
      topic_code: "3.7"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 3
      prompt: |
        An angle θ satisfies cos θ = −7/25 and π < θ < 3π/2.

        (a) In which quadrant does θ/2 lie? Explain.
        (b) Find the exact value of sin(θ/2).
        (c) Find the exact value of cos(θ/2).
      answer: |
        (a) Halving π < θ < 3π/2 gives π/2 < θ/2 < 3π/4, so θ/2 is in quadrant II.
        (b) sin(θ/2) = +√((1 − cos θ)/2) = √((1 + 7/25)/2) = √(16/25) = 4/5, positive in quadrant II.
        (c) cos(θ/2) = −√((1 + cos θ)/2) = −√((1 − 7/25)/2) = −√(9/25) = −3/5, negative in quadrant II.
      explanation: |
        Three points, one per part. (a) quadrant II with the halved inequality. (b) 4/5 with a positive sign. (c) −3/5; a positive 3/5 earns no credit, since the sign is the point of the part.
    - slug: trig-u03-w18-q24
      type: long_answer
      topic_code: "3.10"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 6
      prompt: |
        Solve sin x + 1 = cos x on [0, 2π) by squaring both sides, with x in radians.

        (A) (i) Square both sides and use a Pythagorean identity to show that the result simplifies to sin x (sin x + 1) = 0.
        (ii) List every candidate solution in [0, 2π) given by this factored equation.

        (B) (i) Check each candidate in the original equation, and state the solutions.
        (ii) Explain why squaring both sides can produce values that do not solve the original equation.

        (C) (i) Write the general solution of sin x + 1 = cos x (n any integer).
        (ii) A classmate solves sin²x + sin x = 0 by dividing by sin x, getting sin x = −1. Which of your answers would the classmate miss, and why?
      answer: |
        (A) (i) (sin x + 1)² = cos²x gives sin²x + 2 sin x + 1 = 1 − sin²x, so 2 sin²x + 2 sin x = 0, that is 2 sin x (sin x + 1) = 0, or sin x (sin x + 1) = 0.
        (ii) sin x = 0 gives x = 0 and π; sin x = −1 gives x = 3π/2. Candidates: 0, π, 3π/2.
        (B) (i) x = 0: 0 + 1 = 1 = cos 0, works. x = π: 0 + 1 = 1 but cos π = −1, fails (extraneous). x = 3π/2: −1 + 1 = 0 = cos(3π/2), works. Solutions: 0 and 3π/2.
        (ii) Squaring is not reversible: a = b and a = −b both give a² = b². The value π solves sin x + 1 = −cos x, which has the same square as the original equation.
        (C) (i) x = 2πn or x = 3π/2 + 2πn.
        (ii) Dividing by sin x assumes sin x ≠ 0, so the classmate would lose x = 0 (and the family 2πn), keeping only 3π/2.
      explanation: |
        Six points. (A) 1 point for the squaring and substitution cos²x = 1 − sin²x reaching sin x (sin x + 1) = 0; 1 point for the three candidates 0, π, 3π/2. (B) 1 point for checking all three and stating 0 and 3π/2; 1 point for explaining that squaring merges a = b with a = −b. (C) 1 point for both families (do not accept πn, which includes the extraneous π); 1 point for naming x = 0 (or 2πn) and the divide-by-zero reason.
