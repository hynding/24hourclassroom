week: 18
unit: 3
title: "Solving Trigonometric Equations"
topics: ["3.10"]
guide: guides/week-18.md
guide_description: |
  A five-step plan for every trigonometric equation (isolate, check the value is possible, find the reference
  angle, place it in the right quadrants, add the period), then linear equations, equations quadratic in form,
  factoring out a common trigonometric factor instead of dividing by it, and checking for extraneous roots after
  squaring. Worked examples: 2 sin x − 1 = 0 in full and on [0, 2π), √3 tan x + 1 = 0 with period π,
  4 cos²x − 3 = 0 with the ±, 2 sin²x − sin x − 1 = 0 by factoring, 2 sin x cos x = cos x without dividing, and
  sin x + cos x = 1 by squaring with a check table.
flashcards_description: |
  30 cards on general solutions versus solutions in [0, 2π), periods for sine, cosine and tangent, equations with
  no solution, the ± after a square root, factoring quadratics in sin x and cos x, the never-divide rule,
  extraneous roots and degree-mode solutions.

flashcards:
  - front: Five steps for solving sin x = k, cos x = k or tan x = k → list them
    back: |
      Isolate; check |k| ≤ 1 for sine and cosine; find the reference angle; place it in each quadrant with the right sign; add the period (2πn or πn) or list the values in the interval.
    topic_code: "3.10"
  - front: General solution vs solutions in [0, 2π) → difference
    back: |
      The general solution lists every solution using + 2πn (or + πn), n an integer. "In [0, 2π)" asks only for those from one turn, including 0 and excluding 2π.
    topic_code: "3.10"
  - front: 2 sin x − 1 = 0 → all solutions
    back: |
      sin x = 1/2: x = π/6 + 2πn or x = 5π/6 + 2πn.
    topic_code: "3.10"
  - front: 2 cos x + 1 = 0 → all solutions
    back: |
      cos x = −1/2: x = 2π/3 + 2πn or x = 4π/3 + 2πn.
    topic_code: "3.10"
  - front: √3 tan x + 1 = 0 → all solutions
    back: |
      tan x = −√3/3: x = 5π/6 + πn (equivalently −π/6 + πn). One family, because tangent repeats every π.
    topic_code: "3.10"
  - front: Solutions per turn → sine and cosine vs tangent
    back: |
      sin x = k and cos x = k usually have two solutions in [0, 2π); tan x = k has two in [0, 2π) as well, but they are π apart, so one formula + πn covers them.
    topic_code: "3.10"
  - front: Period to add when solving tan x = k → value
    back: |
      πn. Using 2πn misses the solution in the opposite quadrant.
    topic_code: "3.10"
  - front: 3 sin x + 5 = 0 → how many solutions
    back: |
      None: sin x = −5/3 is outside [−1, 1].
    topic_code: "3.10"
  - front: sin x = 1, sin x = −1, sin x = 0 on [0, 2π) → solutions
    back: |
      π/2; 3π/2; 0 and π. These quadrantal cases give one solution per turn (two for 0).
    topic_code: "3.10"
  - front: cos x = 1, cos x = −1, cos x = 0 on [0, 2π) → solutions
    back: |
      0; π; π/2 and 3π/2.
    topic_code: "3.10"
  - front: 4 cos²x − 3 = 0 on [0, 2π) → solutions
    back: |
      cos x = ±√3/2: π/6, 5π/6, 7π/6, 11π/6. General: π/6 + πn or 5π/6 + πn.
    topic_code: "3.10"
  - front: tan²x = 3 on [0, 2π) → solutions
    back: |
      tan x = ±√3: π/3, 2π/3, 4π/3, 5π/3.
    topic_code: "3.10"
  - front: Square root step in cos²x = c → what to write
    back: |
      cos x = √c or cos x = −√c. Both signs give solutions.
    topic_code: "3.10"
  - front: 2 sin²x − sin x − 1 = 0 → factor and solve on [0, 2π)
    back: |
      (2 sin x + 1)(sin x − 1) = 0: sin x = 1 gives π/2; sin x = −1/2 gives 7π/6, 11π/6.
    topic_code: "3.10"
  - front: 2 cos²x − cos x − 1 = 0 → factor and solve on [0, 2π)
    back: |
      (2 cos x + 1)(cos x − 1) = 0: cos x = 1 gives 0; cos x = −1/2 gives 2π/3, 4π/3.
    topic_code: "3.10"
  - front: Quadratic in sin x that does not factor → what to do
    back: |
      Use the quadratic formula for u = sin x, reject any value outside [−1, 1], then solve sin x = u for each value that remains (a calculator for non-special values).
    topic_code: "3.10"
  - front: 2 sin x cos x = cos x → the right first move
    back: |
      Subtract cos x and factor: cos x (2 sin x − 1) = 0. Solutions on [0, 2π): π/2, 3π/2, π/6, 5π/6.
    topic_code: "3.10"
  - front: Never divide by sin x or cos x when solving → reason
    back: |
      Dividing assumes the factor is not zero, so every solution that makes it zero is lost. Factor it out and set it equal to zero instead.
    topic_code: "3.10"
  - front: sin x tan x = sin x on [0, 2π) → solutions
    back: |
      sin x (tan x − 1) = 0: x = 0, π (sin x = 0) and π/4, 5π/4 (tan x = 1).
    topic_code: "3.10"
  - front: sin²x = sin x on [0, 2π) → solutions
    back: |
      sin x (sin x − 1) = 0: x = 0, π/2, π.
    topic_code: "3.10"
  - front: Squaring both sides of a trig equation → what it can create
    back: |
      Extraneous roots: a = b and a = −b both square to a² = b². Check every candidate in the original equation.
    topic_code: "3.10"
  - front: sin x + cos x = 1 by squaring → candidates and survivors on [0, 2π)
    back: |
      Squaring gives 2 sin x cos x = 0: candidates 0, π/2, π, 3π/2. Only 0 and π/2 satisfy the original.
    topic_code: "3.10"
  - front: cos x − sin x = 1 on [0, 2π) → solutions
    back: |
      Squaring gives sin x cos x = 0; checking leaves x = 0 and x = 3π/2 (π/2 and π are extraneous).
    topic_code: "3.10"
  - front: csc x = −2 on [0, 2π) → solutions
    back: |
      sin x = −1/2: x = 7π/6, 11π/6. Rewrite reciprocals first.
    topic_code: "3.10"
  - front: 2 cos θ + √2 = 0 in degrees → all solutions
    back: |
      cos θ = −√2/2: θ = 135° + 360°n or θ = 225° + 360°n.
    topic_code: "3.10"
  - front: Calculator answer to sin x = −1/2 → why it is not enough
    back: |
      sin⁻¹(−1/2) = −π/6 is one solution, outside [0, 2π). The others come from the quadrant rule and the period: 7π/6 and 11π/6.
    topic_code: "3.10"
  - front: Identity vs equation → how to tell which you have
    back: |
      An identity is true for every allowed x (a counterexample disproves it); an equation is true only for some x, and solving finds them.
    topic_code: "3.10"
  - front: Error-spot → "tan x = 1, so x = π/4 + 2πn"
    back: |
      Tangent's period is π: x = π/4 + πn. The answer given misses 5π/4.
    topic_code: "3.10"
  - front: Error-spot → "cos²x = 1/4, so x = π/3 and 5π/3"
    back: |
      The negative root was dropped: cos x = ±1/2 adds 2π/3 and 4π/3.
    topic_code: "3.10"
  - front: 'Error-spot → "sin x cos x = sin x; divide by sin x to get cos x = 1, so x = 0"'
    back: |
      Dividing by sin x lost the solutions of sin x = 0. Factor: sin x (cos x − 1) = 0 gives x = 0 and π on [0, 2π).
    topic_code: "3.10"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topic 3.10: linear equations, general solutions and
    solutions in [0, 2π), quadratic forms, factoring instead of dividing, and extraneous roots after squaring),
    with about a third reviewing earlier weeks (reference angles, unit-circle values, inverse sine, reduction,
    double-angle, half-angle, sum-to-product and combined-sinusoid formulas). Includes a shared-context set on
    2 cos²x − cos x − 1 = 0. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes. Angles are in radians unless degrees are shown, and n stands for any
    integer. The whole quiz is designed to be done without a calculator.
  questions:
    # ---- Stimulus set: a quadratic in cos x (3.10)
    - slug: trig-u03-w18-q01
      type: multiple_choice
      topic_code: "3.10"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      stimulus: |
        Consider the equation 2 cos²x − cos x − 1 = 0, where x is in radians.
      prompt: |
        Which factored form is equivalent to the equation?
      options:
        - "(2 cos x − 1)(cos x + 1) = 0"
        - "cos x (2 cos x − 1) = 1"
        - "(2 cos x + 1)(cos x − 1) = 0"
        - "(cos x − 1)² = 0"
      option_explanations:
        - |
          Expanding gives 2 cos²x + cos x − 1; the middle term has the wrong sign.
        - |
          This factors only part of the left side and leaves 1 on the right, so the zero-product rule cannot be used.
        - |
          Correct. With u = cos x, 2u² − u − 1 = (2u + 1)(u − 1); expanding gives 2u² − 2u + u − 1.
        - |
          (cos x − 1)² expands to cos²x − 2 cos x + 1, which does not match the coefficients 2, −1, −1.
      answer: 2
    - slug: trig-u03-w18-q02
      type: multiple_choice
      topic_code: "3.10"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      stimulus: |
        Consider the equation 2 cos²x − cos x − 1 = 0, where x is in radians.
      prompt: |
        Which list gives every solution of the equation in [0, 2π)?
      options:
        - "0, 2π/3, 4π/3"
        - "π/3, π, 5π/3"
        - "0, 2π/3"
        - "2π/3, 4π/3, 2π"
      option_explanations:
        - |
          Correct. cos x = 1 gives x = 0; cos x = −1/2 has reference angle π/3 in quadrants II and III, giving 2π/3 and 4π/3.
        - |
          These solve (2 cos x − 1)(cos x + 1) = 0, the factoring with the signs reversed; cos(π/3) = 1/2 gives 2(1/4) − 1/2 − 1 = −1 ≠ 0.
        - |
          Cosine is negative in quadrant III as well as II, so 4π/3 is also a solution.
        - |
          2π is not in [0, 2π); the solution from cos x = 1 in this interval is 0.
      answer: 0
    - slug: trig-u03-w18-q03
      type: multiple_choice
      topic_code: "3.10"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      stimulus: |
        Consider the equation 2 cos²x − cos x − 1 = 0, where x is in radians.
      prompt: |
        Which describes all real solutions of the equation (n any integer)?
      options:
        - "x = 2π/3 + 2πn or x = 4π/3 + 2πn"
        - "x = 2πn or x = 2π/3 + πn"
        - "x = πn or x = 2π/3 + 2πn"
        - "x = 2πn or x = 2π/3 + 2πn or x = 4π/3 + 2πn"
      option_explanations:
        - |
          This drops the factor cos x − 1 = 0, whose solutions x = 2πn also satisfy the equation.
        - |
          2π/3 + π = 5π/3 has cosine 1/2, not −1/2; cosine's solutions repeat every 2π, not π.
        - |
          πn includes x = π, where cos x = −1 and 2(1) + 1 − 1 = 2 ≠ 0; and 4π/3 is missing.
        - |
          Correct. cos x = 1 gives 2πn; cos x = −1/2 gives the two families 2π/3 + 2πn and 4π/3 + 2πn.
      answer: 3
    - slug: trig-u03-w18-q04
      type: multiple_choice
      topic_code: "3.10"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      stimulus: |
        Consider the equation 2 cos²x − cos x − 1 = 0, where x is in radians.
      prompt: |
        How many solutions does the equation have in the interval [0, 4π)?
      options:
        - "3"
        - "6"
        - "4"
        - "5"
      option_explanations:
        - |
          3 is the count for one turn, [0, 2π); the interval [0, 4π) covers two full turns.
        - |
          Correct. Each turn contributes 0 (or 2π), 2π/3 and 4π/3: the solutions are 0, 2π/3, 4π/3, 2π, 8π/3 and 10π/3.
        - |
          This counts the cos x = −1/2 solutions in both turns but forgets 0 and 2π from cos x = 1.
        - |
          Five usually comes from treating 2π as excluded; it is excluded from [0, 2π) but lies inside [0, 4π), so the second turn contributes 2π, 8π/3 and 10π/3.
      answer: 1
    # ---- Topic 3.10
    - slug: trig-u03-w18-q05
      type: multiple_choice
      topic_code: "3.10"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      prompt: |
        Which describes all solutions of 2 cos x + √2 = 0 (n any integer)?
      options:
        - "x = π/4 + 2πn or x = 7π/4 + 2πn"
        - "x = 3π/4 + 2πn or x = 5π/4 + 2πn"
        - "x = 3π/4 + πn"
        - "x = 5π/4 + 2πn or x = 7π/4 + 2πn"
      option_explanations:
        - |
          These solve cos x = +√2/2; the equation gives cos x = −√2/2.
        - |
          Correct. cos x = −√2/2 has reference angle π/4, and cosine is negative in quadrants II and III.
        - |
          Adding πn to 3π/4 reaches 7π/4, where cosine is positive; the cosine solutions are not π apart here.
        - |
          These are the quadrants where sine is negative; cosine is negative in II and III.
      answer: 1
    - slug: trig-u03-w18-q06
      type: multiple_choice
      topic_code: "3.10"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      prompt: |
        Which describes all solutions of √3 tan x − 1 = 0 (n any integer)?
      options:
        - "x = π/6 + πn"
        - "x = π/6 + 2πn"
        - "x = π/3 + πn"
        - "x = π/6 + 2πn or x = 5π/6 + 2πn"
      option_explanations:
        - |
          Correct. tan x = 1/√3 = √3/3 gives x = π/6, and tangent repeats every π, so π/6 + πn includes 7π/6 as well.
        - |
          2π is the period of sine and cosine; this misses 7π/6, where tangent is also √3/3.
        - |
          tan(π/3) = √3, not √3/3; the reference angle is π/6.
        - |
          tan(5π/6) = −√3/3; this places the second solution where sine is positive instead of where tangent is positive.
      answer: 0
    - slug: trig-u03-w18-q07
      type: multiple_choice
      topic_code: "3.10"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      prompt: |
        Which list gives every solution of 4 sin²x = 3 in [0, 2π)?
      options:
        - "π/3, 2π/3"
        - "π/6, 5π/6, 7π/6, 11π/6"
        - "π/3, 2π/3, 4π/3, 5π/3"
        - "π/3, 5π/3"
      option_explanations:
        - |
          These solve sin x = √3/2 only; taking the square root gives sin x = ±√3/2.
        - |
          These are the solutions of 4 cos²x = 3; the reference angle for sine √3/2 is π/3.
        - |
          Correct. sin x = √3/2 gives π/3, 2π/3; sin x = −√3/2 gives 4π/3, 5π/3.
        - |
          sin(5π/3) = −√3/2, but this list misses 2π/3 and 4π/3; it uses cosine's quadrant pattern.
      answer: 2
    - slug: trig-u03-w18-q08
      type: multiple_choice
      topic_code: "3.10"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      prompt: |
        To solve sin x tan x = sin x on [0, 2π), a student divides both sides by sin x and finds x = π/4 and 5π/4. Which solutions did the student lose?
      options:
        - "π/2 and 3π/2"
        - "3π/4 and 7π/4"
        - "None; dividing is allowed here"
        - "0 and π"
      option_explanations:
        - |
          At π/2 and 3π/2, tan x is undefined, so these cannot be solutions of the original equation.
        - |
          tan(3π/4) = −1, so 3π/4 does not satisfy tan x = 1, and sin x ≠ 0 there either.
        - |
          Dividing by sin x assumes sin x ≠ 0, so it discards every x where sin x = 0, and those satisfy the equation (0 · 0 = 0).
        - |
          Correct. Factoring gives sin x (tan x − 1) = 0, and sin x = 0 adds x = 0 and π, where both sides are 0.
      answer: 3
    - slug: trig-u03-w18-q09
      type: multiple_choice
      topic_code: "3.10"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      prompt: |
        Squaring both sides of cos x − sin x = 1 leads to sin x cos x = 0. After checking candidates, which list gives every solution of the original equation in [0, 2π)?
      options:
        - "0 and 3π/2"
        - "0, π/2, π and 3π/2"
        - "π/2 and π"
        - "0 only"
      option_explanations:
        - |
          Correct. Candidates 0, π/2, π, 3π/2; cos 0 − sin 0 = 1 and cos(3π/2) − sin(3π/2) = 0 − (−1) = 1 work, the other two give −1.
        - |
          These are all the candidates from the squared equation; squaring can add extraneous roots, and π/2 and π give −1.
        - |
          These are exactly the extraneous candidates: they solve cos x − sin x = −1.
        - |
          3π/2 also works: cos(3π/2) = 0 and sin(3π/2) = −1, so the difference is 1.
      answer: 0
    - slug: trig-u03-w18-q10
      type: multiple_choice
      topic_code: "3.10"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 1
      prompt: |
        Which list gives every solution of csc x = −2 in [0, 2π)?
      options:
        - "π/6, 5π/6"
        - "2π/3, 4π/3"
        - "7π/6, 11π/6"
        - "4π/3, 5π/3"
      option_explanations:
        - |
          These solve sin x = +1/2; csc x = −2 means sin x = −1/2.
        - |
          These solve cos x = −1/2; cosecant is the reciprocal of sine, not cosine.
        - |
          Correct. csc x = −2 means sin x = −1/2: reference angle π/6, in quadrants III and IV.
        - |
          sin(4π/3) = −√3/2; this uses the reference angle π/3, which belongs to ±√3/2.
      answer: 2
    # ---- Spiral review
    - slug: trig-u03-w18-q11
      type: multiple_choice
      topic_code: "3.9"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      prompt: |
        Which expression is equal to sin x − √3 cos x for every x?
      options:
        - "2 sin(x + π/3)"
        - "2 sin(x − π/6)"
        - "4 sin(x − π/3)"
        - "2 sin(x − π/3)"
      option_explanations:
        - |
          2 sin(x + π/3) expands to sin x + √3 cos x; with b = −√3 the angle must have a negative sine.
        - |
          cos φ = 1/2 gives an angle of size π/3, not π/6; 2 sin(x − π/6) expands to √3 sin x − cos x.
        - |
          4 is a² + b²; the amplitude is its square root, 2.
        - |
          Correct. R = 2, cos φ = 1/2, sin φ = −√3/2, so φ = −π/3: 2(sin x · ½ − cos x · √3/2).
      answer: 3
    - slug: trig-u03-w18-q12
      type: multiple_choice
      topic_code: "3.8"
      source: "Original item; Common Core HSF-TF.C.9 (extension)"
      points: 1
      prompt: |
        Which product is equal to sin 3x + sin x for every x?
      options:
        - "2 cos 2x sin x"
        - "2 sin 2x cos x"
        - "sin 4x"
        - "2 sin 2x sin x"
      option_explanations:
        - |
          This is sin 3x − sin x; a sum of sines puts the sine on half the sum.
        - |
          Correct. sin u + sin v = 2 sin((u + v)/2) cos((u − v)/2) = 2 sin 2x cos x.
        - |
          Sine is not linear; sin 3x + sin x is not sin(3x + x).
        - |
          A product of two sines comes from a difference of cosines, not a sum of sines.
      answer: 1
    - slug: trig-u03-w18-q13
      type: multiple_choice
      topic_code: "3.6"
      source: "Original item; Common Core HSF-TF.C.9"
      points: 1
      prompt: |
        Which expression is equal to cos 2x for every x, written using sin x only?
      options:
        - "1 − 2 sin²x"
        - "2 sin²x − 1"
        - "1 − sin²x"
        - "2 sin x"
      option_explanations:
        - |
          Correct. cos 2x = cos²x − sin²x = (1 − sin²x) − sin²x = 1 − 2 sin²x.
        - |
          This is the negative of the correct form; at x = 0 it gives −1, but cos 0 = 1.
        - |
          1 − sin²x is cos²x by the Pythagorean identity, not cos 2x; at x = π/2 it gives 0, but cos π = −1.
        - |
          This treats the double angle as doubling a value, and uses sine instead of cosine.
      answer: 0
    - slug: trig-u03-w18-q14
      type: multiple_choice
      topic_code: "2.9"
      source: "Original item; Common Core HSF-TF.B.6"
      points: 1
      prompt: |
        What is the value of sin⁻¹(−√3/2), in radians?
      options:
        - "4π/3"
        - "5π/3"
        - "−π/3"
        - "−π/6"
      option_explanations:
        - |
          sin(4π/3) = −√3/2, but 4π/3 is outside [−π/2, π/2], the range of inverse sine.
        - |
          5π/3 has sine −√3/2 and is coterminal with the answer, but inverse sine returns angles in [−π/2, π/2].
        - |
          Correct. −π/3 lies in [−π/2, π/2] and sin(−π/3) = −√3/2.
        - |
          sin(−π/6) = −1/2; the value √3/2 belongs to the reference angle π/3.
      answer: 2
    - slug: trig-u03-w18-q15
      type: multi_select
      topic_code: "3.10"
      source: "Original item; Common Core HSF-TF.B.7"
      points: 2
      partial_credit: true
      prompt: |
        Which values of x are solutions of 2 sin x cos x = cos x? Select all that apply.
      options:
        - "π/6"
        - "π/2"
        - "π/3"
        - "5π/6"
        - "π"
      option_explanations:
        - |
          Correct. sin(π/6) = 1/2, so 2 sin x cos x = cos x holds: the factor 2 sin x − 1 is zero.
        - |
          Correct. cos(π/2) = 0, so both sides are 0. Dividing by cos x would have lost this solution.
        - |
          2 sin(π/3) cos(π/3) = √3/2, but cos(π/3) = 1/2; neither factor of cos x (2 sin x − 1) is zero.
        - |
          Correct. sin(5π/6) = 1/2, so 2 sin x − 1 = 0 and the equation holds (both sides equal −√3/2).
        - |
          At π, the left side is 2 · 0 · (−1) = 0 and the right side is −1, so the equation fails.
      answer: [0, 1, 3]
    - slug: trig-u03-w18-q16
      type: multi_select
      topic_code: "1.11"
      source: "Original item; Common Core HSF-TF.A.2"
      points: 2
      partial_credit: true
      prompt: |
        Which of these unit-circle values equal −1/2? Select all that apply.
      options:
        - "sin(7π/6)"
        - "cos(4π/3)"
        - "cos(5π/3)"
        - "tan(3π/4)"
        - "sin(5π/6)"
      option_explanations:
        - |
