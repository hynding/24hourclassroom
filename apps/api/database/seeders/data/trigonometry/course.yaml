# The Trigonometry course map. Week files live under unit-NN-<slug>/week-NN.yaml.
# Titles and slugs are composed by Database\Seeders\Curriculum\Course from the
# numbers here, so nothing in a week file repeats the naming convention.
title: Trigonometry
# Every title starts with `prefix`; every test, material and the course row
# itself carry a slug that starts with `slug`.
prefix: Trigonometry
slug: trig
# The course page's introduction. Folded (`>`): one paragraph, not hard line breaks.
description: >
  A full school year of high-school trigonometry, from right triangles to the
  advanced topics a precalculus requirement expects, for a student who has
  finished Geometry and Algebra 2, one week at a time: a study guide, a
  flashcard deck and a quiz every week, a summary sheet and an exam at the end
  of each of the five units (angles and right-triangle trigonometry; graphs
  and inverse functions; identities and equations; oblique triangles and
  vectors; and polar coordinates, complex numbers and parametric equations),
  and an exam-prep guide with a 70-question cumulative practice final.
  Original material written for this course around the Common Core State
  Standards for trigonometry, with original worked examples, questions and
  cards; the foundation weeks follow the approach of the CC BY 4.0
  Illustrative Mathematics 9–12 trigonometry lessons.
  Free to copy, adapt and share under CC BY 4.0, crediting 24 Hour
  Classroom.
teacher: { name: "Trigonometry Teacher", email: trig@example.com }
student: { name: "Trigonometry Student", email: trig-student@example.com }
# Monday of week 1. Null means no due dates: the whole course is open at once.
# Weeks 33-34 are review; the final falls in the buffer weeks after them.
start_date: 2026-08-31
exam_date: null
subject: math
grade_level: "9-12"
review:
  prep_guide_week: 33
  practice_exam_week: 34
  prep_guide_description: How the cumulative final is built and timed, how the practice final maps onto the five units, the formulas and exact values to know cold, the procedures that cost the most points, how the free-response items are scored, and a two-week review plan.
# Every guide and summary must end with all of these (the content lint).
attribution_markers: ["written for this course", "CC BY 4.0"]
attribution: |
  Original study material written for this course and organised around the
  Common Core State Standards for Mathematics (HSG-SRT, HSF-TF, HSN-CN,
  HSN-VM). The foundation weeks follow the approach of the trigonometry
  lessons in IM 9–12 Math by Illustrative Mathematics (© 2019, CC BY 4.0);
  every explanation, worked example, flashcard and question was written for
  this course. © 2026 24 Hour Classroom, licensed under CC BY 4.0
  (https://creativecommons.org/licenses/by/4.0/).
# Topic codes are this course's own (unit.topic); guides cite the matching
# Common Core standards.
units:
  - number: 1
    slug: unit-01-angles-and-right-triangle-trigonometry
    title: Angles and Right-Triangle Trigonometry
    weeks: [1, 2, 3, 4, 5, 6]
    topics:
      "1.1": Angles, Degrees and Standard Position
      "1.2": Similar Triangles and Special Right Triangles
      "1.3": The Six Trigonometric Ratios
      "1.4": Cofunctions and Complementary Angles
      "1.5": Solving Right Triangles
      "1.6": Angles of Elevation and Depression and Bearings
      "1.7": Radian Measure
      "1.8": Arc Length, Sector Area and Angular Speed
      "1.9": Trigonometric Functions of Any Angle
      "1.10": Reference Angles and Signs by Quadrant
      "1.11": The Unit Circle and Exact Values
      "1.12": Fundamental Identities
  - number: 2
    slug: unit-02-graphs-and-inverse-functions
    title: Graphs and Inverse Functions
    weeks: [7, 8, 9, 10, 11, 12]
    topics:
      "2.1": Periodic Functions and the Graphs of Sine and Cosine
      "2.2": Amplitude and Period
      "2.3": Phase Shift and Vertical Shift
      "2.4": Writing Equations of Sinusoids
      "2.5": Graphs of Tangent and Cotangent
      "2.6": Graphs of Secant and Cosecant
      "2.7": Sinusoidal Models
      "2.8": Simple Harmonic Motion and Frequency
      "2.9": Inverse Sine, Cosine and Tangent
      "2.10": Compositions with Inverse Trigonometric Functions
      "2.11": Sums of Sinusoids and Damped Oscillation
      "2.12": Inverse Cotangent, Secant and Cosecant
  - number: 3
    slug: unit-03-identities-and-equations
    title: Identities and Equations
    weeks: [13, 14, 15, 16, 17, 18, 19]
    topics:
      "3.1": Simplifying Trigonometric Expressions
      "3.2": Factoring and Rational Trigonometric Expressions
      "3.3": Verifying Identities
      "3.4": Sum and Difference Formulas
      "3.5": Cofunction and Reduction Formulas
      "3.6": Double-Angle Formulas
      "3.7": Power-Reducing and Half-Angle Formulas
      "3.8": Product-to-Sum and Sum-to-Product Formulas
      "3.9": Combining a sin x + b cos x
      "3.10": Solving Trigonometric Equations
      "3.11": Equations with Multiple Angles and Identities
      "3.12": Trigonometric Inequalities and Calculator Solutions
  - number: 4
    slug: unit-04-oblique-triangles-and-vectors
    title: Oblique Triangles and Vectors
    weeks: [20, 21, 22, 23, 24, 25]
    topics:
