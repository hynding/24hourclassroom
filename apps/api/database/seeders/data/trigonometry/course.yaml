    title: Polar Coordinates, Complex Numbers and Parametric Equations
    weeks: [26, 27, 28, 29, 30, 31, 32]
    topics:
      "5.1": Polar Coordinates
      "5.2": Converting Polar and Rectangular Equations
      "5.3": Graphs of Polar Equations
      "5.4": The Complex Plane
      "5.5": Trigonometric Form of a Complex Number
      "5.6": Products and Quotients in Trigonometric Form
      "5.7": De Moivre's Theorem
      "5.8": Roots of Complex Numbers
      "5.9": Parametric Equations and Eliminating the Parameter
      "5.10": Projectile Motion and Parametric Models
      "5.11": Polar Equations of Conics
      "5.12": Euler's Formula and Rotations
