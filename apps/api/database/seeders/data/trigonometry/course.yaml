      "4.2": The Ambiguous Case
      "4.3": The Law of Cosines
      "4.4": Triangle Area and Heron's Formula
      "4.5": Surveying and Navigation
      "4.6": Vectors, Magnitude and Direction
      "4.7": Vector Operations and Unit Vectors
      "4.8": The Dot Product and the Angle Between Vectors
      "4.9": Projections and Work
      "4.10": Forces, Equilibrium and Velocity
