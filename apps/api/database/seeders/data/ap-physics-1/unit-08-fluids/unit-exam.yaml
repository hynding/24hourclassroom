unit: 8
description: |
  42 questions · about 90 minutes · every topic of Unit 8 (8.1 to 8.4): the fluid and ideal-fluid models
  and density, pressure and its growth with depth, absolute and gauge pressure, Pascal's principle and
  hydraulics, buoyancy and Archimedes' principle treated with free-body diagrams and Newton's laws, the
  continuity equation, Bernoulli's equation and Torricelli's outflow. Includes three shared-context sets (a
  four-question set on a water-filled aquarium tank, a four-question set on a floating plastic block and a
  four-question set on water flowing through a pipe that narrows), select-all, true/false, fill-in-the-blank
  and numeric items, two short-answer questions (3 points each) and two free-response questions in the 2027
  AP style (10 points each: a mathematical routines question on a siphon, and an experimental design and
  analysis question on buoyancy measured with a spring scale). Use g = 9.8 m/s², ρ_water = 1000 kg/m³ and
  atmospheric pressure 1.0 × 10⁵ Pa unless a question says otherwise. Calculators and the equation sheet
  are allowed throughout. Multiple choice, select-all, true/false and numeric items are graded at once;
  fill-in-the-blank items are matched automatically; the short answers and free-response questions are
  graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: an aquarium tank (8.1, 8.2)
  - slug: apphys1-u08-exam-q01
    type: multiple_choice
    topic_code: "8.1"
    source: "AP Physics 1 CED, Topic 8.1"
    points: 1
    stimulus: |
      An open aquarium tank has vertical sides and a flat rectangular base of area 0.30 m². It holds fresh water (1000 kg/m³) to a depth of 0.60 m. Atmospheric pressure is 1.0 × 10⁵ Pa.
    prompt: |
      What is the mass of the water in the tank?
    options:
      - "0.18 kg"
      - "180 kg"
      - "1764 kg"
      - "300 kg"
    option_explanations:
      - |
        0.18 is the volume in cubic metres; mass is the volume times the density, 1000 kg/m³.
      - |
        Correct. V = 0.30 m² × 0.60 m = 0.18 m³, and m = ρV = 1000 × 0.18 = 180 kg.
      - |
        This multiplies by g: 180 × 9.8 = 1764 is the weight of the water in newtons, not its mass in kilograms.
      - |
        This treats the base area (0.30 m²) as if it were the volume, leaving out the depth; volume is base area times depth, 0.18 m³.
    answer: 1
  - slug: apphys1-u08-exam-q02
    type: multiple_choice
    topic_code: "8.2"
    source: "AP Physics 1 CED, Topic 8.2"
    points: 1
    stimulus: |
      An open aquarium tank has vertical sides and a flat rectangular base of area 0.30 m². It holds fresh water (1000 kg/m³) to a depth of 0.60 m. Atmospheric pressure is 1.0 × 10⁵ Pa.
    prompt: |
      What is the gauge pressure at the bottom of the tank?
    options:
      - "1.06 × 10⁵ Pa"
      - "600 Pa"
      - "5.9 × 10⁵ Pa"
      - "5.9 × 10³ Pa"
    option_explanations:
      - |
        This is the absolute pressure, P₀ + ρgh; gauge pressure leaves out the atmosphere.
      - |
        This is ρh without g; the pressure from a column of liquid is ρgh.
      - |
        This uses the depth in centimetres (60) instead of metres (0.60); with h in metres, ρgh = 5880 Pa.
      - |
        Correct. P_gauge = ρgh = 1000 × 9.8 × 0.60 = 5880 Pa ≈ 5.9 × 10³ Pa.
    answer: 3
  - slug: apphys1-u08-exam-q03
    type: multiple_choice
    topic_code: "8.2"
    source: "AP Physics 1 CED, Topic 8.2"
    points: 1
    stimulus: |
      An open aquarium tank has vertical sides and a flat rectangular base of area 0.30 m². It holds fresh water (1000 kg/m³) to a depth of 0.60 m. Atmospheric pressure is 1.0 × 10⁵ Pa.
    prompt: |
      How does the force on the base due to the water's gauge pressure compare with the weight of the water?
    options:
      - "They are equal, about 1.8 × 10³ N, because the vertical walls carry none of the water's weight."
      - "The force is larger, because pressure acts in all directions."
      - "The force is smaller, because part of the water's weight is held up by the walls."
      - "The force is zero, because the atmosphere pushes up on the base from below."
    option_explanations:
      - |
        Correct. F = P_gauge A = 5880 × 0.30 ≈ 1760 N, and the water's weight is 180 × 9.8 ≈ 1760 N. With vertical walls the fluid's pushes on the walls are horizontal, so the base supports the whole weight.
      - |
        Pressure acts in all directions at a point, but the force on the base is only the perpendicular push on its area, which equals the weight here.
      - |
        Walls carry part of the weight only when they slope outward; vertical walls push horizontally and support no weight.
      - |
        The atmosphere pushing on the water's surface is the part removed by using gauge pressure; the water's own weight still presses on the base.
    answer: 0
  - slug: apphys1-u08-exam-q04
    type: multiple_choice
    topic_code: "8.2"
    source: "AP Physics 1 CED, Topic 8.2"
    points: 1
    stimulus: |
      An open aquarium tank has vertical sides and a flat rectangular base of area 0.30 m². It holds fresh water (1000 kg/m³) to a depth of 0.60 m. Atmospheric pressure is 1.0 × 10⁵ Pa.
    prompt: |
      All the water is poured into a second tank with vertical sides and half the base area. How do the gauge pressure at the bottom and the force of the water on the base change?
    options:
      - "Pressure the same; force halved"
      - "Pressure halved; force the same"
      - "Pressure doubled; force the same"
      - "Pressure doubled; force doubled"
    option_explanations:
      - |
        The same volume over half the area stands twice as deep, so the pressure ρgh doubles; the force stays equal to the unchanged weight.
      - |
        Halving the area doubles the depth, so the pressure rises, not falls.
      - |
        Correct. Depth doubles to 1.20 m, so ρgh doubles to about 1.18 × 10⁴ Pa. The force is pressure × area = doubled pressure × half the area, still equal to the water's weight.
      - |
        The pressure doubles, but it acts on half the area, so the force on the base is unchanged.
    answer: 2
  # ---- Stimulus set B: a floating plastic block (8.3)
  - slug: apphys1-u08-exam-q05
    type: multiple_choice
    topic_code: "8.3"
    source: "AP Physics 1 CED, Topic 8.3"
    points: 1
    stimulus: |
      A solid plastic block measures 0.20 m × 0.20 m × 0.10 m and has a density of 700 kg/m³. It floats at rest in fresh water with its largest faces horizontal (the 0.10 m edges vertical).
    prompt: |
      How deep below the water surface is the block's bottom face?
    options:
      - "0.030 m"
      - "0.10 m"
      - "0.070 m"
      - "0.14 m"
    option_explanations:
      - |
        0.030 m is the height of the part above the water; the submerged fraction is ρ_block/ρ_water = 0.70.
      - |
        That would mean the block is fully submerged, which happens only if its density equals water's.
      - |
        Correct. Floating: V_sub/V = 700/1000 = 0.70, so 0.70 × 0.10 m = 0.070 m of the block is below the surface.
      - |
        This divides 0.10 m by 0.70, inverting the density ratio; the submerged depth must be less than the block's height.
    answer: 2
  - slug: apphys1-u08-exam-q06
    type: numeric
    topic_code: "8.3"
    source: "AP Physics 1 CED, Topic 8.3"
    points: 1
    stimulus: |
      A solid plastic block measures 0.20 m × 0.20 m × 0.10 m and has a density of 700 kg/m³. It floats at rest in fresh water with its largest faces horizontal (the 0.10 m edges vertical).
    prompt: |
      Coins are stacked on top of the block until its top face is exactly level with the water surface and everything floats at rest, with no coins in the water. What is the total mass of the coins? Give your answer in kg, to two significant figures.
    answer: { value: 1.2, tolerance: 0.03 }
    explanation: |
      V = 0.20 × 0.20 × 0.10 = 4.0 × 10⁻³ m³. Fully submerged, F_b = 1000 × 4.0 × 10⁻³ × 9.8 = 39.2 N. The block's weight is 700 × 4.0 × 10⁻³ × 9.8 = 27.4 N. The coins supply the difference: m_coins g = 39.2 − 27.4 = 11.8 N, so m_coins = (1000 − 700) × 4.0 × 10⁻³ = 1.2 kg.
  - slug: apphys1-u08-exam-q07
    type: multiple_choice
    topic_code: "8.3"
    source: "AP Physics 1 CED, Topic 8.3"
    points: 1
    stimulus: |
      A solid plastic block measures 0.20 m × 0.20 m × 0.10 m and has a density of 700 kg/m³. It floats at rest in fresh water with its largest faces horizontal (the 0.10 m edges vertical).
    prompt: |
      With the coins on top and the block just submerged at rest, which describes the free-body diagram of the block alone?
    options:
      - "Weight down and buoyant force up, of equal size"
      - "Weight down, a normal force from the coins down, and buoyant force up equal to the sum of the two downward forces"
      - "Weight of the block and coins together down, and buoyant force up"
      - "Weight down, buoyant force up, and a normal force from the water up"
    option_explanations:
      - |
        The coins push down on the block; leaving them out makes the buoyant force (39.2 N) appear unbalanced against the block's 27.4 N weight.
      - |
        Correct. On the block alone: F_g = 27.4 N down, the coins' normal force 11.8 N down, and F_b = 39.2 N up. Newton's first law: F_b = mg + F_coins.
      - |
        The coins' weight acts on the coins, not on the block; what acts on the block is the normal force the coins exert on it (equal in size here).
      - |
        The water's upward push on the block is the buoyant force; there is no separate normal force from the water.
    answer: 1
  - slug: apphys1-u08-exam-q08
    type: multiple_choice
    topic_code: "8.3"
    source: "AP Physics 1 CED, Topic 8.3"
    points: 1
    stimulus: |
      A solid plastic block measures 0.20 m × 0.20 m × 0.10 m and has a density of 700 kg/m³. It floats at rest in fresh water with its largest faces horizontal (the 0.10 m edges vertical).
    prompt: |
      The coins are removed and the block is placed in oil of density 800 kg/m³, where it floats at rest. Compared with floating in water, which is correct?
    options:
      - "Greater buoyant force; 70% submerged"
      - "Smaller buoyant force; 87.5% submerged"
      - "Same buoyant force; 70% submerged"
      - "Same buoyant force; 87.5% submerged"
    option_explanations:
      - |
        Floating at rest, the buoyant force equals the unchanged weight in any liquid; and the less dense oil requires more submerged volume.
      - |
        The buoyant force still equals the weight; only the submerged volume changes.
      - |
        The buoyant force is unchanged, but the fraction submerged depends on the liquid's density: 700/800, not 700/1000.
      - |
        Correct. F_b = mg in both liquids. In oil, V_sub/V = 700/800 = 0.875, so 87.5% of the block is submerged.
    answer: 3
  # ---- Stimulus set C: a pipe that narrows (8.4)
  - slug: apphys1-u08-exam-q09
    type: multiple_choice
    topic_code: "8.4"
    source: "AP Physics 1 CED, Topic 8.4"
    points: 1
    stimulus: |
      Water flows steadily through a horizontal pipe. In the wide section the cross-sectional area is 20 cm², the speed is 1.5 m/s and the absolute pressure is 1.20 × 10⁵ Pa. The pipe then narrows to a section of area 5.0 cm². Treat the water as an ideal fluid.
    prompt: |
      What is the speed of the water in the narrow section?
    options:
      - "6.0 m/s"
      - "0.38 m/s"
      - "3.0 m/s"
      - "24 m/s"
    option_explanations:
      - |
        Correct. Continuity: v₂ = v₁(A₁/A₂) = 1.5 × (20/5.0) = 6.0 m/s.
      - |
        This inverts the area ratio; the water speeds up in the narrower section.
      - |
        This uses the square root of the area ratio, as if the areas were diameters; areas are given, so the ratio is used directly.
      - |
        This squares the area ratio, as if 20 and 5.0 were diameters; the speed scales with the area ratio itself.
    answer: 0
  - slug: apphys1-u08-exam-q10
    type: numeric
    topic_code: "8.4"
    source: "AP Physics 1 CED, Topic 8.4"
    points: 1
    stimulus: |
      Water flows steadily through a horizontal pipe. In the wide section the cross-sectional area is 20 cm², the speed is 1.5 m/s and the absolute pressure is 1.20 × 10⁵ Pa. The pipe then narrows to a section of area 5.0 cm². Treat the water as an ideal fluid.
    prompt: |
      What is the volume flow rate through the pipe? Give your answer in litres per second (1 L = 10⁻³ m³), to two significant figures.
    answer: { value: 3.0, tolerance: 0.05 }
    explanation: |
      Q = A₁v₁ = (20 × 10⁻⁴ m²)(1.5 m/s) = 3.0 × 10⁻³ m³/s = 3.0 L/s. The narrow section gives the same: (5.0 × 10⁻⁴)(6.0) = 3.0 × 10⁻³ m³/s.
  - slug: apphys1-u08-exam-q11
    type: multiple_choice
    topic_code: "8.4"
    source: "AP Physics 1 CED, Topic 8.4"
    points: 1
    stimulus: |
      Water flows steadily through a horizontal pipe. In the wide section the cross-sectional area is 20 cm², the speed is 1.5 m/s and the absolute pressure is 1.20 × 10⁵ Pa. The pipe then narrows to a section of area 5.0 cm². Treat the water as an ideal fluid.
    prompt: |
      What is the absolute pressure in the narrow section?
    options:
      - "1.37 × 10⁵ Pa"
      - "1.02 × 10⁵ Pa"
      - "1.03 × 10⁵ Pa"
      - "3.0 × 10⁴ Pa"
    option_explanations:
      - |
        This adds the change in kinetic energy per volume; faster flow at the same height has lower pressure.
      - |
        This subtracts ½ρv₂² = 18 000 Pa but forgets to add back ½ρv₁² = 1125 Pa from the wide section.
      - |
        Correct. P₂ = P₁ − ½ρ(v₂² − v₁²) = 1.20 × 10⁵ − 500 × (36 − 2.25) = 1.20 × 10⁵ − 16 875 ≈ 1.03 × 10⁵ Pa.
      - |
        This divides the pressure by the area ratio of 4; pressure changes according to Bernoulli's equation, not in proportion to area.
    answer: 2
  - slug: apphys1-u08-exam-q12
    type: multiple_choice
    topic_code: "8.4"
    source: "AP Physics 1 CED, Topic 8.4"
    points: 1
    stimulus: |
      Water flows steadily through a horizontal pipe. In the wide section the cross-sectional area is 20 cm², the speed is 1.5 m/s and the absolute pressure is 1.20 × 10⁵ Pa. The pipe then narrows to a section of area 5.0 cm². Treat the water as an ideal fluid.
    prompt: |
      Thin vertical tubes open to the air are attached to the top of the pipe, one at the wide section and one at the narrow section. Water rises in each tube until it is at rest. Which is correct?
    options:
      - "The water stands higher in the tube on the narrow section, because the water there moves faster."
      - "The water stands higher in the tube on the wide section, by about 1.7 m."
      - "The water stands at the same height in both tubes, because the pipe is horizontal."
      - "The water stands higher in the tube on the wide section, by about 17 m."
    option_explanations:
      - |
        A column in an open tube rises until ρgh equals the gauge pressure in the pipe below it; the narrow section has the lower pressure, so its column is shorter.
      - |
        Correct. The pressure difference is 16 875 Pa, and each column's height is its gauge pressure divided by ρg, so the difference is 16 875/(1000 × 9.8) ≈ 1.7 m, with the wide section higher.
      - |
        The pipe is horizontal, but the pressures in the two sections differ because the speeds differ, so the columns differ.
      - |
        This leaves g out of the division (16 875/1000); the height difference is ΔP/(ρg) ≈ 1.7 m.
    answer: 1
  # ---- Density and pressure (8.1, 8.2)
  - slug: apphys1-u08-exam-q13
    type: multiple_choice
    topic_code: "8.1"
    source: "AP Physics 1 CED, Topic 8.1"
    points: 1
    prompt: |
      For which of these situations is the ideal-fluid assumption of incompressibility least appropriate?
    options:
      - "Water flowing through a garden hose"
      - "Oil pushed through a hydraulic car lift"
      - "Sea water at the bottom of a 10 m deep harbour"
      - "Air being pumped into a bicycle tyre"
    option_explanations:
      - |
        Water's density hardly changes at hose pressures (well under 0.1%), so treating it as incompressible works well.
      - |
        Hydraulic oil is chosen because it is nearly incompressible; that is what lets the lift transmit pressure.
      - |
        Even at 10 m the extra pressure changes water's density by only a few hundredths of a percent.
      - |
        Correct. A pump squeezes more and more air into the same tyre volume, so the air's density rises a lot; a gas being compressed is not incompressible.
    answer: 3
  - slug: apphys1-u08-exam-q14
    type: multiple_choice
    topic_code: "8.1"
    source: "AP Physics 1 CED, Topic 8.1"
    points: 1
    prompt: |
      An empty, sealed aluminium drink can has a mass of 0.015 kg and an outer volume of 355 mL (3.55 × 10⁻⁴ m³). What is the average density of the can and the air inside it?
    options:
      - "About 42 kg/m³"
      - "2700 kg/m³, the density of aluminium"
      - "About 0.042 kg/m³"
      - "About 4.2 × 10⁴ kg/m³"
    option_explanations:
      - |
        Correct. ρ_avg = 0.015 kg/3.55 × 10⁻⁴ m³ ≈ 42 kg/m³; the enclosed air is counted in the volume.
      - |
        That is the metal's density; the average density divides the total mass by the whole enclosed volume, mostly air.
      - |
        This divides by 0.355 (the volume in litres) instead of 3.55 × 10⁻⁴ m³.
      - |
        This divides 15 (the mass in grams) by the volume in cubic metres; the units must match.
    answer: 0
  - slug: apphys1-u08-exam-q15
    type: multiple_choice
    topic_code: "8.2"
    source: "AP Physics 1 CED, Topic 8.2"
    points: 1
    prompt: |
      In a hydraulic jack, the large piston has 50 times the area of the small piston, both at the same height. A mechanic pushes the small piston down 0.40 m. How far does the large piston rise?
    options:
      - "20 m"
      - "8.0 mm"
      - "0.40 m"
      - "57 mm"
    option_explanations:
      - |
        This multiplies the distance by the area ratio; the large piston moves less, because the oil's volume is fixed.
      - |
        Correct. The oil is incompressible, so A₁d₁ = A₂d₂ and d₂ = 0.40 m/50 = 0.0080 m = 8.0 mm. The force is multiplied by 50 and the distance divided by 50, so the work in equals the work out.
      - |
        Equal distances would mean equal volumes only if the areas were equal; the large piston sweeps 50 times the area.
      - |
        This divides by √50 ≈ 7.1, as if 50 were a ratio of radii; it is a ratio of areas.
    answer: 1
  - slug: apphys1-u08-exam-q16
    type: multiple_choice
    topic_code: "8.2"
    source: "AP Physics 1 CED, Topic 8.2"
    points: 1
    prompt: |
      An open U-tube holds water, both surfaces level. A student blows gently into the left arm, raising the air pressure above the left surface by 980 Pa while the right arm stays open to the room. When the water comes to rest, which is correct?
    options:
      - "The left surface is 0.10 m higher than the right surface."
      - "The surfaces stay level, because the pressure is transmitted equally to both arms."
      - "The right surface is 0.10 m higher than the left surface."
      - "The right surface is about 1.0 m higher than the left surface."
    option_explanations:
      - |
        The extra pressure pushes the left surface down, not up.
      - |
        Pascal's principle passes the extra pressure through the water, but the right surface still has only atmospheric pressure on it, so the water moves until a height difference balances the extra 980 Pa.
      - |
        Correct. At the level of the lower (left) surface, the pressures in the two arms must be equal: P₀ + 980 = P₀ + ρgΔh, so Δh = 980/(1000 × 9.8) = 0.10 m, with the right surface higher.
      - |
        This divides 980 Pa by 1000 kg/m³ and leaves out g; Δh = ΔP/(ρg).
    answer: 2
  - slug: apphys1-u08-exam-q17
    type: multiple_choice
    topic_code: "8.2"
    source: "AP Physics 1 CED, Topic 8.2"
    points: 1
    prompt: |
      A small, flat pressure sensor is held 2.0 m below the surface of a pond. Its sensing face is first pointed up, then sideways, then down. How do the three readings compare?
    options:
      - "Largest pointing up, because the water above pushes down on it"
      - "Largest pointing down, because pressure increases toward the bottom"
      - "Smallest pointing sideways, because water pushes only up and down"
      - "The same in all three orientations"
    option_explanations:
      - |
        Pressure is a scalar; at a point in a fluid at rest it is the same in every direction, whichever way the sensor faces.
      - |
        The sensor's face is still at 2.0 m whichever way it points; the increase with depth matters only if the sensor moves deeper.
      - |
        A fluid at rest pushes perpendicular to any surface it touches, sideways surfaces included, with the same pressure.
      - |
        Correct. At a given point in a fluid at rest the pressure is the same in all directions, so a small sensor at 2.0 m reads P₀ + ρgh ≈ 1.2 × 10⁵ Pa in every orientation.
    answer: 3
  # ---- Buoyancy (8.3)
  - slug: apphys1-u08-exam-q18
    type: multiple_choice
    topic_code: "8.3"
    source: "AP Physics 1 CED, Topic 8.3"
    points: 1
    prompt: |
      A 1.0 kg block of aluminium and a 1.0 kg block of lead are both held completely under water. Which experiences the larger buoyant force?
    options:
      - "The aluminium block, because it has the larger volume"
      - "The lead block, because it is denser"
      - "Neither: equal masses feel equal buoyant forces"
      - "Neither: blocks that sink feel no buoyant force"
    option_explanations:
      - |
        Correct. Aluminium is less dense (2700 against about 11 300 kg/m³), so 1.0 kg of it occupies more volume, displaces more water and feels a larger ρ_water V g.
      - |
        Higher density means a smaller volume for the same mass, so lead displaces less water and feels less buoyant force.
      - |
        The buoyant force depends on the displaced volume, not on the object's mass; equal masses of different materials have different volumes.
      - |
        Sinking objects still feel a buoyant force; it is just smaller than their weight.
    answer: 0
  - slug: apphys1-u08-exam-q19
    type: multiple_choice
    topic_code: "8.3"
    source: "AP Physics 1 CED, Topic 8.3"
    points: 1
    prompt: |
      A helium balloon of volume 0.012 m³ is tied to a table by a light string and floats at rest. The balloon's rubber and helium together have a mass of 0.0050 kg. The density of air is 1.2 kg/m³. What is the tension in the string?
    options:
      - "About 0.14 N"
      - "About 0.092 N"
      - "About 0.049 N"
      - "About 0.19 N"
    option_explanations:
      - |
        This is the whole buoyant force, ρ_air V g = 0.141 N; the balloon's own weight also pulls down, so the string supplies less.
      - |
        Correct. F_b = 1.2 × 0.012 × 9.8 ≈ 0.141 N up; weight = 0.0050 × 9.8 = 0.049 N down; the string pulls down with T = 0.141 − 0.049 ≈ 0.092 N.
      - |
        This is the balloon's weight, not the string's tension.
      - |
        This adds the weight to the buoyant force; at rest the string and the weight together balance the buoyant force.
    answer: 1
  - slug: apphys1-u08-exam-q20
    type: multiple_choice
    topic_code: "8.3"
    source: "AP Physics 1 CED, Topic 8.3"
    points: 1
    prompt: |
      An ice cube floats in a glass filled to the brim with fresh water. When the ice has completely melted, what happens to the water level?
    options:
      - "It rises and water spills, because the ice adds its whole volume to the water"
      - "It falls, because liquid water is denser than ice"
      - "It stays the same, because the floating ice already displaced its own weight of water"
      - "It falls, because the part of the ice above the surface disappears"
    option_explanations:
      - |
        The ice was already displacing water while it floated; only the part below the surface was taking up space in the water.
      - |
        The ice does shrink as it melts, but it shrinks to exactly the volume it was already displacing, so the level does not fall.
      - |
        Correct. Floating, the ice displaced water equal to its own weight. Melted, it becomes water of that same weight, which fills exactly the volume it was displacing, so the level is unchanged.
      - |
        The above-surface part does not vanish; its mass becomes water that fills the space the submerged part was already occupying.
    answer: 2
  - slug: apphys1-u08-exam-q21
    type: multiple_choice
    topic_code: "8.3"
    source: "AP Physics 1 CED, Topic 8.3"
    points: 1
    prompt: |
      A beaker of water on an electronic scale reads 10.0 N. A 4.0 N metal block hanging from a string is lowered until fully submerged; the buoyant force on it is 1.5 N. The string is then cut and the block comes to rest on the bottom of the beaker. What does the scale read now?
    options:
      - "11.5 N"
      - "10.0 N"
      - "12.5 N"
      - "14.0 N"
    option_explanations:
      - |
        That was the reading while the block hung from the string; once the string is cut, the beaker supports the block's whole weight.
      - |
        The block is now inside the beaker and pushing on it; the scale must support the block as well as the water.
      - |
