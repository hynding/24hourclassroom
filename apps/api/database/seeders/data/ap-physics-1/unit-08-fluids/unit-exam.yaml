      Three points, one per part. (a) higher pressure inside (still air), lower above (fast air), with Bernoulli's equation as the reason. (b) 540 Pa and 5.4 × 10⁴ N upward (direction required). (c) four times as large, with the v² dependence named. Saying the force doubles loses the point in (c).
  # ---- Free-response question 1: mathematical routines (8.4, 8.2)
  - slug: apphys1-u08-exam-q41
    type: long_answer
    topic_code: "8.4"
    source: "AP Physics 1 CED, Topic 8.4"
    points: 10
    prompt: |
      Mathematical routines (10 points). A student drains an aquarium with a siphon: a flexible tube of uniform cross-sectional area 1.0 cm², completely filled with water, runs from below the water surface in the tank, up over the tank's rim to its highest point, a height y_top above the tank's water surface, and then down to an open outlet a distance d below the tank's water surface. The tank is wide, so the water surface moves down negligibly slowly. Treat the water as an ideal fluid of density ρ, with atmospheric pressure P₀ acting on the tank's surface and at the outlet.

      (A) Derive an expression for the speed v of the water leaving the outlet, in terms of g and d. Name the conservation law you use.

      (B) Explain why the water in the tube at the highest point moves at the same speed v. Then derive an expression for the absolute pressure P_top in the water at the highest point, in terms of P₀, ρ, g, y_top and d.

      (C) For y_top = 0.50 m and d = 0.80 m, with P₀ = 1.0 × 10⁵ Pa and ρ = 1000 kg/m³, calculate v, the volume flow rate in litres per second, and P_top.

      (D) The student lowers the outlet to make the tank drain faster. Using your expression from (B), explain how P_top changes. Then calculate the greatest height y_top that the top of the tube could have above the water surface, with d = 0.80 m, before the siphon stops working because P_top would have to fall below zero.
    answer: |
      (A) Conservation of energy (Bernoulli's equation) from the tank's surface (P₀, speed ≈ 0, height d above the outlet) to the outlet (P₀, speed v, height 0): P₀ + ρgd = P₀ + ½ρv², so v = √(2gd).
      (B) The tube has a uniform cross-section and water is incompressible, so continuity (conservation of mass, Av constant) gives the same speed v everywhere in the tube. Bernoulli between the highest point (height y_top + d above the outlet) and the outlet: P_top + ρg(y_top + d) + ½ρv² = P₀ + 0 + ½ρv², so P_top = P₀ − ρg(y_top + d).
      (C) v = √(2 × 9.8 × 0.80) ≈ 3.96 m/s ≈ 4.0 m/s. Q = Av = 1.0 × 10⁻⁴ × 3.96 ≈ 3.96 × 10⁻⁴ m³/s ≈ 0.40 L/s. P_top = 1.0 × 10⁵ − 1000 × 9.8 × (0.50 + 0.80) = 1.0 × 10⁵ − 12 740 ≈ 8.7 × 10⁴ Pa.
      (D) A larger d makes ρg(y_top + d) larger, so P_top decreases (the water also moves faster, and its pressure at the top is lower). The siphon fails when P_top = 0: y_top = P₀/(ρg) − d = 1.0 × 10⁵/(1000 × 9.8) − 0.80 ≈ 10.2 − 0.80 ≈ 9.4 m.
    explanation: |
      Ten points.
      (A) 2 points: 1 for applying Bernoulli (or energy conservation for a parcel, mgd = ½mv²) between the surface and the outlet with equal pressures P₀ and negligible surface speed; 1 for v = √(2gd) with conservation of energy named.
      (B) 3 points: 1 for using continuity with a uniform tube to justify the same speed at the top; 1 for a correct Bernoulli equation between the top and the outlet (or the surface) with the correct heights; 1 for P_top = P₀ − ρg(y_top + d) or an equivalent form. Using y_top alone instead of y_top + d loses the last point.
      (C) 3 points: 1 for v ≈ 4.0 m/s (accept 3.9 to 4.0); 1 for Q ≈ 0.40 L/s (4.0 × 10⁻⁴ m³/s), with consistent unit conversion; 1 for P_top ≈ 8.7 × 10⁴ Pa.
      (D) 2 points: 1 for "P_top decreases" justified from the expression (a larger d increases the subtracted term); 1 for y_top ≈ 9.4 m from setting P_top = 0. An answer of 10.2 m (ignoring d) earns only the first point.
  # ---- Free-response question 2: experimental design and analysis (8.3)
  - slug: apphys1-u08-exam-q42
    type: long_answer
    topic_code: "8.3"
    source: "AP Physics 1 CED, Topic 8.3"
    points: 10
    prompt: |
      Experimental design and analysis (10 points). A lab group wants to find the density of a salt solution. They have a solid metal cylinder 0.12 m tall with a flat base of area 2.0 × 10⁻³ m², a spring scale that hangs from a clamp stand, a ruler, and a tall beaker of the solution. The cylinder is denser than the solution.

      (A) Describe a procedure the group could use to collect data from which the solution's density can be found by graphing. State what they measure, which quantity they vary and how, and one way to reduce the uncertainty in the measurements.

      (B) The group's invented data are below, where d is the depth of the cylinder's bottom face below the liquid surface (the cylinder hangs upright and is never fully submerged in these trials) and T is the spring scale reading.

      | d (m) | 0.00 | 0.02 | 0.04 | 0.06 | 0.08 | 0.10 |
      |---|---|---|---|---|---|---|
      | T (N) | 6.00 | 5.59 | 5.18 | 4.76 | 4.35 | 3.94 |

      Starting from a free-body diagram of the cylinder, derive an equation for T in terms of d that shows which quantities to graph to get a straight line. State what the slope and vertical intercept represent, and calculate the slope from the data.

      (C) Use your slope to calculate the density of the salt solution.

      (D) Predict how T would change if the group continued lowering the cylinder from d = 0.12 m to d = 0.15 m without it touching the bottom. Justify your prediction.
    answer: |
      (A) Hang the cylinder upright from the spring scale and record its reading in air. Lower the clamp in steps so that the cylinder's bottom face is at measured depths d below the liquid surface (for example every 0.02 m, measured with the ruler against the cylinder, which can be marked in 1 cm steps beforehand), and record the scale reading T at each depth once the cylinder is still. Reduce uncertainty by reading the ruler and scale at eye level, waiting for the cylinder to stop swinging, repeating each depth and averaging, and taking many depths over the whole range so the graph's slope averages out random errors.
      (B) Free-body diagram: tension T up, buoyant force F_b up, weight mg down. At rest: T + F_b = mg, and F_b = ρ_s g (A d), since the submerged volume is A d. So T = mg − (ρ_s g A) d. Graph T (vertical) against d (horizontal): a straight line with slope −ρ_s g A and vertical intercept mg, the cylinder's weight (about 6.00 N). Slope from the end points: (3.94 − 6.00)/(0.10 − 0.00) = −20.6 N/m (a best-fit line gives about −20.6 N/m).
      (C) ρ_s = −slope/(gA) = 20.6/(9.8 × 2.0 × 10⁻³) ≈ 1.05 × 10³ kg/m³.
      (D) Once d passes 0.12 m the cylinder is fully submerged, so the displaced volume stops growing. The buoyant force stays at ρ_s g A(0.12 m) ≈ 2.47 N and T stays constant at about 6.00 − 2.47 ≈ 3.53 N; the graph becomes a horizontal line from d = 0.12 m to 0.15 m.
    explanation: |
      Ten points.
      (A) 3 points: 1 for measuring the scale reading T at several measured submerged depths (the independent variable d, varied by lowering the clamp, measured with the ruler); 1 for a coherent procedure that keeps the cylinder upright, not touching the beaker, and reads T at rest; 1 for a specific, valid way to reduce uncertainty (repeat and average, read at eye level, many data points across the range, wait for the system to settle). A procedure that only measures the cylinder fully submerged once earns at most 1 point.
      (B) 4 points: 1 for the free-body diagram (T and F_b up, mg down) leading to T = mg − ρ_s g A d; 1 for choosing T against d (or an equivalent linear pair); 1 for identifying the slope as −ρ_s g A and the intercept as the weight; 1 for a slope of −20.6 N/m (accept −20 to −21 N/m, sign or magnitude stated clearly).
      (C) 1 point: ρ_s ≈ 1.05 × 10³ kg/m³ (accept 1020 to 1080 kg/m³), using the slope rather than a single data point.
      (D) 2 points: 1 for predicting that T stays constant (about 3.5 N); 1 for the reasoning that the displaced volume, and so F_b, stops increasing once the cylinder is fully submerged. Predicting that T keeps falling because "deeper means more pressure" earns no points.
