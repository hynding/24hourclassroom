    prompt: |
      A 60 kg student whose average density is 985 kg/m³ floats at rest, first in a freshwater pool (1000 kg/m³), then in a very salty lake (1240 kg/m³). (a) Describe the student's free-body diagram while floating, and state how the buoyant force in the lake compares with that in the pool. (b) Calculate the volume of the student's body that is above the surface in the lake. (c) Explain why floating is so much easier in the lake.
    answer: |
      (a) Two forces: a downward arrow labelled F_g = mg ≈ 590 N and an upward arrow labelled F_b of equal length. The buoyant force equals the weight in both places, so it is the same (about 590 N) in the lake and the pool.
      (b) V = m/ρ = 60/985 ≈ 0.0609 m³. Submerged fraction in the lake: 985/1240 ≈ 0.794, so the fraction above is about 0.206 and the volume above is about 0.206 × 0.0609 ≈ 0.0125 m³ (12.5 L). (In the pool only 1.5%, about 0.0009 m³, is above.)
      (c) The salty water is denser, so a smaller submerged volume displaces enough water to equal the student's weight; about a fifth of the body stays out of the water instead of a tiny fraction.
    explanation: |
      Three points, one per part. (a) two equal and opposite forces, weight and buoyant force, and "the same" buoyant force in both. (b) about 0.0125 m³ (accept 0.012 to 0.013 m³), from V = m/ρ and the fraction 1 − 985/1240. (c) explains with the denser liquid needing less displaced volume for the same buoyant force. Saying the lake gives "more buoyant force" loses the point in (a).
