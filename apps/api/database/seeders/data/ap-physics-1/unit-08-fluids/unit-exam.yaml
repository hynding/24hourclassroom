    prompt: |
      Wind blows at 30 m/s across the flat roof of a closed garage, while the air inside is still. The roof has an area of 100 m², and the density of air is 1.2 kg/m³. (a) Use Bernoulli's equation to explain which side of the roof has the higher pressure. (b) Estimate the pressure difference and the net force of the air on the roof, ignoring the small difference in height between the two sides. (c) Predict how the net force would change if the wind speed doubled.
    answer: |
      (a) Along a streamline at about the same height, P + ½ρv² is constant. The air above the roof moves fast and the air inside is still, so the pressure inside is higher than the pressure above the roof.
      (b) ΔP = ½ρv² = ½ × 1.2 × 30² = 540 Pa. Net force F = ΔP × A = 540 × 100 = 5.4 × 10⁴ N, upward.
