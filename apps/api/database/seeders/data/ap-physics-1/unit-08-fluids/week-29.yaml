      points: 3
      prompt: |
        A student rolls a lump of modelling clay into two balls, one small and one large. She measures: small ball, mass 24 g and volume 15 cm³; large ball, mass 96 g and volume 60 cm³. Her partner claims, "The large ball is denser, because it is heavier." Write a claim, cite evidence from the measurements, and give reasoning that settles the disagreement.
      answer: |
        Claim: the two balls have the same density; the partner is wrong.
        Evidence: small ball ρ = 24 g/15 cm³ = 1.6 g/cm³; large ball ρ = 96 g/60 cm³ = 1.6 g/cm³ (1600 kg/m³ each).
        Reasoning: density is mass per unit volume. The large ball has four times the mass but also four times the volume, so the ratio is unchanged. Density is a property of the clay, not of how much clay there is; "heavier" describes mass (or weight), not density.
      explanation: |
        Three points. 1 point: a correct claim that the densities are equal. 1 point: both densities computed correctly (1.6 g/cm³ or 1600 kg/m³) as evidence. 1 point: reasoning that mass and volume grew by the same factor, so m/V, a property of the material, is unchanged; distinguishing mass or weight from density. A claim without numerical evidence earns at most 2 points.
    - slug: apphys1-u08-w29-q22
      type: short_answer
      topic_code: "8.1"
      source: "AP Physics 1 CED, Topic 8.1"
      points: 3
      prompt: |
        You have an irregular stone about the size of a walnut, an electronic balance and a 100 mL graduated cylinder. (a) Describe a procedure to find the stone's density. (b) Identify the measurement that contributes the largest uncertainty and one way to reduce it.
      answer: |
        (a) Measure the stone's mass m on the balance. Partly fill the cylinder with water and read the volume V₁ at the bottom of the meniscus, at eye level. Lower the stone in gently (tilt the cylinder or use a thread) until it is fully submerged and read V₂. The stone's volume is V₂ − V₁ (1 mL = 1 cm³). Density ρ = m/(V₂ − V₁), converted to kg/m³ by multiplying g/cm³ by 1000.
        (b) The volume: a 100 mL cylinder is read to about ±1 mL, which is a large fraction of a walnut-sized stone's 10 to 20 mL. Reduce it by using a narrower cylinder with finer markings, by measuring several similar stones together, or by using an overflow can and measuring the displaced water's mass on the balance (mass in g = volume in mL for water).
      explanation: |
        Three points. 1 point: mass measured with the balance and volume found by displacement as the difference of two readings with the stone fully submerged. 1 point: density calculated as m/ΔV with a correct unit. 1 point: identifies the volume reading as the dominant uncertainty and gives a workable way to reduce it (finer cylinder, several stones at once, overflow can weighed, repeated trials averaged). Repeating trials alone, without naming which measurement limits precision, earns half credit at the teacher's discretion.
    - slug: apphys1-u08-w29-q23
      type: long_answer
      topic_code: "8.1"
      source: "AP Physics 1 CED, Topic 8.1"
      points: 6
      prompt: |
        Experimental design and analysis. A student wants the density of an unknown clear liquid. She places an empty beaker on a balance (she does not record its mass), then adds the liquid from a syringe 20 mL at a time, recording the total reading after each addition. Invented data:

        | Volume of liquid added (mL) | 20 | 40 | 60 | 80 | 100 |
        |---|---|---|---|---|---|
        | Total balance reading (g) | 118.4 | 135.0 | 151.9 | 168.1 | 185.2 |

        (A) Explain why plotting the total balance reading against the volume of liquid gives a straight line, and state what the slope and the vertical intercept represent.

        (B) Use the data to determine the slope and the intercept. Show your work, and give the liquid's density in kg/m³.

        (C) A classmate says she should instead divide each total reading by its volume and average the five results. Explain what is wrong with that method for these data.
      answer: |
        (A) Total reading = m_beaker + ρV. The beaker's mass is constant and the liquid's mass grows in proportion to V, so the graph is a straight line: slope = ρ (the liquid's density), vertical intercept = the beaker's mass.
        (B) Best-fit slope ≈ (185.2 − 118.4) g/(100 − 20) mL ≈ 0.835 g/mL (least squares gives 0.834 g/mL). Intercept ≈ 118.4 − 0.834 × 20 ≈ 101.7 g. Density ≈ 0.83 g/cm³ = 830 kg/m³ (accept 820 to 850 kg/m³). The beaker's mass is about 102 g.
        (C) Each total reading includes the beaker's mass, so total/volume is not the density (for example 118.4/20 = 5.9 g/mL); the quotient also changes from point to point, so averaging gives a meaningless number. The slope method removes the constant beaker mass automatically.
      explanation: |
        Six points.
        (A) 2 points: 1 for the linear relation total = m_beaker + ρV (or an equivalent statement that each 20 mL adds the same mass); 1 for identifying the slope as the density and the intercept as the beaker's mass.
        (B) 3 points: 1 for a slope computed from the data using two well-separated points or a best-fit line, between 0.82 and 0.85 g/mL; 1 for an intercept between 100 and 104 g; 1 for converting to kg/m³ correctly (820 to 850 kg/m³). Computing the slope from two adjacent points earns full credit only if the value lies in range.
        (C) 1 point: explains that the beaker's mass is in every reading, so dividing the total by the volume overestimates the density (and does so by a different amount at each volume). Saying only "it is less accurate" does not earn the point.
