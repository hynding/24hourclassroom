week: 29
unit: 8
title: "Internal Structure and Density"
topics: ["8.1"]
guide: guides/week-29.md
guide_description: |
  What makes a fluid a fluid (liquids and gases that flow and take the shape of their container), the
  ideal-fluid model used in AP Physics 1 (incompressible, no viscosity, steady flow), density ρ = m/V as a
  property of the material rather than of the sample, the units kg/m³ and g/cm³ and how to convert between
  them, average density of hollow and composite objects, mixing two liquids, why compressing a gas changes
  its density but squeezing a liquid barely does, and how to measure density in the lab. Worked examples:
  the mass of the air in a classroom, a hollow sealed metal sphere's average density, a mass–volume table
  for brass washers graphed to get density from the slope, a scaling check on a cube whose sides double,
  and the density of a syrup–water mixture.
flashcards_description: |
  30 cards on the internal structure of fluids and density: the fluid and ideal-fluid models, ρ = m/V and
  its units, densities worth knowing, average density of hollow and composite objects, mixtures, gases
  versus liquids under compression, scaling arguments, and measuring density with a balance, a graduated
  cylinder and a mass–volume graph.

flashcards:
  - front: Fluid → what the word covers in AP Physics 1
    back: |
      Any substance that flows and takes the shape of its container: liquids and gases. A solid keeps its own shape; a fluid's particles can slide past one another.
    topic_code: "8.1"
  - front: Liquid versus gas at the particle level → the key difference
    back: |
      In a liquid the particles are close together and touching, so the volume barely changes under pressure. In a gas they are far apart, so the gas fills any container and is easily compressed.
    topic_code: "8.1"
  - front: Ideal fluid model → the assumptions
    back: |
      Incompressible (constant density), nonviscous (no internal friction), and steady flow (the velocity at each point does not change with time). AP Physics 1 problems use this model unless they say otherwise.
    topic_code: "8.1"
  - front: Incompressible fluid → what it means for density
    back: |
      Its density is the same everywhere and does not change when it is squeezed or flows into a narrower pipe. Water is very close to incompressible; air in a sealed syringe is not.
    topic_code: "8.1"
  - front: Density definition → formula and SI unit
    back: |
      ρ = m/V, mass per unit volume, in kg/m³. A material's density does not depend on how much of it you have.
    topic_code: "8.1"
  - front: Converting g/cm³ to kg/m³ → the factor
    back: |
      Multiply by 1000: 1 g/cm³ = 1000 kg/m³. (1 g = 10⁻³ kg and 1 cm³ = 10⁻⁶ m³.) Also 1 mL = 1 cm³ and 1 L = 10⁻³ m³.
    topic_code: "8.1"
  - front: Density of fresh water → the value to use
    back: |
      1000 kg/m³ (1.00 g/cm³, or 1 kg per litre). Sea water is about 1025 kg/m³.
    topic_code: "8.1"
  - front: Density of air at room conditions → rough value
    back: |
      About 1.2 kg/m³, roughly 1/800 of water's density. Small, but a room's worth of air has a mass of hundreds of kilograms.
    topic_code: "8.1"
  - front: Densities to recognise → ice, aluminium, iron, mercury
    back: |
      Ice ≈ 917 kg/m³, aluminium ≈ 2700 kg/m³, iron ≈ 7900 kg/m³, mercury ≈ 13 600 kg/m³. Ice is less dense than liquid water, which is unusual.
    topic_code: "8.1"
  - front: Classroom 10 m × 8.0 m × 3.0 m full of air → mass of the air
    back: |
      V = 240 m³, so m = ρV = 1.2 kg/m³ × 240 m³ ≈ 290 kg: about four adults' worth.
    topic_code: "8.1"
  - front: Cube of one material, every side doubled → mass and density
    back: |
      Volume is multiplied by 2³ = 8, so mass is multiplied by 8. Density is unchanged: it is a property of the material.
    topic_code: "8.1"
  - front: Uniform steel bar cut into three equal pieces → density of each piece
    back: |
      The same as the whole bar. Each piece has one third of the mass and one third of the volume, so m/V is unchanged.
    topic_code: "8.1"
  - front: Sealed syringe of air squeezed to half its volume → density of the air
    back: |
      Doubles. No air escapes, so the mass is fixed while the volume halves: ρ = m/V doubles. A gas's density depends on how it is confined.
    topic_code: "8.1"
  - front: Heating water in an open pot → what happens to its density
    back: |
      It decreases slightly: the water expands a little while its mass stays the same. In the ideal-fluid model we usually ignore this.
    topic_code: "8.1"
  - front: Average density of a hollow or composite object → formula
    back: |
      ρ_avg = (total mass)/(total volume enclosed by the outer surface), air spaces included. This is the density that decides whether the object floats.
    topic_code: "8.1"
  - front: Sealed hollow metal sphere, 0.80 kg, outer volume 1.2 × 10⁻³ m³ → average density
    back: |
      ρ_avg = 0.80 kg/1.2 × 10⁻³ m³ ≈ 670 kg/m³, less than water's, even though the metal itself is several times denser than water.
    topic_code: "8.1"
  - front: Mixing two liquids (volumes add) → density of the mixture
    back: |
      ρ_mix = (m₁ + m₂)/(V₁ + V₂) = (ρ₁V₁ + ρ₂V₂)/(V₁ + V₂). It is a volume-weighted average, not the plain average of the two densities.
    topic_code: "8.1"
  - front: 200 mL of liquid at 800 kg/m³ mixed with 300 mL of water → mixture density
    back: |
      Mass = 160 g + 300 g = 460 g in 500 mL, so ρ = 0.92 g/mL = 920 kg/m³ (not the plain average, 900 kg/m³).
    topic_code: "8.1"
  - front: Volume of an irregular rock → water-displacement method
    back: |
      Read a graduated cylinder of water, lower the rock in fully, read again. The rise in level (in mL = cm³) is the rock's volume. Read the bottom of the meniscus at eye level.
    topic_code: "8.1"
  - front: Bottle method for a liquid's density → the three masses
    back: |
      Weigh the empty bottle, the bottle full of water and the bottle full of the liquid. The water mass gives the volume (V = m_water/1000 kg/m³); then ρ_liquid = m_liquid/V.
    topic_code: "8.1"
  - front: Mass versus volume graph for samples of one material → slope and intercept
    back: |
      A straight line whose slope is the density. The intercept should be zero; a container's mass included in every reading shows up as a positive intercept.
    topic_code: "8.1"
  - front: Brass washers, mass–volume best-fit slope 8.5 g/cm³ → density in SI
    back: |
      8.5 g/cm³ × 1000 = 8500 kg/m³. Using the slope of several points beats dividing one mass by one volume, because it averages out reading errors.
    topic_code: "8.1"
  - front: Beaker on a balance, liquid added in steps, total mass graphed against volume → meaning of the intercept
    back: |
      The intercept is the empty beaker's mass; the slope is still the liquid's density. A graph lets you ignore a mass that is in every reading.
    topic_code: "8.1"
  - front: Measuring a small volume (a few mL) by displacement → how to cut the uncertainty
    back: |
      Use a narrower graduated cylinder, or measure many identical objects at once and divide (twenty washers instead of one), so the reading error is a smaller fraction of the result.
    topic_code: "8.1"
  - front: Density of a 1.00 m × 0.50 m × 0.20 m foam slab of mass 4.0 kg → value
    back: |
      V = 0.10 m³, so ρ = 4.0 kg/0.10 m³ = 40 kg/m³, typical of packing foam.
    topic_code: "8.1"
  - front: Fluid as a system → why we can ignore individual molecules
    back: |
      We model the fluid as continuous, describing it with bulk quantities (density, pressure, flow speed) that are averages over enormous numbers of particles.
    topic_code: "8.1"
  - front: Viscosity → what the ideal fluid model ignores
    back: |
      Internal friction between layers of fluid sliding past each other (honey has a lot, water a little). Ideal fluids have none, so no energy is lost as they flow.
    topic_code: "8.1"
  - front: Error-spot → "the big block of ice is denser than the ice cube because it has more mass"
    back: |
      Density is mass per volume. The big block has more mass and proportionally more volume, so its density is the same 917 kg/m³.
    topic_code: "8.1"
  - front: Error-spot → "250 cm³ of oil at 920 kg/m³ has a mass of 230 000 kg"
    back: |
      The volume must be in m³: 250 cm³ = 2.5 × 10⁻⁴ m³, so m = 920 × 2.5 × 10⁻⁴ ≈ 0.23 kg. Always convert before multiplying.
    topic_code: "8.1"
  - front: Error-spot → "mixing equal masses of a 600 kg/m³ and a 1000 kg/m³ liquid gives 800 kg/m³"
    back: |
      Equal masses are not equal volumes. 1 kg of each fills 1/600 + 1/1000 m³, so ρ_mix = 2 kg/(0.002667 m³) = 750 kg/m³.
    topic_code: "8.1"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topic 8.1: the fluid and ideal-fluid models,
    density and average density, mixtures, compressing gases, scaling and measuring density in the lab), with
    7 questions (30%) reviewing earlier weeks (motion of projectiles, Newton's second law, conservation of
    energy, collisions, conservation of angular momentum, and the period and energy of a spring–mass
    oscillator). Opens with a shared-context set on a lab group's mass and volume data for metal pieces.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the
    scoring notes. Calculator and equation sheet allowed throughout.
  questions:
    # ---- Stimulus set: mass and volume of metal pieces (8.1)
    - slug: apphys1-u08-w29-q01
      type: multiple_choice
      topic_code: "8.1"
      source: "AP Physics 1 CED, Topic 8.1"
      points: 1
      stimulus: |
        A lab group cuts five pieces of different sizes from one bar of an unknown metal. They find each piece's mass on a balance and its volume by lowering it into a graduated cylinder of water and reading the rise in the water level. Their invented data:

        | Piece | 1 | 2 | 3 | 4 | 5 |
        |---|---|---|---|---|---|
        | Volume (cm³) | 10.0 | 20.5 | 29.5 | 40.5 | 50.0 |
        | Mass (g) | 27.4 | 54.9 | 80.6 | 108.9 | 135.1 |
      prompt: |
        The group wants a straight-line graph whose slope is the density of the metal. What should they plot?
      options:
        - "Volume on the vertical axis against mass on the horizontal axis"
        - "Mass on the vertical axis against the reciprocal of volume on the horizontal axis"
        - "Mass on the vertical axis against volume on the horizontal axis"
        - "Density (mass ÷ volume of each piece) on the vertical axis against volume on the horizontal axis"
      option_explanations:
        - |
          This is a straight line through the origin, but its slope is V/m = 1/ρ, the reciprocal of the density, not the density itself.
        - |
          Mass is proportional to volume, not to 1/V, so this graph curves and its slope has no simple meaning.
        - |
          Correct. Since m = ρV, plotting m against V gives a straight line through the origin with slope ρ (about 2.7 g/cm³ for these data).
        - |
          Each piece has about the same density, so this graph is a horizontal line; its slope is about zero, and the density is its height, not its slope.
      answer: 2
    - slug: apphys1-u08-w29-q02
      type: numeric
      topic_code: "8.1"
      source: "AP Physics 1 CED, Topic 8.1"
      points: 1
      stimulus: |
        A lab group cuts five pieces of different sizes from one bar of an unknown metal. They find each piece's mass on a balance and its volume by lowering it into a graduated cylinder of water and reading the rise in the water level. Their invented data:

        | Piece | 1 | 2 | 3 | 4 | 5 |
        |---|---|---|---|---|---|
        | Volume (cm³) | 10.0 | 20.5 | 29.5 | 40.5 | 50.0 |
        | Mass (g) | 27.4 | 54.9 | 80.6 | 108.9 | 135.1 |
      prompt: |
        Use the slope of a best-fit line of mass against volume to find the density of the metal. Give your answer in kg/m³, to two significant figures.
      answer: { value: 2700, tolerance: 50 }
      explanation: |
        The best-fit slope is about 2.69 g/cm³ (using the end points: (135.1 − 27.4) g/(50.0 − 10.0) cm³ = 2.69 g/cm³). Converting, 1 g/cm³ = 1000 kg/m³, so ρ ≈ 2.7 × 10³ kg/m³, close to aluminium. Answers between 2650 and 2750 kg/m³ are accepted.
    - slug: apphys1-u08-w29-q03
      type: multiple_choice
      topic_code: "8.1"
      source: "AP Physics 1 CED, Topic 8.1"
      points: 1
      stimulus: |
        A lab group cuts five pieces of different sizes from one bar of an unknown metal. They find each piece's mass on a balance and its volume by lowering it into a graduated cylinder of water and reading the rise in the water level. Their invented data:

        | Piece | 1 | 2 | 3 | 4 | 5 |
        |---|---|---|---|---|---|
        | Volume (cm³) | 10.0 | 20.5 | 29.5 | 40.5 | 50.0 |
        | Mass (g) | 27.4 | 54.9 | 80.6 | 108.9 | 135.1 |
      prompt: |
        A second group measures pieces of the same bar. Their best-fit line of mass against volume has the same slope but crosses the mass axis at +6 g instead of near zero. What is the most likely cause?
      options:
        - "Their pieces were made of a denser metal than the first group's pieces."
        - "Every mass reading included the same extra 6 g, for example a balance that was not zeroed or a small dish left on the pan."
        - "They read the graduated cylinder 6 cm³ too high every time."
        - "Large pieces of a metal are slightly denser than small pieces, so the line bends upward."
      option_explanations:
        - |
          A denser metal would change the slope of the line, but the slope is the same; only the intercept moved.
        - |
          Correct. A constant offset in every mass reading shifts the whole line up by that amount without changing its slope, so the density from the slope is still right.
        - |
          Volumes read 6 cm³ too high would shift the line sideways (to the right), giving a negative mass intercept, not a positive one.
        - |
          Density does not depend on the size of the sample, and a constant shift is a straight line with an intercept, not a bend.
      answer: 1
    - slug: apphys1-u08-w29-q04
      type: multiple_choice
      topic_code: "8.1"
      source: "AP Physics 1 CED, Topic 8.1"
      points: 1
      stimulus: |
        A lab group cuts five pieces of different sizes from one bar of an unknown metal. They find each piece's mass on a balance and its volume by lowering it into a graduated cylinder of water and reading the rise in the water level. Their invented data:

        | Piece | 1 | 2 | 3 | 4 | 5 |
        |---|---|---|---|---|---|
        | Volume (cm³) | 10.0 | 20.5 | 29.5 | 40.5 | 50.0 |
        | Mass (g) | 27.4 | 54.9 | 80.6 | 108.9 | 135.1 |
      prompt: |
        Another piece cut from the same bar has a mass of 270 g. What volume should it have?
      options:
        - "About 0.10 cm³"
        - "About 727 cm³"
        - "About 270 cm³"
        - "About 100 cm³"
      option_explanations:
        - |
          This divides 270 g by 2690, mixing the SI density (kg/m³) with a mass in grams; the units must match.
        - |
          This multiplies mass by density. Since ρ = m/V, the volume is V = m/ρ, not m × ρ.
        - |
          This assumes 1 g per cm³, the density of water, instead of the metal's density of about 2.7 g/cm³.
        - |
          Correct. V = m/ρ = 270 g ÷ 2.69 g/cm³ ≈ 100 cm³, twice the volume of piece 5, which had about half the mass.
      answer: 3
    # ---- Fluids and density (8.1)
    - slug: apphys1-u08-w29-q05
      type: multiple_choice
      topic_code: "8.1"
      source: "AP Physics 1 CED, Topic 8.1"
      points: 1
      prompt: |
        Which set of assumptions makes up the ideal-fluid model used in AP Physics 1?
      options:
        - "The fluid is incompressible, has no viscosity, and flows steadily."
        - "The fluid is a gas whose density doubles whenever its volume is halved."
        - "The fluid's density increases with depth because the fluid above squeezes it."
        - "The fluid has strong internal friction, so it flows at the same speed everywhere."
      option_explanations:
        - |
          Correct. An ideal fluid keeps a constant density (incompressible), loses no energy to internal friction (nonviscous), and has a velocity at each point that does not change with time (steady flow).
        - |
          That describes a compressible gas at fixed temperature; the ideal-fluid model assumes the density does not change at all.
        - |
          An incompressible fluid has the same density at every depth; it is the pressure, not the density, that grows with depth.
        - |
          Internal friction is viscosity, which the ideal-fluid model leaves out entirely.
      answer: 0
    - slug: apphys1-u08-w29-q06
      type: multiple_choice
      topic_code: "8.1"
      source: "AP Physics 1 CED, Topic 8.1"
      points: 1
      prompt: |
        A solid copper cube has sides of 2.0 cm. A second solid copper cube has sides of 4.0 cm. How do the mass and the density of the larger cube compare with those of the smaller cube?
      options:
        - "Mass twice as great; density twice as great"
        - "Mass four times as great; density the same"
        - "Mass eight times as great; density the same"
        - "Mass eight times as great; density eight times as great"
      option_explanations:
        - |
          Doubling each side does not double the volume, and density is a property of copper, so it cannot change with size.
        - |
          Four times is the change in the area of one face (2²); the volume, and so the mass, scales with the cube of the side.
        - |
          Correct. Volume scales as side³, so V is multiplied by 2³ = 8 and so is the mass. ρ = m/V is unchanged because both grow by the same factor.
        - |
          The mass does grow eightfold, but so does the volume, so their ratio, the density, stays the same.
      answer: 2
    - slug: apphys1-u08-w29-q07
      type: multiple_choice
      topic_code: "8.1"
      source: "AP Physics 1 CED, Topic 8.1"
      points: 1
      prompt: |
        A classroom is 10 m long, 8.0 m wide and 3.0 m high. The density of the air in it is 1.2 kg/m³. What is the mass of the air in the room?
      options:
        - "About 200 kg"
        - "About 290 kg"
        - "About 2.4 × 10⁵ kg"
        - "About 2.8 × 10³ kg"
      option_explanations:
        - |
          This divides the volume by the density (240/1.2). Mass is density times volume.
        - |
          Correct. V = 10 × 8.0 × 3.0 = 240 m³, and m = ρV = 1.2 kg/m³ × 240 m³ ≈ 290 kg.
        - |
          This uses the density of water (1000 kg/m³) instead of air; air is about 800 times less dense.
        - |
          This multiplies by g (1.2 × 240 × 9.8): that is the weight of the air in newtons, not its mass in kilograms.
      answer: 1
    - slug: apphys1-u08-w29-q08
      type: multiple_choice
      topic_code: "8.1"
      source: "AP Physics 1 CED, Topic 8.1"
      points: 1
      prompt: |
        A student mixes 200 mL of a juice concentrate of density 800 kg/m³ with 300 mL of water (1000 kg/m³). Assume the volumes simply add. What is the density of the mixture?
      options:
        - "900 kg/m³"
        - "1800 kg/m³"
        - "880 kg/m³"
        - "920 kg/m³"
      option_explanations:
        - |
          This is the plain average of the two densities, which would be right only for equal volumes; here there is more water than concentrate.
        - |
          This adds the two densities. Densities do not add; the masses and the volumes add separately.
        - |
          This weights the densities the wrong way round (0.6 × 800 + 0.4 × 1000), giving the concentrate the larger share.
        - |
          Correct. Mass = 0.80 g/mL × 200 mL + 1.00 g/mL × 300 mL = 160 g + 300 g = 460 g in 500 mL, so ρ = 0.92 g/mL = 920 kg/m³.
      answer: 3
    # ---- Spiral review (7.2, 7.4, 6.4, 3.4)
    - slug: apphys1-u08-w29-q09
      type: multiple_choice
      topic_code: "7.2"
      source: "AP Physics 1 CED, Topic 7.2"
      points: 1
      prompt: |
        A cart attached to a horizontal spring oscillates with period T. Bricks are added to the cart until its total mass is four times the original. The spring is unchanged. What is the new period?
      options:
        - "2T"
        - "4T"
        - "T/2"
        - "T, because the period of an oscillator does not depend on mass"
      option_explanations:
        - |
          Correct. For a spring–mass oscillator T = 2π√(m/k), so multiplying m by 4 multiplies T by √4 = 2.
        - |
          The period depends on the square root of the mass, not on the mass itself, so it does not grow fourfold.
        - |
          More mass means more inertia and a slower oscillation, so the period gets longer, not shorter.
        - |
          The mass-independence holds for a simple pendulum, not for a mass on a spring, where T = 2π√(m/k).
      answer: 0
    - slug: apphys1-u08-w29-q10
      type: multiple_choice
      topic_code: "7.4"
      source: "AP Physics 1 CED, Topic 7.4"
      points: 1
      prompt: |
        A block on a frictionless table is attached to a spring of constant 200 N/m and oscillates with an amplitude of 0.10 m. What is the block's kinetic energy as it passes through the equilibrium position?
      options:
        - "2.0 J"
        - "10 J"
        - "1.0 J"
        - "0 J"
      option_explanations:
        - |
          This is kA² without the factor of one half; the spring energy at the turning point is ½kA².
        - |
          This is ½kA, which leaves out a factor of A; elastic potential energy depends on the square of the stretch.
        - |
          Correct. All the energy is elastic at the turning points, ½kA² = ½ × 200 × 0.10² = 1.0 J, and all of it is kinetic at equilibrium, where the spring is unstretched.
        - |
          The kinetic energy is zero at the turning points, not at equilibrium, where the block moves fastest.
      answer: 2
    - slug: apphys1-u08-w29-q11
      type: multiple_choice
      topic_code: "6.4"
      source: "AP Physics 1 CED, Topic 6.4"
      points: 1
      prompt: |
        A skater spins at 2.0 revolutions per second with arms outstretched and a rotational inertia of 3.6 kg·m². She pulls her arms in, reducing her rotational inertia to 1.2 kg·m². Ignoring friction with the ice, what is her new rate of spin?
      options:
        - "0.67 revolutions per second"
        - "6.0 revolutions per second"
        - "2.0 revolutions per second"
        - "18 revolutions per second"
      option_explanations:
        - |
          This multiplies by 1.2/3.6, which would mean she slows down; with no external torque, a smaller I gives a larger ω.
        - |
          Correct. No external torque about her axis, so L = Iω is conserved: ω₂ = I₁ω₁/I₂ = 3.6 × 2.0/1.2 = 6.0 rev/s.
        - |
          Her angular momentum is conserved, not her angular speed; changing I changes ω.
        - |
          This multiplies by the square of the inertia ratio (3² = 9). Angular momentum is linear in ω, so the factor is just 3.
      answer: 1
    - slug: apphys1-u08-w29-q12
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      prompt: |
        A water balloon is dropped from rest from a window 5.0 m above the ground. Ignoring air resistance, how fast is it moving just before it hits the ground?
      options:
        - "About 98 m/s"
        - "About 49 m/s"
        - "About 7.0 m/s"
        - "About 9.9 m/s"
      option_explanations:
        - |
          This is 2gh = 98 without the square root; the result has units of m²/s², not m/s.
        - |
          This is gh = 49 with neither the factor of 2 nor the square root.
        - |
          This is √(gh), which drops the factor of 2 from mgh = ½mv².
        - |
          Correct. Energy is conserved: mgh = ½mv², so v = √(2gh) = √(2 × 9.8 × 5.0) ≈ 9.9 m/s.
      answer: 3
    # ---- Mixed formats
    - slug: apphys1-u08-w29-q13
      type: multi_select
      topic_code: "8.1"
      source: "AP Physics 1 CED, Topic 8.1"
      points: 2
      partial_credit: true
      prompt: |
        Which of these changes the density of the sample described? Select all that apply.
      options:
        - "Pushing the plunger of a sealed syringe of air halfway in"
        - "Sawing a wooden plank into two equal halves"
        - "Letting half the air out of a rigid, sealed steel tank"
        - "Pouring a litre of water from a tall jug into a wide bowl"
        - "Heating the water in an open pot so that it expands slightly"
      option_explanations:
        - |
          Correct. The same mass of air is squeezed into half the volume, so its density doubles.
        - |
          Each half has half the mass and half the volume, so the density of the wood is unchanged.
        - |
          Correct. The tank's volume stays fixed while the mass of air inside halves, so the density of the remaining air halves.
        - |
          Changing the shape of a liquid changes neither its mass nor its volume, so its density stays the same.
        - |
          Correct. The water's mass stays the same while its volume grows a little, so its density decreases slightly.
      answer: [0, 2, 4]
    - slug: apphys1-u08-w29-q14
      type: multi_select
      topic_code: "4.4"
      source: "AP Physics 1 CED, Topic 4.4"
      points: 2
      partial_credit: true
      prompt: |
        Two carts on a level, low-friction track collide and stick together. Treat the two carts as the system. Which statements are true? Select all that apply.
      options:
        - "The total momentum of the system is the same just before and just after the collision."
        - "The total kinetic energy of the system is the same just before and just after the collision."
        - "The total energy of the system, including internal energy, is conserved."
        - "After the collision the carts move with the same velocity."
        - "Each cart's own momentum is unchanged by the collision."
      option_explanations:
