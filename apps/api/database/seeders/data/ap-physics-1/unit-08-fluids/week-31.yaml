        True or false: A steel bolt resting on the bottom of a bucket of water experiences no buoyant force, because it has sunk.
      answer: false
      explanation: |
        False. The bolt still displaces its own volume of water, so the water exerts a buoyant force ρ_water V g on it. Its free-body diagram has the weight down, the buoyant force up and the normal force from the bucket up, with F_N + F_b = mg. The bolt sank because its weight exceeds the buoyant force.
