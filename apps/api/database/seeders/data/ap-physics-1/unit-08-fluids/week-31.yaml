      points: 3
      prompt: |
        A solid steel bolt sinks in water, but a steel ship of total mass 2.0 × 10⁶ kg floats. (a) Using the idea of average density, explain why the ship floats. (b) Calculate the volume of sea water (1025 kg/m³) the ship displaces when floating at rest. (c) Cargo is loaded onto the ship. Explain what happens to the buoyant force and to the ship's depth in the water.
      answer: |
        (a) The ship's hull encloses a large volume of air, so its total mass divided by the total volume inside its outer surface (its average density) is less than the density of water, even though steel itself is about 7.9 times denser than water. The solid bolt's average density is that of steel, so it sinks.
        (b) Floating at rest, F_b = mg, so ρ_sea V g = mg and V = m/ρ_sea = 2.0 × 10⁶/1025 ≈ 1.95 × 10³ m³ (about 2.0 × 10³ m³).
        (c) The buoyant force must increase to equal the new, larger weight, so the ship sinks deeper until it displaces a larger volume of water (V_sub = m_total/ρ_sea).
      explanation: |
        Three points, one per part. (a) average density of the ship (air included) less than water's, contrasted with the solid bolt. (b) uses F_b = mg to get V ≈ 1.95 × 10³ m³ (accept 1.9 × 10³ to 2.0 × 10³). (c) buoyant force increases to match the larger weight, achieved by a larger submerged volume. Saying "the buoyant force stays the same" loses the point.
