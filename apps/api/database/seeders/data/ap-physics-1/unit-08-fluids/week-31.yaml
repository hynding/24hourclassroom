      prompt: |
        A wooden block floats at rest in fresh water with 72% of its volume submerged. It is then placed in a salt solution of density 1200 kg/m³. (a) Predict whether the buoyant force on the block in the salt solution is greater than, less than or equal to the buoyant force in fresh water. Justify. (b) Predict the fraction of the block's volume submerged in the salt solution, and show how you got it. (c) Describe the block's free-body diagram in the salt solution.
      answer: |
        (a) Equal. In both liquids the block floats at rest, so Newton's first law requires the buoyant force to equal the block's unchanged weight.
        (b) The block's density is 0.72 × 1000 = 720 kg/m³, so in the salt solution V_sub/V = 720/1200 = 0.60: 60% submerged. (Equivalently, the same buoyant force with a liquid 1.2 times denser needs 1/1.2 of the submerged volume: 72%/1.2 = 60%.)
        (c) Two forces of equal length: a downward arrow labelled F_g (weight, mg) from the block's centre and an upward arrow labelled F_b (buoyant force).
      explanation: |
        Three points, one per part. (a) "equal" justified by F_b = mg for a floating object at rest in both liquids. (b) 60% with a valid method (block density 720 kg/m³, or inverse proportion to fluid density). (c) exactly two forces, weight down and buoyant force up, equal in size; adding a normal force or unequal arrows loses the point.
