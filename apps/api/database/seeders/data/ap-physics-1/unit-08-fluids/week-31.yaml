      type: long_answer
      topic_code: "8.3"
      source: "AP Physics 1 CED, Topic 8.3"
      points: 6
      prompt: |
        Translation between representations. A solid wooden cube of volume V and density ρ_b is held completely under fresh water (density ρ_w, greater than ρ_b) by a light string tied from the cube's bottom face to the bottom of the tank. The cube is at rest.

        (A) Describe a free-body diagram of the cube, naming each force and its direction, with arrow lengths in the correct relationship.

        (B) Starting from your diagram, derive an expression for the tension T in the string in terms of V, ρ_b, ρ_w and g. Evaluate it for a cube of volume 1.0 × 10⁻³ m³ and density 600 kg/m³ in water of density 1000 kg/m³.

        (C) The string is cut. Derive an expression for the cube's acceleration just after the cut, ignoring drag, and evaluate it. Then check your expression in the limiting case ρ_b = ρ_w and explain what that case means physically.
      answer: |
        (A) An upward arrow labelled F_b (buoyant force from the water); a downward arrow labelled F_g = mg (weight); a downward arrow labelled T (tension, the string pulls the cube toward the tank bottom). The upward arrow's length equals the sum of the two downward arrows' lengths.
        (B) At rest: F_b = mg + T, with F_b = ρ_w V g and mg = ρ_b V g. So T = (ρ_w − ρ_b)Vg = (1000 − 600) × 1.0 × 10⁻³ × 9.8 = 3.92 N ≈ 3.9 N.
        (C) After the cut, F_net = F_b − mg = (ρ_w − ρ_b)Vg upward, and m = ρ_b V, so a = (ρ_w − ρ_b)g/ρ_b = g(ρ_w/ρ_b − 1) = 9.8 × (1000/600 − 1) ≈ 6.5 m/s², upward. Limiting case ρ_b = ρ_w: a = 0 (and T = 0 in part B), the cube is neutrally buoyant, so it stays at rest wherever it is, as expected.
      explanation: |
        Six points.
        (A) 2 points: 1 for exactly the three forces with correct directions (buoyant up, weight down, tension down); 1 for the length relationship F_b = mg + T. Drawing the tension upward loses the first point.
        (B) 2 points: 1 for writing Newton's first law from the diagram with F_b = ρ_w V g and mg = ρ_b V g; 1 for T = (ρ_w − ρ_b)Vg ≈ 3.9 N.
        (C) 2 points: 1 for a = g(ρ_w/ρ_b − 1), or (ρ_w − ρ_b)g/ρ_b, ≈ 6.5 m/s² upward; 1 for showing a = 0 when ρ_b = ρ_w and interpreting it as neutral buoyancy. Using the cube's density in the buoyant force earns no credit in (B) or (C).
