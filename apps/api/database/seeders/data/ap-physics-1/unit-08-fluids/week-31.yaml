week: 31
unit: 8
title: "Fluids and Newton's Laws"
topics: ["8.3"]
guide: guides/week-31.md
guide_description: |
  The buoyant force as the net force of a fluid's pressure on a submerged object (larger on the bottom
  than on the top), Archimedes' principle F_b = ρ_fluid V_displaced g, and buoyancy problems solved as
  ordinary Newton's-law problems with free-body diagrams: floating objects (F_b = mg, fraction submerged =
  ρ_object/ρ_fluid), objects held under by a string or weighed on a spring scale (apparent weight), objects
  accelerating up or down through a fluid, and the third-law partner of the buoyant force that pushes down
  on the fluid and shows up on a scale under the container. Worked examples: the pressure-difference
  derivation for a submerged brick, an ice cube and an iceberg floating, a fishing sinker weighed in air and in
  water to find its density, a hollow plastic ball held under and released, and a beaker of water on a scale with
  a metal block lowered into it.
flashcards_description: |
  30 cards on buoyancy and Newton's laws in fluids: where the buoyant force comes from, Archimedes'
  principle, floating and fraction submerged, apparent weight on a spring scale, objects held under or
  released underwater, the third-law pair that changes a scale reading, and functional-dependence
  questions about fluid density, volume and depth.

flashcards:
  - front: Buoyant force → where it comes from
    back: |
      Pressure increases with depth, so the fluid pushes up on an object's bottom harder than it pushes down on its top. The net upward push of the fluid is the buoyant force.
    topic_code: "8.3"
  - front: Submerged box of height H and face area A → buoyant force from the pressure difference
    back: |
      F_b = (P_bottom − P_top)A = ρ_fluid g H A = ρ_fluid V g. The side pushes cancel; the atmosphere cancels too.
    topic_code: "8.3"
  - front: Archimedes' principle → statement
    back: |
      The buoyant force on an object equals the weight of the fluid it displaces: F_b = ρ_fluid V_displaced g.
    topic_code: "8.3"
  - front: Buoyant force → which density goes in the formula
    back: |
      The fluid's density, never the object's. Two objects of equal volume fully submerged in the same fluid feel equal buoyant forces, whatever they are made of.
    topic_code: "8.3"
  - front: V_displaced → for a floating object versus a fully submerged one
    back: |
      Fully submerged: the whole volume of the object. Floating: only the volume below the fluid surface.
    topic_code: "8.3"
  - front: Floating object at rest → free-body diagram and condition
    back: |
      A downward arrow F_g = mg and an upward arrow F_b of equal length. Newton's first law: F_b = mg, so the object displaces its own weight of fluid.
    topic_code: "8.3"
  - front: Floating object → fraction of its volume below the surface
    back: |
      V_sub/V = ρ_object/ρ_fluid (from ρ_fluid V_sub g = ρ_object V g). Wood of 650 kg/m³ floats 65% submerged in water.
    topic_code: "8.3"
  - front: Ice (917 kg/m³) in sea water (1025 kg/m³) → fraction below the surface
    back: |
      917/1025 ≈ 0.89: about 89% of an iceberg is underwater and only about 11% shows.
    topic_code: "8.3"
  - front: Sink, float or hover? → the density comparison
    back: |
      Average density greater than the fluid's: sinks. Less: rises and floats partly submerged. Equal: stays wherever it is put (neutral buoyancy).
    topic_code: "8.3"
  - front: Steel ship → why it floats
    back: |
      Its hull encloses a large volume of air, so its average density is less than water's. It sinks until it displaces water equal to its whole weight.
    topic_code: "8.3"
  - front: Boat sailing from a river into the sea → buoyant force and waterline
    back: |
      The buoyant force stays equal to the boat's weight, but sea water is denser, so less volume must be displaced: the boat rides higher.
    topic_code: "8.3"
  - front: Object hanging from a spring scale, fully underwater → free-body diagram
    back: |
      Upward tension T from the scale, upward buoyant force F_b, downward weight mg. At rest: T = mg − F_b, the apparent weight.
    topic_code: "8.3"
  - front: Apparent weight → definition
    back: |
      The reading of a scale supporting an object; underwater it is mg − F_b. The object's true weight mg is unchanged.
    topic_code: "8.3"
  - front: Stone reads 12.0 N in air and 7.5 N in water → its density
    back: |
      F_b = 4.5 N = ρ_water V g, so ρ_stone/ρ_water = 12.0/4.5 ≈ 2.67: ρ_stone ≈ 2.7 × 10³ kg/m³.
    topic_code: "8.3"
  - front: Weigh in air and in water → shortcut for density
    back: |
      ρ_object = ρ_water × (weight in air)/(weight in air − weight in water). The volume and g cancel.
    topic_code: "8.3"
  - front: 0.50 kg aluminium block on a spring scale, lowered fully into water → scale reading
    back: |
      V = 0.50/2700 = 1.85 × 10⁻⁴ m³, F_b = 1000 × 9.8 × 1.85 × 10⁻⁴ ≈ 1.8 N, so the scale reads 4.9 − 1.8 ≈ 3.1 N.
    topic_code: "8.3"
  - front: Beaker on a scale, block lowered in on a string without touching bottom → change in the scale reading
    back: |
      It rises by F_b. The water pushes up on the block with F_b, so by Newton's third law the block pushes down on the water with F_b, which the scale must support.
    topic_code: "8.3"
  - front: Third-law partner of the buoyant force on a submerged object → what and where
    back: |
      The object's downward push on the fluid, equal in size to F_b. It acts on the fluid, not on the object, so it never goes on the object's free-body diagram.
    topic_code: "8.3"
  - front: Object held fully under by a string tied to the bottom → free-body diagram
    back: |
      Upward F_b; downward weight mg and downward tension T. At rest: T = F_b − mg = (ρ_fluid − ρ_object)Vg.
    topic_code: "8.3"
  - front: Object less dense than water released from rest underwater → initial acceleration
    back: |
      a = (F_b − mg)/m = g(ρ_fluid/ρ_object − 1), upward (ignoring drag). Once it moves, drag grows and the acceleration shrinks.
    topic_code: "8.3"
  - front: Object denser than water released underwater → initial acceleration
    back: |
      a = g(1 − ρ_fluid/ρ_object), downward: less than g because the buoyant force opposes the weight. A steel ball (7900 kg/m³) starts at about 8.6 m/s².
    topic_code: "8.3"
  - front: Fully submerged object moved deeper (fluid incompressible) → buoyant force
    back: |
      Unchanged. Both the top and bottom pressures grow by the same ρgΔh, so their difference, and the displaced volume, are the same.
    topic_code: "8.3"
  - front: Floating block moved to a liquid twice as dense → buoyant force and depth
    back: |
      The buoyant force still equals the weight, so it is unchanged; the submerged volume halves, so the block floats higher.
    topic_code: "8.3"
  - front: Helium balloon → why it rises in air
    back: |
      The buoyant force from the air it displaces (ρ_air V g) is greater than the weight of the helium plus the rubber, because helium is much less dense than air.
    topic_code: "8.3"
  - front: Buoyant force on a person in air → size
    back: |
      A 70 kg person has V ≈ 0.07 m³, so F_b = 1.2 × 0.07 × 9.8 ≈ 0.8 N, about 0.1% of the weight: real but usually negligible.
    topic_code: "8.3"
  - front: Cube 0.10 m on a side, fully under water → buoyant force
    back: |
      V = 1.0 × 10⁻³ m³, so F_b = 1000 × 1.0 × 10⁻³ × 9.8 = 9.8 N, whatever the cube is made of.
    topic_code: "8.3"
  - front: Hydrometer (a weighted float) → why it sinks deeper in a less dense liquid
    back: |
      It floats with F_b = mg in every liquid. A smaller ρ_fluid needs a larger V_sub to give the same buoyant force, so more of the stem goes under.
    topic_code: "8.3"
  - front: Error-spot → "the iron anchor sinks, so the water exerts no buoyant force on it"
    back: |
      Every submerged object feels a buoyant force. The anchor sinks because its weight is larger than the buoyant force, not because the buoyant force is zero.
    topic_code: "8.3"
  - front: Error-spot → "the lead ball feels a bigger buoyant force than the same-size wooden ball held under, because lead is denser"
    back: |
      F_b = ρ_fluid V g depends on the fluid and the displaced volume only. Equal volumes fully submerged feel equal buoyant forces.
    topic_code: "8.3"
  - front: Error-spot → "a floating object has F_b greater than its weight; that is why it floats"
    back: |
      At rest, floating means F_b equals the weight exactly (Newton's first law). F_b exceeds mg only while the object is still accelerating upward.
    topic_code: "8.3"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topic 8.3: the origin of the buoyant force,
    Archimedes' principle, floating and fraction submerged, apparent weight, objects held under or released,
    and the third-law partner of the buoyant force), with 7 questions (30%) reviewing earlier weeks (density,
    pressure with depth, Pascal's principle, Newton's second law in an elevator, impulse, and reading an
    oscillator's position–time data). Opens with a shared-context set on a metal block hung from a spring
    scale and lowered into a beaker of water on an electronic scale. Multiple choice, select-all, true/false
    and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short
    answers and the long answer are graded by your teacher against the scoring notes. Calculator and
    equation sheet allowed throughout.
  questions:
    # ---- Stimulus set: block on a spring scale lowered into a beaker on a scale (8.3)
    - slug: apphys1-u08-w31-q01
      type: multiple_choice
      topic_code: "8.3"
      source: "AP Physics 1 CED, Topic 8.3"
      points: 1
      stimulus: |
        A 0.50 kg solid aluminium block (density 2700 kg/m³) hangs from a spring scale. A beaker of water sits on an electronic scale that reads 11.8 N. A student slowly lowers the block into the water until it is completely submerged, hanging at rest from the spring scale without touching the beaker's sides or bottom. No water spills. Use ρ_water = 1000 kg/m³.
      prompt: |
        Which description of the free-body diagram of the block, once it hangs at rest fully submerged, is correct?
      options:
        - "A downward weight and an upward tension of equal size, with no other forces, because the block is at rest"
        - "A downward weight, an upward tension and a downward force from the water pressure on the top face that is larger than the push on the bottom"
        - "A downward weight, an upward tension and an upward buoyant force, with the tension plus the buoyant force equal to the weight"
        - "A downward weight, an upward tension, an upward buoyant force and a downward force of the block on the water"
      option_explanations:
        - |
          The water also pushes on the block. Leaving out the buoyant force would make the spring scale read the full weight underwater, which it does not.
        - |
          Pressure increases with depth, so the water pushes up on the bottom harder than it pushes down on the top; the net force of the water is upward.
        - |
          Correct. Three forces act on the block: F_g = mg down, T up, F_b up. At rest, Newton's first law gives T + F_b = mg.
        - |
          The block's push on the water is the third-law partner of the buoyant force; it acts on the water, so it does not belong on the block's diagram.
      answer: 2
    - slug: apphys1-u08-w31-q02
      type: numeric
      topic_code: "8.3"
      source: "AP Physics 1 CED, Topic 8.3"
      points: 1
      stimulus: |
        A 0.50 kg solid aluminium block (density 2700 kg/m³) hangs from a spring scale. A beaker of water sits on an electronic scale that reads 11.8 N. A student slowly lowers the block into the water until it is completely submerged, hanging at rest from the spring scale without touching the beaker's sides or bottom. No water spills. Use ρ_water = 1000 kg/m³.
      prompt: |
        What does the spring scale read when the block hangs fully submerged? Give your answer in N, to three significant figures.
      answer: { value: 3.09, tolerance: 0.03 }
      explanation: |
        Weight: mg = 0.50 × 9.8 = 4.90 N. Volume: V = m/ρ = 0.50/2700 = 1.85 × 10⁻⁴ m³. Buoyant force: F_b = ρ_water V g = 1000 × 1.85 × 10⁻⁴ × 9.8 ≈ 1.81 N. Tension: T = mg − F_b ≈ 4.90 − 1.81 = 3.09 N. Using the aluminium's density in F_b gives a negative tension, a sign that the wrong density was used.
    - slug: apphys1-u08-w31-q03
      type: multiple_choice
      topic_code: "8.3"
      source: "AP Physics 1 CED, Topic 8.3"
      points: 1
      stimulus: |
        A 0.50 kg solid aluminium block (density 2700 kg/m³) hangs from a spring scale. A beaker of water sits on an electronic scale that reads 11.8 N. A student slowly lowers the block into the water until it is completely submerged, hanging at rest from the spring scale without touching the beaker's sides or bottom. No water spills. Use ρ_water = 1000 kg/m³.
      prompt: |
        What does the electronic scale under the beaker read once the block hangs fully submerged?
      options:
        - "About 13.6 N, because the block pushes down on the water with a force equal to the buoyant force"
        - "11.8 N, because the block is held by the spring scale and does not touch the beaker"
        - "About 16.7 N, because the block's whole weight is now in the beaker"
        - "About 10.0 N, because the water pushes the block up and so is pushed down less"
      option_explanations:
        - |
          Correct. The water pushes up on the block with F_b ≈ 1.8 N, so by Newton's third law the block pushes down on the water with 1.8 N. The scale must now support 11.8 + 1.8 ≈ 13.6 N. (Equivalently, the spring scale now carries only 3.1 N of the 4.9 N weight; the rest is carried by the scale below.)
        - |
          The block interacts with the water even without touching the glass: the water exerts an upward buoyant force on it, and the block exerts an equal downward force on the water.
        - |
          The spring scale still holds most of the block's weight (about 3.1 N of 4.9 N); only the 1.8 N buoyant force is passed to the beaker.
        - |
          The third-law partner of the buoyant force pushes down on the water, increasing the reading, not decreasing it.
      answer: 0
    - slug: apphys1-u08-w31-q04
      type: multiple_choice
      topic_code: "8.3"
      source: "AP Physics 1 CED, Topic 8.3"
      points: 1
      stimulus: |
        A 0.50 kg solid aluminium block (density 2700 kg/m³) hangs from a spring scale. A beaker of water sits on an electronic scale that reads 11.8 N. A student slowly lowers the block into the water until it is completely submerged, hanging at rest from the spring scale without touching the beaker's sides or bottom. No water spills. Use ρ_water = 1000 kg/m³.
      prompt: |
        The student lowers the fully submerged block a further 3 cm, still not touching the bottom. What happens to the spring scale reading?
      options:
        - "It decreases, because the pressure on the block is greater deeper down"
        - "It increases, because there is more water above the block pushing it down"
        - "It decreases to zero once the block is deep enough"
        - "It stays the same, because the buoyant force on a fully submerged object does not depend on depth"
      option_explanations:
        - |
          Both the top and bottom pressures rise by the same amount, ρgΔh, so their difference, which sets the buoyant force, is unchanged.
        - |
          The water above pushes down harder, but the water below pushes up harder by exactly the same amount.
        - |
          The buoyant force (1.8 N) stays less than the weight (4.9 N) at any depth, so the scale never reads zero for this block.
        - |
          Correct. F_b = ρ_water V g depends only on the displaced volume, which is the whole block at any depth, so T = mg − F_b stays at about 3.1 N.
      answer: 3
    # ---- Buoyancy (8.3)
    - slug: apphys1-u08-w31-q05
      type: multiple_choice
      topic_code: "8.3"
      source: "AP Physics 1 CED, Topic 8.3"
      points: 1
      prompt: |
        A log of uniform wood of density 650 kg/m³ floats at rest in a freshwater pond. What fraction of the log's volume is below the water surface?
      options:
        - "35%"
        - "65%"
        - "100%, because a floating object is fully submerged"
        - "It cannot be found without knowing the log's mass"
      option_explanations:
        - |
          35% is the fraction above the water; the question asks for the fraction below.
        - |
          Correct. Floating at rest: F_b = mg, so ρ_water V_sub g = ρ_wood V g and V_sub/V = 650/1000 = 0.65.
        - |
          A floating object displaces only enough water to equal its weight; wood less dense than water floats partly above the surface.
        - |
          The mass cancels: ρ_water V_sub g = ρ_wood V g gives V_sub/V = ρ_wood/ρ_water whatever the log's size, so the densities are enough.
      answer: 1
    - slug: apphys1-u08-w31-q06
      type: multiple_choice
      topic_code: "8.3"
      source: "AP Physics 1 CED, Topic 8.3"
      points: 1
      prompt: |
        A small cargo boat sails from a freshwater river into the sea, where the water is denser. Its load does not change. Which statement describes what happens?
      options:
        - "The buoyant force increases, so the boat rises higher in the water."
        - "The buoyant force decreases, so the boat sinks lower in the water."
        - "The buoyant force stays the same, and the boat rises higher in the water."
        - "The buoyant force stays the same, and the boat sinks lower in the water."
      option_explanations:
        - |
          While floating at rest the buoyant force always equals the boat's weight, which has not changed; the boat does rise, but not because of a bigger force.
        - |
          The buoyant force equals the unchanged weight, and denser water means the boat needs to displace less volume, so it rises.
        - |
          Correct. F_b = mg in both waters. In denser sea water a smaller displaced volume gives that same force (ρ_fluid V_sub g), so the boat floats higher.
        - |
          The buoyant force is unchanged, but denser water supports the boat with less displaced volume, so it rises, not sinks.
      answer: 2
    - slug: apphys1-u08-w31-q07
      type: multiple_choice
      topic_code: "8.3"
      source: "AP Physics 1 CED, Topic 8.3"
      points: 1
      prompt: |
        A lead ball and an aluminium ball have the same volume. Both are held completely under water at the same depth. How do the buoyant forces on them compare?
      options:
        - "They are equal."
        - "The force on the lead ball is greater, because lead is denser."
        - "The force on the aluminium ball is greater, because it is lighter and floats more easily."
        - "There is a buoyant force only on the aluminium ball, because the lead ball would sink if released."
      option_explanations:
        - |
          Correct. F_b = ρ_water V g depends only on the fluid's density and the displaced volume, which are the same for both balls.
        - |
          The object's density does not enter Archimedes' principle; it decides whether the object sinks, not how large the buoyant force is.
        - |
          Being lighter changes the weight, not the buoyant force; equal volumes displace equal amounts of water.
        - |
          Every submerged object feels a buoyant force; the lead ball sinks because its weight is larger than that force.
      answer: 0
    - slug: apphys1-u08-w31-q08
      type: multiple_choice
      topic_code: "8.3"
      source: "AP Physics 1 CED, Topic 8.3"
      points: 1
      prompt: |
        A cube 0.10 m on each side is held completely under fresh water with its top face horizontal and 0.20 m below the surface. Atmospheric pressure is 1.0 × 10⁵ Pa. What is the net upward force of the water on the cube?
      options:
        - "About 29 N"
        - "About 20 N"
        - "About 1.0 × 10³ N"
        - "About 9.8 N"
      option_explanations:
        - |
          This is the gauge pressure on the bottom face times its area (2940 Pa × 0.010 m²); the downward push on the top face must be subtracted.
        - |
          This is the push on the top face only (1960 Pa × 0.010 m²), which acts downward.
        - |
          This is the absolute pressure on the bottom face times its area; the much larger downward push on the top (including the atmosphere) nearly cancels it.
        - |
          Correct. P_bottom − P_top = ρg(0.30 − 0.20) = 980 Pa, so F_net = 980 × 0.010 = 9.8 N, which equals ρ_water V g = 1000 × 1.0 × 10⁻³ × 9.8.
      answer: 3
    # ---- Spiral review (8.2, 8.1, 7.3, 2.5)
    - slug: apphys1-u08-w31-q09
      type: multiple_choice
      topic_code: "8.2"
      source: "AP Physics 1 CED, Topic 8.2"
      points: 1
      prompt: |
        A remotely operated camera rests 25 m below the surface of the sea (density 1025 kg/m³). What is the gauge pressure on it?
      options:
        - "About 3.5 × 10⁵ Pa"
        - "About 2.5 × 10⁵ Pa"
        - "About 2.6 × 10⁴ Pa"
        - "About 1.0 × 10⁵ Pa"
      option_explanations:
        - |
          This adds the atmospheric pressure, giving the absolute pressure; gauge pressure is the part above atmospheric.
        - |
          Correct. P_gauge = ρgh = 1025 × 9.8 × 25 ≈ 2.5 × 10⁵ Pa.
        - |
          This leaves out g (1025 × 25); pressure from a column of fluid is ρgh.
        - |
          This is atmospheric pressure, which the gauge pressure excludes; it is not the pressure due to the water.
      answer: 1
    - slug: apphys1-u08-w31-q10
      type: multiple_choice
      topic_code: "8.1"
      source: "AP Physics 1 CED, Topic 8.1"
      points: 1
      prompt: |
        A sealed 0.50 L plastic bottle (outer volume 5.0 × 10⁻⁴ m³) of mass 0.025 kg contains 0.20 kg of sand, with air filling the rest. What is the average density of the bottle and its contents?
      options:
        - "400 kg/m³"
        - "1600 kg/m³"
        - "450 kg/m³"
        - "0.45 kg/m³"
      option_explanations:
        - |
          This uses only the sand's mass and forgets the bottle's 0.025 kg.
        - |
          The sand's own density does not matter here; average density divides the total mass by the whole enclosed volume, air included.
        - |
          Correct. ρ_avg = (0.025 + 0.20) kg/5.0 × 10⁻⁴ m³ = 0.225/5.0 × 10⁻⁴ = 450 kg/m³.
        - |
          This treats 0.50 L as 0.50 m³; 1 L = 10⁻³ m³.
      answer: 2
    - slug: apphys1-u08-w31-q11
      type: multiple_choice
      topic_code: "7.3"
      source: "AP Physics 1 CED, Topic 7.3"
      points: 1
      prompt: |
        A block on a spring oscillates on a frictionless table. Its position from equilibrium is recorded: t = 0 s, x = +5.0 cm; t = 0.20 s, x = 0; t = 0.40 s, x = −5.0 cm; t = 0.60 s, x = 0; t = 0.80 s, x = +5.0 cm. What are the amplitude and period?
      options:
        - "Amplitude 10 cm, period 0.80 s"
        - "Amplitude 5.0 cm, period 0.40 s"
        - "Amplitude 5.0 cm, period 1.25 s"
        - "Amplitude 5.0 cm, period 0.80 s"
      option_explanations:
        - |
          10 cm is the distance from one extreme to the other; the amplitude is the maximum distance from equilibrium, 5.0 cm.
        - |
          At 0.40 s the block is at the opposite extreme, half a cycle; it returns to +5.0 cm only at 0.80 s.
        - |
          1.25 is the frequency in hertz (1/0.80 s), not the period in seconds.
        - |
          Correct. The largest displacement from equilibrium is 5.0 cm, and the block first returns to the same position moving the same way after 0.80 s.
      answer: 3
    - slug: apphys1-u08-w31-q12
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 1
      prompt: |
        A 50 kg student stands on a bathroom scale in an elevator that is speeding up as it moves upward, with an acceleration of 2.0 m/s². What does the scale read?
      options:
        - "490 N"
        - "590 N"
        - "390 N"
        - "100 N"
      option_explanations:
        - |
          This is the student's weight, the reading only when the acceleration is zero.
        - |
          Correct. Upward net force: F_N − mg = ma, so F_N = m(g + a) = 50 × (9.8 + 2.0) = 590 N.
        - |
          This subtracts ma; the acceleration is upward, so the normal force must exceed the weight.
        - |
          This is ma alone, the net force, not the normal force the scale measures.
      answer: 1
    # ---- Mixed formats
    - slug: apphys1-u08-w31-q13
      type: multi_select
      topic_code: "8.3"
      source: "AP Physics 1 CED, Topic 8.3"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the buoyant force are correct? Select all that apply.
      options:
        - "It equals the weight of the fluid the object displaces."
        - "It is larger on a denser object of the same volume, fully submerged in the same fluid."
        - "It exists because the fluid's pressure is greater at the bottom of the object than at the top."
        - "For an object floating at rest, it equals the object's weight."
        - "It acts on an object only if the object floats."
      option_explanations:
        - |
          Correct. This is Archimedes' principle: F_b = ρ_fluid V_displaced g.
        - |
          The object's density does not enter F_b; equal displaced volumes in the same fluid give equal buoyant forces.
        - |
          Correct. Pressure increases with depth, so the upward push on the bottom exceeds the downward push on the top.
        - |
          Correct. At rest the net force is zero, and the only forces are the weight and the buoyant force.
        - |
          Sinking objects feel a buoyant force too; it is simply smaller than their weight.
      answer: [0, 2, 3]
    - slug: apphys1-u08-w31-q14
      type: multi_select
      topic_code: "4.2"
      source: "AP Physics 1 CED, Topic 4.2"
      points: 2
      partial_credit: true
      prompt: |
        A bat strikes a 0.15 kg ball that is initially at rest on a tee. The force on the ball rises steadily from zero to a peak of 300 N and falls steadily back to zero; the whole contact lasts 0.010 s, so the force–time graph is a triangle. Which statements are true? Select all that apply.
      options:
        - "The impulse on the ball is the area under the force–time graph, 1.5 N·s."
        - "The impulse on the ball is the peak force times the contact time, 3.0 N·s."
        - "The ball's change in momentum is 1.5 kg·m/s."
        - "The ball leaves the bat at 10 m/s."
        - "With the same peak force but a longer contact time, the impulse would be smaller."
      option_explanations:
        - |
          Correct. The area of the triangle is ½ × 0.010 s × 300 N = 1.5 N·s.
        - |
          This treats the triangle as a rectangle; the average force is half the peak for a symmetric triangle.
        - |
          Correct. The impulse–momentum theorem: J = Δp = 1.5 kg·m/s.
        - |
          Correct. Starting from rest, v = Δp/m = 1.5/0.15 = 10 m/s.
        - |
          A longer contact time with the same peak force gives a larger area under the graph, so a larger impulse.
      answer: [0, 2, 3]
