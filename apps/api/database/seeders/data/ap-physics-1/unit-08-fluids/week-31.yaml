        True or false: Pushing the plunger of a sealed, completely water-filled syringe raises the pressure by the same amount at every point in the water.
      answer: true
      explanation: |
        True. This is Pascal's principle: a pressure change applied to an enclosed incompressible fluid is transmitted undiminished to every part of the fluid and to the container's walls. Differences of ρgh between levels remain, but each point's pressure goes up by the same amount.
