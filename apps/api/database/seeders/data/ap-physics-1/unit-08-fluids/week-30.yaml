        Three points, one per part. (a) Pressure grows with depth (ρgh), so the force per area on the lower wall is larger. (b) Ratio 1 : 4 (or "one quarter"), justified by proportionality to depth; giving absolute pressures (a ratio of about 1.98 : 4.92) earns the point only if the student says these are absolute. (c) No effect, because pressure depends only on depth, not on the volume of water. Saying "more water pushes harder" loses the point.
