      type: long_answer
      topic_code: "8.2"
      source: "AP Physics 1 CED, Topic 8.2"
      points: 6
      prompt: |
        Qualitative/quantitative translation. An open U-shaped glass tube contains water. A student pours vegetable oil (density ρ_o, less than the density of water ρ_w) into the left arm until the oil column, measured from the oil–water interface up to the top of the oil, has height h_o. The oil does not mix with the water. When everything is at rest, the water in the right arm stands at a height h_w above the level of the oil–water interface.

        (A) Without equations, explain whether the top of the oil in the left arm is higher than, lower than, or level with the top of the water in the right arm. Base your reasoning on the pressures at the level of the oil–water interface.

        (B) Derive an expression for the difference in height Δ = h_o − h_w between the two free surfaces, in terms of h_o, ρ_o and ρ_w.

        (C) Show that your expression agrees with your reasoning in (A), and check it in the limiting case ρ_o = ρ_w. Then evaluate Δ for h_o = 0.15 m, ρ_o = 800 kg/m³ and ρ_w = 1000 kg/m³.
      answer: |
        (A) At the level of the interface, the two arms are connected by water at rest, so the pressures there must be equal. Both arms are open to the same atmosphere, so the column above that level in the left arm (oil) must produce the same pressure as the column in the right arm (water). Oil is less dense, so a taller column of oil is needed to give the same pressure: the oil surface is higher than the water surface.
        (B) P₀ + ρ_o g h_o = P₀ + ρ_w g h_w, so h_w = (ρ_o/ρ_w)h_o and Δ = h_o − h_w = h_o(1 − ρ_o/ρ_w).
        (C) Because ρ_o is less than ρ_w, the factor (1 − ρ_o/ρ_w) is positive, so Δ is positive: the oil stands higher, as argued in (A). If ρ_o = ρ_w, Δ = 0: the tube just holds one liquid and both surfaces are level, as expected. Numerically, h_w = 0.8 × 0.15 = 0.12 m and Δ = 0.15 × (1 − 0.8) = 0.030 m = 3.0 cm.
      explanation: |
        Six points.
        (A) 2 points: 1 for stating that the pressures are equal at the same level in the connected water (at the interface level); 1 for concluding that the less dense oil needs a taller column, so the oil surface is higher. A correct claim with no pressure reasoning earns no points.
        (B) 2 points: 1 for equating P₀ + ρ_o g h_o with P₀ + ρ_w g h_w (P₀ may be omitted on both sides); 1 for Δ = h_o(1 − ρ_o/ρ_w) or an equivalent form.
        (C) 2 points: 1 for showing Δ is positive when ρ_o is less than ρ_w and Δ = 0 when the densities are equal, connected explicitly to (A); 1 for Δ = 0.030 m (accept 3 cm).
