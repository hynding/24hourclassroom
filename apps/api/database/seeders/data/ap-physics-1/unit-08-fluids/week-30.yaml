        A concrete dam holds back a reservoir 40 m deep. Engineers make the wall much thicker at the bottom than at the top. (a) Using the relationship between pressure and depth, explain why. (b) Compare the gauge pressure on the wall 10 m below the surface with the gauge pressure 40 m below the surface, as a ratio. (c) State whether the length of the reservoir behind the dam (how far the water extends upstream) affects the force on the wall, and why.
      answer: |
