week: 30
unit: 8
title: "Pressure"
topics: ["8.2"]
guide: guides/week-30.md
guide_description: |
  Pressure as the perpendicular force per unit area, P = F/A, a scalar measured in pascals; why a fluid at
  rest pushes perpendicular to every surface it touches and equally in all directions at one point; how
  pressure grows with depth, P = P₀ + ρgh, derived from a free-body diagram of a column of fluid; absolute
  versus gauge pressure; why the pressure at a given depth does not depend on the container's shape;
  Pascal's principle and the hydraulic lift, with the work check that forbids getting energy for free; and
  measuring pressure with an open U-tube. Worked examples: a hiker's boots versus snowshoes on snow, the
  pressure on a diver 15 m down in sea water, a pressure-sensor lab graphed to get ρ and P₀ from the slope
  and intercept, a garage car lift with the work check, and an oil–water U-tube.
flashcards_description: |
  30 cards on pressure: P = F/A and its units, pressure as a scalar acting perpendicular to surfaces,
  pressure with depth and the column derivation, absolute and gauge pressure, the container-shape paradox,
  Pascal's principle and hydraulic lifts, U-tube manometers and straws, and lab graphs of pressure against
  depth.

flashcards:
  - front: Pressure definition → formula and SI unit
    back: |
      P = F⊥/A, the perpendicular force per unit area, in pascals: 1 Pa = 1 N/m². Atmospheric pressure is about 1.0 × 10⁵ Pa.
    topic_code: "8.2"
  - front: Pressure → scalar or vector?
    back: |
      A scalar. It has no direction of its own; the force it produces on a surface points perpendicular to that surface, pushing on it.
    topic_code: "8.2"
  - front: Fluid at rest touching a wall → direction of the fluid's force on the wall
    back: |
      Perpendicular to the wall, pushing outward on it. A fluid at rest cannot exert a force along a surface (that would need friction or viscosity, and would make the fluid flow).
    topic_code: "8.2"
  - front: Same weight, smaller contact area → effect on pressure
    back: |
      Pressure goes up in inverse proportion: halve the area and the pressure doubles. That is why a knife edge cuts and snowshoes keep you on top of the snow.
    topic_code: "8.2"
  - front: 60 kg person standing on a 1.0 cm² heel → pressure on the floor
    back: |
      F = mg = 588 N, A = 1.0 × 10⁻⁴ m², so P = 588/1.0 × 10⁻⁴ ≈ 5.9 × 10⁶ Pa, about 59 times atmospheric pressure.
    topic_code: "8.2"
  - front: Square centimetres to square metres → conversion
    back: |
      1 cm² = (10⁻² m)² = 10⁻⁴ m². Squaring the factor is the step most often missed.
    topic_code: "8.2"
  - front: Pressure at depth h in a liquid open to the air → formula
    back: |
      P = P₀ + ρgh, where P₀ is the pressure at the surface (atmospheric for an open container), ρ the liquid's density and h the depth below the surface.
    topic_code: "8.2"
  - front: Column of liquid of cross-section A and height h → free-body derivation of P = P₀ + ρgh
    back: |
      Forces on the column: P₀A down on its top, its weight ρAhg down, PA up on its bottom. At rest, PA = P₀A + ρAhg, so P = P₀ + ρgh.
    topic_code: "8.2"
  - front: Gauge pressure → definition
    back: |
      Pressure above atmospheric: P_gauge = P − P₀. In a liquid open to the air, P_gauge = ρgh. A tyre gauge reads gauge pressure.
    topic_code: "8.2"
  - front: Absolute pressure → definition
    back: |
      The total pressure, including the atmosphere's: P = P₀ + P_gauge. It is never negative; gauge pressure can be (inside a straw while you sip).
    topic_code: "8.2"
  - front: Fresh water, depth for one extra atmosphere → value
    back: |
      ρgh = 1.0 × 10⁵ Pa gives h = 1.0 × 10⁵/(1000 × 9.8) ≈ 10.2 m. Every 10 m of water adds about one atmosphere.
    topic_code: "8.2"
  - front: Diver 15 m below the surface of sea water (1025 kg/m³) → absolute pressure
    back: |
      P = 1.0 × 10⁵ + 1025 × 9.8 × 15 ≈ 1.0 × 10⁵ + 1.51 × 10⁵ ≈ 2.5 × 10⁵ Pa, about two and a half atmospheres.
    topic_code: "8.2"
  - front: Gauge pressure, depth doubled → change
    back: |
      It doubles, because ρgh is proportional to h. The absolute pressure increases but does not double, because P₀ stays the same.
    topic_code: "8.2"
  - front: Vases of different shapes filled to the same depth → pressure at the bottom
    back: |
      The same in all of them. P = P₀ + ρgh depends only on the depth below the surface, not on the amount of liquid or the shape of the container.
    topic_code: "8.2"
  - front: Two points at the same depth in one connected body of still liquid → pressures
    back: |
      Equal. Any difference would push the liquid sideways and it would not be at rest. This is the rule behind U-tubes and water levels finding the same height.
    topic_code: "8.2"
  - front: Pascal's principle → statement
    back: |
      A change in pressure applied to an enclosed incompressible fluid is transmitted undiminished to every part of the fluid and to the walls of its container.
    topic_code: "8.2"
  - front: Hydraulic lift (pistons at equal height) → force relation
    back: |
      Equal pressure on both pistons: F₁/A₁ = F₂/A₂, so F₂ = F₁(A₂/A₁). A small force on the small piston supports a large load on the large piston.
    topic_code: "8.2"
  - front: Hydraulic lift with piston radii 2.0 cm and 15 cm, 1500 kg car → input force
    back: |
      F₁ = mg(r₁/r₂)² = 14 700 N × (2.0/15)² ≈ 260 N. The area ratio is the square of the radius ratio.
    topic_code: "8.2"
  - front: Hydraulic lift → why it does not create energy
    back: |
      The liquid's volume is fixed, so A₁d₁ = A₂d₂: the small piston moves farther by the same factor that the force is smaller. Work in, F₁d₁, equals work out, F₂d₂.
    topic_code: "8.2"
  - front: Open U-tube with water in one arm and oil on top in the other → balance condition
    back: |
      Pressures are equal at the level of the oil–water interface: ρ_oil g h_oil = ρ_water g h_water, so the less dense oil column stands taller.
    topic_code: "8.2"
  - front: Drinking straw → what pushes the drink up
    back: |
      Atmospheric pressure on the drink's open surface. Sucking lowers the pressure inside the straw, and the higher outside pressure pushes the liquid up until ρgh makes up the difference.
    topic_code: "8.2"
  - front: Longest possible straw for water, perfect vacuum at the top → height
    back: |
      ρgh = P₀ gives h = 1.0 × 10⁵/(1000 × 9.8) ≈ 10 m. No suction pump can lift water higher than this from above.
    topic_code: "8.2"
  - front: Pressure sensor lowered into a liquid, absolute P plotted against depth → slope and intercept
    back: |
      A straight line: slope ρg (so ρ = slope/g) and intercept P₀, the pressure at the surface. A denser liquid gives a steeper line with the same intercept.
    topic_code: "8.2"
  - front: Force from pressure on a flat surface with fluid on both sides → net force
    back: |
      F_net = (P_inside − P_outside)A. Only the pressure difference produces a net force, which is why a window 10 m underwater with air at 1 atm inside feels the gauge pressure.
    topic_code: "8.2"
  - front: Submarine hatch of area 0.50 m², 80 m down, 1 atm inside → net force from the water
    back: |
      F = ρghA = 1000 × 9.8 × 80 × 0.50 ≈ 3.9 × 10⁵ N, the weight of about 40 tonnes.
    topic_code: "8.2"
  - front: Dam wall → why it is thickest at the bottom
    back: |
      Pressure grows linearly with depth, so each strip of wall near the bottom feels a much larger force than a strip near the top.
    topic_code: "8.2"
  - front: Pascal and kilopascal → everyday scale
    back: |
      A sheet of paper lying on a desk exerts about 1 Pa. A car tyre's gauge pressure is about 200–250 kPa. The atmosphere is about 100 kPa.
    topic_code: "8.2"
  - front: Error-spot → "pressure at the bottom of a wide pool 2 m deep is larger than at the bottom of a narrow tube 2 m deep, because the pool holds more water"
    back: |
      Pressure depends only on depth (and ρ, g, P₀). The pool's extra water is supported by its wide floor, so the force is larger but the pressure is the same.
    topic_code: "8.2"
  - front: Error-spot → "the gauge pressure 20 m underwater is 1.0 × 10⁵ + 1000 × 9.8 × 20 Pa"
    back: |
      That is the absolute pressure. Gauge pressure leaves out the atmosphere: ρgh = 1000 × 9.8 × 20 ≈ 2.0 × 10⁵ Pa.
    topic_code: "8.2"
  - front: Error-spot → "with radii 2 cm and 10 cm, a hydraulic lift multiplies force by 5"
    back: |
      Force multiplies by the area ratio, (10/2)² = 25, not the radius ratio. The small piston must also travel 25 times as far as the large one.
    topic_code: "8.2"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topic 8.2: pressure as force per area, pressure
    with depth, absolute and gauge pressure, container shapes, Pascal's principle and hydraulic lifts, and
    U-tubes), with 7 questions (30%) reviewing earlier weeks (density, simple harmonic motion, conservation
    of momentum, rotational equilibrium, orbiting satellites and power). Opens with a shared-context set on a
    lab group's pressure-sensor readings in a column of water. Multiple choice, select-all, true/false and
    numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers
    and the long answer are graded by your teacher against the scoring notes. Calculator and equation sheet
    allowed throughout.
  questions:
    # ---- Stimulus set: pressure sensor in a column of water (8.2)
    - slug: apphys1-u08-w30-q01
      type: multiple_choice
      topic_code: "8.2"
      source: "AP Physics 1 CED, Topic 8.2"
      points: 1
      stimulus: |
        A lab group lowers the probe of an absolute pressure sensor into a tall, clear tube of tap water open to the air. They record the reading at several depths below the water surface (invented data):

        | Depth below surface (m) | 0.00 | 0.10 | 0.20 | 0.30 | 0.40 | 0.50 |
        |---|---|---|---|---|---|---|
        | Absolute pressure (kPa) | 100.9 | 101.8 | 102.9 | 103.8 | 104.9 | 105.8 |

        They plot absolute pressure (vertical axis) against depth (horizontal axis) and draw a best-fit straight line.
      prompt: |
        What physical quantity does the slope of the best-fit line represent?
      options:
        - "The atmospheric pressure at the water's surface"
        - "The product ρg of the water's density and the gravitational field strength"
        - "The density ρ of the water, with no other factor"
        - "The gravitational field strength g, with no other factor"
      option_explanations:
        - |
          The atmospheric pressure is the vertical intercept (the reading at zero depth), not the slope.
        - |
          Correct. P = P₀ + ρgh is a straight line in h with slope ρg. Here the slope is about 9.8 kPa/m = 9800 Pa/m.
        - |
          The slope has units of Pa/m, which is ρg, not ρ (kg/m³). You must divide the slope by g to get the density.
        - |
          The slope also depends on the liquid; a denser liquid gives a steeper line in the same gravitational field. It is ρg.
      answer: 1
    - slug: apphys1-u08-w30-q02
      type: multiple_choice
      topic_code: "8.2"
      source: "AP Physics 1 CED, Topic 8.2"
      points: 1
      stimulus: |
        A lab group lowers the probe of an absolute pressure sensor into a tall, clear tube of tap water open to the air. They record the reading at several depths below the water surface (invented data):

        | Depth below surface (m) | 0.00 | 0.10 | 0.20 | 0.30 | 0.40 | 0.50 |
        |---|---|---|---|---|---|---|
        | Absolute pressure (kPa) | 100.9 | 101.8 | 102.9 | 103.8 | 104.9 | 105.8 |

        They plot absolute pressure (vertical axis) against depth (horizontal axis) and draw a best-fit straight line.
      prompt: |
        The line's vertical intercept is about 100.9 kPa. What does this value represent?
      options:
        - "The gauge pressure at the water's surface"
        - "The pressure due to the weight of the water in the tube"
        - "A calibration error, since the pressure at zero depth should be zero"
        - "The pressure of the atmosphere pushing on the water's surface"
      option_explanations:
        - |
          Gauge pressure is measured relative to the atmosphere, so the gauge pressure at the open surface is zero, not 100.9 kPa.
        - |
          At zero depth there is no water above the probe, so the water's weight contributes nothing there; the water's contribution is ρgh, the rise above the intercept.
        - |
          An absolute sensor at an open surface reads the air's pressure, not zero; zero absolute pressure would mean a vacuum.
        - |
          Correct. At h = 0 the equation P = P₀ + ρgh gives P = P₀, the atmospheric pressure on the open surface, about 1.0 × 10⁵ Pa.
      answer: 3
    - slug: apphys1-u08-w30-q03
      type: numeric
      topic_code: "8.2"
      source: "AP Physics 1 CED, Topic 8.2"
      points: 1
      stimulus: |
        A lab group lowers the probe of an absolute pressure sensor into a tall, clear tube of tap water open to the air. They record the reading at several depths below the water surface (invented data):

        | Depth below surface (m) | 0.00 | 0.10 | 0.20 | 0.30 | 0.40 | 0.50 |
        |---|---|---|---|---|---|---|
        | Absolute pressure (kPa) | 100.9 | 101.8 | 102.9 | 103.8 | 104.9 | 105.8 |

        They plot absolute pressure (vertical axis) against depth (horizontal axis) and draw a best-fit straight line.
      prompt: |
        Use the slope of the line to calculate the density of the water. Give your answer in kg/m³, to two significant figures.
      answer: { value: 1000, tolerance: 30 }
      explanation: |
        Slope ≈ (105.8 − 100.9) kPa/(0.50 − 0.00) m = 9.8 kPa/m = 9800 Pa/m (a least-squares fit gives 9.9 kPa/m). Since slope = ρg, ρ = 9800/9.8 ≈ 1.0 × 10³ kg/m³. Answers from 970 to 1030 kg/m³ are accepted. Forgetting to convert kPa to Pa gives 1.0 kg/m³.
    - slug: apphys1-u08-w30-q04
      type: multiple_choice
      topic_code: "8.2"
      source: "AP Physics 1 CED, Topic 8.2"
      points: 1
      stimulus: |
        A lab group lowers the probe of an absolute pressure sensor into a tall, clear tube of tap water open to the air. They record the reading at several depths below the water surface (invented data):

        | Depth below surface (m) | 0.00 | 0.10 | 0.20 | 0.30 | 0.40 | 0.50 |
        |---|---|---|---|---|---|---|
        | Absolute pressure (kPa) | 100.9 | 101.8 | 102.9 | 103.8 | 104.9 | 105.8 |

        They plot absolute pressure (vertical axis) against depth (horizontal axis) and draw a best-fit straight line.
      prompt: |
        The group repeats the experiment on the same day with salt water of density 1100 kg/m³. How does the new graph compare with the first?
      options:
        - "Same slope; higher intercept"
        - "Same slope and same intercept, because pressure depends only on depth"
        - "Steeper slope; same intercept"
        - "Shallower slope; same intercept"
      option_explanations:
        - |
          The intercept is the atmospheric pressure, which the salt does not change; it is the slope, ρg, that depends on the liquid.
        - |
          Pressure depends on depth and on the liquid's density; at a given depth the denser salt water gives a larger ρgh.
        - |
          Correct. The slope ρg grows by the factor 1100/1000 (to about 10.8 kPa/m), while the intercept is still the same day's atmospheric pressure.
        - |
          A denser liquid has more weight above each square metre at a given depth, so pressure rises faster with depth, not slower.
      answer: 2
    # ---- Pressure (8.2)
    - slug: apphys1-u08-w30-q05
      type: multiple_choice
      topic_code: "8.2"
      source: "AP Physics 1 CED, Topic 8.2"
      points: 1
      prompt: |
        A 60 kg dancer balances on the heel of one shoe. The heel's contact area with the floor is 1.0 cm². What pressure does the heel exert on the floor?
      options:
        - "About 5.9 × 10⁶ Pa"
        - "About 6.0 × 10⁵ Pa"
        - "About 5.9 × 10⁴ Pa"
        - "About 590 Pa"
      option_explanations:
        - |
          Correct. F = mg = 60 × 9.8 = 588 N; A = 1.0 cm² = 1.0 × 10⁻⁴ m²; P = F/A ≈ 5.9 × 10⁶ Pa.
        - |
          This divides the mass (60 kg) by the area instead of the weight; pressure is force per area, so multiply by g first.
        - |
          This converts 1.0 cm² to 1.0 × 10⁻² m², forgetting to square the factor of 10⁻² for an area.
        - |
          This uses 1.0 m² for the area, skipping the conversion from square centimetres entirely.
      answer: 0
    - slug: apphys1-u08-w30-q06
      type: multiple_choice
      topic_code: "8.2"
      source: "AP Physics 1 CED, Topic 8.2"
      points: 1
      prompt: |
        Three open containers stand on a table: a narrow cylinder, a wide bowl, and a cone that widens toward the top. Each is filled with water to a depth of 0.30 m. How do the pressures at the bottom of the three containers compare?
      options:
        - "Greatest in the wide bowl, because it holds the most water"
        - "Greatest in the narrow cylinder, because its weight is spread over the smallest area"
        - "Greatest in the cone, because the water above leans inward on the bottom"
        - "Equal in all three"
      option_explanations:
        - |
          More water means a larger total force on the larger floor, but pressure is force per area and depends only on depth.
        - |
          Pressure at the bottom is P₀ + ρgh for every container; narrowing the container reduces both the weight above and the area.
        - |
          The slanted walls push on the water and carry part of its weight; the pressure at the bottom is still P₀ + ρgh.
        - |
          Correct. P = P₀ + ρgh depends only on the depth below the open surface (0.30 m in each), not on the container's shape or the amount of water.
      answer: 3
    - slug: apphys1-u08-w30-q07
      type: multiple_choice
      topic_code: "8.2"
      source: "AP Physics 1 CED, Topic 8.2"
      points: 1
      prompt: |
        A swimmer dives to a depth of 12 m in a freshwater lake. Atmospheric pressure is 1.0 × 10⁵ Pa. What is the absolute pressure on the swimmer?
      options:
        - "About 1.2 × 10⁵ Pa"
        - "About 2.2 × 10⁵ Pa"
        - "About 1.0 × 10⁵ Pa"
        - "About 1.2 × 10⁶ Pa"
      option_explanations:
        - |
          This is the gauge pressure ρgh alone; the absolute pressure also includes the atmosphere pushing on the lake's surface.
        - |
          Correct. P = P₀ + ρgh = 1.0 × 10⁵ + 1000 × 9.8 × 12 ≈ 1.0 × 10⁵ + 1.18 × 10⁵ ≈ 2.2 × 10⁵ Pa.
        - |
          This ignores the water above the swimmer; pressure increases with depth below the surface.
        - |
          This multiplies the atmospheric pressure by the depth; the two pressures add, and the water's part is ρgh.
      answer: 1
    - slug: apphys1-u08-w30-q08
      type: multiple_choice
      topic_code: "8.2"
      source: "AP Physics 1 CED, Topic 8.2"
      points: 1
      prompt: |
        In a garage lift, oil connects a small piston of radius 2.0 cm to a large piston of radius 15 cm at the same height. A 1500 kg car sits on the large piston. Ignoring the pistons' masses and friction, what force on the small piston holds the car at rest?
      options:
        - "About 2.0 × 10³ N"
        - "About 27 N"
        - "About 260 N"
        - "About 8.3 × 10⁵ N"
      option_explanations:
        - |
          This scales the weight by the radius ratio, 2.0/15. Pressure is force per area, and area goes as the square of the radius.
        - |
          This uses the car's mass (1500 kg) in place of its weight (1500 × 9.8 N).
        - |
          Correct. Equal pressures: F₁/A₁ = F₂/A₂, so F₁ = mg(r₁/r₂)² = 14 700 N × (2.0/15)² ≈ 260 N.
        - |
          This inverts the area ratio; the small piston needs a smaller force than the car's weight, not a larger one.
      answer: 2
    # ---- Spiral review (8.1, 7.1, 4.3)
    - slug: apphys1-u08-w30-q09
      type: multiple_choice
      topic_code: "8.1"
      source: "AP Physics 1 CED, Topic 8.1"
      points: 1
      prompt: |
        A ring has a mass of 9.65 g. When it is lowered into a narrow graduated cylinder of water, the level rises by 0.50 mL. What is the ring's density, and what does it suggest? (Gold is 19 300 kg/m³; brass about 8500 kg/m³.)
      options:
        - "19 300 kg/m³, consistent with gold"
        - "4.8 kg/m³, far less dense than water"
        - "8500 kg/m³, consistent with brass"
        - "19.3 kg/m³, consistent with no metal"
      option_explanations:
        - |
          Correct. ρ = m/V = 9.65 g/0.50 cm³ = 19.3 g/cm³ = 19 300 kg/m³, matching gold.
        - |
          This multiplies mass by volume (9.65 × 0.50) instead of dividing.
        - |
          The brass value is not supported by the data; 9.65/0.50 is 19.3 g/cm³, more than twice brass's density.
        - |
          The ratio 19.3 is in g/cm³; converting to kg/m³ requires multiplying by 1000.
      answer: 0
    - slug: apphys1-u08-w30-q10
      type: multiple_choice
      topic_code: "7.1"
      source: "AP Physics 1 CED, Topic 7.1"
      points: 1
      prompt: |
        Which condition must the net force on an object satisfy for its motion to be simple harmonic?
      options:
        - "The net force is constant and points toward the equilibrium position."
        - "The net force is zero at the turning points of the motion."
        - "The net force points in the direction of the object's velocity."
        - "The net force is proportional to the displacement from equilibrium and directed toward equilibrium."
      option_explanations:
        - |
          A constant force gives constant acceleration; SHM needs a force that grows with displacement and vanishes at equilibrium.
        - |
          The net force is largest at the turning points, where the displacement is largest; it is zero at equilibrium.
        - |
          The restoring force points toward equilibrium, which is opposite the velocity during half of each cycle.
        - |
          Correct. SHM requires a linear restoring force, F = −kx: proportional to displacement and opposite to it.
      answer: 3
    - slug: apphys1-u08-w30-q11
      type: multiple_choice
      topic_code: "4.3"
      source: "AP Physics 1 CED, Topic 4.3"
      points: 1
      prompt: |
        A 2.0 kg cart and a 3.0 kg cart are at rest on a level, frictionless track with a compressed spring between them. When the spring is released, the 3.0 kg cart moves left at 2.0 m/s. What is the velocity of the 2.0 kg cart?
      options:
        - "2.0 m/s to the right"
        - "3.0 m/s to the right"
        - "1.3 m/s to the right"
        - "3.0 m/s to the left"
      option_explanations:
        - |
          Equal speeds would mean equal masses; the total momentum is zero, so the lighter cart must move faster.
        - |
          Correct. The total momentum stays zero: 2.0v + 3.0(−2.0) = 0, so v = +3.0 m/s, that is, 3.0 m/s to the right.
        - |
          This multiplies by 2.0/3.0 instead of 3.0/2.0; the lighter cart moves faster, not slower.
        - |
          The momenta must cancel, so the carts move in opposite directions; both moving left would give a nonzero total momentum.
      answer: 1
    # ---- Mixed formats
    - slug: apphys1-u08-w30-q12
      type: multi_select
      topic_code: "8.2"
      source: "AP Physics 1 CED, Topic 8.2"
      points: 2
      partial_credit: true
      prompt: |
        A rain barrel open to the air holds water 0.80 m deep. Which changes would increase the absolute pressure at the bottom of the barrel? Select all that apply.
      options:
        - "Adding water until it is 1.0 m deep"
        - "Replacing the barrel with a wider one holding the same depth of water"
        - "Replacing the water with the same depth of a denser liquid"
        - "A rise in atmospheric pressure as a storm passes"
        - "Moving the same volume of water into a narrower, taller barrel"
      option_explanations:
        - |
          Correct. Greater depth h means a larger ρgh.
        - |
          At the same depth the pressure P₀ + ρgh is the same; a wider barrel spreads more weight over more area.
        - |
          Correct. A larger ρ gives a larger ρgh at the same depth.
        - |
          Correct. The absolute pressure includes P₀, and an enclosed or open liquid passes any change in P₀ to every depth.
        - |
          Correct. The same volume in a narrower barrel stands deeper, so h, and with it ρgh, increases.
      answer: [0, 2, 3, 4]
    - slug: apphys1-u08-w30-q13
      type: multi_select
      topic_code: "5.5"
      source: "AP Physics 1 CED, Topic 5.5"
      points: 2
      partial_credit: true
      prompt: |
        A uniform metre stick of mass 0.20 kg balances on a pivot at its 50 cm mark. A 0.10 kg mass hangs at the 20 cm mark, and a 0.15 kg mass hangs at a position chosen so that the stick stays horizontal and at rest. Which statements are true? Select all that apply.
      options:
        - "The 0.15 kg mass hangs at the 70 cm mark."
        - "The upward force from the pivot is about 2.5 N."
        - "The net torque on the stick about its 0 cm end is zero."
        - "The 0.15 kg mass hangs at the 80 cm mark."
        - "The upward force from the pivot is about 4.4 N."
      option_explanations:
        - |
          Correct. Torques about the pivot balance: 0.10 × 9.8 × 0.30 = 0.15 × 9.8 × d, so d = 0.20 m, at the 70 cm mark. The stick's own weight acts at the pivot and has no torque about it.
        - |
          This adds only the two hanging masses (0.25 kg × 9.8); the pivot also supports the stick's own 0.20 kg.
        - |
