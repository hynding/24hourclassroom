        A slow, smooth stream of water falls from a kitchen faucet. Just below the faucet the stream is 1.2 cm wide; 10 cm lower it is noticeably narrower. (a) Explain why the water's speed increases as it falls. (b) Use a conservation law to explain why the stream narrows. (c) If the water's speed has doubled at some point below the faucet, predict the stream's diameter there.
      answer: |
        (a) Once it leaves the faucet the water is in free fall (the pressure around it is atmospheric everywhere), so gravity accelerates it downward and it gains kinetic energy as it loses gravitational potential energy.
