# The AP Physics 1: Algebra-Based course map (the revised course, effective
# fall 2024, with the 2026-27 clarifications). Week files live under
# unit-NN-<slug>/week-NN.yaml. Titles and slugs are composed by
# Database\Seeders\Curriculum\Course from the numbers here, so nothing in a
# week file repeats the naming convention.
title: "AP Physics 1: Algebra-Based"
# Every title starts with `prefix`; every test, material and the course row
# itself carry a slug that starts with `slug`.
prefix: AP Physics 1
slug: apphys1
# The course's site-wide address, /courses/ap-physics-1 (App\Support\Slugs).
site_slug: ap-physics-1
# The course page's introduction. Folded (`>`): one paragraph, not hard line breaks.
description: >
  A full school year of AP Physics 1: Algebra-Based, one week at a time: a
  study guide, a flashcard deck and a quiz every week, a summary sheet and an
  exam at the end of each of the eight units (kinematics; force and
  translational dynamics; work, energy and power; linear momentum; torque and
  rotational dynamics; energy and momentum of rotating systems; oscillations;
  and fluids), and an exam-prep guide with a 70-question practice final whose
  first questions follow the May 2027 AP Physics 1 exam format (42 multiple
  choice, then the four free-response question types). Original material
  written around the College Board AP Physics 1: Algebra-Based Course and Exam
  Description, with original worked examples, invented lab data, questions
  and cards.
  Free to copy, adapt and share under CC BY 4.0, crediting 24 Hour
  Classroom.
teacher: { name: "AP Physics 1 Teacher", email: apphys1@example.com }
student: { name: "AP Physics 1 Student", email: apphys1-student@example.com }
# Monday of week 1. Null means no due dates: the whole course is open at once.
# The AP exam is Wednesday 2027-05-05, session 2 (College Board AP Central);
# weeks 33-34 review.
start_date: 2026-08-31
exam_date: 2027-05-05
subject: science
grade_level: "9-12"
review:
  prep_guide_week: 33
  practice_exam_week: 34
  prep_guide_description: The May 2027 AP Physics 1 exam format (hybrid digital, 42 multiple-choice questions in 85 minutes, then four free-response questions in 95 minutes answered on paper, calculators and the equation sheet allowed), how the practice final maps onto it, the four free-response question types (mathematical routines, translation between representations, experimental design and analysis, qualitative/quantitative translation) and how each is scored, the models and representations to know cold, and a two-week review plan.
# Every guide and summary must end with all of these (the content lint).
attribution_markers: ["AP Physics 1: Algebra-Based Course and Exam Description", "CC BY 4.0"]
attribution: |
  Original study material written for this course and organised around the
  College Board AP Physics 1: Algebra-Based Course and Exam Description
  (effective fall 2024). Every explanation, worked example, data set,
  flashcard and question was written for this course; all lab data are
  invented. © 2026 24 Hour Classroom, licensed under CC BY 4.0
  (https://creativecommons.org/licenses/by/4.0/).
# The three science practices, by their CED numbers; guides tag topics with them.
practices:
  "1": Creating Representations
  "2": Mathematical Routines
  "3": Scientific Questioning and Argumentation
# The eight units and 43 topics (CED, effective fall 2024). Weights are the
# CED's multiple-choice exam weightings.
units:
  - number: 1
    slug: unit-01-kinematics
    title: Kinematics
    weight: "10–15%"
    weeks: [1, 2, 3, 4]
    topics:
      "1.1": Scalars and Vectors in One Dimension
      "1.2": Displacement, Velocity, and Acceleration
      "1.3": Representing Motion
      "1.4": Reference Frames and Relative Motion
      "1.5": Vectors and Motion in Two Dimensions
  - number: 2
    slug: unit-02-force-and-translational-dynamics
    title: Force and Translational Dynamics
    weight: "18–23%"
    weeks: [5, 6, 7, 8, 9, 10, 11]
    topics:
      "2.1": Systems and Center of Mass
      "2.2": Forces and Free-Body Diagrams
      "2.3": Newton's Third Law
      "2.4": Newton's First Law
      "2.5": Newton's Second Law
      "2.6": Gravitational Force
      "2.7": Kinetic and Static Friction
      "2.8": Spring Forces
      "2.9": Circular Motion
  - number: 3
    slug: unit-03-work-energy-and-power
    title: Work, Energy, and Power
    weight: "18–23%"
    weeks: [12, 13, 14, 15]
    topics:
      "3.1": Translational Kinetic Energy
      "3.2": Work
      "3.3": Potential Energy
      "3.4": Conservation of Energy
      "3.5": Power
  - number: 4
    slug: unit-04-linear-momentum
    title: Linear Momentum
    weight: "10–15%"
    weeks: [16, 17, 18]
    topics:
      "4.1": Linear Momentum
      "4.2": Change in Momentum and Impulse
      "4.3": Conservation of Linear Momentum
      "4.4": Elastic and Inelastic Collisions
  - number: 5
    slug: unit-05-torque-and-rotational-dynamics
    title: Torque and Rotational Dynamics
    weight: "10–15%"
    weeks: [19, 20, 21, 22, 23]
    topics:
      "5.1": Rotational Kinematics
      "5.2": Connecting Linear and Rotational Motion
      "5.3": Torque
      "5.4": Rotational Inertia
      "5.5": Rotational Equilibrium and Newton's First Law in Rotational Form
      "5.6": Newton's Second Law in Rotational Form
  - number: 6
    slug: unit-06-energy-and-momentum-of-rotating-systems
    title: Energy and Momentum of Rotating Systems
    weight: "5–8%"
    weeks: [24, 25, 26]
    topics:
      "6.1": Rotational Kinetic Energy
      "6.2": Torque and Work
      "6.3": Angular Momentum and Angular Impulse
      "6.4": Conservation of Angular Momentum
      "6.5": Rolling
      "6.6": Motion of Orbiting Satellites
  - number: 7
    slug: unit-07-oscillations
    title: Oscillations
    weight: "5–8%"
    weeks: [27, 28]
    topics:
      "7.1": Defining Simple Harmonic Motion (SHM)
      "7.2": Frequency and Period of SHM
      "7.3": Representing and Analyzing SHM
      "7.4": Energy of Simple Harmonic Oscillators
  - number: 8
    slug: unit-08-fluids
    title: Fluids
    weight: "10–15%"
    weeks: [29, 30, 31, 32]
    topics:
      "8.1": Internal Structure and Density
      "8.2": Pressure
      "8.3": Fluids and Newton's Laws
      "8.4": Fluids and Conservation Laws
