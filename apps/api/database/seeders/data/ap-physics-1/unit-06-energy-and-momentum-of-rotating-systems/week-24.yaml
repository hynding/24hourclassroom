        True or false: A bicycle wheel on a repair stand turns through 10 rad while two torques act on it, one from a hand and one from friction, and the net torque on it is zero the whole time. The wheel's rotational kinetic energy does not change.
      answer: true
      explanation: |
        True. By the rotational work–energy theorem, the net work τ_net Δθ equals ΔK. With τ_net = 0, the hand's positive work and friction's negative work cancel, so ΔK = 0 and the wheel keeps a constant angular speed.
