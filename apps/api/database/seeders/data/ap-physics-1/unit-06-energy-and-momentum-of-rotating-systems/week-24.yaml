      prompt: |
        Translation between representations. A block of mass m hangs from a light string wound around a pulley of radius R and rotational inertia I about its fixed, frictionless axle. The block is released from rest and falls a height h; the string does not slip on the pulley.

        (A) Make an energy bar chart, as a table, for the system of block, pulley and Earth at two states: just after release and after the block has fallen h. Include rows for the block–Earth gravitational potential energy, the block's translational kinetic energy, the pulley's rotational kinetic energy and any energy transferred into or out of the system. Use "large", "medium", "small" or "zero" for relative sizes.

        (B) Starting from your bar chart, derive an expression for the block's speed v after it has fallen h, in terms of m, I, R, h and physical constants.

        (C) A lab group repeats the drop with a second pulley of the same radius but larger rotational inertia and finds the block's speed after the same drop is smaller. Is this consistent with your expression? Explain, and state what your expression predicts in the limit I → 0 and why that limit makes physical sense.
      answer: |
        (A)
        | Energy | Just after release | After falling h |
        |---|---|---|
        | U_g (block–Earth) | large | zero (reference) |
        | K_trans (block) | zero | medium |
        | K_rot (pulley) | zero | small to medium |
        | Transferred in or out | zero | zero |
        The final K_trans and K_rot bars together equal the initial U_g bar.
        (B) mgh = ½mv² + ½Iω², with ω = v/R: mgh = ½(m + I/R²)v², so v = √(2mgh/(m + I/R²)).
        (C) Yes. I appears in the denominator, so a larger I (same R) gives a smaller v: more of the energy goes into spinning the pulley. As I → 0, v → √(2gh), the free-fall speed, which makes sense because a pulley with no rotational inertia stores no energy and all of mgh goes to the block.
