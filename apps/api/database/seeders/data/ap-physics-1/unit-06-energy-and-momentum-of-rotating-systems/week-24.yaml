        (B) 2 points: 1 for a conservation equation with both kinetic-energy terms, consistent with the chart; 1 for using ω = v/R (no slipping) and solving to v = √(2mgh/(m + I/R²)) or an equivalent form such as √(2mghR²/(mR² + I)).
        (C) 2 points: 1 for "consistent" with reasoning that I in the denominator makes v smaller (more energy to rotation); 1 for the limit v → √(2gh) with the physical reason (a massless or zero-inertia pulley takes no energy, so the block falls freely).
