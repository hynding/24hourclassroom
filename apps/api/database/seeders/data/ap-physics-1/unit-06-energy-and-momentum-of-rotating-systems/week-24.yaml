      prompt: |
        A lab group has two cylinders with the same mass and the same radius: one is a uniform solid cylinder and the other is a thin-walled hollow tube (all its mass at the radius). Each is mounted on its own frictionless axle along its central axis and spun up from rest to the same angular speed by a motor.

        (a) Which cylinder requires more work from the motor? Justify your claim using the distribution of mass, without numbers.
        (b) By what factor is that work larger? Show how you get the factor.
        (c) If the angular speed for both trials were halved, by what factor would the work on the hollow tube change?
      answer: |
        (a) The hollow tube. All of its mass is at the full radius, where each part moves fastest at a given ω, while much of the solid cylinder's mass is near the axis and moves slowly. More mass far from the axis means a larger rotational inertia and more kinetic energy at the same ω, and the motor's work equals that kinetic energy.
        (b) A factor of 2: W = ΔK = ½Iω², and I_tube/I_solid = MR² ÷ ½MR² = 2 at the same ω.
        (c) It becomes one quarter as large: K ∝ ω², and (½)² = ¼.
      explanation: |
        Three points, one per part. (a) the hollow tube, with reasoning that links mass farther from the axis to a larger rotational inertia (or faster-moving parts) and therefore more kinetic energy, and links work to the change in kinetic energy. A claim without the work–energy link earns no point. (b) factor 2 from the ratio of inertias MR² to ½MR². (c) one quarter (or "divided by 4"), from K ∝ ω².
