        A student watching a spinning bicycle wheel on a repair stand slow down under a brake pad says: "The brake pad does no work on the wheel, because the centre of the wheel never moves." Is the student correct? Write a claim, give the evidence, and explain your reasoning, including what happens to the wheel's kinetic energy.
      answer: |
        Claim: the student is wrong; the brake pad does negative work on the wheel. Evidence: the pad exerts a frictional force on the rim, tangent to it, at a distance R from the axle, so it exerts a torque that opposes the rotation, and the wheel turns through an angle while the pad acts. Reasoning: work on a rotating object is W = τΔθ; the wheel's centre staying put does not matter, because the rim, where the force acts, moves through an arc. The torque opposes the rotation, so the work is negative and the wheel's rotational kinetic energy decreases to zero. That energy is not destroyed: it becomes internal (thermal) energy of the pad and rim, which warm up.
