week: 24
unit: 6
title: "Rotational Kinetic Energy and Rotational Work"
topics: ["6.1", "6.2"]
guide: guides/week-24.md
guide_description: |
  Rotational kinetic energy K = ½Iω² (where it comes from, why mass far from the axis stores more energy, and
  how K depends on ω, M and R), rotational kinetic energy in energy bar charts and conservation-of-energy
  equations, work done by a constant torque W = τΔθ, and the rotational work–energy theorem. Worked examples:
  a potter's wheel spun up to twice its speed, a block falling from a massive pulley (with an energy bar chart
  and the massless-pulley limiting case), a student pushing a playground carousel through 3.0 rad, and a brake
  pad stopping a bicycle wheel on a repair stand.
flashcards_description: |
  31 cards on rotational kinetic energy and rotational work: K = ½Iω² and the inertias of common shapes,
  functional dependence on ω and R, energy bar charts with a spinning pulley, W = τΔθ in radians, positive and
  negative work by torques, forces that do no rotational work, and the rotational work–energy theorem.

flashcards:
  - front: Spinning rigid object about a fixed axis → kinetic energy formula
    back: |
      K = ½Iω², with I the rotational inertia about that axis (kg·m²) and ω the angular speed (rad/s).
    topic_code: "6.1"
  - front: Deriving ½Iω² from particles in a wheel → the key step
    back: |
      Each particle has v = rω, so ½mv² = ½(mr²)ω²; summing over particles gives ½(Σmr²)ω² = ½Iω².
    topic_code: "6.1"
  - front: Hoop vs solid disk, same M, R and ω → which stores more kinetic energy?
    back: |
      The hoop, twice as much: I_hoop = MR² while I_disk = ½MR², and K = ½Iω².
    topic_code: "6.1"
  - front: Flywheel's angular speed doubles → factor change in its kinetic energy
    back: |
      K ∝ ω², so K becomes 4 times as large.
    topic_code: "6.1"
  - front: Flywheel spun from ω to 2ω → work compared with spinning it from rest to ω
    back: |
      Three times as much: ½I(4ω² − ω²) = 3 × ½Iω².
    topic_code: "6.1"
  - front: Same mass and shape, radius doubled, same ω → change in rotational kinetic energy
    back: |
      I ∝ R², so I and K both become 4 times as large.
    topic_code: "6.1"
  - front: Potter's wheel, solid disk 12 kg, R = 0.18 m, ω = 6.0 rad/s → K
    back: |
      I = ½(12)(0.18)² = 0.194 kg·m²; K = ½(0.194)(6.0)² ≈ 3.5 J.
    topic_code: "6.1"
  - front: Uniform rod spun about one end vs about its centre → ratio of inertias (and of K at the same ω)
    back: |
      (1/3)ML² ÷ (1/12)ML² = 4, so at the same ω the end-spun rod has 4 times the kinetic energy.
    topic_code: "6.1"
  - front: Solid sphere about a diameter → rotational inertia
    back: |
      I = (2/5)MR², smaller than a disk's ½MR² because more of its mass lies near the axis.
    topic_code: "6.1"
  - front: Block hanging from a string on a massive pulley → energy stores in the final state
    back: |
      Translational K of the block (½mv²) and rotational K of the pulley (½Iω²), with v = Rω if the string does not slip; they come from the block–Earth U_g.
    topic_code: "6.1"
  - front: Block falls h from a uniform-disk pulley (mass M) → speed expression
    back: |
      mgh = ½(m + M/2)v², so v = √(2mgh/(m + M/2)).
    topic_code: "6.1"
  - front: Massive-pulley speed formula with M → 0 → limiting-case check
    back: |
      v → √(2gh), the free-fall speed: a massless pulley stores no energy.
    topic_code: "6.1"
  - front: 1.5 kg block falls 0.80 m from a 2.0 kg disk pulley → energy bar chart
    back: |
      Initial U_g = 11.8 J. Final: K_block = 7.1 J, K_pulley = 4.7 J, U_g = 0, nothing transferred out.
    topic_code: "6.1"
  - front: Same block and pulley mass, disk pulley swapped for a hoop pulley → effect on final block speed
    back: |
      Slower: the hoop's larger I stores more of the energy as rotation, leaving less for the block.
    topic_code: "6.1"
  - front: Error-spot → "a spinning wheel's kinetic energy is ½Mv² with v the rim speed"
    back: |
      Only the rim moves at that speed; inner parts move slower. Use ½Iω²; ½Mv_rim² is right only for a hoop.
    topic_code: "6.1"
  - front: Constant torque through an angular displacement → work formula
    back: |
      W = τΔθ, with τ in N·m and Δθ in radians, giving joules.
    topic_code: "6.2"
  - front: Tangential force on a rim through arc length s → why W = τΔθ
    back: |
      W = Fs = F(rΔθ) = (rF)Δθ = τΔθ.
    topic_code: "6.2"
  - front: Torque of 15 N·m through 2.0 revolutions → work
    back: |
      Δθ = 2.0 × 2π = 4π rad, so W = 15 × 4π ≈ 188 J.
    topic_code: "6.2"
  - front: Rotational work–energy theorem → statement
    back: |
      The net work done by external torques on a rigid object equals its change in rotational kinetic energy: τ_net Δθ = ½Iω_f² − ½Iω_i².
    topic_code: "6.2"
  - front: Torque opposite to the rotation (brake, axle friction) → sign of its work
    back: |
      Negative: it removes rotational kinetic energy, which becomes internal (thermal) energy.
    topic_code: "6.2"
  - front: Force whose line of action passes through the axis → rotational work done
    back: |
      Zero: its torque is zero, so W = τΔθ = 0 however far the object turns.
    topic_code: "6.2"
  - front: Large torque on a locked door that does not move → work done on the door
    back: |
      Zero, because Δθ = 0. A torque transfers energy only while the object turns.
    topic_code: "6.2"
  - front: Carousel I = 180 kg·m², 40 N tangential push at 1.5 m through 3.0 rad from rest → ω
    back: |
      τ = 60 N·m, W = 180 J = ½(180)ω², so ω ≈ 1.41 rad/s.
    topic_code: "6.2"
  - front: Hoop wheel 1.2 kg, R = 0.33 m at 20 rad/s, brake torque 0.65 N·m → turns before stopping
    back: |
      K = 26.1 J; Δθ = 26.1/0.65 ≈ 40.2 rad ≈ 6.4 revolutions.
    topic_code: "6.2"
  - front: Braked wheel spinning twice as fast, same brake torque → revolutions before stopping
    back: |
      4 times as many: the wheel carries 4 times the kinetic energy, and Δθ = K/τ.
    topic_code: "6.2"
  - front: Problem gives an angle or number of turns, not a time → which tool for a spinning object
    back: |
      The rotational work–energy theorem (τΔθ = ΔK) skips α and time; use τ = Iα with kinematics when time is given.
    topic_code: "6.2"
  - front: Work–energy theorem vs τ = Iα with ω² = ω₀² + 2αΔθ → why they always agree
    back: |
      Multiply τ = Iα by Δθ and use 2αΔθ = ω² − ω₀²: you get τΔθ = ½Iω² − ½Iω₀², the work–energy theorem.
    topic_code: "6.2"
  - front: String pulled a distance d off an axle with constant force F → work on the wheel
    back: |
      W = Fd (equal to τΔθ with τ = Fr and Δθ = d/r), whatever the axle radius.
    topic_code: "6.2"
  - front: Motor applies constant torque τ to a wheel turning at ω → rate of energy transfer
    back: |
      Power P = τω (the rotational form of P = Fv), in watts when τ is in N·m and ω in rad/s.
    topic_code: "6.2"
  - front: Error-spot → "W = τΔθ = (10 N·m)(3 rev) = 30 J"
    back: |
      Δθ must be in radians: 3 rev = 6π rad, so W = 10 × 6π ≈ 188 J.
    topic_code: "6.2"
  - front: Error-spot → "the axle pushes hard on the pulley, so the axle force does work on it"
    back: |
      The axle force acts at the axis, where nothing moves, and has no torque about the axis; it does no work.
    topic_code: "6.2"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 6.1 and 6.2: rotational kinetic energy, energy
    bar charts with a spinning pulley, work done by a torque and the rotational work–energy theorem), with 7
    questions (30%) reviewing earlier weeks (conservation of energy and power from weeks 14–15, and rotational
    kinematics, v = rω, rotational inertia, rotational equilibrium and τ_net = Iα from weeks 19–23). Opens with a
    shared-context set on a flywheel spun up by a string pulled off its axle. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short
    answers and the long answer are graded by your teacher against the scoring notes. Calculators and the
    equation sheet are allowed throughout, as on the AP exam.
  questions:
    # ---- Stimulus set: flywheel spun up by a string (6.1, 6.2)
    - slug: apphys1-u06-w24-q01
      type: multiple_choice
      topic_code: "6.2"
      source: "AP Physics 1 CED, Topic 6.2"
      points: 1
      stimulus: |
        A lab group mounts a flywheel on a low-friction axle. Its rotational inertia about the axle is 0.040 kg·m². A light string is wound around the axle's hub, which has radius 0.020 m. Starting with the flywheel at rest, a student pulls the free end of the string with a constant force of 8.0 N, tangent to the hub, until 0.60 m of string has come off. Treat friction as negligible.
      prompt: |
        How much work does the string do on the flywheel?
      options:
        - "0.16 J"
        - "4.8 J"
        - "0.096 J"
        - "240 J"
      option_explanations:
        - |
          0.16 is the torque in N·m (8.0 N × 0.020 m), not the work; a torque must act through an angle to do work.
        - |
          Correct. The hub turns through Δθ = 0.60 m ÷ 0.020 m = 30 rad, and W = τΔθ = (0.16 N·m)(30 rad) = 4.8 J, the same as F × d = (8.0 N)(0.60 m).
        - |
          0.096 multiplies the torque by the string length in metres; W = τΔθ needs the angle in radians (30 rad), not a length.
        - |
          240 multiplies the force by the angle in radians; force must be multiplied by a distance, or torque by an angle.
      answer: 1
    - slug: apphys1-u06-w24-q02
      type: multiple_choice
      topic_code: "6.1"
      source: "AP Physics 1 CED, Topic 6.1"
      points: 1
      stimulus: |
        A lab group mounts a flywheel on a low-friction axle. Its rotational inertia about the axle is 0.040 kg·m². A light string is wound around the axle's hub, which has radius 0.020 m. Starting with the flywheel at rest, a student pulls the free end of the string with a constant force of 8.0 N, tangent to the hub, until 0.60 m of string has come off. Treat friction as negligible.
      prompt: |
        What is the flywheel's angular speed when the string comes off?
      options:
        - "2.2 rad/s"
        - "11 rad/s"
        - "15 rad/s"
        - "120 rad/s"
      option_explanations:
        - |
          2.2 rad/s uses τ × d = 0.096 J as the work; the work is τΔθ = 4.8 J with Δθ in radians.
        - |
          11 rad/s comes from setting W = Iω², dropping the ½ in the kinetic energy.
        - |
          Correct. All 4.8 J of work becomes rotational kinetic energy: ½(0.040 kg·m²)ω² = 4.8 J, so ω = √240 ≈ 15 rad/s (15.5).
        - |
          120 rad/s comes from W = Iω, which is not an energy; K = ½Iω² needs the square and the ½.
      answer: 2
    - slug: apphys1-u06-w24-q03
      type: multiple_choice
      topic_code: "6.2"
      source: "AP Physics 1 CED, Topic 6.2"
      points: 1
      stimulus: |
        A lab group mounts a flywheel on a low-friction axle. Its rotational inertia about the axle is 0.040 kg·m². A light string is wound around the axle's hub, which has radius 0.020 m. Starting with the flywheel at rest, a student pulls the free end of the string with a constant force of 8.0 N, tangent to the hub, until 0.60 m of string has come off. Treat friction as negligible.
      prompt: |
        In a second trial the group winds the string around a wider hub of radius 0.040 m fixed to the same flywheel (the total rotational inertia is still 0.040 kg·m²). The student again pulls with 8.0 N until 0.60 m of string comes off. How does the final angular speed compare with the first trial?
      options:
        - "It is the same, because the work F × d = 4.8 J is unchanged."
        - "It is twice as large, because the torque is twice as large."
        - "It is four times as large, because the torque doubles and K depends on the square."
        - "It is half as large, because the hub turns through half as many radians."
      option_explanations:
        - |
          Correct. The torque doubles to 0.32 N·m but the angle halves to 15 rad, so W = τΔθ = 4.8 J again; the same kinetic energy with the same I gives the same ω.
        - |
          The torque does double, but the hub turns through only 15 rad instead of 30 rad, so the work, and therefore ω, is unchanged.
        - |
          This doubles the torque without halving the angle; the work stays 4.8 J, and even a doubled work would raise ω only by √2.
        - |
          The angle does halve, but the torque doubles; work depends on their product, which is unchanged.
      answer: 0
    # ---- Independent items
    - slug: apphys1-u06-w24-q04
      type: multiple_choice
      topic_code: "6.1"
      source: "AP Physics 1 CED, Topic 6.1"
      points: 1
      prompt: |
        A thin hoop and a uniform solid disk have the same mass and the same radius. Each spins about its central axis at the same angular speed. How does the hoop's kinetic energy compare with the disk's?
      options:
        - "They are equal, because the masses and angular speeds are equal."
        - "The hoop's is half the disk's, because the disk has more material near the axis."
        - "The hoop's is four times the disk's, because K depends on the square of the radius."
        - "The hoop's is twice the disk's, because its rotational inertia is twice as large."
      option_explanations:
        - |
          Equal mass and ω are not enough: K = ½Iω² depends on how the mass is distributed, and the shapes have different I.
        - |
          This reverses the effect: mass near the axis moves slowly and stores little energy, so the disk has the smaller K.
        - |
          The radii are equal, so there is no R² factor between them; only the shape factor (1 versus ½) differs.
        - |
          Correct. I_hoop = MR² and I_disk = ½MR², so at the same ω, K_hoop/K_disk = MR² ÷ ½MR² = 2.
      answer: 3
    - slug: apphys1-u06-w24-q05
      type: multiple_choice
      topic_code: "6.1"
      source: "AP Physics 1 CED, Topic 6.1"
      points: 1
      prompt: |
        A uniform rod of mass 0.50 kg and length 1.2 m spins in a horizontal plane about a vertical axle through one end at 4.0 rad/s. The rod's rotational inertia about its centre is (1/12)ML² and about one end is (1/3)ML². What is its rotational kinetic energy?
      options:
        - "0.48 J"
        - "1.9 J"
        - "3.8 J"
        - "5.8 J"
      option_explanations:
        - |
          0.48 J uses the inertia about the centre, (1/12)ML² = 0.060 kg·m², but this rod turns about its end.
        - |
          Correct. I = (1/3)(0.50 kg)(1.2 m)² = 0.24 kg·m², so K = ½(0.24)(4.0)² = 1.92 J ≈ 1.9 J.
        - |
          3.8 J is Iω² = 0.24 × 16, the kinetic energy without the ½.
        - |
          5.8 J treats the whole mass as moving at the tip speed (½ × 0.50 × 4.8²); most of the rod moves slower than its tip.
      answer: 1
    - slug: apphys1-u06-w24-q06
      type: multiple_choice
      topic_code: "6.1"
      source: "AP Physics 1 CED, Topic 6.1"
      points: 1
      prompt: |
        A ceiling fan is switched from its low setting to its high setting, which triples its angular speed. By what factor does the rotational kinetic energy of its blades change?
      options:
        - "3"
        - "√3"
        - "9"
        - "6"
      option_explanations:
        - |
          A factor of 3 treats K as proportional to ω; K = ½Iω² is proportional to ω².
        - |
          √3 inverts the relationship; it is ω that would rise by √3 if K tripled.
        - |
          Correct. I is unchanged and K ∝ ω², so tripling ω multiplies K by 3² = 9.
        - |
          6 doubles the factor 3 (as if from 2 × 3) instead of squaring it; the dependence is ω², giving 9.
      answer: 2
    - slug: apphys1-u06-w24-q07
      type: multiple_choice
      topic_code: "6.2"
      source: "AP Physics 1 CED, Topic 6.2"
      points: 1
      prompt: |
        A mechanic's torque wrench applies a constant 15 N·m torque to a stuck wheel nut as it turns through 2.0 complete revolutions. How much work does the wrench do on the nut?
      options:
        - "30 J"
        - "7.5 J"
        - "94 J"
        - "190 J"
      option_explanations:
        - |
          30 J multiplies the torque by the number of revolutions; Δθ must be in radians, 2.0 rev = 4π rad.
        - |
          7.5 J divides the torque by the revolutions; work is the product of torque and angle.
        - |
          94 J is the work for one revolution (15 × 2π); the nut turns two revolutions.
        - |
          Correct. Δθ = 2.0 × 2π = 12.6 rad, so W = τΔθ = (15 N·m)(12.6 rad) ≈ 188 J ≈ 190 J.
      answer: 3
    - slug: apphys1-u06-w24-q08
      type: multiple_choice
      topic_code: "6.1"
      source: "AP Physics 1 CED, Topic 6.1"
      points: 1
      prompt: |
        Two identical blocks hang from light strings wound around two pulleys that turn on frictionless axles. The pulleys have the same mass and the same radius, but one is a uniform solid disk and the other is a thin hoop. Both blocks are released from rest. Which block is moving faster after each has fallen the same distance?
      options:
        - "The block on the disk pulley, because the disk stores less rotational kinetic energy at a given speed, leaving more for the block."
        - "Both blocks move at the same speed, because the pulleys have the same mass."
        - "The block on the hoop pulley, because the hoop's mass at the rim helps pull the string."
        - "Both blocks move at the same speed, because each loses the same gravitational potential energy."
      option_explanations:
        - |
          Correct. Each block–Earth system gives up the same mgh, shared as ½mv² + ½Iω² with ω = v/R. The disk's I = ½MR² is smaller than the hoop's MR², so the disk takes a smaller share and its block ends faster.
        - |
          Equal masses are not enough: the rotational inertias differ because the mass is distributed differently, so the pulleys take different shares of the energy.
        - |
          The pulley's mass does not pull the string; a pulley with more rotational inertia resists speeding up and takes more of the energy, so its block is slower.
        - |
          They do lose the same potential energy, but it is split between the block and the pulley, and the hoop pulley takes the larger share.
      answer: 0
    - slug: apphys1-u06-w24-q09
      type: multiple_choice
      topic_code: "5.4"
      source: "AP Physics 1 CED, Topic 5.4"
      points: 1
      prompt: |
        Two 0.30 kg balls are fixed to the ends of a light rod 0.80 m long. What is the rotational inertia of the system about an axis through the centre of the rod, perpendicular to it?
      options:
        - "0.048 kg·m²"
        - "0.096 kg·m²"
        - "0.19 kg·m²"
        - "0.38 kg·m²"
      option_explanations:
        - |
          0.048 kg·m² counts only one ball; I = Σmr² adds both, each 0.40 m from the axis.
        - |
          Correct. Each ball is 0.40 m from the axis: I = 2(0.30 kg)(0.40 m)² = 0.096 kg·m².
        - |
          0.19 kg·m² puts one ball 0.80 m from the axis, as if the axis were at the other end, and ignores the second ball.
        - |
          0.38 kg·m² uses the full rod length 0.80 m as each ball's distance from the axis; each is only 0.40 m away.
      answer: 1
    - slug: apphys1-u06-w24-q10
      type: multiple_choice
      topic_code: "5.6"
      source: "AP Physics 1 CED, Topic 5.6"
      points: 1
      prompt: |
        A string wrapped around a wheel of radius 0.25 m pulls tangentially with a constant 8.0 N force. The wheel's rotational inertia is 0.50 kg·m², and friction is negligible. What is its angular acceleration?
      options:
        - "16 rad/s²"
        - "1.0 rad/s²"
        - "0.25 rad/s²"
        - "4.0 rad/s²"
      option_explanations:
        - |
          16 rad/s² divides the force by the rotational inertia; Newton's second law in rotational form needs the torque, rF = 2.0 N·m.
        - |
          1.0 rad/s² multiplies the torque by the rotational inertia; α = τ/I.
        - |
          0.25 rad/s² inverts the ratio (I/τ); a larger torque must give a larger angular acceleration.
        - |
          Correct. τ = rF = (0.25 m)(8.0 N) = 2.0 N·m, and α = τ/I = 2.0/0.50 = 4.0 rad/s².
      answer: 3
    - slug: apphys1-u06-w24-q11
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      prompt: |
        A spring of spring constant 200 N/m is compressed 0.10 m and released, launching a 0.25 kg block across a frictionless horizontal table. What is the block's speed after it leaves the spring?
      options:
        - "2.8 m/s"
        - "2.0 m/s"
        - "4.0 m/s"
        - "8.0 m/s"
      option_explanations:
        - |
          Correct. ½kx² = ½(200)(0.10)² = 1.0 J becomes ½mv², so v = √(2 × 1.0/0.25) = 2.83 m/s ≈ 2.8 m/s.
        - |
          2.0 m/s sets ½kx² equal to mv², dropping the ½ from the kinetic energy.
        - |
          4.0 m/s sets kx² equal to ½mv², dropping the ½ from the spring potential energy.
        - |
          8.0 m/s is v², not v: 2(1.0 J)/0.25 kg = 8.0 m²/s², which still needs a square root.
      answer: 0
    - slug: apphys1-u06-w24-q12
      type: multiple_choice
      topic_code: "5.2"
      source: "AP Physics 1 CED, Topic 5.2"
      points: 1
      prompt: |
        A playground carousel turns at a steady 0.80 rad/s. A child stands 2.5 m from the axle. What is the child's speed?
      options:
        - "0.32 m/s"
        - "3.1 m/s"
        - "2.0 m/s"
        - "13 m/s"
      option_explanations:
        - |
          0.32 m/s divides ω by r; the tangential speed is v = rω.
        - |
          3.1 m/s divides r by ω; v = rω multiplies them.
        - |
          Correct. v = rω = (2.5 m)(0.80 rad/s) = 2.0 m/s.
        - |
          13 m/s multiplies rω by an extra 2π, treating 0.80 as revolutions per second; ω is already in rad/s.
      answer: 2
    - slug: apphys1-u06-w24-q13
      type: multi_select
      topic_code: "6.1"
      source: "AP Physics 1 CED, Topic 6.1"
      points: 2
      partial_credit: true
      prompt: |
        A uniform solid disk spins about its central axis. Which single changes would exactly double its rotational kinetic energy? Select all that apply.
      options:
        - "Doubling its mass while keeping its radius and angular speed the same"
        - "Doubling its angular speed while keeping its mass and radius the same"
        - "Multiplying its angular speed by √2 while keeping its mass and radius the same"
        - "Doubling its radius while keeping its mass and angular speed the same"
        - "Replacing it with a thin hoop of the same mass and radius, spinning at the same angular speed"
      option_explanations:
        - |
          Correct. I = ½MR² doubles when M doubles, so K = ½Iω² doubles.
        - |
          K ∝ ω² with I unchanged, so doubling ω multiplies K by 2² = 4, not 2.
        - |
          Correct. With I unchanged, K ∝ ω² and (√2)² = 2, so K doubles.
        - |
          For a disk I = ½MR² ∝ R², so doubling R multiplies I, and K, by 4.
        - |
          Correct. The hoop's I = MR² is twice the disk's ½MR², so at the same ω its K is twice as large.
      answer: [0, 2, 4]
    - slug: apphys1-u06-w24-q14
      type: multi_select
      topic_code: "6.2"
      source: "AP Physics 1 CED, Topic 6.2"
      points: 2
      partial_credit: true
      prompt: |
        In which situations does the torque or force described do nonzero work on the rotating object? Select all that apply.
      options:
        - "A student pushes tangentially on the rim of a playground carousel as it speeds up."
        - "A brake pad rubs on the rim of a spinning bicycle wheel as it slows down."
        - "The fixed axle pushes upward on a pulley that turns as a block falls."
        - "A mechanic pulls hard on a wrench, but the rusted bolt does not turn."
        - "Friction in a ceiling fan's bearing acts while the switched-off fan coasts to a stop."
      option_explanations:
        - |
          Correct. The push exerts a torque in the direction of rotation while the carousel turns, so it does positive work.
        - |
          Correct. The pad's frictional torque opposes the rotation while the wheel turns, so it does negative work.
        - |
