    - slug: apphys1-u06-w26-q21
      type: short_answer
      topic_code: "6.6"
      source: "AP Physics 1 CED, Topic 6.6"
      points: 3
      prompt: |
        A student says: "To move a satellite to a higher circular orbit you must give it more energy, so in the higher orbit it must be moving faster." Evaluate the claim. State what happens to the satellite's speed and to the total mechanical energy of the satellite–Earth system, and support your answer with equations.
      answer: |
        The first half is right and the conclusion is wrong. In a circular orbit gravity supplies the centripetal force, GMm/r² = mv²/r, so v = √(GM/r): a larger r means a smaller speed, and the satellite's kinetic energy K = GMm/(2r) decreases. The total energy is E = K + U_g = GMm/(2r) − GMm/r = −GMm/(2r), which becomes less negative, so it increases as r increases. The extra energy goes into gravitational potential energy (which rises by twice as much as the kinetic energy falls), so the satellite gains energy overall while moving more slowly.
      explanation: |
        Three points. 1 point: the speed decreases, supported by v = √(GM/r) derived or quoted from Newton's second law. 1 point: the total mechanical energy increases (becomes less negative), supported by E = −GMm/(2r) or by U_g rising more than K falls. 1 point: a clear evaluation reconciling the two (the added energy goes into potential energy, so "more energy" does not mean "faster"). Agreeing with the student loses the first and third points.
    - slug: apphys1-u06-w26-q22
      type: short_answer
      topic_code: "6.5"
      source: "AP Physics 1 CED, Topic 6.5"
      points: 3
      prompt: |
        A solid rubber ball (I = (2/5)MR²) rolls without slipping at 3.0 m/s toward a ramp. Beside it, a block slides at 3.0 m/s on a frictionless surface toward an identical but frictionless ramp. The ball keeps rolling without slipping on its ramp.

        (a) Which object rises higher before stopping? Justify your claim with energy, without numbers.
        (b) Calculate the maximum height of each.
        (c) If the ball's ramp were frictionless instead, would the ball rise higher, lower or to the same height as the block? Explain.
      answer: |
        (a) The ball. Both have the same translational kinetic energy per kilogram, but the ball also has rotational kinetic energy. On its ramp, friction's torque slows the spin, and all of its kinetic energy, rotational included, becomes gravitational potential energy, so it climbs higher.
        (b) Block: h = v²/(2g) = (3.0)²/(2 × 9.8) = 0.46 m. Ball: Mgh = ½M(1 + 2/5)v², so h = 1.4v²/(2g) = 0.64 m.
        (c) The same height as the block (0.46 m). With no friction nothing exerts a torque about the ball's centre, so its spin cannot change and its rotational energy stays rotational; only its translational kinetic energy becomes potential energy. It reaches the top of its climb still spinning.
      explanation: |
        Three points, one per part. (a) the ball, with the reason that its rotational kinetic energy also converts to height. (b) both heights: 0.46 m and 0.64 m (accept 0.45–0.47 m and 0.63–0.65 m). (c) same height as the block, because with no friction there is no torque to change the spin, so the rotational energy cannot be converted.
    - slug: apphys1-u06-w26-q23
      type: long_answer
      topic_code: "6.6"
      source: "AP Physics 1 CED, Topic 6.6"
      points: 6
      prompt: |
        Mathematical routines. A space agency plans a probe in a circular orbit around a newly studied planet of mass M = 4.0 × 10²⁴ kg. The probe's mass is m.

        (A) Starting from Newton's second law, derive an expression for the probe's orbital speed v in terms of G, M and the orbital radius r. Explain why m does not appear.

        (B) Derive an expression for the orbital period T in terms of G, M and r, and calculate v and T for r = 8.0 × 10⁶ m.

        (C) The agency later moves the probe to a circular orbit of radius 4r. Without recalculating from scratch, predict the new speed and period, and state whether the total mechanical energy of the probe–planet system is larger or smaller in the new orbit.
      answer: |
        (A) Gravity is the only force and points toward the planet's centre, so it is the net centripetal force: GMm/r² = mv²/r, giving v = √(GM/r). The probe's mass appears on both sides (gravitational force and inertia) and cancels.
        (B) T = 2πr/v = 2π√(r³/(GM)). v = √((6.67 × 10⁻¹¹)(4.0 × 10²⁴)/(8.0 × 10⁶)) ≈ 5.8 × 10³ m/s; T = 2π(8.0 × 10⁶)/(5.77 × 10³) ≈ 8.7 × 10³ s (about 2.4 h).
        (C) v ∝ 1/√r, so the speed halves to about 2.9 × 10³ m/s; T ∝ r^(3/2), so the period becomes 8 times as long, about 7.0 × 10⁴ s (about 19 h). The total energy E = −GMm/(2r) becomes one quarter as negative, so it is larger in the new orbit.
      explanation: |
        Six points.
        (A) 2 points: 1 for setting gravitational force equal to mv²/r (Newton's second law with centripetal acceleration); 1 for v = √(GM/r) with the explanation that the probe's mass cancels (it appears in both the force and the inertia).
        (B) 2 points: 1 for T = 2πr/v = 2π√(r³/GM); 1 for both values, v ≈ 5.8 × 10³ m/s (accept 5.7–5.8 × 10³) and T ≈ 8.7 × 10³ s (accept 8.6–8.8 × 10³ s or 2.4 h).
        (C) 2 points: 1 for v halved and T multiplied by 8, with the proportional reasoning; 1 for the total energy larger (less negative), with E = −GMm/(2r) or an equivalent argument. Saying the energy is smaller because the probe is slower loses this point.
