week: 26
unit: 6
title: "Rolling and Orbiting Satellites"
topics: ["6.5", "6.6"]
guide: guides/week-26.md
guide_description: |
  Rolling without slipping (v_cm = Rω, the contact point at rest, the top at 2v_cm), the kinetic energy of a
  rolling object split into translational and rotational parts, rolling races and why only the shape factor
  matters, why static friction does no work on a rolling object, and satellites: circular-orbit speed and
  period from Newton's second law, T² ∝ r³, U_g = −GMm/r and the total energy of an orbit, escape speed, and
  conservation of angular momentum and energy in elliptical orbits. Worked examples: a race of a ball, a
  cylinder, a pipe and a sliding block down a 1.2 m ramp (with a table), a bowling ball rolling up a return
  ramp compared with a sliding block (energy table), a satellite 400 km above Earth, and an elliptical orbit
  checked with both conservation laws.
flashcards_description: |
  30 cards on rolling and orbits: the rolling condition, speeds of the contact point and the top, the energy
  split and rotational share for each shape, rolling races, static versus kinetic friction, circular-orbit speed
  and period, functional dependence on r and M, orbital energy, escape speed, and elliptical orbits.

flashcards:
  - front: Rolling without slipping → condition linking the centre's speed and the spin
    back: |
      v_cm = Rω (and a_cm = Rα): in one revolution the object moves forward one circumference.
    topic_code: "6.5"
  - front: Wheel rolling without slipping → speed of the contact point and of the top
    back: |
      Contact point: momentarily at rest (v_cm − Rω = 0). Top: 2v_cm (v_cm + Rω).
    topic_code: "6.5"
  - front: Rolling object → total kinetic energy expression
    back: |
      K = ½Mv_cm² + ½I_cmω²; with I = βMR² and no slipping, K = ½M(1 + β)v_cm².
    topic_code: "6.5"
  - front: Rolling without slipping → fraction of K that is rotational
    back: |
      β/(1 + β): solid sphere 2/7, solid cylinder 1/3, hoop or thin pipe 1/2.
    topic_code: "6.5"
  - front: Object rolls from rest down a drop h without slipping → speed at the bottom
    back: |
      Mgh = ½M(1 + β)v², so v = √(2gh/(1 + β)), independent of M and R.
    topic_code: "6.5"
  - front: Rolling race of a solid sphere, solid cylinder and hoop → finishing order
    back: |
      Sphere (β = 2/5), then cylinder (½), then hoop (1): smaller β means less energy tied up in spin.
    topic_code: "6.5"
  - front: Heavy steel ball vs light glass marble rolling down the same ramp → who wins
    back: |
      A tie: both are solid spheres with β = 2/5, and mass and radius cancel.
    topic_code: "6.5"
  - front: Ramp 1.2 m high → bottom speeds of ball, cylinder, pipe and sliding block
    back: |
      Ball 4.10 m/s, cylinder 3.96 m/s, pipe 3.43 m/s, frictionless block 4.85 m/s.
    topic_code: "6.5"
  - front: Rolling speed formula with β → 0 → limiting-case check
    back: |
      v → √(2gh), the speed of a block sliding down a frictionless ramp: no energy goes into spin.
    topic_code: "6.5"
  - front: Static friction on an object rolling without slipping → work done
    back: |
      Zero: the contact point does not move while the force acts, so mechanical energy is conserved.
    topic_code: "6.5"
  - front: Bowling ball skids before it starts rolling → what happens to mechanical energy
    back: |
      Kinetic friction at the sliding contact converts mechanical energy to internal energy until v_cm = Rω.
    topic_code: "6.5"
  - front: 7.0 kg bowling ball rolling at 5.0 m/s → energy split
    back: |
      K_trans = 87.5 J, K_rot = 35.0 J, total 122.5 J.
    topic_code: "6.5"
  - front: Rolling ball vs sliding block up the same ramp at the same speed → which goes higher
    back: |
      The rolling ball: its rotational energy also becomes height (1.79 m vs 1.28 m at 5.0 m/s).
    topic_code: "6.5"
  - front: Error-spot → "friction slows the rolling ball, so it does negative work and mechanical energy drops"
    back: |
      With no slipping the contact point is at rest, so static friction does no work; it only shifts energy between spin and translation.
    topic_code: "6.5"
  - front: Satellite in a circular orbit → derivation of its speed
    back: |
      GMm/r² = mv²/r, so v = √(GM/r); the satellite's mass cancels.
    topic_code: "6.6"
  - front: Circular orbit → period expression and Kepler's third law
    back: |
      T = 2πr/v = 2π√(r³/GM), so T² ∝ r³.
    topic_code: "6.6"
  - front: Orbit radius multiplied by 4 → change in orbital speed and period
    back: |
      v ∝ 1/√r halves; T ∝ r^(3/2) becomes 8 times as long.
    topic_code: "6.6"
  - front: Central planet's mass doubled at the same orbit radius → change in orbital speed
    back: |
      v ∝ √M, so v rises by √2 (about 1.41 times); T falls by the same factor.
    topic_code: "6.6"
  - front: Satellite 400 km above Earth (r = 6.77 × 10⁶ m) → speed and period
    back: |
      v ≈ 7.67 × 10³ m/s; T ≈ 5.55 × 10³ s ≈ 92 minutes.
    topic_code: "6.6"
  - front: r in orbit formulas → measured from where?
    back: |
      From the centre of the planet: orbital radius = planet radius + altitude.
    topic_code: "6.6"
  - front: Satellite–planet system → gravitational potential energy formula
    back: |
      U_g = −GMm/r, zero at infinite separation and negative at every finite distance.
    topic_code: "6.6"
  - front: Circular orbit → kinetic, potential and total energy
    back: |
      K = GMm/(2r), U_g = −GMm/r, E = −GMm/(2r): the total is negative and equal to −K.
    topic_code: "6.6"
  - front: Raising a satellite to a higher circular orbit → changes in speed and total energy
    back: |
      Its speed decreases but its total energy increases (becomes less negative), so the rocket must do positive work.
    topic_code: "6.6"
  - front: Escape speed from a planet's surface → expression and Earth value
    back: |
      Set ½mv² − GMm/R = 0: v_esc = √(2GM/R), about 11.2 km/s for Earth.
    topic_code: "6.6"
  - front: Elliptical orbit → why angular momentum about the planet is conserved
    back: |
      Gravity always points at the planet's centre, so it exerts no torque about it.
    topic_code: "6.6"
  - front: Elliptical orbit, nearest and farthest points → angular momentum relation
    back: |
      v_near r_near = v_far r_far, because v is perpendicular to r at those two points.
    topic_code: "6.6"
  - front: Orbit with nearest point 7.0 × 10⁶ m at 8.71 km/s, farthest 1.4 × 10⁷ m → speed at farthest point
    back: |
      v = (8.71)(7.0 × 10⁶)/(1.4 × 10⁷) ≈ 4.35 km/s; energy per kilogram (−1.90 × 10⁷ J/kg) agrees at both points.
    topic_code: "6.6"
  - front: Elliptical orbit → where kinetic energy is greatest and what stays constant
    back: |
      K is greatest at the nearest point and least at the farthest; total mechanical energy and angular momentum stay constant.
    topic_code: "6.6"
  - front: Error-spot → "astronauts on the space station float because there is no gravity up there"
    back: |
      Gravity at 400 km is about 89% of its surface value; astronauts and station fall around Earth together, so nothing presses on them.
    topic_code: "6.6"
  - front: Error-spot → "a satellite needs a forward thrust to stay in orbit"
    back: |
      Gravity is the only force; it is perpendicular to the velocity in a circular orbit and changes its direction, not its speed.
    topic_code: "6.6"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 6.5 and 6.6: rolling without slipping, the
    energy split and rolling races, friction on rolling objects, circular-orbit speed and period, orbital energy
    and elliptical orbits), with 7 questions (30%) reviewing earlier weeks (gravitational force and circular
    motion from weeks 8 and 11, τ_net = Iα from week 23, and rotational kinetic energy, angular momentum and
    its conservation from weeks 24–25). Opens with a shared-context set on a lab group's rolling race. Multiple
    choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
    Calculators and the equation sheet are allowed throughout, as on the AP exam.
  questions:
    # ---- Stimulus set: a lab group's rolling race (6.5)
    - slug: apphys1-u06-w26-q01
      type: multiple_choice
      topic_code: "6.5"
      source: "AP Physics 1 CED, Topic 6.5"
      points: 1
      stimulus: |
        A lab group releases three objects from rest, one at a time, at the top of a ramp whose top is 0.45 m higher than its bottom: a solid steel ball (I = (2/5)MR²), a solid aluminium cylinder (I = ½MR²) and a thin-walled plastic pipe (I = MR²). Each rolls without slipping, and a photogate at the bottom measures its speed. The group does three trials per object.

        | Object | Trial 1 (m/s) | Trial 2 (m/s) | Trial 3 (m/s) | Mean (m/s) |
        |---|---|---|---|---|
        | Solid steel ball | 2.49 | 2.52 | 2.47 | 2.49 |
        | Solid aluminium cylinder | 2.41 | 2.44 | 2.39 | 2.41 |
        | Thin-walled pipe | 2.08 | 2.11 | 2.06 | 2.08 |
      prompt: |
        Which explanation accounts for the order of the mean speeds?
      options:
        - "The ball is the densest object, and denser objects roll faster."
        - "The ball stores the smallest fraction of its kinetic energy as rotation, so more of the same potential energy per kilogram goes into moving its centre forward."
        - "The pipe has the largest radius, so air resistance slows it the most."
        - "The pipe experiences the most friction, which does negative work and removes energy."
      option_explanations:
        - |
          Density and mass cancel: v = √(2gh/(1 + β)) depends only on the shape factor β, not on the material.
        - |
          Correct. Each loses Mgh and gains ½M(1 + β)v². The ball's β = 2/5 is the smallest, so its v = √(2gh/1.4) = 2.51 m/s is largest; the cylinder (β = ½) predicts 2.42 m/s and the pipe (β = 1) 2.10 m/s, matching the data.
        - |
          The prediction from shape alone (2.10 m/s for the pipe) already matches its measured mean, so air resistance is not needed to explain the order; radius cancels from the rolling speed.
        - |
          With no slipping, static friction does no work. The pipe is slower because half its kinetic energy is rotational, not because energy is removed.
      answer: 1
    - slug: apphys1-u06-w26-q02
      type: multiple_choice
      topic_code: "6.5"
      source: "AP Physics 1 CED, Topic 6.5"
      points: 1
      stimulus: |
        A lab group releases three objects from rest, one at a time, at the top of a ramp whose top is 0.45 m higher than its bottom: a solid steel ball (I = (2/5)MR²), a solid aluminium cylinder (I = ½MR²) and a thin-walled plastic pipe (I = MR²). Each rolls without slipping, and a photogate at the bottom measures its speed. The group does three trials per object.

        | Object | Trial 1 (m/s) | Trial 2 (m/s) | Trial 3 (m/s) | Mean (m/s) |
        |---|---|---|---|---|
        | Solid steel ball | 2.49 | 2.52 | 2.47 | 2.49 |
        | Solid aluminium cylinder | 2.41 | 2.44 | 2.39 | 2.41 |
        | Thin-walled pipe | 2.08 | 2.11 | 2.06 | 2.08 |
      prompt: |
        At the bottom of the ramp, what fraction of the pipe's kinetic energy is rotational?
      options:
        - "1/3"
        - "2/7"
        - "0, because the pipe's centre moves in a straight line"
        - "1/2"
      option_explanations:
        - |
          1/3 is the rotational share for the solid cylinder, β/(1 + β) with β = ½; the pipe has β = 1.
        - |
          2/7 is the rotational share for the solid ball, with β = 2/5.
        - |
          The centre moves in a straight line, but the pipe also spins, and that spin carries kinetic energy ½Iω².
        - |
          Correct. With v = Rω, K_rot = ½(MR²)(v/R)² = ½Mv², equal to K_trans, so the rotational share is β/(1 + β) = 1/2.
      answer: 3
    - slug: apphys1-u06-w26-q03
      type: multiple_choice
      topic_code: "6.5"
      source: "AP Physics 1 CED, Topic 6.5"
      points: 1
      stimulus: |
        A lab group releases three objects from rest, one at a time, at the top of a ramp whose top is 0.45 m higher than its bottom: a solid steel ball (I = (2/5)MR²), a solid aluminium cylinder (I = ½MR²) and a thin-walled plastic pipe (I = MR²). Each rolls without slipping, and a photogate at the bottom measures its speed. The group does three trials per object.

        | Object | Trial 1 (m/s) | Trial 2 (m/s) | Trial 3 (m/s) | Mean (m/s) |
        |---|---|---|---|---|
        | Solid steel ball | 2.49 | 2.52 | 2.47 | 2.49 |
        | Solid aluminium cylinder | 2.41 | 2.44 | 2.39 | 2.41 |
        | Thin-walled pipe | 2.08 | 2.11 | 2.06 | 2.08 |
      prompt: |
        The group repeats the trial with a solid steel ball of twice the radius and eight times the mass. What mean speed at the bottom should they expect?
      options:
        - "About 2.5 m/s, the same as the smaller ball"
        - "About 5.0 m/s, because the ball is twice as large"
        - "About 1.2 m/s, because a larger ball has more rotational inertia"
        - "About 7.1 m/s, because the ball has eight times the mass"
      option_explanations:
        - |
          Correct. Both are solid spheres with β = 2/5. In Mgh = ½M(1 + β)v² the mass cancels, and with v = Rω the radius cancels too, so v = √(2gh/1.4) ≈ 2.5 m/s.
        - |
          The radius cancels: a bigger ball has a larger I = (2/5)MR² but turns at a smaller ω = v/R, so its rotational energy at a given v is unchanged.
        - |
          I does grow, but so does the gravitational energy Mgh available; per kilogram nothing changes for the same shape.
        - |
          Mass cancels: eight times the mass means eight times the potential energy and eight times the kinetic energy at each speed.
      answer: 0
    # ---- Independent items
    - slug: apphys1-u06-w26-q04
      type: multiple_choice
      topic_code: "5.6"
      source: "AP Physics 1 CED, Topic 5.6"
      points: 1
      prompt: |
        A uniform solid disk of mass 2.0 kg and radius 0.20 m turns on a fixed frictionless axle. A net torque of 0.80 N·m acts on it. What is its angular acceleration?
      options:
        - "2.0 rad/s²"
        - "10 rad/s²"
        - "20 rad/s²"
        - "0.032 rad/s²"
      option_explanations:
        - |
          2.0 divides the torque by MR (0.40 kg·m), which is not a rotational inertia; use I = ½MR².
        - |
          10 rad/s² uses I = MR² (a hoop's inertia) instead of the solid disk's ½MR².
        - |
          Correct. I = ½(2.0)(0.20)² = 0.040 kg·m², and α = τ/I = 0.80 ÷ 0.040 = 20 rad/s².
        - |
          0.032 multiplies the torque by the inertia; Newton's second law in rotational form gives α = τ/I.
      answer: 2
    - slug: apphys1-u06-w26-q05
      type: multiple_choice
      topic_code: "6.5"
      source: "AP Physics 1 CED, Topic 6.5"
      points: 1
      prompt: |
        A solid ball rolls without slipping down a ramp. Static friction from the ramp acts on it, up the slope. Which statement about that friction force is correct?
      options:
        - "It exerts the torque that makes the ball spin faster, but it does no work, because the contact point is momentarily at rest."
        - "It does negative work, so the ball's mechanical energy decreases as it rolls down."
        - "It does positive work, adding the ball's rotational kinetic energy to its total."
        - "It is zero, because a ball that does not slip feels no friction."
      option_explanations:
        - |
          Correct. Friction acts at the contact point, which does not slide, so W = 0 and mechanical energy is conserved; its torque about the centre is what spins the ball up as it speeds up.
        - |
          That would be true if the ball slipped (kinetic friction). For rolling without slipping the point where friction acts is at rest, so no work is done.
        - |
          The rotational energy comes from gravitational potential energy, not from work by friction; friction only shares the energy between translation and rotation.
        - |
          Something must exert a torque about the centre to change the spin; gravity and the normal force act through or toward the centre, so static friction is needed.
      answer: 0
    - slug: apphys1-u06-w26-q06
      type: multiple_choice
      topic_code: "6.6"
      source: "AP Physics 1 CED, Topic 6.6"
      points: 1
      prompt: |
        A weather satellite moves in a circular orbit of radius 7.0 × 10⁶ m measured from Earth's centre. Earth's mass is 5.97 × 10²⁴ kg and its radius is 6.37 × 10⁶ m. What is the satellite's orbital speed?
      options:
        - "2.9 m/s"
        - "1.1 × 10⁴ m/s"
        - "2.5 × 10⁴ m/s"
        - "7.5 × 10³ m/s"
      option_explanations:
        - |
          2.9 m/s takes √(GM/r²), the square root of the gravitational field, which is not a speed; gravity = mv²/r gives v = √(GM/r).
        - |
          1.1 × 10⁴ m/s is √(2GM/r), the escape speed at that radius, not the circular-orbit speed.
        - |
          2.5 × 10⁴ m/s uses the altitude above the surface (6.3 × 10⁵ m) as r; r is measured from Earth's centre.
        - |
          Correct. v = √(GM/r) = √((6.67 × 10⁻¹¹)(5.97 × 10²⁴)/(7.0 × 10⁶)) ≈ 7.5 × 10³ m/s.
      answer: 3
    - slug: apphys1-u06-w26-q07
      type: multiple_choice
      topic_code: "6.6"
      source: "AP Physics 1 CED, Topic 6.6"
      points: 1
      prompt: |
        Satellite B orbits a planet in a circular orbit whose radius is four times that of satellite A's circular orbit. How does B's period compare with A's?
      options:
        - "4 times as long"
        - "8 times as long"
        - "16 times as long"
        - "2 times as long"
      option_explanations:
        - |
          A factor of 4 treats T as proportional to r; B is also slower, which lengthens its period further.
        - |
          Correct. T = 2π√(r³/GM), so T ∝ r^(3/2): 4^(3/2) = 8. (B travels 4 times as far at half the speed.)
        - |
          16 squares the radius ratio; Kepler's third law has T² ∝ r³, so T ∝ r^(3/2), not r².
        - |
          2 is the factor by which the speed changes (it halves); the period depends on both the distance and the speed.
      answer: 1
    - slug: apphys1-u06-w26-q08
      type: multiple_choice
      topic_code: "6.6"
      source: "AP Physics 1 CED, Topic 6.6"
      points: 1
      prompt: |
        A satellite in an elliptical orbit around Earth is 8.0 × 10⁶ m from Earth's centre at its nearest point, where it moves at 8.64 × 10³ m/s. Its farthest point is 2.4 × 10⁷ m from Earth's centre. How fast does it move at the farthest point?
      options:
        - "2.6 × 10⁴ m/s"
        - "8.64 × 10³ m/s"
        - "2.88 × 10³ m/s"
        - "9.6 × 10² m/s"
      option_explanations:
        - |
          2.6 × 10⁴ m/s multiplies by the ratio of distances the wrong way; the satellite must be slower when it is farther away.
        - |
          The speed does change in an elliptical orbit; gravity does negative work as the satellite moves away.
        - |
          Correct. Gravity exerts no torque about Earth's centre, so mvr is the same at both points (v is perpendicular to r there): v = (8.64 × 10³)(8.0 × 10⁶)/(2.4 × 10⁷) = 2.88 × 10³ m/s.
        - |
          9.6 × 10² m/s divides by the square of the distance ratio (9); angular momentum makes v inversely proportional to r itself.
      answer: 2
    - slug: apphys1-u06-w26-q09
      type: multiple_choice
      topic_code: "6.6"
      source: "AP Physics 1 CED, Topic 6.6"
      points: 1
      prompt: |
        A comet moves in a long elliptical orbit around the Sun. Which statement compares the comet–Sun system at the comet's nearest point and at its farthest point?
      options:
        - "The comet's kinetic energy and the total mechanical energy are both greatest at the nearest point."
        - "The comet's angular momentum about the Sun is greatest at the nearest point, where it moves fastest."
        - "The gravitational potential energy is greatest at the nearest point, where the force is strongest."
        - "The kinetic energy is greatest at the nearest point, while the total mechanical energy and the angular momentum about the Sun are the same at both points."
      option_explanations:
        - |
          Kinetic energy is greatest at the nearest point, but no external work is done on the system, so total mechanical energy is the same everywhere in the orbit.
        - |
          The comet does move fastest there, but r is smallest, and mvr stays constant: gravity exerts no torque about the Sun.
        - |
          U_g = −GMm/r is most negative, so smallest, at the nearest point; the strength of the force does not make the potential energy larger.
        - |
          Correct. Gravity does positive work as the comet falls in, so K is largest at the nearest point; mechanical energy is conserved (no external work), and angular momentum is conserved because gravity points at the Sun and exerts no torque about it.
      answer: 3
    - slug: apphys1-u06-w26-q10
      type: multiple_choice
      topic_code: "6.4"
      source: "AP Physics 1 CED, Topic 6.4"
      points: 1
      prompt: |
        A disk with rotational inertia 0.030 kg·m² spins at 12 rad/s on a frictionless vertical axle. A second disk with rotational inertia 0.010 kg·m², not spinning, is dropped onto it along the same axle, and the two quickly turn together. What is their common angular speed?
      options:
        - "12 rad/s"
        - "9.0 rad/s"
        - "10 rad/s"
        - "3.0 rad/s"
      option_explanations:
        - |
          The second disk adds rotational inertia while bringing no angular momentum, so the shared angular speed must be lower.
        - |
          Correct. Angular momentum about the axle is conserved: (0.030)(12) = (0.040)ω, so ω = 9.0 rad/s.
        - |
          10 rad/s (10.4) comes from conserving kinetic energy; the disks slide on each other before turning together, so kinetic energy is lost.
        - |
          3.0 rad/s uses the dropped disk's inertia in the numerator; the initial angular momentum belongs to the spinning disk.
      answer: 1
    - slug: apphys1-u06-w26-q11
      type: multiple_choice
      topic_code: "6.3"
      source: "AP Physics 1 CED, Topic 6.3"
      points: 1
      prompt: |
        A uniform rod of mass 0.60 kg and length 1.0 m spins at 5.0 rad/s about an axle through one end, perpendicular to the rod. Its rotational inertia about that end is (1/3)ML². What is its angular momentum about the axle?
      options:
        - "1.0 kg·m²/s"
        - "0.25 kg·m²/s"
        - "3.0 kg·m²/s"
        - "2.5 kg·m²/s"
      option_explanations:
        - |
          Correct. I = (1/3)(0.60)(1.0)² = 0.20 kg·m², and L = Iω = (0.20)(5.0) = 1.0 kg·m²/s.
        - |
          0.25 uses the inertia about the centre, (1/12)ML² = 0.050 kg·m², but this rod turns about its end.
        - |
          3.0 treats the whole mass as a point at the tip, moving at 5.0 m/s (mvr with r = 1.0 m); most of the rod is closer to the axle.
        - |
          2.5 is the rotational kinetic energy ½Iω² in joules, not the angular momentum Iω.
      answer: 0
    - slug: apphys1-u06-w26-q12
      type: multiple_choice
      topic_code: "2.6"
      source: "AP Physics 1 CED, Topic 2.6"
      points: 1
      prompt: |
        A satellite has a weight of 2000 N on Earth's surface. What is the gravitational force Earth exerts on it in an orbit at an altitude equal to one Earth radius above the surface?
      options:
        - "2000 N"
        - "1000 N"
        - "500 N"
        - "Zero, because it is in orbit"
      option_explanations:
        - |
          The force depends on distance from Earth's centre, which has doubled, so the force is smaller than at the surface.
        - |
          1000 N treats the force as proportional to 1/r; Newton's law of gravitation has 1/r².
        - |
          Correct. The distance from Earth's centre doubles (from R to 2R), so F = GMm/r² becomes (1/2)² = 1/4 of 2000 N = 500 N.
        - |
          Gravity does not switch off in orbit; it is the centripetal force that keeps the satellite on its circular path.
      answer: 2
    - slug: apphys1-u06-w26-q13
      type: multi_select
      topic_code: "6.5"
      source: "AP Physics 1 CED, Topic 6.5"
      points: 2
      partial_credit: true
      prompt: |
        A bicycle wheel of radius R rolls without slipping along level ground at a steady speed v. Which statements are true? Select all that apply.
      options:
        - "The point of the tyre touching the ground is momentarily at rest."
        - "Every point on the tyre moves at speed v relative to the ground."
        - "The top of the tyre moves at 2v relative to the ground."
        - "The wheel's angular speed is v/R."
        - "The wheel's kinetic energy is ½Mv², because its centre moves at v."
      option_explanations:
        - |
          Correct. Its forward velocity v from the centre's motion cancels the backward velocity Rω = v from the spin.
        - |
          Only relative to the centre do rim points move at v; relative to the ground, speeds range from 0 at the bottom to 2v at the top.
        - |
          Correct. At the top the spin velocity Rω = v adds to the centre's velocity v.
        - |
          Correct. Rolling without slipping means v = Rω, so ω = v/R.
        - |
          ½Mv² is only the translational part; the spinning wheel also has rotational kinetic energy ½Iω².
      answer: [0, 2, 3]
