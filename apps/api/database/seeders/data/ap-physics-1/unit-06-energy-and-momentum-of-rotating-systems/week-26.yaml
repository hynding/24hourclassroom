        True or false: A child runs and jumps onto the rim of a freely spinning carousel, and then the child and carousel turn together. The total kinetic energy of the child–carousel system is the same just before and just after the landing.
      answer: false
      explanation: |
        False. The child's feet slide on the deck until child and carousel move together: a perfectly inelastic rotational collision. Angular momentum about the axle is conserved, but some kinetic energy becomes internal energy, so the total kinetic energy decreases (unless the child lands moving at exactly the rim's speed).
