    - slug: apphys1-u06-w25-q21
      type: short_answer
      topic_code: "6.4"
      source: "AP Physics 1 CED, Topic 6.4"
      points: 3
      prompt: |
        A student stands at the rim of a large platform that turns freely on a frictionless axle. She then walks slowly along a radius toward the centre.

        (a) Does the platform's angular speed increase, decrease or stay the same? Justify your answer.
        (b) Does the kinetic energy of the student–platform system increase, decrease or stay the same? Explain where any change in energy comes from or goes.
        (c) She walks back out to the rim. Compare the platform's final angular speed with its angular speed before she started walking.
      answer: |
        (a) Increases. For the student–platform system, the forces between her feet and the platform are internal and the axle exerts no torque about the axle, so L = Iω is conserved. Moving her mass toward the axis reduces the system's rotational inertia, so ω must increase.
        (b) Increases. With L fixed, K = L²/(2I) grows as I shrinks. The extra energy comes from the work her muscles do as she walks inward (chemical energy in her body becomes kinetic energy).
        (c) The same as before she started: back at the rim the system has its original I, and L is still the same, so ω returns to its original value.
      explanation: |
        Three points, one per part. (a) "increases" with reasoning that L is conserved (no external torque) and I decreases. (b) "increases" with a reason (K = L²/2I, or ω increases more than I decreases) and the source: work done by the student (internal energy of her body). Saying K is conserved loses the point. (c) "the same", because I and L both return to their starting values.
    - slug: apphys1-u06-w25-q22
      type: short_answer
