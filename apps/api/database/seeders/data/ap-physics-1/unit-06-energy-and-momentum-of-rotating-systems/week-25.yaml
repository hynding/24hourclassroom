week: 25
unit: 6
title: "Angular Momentum, Angular Impulse and Their Conservation"
topics: ["6.3", "6.4"]
guide: guides/week-25.md
guide_description: |
  Angular momentum of a rigid object (L = Iω) and of a point object moving in a straight line (L = mvr⊥),
  angular impulse τΔt = ΔL and the area under a torque–time graph, the condition for conservation of angular
  momentum, and what happens to kinetic energy when a system changes its rotational inertia or when objects
  stick together in a rotational collision. Worked examples: a skateboarder rolling past a carousel axle, a
  bicycle wheel spun up by a recorded torque history, a student on a rotating stool pulling in dumbbells (with a
  before/after table), and a child running onto a spinning carousel (with limiting-case checks).
flashcards_description: |
  30 cards on angular momentum and its conservation: L = Iω and L = mvr⊥, the moment arm of a straight-line
  mover, angular impulse from torque–time graphs, the conservation condition, spinners changing their
  rotational inertia, rotational collisions, and what happens to kinetic energy and linear momentum.

flashcards:
  - front: Rigid object spinning about a fixed axis → angular momentum formula
    back: |
      L = Iω, in kg·m²/s, with a sign for the sense of rotation (counterclockwise positive by convention).
    topic_code: "6.3"
  - front: Point object moving past a reference point → angular momentum formula
    back: |
      L = mvr⊥ = mvr sin θ, where r⊥ is the perpendicular distance from the point to the line of motion.
    topic_code: "6.3"
  - front: Puck sliding in a straight line with no net force → its angular momentum about a nearby peg
    back: |
      Constant and nonzero: r changes but r sin θ = r⊥ does not, and no torque acts about the peg.
    topic_code: "6.3"
  - front: 60 kg skateboarder at 4.0 m/s, path passes 1.8 m from a carousel axle → L about the axle
    back: |
      L = (60)(4.0)(1.8) = 432 kg·m²/s, the same at every point of the straight path.
    topic_code: "6.3"
  - front: Hoop vs disk, same M, R and ω → angular momentum ratio
    back: |
      L_hoop/L_disk = MR²/(½MR²) = 2.
    topic_code: "6.3"
  - front: Angular impulse–momentum theorem → statement
    back: |
      The net external angular impulse equals the change in angular momentum: τ_net Δt = ΔL.
    topic_code: "6.3"
  - front: Torque–time graph → what its area gives
    back: |
      The angular impulse, equal to ΔL. Split it into rectangles and triangles; area below the time axis counts negative.
    topic_code: "6.3"
  - front: Torque rising 0 → 3.0 N·m in 0.40 s then 3.0 N·m for 0.60 s → ΔL
    back: |
      ½(0.40)(3.0) + (0.60)(3.0) = 0.60 + 1.80 = 2.4 kg·m²/s.
    topic_code: "6.3"
  - front: Same angular impulse on two wheels, one with twice the inertia → compare L and ω
    back: |
      Same ΔL (equal areas); the wheel with twice the inertia ends with half the angular speed.
    topic_code: "6.3"
  - front: Units N·m·s and kg·m²/s → relationship
    back: |
      They are the same unit: N·m·s = (kg·m/s²)·m·s = kg·m²/s.
    topic_code: "6.3"
  - front: Linear momentum p = mv vs angular momentum L = Iω → the analogy
    back: |
      I plays the role of m, ω of v and τ of F: FΔt = Δp becomes τΔt = ΔL.
    topic_code: "6.3"
  - front: Error-spot → "L = mvr with r = 3.0 m, the puck's distance from the peg"
    back: |
      Use the moment arm r⊥ (perpendicular distance to the line of motion), not the straight-line distance r, unless v is perpendicular to r.
    topic_code: "6.3"
  - front: Conservation of angular momentum → condition
    back: |
      The net external torque on the system about the chosen axis is zero. Internal torques cancel in pairs.
    topic_code: "6.4"
  - front: Spinner pulls arms in, I drops to one third → change in ω
    back: |
      L = Iω is constant, so ω becomes 3 times as large.
    topic_code: "6.4"
  - front: Spinner pulls arms in, I drops to one third → change in rotational K
    back: |
      K = L²/(2I) with L fixed, so K becomes 3 times as large; the muscles do the extra work.
    topic_code: "6.4"
  - front: Student on a frictionless stool, I 4.8 → 1.6 kg·m², ω 2.0 rad/s → final ω and K
    back: |
      ω = 9.6/1.6 = 6.0 rad/s; K rises from 9.6 J to 28.8 J.
    topic_code: "6.4"
  - front: Spinner extends arms again after pulling in → what happens to K
    back: |
      I increases, ω drops and K = L²/(2I) decreases back; the masses do work on the arms.
    topic_code: "6.4"
  - front: Diver tucks in mid-air → why the spin speeds up
    back: |
      Gravity acts at the centre of mass and exerts no torque about it, so L is constant; tucking reduces I, so ω increases.
    topic_code: "6.4"
  - front: Child lands on a spinning carousel → which quantities are conserved during the landing
    back: |
      Angular momentum about the axle only. Kinetic energy decreases (some becomes internal energy) and linear momentum changes because the axle pushes on the carousel.
    topic_code: "6.4"
  - front: Carousel I = 200 kg·m² at 1.2 rad/s, 30 kg child at 3.0 m/s tangent at R = 1.6 m → ω_f
    back: |
      (240 + 144)/(200 + 76.8) = 384/276.8 ≈ 1.39 rad/s.
    topic_code: "6.4"
  - front: Child jumping onto carousel rim → final angular speed expression
    back: |
      ω_f = (Iω₀ + mvR)/(I + mR²), with v negative if the child runs against the rim's motion.
    topic_code: "6.4"
  - front: Child lands moving at exactly the rim speed ω₀R → limiting-case result
    back: |
      ω_f = ω₀: the carousel's speed does not change, because nothing slips at landing.
    topic_code: "6.4"
  - front: Clay dropped straight down onto a spinning turntable → effect on ω
    back: |
      ω decreases: I increases and the clay brings no angular momentum about the axis.
    topic_code: "6.4"
  - front: Turntable 0.020 kg·m² at 4.0 rad/s, 0.10 kg clay lands 0.20 m from the axis → ω_f
    back: |
      I_f = 0.020 + (0.10)(0.20)² = 0.024 kg·m², so ω_f = (0.020)(4.0)/0.024 ≈ 3.3 rad/s.
    topic_code: "6.4"
  - front: Pivoted rod struck by a ball → why use angular momentum, not linear momentum
    back: |
      The pivot exerts an external force during the impact, so linear momentum changes; that force has no torque about the pivot, so L about the pivot is conserved.
    topic_code: "6.4"
  - front: Rotational collision vs perfectly inelastic linear collision → what they share
    back: |
      Objects stick and move together; momentum (angular or linear) is conserved, and kinetic energy decreases.
    topic_code: "6.4"
  - front: Person walks from the rim toward the centre of a freely turning platform → effect on ω
    back: |
      The system's I decreases, so ω increases (L constant); the person's legs do work, so K increases.
    topic_code: "6.4"
  - front: Error-spot → "the skater speeds up, so an external torque must act on her"
    back: |
      No external torque is needed: L is constant, and ω rises because I falls. Speeding up in ω is not a change in L.
    topic_code: "6.4"
  - front: Error-spot → "angular momentum is conserved, so kinetic energy is conserved too"
    back: |
      They are separate: L = Iω is fixed but K = L²/(2I) changes whenever I changes or objects stick together.
    topic_code: "6.4"
  - front: Choosing the system for a child jumping onto a carousel → which system and why
    back: |
      Child + carousel: the friction between the child's feet and the deck is internal, and the axle force has no torque about the axle, so L of the system is conserved.
    topic_code: "6.4"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 6.3 and 6.4: angular momentum of spinning and
    straight-line movers, angular impulse and torque–time graphs, conservation of angular momentum, and what
    happens to kinetic energy), with 7 questions (30%) reviewing earlier weeks (impulse and conservation of linear
    momentum from weeks 16–17, v = rω, torque and rotational inertia from weeks 19–21, and rotational kinetic
    energy and rotational work from week 24). Opens with a shared-context set on a student spinning on a stool.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes. Calculators and the equation sheet are allowed throughout, as on the AP exam.
  questions:
    # ---- Stimulus set: student on a rotating stool (6.3, 6.4)
    - slug: apphys1-u06-w25-q01
      type: multiple_choice
      topic_code: "6.4"
      source: "AP Physics 1 CED, Topic 6.4"
      points: 1
      stimulus: |
        A student sits on a stool that rotates with negligible friction, holding a dumbbell in each outstretched hand. The rotational inertia of the student, stool and dumbbells about the stool's axis is 3.6 kg·m² with arms outstretched and 1.2 kg·m² with the dumbbells pulled in to the chest. A classmate starts the system turning at 1.5 rad/s with the arms outstretched and lets go; the student then pulls the dumbbells in.
      prompt: |
        What is the angular speed after the dumbbells are pulled in?
      options:
        - "0.50 rad/s"
        - "1.5 rad/s"
        - "4.5 rad/s"
        - "2.6 rad/s"
      option_explanations:
        - |
          0.50 rad/s inverts the ratio of inertias; a smaller rotational inertia must give a larger angular speed when L is fixed.
        - |
          The angular speed does change: angular momentum Iω is what stays constant, and I decreases.
        - |
          Correct. No external torque acts about the axis, so Iω is constant: (3.6)(1.5) = (1.2)ω, giving ω = 4.5 rad/s.
        - |
          2.6 rad/s (1.5 × √3) comes from conserving kinetic energy, which is not conserved here because the student's arms do work.
      answer: 2
    - slug: apphys1-u06-w25-q02
      type: multiple_choice
      topic_code: "6.4"
      source: "AP Physics 1 CED, Topic 6.4"
      points: 1
      stimulus: |
        A student sits on a stool that rotates with negligible friction, holding a dumbbell in each outstretched hand. The rotational inertia of the student, stool and dumbbells about the stool's axis is 3.6 kg·m² with arms outstretched and 1.2 kg·m² with the dumbbells pulled in to the chest. A classmate starts the system turning at 1.5 rad/s with the arms outstretched and lets go; the student then pulls the dumbbells in.
      prompt: |
        What happens to the rotational kinetic energy of the system as the dumbbells are pulled in?
      options:
        - "It triples, from about 4.1 J to about 12 J, because the student's arms do positive work pulling the dumbbells inward."
        - "It stays the same, because no external torque acts on the system."
        - "It decreases, because the rotational inertia decreases."
        - "It increases by a factor of 9, because the angular speed triples."
      option_explanations:
        - |
          Correct. K_i = ½(3.6)(1.5)² = 4.05 J and K_f = ½(1.2)(4.5)² = 12.15 J, three times as much (K = L²/2I with L fixed). The energy comes from work done by the student's muscles, an internal force.
        - |
          Zero external torque conserves angular momentum, not kinetic energy; internal forces (the arms) can still do work.
        - |
          K = ½Iω², and ω rises by more than I falls: with L fixed, K = L²/(2I) increases as I decreases.
        - |
          ω does triple, but I falls to a third at the same time, so K = ½Iω² rises by 9 ÷ 3 = 3, not 9.
      answer: 0
    - slug: apphys1-u06-w25-q03
      type: multiple_choice
      topic_code: "6.3"
      source: "AP Physics 1 CED, Topic 6.3"
      points: 1
      stimulus: |
        A student sits on a stool that rotates with negligible friction, holding a dumbbell in each outstretched hand. The rotational inertia of the student, stool and dumbbells about the stool's axis is 3.6 kg·m² with arms outstretched and 1.2 kg·m² with the dumbbells pulled in to the chest. A classmate starts the system turning at 1.5 rad/s with the arms outstretched and lets go; the student then pulls the dumbbells in.
      prompt: |
        What is the angular momentum of the system about the stool's axis after the dumbbells are pulled in?
      options:
        - "16 kg·m²/s"
        - "1.8 kg·m²/s"
        - "12 kg·m²/s"
        - "5.4 kg·m²/s"
      option_explanations:
        - |
          16 kg·m²/s (16.2) multiplies the outstretched inertia by the final angular speed, mixing the two states.
        - |
          1.8 kg·m²/s multiplies the pulled-in inertia by the initial angular speed, mixing the two states.
        - |
          12 is the final kinetic energy in joules (12.15 J), not an angular momentum.
        - |
          Correct. L = Iω = (3.6 kg·m²)(1.5 rad/s) = 5.4 kg·m²/s before, and with no external torque it is still 5.4 kg·m²/s = (1.2)(4.5) after.
      answer: 3
    # ---- Independent items
    - slug: apphys1-u06-w25-q04
      type: multiple_choice
      topic_code: "6.3"
      source: "AP Physics 1 CED, Topic 6.3"
      points: 1
      prompt: |
        A 0.16 kg hockey puck slides at a constant 12 m/s in a straight line across frictionless ice. At one instant it is 1.3 m from a post, and its line of motion passes 0.50 m from the post at the closest point. What is the magnitude of the puck's angular momentum about the post at that instant?
      options:
        - "Zero, because the puck moves in a straight line rather than around the post"
        - "0.96 kg·m²/s"
        - "2.5 kg·m²/s"
        - "2.3 kg·m²/s"
      option_explanations:
        - |
          An object moving in a straight line has angular momentum mvr⊥ about any point not on its line; it need not circle the point.
        - |
          Correct. L = mvr⊥ = (0.16 kg)(12 m/s)(0.50 m) = 0.96 kg·m²/s, using the perpendicular distance from the post to the line of motion.
        - |
          2.5 kg·m²/s uses the straight-line distance r = 1.3 m; only the perpendicular distance r sin θ = 0.50 m counts.
        - |
          2.3 kg·m²/s uses the distance along the path, √(1.3² − 0.50²) = 1.2 m, which is r cos θ, the wrong component.
      answer: 1
    - slug: apphys1-u06-w25-q05
      type: multiple_choice
      topic_code: "6.3"
      source: "AP Physics 1 CED, Topic 6.3"
      points: 1
      prompt: |
        A small motor exerts a constant net torque of 0.60 N·m for 2.5 s on a disk that starts at rest. The disk's rotational inertia is 0.050 kg·m². What is its final angular speed?
      options:
        - "1.5 rad/s"
        - "12 rad/s"
        - "0.075 rad/s"
        - "30 rad/s"
      option_explanations:
        - |
          1.5 is the angular impulse τΔt in kg·m²/s, which equals ΔL; dividing by I gives ω.
        - |
          12 rad/s² is the angular acceleration τ/I; it still has to act for 2.5 s.
        - |
          0.075 multiplies τ, I and Δt together; ω = τΔt/I.
        - |
          Correct. ΔL = τΔt = (0.60)(2.5) = 1.5 kg·m²/s, and ω = ΔL/I = 1.5 ÷ 0.050 = 30 rad/s.
      answer: 3
    - slug: apphys1-u06-w25-q06
      type: multiple_choice
      topic_code: "6.3"
      source: "AP Physics 1 CED, Topic 6.3"
      points: 1
      prompt: |
        A torque sensor on a lab turntable records the net torque during a push. The torque rises steadily from 0 to 4.0 N·m over the first 0.50 s and then falls steadily back to 0 over the next 0.50 s. What is the change in the turntable's angular momentum during the push?
      options:
        - "4.0 kg·m²/s"
        - "1.0 kg·m²/s"
        - "2.0 kg·m²/s"
        - "Zero, because the torque ends at zero"
      option_explanations:
        - |
          4.0 multiplies the peak torque by the whole 1.0 s, treating the triangle as a rectangle.
        - |
          1.0 is the area of only the first half of the graph; the falling half adds the same area again.
        - |
          Correct. The angular impulse is the area under the τ–t graph, a triangle: ½(1.0 s)(4.0 N·m) = 2.0 N·m·s = 2.0 kg·m²/s.
        - |
          The change in angular momentum depends on the whole area under the graph, not on the final torque; the turntable keeps the angular momentum it gained.
      answer: 2
    - slug: apphys1-u06-w25-q07
      type: multiple_choice
      topic_code: "6.4"
      source: "AP Physics 1 CED, Topic 6.4"
      points: 1
      prompt: |
        A lump of clay is dropped straight down onto the rim of a turntable that spins freely on a frictionless axle, and the clay sticks. For the system of clay and turntable, which quantity is the same just before and just after the clay lands?
      options:
        - "Angular momentum about the axle only"
        - "Kinetic energy only"
        - "Both angular momentum about the axle and kinetic energy"
        - "Linear momentum only"
      option_explanations:
        - |
          Correct. Neither the axle force (at the axis) nor gravity (along the vertical axis direction) exerts a torque about the axle, so L is conserved; the clay sticking is an inelastic collision, so kinetic energy decreases.
        - |
          The clay sticks, a perfectly inelastic rotational collision, so some kinetic energy becomes internal energy.
        - |
          Only angular momentum is conserved; kinetic energy decreases whenever objects stick together.
        - |
          The axle and the turntable's support exert external forces during the landing, so linear momentum is not conserved.
      answer: 0
    - slug: apphys1-u06-w25-q08
      type: multiple_choice
      topic_code: "6.4"
      source: "AP Physics 1 CED, Topic 6.4"
      points: 1
      prompt: |
        A turntable with rotational inertia 0.020 kg·m² spins freely at 4.0 rad/s. A 0.10 kg lump of clay is dropped straight down and sticks 0.20 m from the axis. What is the new angular speed?
      options:
        - "4.0 rad/s"
        - "3.3 rad/s"
        - "4.8 rad/s"
        - "3.7 rad/s"
      option_explanations:
        - |
          The clay adds rotational inertia while bringing no angular momentum, so the angular speed must drop.
        - |
          Correct. I_f = 0.020 + (0.10)(0.20)² = 0.024 kg·m², and Iω is conserved: ω_f = (0.020)(4.0)/0.024 ≈ 3.3 rad/s.
        - |
          4.8 rad/s multiplies by I_f/I_i instead of I_i/I_f; a larger I must mean a smaller ω.
        - |
          3.7 rad/s comes from conserving kinetic energy (4.0 × √(0.020/0.024)); kinetic energy is not conserved when the clay sticks.
      answer: 1
    - slug: apphys1-u06-w25-q09
      type: multiple_choice
      topic_code: "5.4"
      source: "AP Physics 1 CED, Topic 5.4"
      points: 1
      prompt: |
        A uniform rod has mass 0.60 kg and length 1.0 m. Its rotational inertia about its centre is (1/12)ML². Using the parallel-axis theorem, what is its rotational inertia about a parallel axis through one end?
      options:
        - "0.050 kg·m²"
        - "0.15 kg·m²"
        - "0.20 kg·m²"
        - "0.65 kg·m²"
      option_explanations:
        - |
          0.050 kg·m² is the inertia about the centre; moving the axis away from the centre of mass adds Md².
        - |
          0.15 kg·m² is only the Md² term (0.60 × 0.50²); the inertia about the centre must be added to it.
        - |
          Correct. I = I_cm + Md² = (1/12)(0.60)(1.0)² + (0.60)(0.50)² = 0.050 + 0.15 = 0.20 kg·m².
        - |
          0.65 kg·m² uses d = 1.0 m, the rod's length; d is the distance from the centre to the end, 0.50 m.
      answer: 2
    - slug: apphys1-u06-w25-q10
      type: multiple_choice
      topic_code: "6.1"
      source: "AP Physics 1 CED, Topic 6.1"
      points: 1
      prompt: |
        A 6.0 kg bowling ball of radius 0.11 m spins in place on a slippery lane at 25 rad/s about a vertical axis through its centre. Treat it as a uniform solid sphere, I = (2/5)MR². What is its rotational kinetic energy?
      options:
        - "9.1 J"
        - "11 J"
        - "18 J"
        - "23 J"
      option_explanations:
        - |
          Correct. I = (2/5)(6.0)(0.11)² = 0.0290 kg·m², and K = ½Iω² = ½(0.0290)(25)² ≈ 9.1 J.
        - |
          11 J uses a solid disk's inertia, ½MR²; a solid sphere's is (2/5)MR².
        - |
          18 J is Iω² = 0.0290 × 625, the kinetic energy without the ½.
        - |
          23 J treats the ball as a hoop, I = MR², as if all its mass were at the surface.
      answer: 0
    - slug: apphys1-u06-w25-q11
      type: multiple_choice
      topic_code: "4.2"
      source: "AP Physics 1 CED, Topic 4.2"
      points: 1
      prompt: |
        A 0.20 kg ball moving horizontally at 8.0 m/s hits a wall and rebounds straight back at 6.0 m/s. What is the magnitude of the impulse the wall exerts on the ball?
      options:
        - "0.40 N·s"
        - "1.6 N·s"
        - "1.2 N·s"
        - "2.8 N·s"
      option_explanations:
        - |
          0.40 N·s uses the difference of the speeds, ignoring that the velocity reverses direction.
        - |
          1.6 N·s is only the momentum needed to stop the ball; the wall must also send it back at 6.0 m/s.
        - |
          1.2 N·s is only the rebound momentum; the wall first has to stop the incoming ball.
        - |
          Correct. Taking the rebound direction as positive, Δp = (0.20)(6.0) − (0.20)(−8.0) = 2.8 kg·m/s, so the impulse is 2.8 N·s.
      answer: 3
    - slug: apphys1-u06-w25-q12
      type: multiple_choice
      topic_code: "4.3"
      source: "AP Physics 1 CED, Topic 4.3"
      points: 1
      prompt: |
        Two skaters stand at rest on frictionless ice and push off each other. The 50 kg skater moves away at 2.1 m/s. How fast does the 70 kg skater move?
      options:
        - "2.1 m/s"
        - "1.5 m/s"
        - "1.8 m/s"
        - "2.9 m/s"
      option_explanations:
        - |
          Equal speeds would give unequal momenta; the total momentum must stay zero, so the heavier skater moves slower.
        - |
          Correct. Total momentum stays zero: (50)(2.1) = (70)v, so v = 1.5 m/s in the opposite direction.
        - |
          1.8 m/s comes from sharing kinetic energy equally; momentum, not kinetic energy, is what the push conserves.
        - |
          2.9 m/s inverts the mass ratio; the heavier skater must have the smaller speed.
      answer: 1
    - slug: apphys1-u06-w25-q13
      type: multi_select
      topic_code: "6.4"
      source: "AP Physics 1 CED, Topic 6.4"
      points: 2
      partial_credit: true
      prompt: |
        In which situations is the angular momentum of the named system, about the named axis or point, conserved? Select all that apply.
      options:
        - "A diver tucking in mid-air; system: the diver; axis through her centre of mass"
        - "A parent pushing tangentially on the rim of a carousel; system: the carousel alone; its axle"
        - "A child running tangentially and jumping onto a carousel; system: child and carousel; the axle"
        - "A brake pad slowing a spinning bicycle wheel; system: the wheel alone; its axle"
        - "A puck sliding in a straight line on frictionless ice; system: the puck; a post beside its path"
      option_explanations:
        - |
          Correct. Gravity acts at the centre of mass and exerts no torque about it, and air resistance is negligible, so the diver's L is constant while she changes I.
        - |
          The parent's push is an external force with a moment arm about the axle, so it exerts an external torque and changes the carousel's L.
        - |
          Correct. The friction between the child and the deck is internal to this system, and the axle force has no torque about the axle.
        - |
          The brake pad is outside the system and its frictional force exerts an external torque opposing the rotation, so the wheel's L decreases.
        - |
          Correct. No horizontal force acts on the puck, so there is no torque about the post and mvr⊥ stays constant.
      answer: [0, 2, 4]
    - slug: apphys1-u06-w25-q14
      type: multi_select
      topic_code: "6.3"
      source: "AP Physics 1 CED, Topic 6.3"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about angular momentum and angular impulse are true? Select all that apply.
      options:
        - "An object moving in a straight line has zero angular momentum about every point."
        - "If a rigid wheel's angular speed doubles while its rotational inertia stays the same, its angular momentum doubles."
        - "Two wheels spinning at the same angular speed must have the same angular momentum."
        - "The area under a net torque–time graph equals the change in angular momentum."
        - "The same net torque acting for the same time gives the same change in angular momentum to any object it acts on."
      option_explanations:
        - |
          It has L = mvr⊥ about any point off its line of motion; only about points on the line is its angular momentum zero.
        - |
          Correct. L = Iω, so with I fixed, L is proportional to ω.
        - |
          L = Iω also depends on I; wheels with different mass or mass distribution have different L at the same ω.
        - |
          Correct. That area is the net angular impulse, which equals ΔL by the angular impulse–momentum theorem.
        - |
          Correct. ΔL = τΔt does not depend on the object's rotational inertia; the resulting change in ω does.
      answer: [1, 3, 4]
