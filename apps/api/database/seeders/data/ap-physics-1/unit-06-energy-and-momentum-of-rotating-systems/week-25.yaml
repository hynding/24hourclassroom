      source: "AP Physics 1 CED, Topic 6.3"
      points: 3
      prompt: |
        Two wheels start at rest on frictionless axles. Wheel 1 has rotational inertia I and wheel 2 has rotational inertia 2I. Identical motors apply the same constant torque to each wheel for the same time interval.

        (a) Compare the angular momenta of the two wheels at the end of the interval. Justify.
        (b) Compare their angular speeds.
        (c) Compare their rotational kinetic energies, and explain which wheel the motor did more work on.
      answer: |
        (a) Equal. Each receives the same angular impulse τΔt, and ΔL = τΔt, so both end with the same L.
        (b) ω = L/I, so wheel 1 spins twice as fast as wheel 2.
        (c) K = L²/(2I) with equal L, so wheel 1 has twice the kinetic energy of wheel 2. The motor did twice as much work on wheel 1: it turned through twice the angle (it spun faster throughout) under the same torque, and W = τΔθ.
      explanation: |
        Three points, one per part. (a) equal angular momenta, justified by equal angular impulse (τΔt). (b) wheel 1 has twice the angular speed. (c) wheel 1 has twice the kinetic energy, with a reason (K = L²/2I or ½Iω² with the values from (b)) and the link to work (more angle at the same torque, or W = ΔK). Claiming equal kinetic energies because the torques were equal loses this point.
