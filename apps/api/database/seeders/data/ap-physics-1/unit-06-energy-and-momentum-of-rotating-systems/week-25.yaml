      type: long_answer
      topic_code: "6.4"
      source: "AP Physics 1 CED, Topic 6.4"
      points: 6
      prompt: |
        Qualitative/quantitative translation. A playground carousel of rotational inertia I turns freely at angular speed ω₀ about a frictionless vertical axle. A child of mass m runs at speed v along a line tangent to the rim, in the same direction the rim is moving, and jumps on at the rim, a distance R from the axle. Treat the child as a point mass.

        (A) Without equations, explain how the carousel's final angular speed compares with ω₀ when the child's speed v is greater than the rim's speed ω₀R, and what happens to the total kinetic energy of the child–carousel system during the landing. Name the quantity that is conserved and say why.

        (B) Derive an expression for the final angular speed ω_f in terms of I, ω₀, m, v and R.

        (C) Show that your expression from (B) agrees with your reasoning in (A), including the special case v = ω₀R. Then evaluate it for I = 240 kg·m², ω₀ = 0.90 rad/s, m = 35 kg, v = 2.5 m/s and R = 1.8 m.
      answer: |
        (A) Angular momentum of the child–carousel system about the axle is conserved, because the friction between the child and the deck is internal and the axle's force exerts no torque about the axle. Landing faster than the rim, the child drags the rim forward: she brings more angular momentum than she would need just to ride along with the rim, and the excess speeds the carousel up, so it ends faster than ω₀. (Adding her mass at the rim raises I, which on its own would slow the carousel; that is exactly balanced when she lands at the rim's own speed.) The child and the deck slide and then move together, an inelastic collision, so the total kinetic energy decreases; some becomes internal energy.
        (B) L_i = Iω₀ + mvR; L_f = (I + mR²)ω_f. So ω_f = (Iω₀ + mvR)/(I + mR²).
        (C) If v = ω₀R, ω_f = (Iω₀ + mR²ω₀)/(I + mR²) = ω₀: no change, as expected when nothing slips at landing. If v is greater than ω₀R, the numerator exceeds (I + mR²)ω₀, so ω_f is greater than ω₀, matching (A). Numbers: ω_f = (240 × 0.90 + 35 × 2.5 × 1.8)/(240 + 35 × 1.8²) = (216 + 157.5)/(353.4) ≈ 1.06 rad/s, greater than 0.90 rad/s because v = 2.5 m/s exceeds the rim speed 1.62 m/s.
      explanation: |
        Six points.
        (A) 2 points: 1 for naming angular momentum about the axle as conserved with a reason (no external torque: the axle force acts at the axis, the child–deck friction is internal); 1 for both conclusions: ω_f greater than ω₀ when v exceeds the rim speed (child adds angular momentum), and kinetic energy decreases (inelastic, energy to internal). Saying kinetic energy is conserved loses this point.
        (B) 2 points: 1 for L_i = Iω₀ + mvR with the child's mvR term; 1 for I_f = I + mR² and the correct solved expression.
        (C) 2 points: 1 for showing ω_f = ω₀ when v = ω₀R and ω_f greater than ω₀ when v is greater than ω₀R, linked to (A); 1 for ω_f ≈ 1.06 rad/s (accept 1.0 to 1.1 rad/s).
