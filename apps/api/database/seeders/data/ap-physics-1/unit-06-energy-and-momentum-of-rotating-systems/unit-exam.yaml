unit: 6
description: |
  45 questions · about 90 minutes · every topic of Unit 6 (6.1 to 6.6): rotational kinetic energy, work done by
  torques, angular momentum and angular impulse, conservation of angular momentum, rolling without slipping, and
  satellites in circular and elliptical orbits. Includes three shared-context sets (a four-question set on a
  block falling from a massive pulley, a four-question set on a student walking inward on a merry-go-round and a
  three-question set on a probe in an elliptical orbit), select-all, true/false, fill-in-the-blank and numeric
  items, two short-answer questions (3 points each) and two free-response questions in the 2027 AP style: a
  12-point translation between representations question on a ball rolling down a ramp (an 8-point long answer,
  parts A–C, followed by its 4-point part D) and a 10-point experimental design and analysis question on
  measuring a wheel's rotational inertia. Use g = 9.8 m/s² and G = 6.67 × 10⁻¹¹ N·m²/kg². Calculators and the
  equation sheet are allowed throughout. Multiple choice, select-all, true/false and numeric items are graded at
  once; fill-in-the-blank items are matched automatically; the short answers and free-response questions are
  graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set 1: block falling from a massive pulley (6.1, 6.2)
  - slug: apphys1-u06-exam-q01
    type: multiple_choice
    topic_code: "6.1"
    source: "AP Physics 1 CED, Topic 6.1"
    points: 1
    stimulus: |
      A lab group mounts a pulley that is a uniform solid disk of mass 1.6 kg and radius 0.080 m on a fixed, frictionless horizontal axle. A light string wound around the pulley supports a 0.40 kg block. The block is released from rest and falls 1.0 m while the string unwinds without slipping. The system is the block, the pulley and Earth.
    prompt: |
      What is the block's speed after it has fallen 1.0 m?
    options:
      - "4.4 m/s"
      - "1.8 m/s"
      - "2.6 m/s"
      - "2.0 m/s"
    option_explanations:
      - |
        4.4 m/s is the free-fall speed √(2gh); it leaves out the kinetic energy the spinning pulley takes.
      - |
        1.8 m/s comes from mgh = (m + M/2)v², dropping the ½ from the kinetic energy terms.
      - |
        Correct. mgh = ½mv² + ½(½MR²)(v/R)² = ½(m + M/2)v², so v = √(2(0.40)(9.8)(1.0)/(0.40 + 0.80)) ≈ 2.6 m/s.
      - |
        2.0 m/s uses I = MR², a hoop's inertia, giving m + M in the denominator; a solid disk has I = ½MR².
    answer: 2
  - slug: apphys1-u06-exam-q02
    type: multiple_choice
    topic_code: "6.1"
    source: "AP Physics 1 CED, Topic 6.1"
    points: 1
    stimulus: |
      A lab group mounts a pulley that is a uniform solid disk of mass 1.6 kg and radius 0.080 m on a fixed, frictionless horizontal axle. A light string wound around the pulley supports a 0.40 kg block. The block is released from rest and falls 1.0 m while the string unwinds without slipping. The system is the block, the pulley and Earth.
    prompt: |
      After the 1.0 m fall, what fraction of the system's kinetic energy is the pulley's rotational kinetic energy?
    options:
      - "2/3"
      - "1/3"
      - "1/2"
      - "0, because the pulley's centre does not move"
    option_explanations:
      - |
        Correct. K_pulley = ½(½MR²)(v/R)² = ¼Mv² = ½(0.80)v² and K_block = ½(0.40)v², so the pulley's share is 0.80/(0.40 + 0.80) = 2/3 (2.6 J of 3.9 J).
      - |
        1/3 is the block's share; the pulley, with an effective mass M/2 = 0.80 kg, takes the larger part.
      - |
        Equal shares would need the pulley's effective mass M/2 to equal the block's mass; here 0.80 kg is twice 0.40 kg.
      - |
        The pulley's centre is still, but every other part of it moves, so it has rotational kinetic energy ½Iω².
    answer: 0
  - slug: apphys1-u06-exam-q03
    type: multiple_choice
    topic_code: "6.2"
    source: "AP Physics 1 CED, Topic 6.2"
    points: 1
    stimulus: |
      A lab group mounts a pulley that is a uniform solid disk of mass 1.6 kg and radius 0.080 m on a fixed, frictionless horizontal axle. A light string wound around the pulley supports a 0.40 kg block. The block is released from rest and falls 1.0 m while the string unwinds without slipping. The system is the block, the pulley and Earth.
    prompt: |
      Now consider the pulley alone. How much work does the string's tension do on the pulley during the 1.0 m fall?
    options:
      - "3.9 J"
      - "1.3 J"
      - "Zero, because the tension acts at the rim, not through an angle"
      - "2.6 J"
    option_explanations:
      - |
        3.9 J is the whole loss of gravitational potential energy, mgh; part of it goes to the block's kinetic energy, not the pulley's.
      - |
        1.3 J is the block's kinetic energy, ½(0.40)(2.56)²; the pulley's share is twice that.
      - |
        The tension exerts a torque TR about the axle while the pulley turns through Δθ = h/R, so it does work τΔθ = Th.
      - |
        Correct. By the work–energy theorem for the pulley, the tension's work equals the pulley's gain in kinetic energy: ¼Mv² = ¼(1.6)(2.56)² ≈ 2.6 J. (Equivalently the tension is m(g − a) = 2.6 N acting through 1.0 m of string.)
    answer: 3
  - slug: apphys1-u06-exam-q04
    type: multiple_choice
    topic_code: "6.1"
    source: "AP Physics 1 CED, Topic 6.1"
    points: 1
    stimulus: |
      A lab group mounts a pulley that is a uniform solid disk of mass 1.6 kg and radius 0.080 m on a fixed, frictionless horizontal axle. A light string wound around the pulley supports a 0.40 kg block. The block is released from rest and falls 1.0 m while the string unwinds without slipping. The system is the block, the pulley and Earth.
    prompt: |
      The group replaces the pulley with a uniform solid disk of the same mass, 1.6 kg, but twice the radius. How does the block's speed after a 1.0 m fall compare with before?
    options:
      - "It is smaller, because the larger pulley has four times the rotational inertia."
      - "It is the same, because the pulley's kinetic energy at a given block speed is still ¼Mv²."
      - "It is larger, because a larger pulley gives a larger torque."
      - "It is one quarter as large, because I depends on R²."
    option_explanations:
      - |
        I does become four times as large, but ω = v/R is half as large at each block speed, so ½Iω² at a given v is unchanged.
      - |
        Correct. ½(½MR²)(v/R)² = ¼Mv² does not depend on R, so the energy equation, and the speed, are unchanged.
      - |
        The torque TR does double, but the larger pulley turns through half the angle, so the work and energy shares do not change.
      - |
        Even if I alone mattered, speed would change by a square root, not a factor of 4; and here R cancels completely.
    answer: 1
  # ---- Stimulus set 2: student walking inward on a merry-go-round (6.3, 6.4)
  - slug: apphys1-u06-exam-q05
    type: multiple_choice
    topic_code: "6.3"
    source: "AP Physics 1 CED, Topic 6.3"
    points: 1
    stimulus: |
      A playground merry-go-round is a uniform disk of mass 180 kg and radius 1.5 m (I = ½MR²) that turns on a frictionless vertical axle. A 40 kg student stands at its rim, and the merry-go-round and student turn together at 0.80 rad/s. The student then walks along a radius to a point 0.50 m from the axle. Treat the student as a point mass.
    prompt: |
      What is the angular momentum of the merry-go-round–student system about the axle while the student is at the rim?
    options:
      - "162 kg·m²/s"
      - "72 kg·m²/s"
      - "234 kg·m²/s"
      - "396 kg·m²/s"
    option_explanations:
      - |
        162 kg·m²/s is the merry-go-round's angular momentum alone; the student at the rim adds (40)(1.5)²(0.80) = 72 kg·m²/s.
      - |
        72 kg·m²/s is the student's angular momentum alone; the disk contributes (202.5)(0.80) = 162 kg·m²/s.
      - |
        Correct. I = ½(180)(1.5)² + (40)(1.5)² = 202.5 + 90 = 292.5 kg·m², and L = Iω = (292.5)(0.80) = 234 kg·m²/s.
      - |
        396 kg·m²/s uses MR² for the disk instead of ½MR².
    answer: 2
  - slug: apphys1-u06-exam-q06
    type: multiple_choice
    topic_code: "6.4"
    source: "AP Physics 1 CED, Topic 6.4"
    points: 1
    stimulus: |
      A playground merry-go-round is a uniform disk of mass 180 kg and radius 1.5 m (I = ½MR²) that turns on a frictionless vertical axle. A 40 kg student stands at its rim, and the merry-go-round and student turn together at 0.80 rad/s. The student then walks along a radius to a point 0.50 m from the axle. Treat the student as a point mass.
    prompt: |
      What is the angular speed when the student reaches the point 0.50 m from the axle?
    options:
      - "0.80 rad/s"
      - "0.58 rad/s"
      - "0.94 rad/s"
      - "1.1 rad/s"
    option_explanations:
      - |
        The angular speed changes: the system's rotational inertia decreases while its angular momentum stays fixed.
      - |
        0.58 rad/s multiplies by I_f/I_i instead of I_i/I_f; a smaller inertia must give a larger angular speed.
      - |
        0.94 rad/s comes from conserving kinetic energy; the student's legs do work, so kinetic energy is not conserved.
      - |
        Correct. I_f = 202.5 + (40)(0.50)² = 212.5 kg·m², and L is conserved: ω_f = 234 ÷ 212.5 ≈ 1.1 rad/s.
    answer: 3
  - slug: apphys1-u06-exam-q07
    type: multiple_choice
    topic_code: "6.4"
    source: "AP Physics 1 CED, Topic 6.4"
    points: 1
    stimulus: |
      A playground merry-go-round is a uniform disk of mass 180 kg and radius 1.5 m (I = ½MR²) that turns on a frictionless vertical axle. A 40 kg student stands at its rim, and the merry-go-round and student turn together at 0.80 rad/s. The student then walks along a radius to a point 0.50 m from the axle. Treat the student as a point mass.
    prompt: |
      How does the system's rotational kinetic energy change as the student walks inward, and why?
    options:
      - "It increases, from about 94 J to about 129 J, because the student does positive work on the merry-go-round while walking inward."
      - "It stays the same, because no external torque acts on the system."
      - "It decreases, because the student's mass moves closer to the axle, where it moves more slowly."
      - "It increases, because the axle exerts a torque that speeds the system up."
    option_explanations:
      - |
        Correct. K_i = ½(292.5)(0.80)² ≈ 94 J and K_f = ½(212.5)(1.10)² ≈ 129 J. With L fixed, K = L²/(2I) rises as I falls; the energy comes from the work the student's muscles do (internal energy of the student).
      - |
        Zero external torque conserves angular momentum, not kinetic energy; the student's internal forces can do work.
      - |
        The student does move to a smaller radius, but the whole system spins faster, and K = L²/(2I) increases as I decreases.
      - |
        The axle's force acts at the axis and exerts no torque about it; the change comes from the student's work, not an external torque.
    answer: 0
  - slug: apphys1-u06-exam-q08
    type: multiple_choice
    topic_code: "6.3"
    source: "AP Physics 1 CED, Topic 6.3"
    points: 1
    stimulus: |
      A playground merry-go-round is a uniform disk of mass 180 kg and radius 1.5 m (I = ½MR²) that turns on a frictionless vertical axle. A 40 kg student stands at its rim, and the merry-go-round and student turn together at 0.80 rad/s. The student then walks along a radius to a point 0.50 m from the axle. Treat the student as a point mass.
    prompt: |
      Before the walk, a parent started the merry-go-round (with the student already standing at the rim) from rest by pushing tangentially on the rim for 3.0 s. What average tangential force did the parent exert to reach 0.80 rad/s?
    options:
      - "36 N"
      - "52 N"
      - "78 N"
      - "117 N"
    option_explanations:
      - |
        36 N counts only the merry-go-round's angular momentum (162 kg·m²/s); the student at the rim had to be spun up too.
      - |
        Correct. The angular impulse equals ΔL: F R Δt = 234 kg·m²/s, so F = 234 ÷ (1.5 m × 3.0 s) = 52 N.
      - |
        78 N divides ΔL by the time only; the angular impulse is a torque times time, so the radius 1.5 m must divide too.
      - |
        117 N multiplies by the radius instead of dividing; torque is F × R, so F = ΔL/(RΔt).
    answer: 1
  # ---- Stimulus set 3: a probe in an elliptical orbit (6.6)
  - slug: apphys1-u06-exam-q09
    type: multiple_choice
    topic_code: "6.6"
    source: "AP Physics 1 CED, Topic 6.6"
    points: 1
    stimulus: |
      A probe orbits a planet of mass 6.4 × 10²³ kg in an elliptical orbit. At its nearest point the probe is 4.0 × 10⁶ m from the planet's centre and moves at 4.0 × 10³ m/s; at its farthest point it is 1.2 × 10⁷ m from the planet's centre. The planet has no atmosphere, and the planet's motion can be ignored.
    prompt: |
      How fast is the probe moving at its farthest point?
    options:
      - "1.2 × 10⁴ m/s"
      - "4.0 × 10³ m/s"
      - "4.4 × 10² m/s"
      - "1.3 × 10³ m/s"
    option_explanations:
      - |
        1.2 × 10⁴ m/s uses the distance ratio the wrong way; the probe must be slower where it is farther away.
      - |
        The speed is not constant in an elliptical orbit: gravity does negative work as the probe moves outward.
      - |
        4.4 × 10² m/s divides by the square of the distance ratio (9); angular momentum makes v inversely proportional to r.
      - |
        Correct. Gravity exerts no torque about the planet's centre, so mvr is the same at both points (v ⊥ r there): v = (4.0 × 10³)(4.0 × 10⁶)/(1.2 × 10⁷) ≈ 1.3 × 10³ m/s.
    answer: 3
  - slug: apphys1-u06-exam-q10
    type: multiple_choice
    topic_code: "6.6"
    source: "AP Physics 1 CED, Topic 6.6"
    points: 1
    stimulus: |
      A probe orbits a planet of mass 6.4 × 10²³ kg in an elliptical orbit. At its nearest point the probe is 4.0 × 10⁶ m from the planet's centre and moves at 4.0 × 10³ m/s; at its farthest point it is 1.2 × 10⁷ m from the planet's centre. The planet has no atmosphere, and the planet's motion can be ignored.
    prompt: |
      As the probe moves from its nearest point to its farthest point, which statement about the probe–planet system is correct?
    options:
      - "Gravity does positive work on the probe, so the system's mechanical energy increases."
      - "The probe's angular momentum about the planet decreases because its speed decreases."
      - "Gravity does negative work on the probe, kinetic energy becomes gravitational potential energy, and the total mechanical energy is unchanged."
      - "The gravitational potential energy decreases, because the force of gravity gets weaker."
    option_explanations:
      - |
        As the probe moves away, its velocity has a component opposite to gravity, so gravity does negative work; and gravity is internal to the system, so mechanical energy is conserved.
      - |
        Speed decreases but r increases in proportion, so mvr stays the same; gravity exerts no torque about the planet's centre.
      - |
        Correct. The probe slows (its kinetic energy decreases) as U_g = −GMm/r rises toward zero; with no external work and no friction, K + U_g stays constant.
      - |
        U_g = −GMm/r becomes less negative as r grows, so it increases; a weaker force does not mean lower potential energy.
    answer: 2
  - slug: apphys1-u06-exam-q11
    type: multiple_choice
    topic_code: "6.6"
    source: "AP Physics 1 CED, Topic 6.6"
    points: 1
    stimulus: |
      A probe orbits a planet of mass 6.4 × 10²³ kg in an elliptical orbit. At its nearest point the probe is 4.0 × 10⁶ m from the planet's centre and moves at 4.0 × 10³ m/s; at its farthest point it is 1.2 × 10⁷ m from the planet's centre. The planet has no atmosphere, and the planet's motion can be ignored.
    prompt: |
      At its farthest point, the probe fires its engine to enter a circular orbit of radius 1.2 × 10⁷ m. What is the period of the circular orbit?
    options:
      - "4.0 × 10⁴ s"
      - "7.7 × 10³ s"
      - "5.7 × 10⁴ s"
      - "2.3 × 10⁴ s"
    option_explanations:
      - |
        Correct. T = 2π√(r³/GM) = 2π√((1.2 × 10⁷)³/((6.67 × 10⁻¹¹)(6.4 × 10²³))) ≈ 4.0 × 10⁴ s (about 11 h); equivalently v = √(GM/r) ≈ 1.9 × 10³ m/s and T = 2πr/v.
      - |
        7.7 × 10³ s uses r = 4.0 × 10⁶ m, the nearest-point distance; the new circular orbit has r = 1.2 × 10⁷ m.
      - |
        5.7 × 10⁴ s divides the circumference by the probe's elliptical-orbit speed at the farthest point (1.3 × 10³ m/s); a circular orbit at that radius needs the faster speed √(GM/r) ≈ 1.9 × 10³ m/s.
      - |
        2.3 × 10⁴ s triples the period of a circle at the nearest distance because the radius triples; T ∝ r^(3/2), so the factor is 3^(3/2) ≈ 5.2, not 3.
    answer: 0
  # ---- Independent items
  - slug: apphys1-u06-exam-q12
    type: multiple_choice
    topic_code: "6.1"
    source: "AP Physics 1 CED, Topic 6.1"
    points: 1
    prompt: |
      A toy spinner is two 0.50 kg weights fixed at the ends of a light rod, each 0.30 m from the central axle. It spins at 8.0 rad/s. What is its rotational kinetic energy?
    options:
      - "1.4 J"
      - "2.9 J"
      - "5.8 J"
      - "0.72 J"
    option_explanations:
      - |
        1.4 J counts only one weight; I = Σmr² includes both.
      - |
        Correct. I = 2(0.50)(0.30)² = 0.090 kg·m², and K = ½Iω² = ½(0.090)(8.0)² = 2.88 J ≈ 2.9 J.
      - |
        5.8 J is Iω², the kinetic energy without the ½.
      - |
        0.72 J uses half the distance (0.15 m) for each weight; each is 0.30 m from the axle.
    answer: 1
  - slug: apphys1-u06-exam-q13
    type: multiple_choice
    topic_code: "6.1"
    source: "AP Physics 1 CED, Topic 6.1"
    points: 1
    prompt: |
      A uniform solid sphere and a uniform solid disk have the same mass and radius and spin at the same angular speed, each about an axis through its centre (the disk about its symmetry axis). What is K_sphere/K_disk?
    options:
      - "0.8"
      - "1.25"
      - "1"
      - "0.4"
    option_explanations:
      - |
        Correct. K ∝ I at the same ω: (2/5)MR² ÷ (1/2)MR² = 0.4/0.5 = 0.8. The sphere has more of its mass near the axis.
      - |
        1.25 is the inverse ratio, K_disk/K_sphere.
      - |
        Equal mass, radius and ω do not give equal kinetic energy; the shapes have different rotational inertias.
      - |
        0.4 is the sphere's shape factor alone; it must be compared with the disk's ½.
    answer: 0
  - slug: apphys1-u06-exam-q14
    type: multiple_choice
    topic_code: "6.1"
    source: "AP Physics 1 CED, Topic 6.1"
    points: 1
    prompt: |
      A spinning top slows until its angular speed is half of what it was. Its rotational inertia does not change. What fraction of its original rotational kinetic energy remains?
    options:
      - "1/2"
      - "1/√2"
      - "3/4"
      - "1/4"
    option_explanations:
      - |
        1/2 treats K as proportional to ω; K = ½Iω² is proportional to ω².
      - |
        1/√2 inverts the square relationship; it is ω that would fall by √2 if K halved.
      - |
        3/4 is the fraction of the energy that was lost, not the fraction that remains.
      - |
        Correct. K ∝ ω², so halving ω leaves (½)² = 1/4 of the kinetic energy.
    answer: 3
  - slug: apphys1-u06-exam-q15
    type: multiple_choice
    topic_code: "6.2"
    source: "AP Physics 1 CED, Topic 6.2"
    points: 1
    prompt: |
      A drill motor speeds a grinding disk (I = 0.30 kg·m²) from 10 rad/s to 20 rad/s. Friction is negligible. How much work does the motor do on the disk?
    options:
      - "15 J"
      - "60 J"
      - "45 J"
      - "3.0 J"
    option_explanations:
      - |
        15 J is the kinetic energy at 10 rad/s; the work is the change in kinetic energy between the two speeds.
      - |
        60 J is the kinetic energy at 20 rad/s; the disk already had 15 J.
      - |
        Correct. W = ΔK = ½(0.30)(20² − 10²) = ½(0.30)(300) = 45 J.
      - |
        3.0 is IΔω, a change in angular momentum in kg·m²/s, not a work.
    answer: 2
  - slug: apphys1-u06-exam-q16
    type: multiple_choice
    topic_code: "6.2"
    source: "AP Physics 1 CED, Topic 6.2"
    points: 1
    prompt: |
      A wheel with rotational inertia 2.0 kg·m² starts from rest on a frictionless axle. A constant 12 N·m torque acts on it while it turns through 5.0 revolutions. What is its final angular speed?
    options:
      - "7.7 rad/s"
      - "19 rad/s"
      - "14 rad/s"
      - "380 rad/s"
    option_explanations:
      - |
        7.7 rad/s uses 5.0 as the angle in W = τΔθ; the angle must be in radians, 5.0 rev = 10π rad.
      - |
        Correct. W = τΔθ = (12)(10π) = 377 J = ½(2.0)ω², so ω = √377 ≈ 19 rad/s.
      - |
        14 rad/s sets the work equal to Iω², dropping the ½ from the kinetic energy.
      - |
        380 is ω² in rad²/s² (377); the angular speed is its square root.
    answer: 1
  - slug: apphys1-u06-exam-q17
    type: multiple_choice
    topic_code: "6.2"
    source: "AP Physics 1 CED, Topic 6.2"
    points: 1
    prompt: |
      Two students push tangentially with equal forces on a merry-go-round while it turns through the same angle. One pushes at the rim; the other pushes at half the radius. How does the work done by the rim pusher compare with the work done by the other student?
    options:
      - "Equal, because the forces are equal"
      - "Half as much, because the rim moves faster"
      - "Four times as much, because work depends on the radius squared"
      - "Twice as much, because the torque is twice as large while the angle is the same"
    option_explanations:
      - |
        Equal forces do not mean equal work: the rim pusher's hands move through twice the arc length for the same angle.
      - |
        Moving faster through a longer arc means more work, not less; W = τΔθ with twice the torque.
      - |
        Work is torque times angle, and the torque is proportional to the radius, not its square.
      - |
        Correct. τ = rF doubles at the rim, Δθ is the same, so W = τΔθ doubles (equivalently, the rim moves through twice the arc length).
    answer: 3
  - slug: apphys1-u06-exam-q18
    type: multiple_choice
    topic_code: "6.3"
    source: "AP Physics 1 CED, Topic 6.3"
    points: 1
    prompt: |
      A 0.25 kg ball on a string moves in a horizontal circle of radius 0.60 m at a constant 4.0 m/s. What is the magnitude of its angular momentum about the centre of the circle?
    options:
      - "0.60 kg·m²/s"
      - "2.4 kg·m²/s"
      - "1.0 kg·m²/s"
      - "0.36 kg·m²/s"
    option_explanations:
      - |
        Correct. v is perpendicular to r, so L = mvr = (0.25)(4.0)(0.60) = 0.60 kg·m²/s.
      - |
        2.4 multiplies mv² by r, which mixes kinetic energy into the formula; L = mvr.
      - |
        1.0 kg·m/s is the linear momentum mv; angular momentum also multiplies by the radius.
      - |
        0.36 multiplies mv by r², as if L were I times v; L = Iω = (mr²)(v/r) = mvr.
    answer: 0
  - slug: apphys1-u06-exam-q19
    type: multiple_choice
    topic_code: "6.3"
    source: "AP Physics 1 CED, Topic 6.3"
    points: 1
    prompt: |
      Two disks turn on the same frictionless axle without touching. Disk A (I = 0.20 kg·m²) turns counterclockwise at 6.0 rad/s, and disk B (I = 0.30 kg·m²) turns clockwise at 3.0 rad/s. Taking counterclockwise as positive, what is the total angular momentum of the two disks?
    options:
      - "2.1 kg·m²/s"
      - "0"
      - "0.30 kg·m²/s"
      - "−0.30 kg·m²/s"
    option_explanations:
      - |
        2.1 adds the magnitudes (1.2 + 0.90); the disks turn in opposite senses, so their angular momenta have opposite signs.
      - |
        The magnitudes 1.2 and 0.90 kg·m²/s are not equal, so the total is not zero.
      - |
