      | U_g | 1 (all of the energy) | 0 |
      | K_trans | 0 | 5/7 |
      | K_rot | 0 | 2/7 |
      | Transferred in or out | 0 | 0 |
      Static friction does no work (the contact point does not slip), so nothing is transferred out, and the final bars add up to the initial U_g bar. The split follows from K_rot = ½(2/5)MR²(v/R)² = (2/5)(½Mv²).
      (C) Mgh = ½Mv² + ½(2/5)MR²(v/R)² = (7/10)Mv², so v² = (10/7)gh ≈ 1.43gh. For the frictionless sliding block there is no rotation: the K_rot row is zero and the whole bar goes into K_trans, so Mgh = ½Mv² and v² = 2gh, larger than the rolling ball's.
    explanation: |
      Eight points.
      (A) 3 points: 1 for gravity (downward, at the centre) and the normal force (perpendicular to the ramp, at the contact point); 1 for static friction up the slope at the contact point; 1 for the reasoning: friction is the only force with a torque about the centre, and that torque must increase the spin as the ball speeds up. Friction drawn down the slope, or an extra "rolling force", loses the second point.
      (B) 3 points: 1 for U_g only at the top and U_g zero (or reduced) at the bottom; 1 for both K_trans and K_rot nonzero at the bottom with K_trans larger, in the ratio 5:2 (fractions 5/7 and 2/7) or with the ratio justified; 1 for zero energy transferred (friction does no work) and the bars balancing. A chart that shows friction removing energy loses the third point.
      (C) 2 points: 1 for an energy equation consistent with the chart, using ω = v/R, leading to v² = (10/7)gh; 1 for stating that the sliding block's chart has no K_rot and all the energy in K_trans, giving v² = 2gh (larger speed).
  - slug: apphys1-u06-exam-q44
    type: short_answer
    topic_code: "6.5"
    source: "AP Physics 1 CED, Topic 6.5"
    points: 4
    stimulus: |
      Translation between representations (12 points in all: parts A–C here, part D in the next question). A uniform solid ball of mass M and radius R (I = (2/5)MR² about its centre) is released from rest at the top of a straight ramp inclined at an angle θ above the horizontal. It rolls without slipping to the bottom of the ramp, a vertical distance h below its starting point. Air resistance is negligible.
    prompt: |
      Part D of the translation between representations question. A lab group releases the ball from several starting heights and measures its speed at the bottom with a photogate:

      | h (m) | 0.10 | 0.20 | 0.30 | 0.40 | 0.50 |
      |---|---|---|---|---|---|
      | v² (m²/s²) | 1.38 | 2.83 | 4.18 | 5.64 | 6.95 |

      (i) Describe the graph of v² against h that your expression from part (C) predicts: its shape, where it crosses the axes and its slope, as a number.
      (ii) Use the data to find the experimental slope, and say whether the data agree with your prediction.
      (iii) On the same axes, describe the predicted line for a thin-walled pipe (I = MR²) rolling without slipping, and explain, using the energy bar charts, why its line is less steep.
    answer: |
      (i) A straight line through the origin (v² = 0 when h = 0), because v² = (10/7)gh is proportional to h; slope 10g/7 = 14.0 m/s².
      (ii) The points lie close to a straight line through the origin; using the first and last points, slope = (6.95 − 1.38)/(0.50 − 0.10) ≈ 13.9 m/s² (a best-fit line gives about 14.0 m/s²). That is within about 1% of 14.0 m/s², so the data agree with the prediction, which also supports the claim in (B) that friction removed no energy.
      (iii) For the pipe, Mgh = ½Mv² + ½(MR²)(v/R)² = Mv², so v² = gh: another straight line through the origin, slope 9.8 m/s², less steep. The pipe's bar chart at the bottom splits the energy half and half between K_trans and K_rot (instead of 5/7 and 2/7 for the ball), so less of the same U_g becomes translational kinetic energy and v² is smaller at every height.
    explanation: |
      Four points. 1 point: (i) straight line through the origin with predicted slope 10g/7 ≈ 14 m/s². 1 point: (ii) an experimental slope from the data between 13.5 and 14.3 m/s², with work shown (two well-separated points or a best-fit line, not a single data point divided by its h unless justified). 1 point: (ii) a conclusion comparing the slopes (agreement within a few percent). 1 point: (iii) the pipe's line through the origin with slope g ≈ 9.8 m/s², justified by its bar chart putting half the energy into rotation (versus 2/7 for the ball). A pipe line that does not pass through the origin, or a claim that the pipe is faster, loses the last point.
  # ---- Free response 2: experimental design and analysis (10 points)
  - slug: apphys1-u06-exam-q45
    type: long_answer
    topic_code: "6.1"
    source: "AP Physics 1 CED, Topic 6.1"
    points: 10
    prompt: |
      Experimental design and analysis. A lab group wants to find the rotational inertia I of a bicycle wheel about its axle. The wheel is mounted on a low-friction horizontal axle. A light string is wound around the wheel's hub, which has radius r, and a block of mass m hangs from the string. When the block is released from rest it falls and spins the wheel; the string does not slip on the hub.

      (A) Describe a procedure the group could use to collect the data needed to determine I using energy. Name each quantity they should measure, the equipment for each, and at least one way to reduce experimental uncertainty.

      (B) Starting from conservation of energy for the block–wheel–Earth system, derive an equation that relates the block's speed v after it has fallen a height h to h, m, r, I and g. Identify the quantities the group should graph to get a straight line, and write the slope in terms of m, r, I and g.

      (C) The group uses m = 0.50 kg and a hub of radius r = 0.050 m and records:

      | Height fallen h (m) | 0.20 | 0.40 | 0.60 | 0.80 | 1.00 |
      |---|---|---|---|---|---|
      | Speed v (m/s) | 0.29 | 0.39 | 0.50 | 0.56 | 0.64 |

      Add a row for the quantity your graph needs and determine the slope of the best straight line, showing your method.

      (D) Use your slope to calculate the rotational inertia of the wheel.

      (E) A student suggests the axle's friction made the measured speeds too small. If so, would the value of I calculated in (D) be larger or smaller than the true value? Explain.
    answer: |
      (A) Measure the block's mass m with a balance and the hub radius r with calipers (half the measured diameter). Wind the string, mark the block's starting position and release it from rest; measure the height fallen h with a metre stick, and the block's speed v at the end of that drop with a photogate (or a motion sensor) placed at h. Repeat for at least five different heights, doing three trials at each height and averaging the speeds. Ways to reduce uncertainty: release without pushing (hold and let go, or use a release clamp), repeat and average, use a wide range of heights, and check the axle spins freely (low friction).
      (B) mgh = ½mv² + ½Iω², with ω = v/r: mgh = ½(m + I/r²)v², so v² = [2mg/(m + I/r²)] h. Graph v² (vertical) against h (horizontal): a straight line through the origin with slope 2mg/(m + I/r²).
      (C) v² (m²/s²): 0.084, 0.152, 0.250, 0.314, 0.410. A best-fit line through these points has slope ≈ 0.41 m/s² (from the first and last points, (0.410 − 0.084)/(1.00 − 0.20) ≈ 0.41 m/s²).
      (D) Slope = 2mg/(m + I/r²), so I/r² = 2mg/slope − m = 2(0.50)(9.8)/0.41 − 0.50 ≈ 23.4 kg, and I ≈ 23.4 × (0.050)² ≈ 0.059 kg·m² (about 0.06 kg·m²).
      (E) Larger. Friction transfers some of the energy to internal energy, so each measured speed, and the slope, is smaller than it would be without friction. In I = r²(2mg/slope − m), a smaller slope gives a larger I: the group would attribute the energy lost to friction to the wheel's rotation, overestimating the inertia.
    explanation: |
      Ten points.
      (A) 3 points: 1 for measuring m, r, h and v (all four) with appropriate equipment (balance, calipers or ruler, metre stick, photogate or motion sensor; or h and the fall time t with v = 2h/t for a constant acceleration); 1 for varying h over several values from rest with a coherent sequence of steps; 1 for a valid way to reduce uncertainty (repeated trials averaged, wide range of heights, consistent release, minimising friction).
      (B) 3 points: 1 for an energy equation including both the block's translational and the wheel's rotational kinetic energy; 1 for using ω = v/r to get v² = 2mgh/(m + I/r²) or equivalent; 1 for choosing v² against h (or h against v², with the reciprocal slope) and giving the slope correctly.
      (C) 2 points: 1 for the v² row computed correctly; 1 for a slope between 0.39 and 0.43 m/s² found from a line (two well-separated points on it or a best fit), not from one data point.
      (D) 1 point: I between 0.054 and 0.064 kg·m², consistent with the slope in (C) (follow-through accepted).
      (E) 1 point: "larger", with reasoning that friction lowers the speeds and the slope, and a smaller slope gives a larger calculated I.
