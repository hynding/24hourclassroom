    prompt: |
      A heavy, thin-walled steel pipe (I = MR²) and a light, solid wooden cylinder (I = ½MR²) of the same radius are released together from rest at the top of a ramp and roll without slipping. A student predicts that the steel pipe will win because it is heavier.

      (a) Which object reaches the bottom first? Justify your answer with an energy argument that does not use numbers.
      (b) Derive the speed of each at the bottom in terms of g and the height h of the ramp, and use the expressions to show that the masses do not matter.
