      (a) The wooden cylinder. Each object turns the same gravitational energy per kilogram into kinetic energy, but the pipe, with all its mass at the radius, must put a larger share (half) into rotation, while the solid cylinder puts only a third into rotation. The cylinder has more energy per kilogram left for moving forward, so it is faster at every height and wins.
      (b) Mgh = ½M(1 + β)v², so v = √(2gh/(1 + β)). Pipe: v = √(gh); cylinder: v = √(4gh/3). M cancels from both sides of each equation, so the mass does not appear in either result.
