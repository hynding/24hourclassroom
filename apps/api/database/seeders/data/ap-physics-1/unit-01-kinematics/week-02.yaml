week: 2
unit: 1
title: "Representing Motion: Graphs, Kinematic Equations and Free Fall"
topics: ["1.3"]
guide: guides/week-02.md
guide_description: |
  Position–time, velocity–time and acceleration–time graphs (slope gives velocity or acceleration, area gives
  displacement or change in velocity, area below the axis counts as negative), motion diagrams, the four
  constant-acceleration equations and where they come from, and free fall with g = 9.8 m/s². Worked examples:
  a car between two stop signs read from a velocity table into accelerations, a 114 m displacement and matching
  x–t and a–t descriptions; a cyclist's 19 m stopping distance and why doubling the speed quadruples it; a stone
  dropped 20 m from a footbridge with the scaling t = √(2h/g); and a velocity table for a ball tossed up at
  12 m/s.
flashcards_description: |
  30 cards on reading and translating x–t, v–t and a–t graphs, slopes and areas, motion diagrams, choosing
  among the constant-acceleration equations, stopping distance and its square-law dependence on speed, free
  fall up and down, and three error-spot cards.

flashcards:
  - front: Slope of a position–time graph → what it gives
    back: |
      The velocity (instantaneous velocity from the tangent slope at a point). A negative slope is motion in the negative direction.
    topic_code: "1.3"
  - front: Straight-line x–t graph versus curved x–t graph → what each means
    back: |
      Straight line: constant velocity. Curved: changing velocity (steeper and steeper = speeding up; flatter and flatter = slowing down).
    topic_code: "1.3"
  - front: Horizontal tangent on an x–t graph → what is happening
    back: |
      The velocity is zero at that instant: the object is at rest or turning around (a peak or valley of the graph).
    topic_code: "1.3"
  - front: Slope of a velocity–time graph → what it gives
    back: |
      The acceleration. A straight v–t line means constant acceleration.
    topic_code: "1.3"
  - front: Area between a v–t graph and the time axis → what it gives
    back: |
      The displacement. Area above the axis is positive displacement, below is negative; add with signs for net displacement, sizes for distance.
    topic_code: "1.3"
  - front: Area under an acceleration–time graph → what it gives
    back: |
      The change in velocity over that interval.
    topic_code: "1.3"
  - front: v–t graph crossing the time axis → meaning
    back: |
      The object momentarily stops and reverses direction there.
    topic_code: "1.3"
  - front: v–t graph moving toward the time axis → speeding up or slowing down?
    back: |
      Slowing down: the speed (distance from the axis) is decreasing, whatever the sign of the velocity.
    topic_code: "1.3"
  - front: Car v–t table 0 → 12 m/s in 4 s, 12 m/s until 10 s, 0 at 13 s → total displacement
    back: |
      Areas 24 + 72 + 18 = 114 m; average velocity 114/13 ≈ 8.8 m/s.
    topic_code: "1.3"
  - front: Car between stop signs → the matching a–t graph
    back: |
      Three flat steps: +3.0 m/s² (0–4 s), 0 (4–10 s), −4.0 m/s² (10–13 s). Its net area is zero: the car starts and ends at rest.
    topic_code: "1.3"
  - front: Motion diagram with dots getting farther apart → motion
    back: |
      Speeding up: more distance covered in each equal time interval. Evenly spaced dots mean constant velocity.
    topic_code: "1.3"
  - front: Constant-acceleration equation with no Δx → which one
    back: |
      v = v₀ + at.
    topic_code: "1.3"
  - front: Constant-acceleration equation with no final velocity → which one
    back: |
      x = x₀ + v₀t + ½at².
    topic_code: "1.3"
  - front: Constant-acceleration equation with no time → which one
    back: |
      v² = v₀² + 2a(x − x₀).
    topic_code: "1.3"
  - front: Constant-acceleration equation with no acceleration → which one
    back: |
      x − x₀ = ½(v₀ + v)t: the area of the trapezoid under the v–t line.
    topic_code: "1.3"
  - front: Where the kinematic equations come from without calculus → the idea
    back: |
      The v–t graph of constant acceleration is a straight line: its slope gives v = v₀ + at and its trapezoid area gives Δx = ½(v₀ + v)t.
    topic_code: "1.3"
  - front: When the kinematic equations do not apply → condition
    back: |
      When the acceleration is not constant. Split the motion into stages of constant acceleration and solve each.
    topic_code: "1.3"
  - front: Cyclist at 15 m/s braking at 6.0 m/s² → stopping distance and time
    back: |
      Δx = 15²/(2 × 6.0) ≈ 19 m; t = 15/6.0 = 2.5 s.
    topic_code: "1.3"
  - front: Braking distance when the initial speed doubles (same brakes) → factor
    back: |
      Four times as far, because Δx = v₀²/(2|a|). The stopping time only doubles.
    topic_code: "1.3"
  - front: Free-fall acceleration near Earth → value and direction
    back: |
      9.8 m/s² downward for every object, whatever its mass, while air resistance is negligible.
    topic_code: "1.3"
  - front: Stone dropped from rest 20 m above a creek → time and impact speed
    back: |
      t = √(2h/g) = √(40/9.8) ≈ 2.0 s; v = √(2gh) ≈ 19.8 m/s.
    topic_code: "1.3"
  - front: Drop height multiplied by 4 → effect on fall time
    back: |
      The fall time doubles, because t = √(2h/g) is proportional to √h.
    topic_code: "1.3"
  - front: Ball tossed up at 12 m/s → time to the top and maximum height
    back: |
      t = 12/9.8 ≈ 1.22 s; h = 12²/(2 × 9.8) ≈ 7.3 m.
    topic_code: "1.3"
  - front: v–t graph of a ball tossed straight up and caught → its shape
    back: |
      One straight line of slope −9.8 m/s² (up positive), from +v₀ through zero at the top to −v₀ at the catch.
    topic_code: "1.3"
  - front: Ball thrown up and caught at the same height → return speed
    back: |
      The same speed it was thrown with, now directed downward (air resistance negligible); time up equals time down.
    topic_code: "1.3"
  - front: Cart on a ramp from rest, distance d against time t → what to graph for a straight line
    back: |
      d against t²: d = ½at², so the slope is a/2 and the acceleration is twice the slope.
    topic_code: "1.3"
  - front: Sign convention for free fall with up as positive → value of a
    back: |
      a = −9.8 m/s² during the whole flight, going up, at the top, and coming down.
    topic_code: "1.3"
  - front: Error-spot → "at the top of its flight the ball's acceleration is zero"
    back: |
      Only the velocity is zero. The acceleration stays 9.8 m/s² downward; otherwise the ball would hover.
    topic_code: "1.3"
  - front: Error-spot → "the x–t graph is higher, so the object is moving faster"
    back: |
      Height on an x–t graph is position. Speed is the steepness (slope) of the graph.
    topic_code: "1.3"
  - front: Error-spot → "Δx = v₀t + at² for a cart accelerating from rest"
    back: |
      The ½ is missing: Δx = v₀t + ½at². Dropping it doubles the displacement.
    topic_code: "1.3"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topic 1.3: position–time, velocity–time and
    acceleration–time graphs, slopes and areas, motion diagrams, the constant-acceleration equations and free
    fall), with 8 questions (35%) reviewing week 1 (scalars and vectors, displacement, average velocity and
    acceleration, speeding up versus slowing down). The long answer is an experimental design and analysis
    question on a cart rolling down a ramp. Multiple choice, select-all, true/false and numeric items are graded
    at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded
    by your teacher against the scoring notes. Calculator allowed throughout, as on the AP exam.
  questions:
    - slug: apphys1-u01-w02-q01
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        A cart's position–time graph is a straight line that slopes downward from x = 4.0 m at t = 0 to x = 1.0 m at t = 3.0 s. Which describes the cart's motion?
      options:
        - "It is slowing down, because its position is decreasing."
        - "It is speeding up in the negative direction."
        - "It moves at a constant velocity of −1.0 m/s."
        - "It moves at a constant velocity of +1.0 m/s, because speeds are positive."
      option_explanations:
        - |
          A decreasing position means motion in the negative direction, not slowing down; a straight x–t line means the speed is not changing.
        - |
          Speeding up would make the x–t graph curve and get steeper. A straight line has a constant slope, so constant velocity.
        - |
          Correct. The slope is (1.0 − 4.0)/3.0 = −1.0 m/s, and a straight line means this velocity is constant.
        - |
          The speed is 1.0 m/s, but the velocity carries the sign of the slope, which is negative here.
      answer: 2
    - slug: apphys1-u01-w02-q02
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        A scooter's velocity–time graph is a straight line from 2.0 m/s at t = 0 to 8.0 m/s at t = 3.0 s. What is the scooter's displacement during those 3.0 s?
      options:
        - "15 m"
        - "24 m"
        - "6.0 m"
        - "2.0 m"
      option_explanations:
        - |
          Correct. The displacement is the trapezoid area under the line: ½(2.0 + 8.0)(3.0) = 15 m.
        - |
          This uses the final velocity for the whole interval (8.0 × 3.0), as if the scooter had moved at 8.0 m/s throughout.
        - |
          6.0 m/s is the change in velocity read off the graph, not an area, and it has the wrong unit for a displacement.
        - |
          2.0 m/s² is the slope (the acceleration), not the area under the graph.
      answer: 0
    - slug: apphys1-u01-w02-q03
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        What does the slope of a velocity–time graph represent?
      options:
        - "The displacement of the object"
        - "The position of the object"
        - "The speed of the object"
        - "The acceleration of the object"
      option_explanations:
        - |
          Displacement is the area between a v–t graph and the time axis, not its slope.
        - |
          Position is read from the height of an x–t graph; a v–t graph does not show position directly.
        - |
          Speed is read from the height of a v–t graph (ignoring the sign), not its slope.
        - |
          Correct. Slope = Δv/Δt, which is the definition of acceleration.
      answer: 3
    - slug: apphys1-u01-w02-q04
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        A cart starts from rest and accelerates uniformly at 1.5 m/s² along a level track for 4.0 s. How far does it travel?
      options:
        - "6.0 m"
        - "12 m"
        - "24 m"
        - "3.0 m"
      option_explanations:
        - |
          1.5 × 4.0 = 6.0 is the final velocity in m/s, not a distance.
        - |
          Correct. Δx = v₀t + ½at² = 0 + ½(1.5)(4.0)² = 12 m.
        - |
          This drops the ½ in ½at², giving 1.5 × 16 = 24 m.
        - |
          This uses t instead of t², ½ × 1.5 × 4.0 = 3.0.
      answer: 1
    - slug: apphys1-u01-w02-q05
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        A stone is dropped from rest off a high cliff. Air resistance is negligible. What is its speed 3.0 s after release?
      options:
        - "29 m/s"
        - "44 m/s"
        - "9.8 m/s"
        - "15 m/s"
      option_explanations:
        - |
          Correct. v = v₀ + gt = 0 + 9.8 × 3.0 ≈ 29 m/s (29.4 m/s).
        - |
          44 m is the distance fallen, ½gt² = ½(9.8)(9.0) ≈ 44 m, not the speed.
        - |
          9.8 m/s is the speed gained in each second; after 3.0 s the stone has gained three times that.
        - |
          This includes a stray ½, ½gt = 14.7 m/s. The ½ belongs in the displacement equation, not in v = v₀ + at.
      answer: 0
    - slug: apphys1-u01-w02-q06
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        A driver brakes to a stop with a constant acceleration. If she had been driving three times as fast, with the same braking acceleration, how would her braking distance compare?
      options:
        - "Three times as long"
        - "The same, because the brakes are the same"
        - "Nine times as long"
        - "About 1.7 times as long"
      option_explanations:
        - |
          The stopping time triples, but the distance depends on v₀², not v₀.
        - |
          The same brakes give the same acceleration, but a faster car needs more distance to lose its larger speed.
        - |
          Correct. From v² = v₀² + 2aΔx with v = 0, Δx = v₀²/(2|a|); tripling v₀ multiplies Δx by 3² = 9.
        - |
          This uses √3 ≈ 1.7, inverting the square law. Distance grows with the square of the speed, not its square root.
      answer: 2
    - slug: apphys1-u01-w02-q07
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        A volleyball is hit straight up and later falls back down. Air resistance is negligible. How does its acceleration on the way up compare with its acceleration on the way down?
      options:
        - "Upward on the way up and downward on the way down"
        - "Larger on the way up, because the ball is moving faster just after the hit"
        - "Zero on the way up until it reaches the top, then 9.8 m/s² downward"
        - "The same, 9.8 m/s² downward, on both parts of the flight"
      option_explanations:
        - |
          This confuses acceleration with velocity. The velocity is upward on the way up, but it is decreasing, so the acceleration is downward.
        - |
          Acceleration in free fall does not depend on speed; it is the same 9.8 m/s² whatever the velocity.
        - |
          If the acceleration were zero on the way up, the ball would keep rising at constant speed and never turn around.
        - |
          Correct. Once the ball leaves the hand, only gravity acts, so its acceleration is 9.8 m/s² downward the whole time.
      answer: 3
    - slug: apphys1-u01-w02-q08
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        A motion sensor records a toy truck's position each second: at t = 0, 1, 2 and 3 s it is at x = 10, 8, 4 and −2 m. What are the signs of the truck's velocity and acceleration during this time?
      options:
        - "Velocity positive, acceleration negative"
        - "Velocity negative, acceleration negative"
        - "Velocity negative, acceleration positive"
        - "Velocity negative, acceleration zero"
      option_explanations:
        - |
          The position is decreasing, so the velocity is negative, not positive.
        - |
          Correct. The steps are −2, −4 and −6 m: the truck moves in the negative direction (v negative) and the steps grow, so it speeds up in that direction (a negative, −2 m/s²).
        - |
          A positive acceleration with a negative velocity would mean slowing down, so the steps would shrink; here they grow.
        - |
          Zero acceleration would give equal steps; the steps grow from 2 m to 6 m.
      answer: 1
    - slug: apphys1-u01-w02-q09
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        A basketball is launched straight up at 15 m/s. Air resistance is negligible. How high above the launch point does it rise?
      options:
        - "23 m"
        - "1.5 m"
        - "11 m"
        - "0.77 m"
      option_explanations:
        - |
          This divides v₀² by g instead of 2g (225/9.8 ≈ 23), dropping the 2 from v² = v₀² + 2aΔy.
        - |
          v₀/g ≈ 1.5 is the time to the top in seconds, not the height in metres.
        - |
          Correct. At the top v = 0, so 0 = 15² − 2(9.8)h and h = 225/19.6 ≈ 11 m (11.5 m).
        - |
          This divides v₀ by 2g (15/19.6 ≈ 0.77), forgetting to square the launch speed.
      answer: 2
    - slug: apphys1-u01-w02-q10
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        A camera drone flies 40 m east in 8.0 s and then 10 m west in 2.0 s. What is its average velocity for the 10.0 s flight?
      options:
        - "5.0 m/s east"
        - "0 m/s"
        - "3.0 m/s west"
        - "3.0 m/s east"
      option_explanations:
        - |
          This is the average speed, total distance 50 m divided by 10 s; average velocity uses displacement.
        - |
          This averages the leg velocities, +5.0 and −5.0 m/s. The drone does not return to its start, so its displacement is not zero.
        - |
          The size is right, but the drone ends 30 m east of its start, so the average velocity points east.
        - |
          Correct. Displacement = 40 − 10 = 30 m east; v_avg = 30 m / 10.0 s = 3.0 m/s east.
      answer: 3
    - slug: apphys1-u01-w02-q11
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        A puck's velocity changes from +8.0 m/s to +2.0 m/s in 3.0 s. What is its average acceleration?
      options:
        - "−2.0 m/s²"
        - "+2.0 m/s²"
        - "−3.3 m/s²"
        - "+0.50 m/s²"
      option_explanations:
        - |
          Correct. a = (2.0 − 8.0)/3.0 = −2.0 m/s². The velocity is positive and decreasing, so the acceleration is negative.
        - |
          This takes the size of the change but loses its sign; the velocity decreased, so Δv is negative.
        - |
          This adds the two velocities, (2.0 + 8.0)/3.0 ≈ 3.3; acceleration uses their difference.
        - |
          This inverts the ratio, Δt/|Δv| = 3.0/6.0. Acceleration is Δv/Δt.
      answer: 0
    - slug: apphys1-u01-w02-q12
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Physics 1 CED, Topic 1.1"
      points: 1
      prompt: |
        Floors in an office building are 3.0 m apart. An elevator goes from floor 2 up to floor 7, then down to floor 4. Taking up as positive, what is the elevator's displacement?
      options:
        - "+24 m"
        - "+6.0 m"
        - "+12 m"
        - "−9.0 m"
      option_explanations:
        - |
          This is the distance: 5 floors up plus 3 floors down is 8 floors, or 24 m. Displacement only compares start and finish.
        - |
          Correct. The elevator ends 2 floors above where it started: Δx = (4 − 2) × 3.0 m = +6.0 m.
        - |
          12 m is the height of floor 4 above the ground floor, a position, not the change in position from floor 2.
        - |
          This uses only the downward leg (3 floors). Displacement covers the whole trip, from floor 2 to floor 4.
      answer: 1
    - slug: apphys1-u01-w02-q13
      type: multi_select
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 2
      partial_credit: true
      prompt: |
        A car's velocity along a straight road is recorded every 2.0 s. Between readings, the velocity changes at a steady rate.

        | t (s) | 0 | 2 | 4 | 6 | 8 |
        |---|---|---|---|---|---|
        | v (m/s) | 6 | 6 | 2 | −2 | −2 |

        Which statements are true? Select all that apply.
      options:
        - "From t = 2 s to t = 6 s, the car's acceleration is −2.0 m/s²."
        - "From t = 6 s to t = 8 s, the car is at rest."
        - "The car reverses direction at t = 5 s."
        - "The car's displacement from t = 0 to t = 4 s is 20 m."
        - "The car's acceleration is zero at the instant it reverses direction."
      option_explanations:
        - |
          Correct. Slope = (−2 − 6)/(6 − 2) = −8/4 = −2.0 m/s².
        - |
          The velocity is a constant −2 m/s, so the car moves steadily in the negative direction; at rest would need v = 0.
        - |
          Correct. The velocity falls 2.0 m/s each second from 2 m/s at t = 4 s, so it crosses zero at t = 5 s, where the car turns around.
        - |
          Correct. Area = 6 × 2 (rectangle, 0–2 s) + ½(6 + 2)(2) (trapezoid, 2–4 s) = 12 + 8 = 20 m.
        - |
          At t = 5 s the velocity is zero but still changing at −2.0 m/s²; zero velocity does not mean zero acceleration.
      answer: [0, 2, 3]
    - slug: apphys1-u01-w02-q14
      type: multi_select
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 2
      partial_credit: true
      prompt: |
        A runner's velocity changes from −10 m/s to −4 m/s as she approaches the finish line. Which statements are true? Select all that apply.
      options:
        - "Her speed is decreasing."
        - "Her acceleration is negative."
        - "She is moving in the negative direction."
        - "Her acceleration is positive."
        - "She is speeding up."
      option_explanations:
        - |
          Correct. Her speed falls from 10 m/s to 4 m/s.
        - |
          Δv = −4 − (−10) = +6 m/s, so the acceleration is positive, not negative.
        - |
          Correct. Both velocities are negative, so she moves in the negative direction throughout.
        - |
          Correct. Δv is positive, so the acceleration is positive, opposite to her velocity, which is why she slows.
        - |
          Her speed drops from 10 to 4 m/s, so she is slowing down.
      answer: [0, 2, 3]
    - slug: apphys1-u01-w02-q15
      type: true_false
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        True or false: If a heavy steel ball and a light plastic ball of the same size are dropped together from a 2 m table, with air resistance negligible, the steel ball lands first.
      answer: false
      explanation: |
        False. In free fall every object has the same acceleration, 9.8 m/s² downward, whatever its mass. Released together from the same height, both balls land at the same moment, after t = √(2h/g) = √(4/9.8) ≈ 0.64 s.
    - slug: apphys1-u01-w02-q16
      type: true_false
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        True or false: An object can have zero velocity at an instant while its acceleration is not zero.
      answer: true
      explanation: |
        True. A car reversing direction, or a ball at the top of its flight, is momentarily at rest while its velocity is still changing. Acceleration is the rate of change of velocity, not the velocity itself.
    - slug: apphys1-u01-w02-q17
      type: fill_blank
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        A go-kart starts from rest and accelerates uniformly at 2.0 m/s² for 5.0 s. Its speed at the end of the 5.0 s is ____ m/s.
      answer: ["10", "10.0", "ten"]
      explanation: |
        v = v₀ + at = 0 + (2.0)(5.0) = 10 m/s.
    - slug: apphys1-u01-w02-q18
      type: fill_blank
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        A student bikes 1.2 km along a winding path in 4.0 minutes. Her average speed is ____ m/s.
      answer: ["5", "5.0", "five"]
      explanation: |
        Average speed = distance/time = 1200 m / 240 s = 5.0 m/s. Convert both to SI units first.
    - slug: apphys1-u01-w02-q19
      type: numeric
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        A small plane starts from rest and accelerates uniformly at 3.0 m/s² along a runway. What is its speed after it has travelled 600 m? Give your answer in m/s, to two significant figures.
      answer: { value: 60, tolerance: 0.6 }
      explanation: |
        No time is given, so use v² = v₀² + 2aΔx = 0 + 2(3.0)(600) = 3600 m²/s², v = 60 m/s.
    - slug: apphys1-u01-w02-q20
      type: numeric
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        A sprinter's velocity increases from 2.0 m/s to 7.0 m/s in 2.5 s as she leaves the blocks. What is the magnitude of her average acceleration? Give your answer in m/s², to two significant figures.
      answer: { value: 2.0, tolerance: 0.02 }
      explanation: |
        a = Δv/Δt = (7.0 − 2.0)/2.5 = 5.0/2.5 = 2.0 m/s².
    - slug: apphys1-u01-w02-q21
      type: short_answer
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 3
      prompt: |
        A motion sensor sits at the bottom of a straight ramp, and "up the ramp" is positive. At t = 0 a cart at the bottom is given a quick push up the ramp. It slows, stops momentarily at t = 1.5 s, and rolls back down, reaching the bottom at t = 3.0 s. Friction is negligible, so the cart's acceleration is constant after the push.

        (a) Describe the shape of the position–time graph from t = 0 to t = 3.0 s.
        (b) Describe the velocity–time graph, including its value at t = 1.5 s and the sign of its slope.
        (c) Describe the acceleration–time graph, and explain how it is consistent with your answer to (b).
      answer: |
        (a) A curve that starts at x = 0, rises while getting less steep, reaches a peak (horizontal tangent) at t = 1.5 s, then falls, getting steeper, back to x = 0 at t = 3.0 s: a downward-opening, symmetric hump.
        (b) A single straight line with negative slope: it starts at a positive velocity, crosses zero at t = 1.5 s (the turnaround), and ends at the negative of the starting velocity at t = 3.0 s.
        (c) A horizontal line at one constant negative value (directed down the ramp) for the whole 3.0 s. It is consistent with (b) because the slope of the v–t line is constant and negative, and the slope of a v–t graph is the acceleration.
      explanation: |
        Three points, one per part. (a) a hump with its peak (zero slope) at t = 1.5 s, symmetric, returning to the start. (b) a straight line with negative slope crossing zero at 1.5 s (a v–t graph that bends or has v = 0 elsewhere does not earn the point). (c) a constant negative acceleration, including at t = 1.5 s, with the link "slope of v–t = acceleration". Saying the acceleration is zero at the top loses the point.
    - slug: apphys1-u01-w02-q22
      type: short_answer
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 2
      prompt: |
        Cart P has a velocity of +2.0 m/s and an acceleration of +1.0 m/s². Cart Q has a velocity of +8.0 m/s and zero acceleration. A student claims that Q has the greater acceleration because it is moving faster. Evaluate the claim, and give each cart's velocity 3.0 s later, assuming the accelerations stay constant.
      answer: |
        The claim is wrong. Acceleration is the rate at which velocity changes, not how large the velocity is. Q's velocity is not changing, so its acceleration is zero; P's velocity grows by 1.0 m/s each second, so P has the greater acceleration. After 3.0 s: P has 2.0 + (1.0)(3.0) = 5.0 m/s; Q still has 8.0 m/s.
      explanation: |
        Two points. 1 point: rejects the claim, explaining that acceleration measures the change in velocity per unit time, so P (changing) has the greater acceleration and Q (constant velocity) has zero. 1 point: both later velocities, +5.0 m/s for P and +8.0 m/s for Q.
    - slug: apphys1-u01-w02-q23
      type: long_answer
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 6
      prompt: |
        Experimental design and analysis. A lab group wants to find the acceleration of a cart that rolls from rest down a long, straight ramp of fixed slope.

        (A) Describe a procedure the group could use, naming the quantities they would measure, the equipment for each, and one way to reduce uncertainty.

        The group releases the cart from rest and times how long it takes to roll several distances d down the ramp. Each time is the average of three trials.

        | d (m) | 0.20 | 0.40 | 0.60 | 0.80 | 1.00 |
        |---|---|---|---|---|---|
        | t (s) | 0.83 | 1.14 | 1.42 | 1.62 | 1.84 |

        (B) Which quantities should the group graph to get a straight line? Justify your choice with an equation.

        (C) Compute the values you would plot, find the slope of the best-fit line, and use it to determine the cart's acceleration.
      answer: |
        (A) Mark distances along the ramp with a metre stick or tape measure. Hold the cart at rest at the zero mark and release it without pushing; start a stopwatch (or a light gate, or a motion sensor) at release and stop it when the front of the cart passes each mark. Repeat each distance several times and average the times to reduce random timing error (or use light gates instead of hand timing).
        (B) Graph d on the vertical axis against t² on the horizontal axis. From rest with constant acceleration, d = ½at², so d is proportional to t² and the line passes through the origin with slope a/2.
        (C) t² = 0.689, 1.30, 2.02, 2.62, 3.39 s². A best-fit line has slope ≈ 0.30 m/s² (for example, (1.00 − 0.20)/(3.39 − 0.689) ≈ 0.296). The acceleration is twice the slope: a ≈ 0.59 to 0.60 m/s².
      explanation: |
        Six points.
        (A) 2 points: 1 for measuring distances (metre stick or tape) and times (stopwatch, light gates or motion sensor), with the cart released from rest; 1 for a valid way to reduce uncertainty (repeat and average trials, use light gates rather than hand timing, release with a gate or block so there is no push).
        (B) 2 points: 1 for d against t² (or t² against d); 1 for the justification d = ½at² from rest, so the graph is linear through the origin with slope a/2 (or 2/a for the inverted axes).
        (C) 2 points: 1 for the t² values and a slope between 0.28 and 0.32 m/s² from a best-fit line (not one data point divided by another unless it lies on the line); 1 for a = 2 × slope, between 0.56 and 0.64 m/s². Using the slope itself as the acceleration earns only the first point.
