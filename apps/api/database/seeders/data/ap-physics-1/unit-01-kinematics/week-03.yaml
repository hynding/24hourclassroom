week: 3
unit: 1
title: "Reference Frames and Relative Motion"
topics: ["1.4"]
guide: guides/week-03.md
guide_description: |
  Reference frames and why velocity depends on the observer, the velocity-addition rule v_AC = v_AB + v_BC with
  signs in one dimension and as a right triangle for perpendicular velocities, relative velocity and catch-up
  times, steering a boat or plane against a current or crosswind, and why observers moving at constant velocity
  relative to each other agree on accelerations and time intervals. Worked examples: an airport walkway (2.7 m/s
  forward, −0.3 m/s for a child walking the wrong way); approaching and overtaking cars on a highway; a boat
  crossing a 60 m river in a 3.0 m/s current (5.0 m/s at 37°, 15 s, 45 m drift, and the upstream heading to land
  directly opposite); and a ball dropped on a moving train described in both frames in a table.
flashcards_description: |
  30 cards on reference frames, the subscript chain for relative velocity, one-dimensional relative motion with
  signs, closing speeds and catch-up times, boats in currents and planes in crosswinds, landing directly across,
  what inertial observers agree on, the train-and-ball example, and three error-spot cards.

flashcards:
  - front: Reference frame → definition
    back: |
      A coordinate system (origin, axes, positive directions) attached to an observer, in which positions, velocities and times are measured.
    topic_code: "1.4"
  - front: "\"The bus passenger's velocity is 15 m/s\" → what is missing"
    back: |
      The frame. Relative to the road it may be 15 m/s; relative to the bus it is zero. A velocity needs an observer.
    topic_code: "1.4"
  - front: Velocity-addition rule → the subscript chain
    back: |
      v_AC = v_AB + v_BC: the velocity of A relative to C equals A relative to B plus B relative to C. The inner letters match.
    topic_code: "1.4"
  - front: v_BA compared with v_AB → relation
    back: |
      v_BA = −v_AB: the same size, opposite direction. If you see me moving east at 3 m/s, I see you moving west at 3 m/s.
    topic_code: "1.4"
  - front: Traveller walking 1.5 m/s on a 1.2 m/s walkway, same direction → ground velocity
    back: |
      1.5 + 1.2 = 2.7 m/s forward; a 54 m walkway takes 54/2.7 = 20 s.
    topic_code: "1.4"
  - front: Child walking backward at 1.5 m/s on a 1.2 m/s walkway → ground velocity
    back: |
      −1.5 + 1.2 = −0.3 m/s: she drifts slowly backward relative to the floor.
    topic_code: "1.4"
  - front: Two objects moving toward each other on a line → closing speed
    back: |
      The sum of their speeds (relative velocity = difference of signed velocities, which adds the sizes).
    topic_code: "1.4"
  - front: Car A 25 m/s east, car B 20 m/s west → B's velocity relative to A
    back: |
      v_BA = −20 − 25 = −45 m/s: 45 m/s west, as seen by A's driver.
    topic_code: "1.4"
  - front: Faster object chasing a slower one in the same direction → relative speed
    back: |
      The difference of their speeds. Catch-up time = gap ÷ (speed difference).
    topic_code: "1.4"
  - front: Car at 28 m/s, 30 m behind a truck at 22 m/s → catch-up time
    back: |
      Relative speed 6 m/s, so 30/6 = 5.0 s. In the truck's frame the car simply creeps forward at 6 m/s.
    topic_code: "1.4"
  - front: Solving a chase problem in the frame of the slower object → why it helps
    back: |
      The slower object is at rest in its own frame, so only one object moves, at the relative velocity; the gap ÷ relative speed gives the time.
    topic_code: "1.4"
  - front: Boat velocity relative to the ground in a river → how to get it
    back: |
      Add as vectors: v(boat, ground) = v(boat, water) + v(water, ground).
    topic_code: "1.4"
  - front: Perpendicular velocities of 3.0 m/s and 4.0 m/s → resultant
    back: |
      √(3.0² + 4.0²) = 5.0 m/s, not 7.0 m/s; angle tan⁻¹(3/4) ≈ 37° from the 4.0 m/s direction.
    topic_code: "1.4"
  - front: Boat at 4.0 m/s pointed straight across a 60 m river with a 3.0 m/s current → time and drift
    back: |
      Time = 60/4.0 = 15 s (only the across component counts); drift = 3.0 × 15 = 45 m downstream.
    topic_code: "1.4"
  - front: Current speed doubles, boat still pointed straight across → effect on crossing time and drift
    back: |
      Crossing time unchanged (the current is perpendicular to the crossing); downstream drift doubles.
    topic_code: "1.4"
  - front: Landing directly opposite in a current → which way to point the boat
    back: |
      Partly upstream, so that v_boat sin θ = v_current (θ measured from straight across). The across component left is √(v_boat² − v_current²).
    topic_code: "1.4"
  - front: Boat at 4.0 m/s, current 3.0 m/s, aiming to land directly opposite → heading and across speed
    back: |
      θ = sin⁻¹(0.75) ≈ 49° upstream of straight across; across speed √7 ≈ 2.6 m/s, so the crossing takes longer than aiming straight across.
    topic_code: "1.4"
  - front: Current faster than the boat's speed relative to the water → can it land directly opposite?
    back: |
      No. No heading can cancel the current (sin θ would have to exceed 1), so the boat always ends up downstream.
    topic_code: "1.4"
  - front: Plane 80 m/s north relative to the air in a 20 m/s east wind → ground velocity
    back: |
      √(80² + 20²) ≈ 82 m/s, about 14° east of north.
    topic_code: "1.4"
  - front: Observers moving at constant velocity relative to each other → what they agree on
    back: |
      Accelerations and time intervals (and so the forces they infer). They disagree on velocities and on the shapes of paths.
    topic_code: "1.4"
  - front: Why the acceleration is the same in two inertial frames → reason
    back: |
      Every velocity is shifted by the same constant amount, so each change in velocity Δv, and so Δv/Δt, is unchanged.
    topic_code: "1.4"
  - front: Inertial frame → definition
    back: |
      A frame that is not accelerating. Any frame moving at constant velocity relative to an inertial frame is also inertial.
    topic_code: "1.4"
  - front: Ball dropped on a train moving steadily at 10 m/s → path seen by the passenger
    back: |
      Straight down, landing directly below the release point, after √(2h/g).
    topic_code: "1.4"
  - front: Ball dropped on a train moving steadily at 10 m/s → path seen from the platform
    back: |
      A forward-moving curve (parabola): horizontal 10 m/s plus vertical free fall. Same fall time, same landing spot on the train floor.
    topic_code: "1.4"
  - front: Ball released 1.2 m above the floor of a train at 10 m/s → fall time and ground-frame horizontal travel
    back: |
      t = √(2 × 1.2/9.8) ≈ 0.49 s; it moves about 4.9 m forward relative to the ground, as does the floor below it.
    topic_code: "1.4"
  - front: Ball dropped inside a train that is speeding up → where it lands
    back: |
      Behind the release point: the floor gains speed while the ball keeps its original horizontal velocity. The train frame is not inertial.
    topic_code: "1.4"
  - front: Ball tossed straight up by a skateboarder rolling at constant speed → where it comes down
    back: |
      Back in her hand: in the ground frame the ball keeps her horizontal velocity, so they move forward together.
    topic_code: "1.4"
  - front: Error-spot → "the swimmer goes 1.8 m/s upstream, plus the 0.6 m/s current, so 2.4 m/s"
    back: |
      Against the current the velocities have opposite signs: 1.8 − 0.6 = 1.2 m/s upstream relative to the bank.
    topic_code: "1.4"
  - front: Error-spot → "a stronger current makes a boat aimed straight across take longer to cross"
    back: |
      The current is perpendicular to the crossing, so it adds drift, not time. Only the across component sets the crossing time.
    topic_code: "1.4"
  - front: Error-spot → "the bus passenger sees the car accelerate less, because the bus is also moving"
    back: |
      Frames moving at constant relative velocity measure the same acceleration; only the velocities differ.
    topic_code: "1.4"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topic 1.4: reference frames, relative velocity in one
    dimension, catch-up and meeting times, boats in currents and planes in crosswinds, and what observers in
    different inertial frames agree on), with 8 questions (35%) reviewing weeks 1–2 (displacement, average
    velocity and acceleration, motion graphs, the constant-acceleration equations and free fall). The long answer
    is a mathematical routines question on crossing a river. Multiple choice, select-all, true/false and numeric
    items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
    answer are graded by your teacher against the scoring notes. Calculator allowed throughout, as on the AP
    exam.
  questions:
    - slug: apphys1-u01-w03-q01
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Physics 1 CED, Topic 1.4"
      points: 1
      prompt: |
        A train moves east along a straight track at 18 m/s. A passenger walks toward the back of the train at 1.5 m/s relative to the train. What is the passenger's velocity relative to the ground?
      options:
        - "16.5 m/s east"
        - "19.5 m/s east"
        - "1.5 m/s west"
        - "16.5 m/s west"
      option_explanations:
        - |
          Correct. v(passenger, ground) = v(passenger, train) + v(train, ground) = −1.5 + 18 = +16.5 m/s, that is, 16.5 m/s east.
        - |
          This adds the speeds as if she walked toward the front. Walking toward the back gives her velocity relative to the train the opposite sign.
        - |
          This is her velocity relative to the train, not relative to the ground.
        - |
          The train's 18 m/s east dominates her 1.5 m/s west, so relative to the ground she still moves east.
      answer: 0
    - slug: apphys1-u01-w03-q02
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Physics 1 CED, Topic 1.4"
      points: 1
      prompt: |
        On a straight road, a bus drives east at 15 m/s and a cyclist rides west at 5.0 m/s toward it. What is the cyclist's velocity relative to the bus?
      options:
        - "10 m/s west"
        - "20 m/s west"
        - "20 m/s east"
        - "5.0 m/s west"
      option_explanations:
        - |
          This subtracts the speeds as if both moved the same way. Moving toward each other, the relative speed is the sum, 20 m/s.
        - |
          Correct. v(cyclist, bus) = v(cyclist, ground) − v(bus, ground) = −5.0 − (+15) = −20 m/s, that is, 20 m/s west.
        - |
          This is the bus's velocity relative to the cyclist; reversing the subscripts reverses the direction.
        - |
          This is the cyclist's velocity relative to the ground, not relative to the bus.
      answer: 1
    - slug: apphys1-u01-w03-q03
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Physics 1 CED, Topic 1.4"
      points: 1
      prompt: |
        Two runners move in the same direction along a straight path. Runner A runs at 6.0 m/s and is 40 m behind runner B, who runs at 5.0 m/s. How long does A take to catch B?
      options:
        - "3.6 s"
        - "8.0 s"
        - "40 s"
        - "6.7 s"
      option_explanations:
        - |
          This divides by the sum of the speeds (40/11), the closing speed for runners moving toward each other, not for a chase.
        - |
          This divides the gap by B's speed (40/5.0); the gap closes at the difference of the speeds.
        - |
          Correct. In B's frame, A approaches at 6.0 − 5.0 = 1.0 m/s, so t = 40 m / 1.0 m/s = 40 s.
        - |
          This divides the gap by A's speed relative to the ground (40/6.0), ignoring that B is also moving away.
      answer: 2
    - slug: apphys1-u01-w03-q04
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Physics 1 CED, Topic 1.4"
      points: 1
      prompt: |
        A kayaker paddles at 3.0 m/s relative to the water, pointing straight across a 45 m wide river that flows at 1.5 m/s. How long does she take to reach the far bank?
      options:
        - "10 s"
        - "13 s"
        - "30 s"
        - "15 s"
      option_explanations:
        - |
          This adds the two speeds (45/4.5). The current is perpendicular to the crossing, so it does not add to the across speed.
        - |
          This uses the resultant ground speed √(3.0² + 1.5²) ≈ 3.35 m/s along the across distance; but the path is diagonal, and only the across component of velocity sets the time.
        - |
          This divides by the current's speed (45/1.5). The current carries her downstream; it does not move her across.
        - |
          Correct. Only the across component of her velocity, 3.0 m/s, moves her toward the far bank: t = 45/3.0 = 15 s.
      answer: 3
    - slug: apphys1-u01-w03-q05
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Physics 1 CED, Topic 1.4"
      points: 1
      prompt: |
        A ferry always points straight across a river and keeps the same speed relative to the water. After a storm, the river's current is twice as fast. How do the ferry's crossing time and its downstream drift change?
      options:
        - "Both the crossing time and the drift double."
        - "The crossing time is unchanged and the drift doubles."
        - "The crossing time doubles and the drift is unchanged."
        - "Both are unchanged, because the ferry's speed relative to the water is the same."
      option_explanations:
        - |
          The crossing time depends only on the across component of velocity, which the perpendicular current does not change.
        - |
          Correct. Time = width ÷ across speed, unchanged. Drift = current speed × time, so it doubles with the current.
        - |
          This swaps the roles: the current affects the downstream motion, not the across motion.
        - |
          The across motion is unchanged, but the downstream drift depends on the current's speed, which doubled.
      answer: 1
    - slug: apphys1-u01-w03-q06
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Physics 1 CED, Topic 1.4"
      points: 1
      prompt: |
        A small plane flies with a velocity of 120 m/s due north relative to the air. A steady wind blows due east at 50 m/s relative to the ground. What is the plane's speed relative to the ground?
      options:
        - "130 m/s"
        - "170 m/s"
        - "70 m/s"
        - "109 m/s"
      option_explanations:
        - |
          Correct. The velocities are perpendicular, so the ground speed is √(120² + 50²) = √16,900 = 130 m/s.
        - |
          This adds the speeds as if the wind blew from behind. Perpendicular velocities combine as a right triangle.
        - |
          This subtracts the speeds as if the wind were a headwind; it blows across the plane's heading.
        - |
          This subtracts the squares, √(120² − 50²) ≈ 109; the ground velocity is the hypotenuse, so the squares add.
      answer: 0
    - slug: apphys1-u01-w03-q07
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Physics 1 CED, Topic 1.4"
      points: 1
      prompt: |
        An observer on the ground measures a car's acceleration as 2.0 m/s² east. A passenger on a bus moving east at a constant 10 m/s also measures the car's acceleration. What does the passenger find?
      options:
        - "Zero, because the bus is moving as well"
        - "A value that depends on how fast the bus is moving"
        - "2.0 m/s² east, the same as the ground observer"
        - "2.0 m/s² west, because the car seems to move backward relative to the bus"
      option_explanations:
        - |
          The bus moves at constant velocity, so it shifts the car's velocity by a constant amount; the car's velocity still changes, so its acceleration is not zero.
        - |
          The bus's speed shifts every velocity by the same amount, which cancels in Δv. Acceleration does not depend on the frame's constant velocity.
        - |
          Correct. Frames moving at constant velocity relative to each other agree on every change in velocity, so they measure the same acceleration.
        - |
          The car's velocity relative to the bus may be negative at first, but it changes in the same way as in the ground frame, so the acceleration is still 2.0 m/s² east.
      answer: 2
    - slug: apphys1-u01-w03-q08
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Physics 1 CED, Topic 1.4"
      points: 1
      prompt: |
        A passenger on a train moving at constant velocity along a straight, level track drops a coin. Air resistance is negligible. Which best describes the coin's path as seen by a person standing on the platform as the train passes?
      options:
        - "Straight down"
        - "A curve that falls behind the point where the coin was released"
        - "A straight diagonal line slanting forward"
        - "A curve that moves forward with the train while the coin falls"
      option_explanations:
        - |
          Straight down is what the passenger sees. In the platform frame the coin starts with the train's horizontal velocity.
        - |
          The coin keeps the train's horizontal velocity, so it stays level with the release point on the train; it would fall behind only if the train sped up.
        - |
          A straight diagonal would need constant vertical velocity. The coin's vertical velocity grows as it falls, so the path curves.
        - |
          Correct. In the platform frame the coin has the train's constant horizontal velocity plus a growing downward velocity: a parabola that moves forward with the train.
      answer: 3
    - slug: apphys1-u01-w03-q09
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Physics 1 CED, Topic 1.4"
      points: 1
      prompt: |
        A motorboat moves at 5.0 m/s relative to the water. The river flows at 3.0 m/s. The driver points the boat partly upstream so that it travels straight across, landing directly opposite its starting point. What is the boat's speed relative to the ground?
      options:
        - "5.8 m/s"
        - "2.0 m/s"
        - "8.0 m/s"
        - "4.0 m/s"
      option_explanations:
        - |
          This adds the squares, √(5.0² + 3.0²) ≈ 5.8, which is the ground speed when the boat points straight across; here the boat's velocity relative to the water is the hypotenuse.
        - |
          This subtracts the speeds as if the boat pointed straight upstream; the current is cancelled by only part of the boat's velocity.
        - |
          This adds the speeds as if the boat went straight downstream.
        - |
          Correct. The upstream part of the boat's velocity cancels the 3.0 m/s current, leaving an across speed of √(5.0² − 3.0²) = 4.0 m/s, which is its ground speed.
      answer: 3
    - slug: apphys1-u01-w03-q10
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        A cart's velocity–time graph is a straight line from 8.0 m/s at t = 0 down to 0 at t = 4.0 s. How far does the cart travel in those 4.0 s?
      options:
        - "32 m"
        - "2.0 m"
        - "16 m"
        - "4.0 m"
      option_explanations:
        - |
          This multiplies 8.0 m/s by 4.0 s, the area of a rectangle; the area under the line is a triangle, half of that.
        - |
          2.0 m/s² is the size of the slope (the acceleration), not the area.
        - |
          Correct. The displacement is the triangular area: ½ × 4.0 s × 8.0 m/s = 16 m.
        - |
          4.0 m/s is the average velocity; it still has to be multiplied by the 4.0 s.
      answer: 2
    - slug: apphys1-u01-w03-q11
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        A rock is dropped from rest into a canyon. Air resistance is negligible. How far does it fall in the first 2.0 s?
      options:
        - "39 m"
        - "19.6 m"
        - "9.8 m"
        - "4.9 m"
      option_explanations:
        - |
          This drops the ½ in ½gt², giving 9.8 × 4.0 ≈ 39 m.
        - |
          Correct. Δy = ½gt² = ½(9.8)(2.0)² = 19.6 m.
        - |
          This uses t instead of t², ½(9.8)(2.0) = 9.8; that is half the speed after 2.0 s, not a distance.
        - |
          4.9 m is the distance fallen in the first 1.0 s only.
      answer: 1
    - slug: apphys1-u01-w03-q12
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        A cart has a velocity of −2.0 m/s and a constant acceleration of +0.50 m/s². Which describes its motion over the next 2.0 s?
      options:
        - "It slows down, and its velocity becomes −1.0 m/s."
        - "It speeds up, and its velocity becomes −3.0 m/s."
        - "It reverses at once and moves at +1.0 m/s."
        - "Its velocity stays −2.0 m/s, because the signs cancel."
      option_explanations:
        - |
          Correct. Velocity and acceleration have opposite signs, so it slows: v = −2.0 + (0.50)(2.0) = −1.0 m/s, still moving in the negative direction.
        - |
          This adds the change to the speed as if acceleration always increases speed; with opposite signs, the speed decreases.
        - |
          A positive acceleration does not mean positive motion. After 2.0 s the velocity has only risen to −1.0 m/s; it reaches zero at t = 4.0 s.
        - |
          Signs show direction; they do not cancel. A nonzero acceleration changes the velocity by 0.50 m/s every second.
      answer: 0
    - slug: apphys1-u01-w03-q13
      type: multi_select
      topic_code: "1.4"
      source: "AP Physics 1 CED, Topic 1.4"
      points: 2
      partial_credit: true
      prompt: |
        A passenger on a ship moving at constant velocity drops a ball from rest, and an observer on the shore watches it fall. Air resistance is negligible. Which quantities do the passenger and the shore observer measure to be the same? Select all that apply.
      options:
        - "The ball's acceleration"
        - "The ball's velocity just before it hits the deck"
        - "The time the ball takes to reach the deck"
        - "The shape of the ball's path"
        - "The vertical distance the ball falls"
      option_explanations:
        - |
          Correct. Frames moving at constant velocity relative to each other agree on accelerations: 9.8 m/s² downward in both.
        - |
          The shore observer adds the ship's horizontal velocity to the ball's velocity, so the two velocities differ.
        - |
          Correct. Both agree on time intervals, and the vertical motion that sets the fall time is identical.
        - |
          The passenger sees a straight drop; the shore observer sees a forward-moving parabola.
        - |
          Correct. The ship moves horizontally, so both observers see the ball fall the same height.
      answer: [0, 2, 4]
    - slug: apphys1-u01-w03-q14
      type: multi_select
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 2
      partial_credit: true
      prompt: |
        A puck slides up a tilted air table and back. Its position along the table is recorded each second:

        | t (s) | 0 | 1 | 2 | 3 | 4 |
        |---|---|---|---|---|---|
        | x (m) | 0 | 3 | 4 | 3 | 0 |

        The position follows x = 4t − t² (x in metres, t in seconds). Which statements are true? Select all that apply.
      options:
        - "The puck's speed is constant."
        - "The puck reverses direction at t = 2 s."
        - "The distance the puck travels from t = 0 to t = 4 s is zero."
        - "The puck's displacement from t = 0 to t = 4 s is zero."
        - "The puck's acceleration is constant at −2.0 m/s²."
      option_explanations:
        - |
          The steps shrink (3, then 1) and then grow (1, then 3), so the puck slows and then speeds up.
        - |
          Correct. The position peaks at t = 2 s (the x–t graph has a horizontal tangent there), so the velocity is zero and the puck turns around.
        - |
          The distance is 4 m up plus 4 m back, 8 m. Only the displacement is zero.
        - |
          Correct. The puck ends where it started, at x = 0.
        - |
          Correct. Comparing x = 4t − t² with x = v₀t + ½at² gives v₀ = 4 m/s and ½a = −1 m/s², so a = −2.0 m/s².
      answer: [1, 3, 4]
    - slug: apphys1-u01-w03-q15
      type: true_false
      topic_code: "1.4"
      source: "AP Physics 1 CED, Topic 1.4"
      points: 1
      prompt: |
        True or false: A boat that always points straight across a river reaches the far bank sooner when the current is faster.
      answer: false
      explanation: |
        False. The crossing time is the river's width divided by the boat's across component of velocity, which the perpendicular current does not change. A faster current only increases how far downstream the boat lands.
    - slug: apphys1-u01-w03-q16
      type: true_false
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        True or false: On a velocity–time graph, area between the graph and the time axis that lies below the axis represents displacement in the negative direction.
      answer: true
      explanation: |
        True. Below the axis the velocity is negative, so each strip v·Δt is a negative displacement. Net displacement adds the areas with their signs; distance adds their sizes.
    - slug: apphys1-u01-w03-q17
      type: fill_blank
      topic_code: "1.4"
      source: "AP Physics 1 CED, Topic 1.4"
      points: 1
      prompt: |
        A swimmer swims downstream at 1.2 m/s relative to the water in a river whose current is 0.8 m/s. Her speed relative to the riverbank is ____ m/s.
      answer: ["2", "2.0", "two"]
      explanation: |
        Downstream, the two velocities point the same way: 1.2 + 0.8 = 2.0 m/s relative to the bank.
    - slug: apphys1-u01-w03-q18
      type: fill_blank
