    - slug: apphys1-u01-w03-q21
      type: short_answer
      topic_code: "1.4"
      source: "AP Physics 1 CED, Topic 1.4"
      points: 3
      prompt: |
        A student rides a skateboard along a level path at a constant 3.0 m/s. She tosses a ball straight up, relative to herself, at 4.0 m/s and catches it at the same height. Air resistance is negligible.

        (a) Describe the ball's path as she sees it and as a friend standing beside the path sees it.
        (b) Calculate how long the ball is in the air and how far it moves horizontally relative to the ground.
        (c) Explain why the ball comes back down into her hand rather than landing behind her.
      answer: |
        (a) She sees the ball go straight up and come straight back down. Her friend sees an arch (a parabola): the ball moves forward at 3.0 m/s while rising and falling.
        (b) Time in the air t = 2v₀/g = 2(4.0)/9.8 ≈ 0.82 s, the same in both frames. Horizontal distance relative to the ground = 3.0 × 0.82 ≈ 2.4 m.
        (c) In the ground frame the ball leaves her hand with her horizontal velocity, 3.0 m/s, and nothing horizontal acts on it, so it keeps moving forward at 3.0 m/s, exactly as she does. Both travel 2.4 m forward in 0.82 s, so the ball meets her hand.
      explanation: |
        Three points, one per part. (a) straight up and down in her frame and a forward-moving parabola in the ground frame (both needed). (b) about 0.82 s (accept 0.8) and about 2.4 m (accept 2.4 to 2.5). (c) the ball shares her constant horizontal velocity, so they cover the same horizontal distance; "the ball is pulled along with her" or "the air carries it" earns nothing.
    - slug: apphys1-u01-w03-q22
      type: short_answer
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 2
      prompt: |
        Two identical balls are dropped from rest, ball 1 from height h and ball 2 from height 2h. Air resistance is negligible. Predict, with justification from the kinematic equations, how ball 2's fall time and its speed just before landing compare with ball 1's.
      answer: |
        From h = ½gt², t = √(2h/g), so t is proportional to √h: ball 2 takes √2 ≈ 1.4 times as long as ball 1 (not twice as long). From v² = 2gh, v = √(2gh), so v is also proportional to √h: ball 2 lands √2 ≈ 1.4 times as fast.
      explanation: |
        Two points. 1 point: fall time multiplied by √2 (about 1.4), justified from t = √(2h/g). 1 point: landing speed multiplied by √2, justified from v = √(2gh) (or from v = gt with the longer time). "Twice as long" or "twice as fast" earns nothing for that part.
    - slug: apphys1-u01-w03-q23
      type: long_answer
      topic_code: "1.4"
      source: "AP Physics 1 CED, Topic 1.4"
      points: 6
      prompt: |
        Mathematical routines. A straight river of width W flows at speed v_c relative to the ground. A boat moves at speed v_b relative to the water, where v_b is greater than v_c.

        (A) The boat points straight across the river. Derive expressions for the crossing time and for the distance downstream of the point directly opposite where the boat lands.

        (B) The boat instead points partly upstream so that it lands directly opposite its starting point. Derive an expression for the angle θ between the boat's heading and the straight-across direction, and for the crossing time.

        (C) Without numbers, explain which crossing takes longer, and show that your expression in (B) behaves sensibly as v_c approaches v_b.

        (D) For W = 120 m, v_b = 2.5 m/s and v_c = 1.5 m/s, calculate both crossing times.
      answer: |
        (A) The across component of the boat's ground velocity is v_b, so t₁ = W/v_b. The downstream component is v_c, so the drift is d = v_c t₁ = v_c W/v_b.
        (B) The upstream component of the boat's velocity relative to the water must cancel the current: v_b sin θ = v_c, so θ = sin⁻¹(v_c/v_b). The across component is v_b cos θ = √(v_b² − v_c²), so t₂ = W/√(v_b² − v_c²).
        (C) Landing directly opposite takes longer: part of the boat's velocity is spent cancelling the current, so less of it is left to carry the boat across (√(v_b² − v_c²) is less than v_b). As v_c approaches v_b, √(v_b² − v_c²) approaches zero, so t₂ grows without limit and θ approaches 90°: the boat must point almost straight upstream and barely makes progress, which is what we expect when the current nearly matches the boat's speed.
        (D) t₁ = 120/2.5 = 48 s. t₂ = 120/√(2.5² − 1.5²) = 120/2.0 = 60 s (with θ ≈ 37° upstream of straight across).
      explanation: |
        Six points.
        (A) 1 point: t₁ = W/v_b and drift v_c W/v_b (both needed).
        (B) 2 points: 1 for sin θ = v_c/v_b (or an equivalent with the angle measured from the bank: cos of that angle = v_c/v_b); 1 for t₂ = W/√(v_b² − v_c²).
        (C) 2 points: 1 for a qualitative argument that the direct crossing is slower because part of the boat's velocity cancels the current; 1 for the limiting behaviour (t₂ grows without bound and θ approaches 90° as v_c approaches v_b) connected to the physical situation.
        (D) 1 point: 48 s and 60 s (both needed).
