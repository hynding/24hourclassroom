week: 1
unit: 1
title: "Scalars, Vectors, Displacement, Velocity and Acceleration"
topics: ["1.1", "1.2"]
guide: guides/week-01.md
guide_description: |
  Scalars and vectors in one dimension (choosing an axis and a positive direction, signed components,
  magnitude), displacement versus distance, average velocity versus average speed, average acceleration, and
  using the signs of velocity and acceleration to decide whether an object speeds up or slows down. Worked
  examples: a hallway walk (12 m east, 5 m west) giving displacement, distance, average velocity and average
  speed; a cyclist braking while moving south (acceleration +1.6 m/s²); velocities and acceleration read from a
  motion-sensor position table for a cart on a ramp; and a round trip with a faster return, with the symbolic
  average speed 2v₁v₂/(v₁ + v₂) checked against the limiting case v₁ = v₂.
flashcards_description: |
  30 cards on scalars and vectors, sign conventions in one dimension, displacement and distance, average
  velocity and average speed, average acceleration and its units, speeding up versus slowing down, reading
  position tables, unit conversion, and three error-spot cards.

flashcards:
  - front: Scalar versus vector → the difference
    back: |
      A scalar has a size (with a unit) only; a vector has a size and a direction. Distance, speed and time are scalars; displacement, velocity and acceleration are vectors.
    topic_code: "1.1"
  - front: Sign of a one-dimensional vector component → what it means
    back: |
      Direction only: + is the direction you chose as positive, − the opposite. It says nothing about size or about speeding up.
    topic_code: "1.1"
  - front: Magnitude of a vector → definition
    back: |
      Its size without direction, always zero or positive. The magnitude of a velocity of −3.0 m/s is 3.0 m/s.
    topic_code: "1.1"
  - front: Choosing the positive direction in a 1D problem → does it change the physics?
    back: |
      No. It changes the signs of the components, not the motion. State the choice and keep it for the whole problem.
    topic_code: "1.1"
  - front: Distance travelled → definition and sign
    back: |
      The total length of the path, counting every leg. A scalar, never negative.
    topic_code: "1.1"
  - front: Displacement Δx → definition
    back: |
      Change in position, Δx = x_f − x_i. A vector that depends only on where the motion starts and ends.
    topic_code: "1.2"
  - front: Magnitude of displacement compared with distance → the rule
    back: |
      |Δx| ≤ distance. They are equal only for straight-line motion without reversing direction.
    topic_code: "1.1"
  - front: Hallway walk, 12 m east then 5 m west in 20 s → displacement and distance
    back: |
      Displacement +7 m (east); distance 17 m.
    topic_code: "1.2"
  - front: Hallway walk, 12 m east then 5 m west in 20 s → average velocity and average speed
    back: |
      Average velocity = +7/20 = +0.35 m/s (east). Average speed = 17/20 = 0.85 m/s.
    topic_code: "1.2"
  - front: Average velocity → formula and unit
    back: |
      v_avg = Δx/Δt, in m/s. Uses only the displacement over the interval, not the path.
    topic_code: "1.2"
  - front: Average speed → formula
    back: |
      Total distance divided by total time, in m/s. A scalar.
    topic_code: "1.2"
  - front: Average velocity for a trip that ends where it started → value
    back: |
      Zero, because the displacement is zero, however fast the object moved.
    topic_code: "1.2"
  - front: Instantaneous velocity versus speed → link
    back: |
      Speed is the magnitude of the instantaneous velocity. A speedometer shows speed; add a direction to get velocity.
    topic_code: "1.2"
  - front: Average acceleration → formula and unit
    back: |
      a_avg = Δv/Δt = (v_f − v_i)/Δt, in m/s² (metres per second, per second).
    topic_code: "1.2"
  - front: Acceleration of 2 m/s² → what it means in words
    back: |
      The velocity changes by 2 m/s every second, in the direction of the acceleration.
    topic_code: "1.2"
  - front: Velocity and acceleration with the same sign → motion
    back: |
      Speeding up (the speed increases), moving in the direction of the velocity.
    topic_code: "1.2"
  - front: Velocity and acceleration with opposite signs → motion
    back: |
      Slowing down (the speed decreases), still moving in the direction of the velocity.
    topic_code: "1.2"
  - front: Cyclist riding south at 6.0 m/s brakes to 2.0 m/s in 2.5 s, north positive → acceleration
    back: |
      a = (−2.0 − (−6.0))/2.5 = +1.6 m/s², that is, 1.6 m/s² north: opposite to the velocity, so slowing down.
    topic_code: "1.2"
  - front: Zero velocity at an instant → must the acceleration be zero?
    back: |
      No. A ball at the top of its flight has zero velocity but its velocity is still changing, so the acceleration is not zero.
    topic_code: "1.2"
  - front: Car on cruise control at 30 m/s on a straight road → acceleration
    back: |
      Zero: the velocity is not changing. A large velocity does not mean a large acceleration.
    topic_code: "1.2"
  - front: Position table with equal steps each second → what it shows
    back: |
      Constant velocity (zero acceleration); the velocity is the step divided by the time step.
    topic_code: "1.2"
  - front: Position table whose steps grow by the same amount each second → what it shows
    back: |
      Constant acceleration in the positive direction; the growth in the step per second, divided by one second, is the acceleration.
    topic_code: "1.2"
  - front: Ramp cart positions 0, 0.40, 1.60, 3.60, 6.40 m at t = 0–4 s → acceleration
    back: |
      Interval velocities 0.40, 1.20, 2.00, 2.80 m/s rise by 0.80 m/s each second, so a = 0.80 m/s².
    topic_code: "1.2"
  - front: Walk 60 m out at 1.5 m/s and back at 3.0 m/s → average speed
    back: |
      Times 40 s and 20 s: average speed = 120/60 = 2.0 m/s, not the 2.25 m/s from averaging the two speeds.
    topic_code: "1.2"
  - front: Round trip distance D out at v₁, back at v₂ → average speed in symbols
    back: |
      2v₁v₂/(v₁ + v₂). Check: v₁ = v₂ = v gives v. D cancels, so the length of the trip does not matter.
    topic_code: "1.2"
  - front: Same displacement in twice the time → effect on average velocity
    back: |
      It halves, because v_avg = Δx/Δt is inversely proportional to Δt for fixed Δx.
    topic_code: "1.2"
  - front: Converting a speed in km/h to m/s → the factor
    back: |
      Divide by 3.6 (1 m/s = 3.6 km/h). Example: 72 km/h = 20 m/s.
    topic_code: "1.2"
  - front: Error-spot → "the acceleration is negative, so the cart is slowing down"
    back: |
      Only true if the velocity is positive. A cart moving in the negative direction with negative acceleration is speeding up. Compare the signs.
    topic_code: "1.2"
  - front: Error-spot → "average speed = (first speed + second speed)/2"
    back: |
      Only if equal times are spent at each speed. Always use total distance over total time.
    topic_code: "1.2"
  - front: Error-spot → "velocity of −3 m/s means the cart is going slower than one at +1 m/s"
    back: |
      The sign is direction. A speed of 3 m/s is faster than 1 m/s; compare magnitudes for speed.
    topic_code: "1.1"

quiz:
  description: |
    23 questions · about 40 minutes · this week's topics 1.1 and 1.2: scalars and vectors in one dimension, sign
    conventions, displacement and distance, average velocity and average speed, average acceleration, and
    speeding up versus slowing down. This is the first week, so there are no review items yet; a third of the
    questions are conceptual or ask you to read a table. Multiple choice, select-all, true/false and numeric
    items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
    answer are graded by your teacher against the scoring notes. Calculator allowed throughout, as on the AP
    exam.
  questions:
    - slug: apphys1-u01-w01-q01
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Physics 1 CED, Topic 1.1"
      points: 1
      prompt: |
        Which of these quantities is a vector?
      options:
        - "The speed of a skateboarder rolling down a ramp"
        - "The distance a delivery van drives during one shift"
        - "The displacement of a soccer ball from the penalty spot to the goal line"
        - "The time a runner takes to finish a 100 m race"
      option_explanations:
        - |
          Speed is the magnitude of velocity only; it has no direction, so it is a scalar.
        - |
          Distance is the total path length with no direction attached, so it is a scalar.
        - |
          Correct. Displacement has a size and a direction (from the penalty spot toward the goal line), so it is a vector.
        - |
          A time interval has a size and a unit but no direction, so it is a scalar.
      answer: 2
    - slug: apphys1-u01-w01-q02
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        A runner completes exactly one lap of a 400 m track in 80 s, finishing at the point where she started. What is the magnitude of her average velocity for the lap?
      options:
        - "5.0 m/s"
        - "0 m/s"
        - "0.20 m/s"
        - "1.6 m/s"
      option_explanations:
        - |
          This is her average speed, 400 m / 80 s. Average velocity uses displacement, not distance travelled.
        - |
          Correct. She ends where she started, so her displacement is zero and v_avg = Δx/Δt = 0/80 = 0 m/s.
        - |
          This divides time by distance (80/400), which inverts the definition and still uses distance instead of displacement.
        - |
          This uses her largest displacement from the start (roughly the track's width, about 127 m) divided by 80 s; average velocity uses the final displacement, which is zero.
      answer: 1
    - slug: apphys1-u01-w01-q03
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Physics 1 CED, Topic 1.1"
      points: 1
      prompt: |
        East is chosen as positive. A dog in a park runs 8 m west to chase a ball, then trots 3 m east back toward its owner. What is the dog's displacement?
      options:
        - "+11 m"
        - "−11 m"
        - "+5 m"
        - "−5 m"
      option_explanations:
        - |
          This adds the two legs as distances (8 + 3 = 11 m); that is the distance travelled, and it ignores direction.
        - |
          This keeps the westward sign but still adds the lengths instead of combining −8 m and +3 m.
        - |
          The size is right but the sign is wrong: the dog ends up west of where it started, and west is negative.
        - |
          Correct. Δx = −8 m + 3 m = −5 m, that is, 5 m west of the starting point.
      answer: 3
    - slug: apphys1-u01-w01-q04
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        A car moving along a straight road has a velocity of −12 m/s. Four seconds later its velocity is −4.0 m/s. What is its average acceleration over those 4.0 s?
      options:
        - "+2.0 m/s²"
        - "−2.0 m/s²"
        - "−4.0 m/s²"
        - "+0.50 m/s²"
      option_explanations:
        - |
          Correct. a = (v_f − v_i)/Δt = (−4.0 − (−12))/4.0 = +8.0/4.0 = +2.0 m/s². The car slows while moving in the negative direction, so the acceleration is positive.
        - |
          This assumes "slowing down means negative acceleration". The velocity is negative, so slowing down needs a positive acceleration.
        - |
          This subtracts the magnitudes with the wrong sign handling, (−4 − 12)/4 = −4.0, dropping the negative sign on the initial velocity.
        - |
          This inverts the definition, dividing the time interval by the change in velocity (4/8). Acceleration is Δv/Δt.
      answer: 0
    - slug: apphys1-u01-w01-q05
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        A ball rolls along a straight gutter in the direction chosen as negative, and its acceleration is also negative. Which describes its motion?
      options:
        - "It is slowing down while moving in the negative direction."
        - "It is speeding up while moving in the negative direction."
        - "It is slowing down and about to reverse into the positive direction."
        - "It is moving at constant speed, because the two negatives cancel."
      option_explanations:
        - |
          This reads "negative acceleration" as "slowing down". Slowing down needs the acceleration to point opposite to the velocity.
        - |
          Correct. Velocity and acceleration have the same sign, so the acceleration points along the motion and the speed increases.
        - |
          Reversal happens when the acceleration opposes the velocity; here they point the same way, so the ball does not slow toward a stop.
        - |
          Signs are directions, not factors that cancel. A nonzero acceleration always changes the velocity; same direction means the speed grows.
      answer: 1
    - slug: apphys1-u01-w01-q06
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        A student walks 30 m north along a corridor in 20 s, then 10 m south in 10 s. What is her average velocity for the whole 30 s?
      options:
        - "0.67 m/s north"
        - "1.3 m/s north"
        - "0.25 m/s north"
        - "0.67 m/s south"
      option_explanations:
        - |
          Correct. Displacement = 30 − 10 = 20 m north; v_avg = 20 m / 30 s ≈ 0.67 m/s north.
        - |
          This is the average speed, 40 m / 30 s: it uses the total distance instead of the displacement.
        - |
          This averages the two leg velocities, (+1.5 + (−1.0))/2 = 0.25 m/s. The legs last different times, so you must use total displacement over total time.
        - |
          The size is right but the direction is wrong: she ends 20 m north of her start, so the average velocity points north.
      answer: 0
    - slug: apphys1-u01-w01-q07
      type: multiple_choice
      topic_code: "1.1"
      source: "AP Physics 1 CED, Topic 1.1"
      points: 1
      prompt: |
        A motion sensor records a cart's velocity as −3.0 m/s. What does the negative sign tell you?
      options:
        - "The cart is slowing down."
        - "The cart is moving in the direction chosen as negative."
        - "The cart's speed is less than zero."
        - "The cart's acceleration is negative."
      option_explanations:
        - |
          A sign on velocity says nothing about speeding up or slowing down; that needs the acceleration's sign as well.
        - |
          Correct. In one dimension, the sign of a velocity component gives its direction relative to the chosen positive direction. The speed is 3.0 m/s.
        - |
          Speed is a magnitude and cannot be negative; the speed here is 3.0 m/s.
        - |
          This confuses velocity with acceleration. One velocity reading tells you nothing about the acceleration.
      answer: 1
    - slug: apphys1-u01-w01-q08
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        A cart's position along a level track is recorded every 2.0 s: at t = 0, 2.0, 4.0 and 6.0 s it is at x = 3.0, 7.0, 11.0 and 15.0 m. What is the cart's acceleration?
      options:
        - "2.0 m/s², because the position increases by 4.0 m every 2.0 s"
        - "2.5 m/s², the final position divided by the final time"
        - "0.42 m/s², the final position divided by the final time squared"
        - "0 m/s², because the velocity is constant"
      option_explanations:
        - |
          4.0 m every 2.0 s is a velocity of 2.0 m/s, not an acceleration. This confuses velocity with acceleration.
        - |
          15/6 = 2.5 is not even the velocity (the cart did not start at x = 0); it is certainly not an acceleration.
        - |
          15/6² ≈ 0.42 treats the position as if it came from rest at the origin; the data show equal steps, so nothing is changing the velocity.
        - |
          Correct. The position grows by an equal 4.0 m in each 2.0 s interval, so the velocity is a constant 2.0 m/s and the acceleration is zero.
      answer: 3
    - slug: apphys1-u01-w01-q09
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        A ball is tossed straight up. Which statement is true at the instant it reaches its highest point?
      options:
        - "Its velocity and its acceleration are both zero."
        - "Its velocity is 9.8 m/s downward and its acceleration is zero."
        - "Its velocity is zero and its acceleration is downward."
        - "Its velocity is zero and its acceleration is upward."
      option_explanations:
        - |
          The velocity is zero for an instant, but it is still changing (from upward to downward), so the acceleration cannot be zero.
        - |
          This swaps velocity and acceleration: 9.8 m/s² is the size of the acceleration, and the velocity is zero at the top.
        - |
          Correct. The ball is momentarily at rest, but its velocity is changing from upward to downward, so its acceleration points down (about 9.8 m/s²).
        - |
          An upward acceleration would make the ball start moving up again. The velocity changes toward downward, so the acceleration is downward.
      answer: 2
    - slug: apphys1-u01-w01-q10
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        A school bus travels at 72 km/h. What is this speed in m/s?
      options:
        - "20 m/s"
        - "259 m/s"
        - "1.2 m/s"
        - "2.0 m/s"
      option_explanations:
        - |
          Correct. 72 km/h × (1000 m/km) ÷ (3600 s/h) = 72/3.6 = 20 m/s.
        - |
          This multiplies by 3.6 instead of dividing (72 × 3.6 ≈ 259). A metre per second is the larger unit, so the number must get smaller.
        - |
          This divides by 60 as if converting minutes, and forgets the kilometres-to-metres factor of 1000.
        - |
          This divides by 36 instead of 3.6, misplacing the factor 1000/3600 by a power of ten.
      answer: 0
    - slug: apphys1-u01-w01-q11
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        Two trains travel along the same straight track from one station to the next, so they have the same displacement. Train B takes three times as long as train A. How does the magnitude of train B's average velocity compare with train A's?
      options:
        - "Three times as large"
        - "The same, because the displacement is the same"
        - "One-ninth as large"
        - "One-third as large"
      option_explanations:
        - |
          A longer time for the same displacement gives a smaller average velocity, not a larger one: v_avg = Δx/Δt.
        - |
          Average velocity depends on the time interval as well as the displacement; equal displacements do not mean equal velocities.
        - |
          This squares the factor of 3. Average velocity is inversely proportional to Δt, not to Δt².
        - |
          Correct. v_avg = Δx/Δt; with Δx fixed and Δt tripled, v_avg is one-third as large.
      answer: 3
    - slug: apphys1-u01-w01-q12
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        A skateboarder rolling in a straight line speeds up from 1.5 m/s to 6.0 m/s in 3.0 s. What is the magnitude of the skateboarder's average acceleration?
      options:
        - "2.0 m/s²"
        - "2.5 m/s²"
        - "1.5 m/s²"
        - "0.67 m/s²"
      option_explanations:
        - |
          This divides the final velocity by the time (6.0/3.0), forgetting that the skateboarder did not start from rest.
        - |
          This adds the velocities, (1.5 + 6.0)/3.0 = 2.5; acceleration uses the change in velocity.
        - |
          Correct. a = (6.0 − 1.5)/3.0 = 4.5/3.0 = 1.5 m/s².
        - |
          This inverts the ratio, 3.0/4.5. Acceleration is change in velocity divided by time.
      answer: 2
    - slug: apphys1-u01-w01-q13
      type: multi_select
      topic_code: "1.1"
      source: "AP Physics 1 CED, Topic 1.1"
      points: 2
      partial_credit: true
      prompt: |
        Which of these quantities are vectors? Select all that apply.
      options:
        - "The displacement of an elevator from the lobby to the fourth floor"
        - "The velocity of a canoe paddling downstream"
        - "The acceleration of a sled sliding down a hill"
        - "The speed shown on a car's speedometer"
        - "The distance a hiker walks on a winding trail"
        - "The duration of a lunch break"
      option_explanations:
        - |
          Correct. Displacement has a size and a direction (upward, from the lobby to the fourth floor).
        - |
          Correct. Velocity includes a direction (downstream) as well as a speed.
        - |
          Correct. Acceleration has a direction (here, down the slope while the sled speeds up).
        - |
          A speedometer shows speed, the magnitude of velocity only, so it is a scalar.
        - |
          Distance along a path is a scalar: total length, no direction.
        - |
          A time interval is a scalar: it has no direction.
      answer: [0, 1, 2]
    - slug: apphys1-u01-w01-q14
      type: multi_select
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 2
      partial_credit: true
      prompt: |
        A cart on a straight track has a positive velocity whose magnitude is decreasing. Which statements must be true? Select all that apply.
      options:
        - "The cart's acceleration is negative."
        - "The cart's speed is decreasing."
        - "The cart is moving in the positive direction."
        - "The cart's acceleration is positive."
        - "The cart is moving in the negative direction."
      option_explanations:
        - |
          Correct. The velocity is positive and getting smaller, so Δv is negative and the acceleration points the negative way.
        - |
          Correct. Speed is the magnitude of velocity, and that magnitude is decreasing.
        - |
          Correct. A positive velocity means motion in the positive direction.
        - |
          A positive acceleration with a positive velocity would make the cart speed up, which contradicts the decreasing magnitude.
        - |
          The velocity is positive, so the cart is moving in the positive direction, not the negative one.
      answer: [0, 1, 2]
    - slug: apphys1-u01-w01-q15
      type: true_false
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        True or false: An object with a negative acceleration must be slowing down.
      answer: false
      explanation: |
        False. Whether an object slows down depends on the signs of both velocity and acceleration. An object moving in the negative direction with a negative acceleration is speeding up; only an object moving in the positive direction slows down when its acceleration is negative.
    - slug: apphys1-u01-w01-q16
      type: true_false
      topic_code: "1.1"
      source: "AP Physics 1 CED, Topic 1.1"
      points: 1
      prompt: |
        True or false: For any trip, the magnitude of the displacement is less than or equal to the distance travelled.
      answer: true
      explanation: |
        True. The straight line from start to finish is the shortest path between them, so the path actually travelled can never be shorter. They are equal only when the motion is along a straight line without reversing direction.
    - slug: apphys1-u01-w01-q17
      type: fill_blank
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        A freight elevator rises 24 m at constant velocity in 8.0 s. Taking up as positive, its velocity is ____ m/s.
      answer: ["3", "3.0", "+3", "+3.0", "three"]
      explanation: |
        v = Δx/Δt = 24 m / 8.0 s = 3.0 m/s, upward (positive).
    - slug: apphys1-u01-w01-q18
      type: fill_blank
      topic_code: "1.1"
      source: "AP Physics 1 CED, Topic 1.1"
      points: 1
      prompt: |
        A student walks 6 m east to a vending machine and then 6 m west back to her desk. Her displacement for the whole trip is ____ m.
      answer: ["0", "0.0", "zero"]
      explanation: |
        She ends where she started, so Δx = +6 m − 6 m = 0 m. The distance she walked is 12 m, but displacement depends only on the start and end points.
    - slug: apphys1-u01-w01-q19
      type: numeric
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        A car moving at 25 m/s brakes steadily to a stop in 5.0 s. Taking the direction of motion as positive, what is its average acceleration? Give your answer in m/s², with its sign, to two significant figures.
      answer: { value: -5.0, tolerance: 0.05 }
      explanation: |
        a = (v_f − v_i)/Δt = (0 − 25)/5.0 = −5.0 m/s². The negative sign means the acceleration points opposite to the motion, so the car slows down.
    - slug: apphys1-u01-w01-q20
      type: numeric
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        A city bus travels 3.0 km along its route in 6.0 minutes and then waits at a stop for 4.0 minutes. What is its average speed over the full 10.0 minutes? Give your answer in m/s, to two significant figures.
      answer: { value: 5.0, tolerance: 0.05 }
      explanation: |
        Average speed = total distance/total time = 3000 m / (10.0 × 60 s) = 3000/600 = 5.0 m/s. The waiting time counts, because the interval is the full 10 minutes.
    - slug: apphys1-u01-w01-q21
      type: short_answer
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 3
      prompt: |
        A motion sensor records the velocity of a toy car on a straight track (toward the sensor is negative):

        | t (s) | 0 | 1 | 2 | 3 | 4 |
        |---|---|---|---|---|---|
        | v (m/s) | 3.0 | 1.5 | 0.0 | −1.5 | −3.0 |

        (a) Calculate the car's acceleration.
        (b) For t = 1 s and t = 3 s, give the direction the car is moving and whether it is speeding up or slowing down.
        (c) A student claims that the acceleration is zero at t = 2 s because the car is momentarily at rest. Evaluate the claim using the data.
      answer: |
        (a) The velocity falls by 1.5 m/s every second, so a = Δv/Δt = (−3.0 − 3.0)/4 = −1.5 m/s² (constant).
        (b) At t = 1 s: moving in the positive direction (away from the sensor), slowing down (velocity +, acceleration −). At t = 3 s: moving in the negative direction (toward the sensor), speeding up (velocity −, acceleration −).
        (c) The claim is wrong. The velocity changes from +1.5 m/s at t = 1 s to −1.5 m/s at t = 3 s, the same −1.5 m/s per second as everywhere else, so the acceleration at t = 2 s is still −1.5 m/s². Zero velocity does not mean zero acceleration.
      explanation: |
        Three points, one per part. (a) −1.5 m/s² with the sign (accept 1.5 m/s² toward the sensor). (b) both instants correct: direction and speeding up or slowing down, justified by comparing signs (one instant only earns nothing). (c) rejects the claim with evidence from the table (the velocity is still changing at the same rate through t = 2 s). Saying "acceleration is zero because v = 0" loses the point.
    - slug: apphys1-u01-w01-q22
      type: short_answer
      topic_code: "1.1"
      source: "AP Physics 1 CED, Topic 1.1"
      points: 2
      prompt: |
        After a bike ride, a student's cycle computer shows a distance of 12 km. She says, "So my displacement for the ride was 12 km." Explain when her statement would be correct and when it would not, giving one specific example of a ride for which it is wrong.
      answer: |
        Distance (a scalar) counts the whole path; displacement (a vector) is the straight-line change in position from start to finish, with a direction. Her statement is correct only if she rode in a straight line without turning back, in which case the displacement is 12 km in that direction. It is wrong for any ride that turns or reverses: for example, riding 6 km out along a road and 6 km back home gives a displacement of 0 km even though the computer shows 12 km.
      explanation: |
        Two points. 1 point: distinguishes distance (total path, scalar) from displacement (start-to-finish change in position, with direction) and says they match only for straight-line motion without reversing. 1 point: a specific counterexample with its displacement stated (an out-and-back ride with displacement 0, or a loop, or an L-shaped route with a smaller displacement).
    - slug: apphys1-u01-w01-q23
      type: long_answer
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 6
      prompt: |
        Qualitative/quantitative translation. A jogger runs along a straight path from her front door to a park gate a distance D away at a constant speed v₁, then immediately runs back home at a constant speed v₂, where v₂ is less than v₁.

        (A) Without equations, explain how the jogger's average speed for the round trip compares with (v₁ + v₂)/2, and what her average velocity for the round trip is.

        (B) Derive an expression for the jogger's average speed for the round trip in terms of v₁ and v₂ only.

        (C) Show that your expression agrees with your reasoning in (A), including the case v₁ = v₂.

        (D) The jogger runs out at 4.0 m/s and back at 2.0 m/s. Calculate her average speed.
      answer: |
        (A) She covers equal distances at the two speeds, so she spends more time at the slower speed v₂. The average speed weights each speed by the time spent at it, so it is pulled toward v₂ and is less than the simple average (v₁ + v₂)/2. Her average velocity is zero, because she ends where she started (zero displacement).
        (B) Time out t₁ = D/v₁, time back t₂ = D/v₂. Average speed = 2D/(D/v₁ + D/v₂) = 2/(1/v₁ + 1/v₂) = 2v₁v₂/(v₁ + v₂).
        (C) If v₁ = v₂ = v, the expression gives 2v²/(2v) = v, as it must. For unequal speeds, (v₁ + v₂)/2 − 2v₁v₂/(v₁ + v₂) = (v₁ − v₂)²/(2(v₁ + v₂)), which is positive whenever v₁ ≠ v₂, so the average speed is less than the simple average, matching (A). D has cancelled, consistent with the reasoning not depending on how far the gate is.
        (D) 2(4.0)(2.0)/(4.0 + 2.0) = 16/6 ≈ 2.7 m/s (less than the simple average of 3.0 m/s).
      explanation: |
        Six points.
        (A) 2 points: 1 for arguing that more time is spent at the slower speed so the average speed is less than (v₁ + v₂)/2; 1 for average velocity = 0 because the displacement is zero.
        (B) 2 points: 1 for writing the two times D/v₁ and D/v₂ and dividing total distance 2D by total time; 1 for simplifying to 2v₁v₂/(v₁ + v₂) (any equivalent form without D, such as 2/(1/v₁ + 1/v₂)).
        (C) 1 point: the limiting case v₁ = v₂ = v gives v, and a correct argument (algebraic or with a numerical example) that the expression is below (v₁ + v₂)/2 when the speeds differ.
        (D) 1 point: about 2.7 m/s (accept 2.6 to 2.7). The answer 3.0 m/s earns nothing.
