      prompt: |
        A basketball is launched at 9.0 m/s, 50° above the horizontal, and is caught at the same height it was launched from. Air resistance is negligible.

        (a) Calculate the horizontal and vertical components of the ball's velocity at launch.
        (b) Describe the ball's velocity vector and acceleration vector at the highest point, with values.
        (c) Give the horizontal and vertical components of the ball's velocity just before it is caught, and explain how you know them without solving for the time.
      answer: |
        (a) v₀ₓ = 9.0 cos 50° ≈ 5.8 m/s; v₀ᵧ = 9.0 sin 50° ≈ 6.9 m/s (upward).
        (b) Velocity: horizontal, 5.8 m/s (the vertical component is zero). Acceleration: 9.8 m/s² straight down.
        (c) v_x = 5.8 m/s (no horizontal acceleration) and v_y = 6.9 m/s downward. The vertical motion is symmetric: falling back to the launch height, the ball regains its launch vertical speed (from v_y² = v₀ᵧ² − 2gΔy with Δy = 0), now pointing down.
      explanation: |
        Three points, one per part. (a) both components, about 5.8 m/s and 6.9 m/s (sine and cosine swapped earns nothing). (b) a nonzero horizontal velocity of about 5.8 m/s and an acceleration of 9.8 m/s² downward, both stated. (c) 5.8 m/s horizontal and 6.9 m/s downward, justified by constant v_x and the symmetry (or v_y² = v₀ᵧ² − 2gΔy with Δy = 0).
    - slug: apphys1-u01-w04-q23
      type: short_answer
      topic_code: "1.4"
      source: "AP Physics 1 CED, Topic 1.4"
      points: 2
      prompt: |
        On a windless day, rain falls straight down. A passenger in a moving car notices that the raindrops leave slanted streaks on the side windows. Explain the slant using relative velocity, and predict how the slant changes when the car speeds up.
      answer: |
        In the car's frame, the velocity of the rain is v(rain, car) = v(rain, ground) − v(car, ground): the rain's downward velocity plus a horizontal velocity equal in size to the car's speed, pointing toward the back of the car. The sum of these perpendicular velocities slants downward and backward, so the streaks slant. When the car speeds up, the backward component grows while the downward component stays the same, so the streaks tilt farther from vertical (more nearly horizontal).
      explanation: |
        Two points. 1 point: explains that in the car's frame the rain has a backward horizontal component equal to the car's speed, which combines with the downward velocity to give a slanted relative velocity. 1 point: predicts that a faster car makes the streaks more slanted (farther from vertical), with the reason that only the horizontal component increases.
    - slug: apphys1-u01-w04-q24
      type: long_answer
      topic_code: "1.5"
      source: "AP Physics 1 CED, Topic 1.5"
      points: 6
      prompt: |
        Qualitative/quantitative translation. From the flat roof of a building of height h, two students throw identical balls horizontally at the same moment: ball 1 at speed v and ball 2 at speed 2v. Air resistance is negligible.

        (A) Without equations, compare the two balls' times in the air, their landing distances from the base of the building, and their speeds just before landing. Explain why ball 2 does not land twice as fast as ball 1.

        (B) Derive expressions, in terms of h, v and g, for the time in the air, ball 1's landing distance and ball 1's landing speed. Then write ball 2's landing distance and landing speed.

        (C) Show that your expressions agree with your reasoning in (A).

        (D) For h = 20 m and v = 5.0 m/s, calculate both landing speeds.
      answer: |
        (A) Both balls fall the same height from zero vertical velocity, so they are in the air for the same time. In that equal time, ball 2 travels horizontally at twice the speed, so it lands twice as far from the base. At landing, both balls have the same vertical velocity (same fall), and ball 2's horizontal velocity is twice ball 1's. The landing speed combines a doubled horizontal part with an unchanged vertical part, so ball 2 lands faster than ball 1 but less than twice as fast.
        (B) Time: h = ½gt², so t = √(2h/g) for both. Ball 1's distance: x₁ = v√(2h/g); ball 1's landing speed: v₁ = √(v² + (gt)²) = √(v² + 2gh). Ball 2: x₂ = 2v√(2h/g) = 2x₁; landing speed v₂ = √(4v² + 2gh).
        (C) t does not contain v, so the times are equal; x₂ = 2x₁. v₂/v₁ = √(4v² + 2gh)/√(v² + 2gh): this is greater than 1 because 4v² is more than v², and less than 2 because 4v² + 2gh is less than 4v² + 8gh = 4(v² + 2gh). It approaches 2 only if h approaches 0 (no vertical part), as expected.
        (D) 2gh = 2(9.8)(20) = 392 m²/s². v₁ = √(25 + 392) ≈ 20 m/s (20.4 m/s); v₂ = √(100 + 392) ≈ 22 m/s (22.2 m/s). Both are in the air √(40/9.8) ≈ 2.0 s.
      explanation: |
        Six points.
        (A) 2 points: 1 for equal times and ball 2 landing twice as far, with the reason (same vertical motion, horizontal motion independent); 1 for explaining that the landing speed combines a doubled horizontal component with an equal vertical component, so ball 2 is faster but less than twice as fast.
        (B) 2 points: 1 for t = √(2h/g) and x₁ = v√(2h/g) (x₂ = 2x₁); 1 for v₁ = √(v² + 2gh) and v₂ = √(4v² + 2gh) (equivalent forms using gt accepted).
        (C) 1 point: uses the expressions to show equal times, double distance and a speed ratio between 1 and 2 (an algebraic argument or a correct numerical demonstration tied to the expressions).
        (D) 1 point: about 20 m/s and 22 m/s (accept 20.4 and 22.2). Answers of 20 and 40 m/s earn nothing.
