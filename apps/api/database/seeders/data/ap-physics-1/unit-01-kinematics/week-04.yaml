      prompt: |
        A soccer ball is kicked from level ground at 18 m/s, 45° above the horizontal. Air resistance is negligible. How far away does it land? Give your answer in metres, to two significant figures.
      answer: { value: 33, tolerance: 0.4 }
      explanation: |
        v₀ₓ = v₀ᵧ = 18 cos 45° ≈ 12.73 m/s. Time of flight T = 2(12.73)/9.8 ≈ 2.60 s. Range R = 12.73 × 2.60 ≈ 33 m (equivalently v₀²/g = 324/9.8 ≈ 33 m at 45°).
