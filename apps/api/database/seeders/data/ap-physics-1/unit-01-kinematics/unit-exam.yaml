    type: short_answer
    topic_code: "1.3"
    source: "AP Physics 1 CED, Topic 1.3"
    points: 3
    prompt: |
      From a bridge a height h above a river, a student throws ball 1 straight down at speed v and, at the same moment, throws ball 2 straight up at the same speed v. Air resistance is negligible. Another student claims that ball 1 hits the water at a greater speed because it was thrown downward.

      (a) Evaluate the claim without equations, using what happens to ball 2 when it comes back down past the bridge.
      (b) Derive an expression for each ball's speed just before it hits the water, in terms of v, g and h.
      (c) Which ball hits the water first, and by how much time? Justify your answer.
    answer: |
      (a) The claim is wrong. Ball 2 rises, stops and falls back; when it passes the bridge again it is moving down at speed v (the motion is symmetric). From then on it moves exactly as ball 1 did, so the two balls hit the water at the same speed.
      (b) Using v_f² = v₀² + 2gΔy with down positive and Δy = h, and v₀² = v² for both balls: v_f = √(v² + 2gh) for each. The direction of the launch does not appear, because only v₀² enters.
      (c) Ball 1 lands first. Ball 2 spends extra time going up and coming back to the bridge: 2v/g (v/g up and v/g down). After that its motion copies ball 1's, so ball 1 lands earlier by 2v/g.
      (Teachers may accept any equivalent sign convention.)
    explanation: |
      Three points, one per part. (a) rejects the claim with the symmetry argument (ball 2 returns past the bridge at speed v downward, then repeats ball 1's motion). (b) √(v² + 2gh) for both balls, from v_f² = v₀² + 2gΔy. (c) ball 1 first, by 2v/g, with the reason (the time ball 2 spends rising and returning to the bridge).
  - slug: apphys1-u01-exam-q40
    type: short_answer
    topic_code: "1.4"
    source: "AP Physics 1 CED, Topic 1.4"
    points: 3
    prompt: |
      Two swimmers each swim at 1.5 m/s relative to the water in a river whose current is 0.90 m/s. Swimmer A swims straight across the 60 m wide river and back, always aiming upstream just enough to stay on the line straight across. Swimmer B swims 60 m upstream along the bank and 60 m back downstream.

      (a) Calculate swimmer A's round-trip time.
      (b) Calculate swimmer B's round-trip time.
      (c) Explain, without numbers, why swimmer B's trip takes longer than it would in still water, even though the current helps on the way back.
    answer: |
      (a) Across speed relative to the ground = √(1.5² − 0.90²) = √(2.25 − 0.81) = 1.2 m/s. Time = 2 × 60/1.2 = 100 s.
      (b) Upstream: 1.5 − 0.90 = 0.60 m/s, time 60/0.60 = 100 s. Downstream: 1.5 + 0.90 = 2.4 m/s, time 60/2.4 = 25 s. Total 125 s.
      (c) Swimmer B covers equal distances at the slow and fast ground speeds, so she spends much longer at the slow upstream speed than at the fast downstream speed. The time lost going upstream is more than the time gained coming back, so the round trip is slower than in still water (80 s at 1.5 m/s).
    explanation: |
      Three points, one per part. (a) 100 s, using the across component √(v_s² − v_c²) = 1.2 m/s (using 1.5 m/s or 1.75 m/s earns nothing). (b) 125 s, from 0.60 m/s upstream and 2.4 m/s downstream. (c) more time is spent at the slower speed, so the loss upstream outweighs the gain downstream (an argument that the two effects cancel earns nothing).
  # ---- Free-response question 1: experimental design and analysis (1.5)
  - slug: apphys1-u01-exam-q41
    type: long_answer
    topic_code: "1.5"
    source: "AP Physics 1 CED, Topic 1.5"
    points: 10
    prompt: |
      Experimental design and analysis. A lab group wants to determine the free-fall acceleration g using balls launched horizontally from a table. They can roll a steel ball down a short ramp clamped at the edge of the table so that it leaves the table moving horizontally, and they can change the launch speed by releasing the ball from different points on the ramp.

      (A) Describe a procedure the group could use to collect data from which g can be determined. Name each quantity measured, the equipment used to measure it, and one way to reduce experimental uncertainty.

      The group measures the launch speed v with a photogate at the table edge and the landing distance d from the point on the floor directly below the edge, for a launch height of 0.95 m. Each distance is the mean of three trials.

      | v (m/s) | 1.10 | 1.45 | 1.80 | 2.15 | 2.50 |
      |---|---|---|---|---|---|
      | d (m) | 0.49 | 0.63 | 0.80 | 0.94 | 1.11 |

      (B) Which quantities should the group graph to produce a straight line? Justify your choice by deriving the relationship between them.

      (C) Determine the slope of the best-fit line for the quantities you chose, showing your work.

      (D) Use the slope to calculate an experimental value of g.

      (E) A student suggests that the ramp gave the ball a small downward component of velocity at launch, so it did not leave exactly horizontally. Would this make the experimental value of g larger or smaller than it should be? Explain.
    answer: |
      (A) Measure the launch height H from the table edge to the floor with a metre stick. Measure the launch speed v with a photogate at the edge (ball diameter ÷ blocking time), or by timing the ball over a known distance on the table. Mark landing spots with carbon paper on white paper taped to the floor and measure each d with a metre stick from a plumb line below the edge. Release from several points on the ramp to vary v. Reduce uncertainty by repeating each release several times and averaging d, or by marking the release point so each trial is the same.
      (B) Graph d (vertical) against v (horizontal). The fall time t = √(2H/g) is the same for every launch, and d = v t = v√(2H/g), so d is proportional to v: a straight line through the origin with slope √(2H/g).
      (C) The data lie close to a line through the origin. Using two well-separated points on the best-fit line, slope ≈ (1.11 − 0.49)/(2.50 − 1.10) = 0.62/1.40 ≈ 0.443 s (a fit through the origin gives about 0.441 s).
      (D) slope = √(2H/g), so g = 2H/slope² = 2(0.95)/(0.443)² ≈ 9.7 m/s².
      (E) Larger. A downward launch component makes the ball reach the floor sooner, so each d is shorter than the model predicts; the slope comes out smaller and g = 2H/slope² comes out larger than the true value.
    explanation: |
      Ten points.
      (A) 3 points: 1 for measuring H and d with a metre stick or tape (with a way to locate the landing point, such as carbon paper); 1 for measuring v with a stated method (photogate, or timing over a known distance) and varying v by changing the release point; 1 for a valid way to reduce uncertainty (repeat and average, fixed release point, plumb line).
      (B) 2 points: 1 for choosing d against v (or d against v with axes swapped, or d² against v²); 1 for the derivation: t fixed by H alone, d = v√(2H/g), so the slope is √(2H/g).
      (C) 2 points: 1 for a slope from a best-fit line using points on the line, not one data pair alone unless it lies on the line; 1 for a value between 0.43 and 0.46 s with units.
      (D) 2 points: 1 for g = 2H/slope² (or the equivalent for the chosen axes); 1 for a value between 9.0 and 10.3 m/s² consistent with the slope found.
      (E) 1 point: larger, with the reasoning that a downward launch shortens the flight time and so each d, lowering the slope and raising 2H/slope². The answer must state the direction and give this chain of reasoning.
  # ---- Free-response question 2: translation between representations (1.3), parts A–C, then part D
  - slug: apphys1-u01-exam-q42
    type: long_answer
    topic_code: "1.3"
    source: "AP Physics 1 CED, Topic 1.3"
    points: 8
    stimulus: |
      A model rocket is launched straight up from rest on level ground. Its engine gives it a constant upward acceleration of magnitude a for a time t₁, and then burns out. After burnout the rocket moves in free fall until it returns to the ground. Air resistance is negligible, and up is positive.
    prompt: |
      Translation between representations, parts A–C.

      (A) Describe the rocket's velocity–time graph from launch until just before it hits the ground. Give the value of the velocity at burnout, the slope of each section, and the time at which the rocket is at its highest point. Then describe the matching acceleration–time graph.

      (B) Starting from your description in (A) or from the kinematic equations, derive an expression for the rocket's maximum height H in terms of a, t₁ and g.

      (C) For a = 20 m/s² and t₁ = 2.5 s, calculate the rocket's speed at burnout, its height at burnout and its maximum height.
    answer: |
      (A) v–t graph: a straight line from 0 at t = 0 rising with slope +a to v = at₁ at t = t₁ (burnout); then a straight line with slope −g, crossing zero at t = t₁ + at₁/g (the highest point), and continuing below the axis until the rocket lands. a–t graph: a horizontal line at +a from 0 to t₁, then a horizontal line at −g for the rest of the flight.
      (B) Height at burnout = area of the first triangle = ½at₁². Extra rise after burnout = area of the second triangle (base at₁/g, height at₁) = ½(at₁)(at₁/g) = a²t₁²/(2g). H = ½at₁² + a²t₁²/(2g) = (at₁²/2)(1 + a/g). (Equivalently, from Δy = ½at₁² and v² = (at₁)² − 2gΔy.)
      (C) Burnout speed = 20 × 2.5 = 50 m/s. Burnout height = ½(20)(2.5)² = 62.5 m. Extra rise = 50²/(2 × 9.8) ≈ 127.6 m. H ≈ 190 m.
    explanation: |
      Eight points.
      (A) 3 points: 1 for a straight rising section with slope a reaching at₁ at t₁; 1 for a straight section of slope −g after burnout crossing zero at t₁ + at₁/g, which is labelled as the highest point (a graph that turns around at burnout loses this point); 1 for the a–t graph as two horizontal sections, +a then −g.
      (B) 3 points: 1 for the burnout height ½at₁² (from the area or Δy = ½at²); 1 for the coasting rise (at₁)²/(2g); 1 for combining them into H = ½at₁² + a²t₁²/(2g) or an equivalent form.
      (C) 2 points: 1 for 50 m/s and 62.5 m; 1 for H ≈ 190 m (accept 188 to 192 m). Using g = 10 m/s² (H = 187.5 m) is accepted only if stated.
  - slug: apphys1-u01-exam-q43
    type: short_answer
    topic_code: "1.3"
    source: "AP Physics 1 CED, Topic 1.3"
    points: 4
    stimulus: |
      A model rocket is launched straight up from rest on level ground. Its engine gives it a constant upward acceleration of magnitude a for a time t₁, and then burns out. After burnout the rocket moves in free fall until it returns to the ground. Air resistance is negligible, and up is positive.
    prompt: |
      Part D of the translation between representations question.

      (D)(i) Explain how the area under your velocity–time graph from part (A), from launch to the highest point, corresponds to your expression for H in part (B).

      (D)(ii) A student builds a second rocket with the same acceleration a but an engine that burns for 2t₁. Use your expression from part (B) to predict how its maximum height compares with the first rocket's. Then explain how the shape of the velocity–time graph supports your prediction.
