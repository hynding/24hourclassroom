unit: 1
description: |
  43 questions · about 90 minutes · every topic of Unit 1 (1.1 to 1.5): scalars and vectors, displacement,
  velocity and acceleration, motion graphs and the constant-acceleration equations, free fall, reference frames
  and relative motion, vector components and projectile motion. Includes three shared-context sets (a
  four-question set on an elevator's velocity table, a four-question set on a ferry crossing a river and a
  three-question set on a stone thrown from a cliff), select-all, true/false, fill-in-the-blank and numeric
  items, two short-answer questions (3 points each) and two free-response questions in the 2027 AP style: an
  experimental design and analysis question (10 points) on finding g from horizontal launches, and a
  translation between representations question on a model rocket (12 points, written as an 8-point long
  answer followed by its 4-point part D). Use g = 9.8 m/s². Calculators are allowed throughout, as on the AP
  exam. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items
  are matched automatically; the short answers and free-response questions are graded by your teacher against
  the scoring notes.
questions:
  # ---- Stimulus set A: an elevator's velocity table (1.3, 1.2)
  - slug: apphys1-u01-exam-q01
    type: multiple_choice
    topic_code: "1.3"
    source: "AP Physics 1 CED, Topic 1.3"
    points: 1
    stimulus: |
      A student rides an elevator from the ground floor to the top of a building and records its velocity with a phone app (up is positive). Between the listed times the velocity changes at a steady rate.

      | t (s) | 0 | 1 | 2 | 5 | 8 | 9.5 | 11 |
      |---|---|---|---|---|---|---|---|
      | v (m/s) | 0 | 1.5 | 3.0 | 3.0 | 3.0 | 1.5 | 0 |
    prompt: |
      What is the elevator's acceleration from t = 0 to t = 2 s?
    options:
      - "1.5 m/s² upward"
      - "3.0 m/s² upward"
      - "6.0 m/s² upward"
      - "0, because the elevator starts from rest"
    option_explanations:
      - |
        Correct. The slope of the velocity data is Δv/Δt = (3.0 − 0)/2 = 1.5 m/s², positive, so upward.
      - |
        3.0 m/s is the velocity reached at t = 2 s, not the rate at which the velocity changes.
      - |
        This multiplies the velocity change by the time (3.0 × 2) instead of dividing.
      - |
        Starting from rest does not make the acceleration zero; the velocity is changing from 0 to 3.0 m/s.
    answer: 0
  - slug: apphys1-u01-exam-q02
    type: multiple_choice
    topic_code: "1.3"
    source: "AP Physics 1 CED, Topic 1.3"
    points: 1
    stimulus: |
      A student rides an elevator from the ground floor to the top of a building and records its velocity with a phone app (up is positive). Between the listed times the velocity changes at a steady rate.

      | t (s) | 0 | 1 | 2 | 5 | 8 | 9.5 | 11 |
      |---|---|---|---|---|---|---|---|
      | v (m/s) | 0 | 1.5 | 3.0 | 3.0 | 3.0 | 1.5 | 0 |
    prompt: |
      How far does the elevator rise from t = 0 to t = 11 s?
    options:
      - "33 m"
      - "21 m"
      - "25.5 m"
      - "18 m"
    option_explanations:
      - |
        This multiplies the top speed by the whole 11 s, as if the elevator moved at 3.0 m/s throughout.
      - |
        This counts the speeding-up triangle (3 m) and the constant-speed rectangle (18 m) but leaves out the slowing-down triangle.
      - |
        Correct. Area under the v–t graph: ½(2)(3.0) + (6)(3.0) + ½(3)(3.0) = 3 + 18 + 4.5 = 25.5 m.
      - |
        This counts only the constant-speed stage from t = 2 s to t = 8 s.
    answer: 2
  - slug: apphys1-u01-exam-q03
    type: multiple_choice
    topic_code: "1.2"
    source: "AP Physics 1 CED, Topic 1.2"
    points: 1
    stimulus: |
      A student rides an elevator from the ground floor to the top of a building and records its velocity with a phone app (up is positive). Between the listed times the velocity changes at a steady rate.

      | t (s) | 0 | 1 | 2 | 5 | 8 | 9.5 | 11 |
      |---|---|---|---|---|---|---|---|
      | v (m/s) | 0 | 1.5 | 3.0 | 3.0 | 3.0 | 1.5 | 0 |
    prompt: |
      What is the elevator's average velocity for the whole 11 s ride?
    options:
      - "3.0 m/s upward"
      - "1.5 m/s upward"
      - "0, because it starts and ends at rest"
      - "2.3 m/s upward"
    option_explanations:
      - |
        3.0 m/s is the top speed; the elevator moves more slowly while speeding up and slowing down.
      - |
        This averages the starting and top velocities as if the acceleration were constant over the whole ride; it is not.
      - |
        Starting and ending at rest makes the average acceleration zero, not the average velocity; the elevator rose 25.5 m.
      - |
        Correct. v_avg = Δy/Δt = 25.5 m / 11 s ≈ 2.3 m/s upward.
    answer: 3
  - slug: apphys1-u01-exam-q04
    type: multiple_choice
    topic_code: "1.3"
    source: "AP Physics 1 CED, Topic 1.3"
    points: 1
    stimulus: |
      A student rides an elevator from the ground floor to the top of a building and records its velocity with a phone app (up is positive). Between the listed times the velocity changes at a steady rate.

      | t (s) | 0 | 1 | 2 | 5 | 8 | 9.5 | 11 |
      |---|---|---|---|---|---|---|---|
      | v (m/s) | 0 | 1.5 | 3.0 | 3.0 | 3.0 | 1.5 | 0 |
    prompt: |
      Which describes the elevator's acceleration–time graph?
    options:
      - "+1.5 m/s² from 0 to 2 s, then 0 from 2 to 8 s, then +1.0 m/s² from 8 to 11 s"
      - "+1.5 m/s² from 0 to 2 s, then 0 from 2 to 8 s, then −1.0 m/s² from 8 to 11 s"
      - "A line rising from 0 to 3.0 m/s² over 0 to 2 s, flat at 3.0 m/s² until 8 s, then falling to 0 at 11 s"
      - "+1.5 m/s² from 0 to 2 s, then 0 from 2 to 8 s, then −1.5 m/s² from 8 to 11 s"
    option_explanations:
      - |
        The elevator slows while still moving up, so the acceleration in the last stage is opposite to the velocity: negative.
      - |
        Correct. Slopes of the three stages: 3.0/2 = +1.5, 0, and −3.0/3 = −1.0 m/s². The a–t graph is three flat steps.
      - |
        This copies the shape of the v–t graph onto the a–t axes, confusing velocity with acceleration.
      - |
        The slowing-down stage lasts 3 s, not 2 s: −3.0/3 = −1.0 m/s², not −1.5 m/s².
    answer: 1
  # ---- Stimulus set B: a ferry crossing a river (1.4)
  - slug: apphys1-u01-exam-q05
    type: multiple_choice
    topic_code: "1.4"
    source: "AP Physics 1 CED, Topic 1.4"
    points: 1
    stimulus: |
      A ferry crosses a straight river 300 m wide. The river flows east at 1.5 m/s relative to the ground, and the ferry moves at 4.0 m/s relative to the water. North is straight across the river.
    prompt: |
      The ferry points due north. How far downstream of the point directly opposite its dock does it land?
    options:
      - "105 m"
      - "75 m"
      - "113 m"
      - "800 m"
    option_explanations:
      - |
        This divides the 300 m width by the ground speed (4.27 m/s) to get the time; the across motion is set by the 4.0 m/s northward component alone.
      - |
        75 is the crossing time in seconds (300/4.0), not the drift distance.
      - |
        Correct. Crossing time = 300/4.0 = 75 s; drift = 1.5 m/s × 75 s ≈ 113 m (112.5 m) downstream.
      - |
        This inverts the ratio of speeds (300 × 4.0/1.5). The drift is width × (current/boat speed).
    answer: 2
  - slug: apphys1-u01-exam-q06
    type: multiple_choice
    topic_code: "1.4"
    source: "AP Physics 1 CED, Topic 1.4"
    points: 1
    stimulus: |
      A ferry crosses a straight river 300 m wide. The river flows east at 1.5 m/s relative to the ground, and the ferry moves at 4.0 m/s relative to the water. North is straight across the river.
    prompt: |
      While the ferry points due north, what is its speed relative to the ground?
    options:
      - "4.3 m/s"
      - "5.5 m/s"
      - "2.5 m/s"
      - "3.7 m/s"
    option_explanations:
      - |
        Correct. The velocities are perpendicular: √(4.0² + 1.5²) ≈ 4.3 m/s.
      - |
        This adds the speeds as if the current pushed the ferry forward along its heading.
      - |
        This subtracts the speeds as if the ferry headed straight upstream.
      - |
        This subtracts the squares, √(4.0² − 1.5²); that is the across speed when the ferry aims upstream to land directly opposite, not its speed here.
    answer: 0
  - slug: apphys1-u01-exam-q07
    type: multiple_choice
    topic_code: "1.4"
    source: "AP Physics 1 CED, Topic 1.4"
    points: 1
    stimulus: |
      A ferry crosses a straight river 300 m wide. The river flows east at 1.5 m/s relative to the ground, and the ferry moves at 4.0 m/s relative to the water. North is straight across the river.
    prompt: |
      On the return trip the captain wants to travel straight across and land directly opposite. In which direction must the ferry point?
    options:
      - "22° east of north"
      - "68° west of north"
      - "Due west, straight upstream"
      - "22° west of north"
    option_explanations:
      - |
        Pointing downstream adds to the current's drift. The ferry must point upstream (west) to cancel it.
      - |
        This uses cos θ = 1.5/4.0, measuring the angle from the wrong side; the upstream component 4.0 sin θ must equal 1.5 m/s, which gives 22°.
      - |
        Pointing straight upstream gives no across motion at all; only part of the ferry's velocity needs to cancel the current.
      - |
        Correct. The westward component must cancel the current: 4.0 sin θ = 1.5, so θ = sin⁻¹(0.375) ≈ 22° west of north.
    answer: 3
  - slug: apphys1-u01-exam-q08
    type: numeric
    topic_code: "1.4"
    source: "AP Physics 1 CED, Topic 1.4"
    points: 1
    stimulus: |
      A ferry crosses a straight river 300 m wide. The river flows east at 1.5 m/s relative to the ground, and the ferry moves at 4.0 m/s relative to the water. North is straight across the river.
    prompt: |
      How long does the return trip take when the ferry lands directly opposite its starting point? Give your answer in seconds, to two significant figures.
    answer: { value: 81, tolerance: 1 }
    explanation: |
      The across (north) component left after cancelling the current is √(4.0² − 1.5²) ≈ 3.71 m/s, so t = 300/3.71 ≈ 81 s, longer than the 75 s needed when pointing straight across.
  # ---- Stimulus set C: a stone thrown from a cliff (1.5)
  - slug: apphys1-u01-exam-q09
    type: multiple_choice
    topic_code: "1.5"
    source: "AP Physics 1 CED, Topic 1.5"
    points: 1
    stimulus: |
      A hiker throws a stone from the edge of a cliff 30 m above a lake. The stone leaves her hand at 12 m/s, 30° above the horizontal, from the height of the cliff top. Air resistance is negligible; use g = 9.8 m/s².
    prompt: |
      How high above the cliff top does the stone rise?
    options:
      - "7.3 m"
      - "1.8 m"
      - "3.7 m"
      - "0.61 m"
    option_explanations:
      - |
        This uses the full launch speed, 12²/(2 × 9.8); only the vertical component, 6.0 m/s, goes into the vertical motion.
      - |
        Correct. v₀ᵧ = 12 sin 30° = 6.0 m/s; at the top v_y = 0, so H = 6.0²/(2 × 9.8) ≈ 1.8 m.
      - |
        This drops the 2 in v_y² = v₀ᵧ² − 2gΔy, giving 36/9.8.
      - |
        0.61 is the time to the top in seconds (6.0/9.8), not a height.
    answer: 1
  - slug: apphys1-u01-exam-q10
    type: multiple_choice
    topic_code: "1.5"
    source: "AP Physics 1 CED, Topic 1.5"
    points: 1
    stimulus: |
      A hiker throws a stone from the edge of a cliff 30 m above a lake. The stone leaves her hand at 12 m/s, 30° above the horizontal, from the height of the cliff top. Air resistance is negligible; use g = 9.8 m/s².
    prompt: |
      How long after it is thrown does the stone hit the lake?
    options:
      - "1.2 s"
      - "2.5 s"
      - "3.7 s"
      - "3.2 s"
    option_explanations:
      - |
        1.2 s is the time to rise and fall back to the cliff-top height, the level-ground time of flight; the stone still has 30 m to fall.
      - |
        This is the time to fall 30 m from rest, √(60/9.8); it ignores the stone's upward launch.
      - |
        This adds 1.2 s and 2.5 s, as if the stone dropped from rest after returning to cliff height; it is already moving down at 6.0 m/s then, so the drop is quicker.
      - |
        Correct. With up positive and the cliff top at y = 0: −30 = 6.0t − 4.9t², so 4.9t² − 6.0t − 30 = 0 and t = (6.0 + √(36 + 588))/9.8 ≈ 3.2 s.
    answer: 3
  - slug: apphys1-u01-exam-q11
    type: multiple_choice
    topic_code: "1.5"
    source: "AP Physics 1 CED, Topic 1.5"
    points: 1
    stimulus: |
      A hiker throws a stone from the edge of a cliff 30 m above a lake. The stone leaves her hand at 12 m/s, 30° above the horizontal, from the height of the cliff top. Air resistance is negligible; use g = 9.8 m/s².
    prompt: |
      How far from the base of the cliff does the stone hit the water?
    options:
      - "33 m"
      - "38 m"
      - "13 m"
      - "26 m"
    option_explanations:
      - |
        Correct. v₀ₓ = 12 cos 30° ≈ 10.4 m/s, constant; x = 10.4 × 3.16 ≈ 33 m.
      - |
        This multiplies the full launch speed by the time; only the horizontal component carries the stone sideways.
      - |
        This uses the 1.2 s level-ground flight time, which ends at cliff height, not at the lake.
      - |
        This uses the 2.5 s drop-from-rest time, ignoring the stone's upward launch.
    answer: 0
  # ---- Single questions
  - slug: apphys1-u01-exam-q12
    type: multiple_choice
    topic_code: "1.1"
    source: "AP Physics 1 CED, Topic 1.1"
    points: 1
    prompt: |
      Which list contains only scalar quantities?
    options:
      - "Displacement, time, speed"
      - "Velocity, acceleration, displacement"
      - "Distance, speed, time"
      - "Speed, velocity, distance"
    option_explanations:
      - |
        Displacement has a direction, so it is a vector; the list is not all scalars.
      - |
        All three are vectors: each has a direction.
      - |
        Correct. Distance, speed and time each have a size and a unit but no direction.
      - |
        Velocity is a vector (speed with a direction), so the list is not all scalars.
    answer: 2
  - slug: apphys1-u01-exam-q13
    type: multiple_choice
    topic_code: "1.1"
    source: "AP Physics 1 CED, Topic 1.1"
    points: 1
    prompt: |
      A toy robot on a number line starts at x = +4 m, moves to x = −6 m, and then moves to x = −2 m. What are its displacement and the distance it travels?
    options:
      - "Displacement +6 m; distance 14 m"
      - "Displacement −6 m; distance 14 m"
      - "Displacement −2 m; distance 6 m"
      - "Displacement −6 m; distance 6 m"
    option_explanations:
      - |
        The size is right, but the robot ends to the left of where it started, so the displacement is negative.
      - |
        Correct. Δx = x_f − x_i = −2 − (+4) = −6 m. Distance = 10 m (from +4 to −6) + 4 m (from −6 to −2) = 14 m.
      - |
        −2 m is the final position, not the change in position, and the distance counts both legs.
      - |
        The displacement is right, but distance counts every leg: 10 m + 4 m = 14 m.
    answer: 1
  - slug: apphys1-u01-exam-q14
    type: multiple_choice
    topic_code: "1.2"
    source: "AP Physics 1 CED, Topic 1.2"
    points: 1
    prompt: |
      A bobsled's velocity changes from −8.0 m/s to −14 m/s in 3.0 s. Which describes its acceleration and motion?
    options:
      - "−2.0 m/s²; speeding up in the negative direction"
      - "+2.0 m/s²; speeding up in the negative direction"
      - "−2.0 m/s²; slowing down"
      - "−7.3 m/s²; speeding up in the negative direction"
    option_explanations:
      - |
        Correct. a = (−14 − (−8.0))/3.0 = −6.0/3.0 = −2.0 m/s². Velocity and acceleration share a sign, so the sled speeds up.
      - |
        The speed grows from 8 to 14 m/s in the negative direction, so Δv and the acceleration are negative.
      - |
        The value is right, but same-sign velocity and acceleration means speeding up, not slowing down.
      - |
        This adds the velocities, (−14 + (−8.0))/3.0; acceleration uses their difference.
    answer: 0
  - slug: apphys1-u01-exam-q15
    type: multiple_choice
    topic_code: "1.2"
    source: "AP Physics 1 CED, Topic 1.2"
    points: 1
    prompt: |
      A cyclist rides 6.0 km up a hill at 12 km/h and returns 6.0 km down the same road at 36 km/h. What is her average speed for the round trip?
    options:
      - "24 km/h"
      - "0 km/h"
      - "12 km/h"
      - "18 km/h"
    option_explanations:
      - |
        This averages the two speeds; she spends three times as long climbing, so the average is pulled toward 12 km/h.
      - |
        Zero is the average velocity (she returns to her start); average speed uses distance.
      - |
        12 km/h is only the uphill speed; the faster descent raises the average.
      - |
        Correct. Times: 6.0/12 = 0.50 h up and 6.0/36 ≈ 0.167 h down. Average speed = 12 km / 0.667 h = 18 km/h.
    answer: 3
  - slug: apphys1-u01-exam-q16
    type: multiple_choice
    topic_code: "1.2"
    source: "AP Physics 1 CED, Topic 1.2"
    points: 1
    prompt: |
      Which statement about motion is true?
    options:
      - "An object with zero acceleration must be at rest."
      - "An object's speed and the magnitude of its average velocity are always equal."
      - "An object moving at constant speed can still be accelerating."
      - "An object with a large velocity must have a large acceleration."
    option_explanations:
      - |
        Zero acceleration means constant velocity, which can be any value, such as a car on cruise control.
      - |
        They differ whenever the path doubles back or turns: a full lap has a nonzero average speed and zero average velocity.
      - |
        Correct. Velocity is a vector; if the direction changes (a car rounding a curve at steady speed), the velocity changes, so there is an acceleration.
      - |
        Acceleration is the rate of change of velocity, not its size; a fast object at constant velocity has zero acceleration.
    answer: 2
  - slug: apphys1-u01-exam-q17
    type: multiple_choice
    topic_code: "1.3"
    source: "AP Physics 1 CED, Topic 1.3"
    points: 1
    prompt: |
      A cart's position–time graph has a positive slope everywhere, but the curve becomes flatter as time goes on. Which describes the cart's motion?
    options:
      - "Moving in the positive direction and speeding up"
      - "Moving in the positive direction and slowing down"
      - "Moving in the negative direction and slowing down"
      - "Moving at a constant velocity"
    option_explanations:
      - |
        Speeding up would make the curve steeper over time, not flatter.
      - |
        Correct. A positive slope means positive velocity; a flattening curve means the slope (velocity) is decreasing, so the cart slows down.
      - |
        The slope is positive, so the cart moves in the positive direction.
      - |
        Constant velocity gives a straight x–t line; this one curves.
    answer: 1
  - slug: apphys1-u01-exam-q18
    type: multiple_choice
    topic_code: "1.3"
    source: "AP Physics 1 CED, Topic 1.3"
    points: 1
    prompt: |
      A driver moving at 20 m/s sees a hazard. Her reaction time is 0.80 s, during which the car keeps moving at 20 m/s; then she brakes with a constant deceleration of 8.0 m/s². How far does the car travel from the moment she sees the hazard until it stops?
    options:
      - "41 m"
      - "25 m"
      - "16 m"
      - "66 m"
    option_explanations:
      - |
        Correct. Reaction stage: 20 × 0.80 = 16 m. Braking stage: v₀²/(2a) = 400/16 = 25 m. Total 41 m.
      - |
        This is the braking distance only; the car also travels 16 m during the reaction time.
      - |
        This is the reaction distance only; the car still needs 25 m to brake.
      - |
        This adds 16 m to v₀²/a = 50 m, dropping the 2 from v² = v₀² + 2aΔx.
    answer: 0
  - slug: apphys1-u01-exam-q19
    type: multiple_choice
    topic_code: "1.3"
    source: "AP Physics 1 CED, Topic 1.3"
    points: 1
    prompt: |
      A ball is thrown straight up at 19.6 m/s. Air resistance is negligible. What is its velocity 3.0 s after it is thrown?
    options:
      - "49 m/s upward"
      - "0, because it is at its highest point"
      - "9.8 m/s upward"
      - "9.8 m/s downward"
    option_explanations:
      - |
        This adds the change to the launch speed; gravity reduces the upward velocity.
      - |
        The ball reaches the top at 19.6/9.8 = 2.0 s; by 3.0 s it has been falling for 1.0 s.
      - |
        The size is right, but after the top the velocity points down.
      - |
        Correct. Up positive: v = 19.6 − 9.8(3.0) = −9.8 m/s, that is, 9.8 m/s downward.
    answer: 3
  - slug: apphys1-u01-exam-q20
    type: multiple_choice
    topic_code: "1.3"
    source: "AP Physics 1 CED, Topic 1.3"
    points: 1
    prompt: |
      A remote-control car moves at a constant +4.0 m/s for 3.0 s, then at a constant −2.0 m/s for the next 2.0 s. What is its displacement over the 5.0 s?
    options:
      - "16 m"
      - "12 m"
      - "8.0 m"
      - "1.6 m"
    option_explanations:
      - |
        16 m is the distance (12 m + 4 m); displacement counts the area below the axis as negative.
      - |
        This counts only the first stage and ignores the 4.0 m moved backward.
      - |
        Correct. Area above the axis 4.0 × 3.0 = +12 m; area below −2.0 × 2.0 = −4.0 m; net +8.0 m.
      - |
        1.6 m/s is the average velocity (8.0 m / 5.0 s), not the displacement.
    answer: 2
  - slug: apphys1-u01-exam-q21
    type: multiple_choice
    topic_code: "1.3"
    source: "AP Physics 1 CED, Topic 1.3"
    points: 1
    prompt: |
      A lab group drops a ball from rest from several heights h and times each fall t. They plot h on the vertical axis against t² on the horizontal axis and get a straight line through the origin with slope 4.85 m/s². What value of g do their data give?
    options:
      - "4.85 m/s²"
      - "9.7 m/s²"
      - "2.4 m/s²"
      - "0.21 m/s²"
    option_explanations:
      - |
        The slope is not g itself: h = ½gt², so the slope is g/2.
      - |
        Correct. h = ½gt², so slope = g/2 and g = 2 × 4.85 = 9.7 m/s².
      - |
        This halves the slope instead of doubling it.
      - |
        This takes the reciprocal of the slope (1/4.85), as if t² had been plotted against h.
    answer: 1
  - slug: apphys1-u01-exam-q22
    type: multiple_choice
    topic_code: "1.3"
    source: "AP Physics 1 CED, Topic 1.3"
    points: 1
    prompt: |
      A motion diagram shows a puck's position every 0.5 s as it slides to the right. The first four dots are equally spaced; after that, each gap is smaller than the one before, until the dots overlap. Which describes the puck's motion?
    options:
      - "Constant velocity to the right, then slowing down to a stop"
      - "Speeding up to the right, then moving at constant velocity"
      - "Constant velocity to the right, then reversing direction"
      - "At rest, then speeding up"
    option_explanations:
      - |
        Correct. Equal gaps in equal times mean constant velocity; shrinking gaps mean the puck covers less distance each interval, so it slows until the overlapping dots show it at rest.
      - |
        This reads the diagram backward: growing gaps would mean speeding up, but here the gaps shrink.
      - |
        Reversing would put later dots back to the left of earlier ones; overlapping dots show the puck stopped.
      - |
        The puck is moving at first (the dots are spread out) and ends at rest, the opposite order.
    answer: 0
  - slug: apphys1-u01-exam-q23
    type: multiple_choice
    topic_code: "1.4"
    source: "AP Physics 1 CED, Topic 1.4"
