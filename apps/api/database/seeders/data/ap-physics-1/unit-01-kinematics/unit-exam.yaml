      (D)(i) Up to the highest point the graph lies above the axis and forms two triangles sharing the vertex (t₁, at₁): the first has base t₁ and height at₁, area ½at₁²; the second has base at₁/g and height at₁, area a²t₁²/(2g). Their total area is the displacement from launch to the top, which is exactly H = ½at₁² + a²t₁²/(2g).
