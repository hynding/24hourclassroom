    type: short_answer
    topic_code: "5.2"
    source: "AP Physics 1 CED, Topic 5.2"
    points: 3
    prompt: |
      A bicycle chain runs over a front sprocket of radius 0.12 m and a rear sprocket of radius 0.045 m without slipping. The rider turns the front sprocket at a steady 4.5 rad/s.

      (a) Calculate the speed of the chain.
      (b) Calculate the angular velocity of the rear sprocket.
      (c) Explain, without relying only on the numbers, why the smaller rear sprocket must turn faster than the front one.
    answer: |
      (a) The chain moves with the rim of the front sprocket: v = rω = (0.12 m)(4.5 rad/s) = 0.54 m/s.
      (b) The same chain moves with the rim of the rear sprocket: ω = v/r = 0.54/0.045 = 12 rad/s.
      (c) Every link of the chain moves at the same speed, so the rims of both sprockets must move the same distance each second. The rear sprocket's rim is a smaller circle, so to pass the same length of chain it must turn through a larger angle each second: ω = v/r is larger when r is smaller.
    explanation: |
      Three points, one per part. (a) v = 0.54 m/s from v = rω. (b) ω = 12 rad/s using the same chain speed and the rear radius (4.5 rad/s, "same ω", earns no credit). (c) A reason based on equal rim (linear) speeds and the smaller radius needing a larger angle per unit time.
