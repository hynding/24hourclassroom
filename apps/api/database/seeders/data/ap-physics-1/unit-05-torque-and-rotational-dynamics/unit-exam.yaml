    type: long_answer
    topic_code: "5.6"
    source: "AP Physics 1 CED, Topics 5.5 and 5.6"
    points: 8
    stimulus: |
      Translation between representations. A uniform rod of mass M = 1.2 kg and length L = 0.90 m is attached to a wall by a frictionless hinge at its left end. A light vertical string tied to the rod's right end holds the rod at rest in a horizontal position. The rotational inertia of the rod about the hinge is (1/3)ML². At time t = 0 the string is cut, and the rod begins to swing down about the hinge. Use g = 9.8 m/s².
    prompt: |
      (A) Describe a free-body diagram of the rod while the string is intact. Show each force as an arrow starting where it acts on the rod, labelled, with lengths that show which forces are equal or larger.

      (B) Starting from your diagram in (A), derive expressions for the tension in the string and for the force the hinge exerts on the rod, in terms of M and g, and calculate each.

      (C) Immediately after the string is cut: (i) derive an expression for the rod's angular acceleration in terms of g and L, and calculate it; (ii) find the linear acceleration of the rod's centre of mass; (iii) use Newton's second law for the rod's centre of mass to derive an expression for the force the hinge exerts on the rod at that instant, and calculate it.
    answer: |
      (A) Three arrows: a downward arrow labelled F_g = Mg starting at the rod's centre (L/2 from the hinge); an upward arrow labelled T at the right end; an upward arrow labelled F_H (hinge force) at the left end. T and F_H are drawn the same length, each half the length of F_g. (No horizontal forces act, so the hinge force is vertical.)
      (B) Torques about the hinge: T·L = Mg·(L/2), so T = Mg/2 = (1.2)(9.8)/2 = 5.88 N ≈ 5.9 N. Forces: F_H + T = Mg, so F_H = Mg/2 = 5.88 N ≈ 5.9 N, upward.
      (C)(i) Only gravity exerts a torque about the hinge: Mg(L/2) = (1/3)ML²α, so α = 3g/(2L) = 3(9.8)/(2 × 0.90) ≈ 16.3 rad/s².
      (ii) The centre is L/2 from the hinge: a_cm = α(L/2) = (3g/(2L))(L/2) = 3g/4 ≈ 7.35 m/s², downward.
      (iii) Taking downward as positive: Mg − F_H = Ma_cm = M(3g/4), so F_H = Mg/4 = (1.2)(9.8)/4 ≈ 2.94 N, upward.
    explanation: |
      Eight points.
      (A) 2 points: 1 for exactly three forces, each at the correct point (weight at the centre, tension at the right end, hinge force at the left end) with correct directions; 1 for relative lengths showing T = F_H and each about half of F_g. A weight drawn at the hinge or the end loses the first point.
      (B) 2 points: 1 for a torque equation about a stated axis giving T = Mg/2 ≈ 5.9 N; 1 for F_H = Mg/2 ≈ 5.9 N from ΣF = 0 (or a second torque sum), consistent with the diagram in (A).
      (C) 4 points: (i) 2 points: 1 for the torque Mg(L/2) with I = (1/3)ML² about the hinge in Στ = Iα; 1 for α = 3g/(2L) ≈ 16.3 rad/s² (16 rad/s² acceptable). (ii) 1 point: a_cm = α(L/2) = 3g/4 ≈ 7.4 m/s². (iii) 1 point: F_H = Mg/4 ≈ 2.9 N from Mg − F_H = Ma_cm. An answer of F_H = Mg or Mg/2 after the cut does not earn this point.
  - slug: apphys1-u05-exam-q42
    type: short_answer
    topic_code: "5.6"
    source: "AP Physics 1 CED, Topics 5.5 and 5.6"
    points: 4
    stimulus: |
      Translation between representations. A uniform rod of mass M = 1.2 kg and length L = 0.90 m is attached to a wall by a frictionless hinge at its left end. A light vertical string tied to the rod's right end holds the rod at rest in a horizontal position. The rotational inertia of the rod about the hinge is (1/3)ML². At time t = 0 the string is cut, and the rod begins to swing down about the hinge. Use g = 9.8 m/s².
    prompt: |
      Part D of the translation between representations question.

      (D) A classmate predicts: "When the string is cut, the hinge has to hold up the whole rod by itself, so the hinge force jumps from Mg/2 to Mg."
      (i) Describe a free-body diagram of the rod immediately after the string is cut, with arrow lengths drawn to the same scale as your diagram in part (A).
      (ii) Complete a table that gives the magnitudes of the weight, the string tension and the hinge force (as multiples of Mg) just before and just after the cut.
      (iii) Explain how your diagram and table agree with your result in part (C), and explain the error in the classmate's reasoning.
    answer: |
      (i) Two arrows: the weight F_g = Mg, downward, at the rod's centre, the same length as in part (A); and the hinge force F_H, upward, at the left end, now one quarter the length of F_g (half its length in part A). No tension arrow.
      (ii)
      | Force | Just before the cut | Just after the cut |
      |---|---|---|
      | Weight | Mg | Mg |
      | String tension | Mg/2 | 0 |
      | Hinge force | Mg/2 (up) | Mg/4 (up) |
      (iii) After the cut the upward forces (Mg/4) no longer balance the weight (Mg), so the diagram shows a net downward force of 3Mg/4, exactly M times the centre-of-mass acceleration 3g/4 found in (C)(ii), and the hinge force Mg/4 matches (C)(iii). The classmate assumes the rod stays in equilibrium after the cut. It does not: the rod starts to rotate and its centre accelerates downward at 3g/4, so the hinge only needs to push up with Mg/4; the hinge force drops rather than rising.
    explanation: |
      Four points.
      (i) 1 point: only weight and hinge force, at the correct points, with the hinge force shorter than in part (A) (one quarter of the weight's length) and no tension.
      (ii) 1 point: a table with all six entries correct (weight unchanged; tension Mg/2 → 0; hinge Mg/2 → Mg/4), consistent with the student's own (B) and (C).
      (iii) 2 points: 1 for showing that the net force in the new diagram, 3Mg/4 downward, equals M·a_cm from (C), so the representations agree; 1 for identifying the classmate's error as assuming equilibrium (ΣF = 0) after the cut when the rod is accelerating. A student whose (C) answer was wrong can earn (iii) for consistent reasoning with their own values.
