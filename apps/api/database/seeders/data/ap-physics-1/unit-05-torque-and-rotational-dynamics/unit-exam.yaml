    source: "AP Physics 1 CED, Topic 5.4"
    points: 3
    prompt: |
      Two cylinders look identical from outside: they have the same mass, the same radius and the same painted surface. One is a solid aluminium cylinder; the other is a thin-walled steel tube with sealed ends. Describe an experiment, using a fixed axle, a string, a hanging block of known mass, a meter stick and a stopwatch, that would tell which is which without damaging them. Say what you would measure, how you would compare the results, and which result would identify the hollow tube. Justify your reasoning with rotational inertia and Στ = Iα.
    answer: |
      Mount each cylinder in turn on the same low-friction axle, wrap the string around it, and hang the same block from the string. Release the block from rest and time how long it takes to fall a measured height (say 1.00 m), repeating several times and averaging. Compute each cylinder's acceleration a = 2h/t² (or simply compare fall times).
      Reasoning: the hollow tube has its mass at the outer radius, so I ≈ MR², about twice the solid cylinder's ½MR². The same block gives a similar torque, so the tube has the smaller angular acceleration (α = Στ/I), and the block falls more slowly (a = mg/(m + I/R²) is smaller).
      Identification: the cylinder with the longer fall time (smaller acceleration) is the hollow steel tube.
    explanation: |
      Three points. 1 point: a workable procedure that keeps the block, height and axle the same for both cylinders and measures fall time or acceleration (with repeats). 1 point: states that the hollow tube's mass is farther from the axis, so its rotational inertia is larger. 1 point: connects the larger I to a smaller α (and slower fall) for the same applied torque, and identifies the slower one as the tube.
  # ---- Free-response 1: experimental design and analysis (LAB), 10 points
  - slug: apphys1-u05-exam-q40
    type: long_answer
    topic_code: "5.4"
    source: "AP Physics 1 CED, Topics 5.4 and 5.6"
    points: 10
    prompt: |
      Experimental design and analysis. A lab group wants to test how the rotational inertia of a rotating system depends on where its mass sits. Their apparatus is a horizontal platform that turns on a vertical, low-friction axle. A light rod is fixed across the platform, and two identical 0.200 kg clamps can be fixed on the rod, one on each side, both at the same distance d from the axle. A string wound on a spool of radius 0.025 m on the axle runs horizontally over a light pulley to a hanging 0.100 kg block. The group also has a meter stick, a stopwatch and a balance.

      (A) Describe a procedure the group could use to determine the angular acceleration of the platform for several values of d. Say what they should measure, with which equipment, and what they should do to reduce experimental uncertainty.

      (B) The applied torque is τ = m(g − a)r, where m is the hanging block's mass, a its acceleration and r the spool radius. Theory predicts that the system's rotational inertia is I = I₀ + 2m_c d², where I₀ is the rotational inertia of the platform, rod and spool and m_c is the mass of one clamp. Explain what quantities the group should graph to obtain a straight line, and what the slope and vertical intercept should represent.

      The group drops the block from rest through 0.500 m for each value of d. Their invented results (each time is the average of three trials):

      | d (m) | 0.050 | 0.100 | 0.150 | 0.200 | 0.250 |
      |---|---|---|---|---|---|
      | Fall time t (s) | 3.43 | 3.99 | 5.02 | 5.95 | 7.16 |
      | α (rad/s²) | 3.40 | 2.51 | 1.59 | 1.13 | 0.780 |

      In every trial the block's acceleration was less than 0.09 m/s², so the torque was 0.0243 to 0.0245 N·m; use τ = 0.0244 N·m.

      (C) Use the data to calculate the values you would plot for the graph you described in (B). Show them in a table, describe the best-fit line, and calculate its slope.

      (D) Compare your slope with the theoretical prediction, and state what the vertical intercept tells the group.

      (E) Describe one source of systematic error in this experiment and how it would affect the measured rotational inertia.
    answer: |
      (A) For each d: fix both clamps at distance d from the axle (meter stick, axle to clamp centre). Hold the block at rest, measure its drop height h with the meter stick, release it and time the fall with the stopwatch. Then a = 2h/t² and α = a/r. Reduce uncertainty by repeating each drop and averaging, using a large h so times are long compared with reaction time, keeping the string horizontal, and keeping h and the hanging mass the same for every d.
      (B) Plot I = τ/α (vertical) against d² (horizontal). I = I₀ + 2m_c d² is then a straight line with slope 2m_c (predicted 0.400 kg) and vertical intercept I₀. (Equivalent: 1/α against d², slope 2m_c/τ, intercept I₀/τ.)
      (C) With I = 0.0244/α:

      | d² (m²) | 0.0025 | 0.0100 | 0.0225 | 0.0400 | 0.0625 |
      |---|---|---|---|---|---|
      | I (kg·m²) | 0.00718 | 0.00972 | 0.0153 | 0.0216 | 0.0313 |

      The points lie close to a straight line that does not pass through the origin. A line through (0.0025, 0.0072) and (0.0625, 0.0313) has slope 0.0241/0.0600 ≈ 0.40 kg; a least-squares fit gives about 0.401 kg with intercept about 0.0060 kg·m².
      (D) The slope, about 0.40 kg, agrees with 2m_c = 0.400 kg (within about 1%), supporting I = I₀ + 2m_c d². The intercept, about 0.006 kg·m², is I₀, the rotational inertia of the platform, rod and spool without the clamps.
      (E) For example, axle friction: part of the string's torque only overcomes friction, so α is smaller than τ/I and the measured I = τ/α comes out too large (mainly raising the intercept). Also acceptable: the clamps are not point masses (their size adds a little to I).
    explanation: |
      Ten points.
      (A) 3 points: 1 for measuring the clamp distance d and the drop height h with the meter stick and the fall time with the stopwatch; 1 for how α is obtained (a = 2h/t², α = a/r); 1 for a valid way to reduce uncertainty (repeated trials averaged, large drop height, keeping other variables constant).
      (B) 2 points: 1 for a pair of quantities that linearises the relation (I against d², or 1/α against d²); 1 for identifying the slope (2m_c, or 2m_c/τ) and the intercept (I₀, or I₀/τ).
      (C) 3 points: 1 for correctly computed plotted values (I within 2%, and d²); 1 for describing a straight-line fit that is consistent with the data (not forced through the origin); 1 for a slope of 0.38–0.42 kg calculated from points on the line, not from two data points that are off the line. A student who plotted 1/α against d² earns full credit for slope ≈ 16.5 (rad/s²)⁻¹·m⁻² with the matching units.
      (D) 1 point: compares the slope with 0.400 kg (or 2m_c/τ ≈ 16.4) and identifies the intercept as I₀, the rotational inertia without the clamps.
      (E) 1 point: a plausible systematic error with the correct direction of its effect on the measured I.
