      source: "AP Physics 1 CED, Topic 5.5"
      points: 1
      prompt: |
        A uniform ladder 5.0 m long with mass 15 kg leans against a frictionless wall, making an angle of 60° with the floor. What is the magnitude of the static friction force the floor exerts on the ladder? Give your answer in newtons, to three significant figures.
      answer: { value: 42.4, tolerance: 0.5 }
      explanation: |
        Torques about the foot of the ladder: the wall's normal force N_w acts at the top with lever arm L sin 60°, the weight acts at the centre with lever arm (L/2) cos 60°. N_w L sin 60° = mg (L/2) cos 60°, so N_w = mg/(2 tan 60°) = 147/(2 × 1.732) ≈ 42.4 N. Horizontal forces balance, so the friction force is 42.4 N, pointing toward the wall.
