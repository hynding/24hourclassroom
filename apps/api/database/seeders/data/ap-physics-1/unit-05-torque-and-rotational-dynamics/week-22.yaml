      prompt: |
        True or false: A horizontal beam is hinged to a wall and held by a cable from its far end at 30° above the horizontal. If the cable is reattached at the same point on the beam but at 60° above the horizontal, with the loads unchanged, the tension in the cable decreases.
      answer: true
      explanation: |
        True. Only T sin θ has a lever arm about the hinge, and the torque it must supply is fixed by the loads, so T ∝ 1/sin θ. sin 60° ≈ 0.87 is larger than sin 30° = 0.50, so the tension falls to 0.50/0.87 ≈ 0.58 of its old value.
    - slug: apphys1-u05-w22-q17
