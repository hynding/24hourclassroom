      prompt: |
        A uniform shelf board rests on two brackets, one under each end. A heavy box of books sits at the middle of the board. A student slides the box toward the left end, stopping halfway between the middle and the left bracket.

        (a) Describe the forces on the board after the box is moved, saying where each acts.
        (b) Predict how the force from each bracket changes compared with when the box was at the middle.
        (c) Justify your prediction in (b) using torques.
      answer: |
        (a) Upward forces from the left bracket (at the left end) and the right bracket (at the right end); the board's weight, downward at the board's centre; the box's downward normal force (equal to its weight) at one quarter of the length from the left end.
        (b) The left bracket's force increases and the right bracket's force decreases, by equal amounts; their sum stays equal to the total weight of board and box.
        (c) Taking torques about the left bracket: the right bracket's force times the full length must balance the torques of the board's weight (fixed) and the box's weight. Moving the box toward the left bracket shortens the box's lever arm about that bracket, so the right bracket needs less force. Because ΣF_y = 0 keeps the sum fixed, the left bracket's force must rise by the same amount.
      explanation: |
        Three points. (a) 1 point: all four forces, with the board's weight at its centre and the box's force at its new position (a box's force drawn at the middle, or a missing board weight, loses the point). (b) 1 point: left increases, right decreases (sum unchanged). (c) 1 point: a torque argument about a named axis that connects the box's changed lever arm to the change in a bracket force, plus ΣF = 0 (or a second torque sum) for the other bracket. "The box is closer, so it pushes harder there" without torques does not earn (c).
    - slug: apphys1-u05-w22-q23
      type: short_answer
      topic_code: "5.5"
      source: "AP Physics 1 CED, Topic 5.5"
      points: 3
      prompt: |
        A student balances a broom horizontally on one finger. The balance point is much closer to the bristle end than to the end of the long handle. She then saws the broom in two at the balance point. A classmate claims the two pieces have the same weight, because the broom balanced there. Is the classmate right? Make a claim, and support it with evidence and reasoning based on torque.
      answer: |
        Claim: the classmate is wrong; the bristle piece is heavier.
        Evidence: the balance point is close to the bristle end, so the bristle piece's centre of mass is close to the finger while the handle piece's centre of mass is far away (about half the long handle's length).
        Reasoning: balancing means the net torque about the finger is zero, so the two pieces' weights exert equal and opposite torques: W_bristle · d_bristle = W_handle · d_handle. Because d_bristle is much smaller than d_handle, W_bristle must be larger. Equal torques, not equal weights, are what balance requires.
      explanation: |
        Three points. 1 point: correct claim (bristle piece heavier; the classmate is wrong). 1 point: identifies that each piece's weight acts at its own centre of mass and that these lever arms differ (bristle piece's is shorter). 1 point: reasoning that balance means equal torques (Στ = 0 about the finger), so the piece with the shorter lever arm has the larger weight. Saying "the bristles are heavy" with no torque argument earns only the claim point.
    - slug: apphys1-u05-w22-q24
      type: long_answer
      topic_code: "5.5"
      source: "AP Physics 1 CED, Topic 5.5"
      points: 6
      prompt: |
        Mathematical routines. A uniform diving board of length L = 4.0 m and mass M = 30 kg is bolted to the deck at its left end and rests on a fulcrum (a support that can only push up) a distance d = 1.2 m from the left end. A diver of mass m = 60 kg stands at the right end. Use g = 9.8 m/s².

        (A) Describe a free-body diagram of the board, giving the direction of each force and where it acts. Explain why the bolt must pull the board downward.

        (B) Derive an expression for the magnitude of the bolt's force F_bolt in terms of M, m, L, d and g. Then calculate F_bolt and the fulcrum's force F_fulcrum.

        (C) The diver walks toward the fulcrum and stops directly above it. Use your expression from (B) to find F_bolt now, and explain why the result makes sense physically.
      answer: |
        (A) The bolt's force F_bolt, downward, at the left end (0 m); the fulcrum's force F_fulcrum, upward, at 1.2 m; the board's weight Mg, downward, at its centre (2.0 m); the diver's normal force mg, downward, at the right end (4.0 m). Both weights are to the right of the fulcrum and turn the board clockwise about it; the only force that can supply a counterclockwise torque about the fulcrum is the bolt's, and it must therefore pull down on the left end.
        (B) Στ = 0 about the fulcrum: F_bolt · d = Mg(L/2 − d) + mg(L − d), so F_bolt = g[M(L/2 − d) + m(L − d)]/d. Numbers: F_bolt = 9.8[30(0.8) + 60(2.8)]/1.2 = 9.8(192)/1.2 = 1568 N ≈ 1.57 × 10³ N. ΣF_y = 0: F_fulcrum = F_bolt + (M + m)g = 1568 + 882 = 2450 N ≈ 2.45 × 10³ N, upward.
        (C) With the diver at the fulcrum, her lever arm about it is zero, which is the same as replacing L − d by 0: F_bolt = gM(L/2 − d)/d = 9.8(30)(0.8)/1.2 = 196 N. The bolt now only has to hold down the part of the board's own weight that overhangs the fulcrum, so the force is much smaller, but it is not zero because the board's centre is still 0.8 m beyond the fulcrum.
      explanation: |
        Six points.
        (A) 2 points: 1 for all four forces with correct directions and points of application (board's weight at the centre, not at the fulcrum); 1 for the torque reason the bolt pulls down (both weights give clockwise torque about the fulcrum, so a counterclockwise torque is needed on the left).
        (B) 3 points: 1 for a correct torque equation about a stated axis with correct lever arms (L/2 − d and L − d); 1 for F_bolt ≈ 1570 N (accept 1560–1580 N; 1600 N from g = 10 earns the point if g = 10 is stated); 1 for F_fulcrum ≈ 2450 N from ΣF = 0, consistent with the student's F_bolt.
        (C) 1 point: F_bolt ≈ 196 N from the expression with the diver's lever arm set to zero, with the physical reason (only the overhanging board's weight remains). An answer of zero with "the diver no longer makes torque" earns no credit.
