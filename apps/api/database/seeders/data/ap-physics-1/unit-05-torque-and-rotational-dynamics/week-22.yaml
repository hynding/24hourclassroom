week: 22
unit: 5
title: "Rotational Equilibrium and Newton's First Law in Rotational Form"
topics: ["5.5"]
guide: guides/week-22.md
guide_description: |
  Newton's first law in rotational form (zero net torque means constant angular velocity, so a spinning fan
  needs no net torque), the two conditions for static equilibrium of an extended object (ΣF = 0 and Στ = 0
  about any axis), free-body diagrams with each force drawn where it acts, choosing the axis to remove
  unknowns, couples, support forces and tipping, and forces at angles on hinged beams. Worked examples: a
  seesaw with a 28 kg and a 35 kg child, a painter walking along a 4.0 m scaffold board (with a table of both
  support forces against her position), a 10 kg sign on a hinged beam held by a cable at 40° (with tension
  against cable angle), and weighing a meter stick by balancing it on a knife-edge.
flashcards_description: |
  30 cards on rotational equilibrium: the rotational form of Newton's first law, the two equilibrium
  conditions, choosing the axis, free-body diagrams of extended objects, seesaws, scaffolds and support
  forces, tipping, hinged beams and cables, ladders, couples, and balance-point lab methods.

flashcards:
  - front: Newton's first law in rotational form → statement
    back: |
      If the net torque on a rigid object about an axis is zero, its angular velocity about that axis stays constant: at rest stays at rest, spinning stays spinning at the same rate.
    topic_code: "5.5"
  - front: Ceiling fan turning at a steady rate → net torque on the blades
    back: |
      Zero. The motor's torque is equal in size and opposite in direction to the torque from air drag. A net torque is needed only to change the angular velocity.
    topic_code: "5.5"
  - front: Static equilibrium of an extended object → the two conditions
    back: |
      ΣF = 0 (in every direction, so the centre of mass does not accelerate) and Στ = 0 (so there is no angular acceleration), with the object at rest.
    topic_code: "5.5"
  - front: Στ = 0 for an object in equilibrium → about which axis?
    back: |
      About every axis. When ΣF = 0 and the torques balance about one point, they balance about all points, so you may choose any axis you like.
    topic_code: "5.5"
  - front: Choosing the torque axis in an equilibrium problem → best choice
    back: |
      Through the point where an unknown force (or the most unknown forces) acts: that force has zero lever arm and drops out of the torque equation.
    topic_code: "5.5"
  - front: Weight of a uniform plank on a free-body diagram → where to draw it
    back: |
      A single downward arrow mg at the plank's centre (its centre of mass), not at a support or an end.
    topic_code: "5.5"
  - front: Hinge or pivot force in an equilibrium problem → in the torque sum and in the force sum?
    back: |
      It exerts no torque about the hinge itself (zero lever arm) but it must appear in ΣF = 0, usually as unknown horizontal and vertical components.
    topic_code: "5.5"
  - front: Seesaw, 28 kg child 1.5 m left of a centre pivot → where a 35 kg child balances
    back: |
      28(1.5) = 35x, so x = 1.2 m right of the pivot. The heavier child sits closer, by the inverse ratio of the masses; g cancels.
    topic_code: "5.5"
  - front: Seesaw pivot force, children of 28 kg and 35 kg on a 12 kg plank → value
    back: |
      The pivot pushes up with the total weight: (28 + 35 + 12)(9.8) = 735 N.
    topic_code: "5.5"
  - front: Scaffold board 4.0 m, 20 kg, painter 70 kg at 1.0 m from the left → support forces
    back: |
      Torques about the left end: F_R(4.0) = 196(2.0) + 686(1.0), so F_R ≈ 270 N; then F_L = 882 − 269.5 ≈ 613 N.
    topic_code: "5.5"
  - front: Painter walking along a scaffold board → how each support force varies with her position
    back: |
      Linearly. The support nearer her grows, the far one shrinks, and the two always add to the total weight. With her at one end the far support holds half the board's weight.
    topic_code: "5.5"
  - front: Load moved toward one support of a plank on two supports → prediction
    back: |
      That support's force increases and the other decreases by the same amount; the sum stays equal to the total weight (ΣF = 0).
    topic_code: "5.5"
  - front: Plank overhanging its support, about to tip → condition
    back: |
      The far support force is zero and the plank pivots about the near support: the load's torque about that support equals the plank's own weight torque on the other side.
    topic_code: "5.5"
  - front: Hinged horizontal beam with a cable at angle θ → which part of the tension makes torque about the hinge
    back: |
      Only the component perpendicular to the beam, T sin θ, when the cable is attached at the beam's end. The component along the beam points at the hinge and has no lever arm.
    topic_code: "5.5"
  - front: Cable holding a hinged beam made more nearly horizontal → effect on tension
    back: |
      The tension increases, because T sin θ must supply a fixed torque: T ∝ 1/sin θ. A cable almost along the beam would need an enormous tension.
    topic_code: "5.5"
  - front: Sign on a 1.5 m, 6.0 kg hinged beam, 10 kg sign at the end, cable at 40° → tension
    back: |
      T sin 40°(1.5) = 58.8(0.75) + 98(1.5), so T ≈ 198 N. The hinge then supplies 152 N horizontally and 29.4 N upward.
    topic_code: "5.5"
  - front: Hinge force on a beam held by an angled cable → why it has a horizontal component
    back: |
      The cable pulls the beam toward the wall with T cos θ; the only other horizontal force is the hinge's, so it must push outward with the same size.
    topic_code: "5.5"
  - front: Ladder against a frictionless wall → which force keeps the foot from sliding
    back: |
      Static friction from the floor, pointing toward the wall. It balances the wall's horizontal normal force; torques about the foot give the wall force from the ladder's weight.
    topic_code: "5.5"
  - front: Ladder, length L, mass m, angle θ with the floor, frictionless wall → floor friction needed
    back: |
      Torques about the foot: N_w L sin θ = mg(L/2) cos θ, so f = N_w = mg/(2 tan θ). A steeper ladder (larger θ) needs less friction.
    topic_code: "5.5"
  - front: Couple on a steering wheel (equal, opposite forces on opposite sides) → net force and net torque
    back: |
      Net force zero, net torque not zero (both forces turn the wheel the same way). Translational equilibrium does not guarantee rotational equilibrium.
    topic_code: "5.5"
  - front: Wheel on a frictionless axle spinning at constant angular velocity → is it in equilibrium?
    back: |
      Yes, rotational equilibrium (Στ = 0) and translational equilibrium (its centre is at rest). Equilibrium does not require being at rest.
    topic_code: "5.5"
  - front: Mobile hanging at rest from a string → what the string's tension equals
    back: |
      The total weight of everything below the string (ΣF = 0), and the string's attachment point lies directly above the centre of mass of the hanging part.
    topic_code: "5.5"
  - front: Meter stick balanced on a knife-edge with a 0.100 kg mass at 5.0 cm, balance at 30.0 cm → stick's mass
    back: |
      0.100(0.250) = m(0.200), so m = 0.125 kg. The stick's weight acts at the 50.0 cm mark.
    topic_code: "5.5"
  - front: Finding an unknown mass with a meter stick and pivot → measurements needed
    back: |
      The positions of the pivot, the unknown mass and the stick's centre (and the stick's mass, or a known mass for comparison). Then apply Στ = 0 about the pivot.
    topic_code: "5.5"
  - front: Broom balanced horizontally on a finger, then cut at the balance point → which piece is heavier
    back: |
      The brush end. Its centre of mass is closer to the cut, so it needs a larger weight to give the same torque as the long handle piece.
    topic_code: "5.5"
  - front: Equilibrium symbolic answer → limiting case check for a plank on two supports
    back: |
      Put the load on a support: the other support's force should drop to half the plank's weight. Put it at the centre: both supports carry equal shares.
    topic_code: "5.5"
  - front: Sign convention for torques in Στ = 0 → common choice
    back: |
      Counterclockwise positive, clockwise negative (any consistent choice works). Or write "sum of counterclockwise torques = sum of clockwise torques".
    topic_code: "5.5"
  - front: Error-spot → "each support of the plank holds half of the painter's weight"
    back: |
      Only if she stands at the centre. Torques about either support show the nearer support carries more of her weight.
    topic_code: "5.5"
  - front: Error-spot → "the fan keeps spinning, so there must be a net torque on it"
    back: |
      Constant angular velocity needs zero net torque, just as constant velocity needs zero net force. The motor's torque balances drag.
    topic_code: "5.5"
  - front: Error-spot → "τ = T × (beam length) for a cable at 30° to the beam"
    back: |
      The full tension is not perpendicular to the beam. Use τ = rT sin θ (the perpendicular component, or the lever arm), so τ = T(L) sin 30°.
    topic_code: "5.5"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topic 5.5: Newton's first law in rotational form,
    the two conditions for static equilibrium, free-body diagrams of extended objects, support forces and
    tipping, hinged beams and cables, ladders and balance-point measurements), with 8 questions (33%)
    reviewing earlier weeks (rotational kinematics and the link between linear and angular quantities from
    week 19, torque from week 20, rotational inertia from week 21, centre of mass from week 5 and Newton's first
    law from week 6). Opens with a shared-context set on a student standing on a plank across two sawhorses.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the
    scoring notes. Calculator and equation sheet allowed throughout; use g = 9.8 m/s².
  questions:
    # ---- Stimulus set: plank on two sawhorses (5.5)
    - slug: apphys1-u05-w22-q01
      type: multiple_choice
      topic_code: "5.5"
      source: "AP Physics 1 CED, Topic 5.5"
      points: 1
      stimulus: |
        A uniform plank 3.0 m long with mass 15 kg rests on two sawhorses. Sawhorse A is under the left end of the plank; sawhorse B is under the point 2.0 m from the left end, so 1.0 m of the plank overhangs B on the right. A 40 kg student stands on the plank 1.0 m from the left end. The plank is at rest. Use g = 9.8 m/s².
      prompt: |
        Which describes the forces exerted on the plank?
      options:
        - "Upward forces from A and B; the plank's weight at the midpoint of A and B, 1.0 m from the left end; the student's weight at 1.0 m"
        - "Upward forces from A and B; the student's weight at 1.0 m; no weight force, because the plank is supported"
        - "Upward forces from A and B that are equal, because the plank is at rest; the plank's weight and the student's weight"
        - "Upward forces from A and B; the plank's weight acting 1.5 m from the left end; a downward normal force from the student at 1.0 m"
      option_explanations:
        - |
          The plank's centre of mass is its own midpoint, 1.5 m from the left end, not the midpoint between the two supports.
        - |
          Supports do not cancel gravity on the diagram: the plank's weight (147 N) still acts on it and must be drawn at its centre.
        - |
          Being at rest requires ΣF = 0 and Στ = 0, not equal support forces. Here the loads are not centred between A and B, so the forces differ.
        - |
          Correct. The student pushes down on the plank with a normal force equal to her weight (392 N) at 1.0 m; the uniform plank's weight (147 N) acts at its centre, 1.5 m; A and B push up.
      answer: 3
    - slug: apphys1-u05-w22-q02
      type: multiple_choice
      topic_code: "5.5"
      source: "AP Physics 1 CED, Topic 5.5"
      points: 1
      stimulus: |
        A uniform plank 3.0 m long with mass 15 kg rests on two sawhorses. Sawhorse A is under the left end of the plank; sawhorse B is under the point 2.0 m from the left end, so 1.0 m of the plank overhangs B on the right. A 40 kg student stands on the plank 1.0 m from the left end. The plank is at rest. Use g = 9.8 m/s².
      prompt: |
        What is the magnitude of the force sawhorse B exerts on the plank?
      options:
        - "196 N"
        - "306 N"
        - "270 N"
        - "204 N"
      option_explanations:
        - |
          196 N = 392(1.0)/2.0 takes torques of the student's weight only and leaves out the plank's own weight acting at 1.5 m.
        - |
          Correct. Torques about A: F_B(2.0 m) = (147 N)(1.5 m) + (392 N)(1.0 m) = 612.5 N·m, so F_B ≈ 306 N.
        - |
          270 N is half the total weight, 539/2. Splitting the load equally ignores where the weights act.
        - |
          204 N = 612.5/3.0 uses the plank's length, 3.0 m, as B's lever arm about A; B is 2.0 m from A.
      answer: 1
    - slug: apphys1-u05-w22-q03
      type: numeric
      topic_code: "5.5"
      source: "AP Physics 1 CED, Topic 5.5"
      points: 1
      stimulus: |
        A uniform plank 3.0 m long with mass 15 kg rests on two sawhorses. Sawhorse A is under the left end of the plank; sawhorse B is under the point 2.0 m from the left end, so 1.0 m of the plank overhangs B on the right. A 40 kg student stands on the plank 1.0 m from the left end. The plank is at rest. Use g = 9.8 m/s².
      prompt: |
        What is the magnitude of the force sawhorse A exerts on the plank? Give your answer in newtons, to three significant figures.
      answer: { value: 233, tolerance: 2 }
      explanation: |
        ΣF_y = 0: F_A + F_B = (15 + 40)(9.8) = 539 N. With F_B = 306.25 N from torques about A, F_A = 539 − 306.25 ≈ 233 N. (Check with torques about B: F_A(2.0) = 392(1.0) + 147(0.5) = 465.5, so F_A ≈ 233 N.)
    - slug: apphys1-u05-w22-q04
      type: multiple_choice
      topic_code: "5.5"
      source: "AP Physics 1 CED, Topic 5.5"
      points: 1
      stimulus: |
        A uniform plank 3.0 m long with mass 15 kg rests on two sawhorses. Sawhorse A is under the left end of the plank; sawhorse B is under the point 2.0 m from the left end, so 1.0 m of the plank overhangs B on the right. A 40 kg student stands on the plank 1.0 m from the left end. The plank is at rest. Use g = 9.8 m/s².
      prompt: |
        The student walks slowly to the right. How far from the left end can she stand before the plank begins to tip about sawhorse B?
      options:
        - "2.00 m, because the plank tips as soon as she passes sawhorse B"
        - "2.38 m"
        - "2.19 m"
        - "3.0 m: the plank cannot tip while both sawhorses are under it"
      option_explanations:
        - |
          Past B her torque about B is opposed by the plank's weight torque, so she can go some distance beyond B before the plank tips.
        - |
          2.38 m uses 1.0 m (B to the right end) as the lever arm of the plank's weight about B; the weight acts at the centre, 0.5 m left of B.
        - |
          Correct. At tipping F_A = 0. Torques about B: (147 N)(0.5 m) = (392 N)(x − 2.0 m), so x − 2.0 = 0.1875 m and x ≈ 2.19 m.
        - |
          A support can only push up. Once her torque about B exceeds the plank's, A would have to pull down, so the plank tips before she reaches the end.
      answer: 2
    - slug: apphys1-u05-w22-q05
      type: multiple_choice
      topic_code: "5.5"
      source: "AP Physics 1 CED, Topic 5.5"
      points: 1
      prompt: |
        A potter's wheel spins at a constant 6.0 rad/s on an axle. Which statement about the net torque on the wheel is correct?
      options:
        - "The net torque is in the direction of rotation, or the wheel would slow down."
        - "The net torque is zero, because the angular velocity is not changing."
        - "The net torque cannot be determined without knowing the wheel's rotational inertia."
        - "The net torque is opposite to the rotation, because friction always acts on a spinning wheel."
      option_explanations:
        - |
          This is the rotational version of "motion needs a force". A net torque changes the angular velocity; a constant rate needs none.
        - |
          Correct. Newton's first law in rotational form: constant angular velocity means zero net torque (the motor's torque balances friction).
        - |
          Στ = Iα, and α = 0 here, so the net torque is zero whatever the rotational inertia is.
        - |
          Friction does act, but the motor's torque cancels it. A net opposing torque would make the wheel slow down.
      answer: 1
    - slug: apphys1-u05-w22-q06
      type: multiple_choice
      topic_code: "5.5"
      source: "AP Physics 1 CED, Topic 5.5"
      points: 1
      prompt: |
        A uniform meter stick of mass 0.120 kg balances horizontally on a knife-edge at the 40.0 cm mark when an unknown mass hangs from the 10.0 cm mark. What is the unknown mass?
      options:
        - "0.360 kg"
        - "0.120 kg"
        - "0.200 kg"
        - "0.040 kg"
      option_explanations:
        - |
          0.360 kg inverts the ratio: it puts the stick's 0.10 m lever arm with the unknown mass and the 0.30 m arm with the stick.
        - |
          Equal masses balance only at equal distances. The unknown hangs 0.30 m from the pivot and the stick's centre is 0.10 m away.
        - |
          0.200 kg measures the stick's lever arm from the zero end (0.50 m) instead of from the pivot (0.10 m).
        - |
          Correct. The stick's weight acts at 50.0 cm, 0.100 m from the pivot; the unknown is 0.300 m away. M(0.300) = 0.120(0.100), so M = 0.040 kg.
      answer: 3
    - slug: apphys1-u05-w22-q07
      type: multiple_choice
      topic_code: "5.5"
      source: "AP Physics 1 CED, Topic 5.5"
      points: 1
      prompt: |
        A uniform horizontal beam 1.2 m long with mass 5.0 kg is hinged to a wall at its left end. A cable attached to the right end runs up to the wall at 30° above the horizontal. An 8.0 kg flower basket hangs from the beam 0.90 m from the wall. What is the tension in the cable?
      options:
        - "167 N"
        - "96.2 N"
        - "118 N"
        - "127 N"
      option_explanations:
        - |
          Correct. Torques about the hinge: T sin 30°(1.2 m) = (49 N)(0.60 m) + (78.4 N)(0.90 m) = 99.96 N·m, so T = 99.96/0.60 ≈ 167 N.
        - |
          96.2 N uses cos 30° for the perpendicular component. The component of T perpendicular to the horizontal beam is T sin 30°.
        - |
          118 N leaves out the beam's own 49 N weight acting at its centre, 0.60 m from the hinge.
        - |
          127 N is the total weight of beam and basket. The cable is not vertical and does not attach at the centre of mass, so T is not the total weight.
      answer: 0
    - slug: apphys1-u05-w22-q08
      type: multiple_choice
      topic_code: "5.3"
      source: "AP Physics 1 CED, Topic 5.3"
      points: 1
      prompt: |
        A cyclist pushes on the end of a 0.30 m wrench with a 70 N force directed at 50° to the wrench handle. What torque does the force exert about the bolt?
      options:
        - "21.0 N·m"
        - "13.5 N·m"
        - "16.1 N·m"
        - "27.4 N·m"
      option_explanations:
        - |
          21.0 N·m = rF treats the force as perpendicular to the handle; only the perpendicular component turns the bolt.
        - |
          13.5 N·m = rF cos 50° uses the component along the handle, which points at the bolt and exerts no torque.
        - |
          Correct. τ = rF sin θ = (0.30 m)(70 N)(sin 50°) ≈ 16.1 N·m.
        - |
          27.4 N·m divides rF by sin 50° instead of multiplying. A torque can never exceed rF.
      answer: 2
    - slug: apphys1-u05-w22-q09
      type: multiple_choice
      topic_code: "5.1"
      source: "AP Physics 1 CED, Topic 5.1"
      points: 1
      prompt: |
        A turntable starts from rest and speeds up with a constant angular acceleration of 1.5 rad/s² for 6.0 s. Through what angle does it turn in that time?
      options:
        - "54 rad"
        - "9.0 rad"
        - "0.25 rad"
        - "27 rad"
      option_explanations:
        - |
          54 rad = αt² drops the factor ½ in θ = ω₀t + ½αt².
        - |
          9.0 rad/s is the final angular velocity, αt; it is not the angle turned.
        - |
          0.25 comes from dividing α by t; no kinematic relation gives an angle that way.
        - |
          Correct. From rest, Δθ = ½αt² = ½(1.5 rad/s²)(6.0 s)² = 27 rad.
      answer: 3
    - slug: apphys1-u05-w22-q10
      type: multiple_choice
      topic_code: "5.2"
      source: "AP Physics 1 CED, Topic 5.2"
      points: 1
      prompt: |
        A bicycle wheel of radius 0.30 m on a repair stand turns at a constant 10 rad/s. What is the magnitude of the acceleration of a point on its rim?
      options:
        - "30 m/s²"
        - "3.0 m/s²"
        - "333 m/s²"
        - "0 m/s², because the angular velocity is constant"
      option_explanations:
        - |
          Correct. The rim point moves in a circle with v = rω = 3.0 m/s, so a_c = ω²r = (10 rad/s)²(0.30 m) = 30 m/s², toward the axle.
        - |
          3.0 m/s is the rim's speed, rω, not its acceleration.
        - |
          333 m/s² uses v²/r with v = 10, putting the angular velocity in place of the linear speed.
        - |
          Constant ω means no tangential acceleration, but a point moving in a circle always has a centripetal acceleration.
      answer: 0
    - slug: apphys1-u05-w22-q11
      type: multiple_choice
      topic_code: "2.4"
      source: "AP Physics 1 CED, Topic 2.4"
      points: 1
      prompt: |
        An elevator car of mass 1200 kg rises at a constant speed of 2.0 m/s. Air resistance and friction are negligible. How does the cable's upward force compare with the car's weight?
      options:
        - "It is greater than the weight, because the car is moving upward."
        - "It is less than the weight, because the car is already moving and needs only a small force to keep going."
        - "It is equal to the weight, 1.18 × 10⁴ N, because the velocity is constant."
        - "It is equal to the weight plus mv, because the car carries momentum upward."
      option_explanations:
        - |
          A force larger than the weight would accelerate the car upward. Moving upward at constant speed needs no net force.
        - |
          Constant velocity means zero net force, so the tension cannot be less than the weight; the car would slow down.
        - |
          Correct. Newton's first law: constant velocity means ΣF = 0, so T = mg = (1200 kg)(9.8 m/s²) ≈ 1.18 × 10⁴ N.
        - |
          Momentum is not a force and is not added to forces. With constant velocity the net force is zero.
      answer: 2
    - slug: apphys1-u05-w22-q12
      type: multiple_choice
      topic_code: "2.1"
      source: "AP Physics 1 CED, Topic 2.1"
      points: 1
      prompt: |
        A 1.0 kg block sits at x = 0 and a 4.0 kg block sits at x = 1.5 m on a light board. Where is the centre of mass of the two blocks?
      options:
        - "x = 0.75 m, halfway between them"
        - "x = 1.2 m"
        - "x = 6.0 m"
        - "x = 0.30 m"
      option_explanations:
        - |
          The midpoint is the centre of mass only for equal masses; the heavier block pulls it toward x = 1.5 m.
        - |
          Correct. x_cm = (1.0 kg · 0 + 4.0 kg · 1.5 m)/(5.0 kg) = 1.2 m, closer to the heavier block.
        - |
          6.0 m = (4.0)(1.5)/1.0 divides by one mass instead of the total, putting the centre of mass outside the system.
        - |
          0.30 m puts the 1.0 kg block's share at the 4.0 kg block: (1.0)(1.5)/5.0. The centre of mass is nearer the heavier block.
      answer: 1
    - slug: apphys1-u05-w22-q13
      type: multiple_choice
      topic_code: "5.3"
      source: "AP Physics 1 CED, Topic 5.3"
      points: 1
      prompt: |
        A student pushes on the outer edge of a classroom door, 0.80 m from the hinges, with a 50 N force directed straight toward the hinges (along the face of the door). What torque does this push exert about the hinge line?
      options:
        - "0 N·m"
        - "40 N·m"
        - "62.5 N·m"
        - "20 N·m"
      option_explanations:
        - |
          Correct. The force's line of action passes through the hinge line, so its lever arm is zero: τ = rF sin 180° = 0. The door does not turn.
        - |
          40 N·m = rF assumes the force is perpendicular to the door. A push aimed at the hinges has no perpendicular component.
        - |
          62.5 is F/r. Torque is r times the perpendicular component of F, and here that component is zero.
        - |
          20 N·m is half of rF, as if the push were perpendicular at the door's middle or at 30° to the door; a push aimed straight at the hinges has no perpendicular component at all.
      answer: 0
    - slug: apphys1-u05-w22-q14
      type: multi_select
      topic_code: "5.5"
      source: "AP Physics 1 CED, Topic 5.5"
      points: 2
      partial_credit: true
      prompt: |
        A rigid object is in equilibrium. Which statements must be true? Select all that apply.
      options:
        - "The net force on the object is zero."
        - "The net torque is zero about the object's pivot, but it may be nonzero about other points."
        - "The net torque on the object is zero about every point."
        - "Every force on the object acts through its centre of mass."
        - "The object's angular velocity is constant (it stays zero if the object starts at rest)."
      option_explanations:
        - |
          Correct. Translational equilibrium requires ΣF = 0, so the centre of mass does not accelerate.
        - |
          When ΣF = 0, a zero net torque about one point means a zero net torque about every point; there is no special axis.
        - |
          Correct. With ΣF = 0, the net torque is the same about every point, so it is zero about all of them.
        - |
          Support and hinge forces usually act far from the centre of mass; their torques just have to cancel.
        - |
          Correct. Zero net torque gives zero angular acceleration (Newton's first law in rotational form).
      answer: [0, 2, 4]
