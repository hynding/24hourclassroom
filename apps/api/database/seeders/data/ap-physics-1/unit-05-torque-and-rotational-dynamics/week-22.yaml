      prompt: |
        True or false: A driver pushes up on the left side of a steering wheel and pulls down on the right side with forces of equal size. Because the net force on the wheel is zero, the wheel is in rotational equilibrium.
      answer: false
      explanation: |
        False. The two forces form a couple: they add to zero, so the wheel is in translational equilibrium, but both turn the wheel clockwise, so the net torque is not zero and the wheel's angular velocity changes. Both ΣF = 0 and Στ = 0 are needed.
