week: 19
unit: 5
title: "Rotational Kinematics and Connecting Linear and Rotational Motion"
topics: ["5.1", "5.2"]
guide: guides/week-19.md
guide_description: |
  Describing the spin of a rigid object with angular position, angular displacement, angular velocity and
  angular acceleration (counterclockwise positive), the three constant-angular-acceleration equations, reading
  angle–time and angular-velocity–time graphs (slope and area), converting revolutions, rpm and radians, and
  linking a point's motion to the spin: s = rθ, v = rω, a_T = rα and a_c = ω²r. Worked examples: a ceiling fan
  coasting from 150 rpm to rest in 12 s, a potter's wheel told as an ω–t table, a bike wheel cranked up on a
  repair stand (tangential and centripetal acceleration of the valve), and two carousel riders at 1.5 m and
  3.0 m as a functional-dependence check, plus belts and chains.
flashcards_description: |
  30 cards on rotational kinematics and the link to linear motion: radians and rpm, the sign convention, the
  constant-α equations, slopes and areas of rotation graphs, s = rθ, v = rω, a_T = rα, centripetal acceleration
  at fixed ω, belts versus shared axles, and three error-spot cards.

flashcards:
  - front: Radian → definition and the revolution conversion
    back: |
      The angle whose arc length equals the radius. 1 revolution = 2π rad = 360°, so 1 rad ≈ 57.3°.
    topic_code: "5.1"
  - front: Rigid spinning object → why one ω describes every point
    back: |
      Its parts keep fixed distances, so every line painted on it turns through the same angle in the same time: one Δθ, one ω, one α for the whole object.
    topic_code: "5.1"
  - front: Angular velocity of a spinning wheel → definition and unit
    back: |
      ω = Δθ/Δt, the rate of change of angular position, in rad/s. Its sign shows the direction of spin.
    topic_code: "5.1"
  - front: Angular acceleration of a wheel → definition and unit
    back: |
      α = Δω/Δt, the rate of change of angular velocity, in rad/s².
    topic_code: "5.1"
  - front: Rotation sign convention in AP Physics 1 → which way is positive
    back: |
      Counterclockwise (as seen from a stated side) is positive, clockwise negative, for θ, ω and α alike.
    topic_code: "5.1"
  - front: Wheel spinning clockwise and slowing, counterclockwise positive → signs of ω and α
    back: |
      ω negative, α positive. Opposite signs mean slowing down; matching signs mean speeding up.
    topic_code: "5.1"
  - front: Translational to rotational kinematics → the letter swap
    back: |
      x → θ, v → ω, a → α. The constant-acceleration equations keep their form: ω = ω₀ + αt, θ = θ₀ + ω₀t + ½αt², ω² = ω₀² + 2αΔθ.
    topic_code: "5.1"
  - front: Rotation problem with no time given → which equation
    back: |
      The time-free one: ω² = ω₀² + 2α(θ − θ₀).
    topic_code: "5.1"
  - front: Constant-α equations for a potter's wheel that speeds up, coasts, then slows → how to use them
    back: |
      Split the motion into stages with constant α in each; the equations never span a change in α.
    topic_code: "5.1"
  - front: rpm to rad/s → conversion factor
    back: |
      Multiply by 2π/60 ≈ 0.105. Example: 150 rpm × 2π/60 = 15.7 rad/s.
    topic_code: "5.1"
  - front: Ceiling fan from 150 rpm to rest in 12 s → α and revolutions
    back: |
      α = −15.7/12 = −1.31 rad/s²; Δθ = ½(15.7)(12) = 94.2 rad = 15.0 rev.
    topic_code: "5.1"
  - front: Slope of an angle–time (θ–t) graph → what it gives
    back: |
      The angular velocity ω. A θ–t curve that steepens means the object is speeding up.
    topic_code: "5.1"
  - front: Slope of an angular-velocity–time (ω–t) graph → what it gives
    back: |
      The angular acceleration α.
    topic_code: "5.1"
  - front: Area under an ω–t graph → what it gives
    back: |
      The angular displacement Δθ in radians; area below the time axis counts as negative (clockwise).
    topic_code: "5.1"
  - front: Potter's wheel ω–t table (0 → 6.0 rad/s in 4 s, steady 6 s, to rest in 3 s) → Δθ
    back: |
      ½(4)(6) + 6(6) + ½(3)(6) = 12 + 36 + 9 = 57 rad, about 9.1 revolutions.
    topic_code: "5.1"
  - front: Arc length travelled by a point on a turning object → relation
    back: |
      s = rθ, with θ in radians and r the point's distance from the axis.
    topic_code: "5.2"
  - front: Tangential speed of a point on a spinning disc → relation
    back: |
      v = rω. It grows in proportion to distance from the axis; a point on the axis does not move.
    topic_code: "5.2"
  - front: Tangential acceleration of a point on a speeding-up disc → relation
    back: |
      a_T = rα, along the point's path. It is zero whenever ω is constant.
    topic_code: "5.2"
  - front: Centripetal acceleration of a point on a spinning object → form to use at fixed ω
    back: |
      a_c = ω²r, toward the axis. At fixed ω it grows with r; at fixed speed a_c = v²/r shrinks with r.
    topic_code: "5.2"
  - front: Point on a wheel that is speeding up → its two acceleration components
    back: |
      a_T = rα along the path and a_c = ω²r toward the axis, perpendicular to each other; total size √(a_T² + a_c²).
    topic_code: "5.2"
  - front: Bike wheel on a stand (r = 0.34 m) at 20 rad/s → valve speed and a_c
    back: |
      v = 0.34 × 20 = 6.8 m/s; a_c = 20² × 0.34 = 136 m/s², about 14g.
    topic_code: "5.2"
  - front: Carousel riders at 1.5 m and 3.0 m, ω = 0.80 rad/s → speeds
    back: |
      Same ω; v = 1.2 m/s and 2.4 m/s. The outer rider also has twice the centripetal acceleration (0.96 vs 1.92 m/s²).
    topic_code: "5.2"
  - front: Turntable's angular speed triples → centripetal acceleration of a coin on it
    back: |
      Multiplied by 9, because a_c = ω²r and r is unchanged.
    topic_code: "5.2"
  - front: Coin moved from 5 cm to 10 cm on a turntable at steady ω → speed and a_c
    back: |
      Both double: v = rω and a_c = ω²r are proportional to r when ω is fixed.
    topic_code: "5.2"
  - front: Two wheels joined by a belt or chain without slipping → what they share
    back: |
      Rim (tangential) speed: r₁ω₁ = r₂ω₂. The smaller wheel spins faster.
    topic_code: "5.2"
  - front: Two wheels fixed on one axle → what they share
    back: |
      Angular velocity ω. The larger wheel's rim moves faster.
    topic_code: "5.2"
  - front: Units check for v = rω → why rad disappears
    back: |
      A radian is a ratio of two lengths, so rad·m/s is just m/s.
    topic_code: "5.2"
  - front: Error-spot → "the rim of a spinning record has a larger angular velocity than the label"
    back: |
      Every point of a rigid record shares ω. The rim has a larger speed, v = rω, not a larger angular velocity.
    topic_code: "5.2"
  - front: Error-spot → "s = rθ with θ = 3 revolutions, so s = 3r"
    back: |
      θ must be in radians: 3 rev = 6π rad, so s = 6πr ≈ 18.8r.
    topic_code: "5.1"
  - front: Error-spot → "the fan turns at a constant 15 rad/s, so its blade tips have no acceleration"
    back: |
      Constant ω means a_T = 0, but each tip still has centripetal acceleration ω²r toward the axis.
    topic_code: "5.2"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 5.1 and 5.2: angular displacement, velocity
    and acceleration, the constant-angular-acceleration equations, rotation graphs, and s = rθ, v = rω, a_T = rα,
    a_c = ω²r), with 8 questions (33%) reviewing earlier weeks (constant-acceleration kinematics and motion graphs,
    circular motion, energy conservation, impulse and momentum conservation). Opens with a shared-context set on
    a playground merry-go-round. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes. Calculator and equation sheet allowed throughout.
  questions:
    # ---- Stimulus set: a playground merry-go-round (5.1, 5.2)
    - slug: apphys1-u05-w19-q01
      type: multiple_choice
      topic_code: "5.1"
      source: "AP Physics 1 CED, Topic 5.1"
      points: 1
      stimulus: |
        A playground merry-go-round of radius 1.6 m is at rest. A parent pushes on its rim so that it turns counterclockwise (seen from above) with a constant angular acceleration of 0.40 rad/s² for 5.0 s. Child A sits at the rim, 1.6 m from the axis; child B sits 0.80 m from the axis. Treat the merry-go-round as a rigid object turning about a fixed vertical axis.
      prompt: |
        What is the angular velocity of the merry-go-round at the end of the 5.0 s push?
      options:
        - "1.0 rad/s"
        - "2.0 rad/s"
        - "3.2 rad/s"
        - "0.080 rad/s"
      option_explanations:
        - |
          1.0 rad/s is the average angular velocity during the push, ½(0 + 2.0); the question asks for the final value.
        - |
          Correct. From rest with constant α: ω = ω₀ + αt = 0 + (0.40 rad/s²)(5.0 s) = 2.0 rad/s.
        - |
          3.2 is child A's final speed in m/s (rω = 1.6 × 2.0); it mixes a linear speed into an angular answer.
        - |
          0.080 divides α by t instead of multiplying; ω grows as α × t when starting from rest.
      answer: 1
    - slug: apphys1-u05-w19-q02
      type: multiple_choice
      topic_code: "5.1"
      source: "AP Physics 1 CED, Topic 5.1"
      points: 1
      stimulus: |
        A playground merry-go-round of radius 1.6 m is at rest. A parent pushes on its rim so that it turns counterclockwise (seen from above) with a constant angular acceleration of 0.40 rad/s² for 5.0 s. Child A sits at the rim, 1.6 m from the axis; child B sits 0.80 m from the axis. Treat the merry-go-round as a rigid object turning about a fixed vertical axis.
      prompt: |
        Through what angle does the merry-go-round turn during the 5.0 s push?
      options:
        - "10 rad, about 1.6 revolutions"
        - "5.0 revolutions"
        - "2.0 rad, about 0.32 revolution"
        - "5.0 rad, about 0.80 revolution"
      option_explanations:
        - |
          10 rad comes from αt², dropping the factor of ½ in θ = ω₀t + ½αt².
        - |
          5.0 is the angle in radians, not revolutions; 5.0 rad ÷ 2π ≈ 0.80 rev.
        - |
          2.0 is the final angular velocity in rad/s, not an angle; multiplying it by the time and halving gives the angle.
        - |
          Correct. Δθ = ω₀t + ½αt² = 0 + ½(0.40)(5.0)² = 5.0 rad, and 5.0/(2π) ≈ 0.80 revolution.
      answer: 3
    - slug: apphys1-u05-w19-q03
      type: multiple_choice
      topic_code: "5.2"
      source: "AP Physics 1 CED, Topic 5.2"
      points: 1
      stimulus: |
        A playground merry-go-round of radius 1.6 m is at rest. A parent pushes on its rim so that it turns counterclockwise (seen from above) with a constant angular acceleration of 0.40 rad/s² for 5.0 s. Child A sits at the rim, 1.6 m from the axis; child B sits 0.80 m from the axis. Treat the merry-go-round as a rigid object turning about a fixed vertical axis.
      prompt: |
        At the instant the push ends (t = 5.0 s), what is the magnitude of child A's centripetal acceleration?
      options:
        - "6.4 m/s²"
        - "0.64 m/s²"
        - "2.5 m/s²"
        - "3.2 m/s²"
      option_explanations:
        - |
          Correct. ω = 2.0 rad/s at t = 5.0 s, so a_c = ω²r = (2.0)²(1.6) = 6.4 m/s², directed toward the axis.
        - |
          0.64 m/s² is the tangential acceleration a_T = rα = 1.6 × 0.40, the component along the path, not the centripetal one.
        - |
          2.5 comes from ω²/r = 4.0/1.6; the radius multiplies in a_c = ω²r, it does not divide.
        - |
          3.2 m/s is child A's speed rω, not an acceleration; a_c = v²/r = 3.2²/1.6 = 6.4 m/s².
      answer: 0
    - slug: apphys1-u05-w19-q04
      type: multiple_choice
      topic_code: "5.2"
      source: "AP Physics 1 CED, Topic 5.2"
      points: 1
      stimulus: |
        A playground merry-go-round of radius 1.6 m is at rest. A parent pushes on its rim so that it turns counterclockwise (seen from above) with a constant angular acceleration of 0.40 rad/s² for 5.0 s. Child A sits at the rim, 1.6 m from the axis; child B sits 0.80 m from the axis. Treat the merry-go-round as a rigid object turning about a fixed vertical axis.
      prompt: |
        At t = 5.0 s, how do child B's angular velocity, speed and centripetal acceleration compare with child A's?
      options:
        - "Twice the angular velocity, the same speed, twice the centripetal acceleration"
        - "The same angular velocity, the same speed, half the centripetal acceleration"
        - "The same angular velocity, half the speed, half the centripetal acceleration"
        - "The same angular velocity, half the speed, twice the centripetal acceleration"
      option_explanations:
        - |
          Points on a rigid merry-go-round cannot have different angular velocities; B would be turning away from A.
        - |
          Speed is v = rω, so at half the radius and the same ω, B moves at half A's speed, not the same speed.
        - |
          Correct. Both share ω = 2.0 rad/s. v = rω gives B half of A's 3.2 m/s (1.6 m/s), and a_c = ω²r gives half of 6.4 m/s² (3.2 m/s²).
        - |
          This uses a_c = v²/r as if speed were fixed; on a rigid object ω is fixed, and a_c = ω²r is proportional to r.
      answer: 2
    # ---- Independent items
    - slug: apphys1-u05-w19-q05
      type: multiple_choice
      topic_code: "5.1"
      source: "AP Physics 1 CED, Topic 5.1"
      points: 1
      prompt: |
        A washing-machine drum starts from rest. Its angular velocity increases steadily to 12 rad/s in the first 3.0 s, then stays at 12 rad/s for the next 5.0 s. Through what total angle does the drum turn in these 8.0 s?
      options:
        - "96 rad"
        - "60 rad"
        - "78 rad"
        - "48 rad"
      option_explanations:
        - |
          96 rad = 12 × 8.0 treats the drum as turning at 12 rad/s for the whole time, ignoring the spin-up from rest.
        - |
          60 rad counts only the steady 5.0 s and leaves out the angle turned while speeding up.
        - |
          Correct. Area under the ω–t graph: a triangle ½(3.0)(12) = 18 rad plus a rectangle (5.0)(12) = 60 rad, for 78 rad.
        - |
          48 rad = ½(12)(8.0) treats the whole 8.0 s as one steady speed-up, a single triangle.
      answer: 2
    - slug: apphys1-u05-w19-q06
      type: multiple_choice
      topic_code: "5.1"
      source: "AP Physics 1 CED, Topic 5.1"
      points: 1
      prompt: |
        A bicycle wheel on a repair stand is seen from the chain side spinning clockwise and slowing down. Counterclockwise is positive. Which describes the signs of the wheel's angular velocity ω and angular acceleration α?
      options:
        - "ω positive, α positive"
        - "ω negative, α negative"
        - "ω positive, α negative"
        - "ω negative, α positive"
      option_explanations:
        - |
          Clockwise spin is negative under this convention, so ω cannot be positive.
        - |
          Matching signs would mean speeding up in the clockwise direction; this wheel is slowing.
        - |
          This describes a wheel spinning counterclockwise and slowing; the wheel spins clockwise.
        - |
          Correct. Clockwise gives ω less than zero, and slowing down means α points opposite to ω, so α is positive.
      answer: 3
    - slug: apphys1-u05-w19-q07
      type: multiple_choice
      topic_code: "5.2"
      source: "AP Physics 1 CED, Topic 5.2"
      points: 1
      prompt: |
        A bench grinder's stone wheel, radius 0.10 m, starts from rest with a constant angular acceleration of 25 rad/s². What is the tangential acceleration of a point on the rim of the stone?
      options:
        - "250 m/s²"
        - "2.5 m/s²"
        - "62.5 m/s²"
        - "Zero, because a point on a rim moving in a circle has only centripetal acceleration"
      option_explanations:
        - |
          250 comes from α/r = 25/0.10; the radius multiplies the angular acceleration, a_T = rα.
        - |
          Correct. a_T = rα = (0.10 m)(25 rad/s²) = 2.5 m/s², along the rim's direction of motion.
        - |
          62.5 = α²r, which is not a physical relation; centripetal acceleration uses ω², and tangential uses α to the first power.
        - |
          Only a point on a wheel at constant ω has zero tangential acceleration; this wheel is speeding up, so a_T = rα is not zero.
      answer: 1
    - slug: apphys1-u05-w19-q08
      type: multiple_choice
      topic_code: "5.2"
      source: "AP Physics 1 CED, Topic 5.2"
      points: 1
      prompt: |
        A metre stick lies flat on a frictionless table, pinned at its 0 cm end, and is set spinning about the pin. Which quantity is the same for the 20 cm mark and the 60 cm mark at every instant?
      options:
        - "Angular velocity"
        - "Speed"
        - "Centripetal acceleration"
        - "Distance travelled in one revolution"
      option_explanations:
        - |
          Correct. The stick is rigid, so every mark turns through the same angle in the same time and shares one ω.
        - |
          v = rω, so the 60 cm mark moves three times as fast as the 20 cm mark.
        - |
          a_c = ω²r, so the 60 cm mark has three times the centripetal acceleration of the 20 cm mark.
        - |
          In one revolution each mark travels its own circumference 2πr, three times farther for the 60 cm mark.
      answer: 0
    - slug: apphys1-u05-w19-q09
      type: multiple_choice
      topic_code: "5.1"
      source: "AP Physics 1 CED, Topic 5.1"
      points: 1
      prompt: |
        A record turntable spins at 45 revolutions per minute. What is its angular speed in rad/s?
      options:
        - "4.7 rad/s"
        - "0.75 rad/s"
        - "283 rad/s"
        - "0.12 rad/s"
      option_explanations:
        - |
          Correct. 45 rev/min × 2π rad/rev ÷ 60 s/min = 4.71 rad/s.
        - |
          0.75 is the rate in revolutions per second (45/60); it still has to be multiplied by 2π rad/rev.
        - |
          283 = 45 × 2π is in radians per minute; dividing by 60 s/min was skipped.
        - |
          0.12 divides by 2π instead of multiplying; there are 2π radians in each revolution, so rad/s is larger than rev/s.
      answer: 0
    - slug: apphys1-u05-w19-q10
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        A cart rolling along a level track at 2.0 m/s is pushed so that it speeds up with a constant acceleration of 1.5 m/s² in its direction of motion for 4.0 s. What is its displacement during those 4.0 s?
      options:
        - "8.0 m"
        - "32 m"
        - "12 m"
        - "20 m"
      option_explanations:
        - |
          8.0 m = v₀t is the distance at the starting speed only; the cart is speeding up, adding ½at².
        - |
          32 m = v₀t + at² drops the ½ in Δx = v₀t + ½at².
        - |
          12 m = ½at² is the displacement of a cart that starts from rest; this one starts at 2.0 m/s.
        - |
          Correct. Δx = v₀t + ½at² = (2.0)(4.0) + ½(1.5)(4.0)² = 8.0 + 12 = 20 m.
      answer: 3
    - slug: apphys1-u05-w19-q11
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Physics 1 CED, Topic 2.9"
      points: 1
      prompt: |
        A 1200 kg car drives around a flat, unbanked curve of radius 50 m at a steady 15 m/s. Which describes the net force on the car?
      options:
        - "5400 N directed away from the centre of the curve"
        - "5400 N toward the centre of the curve, exerted by static friction from the road on the tyres"
        - "360 N toward the centre of the curve"
        - "5400 N toward the centre of the curve, exerted by kinetic friction because the car is moving"
      option_explanations:
        - |
          The outward "pull" is the passengers' sensation, not a force; the net force on a car in uniform circular motion points toward the centre.
        - |
          Correct. F_net = mv²/r = (1200)(15)²/50 = 5400 N toward the centre. The tyres roll without skidding, so the road's static friction supplies it.
        - |
          360 N = mv/r uses v instead of v²; the centripetal force is mv²/r.
        - |
          The size and direction are right, but rolling tyres do not slide across the road, so the friction is static, not kinetic.
      answer: 1
    - slug: apphys1-u05-w19-q12
      type: multiple_choice
      topic_code: "4.2"
      source: "AP Physics 1 CED, Topic 4.2"
      points: 1
      prompt: |
        A force sensor records a kick on a soccer ball. The force rises steadily from 0 to a peak of 600 N and falls steadily back to 0, the whole contact lasting 0.020 s (a triangle on the force–time graph). What is the magnitude of the impulse on the ball?
      options:
        - "12 N·s"
        - "3.0 × 10⁴ N·s"
        - "6.0 N·s"
        - "Zero, because the force ends where it started"
      option_explanations:
        - |
          12 N·s = 600 × 0.020 is the area of a rectangle at the peak force; the graph is a triangle, so take half.
        - |
          3.0 × 10⁴ = 600/0.020 divides force by time; impulse is the area under the force–time graph, force times time.
        - |
          Correct. Impulse = area under the F–t graph = ½(0.020 s)(600 N) = 6.0 N·s.
        - |
          The force returning to zero does not cancel anything: the force was in one direction the whole time, so the area is positive.
      answer: 2
    - slug: apphys1-u05-w19-q13
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      prompt: |
        A 50 kg skateboarder starts from rest at the top of a smooth ramp and rolls down to a point 2.5 m lower. Treat the skateboarder–Earth system as having no friction or air resistance. What is her speed at the lower point?
      options:
        - "4.9 m/s"
        - "7.0 m/s"
        - "24.5 m/s"
        - "It cannot be found without the length of the ramp."
      option_explanations:
        - |
          4.9 m/s = √(gh) drops the factor of 2 that comes from ½mv² = mgh.
        - |
          Correct. With no dissipation, mgh = ½mv², so v = √(2gh) = √(2 × 9.8 × 2.5) = 7.0 m/s; the mass cancels.
        - |
          24.5 = gh is v²/2, not v; the square root and the factor of 2 were both left out.
        - |
          Energy conservation depends only on the vertical drop, not on the path length, when nothing dissipates energy.
      answer: 1
    - slug: apphys1-u05-w19-q14
      type: multi_select
      topic_code: "5.2"
      source: "AP Physics 1 CED, Topic 5.2"
      points: 2
      partial_credit: true
      prompt: |
        A turntable spins at a constant 3.0 rad/s. Coin A sits 0.05 m from the axis and coin B sits 0.15 m from the axis, and neither slides. Which statements are correct? Select all that apply.
      options:
        - "Coin A and coin B have the same angular velocity."
        - "Coin B's speed is three times coin A's speed."
        - "Coin B has a tangential acceleration greater than zero."
        - "Coin B's centripetal acceleration is three times coin A's."
        - "Coin A has the larger centripetal acceleration because it is closer to the axis."
      option_explanations:
        - |
          Correct. The coins ride a rigid turntable, so both turn at 3.0 rad/s.
        - |
          Correct. v = rω: 0.15 × 3.0 = 0.45 m/s for B and 0.05 × 3.0 = 0.15 m/s for A.
        - |
          The turntable's ω is constant, so α = 0 and a_T = rα = 0 for every point.
        - |
          Correct. a_c = ω²r: 9.0 × 0.15 = 1.35 m/s² for B against 9.0 × 0.05 = 0.45 m/s² for A.
        - |
          This applies a_c = v²/r as if the speeds were equal; at a shared ω, a_c = ω²r is larger for the farther coin.
      answer: [0, 1, 3]
    - slug: apphys1-u05-w19-q15
      type: multi_select
      topic_code: "5.1"
      source: "AP Physics 1 CED, Topic 5.1"
      points: 2
      partial_credit: true
      stimulus: |
        A lab group records the angular velocity of a spinning wheel each second (counterclockwise positive):

        | t (s) | 0 | 1 | 2 | 3 | 4 |
        |---|---|---|---|---|---|
        | ω (rad/s) | 6.0 | 4.0 | 2.0 | 0 | −2.0 |
      prompt: |
