      prompt: |
        On a bicycle, the chain runs without slipping from the front chainring (radius 0.10 m) to the rear sprocket (radius 0.040 m). The rear sprocket and the rear wheel (radius 0.34 m) are fixed to the same axle. The bike is on a repair stand and a rider turns the chainring at a steady 6.0 rad/s.

        (a) What is the speed of the chain?
        (b) What is the angular speed of the rear sprocket?
        (c) What is the speed of a point on the rear tyre? Explain which pairs of parts share an angular speed and which share a linear speed.
      answer: |
        (a) The chain moves with the chainring's rim: v = rω = (0.10 m)(6.0 rad/s) = 0.60 m/s.
        (b) The chain moves with the sprocket's rim too, so ω = v/r = 0.60/0.040 = 15 rad/s.
        (c) The rear wheel shares the sprocket's axle, so it also turns at 15 rad/s, and a point on the tyre moves at v = (0.34)(15) = 5.1 m/s. Parts linked by the chain share a linear (rim) speed; parts fixed to the same axle share an angular speed.
      explanation: |
        Three points, one per part. (a) 0.60 m/s from v = rω at the chainring. (b) 15 rad/s, using the same chain speed at the sprocket's rim. (c) 5.1 m/s with the reasoning that the sprocket and wheel share ω on one axle while the chainring and sprocket share rim speed through the chain. Giving the sprocket the chainring's 6.0 rad/s loses points (b) and (c) unless the later work is consistent and the explanation is correct, in which case (c) can still earn its point.
    - slug: apphys1-u05-w19-q23
      type: short_answer
