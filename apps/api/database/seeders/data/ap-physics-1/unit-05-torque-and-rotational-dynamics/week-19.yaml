      source: "AP Physics 1 CED, Topic 2.9"
      points: 2
      prompt: |
        A child on a playground swing passes through the lowest point of the arc, moving at 3.0 m/s. (a) Describe in words the free-body diagram of the child (with the seat) at that instant. (b) Is the upward force from the chains greater than, less than or equal to the child's weight? Justify your answer.
      answer: |
        (a) Two forces: an upward arrow labelled F_T (the chains' tension on the seat and child) and a downward arrow labelled F_g (weight, Earth's pull). There is no forward "force of motion".
        (b) Greater. At the lowest point the child moves in a circle whose centre is above, so the net force must point up, toward the centre, with size mv²/r. That requires F_T − F_g = mv²/r, which is greater than zero, so F_T is greater than F_g.
      explanation: |
        Two points. (a) 1 point: exactly two forces, tension up and weight down, correctly labelled; a forward force or a "centripetal force" drawn as a separate arrow loses the point. (b) 1 point: "greater" with the reasoning that the net force at the bottom points up toward the centre of the circular path (F_T − F_g = mv²/r). "Equal, because the child is at the bottom" earns nothing.
