      type: long_answer
      topic_code: "5.1"
      source: "AP Physics 1 CED, Topic 5.1"
      points: 6
      prompt: |
        Experimental design and analysis. A lab group wants to find the angular acceleration of a turntable that a small motor speeds up from rest. They suspect the angular acceleration is constant.

        (A) Describe a procedure the group could use to measure the turntable's angular position at several times as it speeds up. Name the equipment and one way to reduce uncertainty.

        (B) The group records the following data (θ measured from the starting position):

        | t (s) | 0.50 | 1.00 | 1.50 | 2.00 | 2.50 |
        |---|---|---|---|---|---|
        | θ (rad) | 0.16 | 0.58 | 1.38 | 2.37 | 3.78 |

        Name the quantities the group should graph to get a straight line if α is constant, and give the values of the new quantity.

        (C) Use the straightened data to find the turntable's angular acceleration. Show how you got the slope.

        (D) A student says that if the motor were replaced with one that gives twice the angular acceleration, the turntable would turn through twice the angle in the first 2.0 s. Is the student correct? Justify your answer.
      answer: |
        (A) Put a strip of tape on the rim and film the turntable from above with a phone at a known frame rate next to a protractor or angle scale (or use a rotary motion sensor). Start the motor and the recording together; step through the video and read the tape's angle at equal time intervals, converting to radians. Repeat several runs and average θ at each time, and choose a high frame rate to reduce timing uncertainty.
        (B) Starting from rest with constant α, θ = ½αt², so graph θ (vertical) against t² (horizontal). t² values: 0.25, 1.00, 2.25, 4.00, 6.25 s².
        (C) A best-fit line through the points (it passes close to the origin) has slope ≈ (3.78 − 0.16)/(6.25 − 0.25) ≈ 0.60 rad/s² (a least-squares fit gives 0.603). The slope equals α/2, so α ≈ 2 × 0.60 = 1.2 rad/s².
        (D) Yes. From rest, θ = ½αt². At the same time t = 2.0 s, θ is directly proportional to α, so doubling α doubles the angle (from about 2.4 rad to about 4.8 rad).
      explanation: |
        Six points.
        (A) 2 points: 1 for a workable method of measuring angle at known times (video with angle scale or marked tape, rotary motion sensor, or similar), including starting from rest; 1 for a valid way to reduce uncertainty (repeated trials averaged, higher frame rate, a larger angle scale, many data points).
        (B) 1 point: θ against t² (or √θ against t, with the matching slope √(α/2)) with the computed t² values.
        (C) 2 points: 1 for a slope from the line or two well-separated points of about 0.60 rad/s² (accept 0.57–0.63); 1 for using slope = α/2 to get α ≈ 1.2 rad/s² (accept 1.1–1.3) with a unit. Reporting the slope itself as α earns only the first point.
        (D) 1 point: "correct" justified by θ = ½αt² being proportional to α at a fixed time. A bare "yes" earns nothing.
