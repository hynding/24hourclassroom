        True or false: On a spinning bicycle wheel, a point on the tyre has a greater angular velocity than a point on a spoke near the hub.
      answer: false
      explanation: |
        False. The wheel is rigid, so every point turns through the same angle in the same time and shares one angular velocity. The point on the tyre has a greater speed (v = rω) and a greater centripetal acceleration (ω²r), because it is farther from the axis.
