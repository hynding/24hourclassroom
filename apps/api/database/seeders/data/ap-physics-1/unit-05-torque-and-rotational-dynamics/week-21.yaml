      prompt: |
        A tightrope walker carries a long, light pole with a 4.0 kg weight fixed at each end, 3.0 m from her body's centre line.

        (a) Calculate the rotational inertia that the two weights add about an axis along the rope (through her body's centre line). Treat the weights as point masses.
        (b) She slides both weights in to 1.5 m from her centre line. Find the new contribution and state the factor by which it changed.
        (c) Explain, using rotational inertia, why the weights at the ends help her keep her balance better than the same weights held close to her body.
      answer: |
        (a) I = 2(4.0)(3.0)² = 72 kg·m².
        (b) I = 2(4.0)(1.5)² = 18 kg·m², one quarter of the original, because halving r quarters r².
        (c) With the weights far out, the walker-and-pole system has a much larger rotational inertia about the rope, so a small unbalanced torque (a gust, a slight lean) changes her angular velocity much more slowly. That gives her time to shift and correct before she tips far. Held close, the same mass adds little rotational inertia.
      explanation: |
        Three points, one per part. (a) 72 kg·m² from Σmr² with both weights. (b) 18 kg·m² and "a quarter" (or "decreases by a factor of 4"), with reference to r being squared. (c) A larger rotational inertia means the same torque produces a smaller change in rotation, so she tips more slowly and can correct; the answer must connect the distance of the mass from the axis to resistance to angular acceleration. "The pole makes her heavier" earns nothing.
