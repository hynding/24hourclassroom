      prompt: |
        True or false: Two objects with equal masses always have equal rotational inertias about axes through their centres of mass.
      answer: false
      explanation: |
        False. Rotational inertia depends on how the mass is distributed relative to the axis, not only on the total mass. A hoop and a solid disc of equal mass and radius have I = MR² and ½MR²; a long rod and a compact ball of equal mass differ even more.
