    - slug: apphys1-u05-w21-q25
      type: long_answer
      topic_code: "5.4"
      source: "AP Physics 1 CED, Topic 5.4"
      points: 6
      prompt: |
        Qualitative/quantitative translation. A uniform rod of mass M and length L turns about a perpendicular axis through its centre; about that axis I_rod = (1/12)ML². Two small beads, each of mass m, can slide along the rod and be locked in place, always symmetric about the centre.

        (A) Without equations, explain how the rotational inertia of the rod-and-beads system about the central axis changes as the beads are slid from the centre out to the two ends.

        (B) Derive an expression for the system's rotational inertia about the central axis with the beads locked at the two ends, in terms of M, m, L and physical constants as appropriate.

        (C) Show that your expression from (B) agrees with your reasoning in (A), and check it in one limiting case.

        (D) For M = 0.30 kg, L = 0.80 m and m = 0.10 kg, with the beads at the ends, calculate the rotational inertia about the central axis, and then about a parallel axis through one end of the rod.
      answer: |
        (A) The rod's own contribution does not change. The beads' contribution grows as they move out, because each bit of mass contributes more the farther it is from the axis (in proportion to the square of the distance), so the system's rotational inertia increases steadily, faster and faster, as the beads approach the ends.
        (B) I = (1/12)ML² + 2m(L/2)² = (1/12)ML² + ½mL².
        (C) With the beads at the centre (r = 0) they add nothing and I = (1/12)ML²; at the ends they add ½mL², which is positive, so I is larger, matching (A). Limiting case: if m → 0, I → (1/12)ML², the bare rod, as it must. (Or: if M → 0, I → ½mL² = 2m(L/2)², two point masses on a light rod.)
        (D) Central axis: I = (1/12)(0.30)(0.80)² + ½(0.10)(0.80)² = 0.016 + 0.032 = 0.048 kg·m². The system's centre of mass is still at the rod's centre (the beads are symmetric), and its total mass is M + 2m = 0.50 kg, so about an end: I = 0.048 + (0.50)(0.40)² = 0.048 + 0.080 = 0.128 ≈ 0.13 kg·m².
      explanation: |
        Six points.
        (A) 1 point: I increases as the beads move outward, with reasoning that a mass's contribution grows with its distance from the axis (squared). "Stays the same because the mass is the same" earns nothing.
        (B) 2 points: 1 for adding the rod's I to the beads' contribution about the same axis; 1 for the beads' term 2m(L/2)² = ½mL² (a missing factor of 2 or using L instead of L/2 loses this point).
        (C) 1 point: connects the expression to (A) (beads at centre give the smaller (1/12)ML²) and gives a correct limiting case (m → 0 or M → 0).
        (D) 2 points: 1 for 0.048 kg·m² about the centre; 1 for 0.128 kg·m² (accept 0.13) about the end using the parallel axis theorem with the total mass 0.50 kg and d = 0.40 m (or by direct summation: (1/3)ML² + m(0)² + mL²). Using only the rod's mass in Md² loses the second point.
