        Mathematical routines. A 4.0 kg block rests on a level table; the coefficient of kinetic friction between block and table is 0.20. A light string attached to the block runs horizontally to a pulley at the table's edge and down to a hanging 1.5 kg block. The pulley is a uniform solid disk of mass 1.0 kg and radius 0.10 m (I = ½MR²) on a frictionless axle, and the string does not slip. The system is released and the blocks move. Use g = 9.8 m/s².

        (A) Write an equation for each of the three objects (the table block, the hanging block and the pulley), and combine them to derive an expression for the acceleration a of the blocks in terms of the masses, μ_k and g.

        (B) Calculate a, the tension T_h in the vertical part of the string and the tension T_t in the horizontal part.

        (C) Explain, with reference to the pulley, why the two tensions in (B) are different. Then use your expression from (A) to state what a would be if the pulley's mass were negligible, and explain whether that limiting value is consistent with the answer in (B).
      answer: |
        (A) Table block (4.0 kg, m₁): T_t − μ_k m₁ g = m₁a. Hanging block (1.5 kg, m₂): m₂g − T_h = m₂a. Pulley: (T_h − T_t)R = (½MR²)(a/R), so T_h − T_t = ½Ma. Adding the three: m₂g − μ_k m₁ g = (m₁ + m₂ + ½M)a, so a = (m₂ − μ_k m₁)g/(m₁ + m₂ + ½M).
        (B) a = (1.5 − 0.20 × 4.0)(9.8)/(4.0 + 1.5 + 0.50) = (0.70)(9.8)/6.0 ≈ 1.14 m/s². T_h = m₂(g − a) = 1.5(9.8 − 1.143) ≈ 13.0 N. T_t = m₁a + μ_k m₁ g = 4.0(1.143) + 7.84 ≈ 12.4 N.
        (C) The pulley has rotational inertia and accelerates angularly in the direction the hanging block pulls it, so it needs a net torque in that direction: (T_h − T_t)R = Iα, which requires T_h larger than T_t (here by ½Ma ≈ 0.57 N). With M = 0, a = (m₂ − μ_k m₁)g/(m₁ + m₂) = 6.86/5.5 ≈ 1.25 m/s², slightly larger than 1.14 m/s². That is consistent: removing the pulley's inertia removes something that had to be accelerated, so the blocks speed up faster, and the two tensions become equal.
      explanation: |
        Six points.
        (A) 2 points: 1 for three correct equations (including friction μ_k m₁ g on the table block and different tensions on the two sides of the pulley, with a = Rα); 1 for the combined expression a = (m₂ − μ_k m₁)g/(m₁ + m₂ + ½M) or an equivalent form.
        (B) 2 points: 1 for a ≈ 1.14 m/s² (accept 1.13–1.15; 1.17 m/s² with g = 10 if stated); 1 for both tensions, T_h ≈ 13.0 N and T_t ≈ 12.4 N, consistent with the student's a.
        (C) 2 points: 1 for explaining that a net torque is needed to give the massive pulley angular acceleration, so the tension on the hanging side is larger; 1 for the massless limit ≈ 1.25 m/s² with the reasoning that it should be (and is) larger than the value in (B). Using a single tension throughout loses the first point of (A) and the first point of (C).
