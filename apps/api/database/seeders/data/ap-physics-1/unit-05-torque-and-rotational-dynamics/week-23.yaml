      points: 1
      prompt: |
        True or false: Of two identical wheels, the one that experiences the larger net torque must be turning with the larger angular velocity.
      answer: false
      explanation: |
        False. A net torque sets the angular acceleration (α = Στ/I), the rate at which ω changes. The angular velocity also depends on the starting value and on how long the torque has acted; a wheel with a large torque that has just started from rest can be turning more slowly than one already spinning with no torque at all.
