      points: 3
      prompt: |
        A spool on a fixed, frictionless axle has a light string wrapped around it. In trial 1, a student pulls the free end of the string straight down with a constant 20 N force. In trial 2, the student instead hangs a block whose weight is 20 N from the string and lets go. In which trial does the spool have the larger angular acceleration? Make a claim and justify it, using free-body reasoning for the block and Στ = Iα for the spool.
      answer: |
        Claim: trial 1 gives the larger angular acceleration.
        Trial 1: the tension in the string is the student's pull, exactly 20 N, so the torque on the spool is (20 N)r.
        Trial 2: the block accelerates downward, so the net force on it is downward: 20 N − T = ma with a greater than zero, so T is less than 20 N. The torque on the spool, Tr, is therefore less than (20 N)r.
        Since α = Tr/I with the same r and I in both trials, the larger tension in trial 1 gives the larger α.
      explanation: |
        Three points. 1 point: the claim (trial 1). 1 point: in trial 2 the tension is less than the block's weight because the block accelerates downward (a free-body or ΣF = ma argument). 1 point: connects the tension to the torque on the spool and to α = Στ/I with I and r unchanged. "They are the same, because both are 20 N" earns no credit.
