        Two points. (a) 1 point: exactly two forces, weight down and normal force up, labelled; an extra force in the direction of motion loses the point. (b) 1 point: "less" with reasoning from the direction of the acceleration (downward while slowing on the way up) and Newton's second law. "Greater, because the elevator moves up" earns nothing.
