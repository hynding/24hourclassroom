        Three points. 1 point: A's torque, 30 N·m. 1 point: B's torque, 30 N·m, using sin 30° (using cos 30° to get 52 N·m loses this point). 1 point: a conclusion that the torques are equal, with reasoning that the greater distance compensates for the smaller perpendicular component (or lever arm r sin θ = 0.75 m).
