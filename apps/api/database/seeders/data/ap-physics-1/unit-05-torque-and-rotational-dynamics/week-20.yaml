      type: long_answer
      topic_code: "5.3"
      source: "AP Physics 1 CED, Topic 5.3"
      points: 6
      prompt: |
        Experimental design and analysis. The hinges of a heavy fire door are stiff. A student models them as resisting with a fixed torque τ₀: the door just starts to turn when the torque of her pull about the hinge line reaches τ₀. She wants to find τ₀.

        (A) Describe a procedure using a spring scale and a metre stick to collect data from which τ₀ can be found. Say what is varied, what is measured and how to keep the pull's angle under control.

        (B) She pulls perpendicular to the door at several distances r from the hinge line and records the spring-scale reading F at the moment the door starts to move:

        | r (m) | 0.20 | 0.30 | 0.40 | 0.60 | 0.80 |
        |---|---|---|---|---|---|
        | F (N) | 29.5 | 20.6 | 14.7 | 10.2 | 7.4 |

        Name the quantities she should graph to get a straight line, and give the values of the new quantity.

        (C) Use the straightened data to determine τ₀. Show how you got the slope.

        (D) She now pulls at 0.50 m from the hinge line, but at 60° to the door's surface instead of perpendicular. Predict the spring-scale reading at which the door starts to move, and explain.
      answer: |
        (A) Attach the spring scale to the door at a measured distance r from the hinge line (marked with the metre stick). Pull horizontally and perpendicular to the door's surface (check the angle with a protractor or by keeping the scale square to the door), increasing the pull slowly, and record the reading at the moment the door begins to turn. Vary r over five or more values and repeat each pull three times, averaging the readings.
        (B) The model says Fr = τ₀ at the threshold, so F = τ₀(1/r). Graph F (vertical) against 1/r (horizontal). 1/r values: 5.00, 3.33, 2.50, 1.67, 1.25 m⁻¹.
        (C) The points lie close to a line through the origin. Slope ≈ (29.5 − 7.4)/(5.00 − 1.25) ≈ 5.9 N·m (a least-squares fit gives 5.9 N·m). The slope is τ₀, so τ₀ ≈ 5.9 N·m.
        (D) Only the perpendicular component counts: τ = rF sin 60°. Setting (0.50)(F)(0.866) = 5.9 N·m gives F ≈ 14 N, larger than the 12 N needed perpendicular at 0.50 m, because at 60° part of the pull acts along the door toward or away from the hinges and does not turn it.
      explanation: |
        Six points.
        (A) 2 points: 1 for varying r with the metre stick and recording the threshold reading of the spring scale; 1 for controlling the angle (perpendicular pull) and a valid way to reduce uncertainty (repeated trials averaged, slow steady increase of the pull, several values of r).
        (B) 1 point: F against 1/r (or r against 1/F) with the computed values.
        (C) 2 points: 1 for a slope from a line or two well-separated points of about 5.9 N·m (accept 5.6–6.2 N·m); 1 for identifying the slope as τ₀ with the unit N·m. Averaging the products F × r (all near 6 N·m) is an acceptable alternative for this point only if the graph in (B) is also correct.
        (D) 1 point: about 14 N (accept 13–14 N, consistent with the τ₀ from part C) with reasoning that only F sin 60° contributes to the torque. A prediction of about 12 N from ignoring the angle earns nothing.
