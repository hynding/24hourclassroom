        Student B: τ = rF sin θ = (1.5)(40)(sin 30°) = 30 N·m.
        The claim is wrong: the torques are equal. B's force and angle do give a smaller perpendicular component (20 N against 60 N), but B pushes three times as far from the hinges, and torque depends on the product of distance and perpendicular force, not on the force alone.
