week: 20
unit: 5
title: "Torque"
topics: ["5.3"]
guide: guides/week-20.md
guide_description: |
  What makes an object turn: torque as τ = rF sin θ = r⊥F, the position vector, the angle between r and F, the
  line of action and the lever arm, why a force through the axis exerts no torque, signs (counterclockwise
  positive) and net torque, and extended force diagrams that show where each force acts (gravity at the centre
  of mass, a hinge at the axis). Worked examples: a wrench pulled at 90°, 60°, 30° and 0° (with a pipe
  extension doubling r), a door pushed at the handle and near the hinges, an unbalanced seesaw with a 30 kg and
  a 25 kg child, and the torques on a wall-hinged beam held by a cable at 30°, with a limiting-case check.
flashcards_description: |
  30 cards on torque: the three things a torque depends on, τ = rF sin θ and τ = r⊥F, finding the lever arm and
  line of action, signs and net torque, extended force diagrams, gravity's torque at the centre of mass, hinge
  forces, couples, functional dependence, and three error-spot cards.

flashcards:
  - front: Torque about a chosen axis → what it measures and its unit
    back: |
      The turning effect of a force about a chosen axis, in N·m (never joules).
    topic_code: "5.3"
  - front: Torque on a door → the three things it depends on
    back: |
      The size of the push F, how far from the hinge line it acts (r), and its direction relative to the line from the hinge (θ).
    topic_code: "5.3"
  - front: Torque magnitude in terms of r, F and θ → formula
    back: |
      τ = rF sin θ, with θ the angle between the position vector r (axis to point of application) and F.
    topic_code: "5.3"
  - front: Lever arm r⊥ of a push on a door → definition
    back: |
      The perpendicular distance from the axis to the force's line of action; r⊥ = r sin θ, so τ = r⊥F.
    topic_code: "5.3"
  - front: Line of action of a force → how to draw it
    back: |
      A line through the point where the force acts, along the force's direction, extended both ways.
    topic_code: "5.3"
  - front: Perpendicular component reading of τ = rF sin θ → which part of F turns the object
    back: |
      Only F⊥ = F sin θ, the part perpendicular to r. The part along r pulls or pushes on the axis without turning.
    topic_code: "5.3"
  - front: Force whose line of action passes through the axis → its torque
    back: |
      Zero: its lever arm is zero, however large the force.
    topic_code: "5.3"
  - front: Force perpendicular to r → its torque
    back: |
      The largest possible for that F and r: τ = rF, because sin 90° = 1.
    topic_code: "5.3"
  - front: Wrench, 80 N at 0.25 m, pulled at 90°, 60°, 30° to the handle → torques
    back: |
      20.0 N·m, 17.3 N·m, 10.0 N·m. Pulling along the handle (0°) gives zero.
    topic_code: "5.3"
  - front: Pipe slipped over a wrench doubles r at the same 90° pull → torque
    back: |
      Doubles. τ is proportional to r, which is why a longer handle loosens a stuck bolt.
    topic_code: "5.3"
  - front: Door 40 N perpendicular push at 0.80 m vs 0.20 m from the hinge → torques
    back: |
      32 N·m vs 8.0 N·m. Matching 32 N·m at 0.20 m needs 160 N.
    topic_code: "5.3"
  - front: Sign of a torque in AP Physics 1 → how to decide
    back: |
      Imagine the force acting alone on an object free to turn about the axis: counterclockwise turning is positive, clockwise negative.
    topic_code: "5.3"
  - front: Net torque on a rigid object → how to find it
    back: |
      Pick one axis, find each torque's size and sign about it, and add: Στ = τ₁ + τ₂ + ….
    topic_code: "5.3"
  - front: Extended force diagram → how it differs from a free-body dot diagram
    back: |
      Each force arrow starts at the point on the object where that force acts, with the axis marked, because location sets the torque.
    topic_code: "5.3"
  - front: Gravity on a rigid object in a torque problem → where to draw it
    back: |
      At the centre of mass; for a uniform beam, its midpoint. τ_g = r⊥(Mg).
    topic_code: "5.3"
  - front: Hinge or pivot force → its torque about that hinge
    back: |
      Zero, because it acts at the axis. Putting the axis at an unknown force removes it from the torque sum.
    topic_code: "5.3"
  - front: Uniform seesaw, 30 kg at 1.8 m left, 25 kg at 1.5 m right → net torque
    back: |
      +529.2 N·m − 367.5 N·m ≈ +162 N·m, counterclockwise: the left side goes down.
    topic_code: "5.3"
  - front: Seesaw with a 30 kg child at 1.8 m → where a 25 kg child sits for zero net torque
    back: |
      d = (30)(1.8)/25 = 2.16 m on the other side; g cancels.
    topic_code: "5.3"
  - front: Beam 2.0 m long, cable at the far end at 30° to the beam → cable's lever arm about the hinge
    back: |
      r⊥ = (2.0 m)(sin 30°) = 1.0 m, so the cable's torque is (1.0 m)T.
    topic_code: "5.3"
  - front: Cable holding a hinged beam is made steeper → effect on its lever arm
    back: |
      The angle between beam and cable grows, so r⊥ = r sin θ grows and less tension gives the same torque.
    topic_code: "5.3"
  - front: Cable running parallel to a hinged beam → can it hold the beam up?
    back: |
      No. θ = 0° gives zero lever arm about the hinge, so the cable exerts no torque to oppose gravity's.
    topic_code: "5.3"
  - front: Couple (two equal, opposite forces along different lines) → net force and net torque
    back: |
      Net force zero, net torque not zero: it spins the object without moving its centre of mass. Example: two hands on a steering wheel.
    topic_code: "5.3"
  - front: Force through a wheel's axle → effect on spin and on motion
    back: |
      No torque about the axle, so no change in spin, but it can still accelerate the wheel as a whole.
    topic_code: "5.3"
  - front: Spinning fan with zero net torque on it → what happens to its ω
    back: |
      Its angular velocity stays constant: it stays at rest or keeps spinning steadily.
    topic_code: "5.3"
  - front: Force tripled while its angle to r changes from 90° to 30° → torque factor
    back: |
      3 × sin 30° = 1.5: the torque is 1.5 times as large.
    topic_code: "5.3"
  - front: Force doubled and applied at half the distance, both perpendicular → torque
    back: |
      Unchanged, because τ = rF depends on the product.
    topic_code: "5.3"
  - front: A 20 N·m torque vs 20 J of work → why the units look alike
    back: |
      Work is energy transferred along a displacement (J); torque is a turning effect about an axis. Same base units, different quantities.
    topic_code: "5.3"
  - front: Error-spot → "τ = rF cos θ, where θ is the angle between the wrench and the pull"
    back: |
      With θ between r and F, use sin θ. cos θ belongs only if the given angle is measured from the perpendicular to r.
    topic_code: "5.3"
  - front: Error-spot → "r is the length of the whole board" for a child sitting partway along a seesaw
    back: |
      r runs from the axis to where the force acts: the child's distance from the pivot, not the board's length.
    topic_code: "5.3"
  - front: Error-spot → "the hinge pushes hard, so it adds a big torque about the hinge"
    back: |
      A force acting at the axis has zero lever arm about that axis, however large it is.
    topic_code: "5.3"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topic 5.3: torque as rF sin θ and r⊥F, lever arms and
    lines of action, signs and net torque, extended force diagrams, couples and functional dependence), with 8
    questions (33%) reviewing earlier weeks (rotational kinematics and the link v = rω from week 19, centre of
    mass, vector components, free-body diagrams and work). Opens with a shared-context set on a metre stick
    balanced on a knife edge. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes. Calculator and equation sheet allowed throughout.
  questions:
    # ---- Stimulus set: a metre stick on a knife edge (5.3)
    - slug: apphys1-u05-w20-q01
      type: multiple_choice
      topic_code: "5.3"
      source: "AP Physics 1 CED, Topic 5.3"
      points: 1
      stimulus: |
        A lab group rests a uniform 0.12 kg metre stick on a knife edge at its 50 cm mark, so the stick can turn about that point. They hang a 0.200 kg mass from the 20 cm mark and a 0.100 kg mass from the 90 cm mark, and hold the stick level for an instant before letting go. The 0 cm end is on the left as they look at it; counterclockwise is positive. Use g = 9.8 m/s².
      prompt: |
        What is the magnitude of the torque that the 0.200 kg hanging mass exerts on the stick about the knife edge?
      options:
        - "0.060 N·m"
        - "0.39 N·m"
        - "0.59 N·m"
        - "59 N·m"
      option_explanations:
        - |
          0.060 = (0.30 m)(0.200 kg) multiplies the distance by the mass; the force is the weight, mg = 1.96 N.
        - |
          0.39 N·m uses r = 0.20 m, the reading at the hanging point; r is the distance from the knife edge, 50 − 20 = 30 cm.
        - |
          Correct. The mass hangs 0.30 m from the pivot and pulls straight down, perpendicular to the stick: τ = rF = (0.30)(0.200 × 9.8) = 0.59 N·m.
        - |
          59 comes from measuring r in centimetres (30 cm); torque in N·m needs r in metres.
      answer: 2
    - slug: apphys1-u05-w20-q02
      type: multiple_choice
      topic_code: "5.3"
      source: "AP Physics 1 CED, Topic 5.3"
      points: 1
      stimulus: |
        A lab group rests a uniform 0.12 kg metre stick on a knife edge at its 50 cm mark, so the stick can turn about that point. They hang a 0.200 kg mass from the 20 cm mark and a 0.100 kg mass from the 90 cm mark, and hold the stick level for an instant before letting go. The 0 cm end is on the left as they look at it; counterclockwise is positive. Use g = 9.8 m/s².
      prompt: |
        What is the net torque on the stick about the knife edge at the instant it is released?
      options:
        - "+0.20 N·m (counterclockwise), so the left end starts to drop"
        - "+0.98 N·m (counterclockwise)"
        - "Zero, because the knife edge is at the centre of the stick"
        - "−0.20 N·m (clockwise), so the right end starts to drop"
      option_explanations:
        - |
          Correct. Left mass: +(0.30)(1.96) = +0.588 N·m. Right mass: −(0.40)(0.98) = −0.392 N·m. The stick's weight acts at the pivot (zero). Στ = +0.196 ≈ +0.20 N·m, counterclockwise.
        - |
          0.98 adds the two torques' magnitudes; they turn the stick in opposite directions, so one is negative.
        - |
          The pivot at the centre makes the stick's own weight exert no torque, but the hanging masses are unequal in mass × distance (0.060 vs 0.040 kg·m).
        - |
          The size is right but the sign is reversed: the larger torque comes from the left mass, which turns the stick counterclockwise.
      answer: 0
    - slug: apphys1-u05-w20-q03
      type: multiple_choice
      topic_code: "5.3"
      source: "AP Physics 1 CED, Topic 5.3"
      points: 1
      stimulus: |
        A lab group rests a uniform 0.12 kg metre stick on a knife edge at its 50 cm mark, so the stick can turn about that point. They hang a 0.200 kg mass from the 20 cm mark and a 0.100 kg mass from the 90 cm mark, and hold the stick level for an instant before letting go. The 0 cm end is on the left as they look at it; counterclockwise is positive. Use g = 9.8 m/s².
      prompt: |
        In an extended force diagram of the stick, where should the stick's own weight be drawn, and what torque does it exert about the knife edge?
      options:
        - "At the 0 cm end, exerting a counterclockwise torque"
        - "Spread as two arrows at the ends, exerting torques that add"
        - "At the 100 cm end, exerting a clockwise torque"
        - "At the 50 cm mark, exerting zero torque about the knife edge"
      option_explanations:
        - |
          Gravity on a rigid object acts at its centre of mass, which for a uniform stick is its middle, not an end.
        - |
          Gravity is drawn as one arrow at the centre of mass; two equal end arrows would in any case give opposite torques that cancel, not add.
        - |
          The centre of mass of a uniform stick is at its 50 cm mark, not at either end.
        - |
          Correct. The uniform stick's centre of mass is at 50 cm, directly over the knife edge, so its weight's line of action passes through the axis: lever arm zero, torque zero.
      answer: 3
    - slug: apphys1-u05-w20-q04
      type: multiple_choice
      topic_code: "5.3"
      source: "AP Physics 1 CED, Topic 5.3"
      points: 1
      stimulus: |
        A lab group rests a uniform 0.12 kg metre stick on a knife edge at its 50 cm mark, so the stick can turn about that point. They hang a 0.200 kg mass from the 20 cm mark and a 0.100 kg mass from the 90 cm mark, and hold the stick level for an instant before letting go. The 0 cm end is on the left as they look at it; counterclockwise is positive. Use g = 9.8 m/s².
      prompt: |
        The group wants to hang one extra 0.050 kg mass so that the net torque about the knife edge is zero. Where should they hang it?
      options:
        - "At the 10 cm mark"
        - "At the 90 cm mark"
        - "At the 70 cm mark"
        - "At the 50 cm mark"
      option_explanations:
        - |
          The 10 cm mark is left of the pivot, so the extra mass would add more counterclockwise torque instead of cancelling it.
        - |
          Correct. It must supply −0.196 N·m: d = 0.196/(0.050 × 9.8) = 0.40 m to the right of the pivot, which is the 90 cm mark.
        - |
          At 70 cm (0.20 m right) the extra mass gives only −0.098 N·m, half of what is needed.
        - |
          A mass hung at the pivot has zero lever arm and changes no torque.
      answer: 1
    # ---- Independent items
    - slug: apphys1-u05-w20-q05
      type: multiple_choice
      topic_code: "5.3"
      source: "AP Physics 1 CED, Topic 5.3"
      points: 1
      prompt: |
        A student pulls with 25 N on the free end of a 0.40 m lever, which turns about a pivot at its other end. Her pull makes an angle of 40° with the lever. What is the magnitude of the torque about the pivot?
      options:
        - "10 N·m"
        - "7.7 N·m"
        - "3.2 N·m"
        - "6.4 N·m"
      option_explanations:
        - |
          10 N·m = rF treats the pull as perpendicular to the lever; only the perpendicular component F sin 40° turns it.
        - |
          7.7 N·m uses cos 40°, which gives the component along the lever; that component pulls on the pivot and does not turn the lever.
        - |
          3.2 N·m uses half the lever's length, as if the force acted at the middle; r is measured to where the pull is applied, the free end.
        - |
          Correct. τ = rF sin θ = (0.40 m)(25 N)(sin 40°) = 6.4 N·m.
      answer: 3
    - slug: apphys1-u05-w20-q06
      type: multiple_choice
      topic_code: "5.3"
      source: "AP Physics 1 CED, Topic 5.3"
      points: 1
      prompt: |
        Four pushes are tried, one at a time, on a door hinged along one edge. Which produces the largest torque about the hinge line?
      options:
        - "30 N, perpendicular to the door, 0.80 m from the hinges"
        - "50 N, perpendicular to the door, 0.40 m from the hinges"
        - "60 N at 0.80 m from the hinges, directed at 20° to the door's surface"
        - "100 N at the handle, directed along the door straight toward the hinges"
      option_explanations:
        - |
          Correct. τ = (0.80)(30) = 24 N·m, larger than the others: 20 N·m, 16 N·m and 0.
        - |
          τ = (0.40)(50) = 20 N·m. The larger force acts at half the distance, which more than offsets it.
        - |
          τ = (0.80)(60)(sin 20°) ≈ 16 N·m; a push nearly along the door has a small perpendicular component.
        - |
          A push aimed straight at the hinge line has a line of action through the axis, so its lever arm and torque are zero.
      answer: 0
    - slug: apphys1-u05-w20-q07
      type: multiple_choice
      topic_code: "5.3"
      source: "AP Physics 1 CED, Topic 5.3"
      points: 1
      prompt: |
        A 40 N force acts on a flat plate at a point 0.50 m from the plate's pivot. The force's line of action passes 0.15 m from the pivot. What is the magnitude of the torque about the pivot?
      options:
        - "20 N·m"
        - "270 N·m"
        - "6.0 N·m"
        - "0, because the force is not perpendicular to the line from the pivot"
      option_explanations:
        - |
          20 N·m uses r = 0.50 m as if the force were perpendicular to r; the lever arm is the perpendicular distance to the line of action, 0.15 m.
        - |
          270 comes from dividing the force by the lever arm (40/0.15); torque is a product, r⊥F.
        - |
          Correct. τ = r⊥F = (0.15 m)(40 N) = 6.0 N·m. (Equivalently r sin θ = 0.15 m.)
        - |
          A force at an angle still exerts a torque unless its line of action passes through the pivot; here it misses by 0.15 m.
      answer: 2
    - slug: apphys1-u05-w20-q08
      type: multiple_choice
      topic_code: "5.3"
      source: "AP Physics 1 CED, Topic 5.3"
      points: 1
      prompt: |
        A force applied to the end of a wrench is perpendicular to the handle. The force is then made three times as large and its direction changed so that it makes 30° with the handle, still applied at the end. By what factor does the torque change?
      options:
        - "It becomes 3 times as large."
        - "It becomes 1.5 times as large."
        - "It becomes 2.6 times as large."
        - "It becomes 0.5 times as large."
      option_explanations:
        - |
          Tripling the force alone would triple the torque, but the new angle keeps only sin 30° = 0.5 of it.
        - |
          Correct. τ = rF sin θ. New/old = (3F sin 30°)/(F sin 90°) = 3 × 0.5 = 1.5.
        - |
          2.6 = 3 cos 30° uses cosine; with θ the angle between handle and force, the torque goes as sin θ.
        - |
          0.5 accounts for the angle but forgets that the force tripled.
      answer: 1
    - slug: apphys1-u05-w20-q09
      type: multiple_choice
      topic_code: "5.3"
      source: "AP Physics 1 CED, Topic 5.3"
      points: 1
      prompt: |
        A driver turns a steering wheel of radius 0.19 m with two hands on opposite sides of the rim. Each hand pushes with 15 N along the rim's direction, one up and one down, so both turn the wheel the same way. What are the net force and the net torque that the hands exert on the wheel?
      options:
        - "Net force 0; net torque 5.7 N·m"
        - "Net force 30 N; net torque 5.7 N·m"
        - "Net force 0; net torque 0"
        - "Net force 0; net torque 2.9 N·m"
      option_explanations:
        - |
          Correct. The forces are equal and opposite, so they cancel as forces, but both turn the wheel the same way: Στ = 2(0.19)(15) = 5.7 N·m. This is a couple.
        - |
          The two forces point in opposite directions, so their vector sum is zero, not 30 N.
        - |
          Opposite forces along different lines do not cancel as torques: each one turns the wheel in the same direction.
        - |
          2.9 N·m counts only one hand; both hands contribute equal torques in the same direction.
      answer: 0
    - slug: apphys1-u05-w20-q10
      type: multiple_choice
      topic_code: "5.1"
      source: "AP Physics 1 CED, Topic 5.1"
      points: 1
      prompt: |
        A pottery wheel speeds up steadily from 4.0 rad/s to 10 rad/s in 3.0 s. Through what angle does it turn in that time?
      options:
        - "30 rad"
        - "12 rad"
        - "21 rad"
        - "9.0 rad"
      option_explanations:
        - |
          30 rad = 10 × 3.0 uses the final angular speed for the whole interval; the wheel was slower at the start.
        - |
          12 rad = 4.0 × 3.0 uses the initial angular speed only and ignores the speeding up.
        - |
          Correct. With constant α, Δθ = ½(ω₀ + ω)t = ½(4.0 + 10)(3.0) = 21 rad.
        - |
          9.0 rad = ½αt² with α = 2.0 rad/s² is the extra angle from speeding up; it leaves out ω₀t = 12 rad.
      answer: 2
    - slug: apphys1-u05-w20-q11
      type: multiple_choice
      topic_code: "5.2"
      source: "AP Physics 1 CED, Topic 5.2"
      points: 1
      prompt: |
        A small motor pulley of radius 0.020 m turns at 150 rad/s. A belt, which does not slip, connects it to a pulley of radius 0.10 m. What is the angular speed of the larger pulley?
      options:
        - "750 rad/s"
        - "150 rad/s"
        - "6.0 rad/s"
        - "30 rad/s"
      option_explanations:
        - |
          750 rad/s multiplies by the radius ratio the wrong way; the larger pulley must turn more slowly.
        - |
          Pulleys share ω only on a common axle. Belted pulleys share rim speed, not angular speed.
        - |
          6.0 rad/s uses the square of the radius ratio; the rim speeds are equal, so ω scales with 1/r, not 1/r².
        - |
          Correct. The belt gives both rims the same speed: v = (0.020)(150) = 3.0 m/s, so ω = 3.0/0.10 = 30 rad/s.
      answer: 3
    - slug: apphys1-u05-w20-q12
      type: multiple_choice
      topic_code: "2.1"
      source: "AP Physics 1 CED, Topic 2.1"
      points: 1
      prompt: |
        A light rod 1.0 m long has a 2.0 kg ball fixed at one end and a 3.0 kg ball fixed at the other. How far from the 2.0 kg ball is the system's centre of mass?
      options:
        - "0.40 m"
        - "0.60 m"
        - "0.50 m"
        - "3.0 m"
      option_explanations:
        - |
          0.40 m is the distance from the 3.0 kg ball; measured from the 2.0 kg ball the centre of mass is 0.60 m away, nearer the heavier ball.
        - |
          Correct. With x = 0 at the 2.0 kg ball, x_cm = (2.0 × 0 + 3.0 × 1.0)/(2.0 + 3.0) = 0.60 m, closer to the heavier ball.
        - |
          The midpoint is the centre of mass only when the two masses are equal.
        - |
          3.0 is Σmx in kg·m; it must be divided by the total mass, 5.0 kg.
      answer: 1
    - slug: apphys1-u05-w20-q13
      type: multiple_choice
      topic_code: "1.5"
      source: "AP Physics 1 CED, Topic 1.5"
      points: 1
      prompt: |
        A student drags a sled with a rope that pulls with 50 N at 37° above the horizontal. What is the horizontal component of the rope's force?
      options:
        - "30 N"
        - "50 N"
        - "40 N"
        - "63 N"
      option_explanations:
        - |
          30 N = 50 sin 37° is the vertical component; the horizontal component uses the cosine of the angle from the horizontal.
        - |
          50 N is the whole force; part of it points upward, so the horizontal component is smaller.
        - |
          Correct. F_x = F cos θ = 50 cos 37° ≈ 40 N.
        - |
          63 N = 50/cos 37° divides by the cosine; a component is never larger than the vector itself.
      answer: 2
    - slug: apphys1-u05-w20-q14
      type: multi_select
      topic_code: "5.3"
      source: "AP Physics 1 CED, Topic 5.3"
      points: 2
      partial_credit: true
      prompt: |
        A classroom door is hinged along its left edge. Which of these horizontal forces, each applied alone, exert zero torque about the hinge line? Select all that apply.
      options:
        - "A 50 N push applied right at the hinges"
        - "A 50 N push at the handle, directed along the door straight toward the hinges"
        - "A 20 N push perpendicular to the door at its midpoint"
        - "A 20 N push at the handle, directed at 45° to the door's surface"
        - "A 50 N pull at the handle, directed along the door straight away from the hinges"
      option_explanations:
        - |
          Correct. Applied at the axis, r = 0, so τ = 0.
        - |
          Correct. Its line of action passes through the hinge line, so the lever arm is zero.
        - |
          Perpendicular at the midpoint gives τ = r(20 N) with r about half the door's width: not zero.
        - |
          At 45° the force has a perpendicular component F sin 45° ≈ 14 N acting at the handle, so the torque is not zero.
        - |
          Correct. Pulling straight away from the hinges also has a line of action through the axis: zero lever arm.
      answer: [0, 1, 4]
    - slug: apphys1-u05-w20-q15
      type: multi_select
      topic_code: "5.3"
      source: "AP Physics 1 CED, Topic 5.3"
      points: 2
      partial_credit: true
      prompt: |
        A cyclist cannot loosen a bolt by pushing on the end of a short wrench at 45° to the handle. Which changes, each made alone, increase the torque she applies to the bolt? Select all that apply.
      options:
        - "Using a wrench with a longer handle and pushing at its end at the same angle"
        - "Pushing perpendicular to the handle instead of at 45°"
        - "Pushing with the same force closer to the bolt"
        - "Pushing harder at the same point and angle"
        - "Pushing along the length of the handle toward the bolt"
      option_explanations:
        - |
          Correct. τ = rF sin θ grows in proportion to r.
        - |
          Correct. sin 90° = 1 is larger than sin 45° ≈ 0.71, so the torque grows by about 41%.
        - |
