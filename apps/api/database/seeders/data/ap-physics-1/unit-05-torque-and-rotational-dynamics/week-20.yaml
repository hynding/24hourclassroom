      prompt: |
        A box rests on the floor of an elevator that is moving upward and slowing down. (a) Describe in words the free-body diagram of the box. (b) Is the normal force from the floor greater than, less than or equal to the box's weight? Justify your answer.
      answer: |
        (a) Two forces: a downward arrow labelled F_g (Earth's gravitational force on the box) and an upward arrow labelled F_N (the floor's normal force on the box). No "upward motion" force.
        (b) Less. The box moves up but is slowing, so its acceleration points down, and so must the net force: F_g − F_N = ma, so F_N = m(g − a), which is less than mg.
