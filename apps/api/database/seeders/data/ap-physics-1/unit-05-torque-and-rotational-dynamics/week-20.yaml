        True or false: A student carries a box across a level hallway at constant velocity, holding it at a constant height. The upward force her hands exert on the box does no work on the box.
      answer: true
      explanation: |
        True. Work is W = Fd cos θ, and the upward force is perpendicular to the horizontal displacement (θ = 90°), so W = 0. A force can push hard and still do no work, just as a force aimed through an axis can be large and still exert no torque: in both cases only a particular component counts.
