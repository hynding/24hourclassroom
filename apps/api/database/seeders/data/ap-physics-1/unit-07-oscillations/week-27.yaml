week: 27
unit: 7
title: "Simple Harmonic Motion: Definition, Frequency and Period"
topics: ["7.1", "7.2"]
guide: guides/week-27.md
guide_description: |
  What makes a motion simple harmonic (a restoring force toward equilibrium, proportional to the displacement),
  the net force, acceleration and speed at equilibrium and at the turning points, why a pendulum is simple
  harmonic only for small angles, and the period and frequency of a mass on a spring and of a simple pendulum,
  with functional dependence, limiting cases and linearising period data. Worked examples: a 0.50 kg cart on a
  25 N/m spring as a force table, how small "small angle" is for a 0.80 m pendulum, a 0.30 kg cart on a 12 N/m
  spring with its mass quadrupled, a 2.0 s pendulum clock taken to the Moon, and a 0.40 kg mass on a hanging
  20 N/m spring.
flashcards_description: |
  30 cards on simple harmonic motion: the restoring-force condition, equilibrium and amplitude, force and
  acceleration at the turning points, the small-angle pendulum, the mass–spring and pendulum period equations,
  what does and does not change a period, hanging springs, linearising period data, and three error-spot cards.

flashcards:
  - front: Simple harmonic motion → the force condition
    back: |
      The net force always points toward the equilibrium position and is proportional to the displacement from it: F_net = −kx.
    topic_code: "7.1"
  - front: Minus sign in F_s = −kx for an oscillating cart → what it tells you
    back: |
      The spring force is opposite to the displacement: displaced right, pushed left; displaced left, pushed right. It always points back toward equilibrium.
    topic_code: "7.1"
  - front: Equilibrium position of an oscillator → definition
    back: |
      The position where the net force on the object is zero. It is the centre of the oscillation, and where the speed is greatest.
    topic_code: "7.1"
  - front: Amplitude of an oscillating cart → definition
    back: |
      The maximum displacement from equilibrium, A. It is always positive; the cart moves between x = −A and x = +A.
    topic_code: "7.1"
  - front: Mass–spring oscillator at a turning point (x = ±A) → velocity, acceleration, net force
    back: |
      Velocity zero (momentarily at rest); acceleration and net force largest in size, pointing toward equilibrium.
    topic_code: "7.1"
  - front: Mass–spring oscillator passing through equilibrium → velocity, acceleration, net force
    back: |
      Speed largest; acceleration zero; net force zero.
    topic_code: "7.1"
  - front: Acceleration of a mass on a spring in terms of x → expression
    back: |
      a = −(k/m)x: proportional to the displacement and opposite to it (Newton's second law applied to F_s = −kx).
    topic_code: "7.1"
  - front: Graph of restoring force against displacement for SHM → shape
    back: |
      A straight line through the origin with negative slope; for a spring the slope is −k.
    topic_code: "7.1"
  - front: Ball bouncing elastically on a floor → is it SHM?
    back: |
      No. It is periodic, but in the air it feels a constant gravitational force, not a force proportional to its displacement from a centre.
    topic_code: "7.1"
  - front: Ball rolling in a V-shaped trough → is it SHM?
    back: |
      No. The force down each side has a constant size, so it is not proportional to the displacement. A ball in a round bowl, moving a small distance, is close to SHM.
    topic_code: "7.1"
  - front: Free-body diagram of a pendulum bob pulled aside by θ → the arrows
    back: |
      Tension F_T along the string toward the pivot, weight F_g = mg straight down. The weight's component mg sin θ along the arc is the restoring force.
    topic_code: "7.1"
  - front: Small-angle approximation for a pendulum → what it says and why it matters
    back: |
      For small θ (below about 15°), sin θ ≈ θ in radians, so the restoring force mg sin θ ≈ mg(s/L) is proportional to the arc displacement s: approximately SHM.
    topic_code: "7.1"
  - front: Pendulum swinging through 60° → SHM or not?
    back: |
      Periodic but not simple harmonic: sin 60° = 0.866 while 60° = 1.047 rad, so the restoring force is far from proportional (about 21% off) and the period is longer than 2π√(L/g).
    topic_code: "7.1"
  - front: Period and frequency of an oscillator → definitions and link
    back: |
      Period T: seconds per full cycle. Frequency f: cycles per second (Hz). T = 1/f.
    topic_code: "7.2"
  - front: Playground swing, 12 full swings in 30 s → period and frequency
    back: |
      T = 30/12 = 2.5 s; f = 1/2.5 = 0.40 Hz.
    topic_code: "7.2"
  - front: Mass on a spring → period equation
    back: |
      T_s = 2π√(m/k), with m in kg and k in N/m. More mass, longer period; stiffer spring, shorter period.
    topic_code: "7.2"
  - front: Simple pendulum at small angles → period equation
    back: |
      T_p = 2π√(L/g), with L from the pivot to the bob's centre. Longer string, longer period; stronger gravity, shorter period.
    topic_code: "7.2"
  - front: 0.30 kg cart on a 12 N/m spring → period
    back: |
      T = 2π√(0.30/12) ≈ 0.99 s, so f ≈ 1.0 Hz.
    topic_code: "7.2"
  - front: Mass on a spring quadrupled → effect on period
    back: |
      T ∝ √m, so the period doubles.
    topic_code: "7.2"
  - front: Spring constant quadrupled, same mass → effect on period
    back: |
      T ∝ 1/√k, so the period halves.
    topic_code: "7.2"
  - front: Pendulum bob replaced by one with twice the mass → effect on period
    back: |
      None. The restoring force mg sin θ and the inertia both double, so the mass cancels, just as all objects fall with the same acceleration.
    topic_code: "7.2"
  - front: Pendulum length multiplied by 9 → effect on period
    back: |
      T ∝ √L, so the period triples.
    topic_code: "7.2"
  - front: Ideal oscillator pulled out twice as far → effect on period
    back: |
      None. Twice the distance to cover, but twice the restoring force at every point; the effects cancel. (For a pendulum this holds at small angles.)
    topic_code: "7.2"
  - front: Pendulum clock and mass–spring clock taken to the Moon (g = 1.6 m/s²) → which keeps time?
    back: |
      The mass–spring clock: its period has no g in it. The pendulum's period grows by √(9.8/1.6) ≈ 2.5, so that clock runs slow.
    topic_code: "7.2"
  - front: Pendulum with a 2.0 s period on Earth → its length
    back: |
      L = g(T/2π)² = 9.8 × (2.0/2π)² ≈ 0.99 m.
    topic_code: "7.2"
  - front: Hanging spring with mass m → equilibrium stretch and period
    back: |
      Stretch Δy₀ = mg/k; period still 2π√(m/k). Gravity shifts the centre of the oscillation but does not change the period.
    topic_code: "7.2"
  - front: Spring period data (T for several m) → what to graph for a straight line
    back: |
      T² against m: a line through the origin with slope 4π²/k, so k = 4π²/slope.
    topic_code: "7.2"
  - front: Error-spot → "the acceleration is zero at the end of the swing because the bob stops there"
    back: |
      Zero velocity does not mean zero acceleration. At a turning point the restoring force, and so the acceleration, is at its largest, pointing back toward equilibrium.
    topic_code: "7.1"
  - front: Error-spot → "the heavier child on the swing will swing back and forth more slowly"
    back: |
      A swing is a pendulum, and a pendulum's period does not depend on the mass: T = 2π√(L/g). Only the length and g matter.
    topic_code: "7.2"
  - front: Error-spot → "T = 2π√(g/L), so a longer pendulum swings faster"
    back: |
      Inverted. T = 2π√(L/g): a longer pendulum has a longer period. Check units: √(m ÷ m/s²) = s.
    topic_code: "7.2"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 7.1 and 7.2: the restoring-force condition for
    simple harmonic motion, force and acceleration at equilibrium and at the turning points, the small-angle
    pendulum, and the periods of a mass on a spring and of a simple pendulum), with 8 questions (32%) reviewing
    earlier weeks (representing motion, Newton's second law, spring forces, circular motion, potential energy,
    rotational kinematics and satellite orbits). Opens with a shared-context set on a lab group's hanging-spring
    period data. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank
    items are matched automatically; the short answers and the long answer are graded by your teacher against the
    scoring notes. Use g = 9.8 m/s². Calculator and equation sheet allowed throughout.
  questions:
    # ---- Stimulus set: hanging-spring period lab (7.2)
    - slug: apphys1-u07-w27-q01
      type: multiple_choice
      topic_code: "7.2"
      source: "AP Physics 1 CED, Topic 7.2"
      points: 1
      stimulus: |
        A lab group hangs a spring from a clamp and attaches slotted masses to its lower end. For each mass they pull it about 3 cm below its equilibrium position, release it, and use a stopwatch to time 10 full oscillations.

        | Mass m (kg) | 0.100 | 0.200 | 0.300 | 0.400 | 0.500 |
        |---|---|---|---|---|---|
        | Time for 10 oscillations (s) | 5.01 | 6.98 | 8.63 | 9.90 | 11.14 |
      prompt: |
        The group wants a graph whose points fall on a straight line so they can find the spring constant from its slope. What should they graph?
      options:
        - "The period T on the vertical axis against the mass m"
        - "The period T on the vertical axis against 1/m"
        - "The square of the period, T², on the vertical axis against the mass m"
        - "The square of the period, T², on the vertical axis against 1/m"
      option_explanations:
        - |
          T = 2π√(m/k) makes T proportional to √m, so T against m curves (it rises ever more slowly), not a straight line.
        - |
          The period grows as the mass grows, but T against 1/m would fall as 1/m grows; the relation T ∝ √m does not make it linear.
        - |
          Correct. Squaring T = 2π√(m/k) gives T² = (4π²/k)m, so T² against m is a straight line through the origin with slope 4π²/k.
        - |
          This inverts the dependence: T² is proportional to m, not to 1/m, so this graph is a curve that falls as 1/m grows.
      answer: 2
    - slug: apphys1-u07-w27-q02
      type: multiple_choice
      topic_code: "7.2"
      source: "AP Physics 1 CED, Topic 7.2"
      points: 1
      stimulus: |
        A lab group hangs a spring from a clamp and attaches slotted masses to its lower end. For each mass they pull it about 3 cm below its equilibrium position, release it, and use a stopwatch to time 10 full oscillations.

        | Mass m (kg) | 0.100 | 0.200 | 0.300 | 0.400 | 0.500 |
        |---|---|---|---|---|---|
        | Time for 10 oscillations (s) | 5.01 | 6.98 | 8.63 | 9.90 | 11.14 |
      prompt: |
        The best-fit line of T² against m has a slope of 2.47 s²/kg. What is the spring constant?
      options:
        - "0.405 N/m"
        - "2.54 N/m"
        - "97.5 N/m"
        - "16.0 N/m"
      option_explanations:
        - |
          0.405 is 1/slope: it leaves out the 4π² in T² = (4π²/k)m.
        - |
          2.54 is 2π/slope: it uses 2π instead of 4π², forgetting that squaring the period equation squares the 2π too.
        - |
          97.5 is 4π² × slope: the slope equals 4π²/k, so k is 4π² divided by the slope, not multiplied by it.
        - |
          Correct. The slope is 4π²/k, so k = 4π²/2.47 ≈ 39.48/2.47 ≈ 16.0 N/m.
      answer: 3
    - slug: apphys1-u07-w27-q03
      type: numeric
      topic_code: "7.2"
      source: "AP Physics 1 CED, Topic 7.2"
      points: 1
      stimulus: |
        A lab group hangs a spring from a clamp and attaches slotted masses to its lower end. For each mass they pull it about 3 cm below its equilibrium position, release it, and use a stopwatch to time 10 full oscillations.

        | Mass m (kg) | 0.100 | 0.200 | 0.300 | 0.400 | 0.500 |
        |---|---|---|---|---|---|
        | Time for 10 oscillations (s) | 5.01 | 6.98 | 8.63 | 9.90 | 11.14 |
      prompt: |
        Using k = 16.0 N/m, predict the time the group would measure for 10 oscillations with a 0.800 kg mass on the same spring. Give your answer in seconds, to three significant figures.
      answer: { value: 14.0, tolerance: 0.15 }
      explanation: |
        T = 2π√(m/k) = 2π√(0.800/16.0) = 2π√0.0500 ≈ 1.405 s, so 10 oscillations take about 14.0 s. (Check by scaling: 0.800 kg is 4 × 0.200 kg, so the time should be about 2 × 6.98 ≈ 14.0 s.)
    - slug: apphys1-u07-w27-q04
      type: multiple_choice
      topic_code: "7.2"
      source: "AP Physics 1 CED, Topic 7.2"
      points: 1
      stimulus: |
        A lab group hangs a spring from a clamp and attaches slotted masses to its lower end. For each mass they pull it about 3 cm below its equilibrium position, release it, and use a stopwatch to time 10 full oscillations.

        | Mass m (kg) | 0.100 | 0.200 | 0.300 | 0.400 | 0.500 |
        |---|---|---|---|---|---|
        | Time for 10 oscillations (s) | 5.01 | 6.98 | 8.63 | 9.90 | 11.14 |
      prompt: |
        The group repeats the 0.300 kg trial, this time pulling the mass 6 cm below equilibrium before releasing it. About how long should 10 oscillations take now?
      options:
        - "About 17.3 s, because the mass has twice as far to travel"
        - "About 8.6 s, because the period does not depend on the amplitude"
        - "About 12.2 s, because the period grows with the square root of the amplitude"
        - "About 4.3 s, because the larger spring force makes the mass move twice as fast"
      option_explanations:
        - |
          Twice the distance is only half the story: the restoring force is also twice as large at every point, so the speeds double and the time per cycle is unchanged.
        - |
          Correct. T = 2π√(m/k) contains no amplitude. Doubling the amplitude doubles both the distance and the restoring force, and the effects cancel, so 10 oscillations still take about 8.6 s.
        - |
          Amplitude does not appear in T = 2π√(m/k); the square root applies to the mass, not to the amplitude.
        - |
          The larger force does double the speeds, but the distance also doubles, so the period stays the same rather than halving.
      answer: 1
    # ---- Defining SHM (7.1)
    - slug: apphys1-u07-w27-q05
      type: multiple_choice
      topic_code: "7.1"
      source: "AP Physics 1 CED, Topic 7.1"
      points: 1
      prompt: |
        Which description of the net force on an object guarantees that the object moves in simple harmonic motion when displaced and released?
      options:
        - "A force of constant size that always points toward the equilibrium position"
        - "A force proportional to the displacement that points in the same direction as the displacement"
        - "A force proportional to the displacement that points toward the equilibrium position"
        - "A force proportional to the object's speed that points opposite to its velocity"
      option_explanations:
        - |
          A constant-size force toward the centre (like gravity on a bouncing ball or the slope of a V-shaped trough) gives a periodic motion, but not SHM: the force must grow with the displacement.
        - |
          A force along the displacement pushes the object farther away the farther it goes; there is no return to equilibrium, so no oscillation at all.
        - |
          Correct. SHM requires F_net = −kx: proportional to the displacement and directed back toward equilibrium.
        - |
          A force opposite the velocity and proportional to speed is a drag force; it slows motion down but does not pull the object back to a centre.
      answer: 2
    - slug: apphys1-u07-w27-q06
      type: multiple_choice
      topic_code: "7.1"
      source: "AP Physics 1 CED, Topic 7.1"
      points: 1
      prompt: |
        Which of these motions is best modelled as simple harmonic motion?
      options:
        - "A basketball dribbled straight up and down by a player standing still"
        - "A cart on a level, low-friction track, attached between two springs, oscillating back and forth"
        - "A runner going around a 400 m track at a steady speed, viewed from above"
        - "A pendulum released from 80° from the vertical"
      option_explanations:
        - |
          The ball repeats its motion, but in the air the only force is constant gravity, not a force proportional to displacement from a centre; it is periodic, not simple harmonic.
        - |
          Correct. When the cart is displaced, one spring pushes and the other pulls, giving a net force toward the centre proportional to the displacement: F_net = −(k₁ + k₂)x.
        - |
          The runner moves in a loop at constant speed. Seen from above that is circular motion, not a back-and-forth oscillation about an equilibrium position.
        - |
          At 80° the restoring force mg sin θ is far from proportional to θ (sin 80° ≈ 0.98, while 80° ≈ 1.40 rad), so the small-angle approximation fails.
      answer: 1
    - slug: apphys1-u07-w27-q07
      type: multiple_choice
      topic_code: "7.1"
      source: "AP Physics 1 CED, Topic 7.1"
      points: 1
      prompt: |
        A block on a frictionless table is attached to a spring and oscillates between x = −A and x = +A. At the instant the block is at x = +A, which statement is correct?
      options:
        - "Its velocity is zero and its acceleration is at its largest, directed toward x = 0."
        - "Its velocity is zero and its acceleration is zero."
        - "Its speed is at its largest and its acceleration is zero."
        - "Its velocity is zero and its acceleration is at its largest, directed away from x = 0."
      option_explanations:
        - |
          Correct. At a turning point the block is momentarily at rest, and the spring force −kA is at its largest size, pointing back toward equilibrium, so a = −(k/m)A.
        - |
          Zero velocity does not mean zero acceleration: the stretched spring still pulls hard on the block, and that force is at its largest here.
        - |
          This describes the block passing through equilibrium (x = 0), where the spring force is zero; at x = +A the block is at rest.
        - |
          The spring force is a restoring force: with the block at +A it points in the −x direction, toward equilibrium, not away from it.
      answer: 0
    # ---- Frequency and period (7.2)
    - slug: apphys1-u07-w27-q08
      type: multiple_choice
      topic_code: "7.2"
      source: "AP Physics 1 CED, Topic 7.2"
      points: 1
      prompt: |
        A student makes a pendulum from a 1.20 m string (measured from the pivot to the centre of the bob) and a steel nut, and sets it swinging through a small angle. What is its period?
      options:
        - "0.769 s"
        - "17.96 s"
        - "0.350 s"
        - "2.20 s"
      option_explanations:
        - |
          0.769 s is 2π(L/g) with the square root left out.
        - |
          17.96 s is 2π√(g/L): the ratio is inverted, which would make a longer pendulum swing faster.
        - |
          0.350 s is √(L/g) without the factor of 2π.
        - |
          Correct. T = 2π√(L/g) = 2π√(1.20/9.8) ≈ 2π × 0.350 ≈ 2.20 s.
      answer: 3
    - slug: apphys1-u07-w27-q09
      type: multiple_choice
      topic_code: "7.2"
      source: "AP Physics 1 CED, Topic 7.2"
      points: 1
      prompt: |
        A cart of mass m on a horizontal spring oscillates with period T. Three identical carts are stacked on top of it and strapped down, so the oscillating mass is 4m. The spring and amplitude are unchanged. What is the new period?
      options:
        - "2T"
        - "4T"
        - "T/2"
        - "T"
      option_explanations:
        - |
          Correct. T = 2π√(m/k), so T is proportional to √m; four times the mass gives √4 = 2 times the period.
        - |
          4T treats the period as proportional to the mass itself; the period depends on the square root of the mass.
        - |
          More mass means more inertia for the same spring force, so the cart moves more slowly and the period gets longer, not shorter.
        - |
          The mass does appear in the mass–spring period (unlike a pendulum's period), so adding mass changes T.
      answer: 0
    - slug: apphys1-u07-w27-q10
      type: multiple_choice
      topic_code: "7.2"
      source: "AP Physics 1 CED, Topic 7.2"
      points: 1
      prompt: |
        A simple pendulum has period T. A student replaces the bob with one of twice the mass and makes the string four times as long, keeping the swings small. What is the new period?
      options:
        - "T, because the mass and length changes cancel"
        - "4T"
        - "2T"
        - "2√2 T"
      option_explanations:
        - |
          The mass does not appear in T = 2π√(L/g), so there is nothing to cancel the effect of the longer string.
        - |
          4T treats the period as proportional to L; it is proportional to √L.
        - |
          Correct. Mass has no effect on a pendulum's period, and T ∝ √L, so four times the length gives twice the period.
        - |
          2√2 T also multiplies by √2 for the doubled mass, as if the mass mattered the way it does for a spring; for a pendulum it cancels.
      answer: 2
    - slug: apphys1-u07-w27-q11
      type: multi_select
      topic_code: "7.2"
      source: "AP Physics 1 CED, Topic 7.2"
      points: 2
      partial_credit: true
      prompt: |
        A cart attached to a horizontal spring oscillates on a level, frictionless track. Which changes would change its period? Select all that apply.
      options:
        - "Adding mass to the cart"
        - "Replacing the spring with a stiffer one"
        - "Pulling the cart farther from equilibrium before releasing it"
        - "Doing the experiment on the Moon, where g is smaller"
        - "Turning the track and spring vertical so the cart hangs from the spring"
      option_explanations:
        - |
          Correct. T = 2π√(m/k): more mass, longer period.
        - |
          Correct. A larger k makes the period shorter.
        - |
          The amplitude does not appear in T = 2π√(m/k); a larger amplitude gives larger speeds, not a different period.
        - |
          g does not appear in the mass–spring period; the spring supplies the restoring force on the Moon just as on Earth.
        - |
          Hanging the cart shifts the equilibrium position down by mg/k, but the net force is still −k times the displacement from the new equilibrium, so the period is unchanged.
      answer: [0, 1]
    - slug: apphys1-u07-w27-q12
      type: multi_select
      topic_code: "7.2"
      source: "AP Physics 1 CED, Topic 7.2"
      points: 2
      partial_credit: true
      prompt: |
        A simple pendulum swings through small angles. Which changes would change its period? Select all that apply.
      options:
        - "Lengthening the string"
        - "Using a bob with twice the mass"
        - "Taking the pendulum to the Moon"
        - "Increasing the release angle from 5° to 10°"
        - "Hanging it inside an elevator that moves upward at a constant speed"
      option_explanations:
        - |
          Correct. T = 2π√(L/g): a longer string gives a longer period.
        - |
          The mass cancels: a heavier bob feels a proportionally larger restoring force, so the period is unchanged.
        - |
          Correct. On the Moon g is smaller, so T = 2π√(L/g) is longer (about 2.5 times as long).
        - |
          Both angles are small enough for sin θ ≈ θ, so the period is independent of amplitude to within a fraction of a percent.
        - |
          An elevator moving at constant velocity is not accelerating, so the bob's free-body diagram and its period are the same as at rest (Newton's first law).
      answer: [0, 2]
    - slug: apphys1-u07-w27-q13
      type: true_false
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        True or false: On a position–time graph of an oscillating cart, the points where the curve reaches a peak or a trough are instants when the cart's velocity is zero.
      answer: true
      explanation: |
        True. Velocity is the slope of a position–time graph. At a peak or trough the curve is momentarily flat (slope zero), so the cart is momentarily at rest: these are the turning points x = ±A.
    - slug: apphys1-u07-w27-q14
      type: true_false
      topic_code: "2.8"
      source: "AP Physics 1 CED, Topic 2.8"
      points: 1
      prompt: |
        True or false: An ideal spring stretches 0.10 m when it exerts a 2.0 N force. When the same spring is stretched 0.30 m, it exerts a 6.0 N force.
      answer: true
      explanation: |
        True. Hooke's law, F_s = kΔx, gives k = 2.0 N / 0.10 m = 20 N/m, so at 0.30 m the force is 20 × 0.30 = 6.0 N. The force is proportional to the stretch, which is exactly the property that makes a mass on a spring oscillate in SHM.
    - slug: apphys1-u07-w27-q15
      type: fill_blank
      topic_code: "7.2"
      source: "AP Physics 1 CED, Topic 7.2"
      points: 1
      prompt: |
        A student replaces the 0.50 m string of a simple pendulum with a 2.00 m string, keeping the swings small. One word: the period of the pendulum ____.
      answer: ["doubles", "double", "is doubled", "doubled"]
      explanation: |
        T = 2π√(L/g), so T ∝ √L. The length is multiplied by 4, so the period is multiplied by √4 = 2: it doubles.
    - slug: apphys1-u07-w27-q16
      type: fill_blank
      topic_code: "2.9"
      source: "AP Physics 1 CED, Topic 2.9"
      points: 1
      prompt: |
        A horse on a carousel makes 12 complete revolutions in 60 s at a steady rate. The period of its circular motion is ____ s.
      answer: ["5", "5.0", "5.00", "five"]
      explanation: |
        Period = time per revolution = 60 s / 12 = 5.0 s (frequency 0.20 Hz). Period and frequency mean the same thing for an oscillator: time per cycle and cycles per second.
    - slug: apphys1-u07-w27-q17
      type: numeric
      topic_code: "7.2"
      source: "AP Physics 1 CED, Topic 7.2"
      points: 1
      prompt: |
        A 0.25 kg block attached to a spring with spring constant 40 N/m oscillates on a frictionless surface. What is its frequency of oscillation? Give your answer in hertz, to two decimal places.
      answer: { value: 2.01, tolerance: 0.02 }
      explanation: |
        T = 2π√(m/k) = 2π√(0.25/40) ≈ 0.497 s, so f = 1/T ≈ 2.01 Hz. (A common slip is to report √(k/m) ≈ 12.6, which is 2πf, not f.)
