    - slug: apphys1-u07-w27-q23
      type: short_answer
      topic_code: "7.1"
      source: "AP Physics 1 CED, Topic 7.1"
      points: 3
      prompt: |
        A small metal bob hangs on a light string of length L. It is pulled aside so the string makes an angle θ with the vertical, then released.

        (a) Describe a free-body diagram of the bob at the instant of release, naming each force and its direction.
        (b) Identify which force, or component of a force, acts as the restoring force, and write an expression for its size.
        (c) Explain why the pendulum's motion is close to simple harmonic when θ is small, but not when θ is large (for example 60°).
      answer: |
        (a) Two forces: the tension F_T, along the string toward the pivot, and the weight F_g = mg, straight down.
        (b) The component of the weight along the arc (perpendicular to the string), mg sin θ, pointing back toward the lowest point, is the restoring force. (At release the tension balances the other component, mg cos θ.)
        (c) The bob's displacement along the arc is s = Lθ. SHM needs a restoring force proportional to the displacement, that is proportional to θ. The force is proportional to sin θ, and for small θ, sin θ ≈ θ (in radians), so the force is approximately (mg/L)s: SHM. At 60°, sin θ = 0.87 while θ = 1.05 rad, so the force is far from proportional to the displacement and the motion, although periodic, is not simple harmonic.
      explanation: |
        Three points, one per part. (a) both forces with correct directions (tension along the string toward the pivot, weight vertically down); an extra "restoring force" arrow drawn as a separate force loses the point. (b) identifies the component of gravity along the arc, mg sin θ, directed toward the equilibrium position. (c) links SHM to a force proportional to displacement and uses sin θ ≈ θ for small angles, with a reason the approximation fails at large angles.
    - slug: apphys1-u07-w27-q24
      type: short_answer
      topic_code: "7.2"
      source: "AP Physics 1 CED, Topic 7.2"
      points: 3
      prompt: |
        A block on a horizontal spring oscillates with period T on a frictionless table. A student then hangs the same block from the same spring, vertically, and sets it oscillating. The student claims: "Now gravity also pulls on the block, so there is an extra force and the period will be shorter." Evaluate the claim. Your answer should identify where the block now oscillates about and use the net force on the block to support your conclusion.
      answer: |
        The claim is incorrect: the period is still T = 2π√(m/k). Hanging the block moves the equilibrium position down to where the spring force balances the weight, a stretch d = mg/k. If the block is a further distance y below this point, the spring force is k(d + y) upward and the weight mg = kd downward, so the net force is ky upward: −ky measured from the new equilibrium. That is the same force law as on the table, so the motion is SHM with the same period. Gravity only shifts the centre of the oscillation.
      explanation: |
        Three points. 1 point: states the period is unchanged (claim incorrect). 1 point: identifies the new equilibrium position, stretched by mg/k, where the spring force balances gravity. 1 point: shows or explains that the net force about the new equilibrium is still proportional to the displacement with the same k (gravity is constant, so it cancels part of the spring force at every position), so T = 2π√(m/k) is unchanged. Saying only "gravity is not in the equation" earns the first point only.
    - slug: apphys1-u07-w27-q25
      type: long_answer
      topic_code: "7.2"
      source: "AP Physics 1 CED, Topic 7.2"
      points: 6
      prompt: |
        Qualitative/quantitative translation. A playground swing hangs from chains 2.5 m long (measured from the top bar to the centre of the seat and rider). A 25 kg child swings through small angles and an older sibling times the period. Then their 75 kg parent sits on the same swing and swings through small angles. Model the swing and rider as a simple pendulum.

        (A) The sibling predicts: "Dad is three times as heavy, so gravity pulls him back three times as hard, and his swing will have a shorter period." Without equations, write a short paragraph that evaluates this prediction. Address both the restoring force on the parent and the parent's inertia.

        (B) Starting from the restoring force on the swing at a small angle, show that the swing's acceleration does not depend on the rider's mass. Then calculate the period of the swing for either rider.

        (C) The park wants a toddler swing whose period is 2.5 s. Calculate the chain length it needs, and state whether that is longer or shorter than the existing chains and why that makes sense.
      answer: |
        (A) The prediction is wrong. Gravity does pull the parent back about three times as hard as the child at the same angle, but the parent also has three times the inertia, so three times the force is needed just to give him the same acceleration. The two effects cancel: at every position on the arc the parent and child have the same acceleration, so they move together, cycle for cycle, and the period is the same. (This is the same reason a heavy and a light ball dropped together hit the ground together.)
        (B) At a small angle θ the restoring force is mg sin θ ≈ mgθ = mg(s/L), where s is the displacement along the arc. Newton's second law: ma = −mg(s/L), so a = −(g/L)s. The mass cancels, so the acceleration at each displacement is the same for any rider, and the motion is SHM. T = 2π√(L/g) = 2π√(2.5/9.8) ≈ 3.2 s for both riders.
        (C) L = g(T/2π)² = 9.8 × (2.5/2π)² ≈ 1.55 m, about 1.6 m. That is shorter than 2.5 m, which makes sense because a shorter pendulum has a shorter period (T ∝ √L), and 2.5 s is shorter than 3.2 s.
      explanation: |
        Six points.
        (A) 2 points: 1 for stating that the larger gravitational (restoring) force on the parent is matched by his proportionally larger inertia (mass), so his acceleration at each position is the same; 1 for concluding that the period is the same, so the prediction is wrong. A paragraph that only says "mass is not in the equation" earns at most 1 point.
        (B) 2 points: 1 for writing the restoring force as mg sin θ (or mgθ, or mg s/L) and applying Newton's second law so that m cancels, giving a = −(g/L)s or equivalent; 1 for T = 2π√(L/g) ≈ 3.2 s (accept 3.1 to 3.2 s). The derivation must agree with the argument in (A).
        (C) 2 points: 1 for L ≈ 1.55 m (accept 1.5 to 1.6 m) from L = g(T/2π)²; 1 for "shorter" with the reason that the period increases with length (T ∝ √L).
