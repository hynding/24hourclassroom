  # ---- Short answers
  - slug: apphys1-u07-exam-q39
    type: short_answer
    topic_code: "7.1"
    source: "AP Physics 1 CED, Topic 7.1"
    points: 3
    prompt: |
      A cart on a level, frictionless track is attached between two identical springs, each with spring constant 15 N/m; the other ends are fixed to posts at the two ends of the track. At equilibrium both springs are at their natural lengths. The cart is moved a distance x to the right.

      (a) Describe a free-body diagram of the cart, naming each horizontal force and its direction.
      (b) Write an expression for the net force on the cart in terms of x, and use it to explain why the cart will move in simple harmonic motion when released.
      (c) A student says that the cart behaves as if it were on a single spring of 15 N/m. Is the student correct? Explain.
    answer: |
      (a) Vertically, the weight F_g down and the normal force F_N up, equal in size. Horizontally: the left spring is stretched by x and pulls the cart to the left with force 15x; the right spring is compressed by x and pushes the cart to the left with force 15x.
      (b) F_net = −15x − 15x = −(30 N/m)x. The net force is proportional to the displacement and points back toward equilibrium (the minus sign), which is the condition for SHM. The same holds for a displacement to the left, where both forces point right.
      (c) No. Both springs push or pull the cart back, so it behaves like a single spring of 30 N/m. Its period, 2π√(m/30), is shorter than with one 15 N/m spring by a factor of √2.
    explanation: |
      Three points, one per part. (a) both horizontal spring forces pointing left (toward equilibrium), with the left spring pulling and the right spring pushing; drawing the two spring forces in opposite directions loses the point. (b) F_net = −30x (or −2kx) with the reasoning that a net force proportional to displacement and directed toward equilibrium gives SHM. (c) "not correct" with the effective spring constant of 30 N/m (or "the net force is twice as large at each displacement").
  - slug: apphys1-u07-exam-q40
    type: short_answer
    topic_code: "7.4"
    source: "AP Physics 1 CED, Topic 7.4"
    points: 3
    prompt: |
      A 0.20 kg mass is attached to the lower end of a vertical spring with spring constant 19.6 N/m. The mass is held at the position where the spring is unstretched and released from rest. It falls, stops 0.20 m lower, rises back, and oscillates about the point 0.10 m below the release point. Take the system to be the mass, the spring and Earth, and set U_g = 0 at the lowest point.

      Complete an energy bar chart, as a table, giving K, U_g and U_s in joules (a) at the release point, (b) at the equilibrium point 0.10 m below it, and (c) at the lowest point. Show that the total is the same in all three.
    answer: |
      (a) Release point (0.20 m above the lowest point, spring unstretched, at rest): K = 0, U_g = mgh = 0.20 × 9.8 × 0.20 = 0.392 J, U_s = 0. Total 0.392 J.
      (b) Equilibrium point (0.10 m above the lowest point, stretch 0.10 m): U_g = 0.20 × 9.8 × 0.10 = 0.196 J, U_s = ½ × 19.6 × (0.10)² = 0.098 J, so K = 0.392 − 0.196 − 0.098 = 0.098 J (speed about 0.99 m/s).
      (c) Lowest point (stretch 0.20 m, at rest): K = 0, U_g = 0, U_s = ½ × 19.6 × (0.20)² = 0.392 J. Total 0.392 J.
    explanation: |
      Three points, one per row: (a) U_g = 0.39 J with K = 0 and U_s = 0; (b) U_g ≈ 0.20 J, U_s ≈ 0.098 J and K ≈ 0.098 J; (c) U_s = 0.39 J with K = 0 and U_g = 0. Each row must total 0.39 J. Leaving U_g out of the chart (treating the spring as horizontal) earns at most 1 point.
  # ---- Free-response question 1: experimental design and analysis (10 points)
  - slug: apphys1-u07-exam-q41
    type: long_answer
    topic_code: "7.2"
    source: "AP Physics 1 CED, Topic 7.2"
    points: 10
    prompt: |
      Experimental design and analysis. A lab group wants to determine the gravitational field strength g in their classroom using a simple pendulum. They have string, a heavy metal bob, a clamp stand, a metre stick, a protractor and a stopwatch.

      (A) Describe a procedure the group could use to collect data that would let them determine g from a graph. Name the quantities to measure and the equipment used for each, and describe at least two steps that would reduce the uncertainty in their results.

      The group collects the following data.

      | Length L (m) | 0.30 | 0.50 | 0.70 | 0.90 | 1.10 |
      |---|---|---|---|---|---|
      | Time for 10 swings (s) | 11.04 | 14.16 | 16.82 | 19.01 | 21.07 |

      (B) Identify quantities that, when graphed, would give a straight line whose slope can be used to find g. Calculate and record the values to be graphed in a table.

      (C) The best-fit line for the quantities in (B) has a slope of 4.02 (in the units of your graph). Use the slope to calculate an experimental value for g, showing how the slope is related to g.

      (D) Another group measured every length from the pivot to the top of the bob instead of to its centre, making each length 0.02 m too short. Describe how this would affect their graph and whether it would change their value of g. Justify your answer.
    answer: |
      (A) Tie the bob to the string and hang it from the clamp. Measure the length L from the pivot to the centre of the bob with the metre stick. Pull the bob aside to a small angle (under about 10°, checked with the protractor) and release it. Use the stopwatch to time 10 complete swings and divide by 10 to get T. Repeat for at least five different lengths. To reduce uncertainty: time many swings rather than one (reaction time is a smaller fraction of the total); repeat each timing several times and average; start timing as the bob passes the lowest point, where it moves fastest and its position is clearest; keep the angle small so the period equation applies.
      (B) Graph T² (vertical) against L (horizontal), because T = 2π√(L/g) gives T² = (4π²/g)L, a straight line through the origin.
      | L (m) | 0.30 | 0.50 | 0.70 | 0.90 | 1.10 |
      |---|---|---|---|---|---|
      | T (s) | 1.104 | 1.416 | 1.682 | 1.901 | 2.107 |
      | T² (s²) | 1.22 | 2.01 | 2.83 | 3.61 | 4.44 |
      (C) The slope is 4π²/g, so g = 4π²/slope = 39.5/4.02 ≈ 9.8 m/s² (the slope's unit is s²/m).
      (D) Every L is 0.02 m too small, so each point shifts 0.02 m to the left and the line no longer passes through the origin: it has a positive T² intercept of about (4π²/g)(0.02) ≈ 0.08 s² (equivalently a horizontal intercept at L = −0.02 m). The slope is unchanged, because the error is the same constant amount at every length, so the value of g from the slope is unaffected.
    explanation: |
      Ten points.
      (A) 4 points: 1 for measuring L (pivot to centre of bob) with the metre stick and changing it over several values; 1 for measuring the period with the stopwatch by timing several swings and dividing; 1 for keeping the release angle small (protractor), so the small-angle period applies; 1 for a further valid step to reduce uncertainty (repeating and averaging trials, timing from the lowest point, more lengths over a wider range). Varying the mass instead of the length earns no first point.
      (B) 2 points: 1 for choosing T² against L (or L against T², or T against √L) with a reason from T = 2π√(L/g); 1 for correct values in a table (T² to within 0.02 s² of 1.22, 2.01, 2.83, 3.61, 4.44).
      (C) 2 points: 1 for relating the slope to g (slope = 4π²/g, or g = 4π²/slope for T² against L; slope = g/4π² for L against T²); 1 for g ≈ 9.8 m/s² (accept 9.7 to 9.9 m/s²) with units.
      (D) 2 points: 1 for stating that the line shifts (non-zero intercept) but the slope is unchanged; 1 for concluding that g is unaffected, because a constant offset in L does not change the slope. Saying g would be too large or too small earns 0 for the second point.
  # ---- Free-response question 2: mathematical routines (10 points)
  - slug: apphys1-u07-exam-q42
    type: long_answer
    topic_code: "7.4"
    source: "AP Physics 1 CED, Topic 7.4"
    points: 10
    prompt: |
      Mathematical routines. A cart of mass M = 0.60 kg rests at its equilibrium position on a level, frictionless track, attached to a horizontal spring with spring constant k = 30 N/m. A ball of clay of mass m = 0.20 kg slides along the track at v₀ = 3.0 m/s, hits the cart and sticks to it. The cart and clay then oscillate together.

      (A) Derive an expression for the speed v of the cart and clay just after the collision, in terms of m, M and v₀. Calculate its value.

      (B) Derive an expression for the amplitude A of the oscillation in terms of m, M, k and v₀. Calculate its value.

      (C) Calculate the period of the oscillation.

      (D) In a second trial, the clay is replaced by a rubber ball of the same mass and speed, which bounces straight back off the cart instead of sticking. Without calculating, explain whether the amplitude of the cart's oscillation is greater than, less than or equal to the amplitude in (B), and whether its period is greater than, less than or equal to the period in (C).
    answer: |
      (A) The collision is quick, so the spring exerts no impulse during it, and momentum of the clay–cart system is conserved: mv₀ = (m + M)v, so v = mv₀/(m + M) = (0.20)(3.0)/0.80 = 0.75 m/s.
      (B) The collision happens at equilibrium, so after it all the system's energy is kinetic, and at the amplitude it is all spring potential energy: ½(m + M)v² = ½kA², so A = v√((m + M)/k) = (mv₀/(m + M))√((m + M)/k) = mv₀/√(k(m + M)). A = (0.20)(3.0)/√(30 × 0.80) = 0.60/4.90 ≈ 0.12 m.
      (C) T = 2π√((m + M)/k) = 2π√(0.80/30) ≈ 1.03 s.
      (D) The amplitude is greater. When the ball bounces back, its momentum changes by more than when it stops (it reverses direction), so it exerts a larger impulse on the cart, and the cart leaves equilibrium with a larger speed and more kinetic energy, all of which is stored at the amplitude, so the amplitude is larger. The period is less than in (C): the ball does not stay on the cart, so the oscillating mass is only M = 0.60 kg, and T = 2π√(M/k) is shorter.
    explanation: |
      Ten points.
      (A) 2 points: 1 for applying conservation of momentum to a perfectly inelastic collision, mv₀ = (m + M)v; 1 for v = 0.75 m/s. Using conservation of kinetic energy earns 0 for this part.
      (B) 3 points: 1 for setting the kinetic energy after the collision equal to ½kA² (not the clay's kinetic energy before the collision); 1 for a correct expression, A = v√((m + M)/k) or A = mv₀/√(k(m + M)); 1 for A ≈ 0.12 m (accept 0.12 to 0.13 m). Using ½mv₀² = ½kA² (0.24 m) earns at most the second point if the expression is otherwise consistent.
      (C) 2 points: 1 for using the combined mass 0.80 kg in T = 2π√(m/k); 1 for T ≈ 1.0 s (accept 1.02 to 1.03 s).
      (D) 3 points: 1 for "greater amplitude"; 1 for the justification that the bouncing ball undergoes a larger change in momentum, so it delivers a larger impulse and the cart gains more speed and energy; 1 for "shorter period" because the oscillating mass is now only the cart's. A correct claim without justification earns no credit for that claim.
