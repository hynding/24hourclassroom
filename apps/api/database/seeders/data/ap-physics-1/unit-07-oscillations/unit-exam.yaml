unit: 7
description: |
  42 questions · about 90 minutes · every topic of Unit 7 (7.1 to 7.4): the restoring-force condition for simple
  harmonic motion, the small-angle pendulum, the periods and frequencies of mass–spring systems and pendulums with
  functional dependence, position, velocity and acceleration graphs, tables and equations of SHM, and the energy
  of oscillators. Includes three shared-context sets (a five-question set on a block released on a horizontal
  spring, a four-question set on a motion-sensor table for a pendulum and a three-question set on a cart's energy
  table), select-all, true/false, fill-in-the-blank and numeric items, two short-answer questions (3 points each)
  and two free-response questions in the 2027 AP style (10 points each: an experimental design and analysis
  question on measuring g with a pendulum, and a mathematical routines question on a collision that starts an
  oscillation). Use g = 9.8 m/s². Calculator and equation sheet allowed throughout. Multiple choice, select-all,
  true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short
  answers and free-response questions are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: block on a horizontal spring (7.2, 7.1, 7.4, 7.3)
  - slug: apphys1-u07-exam-q01
    type: multiple_choice
    topic_code: "7.2"
    source: "AP Physics 1 CED, Topic 7.2"
    points: 1
    stimulus: |
      A 0.25 kg block rests on a frictionless table, attached to a horizontal spring with spring constant 64 N/m whose other end is fixed to a wall. A student pulls the block 0.080 m from its equilibrium position and releases it from rest at t = 0.
    prompt: |
      What is the period of the block's oscillation?
    options:
      - "2.5 s"
      - "0.025 s"
      - "0.39 s"
      - "100 s"
    option_explanations:
      - |
        2.5 is the frequency in hertz (1/0.39 s), not the period.
      - |
        0.025 s is 2π(m/k) with the square root left out.
      - |
        Correct. T = 2π√(m/k) = 2π√(0.25/64) = 2π/16 ≈ 0.39 s.
      - |
        100 s is 2π√(k/m): the ratio is inverted, which would make a heavier block oscillate faster.
    answer: 2
  - slug: apphys1-u07-exam-q02
    type: multiple_choice
    topic_code: "7.1"
    source: "AP Physics 1 CED, Topic 7.1"
    points: 1
    stimulus: |
      A 0.25 kg block rests on a frictionless table, attached to a horizontal spring with spring constant 64 N/m whose other end is fixed to a wall. A student pulls the block 0.080 m from its equilibrium position and releases it from rest at t = 0.
    prompt: |
      What is the size of the block's acceleration just after it is released?
    options:
      - "20 m/s²"
      - "5.1 m/s²"
      - "0 m/s², because the block starts from rest"
      - "1.3 m/s²"
    option_explanations:
      - |
        Correct. The spring force is kx = 64 × 0.080 = 5.12 N, so a = F/m = 5.12/0.25 ≈ 20 m/s², directed toward equilibrium. This is the largest acceleration in the motion.
      - |
        5.1 is the spring force in newtons; it must be divided by the 0.25 kg mass to give the acceleration.
      - |
        Starting from rest means zero velocity, not zero acceleration; the stretched spring pulls hardest at this instant.
      - |
        1.3 multiplies the spring force by the mass (5.12 × 0.25) instead of dividing by it.
    answer: 0
  - slug: apphys1-u07-exam-q03
    type: numeric
    topic_code: "7.4"
    source: "AP Physics 1 CED, Topic 7.4"
    points: 1
    stimulus: |
      A 0.25 kg block rests on a frictionless table, attached to a horizontal spring with spring constant 64 N/m whose other end is fixed to a wall. A student pulls the block 0.080 m from its equilibrium position and releases it from rest at t = 0.
    prompt: |
      What is the total mechanical energy of the block–spring system? Give your answer in joules, to two significant figures.
    answer: { value: 0.20, tolerance: 0.006 }
    explanation: |
      At release the block is at rest at x = A, so E = ½kA² = ½(64)(0.080)² ≈ 0.205 J, about 0.20 J. (kA² = 0.41 J forgets the ½.)
  - slug: apphys1-u07-exam-q04
    type: multiple_choice
    topic_code: "7.4"
    source: "AP Physics 1 CED, Topic 7.4"
    points: 1
    stimulus: |
      A 0.25 kg block rests on a frictionless table, attached to a horizontal spring with spring constant 64 N/m whose other end is fixed to a wall. A student pulls the block 0.080 m from its equilibrium position and releases it from rest at t = 0.
    prompt: |
      How fast is the block moving when it is 0.040 m from equilibrium?
    options:
      - "0.64 m/s, half its maximum speed"
      - "1.28 m/s"
      - "0.91 m/s"
      - "1.11 m/s"
    option_explanations:
      - |
        Speed does not fall in proportion to displacement. Halfway out, only a quarter of the energy is potential, so the speed is well above half the maximum.
      - |
        1.28 m/s is the maximum speed, A√(k/m) = 0.080 × 16, reached only at x = 0.
      - |
        0.91 m/s is v_max/√2, the speed when the energy is split evenly; that happens at x ≈ 0.057 m, not at 0.040 m.
      - |
        Correct. ½mv² = ½k(A² − x²), so v = √((64/0.25)(0.080² − 0.040²)) = 16 × √0.0048 ≈ 1.11 m/s.
    answer: 3
  - slug: apphys1-u07-exam-q05
    type: multiple_choice
    topic_code: "7.3"
    source: "AP Physics 1 CED, Topic 7.3"
    points: 1
    stimulus: |
      A 0.25 kg block rests on a frictionless table, attached to a horizontal spring with spring constant 64 N/m whose other end is fixed to a wall. A student pulls the block 0.080 m from its equilibrium position and releases it from rest at t = 0.
    prompt: |
      Where is the block, and how is it moving, half a period after it is released?
    options:
      - "At x = 0, moving at its maximum speed"
      - "At 0.080 m on the other side of equilibrium, momentarily at rest"
      - "Back at its release point, momentarily at rest"
      - "At 0.040 m from equilibrium, on the release side"
    option_explanations:
      - |
        The block reaches x = 0 after a quarter of a period, not half.
      - |
        Correct. Half a period after release from x = +A, x = A cos(π) = −A: the block is at the opposite turning point, 0.080 m on the other side, and momentarily at rest.
      - |
        The block returns to its release point after a full period, not half.
      - |
        Halving the time does not halve the displacement; at half a period the block is a full amplitude on the other side.
    answer: 1
  # ---- Stimulus set B: pendulum motion-sensor table (7.3, 7.2)
  - slug: apphys1-u07-exam-q06
    type: multiple_choice
    topic_code: "7.3"
    source: "AP Physics 1 CED, Topic 7.3"
    points: 1
    stimulus: |
      A lab group hangs a small, heavy bob from a string and sets it swinging through a small angle. A motion sensor beside it records the bob's horizontal position x, measured from its lowest point, starting at an instant when the bob passes through the lowest point:

      | t (s) | 0 | 0.25 | 0.50 | 0.75 | 1.00 | 1.25 | 1.50 | 1.75 | 2.00 |
      |---|---|---|---|---|---|---|---|---|---|
      | x (m) | 0.000 | 0.042 | 0.060 | 0.042 | 0.000 | −0.042 | −0.060 | −0.042 | 0.000 |
    prompt: |
      What are the amplitude and period of the bob's motion?
    options:
      - "Amplitude 0.060 m, period 2.00 s"
      - "Amplitude 0.120 m, period 2.00 s"
      - "Amplitude 0.060 m, period 1.00 s"
      - "Amplitude 0.042 m, period 0.50 s"
    option_explanations:
      - |
        Correct. The largest distance from the lowest point is 0.060 m; the bob passes x = 0 moving the same way at t = 0 and t = 2.00 s, so T = 2.00 s.
      - |
        0.120 m is the full distance from −0.060 m to +0.060 m (2A), not the amplitude.
      - |
        At t = 1.00 s the bob is back at x = 0 but moving the opposite way; one full period ends at 2.00 s.
      - |
        0.042 m is just a table entry, not the maximum, and 0.50 s is the time from the lowest point to a turning point (T/4).
    answer: 0
  - slug: apphys1-u07-exam-q07
    type: multiple_choice
    topic_code: "7.2"
    source: "AP Physics 1 CED, Topic 7.2"
    points: 1
    stimulus: |
      A lab group hangs a small, heavy bob from a string and sets it swinging through a small angle. A motion sensor beside it records the bob's horizontal position x, measured from its lowest point, starting at an instant when the bob passes through the lowest point:

      | t (s) | 0 | 0.25 | 0.50 | 0.75 | 1.00 | 1.25 | 1.50 | 1.75 | 2.00 |
      |---|---|---|---|---|---|---|---|---|---|
      | x (m) | 0.000 | 0.042 | 0.060 | 0.042 | 0.000 | −0.042 | −0.060 | −0.042 | 0.000 |
    prompt: |
      About how long is the pendulum, from the pivot to the centre of the bob?
    options:
      - "3.1 m"
      - "39 m"
      - "0.99 m"
      - "0.25 m"
    option_explanations:
      - |
        3.1 m is gT/(2π): the period must be squared when solving T = 2π√(L/g) for L.
      - |
        39 m is gT², leaving out the 4π²; that length would swing with a period of about 12.6 s.
      - |
        Correct. L = g(T/2π)² = 9.8 × (2.00/2π)² ≈ 0.99 m.
      - |
        0.25 m is the length for a 1.0 s period, as if the time from one zero crossing to the next were the full period.
    answer: 2
  - slug: apphys1-u07-exam-q08
    type: multiple_choice
    topic_code: "7.3"
    source: "AP Physics 1 CED, Topic 7.3"
    points: 1
    stimulus: |
      A lab group hangs a small, heavy bob from a string and sets it swinging through a small angle. A motion sensor beside it records the bob's horizontal position x, measured from its lowest point, starting at an instant when the bob passes through the lowest point:

      | t (s) | 0 | 0.25 | 0.50 | 0.75 | 1.00 | 1.25 | 1.50 | 1.75 | 2.00 |
      |---|---|---|---|---|---|---|---|---|---|
      | x (m) | 0.000 | 0.042 | 0.060 | 0.042 | 0.000 | −0.042 | −0.060 | −0.042 | 0.000 |
    prompt: |
      Of the following times, at which is the bob moving fastest?
    options:
      - "t = 0.50 s"
      - "t = 0.25 s"
      - "t = 1.50 s"
      - "t = 1.00 s"
    option_explanations:
      - |
        At t = 0.50 s the bob is at x = 0.060 m, a turning point, where it is momentarily at rest.
      - |
        At t = 0.25 s the bob is part way out and slowing down; it is faster at the lowest point.
      - |
        At t = 1.50 s the bob is at x = −0.060 m, the other turning point, momentarily at rest.
      - |
        Correct. At t = 1.00 s the bob passes x = 0, its lowest point, where all its energy is kinetic and the x–t curve is steepest.
    answer: 3
  - slug: apphys1-u07-exam-q09
    type: multiple_choice
    topic_code: "7.3"
    source: "AP Physics 1 CED, Topic 7.3"
    points: 1
    stimulus: |
      A lab group hangs a small, heavy bob from a string and sets it swinging through a small angle. A motion sensor beside it records the bob's horizontal position x, measured from its lowest point, starting at an instant when the bob passes through the lowest point:

      | t (s) | 0 | 0.25 | 0.50 | 0.75 | 1.00 | 1.25 | 1.50 | 1.75 | 2.00 |
      |---|---|---|---|---|---|---|---|---|---|
      | x (m) | 0.000 | 0.042 | 0.060 | 0.042 | 0.000 | −0.042 | −0.060 | −0.042 | 0.000 |
    prompt: |
      Which equation best models the bob's position?
    options:
      - "x = (0.060 m) cos(2π(0.50 Hz)t)"
      - "x = (0.060 m) sin(2π(0.50 Hz)t)"
      - "x = (0.060 m) sin(2π(2.0 Hz)t)"
      - "x = (0.120 m) sin(2π(0.50 Hz)t)"
    option_explanations:
      - |
        A cosine starts at its peak, x = +A, but the table starts at x = 0, so the sine form fits.
      - |
        Correct. The table starts at x = 0 and increases, the sine shape; A = 0.060 m and f = 1/T = 1/2.00 s = 0.50 Hz. Check: at t = 0.50 s, x = 0.060 sin(π/2) = 0.060 m.
      - |
        2.0 is the period in seconds; the frequency in the equation is 1/T = 0.50 Hz.
      - |
        0.120 m is twice the amplitude; the coefficient must be the maximum displacement, 0.060 m.
    answer: 1
  # ---- Stimulus set C: energy table for a cart on a spring (7.4)
  - slug: apphys1-u07-exam-q10
    type: numeric
    topic_code: "7.4"
    source: "AP Physics 1 CED, Topic 7.4"
    points: 1
    stimulus: |
      A cart oscillates on a horizontal spring on a frictionless track. Using a motion sensor and a force sensor, a student fills in an energy table for the cart–spring system at four positions on one side of equilibrium, but leaves one entry blank:

      | Position x (m) | 0 | 0.05 | 0.10 | 0.15 |
      |---|---|---|---|---|
      | U_s (J) | 0 | 0.050 | 0.200 | 0.450 |
      | K (J) | 0.450 | 0.400 | (blank) | 0 |
    prompt: |
      What is the total mechanical energy of the cart–spring system? Give your answer in joules, to two decimal places.
    answer: { value: 0.45, tolerance: 0.005 }
    explanation: |
      The total is the same in every column: at x = 0 it is 0 + 0.450 J, at x = 0.15 m it is 0.450 J + 0. So E = 0.45 J, and since K = 0 at x = 0.15 m, that position is the amplitude.
  - slug: apphys1-u07-exam-q11
    type: multiple_choice
    topic_code: "7.4"
    source: "AP Physics 1 CED, Topic 7.4"
    points: 1
    stimulus: |
      A cart oscillates on a horizontal spring on a frictionless track. Using a motion sensor and a force sensor, a student fills in an energy table for the cart–spring system at four positions on one side of equilibrium, but leaves one entry blank:

      | Position x (m) | 0 | 0.05 | 0.10 | 0.15 |
      |---|---|---|---|---|
      | U_s (J) | 0 | 0.050 | 0.200 | 0.450 |
      | K (J) | 0.450 | 0.400 | (blank) | 0 |
    prompt: |
      What is the spring constant of the spring?
    options:
      - "20 N/m"
      - "4.0 N/m"
      - "40 N/m"
      - "3.0 N/m"
    option_explanations:
      - |
        20 N/m is U_s/x² without the factor of 2: U_s = ½kx² gives k = 2U_s/x².
      - |
        4.0 N/m is 2U_s/x with x not squared (2 × 0.200/0.10); the potential energy depends on x².
      - |
        Correct. U_s = ½kx², so k = 2U_s/x² = 2(0.200)/(0.10)² = 40 N/m. Every column agrees: 2(0.450)/(0.15)² = 40 N/m.
      - |
        3.0 N/m is U_s/x at x = 0.15 m, treating energy as if it were force times displacement without the ½ and the square.
    answer: 2
  - slug: apphys1-u07-exam-q12
    type: multiple_choice
    topic_code: "7.4"
    source: "AP Physics 1 CED, Topic 7.4"
    points: 1
    stimulus: |
      A cart oscillates on a horizontal spring on a frictionless track. Using a motion sensor and a force sensor, a student fills in an energy table for the cart–spring system at four positions on one side of equilibrium, but leaves one entry blank:

      | Position x (m) | 0 | 0.05 | 0.10 | 0.15 |
      |---|---|---|---|---|
      | U_s (J) | 0 | 0.050 | 0.200 | 0.450 |
      | K (J) | 0.450 | 0.400 | (blank) | 0 |
    prompt: |
      What value belongs in the blank entry for K at x = 0.10 m?
    options:
      - "0.250 J"
      - "0.300 J, halfway between 0.400 J and 0.200 J"
      - "0.200 J, the same as U_s there"
      - "0.350 J, continuing the 0.050 J drop from the previous column"
    option_explanations:
      - |
        Correct. The total is 0.450 J everywhere, so K = 0.450 − 0.200 = 0.250 J.
      - |
        Averaging neighbouring entries does not follow from any physics; K must make the column add up to the constant total of 0.450 J.
      - |
        K and U_s are equal only at x = A/√2 ≈ 0.106 m; at 0.10 m they must add to 0.450 J, giving 0.250 J.
      - |
        The energies change with x², not in equal steps; the drop from 0.05 m to 0.10 m is larger (0.150 J) than from 0 to 0.05 m.
    answer: 0
  # ---- Defining SHM (7.1)
  - slug: apphys1-u07-exam-q13
    type: multiple_choice
    topic_code: "7.1"
    source: "AP Physics 1 CED, Topic 7.1"
    points: 1
    prompt: |
      A student claims that any motion that repeats itself at regular intervals is simple harmonic motion. Which observation shows the claim is false?
    options:
      - "A mass on a spring repeats its motion with a period that does not depend on its amplitude."
      - "A pendulum swinging through 5° repeats its motion every 1.4 s."
      - "A cart between two springs speeds up as it approaches the centre of the track."
      - "A ball bouncing elastically on a floor repeats its motion, but while in the air the only force on it is its constant weight."
    option_explanations:
      - |
        A mass on a spring is a genuine example of SHM, so it supports rather than refutes the idea that the motion is simple harmonic.
      - |
        A small-angle pendulum is approximately simple harmonic, so it is not a counterexample.
      - |
        Speeding up toward the centre is exactly what a restoring force does in SHM; this is consistent with SHM, not a counterexample.
      - |
        Correct. The bouncing ball is periodic, but its force in the air is constant rather than proportional to a displacement from equilibrium, so it is a repeating motion that is not SHM.
    answer: 3
  - slug: apphys1-u07-exam-q14
    type: multiple_choice
    topic_code: "7.1"
    source: "AP Physics 1 CED, Topic 7.1"
    points: 1
    prompt: |
      A graph of the horizontal force exerted by a spring on a cart (vertical axis) against the cart's displacement from equilibrium (horizontal axis) is a straight line through the origin, passing through (0.10 m, −3.0 N). Which statement is correct?
    options:
      - "The spring constant is −30 N/m, so the spring pushes the cart away from equilibrium."
      - "The spring constant is 30 N/m, and the force always points toward equilibrium."
      - "The spring constant is 0.033 N/m, and the force always points toward equilibrium."
      - "The spring constant is 3.0 N/m, the force at 0.10 m."
    option_explanations:
      - |
        The slope is −30 N/m, but k is the positive constant in F = −kx; the minus sign means the force points toward equilibrium, not away.
      - |
        Correct. The slope is −3.0 N / 0.10 m = −30 N/m = −k, so k = 30 N/m, and the negative slope means the force is opposite the displacement: a restoring force.
      - |
        0.033 is displacement over force, the reciprocal of the slope; k is force per unit displacement.
      - |
        3.0 N is the size of the force at one point, not the force per metre of displacement.
    answer: 1
  - slug: apphys1-u07-exam-q15
    type: multiple_choice
    topic_code: "7.1"
    source: "AP Physics 1 CED, Topic 7.1"
    points: 1
    prompt: |
      Which of these would most closely follow simple harmonic motion when given a small push?
    options:
      - "A marble rolling back and forth in a V-shaped trough with flat, straight sides"
      - "A hockey puck sliding back and forth between two rigid walls on frictionless ice"
      - "A marble rolling back and forth near the bottom of a round bowl"
      - "A child jumping repeatedly on a trampoline, spending most of each cycle in the air"
    option_explanations:
      - |
        On a straight-sided trough the force along each side has a constant size, not one proportional to the distance from the bottom.
      - |
        Between the walls the puck feels no force at all, and then a sudden force at each wall; nothing pulls it back in proportion to its displacement.
      - |
        Correct. Near the bottom of a round bowl, the component of gravity along the surface grows in proportion to the distance from the bottom, just like a pendulum at small angles.
      - |
        While the child is in the air the only force is constant gravity, so most of the cycle is projectile motion, not SHM.
    answer: 2
  - slug: apphys1-u07-exam-q16
    type: multiple_choice
    topic_code: "7.1"
    source: "AP Physics 1 CED, Topic 7.1"
    points: 1
    prompt: |
      A 0.30 kg mass is hung from a vertical spring with spring constant 12 N/m and allowed to come to rest. About which position will it oscillate if it is then pulled down and released?
    options:
      - "A position 0.25 m below the spring's unstretched end, where the spring force balances the weight"
      - "The spring's unstretched length, where the spring force is zero"
      - "A position 0.025 m below the spring's unstretched end"
      - "The lowest point it was pulled down to, where it was released"
    option_explanations:
      - |
        Correct. Equilibrium is where the net force is zero: kΔy = mg, so Δy = (0.30)(9.8)/12 ≈ 0.25 m. The mass oscillates symmetrically about this point.
      - |
        At the unstretched length the spring force is zero but gravity is not, so the net force is not zero there; that is not the equilibrium position.
      - |
        0.025 m is m/k with g left out; the stretch must balance the weight mg, not the mass.
      - |
        The release point is a turning point of the motion (x = −A), not its centre.
    answer: 0
  # ---- Frequency and period (7.2)
  - slug: apphys1-u07-exam-q17
    type: multiple_choice
    topic_code: "7.2"
    source: "AP Physics 1 CED, Topic 7.2"
    points: 1
    prompt: |
      A block on a spring oscillates with period T. The spring is replaced by one with twice the spring constant, and the block and amplitude are unchanged. What is the new period?
    options:
      - "2T"
      - "T/2"
      - "√2 T"
      - "T/√2"
    option_explanations:
      - |
        A stiffer spring pulls harder at each displacement, so the block moves faster and the period gets shorter, not longer.
      - |
        T/2 treats the period as inversely proportional to k; it is inversely proportional to √k.
      - |
        √2 T has the right factor but the wrong direction: a larger k makes the period shorter.
      - |
        Correct. T = 2π√(m/k), so T ∝ 1/√k; doubling k divides the period by √2.
    answer: 3
  - slug: apphys1-u07-exam-q18
    type: multiple_choice
    topic_code: "7.2"
    source: "AP Physics 1 CED, Topic 7.2"
    points: 1
    prompt: |
      A pendulum has period T on Earth. It is taken to a planet where the gravitational field is 4.9 m/s², half of Earth's. What is its period there?
    options:
      - "T/√2"
      - "√2 T"
      - "2T"
      - "T, because the length of the pendulum has not changed"
    option_explanations:
      - |
        A weaker gravitational field gives a weaker restoring force, so the pendulum swings more slowly, with a longer period.
      - |
        Correct. T = 2π√(L/g), so halving g multiplies T by √2 ≈ 1.41.
      - |
        2T treats the period as inversely proportional to g; it is inversely proportional to √g.
      - |
        g appears in the pendulum period, so changing the gravitational field changes the period even with the same length.
    answer: 1
  - slug: apphys1-u07-exam-q19
    type: multiple_choice
    topic_code: "7.2"
    source: "AP Physics 1 CED, Topic 7.2"
    points: 1
    prompt: |
      A diving board vibrates after a diver leaves it. A video shows the end of the board completing 15 full oscillations in 6.0 s. What is the frequency of the vibration?
    options:
      - "0.40 Hz"
      - "90 Hz"
      - "2.5 Hz"
      - "0.40 s"
    option_explanations:
      - |
        0.40 is time per oscillation (the period, in seconds); the frequency is oscillations per second.
      - |
        90 multiplies the number of oscillations by the time; frequency divides them.
      - |
        Correct. f = 15 oscillations / 6.0 s = 2.5 Hz (period 0.40 s).
      - |
        0.40 s is the period, a time, not a frequency.
    answer: 2
  - slug: apphys1-u07-exam-q20
    type: multiple_choice
    topic_code: "7.2"
    source: "AP Physics 1 CED, Topic 7.2"
    points: 1
    prompt: |
      A pendulum clock runs slow: it shows less time passing than really has. How should its pendulum be adjusted?
    options:
      - "Shorten the pendulum, to make its period shorter"
      - "Lengthen the pendulum, to make its period shorter"
      - "Use a heavier bob, so gravity pulls it back faster"
      - "Swing it through a smaller angle, to make its period shorter"
    option_explanations:
      - |
        Correct. A slow clock ticks too seldom, so its period is too long. T = 2π√(L/g), so a shorter pendulum has a shorter period and the clock speeds up.
      - |
        A longer pendulum has a longer period (T ∝ √L), which would make the clock even slower.
      - |
        The bob's mass cancels out of the period: the larger gravitational force is matched by the larger inertia.
