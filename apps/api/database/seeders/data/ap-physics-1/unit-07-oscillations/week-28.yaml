    - slug: apphys1-u07-w28-q24
      type: short_answer
      topic_code: "7.4"
      source: "AP Physics 1 CED, Topic 7.4"
      points: 3
      prompt: |
        Two identical pendulums are released from rest: pendulum 1 from 5° and pendulum 2 from 10°. Both angles are small. A student says: "Pendulum 2 moves faster at the bottom, so it must complete each swing in less time." Evaluate the claim. Use energy to compare the speeds at the bottom, and explain why the periods compare as they do.
      answer: |
        The first part is right but the conclusion is wrong. Pendulum 2 starts higher above its lowest point, so it has more gravitational potential energy at release, and all of it becomes kinetic energy at the bottom: mgh = ½mv², so its speed at the bottom is larger. But pendulum 2 also has a longer arc to cover. For small angles the restoring force is proportional to the displacement, so doubling the amplitude doubles the force and the speeds at every corresponding point, while also doubling the distance. The two effects cancel, and both pendulums have the same period, T = 2π√(L/g).
      explanation: |
        Three points. 1 point: uses energy (larger release height, more U_g converted to K) to conclude that pendulum 2 is faster at the bottom. 1 point: states that the periods are equal (claim incorrect). 1 point: justifies the equal periods: a larger amplitude means both a longer path and proportionally larger speeds, or the period T = 2π√(L/g) contains no amplitude for small-angle SHM. A bare "amplitude is not in the equation" earns the second point but not the third.
