      prompt: |
        True or false: For a mass oscillating in simple harmonic motion, the acceleration has its largest size at the same instants that the speed has its largest value.
      answer: false
      explanation: |
        False. The speed is largest at equilibrium (x = 0), where the net force and acceleration are zero. The acceleration is largest at the turning points (x = ±A), where the speed is zero. The two peaks are a quarter of a period apart.
