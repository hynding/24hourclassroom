        (C) A straight-sided graph would put K at half its maximum (0.20 J) at x = 0.10 m, but the bar chart shows 0.30 J there. K = ½k(A² − x²) depends on x², so the graph is an upside-down parabola: a smooth curve with a rounded top at x = 0 (0.40 J), falling slowly near the middle and more steeply toward x = ±0.20 m, where it reaches zero.
