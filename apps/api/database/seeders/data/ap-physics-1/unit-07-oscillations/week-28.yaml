        (B) 2 points: 1 for a correct energy equation leading to v = (√3/2)A√(k/m) or an equivalent such as v = √(3kA²/(4m)); 1 for v ≈ 0.87 m/s (accept 0.86 to 0.87 m/s) with a statement that it gives K ≈ 0.30 J, consistent with (A).
