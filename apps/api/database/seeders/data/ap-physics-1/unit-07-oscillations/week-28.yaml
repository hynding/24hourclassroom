      answer: |
        (A) Total energy E = ½kA² = ½(20)(0.20)² = 0.40 J.
        | Instant | K (J) | U_s (J) |
        |---|---|---|
        | x = 0.20 m | 0 | 0.40 |
        | x = 0.10 m | 0.30 | 0.10 |
        | x = 0 | 0.40 | 0 |
