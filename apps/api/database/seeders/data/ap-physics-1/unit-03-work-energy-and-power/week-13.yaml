        True or false: The gravitational potential energy of the Earth–Moon system, measured with zero at infinite separation, is a negative number.
      answer: true
      explanation: |
        True. U_G = −Gm₁m₂/r is negative at every finite separation, because positive work would be needed to pull the two attracting bodies apart to infinity, where U_G = 0.
