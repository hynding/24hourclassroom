        True or false: A hockey puck sliding at constant velocity across frictionless ice must have a forward force acting on it to keep it moving.
      answer: false
      explanation: |
        False. By Newton's first law, an object with zero net force keeps a constant velocity. The puck's weight and the normal force balance, and no forward force is needed. A forward force would make it speed up.
