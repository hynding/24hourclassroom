    - slug: apphys1-u03-w13-q21
      type: short_answer
      topic_code: "3.3"
      source: "AP Physics 1 CED, Topic 3.3"
      points: 3
      prompt: |
        A student drops a 0.50 kg ball from rest 2.0 m above the floor. Air resistance is negligible.

        (a) Choose the ball–Earth system. Describe the energy of the system at release and just before landing, and explain why no external work is done.
        (b) Now choose the ball alone as the system. Describe the energy at the same two instants and identify what transfers energy into the system.
        (c) Show that both descriptions predict the same speed just before landing, and give that speed.
      answer: |
        (a) At release the system has U_g = mgh = (0.50)(9.8)(2.0) = 9.8 J (floor as zero) and K = 0; just before landing U_g = 0 and K = 9.8 J. Gravity acts between two objects inside the system, so it is internal; no external force does work, and the total stays 9.8 J.
        (b) A single ball has no potential energy. At release K = 0; just before landing K = 9.8 J. Gravity, now an external force exerted by Earth, does positive work W = mgh = 9.8 J on the ball, transferring that energy in.
        (c) Both give ½mv² = mgh = 9.8 J, so v = √(2gh) = √(2 × 9.8 × 2.0) ≈ 6.3 m/s.
      explanation: |
        Three points. (a) U_g turning into K with gravity identified as internal (no external work). (b) No potential energy for one object, with the work done by gravity as the external transfer. (c) ½mv² = mgh in both and v ≈ 6.3 m/s. Giving potential energy to the ball alone in (b) loses that point.
    - slug: apphys1-u03-w13-q22
      type: short_answer
      topic_code: "3.2"
      source: "AP Physics 1 CED, Topic 3.2"
      points: 3
      prompt: |
        A spring with k = 80 N/m is already stretched 0.10 m. A student stretches it further, slowly, to 0.20 m.

        (a) Describe the graph of the force the student exerts against the stretch, from 0.10 m to 0.20 m (start and end values, shape).
        (b) Use the area under that graph to find the work the student does.
        (c) A classmate computes ½(80)(0.10)² = 0.40 J for this work, because the extra stretch is 0.10 m. Explain the classmate's error.
      answer: |
        (a) A straight line rising from F = (80)(0.10) = 8.0 N at 0.10 m to F = (80)(0.20) = 16 N at 0.20 m.
        (b) The area is a trapezoid: ½(8.0 + 16)(0.10) = 1.2 J. (Check: ½k(0.20)² − ½k(0.10)² = 1.6 − 0.40 = 1.2 J.)
        (c) The classmate used the extra stretch as if starting from the natural length, where the force starts at zero. Here the force already starts at 8.0 N, so the area is a trapezoid, not a triangle; the stored energy depends on the stretch from the natural length, so the work is the difference ½k(0.20)² − ½k(0.10)².
      explanation: |
        Three points, one per part. (a) Linear, from 8.0 N to 16 N. (b) 1.2 J from the trapezoid area (or the difference in ½kx²). (c) The error identified: x in ½kx² is measured from the natural length, and the force does not start at zero, so the extra 0.10 m requires more work than the first 0.10 m.
    - slug: apphys1-u03-w13-q23
      type: long_answer
      topic_code: "3.3"
      source: "AP Physics 1 CED, Topic 3.3"
      points: 6
      prompt: |
        Mathematical routines. A 1,200 kg space probe is carried from Earth's surface to a point at a height above the surface equal to Earth's radius, so its distance from Earth's centre goes from R to 2R. Earth's mass is M = 5.97 × 10²⁴ kg, its radius R = 6.37 × 10⁶ m, and G = 6.67 × 10⁻¹¹ N·m²/kg².

        (A) Derive an expression for the change in gravitational potential energy of the probe–Earth system, in terms of G, M, the probe's mass m and R.

        (B) Calculate the change in gravitational potential energy.

        (C) A classmate uses ΔU = mgh with g = 9.8 m/s² and h = R. Calculate the classmate's value, explain why it is too large, and show that the expression from (A) reduces to mgh when the height is much smaller than R.
      answer: |
        (A) ΔU = U_f − U_i = (−GMm/(2R)) − (−GMm/R) = GMm/R − GMm/(2R) = GMm/(2R).
        (B) ΔU = (6.67 × 10⁻¹¹)(5.97 × 10²⁴)(1,200)/(2 × 6.37 × 10⁶) ≈ 3.75 × 10¹⁰ J.
        (C) mgh = (1,200)(9.8)(6.37 × 10⁶) ≈ 7.49 × 10¹⁰ J, twice the correct value. mgh assumes the field strength stays 9.8 N/kg all the way up, but g = GM/r² falls to a quarter of that at 2R, so the real force (and the work against it) is smaller over most of the trip. For a small height h, GMm(1/R − 1/(R + h)) = GMm·h/(R(R + h)) ≈ GMm·h/R² = m(GM/R²)h = mgh, since R + h ≈ R and GM/R² = g.
      explanation: |
        Six points.
        (A) 2 points: 1 for using U_G = −GMm/r at both positions (with signs); 1 for the simplified result GMm/(2R), positive.
        (B) 1 point: 3.7 × 10¹⁰ J to 3.8 × 10¹⁰ J with the unit.
        (C) 3 points: 1 for the classmate's value, about 7.5 × 10¹⁰ J; 1 for explaining that g decreases with distance (as 1/r²), so mgh overestimates; 1 for showing the limit h much less than R gives GMm h/R² = mgh using g = GM/R². A sign error in (A) carried consistently through (B) loses only the point in (A).
