week: 13
unit: 3
title: "Potential Energy"
topics: ["3.3"]
guide: guides/week-13.md
guide_description: |
  Potential energy as energy stored in a system of interacting objects (never in one object), conservative and
  nonconservative forces and W = −ΔU, gravitational potential energy near Earth (ΔU_g = mgΔy, with the zero
  wherever you like), elastic potential energy U_s = ½kx² as the area under a force–stretch graph, the general
  U_G = −Gm₁m₂/r and its minus sign, reading force from a potential energy versus position graph, and energy bar
  charts for two choices of system. Worked examples: a 6.0 kg backpack lifted 1.5 m with two different zeros, a
  lab spring's force–stretch table (slope 50 N/m, area 0.25 J, quadrupling with double stretch), a 500 kg
  satellite raised 400 km compared with mgh and its small-height limit, and a cart meeting a spring bumper read
  from a U–x table.
flashcards_description: |
  30 cards on potential energy: systems and why one object cannot have potential energy, conservative versus
  nonconservative forces, the choice of zero, mgΔy, ½kx² and the force–stretch graph, −Gm₁m₂/r and when mgh
  fails, reading U–x graphs, energy bar charts, and three error-spot cards.

flashcards:
  - front: Potential energy → what it belongs to
    back: |
      A system of two or more interacting objects (book–Earth, block–spring). It is stored in their configuration, never in a single object.
    topic_code: "3.3"
  - front: System containing only a falling apple → does it have potential energy?
    back: |
      No. With Earth outside the system, gravity is an external force that does work on the apple; there is nothing to store energy in.
    topic_code: "3.3"
  - front: Falling apple, apple–Earth system versus apple-alone system → how the bookkeeping differs
    back: |
      Apple–Earth: U_g turns into K, no external work. Apple alone: gravity does positive external work that becomes K. Same final speed either way.
    topic_code: "3.3"
  - front: Conservative force → definition
    back: |
      A force whose work between two positions does not depend on the path taken (gravity, an ideal spring). Only conservative forces have a potential energy.
    topic_code: "3.3"
  - front: Kinetic friction → why it has no potential energy
    back: |
      Its work depends on the path: a longer drag removes more energy. That energy becomes internal (thermal) energy and cannot be stored and returned.
    topic_code: "3.3"
  - front: Work done by a conservative force inside a system → link to potential energy
    back: |
      W = −ΔU. When gravity does +20 J on a falling ball, the ball–Earth system's U_g drops by 20 J.
    topic_code: "3.3"
  - front: Near-surface gravitational potential energy change → formula
    back: |
      ΔU_g = mgΔy, with Δy positive upward, g = 9.8 N/kg. Valid while g is nearly constant (heights much less than Earth's radius).
    topic_code: "3.3"
  - front: Choice of zero for gravitational potential energy → what it changes
    back: |
      It changes the values of U_g but never ΔU_g. Put y = 0 wherever convenient; negative U_g just means below the reference.
    topic_code: "3.3"
  - front: 6.0 kg backpack lifted from the floor to a 1.5 m shelf → ΔU_g
    back: |
      ΔU_g = (6.0)(9.8)(1.5) = 88.2 J, whether the zero is the floor or the tabletop.
    topic_code: "3.3"
  - front: Ball rolling down a winding ramp versus dropping straight down the same height → work by gravity
    back: |
      The same, mgh, because gravity is conservative: only the change in height matters.
    topic_code: "3.3"
  - front: Elastic potential energy of an ideal spring → formula
    back: |
      U_s = ½kx², where x is the stretch or compression from the natural length (not the total length). Same for stretch and compression.
    topic_code: "3.3"
  - front: Where ½kx² comes from → graph argument
    back: |
      The force to stretch a spring rises in a straight line from 0 to kx, so the work is the triangle's area: ½(x)(kx) = ½kx².
    topic_code: "3.3"
  - front: Force–stretch graph of a spring → what the slope and the area give
    back: |
      Slope = spring constant k (N/m). Area under the line from 0 to x = elastic potential energy stored, ½kx².
    topic_code: "3.3"
  - front: Spring stretched twice as far → force and stored energy
    back: |
      Force doubles (Hooke's law), stored energy quadruples (½kx²).
    topic_code: "3.3"
  - front: Spring k = 50 N/m stretched 0.100 m → stored energy
    back: |
      U_s = ½(50)(0.100)² = 0.25 J.
    topic_code: "3.3"
  - front: Two springs stretched the same distance, one twice as stiff → stored energy
    back: |
      The stiffer spring stores twice the energy: U_s is proportional to k at fixed x.
    topic_code: "3.3"
  - front: General gravitational potential energy of two masses → formula
    back: |
      U_G = −Gm₁m₂/r, with r the centre-to-centre distance and U = 0 at infinite separation.
    topic_code: "3.3"
  - front: Minus sign in U_G = −Gm₁m₂/r → why
    back: |
      Zero is at infinite separation, and you must do positive work to pull attracting masses apart to infinity, so any finite separation has U below zero.
    topic_code: "3.3"
  - front: Two asteroids drift farther apart → does U_G increase or decrease?
    back: |
      It increases: it becomes less negative, approaching zero. Separating attracting masses always raises the system's potential energy.
    topic_code: "3.3"
  - front: Separation of two masses doubles → effect on U_G
    back: |
      Its magnitude halves (from −A to −A/2), which is an increase of A/2.
    topic_code: "3.3"
  - front: When mgh fails for a satellite → and what replaces it
    back: |
      When the height is not small compared with Earth's radius, g varies. Use ΔU_G = GMm(1/r_i − 1/r_f). Example: lifting 500 kg by 400 km gives 1.85 × 10⁹ J, not 1.96 × 10⁹ J.
    topic_code: "3.3"
  - front: GMm(1/R − 1/(R + h)) for a small height h → limiting case
    back: |
      It becomes GMmh/R² = mgh, because g = GM/R² at the surface. The general formula reduces to the near-surface one.
    topic_code: "3.3"
  - front: Potential energy versus position graph → direction of the force
    back: |
      Toward lower U, like a ball rolling downhill on the graph.
    topic_code: "3.3"
  - front: Potential energy versus position graph → size of the force
    back: |
      The steepness of the graph, |ΔU/Δx|, in J/m = N. A flat section means zero force (an equilibrium position).
    topic_code: "3.3"
  - front: Cart's U–x graph flat, then rising where a spring bumper begins → what the cart does
    back: |
      Constant speed on the flat part; on the rising part a force pushes it back toward lower U, slowing it until it stops and returns.
    topic_code: "3.3"
  - front: Energy bar chart for a ball dropped from 2.0 m (ball–Earth system) → three states
    back: |
      Release: all U_g. Halfway: half U_g, half K. Just before landing: all K. The total bar stays the same height.
    topic_code: "3.3"
  - front: Energy bar chart when the system is the ball alone → what changes
    back: |
      No U_g bar; an extra bar for work done by gravity (an external force) shows energy entering the system.
    topic_code: "3.3"
  - front: Error-spot → "the ball has 10 J of gravitational potential energy"
    back: |
      Potential energy belongs to the ball–Earth system, and its value depends on the chosen zero. Say "the ball–Earth system's U_g is 10 J above the floor".
    topic_code: "3.3"
  - front: Error-spot → "the spring's energy is kx because the force is kx"
    back: |
      kx is the force. The energy is the area under the force–stretch line, ½kx².
    topic_code: "3.3"
  - front: Error-spot → "the asteroids moved apart, so their gravitational potential energy decreased because r got bigger in the denominator"
    back: |
      The minus sign matters: −Gm₁m₂/r gets closer to zero, which is an increase.
    topic_code: "3.3"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topic 3.3: potential energy of systems, conservative
    forces and W = −ΔU, mgΔy and the choice of zero, ½kx² and force–stretch graphs, −Gm₁m₂/r, potential energy
    graphs and bar charts), with 8 questions (35%) reviewing earlier weeks (spring forces and Hooke's law,
    gravitational force, Newton's first law, kinetic energy and work from week 12). Opens with a shared-context
    set on a lab group's hanging-spring data. Multiple choice, select-all, true/false and numeric items are
    graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are
    graded by your teacher against the scoring notes. Calculators and the equation sheet are allowed throughout,
    as on the AP exam.
  questions:
    # ---- Stimulus set: hanging-spring lab (2.8, 3.3)
    - slug: apphys1-u03-w13-q01
      type: multiple_choice
      topic_code: "2.8"
      source: "AP Physics 1 CED, Topic 2.8"
      points: 1
      stimulus: |
        A lab group hangs a spring from a clamp and attaches different masses to its lower end. For each mass they wait until it hangs at rest and measure how far the spring has stretched from its natural length. Use g = 9.8 m/s².

        | Hanging mass (kg) | 0.10 | 0.20 | 0.30 | 0.40 | 0.50 |
        |---|---|---|---|---|---|
        | Stretch (m) | 0.024 | 0.050 | 0.073 | 0.099 | 0.122 |
      prompt: |
        Which graph should the group make so that its slope equals the spring constant k?
      options:
        - "Stretch on the vertical axis against hanging mass on the horizontal axis"
        - "Weight of the hanging mass (mg) on the vertical axis against stretch on the horizontal axis"
        - "Stretch on the vertical axis against the weight of the hanging mass on the horizontal axis"
        - "Hanging mass on the vertical axis against stretch on the horizontal axis"
      option_explanations:
        - |
          Stretch against mass has slope g/k, not k: the stretch is x = (g/k)m.
        - |
          Correct. At rest, the spring force balances the weight, mg = kx, so a graph of mg against x is a straight line through the origin with slope k.
        - |
          This puts the axes the other way round: x = (1/k)(mg), so the slope is 1/k.
        - |
          Mass against stretch has slope k/g, because m = (k/g)x; the weight, not the mass, equals kx.
      answer: 1
    - slug: apphys1-u03-w13-q02
      type: multiple_choice
      topic_code: "2.8"
      source: "AP Physics 1 CED, Topic 2.8"
      points: 1
      stimulus: |
        A lab group hangs a spring from a clamp and attaches different masses to its lower end. For each mass they wait until it hangs at rest and measure how far the spring has stretched from its natural length. Use g = 9.8 m/s².

        | Hanging mass (kg) | 0.10 | 0.20 | 0.30 | 0.40 | 0.50 |
        |---|---|---|---|---|---|
        | Stretch (m) | 0.024 | 0.050 | 0.073 | 0.099 | 0.122 |
      prompt: |
        What is the best estimate of the spring constant from these data?
      options:
        - "4.1 N/m"
        - "0.025 N/m"
        - "80 N/m"
        - "40 N/m"
      option_explanations:
        - |
          4.1 uses mass in kilograms instead of weight in newtons (0.50 kg / 0.122 m); the spring force balances the weight mg.
        - |
          0.025 is the slope of stretch against weight (1/k), the reciprocal of the spring constant.
        - |
          80 N/m comes from setting the weight equal to ½kx, mixing the energy formula into a force balance; at rest the spring force kx balances mg, giving 40 N/m.
        - |
          Correct. The best-fit slope of weight against stretch is about 40 N/m; for example (4.90 N − 0.98 N)/(0.122 m − 0.024 m) = 3.92/0.098 = 40 N/m.
      answer: 3
    - slug: apphys1-u03-w13-q03
      type: numeric
      topic_code: "3.3"
      source: "AP Physics 1 CED, Topic 3.3"
      points: 1
      stimulus: |
        A lab group hangs a spring from a clamp and attaches different masses to its lower end. For each mass they wait until it hangs at rest and measure how far the spring has stretched from its natural length. Use g = 9.8 m/s².

        | Hanging mass (kg) | 0.10 | 0.20 | 0.30 | 0.40 | 0.50 |
        |---|---|---|---|---|---|
        | Stretch (m) | 0.024 | 0.050 | 0.073 | 0.099 | 0.122 |
      prompt: |
        Taking k = 40 N/m, how much elastic potential energy is stored in the spring when the 0.50 kg mass hangs at rest? Give your answer in joules to three significant figures.
      answer: { value: 0.298, tolerance: 0.005 }
      explanation: |
        U_s = ½kx² = ½(40 N/m)(0.122 m)² = 0.298 J. Equivalently, the triangular area under the force–stretch line: ½(4.9 N)(0.122 m) ≈ 0.299 J. Using U = kx (4.9 J) or ½kx (2.4 J) is the common slip.
    - slug: apphys1-u03-w13-q04
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Physics 1 CED, Topic 3.3"
      points: 1
      stimulus: |
        A lab group hangs a spring from a clamp and attaches different masses to its lower end. For each mass they wait until it hangs at rest and measure how far the spring has stretched from its natural length. Use g = 9.8 m/s².

        | Hanging mass (kg) | 0.10 | 0.20 | 0.30 | 0.40 | 0.50 |
        |---|---|---|---|---|---|
        | Stretch (m) | 0.024 | 0.050 | 0.073 | 0.099 | 0.122 |
      prompt: |
        If the spring stays ideal, how does the energy stored at a stretch of 0.244 m compare with the energy stored at 0.122 m?
      options:
        - "Four times as much"
        - "Twice as much"
        - "The same, because k does not change"
        - "Eight times as much"
      option_explanations:
        - |
          Correct. U_s = ½kx² depends on the square of the stretch: doubling x multiplies U_s by 2² = 4. On the graph, both the base and the height of the triangle double.
        - |
          Twice as much is true of the force, kx, not of the stored energy, which grows with x².
        - |
          The spring constant is fixed, but the stored energy depends on how far the spring is stretched.
        - |
          Eight times would follow from a cubic dependence; elastic energy depends on x², not x³.
      answer: 0
    # ---- Independent items
    - slug: apphys1-u03-w13-q05
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Physics 1 CED, Topic 3.3"
      points: 1
      prompt: |
        A 45 kg student climbs a staircase that rises 3.0 m vertically. What is the change in gravitational potential energy of the student–Earth system?
      options:
        - "135 J"
        - "441 J"
        - "About 1.3 × 10³ J"
        - "About −1.3 × 10³ J"
      option_explanations:
        - |
          135 J is mass times height, 45 × 3.0, with g left out; the unit would be kg·m, not joules.
        - |
          441 J is the student's weight in newtons, mg, not multiplied by the 3.0 m rise.
        - |
          Correct. ΔU_g = mgΔy = (45)(9.8)(3.0) = 1,323 J ≈ 1.3 × 10³ J; it is positive because the student moves up.
        - |
          The size is right but the sign is wrong: moving up increases the separation from Earth, so ΔU_g is positive.
      answer: 2
    - slug: apphys1-u03-w13-q06
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Physics 1 CED, Topic 3.3"
      points: 1
      prompt: |
        A tennis ball falls from a balcony. Which choice of system lets you describe the motion using a change in gravitational potential energy?
      options:
        - "The ball alone, because the ball is what moves"
        - "Earth alone, because Earth exerts the gravitational force"
        - "The ball and the air, because air resistance acts on the ball"
        - "The ball and Earth together"
      option_explanations:
        - |
          A single object cannot have potential energy; with Earth outside the system, gravity is an external force doing work on the ball.
        - |
          Earth alone also has no partner to interact with; potential energy needs both interacting objects inside the system.
        - |
          The air interacts with the ball through drag, a nonconservative force with no potential energy; Earth is still outside this system.
        - |
          Correct. Gravitational potential energy is stored in the ball–Earth interaction, so both must be in the system; then gravity is internal and U_g turns into K.
      answer: 3
    - slug: apphys1-u03-w13-q07
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Physics 1 CED, Topic 3.3"
      points: 1
      prompt: |
        Two students analyse a 1.2 kg ball rolling off a 0.80 m table to the floor. One puts y = 0 at the floor, the other at the tabletop. Which quantity will they agree on?
      options:
        - "The value of U_g just before the ball lands"
        - "The change in U_g from the tabletop to the floor"
        - "The value of U_g when the ball is on the tabletop"
        - "Whether U_g is positive or negative at the floor"
      option_explanations:
        - |
          At the floor one student gets 0 and the other −9.4 J; values depend on the reference point.
        - |
          Correct. ΔU_g = mgΔy = (1.2)(9.8)(−0.80) ≈ −9.4 J for both, because only changes in potential energy are physical.
        - |
          On the tabletop one student gets (1.2)(9.8)(0.80) ≈ 9.4 J and the other 0; the value depends on the chosen zero.
        - |
          The sign at the floor depends on the zero: 0 for one student, negative for the other.
      answer: 1
    - slug: apphys1-u03-w13-q08
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Physics 1 CED, Topic 3.3"
      points: 1
      prompt: |
        Two asteroids have a gravitational potential energy of −8.0 × 10⁶ J (with zero at infinite separation). They drift apart until their centre-to-centre distance has doubled. What is their gravitational potential energy now?
      options:
        - "−4.0 × 10⁶ J"
        - "−16 × 10⁶ J"
        - "−2.0 × 10⁶ J"
        - "+4.0 × 10⁶ J"
      option_explanations:
        - |
          Correct. U_G = −Gm₁m₂/r is inversely proportional to r: doubling r halves the magnitude, to −4.0 × 10⁶ J, an increase in U_G.
        - |
          Doubling the magnitude would mean U_G is proportional to r; it is proportional to 1/r, and moving apart raises U toward zero.
        - |
          Quartering the magnitude uses 1/r², which describes the gravitational force, not the potential energy.
        - |
          The sign does not flip: for attracting masses U_G is negative at every finite separation.
      answer: 0
    - slug: apphys1-u03-w13-q09
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Physics 1 CED, Topic 3.3"
      points: 1
      prompt: |
        The potential energy of a system containing a cart is tabulated against the cart's position:

        | Position x (m) | 0 | 1.0 | 2.0 | 3.0 | 4.0 |
        |---|---|---|---|---|---|
        | U (J) | 12 | 6 | 3 | 3 | 5 |

        Over which interval is the force on the cart largest, and which way does it point?
      options:
        - "From 2.0 m to 3.0 m, because the cart is at its lowest U there"
        - "From 3.0 m to 4.0 m, pointing toward larger x"
        - "From 0 to 1.0 m, pointing toward larger x"
        - "From 0 to 1.0 m, pointing toward smaller x, because U is largest there"
      option_explanations:
        - |
          Between 2.0 m and 3.0 m U is constant, so the slope and the force are zero; a low U does not mean a large force.
        - |
          From 3.0 m to 4.0 m U rises by 2 J, a force of about 2 N, and it points toward lower U, which is smaller x.
        - |
          Correct. U drops 6 J over 1.0 m, the steepest change (about 6 N), and the force points toward lower U, the +x direction.
        - |
          The interval is right but the direction is wrong: the force points downhill on the graph, toward lower U, which is larger x here.
      answer: 2
    - slug: apphys1-u03-w13-q10
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Physics 1 CED, Topic 3.3"
      points: 1
      prompt: |
        For which of these forces is it impossible to define a potential energy?
      options:
        - "The gravitational force between a satellite and Earth"
        - "The force exerted by an ideal spring on a block"
        - "The gravitational force on a ball near Earth's surface"
        - "Kinetic friction from a floor on a sliding box"
      option_explanations:
        - |
          Gravity is conservative at any distance; its potential energy is U_G = −Gm₁m₂/r.
        - |
          An ideal spring force is conservative; its potential energy is ½kx².
        - |
          Near the surface, gravity is conservative with ΔU_g = mgΔy, independent of the path.
        - |
          Correct. The work done by kinetic friction depends on the path length, so it is nonconservative; the energy it removes becomes thermal energy, not stored energy.
      answer: 3
    - slug: apphys1-u03-w13-q11
      type: multiple_choice
      topic_code: "3.2"
      source: "AP Physics 1 CED, Topic 3.2"
      points: 1
      prompt: |
        A 0.50 kg ball rolls down a curved ramp, ending 1.2 m lower than it started. How much work does gravity do on the ball?
      options:
        - "+5.9 J"
        - "−5.9 J"
        - "+0.60 J"
        - "It cannot be found without the ramp's length and shape."
      option_explanations:
        - |
          Correct. Gravity is conservative, so its work depends only on the change in height: W = mgh = (0.50)(9.8)(1.2) ≈ +5.9 J, positive because the ball moves down. This equals −ΔU_g.
        - |
          The size is right, but gravity points down and the ball moves down overall, so gravity's work is positive; it is ΔU_g that is −5.9 J.
        - |
          0.60 J is mass × height, leaving out g, so its unit would be kg·m rather than joules.
        - |
          For a conservative force like gravity, the path does not matter; only the vertical drop is needed.
      answer: 0
    - slug: apphys1-u03-w13-q12
      type: multiple_choice
      topic_code: "3.1"
      source: "AP Physics 1 CED, Topic 3.1"
      points: 1
      prompt: |
        A 900 kg car moves at 20 m/s and a 1,800 kg truck moves at 10 m/s. Which statement about their kinetic energies is correct?
      options:
        - "They are equal, because each has a momentum of 18,000 kg·m/s."
        - "The car has twice the kinetic energy of the truck."
        - "The truck has twice the kinetic energy of the car."
        - "The car has four times the kinetic energy of the truck."
      option_explanations:
        - |
          Equal momentum does not mean equal kinetic energy; K = ½mv² weights speed more heavily than mass.
        - |
          Correct. K_car = ½(900)(20)² = 180,000 J and K_truck = ½(1,800)(10)² = 90,000 J, so the car has twice as much.
        - |
          This reverses the comparison by weighting mass more than speed; speed is squared in K = ½mv².
        - |
          Four times accounts for the doubled speed but forgets that the truck has twice the mass.
      answer: 1
    - slug: apphys1-u03-w13-q13
      type: multiple_choice
      topic_code: "2.6"
      source: "AP Physics 1 CED, Topic 2.6"
      points: 1
      prompt: |
        A satellite feels a gravitational force of 2,000 N at Earth's surface (distance R from Earth's centre). What gravitational force does it feel in an orbit at distance 2R from Earth's centre?
      options:
        - "1,000 N"
        - "2,000 N, because its mass has not changed"
        - "500 N"
        - "0 N, because it is weightless in orbit"
      option_explanations:
        - |
          1,000 N treats the force as proportional to 1/r; Newton's law of gravitation has 1/r².
        - |
          The mass is unchanged, but the force depends on the distance from Earth's centre as 1/r².
        - |
          Correct. F_g = GMm/r²: doubling r divides the force by 2² = 4, giving 2,000/4 = 500 N.
        - |
          An orbiting satellite feels apparent weightlessness because it is in free fall; gravity still acts and provides the centripetal force.
      answer: 2
    - slug: apphys1-u03-w13-q14
      type: multi_select
      topic_code: "3.3"
      source: "AP Physics 1 CED, Topic 3.3"
      points: 2
      partial_credit: true
      prompt: |
        In which of these situations does the potential energy of the named system change? Select all that apply.
      options:
        - "The system of a volleyball and Earth, as the ball rises after a serve"
        - "The system of a single hockey puck, as it slides across level ice"
        - "The system of a block and a compressed spring, as the spring pushes the block away and returns to its natural length"
        - "The system of Earth and the Moon, if the Moon's orbit slowly grows larger"
        - "The system of a box and Earth, as the box is dragged across a level rough floor"
      option_explanations:
        - |
          Correct. The ball–Earth separation increases, so U_g of the system increases.
        - |
          A single object has no potential energy at all, and the puck's height does not change anyway.
        - |
          Correct. The spring's compression decreases to zero, so U_s = ½kx² decreases as it does work on the block.
        - |
          Correct. A larger separation makes U_G = −Gm₁m₂/r less negative, so the system's potential energy increases.
        - |
          The box stays at the same height, so U_g does not change; friction's effect is a change in thermal energy, not potential energy.
      answer: [0, 2, 3]
    - slug: apphys1-u03-w13-q15
      type: multi_select
      topic_code: "3.3"
      source: "AP Physics 1 CED, Topic 3.3"
      points: 2
      partial_credit: true
      prompt: |
        A 0.20 kg apple falls from rest from a branch 3.0 m above the ground. Air resistance is negligible, and the system is the apple and Earth with the ground as y = 0. Which entries in an energy bar chart for this system are correct? Select all that apply.
      options:
        - "At release: K = 0 and U_g ≈ 5.9 J."
