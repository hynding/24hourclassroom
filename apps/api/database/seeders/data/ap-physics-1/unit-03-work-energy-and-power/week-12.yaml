    - slug: apphys1-u03-w12-q21
      type: short_answer
      topic_code: "3.2"
      source: "AP Physics 1 CED, Topic 3.2"
      points: 3
      prompt: |
        A student gives a box a quick shove up a rough ramp. After her hand leaves it, the box slides up the ramp, slowing down.

        (a) Describe the free-body diagram for the box while it slides up, after the shove (name each force and its direction).
        (b) For each force, state whether the work it does on the box is positive, negative or zero as the box slides up, and why.
        (c) Explain, in terms of work, why the box slows down.
      answer: |
        (a) Three forces: F_g straight down; F_N perpendicular to the ramp surface, pointing away from it; kinetic friction F_f parallel to the ramp, pointing down the ramp (opposite the motion). There is no "force of the shove" once her hand has left.
        (b) Gravity: negative, because it has a component down the ramp, opposite the displacement. Normal force: zero, because it is perpendicular to the displacement. Friction: negative, because it points opposite the displacement.
        (c) The net work is the sum of two negative works and a zero, so it is negative; by the work–energy theorem ΔK is negative and the box's speed decreases.
      explanation: |
        Three points, one per part. (a) Exactly three forces with correct directions; including a forward "shove" or "motion" force loses the point. (b) All three signs correct with a reason (direction of force relative to displacement). (c) Negative net work linked to a decrease in kinetic energy through W_net = ΔK.
    - slug: apphys1-u03-w12-q22
      type: short_answer
      topic_code: "2.7"
      source: "AP Physics 1 CED, Topic 2.7"
      points: 3
      prompt: |
        A crate rests on the flat bed of a pickup truck. The truck speeds up from rest along a level road, and the crate stays in place on the bed without slipping.

        (a) What force accelerates the crate forward? Name the type of force and give its direction.
        (b) Is that force static or kinetic? Justify.
        (c) In the ground's reference frame, is the work done by that force on the crate positive, negative or zero? Explain.
      answer: |
        (a) A friction force exerted by the truck bed on the crate, pointing forward (in the direction of the truck's acceleration). It is the only horizontal force on the crate.
        (b) Static: the crate does not slide relative to the bed, so the surfaces are not moving past each other.
        (c) Positive. In the ground frame the crate moves forward and the friction force points forward, so θ = 0 and W > 0; this work is what increases the crate's kinetic energy.
      explanation: |
        Three points. (a) Friction from the truck bed, forward. Saying "the truck's engine force" or "inertia" earns nothing. (b) Static, with no relative sliding as the reason. (c) Positive work, with force and displacement in the same direction in the ground frame (connecting it to the crate's gain in kinetic energy is good but not required). Saying static friction can never do work loses this point.
    - slug: apphys1-u03-w12-q23
      type: long_answer
      topic_code: "3.2"
      source: "AP Physics 1 CED, Topic 3.2"
      points: 6
      prompt: |
        Qualitative/quantitative translation. Two identical hockey pucks slide on the same rough, level floor of a gym (not ice). Puck A is launched with speed v₀ and puck B with speed 2v₀. Each slides in a straight line until it stops. The coefficient of kinetic friction between each puck and the floor is μ_k.

        (A) Without equations, explain in a short paragraph whether puck B slides more than twice as far as puck A, exactly twice as far, or less than twice as far before stopping. Refer to energy and to the friction force.

        (B) Using the work–energy theorem, derive an expression for the stopping distance d of a puck launched with speed v, in terms of v, μ_k and physical constants as needed.

        (C) Show that your expression in (B) agrees with your reasoning in (A), and use it to predict whether a heavier puck launched at v₀ on the same floor would slide farther, less far or the same distance as puck A. Explain.
      answer: |
        (A) More than twice as far. Puck B has twice the speed, so it starts with four times the kinetic energy, since kinetic energy depends on the square of the speed. The friction force on each identical puck is the same constant size, so each metre of sliding removes the same amount of energy. B must slide four times as far to lose four times the energy.
        (B) Forces: F_g down, F_N up (F_N = mg on a level floor), F_f = μ_k mg backward. Only friction does work: W_net = −μ_k mg d. Work–energy: −μ_k mg d = 0 − ½mv², so d = v²/(2μ_k g).
        (C) d is proportional to v², so doubling v multiplies d by 4, which is more than twice, as argued in (A). The mass cancels in d = v²/(2μ_k g), so a heavier puck at v₀ slides the same distance: it has more kinetic energy, but the friction force is larger in the same proportion.
      explanation: |
        Six points.
        (A) 2 points: 1 for "more than twice" (four times) linked to kinetic energy depending on speed squared; 1 for the reasoning that the friction force (energy removed per metre) is the same for both pucks. A correct answer with no energy reasoning earns 0.
        (B) 2 points: 1 for writing the work done by friction as −μ_k mg d (or F_N = mg used in friction) and setting it equal to ΔK; 1 for the correct result d = v²/(2μ_k g).
        (C) 2 points: 1 for showing d ∝ v² gives a factor of 4 for B, consistent with (A); 1 for "same distance" because mass cancels (larger K but proportionally larger friction). An answer to (C) that contradicts (A) without noting the inconsistency earns at most 1 point.
