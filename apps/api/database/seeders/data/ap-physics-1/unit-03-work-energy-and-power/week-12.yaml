week: 12
unit: 3
title: "Translational Kinetic Energy and Work"
topics: ["3.1", "3.2"]
guide: guides/week-12.md
guide_description: |
  Kinetic energy K = ½mv² as a frame-dependent scalar that grows with the square of the speed, work by a constant
  force W = Fd cos θ (only the parallel component counts), the sign of the work each force in a free-body diagram
  does, work as the area under a force–position graph, and the work–energy theorem W_net = ΔK. Worked examples: a
  55 kg skateboarder's kinetic energy with a functional-dependence table, a 30 N wagon pull at 35° over 12 m, a
  ramping push read from a force–position table (10 J into a 2.0 kg cart), a 20 kg box dragged against friction
  (checked against Newton's second law), and a car's braking distance from 15 m/s and 30 m/s with limiting cases.
flashcards_description: |
  30 cards on translational kinetic energy and work: computing K and predicting how it scales with mass and
  speed, the reference-frame dependence of K, the sign and size of the work done by each force, work from a
  force–position graph, net work, the work–energy theorem, braking distances, and three error-spot cards.

flashcards:
  - front: Translational kinetic energy of a moving cart → formula and unit
    back: |
      K = ½mv², in joules (1 J = 1 kg·m²/s²). It uses the speed of the centre of mass, so it is a scalar and never negative.
    topic_code: "3.1"
  - front: 55 kg skateboarder rolling at 4.0 m/s → kinetic energy
    back: |
      K = ½(55)(4.0)² = 440 J.
    topic_code: "3.1"
  - front: Skateboarder's speed doubles from 4.0 to 8.0 m/s → new kinetic energy
    back: |
      K grows with v², so it quadruples: 4 × 440 J = 1,760 J.
    topic_code: "3.1"
  - front: Ratio of kinetic energies for two moving objects → formula
    back: |
      K₂/K₁ = (m₂/m₁)(v₂/v₁)². Double the mass: ×2. Double the speed: ×4. Triple the speed: ×9.
    topic_code: "3.1"
  - front: Cart A (mass m, speed 2v) versus cart B (mass 2m, speed v) → which has more K?
    back: |
      A: K_A = ½m(2v)² = 2mv², K_B = ½(2m)v² = mv². A has twice the kinetic energy of B.
    topic_code: "3.1"
  - front: Two identical carts at 3 m/s, one east and one west → compare kinetic energies
    back: |
      Equal. Kinetic energy depends on v², so direction does not matter; momentum would differ, kinetic energy does not.
    topic_code: "3.1"
  - front: Passenger seated in a moving train → kinetic energy in two frames
    back: |
      Zero in the train's frame, ½mv_train² in the ground's frame. K depends on the frame; pick one and stay in it.
    topic_code: "3.1"
  - front: Kinetic energy of a ball in uniform circular motion → constant or changing?
    back: |
      Constant: its speed does not change, even though its velocity direction does.
    topic_code: "3.1"
  - front: Work done by a constant force on a moving object → formula
    back: |
      W = Fd cos θ, with θ the angle between the force and the displacement. Equivalently, (force component along the displacement) × distance.
    topic_code: "3.2"
  - front: Work → scalar or vector, and what its sign means
    back: |
      Scalar. Positive work transfers energy into the object; negative work transfers energy out of it.
    topic_code: "3.2"
  - front: Force perpendicular to the displacement (θ = 90°) → work done
    back: |
      Zero, because cos 90° = 0. Example: the normal force on a cart rolling along a level track.
    topic_code: "3.2"
  - front: Kinetic friction on a box sliding across a floor → sign of its work
    back: |
      Negative: friction points opposite the displacement (θ = 180°), so W_f = −F_f d. It removes kinetic energy from the box.
    topic_code: "3.2"
  - front: Wagon pulled 12 m by a 30 N force at 35° above horizontal → work by the pull
    back: |
      W = (30)(12) cos 35° ≈ 295 J. Using sin 35° (about 206 J) is the classic slip.
    topic_code: "3.2"
  - front: Gravity on a ball thrown straight up, while it rises → sign of the work
    back: |
      Negative: gravity points down, the displacement is up. On the way down gravity does positive work.
    topic_code: "3.2"
  - front: Tension in a string whirling a ball in a horizontal circle → work per revolution
    back: |
      Zero. The tension points toward the centre, perpendicular to the velocity at every instant, so the speed stays constant.
    topic_code: "3.2"
  - front: Force–position graph → what the area means
    back: |
      The work done by that force. Area above the position axis is positive work; area below it is negative work.
    topic_code: "3.2"
  - front: Push rising from 0 to 8.0 N over 0.50 m, then 8.0 N for 1.0 m → work
    back: |
      Triangle ½(0.50)(8.0) = 2.0 J plus rectangle (1.0)(8.0) = 8.0 J: 10.0 J in total.
    topic_code: "3.2"
  - front: Net work on an object → two ways to compute it
    back: |
      Add the work done by each force separately, or multiply the net force's component along the displacement by the distance. Both give the same number.
    topic_code: "3.2"
  - front: Work–energy theorem → statement
    back: |
      The net work done on an object equals its change in kinetic energy: W_net = ½mv_f² − ½mv_i².
    topic_code: "3.2"
  - front: Work–energy theorem versus kinematics → when it is faster
    back: |
      When the question involves forces, distances and speeds but not time. W_net = ΔK never needs t.
    topic_code: "3.2"
  - front: Work–energy theorem → where it comes from
    back: |
      Multiply F_net = ma by Δx and use v² = v₀² + 2aΔx: F_net Δx = ½mv² − ½mv₀².
    topic_code: "3.2"
  - front: 20 kg box dragged 5.0 m by 80 N against 49 N of friction from rest → final speed
    back: |
      W_net = 400 J − 245 J = 155 J = ½(20)v², so v ≈ 3.9 m/s.
    topic_code: "3.2"
  - front: Braking distance with a constant braking force → dependence on speed
    back: |
      Fd = ½mv², so d = mv²/(2F): doubling the speed quadruples the stopping distance.
    topic_code: "3.2"
  - front: 1,200 kg car stops from 15 m/s in 25 m → average braking force
    back: |
      F = ½mv²/d = 135,000 J / 25 m = 5,400 N.
    topic_code: "3.2"
  - front: Net work on an object is zero → what you can conclude
    back: |
      Its speed (and kinetic energy) is the same at the end as at the start. It may still have changed direction.
    topic_code: "3.2"
  - front: Box carried horizontally at constant velocity → work by the carrier's upward force
    back: |
      Zero: the upward supporting force is perpendicular to the horizontal displacement.
    topic_code: "3.2"
  - front: Glove catching a fast baseball → sign of the work the glove does on the ball
    back: |
      Negative: the glove pushes opposite the ball's motion and removes its kinetic energy.
    topic_code: "3.2"
  - front: Error-spot → "the student held the 10 kg box still for a minute, so she did a lot of work on it"
    back: |
      The box did not move, so her force did no work on the box. Her muscles used energy internally, but none was transferred to the box.
    topic_code: "3.2"
  - front: Error-spot → "the cart's speed doubled, so its kinetic energy doubled"
    back: |
      K depends on v²: doubling the speed multiplies K by four.
    topic_code: "3.1"
  - front: Error-spot → "the normal force does work on a car driving along a level road"
    back: |
      The normal force is vertical and the displacement horizontal, so θ = 90° and the work is zero.
    topic_code: "3.2"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 3.1 and 3.2: kinetic energy and how it scales with
    mass and speed, work by constant forces at angles, the sign of work from a free-body diagram, work as the area
    under a force–position graph, and the work–energy theorem), with 8 questions (35%) reviewing earlier weeks
    (constant-acceleration kinematics and velocity–time graphs, Newton's second law, gravitational force, friction,
    spring forces and circular motion). Opens with a shared-context set on a sled pulled by an angled rope.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes. Calculators and the equation sheet are allowed throughout, as on the AP exam.
  questions:
    # ---- Stimulus set: sled pulled by an angled rope (3.2, 2.7, 3.1)
    - slug: apphys1-u03-w12-q01
      type: multiple_choice
      topic_code: "3.2"
      source: "AP Physics 1 CED, Topic 3.2"
      points: 1
      stimulus: |
        A student pulls a 12 kg sled, initially at rest, across level snow. The rope pulls with a constant tension of 50 N at 30° above the horizontal, and the sled moves 15 m in a straight line. The coefficient of kinetic friction between the sled and the snow is 0.15. Use g = 9.8 m/s².
      prompt: |
        How much work does the rope's tension do on the sled over the 15 m?
      options:
        - "750 J"
        - "375 J"
        - "650 J"
        - "0 J"
      option_explanations:
        - |
          750 J is (50 N)(15 m), the whole tension times the distance. Only the horizontal component, 50 cos 30°, lies along the displacement.
        - |
          375 J uses sin 30°, the vertical component of the tension, which is perpendicular to the displacement and does no work.
        - |
          Correct. W = Fd cos θ = (50 N)(15 m) cos 30° = 750 × 0.866 ≈ 650 J.
        - |
          Zero would be right only if the rope were perpendicular to the motion; it has a horizontal component along the displacement.
      answer: 2
    - slug: apphys1-u03-w12-q02
      type: multiple_choice
      topic_code: "2.7"
      source: "AP Physics 1 CED, Topic 2.7"
      points: 1
      stimulus: |
        A student pulls a 12 kg sled, initially at rest, across level snow. The rope pulls with a constant tension of 50 N at 30° above the horizontal, and the sled moves 15 m in a straight line. The coefficient of kinetic friction between the sled and the snow is 0.15. Use g = 9.8 m/s².
      prompt: |
        What is the magnitude of the normal force the snow exerts on the sled?
      options:
        - "117.6 N"
        - "92.6 N"
        - "142.6 N"
        - "101.8 N"
      option_explanations:
        - |
          117.6 N assumes the normal force always equals mg. The rope's upward component, 50 sin 30° = 25 N, carries part of the weight.
        - |
          Correct. Vertically, F_N + T sin 30° = mg, so F_N = 117.6 N − 25 N = 92.6 N.
        - |
          142.6 N adds the rope's vertical component to the weight, as if the rope pulled downward; it pulls up and to the side.
        - |
          101.8 N is mg cos 30°, a formula for a block on a 30° incline; here the surface is level and the 30° belongs to the rope.
      answer: 1
    - slug: apphys1-u03-w12-q03
      type: multiple_choice
      topic_code: "3.2"
      source: "AP Physics 1 CED, Topic 3.2"
      points: 1
      stimulus: |
        A student pulls a 12 kg sled, initially at rest, across level snow. The rope pulls with a constant tension of 50 N at 30° above the horizontal, and the sled moves 15 m in a straight line. The coefficient of kinetic friction between the sled and the snow is 0.15. Use g = 9.8 m/s².
      prompt: |
        Which describes the work done on the sled by each of the four forces acting on it during the 15 m?
      options:
        - "Tension positive, friction negative, gravity negative, normal force positive."
        - "All four forces do positive work, because the sled speeds up."
        - "Tension positive, friction positive, gravity zero, normal force zero."
        - "Tension positive, friction negative, gravity zero, normal force zero."
      option_explanations:
        - |
          Gravity and the normal force are vertical while the displacement is horizontal, so each does zero work, not negative or positive work.
        - |
          The sled speeding up means the net work is positive, not that every force does positive work; friction opposes the motion.
        - |
          Kinetic friction points opposite the sled's displacement, so its work is negative, not positive.
        - |
          Correct. Tension has a component along the motion (positive), friction opposes it (negative), and the vertical forces are perpendicular to the horizontal displacement (zero).
      answer: 3
    - slug: apphys1-u03-w12-q04
      type: numeric
      topic_code: "3.1"
      source: "AP Physics 1 CED, Topic 3.1"
      points: 1
      stimulus: |
        A student pulls a 12 kg sled, initially at rest, across level snow. The rope pulls with a constant tension of 50 N at 30° above the horizontal, and the sled moves 15 m in a straight line. The coefficient of kinetic friction between the sled and the snow is 0.15. Use g = 9.8 m/s².
      prompt: |
        Use the work–energy theorem to find the sled's speed after the 15 m. Give your answer in m/s to three significant figures.
      answer: { value: 8.57, tolerance: 0.04 }
      explanation: |
        Friction: F_f = μ_k F_N = 0.15 × 92.6 N = 13.9 N, so W_f = −13.9 × 15 = −208 J. Tension: W_T = 650 J. Gravity and the normal force do no work. W_net = 650 − 208 = 441 J = ½(12 kg)v², so v = √(2 × 441/12) ≈ 8.57 m/s. (Taking F_N = mg would give friction 17.6 N and v ≈ 8.0 m/s.)
    # ---- Independent items
    - slug: apphys1-u03-w12-q05
      type: multiple_choice
      topic_code: "3.1"
      source: "AP Physics 1 CED, Topic 3.1"
      points: 1
      prompt: |
        A car's speed on a highway on-ramp increases from 10 m/s to 30 m/s. By what factor does its kinetic energy increase?
      options:
        - "9"
        - "3"
        - "6"
        - "20"
      option_explanations:
        - |
          Correct. K is proportional to v², and the speed triples, so K is multiplied by 3² = 9.
        - |
          A factor of 3 treats kinetic energy as proportional to speed; it depends on the square of the speed.
        - |
          A factor of 6 doubles the speed ratio (2 × 3) instead of squaring it.
        - |
          20 is the change in speed in m/s, not a ratio of kinetic energies.
      answer: 0
    - slug: apphys1-u03-w12-q06
      type: multiple_choice
      topic_code: "3.1"
      source: "AP Physics 1 CED, Topic 3.1"
      points: 1
      prompt: |
        Cart A has mass m and moves at speed 2v. Cart B has mass 2m and moves at speed v. How does the kinetic energy of cart A compare with that of cart B?
      options:
        - "They are equal, because the product of mass and speed is the same."
        - "K_A is half of K_B."
        - "K_A is twice K_B."
        - "K_A is four times K_B."
      option_explanations:
        - |
          Equal mass × speed means equal momentum, not equal kinetic energy; K depends on the speed squared.
        - |
          Half would follow if mass mattered more than speed; in K = ½mv² the speed is squared, so the faster cart wins.
        - |
          Correct. K_A = ½m(2v)² = 2mv² and K_B = ½(2m)v² = mv², so K_A = 2K_B.
        - |
          Four times accounts for the doubled speed but forgets that cart B has twice the mass.
      answer: 2
    - slug: apphys1-u03-w12-q07
      type: multiple_choice
      topic_code: "3.2"
      source: "AP Physics 1 CED, Topic 3.2"
      points: 1
      prompt: |
        A horizontal force acts on a crate as it slides along a floor in the +x direction. The force is 10 N in the +x direction from x = 0 to x = 3.0 m, then decreases steadily to 0 N at x = 5.0 m. How much work does this force do on the crate from x = 0 to x = 5.0 m?
      options:
        - "50 J"
        - "40 J"
        - "30 J"
        - "20 J"
      option_explanations:
        - |
          50 J is 10 N × 5.0 m, as if the force stayed at 10 N the whole way; the last 2.0 m contribute only a triangle.
        - |
          Correct. Work is the area under the force–position graph: rectangle (10 N)(3.0 m) = 30 J plus triangle ½(2.0 m)(10 N) = 10 J, total 40 J.
        - |
          30 J counts only the rectangle and leaves out the triangular area from 3.0 m to 5.0 m, where the force is still positive.
        - |
          20 J counts the triangle as 2.0 m × 10 N and leaves out the rectangle, or halves the whole area.
      answer: 1
    - slug: apphys1-u03-w12-q08
      type: multiple_choice
      topic_code: "3.2"
      source: "AP Physics 1 CED, Topic 3.2"
      points: 1
      prompt: |
        A softball moving at 25 m/s is caught in a fielder's glove and brought to rest. Which statement about the work done by the glove on the ball is correct?
      options:
        - "It is zero, because the ball ends at rest."
        - "It is positive, because the glove exerts a force on the ball."
        - "It cannot be found without knowing the time the catch takes."
        - "It is negative, because the glove's force on the ball points opposite the ball's displacement."
      option_explanations:
        - |
          The ball ends with zero kinetic energy, but it started with some; the change in K is negative, so the work is negative, not zero.
        - |
          Exerting a force is not enough for positive work; the sign depends on the force's direction relative to the displacement.
        - |
          The work–energy theorem needs only the change in kinetic energy, W = ΔK = 0 − ½mv², not the time.
        - |
          Correct. The glove pushes backward while the ball moves forward (θ = 180°), so the glove does negative work equal to ΔK = −½mv².
      answer: 3
    - slug: apphys1-u03-w12-q09
      type: multiple_choice
      topic_code: "3.2"
      source: "AP Physics 1 CED, Topic 3.2"
      points: 1
      prompt: |
        A cyclist braking with a constant braking force stops in 6.0 m from a speed of 5.0 m/s. With the same braking force, how far would she take to stop from 10 m/s?
      options:
        - "24 m"
        - "12 m"
        - "6.0 m"
        - "8.5 m"
      option_explanations:
        - |
          Correct. Fd = ½mv², so d is proportional to v². Doubling the speed multiplies the distance by 4: 4 × 6.0 m = 24 m.
        - |
          12 m treats the stopping distance as proportional to speed; the kinetic energy to remove grows with v².
        - |
          6.0 m assumes the stopping distance does not depend on speed, but four times the kinetic energy must be removed.
        - |
          8.5 m multiplies by √2, as if the kinetic energy doubled when the speed doubled; it quadruples.
      answer: 0
    - slug: apphys1-u03-w12-q10
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Physics 1 CED, Topic 2.9"
      points: 1
      prompt: |
        A 0.20 kg puck tied to a string slides on a frictionless horizontal table in a circle of radius 0.50 m at a constant speed of 3.0 m/s. How much work does the string's tension do on the puck during half a revolution?
      options:
        - "3.6 J, the tension (3.6 N) times the radius"
        - "0 J"
        - "5.7 J, the tension (3.6 N) times the half-circle's length"
        - "0.90 J, the puck's kinetic energy"
      option_explanations:
        - |
          The radius is not a displacement along the force; the puck moves around the circle, perpendicular to the tension at every instant.
        - |
          Correct. The tension (mv²/r = 3.6 N) points toward the centre, always perpendicular to the velocity, so it does no work and the puck's speed and K stay constant.
        - |
          Multiplying by the path length assumes the force is along the motion; it is perpendicular to it everywhere, so cos θ = 0.
        - |
          0.90 J is the puck's kinetic energy, ½(0.20)(3.0)², which does not change; the work equals the change in K, which is zero.
      answer: 1
    - slug: apphys1-u03-w12-q11
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        A cart starts from rest and speeds up along a straight track with a constant acceleration of 2.0 m/s². What is its speed after it has travelled 9.0 m?
      options:
        - "18 m/s"
        - "36 m/s"
        - "4.2 m/s"
        - "6.0 m/s"
      option_explanations:
        - |
          18 m/s multiplies acceleration by distance, a × Δx, which has units of m²/s², not m/s; that product is half of v².
        - |
          36 m/s is v² = 2aΔx = 36 m²/s², with the square root forgotten.
        - |
          4.2 m/s is √(2 × 9.0), which leaves out the acceleration.
        - |
          Correct. v² = v₀² + 2aΔx = 0 + 2(2.0)(9.0) = 36 m²/s², so v = 6.0 m/s. (Work–energy gives the same: F_net Δx = ½mv².)
      answer: 3
    - slug: apphys1-u03-w12-q12
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 1
      prompt: |
        A student pushes a 4.0 kg box across a level floor with a horizontal force of 20 N. The floor exerts a kinetic friction force of 8.0 N on the box. What is the box's acceleration?
      options:
        - "5.0 m/s²"
        - "7.0 m/s²"
        - "3.0 m/s²"
        - "2.0 m/s²"
      option_explanations:
        - |
          5.0 m/s² is 20 N/4.0 kg, using the applied force alone instead of the net force.
        - |
          7.0 m/s² adds friction to the push, as if friction helped the motion; it opposes it.
        - |
          Correct. F_net = 20 N − 8.0 N = 12 N, and a = F_net/m = 12/4.0 = 3.0 m/s² in the direction of the push.
        - |
          2.0 m/s² is the friction force divided by the mass, 8.0/4.0, which is not the net force.
      answer: 2
    - slug: apphys1-u03-w12-q13
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        A velocity–time graph for a cart is a straight line rising from 2.0 m/s at t = 0 to 6.0 m/s at t = 4.0 s. What is the cart's displacement over these 4.0 s?
      options:
        - "16 m"
        - "24 m"
        - "8.0 m"
        - "1.0 m"
      option_explanations:
        - |
          Correct. Displacement is the area under the v–t graph, a trapezoid: ½(2.0 + 6.0)(4.0) = 16 m.
        - |
          24 m uses the final velocity for the whole interval, (6.0)(4.0), overestimating the area.
        - |
          8.0 m counts only the triangle above 2.0 m/s and leaves out the rectangle (2.0)(4.0) = 8.0 m beneath it.
        - |
          1.0 m/s² is the slope of the graph, the acceleration, not the displacement.
      answer: 0
    - slug: apphys1-u03-w12-q14
      type: multi_select
      topic_code: "3.2"
      source: "AP Physics 1 CED, Topic 3.2"
      points: 2
      partial_credit: true
      prompt: |
        In which situations does the named force do negative work on the named object? Select all that apply.
      options:
        - "Kinetic friction on a book sliding to a stop across a table"
        - "Gravity on a basketball while it rises toward the hoop"
        - "The normal force on a car driving along a level road"
        - "The rope's tension on a bucket being raised at constant speed from a well"
        - "The road's braking force on a car that is slowing down"
      option_explanations:
        - |
          Correct. Friction points opposite the book's displacement, so it does negative work and removes kinetic energy.
        - |
          Correct. Gravity points down while the rising ball's displacement has an upward component, so gravity's work is negative.
        - |
          The normal force is perpendicular to the level road, so it does zero work, not negative work.
        - |
          The tension points up and the bucket moves up, so the tension does positive work (it balances gravity's negative work).
        - |
          Correct. The braking force points backward while the car moves forward, so its work is negative and the car loses kinetic energy.
      answer: [0, 1, 4]
    - slug: apphys1-u03-w12-q15
      type: multi_select
      topic_code: "3.1"
      source: "AP Physics 1 CED, Topic 3.1"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about translational kinetic energy are correct? Select all that apply.
      options:
        - "Two identical cars moving at the same speed in opposite directions have equal kinetic energies."
        - "An object moving in the negative direction has negative kinetic energy."
        - "A 2.0 kg ball moving at 3.0 m/s has more kinetic energy than a 1.0 kg ball moving at 4.0 m/s."
        - "A passenger's kinetic energy has the same value in every reference frame."
        - "If the net work done on an object is zero, its speed at the end equals its speed at the start."
      option_explanations:
        - |
          Correct. K = ½mv² depends on the square of the speed, so direction does not matter.
        - |
          Kinetic energy is never negative: v² is positive whichever way the object moves.
        - |
          Correct. ½(2.0)(3.0)² = 9.0 J, while ½(1.0)(4.0)² = 8.0 J.
        - |
          Speed depends on the frame (a seated passenger is at rest relative to the train), so kinetic energy does too.
        - |
          Correct. By the work–energy theorem, W_net = ΔK = 0, so K and therefore the speed are unchanged.
      answer: [0, 2, 4]
    - slug: apphys1-u03-w12-q16
      type: true_false
      topic_code: "3.2"
      source: "AP Physics 1 CED, Topic 3.2"
      points: 1
      prompt: |
        True or false: A student holding a 15 kg box motionless at chest height for two minutes does positive work on the box.
      answer: false
      explanation: |
        False. Work requires a displacement: W = Fd cos θ with d = 0 gives zero. The student's muscles convert chemical energy into thermal energy internally, which is why she tires, but no energy is transferred to the box, whose kinetic and potential energy do not change.
