week: 15
unit: 3
title: "Power"
topics: ["3.5"]
guide: guides/week-15.md
guide_description: |
  Power as the rate of energy transfer: average power P = ΔE/Δt = W/Δt, instantaneous power P = Fv cos θ, the watt
  and the kilowatt-hour, power as the slope of an energy–time graph and energy as the area under a power–time graph,
  why average and instantaneous power differ when the speed changes, and a lab that linearises motor data. Worked
  examples: a 60 kg student running and walking up a 3.6 m staircase, a car cruising at 25 m/s against 600 N (and
  the v³ growth of power with drag), an 800 kg elevator at two speeds with a zero-speed limiting case, a 1,200 kg
  car accelerating from rest (instantaneous power twice the average), a winch read from an energy–time table, and
  a small motor's power from a time-against-mass graph.
flashcards_description: |
  30 cards on power: definitions and units, average versus instantaneous power, P = Fv at constant speed and
  while accelerating, power on hills and in elevators, energy–time and power–time graphs, functional
  dependence on speed and mass, a motor-power lab, and three error-spot cards.

flashcards:
  - front: Power → definition
    back: |
      The rate at which energy is transferred into, out of or within a system: P = ΔE/Δt.
    topic_code: "3.5"
  - front: Watt → in base terms
    back: |
      1 W = 1 J/s = 1 kg·m²/s³.
    topic_code: "3.5"
  - front: Kilowatt-hour → power or energy?
    back: |
      Energy: a power times a time. 1 kW·h = (1,000 J/s)(3,600 s) = 3.6 × 10⁶ J.
    topic_code: "3.5"
  - front: Average power of a force over an interval → formula
    back: |
      P_avg = W/Δt, the work done by the force divided by the time taken.
    topic_code: "3.5"
  - front: Instantaneous power delivered by a force → formula
    back: |
      P = Fv cos θ, with θ the angle between the force and the velocity. Only the force component along the motion delivers power.
    topic_code: "3.5"
  - front: Where P = Fv comes from → one-line argument
    back: |
      In a short time Δt the object moves vΔt, so the force does work FvΔt; divide by Δt.
    topic_code: "3.5"
  - front: Force perpendicular to the velocity → power it delivers
    back: |
      Zero, because cos 90° = 0: the tension on a ball in uniform circular motion delivers no power.
    topic_code: "3.5"
  - front: 60 kg student runs up 3.6 m of stairs in 4.5 s → average power
    back: |
      mgh/t = (60)(9.8)(3.6)/4.5 ≈ 470 W. Walking it in 12 s: about 176 W for the same 2,117 J.
    topic_code: "3.5"
  - front: Same staircase climbed in half the time → work and power
    back: |
      Same work (same ΔU_g); twice the power.
    topic_code: "3.5"
  - front: Car at constant 25 m/s against 600 N of drag → engine power delivered to the car
    back: |
      Driving force = 600 N (zero net force), so P = Fv = (600)(25) = 15 kW, all converted into internal energy by drag.
    topic_code: "3.5"
  - front: Power needed at constant speed when drag grows with v² → dependence on speed
    back: |
      P = F_drag v grows with v³: going 20% faster takes about 73% more power.
    topic_code: "3.5"
  - front: Elevator raising a cab at constant speed → power formula
    back: |
      P = Tv = mgv: the tension equals the weight at constant speed. 800 kg at 1.25 m/s needs 9,800 W.
    topic_code: "3.5"
  - front: Elevator speed doubled, same cab and height → power and energy
    back: |
      Power doubles; energy delivered (mgh) is unchanged, because the trip takes half as long.
    topic_code: "3.5"
  - front: Motor holding a load still (v = 0) → power delivered to the load
    back: |
      Zero: a force with no motion transfers no energy, even though the motor must supply tension.
    topic_code: "3.5"
  - front: Car accelerating from rest with constant net force → how its power changes
    back: |
      P = Fv increases in proportion to v, so it grows steadily; the power–time graph is a straight line from zero.
    topic_code: "3.5"
  - front: Constant force from rest, average versus final instantaneous power → ratio
    back: |
      P_avg = ½ P_final. Example: 1,200 kg, 0 to 20 m/s in 8.0 s: P_avg = 30 kW, P at 20 m/s = 60 kW.
    topic_code: "3.5"
  - front: Energy–time graph → what the slope gives
    back: |
      The power. A straight line means constant power; a steeper section means a higher power.
    topic_code: "3.5"
  - front: Power–time graph → what the area gives
    back: |
      The energy transferred over that interval (W × s = J).
    topic_code: "3.5"
  - front: Winch raising a crate, U_g rises 1,200 J in the first 4.0 s and 600 J in the next 4.0 s → powers
    back: |
      300 W, then 150 W; 225 W averaged over all 8.0 s.
    topic_code: "3.5"
  - front: Cyclist climbing a hill at constant speed → where the power goes
    back: |
      Into gravitational potential energy (mgv sin θ) and into internal energy through drag and rolling resistance (F_r v).
    topic_code: "3.5"
  - front: Power to climb a slope at speed v → gravity part
    back: |
      P_g = mg v sin θ, because the component of weight along the slope is mg sin θ.
    topic_code: "3.5"
  - front: Crane lifting 450 kg by 12 m at constant speed in 15 s → power
    back: |
      mgh/t = (450)(9.8)(12)/15 ≈ 3.5 kW.
    topic_code: "3.5"
  - front: Hair dryer rated 1,500 W running for 2.0 minutes → energy used
    back: |
      E = Pt = (1,500 W)(120 s) = 180,000 J = 180 kJ.
    topic_code: "3.5"
  - front: Motor lifting masses m through a fixed height at constant power → what to graph
    back: |
      Time t against m: a straight line through the origin with slope gh/P, so P = gh/slope.
    topic_code: "3.5"
  - front: Motor lab slope of t against m is 2.0 s/kg for h = 1.00 m → motor power
    back: |
      P = gh/slope = (9.8)(1.00)/2.0 ≈ 4.9 W.
    topic_code: "3.5"
  - front: Motor lab t–m graph curving upward at large masses → interpretation
    back: |
      Heavier loads take disproportionately longer, so the motor's output power drops under load; the constant-power model fails there.
    topic_code: "3.5"
  - front: Power and the work–energy theorem → link
    back: |
      The net power on an object is the rate of change of its kinetic energy: P_net = ΔK/Δt.
    topic_code: "3.5"
  - front: Error-spot → "the 2,000 W motor did more work than the 1,000 W motor"
    back: |
      Power is a rate. For the same task both do the same work; the 2,000 W motor finishes in half the time.
    topic_code: "3.5"
  - front: Error-spot → "my electricity bill charges for 600 kilowatt-hours of power"
    back: |
      A kilowatt-hour is energy (power × time). The bill charges for 600 kW·h = 2.16 × 10⁹ J of energy.
    topic_code: "3.5"
  - front: Error-spot → "the car's engine power at constant highway speed is mg × v"
    back: |
      On a level road the driving force balances drag and rolling resistance, not weight: P = F_resist v.
    topic_code: "3.5"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topic 3.5: average and instantaneous power, P = Fv,
    power at constant speed against resistance, on hills, in elevators and while accelerating, energy–time and
    power–time graphs, units, and measuring power), with 8 questions (32%) reviewing earlier weeks (Newton's
    second law in an elevator, friction on an incline, kinetic and potential energy, work by gravity, and
    conservation of energy). Opens with a shared-context set on a cyclist climbing a hill. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
    Calculators and the equation sheet are allowed throughout, as on the AP exam.
  questions:
    # ---- Stimulus set: cyclist climbing a hill (3.5, 3.3)
    - slug: apphys1-u03-w15-q01
      type: multiple_choice
      topic_code: "3.5"
      source: "AP Physics 1 CED, Topic 3.5"
      points: 1
      stimulus: |
        A cyclist and her bicycle have a combined mass of 75 kg. She rides up a straight hill at a constant 4.0 m/s. The road rises 1.0 m vertically for every 10 m travelled along it (sin θ = 0.10). Air drag and rolling resistance together exert a constant 20 N opposing her motion. Use g = 9.8 m/s².
      prompt: |
        At what rate is the gravitational potential energy of the cyclist–Earth system increasing?
      options:
        - "2,940 W"
        - "294 W"
        - "73.5 W"
        - "80 W"
      option_explanations:
        - |
          2,940 W is mgv, which treats her as rising vertically at 4.0 m/s; she rises only 0.10 m per metre travelled.
        - |
          Correct. The vertical speed is v sin θ = 0.40 m/s, so ΔU_g/Δt = mg v sin θ = (75)(9.8)(4.0)(0.10) = 294 W.
        - |
          73.5 W is the component of weight along the slope in newtons, mg sin θ, not yet multiplied by the speed.
        - |
          80 W is the power going to drag and rolling resistance, (20 N)(4.0 m/s), not the rate of change of U_g.
      answer: 1
    - slug: apphys1-u03-w15-q02
      type: multiple_choice
      topic_code: "3.5"
      source: "AP Physics 1 CED, Topic 3.5"
      points: 1
      stimulus: |
        A cyclist and her bicycle have a combined mass of 75 kg. She rides up a straight hill at a constant 4.0 m/s. The road rises 1.0 m vertically for every 10 m travelled along it (sin θ = 0.10). Air drag and rolling resistance together exert a constant 20 N opposing her motion. Use g = 9.8 m/s².
      prompt: |
        What total mechanical power must the cyclist deliver to the bicycle's motion to keep climbing at 4.0 m/s?
      options:
        - "294 W"
        - "80 W"
        - "214 W"
        - "374 W"
      option_explanations:
        - |
          294 W covers only the gain in potential energy; the resistive forces also convert energy at (20 N)(4.0 m/s) = 80 W.
        - |
          80 W covers only the resistive forces; climbing also raises the system's potential energy at 294 W.
        - |
          214 W subtracts the resistive power from the climbing power; resistance is extra work she must supply, not help.
        - |
          Correct. At constant speed the driving force balances mg sin θ + 20 N = 73.5 + 20 = 93.5 N, so P = (93.5 N)(4.0 m/s) = 374 W.
      answer: 3
    - slug: apphys1-u03-w15-q03
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Physics 1 CED, Topic 3.3"
      points: 1
      stimulus: |
        A cyclist and her bicycle have a combined mass of 75 kg. She rides up a straight hill at a constant 4.0 m/s. The road rises 1.0 m vertically for every 10 m travelled along it (sin θ = 0.10). Air drag and rolling resistance together exert a constant 20 N opposing her motion. Use g = 9.8 m/s².
      prompt: |
        By how much does the gravitational potential energy of the cyclist–Earth system increase while she rides 200 m along the road?
      options:
        - "14,700 J"
        - "147,000 J"
        - "1,470 J"
        - "18,700 J"
      option_explanations:
        - |
          Correct. She rises 200 × 0.10 = 20 m, so ΔU_g = mgΔy = (75)(9.8)(20) = 14,700 J.
        - |
          147,000 J uses the 200 m along the road as the height gained; only the vertical rise of 20 m counts.
        - |
          1,470 J uses a rise of 2.0 m, dividing by 100 instead of 10.
        - |
          18,700 J is the total energy she supplies, including the 4,000 J converted by the resistive forces, not the change in U_g alone.
      answer: 0
    - slug: apphys1-u03-w15-q04
      type: numeric
      topic_code: "3.5"
      source: "AP Physics 1 CED, Topic 3.5"
      points: 1
      stimulus: |
        A cyclist and her bicycle have a combined mass of 75 kg. She rides up a straight hill at a constant 4.0 m/s. The road rises 1.0 m vertically for every 10 m travelled along it (sin θ = 0.10). Air drag and rolling resistance together exert a constant 20 N opposing her motion. Use g = 9.8 m/s².
      prompt: |
        How much mechanical energy does the cyclist deliver to the bicycle's motion during the 200 m ride along the road? Give your answer in kilojoules to three significant figures.
      answer: { value: 18.7, tolerance: 0.15 }
      explanation: |
        The ride takes 200 m / 4.0 m/s = 50 s. At 374 W, the energy is (374)(50) = 18,700 J = 18.7 kJ. Check: 14,700 J of potential energy plus (20 N)(200 m) = 4,000 J converted by resistance. (With g = 10, it would be 19.0 kJ.)
    # ---- Independent items
    - slug: apphys1-u03-w15-q05
      type: multiple_choice
      topic_code: "3.5"
      source: "AP Physics 1 CED, Topic 3.5"
      points: 1
      prompt: |
        A 50 kg student climbs a flight of stairs that rises 4.0 m vertically in 5.0 s. What average power does she deliver to raise herself?
      options:
        - "40 W"
        - "1,960 W"
        - "392 W"
        - "98 W"
      option_explanations:
        - |
          40 W is mass × height / time with g left out, (50)(4.0)/5.0; the energy needed is mgh, not mh.
        - |
          1,960 J is the energy, mgh = (50)(9.8)(4.0); power needs that divided by the 5.0 s.
        - |
          Correct. P = mgh/t = (50)(9.8)(4.0)/5.0 = 1,960 J / 5.0 s = 392 W.
        - |
          98 W divides by 20 instead of 5.0, multiplying the time by the height; power is energy divided by time only.
      answer: 2
    - slug: apphys1-u03-w15-q06
      type: multiple_choice
      topic_code: "3.5"
      source: "AP Physics 1 CED, Topic 3.5"
      points: 1
      prompt: |
        Two identical boxes are lifted onto the same shelf. Robot A lifts its box in 4.0 s; robot B lifts its box in 2.0 s. Each box starts and ends at rest. Which comparison is correct?
      options:
        - "Robot B does twice as much work and delivers twice the power."
        - "Both robots do the same work; robot B delivers twice the power."
        - "Both robots deliver the same power; robot B does half the work."
        - "Robot A does more work because it pushes for longer."
      option_explanations:
        - |
          The work equals the box–Earth system's gain in U_g, mgh, which is the same for both boxes; only the rate differs.
        - |
          Correct. The same ΔU_g = mgh means the same work; doing it in half the time means twice the power, P = W/Δt.
        - |
          The work is fixed by the task (mgh); robot B does the same work in less time, so its power is greater, not equal.
        - |
          Pushing for longer does not mean more work; work depends on force and displacement, which are the same for both boxes.
      answer: 1
    - slug: apphys1-u03-w15-q07
      type: multiple_choice
      topic_code: "3.5"
      source: "AP Physics 1 CED, Topic 3.5"
      points: 1
      prompt: |
        A delivery van cruises at a constant 20 m/s on a level road. The total resistive force from air and road is 500 N. What power does the road's forward driving force deliver to the van?
      options:
        - "10 kW"
        - "25 W"
        - "0 W, because the van's kinetic energy is constant"
        - "20 kW"
      option_explanations:
        - |
          Correct. Constant velocity means the driving force equals the 500 N of resistance, so P = Fv = (500 N)(20 m/s) = 10,000 W = 10 kW.
        - |
          25 is 500/20, dividing force by speed; power is force times speed.
        - |
          The net power is zero, but the driving force alone delivers 10 kW, which the resistive forces convert into internal energy at the same rate.
        - |
          20 kW doubles the correct value, as if the driving force had to be twice the resistance; at constant velocity they are equal.
      answer: 0
    - slug: apphys1-u03-w15-q08
      type: multiple_choice
      topic_code: "3.5"
      source: "AP Physics 1 CED, Topic 3.5"
      points: 1
      prompt: |
        Which of these is a unit of energy rather than of power?
      options:
        - "Watt"
        - "Joule per second"
        - "Kilogram·metre² per second³"
        - "Kilowatt-hour"
      option_explanations:
        - |
          The watt is the SI unit of power, equal to one joule per second.
        - |
          A joule per second is the definition of the watt, a rate of energy transfer.
        - |
          kg·m²/s³ is the watt written in base units: (kg·m²/s²)/s, energy per time.
        - |
          Correct. A kilowatt-hour is a power multiplied by a time, so it measures energy: 1 kW·h = 3.6 × 10⁶ J.
      answer: 3
    - slug: apphys1-u03-w15-q09
      type: multiple_choice
      topic_code: "3.5"
      source: "AP Physics 1 CED, Topic 3.5"
      points: 1
      prompt: |
        The kinetic energy of a go-kart is recorded as it speeds up:

        | Time (s) | 0 | 2.0 | 4.0 | 6.0 |
        |---|---|---|---|---|
        | K (J) | 0 | 1,000 | 3,000 | 6,000 |

        What is the average net power delivered to the go-kart between t = 2.0 s and t = 4.0 s?
      options:
        - "1,500 W, from 3,000 J at t = 4.0 s"
        - "750 W"
        - "1,000 W"
        - "2,000 W"
      option_explanations:
        - |
          Power is the slope of the energy–time graph, the change in K over the interval, not K at one instant divided by the clock time.
        - |
          750 W is 3,000 J / 4.0 s, using the energy at t = 4.0 s and the full time from zero, which is the average over 0 to 4.0 s.
        - |
          Correct. P_avg = ΔK/Δt = (3,000 − 1,000) J / (4.0 − 2.0) s = 2,000/2.0 = 1,000 W.
        - |
          2,000 W uses the change in K, 2,000 J, without dividing by the 2.0 s interval.
      answer: 2
    - slug: apphys1-u03-w15-q10
      type: multiple_choice
      topic_code: "3.5"
      source: "AP Physics 1 CED, Topic 3.5"
      points: 1
      prompt: |
        A cart starts from rest and is pushed along a level, frictionless track by a constant horizontal force. How does the power delivered by the force change as the cart speeds up?
      options:
        - "It increases in proportion to the cart's speed."
        - "It stays constant, because the force is constant."
        - "It decreases, because less force is needed once the cart is moving."
        - "It increases in proportion to the square of the speed, like the kinetic energy."
      option_explanations:
        - |
          Correct. P = Fv: with F constant, the power grows in proportion to v. (That is why the average power from rest is half the final power.)
        - |
          A constant force gives a constant acceleration, not a constant power; the work done per second grows as the cart covers more distance each second.
        - |
          The force is stated to be constant; with no friction it keeps accelerating the cart, and the power rises.
        - |
          The kinetic energy grows with v², but the power is its rate of change, P = Fv, which grows in proportion to v.
      answer: 0
    - slug: apphys1-u03-w15-q11
      type: multiple_choice
      topic_code: "3.1"
      source: "AP Physics 1 CED, Topic 3.1"
      points: 1
      prompt: |
        A 0.058 kg tennis ball is served at 50 m/s. What is its kinetic energy?
      options:
        - "1.45 J"
        - "2.9 J"
        - "145 J"
        - "72.5 J"
      option_explanations:
        - |
          1.45 is ½mv with the speed not squared, ½(0.058)(50); the unit would not be joules.
        - |
          2.9 is mv, the ball's momentum in kg·m/s, not its kinetic energy.
        - |
          145 J is mv², leaving out the ½ in the kinetic energy formula.
        - |
          Correct. K = ½mv² = ½(0.058)(50)² = ½(0.058)(2,500) = 72.5 J.
      answer: 3
    - slug: apphys1-u03-w15-q12
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      prompt: |
        A pendulum bob is released from rest 0.45 m above its lowest point. Ignoring air resistance, how fast is it moving at the lowest point?
      options:
        - "8.8 m/s"
        - "3.0 m/s"
        - "2.1 m/s"
        - "4.4 m/s"
      option_explanations:
        - |
          8.8 is 2gh = 8.82 m²/s², which is v², with the square root forgotten.
        - |
          Correct. With the bob–Earth system closed and the string doing no work, mgh = ½mv², so v = √(2gh) = √(2 × 9.8 × 0.45) ≈ 3.0 m/s.
        - |
          2.1 m/s is √(gh), leaving out the factor 2 that comes from the ½ in ½mv².
        - |
          4.4 is gh = 4.41, which is half of v², used as a speed.
      answer: 1
    - slug: apphys1-u03-w15-q13
      type: multiple_choice
      topic_code: "3.2"
      source: "AP Physics 1 CED, Topic 3.2"
      points: 1
      prompt: |
        A 2.0 kg box slides 3.0 m down a ramp inclined at 30° to the horizontal. How much work does gravity do on the box?
      options:
        - "58.8 J, from mg × 3.0 m"
        - "51 J, using cos 30°"
        - "29.4 J"
        - "−29.4 J"
      option_explanations:
        - |
          58.8 J multiplies the whole weight by the distance along the ramp; only the component of weight along the ramp, mg sin 30°, does work (or, equivalently, use the 1.5 m vertical drop).
        - |
          51 J uses cos 30°: the angle between the weight and the displacement is 60°, so the correct factor is cos 60° = sin 30° = 0.50.
        - |
          Correct. The box drops 3.0 sin 30° = 1.5 m, so W_g = mgΔh = (2.0)(9.8)(1.5) = 29.4 J, positive because the box moves downhill.
        - |
          The size is right, but gravity does positive work on a box moving down the ramp; it is ΔU_g that equals −29.4 J.
      answer: 2
    - slug: apphys1-u03-w15-q14
      type: multiple_choice
      topic_code: "2.7"
      source: "AP Physics 1 CED, Topic 2.7"
      points: 1
      prompt: |
        A book slides down a board tilted at 25° to the horizontal at constant speed. What is the coefficient of kinetic friction between the book and the board?
      options:
        - "0.47"
        - "0.42"
        - "0.91"
        - "It depends on the book's mass."
      option_explanations:
        - |
          Correct. Constant speed means zero net force: mg sin 25° = μ_k mg cos 25°, so μ_k = tan 25° ≈ 0.47.
        - |
          0.42 is sin 25°, which leaves out the normal force mg cos 25° in the friction law.
        - |
          0.91 is cos 25°, which inverts the balance: friction must match the component of weight along the board.
        - |
          The mass appears in both the friction force and the weight component, so it cancels: μ_k = tan θ.
      answer: 0
    - slug: apphys1-u03-w15-q15
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 1
      prompt: |
        A 60 kg student stands on a bathroom scale in an elevator that is accelerating upward at 1.5 m/s². What does the scale read?
      options:
        - "588 N"
        - "90 N"
        - "498 N"
        - "678 N"
      option_explanations:
        - |
          588 N is the student's weight, mg; it would be the reading only if the acceleration were zero.
        - |
          90 N is ma, the net force, not the normal force the scale exerts.
        - |
          498 N subtracts ma from mg, which is the reading for a downward acceleration.
        - |
          Correct. The scale reads the normal force: F_N − mg = ma, so F_N = m(g + a) = 60(9.8 + 1.5) = 678 N.
      answer: 3
    - slug: apphys1-u03-w15-q16
      type: multi_select
      topic_code: "3.5"
      source: "AP Physics 1 CED, Topic 3.5"
      points: 2
      partial_credit: true
      prompt: |
        An elevator motor raises a loaded cab at constant speed. Which changes would increase the power the motor must deliver to the cab? Select all that apply.
      options:
        - "Adding more passengers, at the same speed"
        - "Raising the cab at a greater constant speed"
        - "Raising the cab to a higher floor, at the same speed"
        - "Raising the cab through the same height in less time"
        - "Adding a counterweight on the other end of the cable that is lighter than the cab"
      option_explanations:
        - |
          Correct. P = Tv = mgv at constant speed; a larger mass needs a larger tension at the same speed.
        - |
          Correct. With the same tension (mg), a greater speed means a larger P = Tv.
        - |
          A higher floor means more energy delivered, but at the same speed it takes longer; the power, mgv, is unchanged.
        - |
          Correct. Less time for the same height means a greater speed and a greater rate of energy transfer, mgh/Δt.
        - |
          A counterweight descending as the cab rises supplies part of the energy, so the motor's tension, and its power, are reduced, not increased.
      answer: [0, 1, 3]
    - slug: apphys1-u03-w15-q17
      type: multi_select
      topic_code: "3.5"
      source: "AP Physics 1 CED, Topic 3.5"
      points: 2
      partial_credit: true
      prompt: |
        A winch motor delivers a constant 200 W for 10 s and then shuts off. Which statements are correct? Select all that apply.
      options:
        - "The motor delivers 2,000 J of energy."
        - "A graph of the energy delivered against time is a straight line with slope 200 W for the first 10 s."
        - "The force the motor exerts must be constant during the 10 s."
        - "The motor delivers 20 J of energy."
        - "Delivering the same energy in 5.0 s would require 400 W."
      option_explanations:
        - |
          Correct. Energy is the area under the power–time graph: (200 W)(10 s) = 2,000 J.
        - |
          Correct. Constant power means energy rises at a steady rate; the slope of energy against time is the power.
        - |
          Constant power only fixes the product Fv; if the load speeds up or slows down, the force changes.
        - |
          20 J divides the power by the time; energy is power multiplied by time.
        - |
          Correct. P = ΔE/Δt = 2,000 J / 5.0 s = 400 W.
