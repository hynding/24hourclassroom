    - slug: apphys1-u03-w15-q18
      type: true_false
      topic_code: "3.5"
      source: "AP Physics 1 CED, Topic 3.5"
      points: 1
      prompt: |
        True or false: A 2,000 W motor always does more work than a 1,000 W motor.
      answer: false
      explanation: |
        False. Power is the rate of doing work. Lifting the same load through the same height, both motors do the same work (mgh); the 2,000 W motor simply finishes in half the time. Run for different times, either one could do more work.
    - slug: apphys1-u03-w15-q19
      type: true_false
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      prompt: |
        True or false: When a box slides to rest on a rough floor, the total energy of the box–floor–Earth system stays constant even though its mechanical energy decreases.
      answer: true
      explanation: |
        True. No external work is done on this system, so its total energy is constant. Friction is internal: it converts the box's kinetic energy into internal (thermal) energy of the box and the floor, so mechanical energy decreases by exactly the amount internal energy increases.
