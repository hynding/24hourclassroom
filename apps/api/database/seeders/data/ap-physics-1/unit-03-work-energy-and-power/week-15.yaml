      answer: { value: 3530, tolerance: 30 }
      explanation: |
        The energy delivered is ΔU_g = mgh = (450)(9.8)(12) = 52,920 J, so P = 52,920 J / 15 s = 3,528 W ≈ 3,530 W. Equivalently, P = mgv with v = 0.80 m/s. (With g = 10 the result would be 3,600 W.)
    - slug: apphys1-u03-w15-q23
      type: short_answer
