      points: 1
      prompt: |
        A ski lift pulls the same load of skiers up the same slope, first at 2.0 m/s and then at 4.0 m/s, each at constant speed. Compared with the slower trip, the power the lift delivers on the faster trip ____ (answer with one word).
      answer: ["doubles", "double", "doubled", "twice"]
      explanation: |
        At constant speed the pulling force is the same (it balances the same weight component and friction), and P = Fv, so doubling the speed doubles the power. The energy delivered per trip is the same; the faster trip takes half the time.
