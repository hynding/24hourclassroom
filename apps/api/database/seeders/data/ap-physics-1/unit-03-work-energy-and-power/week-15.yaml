      source: "AP Physics 1 CED, Topic 3.5"
      points: 3
      prompt: |
        A motor's output power rises steadily from 0 W at t = 0 to 400 W at t = 5.0 s, then stays at 400 W until t = 10 s.

        (a) How much energy does the motor deliver from t = 0 to t = 10 s? Show how you used the power–time graph.
        (b) What is the motor's average power over the 10 s?
        (c) Describe the shape of a graph of the total energy delivered against time from 0 to 10 s.
      answer: |
        (a) Area under the power–time graph: triangle ½(5.0 s)(400 W) = 1,000 J plus rectangle (5.0 s)(400 W) = 2,000 J, total 3,000 J.
        (b) P_avg = 3,000 J / 10 s = 300 W.
        (c) From 0 to 5.0 s the energy curve starts flat and gets steeper (its slope, the power, increases from 0 to 400 W), reaching 1,000 J at 5.0 s. From 5.0 s to 10 s it is a straight line with slope 400 W, rising to 3,000 J.
      explanation: |
        Three points, one per part. (a) 3,000 J from the two areas. (b) 300 W (total energy over total time; averaging 200 W and 400 W to get 300 W only by coincidence earns the point if the method is energy over time). (c) A curve of increasing slope, then a straight line of slope 400 W, with the slope identified as the power.
    - slug: apphys1-u03-w15-q24
      type: short_answer
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 3
      prompt: |
        A 0.50 kg block slides at 3.0 m/s across a frictionless floor, crosses a rough patch 0.60 m long (μ_k = 0.30), and then slides on frictionless floor into a spring with k = 200 N/m.

        (a) Taking the block, floor, spring and Earth as the system, how much of the block's kinetic energy is converted to internal energy on the rough patch?
        (b) What is the spring's maximum compression?
        (c) The spring pushes the block back across the rough patch. Does the block make it all the way across? Justify with energy.
      answer: |
        (a) ΔE_int = μ_k mg d = (0.30)(0.50)(9.8)(0.60) ≈ 0.88 J (of the initial K = ½(0.50)(3.0)² = 2.25 J).
        (b) The spring receives 2.25 − 0.88 = 1.37 J: ½kx² = 1.37 J, so x = √(2 × 1.37/200) ≈ 0.12 m.
        (c) Yes. Crossing the patch again converts another 0.88 J, leaving 1.37 − 0.88 ≈ 0.49 J of kinetic energy, so the block leaves the patch moving at about √(2 × 0.49/0.50) ≈ 1.4 m/s.
      explanation: |
        Three points, one per part. (a) 0.88 J from friction force × distance. (b) 0.12 m from the remaining energy stored as ½kx². (c) Yes, with the remaining energy after a second 0.88 J loss shown to be positive (a speed is not required).
    - slug: apphys1-u03-w15-q25
      type: long_answer
      topic_code: "3.5"
      source: "AP Physics 1 CED, Topic 3.5"
      points: 6
      prompt: |
        Qualitative/quantitative translation. A car of mass m starts from rest on a level road and speeds up with a constant net force F for a time t. Ignore resistive forces.

        (A) Without equations, explain in a short paragraph whether the power delivered by the net force increases, decreases or stays the same as the car speeds up, and whether the average power over the time t is greater than, less than or equal to the power at the end of the interval.

        (B) Derive expressions, in terms of F, m and t, for the car's speed at the end of the interval, the power delivered by the net force at the end of the interval, and the average power over the interval.

        (C) Show that your expressions in (B) agree with your reasoning in (A). Then evaluate them for m = 1,200 kg, F = 3,000 N and t = 8.0 s.
      answer: |
        (A) The power increases. The force is constant, but as the car speeds up it covers more distance each second, so the force does more work each second. Because the power grows steadily from zero, the average power over the interval is less than the power at the end (it is half of it, since the power grows at a steady rate).
        (B) a = F/m, so v = Ft/m. Final power: P = Fv = F²t/m. Average power: ΔK/t = ½m(Ft/m)²/t = F²t/(2m).
        (C) P_final = F²t/m increases with t (with speed), and P_avg = F²t/(2m) is exactly half of it, as argued in (A). Numbers: v = (3,000)(8.0)/1,200 = 20 m/s; P_final = (3,000)(20) = 60,000 W = 60 kW; P_avg = 30,000 W = 30 kW (ΔK = 240,000 J over 8.0 s).
      explanation: |
        Six points.
        (A) 2 points: 1 for "power increases" with reasoning (same force, more distance per second, or P = Fv with v increasing); 1 for "average less than final" with reasoning (power grows from zero). An answer that the power is constant because the force is constant earns 0 for that point.
        (B) 2 points: 1 for v = Ft/m and P_final = F²t/m (or Fv); 1 for P_avg = F²t/(2m) from ΔK/t (or the average of a linearly increasing power).
        (C) 2 points: 1 for showing the factor of one half and the growth with t match (A); 1 for v = 20 m/s, P_final = 60 kW and P_avg = 30 kW. Expressions that contradict (A) without comment earn at most 1 point in (C).
