week: 14
unit: 3
title: "Conservation of Energy"
topics: ["3.4"]
guide: guides/week-14.md
guide_description: |
  Energy conservation as bookkeeping for a chosen system: closed and open systems, when mechanical energy K + U is
  constant and when friction turns it into internal energy, the full equation K_i + U_i + W_ext = K_f + U_f +
  ΔE_int, energy bar charts at several states, functional dependence and limiting cases, and linearising lab
  data. Worked examples: a skateboarder's 3.2 m half-pipe drop, a vertical spring launcher (k = 250 N/m, 3.7 m
  rise) with a three-state bar chart, a 30 kg sled sliding to rest on snow, a cart pulled up a 20° ramp as an open
  system, a playground swing released at 40° with its limiting cases, and a spring-launcher lab whose v–x graph
  gives the spring constant.
flashcards_description: |
  30 cards on conservation of energy: choosing systems and classifying them, which forces are internal or
  external, mechanical versus internal energy, energy equations for drops, springs, swings and friction, bar
  charts, functional dependence of speed and height, linearising energy lab data, and three error-spot cards.

flashcards:
  - front: Conservation of energy for a system → statement
    back: |
      The total energy of a system changes only by the energy transferred across its boundary (external work). Inside, energy only changes form.
    topic_code: "3.4"
  - front: Closed (isolated) system → what is true of its energy
    back: |
      No external work is done on it, so its total energy (K + U + E_int) stays constant.
    topic_code: "3.4"
  - front: Open system → energy equation
    back: |
      K_i + U_i + W_ext = K_f + U_f + ΔE_int. External work adds energy (positive) or removes it (negative).
    topic_code: "3.4"
  - front: Mechanical energy of a system → when it is constant
    back: |
      When no external work is done and no nonconservative force (friction, drag) acts inside the system: K_i + U_i = K_f + U_f.
    topic_code: "3.4"
  - front: Gravity in the energy equation → internal or external?
    back: |
      Internal (shown as U_g) if Earth is in the system; external (shown as work done by gravity) if it is not. Never both.
    topic_code: "3.4"
  - front: Friction in the energy equation → internal or external?
    back: |
      Internal, shown as ΔE_int = F_f d, if both surfaces are in the system; external negative work if the surface is left out.
    topic_code: "3.4"
  - front: Energy "lost" to friction → where it actually goes
    back: |
      Into internal (thermal) energy of the sliding object and the surface. Mechanical energy decreases; total energy does not.
    topic_code: "3.4"
  - front: Skateboarder dropping 3.2 m on a smooth half-pipe from rest → speed at the bottom
    back: |
      v = √(2gh) = √(2 × 9.8 × 3.2) ≈ 7.9 m/s, whatever her mass and whatever the ramp's shape.
    topic_code: "3.4"
  - front: Speed at the bottom of a smooth ramp → dependence on height and mass
    back: |
      v = √(2gh): independent of mass; doubling the height multiplies the speed by √2 ≈ 1.41.
    topic_code: "3.4"
  - front: Normal force on an object sliding along a smooth curved track → work done
    back: |
      Zero: the normal force is perpendicular to the track, and so to the motion, at every point.
    topic_code: "3.4"
  - front: Spring launching a block on a frictionless floor → launch speed
    back: |
      ½kx² = ½mv², so v = x√(k/m). Speed is proportional to compression.
    topic_code: "3.4"
  - front: Horizontal spring launcher, compression doubled → launch speed and kinetic energy
    back: |
      Launch speed doubles (v ∝ x); kinetic energy quadruples (½kx²).
    topic_code: "3.4"
  - front: Vertical spring launcher (k = 250 N/m, x = 0.12 m, 0.050 kg ball) → height reached
    back: |
      ½kx² = 1.8 J = mgh, so h ≈ 3.7 m above the compressed position.
    topic_code: "3.4"
  - front: Height reached by a vertically launched ball from a spring → symbolic form
    back: |
      h = kx²/(2mg): proportional to k and to x², inversely proportional to m.
    topic_code: "3.4"
  - front: Bar chart for a vertical spring launch → three states
    back: |
      Compressed: all U_s. Leaving the spring: mostly K, a little U_g. Top: all U_g. The totals match at every state.
    topic_code: "3.4"
  - front: 30 kg sled at 8.0 m/s on flat snow with μ_k = 0.10 → sliding distance
    back: |
      ½mv² = μ_k mg d, so d = v²/(2μ_k g) ≈ 33 m. The 960 J of kinetic energy becomes internal energy.
    topic_code: "3.4"
  - front: Bar chart for a sled sliding to rest (sled + Earth + snow system) → two states
    back: |
      Start: K bar only. Stopped: ΔE_int bar of the same height, K = 0. No external work bar.
    topic_code: "3.4"
  - front: Cart pulled up a smooth ramp by a string (cart + Earth system) → energy equation
    back: |
      W_string = ΔK + ΔU_g. The string is external; gravity is internal as U_g.
    topic_code: "3.4"
  - front: Swing or pendulum released at angle θ with chain length L → height drop to the bottom
    back: |
      h = L(1 − cos θ). For L = 2.0 m and θ = 40°, h ≈ 0.47 m and v = √(2gh) ≈ 3.0 m/s.
    topic_code: "3.4"
  - front: Swing released from horizontal (θ = 90°) → limiting-case check
    back: |
      h = L, so v = √(2gL): the same speed as falling the chain's length straight down. The tension does no work.
    topic_code: "3.4"
  - front: Ball thrown from a cliff at the same speed, once upward and once horizontally → landing speeds
    back: |
      Equal (no air resistance): same starting K and U_g, same final U_g, so the same final K. Directions differ.
    topic_code: "3.4"
  - front: Skier descends 25 m vertically and reaches 18 m/s (60 kg) → energy converted to internal energy
    back: |
      mgh − ½mv² = 14,700 − 9,720 = 4,980 J ≈ 5.0 × 10³ J went to friction and air drag.
    topic_code: "3.4"
  - front: Carts released from different ramp heights h, speeds v measured → what to graph
    back: |
      v² against h. Energy conservation predicts a straight line through the origin with slope 2g = 19.6 m/s².
    topic_code: "3.4"
  - front: Ramp lab slope of v² against h comes out 18 m/s², not 19.6 → interpretation
    back: |
      About 7% of the potential energy did not become translational kinetic energy: friction (and spinning wheels) took a share.
    topic_code: "3.4"
  - front: Spring-launcher lab, v against compression x → slope meaning
    back: |
      The slope is √(k/m), so k = m(slope)². A 0.40 kg cart and a slope of 19.8 s⁻¹ give k ≈ 160 N/m.
    topic_code: "3.4"
  - front: Energy equation check → how to test an answer with a limiting case
    back: |
      Set a quantity to zero or make it huge: no height should give no speed, no friction should give the frictionless answer, infinite mass should cancel if mass is absent.
    topic_code: "3.4"
  - front: Bottom of a swing → why the chain tension exceeds the child's weight
    back: |
      She moves in a circle, so the net force points up toward the centre: T − mg = mv²/L. Energy gives v; Newton's second law gives T.
    topic_code: "3.4"
  - front: Error-spot → "the heavier skateboarder reaches the bottom of the smooth ramp with a greater speed"
    back: |
      Mass cancels in mgh = ½mv². Both reach the same speed; the heavier one has more kinetic energy, not more speed.
    topic_code: "3.4"
  - front: Error-spot → "I counted mgh for the ball–Earth system and also the work done by gravity"
    back: |
      That counts gravity twice. With Earth inside the system use U_g only; with Earth outside use the work done by gravity only.
    topic_code: "3.4"
  - front: Error-spot → "friction destroyed 960 J of energy"
    back: |
      Energy is never destroyed. Friction converted 960 J of kinetic energy into internal energy of the sled and the snow.
    topic_code: "3.4"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topic 3.4: closed and open systems, conservation of
    mechanical energy, friction and internal energy, springs, swings and ramps, energy bar charts, functional
    dependence and linearising lab data), with 8 questions (32%) reviewing earlier weeks (projectile motion,
    circular motion, kinetic energy, work as an area, and potential energy). Opens with a shared-context set on a
    toy car on a curved track. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes. Calculators and the equation sheet are allowed throughout, as on the AP
    exam.
  questions:
    # ---- Stimulus set: toy car on a curved track (3.4)
    - slug: apphys1-u03-w14-q01
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      stimulus: |
        A 0.25 kg toy car is released from rest at point A on a curved track, 0.80 m above the floor. The track dips to point B at floor level, then rises over a hump whose top, point C, is 0.50 m above the floor. Unless a question says otherwise, treat the track as frictionless and ignore air resistance. Use g = 9.8 m/s².
      prompt: |
        What is the car's speed at point B?
      options:
        - "4.0 m/s"
        - "7.8 m/s"
        - "2.8 m/s"
        - "15.7 m/s"
      option_explanations:
        - |
          Correct. With the car–Earth system closed, mgh = ½mv², so v = √(2gh) = √(2 × 9.8 × 0.80) ≈ 3.96 m/s ≈ 4.0 m/s.
        - |
          7.8 is g × h = 7.84 m²/s², which is half of v², used as a speed with the factor 2 and the square root both missing.
        - |
          2.8 m/s is √(gh), which leaves out the factor 2 that comes from the ½ in ½mv².
        - |
          15.7 m/s is 2gh = 15.68 m²/s², which is v², with the square root forgotten.
      answer: 0
    - slug: apphys1-u03-w14-q02
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      stimulus: |
        A 0.25 kg toy car is released from rest at point A on a curved track, 0.80 m above the floor. The track dips to point B at floor level, then rises over a hump whose top, point C, is 0.50 m above the floor. Unless a question says otherwise, treat the track as frictionless and ignore air resistance. Use g = 9.8 m/s².
      prompt: |
        What is the car's speed at the top of the hump, point C?
      options:
        - "3.1 m/s, from a 0.50 m drop"
        - "0 m/s, because the car has climbed back up"
        - "2.4 m/s"
        - "1.7 m/s"
      option_explanations:
        - |
          3.1 m/s uses a drop of 0.50 m, the height of C, instead of the 0.30 m difference between A and C.
        - |
          The car would stop only at the height of A (0.80 m); at 0.50 m it still has the kinetic energy from the remaining 0.30 m of drop.
        - |
          Correct. Between A and C the car drops 0.80 − 0.50 = 0.30 m, so v = √(2 × 9.8 × 0.30) ≈ 2.4 m/s.
        - |
          1.7 m/s is √(gΔh) = √(9.8 × 0.30), which leaves out the factor 2 that comes from the ½ in ½mv².
      answer: 2
    - slug: apphys1-u03-w14-q03
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      stimulus: |
        A 0.25 kg toy car is released from rest at point A on a curved track, 0.80 m above the floor. The track dips to point B at floor level, then rises over a hump whose top, point C, is 0.50 m above the floor. Unless a question says otherwise, treat the track as frictionless and ignore air resistance. Use g = 9.8 m/s².
      prompt: |
        An energy bar chart for the car–Earth system, with the floor as the zero of U_g, is drawn for point C. Which describes it?
      options:
        - "K and U_g bars of equal height, because C is part-way up the track"
        - "A U_g bar of 1.2 J and a K bar of 0.74 J, totalling 1.96 J"
        - "A K bar of 1.96 J and no U_g bar"
        - "A U_g bar of 1.96 J and no K bar"
      option_explanations:
        - |
          Equal bars would occur at 0.40 m, half the starting height; at 0.50 m, U_g is 5/8 of the total and K is 3/8.
        - |
          Correct. Total = mgh_A = (0.25)(9.8)(0.80) = 1.96 J. At C, U_g = (0.25)(9.8)(0.50) ≈ 1.23 J and K = 1.96 − 1.23 ≈ 0.74 J.
        - |
          All kinetic energy and no potential energy describes point B at floor level, not the hump 0.50 m up.
        - |
          All potential energy describes point A, where the car is at rest; at C it is still moving.
      answer: 1
    - slug: apphys1-u03-w14-q04
      type: numeric
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      stimulus: |
        A 0.25 kg toy car is released from rest at point A on a curved track, 0.80 m above the floor. The track dips to point B at floor level, then rises over a hump whose top, point C, is 0.50 m above the floor. Unless a question says otherwise, treat the track as frictionless and ignore air resistance. Use g = 9.8 m/s².
      prompt: |
        On the real track, a photogate measures the car's speed at point B as 3.6 m/s. How much of the system's mechanical energy has been converted to internal energy between A and B? Give your answer in joules to two significant figures.
      answer: { value: 0.34, tolerance: 0.01 }
      explanation: |
        Start: U_g = mgh = (0.25)(9.8)(0.80) = 1.96 J, K = 0. At B: K = ½(0.25)(3.6)² = 1.62 J, U_g = 0. The missing mechanical energy, 1.96 − 1.62 = 0.34 J, became internal energy through friction and air drag (with the car, track and air in the system).
    # ---- Independent items
    - slug: apphys1-u03-w14-q05
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      prompt: |
        A 0.20 kg block on a frictionless table is pushed against a spring with k = 400 N/m, compressing it 0.050 m, and released. What is the block's speed after it leaves the spring?
      options:
        - "100 m/s"
        - "1.6 m/s"
        - "5.0 m/s"
        - "2.2 m/s"
      option_explanations:
        - |
          100 m/s is kx/m = 20 N/0.20 kg, which is the block's initial acceleration in m/s², not a speed.
        - |
          1.6 m/s comes from ½kx² = mv², dropping the ½ from the kinetic energy: v = √(0.50 J/0.20 kg) ≈ 1.6 m/s.
        - |
          5.0 m/s is v² = kx²/m = 5.0 m²/s², with the square root forgotten.
        - |
          Correct. ½kx² = ½mv², so v = x√(k/m) = 0.050 × √(400/0.20) = 0.050 × 44.7 ≈ 2.2 m/s.
      answer: 3
    - slug: apphys1-u03-w14-q06
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      prompt: |
        In a dart gun, a spring is compressed by a distance x and launches a dart horizontally. If the compression is doubled to 2x, by what factor does the dart's launch speed change? (Treat the spring as ideal and ignore friction.)
      options:
        - "It doubles."
        - "It quadruples."
        - "It increases by a factor of √2."
        - "It stays the same, because the same spring is used."
      option_explanations:
        - |
          Correct. ½kx² = ½mv² gives v = x√(k/m), so v is proportional to x: doubling the compression doubles the speed (while the kinetic energy quadruples).
        - |
          The stored energy, and so the kinetic energy, quadruples; the speed depends on the square root of the kinetic energy, so it only doubles.
        - |
          A factor of √2 would come from doubling the stored energy; doubling x quadruples ½kx².
        - |
          The spring constant is the same, but a larger compression stores more energy and gives a faster dart.
      answer: 0
    - slug: apphys1-u03-w14-q07
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      prompt: |
        A tire swing hangs from a 1.5 m rope. A student pulls it back until the rope makes 60° with the vertical and releases it from rest. Ignoring air resistance, how fast is the swing moving at its lowest point?
      options:
        - "5.4 m/s, from a drop of 1.5 m"
        - "2.7 m/s"
        - "3.8 m/s"
        - "5.0 m/s, from a drop of 1.5 sin 60°"
      option_explanations:
        - |
          5.4 m/s assumes the swing falls the full rope length; released at 60°, it drops only L(1 − cos 60°) = 0.75 m.
        - |
          2.7 m/s is √(gh) with h = 0.75 m, leaving out the factor 2 that comes from the ½ in ½mv².
        - |
          Correct. h = L(1 − cos 60°) = 1.5 × 0.50 = 0.75 m, so v = √(2 × 9.8 × 0.75) ≈ 3.8 m/s. The rope's tension is perpendicular to the path and does no work.
        - |
          L sin 60° ≈ 1.30 m is the horizontal distance from the vertical, not the height drop, which is L(1 − cos 60°) = 0.75 m.
      answer: 2
    - slug: apphys1-u03-w14-q08
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      prompt: |
        For which system is the total mechanical energy (K + U) guaranteed to stay constant?
      options:
        - "Any system, because energy is always conserved"
        - "A system on which no external work is done and inside which no friction or drag acts"
        - "Any system containing Earth, because then gravity is internal"
        - "Any system whose objects move at constant speed"
      option_explanations:
        - |
          Total energy is conserved, but mechanical energy can turn into internal energy or change through external work.
        - |
          Correct. With no external work, the total energy is constant, and with no nonconservative forces inside, none of it becomes internal energy, so K + U stays constant.
        - |
          Including Earth makes gravity internal, but friction inside or an external push can still change K + U.
        - |
          Constant speed means constant K, but U can still change, as for a box carried up stairs at steady speed.
      answer: 1
    - slug: apphys1-u03-w14-q09
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      prompt: |
        From the top of a cliff, a student throws one stone straight up and an identical stone horizontally, both at 12 m/s. Air resistance is negligible. How do their speeds just before hitting the ground below compare?
      options:
        - "The stone thrown upward lands faster, because it falls from a greater maximum height."
        - "The stone thrown horizontally lands faster, because it never slows down."
        - "It depends on the stones' masses."
        - "They land with the same speed."
      option_explanations:
        - |
          The upward stone climbs higher but starts its fall from rest at the top; overall it starts and ends at the same heights as the other stone with the same speed, so the energies match.
        - |
          The horizontal stone's speed only increases, but the upward stone's kinetic energy returns when it passes the cliff top again at 12 m/s.
        - |
          The stones are identical, and mass cancels anyway in ½mv_i² + mgh = ½mv_f².
        - |
          Correct. Each stone–Earth system starts with the same K and U_g and ends with the same U_g, so both have the same final K and speed; only the directions differ.
      answer: 3
    - slug: apphys1-u03-w14-q10
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      prompt: |
        A curling stone slides onto a rough patch of floor at 6.0 m/s. The coefficient of kinetic friction is 0.20. How far does it slide before stopping?
      options:
        - "9.2 m"
        - "18 m"
        - "1.5 m"
        - "3.1 m"
      option_explanations:
        - |
          Correct. ½mv² = μ_k mg d, so d = v²/(2μ_k g) = 36/(2 × 0.20 × 9.8) ≈ 9.2 m. The mass cancels.
        - |
          18 m leaves out the 2 in the denominator, as if the kinetic energy were mv².
        - |
          1.5 m is v/(2μ_k g) with the speed not squared; kinetic energy depends on v².
        - |
          3.1 m is v/(μ_k g), the time to stop in seconds, not the distance.
      answer: 0
    - slug: apphys1-u03-w14-q11
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      prompt: |
        A student releases a cart from rest at several heights h on a ramp and measures its speed v at the bottom. To test whether mechanical energy is conserved, what should she graph to get a straight line, and what slope does energy conservation predict?
      options:
        - "v against h; slope g"
        - "v² against h; slope 2g"
        - "v against √h; slope 2g"
        - "h against v²; slope 2g"
      option_explanations:
        - |
          v = √(2gh) is not linear in h, so v against h curves; and its slope would not be g.
        - |
          Correct. mgh = ½mv² gives v² = 2gh, a straight line through the origin with slope 2g = 19.6 m/s².
        - |
          v against √h is a straight line, but its slope is √(2g) ≈ 4.4, not 2g.
        - |
          h against v² is a straight line, but with the axes swapped the slope is 1/(2g), not 2g.
      answer: 1
    - slug: apphys1-u03-w14-q12
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Physics 1 CED, Topic 3.3"
      points: 1
      prompt: |
        A door-stop spring with k = 600 N/m is compressed 0.050 m. How much elastic potential energy does it store?
      options:
        - "30 J"
        - "1.5 J"
        - "0.75 J"
        - "15 J"
      option_explanations:
        - |
          30 is kx = 30 N, the spring force, not the energy.
        - |
          1.5 J is kx², without the ½ that comes from the triangular area under the force–compression graph.
        - |
          Correct. U_s = ½kx² = ½(600)(0.050)² = ½(600)(0.0025) = 0.75 J.
        - |
          15 is ½kx = 15, with the compression not squared; the unit would be N, not J.
      answer: 2
    - slug: apphys1-u03-w14-q13
      type: multiple_choice
      topic_code: "3.2"
      source: "AP Physics 1 CED, Topic 3.2"
      points: 1
      prompt: |
        A horizontal force on a sliding cart is +6.0 N from x = 0 to x = 2.0 m and −4.0 N from x = 2.0 m to x = 5.0 m (the cart keeps moving in the +x direction). What is the net work done by this force from x = 0 to x = 5.0 m?
      options:
        - "24 J"
        - "12 J"
        - "−12 J"
        - "0 J"
      option_explanations:
        - |
          24 J adds the two areas as if both were positive; the area below the axis is negative work.
        - |
          12 J counts only the positive area from 0 to 2.0 m and leaves out the negative part.
        - |
          −12 J counts only the negative area from 2.0 m to 5.0 m.
        - |
          Correct. The area above the axis is (6.0)(2.0) = +12 J and the area below is (−4.0)(3.0) = −12 J, so the net work is 0 and the cart ends with the speed it started with.
      answer: 3
    - slug: apphys1-u03-w14-q14
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Physics 1 CED, Topic 2.9"
      points: 1
      prompt: |
        A child on a playground swing passes through the lowest point of the arc. How does the tension in the chains compare with the child's weight at that instant?
      options:
        - "The tension is greater than the weight, because the net force points up toward the centre of the arc."
        - "The tension equals the weight, because the child is at the lowest point."
        - "The tension is less than the weight, because the child is moving fastest."
        - "The tension is zero, because the swing is in free fall."
      option_explanations:
        - |
          Correct. At the bottom the child moves in a circle, so the net force points up toward the pivot: T − mg = mv²/L, which makes T greater than mg.
        - |
          Equal forces would mean zero net force, but a child moving along a circle has a centripetal acceleration toward the pivot.
        - |
          Moving fastest means the required centripetal force mv²/L is largest, so the tension is largest there, not smallest.
        - |
          The chains are taut and pull up on the child; the swing is not in free fall.
      answer: 0
    - slug: apphys1-u03-w14-q15
      type: multiple_choice
      topic_code: "1.5"
      source: "AP Physics 1 CED, Topic 1.5"
      points: 1
      prompt: |
        A ball rolls off a 1.25 m high table at 3.0 m/s horizontally. Ignoring air resistance, how far from the base of the table does it land?
      options:
        - "3.8 m, from 3.0 m/s × 1.25 s"
        - "1.5 m"
        - "0.42 m"
        - "0.77 m"
      option_explanations:
        - |
          This treats the height in metres as a time in seconds; the fall time comes from 1.25 = ½gt².
        - |
          Correct. The fall time is t = √(2h/g) = √(2 × 1.25/9.8) ≈ 0.505 s, and the horizontal distance is (3.0 m/s)(0.505 s) ≈ 1.5 m.
        - |
          0.42 m divides the height by the speed, 1.25/3.0, which has no physical meaning here.
        - |
          0.77 m uses t² = 2h/g = 0.255 s² as if it were the fall time; the time is its square root, 0.505 s.
      answer: 1
    - slug: apphys1-u03-w14-q16
      type: multi_select
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 2
      partial_credit: true
      prompt: |
        For which of these systems does the total mechanical energy (K + U) stay constant during the motion described? Select all that apply.
      options:
        - "A tennis ball and Earth, as the ball flies up and comes back down with negligible air resistance"
        - "A block and an ideal spring, as the block oscillates back and forth on a frictionless table"
        - "A box and Earth, as a student pushes the box up a ramp at constant speed"
        - "A sled, Earth and the snow, as the sled slides to a stop on level ground"
        - "A satellite and Earth, as the satellite moves along an elliptical orbit far above the atmosphere"
      option_explanations:
        - |
          Correct. Only gravity acts and it is internal; K and U_g trade off with their sum constant.
        - |
          Correct. The spring force is conservative and internal, the table is frictionless, and the normal force does no work, so K + U_s is constant.
        - |
          The student is outside the system and does positive external work, which raises U_g while K stays the same; K + U increases.
        - |
          Total energy is constant, but friction inside the system converts K into internal energy, so K + U decreases.
        - |
          Correct. Gravity is the only force and it is internal and conservative: U_G = −GMm/r and K trade off as r changes, with constant sum.
