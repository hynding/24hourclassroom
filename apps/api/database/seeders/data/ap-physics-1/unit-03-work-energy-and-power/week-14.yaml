      source: "AP Physics 1 CED, Topic 3.3"
      points: 2
      partial_credit: true
      prompt: |
        The potential energy of a cart–spring system is given against the cart's position:

        | x (m) | 0 | 1.0 | 2.0 | 3.0 | 4.0 |
        |---|---|---|---|---|---|
        | U (J) | 8.0 | 2.0 | 0 | 2.0 | 8.0 |

        Which statements are correct? Select all that apply.
      options:
        - "The force on the cart is zero at x = 2.0 m."
        - "At x = 1.0 m the force on the cart points toward larger x."
        - "The force on the cart is larger at x = 0.5 m than at x = 1.5 m."
        - "At x = 3.5 m the force on the cart points toward larger x."
        - "A cart located at x = 2.0 m must be at rest."
      option_explanations:
        - |
          Correct. U is at its minimum there, where the graph is flat, so the force (the slope) is zero; this is the equilibrium position.
        - |
          Correct. The force points toward lower U, and U decreases toward x = 2.0 m, the +x direction.
        - |
          Correct. From 0 to 1.0 m U drops 6.0 J (about 6 N); from 1.0 to 2.0 m it drops 2.0 J (about 2 N). Steeper means a larger force.
