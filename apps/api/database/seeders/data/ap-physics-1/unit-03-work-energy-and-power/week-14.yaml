    - slug: apphys1-u03-w14-q18
      type: true_false
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      prompt: |
        True or false: On a frictionless water slide, a 90 kg adult reaches the bottom with a greater speed than a 30 kg child who starts from rest at the same height.
      answer: false
      explanation: |
        False. For each rider–Earth system, mgh = ½mv², so v = √(2gh) and the mass cancels. Both reach the same speed. The adult has three times the kinetic energy, because the adult–Earth system also started with three times the potential energy.
    - slug: apphys1-u03-w14-q19
      type: true_false
      topic_code: "3.1"
      source: "AP Physics 1 CED, Topic 3.1"
      points: 1
      prompt: |
        True or false: A suitcase resting on the luggage rack of a moving train has zero kinetic energy in the train's reference frame but a nonzero kinetic energy in the ground's reference frame.
      answer: true
      explanation: |
        True. Kinetic energy depends on speed, and speed depends on the frame: the suitcase is at rest relative to the train but moves with the train's speed relative to the ground. Both values are correct in their own frame; an energy calculation must use one frame throughout.
    - slug: apphys1-u03-w14-q20
      type: fill_blank
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      prompt: |
        A ball is dropped from rest from a height H with negligible air resistance. When it has fallen a distance H/2, its kinetic energy is ____ of the ball–Earth system's total mechanical energy (answer with a word or a fraction).
      answer: ["half", "one half", "one-half", "1/2", "0.5", "50%"]
      explanation: |
        Taking the ground as zero, the total is mgH. After falling H/2, U_g = mg(H/2), so K = mgH − mgH/2 = mgH/2: half the total.
