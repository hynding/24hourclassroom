        A 60 kg skier starts from rest at the top of a run and descends 25 m vertically, reaching the bottom at 18 m/s. How much of the skier–Earth–snow–air system's mechanical energy has been converted to internal energy? Give your answer in joules to the nearest 10 J.
      answer: { value: 4980, tolerance: 30 }
      explanation: |
        Initial mechanical energy (bottom as zero): mgh = (60)(9.8)(25) = 14,700 J. Final: ½mv² = ½(60)(18)² = 9,720 J. The difference, 14,700 − 9,720 = 4,980 J, became internal energy through friction with the snow and air drag.
    - slug: apphys1-u03-w14-q23
      type: short_answer
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 3
      prompt: |
        A toy rocket has no engine: a spring with k = 180 N/m inside its launcher is compressed 0.10 m, and when released it fires the 0.060 kg rocket straight up. Ignore air resistance and take the system as rocket + spring + Earth, with U_g = 0 at the compressed position.

        (a) Describe energy bar charts (K, U_g, U_s) for three states: compressed at rest, the instant the rocket leaves the spring (0.10 m higher), and the top of the flight. Give values in joules.
        (b) How high above the compressed position does the rocket rise?
        (c) A heavier rocket of 0.120 kg is fired with the same compression. Predict its maximum height and justify.
      answer: |
        (a) Compressed: U_s = ½(180)(0.10)² = 0.90 J, K = 0, U_g = 0. Leaving the spring: U_s = 0, U_g = (0.060)(9.8)(0.10) ≈ 0.06 J, K ≈ 0.84 J. Top: K = 0, U_s = 0, U_g = 0.90 J. Every state totals 0.90 J.
        (b) mgh = 0.90 J, so h = 0.90/(0.060 × 9.8) ≈ 1.5 m.
        (c) About 0.77 m, half as high: the spring stores the same 0.90 J, and h = ½kx²/(mg) is inversely proportional to m, so doubling the mass halves the height.
      explanation: |
        Three points, one per part. (a) Three states with the energy moving from U_s to (mostly) K to U_g, totals equal at 0.90 J (the small U_g at the second state may be included or noted as small). (b) 1.5 m (accept 1.5 to 1.6 m). (c) Half the height, with the reason that the same stored energy is shared by twice the weight. Answering "the same height, because mass cancels" loses the point: mass cancels only when the energy itself is proportional to m.
    - slug: apphys1-u03-w14-q24
      type: short_answer
      topic_code: "2.9"
      source: "AP Physics 1 CED, Topic 2.9"
      points: 3
      prompt: |
        A small marble slides without friction down a ramp and around a vertical loop of radius 0.30 m. (Treat the marble as a sliding point object: ignore any spin.)

        (a) At the top of the loop the marble is upside down. Explain why there is a minimum speed it must have there to stay on the track, and find that speed.
        (b) Use energy conservation to find the minimum release height above the bottom of the loop.
        (c) A student says the release height only has to be 2r = 0.60 m, the height of the top of the loop. Explain the error.
      answer: |
        (a) At the top, gravity and the normal force both point down, toward the centre. The net force must equal mv²/r. The smallest possible net force is gravity alone (normal force zero), so mg = mv²/r gives v_min = √(gr) = √(9.8 × 0.30) ≈ 1.7 m/s. Any slower and gravity alone is more than enough to pull the marble off the circle.
        (b) mgh = mg(2r) + ½mv_min², so h = 2r + v_min²/(2g) = 0.60 + 0.15 = 0.75 m (2.5r).
        (c) Released from 0.60 m, the marble would arrive at the top of the loop with zero kinetic energy, but it needs speed √(gr) there to follow the circle; it would leave the track before reaching the top.
      explanation: |
        Three points, one per part. (a) Net force toward the centre equal to mv²/r with the normal force at least zero, giving √(gr) ≈ 1.7 m/s. (b) Energy equation with both U_g at height 2r and K at the top, h = 0.75 m (2.5r). (c) Identifies that zero speed at the top is not enough because circular motion requires a minimum speed there.
    - slug: apphys1-u03-w14-q25
      type: long_answer
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 6
      prompt: |
        Experimental design and analysis. A lab group wants to test whether a cart's gravitational potential energy becomes kinetic energy as it rolls down a ramp. They have a ramp, a cart, a metre stick, and a photogate that measures the cart's speed at the bottom.

        (A) Describe a procedure. State what they should measure, how, and one way to reduce uncertainty.

        The group's invented results, with h the vertical drop from release to the photogate:

        | h (m) | 0.10 | 0.20 | 0.30 | 0.40 | 0.50 |
        |---|---|---|---|---|---|
        | v (m/s) | 1.35 | 1.93 | 2.33 | 2.72 | 3.02 |

        (B) Choose quantities to graph that should give a straight line if mechanical energy is conserved. Justify your choice and tabulate the values you would plot.

        (C) Determine the slope of the best-fit line (show how you got it).

        (D) Compare the slope with the value energy conservation predicts, and give a physical reason for any difference.
      answer: |
        (A) Release the cart from rest at several positions on the ramp. For each, measure the vertical height of the cart's release point above the photogate with the metre stick held vertically (not the distance along the ramp), and record the photogate speed at the bottom. Reduce uncertainty: repeat each height three or more times and average the speeds; mark release points so they are reproducible; use at least five heights.
        (B) Graph v² (vertical) against h (horizontal). If mgh = ½mv², then v² = 2gh: a straight line through the origin. v² values: 1.82, 3.72, 5.43, 7.40, 9.12 m²/s².
        (C) The best-fit line through these points has slope about 18.3 m²/s² per m = 18.3 m/s² (for example, (9.12 − 1.82)/(0.50 − 0.10) = 18.2 m/s²).
        (D) Predicted slope: 2g = 19.6 m/s². The measured slope is about 7% lower, so the cart reaches the bottom with less kinetic energy than the potential energy it gave up. Friction in the wheels' axles and air drag convert some energy to internal energy (and some goes into spinning the wheels), so the cart's translational kinetic energy is less than mgh.
      explanation: |
        Six points.
        (A) 2 points: 1 for measuring the vertical drop h and the speed at the bottom for several release heights, with the right instruments; 1 for a valid way to reduce uncertainty (repeated trials averaged, more heights, consistent release from rest).
        (B) 1 point: v² against h (or h against v², slope then 1/(2g)) justified by v² = 2gh, with the v² values correct to about ±0.05.
        (C) 1 point: slope 17.8 to 18.8 m/s² from a best-fit line or two well-separated points, with units.
        (D) 2 points: 1 for comparing with 2g = 19.6 m/s² and stating the slope is smaller; 1 for a physical reason (friction, air drag, rotational energy of the wheels) linked to less kinetic energy than mgh. Saying "human error" earns nothing.
