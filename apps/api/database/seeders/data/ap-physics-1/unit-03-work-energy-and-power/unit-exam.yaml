unit: 3
description: |
  43 questions · about 90 minutes · every topic of Unit 3 (3.1 to 3.5): translational kinetic energy, work by
  constant and varying forces and the work–energy theorem, potential energy of systems (gravitational near Earth
  and in general, elastic), conservation of energy in closed and open systems with friction, and power. Includes
  three shared-context sets (a four-question set on a sled run down a hill onto rough snow, a four-question set on
  an electric scooter's speed–time data, and a three-question set on a cart compressing a spring bumper),
  select-all, true/false, fill-in-the-blank and numeric items, two short-answer questions (3 points each) and two
  free-response questions in the 2027 AP style: a translation between representations question (12 points,
  written as an 8-point long answer followed by its 4-point part D) on a block that slides down a ramp, across a
  rough strip and into a spring, and an experimental design and analysis question (10 points) on a toy spring
  launcher. Calculators and the equation sheet are allowed throughout, as on the AP exam. Multiple choice,
  select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
  automatically; the short answers and free-response questions are graded by your teacher against the scoring
  notes.
questions:
  # ---- Stimulus set A: sled run (3.4, 3.3, 3.2)
  - slug: apphys1-u03-exam-q01
    type: multiple_choice
    topic_code: "3.4"
    source: "AP Physics 1 CED, Topic 3.4"
    points: 1
    stimulus: |
      A child on a sled (combined mass 40 kg) starts from rest at the top of a snowy hill and slides down to the bottom, 6.0 m lower. Friction on the hill is negligible. At the bottom the sled slides onto level, rougher snow, where the coefficient of kinetic friction is 0.12, and slides in a straight line until it stops. Ignore air resistance and use g = 9.8 m/s².
    prompt: |
      What is the sled's speed at the bottom of the hill?
    options:
      - "7.7 m/s"
      - "118 m/s"
      - "11 m/s"
      - "59 m/s"
    option_explanations:
      - |
        7.7 m/s is √(gh) = √(9.8 × 6.0), which leaves out the factor 2 from the ½ in ½mv².
      - |
        118 is 2gh = 117.6 m²/s², which is v², not v; the square root was not taken.
      - |
        Correct. The sled–Earth system is closed on the frictionless hill, so mgh = ½mv² and v = √(2gh) = √(2 × 9.8 × 6.0) ≈ 10.8 m/s ≈ 11 m/s.
      - |
        59 is gh = 58.8, half of v², used as a speed with no square root.
    answer: 2
  - slug: apphys1-u03-exam-q02
    type: multiple_choice
    topic_code: "3.3"
    source: "AP Physics 1 CED, Topic 3.3"
    points: 1
    stimulus: |
      A child on a sled (combined mass 40 kg) starts from rest at the top of a snowy hill and slides down to the bottom, 6.0 m lower. Friction on the hill is negligible. At the bottom the sled slides onto level, rougher snow, where the coefficient of kinetic friction is 0.12, and slides in a straight line until it stops. Ignore air resistance and use g = 9.8 m/s².
    prompt: |
      What is the change in gravitational potential energy of the sled–Earth system from the top of the hill to the bottom?
    options:
      - "−2,350 J"
      - "+2,350 J"
      - "−240 J"
      - "It depends on where the zero of potential energy is placed."
    option_explanations:
      - |
        Correct. ΔU_g = mgΔy = (40)(9.8)(−6.0) ≈ −2,350 J; it is negative because the sled moves closer to Earth.
      - |
        The size is right but the sign is wrong: moving down decreases the system's gravitational potential energy.
      - |
        −240 J uses mass × height, (40)(6.0), leaving out g.
      - |
        The values of U_g depend on the zero, but the change ΔU_g does not.
    answer: 0
  - slug: apphys1-u03-exam-q03
    type: multiple_choice
    topic_code: "3.4"
    source: "AP Physics 1 CED, Topic 3.4"
    points: 1
    stimulus: |
      A child on a sled (combined mass 40 kg) starts from rest at the top of a snowy hill and slides down to the bottom, 6.0 m lower. Friction on the hill is negligible. At the bottom the sled slides onto level, rougher snow, where the coefficient of kinetic friction is 0.12, and slides in a straight line until it stops. Ignore air resistance and use g = 9.8 m/s².
    prompt: |
      How far does the sled slide on the level snow before it stops?
    options:
      - "0.72 m"
      - "6.0 m, the same as the height of the hill"
      - "25 m"
      - "50 m"
    option_explanations:
      - |
        0.72 m multiplies the height by μ_k instead of dividing by it.
      - |
        Equal distance would need μ_k = 1; the friction force is only 0.12 of the weight, so the sled slides much farther than 6.0 m.
      - |
        25 m divides by 2μ_k, as if the kinetic energy at the bottom were ½mgh instead of mgh.
      - |
        Correct. All of mgh becomes internal energy through friction: mgh = μ_k mg d, so d = h/μ_k = 6.0/0.12 = 50 m. The mass cancels.
    answer: 3
  - slug: apphys1-u03-exam-q04
    type: multiple_choice
    topic_code: "3.2"
    source: "AP Physics 1 CED, Topic 3.2"
    points: 1
    stimulus: |
      A child on a sled (combined mass 40 kg) starts from rest at the top of a snowy hill and slides down to the bottom, 6.0 m lower. Friction on the hill is negligible. At the bottom the sled slides onto level, rougher snow, where the coefficient of kinetic friction is 0.12, and slides in a straight line until it stops. Ignore air resistance and use g = 9.8 m/s².
    prompt: |
      How much work does the friction force do on the sled while it slides on the level snow?
    options:
      - "+2,350 J"
      - "−2,350 J"
      - "0 J, because the sled ends at rest"
      - "−282 J"
    option_explanations:
      - |
        Friction points opposite the sled's displacement, so its work is negative, not positive.
      - |
        Correct. By the work–energy theorem, W_f = ΔK = 0 − ½mv² = −mgh ≈ −2,350 J. (Check: −μ_k mg d = −(0.12)(40)(9.8)(50) ≈ −2,350 J.)
      - |
        Ending at rest means the kinetic energy changed from about 2,350 J to zero, so the net work is −2,350 J, not zero.
      - |
        −282 J is −μ_k mg × 6.0 m, using the hill's height as the sliding distance instead of 50 m.
    answer: 1
  # ---- Stimulus set B: electric scooter data (3.1, 3.5, 3.2)
  - slug: apphys1-u03-exam-q05
    type: multiple_choice
    topic_code: "3.1"
    source: "AP Physics 1 CED, Topic 3.1"
    points: 1
    stimulus: |
      A student rides an electric scooter along a straight, level path, starting from rest. The student and scooter have a combined mass of 80 kg. A speed sensor records:

      | Time (s) | 0 | 2.0 | 4.0 | 6.0 | 8.0 |
      |---|---|---|---|---|---|
      | Speed (m/s) | 0 | 2.0 | 4.0 | 5.5 | 6.0 |
    prompt: |
      What is the kinetic energy of the student and scooter at t = 4.0 s?
    options:
      - "320 J"
      - "640 J"
      - "160 J"
      - "1,280 J"
    option_explanations:
      - |
        320 is mv = (80)(4.0), the momentum in kg·m/s, not the kinetic energy.
      - |
        Correct. K = ½mv² = ½(80)(4.0)² = ½(80)(16) = 640 J.
      - |
        160 J is ½mv with v not squared: ½(80)(4.0).
      - |
        1,280 J is mv², leaving out the ½ in the kinetic energy formula.
    answer: 1
  - slug: apphys1-u03-exam-q06
    type: multiple_choice
    topic_code: "3.5"
    source: "AP Physics 1 CED, Topic 3.5"
    points: 1
    stimulus: |
      A student rides an electric scooter along a straight, level path, starting from rest. The student and scooter have a combined mass of 80 kg. A speed sensor records:

      | Time (s) | 0 | 2.0 | 4.0 | 6.0 | 8.0 |
      |---|---|---|---|---|---|
      | Speed (m/s) | 0 | 2.0 | 4.0 | 5.5 | 6.0 |
    prompt: |
      What is the average net power delivered to the student and scooter from t = 0 to t = 4.0 s?
    options:
      - "640 W"
      - "80 W"
      - "160 W"
      - "320 W"
    option_explanations:
      - |
        640 is the change in kinetic energy in joules; power needs it divided by the 4.0 s.
      - |
        80 W is the net force, ma = (80)(1.0) = 80 N, not a power.
      - |
        Correct. P_avg = ΔK/Δt = (640 J − 0)/4.0 s = 160 W.
      - |
        320 W is the instantaneous power F_net v at t = 4.0 s, (80 N)(4.0 m/s); while speeding up from rest with a constant force, the average is half of that.
    answer: 2
  - slug: apphys1-u03-exam-q07
    type: multiple_choice
    topic_code: "3.5"
    source: "AP Physics 1 CED, Topic 3.5"
    points: 1
    stimulus: |
      A student rides an electric scooter along a straight, level path, starting from rest. The student and scooter have a combined mass of 80 kg. A speed sensor records:

      | Time (s) | 0 | 2.0 | 4.0 | 6.0 | 8.0 |
      |---|---|---|---|---|---|
      | Speed (m/s) | 0 | 2.0 | 4.0 | 5.5 | 6.0 |
    prompt: |
      How does the average net power from t = 4.0 s to t = 8.0 s compare with the average net power from t = 0 to t = 4.0 s?
    options:
      - "It is smaller, because the speed increases by less (2.0 m/s instead of 4.0 m/s)."
      - "It is the same, because the time intervals are equal."
      - "It is smaller, because the acceleration is smaller."
      - "It is larger: 200 W compared with 160 W."
    option_explanations:
      - |
        A smaller gain in speed at a higher speed can still be a larger gain in kinetic energy, because K depends on v².
      - |
        Equal times give equal average power only if the kinetic energy gains are equal; they are 640 J and 800 J.
      - |
        The acceleration is smaller, but power is the rate of change of kinetic energy, and at higher speed each m/s gained adds more energy.
      - |
        Correct. K at 8.0 s is ½(80)(6.0)² = 1,440 J, so the second interval's gain is 1,440 − 640 = 800 J; 800 J/4.0 s = 200 W, more than 160 W.
    answer: 3
  - slug: apphys1-u03-exam-q08
    type: numeric
    topic_code: "3.2"
    source: "AP Physics 1 CED, Topic 3.2"
    points: 1
    stimulus: |
      A student rides an electric scooter along a straight, level path, starting from rest. The student and scooter have a combined mass of 80 kg. A speed sensor records:

      | Time (s) | 0 | 2.0 | 4.0 | 6.0 | 8.0 |
      |---|---|---|---|---|---|
      | Speed (m/s) | 0 | 2.0 | 4.0 | 5.5 | 6.0 |
    prompt: |
      Use the work–energy theorem to find the net work done on the student and scooter from t = 0 to t = 8.0 s. Give your answer in joules to the nearest 10 J.
    answer: { value: 1440, tolerance: 10 }
    explanation: |
      W_net = ΔK = ½(80)(6.0)² − 0 = 1,440 J. The theorem needs only the initial and final speeds, not the details of the forces in between.
  # ---- Stimulus set C: cart and spring bumper (3.3, 3.4)
  - slug: apphys1-u03-exam-q09
    type: multiple_choice
    topic_code: "3.3"
    source: "AP Physics 1 CED, Topic 3.3"
    points: 1
    stimulus: |
      A 0.80 kg cart rolls at 2.0 m/s along a level, frictionless track toward a spring bumper with spring constant 320 N/m. The cart compresses the spring, stops momentarily, and is pushed back. Consider the cart–spring system.
    prompt: |
      What is the maximum compression of the spring?
    options:
      - "0.10 m"
      - "0.0050 m"
      - "0.071 m"
      - "0.010 m"
    option_explanations:
      - |
        Correct. All of the cart's K = ½(0.80)(2.0)² = 1.6 J is stored: ½kx² = 1.6 J, so x = √(2 × 1.6/320) = √0.010 = 0.10 m.
      - |
        0.0050 m is K/k = 1.6/320, which sets the kinetic energy equal to kx, the spring force, instead of ½kx².
      - |
        0.071 m is √(1.6/320), which drops the factor 2 from ½kx².
      - |
        0.010 is x² = 2K/k in m², with the square root forgotten.
    answer: 0
  - slug: apphys1-u03-exam-q10
    type: multiple_choice
    topic_code: "3.4"
    source: "AP Physics 1 CED, Topic 3.4"
    points: 1
    stimulus: |
      A 0.80 kg cart rolls at 2.0 m/s along a level, frictionless track toward a spring bumper with spring constant 320 N/m. The cart compresses the spring, stops momentarily, and is pushed back. Consider the cart–spring system.
    prompt: |
      What is the cart's speed when the spring is compressed 0.050 m (half the maximum compression)?
    options:
      - "1.0 m/s, half the original speed"
      - "1.4 m/s"
      - "1.7 m/s"
      - "0.50 m/s"
    option_explanations:
      - |
        Half the compression stores only a quarter of the energy (½kx²), so the cart keeps much more than half its speed.
      - |
        1.4 m/s comes from splitting the energy equally (0.80 J each), which happens at x = 0.071 m, not at 0.050 m.
      - |
        Correct. U_s = ½(320)(0.050)² = 0.40 J, so K = 1.6 − 0.40 = 1.2 J and v = √(2 × 1.2/0.80) ≈ 1.7 m/s.
      - |
        0.50 m/s treats the speed as dropping with the square of the compression ratio; it is the energy, not the speed, that scales with x².
    answer: 2
  - slug: apphys1-u03-exam-q11
    type: multi_select
    topic_code: "3.4"
    source: "AP Physics 1 CED, Topic 3.4"
    points: 2
    partial_credit: true
    stimulus: |
      A 0.80 kg cart rolls at 2.0 m/s along a level, frictionless track toward a spring bumper with spring constant 320 N/m. The cart compresses the spring, stops momentarily, and is pushed back. Consider the cart–spring system.
    prompt: |
      Which statements about the cart–spring system are correct? Select all that apply.
    options:
      - "The total mechanical energy of the system is 1.6 J at every instant."
      - "An energy bar chart at maximum compression shows K = 0 and U_s = 1.6 J."
      - "The force the spring exerts on the cart is largest when the cart is moving fastest."
      - "The cart leaves the bumper moving at 2.0 m/s in the opposite direction."
      - "Because the spring pushes the cart back, the system's energy is negative after the bounce."
    option_explanations:
      - |
        Correct. No external work is done and no friction acts, so K + U_s stays at the initial 1.6 J.
      - |
        Correct. At maximum compression the cart is momentarily at rest, so all 1.6 J is elastic potential energy.
      - |
        The spring force kx is largest at maximum compression, where the cart is at rest; it is zero when the cart moves fastest (spring uncompressed).
      - |
        Correct. All 1.6 J returns to kinetic energy, so the speed is again 2.0 m/s; only the direction has changed.
      - |
        Energy is a scalar and does not take the sign of the direction of motion; the system still has 1.6 J.
    answer: [0, 1, 3]
  # ---- Independent items
  - slug: apphys1-u03-exam-q12
    type: multiple_choice
    topic_code: "3.1"
    source: "AP Physics 1 CED, Topic 3.1"
    points: 1
    prompt: |
      Object X has half the mass of object Y and three times its speed. What is the ratio of X's kinetic energy to Y's?
    options:
      - "1.5"
      - "6"
      - "18"
      - "4.5"
    option_explanations:
      - |
        1.5 multiplies the mass ratio by the speed ratio, ½ × 3, without squaring the speed ratio.
      - |
        6 doubles the speed ratio instead of halving for the mass and squaring the speed.
      - |
        18 multiplies 9 by 2 instead of by ½: X has the smaller mass.
      - |
        Correct. K_X/K_Y = (m_X/m_Y)(v_X/v_Y)² = (½)(3)² = 4.5.
    answer: 3
  - slug: apphys1-u03-exam-q13
    type: multiple_choice
    topic_code: "3.1"
    source: "AP Physics 1 CED, Topic 3.1"
    points: 1
    prompt: |
      A passenger sits on a bus moving at 15 m/s. A friend sits on a bench at the bus stop. Which statement about the passenger's kinetic energy is correct?
    options:
      - "It is zero in the bus's frame and nonzero in the friend's frame; both values are correct in their frames."
      - "It is nonzero in every frame, because the bus is really moving."
      - "It is zero in every frame, because the passenger is sitting still."
      - "It is the same in both frames, because kinetic energy is a scalar."
    option_explanations:
      - |
        Correct. Kinetic energy depends on speed, and speed is measured relative to a frame: zero relative to the bus, 15 m/s relative to the ground.
      - |
        There is no single "real" speed; relative to the bus, the passenger is at rest, so K = 0 in that frame.
      - |
        The passenger is still only relative to the bus; relative to the friend, the passenger moves at 15 m/s.
      - |
        Being a scalar does not make a quantity frame-independent; kinetic energy depends on the speed measured in the frame.
    answer: 0
  - slug: apphys1-u03-exam-q14
    type: multiple_choice
    topic_code: "3.2"
    source: "AP Physics 1 CED, Topic 3.2"
    points: 1
    prompt: |
      A gardener pushes a lawnmower 15 m across a level lawn, pushing along the handle with a constant 90 N force directed 35° below the horizontal. How much work does the gardener's push do on the mower?
    options:
      - "1,350 J"
      - "1,110 J"
      - "774 J"
      - "−1,110 J, because the force points partly downward"
    option_explanations:
      - |
        1,350 J is (90)(15), the whole force times the distance; only the horizontal component lies along the displacement.
      - |
        Correct. W = Fd cos 35° = (90)(15)(0.819) ≈ 1,110 J. The downward component is perpendicular to the motion and does no work.
      - |
        774 J uses sin 35°, the vertical component, which does no work on a horizontal displacement.
      - |
        The horizontal component points along the motion, so the work is positive; the downward part contributes zero, not a negative amount.
    answer: 1
  - slug: apphys1-u03-exam-q15
    type: multiple_choice
    topic_code: "3.2"
    source: "AP Physics 1 CED, Topic 3.2"
    points: 1
    prompt: |
      A horizontal force acting on a sliding puck rises steadily from 0 at x = 0 to 12 N at x = 2.0 m, then drops instantly to −6.0 N and stays there until x = 4.0 m. The puck moves in the +x direction throughout. What is the net work done by this force from x = 0 to x = 4.0 m?
    options:
      - "−12 J"
      - "24 J"
      - "0 J"
      - "12 J"
    option_explanations:
      - |
        −12 J counts only the negative rectangle from x = 2.0 m to 4.0 m and leaves out the positive triangle before it.
      - |
        24 J treats the first part as a rectangle (12 N × 2.0 m) and ignores the negative part.
      - |
        Correct. Triangle above the axis: ½(2.0)(12) = +12 J. Rectangle below: (−6.0)(2.0) = −12 J. Net work: 0, so the puck ends with its starting speed.
      - |
        12 J counts only the positive triangle and leaves out the negative work from x = 2.0 m to 4.0 m.
    answer: 2
  - slug: apphys1-u03-exam-q16
    type: multiple_choice
    topic_code: "3.2"
    source: "AP Physics 1 CED, Topic 3.2"
    points: 1
    prompt: |
      A student rides an elevator that moves upward at constant speed. Which describes the work done on the student by the floor's normal force and by gravity during the ride?
    options:
      - "Both do zero work, because the student's speed is constant."
      - "The normal force does negative work and gravity does positive work."
      - "The normal force does zero work, because it is a contact force that does not move."
      - "The normal force does positive work and gravity does an equal amount of negative work."
    option_explanations:
      - |
        Constant speed means the net work is zero, not that each force does zero work; both forces act along the vertical displacement.
      - |
        The signs are reversed: the normal force points up along the upward displacement, and gravity points against it.
      - |
        The floor moves up with the student, so the normal force acts through a displacement and does work.
      - |
        Correct. F_N points up, along the motion (positive work); F_g points down (negative work). At constant speed they balance, so the works cancel and ΔK = 0.
    answer: 3
  - slug: apphys1-u03-exam-q17
    type: multiple_choice
    topic_code: "3.2"
    source: "AP Physics 1 CED, Topic 3.2"
    points: 1
    prompt: |
      A 0.010 kg pellet moving at 400 m/s embeds itself in a block of wood, stopping in 0.10 m. What is the average force the wood exerts on the pellet?
    options:
      - "8,000 N"
      - "40 N"
      - "800 N"
      - "16,000 N"
    option_explanations:
      - |
        Correct. W = ΔK: F(0.10 m) = ½(0.010)(400)² = 800 J, so F = 8,000 N, directed opposite the pellet's motion.
      - |
        40 N is mv/d, using momentum in place of kinetic energy.
      - |
        800 is the kinetic energy in joules; the force needs it divided by the 0.10 m stopping distance.
      - |
        16,000 N leaves out the ½ in the kinetic energy.
    answer: 0
  - slug: apphys1-u03-exam-q18
    type: multiple_choice
    topic_code: "3.3"
    source: "AP Physics 1 CED, Topic 3.3"
    points: 1
    prompt: |
      A space probe moves from a distance r to a distance 3r from the centre of a planet. With zero at infinite separation, the probe–planet system's gravitational potential energy changes from −U₀ to what value?
    options:
      - "−3U₀"
      - "−U₀/3"
      - "−U₀/9"
      - "+U₀/3"
    option_explanations:
      - |
        −3U₀ makes the potential energy more negative as the distance grows; U_G = −Gm₁m₂/r becomes less negative.
      - |
        Correct. U_G is inversely proportional to r, so tripling r divides it by 3: −U₀/3, an increase of 2U₀/3.
      - |
        Dividing by 9 uses 1/r², which describes the gravitational force, not the potential energy.
      - |
        The potential energy of attracting masses stays negative at any finite separation; its sign does not flip.
    answer: 1
  - slug: apphys1-u03-exam-q19
    type: multiple_choice
    topic_code: "3.3"
    source: "AP Physics 1 CED, Topic 3.3"
    points: 1
    prompt: |
      A student describes a falling raindrop using a system containing only the raindrop. Which statement is correct for this choice?
    options:
      - "The system's gravitational potential energy decreases as the raindrop falls."
      - "The system has potential energy, but its value cannot be calculated."
      - "The system has no potential energy; gravity is an external force that does work on the raindrop."
      - "Gravity does no work, because the system has no potential energy."
    option_explanations:
      - |
        A one-object system cannot have potential energy; with Earth outside, there is no ball–Earth interaction inside the system to store energy.
      - |
        The system has no potential energy at all, not an incalculable one.
      - |
        Correct. Potential energy needs two interacting objects in the system. With Earth outside, gravity is external and does positive work on the falling drop.
      - |
        Gravity still acts and does work on the raindrop; it simply appears as external work instead of a change in potential energy.
    answer: 2
  - slug: apphys1-u03-exam-q20
    type: multiple_choice
    topic_code: "3.3"
    source: "AP Physics 1 CED, Topic 3.3"
    points: 1
    prompt: |
      Spring P has spring constant k and spring Q has spring constant 2k. Each is stretched by the same force F. Which spring stores more elastic potential energy?
    options:
      - "Spring Q, because it is stiffer"
      - "They store the same energy, because the force is the same"
      - "It cannot be decided without the stretch distances"
      - "Spring P, which stores twice as much"
    option_explanations:
      - |
        A stiffer spring stores more energy at the same stretch, but here the force is the same, so the stiffer spring stretches less.
      - |
        The force is the same, but the stretches differ (x = F/k), and the stored energy depends on both.
      - |
        The stretches follow from Hooke's law, x = F/k, so U can be written as F²/(2k) and compared.
      - |
        Correct. x = F/k, so U = ½kx² = F²/(2k). Spring P (smaller k) stretches twice as far and stores twice the energy of spring Q.
    answer: 3
  - slug: apphys1-u03-exam-q21
    type: multiple_choice
    topic_code: "3.4"
    source: "AP Physics 1 CED, Topic 3.4"
    points: 1
    prompt: |
      A pendulum bob on a 0.80 m string is pulled aside until the string is horizontal and released from rest. Ignoring air resistance, how fast is the bob moving at its lowest point?
    options:
      - "4.0 m/s"
      - "2.8 m/s"
      - "7.8 m/s"
      - "0 m/s, because the string tension slows it"
    option_explanations:
      - |
