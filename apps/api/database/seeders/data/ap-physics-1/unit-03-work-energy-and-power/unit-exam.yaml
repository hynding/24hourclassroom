    explanation: |
      Four points. 1 point: shows ½kx² from (B) equals the U_s bar in state (iii). 1 point: links the graph (the drop across the rough stretch equals μ_k mgD, and K entering the spring equals the stored energy). 1 point: limiting case (i), x = √(2mgH/k), judged reasonable with a reason. 1 point: limiting case (ii), x = 0, interpreted as the block stopping at the end of the rough stretch.
  # ---- Free response 2: experimental design and analysis (10 points)
  - slug: apphys1-u03-exam-q43
    type: long_answer
    topic_code: "3.4"
    source: "AP Physics 1 CED, Topic 3.4"
    points: 10
    prompt: |
      Experimental design and analysis. A toy launcher fires a small 0.020 kg ball straight up using an internal spring. A lab group wants to find the spring constant k by measuring how high the ball rises for different compressions, assuming the spring's stored energy all becomes gravitational potential energy.

      (A) Describe a procedure the group could use. State which quantities they would measure, what equipment they would use for each, and two ways to reduce experimental uncertainty.

      The group's invented results, with x the compression and h the maximum height above the ball's starting position:

      | x (m) | 0.020 | 0.040 | 0.060 | 0.080 | 0.100 |
      |---|---|---|---|---|---|
      | h (m) | 0.13 | 0.50 | 1.12 | 1.98 | 3.10 |

      (B) Using energy conservation, show which quantities they should graph to obtain a straight line, and state what the slope represents physically.

      (C) Tabulate the values you would plot and determine the slope of the best-fit line.

      (D) Use the slope to calculate the spring constant.

      (E) Air resistance on the ball is not negligible at the larger heights. Would it make the group's value of k too large or too small? Explain.
    answer: |
      (A) Set the compression x by marking the launcher's plunger against a ruler (or measure it with calipers) for each trial. Fire the ball straight up beside a vertical metre stick or tape measure and record the maximum height with a phone video, reading the highest frame. Reduce uncertainty: repeat each compression three to five times and average h; use at least five different compressions; read the height at eye level or from video to avoid parallax; make sure the launcher is vertical.
      (B) ½kx² = mgh, so h = (k/(2mg))x². Graph h (vertical) against x² (horizontal); the slope is k/(2mg).
      (C) x² values: 0.00040, 0.0016, 0.0036, 0.0064, 0.010 m², with h = 0.13, 0.50, 1.12, 1.98, 3.10 m. The best-fit line has slope about 309 m⁻¹ (for example (3.10 − 0.13)/(0.010 − 0.00040) ≈ 309 m⁻¹).
      (D) k = 2mg × slope = 2(0.020)(9.8)(309) ≈ 121 N/m (about 120 N/m).
      (E) Too small. Air resistance converts some of the stored energy into internal energy of the air and ball, so the ball rises less than ½kx²/(mg). Smaller heights make the slope, and therefore k = 2mg × slope, smaller than the true value, and the effect is largest for the biggest compressions (the graph curves below the line at large x²).
    explanation: |
      Ten points.
      (A) 3 points: 1 for measuring compression with a ruler or calipers and maximum height with a metre stick (video recommended); 1 for a sound procedure (several compressions, vertical launch, height measured from the starting position); 1 for two valid ways to reduce uncertainty (repeated trials averaged, more data points, video to read the peak, avoiding parallax).
      (B) 2 points: 1 for deriving h = kx²/(2mg) from ½kx² = mgh; 1 for choosing h against x² (or equivalent, such as x² against h with slope 2mg/k) and stating the slope's meaning.
      (C) 2 points: 1 for correct x² values; 1 for a slope of 290 to 330 m⁻¹ from a best-fit line or well-separated points, with units.
      (D) 2 points: 1 for k = 2mg × slope (or the inverse if axes are swapped); 1 for a value of 110 to 130 N/m with units.
      (E) 1 point: "too small", with the reasoning that drag reduces h and therefore the slope.
