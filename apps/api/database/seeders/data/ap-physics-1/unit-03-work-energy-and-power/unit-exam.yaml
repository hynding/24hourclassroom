  # ---- Free response 1: translation between representations (12 points: q41 parts A–C, q42 part D)
  - slug: apphys1-u03-exam-q41
    type: long_answer
    topic_code: "3.4"
    source: "AP Physics 1 CED, Topic 3.4"
    points: 8
    stimulus: |
      A block of mass m is released from rest at height H on a frictionless curved ramp. At the bottom of the ramp it slides onto a level floor. The first stretch of floor, of length D, is rough, with coefficient of kinetic friction μ_k between the block and the floor. Beyond it the floor is frictionless, and at its far end is a horizontal spring with spring constant k. The block reaches the spring and compresses it. Consider the system of the block, the ramp, the floor, the spring and Earth, and ignore air resistance.
    prompt: |
      Translation between representations, parts A–C.

      (A) Make energy bar charts (as tables with columns K, U_g, U_s and ΔE_int) for three states: (i) the block at rest at height H; (ii) the block just past the end of the rough stretch; (iii) the spring at maximum compression. Use the floor as the zero of U_g. Show the relative sizes of the bars with expressions.

      (B) Starting from your bar charts, derive an expression for the maximum compression x of the spring in terms of m, H, D, μ_k, k and physical constants as needed.

      (C) Describe the shape of a graph of the block's kinetic energy against its horizontal position, from the bottom of the ramp until the spring is at maximum compression. Explain the shape of each section.
    answer: |
      (A) (i) K = 0, U_g = mgH, U_s = 0, ΔE_int = 0. (ii) K = mgH − μ_k mgD, U_g = 0, U_s = 0, ΔE_int = μ_k mgD. (iii) K = 0, U_g = 0, U_s = mgH − μ_k mgD, ΔE_int = μ_k mgD. The total (mgH) is the same in every chart.
      (B) From chart (iii): ½kx² = mgH − μ_k mgD, so x = √(2mg(H − μ_k D)/k).
      (C) At the bottom of the ramp K = mgH. Across the rough stretch K decreases in a straight line (constant slope −μ_k mg), because the friction force is constant, so each metre converts the same energy, to mgH − μ_k mgD. On the frictionless floor K is constant (a horizontal line), because no force does work. Once the spring is contacted K decreases along a curve that gets steeper (concave down), because the spring force grows with compression, reaching zero at maximum compression.
    explanation: |
      Eight points.
      (A) 3 points: 1 for state (i) all U_g = mgH; 1 for state (ii) with K and ΔE_int = μ_k mgD summing to mgH; 1 for state (iii) with U_s = mgH − μ_k mgD and ΔE_int unchanged. A chart that shows ΔE_int disappearing loses the point for that state.
      (B) 3 points: 1 for an energy equation consistent with the bar charts (mgH = μ_k mgD + ½kx²); 1 for the friction energy written as μ_k mg D (normal force mg on the level floor); 1 for x = √(2mg(H − μ_k D)/k) or equivalent.
      (C) 2 points: 1 for the linear decrease across the rough stretch followed by a constant section, with reasons; 1 for the curved, increasingly steep decrease to zero in the spring, with the reason (force increasing with compression).
  - slug: apphys1-u03-exam-q42
    type: short_answer
    topic_code: "3.4"
    source: "AP Physics 1 CED, Topic 3.4"
    points: 4
    stimulus: |
      A block of mass m is released from rest at height H on a frictionless curved ramp. At the bottom of the ramp it slides onto a level floor. The first stretch of floor, of length D, is rough, with coefficient of kinetic friction μ_k between the block and the floor. Beyond it the floor is frictionless, and at its far end is a horizontal spring with spring constant k. The block reaches the spring and compresses it. Consider the system of the block, the ramp, the floor, the spring and Earth, and ignore air resistance.
