      Part D of the translation between representations question.

      (D) Show that your expression for the maximum compression in part (B) is consistent with your bar charts in part (A) and your graph in part (C), and check it against two limiting cases: (i) the rough stretch is replaced by frictionless floor; (ii) μ_k D = H. For each case, state what the expression predicts and whether that is physically reasonable.
    answer: |
      Consistency: the bar chart at maximum compression has U_s = mgH − μ_k mgD, and ½kx² with the expression from (B) equals exactly mg(H − μ_k D). The graph's straight drop across the rough stretch has a total height μ_k mgD, the ΔE_int bar, and the kinetic energy entering the spring, mgH − μ_k mgD, is what the spring stores when K reaches zero.
