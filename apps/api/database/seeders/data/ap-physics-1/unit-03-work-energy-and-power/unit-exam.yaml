    source: "AP Physics 1 CED, Topic 3.4"
    points: 3
    prompt: |
      Two identical marbles are released from rest at the same height on two frictionless tracks. Both tracks start at the same height and end at the same, lower height, and both have the same horizontal length. Track 1 is a straight incline. Track 2 dips well below the end height in the middle before rising to the same end point.

      (a) Compare the marbles' speeds at the end of the tracks. Justify using energy.
      (b) At the lowest point of track 2, is that marble moving faster than, slower than or at the same speed as the track 1 marble at the end of its track? Justify.
      (c) A student argues that the marble on track 2 must arrive with a greater speed because it went lower and gained more kinetic energy. Explain the flaw.
    answer: |
      (a) Equal. Each marble–Earth system is closed (the normal force does no work, there is no friction), and both start at rest at the same height and end at the same height, so ½mv² = mgΔh is the same: same final speed.
      (b) Faster. The lowest point of track 2 is below the end height, so that marble has dropped farther from its starting height than either marble at the end; more U_g has become K, so its speed there is greater.
      (c) The marble on track 2 does gain extra kinetic energy in the dip, but it gives all that extra back as it climbs out to the end height. Only the net change in height between start and end determines the final speed.
      (Here the marbles are treated as sliding; spin is ignored.)
    explanation: |
      Three points, one per part. (a) Equal speeds with energy conservation and the same net height change, plus a reason no energy is lost (frictionless, normal force does no work). (b) Faster, because the marble is lower there than the end point, so more potential energy has been converted to kinetic energy. (c) The extra kinetic energy is returned to potential energy on the climb out.
