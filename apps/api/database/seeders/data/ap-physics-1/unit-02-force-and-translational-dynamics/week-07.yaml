        Take the two masses and the string as one system, with the direction in which the heavier mass falls as positive. The external forces along the string's path are 3.5g forward and 2.5g backward: a = (3.5 − 2.5)(9.8)/(3.5 + 2.5) = 9.8/6.0 ≈ 1.63 m/s². (Using g = 10 m/s² would give 1.67 m/s².)
