week: 7
unit: 2
title: "Newton's Second Law"
topics: ["2.5"]
guide: guides/week-07.md
guide_description: |
  Newton's second law a = ΣF/m for a system's center of mass (direction, proportionality, inverse dependence on
  mass), the four-step routine for writing ΣF = ma along each axis, connected objects solved by choosing the
  whole system for the acceleration and one object for an internal force, apparent weight in an elevator, the
  frictionless slope, and testing the law in the lab by linearising data. Worked examples: blocks pushed with
  18 N (3.0 m/s² and a 6.0 N contact force), a 1.5 kg cart pulled by a 0.50 kg hanging mass (a = m_h g/(m_c +
  m_h) = 2.45 m/s², with limiting cases), a scale-reading table for a 60 kg student in an elevator, a skateboard
  on a 20° ramp (a = g sin θ), and finding a cart's mass (0.50 kg) from the slope of an a–F graph.
flashcards_description: |
  32 cards on Newton's second law: reading a = ΣF/m (direction, proportionality, mass as inertia), the
  ΣF = ma routine, pushed blocks and contact forces, carts pulled by hanging masses and two-mass pulleys,
  elevators and scale readings, frictionless slopes, functional dependence, and lab design and linearisation.

flashcards:
  - front: Newton's second law for a system → statement
    back: |
      The acceleration of the system's center of mass equals the net external force divided by the system's mass, a = ΣF/m, and points in the direction of the net force.
    topic_code: "2.5"
  - front: Second-law direction → acceleration points along what
    back: |
      Along the net force, not necessarily along the velocity. A car braking while moving forward has a backward net force and a backward acceleration.
    topic_code: "2.5"
  - front: Newton (unit) → in base units
    back: |
      1 N = 1 kg·m/s²: the net force that gives 1 kg an acceleration of 1 m/s².
    topic_code: "2.5"
  - front: Second-law routine → four steps
    back: |
      Choose the system and draw its FBD; choose axes (one along a); write ΣF = ma per axis with signs; solve symbolically, substitute, check units and limits.
    topic_code: "2.5"
  - front: "Is \"ma\" a force on the free-body diagram?"
    back: |
      No. ma is what the forces produce. Draw only real forces exerted by objects; then set their sum equal to ma.
    topic_code: "2.5"
  - front: 4.0 kg box, 20 N right and 8.0 N friction left → acceleration
    back: |
      a = (20 − 8.0)/4.0 = 3.0 m/s² to the right.
    topic_code: "2.5"
  - front: Net force doubled on the same mass → acceleration
    back: |
      Doubles: a is proportional to ΣF.
    topic_code: "2.5"
  - front: Same net force on twice the mass → acceleration
    back: |
      Halves: a is inversely proportional to m.
    topic_code: "2.5"
  - front: Net force doubled and mass halved → acceleration
    back: |
      Four times as large: a = (2ΣF)/(m/2) = 4(ΣF/m).
    topic_code: "2.5"
  - front: Connected objects → which system gives the acceleration fastest
    back: |
      The whole set of objects: internal forces (contact forces, tensions) cancel, leaving only the external driving forces and the total mass.
    topic_code: "2.5"
  - front: Connected objects → which system gives an internal force
    back: |
      One object alone: the internal force becomes external to it, so ΣF = ma for that object gives its value.
    topic_code: "2.5"
  - front: 18 N pushes a 4.0 kg block against a 2.0 kg block, frictionless → a and contact force
    back: |
      a = 18/6.0 = 3.0 m/s²; contact force on the 2.0 kg block = 2.0 · 3.0 = 6.0 N.
    topic_code: "2.5"
  - front: Pushed pair of blocks, push moved to the other side → contact force
    back: |
      Now the contact force must accelerate the 4.0 kg block: 4.0 · 3.0 = 12 N. Pushing the lighter block makes the contact force larger.
    topic_code: "2.5"
  - front: Cart on a level frictionless track pulled by a hanging mass → acceleration
    back: |
      a = m_h g/(m_c + m_h): the hanging weight is the only external force along the string's path, and both masses are accelerated.
    topic_code: "2.5"
  - front: 1.5 kg cart pulled by a 0.50 kg hanging mass → a and T
    back: |
      a = 0.50 · 9.8/2.0 = 2.45 m/s²; T = m_c a ≈ 3.7 N, less than the 4.9 N hanging weight.
    topic_code: "2.5"
  - front: String tension in a cart-and-hanging-mass system → compared with m_h g
    back: |
      Always less while accelerating: m_h g − T = m_h a is positive. T equals m_h g only at constant velocity.
    topic_code: "2.5"
  - front: Cart-and-hanging-mass limits → cart mass to zero, hanging mass to zero
    back: |
      m_c → 0 gives a → g (free fall); m_h → 0 gives a → 0 (no driving force). A correct expression passes both.
    topic_code: "2.5"
  - front: Hanging mass doubled in the cart-and-pulley setup → acceleration
    back: |
      Increases but by less than a factor of 2, because the total mass being accelerated grows too: a = m_h g/(m_c + m_h).
    topic_code: "2.5"
  - front: Two masses on an ideal pulley (Atwood machine) → acceleration
    back: |
      a = (m₁ − m₂)g/(m₁ + m₂), the heavier side moving down. Equal masses give a = 0 (constant velocity or rest).
    topic_code: "2.5"
  - front: Elevator scale reading → expression
    back: |
      F_N = m(g + a) with up positive. The scale reads the normal force, not mg.
    topic_code: "2.5"
  - front: 60 kg student, elevator accelerating upward at 1.5 m/s² → scale reading
    back: |
      F_N = 60(9.8 + 1.5) = 678 N, more than the 588 N weight.
    topic_code: "2.5"
  - front: Elevator slowing down on the way down → heavier or lighter feeling
    back: |
      Heavier: slowing a downward motion needs an upward acceleration, so F_N exceeds mg.
    topic_code: "2.5"
  - front: Elevator scale reads 498 N for a 60 kg rider → possible motions
    back: |
      Acceleration 1.5 m/s² downward: speeding up going down, or slowing down going up.
    topic_code: "2.5"
  - front: Frictionless slope at angle θ → acceleration
    back: |
      a = g sin θ down the slope, independent of mass. θ = 0 gives 0; θ = 90° gives g.
    topic_code: "2.5"
  - front: Skateboarder on a smooth 20° ramp → acceleration
    back: |
      a = 9.8 sin 20° ≈ 3.4 m/s² down the ramp, whatever the rider's mass.
    topic_code: "2.5"
  - front: Ball thrown straight up, on the way up → direction of net force and acceleration
    back: |
      Both downward (gravity, ignoring air), even though the velocity is upward. The ball slows because a and v point opposite ways.
    topic_code: "2.5"
  - front: Testing a ∝ ΣF in the lab → what to vary and keep fixed
    back: |
      Vary the pulling force (force sensor), keep the cart's mass fixed, measure a from the slope of each v–t graph, use at least five forces and repeat trials.
    topic_code: "2.5"
  - front: Graph of a against F for one cart → what the slope means
    back: |
      Slope = 1/m. A slope of 2.0 (m/s²)/N means m = 0.50 kg. A non-zero F-intercept points to an unaccounted friction force.
    topic_code: "2.5"
  - front: Testing a ∝ 1/m at fixed force → what to graph
    back: |
      a against 1/m: a straight line through the origin whose slope is the net force.
    topic_code: "2.5"
  - front: Error-spot → "in the pulley lab the tension equals the hanging weight, 4.9 N"
    back: |
      Then the hanging mass would have zero net force and could not accelerate. While it speeds up, T is less than m_h g (here 3.7 N).
    topic_code: "2.5"
  - front: Error-spot → "a 70 kg skier slides down a frictionless slope faster than a 35 kg skier"
    back: |
      Both have a = g sin θ: twice the mass means twice the gravitational force along the slope but also twice the inertia.
    topic_code: "2.5"
  - front: Error-spot → "the elevator is moving down, so the scale must read less than mg"
    back: |
      The reading depends on the acceleration, not the velocity. Moving down at constant speed it reads mg; slowing down on the way down it reads more.
    topic_code: "2.5"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topic 2.5: applying ΣF = ma to one object and to
    connected systems, pulleys, elevators, frictionless slopes, functional dependence and lab linearisation), with
    8 questions (32%) reviewing weeks 1–6 (scalars and vectors, motion graphs, free fall and braking, projectiles,
    systems, free-body diagrams, the third law and the first law). Opens with a shared-context set on a cart pulled
    by a hanging mass. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes. Use g = 9.8 m/s². Calculator and equation sheet allowed throughout, as on
    the AP exam.
  questions:
    # ---- Stimulus set: cart pulled by a hanging mass (2.5)
    - slug: apphys1-u02-w07-q01
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 1
      stimulus: |
        A lab group sets a 0.80 kg cart on a level, low-friction track. A light string tied to the cart runs over a light, frictionless pulley at the end of the track to a 0.20 kg mass hanging straight down. The cart is released from rest, and a motion sensor records its velocity. Treat friction and the masses of the string and pulley as negligible.
      prompt: |
        What is the magnitude of the cart's acceleration?
      options:
        - "Zero, because the string tension balances the hanging weight"
        - "2.45 m/s²"
        - "1.96 m/s²"
        - "9.8 m/s²"
      option_explanations:
        - |
          The tension equals the hanging weight only at constant velocity. Released from rest, the system speeds up, so the forces on the hanging mass cannot balance.
        - |
          2.45 m/s² = 0.20 · 9.8/0.80 divides the driving force by the cart's mass alone; the hanging mass must be accelerated too.
        - |
          Correct. Treat cart + string + hanging mass as one system: the only external force along the string's path is m_h g = 1.96 N, and the total mass is 1.00 kg, so a = 1.96/1.00 = 1.96 m/s².
        - |
          9.8 m/s² is free fall. The string holds the hanging mass back, so it falls with a smaller acceleration than g.
      answer: 2
    - slug: apphys1-u02-w07-q02
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 1
      stimulus: |
        A lab group sets a 0.80 kg cart on a level, low-friction track. A light string tied to the cart runs over a light, frictionless pulley at the end of the track to a 0.20 kg mass hanging straight down. The cart is released from rest, and a motion sensor records its velocity. Treat friction and the masses of the string and pulley as negligible.
      prompt: |
        What is the tension in the string while the system accelerates?
      options:
        - "1.57 N"
        - "1.96 N"
        - "2.35 N"
        - "7.84 N"
      option_explanations:
        - |
          Correct. With the cart alone as the system, the tension is its only horizontal force: T = m_c a = 0.80 · 1.96 ≈ 1.57 N. Check on the hanging mass: m_h g − T = 1.96 − 1.57 = 0.39 N = 0.20 · 1.96.
        - |
          1.96 N is the hanging weight. If the tension were that large, the hanging mass would have zero net force and could not accelerate.
        - |
          2.35 N = m_h(g + a) treats the hanging mass as if it accelerated upward; it accelerates downward, so T = m_h(g − a).
        - |
          7.84 N is the cart's weight, which acts vertically and is balanced by the track's normal force; it does not set the string tension.
      answer: 0
    - slug: apphys1-u02-w07-q03
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 1
      stimulus: |
        A lab group sets a 0.80 kg cart on a level, low-friction track. A light string tied to the cart runs over a light, frictionless pulley at the end of the track to a 0.20 kg mass hanging straight down. The cart is released from rest, and a motion sensor records its velocity. Treat friction and the masses of the string and pulley as negligible.
      prompt: |
        The group replaces the hanging mass with a 0.40 kg mass and repeats the trial. How does the cart's acceleration compare with the first trial?
      options:
        - "It doubles, because the driving force doubles."
        - "It increases, but to less than double, because the total mass also increases."
        - "It stays the same, because the extra weight is balanced by extra tension."
        - "It halves, because more mass must be accelerated."
      option_explanations:
        - |
          The driving force does double, but the total mass rises from 1.00 kg to 1.20 kg, so the acceleration rises by less than a factor of 2.
        - |
          Correct. a = m_h g/(m_c + m_h) = 0.40 · 9.8/1.20 ≈ 3.27 m/s², up from 1.96 m/s² (a factor of about 1.67, not 2).
        - |
          The tension does increase, but never enough to balance the hanging weight while the system accelerates; a larger hanging mass gives a larger acceleration.
        - |
          Only 0.20 kg was added to the moving mass, while the driving force doubled; the net effect is a larger acceleration, not a smaller one.
      answer: 1
    - slug: apphys1-u02-w07-q04
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 1
      stimulus: |
        A lab group sets a 0.80 kg cart on a level, low-friction track. A light string tied to the cart runs over a light, frictionless pulley at the end of the track to a 0.20 kg mass hanging straight down. The cart is released from rest, and a motion sensor records its velocity. Treat friction and the masses of the string and pulley as negligible.
      prompt: |
        Which description of the free-body diagram of the hanging mass, while the system accelerates, is correct?
      options:
        - "A downward arrow F_g and an upward arrow T of equal length"
        - "A downward arrow F_g only, because the mass is falling"
        - "A downward arrow F_g, an upward arrow T, and a downward arrow labelled ma"
        - "A downward arrow F_g longer than an upward arrow T"
      option_explanations:
        - |
          Equal arrows would mean zero net force and constant velocity; the hanging mass is speeding up downward.
        - |
          The string is attached to the mass and pulls up on it, so the tension belongs on its FBD; the mass falls more slowly than in free fall because of it.
        - |
          ma is not a force exerted by any object, so it never appears on a free-body diagram; it is the result of the real forces.
        - |
          Correct. Two forces act: F_g (1.96 N) down and T (1.57 N) up. F_g is longer because the net force, and so the acceleration, is downward.
      answer: 3
    # ---- Newton's second law (2.5)
    - slug: apphys1-u02-w07-q05
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 1
      prompt: |
        A 4.0 kg box on a level floor is pushed with a horizontal force of 20 N to the right. The floor exerts a friction force of 8.0 N to the left. What is the box's acceleration?
      options:
        - "5.0 m/s² to the right"
        - "3.0 m/s² to the right"
        - "7.0 m/s² to the right"
        - "2.0 m/s² to the left"
      option_explanations:
        - |
          5.0 m/s² = 20/4.0 uses the applied force alone; the friction force must be subtracted to get the net force.
        - |
          Correct. ΣF = 20 − 8.0 = 12 N to the right, so a = 12/4.0 = 3.0 m/s² to the right.
        - |
          7.0 m/s² = (20 + 8.0)/4.0 adds the friction force as if it pointed the same way as the push.
        - |
          2.0 m/s² = 8.0/4.0 uses only the friction force, and the box accelerates in the direction of the net force, which is to the right.
      answer: 1
    - slug: apphys1-u02-w07-q06
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 1
      prompt: |
        A 60 kg student stands on a bathroom scale in an elevator that is speeding up as it moves upward, with an acceleration of 1.5 m/s². What does the scale read?
      options:
        - "588 N"
        - "498 N"
        - "678 N"
        - "90 N"
      option_explanations:
        - |
          588 N = mg is the reading at rest or at constant velocity. An upward acceleration needs an upward net force, so the scale must push harder.
        - |
          498 N = m(g − a) is the reading for a downward acceleration, which would be speeding up going down or slowing down going up.
        - |
          Correct. Up positive: F_N − mg = ma, so F_N = m(g + a) = 60(9.8 + 1.5) = 678 N.
        - |
          90 N = ma is the net force, not the normal force; the scale must also support the student's 588 N weight.
      answer: 2
    - slug: apphys1-u02-w07-q07
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 1
      prompt: |
        A skateboarder coasts down a smooth ramp inclined at 20° above the horizontal. Friction and air resistance are negligible. What is the magnitude of the skateboarder's acceleration?
      options:
        - "3.4 m/s²"
        - "9.2 m/s²"
        - "9.8 m/s²"
        - "It depends on the skateboarder's mass, which is not given."
      option_explanations:
        - |
          Correct. Along the ramp the only force component is mg sin θ, so a = g sin 20° = 9.8 · 0.342 ≈ 3.4 m/s².
        - |
          9.2 m/s² = g cos 20° uses the perpendicular component of gravity, which is balanced by the normal force.
        - |
          9.8 m/s² is free fall; on a ramp only part of the gravitational force points along the motion.
        - |
          The mass cancels: mg sin θ = ma gives a = g sin θ for any mass.
      answer: 0
    - slug: apphys1-u02-w07-q08
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 1
      prompt: |
        A student pushes horizontally with 18 N on a 4.0 kg block, which pushes a 2.0 kg block in front of it across a frictionless floor. What is the magnitude of the force the 4.0 kg block exerts on the 2.0 kg block?
      options:
        - "18 N"
        - "12 N"
        - "9.0 N"
        - "6.0 N"
      option_explanations:
        - |
          The 18 N push is not passed on whole: part of it accelerates the 4.0 kg block itself.
        - |
          12 N is the net force on the 4.0 kg block (18 N − 6.0 N), or the contact force if the push were applied to the 2.0 kg block instead.
        - |
          9.0 N splits the push evenly between the blocks, ignoring that the force on each must match its own mass times the shared acceleration.
        - |
          Correct. Both blocks: a = 18/6.0 = 3.0 m/s². The front block alone: its only horizontal force is the contact force, P = 2.0 · 3.0 = 6.0 N.
      answer: 3
    - slug: apphys1-u02-w07-q09
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 1
      prompt: |
        An elevator is moving downward and slowing to a stop at a lower floor. How does the normal force on a passenger compare with the passenger's weight during the slowing?
      options:
        - "Less than the weight, because the elevator is moving down"
        - "Equal to the weight, because the passenger moves with the elevator"
        - "Greater than the weight, because the acceleration is upward"
        - "Zero, because the passenger and the elevator move together"
      option_explanations:
        - |
          The direction of motion does not matter; the direction of the acceleration does. Slowing a downward motion requires an upward acceleration.
        - |
          Equal forces would mean constant velocity, but the elevator is slowing down.
        - |
          Correct. Velocity down and slowing means the acceleration is up. Up positive: F_N − mg = ma with a positive, so F_N is greater than mg.
        - |
          The normal force is zero only in free fall (a = g downward), not while the elevator brakes.
      answer: 2
    - slug: apphys1-u02-w07-q10
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 1
      prompt: |
        A lab group pulls one cart along a level, low-friction track with five different forces and measures each acceleration. They plot acceleration (vertical axis) against force (horizontal axis) and get a straight line through the origin with a slope of 2.0 (m/s²)/N. What is the cart's mass?
      options:
        - "2.0 kg"
        - "0.50 kg"
        - "4.0 kg"
        - "The mass cannot be found from a graph of acceleration against force."
      option_explanations:
        - |
          2.0 is the slope, which equals 1/m for a graph of a against F; the mass is its reciprocal.
        - |
          Correct. a = F/m, so the slope of a against F is 1/m = 2.0 kg⁻¹, giving m = 0.50 kg.
        - |
          4.0 kg squares the slope; nothing in a = F/m involves a square.
        - |
          The linearised graph is exactly how the mass is found: its slope is 1/m.
      answer: 1
    # ---- Spiral review
    - slug: apphys1-u02-w07-q11
      type: multiple_choice
      topic_code: "2.4"
      source: "AP Physics 1 CED, Topic 2.4"
      points: 1
      prompt: |
        A delivery van drives along a straight, level road at a constant 25 m/s. The road pushes the van forward with a 2,400 N force. What is the total backward force from air resistance and rolling resistance?
      options:
        - "Less than 2,400 N, so that the van keeps moving"
        - "Zero, since the van is not slowing down"
        - "More than 2,400 N, since the van is moving fast"
        - "2,400 N"
      option_explanations:
        - |
          A smaller backward force would leave a forward net force and the van would speed up; constant velocity needs balanced forces.
        - |
          Air and rolling resistance act on any moving van. They are balanced by the forward force, not absent.
        - |
          A larger backward force would give a backward net force and the van would slow down.
        - |
          Correct. Constant velocity means ΣF = 0 (Newton's first law), so the backward forces total exactly 2,400 N.
      answer: 3
    - slug: apphys1-u02-w07-q12
      type: multiple_choice
      topic_code: "2.3"
      source: "AP Physics 1 CED, Topic 2.3"
      points: 1
      prompt: |
        A 50 kg skater and a 75 kg skater stand facing each other on smooth ice and push apart. During the push, the 75 kg skater exerts a force of 150 N on the 50 kg skater. What force does the 50 kg skater exert on the 75 kg skater?
      options:
        - "150 N"
        - "100 N"
        - "225 N"
        - "Zero, because the lighter skater moves away faster"
      option_explanations:
        - |
          Correct. The two forces are the third-law pair of one interaction: equal in magnitude (150 N) and opposite in direction, regardless of the masses.
        - |
          100 N scales the force by the mass ratio (50/75); the forces of one interaction are equal whatever the masses.
        - |
          225 N scales by 75/50. The heavier skater does not get pushed harder; the same force gives the heavier skater the smaller acceleration.
        - |
          The lighter skater moves away faster because the same force acts on a smaller mass, not because no force acts on the other skater.
      answer: 0
    - slug: apphys1-u02-w07-q13
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        A velocity–time table for a cart reads v = 0.40 m/s at t = 1.0 s and v = 1.60 m/s at t = 4.0 s, and the v–t graph is a straight line. What is the cart's acceleration?
      options:
        - "0.40 m/s²"
        - "1.2 m/s²"
        - "0.40 m/s"
        - "0.30 m/s²"
      option_explanations:
        - |
          Correct. Acceleration is the slope of the v–t graph: (1.60 − 0.40)/(4.0 − 1.0) = 1.20/3.0 = 0.40 m/s².
        - |
          1.2 is the change in velocity in m/s; it must be divided by the 3.0 s it took.
        - |
          The number is right but the unit is not: a slope of a v–t graph has units of m/s per s, m/s².
        - |
          0.30 m/s² comes from dividing the change in velocity by 4.0 s, the final time, instead of by the elapsed time of 3.0 s.
      answer: 0
    - slug: apphys1-u02-w07-q14
      type: multi_select
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 2
      partial_credit: true
      prompt: |
        In which situations is the net force on the named object NOT zero? Select all that apply.
      options:
        - "A tennis ball at the very top of its flight, momentarily at rest (air resistance negligible)"
        - "An elevator just starting to move upward from rest"
        - "A skydiver falling at a steady terminal speed"
        - "A hockey puck sliding in a straight line at constant speed on frictionless ice"
        - "A bicycle braking to a stop on a level road"
      option_explanations:
        - |
          Correct. At the top the velocity is momentarily zero but gravity still acts, so ΣF = mg downward and the ball accelerates at g.
        - |
          Correct. Going from rest to moving up is a change in velocity, so the elevator has an upward acceleration and an upward net force.
        - |
          At a steady speed the velocity is constant; air resistance balances gravity and the net force is zero.
        - |
          Constant velocity means zero net force; nothing needs to push the puck forward.
        - |
          Correct. The bicycle's velocity is decreasing, so it has a backward acceleration and a backward net force.
      answer: [0, 1, 4]
    - slug: apphys1-u02-w07-q15
      type: multi_select
      topic_code: "2.1"
      source: "AP Physics 1 CED, Topic 2.1"
      points: 2
      partial_credit: true
      prompt: |
        A cart on a level track is pulled by a string that runs over a pulley to a hanging mass. A student chooses the system "cart + string + hanging mass". Which statements are correct for this choice? Select all that apply.
      options:
        - "The tension in the string is an internal force."
        - "The gravitational force exerted by Earth on the hanging mass is an external force."
        - "The tension in the string must be included when summing the external forces on the system."
        - "The normal force exerted by the track on the cart is an external force."
        - "The system's mass is the mass of the cart alone."
      option_explanations:
        - |
          Correct. The string is inside the system and pulls on two parts of it, so its tension forces are internal and cancel for the system.
        - |
          Correct. Earth is outside the system, so its pull on the hanging mass is external; it is the force that drives the motion.
        - |
          Internal forces cancel in pairs and are left out of the system's net force. Including the tension would count it where it does not belong.
        - |
          Correct. The track is outside the system; its normal force on the cart is external (and balances the cart's weight).
        - |
          The system includes the hanging mass too, so its mass is m_c + m_h (the string is light).
      answer: [0, 1, 3]
    - slug: apphys1-u02-w07-q16
