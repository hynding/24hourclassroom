    - slug: apphys1-u02-w07-q23
      type: short_answer
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 3
      prompt: |
        A block of mass m slides down a frictionless ramp inclined at angle θ above the horizontal.

        (a) Using Newton's second law along the ramp, derive an expression for the block's acceleration in terms of g and θ.
        (b) Show that your expression gives physically sensible results for θ = 0 and θ = 90°.
        (c) A classmate predicts that doubling the block's mass will double its acceleration. Evaluate the prediction using your expression.
      answer: |
        (a) With x down the ramp, the only force with an x component is gravity: mg sin θ = ma, so a = g sin θ.
        (b) θ = 0: a = g sin 0 = 0, as for a block resting on a level floor. θ = 90°: a = g sin 90° = g, free fall, as for a block dropped beside a vertical wall.
        (c) The prediction is wrong. The mass cancels in mg sin θ = ma, so a = g sin θ does not depend on m. Doubling m doubles the gravitational force along the ramp but also doubles the inertia, leaving the acceleration unchanged.
      explanation: |
        Three points, one per part. (a) a correct second-law equation along the ramp leading to a = g sin θ (using cos θ loses the point). (b) both limits evaluated and each linked to a physical situation. (c) rejects the prediction and explains the cancellation of mass (force and inertia both double).
    - slug: apphys1-u02-w07-q24
      type: short_answer
      topic_code: "2.3"
      source: "AP Physics 1 CED, Topic 2.3"
      points: 3
      prompt: |
        Two blocks, A (4.0 kg) and B (2.0 kg), sit side by side on a frictionless floor. In trial 1 a student pushes on A with a horizontal 18 N force, so A pushes B. In trial 2 the student pushes on B with the same 18 N force from the other side, so B pushes A.

        (a) In which trial is the force between the blocks larger? Calculate it in each trial.
        (b) In trial 1, compare the force A exerts on B with the force B exerts on A, and name the law that justifies your comparison.
        (c) Explain why the contact force is not simply 18 N in either trial.
      answer: |
        (a) The acceleration is a = 18/6.0 = 3.0 m/s² in both trials. Trial 1: the contact force accelerates B alone, 2.0 · 3.0 = 6.0 N. Trial 2: it accelerates A alone, 4.0 · 3.0 = 12 N. The contact force is larger in trial 2.
        (b) They are equal in magnitude (6.0 N) and opposite in direction, by Newton's third law: they are the two forces of the A–B interaction.
        (c) The pushed block needs part of the 18 N to accelerate its own mass; only the rest is passed on to the other block, which needs just enough force to give its mass the shared 3.0 m/s².
      explanation: |
        Three points, one per part. (a) both contact forces (6.0 N and 12 N) with trial 2 identified as larger. (b) equal and opposite, citing the third law. (c) part of the push accelerates the block that is pushed directly. An answer to (a) that gets the comparison right without calculations earns no credit.
    - slug: apphys1-u02-w07-q25
      type: long_answer
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 6
      prompt: |
        A lab group wants to find the mass of a cart (with a force sensor mounted on it) by using Newton's second law. They have a level, low-friction track, a motion sensor, a string, and a force sensor that reads the tension in the string.

        (A) Describe a procedure the group could follow. Say what they measure, with which instrument, and what they do to reduce uncertainty.

        (B) The group's data (invented) are below.

        | Pulling force F (N) | 0.30 | 0.60 | 0.90 | 1.20 | 1.50 |
        |---|---|---|---|---|---|
        | Acceleration a (m/s²) | 0.24 | 0.49 | 0.70 | 0.97 | 1.21 |

        Which quantities should they graph to get a straight line whose slope is the mass? Explain.

        (C) Use the data to determine the mass of the cart and sensor.

        (D) The group then repeats the experiment on a track with a small, constant friction force acting on the cart. Describe how the straight line in (B) would change, and whether the slope would still give the mass.
      answer: |
        (A) Attach the string to the force sensor on the cart and pull it along the track (by hand with a steady pull, or with a hanging mass over a pulley). For each trial record the force sensor reading and use the motion sensor to record velocity against time; the slope of the straight part of the v–t graph is the acceleration. Use at least five different forces over a wide range, repeat each trial three times and average, and check that the track is level.
        (B) Graph F (vertical axis) against a (horizontal axis). Newton's second law F = ma predicts a straight line through the origin with slope m. (Graphing a against F gives slope 1/m, which also works if they then take the reciprocal.)
        (C) A best-fit line through the data has slope ≈ 1.24 N/(m/s²), so m ≈ 1.2 kg. (Two points far apart: (1.50 − 0.30)/(1.21 − 0.24) = 1.20/0.97 ≈ 1.24 kg.)
        (D) With friction F_f, the net force is F − F_f = ma, so F = ma + F_f: the line shifts up by F_f (a positive intercept on the F axis) but keeps the same slope, so the slope still gives the mass.
      explanation: |
        Six points (experimental design and analysis style).
        (A) 2 points: 1 for measuring force with the force sensor and acceleration from the slope of a v–t graph (motion sensor); 1 for a sensible step to reduce uncertainty (repeated trials averaged, five or more forces over a wide range, level track).
        (B) 1 point: F against a (or a against F) with the slope identified as m (or 1/m) and justified by F = ma.
        (C) 1 point: m ≈ 1.2 kg (accept 1.18–1.30 kg) from a best-fit slope or two widely separated points, not from a single data pair.
        (D) 2 points: 1 for the line shifting by the friction force (a non-zero intercept); 1 for stating that the slope, and so the mass, is unchanged, with reasoning from F = ma + F_f.
