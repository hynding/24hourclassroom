        True or false: Ignoring air resistance, a 2.0 kg rock dropped from a bridge accelerates toward the water faster than a 0.50 kg rock dropped beside it, because a larger gravitational force acts on it.
      answer: false
      explanation: |
        False. The gravitational force on the 2.0 kg rock is four times larger, but its mass, its inertia, is also four times larger. a = F_g/m = mg/m = g for both, so they fall side by side with acceleration 9.8 m/s².
