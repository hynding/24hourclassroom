  - slug: apphys1-u02-exam-q43
    type: long_answer
    topic_code: "2.7"
    source: "AP Physics 1 CED, Topic 2.7"
    points: 10
    prompt: |
      Mathematical routines. Block A (mass m_A = 4.0 kg) sits on a ramp inclined at θ = 30° above the horizontal. A light string attached to block A runs parallel to the ramp, up and over a light, frictionless pulley at the top, to block B (mass m_B = 3.0 kg), which hangs freely. The coefficient of kinetic friction between block A and the ramp is 0.20. When released from rest, block B moves down and block A moves up the ramp.

      (A) Describe the free-body diagram of block A and of block B in words, naming each force and its direction.

      (B) Derive an expression for the magnitude of the acceleration of the blocks in terms of m_A, m_B, θ, μ_k and g.

      (C) Calculate the acceleration of the blocks and the tension in the string.

      (D) Without changing the masses or the angle, a student wants the blocks to move at constant speed after a small push. Determine the coefficient of kinetic friction that would be needed.

      (E) A classmate claims that if block B's mass were doubled, the acceleration would double. Use your expression from (B) to evaluate the claim.
    answer: |
      (A) Block A: the gravitational force m_A g straight down; the normal force F_N perpendicular to the ramp, away from its surface; the tension T along the string, up the ramp; kinetic friction along the ramp, down the slope (A moves up). Block B: the gravitational force m_B g down and the tension T up, with the downward force larger.
      (B) Block A along the ramp (up positive): T − m_A g sin θ − μ_k m_A g cos θ = m_A a, using F_N = m_A g cos θ. Block B (down positive): m_B g − T = m_B a. Adding: a = [m_B − m_A(sin θ + μ_k cos θ)]g/(m_A + m_B).
      (C) a = [3.0 − 4.0(0.500 + 0.20 × 0.866)] × 9.8/7.0 = (3.0 − 2.693) × 1.4 ≈ 0.43 m/s². T = m_B(g − a) = 3.0 × (9.8 − 0.43) ≈ 28 N.
      (D) Constant speed means a = 0: m_B = m_A(sin θ + μ_k cos θ), so μ_k = (m_B − m_A sin θ)/(m_A cos θ) = (3.0 − 2.0)/(3.464) ≈ 0.29.
      (E) The claim is false. With m_B = 6.0 kg, a = [6.0 − 2.693] × 9.8/10.0 ≈ 3.2 m/s², about 7.5 times larger, not twice. Doubling m_B more than doubles the numerator's net driving term (because a fixed resisting term is subtracted) while also increasing the total mass in the denominator, so a is not proportional to m_B.
    explanation: |
      Ten points.
      (A) 2 points: 1 for block A's four forces with correct directions (friction down the slope, normal force perpendicular to the ramp); 1 for block B's two forces with gravity larger than tension. Any "force of motion" or extra arrow loses that point.
      (B) 3 points: 1 for F_N = m_A g cos θ used in the friction term; 1 for correct second-law equations for both blocks (or for the system along the string); 1 for the correct final expression.
      (C) 2 points: 1 for a ≈ 0.43 m/s² (accept 0.4 to 0.45); 1 for T ≈ 28 N (accept 28 to 28.2 N). A tension equal to m_B g = 29.4 N earns no point.
      (D) 2 points: 1 for setting a = 0 (or ΣF = 0) in the expression; 1 for μ_k ≈ 0.29.
      (E) 1 point: rejects the claim using the expression (a is not proportional to m_B because of the subtracted term and the larger denominator), with or without the value 3.2 m/s².
  - slug: apphys1-u02-exam-q44
    type: long_answer
    topic_code: "2.5"
    source: "AP Physics 1 CED, Topic 2.5"
    points: 10
    prompt: |
      Experimental design and analysis. A lab group wants to find the total mass M of a system made of a cart on a level, low-friction track, a light string over a pulley at the end of the track, and a hanger with slotted masses on the string. They have a set of slotted masses, a balance, a motion sensor and a metre stick. They will keep M constant by moving slotted masses between the cart and the hanger, so that only the hanging mass m_h changes from trial to trial.

      (A) Describe a procedure the group could use to collect the data they need, including what they measure, with which equipment, and how they reduce uncertainty.

      (B) Treating the track as frictionless, derive an expression for the system's acceleration a in terms of m_h, g and M. State which quantities the group should graph to get a straight line, and what the slope represents.

      The group collects these data:

      | Hanging mass m_h (kg) | 0.020 | 0.040 | 0.060 | 0.080 | 0.100 |
      |---|---|---|---|---|---|
      | Acceleration a (m/s²) | 0.23 | 0.50 | 0.72 | 0.99 | 1.21 |

      (C) Using your graph from (B), determine the total mass M. Show the values you graphed.

      (D) A second group finds that their best-fit line crosses the horizontal axis at a positive value of hanging weight, not at the origin. Give a physical reason for this and explain what it means.
    answer: |
      (A) Measure each slotted mass with the balance. Start with most masses on the cart and a small m_h on the hanger. Release the cart from rest and use the motion sensor to record velocity against time; the slope of the straight part of the velocity–time graph is the acceleration. Move one slotted mass from the cart to the hanger (keeping M constant) and repeat for at least five values of m_h. Do three trials at each m_h and average the accelerations; keep the string parallel to the track and level the track first.
      (B) For the system, the only external force along the string is the hanging weight m_h g (the tension is internal; normal force and the cart's weight balance), so m_h g = Ma, giving a = m_h g/M. Graph a (vertical) against m_h g (horizontal): a straight line through the origin with slope 1/M.
      (C) Hanging weights m_h g: 0.196, 0.392, 0.588, 0.784 and 0.980 N. The best-fit slope of a against m_h g is about 1.25 kg⁻¹ (for example, (1.21 − 0.23)/(0.980 − 0.196) = 0.98/0.784 ≈ 1.25), so M = 1/slope ≈ 0.80 kg.
      (D) Friction (in the wheels or pulley, or a slightly tilted track) means a small hanging weight is needed before the system accelerates at all: the data fit m_h g − F_f = Ma, so the line crosses the horizontal axis at m_h g = F_f. The intercept estimates the friction force; the slope still gives 1/M.
    explanation: |
      Ten points.
      (A) 3 points: 1 for measuring m_h with the balance and the acceleration with the motion sensor (slope of velocity–time, or position–time data analysed for a); 1 for keeping M constant by moving masses from cart to hanger and using at least five values of m_h; 1 for a valid way to reduce uncertainty (repeated trials averaged, levelling the track, string parallel to the track).
      (B) 3 points: 1 for identifying m_h g as the only external force along the motion; 1 for a = m_h g/M; 1 for graphing a against m_h g (or against m_h) with the slope identified as 1/M (or g/M).
      (C) 2 points: 1 for the computed graphed values (m_h g, or m_h with slope g/M ≈ 12.3 m/s² per kg) and a slope from a best-fit line rather than one data pair; 1 for M ≈ 0.80 kg (accept 0.78 to 0.82 kg).
      (D) 2 points: 1 for identifying friction (or a track tilted slightly uphill toward the pulley) as the cause; 1 for explaining that the intercept equals the force that must be overcome before the system accelerates, so it measures the friction force.
