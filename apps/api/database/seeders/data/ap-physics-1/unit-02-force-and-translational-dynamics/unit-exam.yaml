    type: short_answer
    topic_code: "2.6"
    source: "AP Physics 1 CED, Topic 2.6"
    points: 3
    prompt: |
      A space station orbits 4.0 × 10⁵ m above Earth's surface. Earth's radius is 6.37 × 10⁶ m and g = 9.8 N/kg at the surface. A student says, "Astronauts float inside the station because there is no gravity up there."

      (a) Calculate the gravitational field strength at the station's altitude.
      (b) Use your answer to evaluate the student's claim.
      (c) A bathroom scale strapped to the station floor reads zero when an astronaut stands on it. Explain why, in terms of the forces on the astronaut and the motion of the astronaut and station.
    answer: |
      (a) g = 9.8 × (R/(R + h))² = 9.8 × (6.37 × 10⁶/6.77 × 10⁶)² ≈ 8.7 N/kg.
      (b) The claim is wrong: the field is still about 89% of its surface value, so Earth pulls on each astronaut with nearly their full surface weight.
      (c) The astronaut and the station are both falling around Earth with the same acceleration, g ≈ 8.7 m/s² toward Earth's centre, produced by gravity alone. The scale does not need to push on the astronaut to give them that acceleration, so the normal force (the scale reading) is zero; the astronaut is in free fall, not free of gravity.
    explanation: |
      Three points, one per part. (a) about 8.7 N/kg (accept 8.6 to 8.8), using the inverse-square dependence on distance from Earth's centre (not from the surface). (b) rejects the claim, citing the field value from (a) as evidence. (c) both astronaut and station accelerate together under gravity alone (free fall), so no normal force is needed and the scale reads zero.
