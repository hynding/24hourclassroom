unit: 2
description: |
  44 questions · about 90 minutes · every topic of Unit 2 (2.1 to 2.9): systems and centre of mass, free-body
  diagrams, Newton's three laws, gravitational force and field strength, static and kinetic friction, spring
  forces and circular motion. Includes three shared-context sets (a four-question set on a force-plate scale in an
  elevator, a four-question set on two blocks joined by a string and pulled across a rough table, and a
  four-question set on a car rounding a flat curve), select-all, true/false, fill-in-the-blank and numeric items,
  two short-answer questions (3 points each) and two free-response questions in the 2027 AP style (10 points
  each: a mathematical routines question on blocks connected over a pulley on a rough incline, and an
  experimental design and analysis question on finding a cart's mass from acceleration data). Use g = 9.8 m/s².
  Calculator and equation sheet allowed throughout. Multiple choice, select-all, true/false and numeric items are
  graded at once; fill-in-the-blank items are matched automatically; the short answers and free-response
  questions are graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: force-plate scale in an elevator (2.5, 2.4, 2.3, 2.2)
  - slug: apphys1-u02-exam-q01
    type: multiple_choice
    topic_code: "2.5"
    source: "AP Physics 1 CED, Topic 2.5"
    points: 1
    stimulus: |
      A 55 kg student stands on a force-plate scale in an elevator that starts at rest on the ground floor, rides up and stops at an upper floor. The scale's readings:

      | Time interval (s) | 0.0 to 2.0 | 2.0 to 8.0 | 8.0 to 10.0 |
      |---|---|---|---|
      | Scale reading (N) | 621 | 539 | 457 |
    prompt: |
      What is the student's acceleration during the first 2.0 s?
    options:
      - "11 m/s² upward"
      - "1.5 m/s² upward"
      - "1.5 m/s² downward"
      - "Zero, because the scale reading is constant during the interval"
    option_explanations:
      - |
        This divides the whole scale reading by the mass, 621/55; the student's weight must be subtracted first to get the net force.
      - |
        Correct. The net force is F_N − mg = 621 − 55 × 9.8 = 621 − 539 = 82 N upward, so a = 82/55 ≈ 1.5 m/s² upward.
      - |
        The scale pushes up with more than the student's weight, so the net force, and the acceleration, point up.
      - |
        A constant reading means a constant net force, and here the reading exceeds mg, so the acceleration is constant but not zero.
    answer: 1
  - slug: apphys1-u02-exam-q02
    type: multiple_choice
    topic_code: "2.4"
    source: "AP Physics 1 CED, Topic 2.4"
    points: 1
    stimulus: |
      A 55 kg student stands on a force-plate scale in an elevator that starts at rest on the ground floor, rides up and stops at an upper floor. The scale's readings:

      | Time interval (s) | 0.0 to 2.0 | 2.0 to 8.0 | 8.0 to 10.0 |
      |---|---|---|---|
      | Scale reading (N) | 621 | 539 | 457 |
    prompt: |
      Which best describes the elevator's motion from 2.0 s to 8.0 s?
    options:
      - "At rest, because the scale reads the student's weight"
      - "Moving upward and slowing down"
      - "Moving upward and speeding up at a smaller rate"
      - "Moving upward at a constant 3.0 m/s"
    option_explanations:
      - |
        A reading equal to mg means zero net force, which allows constant velocity as well as rest; the elevator had already gained speed in the first 2.0 s.
      - |
        Slowing down while moving up needs a downward net force, which would make the reading less than 539 N; that happens only after 8.0 s.
      - |
        Any upward acceleration would make the reading exceed mg = 539 N.
      - |
        Correct. The reading equals mg = 539 N, so the net force is zero and the velocity is constant (Newton's first law). That velocity is what the first interval produced: v = at = 1.5 × 2.0 = 3.0 m/s upward.
    answer: 3
  - slug: apphys1-u02-exam-q03
    type: multiple_choice
    topic_code: "2.3"
    source: "AP Physics 1 CED, Topic 2.3"
    points: 1
    stimulus: |
      A 55 kg student stands on a force-plate scale in an elevator that starts at rest on the ground floor, rides up and stops at an upper floor. The scale's readings:

      | Time interval (s) | 0.0 to 2.0 | 2.0 to 8.0 | 8.0 to 10.0 |
      |---|---|---|---|
      | Scale reading (N) | 621 | 539 | 457 |
    prompt: |
      During the first 2.0 s, the scale pushes up on the student with 621 N. What is the Newton's third law partner of that force?
    options:
      - "The student pushes down on the scale with 621 N"
      - "Earth pulls down on the student with 539 N"
      - "The student pushes down on the scale with 539 N"
      - "The elevator floor pushes up on the scale with 621 N"
    option_explanations:
      - |
        Correct. The interaction is between scale and student, so its partner is the student's push on the scale: equal in size (621 N), opposite in direction, acting on the scale.
      - |
        That force acts on the student too, comes from a different interaction (with Earth) and is not equal in size here.
      - |
        Third-law partners are always equal in magnitude, even while accelerating; the student pushes down with 621 N, not with their weight.
      - |
        That force comes from the floor–scale interaction, not the scale–student one.
    answer: 0
  - slug: apphys1-u02-exam-q04
    type: multiple_choice
    topic_code: "2.2"
    source: "AP Physics 1 CED, Topic 2.2"
    points: 1
    stimulus: |
      A 55 kg student stands on a force-plate scale in an elevator that starts at rest on the ground floor, rides up and stops at an upper floor. The scale's readings:

      | Time interval (s) | 0.0 to 2.0 | 2.0 to 8.0 | 8.0 to 10.0 |
      |---|---|---|---|
      | Scale reading (N) | 621 | 539 | 457 |
    prompt: |
      Which describes the student's free-body diagram between 8.0 s and 10.0 s?
    options:
      - "An upward normal force longer than the downward gravitational force"
      - "Equal upward normal force and downward gravitational force"
      - "An upward normal force shorter than the downward gravitational force"
      - "An upward normal force, a downward gravitational force and an upward force of motion"
    option_explanations:
      - |
        This would give an upward acceleration; the elevator is slowing while moving up, so its acceleration is downward.
      - |
        Equal forces mean constant velocity, but the scale reads 457 N, less than the 539 N weight.
      - |
        Correct. The scale (normal force) reads 457 N, less than the 539 N gravitational force, so the net force is downward, matching the downward acceleration of an elevator slowing as it rises.
      - |
        There is no force of motion; the student keeps moving up because of their velocity, while the net force slows them.
    answer: 2
  # ---- Stimulus set B: two blocks on a rough table (2.5, 2.5, 2.7, 2.1)
  - slug: apphys1-u02-exam-q05
    type: multiple_choice
    topic_code: "2.5"
    source: "AP Physics 1 CED, Topic 2.5"
    points: 1
    stimulus: |
      Two blocks on a level table are joined by a light horizontal string. Block 1 (2.0 kg) is at the back; block 2 (3.0 kg) is at the front. A student pulls block 2 forward with a horizontal force of 30 N. The coefficient of kinetic friction between each block and the table is 0.20, and both blocks slide forward together.
    prompt: |
      What is the acceleration of the blocks?
    options:
      - "6.0 m/s²"
      - "8.0 m/s²"
      - "10 m/s²"
      - "4.0 m/s²"
    option_explanations:
      - |
        This is 30 N/5.0 kg, ignoring the friction on both blocks.
      - |
        This subtracts friction on block 2 only (5.9 N) and divides by block 2's mass alone; take both blocks as the system.
      - |
        This divides the pull by block 2's mass alone and ignores friction; the string makes block 1 accelerate too.
      - |
        Correct. For the two-block system, friction totals 0.20 × 5.0 × 9.8 = 9.8 N, so a = (30 − 9.8)/5.0 ≈ 4.0 m/s². The string tension is internal.
    answer: 3
  - slug: apphys1-u02-exam-q06
    type: multiple_choice
    topic_code: "2.5"
    source: "AP Physics 1 CED, Topic 2.5"
    points: 1
    stimulus: |
      Two blocks on a level table are joined by a light horizontal string. Block 1 (2.0 kg) is at the back; block 2 (3.0 kg) is at the front. A student pulls block 2 forward with a horizontal force of 30 N. The coefficient of kinetic friction between each block and the table is 0.20, and both blocks slide forward together.
    prompt: |
      What is the tension in the string?
    options:
      - "12 N"
      - "30 N"
      - "18 N"
      - "3.9 N"
    option_explanations:
      - |
        Correct. For block 1 alone: T − μ_k m₁g = m₁a, so T = 2.0 × (4.04 + 1.96) = 12 N.
      - |
        The full 30 N would leave nothing to accelerate block 2 against its own friction; the string pulls with less.
      - |
        This assigns the string the share of 30 N proportional to block 2's mass; the string accelerates block 1, so the share follows block 1's mass (2.0/5.0 × 30 N = 12 N).
      - |
        This is only the friction on block 1; the string must also give block 1 its acceleration.
    answer: 0
  - slug: apphys1-u02-exam-q07
    type: multiple_choice
    topic_code: "2.7"
    source: "AP Physics 1 CED, Topic 2.7"
    points: 1
    stimulus: |
      Two blocks on a level table are joined by a light horizontal string. Block 1 (2.0 kg) is at the back; block 2 (3.0 kg) is at the front. A student pulls block 2 forward with a horizontal force of 30 N. The coefficient of kinetic friction between each block and the table is 0.20, and both blocks slide forward together.
    prompt: |
      The table is replaced by a rougher one with μ_k = 0.30 for both blocks, and the student still pulls with 30 N. How does the string tension change?
    options:
      - "It increases, because block 1 now has more friction to overcome"
      - "It stays the same"
      - "It decreases, because the blocks accelerate less"
      - "It drops to zero, because friction now balances the pull"
    option_explanations:
      - |
        Block 1's friction does grow, but the acceleration falls by exactly enough that T = m₁(a + μ_k g) is unchanged.
      - |
        Correct. Solving gives a = F/(m₁ + m₂) − μ_k g, so T = m₁(a + μ_k g) = m₁F/(m₁ + m₂) = 12 N, with no μ_k in it (as long as the blocks still slide).
      - |
        The acceleration does decrease, but the string must also overcome more friction on block 1, and the two effects cancel.
      - |
        Total friction is 0.30 × 49 = 14.7 N, still less than 30 N, so the blocks keep accelerating and the string stays taut.
    answer: 1
  - slug: apphys1-u02-exam-q08
    type: multi_select
    topic_code: "2.1"
    source: "AP Physics 1 CED, Topic 2.1"
    points: 2
    partial_credit: true
    stimulus: |
      Two blocks on a level table are joined by a light horizontal string. Block 1 (2.0 kg) is at the back; block 2 (3.0 kg) is at the front. A student pulls block 2 forward with a horizontal force of 30 N. The coefficient of kinetic friction between each block and the table is 0.20, and both blocks slide forward together.
    prompt: |
      The system is chosen as both blocks and the string. Which forces are external to this system? Select all that apply.
    options:
      - "The student's 30 N pull on block 2"
      - "The string's pull on block 1"
      - "The table's friction on block 1"
      - "The string's pull on block 2"
      - "Earth's gravitational force on each block"
    option_explanations:
      - |
        Correct. The student is outside the system.
      - |
        The string is inside the system, so its pulls on the blocks are internal forces; they cancel in the system's net force.
      - |
        Correct. The table is outside the system, so its friction on either block is external.
      - |
        This is internal for the same reason: both the string and block 2 are part of the system.
      - |
        Correct. Earth is outside the system; its pull is external (balanced here by the table's normal forces).
    answer: [0, 2, 4]
  # ---- Stimulus set C: a car on a flat curve (2.9, 2.9, 2.9, 2.7)
  - slug: apphys1-u02-exam-q09
    type: multiple_choice
    topic_code: "2.9"
    source: "AP Physics 1 CED, Topic 2.9"
    points: 1
    stimulus: |
      A 1200 kg car rounds a flat, level curve of radius 40 m at a constant speed of 12 m/s. The coefficient of static friction between its tyres and the dry road is 0.75.
    prompt: |
      What is the magnitude of the friction force the road exerts on the car?
    options:
      - "8800 N"
      - "360 N"
      - "4300 N"
      - "12,000 N"
    option_explanations:
      - |
        This is the maximum static friction, μ_s mg = 0.75 × 11,760 N; the car is not about to skid, so friction is only what the curve requires.
      - |
        This is mv/r, using v instead of v²; centripetal acceleration is v²/r.
      - |
        Correct. Friction supplies the inward force: F_f = mv²/r = 1200 × 144/40 = 4320 N ≈ 4300 N, less than the 8820 N maximum.
      - |
        This is about the car's weight, mg; the friction needed depends on the speed and radius, not just the weight.
    answer: 2
  - slug: apphys1-u02-exam-q10
    type: numeric
    topic_code: "2.9"
    source: "AP Physics 1 CED, Topic 2.9"
    points: 1
    stimulus: |
      A 1200 kg car rounds a flat, level curve of radius 40 m at a constant speed of 12 m/s. The coefficient of static friction between its tyres and the dry road is 0.75.
    prompt: |
      What is the greatest speed at which the car could round this curve without skidding? Give your answer in m/s to three significant figures.
    answer: { value: 17.1, tolerance: 0.1 }
    explanation: |
      At the limit, maximum static friction supplies the inward force: μ_s mg = mv²/r, so v_max = √(μ_s g r) = √(0.75 × 9.8 × 40) = √294 ≈ 17.1 m/s. The mass cancels. (With g = 10 m/s² the result would be 17.3 m/s.)
  - slug: apphys1-u02-exam-q11
    type: multiple_choice
    topic_code: "2.9"
    source: "AP Physics 1 CED, Topic 2.9"
    points: 1
    stimulus: |
      A 1200 kg car rounds a flat, level curve of radius 40 m at a constant speed of 12 m/s. The coefficient of static friction between its tyres and the dry road is 0.75.
    prompt: |
      Which is the direction of the friction force from the road on the car, and what kind of friction is it?
    options:
      - "Static friction, toward the centre of the curve"
      - "Kinetic friction, toward the centre of the curve"
      - "Static friction, away from the centre of the curve"
      - "Kinetic friction, backward along the car's velocity"
    option_explanations:
      - |
        Correct. The tyres do not slide sideways on the road, so the friction is static, and it must point toward the centre to supply the inward net force mv²/r.
      - |
        The direction is right, but the tyres are not skidding across the road, so the friction is static.
      - |
        An outward force would push the car off the curve; the net force on a car moving in a circle points inward.
      - |
        A backward force would slow the car; it moves at constant speed, and turning requires a sideways, inward force.
    answer: 0
  - slug: apphys1-u02-exam-q12
    type: multiple_choice
    topic_code: "2.7"
    source: "AP Physics 1 CED, Topic 2.7"
    points: 1
    stimulus: |
      A 1200 kg car rounds a flat, level curve of radius 40 m at a constant speed of 12 m/s. The coefficient of static friction between its tyres and the dry road is 0.75.
    prompt: |
      The driver tries to take the same curve at 24 m/s. What happens, and why?
    options:
      - "The car rounds the curve, because doubling the speed only doubles the friction needed, to about 8600 N"
      - "The car rounds the curve, because static friction increases to match whatever is needed"
      - "The car rounds the curve only if it is heavier, because more mass means more friction"
      - "The car skids, because it would need about 17,000 N of friction but the road can supply at most about 8800 N"
    option_explanations:
      - |
        The friction needed is proportional to v², so doubling the speed quadruples it, to about 17,300 N, not doubles it.
      - |
        Static friction adjusts only up to its maximum, μ_s mg ≈ 8820 N; beyond that the tyres slip.
      - |
        Mass cancels: both the friction available (μ_s mg) and the friction needed (mv²/r) are proportional to m.
      - |
        Correct. The needed inward force becomes mv²/r = 1200 × 576/40 ≈ 17,300 N, four times 4320 N, while the maximum static friction is 0.75 × 11,760 ≈ 8820 N. The tyres slip and the car slides toward the outside of the curve.
    answer: 3
  # ---- Independent items
  - slug: apphys1-u02-exam-q13
    type: multiple_choice
    topic_code: "2.1"
    source: "AP Physics 1 CED, Topic 2.1"
    points: 1
    prompt: |
      Three small objects lie on a light metre-long board along one line: a 1.0 kg object at x = 0, a 2.0 kg object at x = 1.0 m and a 3.0 kg object at x = 3.0 m (the board is extended with a light rod). Where is the centre of mass of the three objects?
    options:
      - "x = 1.3 m"
      - "x = 1.8 m"
      - "x = 1.5 m"
      - "x = 2.2 m"
    option_explanations:
      - |
        This averages the three positions without weighting them by mass; the heavy object at 3.0 m pulls the centre of mass toward it.
      - |
        Correct. x_cm = (1.0 × 0 + 2.0 × 1.0 + 3.0 × 3.0)/(1.0 + 2.0 + 3.0) = 11/6 ≈ 1.8 m.
      - |
        This is the midpoint between the end objects, which would be right only for two equal masses at the ends.
      - |
        This divides the sum 11 kg·m by 5 kg instead of the total mass, 6 kg.
    answer: 1
  - slug: apphys1-u02-exam-q14
    type: multiple_choice
    topic_code: "2.1"
    source: "AP Physics 1 CED, Topic 2.1"
    points: 1
    prompt: |
      A firework shell is moving along its curved path through the air when it bursts into many fragments. Ignoring air resistance, how does the centre of mass of all the fragments move just after the burst (before any fragment lands)?
    options:
      - "It drops straight down, because the explosion cancels the shell's forward motion"
      - "It stops for an instant where the burst happened, then falls"
      - "It continues along the same curved path the unexploded shell would have followed"
      - "It moves toward the largest fragment, wherever that fragment goes"
    option_explanations:
      - |
        The explosion's forces are internal to the system of fragments; they push fragments apart in pairs and cannot remove the centre of mass's forward velocity.
      - |
        Stopping would need a large external force on the system. The burst forces are internal, so the centre of mass keeps its velocity.
      - |
        Correct. The burst forces are internal and cancel in pairs for the system of fragments. The only external force is still gravity, so the centre of mass keeps accelerating at g and follows the shell's original projectile path.
      - |
        The largest fragment pulls the centre of mass toward its own position only partly, and the other fragments balance it; the centre of mass's motion is set by the external force, gravity, alone.
    answer: 2
  - slug: apphys1-u02-exam-q15
    type: multiple_choice
    topic_code: "2.2"
    source: "AP Physics 1 CED, Topic 2.2"
    points: 1
    prompt: |
      A diver springs straight up off a diving board. Ignoring air resistance, which forces act on the diver at the instant she reaches her highest point?
    options:
      - "Only the downward gravitational force"
      - "The downward gravitational force and the upward force of the diving board"
      - "No forces, because the diver is momentarily at rest"
      - "The downward gravitational force and an equal upward force that holds her still"
    option_explanations:
      - |
        Correct. Once her feet leave the board only Earth acts on her. At the top her velocity is zero but her acceleration is still g downward, so the gravitational force is the only force.
      - |
        The board's push ends when her feet leave it; she rises because of her velocity, not because a force keeps pushing her.
      - |
        Momentarily zero velocity does not mean zero force; her velocity is changing at the top, so a net force acts.
      - |
        Balanced forces would leave her hanging at rest; she immediately starts falling, so the forces are not balanced.
    answer: 0
  - slug: apphys1-u02-exam-q16
    type: multiple_choice
    topic_code: "2.3"
    source: "AP Physics 1 CED, Topic 2.3"
    points: 1
    prompt: |
      A small tugboat pushes a large barge from behind, and the two speed up together. How does the force the tugboat exerts on the barge compare with the force the barge exerts on the tugboat?
    options:
      - "The tugboat exerts a larger force, because the two are speeding up in the direction it pushes"
      - "The tugboat exerts a larger force, because only the tugboat has an engine"
      - "The barge exerts a larger force, because it has much more mass"
      - "The forces are equal in magnitude and opposite in direction"
    option_explanations:
      - |
        The pair speeds up because the water pushes the tugboat's propeller forward harder than the water resists the barge; the tug–barge forces themselves are still equal.
      - |
        The engine lets the tugboat push on the water, which pushes it forward. It does not let the tugboat push the barge harder than the barge pushes back.
      - |
        A larger mass means the same force gives the barge a smaller acceleration; it does not make the barge push harder.
      - |
        Correct. The two forces are a Newton's third law pair from the tug–barge contact: equal in magnitude, opposite in direction, acting on different objects, whatever the motion.
    answer: 3
  - slug: apphys1-u02-exam-q17
    type: multiple_choice
    topic_code: "2.3"
    source: "AP Physics 1 CED, Topic 2.3"
    points: 1
    prompt: |
      A helicopter hovers at rest. Its spinning rotor pushes air downward. What is the Newton's third law partner of the force the rotor exerts on the air?
    options:
      - "The gravitational force Earth exerts on the helicopter"
      - "The upward force the air exerts on the rotor"
      - "The gravitational force the helicopter exerts on Earth"
      - "The force the downward-moving air exerts on the ground below"
    option_explanations:
      - |
        This force balances the air's upward push on the helicopter (first law), but it acts on the helicopter and comes from a different, gravitational interaction.
      - |
        Correct. The interaction is between rotor and air, so the partner is the air's push on the rotor: equal in size, opposite in direction (upward). It is the force that holds the helicopter up.
      - |
        That is the partner of Earth's gravitational pull on the helicopter, part of the helicopter–Earth interaction, not the rotor–air one.
      - |
        That force comes from a separate air–ground interaction; neither object in it is the rotor.
    answer: 1
  - slug: apphys1-u02-exam-q18
    type: multiple_choice
    topic_code: "2.4"
    source: "AP Physics 1 CED, Topic 2.4"
    points: 1
    prompt: |
      A city bus brakes suddenly and a standing passenger lurches forward. Which statement best explains the lurch?
    options:
      - "A forward force from the braking pushes the passenger forward"
      - "The passenger's inertia is a forward force that acts during braking"
      - "The passenger's body tends to keep moving at its original velocity while the bus slows down beneath it"
      - "The bus's backward acceleration exerts a forward force on everything inside it"
    option_explanations:
      - |
        Nothing pushes the passenger forward; the brakes act on the bus, not on the passenger.
      - |
        Inertia is the tendency to keep the same velocity, not a force; it never appears on a free-body diagram.
      - |
        Correct. By Newton's first law, the passenger keeps moving forward at the original velocity unless a net force acts. The bus slows, so relative to the bus the passenger moves forward until friction from the floor or a handrail slows them too.
      - |
        An acceleration is not a force on other objects; only interactions (here floor friction, which points backward) exert forces on the passenger.
    answer: 2
  - slug: apphys1-u02-exam-q19
    type: multiple_choice
    topic_code: "2.5"
    source: "AP Physics 1 CED, Topic 2.5"
    points: 1
    prompt: |
      A 1200 kg car accelerates along a straight, level road. Its velocity is recorded every 2.0 s:

      | Time (s) | 0.0 | 2.0 | 4.0 | 6.0 |
      |---|---|---|---|---|
      | Velocity (m/s) | 0.0 | 4.0 | 8.0 | 12.0 |

      What is the net force on the car?
    options:
      - "4800 N"
      - "14,400 N"
      - "11,800 N"
      - "2400 N"
    option_explanations:
      - |
        This takes the acceleration as 4.0 m/s², the change in velocity per row, without dividing by the 2.0 s between rows.
      - |
        This multiplies the mass by the final velocity; the net force is mass times acceleration, the slope of the velocity–time graph.
      - |
        This is the car's weight, mg; the net horizontal force depends on its acceleration along the road.
      - |
        Correct. The velocity rises by 4.0 m/s every 2.0 s, so a = 2.0 m/s² (the slope), and ΣF = ma = 1200 × 2.0 = 2400 N forward.
    answer: 3
  - slug: apphys1-u02-exam-q20
    type: multiple_choice
    topic_code: "2.5"
    source: "AP Physics 1 CED, Topic 2.5"
    points: 1
    prompt: |
      A 3.0 kg block and a 2.0 kg block hang from the two ends of a light string passing over a light, frictionless pulley. The blocks are released from rest. What is the tension in the string while they move?
    options:
      - "23.5 N"
      - "29.4 N"
      - "19.6 N"
      - "24.5 N"
    option_explanations:
      - |
        Correct. The system accelerates at a = (3.0 − 2.0)g/(3.0 + 2.0) = 1.96 m/s². For the rising 2.0 kg block, T − 19.6 = 2.0 × 1.96, so T ≈ 23.5 N.
      - |
        This is the heavier block's weight; it accelerates downward, so the string pulls it up with less than its weight.
      - |
        This is the lighter block's weight; it accelerates upward, so the string must pull it with more than its weight.
      - |
        This averages the two weights; the tension follows from Newton's second law for either block, which gives 23.5 N.
    answer: 0
  - slug: apphys1-u02-exam-q21
