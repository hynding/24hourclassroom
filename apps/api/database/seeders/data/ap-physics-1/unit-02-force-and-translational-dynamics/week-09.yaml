    - slug: apphys1-u02-w09-q22
      type: short_answer
      topic_code: "2.7"
      source: "AP Physics 1 CED, Topic 2.7"
      points: 3
      prompt: |
        A student claims: "A brick slid on its wide, flat face has more friction than the same brick slid on its narrow edge, because more of it is touching the floor." The brick is pulled across the same level floor at constant velocity both times.

        (a) Do you agree or disagree with the student? Use the model of kinetic friction to justify your answer.
        (b) Describe an experiment, with a force sensor, that would test the claim, and say what result would support your answer to (a).
      answer: |
        (a) Disagree. Kinetic friction is F_f,k = μ_k F_N. On either face the only vertical forces on the brick are its weight and the normal force, so F_N = mg both times, and μ_k is the same for the same two materials. Contact area does not appear, so the friction force is the same.
        (b) Attach a force sensor parallel to the floor and pull the brick at a slow, constant velocity, first on its wide face and then on its narrow edge, reading the steady force each time (which equals kinetic friction by Newton's first law). Repeat each orientation several times and average. Equal average readings, within the scatter of the trials, support (a).
      explanation: |
        Three points. 1 point: disagrees and states that kinetic friction depends on μ_k and the normal force only. 1 point: argues that F_N = mg in both orientations (same weight, no other vertical force) so friction is equal. 1 point: a workable procedure (sensor pulling parallel at constant velocity for both orientations, repeated trials) with the supporting result (equal readings within uncertainty). Agreeing with the student earns at most the procedure point.
    - slug: apphys1-u02-w09-q23
      type: short_answer
      topic_code: "2.7"
      source: "AP Physics 1 CED, Topic 2.7"
      points: 3
      prompt: |
        A 5.0 kg box is pulled up a ramp inclined at 20° above the horizontal at constant speed by a rope parallel to the ramp. The coefficient of kinetic friction between box and ramp is 0.30.

        (a) Describe the free-body diagram of the box in words, naming each force and its direction.
        (b) Write Newton's second law along the ramp and use it to derive an expression for the rope tension T in terms of m, g, θ and μ_k.
        (c) Calculate T.
      answer: |
        (a) A downward arrow F_g = mg (straight down); an arrow F_N perpendicular to the ramp, away from its surface; an arrow T along the ramp, pointing up the slope; an arrow F_f along the ramp, pointing down the slope (the box moves up).
        (b) Constant speed, so ΣF along the ramp = 0: T − mg sin θ − μ_k F_N = 0 with F_N = mg cos θ, so T = mg sin θ + μ_k mg cos θ.
        (c) T = 5.0 × 9.8 × sin 20° + 0.30 × 5.0 × 9.8 × cos 20° = 16.8 + 13.8 ≈ 31 N.
      explanation: |
        Three points. (a) 1 point: all four forces with correct directions; friction must point down the slope, and no extra "force of motion". (b) 1 point: T = mg sin θ + μ_k mg cos θ, with F_N = mg cos θ found from the perpendicular direction (not mg). (c) 1 point: T ≈ 31 N (accept 30 to 31 N). Pointing friction up the ramp gives 3.0 N and earns no point for (b) or (c).
    - slug: apphys1-u02-w09-q24
      type: long_answer
      topic_code: "2.7"
      source: "AP Physics 1 CED, Topic 2.7"
      points: 6
      prompt: |
        Mathematical routines. Block A, of mass m_A, sits on a level table. A light string attached to it runs horizontally over a light, frictionless pulley at the table's edge to block B, of mass m_B, which hangs freely. The coefficient of kinetic friction between block A and the table is μ_k. Block B is released and the blocks start to move.

        (A) Derive an expression for the magnitude of the acceleration of the blocks in terms of m_A, m_B, μ_k and g.

        (B) Show that your expression behaves correctly in two limiting cases: a frictionless table, and a very large m_B compared with m_A.

        (C) For m_A = 2.0 kg, m_B = 1.0 kg and μ_k = 0.20, calculate the acceleration and the tension in the string.

        (D) With the same masses, the blocks are instead held at rest and released gently. What is the smallest coefficient of static friction that would keep them at rest? Explain.
      answer: |
        (A) Take the two blocks and the string as one system moving together. The external forces along the direction of motion are B's weight m_B g (forward) and the friction on A, μ_k m_A g (backward); the tension is internal. So (m_A + m_B)a = m_B g − μ_k m_A g, giving a = (m_B − μ_k m_A)g/(m_A + m_B).
        (B) Frictionless (μ_k = 0): a = m_B g/(m_A + m_B), the familiar result for a frictionless table. Very large m_B: a approaches m_B g/m_B = g, because B then falls almost freely.
        (C) a = (1.0 − 0.20 × 2.0) × 9.8/3.0 = 0.60 × 9.8/3.0 ≈ 1.96 m/s². For B alone: m_B g − T = m_B a, so T = 1.0 × (9.8 − 1.96) ≈ 7.8 N. (Check with A: T − μ_k m_A g = m_A a gives 7.84 − 3.92 = 3.92 = 2.0 × 1.96.)
        (D) At rest, the tension equals m_B g = 9.8 N, and static friction on A must balance it. The maximum static friction is μ_s m_A g = μ_s × 19.6 N, so μ_s must be at least 9.8/19.6 = 0.50 (that is, μ_s ≥ m_B/m_A).
      explanation: |
        Six points.
        (A) 2 points: 1 for a correct second-law statement (system, or both blocks separately) with friction μ_k m_A g using the normal force m_A g; 1 for a = (m_B − μ_k m_A)g/(m_A + m_B) or an equivalent form. Treating the tension as m_B g earns at most 1 point.
        (B) 1 point: both limits checked with a statement of why each is reasonable (frictionless gives m_B g/(m_A + m_B); large m_B gives g).
        (C) 2 points: 1 for a ≈ 1.96 m/s² (accept 1.9 to 2.0); 1 for T ≈ 7.8 N (accept 7.8 to 7.9 N) with working. T = 9.8 N earns no point here.
        (D) 1 point: μ_s ≥ 0.50 with the reasoning that static friction must balance the tension m_B g and cannot exceed μ_s m_A g.
