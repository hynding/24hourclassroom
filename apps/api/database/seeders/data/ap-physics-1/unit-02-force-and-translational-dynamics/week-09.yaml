        True or false: A small block slides across the top of a larger block that rests on a frictionless table. If the system is chosen as both blocks together, the friction forces between the two blocks cannot change the velocity of the system's centre of mass.
      answer: true
      explanation: |
        True. The friction between the blocks is internal to the two-block system: the two friction forces are a third-law pair and cancel in the system's net force. With a frictionless table and vertical forces balanced, the net external force is zero, so the centre of mass keeps a constant velocity even as each block speeds up or slows down.
