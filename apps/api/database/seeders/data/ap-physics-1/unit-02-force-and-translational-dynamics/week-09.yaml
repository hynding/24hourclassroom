week: 9
unit: 2
title: "Kinetic and Static Friction"
topics: ["2.7"]
guide: guides/week-09.md
guide_description: |
  Friction as the parallel component of a contact force: static friction (any size up to μ_s F_N, pointing
  against the tendency to slide) and kinetic friction (μ_k F_N, against the relative sliding), finding the
  normal force first, Newton's second law with friction on level ground, with angled pulls and on inclines,
  and measuring the coefficients from the slope of a friction-versus-normal-force graph. Worked examples: a
  force-sensor pull on a 0.40 kg sneaker (peak and plateau), a suitcase pulled by a strap at 40°, a phone
  slipping on a tilted book (μ_s = tan θ, with limiting cases), the largest acceleration of a truck carrying a
  crate, and the stopping distance of a skidding bike as a function of speed.
flashcards_description: |
  30 cards on static and kinetic friction: what each depends on and which way it points, the normal force in
  angled-pull, incline and pressing situations, slipping angles, force-sensor graphs, friction that speeds
  things up, functional dependence of stopping distance, and the lab method for measuring μ_k.

flashcards:
  - front: Friction and normal force on a block resting on a table → how they relate to the contact force
    back: |
      They are the two perpendicular components of one contact force from the table: the normal force perpendicular to the surface, friction parallel to it.
    topic_code: "2.7"
  - front: Static friction on a box nobody is pushing, resting on a level floor → its size
    back: |
      Zero. Static friction only appears when something tends to make the surfaces slide; with no horizontal push there is nothing to oppose.
    topic_code: "2.7"
  - front: Bookcase pushed with 40 N, maximum static friction 120 N → friction force
    back: |
      40 N, opposite the push. Static friction equals whatever the second law requires, up to its maximum μ_s F_N; here the bookcase stays at rest.
    topic_code: "2.7"
  - front: Kinetic friction on a sliding block → formula and direction
    back: |
      F_f,k = μ_k F_N, opposite the block's velocity relative to the surface it slides on.
    topic_code: "2.7"
  - front: Static friction just before a crate starts to slide → formula
    back: |
      At impending motion it reaches its maximum, F_f,s = μ_s F_N. Before that point it is less than μ_s F_N.
    topic_code: "2.7"
  - front: μ_s compared with μ_k for the same pair of surfaces → which is usually larger and what that means
    back: |
      Usually μ_s is greater than μ_k, so starting an object sliding takes a larger push than keeping it sliding at constant velocity.
    topic_code: "2.7"
  - front: Force-sensor graph of a slow horizontal pull on a shoe → what the peak and the flat part mean
    back: |
      The rising part is static friction matching the pull; the peak is μ_s F_N at the moment of slipping; the lower flat part is kinetic friction μ_k F_N while it slides at constant velocity.
    topic_code: "2.7"
  - front: Sneaker of 0.40 kg, sensor peak 3.3 N then steady 2.6 N → μ_s and μ_k
    back: |
      F_N = 0.40 × 9.8 = 3.92 N, so μ_s = 3.3/3.92 ≈ 0.84 and μ_k = 2.6/3.92 ≈ 0.66.
    topic_code: "2.7"
  - front: Kinetic friction when a block slides twice as fast → what changes
    back: |
      Nothing, in the AP model: kinetic friction depends on μ_k and F_N, not on speed.
    topic_code: "2.7"
  - front: Brick slid on its large face versus its narrow edge → friction comparison
    back: |
      The same. Friction does not depend on contact area in this model; F_N is the brick's weight either way.
    topic_code: "2.7"
  - front: Sliding block's mass doubled on the same surface → kinetic friction and deceleration
    back: |
      Friction doubles (F_N = mg doubles, F_f = μ_k mg), but the deceleration μ_k g is unchanged, because the inertia doubles too. Same stopping distance from the same speed.
    topic_code: "2.7"
  - front: Lawn mower pushed with the handle angled downward → normal force compared with mg
    back: |
      Greater than mg: F_N = mg + F sin θ, so friction grows. Pushing down on an object makes it harder to slide.
    topic_code: "2.7"
  - front: Suitcase, 18 kg, strap 75 N at 40° above horizontal, μ_k = 0.30 → normal force and acceleration
    back: |
      F_N = 176.4 − 75 sin 40° ≈ 128 N; F_f ≈ 38.5 N; a = (75 cos 40° − 38.5)/18 ≈ 1.06 m/s².
    topic_code: "2.7"
  - front: Block at rest on an incline of angle θ → normal force and static friction
    back: |
      F_N = mg cos θ, and static friction points up the slope with size mg sin θ (not μ_s F_N unless the block is about to slip).
    topic_code: "2.7"
  - front: Phone on a book tilted slowly until it slips at angle θ → μ_s
    back: |
      μ_s = tan θ, from mg sin θ = μ_s mg cos θ. The mass cancels, so a heavier phone with the same case slips at the same angle.
    topic_code: "2.7"
  - front: Block sliding down an incline at constant speed → μ_k in terms of the angle
    back: |
      μ_k = tan θ: zero acceleration means mg sin θ = μ_k mg cos θ.
    topic_code: "2.7"
  - front: Block sliding down a rough incline → acceleration formula and its limiting cases
    back: |
      a = g(sin θ − μ_k cos θ). With μ_k = 0 it becomes g sin θ; with θ = 90° it becomes g; with tan θ = μ_k it is zero.
    topic_code: "2.7"
  - front: Block pushed up a rough incline, still moving up → direction of kinetic friction
    back: |
      Down the incline, opposite the block's velocity, so friction adds to the downhill component mg sin θ.
    topic_code: "2.7"
  - front: Drive wheels of a car speeding up without skidding → kind and direction of friction on the tyres
    back: |
      Static friction, pointing forward. The tyre's contact patch pushes backward on the road without slipping, so the road pushes the tyre forward. That is the external force that accelerates the car.
    topic_code: "2.7"
  - front: Crate in a truck bed while the truck speeds up, crate not sliding → force that accelerates it
    back: |
      Static friction from the bed, pointing forward. Its largest possible value gives a_max = μ_s g, independent of the crate's mass.
    topic_code: "2.7"
  - front: Truck crate with μ_s = 0.40 → largest acceleration without slipping
    back: |
      a_max = μ_s g = 0.40 × 9.8 ≈ 3.9 m/s². Accelerate harder and the crate slides back relative to the bed.
    topic_code: "2.7"
  - front: Block pressed against a vertical wall by a horizontal push → what holds it up
    back: |
      Static friction from the wall, pointing up. The push sets the normal force, so the minimum push is mg/μ_s.
    topic_code: "2.7"
  - front: Skidding to a stop on level ground → deceleration and stopping distance
    back: |
      a = μ_k g (mass cancels) and Δx = v₀²/(2μ_k g): doubling the starting speed quadruples the stopping distance.
    topic_code: "2.7"
  - front: Bike at 8.0 m/s skidding with μ_k = 0.60 → stopping distance
    back: |
      a = 0.60 × 9.8 = 5.88 m/s²; Δx = 8.0²/(2 × 5.88) ≈ 5.4 m. At 16 m/s it would be about 21.8 m.
    topic_code: "2.7"
  - front: Anti-lock brakes versus locked wheels → which friction each uses
    back: |
      Rolling tyres grip the road with static friction (maximum μ_s F_N); locked, skidding tyres feel kinetic friction μ_k F_N, which is smaller, so the stop is longer.
    topic_code: "2.7"
  - front: Lab graph of friction (vertical) against normal force (horizontal) for a sliding block → meaning of the slope
    back: |
      The slope is μ_k. Ideal data form a straight line through the origin; a non-zero intercept points to a systematic error such as an unzeroed sensor.
    topic_code: "2.7"
  - front: Measuring μ_k with a force sensor → three ways to reduce uncertainty
    back: |
      Pull parallel to the surface at a steady speed, repeat each trial and average, and use several added masses so the slope of a graph replaces any single reading.
    topic_code: "2.7"
  - front: Error-spot → "the normal force on a box being pulled up at an angle is mg"
    back: |
      Only true with no other vertical forces. Write the vertical second law first: F_N = mg − T sin θ for an upward pull.
    topic_code: "2.7"
  - front: Error-spot → "the box is at rest, so the static friction on it is μ_s F_N"
    back: |
      μ_s F_N is only the maximum. A resting box feels whatever static friction balances the other forces, often far less.
    topic_code: "2.7"
  - front: Error-spot → "friction always points opposite the direction the object moves"
    back: |
      Friction opposes relative sliding between the surfaces. A walker's foot and a crate in an accelerating truck get friction in their direction of motion.
    topic_code: "2.7"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topic 2.7: static and kinetic friction, the normal force
    in angled and tilted situations, Newton's second law with friction, slipping conditions and measuring the
    coefficients), with 8 questions (33%) reviewing earlier weeks (motion graphs, force components, systems,
    free-body diagrams, Newton's three laws and gravitational field strength). Opens with a shared-context set on a
    force-sensor friction lab. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes. Use g = 9.8 m/s². Calculator and equation sheet allowed throughout.
  questions:
    # ---- Stimulus set: force-sensor friction lab (2.7, 2.7, 2.7, 2.5)
    - slug: apphys1-u02-w09-q01
      type: multiple_choice
      topic_code: "2.7"
      source: "AP Physics 1 CED, Topic 2.7"
      points: 1
      stimulus: |
        A lab group pulls a 0.50 kg wooden block across a level board with a force sensor held parallel to the board. Pulling slowly from rest, the sensor reading climbs, peaks at 2.2 N at the instant the block starts to move, and then stays at 1.6 N while the block slides at constant velocity. The group then stacks extra masses on the block and records the steady sliding force for each total mass:

        | Total mass (kg) | 0.50 | 0.75 | 1.00 | 1.25 | 1.50 |
        |---|---|---|---|---|---|
        | Normal force (N) | 4.90 | 7.35 | 9.80 | 12.25 | 14.70 |
        | Steady sliding force (N) | 1.6 | 2.5 | 3.1 | 4.1 | 4.8 |
      prompt: |
        What is the coefficient of static friction between the 0.50 kg block and the board?
      options:
        - "0.33"
        - "4.4"
        - "0.45"
        - "0.73"
      option_explanations:
        - |
          This uses the steady sliding force, 1.6 N, which gives the kinetic coefficient (1.6/4.9), not the static one.
        - |
          This divides 2.2 N by the mass 0.50 kg, forgetting that the normal force is mg = 4.9 N, not the mass.
        - |
          Correct. At the peak static friction is at its maximum: μ_s = 2.2 N/(0.50 kg × 9.8 m/s²) = 2.2/4.9 ≈ 0.45.
        - |
          This is the ratio of the sliding force to the peak force, 1.6/2.2; a coefficient compares friction with the normal force.
      answer: 2
    - slug: apphys1-u02-w09-q02
      type: multiple_choice
      topic_code: "2.7"
      source: "AP Physics 1 CED, Topic 2.7"
      points: 1
      stimulus: |
        A lab group pulls a 0.50 kg wooden block across a level board with a force sensor held parallel to the board. Pulling slowly from rest, the sensor reading climbs, peaks at 2.2 N at the instant the block starts to move, and then stays at 1.6 N while the block slides at constant velocity. The group then stacks extra masses on the block and records the steady sliding force for each total mass:

        | Total mass (kg) | 0.50 | 0.75 | 1.00 | 1.25 | 1.50 |
        |---|---|---|---|---|---|
        | Normal force (N) | 4.90 | 7.35 | 9.80 | 12.25 | 14.70 |
        | Steady sliding force (N) | 1.6 | 2.5 | 3.1 | 4.1 | 4.8 |
      prompt: |
        Early in the first pull, the sensor reads 1.0 N and the 0.50 kg block has not moved. What is the friction force on the block at that moment?
      options:
        - "2.2 N, the maximum static friction, opposite the pull"
        - "1.0 N, opposite the pull"
        - "1.6 N, the kinetic friction, opposite the pull"
        - "Zero, because the block is not moving"
      option_explanations:
        - |
          2.2 N is only the largest static friction can become. Here the block is at rest, so friction just balances the 1.0 N pull.
        - |
          Correct. The block is in equilibrium, so by Newton's first law static friction balances the pull: 1.0 N, opposite it, well below the 2.2 N maximum.
        - |
          Kinetic friction acts only while the surfaces slide; the block has not started moving.
        - |
          A resting object can still feel static friction; with a 1.0 N pull and no acceleration, something must supply 1.0 N the other way.
      answer: 1
    - slug: apphys1-u02-w09-q03
      type: numeric
      topic_code: "2.7"
      source: "AP Physics 1 CED, Topic 2.7"
      points: 1
      stimulus: |
        A lab group pulls a 0.50 kg wooden block across a level board with a force sensor held parallel to the board. Pulling slowly from rest, the sensor reading climbs, peaks at 2.2 N at the instant the block starts to move, and then stays at 1.6 N while the block slides at constant velocity. The group then stacks extra masses on the block and records the steady sliding force for each total mass:

        | Total mass (kg) | 0.50 | 0.75 | 1.00 | 1.25 | 1.50 |
        |---|---|---|---|---|---|
        | Normal force (N) | 4.90 | 7.35 | 9.80 | 12.25 | 14.70 |
        | Steady sliding force (N) | 1.6 | 2.5 | 3.1 | 4.1 | 4.8 |
      prompt: |
        The group graphs steady sliding force (vertical axis) against normal force (horizontal axis) and draws the best-fit straight line. What is the slope of that line, which is the coefficient of kinetic friction? Give your answer to two decimal places.
      answer: { value: 0.33, tolerance: 0.015 }
      explanation: |
        At constant velocity the pull balances kinetic friction, so the steady force is F_f = μ_k F_N and the graph is a line through the origin with slope μ_k. A least-squares fit gives slope ≈ 0.327 (intercept ≈ 0.02 N); a line through the end points gives (4.8 − 1.6)/(14.70 − 4.90) = 3.2/9.8 ≈ 0.33. Either way μ_k ≈ 0.33, no unit.
    - slug: apphys1-u02-w09-q04
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 1
      stimulus: |
        A lab group pulls a 0.50 kg wooden block across a level board with a force sensor held parallel to the board. Pulling slowly from rest, the sensor reading climbs, peaks at 2.2 N at the instant the block starts to move, and then stays at 1.6 N while the block slides at constant velocity. The group then stacks extra masses on the block and records the steady sliding force for each total mass:

        | Total mass (kg) | 0.50 | 0.75 | 1.00 | 1.25 | 1.50 |
        |---|---|---|---|---|---|
        | Normal force (N) | 4.90 | 7.35 | 9.80 | 12.25 | 14.70 |
        | Steady sliding force (N) | 1.6 | 2.5 | 3.1 | 4.1 | 4.8 |
      prompt: |
        With the 0.50 kg block already sliding and no extra masses, a student pulls with a steady 2.0 N. What is the block's acceleration?
      options:
        - "4.0 m/s²"
        - "7.2 m/s²"
        - "Zero, because 2.0 N is less than the 2.2 N needed to start the block moving"
        - "0.80 m/s²"
      option_explanations:
        - |
          This divides the pull by the mass and ignores the 1.6 N of kinetic friction opposing the motion.
        - |
          This adds friction to the pull, (2.0 + 1.6)/0.50; friction opposes the sliding, so it subtracts.
        - |
          The 2.2 N threshold applies only to starting from rest. Once sliding, only 1.6 N of kinetic friction opposes the pull.
        - |
          Correct. Net force = 2.0 N − 1.6 N = 0.4 N forward, so a = 0.4 N/0.50 kg = 0.80 m/s² in the direction of the pull.
      answer: 3
    # ---- Independent items
    - slug: apphys1-u02-w09-q05
      type: multiple_choice
      topic_code: "2.7"
      source: "AP Physics 1 CED, Topic 2.7"
      points: 1
      prompt: |
        A student drags a 20 kg box of books across a level floor with a rope that pulls with 100 N at 30° above the horizontal. The coefficient of kinetic friction between box and floor is 0.40. What is the kinetic friction force on the box?
      options:
        - "58 N"
        - "78 N"
        - "98 N"
        - "44 N"
      option_explanations:
        - |
          Correct. Vertically F_N + 100 sin 30° = 196 N, so F_N = 196 − 50 = 146 N, and F_f = 0.40 × 146 ≈ 58 N.
        - |
          This uses F_N = mg = 196 N, ignoring the rope's upward component, which lifts part of the weight.
        - |
          This adds the rope's vertical component to the weight, as if the rope pushed down instead of pulling up.
        - |
          This subtracts 100 cos 30° (the horizontal component) instead of 100 sin 30° when finding the normal force.
      answer: 0
    - slug: apphys1-u02-w09-q06
      type: multiple_choice
      topic_code: "2.7"
      source: "AP Physics 1 CED, Topic 2.7"
      points: 1
      prompt: |
        A 3.0 kg toolbox rests without sliding on a ramp inclined at 25° above the horizontal. The coefficient of static friction is 0.60. What is the magnitude of the static friction force on the toolbox?
      options:
        - "27 N"
        - "16 N"
        - "12 N"
        - "29 N"
      option_explanations:
        - |
          This is mg cos 25°, the normal force, not the friction; friction balances the component of gravity along the ramp.
        - |
          This is μ_s mg cos 25°, the maximum possible static friction; the toolbox is not on the point of slipping, so friction is smaller.
        - |
          Correct. Along the ramp the toolbox is in equilibrium, so friction = mg sin 25° = 3.0 × 9.8 × 0.423 ≈ 12 N, up the ramp. It is less than the 16 N maximum, so the box stays put.
        - |
          This is the full weight, mg; only the component of gravity parallel to the ramp needs to be balanced by friction.
      answer: 2
    - slug: apphys1-u02-w09-q07
      type: multiple_choice
      topic_code: "2.7"
      source: "AP Physics 1 CED, Topic 2.7"
      points: 1
      prompt: |
        A hockey puck slides across a level rink and comes to rest because of kinetic friction. A second puck with twice the mass, made of the same material, starts with the same speed on the same ice. How does its stopping distance compare with the first puck's?
      options:
        - "Half as far"
        - "The same distance"
        - "Twice as far"
        - "One quarter as far"
      option_explanations:
        - |
          Doubling the mass doubles friction, but it also doubles the inertia; the extra friction does not shorten the slide.
        - |
          Correct. F_f = μ_k mg, so a = F_f/m = μ_k g, independent of mass. Same deceleration and same starting speed give the same distance, v₀²/(2μ_k g).
        - |
          This assumes a heavier puck keeps going longer because of its inertia, forgetting that friction doubles too.
        - |
          This treats distance as depending on mass squared; mass cancels completely from the deceleration.
      answer: 1
    - slug: apphys1-u02-w09-q08
      type: multiple_choice
      topic_code: "2.7"
      source: "AP Physics 1 CED, Topic 2.7"
      points: 1
      prompt: |
        A runner speeds up from rest on a level track without her shoes slipping. Which describes the friction force the track exerts on her shoes while she accelerates?
      options:
        - "Kinetic friction pointing backward, opposite her motion"
        - "Static friction pointing backward, opposite her motion"
        - "No friction, because her shoes do not slide"
        - "Static friction pointing forward, in the direction she accelerates"
      option_explanations:
        - |
          Her shoes do not slide on the track, so the friction is static, and it must point forward to accelerate her.
        - |
          Static is right, but backward friction would slow her down. Her shoe pushes backward on the track, so the track pushes her forward.
        - |
          Static friction acts precisely because the shoes grip without sliding; without it she could not accelerate (think of ice).
        - |
          Correct. Her shoe pushes backward on the track; by the third law the track pushes forward on her with static friction, the only horizontal external force, so it causes her forward acceleration.
      answer: 3
    - slug: apphys1-u02-w09-q09
      type: multiple_choice
      topic_code: "2.7"
      source: "AP Physics 1 CED, Topic 2.7"
      points: 1
      prompt: |
        A box of tiles rides in the flat bed of a pickup truck. Between box and bed, μ_s = 0.35 and μ_k = 0.25. What is the largest acceleration the truck can have on level ground without the box sliding?
      options:
        - "3.4 m/s²"
        - "2.5 m/s²"
        - "28 m/s²"
        - "0.35 m/s²"
      option_explanations:
        - |
          Correct. Only static friction accelerates the box, and at most it is μ_s mg, so a_max = μ_s g = 0.35 × 9.8 ≈ 3.4 m/s², whatever the box's mass.
        - |
          This uses μ_k; while the box is not sliding relative to the bed, the friction is static.
        - |
          This divides g by μ_s instead of multiplying; the allowed acceleration must shrink as the surface gets slicker.
        - |
          This gives the coefficient itself as an acceleration, leaving out g.
      answer: 0
    - slug: apphys1-u02-w09-q10
      type: multiple_choice
      topic_code: "2.7"
      source: "AP Physics 1 CED, Topic 2.7"
      points: 1
      prompt: |
        A student places an eraser on a board and slowly raises one end. The eraser starts to slide when the board makes 31° with the horizontal. What is the coefficient of static friction between eraser and board?
      options:
        - "0.52"
        - "0.86"
        - "0.60"
        - "1.7"
      option_explanations:
        - |
          This is sin 31°, which would need the normal force to equal the whole weight; on a tilted board F_N = mg cos θ.
        - |
          This is cos 31°; at slipping, the coefficient is the ratio of the parallel component to the perpendicular component.
        - |
          Correct. At the point of slipping mg sin θ = μ_s mg cos θ, so μ_s = tan 31° ≈ 0.60. The mass cancels.
        - |
          This is 1/tan 31°, the perpendicular component divided by the parallel one, which is upside down.
      answer: 2
    - slug: apphys1-u02-w09-q11
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Physics 1 CED, Topic 2.2"
      points: 1
      prompt: |
        A child gives a wooden toy block a shove across a level carpet and lets go. While the block slides and slows, which list gives exactly the forces on its free-body diagram?
      options:
        - "Downward gravitational force, upward normal force, forward force of the shove, backward kinetic friction"
        - "Downward gravitational force, upward normal force, backward kinetic friction"
        - "Downward gravitational force, upward normal force, forward force of motion"
        - "Downward gravitational force and upward normal force only, because the block is slowing on its own"
      option_explanations:
        - |
          The hand's push stops when contact ends; a free-body diagram shows only forces from objects touching (or gravitating on) the block now.
        - |
          Correct. After release, Earth pulls down, the carpet pushes up (F_N) and the carpet's kinetic friction points backward, opposite the sliding. The backward net force is why it slows.
        - |
          There is no "force of motion"; a moving object needs no forward force to keep moving. It is slowing, so the net force is backward.
        - |
          Without a horizontal force the block would keep its speed (first law). Something must cause the slowing: kinetic friction.
      answer: 1
    - slug: apphys1-u02-w09-q12
      type: multiple_choice
      topic_code: "2.3"
      source: "AP Physics 1 CED, Topic 2.3"
      points: 1
      prompt: |
        A crate slides east across a warehouse floor, and the floor exerts a kinetic friction force on the crate pointing west. What is the Newton's third law partner of that force?
      options:
        - "The pushing force from the worker on the crate, pointing east"
        - "The normal force from the floor on the crate, pointing up"
        - "The gravitational force from Earth on the crate, pointing down"
        - "A friction force from the crate on the floor, pointing east"
      option_explanations:
        - |
          That force acts on the crate too; third-law pairs always act on two different objects and are the same type of force.
        - |
          The normal force is a different component acting on the same object; a third-law partner acts on the other object in the interaction.
        - |
          Gravity comes from Earth's interaction with the crate, not from the crate–floor contact, and it acts on the crate.
        - |
          Correct. The interaction is crate–floor friction, so the partner is the crate's friction force on the floor: equal in size, opposite in direction (east), acting on the floor.
      answer: 3
    - slug: apphys1-u02-w09-q13
      type: multiple_choice
      topic_code: "2.6"
      source: "AP Physics 1 CED, Topic 2.6"
      points: 1
      prompt: |
        An astronaut slides a supply crate across level ground on the Moon, where the gravitational field strength is 1.6 N/kg, and the same crate across the same kind of surface on Earth (9.8 N/kg), with the same coefficient of kinetic friction and the same starting speed. How does the crate's stopping distance on the Moon compare with its stopping distance on Earth?
      options:
        - "About 6.1 times as far"
        - "The same distance, because the crate's mass is the same"
        - "About one sixth as far"
        - "About 2.5 times as far"
      option_explanations:
        - |
          Correct. The deceleration is μ_k g, so it is 9.8/1.6 ≈ 6.1 times smaller on the Moon, and the stopping distance v₀²/(2μ_k g) is about 6.1 times longer.
        - |
          Mass cancels, but g does not: friction μ_k mg depends on the local gravitational field, so a weaker field means weaker friction.
        - |
          This has the ratio upside down; weaker gravity means a smaller normal force, less friction and a longer slide.
        - |
          This takes the square root of 6.1, as if distance depended on √g; the distance is inversely proportional to g itself.
      answer: 0
    - slug: apphys1-u02-w09-q14
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        A curling stone slides in a straight line and slows to rest. Its velocity is recorded every half second:

