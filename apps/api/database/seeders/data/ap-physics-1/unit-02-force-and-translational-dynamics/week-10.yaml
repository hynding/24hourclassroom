week: 10
unit: 2
title: "Spring Forces"
topics: ["2.8"]
guide: guides/week-10.md
guide_description: |
  Ideal springs and Hooke's law (F_s = −kΔx, a restoring force measured from the relaxed length), what the spring
  constant measures, finding k from the slope of a force-versus-stretch graph, equivalent spring constants in
  parallel and in series (and why cutting a spring in half doubles k), the equal pull at both ends of an ideal
  spring, and spring forces in Newton's second law. Worked examples: a hanging-mass lab analysed by linear fit
  (k ≈ 81 N/m), one spring versus two in parallel and in series under a 0.60 kg mass, a car on four suspension
  springs with a functional-dependence check, a spring scale in a slowing elevator, and a spring launcher whose
  acceleration halves as the compression halves.
flashcards_description: |
  30 cards on spring forces: Hooke's law and its sign, what k depends on, reading slopes and intercepts of
  spring graphs, series and parallel combinations, spring scales pulled at both ends, springs in elevators and
  launchers, functional dependence, and designing a spring-constant experiment.

flashcards:
  - front: Hooke's law for an ideal spring → statement with the meaning of the minus sign
    back: |
      F_s = −kΔx: the spring force is proportional to the displacement from the relaxed length and points opposite to it, back toward the relaxed length.
    topic_code: "2.8"
  - front: Spring stretched to the right of its relaxed length → direction of its force on the attached block
    back: |
      To the left, back toward the relaxed length. A compressed spring pushes the block away from the compression, also toward the relaxed length.
    topic_code: "2.8"
  - front: Spring constant k → what it measures and its SI unit
    back: |
      The force needed per metre of stretch or compression, in N/m. A stiffer spring has a larger k.
    topic_code: "2.8"
  - front: Hanging a heavier mass on the same spring → effect on k
    back: |
      None. k belongs to the spring (material, wire thickness, length); a heavier mass only increases the stretch.
    topic_code: "2.8"
  - front: Δx in Hooke's law → measured from where
    back: |
      From the spring's relaxed (unstretched) length, not from the floor, the ceiling or its current length.
    topic_code: "2.8"
  - front: Graph of spring force (vertical) against stretch (horizontal) → shape and slope
    back: |
      A straight line through the origin whose slope is k, as long as the spring stays below its elastic limit.
    topic_code: "2.8"
  - front: Graph of stretch (vertical) against spring force (horizontal) → meaning of the slope
    back: |
      The slope is 1/k, so a stiffer spring gives a shallower line. Invert the slope to get k.
    topic_code: "2.8"
  - front: Graph of total spring length against hanging mass → slope and intercept
    back: |
      Straight line L = L₀ + (g/k)m: the intercept is the relaxed length L₀ and the slope is g/k, so k = g/slope.
    topic_code: "2.8"
  - front: Hanging mass at rest on a spring → why the spring force equals mg
    back: |
      Its free-body diagram has only the upward spring force and the downward weight; with zero acceleration they balance, so kΔx = mg.
    topic_code: "2.8"
  - front: Lab spring stretching 1.3, 2.4, 3.7, 4.9, 6.1 cm under 0.98 to 4.90 N → spring constant
    back: |
      The best-fit slope of force against stretch (in metres) is about 81 N/m, with an intercept near zero, supporting Hooke's law.
    topic_code: "2.8"
  - front: Why the smallest stretch in a spring lab gives the least reliable k → reason
    back: |
      The same ±0.1 cm reading uncertainty is a larger fraction of a small stretch. Fitting a slope to many points reduces the effect.
    topic_code: "2.8"
  - front: Doubling the stretch of an ideal spring → change in spring force
    back: |
      The force doubles, because F_s is proportional to Δx.
    topic_code: "2.8"
  - front: Two springs side by side holding one load (parallel) → equivalent spring constant
    back: |
      k_eq = k₁ + k₂. They share the stretch and their forces add, so the pair is stiffer than either spring.
    topic_code: "2.8"
  - front: Two springs hooked end to end (series) → equivalent spring constant
    back: |
      1/k_eq = 1/k₁ + 1/k₂. Each carries the full load and their stretches add, so the pair is softer than either spring.
    topic_code: "2.8"
  - front: Two identical 120 N/m springs under a 0.60 kg mass → stretch in parallel and in series
    back: |
      Parallel: k_eq = 240 N/m, stretch 2.45 cm. Series: k_eq = 60 N/m, stretch 9.8 cm. One spring alone: 4.9 cm.
    topic_code: "2.8"
  - front: Cutting a spring of constant k in half → constant of each half
    back: |
      2k. The full spring is two halves in series, and 1/k = 1/k_half + 1/k_half gives k_half = 2k.
    topic_code: "2.8"
  - front: Spring scale pulled by two students with 50 N each → reading
    back: |
      50 N. An ideal spring carries the same force throughout; the reading is the force at either end, not the sum.
    topic_code: "2.8"
  - front: Ideal (massless) spring between two carts → forces at its two ends
    back: |
      Equal in magnitude: it pushes (or pulls) each cart with the same force kΔx, in opposite directions.
    topic_code: "2.8"
  - front: 1200 kg car on four springs of 20,000 N/m each → how far it sinks
    back: |
      The springs act in parallel: k_eq = 80,000 N/m, so Δx = 11,760 N/80,000 N/m ≈ 0.15 m.
    topic_code: "2.8"
  - front: Spring scale holding a bag in an elevator accelerating upward → reading compared with the weight
    back: |
      Larger: F_s − mg = ma gives F_s = m(g + a). The acceleration's direction, not the velocity's, decides it.
    topic_code: "2.8"
  - front: 2.0 kg bag on a 400 N/m scale, elevator moving up but slowing at 1.5 m/s² → reading and stretch
    back: |
      F_s = 2.0 × (9.8 − 1.5) = 16.6 N, a stretch of 16.6/400 ≈ 4.2 cm (4.9 cm at rest).
    topic_code: "2.8"
  - front: Block pushed by a compressed spring on a frictionless track → how its acceleration changes
    back: |
      Largest at release (kΔx/m), then smaller as the spring relaxes, reaching zero at the relaxed length. Not constant, so no kinematics equations.
    topic_code: "2.8"
  - front: 0.25 kg block against a 300 N/m spring compressed 3.0 cm → acceleration at release
    back: |
      F = 300 × 0.030 = 9.0 N, so a = 9.0/0.25 = 36 m/s² away from the spring.
    topic_code: "2.8"
  - front: Spring holding a block at rest on a frictionless incline → stretch
    back: |
      The spring, parallel to the incline, balances mg sin θ: kΔx = mg sin θ, so Δx = mg sin θ/k.
    topic_code: "2.8"
  - front: Spring pulling a block across a rough floor at constant velocity → stretch
    back: |
      The spring balances kinetic friction: kΔx = μ_k mg, so Δx = μ_k mg/k.
    topic_code: "2.8"
  - front: Elastic limit of a spring → what happens beyond it
    back: |
      The spring deforms permanently, does not return to its relaxed length, and the force–stretch graph is no longer a straight line.
    topic_code: "2.8"
  - front: Designing a spring-constant experiment → what to measure and with what
    back: |
      Hang known masses; measure each stretch from the relaxed length with a metre stick (or a motion sensor); use at least five masses; graph mg against Δx and take the slope.
    topic_code: "2.8"
  - front: Error-spot → "the spring constant went up because I hung more mass on it"
    back: |
      k is fixed for the spring. If the computed k changes systematically with mass, the stretch was mismeasured or the spring passed its elastic limit.
    topic_code: "2.8"
  - front: Error-spot → "two springs in series are twice as stiff as one"
    back: |
      That is the parallel rule. In series the stretches add, so two identical springs are half as stiff (k/2).
    topic_code: "2.8"
  - front: Error-spot → "F_s = k × 12 cm" for a spring now 12 cm long
    back: |
      Δx is the change from the relaxed length, in metres. A 12 cm spring with a 10 cm relaxed length is stretched 0.02 m.
    topic_code: "2.8"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topic 2.8: Hooke's law, the spring constant and spring
    graphs, series and parallel springs, spring scales, and springs in Newton's second law), with 8 questions (32%)
    reviewing earlier weeks (centre of mass, free-body diagrams, Newton's first and third laws, gravitational field
    strength and friction). Opens with a shared-context set on a hanging-mass spring lab. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically;
    the short answers and the long answer are graded by your teacher against the scoring notes. Use g = 9.8 m/s².
    Calculator and equation sheet allowed throughout.
  questions:
    # ---- Stimulus set: hanging-mass spring lab (2.8)
    - slug: apphys1-u02-w10-q01
      type: multiple_choice
      topic_code: "2.8"
      source: "AP Physics 1 CED, Topic 2.8"
      points: 1
      stimulus: |
        A lab group hangs a spring from a clamp and measures its relaxed length: 12.0 cm. They then hang masses from it, wait for each to come to rest, and measure the spring's total length with a metre stick:

        | Hanging mass (kg) | 0.050 | 0.100 | 0.150 | 0.200 | 0.250 |
        |---|---|---|---|---|---|
        | Total length (cm) | 14.1 | 16.0 | 18.1 | 19.9 | 22.1 |
      prompt: |
        The group wants a graph that is a straight line whose slope is the spring constant k. Which should they plot?
      options:
        - "Hanging mass (vertical) against total length (horizontal)"
        - "Weight of the hanging mass, mg (vertical), against stretch, total length minus 12.0 cm (horizontal)"
        - "Stretch (vertical) against weight of the hanging mass, mg (horizontal)"
        - "Weight of the hanging mass, mg (vertical), against the square of the stretch (horizontal)"
      option_explanations:
        - |
          This is a straight line, but its slope is k/g in kg per cm, not k, and it does not pass through the origin.
        - |
          Correct. At rest the spring force equals mg, and Hooke's law says mg = kΔx: a straight line through the origin with slope k (once the stretch is in metres).
        - |
          This is a straight line too, but with the axes swapped its slope is 1/k, not k.
        - |
          Hooke's law is linear in the stretch; plotting against its square would give a curve for an ideal spring.
      answer: 1
    - slug: apphys1-u02-w10-q02
      type: numeric
      topic_code: "2.8"
      source: "AP Physics 1 CED, Topic 2.8"
      points: 1
      stimulus: |
        A lab group hangs a spring from a clamp and measures its relaxed length: 12.0 cm. They then hang masses from it, wait for each to come to rest, and measure the spring's total length with a metre stick:

        | Hanging mass (kg) | 0.050 | 0.100 | 0.150 | 0.200 | 0.250 |
        |---|---|---|---|---|---|
        | Total length (cm) | 14.1 | 16.0 | 18.1 | 19.9 | 22.1 |
      prompt: |
        Use the data to determine the spring constant. Give your answer in N/m to two significant figures.
      answer: { value: 25, tolerance: 1 }
      explanation: |
        The stretches are 2.1, 4.0, 6.1, 7.9 and 10.1 cm (0.021 to 0.101 m) under weights of 0.49, 0.98, 1.47, 1.96 and 2.45 N. The best-fit slope of weight against stretch is about 24.6 N/m; a line through the end points gives (2.45 − 0.49)/(0.101 − 0.021) = 1.96/0.080 ≈ 24.5 N/m. So k ≈ 25 N/m. Forgetting to convert centimetres to metres gives 0.25, a hundred times too small.
    - slug: apphys1-u02-w10-q03
      type: multiple_choice
      topic_code: "2.8"
      source: "AP Physics 1 CED, Topic 2.8"
      points: 1
      stimulus: |
        A lab group hangs a spring from a clamp and measures its relaxed length: 12.0 cm. They then hang masses from it, wait for each to come to rest, and measure the spring's total length with a metre stick:

        | Hanging mass (kg) | 0.050 | 0.100 | 0.150 | 0.200 | 0.250 |
        |---|---|---|---|---|---|
        | Total length (cm) | 14.1 | 16.0 | 18.1 | 19.9 | 22.1 |
      prompt: |
        Assuming the spring stays below its elastic limit, what stretch should the group predict for a 0.300 kg mass?
      options:
        - "About 24 cm"
        - "About 1.2 cm"
        - "About 14.5 cm"
        - "About 12 cm"
      option_explanations:
        - |
          About 24 cm is the predicted total length (12.0 cm + 12 cm), not the stretch from the relaxed length.
        - |
          This slips a factor of ten in the unit conversion; mg/k = 2.94 N ÷ 24.6 N/m ≈ 0.12 m, which is 12 cm.
        - |
          This scales the total length 22.1 cm by 0.300/0.250 and subtracts 12.0 cm; only the stretch, not the total length, is proportional to the mass.
        - |
          Correct. The stretch is proportional to the mass, about 40 cm per kg (10.1 cm for 0.250 kg), so 0.300 kg gives about 12 cm; equivalently mg/k = 2.94/24.6 ≈ 0.12 m.
      answer: 3
    - slug: apphys1-u02-w10-q04
      type: multiple_choice
      topic_code: "2.8"
      source: "AP Physics 1 CED, Topic 2.8"
      points: 1
      stimulus: |
        A lab group hangs a spring from a clamp and measures its relaxed length: 12.0 cm. They then hang masses from it, wait for each to come to rest, and measure the spring's total length with a metre stick:

        | Hanging mass (kg) | 0.050 | 0.100 | 0.150 | 0.200 | 0.250 |
        |---|---|---|---|---|---|
        | Total length (cm) | 14.1 | 16.0 | 18.1 | 19.9 | 22.1 |
      prompt: |
        A second group plots total length (vertical) against hanging mass (horizontal) and fits a straight line. What does the vertical intercept of that line represent, and about what is its value?
      options:
        - "The relaxed length of the spring, about 12 cm"
        - "The spring constant, about 25 N/m"
        - "The stretch produced by 1 kg, about 40 cm"
        - "The weight of the mass hanger, about 0.49 N"
      option_explanations:
        - |
          Correct. The line is L = L₀ + (g/k)m, so at m = 0 it gives L₀, the relaxed length; the fit gives about 12.1 cm, matching the measured 12.0 cm.
        - |
          The spring constant is found from the slope (k = g/slope), not from the intercept, and the intercept has units of length.
        - |
          About 40 cm per kg is the slope of this graph, not its intercept.
        - |
          The intercept of a length-versus-mass graph is a length, not a force; it is the length with no mass hung.
      answer: 0
    # ---- Independent items
    - slug: apphys1-u02-w10-q05
      type: multiple_choice
      topic_code: "2.8"
      source: "AP Physics 1 CED, Topic 2.8"
      points: 1
      prompt: |
        A picture frame hangs from one spring and stretches it 6.0 cm. The frame is then hung from two springs identical to the first, side by side, both attached to the frame. How far does each spring stretch?
      options:
        - "12 cm"
        - "6.0 cm"
        - "3.0 cm"
        - "1.5 cm"
      option_explanations:
        - |
          This is the series result. Side by side, the springs share the load, so each stretches less, not more.
        - |
          Each spring now carries only half the weight, so it cannot stretch as far as it did alone.
        - |
          Correct. In parallel k_eq = 2k, so the stretch is mg/(2k), half of 6.0 cm. Each spring carries half the weight.
        - |
          This quarters the stretch, as if doubling the number of springs quadrupled the stiffness; k_eq = k + k = 2k.
      answer: 2
    - slug: apphys1-u02-w10-q06
      type: multiple_choice
      topic_code: "2.8"
      source: "AP Physics 1 CED, Topic 2.8"
      points: 1
      prompt: |
        Two identical springs, each with spring constant k, are hooked end to end and a mass is hung from the bottom one. What is the equivalent spring constant of the pair?
      options:
        - "2k"
        - "k/2"
        - "k"
        - "k²"
      option_explanations:
        - |
          2k is the parallel result. End to end, each spring carries the full weight and stretches as much as one spring alone, so the total stretch doubles.
        - |
          Correct. In series 1/k_eq = 1/k + 1/k = 2/k, so k_eq = k/2: the same force produces twice the stretch.
        - |
          The force is the same, but the stretches add, so the pair stretches twice as far and is softer than one spring.
        - |
          k² has units of N²/m², not N/m; spring constants combine as sums or reciprocal sums.
      answer: 1
    - slug: apphys1-u02-w10-q07
      type: multiple_choice
      topic_code: "2.8"
      source: "AP Physics 1 CED, Topic 2.8"
      points: 1
      prompt: |
        Two students play tug-of-war with a spring scale between them. Each pulls with 40 N and the scale stays at rest. What does the scale read?
      options:
        - "80 N, because both students pull on it"
        - "Zero, because the two forces cancel"
        - "20 N, because each end carries half the force"
        - "40 N"
      option_explanations:
        - |
          A spring scale reads the force at one end. When a scale hangs from a ceiling with a 40 N weight, the ceiling also pulls 40 N, and it reads 40 N, not 80 N.
        - |
          The forces cancel to give zero net force on the scale, but the spring is still stretched by 40 N at each end, and that stretch is what the scale shows.
        - |
          An ideal spring carries the same force throughout its length; each end feels the full 40 N.
        - |
          Correct. The scale is in equilibrium with 40 N at each end; its spring is stretched exactly as it would be holding a 40 N weight from a hook, so it reads 40 N.
      answer: 3
    - slug: apphys1-u02-w10-q08
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Physics 1 CED, Topic 2.2"
      points: 1
      prompt: |
        A potted plant hangs at rest from a spring attached to a porch ceiling. Which describes the free-body diagram of the plant?
      options:
        - "An upward spring force and a downward gravitational force of equal length"
        - "An upward spring force, a downward gravitational force and a downward force from the ceiling"
        - "An upward spring force longer than the downward gravitational force"
        - "A downward gravitational force only, because the spring is part of the plant's system"
      option_explanations:
        - |
          Correct. Only the spring touches the plant, and Earth pulls on it. It is at rest, so the two forces are equal in size and opposite (Newton's first law).
        - |
          The ceiling does not touch the plant; it pulls on the spring, and the spring pulls on the plant.
        - |
          Unequal arrows would mean a net upward force and an upward acceleration, but the plant is at rest.
        - |
          The question asks for the plant's free-body diagram; the spring is a separate object exerting an external force on it.
      answer: 0
    - slug: apphys1-u02-w10-q09
      type: multiple_choice
      topic_code: "2.8"
      source: "AP Physics 1 CED, Topic 2.8"
      points: 1
      prompt: |
        A 0.40 kg block on a frictionless horizontal track is pushed against a spring with k = 200 N/m, compressing it 5.0 cm, and released. What is the block's acceleration at the instant of release?
      options:
        - "2500 m/s²"
        - "10 m/s²"
        - "25 m/s²"
        - "0.63 m/s²"
      option_explanations:
        - |
          This uses the compression in centimetres (5.0) instead of metres (0.050); the force would be a hundred times too large.
        - |
          10 N is the spring force, kΔx; the acceleration needs that force divided by the mass.
        - |
          Correct. F_s = kΔx = 200 × 0.050 = 10 N, so a = F/m = 10/0.40 = 25 m/s², directed away from the spring.
        - |
          This divides ½kx² (an energy, 0.25 J) by the mass; the acceleration comes from the force kΔx, not from energy.
      answer: 2
    - slug: apphys1-u02-w10-q10
      type: multiple_choice
      topic_code: "2.8"
      source: "AP Physics 1 CED, Topic 2.8"
      points: 1
      prompt: |
        A 0.50 kg mass hangs from a spring with k = 40 N/m inside an elevator that is speeding up as it rises, with an acceleration of 2.0 m/s². How far is the spring stretched while the mass hangs at rest relative to the elevator?
      options:
        - "12 cm"
        - "15 cm"
        - "9.8 cm"
        - "2.5 cm"
      option_explanations:
        - |
          About 12 cm is the stretch at rest, mg/k; with an upward acceleration the spring must pull harder than the weight.
        - |
          Correct. Up positive: kΔx − mg = ma, so Δx = m(g + a)/k = 0.50 × 11.8/40 ≈ 0.148 m ≈ 15 cm.
        - |
          This uses g − a, which applies to a downward acceleration; speeding up while rising means the acceleration is upward.
        - |
          This uses only ma/k, as if the spring did not also have to hold up the weight.
      answer: 1
    - slug: apphys1-u02-w10-q11
      type: multiple_choice
      topic_code: "2.7"
      source: "AP Physics 1 CED, Topic 2.7"
      points: 1
      prompt: |
        A student holds a 1.5 kg book against a vertical wall by pushing horizontally on it. The coefficient of static friction between book and wall is 0.60. What is the smallest push that keeps the book from sliding down?
      options:
        - "8.8 N"
        - "15 N"
        - "0.90 N"
        - "25 N"
      option_explanations:
        - |
          This multiplies the weight by μ_s; the push sets the normal force, and μ_s times that normal force must reach the weight.
        - |
          This is the weight alone; because μ_s is less than 1, the normal force must exceed the weight.
        - |
          This multiplies the mass by μ_s and leaves out g.
        - |
          Correct. Static friction holds the book up, so μ_s F_N ≥ mg with F_N equal to the push: F ≥ mg/μ_s = 14.7/0.60 ≈ 25 N.
      answer: 3
    - slug: apphys1-u02-w10-q12
      type: multiple_choice
      topic_code: "2.3"
      source: "AP Physics 1 CED, Topic 2.3"
      points: 1
      prompt: |
        A compressed spring is placed between a 0.5 kg cart and a 2.0 kg cart on a level track, and both carts are released. While the spring pushes them apart, how does the force on the light cart compare with the force on the heavy cart?
      options:
        - "They are equal in magnitude"
        - "The force on the light cart is four times larger"
        - "The force on the heavy cart is four times larger"
        - "The force on the light cart is larger, but not by any fixed factor"
      option_explanations:
        - |
          Correct. Each cart pushes on the massless spring and the spring pushes back equally on both (Newton's third law at each end, and an ideal spring carries one force throughout). The light cart gets four times the acceleration, not four times the force.
        - |
          The light cart's acceleration is four times larger, because a = F/m with the same F; the forces are equal.
        - |
          A heavier object does not receive a larger force from the spring; the spring pushes equally on whatever is at each end.
        - |
          The forces are exactly equal at every instant; only the accelerations differ.
      answer: 0
    - slug: apphys1-u02-w10-q13
      type: multiple_choice
      topic_code: "2.6"
      source: "AP Physics 1 CED, Topic 2.6"
      points: 1
      prompt: |
        A 0.50 kg mass hung from a spring stretches it 4.9 cm on Earth (g = 9.8 N/kg). The same spring and mass are taken to the Moon, where g = 1.6 N/kg. How far does the mass stretch the spring there?
      options:
        - "4.9 cm, because the mass is unchanged"
        - "30 cm"
        - "0.80 cm"
        - "2.0 cm"
      option_explanations:
        - |
          The mass is unchanged, but the spring must balance the weight mg, which is smaller in the Moon's weaker field.
        - |
          This multiplies by 9.8/1.6 instead of dividing; the weight, and so the stretch, gets smaller on the Moon.
        - |
          Correct. The stretch is mg/k, proportional to g, so it shrinks by a factor of 1.6/9.8: 4.9 cm × 1.6/9.8 = 0.80 cm.
        - |
          This scales by the square root of 1.6/9.8; the stretch mg/k is directly proportional to g, not to its square root.
      answer: 2
    - slug: apphys1-u02-w10-q14
      type: multiple_choice
      topic_code: "2.1"
      source: "AP Physics 1 CED, Topic 2.1"
      points: 1
      prompt: |
        A 2.0 kg ball and a 6.0 kg ball are fixed to the two ends of a light rod 1.2 m long. How far from the 2.0 kg ball is the centre of mass of the system?
      options:
        - "0.30 m"
        - "0.90 m"
        - "0.60 m"
        - "0.40 m"
      option_explanations:
        - |
          0.30 m is the distance from the 6.0 kg ball; the centre of mass lies closer to the heavier ball, so it is 0.30 m from that end, not from the 2.0 kg ball.
        - |
          Correct. Measuring from the 2.0 kg ball, x_cm = (2.0 × 0 + 6.0 × 1.2)/(2.0 + 6.0) = 7.2/8.0 = 0.90 m, closer to the heavier ball.
        - |
          The midpoint would be right only for equal masses; the centre of mass is weighted toward the larger mass.
        - |
          This multiplies the rod length by the mass ratio 2.0/6.0; the fraction of the length should be 6.0/(2.0 + 6.0), the far mass over the total mass.
      answer: 1
    - slug: apphys1-u02-w10-q15
      type: multi_select
      topic_code: "2.8"
      source: "AP Physics 1 CED, Topic 2.8"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about an ideal spring are correct? Select all that apply.
      options:
        - "The slope of a graph of spring force against stretch equals the spring constant."
        - "The spring constant increases when a heavier mass is hung from the spring."
        - "Hooke's law describes the spring only as long as it is not stretched past its elastic limit."
        - "The force the spring exerts is proportional to its total length."
        - "Cutting the spring into two equal halves gives each half twice the original spring constant."
      option_explanations:
        - |
          Correct. F_s = kΔx is a straight line through the origin with slope k.
        - |
          k is a property of the spring; a heavier mass changes the stretch, not k.
        - |
          Correct. Past the elastic limit the spring deforms permanently and the force is no longer proportional to the stretch.
        - |
          The force is proportional to the change in length from the relaxed length, not to the total length.
        - |
          Correct. The whole spring is two halves in series: 1/k = 2/k_half, so k_half = 2k.
      answer: [0, 2, 4]
    - slug: apphys1-u02-w10-q16
