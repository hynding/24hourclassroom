    - slug: apphys1-u02-w10-q17
      type: true_false
      topic_code: "2.8"
      source: "AP Physics 1 CED, Topic 2.8"
      points: 1
      prompt: |
        True or false: Two identical springs hooked end to end (in series) have a larger equivalent spring constant than one of the springs alone.
      answer: false
      explanation: |
        False. In series each spring carries the full load and their stretches add, so the same force gives twice the stretch: k_eq = k/2, smaller than k. Springs side by side (in parallel) would give 2k.
    - slug: apphys1-u02-w10-q18
      type: true_false
      topic_code: "2.4"
      source: "AP Physics 1 CED, Topic 2.4"
      points: 1
      prompt: |
        True or false: A passenger in a car moving along a straight, level road at a constant 20 m/s drops a coin from rest relative to the car. Ignoring air resistance, the coin lands directly below the point where she released it, just as it would if the car were parked.
      answer: true
      explanation: |
        True. A car moving at constant velocity is an inertial reference frame. The coin already shares the car's 20 m/s forward velocity, and no horizontal force acts on it while it falls, so by Newton's first law it keeps pace with the car and lands directly below the release point. Only an accelerating car (speeding up, braking or turning) would make it land off to one side.
