    - slug: apphys1-u02-w10-q22
      type: numeric
      topic_code: "2.7"
      source: "AP Physics 1 CED, Topic 2.7"
      points: 1
      prompt: |
        A plastic storage bin slides down a ramp inclined at 30° above the horizontal. The coefficient of kinetic friction between bin and ramp is 0.25. What is the bin's acceleration down the ramp? Give your answer in m/s² to two significant figures.
      answer: { value: 2.8, tolerance: 0.05 }
      explanation: |
        Along the ramp: mg sin 30° − μ_k mg cos 30° = ma, so a = g(sin 30° − μ_k cos 30°) = 9.8 × (0.500 − 0.217) ≈ 2.78 m/s², about 2.8 m/s². Using mg instead of mg cos 30° for the normal force gives 2.45 m/s².
    - slug: apphys1-u02-w10-q23
      type: short_answer
      topic_code: "2.8"
      source: "AP Physics 1 CED, Topic 2.8"
      points: 3
      prompt: |
        Spring P has spring constant 50 N/m and spring Q has spring constant 100 N/m.

        (a) On one set of axes, with spring force on the vertical axis and stretch on the horizontal axis, describe the graphs for the two springs and how they differ.
        (b) The same 1.0 kg mass is hung from each spring in turn. Which spring stretches more, and by what factor? Justify your answer with Hooke's law.
        (c) A student says that because spring Q is stiffer, it pulls harder on the 1.0 kg mass when the mass hangs at rest. Is the student correct? Explain.
      answer: |
        (a) Both graphs are straight lines through the origin. Spring Q's line has slope 100 N/m, twice as steep as spring P's line (slope 50 N/m).
        (b) Spring P stretches twice as far. At rest each spring force equals mg = 9.8 N, so Δx = mg/k: 0.196 m for P and 0.098 m for Q; halving k doubles the stretch.
        (c) No. When the mass hangs at rest, each spring pulls up with exactly mg = 9.8 N, because the net force on the mass is zero. Spring Q reaches that force with a smaller stretch; it does not pull harder.
      explanation: |
        Three points, one per part. (a) two straight lines through the origin, Q's twice as steep (slope = k). (b) spring P, by a factor of 2, using Δx = mg/k with the same force on both (numbers optional). (c) disagrees, because equilibrium makes both spring forces equal to the weight; the stiffer spring stretches less for the same force.
    - slug: apphys1-u02-w10-q24
      type: short_answer
      topic_code: "2.8"
      source: "AP Physics 1 CED, Topic 2.8"
      points: 3
      prompt: |
        A 2.0 kg cart rests on a frictionless ramp inclined at 30° above the horizontal. It is held in place by a spring (k = 180 N/m) attached to the top of the ramp and running parallel to the ramp's surface.

        (a) Describe the free-body diagram of the cart in words, naming each force and its direction.
        (b) Derive an expression for the stretch of the spring in terms of m, g, θ and k.
        (c) Calculate the stretch in centimetres.
      answer: |
        (a) A downward arrow F_g = mg (straight down); an arrow F_N perpendicular to the ramp surface, pointing away from it; an arrow F_s parallel to the ramp, pointing up the slope toward the spring's anchor.
        (b) Along the ramp the cart is in equilibrium: kΔx − mg sin θ = 0, so Δx = mg sin θ/k.
        (c) Δx = 2.0 × 9.8 × sin 30°/180 = 9.8/180 ≈ 0.054 m ≈ 5.4 cm.
      explanation: |
        Three points. (a) 1 point: exactly three forces with correct directions (no friction on a frictionless ramp). (b) 1 point: Δx = mg sin θ/k from equilibrium along the ramp; using mg or mg cos θ earns no point. (c) 1 point: about 5.4 cm (accept 5.4 to 5.5 cm).
    - slug: apphys1-u02-w10-q25
      type: long_answer
      topic_code: "2.8"
      source: "AP Physics 1 CED, Topic 2.8"
      points: 6
      prompt: |
        Qualitative/quantitative translation. A block of mass m rests on a rough, level table. A student attaches a spring of constant k to the block and slowly pulls the free end of the spring horizontally, so the spring stretches more and more. The coefficient of static friction between block and table is μ_s and the coefficient of kinetic friction is μ_k, with μ_k less than μ_s.

        (A) Without equations, explain in a few sentences how the stretch of the spring at the moment the block starts to slide would change if (i) the block's mass were doubled and (ii) the spring were replaced by a stiffer one.

        (B) Derive an expression for the stretch of the spring at the moment the block starts to slide, and show that it agrees with your reasoning in (A).

        (C) For m = 1.2 kg, μ_s = 0.45, μ_k = 0.30 and k = 90 N/m, calculate the stretch just before the block slides and the stretch while the student then pulls the block along at constant velocity.
      answer: |
        (A) (i) Doubling the mass doubles the normal force and so doubles the maximum static friction; the spring must pull twice as hard before the block slips, so it must stretch twice as far. (ii) A stiffer spring produces the same pulling force with less stretch, so the stretch at slipping would be smaller.
        (B) Just before slipping the block is in equilibrium with static friction at its maximum: kΔx = μ_s F_N = μ_s mg, so Δx = μ_s mg/k. Δx is proportional to m (doubling m doubles it) and inversely proportional to k (a stiffer spring gives a smaller stretch), matching (A).
        (C) Just before sliding: Δx = 0.45 × 1.2 × 9.8/90 = 5.29/90 ≈ 0.059 m (5.9 cm). At constant velocity the spring balances kinetic friction: Δx = 0.30 × 1.2 × 9.8/90 = 3.53/90 ≈ 0.039 m (3.9 cm). The stretch drops when the block breaks free because μ_k is less than μ_s.
      explanation: |
        Six points.
        (A) 2 points: 1 for (i), the stretch doubles, reasoned through the larger normal force and maximum static friction; 1 for (ii), the stretch is smaller, reasoned through the stiffer spring giving the same force with less stretch.
        (B) 2 points: 1 for Δx = μ_s mg/k from kΔx = μ_s mg (static friction at its maximum, F_N = mg); 1 for explicitly connecting the proportionalities in the expression to both claims in (A). An expression with μ_k earns at most the second point.
        (C) 2 points: 1 for about 0.059 m (accept 5.8 to 6.0 cm); 1 for about 0.039 m (accept 3.9 to 4.0 cm) while sliding at constant velocity.
