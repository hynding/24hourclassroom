week: 11
unit: 2
title: "Circular Motion"
topics: ["2.9"]
guide: guides/week-11.md
guide_description: |
  Uniform circular motion as accelerated motion: centripetal acceleration a_c = v²/r toward the centre, period
  and frequency (v = 2πr/T), the net inward force supplied by real forces (tension, friction, normal force,
  gravity, springs) with no centrifugal force, tangential versus centripetal acceleration, flat curves, hills,
  dips and vertical loops, and linearising force–speed data. Worked examples: a ball on a string with a
  functional-dependence check, a child on a merry-go-round, the friction a car needs on a 60 m curve and its
  maximum speed, the normal force at the top and bottom of a roller-coaster loop with the minimum-speed limiting
  case, and a force-sensor lab graphed as force against v².
flashcards_description: |
  30 cards on circular motion: why constant speed in a circle is acceleration, a_c = v²/r and its functional
  dependence, period and speed, what supplies the inward force in common situations, flat curves, hills, dips,
  swings and loops, tangential versus centripetal acceleration, tangent-line release, and linearised lab graphs.

flashcards:
  - front: Car circling a roundabout at a steady 10 m/s → is it accelerating?
    back: |
      Yes. Its velocity's direction changes continuously, so its velocity changes and it has an acceleration toward the centre, even at constant speed.
    topic_code: "2.9"
  - front: Centripetal acceleration of uniform circular motion → size and direction
    back: |
      a_c = v²/r, directed toward the centre of the circle, perpendicular to the velocity at every instant.
    topic_code: "2.9"
  - front: Doubling the speed on a circle of fixed radius → change in centripetal acceleration
    back: |
      It quadruples, because a_c = v²/r depends on the square of the speed. The inward net force needed also quadruples.
    topic_code: "2.9"
  - front: Doubling the radius at the same speed → change in centripetal acceleration
    back: |
      It halves, because a_c = v²/r is inversely proportional to r when v is fixed.
    topic_code: "2.9"
  - front: Two riders on one merry-go-round, at 1 m and 2 m from the centre → compare speeds and accelerations
    back: |
      Same period, so the outer rider has twice the speed (v = 2πr/T) and twice the acceleration (a_c = 4π²r/T²).
    topic_code: "2.9"
  - front: Speed from period on a circle → formula
    back: |
      v = 2πr/T: one circumference per period. Frequency f = 1/T, so also v = 2πrf.
    topic_code: "2.9"
  - front: Child 2.0 m from the centre of a merry-go-round turning once every 4.0 s → speed and acceleration
    back: |
      v = 2π(2.0)/4.0 ≈ 3.1 m/s; a_c = v²/r ≈ 4.9 m/s² toward the centre.
    topic_code: "2.9"
  - front: Newton's second law for uniform circular motion → how to write it
    back: |
      Sum the force components toward the centre (inward positive, outward negative) and set the sum equal to mv²/r.
    topic_code: "2.9"
  - front: "\"Centripetal force\" on a free-body diagram → should you draw it?"
    back: |
      No. It is not a new kind of force. Draw only real forces (tension, friction, normal, gravity, spring); their inward sum equals mv²/r.
    topic_code: "2.9"
  - front: Passenger sliding toward the door as a car turns left → what is really happening
    back: |
      No outward force pushes the passenger. Their body tends to keep moving straight (first law) while the car turns; the door then pushes them inward.
    topic_code: "2.9"
  - front: Ball whirled on a string when the string snaps → path it follows
    back: |
      A straight line along the tangent to the circle at the point of release (then curving down under gravity), not outward along the radius.
    topic_code: "2.9"
  - front: Ball on a string in a horizontal circle on a frictionless table → what supplies the inward force
    back: |
      The string's tension, pointing toward the centre. Gravity and the normal force are vertical and cancel.
    topic_code: "2.9"
  - front: 0.15 kg ball on a 0.60 m string at 4.0 m/s → tension
    back: |
      T = mv²/r = 0.15 × 16/0.60 = 4.0 N. At 8.0 m/s it would need 16 N.
    topic_code: "2.9"
  - front: Car on a flat, level curve → what supplies the inward force
    back: |
      Static friction from the road on the tyres, pointing toward the centre. The tyres are not skidding sideways, so it is static.
    topic_code: "2.9"
  - front: Maximum speed on a flat curve → formula and what it does not depend on
    back: |
      v_max = √(μ_s g r), from μ_s mg = mv²/r. The mass cancels, so a heavy truck and a small car with the same tyres share the limit.
    topic_code: "2.9"
  - front: 1500 kg car on a 60 m flat curve at 15 m/s → friction needed and minimum μ_s
    back: |
      F_f = 1500 × 225/60 = 5625 N; μ_s must be at least v²/(gr) ≈ 0.38.
    topic_code: "2.9"
  - front: Banked curve → why it allows higher speeds
    back: |
      Tilting the road tilts the normal force so that its horizontal component points toward the centre and supplies some or all of the inward force.
    topic_code: "2.9"
  - front: Car at the crest of a rounded hill → normal force compared with mg
    back: |
      Less: mg − F_N = mv²/r, so F_N = m(g − v²/r). Passengers feel lighter, and at v = √(gr) the car leaves the road.
    topic_code: "2.9"
  - front: Rider at the bottom of a dip or a swing → normal force compared with mg
    back: |
      Greater: F_N − mg = mv²/r, so F_N = m(g + v²/r). Riders feel heavier.
    topic_code: "2.9"
  - front: Rider upside down at the top of a loop → direction of the normal force
    back: |
      Downward, toward the centre, the same direction as gravity: F_N + mg = mv²/r.
    topic_code: "2.9"
  - front: Minimum speed at the top of a vertical loop → formula and why
    back: |
      v_min = √(gr): at that speed the normal force is zero and gravity alone supplies the inward force. Slower, and the track would have to pull up.
    topic_code: "2.9"
  - front: 70 kg rider at the bottom of an 8.0 m loop at 20 m/s → seat force
    back: |
      F_N = m(g + v²/r) = 70 × (9.8 + 50) ≈ 4190 N, about six times the rider's weight.
    topic_code: "2.9"
  - front: Bucket of water swung in a vertical circle → why the water stays in at the top
    back: |
      If v² ≥ gr at the top, gravity alone is not enough to supply mv²/r, so the bucket's bottom must push the water down: the water stays pressed in.
    topic_code: "2.9"
  - front: Car speeding up while rounding a curve → components of its acceleration
    back: |
      A tangential component (along the velocity, changing the speed) and a centripetal component v²/r (toward the centre, changing the direction).
    topic_code: "2.9"
  - front: Force against speed for a puck on a string → what to graph for a straight line
    back: |
      Force against v²: F = (m/r)v² is a line through the origin with slope m/r.
    topic_code: "2.9"
  - front: Force against radius at constant speed → what to graph for a straight line
    back: |
      Force against 1/r: F = mv²(1/r) is a line through the origin with slope mv².
    topic_code: "2.9"
  - front: Timing ten revolutions instead of one → why
    back: |
      The reaction-time error is made once for the whole set, so the uncertainty in each period is about ten times smaller.
    topic_code: "2.9"
  - front: Error-spot → "the whirled ball moves at constant speed, so the net force on it is zero"
    back: |
      Constant speed in a circle is not constant velocity. The direction changes, so there is a net force of mv²/r toward the centre.
    topic_code: "2.9"
  - front: Error-spot → "at the top of the hill, F_N = mg because the car is level there"
    back: |
      The car is on a curved path, so the net force points down toward the centre: F_N = m(g − v²/r), less than mg.
    topic_code: "2.9"
  - front: Error-spot → "when the string breaks, the ball flies straight outward"
    back: |
      With no inward force the ball keeps its velocity at that instant, which is tangent to the circle, so it leaves along the tangent.
    topic_code: "2.9"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topic 2.9: centripetal acceleration, period and speed,
    the forces that supply the inward net force, flat curves, hills, dips and loops, and linearising circular-motion
    data), with 8 questions (32%) reviewing earlier weeks (projectile motion, free-body diagrams, Newton's second
    and third laws, gravitational force, friction and springs). Opens with a shared-context set on an air-table
    force-sensor lab. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes. Use g = 9.8 m/s². Calculator and equation sheet allowed throughout.
  questions:
    # ---- Stimulus set: air-table puck on a force sensor, varying radius (2.9)
    - slug: apphys1-u02-w11-q01
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Physics 1 CED, Topic 2.9"
      points: 1
      stimulus: |
        A lab group ties a puck on a level air table (negligible friction) to a string that runs to a force sensor fixed at the centre of the table. They spin the puck in horizontal circles of different radii, using a strobe app to keep its speed at 1.5 m/s each time, and record the string force:

        | Radius r (m) | 0.30 | 0.40 | 0.50 | 0.60 | 0.75 |
        |---|---|---|---|---|---|
        | String force F (N) | 2.27 | 1.66 | 1.37 | 1.12 | 0.91 |
      prompt: |
        Which graph should the group make to get a straight line through the origin?
      options:
        - "String force against radius"
        - "String force against radius squared"
        - "String force against 1/r"
        - "String force against √r"
      option_explanations:
        - |
          Force decreases as the radius grows, so this graph slopes down and curves; it is not a straight line through the origin.
        - |
          This would be straight only if force were proportional to r², but the force gets smaller as r increases.
        - |
          Correct. With constant speed, F = mv²/r = (mv²)(1/r), so force against 1/r is a straight line through the origin with slope mv².
        - |
          Force falls as r rises, so it cannot be proportional to √r; the model F = mv²/r makes it proportional to 1/r.
      answer: 2
    - slug: apphys1-u02-w11-q02
      type: numeric
      topic_code: "2.9"
      source: "AP Physics 1 CED, Topic 2.9"
      points: 1
      stimulus: |
        A lab group ties a puck on a level air table (negligible friction) to a string that runs to a force sensor fixed at the centre of the table. They spin the puck in horizontal circles of different radii, using a strobe app to keep its speed at 1.5 m/s each time, and record the string force:

        | Radius r (m) | 0.30 | 0.40 | 0.50 | 0.60 | 0.75 |
        |---|---|---|---|---|---|
        | String force F (N) | 2.27 | 1.66 | 1.37 | 1.12 | 0.91 |
      prompt: |
        The group plots string force (vertical) against 1/r (horizontal). What is the slope of the best-fit line, in N·m? Give your answer to two significant figures.
      answer: { value: 0.68, tolerance: 0.02 }
      explanation: |
        The 1/r values are 3.33, 2.50, 2.00, 1.67 and 1.33 m⁻¹. The least-squares slope is about 0.677 N·m (intercept ≈ 0); a line through the end points gives (2.27 − 0.91)/(3.33 − 1.33) = 1.36/2.00 = 0.68 N·m. So the slope is about 0.68 N·m, which the model says equals mv².
    - slug: apphys1-u02-w11-q03
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Physics 1 CED, Topic 2.9"
      points: 1
      stimulus: |
        A lab group ties a puck on a level air table (negligible friction) to a string that runs to a force sensor fixed at the centre of the table. They spin the puck in horizontal circles of different radii, using a strobe app to keep its speed at 1.5 m/s each time, and record the string force:

        | Radius r (m) | 0.30 | 0.40 | 0.50 | 0.60 | 0.75 |
        |---|---|---|---|---|---|
        | String force F (N) | 2.27 | 1.66 | 1.37 | 1.12 | 0.91 |
      prompt: |
        The best-fit line of string force against 1/r has a slope of 0.68 N·m. What mass of the puck does this imply?
      options:
        - "0.30 kg"
        - "0.45 kg"
        - "1.0 kg"
        - "0.068 kg"
      option_explanations:
        - |
          Correct. The slope is mv², so m = 0.68/(1.5)² = 0.68/2.25 ≈ 0.30 kg.
        - |
          This divides the slope by v instead of v²; the slope of force against 1/r is mv².
        - |
          This multiplies the slope by v rather than dividing by v²; check the units, kg·m²/s² ÷ (m/s)² = kg.
        - |
          This divides the slope by 10, as if it were a weight with g ≈ 10; gravity plays no part in a horizontal air-table circle.
      answer: 0
    - slug: apphys1-u02-w11-q04
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Physics 1 CED, Topic 2.9"
      points: 1
      stimulus: |
        A lab group ties a puck on a level air table (negligible friction) to a string that runs to a force sensor fixed at the centre of the table. They spin the puck in horizontal circles of different radii, using a strobe app to keep its speed at 1.5 m/s each time, and record the string force:

        | Radius r (m) | 0.30 | 0.40 | 0.50 | 0.60 | 0.75 |
        |---|---|---|---|---|---|
        | String force F (N) | 2.27 | 1.66 | 1.37 | 1.12 | 0.91 |
      prompt: |
        The group keeps the radius at 0.50 m and spins the puck at 3.0 m/s instead of 1.5 m/s. What string force should they predict?
      options:
        - "1.4 N, the same as before"
        - "2.7 N"
        - "0.68 N"
        - "5.5 N"
      option_explanations:
        - |
          The force depends on speed: at a larger speed the direction changes faster and a larger inward force is needed.
        - |
          This doubles the force, treating it as proportional to v; it is proportional to v².
        - |
          This halves the force; a larger speed needs a larger, not a smaller, inward force.
        - |
          Correct. F = mv²/r, so doubling v at fixed r multiplies the force by 4: 4 × 1.37 N ≈ 5.5 N (or 0.30 × 9.0/0.50 = 5.4 N).
      answer: 3
    # ---- Independent items
    - slug: apphys1-u02-w11-q05
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Physics 1 CED, Topic 2.9"
      points: 1
      prompt: |
        A bus drives around a level circular curve at a constant speed of 12 m/s. What is the direction of the net force on the bus?
      options:
        - "Forward, along the bus's velocity"
        - "Toward the centre of the curve"
        - "Away from the centre of the curve"
        - "There is no net force, because the speed is constant"
      option_explanations:
        - |
          A forward net force would change the speed; at constant speed there is no component along the velocity.
        - |
          Correct. The velocity's direction is changing, so the bus accelerates toward the centre (a_c = v²/r), and by Newton's second law the net force points the same way.
        - |
          There is no outward force; the feeling of being thrown outward is the passengers' inertia, not a force on the bus.
        - |
          Constant speed is not constant velocity. Turning means the velocity changes, so the net force is not zero.
      answer: 1
    - slug: apphys1-u02-w11-q06
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Physics 1 CED, Topic 2.9"
      points: 1
      prompt: |
        A student, viewed from above, whirls a rubber ball on a string in a horizontal circle counterclockwise. When the ball is at the easternmost point of the circle, the string snaps. Ignoring gravity's effect on the ball's horizontal path, in which direction does the ball move just after the string breaks?
      options:
        - "East, straight away from the centre"
        - "West, back toward the centre"
        - "North, along the tangent to the circle"
        - "Along a curve that continues the circle"
      option_explanations:
        - |
          Nothing pushes the ball outward; with the string gone, there is no force to change its velocity, which at that point is not eastward.
        - |
          The string's pull toward the centre disappears when it snaps, so nothing pulls the ball west.
        - |
          Correct. Moving counterclockwise, at the east point the ball's velocity points north, tangent to the circle. With no horizontal force it keeps that velocity (Newton's first law).
        - |
          Following the circle needs an inward force. Without the string the ball moves in a straight line.
      answer: 2
    - slug: apphys1-u02-w11-q07
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Physics 1 CED, Topic 2.9"
      points: 1
      prompt: |
        A car rounds a level curve of radius 50 m. The coefficient of static friction between the tyres and the road is 0.80. What is the greatest speed at which the car can round the curve without skidding?
      options:
        - "20 m/s"
        - "392 m/s"
        - "6.3 m/s"
        - "25 m/s"
      option_explanations:
        - |
          Correct. Static friction supplies the inward force: μ_s mg = mv²/r, so v_max = √(μ_s g r) = √(0.80 × 9.8 × 50) = √392 ≈ 20 m/s.
        - |
          392 is v² in m²/s²; the square root was not taken.
        - |
          This leaves g out, √(0.80 × 50); the friction force is μ_s times the normal force mg.
        - |
          This divides by μ_s instead of multiplying, √(gr/μ_s); slicker tyres (smaller μ_s) must give a lower limit, not a higher one.
      answer: 0
    - slug: apphys1-u02-w11-q08
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Physics 1 CED, Topic 2.9"
      points: 1
      prompt: |
        A 1000 kg car drives over the top of a rounded hill whose radius of curvature is 20 m, at a speed of 10 m/s. What is the normal force from the road on the car at the top?
      options:
        - "14,800 N"
        - "9800 N"
        - "5000 N"
        - "4800 N"
      option_explanations:
        - |
          This adds mv²/r to mg, which is the result for the bottom of a dip, where the centre of the circle is above the car.
        - |
          F_N = mg only if the car were not accelerating; on the curved crest it accelerates downward, toward the centre.
        - |
          5000 N is mv²/r, the net inward force, not the normal force.
        - |
          Correct. At the crest the centre is below the car: mg − F_N = mv²/r, so F_N = 1000 × (9.8 − 100/20) = 1000 × 4.8 = 4800 N.
      answer: 3
    - slug: apphys1-u02-w11-q09
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Physics 1 CED, Topic 2.9"
      points: 1
      prompt: |
        A toy car runs around a vertical loop-the-loop track of radius 4.0 m (a large demonstration track). What is the smallest speed the car can have at the top of the loop and still stay in contact with the track?
      options:
        - "Zero: any speed works if the car reaches the top"
        - "6.3 m/s"
        - "39 m/s"
        - "8.9 m/s"
      option_explanations:
        - |
          At the top the car must still move in a circle, which needs an inward net force of at least mg; a car with no speed simply falls.
        - |
          Correct. The minimum is when the normal force is zero and gravity alone supplies the inward force: mg = mv²/r, so v = √(gr) = √(9.8 × 4.0) ≈ 6.3 m/s.
        - |
          39 is gr in m²/s², not a speed; take the square root.
        - |
          This is √(2gr), which comes from mixing in an energy expression; at the top the condition is mg = mv²/r.
      answer: 1
    - slug: apphys1-u02-w11-q10
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Physics 1 CED, Topic 2.9"
      points: 1
      prompt: |
        A carousel horse is 5.0 m from the centre of a carousel that makes one revolution every 12 s. What is the horse's centripetal acceleration?
      options:
        - "2.6 m/s²"
        - "0.42 m/s²"
        - "1.4 m/s²"
        - "0.22 m/s²"
      option_explanations:
        - |
          2.6 is the horse's speed in m/s, v = 2π(5.0)/12; the acceleration is v²/r.
        - |
          This divides the radius by the period, which is neither the speed nor the acceleration.
        - |
          Correct. v = 2πr/T = 2π(5.0)/12 ≈ 2.62 m/s, so a_c = v²/r = 6.85/5.0 ≈ 1.4 m/s² toward the centre (equivalently 4π²r/T²).
        - |
          This computes 2πr/T², leaving out a factor of 2π; a_c = 4π²r/T².
      answer: 2
    - slug: apphys1-u02-w11-q11
      type: multiple_choice
      topic_code: "2.9"
      source: "AP Physics 1 CED, Topic 2.9"
      points: 1
      prompt: |
        A 30 kg child swings on a playground swing whose chains are 2.5 m long. At the lowest point her speed is 4.0 m/s. What is the total upward force the chains exert on the seat-and-child system at that point? (Treat the seat's mass as negligible.)
      options:
        - "490 N"
        - "294 N"
        - "102 N"
        - "192 N"
      option_explanations:
        - |
          Correct. At the bottom the centre is above: T − mg = mv²/r, so T = 30 × (9.8 + 16/2.5) = 30 × 16.2 = 486 N, about 490 N.
        - |
          This is just her weight; she is moving on a circle, so the chains must pull harder than mg at the bottom.
        - |
          This subtracts mv²/r from mg, the result for the top of a hill, where the centre is below.
        - |
          This is mv²/r, the net inward force, without the part of the tension that supports her weight.
      answer: 0
    - slug: apphys1-u02-w11-q12
      type: multiple_choice
      topic_code: "2.8"
      source: "AP Physics 1 CED, Topic 2.8"
      points: 1
      prompt: |
        A puck on a frictionless air table is attached to a fixed post by a spring with k = 50 N/m and a relaxed length of 0.40 m. The puck moves in a circle around the post with the spring stretched to a length of 0.50 m. What force does the spring exert on the puck?
      options:
        - "25 N"
        - "20 N"
        - "45 N"
        - "5.0 N"
      option_explanations:
        - |
          This uses the whole length, 0.50 m, as the stretch; Hooke's law uses the change from the relaxed length.
        - |
          This uses the relaxed length, 0.40 m, as the stretch.
        - |
          This adds the two lengths, 0.90 m; the stretch is their difference.
        - |
          Correct. The stretch is 0.50 − 0.40 = 0.10 m, so F_s = kΔx = 50 × 0.10 = 5.0 N, toward the post, supplying the inward force.
      answer: 3
    - slug: apphys1-u02-w11-q13
      type: multiple_choice
      topic_code: "2.7"
      source: "AP Physics 1 CED, Topic 2.7"
      points: 1
      prompt: |
        A wooden block slides down a board at constant speed once the board is tilted to 22° above the horizontal. What is the coefficient of kinetic friction between the block and the board?
      options:
        - "0.37"
        - "0.40"
        - "0.93"
        - "2.5"
      option_explanations:
        - |
          This is sin 22°, which assumes the normal force equals the full weight; on the incline it is mg cos 22°.
        - |
          Correct. Constant speed means zero net force: mg sin θ = μ_k mg cos θ, so μ_k = tan 22° ≈ 0.40.
        - |
          This is cos 22°; the coefficient is the ratio of the parallel to the perpendicular component of gravity.
        - |
          This is 1/tan 22°, the ratio taken upside down.
      answer: 1
    - slug: apphys1-u02-w11-q14
      type: multiple_choice
      topic_code: "2.6"
      source: "AP Physics 1 CED, Topic 2.6"
      points: 1
      prompt: |
        A lab's two lead spheres attract each other with a gravitational force F. One sphere is swapped for a sphere with half its mass, and the spheres are moved so that the distance between their centres is halved. What is the new gravitational force?
      options:
        - "4F"
        - "F"
        - "2F"
        - "F/8"
      option_explanations:
        - |
          This applies the inverse-square effect of halving the distance (× 4) but forgets that one mass was halved (× ½).
        - |
          This treats the force as inversely proportional to r, so halving r only doubles it, which the halved mass then cancels; gravity goes as 1/r², a factor of 4.
        - |
          Correct. F = Gm₁m₂/r². Halving one mass multiplies F by ½; halving r multiplies it by 1/(½)² = 4. Net factor ½ × 4 = 2, so the force is 2F.
        - |
          This applies the distance change backwards, dividing by 4 as if the spheres had moved twice as far apart, and then halves for the mass.
      answer: 2
    - slug: apphys1-u02-w11-q15
      type: multiple_choice
      topic_code: "1.5"
      source: "AP Physics 1 CED, Topic 1.5"
      points: 1
      prompt: |
        A soccer ball is kicked from level ground at 12 m/s at 30° above the horizontal. Ignoring air resistance, how long is the ball in the air before it lands on the level ground?
      options:
        - "0.61 s"
        - "2.1 s"
        - "2.4 s"
        - "1.2 s"
