        True or false: A cyclist riding around a circular velodrome track at a constant speed of 15 m/s has zero acceleration.
      answer: false
      explanation: |
        False. The direction of the velocity changes continuously, so the velocity changes and the cyclist accelerates toward the centre with a_c = v²/r, even though the speed is constant.
    - slug: apphys1-u02-w11-q19
      type: true_false
      topic_code: "2.3"
      source: "AP Physics 1 CED, Topic 2.3"
      points: 1
      prompt: |
        True or false: As a car rounds a level curve, the road pushes sideways on the tyres toward the centre of the curve, and the tyres push sideways on the road away from the centre with a force of equal magnitude.
      answer: true
      explanation: |
        True. The friction force of the road on the tyres and of the tyres on the road are a Newton's third law pair: equal in magnitude, opposite in direction, acting on different objects. Only the force on the car appears in the car's free-body diagram and turns it.
