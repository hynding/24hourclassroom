      type: numeric
      topic_code: "2.9"
      source: "AP Physics 1 CED, Topic 2.9"
      points: 1
      prompt: |
        A 60 kg rider sits on a Ferris wheel of radius 15 m that turns at a constant rate, once every 30 s. What is the normal force from the seat on the rider at the top of the wheel? Give your answer in newtons to three significant figures.
      answer: { value: 549, tolerance: 4 }
      explanation: |
        v = 2πr/T = 2π(15)/30 ≈ 3.14 m/s, so a_c = v²/r ≈ 0.658 m/s², directed down (toward the centre) at the top. Down positive: mg − F_N = ma_c, so F_N = 60 × (9.8 − 0.658) ≈ 549 N, a little less than the rider's weight of 588 N.
    - slug: apphys1-u02-w11-q23
      type: short_answer
      topic_code: "2.9"
      source: "AP Physics 1 CED, Topic 2.9"
      points: 3
      prompt: |
        A car drives at constant speed over the top of a rounded hill whose radius of curvature is 20 m.

        (a) Describe the free-body diagram of the car at the top in words, including which arrow is longer.
        (b) Explain, using Newton's second law, why the passengers feel lighter than usual at the top.
        (c) Derive the speed at which the car would just lose contact with the road at the top, and calculate it.
      answer: |
        (a) A downward arrow F_g = mg and an upward arrow F_N from the road, with the downward arrow longer (the net force points down toward the centre). Horizontal forces (engine thrust, drag) balance and are optional.
        (b) At the top the centre of the circle is below the car, so the net force must point down with size mv²/r: mg − F_N = mv²/r, giving F_N = m(g − v²/r), less than mg. The seat pushes up on each passenger with less than their weight, and that reduced support is what "feeling lighter" means.
        (c) Contact is lost when F_N = 0: mg = mv²/r, so v = √(gr) = √(9.8 × 20) ≈ 14 m/s.
      explanation: |
        Three points, one per part. (a) two vertical forces with the gravitational arrow longer; equal arrows or an extra "centripetal force" arrow earns no point. (b) applies mg − F_N = mv²/r (net force toward the centre, downward) and links the smaller normal force to feeling lighter. (c) sets F_N = 0 to get v = √(gr) ≈ 14 m/s (accept 14.0).
    - slug: apphys1-u02-w11-q24
      type: short_answer
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 3
      prompt: |
        A 1.0 kg block hangs from a 3.0 kg block by a light string. A student lifts the 3.0 kg block with a rope that pulls straight up with 48 N, so both blocks accelerate upward together.

        (a) Calculate the acceleration of the blocks.
        (b) Calculate the tension in the string joining the two blocks.
        (c) A classmate says the tension in the lower string is 9.8 N, because the string only has to hold up the 1.0 kg block's weight. Explain the classmate's error.
      answer: |
        (a) Treat both blocks and the string as one system: the external forces are the 48 N pull up and the total weight 4.0 × 9.8 = 39.2 N down (the string tension is internal). a = (48 − 39.2)/4.0 = 2.2 m/s² upward.
        (b) For the 1.0 kg block alone: T − mg = ma, so T = 1.0 × (9.8 + 2.2) = 12 N. (Check on the 3.0 kg block: 48 − 12 − 29.4 = 6.6 N = 3.0 × 2.2.)
        (c) 9.8 N would be right only if the lower block were at rest or moving at constant velocity. It accelerates upward, so the net force on it must be upward: the string must pull with its weight plus m·a = 9.8 + 2.2 = 12 N.
      explanation: |
        Three points, one per part. (a) 2.2 m/s² from the two-block system, with the total weight subtracted. (b) 12 N from the second law applied to the 1.0 kg block alone (or to the 3.0 kg block). (c) explains that the upward acceleration requires an upward net force on the lower block, so the tension exceeds its weight. Using 48 N as the string tension earns no credit for (b).
    - slug: apphys1-u02-w11-q25
      type: long_answer
      topic_code: "2.9"
      source: "AP Physics 1 CED, Topic 2.9"
      points: 6
      prompt: |
        Mathematical routines. A highway curve of radius r is banked at an angle θ above the horizontal. Engineers want cars to round it at a design speed v with no sideways friction at all needed from the road.

        (A) Describe the free-body diagram of a car rounding the curve at the design speed with no friction, and identify which force or component supplies the inward net force.

        (B) Derive an expression for tan θ in terms of v, r and g.

        (C) Calculate the bank angle for a design speed of 20 m/s on a curve of radius 80 m.

        (D) A car takes this curve at 28 m/s. Is friction from the road now needed, and if so, in which direction along the road surface does it point? Explain.
      answer: |
        (A) Two forces: the gravitational force mg straight down, and the normal force F_N perpendicular to the banked road, tilted toward the centre of the curve by θ from vertical. The horizontal component of the normal force, F_N sin θ, supplies the inward net force; its vertical component F_N cos θ balances the weight.
        (B) Vertical: F_N cos θ = mg. Horizontal (toward the centre): F_N sin θ = mv²/r. Dividing the second by the first gives tan θ = v²/(rg).
        (C) tan θ = 20²/(80 × 9.8) = 400/784 ≈ 0.510, so θ ≈ 27°.
        (D) Yes. At 28 m/s the car needs mv²/r ≈ 2 times the inward force it needs at 20 m/s (28²/20² ≈ 1.96), more than the normal force's horizontal component can give without friction, so the car tends to slide up and outward. Static friction acts down the slope of the banked road, and its horizontal component adds to the inward force.
      explanation: |
        Six points.
        (A) 1 point: exactly two forces (gravity down, normal force perpendicular to the road) with the horizontal component of the normal force named as the inward force. Drawing an extra centripetal force earns no point.
        (B) 2 points: 1 for both component equations (F_N cos θ = mg and F_N sin θ = mv²/r); 1 for tan θ = v²/(rg). Using F_N = mg cos θ (the incline result) earns no points in (B).
        (C) 1 point: θ ≈ 27° (accept 26.5° to 27.5°).
        (D) 2 points: 1 for "yes, friction is needed" because more inward force is required than the normal force supplies at this angle; 1 for friction directed down the slope (toward the inside of the curve), with reasoning that the car would otherwise slide up and out.
