      type: short_answer
      topic_code: "2.3"
      source: "AP Physics 1 CED, Topic 2.3"
      points: 3
      prompt: |
        A student argues: "When a horse pulls a cart, the cart pulls back on the horse with an equal force. The forces cancel, so the horse and cart can never start moving."

        (a) Identify the error in the student's reasoning.
        (b) Name the horizontal forces on the cart, and explain how the cart can speed up.
        (c) Name the horizontal forces on the horse, and explain how the horse can speed up.
      answer: |
        (a) The horse's pull on the cart and the cart's pull on the horse are a third-law pair: they act on different objects, so they cannot cancel. Only forces on the same object add to give its net force.
        (b) On the cart: the horse's forward pull and the backward friction (rolling resistance) from the ground. When the pull is larger than the friction, the net force on the cart is forward and the cart speeds up.
        (c) On the horse: the cart's backward pull and the ground's forward push on the hooves (the partner of the horse pushing backward on the ground). When the ground's push is larger than the cart's pull, the net force on the horse is forward.
      explanation: |
        Three points, one per part. (a) states that the paired forces act on different objects and so do not cancel. (b) names the horse's pull and friction on the cart and compares them. (c) names the cart's pull and the ground's forward force on the horse and compares them. Saying the horse "pulls harder than the cart pulls back" earns no credit for (a).
    - slug: apphys1-u02-w06-q24
      type: short_answer
      topic_code: "2.4"
      source: "AP Physics 1 CED, Topic 2.4"
      points: 3
      prompt: |
        A car travels along a straight, level highway at a constant 30 m/s. A passenger claims that the engine must be producing a net forward force on the car, "or else the car would slow down."

        (a) Describe the horizontal forces on the car (name them and give their directions).
        (b) Evaluate the passenger's claim using Newton's first law.
        (c) The driver presses the accelerator harder and the forward force from the road increases. What happens to the car's motion, and why does it not continue to change forever if the driver holds the pedal steady?
      answer: |
        (a) A forward force from the road on the drive wheels (static friction, the partner of the tyres pushing back on the road) and backward forces: air resistance and rolling resistance.
        (b) The claim is wrong. The velocity is constant, so by Newton's first law the net force is zero: the forward force exactly equals the sum of the backward forces. Something keeps pushing forward, but the net force is zero.
        (c) The forward force now exceeds the backward forces, so the car speeds up. As its speed rises, air resistance grows until the backward forces again equal the new forward force; then ΣF = 0 and the car cruises at a new, higher constant speed.
      explanation: |
        Three points, one per part. (a) a forward force from the road and at least one backward resistive force. (b) rejects the claim with "constant velocity means net force zero" and distinguishes a forward force from a forward net force. (c) the car speeds up, with the reason that drag increases with speed until the forces balance again. Saying the engine itself pushes the car is accepted in (a) only if the backward forces are also named.
