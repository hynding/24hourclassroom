      type: long_answer
      topic_code: "2.4"
      source: "AP Physics 1 CED, Topic 2.4"
      points: 6
      prompt: |
        A 2.0 kg hanging plant is held at rest by two light cords tied to a ceiling. Cord 1 makes an angle of 35° above the horizontal and pulls up and to the left; cord 2 makes an angle of 55° above the horizontal and pulls up and to the right.

        (A) Describe in words the free-body diagram of the plant.

        (B) Without calculating, predict which cord has the greater tension. Justify your prediction in a few sentences using the horizontal components of the forces.

        (C) Write the two equilibrium equations (horizontal and vertical) for the plant in terms of T₁, T₂, m and g.

        (D) Solve for T₁ and T₂.

        (E) Explain whether your answers to (D) agree with your prediction in (B).
      answer: |
        (A) A dot with a downward arrow F_g = mg (Earth on plant), an arrow T₁ (cord 1 on plant) up and to the left at 35° above the horizontal, and an arrow T₂ (cord 2 on plant) up and to the right at 55° above the horizontal.
        (B) Cord 2 has the greater tension. The plant is at rest, so the horizontal components must be equal: T₁ cos 35° = T₂ cos 55°. Cord 2 is steeper, so cos 55° is smaller than cos 35°, and T₂ must be larger to give the same horizontal component. Equivalently, the steeper cord is closer to vertical and carries more of the weight.
        (C) Horizontal: T₂ cos 55° − T₁ cos 35° = 0. Vertical: T₁ sin 35° + T₂ sin 55° − mg = 0.
        (D) From the horizontal equation T₂ = T₁ (0.819/0.574) = 1.43 T₁. Substituting: 0.574 T₁ + 0.819(1.43 T₁) = 19.6, so 1.745 T₁ = 19.6, T₁ ≈ 11.2 N and T₂ ≈ 16.1 N.
        (E) Yes: T₂ ≈ 16.1 N is larger than T₁ ≈ 11.2 N, as predicted from the horizontal components.
      explanation: |
        Six points (qualitative/quantitative translation style).
        (A) 1 point: three forces with correct directions and labels; no extra forces.
        (B) 2 points: 1 for choosing cord 2; 1 for reasoning from equal horizontal components (or "closer to vertical carries more weight"). A claim with no reasoning earns at most 1 point.
        (C) 1 point: both equations with correct trigonometric functions and signs.
        (D) 1 point: T₁ ≈ 11 N and T₂ ≈ 16 N (accept 11.0–11.4 N and 15.8–16.3 N), with units.
        (E) 1 point: an explicit comparison that refers back to the prediction. If (B) predicted the wrong cord, earning this point requires saying the calculation contradicts it and why.
