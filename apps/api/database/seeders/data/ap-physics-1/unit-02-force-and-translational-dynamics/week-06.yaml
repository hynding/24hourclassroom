week: 6
unit: 2
title: "Newton's Third Law and Newton's First Law"
topics: ["2.3", "2.4"]
guide: guides/week-06.md
guide_description: |
  Interactions and third-law pairs (equal in size, opposite in direction, same type, on different objects), why
  partners never cancel and how they differ from two forces that balance on one object, Newton's first law and
  translational equilibrium (at rest or at constant velocity), solving ΣFₓ = 0 and ΣF_y = 0 with components, and
  inertial reference frames. Worked examples: the forces on a book on a table and their partners, the equal
  forces in a car–truck collision, a 3.0 kg lamp on two cords at 30° and 60° (14.7 N and 25.5 N), why a
  clothesline must sag (T = mg/(2 sin θ), with limiting cases), and a skydiver at terminal speed (686 N).
flashcards_description: |
  30 cards on Newton's third law (naming partners, same type and different objects, collisions, tug of war,
  common traps) and Newton's first law (constant velocity and zero net force, equilibrium with angled ropes and
  cables, terminal speed, inertial and non-inertial reference frames).

flashcards:
  - front: Newton's third law for an interaction between A and B → full statement
    back: |
      The force of A on B and the force of B on A are equal in magnitude, opposite in direction, of the same type, and act on different objects, at the same time.
    topic_code: "2.3"
  - front: Naming a third-law partner → the swap rule
    back: |
      Swap the two objects in the label. Partner of "rope pulls sled" is "sled pulls rope"; partner of "Earth pulls apple" is "apple pulls Earth".
    topic_code: "2.3"
  - front: Third-law partners on one free-body diagram → can they cancel?
    back: |
      No. Partners act on different objects, so they never appear on the same FBD and never add to zero for one object.
    topic_code: "2.3"
  - front: Book at rest on a table, F_g and F_N → are they a third-law pair?
    back: |
      No. Both act on the book and they are different types (gravitational, normal). They balance only because the book is in equilibrium; press on the book and F_N grows while F_g does not.
    topic_code: "2.3"
  - front: Partner of the gravitational force of Earth on a falling apple → what and where
    back: |
      The gravitational force of the apple on Earth: same size (about 1 N for a 100 g apple), upward, acting on Earth.
    topic_code: "2.3"
  - front: Partner of the floor's normal force on a crate → what and where
    back: |
      The crate's normal force on the floor: same size, downward, acting on the floor. A normal force's partner is always a normal force.
    topic_code: "2.3"
  - front: Car (1,200 kg) and truck (9,000 kg) collide head-on → which force is larger?
    back: |
      Neither: the two forces of the interaction are equal in size. The car's velocity changes 7.5 times as much because its mass is 7.5 times smaller.
    topic_code: "2.3"
  - front: Walking forward → which force pushes you forward
    back: |
      Your shoe pushes backward on the ground (friction); the ground's partner force pushes forward on your shoe and moves you.
    topic_code: "2.3"
  - front: Tug of war with equal rope forces → how one team wins
    back: |
      Each team feels the rope pull and a ground push. The team that pushes harder backward on the ground gets the larger forward ground force, so its net force points its way.
    topic_code: "2.3"
  - front: Rocket in empty space → what pushes it forward
    back: |
      The rocket pushes exhaust gas backward; the gas pushes the rocket forward. No air or ground is needed.
    topic_code: "2.3"
  - front: Hammer drives nail with 500 N → force of nail on hammer
    back: |
      500 N, in the opposite direction. That backward force is what stops the hammer head.
    topic_code: "2.3"
  - front: Newton's first law → statement in terms of velocity
    back: |
      An object's velocity stays constant (including zero) if and only if the net external force on it is zero.
    topic_code: "2.4"
  - front: '"At rest" and "constant velocity" in dynamics → why they are the same problem'
    back: |
      Both mean ΣF = 0 (translational equilibrium). Solve ΣFₓ = 0 and ΣF_y = 0 in either case.
    topic_code: "2.4"
  - front: Hockey puck sliding on frictionless ice → net force
    back: |
      Zero: F_g and F_N balance and nothing pushes horizontally. It keeps moving because nothing changes its velocity.
    topic_code: "2.4"
  - front: Inertia → what it is and what measures it
    back: |
      The tendency of an object to keep its velocity. Mass measures it: more mass, more force needed for the same change in velocity.
    topic_code: "2.4"
  - front: Equilibrium routine with angled ropes → four steps
    back: |
      Draw the FBD; choose axes and resolve angled forces; write ΣFₓ = 0 and ΣF_y = 0; solve and check limiting cases.
    topic_code: "2.4"
  - front: Load hanging from the middle of a line, each half at θ above horizontal → tension
    back: |
      2T sin θ = mg, so T = mg/(2 sin θ). As θ → 0, T grows without limit; at θ = 90° each half holds mg/2.
    topic_code: "2.4"
  - front: 8.0 kg sign on two cables, each at 40° above horizontal → tension
    back: |
      T = 78.4/(2 sin 40°) ≈ 61 N per cable, more than the half-weight of 39.2 N because only the vertical component supports the sign.
    topic_code: "2.4"
  - front: 3.0 kg lamp on cords at 30° and 60° above horizontal → tensions
    back: |
      T(30°) = 14.7 N and T(60°) ≈ 25.5 N; the steeper cord carries more of the weight.
    topic_code: "2.4"
  - front: Unequal cords holding a load → which carries more tension
    back: |
      The one closer to vertical (larger angle above horizontal): horizontal components must match, and a steeper cord has the smaller cosine.
    topic_code: "2.4"
  - front: 70 kg skydiver at a steady 55 m/s → air resistance force
    back: |
      Constant velocity means ΣF = 0, so F_air = mg = 686 N upward. The speed does not enter the answer.
    topic_code: "2.4"
  - front: Terminal speed → why a falling object stops speeding up
    back: |
      Air resistance grows with speed until it equals the weight; then ΣF = 0 and the velocity stays constant.
    topic_code: "2.4"
  - front: Elevator moving up at constant speed, 55 kg rider → normal force
    back: |
      F_N = mg = 539 N, the same as at rest: constant velocity means zero net force, whichever way the elevator moves.
    topic_code: "2.4"
  - front: Crate pushed at constant velocity across a floor → friction force
    back: |
      Equal and opposite to the horizontal part of the push, because ΣFₓ = 0 at constant velocity.
    topic_code: "2.4"
  - front: Inertial reference frame → definition
    back: |
      A frame that is not accelerating. Newton's first law holds in it: an object with zero net force keeps a constant velocity.
    topic_code: "2.4"
  - front: Ball rolls backward on the floor of a train that is speeding up → explanation
    back: |
      The train is a non-inertial frame. In the ground frame no horizontal force acts on the ball, so it keeps its velocity while the train accelerates forward beneath it.
    topic_code: "2.4"
  - front: Train cruising smoothly at constant velocity → inertial or not?
    back: |
      Inertial. A frame moving at constant velocity relative to an inertial frame is inertial, so a ball on its floor stays put.
    topic_code: "2.4"
  - front: Error-spot → "the truck hits the car harder because it is heavier"
    back: |
      One interaction, two equal forces. The truck is affected less because its mass is larger, not because the force on it is smaller.
    topic_code: "2.3"
  - front: Error-spot → "the car moves at constant speed, so the engine's force must exceed the friction and drag"
    back: |
      At constant velocity ΣF = 0: the forward force equals the backward forces. A larger forward force would make the car speed up.
    topic_code: "2.4"
  - front: Error-spot → "the horse and cart can't move, because the cart pulls back as hard as the horse pulls forward"
    back: |
      Those two forces act on different objects. The cart moves because the horse's pull on it beats the friction on the cart; the horse moves because the ground's forward push beats the cart's pull on the horse.
    topic_code: "2.3"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 2.3 and 2.4: third-law pairs, collisions,
    equilibrium with angled ropes and cables, constant velocity and zero net force, terminal speed and inertial
    reference frames), with 8 questions (32%) reviewing weeks 1–5 (free fall, relative motion, motion graphs,
    projectiles, the center of mass and free-body diagrams). Opens with a shared-context set on a sign hung from
    two cables. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank
    items are matched automatically; the short answers and the long answer are graded by your teacher against the
    scoring notes. Use g = 9.8 m/s². Calculator and equation sheet allowed throughout, as on the AP exam.
  questions:
    # ---- Stimulus set: a sign on two cables (2.3, 2.4)
    - slug: apphys1-u02-w06-q01
      type: multiple_choice
      topic_code: "2.4"
      source: "AP Physics 1 CED, Topic 2.4"
      points: 1
      stimulus: |
        An 8.0 kg shop sign hangs at rest below a horizontal beam, supported by two light cables attached at its top corners. The setup is symmetric: each cable makes an angle of 40° above the horizontal, one pulling up and to the left, the other up and to the right.
      prompt: |
        What is the tension in each cable?
      options:
        - "39 N"
        - "61 N"
        - "51 N"
        - "78 N"
      option_explanations:
        - |
          39 N = mg/2 would be right if the cables hung straight up. At 40° only the vertical component T sin 40° supports the sign, so T must be larger.
        - |
          Correct. ΣF_y = 0: 2T sin 40° = mg = 78.4 N, so T = 78.4/(2 · 0.643) ≈ 61 N. The horizontal components cancel by symmetry.
        - |
          51 N = mg/(2 cos 40°) uses the cosine for the vertical component; with the angle measured from the horizontal, the vertical part is T sin θ.
        - |
          78 N assumes each cable supports the whole weight. The two cables share it, and the angle then raises each tension above half the weight.
      answer: 1
    - slug: apphys1-u02-w06-q02
      type: multiple_choice
      topic_code: "2.3"
      source: "AP Physics 1 CED, Topic 2.3"
      points: 1
      stimulus: |
        An 8.0 kg shop sign hangs at rest below a horizontal beam, supported by two light cables attached at its top corners. The setup is symmetric: each cable makes an angle of 40° above the horizontal, one pulling up and to the left, the other up and to the right.
      prompt: |
        What is the third-law partner of the force exerted by the left cable on the sign?
      options:
        - "The gravitational force exerted by Earth on the sign"
        - "The force exerted by the right cable on the sign"
        - "The force exerted by the beam on the left cable"
        - "The force exerted by the sign on the left cable"
      option_explanations:
        - |
          Earth's pull is a different interaction (gravitational, between Earth and the sign); it acts on the same object as the cable's force, so it cannot be its partner.
        - |
          The right cable's force also acts on the sign. It balances part of the left cable's horizontal pull, but balancing forces on one object are not a third-law pair.
        - |
          This force acts at the other end of the cable, in the cable–beam interaction. The partner must involve the same two objects: the left cable and the sign.
        - |
          Correct. Swap the objects: "left cable on sign" becomes "sign on left cable". It is equal in size (61 N), opposite in direction and also a tension force.
      answer: 3
    - slug: apphys1-u02-w06-q03
      type: multiple_choice
      topic_code: "2.4"
      source: "AP Physics 1 CED, Topic 2.4"
      points: 1
      stimulus: |
        An 8.0 kg shop sign hangs at rest below a horizontal beam, supported by two light cables attached at its top corners. The setup is symmetric: each cable makes an angle of 40° above the horizontal, one pulling up and to the left, the other up and to the right.
      prompt: |
        The owner replaces the cables with longer ones attached closer together on the beam, so that each cable now makes 60° above the horizontal. How does the tension in each cable change?
      options:
        - "It increases, because the cables are longer."
        - "It stays the same, because the sign's weight has not changed."
        - "It decreases, because each cable is closer to vertical and its vertical component is a larger share of its tension."
        - "It decreases to exactly half the weight, 39 N."
      option_explanations:
        - |
          The cable length does not appear in T = mg/(2 sin θ); only the angle matters, and a larger angle gives a smaller tension.
        - |
          The weight is the same, but the tension depends on the angle as well: T = mg/(2 sin θ).
        - |
          Correct. T = mg/(2 sin θ); sin 60° = 0.866 is larger than sin 40° = 0.643, so T falls from about 61 N to 78.4/1.732 ≈ 45 N.
        - |
          Half the weight is the limit at θ = 90° (vertical cables). At 60° the tension is about 45 N, still above 39 N.
      answer: 2
    # ---- Newton's third law (2.3)
    - slug: apphys1-u02-w06-q04
      type: multiple_choice
      topic_code: "2.3"
      source: "AP Physics 1 CED, Topic 2.3"
      points: 1
      prompt: |
        A 1,200 kg car and a 9,000 kg delivery truck collide head-on. During the collision the truck exerts a force of magnitude F on the car. What is the magnitude of the force the car exerts on the truck?
      options:
        - "F"
        - "F/7.5"
        - "7.5F"
        - "Zero, because the truck is much heavier than the car"
      option_explanations:
        - |
          Correct. The two forces are the two halves of one interaction, so by Newton's third law they are equal in magnitude and opposite in direction, whatever the masses.
        - |
          Dividing by the mass ratio confuses force with the change in velocity. The truck's velocity changes 7.5 times less, but the force on it is the same F.
        - |
          The lighter car does not push harder. One interaction always produces two forces of equal size.
        - |
          Any contact between the two produces a force on each. A heavier object still feels the full partner force.
      answer: 0
    - slug: apphys1-u02-w06-q05
      type: multiple_choice
      topic_code: "2.3"
      source: "AP Physics 1 CED, Topic 2.3"
      points: 1
      prompt: |
        A water bottle rests on a desk. Earth exerts a downward gravitational force on the bottle. What is the third-law partner of this force?
      options:
        - "The upward normal force exerted by the desk on the bottle"
        - "The downward normal force exerted by the bottle on the desk"
        - "The upward gravitational force exerted by the bottle on Earth"
        - "The upward normal force exerted by the floor on the desk"
      option_explanations:
        - |
          This force balances gravity on the bottle, but it acts on the same object and is a different type (normal, not gravitational), so it is not the partner.
        - |
          This is the partner of the desk's normal force on the bottle, not of Earth's gravitational pull.
        - |
          Correct. Swap the objects: "Earth pulls bottle down" becomes "bottle pulls Earth up". Same type (gravitational), same size, opposite direction, acting on Earth.
        - |
          The floor's push on the desk involves neither Earth's gravity nor the bottle; it is part of a different interaction.
      answer: 2
    # ---- Newton's first law (2.4)
    - slug: apphys1-u02-w06-q06
      type: multiple_choice
      topic_code: "2.4"
      source: "AP Physics 1 CED, Topic 2.4"
      points: 1
      prompt: |
        A 70 kg skydiver has reached a steady downward speed of 55 m/s. What is the magnitude of the air-resistance force on the skydiver?
      options:
        - "70 N"
        - "Less than 686 N, since otherwise the skydiver would stop"
        - "More than 686 N, since the skydiver is moving fast"
        - "686 N"
      option_explanations:
        - |
          70 is the mass in kilograms, not a force. The weight is mg = 686 N.
        - |
          If the upward drag were smaller than the weight, the net force would be downward and the skydiver would still be speeding up.
        - |
          A drag force larger than the weight would give an upward net force and slow the skydiver down; at a steady speed the forces balance.
        - |
          Correct. Constant velocity means ΣF = 0 (first law), so F_air = mg = 70 · 9.8 = 686 N upward. The 55 m/s does not enter the calculation.
      answer: 3
    - slug: apphys1-u02-w06-q07
      type: multiple_choice
      topic_code: "2.4"
      source: "AP Physics 1 CED, Topic 2.4"
      points: 1
      prompt: |
        A hockey puck slides across a sheet of ice in a straight line at constant speed. Friction and air resistance are negligible. Which statement is correct?
      options:
        - "A forward force must act on the puck to keep it moving."
        - "The net force on the puck is zero."
        - "The net force on the puck points forward but is decreasing."
        - "No forces at all act on the puck."
      option_explanations:
        - |
          Motion does not require a force; only changes in velocity do. Nothing touches the puck horizontally, so there is no forward force.
        - |
          Correct. The velocity is constant, so by the first law the net force is zero: F_g down and F_N up balance, and no horizontal force acts.
        - |
          A forward net force of any size would make the puck speed up; its speed is constant.
        - |
          Gravity and the normal force from the ice still act; they just add to zero.
      answer: 1
    - slug: apphys1-u02-w06-q08
      type: multiple_choice
      topic_code: "2.4"
      source: "AP Physics 1 CED, Topic 2.4"
      points: 1
      prompt: |
        A ball sits on the smooth floor of a train car. The train starts to speed up forward, and a passenger sees the ball roll toward the back of the car. Which is the best explanation?
      options:
        - "No horizontal force acts on the ball; it keeps its velocity relative to the ground while the train, a non-inertial frame, accelerates forward beneath it."
        - "A backward force on the ball, caused by the train's acceleration, pushes it toward the back."
        - "The floor exerts a backward friction force that rolls the ball backward."
        - "The ball's inertia is a force that acts backward whenever the train speeds up."
      option_explanations:
        - |
          Correct. In the ground (inertial) frame the ball simply keeps its velocity; the train speeds up under it. The passenger's frame is accelerating, so the first law appears to fail there.
        - |
          No object exerts such a force, so it is not a real force. The apparent push exists only in the accelerating frame.
        - |
          The floor is described as smooth, and a backward friction force would need a reason; the motion is explained with no horizontal force at all.
        - |
          Inertia is a property (measured by mass), not a force. It describes the ball keeping its velocity.
      answer: 0
    - slug: apphys1-u02-w06-q09
      type: multiple_choice
      topic_code: "2.4"
      source: "AP Physics 1 CED, Topic 2.4"
      points: 1
      prompt: |
        A 55 kg student rides in an elevator that is moving upward at a constant 2.0 m/s. What is the magnitude of the normal force the floor exerts on her?
      options:
        - "More than 539 N, because the elevator is moving up"
        - "Less than 539 N, because the elevator carries her up"
        - "539 N"
        - "110 N"
      option_explanations:
        - |
          Moving up is not the same as speeding up. At constant velocity the net force is zero, so the normal force equals her weight.
        - |
          The elevator floor is the only thing supporting her against gravity; at constant velocity it must push with exactly her weight.
        - |
          Correct. Constant velocity means ΣF = 0, so F_N = mg = 55 · 9.8 = 539 N, the same as when the elevator is at rest.
        - |
          110 N = 55 · 2.0 multiplies the mass by the speed, which is not a force. The speed does not matter when it is constant.
      answer: 2
    - slug: apphys1-u02-w06-q10
      type: multiple_choice
      topic_code: "2.4"
      source: "AP Physics 1 CED, Topic 2.4"
      points: 1
      prompt: |
        A student pushes a 20 kg crate across a floor at constant velocity by pushing with 150 N directed 30° below the horizontal. What is the magnitude of the friction force the floor exerts on the crate?
      options:
        - "150 N"
        - "130 N"
        - "75 N"
        - "271 N"
      option_explanations:
        - |
          Only the horizontal component of the push is balanced by friction; 150 N is the whole push, part of which is directed downward.
        - |
          Correct. At constant velocity ΣFₓ = 0, so F_f = 150 cos 30° ≈ 130 N.
        - |
          75 N = 150 sin 30° is the downward component of the push, which adds to the normal force; it is not the horizontal component.
        - |
          271 N = 20 · 9.8 + 150 sin 30° is the normal force, not the friction force.
      answer: 1
    # ---- Spiral review
    - slug: apphys1-u02-w06-q11
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Physics 1 CED, Topic 2.2"
      points: 1
      prompt: |
        A 6.0 kg box is held at rest on a smooth ramp inclined at 25° by a rope parallel to the ramp. What is the magnitude of the normal force exerted by the ramp on the box?
      options:
        - "58.8 N"
        - "24.8 N"
        - "6.0 N"
        - "53.3 N"
      option_explanations:
        - |
          58.8 N = mg is the normal force on level ground. On a ramp the surface pushes only against the perpendicular component of gravity.
        - |
          24.8 N = mg sin 25° is the component of gravity along the ramp, which the rope balances; it is not the normal force.
        - |
          6.0 is the mass in kilograms, not a force in newtons.
        - |
          Correct. With tilted axes the perpendicular balance is F_N = mg cos 25° = 6.0 · 9.8 · 0.906 ≈ 53.3 N.
      answer: 3
    - slug: apphys1-u02-w06-q12
      type: multiple_choice
      topic_code: "2.1"
      source: "AP Physics 1 CED, Topic 2.1"
      points: 1
      prompt: |
        Two ice skaters stand at rest 4.0 m apart: a 50 kg skater at x = 0 and a 75 kg skater at x = 4.0 m. They push off each other. Where is the center of mass of the two-skater system before the push, and where is it 1.0 s after the push?
      options:
        - "At x = 2.4 m before, and still at x = 2.4 m after"
        - "At x = 2.0 m before, and still at x = 2.0 m after"
        - "At x = 2.4 m before, then moving toward the lighter skater"
        - "At x = 1.6 m before, and still at x = 1.6 m after"
      option_explanations:
        - |
          Correct. x_cm = (50 · 0 + 75 · 4.0)/125 = 2.4 m. The pushes are internal to the two-skater system, so with negligible friction the center of mass stays at 2.4 m.
        - |
          2.0 m is the midpoint, which ignores the different masses; the center of mass is closer to the heavier skater.
        - |
          The lighter skater does move faster, but internal forces cannot move the system's center of mass.
        - |
          1.6 m is the distance from the heavier skater, measured from the wrong end: (50 · 4.0)/125. With the 75 kg skater at x = 4.0 m, x_cm = 2.4 m.
      answer: 0
    - slug: apphys1-u02-w06-q13
      type: multiple_choice
      topic_code: "1.5"
      source: "AP Physics 1 CED, Topic 1.5"
      points: 1
      prompt: |
        A basketball is shot at an angle above the horizontal. Air resistance is negligible. At the highest point of its path, which describes its velocity and acceleration?
      options:
        - "Velocity zero, acceleration zero"
        - "Velocity zero, acceleration 9.8 m/s² downward"
        - "Velocity horizontal and not zero, acceleration 9.8 m/s² downward"
        - "Velocity horizontal and not zero, acceleration zero"
      option_explanations:
        - |
          Only the vertical velocity is zero at the top; the horizontal velocity never changes. And gravity keeps acting, so the acceleration is not zero.
        - |
          The vertical component is zero at the top, but the horizontal component is not, so the velocity is not zero.
        - |
          Correct. The vertical velocity is momentarily zero, leaving the unchanged horizontal velocity; gravity still gives a downward acceleration of 9.8 m/s² throughout the flight.
        - |
          Confusing velocity with acceleration: gravity acts at every point, so the acceleration is 9.8 m/s² downward even at the top.
      answer: 2
    - slug: apphys1-u02-w06-q14
      type: multi_select
      topic_code: "2.3"
      source: "AP Physics 1 CED, Topic 2.3"
      points: 2
      partial_credit: true
      prompt: |
        Which pairs of forces are Newton's third-law pairs? Select all that apply.
      options:
        - "A swimmer's hands push backward on the water; the water pushes forward on the swimmer's hands."
        - "Earth pulls down on a hanging lamp; the cord pulls up on the lamp."
        - "A bat exerts a force on a baseball; the baseball exerts a force on the bat."
        - "A table pushes up on a cup; Earth pulls down on the cup."
        - "The Moon pulls on Earth; Earth pulls on the Moon."
      option_explanations:
        - |
          Correct. One interaction between hands and water; the forces act on different objects and are the same type (contact forces), equal and opposite.
        - |
          Both forces act on the lamp and they are different types (gravitational and tension). They balance because the lamp is at rest, which is the first law, not the third.
        - |
          Correct. The bat–ball interaction produces equal and opposite contact forces on the ball and on the bat.
        - |
          Both act on the cup, and one is a normal force while the other is gravitational, so they are not partners.
        - |
          Correct. The gravitational interaction between Earth and the Moon gives equal and opposite gravitational forces, one on each body.
      answer: [0, 2, 4]
    - slug: apphys1-u02-w06-q15
      type: multi_select
      topic_code: "2.2"
      source: "AP Physics 1 CED, Topic 2.2"
      points: 2
      partial_credit: true
      prompt: |
        A child sits still on a playground swing; the swing seat hangs from two chains. Which forces belong on the free-body diagram of the child (the child alone is the system)? Select all that apply.
      options:
        - "The tension force exerted by the chains on the child"
        - "The gravitational force exerted by Earth on the child"
        - "The normal force exerted by the seat on the child"
        - "The gravitational force exerted by the child on Earth"
        - "The tension force exerted by the chains on the seat"
      option_explanations:
        - |
          The chains attach to the seat, not to the child (unless the child holds them; here the child is simply sitting), so their pull acts on the seat.
        - |
          Correct. Earth exerts a gravitational force on the child, straight down.
        - |
          Correct. The seat touches the child and pushes up on the child, perpendicular to the seat.
        - |
          This force acts on Earth, not on the child. It is the partner of the child's weight.
        - |
          This force acts on the seat, which is outside the system "child alone".
      answer: [1, 2]
    - slug: apphys1-u02-w06-q16
