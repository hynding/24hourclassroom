    - slug: apphys1-u02-w08-q23
      type: short_answer
      topic_code: "2.6"
      source: "AP Physics 1 CED, Topic 2.6"
      points: 3
      prompt: |
        A student claims: "A bowling ball falls faster than a tennis ball, because Earth pulls on the bowling ball with a much bigger force."

        (a) Is the student right that Earth exerts a larger force on the bowling ball? Explain using the law of universal gravitation.
        (b) Use Newton's second law to explain why, with air resistance negligible, both balls nevertheless fall with the same acceleration.
        (c) What experimental fact about mass does your argument in (b) rely on?
      answer: |
        (a) Yes. F_g = GM_E m/R_E² = mg is proportional to the ball's mass, so the more massive bowling ball feels a proportionally larger gravitational force.
        (b) a = ΣF/m = mg/m = g. The bowling ball's larger force is exactly offset by its larger inertia (mass), so both balls accelerate at 9.8 m/s² and, dropped together, land together.
        (c) That gravitational mass (the m in F_g = mg) equals inertial mass (the m in a = ΣF/m). Experiments confirm this to very high precision.
      explanation: |
        Three points, one per part. (a) agrees the force is larger, with the proportionality to m from the gravitation law. (b) shows the mass cancels in a = mg/m, giving the same acceleration g. (c) names the equality of gravitational and inertial mass. Saying "gravity pulls all objects equally" in (a) contradicts F_g = mg and loses that point.
    - slug: apphys1-u02-w08-q24
      type: short_answer
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 3
      prompt: |
        A 50 kg student rides an elevator from the ground floor to the top floor, standing on a scale. Her readings in three stages are:

        | Stage | 1 (starting) | 2 (middle) | 3 (arriving) |
        |---|---|---|---|
        | Scale reading (N) | 560 | 490 | 430 |

        (a) Find the magnitude and direction of the elevator's acceleration in each stage.
        (b) Describe the elevator's motion in each stage (speeding up, constant velocity or slowing down), given that it travels upward throughout.
        (c) At what acceleration would the scale read zero, and what would that mean for the student?
      answer: |
        (a) Up positive, F_N − mg = ma with mg = 490 N. Stage 1: a = (560 − 490)/50 = 1.4 m/s² upward. Stage 2: a = 0. Stage 3: a = (430 − 490)/50 = −1.2 m/s², i.e. 1.2 m/s² downward.
        (b) Stage 1: speeding up while moving upward. Stage 2: moving upward at constant velocity. Stage 3: slowing down while still moving upward, as it arrives at the top floor.
        (c) F_N = 0 when a = −g, 9.8 m/s² downward: free fall. The student would be apparently weightless, still pulled by gravity with 490 N but with nothing pushing on her.
      explanation: |
        Three points, one per part. (a) all three accelerations with directions (accept 1.4, 0 and 1.2 m/s²). (b) all three stages described correctly, linking the direction of acceleration to speeding up or slowing down for upward motion. (c) a = g downward, with "apparent weightlessness" or the equivalent idea that gravity still acts but the normal force is zero.
    - slug: apphys1-u02-w08-q25
      type: long_answer
      topic_code: "2.6"
      source: "AP Physics 1 CED, Topic 2.6"
      points: 6
      prompt: |
        Planet Y has four times Earth's mass and twice Earth's radius. A space agency plans to land a probe that weighs 1,200 N on Earth's surface.

        (A) Without using equations, write a few sentences predicting whether the gravitational field at Planet Y's surface is larger than, smaller than or equal to the field at Earth's surface. Your argument should address both the larger mass and the larger radius.

        (B) Starting from g = GM/R², derive an expression for g_Y in terms of g_E (the field at Earth's surface).

        (C) Calculate the probe's mass and its weight on Planet Y.

        (D) Explain whether your result in (B) is consistent with your prediction in (A). If it is not, say which part of your reasoning in (A) was wrong.
      answer: |
        (A) A larger mass makes gravity stronger: more mass pulls harder on an object at the same distance. A larger radius puts the surface farther from the planet's center, which weakens gravity, and because gravity weakens with the square of the distance, doubling the radius has a large effect. The two effects compete; since gravity falls with the square of distance, doubling the radius cuts the field by a factor of four, which exactly offsets four times the mass, so the fields should be equal.
        (B) g_Y = G(4M_E)/(2R_E)² = 4GM_E/(4R_E²) = GM_E/R_E² = g_E.
        (C) Mass m = 1,200/9.8 ≈ 122 kg (the same everywhere). Weight on Planet Y = m g_Y = 122 · 9.8 ≈ 1,200 N, the same as on Earth.
        (D) Yes: the derivation gives g_Y = g_E, as predicted by weighing the two competing effects with the inverse square. (If the prediction had been "larger, because the planet is more massive", the error was ignoring how strongly the larger radius weakens the field.)
      explanation: |
        Six points (qualitative/quantitative translation style).
        (A) 2 points: 1 for addressing both effects (mass strengthens, radius weakens) in words; 1 for a prediction that uses the inverse-square dependence to weigh them. A prediction of "larger" or "smaller" can still earn the first point.
        (B) 2 points: 1 for substituting 4M_E and 2R_E correctly (with the radius squared); 1 for simplifying to g_Y = g_E.
        (C) 1 point: mass ≈ 122 kg and weight ≈ 1,200 N on Planet Y, both with units.
        (D) 1 point: a comparison that refers explicitly to (A) and (B); if (A) was inconsistent, the point requires identifying the faulty step.
