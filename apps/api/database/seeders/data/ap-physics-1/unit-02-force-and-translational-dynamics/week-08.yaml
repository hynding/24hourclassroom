week: 8
unit: 2
title: "Gravitational Force"
topics: ["2.6"]
guide: guides/week-08.md
guide_description: |
  Newton's law of universal gravitation F_g = Gm₁m₂/r² (center-to-center distance, third-law pairs,
  inverse-square functional dependence), the gravitational field g = GM/r² and why it is nearly uniform near
  Earth's surface, comparing planets by ratios, weight versus apparent weight and apparent weightlessness in free
  fall, and the equality of gravitational and inertial mass. Worked examples: the tiny pull between two 70 kg
  students (3.3 × 10⁻⁷ N), the Earth–Moon force (2.0 × 10²⁰ N on each), the field at a space station 400 km up
  (8.7 N/kg) and why astronauts float, an imaginary planet with twice Earth's mass and radius (4.9 N/kg), and a
  moon's g (1.62 m/s²) and mass from a lander's drop data graphed as d against t².
flashcards_description: |
  31 cards on gravitational force: the universal law and its constant, ratio changes with mass and distance,
  the gravitational field at the surface and at altitude, surface gravity on other bodies, weight and apparent
  weight, weightlessness in free fall and in orbit, equal gravitational and inertial mass, and linearising
  drop data to measure g.

flashcards:
  - front: Newton's law of universal gravitation → formula and meaning of r
    back: |
      F_g = Gm₁m₂/r², attractive, along the line joining the centers; r is the center-to-center distance (for spheres, not the surface gap).
    topic_code: "2.6"
  - front: Universal gravitational constant G → value and units
    back: |
      G = 6.67 × 10⁻¹¹ N·m²/kg². It is tiny, which is why gravity between everyday objects is unnoticeable.
    topic_code: "2.6"
  - front: Gravitational force between a planet and a pebble → which is larger, the force on the planet or on the pebble?
    back: |
      Neither: the two forces are a third-law pair, equal in size and opposite in direction. The pebble's acceleration is enormously larger because its mass is tiny.
    topic_code: "2.6"
  - front: Distance between two masses doubled → gravitational force
    back: |
      One quarter as large (inverse square: 1/2² = 1/4).
    topic_code: "2.6"
  - front: Distance between two masses tripled → gravitational force
    back: |
      One ninth as large (1/3² = 1/9).
    topic_code: "2.6"
  - front: Distance between two masses halved → gravitational force
    back: |
      Four times as large (1/(1/2)² = 4).
    topic_code: "2.6"
  - front: Both masses doubled, distance unchanged → gravitational force
    back: |
      Four times as large: the force is proportional to the product m₁m₂.
    topic_code: "2.6"
  - front: One mass doubled and distance doubled → gravitational force
    back: |
      Half as large: × 2 from the mass, × 1/4 from the distance.
    topic_code: "2.6"
  - front: Two 70 kg students 1.0 m apart → gravitational force between them
    back: |
      (6.67 × 10⁻¹¹)(70)(70)/1.0² ≈ 3.3 × 10⁻⁷ N, about two billion times smaller than either student's weight.
    topic_code: "2.6"
  - front: Earth–Moon gravitational force → size
    back: |
      About 2.0 × 10²⁰ N on each body (M_E = 5.97 × 10²⁴ kg, M_Moon = 7.35 × 10²² kg, r = 3.84 × 10⁸ m).
    topic_code: "2.6"
  - front: Gravitational field → definition and units
    back: |
      g = F_g/m, the gravitational force per unit mass at a location; units N/kg, which equal m/s².
    topic_code: "2.6"
  - front: Field strength at distance r from a planet's center → formula
    back: |
      g = GM/r², where M is the planet's mass. It depends on the planet and the location, not on the object placed there.
    topic_code: "2.6"
  - front: Earth's surface field from G, M_E and R_E → calculation
    back: |
      g = (6.67 × 10⁻¹¹)(5.97 × 10²⁴)/(6.37 × 10⁶)² ≈ 9.8 N/kg.
    topic_code: "2.6"
  - front: Why g is treated as constant near Earth's surface
    back: |
      A height change of a few hundred metres is tiny compared with R_E = 6.37 × 10⁶ m, so r and therefore GM/r² barely change.
    topic_code: "2.6"
  - front: Field at a space station 4.0 × 10⁵ m above Earth's surface → value
    back: |
      r = 6.77 × 10⁶ m, g = GM_E/r² ≈ 8.7 N/kg, about 89% of the surface value: far from zero.
    topic_code: "2.6"
  - front: Field at 2R_E from Earth's center → value
    back: |
      One quarter of the surface value: 9.8/4 ≈ 2.5 N/kg.
    topic_code: "2.6"
  - front: Planet with twice Earth's mass and twice Earth's radius → surface g
    back: |
      g = 9.8 · 2/2² = 4.9 N/kg: the radius enters squared, so a bigger, heavier planet can have weaker surface gravity.
    topic_code: "2.6"
  - front: Planet with Earth's mass and half Earth's radius → surface g
    back: |
      g = 9.8 · 2² ≈ 39 N/kg, four times Earth's.
    topic_code: "2.6"
  - front: Surface g ratio for any planet → formula
    back: |
      g_planet/g_Earth = (M_planet/M_E) · (R_E/R_planet)².
    topic_code: "2.6"
  - front: 60 kg astronaut on the Moon (g = 1.62 N/kg) → mass and weight
    back: |
      Mass 60 kg (unchanged anywhere); weight 60 · 1.62 ≈ 97 N, compared with 588 N on Earth.
    topic_code: "2.6"
  - front: Weight versus apparent weight → the difference
    back: |
      Weight is the gravitational force mg. Apparent weight is the normal force (scale reading) from whatever supports you; it differs from mg when you accelerate vertically.
    topic_code: "2.6"
  - front: Elevator whose cable snaps (free fall) → scale reading
    back: |
      Zero. Rider and scale both accelerate at g, so the scale exerts no force: apparent weightlessness. The rider's true weight is unchanged.
    topic_code: "2.6"
  - front: Astronauts floating in an orbiting station → the real reason
    back: |
      They and the station are in free fall together with gravity the only force, so nothing pushes on them. Gravity is still about 8.7 N/kg there.
    topic_code: "2.6"
  - front: Inertial mass versus gravitational mass → what experiments show
    back: |
      They are equal. Inertial mass sets the response a = ΣF/m; gravitational mass sets the pull F_g = mg. Equal masses mean the m cancels.
    topic_code: "2.6"
  - front: Hammer and feather dropped on the airless Moon → which lands first
    back: |
      Neither: they land together, because a = F_g/m = g for any mass when gravitational and inertial mass are equal and there is no air.
    topic_code: "2.6"
  - front: Drop from rest, distance d and time t measured → what to graph for a straight line
    back: |
      d against t²: d = ½gt² makes it a line through the origin with slope g/2, so g = 2 × slope.
    topic_code: "2.6"
  - front: Moon lander drop data with d–t² slope 0.81 m/s² → g
    back: |
      g = 2 × 0.81 ≈ 1.62 m/s².
    topic_code: "2.6"
  - front: Planet's mass from measured surface g and radius → formula
    back: |
      M = gR²/G, from rearranging g = GM/R².
    topic_code: "2.6"
  - front: Error-spot → "at the space station there is no gravity, so g = 0"
    back: |
      g = GM/r² is about 8.7 N/kg there. The astronauts' apparent weight is zero because they are in free fall, not because gravity has vanished.
    topic_code: "2.6"
  - front: Error-spot → "g at altitude h is GM/h²"
    back: |
      r is measured from the planet's center: r = R + h. Using h alone gives an absurdly large field near the surface.
    topic_code: "2.6"
  - front: Error-spot → "doubling the distance halves the gravitational force"
    back: |
      The force follows an inverse square: doubling r makes it one quarter, not one half.
    topic_code: "2.6"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topic 2.6: the law of universal gravitation, ratio and
    inverse-square reasoning, the gravitational field at the surface and at altitude, other planets, weight and
    apparent weight, weightlessness and the equivalence of gravitational and inertial mass), with 8 questions (32%)
    reviewing weeks 4–7 (projectiles, the center of mass, free-body diagrams, equilibrium and Newton's second law).
    Opens with a shared-context set on a probe's drop experiment on another planet. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short
    answers and the long answer are graded by your teacher against the scoring notes. Use g = 9.8 m/s² near Earth
    and G = 6.67 × 10⁻¹¹ N·m²/kg². Calculator and equation sheet allowed throughout, as on the AP exam.
  questions:
    # ---- Stimulus set: a drop experiment on Planet X (2.6)
    - slug: apphys1-u02-w08-q01
      type: multiple_choice
      topic_code: "2.6"
      source: "AP Physics 1 CED, Topic 2.6"
      points: 1
      stimulus: |
        A robotic probe lands on Planet X, which has no atmosphere and a radius of 3.4 × 10⁶ m. It drops a small sample from rest and its camera records how far the sample has fallen at five times (invented data):

        | t (s) | 0.50 | 1.00 | 1.50 | 2.00 | 2.50 |
        |---|---|---|---|---|---|
        | d (m) | 0.46 | 1.86 | 4.15 | 7.42 | 11.5 |
      prompt: |
        A student wants to graph the data so that the points fall on a straight line whose slope gives the gravitational field at the surface of Planet X. What should she graph?
      options:
        - "d against t, because the sample falls at a steady rate"
        - "t against d, because time depends on distance"
        - "d against 1/t², because gravity follows an inverse square law"
        - "d against t², because d = ½gt² for a drop from rest"
      option_explanations:
        - |
          The sample speeds up, so d grows faster than t and d against t is a curve, not a line.
        - |
          Swapping the axes of a curve still gives a curve; t is proportional to √d, not to d.
        - |
          The inverse square law concerns distance from the planet's center, not the time of fall; d against 1/t² is not a straight line.
        - |
          Correct. From rest with constant acceleration, d = ½gt², so d against t² is a straight line through the origin with slope g/2.
      answer: 3
    - slug: apphys1-u02-w08-q02
      type: multiple_choice
      topic_code: "2.6"
      source: "AP Physics 1 CED, Topic 2.6"
      points: 1
      stimulus: |
        A robotic probe lands on Planet X, which has no atmosphere and a radius of 3.4 × 10⁶ m. It drops a small sample from rest and its camera records how far the sample has fallen at five times (invented data):

        | t (s) | 0.50 | 1.00 | 1.50 | 2.00 | 2.50 |
        |---|---|---|---|---|---|
        | d (m) | 0.46 | 1.86 | 4.15 | 7.42 | 11.5 |
      prompt: |
        A best-fit line of d against t² has a slope of 1.84 m/s². What is the gravitational field strength at the surface of Planet X?
      options:
        - "3.7 N/kg"
        - "1.8 N/kg"
        - "4.6 N/kg"
        - "9.8 N/kg"
      option_explanations:
        - |
          Correct. The slope is g/2, so g = 2 × 1.84 ≈ 3.7 m/s², which is 3.7 N/kg.
        - |
          1.84 is the slope itself, which equals g/2, not g; it must be doubled.
        - |
          4.6 = 11.5/2.5 is the average velocity over the whole drop in m/s, not an acceleration or field strength.
        - |
          9.8 N/kg is Earth's surface field. Planet X's field must come from the measured slope.
      answer: 0
    - slug: apphys1-u02-w08-q03
      type: multiple_choice
      topic_code: "2.6"
      source: "AP Physics 1 CED, Topic 2.6"
      points: 1
      stimulus: |
        A robotic probe lands on Planet X, which has no atmosphere and a radius of 3.4 × 10⁶ m. It drops a small sample from rest and its camera records how far the sample has fallen at five times (invented data):

        | t (s) | 0.50 | 1.00 | 1.50 | 2.00 | 2.50 |
        |---|---|---|---|---|---|
        | d (m) | 0.46 | 1.86 | 4.15 | 7.42 | 11.5 |
      prompt: |
        Using a surface field of 3.7 N/kg, what is the mass of Planet X?
      options:
        - "1.9 × 10¹⁷ kg"
        - "1.7 × 10²⁴ kg"
        - "6.4 × 10²³ kg"
        - "2.6 × 10²⁴ kg"
      option_explanations:
        - |
          This uses gR/G, forgetting to square the radius in g = GM/R².
        - |
          This uses Earth's 9.8 N/kg instead of Planet X's measured 3.7 N/kg.
        - |
          Correct. g = GM/R², so M = gR²/G = 3.7 · (3.4 × 10⁶)²/(6.67 × 10⁻¹¹) ≈ 6.4 × 10²³ kg.
        - |
          This uses the planet's diameter, 6.8 × 10⁶ m, in place of its radius; r in g = GM/r² is measured from the center, so the result comes out four times too large.
      answer: 2
    - slug: apphys1-u02-w08-q04
      type: multiple_choice
      topic_code: "2.6"
      source: "AP Physics 1 CED, Topic 2.6"
      points: 1
      stimulus: |
        A robotic probe lands on Planet X, which has no atmosphere and a radius of 3.4 × 10⁶ m. It drops a small sample from rest and its camera records how far the sample has fallen at five times (invented data):

        | t (s) | 0.50 | 1.00 | 1.50 | 2.00 | 2.50 |
        |---|---|---|---|---|---|
        | d (m) | 0.46 | 1.86 | 4.15 | 7.42 | 11.5 |
      prompt: |
        A rock has a mass of 2.0 kg as measured on Earth. What are its mass and its weight on the surface of Planet X, where g = 3.7 N/kg?
      options:
        - "Mass 0.76 kg, weight 7.4 N"
        - "Mass 2.0 kg, weight 7.4 N"
        - "Mass 2.0 kg, weight 19.6 N"
        - "Mass 2.0 kg, weight 2.0 N"
      option_explanations:
        - |
          Mass is the amount of matter (and inertia); it does not change from planet to planet. Only the weight scales with g.
        - |
          Correct. The mass stays 2.0 kg; the weight is F_g = mg = 2.0 · 3.7 ≈ 7.4 N.
        - |
          19.6 N is the rock's weight on Earth; on Planet X the field is 3.7 N/kg, not 9.8 N/kg.
        - |
          This confuses mass with weight: a weight is a force in newtons, mg, not the number of kilograms.
      answer: 1
    # ---- Gravitational force (2.6)
    - slug: apphys1-u02-w08-q05
      type: multiple_choice
      topic_code: "2.6"
      source: "AP Physics 1 CED, Topic 2.6"
      points: 1
      prompt: |
        Two asteroids attract each other with a gravitational force of magnitude F. They drift apart until the distance between their centers is three times as large. What is the new force?
      options:
        - "3F"
        - "F/3"
        - "F/9"
        - "F/6"
      option_explanations:
        - |
          A larger separation weakens gravity; the force decreases, not increases.
        - |
          This treats the force as inversely proportional to r. It falls off as 1/r², so tripling r divides it by 9.
        - |
          Correct. F_g ∝ 1/r², so tripling r multiplies the force by 1/3² = 1/9.
        - |
          F/6 multiplies the distance factor by 2 instead of squaring it.
      answer: 2
    - slug: apphys1-u02-w08-q06
      type: multiple_choice
      topic_code: "2.6"
      source: "AP Physics 1 CED, Topic 2.6"
      points: 1
      prompt: |
        A planet has twice Earth's mass and twice Earth's radius. What is the gravitational field strength at its surface?
      options:
        - "19.6 N/kg"
        - "4.9 N/kg"
        - "9.8 N/kg"
        - "2.45 N/kg"
      option_explanations:
        - |
          This doubles g for the doubled mass but ignores the larger radius, which weakens the field at the surface.
        - |
          Correct. g = GM/R², so g_planet = 9.8 · 2/2² = 9.8/2 = 4.9 N/kg.
        - |
          The doubled mass and doubled radius do not cancel, because the radius is squared.
        - |
          2.45 N/kg = 9.8/4 accounts for the doubled radius but forgets that the mass is also doubled.
      answer: 1
    - slug: apphys1-u02-w08-q07
      type: multiple_choice
      topic_code: "2.6"
      source: "AP Physics 1 CED, Topic 2.6"
      points: 1
      prompt: |
        Astronauts float freely inside a space station orbiting 4.0 × 10⁵ m above Earth's surface, where the gravitational field is about 8.7 N/kg. Which statement best explains why they float?
      options:
        - "The station is outside Earth's gravitational field."
        - "The Moon's gravity cancels Earth's gravity at that height."
        - "The air inside the station holds them up."
        - "The astronauts and the station are in free fall together, so nothing presses on them."
      option_explanations:
        - |
          The field there is about 8.7 N/kg, roughly 89% of its surface value; the station is well inside Earth's field.
        - |
          The Moon's field at the station is thousands of times weaker than Earth's; it cancels nothing.
        - |
          The cabin air exerts no meaningful upward force, and astronauts float in spacesuits outside the station too.
        - |
          Correct. Gravity is the only force on astronauts and station, so all share the same acceleration; the floor exerts no normal force, and their apparent weight is zero.
      answer: 3
    - slug: apphys1-u02-w08-q08
      type: multiple_choice
      topic_code: "2.6"
      source: "AP Physics 1 CED, Topic 2.6"
      points: 1
      prompt: |
        An apple falls from a tree. How does the gravitational force that the apple exerts on Earth compare with the gravitational force that Earth exerts on the apple?
      options:
        - "They are equal in magnitude."
        - "The force on Earth is much smaller, because the apple's mass is small."
        - "The force on Earth is much larger, because Earth's mass is large."
        - "The apple exerts no gravitational force on Earth."
      option_explanations:
        - |
          Correct. They are a third-law pair, and F_g = Gm₁m₂/r² is the same expression for each. Earth's acceleration is negligible only because its mass is huge.
        - |
          The apple's small mass appears in the force on both objects; it gives Earth a tiny acceleration, not a smaller force.
        - |
          Earth's mass appears in both forces equally; the two forces of one interaction are always the same size.
        - |
          Every mass attracts every other mass. The apple pulls Earth with the same force Earth pulls the apple.
      answer: 0
    - slug: apphys1-u02-w08-q09
      type: multiple_choice
      topic_code: "2.6"
      source: "AP Physics 1 CED, Topic 2.6"
      points: 1
      prompt: |
        A satellite is at a distance of 2R_E from Earth's center, where R_E is Earth's radius. What is the gravitational field strength at its location?
      options:
        - "2.45 N/kg"
        - "4.9 N/kg"
        - "1.09 N/kg"
        - "9.8 N/kg"
      option_explanations:
        - |
          Correct. g ∝ 1/r²; doubling r from R_E to 2R_E gives 9.8/2² = 2.45 N/kg.
        - |
          4.9 N/kg halves the field, treating it as proportional to 1/r rather than 1/r².
        - |
          1.09 N/kg = 9.8/9 is the field at 3R_E from the center: it treats "2R_E from the center" as 2R_E above the surface.
        - |
          The field is uniform only close to the surface; at twice the distance from the center it is much weaker.
      answer: 0
    # ---- Spiral review
    - slug: apphys1-u02-w08-q10
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 1
      prompt: |
        A 75 kg rider stands on a scale in an elevator that is speeding up as it moves downward, with an acceleration of 2.0 m/s². What does the scale read?
      options:
        - "735 N"
        - "585 N"
        - "885 N"
        - "150 N"
      option_explanations:
        - |
          735 N = mg is the reading only at rest or at constant velocity; this elevator is accelerating.
        - |
          Correct. Up positive: F_N − mg = ma with a = −2.0 m/s², so F_N = 75(9.8 − 2.0) = 585 N.
        - |
          885 N = m(g + a) is the reading for an upward acceleration; speeding up while going down means the acceleration is downward.
        - |
          150 N = ma is the net force, not the scale reading.
      answer: 1
    - slug: apphys1-u02-w08-q11
      type: multiple_choice
      topic_code: "2.4"
      source: "AP Physics 1 CED, Topic 2.4"
      points: 1
      prompt: |
        A 5.0 kg bird feeder hangs at rest from the middle of a rope; each half of the rope makes 30° above the horizontal. What is the tension in the rope?
      options:
        - "24.5 N"
        - "28.3 N"
        - "49 N"
        - "98 N"
      option_explanations:
        - |
          24.5 N = mg/2 would be correct only if both halves of the rope hung vertically.
        - |
          28.3 N = mg/(2 cos 30°) uses the cosine for the vertical component; with angles measured from the horizontal, the vertical component is T sin θ.
        - |
          Correct. ΣF_y = 0: 2T sin 30° = mg, so T = 49/(2 · 0.500) = 49 N, equal to the feeder's whole weight.
        - |
          98 N = 2mg doubles the weight; the two halves share the load, and 2T sin 30° = T, so T = mg.
      answer: 2
    - slug: apphys1-u02-w08-q12
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Physics 1 CED, Topic 2.2"
      points: 1
      prompt: |
        A student slides a book across a level, frictionless table and lets go. Which describes the free-body diagram of the book after it leaves her hand and is still sliding?
      options:
        - "F_g down, F_N up, and a forward force from her push"
        - "F_g down only"
        - "F_g down, F_N up, and a forward force equal to the book's mass times its speed"
        - "F_g down and F_N up only"
      option_explanations:
        - |
          Her hand no longer touches the book, so it exerts no force; the book keeps moving because no horizontal force acts to change its velocity.
        - |
          The table still touches the book and pushes up on it; without F_N the book would accelerate downward through the table.
        - |
          Mass times speed is not a force exerted by any object, so it has no place on a free-body diagram.
        - |
          Correct. Only Earth and the table interact with the book: F_g down and F_N up, balanced. No horizontal force acts, so the book slides at constant velocity.
      answer: 3
    - slug: apphys1-u02-w08-q13
      type: multiple_choice
      topic_code: "1.5"
      source: "AP Physics 1 CED, Topic 1.5"
      points: 1
      prompt: |
        A toy car rolls off the edge of a level table 0.80 m high with a horizontal speed of 3.0 m/s. Air resistance is negligible. How far from the base of the table does it land?
      options:
        - "2.4 m"
        - "1.2 m"
        - "0.40 m"
        - "0.24 m"
      option_explanations:
        - |
          2.4 m = 3.0 × 0.80 multiplies the speed by the height, which is not a valid way to find a horizontal distance.
        - |
          Correct. Fall time from 0.80 = ½(9.8)t² is t ≈ 0.404 s; horizontal distance = 3.0 · 0.404 ≈ 1.2 m.
        - |
          0.40 is the fall time in seconds; it still has to be multiplied by the horizontal speed.
        - |
          0.24 m uses t = 0.80/9.8 ≈ 0.082 s, missing the ½ and the square root in the fall-time formula.
      answer: 1
    - slug: apphys1-u02-w08-q14
      type: multi_select
      topic_code: "2.6"
      source: "AP Physics 1 CED, Topic 2.6"
      points: 2
      partial_credit: true
      prompt: |
        Two small spheres attract each other gravitationally with a force F. Which changes, each made on its own, would make the force 2F? Select all that apply.
      options:
        - "Doubling the mass of one sphere, keeping the distance the same"
        - "Doubling the distance between the spheres' centers"
        - "Dividing the distance between the centers by √2, keeping the masses the same"
        - "Doubling both masses and multiplying the distance by √2"
        - "Doubling both masses and doubling the distance"
      option_explanations:
        - |
          Correct. F_g is proportional to each mass, so doubling one mass doubles the force.
        - |
          Doubling the distance makes the force one quarter as large, F/4.
        - |
          Correct. F_g ∝ 1/r²; with r divided by √2, r² is halved and the force doubles.
        - |
          Correct. Doubling both masses multiplies F by 4; multiplying r by √2 doubles r², dividing F by 2. Net factor 4/2 = 2.
        - |
          Doubling both masses gives × 4 and doubling the distance gives × 1/4, so the force is unchanged at F.
      answer: [0, 2, 3]
    - slug: apphys1-u02-w08-q15
      type: multi_select
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 2
      partial_credit: true
      prompt: |
        A 2.0 kg block and a 6.0 kg block are released side by side at the top of the same frictionless ramp inclined at 25°. Which statements are correct? Select all that apply.
      options:
        - "Both blocks have the same acceleration down the ramp, about 4.1 m/s²."
        - "The 6.0 kg block has three times the acceleration of the 2.0 kg block."
        - "The component of the gravitational force along the ramp is three times larger on the 6.0 kg block."
