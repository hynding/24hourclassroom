week: 5
unit: 2
title: "Systems, Center of Mass, and Free-Body Diagrams"
topics: ["2.1", "2.2"]
guide: guides/week-05.md
guide_description: |
  Choosing a system and sorting internal from external forces, deciding when a system can be modelled as a
  single object, locating the center of mass with x_cm = Σ(m·x)/Σm, why internal forces cannot move the center
  of mass, forces as interactions (contact and field forces), drawing free-body diagrams, and resolving angled
  forces with level or tilted axes. Worked examples: an adult walking forward in a floating canoe (the canoe
  slides 1.5 m back), estimating then computing the center of mass of a loaded meter stick (56.7 cm), the
  free-body diagram and normal force of a sled pulled by a rope at 25° (92 N, with limiting cases), and a block
  held on a 30° ramp with tilted axes.
flashcards_description: |
  30 cards on systems and the center of mass (internal and external forces, the object model, computing and
  estimating x_cm, why internal forces leave it unmoved) and on forces and free-body diagrams (contact and field
  forces, what goes on an FBD, normal force, tension, components on level ground and on slopes).

flashcards:
  - front: Choosing a system → what the choice decides
    back: |
      Which forces are internal (left off the FBD, cancel in pairs) and which are external (drawn, and able to change the system's motion). The physics is the same either way.
    topic_code: "2.1"
  - front: Two carts pushed apart by a spring, system = both carts and spring → spring forces are
    back: |
      Internal. They act between parts of the system, so they do not appear on the system's free-body diagram and cannot change the motion of its center of mass.
    topic_code: "2.1"
  - front: Two carts pushed apart by a spring, system = cart 1 alone → spring force is
    back: |
      External: the spring is outside the system, so its push on cart 1 goes on cart 1's FBD and accelerates cart 1.
    topic_code: "2.1"
  - front: Object model of a system → when it is valid
    back: |
      When the system's size, shape and internal motion do not matter to the question, so it can be treated as a single point at its center of mass carrying all its mass.
    topic_code: "2.1"
  - front: A diver's flight path versus the diver's somersault → which can use the object model
    back: |
      The flight path of the center of mass can (a point under gravity). The somersault cannot: it depends on how the mass is arranged and moves, which is internal structure.
    topic_code: "2.1"
  - front: Center of mass along one axis → formula
    back: |
      x_cm = (m₁x₁ + m₂x₂ + …)/(m₁ + m₂ + …): a mass-weighted average of the positions of each part's own center of mass.
    topic_code: "2.1"
  - front: Two equal masses → where the center of mass is
    back: |
      Exactly halfway between them. Unequal masses pull it toward the heavier one.
    topic_code: "2.1"
  - front: One mass far larger than the others → limiting position of x_cm
    back: |
      x_cm approaches the position of the large mass (Earth and a ball: the center of mass is essentially at Earth's center).
    topic_code: "2.1"
  - front: Uniform symmetric object (meter stick, ball) → where its center of mass is
    back: |
      At its geometric center, by symmetry. A uniform meter stick's is at the 50 cm mark.
    topic_code: "2.1"
  - front: Center of mass of a ring or boomerang → must it be inside the material?
    back: |
      No. A ring's center of mass is at the center of the hole, where there is no material at all.
    topic_code: "2.1"
  - front: Gliders 0.25 kg at 0.40 m and 0.75 kg at 1.20 m → x_cm
    back: |
      x_cm = (0.25 · 0.40 + 0.75 · 1.20)/1.00 = 1.00 m, three quarters of the way toward the heavier glider.
    topic_code: "2.1"
  - front: Loaded meter stick (0.10 kg stick, 0.20 kg at 10 cm, 0.30 kg at 90 cm) → x_cm
    back: |
      (0.10 · 50 + 0.20 · 10 + 0.30 · 90)/0.60 = 34/0.60 ≈ 56.7 cm, just past the middle, toward the heavier load.
    topic_code: "2.1"
  - front: Internal forces and the center of mass → why they cannot move it
    back: |
      Internal forces come in equal and opposite pairs inside the system, so their effects on the system as a whole cancel. Only an external force changes the velocity of the center of mass.
    topic_code: "2.1"
  - front: Adult walks forward in a floating canoe → what the canoe does
    back: |
      Slides backward, so the center of mass of adult + canoe (+ anyone else aboard) stays put relative to the shore (ignoring horizontal drag from the water).
    topic_code: "2.1"
  - front: Force as an interaction → what every force needs
    back: |
      An object exerting it and an object it acts on: "the force exerted by the rope on the sled". If nothing exerts it, it does not exist.
    topic_code: "2.2"
  - front: Contact forces in AP Physics 1 → list
    back: |
      Normal force, tension, friction, spring force, air resistance (drag) and applied pushes or pulls. All need touching.
    topic_code: "2.2"
  - front: Field (long-range) force in AP Physics 1 → which one
    back: |
      The gravitational force, which acts without contact; near Earth's surface F_g = mg with g = 9.8 N/kg.
    topic_code: "2.2"
  - front: Normal force → direction and cause
    back: |
      Perpendicular to the contact surface, pushing away from it, exerted by the surface because it is slightly compressed.
    topic_code: "2.2"
  - front: Tension in a light rope → direction
    back: |
      Along the rope, pulling away from the object the rope is attached to. A rope can pull but never push.
    topic_code: "2.2"
  - front: Drawing a free-body diagram → the steps
    back: |
      One dot for the object or system; one arrow per external force, starting at the dot, pointing the way the force acts, labelled (F_g, F_N, F_T, F_f). No velocity, acceleration or "net force" arrows.
    topic_code: "2.2"
  - front: Ball in flight after leaving the hand, no air resistance → its FBD
    back: |
      A dot with one downward arrow, F_g. The hand no longer touches it, so there is no "force of the throw" on the way up or down.
    topic_code: "2.2"
  - front: Book on a table pressed down by a hand → its FBD
    back: |
      F_g down, F_hand down, F_N up. The normal force grows to balance both, so F_N = mg + F_hand, more than mg.
    topic_code: "2.2"
  - front: Sled pulled by a rope at angle θ above horizontal on level snow → normal force
    back: |
      F_N = mg − F_T sin θ: the rope's upward component carries part of the weight, so F_N is less than mg.
    topic_code: "2.2"
  - front: 60 N rope at 25° above horizontal → components
    back: |
      Horizontal 60 cos 25° ≈ 54.4 N, vertical 60 sin 25° ≈ 25.4 N.
    topic_code: "2.2"
  - front: Object on a slope at angle θ → components of F_g with tilted axes
    back: |
      Along the slope (downhill): mg sin θ. Into the slope: mg cos θ. Check with θ = 0: nothing along the slope, all of it into the surface.
    topic_code: "2.2"
  - front: Tilted axes on a ramp → why use them
    back: |
      The motion is along the slope, so with x along the slope only F_g needs resolving; F_N and any rope parallel to the slope lie on an axis.
    topic_code: "2.2"
  - front: 4.0 kg block on a 30° smooth ramp → components of F_g
    back: |
      F_g = 39.2 N; along the slope 39.2 sin 30° = 19.6 N; perpendicular 39.2 cos 30° ≈ 33.9 N.
    topic_code: "2.2"
  - front: Error-spot → "the normal force on any object always equals mg"
    back: |
      Only on a level surface with no other vertical forces. On a slope F_N = mg cos θ; with an upward pull it is less; with a downward push it is more.
    topic_code: "2.2"
  - front: Error-spot → "a rightward force keeps a sliding puck moving right"
    back: |
      No contact means no force. A puck sliding on ice has only F_g and F_N (and a small friction force against the motion); motion does not need a force in its direction.
    topic_code: "2.2"
  - front: Error-spot → "x_cm of 1 kg at 0 m and 3 kg at 2 m is 1 m, the midpoint"
    back: |
      The midpoint ignores the masses. x_cm = (1 · 0 + 3 · 2)/4 = 1.5 m, closer to the heavier mass.
    topic_code: "2.1"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 2.1 and 2.2: systems, internal and external
    forces, the center of mass, forces as interactions, free-body diagrams and force components), with 8
    questions (32%) reviewing weeks 1–4 (acceleration and its sign, motion graphs, relative motion and projectile
    motion). Opens with a shared-context set on three carts on a track. Multiple choice, select-all, true/false
    and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers
    and the long answer are graded by your teacher against the scoring notes. Use g = 9.8 m/s². Calculator and
    equation sheet allowed throughout, as on the AP exam.
  questions:
    # ---- Stimulus set: three carts on a track (2.1)
    - slug: apphys1-u02-w05-q01
      type: multiple_choice
      topic_code: "2.1"
      source: "AP Physics 1 CED, Topic 2.1"
      points: 1
      stimulus: |
        A lab group places three carts at rest on a level, low-friction track that runs along the x axis. Cart 1 (0.40 kg) is at x = 0.10 m, cart 2 (0.80 kg) is at x = 0.60 m and cart 3 (1.20 kg) is at x = 1.10 m (each position is the cart's own center of mass). A compressed spring, held by a thread, sits between carts 1 and 2. The group will burn the thread and film the carts.
      prompt: |
        Where is the center of mass of the three-cart system before the thread is burned?
      options:
        - "x = 0.60 m"
        - "x = 0.61 m"
        - "x = 0.77 m"
        - "x = 1.10 m"
      option_explanations:
        - |
          0.60 m is the plain average of the three positions, (0.10 + 0.60 + 1.10)/3; it ignores that the carts have different masses.
        - |
          0.61 m comes from dividing Σ(m·x) = 1.84 kg·m by the number of carts (3) instead of by the total mass (2.4 kg).
        - |
          Correct. x_cm = (0.40 · 0.10 + 0.80 · 0.60 + 1.20 · 1.10)/(0.40 + 0.80 + 1.20) = 1.84/2.4 ≈ 0.77 m, pulled toward the heaviest cart.
        - |
          1.10 m is where the heaviest cart sits. The center of mass is pulled toward it but the other two carts keep it well short of x = 1.10 m.
      answer: 2
    - slug: apphys1-u02-w05-q02
      type: multiple_choice
      topic_code: "2.1"
      source: "AP Physics 1 CED, Topic 2.1"
      points: 1
      stimulus: |
        A lab group places three carts at rest on a level, low-friction track that runs along the x axis. Cart 1 (0.40 kg) is at x = 0.10 m, cart 2 (0.80 kg) is at x = 0.60 m and cart 3 (1.20 kg) is at x = 1.10 m (each position is the cart's own center of mass). A compressed spring, held by a thread, sits between carts 1 and 2. The group will burn the thread and film the carts.
      prompt: |
        The thread is burned and the spring pushes carts 1 and 2 apart. Treating carts 1, 2 and 3 and the spring as the system, what happens to the system's center of mass while the carts move (before any cart reaches the end of the track)?
      options:
        - "It moves toward cart 1, because cart 1 is lightest and moves fastest."
        - "It stays at the same position, because the spring forces are internal to the system."
        - "It moves toward cart 3, because cart 2 is pushed in that direction."
        - "It cannot be predicted without knowing the spring constant."
      option_explanations:
        - |
          Cart 1 does move fastest, but cart 2 moves the other way; the mass-weighted changes cancel, so the center of mass does not shift toward cart 1.
        - |
          Correct. The spring pushes on carts 1 and 2, both inside the system, so the forces are internal and cancel in pairs. With negligible external horizontal force, the center of mass stays at rest at about 0.77 m.
        - |
          This tracks only cart 2. Cart 1 moves the opposite way at the same time, and internal forces cannot move the system's center of mass.
        - |
          The spring constant sets how fast the carts move, not where the center of mass goes: internal forces cannot move it at all.
      answer: 1
    - slug: apphys1-u02-w05-q03
      type: multiple_choice
      topic_code: "2.1"
      source: "AP Physics 1 CED, Topic 2.1"
      points: 1
      stimulus: |
        A lab group places three carts at rest on a level, low-friction track that runs along the x axis. Cart 1 (0.40 kg) is at x = 0.10 m, cart 2 (0.80 kg) is at x = 0.60 m and cart 3 (1.20 kg) is at x = 1.10 m (each position is the cart's own center of mass). A compressed spring, held by a thread, sits between carts 1 and 2. The group will burn the thread and film the carts.
      prompt: |
        A student now chooses cart 2 alone as the system. Which statement about the spring's push on cart 2 is correct?
      options:
        - "It is internal, so it does not change cart 2's velocity."
        - "It is internal, but it still speeds cart 2 up."
        - "It cancels the spring's push on cart 1, so cart 2 does not accelerate."
        - "It is external to this system, so it can and does change cart 2's velocity."
      option_explanations:
        - |
          The spring is not part of the system "cart 2 alone", so its push is external; and cart 2 clearly speeds up when the thread is burned.
        - |
          Whether a force is internal depends on the system. With cart 2 alone as the system the spring is outside it, so its push is external.
        - |
          The push on cart 1 acts on a different object. Forces on different objects never cancel each other on one object's FBD.
        - |
          Correct. Only cart 2 is inside the system, so the spring's push on it is an external force. It is the unbalanced force that accelerates cart 2 away from cart 1.
      answer: 3
    # ---- Forces and free-body diagrams (2.2) and systems (2.1)
    - slug: apphys1-u02-w05-q04
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Physics 1 CED, Topic 2.2"
      points: 1
      prompt: |
        A 2.0 kg textbook rests on a level desk while a student presses straight down on it with a 15 N push. Which describes the textbook's free-body diagram?
      options:
        - "F_g = 19.6 N down, F_hand = 15 N down, F_N = 34.6 N up"
        - "F_g = 19.6 N down and F_N = 19.6 N up only, since the push acts on the desk"
        - "F_g = 19.6 N down, F_hand = 15 N down, F_N = 19.6 N up"
        - "F_g = 2.0 N down, F_hand = 15 N down, F_N = 17 N up"
      option_explanations:
        - |
          Correct. Gravity (2.0 · 9.8 = 19.6 N) and the hand both push down; the book stays put, so the desk pushes up with F_N = 19.6 + 15 = 34.6 N.
        - |
          The hand touches the book, so its push acts on the book and belongs on the book's FBD.
        - |
          This assumes the normal force always equals mg. The desk must push up hard enough to balance both downward forces.
        - |
          2.0 N uses the mass in kilograms as if it were the weight; F_g = mg = 19.6 N.
      answer: 0
    - slug: apphys1-u02-w05-q05
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Physics 1 CED, Topic 2.2"
      points: 1
      prompt: |
        A volleyball has left a player's hands and is still rising. Air resistance is negligible. Which forces act on the ball?
      options:
        - "An upward force from the hit and a downward gravitational force, with the upward one larger"
        - "An upward force from the hit only, until the ball reaches the top"
        - "No forces at all, because the ball is moving freely"
        - "Only the downward gravitational force exerted by Earth"
      option_explanations:
        - |
          The hands stopped touching the ball when it left them. A rising ball needs no upward force; it is slowing down because the only force is downward.
        - |
          There is no "force of the hit" after contact ends, and gravity never switches off on the way up.
        - |
          Earth still pulls the ball down; "moving freely" in physics means only gravity acts.
        - |
          Correct. Nothing touches the ball, so the only force is the field force F_g exerted by Earth, pointing down whether the ball is rising, at the top or falling.
      answer: 3
    - slug: apphys1-u02-w05-q06
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Physics 1 CED, Topic 2.2"
      points: 1
      prompt: |
        A 4.0 kg crate sits on a frictionless ramp inclined at 30° above the horizontal. What is the magnitude of the component of the gravitational force on the crate that is parallel to the ramp surface?
      options:
        - "2.0 N"
        - "19.6 N"
        - "33.9 N"
        - "39.2 N"
      option_explanations:
        - |
          2.0 N = 4.0 sin 30° multiplies the mass, not the weight, by the sine. The weight is mg = 39.2 N.
        - |
          Correct. F_g = mg = 4.0 · 9.8 = 39.2 N, and the component along the slope is mg sin θ = 39.2 · sin 30° = 19.6 N.
        - |
          33.9 N = mg cos 30° is the component perpendicular to the ramp. Using cos for the parallel component swaps the two (check θ = 0: nothing should point along a flat floor).
        - |
          39.2 N is the whole gravitational force; only part of it points along the slope.
      answer: 1
    - slug: apphys1-u02-w05-q07
      type: multiple_choice
      topic_code: "2.2"
      source: "AP Physics 1 CED, Topic 2.2"
      points: 1
      prompt: |
        A child pulls a sled across level snow with a rope that makes an angle of 25° above the horizontal. The tension in the rope is 60 N. What is the horizontal component of the rope's force on the sled?
      options:
        - "25 N"
        - "60 N"
        - "54 N"
        - "66 N"
      option_explanations:
        - |
          25 N = 60 sin 25° is the vertical component; the horizontal one uses the cosine of the angle measured from the horizontal.
        - |
          60 N is the whole tension. Part of the rope's pull is upward, so the horizontal component is smaller.
        - |
          Correct. Fₓ = F cos θ = 60 cos 25° ≈ 54.4 N, about 54 N.
        - |
          66 N = 60/cos 25° divides instead of multiplying. A component can never be larger than the force itself.
      answer: 2
    - slug: apphys1-u02-w05-q08
      type: multiple_choice
      topic_code: "2.1"
      source: "AP Physics 1 CED, Topic 2.1"
      points: 1
      prompt: |
        In which situation is it least reasonable to model the system as a single object (a point mass)?
      options:
        - "Finding how long a skateboarder takes to coast down a long straight hill"
        - "Finding where a thrown football lands"
        - "Finding how a gymnast's spin rate changes as she pulls in her arms"
        - "Finding the acceleration of a train along a straight track"
      option_explanations:
        - |
          For travel time down a hill only the motion of the skateboarder's center of mass matters, so the object model works well.
        - |
          The landing point is set by the path of the football's center of mass, which a point model gives (ignoring air resistance).
        - |
          Correct. A change in spin when the arms move depends on how the gymnast's mass is arranged and rearranged: internal structure that a point model discards.
        - |
          Every part of the train moves together along the track, so the train's acceleration is well described by treating it as one object.
      answer: 2
    - slug: apphys1-u02-w05-q09
      type: multiple_choice
      topic_code: "2.1"
      source: "AP Physics 1 CED, Topic 2.1"
      points: 1
      prompt: |
        A uniform 0.10 kg meter stick has a 0.20 kg mass hung at its 10 cm mark and a 0.30 kg mass hung at its 90 cm mark. Where is the center of mass of the stick and both masses?
      options:
        - "50.0 cm"
        - "56.7 cm"
        - "58.0 cm"
        - "68.0 cm"
      option_explanations:
        - |
          50 cm is the stick's own center of mass. The heavier load at 90 cm pulls the system's center of mass toward that end.
        - |
          Correct. x_cm = (0.10 · 50 + 0.20 · 10 + 0.30 · 90)/(0.10 + 0.20 + 0.30) = 34/0.60 ≈ 56.7 cm.
        - |
          58.0 cm = (0.20 · 10 + 0.30 · 90)/0.50 leaves out the stick's own mass, which sits at the middle and pulls the result back toward 50 cm.
        - |
          68.0 cm = 34/0.50 includes the stick in the numerator but forgets its 0.10 kg in the total mass.
      answer: 1
    # ---- Spiral review (weeks 1–4)
    - slug: apphys1-u02-w05-q10
      type: multiple_choice
      topic_code: "1.2"
      source: "AP Physics 1 CED, Topic 1.2"
      points: 1
      prompt: |
        A car moves in the −x direction and is slowing down. Which describes the signs of its velocity and acceleration?
      options:
        - "Velocity negative, acceleration negative"
        - "Velocity positive, acceleration negative"
        - "Velocity negative, acceleration zero"
        - "Velocity negative, acceleration positive"
      option_explanations:
        - |
          Same signs mean speeding up. A car moving in −x with negative acceleration would be getting faster.
        - |
          The car moves in the −x direction, so its velocity is negative, not positive.
        - |
          The car's speed is changing, so its acceleration cannot be zero.
        - |
          Correct. Motion in −x means v is negative; slowing down means a points opposite to v, so a is positive.
      answer: 3
    - slug: apphys1-u02-w05-q11
      type: multiple_choice
      topic_code: "1.3"
      source: "AP Physics 1 CED, Topic 1.3"
      points: 1
      prompt: |
        A cyclist's velocity rises steadily from 0 to 6.0 m/s during the first 4.0 s, then stays at 6.0 m/s for the next 2.0 s. What is her displacement over the 6.0 s?
      options:
        - "24 m"
        - "36 m"
        - "12 m"
        - "18 m"
      option_explanations:
        - |
          Correct. Displacement is the area under the v–t graph: a triangle ½ · 4.0 · 6.0 = 12 m plus a rectangle 2.0 · 6.0 = 12 m, total 24 m.
        - |
          36 m = 6.0 m/s × 6.0 s treats the whole interval as if she moved at 6.0 m/s, ignoring the slower start.
        - |
          12 m counts only one of the two pieces of area (either the triangle or the rectangle).
        - |
          18 m = 3.0 m/s × 6.0 s uses the average of 0 and 6.0 m/s for the whole interval, but she spends only 4.0 s speeding up.
      answer: 0
    - slug: apphys1-u02-w05-q12
      type: multiple_choice
      topic_code: "1.5"
      source: "AP Physics 1 CED, Topic 1.5"
      points: 1
      prompt: |
        A marble rolls off a level table 1.25 m high with a horizontal speed of 2.0 m/s. Air resistance is negligible. How far from the base of the table does it land?
      options:
        - "2.5 m"
        - "1.0 m"
        - "0.51 m"
        - "0.26 m"
      option_explanations:
        - |
          2.5 m multiplies the speed by the height, which has no physical meaning; the horizontal distance needs the fall time.
        - |
          Correct. Fall time from 1.25 = ½(9.8)t²: t ≈ 0.505 s. Horizontal distance = 2.0 · 0.505 ≈ 1.0 m.
        - |
          0.51 is the fall time in seconds, not a distance; it still has to be multiplied by the horizontal speed.
        - |
          0.26 m comes from using t = 1.25/9.8 ≈ 0.128 s (dropping the ½ and the square root) and then multiplying by 2.0 m/s.
      answer: 1
    - slug: apphys1-u02-w05-q13
      type: multiple_choice
      topic_code: "1.4"
      source: "AP Physics 1 CED, Topic 1.4"
      points: 1
      prompt: |
        A small boat heads straight across a river at 4.0 m/s relative to the water. The river flows at 3.0 m/s relative to the shore. What is the boat's speed relative to the shore?
      options:
        - "5.0 m/s"
        - "7.0 m/s"
        - "1.0 m/s"
        - "4.0 m/s"
      option_explanations:
        - |
          Correct. The two velocities are perpendicular, so the speed relative to the shore is √(4.0² + 3.0²) = 5.0 m/s.
        - |
          Adding 4.0 + 3.0 would be right only if the current flowed in the same direction the boat heads; here the velocities are perpendicular.
        - |
          Subtracting gives the speed for a boat heading straight upstream, not across.
        - |
          4.0 m/s is the speed relative to the water; the current adds a perpendicular 3.0 m/s relative to the shore.
      answer: 0
    - slug: apphys1-u02-w05-q14
      type: multi_select
      topic_code: "2.2"
      source: "AP Physics 1 CED, Topic 2.2"
      points: 2
      partial_credit: true
      prompt: |
        A framed picture hangs at rest from a single wire hooked over a nail in a wall; the picture's back rests against the wall. Which forces belong on the free-body diagram of the picture? Select all that apply.
      options:
        - "The gravitational force exerted by Earth on the picture"
        - "The tension force exerted by the wire on the picture"
        - "The normal force exerted by the wall on the picture"
        - "The force exerted by the picture on the nail"
        - "The gravitational force exerted by the picture on Earth"
      option_explanations:
        - |
          Correct. Earth pulls on every object near it; F_g acts on the picture and goes on its FBD.
        - |
          Correct. The wire touches the picture and pulls on it along the wire, so the tension acts on the picture.
        - |
          Correct. The picture's back presses on the wall, so the wall pushes back on the picture, perpendicular to the wall.
        - |
          This force acts on the nail, not on the picture. An FBD shows only forces exerted on the chosen object.
        - |
          This force acts on Earth. It is the partner of F_g, but it belongs on Earth's FBD, not the picture's.
      answer: [0, 1, 2]
    - slug: apphys1-u02-w05-q15
      type: multi_select
      topic_code: "2.1"
      source: "AP Physics 1 CED, Topic 2.1"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the center of mass of a system are correct? Select all that apply.
      options:
        - "For two objects, it always lies on the line joining their centers of mass, closer to the more massive one."
        - "It must lie inside the material of the system."
        - "Forces that parts of the system exert on each other cannot change the velocity of the system's center of mass."
        - "For a uniform, symmetric object it lies at the geometric center."
        - "It is always at the average of the positions of the objects in the system."
      option_explanations:
        - |
          Correct. x_cm is a mass-weighted average of the two positions, so it lies between them and closer to the heavier object.
        - |
          A ring, a horseshoe or two separate carts have their center of mass in empty space between the material.
        - |
          Correct. Internal forces come in equal and opposite pairs that cancel for the system as a whole; only external forces change the center of mass's velocity.
        - |
          Correct. With mass spread evenly and symmetrically, the mass-weighted average lands on the center of symmetry.
        - |
          The plain average is the center of mass only when every object has the same mass; otherwise the masses weight the positions.
      answer: [0, 2, 3]
    - slug: apphys1-u02-w05-q16
      type: true_false
      topic_code: "2.2"
      source: "AP Physics 1 CED, Topic 2.2"
      points: 1
      prompt: |
        True or false: A 5.0 kg box resting on a ramp inclined at 20° experiences a normal force of 49 N from the ramp.
      answer: false
      explanation: |
        False. 49 N = mg would be the normal force on level ground. On a ramp the surface pushes only against the perpendicular component of gravity: F_N = mg cos 20° = 49 · 0.940 ≈ 46 N (if nothing else pushes into or pulls away from the ramp).
