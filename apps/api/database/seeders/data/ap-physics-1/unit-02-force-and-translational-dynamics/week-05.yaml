    - slug: apphys1-u02-w05-q23
      type: short_answer
      topic_code: "2.2"
      source: "AP Physics 1 CED, Topic 2.2"
      points: 3
      prompt: |
        A block slides down a rough ramp inclined at angle θ above the horizontal. Air resistance is negligible.

        (a) Describe in words the free-body diagram of the block: name each force, the object that exerts it, and its direction.
        (b) Explain how you would choose the axes, and say which force or forces must then be split into components.
        (c) Write expressions for the components of the gravitational force along and perpendicular to the ramp, in terms of m, g and θ.
      answer: |
        (a) Three forces: the gravitational force F_g exerted by Earth, straight down; the normal force F_N exerted by the ramp, perpendicular to the ramp surface and away from it; the friction force F_f exerted by the ramp, parallel to the surface and up the ramp (opposite the sliding).
        (b) Put x along the ramp (down the slope positive, say) and y perpendicular to it, because the block moves along the ramp. Then F_N and F_f each lie on an axis and only F_g has to be resolved.
        (c) Along the ramp (downhill): mg sin θ. Perpendicular to the ramp (into the surface): mg cos θ.
      explanation: |
        Three points, one per part. (a) all three forces with their sources and correct directions; no "force of motion" or "downhill force" drawn as a separate arrow (a fourth, invented force loses the point). (b) tilted axes with the reason (motion along the ramp) and only F_g resolved. (c) mg sin θ along and mg cos θ perpendicular; swapping sin and cos loses the point (check: at θ = 0 the along-ramp component must vanish).
    - slug: apphys1-u02-w05-q24
      type: short_answer
      topic_code: "2.1"
      source: "AP Physics 1 CED, Topic 2.1"
      points: 3
      prompt: |
        A student on roller skates stands at rest facing a wall, then pushes on the wall with both hands and rolls backward.

        (a) With the student alone as the system, is the wall's push on the student internal or external? Can it change the velocity of the system's center of mass? Explain.
        (b) A classmate chooses the student, the wall and Earth (to which the wall is fixed) as the system. Is the push now internal or external, and what does that predict about the center of mass of this larger system?
        (c) Explain why both descriptions can be correct at the same time.
      answer: |
        (a) External: the wall is outside the system. An external force can change the velocity of the center of mass, and it does: the student's center of mass goes from rest to moving backward.
        (b) Internal: the wall and the student are both inside the system, so the push and the student's push on the wall cancel for the system. The system's center of mass keeps its original velocity (stays at rest); the student moves one way and Earth (with the wall) moves an immeasurably tiny amount the other way.
        (c) Whether a force is internal or external depends only on where the system boundary is drawn. The physics is the same; Earth's enormous mass means its motion is too small to notice, so the center of mass of the large system is essentially at Earth's center and does not move.
      explanation: |
        Three points, one per part. (a) "external" with the reason (wall outside the system) and that it changes the student's center-of-mass velocity. (b) "internal" and the prediction that the larger system's center of mass does not change its motion, with Earth recoiling negligibly. (c) the classification depends on the choice of system, plus a reason why Earth's recoil is unnoticeable (huge mass). Saying the push "disappears" in (b) without explaining the cancellation earns no credit for that part.
    - slug: apphys1-u02-w05-q25
      type: long_answer
      topic_code: "2.2"
      source: "AP Physics 1 CED, Topic 2.2"
      points: 6
      prompt: |
        A traveller pulls a 15 kg suitcase across a level floor at constant height using a strap that makes an angle θ above the horizontal. The tension in the strap is F_T. Ignore friction.

        (A) Describe in words the free-body diagram of the suitcase, with each force labelled and its direction given.

        (B) Starting from the fact that the suitcase stays on the floor, derive an expression for the normal force F_N exerted by the floor on the suitcase, in terms of m, g, F_T and θ.

        (C) Check your expression from (B) against two limiting cases: θ = 0, and the angle at which the suitcase is just about to lift off the floor. Explain what each case tells you.

        (D) Calculate F_N when F_T = 50 N and θ = 35°.

        (E) The traveller keeps F_T = 50 N but raises the strap to a steeper angle. Does the normal force increase, decrease or stay the same? Justify your answer using your expression.
      answer: |
        (A) A dot with a downward arrow F_g (Earth on suitcase), an upward arrow F_N (floor on suitcase) and an arrow F_T (strap on suitcase) pointing forward and at angle θ above the horizontal.
        (B) Vertical components sum to zero: F_N + F_T sin θ − mg = 0, so F_N = mg − F_T sin θ.
        (C) θ = 0: sin 0 = 0, so F_N = mg, the familiar level-floor value with no vertical pull. Lift-off: F_N = 0 when F_T sin θ = mg; the strap's vertical component then carries the whole weight and a larger angle (or tension) would lift the suitcase, so the expression correctly predicts when the floor stops pushing.
        (D) F_N = 15 · 9.8 − 50 sin 35° = 147 − 28.7 ≈ 118 N.
        (E) It decreases. A steeper angle increases sin θ, so F_T sin θ grows and F_N = mg − F_T sin θ shrinks.
      explanation: |
        Six points (mixed representation and derivation).
        (A) 1 point: exactly three forces (F_g down, F_N up, F_T at θ above horizontal) with sources. An extra "force of motion" or a horizontal "pull" drawn separately from F_T loses the point.
        (B) 1 point: F_N = mg − F_T sin θ from a correct vertical force balance. Using cos θ, or writing F_N = mg, earns no credit.
        (C) 2 points: 1 for θ = 0 giving F_N = mg with a sentence that this matches the level case; 1 for identifying lift-off as F_N = 0 (F_T sin θ = mg) and saying what it means physically.
        (D) 1 point: about 118 N (accept 117–119 N), with the unit. Using g = 10 m/s² gives 121 N, which earns the point only if the work is shown.
        (E) 1 point: "decreases" with reasoning from the expression (sin θ increases, so F_T sin θ increases). A correct claim with no reasoning earns no credit.
