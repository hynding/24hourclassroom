    prompt: |
      A pulley is a uniform solid disk of mass 2.0 kg and radius 0.10 m (rotational inertia ½MR²), free to turn on a frictionless axle. A student pulls a light string wrapped around its rim with a constant tangential force of 4.0 N. What is the pulley's angular acceleration? Give your answer in rad/s², to two significant figures.
    answer:
      value: 40
      tolerance: 0.5
    explanation: |
      I = ½MR² = ½ × 2.0 × 0.10² = 0.010 kg·m². τ = rF = 0.10 × 4.0 = 0.40 N·m. α = τ/I = 0.40/0.010 = 40 rad/s². Using I = MR² (a hoop) would give 20 rad/s².
  - slug: apphys1-final-q59
    type: true_false
    topic_code: "6.3"
    source: "AP Physics 1 CED, Topic 6.3"
    points: 1
    prompt: |
      True or false: A puck sliding in a straight line across frictionless ice has zero angular momentum about every point on the ice.
    answer: false
    explanation: |
      False. A point object moving in a straight line has angular momentum L = mvr⊥ about any point that is not on its line of motion, where r⊥ is the perpendicular distance from the point to the line. It is zero only about points on the line itself. Since no torque acts, that angular momentum is constant.
  - slug: apphys1-final-q60
    type: short_answer
    topic_code: "6.4"
    source: "AP Physics 1 CED, Topic 6.4"
    points: 3
    prompt: |
      A child stands at the rim of a playground merry-go-round that is spinning freely on a frictionless axle. The child then walks inward toward the centre and stops there. Predict how the angular velocity of the merry-go-round changes, and justify your prediction. State the system you choose.
    answer: |
      System: the child and the merry-go-round. The axle is frictionless and its force acts at the axis, so there is no external torque about the axis, and the system's angular momentum L = Iω is constant. As the child moves inward, the child's contribution to the rotational inertia (mr²) decreases, so the total I decreases. To keep Iω constant, ω must increase: the merry-go-round spins faster when the child reaches the centre.
    explanation: |
      Three points. 1 point for the prediction that the angular velocity increases. 1 point for choosing the child plus merry-go-round as the system and stating that no external torque acts, so angular momentum is conserved. 1 point for the reasoning that the rotational inertia decreases as the child's distance from the axis decreases (I ∝ mr² for the child), so ω increases to keep L = Iω constant. Arguing from conservation of kinetic energy earns no reasoning credit.
