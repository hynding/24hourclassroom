      - |
        Correct. For small angles the restoring component of gravity, about mg(x/L), is proportional to the displacement x along the arc and points back toward the lowest point.
      - |
        On a flat incline the force along the slope has a constant magnitude, mg sin θ, whatever the distance from the bottom, so it is not proportional to displacement: periodic, but not SHM.
      - |
        Correct. Measured from the new equilibrium position (where the spring force balances the weight), the net force is −k times the displacement, so the motion is SHM with the same period as horizontally.
