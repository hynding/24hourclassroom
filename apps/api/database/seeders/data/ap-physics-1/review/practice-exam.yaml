      On a level, low-friction track, cart A (mass 0.50 kg) rolls to the right toward cart B (mass 0.25 kg), which is at rest. Motion sensors record the velocities just before and just after the carts collide (right is positive):

      | | Cart A (0.50 kg) | Cart B (0.25 kg) |
      |---|---|---|
      | Just before | +0.60 m/s | 0 m/s |
      | Just after | +0.20 m/s | +0.80 m/s |
    prompt: |
      True or false: According to these data, the collision is elastic.
    answer: true
    explanation: |
      True. Total kinetic energy before: ½ × 0.50 × 0.60² = 0.090 J. After: ½ × 0.50 × 0.20² + ½ × 0.25 × 0.80² = 0.010 + 0.080 = 0.090 J. Kinetic energy is unchanged (as well as momentum), so the collision is elastic. The carts separating rather than sticking is a hint, but the kinetic-energy calculation is the evidence.
