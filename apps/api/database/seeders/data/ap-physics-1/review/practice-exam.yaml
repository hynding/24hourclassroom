    prompt: |
      Two identical balls are launched from level ground with the same speed, one at 30° and one at 60° above the horizontal. Air resistance is negligible, and both land back on the same level ground. Compared with each other, their horizontal ranges are ____ . (One word.)
    answer:
      - "equal"
