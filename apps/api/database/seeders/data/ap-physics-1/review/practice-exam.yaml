    type: short_answer
    topic_code: "3.3"
    source: "AP Physics 1 CED, Topics 3.3 and 3.4"
    points: 3
    prompt: |
      A ball is released from rest above a vertical spring standing on the floor. It falls, lands on the spring and compresses it until the ball momentarily stops. The system is the ball, the spring and Earth; air resistance is negligible, and gravitational potential energy is measured from the lowest point the ball reaches. Describe an energy bar chart (the relative sizes of K, U_g and U_s) at each of three states: (1) the moment of release, (2) the moment the ball first touches the spring, and (3) maximum compression. Explain how the total compares across the three states.
    answer: |
      (1) Release: K = 0 and U_s = 0 (the spring is not compressed); all of the energy is U_g, which is at its maximum.
      (2) First contact: U_s is still 0; U_g has decreased, and K has increased by the same amount, so K and U_g are both nonzero and together make up the original total.
      (3) Maximum compression: K = 0 (the ball is momentarily at rest) and U_g = 0 (the lowest point is the reference); all of the energy is U_s, equal to the original U_g.
      The total height of the bars is the same in all three states, because only internal conservative forces (gravity and the spring force) do work within the system and no energy crosses its boundary.
    explanation: |
      Three points. 1 point for state (1): only U_g, with K = 0 and U_s = 0. 1 point for states (2) and (3): at first contact U_s = 0 with K and U_g sharing the total; at maximum compression only U_s, with K = 0 and U_g = 0 at the chosen reference. 1 point for stating that the total stays constant, with the reason (no external work or dissipation; only internal conservative forces). Giving U_s a nonzero bar before the spring is touched loses the second point.
  - slug: apphys1-final-q69
