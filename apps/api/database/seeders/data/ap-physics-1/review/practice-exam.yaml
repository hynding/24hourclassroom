  - slug: apphys1-final-q43
    type: long_answer
    topic_code: "2.7"
    source: "AP Physics 1 CED, Topics 2.5, 2.7 and 3.4"
    points: 10
    stimulus: |
      A 0.80 kg box is released from rest at the top of a straight loading ramp inclined at angle θ = 25° above the horizontal. The coefficient of kinetic friction between the box and the ramp is μ_k = 0.20. The box slides 1.5 m down the ramp to the bottom. Air resistance is negligible. Use g = 9.8 m/s².
    prompt: |
      Free-response question 1: Mathematical Routines.

      (A) Starting from Newton's second law, derive an expression for the magnitude of the box's acceleration down the ramp in terms of θ, μ_k and g. Begin by identifying the forces on the box.

      (B) Calculate the box's acceleration and its speed when it reaches the bottom of the ramp.

      (C) Show that your expression from part (A) gives sensible results in two limiting cases: a frictionless ramp, and a ramp whose angle satisfies tan θ = μ_k.

      (D) A student claims that a 1.6 kg box of the same material would reach the bottom of the ramp sooner because it is heavier. Is the student correct? Justify your answer using your expression from part (A).

      (E) Using energy, calculate the decrease in gravitational potential energy and the work done by friction as the box slides 1.5 m, and use them to show that your speed from part (B) is consistent with conservation of energy.
    answer: |
      (A) Forces: weight mg straight down; normal force F_N perpendicular to the ramp; kinetic friction F_f up the ramp. Perpendicular to the ramp the acceleration is zero, so F_N = mg cos θ, and F_f = μ_k F_N = μ_k mg cos θ. Along the ramp (down positive): ma = mg sin θ − μ_k mg cos θ, so a = g(sin θ − μ_k cos θ).
      (B) a = 9.8 × (sin 25° − 0.20 cos 25°) = 9.8 × (0.423 − 0.181) ≈ 2.4 m/s² (2.37 m/s²). From rest, v² = 2aΔx = 2 × 2.37 × 1.5 = 7.10 m²/s², so v ≈ 2.7 m/s (2.66 m/s).
      (C) Frictionless: μ_k = 0 gives a = g sin θ, the known result for a smooth incline, and it correctly approaches g as θ approaches 90°. If tan θ = μ_k, then sin θ = μ_k cos θ, so a = 0: friction exactly balances the component of gravity along the ramp and a moving box slides at constant speed.
      (D) No. The mass cancels in a = g(sin θ − μ_k cos θ): doubling the mass doubles both the gravitational component along the ramp and the friction force, so the acceleration, and therefore the time to slide 1.5 m (about 1.1 s), is the same.
      (E) Height dropped: h = 1.5 sin 25° = 0.634 m, so ΔU_g = mgh = 0.80 × 9.8 × 0.634 ≈ 4.97 J. Friction: F_f = 0.20 × 0.80 × 9.8 × cos 25° ≈ 1.42 N, so the work done by friction is −1.42 × 1.5 ≈ −2.13 J. Kinetic energy at the bottom = 4.97 − 2.13 = 2.84 J. From part (B), ½mv² = ½ × 0.80 × 2.66² ≈ 2.84 J, which agrees.
    explanation: |
      Ten points.
      (A) 3 points: 1 for identifying the three forces with correct directions (weight down, normal perpendicular to the ramp, friction up the ramp; a separate "force down the ramp" earns 0 for this point); 1 for F_N = mg cos θ and F_f = μ_k mg cos θ; 1 for applying Newton's second law along the ramp to reach a = g(sin θ − μ_k cos θ), with the mass cancelled. Using sin and cos in the wrong places loses the last two points.
      (B) 2 points: 1 for a ≈ 2.4 m/s² (accept 2.3–2.4 m/s²); 1 for v ≈ 2.7 m/s (accept 2.6–2.7 m/s) using a kinematic equation, with units. A wrong acceleration carried through correctly earns the second point.
      (C) 2 points: 1 for showing μ_k = 0 gives g sin θ and saying why it is reasonable; 1 for showing tan θ = μ_k gives a = 0 and interpreting it (friction balances the along-ramp component of gravity; constant velocity). A bare substitution with no interpretation earns at most 1 of the 2.
      (D) 1 point: for "no" with the reasoning that m does not appear in the expression for a (both forces along the ramp scale with m), so the time is the same. "No" with no reference to the expression earns 0.
      (E) 2 points: 1 for ΔU_g ≈ 5.0 J using the vertical drop h = d sin θ (using d = 1.5 m as the height loses this point) and work by friction ≈ 2.1 J in magnitude; 1 for showing that ΔU_g − |W_f| ≈ 2.8 J matches ½mv² from part (B). Consistent use of the student's own part (B) value earns the second point.
