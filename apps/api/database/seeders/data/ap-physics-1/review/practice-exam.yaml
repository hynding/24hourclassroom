    points: 1
    prompt: |
      A large open water barrel has a small hole in its side 0.80 m below the water surface. Treating the water as an ideal fluid and the surface as falling negligibly slowly, at what speed does the water leave the hole? Use g = 9.8 m/s² and give your answer in m/s, to three significant figures.
    answer:
      value: 3.96
      tolerance: 0.03
    explanation: |
      Bernoulli's equation between the surface and the hole, both at atmospheric pressure: ρgh = ½ρv², so v = √(2gh) = √(2 × 9.8 × 0.80) ≈ 3.96 m/s. It is the speed an object would gain falling 0.80 m.
