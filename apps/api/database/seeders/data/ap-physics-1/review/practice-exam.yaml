      (A) Describe a free-body diagram for the student during the interval t = 0 to t = 2.0 s. Name each force, the object exerting it and its direction, and state how the lengths of the arrows compare.

      (B) Starting from your free-body diagram, derive an expression for the scale reading F_N in terms of the student's mass m, g and the elevator's acceleration a (upward positive).

      (C) Determine the elevator's acceleration in each of the three intervals (0–2.0 s, 2.0–8.0 s and 8.0–11.0 s), and calculate the scale reading in each interval.
    answer: |
      (A) Two forces act on the student: an upward normal force F_N exerted by the scale, and a downward gravitational force F_g = mg exerted by Earth. During 0–2.0 s the elevator speeds up while moving upward, so the acceleration is upward and the upward F_N arrow must be longer than the downward F_g arrow.
      (B) Newton's second law, upward positive: F_N − mg = ma, so F_N = m(g + a).
      (C) The acceleration is the slope of the v–t graph. 0–2.0 s: a = (3.0 − 0)/2.0 = +1.5 m/s², F_N = 55 × (9.8 + 1.5) ≈ 620 N (621.5 N). 2.0–8.0 s: a = 0, F_N = 55 × 9.8 = 539 N ≈ 540 N. 8.0–11.0 s: a = (0 − 3.0)/3.0 = −1.0 m/s², F_N = 55 × (9.8 − 1.0) = 484 N ≈ 480 N.
    explanation: |
      Eight points (parts A–C of the 12-point question; part D is worth the other 4).
