    explanation: |
      Three points. 1 point for (a): the forces act on the same object (the book), whereas third law pairs act on two different objects; equality here comes from equilibrium. 1 point for the gravitational pair: the book pulls up on Earth. 1 point for the contact pair: the book pushes down on the desk. A partner named without the object it acts on earns no credit for that part.
