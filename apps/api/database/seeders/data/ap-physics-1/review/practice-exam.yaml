      - "the same"
      - "identical"
    explanation: |
      The range on level ground depends on the product of the horizontal velocity component and the flight time, which is proportional to sin θ cos θ. Since sin 30° cos 30° = sin 60° cos 60°, the ranges are equal: the 60° ball stays in the air longer but moves forward more slowly. The 60° ball rises higher.
