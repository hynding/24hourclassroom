    points: 1
    prompt: |
      True or false: Two fully submerged objects of the same volume, one aluminum and one lead, experience buoyant forces of different sizes in the same water because the objects have different densities.
    answer: false
    explanation: |
      False. The buoyant force equals the weight of the fluid displaced, F_b = ρ_fluid V g. Both objects displace the same volume of the same water, so the buoyant forces are equal. The object's density decides whether it sinks or floats (by comparing its weight with F_b), not the size of the buoyant force.
