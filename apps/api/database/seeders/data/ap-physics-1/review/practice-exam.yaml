week: 34
description: |
  A full practice final: 70 questions · about 3 hours 45 minutes · all eight units. Questions 1–47 are a mock
  AP Physics 1 exam in the May 2027 format. The real exam is on Wednesday, May 5, 2027 (2027-05-05), in the
  afternoon session, and is hybrid digital: multiple-choice answers are selected in the Bluebook app, and the
  free-response questions are read in Bluebook but answered by hand in a paper booklet, so draw diagrams and
  graphs and show your algebra on paper. Calculators are allowed throughout, and the equation sheet and table
  of information (g = 9.8 m/s², G, the density of water and atmospheric pressure) are provided. Section I,
  questions 1–42, is 42 four-option multiple-choice questions in 1 hour 25 minutes, 50% of the score, in
  roughly the AP unit proportions (5 on Unit 1, 9 on Unit 2, 8 on Unit 3, 5 on Unit 4, 5 on Unit 5, 3 on
  Unit 6, 2 on Unit 7, 5 on Unit 8) and including three sets of three questions on one shared situation:
  questions 10–12 on a cart pulled by a hanging mass, questions 18–20 on a skateboarder on a ramp, and
  questions 38–40 on a block weighed in water. Section II, questions 43–47, is the four free-response
  questions in 1 hour 35 minutes, 50% of the score: question 43 is Mathematical Routines (10 points, a box
  sliding down a rough ramp); questions 44 and 45 together are Translation Between Representations (12
  points: parts A–C in question 44, part D in question 45, a student on a scale in an elevator); question
  46 is Experimental Design and Analysis (10 points, the spring constant from oscillation periods); question
  47 is Qualitative/Quantitative Translation (8 points, a disk and a hoop rolling down a ramp). Questions
  48–70 (about 45 minutes) are not AP format: select-all, true/false, numeric, fill-in-the-blank and
  short-answer practice across all eight units, including a shared-context set on a cart collision, so that
  the final also rehearses every other item type in the course. Multiple choice, select-all, true/false and
  numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers (3
  points each) and the free-response questions (scored against a point-by-point guide in the AP style) are
  graded by your teacher. Use g = 9.8 m/s² unless a question says otherwise, and round as each prompt asks.
questions:
  # ---- Section I: multiple choice (q01-q42). Unit 1: q01-q05.
  - slug: apphys1-final-q01
    type: multiple_choice
    topic_code: "1.2"
    source: "AP Physics 1 CED, Topic 1.2"
    points: 1
    prompt: |
      A delivery robot rolls 120 m east along a corridor in 8.0 s, then turns around and rolls 40 m west in 4.0 s. What is its average velocity for the whole 12.0 s trip?
    options:
      - "13 m/s east"
      - "2.5 m/s east"
      - "6.7 m/s east"
      - "12.5 m/s east"
    option_explanations:
      - |
        This divides the total distance travelled, 160 m, by 12.0 s. That is the average speed; average velocity uses displacement, which subtracts the westward leg.
      - |
        This averages the two leg velocities, +15 m/s and −10 m/s. The legs last different times, so their velocities cannot simply be averaged; use total displacement over total time.
      - |
        Correct. Displacement = +120 m − 40 m = +80 m (east). Average velocity = Δx/Δt = 80 m / 12.0 s ≈ 6.7 m/s east.
      - |
        This averages the two leg speeds, 15 m/s and 10 m/s, ignoring both direction and the unequal durations. Average velocity is total displacement divided by total time.
    answer: 2
  - slug: apphys1-final-q02
    type: multiple_choice
    topic_code: "1.3"
    source: "AP Physics 1 CED, Topic 1.3"
    points: 1
    prompt: |
      A motion sensor records a cart's velocity. The velocity–time graph is a straight line rising from 0 m/s at t = 0 to 6.0 m/s at t = 3.0 s, then a horizontal line at 6.0 m/s from t = 3.0 s to t = 5.0 s. What is the cart's displacement from t = 0 to t = 5.0 s?
    options:
      - "21 m"
      - "30 m"
      - "15 m"
      - "12 m"
    option_explanations:
      - |
        Correct. Displacement is the area under the v–t graph: a triangle ½ × 3.0 s × 6.0 m/s = 9.0 m plus a rectangle 2.0 s × 6.0 m/s = 12 m, for 21 m.
      - |
        This multiplies the final velocity by the whole 5.0 s, as if the cart had moved at 6.0 m/s from the start. The first 3.0 s is a triangle, not a rectangle.
      - |
        This uses the average of 0 and 6.0 m/s, 3.0 m/s, for the whole 5.0 s. The cart averaged 3.0 m/s only during the speeding-up part.
      - |
        This counts only the constant-velocity rectangle from 3.0 s to 5.0 s and leaves out the 9.0 m covered while the cart was speeding up.
    answer: 0
  - slug: apphys1-final-q03
    type: multiple_choice
    topic_code: "1.4"
    source: "AP Physics 1 CED, Topic 1.4"
    points: 1
    prompt: |
      A kayaker points her kayak straight across a 60 m wide river and paddles at 3.0 m/s relative to the water. The river flows parallel to the banks at 4.0 m/s relative to the shore. How long does she take to reach the other bank?
    options:
      - "12 s"
      - "15 s"
      - "60 s"
      - "20 s"
    option_explanations:
      - |
        This divides 60 m by 5.0 m/s, her speed relative to the shore. Only the across-river component, 3.0 m/s, carries her across; the current moves her downstream, not across.
      - |
        This divides 60 m by the current's 4.0 m/s. The current is parallel to the banks, so it adds no motion toward the far bank.
      - |
        This divides 60 m by 1.0 m/s, as if the current subtracted from her paddling speed. The current is perpendicular to her heading, so it neither helps nor hinders her crossing.
      - |
        Correct. The across-river velocity component is her 3.0 m/s relative to the water; the current is perpendicular and only carries her downstream. t = 60 m / 3.0 m/s = 20 s.
    answer: 3
  - slug: apphys1-final-q04
    type: multiple_choice
    topic_code: "1.5"
    source: "AP Physics 1 CED, Topic 1.5"
    points: 1
    prompt: |
      A marble rolls off the edge of a horizontal table 1.2 m high at 2.0 m/s. Air resistance is negligible. How far from the base of the table does it land?
    options:
      - "0.70 m"
      - "0.99 m"
      - "0.49 m"
      - "2.0 m"
    option_explanations:
      - |
        This uses t = √(h/g) ≈ 0.35 s, dropping the factor of 2 from h = ½gt². With t = √(2h/g) the fall takes 0.49 s.
      - |
        Correct. Vertical: 1.2 m = ½(9.8 m/s²)t², so t = √(2 × 1.2/9.8) ≈ 0.49 s. Horizontal: x = vₓt = 2.0 m/s × 0.49 s ≈ 0.99 m.
      - |
        This uses t = 2h/g ≈ 0.24 s, forgetting the square root when solving h = ½gt² for t.
      - |
        This assumes the fall lasts 1.0 s. The time comes from the vertical motion alone: t = √(2h/g) ≈ 0.49 s.
    answer: 1
  - slug: apphys1-final-q05
    type: multiple_choice
    topic_code: "1.5"
    source: "AP Physics 1 CED, Topic 1.5"
    points: 1
    prompt: |
      A soccer ball is kicked at an angle above level ground and follows a parabolic path. Air resistance is negligible. Which statement describes the ball at the highest point of its flight?
    options:
      - "Its velocity and its acceleration are both zero."
      - "Its velocity is zero and its acceleration is 9.8 m/s² downward."
      - "Its velocity is horizontal and its acceleration is 9.8 m/s² downward."
      - "Its velocity is horizontal and its acceleration is zero."
    option_explanations:
      - |
        Only the vertical velocity component is zero at the top; the horizontal component never changes. And gravity still acts, so the acceleration is not zero.
      - |
        The acceleration is right, but the velocity is not zero: the horizontal component of the launch velocity is unchanged throughout the flight, so the ball is still moving forward.
      - |
        Correct. At the top the vertical component is momentarily zero, leaving only the constant horizontal component; gravity still gives a downward acceleration of 9.8 m/s² at every point of the flight.
      - |
        The velocity is right, but confusing "not moving vertically" with "no acceleration" is a classic error: the vertical velocity is changing from upward to downward at that instant, so the acceleration is 9.8 m/s² downward.
    answer: 2
  # ---- Unit 2: q06-q14. Shared-situation set on a cart and hanging mass (q10-q12).
  - slug: apphys1-final-q06
    type: multiple_choice
    topic_code: "2.1"
    source: "AP Physics 1 CED, Topic 2.1"
    points: 1
    prompt: |
      A light rod 0.80 m long has a 2.0 kg mass fixed at its left end (x = 0) and a 6.0 kg mass fixed at its right end (x = 0.80 m). Where is the centre of mass of the system, measured from the left end?
    options:
      - "0.40 m"
      - "0.20 m"
      - "0.53 m"
      - "0.60 m"
    option_explanations:
      - |
        This is the midpoint of the rod, which would be the centre of mass only if the two masses were equal. The heavier mass pulls the centre of mass toward the right end.
      - |
        This weights the position toward the lighter mass, using (2.0 × 0.80)/8.0. The centre of mass lies closer to the heavier mass, not the lighter one.
      - |
        This splits the rod in a 2 : 1 ratio, as if one mass were twice the other. The masses are in a 3 : 1 ratio, so the centre of mass is three-quarters of the way to the heavy end.
      - |
        Correct. x_cm = (m₁x₁ + m₂x₂)/(m₁ + m₂) = (2.0 × 0 + 6.0 × 0.80)/(8.0) = 4.8/8.0 = 0.60 m from the left end.
    answer: 3
  - slug: apphys1-final-q07
    type: multiple_choice
    topic_code: "2.2"
    source: "AP Physics 1 CED, Topic 2.2"
    points: 1
    prompt: |
      A crate sits at rest on a loading ramp tilted at 20° above the horizontal. Which list gives every force exerted on the crate, and no others?
    options:
      - "A downward gravitational force from Earth, a normal force perpendicular to the ramp surface, and a static friction force directed up the ramp"
      - "A downward gravitational force, a normal force perpendicular to the ramp surface, a static friction force up the ramp, and a separate force directed down the ramp"
      - "A downward gravitational force and an upward normal force of equal magnitude"
      - "A downward gravitational force, a normal force perpendicular to the ramp surface, and a static friction force directed down the ramp"
    option_explanations:
      - |
        Correct. Three objects interact with the crate: Earth (gravity, straight down), the ramp surface pushing perpendicular to itself (normal force) and the ramp surface resisting sliding (static friction, up the slope). Their vector sum is zero.
      - |
        The "force down the ramp" is the component of gravity along the slope, already counted in the gravitational force. Drawing it again double-counts gravity; every force on a free-body diagram must have an object exerting it.
      - |
        This treats the normal force as always vertical and equal to mg. On a ramp the normal force is perpendicular to the surface and equals mg cos 20°, and without friction the crate would slide.
      - |
        Static friction opposes the direction the crate would slide. Without friction the crate would slide down, so static friction points up the ramp.
    answer: 0
  - slug: apphys1-final-q08
    type: multiple_choice
    topic_code: "2.3"
    source: "AP Physics 1 CED, Topic 2.3"
    points: 1
    prompt: |
      On an ice rink, an 80 kg adult and a 40 kg child stand at rest facing each other and push off each other's hands. Friction is negligible. Which statement is true during the push?
    options:
      - "The adult pushes the child harder, so the child has the larger acceleration."
      - "The forces have equal magnitudes, and the child's acceleration is twice the adult's."
      - "The forces have equal magnitudes, so the accelerations are equal."
      - "The child pushes the adult harder, because the child moves away faster."
    option_explanations:
      - |
        The larger mass does not exert a larger force. The two pushes are a Newton's third law pair, equal in magnitude and opposite in direction; the child accelerates more because of its smaller mass.
      - |
        Correct. Third law: the forces on the two people are equal in magnitude and opposite. Second law: a = F/m, so the 40 kg child's acceleration is 80/40 = 2 times the adult's.
      - |
        Equal forces do not give equal accelerations when the masses differ: a = F/m, so the half-mass child gets twice the acceleration.
      - |
        Moving away faster is a result of the child's smaller mass, not of a larger push. The two forces are a third-law pair and always have equal magnitudes.
    answer: 1
  - slug: apphys1-final-q09
    type: multiple_choice
    topic_code: "2.4"
    source: "AP Physics 1 CED, Topic 2.4"
    points: 1
    prompt: |
      An elevator car of mass m is being lifted by its cable at a constant speed of 2.0 m/s upward. Air resistance and friction are negligible. How does the tension in the cable compare with the car's weight mg?
    options:
      - "It is greater than mg, because the car is moving upward."
      - "It is less than mg, because the car is not speeding up."
      - "It is equal to mg."
      - "It is zero, because no force is needed to keep a constant velocity."
    option_explanations:
      - |
        This treats force as needed in the direction of motion. Constant velocity means zero acceleration, so by Newton's first law the net force is zero and the tension exactly balances the weight.
      - |
        Not speeding up means zero acceleration, which requires the net force to be zero, not negative. A tension below mg would slow the car down.
      - |
        Correct. Constant velocity means zero acceleration, so the net force is zero (Newton's first law). The only forces are the upward tension and the downward weight, so T = mg.
      - |
        No net force is needed for a constant velocity, but gravity still acts on the car. The cable must supply an upward force equal to mg to make the net force zero.
    answer: 2
  - slug: apphys1-final-q10
    type: multiple_choice
    topic_code: "2.5"
    source: "AP Physics 1 CED, Topic 2.5"
    points: 1
    stimulus: |
      A 1.5 kg cart sits on a horizontal track. A light string tied to the cart runs horizontally over a light, frictionless pulley at the end of the track and down to a hanging 0.50 kg mass. The cart is released from rest and the hanging mass falls. Friction on the cart and air resistance are negligible. Use g = 9.8 m/s².
    prompt: |
      What is the magnitude of the acceleration of the cart?
    options:
      - "2.5 m/s²"
      - "3.3 m/s²"
      - "4.9 m/s²"
      - "9.8 m/s²"
    option_explanations:
      - |
        Correct. Take the cart and hanging mass as one system. The only external force along the direction of motion is the hanging mass's weight, 0.50 × 9.8 = 4.9 N, acting on the total mass 2.0 kg: a = 4.9/2.0 ≈ 2.5 m/s² (2.45 m/s²).
      - |
        This divides 4.9 N by the cart's 1.5 kg alone. The same net force must accelerate both the cart and the hanging mass, 2.0 kg in total.
      - |
        This divides 4.9 N by the hanging 0.50 kg alone, as if the string tension were zero. The string pulls back on the hanging mass, and the force accelerates both objects.
      - |
        Free fall would require the string to be slack. The hanging mass also has to drag the cart, so its acceleration is much less than g.
    answer: 0
  - slug: apphys1-final-q11
    type: multiple_choice
    topic_code: "2.5"
    source: "AP Physics 1 CED, Topic 2.5"
    points: 1
    stimulus: |
      A 1.5 kg cart sits on a horizontal track. A light string tied to the cart runs horizontally over a light, frictionless pulley at the end of the track and down to a hanging 0.50 kg mass. The cart is released from rest and the hanging mass falls. Friction on the cart and air resistance are negligible. Use g = 9.8 m/s².
    prompt: |
      What is the tension in the string while the mass falls?
    options:
      - "4.9 N"
      - "1.2 N"
      - "0 N"
      - "3.7 N"
    option_explanations:
      - |
        This sets the tension equal to the hanging mass's weight, which would be true only if it hung at rest. It accelerates downward, so the tension must be less than its weight.
      - |
        This is the hanging mass times the acceleration, 0.50 × 2.45 ≈ 1.2 N, which is the net force on the hanging mass, not the tension. Tension = mg − ma for that mass.
      - |
        A taut string that accelerates the cart cannot have zero tension; the tension is the only horizontal force on the cart.
      - |
        Correct. The tension is the only horizontal force on the cart: T = m_cart a = 1.5 × 2.45 ≈ 3.7 N. Check with the hanging mass: 4.9 N − T = 0.50 × 2.45, so T ≈ 3.7 N.
    answer: 3
  - slug: apphys1-final-q12
    type: multiple_choice
    topic_code: "2.5"
    source: "AP Physics 1 CED, Topic 2.5"
    points: 1
    stimulus: |
      A 1.5 kg cart sits on a horizontal track. A light string tied to the cart runs horizontally over a light, frictionless pulley at the end of the track and down to a hanging 0.50 kg mass. The cart is released from rest and the hanging mass falls. Friction on the cart and air resistance are negligible. Use g = 9.8 m/s².
    prompt: |
      The hanging mass is replaced with a 1.0 kg mass, twice the original. How does the cart's acceleration change?
    options:
      - "It doubles, to about 4.9 m/s²."
      - "It increases to about 3.9 m/s², less than double."
      - "It does not change, because the cart's mass is unchanged."
      - "It decreases, because the system now has more mass."
    option_explanations:
      - |
        Doubling the hanging mass doubles the pulling force, but it also increases the total mass being accelerated, from 2.0 kg to 2.5 kg, so the acceleration less than doubles.
      - |
        Correct. a = m_hang g/(m_cart + m_hang). New: a = 1.0 × 9.8/2.5 ≈ 3.9 m/s², up from 2.45 m/s², a factor of 1.6. Both the force and the total mass grow.
      - |
        The acceleration depends on the whole system, a = m_hang g/(m_cart + m_hang). The hanging mass appears in both the force and the total mass, so changing it changes a.
      - |
        The total mass does rise, but the driving force rises by a larger factor (double, versus 2.5/2.0 = 1.25 for the mass), so the acceleration increases.
    answer: 1
  - slug: apphys1-final-q13
    type: multiple_choice
    topic_code: "2.7"
    source: "AP Physics 1 CED, Topic 2.7"
    points: 1
    prompt: |
      A 20 kg box rests on a level floor. The coefficient of static friction between box and floor is 0.50 and the coefficient of kinetic friction is 0.30. A student pushes horizontally on the box with a 60 N force. What is the magnitude of the friction force on the box?
    options:
      - "98 N"
      - "59 N"
      - "60 N"
      - "0 N"
    option_explanations:
      - |
        This is the maximum static friction, μ_s mg = 0.50 × 20 × 9.8 = 98 N. Static friction only rises as high as needed; 60 N does not reach the maximum, so friction is just 60 N.
      - |
        This uses kinetic friction, μ_k mg ≈ 59 N, but the box is not sliding: 60 N is less than the 98 N maximum static friction, so the box stays at rest.
      - |
        Correct. The maximum static friction is 0.50 × 20 × 9.8 = 98 N, more than the push, so the box stays at rest. With zero acceleration, static friction exactly balances the push: 60 N.
      - |
        A box at rest under a 60 N push must have a 60 N force opposing it, or it would accelerate. That force is static friction.
    answer: 2
  - slug: apphys1-final-q14
    type: multiple_choice
    topic_code: "2.9"
    source: "AP Physics 1 CED, Topic 2.9"
    points: 1
    prompt: |
      A car rounds a flat (unbanked) curve of radius 40 m at a constant 12 m/s. What is the minimum coefficient of static friction between the tires and the road that keeps the car from skidding?
    options:
      - "0.37"
      - "3.6"
      - "0.031"
      - "0.73"
    option_explanations:
      - |
        Correct. Static friction supplies the centripetal force: μ_s mg = mv²/r, so μ_s = v²/(rg) = 144/(40 × 9.8) ≈ 0.37. The mass cancels.
      - |
        This is v²/r = 3.6 m/s², the centripetal acceleration. Friction is μ_s mg, so the acceleration must still be divided by g.
      - |
        This uses v instead of v² in the centripetal acceleration. a_c = v²/r, and the speed must be squared.
      - |
        This doubles the right answer, as if the centripetal force were 2mv²/r. Centripetal force is mv²/r.
    answer: 0
  # ---- Unit 3: q15-q22. Shared-situation set on a skateboarder on a ramp (q18-q20).
  - slug: apphys1-final-q15
    type: multiple_choice
    topic_code: "3.1"
    source: "AP Physics 1 CED, Topic 3.1"
    points: 1
    prompt: |
      A cyclist speeds up from 4.0 m/s to 12 m/s. By what factor does the cyclist's translational kinetic energy increase?
    options:
      - "3"
      - "8"
      - "6"
      - "9"
    option_explanations:
      - |
        The speed triples, but kinetic energy is ½mv², which depends on the square of the speed, so it increases by 3² = 9, not 3.
      - |
        This is the change in speed, 12 − 4.0 = 8.0 m/s, read as a factor. The ratio of kinetic energies is (12/4.0)² = 9.
      - |
        This doubles the speed ratio instead of squaring it. K ∝ v², so tripling v multiplies K by 3 × 3 = 9.
      - |
        Correct. K = ½mv², so K₂/K₁ = (v₂/v₁)² = (12/4.0)² = 3² = 9.
    answer: 3
  - slug: apphys1-final-q16
    type: multiple_choice
    topic_code: "3.2"
    source: "AP Physics 1 CED, Topic 3.2"
    points: 1
    prompt: |
      A student pulls a sled 12 m across level snow with a rope that makes a 30° angle above the horizontal. The tension in the rope is a constant 50 N. How much work does the rope do on the sled?
    options:
      - "300 J"
      - "520 J"
      - "600 J"
      - "−520 J"
    option_explanations:
      - |
        This uses sin 30° instead of cos 30°. Work uses the component of force along the displacement, F cos θ, where θ is the angle between the force and the horizontal displacement.
      - |
        Correct. W = Fd cos θ = 50 N × 12 m × cos 30° ≈ 520 J. Only the horizontal component of the tension does work on the horizontal displacement.
      - |
        This ignores the angle and multiplies the full 50 N by 12 m. The vertical component of the tension is perpendicular to the displacement and does no work.
      - |
        The magnitude is right but the sign is wrong. The force's horizontal component points the same way as the displacement, so the work is positive.
    answer: 1
  - slug: apphys1-final-q17
    type: multiple_choice
    topic_code: "3.3"
    source: "AP Physics 1 CED, Topic 3.3"
    points: 1
    prompt: |
      A toy dart launcher's spring has spring constant 200 N/m and is compressed 0.15 m. How much elastic potential energy is stored in the spring?
    options:
      - "2.3 J"
      - "4.5 J"
      - "15 J"
      - "30 J"
    option_explanations:
      - |
        Correct. U_s = ½kx² = ½ × 200 N/m × (0.15 m)² = 2.25 J ≈ 2.3 J.
      - |
        This leaves out the ½ in U_s = ½kx². The spring force grows from zero to kx as it is compressed, so the stored energy is half of kx · x.
      - |
        This uses ½kx without squaring the compression. That has units of newtons, not joules; the energy needs x².
      - |
        This is kx = 30 N, the spring force at full compression, not an energy. U_s = ½kx² = 2.25 J.
    answer: 0
  - slug: apphys1-final-q18
    type: multiple_choice
    topic_code: "3.4"
    source: "AP Physics 1 CED, Topic 3.4"
    points: 1
    stimulus: |
      A 50 kg skateboarder starts from rest at the top of a curved ramp, 3.2 m above the flat ground at its bottom. Take the system to be the skateboarder and Earth, with gravitational potential energy zero at ground level. Use g = 9.8 m/s².
    prompt: |
      If friction and air resistance were negligible, what would the skateboarder's speed be at the bottom of the ramp?
    options:
      - "63 m/s"
      - "5.6 m/s"
      - "7.9 m/s"
      - "31 m/s"
    option_explanations:
      - |
        This is 2gh = 62.7 m²/s², the square of the speed. The speed is its square root, √62.7 ≈ 7.9 m/s.
      - |
        This uses v = √(gh), leaving out the factor of 2 from mgh = ½mv².
      - |
        Correct. mgh = ½mv², so v = √(2gh) = √(2 × 9.8 × 3.2) ≈ 7.9 m/s. The mass cancels, and the ramp's shape does not matter.
      - |
        This uses v = gh = 31, treating the energy equation as linear in v. Setting mgh = ½mv² gives v = √(2gh).
    answer: 2
  - slug: apphys1-final-q19
    type: multiple_choice
    topic_code: "3.4"
    source: "AP Physics 1 CED, Topic 3.4"
    points: 1
    stimulus: |
      A 50 kg skateboarder starts from rest at the top of a curved ramp, 3.2 m above the flat ground at its bottom. Take the system to be the skateboarder and Earth, with gravitational potential energy zero at ground level. Use g = 9.8 m/s².
    prompt: |
      Still assuming no friction, a student draws energy bar charts for the system at the top and at the point 1.6 m above the ground. Which bar chart is correct for the point 1.6 m above the ground?
    options:
      - "U_g is zero and K equals the full initial energy, because the skateboarder is moving."
      - "U_g is half its initial value and K is zero, because the speed is still small."
      - "K is greater than U_g, because the skateboarder has been speeding up since the top."
      - "K and U_g are equal, each half of the initial total energy."
    option_explanations:
      - |
        U_g depends on height, not motion. At 1.6 m the skateboarder is still above ground level, so U_g is not zero; that chart fits the bottom of the ramp.
      - |
        The total mechanical energy is constant with no friction. If U_g has dropped to half, the missing half must appear as kinetic energy, so K cannot be zero.
      - |
