    stimulus: |
      A 55 kg student stands on a bathroom scale on the floor of an elevator that starts at rest on the ground floor and rises to a higher floor. A motion sensor in the elevator records its upward velocity: 0 m/s at t = 0, rising steadily to 3.0 m/s at t = 2.0 s; constant at 3.0 m/s from t = 2.0 s to t = 8.0 s; then falling steadily to 0 m/s at t = 11.0 s, when the elevator stops. Upward is positive. Use g = 9.8 m/s².
