    prompt: |
      A runner slows down to half of her original speed. Her translational kinetic energy becomes one ____ of its original value. (One word.)
    answer:
      - "fourth"
      - "quarter"
      - "4th"
    explanation: |
      K = ½mv², so K is proportional to v². Halving v multiplies K by (½)² = ¼: one fourth (one quarter) of the original.
