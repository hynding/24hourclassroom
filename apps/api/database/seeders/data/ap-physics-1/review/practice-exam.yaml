    prompt: |
      A textbook rests on a level desk. A student says, "The normal force from the desk on the book and the gravitational force on the book are equal and opposite, so they are a Newton's third law pair."

      (a) Explain why the student is wrong about the third law pair.

      (b) Identify the force that does form a third law pair with the gravitational force on the book, and the force that forms a pair with the normal force on the book, naming the object each acts on.
    answer: |
      (a) The two forces are equal and opposite here because the book is in equilibrium (Newton's first law), not because of the third law. Both act on the same object, the book, while a third law pair always acts on two different objects; they are also different types of interaction (gravitational and contact). If the desk accelerated upward, the normal force would exceed the weight, but third law pairs are equal in every situation.
