      (B) 2 points: 1 for writing Newton's second law with the forces from the diagram and consistent signs (F_N − mg = ma); 1 for the expression F_N = m(g + a). An expression that does not follow from the student's own diagram earns at most 1 point.
      (C) 4 points: 1 for the three accelerations from the slopes (+1.5, 0 and −1.0 m/s²), with the sign of the last one; 1 each for the three scale readings: about 620 N, 539 N and 484 N (accept 2–3 significant figures). A wrong acceleration used correctly in the student's part (B) expression still earns the reading points.
