  - slug: apphys1-final-q46
    type: long_answer
    topic_code: "7.2"
    source: "AP Physics 1 CED, Topics 7.1 and 7.2"
    points: 10
    stimulus: |
      A lab group wants to find the spring constant k of a spring by making it oscillate, without measuring any stretch. They hang the spring from a clamp stand and have a set of slotted masses, a balance, a stopwatch and a meterstick. The mass of the spring itself is small. For each hanging mass m they pull the mass down a little, release it and time 10 complete oscillations. Their data:

      | Hanging mass m (kg) | Time for 10 oscillations (s) |
      |---|---|
      | 0.100 | 4.05 |
      | 0.200 | 5.66 |
      | 0.300 | 6.90 |
      | 0.400 | 7.98 |
      | 0.500 | 8.93 |
    prompt: |
      Free-response question 3: Experimental Design and Analysis.

      (A) Describe a procedure the group could follow to collect these data. State what is measured and with which equipment, and describe one step that reduces the uncertainty in the period.

      (B) Indicate which quantities the group should plot on each axis to obtain a straight line whose slope can be used to find k. Justify your choice with an equation.

      (C) Make a table of the quantities you chose in part (B), and use it to calculate the slope of the best-fit line, with units.

      (D) Use your slope to calculate the spring constant k.

      (E) Suppose the spring's own mass were not negligible. Describe how, if at all, this would change the line on your graph, and whether it would change the value of k you obtain from the slope.
    answer: |
      (A) Measure each hanging mass on the balance. Hang it from the spring, pull it down a small distance (a few centimetres) and release it from rest. Start the stopwatch as the mass passes a reference point (for example, the equilibrium position marked against the meterstick) and stop it after 10 complete oscillations; divide by 10 to get the period. Timing many oscillations spreads the reaction-time error over 10 periods; repeating each timing two or three times and averaging also helps. Repeat for at least five different masses.
      (B) For a mass on a spring, T = 2π√(m/k), so T² = (4π²/k)m. Plot T² on the vertical axis and m on the horizontal axis: the graph is a straight line through the origin with slope 4π²/k.
      (C) Periods T = (time for 10)/10: 0.405, 0.566, 0.690, 0.798, 0.893 s. T² values: 0.164, 0.320, 0.476, 0.637, 0.797 s² for m = 0.100, 0.200, 0.300, 0.400, 0.500 kg. Slope of the best-fit line ≈ (0.797 − 0.164)/(0.500 − 0.100) ≈ 1.58 s²/kg (a least-squares fit also gives 1.58 s²/kg).
      (D) slope = 4π²/k, so k = 4π²/slope = 39.5/1.58 ≈ 25 N/m.
      (E) Some of the spring's own mass also oscillates, so each T² would be a little larger than predicted from m alone: the line would be shifted up and have a small positive vertical intercept. The slope, and therefore the value of k, would be essentially unchanged.
    explanation: |
      Ten points.
      (A) 3 points: 1 for measuring the hanging mass with the balance and the period with the stopwatch (the meterstick may be used to keep the amplitude small and mark a reference point); 1 for a clear, repeatable method: small displacement, release from rest, time a set number of oscillations, repeat for several (at least five) masses; 1 for an uncertainty-reducing step with a reason: timing 10 or more oscillations and dividing, or repeating trials and averaging, or starting the timer at the equilibrium position where the mass moves fastest.
      (B) 2 points: 1 for T² against m (or m against T², or T against √m with the matching slope); 1 for the justification T = 2π√(m/k), so T² = (4π²/k)m is linear in m. Plotting T against m, with no linearisation, earns 0 for (B).
      (C) 3 points: 1 for computing the periods (dividing by 10); 1 for a correct T² column; 1 for a slope between 1.5 and 1.7 s²/kg found from the line (not from a single data point through the origin), with units.
      (D) 1 point: for k = 4π²/slope ≈ 25 N/m (accept 23–27 N/m, consistent with the student's slope), with units.
      (E) 1 point: requires both: a positive intercept (the line shifts up) and the slope, hence k, essentially unchanged.
  - slug: apphys1-final-q47
    type: long_answer
    topic_code: "6.5"
    source: "AP Physics 1 CED, Topics 6.1 and 6.5"
    points: 8
    stimulus: |
      A uniform solid disk and a thin hoop have the same mass M and the same radius R. They are released together from rest at the top of the same ramp, a vertical height h above the bottom, and both roll down without slipping. The rotational inertia of the disk about its centre is ½MR² and that of the hoop is MR². Air resistance and rolling friction are negligible.
    prompt: |
      Free-response question 4: Qualitative/Quantitative Translation.

      (A) Without deriving or using equations, explain which object reaches the bottom of the ramp first, or whether they arrive together. Your answer should refer to how each object's energy is shared between translation and rotation.

      (B) For an object of mass M and radius R whose rotational inertia is I = βMR² (β is a number), derive an expression for its speed at the bottom of the ramp in terms of β, g and h.

      (C) Explain how your expression from part (B) supports your reasoning in part (A), and use it to explain whether a larger disk of the same material would reach the bottom sooner than this one.
    answer: |
      (A) The disk arrives first. Both objects lose the same gravitational potential energy (same M and h), and rolling without slipping ties rotation to translation, so each object's kinetic energy is split between moving forward and spinning. The hoop has all of its mass at the rim, far from the axis, so it has a larger rotational inertia and must put a larger share of its energy into rotation. That leaves it less translational kinetic energy, so at every height it moves more slowly than the disk, and it reaches the bottom later.
      (B) Energy conservation for the object–Earth system (static friction does no work when there is no slipping): Mgh = ½Mv² + ½Iω². Rolling without slipping: ω = v/R. With I = βMR²: Mgh = ½Mv² + ½βMR²(v/R)² = ½Mv²(1 + β), so v = √(2gh/(1 + β)).
      (C) The disk has β = ½ and the hoop β = 1. A larger β gives a smaller speed at the bottom, and the same is true at every height, so the hoop is slower all the way down and the disk arrives first, as argued in (A): the (1 + β) factor is the share given to rotation. For h = 0.50 m, for example, the disk reaches 2.6 m/s and the hoop 2.2 m/s. M and R cancel, so a larger disk (same shape, β = ½) has the same speed at every height and reaches the bottom at the same time, not sooner.
    explanation: |
      Eight points.
      (A) 3 points: 1 for the claim that the disk arrives first; 1 for stating that both start with the same gravitational potential energy, which becomes both translational and rotational kinetic energy; 1 for explaining that the hoop's mass is farther from the axis (larger rotational inertia), so a larger fraction goes into rotation, leaving less translational kinetic energy and a lower speed. Arguments based on "the heavier object" or on friction earn 0 for the reasoning points.
      (B) 3 points: 1 for an energy conservation statement including both ½Mv² and ½Iω²; 1 for using ω = v/R; 1 for the correct expression v = √(2gh/(1 + β)), or an equivalent form.
      (C) 2 points: 1 for connecting the expression to (A): the larger β of the hoop gives a smaller speed (the denominator 1 + β is the energy shared with rotation), so the disk is faster and arrives first; 1 for noting that M and R cancel, so a larger disk arrives at the same time. A part (C) that contradicts part (A) without acknowledging it earns at most 1 point.
