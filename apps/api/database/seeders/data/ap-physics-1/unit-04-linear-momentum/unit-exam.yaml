unit: 4
description: |
  41 questions · about 90 minutes · every topic of Unit 4 (4.1 to 4.4): momentum of objects and systems and the
  velocity of the centre of mass, impulse and force–time graphs, Newton's second law in momentum form,
  conservation of momentum (choosing systems, recoil, explosions, sticking collisions, two dimensions), and
  elastic, inelastic and perfectly inelastic collisions, including two-stage collision-then-energy problems.
  Includes two shared-context sets (a four-question set on a cart rebounding from a force sensor and a
  four-question set on two carts that collide and stick), select-all, true/false, fill-in-the-blank and numeric
  items, two short-answer questions (3 points each) and two free-response questions in the 2027 AP style
  (10 points each: one experimental design and analysis question on impulse and momentum, one mathematical
  routines question on a collision followed by a spring compression). Use g = 9.8 m/s². Calculators and the
  equation sheet are allowed throughout. Multiple choice, select-all, true/false and numeric items are graded at
  once; fill-in-the-blank items are matched automatically; the short answers and free-response questions are
  graded by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: a cart rebounds from a force sensor (4.2, 4.4)
  - slug: apphys1-u04-exam-q01
    type: multiple_choice
    topic_code: "4.2"
    source: "AP Physics 1 CED, Topic 4.2"
    points: 1
    stimulus: |
      A lab group mounts a force sensor with a spring bumper at the end of a level track. A 0.40 kg cart rolls toward the sensor at 0.75 m/s, compresses the bumper and rebounds at 0.60 m/s. Friction is negligible. The sensor's force–time graph is a triangle: the force rises in a straight line from zero to a peak and falls back to zero, and the cart is in contact with the bumper for 0.12 s. Take the direction away from the sensor as positive.
    prompt: |
      What is the magnitude of the impulse the bumper exerts on the cart?
    options:
      - "0.060 N·s"
      - "0.30 N·s"
      - "0.54 N·s"
      - "0.24 N·s"
    option_explanations:
      - |
        0.060 N·s subtracts the speeds, 0.40 × (0.75 − 0.60); the velocity reverses, so the changes add.
      - |
        0.30 N·s is only the incoming momentum (0.40 × 0.75); the bumper must also send the cart back.
      - |
        Correct. J = Δp = m(v_f − v_i) = 0.40 × (0.60 − (−0.75)) = 0.40 × 1.35 = 0.54 N·s, away from the sensor.
      - |
        0.24 N·s is only the rebound momentum (0.40 × 0.60); the impulse must also stop the incoming motion.
    answer: 2
  - slug: apphys1-u04-exam-q02
    type: multiple_choice
    topic_code: "4.2"
    source: "AP Physics 1 CED, Topic 4.2"
    points: 1
    stimulus: |
      A lab group mounts a force sensor with a spring bumper at the end of a level track. A 0.40 kg cart rolls toward the sensor at 0.75 m/s, compresses the bumper and rebounds at 0.60 m/s. Friction is negligible. The sensor's force–time graph is a triangle: the force rises in a straight line from zero to a peak and falls back to zero, and the cart is in contact with the bumper for 0.12 s. Take the direction away from the sensor as positive.
    prompt: |
      What is the peak force shown on the sensor's graph?
    options:
      - "9.0 N"
      - "4.5 N"
      - "0.065 N"
      - "18 N"
    option_explanations:
      - |
        Correct. The area of the triangle equals the impulse: ½ × 0.12 s × F_peak = 0.54 N·s, so F_peak = 2 × 0.54/0.12 = 9.0 N.
      - |
        4.5 N is the average force (0.54/0.12); the peak of a triangular pulse is twice the average.
      - |
        0.065 multiplies the impulse by the contact time; a force comes from dividing the area by the time.
      - |
        18 N doubles the peak again, as if the triangle's area were a quarter of base × height; it is one half.
    answer: 0
  - slug: apphys1-u04-exam-q03
    type: multiple_choice
    topic_code: "4.2"
    source: "AP Physics 1 CED, Topic 4.2"
    points: 1
    stimulus: |
      A lab group mounts a force sensor with a spring bumper at the end of a level track. A 0.40 kg cart rolls toward the sensor at 0.75 m/s, compresses the bumper and rebounds at 0.60 m/s. Friction is negligible. The sensor's force–time graph is a triangle: the force rises in a straight line from zero to a peak and falls back to zero, and the cart is in contact with the bumper for 0.12 s. Take the direction away from the sensor as positive.
    prompt: |
      The group replaces the bumper with a stiffer one. The cart arrives and leaves with the same speeds as before, but the contact time is 0.06 s. How do the impulse and the peak force compare with the first run?
    options:
      - "The impulse halves and the peak force is unchanged."
      - "The impulse doubles and the peak force doubles."
      - "The impulse and the peak force are both unchanged."
      - "The impulse is unchanged and the peak force doubles."
    option_explanations:
      - |
        The impulse equals the change in momentum, which is the same because the speeds are the same; the shorter time affects the force.
      - |
        The impulse is fixed by Δp, so it cannot double; only the force changes.
      - |
        The same impulse squeezed into half the time requires a larger force; the triangle must be twice as tall for the same area.
      - |
        Correct. Same Δp means the same impulse (area). Halving the base of the triangle at the same area doubles its height, so F_peak doubles to 18 N.
    answer: 3
  - slug: apphys1-u04-exam-q04
    type: multiple_choice
    topic_code: "4.4"
    source: "AP Physics 1 CED, Topic 4.4"
    points: 1
    stimulus: |
      A lab group mounts a force sensor with a spring bumper at the end of a level track. A 0.40 kg cart rolls toward the sensor at 0.75 m/s, compresses the bumper and rebounds at 0.60 m/s. Friction is negligible. The sensor's force–time graph is a triangle: the force rises in a straight line from zero to a peak and falls back to zero, and the cart is in contact with the bumper for 0.12 s. Take the direction away from the sensor as positive.
    prompt: |
      Which statement best describes the cart–bumper collision?
    options:
      - "It is elastic, because the cart rebounds."
      - "It is inelastic: the cart's kinetic energy falls from about 0.113 J to 0.072 J, so about 0.041 J becomes internal energy."
      - "It is perfectly inelastic, because the cart's momentum changes direction."
      - "It is elastic, because momentum is conserved."
    option_explanations:
      - |
        A rebound alone does not make a collision elastic; the cart leaves slower than it arrived, so kinetic energy was lost.
      - |
        Correct. K_before = ½(0.40)(0.75)² ≈ 0.113 J and K_after = ½(0.40)(0.60)² = 0.072 J; the 0.041 J difference (about 36%) became internal energy in the bumper and cart.
      - |
        Perfectly inelastic means the objects stick together; the cart separates from the bumper.
      - |
        Momentum conservation (for cart + track + Earth) holds in every collision; elastic means the kinetic energy is unchanged, which it is not.
    answer: 1
  # ---- Stimulus set B: two carts collide and stick (4.1, 4.3, 4.4)
  - slug: apphys1-u04-exam-q05
    type: multiple_choice
    topic_code: "4.1"
    source: "AP Physics 1 CED, Topic 4.1"
    points: 1
    stimulus: |
      On a level track with negligible friction, cart X (0.60 kg) moves to the right at 0.50 m/s and cart Y (0.40 kg) moves to the left at 0.25 m/s, toward cart X. The carts have Velcro pads and stick together when they collide. Take right as positive.
    prompt: |
      What is the total momentum of the two-cart system before the collision?
    options:
      - "+0.40 kg·m/s"
      - "+0.20 kg·m/s"
      - "+0.125 kg·m/s"
      - "+0.30 kg·m/s"
    option_explanations:
      - |
        0.40 kg·m/s adds the magnitudes 0.30 + 0.10; cart Y moves left, so its momentum is negative.
      - |
        Correct. p = (0.60)(+0.50) + (0.40)(−0.25) = 0.30 − 0.10 = +0.20 kg·m/s.
      - |
        0.125 is the plain average of the two velocities, (0.50 − 0.25)/2, in m/s; it is not a momentum.
      - |
        0.30 kg·m/s is cart X's momentum alone; cart Y is part of the system too.
    answer: 1
  - slug: apphys1-u04-exam-q06
    type: multiple_choice
    topic_code: "4.3"
    source: "AP Physics 1 CED, Topic 4.3"
    points: 1
    stimulus: |
      On a level track with negligible friction, cart X (0.60 kg) moves to the right at 0.50 m/s and cart Y (0.40 kg) moves to the left at 0.25 m/s, toward cart X. The carts have Velcro pads and stick together when they collide. Take right as positive.
    prompt: |
      What is the velocity of the joined carts just after the collision?
    options:
      - "+0.40 m/s"
      - "+0.125 m/s"
      - "+0.50 m/s"
      - "+0.20 m/s"
    option_explanations:
      - |
        +0.40 m/s divides by 0.50 kg or adds the momentum magnitudes; the total momentum is 0.20 kg·m/s shared by 1.00 kg.
      - |
        +0.125 m/s averages the velocities without weighting by mass.
      - |
        The joined carts cannot keep cart X's speed; cart Y's opposite momentum and extra mass slow them.
      - |
        Correct. Momentum is conserved: 0.20 kg·m/s = (1.00 kg)v, so v = +0.20 m/s.
    answer: 3
  - slug: apphys1-u04-exam-q07
    type: multiple_choice
    topic_code: "4.1"
    source: "AP Physics 1 CED, Topic 4.1"
    points: 1
    stimulus: |
      On a level track with negligible friction, cart X (0.60 kg) moves to the right at 0.50 m/s and cart Y (0.40 kg) moves to the left at 0.25 m/s, toward cart X. The carts have Velcro pads and stick together when they collide. Take right as positive.
    prompt: |
      How does the velocity of the system's centre of mass before the collision compare with its velocity after?
    options:
      - "It is +0.20 m/s both before and after."
      - "It is +0.125 m/s before and +0.20 m/s after."
      - "It is zero before, because the carts move toward each other, and +0.20 m/s after."
      - "It is +0.50 m/s before and +0.20 m/s after, because the collision slows it."
    option_explanations:
      - |
        Correct. v_cm = p_sys/M = 0.20/1.00 = +0.20 m/s before; the system is isolated, so p_sys and therefore v_cm are unchanged.
      - |
        0.125 m/s is the unweighted average of the velocities; v_cm weights each by mass and equals 0.20 m/s.
      - |
        The momenta do not cancel (0.30 versus 0.10 kg·m/s), so the centre of mass is already moving right at 0.20 m/s.
      - |
        0.50 m/s is cart X's velocity alone; internal collision forces cannot change the centre-of-mass velocity.
    answer: 0
  - slug: apphys1-u04-exam-q08
    type: multiple_choice
    topic_code: "4.4"
    source: "AP Physics 1 CED, Topic 4.4"
    points: 1
    stimulus: |
      On a level track with negligible friction, cart X (0.60 kg) moves to the right at 0.50 m/s and cart Y (0.40 kg) moves to the left at 0.25 m/s, toward cart X. The carts have Velcro pads and stick together when they collide. Take right as positive.
    prompt: |
      How much of the system's kinetic energy is converted to internal energy in the collision?
    options:
      - "0.020 J"
      - "0 J"
      - "0.068 J"
      - "0.088 J"
    option_explanations:
      - |
        0.020 J is the kinetic energy remaining after the collision, ½(1.00)(0.20)², not the amount converted.
      - |
        Momentum is conserved, but a sticking collision always converts some kinetic energy; it is perfectly inelastic.
      - |
        Correct. K_before = ½(0.60)(0.50)² + ½(0.40)(0.25)² = 0.075 + 0.0125 = 0.0875 J; K_after = 0.020 J; converted ≈ 0.068 J.
      - |
        0.088 J is the whole initial kinetic energy; the joined carts still move at 0.20 m/s and keep 0.020 J.
    answer: 2
  # ---- Independent items
  - slug: apphys1-u04-exam-q09
    type: multiple_choice
    topic_code: "4.1"
    source: "AP Physics 1 CED, Topic 4.1"
    points: 1
    prompt: |
      A 60 kg sprinter runs north at 5.0 m/s. What is her momentum?
    options:
      - "750 kg·m/s north"
      - "12 kg·m/s north"
      - "1500 kg·m/s north"
      - "300 kg·m/s north"
    option_explanations:
      - |
        750 is her kinetic energy in joules, ½(60)(5.0)²; momentum is mv with no ½ and no square.
      - |
        12 divides the mass by the speed; momentum is the product of mass and velocity.
      - |
        1500 is mv², which is twice the kinetic energy, not the momentum.
      - |
        Correct. p = mv = 60 kg × 5.0 m/s = 300 kg·m/s, in the direction of her velocity (north).
    answer: 3
  - slug: apphys1-u04-exam-q10
    type: multiple_choice
    topic_code: "4.1"
    source: "AP Physics 1 CED, Topic 4.1"
    points: 1
    prompt: |
      A skateboarder speeds up until her kinetic energy is four times what it was. By what factor has the magnitude of her momentum changed?
    options:
      - "It has quadrupled."
      - "It has doubled."
      - "It is unchanged."
      - "It has increased by a factor of 16."
    option_explanations:
      - |
        Momentum is proportional to speed, while kinetic energy is proportional to speed squared, so they do not grow by the same factor.
      - |
        Correct. K ∝ v², so four times the kinetic energy means twice the speed; p = mv then doubles (equivalently p = √(2mK)).
      - |
        Her speed increased, so her momentum must increase too.
      - |
        16 squares the factor of 4; the speed has only doubled, and momentum is proportional to speed.
    answer: 1
  - slug: apphys1-u04-exam-q11
    type: multiple_choice
    topic_code: "4.1"
    source: "AP Physics 1 CED, Topic 4.1"
    points: 1
    prompt: |
      Three carts move on the same straight track: 1.0 kg at +4.0 m/s, 2.0 kg at −1.0 m/s and 1.0 kg at rest. What is the velocity of the centre of mass of the three-cart system?
    options:
      - "+1.0 m/s"
      - "+1.5 m/s"
      - "+0.50 m/s"
      - "+2.0 m/s"
    option_explanations:
      - |
        +1.0 m/s is the unweighted average of the three velocities, (4.0 − 1.0 + 0)/3; each velocity must be weighted by its mass.
      - |
        +1.5 m/s adds the momentum magnitudes (4.0 + 2.0) and ignores the negative direction of the 2.0 kg cart.
      - |
        Correct. p_sys = (1.0)(4.0) + (2.0)(−1.0) + 0 = 2.0 kg·m/s; v_cm = 2.0/4.0 = +0.50 m/s.
      - |
        2.0 is the total momentum in kg·m/s; it must be divided by the total mass of 4.0 kg.
    answer: 2
  - slug: apphys1-u04-exam-q12
    type: multiple_choice
    topic_code: "4.2"
    source: "AP Physics 1 CED, Topic 4.2"
    points: 1
    prompt: |
      A momentum–time graph for a sled sliding along a straight path is a straight line falling from +4.0 kg·m/s at t = 0 to +1.0 kg·m/s at t = 0.50 s. What is the net force on the sled during this interval?
    options:
      - "−6.0 N"
      - "+6.0 N"
      - "−2.0 N"
      - "−1.5 N"
    option_explanations:
      - |
        Correct. F_net = Δp/Δt = (1.0 − 4.0)/0.50 = −6.0 N: 6.0 N opposite the sled's motion.
      - |
        The momentum is decreasing, so the net force points opposite the motion and is negative.
      - |
        −2.0 N divides the final momentum, not the change in momentum, by the time.
      - |
        −1.5 multiplies Δp by Δt; the net force is the slope Δp/Δt.
    answer: 0
  - slug: apphys1-u04-exam-q13
    type: multiple_choice
    topic_code: "4.2"
    source: "AP Physics 1 CED, Topic 4.2"
    points: 1
    prompt: |
      A force on a cart is constant at 10 N from t = 0 to t = 0.20 s and then decreases in a straight line to zero at t = 0.30 s. What impulse does the force deliver?
    options:
      - "2.5 N·s"
      - "3.0 N·s"
      - "2.0 N·s"
      - "1.5 N·s"
    option_explanations:
      - |
        Correct. Rectangle: 10 N × 0.20 s = 2.0 N·s. Triangle: ½ × 0.10 s × 10 N = 0.50 N·s. Total area = 2.5 N·s.
      - |
        3.0 N·s treats the whole 0.30 s as a rectangle at 10 N, overcounting the falling section.
      - |
        2.0 N·s is only the rectangle; the falling section still pushes and adds area.
      - |
        1.5 N·s treats the whole graph as one triangle, ½ × 0.30 × 10, undercounting the flat section.
    answer: 0
  - slug: apphys1-u04-exam-q14
    type: multiple_choice
    topic_code: "4.2"
    source: "AP Physics 1 CED, Topic 4.2"
    points: 1
    prompt: |
      Two balls of equal mass hit a wall head-on at the same speed. Ball 1 is clay and sticks to the wall; ball 2 is rubber and bounces straight back at the same speed. How does the impulse the wall exerts on ball 2 compare with the impulse on ball 1?
    options:
      - "It is the same, because the balls arrive with the same momentum."
      - "It is half as large, because a bouncing ball spends less time in contact."
      - "It is twice as large."
      - "It is zero, because ball 2 leaves with the speed it arrived with."
    option_explanations:
      - |
        The incoming momenta match, but the final momenta differ: ball 1 ends at rest, ball 2 ends moving backward.
      - |
        Contact time affects the force, not the impulse; the impulse equals the change in momentum.
      - |
        Correct. Ball 1: |Δp| = mv (stops). Ball 2: |Δp| = m(v − (−v)) = 2mv (reverses). The bounce needs twice the impulse.
      - |
        Equal speed is not equal velocity: the direction reverses, so the change in momentum is 2mv, not zero.
    answer: 2
  - slug: apphys1-u04-exam-q15
    type: multiple_choice
    topic_code: "4.2"
    source: "AP Physics 1 CED, Topic 4.2"
    points: 1
    prompt: |
      A golf club strikes a 0.046 kg ball at rest, and the ball leaves at 60 m/s. The contact lasts 0.50 ms (0.00050 s). What is the magnitude of the average force of the club on the ball?
    options:
      - "2.8 N"
      - "55 N"
      - "11,000 N"
      - "5500 N"
    option_explanations:
      - |
        2.8 is the change in momentum, 0.046 × 60 = 2.76 kg·m/s; it must be divided by the contact time.
      - |
        55 N uses 0.050 s, converting 0.50 ms incorrectly; 0.50 ms is 0.00050 s.
      - |
        11,000 N doubles the answer, as if the ball had rebounded; it started at rest.
      - |
        Correct. F_avg = Δp/Δt = (0.046 × 60)/0.00050 = 2.76/0.00050 ≈ 5500 N.
    answer: 3
  - slug: apphys1-u04-exam-q16
    type: multiple_choice
    topic_code: "4.3"
    source: "AP Physics 1 CED, Topic 4.3"
    points: 1
    prompt: |
      An 80 kg astronaut (including her suit) floats at rest outside a space station and throws a 2.0 kg wrench away from her at 5.0 m/s. What is her speed afterwards?
    options:
      - "5.0 m/s"
      - "0.13 m/s"
      - "200 m/s"
      - "0 m/s, because in space there is nothing to push against"
    option_explanations:
      - |
        Equal speeds would mean unequal momenta; she is 40 times as massive, so she moves 40 times more slowly.
      - |
        Correct. 0 = (2.0)(5.0) + (80)v, so v = −10/80 = −0.125 m/s ≈ 0.13 m/s, opposite the wrench.
      - |
        200 m/s inverts the mass ratio; the more massive object must have the smaller speed.
      - |
        She pushes on the wrench and the wrench pushes back on her; astronaut + wrench is an isolated system, so she recoils.
    answer: 1
  - slug: apphys1-u04-exam-q17
    type: multiple_choice
    topic_code: "4.3"
    source: "AP Physics 1 CED, Topic 4.3"
    points: 1
    prompt: |
      A car speeds up from rest along a level road. Which system's momentum stays constant during the acceleration (ignoring air)?
    options:
      - "The car alone, because its engine is part of it"
      - "The car and Earth together"
      - "The road alone"
      - "No system, because the car's momentum changes"
    option_explanations:
      - |
        The road's friction force on the tyres is external to the car-only system, and it is what speeds the car up; the engine is internal and cannot change the car's momentum by itself.
      - |
        Correct. With Earth (and the road on it) inside the system, the friction pair between tyres and road is internal; Earth gains a tiny backward momentum equal to the car's forward momentum.
      - |
        The road (attached to Earth) feels the tyres' backward push, an external force on a road-only system.
      - |
        One part of a system can change momentum while the total stays constant; choosing car + Earth makes the friction internal.
    answer: 1
  - slug: apphys1-u04-exam-q18
    type: multiple_choice
    topic_code: "4.3"
    source: "AP Physics 1 CED, Topic 4.3"
    points: 1
    prompt: |
      An object at rest on a frictionless horizontal surface explodes into three pieces that slide along the surface. Just afterwards, one piece has momentum 0.60 kg·m/s east and another has 0.80 kg·m/s north. What is the momentum of the third piece?
    options:
      - "1.4 kg·m/s at 53° south of west"
      - "1.0 kg·m/s at 37° south of west"
      - "1.0 kg·m/s at 53° south of west"
      - "1.0 kg·m/s at 53° north of east"
    option_explanations:
      - |
        1.4 adds the perpendicular momenta as if they were parallel; perpendicular components combine by the Pythagorean theorem.
      - |
        The magnitude is right, but the angle below west is tan⁻¹(0.80/0.60) = 53°; 37° measures it from the wrong axis.
      - |
        Correct. The total stays zero, so the third piece has p_x = −0.60 and p_y = −0.80 kg·m/s: magnitude √(0.36 + 0.64) = 1.0 kg·m/s, at tan⁻¹(0.80/0.60) ≈ 53° south of west.
      - |
        That is the direction of the sum of the first two momenta; the third must point the opposite way to cancel it.
    answer: 2
  - slug: apphys1-u04-exam-q19
    type: multiple_choice
    topic_code: "4.3"
    source: "AP Physics 1 CED, Topic 4.3"
    points: 1
    prompt: |
      A momentum bar chart for a collision between pucks A and B on smooth ice shows, in equal units: before, A = +3 and B = −1; after, A = −1. No external horizontal force acts. What should the bar for B after the collision show?
    options:
      - "+1 unit"
      - "+5 units"
      - "+2 units"
      - "+3 units"
    option_explanations:
      - |
        +1 simply reverses B's bar; the system total must stay at +3 − 1 = +2 units, which needs B = +3.
      - |
        +5 adds A's change to the wrong starting value; B gains exactly the 4 units A loses, from −1 to +3.
      - |
        +2 is the system's total momentum, which must equal A + B after, not B alone.
      - |
        Correct. The total before is +3 + (−1) = +2 units; after, −1 + B = +2, so B = +3 units. A lost 4 units and B gained 4.
    answer: 3
  - slug: apphys1-u04-exam-q20
    type: multiple_choice
    topic_code: "4.3"
    source: "AP Physics 1 CED, Topic 4.3"
    points: 1
    prompt: |
      A 60 kg student stands at the stern of a 140 kg rowboat floating at rest on still water. She walks 3.0 m toward the bow, measured along the boat. Ignoring water drag, how far and in which direction does the boat move relative to the water?
    options:
      - "0.90 m toward the stern"
      - "1.3 m toward the stern"
      - "3.0 m toward the stern"
      - "It does not move, because she stays inside the boat."
    option_explanations:
      - |
        Correct. The student + boat system has zero momentum, so its centre of mass stays fixed: 60d_s + 140d_b = 0 with d_s − d_b = 3.0 m gives d_b = −(60 × 3.0)/200 = −0.90 m.
      - |
        1.3 m uses only the boat's mass in the denominator (60 × 3.0/140); her 3.0 m is measured relative to the boat, which is itself moving, so the total mass of 200 kg belongs there.
      - |
        The boat would move the full 3.0 m only if it were massless; with 140 kg it moves much less than she does.
      - |
        Her feet push the boat backward as she walks; momentum conservation for student + boat requires the boat to move toward the stern.
    answer: 0
  - slug: apphys1-u04-exam-q21
    type: multiple_choice
    topic_code: "4.4"
    source: "AP Physics 1 CED, Topic 4.4"
    points: 1
    prompt: |
      Two identical carts move toward each other at 1.0 m/s each on a level, frictionless track and stick together. What is the state of the system just after the collision?
    options:
      - "The carts move together at 1.0 m/s, so no kinetic energy is lost."
