    prompt: |
      Experimental design and analysis. A lab group wants to test the impulse–momentum theorem and use it to find the mass of a cart. They have a cart on a level track, a force sensor with a hook that can be used to give the cart short pulls, a motion sensor, and a computer that records force against time and velocity against time.

      (A) Describe a procedure the group could use to collect data that tests the impulse–momentum theorem. Identify each quantity measured, how it is measured, and one step that reduces experimental uncertainty.

      The group gives the cart five pulls of different strengths, starting from rest each time, and records:

      | Impulse J (N·s) | 0.10 | 0.20 | 0.30 | 0.40 | 0.50 |
      |---|---|---|---|---|---|
      | Change in velocity Δv (m/s) | 0.21 | 0.40 | 0.59 | 0.77 | 0.98 |

      (B) Identify the quantities you would graph to get a straight line whose slope is related to the cart's mass. Describe the graph and calculate the slope of a best-fit line, using two points on the line that are far apart.

      (C) Use the slope to determine the cart's mass, showing how the slope is related to the mass.

      (D) A balance shows the cart's mass is 0.50 kg. Compare this with your result in (C) and give one physical reason for the difference.
    answer: |
      (A) Hook the force sensor to the cart and give it a short pull along the track, starting from rest. The force sensor records force against time; the impulse is the area under the force–time graph (found with the software's integration tool or by counting areas). The motion sensor, at the end of the track, records the cart's velocity before (zero) and just after the pull, giving Δv. Repeat for several pull strengths. To reduce uncertainty: level the track (a cart at rest stays at rest), zero the force sensor before each pull, read the velocity immediately after the pull ends, and repeat each pull strength several times.
      (B) The impulse–momentum theorem gives J = mΔv, so Δv = (1/m)J. Graph Δv (vertical) against J (horizontal): a straight line through (or near) the origin whose slope is 1/m. A best-fit line through the data passes close to (0.10, 0.21) and (0.50, 0.98): slope ≈ (0.98 − 0.21)/(0.50 − 0.10) = 0.77/0.40 ≈ 1.9 (m/s)/(N·s), that is, 1.9 kg⁻¹. (A least-squares fit gives 1.91 kg⁻¹.)
      (C) Slope = 1/m, so m = 1/1.9 ≈ 0.52 kg.
      (D) 0.52 kg is about 4–5% more than 0.50 kg. The measured velocity changes are slightly too small for the impulses, which fits friction acting on the cart during and after the pull: friction's backward impulse means the net impulse is a little less than the force-sensor impulse, so the slope is smaller and the inferred mass larger. (Including the force sensor's mass with the cart, or a slight upward tilt of the track, are other acceptable reasons.)
    explanation: |
      Ten points.
      (A) 1 point: measures the force on the cart against time with the force sensor and finds the impulse as the area under the force–time graph.
      (A) 1 point: measures the change in velocity with the motion sensor (initial and final velocity, or from rest).
      (A) 1 point: a valid step to reduce uncertainty (level the track, zero the sensor, repeat trials and average, use several pull strengths).
      (B) 1 point: graphs Δv against J (or J against Δv, with slope m), justified by J = mΔv.
      (B) 1 point: describes a straight line through (or near) the origin.
      (B) 1 point: slope ≈ 1.9 kg⁻¹ (accept 1.8 to 2.0) calculated from points on the best-fit line, not just two data points chosen arbitrarily, with units.
      (C) 1 point: identifies slope = 1/m (or m for the inverted graph).
      (C) 1 point: m ≈ 0.52 kg (accept 0.50 to 0.56 kg), consistent with the slope in (B).
      (D) 1 point: states that the experimental mass is slightly larger than 0.50 kg (about 4–5%).
      (D) 1 point: a physically reasonable cause that would make Δv too small or J too large (friction, sensor mass, tilt), linked to the direction of the difference. "Human error" alone earns 0.
