    type: long_answer
    topic_code: "4.4"
    source: "AP Physics 1 CED, Topic 4.4"
    points: 10
    prompt: |
      Mathematical routines. On a horizontal frictionless surface, block A of mass m₁ slides at speed v₀ toward block B of mass m₂, which is at rest and attached to one end of a light horizontal spring of spring constant k. The other end of the spring is fixed to a wall. Block A hits block B and sticks to it, and the two blocks then compress the spring.

      (A) Derive an expression for the speed of the two blocks just after the collision, in terms of m₁, m₂ and v₀.

      (B) Derive an expression for the maximum compression x_max of the spring, in terms of m₁, m₂, v₀ and k. Explain why your derivation uses a different conservation law for the collision than for the compression.

      (C) For m₁ = 0.50 kg, m₂ = 1.5 kg, v₀ = 4.0 m/s and k = 200 N/m, calculate x_max and the kinetic energy converted to internal energy in the collision.

      (D) The experiment is repeated with magnetic bumpers instead, so that block A bounces off block B elastically and block B alone compresses the spring. Without a full calculation, determine whether the maximum compression is greater than, less than or equal to your answer in (C). Justify your answer. (For an elastic collision with B at rest, block B's speed afterwards is 2m₁v₀/(m₁ + m₂).)
    answer: |
      (A) During the brief collision the spring is not yet compressed and the surface is frictionless, so momentum is conserved: m₁v₀ = (m₁ + m₂)V, giving V = m₁v₀/(m₁ + m₂).
      (B) During the compression, the blocks and spring form a system with no friction, so mechanical energy is conserved: ½(m₁ + m₂)V² = ½k x_max². So x_max = V√((m₁ + m₂)/k) = m₁v₀/√(k(m₁ + m₂)). The collision is perfectly inelastic, so kinetic energy is not conserved in it and only momentum can be used there; during the compression the wall exerts an external force through the spring, so momentum is not conserved, but no energy is converted to internal energy, so mechanical energy is.
      (C) V = (0.50)(4.0)/2.0 = 1.0 m/s. x_max = 1.0 × √(2.0/200) = 0.10 m. K before = ½(0.50)(4.0)² = 4.0 J; K just after = ½(2.0)(1.0)² = 1.0 J; converted: 3.0 J.
      (D) Greater. In the elastic collision no kinetic energy is converted, so block B receives much more kinetic energy: v_B = 2(0.50)(4.0)/2.0 = 2.0 m/s, K_B = ½(1.5)(2.0)² = 3.0 J, compared with only 1.0 J for the stuck blocks. All of B's kinetic energy goes into the spring, so ½kx² = 3.0 J gives x ≈ 0.17 m, greater than 0.10 m. (Qualitatively: the sticking collision wastes 3.0 J as internal energy; the elastic one wastes none, and A bounces away carrying only 1.0 J.)
      (A, B) Limiting-case check: if m₂ → 0, x_max → v₀√(m₁/k), the result for block A compressing the spring directly, as expected.
    explanation: |
      Ten points.
      (A) 1 point: applies conservation of momentum to the collision.
      (A) 1 point: V = m₁v₀/(m₁ + m₂).
      (B) 1 point: applies conservation of mechanical energy to the compression, ½(m₁ + m₂)V² = ½kx².
      (B) 1 point: x_max = m₁v₀/√(k(m₁ + m₂)) or an algebraically equivalent form.
      (B) 1 point: explains that kinetic energy is not conserved in the sticking collision (so momentum is used), and momentum is not conserved during the compression because the wall exerts an external force through the spring (so energy is used).
      (C) 1 point: x_max = 0.10 m, consistent with (B).
      (C) 1 point: 3.0 J converted to internal energy (4.0 J − 1.0 J).
      (D) 1 point: "greater".
      (D) 2 points: 1 for recognising that the elastic collision converts no kinetic energy, so block B gets more kinetic energy (3.0 J versus 1.0 J, or v_B = 2.0 m/s); 1 for linking B's kinetic energy to the spring energy to conclude a larger compression (about 0.17 m). Saying "elastic collisions are bouncier" without energy reasoning earns only the "greater" point.
