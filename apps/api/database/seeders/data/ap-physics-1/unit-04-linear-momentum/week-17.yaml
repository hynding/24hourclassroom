      prompt: |
        A motion sensor and software produce this momentum–time record for a lab cart on a level track:

        | t (s) | 0 | 0.10 | 0.20 | 0.30 | 0.40 | 0.50 |
        |---|---|---|---|---|---|---|
        | p (kg·m/s) | 0 | 0.20 | 0.40 | 0.60 | 0.60 | 0.60 |

        (a) Calculate the net force on the cart between t = 0 and t = 0.30 s.
        (b) State the net force on the cart between t = 0.30 s and t = 0.50 s, and justify it from the table.
        (c) Calculate the net impulse on the cart from t = 0 to t = 0.50 s.
      answer: |
        (a) The momentum rises steadily, so the net force is the slope of the p–t graph: F_net = Δp/Δt = (0.60 − 0)/(0.30 − 0) = 2.0 N, in the positive direction.
        (b) Zero. The momentum stays at 0.60 kg·m/s, so Δp = 0 and F_net = Δp/Δt = 0 (a horizontal p–t graph).
        (c) J = Δp = 0.60 − 0 = 0.60 N·s (0.60 kg·m/s), in the positive direction.
      explanation: |
        Three points, one per part.
        (a) 1 point: 2.0 N, from the slope Δp/Δt of the first section.
        (b) 1 point: zero net force, with the reason that the momentum does not change (horizontal graph).
        (c) 1 point: 0.60 N·s, from the total change in momentum (or the force–time area, 2.0 N × 0.30 s). Answers in kg·m/s are equally acceptable.
    - slug: apphys1-u04-w17-q24
      type: long_answer
      topic_code: "4.3"
      source: "AP Physics 1 CED, Topic 4.3"
      points: 6
      prompt: |
        Experimental design and analysis. A lab group wants to test whether momentum is conserved when a moving cart collides with and sticks to a cart at rest. They have cart A (0.50 kg) and cart B (0.30 kg) with Velcro pads, a level track, a launcher that can give cart A different speeds, and two motion sensors.

        (A) Describe a procedure the group could use to collect the data they need. Name each quantity measured and the equipment used to measure it, and describe one thing they could do to reduce experimental uncertainty.

        The group launches cart A at five different speeds into cart B, which starts at rest each time, and records cart A's velocity v_i just before the collision and the pair's common velocity v_f just after:

        | v_i (m/s) | 0.40 | 0.60 | 0.80 | 1.00 | 1.20 |
        |---|---|---|---|---|---|
        | v_f (m/s) | 0.23 | 0.36 | 0.47 | 0.60 | 0.71 |

        (B) Explain what quantities the group should graph to obtain a straight line whose slope can be compared with a prediction from momentum conservation, and state the predicted slope.

        (C) The best-fit line through the data has slope 0.60. Compare this with your prediction and suggest one physical reason for the difference.
      answer: |
        (A) Weigh both carts on a balance (or note their masses). Put motion sensors at each end of the track. Launch cart A toward cart B, which is at rest; the sensor behind A records A's velocity just before the collision, and a sensor records the stuck pair's velocity just after. Repeat for several launcher settings. To reduce uncertainty: level the track (check that a cart released at rest does not roll), take velocity readings as close to the collision as possible, and repeat each launch several times and average.
        (B) Conservation gives m_A v_i = (m_A + m_B) v_f, so v_f = [m_A/(m_A + m_B)] v_i. Graph v_f (vertical) against v_i (horizontal); the line should pass through the origin with slope m_A/(m_A + m_B) = 0.50/0.80 = 0.625.
        (C) The measured slope 0.60 is about 4% less than 0.625 ((0.625 − 0.60)/0.625 ≈ 0.04). The final velocities are slightly too small, which fits a small external impulse removing momentum: friction from the track and wheels acting between the moment v_i is measured and the moment v_f is measured. (A slightly unlevel track or Velcro dragging are also acceptable reasons.) The agreement within a few percent supports momentum conservation.
      explanation: |
        Six points.
        (A) 1 point: measures the masses (balance) and both velocities (motion sensors or photogates), saying which velocity is measured when (before and after the collision).
        (A) 1 point: a valid way to reduce uncertainty (level the track, measure velocities close to the collision, repeat trials and average, use several launch speeds).
        (B) 1 point: graphs v_f against v_i (or equivalent, such as m_A v_i against (m_A + m_B) v_f with predicted slope 1).
        (B) 1 point: predicted slope 0.625 (or 1 for the momentum graph), derived from conservation of momentum.
        (C) 1 point: states that the measured slope is slightly less than predicted (about 4% low).
        (C) 1 point: a physically reasonable cause that would lower v_f (friction or another external impulse, tilt of the track), connected to the direction of the discrepancy. "Human error" alone earns 0.
