week: 17
unit: 4
title: "Conservation of Linear Momentum"
topics: ["4.3"]
guide: guides/week-17.md
guide_description: |
  When a system's total momentum is conserved (zero or negligible net external impulse), how the choice of
  system decides that, why internal forces cannot change p_sys, the constant centre-of-mass velocity of an
  isolated system, momentum tables and bar charts before and after an interaction, recoil and explosions, the
  short-collision approximation, and conservation in two dimensions by components. Worked examples: a skateboarder
  throwing a medicine ball, two carts that couple on a track (with a before/after momentum table), a dropped ball
  and Earth as a system choice, two ice skaters pushing apart with the centre of mass staying put, a two-car
  collision at a right-angled intersection, and a lab that linearises sticky-collision data to test conservation.
flashcards_description: |
  30 cards on conservation of linear momentum: isolated and non-isolated systems, choosing the system, internal
  and external forces, the short-collision approximation, constant centre-of-mass velocity, recoil and explosion
  ratios, before/after momentum tables and bar charts, two-dimensional conservation by components, lab tests of
  conservation, and three error-spot cards.

flashcards:
  - front: Conservation of linear momentum → condition
    back: |
      A system's total momentum stays constant when the net external force on it is zero (or the net external impulse during the interval is negligible).
    topic_code: "4.3"
  - front: Isolated system for momentum → meaning
    back: |
      A system on which the net external force is zero, so p_sys before = p_sys after for any interaction inside it.
    topic_code: "4.3"
  - front: Choosing a system for a collision → what to include
    back: |
      Include every object that exerts the large forces of the interaction (both carts, both skaters, gun and bullet), so those forces are internal and cancel.
    topic_code: "4.3"
  - front: Dropped ball, system = ball only → is momentum conserved?
    back: |
      No. Earth's gravitational force is external to that system, so the ball's momentum grows as it falls.
    topic_code: "4.3"
  - front: Dropped ball, system = ball + Earth → is momentum conserved?
    back: |
      Yes. Gravity is now internal; Earth gains an equal and opposite (unmeasurably small) momentum. A 0.5 kg ball at 10 m/s gives Earth about 8 × 10⁻²⁵ m/s.
    topic_code: "4.3"
  - front: Short-collision approximation → why friction can be ignored during a crash
    back: |
      Friction is small and the collision lasts milliseconds, so its impulse F_f Δt is tiny compared with the large internal impulses; momentum just before ≈ just after.
    topic_code: "4.3"
  - front: Isolated system → what happens to its centre-of-mass velocity
    back: |
      It stays constant, because p_sys = M v_cm and p_sys does not change. An isolated system's centre of mass moves in a straight line at constant speed (or stays at rest).
    topic_code: "4.3"
  - front: Two skaters at rest push apart → what the centre of mass does
    back: |
      It stays where it was: v_cm = 0 before, so it is 0 after. The skaters move off in opposite directions with equal-magnitude momenta.
    topic_code: "4.3"
  - front: Skaters 60 kg and 40 kg push apart; the 40 kg skater moves at 1.5 m/s → speed of the other
    back: |
      0 = 40(1.5) + 60v, so v = −1.0 m/s: 1.0 m/s in the opposite direction.
    topic_code: "4.3"
  - front: Explosion from rest into two pieces → ratio of speeds
    back: |
      m₁v₁ = m₂v₂ in magnitude, so v₁/v₂ = m₂/m₁: the lighter piece moves faster, in inverse proportion to mass.
    topic_code: "4.3"
  - front: Explosion from rest → kinetic energy of the pieces
    back: |
      The lighter piece gets more kinetic energy (K = p²/2m with equal p). The total K increases, supplied by stored chemical or elastic energy.
    topic_code: "4.3"
  - front: Recoil of a student on a skateboard throwing a ball → how to set it up
    back: |
      System = student + board + ball, initially at rest: 0 = m_ball v_ball + (m_student + m_board) v_recoil.
    topic_code: "4.3"
  - front: 58 kg student-plus-board throws a 4.0 kg ball forward at 6.0 m/s → recoil velocity
    back: |
      v = −(4.0 × 6.0)/58 ≈ −0.41 m/s: 0.41 m/s backward.
    topic_code: "4.3"
  - front: Before/after momentum table → what goes in it
    back: |
      One row per object with mass, velocity (with sign) and momentum, before and after, plus a system row. The system momentum must be the same in both columns.
    topic_code: "4.3"
  - front: Momentum bar chart for an interaction → how to read it
    back: |
      Bars show each object's momentum (up = positive) before and after. The bars for the system sum to the same height before and after when no external impulse acts.
    topic_code: "4.3"
  - front: 0.50 kg cart at 0.80 m/s couples to a 0.25 kg cart at rest → common velocity
    back: |
      0.40 kg·m/s = 0.75 kg × v, so v ≈ 0.53 m/s in the original direction.
    topic_code: "4.3"
  - front: Momentum conservation in two dimensions → method
    back: |
      Conserve each component separately: Σp_x before = Σp_x after and Σp_y before = Σp_y after. Then combine with the Pythagorean theorem and tan θ = p_y/p_x.
    topic_code: "4.3"
  - front: 1200 kg car east at 15 m/s and 1800 kg truck north at 10 m/s lock together → wreck's velocity
    back: |
      p_x = 18,000 and p_y = 18,000 kg·m/s; p = 25,500 kg·m/s; v = 25,500/3000 ≈ 8.5 m/s at 45° north of east.
    topic_code: "4.3"
  - front: Direction of a 2D wreck → what decides the angle
    back: |
      The ratio of momentum components, tan θ = p_y/p_x, not the ratio of the speeds. Equal momenta give 45° even when the speeds differ.
    topic_code: "4.3"
  - front: Momentum conserved but kinetic energy not → when this happens
    back: |
      In any collision where objects deform, stick or heat up, and in explosions. Momentum depends only on external impulse; kinetic energy can change through internal work.
    topic_code: "4.3"
  - front: System with a net external force (cart pushed by a hand) → what changes its momentum
    back: |
      Δp_sys = F_net,ext Δt: the external impulse. The momentum of a non-isolated system changes by exactly that impulse.
    topic_code: "4.3"
  - front: Ball bouncing off a wall → why its momentum is not conserved
    back: |
      The wall is outside the system and exerts a large external force. For the ball + wall + Earth system, momentum is conserved; Earth's share is tiny.
    topic_code: "4.3"
  - front: Spring-loaded explosion carts in a lab → what the data should show
    back: |
      Starting from rest, m_A v_A + m_B v_B ≈ 0: the carts' momentum magnitudes match within measurement uncertainty, and v_A/v_B = m_B/m_A.
    topic_code: "4.3"
  - front: Sticky-collision lab, final velocity v_f graphed against initial velocity v_i → slope's meaning
    back: |
      Conservation predicts v_f = [m_A/(m_A + m_B)] v_i, a straight line through the origin with slope m_A/(m_A + m_B).
    topic_code: "4.3"
  - front: Sticky-collision lab slope a few percent below prediction → likely cause
    back: |
      Friction acting between the launch and the velocity measurement removes a little momentum, so measured v_f is slightly low. Measuring speeds close to the collision reduces this.
    topic_code: "4.3"
  - front: Person walking along a boat floating at rest → what the boat does
    back: |
      It moves the opposite way so the person + boat system keeps zero momentum and its centre of mass stays fixed (water drag neglected).
    topic_code: "4.3"
  - front: Rocket in deep space ejecting exhaust → why it speeds up
    back: |
      Rocket + exhaust is isolated: the exhaust gets momentum backward, so the rocket gets equal momentum forward. No air to "push against" is needed.
    topic_code: "4.3"
  - front: Error-spot → "momentum is conserved for the ball alone as it falls, because no one touches it"
    back: |
      Gravity is a force from Earth, which is outside the ball-only system. Conservation holds only for ball + Earth.
    topic_code: "4.3"
  - front: Error-spot → "after the explosion the pieces have equal speeds because momentum is conserved"
    back: |
      Conservation gives equal momentum magnitudes, m₁v₁ = m₂v₂. Equal speeds happen only for equal masses.
    topic_code: "4.3"
  - front: Error-spot → "the 2D wreck moves at the average of 15 m/s and 10 m/s"
    back: |
      Momentum, not speed, is conserved, and by components. Add mass × velocity in x and y separately, then divide the resultant by the total mass.
    topic_code: "4.3"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topic 4.3: conditions for conservation of momentum,
    choosing a system, recoil and explosions, sticky collisions, the centre of mass of an isolated system, and
    two-dimensional conservation by components), with 8 questions (33%) reviewing earlier weeks (week 16's
    momentum and impulse, Newton's third law, elastic potential energy and conservation of energy). Opens with a
    shared-context set on spring-loaded explosion carts. Multiple choice, select-all, true/false and numeric items
    are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer
    are graded by your teacher against the scoring notes. Calculator and equation sheet allowed throughout, as on
    the AP exam.
  questions:
    # ---- Stimulus set: spring-loaded explosion carts (4.3, 3.3)
    - slug: apphys1-u04-w17-q01
      type: multiple_choice
      topic_code: "4.3"
      source: "AP Physics 1 CED, Topic 4.3"
      points: 1
      stimulus: |
        A lab group places two carts at rest, touching, on a level track with negligible friction. Cart A has mass 0.50 kg. Cart B, carrying an extra block, has mass 0.75 kg. A compressed spring plunger between them is released, and the carts roll apart. Motion sensors at each end of the track show that cart B moves at +0.40 m/s (to the right) after the release.
      prompt: |
        What is cart A's velocity after the release?
      options:
        - "−0.40 m/s"
        - "−0.60 m/s"
        - "−0.27 m/s"
        - "+0.60 m/s"
      option_explanations:
        - |
          Equal speeds would mean equal momenta only if the masses were equal; cart A is lighter, so it must move faster.
        - |
          Correct. The system starts at rest, so 0 = (0.50)v_A + (0.75)(0.40), giving v_A = −0.30/0.50 = −0.60 m/s (to the left).
        - |
          −0.27 m/s uses the mass ratio upside down (0.40 × 0.50/0.75); the lighter cart has the larger speed.
        - |
          The magnitude is right, but the carts push apart, so cart A moves in the negative direction to cancel cart B's momentum.
      answer: 1
    - slug: apphys1-u04-w17-q02
      type: multiple_choice
      topic_code: "4.3"
      source: "AP Physics 1 CED, Topic 4.3"
      points: 1
      stimulus: |
        A lab group places two carts at rest, touching, on a level track with negligible friction. Cart A has mass 0.50 kg. Cart B, carrying an extra block, has mass 0.75 kg. A compressed spring plunger between them is released, and the carts roll apart. Motion sensors at each end of the track show that cart B moves at +0.40 m/s (to the right) after the release.
      prompt: |
        What is the velocity of the centre of mass of the two-cart system after the release?
      options:
        - "+0.40 m/s, the velocity of the heavier cart"
        - "−0.10 m/s, the average of the two carts' velocities"
        - "+0.30 m/s, because each cart carries 0.30 kg·m/s"
        - "0 m/s"
      option_explanations:
        - |
          The centre of mass is weighted by both carts' masses; the lighter cart moving left pulls it back to zero.
        - |
          The plain average of +0.40 and −0.60 ignores the masses; mass-weighted, the momenta cancel exactly.
        - |
          The two momenta are equal in magnitude but opposite in direction, so the total is zero, not 0.30 kg·m/s.
        - |
          Correct. Only internal (spring) forces act horizontally, so p_sys stays 0 and v_cm = p_sys/M = 0: the centre of mass stays where it was.
      answer: 3
    - slug: apphys1-u04-w17-q03
      type: multiple_choice
      topic_code: "3.3"
      source: "AP Physics 1 CED, Topic 3.3"
      points: 1
      stimulus: |
        A lab group places two carts at rest, touching, on a level track with negligible friction. Cart A has mass 0.50 kg. Cart B, carrying an extra block, has mass 0.75 kg. A compressed spring plunger between them is released, and the carts roll apart. Motion sensors at each end of the track show that cart B moves at +0.40 m/s (to the right) after the release.
      prompt: |
        Which statement about the system's kinetic energy after the release is correct?
      options:
        - "It is 0.15 J, converted from elastic potential energy stored in the compressed spring."
        - "It is 0 J, because the total momentum of the system is zero."
        - "It is 0.30 J, the sum of the two carts' momentum magnitudes."
        - "It is 0.15 J, created by the internal forces without any energy being stored beforehand."
      option_explanations:
        - |
          Correct. K = ½(0.50)(0.60)² + ½(0.75)(0.40)² = 0.090 + 0.060 = 0.15 J, which came from the spring's elastic potential energy.
        - |
          Zero total momentum does not mean zero kinetic energy: momenta cancel as vectors, kinetic energies add as scalars.
        - |
          0.30 is a momentum in kg·m/s; kinetic energy is ½mv² for each cart, added.
        - |
          The number is right, but energy is never created: the spring's stored elastic potential energy became kinetic energy.
      answer: 0
    - slug: apphys1-u04-w17-q04
      type: multiple_choice
      topic_code: "4.3"
      source: "AP Physics 1 CED, Topic 4.3"
      points: 1
      stimulus: |
        A lab group places two carts at rest, touching, on a level track with negligible friction. Cart A has mass 0.50 kg. Cart B, carrying an extra block, has mass 0.75 kg. A compressed spring plunger between them is released, and the carts roll apart. Motion sensors at each end of the track show that cart B moves at +0.40 m/s (to the right) after the release.
      prompt: |
        The group repeats the release several times, keeping cart A at 0.50 kg and changing the blocks on cart B. They graph the ratio of speeds v_A/v_B on the vertical axis against the mass ratio m_B/m_A on the horizontal axis. If momentum is conserved, what should the graph look like?
      options:
        - "A horizontal line at v_A/v_B = 1, since the same spring is used each time"
        - "A straight line through the origin with slope −1"
        - "A straight line through the origin with slope 1"
        - "A curve that decreases as m_B/m_A increases"
      option_explanations:
        - |
          The same spring does not give equal speeds; conservation requires equal momentum magnitudes, so the speeds depend on the masses.
        - |
          Both axes are ratios of magnitudes, so both are positive; a negative slope would need one ratio to be negative.
        - |
          Correct. m_A v_A = m_B v_B in magnitude, so v_A/v_B = m_B/m_A: plotting one ratio against the other gives a line of slope 1 through the origin.
        - |
          The lighter cart A goes faster as cart B gets heavier, so v_A/v_B rises with m_B/m_A; it does not fall.
      answer: 2
    # ---- Independent items
    - slug: apphys1-u04-w17-q05
      type: multiple_choice
      topic_code: "4.3"
      source: "AP Physics 1 CED, Topic 4.3"
      points: 1
      prompt: |
        A 55 kg student stands at rest on a 3.0 kg skateboard on a level, smooth floor and throws a 4.0 kg medicine ball horizontally forward at 6.0 m/s. With what speed do the student and skateboard roll backward?
      options:
        - "6.0 m/s"
        - "0.44 m/s"
        - "0.39 m/s"
        - "0.41 m/s"
      option_explanations:
        - |
          The student and board are much more massive than the ball, so the same momentum gives them a much smaller speed.
        - |
          0.44 m/s divides by the student's 55 kg alone; the skateboard recoils with the student, so the recoiling mass is 58 kg.
        - |
          0.39 m/s divides by 62 kg, including the ball, which is no longer moving with the student after the throw.
        - |
          Correct. 0 = (4.0)(6.0) + (58)v, so v = −24/58 ≈ −0.41 m/s: 0.41 m/s backward.
      answer: 3
    - slug: apphys1-u04-w17-q06
      type: multiple_choice
      topic_code: "4.3"
      source: "AP Physics 1 CED, Topic 4.3"
      points: 1
      prompt: |
        A ball is dropped from a balcony and falls freely. Air resistance is negligible. For which choice of system is the total momentum constant while the ball falls?
      options:
        - "The ball alone, because nothing touches it"
        - "The ball and Earth together"
        - "Earth alone, because it does not move noticeably"
        - "No system, because a force acts on the ball"
      option_explanations:
        - |
          Earth's gravitational force acts on the ball without contact; it is external to the ball-only system, so the ball's momentum grows.
        - |
          Correct. With Earth included, gravity is an internal force pair; the ball gains downward momentum and Earth gains an equal upward momentum.
        - |
          Earth alone feels the ball's upward pull as an external force, so Earth's momentum changes too (by a tiny but nonzero amount).
        - |
          A force acting inside the system does not change the system's momentum; choosing ball + Earth makes the force internal.
      answer: 1
    - slug: apphys1-u04-w17-q07
      type: multiple_choice
      topic_code: "4.3"
      source: "AP Physics 1 CED, Topic 4.3"
      points: 1
      prompt: |
        A 0.50 kg cart moving at 0.80 m/s on a level, low-friction track strikes a 0.25 kg cart at rest. Velcro pads make the carts stick together. What is their velocity just after the collision?
      options:
        - "0.80 m/s"
        - "0.40 m/s"
        - "0.53 m/s"
        - "1.6 m/s"
      option_explanations:
        - |
          The moving cart must share its momentum with the extra 0.25 kg, so the pair cannot keep the original speed.
        - |
          0.40 m/s is the average of the two carts' velocities; the masses are unequal, so momentum must be used.
        - |
          Correct. (0.50)(0.80) = (0.75)v, so v = 0.40/0.75 ≈ 0.53 m/s in the original direction.
        - |
          1.6 m/s divides the momentum by the struck cart's mass alone; after sticking, both carts move together with 0.75 kg.
      answer: 2
    - slug: apphys1-u04-w17-q08
      type: multiple_choice
      topic_code: "4.3"
      source: "AP Physics 1 CED, Topic 4.3"
      points: 1
      prompt: |
        At an icy intersection, a 1200 kg car moving east at 15 m/s collides with an 1800 kg truck moving north at 10 m/s. The vehicles lock together. What is the speed of the wreck just after the collision?
      options:
        - "8.5 m/s"
        - "12 m/s"
        - "6.0 m/s"
        - "12.5 m/s"
      option_explanations:
        - |
          Correct. p_x = 1200 × 15 = 18,000 kg·m/s and p_y = 1800 × 10 = 18,000 kg·m/s; p = √(18,000² + 18,000²) ≈ 25,500 kg·m/s; v = 25,500/3000 ≈ 8.5 m/s.
        - |
          12 m/s adds the two momentum magnitudes (36,000 kg·m/s) as if they were in the same direction; perpendicular components combine by the Pythagorean theorem.
        - |
          6.0 m/s uses only one component (18,000/3000); the wreck moves with both the eastward and northward momentum.
        - |
          12.5 m/s averages the two speeds; momentum, not speed, is conserved, and it adds as a vector.
      answer: 0
    - slug: apphys1-u04-w17-q09
      type: multiple_choice
      topic_code: "4.3"
      source: "AP Physics 1 CED, Topic 4.3"
      points: 1
      prompt: |
        For the same icy-intersection collision (1200 kg car east at 15 m/s, 1800 kg truck north at 10 m/s, vehicles lock together), in what direction does the wreck move just after the collision?
      options:
        - "About 34° north of east, from the ratio of the speeds"
        - "Due north, because the truck is heavier"
        - "About 56° north of east"
        - "45° north of east"
      option_explanations:
        - |
          tan⁻¹(10/15) ≈ 34° uses the speeds; the direction comes from the momentum components, which here are equal.
        - |
          The car's eastward momentum is not lost; the wreck keeps both components, so it cannot move due north.
        - |
          56° comes from tan⁻¹(15/10), the speed ratio inverted; the momentum components are equal, giving 45°.
        - |
          Correct. tan θ = p_y/p_x = 18,000/18,000 = 1, so θ = 45° north of east.
      answer: 3
    - slug: apphys1-u04-w17-q10
      type: multiple_choice
      topic_code: "4.3"
      source: "AP Physics 1 CED, Topic 4.3"
      points: 1
      prompt: |
        Two ice skaters, of masses 60 kg and 40 kg, stand at rest facing each other on smooth ice and push apart. The 40 kg skater moves off at 1.5 m/s. How fast does the 60 kg skater move?
      options:
        - "1.5 m/s"
        - "1.0 m/s"
        - "2.25 m/s"
        - "0.60 m/s"
      option_explanations:
        - |
          Equal speeds would give unequal momenta; the heavier skater must move more slowly for the momenta to cancel.
        - |
          Correct. 0 = (40)(1.5) + (60)v, so v = −1.0 m/s: 1.0 m/s in the opposite direction.
        - |
          2.25 m/s inverts the mass ratio (1.5 × 60/40); the heavier skater must be the slower one.
        - |
          0.60 m/s divides 60 kg·m/s by the total mass of 100 kg; after the push each skater moves separately.
      answer: 1
    - slug: apphys1-u04-w17-q11
      type: multiple_choice
      topic_code: "4.3"
      source: "AP Physics 1 CED, Topic 4.3"
      points: 1
      prompt: |
        Two carts collide on a level track that has some friction. A student says momentum conservation cannot be used because friction is an external force. Which response best justifies using conservation for the momenta just before and just after the collision?
      options:
        - "The collision lasts a very short time, so friction's impulse during it is tiny compared with the large internal impulses; momentum just before is approximately momentum just after."
        - "Friction is an internal force between the carts, so it cancels."
        - "Friction acts only on the cart that is moving faster, so it does not affect the system."
        - "Momentum is always conserved in collisions, whatever external forces act."
      option_explanations:
        - |
          Correct. The external impulse is F_f Δt; with Δt only milliseconds and F_f small, it is negligible next to the carts' change in momentum during the collision.
        - |
          Friction here is exerted by the track, which is outside the two-cart system, so it is external, not internal.
        - |
          The track exerts friction on both carts; what makes it negligible is the short duration of the collision, not which cart it acts on.
        - |
          Momentum is conserved only when the net external impulse is zero or negligible; a large external force over a long time would change it.
      answer: 0
    - slug: apphys1-u04-w17-q12
      type: multiple_choice
      topic_code: "4.2"
      source: "AP Physics 1 CED, Topic 4.2"
      points: 1
      prompt: |
        A hockey stick pushes a 0.17 kg puck, initially at rest on the ice, with an average force of 50 N for 0.020 s. What is the puck's speed as it leaves the stick?
      options:
        - "1.0 m/s"
        - "290 m/s"
        - "5.9 m/s"
        - "0.17 m/s"
      option_explanations:
        - |
          1.0 is the impulse in N·s (50 × 0.020); dividing by the 0.17 kg mass gives the speed.
        - |
          290 is F/m ≈ 294 m/s², the puck's acceleration; it acts for only 0.020 s.
        - |
          Correct. J = F_avg Δt = 50 × 0.020 = 1.0 N·s = Δp, so v = 1.0/0.17 ≈ 5.9 m/s.
        - |
          0.17 multiplies the impulse by the mass; the impulse–momentum theorem gives v = J/m.
      answer: 2
    - slug: apphys1-u04-w17-q13
      type: multiple_choice
      topic_code: "2.3"
      source: "AP Physics 1 CED, Topic 2.3"
      points: 1
      prompt: |
        A textbook rests on a table. Which force forms a Newton's third-law pair with the gravitational force that Earth exerts on the book?
      options:
        - "The upward normal force the table exerts on the book"
        - "The downward force the book exerts on the table"
        - "The upward normal force the floor exerts on the table"
        - "The upward gravitational force the book exerts on Earth"
      option_explanations:
        - |
          The normal force also acts on the book and is a different kind of force; equal and opposite forces on the same object are balanced forces, not a third-law pair.
        - |
          That force is the partner of the table's normal force on the book (a contact pair), not of Earth's gravitational pull.
        - |
          This force acts on the table and involves the floor; a third-law partner must involve the same two objects, Earth and the book.
        - |
          Correct. A third-law pair involves the same two objects and the same kind of force: Earth pulls the book down, and the book pulls Earth up with equal magnitude.
      answer: 3
    - slug: apphys1-u04-w17-q14
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      prompt: |
        A toy launcher has a spring of stiffness 200 N/m compressed 0.10 m. When released, it pushes a 0.050 kg ball horizontally along a smooth barrel. What is the ball's speed as it leaves the spring?
      options:
        - "6.3 m/s"
        - "40 m/s"
        - "4.5 m/s"
        - "2.0 m/s"
      option_explanations:
        - |
          Correct. ½kx² = ½mv², so v = √(kx²/m) = √(200 × 0.010/0.050) = √40 ≈ 6.3 m/s.
        - |
          40 is v² in m²/s²; the square root must be taken to get the speed.
        - |
          4.5 m/s keeps the ½ on only one side, using kx²/2 = mv²; the halves cancel when both energies are written correctly.
        - |
