    - slug: apphys1-u04-w17-q17
      type: true_false
      topic_code: "4.1"
      source: "AP Physics 1 CED, Topic 4.1"
      points: 1
      prompt: |
        True or false: The centre of mass of a system can be at rest even while every object in the system is moving.
      answer: true
      explanation: |
        True. v_cm = p_sys/M. If the objects' momenta cancel (two carts with equal and opposite momenta, or two skaters moving apart), p_sys = 0, so the centre of mass stays at rest while both objects move.
    - slug: apphys1-u04-w17-q18
      type: true_false
      topic_code: "4.3"
      source: "AP Physics 1 CED, Topic 4.3"
      points: 1
      prompt: |
        True or false: Whenever the total momentum of a system of colliding carts is conserved, the total kinetic energy of the carts is conserved too.
      answer: false
      explanation: |
        False. Momentum is conserved whenever the net external impulse is negligible, but kinetic energy can still be converted to internal energy, sound or deformation. Carts that stick together conserve momentum but lose kinetic energy.
