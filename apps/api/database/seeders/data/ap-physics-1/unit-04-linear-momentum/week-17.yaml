      type: short_answer
      topic_code: "4.3"
      source: "AP Physics 1 CED, Topic 4.3"
      points: 3
      prompt: |
        A student sits at rest in a wheeled office chair on a smooth, level floor, holding a heavy backpack. She throws the backpack horizontally forward, and she and the chair roll backward.

        (a) Identify a system for which horizontal momentum is conserved during the throw, and justify your choice.
        (b) Explain, using momentum, why she and the chair must roll backward.
        (c) Describe the motion of the centre of mass of your system after the throw, before the backpack lands.
      answer: |
        (a) Student + chair + backpack. The forces between her hands and the backpack are internal to this system; the only external forces (gravity, the floor's normal force) are vertical, and with a smooth floor there is negligible horizontal external force, so horizontal momentum is conserved.
        (b) The system's horizontal momentum is zero before the throw, so it must still be zero after. The backpack gains forward momentum, so the student and chair must gain an equal amount of momentum backward to keep the total at zero.
        (c) The centre of mass of the system started at rest and the horizontal momentum stays zero, so v_cm (horizontally) stays zero: the centre of mass does not move horizontally while the backpack and the student move apart.
      explanation: |
        Three points, one per part.
        (a) 1 point: a system containing both the student (with chair) and the backpack, justified by the throwing forces being internal and no significant horizontal external force. Choosing the backpack alone earns 0.
        (b) 1 point: zero initial momentum, so the backward momentum of student and chair equals the backpack's forward momentum in magnitude. "Action and reaction" alone, with no momentum statement, earns 0.
        (c) 1 point: the centre of mass stays at rest horizontally, because the system's horizontal momentum remains zero.
