        True or false: If the net external force on a hockey puck is zero for a 3-second interval, the puck's momentum is the same at the end of the interval as at the start.
      answer: true
      explanation: |
        True. F_net = Δp/Δt, so zero net force means Δp = 0: the momentum (magnitude and direction) stays constant. The puck may be at rest or sliding in a straight line at constant velocity.
