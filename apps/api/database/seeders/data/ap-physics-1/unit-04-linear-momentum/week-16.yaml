      prompt: |
        True or false: The area under a graph of force against position for a cart gives the impulse delivered to the cart.
      answer: false
      explanation: |
        False. The area under a force–position graph is the work done on the cart, which changes its kinetic energy. The impulse is the area under a force–time graph, and it changes the cart's momentum.
