    - slug: apphys1-u04-w16-q21
      type: short_answer
      topic_code: "4.2"
      source: "AP Physics 1 CED, Topic 4.2"
      points: 3
      prompt: |
        In an egg-drop challenge, two identical eggs are dropped from the same height. One lands on a concrete floor and breaks; the other lands on a thick foam pillow and survives.

        (a) Compare the impulses delivered to the two eggs while they are being stopped. Justify your answer.
        (b) Use the impulse–momentum theorem to explain why the egg on the pillow survives.
        (c) The foam pillow stops its egg in 0.030 s. A thicker pillow would stop it in 0.090 s. By what factor would the average force on the egg change? Explain.
      answer: |
        (a) The impulses are equal. Both eggs hit at the same speed (same drop height) and are brought to rest, so each has the same change in momentum, and the impulse equals the change in momentum.
        (b) J = F_avg Δt = Δp. The pillow deforms and stops the egg over a much longer time than concrete does, so for the same Δp the average force on the egg is much smaller, small enough that the shell does not break.
        (c) The average force becomes one third as large. With Δp fixed, F_avg = Δp/Δt, so tripling Δt from 0.030 s to 0.090 s divides the average force by 3.
      explanation: |
        Three points, one per part.
        (a) 1 point: impulses equal, justified by equal changes in momentum (same impact speed, both brought to rest). "The pillow absorbs impulse" earns 0.
        (b) 1 point: the pillow increases the stopping time, so for the same Δp (or impulse) the average force is smaller. Must connect time to force through J = F_avg Δt or F = Δp/Δt.
        (c) 1 point: the force is one third as large, with the inverse relationship F_avg ∝ 1/Δt at fixed Δp stated.
    - slug: apphys1-u04-w16-q22
      type: short_answer
      topic_code: "2.2"
      source: "AP Physics 1 CED, Topic 2.2"
      points: 3
      prompt: |
        A basketball falls straight down, hits a hard gym floor and bounces straight back up. Consider the short interval while the ball is in contact with the floor.

        (a) Describe a free-body diagram of the ball during the contact interval, naming each force and its direction.
        (b) During contact, is the magnitude of the normal force greater than, less than or equal to the ball's weight? Justify your answer using the ball's change in momentum.
      answer: |
        (a) Two forces: a downward arrow labelled F_g (the gravitational force exerted by Earth) and an upward arrow labelled F_N (the normal force exerted by the floor). The F_N arrow should be drawn much longer than the F_g arrow.
        (b) Greater. The ball's momentum changes from downward to upward during contact, so its change in momentum, and therefore the net impulse on it, points upward. The net force during contact is upward, which requires F_N to be greater than F_g (for a typical bounce, many times greater).
      explanation: |
        Three points.
        (a) 1 point: exactly two forces, the gravitational force downward and the normal force upward, each labelled with what exerts it. Adding a "bounce force" or "force of motion" loses the point.
        (b) 1 point: "greater than".
        (b) 1 point: justification that the change in momentum (from down to up) is upward, so the net impulse and net force are upward, which needs F_N greater than F_g. Saying "the floor pushes harder because it is hard" without the momentum argument does not earn this point.
    - slug: apphys1-u04-w16-q23
      type: long_answer
      topic_code: "4.2"
      source: "AP Physics 1 CED, Topic 4.2"
      points: 6
      prompt: |
        Mathematical routines. A student drops a ball of mass m from rest at height h₁ above a hard floor. It bounces straight up and rises to a maximum height h₂, where h₂ is less than h₁. The ball is in contact with the floor for a time Δt. Air resistance is negligible.

        (A) Derive an expression for the magnitude of the net impulse on the ball during contact, in terms of m, g, h₁ and h₂. Begin your derivation with fundamental principles.

        (B) For m = 0.40 kg, h₁ = 1.25 m, h₂ = 0.80 m and Δt = 0.020 s, calculate the magnitude of the average net force on the ball during contact, and then the magnitude of the average normal force from the floor. (g = 9.8 m/s²)

        (C) The student repeats the drop onto a slightly softer floor, so that h₁ and h₂ are unchanged but the contact time doubles. Does the average normal force exactly halve, more than halve, or less than halve? Justify your answer.
      answer: |
        (A) Energy conservation on the way down: mgh₁ = ½mv₁², so the impact speed is v₁ = √(2gh₁), downward. On the way up, ½mv₂² = mgh₂, so the rebound speed is v₂ = √(2gh₂), upward. Taking up as positive, J_net = Δp = m v₂ − m(−v₁) = m(√(2gh₂) + √(2gh₁)), directed upward.
        (B) v₁ = √(2 × 9.8 × 1.25) ≈ 4.95 m/s and v₂ = √(2 × 9.8 × 0.80) ≈ 3.96 m/s. J_net = 0.40 × (3.96 + 4.95) ≈ 3.56 N·s. F_net,avg = J/Δt = 3.56 ÷ 0.020 ≈ 178 N (about 180 N), upward. During contact F_N − mg = F_net, so F_N ≈ 178 + 0.40 × 9.8 = 178 + 3.9 ≈ 182 N (about 180 N).
        (C) Less than halve. The net impulse is unchanged, so doubling Δt halves the average net force, to about 89 N. But F_N = F_net + mg, and the weight (3.9 N) does not change, so F_N becomes about 89 + 3.9 ≈ 93 N, slightly more than half of 182 N (91 N).
      explanation: |
        Six points.
        (A) 1 point: speeds from energy conservation, v₁ = √(2gh₁) and v₂ = √(2gh₂) (kinematics with v² = 2gh is also acceptable).
        (A) 1 point: Δp written with opposite signs for the two velocities, giving J = m(√(2gh₂) + √(2gh₁)). Subtracting the speeds earns 0 for this point.
        (B) 1 point: J ≈ 3.56 N·s and F_net ≈ 178 N (accept 175 to 182 N), consistent with (A).
        (B) 1 point: F_N ≈ 182 N (accept 179 to 186 N) from F_N − mg = F_net, or consistent with an incorrect F_net. Giving F_N = F_net loses this point.
        (C) 1 point: "less than halve" (it becomes slightly more than half).
        (C) 1 point: reasoning that the net force halves because the impulse is the same, while the weight term in F_N = F_net + mg stays fixed.
