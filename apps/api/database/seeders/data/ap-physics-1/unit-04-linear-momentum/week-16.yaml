week: 16
unit: 4
title: "Linear Momentum, Impulse and Change in Momentum"
topics: ["4.1", "4.2"]
guide: guides/week-16.md
guide_description: |
  Linear momentum as a vector (p = mv, signs in one dimension), the total momentum of a system and the velocity
  of its centre of mass, the difference between momentum and kinetic energy, Newton's second law in momentum form
  (F_net = Δp/Δt), impulse as average force times time and as the area under a force–time graph, the
  impulse–momentum theorem, and why stretching the stopping time lowers the average force. Worked examples: two
  carts whose momenta cancel while their kinetic energies do not, a soccer kick read from a triangular force–time
  graph, a tennis ball rebounding from a wall (with the sign trap), an airbag compared with a dashboard as a
  functional-dependence check, and a cart pushed forward then backward by a force probe (positive and negative
  areas).
flashcards_description: |
  30 cards on linear momentum and impulse: momentum as a vector and its units, the momentum and centre-of-mass
  velocity of a system, momentum versus kinetic energy, Newton's second law in momentum form, impulse from average
  force and from force–time graphs, rebounds and the sign of Δp, stopping-time arguments (airbags, catching,
  landing), internal versus external forces, and three error-spot cards.

flashcards:
  - front: Linear momentum of one object → definition and unit
    back: |
      p = mv, a vector in the direction of the velocity. Unit kg·m/s (the same as N·s).
    topic_code: "4.1"
  - front: Momentum in one dimension → what the sign means
    back: |
      Choose a positive direction; momentum along it is positive, momentum opposite it is negative. A 2.0 kg cart at 3.0 m/s to the left is −6.0 kg·m/s if right is positive.
    topic_code: "4.1"
  - front: Total momentum of a system of carts → how to add it
    back: |
      Add the individual momenta as vectors (with signs in 1D): p_sys = m₁v₁ + m₂v₂ + … Opposite momenta can cancel.
    topic_code: "4.1"
  - front: Two carts, 0.50 kg at +1.2 m/s and 0.30 kg at −2.0 m/s → system momentum and kinetic energy
    back: |
      p = 0.60 − 0.60 = 0 kg·m/s, but K = 0.36 J + 0.60 J = 0.96 J. Momenta can cancel; kinetic energies never do.
    topic_code: "4.1"
  - front: Velocity of a system's centre of mass → formula from momentum
    back: |
      v_cm = p_sys / M_total = (m₁v₁ + m₂v₂ + …)/(m₁ + m₂ + …): the total momentum is the total mass moving at v_cm.
    topic_code: "4.1"
  - front: 2.0 kg cart at 3.0 m/s and a 1.0 kg cart at rest → centre-of-mass velocity
    back: |
      v_cm = (6.0 + 0)/3.0 = 2.0 m/s, not the plain average 1.5 m/s: each velocity is weighted by its mass.
    topic_code: "4.1"
  - front: Truck and bicycle with equal momentum → which has more kinetic energy?
    back: |
      The bicycle. K = p²/(2m), so for the same p the smaller mass has the larger kinetic energy (it must move much faster).
    topic_code: "4.1"
  - front: Doubling an object's speed → effect on momentum and on kinetic energy
    back: |
      Momentum doubles (p ∝ v); kinetic energy quadruples (K ∝ v²).
    topic_code: "4.1"
  - front: Momentum versus kinetic energy → vector or scalar?
    back: |
      Momentum is a vector (direction and sign matter); kinetic energy is a scalar that is never negative.
    topic_code: "4.1"
  - front: Newton's second law in momentum form → statement
    back: |
      F_net = Δp/Δt: the net external force on an object or system equals the rate at which its momentum changes. For constant mass it reduces to F_net = ma.
    topic_code: "4.2"
  - front: Impulse delivered by a constant or average force → formula and unit
    back: |
      J = F_avg Δt, a vector in the direction of the force. Unit N·s, equivalent to kg·m/s.
    topic_code: "4.2"
  - front: Impulse–momentum theorem → statement
    back: |
      The net impulse on an object equals its change in momentum: J_net = Δp = m v_f − m v_i.
    topic_code: "4.2"
  - front: Force–time graph → what its area means
    back: |
      The area between the curve and the time axis is the impulse. Area above the axis is positive impulse, area below is negative.
    topic_code: "4.2"
  - front: Triangular force–time pulse, peak 1500 N lasting 0.010 s → impulse
    back: |
      Area = ½ × 1500 N × 0.010 s = 7.5 N·s. On a 0.43 kg ball at rest that gives v = 7.5/0.43 ≈ 17 m/s.
    topic_code: "4.2"
  - front: Average force from a force–time pulse → how to find it
    back: |
      F_avg = (area under the graph)/(duration). For a symmetric triangle it is half the peak force.
    topic_code: "4.2"
  - front: Tennis ball 0.058 kg hits a wall at 25 m/s and rebounds at 20 m/s → magnitude of Δp
    back: |
      Taking the rebound direction as positive, Δp = 0.058(20 − (−25)) = 2.61 kg·m/s ≈ 2.6 kg·m/s, directed away from the wall.
    topic_code: "4.2"
  - front: Ball that bounces back versus ball that stops dead (same incoming speed) → which needs more impulse?
    back: |
      The bounce. Stopping changes p by mv; reversing changes it by more than mv (up to 2mv for the same rebound speed).
    topic_code: "4.2"
  - front: Airbag versus dashboard for the same passenger → what changes and what does not
    back: |
      Δp (and so the impulse) is the same: the passenger stops either way. The airbag stretches Δt, so F_avg = Δp/Δt is much smaller.
    topic_code: "4.2"
  - front: 70 kg passenger stopping from 15 m/s in 0.010 s versus 0.15 s → average force
    back: |
      Δp = 1050 kg·m/s; F_avg = 1.05 × 10⁵ N in 0.010 s, 7.0 × 10³ N in 0.15 s. Fifteen times the time, one fifteenth the force.
    topic_code: "4.2"
  - front: Bending your knees on landing from a jump → impulse argument
    back: |
      The change in momentum on landing is fixed by your speed. Bending the knees lengthens the stopping time, so the average force from the ground is smaller.
    topic_code: "4.2"
  - front: Average force at fixed Δp → functional dependence on stopping time
    back: |
      F_avg = Δp/Δt, so F_avg ∝ 1/Δt: doubling the stopping time halves the average force; halving it doubles the force.
    topic_code: "4.2"
  - front: Cart pushed +4.0 N for 0.50 s then −2.0 N for 0.40 s → net impulse
    back: |
      J = (4.0)(0.50) + (−2.0)(0.40) = 2.0 − 0.80 = 1.2 N·s in the positive direction.
    topic_code: "4.2"
  - front: Momentum–time graph of a cart → what its slope means
    back: |
      The slope Δp/Δt is the net force on the cart. A horizontal p–t graph means zero net force.
    topic_code: "4.2"
  - front: Internal forces in a system → effect on the system's total momentum
    back: |
      None. Internal forces come in third-law pairs whose impulses cancel; only a net external force changes p_sys.
    topic_code: "4.2"
  - front: Force sensor on a cart in a lab → what it measures and how impulse is found
    back: |
      It records force against time; the software (or you, with triangles and rectangles) finds the area under the force–time curve, which is the impulse on the cart.
    topic_code: "4.2"
  - front: Ball bouncing on the floor → normal force compared with weight during contact
    back: |
      The normal force is much larger than the weight: the ball's momentum reverses from down to up, so the net force (and net impulse) during contact points up.
    topic_code: "4.2"
  - front: Impulse–momentum versus work–energy → which graph area goes with which
    back: |
      Area under force–time is impulse (changes momentum). Area under force–position is work (changes kinetic energy).
    topic_code: "4.2"
  - front: Error-spot → "the tennis ball's Δp is 0.058 × (25 − 20) = 0.29 kg·m/s"
    back: |
      Subtracting speeds ignores direction. Velocity changes sign on the rebound: Δp = 0.058 × (20 − (−25)) = 2.61 kg·m/s.
    topic_code: "4.2"
  - front: Error-spot → "the airbag reduces the impulse on the passenger"
    back: |
      The impulse equals the passenger's change in momentum, which is the same either way. The airbag reduces the average force by increasing the stopping time.
    topic_code: "4.2"
  - front: Error-spot → "the two carts have zero total momentum, so they have no kinetic energy"
    back: |
      Momentum is a vector and can cancel; kinetic energy is a scalar that adds. Two carts moving apart or toward each other can have p_sys = 0 and plenty of K.
    topic_code: "4.1"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topics 4.1 and 4.2: momentum of objects and systems,
    centre-of-mass velocity, momentum versus kinetic energy, Newton's second law in momentum form, impulse and
    force–time graphs, stopping-time arguments), with 8 questions (35%) reviewing earlier weeks (motion graphs,
    free-body diagrams, Newton's second and third laws with friction, kinetic energy, work from a force–position
    graph and conservation of energy). Opens with a shared-context set on a force-probe push on a lab cart.
    Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the scoring
    notes. Calculator and equation sheet allowed throughout, as on the AP exam.
  questions:
    # ---- Stimulus set: force-probe push on a cart (4.2)
    - slug: apphys1-u04-w16-q01
      type: multiple_choice
      topic_code: "4.2"
      source: "AP Physics 1 CED, Topic 4.2"
      points: 1
      stimulus: |
        A lab group's 0.60 kg cart rolls along a level track with negligible friction at +0.50 m/s. A student pushes it in the positive direction with a force probe, which records the force on the cart:

        | t (s) | 0 | 0.05 | 0.10 | 0.15 | 0.20 |
        |---|---|---|---|---|---|
        | F (N) | 0 | 6.0 | 12.0 | 6.0 | 0 |

        The force rises in a straight line from zero to its peak and falls in a straight line back to zero, so the graph of F against t is a triangle. After t = 0.20 s the probe no longer touches the cart.
      prompt: |
        What impulse does the probe deliver to the cart?
      options:
        - "2.4 N·s in the positive direction"
        - "0.60 N·s in the positive direction"
        - "1.2 N·s in the positive direction"
        - "60 N·s in the positive direction"
      option_explanations:
        - |
          2.4 N·s is peak force × duration (12 N × 0.20 s), the area of a rectangle; the graph is a triangle, so its area is half that.
        - |
          0.60 N·s is the area of only the rising half of the triangle (½ × 12 N × 0.10 s); the falling half adds the same again.
        - |
          Correct. Impulse is the area under the force–time graph: ½ × base × height = ½ × 0.20 s × 12.0 N = 1.2 N·s, in the direction of the push.
        - |
          60 comes from dividing the peak force by the duration (12/0.20), which is a rate of change of force, not an area, and has the wrong unit.
      answer: 2
    - slug: apphys1-u04-w16-q02
      type: multiple_choice
      topic_code: "4.2"
      source: "AP Physics 1 CED, Topic 4.2"
      points: 1
      stimulus: |
        A lab group's 0.60 kg cart rolls along a level track with negligible friction at +0.50 m/s. A student pushes it in the positive direction with a force probe, which records the force on the cart:

        | t (s) | 0 | 0.05 | 0.10 | 0.15 | 0.20 |
        |---|---|---|---|---|---|
        | F (N) | 0 | 6.0 | 12.0 | 6.0 | 0 |

        The force rises in a straight line from zero to its peak and falls in a straight line back to zero, so the graph of F against t is a triangle. After t = 0.20 s the probe no longer touches the cart.
      prompt: |
        What is the cart's velocity after the push?
      options:
        - "+2.5 m/s"
        - "+2.0 m/s"
        - "+4.5 m/s"
        - "+0.72 m/s"
      option_explanations:
        - |
          Correct. Δv = J/m = 1.2 N·s ÷ 0.60 kg = 2.0 m/s, so v_f = v_i + Δv = 0.50 + 2.0 = 2.5 m/s.
        - |
          2.0 m/s is the change in velocity; the cart was already moving at +0.50 m/s, which must be added.
        - |
          4.5 m/s uses the rectangle area 2.4 N·s (giving Δv = 4.0 m/s) instead of the triangle's 1.2 N·s.
        - |
          0.72 multiplies the impulse by the mass; the impulse–momentum theorem gives Δv = J/m, a division.
      answer: 0
    - slug: apphys1-u04-w16-q03
      type: multiple_choice
      topic_code: "4.2"
      source: "AP Physics 1 CED, Topic 4.2"
      points: 1
      stimulus: |
        A lab group's 0.60 kg cart rolls along a level track with negligible friction at +0.50 m/s. A student pushes it in the positive direction with a force probe, which records the force on the cart:

        | t (s) | 0 | 0.05 | 0.10 | 0.15 | 0.20 |
        |---|---|---|---|---|---|
        | F (N) | 0 | 6.0 | 12.0 | 6.0 | 0 |

        The force rises in a straight line from zero to its peak and falls in a straight line back to zero, so the graph of F against t is a triangle. After t = 0.20 s the probe no longer touches the cart.
      prompt: |
        What is the average force the probe exerts on the cart during the 0.20 s push?
      options:
        - "12 N"
        - "6.0 N"
        - "1.2 N"
        - "24 N"
      option_explanations:
        - |
          12 N is the peak force, reached only for an instant at t = 0.10 s; the force is smaller for the rest of the push.
        - |
          Correct. F_avg = J/Δt = 1.2 N·s ÷ 0.20 s = 6.0 N, half the peak, as for any symmetric triangular pulse.
        - |
          1.2 is the impulse in N·s; it must be divided by the 0.20 s duration to give a force.
        - |
          24 N divides the impulse by 0.05 s, one step of the table, instead of the whole 0.20 s the force acts.
      answer: 1
    - slug: apphys1-u04-w16-q04
      type: multiple_choice
      topic_code: "4.2"
      source: "AP Physics 1 CED, Topic 4.2"
      points: 1
      stimulus: |
        A lab group's 0.60 kg cart rolls along a level track with negligible friction at +0.50 m/s. A student pushes it in the positive direction with a force probe, which records the force on the cart:

        | t (s) | 0 | 0.05 | 0.10 | 0.15 | 0.20 |
        |---|---|---|---|---|---|
        | F (N) | 0 | 6.0 | 12.0 | 6.0 | 0 |

        The force rises in a straight line from zero to its peak and falls in a straight line back to zero, so the graph of F against t is a triangle. After t = 0.20 s the probe no longer touches the cart.
      prompt: |
        The group repeats the run with 0.60 kg of extra mass loaded on the cart (1.20 kg in all), the same initial velocity and exactly the same force–time graph. Compared with the first run, how do the cart's change in momentum and change in velocity compare?
      options:
        - "The change in momentum doubles and the change in velocity is the same."
        - "The change in momentum and the change in velocity both halve."
        - "The change in momentum and the change in velocity are both unchanged."
        - "The change in momentum is the same and the change in velocity halves."
      option_explanations:
        - |
          The change in momentum equals the impulse, which is fixed by the identical force–time graph; doubling the mass does not double it.
        - |
          Δp equals the impulse, which has not changed; only Δv = Δp/m depends on the mass.
        - |
          Δp is unchanged, but with twice the mass the same Δp gives half the change in velocity.
        - |
          Correct. Same F–t graph means the same impulse, so the same Δp = 1.2 kg·m/s; Δv = Δp/m halves from 2.0 m/s to 1.0 m/s.
      answer: 3
    # ---- Independent items
    - slug: apphys1-u04-w16-q05
      type: multiple_choice
      topic_code: "4.1"
      source: "AP Physics 1 CED, Topic 4.1"
      points: 1
      prompt: |
        On a straight track, cart A (0.50 kg) moves at 1.2 m/s to the right and cart B (0.30 kg) moves at 2.0 m/s to the left, toward cart A. Taking right as positive, what is the total momentum of the two-cart system?
      options:
        - "1.2 kg·m/s"
        - "0 kg·m/s"
        - "0.96 kg·m/s"
        - "−0.64 kg·m/s"
      option_explanations:
        - |
          1.2 kg·m/s adds the magnitudes 0.60 + 0.60; momentum is a vector, and cart B's momentum is negative.
        - |
          Correct. p_A = (0.50)(+1.2) = +0.60 kg·m/s and p_B = (0.30)(−2.0) = −0.60 kg·m/s; they sum to zero.
        - |
          0.96 is the system's kinetic energy in joules (0.36 J + 0.60 J); kinetic energies add as scalars, momenta do not.
        - |
          −0.64 multiplies the total mass by the sum of the velocities, (0.80)(1.2 − 2.0); each velocity must be multiplied by its own mass.
      answer: 1
    - slug: apphys1-u04-w16-q06
      type: multiple_choice
      topic_code: "4.1"
      source: "AP Physics 1 CED, Topic 4.1"
      points: 1
      prompt: |
        A 2.0 kg cart moving at 3.0 m/s approaches a 1.0 kg cart at rest on the same level track. What is the velocity of the centre of mass of the two-cart system?
      options:
        - "1.5 m/s"
        - "3.0 m/s"
        - "2.0 m/s"
        - "6.0 m/s"
      option_explanations:
        - |
          1.5 m/s is the plain average of 3.0 and 0 m/s; the centre-of-mass velocity weights each velocity by its mass.
        - |
          3.0 m/s is the moving cart's velocity alone; the resting cart is part of the system's mass and slows the centre of mass.
        - |
          Correct. v_cm = (m₁v₁ + m₂v₂)/(m₁ + m₂) = (2.0 × 3.0 + 0)/3.0 = 2.0 m/s.
        - |
          6.0 is the system's total momentum in kg·m/s; it must be divided by the total mass of 3.0 kg.
      answer: 2
    - slug: apphys1-u04-w16-q07
      type: multiple_choice
      topic_code: "4.1"
      source: "AP Physics 1 CED, Topic 4.1"
      points: 1
      prompt: |
        A loaded delivery truck and a bicycle with its rider have momenta of equal magnitude. Which has the greater kinetic energy?
      options:
        - "The bicycle and rider, because for the same momentum the smaller mass must move much faster, and K = p²/(2m)."
        - "The truck, because it has much more mass and kinetic energy depends on mass."
        - "Neither; equal momenta mean equal kinetic energies."
        - "It cannot be determined without knowing the two speeds."
      option_explanations:
        - |
          Correct. K = ½mv² = p²/(2m). With p the same, K is inversely proportional to mass, so the lighter bicycle has far more kinetic energy.
        - |
          Kinetic energy depends on speed squared as well as mass; the truck's speed is much smaller, and the speed effect wins.
        - |
          Momentum (mv) and kinetic energy (½mv²) depend on speed differently, so equal momenta do not give equal energies.
        - |
          The speeds are not needed: equal momenta and the masses are enough, since K = p²/(2m).
      answer: 0
    - slug: apphys1-u04-w16-q08
      type: multiple_choice
      topic_code: "4.2"
      source: "AP Physics 1 CED, Topic 4.2"
      points: 1
      prompt: |
        A 0.058 kg tennis ball moving horizontally at 25 m/s hits a wall and rebounds straight back at 20 m/s. What is the magnitude of the ball's change in momentum?
      options:
        - "0.29 kg·m/s"
        - "1.45 kg·m/s"
        - "1.16 kg·m/s"
        - "2.61 kg·m/s"
      option_explanations:
        - |
          0.29 subtracts the speeds (25 − 20); the velocity reverses direction, so the change is 20 − (−25) = 45 m/s.
        - |
          1.45 is only the incoming momentum (0.058 × 25); the ball also gains momentum in the opposite direction.
        - |
          1.16 is only the rebound momentum (0.058 × 20); the change must include stopping the incoming motion.
        - |
          Correct. With the rebound direction positive, Δp = m(v_f − v_i) = 0.058 × (20 − (−25)) = 2.61 kg·m/s, directed away from the wall.
      answer: 3
    - slug: apphys1-u04-w16-q09
      type: multiple_choice
      topic_code: "4.2"
      source: "AP Physics 1 CED, Topic 4.2"
      points: 1
      prompt: |
        In two identical crash tests, a dummy moving at the same speed is brought to rest, once by the steering wheel and once by an inflating airbag. Which statement best explains why the airbag reduces injury?
      options:
        - "The airbag absorbs some of the dummy's momentum, so the dummy's change in momentum is smaller."
        - "The airbag increases the stopping time, which increases the impulse on the dummy."
        - "The impulse on the dummy is the same, but it is spread over a longer time, so the average force is smaller."
        - "The airbag reduces the impulse because it is softer than the steering wheel."
      option_explanations:
        - |
          The dummy stops in both tests, so its change in momentum (from mv to zero) is the same; the airbag cannot change that.
        - |
          Impulse equals the change in momentum, which is fixed; a longer stopping time lowers the force, not raises the impulse.
        - |
          Correct. J = Δp is the same in both tests; since F_avg = Δp/Δt, a longer stopping time gives a smaller average force on the dummy.
        - |
          Softness changes the stopping time, not the impulse; the impulse still equals the same change in momentum.
      answer: 2
    - slug: apphys1-u04-w16-q10
      type: multiple_choice
      topic_code: "4.2"
      source: "AP Physics 1 CED, Topic 4.2"
      points: 1
      prompt: |
        A 1500 kg car speeds up in a straight line from 10 m/s to 22 m/s in 6.0 s. What is the magnitude of the average net force on the car?
      options:
        - "5500 N"
        - "3000 N"
        - "2500 N"
        - "18,000 N"
      option_explanations:
        - |
          5500 N uses the final momentum (1500 × 22) instead of the change in momentum.
        - |
          Correct. F_net = Δp/Δt = 1500 kg × (22 − 10) m/s ÷ 6.0 s = 18,000 kg·m/s ÷ 6.0 s = 3000 N.
        - |
          2500 N uses the initial momentum (1500 × 10) instead of the change.
        - |
          18,000 is the change in momentum in kg·m/s; it must be divided by the 6.0 s to give a force.
      answer: 1
    - slug: apphys1-u04-w16-q11
      type: multiple_choice
      topic_code: "2.5"
      source: "AP Physics 1 CED, Topic 2.5"
      points: 1
      prompt: |
        A student pulls a 2.0 kg box across a level floor with a horizontal rope tension of 14 N. The coefficient of kinetic friction between box and floor is 0.30. What is the magnitude of the box's acceleration? (g = 9.8 m/s²)
      options:
        - "7.0 m/s²"
        - "6.7 m/s²"
        - "9.9 m/s²"
        - "4.1 m/s²"
      option_explanations:
        - |
          7.0 m/s² is 14 N ÷ 2.0 kg, which leaves out the friction force opposing the motion.
        - |
          6.7 m/s² takes friction as μ_k × m = 0.30 × 2.0 = 0.60 N, using the mass instead of the normal force mg.
        - |
          9.9 m/s² adds friction to the tension; kinetic friction opposes the sliding, so it is subtracted.
        - |
          Correct. F_N = mg = 19.6 N, so F_f = 0.30 × 19.6 = 5.88 N; a = (14 − 5.88)/2.0 ≈ 4.1 m/s².
      answer: 3
    - slug: apphys1-u04-w16-q12
      type: multiple_choice
      topic_code: "3.4"
      source: "AP Physics 1 CED, Topic 3.4"
      points: 1
      prompt: |
        A 0.20 kg ball is dropped from rest from a height of 1.8 m. Air resistance is negligible. What is the magnitude of its momentum just before it reaches the ground? (g = 9.8 m/s²)
      options:
        - "1.2 kg·m/s"
        - "3.5 kg·m/s"
        - "7.1 kg·m/s"
        - "0.84 kg·m/s"
      option_explanations:
        - |
          Correct. Energy conservation gives v = √(2gh) = √(2 × 9.8 × 1.8) ≈ 5.94 m/s, so p = mv = 0.20 × 5.94 ≈ 1.2 kg·m/s.
        - |
          3.5 is mgh = 0.20 × 9.8 × 1.8 ≈ 3.5 J, the energy lost from gravitational potential energy, not a momentum.
        - |
          7.1 multiplies the mass by 2gh = 35.3 m²/s², forgetting to take the square root to get the speed.
        - |
          0.84 uses v = √(gh) ≈ 4.2 m/s, dropping the factor of 2 from ½mv² = mgh.
      answer: 0
    - slug: apphys1-u04-w16-q13
      type: multiple_choice
      topic_code: "2.3"
      source: "AP Physics 1 CED, Topic 2.3"
      points: 1
      prompt: |
        A heavy pickup truck and a small hatchback collide head-on. How do the magnitudes of the forces they exert on each other, and the magnitudes of their changes in momentum, compare during the collision?
      options:
        - "The truck exerts the larger force, so the hatchback's change in momentum is larger."
        - "The forces are equal, but the hatchback's change in momentum is larger because it has less mass."
        - "The forces are equal and act for the same time, so the changes in momentum have equal magnitudes."
        - "The hatchback exerts the larger force, because it accelerates more."
      option_explanations:
        - |
          Newton's third law: the forces form an interaction pair and are always equal in magnitude, whatever the masses.
        - |
          Equal forces acting for the same contact time give equal impulses, so the changes in momentum are equal; it is the hatchback's change in velocity that is larger.
        - |
          Correct. The third-law pair has equal magnitudes and acts for the same contact time, so the impulses, and therefore the changes in momentum, are equal and opposite.
        - |
          The larger acceleration of the hatchback comes from its smaller mass under an equal force, not from a larger force.
      answer: 2
