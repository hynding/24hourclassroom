      source: "AP Physics 1 CED, Topic 4.2"
      points: 1
      prompt: |
        True or false: If a soccer ball and a bowling ball undergo changes in momentum of the same magnitude, they received impulses of the same magnitude, even if the forces and contact times were different.
      answer: true
      explanation: |
        True. By the impulse–momentum theorem, J = Δp. Equal |Δp| means equal |J|, whatever combination of average force and contact time produced it (a large force briefly or a small force for longer).
