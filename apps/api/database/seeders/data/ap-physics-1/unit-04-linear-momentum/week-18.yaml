      prompt: |
        Qualitative/quantitative translation. On a level, frictionless track, cart 1 of mass m moves at speed v₀ toward cart 2 of mass 2m, which is at rest. The experiment is done twice: in trial S the carts have Velcro and stick together; in trial E they have magnetic bumpers and the collision is elastic.

        (A) Without equations, explain in a clear, paragraph-length argument in which trial cart 2 ends up moving faster. Base your argument on what happens to cart 1 and on momentum conservation.

        (B) Derive expressions, in terms of v₀, for cart 2's velocity after the collision in trial S and in trial E. For trial E you may use v₁f = (m₁ − m₂)v₀/(m₁ + m₂) and v₂f = 2m₁v₀/(m₁ + m₂).

        (C) Explain how your results in (B) agree with your reasoning in (A), and calculate the fraction of the initial kinetic energy that is converted to internal energy in trial S.
      answer: |
        (A) In both trials the system's momentum is the same, m v₀, before and after. In trial S, cart 1 keeps moving forward with cart 2, so it keeps part of the forward momentum. In trial E, the light cart 1 bounces backward off the heavier cart 2, so it ends with negative momentum. For the total to stay m v₀, cart 2 must then carry more than the whole original momentum. So cart 2 moves faster in trial E.
        (B) Trial S: m v₀ = (3m)v, so v₂ = v₀/3. Trial E: v₂f = 2m v₀/(m + 2m) = 2v₀/3 (and v₁f = (m − 2m)v₀/(3m) = −v₀/3, so cart 1 does bounce back).
        (C) 2v₀/3 is greater than v₀/3, so cart 2 is faster in trial E, as argued; the negative v₁f = −v₀/3 confirms that cart 1 bounces back, which is what forced cart 2's momentum (2m)(2v₀/3) = 4m v₀/3 to exceed m v₀. In trial S, K_after = ½(3m)(v₀/3)² = m v₀²/6 = (1/3)(½m v₀²), so two thirds of the initial kinetic energy is converted to internal energy.
      explanation: |
        Six points.
        (A) 1 point: states that cart 2 moves faster in trial E.
        (A) 1 point: a coherent argument using momentum conservation: cart 1 keeps forward momentum in S but reverses in E, so cart 2 must carry more momentum in E. Answers that only say "elastic collisions give more energy" earn at most the first point.
        (B) 1 point: v₂ = v₀/3 for trial S, from momentum conservation.
        (B) 1 point: v₂ = 2v₀/3 for trial E (with substitution shown).
        (C) 1 point: links the results to (A): 2v₀/3 is greater than v₀/3, and v₁f is negative (cart 1 bounces back), consistent with the argument.
        (C) 1 point: two thirds (accept 0.67) of the initial kinetic energy converted, with work shown.
