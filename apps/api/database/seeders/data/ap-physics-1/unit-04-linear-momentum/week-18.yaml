      prompt: |
        In a ballistic pendulum, a dart is fired into a hanging block, sticks, and the block-and-dart swing up to a maximum height. Consider the system of the dart, block and Earth. Three states: (1) just before the dart hits, (2) just after it embeds, (3) at the highest point of the swing. Take the block's starting height as U_g = 0.

        (a) Describe an energy bar chart for states 1, 2 and 3, giving for each state which of K (kinetic energy), U_g (gravitational potential energy) and E_int (internal energy gained in the collision) are nonzero and how they compare.
        (b) Explain why the speed in state 2 must be found with momentum conservation rather than with energy conservation from state 1.
      answer: |
        (a) State 1: all the energy is K (the dart's); U_g = 0 and E_int = 0. State 2: K is much smaller than in state 1 (the block-and-dart move slowly); E_int is large, taking up the rest, so K + E_int equals the state-1 K; U_g = 0. State 3: K = 0; U_g equals the state-2 K; E_int is the same as in state 2. The total height of the bars is the same in all three states.
        (b) The collision between dart and block is perfectly inelastic: an unknown (and large) amount of kinetic energy becomes internal energy, so energy conservation from state 1 to state 2 cannot be applied with K alone. Momentum is conserved during the brief collision because the forces between dart and block are internal and the strings and gravity give negligible horizontal impulse.
