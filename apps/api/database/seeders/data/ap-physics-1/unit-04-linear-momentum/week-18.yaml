      prompt: |
        True or false: In an elastic collision between two carts, each cart has the same kinetic energy after the collision as it had before.
      answer: false
      explanation: |
        False. In an elastic collision the total kinetic energy is unchanged, but energy usually transfers from one cart to the other. For a 0.30 kg glider at 0.80 m/s hitting a 0.20 kg glider at rest, the first glider's kinetic energy drops from 0.096 J to about 0.004 J while the second's rises from 0 to about 0.092 J.
