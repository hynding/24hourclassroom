      prompt: |
        A 0.40 kg cart moving at +1.5 m/s collides elastically and head-on with a 0.60 kg cart at rest on a level, frictionless track. What is the 0.40 kg cart's velocity just after the collision? Give your answer in m/s, with its sign (positive is the original direction), to two decimal places.
