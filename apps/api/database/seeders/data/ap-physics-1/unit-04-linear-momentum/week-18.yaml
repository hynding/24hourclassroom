week: 18
unit: 4
title: "Elastic and Inelastic Collisions"
topics: ["4.4"]
guide: guides/week-18.md
guide_description: |
  Classifying collisions by what happens to the system's kinetic energy (elastic, inelastic, perfectly
  inelastic) while momentum is conserved in all of them, where the "lost" kinetic energy goes, the fraction lost
  when objects stick, the relative-speed check for an elastic collision, the outcomes of a head-on elastic
  collision with a target at rest and their limiting cases, and two-stage problems that join a collision to an
  energy-conservation stage. Worked examples: two carts that stick (with an energy table), an elastic magnetic
  bumper collision checked three ways, a ballistic pendulum with a dart and a hanging block, classifying a
  collision from before/after data, and the equal-mass, heavy-target and light-target limits.
flashcards_description: |
  30 cards on elastic and inelastic collisions: definitions, what is conserved in each kind, where kinetic energy
  goes, the fraction lost in a sticking collision, the relative-speed test, head-on elastic outcomes and their
  limiting cases, ballistic-pendulum reasoning in two stages, classifying collisions from data, bounces, and
  three error-spot cards.

flashcards:
  - front: Elastic collision → definition
    back: |
      A collision in which the total kinetic energy of the system is the same before and after (and momentum is conserved).
    topic_code: "4.4"
  - front: Inelastic collision → definition
    back: |
      A collision in which momentum is conserved but the system's total kinetic energy decreases, the difference becoming internal energy, sound or deformation.
    topic_code: "4.4"
  - front: Perfectly inelastic collision → definition
    back: |
      The objects stick together and move with one common velocity afterwards. It loses the most kinetic energy that momentum conservation allows.
    topic_code: "4.4"
  - front: Momentum in elastic versus inelastic collisions → is it conserved in both?
    back: |
      Yes. Momentum is conserved in every collision of an isolated system; the kind of collision only decides what happens to kinetic energy.
    topic_code: "4.4"
  - front: Kinetic energy "lost" in an inelastic collision → where it goes
    back: |
      Into the system's internal energy (warming, permanent deformation) and sound. Total energy is conserved; only the kinetic part decreases.
    topic_code: "4.4"
  - front: 0.80 kg cart at 1.5 m/s sticks to a 0.40 kg cart at rest → common velocity and kinetic energy lost
    back: |
      v = 1.2/1.2 = 1.0 m/s. K goes from 0.90 J to 0.60 J: 0.30 J (one third) is lost.
    topic_code: "4.4"
  - front: Moving object sticks to a target at rest → fraction of kinetic energy lost
    back: |
      m_target/(m_moving + m_target). Equal masses lose half; a light dart in a heavy block loses nearly all of it.
    topic_code: "4.4"
  - front: Relative-speed test for an elastic head-on collision → what it says
    back: |
      The speed at which the objects separate after equals the speed at which they approached before. If separation is slower, the collision was inelastic.
    topic_code: "4.4"
  - front: Head-on elastic collision, mass m₁ at v hits m₂ at rest → final velocities
    back: |
      v₁f = (m₁ − m₂)v/(m₁ + m₂) and v₂f = 2m₁v/(m₁ + m₂). They come from conserving both momentum and kinetic energy.
    topic_code: "4.4"
  - front: Elastic collision of equal masses, one at rest → outcome
    back: |
      The moving object stops and the target moves off with the original velocity: they exchange velocities (as in a row of hanging steel balls).
    topic_code: "4.4"
  - front: Elastic collision, very heavy object hits a very light one at rest → outcome
    back: |
      The heavy object barely slows; the light one leaves at about twice the heavy object's speed (v₂f → 2v as m₁ ≫ m₂).
    topic_code: "4.4"
  - front: Elastic collision, very light object hits a very heavy one at rest → outcome
    back: |
      The light object bounces back with almost its original speed; the heavy one barely moves (like a ball bouncing off a wall).
    topic_code: "4.4"
  - front: 0.50 kg cart at 2.0 m/s hits a 0.30 kg cart at rest elastically → final velocities
    back: |
      v₁f = (0.20/0.80)(2.0) = 0.50 m/s and v₂f = (1.0/0.80)(2.0) = 2.5 m/s. Check: p = 1.0 kg·m/s and K = 1.0 J before and after.
    topic_code: "4.4"
  - front: Classifying a collision from before/after velocities → steps
    back: |
      1. Check momentum is conserved (or find the missing velocity). 2. Compute total K before and after. Equal → elastic; less after → inelastic; common final velocity → perfectly inelastic.
    topic_code: "4.4"
  - front: Ballistic pendulum → the two stages and what each conserves
    back: |
      Stage 1, the dart embeds in the block: momentum conserved, kinetic energy not. Stage 2, the block swings up: mechanical energy conserved, momentum not (gravity and string tension act).
    topic_code: "4.4"
  - front: Ballistic pendulum, 0.010 kg dart into a 0.490 kg block that rises 5.0 cm → dart speed
    back: |
      After the hit, v = √(2gh) = √(2 × 9.8 × 0.050) ≈ 0.99 m/s. Then m v_dart = (m + M)v gives v_dart = 0.99 × 0.500/0.010 ≈ 49.5 m/s.
    topic_code: "4.4"
  - front: Ballistic pendulum shortcut "½mv² = (m + M)gh" → why it fails
    back: |
      It assumes kinetic energy survives the embedding, but that collision is perfectly inelastic: about 98% of the dart's kinetic energy becomes internal energy.
    topic_code: "4.4"
  - front: Ball dropped from 1.0 m rebounds to 0.64 m → kind of collision with the floor
    back: |
      Inelastic. Rebound speed/impact speed = √(0.64/1.0) = 0.80, so only 64% of the kinetic energy survives the bounce.
    topic_code: "4.4"
  - front: Superball versus clay ball dropped on a floor → collision types
    back: |
      The superball's bounce is nearly elastic (rises almost back to its starting height); the clay ball's is perfectly inelastic (it stops on the floor).
    topic_code: "4.4"
  - front: Energy table for a sticking collision → what it shows
    back: |
      Columns K₁, K₂, K_total and ΔE_internal before and after: K_total drops and ΔE_internal rises by the same amount, so total energy is unchanged.
    topic_code: "4.4"
  - front: Magnetic bumpers or springs on carts → why the collision is nearly elastic
    back: |
      The carts never touch: the magnetic (or spring) potential energy stored while they approach is returned as kinetic energy as they separate.
    topic_code: "4.4"
  - front: Two carts approaching with equal and opposite momenta stick together → final state
    back: |
      p_sys = 0, so they stop dead. All of their kinetic energy becomes internal energy, the largest possible loss.
    topic_code: "4.4"
  - front: Car-crash crumple zone → which kind of collision, and why designers want it
    back: |
      Highly inelastic. The crumpling converts kinetic energy into deformation and lengthens the collision time, reducing the force on passengers.
    topic_code: "4.4"
  - front: Explosion as the reverse of a perfectly inelastic collision → energy picture
    back: |
      Momentum is conserved in both. A sticking collision turns kinetic energy into internal energy; an explosion turns stored internal (chemical or elastic) energy into kinetic energy.
    topic_code: "4.4"
  - front: Can a collision of an isolated system end with more kinetic energy than it started with?
    back: |
      Only if stored energy is released (a spring plunger fires, a firework bursts). Ordinary collisions keep K the same (elastic) or reduce it.
    topic_code: "4.4"
  - front: Cart of mass m at v sticks to a cart of mass 2m at rest → final velocity and fraction of K lost
    back: |
      v_f = v/3; K_after/K_before = (3m)(v/3)²/(mv²) = 1/3, so two thirds is lost.
    topic_code: "4.4"
  - front: Cart of mass m at v hits a cart of mass 2m at rest elastically → final velocities
    back: |
      v₁f = −v/3 (it bounces back) and v₂f = 2v/3. The struck cart moves twice as fast as it would have after a sticking collision.
    topic_code: "4.4"
  - front: Error-spot → "the collision was inelastic, so momentum was not conserved"
    back: |
      Inelastic refers only to kinetic energy. Momentum is conserved in every collision with negligible external impulse.
    topic_code: "4.4"
  - front: Error-spot → "in an elastic collision each cart keeps its own kinetic energy"
    back: |
      Only the total kinetic energy is unchanged; energy usually transfers from one object to the other (all of it, for equal masses with one at rest).
    topic_code: "4.4"
  - front: Error-spot → "the dart's kinetic energy all goes into lifting the block"
    back: |
      The embedding is perfectly inelastic, so most of the dart's kinetic energy becomes internal energy. Use momentum for the collision, energy only for the swing.
    topic_code: "4.4"

quiz:
  description: |
    23 questions · about 40 minutes · mostly on this week (topic 4.4: elastic, inelastic and perfectly inelastic
    collisions, kinetic energy lost, the relative-speed test, head-on elastic outcomes and limiting cases, and
    two-stage collision-then-energy problems), with 8 questions (35%) reviewing earlier weeks (weeks 16–17's
    impulse and conservation of momentum, power, and conservation of energy). Opens with a shared-context set on
    two gliders colliding on an air track. Multiple choice, select-all, true/false and numeric items are graded at
    once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by
    your teacher against the scoring notes. Calculator and equation sheet allowed throughout, as on the AP exam.
  questions:
    # ---- Stimulus set: gliders on an air track (4.3, 4.4)
    - slug: apphys1-u04-w18-q01
      type: multiple_choice
      topic_code: "4.3"
      source: "AP Physics 1 CED, Topic 4.3"
      points: 1
      stimulus: |
        On a level air track (negligible friction), glider A of mass 0.30 kg moves at +0.80 m/s toward glider B of mass 0.20 kg, which is at rest. The gliders have spring bumpers. A video analysis shows that just after the collision glider A moves at +0.16 m/s. Take the original direction of A as positive.
      prompt: |
        What is glider B's velocity just after the collision?
      options:
        - "+0.64 m/s"
        - "+1.2 m/s"
        - "+0.96 m/s"
        - "+0.80 m/s"
      option_explanations:
        - |
          0.64 m/s gives B the same change in velocity that A had; it is the changes in momentum, not velocity, that are equal and opposite.
        - |
          1.2 m/s gives B all of A's initial momentum (0.24/0.20), ignoring that A keeps moving forward at 0.16 m/s.
        - |
          Correct. 0.30(0.80) = 0.30(0.16) + 0.20v_B, so 0.24 = 0.048 + 0.20v_B and v_B = 0.192/0.20 = 0.96 m/s.
        - |
          B does not simply take A's original speed; that happens only for equal masses in an elastic collision.
      answer: 2
    - slug: apphys1-u04-w18-q02
      type: multiple_choice
      topic_code: "4.4"
      source: "AP Physics 1 CED, Topic 4.4"
      points: 1
      stimulus: |
        On a level air track (negligible friction), glider A of mass 0.30 kg moves at +0.80 m/s toward glider B of mass 0.20 kg, which is at rest. The gliders have spring bumpers. A video analysis shows that just after the collision glider A moves at +0.16 m/s. Take the original direction of A as positive.
      prompt: |
        How should the collision be classified?
      options:
        - "Elastic, because the total kinetic energy is 0.096 J both before and after"
        - "Perfectly inelastic, because the gliders keep moving in the same direction"
        - "Inelastic, because glider A slows down"
        - "It cannot be classified without knowing how long the collision lasted."
      option_explanations:
        - |
          Correct. Before: ½(0.30)(0.80)² = 0.096 J. After: ½(0.30)(0.16)² + ½(0.20)(0.96)² = 0.0038 + 0.0922 = 0.096 J. Kinetic energy is conserved.
        - |
          Perfectly inelastic means the gliders stick and share one velocity; here they leave at 0.16 and 0.96 m/s.
        - |
          One object slowing down says nothing about the total; energy moved from A to B, and the total is unchanged.
        - |
          The duration affects the force, not the classification; comparing the total kinetic energy before and after decides it.
      answer: 0
    - slug: apphys1-u04-w18-q03
      type: multiple_choice
      topic_code: "4.4"
      source: "AP Physics 1 CED, Topic 4.4"
      points: 1
      stimulus: |
        On a level air track (negligible friction), glider A of mass 0.30 kg moves at +0.80 m/s toward glider B of mass 0.20 kg, which is at rest. The gliders have spring bumpers. A video analysis shows that just after the collision glider A moves at +0.16 m/s. Take the original direction of A as positive.
      prompt: |
        At what speed do the gliders move apart from each other just after the collision, and what does it show?
      options:
        - "1.12 m/s, faster than they approached, so energy was added"
        - "0.96 m/s, glider B's speed, so the collision was elastic"
        - "0.16 m/s, much slower than they approached, so the collision was inelastic"
        - "0.80 m/s, equal to the speed at which they approached, as expected for an elastic collision"
      option_explanations:
        - |
          1.12 adds the two velocities; both gliders move forward, so their separation speed is the difference, 0.96 − 0.16.
        - |
          B's speed relative to the track is not the separation speed; A is also moving forward at 0.16 m/s.
        - |
          0.16 m/s is A's velocity, not the rate at which the gap between the gliders grows.
        - |
          Correct. Separation speed = 0.96 − 0.16 = 0.80 m/s, the same as the approach speed 0.80 − 0 = 0.80 m/s, the signature of an elastic head-on collision.
      answer: 3
    - slug: apphys1-u04-w18-q04
      type: multiple_choice
      topic_code: "4.4"
      source: "AP Physics 1 CED, Topic 4.4"
      points: 1
      stimulus: |
        On a level air track (negligible friction), glider A of mass 0.30 kg moves at +0.80 m/s toward glider B of mass 0.20 kg, which is at rest. The gliders have spring bumpers. A video analysis shows that just after the collision glider A moves at +0.16 m/s. Take the original direction of A as positive.
      prompt: |
        The bumpers are replaced with Velcro pads, and the run is repeated with the same initial velocities, so the gliders stick together. How much kinetic energy does the system lose in the collision?
      options:
        - "0 J, because momentum is conserved"
        - "0.038 J"
        - "0.058 J"
        - "0.096 J, all of it"
      option_explanations:
        - |
          Momentum conservation does not require kinetic energy conservation; a sticking collision always loses some kinetic energy.
        - |
          Correct. v = 0.24/0.50 = 0.48 m/s; K after = ½(0.50)(0.48)² = 0.0576 J; lost = 0.096 − 0.0576 ≈ 0.038 J (the fraction m_B/(m_A + m_B) = 40%).
        - |
          0.058 J is the kinetic energy remaining after the collision, not the amount lost.
        - |
          The stuck gliders still move at 0.48 m/s to carry the momentum, so they keep some kinetic energy; only a collision with zero total momentum can lose it all.
      answer: 1
    # ---- Independent items
    - slug: apphys1-u04-w18-q05
      type: multiple_choice
      topic_code: "4.4"
      source: "AP Physics 1 CED, Topic 4.4"
      points: 1
      prompt: |
        A 0.010 kg foam-tipped dart is fired horizontally into a 0.490 kg block hanging from light strings and sticks in it. The block and dart swing up until they are 0.050 m above their starting height. What was the dart's speed? (g = 9.8 m/s²)
      options:
        - "7.0 m/s"
        - "0.99 m/s"
        - "50 m/s"
        - "35 m/s"
      option_explanations:
        - |
          7.0 m/s sets the dart's kinetic energy equal to (m + M)gh, assuming kinetic energy survives the sticking collision; about 98% of it does not.
        - |
          0.99 m/s is the speed of the block and dart just after the collision, from √(2gh); the dart alone was much faster.
        - |
          Correct. After the hit, v = √(2 × 9.8 × 0.050) ≈ 0.99 m/s; momentum in the collision: 0.010v_dart = 0.500 × 0.99, so v_dart ≈ 49.5 m/s ≈ 50 m/s.
        - |
          35 m/s uses v = √(gh) for the swing, dropping the 2 from ½mv² = mgh.
      answer: 2
    - slug: apphys1-u04-w18-q06
      type: multiple_choice
      topic_code: "4.4"
      source: "AP Physics 1 CED, Topic 4.4"
      points: 1
      prompt: |
        Two lumps of modelling clay slide toward each other on a smooth table, collide, and stick together. For the two-lump system, which is true of the collision?
      options:
        - "Momentum is conserved, and kinetic energy decreases."
        - "Kinetic energy is conserved, and momentum decreases."
        - "Both momentum and kinetic energy are conserved."
        - "Neither momentum nor kinetic energy is conserved."
      option_explanations:
        - |
          Correct. No significant horizontal external force acts, so momentum is conserved; sticking turns some kinetic energy into internal energy and deformation.
        - |
          It is the other way round: momentum is the quantity guaranteed by the lack of external force, while sticking always removes kinetic energy.
        - |
          Kinetic energy is conserved only in elastic collisions; clay that sticks and deforms is perfectly inelastic.
        - |
          Momentum is still conserved, because the forces between the lumps are internal and the table is smooth.
      answer: 0
    - slug: apphys1-u04-w18-q07
      type: multiple_choice
      topic_code: "4.4"
      source: "AP Physics 1 CED, Topic 4.4"
      points: 1
      prompt: |
        A billiard ball moving at 2.0 m/s hits an identical ball at rest head-on. The collision is elastic. What are the balls' velocities just afterwards?
      options:
        - "Both move forward at 1.0 m/s."
        - "The first bounces back at 2.0 m/s; the second stays at rest."
        - "The first keeps moving at 2.0 m/s; the second moves at 2.0 m/s."
        - "The first stops; the second moves forward at 2.0 m/s."
      option_explanations:
        - |
          Moving together at 1.0 m/s conserves momentum but halves the kinetic energy; that is the perfectly inelastic result.
        - |
          The struck ball cannot stay at rest; that would reverse the system's momentum.
        - |
          Both balls at 2.0 m/s would double the system's momentum and kinetic energy.
        - |
          Correct. For equal masses with one at rest, v₁f = (m − m)v/(2m) = 0 and v₂f = 2mv/(2m) = v: the balls exchange velocities.
      answer: 3
    - slug: apphys1-u04-w18-q08
      type: multiple_choice
      topic_code: "4.4"
      source: "AP Physics 1 CED, Topic 4.4"
      points: 1
      prompt: |
        A bowling ball moving at 3.0 m/s hits a table-tennis ball at rest head-on, and the collision is very nearly elastic. Approximately how fast does the table-tennis ball move afterwards?
      options:
        - "3.0 m/s, the same as the bowling ball"
        - "6.0 m/s"
        - "1.5 m/s"
        - "Nearly 0 m/s, because it is so light"
      option_explanations:
        - |
          If it left at 3.0 m/s, it would just ride along with the barely slowed bowling ball and never pull away; in an elastic collision they must separate at the approach speed.
        - |
          Correct. With m₁ much greater than m₂, v₂f = 2m₁v/(m₁ + m₂) ≈ 2v = 6.0 m/s: the light ball separates from the barely slowed bowling ball at the approach speed.
        - |
          Half the speed would mean the bowling ball runs into it again; a light target leaves faster than the heavy projectile, not slower.
        - |
          A light object struck by a heavy one is sent off fast; it is the light projectile hitting a heavy target that bounces back.
      answer: 1
    - slug: apphys1-u04-w18-q09
      type: multiple_choice
      topic_code: "4.4"
      source: "AP Physics 1 CED, Topic 4.4"
      points: 1
      prompt: |
        Cart 1 moves toward cart 2, which is at rest, and the masses and initial speed are the same in every trial. The carts' bumpers are changed between trials. In which kind of trial does the two-cart system lose the most kinetic energy?
      options:
        - "When the carts bounce apart elastically"
        - "When cart 1 stops dead and cart 2 moves off"
        - "When the carts stick together"
        - "The loss is the same in every trial, because momentum is conserved in each."
      option_explanations:
        - |
          An elastic collision loses no kinetic energy at all.
        - |
          Cart 1 stopping dead is the elastic outcome for equal masses; for a lighter cart 1 it is a partly inelastic collision, but it never loses more than sticking does.
        - |
          Correct. Sticking (perfectly inelastic) leaves the carts with the smallest kinetic energy consistent with the conserved momentum, so it loses the most.
        - |
          Momentum conservation fixes the total momentum, not the kinetic energy; different bumpers convert different amounts of kinetic energy to internal energy.
      answer: 2
    - slug: apphys1-u04-w18-q10
      type: multiple_choice
      topic_code: "4.4"
      source: "AP Physics 1 CED, Topic 4.4"
      points: 1
      prompt: |
        A cart moving at speed v hits an identical cart at rest, and they stick together. What fraction of the original kinetic energy is converted to internal energy?
      options:
        - "None of it"
        - "One quarter"
        - "All of it"
        - "One half"
      option_explanations:
        - |
          A sticking collision always converts some kinetic energy; only an elastic collision converts none.
        - |
          One quarter would be lost if the carts ended at about 0.61v; momentum conservation gives v/2, which keeps only half the kinetic energy.
        - |
          The carts must keep moving at v/2 to carry the momentum, so some kinetic energy remains.
        - |
          Correct. v_f = v/2; K_after = ½(2m)(v/2)² = ¼mv², half of K_before = ½mv², so half is converted.
      answer: 3
    - slug: apphys1-u04-w18-q11
      type: multiple_choice
      topic_code: "4.3"
      source: "AP Physics 1 CED, Topic 4.3"
      points: 1
      prompt: |
        On an icy road, a 1000 kg car moving at 20 m/s rear-ends a 1500 kg car moving at 10 m/s in the same direction, and the cars lock together. What is their speed just after the collision?
      options:
        - "14 m/s"
        - "15 m/s"
        - "8.0 m/s"
        - "2.0 m/s"
      option_explanations:
        - |
          Correct. (1000)(20) + (1500)(10) = 35,000 kg·m/s = (2500)v, so v = 14 m/s.
        - |
          15 m/s averages the speeds without weighting by mass; the heavier, slower car counts for more.
        - |
          8.0 m/s uses only the first car's momentum (20,000/2500); the second car was already moving forward.
        - |
          2.0 m/s subtracts the momenta as if the cars were moving toward each other; they move in the same direction.
      answer: 0
    - slug: apphys1-u04-w18-q12
      type: multiple_choice
      topic_code: "4.2"
      source: "AP Physics 1 CED, Topic 4.2"
      points: 1
      prompt: |
        A 1.0 kg cart moves at +2.0 m/s. A student applies a constant force of −3.0 N to it for 0.40 s. What is the cart's velocity afterwards?
      options:
        - "+3.2 m/s"
        - "+0.80 m/s"
        - "−1.2 m/s"
        - "+1.2 m/s"
      option_explanations:
        - |
          3.2 m/s adds the change in velocity; the force is negative, so the impulse reduces the cart's momentum.
        - |
          Correct. J = (−3.0)(0.40) = −1.2 N·s, so v_f = 2.0 + (−1.2)/1.0 = +0.80 m/s.
        - |
          −1.2 m/s is the change in velocity, not the final velocity; it must be added to the initial +2.0 m/s.
        - |
          1.2 is the size of the impulse in N·s (and of the change in velocity in m/s), not the final velocity.
      answer: 1
    - slug: apphys1-u04-w18-q13
      type: multiple_choice
      topic_code: "3.5"
      source: "AP Physics 1 CED, Topic 3.5"
      points: 1
      prompt: |
        A motor lifts a 25 kg crate straight up 3.0 m at constant speed in 5.0 s. What average power does the motor deliver to the crate? (g = 9.8 m/s²)
      options:
        - "15 W"
        - "735 W"
        - "150 W"
        - "3700 W"
      option_explanations:
        - |
          15 uses the mass instead of the weight (25 × 3.0/5.0); the force needed is mg = 245 N.
        - |
          735 is the work done in joules (245 N × 3.0 m); power divides it by the 5.0 s.
        - |
          Correct. At constant speed the motor's force equals mg = 245 N; W = 245 × 3.0 = 735 J; P = 735/5.0 = 147 W ≈ 150 W.
        - |
          3700 multiplies the work by the time instead of dividing by it.
      answer: 2
    - slug: apphys1-u04-w18-q14
      type: multi_select
      topic_code: "4.4"
      source: "AP Physics 1 CED, Topic 4.4"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about collisions of an isolated two-object system are correct? Select all that apply.
      options:
        - "In an elastic collision, the total kinetic energy after equals the total kinetic energy before."
        - "In an inelastic collision, the total momentum after is less than the total momentum before."
        - "In a perfectly inelastic collision, the objects move with a common velocity afterwards."
        - "In an elastic collision, each object's kinetic energy is unchanged."
        - "In an inelastic collision, the kinetic energy that disappears becomes internal energy, sound or deformation."
      option_explanations:
        - |
          Correct. That is the definition of an elastic collision; the total is conserved even though energy can pass from one object to the other.
        - |
          Momentum is conserved in every collision of an isolated system; "inelastic" describes only the kinetic energy.
        - |
          Correct. The objects stick together, so they share one velocity, fixed by momentum conservation.
        - |
          Only the total is unchanged; in general kinetic energy transfers between the objects (all of it, for equal masses with one at rest).
        - |
          Correct. Total energy is conserved; the kinetic energy lost reappears as internal energy (warming), sound and permanent deformation.
      answer: [0, 2, 4]
