        Three points.
        (a) 1 point: state 1 all kinetic; state 3 has zero kinetic, gravitational potential equal to state 2's kinetic.
        (a) 1 point: state 2 shows kinetic energy much smaller than in state 1 and a large internal-energy bar, with the total unchanged in all states.
        (b) 1 point: the collision converts kinetic energy into internal energy (perfectly inelastic), so mechanical energy is not conserved across it, while momentum is (internal forces, negligible external horizontal impulse).
