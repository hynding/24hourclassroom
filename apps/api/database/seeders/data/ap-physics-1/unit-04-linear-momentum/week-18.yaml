    - slug: apphys1-u04-w18-q21
      type: short_answer
      topic_code: "4.4"
      source: "AP Physics 1 CED, Topic 4.4"
      points: 3
      prompt: |
        A student drops a rubber ball from rest 1.00 m above a hard floor. It bounces and rises to a maximum height of 0.64 m. Air resistance is negligible.

        (a) Is the ball–floor collision elastic or inelastic? Justify your answer with energy.
        (b) Calculate the ratio of the ball's speed just after the bounce to its speed just before.
        (c) Where did the missing energy go?
      answer: |
        (a) Inelastic. The ball's mechanical energy at the top of the bounce (mg × 0.64 m) is less than at the start (mg × 1.00 m), so kinetic energy was lost in the collision with the floor (the ball's kinetic energy just after the bounce is less than just before).
        (b) v = √(2gh), so v_after/v_before = √(0.64/1.00) = 0.80.
        (c) Into internal energy of the ball and floor (they warm slightly, the rubber flexes and does not return all the energy) and sound.
      explanation: |
        Three points, one per part.
        (a) 1 point: inelastic, with the reason that the rebound height (so the kinetic energy just after) is smaller than the drop height (so the kinetic energy just before).
        (b) 1 point: 0.80, from v ∝ √h. Giving 0.64 (the energy ratio) earns 0.
        (c) 1 point: internal (thermal) energy and/or sound. "It was destroyed" earns 0.
