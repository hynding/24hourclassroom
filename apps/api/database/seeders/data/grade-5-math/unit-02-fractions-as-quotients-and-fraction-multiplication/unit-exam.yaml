unit: 2
description: |
  22 questions · about 45 minutes · every standard of Unit 2: fractions as division in sharing stories, shares
  between two whole numbers, finding a fraction of a whole number, the area of rectangles with fraction side
  lengths, and multiplying with mixed numbers in real-world problems. Two sets of questions share a picture.
  Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word is matched
  automatically; the short answer is checked by your teacher against the scoring notes.
questions:
  # ---- Fractions as quotients (5.NF.B.3)
  - slug: g5math-u02-check-q01
    type: multiple_choice
    topic_code: "5.NF.B.3"
    source: "IM K–5 Math Grade 5, Unit 2, Section A"
    points: 1
    stimulus: |
      Three friends share 5 sandwiches equally. In the picture, each sandwich is cut into 3 equal pieces, and the shaded pieces are one friend's share.
    figure: figures/u02-five-sandwiches.svg
    figure_alt: "Five same-size rectangles, one above another, labeled Sandwich 1 to Sandwich 5. Each rectangle is cut into 3 equal pieces. In every rectangle the first piece on the left is shaded blue, so 5 pieces are shaded in all, and each shaded piece is 1/3 of a sandwich."
    prompt: |
      How much does each friend get?
    options:
      - "3/5 of a sandwich"
      - "5/3 sandwiches"
      - "1/3 of a sandwich"
      - "5/15 of a sandwich"
    option_explanations:
      - |
        3/5 is less than 1, but there are more sandwiches than friends, so each friend gets more than 1. The numbers are flipped.
      - |
        Correct. Each friend gets 1 piece from each of the 5 sandwiches, and each piece is 1/3 of a sandwich: 5 ÷ 3 = 5/3.
      - |
        1/3 is one shaded piece. The friend gets one piece from every sandwich, so 5 of these pieces.
      - |
        5/15 counts the shaded pieces out of all 15 pieces. But the share is measured in sandwiches, and each piece is 1/3 of a sandwich.
    answer: 1

  - slug: g5math-u02-check-q02
    type: multiple_choice
    topic_code: "5.NF.B.3"
    source: "IM K–5 Math Grade 5, Unit 2, Section A"
    points: 1
    stimulus: |
      Three friends share 5 sandwiches equally. In the picture, each sandwich is cut into 3 equal pieces, and the shaded pieces are one friend's share.
    prompt: |
      Between which two whole numbers of sandwiches is one friend's share?
    options:
      - "1 and 2"
      - "0 and 1"
      - "5 and 6"
      - "2 and 3"
    option_explanations:
      - |
        Correct. The share is 5/3. Since 3/3 = 1 and 6/3 = 2, 5/3 is between 1 and 2. It is 1 2/3 sandwiches.
      - |
        A share less than 1 would happen with fewer sandwiches than friends. Here there are 5 sandwiches for only 3 friends.
      - |
        5 is the number of shaded pieces, but each piece is only a third of a sandwich.
      - |
        2 whole sandwiches would be 6 thirds. The share is 5 thirds, which is less than 2.
    answer: 0

  - slug: g5math-u02-check-q03
    type: numeric
    topic_code: "5.NF.B.3"
    source: "IM K–5 Math Grade 5, Unit 2, Section A"
    points: 1
    prompt: |
      19 ÷ 4 can be written as the mixed number □ 3/4. Type the whole number that goes in the box.
    answer: { value: 4, tolerance: 0 }
    explanation: |
      19 ÷ 4 = 4 R 3. Each share has 4 wholes, and the 3 left over make 3/4 more. So 19 ÷ 4 = 19/4 = 4 3/4.

  - slug: g5math-u02-check-q04
    type: multiple_choice
    topic_code: "5.NF.B.3"
    source: "IM K–5 Math Grade 5, Unit 2, Section A"
    points: 1
    prompt: |
      Which division has a quotient of 2 3/5?
    options:
      - "5 ÷ 13"
      - "23 ÷ 5"
      - "13 ÷ 5"
      - "10 ÷ 3"
    option_explanations:
      - |
        5 ÷ 13 = 5/13, which is less than 1. The numbers are in the wrong order.
      - |
        23 ÷ 5 = 23/5 = 4 3/5, because 20/5 = 4. The digits 2 and 3 are not the same as 2 wholes and 3 fifths.
      - |
        Correct. 13 ÷ 5 = 13/5. Since 10/5 = 2, there are 3 fifths left over: 2 3/5.
      - |
        10 ÷ 3 = 10/3 = 3 1/3. The quotient should be in fifths, so the divisor must be 5.
    answer: 2

  - slug: g5math-u02-check-q05
    type: true_false
    topic_code: "5.NF.B.3"
    source: "IM K–5 Math Grade 5, Unit 2, Section A"
    points: 1
    prompt: |
      True or false: when 4 people share 3 pizzas equally, each person gets less than 1 pizza.
    answer: true
    explanation: |
      True. Each person gets 3 ÷ 4 = 3/4 of a pizza, which is less than 1. There are fewer pizzas than people.

  - slug: g5math-u02-check-q06
    type: multiple_choice
    topic_code: "5.NF.B.3"
    source: "IM K–5 Math Grade 5, Unit 2, Section A"
    points: 1
    prompt: |
      Coach Diaz pours 12 liters of water equally into 5 bottles. How much water is in each bottle?
    options:
      - "5/12 liter"
      - "2 liters"
      - "7 liters"
      - "2 2/5 liters"
    option_explanations:
      - |
        5/12 is less than 1 liter, but there is more water than bottles. The amount being shared, 12, goes on top: 12/5.
      - |
        2 liters in each of 5 bottles uses only 10 liters. The 2 liters left over must be shared too, adding 2/5 liter to each.
      - |
        7 is 12 − 5. Sharing equally is division: 12 ÷ 5.
      - |
        Correct. 12 ÷ 5 = 12/5 = 2 2/5 liters, because 10/5 = 2 and 2 fifths are left over.
    answer: 3

  # ---- Fractions of whole numbers and fraction-side areas (5.NF.B.4)
  - slug: g5math-u02-check-q07
    type: multiple_choice
    topic_code: "5.NF.B.4"
    source: "IM K–5 Math Grade 5, Unit 2, Section B"
    points: 1
    prompt: |
      What is 2/7 × 21?
    options:
      - "6"
      - "3"
      - "42/147"
      - "21 2/7"
    option_explanations:
      - |
        Correct. 21 ÷ 7 = 3, so one seventh of 21 is 3, and two sevenths is 2 × 3 = 6.
      - |
        3 is only 1/7 of 21. Two sevenths is two of those parts.
      - |
        This multiplies 21 into the denominator too. Only the numerator is multiplied: 42/7 = 6.
      - |
        21 2/7 adds the fraction to 21. A fraction less than 1 of 21 must be less than 21.
    answer: 0

  - slug: g5math-u02-check-q08
    type: numeric
    topic_code: "5.NF.B.4"
    source: "IM K–5 Math Grade 5, Unit 2, Section B"
    points: 1
    prompt: |
      A school has 40 fifth graders, and 5/8 of them ride the bus. How many fifth graders ride the bus?
    answer: { value: 25, tolerance: 0 }
    explanation: |
      40 ÷ 8 = 5, so one eighth of the fifth graders is 5 students. Five eighths is 5 × 5 = 25 students.

  - slug: g5math-u02-check-q09
    type: multiple_choice
    topic_code: "5.NF.B.4"
    source: "IM K–5 Math Grade 5, Unit 2, Section B"
    points: 1
    prompt: |
      Which expression has the same value as 4/9 × 5?
    options:
      - "4 ÷ (9 × 5)"
      - "(4 × 5) ÷ 9"
      - "(9 × 5) ÷ 4"
      - "4 × 9 × 5"
    option_explanations:
      - |
        This is 4 ÷ 45, much too small. Multiply 5 by the numerator, then divide by the denominator.
      - |
        Correct. Multiply 5 by the numerator, 4, then divide by the denominator, 9. Both equal 20/9.
      - |
        This multiplies by the denominator and divides by the numerator, which is backward. It equals 45/4.
      - |
        4 × 9 × 5 multiplies by the denominator. The denominator tells you to divide by 9.
    answer: 1

  - slug: g5math-u02-check-q10
    type: multiple_choice
    topic_code: "5.NF.B.4"
    source: "IM K–5 Math Grade 5, Unit 2, Section C"
    points: 1
    figure: figures/u02-square-fifths-halves.svg
    figure_alt: "A unit square, with its bottom side and right side each labeled 1. It is cut into 5 equal columns and 2 equal rows, making 10 equal pieces. A rectangle in the top left corner, 3 columns wide and 1 row tall, is shaded blue: 3 pieces. The shaded rectangle's top side is labeled 3/5 and its left side is labeled 1/2."
    prompt: |
      The large square is 1 unit on each side. What is the area of the shaded rectangle?
    options:
      - "4/7 square unit"
      - "3/7 square unit"
      - "1/10 square unit"
      - "3/10 square unit"
    option_explanations:
      - |
        4/7 adds the numerators (3 + 1) and the denominators (5 + 2). Area multiplies: 3/5 × 1/2.
      - |
        The square is cut into 5 × 2 = 10 pieces, not 5 + 2 = 7. The shaded part is 3 of 10 pieces.
      - |
        1/10 is the area of one small piece. Three pieces are shaded.
      - |
        Correct. The shaded rectangle is 3/5 by 1/2. It covers 3 of the 10 equal pieces: 3/5 × 1/2 = 3/10 square unit.
    answer: 3

  - slug: g5math-u02-check-q11
    type: numeric
    topic_code: "5.NF.B.4"
    source: "IM K–5 Math Grade 5, Unit 2, Section C"
    points: 1
    prompt: |
      A rectangle is 1/5 unit by 1/7 unit, so its area is 1/5 × 1/7 = 1/□ square unit. Type the number that goes in the box.
    answer: { value: 35, tolerance: 0 }
    explanation: |
      A unit square cut into 5 rows and 7 columns has 5 × 7 = 35 equal pieces. The rectangle is one of them: 1/35 square unit.

  - slug: g5math-u02-check-q12
    type: multi_select
    topic_code: "5.NF.B.4"
    source: "IM K–5 Math Grade 5, Unit 2, Section C"
    points: 2
    partial_credit: true
    prompt: |
      Which rectangles have an area of exactly 1/2 square unit? Select all that apply.
    options:
      - "1/2 unit by 1 unit"
      - "1/4 unit by 2 units"
      - "2/3 unit by 3/4 unit"
      - "1/2 unit by 1/2 unit"
      - "1/3 unit by 1/6 unit"
    option_explanations:
      - |
        Yes. 1/2 × 1 = 1/2. This rectangle is half of a unit square.
      - |
        Yes. 2 × 1/4 = 2/4, which is the same as 1/2.
      - |
        Yes. 2/3 × 3/4 = 6/12, and 6 of 12 equal pieces is half.
      - |
        No. 1/2 × 1/2 = 1/4. Four of these squares fill a unit square.
      - |
        No. 1/3 × 1/6 = 1/18, a very small piece.
    answer: [0, 1, 2]

  - slug: g5math-u02-check-q13
    type: multiple_choice
    topic_code: "5.NF.B.4"
    source: "IM K–5 Math Grade 5, Unit 2, Section C"
    points: 1
    prompt: |
      A strip of paper is 5 inches long and 3/4 inch wide. What is its area?
    options:
      - "5 3/4 square inches"
      - "15/20 square inch"
      - "15/4 square inches"
      - "8/4 square inches"
    option_explanations:
      - |
        5 3/4 adds the length and the width. Area multiplies them.
      - |
        This multiplies the denominator by 5 too. The pieces are still fourths: 5 × 3 = 15 fourths.
      - |
        Correct. 5 × 3/4 = 15/4 square inches, which is 3 3/4 square inches.
      - |
        8/4 adds 5 + 3 in the numerator. Five strips of 3 fourths make 5 × 3 = 15 fourths.
    answer: 2

  - slug: g5math-u02-check-q14
    type: fill_blank
    topic_code: "5.NF.B.3"
    source: "IM K–5 Math Grade 5, Unit 2, Section A"
    points: 1
    prompt: |
      A sharing story written as 3 ÷ 8 = 3/8 tells about 3 pizzas and 8 people. The number of people sharing, 8, is the ____ of the fraction.
    answer: ["denominator", "the denominator", "denominators"]
    explanation: |
      The denominator is the bottom number. In a sharing story it is the number of people (or groups) sharing; the amount being shared is the numerator.

  # ---- Multiplying with mixed numbers (5.NF.B.6)
  - slug: g5math-u02-check-q15
    type: multiple_choice
    topic_code: "5.NF.B.6"
    source: "IM K–5 Math Grade 5, Unit 2, Section C"
    points: 1
    stimulus: |
      Use the area model. A rug is 3 1/4 feet long and 2 feet wide. The long side is split into 3 feet and 1/4 foot, making 2 smaller rectangles.
    figure: figures/u02-rug-area.svg
    figure_alt: "A rectangle drawn to scale. A line down near the right end splits the top side into a long part labeled 3 ft and a narrow part labeled 1/4 ft. The right side is labeled 2 ft. This makes a big rectangle 3 ft by 2 ft and a thin rectangle 1/4 ft by 2 ft."
    prompt: |
      What are the areas of the two smaller rectangles?
    options:
      - "6 square feet and 2/4 square foot"
      - "6 square feet and 1/4 square foot"
      - "5 square feet and 2 1/4 square feet"
      - "3 square feet and 1/4 square foot"
    option_explanations:
      - |
        Correct. The big part is 3 × 2 = 6 square feet. The thin part is 1/4 × 2 = 2/4 square foot.
      - |
        The thin part is 2 feet tall, so its area is 1/4 × 2 = 2/4, not 1/4.
      - |
        These add the sides (3 + 2 and 1/4 + 2) instead of multiplying them.
      - |
        These are only the lengths along the top. Each part is 2 feet wide, so multiply each length by 2.
    answer: 0

  - slug: g5math-u02-check-q16
    type: multiple_choice
    topic_code: "5.NF.B.6"
    source: "IM K–5 Math Grade 5, Unit 2, Section C"
    points: 1
    stimulus: |
      Use the area model. A rug is 3 1/4 feet long and 2 feet wide. The long side is split into 3 feet and 1/4 foot, making 2 smaller rectangles.
    prompt: |
      What is the area of the whole rug?
    options:
      - "6 1/4 square feet"
      - "6 1/2 square feet"
      - "10 1/2 square feet"
      - "5 1/4 square feet"
    option_explanations:
      - |
        6 1/4 forgets to multiply the 1/4 by 2. The thin part has an area of 2/4, which is 1/2.
      - |
        Correct. 6 + 2/4 = 6 2/4, which is 6 1/2 square feet. Or 13/4 × 2 = 26/4 = 6 1/2.
      - |
        10 1/2 is the perimeter, the distance around the rug. Area counts the square feet inside.
      - |
        5 1/4 adds the length and the width. Area multiplies them.
    answer: 1

  - slug: g5math-u02-check-q17
    type: numeric
    topic_code: "5.NF.B.6"
    source: "IM K–5 Math Grade 5, Unit 2, Section C"
    points: 1
    prompt: |
      Each bag holds 2 1/2 kilograms of rice. How many kilograms of rice are in 6 bags?
    answer: { value: 15, tolerance: 0 }
    explanation: |
      6 × 2 = 12 and 6 × 1/2 = 3. Together 12 + 3 = 15 kilograms. Or 6 × 5/2 = 30/2 = 15.

  - slug: g5math-u02-check-q18
    type: multiple_choice
    topic_code: "5.NF.B.6"
    source: "IM K–5 Math Grade 5, Unit 2, Section C"
    points: 1
    prompt: |
      What is 1 1/2 × 4 1/2?
    options:
      - "4 1/4"
      - "6"
      - "13 1/2"
      - "6 3/4"
    option_explanations:
      - |
        4 1/4 multiplies only the wholes (1 × 4) and only the halves (1/2 × 1/2). It leaves out 1 × 1/2 and 1/2 × 4.
      - |
        6 is 1 1/2 + 4 1/2. The problem asks to multiply.
      - |
        13 1/2 is 27/2. The numerators were multiplied (3 × 9 = 27) but the denominators were not: 2 × 2 = 4.
      - |
        Correct. 3/2 × 9/2 = 27/4 = 6 3/4. Pieces: 1 × 4 = 4, 1 × 1/2 = 1/2, 1/2 × 4 = 2, 1/2 × 1/2 = 1/4; total 6 3/4.
    answer: 3

  - slug: g5math-u02-check-q19
    type: multiple_choice
    topic_code: "5.NF.B.6"
    source: "IM K–5 Math Grade 5, Unit 2, Section C"
    points: 1
    prompt: |
      A granola recipe uses 1 3/4 cups of oats. Tara makes 3 batches. How many cups of oats does she need?
    options:
      - "3 3/4 cups"
      - "4 3/4 cups"
      - "5 1/4 cups"
      - "21/12 cups"
    option_explanations:
      - |
        Only the 1 was multiplied by 3. The 3/4 must be multiplied too: 3 × 3/4 = 9/4 = 2 1/4.
      - |
        4 3/4 adds 3 to 1 3/4. Three batches means 3 groups of 1 3/4, so multiply.
      - |
        Correct. 3 × 1 = 3 and 3 × 3/4 = 9/4 = 2 1/4. Then 3 + 2 1/4 = 5 1/4. Or 3 × 7/4 = 21/4.
      - |
        21/12 multiplies the denominator by 3 too. The parts stay fourths: 3 × 7/4 = 21/4.
    answer: 2

  - slug: g5math-u02-check-q20
    type: multiple_choice
    topic_code: "5.NF.B.6"
    source: "IM K–5 Math Grade 5, Unit 2, Section C"
    points: 1
    prompt: |
      Which is the best estimate of 4 3/4 × 2 1/8?
    options:
      - "About 10"
      - "About 8"
      - "About 6"
      - "About 20"
    option_explanations:
      - |
        Correct. 4 3/4 is close to 5 and 2 1/8 is close to 2, so the product is close to 5 × 2 = 10.
      - |
        4 × 2 = 8 rounds 4 3/4 down to 4, but 4 3/4 is much closer to 5. The product is nearer 10.
      - |
        6 comes from adding the whole numbers 4 and 2. The problem asks for a product.
      - |
        20 is too big. Even 5 × 3 = 15 would be more than the product, because 2 1/8 is close to 2.
    answer: 0

  - slug: g5math-u02-check-q21
    type: multiple_choice
    topic_code: "5.NF.B.6"
    source: "IM K–5 Math Grade 5, Unit 2, Section C"
    points: 1
    prompt: |
      A jump rope is 4 1/2 meters long. Ana cuts off 1/3 of it. How long is the piece she cuts off?
    options:
      - "1 1/3 meters"
      - "1 1/2 meters"
      - "13 1/2 meters"
      - "3 meters"
    option_explanations:
      - |
        1 1/3 is 1/3 of only the 4 meters. The extra 1/2 meter must be split into thirds too, so the piece is longer: 1/3 × 9/2 = 1 1/2.
      - |
        Correct. 1/3 × 9/2 = 9/6 = 1 3/6, which is 1 1/2 meters.
      - |
        13 1/2 is 3 × 4 1/2. Finding 1/3 of the rope makes it shorter, not longer.
      - |
        3 meters is the 2/3 of the rope that is left. The piece cut off is 1/3, half as long.
    answer: 1

  - slug: g5math-u02-check-q22
    type: short_answer
    topic_code: "5.NF.B.6"
    source: "IM K–5 Math Grade 5, Unit 2, Sections A and C"
    points: 3
    prompt: |
      Ms. Ortiz shares 7 yards of fabric equally among 4 groups.

      (a) How many yards does each group get? Write a division and a fraction, and give the answer as a mixed number.
      (b) Another class needs 3 times as much fabric as one group. How many yards is that? Show your work.
      (c) Explain why your answer to (b) is between 5 and 6 yards.
    answer: |
      (a) 7 ÷ 4 = 7/4 = 1 3/4 yards for each group.
      (b) 3 × 1 3/4: 3 × 1 = 3 and 3 × 3/4 = 9/4 = 2 1/4, so 3 + 2 1/4 = 5 1/4 yards. (Or 3 × 7/4 = 21/4 = 5 1/4.)
      (c) 21/4 is more than 20/4 = 5 and less than 24/4 = 6. Or: 3 × 1 = 3 and 3 × 2 = 6, and 1 3/4 is a little less than 2, so the answer is a little less than 6.
    explanation: |
      Three points.

      (a) 1 pt: 7 ÷ 4 and 7/4, with 1 3/4 yards. A share of 4/7 earns no point.

      (b) 1 pt: 5 1/4 yards (or 21/4) with work. Follow through: if (a) is wrong, give the point for 3 times that answer worked out correctly.

      (c) 1 pt: a correct reason, such as 20/4 = 5 and 24/4 = 6, or 5 1/4 is 5 wholes and one fourth more, which is less than 6.
