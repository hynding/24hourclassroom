week: 6
unit: 2
title: "Area of Rectangles With Fraction Side Lengths"
topics: ["5.NF.B.4"]
guide: guides/week-06.md
guide_description: |
  How to find the area of a rectangle whose sides are fractions of a unit by tiling a unit square with small equal
  pieces, why 1/5 × 1/2 = 1/10 and 2/3 × 3/4 = 6/12, and how to find the area when one side is a whole number,
  like a strip 2 units long and 3/4 unit wide.
flashcards_description: |
  19 cards on unit squares cut into equal pieces, the area of one piece, rectangles with fraction sides, the
  multiply-the-tops-and-bottoms rule for area, whole number by fraction rectangles, and common mistakes.

flashcards:
  - front: Unit square → its area
    back: |
      1 square unit. It is a square with sides 1 unit long, and every fraction-side rectangle this week fits on unit squares.
    topic_code: "5.NF.B.4"
  - front: Unit square cut into 3 columns and 4 rows → area of one piece
    back: |
      1/12 square unit. There are 3 × 4 = 12 equal pieces filling 1 square unit.
    topic_code: "5.NF.B.4"
  - front: Rectangle 1/2 unit by 1/5 unit → area
    back: |
      1/10 square unit. It is one of the 2 × 5 = 10 equal pieces of a unit square.
    topic_code: "5.NF.B.4"
  - front: Rectangle 1/4 unit by 1/6 unit → area
    back: |
      1/24 square unit. A unit square cut into 4 rows and 6 columns has 24 equal pieces.
    topic_code: "5.NF.B.4"
  - front: Rectangle 2/3 unit by 4/5 unit → area
    back: |
      8/15 square unit. 2 rows of 4 pieces are shaded (8), out of 3 × 5 = 15 pieces in the unit square.
    topic_code: "5.NF.B.4"
  - front: Rectangle 3/4 unit by 1/2 unit → area
    back: |
      3/8 square unit. Multiply the numerators (3 × 1 = 3) and the denominators (4 × 2 = 8).
    topic_code: "5.NF.B.4"
  - front: Area of a rectangle with fraction sides → the rule
    back: |
      Multiply the numerators to count the shaded pieces, and multiply the denominators to count the pieces in the whole unit square.
    topic_code: "5.NF.B.4"
  - front: Fraction-side area → why the denominators are multiplied
    back: |
      Cutting a unit square into b columns and d rows makes b × d equal pieces, so each piece is 1/(b × d) of the square.
    topic_code: "5.NF.B.4"
  - front: Fraction-side area → why the numerators are multiplied
    back: |
      The shaded rectangle is a columns wide and c rows tall, so it covers a × c of the small pieces.
    topic_code: "5.NF.B.4"
  - front: Rectangle 4 units by 2/3 unit → area
    back: |
      8/3 square units. Each of the 4 unit squares has 2 shaded thirds: 4 × 2 = 8 thirds.
    topic_code: "5.NF.B.4"
  - front: Rectangle 5 units by 1/2 unit → area
    back: |
      5/2 square units, which is 2 1/2. Five half-squares fit along the strip.
    topic_code: "5.NF.B.4"
  - front: Tiling a rectangle with fraction pieces → the rule for the pieces
    back: |
      The pieces must all be the same size and must cover the rectangle with no gaps and no overlaps, so you can count them.
    topic_code: "5.NF.B.4"
  - front: Common mistake → 1/2 × 1/3 = 2/5
    back: |
      That adds the parts. A rectangle 1/2 by 1/3 is one of 6 equal pieces of a unit square, so 1/2 × 1/3 = 1/6.
    topic_code: "5.NF.B.4"
  - front: Common mistake → adding the denominators in 2/3 × 3/4
    back: |
      A unit square cut into 3 rows and 4 columns has 3 × 4 = 12 pieces, not 3 + 4 = 7. So 2/3 × 3/4 = 6/12.
    topic_code: "5.NF.B.4"
  - front: Square with sides 1/2 unit → area
    back: |
      1/4 square unit. Four of these squares fill a unit square.
    topic_code: "5.NF.B.4"
  - front: Square with sides 3/4 unit → area
    back: |
      9/16 square unit. 3 × 3 = 9 pieces of a unit square cut into 4 × 4 = 16 pieces.
    topic_code: "5.NF.B.4"
  - front: Rectangle area with fraction sides → the formula
    back: |
      Area = length × width, the same as for whole numbers. A rectangle 2/5 foot by 2/3 foot has area 4/15 square foot.
    topic_code: "5.NF.B.4"
  - front: Both sides less than 1 unit → is the area more or less than 1?
    back: |
      Less than 1 square unit. The rectangle fits inside a unit square.
    topic_code: "5.NF.B.4"
  - front: Folded paper as a unit square → how it shows 1/3 × 1/2
    back: |
      Fold a sheet into thirds one way and halves the other way. Six boxes appear, and one box is 1/3 × 1/2 = 1/6 of the sheet.
    topic_code: "5.NF.B.4"

quiz:
  description: |
    15 questions · about 30 minutes · tiling unit squares, the area of rectangles with fraction side lengths,
    rectangles with one whole-number side, and review of fractions as division, unit cubes and volume. Multiple
    choice, select-all, true/false and number answers are graded at once; the fill-in word is matched
    automatically; the short answer is checked by your teacher.
  questions:
    - slug: g5math-w06-q01
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section C"
      points: 1
      stimulus: |
        Use the picture. The large square is 1 unit long on each side. It is cut into equal pieces, and a rectangle in the top left corner is shaded.
      figure: figures/w06-square-thirds-fifths.svg
      figure_alt: "A unit square, with its bottom side and right side each labeled 1. It is cut into 5 equal columns and 3 equal rows, making 15 equal pieces. A rectangle in the top left corner, 4 columns wide and 2 rows tall, is shaded blue: 8 pieces. The shaded rectangle's top side is labeled 4/5 and its left side is labeled 2/3."
      prompt: |
        What is the area of one small piece?
      options:
        - "1/15 square unit"
        - "1/8 square unit"
        - "1/5 square unit"
        - "15 square units"
      option_explanations:
        - |
          Correct. The unit square is cut into 5 × 3 = 15 equal pieces, so each piece is 1/15 of 1 square unit.
        - |
          8 is the number of shaded pieces. The whole unit square holds 15 pieces, so each one is 1/15.
        - |
          1/5 is the width of one column. Each column is also cut into 3 rows, so a piece is smaller than 1/5.
        - |
          15 is how many pieces there are. Together they make only 1 square unit, so each piece is much less than 1.
      answer: 0

    - slug: g5math-w06-q02
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section C"
      points: 1
      stimulus: |
        Use the picture. The large square is 1 unit long on each side. It is cut into equal pieces, and a rectangle in the top left corner is shaded.
      prompt: |
        Which equation tells the area of the shaded rectangle in square units?
      options:
        - "2/3 + 4/5 = 6/8"
        - "2/3 × 4/5 = 8/8"
        - "2/3 × 4/5 = 8/15"
        - "2 × 4 = 8"
      option_explanations:
        - |
          Area is found by multiplying the side lengths, not adding them. The shaded part is less than the whole square.
        - |
          8/8 is a whole square unit, but part of the square is white. The square has 3 × 5 = 15 pieces, so the denominator is 15.
        - |
          Correct. The shaded rectangle is 4/5 by 2/3. It covers 2 × 4 = 8 of the 3 × 5 = 15 pieces, so its area is 8/15 square unit.
        - |
          2 × 4 = 8 counts the shaded pieces but forgets their size. Each piece is 1/15 square unit, so the area is 8/15.
      answer: 2

    - slug: g5math-w06-q03
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section C"
      points: 1
      figure: figures/w06-square-2-by-5.svg
      figure_alt: "A square with its bottom side and right side each labeled 1 m. It is cut into 5 equal columns and 2 equal rows, making 10 equal pieces. Only the top left piece is shaded blue."
      prompt: |
        The square is 1 meter on each side. What is the area of the shaded piece?
      options:
        - "1/7 square meter"
        - "1/5 square meter"
        - "10 square meters"
        - "1/10 square meter"
      option_explanations:
        - |
          1/7 comes from adding 5 + 2. The square is cut into 5 × 2 = 10 equal pieces, not 7.
        - |
          1/5 is a whole column. The shaded piece is only the top half of a column, so it is half of 1/5.
        - |
          10 is the number of pieces. All 10 together make just 1 square meter, so one piece is much smaller.
        - |
          Correct. The square is cut into 10 equal pieces, so one piece is 1/10 square meter. Its sides are 1/5 m and 1/2 m: 1/5 × 1/2 = 1/10.
      answer: 3

    - slug: g5math-w06-q04
      type: numeric
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section C"
      points: 1
      prompt: |
        A rectangle is 1/4 unit by 1/6 unit, so its area is 1/4 × 1/6 = 1/□ square unit. Type the number that goes in the box.
      answer: { value: 24, tolerance: 0 }
      explanation: |
        A unit square cut into 4 rows and 6 columns has 4 × 6 = 24 equal pieces. The rectangle is one of them, so 1/4 × 1/6 = 1/24.

    - slug: g5math-w06-q05
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section C"
      points: 1
      prompt: |
        A garden tile is 3/4 meter long and 2/5 meter wide. What is its area?
      options:
        - "5/9 square meter"
        - "6/20 square meter"
        - "15/8 square meters"
        - "6/9 square meter"
      option_explanations:
        - |
          5/9 adds the numerators and the denominators. Area is length times width: multiply both.
        - |
          Correct. 3 × 2 = 6 and 4 × 5 = 20, so the area is 6/20 square meter.
        - |
          15/8 multiplies across in an X (3 × 5 over 4 × 2). Multiply top by top and bottom by bottom.
        - |
          The numerators were multiplied but the denominators were added. A unit square cut into 4 by 5 pieces has 20 pieces, not 9.
      answer: 1

    - slug: g5math-w06-q06
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section C"
      points: 1
      figure: figures/w06-three-by-two-fifths.svg
      figure_alt: "Three unit squares in a row, each with a bottom side labeled 1 and the height of the first labeled 1. Each square is cut into 5 equal rows. The bottom 2 rows are shaded blue all the way across the 3 squares, so each square has 2 shaded pieces and 6 pieces are shaded in all. The shaded strip is labeled 2/5 on the right."
      prompt: |
        The shaded rectangle is 3 units long and 2/5 unit wide. What is its area?
      options:
        - "6/15 square unit"
        - "3 2/5 square units"
        - "6/5 square units"
        - "2/15 square unit"
      option_explanations:
        - |
          This multiplies the denominator by 3 too. The pieces are still fifths of a unit square: 6 pieces of 1/5 is 6/5.
        - |
          3 2/5 adds the side lengths. Area multiplies them, and the strip covers only 2 of the 5 rows in each square.
        - |
          Correct. Each unit square has 2 shaded fifths, and there are 3 squares: 3 × 2/5 = 6/5 square units.
        - |
          2/15 divides 2/5 by 3 instead of multiplying. The strip runs across 3 whole squares, so the area is more than 2/5.
      answer: 2

    - slug: g5math-w06-q07
      type: numeric
      topic_code: "5.MD.C.4"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      prompt: |
        A rectangular prism is built from unit cubes. It is 2 cubes long, 3 cubes wide and 5 cubes tall. How many unit cubes are in it?
      answer: { value: 30, tolerance: 0 }
      explanation: |
        Each layer is 2 × 3 = 6 cubes, and there are 5 layers: 6 × 5 = 30 unit cubes, a volume of 30 cubic units.

    - slug: g5math-w06-q08
      type: true_false
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section C"
      points: 1
      prompt: |
        True or false: a square with sides 1/2 unit long has an area of 1 square unit.
      answer: false
      explanation: |
        False. Four squares with sides 1/2 unit fit inside a unit square, so each one has an area of 1/4 square unit: 1/2 × 1/2 = 1/4.

    - slug: g5math-w06-q09
      type: multi_select
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section C"
      points: 2
      partial_credit: true
      prompt: |
        Which rectangles have an area less than 1 square unit? Select all that apply.
      options:
        - "1/2 unit by 3/4 unit"
        - "2 units by 3/5 unit"
        - "4/5 unit by 9/10 unit"
        - "3 units by 1/4 unit"
        - "5/4 units by 2 units"
      option_explanations:
        - |
          Less than 1. Both sides are less than 1 unit, and the area is 3/8 square unit.
        - |
          Not less than 1. 2 × 3/5 = 6/5 square units, which is more than 1.
        - |
          Less than 1. Both sides are less than 1 unit, so the rectangle fits inside a unit square. Its area is 36/50 square unit.
        - |
          Less than 1. 3 × 1/4 = 3/4 square unit. The strip is long, but it is very thin.
        - |
          Not less than 1. Both sides are more than 1 unit, and 5/4 × 2 = 10/4 square units, which is 2 1/2.
      answer: [0, 2, 3]

    - slug: g5math-w06-q10
      type: fill_blank
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section C"
      points: 1
      prompt: |
        A rectangle 2/3 foot long and 1/2 foot wide has an ____ of 2/6 square foot, because it covers 2 of the 6 equal pieces of a 1-foot square.
      answer: ["area", "the area", "areas"]
      explanation: |
        Area is the number of square units that cover a shape. Here the shape covers 2/6 of a square foot: 2/3 × 1/2 = 2/6.

    - slug: g5math-w06-q11
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section C"
      points: 1
      prompt: |
        Which expression gives the area, in square units, of a rectangle that is 7/8 unit long and 1/3 unit wide?
      options:
        - "7/8 + 1/3"
        - "2 × 7/8 + 2 × 1/3"
        - "8/7 × 3"
        - "7/8 × 1/3"
      option_explanations:
        - |
          Adding the two sides does not give an area. The area of a rectangle is its length times its width.
        - |
          This adds all four sides, which is the perimeter, the distance around the rectangle. Area is length × width.
        - |
          8/7 × 3 flips both fractions. The side lengths are 7/8 and 1/3, and those are what we multiply.
        - |
          Correct. Area = length × width, so the area is 7/8 × 1/3 = 7/24 square unit.
      answer: 3

    # ---- spiral review
    - slug: g5math-w06-q12
      type: multiple_choice
      topic_code: "5.NF.B.3"
      source: "IM K–5 Math Grade 5, Unit 2, Section A"
      points: 1
      prompt: |
        Which division has the same value as the fraction 9/4?
      options:
        - "9 ÷ 4"
        - "4 ÷ 9"
        - "9 × 4"
        - "9 − 4"
      option_explanations:
        - |
          Correct. A fraction is its numerator divided by its denominator, so 9/4 = 9 ÷ 4, which is 2 1/4.
        - |
          4 ÷ 9 = 4/9, less than 1. The numerator, 9, is the number being divided.
        - |
          9 × 4 = 36. The fraction bar means divide, not multiply.
        - |
          9 − 4 = 5. The fraction bar means divide, not subtract.
      answer: 0

    - slug: g5math-w06-q13
      type: multiple_choice
      topic_code: "5.NF.B.3"
      source: "IM K–5 Math Grade 5, Unit 2, Section A"
      points: 1
      prompt: |
        Seven friends share 3 melons equally. How much melon does each friend get?
      options:
        - "7/3 of a melon"
        - "3/7 of a melon"
        - "1/7 of a melon"
        - "4/7 of a melon"
      option_explanations:
        - |
          7/3 is more than 2 melons. Seven friends sharing only 3 melons each get less than 1, so the numbers are flipped.
        - |
          Correct. 3 melons shared by 7 friends is 3 ÷ 7 = 3/7 of a melon each: one seventh of each melon.
        - |
          1/7 is a friend's part of one melon. There are 3 melons, so each friend gets 3 of those parts.
        - |
          4/7 comes from 7 − 3 = 4. Sharing equally is division: 3 ÷ 7.
      answer: 1

    - slug: g5math-w06-q14
      type: numeric
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      prompt: |
        A fish tank is shaped like a rectangular prism. It is 50 cm long, 20 cm wide and 30 cm tall. What is its volume in cubic centimeters? (Type the digits without a comma.)
      answer: { value: 30000, tolerance: 0 }
      explanation: |
        Volume = length × width × height = 50 × 20 × 30. 50 × 20 = 1,000, and 1,000 × 30 = 30,000 cubic centimeters.

    - slug: g5math-w06-q15
      type: short_answer
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section C"
      points: 2
      prompt: |
        A floor tile is 4/5 foot long and 1/2 foot wide.

        (a) Find the area of the tile. Explain how a 1-foot square cut into equal pieces shows your answer.
        (b) Is the area more or less than 1/2 square foot? Explain.
      answer: |
        (a) 4/5 × 1/2 = 4/10 square foot. Cut a 1-foot square into 5 columns and 2 rows, making 10 equal pieces of 1/10 square foot. The tile covers 4 columns of 1 row: 4 pieces, so 4/10 square foot.
        (b) Less. 1/2 square foot is 5/10, and 4/10 is less than 5/10. (Or: the tile is half of a 4/5-by-1 rectangle, and 4/5 is less than 1.)
      explanation: |
        Two points.

        (a) 1 pt: 4/10 square foot (or 2/5), with an area model or explanation that shows 10 equal pieces with 4 of them in the tile.

        (b) 1 pt: less, with a reason such as comparing 4/10 with 5/10, or noting that a rectangle 1 foot by 1/2 foot has area 1/2 and the tile is shorter than 1 foot.
