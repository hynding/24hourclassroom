week: 5
unit: 2
title: "Fractions of Whole Numbers"
topics: ["5.NF.B.4"]
guide: guides/week-05.md
guide_description: |
  How to find a fraction of a whole number such as 3/4 of 12 with tape diagrams and equal groups, how to write it
  as a multiplication (3/4 × 12), and how to find answers that are not whole numbers, like 2/3 × 5 = 10/3, by
  multiplying by the numerator and dividing by the denominator.
flashcards_description: |
  19 cards on unit fractions of a number, fractions of a number with tape diagrams, the multiply-then-divide rule,
  products that are not whole numbers, story problems with "of", and common mistakes.

flashcards:
  - front: 1/4 × 12 → what it means
    back: |
      1/4 of 12. Split 12 into 4 equal parts; one part is 3. So 1/4 × 12 = 3.
    topic_code: "5.NF.B.4"
  - front: 1/5 × 20 → product
    back: |
      4. Twenty split into 5 equal parts gives 4 in each part.
    topic_code: "5.NF.B.4"
  - front: 3/5 × 20 → product
    back: |
      12. One fifth of 20 is 4, and 3 fifths is 3 × 4 = 12.
    topic_code: "5.NF.B.4"
  - front: 2/3 of 18 → the two steps
    back: |
      Divide by the denominator: 18 ÷ 3 = 6. Multiply by the numerator: 2 × 6 = 12.
    topic_code: "5.NF.B.4"
  - front: a/b × n → the rule that always works
    back: |
      Multiply n by the numerator a, then divide by the denominator b. The answer is (a × n)/b. Example: 3/4 × 7 = 21/4.
    topic_code: "5.NF.B.4"
  - front: Unit fraction of a whole number → a quick way
    back: |
      Divide by the denominator. 1/6 of 42 is 42 ÷ 6 = 7.
    topic_code: "5.NF.B.4"
  - front: 1/3 × 2 → product
    back: |
      2/3. It is the same as 2 ÷ 3: two wholes shared into 3 equal parts.
    topic_code: "5.NF.B.4"
  - front: 2/5 × 3 → product
    back: |
      6/5. Multiply the numerator by 3 and keep the denominator: (2 × 3)/5 = 6/5, which is 1 1/5.
    topic_code: "5.NF.B.4"
  - front: 3/4 × 7 → between which two whole numbers
    back: |
      Between 5 and 6. 3/4 × 7 = 21/4, and 20/4 = 5 while 24/4 = 6. It is 5 1/4.
    topic_code: "5.NF.B.4"
  - front: The word "of" after a fraction → which operation
    back: |
      Multiply. "3/8 of 40" means 3/8 × 40 = 15.
    topic_code: "5.NF.B.4"
  - front: Tape diagram for 3/8 of 24 → how to read it
    back: |
      A bar for 24 cut into 8 equal parts, so each part is 3. Shade 3 parts: 3 + 3 + 3 = 9.
    topic_code: "5.NF.B.4"
  - front: 4 × 2/3 and 2/3 × 4 → are they equal?
    back: |
      Yes. Both are 8/3. Changing the order of the factors does not change the product.
    topic_code: "5.NF.B.4"
  - front: 5/5 × 30 → product
    back: |
      30. Five fifths is the whole, so 5/5 of 30 is all of 30.
    topic_code: "5.NF.B.4"
  - front: Common mistake → 2/3 × 12 = 24/36
    back: |
      Only the numerator is multiplied by 12. 2/3 × 12 = 24/3 = 8. The answer 24/36 is less than 1, far too small.
    topic_code: "5.NF.B.4"
  - front: Common mistake → stopping after 12 ÷ 3 for 2/3 of 12
    back: |
      12 ÷ 3 = 4 is only one third. Two thirds is 2 × 4 = 8.
    topic_code: "5.NF.B.4"
  - front: 1/10 of 70 → product
    back: |
      7. Seventy split into 10 equal parts gives 7 in each part.
    topic_code: "5.NF.B.4"
  - front: 2/3 × 5 → as a mixed number
    back: |
      3 1/3. 2/3 × 5 = 10/3, and 9/3 = 3 with 1 third left over.
    topic_code: "5.NF.B.4"
  - front: 5/6 of 30 → divide first or multiply first?
    back: |
      Either works. Dividing first keeps numbers small: 30 ÷ 6 = 5, then 5 × 5 = 25. Multiplying first: 150 ÷ 6 = 25.
    topic_code: "5.NF.B.4"
  - front: 3/7 of 28 students → how many
    back: |
      12 students. 28 ÷ 7 = 4 in each seventh, and 3 sevenths is 3 × 4 = 12.
    topic_code: "5.NF.B.4"

quiz:
  description: |
    16 questions · about 30 minutes · finding a fraction of a whole number with tape diagrams and equal groups,
    writing it as a multiplication, products that are not whole numbers, story problems, and review of fractions
    as division, volume and expressions. Multiple choice, select-all, true/false and number answers are graded at
    once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g5math-w05-q01
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section B"
      points: 1
      stimulus: |
        Use the tape diagram. The whole tape stands for 24 apples, and it is cut into 8 equal parts. Some parts are shaded.
      figure: figures/w05-tape-24.svg
      figure_alt: "A long bar with a brace above it labeled 24 apples. The bar is cut into 8 equal parts. The first 3 parts on the left are shaded blue and the other 5 parts are white."
      prompt: |
        What fraction of the 24 apples is shaded?
      options:
        - "3/24"
        - "3/8"
        - "5/8"
        - "8/3"
      option_explanations:
        - |
          The tape is cut into 8 equal parts, not 24. The denominator counts the parts of the tape: 3 of 8 parts are shaded.
        - |
          Correct. The tape has 8 equal parts and 3 of them are shaded, so 3/8 of the apples are shaded.
        - |
          5/8 is the white part of the tape. Only 3 of the 8 parts are shaded.
        - |
          8/3 is more than a whole. The shaded part is less than the whole tape, and the 8 parts belong on the bottom.
      answer: 1

    - slug: g5math-w05-q02
      type: numeric
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section B"
      points: 1
      stimulus: |
        Use the tape diagram. The whole tape stands for 24 apples, and it is cut into 8 equal parts. Some parts are shaded.
      prompt: |
        How many apples do the shaded parts stand for?
      answer: { value: 9, tolerance: 0 }
      explanation: |
        Each part is 24 ÷ 8 = 3 apples. Three parts are shaded: 3 × 3 = 9. So 3/8 × 24 = 9 apples.

    - slug: g5math-w05-q03
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section B"
      points: 1
      prompt: |
        What is 2/5 × 15?
      options:
        - "3"
        - "30/75"
        - "15 2/5"
        - "6"
      option_explanations:
        - |
          3 is 1/5 of 15. Two fifths is two of those parts: 2 × 3 = 6.
        - |
          This multiplies 15 into the denominator too. Only the numerator is multiplied: (2 × 15)/5 = 30/5 = 6.
        - |
          15 2/5 adds the fraction to 15. Two fifths of 15 is a part of 15, so it must be less than 15.
        - |
          Correct. 15 ÷ 5 = 3, so one fifth of 15 is 3 and two fifths is 2 × 3 = 6.
      answer: 3

    - slug: g5math-w05-q04
      type: numeric
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section B"
      points: 1
      prompt: |
        There are 28 students in a class, and 3/4 of them bring a water bottle. How many students bring a water bottle?
      answer: { value: 21, tolerance: 0 }
      explanation: |
        28 ÷ 4 = 7, so one fourth of the class is 7 students. Three fourths is 3 × 7 = 21 students.

    - slug: g5math-w05-q05
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section B"
      points: 1
      figure: figures/w05-counters-12.svg
      figure_alt: "12 counters split into 3 equal groups, each group circled. Each group has 4 counters. The counters in the first two groups are shaded blue, 8 in all. The 4 counters in the third group are white."
      prompt: |
        Which equation does the picture show?
      options:
        - "2/3 × 12 = 8"
        - "1/3 × 12 = 4"
        - "2 × 12 = 24"
        - "12 ÷ 2 = 6"
      option_explanations:
        - |
          Correct. The 12 counters are split into 3 equal groups, and 2 of the 3 groups are shaded. That is 2/3 of 12, which is 8.
        - |
          1/3 × 12 = 4 is the number in one group. Two groups are shaded, so the picture shows 2/3 of 12.
        - |
          2 × 12 would need 2 sets of 12 counters. The picture shows part of one set of 12.
        - |
          12 ÷ 2 splits the counters into 2 equal groups. The picture has 3 equal groups, with 2 of them shaded.
      answer: 0

    - slug: g5math-w05-q06
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section B"
      points: 1
      prompt: |
        Which expression has the same value as 3/5 × 4?
      options:
        - "(5 × 4) ÷ 3"
        - "3 ÷ (5 × 4)"
        - "(3 × 4) ÷ 5"
        - "3 × 4 × 5"
      option_explanations:
        - |
          This multiplies by the denominator and divides by the numerator, which is backward. It equals 20/3, not 12/5.
        - |
          This divides 3 by 20, which is 3/20, far too small. Multiply 4 by the numerator 3, then divide by 5.
        - |
          Correct. Multiply 4 by the numerator, 3, then divide by the denominator, 5. Both are 12/5.
        - |
          3 × 4 × 5 = 60 multiplies by the denominator. The denominator tells you to divide by 5, not multiply.
      answer: 2

    - slug: g5math-w05-q07
      type: true_false
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section B"
      points: 1
      prompt: |
        True or false: 1/4 × 9 is the same amount as 9 ÷ 4.
      answer: true
      explanation: |
        True. One fourth of 9 means 9 split into 4 equal parts, which is 9 ÷ 4. Both are 9/4, or 2 1/4.

    - slug: g5math-w05-q08
      type: multi_select
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which are equal to 2/3 × 9? Select all that apply.
      options:
        - "6"
        - "18/3"
        - "2 × (9 ÷ 3)"
        - "18/27"
        - "9 ÷ 3"
      option_explanations:
        - |
          Equal. One third of 9 is 9 ÷ 3 = 3, and two thirds is 2 × 3 = 6.
        - |
          Equal. Multiply 9 by the numerator: 2 × 9 = 18, so the product is 18/3, which is 6.
        - |
          Equal. This finds one third of 9 and then takes 2 of those parts: 2 × 3 = 6.
        - |
          Not equal. 18/27 multiplies the denominator by 9 too. It is less than 1, but 2/3 of 9 is 6.
        - |
          Not equal. 9 ÷ 3 = 3 is only one third of 9. Two thirds is twice that.
      answer: [0, 1, 2]

    - slug: g5math-w05-q09
      type: fill_blank
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section B"
      points: 1
      prompt: |
        To find 3/4 × 20, divide 20 by the denominator, 4, and then multiply by the ____, 3.
      answer: ["numerator", "the numerator"]
      explanation: |
        The numerator is the top number of a fraction. It tells how many of the equal parts to take: 20 ÷ 4 = 5, and 3 × 5 = 15.

    - slug: g5math-w05-q10
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section B"
      points: 1
      prompt: |
        A bike path is 5 kilometers long. Nia rides 3/4 of the path. How far does she ride?
      options:
        - "15/20 kilometer"
        - "5 3/4 kilometers"
        - "3/20 kilometer"
        - "15/4 kilometers"
      option_explanations:
        - |
          15/20 multiplies the denominator by 5 too. Only the numerator is multiplied: 3/4 × 5 = 15/4.
        - |
          5 3/4 adds 3/4 to the length of the path. Nia rides only part of the path, so the answer is less than 5.
        - |
          3/20 divides 3/4 by 5 instead of multiplying. Three fourths of 5 kilometers is much more than that.
        - |
          Correct. 3/4 × 5 = (3 × 5)/4 = 15/4 kilometers, which is 3 3/4 kilometers.
      answer: 3

    - slug: g5math-w05-q11
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section B"
      points: 1
      prompt: |
        3/8 × 5 is between which two whole numbers?
      options:
        - "1 and 2"
        - "15 and 16"
        - "0 and 1"
        - "2 and 3"
      option_explanations:
        - |
          Correct. 3/8 × 5 = 15/8. Since 8/8 = 1 and 16/8 = 2, 15/8 is between 1 and 2.
        - |
          15 is the number of eighths, not the number of wholes. 15 eighths is less than 2 wholes.
        - |
          The product is 15/8, and 15 eighths is more than 8 eighths, so it is more than 1.
        - |
          2 wholes would be 16/8. 15/8 is one eighth less than 2, so it is not between 2 and 3.
      answer: 0

    # ---- spiral review
    - slug: g5math-w05-q12
      type: multiple_choice
      topic_code: "5.NF.B.3"
      source: "IM K–5 Math Grade 5, Unit 2, Section A"
      points: 1
      prompt: |
        Eight students share 5 liters of juice equally. How much juice does each student get?
      options:
        - "8/5 liter"
        - "5/8 liter"
        - "1/8 liter"
        - "3/8 liter"
      option_explanations:
        - |
          8/5 is more than 1 liter. Eight students sharing only 5 liters cannot each get more than 1 liter.
        - |
          Correct. 5 liters shared by 8 students is 5 ÷ 8 = 5/8 liter each.
        - |
          1/8 liter is one student's part of a single liter. There are 5 liters, so each student gets 5 of those parts.
        - |
          3/8 comes from 8 − 5 = 3. Sharing is division, so the answer is 5 ÷ 8.
      answer: 1

    - slug: g5math-w05-q13
      type: numeric
      topic_code: "5.NF.B.3"
      source: "IM K–5 Math Grade 5, Unit 2, Section A"
      points: 1
      prompt: |
        29 ÷ 5 can be written as the mixed number □ 4/5. Type the whole number that goes in the box.
      answer: { value: 5, tolerance: 0 }
      explanation: |
        29 ÷ 5 = 5 R 4. Each share has 5 wholes, and the 4 left over make 4/5 more. So 29 ÷ 5 = 29/5 = 5 4/5.

    - slug: g5math-w05-q14
      type: multiple_choice
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      prompt: |
        A box has a base with an area of 18 square inches. The box is 5 inches tall. What is its volume?
      options:
        - "23 cubic inches"
        - "36 cubic inches"
        - "90 cubic inches"
        - "180 cubic inches"
      option_explanations:
        - |
          23 is 18 + 5. Volume is the base area times the height, so multiply.
        - |
          36 is 2 × 18, the area of the top and the bottom. The box is 5 layers tall, so multiply 18 by 5.
        - |
          Correct. The base holds 18 unit cubes in one layer, and there are 5 layers: 18 × 5 = 90 cubic inches.
        - |
          180 is 18 × 10. The box is 5 inches tall, not 10, so there are only 5 layers.
      answer: 2

    - slug: g5math-w05-q15
      type: multiple_choice
      topic_code: "5.OA.A.2"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      prompt: |
        Without working anything out, which expression is 4 times as large as 25 + 9?
      options:
        - "4 × (25 + 9)"
        - "4 + (25 + 9)"
        - "4 × 25 + 9"
        - "(25 + 9) ÷ 4"
      option_explanations:
        - |
          Correct. The parentheses keep 25 + 9 together, and multiplying the whole sum by 4 makes it 4 times as large.
        - |
          This adds 4 to the sum, which makes it only 4 more, not 4 times as large.
        - |
          Without parentheses, only the 25 is multiplied by 4. The 9 is not made 4 times as large.
        - |
          Dividing by 4 makes the sum smaller: one fourth as large, not 4 times as large.
      answer: 0

    - slug: g5math-w05-q16
      type: short_answer
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section B"
      points: 2
      prompt: |
        A school garden has 30 plants, and 2/5 of them are tomato plants.

        (a) How many tomato plants are there? Show your steps or draw a tape diagram.
        (b) How many plants are not tomato plants? Explain how you know.
      answer: |
        (a) 30 ÷ 5 = 6, so each fifth is 6 plants. 2/5 × 30 = 2 × 6 = 12 tomato plants.
        (b) 18 plants. The other 3/5 of the plants are not tomatoes: 3 × 6 = 18. Or 30 − 12 = 18.
      explanation: |
        Two points.

        (a) 1 pt: 12 tomato plants, with steps (30 ÷ 5 = 6, 2 × 6 = 12, or (2 × 30) ÷ 5) or a tape diagram of 30 in 5 parts of 6 with 2 parts shaded.

        (b) 1 pt: 18, with a reason (3/5 of 30, or 30 − 12). Give the point for a correct subtraction from a wrong answer in (a).
