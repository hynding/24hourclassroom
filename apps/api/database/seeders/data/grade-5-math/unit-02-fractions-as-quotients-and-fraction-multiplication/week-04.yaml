week: 4
unit: 2
title: "Fractions as Quotients: Sharing Equally"
topics: ["5.NF.B.3"]
guide: guides/week-04.md
guide_description: |
  How sharing things equally turns a division into a fraction (3 bars shared by 4 friends is 3 ÷ 4 = 3/4 of a
  bar), how to write any division as a fraction and any fraction as a division, and how to tell which two whole
  numbers a share is between when each person gets more than 1.
flashcards_description: |
  19 cards on fractions as division, sharing stories, quotients, which number goes on top, shares greater than 1
  written as mixed numbers, and how the size of a share changes when more people share.

flashcards:
  - front: Fraction as division → what 3/4 means
    back: |
      3 ÷ 4. A fraction is its numerator divided by its denominator, so 3/4 is what you get when 3 is shared equally into 4 parts.
    topic_code: "5.NF.B.3"
  - front: 3 ÷ 4 → as a fraction
    back: |
      3/4. Share 3 wholes among 4 people and each person gets 3/4 of a whole.
    topic_code: "5.NF.B.3"
  - front: 5 ÷ 8 → as a fraction
    back: |
      5/8. The number being divided goes on top and the number you divide by goes on the bottom.
    topic_code: "5.NF.B.3"
  - front: 7/3 → as a division
    back: |
      7 ÷ 3. Seven wholes shared equally by 3 makes 7/3 for each, which is 2 1/3.
    topic_code: "5.NF.B.3"
  - front: Quotient → can it be a fraction?
    back: |
      Yes. A quotient is the answer to a division. In 12 ÷ 4 = 3 the quotient is 3, and in 3 ÷ 4 = 3/4 the quotient is the fraction 3/4.
    topic_code: "5.NF.B.3"
  - front: 2 pizzas shared equally by 5 people → each share
    back: |
      2/5 of a pizza. Cut each pizza into 5 equal slices; each person gets 1 slice from each pizza, so 2 fifths.
    topic_code: "5.NF.B.3"
  - front: 4 sandwiches shared equally by 3 people → each share
    back: |
      4/3 of a sandwich, which is 1 1/3 sandwiches. Each person gets 1 whole sandwich and a third of the last one.
    topic_code: "5.NF.B.3"
  - front: 9 ÷ 2 → between which two whole numbers
    back: |
      Between 4 and 5. 9 ÷ 2 = 9/2, and 8/2 = 4 while 10/2 = 5. It is 4 1/2.
    topic_code: "5.NF.B.3"
  - front: Sharing story → what the numerator stands for
    back: |
      The amount being shared. In "5 children share 3 oranges", the numerator is 3: each child gets 3/5 of an orange.
    topic_code: "5.NF.B.3"
  - front: Sharing story → what the denominator stands for
    back: |
      The number of people (or groups) sharing. In "5 children share 3 oranges", the denominator is 5.
    topic_code: "5.NF.B.3"
  - front: 12 ÷ 4 and 12/4 → are they equal?
    back: |
      Yes. Both are 3. The fraction bar and the division sign do the same job.
    topic_code: "5.NF.B.3"
  - front: 1 ÷ 6 → as a fraction
    back: |
      1/6. One whole shared equally by 6 gives each person one sixth.
    topic_code: "5.NF.B.3"
  - front: 6 ÷ 6 → as a fraction and a whole number
    back: |
      6/6, which is 1. When the amount and the number of people are the same, each person gets exactly 1 whole.
    topic_code: "5.NF.B.3"
  - front: Common mistake → writing 3 ÷ 4 as 4/3
    back: |
      The numbers are flipped. 3 ÷ 4 = 3/4. The amount being shared (3) goes on top. 4/3 is more than 1, and 4 people sharing 3 things cannot each get more than 1.
    topic_code: "5.NF.B.3"
  - front: 17 ÷ 5 → as a mixed number
    back: |
      3 2/5. 17 ÷ 5 = 17/5. Since 15/5 = 3, there are 2 fifths left over: 3 2/5.
    topic_code: "5.NF.B.3"
  - front: Remainder → turning it into a fraction
    back: |
      Share the leftover too. 13 ÷ 4 = 3 R 1: each gets 3 wholes, and the 1 left over is cut into 4 parts, so each also gets 1/4. The share is 3 1/4.
    topic_code: "5.NF.B.3"
  - front: Same amount, more people sharing → bigger or smaller shares
    back: |
      Smaller. 3 pies shared by 4 gives 3/4 of a pie each; 3 pies shared by 5 gives only 3/5 of a pie each.
    topic_code: "5.NF.B.3"
  - front: Share more than 1 whole → how you can tell before dividing
    back: |
      The amount being shared is bigger than the number of people. 7 ÷ 3: 7 is more than 3, so each share is more than 1.
    topic_code: "5.NF.B.3"
  - front: Sharing → a picture that helps
    back: |
      Draw each thing being shared and cut every one into as many equal parts as there are people. Give each person one part from every thing, then count the parts.
    topic_code: "5.NF.B.3"

quiz:
  description: |
    15 questions · about 30 minutes · writing a sharing story as a division and a fraction, fractions as
    quotients, shares between two whole numbers on a number line, and review of volume, unit cubes and writing
    expressions. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word
    is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g5math-w04-q01
      type: multiple_choice
      topic_code: "5.NF.B.3"
      source: "IM K–5 Math Grade 5, Unit 2, Section A"
      points: 1
      stimulus: |
        Mei and 3 friends share 3 granola bars equally, so 4 friends share 3 bars. In the picture, each bar is cut into 4 equal pieces, and the shaded pieces are Mei's share.
      figure: figures/w04-three-bars-four-friends.svg
      figure_alt: "Three same-size rectangular granola bars, one above another, labeled Bar 1, Bar 2 and Bar 3. Each bar is cut into 4 equal pieces. In each bar the first piece on the left is shaded blue, so 3 pieces are shaded in all, and each shaded piece is 1/4 of a bar."
      prompt: |
        How much of a bar does Mei get?
      options:
        - "4/3 of a bar"
        - "1/4 of a bar"
        - "3/4 of a bar"
        - "1/3 of a bar"
      option_explanations:
        - |
          4/3 is more than a whole bar. Four friends sharing only 3 bars cannot each get more than 1 bar, so the numbers are flipped.
        - |
          1/4 of a bar is just one shaded piece. Mei gets one piece from each of the 3 bars, so she has 3 of these pieces.
        - |
          Correct. Mei gets 1 piece from each bar, so 3 pieces, and each piece is 1/4 of a bar. That is 3/4 of a bar.
        - |
          1/3 would mean each bar is cut into 3 equal pieces. The bars are cut into 4 pieces, one for each friend.
      answer: 2

    - slug: g5math-w04-q02
      type: multiple_choice
      topic_code: "5.NF.B.3"
      source: "IM K–5 Math Grade 5, Unit 2, Section A"
      points: 1
      stimulus: |
        Mei and 3 friends share 3 granola bars equally, so 4 friends share 3 bars. In the picture, each bar is cut into 4 equal pieces, and the shaded pieces are Mei's share.
      prompt: |
        Which division matches this sharing story?
      options:
        - "3 ÷ 4"
        - "4 ÷ 3"
        - "12 ÷ 4"
        - "3 × 4"
      option_explanations:
        - |
          Correct. 3 bars are shared equally by 4 friends, so the division is 3 ÷ 4, and each share is 3/4 of a bar.
        - |
          4 ÷ 3 would mean 4 bars shared by 3 friends. Here there are 3 bars and 4 friends.
        - |
          12 ÷ 4 = 3 tells how many pieces each friend gets, not how much of a bar. The story shares 3 bars, not 12.
        - |
          3 × 4 = 12 counts all the pieces. The friends are splitting the bars, so the story is a division.
      answer: 0

    - slug: g5math-w04-q03
      type: numeric
      topic_code: "5.NF.B.3"
      source: "IM K–5 Math Grade 5, Unit 2, Section A"
      points: 1
      prompt: |
        Write the division as a fraction: 11 ÷ 6 = □/6. Type the number that goes in the box.
      answer: { value: 11, tolerance: 0 }
      explanation: |
        A division can be written as a fraction: the number being divided goes on top. 11 ÷ 6 = 11/6.

    - slug: g5math-w04-q04
      type: multiple_choice
      topic_code: "5.MD.C.3"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      prompt: |
        Juno packs a box with 1-centimeter cubes. The cubes fill the box with no gaps and no overlaps, and she uses 40 cubes. What is the volume of the box?
      options:
        - "40 square centimeters"
        - "40 centimeters"
        - "40 cubic inches"
        - "40 cubic centimeters"
      option_explanations:
        - |
          Square centimeters measure area, the flat space a shape covers. Volume fills space, so it is measured in cubic units.
        - |
          Centimeters measure length along a line. The box is filled with cubes, so its volume is measured in cubic units.
        - |
          The number 40 is right, but the cubes are 1-centimeter cubes, not 1-inch cubes. The unit must be cubic centimeters.
        - |
          Correct. Each 1-centimeter cube has a volume of 1 cubic centimeter, and 40 of them fill the box with no gaps.
      answer: 3

    - slug: g5math-w04-q05
      type: multiple_choice
      topic_code: "5.NF.B.3"
      source: "IM K–5 Math Grade 5, Unit 2, Section A"
      points: 1
      figure: figures/w04-number-line-halves.svg
      figure_alt: "A number line from 0 to 5 with the whole numbers 0, 1, 2, 3, 4 and 5 labeled. A short tick mark sits halfway between each pair of whole numbers, so each whole is split into halves. A red point labeled P sits on the tick mark halfway between 4 and 5."
      prompt: |
        Two hikers share 9 liters of water equally. Each hiker gets 9 ÷ 2 = 9/2 liters, shown by point P. Between which two whole numbers of liters is each hiker's share?
      options:
        - "9 and 10"
        - "4 and 5"
        - "2 and 3"
        - "3 and 4"
      option_explanations:
        - |
          9 is the number of halves, not the number of whole liters. Nine halves is only 4 wholes and 1 half.
        - |
          Correct. 8/2 = 4 and 10/2 = 5, so 9/2 is between 4 and 5. Point P is halfway between them: 4 1/2 liters.
        - |
          2 is the number of hikers. Each hiker gets far more than 2 liters, because 9 liters is split only 2 ways.
        - |
          4 wholes would be 8 halves, and there are 9 halves. So each share is more than 4, not less than 4.
      answer: 1

    - slug: g5math-w04-q06
      type: numeric
      topic_code: "5.NF.B.3"
      source: "IM K–5 Math Grade 5, Unit 2, Section A"
      points: 1
      prompt: |
        A teacher cuts 20 meters of ribbon into 3 equal pieces, so each piece is 20 ÷ 3 = 20/3 meters long. Written as a mixed number, 20/3 has a whole number part and a fraction part. Type the whole number part.
      answer: { value: 6, tolerance: 0 }
      explanation: |
        18/3 = 6 and 21/3 = 7, so 20/3 is between 6 and 7. It is 6 2/3 meters: 20 ÷ 3 = 6 R 2, and the 2 leftover meters shared 3 ways give 2/3 more.

    - slug: g5math-w04-q07
      type: true_false
      topic_code: "5.NF.B.3"
      source: "IM K–5 Math Grade 5, Unit 2, Section A"
      points: 1
      prompt: |
        True or false: 2 ÷ 5 and 5 ÷ 2 are equal.
      answer: false
      explanation: |
        False. 2 ÷ 5 = 2/5, which is less than 1 (2 things shared by 5). 5 ÷ 2 = 5/2, which is 2 1/2 (5 things shared by 2). The order matters in division.

    - slug: g5math-w04-q08
      type: multi_select
      topic_code: "5.NF.B.3"
      source: "IM K–5 Math Grade 5, Unit 2, Section A"
      points: 2
      partial_credit: true
      prompt: |
        Which are equal to 6/5? Select all that apply.
      options:
        - "6 ÷ 5"
        - "5 ÷ 6"
        - "1 1/5"
        - "6 × 1/5"
        - "1 1/6"
      option_explanations:
        - |
          Equal. A fraction is its numerator divided by its denominator, so 6/5 = 6 ÷ 5.
        - |
          Not equal. 5 ÷ 6 = 5/6, which is less than 1. The numbers are in the wrong order.
        - |
          Equal. 5/5 is 1 whole, and 1 fifth is left over, so 6/5 = 1 1/5.
        - |
          Equal. Six copies of one fifth make 6 fifths.
        - |
          Not equal. 1 1/6 is 7/6, made of sixths. 6/5 is 1 whole and one fifth, not one sixth.
      answer: [0, 2, 3]

    - slug: g5math-w04-q09
      type: fill_blank
      topic_code: "5.NF.B.3"
      source: "IM K–5 Math Grade 5, Unit 2, Section A"
      points: 1
      prompt: |
        The answer to a division is called the ____. In 3 ÷ 8 = 3/8, it is 3/8.
      answer: ["quotient", "the quotient", "quotients"]
      explanation: |
        The quotient is the answer to a division. A fraction like 3/8 can be the quotient of 3 ÷ 8.

    - slug: g5math-w04-q10
      type: multiple_choice
      topic_code: "5.NF.B.3"
      source: "IM K–5 Math Grade 5, Unit 2, Section A"
      points: 1
      prompt: |
        Six friends share 4 small pizzas equally. How much pizza does each friend get?
      options:
        - "6/4 of a pizza"
        - "4/6 of a pizza"
        - "1/6 of a pizza"
        - "1/4 of a pizza"
      option_explanations:
        - |
          6/4 is more than a whole pizza. Six friends sharing only 4 pizzas each get less than 1 pizza, so the numbers are flipped.
        - |
          Correct. 4 pizzas shared by 6 friends is 4 ÷ 6 = 4/6 of a pizza each: one sixth from each of the 4 pizzas.
        - |
          1/6 is the slice each friend gets from one pizza. There are 4 pizzas, so each friend gets 4 of those slices.
        - |
          1/4 would come from cutting each pizza into 4 parts. With 6 friends, each pizza must be cut into 6 parts.
      answer: 1

    - slug: g5math-w04-q11
      type: multiple_choice
      topic_code: "5.NF.B.3"
      source: "IM K–5 Math Grade 5, Unit 2, Section A"
      points: 1
      prompt: |
        In which sharing story does each person get more than 1 whole sandwich?
      options:
        - "5 sandwiches shared equally by 4 people"
        - "4 sandwiches shared equally by 5 people"
        - "3 sandwiches shared equally by 3 people"
        - "2 sandwiches shared equally by 7 people"
      option_explanations:
        - |
          Correct. 5 ÷ 4 = 5/4, which is 1 1/4. There are more sandwiches than people, so each person gets more than 1.
        - |
          4 ÷ 5 = 4/5, less than 1. There are fewer sandwiches than people, so nobody can get a whole one.
        - |
          3 ÷ 3 = 3/3, which is exactly 1 sandwich each, not more than 1.
        - |
          2 ÷ 7 = 2/7, much less than 1. Seven people share only 2 sandwiches.
      answer: 0

    # ---- spiral review
    - slug: g5math-w04-q12
      type: multiple_choice
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      figure: figures/w04-prism-6-4-3.svg
      figure_alt: "A box shaped like a rectangular prism. The front edge along the bottom is labeled 6 cm, the edge going back along the bottom right is labeled 4 cm, and the height on the left is labeled 3 cm. Hidden edges are drawn as dashed lines."
      prompt: |
        The box is 6 cm long, 4 cm wide and 3 cm tall. What is its volume?
      options:
        - "13 cubic centimeters"
        - "24 cubic centimeters"
        - "108 cubic centimeters"
        - "72 cubic centimeters"
      option_explanations:
        - |
          13 is 6 + 4 + 3. Volume is found by multiplying the three edge lengths, not adding them.
        - |
          24 is 6 × 4, the number of cubes in just the bottom layer. The box is 3 layers tall.
        - |
          108 is the area of all six faces added together (the surface area). Volume counts the cubes inside: 6 × 4 × 3.
        - |
          Correct. 6 × 4 = 24 cubes in each layer, and 3 layers make 24 × 3 = 72 cubic centimeters.
      answer: 3

    - slug: g5math-w04-q13
      type: numeric
      topic_code: "5.MD.C.4"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      prompt: |
        A box is packed with unit cubes and no gaps. Each layer has 5 rows of 3 cubes, and there are 4 layers. How many unit cubes are in the box?
      answer: { value: 60, tolerance: 0 }
      explanation: |
        One layer has 5 × 3 = 15 cubes. Four layers have 15 × 4 = 60 cubes, so the volume is 60 cubic units.

    - slug: g5math-w04-q14
      type: multiple_choice
      topic_code: "5.OA.A.2"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      prompt: |
        Which expression means "add 8 and 7, then multiply the sum by 3"?
      options:
        - "3 × 8 + 7"
        - "8 + 7 × 3"
        - "3 × (8 + 7)"
        - "3 + (8 × 7)"
      option_explanations:
        - |
          Here only the 8 is multiplied by 3, and then 7 is added. Without parentheses, the sum is not multiplied.
        - |
          Here only the 7 is multiplied by 3. The sum of 8 and 7 needs parentheses around it so it is found first.
        - |
          Correct. The parentheses show that 8 + 7 is found first, and then that sum is multiplied by 3.
        - |
          This multiplies 8 by 7 and adds 3. The words say to add 8 and 7 first, then multiply by 3.
      answer: 2

    - slug: g5math-w04-q15
      type: short_answer
      topic_code: "5.NF.B.3"
      source: "IM K–5 Math Grade 5, Unit 2, Section A"
      points: 2
      prompt: |
        Three cousins share 7 pancakes equally.

        (a) Write a division and a fraction for how many pancakes each cousin gets.
        (b) Between which two whole numbers is each cousin's share? Explain how you know.
      answer: |
        (a) 7 ÷ 3 = 7/3 pancakes for each cousin.
        (b) Between 2 and 3. 6/3 = 2 and 9/3 = 3, and 7 thirds is between 6 thirds and 9 thirds. Each cousin gets 2 whole pancakes and 1/3 of the last one: 2 1/3 pancakes.
      explanation: |
        Two points.

        (a) 1 pt: 7 ÷ 3 and 7/3 (or 2 1/3). A share written as 3/7 earns no point: the pancakes go on top.

        (b) 1 pt: between 2 and 3, with a reason, such as 6/3 = 2 and 9/3 = 3, or 7 ÷ 3 = 2 R 1, or a drawing that gives each cousin 2 whole pancakes and a third of the last one.
