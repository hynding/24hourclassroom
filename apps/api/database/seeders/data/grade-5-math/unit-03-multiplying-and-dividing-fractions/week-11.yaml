week: 11
unit: 3
title: "Problem Solving With Fractions and Line Plots"
topics: ["5.NF.B.6", "5.MD.B.2"]
guide: guides/week-11.md
guide_description: |
  How to choose between multiplying and dividing in fraction stories, how to multiply mixed numbers by splitting
  them into wholes and parts, and how to read a line plot of measurements in eighths: counting, finding totals and
  sharing the total equally.
flashcards_description: |
  19 cards on deciding which operation a fraction story needs, multiplying with mixed numbers, area of rectangles
  with mixed-number sides, and making and using line plots in eighths, including sharing a total equally.

flashcards:
  - front: Fraction story → multiply or divide?
    back: |
      Multiply when you know the number of groups and the size of each group. Divide when you share an amount or ask how many groups fit.
    topic_code: "5.NF.B.6"
  - front: '"3/4 of 20 students" → equation'
    back: |
      3/4 × 20 = 15 students.
    topic_code: "5.NF.B.6"
  - front: Mixed number × whole number → one way
    back: |
      Multiply the whole part and the fraction part, then add. 2 1/3 × 3 = (2 × 3) + (1/3 × 3) = 6 + 1 = 7.
    topic_code: "5.NF.B.6"
  - front: 1 1/2 × 4 → product
    back: |
      6. Four groups of 1 make 4, and four groups of 1/2 make 2.
    topic_code: "5.NF.B.6"
  - front: Mixed number × fraction → one way
    back: |
      Write the mixed number as a fraction first. 1 1/2 × 2/3 = 3/2 × 2/3 = 6/6 = 1.
    topic_code: "5.NF.B.6"
  - front: 2 1/2 written as a fraction
    back: |
      5/2. Two wholes are 4 halves, and 1 more half makes 5 halves.
    topic_code: "5.NF.B.6"
  - front: Rectangle 3 1/2 m by 2 m → area
    back: |
      7 square meters. Split it: 3 × 2 = 6 and 1/2 × 2 = 1, so 6 + 1 = 7.
    topic_code: "5.NF.B.6"
  - front: Mixed number × whole number → is it reasonable?
    back: |
      Estimate with the whole part. 2 3/4 × 4 is a bit less than 3 × 4 = 12. (It is 11.)
    topic_code: "5.NF.B.6"
  - front: Multistep fraction problem → first step
    back: |
      Find what each step asks. Example: 6 planters each need 1/2 bag of soil, so first find 6 × 1/2 = 3 bags.
    topic_code: "5.NF.B.6"
  - front: Line plot with fractions → what each X means
    back: |
      One measurement. An X above 3/8 means one thing measured 3/8 of a unit.
    topic_code: "5.MD.B.2"
  - front: Line plot in eighths → reading the marks
    back: |
      The marks go 0, 1/8, 2/8, 3/8 and so on to 8/8, which is 1. Each space is 1/8.
    topic_code: "5.MD.B.2"
  - front: Line plot → total of the Xs at one mark
    back: |
      Multiply the value by the number of Xs. 4 Xs at 3/8 liter: 4 × 3/8 = 12/8 = 1 4/8 liters.
    topic_code: "5.MD.B.2"
  - front: Line plot → total of all the data
    back: |
      Find the total at each mark, then add the totals.
    topic_code: "5.MD.B.2"
  - front: Line plot → sharing the total equally
    back: |
      Divide the total by the number of Xs. 6 liters in 12 bottles: 6 ÷ 12 = 6/12 = 1/2 liter each.
    topic_code: "5.MD.B.2"
  - front: Line plot → most common measurement
    back: |
      The mark with the tallest stack of Xs.
    topic_code: "5.MD.B.2"
  - front: Line plot → difference between largest and smallest
    back: |
      Subtract the value of the X farthest left from the X farthest right. 7/8 − 2/8 = 5/8.
    topic_code: "5.MD.B.2"
  - front: Making a line plot with fractions → the steps
    back: |
      Draw a number line that covers the data, mark it evenly in the right fraction (like eighths), then put one X above the mark for each measurement.
    topic_code: "5.MD.B.2"
  - front: 1/2 and 4/8 on a line plot → same mark?
    back: |
      Yes. 1/2 = 4/8, so a measurement of 1/2 goes on the 4/8 mark.
    topic_code: "5.MD.B.2"
  - front: Remainder in a fraction story → whole items needed
    back: |
      Round up when every bit must fit. 4 1/2 bags of soil needed means buy 5 bags.
    topic_code: "5.NF.B.6"

quiz:
  description: |
    15 questions · about 30 minutes · a line plot of water left in bottles in eighths of a liter, multiplying with
    mixed numbers, the area of a garden with a mixed-number side, choosing multiplication or division in fraction
    stories, and review of volume, fractions as division and scaling. Multiple choice, select-all, true/false and
    number answers are graded at once; the fill-in word is matched automatically; the short answer is checked by
    your teacher.
  questions:
    - slug: g5math-w11-q01
      type: numeric
      topic_code: "5.MD.B.2"
      source: "IM K–5 Math Grade 5, Unit 3, Section C"
      points: 1
      stimulus: |
        Use the line plot "Water Left in Bottles". After a field day, a class measured the water left in each water bottle. Each X is one bottle, and the amounts are in liters.
      figure: figures/w11-line-plot-water-bottles.svg
      figure_alt: "A line plot titled Water Left in Bottles, labeled Water in liters. The marks go up by eighths: 0, 1/8, 2/8, 3/8, 4/8, 5/8, 6/8, 7/8 and 1. The number of Xs above each mark is: 0 has 0, 1/8 has 0, 2/8 has 2, 3/8 has 4, 4/8 has 3, 5/8 has 0, 6/8 has 2, 7/8 has 0 and 1 has 1. There are 12 Xs in all."
      prompt: |
        How many bottles were measured?
      answer: { value: 12, tolerance: 0 }
      explanation: |
        Count every X: 2 + 4 + 3 + 2 + 1 = 12 bottles.

    - slug: g5math-w11-q02
      type: multiple_choice
      topic_code: "5.MD.B.2"
      source: "IM K–5 Math Grade 5, Unit 3, Section C"
      points: 1
      stimulus: |
        Use the line plot "Water Left in Bottles". After a field day, a class measured the water left in each water bottle. Each X is one bottle, and the amounts are in liters.
      prompt: |
        How much water is in all the bottles that hold 3/8 liter, put together?
      options:
        - "3/8 liter"
        - "12/32 liter"
        - "1 4/8 liters"
        - "4 3/8 liters"
      option_explanations:
        - |
          3/8 liter is the amount in just one of those bottles. There are 4 bottles at 3/8, so multiply by 4.
        - |
          Four groups of 3 eighths are still eighths. 4 × 3/8 = 12/8, not 12/32.
        - |
          Correct. 4 bottles hold 3/8 liter each: 4 × 3/8 = 12/8 = 1 4/8 liters.
        - |
          4 3/8 adds the 4 bottles to 3/8. Each bottle holds 3/8 liter, so multiply: 4 × 3/8.
      answer: 2

    - slug: g5math-w11-q03
      type: multiple_choice
      topic_code: "5.MD.B.2"
      source: "IM K–5 Math Grade 5, Unit 3, Section C"
      points: 1
      stimulus: |
        Use the line plot "Water Left in Bottles". After a field day, a class measured the water left in each water bottle. Each X is one bottle, and the amounts are in liters.
      prompt: |
        Altogether the bottles hold 6 liters of water. If the class poured all the water back and shared it equally among the 12 bottles, how much would each bottle hold?
      options:
        - "2 liters"
        - "1/2 liter"
        - "6 liters"
        - "1/12 liter"
      option_explanations:
        - |
          2 is 12 ÷ 6, the wrong way round. The 6 liters are shared among 12 bottles, so each gets less than 1 liter.
        - |
          Correct. 6 liters shared by 12 bottles is 6 ÷ 12 = 6/12 = 1/2 liter in each bottle.
        - |
          6 liters is the total for all the bottles. Shared by 12 bottles, each gets a much smaller amount.
        - |
          1/12 liter would be 1 liter shared by 12 bottles. There are 6 liters, so each bottle gets 6/12.
      answer: 1

    - slug: g5math-w11-q04
      type: multiple_choice
      topic_code: "5.NF.B.6"
      source: "IM K–5 Math Grade 5, Unit 3, Section C"
      points: 1
      prompt: |
        A nature trail is 2 1/2 miles long. Mia walks the whole trail 3 times. How far does she walk?
      options:
        - "6 1/2 miles"
        - "5 1/2 miles"
        - "7 1/2 miles"
        - "2 1/6 miles"
      option_explanations:
        - |
          6 1/2 multiplies the 2 by 3 but adds only one 1/2. Each of the 3 trips has a 1/2 mile, which makes 1 1/2 miles.
        - |
          5 1/2 adds 3 to 2 1/2. She walks the trail 3 times, so multiply: 3 × 2 1/2.
        - |
          Correct. 3 × 2 = 6 and 3 × 1/2 = 3/2 = 1 1/2. 6 + 1 1/2 = 7 1/2 miles.
        - |
          2 1/6 divides the 1/2 by 3. Walking the trail more times makes the distance longer, not shorter.
      answer: 2

    - slug: g5math-w11-q05
      type: multiple_choice
      topic_code: "5.NF.B.6"
      source: "IM K–5 Math Grade 5, Unit 3, Section C"
      points: 1
      prompt: |
        A muffin recipe uses 1 1/2 cups of flour. Theo makes 2/3 of the recipe. How much flour does he use?
      options:
        - "2/3 cup"
        - "1 cup"
        - "1/3 cup"
        - "2 1/6 cups"
      option_explanations:
        - |
          2/3 cup is 2/3 of only the 1 whole cup. Theo also needs 2/3 of the extra 1/2 cup.
        - |
          Correct. 1 1/2 = 3/2, and 2/3 × 3/2 = 6/6 = 1 cup. Making less than the full recipe uses less than 1 1/2 cups.
        - |
          1/3 cup is 2/3 of only the 1/2 cup. Theo also needs 2/3 of the 1 whole cup.
        - |
          2 1/6 adds 1 1/2 and 2/3. Making 2/3 of a recipe means multiplying, and the amount should get smaller.
      answer: 1

    - slug: g5math-w11-q06
      type: numeric
      topic_code: "5.NF.B.6"
      source: "IM K–5 Math Grade 5, Unit 3, Section C"
      points: 1
      prompt: |
        A rug is a rectangle 3 1/2 feet wide and 4 feet long. What is its area in square feet?
      answer: { value: 14, tolerance: 0 }
      explanation: |
        Area = 3 1/2 × 4. 3 × 4 = 12 and 1/2 × 4 = 2, so the area is 12 + 2 = 14 square feet.

    - slug: g5math-w11-q07
      type: true_false
      topic_code: "5.NF.B.6"
      source: "IM K–5 Math Grade 5, Unit 3, Section C"
      points: 1
      prompt: |
        True or false: 1 1/4 × 8 is greater than 8.
      answer: true
      explanation: |
        True. 1 1/4 is greater than 1, so the product is greater than 8. In fact 1 × 8 = 8 and 1/4 × 8 = 2, so 1 1/4 × 8 = 10.

    - slug: g5math-w11-q08
      type: fill_blank
      topic_code: "5.MD.B.2"
      source: "IM K–5 Math Grade 5, Unit 3, Section C"
      points: 1
      prompt: |
        A number line with an X above it for each measurement is called a line ____.
      answer: ["plot", "plots"]
      explanation: |
        It is a line plot. Each X shows one measurement, and stacked Xs show the same measurement more than once.

    - slug: g5math-w11-q09
      type: multi_select
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which questions can be answered with 4 ÷ 1/3? Select all that apply.
      options:
        - "How many 1/3-cup scoops are in 4 cups of rice?"
        - "Four friends share 1/3 of a pie equally. How much does each friend get?"
        - "A 4-meter rope is cut into pieces 1/3 meter long. How many pieces are there?"
        - "What is 1/3 of 4 pounds?"
        - "How many 1/3-hour lessons fit in 4 hours?"
      option_explanations:
        - |
          Yes. It asks how many thirds fit in 4, which is 4 ÷ 1/3 = 12 scoops.
        - |
          No. Sharing 1/3 among 4 friends is 1/3 ÷ 4 = 1/12. The numbers are in the other order.
        - |
          Yes. It asks how many 1/3-meter pieces fit in 4 meters: 4 ÷ 1/3 = 12 pieces.
        - |
          No. 1/3 of 4 pounds is 1/3 × 4 = 4/3 pounds, a multiplication.
        - |
          Yes. It asks how many thirds of an hour fit in 4 hours: 4 ÷ 1/3 = 12 lessons.
      answer: [0, 2, 4]

    - slug: g5math-w11-q10
      type: multiple_choice
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        Ana has 1/2 liter of paint. She pours it equally into 3 jars. How much paint is in each jar?
      options:
        - "1/6 liter"
        - "1 1/2 liters"
        - "6 liters"
        - "1/5 liter"
      option_explanations:
        - |
          Correct. 1/2 ÷ 3 = 1/6. Splitting each half into 3 parts makes sixths, and each jar gets one sixth of a liter.
        - |
          1 1/2 liters is 3 × 1/2, three times as much paint as Ana has. Sharing makes each part smaller.
        - |
          6 is 3 ÷ 1/2, how many halves fit in 3. Here 1/2 liter is shared, so each jar gets a small fraction.
        - |
          5 comes from adding 2 + 3. Cutting each half into 3 equal parts makes 2 × 3 = 6 parts in the liter.
      answer: 0

    - slug: g5math-w11-q11
      type: multiple_choice
      topic_code: "5.NF.B.6"
      source: "IM K–5 Math Grade 5, Unit 3, Section C"
      points: 1
      figure: figures/w11-garden-3-and-a-half-by-2.svg
      figure_alt: "A rectangle labeled 3 1/2 m across the top and 2 m on the left side. A line splits it into two parts: a large green part 3 m wide on the left and a thin blue part 1/2 m wide on the right. Both parts are 2 m tall. Brackets under the bottom are labeled 3 m and 1/2 m."
      prompt: |
        The picture shows a garden split into two parts. What is the area of the whole garden?
      options:
        - "6 1/2 square meters"
        - "11 square meters"
        - "6 square meters"
        - "7 square meters"
      option_explanations:
        - |
          6 1/2 finds 3 × 2 = 6 but then adds only 1/2. The blue strip is 1/2 m by 2 m, so its area is 1/2 × 2 = 1.
        - |
          11 meters is the distance around the garden (3 1/2 + 2 + 3 1/2 + 2). Area counts the square meters inside.
        - |
          6 square meters is only the green part, 3 × 2. Add the blue strip, 1/2 × 2 = 1 square meter.
        - |
          Correct. Green: 3 × 2 = 6. Blue: 1/2 × 2 = 1. Whole garden: 6 + 1 = 7 square meters, which is 3 1/2 × 2.
      answer: 3

    # ---- spiral review
    - slug: g5math-w11-q12
      type: multiple_choice
      topic_code: "5.OA.A.2"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      prompt: |
        A box is a rectangular prism 4 units long, 3 units wide and 5 units tall. Which expression shows its volume in cubic units?
      options:
        - "4 × 3 × 5"
        - "4 + 3 + 5"
        - "(4 × 3) + 5"
        - "4 × 3"
      option_explanations:
        - |
          Correct. Volume = length × width × height, so 4 × 3 × 5 (which is 60 cubic units).
        - |
          Adding the edges does not count the cubes inside. Volume multiplies length, width and height.
        - |
          4 × 3 is the number of cubes in one layer. There are 5 layers, so multiply by 5 instead of adding 5.
        - |
          4 × 3 counts only the bottom layer of cubes. The box is 5 layers tall.
      answer: 0

    - slug: g5math-w11-q13
      type: numeric
      topic_code: "5.NF.B.3"
      source: "IM K–5 Math Grade 5, Unit 2, Section A"
      points: 1
      prompt: |
        Four friends share 18 crackers equally, so each gets 18/4 crackers. Write 18/4 as a mixed number: 18/4 = 4 □/4. What number goes in the box?
      answer: { value: 2, tolerance: 0 }
      explanation: |
        4 wholes are 16 fourths, and 18 − 16 = 2 fourths are left, so 18/4 = 4 2/4. Each friend gets 4 2/4 crackers (the same as 4 1/2).

    - slug: g5math-w11-q14
      type: multiple_choice
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 3, Section A"
      points: 1
      prompt: |
        Without multiplying, decide which product is less than 2 1/2.
      options:
        - "4/3 × 2 1/2"
        - "1 × 2 1/2"
        - "1 1/2 × 2 1/2"
        - "3/4 × 2 1/2"
      option_explanations:
        - |
          4/3 is greater than 1, so this product is greater than 2 1/2.
        - |
          Multiplying by 1 leaves 2 1/2 the same, so this product equals 2 1/2. It is not less.
        - |
          1 1/2 is greater than 1, so this product is greater than 2 1/2.
        - |
          Correct. 3/4 is less than 1, so 3/4 × 2 1/2 is less than 2 1/2.
      answer: 3

    - slug: g5math-w11-q15
      type: short_answer
      topic_code: "5.NF.B.6"
      source: "IM K–5 Math Grade 5, Unit 3, Section C"
      points: 2
      prompt: |
        A class is planting a garden. Each planter needs 3/4 bag of soil, and they fill 6 planters.

        (a) How many bags of soil do they use? Show your work.
        (b) The store sells only whole bags. How many bags must the class buy? Explain.
      answer: |
        (a) 6 × 3/4 = 18/4 bags, which is 4 2/4 (or 4 1/2) bags.
        (b) 5 bags. 4 bags are not enough, because they need 4 1/2 bags, so they must buy one more whole bag.
      explanation: |
        Two points.

        (a) 1 pt: 18/4, 4 2/4 or 4 1/2 bags, with work such as 6 × 3/4 = 18/4 or adding 3/4 six times.

        (b) 1 pt: 5 bags, with a reason that 4 bags would be too few (4 1/2 is more than 4).
