week: 9
unit: 3
title: "Dividing a Unit Fraction by a Whole Number"
topics: ["5.NF.B.7"]
guide: guides/week-09.md
guide_description: |
  How to share a unit fraction like 1/3 equally into a whole number of parts, how a tape diagram and a number line
  show 1/3 ÷ 4 = 1/12, why dividing by 4 is the same as taking 1/4 of the amount, and how to check a quotient
  with multiplication.
flashcards_description: |
  18 cards on dividing a unit fraction by a whole number: sharing stories, tape diagrams, number lines, the link
  between ÷ 4 and × 1/4, checking with multiplication and the size of the quotient.

flashcards:
  - front: Unit fraction → what it is
    back: |
      A fraction with 1 as its numerator, like 1/2, 1/5 or 1/8. It is one equal part of a whole.
    topic_code: "5.NF.B.7"
  - front: 1/3 ÷ 4 → what it asks
    back: |
      If 1/3 is shared equally into 4 parts, how big is each part?
    topic_code: "5.NF.B.7"
  - front: 1/3 ÷ 4 → quotient
    back: |
      1/12. Cutting each third into 4 parts cuts the whole into 12 parts, and one share is 1 of them.
    topic_code: "5.NF.B.7"
  - front: 1/2 ÷ 3 → quotient
    back: |
      1/6. Half of a pan cut into 3 equal pieces makes pieces that are each 1/6 of the pan.
    topic_code: "5.NF.B.7"
  - front: 1/5 ÷ 2 → quotient
    back: |
      1/10. Cutting each fifth in half makes tenths.
    topic_code: "5.NF.B.7"
  - front: 1/4 ÷ 4 → quotient
    back: |
      1/16. Each fourth is cut into 4, so the whole has 4 × 4 = 16 equal parts.
    topic_code: "5.NF.B.7"
  - front: Unit fraction ÷ whole number → a quick way
    back: |
      Multiply the denominator by the whole number. 1/6 ÷ 5 = 1/(6 × 5) = 1/30.
    topic_code: "5.NF.B.7"
  - front: Dividing by 4 and multiplying by 1/4 → how they are related
    back: |
      They give the same answer. 1/3 ÷ 4 = 1/4 × 1/3 = 1/12. Sharing into 4 equal parts means taking 1/4 of the amount.
    topic_code: "5.NF.B.7"
  - front: Tape diagram for 1/3 ÷ 2 → how to draw it
    back: |
      Draw a bar for 1 whole and cut it into 3 equal parts. Shade 1 part, then cut the shaded part into 2 equal pieces. One piece is 1/6 of the bar.
    topic_code: "5.NF.B.7"
  - front: Number line for 1/2 ÷ 3 → how to read it
    back: |
      Split the space from 0 to 1/2 into 3 equal jumps. Each jump is the same size as 1/6, because 6 such jumps fill 0 to 1.
    topic_code: "5.NF.B.7"
  - front: Checking 1/4 ÷ 3 = 1/12 → the multiplication
    back: |
      3 × 1/12 = 3/12, and 3/12 = 1/4. Three equal shares put back together make the amount you started with.
    topic_code: "5.NF.B.7"
  - front: Unit fraction ÷ whole number → size of the answer
    back: |
      Smaller than the unit fraction. Sharing an amount among more than 1 group makes each share smaller.
    topic_code: "5.NF.B.7"
  - front: 1/2 ÷ 4 or 1/2 ÷ 2 → which is smaller
    back: |
      1/2 ÷ 4 = 1/8 is smaller than 1/2 ÷ 2 = 1/4. More shares means smaller shares.
    topic_code: "5.NF.B.7"
  - front: Sharing story for 1/4 ÷ 2
    back: |
      Two friends share 1/4 of a melon equally. Each friend gets 1/8 of the melon.
    topic_code: "5.NF.B.7"
  - front: Quotient of a fraction division → what it is
    back: |
      The answer to a division problem. In 1/3 ÷ 4 = 1/12, the quotient is 1/12.
    topic_code: "5.NF.B.7"
  - front: Division and multiplication → fact family with fractions
    back: |
      1/5 ÷ 2 = 1/10 and 2 × 1/10 = 1/5 belong together, like 10 ÷ 2 = 5 and 2 × 5 = 10.
    topic_code: "5.NF.B.7"
  - front: 1/3 ÷ 4 and 4 ÷ 1/3 → are they the same?
    back: |
      No. 1/3 ÷ 4 shares a third into 4 parts (1/12). 4 ÷ 1/3 asks how many thirds fit in 4 (12). Order matters.
    topic_code: "5.NF.B.7"
  - front: Word clue "shared equally" with a fraction amount → which operation
    back: |
      Divide the fraction by the number of shares. 1/2 liter shared equally by 5 cups is 1/2 ÷ 5 = 1/10 liter each.
    topic_code: "5.NF.B.7"

quiz:
  description: |
    16 questions · about 30 minutes · sharing a unit fraction into equal parts with a tape diagram and a number
    line, finding quotients like 1/5 ÷ 2, checking with multiplication, matching stories to division, and review of
    multiplying fractions, scaling and area with mixed numbers. Multiple choice, select-all, true/false and number
    answers are graded at once; the fill-in word is matched automatically; the short answer is checked by your
    teacher.
  questions:
    - slug: g5math-w09-q01
      type: multiple_choice
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      stimulus: |
        Use the tape diagram. The whole bar is 1 whole, cut into 3 equal parts. The shaded part is cut into equal pieces by dashed lines.
      figure: figures/w09-tape-third-in-fourths.svg
      figure_alt: "A long bar labeled 1 whole, cut into 3 equal parts, each labeled 1/3. The first part is shaded blue, and 3 white dashed lines cut that shaded part into 4 equal pieces. The other 2 parts are white."
      prompt: |
        Which division equation does the tape diagram show?
      options:
        - "1/3 ÷ 4 = 4/3"
        - "1/3 ÷ 4 = 1/7"
        - "4 ÷ 1/3 = 12"
        - "1/3 ÷ 4 = 1/12"
      option_explanations:
        - |
          4/3 is more than a whole bar. Sharing 1/3 into 4 pieces must make each piece smaller than 1/3, not bigger.
        - |
          7 comes from adding 3 + 4. If every third were cut into 4 pieces, the bar would hold 3 × 4 = 12 pieces, not 7.
        - |
          4 ÷ 1/3 asks how many thirds fit in 4 wholes. The picture shows only 1 whole bar, with one third cut into 4 pieces.
        - |
          Correct. One third is shared into 4 equal pieces. Each piece is 1/12 of the whole bar, so 1/3 ÷ 4 = 1/12.
      answer: 3

    - slug: g5math-w09-q02
      type: numeric
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      stimulus: |
        Use the tape diagram. The whole bar is 1 whole, cut into 3 equal parts. The shaded part is cut into equal pieces by dashed lines.
      prompt: |
        How many of the small shaded pieces would it take to fill the whole bar?
      answer: { value: 12, tolerance: 0 }
      explanation: |
        Each third holds 4 small pieces, and the bar has 3 thirds, so 3 × 4 = 12 pieces fill the bar. That is why each piece is 1/12.

    - slug: g5math-w09-q03
      type: multiple_choice
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        What is 1/5 ÷ 2?
      options:
        - "2/5"
        - "1/10"
        - "1/7"
        - "10"
      option_explanations:
        - |
          2/5 is 2 × 1/5, which doubles the amount. Dividing 1/5 into 2 equal parts makes each part smaller.
        - |
          Correct. Cutting each fifth in half makes tenths, so one half of 1/5 is 1/10. Check: 2 × 1/10 = 2/10 = 1/5.
        - |
          7 comes from adding 5 + 2. Halving each fifth turns 5 parts into 5 × 2 = 10 parts.
        - |
          10 is 2 ÷ 1/5, how many fifths fit in 2. Here 1/5 is being shared into 2 parts, so the answer is a small fraction.
      answer: 1

    - slug: g5math-w09-q04
      type: multiple_choice
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        Three friends share 1/4 pound of trail mix equally. How much trail mix does each friend get?
      options:
        - "3/4 pound"
        - "4/3 pounds"
        - "1/12 pound"
        - "1/7 pound"
      option_explanations:
        - |
          3/4 pound is 3 × 1/4, three times as much as there is. Sharing makes each friend's part smaller than 1/4.
        - |
          4/3 is more than 1 pound, but they only have 1/4 pound to share.
        - |
          Correct. 1/4 ÷ 3 = 1/12. Cutting each fourth of a pound into 3 parts makes twelfths, and each friend gets one.
        - |
          7 comes from adding 4 + 3. Sharing each fourth among 3 friends makes 4 × 3 = 12 equal parts of the pound.
      answer: 2

    - slug: g5math-w09-q05
      type: numeric
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        1/6 ÷ 3 = 1/□. What number goes in the box?
      answer: { value: 18, tolerance: 0 }
      explanation: |
        Cutting each sixth into 3 equal parts makes 6 × 3 = 18 parts in the whole. So 1/6 ÷ 3 = 1/18. Check: 3 × 1/18 = 3/18 = 1/6.

    - slug: g5math-w09-q06
      type: multiple_choice
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        Which multiplication equation checks that 1/2 ÷ 5 = 1/10?
      options:
        - "5 × 1/10 = 1/2"
        - "5 × 1/2 = 1/10"
        - "1/10 × 1/2 = 5"
        - "2 × 5 = 10"
      option_explanations:
        - |
          Correct. Five equal shares of 1/10 put back together make 5/10, which is 1/2, the amount we started with.
        - |
          5 × 1/2 is 5/2, which is 2 1/2, not 1/10. The check multiplies the quotient, 1/10, by 5.
        - |
          Multiplying two fractions less than 1 gives a product less than 1, so it cannot equal 5.
        - |
          2 × 5 = 10 is true, but it uses only whole numbers. It does not show that five shares of 1/10 make 1/2.
      answer: 0

    - slug: g5math-w09-q07
      type: true_false
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        True or false: 1/4 ÷ 2 is greater than 1/4.
      answer: false
      explanation: |
        False. Sharing 1/4 into 2 equal parts makes each part smaller: 1/4 ÷ 2 = 1/8, and 1/8 is less than 1/4.

    - slug: g5math-w09-q08
      type: fill_blank
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        In 1/3 ÷ 4 = 1/12, the answer 1/12 is called the ____.
      answer: ["quotient", "the quotient"]
      explanation: |
        The answer to a division problem is the quotient. Here 1/3 is divided by 4, and the quotient is 1/12.

    - slug: g5math-w09-q09
      type: multi_select
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which are equal to 1/8 ÷ 2? Select all that apply.
      options:
        - "1/16"
        - "2/8"
        - "1/2 × 1/8"
        - "1/10"
        - "2/32"
      option_explanations:
        - |
          Equal. Cutting each eighth in half makes sixteenths, so 1/8 ÷ 2 = 1/16.
        - |
          Not equal. 2/8 is 2 × 1/8, twice as much. Dividing by 2 makes the amount smaller.
        - |
          Equal. Sharing into 2 equal parts is the same as taking 1/2 of the amount: 1/2 × 1/8 = 1/16.
        - |
          Not equal. 10 comes from adding 8 + 2. Halving eighths makes 8 × 2 = 16 parts, not 10.
        - |
          Equal. 2/32 is the same amount as 1/16, because 2 thirty-seconds fit in each sixteenth.
      answer: [0, 2, 4]

    - slug: g5math-w09-q10
      type: multiple_choice
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      figure: figures/w09-number-line-half-in-thirds.svg
      figure_alt: "A number line from 0 to 1, labeled 0, 1/2 and 1. Tick marks cut the line from 0 to 1 into 6 equal spaces, so 1/2 is at the third tick after 0. A bracket above the line from 0 to 1/2 is labeled 1/2. Three equal red jumps go from 0 to 1/2, one tick mark each."
      prompt: |
        The three jumps split 1/2 into 3 equal parts. What is 1/2 ÷ 3?
      options:
        - "1/5"
        - "3/2"
        - "1/6"
        - "1/3"
      option_explanations:
        - |
          5 comes from adding 2 + 3. Count the equal spaces from 0 to 1: there are 6, so each jump is 1/6.
        - |
          3/2 is more than 1, but each jump is much shorter than 1/2. Sharing makes the parts smaller.
        - |
          Correct. Each jump covers one of the 6 equal spaces between 0 and 1, so each jump is 1/6. 1/2 ÷ 3 = 1/6.
        - |
          1/3 would split the whole line from 0 to 1 into 3 parts. Here only the half from 0 to 1/2 is split into 3.
      answer: 2

    - slug: g5math-w09-q11
      type: multiple_choice
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        A ribbon 1/3 meter long is cut into 2 pieces of equal length. Which expression gives the length of each piece in meters?
      options:
        - "1/3 ÷ 2"
        - "2 ÷ 1/3"
        - "1/3 × 2"
        - "3 ÷ 2"
      option_explanations:
        - |
          Correct. The 1/3 meter is shared into 2 equal pieces, so each piece is 1/3 ÷ 2 = 1/6 meter.
        - |
          2 ÷ 1/3 asks how many thirds fit in 2 meters. The ribbon is only 1/3 meter, and it is being cut into 2 pieces.
        - |
          1/3 × 2 is twice as long as the ribbon. Each piece must be shorter than the whole ribbon.
        - |
          3 ÷ 2 would cut a 3-meter ribbon in half. The ribbon is 1/3 meter, not 3 meters.
      answer: 0

    # ---- spiral review
    - slug: g5math-w09-q12
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 3, Section A"
      points: 1
      prompt: |
        What is 2/3 × 3/5?
      options:
        - "5/8"
        - "6/15"
        - "10/9"
        - "6/8"
      option_explanations:
        - |
          5/8 adds the numerators and the denominators. To multiply, multiply them: 2 × 3 and 3 × 5.
        - |
          Correct. 2 × 3 = 6 and 3 × 5 = 15, so 2/3 × 3/5 = 6/15.
        - |
          10/9 multiplies across the wrong way (2 × 5 and 3 × 3). It is also more than 1, but both factors are less than 1.
        - |
          The numerator 6 is right, but the denominators were added (3 + 5 = 8). Multiply them: 3 × 5 = 15.
      answer: 1

    - slug: g5math-w09-q13
      type: multiple_choice
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 3, Section A"
      points: 1
      prompt: |
        Without multiplying, decide which product is greater than 4.
      options:
        - "5/6 × 4"
        - "1 × 4"
        - "1/2 × 4"
        - "7/5 × 4"
      option_explanations:
        - |
          5/6 is less than 1, so 5/6 × 4 is less than 4.
        - |
          Multiplying by 1 leaves 4 the same. 1 × 4 equals 4; it is not greater than 4.
        - |
          1/2 × 4 is half of 4, which is 2. A factor less than 1 makes the product smaller.
        - |
          Correct. 7/5 is greater than 1 (it is 1 2/5), so 7/5 × 4 is greater than 4.
      answer: 3

    - slug: g5math-w09-q14
      type: numeric
      topic_code: "5.NF.B.6"
      source: "IM K–5 Math Grade 5, Unit 2, Section C"
      points: 1
      prompt: |
        A garden bed is a rectangle 2 1/2 meters long and 2 meters wide. What is its area in square meters?
      answer: { value: 5, tolerance: 0 }
      explanation: |
        Area = 2 1/2 × 2. Two groups of 2 are 4, and two groups of 1/2 are 1, so the area is 4 + 1 = 5 square meters.

    - slug: g5math-w09-q15
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 3, Section A"
      points: 1
      prompt: |
        A vegetable garden covers 3/4 of a backyard. Tomatoes grow in 1/3 of the garden. What fraction of the whole backyard has tomatoes?
      options:
        - "3/12"
        - "4/7"
        - "1/12"
        - "1 1/12"
      option_explanations:
        - |
          Correct. 1/3 of 3/4 is 1/3 × 3/4 = 3/12. (That is the same as 1/4 of the backyard.)
        - |
          4/7 adds the numerators and the denominators. "1/3 of 3/4" means multiply: 1 × 3 and 3 × 4.
        - |
          1/12 is 1/3 of just one fourth. The garden is 3 fourths, so the tomatoes cover 3 twelfths.
        - |
          1 1/12 is 3/4 + 1/3, more than the whole backyard. The tomatoes are only part of the garden.
      answer: 0

    - slug: g5math-w09-q16
      type: short_answer
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 2
      prompt: |
        Ji-woo pours 1/2 gallon of lemonade equally into 4 pitchers.

        (a) How much lemonade goes into each pitcher? Write a division equation, or draw a diagram.
        (b) Use multiplication to check your answer.
      answer: |
        (a) 1/2 ÷ 4 = 1/8 gallon in each pitcher.
        (b) 4 × 1/8 = 4/8 gallon, and 4/8 = 1/2 gallon, the amount Ji-woo started with.
      explanation: |
        Two points.

        (a) 1 pt: 1/8 gallon, with the equation 1/2 ÷ 4 = 1/8 or a diagram that cuts a half into 4 equal parts.

        (b) 1 pt: a multiplication that puts the shares back together, such as 4 × 1/8 = 4/8 = 1/2.
