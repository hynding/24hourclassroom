week: 10
unit: 3
title: "Dividing a Whole Number by a Unit Fraction"
topics: ["5.NF.B.7"]
guide: guides/week-10.md
guide_description: |
  How to find how many unit fractions fit in a whole number (3 ÷ 1/4 asks how many fourths are in 3), how tape
  diagrams and jumps on a number line show it, why the quotient is bigger than the whole number, and how to check
  with multiplication and tell the two kinds of fraction division apart.
flashcards_description: |
  19 cards on dividing a whole number by a unit fraction: "how many fit" stories, tape diagrams, number line jumps,
  the multiply-by-the-denominator pattern, checking with multiplication, and telling 4 ÷ 1/3 from 1/3 ÷ 4.

flashcards:
  - front: 3 ÷ 1/4 → what it asks
    back: |
      How many fourths are in 3 wholes? (How many pieces of size 1/4 fit in 3?)
    topic_code: "5.NF.B.7"
  - front: 3 ÷ 1/4 → quotient
    back: |
      12. Each whole holds 4 fourths, and 3 wholes hold 3 × 4 = 12 fourths.
    topic_code: "5.NF.B.7"
  - front: 2 ÷ 1/3 → quotient
    back: |
      6. Each whole holds 3 thirds, so 2 wholes hold 6 thirds.
    topic_code: "5.NF.B.7"
  - front: 5 ÷ 1/2 → quotient
    back: |
      10. There are 2 halves in every whole, so 5 wholes hold 10 halves.
    topic_code: "5.NF.B.7"
  - front: 4 ÷ 1/6 → quotient
    back: |
      24. Each whole holds 6 sixths, and 4 × 6 = 24.
    topic_code: "5.NF.B.7"
  - front: 1 ÷ 1/8 → quotient
    back: |
      8. One whole holds 8 eighths.
    topic_code: "5.NF.B.7"
  - front: Whole number ÷ unit fraction → a quick way
    back: |
      Multiply the whole number by the denominator. 7 ÷ 1/5 = 7 × 5 = 35.
    topic_code: "5.NF.B.7"
  - front: Whole number ÷ unit fraction → size of the answer
    back: |
      Bigger than the whole number. Many small pieces fit in each whole, so 3 ÷ 1/4 = 12 is more than 3.
    topic_code: "5.NF.B.7"
  - front: Tape diagram for 3 ÷ 1/4 → how to draw it
    back: |
      Draw 3 bars, one for each whole. Cut every bar into 4 equal parts. Count all the parts: 12.
    topic_code: "5.NF.B.7"
  - front: Number line for 2 ÷ 1/3 → how to read it
    back: |
      Start at 0 and make jumps of 1/3 until you reach 2. Count the jumps: 6.
    topic_code: "5.NF.B.7"
  - front: Checking 3 ÷ 1/4 = 12 → the multiplication
    back: |
      12 × 1/4 = 12/4 = 3. Twelve fourths put together make 3 wholes.
    topic_code: "5.NF.B.7"
  - front: '"How many 1/2-cup scoops in 6 cups?" → equation'
    back: |
      6 ÷ 1/2 = 12 scoops.
    topic_code: "5.NF.B.7"
  - front: '"How many 1/4-hour turns fit in 2 hours?" → equation'
    back: |
      2 ÷ 1/4 = 8 turns. Each hour holds 4 quarter hours.
    topic_code: "5.NF.B.7"
  - front: 4 ÷ 1/3 and 1/3 ÷ 4 → the difference
    back: |
      4 ÷ 1/3 = 12 asks how many thirds fit in 4. 1/3 ÷ 4 = 1/12 shares 1/3 into 4 parts. Order matters.
    topic_code: "5.NF.B.7"
  - front: 6 ÷ 1/2 or 6 ÷ 1/3 → which is greater
    back: |
      6 ÷ 1/3 = 18 is greater than 6 ÷ 1/2 = 12. Thirds are smaller than halves, so more of them fit.
    topic_code: "5.NF.B.7"
  - front: Smaller unit fraction as the divisor → what happens
    back: |
      The quotient gets bigger. 2 ÷ 1/2 = 4, 2 ÷ 1/4 = 8, 2 ÷ 1/8 = 16.
    topic_code: "5.NF.B.7"
  - front: Divisor → what it is
    back: |
      The number you divide by. In 3 ÷ 1/4, the divisor is 1/4.
    topic_code: "5.NF.B.7"
  - front: Word clue "how many ... fit" or "how many pieces" → which operation
    back: |
      Divide the total by the size of one piece. A 5-meter rope cut into 1/2-meter pieces: 5 ÷ 1/2 = 10 pieces.
    topic_code: "5.NF.B.7"
  - front: Unknown factor → 1/5 × □ = 3
    back: |
      □ = 15, because 3 ÷ 1/5 = 15. Fifteen fifths make 3.
    topic_code: "5.NF.B.7"

quiz:
  description: |
    16 questions · about 30 minutes · finding how many unit fractions fit in a whole number with a tape diagram and
    a number line, word problems about scoops and pieces, checking with multiplication, telling the two kinds of
    fraction division apart, and review of multiplying fractions, volume and fractions as division. Multiple
    choice, select-all, true/false and number answers are graded at once; the fill-in word is matched automatically;
    the short answer is checked by your teacher.
  questions:
    - slug: g5math-w10-q01
      type: multiple_choice
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      stimulus: |
        Use the tape diagram. Each bar is 1 whole, and every bar is cut into equal parts labeled 1/4.
      figure: figures/w10-tape-three-wholes-fourths.svg
      figure_alt: "Three bars of the same length, one above another. Each bar is labeled 1 at its right end and is cut into 4 equal parts, each labeled 1/4. The parts alternate blue and green. There are 12 parts in all."
      prompt: |
        Which division equation does the tape diagram show?
      options:
        - "3 ÷ 4 = 3/4"
        - "3 ÷ 1/4 = 12"
        - "1/4 ÷ 3 = 1/12"
        - "3 ÷ 1/4 = 3/4"
      option_explanations:
        - |
          3 ÷ 4 would share 3 wholes among 4 people. The picture counts how many fourths are in 3 wholes.
        - |
          Correct. There are 3 wholes, each cut into 4 fourths, and 3 × 4 = 12 fourths in all. So 3 ÷ 1/4 = 12.
        - |
          1/4 ÷ 3 would share one fourth into 3 tiny parts. The picture shows 3 whole bars cut into fourths.
        - |
          3/4 is only 3 of the parts. Count every part in all three bars: 12 fourths fit in 3 wholes.
      answer: 1

    - slug: g5math-w10-q02
      type: numeric
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      stimulus: |
        Use the tape diagram. Each bar is 1 whole, and every bar is cut into equal parts labeled 1/4.
      prompt: |
        Suppose there were 5 bars like these instead of 3. How many fourths would there be? (This is 5 ÷ 1/4.)
      answer: { value: 20, tolerance: 0 }
      explanation: |
        Each bar holds 4 fourths, so 5 bars hold 5 × 4 = 20 fourths. 5 ÷ 1/4 = 20.

    - slug: g5math-w10-q03
      type: multiple_choice
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        What is 4 ÷ 1/2?
      options:
        - "2"
        - "1/8"
        - "8"
        - "4 1/2"
      option_explanations:
        - |
          2 is 4 ÷ 2, sharing 4 between 2. Dividing by 1/2 asks how many halves fit in 4.
        - |
          1/8 is 1/2 ÷ 4. Here 4 wholes are being cut into halves, so the answer is more than 4.
        - |
          Correct. Each whole holds 2 halves, so 4 wholes hold 4 × 2 = 8 halves. Check: 8 × 1/2 = 4.
        - |
          4 1/2 adds 4 and 1/2. The question asks how many halves fit in 4.
      answer: 2

    - slug: g5math-w10-q04
      type: numeric
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        What is 6 ÷ 1/3?
      answer: { value: 18, tolerance: 0 }
      explanation: |
        Each whole holds 3 thirds, so 6 wholes hold 6 × 3 = 18 thirds. Check: 18 × 1/3 = 18/3 = 6.

    - slug: g5math-w10-q05
      type: multiple_choice
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        Kai has 5 cups of birdseed. Each bird feeder holds 1/2 cup. How many feeders can Kai fill?
      options:
        - "2 1/2 feeders"
        - "5 1/2 feeders"
        - "1/10 of a feeder"
        - "10 feeders"
      option_explanations:
        - |
          2 1/2 is 5 ÷ 2, as if each feeder held 2 cups. Each feeder holds only 1/2 cup, so more feeders get filled.
        - |
          5 1/2 adds 5 + 1/2. The question asks how many 1/2 cups fit in 5 cups, which is division.
        - |
          1/10 is 1/2 ÷ 5. Kai has plenty of seed: every cup fills 2 feeders.
        - |
          Correct. 5 ÷ 1/2 = 10, because every cup fills 2 feeders and 5 × 2 = 10. Check: 10 × 1/2 = 5 cups.
      answer: 3

    - slug: g5math-w10-q06
      type: multiple_choice
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        Which multiplication equation checks that 2 ÷ 1/5 = 10?
      options:
        - "10 × 1/5 = 2"
        - "2 × 1/5 = 10"
        - "5 × 2 = 10"
        - "10 × 2 = 1/5"
      option_explanations:
        - |
          Correct. Ten pieces of size 1/5 make 10/5, which is 2 wholes. That is the amount we started with.
        - |
          2 × 1/5 is 2/5, which is less than 1. It cannot equal 10.
        - |
          5 × 2 = 10 is a true fact, but it does not put ten fifths back together to make 2.
        - |
          10 × 2 is 20, not 1/5. The check multiplies the quotient, 10, by the size of each piece, 1/5.
      answer: 0

    - slug: g5math-w10-q07
      type: true_false
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        True or false: 8 ÷ 1/4 is greater than 8.
      answer: true
      explanation: |
        True. 8 ÷ 1/4 asks how many fourths fit in 8. Each whole holds 4 of them, so the answer is 8 × 4 = 32, which is greater than 8.

    - slug: g5math-w10-q08
      type: fill_blank
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        A fraction with 1 as its numerator, such as 1/4 or 1/6, is called a ____ fraction.
      answer: ["unit"]
      explanation: |
        It is a unit fraction: one equal part of a whole. This week we divide whole numbers by unit fractions.

    - slug: g5math-w10-q09
      type: multi_select
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which expressions are equal to 12? Select all that apply.
      options:
        - "3 ÷ 1/4"
        - "4 ÷ 1/3"
        - "6 ÷ 1/2"
        - "12 ÷ 1/2"
        - "1/4 ÷ 3"
      option_explanations:
        - |
          Equal to 12. 3 wholes hold 3 × 4 = 12 fourths.
        - |
          Equal to 12. 4 wholes hold 4 × 3 = 12 thirds.
        - |
          Equal to 12. 6 wholes hold 6 × 2 = 12 halves.
        - |
          Not 12. 12 wholes hold 12 × 2 = 24 halves.
        - |
          Not 12. 1/4 ÷ 3 shares one fourth into 3 parts, which is 1/12, a small fraction.
      answer: [0, 1, 2]

    - slug: g5math-w10-q10
      type: multiple_choice
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      figure: figures/w10-number-line-jumps-thirds.svg
      figure_alt: "A number line from 0 to 2, labeled 0, 1 and 2. Tick marks cut each whole into 3 equal spaces, 6 spaces in all. Six equal blue jumps go from 0 to 2, each covering one space."
      prompt: |
        Each jump on the number line is 1/3 long. Which division equation do the jumps show?
      options:
        - "2 ÷ 3 = 2/3"
        - "1/3 ÷ 2 = 1/6"
        - "2 ÷ 1/3 = 6"
        - "6 ÷ 1/3 = 2"
      option_explanations:
        - |
          2 ÷ 3 would share 2 among 3, giving 2/3. The jumps count how many thirds fit from 0 to 2.
        - |
          1/3 ÷ 2 would cut one third in half. The picture shows many jumps of 1/3 all the way to 2.
        - |
          Correct. It takes 6 jumps of 1/3 to get from 0 to 2, so 2 ÷ 1/3 = 6.
        - |
          The 6 and the 2 are swapped. The line goes to 2, and 6 is the number of jumps: 2 ÷ 1/3 = 6.
      answer: 2

    - slug: g5math-w10-q11
      type: multiple_choice
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        Without dividing, decide which sentence is true about 5 ÷ 1/2 and 5 ÷ 1/4.
      options:
        - "5 ÷ 1/2 is greater, because 1/2 is greater than 1/4."
        - "5 ÷ 1/4 is greater, because fourths are smaller than halves, so more of them fit in 5."
        - "They are equal, because both start with 5."
        - "5 ÷ 1/2 is greater, because 2 is less than 4."
      option_explanations:
        - |
          A bigger piece means fewer pieces fit. Halves are bigger than fourths, so fewer halves fit in 5.
        - |
          Correct. 5 ÷ 1/2 = 10 and 5 ÷ 1/4 = 20. The smaller the pieces, the more of them fit in 5.
        - |
          Both start with 5, but the pieces are different sizes, so different numbers of them fit: 10 halves and 20 fourths.
        - |
          The 2 and the 4 are denominators. A larger denominator means smaller pieces, and more small pieces fit in 5.
      answer: 1

    # ---- spiral review
    - slug: g5math-w10-q12
      type: multiple_choice
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        Two classmates share 1/4 of a bag of popcorn equally. What fraction of the whole bag does each one get? (This is 1/4 ÷ 2, last week's kind of division.)
      options:
        - "8"
        - "1/2"
        - "2/4"
        - "1/8"
      option_explanations:
        - |
          8 is 2 ÷ 1/4, how many fourths fit in 2. Here 1/4 of a bag is shared, so each share is a small fraction.
        - |
          1/2 is half of the whole bag. The classmates share only 1/4 of the bag, so each gets half of 1/4.
        - |
          2/4 is 2 × 1/4, twice as much as they have. Sharing makes each part smaller.
        - |
          Correct. Cutting each fourth in half makes eighths, so 1/4 ÷ 2 = 1/8 of the bag each.
      answer: 3

    - slug: g5math-w10-q13
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 3, Section A"
      points: 1
      prompt: |
        What is 5/6 × 3/4?
      options:
        - "15/24"
        - "8/10"
        - "15/10"
        - "8/24"
      option_explanations:
        - |
          Correct. 5 × 3 = 15 and 6 × 4 = 24, so 5/6 × 3/4 = 15/24.
        - |
          8/10 adds the numerators and the denominators. To multiply, multiply both.
        - |
          The numerator 15 is right, but the denominators were added (6 + 4). Multiply them: 6 × 4 = 24.
        - |
          The denominator 24 is right, but the numerators were added (5 + 3). Multiply them: 5 × 3 = 15.
      answer: 0

    - slug: g5math-w10-q14
      type: numeric
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      prompt: |
        A fish tank is a rectangular prism. Its base has an area of 12 square inches, and it is 7 inches tall. What is its volume in cubic inches?
      answer: { value: 84, tolerance: 0 }
      explanation: |
        Volume = area of the base × height = 12 × 7 = 84 cubic inches.

    - slug: g5math-w10-q15
      type: multiple_choice
      topic_code: "5.NF.B.3"
      source: "IM K–5 Math Grade 5, Unit 2, Section A"
      points: 1
      prompt: |
        Three friends share 7 pizzas equally, so each friend gets 7/3 pizzas. Between which two whole numbers is 7/3?
      options:
        - "0 and 1"
        - "3 and 4"
        - "2 and 3"
        - "7 and 8"
      option_explanations:
        - |
          7/3 is more than 1, because 3/3 is 1 whole and 7 thirds is more than 3 thirds.
        - |
          3 is the number of friends. 3 wholes would be 9/3, and 7/3 is less than that.
        - |
          Correct. 6/3 = 2 and 9/3 = 3, so 7/3 is between 2 and 3. It is 2 1/3 pizzas each.
        - |
          7 is the number of pizzas, not the share. Each friend gets 7 ÷ 3, which is a little more than 2.
      answer: 2

    - slug: g5math-w10-q16
      type: short_answer
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 2
      prompt: |
        Ms. Ruiz has 4 yards of ribbon. She cuts it into pieces that are each 1/3 yard long.

        (a) How many pieces does she get? Write a division equation.
        (b) Explain how you know, with a diagram or with multiplication.
      answer: |
        (a) 4 ÷ 1/3 = 12 pieces.
        (b) Each yard holds 3 pieces of 1/3 yard, and 4 yards hold 4 × 3 = 12 pieces. Check: 12 × 1/3 = 12/3 = 4 yards.
      explanation: |
        Two points.

        (a) 1 pt: 12 pieces, with the equation 4 ÷ 1/3 = 12.

        (b) 1 pt: a clear reason, such as a tape diagram of 4 yards each cut into 3 parts, "3 pieces in each yard, 4 × 3 = 12", or the check 12 × 1/3 = 4.
