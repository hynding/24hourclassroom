week: 8
unit: 3
title: "Fractions of Fractions and Scaling"
topics: ["5.NF.B.5", "5.NF.B.4"]
guide: guides/week-08.md
guide_description: |
  How to find a fraction of a fraction (1/2 of 3/4 is 1/2 × 3/4), how an area model in a unit square shows the
  product, the quick rule of multiplying numerators and denominators, and how to tell whether a product is bigger
  or smaller than a factor without multiplying, by comparing the other factor with 1.
flashcards_description: |
  20 cards on finding a fraction of a fraction, area models in a unit square, multiplying numerators and
  denominators, and multiplication as scaling: when a product is greater than, less than or equal to a factor.

flashcards:
  - front: Fraction of a fraction → what it means
    back: |
      Taking a part of a part. 1/2 of 3/4 means cut 3/4 into 2 equal pieces and take 1 of them. We write it 1/2 × 3/4.
    topic_code: "5.NF.B.4"
  - front: The word "of" between two fractions → what to do
    back: |
      Multiply. 2/3 of 3/5 is 2/3 × 3/5.
    topic_code: "5.NF.B.4"
  - front: Area model for 2/3 × 3/4 → how to draw it
    back: |
      Draw a unit square. Split one side into 4 equal parts and shade 3 of them. Split the other side into 3 equal parts and use 2 of them. The overlap is the product.
    topic_code: "5.NF.B.4"
  - front: Area model → what the denominator of the product counts
    back: |
      All the small equal rectangles in the whole square. A square cut into 4 columns and 3 rows has 4 × 3 = 12 small parts, so the product is in twelfths.
    topic_code: "5.NF.B.4"
  - front: Area model → what the numerator of the product counts
    back: |
      The small rectangles in the overlap. 3 columns by 2 rows overlap in 3 × 2 = 6 parts, so 3/4 × 2/3 = 6/12.
    topic_code: "5.NF.B.4"
  - front: Fraction × fraction → the rule
    back: |
      Multiply the numerators, then multiply the denominators. 2/5 × 3/4 = (2 × 3)/(5 × 4) = 6/20.
    topic_code: "5.NF.B.4"
  - front: 1/3 × 1/4 → product
    back: |
      1/12. A third of a fourth is one of 12 equal parts of the whole.
    topic_code: "5.NF.B.4"
  - front: 3/5 × 2/3 → product
    back: |
      6/15. Numerators 3 × 2 = 6, denominators 5 × 3 = 15. (6/15 is the same as 2/5.)
    topic_code: "5.NF.B.4"
  - front: 1/2 of 5/6 → product
    back: |
      5/12. Cut each sixth in half and you have twelfths; 5 of them are shaded.
    topic_code: "5.NF.B.4"
  - front: Fraction × fraction (both less than 1) → size of the answer
    back: |
      Smaller than both fractions. A part of a part is less than either part.
    topic_code: "5.NF.B.5"
  - front: Scaling → what it means
    back: |
      Multiplying to make a number bigger or smaller. 2 × 6 stretches 6 to 12; 1/2 × 6 shrinks 6 to 3.
    topic_code: "5.NF.B.5"
  - front: Multiplying by a number greater than 1 → what happens
    back: |
      The product is greater than the number you started with. 3/2 × 8 = 12, and 12 is greater than 8.
    topic_code: "5.NF.B.5"
  - front: Multiplying by a fraction less than 1 → what happens
    back: |
      The product is less than the number you started with. 3/4 × 8 = 6, and 6 is less than 8.
    topic_code: "5.NF.B.5"
  - front: Multiplying by 1 → what happens
    back: |
      The number stays the same. 5/5 × 8 = 8, because 5/5 is 1.
    topic_code: "5.NF.B.5"
  - front: Is 7/8 × 15 more or less than 15?
    back: |
      Less. 7/8 is less than 1, so the product is a little less than 15.
    topic_code: "5.NF.B.5"
  - front: Is 9/4 × 15 more or less than 15?
    back: |
      More. 9/4 is greater than 1 (it is 2 1/4), so the product is more than twice 15.
    topic_code: "5.NF.B.5"
  - front: Comparing 2/3 × 10 and 4/3 × 10 → without multiplying
    back: |
      2/3 × 10 is less than 10 and 4/3 × 10 is more than 10, so 4/3 × 10 is greater.
    topic_code: "5.NF.B.5"
  - front: Fraction equal to 1 → how to spot it
    back: |
      The numerator and the denominator are the same, like 4/4 or 9/9. Multiplying by it changes nothing.
    topic_code: "5.NF.B.5"
  - front: Scaling on a number line → a quick picture
    back: |
      Mark the starting number. A factor less than 1 lands to its left (closer to 0); a factor greater than 1 lands to its right.
    topic_code: "5.NF.B.5"
  - front: Recipe for 3/4 cup, make 1/2 the recipe → how much
    back: |
      1/2 × 3/4 = 3/8 cup. Half of the recipe needs half as much.
    topic_code: "5.NF.B.4"

quiz:
  description: |
    15 questions · about 30 minutes · finding a fraction of a fraction with an area model, multiplying fractions,
    a number line about scaling, deciding whether a product is bigger or smaller than a factor, and review of
    fractions as division, volume and expressions. Multiple choice, select-all, true/false and number answers are
    graded at once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g5math-w08-q01
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 3, Section A"
      points: 1
      stimulus: |
        Use the area model. The square is 1 whole, 1 unit on each side. Its bottom side is cut into 4 equal parts and its left side into 3 equal parts. The blue part is 3/4 wide and 2/3 tall.
      figure: figures/w08-area-model-3-4-by-2-3.svg
      figure_alt: "A unit square with each side labeled 1. Lines cut it into 4 equal columns and 3 equal rows, making 12 equal small rectangles. The bottom 2 rows of the 3 left columns are shaded blue: 6 small rectangles. A bracket under the 3 blue columns is labeled 3/4, and a bracket beside the 2 blue rows is labeled 2/3. The other 6 small rectangles are white."
      prompt: |
        Which equation does the blue part show?
      options:
        - "3/4 + 2/3 = 5/7"
        - "3/4 × 2/3 = 6/7"
        - "3/4 × 2/3 = 6/12"
        - "3/4 × 2/3 = 5/12"
      option_explanations:
        - |
          The blue part is a rectangle 3/4 wide and 2/3 tall, so its area is a product, not a sum. Adding the fractions this way also adds the denominators.
        - |
          The 6 on top is right, but the bottom counts all the small rectangles in the whole square: 4 × 3 = 12, not 4 + 3 = 7.
        - |
          Correct. 3 blue columns times 2 blue rows make 6 small rectangles, and the whole square has 4 × 3 = 12. So 3/4 × 2/3 = 6/12.
        - |
          5 comes from adding 3 + 2. Count the blue rectangles instead: 3 columns of 2 is 6, not 5.
      answer: 2

    - slug: g5math-w08-q02
      type: numeric
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 3, Section A"
      points: 1
      stimulus: |
        Use the area model. The square is 1 whole, 1 unit on each side. Its bottom side is cut into 4 equal parts and its left side into 3 equal parts. The blue part is 3/4 wide and 2/3 tall.
      prompt: |
        Suppose the left side were cut into 5 equal parts instead of 3, with the bottom still cut into 4. How many small equal rectangles would the whole square have?
      answer: { value: 20, tolerance: 0 }
      explanation: |
        4 columns and 5 rows make 4 × 5 = 20 small rectangles. Each one would be 1/20 of the square, which is why fourths times fifths gives twentieths.

    - slug: g5math-w08-q03
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 3, Section A"
      points: 1
      prompt: |
        What is 2/5 × 1/3?
      options:
        - "3/8"
        - "2/15"
        - "3/15"
        - "2/8"
      option_explanations:
        - |
          3/8 adds the numerators (2 + 1) and the denominators (5 + 3). To multiply fractions, multiply both: 2 × 1 and 5 × 3.
        - |
          Correct. Multiply the numerators, 2 × 1 = 2, and the denominators, 5 × 3 = 15. So 2/5 × 1/3 = 2/15.
        - |
          The denominator 15 is right, but the numerators were added (2 + 1 = 3). Multiply them: 2 × 1 = 2.
        - |
          The numerator 2 is right, but the denominators were added (5 + 3 = 8). Multiply them: 5 × 3 = 15.
      answer: 1

    - slug: g5math-w08-q04
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 3, Section A"
      points: 1
      prompt: |
        Hana has 3/4 of a pan of cornbread. She gives 1/2 of that cornbread to her neighbor. What fraction of the whole pan does she give away?
      options:
        - "3/8"
        - "1/4"
        - "4/6"
        - "1 1/4"
      option_explanations:
        - |
          Correct. Half of 3/4 is 1/2 × 3/4 = 3/8. Cutting each fourth in half makes eighths, and she gives away 3 of them.
        - |
          1/4 is 3/4 − 1/2, which is how much she would have left if she gave away half a pan. She gives away half of the 3/4 she has.
        - |
          4/6 adds the tops and the bottoms. "1/2 of 3/4" means multiply, and half of something must be smaller than it.
        - |
          1 1/4 is 3/4 + 1/2. Giving away part of the cornbread cannot be more than the 3/4 pan she had.
      answer: 0

    - slug: g5math-w08-q05
      type: multiple_choice
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 3, Section A"
      points: 1
      prompt: |
        Without multiplying, decide which product is less than 9.
      options:
        - "7/4 × 9"
        - "9/9 × 9"
        - "2 1/2 × 9"
        - "5/6 × 9"
      option_explanations:
        - |
          7/4 is greater than 1 (it is 1 3/4), so 7/4 × 9 is greater than 9.
        - |
          9/9 is exactly 1, so 9/9 × 9 is equal to 9, not less than it.
        - |
          2 1/2 is greater than 1, so this product is more than 2 nines: greater than 9.
        - |
          Correct. 5/6 is less than 1, so 5/6 × 9 is less than 9. (It is 45/6, which is 7 3/6.)
      answer: 3

    - slug: g5math-w08-q06
      type: multi_select
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 3, Section A"
      points: 2
      partial_credit: true
      prompt: |
        Which products are greater than 3/5? Select all that apply.
      options:
        - "4/3 × 3/5"
        - "1/2 × 3/5"
        - "6/5 × 3/5"
        - "1 × 3/5"
        - "2 × 3/5"
      option_explanations:
        - |
          Greater. 4/3 is more than 1 (4 thirds is 1 whole and 1 third), so it stretches 3/5 to something bigger.
        - |
          Not greater. 1/2 is less than 1, so half of 3/5 is smaller than 3/5.
        - |
          Greater. 6/5 is more than 1 (6 fifths is 1 whole and 1 fifth), so the product is more than 3/5.
        - |
          Not greater. Multiplying by 1 leaves the number the same, so 1 × 3/5 equals 3/5.
        - |
          Greater. 2 × 3/5 is two copies of 3/5, which is 6/5, more than 3/5.
      answer: [0, 2, 4]

    - slug: g5math-w08-q07
      type: true_false
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 3, Section A"
      points: 1
      prompt: |
        True or false: 7/8 × 20 is greater than 20.
      answer: false
      explanation: |
        False. 7/8 is less than 1, so 7/8 × 20 is less than 20. (It is 140/8, which is 17 4/8.)

    - slug: g5math-w08-q08
      type: fill_blank
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 3, Section A"
      points: 1
      prompt: |
        Multiplying 12 by 3 stretches it to 36, and multiplying 12 by 1/3 shrinks it to 4. Changing the size of a number by multiplying is called ____.
      answer: ["scaling", "scale", "resizing"]
      explanation: |
        It is called scaling. A factor greater than 1 scales a number up, and a factor less than 1 scales it down.

    - slug: g5math-w08-q09
      type: numeric
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 3, Section A"
      points: 1
      prompt: |
        1/4 × 1/5 = 1/□. What number goes in the box?
      answer: { value: 20, tolerance: 0 }
      explanation: |
        Multiply the denominators: 4 × 5 = 20. A fourth of a fifth is one of 20 equal parts of the whole, so 1/4 × 1/5 = 1/20.

    - slug: g5math-w08-q10
      type: multiple_choice
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 3, Section A"
      points: 1
      prompt: |
        Which sentence about 4/5 × 2/3 is true?
      options:
        - "It is greater than 2/3, because multiplying always makes a number bigger."
        - "It is less than 2/3, because 4/5 is less than 1."
        - "It is equal to 2/3, because 2/3 is one of the factors."
        - "It is greater than 2/3, because 4/5 is close to 1."
      option_explanations:
        - |
          Multiplying by a number less than 1 makes a number smaller. Here 4/5 is less than 1, so the product shrinks.
        - |
          Correct. Taking 4/5 of 2/3 means taking less than all of it, so the product is less than 2/3. (It is 8/15.)
        - |
          The product equals 2/3 only when the other factor is exactly 1. 4/5 is not 1.
        - |
          Close to 1 is still less than 1. 4/5 of 2/3 is a little less than 2/3, not more.
      answer: 1

    - slug: g5math-w08-q11
      type: multiple_choice
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 3, Section A"
      points: 1
      figure: figures/w08-scaling-number-line.svg
      figure_alt: "A number line from 0 to 16 with a tick mark at every whole number and labels at 0, 2, 4, 6, 8, 10, 12, 14 and 16. Three points are marked: a red point J at 4, a blue point K at 10 and a green point L at 15."
      prompt: |
        Point K is at 10. Which point shows 3/2 × 10?
      options:
        - "Point J, at 4"
        - "Point K, at 10"
        - "Point L, at 15"
        - "No point: 3/2 × 10 is 13"
      option_explanations:
        - |
          Point J is to the left of 10, so it shows 10 scaled down by a factor less than 1 (2/5 × 10 = 4). 3/2 is greater than 1.
        - |
          Point K is 10 itself, which is 1 × 10. 3/2 is more than 1, so the product moves to the right of 10.
        - |
          Correct. 3/2 × 10 = 30/2 = 15. It is 1 1/2 tens: 10 and half of 10 more. Point L is at 15.
        - |
          13 adds 3 to 10. 3/2 × 10 means 3 halves of 10, and half of 10 is 5, so it is 5 + 5 + 5 = 15.
      answer: 2

    # ---- spiral review
    - slug: g5math-w08-q12
      type: multiple_choice
      topic_code: "5.NF.B.3"
      source: "IM K–5 Math Grade 5, Unit 2, Section A"
      points: 1
      prompt: |
        4 friends share 3 sandwiches equally. How much does each friend get?
      options:
        - "4/3 sandwiches"
        - "1/4 sandwich"
        - "1/3 sandwich"
        - "3/4 sandwich"
      option_explanations:
        - |
          4/3 is 4 ÷ 3, the wrong way round. That would be 4 sandwiches shared by 3 friends, more than 1 each.
        - |
          1/4 is one share of a single sandwich. There are 3 sandwiches, so each friend gets 3 of those fourths.
        - |
          1/3 would be the share of 1 sandwich among 3 people. Here 3 sandwiches are shared by 4 friends.
        - |
          Correct. Sharing 3 among 4 is 3 ÷ 4 = 3/4. Each friend gets 1/4 of every sandwich, and 3 fourths in all.
      answer: 3

    - slug: g5math-w08-q13
      type: numeric
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      prompt: |
        A gift box is a rectangular prism 5 centimeters long, 4 centimeters wide and 3 centimeters tall. What is its volume in cubic centimeters?
      answer: { value: 60, tolerance: 0 }
      explanation: |
        Volume = length × width × height = 5 × 4 × 3 = 60 cubic centimeters.

    - slug: g5math-w08-q14
      type: multiple_choice
      topic_code: "5.OA.A.2"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      prompt: |
        Which expression means "multiply 6 by 4, then add 5"?
      options:
        - "(6 × 4) + 5"
        - "6 × (4 + 5)"
        - "(6 + 5) × 4"
        - "6 + (4 × 5)"
      option_explanations:
        - |
          Correct. The parentheses show that 6 × 4 is done first, and then 5 is added.
        - |
          The parentheses here say to add 4 + 5 first, then multiply by 6. That is the wrong order.
        - |
          This adds 6 + 5 first and then multiplies by 4. The words say to multiply 6 by 4 first.
        - |
          This multiplies 4 × 5 and adds 6. The words multiply 6 by 4, then add 5.
      answer: 0

    - slug: g5math-w08-q15
      type: short_answer
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 3, Section A"
      points: 2
      prompt: |
        A granola recipe uses 2/3 cup of oats. Ms. Ortiz makes 1/2 of the recipe.

        (a) How much oats does she use? Write an equation or draw a diagram.
        (b) Without multiplying, explain how you know the answer to (a) is less than 2/3 cup.
      answer: |
        (a) 1/2 × 2/3 = 2/6 cup (the same as 1/3 cup).
        (b) She uses 1/2 of the 2/3 cup, and 1/2 is less than 1, so the amount shrinks. Half of something is less than all of it.
      explanation: |
        Two points.

        (a) 1 pt: 2/6 cup or 1/3 cup, with an equation such as 1/2 × 2/3 = 2/6 or a diagram that halves 2/3.

        (b) 1 pt: a reason based on size, such as "multiplying by 1/2, which is less than 1, makes it smaller" or "half of an amount is less than the amount".
