  - slug: g5math-u03-check-q20
    type: multiple_choice
    topic_code: "5.MD.B.2"
    source: "IM K–5 Math Grade 5, Unit 3, Section C"
    points: 1
    stimulus: |
      Use the line plot "Earthworm Lengths". A class measured earthworms in the school garden. Each X is one earthworm, and the lengths are in inches.
    prompt: |
      The earthworms that are 2 3/4 inches long are lined up end to end. How long is the line?
    options:
      - "5 3/4 inches"
      - "6 3/4 inches"
      - "2 3/4 inches"
      - "8 1/4 inches"
    option_explanations:
      - |
        5 3/4 adds 3 to 2 3/4. There are 3 earthworms of that length, so multiply: 3 × 2 3/4.
      - |
        6 3/4 multiplies the 2 by 3 but adds only one 3/4. Each of the 3 earthworms has its own 3/4 inch.
      - |
        2 3/4 inches is the length of one earthworm. There are 3 Xs at 2 3/4.
      - |
        Correct. 3 × 2 = 6 and 3 × 3/4 = 9/4 = 2 1/4. 6 + 2 1/4 = 8 1/4 inches.
    answer: 3

  - slug: g5math-u03-check-q21
    type: multiple_choice
    topic_code: "5.MD.B.2"
    source: "IM K–5 Math Grade 5, Unit 3, Section C"
    points: 1
    stimulus: |
      Use the line plot "Earthworm Lengths". A class measured earthworms in the school garden. Each X is one earthworm, and the lengths are in inches.
    prompt: |
      How much longer is the longest earthworm than the shortest earthworm?
    options:
      - "1 1/2 inches"
      - "1 1/4 inches"
      - "3 2/4 inches"
      - "3/4 inch"
    option_explanations:
      - |
        Correct. The longest earthworms are 3 2/4 inches and the shortest is 2 inches. 3 2/4 − 2 = 1 2/4, which is 1 1/2 inches.
      - |
        1 1/4 uses 3 1/4 as the longest, but no earthworm is at 3 1/4. The longest are at 3 2/4.
      - |
        3 2/4 inches is the length of the longest earthworms. The question asks how much longer they are than the shortest.
      - |
        3/4 inch is the difference between 2 3/4 and 2, but the longest earthworms are at 3 2/4.
    answer: 0

  # ---- Short answer
  - slug: g5math-u03-check-q22
    type: short_answer
    topic_code: "5.NF.B.7"
    source: "IM K–5 Math Grade 5, Unit 3, Sections B and C"
    points: 3
    prompt: |
      Mr. Osei has 3 pounds of modeling clay for his art class.

      (a) He gives each student 1/4 pound. How many students get clay? Write a division equation.
      (b) Use multiplication to check your answer to (a).
      (c) Later he finds 1/2 pound more clay and splits it equally between 2 tables. How much clay does each table get?
    answer: |
      (a) 3 ÷ 1/4 = 12 students.
      (b) 12 × 1/4 = 12/4 = 3 pounds, the amount he started with.
      (c) 1/2 ÷ 2 = 1/4 pound for each table.
    explanation: |
      Three points.

      (a) 1 pt: 12 students, with the equation 3 ÷ 1/4 = 12.

      (b) 1 pt: a multiplication that gives back 3 pounds, such as 12 × 1/4 = 12/4 = 3.

      (c) 1 pt: 1/4 pound (accept 2/8), from 1/2 ÷ 2 or a diagram that cuts a half into 2 equal parts.
