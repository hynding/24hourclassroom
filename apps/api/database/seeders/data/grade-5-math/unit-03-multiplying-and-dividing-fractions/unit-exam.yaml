unit: 3
description: |
  22 questions · about 45 minutes · every standard of Unit 3: multiplying a fraction by a fraction with an area
  model, deciding whether a product is bigger or smaller without multiplying, dividing a unit fraction by a whole
  number and a whole number by a unit fraction, word problems with mixed numbers, and a line plot of earthworm
  lengths in fourths of an inch. Three sets of questions share a picture. Multiple choice, select-all, true/false
  and number answers are graded at once; the fill-in word is matched automatically; the short answer is checked by
  your teacher against the scoring notes.
questions:
  # ---- Multiplying fractions and scaling (5.NF.B.4, 5.NF.B.5)
  - slug: g5math-u03-check-q01
    type: multiple_choice
    topic_code: "5.NF.B.4"
    source: "IM K–5 Math Grade 5, Unit 3, Section A"
    points: 1
    stimulus: |
      Use the area model. The square is 1 whole, 1 unit on each side. Its bottom side is cut into 5 equal parts and its left side into 3 equal parts. The blue part is 4/5 wide and 2/3 tall.
    figure: figures/u03-area-model-2-3-by-4-5.svg
    figure_alt: "A unit square with each side labeled 1. Lines cut it into 5 equal columns and 3 equal rows, making 15 equal small rectangles. The bottom 2 rows of the 4 left columns are shaded blue: 8 small rectangles. A bracket under the 4 blue columns is labeled 4/5, and a bracket beside the 2 blue rows is labeled 2/3. The other 7 small rectangles are white."
    prompt: |
      Which equation does the blue part show?
    options:
      - "2/3 × 4/5 = 6/8"
      - "2/3 × 4/5 = 6/15"
      - "2/3 × 4/5 = 8/15"
      - "2/3 × 4/5 = 8/8"
    option_explanations:
      - |
        6/8 adds the numerators (2 + 4) and the denominators (3 + 5). The blue part is a product: count its small rectangles and all of them.
      - |
        6 adds 2 + 4. The blue part is 4 columns by 2 rows, which is 4 × 2 = 8 small rectangles.
      - |
        Correct. The blue part is 4 × 2 = 8 small rectangles, and the whole square has 5 × 3 = 15. So 2/3 × 4/5 = 8/15.
      - |
        8/8 would mean the whole square is blue. The square has 15 small rectangles, and only 8 are blue.
    answer: 2

  - slug: g5math-u03-check-q02
    type: numeric
    topic_code: "5.NF.B.4"
    source: "IM K–5 Math Grade 5, Unit 3, Section A"
    points: 1
    stimulus: |
      Use the area model. The square is 1 whole, 1 unit on each side. Its bottom side is cut into 5 equal parts and its left side into 3 equal parts. The blue part is 4/5 wide and 2/3 tall.
    prompt: |
      How many of the small rectangles in the square are white?
    answer: { value: 7, tolerance: 0 }
    explanation: |
      The square has 5 × 3 = 15 small rectangles, and 4 × 2 = 8 are blue. 15 − 8 = 7 are white.

  - slug: g5math-u03-check-q03
    type: multiple_choice
    topic_code: "5.NF.B.4"
    source: "IM K–5 Math Grade 5, Unit 3, Section A"
    points: 1
    prompt: |
      What is 3/8 × 2/5?
    options:
      - "5/13"
      - "15/16"
      - "6/13"
      - "6/40"
    option_explanations:
      - |
        5/13 adds the numerators and the denominators. To multiply fractions, multiply both.
      - |
        15/16 multiplies across the wrong way (3 × 5 and 8 × 2). Multiply top by top and bottom by bottom.
      - |
        The numerator 6 is right, but the denominators were added (8 + 5). Multiply them: 8 × 5 = 40.
      - |
        Correct. 3 × 2 = 6 and 8 × 5 = 40, so 3/8 × 2/5 = 6/40.
    answer: 3

  - slug: g5math-u03-check-q04
    type: multiple_choice
    topic_code: "5.NF.B.5"
    source: "IM K–5 Math Grade 5, Unit 3, Section A"
    points: 1
    prompt: |
      Which sentence about 5/4 × 18 is true?
    options:
      - "It is greater than 18, because 5/4 is greater than 1."
      - "It is less than 18, because 5/4 is a fraction."
      - "It is equal to 18, because 18 is one of the factors."
      - "It is less than 18, because 4 is less than 5."
    option_explanations:
      - |
        Correct. 5/4 is more than 1 (it is 1 1/4), so 5/4 × 18 stretches 18 to a bigger number. (It is 22 2/4.)
      - |
        Some fractions are greater than 1. 5/4 is 5 fourths, more than the 4 fourths that make 1, so the product is bigger.
      - |
        The product equals 18 only when the other factor is exactly 1. 5/4 is more than 1.
      - |
        The numerator 5 is greater than the denominator 4, which is exactly why 5/4 is greater than 1 and the product is greater than 18.
    answer: 0

  - slug: g5math-u03-check-q05
    type: multi_select
    topic_code: "5.NF.B.5"
    source: "IM K–5 Math Grade 5, Unit 3, Section A"
    points: 2
    partial_credit: true
    prompt: |
      Without multiplying, decide which products are less than 2/3. Select all that apply.
    options:
      - "1/4 × 2/3"
      - "3/2 × 2/3"
      - "7/8 × 2/3"
      - "1 × 2/3"
      - "5/6 × 2/3"
    option_explanations:
      - |
        Less. 1/4 is less than 1, so 1/4 × 2/3 is less than 2/3.
      - |
        Not less. 3/2 is greater than 1, so 3/2 × 2/3 is greater than 2/3. (It is 1.)
      - |
        Less. 7/8 is less than 1, so the product is a little less than 2/3.
      - |
        Not less. Multiplying by 1 leaves 2/3 the same, so 1 × 2/3 equals 2/3.
      - |
        Less. 5/6 is less than 1, so 5/6 × 2/3 is less than 2/3.
    answer: [0, 2, 4]

  - slug: g5math-u03-check-q06
    type: multiple_choice
    topic_code: "5.NF.B.4"
    source: "IM K–5 Math Grade 5, Unit 3, Section A"
    points: 1
    prompt: |
      Beans are planted in 3/5 of a class garden. Half of the bean part has red beans. What fraction of the whole garden has red beans?
    options:
      - "3/7"
      - "3/10"
      - "1/10"
      - "1 1/10"
    option_explanations:
      - |
        3/7 adds the denominators (5 + 2). Half of 3/5 is 1/2 × 3/5: multiply the denominators, 5 × 2 = 10.
      - |
        Correct. Half of 3/5 is 1/2 × 3/5 = 3/10. Cutting each fifth in half makes tenths, and 3 of them have red beans.
      - |
        1/10 is half of just one fifth. The bean part is 3 fifths, so half of it is 3 tenths.
      - |
        1 1/10 is 3/5 + 1/2, more than the whole garden. The red beans are only part of the bean part.
    answer: 1

  # ---- Dividing with unit fractions (5.NF.B.7)
  - slug: g5math-u03-check-q07
    type: multiple_choice
    topic_code: "5.NF.B.7"
    source: "IM K–5 Math Grade 5, Unit 3, Section B"
    points: 1
    stimulus: |
      Use the tape diagram. Each bar is 1 whole, and every bar is cut into equal parts labeled 1/3.
    figure: figures/u03-tape-two-wholes-thirds.svg
    figure_alt: "Two bars of the same length, one above the other. Each bar is labeled 1 at its right end and is cut into 3 equal parts, each labeled 1/3. The parts alternate blue and green. There are 6 parts in all."
    prompt: |
      Which division equation matches the tape diagram?
    options:
      - "2 ÷ 3 = 2/3"
      - "1/3 ÷ 2 = 1/6"
      - "6 ÷ 1/3 = 2"
      - "2 ÷ 1/3 = 6"
    option_explanations:
      - |
        2 ÷ 3 shares 2 wholes among 3 people. The picture counts how many thirds are in 2 wholes.
      - |
        1/3 ÷ 2 would cut one third in half. The picture shows 2 whole bars cut into thirds.
      - |
        The 6 and the 2 are swapped. There are 2 wholes, and 6 thirds fit in them: 2 ÷ 1/3 = 6.
      - |
        Correct. Each of the 2 wholes holds 3 thirds, so 2 × 3 = 6 thirds. 2 ÷ 1/3 = 6.
    answer: 3

  - slug: g5math-u03-check-q08
    type: numeric
    topic_code: "5.NF.B.7"
    source: "IM K–5 Math Grade 5, Unit 3, Section B"
    points: 1
    stimulus: |
      Use the tape diagram. Each bar is 1 whole, and every bar is cut into equal parts labeled 1/3.
    prompt: |
      Imagine 7 bars like these. How many thirds would there be? (This is 7 ÷ 1/3.)
    answer: { value: 21, tolerance: 0 }
    explanation: |
      Each bar holds 3 thirds, so 7 bars hold 7 × 3 = 21 thirds. 7 ÷ 1/3 = 21.

  - slug: g5math-u03-check-q09
    type: multiple_choice
    topic_code: "5.NF.B.7"
    source: "IM K–5 Math Grade 5, Unit 3, Section B"
    points: 1
    prompt: |
      What is 1/4 ÷ 5?
    options:
      - "5/4"
      - "1/20"
      - "20"
      - "1/9"
    option_explanations:
      - |
        5/4 is 5 × 1/4, five times as much. Sharing 1/4 into 5 parts makes each part smaller than 1/4.
      - |
        Correct. Cutting each fourth into 5 parts makes 4 × 5 = 20 parts, so 1/4 ÷ 5 = 1/20. Check: 5 × 1/20 = 5/20 = 1/4.
      - |
        20 is 5 ÷ 1/4, how many fourths fit in 5. Here 1/4 is being shared, so the answer is a small fraction.
      - |
        9 comes from adding 4 + 5. Cutting each fourth into 5 pieces makes 4 × 5 = 20 pieces in the whole.
    answer: 1

  - slug: g5math-u03-check-q10
    type: numeric
    topic_code: "5.NF.B.7"
    source: "IM K–5 Math Grade 5, Unit 3, Section B"
    points: 1
    prompt: |
      What is 5 ÷ 1/6?
    answer: { value: 30, tolerance: 0 }
    explanation: |
      Each whole holds 6 sixths, so 5 wholes hold 5 × 6 = 30 sixths. Check: 30 × 1/6 = 30/6 = 5.

  - slug: g5math-u03-check-q11
    type: multiple_choice
    topic_code: "5.NF.B.7"
    source: "IM K–5 Math Grade 5, Unit 3, Section B"
    points: 1
    prompt: |
      Six hikers share 1/2 gallon of water equally. How much water does each hiker get?
    options:
      - "1/12 gallon"
      - "3 gallons"
      - "12 gallons"
      - "1/8 gallon"
    option_explanations:
      - |
        Correct. 1/2 ÷ 6 = 1/12. Cutting each half gallon into 6 parts makes 12 parts in a gallon.
      - |
        3 gallons is 6 × 1/2, six times as much water as they have. Sharing makes each part smaller.
      - |
        12 is 6 ÷ 1/2, how many halves fit in 6. Here 1/2 gallon is being shared among 6 hikers.
      - |
        8 comes from adding 2 + 6. Cutting each half into 6 parts makes 2 × 6 = 12 parts.
    answer: 0

  - slug: g5math-u03-check-q12
    type: multiple_choice
    topic_code: "5.NF.B.7"
    source: "IM K–5 Math Grade 5, Unit 3, Section B"
    points: 1
    prompt: |
      Each piano practice session lasts 1/4 hour. How many sessions fit into 3 hours?
    options:
      - "3/4 of a session"
      - "7 sessions"
      - "1/12 of a session"
      - "12 sessions"
    option_explanations:
      - |
        3/4 is 3 ÷ 4. The question asks how many quarter hours fit in 3 hours, and every hour holds 4 of them.
      - |
        7 adds 3 + 4. Each of the 3 hours holds 4 quarter hours, so multiply: 3 × 4.
      - |
        1/12 is 1/4 ÷ 3, sharing a quarter hour into 3 parts. Many short sessions fit in 3 hours.
      - |
        Correct. 3 ÷ 1/4 = 12, because each hour holds 4 quarter hours and 3 × 4 = 12.
    answer: 3

  - slug: g5math-u03-check-q13
    type: true_false
    topic_code: "5.NF.B.7"
    source: "IM K–5 Math Grade 5, Unit 3, Section B"
    points: 1
    prompt: |
      True or false: 1/5 ÷ 3 = 1/15, and 3 × 1/15 = 1/5 checks it.
    answer: true
    explanation: |
      True. Cutting each fifth into 3 parts makes 15 parts, so 1/5 ÷ 3 = 1/15. Three of those parts make 3/15, which is 1/5.

  - slug: g5math-u03-check-q14
    type: fill_blank
    topic_code: "5.NF.B.7"
    source: "IM K–5 Math Grade 5, Unit 3, Section B"
    points: 1
    prompt: |
      In 4 ÷ 1/2 = 8, the answer 8 is called the ____.
    answer: ["quotient", "the quotient"]
    explanation: |
      The answer to a division problem is the quotient. 8 halves fit in 4, so the quotient is 8.

  - slug: g5math-u03-check-q15
    type: multiple_choice
    topic_code: "5.NF.B.7"
    source: "IM K–5 Math Grade 5, Unit 3, Section B"
    points: 1
    prompt: |
      Which story can be solved with 1/3 ÷ 4?
    options:
      - "How many 1/3-cup scoops are in 4 cups of oats?"
      - "Four friends share 1/3 of a pan of cornbread equally. What part of the pan does each friend get?"
      - "What is 1/3 of 4 pounds of grapes?"
      - "A board 1/3 meter long is put next to a board 4 meters long. How long are they together?"
    option_explanations:
      - |
        This asks how many thirds fit in 4, which is 4 ÷ 1/3 = 12. The numbers are in the other order.
      - |
        Correct. One third of a pan is shared equally among 4 friends, so each gets 1/3 ÷ 4 = 1/12 of the pan.
      - |
        1/3 of 4 pounds is a multiplication, 1/3 × 4 = 4/3 pounds.
      - |
        Putting two boards together is addition, 4 + 1/3. Nothing is being shared or measured out.
    answer: 1

  # ---- Problem solving with fractions (5.NF.B.6)
  - slug: g5math-u03-check-q16
    type: multiple_choice
    topic_code: "5.NF.B.6"
    source: "IM K–5 Math Grade 5, Unit 3, Section C"
    points: 1
    prompt: |
      A bike trail is 3 1/4 miles long. Sam rides the whole trail 2 times. How far does he ride?
    options:
      - "6 1/4 miles"
      - "5 1/4 miles"
      - "6 2/4 miles"
      - "3 2/4 miles"
    option_explanations:
      - |
        6 1/4 doubles the 3 but not the 1/4. Each ride has its own 1/4 mile, so 2 × 1/4 = 2/4.
      - |
        5 1/4 adds 2 to 3 1/4. Sam rides the trail 2 times, so multiply: 2 × 3 1/4.
      - |
        Correct. 2 × 3 = 6 and 2 × 1/4 = 2/4, so 2 × 3 1/4 = 6 2/4 miles (the same as 6 1/2 miles).
      - |
        3 2/4 doubles only the 1/4 and keeps 3. Both the 3 miles and the 1/4 mile are ridden twice.
    answer: 2

  - slug: g5math-u03-check-q17
    type: numeric
    topic_code: "5.NF.B.6"
    source: "IM K–5 Math Grade 5, Unit 3, Section C"
    points: 1
    prompt: |
      A poster is a rectangle 2 1/2 feet wide and 4 feet tall. What is its area in square feet?
    answer: { value: 10, tolerance: 0 }
    explanation: |
      Area = 2 1/2 × 4. 2 × 4 = 8 and 1/2 × 4 = 2, so the area is 8 + 2 = 10 square feet.

  - slug: g5math-u03-check-q18
    type: multiple_choice
    topic_code: "5.NF.B.6"
    source: "IM K–5 Math Grade 5, Unit 3, Section C"
    points: 1
    prompt: |
      Lila's puppy weighs 12 pounds. Her kitten weighs 2/3 as much as the puppy. How much does the kitten weigh?
    options:
      - "18 pounds"
      - "10 pounds"
      - "8 pounds"
      - "4 pounds"
    option_explanations:
      - |
        18 is 3/2 × 12. The kitten weighs 2/3 as much, which is less than the puppy, not more.
      - |
        10 subtracts 2 from 12. "2/3 as much" means multiply: 2/3 × 12.
      - |
        Correct. 1/3 of 12 is 4, so 2/3 of 12 is 8. The kitten weighs 2/3 × 12 = 8 pounds.
      - |
        4 pounds is 1/3 of 12. The kitten weighs 2 thirds, so double it: 8 pounds.
    answer: 2

  # ---- Line plots with fractions (5.MD.B.2)
  - slug: g5math-u03-check-q19
    type: numeric
    topic_code: "5.MD.B.2"
    source: "IM K–5 Math Grade 5, Unit 3, Section C"
    points: 1
    stimulus: |
      Use the line plot "Earthworm Lengths". A class measured earthworms in the school garden. Each X is one earthworm, and the lengths are in inches.
    figure: figures/u03-line-plot-worm-lengths.svg
    figure_alt: "A line plot titled Earthworm Lengths, labeled Length in inches. The marks go up by fourths: 2, 2 1/4, 2 2/4, 2 3/4, 3, 3 1/4 and 3 2/4. The number of Xs above each mark is: 2 has 1, 2 1/4 has 2, 2 2/4 has 0, 2 3/4 has 3, 3 has 2, 3 1/4 has 0 and 3 2/4 has 2. There are 10 Xs in all."
