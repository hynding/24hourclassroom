week: 1
unit: 1
title: "Volume: Filling Space With Unit Cubes"
topics: ["5.MD.C.3", "5.MD.C.4"]
guide: guides/week-01.md
guide_description: |
  What volume measures, why we fill a solid with unit cubes leaving no gaps or overlaps, how to count every
  cube in a picture (the hidden ones too) by counting one layer and the number of layers, and which cubic
  units fit which job.
flashcards_description: |
  19 cards on volume, unit cubes and cubic units, gaps and overlaps, rectangular prisms, counting cubes by
  rows and layers, hidden cubes, and prisms with the same volume but different shapes.

flashcards:
  - front: Volume → what it measures
    back: |
      The amount of space a solid figure takes up. We measure it by counting how many unit cubes fill the figure with no gaps or overlaps.
    topic_code: "5.MD.C.3"
  - front: Unit cube → what it is
    back: |
      A cube whose edges are each 1 unit long. Its volume is 1 cubic unit, and it is the "ruler" we use to measure volume.
    topic_code: "5.MD.C.3"
  - front: Cubic unit → what it is
    back: |
      The unit for volume: the space inside one unit cube. A solid that 20 unit cubes fill has a volume of 20 cubic units.
    topic_code: "5.MD.C.3"
  - front: Gaps and overlaps when packing cubes → why they are not allowed
    back: |
      A gap leaves space that is not counted, and an overlap counts the same space twice. Either way the count is no longer the volume.
    topic_code: "5.MD.C.3"
  - front: Solid figure → what it is
    back: |
      A shape that takes up space in three directions: it has length, width and height. A box, a cube and a ball are solid figures.
    topic_code: "5.MD.C.3"
  - front: Rectangular prism → what it is
    back: |
      A box shape. It has 6 faces that are all rectangles, and every corner is a square corner. A cube is a rectangular prism with all its edges the same length.
    topic_code: "5.MD.C.3"
  - front: Face, edge and vertex of a prism → what each one is
    back: |
      A face is a flat side. An edge is where two faces meet. A vertex is a corner where edges meet. A rectangular prism has 6 faces, 12 edges and 8 vertices.
    topic_code: "5.MD.C.3"
  - front: Cubic centimeter → how big it is
    back: |
      The space inside a cube with 1-centimeter edges, about the size of a base-ten ones block. We use it for small objects like a pencil box.
    topic_code: "5.MD.C.4"
  - front: Cubic inch, cubic foot and cubic meter → when to use each
    back: |
      Cubic inches for small things (a jewelry box), cubic feet for medium things (a toy chest or a fridge), cubic meters for big spaces (a classroom or a truck).
    topic_code: "5.MD.C.4"
  - front: cm³ → how to read it
    back: |
      "Cubic centimeters." The small 3 is a reminder that a cube has three edge directions: length, width and height. 40 cm³ means 40 cubic centimeters.
    topic_code: "5.MD.C.4"
  - front: Layer of cubes → what it is
    back: |
      One flat level of cubes in a prism. A layer 5 cubes long and 3 cubes wide has 3 rows of 5, so 15 cubes.
    topic_code: "5.MD.C.4"
  - front: Counting the cubes in a prism → the fast way
    back: |
      Count the cubes in one layer, then multiply by the number of layers. A layer of 8 cubes with 4 layers is 8 × 4 = 32 cubes.
    topic_code: "5.MD.C.4"
  - front: Hidden cubes in a picture → why they count
    back: |
      A prism is solid all the way through. The cubes behind and under the ones you can see still take up space, so they are part of the volume.
    topic_code: "5.MD.C.4"
  - front: 3 by 3 by 3 cube of small cubes → how many you can see and how many there are
    back: |
      From the front, top and right you can see 19 cubes, but 8 more are hidden inside and behind. There are 27 cubes in all.
    topic_code: "5.MD.C.4"
  - front: Same cubes rearranged → what happens to the volume
    back: |
      It stays the same. 12 cubes in a long flat prism or in a tall tower still take up 12 cubic units of space.
    topic_code: "5.MD.C.3"
  - front: Prism 4 cubes long, 2 cubes wide, 2 cubes high → its volume
    back: |
      Each layer is 2 rows of 4, which is 8 cubes. There are 2 layers, so 8 × 2 = 16 cubic units.
    topic_code: "5.MD.C.4"
  - front: Area and volume → the difference
    back: |
      Area counts unit squares that cover a flat shape (square units). Volume counts unit cubes that fill a solid (cubic units).
    topic_code: "5.MD.C.3"
  - front: Box half filled with 2 layers of cubes → how to find the full volume
    back: |
      If 2 layers fill half the box, the full box holds 4 layers. Find the cubes in one layer and multiply by 4.
    topic_code: "5.MD.C.4"
  - front: Staircase of cubes → how to count it
    back: |
      Count it in columns or in layers. A staircase 2 cubes deep with columns 3, 2 and 1 cubes tall has 2 × (3 + 2 + 1) = 12 cubes.
    topic_code: "5.MD.C.4"

quiz:
  description: |
    14 questions · about 30 minutes · what volume means, unit cubes and cubic units, counting the cubes in a
    prism by layers, hidden cubes, and prisms that have the same volume. Multiple choice, select-all, true/false
    and number answers are graded at once; the fill-in word is matched automatically; the short answer is
    checked by your teacher.
  questions:
    - slug: g5math-w01-q01
      type: multiple_choice
      topic_code: "5.MD.C.3"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      prompt: |
        Which of these tells you the volume of a box?
      options:
        - "The number of unit cubes that fill the box with no gaps or overlaps"
        - "The number of unit squares that cover the bottom of the box"
        - "The distance all the way around the bottom of the box"
        - "The length of the longest edge of the box"
      option_explanations:
        - |
          Correct. Volume is the space inside a solid, and we measure it by counting the unit cubes that fill it exactly.
        - |
          Unit squares on the bottom give the area of the bottom. That is only one layer's worth; the box also has height.
        - |
          The distance around the bottom is a perimeter, a length. Volume measures space, not a distance.
        - |
          One edge is a length in one direction. Volume uses length, width and height together.
      answer: 0

    - slug: g5math-w01-q02
      type: numeric
      topic_code: "5.MD.C.4"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      figure: figures/w01-prism-4x2x3.svg
      figure_alt: "A rectangular prism built from unit cubes, 4 cubes long, 2 cubes wide and 3 cubes high. The front shows 3 rows of 4 cubes, the top shows 2 rows of 4 cubes, and the right side shows 3 rows of 2 cubes. Some cubes are hidden at the back."
      prompt: |
        The prism is built from unit cubes, with no gaps inside. What is its volume in cubic units?
      answer: { value: 24, tolerance: 0 }
      explanation: |
        Each layer is 2 rows of 4 cubes, so 8 cubes. There are 3 layers: 8 × 3 = 24 cubic units. The cubes in the back row count even though most of them are hidden.

    - slug: g5math-w01-q03
      type: multiple_choice
      topic_code: "5.MD.C.4"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      figure: figures/w01-layer-5x3.svg
      figure_alt: "One flat layer of unit cubes, 5 cubes long and 3 cubes wide, so 3 rows of 5 cubes."
      prompt: |
        The picture shows the bottom layer of cubes in a box. The box holds 4 layers just like it. How many unit cubes fill the box?
      options:
        - "19 cubic units"
        - "12 cubic units"
        - "60 cubic units"
        - "15 cubic units"
      option_explanations:
        - |
          19 is 15 + 4. The box has 4 layers of 15 cubes, so we multiply by 4 instead of adding 4.
        - |
          12 is 5 + 3 + 4, which adds the edge counts. The layer alone already has 15 cubes.
        - |
          Correct. One layer is 3 rows of 5, or 15 cubes. Four layers hold 15 × 4 = 60 cubes, so the volume is 60 cubic units.
        - |
          15 is the number of cubes in one layer. The box holds 4 of these layers.
      answer: 2

    - slug: g5math-w01-q04
      type: multiple_choice
      topic_code: "5.MD.C.4"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      figure: figures/w01-two-shapes.svg
      figure_alt: "Two prisms built from unit cubes. Prism A is 6 cubes long, 2 cubes wide and 1 cube high. Prism B is 3 cubes long, 2 cubes wide and 2 cubes high."
      prompt: |
        Which sentence about prisms A and B is true?
      options:
        - "A has the greater volume, because it is longer."
        - "Both have a volume of 12 cubic units."
        - "B has the greater volume, because it is taller."
        - "Prisms with different shapes cannot be compared."
      option_explanations:
        - |
          A is longer, but it is only 1 cube high. Count them: A has 2 rows of 6, which is 12 cubes, the same as B.
        - |
          Correct. A has 1 layer of 2 rows of 6, so 12 cubes. B has 2 layers of 2 rows of 3, so 6 × 2 = 12 cubes.
        - |
          B is taller but shorter in length. B has 2 layers of 6 cubes, which is 12, the same as A's 12.
        - |
          We can compare any two solids by counting their unit cubes. Here both counts are 12.
      answer: 1

    - slug: g5math-w01-q05
      type: numeric
      topic_code: "5.MD.C.4"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      figure: figures/w01-staircase.svg
      figure_alt: "A staircase built from unit cubes, 3 cubes deep from front to back. From left to right its columns are 3 cubes tall, 2 cubes tall and 1 cube tall. Every space under a top cube is filled with cubes."
      prompt: |
        The staircase is built from unit cubes, with no gaps inside. How many unit cubes are in the staircase?
      answer: { value: 18, tolerance: 0 }
      explanation: |
        The front shows 3 + 2 + 1 = 6 cubes. The staircase is 3 cubes deep, so there are 3 copies of that front slice: 6 × 3 = 18 cubes.

    - slug: g5math-w01-q06
      type: true_false
      topic_code: "5.MD.C.3"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      prompt: |
        True or false: Omar packs a box with unit cubes but leaves gaps between some of them. The number of cubes he used is still the volume of the box.
      answer: false
      explanation: |
        False. The gaps are space inside the box that no cube is counting, so Omar's count is less than the volume. To measure volume, the cubes must fill the box with no gaps and no overlaps.

    - slug: g5math-w01-q07
      type: fill_blank
      topic_code: "5.MD.C.3"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      prompt: |
        The amount of space a solid figure takes up is called its ____.
      answer: ["volume", "the volume"]
      explanation: |
        Volume. We measure it in cubic units by counting the unit cubes that fill the figure.

    - slug: g5math-w01-q08
      type: multiple_choice
      topic_code: "5.MD.C.3"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      prompt: |
        The class wants to measure the volume of their classroom. Which unit makes the most sense?
      options:
        - "Meters"
        - "Square meters"
        - "Cubic centimeters"
        - "Cubic meters"
      option_explanations:
        - |
          Meters measure length, like how long one wall is. Volume needs a cubic unit that fills space.
        - |
          Square meters measure area, like the floor. The room also has height, so we need cubic units.
        - |
          Cubic centimeters are a volume unit, but they are tiny. Millions of them would fit in a classroom, so the count would be huge.
        - |
          Correct. A cubic meter is a cube with 1-meter edges, a good size for measuring a whole room.
      answer: 3

    - slug: g5math-w01-q09
      type: multi_select
      topic_code: "5.MD.C.4"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 2
      partial_credit: true
      prompt: |
        Each prism is built from unit cubes. Select all the prisms that have a volume of 24 cubic units.
      options:
        - "2 cubes long, 3 cubes wide, 4 cubes high"
        - "3 cubes long, 3 cubes wide, 3 cubes high"
        - "8 cubes long, 3 cubes wide, 1 cube high"
        - "4 cubes long, 2 cubes wide, 4 cubes high"
        - "6 cubes long, 4 cubes wide, 1 cube high"
      option_explanations:
        - |
          Yes. A layer is 3 rows of 2, which is 6 cubes, and there are 4 layers: 6 × 4 = 24.
        - |
          No. A layer is 3 rows of 3, which is 9 cubes, and 3 layers make 27 cubes.
        - |
          Yes. There is just 1 layer, and it has 3 rows of 8, which is 24 cubes.
        - |
          No. A layer is 2 rows of 4, which is 8 cubes, and 4 layers make 32 cubes.
        - |
          Yes. There is 1 layer with 4 rows of 6, which is 24 cubes.
      answer: [0, 2, 4]

    - slug: g5math-w01-q10
      type: multiple_choice
      topic_code: "5.MD.C.4"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      prompt: |
        Amara packs a box with unit cubes. The bottom layer has 4 rows of 6 cubes. She fills the box with 3 layers. How many cubes does she use?
      options:
        - "13"
        - "24"
        - "72"
        - "27"
      option_explanations:
        - |
          13 is 4 + 6 + 3. The numbers tell us rows, cubes in a row and layers, so we multiply them.
        - |
          24 cubes is one layer: 4 rows of 6. The box has 3 of these layers.
        - |
          Correct. One layer is 4 × 6 = 24 cubes. Three layers are 24 × 3 = 72 cubes.
        - |
          27 is 24 + 3. There are 3 whole layers of 24 cubes, not 3 extra cubes.
      answer: 2

    - slug: g5math-w01-q11
      type: numeric
      topic_code: "5.MD.C.4"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      prompt: |
        Kofi builds a rectangular prism from 36 unit cubes. It has 3 layers, and every layer has the same number of cubes. How many cubes are in each layer?
      answer: { value: 12, tolerance: 0 }
      explanation: |
        3 layers with the same number of cubes make 36 in all. 3 × 12 = 36, so each layer has 12 cubes (36 ÷ 3 = 12).

    - slug: g5math-w01-q12
      type: multiple_choice
      topic_code: "5.MD.C.3"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      prompt: |
        Jada builds a prism with 16 unit cubes. Then she takes it apart and uses all 16 cubes to build a taller prism. What is the volume of the taller prism?
      options:
        - "More than 16 cubic units, because it is taller"
        - "16 cubic units"
        - "Less than 16 cubic units, because it is thinner"
        - "We cannot tell without measuring it again"
      option_explanations:
        - |
          Being taller does not add cubes. She used the same 16 cubes, so the space they take up is the same.
        - |
          Correct. Volume counts the unit cubes. The same 16 cubes take up 16 cubic units of space in any arrangement.
        - |
          The new prism is thinner but taller, and no cubes were removed. The count is still 16.
        - |
          We already know the count: all 16 cubes were used with none added or removed, so the volume is 16 cubic units.
      answer: 1

    - slug: g5math-w01-q13
      type: multiple_choice
      topic_code: "5.MD.C.4"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      figure: figures/w01-cube-3x3x3.svg
      figure_alt: "A large cube built from small unit cubes, 3 cubes long, 3 cubes wide and 3 cubes high. You can see 9 cubes on the front, 9 on the top and 9 on the right side, and some cubes sit on two or three of these faces."
      prompt: |
        Maya counts the small cubes she can see in the picture and gets 19. What is the volume of the large cube?
      options:
        - "27 cubic units"
        - "19 cubic units"
        - "9 cubic units"
        - "18 cubic units"
      option_explanations:
        - |
          Correct. Each layer is 3 rows of 3, which is 9 cubes, and there are 3 layers: 9 × 3 = 27. Eight cubes are hidden inside and at the back.
        - |
          19 is only the cubes Maya can see. The large cube is solid, so the 8 hidden cubes count too: 19 + 8 = 27.
        - |
          9 is the cubes on one face, or one layer. There are 3 layers of 9.
        - |
          18 is 2 layers of 9. The large cube has 3 layers.
      answer: 0

    - slug: g5math-w01-q14
      type: short_answer
      topic_code: "5.MD.C.4"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 2
      prompt: |
        Sofia has 18 unit cubes. She wants to build rectangular prisms that use all 18 cubes.

        (a) Describe two different prisms she could build. Give the length, width and height of each, in cubes.
        (b) What is the volume of each prism? Explain how you know.
      answer: |
        (a) For example, 3 cubes long, 3 cubes wide and 2 cubes high, and 6 cubes long, 3 cubes wide and 1 cube high. (Others: 9 by 2 by 1, 18 by 1 by 1.)
        (b) Both have a volume of 18 cubic units. Each uses all 18 cubes with no gaps, and the volume is the number of unit cubes: 3 × 3 = 9 in a layer, 2 layers make 18; 6 × 3 = 18 in one layer.
      explanation: |
        Two points.

        (a) 1 pt: two different prisms whose length × width × height is 18 (such as 3 by 3 by 2, 6 by 3 by 1, 9 by 2 by 1, 18 by 1 by 1). A prism and the same one turned on its side count as one.

        (b) 1 pt: says both volumes are 18 cubic units and explains that the same 18 cubes fill each one (or counts layers to get 18).
