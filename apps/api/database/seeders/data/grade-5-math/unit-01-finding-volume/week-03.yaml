week: 3
unit: 1
title: "Volume of Composite Solids"
topics: ["5.MD.C.5"]
guide: guides/week-03.md
guide_description: |
  How to find the volume of a solid built from two rectangular prisms: split it into prisms that do not
  overlap, find each volume, and add. Splitting two ways to check, finding a missing edge from the labels,
  taking a piece away, and solving real problems with planters, tanks and stages.
flashcards_description: |
  18 cards on composite solids, splitting and adding volumes, checking by splitting another way, finding
  hidden edge lengths, taking away a missing piece, and volume word problems with tanks, planters and boxes.

flashcards:
  - front: Composite solid → what it is
    back: |
      A solid figure made of two or more rectangular prisms put together, like an L-shaped planter or a step.
    topic_code: "5.MD.C.5"
  - front: Volume of a composite solid → the three steps
    back: |
      1. Split it into rectangular prisms that do not overlap. 2. Find the volume of each prism. 3. Add the volumes.
    topic_code: "5.MD.C.5"
  - front: Volume is additive → what that means
    back: |
      The volume of the whole solid is the sum of the volumes of its parts, as long as the parts do not overlap.
    topic_code: "5.MD.C.5"
  - front: Splitting a composite solid → is there only one way?
    back: |
      No. You can often cut it straight down or straight across. Every correct split gives the same total volume.
    topic_code: "5.MD.C.5"
  - front: Checking a composite volume → a good habit
    back: |
      Split the solid a second way and add again. If both totals match, your answer is very likely right.
    topic_code: "5.MD.C.5"
  - front: Overlapping parts → what goes wrong
    back: |
      If two parts share some space, that space is counted twice and the total is too big. Make the cut so each cube belongs to just one part.
    topic_code: "5.MD.C.5"
  - front: Edge with no label on a composite solid → how to find it
    back: |
      Use the labeled edges that line up with it. If the whole solid is 9 m long and one part is 4 m long, the other part is 9 − 4 = 5 m long.
    topic_code: "5.MD.C.5"
  - front: Missing height of the top part → how to find it
    back: |
      Subtract heights. If the tall side is 7 ft and the bottom part is 3 ft tall, the top part is 7 − 3 = 4 ft tall.
    topic_code: "5.MD.C.5"
  - front: Taking a piece away → when to subtract volumes
    back: |
      When a solid is a big box with a corner missing, find the volume of the big box and subtract the volume of the missing piece.
    topic_code: "5.MD.C.5"
  - front: Adding or multiplying the two volumes → which one?
    back: |
      Add. Two parts of 30 and 12 cubic units fill 30 + 12 = 42 cubic units. Multiplying 30 × 12 would count far too many cubes.
    topic_code: "5.MD.C.5"
  - front: L-shaped solid of two blocks, 3 × 2 × 6 and 4 × 2 × 2 → its volume
    back: |
      36 cubic units and 16 cubic units, so 36 + 16 = 52 cubic units.
    topic_code: "5.MD.C.5"
  - front: Water in a tank that is not full → which height to use
    back: |
      Use the height of the water, not the height of the tank. A tank 40 cm by 20 cm filled 10 cm deep holds 40 × 20 × 10 = 8,000 cubic centimeters of water.
    topic_code: "5.MD.C.5"
  - front: Soil for a garden bed → is it volume?
    back: |
      Yes. Soil fills the bed, so we need its volume: length × width × depth. A bed 6 ft by 3 ft filled 2 ft deep needs 36 cubic feet.
    topic_code: "5.MD.C.5"
  - front: How many 1-foot cube boxes fit in a space 5 ft by 4 ft by 3 ft → the answer
    back: |
      5 × 4 × 3 = 60 boxes, because each box is 1 cubic foot and the space is 60 cubic feet.
    topic_code: "5.MD.C.5"
  - front: Missing part of a total volume → how to find it
    back: |
      Subtract. If two parts make 100 cubic inches and one part is 64 cubic inches, the other is 100 − 64 = 36 cubic inches.
    topic_code: "5.MD.C.5"
  - front: Two stacked boxes, 6 × 4 × 2 and 2 × 4 × 3 → the total volume
    back: |
      48 + 24 = 72 cubic units.
    topic_code: "5.MD.C.5"
  - front: Expression for a composite volume → how to write it
    back: |
      Put each part's volume in parentheses and add: (5 × 3 × 2) + (2 × 3 × 4). The parentheses keep each part together.
    topic_code: "5.MD.C.5"
  - front: Labels on a composite picture → which edges belong to which part
    back: |
      Trace each part with your finger and name its length, width and height before multiplying. Edges going back (the depth) are often shared by both parts.
    topic_code: "5.MD.C.5"

quiz:
  description: |
    14 questions · about 30 minutes · the volume of solids made of two rectangular prisms, splitting a solid
    two ways, missing edge lengths, taking a piece away and volume word problems, with review of unit cubes,
    counting cubes and expressions from weeks 1 and 2. Multiple choice, select-all, true/false and number
    answers are graded at once; the fill-in word is matched automatically; the short answer is checked by
    your teacher.
  questions:
    - slug: g5math-w03-q01
      type: numeric
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section C"
      points: 1
      stimulus: |
        Use the L-shaped solid. It is made of two rectangular prisms with no gaps. The whole solid is 8 ft long, 3 ft deep and 6 ft tall at its tall end. The tall part is 3 ft long. The short part is 2 ft tall.
      figure: figures/w03-l-solid.svg
      figure_alt: "An L-shaped solid seen from the front. The bottom edge is labeled 8 ft. The left side, the tall part, is labeled 6 ft high, and the top of the tall part is labeled 3 ft long. The short part on the right is labeled 2 ft high, and the edge going back on the bottom right is labeled 3 ft."
      prompt: |
        What is the volume of the whole solid in cubic feet?
      answer: { value: 84, tolerance: 0 }
      explanation: |
        Cut straight down where the parts meet. The tall part is 3 × 3 × 6 = 54 cubic feet. The short part is 8 − 3 = 5 ft long, so it is 5 × 3 × 2 = 30 cubic feet. 54 + 30 = 84 cubic feet.

    - slug: g5math-w03-q02
      type: multiple_choice
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section C"
      points: 1
      stimulus: |
        Use the L-shaped solid. It is made of two rectangular prisms with no gaps. The whole solid is 8 ft long, 3 ft deep and 6 ft tall at its tall end. The tall part is 3 ft long. The short part is 2 ft tall.
      prompt: |
        Kiara cuts the solid straight across into a bottom slab, 8 ft long and 2 ft tall, and a block on top of it. Which expression matches her way?
      options:
        - "(8 × 3 × 2) + (3 × 3 × 6)"
        - "8 × 3 × 6"
        - "(8 × 3 × 2) + (3 × 3 × 4)"
        - "(3 × 3 × 6) + (8 × 3 × 6)"
      option_explanations:
        - |
          The block on top is not 6 ft tall: the slab already uses the bottom 2 ft, so the block is 6 − 2 = 4 ft tall. Using 6 counts the bottom of the tall part twice.
        - |
          8 × 3 × 6 is a full box 8 ft long and 6 ft tall. The solid has an empty space above the short part, so this is too much.
        - |
          Correct. The slab is 8 × 3 × 2 = 48 cubic feet. The block on top is 3 ft long, 3 ft deep and 6 − 2 = 4 ft tall: 36 cubic feet. 48 + 36 = 84.
        - |
          8 × 3 × 6 is already more than the whole solid, and adding the tall part counts it twice.
      answer: 2

    - slug: g5math-w03-q03
      type: numeric
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section C"
      points: 1
      figure: figures/w03-cube-composite.svg
      figure_alt: "A solid built from unit cubes in two parts. The bottom part is 5 cubes long, 2 cubes deep and 2 cubes high. On top of its left end sits a second part 2 cubes long, 2 cubes deep and 2 cubes high, so the left end is 4 cubes tall."
      prompt: |
        The solid is built from unit cubes with no gaps. What is its volume in cubic units?
      answer: { value: 28, tolerance: 0 }
      explanation: |
        The bottom part is 5 × 2 × 2 = 20 cubes. The part on top is 2 × 2 × 2 = 8 cubes. 20 + 8 = 28 cubic units.

    - slug: g5math-w03-q04
      type: multiple_choice
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section C"
      points: 1
      prompt: |
        A school garden bed is made of two rectangular boxes. One box is 6 ft long, 2 ft wide and 1 ft deep. The other is 3 ft long, 2 ft wide and 1 ft deep. How many cubic feet of soil fill both boxes?
      options:
        - "18 cubic feet"
        - "72 cubic feet"
        - "15 cubic feet"
        - "12 cubic feet"
      option_explanations:
        - |
          Correct. The first box holds 6 × 2 × 1 = 12 cubic feet and the second holds 3 × 2 × 1 = 6 cubic feet. 12 + 6 = 18.
        - |
          72 is 12 × 6, which multiplies the two volumes. To combine two parts, add their volumes.
        - |
          15 adds all six edge lengths. Find each box's volume by multiplying, then add the two volumes.
        - |
          12 cubic feet fills only the first box. The second box needs 6 more cubic feet.
      answer: 0

    - slug: g5math-w03-q05
      type: multiple_choice
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section C"
      points: 1
      prompt: |
        A solid made of two boxes has a total volume of 100 cubic centimeters. One box has a volume of 60 cubic centimeters. The other box has a base 4 cm by 5 cm. How tall is the other box?
      options:
        - "40 cm"
        - "8 cm"
        - "5 cm"
        - "2 cm"
      option_explanations:
        - |
          40 cubic centimeters is the volume of the other box (100 − 60). Its height is how many layers of 20 make 40.
        - |
          8 is 40 ÷ 5, which uses only one edge of the base. The base area is 4 × 5 = 20 square centimeters.
        - |
          5 is 100 ÷ 20, which uses the total volume. Only 40 cubic centimeters belong to the other box.
        - |
          Correct. The other box is 100 − 60 = 40 cubic centimeters. Its base is 4 × 5 = 20 square centimeters, and 20 × 2 = 40, so it is 2 cm tall.
      answer: 3

    - slug: g5math-w03-q06
      type: true_false
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section C"
      points: 1
      prompt: |
        True or false: to find the volume of a solid made of two prisms, you multiply the volumes of the two prisms.
      answer: false
      explanation: |
        False. The parts fill different spaces, so their volumes are added. Parts of 20 and 8 cubic units make 20 + 8 = 28 cubic units, not 20 × 8 = 160.

    - slug: g5math-w03-q07
      type: fill_blank
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section C"
      points: 1
      prompt: |
        A solid figure made of two or more rectangular prisms put together is called a ____ solid.
      answer: ["composite", "a composite"]
      explanation: |
        Composite. To find its volume, split it into rectangular prisms that do not overlap and add their volumes.

    - slug: g5math-w03-q08
      type: multi_select
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section C"
      points: 2
      partial_credit: true
      figure: figures/w03-step-block.svg
      figure_alt: "A step-shaped solid seen from the front. The bottom edge is labeled 7 cm. The low part on the left is labeled 2 cm high. The tall part on the right is labeled 5 cm high, and its top edge is labeled 3 cm long. The edge going back on the bottom right is labeled 2 cm."
      prompt: |
        The solid is made of two rectangular prisms. The low part is 4 cm long. Select all the expressions that give the volume of the solid in cubic centimeters.
      options:
        - "(4 × 2 × 2) + (3 × 2 × 5)"
        - "(7 × 2 × 2) + (3 × 2 × 3)"
        - "7 × 2 × 5"
        - "(7 × 2 × 2) + (3 × 2 × 5)"
        - "(7 × 2 × 5) − (4 × 2 × 3)"
      option_explanations:
        - |
          Yes. Cut straight down: the low part is 4 × 2 × 2 = 16 and the tall part is 3 × 2 × 5 = 30. 16 + 30 = 46.
        - |
          Yes. Cut straight across: the bottom slab is 7 × 2 × 2 = 28 and the block on top is 3 × 2 × (5 − 2) = 18. 28 + 18 = 46.
        - |
          No. 7 × 2 × 5 = 70 is a full box 5 cm tall all the way across. The space above the low part is empty.
        - |
          No. The slab and the full tall part overlap in the bottom 2 cm of the tall part, so that space is counted twice: 28 + 30 = 58.
        - |
          Yes. The full box is 70, and the empty space above the low part is 4 × 2 × 3 = 24. 70 − 24 = 46.
      answer: [0, 1, 4]

    - slug: g5math-w03-q09
      type: multiple_choice
      topic_code: "5.MD.C.3"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      prompt: |
        What is the volume of a cube whose edges are each 1 foot long?
      options:
        - "1 square foot"
        - "1 cubic foot"
        - "3 cubic feet"
        - "12 cubic feet"
      option_explanations:
        - |
          Square feet measure area, like one face of the cube. The cube fills space, so its volume is in cubic feet.
        - |
          Correct. A cube with 1-foot edges is the unit cube for feet, so its volume is 1 cubic foot.
        - |
          3 comes from adding the length, width and height. 1 × 1 × 1 = 1, so the volume is 1 cubic foot.
        - |
          12 is the number of edges a cube has, not its volume. Its volume is 1 × 1 × 1 = 1 cubic foot.
      answer: 1

    - slug: g5math-w03-q10
      type: multiple_choice
      topic_code: "5.OA.A.2"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      prompt: |
        Which story matches the expression 2 × (12 + 18)?
      options:
        - "Ana has 12 cubes. She gets 18 more and then gives 2 away. How many cubes does she have?"
        - "Ana has 2 boxes of 12 cubes and 18 loose cubes. How many cubes does she have?"
        - "Ana has 18 boxes with 12 cubes in each, plus 2 more cubes. How many cubes does she have?"
        - "Ana has 2 boxes. Each box holds 12 red cubes and 18 blue cubes. How many cubes does she have?"
      option_explanations:
        - |
          This story is 12 + 18 − 2. Nothing is multiplied by 2.
        - |
          This story is (2 × 12) + 18. Only the 12 is doubled, not the 18.
        - |
          This story is (18 × 12) + 2. The expression multiplies the sum 12 + 18 by 2.
        - |
          Correct. Each box holds 12 + 18 cubes, and there are 2 boxes, so 2 × (12 + 18).
      answer: 3

    - slug: g5math-w03-q11
      type: numeric
      topic_code: "5.MD.C.4"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      prompt: |
        A box holds 5 layers of unit cubes. Each layer has 2 rows of 6 cubes. How many unit cubes fill the box?
      answer: { value: 60, tolerance: 0 }
      explanation: |
        One layer is 2 × 6 = 12 cubes. Five layers are 12 × 5 = 60 cubes.

    - slug: g5math-w03-q12
      type: numeric
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section C"
      points: 1
      prompt: |
        A fish tank is 50 cm long, 20 cm wide and 30 cm tall. Ravi fills it with water to a height of 25 cm. How many cubic centimeters of water are in the tank? (Type the digits without a comma.)
      answer: { value: 25000, tolerance: 0 }
      explanation: |
        Use the height of the water, 25 cm, not the tank's 30 cm. The base is 50 × 20 = 1,000 square centimeters, and 1,000 × 25 = 25,000 cubic centimeters.

    - slug: g5math-w03-q13
      type: multiple_choice
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section C"
      points: 1
      prompt: |
        A wooden block is 6 inches long, 4 inches wide and 4 inches tall. A carpenter cuts a smaller block out of one corner. The piece cut out is 2 inches long, 2 inches wide and 4 inches tall. What is the volume of the block that is left?
      options:
        - "80 cubic inches"
        - "96 cubic inches"
        - "112 cubic inches"
        - "16 cubic inches"
      option_explanations:
        - |
          Correct. The whole block was 6 × 4 × 4 = 96 cubic inches. The piece cut out is 2 × 2 × 4 = 16 cubic inches. 96 − 16 = 80.
        - |
          96 cubic inches is the block before the cut. The cut-out piece must be taken away.
        - |
          112 is 96 + 16, which adds the missing piece instead of taking it away.
        - |
          16 cubic inches is the piece that was cut out, not the block that is left.
      answer: 0

    - slug: g5math-w03-q14
      type: short_answer
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section C"
      points: 2
      prompt: |
        Nadia builds a step for the school stage from two wooden blocks. The bottom block is 5 ft long, 3 ft wide and 1 ft tall. The top block is 2 ft long, 3 ft wide and 1 ft tall, and it sits on the bottom block.

        (a) What is the volume of each block?
        (b) What is the volume of the whole step? Explain why you add.
      answer: |
        (a) Bottom block: 5 × 3 × 1 = 15 cubic feet. Top block: 2 × 3 × 1 = 6 cubic feet.
        (b) 15 + 6 = 21 cubic feet. The blocks fill different spaces and do not overlap, so the space of the whole step is the two volumes added together.
      explanation: |
        Two points.

        (a) 1 pt: both volumes, 15 cubic feet and 6 cubic feet.

        (b) 1 pt: 21 cubic feet with a reason such as "the blocks don't overlap, so the volumes add." Give this point for a correct sum of wrong volumes from (a).
