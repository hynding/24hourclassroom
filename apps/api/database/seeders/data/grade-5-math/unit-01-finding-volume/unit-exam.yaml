unit: 1
description: |
  20 questions · about 40 minutes · every standard of Unit 1: what volume means, unit cubes and cubic units,
  counting the cubes in a prism (hidden ones too), the formulas length × width × height and base area ×
  height, missing edge lengths, the volume of solids made of two prisms, and writing and reading expressions
  with parentheses. Two sets of questions share a picture. Multiple choice, select-all, true/false and number
  answers are graded at once; the fill-in word is matched automatically; the short answer is checked by your
  teacher against the scoring notes.
questions:
  # ---- Stimulus set: a prism of unit cubes (5.MD.C.4)
  - slug: g5math-u01-check-q01
    type: multiple_choice
    topic_code: "5.MD.C.4"
    source: "IM K–5 Math Grade 5, Unit 1, Section A"
    points: 1
    stimulus: |
      Use the prism built from unit cubes, with no gaps inside. It is 5 cubes long, 3 cubes wide and 3 cubes high.
    figure: figures/u01-prism-5x3x3.svg
    figure_alt: "A rectangular prism built from unit cubes, 5 cubes long, 3 cubes wide and 3 cubes high. The front shows 3 rows of 5 cubes, the top shows 3 rows of 5 cubes, and the right side shows 3 rows of 3 cubes. Some cubes are hidden inside and at the back."
    prompt: |
      How many cubes are in the bottom layer of the prism?
    options:
      - "15"
      - "5"
      - "9"
      - "8"
    option_explanations:
      - |
        Correct. The bottom layer has 3 rows of 5 cubes, and 3 × 5 = 15. Most of them are hidden under the layers above.
      - |
        5 is the number of cubes in one row along the front. The layer has 3 rows of 5.
      - |
        9 is the cubes on the right side, 3 rows of 3. A layer lies flat and is 5 cubes long and 3 cubes wide.
      - |
        8 is 5 + 3. The layer has 3 rows with 5 cubes in each, so we multiply.
    answer: 0

  - slug: g5math-u01-check-q02
    type: numeric
    topic_code: "5.MD.C.4"
    source: "IM K–5 Math Grade 5, Unit 1, Section A"
    points: 1
    stimulus: |
      Use the prism built from unit cubes, with no gaps inside. It is 5 cubes long, 3 cubes wide and 3 cubes high.
    prompt: |
      What is the volume of the prism in cubic units?
    answer: { value: 45, tolerance: 0 }
    explanation: |
      Each layer has 15 cubes and there are 3 layers: 15 × 3 = 45 cubic units.

  # ---- What volume means (5.MD.C.3)
  - slug: g5math-u01-check-q03
    type: multiple_choice
    topic_code: "5.MD.C.3"
    source: "IM K–5 Math Grade 5, Unit 1, Section A"
    points: 1
    prompt: |
      A jewelry box has a volume of 36 cubic inches. What does that tell you?
    options:
      - "The edges of the box add up to 36 inches."
      - "36 squares with 1-inch sides cover the bottom of the box."
      - "36 cubes with 1-inch edges would fill the box with no gaps or overlaps."
      - "The box is 36 inches tall."
    option_explanations:
      - |
        Adding edges gives a length. Volume tells how much space is inside the box.
      - |
        Squares on the bottom measure the area of the base, which is only one layer. Volume counts every layer.
      - |
        Correct. A cubic inch is the space of one cube with 1-inch edges, so 36 of them fill the box.
      - |
        Height is one length. Volume uses length, width and height together.
    answer: 2

  - slug: g5math-u01-check-q04
    type: true_false
    topic_code: "5.MD.C.5"
    source: "IM K–5 Math Grade 5, Unit 1, Section B"
    points: 1
    prompt: |
      True or false: a cube with edges 2 centimeters long has a volume of 6 cubic centimeters.
    answer: false
    explanation: |
      False. 6 is 2 + 2 + 2. The volume is 2 × 2 × 2 = 4 × 2 = 8 cubic centimeters: a layer of 4 cubes, 2 layers high.

  - slug: g5math-u01-check-q05
    type: fill_blank
    topic_code: "5.MD.C.3"
    source: "IM K–5 Math Grade 5, Unit 1, Section A"
    points: 1
    prompt: |
      Volume is measured in ____ units, such as cubic centimeters or cubic feet.
    answer: ["cubic"]
    explanation: |
      Cubic. A cubic unit is the space inside a unit cube, a cube whose edges are each 1 unit long.

  - slug: g5math-u01-check-q06
    type: multiple_choice
    topic_code: "5.MD.C.4"
    source: "IM K–5 Math Grade 5, Unit 1, Section A"
    points: 1
    figure: figures/u01-cube-layers.svg
    figure_alt: "A solid built from unit cubes in two layers. The bottom layer is 4 cubes long and 3 cubes deep. The top layer covers only the left half: 2 cubes long and 3 cubes deep."
    prompt: |
      The solid is built from unit cubes with no gaps inside. How many unit cubes are in the solid?
    options:
      - "12"
      - "18"
      - "24"
      - "14"
    option_explanations:
      - |
        12 is only the bottom layer, 3 rows of 4. The top layer adds 3 rows of 2 more cubes.
      - |
        Correct. The bottom layer has 3 × 4 = 12 cubes and the top layer has 3 × 2 = 6 cubes. 12 + 6 = 18.
      - |
        24 would be two full layers of 12. The top layer covers only half of the bottom, so it has 6 cubes.
      - |
        14 is the number of cubes you can see. Four cubes in the bottom layer are hidden under the top layer, and they count too.
    answer: 1

  # ---- Volume formulas (5.MD.C.5)
  - slug: g5math-u01-check-q07
    type: numeric
    topic_code: "5.MD.C.5"
    source: "IM K–5 Math Grade 5, Unit 1, Section B"
    points: 1
    figure: figures/u01-aquarium.svg
    figure_alt: "An aquarium shaped like a rectangular prism, drawn as a solid box. The bottom front edge is labeled 60 cm, the left front edge (the height) is labeled 40 cm, and the bottom edge going back on the right is labeled 30 cm."
    prompt: |
      What is the volume of the aquarium in cubic centimeters? (Type the digits without a comma.)
    answer: { value: 72000, tolerance: 0 }
    explanation: |
      V = length × width × height = 60 × 30 × 40. The base is 60 × 30 = 1,800 square centimeters, and 1,800 × 40 = 72,000 cubic centimeters.

  - slug: g5math-u01-check-q08
    type: multiple_choice
    topic_code: "5.MD.C.5"
    source: "IM K–5 Math Grade 5, Unit 1, Section B"
    points: 1
    prompt: |
      The base of a storage shed has an area of 24 square meters. The shed is 5 meters tall and shaped like a rectangular prism. What is its volume?
    options:
      - "29 cubic meters"
      - "24 cubic meters"
      - "120 square meters"
      - "120 cubic meters"
    option_explanations:
      - |
        29 is 24 + 5. The base area tells how many cubes fit in one layer, and the height tells how many layers, so multiply.
      - |
        24 cubic meters is only one layer, 1 meter tall. The shed is 5 layers tall.
      - |
        24 × 5 = 120 is right, but volume is in cubic meters. Square meters measure area.
      - |
        Correct. V = base area × height = 24 × 5 = 120 cubic meters.
    answer: 3

  - slug: g5math-u01-check-q09
    type: multiple_choice
    topic_code: "5.MD.C.5"
    source: "IM K–5 Math Grade 5, Unit 1, Section B"
    points: 1
    prompt: |
      A box has a volume of 90 cubic inches. It is 5 inches long and 3 inches wide. How tall is it?
    options:
      - "6 inches"
      - "82 inches"
      - "18 inches"
      - "15 inches"
    option_explanations:
      - |
        Correct. The base is 5 × 3 = 15 square inches, and 15 × 6 = 90, so the box is 6 inches tall.
      - |
        82 is 90 − 5 − 3. Volume comes from multiplying, so find what number times the base area makes 90.
      - |
        18 is 90 ÷ 5, which uses only the length. Divide by the whole base area, 15.
      - |
        15 square inches is the base area. The height is the number of layers of 15 that make 90.
    answer: 0

  - slug: g5math-u01-check-q10
    type: multi_select
    topic_code: "5.MD.C.5"
    source: "IM K–5 Math Grade 5, Unit 1, Section B"
    points: 2
    partial_credit: true
    prompt: |
      Select all the boxes that have a volume of 36 cubic feet.
    options:
      - "4 ft by 4 ft by 2 ft"
      - "3 ft by 3 ft by 4 ft"
      - "12 ft by 3 ft by 1 ft"
      - "6 ft by 2 ft by 2 ft"
      - "9 ft by 2 ft by 2 ft"
    option_explanations:
      - |
        No. The base is 4 × 4 = 16 square feet, and 16 × 2 = 32 cubic feet, not 36.
      - |
        Yes. The base is 3 × 3 = 9 square feet, and 9 × 4 = 36 cubic feet.
      - |
        Yes. The base is 12 × 3 = 36 square feet, and 1 layer of it is 36 cubic feet.
      - |
        No. The base is 6 × 2 = 12 square feet, and 12 × 2 = 24 cubic feet, not 36.
      - |
        Yes. The base is 9 × 2 = 18 square feet, and 18 × 2 = 36 cubic feet.
    answer: [1, 2, 4]

  # ---- Expressions (5.OA.A.2)
  - slug: g5math-u01-check-q11
    type: multiple_choice
    topic_code: "5.OA.A.2"
    source: "IM K–5 Math Grade 5, Unit 1, Section B"
    points: 1
    prompt: |
      Which expression means "multiply 9 by 4, then add 7"?
    options:
      - "9 × (4 + 7)"
      - "(9 + 7) × 4"
      - "(9 × 4) + 7"
      - "9 + 4 × 7"
    option_explanations:
      - |
        The parentheses here make 4 + 7 happen first, so this adds before it multiplies. The words say to multiply first.
      - |
        This adds 9 and 7 first and then multiplies by 4. The words say to multiply 9 by 4 first.
      - |
        Correct. 9 × 4 is grouped and done first, then 7 is added.
      - |
        This multiplies 4 × 7 and adds 9. The words multiply 9 by 4.
    answer: 2

  - slug: g5math-u01-check-q12
    type: multiple_choice
    topic_code: "5.OA.A.2"
    source: "IM K–5 Math Grade 5, Unit 1, Section B"
    points: 1
    prompt: |
      Without working out the sum, how does 5 × (348 + 26) compare with 348 + 26?
    options:
      - "It is 5 more than 348 + 26."
      - "It is 5 times as large as 348 + 26."
      - "It is 5 less than 348 + 26."
      - "It is the same as 348 + 26."
    option_explanations:
      - |
        The sign in front of the parentheses is ×. The whole sum is multiplied by 5, not increased by 5.
      - |
        Correct. The sum 348 + 26 is inside the parentheses, and the whole sum is multiplied by 5.
      - |
        Nothing is taken away. Multiplying a whole number greater than 0 by 5 makes it larger.
      - |
        Multiplying by 5 changes the value. Only multiplying by 1 keeps it the same.
    answer: 1

  - slug: g5math-u01-check-q13
    type: multiple_choice
    topic_code: "5.MD.C.5"
    source: "IM K–5 Math Grade 5, Unit 1, Section B"
    points: 1
    prompt: |
      Leah finds the volume of a box 7 cm long, 2 cm wide and 5 cm tall. She multiplies 2 by 5 first. Which expression shows her way?
    options:
      - "(7 × 2) × 5"
      - "7 + (2 × 5)"
      - "7 × 2 + 5"
      - "7 × (2 × 5)"
    option_explanations:
      - |
        This gives the right volume, 70, but it multiplies 7 by 2 first. Leah multiplied 2 by 5 first.
      - |
        This adds 7 instead of multiplying by 7. 7 + 10 = 17, which is not the volume.
      - |
        This multiplies 7 × 2 and then adds 5, which gives 19. There are 5 layers, so we multiply by 5.
      - |
        Correct. The parentheses show 2 × 5 = 10 is done first, then 7 × 10 = 70 cubic centimeters.
    answer: 3

  # ---- Stimulus set: a composite solid (5.MD.C.5)
  - slug: g5math-u01-check-q14
    type: numeric
    topic_code: "5.MD.C.5"
    source: "IM K–5 Math Grade 5, Unit 1, Section C"
    points: 1
    stimulus: |
      Use the model of a building. It is made of two rectangular prisms with no gaps. The whole building is 10 m long and 5 m deep. The low part is 3 m tall. The tall part is 4 m long and 7 m tall.
    figure: figures/u01-building.svg
    figure_alt: "A step-shaped solid seen from the front, low on the left and tall on the right. The bottom edge is labeled 10 m. The low part on the left is labeled 3 m high. The tall part on the right is labeled 7 m high, and its top edge is labeled 4 m long. The edge going back on the bottom right is labeled 5 m."
    prompt: |
      What is the volume of the building in cubic meters?
    answer: { value: 230, tolerance: 0 }
    explanation: |
      Cut straight down. The low part is 10 − 4 = 6 m long: 6 × 5 × 3 = 90 cubic meters. The tall part is 4 × 5 × 7 = 140 cubic meters. 90 + 140 = 230 cubic meters.

  - slug: g5math-u01-check-q15
    type: multiple_choice
    topic_code: "5.MD.C.5"
    source: "IM K–5 Math Grade 5, Unit 1, Section C"
    points: 1
    stimulus: |
      Use the model of a building. It is made of two rectangular prisms with no gaps. The whole building is 10 m long and 5 m deep. The low part is 3 m tall. The tall part is 4 m long and 7 m tall.
    prompt: |
      Diego cuts the building straight across, 3 m above the ground. Which expression gives the volume his way?
    options:
      - "(10 × 5 × 3) + (4 × 5 × 4)"
      - "(10 × 5 × 3) + (4 × 5 × 7)"
      - "10 × 5 × 7"
      - "(6 × 5 × 3) + (4 × 5 × 4)"
    option_explanations:
      - |
        Correct. The bottom slab is 10 × 5 × 3 = 150 cubic meters. The block above it is 4 m long, 5 m deep and 7 − 3 = 4 m tall: 80 cubic meters. 150 + 80 = 230.
      - |
        The block above the cut is only 7 − 3 = 4 m tall. Using 7 counts the bottom 3 m of the tall part twice.
      - |
        10 × 5 × 7 is a full box 7 m tall all the way across. The space above the low part is empty, so this is too much.
      - |
        The slab under the cut runs the whole 10 m, not 6 m. This leaves out the bottom of the tall part.
    answer: 0

  # ---- Volume problems (5.MD.C.5, 5.MD.C.4)
  - slug: g5math-u01-check-q16
    type: multiple_choice
    topic_code: "5.MD.C.5"
    source: "IM K–5 Math Grade 5, Unit 1, Section C"
    points: 1
    prompt: |
      A sandbox is 8 feet long and 5 feet wide. It is filled with sand 2 feet deep. How many cubic feet of sand are in it?
    options:
      - "40 cubic feet"
      - "15 cubic feet"
      - "80 cubic feet"
      - "26 cubic feet"
    option_explanations:
      - |
        40 is 8 × 5, the area of the bottom. The sand is 2 feet deep, so there are 2 layers of 40.
      - |
        15 is 8 + 5 + 2. Volume multiplies length, width and depth.
      - |
        Correct. 8 × 5 = 40 square feet of base, and 40 × 2 = 80 cubic feet of sand.
      - |
        26 is the perimeter of the sandbox, 8 + 5 + 8 + 5. That is the distance around, not the sand inside.
    answer: 2

  - slug: g5math-u01-check-q17
    type: numeric
    topic_code: "5.MD.C.5"
    source: "IM K–5 Math Grade 5, Unit 1, Section B"
    points: 1
    prompt: |
      A storage cube has edges that are each 10 inches long. What is its volume in cubic inches? (Type the digits without a comma.)
    answer: { value: 1000, tolerance: 0 }
    explanation: |
      10 × 10 × 10. One layer is 10 × 10 = 100 cubic inches, and there are 10 layers: 100 × 10 = 1,000 cubic inches.

  - slug: g5math-u01-check-q18
    type: multiple_choice
    topic_code: "5.MD.C.5"
    source: "IM K–5 Math Grade 5, Unit 1, Section C"
    points: 1
    prompt: |
      Two moving boxes are stacked in a closet. One is 3 ft by 2 ft by 2 ft. The other is 2 ft by 2 ft by 2 ft. What is the total volume of the two boxes?
    options:
      - "96 cubic feet"
      - "20 cubic feet"
      - "13 cubic feet"
      - "12 cubic feet"
    option_explanations:
      - |
        96 is 12 × 8, which multiplies the two volumes. The boxes take up separate spaces, so add them.
      - |
        Correct. 3 × 2 × 2 = 12 cubic feet and 2 × 2 × 2 = 8 cubic feet. 12 + 8 = 20 cubic feet.
      - |
        13 adds all six edge lengths. Find each box's volume by multiplying, then add.
      - |
        12 cubic feet is only the bigger box. The smaller box adds 8 cubic feet.
    answer: 1

  - slug: g5math-u01-check-q19
    type: multiple_choice
    topic_code: "5.MD.C.4"
    source: "IM K–5 Math Grade 5, Unit 1, Section A"
    points: 1
    prompt: |
      Pablo fills a box with 5 layers of unit cubes. Each layer has 2 rows of 7 cubes. How many cubes are in the box?
    options:
      - "14"
      - "35"
      - "19"
      - "70"
    option_explanations:
      - |
        14 cubes is one layer, 2 rows of 7. The box has 5 layers.
      - |
        35 is 7 × 5, which leaves out the 2 rows in each layer.
      - |
        19 is 14 + 5. There are 5 whole layers of 14, so multiply by 5.
      - |
        Correct. One layer is 2 × 7 = 14 cubes, and 5 layers are 14 × 5 = 70 cubes.
    answer: 3

  - slug: g5math-u01-check-q20
    type: short_answer
    topic_code: "5.MD.C.5"
    source: "IM K–5 Math Grade 5, Unit 1, Section C"
    points: 3
    prompt: |
      A class builds an L-shaped planter from two boxes that do not overlap. Box A is 6 ft long, 2 ft wide and 2 ft tall. Box B is 2 ft long, 3 ft wide and 2 ft tall.

      (a) Write one expression, using parentheses, for the total volume of the planter.
      (b) Find the volume of each box.
      (c) How many cubic feet of soil will fill the whole planter? Show your work.
    answer: |
      (a) (6 × 2 × 2) + (2 × 3 × 2)
      (b) Box A: 6 × 2 × 2 = 24 cubic feet. Box B: 2 × 3 × 2 = 12 cubic feet.
      (c) 24 + 12 = 36 cubic feet of soil.
    explanation: |
      Three points.

      (a) 1 pt: an expression that adds the two volumes with each volume grouped, such as (6 × 2 × 2) + (2 × 3 × 2) or (12 × 2) + (6 × 2).

      (b) 1 pt: 24 cubic feet and 12 cubic feet.

      (c) 1 pt: 36 cubic feet, with the two volumes added. Give this point for a correct sum of wrong volumes from (b).
