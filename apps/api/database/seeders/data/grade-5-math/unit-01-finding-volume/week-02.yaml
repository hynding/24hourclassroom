week: 2
unit: 1
title: "Volume Formulas and Expressions"
topics: ["5.MD.C.5", "5.OA.A.2"]
guide: guides/week-02.md
guide_description: |
  How counting cubes by layers turns into two volume formulas, length × width × height and base area ×
  height; why the three edge lengths can be multiplied in any order or grouping; and how to write and read
  expressions with parentheses for volume and for word phrases.
flashcards_description: |
  19 cards on the formulas V = l × w × h and V = B × h, the base and height of a prism, grouping factors in
  different ways, finding a missing edge length, and writing and reading expressions with parentheses.

flashcards:
  - front: Volume of a rectangular prism → the length × width × height formula
    back: |
      V = l × w × h. Multiply the three edge lengths. A box 6 cm by 2 cm by 3 cm has a volume of 6 × 2 × 3 = 36 cubic centimeters.
    topic_code: "5.MD.C.5"
  - front: Volume of a rectangular prism → the base × height formula
    back: |
      V = B × h. B is the area of the base and h is the height. A base of 20 square feet and a height of 3 feet give 20 × 3 = 60 cubic feet.
    topic_code: "5.MD.C.5"
  - front: Base of a prism → what it is
    back: |
      The face the prism stands on. Its area, length × width, tells how many unit cubes fit in the bottom layer.
    topic_code: "5.MD.C.5"
  - front: Height of a prism → what it tells you
    back: |
      How many layers of unit cubes stack up from the base. A height of 5 units means 5 layers.
    topic_code: "5.MD.C.5"
  - front: Why length × width × height works → the link to layers
    back: |
      length × width is the number of cubes in one layer. Multiplying by the height counts every layer.
    topic_code: "5.MD.C.5"
  - front: 3 × 4 × 5 → two ways to group it
    back: |
      (3 × 4) × 5 = 12 × 5 = 60 and 3 × (4 × 5) = 3 × 20 = 60. Grouping the factors differently gives the same product.
    topic_code: "5.MD.C.5"
  - front: Associative property of multiplication → what it says
    back: |
      When you multiply three numbers, you can group them either way and get the same product: (a × b) × c = a × (b × c).
    topic_code: "5.MD.C.5"
  - front: Which face is the base → does it change the volume?
    back: |
      No. Any face can be the base. A 2 by 5 by 7 box has a volume of 70 cubic units whichever way it stands.
    topic_code: "5.MD.C.5"
  - front: Cube with 4-inch edges → its volume
    back: |
      4 × 4 × 4 = 16 × 4 = 64 cubic inches.
    topic_code: "5.MD.C.5"
  - front: Cube with 10-centimeter edges → its volume
    back: |
      10 × 10 × 10 = 1,000 cubic centimeters. One layer is 100 cubes and there are 10 layers.
    topic_code: "5.MD.C.5"
  - front: Missing height of a box → how to find it
    back: |
      Find the base area, then ask "base area times what makes the volume?" Volume 48, base 4 by 3: base area 12, and 12 × 4 = 48, so the height is 4.
    topic_code: "5.MD.C.5"
  - front: Units of a volume answer → what to write
    back: |
      Cubic units of the same length unit as the edges: centimeters give cubic centimeters (cm³), feet give cubic feet (ft³).
    topic_code: "5.MD.C.5"
  - front: Expression → what it is
    back: |
      Numbers and operation signs that stand for a value, with no equal sign. 4 × 9 and (6 + 2) × 3 are expressions.
    topic_code: "5.OA.A.2"
  - front: Parentheses in an expression → what they tell you
    back: |
      Do the part inside the parentheses first. (2 + 5) × 3 means add 2 and 5, then multiply by 3.
    topic_code: "5.OA.A.2"
  - front: "\"Add 8 and 4, then multiply by 6\" → the expression"
    back: |
      (8 + 4) × 6. The parentheses keep the adding together so it happens first.
    topic_code: "5.OA.A.2"
  - front: 3 × (2,450 + 375) → how it compares to 2,450 + 375
    back: |
      It is 3 times as large. You can tell without working out the sum, because the whole sum is multiplied by 3.
    topic_code: "5.OA.A.2"
  - front: (9 × 7) + 9 compared with 9 × (7 + 9) → are they the same?
    back: |
      No. (9 × 7) + 9 is 63 + 9 = 72, but 9 × (7 + 9) is 9 × 16 = 144. Where the parentheses go changes the value.
    topic_code: "5.OA.A.2"
  - front: Volume expression (5 × 2) × 4 → what each part means
    back: |
      5 × 2 is the base: 10 cubes in the bottom layer. × 4 counts 4 layers. The volume is 40 cubic units.
    topic_code: "5.OA.A.2"
  - front: Two boxes with the same volume → an example
    back: |
      2 by 6 by 5 and 3 by 4 by 5 both have a volume of 60 cubic units: 12 × 5 = 60.
    topic_code: "5.MD.C.5"

quiz:
  description: |
    14 questions · about 30 minutes · the volume formulas length × width × height and base area × height,
    grouping factors, finding a missing edge, and writing and reading expressions with parentheses, with review
    of counting unit cubes from week 1. Multiple choice, select-all, true/false and number answers are graded at
    once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g5math-w02-q01
      type: numeric
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      figure: figures/w02-box-7x5x4.svg
      figure_alt: "A rectangular prism drawn as a solid box. The bottom front edge is labeled 7 cm, the left front edge (the height) is labeled 4 cm, and the bottom edge going back on the right is labeled 5 cm."
      prompt: |
        What is the volume of the box in cubic centimeters?
      answer: { value: 140, tolerance: 0 }
      explanation: |
        V = length × width × height = 7 × 5 × 4. The base is 7 × 5 = 35 square centimeters, and 35 × 4 = 140 cubic centimeters.

    - slug: g5math-w02-q02
      type: multiple_choice
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      stimulus: |
        Use the prism made of unit cubes. It is 5 cubes long, 2 cubes wide and 4 cubes high, and its bottom layer is shaded green.
      figure: figures/w02-cubes-5x2x4.svg
      figure_alt: "A rectangular prism built from unit cubes, 5 cubes long, 2 cubes wide and 4 cubes high. The bottom layer of 2 rows of 5 cubes is green; the 3 layers above it are blue."
      prompt: |
        Which expression shows the number of cubes in the bottom layer times the number of layers?
      options:
        - "5 + 2 + 4"
        - "(5 + 2) × 4"
        - "5 × 2 + 4"
        - "(5 × 2) × 4"
      option_explanations:
        - |
          Adding the three edges gives 11, which is not a count of cubes. The cubes come in rows, layers and stacks, so we multiply.
        - |
          5 + 2 adds the length and width. The bottom layer has 2 rows of 5, which is 5 × 2 cubes, not 5 + 2.
        - |
          5 × 2 is the bottom layer, but adding 4 adds only 4 cubes. There are 4 whole layers, so multiply by 4.
        - |
          Correct. 5 × 2 = 10 cubes in the green bottom layer, and × 4 counts all 4 layers: 40 cubes.
      answer: 3

    - slug: g5math-w02-q03
      type: multiple_choice
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      stimulus: |
        Use the prism made of unit cubes. It is 5 cubes long, 2 cubes wide and 4 cubes high, and its bottom layer is shaded green.
      prompt: |
        Han finds the volume with the expression 5 × (2 × 4). Which sentence is true?
      options:
        - "Han gets 40 cubic units too, because grouping the factors differently gives the same product."
        - "Han is wrong, because you must always multiply the length by the width first."
        - "Han gets a smaller volume, because 2 × 4 is smaller than 5 × 2."
        - "Han gets 13 cubic units, because 2 × 4 = 8 and 8 + 5 = 13."
      option_explanations:
        - |
          Correct. 2 × 4 = 8 cubes in one upright slice, like the right side of the prism, and there are 5 slices: 5 × 8 = 40, the same as (5 × 2) × 4.
        - |
          Any grouping works. Han's way counts slices of 8 cubes standing up instead of flat layers of 10 cubes.
        - |
          2 × 4 = 8 is smaller than 10, but Han multiplies it by 5 instead of by 4. 5 × 8 = 40 as well.
        - |
          The expression says 5 times (2 × 4), not 5 plus. 5 × 8 = 40.
      answer: 0

    - slug: g5math-w02-q04
      type: numeric
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      figure: figures/w02-base-area.svg
      figure_alt: "A box shaped like a rectangular prism. Its height, along the left front edge, is labeled 7 in. Under the box is written: Area of the base = 18 square inches."
      prompt: |
        What is the volume of the box in cubic inches?
      answer: { value: 126, tolerance: 0 }
      explanation: |
        V = base area × height = 18 × 7 = 126 cubic inches. The base area tells how many inch cubes fit in one layer, and the height tells how many layers.

    - slug: g5math-w02-q05
      type: fill_blank
      topic_code: "5.OA.A.2"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      prompt: |
        In the expression 4 × (6 + 3), the ____ show that you add 6 and 3 first.
      answer: ["parentheses", "the parentheses", "parenthesis", "the parenthesis"]
      explanation: |
        Parentheses. The part inside the parentheses is worked out first: 6 + 3 = 9, then 4 × 9 = 36.

    - slug: g5math-w02-q06
      type: multiple_choice
      topic_code: "5.OA.A.2"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      prompt: |
        Which expression means "add 7 and 5, then multiply by 6"?
      options:
        - "7 + 5 × 6"
        - "(7 + 5) × 6"
        - "6 × 7 + 5"
        - "7 × 5 + 6"
      option_explanations:
        - |
          Without parentheses, we multiply first: 5 × 6 = 30, then add 7. The adding must happen first, so it needs parentheses.
        - |
          Correct. The parentheses group 7 + 5 so it is done first, and then the sum is multiplied by 6.
        - |
          This multiplies 6 × 7 first and then adds 5. The words say to add 7 and 5 first.
        - |
          This multiplies 7 and 5. The words say to add them, and then multiply by 6.
      answer: 1

    - slug: g5math-w02-q07
      type: multiple_choice
      topic_code: "5.OA.A.2"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      prompt: |
        Without working out the sum, how does 4 × (2,315 + 687) compare with 2,315 + 687?
      options:
        - "It is 4 more than 2,315 + 687."
        - "It is the same as 2,315 + 687."
        - "It is 4 times as large as 2,315 + 687."
        - "It is one fourth as large as 2,315 + 687."
      option_explanations:
        - |
          The sign in front of the parentheses is ×, not +. The whole sum is multiplied by 4, not increased by 4.
        - |
          Multiplying by 4 changes the value. Only multiplying by 1 would keep it the same.
        - |
          Correct. The parentheses hold the sum 2,315 + 687, and the whole sum is multiplied by 4, so the result is 4 times as large.
        - |
          One fourth as large would mean dividing by 4. The expression multiplies by 4.
      answer: 2

    - slug: g5math-w02-q08
      type: true_false
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      prompt: |
        True or false: a box 2 feet by 3 feet by 10 feet and a box 5 feet by 4 feet by 3 feet have the same volume.
      answer: true
      explanation: |
        True. 2 × 3 × 10 = 6 × 10 = 60 cubic feet, and 5 × 4 × 3 = 20 × 3 = 60 cubic feet. Different shapes can have the same volume.

    - slug: g5math-w02-q09
      type: multi_select
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 2
      partial_credit: true
      prompt: |
        A rectangular prism is 8 cm long, 3 cm wide and 5 cm high. Select all the expressions that give its volume in cubic centimeters.
      options:
        - "8 × 3 × 5"
        - "8 + 3 + 5"
        - "24 × 5"
        - "8 × 3 + 5"
        - "8 × 15"
      option_explanations:
        - |
          Yes. Volume = length × width × height = 8 × 3 × 5 = 120.
        - |
          No. Adding the edges gives 16, a length, not a count of cubes.
        - |
          Yes. 24 = 8 × 3 is the base area, and base area × height = 24 × 5 = 120.
        - |
          No. This adds only 5 cubes to one layer of 24. There are 5 layers, so the 24 must be multiplied by 5.
        - |
          Yes. 15 = 3 × 5, so this is 8 × (3 × 5) = 120, the same edges grouped another way.
      answer: [0, 2, 4]

    - slug: g5math-w02-q10
      type: multiple_choice
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      prompt: |
        A gift box has a volume of 72 cubic centimeters. Its base is 4 cm long and 3 cm wide. How tall is the box?
      options:
        - "18 cm"
        - "12 cm"
        - "65 cm"
        - "6 cm"
      option_explanations:
        - |
          18 is 72 ÷ 4, which uses only the length. Divide by the whole base area, 4 × 3 = 12.
        - |
          12 is the base area in square centimeters, 4 × 3. The height is how many layers of 12 make 72.
        - |
          65 is 72 − 4 − 3. Volume comes from multiplying, so we need a number that multiplies with 12 to make 72.
        - |
          Correct. The base area is 4 × 3 = 12 square centimeters, and 12 × 6 = 72, so the box is 6 cm tall.
      answer: 3

    - slug: g5math-w02-q11
      type: multiple_choice
      topic_code: "5.MD.C.4"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      prompt: |
        A box is 4 cubes long and 3 cubes wide. Lina puts in 2 layers of unit cubes and the box is exactly half full. How many unit cubes fill the whole box?
      options:
        - "24"
        - "48"
        - "12"
        - "36"
      option_explanations:
        - |
          24 is the 2 layers Lina has put in, which is only half the box. The full box holds twice as many.
        - |
          Correct. One layer is 4 × 3 = 12 cubes. 2 layers fill half, so the box holds 4 layers: 12 × 4 = 48 cubes.
        - |
          12 is one layer. Half the box is 2 layers, so the whole box is 4 layers.
        - |
          36 is 3 layers. If 2 layers fill half the box, the whole box needs 4 layers.
      answer: 1

    - slug: g5math-w02-q12
      type: numeric
      topic_code: "5.MD.C.4"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      prompt: |
        Kai builds a big cube out of small unit cubes. Each edge of the big cube is 4 small cubes long. How many small cubes does he use?
      answer: { value: 64, tolerance: 0 }
      explanation: |
        Each layer is 4 rows of 4, which is 16 cubes. There are 4 layers: 16 × 4 = 64 small cubes.

    - slug: g5math-w02-q13
      type: multiple_choice
      topic_code: "5.MD.C.3"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      prompt: |
        A teacher says a pencil box has a volume of 300 cubic centimeters. What does that mean?
      options:
        - "300 squares that are 1 centimeter on each side cover the bottom of the box."
        - "The edges of the box add up to 300 centimeters."
        - "300 cubes with 1-centimeter edges would fill the box with no gaps or overlaps."
        - "The box is 300 centimeters long."
      option_explanations:
        - |
          Squares on the bottom measure the area of the base. Volume counts cubes that fill the whole box, all its layers.
        - |
          Adding edges gives a length. Volume is the number of unit cubes inside, not a distance.
        - |
          Correct. A cubic centimeter is the space of one cube with 1-centimeter edges, so 300 of them fill the box.
        - |
          300 centimeters is 3 meters, far too long for a pencil box. Volume is a count of cubes, not one length.
      answer: 2

    - slug: g5math-w02-q14
      type: short_answer
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 2
      prompt: |
        A toy chest is 4 feet long, 2 feet wide and 3 feet tall.

        (a) Write an expression with parentheses that shows its volume as base area times height.
        (b) What is the volume of the toy chest? Show your work.
      answer: |
        (a) (4 × 2) × 3
        (b) 4 × 2 = 8 square feet for the base, and 8 × 3 = 24. The volume is 24 cubic feet.
      explanation: |
        Two points.

        (a) 1 pt: (4 × 2) × 3, or (2 × 4) × 3. The parentheses must group the length and width, which make the base.

        (b) 1 pt: 24 cubic feet with work shown (8 × 3 or 4 × 2 × 3). Give this point for 24 cubic feet even if (a) is wrong.
