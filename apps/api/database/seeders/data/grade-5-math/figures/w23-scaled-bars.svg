<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 230" font-family="sans-serif" font-size="16">
  <title>A bar and two scaled copies</title>
  <rect x="0" y="0" width="430" height="230" fill="#ffffff"/>
  <text x="86" y="57" text-anchor="end" fill="#1c2733" font-weight="bold">Top bar</text>
  <rect x="100" y="30" width="240" height="40" fill="#2457c5" stroke="#1c2733" stroke-width="2"/>
  <text x="220" y="57" text-anchor="middle" fill="#ffffff" font-weight="bold">8 cm</text>
  <text x="86" y="127" text-anchor="end" fill="#1c2733" font-weight="bold">Bar A</text>
  <rect x="100" y="100" width="180" height="40" fill="#1f6f54" stroke="#1c2733" stroke-width="2"/>
  <text x="86" y="197" text-anchor="end" fill="#1c2733" font-weight="bold">Bar B</text>
  <rect x="100" y="170" width="300" height="40" fill="#1f6f54" stroke="#1c2733" stroke-width="2"/>
</svg>
