<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" font-family="sans-serif" font-size="16">
  <title>Cutting a 4.8-Meter Ribbon</title>
  <rect x="0" y="0" width="520" height="150" fill="#ffffff"/>
  <text x="260" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c2733">Cutting a 4.8-Meter Ribbon</text>
  <polyline points="60,70 60,62 460,62 460,70" fill="none" stroke="#1c2733" stroke-width="2"/>
  <text x="260" y="54" text-anchor="middle" font-weight="bold" fill="#1c2733">4.8 m</text>
  <rect x="60" y="74" width="400" height="50" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <line x1="160" y1="74" x2="160" y2="124" stroke="#1c2733" stroke-width="2"/>
  <line x1="260" y1="74" x2="260" y2="124" stroke="#1c2733" stroke-width="2"/>
  <line x1="360" y1="74" x2="360" y2="124" stroke="#1c2733" stroke-width="2"/>
  <text x="110" y="106" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">?</text>
  <text x="210" y="106" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">?</text>
  <text x="310" y="106" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">?</text>
  <text x="410" y="106" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">?</text>
</svg>
