  <line x1="390" y1="212" x2="390" y2="228" stroke="#1c2733" stroke-width="2"/>
  <text x="390" y="250" text-anchor="middle" fill="#1c2733">7/8</text>
  <line x1="440" y1="212" x2="440" y2="228" stroke="#1c2733" stroke-width="2"/>
  <text x="440" y="250" text-anchor="middle" fill="#1c2733">1</text>
  <path d="M131 187 L149 205 M149 187 L131 205 M131 157 L149 175 M149 157 L131 175 M181 187 L199 205 M199 187 L181 205 M231 187 L249 205 M249 187 L231 205 M231 157 L249 175 M249 157 L231 175 M231 127 L249 145 M249 127 L231 145 M281 187 L299 205 M299 187 L281 205 M281 157 L299 175 M299 157 L281 175 M381 187 L399 205 M399 187 L381 205" stroke="#2457c5" stroke-width="3" stroke-linecap="round" fill="none"/>
