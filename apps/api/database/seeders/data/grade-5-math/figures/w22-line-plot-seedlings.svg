<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="sans-serif" font-size="16">
  <title>Seedling growth line plot</title>
  <rect x="0" y="0" width="480" height="300" fill="#ffffff"/>
  <text x="240" y="28" text-anchor="middle" fill="#1c2733" font-size="18" font-weight="bold">Seedling Growth in One Week</text>
  <line x1="25" y1="220" x2="455" y2="220" stroke="#1c2733" stroke-width="2"/>
  <line x1="40" y1="212" x2="40" y2="228" stroke="#1c2733" stroke-width="2"/>
  <text x="40" y="250" text-anchor="middle" fill="#1c2733">0</text>
  <line x1="90" y1="212" x2="90" y2="228" stroke="#1c2733" stroke-width="2"/>
  <text x="90" y="250" text-anchor="middle" fill="#1c2733">1/8</text>
  <line x1="140" y1="212" x2="140" y2="228" stroke="#1c2733" stroke-width="2"/>
  <text x="140" y="250" text-anchor="middle" fill="#1c2733">1/4</text>
  <line x1="190" y1="212" x2="190" y2="228" stroke="#1c2733" stroke-width="2"/>
  <text x="190" y="250" text-anchor="middle" fill="#1c2733">3/8</text>
  <line x1="240" y1="212" x2="240" y2="228" stroke="#1c2733" stroke-width="2"/>
  <text x="240" y="250" text-anchor="middle" fill="#1c2733">1/2</text>
  <line x1="290" y1="212" x2="290" y2="228" stroke="#1c2733" stroke-width="2"/>
  <text x="290" y="250" text-anchor="middle" fill="#1c2733">5/8</text>
  <line x1="340" y1="212" x2="340" y2="228" stroke="#1c2733" stroke-width="2"/>
