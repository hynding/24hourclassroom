  <text x="370" y="70" text-anchor="middle" fill="#1c2733">4</text>
  <rect x="400" y="44" width="60" height="40" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <text x="430" y="70" text-anchor="middle" fill="#1c2733">5</text>
  <rect x="20" y="84" width="140" height="40" fill="#b8bfc6" stroke="#1c2733" stroke-width="2"/>
  <text x="90" y="110" text-anchor="middle" font-weight="bold" fill="#1c2733">Pattern A</text>
  <rect x="160" y="84" width="60" height="40" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <text x="190" y="110" text-anchor="middle" fill="#1c2733">0</text>
  <rect x="220" y="84" width="60" height="40" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <text x="250" y="110" text-anchor="middle" fill="#1c2733">3</text>
  <rect x="280" y="84" width="60" height="40" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <text x="310" y="110" text-anchor="middle" fill="#1c2733">6</text>
  <rect x="340" y="84" width="60" height="40" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <text x="370" y="110" text-anchor="middle" fill="#1c2733">9</text>
  <rect x="400" y="84" width="60" height="40" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <text x="430" y="110" text-anchor="middle" fill="#1c2733">12</text>
  <rect x="20" y="124" width="140" height="40" fill="#b8bfc6" stroke="#1c2733" stroke-width="2"/>
  <text x="90" y="150" text-anchor="middle" font-weight="bold" fill="#1c2733">Pattern B</text>
  <rect x="160" y="124" width="60" height="40" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <text x="190" y="150" text-anchor="middle" fill="#1c2733">0</text>
  <rect x="220" y="124" width="60" height="40" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <text x="250" y="150" text-anchor="middle" fill="#1c2733">6</text>
  <rect x="280" y="124" width="60" height="40" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <text x="310" y="150" text-anchor="middle" fill="#1c2733">12</text>
  <rect x="340" y="124" width="60" height="40" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
