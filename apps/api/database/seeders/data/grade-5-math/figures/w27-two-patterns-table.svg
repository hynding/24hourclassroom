<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150" font-family="sans-serif" font-size="16">
  <title>Two patterns in a table</title>
  <rect x="0" y="0" width="480" height="150" fill="#ffffff"/>
