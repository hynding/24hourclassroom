<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="500" height="360" fill="#ffffff"/>
  <text x="250" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c2733">How some quadrilaterals are related</text>
  <line x1="250" y1="90" x2="250" y2="140" stroke="#1c2733" stroke-width="2"/>
  <line x1="250" y1="180" x2="140" y2="230" stroke="#1c2733" stroke-width="2"/>
  <line x1="250" y1="180" x2="360" y2="230" stroke="#1c2733" stroke-width="2"/>
  <line x1="140" y1="270" x2="250" y2="310" stroke="#1c2733" stroke-width="2"/>
  <line x1="360" y1="270" x2="250" y2="310" stroke="#1c2733" stroke-width="2"/>
  <rect x="160" y="50" width="180" height="40" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <text x="250" y="76" text-anchor="middle" font-weight="bold" fill="#1c2733">Quadrilaterals</text>
  <rect x="160" y="140" width="180" height="40" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <text x="250" y="166" text-anchor="middle" font-weight="bold" fill="#1c2733">Parallelograms</text>
  <rect x="60" y="230" width="160" height="40" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <text x="140" y="256" text-anchor="middle" font-weight="bold" fill="#1c2733">Rectangles</text>
  <rect x="280" y="230" width="160" height="40" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <text x="360" y="256" text-anchor="middle" font-weight="bold" fill="#1c2733">Rhombuses</text>
  <rect x="180" y="300" width="140" height="40" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <text x="250" y="326" text-anchor="middle" font-weight="bold" fill="#1c2733">Squares</text>
</svg>
