<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" font-family="sans-serif" font-size="16">
  <title>Rosa's walk to school</title>
  <rect x="0" y="0" width="500" height="150" fill="#ffffff"/>
  <line x1="40" y1="62" x2="460" y2="62" stroke="#1c2733" stroke-width="2"/>
  <line x1="40" y1="54" x2="40" y2="70" stroke="#1c2733" stroke-width="2"/>
  <line x1="460" y1="54" x2="460" y2="70" stroke="#1c2733" stroke-width="2"/>
  <text x="250" y="48" text-anchor="middle" fill="#1c2733" font-weight="bold">3/4 mile in all</text>
  <rect x="40" y="82" width="186.67" height="50" fill="#2457c5" stroke="#1c2733" stroke-width="2"/>
  <rect x="226.67" y="82" width="233.33" height="50" fill="#ffffff" stroke="#1c2733" stroke-width="2"/>
  <text x="133.33" y="113" text-anchor="middle" fill="#ffffff" font-weight="bold">1/3 mile walked</text>
  <text x="343.33" y="113" text-anchor="middle" fill="#1c2733" font-size="20" font-weight="bold">?</text>
</svg>
