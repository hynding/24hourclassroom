<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" font-family="sans-serif" font-size="16">
  <title>Hierarchy of quadrilaterals</title>
  <rect x="0" y="0" width="440" height="360" fill="#ffffff"/>
  <rect x="125" y="20" width="190" height="40" rx="6" fill="#ffffff" stroke="#2457c5" stroke-width="2.5"/>
  <text x="220" y="46" text-anchor="middle" font-weight="bold" fill="#1c2733">Quadrilaterals</text>
  <rect x="125" y="110" width="190" height="40" rx="6" fill="#ffffff" stroke="#2457c5" stroke-width="2.5"/>
  <text x="220" y="136" text-anchor="middle" font-weight="bold" fill="#1c2733">Parallelograms</text>
  <rect x="25" y="200" width="170" height="40" rx="6" fill="#ffffff" stroke="#2457c5" stroke-width="2.5"/>
  <text x="110" y="226" text-anchor="middle" font-weight="bold" fill="#1c2733">Rectangles</text>
  <rect x="245" y="200" width="170" height="40" rx="6" fill="#ffffff" stroke="#2457c5" stroke-width="2.5"/>
  <text x="330" y="226" text-anchor="middle" font-weight="bold" fill="#1c2733">Rhombuses</text>
  <rect x="145" y="290" width="150" height="40" rx="6" fill="#ffffff" stroke="#2457c5" stroke-width="2.5"/>
  <text x="220" y="316" text-anchor="middle" font-weight="bold" fill="#1c2733">Squares</text>
  <line x1="220" y1="60" x2="220" y2="110" stroke="#1c2733" stroke-width="2"/>
  <polygon points="220,110 225,100 215,100" fill="#1c2733"/>
  <line x1="190" y1="150" x2="130" y2="200" stroke="#1c2733" stroke-width="2"/>
  <polygon points="130,200 140.9,197.4 134.5,189.8" fill="#1c2733"/>
  <line x1="250" y1="150" x2="310" y2="200" stroke="#1c2733" stroke-width="2"/>
  <polygon points="310,200 305.5,189.8 299.1,197.4" fill="#1c2733"/>
  <line x1="130" y1="240" x2="190" y2="290" stroke="#1c2733" stroke-width="2"/>
  <polygon points="190,290 185.5,279.8 179.1,287.4" fill="#1c2733"/>
  <line x1="310" y1="240" x2="250" y2="290" stroke="#1c2733" stroke-width="2"/>
  <polygon points="250,290 260.9,287.4 254.5,279.8" fill="#1c2733"/>
</svg>
