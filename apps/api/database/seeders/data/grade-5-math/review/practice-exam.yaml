  - slug: g5math-final-q34
    type: multiple_choice
    topic_code: "5.G.B.4"
    source: "IM K–5 Math Grade 5, Unit 7, Section B"
    points: 1
    figure: figures/review-hierarchy.svg
    figure_alt: "A diagram titled How some quadrilaterals are related. Quadrilaterals is at the top, joined by a line to Parallelograms below it. Parallelograms is joined to two boxes below it, Rectangles and Rhombuses. Both Rectangles and Rhombuses are joined to Squares at the bottom. A shape belongs to every group above it that it is joined to."
    prompt: |
      The diagram shows how some quadrilaterals are related. Which statement does it show is true?
    options:
      - "Every rhombus is a square."
      - "Every square is a rhombus."
      - "Every quadrilateral is a parallelogram."
      - "Every parallelogram is a rectangle."
    option_explanations:
      - |
        Squares are below rhombuses, so squares are one kind of rhombus. A rhombus whose angles are not right angles is not a square.
      - |
        Correct. Squares are joined below Rhombuses, so every square has all the properties of a rhombus: four equal sides.
      - |
        Parallelograms are below Quadrilaterals, so some quadrilaterals are parallelograms, but not all. A shape with no parallel sides is still a quadrilateral.
      - |
        Rectangles are below Parallelograms, so rectangles are one kind of parallelogram. A parallelogram without right angles is not a rectangle.
    answer: 1

  - slug: g5math-final-q35
    type: true_false
    topic_code: "5.G.B.3"
    source: "IM K–5 Math Grade 5, Unit 7, Section B"
    points: 1
    prompt: |
      True or false: a square has every property that a rectangle has.
    answer: true
    explanation: |
      True. A rectangle is a parallelogram with four right angles. A square is a parallelogram with four right angles too (and four equal sides), so it is a special rectangle.

