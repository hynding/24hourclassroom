  - slug: g5math-final-q39
    type: short_answer
    topic_code: "5.NF.A.1"
    source: "IM K–5 Math Grade 5, Unit 8, Section C"
    points: 3
    prompt: |
      Rosa runs 1 2/3 miles on Monday and 2 1/4 miles on Tuesday. Her brother runs 4.5 miles in the same two days.

      (a) How far does Rosa run in all? Show your work.
      (b) Write 4.5 as a mixed number.
      (c) Who runs farther, and by how much?
    answer: |
      (a) In twelfths: 1 8/12 + 2 3/12 = 3 11/12 miles.
      (b) 4.5 = 4 5/10 = 4 1/2.
      (c) 4 1/2 = 4 6/12, which is more than 3 11/12. Her brother runs farther, by 4 6/12 − 3 11/12 = 3 18/12 − 3 11/12 = 7/12 mile.
    explanation: |
      Three points.

      (a) 1 pt: 3 11/12 miles (or 47/12), with a common denominator shown.

      (b) 1 pt: 4 1/2 (or 4 5/10).

      (c) 1 pt: the brother runs farther, by 7/12 mile, with a common denominator or a correct comparison shown. If (a) is wrong, award this point for a correct comparison with the student's own answer.

