week: 33
description: |
  The End-of-Year Check for Grade 5 Math: 40 questions, about 80 minutes, covering all eight units in course
  order. Each unit's share follows its number of weeks: Unit 1 Finding Volume (4 questions), Unit 2 Fractions
  as Quotients and Fraction Multiplication (5), Unit 3 Multiplying and Dividing Fractions (5), Unit 4
  Wrapping Up Multiplication and Division with Multi-digit Numbers (5), Unit 5 Place Value Patterns and
  Decimal Operations (6), Unit 6 More Decimal and Fraction Operations (6), Unit 7 Shapes on the Coordinate
  Plane (5) and Unit 8 Putting It All Together (4). Six questions have a picture, and three pairs of questions
  share a picture. Multiple choice, true/false, fill-in and number answers are worth 1 point each; the
  select-all question is worth 2 points with partial credit; the two short answers are worth 3 points each
  and are checked by your teacher against the scoring notes. The check is out of 45 points. Take it in one
  sitting if you can, or in two halves (questions 1–19, then 20–40), and leave a few minutes to look back over
  your answers.
questions:
  # ======================================================================
  # Unit 1 (4): q01-q04 · Unit 2 (5): q05-q09 · Unit 3 (5): q10-q14
  # Unit 4 (5): q15-q19 · Unit 5 (6): q20-q25 · Unit 6 (6): q26-q31
  # Unit 7 (5): q32-q36 · Unit 8 (4): q37-q40
  # ======================================================================
  # ---- Unit 1 · Volume
  - slug: g5math-final-q01
    type: multiple_choice
    topic_code: "5.MD.C.4"
    source: "IM K–5 Math Grade 5, Unit 1, Section A"
    points: 1
    figure: figures/review-cube-prism.svg
    figure_alt: "A rectangular prism built from unit cubes with no gaps. The front face shows 5 cubes across and 3 cubes up. The top shows 5 cubes across and 2 cubes going back. The right side shows 2 cubes going back and 3 cubes up. So the prism is 5 cubes long, 2 cubes wide and 3 cubes tall, and some cubes are hidden."
    prompt: |
      What is the volume of the prism?
    options:
      - "30 cubic units"
      - "22 cubic units"
      - "10 cubic units"
      - "60 cubic units"
    option_explanations:
      - |
        Correct. Each layer is 5 × 2 = 10 cubes, and there are 3 layers. 10 × 3 = 30 cubic units, hidden cubes included.
      - |
        22 counts only the cubes you can see from the front, top and side. The 8 hidden cubes in the back fill space too.
      - |
        10 is one layer, 5 × 2. The prism is 3 layers tall, so multiply by 3.
      - |
        60 is twice the volume. The prism is 5 by 2 by 3, and 5 × 2 × 3 = 30.
    answer: 0

  - slug: g5math-final-q02
    type: numeric
    topic_code: "5.MD.C.5"
    source: "IM K–5 Math Grade 5, Unit 1, Section B"
    points: 1
    prompt: |
      A jewelry box is 7 inches long, 4 inches wide and 9 inches tall. What is its volume in cubic inches?
    answer: { value: 252, tolerance: 0 }
    explanation: |
      V = 7 × 4 × 9. 7 × 4 = 28 and 28 × 9 = 252 cubic inches.

  - slug: g5math-final-q03
    type: multiple_choice
    topic_code: "5.OA.A.2"
    source: "IM K–5 Math Grade 5, Unit 1, Section B"
    points: 1
    prompt: |
      Two boxes are the same size: 3 feet by 4 feet by 5 feet. Which expression gives their total volume?
    options:
      - "2 + 3 × 4 × 5"
      - "2 × (3 × 4 × 5)"
      - "(2 × 3) + (4 × 5)"
      - "3 × 4 × 5 + 5"
    option_explanations:
      - |
        2 + 3 × 4 × 5 adds 2 to one box's volume. There are 2 boxes, so the volume is doubled, not increased by 2.
      - |
        Correct. 3 × 4 × 5 = 60 is one box, and 2 × 60 = 120 cubic feet for both.
      - |
        (2 × 3) + (4 × 5) mixes up the numbers and adds two products. Each box's volume is 3 × 4 × 5.
      - |
        3 × 4 × 5 + 5 adds 5 to one box. The second box adds another 60, not 5.
    answer: 1

  - slug: g5math-final-q04
    type: true_false
    topic_code: "5.MD.C.5"
    source: "IM K–5 Math Grade 5, Unit 1, Section B"
    points: 1
    prompt: |
      True or false: two rectangular prisms with the same volume must have the same length, width and height.
    answer: false
    explanation: |
      False. A prism 2 by 3 by 4 and a prism 1 by 4 by 6 both have a volume of 24 cubic units, but their edges are different.

  # ---- Unit 2 · Fractions as quotients and fraction multiplication
  - slug: g5math-final-q05
    type: multiple_choice
    topic_code: "5.NF.B.3"
    source: "IM K–5 Math Grade 5, Unit 2, Section A"
    points: 1
    prompt: |
      5 friends share 3 pizzas equally. How much pizza does each friend get?
    options:
      - "5/3 of a pizza"
      - "1/5 of a pizza"
      - "3/5 of a pizza"
      - "1/3 of a pizza"
    option_explanations:
      - |
        5/3 is more than a whole pizza. With only 3 pizzas for 5 people, each share is less than 1. Divide 3 by 5, not 5 by 3.
      - |
        1/5 is a share of just one pizza. There are 3 pizzas, so each friend gets 1/5 of each pizza: 3/5 in all.
      - |
        Correct. 3 ÷ 5 = 3/5. Cut each pizza into fifths, and each friend takes one fifth from each of the 3 pizzas.
      - |
        1/3 would share each pizza among 3 people. There are 5 friends, so the pieces are fifths.
    answer: 2

  - slug: g5math-final-q06
    type: numeric
    topic_code: "5.NF.B.4"
    source: "IM K–5 Math Grade 5, Unit 2, Section B"
    points: 1
    prompt: |
      There are 24 students in a class. 3/4 of them bring a water bottle. How many students bring a water bottle?
    answer: { value: 18, tolerance: 0 }
    explanation: |
      1/4 of 24 is 24 ÷ 4 = 6, so 3/4 of 24 is 3 × 6 = 18 students.

  - slug: g5math-final-q07
    type: multiple_choice
    topic_code: "5.NF.B.4"
    source: "IM K–5 Math Grade 5, Unit 2, Section C"
    points: 1
    figure: figures/review-area-model.svg
    figure_alt: "A square with side length 1 unit, split into 3 equal columns and 4 equal rows, making 12 equal parts. The top side has a bracket over the first 2 columns labeled 2/3. The left side has a bracket beside the first 3 rows labeled 3/4. The 6 parts that are in both the first 2 columns and the first 3 rows are shaded blue."
    prompt: |
      The shaded rectangle is 2/3 unit by 3/4 unit. What is its area, 2/3 × 3/4?
    options:
      - "5/7 square unit"
      - "9/12 square unit"
      - "17/12 square units"
      - "6/12 square unit"
    option_explanations:
      - |
        5/7 adds the numerators and the denominators. The picture shows the whole square cut into 12 parts, so the answer is in twelfths.
      - |
        9/12 is 3 rows of 3 parts, which is 3/4 of the whole square. The shaded part is only 2 of the 3 columns in those rows.
      - |
        17/12 is 2/3 + 3/4, the sum of the sides. That is more than the whole square, which has an area of 1.
      - |
        Correct. 6 of the 12 equal parts are shaded, so 2/3 × 3/4 = 6/12 (which is also 1/2).
    answer: 3

  - slug: g5math-final-q08
    type: multiple_choice
    topic_code: "5.NF.B.6"
    source: "IM K–5 Math Grade 5, Unit 2, Section C"
    points: 1
    prompt: |
      A nature trail is 2 1/2 miles long. Kai has walked 3/5 of the trail. How far has Kai walked?
    options:
      - "1 1/2 miles"
      - "3 1/10 miles"
      - "1 1/5 miles"
      - "4 1/6 miles"
    option_explanations:
      - |
        Correct. 3/5 × 2 1/2 = 3/5 × 2 + 3/5 × 1/2 = 6/5 + 3/10 = 12/10 + 3/10 = 15/10 = 1 1/2 miles.
      - |
        3 1/10 is 2 1/2 + 3/5. Kai walked part of the trail, so the answer must be less than 2 1/2 miles.
      - |
        1 1/5 is 3/5 × 2 only. The 1/2 mile is part of the trail too: 3/5 × 1/2 = 3/10 more.
      - |
        4 1/6 is longer than the whole trail. 3/5 of something is less than all of it.
    answer: 0

  - slug: g5math-final-q09
    type: numeric
    topic_code: "5.NF.B.6"
    source: "IM K–5 Math Grade 5, Unit 2, Section C"
    points: 1
    prompt: |
      A rug is 4 1/2 feet wide and 6 feet long. What is its area in square feet?
    answer: { value: 27, tolerance: 0 }
    explanation: |
      6 × 4 1/2 = 6 × 4 + 6 × 1/2 = 24 + 3 = 27 square feet.

  # ---- Unit 3 · Multiplying and dividing fractions
  - slug: g5math-final-q10
    type: numeric
    topic_code: "5.MD.B.2"
    source: "IM K–5 Math Grade 5, Unit 3, Section C"
    points: 1
    stimulus: |
      Use the line plot of the lengths of 10 bean sprouts, measured to the nearest 1/4 inch.
    figure: figures/review-line-plot.svg
    figure_alt: "A line plot titled Bean Sprout Lengths, with a scale from 1 to 2 inches marked in fourths: 1, 1 1/4, 1 1/2, 1 3/4 and 2. There are no X marks above 1, 2 X marks above 1 1/4, 3 above 1 1/2, 4 above 1 3/4 and 1 above 2. There are 10 X marks in all."
    prompt: |
      How many sprouts are longer than 1 1/2 inches?
    answer: { value: 5, tolerance: 0 }
    explanation: |
      Longer than 1 1/2 inches means 1 3/4 or 2 inches. There are 4 sprouts at 1 3/4 and 1 at 2, so 4 + 1 = 5 sprouts.

  - slug: g5math-final-q11
    type: multiple_choice
    topic_code: "5.MD.B.2"
    source: "IM K–5 Math Grade 5, Unit 3, Section C"
    points: 1
    stimulus: |
      Use the line plot of the lengths of 10 bean sprouts, measured to the nearest 1/4 inch.
    prompt: |
      All the sprouts that are 1 3/4 inches long are laid end to end. How long is the line they make?
    options:
      - "4 3/4 inches"
      - "7 inches"
      - "1 3/4 inches"
      - "4 inches"
    option_explanations:
      - |
        4 3/4 adds 4 to 1 3/4. There are 4 sprouts of that length, so multiply: 4 × 1 3/4.
      - |
        Correct. 4 × 1 3/4 = 4 × 1 + 4 × 3/4 = 4 + 3 = 7 inches.
      - |
        1 3/4 inches is the length of one sprout. The plot shows 4 sprouts of that length.
      - |
        4 is the number of sprouts, not their total length. Each one is 1 3/4 inches long.
    answer: 1

  - slug: g5math-final-q12
    type: numeric
    topic_code: "5.NF.B.7"
    source: "IM K–5 Math Grade 5, Unit 3, Section B"
    points: 1
    prompt: |
      Mr. Okafor cuts 2 feet of ribbon into pieces that are each 1/3 foot long. How many pieces does he get?
    answer: { value: 6, tolerance: 0 }
    explanation: |
      2 ÷ 1/3 asks how many thirds are in 2. Each foot holds 3 thirds, so 2 feet hold 2 × 3 = 6 pieces.

  - slug: g5math-final-q13
    type: multiple_choice
    topic_code: "5.NF.B.7"
    source: "IM K–5 Math Grade 5, Unit 3, Section B"
    points: 1
    prompt: |
      What is 1/5 ÷ 4?
    options:
      - "4/5"
      - "20"
      - "1/20"
      - "1/9"
    option_explanations:
      - |
        4/5 is 1/5 × 4. Dividing 1/5 into 4 equal parts makes each part smaller than 1/5, not bigger.
      - |
        20 is 4 ÷ 1/5, how many fifths fit in 4. Here 1/5 is being split into 4 parts, so the answer is a small fraction.
      - |
        Correct. Splitting each fifth into 4 equal parts makes 20 parts in the whole, so 1/5 ÷ 4 = 1/20.
      - |
        1/9 adds 4 to the denominator. Splitting fifths into 4 parts each multiplies the number of parts: 5 × 4 = 20.
    answer: 2

  - slug: g5math-final-q14
    type: multiple_choice
    topic_code: "5.NF.B.5"
    source: "IM K–5 Math Grade 5, Unit 3, Section A"
    points: 1
    prompt: |
      Without multiplying, which product is less than 48?
    options:
      - "5/4 × 48"
      - "1 × 48"
      - "2 1/3 × 48"
      - "3/4 × 48"
    option_explanations:
      - |
        5/4 is more than 1, so 5/4 × 48 is more than 48.
      - |
        Multiplying by 1 keeps the number the same: 1 × 48 is exactly 48, not less than 48.
      - |
        2 1/3 is more than 1, so 2 1/3 × 48 is more than 48 (more than twice as much).
      - |
        Correct. 3/4 is less than 1, so 3/4 × 48 is less than 48. (It is 36.)
    answer: 3

  # ---- Unit 4 · Multi-digit multiplication and division, expressions
  - slug: g5math-final-q15
    type: numeric
    topic_code: "5.NBT.B.5"
    source: "IM K–5 Math Grade 5, Unit 4, Section A"
    points: 1
    prompt: |
      What is 563 × 24? (Type the digits without a comma.)
    answer: { value: 13512, tolerance: 0 }
