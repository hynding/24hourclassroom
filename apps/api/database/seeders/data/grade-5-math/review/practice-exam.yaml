  - slug: g5math-final-q25
    type: numeric
    topic_code: "5.NBT.B.7"
    source: "IM K–5 Math Grade 5, Unit 5, Section C"
    points: 1
    prompt: |
      A ribbon is 2.4 meters long. A second ribbon is 1.5 times as long. How many meters long is the second ribbon? Type a decimal.
