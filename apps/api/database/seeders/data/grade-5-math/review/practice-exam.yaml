  - slug: g5math-final-q24
    type: multiple_choice
    topic_code: "5.NBT.A.2"
    source: "IM K–5 Math Grade 5, Unit 5, Section C"
    points: 1
    prompt: |
      What is 0.48 × 100?
    options:
      - "48"
      - "4.8"
      - "0.0048"
      - "480"
    option_explanations:
      - |
        Correct. Multiplying by 100 moves each digit two places to the left: 0.48 becomes 48.
      - |
        4.8 is 0.48 × 10. Multiplying by 100 makes each digit worth 100 times as much, two places to the left.
      - |
        0.0048 is 0.48 ÷ 100. Multiplying by 100 makes the number bigger.
      - |
        480 is 0.48 × 1,000. Multiplying by 100 moves the digits two places, not three.
