  - slug: g5math-final-q16
    type: multiple_choice
    topic_code: "5.NBT.B.6"
    source: "IM K–5 Math Grade 5, Unit 4, Section B"
    points: 1
    prompt: |
      What is 2,268 ÷ 36?
    options:
      - "63"
      - "603"
      - "62 R 36"
      - "81,648"
    option_explanations:
      - |
        Correct. 36 × 60 = 2,160, leaving 108. 36 × 3 = 108, leaving 0. 60 + 3 = 63.
      - |
        603 puts a 0 in the tens place. 36 × 603 is more than 20,000. The quotient has 6 tens and 3 ones.
      - |
        A remainder of 36 is the same as the divisor, so one more group of 36 fits. 62 + 1 = 63 with nothing left over.
      - |
        81,648 is 2,268 × 36. Division asks how many groups of 36 are in 2,268.
    answer: 0

  - slug: g5math-final-q17
    type: multiple_choice
    topic_code: "5.OA.A.1"
    source: "IM K–5 Math Grade 5, Unit 4, Section C"
    points: 1
    prompt: |
      What is the value of 5 × [18 − (4 + 2)]?
    options:
      - "88"
      - "60"
      - "80"
      - "120"
    option_explanations:
      - |
        88 is 5 × 18 − 4 + 2, which ignores the brackets. The 5 multiplies everything inside the brackets.
      - |
        Correct. Parentheses: 4 + 2 = 6. Brackets: 18 − 6 = 12. Then 5 × 12 = 60.
      - |
        80 is 5 × (18 − 4 + 2) = 5 × 16. The parentheses mean 4 + 2 is found first, and the whole 6 is subtracted.
      - |
        120 is 5 × (18 + 4 + 2). The minus sign means 4 + 2 is taken away from 18.
    answer: 1

  - slug: g5math-final-q18
    type: short_answer
    topic_code: "5.NBT.B.6"
    source: "IM K–5 Math Grade 5, Unit 4, Section C"
    points: 3
    prompt: |
      An art teacher buys 28 boxes of craft sticks. Each box holds 75 sticks.

      (a) How many craft sticks does she buy? Show your work.
      (b) She shares all the sticks equally among 35 classes. How many sticks does each class get? Show your work.
      (c) Check your answer to (b) by multiplying.
    answer: |
      (a) 28 × 75: 28 × 5 = 140 and 28 × 70 = 1,960. 140 + 1,960 = 2,100 sticks.
      (b) 2,100 ÷ 35: 35 × 60 = 2,100, so each class gets 60 sticks.
      (c) 35 × 60 = 2,100, which matches the total.
    explanation: |
      Three points.

      (a) 1 pt: 2,100 sticks, with the multiplication shown (the standard algorithm, partial products or an area model).

      (b) 1 pt: 60 sticks, from dividing the total by 35. If (a) is wrong, award this point for a correct division of the student's own total.

      (c) 1 pt: a multiplication of the quotient by 35 that gets back to the total, with a note that it matches.

  - slug: g5math-final-q19
    type: true_false
    topic_code: "5.NBT.B.5"
    source: "IM K–5 Math Grade 5, Unit 4, Section A"
    points: 1
    prompt: |
      True or false: 40 × 500 = 2,000.
    answer: false
    explanation: |
      False. 4 × 5 = 20, and 4 tens × 5 hundreds = 20 thousands, which is 20,000. 2,000 is only 4 × 500.

  # ---- Unit 5 · Place value and decimal operations
  - slug: g5math-final-q20
    type: multiple_choice
    topic_code: "5.NBT.A.3"
    source: "IM K–5 Math Grade 5, Unit 5, Section A"
    points: 1
    stimulus: |
      Use the number line from 2.37 to 2.38. The space between them is split into 10 equal parts, and point P is marked.
    figure: figures/review-thousandths-line.svg
    figure_alt: "A number line labeled 2.37 at the left end and 2.38 at the right end. The space between them is split into 10 equal parts by tick marks. A red point labeled P sits on the 4th tick mark to the right of 2.37."
    prompt: |
      What number is at point P?
    options:
      - "2.47"
      - "2.304"
      - "2.374"
      - "2.364"
    option_explanations:
      - |
        2.47 is a whole tenth more than 2.37. The line only goes from 2.37 to 2.38, so P is between those numbers.
      - |
        2.304 is less than 2.37, so it cannot be on this number line.
      - |
        Correct. Each small part is one thousandth, because 0.01 split into 10 parts is 0.001. P is 4 parts past 2.370, so P = 2.374.
      - |
        2.364 is less than 2.37, so it is off the left end of this number line. Count 4 thousandths up from 2.370.
    answer: 2

  - slug: g5math-final-q21
    type: numeric
    topic_code: "5.NBT.A.4"
    source: "IM K–5 Math Grade 5, Unit 5, Section A"
    points: 1
    stimulus: |
      Use the number line from 2.37 to 2.38. The space between them is split into 10 equal parts, and point P is marked.
    prompt: |
      Round the number at point P to the nearest hundredth. Type the decimal.
    answer: { value: 2.37, tolerance: 0.001 }
    explanation: |
      P is 2.374. It is 4 thousandths past 2.37 and 6 thousandths before 2.38, so it is closer to 2.37.

  - slug: g5math-final-q22
    type: multiple_choice
    topic_code: "5.NBT.A.1"
    source: "IM K–5 Math Grade 5, Unit 5, Section A"
    points: 1
    prompt: |
      In 6.66, how does the value of the 6 in the tenths place compare with the value of the 6 in the hundredths place?
    options:
      - "It is 1/10 as much."
      - "It is the same."
      - "It is 100 times as much."
      - "It is 10 times as much."
    option_explanations:
      - |
        1/10 as much describes the hundredths 6 compared with the tenths 6. The tenths place is to the left, so it is worth more.
      - |
        The digits are the same, but their places are different. 0.6 is worth more than 0.06.
      - |
        100 times would compare places two apart, like the ones 6 and the hundredths 6. The tenths and hundredths places are next to each other.
      - |
        Correct. The tenths 6 is 0.6 and the hundredths 6 is 0.06. A place is worth 10 times the place to its right: 0.6 = 10 × 0.06.
    answer: 3

  - slug: g5math-final-q23
    type: numeric
    topic_code: "5.NBT.B.7"
    source: "IM K–5 Math Grade 5, Unit 5, Section B"
    points: 1
    prompt: |
      A pumpkin weighs 20.4 pounds. A squash weighs 7.85 pounds. How many more pounds does the pumpkin weigh? Type a decimal.
