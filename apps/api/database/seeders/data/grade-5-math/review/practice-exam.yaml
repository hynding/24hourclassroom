  - slug: g5math-final-q27
    type: multiple_choice
    topic_code: "5.MD.A.1"
    source: "IM K–5 Math Grade 5, Unit 6, Section A"
    points: 1
    prompt: |
      A bag of flour weighs 48 ounces. How many pounds is that?
    options:
      - "768 pounds"
      - "3 pounds"
      - "4 pounds"
      - "32 pounds"
    option_explanations:
      - |
        768 is 48 × 16. Pounds are bigger than ounces, so there are fewer of them: divide by 16.
      - |
        Correct. 1 pound = 16 ounces, and 48 ÷ 16 = 3 pounds.
      - |
        4 is 48 ÷ 12, which uses inches in a foot. There are 16 ounces in a pound.
      - |
        32 is 48 − 16, one pound taken away. Find how many groups of 16 ounces are in 48.
    answer: 1

  - slug: g5math-final-q28
    type: fill_blank
    topic_code: "5.NBT.A.2"
    source: "IM K–5 Math Grade 5, Unit 6, Section A"
    points: 1
    prompt: |
      In 10³, the small raised 3 is called the ____. It tells how many 10s are multiplied.
    answer: ["exponent", "the exponent", "exponents"]
    explanation: |
      The exponent 3 means 10 × 10 × 10 = 1,000.

  - slug: g5math-final-q29
    type: multiple_choice
    topic_code: "5.NF.A.1"
    source: "IM K–5 Math Grade 5, Unit 6, Section B"
    points: 1
    prompt: |
      What is 3/4 + 1/6?
    options:
      - "4/10"
      - "4/12"
      - "11/12"
      - "9/12"
    option_explanations:
      - |
        4/10 adds the numerators and the denominators. Rename both as twelfths first: 9/12 + 2/12.
      - |
        4/12 adds the numerators 3 + 1 but does not rename them. 3/4 is 9 twelfths and 1/6 is 2 twelfths.
      - |
        Correct. 3/4 = 9/12 and 1/6 = 2/12. 9/12 + 2/12 = 11/12.
      - |
        9/12 is only 3/4 renamed. Add 1/6 = 2/12 as well.
    answer: 2

  - slug: g5math-final-q30
    type: multiple_choice
    topic_code: "5.NF.A.2"
    source: "IM K–5 Math Grade 5, Unit 6, Section B"
    points: 1
    prompt: |
      Without finding the exact answer, which statement about 2/5 + 3/8 is true?
    options:
      - "It is more than 1, because 2 + 3 = 5 and 5 + 8 = 13."
      - "It is exactly 1."
      - "It is more than 1, because 8 is a big denominator."
      - "It is less than 1, because each fraction is less than 1/2."
    option_explanations:
      - |
        Adding numerators and denominators does not tell you the size of a sum. Compare each fraction with 1/2 instead.
      - |
        To make exactly 1, the parts would need to fill a whole. 2/5 and 3/8 are both less than half, so they cannot.
      - |
        A big denominator means small pieces. 3/8 is less than 4/8, which is 1/2.
      - |
        Correct. 2/5 = 4/10, which is less than 5/10 = 1/2, and 3/8 is less than 4/8 = 1/2. Two amounts each less than 1/2 add to less than 1.
    answer: 3

  - slug: g5math-final-q31
    type: multi_select
    topic_code: "5.NF.B.5"
    source: "IM K–5 Math Grade 5, Unit 6, Section C"
    points: 2
    partial_credit: true
    prompt: |
      Without multiplying, which products are greater than 20? Select all that apply.
    options:
      - "20 × 7/8"
      - "20 × 1 1/4"
      - "20 × 1"
      - "20 × 3/2"
      - "20 × 5/3"
    option_explanations:
      - |
        No. 7/8 is less than 1, so 20 × 7/8 is less than 20.
      - |
        Yes. 1 1/4 is more than 1, so the product is more than 20. (It is 25.)
      - |
        No. Multiplying by 1 keeps the number the same, so 20 × 1 = 20, which is not greater than 20.
      - |
        Yes. 3/2 is more than 1, so the product is more than 20. (It is 30.)
      - |
        Yes. 5/3 is more than 1, because 5 is more than 3. So 20 × 5/3 is more than 20.
    answer: [1, 3, 4]

