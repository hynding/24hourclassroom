  # ---- Unit 8 · Putting it all together
  - slug: g5math-final-q37
    type: multiple_choice
    topic_code: "5.MD.C.5"
    source: "IM K–5 Math Grade 5, Unit 8, Section B"
    points: 1
    prompt: |
      A planter is made of two boxes joined together. One box is 4 ft by 2 ft by 1 ft. The other is 3 ft by 2 ft by 2 ft. What is the volume of the planter?
    options:
      - "96 cubic feet"
      - "14 cubic feet"
      - "12 cubic feet"
      - "20 cubic feet"
    option_explanations:
      - |
        96 is 8 × 12, the two volumes multiplied. Two boxes joined together hold their two volumes added.
      - |
        14 adds all the edges, 4 + 2 + 1 + 3 + 2 + 2. Volume multiplies the edges of each box.
      - |
        12 is only the second box, 3 × 2 × 2. Add the first box, 4 × 2 × 1 = 8.
      - |
        Correct. 4 × 2 × 1 = 8 and 3 × 2 × 2 = 12. 8 + 12 = 20 cubic feet.
    answer: 3

