      - "Each Pattern B term is 9 times the matching Pattern A term."
      - "Each Pattern B term is 3 times the matching Pattern A term."
      - "Each Pattern B term is 3 less than the matching Pattern A term."
    option_explanations:
      - |
        6 more works only for the second terms (3 and 9). The third terms are 6 and 18, which are 12 apart.
      - |
        9 is what Pattern B adds each time. The terms 3 and 9, or 6 and 18, show that B is 3 times A.
      - |
        Correct. The terms are A: 0, 3, 6, 9 and B: 0, 9, 18, 27. Each B term is 3 times the A term, because 9 is 3 times 3.
