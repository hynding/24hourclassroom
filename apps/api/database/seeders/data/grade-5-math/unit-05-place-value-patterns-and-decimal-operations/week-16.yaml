week: 16
unit: 5
title: "Comparing and Rounding Decimals"
topics: ["5.NBT.A.4"]
guide: guides/week-16.md
guide_description: |
  How to compare and order decimals to thousandths place by place, why more digits does not mean a greater
  number, and how to round a decimal to the nearest whole number, tenth or hundredth with a number line or
  the digit to the right.
flashcards_description: |
  18 cards on comparing decimals place by place, writing zeros to compare, ordering, rounding to the nearest
  whole number, tenth and hundredth, halfway numbers, and rounding that carries into the next place.

flashcards:
  - front: Comparing 0.462 and 0.48 → where to start
    back: |
      Line up the decimal points and compare from the left. The ones match (0), the tenths match (4), and the hundredths decide: 8 is more than 6, so 0.48 is greater.
    topic_code: "5.NBT.A.3"
  - front: Writing zeros to compare 0.7 and 0.695 → how it helps
    back: |
      Write 0.7 as 0.700. Now both numbers are in thousandths: 700 thousandths is more than 695 thousandths.
    topic_code: "5.NBT.A.3"
  - front: 3.05 or 3.005 → which is greater
    back: |
      3.05. It has 5 hundredths (50 thousandths). 3.005 has only 5 thousandths.
    topic_code: "5.NBT.A.3"
  - front: The decimal with more digits → is it always greater
    back: |
      No. 0.6 is greater than 0.599, even though 0.599 has more digits. Compare place by place.
    topic_code: "5.NBT.A.3"
  - front: 0.35, 0.305, 0.4, 0.053 → least to greatest
    back: |
      0.053, 0.305, 0.35, 0.4. In thousandths they are 53, 305, 350 and 400.
    topic_code: "5.NBT.A.3"
  - front: Rounding a decimal → what it means
    back: |
      Finding the closest number that stops at a chosen place. 4.63 rounded to the nearest tenth is 4.6, because 4.63 is closer to 4.6 than to 4.7.
    topic_code: "5.NBT.A.4"
  - front: Rounding with a number line → the two numbers to mark
    back: |
      The two numbers at the place you want that the decimal sits between. For 2.37 to the nearest tenth, mark 2.3 and 2.4, and see which one 2.37 is closer to.
    topic_code: "5.NBT.A.4"
  - front: Rounding to the nearest tenth → which digit to look at
    back: |
      The hundredths digit, one place to the right. 0 to 4 rounds down; 5 to 9 rounds up.
    topic_code: "5.NBT.A.4"
  - front: Rounding to the nearest hundredth → which digit to look at
    back: |
      The thousandths digit. 15.372 rounds to 15.37, because the thousandths digit is 2.
    topic_code: "5.NBT.A.4"
  - front: 7.48 → to the nearest whole number
    back: |
      7. The tenths digit is 4, so 7.48 is closer to 7 than to 8.
    topic_code: "5.NBT.A.4"
  - front: 6.25 → to the nearest tenth
    back: |
      6.3. 6.25 is exactly halfway between 6.2 and 6.3, and a halfway number rounds up.
    topic_code: "5.NBT.A.4"
  - front: 9.96 → to the nearest tenth
    back: |
      10.0. 9.96 is between 9.9 and 10.0 and closer to 10.0. Rounding up 9 tenths makes 10 tenths, which is 1 whole.
    topic_code: "5.NBT.A.4"
  - front: 2.995 → to the nearest hundredth
    back: |
      3.00. It sits halfway between 2.99 and 3.00, so it rounds up. Keep both zeros to show it was rounded to hundredths.
    topic_code: "5.NBT.A.4"
  - front: 0.849 → to the nearest tenth
    back: |
      0.8. Look only at the hundredths digit, 4. Do not round the 9 first and then round again.
    topic_code: "5.NBT.A.4"
  - front: Halfway between 4.6 and 4.7 → the number
    back: |
      4.65. On a number line in hundredths from 4.6 to 4.7, it is the middle tick.
    topic_code: "5.NBT.A.4"
  - front: Numbers that round to 5.2 (nearest tenth) → smallest and largest with hundredths
    back: |
      From 5.15 up to 5.24. 5.15 rounds up to 5.2, and 5.25 would round up to 5.3.
    topic_code: "5.NBT.A.4"
  - front: Rounding money to the nearest dollar → example
    back: |
      $12.49 rounds to $12 and $12.50 rounds to $13. Look at the tenths (dimes) digit.
    topic_code: "5.NBT.A.4"
  - front: Race times → who is fastest
    back: |
      The runner with the least time. Compare the times place by place and pick the smallest.
    topic_code: "5.NBT.A.3"

quiz:
  description: |
    15 questions · about 30 minutes · comparing and ordering decimals to thousandths, and rounding decimals to
    the nearest whole number, tenth and hundredth, plus review of place value, volume and fractions as
    division. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word
    is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g5math-w16-q01
      type: multiple_choice
      topic_code: "5.NBT.A.3"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      stimulus: |
        Use the table of race times. The runner with the least time is the fastest.
      figure: figures/w16-race-times.svg
      figure_alt: "A table titled Race Times with two columns, Runner and Time (seconds). Keiko 12.408. Mateo 12.48. Zara 12.084. Sami 12.4."
      prompt: |
        Who ran the fastest?
      options:
        - "Sami"
        - "Keiko"
        - "Zara"
        - "Mateo"
      option_explanations:
        - |
          Sami's time, 12.4, has the fewest digits, but that does not make it the least. 12.4 = 12.400, which is more than Zara's 12.084.
        - |
          Keiko's 12.408 has 4 tenths. Zara's 12.084 has 0 tenths, so Zara's time is less and she was faster.
        - |
          Correct. All the times have 12 wholes. Zara's 12.084 is the only one with 0 tenths, so it is the least time.
        - |
          Mateo's 12.48 is actually the greatest time, so he was the slowest. 48 hundredths beats every other runner's tenths and hundredths.
      answer: 2

    - slug: g5math-w16-q02
      type: multiple_choice
      topic_code: "5.NBT.A.3"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      stimulus: |
        Use the table of race times. The runner with the least time is the fastest.
      prompt: |
        Which list puts the four times in order from least to greatest?
      options:
        - "12.084, 12.4, 12.408, 12.48"
        - "12.4, 12.48, 12.084, 12.408"
        - "12.48, 12.408, 12.4, 12.084"
        - "12.084, 12.408, 12.4, 12.48"
      option_explanations:
        - |
          Correct. In thousandths after the 12 they are 084, 400, 408 and 480, so 12.084 is least and 12.48 is greatest.
        - |
          This list orders the times by how many digits they have. Compare place by place instead: 12.084 has the fewest tenths.
        - |
          This list is from greatest to least, the reverse of what was asked.
        - |
          This list puts 12.408 before 12.4. But 12.4 = 12.400, and 400 thousandths is less than 408 thousandths, so 12.4 comes first.
      answer: 0

    - slug: g5math-w16-q03
      type: numeric
      topic_code: "5.NBT.A.4"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      stimulus: |
        Use the table of race times. The runner with the least time is the fastest.
      prompt: |
        Round Mateo's time to the nearest tenth of a second. Type a decimal with one place after the decimal point.
      answer: { value: 12.5, tolerance: 0.001 }
      explanation: |
        Mateo ran 12.48 seconds. It is between 12.4 and 12.5. The hundredths digit is 8, so it rounds up to 12.5.

    - slug: g5math-w16-q04
      type: multiple_choice
      topic_code: "5.NBT.A.4"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      figure: figures/w16-round-line.svg
      figure_alt: "A number line titled Hundredths from 4.6 to 4.7, split into 10 equal parts. It is labeled 4.6 at the left end, 4.65 at the longer middle tick and 4.7 at the right end. A red point labeled Q sits on the third tick after 4.6."
      prompt: |
        Point Q is on the number line from 4.6 to 4.7. What is the number at point Q rounded to the nearest tenth?
      options:
        - "4.7"
        - "4.6"
        - "4.65"
        - "5"
      option_explanations:
        - |
          4.7 is the far end of the line. Point Q is at 4.63, only 3 hundredths from 4.6 but 7 hundredths from 4.7.
        - |
          Correct. Each jump is 0.01, so Q is at 4.63. It is left of the halfway mark 4.65, so it is closer to 4.6.
        - |
          4.65 is the halfway mark, and it has hundredths. Rounding to the nearest tenth gives a number with only tenths.
        - |
          5 is 4.63 rounded to the nearest whole number. The question asks for the nearest tenth, which keeps one place after the decimal point.
      answer: 1

    - slug: g5math-w16-q05
      type: multi_select
      topic_code: "5.NBT.A.4"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 2
      partial_credit: true
      prompt: |
        Which numbers round to 8.3 when rounded to the nearest tenth? Select all that apply.
      options:
        - "8.25"
        - "8.34"
        - "8.35"
        - "8.249"
        - "8.306"
      option_explanations:
        - |
          Rounds to 8.3. 8.25 is exactly halfway between 8.2 and 8.3, and a halfway number rounds up.
        - |
          Rounds to 8.3. The hundredths digit is 4, so 8.34 rounds down to 8.3.
        - |
          Rounds to 8.4, not 8.3. 8.35 is halfway between 8.3 and 8.4, so it rounds up.
        - |
          Rounds to 8.2, not 8.3. Look only at the hundredths digit, 4, so 8.249 rounds down. It is just below the halfway mark 8.25.
        - |
          Rounds to 8.3. The hundredths digit is 0, so 8.306 rounds down to 8.3.
      answer: [0, 1, 4]

    - slug: g5math-w16-q06
      type: numeric
      topic_code: "5.NBT.A.4"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      prompt: |
        Round 15.372 to the nearest hundredth.
      answer: { value: 15.37, tolerance: 0.001 }
      explanation: |
        15.372 is between 15.37 and 15.38. The thousandths digit is 2, so it rounds down to 15.37.

    - slug: g5math-w16-q07
      type: multiple_choice
      topic_code: "5.NBT.A.4"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      prompt: |
        Round 9.96 to the nearest tenth.
      options:
        - "9.10"
        - "9.9"
        - "9.0"
        - "10.0"
      option_explanations:
        - |
          9.10 writes the 10 tenths into the tenths place. But 10 tenths is 1 whole, so the ones digit goes up from 9 to 10.
        - |
          9.9 rounds down. The hundredths digit is 6, so 9.96 is closer to 10.0 than to 9.9.
        - |
          9.0 drops the tenths instead of rounding them. 9.96 is almost 10, far from 9.0.
        - |
          Correct. 9.96 is between 9.9 and 10.0 and closer to 10.0. Rounding up 9 tenths makes 10 tenths, which is one more whole: 10.0.
      answer: 3

    - slug: g5math-w16-q08
      type: true_false
      topic_code: "5.NBT.A.3"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      prompt: |
        True or false: 0.7 is greater than 0.695.
      answer: true
      explanation: |
        True. Write 0.7 as 0.700. 700 thousandths is more than 695 thousandths. (Or compare tenths: 7 tenths is more than 6 tenths.)

    - slug: g5math-w16-q09
      type: fill_blank
      topic_code: "5.NBT.A.3"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      prompt: |
        Decimals that name the same amount, like 0.5 and 0.500, are called ____ decimals.
      answer: ["equivalent", "equal"]
      explanation: |
        Equivalent decimals name the same amount. 0.5 is 5 tenths and 0.500 is 500 thousandths, which is the same amount.

    - slug: g5math-w16-q10
      type: multiple_choice
      topic_code: "5.NBT.A.3"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      prompt: |
        Which comparison is true?
      options:
        - "0.209 is greater than 0.21."
        - "3.05 is greater than 3.005."
        - "1.5 is less than 1.499."
        - "0.40 is greater than 0.4."
      option_explanations:
        - |
          False. 0.21 = 0.210, and 210 thousandths is more than 209 thousandths, so 0.209 is less.
        - |
          Correct. 3.05 = 3.050. 50 thousandths is more than 5 thousandths, so 3.05 is greater.
        - |
          False. Both have 1 whole. 1.5 has 5 tenths and 1.499 has only 4 tenths, so 1.5 is greater.
        - |
          False. 0.40 and 0.4 are equal: 40 hundredths is the same as 4 tenths.
      answer: 1

    - slug: g5math-w16-q11
      type: multiple_choice
      topic_code: "5.NBT.A.4"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      prompt: |
        A puppy has a mass of 7.48 kilograms. What is its mass to the nearest whole kilogram?
      options:
        - "7 kilograms"
        - "8 kilograms"
        - "7.5 kilograms"
        - "7.4 kilograms"
      option_explanations:
        - |
          Correct. For the nearest whole number, look at the tenths digit, 4. 7.48 is less than the halfway mark 7.5, so it rounds down to 7.
        - |
          8 kilograms rounds up because of the 8 in the hundredths place. For the nearest whole number, only the tenths digit matters, and it is 4.
        - |
          7.5 kilograms is 7.48 rounded to the nearest tenth, not to the nearest whole number.
        - |
          7.4 kilograms cuts off the hundredths. That is not rounding to a whole number, and 7.48 is closer to 7.5 than to 7.4 anyway.
      answer: 0

    - slug: g5math-w16-q12
      type: multiple_choice
      topic_code: "5.NBT.A.1"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      prompt: |
        What is 10 times 0.07?
      options:
        - "0.007"
        - "10.07"
        - "7"
        - "0.7"
      option_explanations:
        - |
          0.007 is 1/10 of 0.07. Multiplying by 10 makes each digit worth 10 times as much, so it moves one place to the left.
        - |
          10.07 adds 10 instead of multiplying by 10.
        - |
          7 is 100 times 0.07. Multiplying by 10 moves the 7 only one place, from hundredths to tenths.
        - |
          Correct. 10 × 7 hundredths = 70 hundredths = 7 tenths, or 0.7.
      answer: 3

    - slug: g5math-w16-q13
      type: numeric
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      prompt: |
        A box is 12 centimeters long, 5 centimeters wide and 4 centimeters tall. What is its volume in cubic centimeters?
      answer: { value: 240, tolerance: 0 }
      explanation: |
        Volume = length × width × height = 12 × 5 × 4 = 60 × 4 = 240 cubic centimeters.

    - slug: g5math-w16-q14
      type: multiple_choice
      topic_code: "5.NF.B.3"
      source: "IM K–5 Math Grade 5, Unit 2, Section A"
      points: 1
      prompt: |
        Six friends share 4 sandwiches equally. How much does each friend get?
      options:
        - "6/4 of a sandwich"
        - "1/6 of a sandwich"
        - "2/3 of a sandwich"
        - "1/4 of a sandwich"
      option_explanations:
        - |
          6/4 is 6 ÷ 4, which would be 6 sandwiches shared by 4 friends. Here 4 sandwiches are shared by 6 friends: 4 ÷ 6.
        - |
          1/6 of a sandwich is what each friend gets from just one sandwich. There are 4 sandwiches, so each friend gets 4 sixths.
        - |
          Correct. 4 ÷ 6 = 4/6 of a sandwich, which is the same as 2/3. Each friend gets less than one whole sandwich.
        - |
          1/4 of a sandwich would come from sharing 1 sandwich among 4 people. Each friend gets 4 ÷ 6 = 4/6 = 2/3.
      answer: 2

    - slug: g5math-w16-q15
      type: short_answer
      topic_code: "5.NBT.A.4"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 2
      prompt: |
        Hana says 2.305 is greater than 2.35 because it has more digits.

        (a) Which number is greater? Explain using place value.
        (b) Round both numbers to the nearest tenth.
      answer: |
        (a) 2.35 is greater. Both have 2 ones and 3 tenths. In the hundredths place, 2.35 has 5 and 2.305 has 0, so 2.35 is greater. (Or: 2.35 = 2.350, and 350 thousandths is more than 305 thousandths.)
        (b) 2.305 rounds to 2.3 (the hundredths digit is 0). 2.35 rounds to 2.4 (it is halfway between 2.3 and 2.4, so it rounds up).
      explanation: |
        Two points.

        (a) 1 pt: 2.35 with a place-value reason (hundredths 5 beats 0, or 350 thousandths is more than 305 thousandths). "More digits" reasoning does not earn the point.

        (b) 1 pt: both roundings correct, 2.3 and 2.4.
