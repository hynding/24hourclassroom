week: 19
unit: 5
title: "Dividing Decimals"
topics: ["5.NBT.B.7"]
guide: guides/week-19.md
guide_description: |
  How to divide a decimal by a whole number by sharing tenths and hundredths, how to find how many tenths or
  other decimals fit into a number, why dividing by a number less than 1 gives a greater answer, and how to
  check a quotient by multiplying.
flashcards_description: |
  18 cards on sharing decimals equally, tape diagrams and number lines for division, dividing by 0.1 and other
  decimals, thinking in tenths and hundredths, checking with multiplication, and money problems.

flashcards:
  - front: 2.4 ÷ 3 → thinking in tenths
    back: |
      2.4 is 24 tenths. 24 tenths ÷ 3 = 8 tenths, so 2.4 ÷ 3 = 0.8.
    topic_code: "5.NBT.B.7"
  - front: 1.56 ÷ 4 → thinking in hundredths
    back: |
      1.56 is 156 hundredths. 156 ÷ 4 = 39, so 1.56 ÷ 4 = 0.39.
    topic_code: "5.NBT.B.7"
  - front: 4.8 meters cut into 4 equal pieces → each piece
    back: |
      1.2 meters. 4 ÷ 4 = 1 and 0.8 ÷ 4 = 0.2, so each piece is 1 + 0.2 = 1.2 meters.
    topic_code: "5.NBT.B.7"
  - front: Tape diagram for 6.3 ÷ 3 → what it shows
    back: |
      A tape labeled 6.3 split into 3 equal parts. Each part is 2.1.
    topic_code: "5.NBT.B.7"
  - front: Checking 7.2 ÷ 9 = 0.8 → how
    back: |
      Multiply the quotient by the divisor: 9 × 0.8 = 7.2. It matches, so the division is right.
    topic_code: "5.NBT.B.7"
  - front: 3 ÷ 0.1 → quotient
    back: |
      30. There are 10 tenths in each whole, so 3 wholes hold 30 tenths.
    topic_code: "5.NBT.B.7"
  - front: 2 ÷ 0.01 → quotient
    back: |
      200. There are 100 hundredths in each whole, so 2 wholes hold 200 hundredths.
    topic_code: "5.NBT.B.7"
  - front: "2 ÷ 0.4 → as a question"
    back: |
      "How many 0.4s fit in 2?" On a number line, jumps of 0.4 reach 2 in 5 jumps, so 2 ÷ 0.4 = 5.
    topic_code: "5.NBT.B.7"
  - front: 1.2 ÷ 0.3 → thinking in tenths
    back: |
      1.2 is 12 tenths and 0.3 is 3 tenths. 12 tenths ÷ 3 tenths = 4, so 1.2 ÷ 0.3 = 4.
    topic_code: "5.NBT.B.7"
  - front: 0.36 ÷ 0.04 → thinking in hundredths
    back: |
      36 hundredths ÷ 4 hundredths = 9. So 0.36 ÷ 0.04 = 9.
    topic_code: "5.NBT.B.7"
  - front: Dividing by a number less than 1 → bigger or smaller answer
    back: |
      Bigger than the number you started with. 6 ÷ 0.5 = 12, because 12 halves fit in 6.
    topic_code: "5.NBT.B.7"
  - front: 4 ÷ 0.5 → quotient
    back: |
      8. Each whole holds 2 halves, so 4 wholes hold 8 halves.
    topic_code: "5.NBT.B.7"
  - front: 2 liters poured into 0.25-liter cups → number of cups
    back: |
      8 cups. Each liter fills 4 cups of 0.25 liter, so 2 liters fill 8. Check: 8 × 0.25 = 2.
    topic_code: "5.NBT.B.7"
  - front: $9.60 shared by 4 people → each share
    back: |
      $2.40. $8 ÷ 4 = $2 and $1.60 ÷ 4 = $0.40. $2 + $0.40 = $2.40.
    topic_code: "5.NBT.B.7"
  - front: Dividing a decimal by a whole number → where the decimal point goes
    back: |
      Line it up above the decimal point in the number being divided. In 8.4 ÷ 2 = 4.2, the 8 ones share into 4 ones and the 4 tenths into 2 tenths.
    topic_code: "5.NBT.B.7"
  - front: Estimating 7.8 ÷ 4 → how
    back: |
      7.8 is about 8, and 8 ÷ 4 = 2. The exact quotient, 1.95, is close to 2.
    topic_code: "5.NBT.B.7"
  - front: 0.6 ÷ 3 → quotient
    back: |
      0.2. 6 tenths shared into 3 equal groups is 2 tenths in each group.
    topic_code: "5.NBT.B.7"
  - front: Quotient → what it is
    back: |
      The answer to a division. In 7.2 ÷ 9 = 0.8, the quotient is 0.8.
    topic_code: "5.NBT.B.7"

quiz:
  description: |
    15 questions · about 30 minutes · dividing decimals by whole numbers, dividing whole numbers and decimals by
    tenths, tape diagrams and number lines for division, and checking a quotient, plus review of powers of 10,
    rounding and expressions. Multiple choice, select-all, true/false and number answers are graded at once;
    the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g5math-w19-q01
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section D"
      points: 1
      stimulus: |
        Use the tape diagram. A ribbon 4.8 meters long is cut into 4 equal pieces.
      figure: figures/w19-tape.svg
      figure_alt: "A tape diagram titled Cutting a 4.8-Meter Ribbon. A bracket over the whole tape is labeled 4.8 m. The tape is split into 4 equal parts, and each part shows a red question mark."
      prompt: |
        How long is each piece?
      options:
        - "0.12 meter"
        - "1.2 meters"
        - "12 meters"
        - "19.2 meters"
      option_explanations:
        - |
          0.12 meter is 12 hundredths. 4.8 is 48 tenths, and 48 tenths ÷ 4 = 12 tenths, which is 1.2.
        - |
          Correct. 4 ÷ 4 = 1 and 0.8 ÷ 4 = 0.2, so each piece is 1.2 meters. Check: 4 × 1.2 = 4.8.
        - |
          12 meters is longer than the whole ribbon. Each piece must be shorter than 4.8 meters.
        - |
          19.2 meters multiplies 4.8 by 4. Cutting into 4 equal pieces divides the length by 4.
      answer: 1

    - slug: g5math-w19-q02
      type: numeric
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section D"
      points: 1
      stimulus: |
        Use the tape diagram. A ribbon 4.8 meters long is cut into 4 equal pieces.
      prompt: |
        Then each piece is cut in half. How long is each small piece, in meters? Type the decimal.
      answer: { value: 0.6, tolerance: 0.001 }
      explanation: |
        Each piece is 1.2 meters, and 1.2 ÷ 2 = 0.6 (12 tenths ÷ 2 = 6 tenths). Check: 4.8 ÷ 8 small pieces = 0.6, because 8 × 0.6 = 4.8.

    - slug: g5math-w19-q03
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section D"
      points: 1
      figure: figures/w19-jumps.svg
      figure_alt: "A number line titled Jumps of 0.4 from 0 to 2, with tick marks labeled 0, 0.4, 0.8, 1.2, 1.6 and 2. Five equal arcs, each labeled 0.4, jump from 0 to 0.4, 0.4 to 0.8, 0.8 to 1.2, 1.2 to 1.6 and 1.6 to 2."
      prompt: |
        The number line shows how many jumps of 0.4 it takes to get from 0 to 2. What is 2 ÷ 0.4?
      options:
        - "5"
        - "6"
        - "0.5"
        - "0.8"
      option_explanations:
        - |
          Correct. Five jumps of 0.4 reach 2, so 2 ÷ 0.4 = 5. Check: 5 × 0.4 = 2.
        - |
          6 counts the tick marks, including the one at 0. Count the jumps (the arcs) instead: there are 5.
        - |
          0.5 is 2 ÷ 4. Dividing by 0.4, a number less than 1, gives a quotient greater than 2.
        - |
          0.8 is 2 × 0.4, which is where the second jump lands. The question asks how many jumps fit in 2.
      answer: 0

    - slug: g5math-w19-q04
      type: numeric
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section D"
      points: 1
      prompt: |
        What is 2.4 ÷ 6? Type the decimal.
      answer: { value: 0.4, tolerance: 0.001 }
      explanation: |
        2.4 is 24 tenths. 24 tenths ÷ 6 = 4 tenths, so 2.4 ÷ 6 = 0.4. Check: 6 × 0.4 = 2.4.

    - slug: g5math-w19-q05
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section D"
      points: 1
      prompt: |
        What is 1.56 ÷ 4?
      options:
        - "3.9"
        - "6.24"
        - "0.39"
        - "0.4"
      option_explanations:
        - |
          3.9 has the right digits but the decimal point is in the wrong place. 1.56 ÷ 4 must be less than 1.56.
        - |
          6.24 multiplies 1.56 by 4. Sharing into 4 groups divides.
        - |
          Correct. 1.56 is 156 hundredths. 156 ÷ 4 = 39, so the quotient is 39 hundredths, 0.39. Check: 4 × 0.39 = 1.56.
        - |
          0.4 is a close estimate (1.6 ÷ 4), not the exact quotient. 4 × 0.4 = 1.6, which is more than 1.56.
      answer: 2

    - slug: g5math-w19-q06
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section D"
      points: 1
      prompt: |
        What is 3 ÷ 0.1?
      options:
        - "0.3"
        - "3"
        - "300"
        - "30"
      option_explanations:
        - |
          0.3 is 3 × 0.1. The division asks how many tenths fit in 3.
        - |
          3 would be 3 ÷ 1. A tenth is smaller than 1, so more of them fit into 3.
        - |
          300 is 3 ÷ 0.01, the number of hundredths in 3. There are only 10 tenths in each whole.
        - |
          Correct. Each whole holds 10 tenths, so 3 wholes hold 30 tenths. 3 ÷ 0.1 = 30.
      answer: 3

    - slug: g5math-w19-q07
      type: multi_select
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section D"
      points: 2
      partial_credit: true
      prompt: |
        Which quotients are greater than 6? Select all that apply.
      options:
        - "6 ÷ 0.5"
        - "6 ÷ 2"
        - "3 ÷ 0.1"
        - "0.6 ÷ 3"
        - "1.8 ÷ 0.2"
      option_explanations:
        - |
          Greater than 6. 6 ÷ 0.5 = 12, because 12 halves fit in 6.
        - |
          Not greater. 6 ÷ 2 = 3. Dividing by a number greater than 1 gives less than 6.
        - |
          Greater than 6. 3 ÷ 0.1 = 30, because 3 wholes hold 30 tenths.
        - |
          Not greater. 0.6 ÷ 3 = 0.2: 6 tenths shared into 3 groups is 2 tenths each.
        - |
          Greater than 6. 1.8 ÷ 0.2 = 9, because 18 tenths ÷ 2 tenths = 9.
      answer: [0, 2, 4]

    - slug: g5math-w19-q08
      type: true_false
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section D"
      points: 1
      prompt: |
        True or false: 4 ÷ 0.5 = 2.
      answer: false
      explanation: |
        False. 4 ÷ 0.5 asks how many halves fit in 4. Each whole holds 2 halves, so 4 wholes hold 8: 4 ÷ 0.5 = 8. (4 ÷ 2 = 2 is a different problem.)

    - slug: g5math-w19-q09
      type: fill_blank
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section D"
      points: 1
      prompt: |
        In 7.2 ÷ 9 = 0.8, the answer 0.8 is called the ____.
      answer: ["quotient", "the quotient", "quotients"]
      explanation: |
        The answer to a division is the quotient. Check it by multiplying: 9 × 0.8 = 7.2.

    - slug: g5math-w19-q10
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section D"
      points: 1
      prompt: |
        Four friends share a $9.60 lunch bill equally. How much does each friend pay?
      options:
        - "$2.04"
        - "$38.40"
        - "$24.00"
        - "$2.40"
      option_explanations:
        - |
          $2.04 puts the 4 in the hundredths place. $1.60 ÷ 4 = $0.40, which is 4 tenths of a dollar (40 cents), not 4 cents.
        - |
          $38.40 multiplies $9.60 by 4. Sharing a bill among 4 friends divides it.
        - |
          $24.00 has the right digits but the decimal point is in the wrong place. Each share must be less than the whole $9.60 bill.
        - |
          Correct. $8 ÷ 4 = $2 and $1.60 ÷ 4 = $0.40, so each friend pays $2.40. Check: 4 × $2.40 = $9.60.
      answer: 3

    - slug: g5math-w19-q11
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section D"
      points: 1
      prompt: |
        What is 1.2 ÷ 0.3?
      options:
        - "4"
        - "0.4"
        - "40"
        - "0.36"
      option_explanations:
        - |
          Correct. 1.2 is 12 tenths and 0.3 is 3 tenths. 12 tenths ÷ 3 tenths = 4. Check: 4 × 0.3 = 1.2.
        - |
          0.4 is 1.2 ÷ 3. Dividing by 0.3, which is less than 1, gives a quotient greater than 1.2.
        - |
          40 is too big. 40 × 0.3 = 12, which is ten times 1.2.
        - |
          0.36 multiplies 1.2 by 0.3 instead of dividing.
      answer: 0

    - slug: g5math-w19-q12
      type: multiple_choice
      topic_code: "5.NBT.A.2"
      source: "IM K–5 Math Grade 5, Unit 5, Section C"
      points: 1
      prompt: |
        What is 0.62 × 1,000?
      options:
        - "62"
        - "6,200"
        - "620"
        - "0.62000"
      option_explanations:
        - |
          62 is 0.62 × 100. Multiplying by 1,000 moves each digit three places to the left, not two.
        - |
          6,200 moves the digits four places. 1,000 has three zeros, so the digits move three places: 620.
        - |
          Correct. Each digit moves three places to the left: the 6 tenths become 6 hundreds. 0.62 × 1,000 = 620.
        - |
          0.62000 only writes zeros after the decimal point, which does not change the value. It is still 0.62.
      answer: 2

    - slug: g5math-w19-q13
      type: numeric
      topic_code: "5.NBT.A.4"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      prompt: |
        Round 3.476 to the nearest tenth. Type a decimal with one place after the decimal point.
      answer: { value: 3.5, tolerance: 0.001 }
      explanation: |
        3.476 is between 3.4 and 3.5. The hundredths digit is 7, so it rounds up to 3.5.

    - slug: g5math-w19-q14
      type: multiple_choice
      topic_code: "5.OA.A.1"
      source: "IM K–5 Math Grade 5, Unit 4, Section C"
      points: 1
      prompt: |
        What is the value of 2 × (3.5 + 1.5)?
      options:
        - "8.5"
        - "10"
        - "7"
        - "5"
      option_explanations:
        - |
          8.5 multiplies 2 × 3.5 first and then adds 1.5. The parentheses say to add first.
        - |
          Correct. Parentheses first: 3.5 + 1.5 = 5. Then 2 × 5 = 10.
        - |
          7 is 2 × 3.5, which leaves out the 1.5 inside the parentheses.
        - |
          5 is the value inside the parentheses. It still has to be multiplied by 2.
      answer: 1

    - slug: g5math-w19-q15
      type: short_answer
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section D"
      points: 2
      prompt: |
        Lucia pours a 2-liter bottle of juice into cups. Each cup holds 0.25 liter.

        (a) How many cups can she fill?
        (b) Show how you know, with a drawing, a number line or a multiplication.
      answer: |
        (a) 8 cups.
        (b) 2 ÷ 0.25 = 8. Each liter fills 4 cups (0.25 + 0.25 + 0.25 + 0.25 = 1), so 2 liters fill 4 + 4 = 8 cups. Check: 8 × 0.25 = 2.
      explanation: |
        Two points.

        (a) 1 pt: 8 cups.

        (b) 1 pt: a correct reason, such as 4 cups in each liter, jumps of 0.25 on a number line from 0 to 2, or 8 × 0.25 = 2. An answer of 0.5 or 0.125 (dividing the wrong way) earns no points.
