week: 15
unit: 5
title: "Decimals to Thousandths"
topics: ["5.NBT.A.3", "5.NBT.A.1"]
guide: guides/week-15.md
guide_description: |
  How a hundredth splits into 10 thousandths, how to read and write decimals to the thousandths place in
  standard, word and expanded form, how to find them on a number line, and why each place is worth 10 times
  the place to its right and one tenth of the place to its left.
flashcards_description: |
  19 cards on the thousandths place, reading and writing decimals in words and expanded form, equivalent
  decimals, thousandths on a number line, and the 10 times and one tenth patterns between places.

flashcards:
  - front: Thousandths place → where it is
    back: |
      The third place to the right of the decimal point. In 0.274, the 4 means 4 thousandths.
    topic_code: "5.NBT.A.3"
  - front: One thousandth → as a fraction and a decimal
    back: |
      1/1000, written 0.001. It is one of 1,000 equal parts of a whole.
    topic_code: "5.NBT.A.3"
  - front: One hundredth split into 10 equal parts → what each part is
    back: |
      One thousandth, 0.001. Ten thousandths make one hundredth: 10 × 0.001 = 0.01.
    topic_code: "5.NBT.A.1"
  - front: Places after the decimal point → names in order
    back: |
      Tenths, hundredths, thousandths. Each place is one tenth the size of the place to its left.
    topic_code: "5.NBT.A.3"
  - front: 0.538 → how to say it
    back: |
      "Five hundred thirty-eight thousandths." Read the digits as a whole number, then say the name of the last place.
    topic_code: "5.NBT.A.3"
  - front: 6.072 → how to say it
    back: |
      "Six and seventy-two thousandths." Say "and" for the decimal point.
    topic_code: "5.NBT.A.3"
  - front: 3.405 → expanded form
    back: |
      3 + 0.4 + 0.005. There are no hundredths, so nothing is written for that place.
    topic_code: "5.NBT.A.3"
  - front: 0.926 → expanded form with fractions
    back: |
      9 × 1/10 + 2 × 1/100 + 6 × 1/1000. Each digit is multiplied by the value of its place.
    topic_code: "5.NBT.A.3"
  - front: 41/1000 → as a decimal
    back: |
      0.041. Forty-one thousandths: 0 tenths, 4 hundredths and 1 thousandth.
    topic_code: "5.NBT.A.3"
  - front: 7/1000 → as a decimal
    back: |
      0.007. Zeros hold the tenths and hundredths places so the 7 lands in the thousandths place.
    topic_code: "5.NBT.A.3"
  - front: 0.3, 0.30 and 0.300 → same or different
    back: |
      The same number. 3 tenths = 30 hundredths = 300 thousandths. Zeros at the end after the decimal point do not change the value.
    topic_code: "5.NBT.A.3"
  - front: 0.25 → how many thousandths
    back: |
      250 thousandths. 0.25 = 0.250.
    topic_code: "5.NBT.A.3"
  - front: Thousandths between 0.25 and 0.26 → how to find them
    back: |
      Split the space from 0.25 to 0.26 into 10 equal parts. Each jump is 0.001: 0.251, 0.252, and so on up to 0.259.
    topic_code: "5.NBT.A.3"
  - front: Moving one place to the left → what happens to a digit's value
    back: |
      It becomes 10 times as much. The 4 in 0.04 is worth 10 times the 4 in 0.004.
    topic_code: "5.NBT.A.1"
  - front: Moving one place to the right → what happens to a digit's value
    back: |
      It becomes 1/10 as much. The 6 in 0.06 is worth 1/10 of the 6 in 0.6.
    topic_code: "5.NBT.A.1"
  - front: Each 7 in 7.777 → its value
    back: |
      7, 0.7, 0.07 and 0.007. Each 7 is worth 10 times the 7 just to its right.
    topic_code: "5.NBT.A.1"
  - front: 10 × 0.003 → value
    back: |
      0.03. Ten thousandths make one hundredth, so ten groups of 3 thousandths make 3 hundredths.
    topic_code: "5.NBT.A.1"
  - front: 1/10 of 0.5 → value
    back: |
      0.05. One tenth of 5 tenths is 5 hundredths: the 5 moves one place to the right.
    topic_code: "5.NBT.A.1"
  - front: 0.06 and 0.006 → which is greater
    back: |
      0.06. It is 6 hundredths, which is 60 thousandths, and that is 10 times 0.006.
    topic_code: "5.NBT.A.1"

quiz:
  description: |
    15 questions · about 30 minutes · reading and writing decimals to thousandths in standard, word and
    expanded form, thousandths on a number line, and the 10 times and one tenth patterns between places, plus
    review of multiplying and dividing whole numbers, expressions with brackets and a fraction of a whole
    number. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word is
    matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g5math-w15-q01
      type: multiple_choice
      topic_code: "5.NBT.A.3"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      stimulus: |
        Use the place-value chart. Each column holds one digit of a number. The red dot is the decimal point.
      figure: figures/w15-place-value-chart.svg
      figure_alt: "A place-value chart titled Place-Value Chart with four columns: Ones, Tenths, Hundredths and Thousandths. The digits are 4 in the ones column, 0 in the tenths column, 6 in the hundredths column and 3 in the thousandths column. A red dot for the decimal point sits on the line between the ones and the tenths columns."
      prompt: |
        What number does the chart show?
      options:
        - "4.63"
        - "4.603"
        - "4.063"
        - "40.63"
      option_explanations:
        - |
          4.63 leaves out the 0 in the tenths column. Without it, the 6 moves into the tenths place and the 3 into the hundredths place.
        - |
          4.603 swaps the 0 and the 6. The chart has 0 tenths and 6 hundredths, so the digits after the point are 0, 6, 3.
        - |
          Correct. 4 ones, 0 tenths, 6 hundredths and 3 thousandths are written 4.063.
        - |
          40.63 puts the decimal point one place too far right. The 4 is in the ones column, so the point comes right after the 4.
      answer: 2

    - slug: g5math-w15-q02
      type: multiple_choice
      topic_code: "5.NBT.A.3"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      stimulus: |
        Use the place-value chart. Each column holds one digit of a number. The red dot is the decimal point.
      prompt: |
        Which shows the number on the chart in expanded form?
      options:
        - "4 + 0.06 + 0.003"
        - "4 + 0.6 + 0.03"
        - "4 + 0.006 + 0.03"
        - "0.4 + 0.06 + 0.003"
      option_explanations:
        - |
          Correct. 4 ones is 4, 6 hundredths is 0.06 and 3 thousandths is 0.003. The tenths digit is 0, so nothing is added for it.
        - |
          4 + 0.6 + 0.03 treats the 6 as tenths and the 3 as hundredths. The chart shows 0 tenths, so the 6 is in the hundredths place.
        - |
          4 + 0.006 + 0.03 swaps the places of the 6 and the 3. The 6 is in the hundredths column (0.06) and the 3 is in the thousandths column (0.003).
        - |
          0.4 + 0.06 + 0.003 writes the 4 as 4 tenths. The 4 sits in the ones column, so it is worth 4, not 0.4.
      answer: 0

    - slug: g5math-w15-q03
      type: fill_blank
      topic_code: "5.NBT.A.3"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      prompt: |
        In the number 7.215, the digit 5 is in the ____ place.
      answer: ["thousandths", "thousandth", "the thousandths", "the thousandth"]
      explanation: |
        After the decimal point come the tenths (2), the hundredths (1) and the thousandths (5). The 5 means 5 thousandths, 0.005.

    - slug: g5math-w15-q04
      type: multiple_choice
      topic_code: "5.NBT.A.3"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      figure: figures/w15-thousandths-line.svg
      figure_alt: "A number line titled Thousandths on a Number Line, from 0.25 to 0.26, with tick marks that split it into 10 equal parts. Only 0.25 and 0.26 are labeled. A red point labeled P sits on the seventh tick after 0.25, three ticks before 0.26."
      prompt: |
        The number line from 0.25 to 0.26 is split into 10 equal parts. What decimal is at point P?
      options:
        - "0.27"
        - "0.257"
        - "0.253"
        - "0.258"
      option_explanations:
        - |
          0.27 counts each jump as a hundredth. The whole line is only one hundredth long, so each of its 10 jumps is one thousandth.
        - |
          Correct. Each jump is 0.001. Point P is 7 jumps past 0.25, so it is at 0.250 + 0.007 = 0.257.
        - |
          0.253 counts the 3 jumps from P to 0.26. Count the jumps from the left end instead: there are 7 from 0.25 to P.
        - |
          0.258 counts the tick at 0.25 as the first one. Count jumps, not tick marks: P is 7 jumps after 0.25.
      answer: 1

    - slug: g5math-w15-q05
      type: numeric
      topic_code: "5.NBT.A.1"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      prompt: |
        0.04 is equal to how many thousandths?
      answer: { value: 40, tolerance: 0 }
      explanation: |
        One hundredth is 10 thousandths, so 4 hundredths is 4 × 10 = 40 thousandths. In symbols, 0.04 = 0.040.

    - slug: g5math-w15-q06
      type: multiple_choice
      topic_code: "5.NBT.A.1"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      prompt: |
        Look at the number 3.333. How does the value of the 3 in the tenths place compare with the value of the 3 in the hundredths place?
      options:
        - "It is 1/10 as much."
        - "It is the same value, because both digits are 3."
        - "It is 100 times as much."
        - "It is 10 times as much."
      option_explanations:
        - |
          1/10 as much would be true the other way around: the 3 in the hundredths place is 1/10 of the 3 in the tenths place.
        - |
          The digits are the same, but their places are not. A 3 in the tenths place is worth 0.3 and a 3 in the hundredths place is worth 0.03.
        - |
          100 times as much compares places that are two apart, like the tenths and the thousandths. The tenths place is just one place to the left of the hundredths place.
        - |
          Correct. The 3 in the tenths place is worth 0.3 and the 3 in the hundredths place is worth 0.03. 10 × 0.03 = 0.3.
      answer: 3

    - slug: g5math-w15-q07
      type: multi_select
      topic_code: "5.NBT.A.3"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 2
      partial_credit: true
      prompt: |
        Which numbers are equal to 0.6? Select all that apply.
      options:
        - "0.60"
        - "0.600"
        - "0.06"
        - "6/10"
        - "0.006"
      option_explanations:
        - |
          Equal. 0.60 is 60 hundredths, which is the same amount as 6 tenths.
        - |
          Equal. 0.600 is 600 thousandths, which is the same amount as 6 tenths. Zeros at the end do not change the value.
        - |
          Not equal. 0.06 is 6 hundredths. A zero right after the decimal point moves the 6 into the hundredths place.
        - |
          Equal. 6/10 is six tenths, which is written 0.6.
        - |
          Not equal. 0.006 is 6 thousandths, which is only 1/100 of 0.6.
      answer: [0, 1, 3]

    - slug: g5math-w15-q08
      type: true_false
      topic_code: "5.NBT.A.1"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      prompt: |
        True or false: The 8 in 0.08 is worth 10 times as much as the 8 in 0.008.
      answer: true
      explanation: |
        True. The 8 in 0.08 is 8 hundredths and the 8 in 0.008 is 8 thousandths. The hundredths place is one place to the left of the thousandths place, so 10 × 0.008 = 0.08.

    - slug: g5math-w15-q09
      type: multiple_choice
      topic_code: "5.NBT.A.3"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      prompt: |
        Which decimal is "two and fifteen thousandths"?
      options:
        - "2.15"
        - "2.015"
        - "2.105"
        - "20.15"
      option_explanations:
        - |
          2.15 is two and fifteen hundredths. To make thousandths, the 5 must land in the third place after the decimal point.
        - |
          Correct. Fifteen thousandths is 0.015: 0 tenths, 1 hundredth and 5 thousandths. With 2 wholes, the number is 2.015.
        - |
          2.105 is two and one hundred five thousandths. Fifteen thousandths needs 0 tenths, then 1 hundredth and 5 thousandths.
        - |
          20.15 is twenty and fifteen hundredths. "Two and" means 2 wholes, so only one digit comes before the decimal point.
      answer: 1

    - slug: g5math-w15-q10
      type: numeric
      topic_code: "5.NBT.A.1"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      prompt: |
        What is 1/10 of 0.4? Write your answer as a decimal.
      answer: { value: 0.04, tolerance: 0.001 }
      explanation: |
        One tenth of 4 tenths is 4 hundredths. The 4 moves one place to the right: 0.04.

    - slug: g5math-w15-q11
      type: multiple_choice
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 4, Section A"
      points: 1
      prompt: |
        What is 46 × 23?
      options:
        - "230"
        - "818"
        - "1,058"
        - "1,048"
      option_explanations:
        - |
          230 adds 46 × 3 = 138 to 46 × 2 = 92. The 2 in 23 means 2 tens, so the second partial product is 46 × 20 = 920.
        - |
          818 multiplies only matching places: 40 × 20 = 800 and 6 × 3 = 18. The 40 × 3 and 6 × 20 parts are missing.
        - |
          Correct. 46 × 3 = 138 and 46 × 20 = 920. 138 + 920 = 1,058.
        - |
          1,048 is a slip in the tens when adding the partial products. 138 + 920: 8 ones, 3 + 2 = 5 tens, 1 + 9 = 10 hundreds, so 1,058.
      answer: 2

    - slug: g5math-w15-q12
      type: numeric
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 4, Section B"
      points: 1
      prompt: |
        Pablo packs 672 crayons into boxes of 24. Every box is full. How many boxes does he fill?
      answer: { value: 28, tolerance: 0 }
      explanation: |
        672 ÷ 24 = 28. One way: 20 boxes hold 480 crayons, leaving 192, and 8 more boxes hold 192. 20 + 8 = 28. Check: 28 × 24 = 672.

    - slug: g5math-w15-q13
      type: multiple_choice
      topic_code: "5.OA.A.1"
      source: "IM K–5 Math Grade 5, Unit 4, Section C"
      points: 1
      prompt: |
        What is the value of 3 × [20 − (4 + 6)]?
      options:
        - "30"
        - "50"
        - "62"
        - "10"
      option_explanations:
        - |
          Correct. Parentheses first: 4 + 6 = 10. Then the brackets: 20 − 10 = 10. Then 3 × 10 = 30.
        - |
          50 multiplies 3 × 20 first and then subtracts 10. The brackets say to finish 20 − 10 before multiplying.
        - |
          62 ignores the grouping symbols: 3 × 20 = 60, then 60 − 4 + 6 = 62. Work inside the parentheses, then the brackets.
        - |
          10 is the value inside the brackets. The 3 × in front still has to be done: 3 × 10 = 30.
      answer: 0

    - slug: g5math-w15-q14
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section B"
      points: 1
      prompt: |
        A class has 24 students. 3/8 of them walk to school. How many students walk to school?
      options:
        - "3"
        - "64"
        - "8"
        - "9"
      option_explanations:
        - |
          3 is 1/8 of 24. That is one eighth; 3 eighths is 3 times as many: 3 × 3 = 9.
        - |
          64 multiplies 24 by 8 and divides by 3. To find 3/8 of 24, find 1/8 of 24 (which is 3) and multiply by 3.
        - |
          8 is the denominator, not the answer. 24 ÷ 8 = 3 students in each eighth, and 3 eighths is 9 students.
        - |
          Correct. 1/8 of 24 is 3, so 3/8 of 24 is 3 × 3 = 9. Or: 3/8 × 24 = 72/8 = 9.
      answer: 3

    - slug: g5math-w15-q15
      type: short_answer
      topic_code: "5.NBT.A.1"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 2
      prompt: |
        Look at the number 2.222.

        (a) Write the value of each 2, from left to right.
        (b) How does the value of the 2 in the tenths place compare with the 2 in the hundredths place, and with the 2 in the ones place? Explain.
      answer: |
        (a) 2, 0.2, 0.02 and 0.002.
        (b) The 2 in the tenths place (0.2) is 10 times the 2 in the hundredths place (0.02), because 10 × 0.02 = 0.2. It is 1/10 of the 2 in the ones place (2), because 1/10 of 2 is 0.2. Each place is worth 10 times the place to its right.
      explanation: |
        Two points.

        (a) 1 pt: all four values correct (2, 0.2, 0.02, 0.002). Fractions such as 2/10, 2/100 and 2/1000 also earn the point.

        (b) 1 pt: says the tenths 2 is 10 times the hundredths 2 AND 1/10 of the ones 2, with values or a place-value reason. Saying only "it is bigger" does not earn the point.
