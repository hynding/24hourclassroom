week: 18
unit: 5
title: "Multiplying Decimals and Patterns With Powers of 10"
topics: ["5.NBT.B.7", "5.NBT.A.2"]
guide: guides/week-18.md
guide_description: |
  What happens to the digits when you multiply or divide a decimal by 10, 100 or 1,000, how to multiply a
  whole number by a decimal, why a tenth times a tenth is a hundredth, and how area models and estimates show
  where the decimal point goes in a product.
flashcards_description: |
  19 cards on multiplying and dividing by 10, 100 and 1,000, whole numbers times decimals, tenths times tenths
  on a grid, area models with partial products, estimating products and placing the decimal point.

flashcards:
  - front: Multiplying a decimal by 10 → what the digits do
    back: |
      Each digit moves one place to the left, so it is worth 10 times as much. 0.35 × 10 = 3.5.
    topic_code: "5.NBT.A.2"
  - front: Multiplying a decimal by 100 → what the digits do
    back: |
      Each digit moves two places to the left. 4.25 × 100 = 425.
    topic_code: "5.NBT.A.2"
  - front: Multiplying a decimal by 1,000 → what the digits do
    back: |
      Each digit moves three places to the left. 0.062 × 1,000 = 62.
    topic_code: "5.NBT.A.2"
  - front: Dividing a decimal by 10 → what the digits do
    back: |
      Each digit moves one place to the right, so it is worth 1/10 as much. 36.8 ÷ 10 = 3.68.
    topic_code: "5.NBT.A.2"
  - front: 57 ÷ 100 → quotient
    back: |
      0.57. Dividing by 100 moves each digit two places to the right.
    topic_code: "5.NBT.A.2"
  - front: Powers of 10 → examples
    back: |
      10, 100, 1,000, and so on: numbers made by multiplying 10 by itself. 100 = 10 × 10 and 1,000 = 10 × 10 × 10.
    topic_code: "5.NBT.A.2"
  - front: "\"Just add a zero\" for × 10 → why it fails for decimals"
    back: |
      2.5 × 10 is 25, not 2.50. Adding a zero after the decimal point does not change the value. Move the digits instead.
    topic_code: "5.NBT.A.2"
  - front: 6 × 0.8 → product
    back: |
      4.8. Six groups of 8 tenths make 48 tenths, which is 4 wholes and 8 tenths.
    topic_code: "5.NBT.B.7"
  - front: 3 × 0.25 → product
    back: |
      0.75. Three groups of 25 hundredths make 75 hundredths.
    topic_code: "5.NBT.B.7"
  - front: 12 × $0.35 → total
    back: |
      $4.20. 10 × $0.35 = $3.50 and 2 × $0.35 = $0.70. $3.50 + $0.70 = $4.20.
    topic_code: "5.NBT.B.7"
  - front: One tenth of one tenth → value
    back: |
      One hundredth, 0.01. On a grid with sides of 1, a square 0.1 wide and 0.1 tall is one small square out of 100.
    topic_code: "5.NBT.B.7"
  - front: 0.3 × 0.4 on a hundredths grid → how to see it
    back: |
      Shade a rectangle 3 columns wide and 4 rows tall. It covers 12 small squares, so 0.3 × 0.4 = 0.12.
    topic_code: "5.NBT.B.7"
  - front: 0.5 × 0.5 → product
    back: |
      0.25. Half of a half is a quarter. 5 tenths × 5 tenths = 25 hundredths.
    topic_code: "5.NBT.B.7"
  - front: 0.2 × 7 → product
    back: |
      1.4. 7 groups of 2 tenths make 14 tenths.
    topic_code: "5.NBT.B.7"
  - front: Area model for 2.4 × 1.3 → the four parts
    back: |
      2 × 1 = 2, 0.4 × 1 = 0.4, 2 × 0.3 = 0.6 and 0.4 × 0.3 = 0.12. Add them: 2 + 0.4 + 0.6 + 0.12 = 3.12.
    topic_code: "5.NBT.B.7"
  - front: Placing the decimal point in 3.9 × 5.1 → how an estimate helps
    back: |
      3.9 × 5.1 is about 4 × 5 = 20. The digits of 39 × 51 are 1989, so the product is 19.89, close to 20.
    topic_code: "5.NBT.B.7"
  - front: Tenths times tenths → what place the product reaches
    back: |
      Hundredths. 0.7 × 0.6 = 0.42, because 7 tenths of 6 tenths is 42 hundredths.
    topic_code: "5.NBT.B.7"
  - front: Multiplying by a decimal less than 1 → bigger or smaller product
    back: |
      Smaller than the number you started with. 0.4 × 0.2 = 0.08, which is less than 0.4 and less than 0.2.
    topic_code: "5.NBT.B.7"
  - front: 1.5 × 4 → product
    back: |
      6. 4 groups of 1 are 4, and 4 groups of 0.5 are 2. 4 + 2 = 6.
    topic_code: "5.NBT.B.7"

quiz:
  description: |
    15 questions · about 30 minutes · multiplying and dividing by 10, 100 and 1,000, multiplying whole numbers
    by decimals, tenths times tenths, area models and estimating products, plus review of subtracting
    decimals, expanded form and multiplying whole numbers. Multiple choice, select-all, true/false and number
    answers are graded at once; the fill-in word is matched automatically; the short answer is checked by your
    teacher.
  questions:
    - slug: g5math-w18-q01
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section C"
      points: 1
      figure: figures/w18-tenths-grid.svg
      figure_alt: "A 10 by 10 grid of 100 small squares titled Tenths Times Tenths, with the note Each side of the big square is 1. A bracket over the first 3 columns is labeled 0.3, and a bracket beside the first 4 rows is labeled 0.4. The rectangle where they meet, 3 columns wide and 4 rows tall in the top left corner, is shaded blue: 12 small squares."
      prompt: |
        Which equation does the shaded part of the grid show?
      options:
        - "0.3 × 0.4 = 1.2"
        - "0.3 + 0.4 = 0.7"
        - "3 × 4 = 12"
        - "0.3 × 0.4 = 0.12"
      option_explanations:
        - |
          1.2 would be more than a whole grid. Only 12 small squares out of 100 are shaded, which is 12 hundredths.
        - |
          The shaded part is a rectangle 0.3 wide and 0.4 tall, so it shows a product, not a sum. Its area is 0.3 × 0.4.
        - |
          The shaded rectangle has 12 squares, but the side lengths are 0.3 and 0.4 of the whole, not 3 and 4 wholes.
        - |
          Correct. The rectangle is 0.3 by 0.4 and covers 12 of the 100 small squares, so 0.3 × 0.4 = 0.12.
      answer: 3

    - slug: g5math-w18-q02
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section C"
      points: 1
      stimulus: |
        Use the area model for 2.4 × 1.3. The top side is split into 2 and 0.4, and the left side into 1 and 0.3.
      figure: figures/w18-area-model.svg
      figure_alt: "A rectangle titled Area Model for 2.4 × 1.3, not drawn to scale. Its top side is split into 2 and 0.4, and its left side into 1 and 0.3, making four parts. The top left part shows 2, the top right part shows 0.4, the bottom left part shows 0.6, and the bottom right part, 0.4 wide and 0.3 tall, shows a red question mark."
      prompt: |
        What number goes in the part with the question mark?
      options:
        - "0.12"
        - "1.2"
        - "0.012"
        - "0.7"
      option_explanations:
        - |
          Correct. The part is 0.4 by 0.3. 4 tenths × 3 tenths = 12 hundredths, or 0.12.
        - |
          1.2 is 4 × 0.3. But both sides of this part are tenths, and a tenth of a tenth is a hundredth.
        - |
          0.012 is 12 thousandths, which is too small. Tenths times tenths makes hundredths: 0.12.
        - |
          0.7 adds the side lengths, 0.4 + 0.3. The number inside a part of an area model is the product of its sides.
      answer: 0

    - slug: g5math-w18-q03
      type: numeric
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section C"
      points: 1
      stimulus: |
        Use the area model for 2.4 × 1.3. The top side is split into 2 and 0.4, and the left side into 1 and 0.3.
      prompt: |
        What is 2.4 × 1.3? Type the decimal.
      answer: { value: 3.12, tolerance: 0.001 }
      explanation: |
        Add the four parts: 2 + 0.4 + 0.6 + 0.12 = 3.12. Check with an estimate: 2.4 × 1.3 is a bit more than 2 × 1.5 = 3.

    - slug: g5math-w18-q04
      type: multiple_choice
      topic_code: "5.NBT.A.2"
      source: "IM K–5 Math Grade 5, Unit 5, Section C"
      points: 1
      prompt: |
        What is 4.25 × 100?
      options:
        - "42.5"
        - "4.2500"
        - "425"
        - "0.0425"
      option_explanations:
        - |
          42.5 is 4.25 × 10. Multiplying by 100 moves each digit two places to the left, not one.
        - |
          4.2500 adds two zeros after the decimal point, which does not change the value. It is still 4.25.
        - |
          Correct. Each digit moves two places to the left: the 4 ones become 4 hundreds, so 4.25 × 100 = 425.
        - |
          0.0425 is 4.25 ÷ 100. Multiplying by 100 makes the number greater, not smaller.
      answer: 2

    - slug: g5math-w18-q05
      type: numeric
      topic_code: "5.NBT.A.2"
      source: "IM K–5 Math Grade 5, Unit 5, Section C"
      points: 1
      prompt: |
        What is 36.8 ÷ 10? Type the decimal.
      answer: { value: 3.68, tolerance: 0.001 }
      explanation: |
        Dividing by 10 moves each digit one place to the right: 3 tens become 3 ones, 6 ones become 6 tenths and 8 tenths become 8 hundredths. 36.8 ÷ 10 = 3.68.

    - slug: g5math-w18-q06
      type: multi_select
      topic_code: "5.NBT.A.2"
      source: "IM K–5 Math Grade 5, Unit 5, Section C"
      points: 2
      partial_credit: true
      prompt: |
        Which expressions are equal to 5.7? Select all that apply.
      options:
        - "0.57 × 10"
        - "570 ÷ 100"
        - "57 ÷ 100"
        - "0.057 × 100"
        - "5,700 ÷ 100"
      option_explanations:
        - |
          Equal. Multiplying by 10 moves each digit one place left: 0.57 × 10 = 5.7.
        - |
          Equal. Dividing by 100 moves each digit two places right: 570 ÷ 100 = 5.7.
        - |
          Not equal. 57 ÷ 100 = 0.57. The digits move two places right, so the 5 lands in the tenths place.
        - |
          Equal. Multiplying by 100 moves each digit two places left: 0.057 × 100 = 5.7.
        - |
          Not equal. 5,700 ÷ 100 = 57. To get 5.7, divide 5,700 by 1,000.
      answer: [0, 1, 3]

    - slug: g5math-w18-q07
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section C"
      points: 1
      prompt: |
        What is 6 × 0.8?
      options:
        - "48"
        - "4.8"
        - "0.48"
        - "6.8"
      option_explanations:
        - |
          48 forgets that the 8 is 8 tenths. 6 × 8 tenths = 48 tenths, which is 4.8.
        - |
          Correct. Six groups of 8 tenths are 48 tenths, which is 4 wholes and 8 tenths: 4.8.
        - |
          0.48 is 48 hundredths. A whole number times tenths gives tenths, so the answer is 48 tenths.
        - |
          6.8 adds 6 and 0.8 instead of multiplying.
      answer: 1

    - slug: g5math-w18-q08
      type: true_false
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section C"
      points: 1
      prompt: |
        True or false: 0.5 × 0.5 = 2.5.
      answer: false
      explanation: |
        False. 0.5 × 0.5 means half of a half, which is a quarter: 0.25. 5 tenths × 5 tenths = 25 hundredths. The product must be less than 0.5.

    - slug: g5math-w18-q09
      type: fill_blank
      topic_code: "5.NBT.A.2"
      source: "IM K–5 Math Grade 5, Unit 5, Section C"
      points: 1
      prompt: |
        Numbers like 10, 100 and 1,000, made by multiplying 10 by itself, are called ____ of 10.
      answer: ["powers", "power", "the powers"]
      explanation: |
        They are powers of 10. 100 = 10 × 10 and 1,000 = 10 × 10 × 10. Multiplying by a power of 10 moves the digits to the left.

    - slug: g5math-w18-q10
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section C"
      points: 1
      prompt: |
        A pencil costs $0.35. How much do 12 pencils cost?
      options:
        - "$4.20"
        - "$42.00"
        - "$0.42"
        - "$3.50"
      option_explanations:
        - |
          Correct. 10 pencils cost $3.50 and 2 more cost $0.70. $3.50 + $0.70 = $4.20.
        - |
          $42.00 puts the decimal point in the wrong place. 12 pencils at about a third of a dollar each cost about $4, not $42.
        - |
          $0.42 is far too little: it is barely more than one pencil. 12 × 35 cents = 420 cents = $4.20.
        - |
          $3.50 is the cost of only 10 pencils. Add the cost of the other 2 pencils, $0.70.
      answer: 0

    - slug: g5math-w18-q11
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section C"
      points: 1
      prompt: |
        Which is the best estimate of 3.9 × 5.1?
      options:
        - "2"
        - "200"
        - "9"
        - "20"
      option_explanations:
        - |
          2 is far too small. 3.9 is about 4 and 5.1 is about 5, and 4 × 5 = 20.
        - |
          200 is 10 times too big. Rounding 3.9 to 4 and 5.1 to 5 gives 4 × 5 = 20.
        - |
          9 adds the rounded numbers, 4 + 5. The question is a multiplication.
        - |
          Correct. 3.9 is about 4 and 5.1 is about 5, so the product is about 4 × 5 = 20. (The exact product is 19.89.)
      answer: 3

    - slug: g5math-w18-q12
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section B"
      points: 1
      prompt: |
        What is 8.05 − 3.6?
      options:
        - "5.65"
        - "4.45"
        - "7.69"
        - "5.45"
      option_explanations:
        - |
          5.65 takes the smaller digit from the bigger one in the tenths place (6 − 0). 8.05 has 0 tenths, so decompose a one into 10 tenths first.
        - |
          Correct. 8.05 − 3.60: hundredths 5 − 0 = 5. Tenths 0 − 6 needs a one decomposed: 10 − 6 = 4. Ones 7 − 3 = 4. The answer is 4.45.
        - |
          7.69 lines up the last digits, as if 3.6 were 0.36. Line up the decimal points: 8.05 − 3.60.
        - |
          5.45 decomposes a one into tenths but forgets that the ones went down from 8 to 7. 7 − 3 = 4.
      answer: 1

    - slug: g5math-w18-q13
      type: multiple_choice
      topic_code: "5.NBT.A.3"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      prompt: |
        Which number is written in expanded form as 4 + 0.3 + 0.007?
      options:
        - "4.37"
        - "4.037"
        - "4.307"
        - "43.7"
      option_explanations:
        - |
          4.37 puts the 7 in the hundredths place. 0.007 is 7 thousandths, so a 0 must hold the hundredths place.
        - |
          4.037 puts the 3 in the hundredths place. 0.3 is 3 tenths, so the 3 goes right after the decimal point.
        - |
          Correct. 4 ones, 3 tenths, 0 hundredths and 7 thousandths: 4.307.
        - |
          43.7 treats the 3 tenths as 3 ones. The only whole number part is 4.
      answer: 2

    - slug: g5math-w18-q14
      type: numeric
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 4, Section A"
      points: 1
      prompt: |
        What is 308 × 25? (Type the digits without a comma.)
      answer: { value: 7700, tolerance: 0 }
      explanation: |
        308 × 5 = 1,540 and 308 × 20 = 6,160. 1,540 + 6,160 = 7,700.

    - slug: g5math-w18-q15
      type: short_answer
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section C"
      points: 2
      prompt: |
        Kenji says 0.4 × 0.2 = 0.8 because 4 × 2 = 8.

        (a) What is 0.4 × 0.2?
        (b) Explain why Kenji's answer cannot be right. Use a hundredths grid, place value or the size of the numbers.
      answer: |
        (a) 0.4 × 0.2 = 0.08.
        (b) 0.4 × 0.2 means 4 tenths of 2 tenths. A tenth of a tenth is a hundredth, so 4 tenths × 2 tenths = 8 hundredths, 0.08. On a hundredths grid, a rectangle 0.4 wide and 0.2 tall covers only 8 small squares. Also, 0.4 × 0.2 means 0.4 of 0.2, which is less than all of 0.2, so the product must be less than 0.2. But 0.8 is more than 0.2.
      explanation: |
        Two points.

        (a) 1 pt: 0.08.

        (b) 1 pt: a correct reason, such as tenths times tenths makes hundredths, a grid with 8 of 100 squares shaded, or the product must be less than both factors because both are less than 1.
