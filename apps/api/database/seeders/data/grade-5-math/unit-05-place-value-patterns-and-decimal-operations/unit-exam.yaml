unit: 5
description: |
  23 questions · about 45 minutes · every standard of Unit 5: reading, writing and comparing decimals to
  thousandths, the 10 times and one tenth patterns between places, rounding decimals, adding, subtracting,
  multiplying and dividing decimals to hundredths, and multiplying and dividing by powers of 10. Two sets of
  questions share a picture. Multiple choice, select-all, true/false and number answers are graded at once;
  the fill-in word is matched automatically; the two short answers are checked by your teacher against the
  scoring notes.
questions:
  # ---- Thousandths and place value (Section A: 5.NBT.A.3, 5.NBT.A.1)
  - slug: g5math-u05-check-q01
    type: multiple_choice
    topic_code: "5.NBT.A.3"
    source: "IM K–5 Math Grade 5, Unit 5, Section A"
    points: 1
    stimulus: |
      Use the place-value chart. Each column holds one digit of a number. The red dot is the decimal point.
    figure: figures/u05-place-value-chart.svg
    figure_alt: "A place-value chart titled Place-Value Chart with five columns: Tens, Ones, Tenths, Hundredths and Thousandths. The digits are 1 in the tens column, 9 in the ones column, 0 in the tenths column, 2 in the hundredths column and 6 in the thousandths column. A red dot for the decimal point sits on the line between the ones and the tenths columns."
    prompt: |
      How do you write the number on the chart in words?
    options:
      - "nineteen and twenty-six thousandths"
      - "nineteen and twenty-six hundredths"
      - "nineteen and two hundred six thousandths"
      - "one hundred ninety and twenty-six thousandths"
    option_explanations:
      - |
        Correct. The number is 19.026. Read the digits after the point as 26 and name the last place, thousandths.
      - |
        Twenty-six hundredths is 0.26. Here the 6 is in the thousandths place, so the part after the point is twenty-six thousandths.
      - |
        Two hundred six thousandths is 0.206. The chart has 0 tenths, 2 hundredths and 6 thousandths, which is 0.026.
      - |
        One hundred ninety would need three digits before the point. The chart has only a tens digit and a ones digit: 19.
    answer: 0

  - slug: g5math-u05-check-q02
    type: multiple_choice
    topic_code: "5.NBT.A.3"
    source: "IM K–5 Math Grade 5, Unit 5, Section A"
    points: 1
    stimulus: |
      Use the place-value chart. Each column holds one digit of a number. The red dot is the decimal point.
    prompt: |
      What is the value of the digit 2 in the number on the chart?
    options:
      - "0.2"
      - "0.02"
      - "0.002"
      - "2"
    option_explanations:
      - |
        0.2 would put the 2 in the tenths place. The tenths digit on the chart is 0; the 2 is in the hundredths column.
      - |
        Correct. The 2 is in the hundredths column, so it is worth 2 hundredths, 0.02.
      - |
        0.002 is 2 thousandths. The thousandths digit on the chart is 6, not 2.
      - |
        2 would be 2 ones. The ones digit on the chart is 9.
    answer: 1

  - slug: g5math-u05-check-q03
    type: multiple_choice
    topic_code: "5.NBT.A.1"
    source: "IM K–5 Math Grade 5, Unit 5, Section A"
    points: 1
    prompt: |
      In the number 0.88, how does the value of the first 8 after the decimal point compare with the value of the second 8?
    options:
      - "It is 1/10 as much."
      - "It is the same value."
      - "It is 10 times as much."
      - "It is 100 times as much."
    option_explanations:
      - |
        1/10 as much describes the second 8 compared with the first. The first 8 is in the tenths place, one place to the left.
      - |
        The digits match but the places do not: the first 8 is 0.8 and the second is 0.08.
      - |
        Correct. The first 8 is 8 tenths (0.8) and the second is 8 hundredths (0.08). 10 × 0.08 = 0.8.
      - |
        100 times as much is for places two apart. The tenths place is right next to the hundredths place.
    answer: 2

  - slug: g5math-u05-check-q04
    type: numeric
    topic_code: "5.NBT.A.1"
    source: "IM K–5 Math Grade 5, Unit 5, Section A"
    points: 1
    prompt: |
      What is 1/10 of 6.5? Type the decimal.
    answer: { value: 0.65, tolerance: 0.001 }
    explanation: |
      One tenth of a number moves each digit one place to the right: 6 ones become 6 tenths and 5 tenths become 5 hundredths. 1/10 of 6.5 is 0.65.

  - slug: g5math-u05-check-q05
    type: multiple_choice
    topic_code: "5.NBT.A.3"
    source: "IM K–5 Math Grade 5, Unit 5, Section A"
    points: 1
    prompt: |
      Which shows 3.408 in expanded form?
    options:
      - "3 + 0.4 + 0.08"
      - "3 + 0.04 + 0.008"
      - "3 + 4 + 8"
      - "3 + 0.4 + 0.008"
    option_explanations:
      - |
        3 + 0.4 + 0.08 is 3.48. The 8 in 3.408 is in the thousandths place, so it is worth 0.008.
      - |
        3 + 0.04 + 0.008 is 3.048. The 4 is right after the decimal point, so it is 4 tenths, 0.4.
      - |
        3 + 4 + 8 treats every digit as ones. Each digit is worth the value of its place.
      - |
        Correct. 3 ones, 4 tenths, 0 hundredths and 8 thousandths: 3 + 0.4 + 0.008.
    answer: 3

  - slug: g5math-u05-check-q06
    type: multiple_choice
    topic_code: "5.NBT.A.3"
    source: "IM K–5 Math Grade 5, Unit 5, Section A"
    points: 1
    prompt: |
      Which list is in order from greatest to least?
    options:
      - "0.71, 0.7, 0.617, 0.17"
      - "0.617, 0.71, 0.17, 0.7"
      - "0.17, 0.617, 0.7, 0.71"
      - "0.71, 0.617, 0.7, 0.17"
    option_explanations:
      - |
        Correct. In thousandths the numbers are 710, 700, 617 and 170, so this order goes from greatest to least.
      - |
        This list puts the number with the most digits first. More digits does not mean greater: 0.617 is less than 0.7.
      - |
        This list is from least to greatest, the reverse of what was asked.
      - |
        This list puts 0.617 before 0.7. But 0.7 = 0.700, and 700 thousandths is more than 617 thousandths.
    answer: 0

  - slug: g5math-u05-check-q07
    type: true_false
    topic_code: "5.NBT.A.3"
    source: "IM K–5 Math Grade 5, Unit 5, Section A"
    points: 1
    prompt: |
      True or false: 5.06 is greater than 5.059.
    answer: true
    explanation: |
      True. Write 5.06 as 5.060. Both have 5 ones and 0 tenths. In the hundredths, 6 is more than 5, so 5.06 is greater.

  # ---- Rounding (Section A: 5.NBT.A.4)
  - slug: g5math-u05-check-q08
    type: multiple_choice
    topic_code: "5.NBT.A.3"
    source: "IM K–5 Math Grade 5, Unit 5, Section A"
    points: 1
    stimulus: |
      Use the number line from 2.73 to 2.74. It is split into 10 equal parts.
    figure: figures/u05-thousandths-line.svg
    figure_alt: "A number line titled Thousandths from 2.73 to 2.74, with tick marks that split it into 10 equal parts. Only 2.73 and 2.74 are labeled. A red point labeled R sits on the eighth tick after 2.73, two ticks before 2.74."
    prompt: |
      What decimal is at point R?
    options:
      - "2.78"
      - "2.738"
      - "2.732"
      - "2.739"
    option_explanations:
      - |
        2.78 counts each jump as a hundredth. The whole line is one hundredth long, so each of its 10 jumps is a thousandth.
      - |
        Correct. Each jump is 0.001. R is 8 jumps past 2.73, so it is at 2.730 + 0.008 = 2.738.
      - |
        2.732 counts the 2 jumps from R to 2.74. Count from the left end: 8 jumps from 2.73 to R.
      - |
        2.739 counts the tick at 2.73 as one. Count the jumps: R is 8 jumps after 2.73.
    answer: 1

  - slug: g5math-u05-check-q09
    type: numeric
    topic_code: "5.NBT.A.4"
    source: "IM K–5 Math Grade 5, Unit 5, Section A"
    points: 1
    stimulus: |
      Use the number line from 2.73 to 2.74. It is split into 10 equal parts.
    prompt: |
      Round the number at point R to the nearest hundredth. Type a decimal with two places after the decimal point.
    answer: { value: 2.74, tolerance: 0.001 }
    explanation: |
      R is at 2.738, between 2.73 and 2.74. It is past the halfway mark 2.735 (the thousandths digit is 8), so it rounds up to 2.74.

  - slug: g5math-u05-check-q10
    type: multi_select
    topic_code: "5.NBT.A.4"
    source: "IM K–5 Math Grade 5, Unit 5, Section A"
    points: 2
    partial_credit: true
    prompt: |
      Which numbers round to 6 when rounded to the nearest whole number? Select all that apply.
    options:
      - "5.5"
      - "6.49"
      - "6.5"
      - "5.49"
      - "6.051"
    option_explanations:
      - |
        Rounds to 6. 5.5 is exactly halfway between 5 and 6, and a halfway number rounds up.
      - |
        Rounds to 6. The tenths digit is 4, so 6.49 rounds down to 6.
      - |
        Rounds to 7, not 6. 6.5 is halfway between 6 and 7, so it rounds up.
      - |
        Rounds to 5, not 6. The tenths digit is 4, so 5.49 rounds down to 5.
      - |
        Rounds to 6. The tenths digit is 0, so 6.051 rounds down to 6.
    answer: [0, 1, 4]

  - slug: g5math-u05-check-q11
    type: multiple_choice
    topic_code: "5.NBT.A.4"
    source: "IM K–5 Math Grade 5, Unit 5, Section A"
    points: 1
    prompt: |
      Round 0.952 to the nearest tenth.
    options:
      - "0.9"
      - "0.95"
      - "1.0"
      - "0.10"
    option_explanations:
      - |
        0.9 rounds down. The hundredths digit is 5, so 0.952 rounds up.
      - |
        0.95 is rounded to the nearest hundredth. The nearest tenth keeps only one place after the point.
      - |
        Correct. The hundredths digit is 5, so round up. 9 tenths + 1 tenth = 10 tenths, which is 1 whole: 1.0.
      - |
        0.10 writes 10 tenths after the decimal point. 10 tenths is 1 whole, so the answer is 1.0.
    answer: 2

  - slug: g5math-u05-check-q12
    type: fill_blank
    topic_code: "5.NBT.A.4"
    source: "IM K–5 Math Grade 5, Unit 5, Section A"
    points: 1
    prompt: |
      To ____ 3.68 to the nearest tenth, look at the hundredths digit, 8, and change 3.68 to 3.7.
    answer: ["round", "rounding"]
    explanation: |
      To round is to find the closest number that stops at a chosen place. 3.68 is closer to 3.7 than to 3.6.

  # ---- Adding and subtracting (Section B: 5.NBT.B.7)
  - slug: g5math-u05-check-q13
    type: multiple_choice
    topic_code: "5.NBT.B.7"
    source: "IM K–5 Math Grade 5, Unit 5, Section B"
    points: 1
    prompt: |
      What is 12.5 + 3.86?
    options:
      - "15.36"
      - "5.11"
      - "15.136"
      - "16.36"
    option_explanations:
      - |
        15.36 forgets to regroup. 5 tenths + 8 tenths = 13 tenths, which is 1 whole and 3 tenths, so the ones become 2 + 3 + 1 = 6.
      - |
        5.11 lines up the last digits, which treats 12.5 like 1.25. Line up the decimal points: 12.50 + 3.86.
      - |
        15.136 writes all 13 tenths after the point. 13 tenths must be regrouped as 1 whole and 3 tenths.
      - |
        Correct. 12.50 + 3.86: hundredths 0 + 6 = 6, tenths 5 + 8 = 13 (write 3, regroup 1), ones 2 + 3 + 1 = 6, tens 1. The sum is 16.36.
    answer: 3

  - slug: g5math-u05-check-q14
    type: numeric
    topic_code: "5.NBT.B.7"
    source: "IM K–5 Math Grade 5, Unit 5, Section B"
    points: 1
    prompt: |
      A big pumpkin weighs 8.2 kilograms. A small pumpkin weighs 5.75 kilograms. How many kilograms heavier is the big pumpkin? Type the decimal.
    answer: { value: 2.45, tolerance: 0.001 }
    explanation: |
      8.20 − 5.75: decompose to get 7 ones, 11 tenths and 10 hundredths. 10 − 5 = 5, 11 − 7 = 4, 7 − 5 = 2. The big pumpkin is 2.45 kilograms heavier. Check: 5.75 + 2.45 = 8.2.

  # ---- Multiplying and powers of 10 (Section C: 5.NBT.B.7, 5.NBT.A.2)
  - slug: g5math-u05-check-q15
    type: multiple_choice
    topic_code: "5.NBT.B.7"
    source: "IM K–5 Math Grade 5, Unit 5, Section C"
    points: 1
    prompt: |
      What is 0.7 × 0.6?
    options:
      - "0.42"
      - "4.2"
      - "0.042"
      - "1.3"
    option_explanations:
      - |
        Correct. 7 tenths × 6 tenths = 42 hundredths, because a tenth of a tenth is a hundredth. 0.7 × 0.6 = 0.42.
      - |
        4.2 is 7 × 0.6. Both factors are tenths, so the product is in hundredths, and it must be less than 0.7.
      - |
        0.042 is 42 thousandths, which is too small. Tenths times tenths gives hundredths.
      - |
        1.3 adds 0.7 and 0.6 instead of multiplying.
    answer: 0

  - slug: g5math-u05-check-q16
    type: numeric
    topic_code: "5.NBT.B.7"
    source: "IM K–5 Math Grade 5, Unit 5, Section C"
    points: 1
    prompt: |
      A bag of apples weighs 1.25 kilograms. How many kilograms do 6 bags weigh? Type the decimal.
    answer: { value: 7.5, tolerance: 0.001 }
    explanation: |
      6 × 1.25 = (6 × 1) + (6 × 0.25) = 6 + 1.5 = 7.5 kilograms.

  - slug: g5math-u05-check-q17
    type: multiple_choice
    topic_code: "5.NBT.A.2"
    source: "IM K–5 Math Grade 5, Unit 5, Section C"
    points: 1
    prompt: |
      What is 52.6 ÷ 100?
    options:
      - "5.26"
      - "0.526"
      - "5,260"
      - "0.0526"
    option_explanations:
      - |
        5.26 is 52.6 ÷ 10. Dividing by 100 moves each digit two places to the right, not one.
      - |
        Correct. Each digit moves two places to the right: 5 tens become 5 tenths. 52.6 ÷ 100 = 0.526.
      - |
        5,260 is 52.6 × 100. Dividing makes the number smaller.
      - |
        0.0526 moves the digits three places, which is dividing by 1,000.
    answer: 1

  - slug: g5math-u05-check-q18
    type: multiple_choice
    topic_code: "5.NBT.A.2"
    source: "IM K–5 Math Grade 5, Unit 5, Section C"
    points: 1
    prompt: |
      Which number is 1,000 times as much as 0.045?
    options:
      - "4.5"
      - "450"
      - "45"
      - "0.45"
    option_explanations:
      - |
        4.5 is 100 times as much as 0.045. 1,000 times moves each digit three places to the left.
      - |
        450 is 10,000 times as much. Moving three places to the left gives 45.
      - |
        Correct. Each digit moves three places to the left: 4 hundredths become 4 tens and 5 thousandths become 5 ones. 0.045 × 1,000 = 45.
      - |
        0.45 is only 10 times as much as 0.045. The digits must move three places, not one.
    answer: 2

  # ---- Dividing (Section D: 5.NBT.B.7)
  - slug: g5math-u05-check-q19
    type: multiple_choice
    topic_code: "5.NBT.B.7"
    source: "IM K–5 Math Grade 5, Unit 5, Section D"
    points: 1
    figure: figures/u05-tape-rice.svg
    figure_alt: "A tape diagram titled Rice in 3 Equal Bags. A bracket over the whole tape is labeled 6.3 kg. The tape is split into 3 equal parts, and each part shows a red question mark."
    prompt: |
      The tape diagram shows 6.3 kilograms of rice split equally into 3 bags. How many kilograms of rice are in each bag?
    options:
      - "2.01"
      - "18.9"
      - "21"
      - "2.1"
    option_explanations:
      - |
        2.01 puts the 1 in the hundredths place. 3 tenths ÷ 3 = 1 tenth, so the 1 goes in the tenths place.
      - |
        18.9 multiplies 6.3 by 3. Splitting into 3 equal bags divides.
      - |
        21 has the right digits but no decimal point. Each bag holds less than the whole 6.3 kilograms.
      - |
        Correct. 6 ones ÷ 3 = 2 ones and 3 tenths ÷ 3 = 1 tenth, so each bag holds 2.1 kilograms. Check: 3 × 2.1 = 6.3.
    answer: 3

  - slug: g5math-u05-check-q20
    type: multiple_choice
    topic_code: "5.NBT.B.7"
    source: "IM K–5 Math Grade 5, Unit 5, Section D"
    points: 1
    prompt: |
      What is 3.6 ÷ 0.4?
    options:
      - "9"
      - "0.9"
      - "90"
      - "1.44"
    option_explanations:
      - |
        Correct. 3.6 is 36 tenths and 0.4 is 4 tenths. 36 tenths ÷ 4 tenths = 9. Check: 9 × 0.4 = 3.6.
      - |
        0.9 is 3.6 ÷ 4. Dividing by 0.4, which is less than 1, gives a quotient greater than 3.6.
      - |
        90 is too big: 90 × 0.4 = 36, which is ten times 3.6.
      - |
        1.44 multiplies 3.6 by 0.4 instead of dividing.
    answer: 0

  - slug: g5math-u05-check-q21
    type: numeric
    topic_code: "5.NBT.B.7"
    source: "IM K–5 Math Grade 5, Unit 5, Section D"
    points: 1
    prompt: |
      What is 4.55 ÷ 5? Type the decimal.
    answer: { value: 0.91, tolerance: 0.001 }
    explanation: |
      4.55 is 455 hundredths. 455 ÷ 5 = 91, so the quotient is 91 hundredths, 0.91. Check: 5 × 0.91 = 4.55.

  # ---- Short answers
  - slug: g5math-u05-check-q22
    type: short_answer
    topic_code: "5.NBT.B.7"
    source: "IM K–5 Math Grade 5, Unit 5, Sections A to C"
    points: 3
    prompt: |
      Ayo has $20. He buys 3 notebooks that cost $2.65 each.

      (a) How much do the 3 notebooks cost in all? Show your work.
      (b) How much money does Ayo have left? Show your work.
      (c) Round $2.65 to the nearest dollar. Use it to explain whether your answer to (a) is reasonable.
    answer: |
      (a) 3 × $2.65 = $7.95. (3 × $2 = $6 and 3 × $0.65 = $1.95; $6 + $1.95 = $7.95.)
      (b) $20.00 − $7.95 = $12.05. (Count up: $7.95 + $0.05 = $8 and $8 + $12 = $20, so $12.05.)
      (c) $2.65 rounds to $3, and 3 × $3 = $9. $7.95 is a little less than $9, which makes sense because each notebook costs a little less than $3.
    explanation: |
      Three points.

      (a) 1 pt: $7.95 with work shown.

      (b) 1 pt: $12.05 with work shown. If (a) is wrong, give this point when (b) correctly subtracts the student's own total from $20.

      (c) 1 pt: rounds to $3, estimates $9, and says the answer is reasonable because it is close to (and a little under) $9.

  - slug: g5math-u05-check-q23
    type: short_answer
    topic_code: "5.NBT.B.7"
    source: "IM K–5 Math Grade 5, Unit 5, Section D"
    points: 2
    prompt: |
      Theo says 3 ÷ 0.5 must be less than 3, because "dividing always makes a number smaller."

      (a) What is 3 ÷ 0.5?
      (b) Explain why Theo is wrong. Use a drawing, a number line or words.
    answer: |
      (a) 3 ÷ 0.5 = 6.
      (b) 3 ÷ 0.5 asks how many halves fit in 3. Each whole has 2 halves, so 3 wholes have 6 halves. Dividing by a number less than 1 gives a quotient greater than the number you started with. Check: 6 × 0.5 = 3.
    explanation: |
      Two points.

      (a) 1 pt: 6.

      (b) 1 pt: a correct reason, such as counting halves in 3 wholes, jumps of 0.5 on a number line from 0 to 3, or 6 × 0.5 = 3 with the idea that dividing by less than 1 gives a greater answer.
