week: 17
unit: 5
title: "Adding and Subtracting Decimals"
topics: ["5.NBT.B.7"]
guide: guides/week-17.md
guide_description: |
  How to add and subtract decimals to hundredths by lining up place values, why 10 hundredths can be traded
  for 1 tenth, how to subtract from a whole number by writing zeros, and how counting up on a number line and
  estimating help you check an answer.
flashcards_description: |
  18 cards on lining up decimal points, writing zeros to hold places, regrouping and decomposing with decimals,
  subtracting from whole numbers, counting up on a number line, estimating, and money.

flashcards:
  - front: Adding decimals → what to line up
    back: |
      The decimal points, so that tenths are under tenths and hundredths are under hundredths. Then add like places.
    topic_code: "5.NBT.B.7"
  - front: 2.4 + 1.36 → writing a zero first
    back: |
      Write 2.4 as 2.40. Then 2.40 + 1.36 = 3.76. The zero holds the hundredths place and does not change the value.
    topic_code: "5.NBT.B.7"
  - front: 10 hundredths → trade for what
    back: |
      1 tenth. In 0.58 + 0.27, the hundredths make 15: write 5 and regroup 10 hundredths as 1 more tenth. The sum is 0.85.
    topic_code: "5.NBT.B.7"
  - front: 10 tenths → trade for what
    back: |
      1 whole. In 3.6 + 2.75, the tenths make 13: write 3 tenths and regroup 10 tenths as 1 more one. The sum is 6.35.
    topic_code: "5.NBT.B.7"
  - front: 0.46 + 0.38 on a hundredths grid → how to show it
    back: |
      Shade 46 small squares in one color and 38 more in another. 84 squares are shaded, so the sum is 0.84.
    topic_code: "5.NBT.B.7"
  - front: 5 − 2.37 → how to start
    back: |
      Write 5 as 5.00. Then decompose: 4 ones, 9 tenths and 10 hundredths. 5.00 − 2.37 = 2.63.
    topic_code: "5.NBT.B.7"
  - front: Decomposing 1 tenth → into what
    back: |
      10 hundredths. In 0.75 − 0.48 you cannot take 8 hundredths from 5, so break a tenth into 10 hundredths: 15 − 8 = 7.
    topic_code: "5.NBT.B.7"
  - front: Counting up to subtract 3.2 − 1.45 → the jumps
    back: |
      1.45 → 1.5 (+0.05), 1.5 → 2 (+0.5), 2 → 3.2 (+1.2). Add the jumps: 0.05 + 0.5 + 1.2 = 1.75.
    topic_code: "5.NBT.B.7"
  - front: Checking a decimal subtraction → how
    back: |
      Add the answer to the number you took away. 6.4 − 2.75 = 3.65, because 3.65 + 2.75 = 6.4.
    topic_code: "5.NBT.B.7"
  - front: Estimating 4.87 + 2.19 → how
    back: |
      Round to whole numbers: 5 + 2 = 7. The exact sum, 7.06, is close to 7, so it makes sense.
    topic_code: "5.NBT.B.7"
  - front: 0.8 + 0.4 → sum
    back: |
      1.2. 8 tenths + 4 tenths = 12 tenths, which is 1 whole and 2 tenths. It is not 0.12.
    topic_code: "5.NBT.B.7"
  - front: 0.3 + 0.07 → sum
    back: |
      0.37. 3 tenths and 7 hundredths. Adding 3 and 7 to get 0.10 is a lining-up mistake.
    topic_code: "5.NBT.B.7"
  - front: 1 − 0.35 → difference
    back: |
      0.65. One whole is 100 hundredths, and 100 − 35 = 65 hundredths.
    topic_code: "5.NBT.B.7"
  - front: Pairs that make 1 → examples
    back: |
      0.45 + 0.55, 0.3 + 0.7, 0.62 + 0.38, 0.91 + 0.09. Each pair adds to 100 hundredths, which is 1 whole.
    topic_code: "5.NBT.B.7"
  - front: Adding money like $2.85 + $1.49 → method
    back: |
      Line up the points, as with any decimal: $2.85 + $1.49 = $4.34. Dollars are wholes and cents are hundredths.
    topic_code: "5.NBT.B.7"
  - front: Subtracting smaller digit from bigger in each place → why it is wrong
    back: |
      Taking 0.48 from 0.75 is not 0.33. The hundredths need 5 − 8, so decompose a tenth first: 0.75 − 0.48 = 0.27.
    topic_code: "5.NBT.B.7"
  - front: Lining up the last digits → what goes wrong
    back: |
      3.6 + 2.75 is not 3.11. Lining up the 6 with the 5 treats 3.6 like 0.36. Line up the decimal points instead.
    topic_code: "5.NBT.B.7"
  - front: Change from $10 after spending $7.75 → amount
    back: |
      $2.25. Count up: $7.75 + $0.25 = $8, then $8 + $2 = $10. $0.25 + $2 = $2.25.
    topic_code: "5.NBT.B.7"

quiz:
  description: |
    15 questions · about 30 minutes · adding and subtracting decimals to hundredths with grids, number lines and
    the standard algorithm, regrouping and decomposing, and money problems, plus review of comparing and rounding
    decimals, dividing whole numbers and multiplying mixed numbers. Multiple choice, select-all, true/false and
    number answers are graded at once; the fill-in word is matched automatically; the short answer is checked
    by your teacher.
  questions:
    - slug: g5math-w17-q01
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section B"
      points: 1
      stimulus: |
        Use the hundredths grid. The whole grid is 1. Blue squares show the first number and green squares show the second number.
      figure: figures/w17-grid-sum.svg
      figure_alt: "A 10 by 10 grid of 100 small squares titled Adding on a Hundredths Grid, with a key: blue for First number, green for Second number. Going down each column from the left: the first 4 columns and the top 6 squares of the fifth column are blue, 46 squares. Then the last 4 squares of the fifth column, all of the sixth, seventh and eighth columns, and the top 4 squares of the ninth column are green, 38 squares. The other 16 squares are white."
      prompt: |
        What is the sum of the two numbers the grid shows?
      options:
        - "0.74"
        - "0.84"
        - "8.4"
        - "0.714"
      option_explanations:
        - |
          0.74 forgets to regroup. 6 hundredths + 8 hundredths = 14 hundredths, which is 1 tenth and 4 hundredths, so the tenths become 4 + 3 + 1 = 8.
        - |
          Correct. 46 blue squares + 38 green squares = 84 squares out of 100, which is 0.84.
        - |
          8.4 would be more than 8 whole grids. The shaded part is less than one grid, so the sum is less than 1.
        - |
          0.714 writes 7 tenths and then the 14 hundredths as two digits. 14 hundredths must be regrouped as 1 tenth and 4 hundredths: 0.84.
      answer: 1

    - slug: g5math-w17-q02
      type: numeric
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section B"
      points: 1
      stimulus: |
        Use the hundredths grid. The whole grid is 1. Blue squares show the first number and green squares show the second number.
      prompt: |
        What decimal names the part of the grid that is still white? Type a decimal in hundredths.
      answer: { value: 0.16, tolerance: 0.001 }
      explanation: |
        84 of the 100 squares are shaded, so 100 − 84 = 16 are white. That is 0.16. (Also: 1 − 0.84 = 0.16.)

    - slug: g5math-w17-q03
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section B"
      points: 1
      prompt: |
        What is 3.6 + 2.75?
      options:
        - "3.11"
        - "5.35"
        - "5.135"
        - "6.35"
      option_explanations:
        - |
          3.11 lines up the last digits, which treats 3.6 like 0.36. Line up the decimal points: 3.60 + 2.75.
        - |
          5.35 forgets to regroup. 6 tenths + 7 tenths = 13 tenths, so 1 whole is added to the ones: 3 + 2 + 1 = 6.
        - |
          5.135 writes all 13 tenths after the point. 13 tenths is 1 whole and 3 tenths, so the answer is 6.35.
        - |
          Correct. 3.60 + 2.75: hundredths 0 + 5 = 5, tenths 6 + 7 = 13 (write 3, regroup 1 whole), ones 3 + 2 + 1 = 6. The sum is 6.35.
      answer: 3

    - slug: g5math-w17-q04
      type: numeric
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section B"
      points: 1
      prompt: |
        Nia buys a notebook for $2.85 and a pen for $1.49. How many dollars does she spend in all? Type the amount as a decimal, without the dollar sign.
      answer: { value: 4.34, tolerance: 0.001 }
      explanation: |
        $2.85 + $1.49: hundredths 5 + 9 = 14 (write 4, regroup 1 tenth), tenths 8 + 4 + 1 = 13 (write 3, regroup 1 one), ones 2 + 1 + 1 = 4. She spends $4.34.

    - slug: g5math-w17-q05
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section B"
      points: 1
      prompt: |
        What is 5 − 2.37?
      options:
        - "2.63"
        - "3.37"
        - "2.73"
        - "7.37"
      option_explanations:
        - |
          Correct. Write 5 as 5.00 and decompose it into 4 ones, 9 tenths and 10 hundredths. Then 10 − 7 = 3, 9 − 3 = 6 and 4 − 2 = 2: 2.63.
        - |
          3.37 takes 2 from 5 and keeps the .37. But the .37 must be taken away too, so the answer is less than 3.
        - |
          2.73 decomposes a tenth into hundredths but forgets that the tenths went down from 10 to 9. 9 − 3 = 6, not 7.
        - |
          7.37 adds 5 and 2.37. The minus sign asks for the difference.
      answer: 0

    - slug: g5math-w17-q06
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section B"
      points: 1
      figure: figures/w17-count-up.svg
      figure_alt: "An open number line titled Counting Up from 1.45 to 3.2, not drawn to scale. It has marks labeled 1.45, 1.5, 2 and 3.2. Three arcs jump from 1.45 to 1.5 labeled +0.05, from 1.5 to 2 labeled +0.5, and from 2 to 3.2 labeled +1.2."
      prompt: |
        Ravi finds 3.2 − 1.45 by counting up on the number line. What is the difference?
      options:
        - "1.7"
        - "2.25"
        - "1.75"
        - "4.65"
      option_explanations:
        - |
          1.7 adds only the two big jumps, 0.5 + 1.2. The small jump of 0.05 counts too.
        - |
          2.25 is what you get by taking the smaller digit from the bigger one in each place. 3.20 − 1.45 needs decomposing.
        - |
          Correct. Add the jumps: 0.05 + 0.5 + 1.2 = 1.75. So 3.2 − 1.45 = 1.75. Check: 1.45 + 1.75 = 3.2.
        - |
          4.65 adds the two numbers. Counting up from 1.45 to 3.2 finds how far apart they are, which is the difference.
      answer: 2

    - slug: g5math-w17-q07
      type: multi_select
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which sums are exactly 1? Select all that apply.
      options:
        - "0.45 + 0.55"
        - "0.3 + 0.7"
        - "0.25 + 0.85"
        - "0.62 + 0.38"
        - "0.9 + 0.01"
      option_explanations:
        - |
          Yes. 45 hundredths + 55 hundredths = 100 hundredths = 1.
        - |
          Yes. 3 tenths + 7 tenths = 10 tenths = 1.
        - |
          No. 25 hundredths + 85 hundredths = 110 hundredths = 1.1, which is more than 1.
        - |
          Yes. 62 hundredths + 38 hundredths = 100 hundredths = 1.
        - |
          No. 0.9 = 0.90, and 0.90 + 0.01 = 0.91. Adding 9 and 1 without lining up the places makes it look like 1.
      answer: [0, 1, 3]

    - slug: g5math-w17-q08
      type: true_false
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section B"
      points: 1
      prompt: |
        True or false: 0.8 + 0.4 = 0.12.
      answer: false
      explanation: |
        False. 8 tenths + 4 tenths = 12 tenths, which is 1 whole and 2 tenths: 1.2. The sum must be more than 0.8, and 0.12 is less.

    - slug: g5math-w17-q09
      type: fill_blank
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section B"
      points: 1
      prompt: |
        In 0.58 + 0.27, the hundredths add up to 15. You trade 10 hundredths for 1 tenth. This kind of trade is called ____.
      answer: ["regrouping", "regroup", "regrouped", "composing", "renaming", "carrying"]
      explanation: |
        Regrouping. 15 hundredths is 1 tenth and 5 hundredths, so write 5 in the hundredths place and add 1 to the tenths. The sum is 0.85.

    - slug: g5math-w17-q10
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section B"
      points: 1
      prompt: |
        Jun's water bottle holds 0.75 liter. He drinks 0.48 liter. How much water is left?
      options:
        - "0.33 liter"
        - "1.23 liters"
        - "0.27 liter"
        - "0.37 liter"
      option_explanations:
        - |
          0.33 takes the smaller digit from the bigger one in each place (8 − 5 and 7 − 4). The hundredths need 5 − 8, so decompose a tenth first.
        - |
          1.23 adds the two amounts. He drank some water, so less is left than he started with.
        - |
          Correct. Decompose 1 tenth: 0.75 = 6 tenths and 15 hundredths. 15 − 8 = 7 hundredths and 6 − 4 = 2 tenths: 0.27 liter.
        - |
          0.37 decomposes a tenth but forgets that the tenths went down from 7 to 6. 6 − 4 = 2 tenths, so 0.27.
      answer: 2

    - slug: g5math-w17-q11
      type: numeric
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 4, Section B"
      points: 1
      prompt: |
        A school has 1,656 books to put on shelves. Each shelf holds 46 books. How many shelves will the books fill?
      answer: { value: 36, tolerance: 0 }
      explanation: |
        1,656 ÷ 46 = 36. One way: 30 shelves hold 1,380 books, leaving 276, and 6 more shelves hold 276. 30 + 6 = 36. Check: 36 × 46 = 1,656.

    - slug: g5math-w17-q12
      type: multiple_choice
      topic_code: "5.NBT.A.4"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      prompt: |
        Round 7.846 to the nearest hundredth.
      options:
        - "7.85"
        - "7.84"
        - "7.8"
        - "7.9"
      option_explanations:
        - |
          Correct. 7.846 is between 7.84 and 7.85. The thousandths digit is 6, so it rounds up to 7.85.
        - |
          7.84 rounds down. The thousandths digit is 6, which is 5 or more, so it rounds up.
        - |
          7.8 rounds to the nearest tenth. The nearest hundredth keeps two places after the decimal point.
        - |
          7.9 rounds to the nearest tenth, and goes the wrong way: 7.846 to the nearest tenth would be 7.8.
      answer: 0

    - slug: g5math-w17-q13
      type: multiple_choice
      topic_code: "5.NBT.A.3"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      prompt: |
        Which number is the greatest: 0.509, 0.095, 0.5 or 0.59?
      options:
        - "0.509"
        - "0.095"
        - "0.5"
        - "0.59"
      option_explanations:
        - |
          0.509 has the most digits along with 0.095, but more digits does not mean greater. 0.509 is less than 0.590.
        - |
          0.095 has 0 tenths, so it is the least of the four, not the greatest.
        - |
          0.5 = 0.500, which is less than 0.509 and 0.590.
        - |
          Correct. In thousandths the numbers are 509, 95, 500 and 590. 0.59 = 0.590 is the greatest.
      answer: 3

    - slug: g5math-w17-q14
      type: multiple_choice
      topic_code: "5.NF.B.6"
      source: "IM K–5 Math Grade 5, Unit 2, Section C"
      points: 1
      prompt: |
        A rug is 2 1/2 meters long and 2 meters wide. What is its area?
      options:
        - "4 1/2 square meters"
        - "5 square meters"
        - "9 square meters"
        - "4 square meters"
      option_explanations:
        - |
          4 1/2 adds the length and the width. Area is length times width: 2 1/2 × 2.
        - |
          Correct. 2 1/2 × 2 = (2 × 2) + (1/2 × 2) = 4 + 1 = 5 square meters.
        - |
          9 meters is the perimeter: 2 1/2 + 2 1/2 + 2 + 2. Area multiplies the side lengths.
        - |
          4 square meters multiplies only the whole numbers, 2 × 2. The extra 1/2 meter of length adds 1/2 × 2 = 1 more square meter.
      answer: 1

    - slug: g5math-w17-q15
      type: short_answer
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section B"
      points: 2
      prompt: |
        Mia has $10. She buys a book for $6.45 and a bookmark for $1.30.

        (a) How much does she spend in all? Show your work.
        (b) How much money does she have left? Show your work.
      answer: |
        (a) $6.45 + $1.30 = $7.75. Hundredths 5 + 0 = 5, tenths 4 + 3 = 7, ones 6 + 1 = 7.
        (b) $10.00 − $7.75 = $2.25. Decompose $10.00 into 9 ones, 9 tenths and 10 hundredths: 10 − 5 = 5, 9 − 7 = 2, 9 − 7 = 2. (Or count up: $7.75 + $0.25 = $8 and $8 + $2 = $10, so $2.25.)
      explanation: |
        Two points.

        (a) 1 pt: $7.75 with work shown.

        (b) 1 pt: $2.25 with work shown (the algorithm, counting up, or another correct method). If (a) is wrong, give this point when (b) correctly subtracts the student's own total from $10.
