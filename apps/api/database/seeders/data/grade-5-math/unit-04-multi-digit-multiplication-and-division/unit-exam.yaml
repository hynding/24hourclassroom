unit: 4
description: |
  22 questions · about 45 minutes · every standard of Unit 4: multiplying multi-digit whole numbers with the
  standard algorithm, dividing up to four-digit numbers by two-digit numbers with partial quotients and
  remainders, and writing and working out expressions with parentheses and brackets in multistep problems.
  Three stimulus sets share a student's written work, a division area diagram or a garden diagram across
  consecutive items. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in
  word is matched automatically; the short answer is checked by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: Leo's standard algorithm for 214 × 32 (5.NBT.B.5)
  - slug: g5math-u04-check-q01
    type: multiple_choice
    topic_code: "5.NBT.B.5"
    source: "IM K–5 Math Grade 5, Unit 4, Section A"
    points: 1
    stimulus: |
      Use the picture. It shows Leo's work for 214 × 32 with the standard algorithm. His answer is wrong.
    figure: figures/u04-algorithm-error.svg
    figure_alt: "Leo's written work. The top line is 214 and below it is times 32, with a line under them. The first row under the line is 428. The second row, with a plus sign in front of it, is 642, lined up with its last digit under the 8 of 428. Below another line the total is 1070."
    prompt: |
      What mistake did Leo make?
    options:
      - "He added the two rows wrong, because 428 + 642 is 1,170."
      - "He wrote 214 × 3 in the second row instead of 214 × 30, so that row should be 6,420."
      - "His first row is wrong, because 214 × 2 is 448."
      - "He should have multiplied 214 by 5, because 3 + 2 = 5."
    option_explanations:
      - |
        428 + 642 really is 1,070, so the adding is fine. The second row is the problem: it is ten times too small.
      - |
        Correct. The 3 in 32 is 3 tens, so the second row is 214 × 30 = 6,420. It needs a 0 in the ones place.
      - |
        214 × 2 = 428, so the first row is right. The mistake is in the second row.
      - |
        32 means 3 tens and 2 ones, not 3 + 2. Each digit of 32 multiplies 214 by its own place value.
    answer: 1

  - slug: g5math-u04-check-q02
    type: numeric
    topic_code: "5.NBT.B.5"
    source: "IM K–5 Math Grade 5, Unit 4, Section A"
    points: 1
    stimulus: |
      Use the picture. It shows Leo's work for 214 × 32 with the standard algorithm. His answer is wrong.
    prompt: |
      What is 214 × 32? (Type the digits without a comma.)
    answer: { value: 6848, tolerance: 0 }
    explanation: |
      214 × 2 = 428 and 214 × 30 = 6,420. 428 + 6,420 = 6,848. Estimate: 200 × 30 = 6,000, so 6,848 makes sense and 1,070 does not.

  # ---- More multiplication (5.NBT.B.5)
  - slug: g5math-u04-check-q03
    type: multiple_choice
    topic_code: "5.NBT.B.5"
    source: "IM K–5 Math Grade 5, Unit 4, Section A"
    points: 1
    prompt: |
      What is 3,526 × 8?
    options:
      - "24,208"
      - "28,168"
      - "28,208"
      - "3,534"
    option_explanations:
      - |
        24,208 forgets the 4 regrouped from 5 hundreds × 8 = 40 hundreds, plus 2 = 42 hundreds. 3 × 8 = 24 thousands, plus 4 thousands, is 28 thousands.
      - |
        28,168 forgets the 4 tens regrouped from 6 × 8 = 48. Then 2 tens × 8 = 16 tens, plus 4, is 20 tens.
      - |
        Correct. 6 × 8 = 48: write 8, regroup 4. 2 × 8 + 4 = 20: write 0, regroup 2. 5 × 8 + 2 = 42: write 2, regroup 4. 3 × 8 + 4 = 28. The product is 28,208.
      - |
        3,534 is 3,526 + 8. Multiplying by 8 makes eight groups of 3,526.
    answer: 2

  - slug: g5math-u04-check-q04
    type: numeric
    topic_code: "5.NBT.B.5"
    source: "IM K–5 Math Grade 5, Unit 4, Section A"
    points: 1
    prompt: |
      A stadium has 54 sections. Each section has 375 seats. How many seats does the stadium have? (Type the digits without a comma.)
    answer: { value: 20250, tolerance: 0 }
    explanation: |
      375 × 54. 375 × 4 = 1,500 and 375 × 50 = 18,750. 1,500 + 18,750 = 20,250 seats.

  - slug: g5math-u04-check-q05
    type: multiple_choice
    topic_code: "5.NBT.B.5"
    source: "IM K–5 Math Grade 5, Unit 4, Section A"
    points: 1
    prompt: |
      Which is the best estimate for 692 × 48?
    options:
      - "35,000"
      - "3,500"
      - "350,000"
      - "740"
    option_explanations:
      - |
        Correct. Round to 700 × 50. 7 × 5 = 35, and hundreds times tens gives thousands, so 35,000. The exact product is 33,216.
      - |
        3,500 is 700 × 5. 48 is about 5 tens, so the estimate is ten times bigger.
      - |
        350,000 is ten times too big. 7 hundreds × 5 tens = 35 thousands.
      - |
        740 is about 692 + 48. To estimate a product, round the factors and multiply.
    answer: 0

  - slug: g5math-u04-check-q06
    type: multi_select
    topic_code: "5.NBT.B.5"
    source: "IM K–5 Math Grade 5, Unit 4, Section A"
    points: 2
    partial_credit: true
    prompt: |
      Which of these are equal to 125 × 64? Select all that apply.
    options:
      - "8,000"
      - "125 × 60 + 125 × 4"
      - "125 × 6 + 125 × 4"
      - "7,500 + 500"
      - "100 × 60 + 25 × 4"
    option_explanations:
      - |
        Equal. 125 × 4 = 500 and 125 × 60 = 7,500, and 500 + 7,500 = 8,000.
      - |
        Equal. 64 = 60 + 4, and each part is multiplied by 125. These are the two rows of the algorithm.
      - |
        Not equal. The 6 in 64 is 6 tens, so the part should be 125 × 60. This adds to only 1,250.
      - |
        Equal. 7,500 is 125 × 60 and 500 is 125 × 4, the two partial products.
      - |
        Not equal. It leaves out 100 × 4 and 25 × 60, and adds to only 6,100.
    answer: [0, 1, 3]

  - slug: g5math-u04-check-q07
    type: true_false
    topic_code: "5.NBT.B.5"
    source: "IM K–5 Math Grade 5, Unit 4, Section A"
    points: 1
    prompt: |
      True or false: 999 × 99 is less than 100,000.
    answer: true
    explanation: |
      True. 999 is less than 1,000 and 99 is less than 100, so the product is less than 1,000 × 100 = 100,000. (It is 98,901.)

  # ---- Stimulus set B: a division area diagram for 2,184 ÷ 28 (5.NBT.B.6)
  - slug: g5math-u04-check-q08
    type: numeric
    topic_code: "5.NBT.B.6"
    source: "IM K–5 Math Grade 5, Unit 4, Section B"
    points: 1
    stimulus: |
      Use the area diagram. It shows 2,184 ÷ 28. The area of the whole rectangle is 2,184 and one side is 28.
    figure: figures/u04-area-2184.svg
    figure_alt: "A rectangle with its left side labeled 28, split into two parts with 1,960 and 224 written inside. The tops of the parts are labeled 70 and a bold question mark."
    prompt: |
      What number goes where the question mark is?
    answer: { value: 8, tolerance: 0 }
    explanation: |
      The right part has an area of 224 and a side of 28. 28 × 8 = 224, so its top is 8.

  - slug: g5math-u04-check-q09
    type: multiple_choice
    topic_code: "5.NBT.B.6"
    source: "IM K–5 Math Grade 5, Unit 4, Section B"
    points: 1
    stimulus: |
      Use the area diagram. It shows 2,184 ÷ 28. The area of the whole rectangle is 2,184 and one side is 28.
    prompt: |
      What is 2,184 ÷ 28?
    options:
      - "70"
      - "8"
      - "2,156"
      - "78"
    option_explanations:
      - |
        70 is only the top of the left part. The right part adds 8 more groups of 28.
      - |
        8 is only the top of the right part. The left part is 70 groups of 28.
      - |
        2,156 is 2,184 − 28. Division asks how many groups of 28 make 2,184.
      - |
        Correct. The tops are 70 and 8, and 70 + 8 = 78. Check: 28 × 78 = 1,960 + 224 = 2,184.
    answer: 3

  # ---- More division (5.NBT.B.6)
  - slug: g5math-u04-check-q10
    type: multiple_choice
    topic_code: "5.NBT.B.6"
    source: "IM K–5 Math Grade 5, Unit 4, Section B"
    points: 1
    prompt: |
      What is 3,150 ÷ 45?
    options:
      - "7"
      - "70"
      - "700"
      - "75"
    option_explanations:
      - |
        45 × 7 = 315, which is ten times too small. 3,150 is 315 tens, so the quotient is 7 tens.
      - |
        Correct. 45 × 70 = 3,150, because 45 × 7 = 315 and 315 × 10 = 3,150.
      - |
        45 × 700 = 31,500, which is ten times too big. The quotient is 70.
      - |
        45 × 75 = 3,375, which is more than 3,150. Multiplying back catches the mistake.
    answer: 1

  - slug: g5math-u04-check-q11
    type: numeric
    topic_code: "5.NBT.B.6"
    source: "IM K–5 Math Grade 5, Unit 4, Section B"
    points: 1
    prompt: |
      A school printer prints 1,656 pages in 23 minutes. It prints the same number of pages each minute. How many pages does it print each minute?
    answer: { value: 72, tolerance: 0 }
    explanation: |
      1,656 ÷ 23. 23 × 70 = 1,610, which leaves 46. 23 × 2 = 46. 70 + 2 = 72 pages. Check: 23 × 72 = 1,656.

  - slug: g5math-u04-check-q12
    type: multiple_choice
    topic_code: "5.NBT.B.6"
    source: "IM K–5 Math Grade 5, Unit 4, Section B"
    points: 1
    prompt: |
      What is 1,000 ÷ 32?
    options:
      - "31 R 8"
      - "30 R 40"
      - "32 R 8"
      - "31"
    option_explanations:
      - |
        Correct. 32 × 30 = 960 and 32 × 1 = 32, so 31 groups use 992. 1,000 − 992 = 8, which is less than 32.
      - |
        32 × 30 = 960 and 1,000 − 960 = 40, but 40 is more than 32. One more group fits, so it is 31 R 8.
      - |
        32 × 32 = 1,024, which is more than 1,000. Only 31 groups fit.
      - |
        32 × 31 = 992, not 1,000. The 8 left over is the remainder.
    answer: 0

  - slug: g5math-u04-check-q13
    type: multiple_choice
    topic_code: "5.NBT.B.6"
    source: "IM K–5 Math Grade 5, Unit 4, Section C"
    points: 1
    prompt: |
      A juice company has 650 juice boxes. It puts 24 juice boxes in each pack. How many full packs can it make?
    options:
      - "28"
      - "2"
      - "27"
      - "626"
    option_explanations:
      - |
        28 packs would need 28 × 24 = 672 juice boxes, more than 650. The last pack would not be full.
      - |
        2 is the remainder, the juice boxes left over after the full packs.
      - |
        Correct. 650 ÷ 24 = 27 R 2, because 24 × 27 = 648. The question asks for full packs, so the 2 extra boxes do not count.
      - |
        626 is 650 − 24, one pack taken away. Divide to find how many packs of 24 fit.
    answer: 2

  - slug: g5math-u04-check-q14
    type: fill_blank
    topic_code: "5.NBT.B.6"
    source: "IM K–5 Math Grade 5, Unit 4, Section B"
    points: 1
    prompt: |
      In 1,656 ÷ 23 = 72, the answer 72 is called the ____.
    answer: ["quotient", "the quotient", "quotients"]
    explanation: |
      Quotient. 1,656 is the dividend and 23 is the divisor.

  - slug: g5math-u04-check-q15
    type: numeric
    topic_code: "5.NBT.B.6"
    source: "IM K–5 Math Grade 5, Unit 4, Section B"
    points: 1
    prompt: |
      What is 2,940 ÷ 35?
    answer: { value: 84, tolerance: 0 }
    explanation: |
      35 × 80 = 2,800, which leaves 140. 35 × 4 = 140. 80 + 4 = 84. Check: 35 × 84 = 2,940.

  # ---- Expressions with parentheses and brackets (5.OA.A.1)
  - slug: g5math-u04-check-q16
    type: multiple_choice
    topic_code: "5.OA.A.1"
    source: "IM K–5 Math Grade 5, Unit 4, Section C"
    points: 1
    prompt: |
      What is the value of 3 × [20 − (4 × 2)]?
    options:
      - "52"
      - "112"
      - "12"
      - "36"
    option_explanations:
      - |
        52 is 3 × 20 − 8. The 3 multiplies everything inside the brackets, which is 12, not only the 20.
      - |
        112 works left to right and ignores the grouping: 3 × 20 = 60, 60 − 4 = 56, 56 × 2 = 112. Start inside the parentheses.
      - |
        12 is the value inside the brackets. The expression still multiplies it by 3.
      - |
        Correct. Parentheses first: 4 × 2 = 8. Then brackets: 20 − 8 = 12. Then 3 × 12 = 36.
    answer: 3

  - slug: g5math-u04-check-q17
    type: multiple_choice
    topic_code: "5.OA.A.1"
    source: "IM K–5 Math Grade 5, Unit 4, Section C"
    points: 1
    prompt: |
      Which expression means "subtract 5 from 32, then divide by 3"?
    options:
      - "32 − 5 ÷ 3"
      - "(32 − 5) ÷ 3"
      - "(5 − 32) ÷ 3"
      - "3 ÷ (32 − 5)"
    option_explanations:
      - |
        Without parentheses, 5 ÷ 3 would be done first. The words say to subtract first.
      - |
        Correct. The parentheses make 32 − 5 = 27 happen first, and then 27 ÷ 3 = 9.
      - |
        "Subtract 5 from 32" starts with 32 and takes 5 away, so it is 32 − 5, not 5 − 32.
      - |
        This divides 3 by the difference. The words divide the difference by 3.
    answer: 1

  - slug: g5math-u04-check-q18
    type: numeric
    topic_code: "5.OA.A.1"
    source: "IM K–5 Math Grade 5, Unit 4, Section C"
    points: 1
    prompt: |
      What is the value of [(7 + 5) × 4] − 18?
    answer: { value: 30, tolerance: 0 }
    explanation: |
      Parentheses first: 7 + 5 = 12. Then brackets: 12 × 4 = 48. Then 48 − 18 = 30.

  - slug: g5math-u04-check-q19
    type: multiple_choice
    topic_code: "5.OA.A.1"
    source: "IM K–5 Math Grade 5, Unit 4, Section C"
    points: 1
    prompt: |
      Where should parentheses go so that 4 + 8 × 5 − 2 has a value of 58?
    options:
      - "(4 + 8) × 5 − 2"
      - "4 + 8 × (5 − 2)"
      - "(4 + 8) × (5 − 2)"
      - "4 + (8 × 5) − 2"
    option_explanations:
      - |
        Correct. 4 + 8 = 12, 12 × 5 = 60 and 60 − 2 = 58.
      - |
        5 − 2 = 3, 8 × 3 = 24 and 4 + 24 = 28, not 58.
      - |
        4 + 8 = 12 and 5 − 2 = 3, so this is 12 × 3 = 36, not 58.
      - |
        8 × 5 = 40, then 4 + 40 − 2 = 42. These parentheses do not change the usual order.
    answer: 0

  # ---- Stimulus set C: two flower beds (5.OA.A.1, 5.NBT.B.5)
  - slug: g5math-u04-check-q20
    type: multiple_choice
    topic_code: "5.OA.A.1"
    source: "IM K–5 Math Grade 5, Unit 4, Section C"
    points: 1
    stimulus: |
      Use the diagram. A garden club plants 18 rows of tulips and 15 rows of daffodils. Every row has 24 flowers.
    figure: figures/u04-flower-beds.svg
    figure_alt: "Two rectangles side by side with the same height. The left side of the pair is labeled 24. The left rectangle is labeled 18 on top and has the word tulips inside. The right rectangle is labeled 15 on top and has the word daffodils inside."
    prompt: |
      Which expression gives the total number of flowers?
    options:
      - "24 × 18 + 15"
      - "(24 + 18) × 15"
      - "24 × (18 + 15)"
      - "24 + 18 + 15"
    option_explanations:
      - |
        Without parentheses only the 18 rows are multiplied by 24. The 15 rows of daffodils need 24 flowers each too.
      - |
        This adds the flowers in a row to the rows of tulips, which does not count anything in the garden.
      - |
        Correct. There are 18 + 15 rows in all, and each has 24 flowers. The parentheses add the rows first.
      - |
        Adding gives only 57. There are many rows of 24 flowers, so the total needs multiplication.
    answer: 2

  - slug: g5math-u04-check-q21
    type: numeric
    topic_code: "5.NBT.B.5"
    source: "IM K–5 Math Grade 5, Unit 4, Section A"
    points: 1
    stimulus: |
      Use the diagram. A garden club plants 18 rows of tulips and 15 rows of daffodils. Every row has 24 flowers.
    prompt: |
      How many flowers does the club plant in all?
    answer: { value: 792, tolerance: 0 }
    explanation: |
      24 × (18 + 15) = 24 × 33 = 792. Or add the two beds: 24 × 18 = 432 and 24 × 15 = 360, and 432 + 360 = 792.

  # ---- Short answer: a multistep problem (5.NBT.B.6, 5.OA.A.1)
  - slug: g5math-u04-check-q22
    type: short_answer
    topic_code: "5.NBT.B.6"
    source: "IM K–5 Math Grade 5, Unit 4, Section C"
    points: 3
    prompt: |
      For a food drive, the fifth graders collect 1,250 cans and the fourth graders collect 880 cans. They pack all the cans in boxes that hold 48 cans each.

      (a) Write one expression with parentheses for the number of boxes.
      (b) Find the quotient and the remainder.
      (c) How many boxes do they need to pack every can? Explain what the remainder means.
    answer: |
      (a) (1,250 + 880) ÷ 48.
      (b) 1,250 + 880 = 2,130. 2,130 ÷ 48 = 44 R 18, because 48 × 44 = 2,112 and 2,130 − 2,112 = 18.
      (c) 45 boxes. 44 boxes are full, and the 18 cans left over need one more box, which will not be full.
    explanation: |
      Three points.

      (a) 1 pt: (1,250 + 880) ÷ 48, or the same idea with brackets. 1,250 + 880 ÷ 48 with no parentheses earns no point.

      (b) 1 pt: 44 R 18 (2,130 ÷ 48), with work such as partial quotients 40 + 4.

      (c) 1 pt: 45 boxes, with a reason that the 18 left-over cans need a box too. "44 R 18" or "44 boxes" alone earns no point.
