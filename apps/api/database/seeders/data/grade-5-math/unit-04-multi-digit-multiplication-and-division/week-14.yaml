week: 14
unit: 4
title: "Parentheses, Brackets and Multistep Problems"
topics: ["5.OA.A.1", "5.NBT.B.6"]
guide: guides/week-14.md
guide_description: |
  How parentheses ( ) and brackets [ ] show which part of an expression to work out first, how to write an
  expression for a story, and how to solve multistep problems that multiply and divide multi-digit numbers.
flashcards_description: |
  18 cards on parentheses and brackets: what they mean, working from the inside out, writing expressions from
  words and tape diagrams, and planning multistep problems with large numbers and remainders.

flashcards:
  - front: Parentheses ( ) in an expression → what they mean
    back: |
      Work out what is inside them first. In (9 + 6) × 4, add 9 + 6 = 15 first, then 15 × 4 = 60.
    topic_code: "5.OA.A.1"
  - front: Brackets [ ] → what they are for
    back: |
      Another grouping symbol, used around parentheses so the groups are easy to see, like 2 × [15 − (3 + 4)].
    topic_code: "5.OA.A.1"
  - front: Parentheses inside brackets → which to do first
    back: |
      Work from the inside out: parentheses first, then brackets, then the rest.
    topic_code: "5.OA.A.1"
  - front: 2 × [15 − (3 + 4)] → value
    back: |
      3 + 4 = 7. 15 − 7 = 8. 2 × 8 = 16.
    topic_code: "5.OA.A.1"
  - front: (9 + 6) × 4 compared with 9 + 6 × 4 → are they equal
    back: |
      No. (9 + 6) × 4 = 60. Without parentheses, multiply first: 9 + 24 = 33.
    topic_code: "5.OA.A.1"
  - front: No grouping symbols, like 9 + 6 × 4 → which to do first
    back: |
      Multiply and divide before you add and subtract. 6 × 4 = 24, then 9 + 24 = 33.
    topic_code: "5.OA.A.1"
  - front: (20 − 8) − 2 and 20 − (8 − 2) → same or different
    back: |
      Different. (20 − 8) − 2 = 10, but 20 − (8 − 2) = 14. Moving parentheses can change the value.
    topic_code: "5.OA.A.1"
  - front: (4 + 5) + 6 and 4 + (5 + 6) → same or different
    back: |
      The same, 15. When you only add, or only multiply, moving the parentheses does not change the value.
    topic_code: "5.OA.A.1"
  - front: "\"Add 9 and 6, then multiply by 4\" → as an expression"
    back: |
      (9 + 6) × 4. The parentheses show the adding happens first.
    topic_code: "5.OA.A.1"
  - front: "\"Subtract 5 from 32, then divide by 3\" → as an expression"
    back: |
      (32 − 5) ÷ 3. Its value is 27 ÷ 3 = 9.
    topic_code: "5.OA.A.1"
  - front: Tape diagram of 3 parts, each 12 and 8 → expression
    back: |
      3 × (12 + 8). Each part is 12 + 8 = 20, and there are 3 parts, so 60 in all.
    topic_code: "5.OA.A.1"
  - front: 3 × (12 + 8) and 3 × 12 + 3 × 8 → why they match
    back: |
      Three groups of (12 + 8) are three 12s and three 8s. 36 + 24 = 60, the same as 3 × 20.
    topic_code: "5.OA.A.1"
  - front: Multistep problem → a plan
    back: |
      Find what the question asks, decide the steps, write one expression with parentheses, then work it out and check that the answer makes sense.
    topic_code: "5.NBT.B.6"
  - front: 187 students and 15 adults, buses of 48 → expression and answer
    back: |
      (187 + 15) ÷ 48 = 202 ÷ 48 = 4 R 10. Ten people still need a seat, so 5 buses.
    topic_code: "5.NBT.B.6"
  - front: 1,440 muffins, 12 to a box, 15 boxes to a tray → how many trays
    back: |
      (1,440 ÷ 12) ÷ 15 = 120 ÷ 15 = 8 trays.
    topic_code: "5.NBT.B.6"
  - front: Empty seats on 5 buses of 48 with 202 riders → expression
    back: |
      5 × 48 − (187 + 15) = 240 − 202 = 38 empty seats.
    topic_code: "5.OA.A.1"
  - front: "[(7 + 5) × 4] − 18 → value"
    back: |
      7 + 5 = 12. 12 × 4 = 48. 48 − 18 = 30.
    topic_code: "5.OA.A.1"
  - front: Expression with parentheses → what it is and its value
    back: |
      Numbers and operation signs with no equal sign, like (9 + 6) × 4. Its value is the number it works out to.
    topic_code: "5.OA.A.1"

quiz:
  description: |
    15 questions · about 30 minutes · reading, writing and working out expressions with parentheses and
    brackets, and solving multistep problems with multi-digit multiplication and division, plus review of the
    standard algorithm, unit fractions and volume. Multiple choice, select-all, true/false and number answers are
    graded at once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g5math-w14-q01
      type: multiple_choice
      topic_code: "5.OA.A.1"
      source: "IM K–5 Math Grade 5, Unit 4, Section C"
      points: 1
      stimulus: |
        Use the tape diagram. The whole tape is made of 3 equal parts, and each part is split into 12 and 8.
      figure: figures/w14-tape-3-parts.svg
      figure_alt: "A tape diagram of 3 equal parts in a row. Each part is split into a longer piece labeled 12 and a shorter piece labeled 8, so the pieces read 12, 8, 12, 8, 12, 8. A bracket above the whole tape is labeled with a bold question mark."
      prompt: |
        Which expression matches the tape diagram?
      options:
        - "3 × 12 + 8"
        - "(3 + 12) × 8"
        - "3 × (12 + 8)"
        - "3 + 12 + 8"
      option_explanations:
        - |
          3 × 12 + 8 has only one 8, because without parentheses only the 12 is multiplied by 3. The tape shows three 8s.
        - |
          (3 + 12) × 8 adds the number of parts to one piece. The tape shows 3 groups, each 12 + 8.
        - |
          Correct. Each part is 12 + 8, and there are 3 parts. The parentheses make the 3 multiply the whole part.
        - |
          3 + 12 + 8 adds once. The tape repeats 12 + 8 three times, so it needs multiplication.
      answer: 2

    - slug: g5math-w14-q02
      type: numeric
      topic_code: "5.OA.A.1"
      source: "IM K–5 Math Grade 5, Unit 4, Section C"
      points: 1
      stimulus: |
        Use the tape diagram. The whole tape is made of 3 equal parts, and each part is split into 12 and 8.
      prompt: |
        What number does the question mark above the whole tape stand for?
      answer: { value: 60, tolerance: 0 }
      explanation: |
        3 × (12 + 8) = 3 × 20 = 60. Or add the pieces: 12 + 8 + 12 + 8 + 12 + 8 = 60.

    - slug: g5math-w14-q03
      type: multiple_choice
      topic_code: "5.OA.A.1"
      source: "IM K–5 Math Grade 5, Unit 4, Section C"
      points: 1
      prompt: |
        What is the value of 2 × [15 − (3 + 4)]?
      options:
        - "16"
        - "31"
        - "23"
        - "8"
      option_explanations:
        - |
          Correct. Parentheses first: 3 + 4 = 7. Then brackets: 15 − 7 = 8. Then 2 × 8 = 16.
        - |
          31 works from left to right and ignores the grouping: 2 × 15 = 30, 30 − 3 = 27, 27 + 4 = 31. Start inside the parentheses.
        - |
          23 is 2 × 15 − 7. The 2 multiplies everything inside the brackets, which is 8, not only the 15.
        - |
          8 is the value inside the brackets. The expression still multiplies it by 2.
      answer: 0

    - slug: g5math-w14-q04
      type: multiple_choice
      topic_code: "5.OA.A.1"
      source: "IM K–5 Math Grade 5, Unit 4, Section C"
      points: 1
      prompt: |
        Which expression means "add 9 and 6, then multiply by 4"?
      options:
        - "9 + 6 × 4"
        - "(9 + 6) × 4"
        - "9 × 4 + 6"
        - "9 + (6 × 4)"
      option_explanations:
        - |
          Without parentheses, 6 × 4 is done first, so this is 9 + 24 = 33. The words say to add first.
        - |
          Correct. The parentheses make 9 + 6 happen first. Then 15 × 4 = 60.
        - |
          9 × 4 + 6 multiplies the 9 only and adds 6 at the end. The words multiply the sum by 4.
        - |
          9 + (6 × 4) multiplies first, because that is what the parentheses hold. It equals 33, not 60.
      answer: 1

    - slug: g5math-w14-q05
      type: numeric
      topic_code: "5.OA.A.1"
      source: "IM K–5 Math Grade 5, Unit 4, Section C"
      points: 1
      prompt: |
        What is the value of 48 ÷ (6 + 2) + 5?
      answer: { value: 11, tolerance: 0 }
      explanation: |
        Parentheses first: 6 + 2 = 8. Then 48 ÷ 8 = 6. Then 6 + 5 = 11.

    - slug: g5math-w14-q06
      type: true_false
      topic_code: "5.OA.A.1"
      source: "IM K–5 Math Grade 5, Unit 4, Section C"
      points: 1
      prompt: |
        True or false: (20 − 8) − 2 has the same value as 20 − (8 − 2).
      answer: false
      explanation: |
        False. (20 − 8) − 2 = 12 − 2 = 10, but 20 − (8 − 2) = 20 − 6 = 14. With subtraction, where the parentheses go changes the value.

    - slug: g5math-w14-q07
      type: fill_blank
      topic_code: "5.OA.A.1"
      source: "IM K–5 Math Grade 5, Unit 4, Section C"
      points: 1
      prompt: |
        In 2 × [15 − (3 + 4)], the square symbols [ ] are called ____.
      answer: ["brackets", "bracket", "square brackets", "the brackets"]
      explanation: |
        Brackets. They group like parentheses do, and they make it easy to see one group inside another.

    - slug: g5math-w14-q08
      type: multi_select
      topic_code: "5.OA.A.1"
      source: "IM K–5 Math Grade 5, Unit 4, Section C"
      points: 2
      partial_credit: true
      prompt: |
        Which expressions have a value of 24? Select all that apply.
      options:
        - "(2 + 6) × 3"
        - "2 + 6 × 3"
        - "[10 − (4 − 2)] × 3"
        - "4 × (10 − 4)"
        - "(30 − 6) ÷ 2"
      option_explanations:
        - |
          Yes. The parentheses come first: 2 + 6 = 8, and 8 × 3 = 24.
        - |
          No. With no parentheses, multiply first: 6 × 3 = 18, and 2 + 18 = 20.
        - |
          Yes. 4 − 2 = 2, 10 − 2 = 8 and 8 × 3 = 24.
        - |
          Yes. Inside the parentheses, 10 − 4 = 6. Then 4 × 6 = 24.
        - |
          No. 30 − 6 = 24 is only the first step. Then 24 ÷ 2 = 12, not 24.
      answer: [0, 2, 3]

    - slug: g5math-w14-q09
      type: multiple_choice
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 4, Section C"
      points: 1
      stimulus: |
        Use the table. A school is going on a field day trip, and everyone rides a bus.
      figure: figures/w14-trip-table.svg
      figure_alt: "A table titled Field day trip. Students going: 187. Adults going: 15. Seats on each bus: 48."
      prompt: |
        How many buses are needed so that everyone has a seat?
      options:
        - "4"
        - "10"
        - "202"
        - "5"
      option_explanations:
        - |
          4 buses hold 4 × 48 = 192 people, but 187 + 15 = 202 people are going. Ten people would have no seat.
        - |
          10 is the remainder in 202 ÷ 48 = 4 R 10, the people left after 4 full buses.
        - |
          202 is the number of people, 187 + 15. Divide by 48 to find the buses.
        - |
          Correct. 187 + 15 = 202 people, and 202 ÷ 48 = 4 R 10. The 10 extra people need a fifth bus.
      answer: 3

    - slug: g5math-w14-q10
      type: multiple_choice
      topic_code: "5.OA.A.1"
      source: "IM K–5 Math Grade 5, Unit 4, Section C"
      points: 1
      stimulus: |
        Use the table. A school is going on a field day trip, and everyone rides a bus.
      prompt: |
        The school uses 5 buses. Which expression gives the number of empty seats?
      options:
        - "5 × 48 − (187 + 15)"
        - "5 × 48 − 187 + 15"
        - "(187 + 15) ÷ 48"
        - "(187 + 15) − 5 × 48"
      option_explanations:
        - |
          Correct. 5 × 48 = 240 seats, and 187 + 15 = 202 people. 240 − 202 = 38 empty seats.
        - |
          Without parentheses this takes away the students and then adds the adults back: 240 − 187 + 15 = 68. Both groups need seats, so subtract them together.
        - |
          (187 + 15) ÷ 48 finds how many buses are needed, not how many seats are empty.
        - |
          This subtracts the wrong way. There are more seats (240) than people (202), so start with the seats.
      answer: 0

    - slug: g5math-w14-q11
      type: numeric
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 4, Section B"
      points: 1
      prompt: |
        A bakery makes 1,440 muffins. It packs 12 muffins in each box and puts 15 boxes on each tray. How many trays does it fill?
      answer: { value: 8, tolerance: 0 }
      explanation: |
        (1,440 ÷ 12) ÷ 15. 1,440 ÷ 12 = 120 boxes, and 120 ÷ 15 = 8 trays.

    - slug: g5math-w14-q12
      type: multiple_choice
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 4, Section A"
      points: 1
      prompt: |
        What is 2,104 × 36?
      options:
        - "18,936"
        - "63,120"
        - "75,744"
        - "2,140"
      option_explanations:
        - |
          18,936 is 12,624 + 6,312. The second row should be 2,104 × 30 = 63,120, not 2,104 × 3.
        - |
          63,120 is only 2,104 × 30. The first row, 2,104 × 6 = 12,624, still has to be added.
        - |
          Correct. 2,104 × 6 = 12,624 and 2,104 × 30 = 63,120. 12,624 + 63,120 = 75,744.
        - |
          2,140 is 2,104 + 36. Multiplying makes 36 groups of 2,104.
      answer: 2

    - slug: g5math-w14-q13
      type: multiple_choice
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        How many pieces that are each 1/3 of a meter long can be cut from a rope 5 meters long?
      options:
        - "5/3"
        - "15"
        - "8"
        - "1/15"
      option_explanations:
        - |
          5/3 is 5 × 1/3, which is less than 2 meters. Each meter holds 3 pieces, so there are many more pieces.
        - |
          Correct. 5 ÷ 1/3 = 15. Each meter holds 3 pieces, and 5 × 3 = 15.
        - |
          8 is 5 + 3. Each of the 5 meters gives 3 pieces, so multiply: 5 × 3 = 15.
        - |
          1/15 is 1/3 ÷ 5, the size of one piece if a third were shared five ways. The question asks how many pieces.
      answer: 1

    - slug: g5math-w14-q14
      type: numeric
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section C"
      points: 1
      prompt: |
        A toy shelf is made of two boxes. One box is 3 feet by 4 feet by 5 feet. The other is 2 feet by 4 feet by 5 feet. What is the total volume, in cubic feet?
      answer: { value: 100, tolerance: 0 }
      explanation: |
        3 × 4 × 5 = 60 cubic feet and 2 × 4 × 5 = 40 cubic feet. 60 + 40 = 100 cubic feet.

    - slug: g5math-w14-q15
      type: short_answer
      topic_code: "5.OA.A.1"
      source: "IM K–5 Math Grade 5, Unit 4, Section C"
      points: 2
      prompt: |
        Ms. Okafor buys 6 packs of markers with 24 markers in each pack. She keeps 30 markers for herself and shares the rest equally among 3 tables.

        (a) Write one expression for the number of markers each table gets. Use parentheses or brackets to show which steps come first.
        (b) Find the value of your expression.
      answer: |
        (a) [(6 × 24) − 30] ÷ 3, or (6 × 24 − 30) ÷ 3.
        (b) 6 × 24 = 144. 144 − 30 = 114. 114 ÷ 3 = 38 markers for each table.
      explanation: |
        Two points.

        (a) 1 pt: an expression that multiplies 6 × 24, subtracts 30 and divides the result by 3, with grouping symbols that make the subtraction happen before the division, such as [(6 × 24) − 30] ÷ 3 or (6 × 24 − 30) ÷ 3. An expression such as 6 × 24 − 30 ÷ 3, which divides only the 30, earns no point.

        (b) 1 pt: 38 markers, with the steps 144, 114 and 38 (or a correct value of their own expression if (a) has a small slip).
