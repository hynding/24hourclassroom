week: 13
unit: 4
title: "Dividing by Two-Digit Numbers"
topics: ["5.NBT.B.6"]
guide: guides/week-13.md
guide_description: |
  How to divide numbers up to four digits by a two-digit number: take away friendly multiples of the divisor
  (partial quotients), draw a division area diagram, estimate first, deal with remainders and check by
  multiplying.
flashcards_description: |
  18 cards on dividing by two-digit numbers: friendly multiples of the divisor, partial quotients, area
  diagrams, estimating quotients, remainders and what they mean in a story, and checking with multiplication.

flashcards:
  - front: Dividing by a two-digit number → the big question
    back: |
      How many groups of the divisor fit in the number? 1,512 ÷ 24 asks "24 times what is 1,512?"
    topic_code: "5.NBT.B.6"
  - front: Friendly multiples of 24 → a list to start with
    back: |
      24 × 10 = 240, 24 × 20 = 480, 24 × 50 = 1,200 and 24 × 100 = 2,400. Doubling and times 10 make more.
    topic_code: "5.NBT.B.6"
  - front: Partial quotients with a two-digit divisor → the steps
    back: |
      Take away a friendly multiple of the divisor, write how many groups it was, and repeat with what is left. Add the groups at the end.
    topic_code: "5.NBT.B.6"
  - front: 1,512 ÷ 24 → by partial quotients
    back: |
      Take away 1,200 (50 groups), 240 (10 groups) and 72 (3 groups). 50 + 10 + 3 = 63.
    topic_code: "5.NBT.B.6"
  - front: 4,176 ÷ 48 → by partial quotients
    back: |
      Take away 2,400 (50 groups), 1,440 (30 groups) and 336 (7 groups). 50 + 30 + 7 = 87.
    topic_code: "5.NBT.B.6"
  - front: Division area diagram with a two-digit side → what the tops mean
    back: |
      The side is the divisor and each part's area is a chunk of the dividend. The tops are the partial quotients; add them for the quotient.
    topic_code: "5.NBT.B.6"
  - front: 3,600 ÷ 40 → using tens
    back: |
      3,600 is 360 tens and 40 is 4 tens. 360 ÷ 4 = 90, so 3,600 ÷ 40 = 90.
    topic_code: "5.NBT.B.6"
  - front: 2,754 ÷ 51 → estimate
    back: |
      Use friendly numbers: 2,500 ÷ 50 = 50, or 3,000 ÷ 50 = 60. The quotient is between 50 and 60. (It is 54.)
    topic_code: "5.NBT.B.6"
  - front: Divisor in 1,512 ÷ 24 → which number
    back: |
      The number you divide by. In 1,512 ÷ 24 = 63, the divisor is 24.
    topic_code: "5.NBT.B.6"
  - front: Dividend in 1,512 ÷ 24 → which number
    back: |
      The number being divided. In 1,512 ÷ 24 = 63, the dividend is 1,512.
    topic_code: "5.NBT.B.6"
  - front: 935 ÷ 22 → quotient and remainder
    back: |
      22 × 40 = 880 and 22 × 2 = 44, so 42 groups use 924. 935 − 924 = 11, so 42 R 11.
    topic_code: "5.NBT.B.6"
  - front: Remainder of 33 when dividing by 22 → what it means
    back: |
      Not finished: 33 holds another 22. A remainder must be less than the divisor.
    topic_code: "5.NBT.B.6"
  - front: 412 students, buses that hold 48 → how many buses
    back: |
      412 ÷ 48 = 8 R 28. Eight buses leave 28 students behind, so 9 buses are needed.
    topic_code: "5.NBT.B.6"
  - front: Remainder in a story → three choices
    back: |
      Drop it (full boxes only), round up (everyone needs a seat), or answer with it (how many are left over). Read the question to decide.
    topic_code: "5.NBT.B.6"
  - front: Checking 935 ÷ 22 = 42 R 11 → how
    back: |
      Multiply and add the remainder: 22 × 42 = 924, and 924 + 11 = 935. It matches.
    topic_code: "5.NBT.B.6"
  - front: 1,368 ÷ 38 → quotient
    back: |
      36. 38 × 30 = 1,140, and 1,368 − 1,140 = 228 = 38 × 6. 30 + 6 = 36.
    topic_code: "5.NBT.B.6"
  - front: Big or small partial quotients → does it matter
    back: |
      No. Bigger chunks take fewer steps, but any friendly multiples work, as long as you add all the groups at the end.
    topic_code: "5.NBT.B.6"
  - front: Quotient too big, like 75 for 3,150 ÷ 45 → how to catch it
    back: |
      Multiply back: 45 × 75 = 3,375, which is more than 3,150. The real quotient is 70.
    topic_code: "5.NBT.B.6"

quiz:
  description: |
    15 questions · about 30 minutes · dividing three- and four-digit numbers by two-digit numbers with partial
    quotients and area diagrams, estimating quotients and using remainders in stories, plus review of the
    standard algorithm for multiplication, fractions and area. Multiple choice, select-all, true/false and
    number answers are graded at once; the fill-in word is matched automatically; the short answer is checked by
    your teacher.
  questions:
    - slug: g5math-w13-q01
      type: numeric
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 4, Section B"
      points: 1
      stimulus: |
        Use the area diagram. It shows 1,512 ÷ 24. The area of the whole rectangle is 1,512 and one side is 24.
      figure: figures/w13-area-1512.svg
      figure_alt: "A rectangle with its left side labeled 24, split into three parts with 1,200, 240 and 72 written inside. The tops of the parts are labeled 50, a bold question mark, and 3."
      prompt: |
        What number goes where the question mark is?
      answer: { value: 10, tolerance: 0 }
      explanation: |
        The middle part has an area of 240 and a side of 24. 24 × 10 = 240, so its top is 10.

    - slug: g5math-w13-q02
      type: multiple_choice
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 4, Section B"
      points: 1
      stimulus: |
        Use the area diagram. It shows 1,512 ÷ 24. The area of the whole rectangle is 1,512 and one side is 24.
      prompt: |
        What is 1,512 ÷ 24?
      options:
        - "53"
        - "63"
        - "60"
        - "13"
      option_explanations:
        - |
          53 is 50 + 3. It leaves out the middle part, which is 10 more groups of 24.
        - |
          Correct. The tops are 50, 10 and 3, and 50 + 10 + 3 = 63. Check: 24 × 63 = 1,512.
        - |
          60 is 50 + 10. It leaves out the last part, 72 = 24 × 3.
        - |
          13 is 10 + 3. It leaves out the biggest part, 1,200 = 24 × 50.
      answer: 1

    - slug: g5math-w13-q03
      type: multiple_choice
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 4, Section B"
      points: 1
      stimulus: |
        Use the picture. It shows Rosa's work for 4,176 ÷ 48 with partial quotients. The column on the right shows how many groups of 48 she took away each time. One of those numbers is a question mark.
      figure: figures/w13-partial-quotients-4176.svg
      figure_alt: "Rosa's division work. 48 is outside the division bracket and 4176 is inside. Below, she subtracts 2400 and writes 50 in the groups-of-48 column, leaving 1776. Then she subtracts 1440 and writes a bold question mark in the column, leaving 336. Then she subtracts 336 and writes 7 in the column, leaving 0."
      prompt: |
        What number goes where the question mark is?
      options:
        - "1,440"
        - "3"
        - "30"
        - "300"
      option_explanations:
        - |
          1,440 is the amount Rosa took away, not the number of groups. The column shows groups of 48.
        - |
          48 × 3 = 144, not 1,440. The amount taken away is ten times that, so it is 30 groups.
        - |
          Correct. 48 × 30 = 1,440, so taking away 1,440 is taking away 30 groups of 48.
        - |
          48 × 300 = 14,400, which is more than the whole dividend. 1,440 is only 30 groups.
      answer: 2

    - slug: g5math-w13-q04
      type: numeric
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 4, Section B"
      points: 1
      stimulus: |
        Use the picture. It shows Rosa's work for 4,176 ÷ 48 with partial quotients. The column on the right shows how many groups of 48 she took away each time. One of those numbers is a question mark.
      prompt: |
        What is 4,176 ÷ 48?
      answer: { value: 87, tolerance: 0 }
      explanation: |
        Add the groups: 50 + 30 + 7 = 87. Check: 48 × 87 = 4,176, and nothing is left over.

    - slug: g5math-w13-q05
      type: multiple_choice
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 4, Section B"
      points: 1
      prompt: |
        Which number is the best estimate for 2,754 ÷ 51?
      options:
        - "5"
        - "500"
        - "2,700"
        - "50"
      option_explanations:
        - |
          5 is 250 ÷ 50. The dividend is about 2,500, not 250, so the quotient is ten times bigger.
        - |
          50 × 500 = 25,000, far more than 2,754. The quotient is ten times smaller.
        - |
          2,700 is about 2,754 − 51. Division asks how many 51s fit in 2,754.
        - |
          Correct. 51 is close to 50, and 2,500 ÷ 50 = 50. The exact quotient is 54, which is close.
      answer: 3

    - slug: g5math-w13-q06
      type: numeric
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 4, Section B"
      points: 1
      prompt: |
        A school hall has 1,368 seats in rows of 38 seats each. How many rows are there?
      answer: { value: 36, tolerance: 0 }
      explanation: |
        1,368 ÷ 38. 38 × 30 = 1,140, which leaves 228. 38 × 6 = 228. 30 + 6 = 36 rows. Check: 38 × 36 = 1,368.

    - slug: g5math-w13-q07
      type: multiple_choice
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 4, Section B"
      points: 1
      prompt: |
        What is 935 ÷ 22?
      options:
        - "42 R 11"
        - "41 R 33"
        - "42 R 1"
        - "43 R 2"
      option_explanations:
        - |
          Correct. 22 × 42 = 924, and 935 − 924 = 11. The remainder 11 is less than 22, so it is 42 R 11.
        - |
          22 × 41 = 902 and 935 − 902 = 33, but 33 is more than 22. One more group fits, so it is 42 R 11.
        - |
          22 × 42 = 924 is right, but 935 − 924 is 11, not 1. Check the subtraction.
        - |
          22 × 43 = 946, which is more than 935. 43 groups do not fit.
      answer: 0

    - slug: g5math-w13-q08
      type: multiple_choice
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 4, Section C"
      points: 1
      prompt: |
        412 students are going to a science museum. Each bus holds 48 students. How many buses are needed so that every student can ride?
      options:
        - "8"
        - "9"
        - "28"
        - "8 R 28"
      option_explanations:
        - |
          8 buses hold 8 × 48 = 384 students, so 28 students would be left behind. They need one more bus.
        - |
          Correct. 412 ÷ 48 = 8 R 28. Eight full buses leave 28 students, so a ninth bus is needed.
        - |
          28 is the remainder, the students left after 8 full buses. The question asks for the number of buses.
        - |
          8 R 28 is the quotient, but there cannot be part of a bus. Think about what the 28 left-over students need.
      answer: 1

    - slug: g5math-w13-q09
      type: fill_blank
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 4, Section B"
      points: 1
      prompt: |
        In 1,512 ÷ 24 = 63, the number 24, which you divide by, is called the ____.
      answer: ["divisor", "the divisor", "divisors"]
      explanation: |
        Divisor. 1,512 is the dividend (the number being divided) and 63 is the quotient (the answer).

    - slug: g5math-w13-q10
      type: true_false
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section B"
      points: 1
      prompt: |
        True or false: 2/3 × 18 = 12.
      answer: true
      explanation: |
        True. 18 ÷ 3 = 6, so 1/3 of 18 is 6, and 2/3 of 18 is 2 × 6 = 12.

    - slug: g5math-w13-q11
      type: multi_select
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 4, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about 2,592 ÷ 32 are true? Select all that apply.
      options:
        - "2,592 ÷ 32 = 810"
        - "The quotient is 81."
        - "32 × 81 = 2,592"
        - "There is a remainder of 32."
        - "The quotient is between 80 and 90, because 32 × 80 = 2,560 and 32 × 90 = 2,880."
      option_explanations:
        - |
          False. 32 × 810 = 25,920, ten times too much. The quotient is 81.
        - |
          True. 32 × 80 = 2,560, which leaves 32, one more group. 80 + 1 = 81.
        - |
          True. 32 × 80 = 2,560 and 32 × 1 = 32, and 2,560 + 32 = 2,592. This is the check.
        - |
          False. A remainder of 32 would be one more whole group of 32. Nothing is left over.
        - |
          True. 2,592 is between 2,560 and 2,880, so the quotient is between 80 and 90.
      answer: [1, 2, 4]

    - slug: g5math-w13-q12
      type: multiple_choice
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 4, Section A"
      points: 1
      prompt: |
        What is 318 × 26?
      options:
        - "2,544"
        - "6,360"
        - "8,268"
        - "344"
      option_explanations:
        - |
          2,544 is 1,908 + 636. The second row should be 318 × 20 = 6,360, not 318 × 2 = 636.
        - |
          6,360 is only 318 × 20. The first row, 318 × 6 = 1,908, must be added too.
        - |
          Correct. 318 × 6 = 1,908 and 318 × 20 = 6,360. 1,908 + 6,360 = 8,268.
        - |
          344 is 318 + 26. Multiplying makes 26 groups of 318.
      answer: 2

    - slug: g5math-w13-q13
      type: numeric
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 4, Section A"
      points: 1
      prompt: |
        Each of 24 classrooms gets 125 sheets of drawing paper. How many sheets is that in all? (Type the digits without a comma.)
      answer: { value: 3000, tolerance: 0 }
      explanation: |
        125 × 24. 125 × 4 = 500 and 125 × 20 = 2,500. 500 + 2,500 = 3,000 sheets.

    - slug: g5math-w13-q14
      type: multiple_choice
      topic_code: "5.NF.B.6"
      source: "IM K–5 Math Grade 5, Unit 2, Section C"
      points: 1
      prompt: |
        A garden bed is 2 1/2 meters long and 3 meters wide. What is its area?
      options:
        - "7 1/2 square meters"
        - "6 1/2 square meters"
        - "5 1/2 square meters"
        - "6 square meters"
      option_explanations:
        - |
          Correct. 2 × 3 = 6 and 1/2 × 3 = 1 1/2. 6 + 1 1/2 = 7 1/2 square meters.
        - |
          6 1/2 is 2 × 3 + 1/2. The 1/2 must be multiplied by 3 as well: 1/2 × 3 = 1 1/2.
        - |
          5 1/2 is 2 1/2 + 3. Area multiplies the side lengths instead of adding them.
        - |
          6 is 2 × 3, leaving out the extra half meter. That strip is 1/2 × 3 = 1 1/2 square meters.
      answer: 0

    - slug: g5math-w13-q15
      type: short_answer
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 4, Section C"
      points: 2
      prompt: |
        Jamal is packing 1,000 granola bars into boxes. Each box holds 24 bars.

        (a) What is 1,000 ÷ 24? Give the quotient and the remainder.
        (b) Jamal says he needs 41 boxes to pack every bar. Is he right? Explain.
      answer: |
        (a) 41 R 16. 24 × 40 = 960 and 24 × 1 = 24, so 41 groups use 984, and 1,000 − 984 = 16.
        (b) No. 41 boxes hold 984 bars, so 16 bars have no box. He needs 42 boxes (the last box is not full).
      explanation: |
        Two points.

        (a) 1 pt: 41 R 16, with work such as partial quotients or 24 × 41 = 984.

        (b) 1 pt: says he is not right and needs 42 boxes, because the 16 left-over bars need one more box. "42" with no reason earns no point.
