week: 12
unit: 4
title: "The Standard Algorithm for Multiplication"
topics: ["5.NBT.B.5"]
guide: guides/week-12.md
guide_description: |
  How the standard algorithm for multiplication works and why: start with the ones, regroup into the next
  place, write one row (partial product) for each digit of a two-digit factor, and estimate to check.
flashcards_description: |
  18 cards on the standard algorithm: regrouping, what each small digit means, the zero in the tens row,
  zeros in a factor, partial products and estimating products of multi-digit numbers.

flashcards:
  - front: Standard algorithm for multiplication → what it is
    back: |
      A short, written way to multiply. Multiply one place at a time, starting with the ones, and write the regrouped amounts above the next place.
    topic_code: "5.NBT.B.5"
  - front: Standard algorithm → which place to start with
    back: |
      The ones. Then the tens, then the hundreds, moving left. Each regrouped amount gets added to the next place.
    topic_code: "5.NBT.B.5"
  - front: Regrouping in 473 × 6 → the ones place
    back: |
      3 × 6 = 18 ones. Write 8 in the ones place and put 1 ten above the tens place.
    topic_code: "5.NBT.B.5"
  - front: Small 4 above the hundreds in 473 × 6 → what it means
    back: |
      4 hundreds. 7 tens × 6 = 42 tens, plus 1 regrouped ten is 43 tens. That is 4 hundreds and 3 tens.
    topic_code: "5.NBT.B.5"
  - front: 473 × 6 → by the standard algorithm
    back: |
      2,838. Ones: 18, write 8. Tens: 42 + 1 = 43, write 3. Hundreds: 24 + 4 = 28.
    topic_code: "5.NBT.B.5"
  - front: Standard algorithm and partial products → how they match
    back: |
      They find the same parts. The algorithm adds the regrouped amounts as it goes, so it writes fewer rows.
    topic_code: "5.NBT.B.5"
  - front: Two-digit factor in the algorithm → how many rows
    back: |
      Two rows before the total: the top factor times the ones digit, then the top factor times the tens digit.
    topic_code: "5.NBT.B.5"
  - front: Zero at the end of the tens row → why it is there
    back: |
      The second row multiplies by tens. In 56 × 23 it is 56 × 20 = 1,120, so the row ends in 0.
    topic_code: "5.NBT.B.5"
  - front: 56 × 23 → by the standard algorithm
    back: |
      56 × 3 = 168 and 56 × 20 = 1,120. 168 + 1,120 = 1,288.
    topic_code: "5.NBT.B.5"
  - front: 312 × 24 → the two rows
    back: |
      312 × 4 = 1,248 and 312 × 20 = 6,240. The product is 7,488.
    topic_code: "5.NBT.B.5"
  - front: 609 × 47 → a zero in a factor
    back: |
      609 × 7 = 4,263 and 609 × 40 = 24,360. 4,263 + 24,360 = 28,623. The 0 tens times any digit is still 0, but add any regrouped amount.
    topic_code: "5.NBT.B.5"
  - front: 3,208 × 4 → by the standard algorithm
    back: |
      8 × 4 = 32: write 2, regroup 3 tens. 0 × 4 = 0, plus 3 = 3. 2 × 4 = 8. 3 × 4 = 12. The product is 12,832.
    topic_code: "5.NBT.B.5"
  - front: Forgetting the zero in the tens row → what goes wrong
    back: |
      The row is 10 times too small. 312 × 24 is not 1,248 + 624. The tens row is 312 × 20 = 6,240.
    topic_code: "5.NBT.B.5"
  - front: Forgetting a regrouped digit → what goes wrong
    back: |
      The answer is too small in one place. Always add the small digit after you multiply in that place.
    topic_code: "5.NBT.B.5"
  - front: Estimating 487 × 62 → how
    back: |
      Round to 500 × 60 = 30,000. The exact product, 30,194, is close.
    topic_code: "5.NBT.B.5"
  - front: Three-digit times two-digit → how big the product can be
    back: |
      At least 1,000 (100 × 10) and less than 100,000 (1,000 × 100). So it has four or five digits.
    topic_code: "5.NBT.B.5"
  - front: 38 × 144 → a story
    back: |
      38 boxes with 144 pencils in each box. 144 × 8 = 1,152 and 144 × 30 = 4,320, so 5,472 pencils.
    topic_code: "5.NBT.B.5"
  - front: Checking a product → two quick ways
    back: |
      Estimate with rounded factors, or switch the order of the factors and multiply again. Both ways should agree.
    topic_code: "5.NBT.B.5"

quiz:
  description: |
    15 questions · about 30 minutes · the standard algorithm for multiplying multi-digit numbers, regrouping,
    the two rows for a two-digit factor and estimating, plus review of volume, fractions of whole numbers and
    dividing with unit fractions. Multiple choice, select-all, true/false and number answers are graded at once;
    the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g5math-w12-q01
      type: multiple_choice
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 4, Section A"
      points: 1
      stimulus: |
        Use the picture. It shows Mai's work for 473 × 6 with the standard algorithm. The small blue digits are the amounts she regrouped.
      figure: figures/w12-algorithm-473x6.svg
      figure_alt: "Mai's written work. The top line is 473 and below it is times 6, with a line under them. Under the line the product is 2838. Above the 7 in 473 is a small blue 1, and above the 4 in 473 is a small blue 4."
      prompt: |
        What does the small 4 above the hundreds place stand for?
      options:
        - "4 tens"
        - "4 hundreds"
        - "4 ones"
        - "4 thousands"
      option_explanations:
        - |
          The 4 is written above the hundreds place, so it is worth hundreds. It came from 43 tens, which is 4 hundreds and 3 tens.
        - |
          Correct. 7 tens × 6 = 42 tens, and the regrouped 1 ten makes 43 tens. That is 4 hundreds and 3 tens, so 4 hundreds move to the hundreds place.
        - |
          The ones gave only 3 × 6 = 18, which is the small 1 above the tens. The 4 came from multiplying the tens.
        - |
          Thousands come from the last step, 4 hundreds × 6 + 4 hundreds = 28 hundreds. The small 4 is added in that step, so it is hundreds.
      answer: 1

    - slug: g5math-w12-q02
      type: true_false
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 4, Section A"
      points: 1
      stimulus: |
        Use the picture. It shows Mai's work for 473 × 6 with the standard algorithm. The small blue digits are the amounts she regrouped.
      prompt: |
        True or false: Mai's product is reasonable, because 473 is close to 500 and 500 × 6 = 3,000.
      answer: true
      explanation: |
        True. 2,838 is close to the estimate 3,000, and it is a little less because 473 is a little less than 500. Partial products agree: 2,400 + 420 + 18 = 2,838.

    - slug: g5math-w12-q03
      type: numeric
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 4, Section A"
      points: 1
      stimulus: |
        Use the picture. Diego is finding 56 × 23 with the standard algorithm. He has written the first row. The second row is a question mark.
      figure: figures/w12-algorithm-56x23.svg
      figure_alt: "Diego's written work. The top line is 56 and below it is times 23, with a line under them. The first row under the line is 168. The second row, with a plus sign in front of it, is a bold question mark. Below that is another line with nothing under it yet."
      prompt: |
        What number belongs in the second row, where the question mark is? (Type the digits without a comma.)
      answer: { value: 1120, tolerance: 0 }
      explanation: |
        The second row multiplies 56 by the 2 in the tens place, which is 20. 56 × 20 = 1,120. The 0 at the end shows it is tens.

    - slug: g5math-w12-q04
      type: multiple_choice
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 4, Section A"
      points: 1
      stimulus: |
        Use the picture. Diego is finding 56 × 23 with the standard algorithm. He has written the first row. The second row is a question mark.
      prompt: |
        What is 56 × 23?
      options:
        - "280"
        - "1,120"
        - "1,288"
        - "79"
      option_explanations:
        - |
          280 is 168 + 112. The second row was written as 56 × 2 instead of 56 × 20, so it lost its zero.
        - |
          1,120 is only the second row, 56 × 20. The first row, 56 × 3 = 168, still has to be added.
        - |
          Correct. 56 × 3 = 168 and 56 × 20 = 1,120. 168 + 1,120 = 1,288.
        - |
          79 is 56 + 23. The algorithm multiplies, so the product is much bigger than either factor.
      answer: 2

    - slug: g5math-w12-q05
      type: multiple_choice
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 4, Section A"
      points: 1
      prompt: |
        What is 3,208 × 4?
      options:
        - "12,832"
        - "12,802"
        - "1,232"
        - "3,212"
      option_explanations:
        - |
          Correct. 8 × 4 = 32: write 2 and regroup 3 tens. 0 × 4 + 3 = 3 tens. 2 × 4 = 8 hundreds. 3 × 4 = 12 thousands. The product is 12,832.
        - |
          12,802 forgets the 3 tens regrouped from 8 × 4 = 32. Zero tens times 4 is 0, but the 3 tens still have to be added.
        - |
          1,232 is 308 × 4. The 3 in the thousands place has to be multiplied too: 3,000 × 4 = 12,000.
        - |
          3,212 is 3,208 + 4. Multiplying by 4 makes four groups of 3,208.
      answer: 0

    - slug: g5math-w12-q06
      type: numeric
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 4, Section A"
      points: 1
      prompt: |
        A school orders 38 boxes of pencils. Each box holds 144 pencils. How many pencils does the school order? (Type the digits without a comma.)
      answer: { value: 5472, tolerance: 0 }
      explanation: |
        144 × 38. First row: 144 × 8 = 1,152. Second row: 144 × 30 = 4,320. 1,152 + 4,320 = 5,472 pencils. Estimate: 150 × 40 = 6,000, so the answer is reasonable.

    - slug: g5math-w12-q07
      type: multiple_choice
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 4, Section A"
      points: 1
      prompt: |
        Which is the best estimate for 487 × 62?
      options:
        - "3,000"
        - "300,000"
        - "549"
        - "30,000"
      option_explanations:
        - |
          3,000 is 500 × 6. 62 is about 6 tens, so the estimate is 500 × 60, which is ten times as much.
        - |
          300,000 is ten times too big. 5 hundreds × 6 tens = 30 thousands, not 300 thousands.
        - |
          549 is 487 + 62. To estimate a product, round the factors and multiply them.
        - |
          Correct. Round to 500 × 60. 5 × 6 = 30, and hundreds times tens gives thousands, so 30,000. The exact product is 30,194.
      answer: 3

    - slug: g5math-w12-q08
      type: fill_blank
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 4, Section A"
      points: 1
      prompt: |
        In the standard algorithm for 56 × 23, the rows 168 and 1,120 are each called a partial ____.
      answer: ["product", "products"]
      explanation: |
        Partial product. Each row is one part of the whole product: 56 × 3 and 56 × 20. Adding them gives the product, 1,288.

    - slug: g5math-w12-q09
      type: multi_select
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 4, Section A"
      points: 2
      partial_credit: true
      prompt: |
        Which of these are equal to 245 × 36? Select all that apply.
      options:
        - "245 × 3 + 245 × 6"
        - "245 × 30 + 245 × 6"
        - "200 × 30 + 45 × 6"
        - "8,820"
        - "7,350 + 1,470"
      option_explanations:
        - |
          Not equal. The 3 in 36 is 3 tens, so the first part must be 245 × 30, not 245 × 3. This adds to only 2,205.
        - |
          Equal. 36 = 30 + 6, and each part is multiplied by 245. These are the two rows of the algorithm.
        - |
          Not equal. It leaves out 200 × 6 and 45 × 30. It adds to only 6,270.
        - |
          Equal. 245 × 6 = 1,470 and 245 × 30 = 7,350, and 1,470 + 7,350 = 8,820.
        - |
          Equal. 7,350 is 245 × 30 and 1,470 is 245 × 6, the two partial products.
      answer: [1, 3, 4]

    - slug: g5math-w12-q10
      type: multiple_choice
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 4, Section A"
      points: 1
      prompt: |
        Kai used the standard algorithm for 312 × 24. His two rows were 1,248 and 624, so he wrote 1,872. What went wrong?
      options:
        - "The first row should be 624, because 312 × 2 = 624."
        - "He added the rows wrong, because 1,248 + 624 is 1,862."
        - "The second row should be 6,240, because it is 312 × 2 tens."
        - "He should have added 312 and 24 before multiplying."
      option_explanations:
        - |
          The first row is 312 times the ones digit, 4, and 312 × 4 = 1,248 is right. The mistake is in the second row.
        - |
          1,248 + 624 really is 1,872, so the adding is fine. The problem is the second row, which is 10 times too small.
        - |
          Correct. The 2 in 24 means 2 tens, so the second row is 312 × 20 = 6,240. The product is 1,248 + 6,240 = 7,488.
        - |
          Adding the factors does not help find a product. Kai's method was right except for the missing zero in the tens row.
      answer: 2

    - slug: g5math-w12-q11
      type: multiple_choice
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      stimulus: |
        Use the picture of a box shaped like a rectangular prism.
      figure: figures/w12-prism-6x4x5.svg
      figure_alt: "A rectangular prism drawn in a slanted view, with hidden edges dashed. Its length along the front bottom edge is labeled 6 cm, its depth along the bottom right edge is labeled 4 cm, and its height along the right back edge is labeled 5 cm."
      prompt: |
        What is the volume of the box?
      options:
        - "120 cubic centimeters"
        - "15 cubic centimeters"
        - "24 cubic centimeters"
        - "30 cubic centimeters"
      option_explanations:
        - |
          Correct. Volume = length × width × height = 6 × 4 × 5 = 120 cubic centimeters.
        - |
          15 is 6 + 4 + 5. Volume multiplies the three edge lengths instead of adding them.
        - |
          24 is 6 × 4, the area of the base. Multiply by the height, 5, to count every layer: 24 × 5 = 120.
        - |
          30 is 6 × 5, which uses only two of the edges. The depth, 4 cm, must be multiplied too.
      answer: 0

    - slug: g5math-w12-q12
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section B"
      points: 1
      prompt: |
        A class has 28 students. 3/4 of them walk to school. How many students walk to school?
      options:
        - "7"
        - "84"
        - "112"
        - "21"
      option_explanations:
        - |
          7 is 1/4 of 28. Three fourths is 3 of those groups: 3 × 7 = 21.
        - |
          84 is 3 × 28. Finding 3/4 of 28 also divides by 4: 84 ÷ 4 = 21.
        - |
          112 is 4 × 28. To find a fourth, divide by 4 instead of multiplying.
        - |
          Correct. 28 ÷ 4 = 7, so 1/4 of the class is 7 students, and 3/4 is 3 × 7 = 21 students.
      answer: 3

    - slug: g5math-w12-q13
      type: multiple_choice
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        1/3 of a pan of cornbread is shared equally by 4 friends. What fraction of the whole pan does each friend get?
      options:
        - "4/3"
        - "1/12"
        - "3/4"
        - "1/7"
      option_explanations:
        - |
          4/3 is 4 × 1/3, more than a whole pan. Sharing 1/3 among 4 friends gives each friend less than 1/3.
        - |
          Correct. 1/3 ÷ 4 = 1/12. Cutting each third into 4 equal pieces makes 12 pieces in the whole pan.
        - |
          3/4 is the fraction turned upside down. Each friend gets a small part of one third, much less than 3/4.
        - |
          1/7 adds 3 and 4. Splitting each third into 4 pieces makes 3 × 4 = 12 pieces in the pan, not 7.
      answer: 1

    - slug: g5math-w12-q14
      type: numeric
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        A cook has 6 cups of rice and a scoop that holds 1/4 cup. How many full scoops of rice is that?
      answer: { value: 24, tolerance: 0 }
      explanation: |
        6 ÷ 1/4 = 24. Each cup holds 4 quarter-cup scoops, so 6 cups hold 6 × 4 = 24 scoops.

    - slug: g5math-w12-q15
      type: short_answer
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 4, Section A"
      points: 2
      prompt: |
        Ana is finding 427 × 35 with the standard algorithm.

        (a) What two rows (partial products) should she write before adding?
        (b) What is 427 × 35? Show how an estimate tells you the answer makes sense.
      answer: |
        (a) 427 × 5 = 2,135 and 427 × 30 = 12,810.
        (b) 2,135 + 12,810 = 14,945. Estimate: 400 × 35 = 14,000 (or 430 × 35 is about 15,000), which is close to 14,945.
      explanation: |
        Two points.

        (a) 1 pt: both rows, 2,135 and 12,810. A second row written as 1,281 (without the zero) earns no point.

        (b) 1 pt: 14,945 with any sensible estimate near 14,000 to 16,000, such as 400 × 35 = 14,000 or 400 × 40 = 16,000.
