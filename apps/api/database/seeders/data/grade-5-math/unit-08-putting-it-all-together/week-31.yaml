week: 31
unit: 8
title: "Designing With Everything We Know"
topics: ["5.OA.A.2", "5.G.A.2"]
guide: guides/week-31.md
guide_description: |
  A design week: planning a park on a coordinate grid, finding distances along grid lines, placing the corners
  of rectangles, and writing expressions that describe a plan before you work them out, using the volume,
  fraction and decimal skills from the whole year.
flashcards_description: |
  18 cards on reading and plotting ordered pairs, moving right and up, distances along grid lines, corners of
  rectangles on a grid, writing expressions from words, reading expressions without working them out, and
  using brackets in a plan.

flashcards:
  - front: Year-end · (4, 8) → how to plot it
    back: |
      Start at the origin (0, 0). Move 4 units right along the x-axis, then 8 units up. The first number is always across.
    topic_code: "5.G.A.2"
  - front: Year-end · (3, 7) and (7, 3) → the same point
    back: |
      No. (3, 7) is 3 right and 7 up; (7, 3) is 7 right and 3 up. The order of the numbers matters.
    topic_code: "5.G.A.2"
  - front: Year-end · from (2, 3) to (7, 3) → the distance
    back: |
      5 units. The y-coordinates match, so the points are on the same horizontal line. Subtract the x-coordinates: 7 − 2 = 5.
    topic_code: "5.G.A.2"
  - front: Year-end · from (6, 1) to (6, 5) → the distance
    back: |
      4 units. The x-coordinates match, so the points are on the same vertical line. Subtract the y-coordinates: 5 − 1 = 4.
    topic_code: "5.G.A.2"
  - front: Year-end · start at (2, 3), move 4 right → new point
    back: |
      (6, 3). Moving right adds to the x-coordinate: 2 + 4 = 6. The y-coordinate stays 3.
    topic_code: "5.G.A.2"
  - front: Year-end · start at (5, 2), move 3 up → new point
    back: |
      (5, 5). Moving up adds to the y-coordinate: 2 + 3 = 5. The x-coordinate stays 5.
    topic_code: "5.G.A.2"
  - front: Year-end · rectangle corners (1, 2), (6, 2), (6, 6) → the fourth corner
    back: |
      (1, 6). It sits above (1, 2) and level with (6, 6), so it takes x = 1 from one and y = 6 from the other.
    topic_code: "5.G.A.2"
  - front: Year-end · rectangle on a grid → its side lengths
    back: |
      Subtract coordinates. From (1, 2) to (6, 2) is 6 − 1 = 5 units; from (6, 2) to (6, 6) is 6 − 2 = 4 units.
    topic_code: "5.G.A.2"
  - front: Year-end · the origin
    back: |
      The point (0, 0), where the x-axis and the y-axis meet.
    topic_code: "5.G.A.2"
  - front: Year-end · a point on the y-axis → its x-coordinate
    back: |
      0. A point like (0, 5) has not moved right at all, so it sits on the y-axis.
    topic_code: "5.G.A.2"
  - front: Year-end · "add 6 and 9, then multiply by 4" → expression
    back: |
      4 × (6 + 9). The parentheses show the adding happens first.
    topic_code: "5.OA.A.2"
  - front: Year-end · "multiply 4 by 6, then add 9" → expression
    back: |
      4 × 6 + 9. No parentheses are needed, because multiplying comes before adding anyway.
    topic_code: "5.OA.A.2"
  - front: Year-end · 25 × (48 + 17) compared with 48 + 17
    back: |
      It is 25 times as large. You can tell without working out 48 + 17.
    topic_code: "5.OA.A.2"
  - front: Year-end · 3 × (125 + 46) in words
    back: |
      Three times the sum of 125 and 46.
    topic_code: "5.OA.A.2"
  - front: Year-end · (36 + 54) ÷ 2 → what it means
    back: |
      Half of the sum of 36 and 54. Find the sum first, then split it into 2 equal parts: 90 ÷ 2 = 45.
    topic_code: "5.OA.A.2"
  - front: Year-end · 2 × [15 + (9 − 4)] → the value
    back: |
      40. Parentheses first: 9 − 4 = 5. Then brackets: 15 + 5 = 20. Then 2 × 20 = 40.
    topic_code: "5.OA.A.1"
  - front: Year-end · perimeter of a 5 by 3 rectangle → an expression
    back: |
      2 × (5 + 3) = 16 units. Add one length and one width, then double it, because each side appears twice.
    topic_code: "5.OA.A.2"
  - front: Year-end · designing a plan → a good order of steps
    back: |
      Sketch it on a grid, label the points, write an expression for each amount, then work the expressions out and check that the numbers make sense.
    topic_code: "5.OA.A.2"

quiz:
  description: |
    14 questions · about 30 minutes · a park map and a garden plan on the coordinate grid, distances along grid
    lines, writing and reading expressions, plus review of brackets, the hierarchy of shapes, number patterns
    and volume. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word
    is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g5math-w31-q01
      type: multiple_choice
      topic_code: "5.G.A.2"
      source: "IM K–5 Math Grade 5, Unit 8, Section D"
      points: 1
      stimulus: |
        Use the park map. Count distances in grid units.
      figure: figures/w31-park-map.svg
      figure_alt: "A coordinate grid titled Park map, with the x-axis and the y-axis each numbered 0 to 10. Four points are marked: Gate at (2, 3), Slide at (7, 3), Pond at (4, 8) and Garden at (8, 7)."
      prompt: |
        What are the coordinates of the pond?
      options:
        - "(8, 4)"
        - "(4, 8)"
        - "(4, 7)"
        - "(5, 8)"
      option_explanations:
        - |
          (8, 4) lists the numbers backwards. The pond is 4 units right and 8 units up, and the across number comes first.
        - |
          Correct. From the origin, go 4 units right and 8 units up to reach the pond: (4, 8).
        - |
          (4, 7) is one unit too low. Read straight across from the pond to the y-axis: it lines up with 8.
        - |
          (5, 8) is one unit too far right. Read straight down from the pond to the x-axis: it lines up with 4.
      answer: 1

    - slug: g5math-w31-q02
      type: numeric
      topic_code: "5.G.A.2"
      source: "IM K–5 Math Grade 5, Unit 8, Section D"
      points: 1
      stimulus: |
        Use the park map. Count distances in grid units.
      prompt: |
        Sam walks in a straight line along a grid line from the gate to the slide. How many grid units does he walk?
      answer: { value: 5, tolerance: 0 }
      explanation: |
        The gate is at (2, 3) and the slide is at (7, 3). Both have y-coordinate 3, so the path is horizontal. 7 − 2 = 5 units.

    - slug: g5math-w31-q03
      type: multiple_choice
      topic_code: "5.OA.A.2"
      source: "IM K–5 Math Grade 5, Unit 8, Section D"
      points: 1
      prompt: |
        Which expression means "add 6 and 9, then multiply the sum by 4"?
      options:
        - "4 × 6 + 9"
        - "(4 + 6) × 9"
        - "4 + 6 × 9"
        - "4 × (6 + 9)"
      option_explanations:
        - |
          4 × 6 + 9 multiplies first and then adds 9. Parentheses are needed to show that 6 + 9 comes first.
        - |
          (4 + 6) × 9 adds 4 and 6, but the words say to add 6 and 9.
        - |
          4 + 6 × 9 multiplies 6 by 9 and adds 4. There is no sum of 6 and 9 in it.
        - |
          Correct. The parentheses hold the sum of 6 and 9, and the 4 multiplies that sum.
      answer: 3

    - slug: g5math-w31-q04
      type: multiple_choice
      topic_code: "5.OA.A.2"
      source: "IM K–5 Math Grade 5, Unit 8, Section D"
      points: 1
      prompt: |
        Without working it out, how does 25 × (48 + 17) compare with 48 + 17?
      options:
        - "It is 25 times as large as 48 + 17."
        - "It is 25 more than 48 + 17."
        - "It is the same as 48 + 17."
        - "It is 25 less than 48 + 17."
      option_explanations:
        - |
          Correct. The expression multiplies the sum 48 + 17 by 25, so it is 25 times as large.
        - |
          "25 more" would be 25 + (48 + 17). The × sign means 25 groups of the sum.
        - |
          The sum is multiplied by 25, so the value changes. Only multiplying by 1 keeps a number the same.
        - |
          "25 less" would be (48 + 17) − 25. Multiplying a number by 25 makes it larger, not smaller.
      answer: 0

    - slug: g5math-w31-q05
      type: multiple_choice
      topic_code: "5.G.A.2"
      source: "IM K–5 Math Grade 5, Unit 8, Section D"
      points: 1
      stimulus: |
        A garden bed is a rectangle ABCD. Three of its corners are plotted on the grid, and each grid unit is 1 meter.
      figure: figures/w31-rectangle-corners.svg
      figure_alt: "A coordinate grid titled Three corners of a rectangle, with both axes numbered 0 to 8. Point A is at (1, 2), point B is at (6, 2) and point C is at (6, 6). A blue segment joins A to B, and another joins B to C. The fourth corner is not drawn."
      prompt: |
        Where is the fourth corner, D?
      options:
        - "(6, 1)"
        - "(2, 6)"
        - "(1, 6)"
        - "(1, 5)"
      option_explanations:
        - |
          (6, 1) switches the numbers. D must be straight above A, so its x-coordinate is 1, and level with C, so its y-coordinate is 6.
        - |
          (2, 6) uses A's y-coordinate as the x-coordinate. D is above A, so it shares A's x-coordinate, 1.
        - |
          Correct. D is straight above A (x = 1) and level with C (y = 6), so D is at (1, 6).
        - |
          (1, 5) is one unit too low. The side AD must be as long as BC, which goes from y = 2 to y = 6.
      answer: 2

    - slug: g5math-w31-q06
      type: numeric
      topic_code: "5.G.A.2"
      source: "IM K–5 Math Grade 5, Unit 8, Section D"
      points: 1
      stimulus: |
        A garden bed is a rectangle ABCD. Three of its corners are plotted on the grid, and each grid unit is 1 meter.
      prompt: |
        What is the area of the garden bed in square meters?
      answer: { value: 20, tolerance: 0 }
      explanation: |
        AB goes from x = 1 to x = 6, so it is 6 − 1 = 5 meters. BC goes from y = 2 to y = 6, so it is 6 − 2 = 4 meters. Area = 5 × 4 = 20 square meters.

    - slug: g5math-w31-q07
      type: numeric
      topic_code: "5.OA.A.1"
      source: "IM K–5 Math Grade 5, Unit 4, Section C"
      points: 1
      prompt: |
        What is the value of 2 × [15 + (9 − 4)]?
      answer: { value: 40, tolerance: 0 }
      explanation: |
        Parentheses first: 9 − 4 = 5. Then the brackets: 15 + 5 = 20. Then 2 × 20 = 40.

    - slug: g5math-w31-q08
      type: true_false
      topic_code: "5.G.A.1"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      prompt: |
        True or false: the point (0, 5) is on the x-axis.
      answer: false
      explanation: |
        False. Its x-coordinate is 0, so it does not move right at all; it is 5 units up the y-axis. Points on the x-axis have a y-coordinate of 0, like (5, 0).

    - slug: g5math-w31-q09
      type: fill_blank
      topic_code: "5.G.A.1"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      prompt: |
        The point (0, 0), where the x-axis and the y-axis meet, is called the ____.
      answer: ["origin", "the origin", "origins"]
      explanation: |
        The origin is the starting point for every ordered pair: (4, 8) means 4 right and 8 up from the origin.

    - slug: g5math-w31-q10
      type: multi_select
      topic_code: "5.OA.B.3"
      source: "IM K–5 Math Grade 5, Unit 7, Section C"
      points: 2
      partial_credit: true
      prompt: |
        Pattern A starts at 0 and adds 3 each time. Pattern B starts at 0 and adds 6 each time. Which ordered pairs (Pattern A term, Pattern B term) belong to the two patterns? Select all that apply.
      options:
        - "(3, 6)"
        - "(6, 3)"
        - "(9, 18)"
        - "(12, 24)"
        - "(6, 9)"
      option_explanations:
        - |
          Yes. The second terms are 3 (0, then 3) and 6 (0, then 6).
        - |
          No. The numbers are in the wrong order: the second terms make the pair (3, 6), with Pattern A first.
        - |
          Yes. The fourth terms are 9 (0, 3, 6, 9) and 18 (0, 6, 12, 18).
        - |
          Yes. The fifth terms are 12 and 24. Each Pattern B term is twice the Pattern A term.
        - |
          No. When Pattern A is at 6, Pattern B is at 12, not 9. Adding 3 to both patterns would give 9.
      answer: [0, 2, 3]

    - slug: g5math-w31-q11
      type: multiple_choice
      topic_code: "5.G.B.4"
      source: "IM K–5 Math Grade 5, Unit 7, Section B"
      points: 1
      prompt: |
        Which statement is always true?
      options:
        - "Every rectangle is a square."
        - "Every square is a rectangle."
        - "Every rhombus is a square."
        - "Every parallelogram is a rectangle."
      option_explanations:
        - |
          A rectangle 2 units by 5 units has four right angles but sides that are not all equal, so it is not a square.
        - |
          Correct. A square has four right angles, which is all a rectangle needs. A square is a special rectangle.
        - |
          A rhombus has four equal sides, but its angles do not have to be right angles. Only some rhombuses are squares.
        - |
          A parallelogram can lean over, with no right angles at all. Only parallelograms with four right angles are rectangles.
      answer: 1

    - slug: g5math-w31-q12
      type: multiple_choice
      topic_code: "5.G.A.2"
      source: "IM K–5 Math Grade 5, Unit 8, Section D"
      points: 1
      prompt: |
        A treasure hunt starts at the origin. The clue says: go 4 units right, then 6 units up. Where does the treasure lie?
      options:
        - "(6, 4)"
        - "(10, 0)"
        - "(4, 10)"
        - "(4, 6)"
      option_explanations:
        - |
          (6, 4) puts the numbers in the wrong order. Right comes first in an ordered pair, so 4 is the x-coordinate.
        - |
          (10, 0) moves right both times. The 6 units go up, which changes the y-coordinate.
        - |
          (4, 10) adds 4 + 6 for the second number. Only the 6 units up change the y-coordinate.
        - |
          Correct. 4 units right makes the x-coordinate 4, and 6 units up makes the y-coordinate 6: (4, 6).
      answer: 3

    - slug: g5math-w31-q13
      type: numeric
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 8, Section B"
      points: 1
      prompt: |
        The park's new sandbox is 6 feet long, 4 feet wide and 2 feet deep. How many cubic feet of sand fill it?
      answer: { value: 48, tolerance: 0 }
      explanation: |
        V = 6 × 4 × 2 = 24 × 2 = 48 cubic feet.

    - slug: g5math-w31-q14
      type: short_answer
      topic_code: "5.G.A.2"
      source: "IM K–5 Math Grade 5, Unit 8, Section D"
      points: 2
      prompt: |
        Rosa designs a rectangular flower bed on a grid. It is 5 units long, from left to right, and 3 units tall. Its bottom left corner is at (2, 1).
        (a) Give the coordinates of all four corners.
        (b) Write an expression for the perimeter of the bed, then find the perimeter.
      answer: |
        (a) (2, 1), (7, 1), (7, 4) and (2, 4).
        (b) 2 × (5 + 3) = 2 × 8 = 16 units.
      explanation: |
        Two points.

        (a) 1 pt: all four corners correct: 2 + 5 = 7 for the right side and 1 + 3 = 4 for the top.

        (b) 1 pt: a correct expression (such as 2 × (5 + 3), 5 + 3 + 5 + 3 or 2 × 5 + 2 × 3) and the perimeter 16 units.
