week: 29
unit: 8
title: "Putting Volume to Work"
topics: ["5.MD.C.5"]
guide: guides/week-29.md
guide_description: |
  Using volume to solve real problems: the formulas length × width × height and base × height, finding a
  missing edge from the volume, comparing boxes with the same volume, and finding the volume of a solid made
  of two rectangular prisms by splitting it and adding.
flashcards_description: |
  18 cards on the two volume formulas, cubic units, missing edges, boxes with the same volume, splitting a
  solid made of two prisms, the corner counted twice, and fish tanks, sandboxes and other everyday boxes.

flashcards:
  - front: Year-end · volume → what it measures
    back: |
      How much space a solid takes up: the number of unit cubes that fill it with no gaps or overlaps.
    topic_code: "5.MD.C.5"
  - front: Year-end · volume of a rectangular prism → two formulas
    back: |
      V = l × w × h (length times width times height) or V = B × h (area of the base times the height). Both give the same number.
    topic_code: "5.MD.C.5"
  - front: Year-end · 8 cm by 5 cm by 6 cm → volume
    back: |
      240 cubic centimeters. 8 × 5 = 40 cubes in each layer, and 6 layers make 40 × 6 = 240.
    topic_code: "5.MD.C.5"
  - front: Year-end · base area 35 square feet, height 4 feet → volume
    back: |
      140 cubic feet. V = B × h = 35 × 4 = 140.
    topic_code: "5.MD.C.5"
  - front: Year-end · cubic units → how to write them
    back: |
      Volume is counted in cubes: cubic centimeters (cm³), cubic inches (in³), cubic feet (ft³) or cubic meters (m³).
    topic_code: "5.MD.C.5"
  - front: Year-end · volume 360 cubic inches, base 9 in by 8 in → height
    back: |
      5 inches. The base holds 9 × 8 = 72 cubes per layer, and 360 ÷ 72 = 5 layers.
    topic_code: "5.MD.C.5"
  - front: Year-end · a missing edge → the steps
    back: |
      Multiply the two edges you know, then divide the volume by that product. The answer is the missing edge.
    topic_code: "5.MD.C.5"
  - front: Year-end · order of the edges → does it matter
    back: |
      No. 2 × 3 × 4, 4 × 2 × 3 and 3 × 4 × 2 are all 24. You may multiply the edges in any order.
    topic_code: "5.MD.C.5"
  - front: Year-end · same volume, different boxes → an example
    back: |
      A 3 by 4 by 10 box and a 6 by 5 by 4 box both hold 120 cubic units, but they have different shapes.
    topic_code: "5.MD.C.5"
  - front: Year-end · a solid made of two prisms → how to find its volume
    back: |
      Split it into two rectangular prisms that do not overlap. Find each volume, then add them.
    topic_code: "5.MD.C.5"
  - front: Year-end · a solid made of two prisms → the missing edge
    back: |
      Some edges are not labeled. Use the whole length: if the solid is 9 m long and one part is 3 m, the other part is 9 − 3 = 6 m.
    topic_code: "5.MD.C.5"
  - front: Year-end · counting a corner twice → what goes wrong
    back: |
      If the two prisms you pick overlap, the shared part is added twice and the volume comes out too big. Pick parts that only touch.
    topic_code: "5.MD.C.5"
  - front: Year-end · fish tank 50 cm by 25 cm by 40 cm → volume
    back: |
      50,000 cubic centimeters. 50 × 25 = 1,250 for the base, and 1,250 × 40 = 50,000.
    topic_code: "5.MD.C.5"
  - front: Year-end · sandbox 6 ft by 4 ft, 2 ft deep → sand needed
    back: |
      48 cubic feet. 6 × 4 × 2 = 48.
    topic_code: "5.MD.C.5"
  - front: Year-end · doubling the height of a box → the volume
    back: |
      The volume doubles too. A 2 by 3 by 4 box holds 24 cubic units; a 2 by 3 by 8 box holds 48.
    topic_code: "5.MD.C.5"
  - front: Year-end · volume or area → which one
    back: |
      Area covers a flat surface with squares (square units). Volume fills a solid with cubes (cubic units).
    topic_code: "5.MD.C.5"
  - front: Year-end · two identical boxes → an expression for their volume
    back: |
      2 × (3 × 4 × 5). Find one box's volume in the parentheses, then double it: 2 × 60 = 120 cubic units.
    topic_code: "5.MD.C.5"
  - front: Year-end · a box with volume 36 → some possible edges
    back: |
      1 by 1 by 36, 1 by 4 by 9, 2 by 2 by 9, 2 by 3 by 6 and 3 by 3 by 4 all have a volume of 36 cubic units.
    topic_code: "5.MD.C.5"

quiz:
  description: |
    14 questions · about 30 minutes · finding volume with the formulas, finding a missing edge, comparing boxes,
    and finding the volume of a solid made of two rectangular prisms, plus review of fraction areas, unit
    conversions and multiplying mixed numbers. Multiple choice, select-all, true/false and number answers are
    graded at once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g5math-w29-q01
      type: numeric
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 8, Section B"
      points: 1
      stimulus: |
        Use the rectangular prism. It is 8 cm long, 5 cm wide and 6 cm tall.
      figure: figures/w29-prism-8x5x6.svg
      figure_alt: "A rectangular prism drawn as a box. The bottom front edge is labeled 8 cm, the edge going back on the bottom right is labeled 5 cm, and the left front edge going up is labeled 6 cm."
      prompt: |
        What is the volume of the prism in cubic centimeters?
      answer: { value: 240, tolerance: 0 }
      explanation: |
        V = l × w × h = 8 × 5 × 6. 8 × 5 = 40 and 40 × 6 = 240 cubic centimeters.

    - slug: g5math-w29-q02
      type: multiple_choice
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 8, Section B"
      points: 1
      stimulus: |
        Use the rectangular prism. It is 8 cm long, 5 cm wide and 6 cm tall.
      prompt: |
        Which expression also gives the volume of the prism?
      options:
        - "(8 × 5) × 6"
        - "8 + 5 + 6"
        - "8 × 5 + 6"
        - "(8 + 5) × 6"
      option_explanations:
        - |
          Correct. 8 × 5 = 40 is the area of the base, and the base times the height 6 gives the volume, 240.
        - |
          8 + 5 + 6 = 19 adds the three edges. Volume multiplies them, because it counts cubes in layers.
        - |
          8 × 5 + 6 = 46 adds the height instead of multiplying by it. There are 6 layers of 40 cubes, not 40 cubes and 6 more.
        - |
          (8 + 5) × 6 = 78 adds the length and width. The base is a rectangle, so its area is 8 × 5, not 8 + 5.
      answer: 0

    - slug: g5math-w29-q03
      type: multiple_choice
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 8, Section B"
      points: 1
      figure: figures/w29-two-prisms.svg
      figure_alt: "A solid made of two rectangular prisms. The bottom prism is long and low: its front edge is 10 ft, it goes back 4 ft, and it is 3 ft tall. A second prism stands on the left end of it: its front edge is 4 ft, it goes back the same 4 ft, and it rises 5 ft above the bottom prism."
      prompt: |
        What is the volume of the whole solid?
      options:
        - "320 cubic feet"
        - "200 cubic feet"
        - "120 cubic feet"
        - "248 cubic feet"
      option_explanations:
        - |
          320 is 10 × 4 × 8, a full box 8 feet tall. The solid is only 3 feet tall on the right, so that box includes empty space.
        - |
          Correct. Bottom: 10 × 4 × 3 = 120. Top: 4 × 4 × 5 = 80. 120 + 80 = 200 cubic feet.
        - |
          120 is only the bottom prism, 10 × 4 × 3. Add the prism on top, 4 × 4 × 5 = 80.
        - |
          248 is 120 + 4 × 4 × 8. The left part is 8 feet tall in all, but its bottom 3 feet are already in the 120, so that corner is counted twice.
      answer: 1

    - slug: g5math-w29-q04
      type: numeric
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 8, Section B"
      points: 1
      prompt: |
        A box has a volume of 360 cubic inches. Its base is 9 inches long and 8 inches wide. How many inches tall is the box?
      answer: { value: 5, tolerance: 0 }
      explanation: |
        The base is 9 × 8 = 72 square inches, so each layer holds 72 cubes. 360 ÷ 72 = 5, so the box is 5 inches tall.

    - slug: g5math-w29-q05
      type: multiple_choice
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 8, Section B"
      points: 1
      prompt: |
        Which box has a volume of exactly 48 cubic units?
      options:
        - "4 units by 4 units by 4 units"
        - "3 units by 4 units by 5 units"
        - "2 units by 4 units by 6 units"
        - "2 units by 3 units by 7 units"
      option_explanations:
        - |
          4 × 4 × 4 = 64, which is 16 more than 48.
        - |
          3 × 4 × 5 = 60, which is 12 more than 48.
        - |
          Correct. 2 × 4 = 8 and 8 × 6 = 48 cubic units.
        - |
          2 × 3 × 7 = 42, which is 6 less than 48.
      answer: 2

    - slug: g5math-w29-q06
      type: true_false
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 8, Section B"
      points: 1
      prompt: |
        True or false: a box 3 cm by 4 cm by 10 cm has the same volume as a box 6 cm by 5 cm by 4 cm.
      answer: true
      explanation: |
        True. 3 × 4 × 10 = 120 and 6 × 5 × 4 = 120. Both hold 120 cubic centimeters, even though their shapes are different.

    - slug: g5math-w29-q07
      type: fill_blank
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 8, Section B"
      points: 1
      prompt: |
        The number of unit cubes that fill a solid with no gaps or overlaps is the solid's ____.
      answer: ["volume", "the volume", "volumes"]
      explanation: |
        Volume measures how much space a solid takes up, counted in cubic units.

    - slug: g5math-w29-q08
      type: multi_select
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 8, Section B"
      points: 2
      partial_credit: true
      prompt: |
        A prism is 5 m long, 3 m wide and 2 m tall. Which expressions give its volume? Select all that apply.
      options:
        - "5 + 3 + 2"
        - "5 × 3 × 2"
        - "15 × 2"
        - "5 × 3 + 2"
        - "10 × 3"
      option_explanations:
        - |
          No. Adding the edges gives 10, which is not a volume. Volume multiplies the three edges.
        - |
          Yes. Length × width × height = 5 × 3 × 2 = 30 cubic meters.
        - |
          Yes. 15 is the base area, 5 × 3, and the base times the height 2 gives 30.
        - |
          No. 5 × 3 + 2 = 17 adds the height instead of multiplying by it.
        - |
          Yes. 10 is 5 × 2, and 10 × 3 = 30. The edges can be multiplied in any order.
      answer: [1, 2, 4]

    - slug: g5math-w29-q09
      type: numeric
      topic_code: "5.MD.C.4"
      source: "IM K–5 Math Grade 5, Unit 1, Section A"
      points: 1
      figure: figures/w29-cubes-4x3x2.svg
      figure_alt: "A rectangular prism built from 1-centimeter cubes with no gaps. The front face shows 4 cubes across and 2 cubes up. The top shows 4 cubes across and 3 cubes going back. The right side shows 3 cubes going back and 2 cubes up. So the prism is 4 cubes long, 3 cubes wide and 2 cubes tall, and some cubes are hidden inside."
      prompt: |
        What is the volume of the prism in cubic centimeters?
      answer: { value: 24, tolerance: 0 }
      explanation: |
        Each layer is 4 × 3 = 12 cubes, and there are 2 layers. 12 × 2 = 24 cubic centimeters, including the cubes you cannot see.

    - slug: g5math-w29-q10
      type: multiple_choice
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 8, Section B"
      points: 1
      prompt: |
        A fish tank is 50 cm long, 25 cm wide and 40 cm tall. What is its volume?
      options:
        - "115 cubic centimeters"
        - "5,000 cubic centimeters"
        - "1,250 cubic centimeters"
        - "50,000 cubic centimeters"
      option_explanations:
        - |
          115 is 50 + 25 + 40. Volume multiplies the three edges instead of adding them.
        - |
          5,000 has lost a zero. 50 × 25 = 1,250, and 1,250 × 40 = 50,000.
        - |
          1,250 is 50 × 25, only the area of the base. Multiply by the height, 40, to fill the tank.
        - |
          Correct. 50 × 25 = 1,250 for the base, and 1,250 × 40 = 50,000 cubic centimeters.
      answer: 3

    - slug: g5math-w29-q11
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section C"
      points: 1
      prompt: |
        A rectangular garden bed is 3/4 meter long and 2/3 meter wide. What is its area?
      options:
        - "5/7 square meter"
        - "17/12 square meters"
        - "6/7 square meter"
        - "1/2 square meter"
      option_explanations:
        - |
          5/7 adds the numerators and the denominators. To find area, multiply: 3/4 × 2/3.
        - |
          17/12 is 3/4 + 2/3, the sum of the sides. Area multiplies length by width.
        - |
          6/7 multiplies the numerators but adds the denominators. Multiply both: 3 × 2 = 6 and 4 × 3 = 12.
        - |
          Correct. 3/4 × 2/3 = 6/12, and 6/12 = 1/2 square meter.
      answer: 3

    - slug: g5math-w29-q12
      type: multiple_choice
      topic_code: "5.MD.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section A"
      points: 1
      prompt: |
        A shelf is 3.5 meters long. How many centimeters long is it?
      options:
        - "35 centimeters"
        - "350 centimeters"
        - "3,500 centimeters"
        - "0.035 centimeters"
      option_explanations:
        - |
          35 is 3.5 × 10. There are 100 centimeters in a meter, so multiply by 100.
        - |
          Correct. 1 meter = 100 centimeters, so 3.5 × 100 = 350 centimeters.
        - |
          3,500 is 3.5 × 1,000. That would change meters to millimeters, not centimeters.
        - |
          0.035 divides by 100. Centimeters are smaller than meters, so there are more of them: multiply.
      answer: 1

    - slug: g5math-w29-q13
      type: numeric
      topic_code: "5.NF.B.6"
      source: "IM K–5 Math Grade 5, Unit 2, Section C"
      points: 1
      prompt: |
        One batch of play dough uses 2 1/2 cups of flour. How many cups of flour do 4 batches use?
      answer: { value: 10, tolerance: 0 }
      explanation: |
        4 × 2 1/2 = 4 × 2 + 4 × 1/2 = 8 + 2 = 10 cups.

    - slug: g5math-w29-q14
      type: short_answer
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 8, Section B"
      points: 2
      prompt: |
        A class is designing toy boxes. Each box must have a volume of exactly 36 cubic units, and every edge must be a whole number of units.
        (a) Give the length, width and height of two different boxes that work.
        (b) Show how you know each box has a volume of 36 cubic units.
      answer: |
        (a) A box 2 by 3 by 6 and a box 3 by 3 by 4.
        (b) 2 × 3 × 6 = 6 × 6 = 36, and 3 × 3 × 4 = 9 × 4 = 36.
      explanation: |
        Two points.

        (a) 1 pt: two different sets of three whole-number edges whose product is 36 (for example 1 by 1 by 36, 1 by 2 by 18, 1 by 3 by 12, 1 by 4 by 9, 1 by 6 by 6, 2 by 2 by 9, 2 by 3 by 6 or 3 by 3 by 4). The same three numbers in a different order do not count as a different box.

        (b) 1 pt: a multiplication for each box that gives 36.
