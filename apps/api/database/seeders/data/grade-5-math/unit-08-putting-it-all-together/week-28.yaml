week: 28
unit: 8
title: "Multiplying and Dividing Whole Numbers, One More Time"
topics: ["5.NBT.B.5", "5.NBT.B.6"]
guide: guides/week-28.md
guide_description: |
  A look back at whole-number multiplication and division: the standard algorithm for multiplying multi-digit
  numbers, partial quotients and area models for dividing up to four digits by two digits, estimating before
  you calculate, checking by multiplying back, and deciding what a remainder means in a story.
flashcards_description: |
  18 cards on the standard algorithm for multiplication, the zero in the tens row, estimating products and
  quotients, partial quotients with a two-digit divisor, division as an area model, remainders in stories and
  checking a division by multiplying.

flashcards:
  - front: Year-end · 437 × 26 → standard algorithm
    back: |
      11,362. First row: 437 × 6 = 2,622. Second row: 437 × 20 = 8,740. Add the rows: 2,622 + 8,740 = 11,362.
    topic_code: "5.NBT.B.5"
  - front: Year-end · the second row of 342 × 57 → why it ends in 0
    back: |
      The 5 in 57 means 5 tens, so the second row is 342 × 50 = 17,100, not 342 × 5. Write the 0 in the ones place first.
    topic_code: "5.NBT.B.5"
  - front: Year-end · regrouping in the standard algorithm → where the extra goes
    back: |
      Write the ones digit of each small product and carry the tens to the next place. In 437 × 6, 7 × 6 = 42: write 2, carry 4.
    topic_code: "5.NBT.B.5"
  - front: Year-end · estimate 389 × 52
    back: |
      About 20,000. Round to 400 × 50 = 20,000. The exact product is 20,228, which is close.
    topic_code: "5.NBT.B.5"
  - front: Year-end · 125 × 8 → a handy fact
    back: |
      1,000. Eight groups of 125 make 1,000, so 125 × 16 = 2,000 and 125 × 48 = 6,000.
    topic_code: "5.NBT.B.5"
  - front: Year-end · 300 × 40 → think in place value
    back: |
      12,000. 3 × 4 = 12, then 3 hundreds × 4 tens = 12 thousands.
    topic_code: "5.NBT.B.5"
  - front: Year-end · 608 × 35 → the product
    back: |
      21,280. 608 × 5 = 3,040 and 608 × 30 = 18,240. Then 3,040 + 18,240 = 21,280.
    topic_code: "5.NBT.B.5"
  - front: Year-end · a standard algorithm answer → how to check it
    back: |
      Estimate first and compare. 264 × 38 is about 250 × 40 = 10,000, so 10,032 makes sense and 3,000 does not.
    topic_code: "5.NBT.B.5"
  - front: Year-end · 2,592 ÷ 24 → partial quotients
    back: |
      108. 24 × 100 = 2,400, leaving 192. 24 × 8 = 192, leaving 0. 100 + 8 = 108.
    topic_code: "5.NBT.B.6"
  - front: Year-end · 1,536 ÷ 32 → the quotient
    back: |
      48. 32 × 40 = 1,280, leaving 256. 32 × 8 = 256, leaving 0. 40 + 8 = 48.
    topic_code: "5.NBT.B.6"
  - front: Year-end · dividing by 24 → easy multiples to list
    back: |
      24 × 10 = 240, 24 × 20 = 480, 24 × 50 = 1,200 and 24 × 100 = 2,400. Take out the biggest one that fits.
    topic_code: "5.NBT.B.6"
  - front: Year-end · division as an area model
    back: |
      The area is the number you divide, and one side is the divisor. Split the area into parts you can divide; the side lengths of the parts add to the quotient.
    topic_code: "5.NBT.B.6"
  - front: Year-end · estimate 2,925 ÷ 45
    back: |
      About 60. 45 is close to 50, and 3,000 ÷ 50 = 60. The exact quotient is 65.
    topic_code: "5.NBT.B.6"
  - front: Year-end · checking 1,536 ÷ 32 = 48
    back: |
      Multiply back: 32 × 48 = 1,536. If there is a remainder, add it after you multiply.
    topic_code: "5.NBT.B.6"
  - front: Year-end · 230 students, buses of 48 → how many buses
    back: |
      5 buses. 230 ÷ 48 = 4 R 38. Four buses leave 38 students behind, so one more bus is needed.
    topic_code: "5.NBT.B.6"
  - front: Year-end · 1,000 juice boxes, cases of 24 → full cases
    back: |
      41 full cases. 1,000 ÷ 24 = 41 R 16. The 16 extra boxes do not fill a case, so drop the remainder.
    topic_code: "5.NBT.B.6"
  - front: Year-end · a remainder bigger than the divisor means
    back: |
      Not finished. If 1,536 ÷ 32 gives 46 R 64, then 64 still holds two more groups of 32. The answer is 48.
    topic_code: "5.NBT.B.6"
  - front: Year-end · a zero in the quotient → 3,120 ÷ 15
    back: |
      208. 15 × 200 = 3,000, leaving 120, and 15 × 8 = 120. There are no tens, so write 208, not 28.
    topic_code: "5.NBT.B.6"

quiz:
  description: |
    14 questions · about 30 minutes · multiplying multi-digit whole numbers with the standard algorithm,
    dividing up to four digits by two digits with partial quotients and area models, estimating, and
    remainders in stories, plus review of expressions with brackets and powers of 10. Multiple choice,
    select-all, true/false and number answers are graded at once; the fill-in word is matched automatically;
    the short answer is checked by your teacher.
  questions:
    - slug: g5math-w28-q01
      type: multiple_choice
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 8, Section A"
      points: 1
      stimulus: |
        Ana used the standard algorithm to find 342 × 57. Her work is shown.
      figure: figures/w28-algorithm-342x57.svg
      figure_alt: "Ana's work for 342 × 57, written in columns. 342 is on top and 57 is below it with a times sign. Under the line, the first row is 2,394, labeled 342 × 7. The second row is 1,710 with a plus sign, labeled 342 × 50; its last digit 0 sits in the ones place. Under a second line the total is 4,104."
      prompt: |
        Ana's answer is wrong. What is her mistake?
      options:
        - "342 × 50 is 17,100, but she wrote 1,710."
        - "342 × 7 is 2,384, but she wrote 2,394."
        - "She should subtract the two rows instead of adding them."
        - "She added the rows wrong, because 2,394 + 1,710 is 4,204."
      option_explanations:
        - |
          Correct. The 5 in 57 stands for 5 tens, so the second row is 342 × 50 = 17,100. Ana wrote 342 × 5 = 1,710 and left out a place.
        - |
          Her first row is right: 342 × 7 = 2,100 + 280 + 14 = 2,394. The mistake is in the second row.
        - |
          The standard algorithm adds the rows, because 342 × 57 = 342 × 7 + 342 × 50. The trouble is the size of the second row.
        - |
          Her adding is right: 2,394 + 1,710 = 4,104. The mistake comes earlier, in the second row.
      answer: 0

    - slug: g5math-w28-q02
      type: numeric
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 8, Section A"
      points: 1
      stimulus: |
        Ana used the standard algorithm to find 342 × 57. Her work is shown.
      prompt: |
        Fix Ana's work. What is 342 × 57? (Type the digits without a comma.)
      answer: { value: 19494, tolerance: 0 }
      explanation: |
        The rows should be 342 × 7 = 2,394 and 342 × 50 = 17,100. 2,394 + 17,100 = 19,494. (Estimate: 300 × 60 = 18,000, so 19,494 is reasonable.)

    - slug: g5math-w28-q03
      type: multiple_choice
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 8, Section A"
      points: 1
      prompt: |
        What is 608 × 35?
      options:
        - "4,864"
        - "18,240"
        - "21,280"
        - "20,280"
      option_explanations:
        - |
          4,864 is 3,040 + 1,824. The 1,824 is 608 × 3, but the 3 in 35 means 3 tens, so that row should be 18,240.
        - |
          18,240 is only 608 × 30. The ones row, 608 × 5 = 3,040, must be added too.
        - |
          Correct. 608 × 5 = 3,040 and 608 × 30 = 18,240. Then 3,040 + 18,240 = 21,280.
        - |
          20,280 is one thousand short. When you add 3,040 + 18,240, the hundreds 0 + 2 is 2 and the thousands 3 + 8 = 11 thousands, which gives 21,280.
      answer: 2

    - slug: g5math-w28-q04
      type: numeric
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 8, Section A"
      points: 1
      prompt: |
        An art room orders 48 boxes of crayons. Each box holds 125 crayons. How many crayons does the art room order? (Type the digits without a comma.)
      answer: { value: 6000, tolerance: 0 }
      explanation: |
        48 × 125: 125 × 8 = 1,000 and 125 × 40 = 5,000. 1,000 + 5,000 = 6,000 crayons.

    - slug: g5math-w28-q05
      type: multiple_choice
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 8, Section A"
      points: 1
      prompt: |
        What is 1,536 ÷ 32?
      options:
        - "480"
        - "48"
        - "46 R 64"
        - "1,504"
      option_explanations:
        - |
          32 × 480 = 15,360, which is ten times too big. The first chunk is 32 × 40 = 1,280, not 32 × 400.
        - |
          Correct. 32 × 40 = 1,280, leaving 256. 32 × 8 = 256, leaving 0. 40 + 8 = 48.
        - |
          A remainder of 64 is bigger than 32, so two more groups of 32 still fit. 46 + 2 = 48 with nothing left over.
        - |
          1,504 is 1,536 − 32, a subtraction. Division asks how many groups of 32 are in 1,536.
      answer: 1

    - slug: g5math-w28-q06
      type: numeric
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 8, Section A"
      points: 1
      prompt: |
        A school hall has 2,925 seats in rows of 45 seats each. How many rows are there?
      answer: { value: 65, tolerance: 0 }
      explanation: |
        2,925 ÷ 45: 45 × 60 = 2,700, leaving 225. 45 × 5 = 225, leaving 0. 60 + 5 = 65 rows. Check: 45 × 65 = 2,925.

    - slug: g5math-w28-q07
      type: multiple_choice
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 8, Section A"
      points: 1
      figure: figures/w28-division-area.svg
      figure_alt: "A rectangle titled 3,312 ÷ 24 as an area model, not to scale. Its left side is labeled 24. It is split into 3 parts with areas 2,400, 720 and 192. Above each part is a question mark for its unknown width. Below it says Total area: 3,312."
      prompt: |
        The area model shows 3,312 ÷ 24. What is 3,312 ÷ 24?
      options:
        - "1,308"
        - "130"
        - "79,488"
        - "138"
      option_explanations:
        - |
          1,308 writes the widths 100, 30 and 8 side by side. Add them instead: 100 + 30 + 8 = 138.
        - |
          130 leaves out the last part. 24 × 8 = 192 is part of the area too, so add 8 more: 138.
        - |
          79,488 is 3,312 × 24. The model splits a total area of 3,312 by a side of 24, which is division.
        - |
          Correct. 24 × 100 = 2,400, 24 × 30 = 720 and 24 × 8 = 192. The widths add to 100 + 30 + 8 = 138.
      answer: 3

    - slug: g5math-w28-q08
      type: true_false
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 8, Section A"
      points: 1
      prompt: |
        True or false: 389 × 52 is close to 20,000.
      answer: true
      explanation: |
        True. 389 rounds to 400 and 52 rounds to 50, and 400 × 50 = 20,000. The exact product is 20,228.

    - slug: g5math-w28-q09
      type: fill_blank
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 8, Section A"
      points: 1
      prompt: |
        In 1,536 ÷ 32 = 48, the answer 48 is called the ____.
      answer: ["quotient", "the quotient", "quotients"]
      explanation: |
        The quotient is the answer to a division. 1,536 ÷ 32 = 48 means 48 groups of 32 make 1,536.

    - slug: g5math-w28-q10
      type: multi_select
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 8, Section A"
      points: 2
      partial_credit: true
      prompt: |
        Which of these divisions have a quotient of exactly 32? Select all that apply.
      options:
        - "1,280 ÷ 40"
        - "992 ÷ 32"
        - "896 ÷ 28"
        - "1,600 ÷ 5"
        - "2,048 ÷ 64"
      option_explanations:
        - |
          Yes. 40 × 32 = 1,280, so 1,280 ÷ 40 = 32.
        - |
          No. 32 × 31 = 992, so 992 ÷ 32 = 31, one less than 32.
        - |
          Yes. 28 × 30 = 840 and 28 × 2 = 56, and 840 + 56 = 896. So 896 ÷ 28 = 32.
        - |
          No. 5 × 320 = 1,600, so 1,600 ÷ 5 = 320, ten times as much as 32.
        - |
          Yes. 64 × 30 = 1,920 and 64 × 2 = 128, and 1,920 + 128 = 2,048. So 2,048 ÷ 64 = 32.
      answer: [0, 2, 4]

    - slug: g5math-w28-q11
      type: multiple_choice
      topic_code: "5.OA.A.1"
      source: "IM K–5 Math Grade 5, Unit 4, Section C"
      points: 1
      prompt: |
        What is the value of 3 × [40 − (12 + 8)]?
      options:
        - "116"
        - "100"
        - "60"
        - "92"
      option_explanations:
        - |
          116 is 3 × 40 − 12 + 8, working left to right and ignoring the brackets. Work inside the parentheses first, then the brackets.
        - |
          100 is 3 × 40 − 20. The 3 multiplies everything in the brackets, so find 40 − 20 = 20 first.
        - |
          Correct. Parentheses first: 12 + 8 = 20. Then brackets: 40 − 20 = 20. Last: 3 × 20 = 60.
        - |
          92 is 3 × (40 − 12) + 8. The 8 belongs inside the parentheses with the 12, so add them before you subtract.
      answer: 2

    - slug: g5math-w28-q12
      type: multiple_choice
      topic_code: "5.NBT.A.2"
      source: "IM K–5 Math Grade 5, Unit 5, Section C"
      points: 1
      prompt: |
        What is 47 × 10³?
      options:
        - "47,000"
        - "4,700"
        - "470,000"
        - "141"
      option_explanations:
        - |
          Correct. 10³ = 10 × 10 × 10 = 1,000, and 47 × 1,000 = 47,000.
        - |
          4,700 is 47 × 100, which is 47 × 10². The exponent 3 means three tens multiplied, which is 1,000.
        - |
          470,000 is 47 × 10,000, one power of 10 too many. 10³ is 1,000.
        - |
          141 is 47 × 3. The 3 in 10³ is an exponent: it says how many 10s to multiply, not a number to multiply by.
      answer: 0

    - slug: g5math-w28-q13
      type: multiple_choice
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 8, Section A"
      points: 1
      prompt: |
        230 students go on a field trip. Each bus holds 48 students. How many buses do they need?
      options:
        - "4 buses"
        - "5 buses"
        - "4 R 38 buses"
        - "38 buses"
      option_explanations:
        - |
          Four buses hold 4 × 48 = 192 students, so 38 students would be left behind. They need one more bus.
        - |
          Correct. 230 ÷ 48 = 4 R 38. Four full buses leave 38 students, so a fifth bus is needed.
        - |
          You cannot order part of a bus. The 38 students left over still need a seat, so round up to 5 buses.
        - |
          38 is the remainder, the number of students left after 4 full buses. The question asks for the number of buses.
      answer: 1

    - slug: g5math-w28-q14
      type: short_answer
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 8, Section A"
      points: 2
      prompt: |
        (a) Find 264 × 38 with the standard algorithm. Show both rows.
        (b) Make an estimate and explain how it shows your answer is reasonable.
      answer: |
        (a) First row: 264 × 8 = 2,112. Second row: 264 × 30 = 7,920. Total: 2,112 + 7,920 = 10,032.
        (b) 264 is about 250 and 38 is about 40, and 250 × 40 = 10,000. 10,032 is close to 10,000, so it is reasonable.
      explanation: |
        Two points.

        (a) 1 pt: 10,032, with the rows 2,112 and 7,920 (or equivalent partial products) shown.

        (b) 1 pt: a sensible estimate (such as 250 × 40 = 10,000 or 300 × 40 = 12,000) and a sentence comparing it with the answer.
