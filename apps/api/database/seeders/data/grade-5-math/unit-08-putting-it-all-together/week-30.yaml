week: 30
unit: 8
title: "Fractions and Decimals Side by Side"
topics: ["5.NF.A.1", "5.NBT.B.7"]
guide: guides/week-30.md
guide_description: |
  A look back at fraction and decimal operations: adding and subtracting fractions and mixed numbers with
  unlike denominators, then adding, subtracting, multiplying and dividing decimals to hundredths, with
  estimates to check and a few problems that mix fractions and decimals.
flashcards_description: |
  18 cards on common denominators, adding and subtracting with unlike denominators, trading a whole in mixed
  numbers, lining up decimal places, multiplying and dividing decimals, decimal grids, and switching between
  fractions and decimals.

flashcards:
  - front: Year-end · 2/3 + 1/4 → common denominator
    back: |
      11/12. Twelfths work for both: 2/3 = 8/12 and 1/4 = 3/12. Then 8/12 + 3/12 = 11/12.
    topic_code: "5.NF.A.1"
  - front: Year-end · a common denominator → how to find one
    back: |
      Find a number both denominators divide into. Multiplying the two denominators always works: for fifths and thirds, 5 × 3 = 15.
    topic_code: "5.NF.A.1"
  - front: Year-end · 5/6 − 1/4 → the difference
    back: |
      7/12. 5/6 = 10/12 and 1/4 = 3/12, so 10/12 − 3/12 = 7/12.
    topic_code: "5.NF.A.1"
  - front: Year-end · 1/2 + 1/3 = 2/5 → what went wrong
    back: |
      The tops and bottoms were added. Halves and thirds are different-size pieces, so rename them as sixths: 3/6 + 2/6 = 5/6.
    topic_code: "5.NF.A.1"
  - front: Year-end · 2 3/5 + 1 1/2 → the sum
    back: |
      4 1/10. Rename as tenths: 2 6/10 + 1 5/10 = 3 11/10. Since 11/10 = 1 1/10, the sum is 4 1/10.
    topic_code: "5.NF.A.1"
  - front: Year-end · 3 1/2 − 1 2/3 → trade a whole
    back: |
      1 5/6. Sixths: 3 3/6 − 1 4/6. 3/6 is too small, so trade a whole: 2 9/6 − 1 4/6 = 1 5/6.
    topic_code: "5.NF.A.1"
  - front: Year-end · estimate 1/3 + 3/7
    back: |
      Less than 1. Each fraction is less than 1/2, so the sum is less than 1/2 + 1/2 = 1. (It is 16/21.)
    topic_code: "5.NF.A.1"
  - front: Year-end · 4.75 + 2.6 → line up the places
    back: |
      7.35. Write 2.6 as 2.60 so tenths sit under tenths and hundredths under hundredths. 4.75 + 2.60 = 7.35.
    topic_code: "5.NBT.B.7"
  - front: Year-end · 6 − 2.45 → the difference
    back: |
      3.55. Write 6 as 6.00, then regroup: 5 ones, 9 tenths and 10 hundredths. 6.00 − 2.45 = 3.55.
    topic_code: "5.NBT.B.7"
  - front: Year-end · 0.6 × 0.4 → on a hundredths grid
    back: |
      0.24. Shade 6 tenths one way and 4 tenths the other way. The overlap is 24 of the 100 small squares.
    topic_code: "5.NBT.B.7"
  - front: Year-end · 0.3 × 0.2 → why not 0.6
    back: |
      Tenths times tenths make hundredths. 3 × 2 = 6, so 0.3 × 0.2 = 0.06. The product is less than both factors.
    topic_code: "5.NBT.B.7"
  - front: Year-end · 3.4 × 2.5 → the product
    back: |
      8.5. 34 × 25 = 850, and tenths times tenths make hundredths: 8.50. Check: 3 × 2.5 = 7.5, so a bit more than 7.5 makes sense.
    topic_code: "5.NBT.B.7"
  - front: Year-end · 1.25 × 6 → the product
    back: |
      7.5. 1 × 6 = 6 and 0.25 × 6 = 1.5. Then 6 + 1.5 = 7.5.
    topic_code: "5.NBT.B.7"
  - front: Year-end · 4.5 ÷ 9 → the quotient
    back: |
      0.5. 4.5 is 45 tenths, and 45 tenths ÷ 9 = 5 tenths.
    topic_code: "5.NBT.B.7"
  - front: Year-end · 9.6 ÷ 0.4 → think in tenths
    back: |
      24. 9.6 is 96 tenths and 0.4 is 4 tenths. 96 tenths ÷ 4 tenths = 96 ÷ 4 = 24.
    topic_code: "5.NBT.B.7"
  - front: Year-end · 3/4 as a decimal
    back: |
      0.75. 3/4 = 75/100, which is 75 hundredths.
    topic_code: "5.NF.A.1"
  - front: Year-end · 2.75 as a mixed number
    back: |
      2 3/4. 0.75 is 75 hundredths, which equals 3/4.
    topic_code: "5.NBT.B.7"
  - front: Year-end · checking a decimal answer → one quick way
    back: |
      Round and estimate. 12.6 − 4.85 is about 13 − 5 = 8, so 7.75 is reasonable and 77.5 is not.
    topic_code: "5.NBT.B.7"

quiz:
  description: |
    14 questions · about 30 minutes · adding and subtracting fractions and mixed numbers with unlike
    denominators, and adding, subtracting, multiplying and dividing decimals, plus review of dividing a unit
    fraction and rounding decimals. Multiple choice, select-all, true/false and number answers are graded at
    once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g5math-w30-q01
      type: multiple_choice
      topic_code: "5.NF.A.1"
      source: "IM K–5 Math Grade 5, Unit 8, Section C"
      points: 1
      stimulus: |
        Use the number line from 0 to 1. It is split into twelfths. 2/3 is the same as 8/12, and 1/4 is the same as 3/12.
      figure: figures/w30-number-line-twelfths.svg
      figure_alt: "A number line from 0 to 1 split into 12 equal parts by tick marks. Only 0 and 1 are labeled. A blue jump labeled 2/3 goes from 0 to the 8th tick mark. A green jump labeled 1/4 goes from the 8th tick mark to the 11th tick mark, where a red dot is marked with a question mark."
      prompt: |
        The jumps show 2/3 + 1/4. What number is at the question mark?
      options:
        - "3/7"
        - "8/12"
        - "11/12"
        - "3/12"
      option_explanations:
        - |
          3/7 adds the numerators and the denominators. The pieces must be the same size first: 8/12 + 3/12.
        - |
          8/12 is where the first jump lands. The second jump goes 3 more twelfths.
        - |
          Correct. 2/3 = 8/12 and 1/4 = 3/12. 8 twelfths and 3 more make 11 twelfths: 11/12.
        - |
          3/12 is only the second jump, 1/4. The question mark is where both jumps end, counted from 0.
      answer: 2

    - slug: g5math-w30-q02
      type: multiple_choice
      topic_code: "5.NF.A.1"
      source: "IM K–5 Math Grade 5, Unit 8, Section C"
      points: 1
      stimulus: |
        Use the number line from 0 to 1. It is split into twelfths. 2/3 is the same as 8/12, and 1/4 is the same as 3/12.
      prompt: |
        How much greater is 2/3 than 1/4?
      options:
        - "5/12"
        - "1/12"
        - "11/12"
        - "3/12"
      option_explanations:
        - |
          Correct. Subtract like pieces: 8/12 − 3/12 = 5/12.
        - |
          1/12 subtracts the numerators 2 − 1 without renaming. Thirds and fourths must both become twelfths first: 8/12 − 3/12.
        - |
          11/12 is the sum, 2/3 + 1/4. "How much greater" asks for a difference, so subtract.
        - |
          3/12 is just 1/4 written in twelfths. The question asks for the gap between 8/12 and 3/12.
      answer: 0

    - slug: g5math-w30-q03
      type: multiple_choice
      topic_code: "5.NF.A.1"
      source: "IM K–5 Math Grade 5, Unit 8, Section C"
      points: 1
      prompt: |
        What is 3 1/2 − 1 2/3?
      options:
        - "2 1/6"
        - "2 5/6"
        - "5 1/6"
        - "1 5/6"
      option_explanations:
        - |
          2 1/6 subtracts the fractions the wrong way, 2/3 − 1/2. In sixths, 3 3/6 − 1 4/6 needs a whole traded first.
        - |
          2 5/6 trades a whole for 6/6 but forgets to take it away from the 3. After the trade there are only 2 wholes: 2 9/6 − 1 4/6.
        - |
          5 1/6 is 3 1/2 + 1 2/3, the sum. The minus sign means take 1 2/3 away.
        - |
          Correct. 3 1/2 = 3 3/6 and 1 2/3 = 1 4/6. Trade a whole: 2 9/6 − 1 4/6 = 1 5/6.
      answer: 3

    - slug: g5math-w30-q04
      type: numeric
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 8, Section C"
      points: 1
      prompt: |
        Mia bikes 4.75 kilometers on Saturday and 2.6 kilometers on Sunday. How many kilometers does she bike in all? Type a decimal.
      answer: { value: 7.35, tolerance: 0.001 }
      explanation: |
        Line up the places: 4.75 + 2.60 = 7.35 kilometers. (Estimate: 5 + 3 = 8, and 7.35 is close.)

    - slug: g5math-w30-q05
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 8, Section C"
      points: 1
      prompt: |
        What is 6 − 2.45?
      options:
        - "4.45"
        - "3.55"
        - "3.65"
        - "8.45"
      option_explanations:
        - |
          4.45 subtracts only the ones, 6 − 2, and copies the .45. The 0.45 must be taken away too.
        - |
          Correct. Write 6 as 6.00 and regroup to 5 ones, 9 tenths and 10 hundredths. 6.00 − 2.45 = 3.55.
        - |
          3.65 forgets that one tenth was traded to the hundredths. The tenths digit is 9 after regrouping, and 9 − 4 = 5.
        - |
          8.45 adds the numbers. The minus sign means take 2.45 away from 6.
      answer: 1

    - slug: g5math-w30-q06
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 8, Section C"
      points: 1
      figure: figures/w30-grid-0-6-by-0-4.svg
      figure_alt: "A 10 by 10 grid titled 0.6 × 0.4 on a hundredths grid. The whole grid is 1 by 1. A rectangle in the top left corner is shaded blue: it is 6 small squares across, marked 0.6, and 4 small squares down, marked 0.4. The shaded rectangle holds 24 of the 100 small squares."
      prompt: |
        The grid shows 0.6 × 0.4. What is the product?
      options:
        - "0.24"
        - "2.4"
        - "0.024"
        - "1.0"
      option_explanations:
        - |
          Correct. The shaded part is 24 of the 100 small squares, which is 24 hundredths: 0.24.
        - |
          2.4 is more than the whole grid, which is 1. The shaded part is a small piece of the grid, so the product is less than 1.
        - |
          0.024 is 24 thousandths. Each small square is one hundredth, so 24 squares are 0.24.
        - |
          1.0 adds 0.6 + 0.4. The grid shows multiplying: the area of the shaded rectangle, 24 small squares.
      answer: 0

    - slug: g5math-w30-q07
      type: numeric
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 8, Section C"
      points: 1
      prompt: |
        Each bag of rice weighs 1.25 kilograms. How many kilograms do 6 bags weigh? Type a decimal.
      answer: { value: 7.5, tolerance: 0.001 }
      explanation: |
        6 × 1.25 = 6 × 1 + 6 × 0.25 = 6 + 1.5 = 7.5 kilograms.

    - slug: g5math-w30-q08
      type: numeric
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 8, Section C"
      points: 1
      prompt: |
        A ribbon 4.5 meters long is cut into 9 equal pieces. How many meters long is each piece? Type a decimal.
      answer: { value: 0.5, tolerance: 0.001 }
      explanation: |
        4.5 ÷ 9: 4.5 is 45 tenths, and 45 tenths ÷ 9 = 5 tenths. Each piece is 0.5 meter. Check: 9 × 0.5 = 4.5.

    - slug: g5math-w30-q09
      type: true_false
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 8, Section C"
      points: 1
      prompt: |
        True or false: 0.3 × 0.2 = 0.6.
      answer: false
      explanation: |
        False. Tenths times tenths make hundredths. 3 × 2 = 6, so 0.3 × 0.2 = 0.06. The product of two numbers less than 1 is smaller than each of them.

    - slug: g5math-w30-q10
      type: fill_blank
      topic_code: "5.NF.A.1"
      source: "IM K–5 Math Grade 5, Unit 8, Section C"
      points: 1
      prompt: |
        To add 2/5 and 1/3, first rename them as fifteenths so they have a common ____.
      answer: ["denominator", "the denominator", "denominators"]
      explanation: |
        A common denominator makes the pieces the same size: 2/5 = 6/15 and 1/3 = 5/15, so the sum is 11/15.

    - slug: g5math-w30-q11
      type: multi_select
      topic_code: "5.NF.A.1"
      source: "IM K–5 Math Grade 5, Unit 8, Section C"
      points: 2
      partial_credit: true
      prompt: |
        Which sums are equal to exactly 1? Select all that apply.
      options:
        - "1/3 + 2/4"
        - "1/2 + 2/4"
        - "2/3 + 2/6"
        - "1/2 + 1/3"
        - "3/5 + 4/10"
      option_explanations:
        - |
          No. In twelfths, 1/3 + 2/4 = 4/12 + 6/12 = 10/12, which is 2/12 short of 1.
        - |
          Yes. 2/4 is the same as 1/2, and 1/2 + 1/2 = 2/2 = 1.
        - |
          Yes. 2/3 = 4/6, and 4/6 + 2/6 = 6/6 = 1.
        - |
          No. In sixths, 1/2 + 1/3 = 3/6 + 2/6 = 5/6, which is less than 1.
        - |
          Yes. 3/5 = 6/10, and 6/10 + 4/10 = 10/10 = 1.
      answer: [1, 2, 4]

    - slug: g5math-w30-q12
      type: multiple_choice
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        Two friends share 1/4 of a pan of cornbread equally. What fraction of the whole pan does each friend get?
      options:
        - "1/2"
        - "1/6"
        - "1/8"
        - "8"
      option_explanations:
        - |
          1/2 is each friend's share of the piece, not of the whole pan. Half of 1/4 of the pan is 1/8 of the pan.
        - |
          1/6 adds 2 to the denominator. Splitting each fourth into 2 equal parts makes eighths: 1/4 ÷ 2 = 1/8.
        - |
          Correct. 1/4 ÷ 2 = 1/8. If every fourth of the pan were cut in half, there would be 8 equal pieces.
        - |
          8 is 2 ÷ 1/4, which asks how many fourths fit in 2. Here a small piece is being shared, so each share is less than 1/4.
      answer: 2

    - slug: g5math-w30-q13
      type: multiple_choice
      topic_code: "5.NBT.A.4"
      source: "IM K–5 Math Grade 5, Unit 5, Section A"
      points: 1
      prompt: |
        What is 7.468 rounded to the nearest tenth?
      options:
        - "7.4"
        - "7.47"
        - "8"
        - "7.5"
      option_explanations:
        - |
          7.4 rounds down, but the hundredths digit is 6, which is 5 or more. Round the tenths up to 7.5.
        - |
          7.47 is rounded to the nearest hundredth. The nearest tenth has only one digit after the decimal point.
        - |
          8 is rounded to the nearest whole number. The nearest tenth keeps one decimal place.
        - |
          Correct. 7.468 is between 7.4 and 7.5. The hundredths digit is 6, so it is closer to 7.5.
      answer: 3

    - slug: g5math-w30-q14
      type: short_answer
      topic_code: "5.NF.A.1"
      source: "IM K–5 Math Grade 5, Unit 8, Section C"
      points: 2
      prompt: |
        Leo walks 1 3/4 miles to the park and then 2/3 mile to the library.

        (a) How far does Leo walk in all? Show your work.
        (b) His sister walks 2.75 miles. Who walks farther, and by how much?
      answer: |
        (a) In twelfths: 1 3/4 = 1 9/12 and 2/3 = 8/12. 1 9/12 + 8/12 = 1 17/12 = 2 5/12 miles.
        (b) 2.75 = 2 3/4 = 2 9/12. His sister walks farther, by 2 9/12 − 2 5/12 = 4/12 = 1/3 mile.
      explanation: |
        Two points.

        (a) 1 pt: 2 5/12 miles (or 29/12 or 1 17/12), with a common denominator shown.

        (b) 1 pt: the sister walks farther, by 1/3 mile (or 4/12 mile), with 2.75 changed to a fraction or 2 5/12 compared with it. If (a) is wrong, award this point for a correct comparison with the student's own answer.
