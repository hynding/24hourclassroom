unit: 8
description: |
  22 questions · about 45 minutes · every standard of Unit 8: multiplying multi-digit whole numbers
  (5.NBT.B.5), dividing up to four digits by two digits (5.NBT.B.6), volume of rectangular prisms and solids
  made of two prisms (5.MD.C.5), adding and subtracting fractions with unlike denominators (5.NF.A.1),
  decimal operations (5.NBT.B.7), writing and reading expressions (5.OA.A.2) and solving problems on the
  coordinate grid (5.G.A.2). Two pairs of questions share a picture: a solid made of two prisms and a garden
  map. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word is
  matched automatically; the short answer is checked by your teacher against the scoring notes.
questions:
  # ---- Multiplying whole numbers (5.NBT.B.5)
  - slug: g5math-u08-check-q01
    type: multiple_choice
    topic_code: "5.NBT.B.5"
    source: "IM K–5 Math Grade 5, Unit 8, Section A"
    points: 1
    prompt: |
      What is 716 × 43?
    options:
      - "5,012"
      - "30,788"
      - "28,640"
      - "30,688"
    option_explanations:
      - |
        5,012 is 2,148 + 2,864. The 2,864 is 716 × 4, but the 4 in 43 means 4 tens, so that row should be 28,640.
      - |
        Correct. 716 × 3 = 2,148 and 716 × 40 = 28,640. Then 2,148 + 28,640 = 30,788.
      - |
        28,640 is only 716 × 40. The ones row, 716 × 3 = 2,148, must be added too.
      - |
        30,688 is one hundred short. In 2,148 + 28,640, the hundreds are 1 + 6 = 7, so the sum is 30,788.
    answer: 1

  - slug: g5math-u08-check-q02
    type: numeric
    topic_code: "5.NBT.B.5"
    source: "IM K–5 Math Grade 5, Unit 8, Section A"
    points: 1
    prompt: |
      A bakery bakes 1,205 rolls every day. How many rolls does it bake in 18 days? (Type the digits without a comma.)
    answer: { value: 21690, tolerance: 0 }
    explanation: |
      1,205 × 18: 1,205 × 8 = 9,640 and 1,205 × 10 = 12,050. 9,640 + 12,050 = 21,690 rolls. (Estimate: 1,200 × 20 = 24,000.)

  - slug: g5math-u08-check-q03
    type: true_false
    topic_code: "5.NBT.B.5"
    source: "IM K–5 Math Grade 5, Unit 8, Section A"
    points: 1
    prompt: |
      True or false: 490 × 30 = 1,470.
    answer: false
    explanation: |
      False. 49 × 3 = 147, and 49 tens × 3 tens = 147 hundreds, which is 14,700. 1,470 is only 490 × 3.

  # ---- Dividing whole numbers (5.NBT.B.6)
  - slug: g5math-u08-check-q04
    type: multiple_choice
    topic_code: "5.NBT.B.6"
    source: "IM K–5 Math Grade 5, Unit 8, Section A"
    points: 1
    prompt: |
      What is 3,744 ÷ 48?
    options:
      - "78"
      - "708"
      - "76 R 96"
      - "3,696"
    option_explanations:
      - |
        Correct. 48 × 70 = 3,360, leaving 384. 48 × 8 = 384, leaving 0. 70 + 8 = 78.
      - |
        708 puts a 0 where the tens belong. 48 × 708 = 33,984, far more than 3,744. The quotient has 7 tens and 8 ones.
      - |
        A remainder of 96 is bigger than 48, so two more groups of 48 still fit. 76 + 2 = 78 with nothing left over.
      - |
        3,696 is 3,744 − 48, a subtraction. Division asks how many groups of 48 make 3,744.
    answer: 0

  - slug: g5math-u08-check-q05
    type: numeric
    topic_code: "5.NBT.B.6"
    source: "IM K–5 Math Grade 5, Unit 8, Section A"
    points: 1
    prompt: |
      A school orders 4,560 pencils in packs of 15. How many packs does it order?
    answer: { value: 304, tolerance: 0 }
    explanation: |
      4,560 ÷ 15: 15 × 300 = 4,500, leaving 60. 15 × 4 = 60, leaving 0. 300 + 4 = 304 packs. There are no tens, so it is 304, not 34.

  - slug: g5math-u08-check-q06
    type: multiple_choice
    topic_code: "5.NBT.B.6"
    source: "IM K–5 Math Grade 5, Unit 8, Section A"
    points: 1
    prompt: |
      850 markers are packed in boxes of 36. How many boxes can be filled completely?
    options:
      - "24"
      - "22"
      - "23"
      - "23 R 22"
    option_explanations:
      - |
        24 boxes would need 24 × 36 = 864 markers, but there are only 850. The last box cannot be filled.
      - |
        22 is the remainder, the number of markers left over after the full boxes.
      - |
        Correct. 850 ÷ 36 = 23 R 22. 23 boxes are full, and the 22 extra markers do not fill another box.
      - |
        The question asks for a number of full boxes, which is a whole number. The 22 left over are not a full box, so drop them.
    answer: 2

  # ---- Volume (5.MD.C.5, 5.OA.A.2)
  - slug: g5math-u08-check-q07
    type: multiple_choice
    topic_code: "5.MD.C.5"
    source: "IM K–5 Math Grade 5, Unit 8, Section B"
    points: 1
    stimulus: |
      Use the solid made of two rectangular prisms. The whole solid is 9 m long and 5 m deep. The tall part is 3 m long and 6 m tall, and the low part is 2 m tall.
    figure: figures/u08-step-solid.svg
    figure_alt: "A solid shaped like a step, made of two rectangular prisms of the same depth. The bottom front edge of the whole solid is labeled 9 m, and the depth on the right is labeled 5 m. The tall part on the left has its height labeled 6 m and its top front edge labeled 3 m. The low part on the right has its height labeled 2 m. The length of the low part is not labeled."
    prompt: |
      What is the volume of the solid?
    options:
      - "270 cubic meters"
      - "90 cubic meters"
      - "180 cubic meters"
      - "150 cubic meters"
    option_explanations:
      - |
        270 is 9 × 5 × 6, a full box 6 m tall. The right part is only 2 m tall, so that box includes empty space.
      - |
        90 is only the tall part, 3 × 5 × 6. Add the low part too.
      - |
        180 uses 9 m for the low part, 90 + 9 × 5 × 2. The low part is only 9 − 3 = 6 m long, so the part under the tall block is counted twice.
      - |
        Correct. The low part is 9 − 3 = 6 m long. Tall part: 3 × 5 × 6 = 90. Low part: 6 × 5 × 2 = 60. 90 + 60 = 150 cubic meters.
    answer: 3

  - slug: g5math-u08-check-q08
    type: multiple_choice
    topic_code: "5.OA.A.2"
    source: "IM K–5 Math Grade 5, Unit 8, Section B"
    points: 1
    stimulus: |
      Use the solid made of two rectangular prisms. The whole solid is 9 m long and 5 m deep. The tall part is 3 m long and 6 m tall, and the low part is 2 m tall.
    prompt: |
      Which expression gives the volume of the solid?
    options:
      - "(3 × 5 × 6) + (6 × 5 × 2)"
      - "(3 × 5 × 6) + (9 × 5 × 2)"
      - "(3 + 5 + 6) + (6 + 5 + 2)"
      - "(9 × 5) + (6 × 2)"
    option_explanations:
      - |
        Correct. The first part is the tall prism, 3 by 5 by 6, and the second is the low prism, 6 by 5 by 2. Adding them gives the whole solid.
      - |
        This uses the full 9 m for the low prism, which overlaps the tall part. The low prism is only 9 − 3 = 6 m long.
      - |
        This adds the edges of each prism. Volume multiplies the three edges of each prism, then adds the two volumes.
      - |
        9 × 5 is the area of the bottom and 6 × 2 is a flat rectangle. Neither is the volume of a prism.
    answer: 0

  - slug: g5math-u08-check-q09
    type: numeric
    topic_code: "5.MD.C.5"
    source: "IM K–5 Math Grade 5, Unit 8, Section B"
    points: 1
    prompt: |
      A box is 12 inches long and 10 inches wide. Its volume is 840 cubic inches. How many inches tall is it?
    answer: { value: 7, tolerance: 0 }
    explanation: |
      The base is 12 × 10 = 120 square inches. 840 ÷ 120 = 7, so the box is 7 inches tall.

  - slug: g5math-u08-check-q10
    type: multi_select
    topic_code: "5.MD.C.5"
    source: "IM K–5 Math Grade 5, Unit 8, Section B"
    points: 2
    partial_credit: true
    prompt: |
      Which boxes have a volume of exactly 60 cubic centimeters? Select all that apply.
    options:
      - "4 cm by 4 cm by 4 cm"
      - "3 cm by 4 cm by 5 cm"
      - "6 cm by 6 cm by 2 cm"
      - "2 cm by 5 cm by 6 cm"
      - "1 cm by 6 cm by 10 cm"
    option_explanations:
      - |
        No. 4 × 4 × 4 = 64 cubic centimeters, 4 more than 60.
      - |
        Yes. 3 × 4 = 12 and 12 × 5 = 60 cubic centimeters.
      - |
        No. 6 × 6 × 2 = 72 cubic centimeters, 12 more than 60.
      - |
        Yes. 2 × 5 = 10 and 10 × 6 = 60 cubic centimeters.
      - |
        Yes. 1 × 6 = 6 and 6 × 10 = 60 cubic centimeters.
    answer: [1, 3, 4]

  # ---- Fractions with unlike denominators (5.NF.A.1)
  - slug: g5math-u08-check-q11
    type: multiple_choice
    topic_code: "5.NF.A.1"
    source: "IM K–5 Math Grade 5, Unit 8, Section C"
    points: 1
    prompt: |
      What is 7/8 − 1/3?
    options:
      - "6/5"
      - "6/8"
      - "13/24"
      - "29/24"
    option_explanations:
      - |
        6/5 subtracts the numerators and the denominators. The pieces must be the same size first: rename both as twenty-fourths.
      - |
        6/8 subtracts 1 from 7 but keeps eighths. 1/3 is not 1/8, so rename: 1/3 = 8/24 and 7/8 = 21/24.
      - |
        Correct. 7/8 = 21/24 and 1/3 = 8/24. 21/24 − 8/24 = 13/24.
      - |
        29/24 is 21/24 + 8/24, the sum. The minus sign means take 8/24 away.
    answer: 2

  - slug: g5math-u08-check-q12
    type: multiple_choice
    topic_code: "5.NF.A.1"
    source: "IM K–5 Math Grade 5, Unit 8, Section C"
    points: 1
    prompt: |
      What is 3 2/5 + 1 3/4?
    options:
      - "4 5/9"
      - "5 3/20"
      - "4 3/20"
      - "1 13/20"
    option_explanations:
      - |
        4 5/9 adds the numerators and the denominators of the fractions. Rename both as twentieths first: 8/20 and 15/20.
      - |
        Correct. 3 8/20 + 1 15/20 = 4 23/20. Since 23/20 = 1 3/20, the sum is 5 3/20.
      - |
        4 3/20 forgets the whole inside 23/20. 4 23/20 is 4 + 1 3/20 = 5 3/20.
      - |
        1 13/20 is 3 2/5 − 1 3/4, a subtraction. The plus sign means put the amounts together.
    answer: 1

  - slug: g5math-u08-check-q13
    type: fill_blank
    topic_code: "5.NF.A.1"
    source: "IM K–5 Math Grade 5, Unit 8, Section C"
    points: 1
    prompt: |
      2/3 and 8/12 name the same amount, so they are ____ fractions.
    answer: ["equivalent", "equal"]
    explanation: |
      Equivalent fractions name the same amount. Multiplying the numerator and denominator of 2/3 by 4 gives 8/12.

  - slug: g5math-u08-check-q14
    type: numeric
    topic_code: "5.NF.A.1"
    source: "IM K–5 Math Grade 5, Unit 8, Section C"
    points: 1
    prompt: |
      Jo has 3 1/4 cups of flour. She uses 1 3/4 cups. How many cups are left? Type your answer as a decimal.
    answer: { value: 1.5, tolerance: 0.001 }
    explanation: |
      Trade a whole: 3 1/4 = 2 5/4. Then 2 5/4 − 1 3/4 = 1 2/4 = 1 1/2 cups, which is 1.5 as a decimal.

  # ---- Decimal operations (5.NBT.B.7)
  - slug: g5math-u08-check-q15
    type: multiple_choice
    topic_code: "5.NBT.B.7"
    source: "IM K–5 Math Grade 5, Unit 8, Section C"
    points: 1
    prompt: |
      What is 2.6 × 3.5?
    options:
      - "91"
      - "0.91"
      - "6.1"
      - "9.1"
    option_explanations:
      - |
        91 forgets the decimal points. 26 × 35 = 910, and tenths times tenths make hundredths, so the product is 9.10.
      - |
        0.91 is too small. 2.6 × 3.5 is more than 2 × 3 = 6, so the product must be more than 6.
      - |
        6.1 is 2.6 + 3.5, the sum. The × sign means multiply.
      - |
        Correct. 26 × 35 = 910 hundredths, which is 9.1. Estimate: 3 × 3 = 9.
    answer: 3

  - slug: g5math-u08-check-q16
    type: numeric
    topic_code: "5.NBT.B.7"
    source: "IM K–5 Math Grade 5, Unit 8, Section C"
    points: 1
    prompt: |
      A water cooler holds 15.2 liters. 6.75 liters are poured out. How many liters are left? Type a decimal.
    answer: { value: 8.45, tolerance: 0.001 }
    explanation: |
      Write 15.2 as 15.20 and line up the places: 15.20 − 6.75 = 8.45 liters. (Estimate: 15 − 7 = 8.)

  - slug: g5math-u08-check-q17
    type: multiple_choice
    topic_code: "5.NBT.B.7"
    source: "IM K–5 Math Grade 5, Unit 8, Section C"
    points: 1
    prompt: |
      What is 8.4 ÷ 0.3?
    options:
      - "28"
      - "2.8"
      - "0.28"
      - "280"
    option_explanations:
      - |
        Correct. 8.4 is 84 tenths, and 84 tenths ÷ 3 tenths = 84 ÷ 3 = 28. Check: 28 × 0.3 = 8.4.
      - |
        2.8 is 8.4 ÷ 3. Dividing by 0.3, a number less than 1, gives a quotient bigger than 8.4.
      - |
        0.28 is far too small. 0.3 fits into 8.4 many times, because 0.3 is much smaller than 8.4.
      - |
        280 is 84 ÷ 0.3. Check: 280 × 0.3 = 84, not 8.4.
    answer: 0

  - slug: g5math-u08-check-q18
    type: numeric
    topic_code: "5.NBT.B.7"
    source: "IM K–5 Math Grade 5, Unit 8, Section C"
    points: 1
    prompt: |
      Erasers cost $0.35 each. How many dollars do 12 erasers cost? Type a decimal.
    answer: { value: 4.2, tolerance: 0.001 }
    explanation: |
      12 × 0.35 = 10 × 0.35 + 2 × 0.35 = 3.50 + 0.70 = 4.20, so $4.20.

  # ---- Coordinate grid and expressions (5.G.A.2, 5.OA.A.2)
  - slug: g5math-u08-check-q19
    type: multiple_choice
    topic_code: "5.G.A.2"
    source: "IM K–5 Math Grade 5, Unit 8, Section D"
    points: 1
    stimulus: |
      Use the school garden map. Count distances in grid units.
    figure: figures/u08-garden-map.svg
    figure_alt: "A coordinate grid titled School garden map, with both axes numbered 0 to 8. Four points are marked: Tomatoes at (2, 5), Beans at (6, 5), Water tap at (6, 1) and Bench at (0, 3), which is on the y-axis."
    prompt: |
      What are the coordinates of the water tap?
    options:
      - "(1, 6)"
      - "(6, 0)"
      - "(6, 1)"
      - "(5, 1)"
    option_explanations:
      - |
        (1, 6) lists the numbers backwards. The tap is 6 units right and 1 unit up, and the across number comes first.
      - |
        (6, 0) would be on the x-axis. The tap is 1 unit above the x-axis.
      - |
        Correct. From the origin, go 6 units right and 1 unit up to reach the water tap: (6, 1).
      - |
        (5, 1) is one unit too far left. Read straight down from the tap to the x-axis: it lines up with 6.
    answer: 2

  - slug: g5math-u08-check-q20
    type: numeric
    topic_code: "5.G.A.2"
    source: "IM K–5 Math Grade 5, Unit 8, Section D"
    points: 1
    stimulus: |
      Use the school garden map. Count distances in grid units.
    prompt: |
      A hose runs in a straight line from the water tap to the beans. How many grid units long is the hose?
    answer: { value: 4, tolerance: 0 }
    explanation: |
      The tap is at (6, 1) and the beans are at (6, 5). Both have x-coordinate 6, so the hose is vertical. 5 − 1 = 4 units.

  - slug: g5math-u08-check-q21
    type: multiple_choice
    topic_code: "5.OA.A.2"
    source: "IM K–5 Math Grade 5, Unit 8, Section D"
    points: 1
    prompt: |
      Which words describe 3 × (125 + 46)?
    options:
      - "The sum of 3 × 125 and 46"
      - "Three times the sum of 125 and 46"
      - "3 more than the sum of 125 and 46"
      - "125 plus 46, then subtract 3"
    option_explanations:
      - |
        That would be 3 × 125 + 46. In the expression, the 3 multiplies the whole sum in the parentheses, including the 46.
      - |
        Correct. The parentheses hold the sum of 125 and 46, and 3 × means three times that sum.
      - |
        "3 more than" would be (125 + 46) + 3. The × sign means three times as much.
      - |
        There is no subtraction in the expression. The 3 multiplies the sum.
    answer: 1

  # ---- Short answer: designing a garden box
  - slug: g5math-u08-check-q22
    type: short_answer
    topic_code: "5.MD.C.5"
    source: "IM K–5 Math Grade 5, Unit 8, Section B"
    points: 3
    prompt: |
      A class designs a garden box 120 cm long, 50 cm wide and 30 cm tall.

      (a) Find the volume of the box in cubic centimeters. Show your work.
      (b) Soil comes in bags of 15,000 cubic centimeters. How many bags fill the box exactly?
      (c) Each bag costs $4.75. How much do the bags cost in all?
    answer: |
      (a) 120 × 50 = 6,000 square centimeters for the base, and 6,000 × 30 = 180,000 cubic centimeters.
      (b) 180,000 ÷ 15,000 = 12 bags.
      (c) 12 × $4.75 = $47.50 + $9.50 = $57.00.
    explanation: |
      Three points.

      (a) 1 pt: 180,000 cubic centimeters, with the three edges multiplied (in any order).

      (b) 1 pt: 12 bags, from dividing the volume by 15,000 (or thinking 15 thousands × 12 = 180 thousands). If (a) is wrong, award this point for a correct division of the student's own volume.

      (c) 1 pt: $57.00 (or $57), with a multiplication shown, such as 10 × 4.75 + 2 × 4.75.
