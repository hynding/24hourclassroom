week: 22
unit: 6
title: "Fraction Stories and Benchmark Estimates"
topics: ["5.NF.A.2"]
guide: guides/week-22.md
guide_description: |
  Solving word problems that add and subtract fractions and mixed numbers with unlike denominators: decide
  what the story asks, draw a tape diagram, find a common denominator and label the answer. Benchmark
  fractions 0, 1/2 and 1 give a quick estimate first, so you can tell when an answer such as
  2/5 + 1/2 = 3/7 cannot be right.
flashcards_description: |
  18 cards on benchmark fractions, deciding whether a fraction is more or less than 1/2, estimating sums and
  differences, checking whether an answer is reasonable, choosing to add or subtract in a story, missing
  parts, two-step stories and mixed numbers in stories.

flashcards:
  - front: Benchmark fractions → what they are
    back: |
      Friendly numbers to compare with and estimate with: 0, 1/2 and 1 (and whole numbers for mixed numbers).
    topic_code: "5.NF.A.2"
  - front: 5/6 → nearest benchmark
    back: |
      1. It is only 1/6 away from 1, but 2/6 away from 1/2.
    topic_code: "5.NF.A.2"
  - front: 3/8 → nearest benchmark
    back: |
      1/2. Half of 8 is 4, so 1/2 = 4/8, and 3/8 is just 1/8 away.
    topic_code: "5.NF.A.2"
  - front: 1/9 → nearest benchmark
    back: |
      0. It is a tiny part: one of nine pieces.
    topic_code: "5.NF.A.2"
  - front: More or less than 1/2 → a quick test
    back: |
      Double the numerator. If the double is more than the denominator, the fraction is more than 1/2. For 5/8: 5 + 5 = 10, and 10 is more than 8.
    topic_code: "5.NF.A.2"
  - front: Estimating 7/8 + 4/9 → with benchmarks
    back: |
      7/8 is close to 1 and 4/9 is close to 1/2, so the sum is about 1 1/2.
    topic_code: "5.NF.A.2"
  - front: Estimating 3 1/8 − 1 5/6 → with whole numbers
    back: |
      3 1/8 is close to 3 and 1 5/6 is close to 2, so the difference is about 1.
    topic_code: "5.NF.A.2"
  - front: Is 2/5 + 1/2 = 3/7 reasonable? → how to tell
    back: |
      No. 3/7 is less than 1/2, but 1/2 plus something must be more than 1/2. The real sum is 4/10 + 5/10 = 9/10.
    topic_code: "5.NF.A.2"
  - front: Two fractions less than 1/2 added → what you know
    back: |
      The sum is less than 1. For example, 1/3 + 2/5 is less than 1/2 + 1/2.
    topic_code: "5.NF.A.2"
  - front: Two fractions more than 1/2 added → what you know
    back: |
      The sum is more than 1. For example, 3/4 + 4/7 is more than 1/2 + 1/2.
    topic_code: "5.NF.A.2"
  - front: '"How much farther" or "how much more" → add or subtract?'
    back: |
      Subtract. If a trail is 3/4 mile and you have gone 1/3 mile, you have 3/4 − 1/3 = 9/12 − 4/12 = 5/12 mile left.
    topic_code: "5.NF.A.2"
  - front: '"In all" or "altogether" in a fraction story → add or subtract?'
    back: |
      Add. 1/2 cup of raisins and 1/3 cup of nuts is 3/6 + 2/6 = 5/6 cup in all.
    topic_code: "5.NF.A.2"
  - front: Missing part, 1/4 + ? = 2/3 → how to find it
    back: |
      Subtract the part you know from the total: 2/3 − 1/4 = 8/12 − 3/12 = 5/12.
    topic_code: "5.NF.A.2"
  - front: Tape diagram for a fraction story → what it shows
    back: |
      A bar for the whole amount, split into the parts of the story. The unknown part gets a question mark.
    topic_code: "5.NF.A.2"
  - front: Labels in a fraction story → why they matter
    back: |
      The answer is an amount of something: 5/12 mile, not just 5/12. The label also helps you check that the units match.
    topic_code: "5.NF.A.2"
  - front: What is left of 1 whole after 1/3 and 1/4 → two steps
    back: |
      1 = 12/12. Take away 4/12 and 3/12: 12/12 − 7/12 = 5/12 is left.
    topic_code: "5.NF.A.2"
  - front: 1 1/2 + 2 3/4 in a story → the sum
    back: |
      Wholes: 1 + 2 = 3. Parts: 2/4 + 3/4 = 5/4 = 1 1/4. Total: 4 1/4.
    topic_code: "5.NF.A.2"
  - front: Estimate, solve, compare → the habit
    back: |
      Estimate with benchmarks first, then find the exact answer, then ask if the two are close. If not, look for a mistake.
    topic_code: "5.NF.A.2"

quiz:
  description: |
    15 questions · about 25 minutes · benchmark fractions, estimating sums and differences, judging whether an
    answer is reasonable, word problems that add and subtract fractions and mixed numbers with unlike
    denominators, tape diagrams and a line plot, plus review of fraction operations, converting measurements
    and dividing by a two-digit number. Multiple choice, select-all, true/false and number answers are graded
    at once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g5math-w22-q01
      type: multiple_choice
      topic_code: "5.NF.A.2"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      stimulus: |
        Use the two number lines. The top one is marked in sixths and shows 5/6. The bottom one is marked in eighths and shows 3/8.
      figure: figures/w22-benchmark-lines.svg
      figure_alt: "Two number lines from 0 to 1, each with 0, 1/2 and 1 labeled. The top line has a tick mark every 1/6 and a blue dot labeled 5/6, one tick before 1. The bottom line has a tick mark every 1/8 and a blue dot labeled 3/8, one tick before 1/2."
      prompt: |
        Which benchmark is each fraction closest to?
      options:
        - "5/6 is closest to 1/2, and 3/8 is closest to 0."
        - "Both are closest to 1/2."
        - "5/6 is closest to 1, and 3/8 is closest to 1/2."
        - "5/6 is closest to 1, and 3/8 is closest to 0."
      option_explanations:
        - |
          5/6 is 2 sixths past 1/2 but only 1 sixth from 1, and 3/8 is 3 eighths from 0 but only 1 eighth from 1/2.
        - |
          3/8 is close to 1/2, but 5/6 is 1 tick from 1 and 2 ticks from 1/2, so it is closer to 1.
        - |
          Correct. 5/6 is 1/6 away from 1, and 3/8 is 1/8 away from 1/2 (which is 4/8).
        - |
          5/6 is right, but 3/8 is 3 ticks from 0 and only 1 tick from 1/2, so its benchmark is 1/2.
      answer: 2

    - slug: g5math-w22-q02
      type: multiple_choice
      topic_code: "5.NF.A.2"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      stimulus: |
        Use the two number lines. The top one is marked in sixths and shows 5/6. The bottom one is marked in eighths and shows 3/8.
      prompt: |
        Which is the best estimate of 5/6 + 3/8?
      options:
        - "about 1 1/2"
        - "about 1/2"
        - "about 2"
        - "about 1"
      option_explanations:
        - |
          Correct. 5/6 is about 1 and 3/8 is about 1/2, so the sum is about 1 + 1/2 = 1 1/2. (The exact sum is 1 5/24.)
        - |
          About 1/2 is less than 5/6 alone. Adding 3/8 makes the total bigger than 5/6.
        - |
          About 2 would need both fractions to be close to 1. 3/8 is less than 1/2, so it is closer to 1/2.
        - |
          About 1 leaves out the 3/8. 5/6 is already close to 1, and 3/8 adds about another 1/2.
      answer: 0

    - slug: g5math-w22-q03
      type: multiple_choice
      topic_code: "5.NF.A.2"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      figure: figures/w22-tape-walk.svg
      figure_alt: "A tape diagram. A bracket over the whole bar is labeled 3/4 mile in all. The bar is split into a blue part labeled 1/3 mile walked and a white part labeled with a question mark."
      prompt: |
        Rosa's walk to school is 3/4 mile. She has walked 1/3 mile. How much farther does she have to walk?
      options:
        - "1 1/12 miles"
        - "5/12 mile"
        - "2/4 mile"
        - "1/12 mile"
      option_explanations:
        - |
          1 1/12 is 3/4 + 1/3, the two numbers added. The question mark is the part left, so subtract.
        - |
          Correct. In twelfths, 3/4 = 9/12 and 1/3 = 4/12. 9/12 − 4/12 = 5/12 mile.
        - |
          2/4 subtracts the numerators, 3 − 1, and keeps fourths. Thirds and fourths need a common denominator first.
        - |
          1/12 is 4/12 − 3/12, which uses 1/4 instead of 3/4. Rosa's whole walk is 3/4 = 9/12 mile.
      answer: 1

    - slug: g5math-w22-q04
      type: multiple_choice
      topic_code: "5.MD.B.2"
      source: "IM K–5 Math Grade 5, Unit 3, Section C"
      points: 1
      stimulus: |
        Use the line plot. Each X is one seedling and shows how many inches it grew in one week.
      figure: figures/w22-line-plot-seedlings.svg
      figure_alt: "A line plot titled Seedling Growth in One Week, with a scale labeled Growth in inches from 0 to 1 marked 0, 1/8, 1/4, 3/8, 1/2, 5/8, 3/4, 7/8 and 1. There are 2 Xs above 1/4, 1 X above 3/8, 3 Xs above 1/2, 2 Xs above 5/8 and 1 X above 7/8. There are 9 Xs in all."
      prompt: |
        How much more did the seedling that grew the most grow than a seedling that grew the least?
      options:
        - "6/8 inch"
        - "1 1/8 inches"
        - "1/2 inch"
        - "5/8 inch"
      option_explanations:
        - |
          6/8 takes 1/8 from 7/8. The least growth is 1/4, which is 2/8, so subtract 2/8.
        - |
          1 1/8 is 7/8 + 1/4, which adds. "How much more" means subtract.
        - |
          1/2 is 7/8 − 3/8. The least growth on the plot is 1/4, not 3/8.
        - |
          Correct. The most is 7/8 and the least is 1/4 = 2/8. 7/8 − 2/8 = 5/8 inch.
      answer: 3

    - slug: g5math-w22-q05
      type: multiple_choice
      topic_code: "5.MD.B.2"
      source: "IM K–5 Math Grade 5, Unit 3, Section C"
      points: 1
      stimulus: |
        Use the line plot. Each X is one seedling and shows how many inches it grew in one week.
      prompt: |
        What is the total growth of all the seedlings that grew 1/4 inch or 3/8 inch?
      options:
        - "7/8 inch"
        - "5/8 inch"
        - "4/12 inch"
        - "1 1/8 inches"
      option_explanations:
        - |
          Correct. There are two Xs at 1/4 and one at 3/8: 2/8 + 2/8 + 3/8 = 7/8 inch.
        - |
          5/8 is 1/4 + 3/8, which counts only one of the two seedlings at 1/4. There are 2 Xs there.
        - |
          4/12 adds numerators and denominators. Change 1/4 to 2/8, then add eighths.
        - |
          1 1/8 counts three seedlings at 3/8. Only one X is above 3/8; the other two are at 1/4.
      answer: 0

    - slug: g5math-w22-q06
      type: numeric
      topic_code: "5.NF.A.2"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      prompt: |
        Three friends share one pizza. Sam eats 1/3 of it, Ana eats 1/4 of it and Joy eats 5/12 of it. How many whole pizzas did they eat together?
      answer: { value: 1, tolerance: 0 }
      explanation: |
        In twelfths: 1/3 = 4/12 and 1/4 = 3/12. 4/12 + 3/12 + 5/12 = 12/12 = 1. They ate 1 whole pizza.

    - slug: g5math-w22-q07
      type: numeric
      topic_code: "5.NF.A.2"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      prompt: |
        Lena has a ribbon 3/4 m long. She uses 1/2 m of it for a bow. How many meters of ribbon are left? Write your answer as a decimal.
      answer: { value: 0.25, tolerance: 0.001 }
      explanation: |
        3/4 − 1/2 = 3/4 − 2/4 = 1/4 m. As a decimal, 1/4 = 25/100 = 0.25 m.

    - slug: g5math-w22-q08
      type: fill_blank
      topic_code: "5.NF.A.2"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      prompt: |
        Friendly numbers such as 0, 1/2 and 1 that help you estimate with fractions are called ____ fractions.
      answer: ["benchmark", "benchmarks"]
      explanation: |
        They are benchmark fractions. Comparing a fraction with 0, 1/2 and 1 gives a quick estimate before you work out the exact answer.

    - slug: g5math-w22-q09
      type: true_false
      topic_code: "5.NF.A.2"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      prompt: |
        True or false: 3/7 is a reasonable answer for 2/5 + 1/2.
      answer: false
      explanation: |
        False. 3/7 is less than 1/2, but adding 2/5 to 1/2 must give more than 1/2. The sum is 4/10 + 5/10 = 9/10, close to 1.

    - slug: g5math-w22-q10
      type: multi_select
      topic_code: "5.NF.A.2"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which sums are greater than 1? Use benchmarks; you do not need to add exactly. Select all that apply.
      options:
        - "5/6 + 3/4"
        - "1/3 + 2/5"
        - "4/7 + 5/9"
        - "1/8 + 1/2"
        - "9/10 + 1/2"
      option_explanations:
        - |
          Yes. Both fractions are more than 1/2, so the sum is more than 1/2 + 1/2 = 1.
        - |
          No. Both fractions are less than 1/2, so the sum is less than 1.
        - |
          Yes. 4/7 is more than 1/2 (8 is more than 7) and 5/9 is more than 1/2 (10 is more than 9), so the sum is more than 1.
        - |
          No. 1/8 is less than 1/2, so 1/8 + 1/2 is less than 1/2 + 1/2 = 1.
        - |
          Yes. 9/10 is more than 1/2, so 9/10 + 1/2 is more than 1. It is 1 4/10.
      answer: [0, 2, 4]

    - slug: g5math-w22-q11
      type: short_answer
      topic_code: "5.NF.A.2"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 2
      prompt: |
        Nia has 2 1/2 yards of ribbon. She uses 3/4 yard for a bow and 1 1/3 yards for a banner.

        (a) How many yards does she use in all? Show your work.
        (b) How many yards of ribbon are left?
      answer: |
        (a) 3/4 + 1 1/3 = 9/12 + 1 4/12 = 1 13/12 = 2 1/12 yards.
        (b) 2 1/2 − 2 1/12 = 2 6/12 − 2 1/12 = 5/12 yard.
      explanation: |
        Two points.

        (a) 1 pt: 2 1/12 yards (or 25/12), with work that uses a common denominator such as 12.

        (b) 1 pt: 5/12 yard, subtracting the answer to (a) from 2 1/2. Give this point for a correct subtraction that follows from a wrong (a). A good check: about 1/2 + 1 1/2 = 2 yards used, so about 1/2 yard left.

    - slug: g5math-w22-q12
      type: multiple_choice
      topic_code: "5.NF.A.2"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      prompt: |
        A muffin recipe needs 7/8 cup of oats. Ben has 1/2 cup of oats. How much more does he need?
      options:
        - "1 3/8 cups"
        - "6/8 cup"
        - "3/8 cup"
        - "6/6 cup"
      option_explanations:
        - |
          1 3/8 is 7/8 + 1/2, which adds. Ben needs the missing part, so subtract.
        - |
          6/8 takes away 1/8 instead of 1/2. Half a cup is 4/8, so 7/8 − 4/8.
        - |
          Correct. 1/2 = 4/8, and 7/8 − 4/8 = 3/8 cup. Check: 4/8 + 3/8 = 7/8.
        - |
          6/6 subtracts the numerators and the denominators. Rewrite 1/2 as 4/8 first.
      answer: 2

    - slug: g5math-w22-q13
      type: multiple_choice
      topic_code: "5.MD.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section A"
      points: 1
      prompt: |
        Which is longer, a board 2 1/2 feet long or a board 28 inches long, and by how much?
      options:
        - "The 28-inch board, by 25 1/2 inches"
        - "The 2 1/2-foot board, by 2 inches"
        - "The 28-inch board, by 2 inches"
        - "The 28-inch board, by 3 inches"
      option_explanations:
        - |
          This compares 28 with 2 1/2 as if they were the same unit. Change 2 1/2 feet to inches first.
        - |
          Correct. 2 ft = 24 in and 1/2 ft = 6 in, so 2 1/2 ft = 30 in. 30 − 28 = 2 inches longer.
        - |
          The difference of 2 inches is right, but 30 inches is more than 28 inches, so the 2 1/2-foot board is longer.
        - |
          3 inches uses 1 ft = 10 in, so 2 1/2 ft becomes 25 in. A foot is 12 inches, so 2 1/2 ft = 24 + 6 = 30 in.
      answer: 1

    - slug: g5math-w22-q14
      type: multiple_choice
      topic_code: "5.NF.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      prompt: |
        What is 4/5 − 1/3?
      options:
        - "3/2"
        - "3/15"
        - "1 2/15"
        - "7/15"
      option_explanations:
        - |
          3/2 subtracts the numerators and the denominators. 3/2 is more than 4/5, which cannot happen when you take something away.
        - |
          3/15 subtracts the old numerators and uses fifteenths. Rewrite them too: 4/5 = 12/15 and 1/3 = 5/15.
        - |
          1 2/15 is 4/5 + 1/3, which adds. The question subtracts.
        - |
          Correct. 4/5 = 12/15 and 1/3 = 5/15, so 12/15 − 5/15 = 7/15.
      answer: 3

    - slug: g5math-w22-q15
      type: numeric
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 4, Section B"
      points: 1
      prompt: |
        A school orders 1,536 pencils. They come in boxes of 24. How many boxes is that?
      answer: { value: 64, tolerance: 0 }
      explanation: |
        1,536 ÷ 24. Partial quotients: 24 × 60 = 1,440, leaving 96; 24 × 4 = 96, leaving 0. 60 + 4 = 64 boxes. Check: 24 × 64 = 1,536.
