week: 23
unit: 6
title: "How Big Is the Product? Multiplying as Scaling"
topics: ["5.NF.B.5"]
guide: guides/week-23.md
guide_description: |
  Multiplying as resizing: predict the size of a product without working it out. Multiplying a number by a
  factor greater than 1 makes a bigger product, a factor less than 1 makes a smaller product, and a factor
  equal to 1 leaves it the same, which is why multiplying by 4/4 makes an equivalent fraction. Scaled bars,
  number lines, recipes and copies of pictures show the idea.
flashcards_description: |
  18 cards on scaling, scale factors greater than, less than and equal to 1, comparing a product with a
  factor without multiplying, equivalent fractions as multiplying by 1, ordering products, scaled recipes and
  drawings, and the myth that multiplying always makes numbers bigger.

flashcards:
  - front: Multiplying as scaling → what it means
    back: |
      Multiplying resizes a number. 3 × 8 makes 8 three times as big; 1/2 × 8 makes it half as big.
    topic_code: "5.NF.B.5"
  - front: Scale factor → what it is
    back: |
      The number you multiply by to resize something. In 3/4 × 12, the scale factor is 3/4.
    topic_code: "5.NF.B.5"
  - front: Scale factor greater than 1 → size of the product
    back: |
      Bigger than the number you started with. 5/4 × 12 = 15, and 15 is more than 12.
    topic_code: "5.NF.B.5"
  - front: Scale factor less than 1 → size of the product
    back: |
      Smaller than the number you started with. 3/4 × 12 = 9, and 9 is less than 12.
    topic_code: "5.NF.B.5"
  - front: Scale factor equal to 1 → size of the product
    back: |
      The same as the number you started with. 1 × 12 = 12, and 6/6 × 12 = 12.
    topic_code: "5.NF.B.5"
  - front: 2/3 × 4/4 → why it equals 2/3
    back: |
      4/4 is 1, and multiplying by 1 keeps the size. 2/3 × 4/4 = 8/12, an equivalent fraction for 2/3.
    topic_code: "5.NF.B.5"
  - front: 7/8 × 40 compared with 40 → without multiplying
    back: |
      Less than 40, because 7/8 is less than 1. (It is 35.)
    topic_code: "5.NF.B.5"
  - front: 1 1/2 × 40 compared with 40 → without multiplying
    back: |
      More than 40, because 1 1/2 is more than 1. (It is 60.)
    topic_code: "5.NF.B.5"
  - front: 0.9 × 250 compared with 250 → without multiplying
    back: |
      Less than 250, because 0.9 is less than 1. Decimal factors scale the same way.
    topic_code: "5.NF.B.5"
  - front: 6 × 3/5 compared with 3/5 → without multiplying
    back: |
      More than 3/5, because 6 is more than 1. Here the fraction is the number being scaled.
    topic_code: "5.NF.B.5"
  - front: 3/4 × 2/3 compared with 2/3 → without multiplying
    back: |
      Less than 2/3, because 3/4 is less than 1. (It is 6/12 = 1/2.)
    topic_code: "5.NF.B.5"
  - front: Two fractions less than 1 multiplied → the product
    back: |
      Less than each of them. 1/2 × 1/3 = 1/6, smaller than both 1/2 and 1/3.
    topic_code: "5.NF.B.5"
  - front: '"Multiplying always makes bigger" → true?'
    back: |
      No. It is true only when the scale factor is greater than 1. 1/2 × 10 = 5 is smaller than 10.
    topic_code: "5.NF.B.5"
  - front: Ordering 4/5 × 9, 9 and 6/5 × 9 → from least to greatest
    back: |
      4/5 × 9, then 9, then 6/5 × 9. Compare each scale factor with 1.
    topic_code: "5.NF.B.5"
  - front: Scaling on a number line → where 3/4 × 12 lands
    back: |
      Three quarters of the way from 0 to 12, at 9. A factor more than 1, like 5/4, lands past 12, at 15.
    topic_code: "5.NF.B.5"
  - front: Recipe made 1 1/2 times → 2 cups of flour becomes
    back: |
      1 1/2 × 2 = 3 cups. More than 2, because the scale factor is more than 1.
    topic_code: "5.NF.B.5"
  - front: Scaled copy of a picture → what happens to each side
    back: |
      Every length is multiplied by the same scale factor. With 1/2, a 10 cm side becomes 5 cm; with 2, it becomes 20 cm.
    topic_code: "5.NF.B.5"
  - front: Checking a product with scaling → how
    back: |
      Ask if the factor is more or less than 1. If 3/5 × 20 came out as 33, it is wrong: it must be less than 20. It is 12.
    topic_code: "5.NF.B.5"

quiz:
  description: |
    14 questions · about 25 minutes · multiplying as scaling, predicting whether a product is greater than,
    less than or equal to a factor, scale factors as fractions, mixed numbers and decimals, equivalent
    fractions as multiplying by 1, ordering products, scaled bars and number lines, plus review of fraction
    word problems, converting tons to pounds and multiplying decimals. Multiple choice, select-all,
    true/false and number answers are graded at once; the fill-in word is matched automatically; the short
    answer is checked by your teacher.
  questions:
    - slug: g5math-w23-q01
      type: multiple_choice
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 6, Section C"
      points: 1
      stimulus: |
        Use the bars. The top bar is 8 cm long. Bar A and Bar B are scaled copies of it: one is 3/4 times as long as the top bar and the other is 5/4 times as long.
      figure: figures/w23-scaled-bars.svg
      figure_alt: "Three bars lined up on the left. The top bar is blue and labeled 8 cm. Bar A is green and shorter than the top bar: it ends three quarters of the way along the top bar. Bar B is green and longer than the top bar: it sticks out past the top bar by one quarter of the top bar's length. Bars A and B have no length labels."
      prompt: |
        Which bar is 3/4 times as long as the top bar, and why?
      options:
        - "Bar A, because multiplying 8 by 3/4, a number less than 1, makes a product less than 8."
        - "Bar B, because multiplying always makes a number bigger."
        - "Neither, because 3/4 × 8 is the same length as 8."
        - "Bar A, because 3/4 is more than 1."
      option_explanations:
        - |
          Correct. 3/4 is less than 1, so 3/4 × 8 is shorter than 8. It is Bar A, 6 cm long.
        - |
          Multiplying makes a bigger product only when the factor is more than 1. 3/4 is less than 1, so the copy is shorter.
        - |
          Only a factor of 1 keeps the same length. 3/4 is less than 1, so the copy is shorter than 8 cm.
        - |
          Bar A is the right bar, but the reason is wrong: 3/4 is less than 1. That is why the copy is shorter.
      answer: 0

    - slug: g5math-w23-q02
      type: numeric
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 6, Section C"
      points: 1
      stimulus: |
        Use the bars. The top bar is 8 cm long. Bar A and Bar B are scaled copies of it: one is 3/4 times as long as the top bar and the other is 5/4 times as long.
      prompt: |
        Bar B is 5/4 times as long as the top bar. How many centimeters long is Bar B?
      answer: { value: 10, tolerance: 0 }
      explanation: |
        5/4 × 8 = (5 × 8) ÷ 4 = 40 ÷ 4 = 10 cm. That is more than 8 cm, as it must be, because 5/4 is more than 1.

    - slug: g5math-w23-q03
      type: multiple_choice
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 6, Section C"
      points: 1
      figure: figures/w23-number-line-12.svg
      figure_alt: "A number line from 0 to 20 with a tick mark at every whole number. 0, 10 and 20 are labeled, and a red mark at 12 is labeled 12. A blue dot labeled P sits at 8, and a blue dot labeled Q sits at 16."
      prompt: |
        Points P and Q show the products 2/3 × 12 and 4/3 × 12. Which statement is true?
      options:
        - "P is 4/3 × 12 and Q is 2/3 × 12."
        - "P is 2/3 × 12 and Q is 4/3 × 12."
        - "Neither, because 2/3 × 12 and 4/3 × 12 are both less than 12."
        - "Neither, because 2/3 × 12 and 4/3 × 12 are both more than 12."
      option_explanations:
        - |
          This swaps them. 4/3 is more than 1, so 4/3 × 12 is more than 12 and must be to the right of 12.
        - |
          Correct. 2/3 is less than 1, so 2/3 × 12 = 8 is left of 12. 4/3 is more than 1, so 4/3 × 12 = 16 is right of 12.
        - |
          Only factors less than 1 give products less than 12. 4/3 is more than 1, so 4/3 × 12 is more than 12.
        - |
          Only factors more than 1 give products more than 12. 2/3 is less than 1, so 2/3 × 12 is less than 12.
      answer: 1

    - slug: g5math-w23-q04
      type: multiple_choice
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 6, Section C"
      points: 1
      prompt: |
        Without multiplying, which product is greater than 45?
      options:
        - "7/8 × 45"
        - "1 × 45"
        - "9/5 × 45"
        - "0.6 × 45"
      option_explanations:
        - |
          7/8 is less than 1, so 7/8 × 45 is less than 45.
        - |
          1 × 45 is exactly 45. Multiplying by 1 keeps the number the same, so it is not greater.
        - |
          Correct. 9/5 is more than 1 (9 fifths is more than 5 fifths), so 9/5 × 45 is greater than 45.
        - |
          0.6 is less than 1, so 0.6 × 45 is less than 45.
      answer: 2

    - slug: g5math-w23-q05
      type: multiple_choice
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 6, Section C"
      points: 1
      prompt: |
        Which product is less than 3/5?
      options:
        - "3/5 × 4/3"
        - "3/5 × 1"
        - "3/5 × 1 1/2"
        - "3/5 × 2/3"
      option_explanations:
        - |
          4/3 is more than 1, so 3/5 × 4/3 is more than 3/5.
        - |
          Multiplying by 1 keeps the size, so 3/5 × 1 is equal to 3/5, not less.
        - |
          1 1/2 is more than 1, so 3/5 × 1 1/2 is more than 3/5.
        - |
          Correct. 2/3 is less than 1, so 3/5 × 2/3 is less than 3/5. (It is 6/15 = 2/5.)
      answer: 3

    - slug: g5math-w23-q06
      type: numeric
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 6, Section C"
      points: 1
      prompt: |
        A bread recipe uses 4 cups of flour. Dev makes 1 1/2 times the recipe. How many cups of flour does he use?
      answer: { value: 6, tolerance: 0 }
      explanation: |
        1 1/2 × 4 = (1 × 4) + (1/2 × 4) = 4 + 2 = 6 cups. More than 4, because the scale factor is more than 1.

    - slug: g5math-w23-q07
      type: fill_blank
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 6, Section C"
      points: 1
      prompt: |
        Multiplying to make a number or a picture bigger or smaller is called ____.
      answer: ["scaling", "scale", "resizing"]
      explanation: |
        It is scaling. The number you multiply by is the scale factor: more than 1 makes it bigger, less than 1 makes it smaller.

    - slug: g5math-w23-q08
      type: true_false
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 6, Section C"
      points: 1
      prompt: |
        True or false: 2/3 × 4/4 is equal to 2/3.
      answer: true
      explanation: |
        True. 4/4 = 1, and multiplying by 1 keeps the size. 2/3 × 4/4 = 8/12, which is equivalent to 2/3.

    - slug: g5math-w23-q09
      type: multi_select
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 6, Section C"
      points: 2
      partial_credit: true
      prompt: |
        Which products are less than 18? Decide without multiplying. Select all that apply.
      options:
        - "4/5 × 18"
        - "18 × 1 1/3"
        - "0.9 × 18"
        - "18 × 7/7"
        - "1/2 × 18"
      option_explanations:
        - |
          Yes. 4/5 is less than 1, so the product is less than 18.
        - |
          No. 1 1/3 is more than 1, so the product is more than 18.
        - |
          Yes. 0.9 is less than 1, so the product is less than 18.
        - |
          No. 7/7 = 1, so 18 × 7/7 is exactly 18, not less.
        - |
          Yes. 1/2 is less than 1, so half of 18 is less than 18. (It is 9.)
      answer: [0, 2, 4]

    - slug: g5math-w23-q10
      type: multiple_choice
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 6, Section C"
      points: 1
      prompt: |
        Which list puts 5/4 × 20, 3/4 × 20 and 20 in order from least to greatest?
      options:
        - "3/4 × 20, 20, 5/4 × 20"
        - "5/4 × 20, 20, 3/4 × 20"
        - "20, 3/4 × 20, 5/4 × 20"
        - "3/4 × 20, 5/4 × 20, 20"
      option_explanations:
        - |
          Correct. 3/4 is less than 1, so 3/4 × 20 is less than 20; 5/4 is more than 1, so 5/4 × 20 is more than 20. (15, 20, 25.)
        - |
          This is greatest to least. The question asks for least first.
        - |
          3/4 × 20 is less than 20, because 3/4 is less than 1, so it comes before 20.
        - |
          5/4 × 20 is more than 20, because 5/4 is more than 1, so it comes after 20.
      answer: 0

    - slug: g5math-w23-q11
      type: short_answer
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 6, Section C"
      points: 2
      prompt: |
        Maya says, "3/4 × 2/3 must be more than 2/3, because multiplying makes numbers bigger."

        (a) Is Maya right? Explain using the size of 3/4.
        (b) Find 3/4 × 2/3.
      answer: |
        (a) No. 3/4 is less than 1, so 3/4 of 2/3 is only part of 2/3. The product is less than 2/3.
        (b) 3/4 × 2/3 = 6/12, which is 1/2. And 1/2 is less than 2/3.
      explanation: |
        Two points.

        (a) 1 pt: says Maya is wrong and explains that the factor 3/4 is less than 1, so the product is less than 2/3.

        (b) 1 pt: 6/12 or 1/2 (or another equivalent fraction).

    - slug: g5math-w23-q12
      type: multiple_choice
      topic_code: "5.NF.A.2"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      prompt: |
        A park path is 9/10 km long. Zoe has jogged 2/5 km of it. How much of the path is left?
      options:
        - "7/5 km"
        - "1/2 km"
        - "1 3/10 km"
        - "7/10 km"
      option_explanations:
        - |
          7/5 subtracts the numerators and the denominators. 7/5 is more than the whole path, so it cannot be what is left.
        - |
          Correct. 2/5 = 4/10, and 9/10 − 4/10 = 5/10, which is 1/2 km.
        - |
          1 3/10 is 9/10 + 2/5, which adds. "How much is left" means subtract.
        - |
          7/10 takes away 2 tenths. 2/5 is 4 tenths, so 9/10 − 4/10 = 5/10.
      answer: 1

    - slug: g5math-w23-q13
      type: multiple_choice
      topic_code: "5.MD.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section A"
      points: 1
      prompt: |
        A dump truck carries 3 tons of gravel. How many pounds is that?
      options:
        - "300 lb"
        - "48 lb"
        - "6,000 lb"
        - "3,000 lb"
      option_explanations:
        - |
          300 uses 1 ton = 100 lb. A ton is 2,000 pounds.
        - |
          48 is 3 × 16, the pounds-to-ounces fact. A ton is 2,000 pounds.
        - |
          Correct. 1 ton = 2,000 lb, so 3 tons = 3 × 2,000 = 6,000 lb.
        - |
          3,000 uses 1 ton = 1,000 lb, like a kilogram and grams. A ton is 2,000 pounds.
      answer: 2

    - slug: g5math-w23-q14
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section C"
      points: 1
      prompt: |
        What is 0.6 × 0.4?
      options:
        - "2.4"
        - "0.024"
        - "1.0"
        - "0.24"
      option_explanations:
        - |
          2.4 is 6 × 0.4. Both factors are tenths, so 6 tenths × 4 tenths = 24 hundredths.
        - |
          0.024 is 24 thousandths. Tenths times tenths makes hundredths, so the answer is 24 hundredths.
        - |
          1.0 is 0.6 + 0.4, which adds. The question multiplies.
        - |
          Correct. 6 tenths × 4 tenths = 24 hundredths = 0.24. It is less than both factors, because each is less than 1.
      answer: 3
