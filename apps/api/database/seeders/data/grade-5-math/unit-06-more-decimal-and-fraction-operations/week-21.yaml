week: 21
unit: 6
title: "Adding and Subtracting Fractions with Unlike Denominators"
topics: ["5.NF.A.1"]
guide: guides/week-21.md
guide_description: |
  Why 1/3 and 1/4 cannot be added as they are, and how to fix it: rewrite both fractions with a common
  denominator using equivalent fractions, then add or subtract the numerators. Area diagrams cut both ways,
  number lines and fraction strips show the common unit. Sums greater than 1 become mixed numbers, and
  subtracting mixed numbers sometimes means trading 1 whole for fractional parts.
flashcards_description: |
  19 cards on unlike and common denominators, finding a common denominator, equivalent fractions, adding and
  subtracting fractions and mixed numbers, trading a whole, area diagrams and number lines for sums, and the
  mistake of adding the denominators.

flashcards:
  - front: Unlike denominators → what the words mean
    back: |
      The fractions have different denominators, like 1/3 and 1/4. Their parts are different sizes, so the numerators cannot be added as they are.
    topic_code: "5.NF.A.1"
  - front: Common denominator → what it is
    back: |
      A denominator that both fractions can be rewritten with. For 1/3 and 1/4, 12 works: 1/3 = 4/12 and 1/4 = 3/12.
    topic_code: "5.NF.A.1"
  - front: Finding a common denominator → a sure way
    back: |
      Multiply the two denominators. For 2/5 and 1/3, 5 × 3 = 15 always works.
    topic_code: "5.NF.A.1"
  - front: Smallest common denominator → why look for it
    back: |
      Smaller numbers are easier. For 1/6 + 1/9, use 18 instead of 54: 3/18 + 2/18 = 5/18.
    topic_code: "5.NF.A.1"
  - front: Rewriting 3/4 in twelfths → how
    back: |
      Multiply the numerator and the denominator by the same number, 3: 3/4 = 9/12. The size does not change.
    topic_code: "5.NF.A.1"
  - front: 1/3 + 1/4 → sum
    back: |
      4/12 + 3/12 = 7/12.
    topic_code: "5.NF.A.1"
  - front: 1/2 − 1/5 → difference
    back: |
      5/10 − 2/10 = 3/10.
    topic_code: "5.NF.A.1"
  - front: 5/6 + 1/4 → sum
    back: |
      10/12 + 3/12 = 13/12, which is 1 1/12.
    topic_code: "5.NF.A.1"
  - front: 7/8 − 1/6 → difference
    back: |
      21/24 − 4/24 = 17/24.
    topic_code: "5.NF.A.1"
  - front: Adding the denominators → why it is wrong
    back: |
      1/2 + 1/3 is not 2/5. 2/5 is less than 1/2, but adding 1/3 to 1/2 must make more than 1/2. The right sum is 3/6 + 2/6 = 5/6.
    topic_code: "5.NF.A.1"
  - front: Area diagram for 2/3 + 1/4 → how to draw it
    back: |
      Cut a rectangle into 3 columns and 4 rows: 12 equal parts. 2/3 is 8 parts and 1/4 is 3 parts, so the sum is 11/12.
    topic_code: "5.NF.A.1"
  - front: Number line for 1/2 + 2/3 → where you land
    back: |
      Mark the line in sixths. Start at 3/6 and jump 4/6. You land on 7/6, which is 1 1/6.
    topic_code: "5.NF.A.1"
  - front: Sum greater than 1 → how to write it
    back: |
      As a mixed number. 17/12 is 12/12 + 5/12, so it is 1 5/12.
    topic_code: "5.NF.A.1"
  - front: 2 1/3 + 1 1/2 → sum
    back: |
      Add the wholes: 2 + 1 = 3. Add the parts: 2/6 + 3/6 = 5/6. The sum is 3 5/6.
    topic_code: "5.NF.A.1"
  - front: Trading a whole when subtracting → when you need it
    back: |
      When the fraction you take away is bigger than the fraction you have. In 3 1/4 − 1 2/3 = 3 3/12 − 1 8/12, 3/12 is less than 8/12, so trade 1 whole for 12/12.
    topic_code: "5.NF.A.1"
  - front: 3 1/4 − 1 2/3 → difference
    back: |
      3 3/12 − 1 8/12 = 2 15/12 − 1 8/12 = 1 7/12.
    topic_code: "5.NF.A.1"
  - front: 1/2 + 1/3 + 1/6 → sum
    back: |
      3/6 + 2/6 + 1/6 = 6/6 = 1.
    topic_code: "5.NF.A.1"
  - front: 3/10 + 4/100 → sum
    back: |
      30/100 + 4/100 = 34/100. Tenths become hundredths by multiplying top and bottom by 10.
    topic_code: "5.NF.A.1"
  - front: Checking a fraction difference → how
    back: |
      Add back. If 1/2 − 1/5 = 3/10, then 3/10 + 1/5 = 3/10 + 2/10 = 5/10, which is 1/2. It checks.
    topic_code: "5.NF.A.1"

quiz:
  description: |
    15 questions · about 25 minutes · common denominators, equivalent fractions, adding and subtracting
    fractions with unlike denominators on area diagrams and number lines, sums greater than 1, adding and
    subtracting mixed numbers with trading, plus review of measurement conversions, powers of 10, subtracting
    decimals and the area of a rectangle with fraction sides. Multiple choice, select-all, true/false and
    number answers are graded at once; the fill-in word is matched automatically; the short answer is checked
    by your teacher.
  questions:
    - slug: g5math-w21-q01
      type: multiple_choice
      topic_code: "5.NF.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      stimulus: |
        Use the two diagrams. Each rectangle is 1 whole cut into 12 equal parts. The left one has 1/3 shaded and the right one has 1/4 shaded.
      figure: figures/w21-twelfths-diagrams.svg
      figure_alt: "Two rectangles of the same size. Each is divided by grid lines into 3 columns and 4 rows, making 12 equal parts. In the left rectangle, one whole column of 4 parts is shaded blue, labeled 1/3 shaded. In the right rectangle, one whole row of 3 parts is shaded green, labeled 1/4 shaded."
      prompt: |
        What is 1/3 + 1/4?
      options:
        - "2/7"
        - "7/12"
        - "7/24"
        - "4/12"
      option_explanations:
        - |
          2/7 adds the numerators and the denominators. Thirds and fourths are different sizes, so first change both to twelfths.
        - |
          Correct. 1/3 is 4 of the 12 parts and 1/4 is 3 of the 12 parts, so the sum is 4/12 + 3/12 = 7/12.
        - |
          7/24 counts the parts of both rectangles, 24 in all. Each rectangle is the same 1 whole, so the unit is twelfths.
        - |
          4/12 is only the left rectangle, 1/3. The 3 twelfths from 1/4 still need to be added.
      answer: 1

    - slug: g5math-w21-q02
      type: numeric
      topic_code: "5.NF.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      stimulus: |
        Use the two diagrams. Each rectangle is 1 whole cut into 12 equal parts. The left one has 1/3 shaded and the right one has 1/4 shaded.
      prompt: |
        Suppose you shaded 1/3 and then another 1/4 of one rectangle like these, with no part shaded twice. How many of its 12 parts would still be white?
      answer: { value: 5, tolerance: 0 }
      explanation: |
        1/3 is 4 parts and 1/4 is 3 parts, so 4 + 3 = 7 parts are shaded. 12 − 7 = 5 parts are white. So 1 − 7/12 = 5/12.

    - slug: g5math-w21-q03
      type: multiple_choice
      topic_code: "5.NF.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      figure: figures/w21-number-line-sixths.svg
      figure_alt: "A number line from 0 to 2 with a tick mark every 1/6. 0, 1 and 2 are labeled. A dark dot at 3/6 is labeled 1/2. A blue arrow labeled 2/3 jumps from 1/2 forward 4 sixths to a red dot labeled with a question mark, 1 sixth past 1."
      prompt: |
        Jada starts at 1/2 on the number line and jumps 2/3. Where does she land?
      options:
        - "1 1/6"
        - "3/5"
        - "5/6"
        - "1 1/3"
      option_explanations:
        - |
          Correct. In sixths, 1/2 = 3/6 and 2/3 = 4/6. 3/6 + 4/6 = 7/6, which is 1 1/6, one tick past 1.
        - |
          3/5 adds the numerators and the denominators. 3/5 is close to 1/2, but jumping 2/3 forward must go well past 1/2.
        - |
          5/6 is 1/2 + 1/3, a jump of only 2 sixths. The jump is 2/3, which is 4 sixths.
        - |
          1 1/3 is 8/6, one tick too far. Count the jump: 3/6 + 4/6 = 7/6.
      answer: 0

    - slug: g5math-w21-q04
      type: multiple_choice
      topic_code: "5.NF.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      prompt: |
        What is 5/6 − 1/4?
      options:
        - "4/2"
        - "9/12"
        - "7/12"
        - "4/12"
      option_explanations:
        - |
          4/2 subtracts the numerators and the denominators. Change both fractions to twelfths first: 10/12 − 3/12.
        - |
          9/12 changes 5/6 to 10/12 but takes away only 1/12. 1/4 is 3/12, so subtract 3.
        - |
          Correct. 5/6 = 10/12 and 1/4 = 3/12, so 10/12 − 3/12 = 7/12.
        - |
          4/12 subtracts the old numerators, 5 − 1, and then uses twelfths. Rewrite both numerators too: 10 − 3 = 7.
      answer: 2

    - slug: g5math-w21-q05
      type: multiple_choice
      topic_code: "5.NF.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      prompt: |
        What is 2 1/2 + 1 2/3?
      options:
        - "3 3/5"
        - "3 1/6"
        - "4 7/6"
        - "4 1/6"
      option_explanations:
        - |
          3 3/5 adds the numerators and the denominators of the parts. Use sixths: 1/2 = 3/6 and 2/3 = 4/6.
        - |
          3 1/6 is missing a whole. 3/6 + 4/6 = 7/6, which is 1 1/6, so the 1 whole joins the 3.
        - |
          4 7/6 counts the extra whole twice. After moving 6/6 into the wholes, only 1/6 is left.
        - |
          Correct. Wholes: 2 + 1 = 3. Parts: 3/6 + 4/6 = 7/6 = 1 1/6. Together: 3 + 1 1/6 = 4 1/6.
      answer: 3

    - slug: g5math-w21-q06
      type: numeric
      topic_code: "5.NF.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      prompt: |
        What is the smallest common denominator you could use to add 3/8 + 5/12?
      answer: { value: 24, tolerance: 0 }
      explanation: |
        List multiples of 12: 12, 24, 36. 12 is not a multiple of 8, but 24 is (8 × 3 = 24). So 24 is the smallest: 3/8 + 5/12 = 9/24 + 10/24 = 19/24.

    - slug: g5math-w21-q07
      type: fill_blank
      topic_code: "5.NF.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      prompt: |
        To add 1/4 + 1/6, first rewrite both fractions with a ____ denominator, such as 12.
      answer: ["common", "a common", "like", "same", "the same", "shared"]
      explanation: |
        A common denominator makes the parts the same size: 1/4 = 3/12 and 1/6 = 2/12, so the sum is 5/12.

    - slug: g5math-w21-q08
      type: true_false
      topic_code: "5.NF.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      prompt: |
        True or false: 1/2 + 1/3 = 2/5.
      answer: false
      explanation: |
        False. 2/5 is less than 1/2, so it cannot be 1/2 plus more. Using sixths, 1/2 + 1/3 = 3/6 + 2/6 = 5/6.

    - slug: g5math-w21-q09
      type: multi_select
      topic_code: "5.NF.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which are equal to 2/3 + 1/6? Select all that apply.
      options:
        - "5/6"
        - "4/6 + 1/6"
        - "3/9"
        - "10/12"
        - "1/2"
      option_explanations:
        - |
          Yes. In sixths, 2/3 = 4/6, and 4/6 + 1/6 = 5/6.
        - |
          Yes. This is the same sum with 2/3 rewritten as 4/6. It equals 5/6.
        - |
          No. 3/9 adds the numerators and the denominators. It equals 1/3, which is less than 2/3 alone.
        - |
          Yes. 10/12 is equivalent to 5/6: multiply the top and bottom of 5/6 by 2.
        - |
          No. 1/2 is 3/6, and the sum is 5/6. Adding 1/6 to 2/3 makes it bigger than 2/3, not smaller.
      answer: [0, 1, 3]

    - slug: g5math-w21-q10
      type: multiple_choice
      topic_code: "5.NF.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      prompt: |
        What is 4 1/5 − 1 1/2?
      options:
        - "3 3/10"
        - "2 3/10"
        - "3 7/10"
        - "2 7/10"
      option_explanations:
        - |
          3 3/10 subtracts the smaller part from the bigger one, 5/10 − 2/10, instead of trading. The 1/2 is being taken away from the 1/5.
        - |
          2 3/10 trades a whole but then still finds 5/10 − 2/10. After trading, the parts are 12/10 − 5/10 = 7/10.
        - |
          3 7/10 finds 7/10 correctly but forgets that a whole was traded, so the 4 became 3 before subtracting 1.
        - |
          Correct. 4 2/10 − 1 5/10: trade 1 whole for 10/10 to get 3 12/10. Then 12/10 − 5/10 = 7/10 and 3 − 1 = 2, so 2 7/10.
      answer: 3

    - slug: g5math-w21-q11
      type: short_answer
      topic_code: "5.NF.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 2
      prompt: |
        (a) Rewrite 3/4 and 2/5 as fractions with a common denominator.
        (b) Find 3/4 + 2/5. Write the sum as a mixed number.
      answer: |
        (a) A common denominator is 20: 3/4 = 15/20 and 2/5 = 8/20.
        (b) 15/20 + 8/20 = 23/20 = 1 3/20.
      explanation: |
        Two points.

        (a) 1 pt: both fractions rewritten correctly with the same denominator (20, or another common multiple such as 40: 30/40 and 16/40).

        (b) 1 pt: 1 3/20 (or an equal mixed number such as 1 6/40), shown as a mixed number.

    - slug: g5math-w21-q12
      type: multiple_choice
      topic_code: "5.MD.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section A"
      points: 1
      prompt: |
        The school's fun run is 2.5 km long. How many meters is that?
      options:
        - "25 m"
        - "2,500 m"
        - "250 m"
        - "2,050 m"
      option_explanations:
        - |
          25 is 2.5 × 10. A kilometer is 1,000 meters, so multiply by 1,000.
        - |
          Correct. 1 km = 10³ m, so 2.5 × 1,000 = 2,500 m. The digits move 3 places to the left.
        - |
          250 is 2.5 × 100, the meters-to-centimeters fact. A kilometer is 1,000 meters.
        - |
          2,050 treats 0.5 km as 50 m. Half a kilometer is 500 m, so 2,000 + 500 = 2,500 m.
      answer: 1

    - slug: g5math-w21-q13
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section B"
      points: 1
      prompt: |
        What is 6 − 2.35?
      options:
        - "4.35"
        - "8.35"
        - "3.65"
        - "3.75"
      option_explanations:
        - |
          4.35 takes the smaller digit from the bigger one in each place. Write 6 as 6.00 and regroup: 6.00 − 2.35.
        - |
          8.35 adds the numbers. The question asks for 6 minus 2.35.
        - |
          Correct. 6.00 − 2.35: regroup 1 one as 9 tenths and 10 hundredths. 10 − 5 = 5, 9 − 3 = 6, 5 − 2 = 3, so 3.65.
        - |
          3.75 regroups for the hundredths but forgets to take 1 from the tenths, which leaves 9 tenths, not 10.
      answer: 2

    - slug: g5math-w21-q14
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section C"
      points: 1
      prompt: |
        A garden bed is a rectangle 3/4 m long and 2/5 m wide. What is its area?
      options:
        - "3/10 square meter"
        - "5/9 square meter"
        - "1 3/20 square meters"
        - "6/9 square meter"
      option_explanations:
        - |
          Correct. Area is length × width: 3/4 × 2/5 = 6/20, which is 3/10 square meter.
        - |
          5/9 adds the numerators and the denominators. Area multiplies the side lengths.
        - |
          1 3/20 is 3/4 + 2/5, which adds the sides. Area multiplies them: 3/4 × 2/5.
        - |
          6/9 multiplies the numerators but adds the denominators. Multiply both: 4 × 5 = 20, so 6/20.
      answer: 0

    - slug: g5math-w21-q15
      type: numeric
      topic_code: "5.NBT.A.2"
      source: "IM K–5 Math Grade 5, Unit 6, Section A"
      points: 1
      prompt: |
        What is 4.08 × 10³? (Type the digits without a comma.)
      answer: { value: 4080, tolerance: 0 }
      explanation: |
        10³ = 1,000, so each digit moves 3 places to the left: 4 ones become 4 thousands and 8 hundredths become 8 tens. 4.08 × 10³ = 4,080.
