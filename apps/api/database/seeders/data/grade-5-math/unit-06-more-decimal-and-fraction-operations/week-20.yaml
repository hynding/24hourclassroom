week: 20
unit: 6
title: "Converting Measurements and Powers of 10"
topics: ["5.MD.A.1", "5.NBT.A.2"]
guide: guides/week-20.md
guide_description: |
  Converting measurements in both directions inside one system: multiply to change to a smaller unit and
  divide to change to a larger one. The metric facts (km, m, cm, mm, kg, g, L, mL) line up with powers of 10
  written with exponents, such as 1 km = 10³ m. The customary facts (ft, in, yd, mi, lb, oz, ton, gal, qt,
  pt, cups) and time facts use other numbers. Answers can be decimals or fractions: 250 cm = 2.5 m and
  18 in = 1 1/2 ft.
flashcards_description: |
  20 cards on exponents and powers of 10, what happens to the digits when you multiply or divide by 10², 10³
  and 10⁴, the metric and customary conversion facts, when to multiply and when to divide, and conversions
  whose answers are decimals or fractions.

flashcards:
  - front: Exponent in 10³ → what the 3 tells you
    back: |
      How many 10s are multiplied together. 10³ = 10 × 10 × 10 = 1,000.
    topic_code: "5.NBT.A.2"
  - front: 10⁴ written out → its value
    back: |
      10 × 10 × 10 × 10 = 10,000. The exponent 4 matches the 4 zeros after the 1.
    topic_code: "5.NBT.A.2"
  - front: 3.6 × 10³ → what the digits do
    back: |
      Each digit moves 3 places to the left, so it is worth 1,000 times as much. 3.6 × 10³ = 3,600.
    topic_code: "5.NBT.A.2"
  - front: 475 ÷ 10² → what the digits do
    back: |
      Each digit moves 2 places to the right, so it is worth 1/100 as much. 475 ÷ 10² = 4.75.
    topic_code: "5.NBT.A.2"
  - front: Metric facts as powers of 10 → three examples
    back: |
      1 km = 10³ m, 1 m = 10² cm and 1 kg = 10³ g. Metric units grow or shrink by powers of 10.
    topic_code: "5.NBT.A.2"
  - front: Centimeters and millimeters → the fact
    back: |
      1 cm = 10 mm. So 1 m = 100 × 10 = 1,000 mm.
    topic_code: "5.MD.A.1"
  - front: Converting to a larger unit → multiply or divide?
    back: |
      Divide. Big units fit fewer times, so the number gets smaller: 600 cm = 600 ÷ 100 = 6 m.
    topic_code: "5.MD.A.1"
  - front: Changing to a smaller unit → why the number grows
    back: |
      You multiply. Small units fit more times, so the number gets bigger: 6 m = 6 × 100 = 600 cm.
    topic_code: "5.MD.A.1"
  - front: 2,750 g → kilograms
    back: |
      2,750 ÷ 1,000 = 2.75 kg. Each digit moves 3 places to the right.
    topic_code: "5.MD.A.1"
  - front: 3,500 mL → liters
    back: |
      3,500 ÷ 1,000 = 3.5 L, which is 3 1/2 liters.
    topic_code: "5.MD.A.1"
  - front: 0.8 km → meters
    back: |
      0.8 × 1,000 = 800 m.
    topic_code: "5.MD.A.1"
  - front: Gallons, quarts, pints, cups → the chain of facts
    back: |
      1 gal = 4 qt, 1 qt = 2 pt and 1 pt = 2 cups. So 1 gal = 8 pt = 16 cups.
    topic_code: "5.MD.A.1"
  - front: Tons and pounds → the fact
    back: |
      1 ton = 2,000 lb. A half ton is 1,000 lb.
    topic_code: "5.MD.A.1"
  - front: Miles and feet → the fact
    back: |
      1 mile = 5,280 ft. That is the same as 1,760 yards.
    topic_code: "5.MD.A.1"
  - front: Days and hours → the fact
    back: |
      1 day = 24 hours. So 3 days = 3 × 24 = 72 hours.
    topic_code: "5.MD.A.1"
  - front: 18 inches → feet
    back: |
      18 ÷ 12 = 1 R 6. That is 1 foot 6 inches, and 6 inches is 6/12 = 1/2 foot, so 1 1/2 ft.
    topic_code: "5.MD.A.1"
  - front: 10 quarts → gallons
    back: |
      10 ÷ 4 = 2 R 2. That is 2 gallons 2 quarts, or 2 2/4 = 2 1/2 gallons.
    topic_code: "5.MD.A.1"
  - front: 40 ounces → pounds
    back: |
      40 ÷ 16 = 2 R 8. That is 2 lb 8 oz, and 8 oz is 8/16 = 1/2 lb, so 2 1/2 lb.
    topic_code: "5.MD.A.1"
  - front: 90 minutes → hours
    back: |
      90 ÷ 60 = 1 R 30. That is 1 hour 30 minutes, or 1 1/2 hours.
    topic_code: "5.MD.A.1"
  - front: Conversion check → did the number move the right way?
    back: |
      Bigger unit, smaller number. Smaller unit, bigger number. If 300 cm turned into 30,000 m, you multiplied when you should have divided: 300 cm = 3 m.
    topic_code: "5.MD.A.1"

quiz:
  description: |
    14 questions · about 25 minutes · converting measurements to larger and smaller units in the metric and
    customary systems, conversion tables and double number lines, conversions with decimal and fraction
    answers, multiplying and dividing by powers of 10 written with exponents, plus review of adding decimals,
    volume and fractions of whole numbers. Multiple choice, select-all, true/false and number answers are
    graded at once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g5math-w20-q01
      type: multiple_choice
      topic_code: "5.MD.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section A"
      points: 1
      stimulus: |
        Use the conversion table. It shows lengths in meters and the same lengths in centimeters. Two boxes are empty.
      figure: figures/w20-meters-table.svg
      figure_alt: "A table with two columns, Meters and Centimeters. The rows read 1 meter, 100 centimeters; 4 meters, 400 centimeters; 2.5 meters, an empty box; and an empty box, 80 centimeters."
      prompt: |
        What number belongs in the empty box beside 2.5 meters?
      options:
        - "25"
        - "250"
        - "2,500"
        - "205"
      option_explanations:
        - |
          25 is 2.5 × 10. A meter is 100 centimeters, so multiply by 100, not 10.
        - |
          Correct. 2.5 × 100 = 250, because each digit moves 2 places to the left. 2 m is 200 cm and half a meter is 50 cm.
        - |
          2,500 is 2.5 × 1,000. That is the meters-to-millimeters fact. A meter is only 100 centimeters.
        - |
          205 puts the 5 in the ones place. 2.5 means 2 and 5 tenths, and 5 tenths of a meter is 50 cm, so 200 + 50 = 250.
      answer: 1

    - slug: g5math-w20-q02
      type: numeric
      topic_code: "5.MD.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section A"
      points: 1
      stimulus: |
        Use the conversion table. It shows lengths in meters and the same lengths in centimeters. Two boxes are empty.
      prompt: |
        What number belongs in the empty box beside 80 centimeters? Type it as a decimal.
      answer: { value: 0.8, tolerance: 0.001 }
      explanation: |
        Meters are the larger unit, so divide by 100: 80 ÷ 100 = 0.8. So 80 cm = 0.8 m, which is 8 tenths of a meter.

    - slug: g5math-w20-q03
      type: multiple_choice
      topic_code: "5.NBT.A.2"
      source: "IM K–5 Math Grade 5, Unit 5, Section C"
      points: 1
      figure: figures/w20-place-value-chart.svg
      figure_alt: "A place-value chart with columns thousands, hundreds, tens, ones, a decimal point, tenths and hundredths. The Start row shows 5 in the ones place and 2 in the tenths place, which is 5.2. The After row shows 5 in the thousands place, 2 in the hundreds place, 0 in the tens place and 0 in the ones place, which is 5,200."
      prompt: |
        The chart shows 5.2 before and after it was multiplied by a power of 10. Which power of 10 was it?
      options:
        - "10²"
        - "10⁴"
        - "10³"
        - "10"
      option_explanations:
        - |
          10² = 100, and 5.2 × 100 = 520. The digits in the chart moved 3 places, so that is one place too few.
        - |
          10⁴ = 10,000, and 5.2 × 10,000 = 52,000. The 5 would land in the ten thousands place, past the chart.
        - |
          Correct. The 5 moved from the ones place to the thousands place, 3 places to the left. 5.2 × 10³ = 5,200.
        - |
          5.2 × 10 = 52, a move of only 1 place. In the chart the 5 moved from the ones to the thousands, 3 places.
      answer: 2

    - slug: g5math-w20-q04
      type: multiple_choice
      topic_code: "5.MD.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section A"
      points: 1
      figure: figures/w20-gallons-quarts.svg
      figure_alt: "A double number line. The top line is labeled gallons, with tick marks 0, 1, 2 and 3. The bottom line is labeled quarts, with a small tick for every quart from 0 to 12; the ticks under 0, 1, 2 and 3 gallons are labeled 0, 4, 8 and 12. A red mark at 10 quarts lines up with a question mark on the gallons line, halfway between 2 and 3."
      prompt: |
        A cooler holds 10 quarts of lemonade. How many gallons is that?
      options:
        - "2 1/2 gallons"
        - "40 gallons"
        - "2 1/4 gallons"
        - "3 gallons"
      option_explanations:
        - |
          Correct. 1 gal = 4 qt, so 10 ÷ 4 = 2 R 2. The 2 extra quarts are 2/4 = 1/2 gallon, and the red mark sits halfway between 2 and 3 gallons.
        - |
          40 is 10 × 4. Gallons are the larger unit, so divide by 4 instead of multiplying.
        - |
          2 1/4 treats the 2 leftover quarts as 1/4 gallon. Each quart is 1/4 gallon, so 2 quarts is 2/4 = 1/2 gallon.
        - |
          3 gallons is 12 quarts. The red mark is at 10 quarts, 2 quarts short of 3 gallons.
      answer: 0

    - slug: g5math-w20-q05
      type: numeric
      topic_code: "5.NBT.A.2"
      source: "IM K–5 Math Grade 5, Unit 6, Section A"
      points: 1
      prompt: |
        What is 7.3 × 10²?
      answer: { value: 730, tolerance: 0 }
      explanation: |
        10² = 100. Multiplying by 100 moves each digit 2 places to the left: the 7 goes from the ones to the hundreds and the 3 from the tenths to the tens. 7.3 × 10² = 730.

    - slug: g5math-w20-q06
      type: multiple_choice
      topic_code: "5.MD.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section A"
      points: 1
      prompt: |
        A watermelon has a mass of 4,250 g. What is its mass in kilograms?
      options:
        - "42.5 kg"
        - "425 kg"
        - "4,250,000 kg"
        - "4.25 kg"
      option_explanations:
        - |
          42.5 is 4,250 ÷ 100. A kilogram is 1,000 grams, so divide by 1,000.
        - |
          425 is 4,250 ÷ 10. A kilogram is 1,000 grams, so the digits move 3 places, not 1.
        - |
          4,250,000 is 4,250 × 1,000. Kilograms are the larger unit, so divide instead of multiplying.
        - |
          Correct. 1 kg = 1,000 g, so 4,250 ÷ 1,000 = 4.25 kg. A real watermelon of about 4 kg makes sense.
      answer: 3

    - slug: g5math-w20-q07
      type: fill_blank
      topic_code: "5.NBT.A.2"
      source: "IM K–5 Math Grade 5, Unit 5, Section C"
      points: 1
      prompt: |
        In 10³, the small raised 3 is called the ____. It tells how many 10s are multiplied together.
      answer: ["exponent", "exponents", "an exponent", "the exponent"]
      explanation: |
        The raised number is the exponent. In 10³ it is 3, so 10³ = 10 × 10 × 10 = 1,000.

    - slug: g5math-w20-q08
      type: true_false
      topic_code: "5.MD.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section A"
      points: 1
      prompt: |
        True or false: 3 1/2 feet is the same length as 42 inches.
      answer: true
      explanation: |
        True. 1 ft = 12 in, so 3 ft = 36 in, and 1/2 ft = 6 in. 36 + 6 = 42 inches.

    - slug: g5math-w20-q09
      type: multi_select
      topic_code: "5.MD.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section A"
      points: 2
      partial_credit: true
      prompt: |
        Which amounts are the same as 6 pints? Select all that apply.
      options:
        - "3 quarts"
        - "12 cups"
        - "3/4 gallon"
        - "12 quarts"
        - "3 cups"
      option_explanations:
        - |
          Yes. 1 qt = 2 pt, so 6 pints is 6 ÷ 2 = 3 quarts.
        - |
          Yes. 1 pt = 2 cups, so 6 pints is 6 × 2 = 12 cups.
        - |
          Yes. 6 pints is 3 quarts, and 1 gallon is 4 quarts, so 3 quarts is 3/4 gallon.
        - |
          No. 12 is 6 × 2, but quarts are larger than pints, so divide: 6 ÷ 2 = 3 quarts.
        - |
          No. 3 is 6 ÷ 2, but cups are smaller than pints, so multiply: 6 × 2 = 12 cups.
      answer: [0, 1, 2]

    - slug: g5math-w20-q10
      type: multiple_choice
      topic_code: "5.MD.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section A"
      points: 1
      prompt: |
        Ava has a rope 5 yards long. She cuts it into pieces that are each 18 inches long. How many pieces does she get?
      options:
        - "10 pieces"
        - "3 pieces"
        - "15 pieces"
        - "90 pieces"
      option_explanations:
        - |
          Correct. 1 yd = 36 in, so 5 yd = 5 × 36 = 180 inches, and 180 ÷ 18 = 10 pieces.
        - |
          3 pieces comes from using 1 yd = 12 inches: 60 ÷ 18 = 3 R 6. A yard is 3 feet, which is 36 inches.
        - |
          15 is the number of feet in 5 yards. Each piece is 18 inches, which is 1 1/2 feet, not 1 foot.
        - |
          90 is 5 × 18. That multiplies the yards by the piece length instead of changing yards to inches and dividing.
      answer: 0

    - slug: g5math-w20-q11
      type: short_answer
      topic_code: "5.MD.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section A"
      points: 2
      prompt: |
        The class water jug holds 3 gallons.

        (a) How many quarts does the jug hold? Show your work.
        (b) On field day the class drinks 20 pints of water. How many quarts is that? Is it more or less than one full jug?
      answer: |
        (a) 1 gal = 4 qt, so 3 gal = 3 × 4 = 12 qt.
        (b) 1 qt = 2 pt, so 20 pt = 20 ÷ 2 = 10 qt. 10 quarts is less than one full jug of 12 quarts (2 quarts less).
      explanation: |
        Two points.

        (a) 1 pt: 12 quarts, with work that multiplies 3 by 4.

        (b) 1 pt: 10 quarts from dividing 20 by 2, and the statement that it is less than the jug holds. Give this point if the comparison follows correctly from a wrong answer to (a).

    - slug: g5math-w20-q12
      type: numeric
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section B"
      points: 1
      prompt: |
        Nora biked 2.75 km on Monday and 1.6 km on Tuesday. How many kilometers did she bike in all? Type a decimal.
      answer: { value: 4.35, tolerance: 0.001 }
      explanation: |
        Line up the places: 2.75 + 1.60. Hundredths: 5 + 0 = 5. Tenths: 7 + 6 = 13, write 3 and regroup 1 one. Ones: 2 + 1 + 1 = 4. She biked 4.35 km.

    - slug: g5math-w20-q13
      type: multiple_choice
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      prompt: |
        A shoe box is 30 cm long, 18 cm wide and 10 cm tall. What is its volume?
      options:
        - "58 cubic centimeters"
        - "5,400 cubic centimeters"
        - "540 cubic centimeters"
        - "1,080 cubic centimeters"
      option_explanations:
        - |
          58 is 30 + 18 + 10. Volume multiplies length, width and height; it does not add them.
        - |
          Correct. 30 × 18 = 540 for the bottom layer, and 10 layers make 540 × 10 = 5,400 cubic centimeters.
        - |
          540 is the area of the base, 30 × 18. The box is 10 cm tall, so there are 10 layers of 540 cubes.
        - |
          1,080 is 540 × 2. The height is 10 cm, so multiply the base by 10, not 2.
      answer: 1

    - slug: g5math-w20-q14
      type: multiple_choice
      topic_code: "5.NF.B.4"
      source: "IM K–5 Math Grade 5, Unit 2, Section B"
      points: 1
      prompt: |
        There are 24 students in Mr. Osei's class. 2/3 of them walk to school. How many students walk to school?
      options:
        - "8 students"
        - "12 students"
        - "36 students"
        - "16 students"
      option_explanations:
        - |
          8 is 1/3 of 24. Two thirds is two of those groups: 2 × 8 = 16.
        - |
          12 is 1/2 of 24. The fraction is 2/3, so split 24 into 3 equal groups of 8 and take 2 of them.
        - |
          36 is more than the whole class. 2/3 is less than 1, so 2/3 of 24 must be less than 24.
        - |
          Correct. 2/3 × 24 = (2 × 24) ÷ 3 = 48 ÷ 3 = 16. Or: 1/3 of 24 is 8, and 2 × 8 = 16.
      answer: 3
