unit: 6
description: |
  22 questions · about 45 minutes · every standard of Unit 6: powers of 10 with exponents, converting
  measurements to larger and smaller units in the metric and customary systems, adding and subtracting
  fractions and mixed numbers with unlike denominators, fraction word problems and benchmark estimates, and
  multiplying as scaling. One stimulus set shares a conversion table across two consecutive items. Multiple
  choice, select-all, true/false and number answers are graded at once; the fill-in word is matched
  automatically; the short answer is checked by your teacher against the scoring notes.
questions:
  # ---- Powers of 10 (5.NBT.A.2)
  - slug: g5math-u06-check-q01
    type: multiple_choice
    topic_code: "5.NBT.A.2"
    source: "IM K–5 Math Grade 5, Unit 6, Section A"
    points: 1
    prompt: |
      Which number is equal to 10⁴?
    options:
      - "40"
      - "10,000"
      - "1,000"
      - "100,000"
    option_explanations:
      - |
        40 is 10 × 4. The exponent 4 means four 10s multiplied: 10 × 10 × 10 × 10.
      - |
        Correct. 10 × 10 × 10 × 10 = 10,000: a 1 followed by four zeros.
      - |
        1,000 is 10³, three 10s multiplied. 10⁴ has one more 10.
      - |
        100,000 is 10⁵, five 10s multiplied. 10⁴ has four.
    answer: 1

  - slug: g5math-u06-check-q02
    type: numeric
    topic_code: "5.NBT.A.2"
    source: "IM K–5 Math Grade 5, Unit 6, Section A"
    points: 1
    prompt: |
      What is 0.65 × 10³?
    answer: { value: 650, tolerance: 0 }
    explanation: |
      10³ = 1,000, so each digit moves 3 places to the left: 6 tenths become 6 hundreds and 5 hundredths become 5 tens. 0.65 × 10³ = 650.

  - slug: g5math-u06-check-q03
    type: multiple_choice
    topic_code: "5.NBT.A.2"
    source: "IM K–5 Math Grade 5, Unit 6, Section A"
    points: 1
    prompt: |
      What is 2,400 ÷ 10²?
    options:
      - "24"
      - "240"
      - "2.4"
      - "240,000"
    option_explanations:
      - |
        Correct. 10² = 100. Dividing by 100 moves each digit 2 places to the right: 2,400 ÷ 100 = 24.
      - |
        240 is 2,400 ÷ 10, a move of only 1 place. 10² is 100, so the digits move 2 places.
      - |
        2.4 is 2,400 ÷ 1,000, which is dividing by 10³. The exponent here is 2.
      - |
        240,000 is 2,400 × 100. The sign is ÷, so the number gets smaller.
    answer: 0

  # ---- Stimulus set: a pounds and ounces table (5.MD.A.1)
  - slug: g5math-u06-check-q04
    type: multiple_choice
    topic_code: "5.MD.A.1"
    source: "IM K–5 Math Grade 5, Unit 6, Section A"
    points: 1
    stimulus: |
      Use the conversion table. It shows weights in pounds and the same weights in ounces. Two boxes are empty.
    figure: figures/u06-pounds-ounces-table.svg
    figure_alt: "A table with two columns, Pounds and Ounces. The rows read 1 pound, 16 ounces; 3 pounds, 48 ounces; 1/2 pound, an empty box; and an empty box, 72 ounces."
    prompt: |
      What number belongs in the empty box beside 1/2 pound?
    options:
      - "32"
      - "4"
      - "8"
      - "16 1/2"
    option_explanations:
      - |
        32 is 2 × 16, the ounces in 2 pounds. Half a pound is half of 16.
      - |
        4 is a quarter of 16, the ounces in 1/4 pound. Half of 16 is 8.
      - |
        Correct. 1 lb = 16 oz, so 1/2 lb = 1/2 × 16 = 8 oz.
      - |
        16 1/2 adds the 1/2 to 16. Multiply instead: 1/2 × 16 = 8.
    answer: 2

  - slug: g5math-u06-check-q05
    type: multiple_choice
    topic_code: "5.MD.A.1"
    source: "IM K–5 Math Grade 5, Unit 6, Section A"
    points: 1
    stimulus: |
      Use the conversion table. It shows weights in pounds and the same weights in ounces. Two boxes are empty.
    prompt: |
      What number belongs in the empty box beside 72 ounces?
    options:
      - "1,152"
      - "4 1/8"
      - "56"
      - "4 1/2"
    option_explanations:
      - |
        1,152 is 72 × 16. Pounds are the larger unit, so divide by 16.
      - |
        72 ÷ 16 = 4 R 8, but the 8 left over is 8 ounces out of 16, which is 8/16 = 1/2 pound, not 1/8.
      - |
        56 is 72 − 16, which takes away one pound's worth. Find how many 16s fit in 72.
      - |
        Correct. 72 ÷ 16 = 4 R 8. 4 pounds is 64 ounces, and the 8 ounces left are 8/16 = 1/2 pound, so 4 1/2.
    answer: 3

  - slug: g5math-u06-check-q06
    type: numeric
    topic_code: "5.MD.A.1"
    source: "IM K–5 Math Grade 5, Unit 6, Section A"
    points: 1
    prompt: |
      A charity race is 5 km long. How many meters is that? (Type the digits without a comma.)
    answer: { value: 5000, tolerance: 0 }
    explanation: |
      1 km = 1,000 m = 10³ m, so 5 km = 5 × 1,000 = 5,000 m.

  - slug: g5math-u06-check-q07
    type: multiple_choice
    topic_code: "5.MD.A.1"
    source: "IM K–5 Math Grade 5, Unit 6, Section A"
    points: 1
    prompt: |
      A water bottle holds 750 mL. How many liters is that?
    options:
      - "7.5 L"
      - "0.75 L"
      - "75 L"
      - "750,000 L"
    option_explanations:
      - |
        7.5 is 750 ÷ 100. A liter is 1,000 milliliters, so divide by 1,000.
      - |
        Correct. 1 L = 1,000 mL, so 750 ÷ 1,000 = 0.75 L. That is a bit less than 1 liter, which fits a water bottle.
      - |
        75 is 750 ÷ 10. A liter is 1,000 milliliters, so the digits move 3 places to the right.
      - |
        750,000 is 750 × 1,000. Liters are the larger unit, so divide.
    answer: 1

  - slug: g5math-u06-check-q08
    type: true_false
    topic_code: "5.MD.A.1"
    source: "IM K–5 Math Grade 5, Unit 6, Section A"
    points: 1
    prompt: |
      True or false: 1 1/2 gallons is the same amount as 6 quarts.
    answer: true
    explanation: |
      True. 1 gal = 4 qt, so 1 gallon is 4 quarts and 1/2 gallon is 2 quarts. 4 + 2 = 6 quarts.

  - slug: g5math-u06-check-q09
    type: multi_select
    topic_code: "5.MD.A.1"
    source: "IM K–5 Math Grade 5, Unit 6, Section A"
    points: 2
    partial_credit: true
    prompt: |
      A movie lasts 2 1/4 hours. Which times are the same length? Select all that apply.
    options:
      - "135 minutes"
      - "2 hours 15 minutes"
      - "2 hours 25 minutes"
      - "225 minutes"
      - "8,100 seconds"
    option_explanations:
      - |
        Yes. 2 hours is 120 minutes and 1/4 hour is 15 minutes. 120 + 15 = 135 minutes.
      - |
        Yes. 1/4 of an hour is 60 ÷ 4 = 15 minutes.
      - |
        No. This treats 1/4 hour as 25 minutes, like a quarter of a dollar. An hour has 60 minutes, so 1/4 hour is 15 minutes.
      - |
        No. 225 treats an hour as 100 minutes. 2 1/4 hours is 135 minutes.
      - |
        Yes. 135 minutes × 60 seconds = 8,100 seconds.
    answer: [0, 1, 4]

  - slug: g5math-u06-check-q10
    type: multiple_choice
    topic_code: "5.MD.A.1"
    source: "IM K–5 Math Grade 5, Unit 6, Section A"
    points: 1
    prompt: |
      Theo has a strip of paper 3 m long. He cuts it into pieces 25 cm long. How many pieces does he get?
    options:
      - "12 pieces"
      - "75 pieces"
      - "120 pieces"
      - "22 pieces"
    option_explanations:
      - |
        Correct. 3 m = 300 cm, and 300 ÷ 25 = 12 pieces.
      - |
        75 is 3 × 25. Change 3 m to centimeters first, then divide by the length of a piece.
      - |
        120 uses 1 m = 1,000 cm, so 3,000 ÷ 25. A meter is 100 centimeters, so 3 m is 300 cm.
      - |
        22 is 25 − 3. Change meters to centimeters, then divide: 300 ÷ 25.
    answer: 0

  # ---- Adding and subtracting fractions (5.NF.A.1)
  - slug: g5math-u06-check-q11
    type: multiple_choice
    topic_code: "5.NF.A.1"
    source: "IM K–5 Math Grade 5, Unit 6, Section B"
    points: 1
    figure: figures/u06-area-halves-fifths.svg
    figure_alt: "A rectangle divided into 2 columns and 5 rows, making 10 equal parts. All 5 parts of the left column are blue. The top 4 parts of the right column are green, and the bottom part of the right column is white. A key shows that blue means 1/2 and green means 2/5."
    prompt: |
      The diagram shows 1/2 + 2/5. What is the sum?
    options:
      - "3/7"
      - "9/20"
      - "9/10"
      - "1/10"
    option_explanations:
      - |
        3/7 adds the numerators and the denominators. The rectangle is cut into tenths, so count tenths: 5 + 4.
      - |
        9/20 counts 9 shaded parts out of 20, as if there were two wholes. This rectangle is 1 whole with 10 equal parts, so the unit is tenths.
      - |
        Correct. 1/2 is the 5 blue parts, or 5/10. 2/5 is 4 of the 10 parts, the 4 green parts, because 2/5 = 4/10. 5/10 + 4/10 = 9/10.
      - |
        1/10 is the white part, what is not shaded. The sum is the shaded part: 5 + 4 = 9 tenths.
    answer: 2

  - slug: g5math-u06-check-q12
    type: multiple_choice
    topic_code: "5.NF.A.1"
    source: "IM K–5 Math Grade 5, Unit 6, Section B"
    points: 1
    prompt: |
      What is 5/6 − 3/8?
    options:
      - "1 5/24"
      - "11/24"
      - "2/24"
      - "17/24"
    option_explanations:
      - |
        1 5/24 is 5/6 + 3/8, which adds. The question subtracts.
      - |
        Correct. 24 is a common denominator: 5/6 = 20/24 and 3/8 = 9/24. 20/24 − 9/24 = 11/24.
      - |
        2/24 subtracts the old numerators, 5 − 3. Rewrite both numerators for twenty-fourths: 20 − 9.
      - |
        17/24 rewrites 5/6 as 20/24 but subtracts only 3. 3/8 is 9/24.
    answer: 1

  - slug: g5math-u06-check-q13
    type: multiple_choice
    topic_code: "5.NF.A.1"
    source: "IM K–5 Math Grade 5, Unit 6, Section B"
    points: 1
    prompt: |
      What is 3 1/6 − 1 3/4?
    options:
      - "1 5/12"
      - "2 7/12"
      - "2 5/12"
      - "1 7/12"
    option_explanations:
      - |
        Correct. 3 2/12 − 1 9/12: trade 1 whole for 12/12 to get 2 14/12. 14/12 − 9/12 = 5/12 and 2 − 1 = 1, so 1 5/12.
      - |
        2 7/12 finds 9/12 − 2/12, taking the small part from the big one. The 9/12 is the part being taken away, so trade a whole.
      - |
        2 5/12 trades a whole for 12/12 but forgets to make the 3 into a 2 before subtracting.
      - |
        1 7/12 trades correctly but then subtracts 9 − 2 instead of 14 − 9.
    answer: 0

  - slug: g5math-u06-check-q14
    type: numeric
    topic_code: "5.NF.A.1"
    source: "IM K–5 Math Grade 5, Unit 6, Section B"
    points: 1
    prompt: |
      What is the smallest common denominator for 1/6 and 3/10?
    answer: { value: 30, tolerance: 0 }
    explanation: |
      Multiples of 10: 10, 20, 30. 30 is also a multiple of 6 (6 × 5 = 30), so 30 is the smallest. 1/6 = 5/30 and 3/10 = 9/30.

  - slug: g5math-u06-check-q15
    type: fill_blank
    topic_code: "5.NF.A.1"
    source: "IM K–5 Math Grade 5, Unit 6, Section B"
    points: 1
    prompt: |
      3/12 and 1/4 name the same amount, so they are ____ fractions.
    answer: ["equivalent", "equal"]
    explanation: |
      They are equivalent fractions: 1/4 = (1 × 3)/(4 × 3) = 3/12. Rewriting fractions as equivalent fractions is how we get a common denominator.

  # ---- Fraction stories and estimates (5.NF.A.2)
  - slug: g5math-u06-check-q16
    type: multiple_choice
    topic_code: "5.NF.A.2"
    source: "IM K–5 Math Grade 5, Unit 6, Section B"
    points: 1
    prompt: |
      Which is the best estimate of 1 7/8 + 2 1/10?
    options:
      - "about 3"
      - "about 3 1/2"
      - "about 5"
      - "about 4"
    option_explanations:
      - |
        About 3 adds only the whole numbers, 1 + 2. 1 7/8 is almost 2, so round it to 2.
      - |
        About 3 1/2 treats 7/8 as about 1/2. 7/8 is only 1/8 away from 1, so 1 7/8 is about 2.
      - |
        About 5 rounds 2 1/10 up to 3. 2 1/10 is only 1/10 more than 2, so it rounds to 2, and 2 + 2 = 4.
      - |
        Correct. 1 7/8 is close to 2 and 2 1/10 is close to 2, so the sum is about 4. (Exactly 3 39/40.)
    answer: 3

  - slug: g5math-u06-check-q17
    type: multiple_choice
    topic_code: "5.NF.A.2"
    source: "IM K–5 Math Grade 5, Unit 6, Section B"
    points: 1
    prompt: |
      Four students found 1/2 + 3/8. Which answer is reasonable?
    options:
      - "4/10"
      - "1 3/8"
      - "7/8"
      - "4/8"
    option_explanations:
      - |
        4/10 is less than 1/2. Adding 3/8 to 1/2 must give more than 1/2, so it cannot be right.
      - |
        1 3/8 is too big. 1/2 + 3/8 is less than 1/2 + 1/2 = 1, because 3/8 is less than 1/2.
      - |
        Correct. 1/2 = 4/8, and 4/8 + 3/8 = 7/8. It is between 1/2 and 1, as the estimate says.
      - |
        4/8 is equal to 1/2, so it leaves out the 3/8 that is being added.
    answer: 2

  - slug: g5math-u06-check-q18
    type: multiple_choice
    topic_code: "5.NF.A.2"
    source: "IM K–5 Math Grade 5, Unit 6, Section B"
    points: 1
    prompt: |
      Lucia reads for 3/4 hour and practices piano for 2/3 hour. How long does she spend on the two in all?
    options:
      - "1 5/12 hours"
      - "5/7 hour"
      - "1 1/12 hours"
      - "17/24 hour"
    option_explanations:
      - |
        Correct. 3/4 = 9/12 and 2/3 = 8/12. 9/12 + 8/12 = 17/12 = 1 5/12 hours.
      - |
        5/7 adds the numerators and the denominators. 5/7 is less than 3/4 alone, so it cannot be the total.
      - |
        1 1/12 rewrites 3/4 as 9/12 but 2/3 as 4/12. Two thirds is 8 twelfths: 9 + 8 = 17.
      - |
        17/24 uses the right numerators, 9 + 8, but over 24. The common denominator here is 12, so the sum is 17/12.
    answer: 0

  # ---- Multiplying as scaling (5.NF.B.5)
  - slug: g5math-u06-check-q19
    type: multiple_choice
    topic_code: "5.NF.B.5"
    source: "IM K–5 Math Grade 5, Unit 6, Section C"
    points: 1
    figure: figures/u06-factor-number-line.svg
    figure_alt: "A number line from 0 to 2 with a tick mark every 1/5. 0, 1 and 2 are labeled. A blue dot labeled P is at 3/5, between 0 and 1. A blue dot labeled Q is at 7/5, between 1 and 2."
    prompt: |
      Rafi will multiply 30 by the number at point P or the number at point Q. Which one gives a product greater than 30?
    options:
      - "Point P, because it is closer to 0."
      - "Both, because multiplying always makes a bigger number."
      - "Neither, because P and Q are both fractions."
      - "Point Q, because it is greater than 1."
    option_explanations:
      - |
        P is 3/5, which is less than 1, so 3/5 × 30 is less than 30. (It is 18.)
      - |
        Multiplying makes a bigger number only when the factor is more than 1. P is less than 1.
      - |
        A fraction can be greater than 1. Q is 7/5, which is more than 5/5, so 7/5 × 30 is more than 30.
      - |
        Correct. Q is 7/5, which is more than 1, so 7/5 × 30 is greater than 30. (It is 42.)
    answer: 3

  - slug: g5math-u06-check-q20
    type: multiple_choice
    topic_code: "5.NF.B.5"
    source: "IM K–5 Math Grade 5, Unit 6, Section C"
    points: 1
    prompt: |
      Without multiplying, which statement about 0.75 × 64 is true?
    options:
      - "0.75 × 64 is greater than 64."
      - "0.75 × 64 is less than 64."
      - "0.75 × 64 is equal to 64."
      - "0.75 × 64 is less than 0.75."
    option_explanations:
      - |
        A product is greater than 64 only when the other factor is more than 1. 0.75 is less than 1.
      - |
        Correct. 0.75 is less than 1, so 0.75 × 64 is less than 64. (It is 48.)
      - |
        Only multiplying by 1 keeps 64 the same. 0.75 is less than 1.
      - |
        Here 0.75 is being scaled by 64, which is more than 1, so the product is more than 0.75.
    answer: 1

  - slug: g5math-u06-check-q21
    type: numeric
    topic_code: "5.NF.B.5"
    source: "IM K–5 Math Grade 5, Unit 6, Section C"
    points: 1
    prompt: |
      A poster is 24 inches wide. A small copy is 3/4 times as wide. How many inches wide is the copy?
    answer: { value: 18, tolerance: 0 }
    explanation: |
      3/4 × 24 = (3 × 24) ÷ 4 = 72 ÷ 4 = 18 inches. Less than 24, because 3/4 is less than 1.

  - slug: g5math-u06-check-q22
    type: short_answer
    topic_code: "5.NF.A.2"
    source: "IM K–5 Math Grade 5, Unit 6, Section B"
    points: 3
    prompt: |
      A nature trail is 3 1/2 miles long. Ty walks 1 2/3 miles before lunch.

      (a) Use benchmarks to estimate how far Ty still has to walk.
      (b) Find exactly how far he still has to walk. Show your work.
      (c) Check your answer to (b) by adding.
    answer: |
      (a) 1 2/3 is about 1 1/2, so about 3 1/2 − 1 1/2 = 2 miles. (Rounding 1 2/3 to 2 gives about 1 1/2 miles; that is fine too.)
      (b) 3 1/2 − 1 2/3 = 3 3/6 − 1 4/6. Trade 1 whole: 2 9/6 − 1 4/6 = 1 5/6 miles.
      (c) 1 2/3 + 1 5/6 = 1 4/6 + 1 5/6 = 2 9/6 = 3 3/6 = 3 1/2 miles. It checks.
    explanation: |
      Three points.

      (a) 1 pt: a sensible estimate from benchmarks, about 1 1/2 or about 2 miles, with the rounding shown.

      (b) 1 pt: 1 5/6 miles, using a common denominator (sixths) and trading a whole.

      (c) 1 pt: adds the answer to (b) to 1 2/3 and gets 3 1/2 (or explains why it does not, if (b) was wrong).
