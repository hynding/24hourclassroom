week: 24
unit: 7
title: "The Coordinate Plane and Ordered Pairs"
topics: ["5.G.A.1"]
guide: guides/week-24.md
guide_description: |
  How a coordinate grid works: the x-axis and the y-axis, the origin at (0, 0), and how an ordered pair
  like (3, 7) tells you how far to go right and then how far to go up. Also points that sit on an axis,
  and why (3, 7) and (7, 3) are different points.
flashcards_description: |
  20 cards on the coordinate grid, the x-axis and y-axis, the origin, ordered pairs, the x-coordinate and
  y-coordinate, plotting a point, reading a point's location, points on an axis and moving along grid lines.

flashcards:
  - front: Coordinate grid → what it is
    back: |
      Two number lines that cross at a right angle at 0, with grid lines drawn across. It lets you name any point with two numbers.
    topic_code: "5.G.A.1"
  - front: Coordinate grid · x-axis → which line it is
    back: |
      The horizontal number line, going left to right along the bottom of the grid. Numbers on it grow as you move right.
    topic_code: "5.G.A.1"
  - front: Coordinate grid · y-axis → which line it is
    back: |
      The vertical number line, going up the left side of the grid. Numbers on it grow as you move up.
    topic_code: "5.G.A.1"
  - front: Coordinate grid · origin → what it is
    back: |
      The point where the x-axis and the y-axis cross. Its ordered pair is (0, 0). Every trip to a point starts here.
    topic_code: "5.G.A.1"
  - front: Ordered pair → what it is
    back: |
      Two numbers in parentheses, like (4, 9), that name one point on the grid. The order matters: the first number always goes first.
    topic_code: "5.G.A.1"
  - front: Ordered pair · first number → what it tells you
    back: |
      The x-coordinate: how far to move right from the origin, along the x-axis. In (6, 2), move right 6.
    topic_code: "5.G.A.1"
  - front: Ordered pair · second number → what it tells you
    back: |
      The y-coordinate: how far to move up from the x-axis, in the direction of the y-axis. In (6, 2), move up 2.
    topic_code: "5.G.A.1"
  - front: Coordinates → what the word means
    back: |
      The numbers in an ordered pair. The point (5, 8) has an x-coordinate of 5 and a y-coordinate of 8.
    topic_code: "5.G.A.1"
  - front: Plotting (2, 7) → the steps
    back: |
      Start at the origin. Move right 2 along the x-axis. Then move up 7. Make a dot there and label it.
    topic_code: "5.G.A.1"
  - front: Reading a point's ordered pair → the steps
    back: |
      From the point, look straight down to the x-axis to read the x-coordinate. Then look straight across to the y-axis to read the y-coordinate. Write (x, y).
    topic_code: "5.G.A.1"
  - front: (4, 1) and (1, 4) → same point or not?
    back: |
      Different points. (4, 1) is 4 right and 1 up. (1, 4) is 1 right and 4 up. Switching the numbers moves the point.
    topic_code: "5.G.A.1"
  - front: Point with y-coordinate 0 → where it sits
    back: |
      On the x-axis. You move right but never up, like (7, 0).
    topic_code: "5.G.A.1"
  - front: Point with x-coordinate 0 → where it sits
    back: |
      On the y-axis. You never move right, only up, like (0, 3).
    topic_code: "5.G.A.1"
  - front: Grid lines vs spaces → what to count
    back: |
      Count the grid lines you land on, starting with 0 at the origin, not the squares. Points sit where lines cross.
    topic_code: "5.G.A.1"
  - front: Moving right 3 from (2, 5) → the new point
    back: |
      (5, 5). Moving right changes only the x-coordinate: 2 + 3 = 5. The y-coordinate stays 5.
    topic_code: "5.G.A.1"
  - front: Moving up 4 from (6, 1) → the new point
    back: |
      (6, 5). Moving up changes only the y-coordinate: 1 + 4 = 5. The x-coordinate stays 6.
    topic_code: "5.G.A.1"
  - front: Same x-coordinate → where the points line up
    back: |
      On one vertical line. (3, 1), (3, 4) and (3, 8) are all straight above each other.
    topic_code: "5.G.A.1"
  - front: Same y-coordinate → where the points line up
    back: |
      On one horizontal line. (1, 6), (4, 6) and (9, 6) are all in a row, side by side.
    topic_code: "5.G.A.1"
  - front: First quadrant → what it is
    back: |
      The part of the coordinate plane where both coordinates are 0 or more. This year every grid is the first quadrant.
    topic_code: "5.G.A.1"
  - front: Order of an ordered pair → a way to remember
    back: |
      Along the hall, then up the stairs: go across first (x), then up (y). The x-coordinate is written first.
    topic_code: "5.G.A.1"

quiz:
  description: |
    15 questions · about 25 minutes · the x-axis, the y-axis and the origin, reading and plotting ordered
    pairs, points on an axis and moving along grid lines, plus review of adding fractions, converting units,
    scaling and adding decimals. Multiple choice, select-all, true/false and number answers are graded at
    once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g5math-w24-q01
      type: multiple_choice
      topic_code: "5.G.A.1"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      stimulus: |
        Use the coordinate grid with points A, B, C, D, E and F. Both axes are numbered from 0 to 10.
      figure: figures/w24-six-points.svg
      figure_alt: "A coordinate grid with the x-axis and the y-axis each numbered 0 to 10. Six points are plotted: A at (3, 7), B at (7, 3), C at (0, 5) on the y-axis, D at (6, 0) on the x-axis, E at (4, 4) and F at (8, 9)."
      prompt: |
        What is the ordered pair for point A?
      options:
        - "(3, 7)"
        - "(7, 3)"
        - "(3, 6)"
        - "(4, 8)"
      option_explanations:
        - |
          Correct. Point A is 3 units to the right of the origin and 7 units up, so it is at (3, 7).
        - |
          This has the numbers switched. (7, 3) means 7 right and 3 up, which is where point B is.
        - |
          Point A sits on the grid line for 7, not 6. Read the number on the y-axis straight across from the point.
        - |
          This counts one too many each way, as if the first line were 1. The origin is 0, so A is at (3, 7).
      answer: 0

    - slug: g5math-w24-q02
      type: multiple_choice
      topic_code: "5.G.A.1"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      stimulus: |
        Use the coordinate grid with points A, B, C, D, E and F. Both axes are numbered from 0 to 10.
      prompt: |
        Which point is at (7, 3)?
      options:
        - "Point A"
        - "Point E"
        - "Point D"
        - "Point B"
      option_explanations:
        - |
          Point A is at (3, 7): 3 right and 7 up. That is the same two numbers in the other order, so it is a different point.
        - |
          Point E is at (4, 4). It is 4 right and 4 up, not 7 right and 3 up.
        - |
          Point D is at (6, 0), on the x-axis. To reach (7, 3) you go 7 right and then 3 up.
        - |
          Correct. Start at the origin, move 7 units right, then 3 units up, and you land on point B.
      answer: 3

    - slug: g5math-w24-q03
      type: multi_select
      topic_code: "5.G.A.1"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 2
      partial_credit: true
      stimulus: |
        Use the coordinate grid with points A, B, C, D, E and F. Both axes are numbered from 0 to 10.
      prompt: |
        Which points lie on an axis? Select all that apply.
      options:
        - "Point A"
        - "Point C"
        - "Point D"
        - "Point E"
        - "Point F"
      option_explanations:
        - |
          No. Point A is at (3, 7). Neither coordinate is 0, so it is out in the grid, not on an axis.
        - |
          Yes. Point C is at (0, 5). Its x-coordinate is 0, so it sits right on the y-axis.
        - |
          Yes. Point D is at (6, 0). Its y-coordinate is 0, so it sits right on the x-axis.
        - |
          No. Point E is at (4, 4). It is 4 units away from each axis.
        - |
          No. Point F is at (8, 9), up and to the right, far from both axes.
      answer: [1, 2]

    - slug: g5math-w24-q04
      type: numeric
      topic_code: "5.G.A.1"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      stimulus: |
        Use the coordinate grid with points A, B, C, D, E and F. Both axes are numbered from 0 to 10.
      prompt: |
        What is the y-coordinate of point F?
      answer: { value: 9, tolerance: 0 }
      explanation: |
        Point F is at (8, 9). The y-coordinate is the second number, how far up the point is. Looking straight across from F to the y-axis gives 9.

    - slug: g5math-w24-q05
      type: multiple_choice
      topic_code: "5.G.A.1"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      figure: figures/w24-point-k.svg
      figure_alt: "A coordinate grid with the x-axis and the y-axis each numbered 0 to 8. One point, K, is plotted at (2, 6): on the vertical grid line for 2 and the horizontal grid line for 6."
      prompt: |
        Which directions take you from the origin to point K?
      options:
        - "Move right 6, then up 2."
        - "Move right 2, then up 6."
        - "Move right 2, then up 5."
        - "Move up 2, then right 8."
      option_explanations:
        - |
          This would land on (6, 2). Point K is only 2 units to the right of the origin and 6 units up.
        - |
          Correct. Point K is at (2, 6), so you move 2 units right along the x-axis and then 6 units up.
        - |
          Point K sits on the grid line for 6, not 5. Count the lines up from the x-axis, starting at 0.
        - |
          Moving right 8 would take you to the right edge of the grid. Point K is only 2 to the right.
      answer: 1

    - slug: g5math-w24-q06
      type: fill_blank
      topic_code: "5.G.A.1"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      prompt: |
        The point where the x-axis and the y-axis cross, named by the ordered pair (0, 0), is called the ____.
      answer: ["origin", "the origin"]
      explanation: |
        The origin is the point (0, 0), where the two axes meet. To plot any point, you start at the origin.

    - slug: g5math-w24-q07
      type: true_false
      topic_code: "5.G.A.1"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      prompt: |
        True or false: the ordered pairs (2, 9) and (9, 2) name the same point.
      answer: false
      explanation: |
        False. The order matters. (2, 9) is 2 units right and 9 units up. (9, 2) is 9 units right and only 2 units up. They are two different points.

    - slug: g5math-w24-q08
      type: multiple_choice
      topic_code: "5.G.A.1"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      prompt: |
        In the ordered pair (8, 3), what does the 8 tell you?
      options:
        - "How far to move up from the x-axis"
        - "How many points are on the grid"
        - "How far to move right from the origin"
        - "How far apart the two axes are"
      option_explanations:
        - |
          Moving up is told by the second number, the y-coordinate. Here that is the 3, not the 8.
        - |
          An ordered pair names just one point. Its numbers tell you where that point is, not how many there are.
        - |
          Correct. The first number is the x-coordinate. It tells you how far to move right along the x-axis.
        - |
          The two axes meet at the origin, so they are not any distance apart. The 8 tells you how far right the point is.
      answer: 2

    - slug: g5math-w24-q09
      type: numeric
      topic_code: "5.G.A.1"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      prompt: |
        Point R is at (4, 9). Point S is 3 units to the right of point R. What is the x-coordinate of point S?
      answer: { value: 7, tolerance: 0 }
      explanation: |
        Moving right changes only the x-coordinate. 4 + 3 = 7, so point S is at (7, 9) and its x-coordinate is 7.

    - slug: g5math-w24-q10
      type: multiple_choice
      topic_code: "5.G.A.1"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      prompt: |
        Which ordered pair names a point on the y-axis?
      options:
        - "(6, 0)"
        - "(6, 6)"
        - "(1, 6)"
        - "(0, 6)"
      option_explanations:
        - |
          (6, 0) has a y-coordinate of 0. You move 6 right and not up at all, so this point is on the x-axis.
        - |
          (6, 6) is 6 units right of the y-axis, out in the middle of the grid.
        - |
          (1, 6) is close to the y-axis, but it is 1 unit to the right of it, so it is not on it.
        - |
          Correct. The x-coordinate is 0, so you do not move right at all. You only move up 6, along the y-axis.
      answer: 3

    - slug: g5math-w24-q11
      type: multiple_choice
      topic_code: "5.NF.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section B"
      points: 1
      prompt: |
        Review: what is 2/3 + 1/4?
      options:
        - "3/7"
        - "11/12"
        - "3/12"
        - "9/12"
      option_explanations:
        - |
          This adds the tops and the bottoms. Thirds and fourths are different sizes, so first rename both as twelfths.
        - |
          Correct. 2/3 = 8/12 and 1/4 = 3/12, so the sum is 8/12 + 3/12 = 11/12.
        - |
          3/12 is just 1/4 renamed. The 2/3 still needs to be renamed as 8/12 and added on.
        - |
          9/12 is 3/4. It comes from renaming 2/3 as 6/12, but 2/3 is 8/12, because 2 × 4 = 8.
      answer: 1

    - slug: g5math-w24-q12
      type: numeric
      topic_code: "5.MD.A.1"
      source: "IM K–5 Math Grade 5, Unit 6, Section A"
      points: 1
      prompt: |
        Review: a trail is 4.2 kilometers long. How many meters long is it? (Type the digits without a comma.)
      answer: { value: 4200, tolerance: 0 }
      explanation: |
        1 kilometer is 1,000 meters, so multiply by 1,000. 4.2 × 1,000 = 4,200, so the trail is 4,200 meters long.

    - slug: g5math-w24-q13
      type: multiple_choice
      topic_code: "5.NF.B.5"
      source: "IM K–5 Math Grade 5, Unit 6, Section C"
      points: 1
      prompt: |
        Review: without multiplying, which product is less than 15?
      options:
        - "15 × 6/5"
        - "15 × 1"
        - "3/5 × 15"
        - "2 1/3 × 15"
      option_explanations:
        - |
          6/5 is more than 1, so 15 × 6/5 is more than 15. Multiplying by a number bigger than 1 makes it bigger.
        - |
          Multiplying by 1 keeps the number the same, so 15 × 1 is exactly 15, not less.
        - |
          Correct. 3/5 is less than 1, so 3/5 × 15 is less than 15. (It is 9.)
        - |
          2 1/3 is more than 2, so this product is more than twice 15.
      answer: 2

    - slug: g5math-w24-q14
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section B"
      points: 1
      prompt: |
        Review: what is 2.45 + 3.8?
      options:
        - "6.25"
        - "2.83"
        - "5.25"
        - "5.125"
      option_explanations:
        - |
          Correct. Line up the decimal points: 2.45 + 3.80 = 6.25.
        - |
          This adds the 8 to the hundredths. 3.8 is 3 ones and 8 tenths, so the 8 goes with the 4 tenths.
        - |
          The tenths add to 4 + 8 = 12 tenths. That is 1 one and 2 tenths, so the ones become 2 + 3 + 1 = 6.
        - |
          This writes 12 tenths as "12" after the point instead of trading 10 tenths for 1 one. 12 tenths is 1 one and 2 tenths, so the sum is 6.25.
      answer: 0

    - slug: g5math-w24-q15
      type: short_answer
      topic_code: "5.G.A.1"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 2
      prompt: |
        Diego plotted the point (6, 1). He started at the origin, moved up 6 units and then moved right 1 unit.

        (a) Did Diego plot (6, 1) correctly? Explain.
        (b) Tell how to plot (6, 1), and give the ordered pair of the point Diego actually plotted.
      answer: |
        (a) No. The first number is the x-coordinate, so it tells you how far to move right, not up. Diego used the numbers in the wrong order.
        (b) Start at the origin, move 6 units right along the x-axis, then move 1 unit up. Diego's point is 1 right and 6 up, so it is (1, 6).
      explanation: |
        Two points.

        (a) 1 pt: says Diego is not correct and explains that the first number tells how far to move right (the x-coordinate comes first).

        (b) 1 pt: gives the right steps (6 right, then 1 up) and names Diego's point as (1, 6).
