unit: 7
description: |
  22 questions · about 40 minutes · every standard of Unit 7: the coordinate grid and ordered pairs,
  graphing points to solve map and shape problems, the hierarchy of quadrilaterals and triangles, and
  two numerical patterns with their ordered pairs and graphs. Three stimulus sets share a picture across
  consecutive questions. Multiple choice, select-all, true/false and number answers are graded at once;
  the fill-in word is matched automatically; the short answer is checked by your teacher against the
  scoring notes.
questions:
  # ---- Stimulus set A: community garden map (5.G.A.1, 5.G.A.2)
  - slug: g5math-u07-check-q01
    type: multiple_choice
    topic_code: "5.G.A.1"
    source: "IM K–5 Math Grade 5, Unit 7, Section A"
    points: 1
    stimulus: |
      Use the map of the community garden. Both axes are numbered from 0 to 10, and 1 unit on the grid stands for 1 meter. People walk only along the grid lines.
    figure: figures/u07-garden-map.svg
    figure_alt: "A garden map on a coordinate grid. The x-axis and the y-axis are each numbered 0 to 10, and a note says 1 unit equals 1 meter. Five plants are plotted: Tomatoes at (1, 6), Beans at (1, 2), Corn at (8, 2), Sunflowers at (8, 9) and Herbs at (4, 5)."
    prompt: |
      What is the ordered pair for the corn?
    options:
      - "(2, 8)"
      - "(8, 3)"
      - "(8, 2)"
      - "(8, 9)"
    option_explanations:
      - |
        This switches the numbers. The corn is 8 meters to the right and 2 meters up, so 8 comes first.
      - |
        The corn sits on the grid line for 2, not 3. Read across from the point to the y-axis.
      - |
        Correct. The corn is straight above 8 on the x-axis and straight across from 2 on the y-axis.
      - |
        (8, 9) is the sunflowers, straight above the corn. They share the x-coordinate 8 but not the height.
    answer: 2

  - slug: g5math-u07-check-q02
    type: multiple_choice
    topic_code: "5.G.A.1"
    source: "IM K–5 Math Grade 5, Unit 7, Section A"
    points: 1
    stimulus: |
      Use the map of the community garden. Both axes are numbered from 0 to 10, and 1 unit on the grid stands for 1 meter. People walk only along the grid lines.
    prompt: |
      Which plant is at (1, 6)?
    options:
      - "Tomatoes"
      - "Beans"
      - "Herbs"
      - "Sunflowers"
    option_explanations:
      - |
        Correct. Move 1 right from the origin and then 6 up, and you land on the tomatoes.
      - |
        The beans are at (1, 2). They are 1 to the right too, but only 2 up, not 6.
      - |
        The herbs are at (4, 5), which is 4 to the right. (1, 6) is only 1 to the right.
      - |
        The sunflowers are at (8, 9), far to the right. (1, 6) is close to the y-axis.
    answer: 0

  - slug: g5math-u07-check-q03
    type: numeric
    topic_code: "5.G.A.2"
    source: "IM K–5 Math Grade 5, Unit 7, Section A"
    points: 1
    stimulus: |
      Use the map of the community garden. Both axes are numbered from 0 to 10, and 1 unit on the grid stands for 1 meter. People walk only along the grid lines.
    prompt: |
      How many meters is it from the beans straight across to the corn?
    answer: { value: 7, tolerance: 0 }
    explanation: |
      The beans are at (1, 2) and the corn is at (8, 2). They share the y-coordinate 2, so subtract the x-coordinates: 8 − 1 = 7 meters.

  - slug: g5math-u07-check-q04
    type: multi_select
    topic_code: "5.G.A.1"
    source: "IM K–5 Math Grade 5, Unit 7, Section A"
    points: 2
    partial_credit: true
    stimulus: |
      Use the map of the community garden. Both axes are numbered from 0 to 10, and 1 unit on the grid stands for 1 meter. People walk only along the grid lines.
    prompt: |
      Which plants have an x-coordinate of 8? Select all that apply.
    options:
      - "Tomatoes"
      - "Beans"
      - "Corn"
      - "Sunflowers"
      - "Herbs"
    option_explanations:
      - |
        No. The tomatoes are at (1, 6). Their x-coordinate is 1.
      - |
        No. The beans are at (1, 2). Their x-coordinate is 1; the 2 is how far up they are.
      - |
        Yes. The corn is at (8, 2), so its x-coordinate, the first number, is 8.
      - |
        Yes. The sunflowers are at (8, 9), straight above the corn, so their x-coordinate is 8.
      - |
        No. The herbs are at (4, 5). Their x-coordinate is 4.
    answer: [2, 3]

  - slug: g5math-u07-check-q05
    type: numeric
    topic_code: "5.G.A.2"
    source: "IM K–5 Math Grade 5, Unit 7, Section A"
    points: 1
    stimulus: |
      Use the map of the community garden. Both axes are numbered from 0 to 10, and 1 unit on the grid stands for 1 meter. People walk only along the grid lines.
    prompt: |
      Rosa walks from the herbs to the tomatoes along the grid lines, taking the shortest way. How many meters does she walk?
    answer: { value: 4, tolerance: 0 }
    explanation: |
      The herbs are at (4, 5) and the tomatoes are at (1, 6). Across: 4 − 1 = 3 meters. Up: 6 − 5 = 1 meter. 3 + 1 = 4 meters.

  # ---- Stimulus set B: three corners of a square (5.G.A.2, 5.G.B.4)
  - slug: g5math-u07-check-q06
    type: multiple_choice
    topic_code: "5.G.A.2"
    source: "IM K–5 Math Grade 5, Unit 7, Section A"
    points: 1
    stimulus: |
      Points A(2, 1), B(6, 1) and C(6, 5) are three corners of a square ABCD.
    figure: figures/u07-three-corners.svg
    figure_alt: "A coordinate grid with the x-axis and the y-axis each numbered 0 to 8. Three points are plotted: A at (2, 1), B at (6, 1) and C at (6, 5)."
    prompt: |
      Where is the fourth corner, D?
    options:
      - "(5, 2)"
      - "(6, 6)"
      - "(1, 5)"
      - "(2, 5)"
    option_explanations:
      - |
        This switches the numbers. D must be straight above A, whose x-coordinate is 2, so 2 comes first.
      - |
        (6, 6) is just above C. The fourth corner is on the left side, above A.
      - |
        (1, 5) is one unit too far left. D is straight above A, so it shares A's x-coordinate, 2.
      - |
        Correct. D is straight above A (x-coordinate 2) and straight across from C (y-coordinate 5).
    answer: 3

  - slug: g5math-u07-check-q07
    type: numeric
    topic_code: "5.G.A.2"
    source: "IM K–5 Math Grade 5, Unit 7, Section A"
    points: 1
    stimulus: |
      Points A(2, 1), B(6, 1) and C(6, 5) are three corners of a square ABCD.
    prompt: |
      What is the perimeter of square ABCD, in units?
    answer: { value: 16, tolerance: 0 }
    explanation: |
      Side AB goes from (2, 1) to (6, 1): 6 − 2 = 4 units. A square has 4 equal sides, so the perimeter is 4 × 4 = 16 units.

  - slug: g5math-u07-check-q08
    type: multiple_choice
    topic_code: "5.G.B.4"
    source: "IM K–5 Math Grade 5, Unit 7, Section B"
    points: 1
    stimulus: |
      Points A(2, 1), B(6, 1) and C(6, 5) are three corners of a square ABCD.
    prompt: |
      Square ABCD belongs to many categories. Which one is the most general?
    options:
      - "Rectangles"
      - "Quadrilaterals"
      - "Rhombuses"
      - "Parallelograms"
    option_explanations:
      - |
        Rectangles are near the bottom of the hierarchy. Parallelograms and quadrilaterals both hold more shapes.
      - |
        Correct. Quadrilaterals is the top of the hierarchy: every parallelogram, rectangle, rhombus and square is one.
      - |
        Rhombuses are a subcategory of parallelograms, so they are not the most general category.
      - |
        Parallelograms are general, but they are a subcategory of quadrilaterals, which is more general still.
    answer: 1

  - slug: g5math-u07-check-q09
    type: true_false
    topic_code: "5.G.B.4"
    source: "IM K–5 Math Grade 5, Unit 7, Section B"
    points: 1
    prompt: |
      True or false: every square is a rhombus.
    answer: true
    explanation: |
      True. A rhombus is a quadrilateral with 4 sides of equal length. Every square has 4 equal sides, so every square is a rhombus (one with right angles).

  - slug: g5math-u07-check-q10
    type: multiple_choice
    topic_code: "5.G.B.4"
    source: "IM K–5 Math Grade 5, Unit 7, Section B"
    points: 1
    prompt: |
      Which word makes this sentence true? "A parallelogram is ____ a rectangle."
    options:
      - "always"
      - "never"
      - "sometimes"
      - "only when its sides are all equal"
    option_explanations:
      - |
        A parallelogram that leans over has no right angles, so it is not a rectangle. It is not always one.
      - |
        A parallelogram with 4 right angles is a rectangle, so it can be one.
      - |
        Correct. A parallelogram is a rectangle only when it has 4 right angles. Some are and some are not.
      - |
        Equal sides make a parallelogram a rhombus, not a rectangle. A rectangle needs 4 right angles.
    answer: 2

  - slug: g5math-u07-check-q11
    type: multiple_choice
    topic_code: "5.G.B.3"
    source: "IM K–5 Math Grade 5, Unit 7, Section B"
    points: 1
    prompt: |
      Which attribute does every rhombus have?
    options:
      - "4 sides of equal length"
      - "4 right angles"
      - "No parallel sides"
      - "Exactly 3 equal sides"
    option_explanations:
      - |
        Correct. Having 4 sides of equal length is what makes a quadrilateral a rhombus.
      - |
        Only some rhombuses, the squares, have 4 right angles. A rhombus can lean over.
      - |
        A rhombus is a parallelogram, so it always has 2 pairs of parallel sides.
      - |
        A rhombus has all 4 sides equal. A quadrilateral with only 3 equal sides is not a rhombus.
    answer: 0

  - slug: g5math-u07-check-q12
    type: multiple_choice
    topic_code: "5.G.B.4"
    source: "IM K–5 Math Grade 5, Unit 7, Section B"
    points: 1
    prompt: |
      Which statement about triangles is true?
    options:
      - "A right triangle is never isosceles."
      - "Every isosceles triangle is equilateral."
      - "A scalene triangle has 2 equal sides."
      - "Every equilateral triangle is isosceles."
    option_explanations:
      - |
        A right triangle can have two equal sides meeting at the right angle, like half of a square cut corner to corner.
      - |
        This has it backward. An isosceles triangle with sides 7, 7 and 3 cm is not equilateral.
      - |
        Scalene means no two sides are equal. A triangle with 2 equal sides is isosceles.
      - |
        Correct. Isosceles means at least 2 equal sides. An equilateral triangle has 3, so it is always isosceles.
    answer: 3

  - slug: g5math-u07-check-q13
    type: fill_blank
    topic_code: "5.G.A.1"
    source: "IM K–5 Math Grade 5, Unit 7, Section A"
    points: 1
    prompt: |
      On a coordinate grid, the horizontal number line that the first number of an ordered pair is measured along is called the ____.
    answer: ["x-axis", "the x-axis", "x axis", "the x axis", "xaxis"]
    explanation: |
      The x-axis is the horizontal number line. The first number, the x-coordinate, tells how far to move right along it.

  - slug: g5math-u07-check-q14
    type: multi_select
    topic_code: "5.G.B.3"
    source: "IM K–5 Math Grade 5, Unit 7, Section B"
    points: 2
    partial_credit: true
    prompt: |
      Which statements are always true? Select all that apply.
    options:
      - "Every rectangle is a parallelogram."
      - "Every rhombus is a square."
      - "Every square is a quadrilateral."
      - "Every parallelogram is a rhombus."
      - "Every rectangle has opposite sides of equal length."
    option_explanations:
      - |
        Yes. Rectangles are a subcategory of parallelograms: a rectangle has 2 pairs of parallel sides.
      - |
        No. A rhombus that leans over has no right angles, so it is not a square.
      - |
        Yes. A square has 4 sides, and every 4-sided closed shape with straight sides is a quadrilateral.
      - |
        No. A parallelogram with sides of 6 cm and 2 cm does not have 4 equal sides, so it is not a rhombus.
      - |
        Yes. Every parallelogram has opposite sides of equal length, and rectangles are parallelograms, so they have it too.
    answer: [0, 2, 4]

  - slug: g5math-u07-check-q15
    type: multiple_choice
    topic_code: "5.G.B.4"
    source: "IM K–5 Math Grade 5, Unit 7, Section B"
    points: 1
    prompt: |
      A quadrilateral has 4 sides of 6 cm each and no right angles. What is its most specific name?
    options:
      - "Square"
      - "Rhombus"
      - "Rectangle"
      - "Parallelogram"
    option_explanations:
      - |
        A square needs 4 right angles as well as 4 equal sides. This shape has no right angles.
      - |
        Correct. 4 equal sides make it a rhombus, and with no right angles it cannot go further down to square.
      - |
        A rectangle needs 4 right angles, and this shape has none.
      - |
        It is a parallelogram, but its 4 equal sides give it a more specific name.
    answer: 1

  # ---- Stimulus set C: graph of two patterns (5.OA.B.3)
  - slug: g5math-u07-check-q16
    type: multiple_choice
    topic_code: "5.OA.B.3"
    source: "IM K–5 Math Grade 5, Unit 7, Section C"
    points: 1
    stimulus: |
      The graph shows ordered pairs (Pattern A term, Pattern B term). Pattern A starts at 0 and adds 2. The x-axis goes from 0 to 10 and the y-axis from 0 to 6.
    figure: figures/u07-pattern-graph.svg
    figure_alt: "A coordinate grid with Pattern A term on the x-axis, numbered 0 to 10, and Pattern B term on the y-axis, numbered 0 to 6. Five points are plotted in a straight row from the origin: (0, 0), (2, 1), (4, 2), (6, 3) and (8, 4)."
    prompt: |
      Which rule makes Pattern B?
    options:
      - "Start at 0, add 1"
      - "Start at 0, add 2"
      - "Start at 1, add 1"
      - "Start at 0, add 4"
    option_explanations:
      - |
        Correct. The y-coordinates are 0, 1, 2, 3, 4: they start at 0 and go up by 1 each time.
      - |
        Adding 2 is Pattern A's rule, shown by the x-coordinates 0, 2, 4, 6, 8.
      - |
        The first point is (0, 0), so Pattern B starts at 0, not 1.
      - |
        The y-coordinates go up by 1 at each point, not 4. The 4 is the last y-coordinate shown.
    answer: 0

  - slug: g5math-u07-check-q17
    type: multiple_choice
    topic_code: "5.OA.B.3"
    source: "IM K–5 Math Grade 5, Unit 7, Section C"
    points: 1
    stimulus: |
      The graph shows ordered pairs (Pattern A term, Pattern B term). Pattern A starts at 0 and adds 2. The x-axis goes from 0 to 10 and the y-axis from 0 to 6.
    prompt: |
      How is each Pattern B term related to the matching Pattern A term?
    options:
      - "It is 2 times the Pattern A term."
      - "It is 2 less than the Pattern A term."
      - "It is half of the Pattern A term."
      - "It is 1 more than the Pattern A term."
    option_explanations:
      - |
        This has it backward. Pattern A's terms are bigger: 8 is 2 times 4, so A is 2 times B.
      - |
        This works only for (4, 2). For (8, 4) the gap is 4, and for (2, 1) it is 1.
      - |
        Correct. 2 and 1, 4 and 2, 6 and 3, 8 and 4: each Pattern B term is half of the Pattern A term.
      - |
        Every Pattern B term after the first is smaller than its Pattern A term, so it cannot be 1 more.
    answer: 2

  - slug: g5math-u07-check-q18
    type: numeric
    topic_code: "5.OA.B.3"
    source: "IM K–5 Math Grade 5, Unit 7, Section C"
    points: 1
    stimulus: |
      The graph shows ordered pairs (Pattern A term, Pattern B term). Pattern A starts at 0 and adds 2. The x-axis goes from 0 to 10 and the y-axis from 0 to 6.
    prompt: |
      If both patterns continue, the next point has an x-coordinate of 10. What is its y-coordinate?
    answer: { value: 5, tolerance: 0 }
    explanation: |
      Pattern B adds 1 each time, so after 4 comes 5. Also, each Pattern B term is half of its Pattern A term, and half of 10 is 5. The point is (10, 5).

  - slug: g5math-u07-check-q19
    type: numeric
    topic_code: "5.OA.B.3"
    source: "IM K–5 Math Grade 5, Unit 7, Section C"
    points: 1
    prompt: |
      A pattern starts at 0 and adds 7. What is its 6th term? (The 1st term is 0.)
    answer: { value: 35, tolerance: 0 }
    explanation: |
      The terms are 0, 7, 14, 21, 28, 35. The 6th term comes after 5 jumps of 7, and 5 × 7 = 35.

  - slug: g5math-u07-check-q20
    type: multiple_choice
    topic_code: "5.OA.B.3"
    source: "IM K–5 Math Grade 5, Unit 7, Section C"
    points: 1
    prompt: |
      Pattern A starts at 0 and adds 5. Pattern B starts at 0 and adds 15. Which ordered pair (Pattern A term, Pattern B term) comes from matching terms?
    options:
      - "(30, 10)"
      - "(10, 20)"
      - "(15, 30)"
      - "(10, 30)"
    option_explanations:
      - |
        This puts the Pattern B term first. Pattern A's term is the x-coordinate, so the pair is written (10, 30).
      - |
        10 is Pattern A's 3rd term, but Pattern B's 3rd term is 30, not 20. 20 is not in Pattern B at all.
      - |
        15 is Pattern A's 4th term, and the matching Pattern B term is 45. 30 matches Pattern A's 10.
      - |
        Correct. Pattern A: 0, 5, 10. Pattern B: 0, 15, 30. The 3rd terms are 10 and 30, so the pair is (10, 30).
    answer: 3

  - slug: g5math-u07-check-q21
    type: short_answer
    topic_code: "5.G.B.3"
    source: "IM K–5 Math Grade 5, Unit 7, Section B"
    points: 3
    prompt: |
      Jada says, "A quadrilateral with 4 equal sides must be a square."

      (a) Is Jada right?
      (b) Draw or describe a quadrilateral with 4 equal sides that is not a square. You may give its corners as ordered pairs.
      (c) What attribute must be added to a shape with 4 equal sides to make sure it is a square?
    answer: |
      (a) No. 4 equal sides make a shape a rhombus, but not every rhombus is a square.
      (b) A rhombus that leans over, like a diamond with corners at (4, 1), (6, 4), (4, 7) and (2, 4). All 4 sides are equal, but its corners are not right angles.
      (c) 4 right angles. A shape with 4 equal sides and 4 right angles is a square.
    explanation: |
      Three points.

      (a) 1 pt: says Jada is not right.

      (b) 1 pt: draws or describes a rhombus with no right angles (a leaning or diamond shape with 4 equal sides). Ordered pairs are not needed, but if given they must make 4 equal sides.

      (c) 1 pt: names right angles (4 right angles, or square corners).

  - slug: g5math-u07-check-q22
    type: multiple_choice
    topic_code: "5.G.A.1"
    source: "IM K–5 Math Grade 5, Unit 7, Section A"
    points: 1
    prompt: |
      Point M is on the x-axis, 7 units to the right of the origin. Which ordered pair names point M?
    options:
      - "(0, 7)"
      - "(7, 0)"
      - "(7, 7)"
      - "(7, 1)"
    option_explanations:
      - |
        (0, 7) is 7 units up, on the y-axis. Point M is to the right, on the x-axis.
      - |
        Correct. 7 to the right gives an x-coordinate of 7, and being on the x-axis means a y-coordinate of 0.
      - |
        (7, 7) is 7 right and 7 up, out in the grid. A point on the x-axis has not moved up at all.
      - |
        (7, 1) is 1 unit above the x-axis. A point on the x-axis has a y-coordinate of 0.
    answer: 1
