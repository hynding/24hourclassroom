week: 27
unit: 7
title: "Numerical Patterns and Their Graphs"
topics: ["5.OA.B.3"]
guide: guides/week-27.md
guide_description: |
  How to make two number patterns from two rules, line up their terms in a table, turn each pair of
  matching terms into an ordered pair, and graph the points. Also how to spot the relationship between
  the patterns, like "each term in Pattern B is 2 times the matching term in Pattern A".
flashcards_description: |
  19 cards on pattern rules, terms, building a table of two patterns, forming ordered pairs from
  matching terms, graphing them, reading relationships such as "3 times as much", and continuing a
  pattern past the edge of the graph.

flashcards:
  - front: Numerical pattern → what it is
    back: |
      A list of numbers made by following a rule, like "start at 0, add 4": 0, 4, 8, 12, 16, ...
    topic_code: "5.OA.B.3"
  - front: Term of a pattern → what it is
    back: |
      Each number in the pattern. In 0, 4, 8, 12, the third term is 8.
    topic_code: "5.OA.B.3"
  - front: Pattern rule → the two parts
    back: |
      Where to start and what to do each time. "Start at 0, add 5" gives 0, 5, 10, 15, 20, ...
    topic_code: "5.OA.B.3"
  - front: Start at 0, add 6 → the first five terms
    back: |
      0, 6, 12, 18, 24. Each term is 6 more than the one before.
    topic_code: "5.OA.B.3"
  - front: Matching terms → what they are
    back: |
      Terms in the same position in two patterns, like the 3rd term of Pattern A and the 3rd term of Pattern B.
    topic_code: "5.OA.B.3"
  - front: Two patterns in a table → how to set it up
    back: |
      Write Pattern A in one row and Pattern B in the row below, so each column holds a pair of matching terms.
    topic_code: "5.OA.B.3"
  - front: Ordered pair from two patterns → how to make one
    back: |
      Use the Pattern A term as the x-coordinate and the matching Pattern B term as the y-coordinate. 3rd terms 6 and 12 make (6, 12).
    topic_code: "5.OA.B.3"
  - front: Graphing two patterns → the steps
    back: |
      Make the table, form an ordered pair from each column, then plot each pair on a coordinate grid.
    topic_code: "5.OA.B.3"
  - front: Add 2 and add 6, both from 0 → the relationship
    back: |
      Each Pattern B term is 3 times the matching Pattern A term: 0 and 0, 2 and 6, 4 and 12, 6 and 18.
    topic_code: "5.OA.B.3"
  - front: Add 8 and add 4, both from 0 → the relationship
    back: |
      Each Pattern B term is half of the matching Pattern A term: 8 and 4, 16 and 8, 24 and 12.
    topic_code: "5.OA.B.3"
  - front: Why the times relationship works → the reason
    back: |
      Both patterns take the same number of steps. If B adds 3 times as much at every step, it ends up 3 times as big every time.
    topic_code: "5.OA.B.3"
  - front: '"Times as much" vs "more than" → which fits two patterns from 0'
    back: |
      "Times as much." With add 3 and add 6, the gap grows (0, 3, 6, 9...), but B is always 2 times A.
    topic_code: "5.OA.B.3"
  - front: Points from two patterns starting at 0 → what the graph looks like
    back: |
      The points line up in a straight row that starts at the origin and climbs at a steady slant.
    topic_code: "5.OA.B.3"
  - front: Steeper row of points → what it means
    back: |
      Pattern B grows faster compared with Pattern A. Points for "B is 4 times A" climb more steeply than points for "B is 2 times A".
    topic_code: "5.OA.B.3"
  - front: Continuing a pattern graph → how to find the next point
    back: |
      Apply each rule once more. If A adds 1 and B adds 3, the point after (4, 12) is (5, 15).
    topic_code: "5.OA.B.3"
  - front: Missing term in a table → how to find it
    back: |
      Use the rule from the term before it, or use the relationship with the matching term. If B is 2 times A and A is 9, B is 18.
    topic_code: "5.OA.B.3"
  - front: Two savings patterns on one graph → how to compare them
    back: |
      Plot each person's total for each day with its own marker. The higher point on a day has saved more; the steeper line saves faster.
    topic_code: "5.OA.B.3"
  - front: Order of an ordered pair from patterns → which goes first
    back: |
      The pattern you put on the x-axis goes first. Swapping them flips the point: (2, 6) and (6, 2) are different points.
    topic_code: "5.OA.B.3"
  - front: Checking a pattern table → one quick test
    back: |
      Look along each row: the jumps should all be the same. Then look down each column: the relationship should be the same in every column.
    topic_code: "5.OA.B.3"

quiz:
  description: |
    15 questions · about 25 minutes · making patterns from rules, tables of two patterns, forming and
    graphing ordered pairs, and describing how two patterns are related, plus review of the shape
    hierarchy, distances on the grid, brackets in expressions and volume. Multiple choice, select-all,
    true/false and number answers are graded at once; the fill-in word is matched automatically; the
    short answer is checked by your teacher.
  questions:
    - slug: g5math-w27-q01
      type: numeric
      topic_code: "5.OA.B.3"
      source: "IM K–5 Math Grade 5, Unit 7, Section C"
      points: 1
      stimulus: |
        Use the table of two patterns. Pattern A starts at 0 and adds 3. Pattern B starts at 0 and adds 6.
      figure: figures/w27-two-patterns-table.svg
      figure_alt: "A table titled Two Patterns with three rows. Term number: 1, 2, 3, 4, 5. Pattern A: 0, 3, 6, 9, 12. Pattern B: 0, 6, 12, a question mark, 24. The question mark is the 4th term of Pattern B."
      prompt: |
        What number belongs where the question mark is?
      answer: { value: 18, tolerance: 0 }
      explanation: |
        Pattern B adds 6 each time: 0, 6, 12, 18, 24. The 4th term is 12 + 6 = 18. It also checks with the 5th term, since 18 + 6 = 24.

    - slug: g5math-w27-q02
      type: multiple_choice
      topic_code: "5.OA.B.3"
      source: "IM K–5 Math Grade 5, Unit 7, Section C"
      points: 1
      stimulus: |
        Use the table of two patterns. Pattern A starts at 0 and adds 3. Pattern B starts at 0 and adds 6.
      prompt: |
        Using the Pattern A term as x and the matching Pattern B term as y, which ordered pair comes from the 4th terms?
      options:
        - "(18, 9)"
        - "(4, 18)"
        - "(9, 12)"
        - "(9, 18)"
      option_explanations:
        - |
          This puts the Pattern B term first. Pattern A gives the x-coordinate, so 9 comes first.
        - |
          4 is the term number, not a term of Pattern A. The 4th term of Pattern A is 9.
        - |
          12 is Pattern B's 3rd term. The matching 4th term of Pattern B is 18.
        - |
          Correct. The 4th term of Pattern A is 9 and the 4th term of Pattern B is 18, so the pair is (9, 18).
      answer: 3

    - slug: g5math-w27-q03
      type: multiple_choice
      topic_code: "5.OA.B.3"
      source: "IM K–5 Math Grade 5, Unit 7, Section C"
      points: 1
      stimulus: |
        Use the table of two patterns. Pattern A starts at 0 and adds 3. Pattern B starts at 0 and adds 6.
      prompt: |
        How does each term in Pattern B compare with the matching term in Pattern A?
      options:
        - "It is 2 times the Pattern A term."
        - "It is 3 more than the Pattern A term."
        - "It is half of the Pattern A term."
        - "It is 6 times the Pattern A term."
      option_explanations:
        - |
          Correct. 3 and 6, 6 and 12, 9 and 18, 12 and 24: each Pattern B term is double the Pattern A term.
        - |
          This works for 3 and 6 only. For 6 and 12 the gap is 6, and for 12 and 24 it is 12, so "3 more" does not hold.
        - |
          This has it backward. Pattern B's terms are bigger, so Pattern A is half of Pattern B, not the other way.
        - |
          6 is what Pattern B adds each time. 6 times 3 is 18, but the matching term is 6, so B is 2 times A.
      answer: 0

    - slug: g5math-w27-q04
      type: multiple_choice
      topic_code: "5.OA.B.3"
      source: "IM K–5 Math Grade 5, Unit 7, Section C"
      points: 1
      stimulus: |
        The graph shows ordered pairs (Pattern A term, Pattern B term). Pattern A starts at 0 and adds 1. The x-axis goes from 0 to 6 and the y-axis from 0 to 15.
      figure: figures/w27-pattern-graph.svg
      figure_alt: "A coordinate grid with Pattern A term on the x-axis, numbered 0 to 6, and Pattern B term on the y-axis, numbered 0 to 15. Five points are plotted in a straight row from the origin: (0, 0), (1, 3), (2, 6), (3, 9) and (4, 12)."
      prompt: |
        Which rule makes Pattern B?
      options:
        - "Start at 0, add 1"
        - "Start at 3, add 3"
        - "Start at 0, add 3"
        - "Start at 0, add 4"
      option_explanations:
        - |
          Adding 1 is Pattern A's rule. The y-coordinates go 0, 3, 6, 9, 12, which jump by 3.
        - |
          The first point is (0, 0), so Pattern B starts at 0, not 3.
        - |
          Correct. The y-coordinates are 0, 3, 6, 9, 12: they start at 0 and go up by 3 each time.
        - |
          4 is the x-coordinate of the last point. The y-coordinates go up by 3 each time, not 4.
      answer: 2

    - slug: g5math-w27-q05
      type: numeric
      topic_code: "5.OA.B.3"
      source: "IM K–5 Math Grade 5, Unit 7, Section C"
      points: 1
      stimulus: |
        The graph shows ordered pairs (Pattern A term, Pattern B term). Pattern A starts at 0 and adds 1. The x-axis goes from 0 to 6 and the y-axis from 0 to 15.
      prompt: |
        If both patterns keep going, the next point has an x-coordinate of 5. What is its y-coordinate?
      answer: { value: 15, tolerance: 0 }
      explanation: |
        Pattern B adds 3 each time, so after 12 comes 15. Also, each y-coordinate is 3 times its x-coordinate, and 3 × 5 = 15. The next point is (5, 15).

    - slug: g5math-w27-q06
      type: multi_select
      topic_code: "5.OA.B.3"
      source: "IM K–5 Math Grade 5, Unit 7, Section C"
      points: 2
      partial_credit: true
      prompt: |
        Pattern C starts at 0 and adds 4. Which numbers are terms of Pattern C? Select all that apply.
      options:
        - "8"
        - "14"
        - "20"
        - "30"
        - "36"
      option_explanations:
        - |
          Yes. The pattern goes 0, 4, 8, so 8 is the third term, after 2 jumps of 4.
        - |
          No. The pattern goes 0, 4, 8, 12, 16. It jumps from 12 to 16 and skips 14.
        - |
          Yes. 0, 4, 8, 12, 16, 20: 20 is the sixth term, because 5 jumps of 4 make 20.
        - |
          No. The pattern goes ..., 24, 28, 32. 30 is not reached, because 30 is not a multiple of 4.
        - |
          Yes. 9 jumps of 4 from 0 make 36, so 36 is a term.
      answer: [0, 2, 4]

    - slug: g5math-w27-q07
      type: true_false
      topic_code: "5.OA.B.3"
      source: "IM K–5 Math Grade 5, Unit 7, Section C"
      points: 1
      prompt: |
        True or false: Pattern A starts at 0 and adds 5, and Pattern B starts at 0 and adds 10. So each term of Pattern B is 5 more than the matching term of Pattern A.
      answer: false
      explanation: |
        False. The patterns are 0, 5, 10, 15 and 0, 10, 20, 30. The gaps are 0, 5, 10, 15, so they grow. What stays the same is that each Pattern B term is 2 times the matching Pattern A term.

    - slug: g5math-w27-q08
      type: fill_blank
      topic_code: "5.OA.B.3"
      source: "IM K–5 Math Grade 5, Unit 7, Section C"
      points: 1
      prompt: |
        In the pattern 0, 7, 14, 21, each number, such as 14, is called a ____ of the pattern.
      answer: ["term", "terms", "a term"]
      explanation: |
        Each number in a pattern is a term. In 0, 7, 14, 21, the first term is 0 and the third term is 14.

    - slug: g5math-w27-q09
      type: multiple_choice
      topic_code: "5.OA.B.3"
      source: "IM K–5 Math Grade 5, Unit 7, Section C"
      points: 1
      stimulus: |
        Use the graph of stickers collected. Amir (circles, solid line) starts with 0 and collects 2 stickers each day. Bea (squares, dashed line) starts with 0 and collects 4 stickers each day.
      figure: figures/w27-stickers.svg
      figure_alt: "A graph with Day on the x-axis, numbered 0 to 5, and Stickers on the y-axis, numbered 0 to 20 by 2s. Amir's points, circles joined by a solid line, are at (0, 0), (1, 2), (2, 4), (3, 6), (4, 8) and (5, 10). Bea's points, squares joined by a dashed line, are at (0, 0), (1, 4), (2, 8), (3, 12), (4, 16) and (5, 20). Both start at the origin; Bea's line is steeper."
      prompt: |
        On day 3, how many more stickers does Bea have than Amir?
      options:
        - "2 more"
        - "6 more"
        - "12 more"
        - "3 more"
      option_explanations:
        - |
          2 is how many more Bea collects each day. After 3 days that difference has added up 3 times.
        - |
          Correct. On day 3 Bea has 12 stickers and Amir has 6. 12 − 6 = 6 more.
        - |
          12 is Bea's total on day 3. The question asks how many more she has than Amir, so subtract his 6.
        - |
          3 is the day number, the x-coordinate. Compare the y-coordinates: 12 and 6.
      answer: 1

    - slug: g5math-w27-q10
      type: multiple_choice
      topic_code: "5.OA.B.3"
      source: "IM K–5 Math Grade 5, Unit 7, Section C"
      points: 1
      stimulus: |
        Use the graph of stickers collected. Amir (circles, solid line) starts with 0 and collects 2 stickers each day. Bea (squares, dashed line) starts with 0 and collects 4 stickers each day.
      prompt: |
        Which statement about Amir's and Bea's totals is true?
      options:
        - "Bea always has 2 more stickers than Amir."
        - "Both totals grow by 4 each day."
        - "Amir catches up with Bea on day 5."
        - "Bea's total is always 2 times Amir's total."
      option_explanations:
        - |
          The difference grows: 2 on day 1, 4 on day 2, 6 on day 3. It does not stay at 2.
        - |
          Only Bea's total grows by 4 each day. Amir's grows by 2, which is why his line is less steep.
        - |
          On day 5 Bea has 20 and Amir has 10. The lines move farther apart, so Amir never catches up.
        - |
          Correct. 4 and 2, 8 and 4, 12 and 6, 16 and 8, 20 and 10: Bea's total is double Amir's every day.
      answer: 3

    - slug: g5math-w27-q11
      type: multiple_choice
      topic_code: "5.G.B.4"
      source: "IM K–5 Math Grade 5, Unit 7, Section B"
      points: 1
      prompt: |
        Review: which shape is always a parallelogram?
      options:
        - "Any quadrilateral"
        - "Any rhombus"
        - "Any isosceles triangle"
        - "Any shape with one right angle"
      option_explanations:
        - |
          Some quadrilaterals have no parallel sides at all, so not every quadrilateral is a parallelogram.
        - |
          Correct. Rhombuses are a subcategory of parallelograms: every rhombus has 2 pairs of parallel sides.
        - |
          A triangle has only 3 sides. A parallelogram must have 4 sides, so a triangle can never be one.
        - |
          A right triangle has one right angle, and so do some quadrilaterals with no parallel sides. One right angle is not enough.
      answer: 1

    - slug: g5math-w27-q12
      type: numeric
      topic_code: "5.G.A.2"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      prompt: |
        Review: on a map grid, a tree is at (3, 8) and a bench is at (3, 2). How many units apart are they along the grid line?
      answer: { value: 6, tolerance: 0 }
      explanation: |
        Both points have x-coordinate 3, so they are on one vertical line. Subtract the y-coordinates: 8 − 2 = 6 units.

    - slug: g5math-w27-q13
      type: multiple_choice
      topic_code: "5.OA.A.1"
      source: "IM K–5 Math Grade 5, Unit 4, Section C"
      points: 1
      prompt: |
        Review: what is the value of 3 × [20 − (4 + 6)]?
      options:
        - "50"
        - "62"
        - "30"
        - "10"
      option_explanations:
        - |
          This works left to right without the brackets: 3 × 20 = 60, then 60 − 4 − 6 = 50. Do the inside first.
        - |
          This multiplies first and then subtracts only the 4: 60 − 4 + 6 = 62. The parentheses say to add 4 + 6 first, then work inside the brackets.
        - |
          Correct. 4 + 6 = 10. Then [20 − 10] = 10. Then 3 × 10 = 30.
        - |
          10 is the value inside the brackets, 20 − 10. It still has to be multiplied by 3.
      answer: 2

    - slug: g5math-w27-q14
      type: numeric
      topic_code: "5.MD.C.5"
      source: "IM K–5 Math Grade 5, Unit 1, Section B"
      points: 1
      prompt: |
        Review: a box shaped like a rectangular prism is 6 cm long, 4 cm wide and 5 cm tall. What is its volume, in cubic centimeters?
      answer: { value: 120, tolerance: 0 }
      explanation: |
        Volume = length × width × height = 6 × 4 × 5 = 24 × 5 = 120 cubic centimeters.

    - slug: g5math-w27-q15
      type: short_answer
      topic_code: "5.OA.B.3"
      source: "IM K–5 Math Grade 5, Unit 7, Section C"
      points: 2
      prompt: |
        Pattern A starts at 0 and adds 4. Pattern B starts at 0 and adds 8.

        (a) Write the first 5 terms of each pattern, and make 5 ordered pairs (Pattern A term, Pattern B term).
        (b) Describe how each Pattern B term is related to the matching Pattern A term, and explain why.
      answer: |
        (a) Pattern A: 0, 4, 8, 12, 16. Pattern B: 0, 8, 16, 24, 32. Ordered pairs: (0, 0), (4, 8), (8, 16), (12, 24), (16, 32).
        (b) Each Pattern B term is 2 times the matching Pattern A term. Both patterns start at 0 and take the same number of steps, and Pattern B adds 8 each step, which is 2 times the 4 that Pattern A adds.
      explanation: |
        Two points.

        (a) 1 pt: both lists of terms correct and the 5 ordered pairs formed in the right order (A first).

        (b) 1 pt: says B is 2 times (double) A, with a reason (B adds twice as much each step, or the pairs show it).
