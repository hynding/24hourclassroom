week: 26
unit: 7
title: "The Hierarchy of Shapes"
topics: ["5.G.B.3", "5.G.B.4"]
guide: guides/week-26.md
guide_description: |
  How shapes are sorted into categories and subcategories: every square is a rectangle and a rhombus,
  every rectangle and rhombus is a parallelogram, and every parallelogram is a quadrilateral. A shape has
  every attribute of each category it belongs to. The same idea works for triangles: every equilateral
  triangle is isosceles, and a right triangle can be isosceles or scalene.
flashcards_description: |
  20 cards on attributes, categories and subcategories, the quadrilateral hierarchy diagram, what
  parallelograms, rectangles, rhombuses and squares must have, "always, sometimes or never" statements,
  and sorting triangles by their sides and angles.

flashcards:
  - front: Attribute of a shape → what it is
    back: |
      A feature you can check, like the number of sides, equal sides, parallel sides or right angles. Color, size and how a shape is turned are not attributes that change its name.
    topic_code: "5.G.B.3"
  - front: Category of shapes → what it is
    back: |
      A group of shapes that all share certain attributes. "Parallelograms" is a category: every shape in it has 2 pairs of parallel sides.
    topic_code: "5.G.B.4"
  - front: Subcategory → what it is
    back: |
      A smaller group inside a category. Rectangles are a subcategory of parallelograms: every rectangle is a parallelogram, with right angles added.
    topic_code: "5.G.B.4"
  - front: Hierarchy of shapes → what it shows
    back: |
      Categories arranged from most general at the top to most specific at the bottom. Each shape below an arrow is a special kind of the shape above it.
    topic_code: "5.G.B.4"
  - front: Hierarchy rule → what passes down
    back: |
      Every attribute of a category passes down to all its subcategories. If all parallelograms have opposite sides parallel, then so do all rectangles, rhombuses and squares.
    topic_code: "5.G.B.3"
  - front: Quadrilateral → what it must have
    back: |
      4 straight sides and 4 angles, closed up with no gaps. That is all. It is the top of the quadrilateral hierarchy.
    topic_code: "5.G.B.4"
  - front: Parallelogram → what it must have
    back: |
      It is a quadrilateral with 2 pairs of parallel sides. Its opposite sides are also equal in length.
    topic_code: "5.G.B.3"
  - front: Rectangle → what it must have
    back: |
      It is a parallelogram with 4 right angles. So it also has 2 pairs of parallel sides and opposite sides of equal length.
    topic_code: "5.G.B.3"
  - front: Rhombus → what it must have
    back: |
      It is a parallelogram with 4 sides of equal length. Its angles may or may not be right angles.
    topic_code: "5.G.B.3"
  - front: Square → what it must have
    back: |
      4 equal sides and 4 right angles. That makes it a rhombus and a rectangle at the same time, and so a parallelogram and a quadrilateral too.
    topic_code: "5.G.B.3"
  - front: Square → every name that fits
    back: |
      Square, rectangle, rhombus, parallelogram and quadrilateral. Five names, from most specific to most general.
    topic_code: "5.G.B.4"
  - front: Rectangle → always a square?
    back: |
      Sometimes. A rectangle is a square only when its 4 sides are equal. A long, thin rectangle is not a square.
    topic_code: "5.G.B.4"
  - front: Rhombus → always a rectangle?
    back: |
      Sometimes. A rhombus is a rectangle only when its angles are right angles, and then it is a square.
    topic_code: "5.G.B.4"
  - front: Parallelogram → always a quadrilateral?
    back: |
      Always. Every parallelogram has 4 sides, so it is always a quadrilateral.
    topic_code: "5.G.B.4"
  - front: Quadrilateral → always a parallelogram?
    back: |
      Sometimes. Many quadrilaterals have sides that are not parallel at all. Those are quadrilaterals but not parallelograms.
    topic_code: "5.G.B.4"
  - front: Most specific name → how to choose it
    back: |
      Go as far down the hierarchy as the attributes allow. 4 equal sides but no right angles: rhombus is the most specific name.
    topic_code: "5.G.B.4"
  - front: Equilateral triangle → is it isosceles?
    back: |
      Yes, always. Isosceles means at least 2 equal sides, and an equilateral triangle has 3. Equilateral triangles are a subcategory of isosceles triangles.
    topic_code: "5.G.B.4"
  - front: Right triangle → isosceles or scalene?
    back: |
      It can be either. Legs of 4 cm and 4 cm make a right isosceles triangle. Sides of 3, 4 and 5 cm make a right scalene triangle.
    topic_code: "5.G.B.4"
  - front: Scalene triangle → can it be isosceles?
    back: |
      Never. Scalene means no two sides are equal, and isosceles needs at least 2 equal sides.
    topic_code: "5.G.B.4"
  - front: Shape names → which direction the "is a" works
    back: |
      Down the hierarchy it is always true: every square is a rectangle. Up it is only sometimes true: some rectangles are squares.
    topic_code: "5.G.B.4"

quiz:
  description: |
    15 questions · about 25 minutes · the quadrilateral hierarchy, attributes that pass from a category to
    its subcategories, "always, sometimes or never" statements and sorting triangles, plus review of
    coordinates, distances on the grid, multi-digit multiplication and area with mixed numbers. Multiple
    choice, select-all, true/false and number answers are graded at once; the fill-in word is matched
    automatically; the short answer is checked by your teacher.
  questions:
    - slug: g5math-w26-q01
      type: multiple_choice
      topic_code: "5.G.B.4"
      source: "IM K–5 Math Grade 5, Unit 7, Section B"
      points: 1
      stimulus: |
        Use the hierarchy diagram. Each shape name below an arrow is a special kind of the shape name above it.
      figure: figures/w26-hierarchy.svg
      figure_alt: "A hierarchy diagram of five boxes joined by arrows pointing down. Quadrilaterals is at the top, with an arrow down to Parallelograms. From Parallelograms, two arrows go down, one to Rectangles and one to Rhombuses. From Rectangles and from Rhombuses, one arrow each goes down to Squares at the bottom."
      prompt: |
        According to the diagram, which shape is always a rhombus?
      options:
        - "A rectangle"
        - "A parallelogram"
        - "A quadrilateral"
        - "A square"
      option_explanations:
        - |
          Rectangles are on a different branch from rhombuses. A long, thin rectangle does not have 4 equal sides.
        - |
          Parallelograms are above rhombuses in the diagram. Only some parallelograms are rhombuses.
        - |
          Quadrilaterals are at the very top, the most general category. Most quadrilaterals are not rhombuses.
        - |
          Correct. Squares are below Rhombuses, with an arrow from Rhombuses to Squares, so every square is a rhombus.
      answer: 3

    - slug: g5math-w26-q02
      type: multi_select
      topic_code: "5.G.B.3"
      source: "IM K–5 Math Grade 5, Unit 7, Section B"
      points: 2
      partial_credit: true
      stimulus: |
        Use the hierarchy diagram. Each shape name below an arrow is a special kind of the shape name above it.
      prompt: |
        A square has every attribute of which categories? Select all that apply.
      options:
        - "Rectangles"
        - "Rhombuses"
        - "Parallelograms"
        - "Quadrilaterals"
        - "Triangles"
      option_explanations:
        - |
          Yes. There is an arrow from Rectangles down to Squares, so a square has 4 right angles like every rectangle.
        - |
          Yes. There is an arrow from Rhombuses down to Squares, so a square has 4 equal sides like every rhombus.
        - |
          Yes. Squares are below Parallelograms, through rectangles and rhombuses, so a square has 2 pairs of parallel sides.
        - |
          Yes. Quadrilaterals is at the top, so every shape in the diagram, squares included, has 4 sides.
        - |
          No. A triangle has 3 sides and a square has 4, so a square does not have the attributes of a triangle.
      answer: [0, 1, 2, 3]

    - slug: g5math-w26-q03
      type: multiple_choice
      topic_code: "5.G.B.3"
      source: "IM K–5 Math Grade 5, Unit 7, Section B"
      points: 1
      prompt: |
        All rectangles have 4 right angles. Every square is a rectangle. What must be true?
      options:
        - "Every square has 4 right angles."
        - "Every rectangle has 4 equal sides."
        - "A square has 2 long sides and 2 short sides."
        - "Some squares have no right angles."
      option_explanations:
        - |
          Correct. A square belongs to the rectangle category, so it has every attribute of a rectangle, including 4 right angles.
        - |
          The facts only pass down, from rectangles to squares. Many rectangles have two long sides and two short sides.
        - |
          A square's sides are all equal. A rectangle needs opposite sides equal, and 4 equal sides fits that too.
        - |
          Every square is a rectangle, and every rectangle has 4 right angles, so no square can be missing them.
      answer: 0

    - slug: g5math-w26-q04
      type: true_false
      topic_code: "5.G.B.4"
      source: "IM K–5 Math Grade 5, Unit 7, Section B"
      points: 1
      prompt: |
        True or false: every rectangle is a rhombus.
      answer: false
      explanation: |
        False. A rhombus needs 4 sides of equal length. A rectangle 9 cm long and 2 cm wide has 4 right angles but sides that are not all equal, so it is not a rhombus. Only a rectangle with 4 equal sides, a square, is also a rhombus.

    - slug: g5math-w26-q05
      type: multiple_choice
      topic_code: "5.G.B.4"
      source: "IM K–5 Math Grade 5, Unit 7, Section B"
      points: 1
      stimulus: |
        Use the four triangles. Each side is labeled with its length, and a small square in a corner marks a right angle.
      figure: figures/w26-four-triangles.svg
      figure_alt: "Four triangles in a row. Triangle 1 has three sides of 5 cm. Triangle 2 has a 4 cm bottom and two 6 cm sides. Triangle 3 has a right angle mark between a 4 cm bottom and a 3 cm upright side, and its slanted side is 5 cm. Triangle 4 has a right angle mark between a 4 cm bottom and a 4 cm upright side; its slanted side is not labeled."
      prompt: |
        Which triangle is both a right triangle and an isosceles triangle?
      options:
        - "Triangle 1"
        - "Triangle 2"
        - "Triangle 4"
        - "Triangle 3"
      option_explanations:
        - |
          Triangle 1 is isosceles, since all 3 sides are equal, but it has no right angle. All its angles are acute.
        - |
          Triangle 2 has two equal 6 cm sides, so it is isosceles, but it has no right angle mark.
        - |
          Correct. Triangle 4 has a right angle, and its two sides of 4 cm are equal, so it is right and isosceles.
        - |
          Triangle 3 has a right angle, but its sides are 3, 4 and 5 cm, all different, so it is scalene.
      answer: 2

    - slug: g5math-w26-q06
      type: multi_select
      topic_code: "5.G.B.4"
      source: "IM K–5 Math Grade 5, Unit 7, Section B"
      points: 2
      partial_credit: true
      stimulus: |
        Use the four triangles. Each side is labeled with its length, and a small square in a corner marks a right angle.
      prompt: |
        Which triangles are isosceles? Select all that apply.
      options:
        - "Triangle 1"
        - "Triangle 2"
        - "Triangle 3"
        - "Triangle 4"
      option_explanations:
        - |
          Yes. Isosceles means at least 2 equal sides. Triangle 1 has 3 equal sides, so it is equilateral and isosceles.
        - |
          Yes. Triangle 2 has two sides of 6 cm, so it has at least 2 equal sides.
        - |
          No. Triangle 3's sides are 3 cm, 4 cm and 5 cm. No two are equal, so it is scalene.
        - |
          Yes. Triangle 4's two sides that meet at the right angle are both 4 cm long.
      answer: [0, 1, 3]

    - slug: g5math-w26-q07
      type: multiple_choice
      topic_code: "5.G.B.4"
      source: "IM K–5 Math Grade 5, Unit 7, Section B"
      points: 1
      stimulus: |
        Use the quadrilateral PQRS on the coordinate grid: P(1, 2), Q(6, 2), R(8, 4) and S(3, 4).
      figure: figures/w26-shape-pqrs.svg
      figure_alt: "A coordinate grid with the x-axis and the y-axis each numbered 0 to 8. A quadrilateral joins P at (1, 2), Q at (6, 2), R at (8, 4) and S at (3, 4). Sides PQ and SR are level, each 5 units long. Sides QR and PS both slant up to the right by the same amount, 2 right and 2 up, so they are much shorter than 5 units. The shape has no right angles."
      prompt: |
        What is the most specific name for PQRS? Use the coordinates, not just how the shape looks.
      options:
        - "Square"
        - "Parallelogram"
        - "Rectangle"
        - "Rhombus"
      option_explanations:
        - |
          A square needs right angles and 4 equal sides. QR and PS slant (they go 2 right as they go 2 up), so they do not meet the level sides at right angles.
        - |
          Correct. PQ and SR are both level, and QR and PS both go 2 right and 2 up, so it has 2 pairs of parallel sides. The slanted sides are not straight up and down, so there are no right angles, and the sides are not all equal, so it goes no further down.
        - |
          A rectangle needs 4 right angles. To meet the level side PQ at a right angle, side QR would have to go straight up, but it also goes 2 to the right.
        - |
          A rhombus needs 4 equal sides. PQ is 6 − 1 = 5 units. Walking from Q to R along grid lines takes only 2 + 2 = 4 units, and the straight slanted side QR is even shorter, so it cannot be 5 units.
      answer: 1

    - slug: g5math-w26-q08
      type: numeric
      topic_code: "5.G.A.2"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      stimulus: |
        Use the quadrilateral PQRS on the coordinate grid: P(1, 2), Q(6, 2), R(8, 4) and S(3, 4).
      prompt: |
        Review: how many units long is side SR?
      answer: { value: 5, tolerance: 0 }
      explanation: |
        S is at (3, 4) and R is at (8, 4). They share the y-coordinate 4, so subtract the x-coordinates: 8 − 3 = 5 units.

    - slug: g5math-w26-q09
      type: fill_blank
      topic_code: "5.G.B.3"
      source: "IM K–5 Math Grade 5, Unit 7, Section B"
      points: 1
      prompt: |
        A feature that every shape in a category has, like having 4 right angles or 2 pairs of parallel sides, is called an ____ of that category.
      answer: ["attribute", "attributes", "an attribute", "property", "a property", "properties"]
      explanation: |
        An attribute is a feature you can check, like side lengths, parallel sides or right angles. Every attribute of a category belongs to all of its subcategories too.

    - slug: g5math-w26-q10
      type: multiple_choice
      topic_code: "5.G.B.4"
      source: "IM K–5 Math Grade 5, Unit 7, Section B"
      points: 1
      prompt: |
        Fill in the sentence: "A rhombus is ____ a square."
      options:
        - "always"
        - "never"
        - "sometimes"
        - "only when it has no right angles"
      option_explanations:
        - |
          A rhombus that leans over has 4 equal sides but no right angles, so it is not a square. It is not always one.
        - |
          A rhombus with right angles has 4 equal sides and 4 right angles, which is a square. So it can be one.
        - |
          Correct. A rhombus is a square only when its angles are right angles. Some rhombuses are squares and some are not.
        - |
          This has it backward. A rhombus with no right angles is not a square. It needs right angles to be one.
      answer: 2

    - slug: g5math-w26-q11
      type: multiple_choice
      topic_code: "5.G.A.1"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      prompt: |
        Review: which ordered pair names the origin of a coordinate grid?
      options:
        - "(1, 1)"
        - "(0, 0)"
        - "(0, 1)"
        - "(1, 0)"
      option_explanations:
        - |
          (1, 1) is 1 unit right and 1 unit up. The origin is where the axes cross, before any moves.
        - |
          Correct. The origin is where the x-axis and y-axis cross. You have not moved right or up, so it is (0, 0).
        - |
          (0, 1) is on the y-axis, 1 unit above the origin. The origin itself has a y-coordinate of 0.
        - |
          (1, 0) is on the x-axis, 1 unit right of the origin. The origin itself has an x-coordinate of 0.
      answer: 1

    - slug: g5math-w26-q12
      type: numeric
      topic_code: "5.NBT.B.5"
      source: "IM K–5 Math Grade 5, Unit 4, Section A"
      points: 1
      prompt: |
        Review: a tile floor has 47 rows with 26 square tiles in each row. How many tiles are there? (Type the digits without a comma.)
      answer: { value: 1222, tolerance: 0 }
      explanation: |
        47 × 26 = 47 × 20 + 47 × 6 = 940 + 282 = 1,222 tiles.

    - slug: g5math-w26-q13
      type: multiple_choice
      topic_code: "5.NF.B.6"
      source: "IM K–5 Math Grade 5, Unit 2, Section C"
      points: 1
      prompt: |
        Review: a rectangular flower bed is 2 1/2 meters long and 3 meters wide. What is its area?
      options:
        - "6 1/2 square meters"
        - "5 1/2 square meters"
        - "6 square meters"
        - "7 1/2 square meters"
      option_explanations:
        - |
          This multiplies the 2 by 3 but adds the 1/2 on only once. The 1/2 must be multiplied by 3 too.
        - |
          5 1/2 is 2 1/2 + 3. Area comes from multiplying the length by the width, not adding them.
        - |
          This multiplies only the whole numbers, 2 × 3. The extra 1/2 meter of length adds 1 1/2 square meters more.
        - |
          Correct. 2 1/2 × 3 = 2 × 3 + 1/2 × 3 = 6 + 1 1/2 = 7 1/2 square meters.
      answer: 3

    - slug: g5math-w26-q14
      type: multiple_choice
      topic_code: "5.G.B.4"
      source: "IM K–5 Math Grade 5, Unit 7, Section B"
      points: 1
      prompt: |
        A quadrilateral has 2 pairs of parallel sides and 4 right angles. Its sides are 8 cm, 3 cm, 8 cm and 3 cm. What is its most specific name?
      options:
        - "Rectangle"
        - "Square"
        - "Rhombus"
        - "Parallelogram"
      option_explanations:
        - |
          Correct. It has 4 right angles, so it is a rectangle. Its sides are not all equal, so it is not a square.
        - |
          A square needs 4 equal sides. This shape has sides of 8 cm and 3 cm.
        - |
          A rhombus needs 4 equal sides. The 8 cm sides are much longer than the 3 cm sides.
        - |
          It is a parallelogram, but that is not the most specific name. Its 4 right angles make it a rectangle.
      answer: 0

    - slug: g5math-w26-q15
      type: short_answer
      topic_code: "5.G.B.3"
      source: "IM K–5 Math Grade 5, Unit 7, Section B"
      points: 2
      prompt: |
        Lena says, "A square is not a rectangle, because a rectangle has 2 long sides and 2 short sides."

        (a) Is Lena right? Explain.
        (b) List the attributes every rectangle must have, and tell whether a square has each one.
      answer: |
        (a) No. A rectangle does not have to have long and short sides. It only needs 4 right angles (and so 2 pairs of parallel sides, with opposite sides equal). A square has all of those, so a square is a rectangle.
        (b) 4 sides: a square has 4. 2 pairs of parallel sides: a square has them. Opposite sides equal: in a square all 4 sides are equal, so opposite sides are equal. 4 right angles: a square has 4.
      explanation: |
        Two points.

        (a) 1 pt: says Lena is not right and explains that a rectangle is defined by its 4 right angles, not by having long and short sides.

        (b) 1 pt: lists the rectangle's attributes (at least 4 right angles, plus 4 sides or parallel sides or opposite sides equal) and checks that a square has each one.
