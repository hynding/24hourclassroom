week: 25
unit: 7
title: "Graphing Points to Solve Problems"
topics: ["5.G.A.2"]
guide: guides/week-25.md
guide_description: |
  How to use points on a coordinate grid to solve problems: reading places on a map, finding the distance
  between two points that share a coordinate, finding a missing corner of a rectangle, and reading what
  a point means on a graph of real data, like a plant's height each week.
flashcards_description: |
  18 cards on maps on a coordinate grid, distances along grid lines, walking routes, missing corners of
  rectangles, axis titles and scales, and what a point on a data graph means.

flashcards:
  - front: Coordinate map → how to find a place
    back: |
      Find the place's point, look down to the x-axis for the first number and across to the y-axis for the second. Write them as (x, y).
    topic_code: "5.G.A.2"
  - front: Same y-coordinate → distance between the points
    back: |
      The points are on one horizontal line. Subtract the x-coordinates. From (2, 5) to (9, 5) is 9 − 2 = 7 units.
    topic_code: "5.G.A.2"
  - front: Same x-coordinate → distance between the points
    back: |
      The points are on one vertical line. Subtract the y-coordinates. From (4, 1) to (4, 8) is 8 − 1 = 7 units.
    topic_code: "5.G.A.2"
  - front: Distance along a grid line → count spaces or lines?
    back: |
      Count the spaces (the jumps), not the grid lines. From 2 to 6 is 4 jumps, even though you touch 5 lines.
    topic_code: "5.G.A.2"
  - front: Walking along grid lines → the total distance
    back: |
      Add the across part and the up-or-down part. From (1, 1) to (5, 4): 4 across plus 3 up is 7 units.
    topic_code: "5.G.A.2"
  - front: Scale of a map → what "1 unit = 1 block" means
    back: |
      Each space on the grid stands for one block in real life. A walk of 6 units on the map is 6 blocks.
    topic_code: "5.G.A.2"
  - front: Missing corner of a rectangle → how to find it
    back: |
      Opposite sides of a rectangle line up. The missing corner borrows its x-coordinate from one neighbor and its y-coordinate from the other.
    topic_code: "5.G.A.2"
  - front: Rectangle with corners (1, 1), (7, 1), (7, 4) → the fourth corner
    back: |
      (1, 4). It is straight above (1, 1) and straight across from (7, 4).
    topic_code: "5.G.A.2"
  - front: Side length from coordinates → how to find it
    back: |
      Two corners on the same grid line share a coordinate. Subtract the other coordinates to get the side length.
    topic_code: "5.G.A.2"
  - front: Axis titles → why they matter
    back: |
      They tell what each number means, like "Week" on the x-axis and "Height (cm)" on the y-axis. Without them, a point is just two numbers.
    topic_code: "5.G.A.2"
  - front: Point (3, 8) on a week-and-height graph → what it means
    back: |
      In week 3, the height was 8. The x-coordinate is the week and the y-coordinate is the height.
    topic_code: "5.G.A.2"
  - front: Axis counting by 2s → how to read a point
    back: |
      Each grid line is worth 2, so a point halfway between the 6 line and the 8 line is at 7. Always check the numbers on the axis.
    topic_code: "5.G.A.2"
  - front: Change between two points on a data graph → how to find it
    back: |
      Subtract the y-coordinates. A plant at 4 cm in week 2 and 10 cm in week 5 grew 10 − 4 = 6 cm.
    topic_code: "5.G.A.2"
  - front: Two points at the same height on a data graph → what it means
    back: |
      Nothing changed between those two x-values. A plant at 6 cm in week 3 and week 4 did not grow that week.
    topic_code: "5.G.A.2"
  - front: Points going up from left to right → what it shows
    back: |
      The amount is growing. The steeper the climb between two points, the bigger the change.
    topic_code: "5.G.A.2"
  - front: Ordered pairs in a table → how to graph them
    back: |
      Each row of the table is one point. Use the first column for x and the second for y, then plot every row.
    topic_code: "5.G.A.2"
  - front: Points 5 units from (2, 6) along a grid line → which are on the grid
    back: |
      (7, 6) to the right, (2, 1) down, and (2, 11) up if the grid goes that high. Going 5 left would pass the y-axis, so that point is off the first-quadrant grid.
    topic_code: "5.G.A.2"
  - front: Checking a graphing answer → one quick test
    back: |
      Put your point back on the grid and see if it fits the story: right place on the map, right height on the graph, right corner of the shape.
    topic_code: "5.G.A.2"

quiz:
  description: |
    15 questions · about 25 minutes · reading places on a coordinate map, distances along grid lines,
    missing corners of rectangles and reading a graph of a plant's growth, plus review of ordered pairs,
    dividing unit fractions, two-digit division and multiplying decimals. Multiple choice, select-all,
    true/false and number answers are graded at once; the fill-in word is matched automatically; the
    short answer is checked by your teacher.
  questions:
    - slug: g5math-w25-q01
      type: multiple_choice
      topic_code: "5.G.A.2"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      stimulus: |
        Use the town map. Both axes are numbered from 0 to 10, and 1 unit on the grid stands for 1 block. People walk only along the grid lines.
      figure: figures/w25-town-map.svg
      figure_alt: "A town map on a coordinate grid. The x-axis and the y-axis are each numbered 0 to 10, and a note says 1 unit equals 1 block. Five places are plotted: School at (2, 3), Library at (2, 8), Pool at (9, 3), Park at (9, 8) and Bakery at (5, 6)."
      prompt: |
        What is the ordered pair for the library?
      options:
        - "(8, 2)"
        - "(2, 7)"
        - "(2, 8)"
        - "(9, 8)"
      option_explanations:
        - |
          This switches the numbers. The library is 2 blocks right of the origin and 8 blocks up, so the 2 comes first.
        - |
          The library sits on the grid line for 8, one line above 7. Read the y-axis straight across from the point.
        - |
          Correct. The library is straight above 2 on the x-axis and straight across from 8 on the y-axis.
        - |
          (9, 8) is the park. It is at the same height as the library, but 7 blocks farther right.
      answer: 2

    - slug: g5math-w25-q02
      type: numeric
      topic_code: "5.G.A.2"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      stimulus: |
        Use the town map. Both axes are numbered from 0 to 10, and 1 unit on the grid stands for 1 block. People walk only along the grid lines.
      prompt: |
        Hana walks straight from the school to the library. How many blocks does she walk?
      answer: { value: 5, tolerance: 0 }
      explanation: |
        The school is at (2, 3) and the library is at (2, 8). They share the x-coordinate 2, so they are on one vertical line. 8 − 3 = 5 blocks.

    - slug: g5math-w25-q03
      type: numeric
      topic_code: "5.G.A.2"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      stimulus: |
        Use the town map. Both axes are numbered from 0 to 10, and 1 unit on the grid stands for 1 block. People walk only along the grid lines.
      prompt: |
        Omar walks from the school to the pool, and then from the pool to the park. How many blocks does he walk in all?
      answer: { value: 12, tolerance: 0 }
      explanation: |
        School (2, 3) to pool (9, 3): 9 − 2 = 7 blocks across. Pool (9, 3) to park (9, 8): 8 − 3 = 5 blocks up. 7 + 5 = 12 blocks.

    - slug: g5math-w25-q04
      type: multiple_choice
      topic_code: "5.G.A.2"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      figure: figures/w25-three-corners.svg
      figure_alt: "A coordinate grid with the x-axis and the y-axis each numbered 0 to 8. Three points are plotted: A at (1, 2), B at (6, 2) and C at (6, 5)."
      prompt: |
        Points A, B and C are three corners of a rectangle. Where is the fourth corner, D?
      options:
        - "(1, 5)"
        - "(5, 1)"
        - "(6, 1)"
        - "(5, 6)"
      option_explanations:
        - |
          Correct. D must be straight above A, so its x-coordinate is 1, and straight across from C, so its y-coordinate is 5.
        - |
          (5, 1) is 5 right and only 1 up, which is below A and B, so it cannot be a corner of this rectangle.
        - |
          (6, 1) is just below B on the same vertical line. A rectangle's fourth corner goes on the left, above A.
        - |
          (5, 6) is not lined up with A or C. The fourth corner has to share A's x-coordinate and C's y-coordinate.
      answer: 0

    - slug: g5math-w25-q05
      type: multi_select
      topic_code: "5.G.A.2"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 2
      partial_credit: true
      prompt: |
        Which points lie on the same horizontal line as the point (3, 4)? Select all that apply.
      options:
        - "(8, 4)"
        - "(3, 8)"
        - "(0, 4)"
        - "(4, 3)"
        - "(6, 4)"
      option_explanations:
        - |
          Yes. (8, 4) has the same y-coordinate, 4, so it is at the same height, 5 units to the right.
        - |
          No. (3, 8) has the same x-coordinate, so it is straight above (3, 4), on a vertical line.
        - |
          Yes. (0, 4) has y-coordinate 4. It sits on the y-axis, 3 units to the left of (3, 4), at the same height.
        - |
          No. (4, 3) uses the same numbers in the other order. Its y-coordinate is 3, so it is lower.
        - |
          Yes. (6, 4) has y-coordinate 4, so it is in the same row, 3 units to the right.
      answer: [0, 2, 4]

    - slug: g5math-w25-q06
      type: multiple_choice
      topic_code: "5.G.A.2"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      stimulus: |
        Use the graph of a bean plant's height. The x-axis shows the week, from 0 to 7. The y-axis shows the height in centimeters and counts by 2s, from 0 to 14.
      figure: figures/w25-bean-plant.svg
      figure_alt: "A graph with Week on the x-axis, numbered 0 to 7, and Height (cm) on the y-axis, numbered 0 to 14 by 2s, one grid line for each 2 centimeters. Six points are plotted: (1, 2), (2, 4), (3, 6), (4, 6), (5, 10) and (6, 12)."
      prompt: |
        In which week was the bean plant 10 centimeters tall?
      options:
        - "Week 10"
        - "Week 4"
        - "Week 6"
        - "Week 5"
      option_explanations:
        - |
          10 is the height, the y-coordinate. The week is the x-coordinate, read below the point on the x-axis.
        - |
          In week 4 the point is at 6 centimeters, the same height as week 3. It reaches 10 one week later.
        - |
          In week 6 the point is at 12 centimeters. The point at 10 is one week earlier.
        - |
          Correct. The point (5, 10) is straight above week 5 and straight across from 10 centimeters.
      answer: 3

    - slug: g5math-w25-q07
      type: numeric
      topic_code: "5.G.A.2"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      stimulus: |
        Use the graph of a bean plant's height. The x-axis shows the week, from 0 to 7. The y-axis shows the height in centimeters and counts by 2s, from 0 to 14.
      prompt: |
        How many centimeters did the bean plant grow from week 3 to week 5?
      answer: { value: 4, tolerance: 0 }
      explanation: |
        In week 3 the plant was 6 cm tall, and in week 5 it was 10 cm tall. 10 − 6 = 4 centimeters of growth.

    - slug: g5math-w25-q08
      type: true_false
      topic_code: "5.G.A.2"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      stimulus: |
        Use the graph of a bean plant's height. The x-axis shows the week, from 0 to 7. The y-axis shows the height in centimeters and counts by 2s, from 0 to 14.
      prompt: |
        True or false: the point (4, 6) on the graph means the bean plant was 4 centimeters tall in week 6.
      answer: false
      explanation: |
        False. The x-coordinate is the week and the y-coordinate is the height, so (4, 6) means the plant was 6 centimeters tall in week 4.

    - slug: g5math-w25-q09
      type: fill_blank
      topic_code: "5.G.A.2"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      prompt: |
        In the ordered pair (6, 2), the number 2 tells how far up the point is. It is called the ____.
      answer: ["y-coordinate", "the y-coordinate", "y coordinate", "y-coordinates", "ycoordinate"]
      explanation: |
        The second number in an ordered pair is the y-coordinate. It tells how far up from the x-axis the point is.

    - slug: g5math-w25-q10
      type: multiple_choice
      topic_code: "5.G.A.2"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      prompt: |
        A bus stop is at (2, 7) and a fire station is at (9, 7) on a map grid. How many units apart are they along the grid line?
      options:
        - "9 units"
        - "7 units"
        - "11 units"
        - "16 units"
      option_explanations:
        - |
          9 is the fire station's x-coordinate. The bus stop starts at 2, not at 0, so subtract: 9 − 2.
        - |
          Correct. Both points have y-coordinate 7, so they are on one horizontal line. 9 − 2 = 7 units.
        - |
          This adds 2 and 9. To find the distance between two points on a line, subtract the x-coordinates.
        - |
          This adds 7 and 9. The 7 is the height of both points, which does not change, so only the x-coordinates matter.
      answer: 1

    - slug: g5math-w25-q11
      type: multiple_choice
      topic_code: "5.G.A.1"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 1
      prompt: |
        Review: start at the origin, move 4 units right and do not move up at all. Which ordered pair names that point?
      options:
        - "(0, 4)"
        - "(4, 4)"
        - "(1, 4)"
        - "(4, 0)"
      option_explanations:
        - |
          (0, 4) means 0 right and 4 up. That point is on the y-axis, not 4 units to the right.
        - |
          (4, 4) also moves up 4. The point you want did not move up, so its y-coordinate is 0.
        - |
          The first number tells how far right, so 4 must come first. The second number is 0 because you did not move up.
        - |
          Correct. 4 right gives an x-coordinate of 4, and no move up gives a y-coordinate of 0. The point is on the x-axis.
      answer: 3

    - slug: g5math-w25-q12
      type: multiple_choice
      topic_code: "5.NF.B.7"
      source: "IM K–5 Math Grade 5, Unit 3, Section B"
      points: 1
      prompt: |
        Review: 1/4 of a pan of cornbread is shared equally by 3 friends. What fraction of the whole pan does each friend get?
      options:
        - "3/4"
        - "1/7"
        - "1/12"
        - "4/3"
      option_explanations:
        - |
          This multiplies 1/4 by 3. Sharing among 3 friends makes each part smaller, not bigger.
        - |
          This adds 4 and 3. Splitting each fourth into 3 equal parts makes twelfths, not sevenths.
        - |
          Correct. 1/4 ÷ 3 = 1/12, because splitting each fourth into 3 equal parts cuts the pan into 12 parts.
        - |
          4/3 is more than a whole pan. Each friend gets part of one fourth, so the answer must be less than 1/4.
      answer: 2

    - slug: g5math-w25-q13
      type: numeric
      topic_code: "5.NBT.B.6"
      source: "IM K–5 Math Grade 5, Unit 4, Section B"
      points: 1
      prompt: |
        Review: a school packs 1,656 pencils into boxes of 24. How many boxes does it fill?
      answer: { value: 69, tolerance: 0 }
      explanation: |
        1,656 ÷ 24: 24 × 60 = 1,440, leaving 216. 24 × 9 = 216, leaving 0. 60 + 9 = 69 boxes.

    - slug: g5math-w25-q14
      type: multiple_choice
      topic_code: "5.NBT.B.7"
      source: "IM K–5 Math Grade 5, Unit 5, Section C"
      points: 1
      prompt: |
        Review: what is 0.6 × 0.4?
      options:
        - "0.24"
        - "2.4"
        - "0.024"
        - "1.0"
      option_explanations:
        - |
          Correct. 6 tenths × 4 tenths = 24 hundredths, because a tenth of a tenth is a hundredth. So 0.24.
        - |
          2.4 is 0.6 × 4. Both numbers here are less than 1, so their product is less than either one.
        - |
          This has one place too many. Tenths times tenths give hundredths, so there are 2 decimal places, not 3.
        - |
          1.0 is 0.6 + 0.4. The question asks for the product, not the sum.
      answer: 0

    - slug: g5math-w25-q15
      type: short_answer
      topic_code: "5.G.A.2"
      source: "IM K–5 Math Grade 5, Unit 7, Section A"
      points: 2
      prompt: |
        Ava walks along the grid lines of a map from (1, 2) to (6, 2), and then from (6, 2) to (6, 9).

        (a) How many units does she walk in all? Show how you know.
        (b) Name one point on the grid that is exactly 3 units from (6, 9) along a grid line.
      answer: |
        (a) 12 units. From (1, 2) to (6, 2) is 6 − 1 = 5 units across. From (6, 2) to (6, 9) is 9 − 2 = 7 units up. 5 + 7 = 12.
        (b) (6, 6), which is 3 units down. (9, 9) and (3, 9) also work, and so does (6, 12) if the grid goes that high.
      explanation: |
        Two points.

        (a) 1 pt: 12 units, with the two parts (5 across and 7 up) shown or explained.

        (b) 1 pt: any one of (6, 6), (9, 9), (3, 9) or (6, 12).
