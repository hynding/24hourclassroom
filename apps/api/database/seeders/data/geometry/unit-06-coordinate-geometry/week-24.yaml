week: 24
unit: 6
title: "Equations of Lines, Parallel and Perpendicular Slopes, Intersections"
topics: ["6.9", "6.10", "6.11", "6.12", "6.13"]
guide: guides/week-24.md
guide_description: |
  Why a line has one slope (similar slope triangles), point-slope and slope-intercept forms, the equal-slope rule for parallel lines and the product −1 rule for perpendicular lines with their transformation proofs, writing parallel and perpendicular lines through a point, and finding where lines, circles and parabolas meet. Worked examples, Try-it problems and a self-check.
flashcards_description: |
  30 cards on slope, point-slope form, parallel and perpendicular slopes and their proofs, writing lines from given information, and intersection points. Review them before the week 24 quiz.
flashcards:
  - front: Slope of a line → formula from two points
    back: |
      m = (y₂ − y₁)/(x₂ − x₁): rise over run. Keep the points in the same order on top and bottom.
    topic_code: "6.9"
  - front: Why every slope triangle on a line gives the same slope
    back: |
      Any two slope triangles on a line share a right angle and a corresponding angle (the line is a transversal of their horizontal legs), so they are similar by AA and rise/run is the same.
    topic_code: "6.9"
  - front: Point-slope form of a line
    back: |
      y − k = m(x − h): slope m, passes through (h, k). It comes from (y − k)/(x − h) = m, the slope triangle from (h, k) to (x, y).
    topic_code: "6.9"
  - front: Slope-intercept form of a line
    back: |
      y = mx + b: slope m, y-intercept (0, b). Expand point-slope form and collect to reach it.
    topic_code: "6.9"
  - front: Read the point and slope from y + 3 = 2(x − 1)
    back: |
      Slope 2, through (1, −3). The signs inside the brackets flip: x − 1 means x = 1, y + 3 means y = −3.
    topic_code: "6.9"
  - front: Equation of a vertical line and of a horizontal line
    back: |
      Vertical through (c, anything): x = c, no slope. Horizontal through (anything, c): y = c, slope 0. Point-slope form cannot write a vertical line.
    topic_code: "6.9"
  - front: Line through (−1, 4) and (3, −2) → equation
    back: |
      m = (−2 − 4)/(3 + 1) = −3/2. y − 4 = −3/2 (x + 1), or y = −3/2 x + 5/2.
    topic_code: "6.9"
  - front: Parallel lines in the coordinate plane → slope rule
    back: |
      Distinct non-vertical lines are parallel exactly when their slopes are equal. Two vertical lines are parallel too.
    topic_code: "6.10"
  - front: Why parallel lines have equal slopes → proof idea
    back: |
      A translation carries one line onto the parallel line and carries its slope triangle with it; translations preserve lengths, so run and rise, hence the slope, are unchanged.
    topic_code: "6.10"
  - front: Equal slopes but same intercept → what are the lines?
    back: |
      The same line written twice, not parallel lines. Parallel needs equal slopes and no shared point.
    topic_code: "6.10"
  - front: Line through (−2, 3) parallel to y = 4x − 7
    back: |
      Same slope 4: y − 3 = 4(x + 2), or y = 4x + 11.
    topic_code: "6.10"
  - front: Test whether 2x + 3y = 12 is parallel to y = −2/3 x + 1
    back: |
      Solve for y: y = −2/3 x + 4. Equal slopes −2/3, different intercepts 4 and 1: parallel.
    topic_code: "6.10"
  - front: Perpendicular lines in the coordinate plane → slope rule
    back: |
      Their slopes multiply to −1 (each is the opposite reciprocal of the other), unless one line is vertical, in which case the other is horizontal.
    topic_code: "6.11"
  - front: Why perpendicular slopes multiply to −1 → proof idea
    back: |
      Rotate a line of slope m through the origin by 90°. The rule (x, y) → (−y, x) sends the slope point (1, m) to (−m, 1), so the image has slope 1/(−m) = −1/m.
    topic_code: "6.11"
  - front: Slope perpendicular to 2/3
    back: |
      −3/2. Flip the fraction and change the sign. Check: 2/3 · (−3/2) = −1.
    topic_code: "6.11"
  - front: Slope perpendicular to a horizontal line
    back: |
      Undefined: the perpendicular is vertical, x = c. The product rule does not apply because a vertical line has no slope.
    topic_code: "6.11"
  - front: Error-spot → "the perpendicular to slope 2/3 has slope 3/2"
    back: |
      The reciprocal alone is wrong; the sign must change too. The perpendicular slope is −3/2.
    topic_code: "6.11"
  - front: Is the angle at B right? A = (1, 1), B = (4, 7), C = (7, 1)
    back: |
      Slope AB = 2, slope BC = −2, product −4 ≠ −1: not a right angle. The triangle is isosceles (AB = BC = √45) but not right.
    topic_code: "6.11"
  - front: Line through (6, −2) perpendicular to y = 3x + 1
    back: |
      Slope −1/3: y + 2 = −1/3 (x − 6), which simplifies to y = −1/3 x.
    topic_code: "6.12"
  - front: What information pins down a line?
    back: |
      Two points; a point and a slope; a slope and a y-intercept; a point and a line it is parallel or perpendicular to. One point alone or a slope alone is not enough.
    topic_code: "6.12"
  - front: Two lines perpendicular to the same line → slope proof
    back: |
      If ℓ has slope m, both perpendiculars have slope −1/m, so they are parallel (or the same line). This re-proves the week 2 fact with slopes.
    topic_code: "6.12"
  - front: Decide whether two point-slope equations describe the same line
    back: |
      Compare slopes; if equal, substitute the point of one equation into the other. Equal slope and a shared point means one line.
    topic_code: "6.12"
  - front: Perpendicular to 4x − 2y = 6 with y-intercept 5
    back: |
      The line is y = 2x − 3, slope 2, so the perpendicular has slope −1/2: y = −1/2 x + 5.
    topic_code: "6.12"
  - front: Intersection point of two graphs → meaning
    back: |
      A point whose coordinates satisfy both equations. Find it by solving the system, then check it in both.
    topic_code: "6.13"
  - front: Where y = 2x − 1 meets y = −x + 5
    back: |
      2x − 1 = −x + 5 gives x = 2, then y = 3. The point (2, 3) satisfies both.
    topic_code: "6.13"
  - front: Line meets circle → how many points and how to find them
    back: |
      Substitute the line into the circle to get a quadratic. Two real roots: crosses twice; one: tangent; none (negative discriminant): misses.
    topic_code: "6.13"
  - front: Where y = x + 1 meets x² + y² = 25
    back: |
      x² + (x + 1)² = 25 → x² + x − 12 = 0 → (x + 4)(x − 3) = 0. Points (3, 4) and (−4, −3).
    topic_code: "6.13"
  - front: Where the vertical line x = 3 meets (x − 1)² + (y + 2)² = 13
    back: |
      Substitute x = 3: (y + 2)² = 9, so y = 1 or y = −5. Points (3, 1) and (3, −5). Remember both square roots.
    topic_code: "6.13"
  - front: Parallel lines as a system of equations → what happens
    back: |
      Substituting gives a false statement such as 0 = 4: no solution, no intersection. The same line twice gives 0 = 0, infinitely many.
    topic_code: "6.13"
  - front: Line meets parabola y = x²/4 → method
    back: |
      Set the line's y equal to x²/4 and solve the quadratic. y = x + 3 gives x² − 4x − 12 = 0, points (6, 9) and (−2, 1).
    topic_code: "6.13"
quiz:
  description: |
    25 questions · about 40 minutes · Slope, point-slope and slope-intercept forms, the parallel and perpendicular slope rules and their proofs, writing lines through a point, and intersection points of lines, circles and parabolas, with review of the rotation rule, the distance formula, circle equations, completing the square, parabolas, similarity and the Pythagorean theorem. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: geo-u06-w24-q01
      type: multiple_choice
      topic_code: "6.9"
      source: "IM Geometry, Unit 6, Lesson 9"
      points: 1
      stimulus: |
        Figure description: triangle PQR on a coordinate grid has vertices P = (−2, 1), Q = (4, 5) and R = (6, −3).
      prompt: |
        What is the slope of side PQ?
      options:
        - "3/2"
        - "−2/3"
        - "2/3"
        - "4/6 + 1"
      option_explanations:
        - |
          3/2 is run over rise; slope is the vertical change divided by the horizontal change.
        - |
          Both changes are positive (up 4, right 6), so the slope is positive.
        - |
          Correct. Rise 5 − 1 = 4 over run 4 − (−2) = 6 gives 4/6 = 2/3.
        - |
          The slope is a single ratio, 4/6; nothing is added to it.
      answer: 2

    - slug: geo-u06-w24-q02
      type: multiple_choice
      topic_code: "6.11"
      source: "IM Geometry, Unit 6, Lesson 11"
      points: 1
      stimulus: |
        Figure description: triangle PQR on a coordinate grid has vertices P = (−2, 1), Q = (4, 5) and R = (6, −3).
      prompt: |
        Is the angle at Q a right angle?
      options:
        - "No: a right angle needs one horizontal and one vertical side"
        - "Yes: PQ and QR have different slopes"
        - "Yes: slope PQ = 2/3 and slope QR = −4, and one is negative"
        - "No: slope PQ = 2/3 and slope QR = −4, and their product is not −1"
      option_explanations:
        - |
          Right angles can occur at any orientation; the test is whether the slopes multiply to −1.
        - |
          Different slopes only mean the lines are not parallel; perpendicular needs a product of −1.
        - |
          One negative slope does not make a right angle; the product must be exactly −1.
        - |
          Correct. Slope QR = (−3 − 5)/(6 − 4) = −4; (2/3)(−4) = −8/3 ≠ −1, so PQ is not perpendicular to QR.
      answer: 3

    - slug: geo-u06-w24-q03
      type: multiple_choice
      topic_code: "6.12"
      source: "IM Geometry, Unit 6, Lesson 12"
      points: 1
      stimulus: |
        Figure description: triangle PQR on a coordinate grid has vertices P = (−2, 1), Q = (4, 5) and R = (6, −3).
      prompt: |
        Which equation describes the line through R perpendicular to PQ?
      options:
        - "y + 3 = −2/3 (x − 6)"
        - "y + 3 = −3/2 (x − 6)"
        - "y + 3 = 2/3 (x − 6)"
        - "y − 3 = −3/2 (x + 6)"
      option_explanations:
        - |
          −2/3 is the opposite of PQ's slope but not its reciprocal; the product with 2/3 is −4/9, not −1.
        - |
          Correct. PQ has slope 2/3, so the perpendicular has slope −3/2, and the line passes through R = (6, −3).
        - |
          Slope 2/3 is PQ's own slope; that line through R is parallel to PQ, not perpendicular.
        - |
          The point is (6, −3), so the equation needs (x − 6) and (y + 3); this one passes through (−6, 3).
      answer: 1

    - slug: geo-u06-w24-q04
      type: multiple_choice
      topic_code: "6.9"
      source: "IM Geometry, Unit 6, Lesson 9"
      points: 1
      prompt: |
        Which equation describes the line through (3, −2) with slope 4?
      options:
        - "y + 2 = 4(x − 3)"
        - "y + 2 = 4x − 3"
        - "y = 4x − 2"
        - "y − 2 = 4(x + 3)"
      option_explanations:
        - |
          Correct. Point-slope form y − k = m(x − h) with (h, k) = (3, −2) gives y + 2 = 4(x − 3).
        - |
          The slope must multiply the whole bracket (x − 3); here it multiplies only x.
        - |
          y = 4x − 2 has slope 4 but passes through (0, −2); at x = 3 it gives y = 10, not −2.
        - |
          This line passes through (−3, 2); the signs inside the brackets are reversed.
      answer: 0

    - slug: geo-u06-w24-q05
      type: multiple_choice
      topic_code: "6.10"
      source: "IM Geometry, Unit 6, Lesson 10"
      points: 1
      prompt: |
        Which line is parallel to 3x + 2y = 8?
      options:
        - "y = 3/2 x + 4"
        - "y = −3/2 x + 1"
        - "y = 2/3 x + 4"
        - "y = −3/2 x + 4"
      option_explanations:
        - |
          3/2 has the wrong sign; solving 2y = −3x + 8 gives a slope of −3/2.
        - |
          Correct. 3x + 2y = 8 is y = −3/2 x + 4, slope −3/2; this line has the same slope and a different intercept.
        - |
          2/3 is the reciprocal of 3/2; a perpendicular would have slope 2/3, not a parallel.
        - |
          This is the same line as 3x + 2y = 8, not a parallel one; it shares every point.
      answer: 1

    - slug: geo-u06-w24-q06
      type: multiple_choice
      topic_code: "6.11"
      source: "IM Geometry, Unit 6, Lesson 11"
      points: 1
      prompt: |
        A line with slope m through the origin is rotated 90° counterclockwise about the origin. Using the rule (x, y) → (−y, x), where does the point (1, m) go, and what is the slope of the image line?
      options:
        - "(−1, m); slope −m"
        - "(m, −1); slope −1/m"
        - "(−m, 1); slope −1/m"
        - "(−m, 1); slope −m"
      option_explanations:
        - |
          The rule swaps the coordinates and negates the new first one: (1, m) → (−m, 1), not (−1, m).
        - |
          (m, −1) is the image under a 90° clockwise rotation; either way the slope works out to −1/m, but the point asked for is (−m, 1).
        - |
          Correct. (1, m) → (−m, 1), and a line through the origin and (−m, 1) has slope 1/(−m) = −1/m.
        - |
          The point is right, but the slope through the origin and (−m, 1) is rise 1 over run −m, which is −1/m.
      answer: 2

    - slug: geo-u06-w24-q07
      type: multiple_choice
      topic_code: "6.12"
      source: "IM Geometry, Unit 6, Lesson 12"
      points: 1
      prompt: |
        Which equation describes the line through (−4, 1) that is perpendicular to y = −1/2 x + 7?
      options:
        - "y = 2x + 9"
        - "y = 1/2 x + 3"
        - "y = −2x − 7"
        - "y = 2x + 1"
      option_explanations:
        - |
          Correct. The perpendicular slope is 2, and y − 1 = 2(x + 4) expands to y = 2x + 9.
        - |
          1/2 is just the sign changed; the reciprocal is also needed, giving 2.
        - |
          −2 is the opposite of the reciprocal taken twice; the perpendicular to −1/2 is +2.
        - |
          Slope 2 is right, but y = 2x + 1 gives y = −7 at x = −4, so it misses the point (−4, 1).
      answer: 0

    - slug: geo-u06-w24-q08
      type: multiple_choice
      topic_code: "6.13"
      source: "IM Geometry, Unit 6, Lesson 13"
      points: 1
      prompt: |
        Where do the lines y = 3x − 5 and y = −x + 7 intersect?
      options:
        - "They are parallel and never meet"
        - "(4, 3)"
        - "(1, −2)"
        - "(3, 4)"
      option_explanations:
        - |
          The slopes 3 and −1 differ, so the lines are not parallel and meet exactly once.
        - |
          (4, 3) has the coordinates swapped; at x = 4 the first line gives y = 7 and the second y = 3.
        - |
          (1, −2) is on the first line but the second gives y = 6 at x = 1.
        - |
          Correct. 3x − 5 = −x + 7 gives 4x = 12, x = 3, and y = 3 · 3 − 5 = 4; check 4 = −3 + 7 ✓.
      answer: 3

    - slug: geo-u06-w24-q09
      type: multiple_choice
      topic_code: "6.13"
      source: "IM Geometry, Unit 6, Lesson 13"
      points: 1
      prompt: |
        How many points do the line y = x + 8 and the circle x² + y² = 25 have in common?
      options:
        - "1"
        - "2"
        - "Infinitely many"
        - "0"
      option_explanations:
        - |
          One common point would need a zero discriminant (a tangent); here it is negative.
        - |
          Two points would need a positive discriminant; 16² − 4 · 2 · 39 = −56 is negative.
        - |
          A line and a circle can share at most two points.
        - |
          Correct. Substituting gives 2x² + 16x + 39 = 0, whose discriminant 256 − 312 is negative, so the line misses the circle.
      answer: 3

    - slug: geo-u06-w24-q10
      type: multiple_choice
      topic_code: "6.10"
      source: "IM Geometry, Unit 6, Lesson 10"
      points: 1
      prompt: |
        Which statement best explains why a line and its image under a translation have the same slope?
      options:
        - "The translation carries a slope triangle of the line onto a congruent slope triangle of the image, so rise and run are unchanged"
        - "The two lines have the same y-intercept"
        - "Translations preserve angles, and slope is an angle"
        - "A translation is a dilation with scale factor 1, and dilations preserve slope"
      option_explanations:
        - |
          Correct. A translation is a rigid motion, so the image of the slope triangle has the same legs; same rise over the same run means the same slope.
        - |
          A translated line usually has a different y-intercept; equal intercepts would make the lines identical.
        - |
          Slope is a ratio of lengths, not an angle; the argument is about congruent legs, though preserved angles are a consequence.
        - |
          A translation is not a dilation (a dilation fixes its centre); the reason is congruence of the slope triangles.
      answer: 0

    - slug: geo-u06-w24-q11
      type: multiple_choice
      topic_code: "6.4"
      source: "IM Geometry, Unit 6, Lesson 4"
      points: 1
      prompt: |
        Review. The lines y = 2x − 1 and y = −x + 5 meet at (2, 3). How far is that point from the origin?
      options:
        - "5"
        - "√13"
        - "√5"
        - "13"
      option_explanations:
        - |
          5 is 2 + 3, the sum of the coordinates, not the hypotenuse of the 2-by-3 right triangle.
        - |
          Correct. The distance from (0, 0) to (2, 3) is √(2² + 3²) = √13.
        - |
          √5 adds the coordinates before taking the root; they must be squared first: 4 + 9 = 13.
        - |
          13 is the square of the distance; the distance is its square root.
      answer: 1

    - slug: geo-u06-w24-q12
      type: multiple_choice
      topic_code: "6.8"
      source: "IM Geometry, Unit 6, Lesson 8"
      points: 1
      prompt: |
        Review. The line y = x + 3 meets the parabola y = x²/4 at (6, 9) and (−2, 1). What are the focus and directrix of that parabola?
      options:
        - "Focus (0, 4), directrix y = −4"
        - "Focus (1, 0), directrix x = −1"
        - "Focus (0, 1), directrix y = −1"
        - "Focus (0, 2), directrix y = −2"
      option_explanations:
        - |
          4 is the whole denominator 4p, not p; the focus is p = 1 from the vertex.
        - |
          The parabola opens upward (y in terms of x²), so its focus is on the y-axis and its directrix is horizontal.
        - |
          Correct. y = x²/(4p) with 4p = 4 gives p = 1, so the focus is 1 above the vertex (0, 0) and the directrix is y = −1.
        - |
          p = 2 would give y = x²/8; here the denominator is 4, so p = 1.
      answer: 2

    - slug: geo-u06-w24-q13
      type: multiple_choice
      topic_code: "3.9"
      source: "IM Geometry, Unit 3, Lesson 9"
      points: 1
      prompt: |
        Review. Two slope triangles are drawn on the same line, one with run 2 and rise 3, the other with run 6. Which similarity criterion shows the triangles are similar, and what is the larger rise?
      options:
        - "AA; rise 7"
        - "SSS; rise 9"
        - "SAS; rise 6"
        - "AA; rise 9"
      option_explanations:
        - |
          The rise scales by the same factor as the run (6/2 = 3), giving 9, not 3 + 4 = 7.
        - |
          Only one side of the second triangle is known, so SSS cannot be checked; two angles are known, so AA is the criterion.
        - |
          The run tripled, so the rise triples to 9; SAS would need the included sides, which are not all given.
        - |
          Correct. Both have a right angle and share the angle the line makes with the horizontal, so AA applies; the scale factor 3 gives rise 9.
      answer: 3

    - slug: geo-u06-w24-q14
      type: multi_select
      topic_code: "6.11"
      source: "IM Geometry, Unit 6, Lesson 11"
      points: 2
      partial_credit: true
      prompt: |
        Which pairs of lines are perpendicular? Select all that apply.
      options:
        - "y = −x and y = −x + 6"
        - "y = 3x + 1 and y = −1/3 x − 4"
        - "x = 4 and y = −2"
        - "y = 4x − 1 and y = 1/4 x + 2"
        - "y = 2/5 x and y = −5/2 x + 7"
      option_explanations:
        - |
          No: equal slopes −1 and −1 make these lines parallel.
        - |
          Yes: 3 · (−1/3) = −1, so the slopes are opposite reciprocals.
        - |
          Yes: a vertical line and a horizontal line are perpendicular even though the product rule cannot be applied.
        - |
          No: 4 · 1/4 = 1, not −1; the reciprocal was taken but the sign was not changed.
        - |
          Yes: (2/5)(−5/2) = −1, so these two slopes are opposite reciprocals.
      answer: [1, 2, 4]

    - slug: geo-u06-w24-q15
      type: multi_select
      topic_code: "6.5"
      source: "IM Geometry, Unit 6, Lesson 5"
      points: 2
      partial_credit: true
      prompt: |
        Review. The line y = x + 1 crosses the circle x² + y² = 25 at (3, 4) and (−4, −3). Which statements are true? Select all that apply.
      options:
        - "The point (5, 1) lies on the circle"
        - "The circle's centre is the origin and its radius is 5"
        - "The expanded form of the circle is x² + y² − 25 = 0"
        - "The point (0, 1) is inside the circle"
        - "The chord from (3, 4) to (−4, −3) passes through the centre"
      option_explanations:
        - |
          No: 25 + 1 = 26 ≠ 25, so (5, 1) is just outside the circle.
        - |
          Yes: x² + y² = 25 is (x − 0)² + (y − 0)² = 5².
        - |
          Yes: moving 25 to the left side gives x² + y² − 25 = 0, with D = E = 0.
        - |
          Yes: 0 + 1 − 25 = −24 < 0, so (0, 1) is closer than 5 to the centre.
        - |
          No: the midpoint of the chord is (−1/2, 1/2), not the origin, so the chord is not a diameter.
      answer: [1, 2, 3]

    - slug: geo-u06-w24-q16
      type: true_false
      topic_code: "6.10"
      source: "IM Geometry, Unit 6, Lesson 10"
      points: 1
      prompt: |
        True or false: if two lines have the same slope, they must be parallel.
      answer: false
      explanation: |
        False. Two equations with the same slope can describe the same line, such as y = 2x + 1 and 2y = 4x + 2. Parallel lines have equal slopes and no point in common.

    - slug: geo-u06-w24-q17
      type: true_false
      topic_code: "6.3"
      source: "IM Geometry, Unit 6, Lesson 3"
      points: 1
      prompt: |
        Review. True or false: the rotation (x, y) → (−y, x) is a rigid transformation, so it carries a slope triangle to a congruent triangle.
      answer: true
      explanation: |
        True. A rotation preserves distances and angles, so the image of a slope triangle is congruent to it; that is what makes the perpendicular-slope proof work.

    - slug: geo-u06-w24-q18
      type: fill_blank
      topic_code: "6.11"
      source: "IM Geometry, Unit 6, Lesson 11"
      points: 1
      prompt: |
        The slope of any line perpendicular to y = −4/7 x + 3 is ____.
      answer: ["7/4", "1.75", "7 / 4"]
      explanation: |
        The opposite reciprocal of −4/7 is 7/4. Check: (−4/7)(7/4) = −1.

    - slug: geo-u06-w24-q19
      type: fill_blank
      topic_code: "6.6"
      source: "IM Geometry, Unit 6, Lesson 6"
      points: 1
      prompt: |
        Review. The circle x² + y² − 8x + 2y + 8 = 0 has centre (4, −1) and radius ____.
      answer: ["3"]
      explanation: |
        Completing the square: (x − 4)² − 16 + (y + 1)² − 1 + 8 = 0, so (x − 4)² + (y + 1)² = 9 and the radius is 3.

    - slug: geo-u06-w24-q20
      type: numeric
      topic_code: "6.13"
      source: "IM Geometry, Unit 6, Lesson 13"
      points: 1
      prompt: |
        The lines y = 1/2 x + 4 and y = −2x + 9 intersect at one point. What is the x-coordinate of that point? Give an integer.
      answer: { value: 2, tolerance: 0 }
