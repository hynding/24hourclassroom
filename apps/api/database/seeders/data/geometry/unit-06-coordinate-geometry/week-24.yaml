      source: "IM Geometry, Unit 6, Lesson 10"
      points: 3
      prompt: |
        Quadrilateral ABCD has vertices A = (0, 0), B = (6, 2), C = (8, 7) and D = (2, 5).

        (a) Find the slopes of AB and DC.
        (b) Find the slopes of BC and AD.
        (c) What kind of quadrilateral is ABCD? Justify your answer using the slopes, and say whether it is a rectangle.
      answer: |
        (a) Slope AB = 2/6 = 1/3; slope DC = (7 − 5)/(8 − 2) = 2/6 = 1/3.
        (b) Slope BC = (7 − 2)/(8 − 6) = 5/2; slope AD = 5/2.
        (c) Both pairs of opposite sides have equal slopes, so both pairs are parallel: ABCD is a parallelogram. It is not a rectangle, because adjacent sides AB and BC have slopes 1/3 and 5/2 with product 5/6 ≠ −1, so the angle at B is not a right angle.
      explanation: |
        1 point for both slopes equal to 1/3. 1 point for both slopes equal to 5/2. 1 point for concluding parallelogram from two pairs of parallel sides and ruling out a rectangle with the product-of-slopes test.

    - slug: geo-u06-w24-q25
      type: long_answer
      topic_code: "6.13"
      source: "IM Geometry, Unit 6, Lesson 13"
      points: 6
      prompt: |
        The circle C has equation (x − 2)² + (y − 1)² = 20, and the line ℓ has equation y = 2x − 8.

        (a) Find the points where ℓ meets C.
        (b) Find the midpoint M of the chord joining those points, and show that the segment from the centre of C to M is perpendicular to ℓ.
        (c) Write the equation of the line through the centre of C perpendicular to ℓ, and verify that M lies on it.
        (d) The line y = 2x + k is tangent to C for two values of k. Explain how you would find them (you may set up the quadratic and describe the condition without solving it completely).
      answer: |
        (a) Substitute: (x − 2)² + (2x − 9)² = 20 → x² − 4x + 4 + 4x² − 36x + 81 = 20 → 5x² − 40x + 65 = 0 → x² − 8x + 13 = 0. x = (8 ± √(64 − 52))/2 = 4 ± √3. Points (4 + √3, 2√3) and (4 − √3, −2√3), since y = 2x − 8 = 2(4 ± √3) − 8 = ±2√3.
        (b) M = ((4 + √3 + 4 − √3)/2, (2√3 − 2√3)/2) = (4, 0). The centre is O = (2, 1); slope of OM = (0 − 1)/(4 − 2) = −1/2. Slope of ℓ is 2, and 2 · (−1/2) = −1, so OM ⊥ ℓ. (A radius to the midpoint of a chord is perpendicular to the chord.)
        (c) Slope −1/2 through (2, 1): y − 1 = −1/2 (x − 2), or y = −1/2 x + 2. At x = 4: y = −2 + 2 = 0 ✓, so M = (4, 0) is on it.
        (d) Substitute y = 2x + k into the circle: (x − 2)² + (2x + k − 1)² = 20 gives a quadratic 5x² + (4k − 8)x + (k − 1)² − 16 = 0. The line is tangent when this has exactly one solution, so set the discriminant (4k − 8)² − 20((k − 1)² − 16) equal to 0 and solve for k. (Solving gives k = −3 ± 10, so k = 7 or k = −13.)
      explanation: |
        Scoring (6 points): (a) 2 points: 1 for reaching x² − 8x + 13 = 0 (or an equivalent), 1 for both points with their y-coordinates. (b) 1 point for M = (4, 0) and the slope product −1. (c) 1 point for y = −1/2 x + 2 and the check. (d) 2 points: 1 for substituting and forming a quadratic in x, 1 for stating the zero-discriminant condition (full solution not required; k = 7 and k = −13 if given).
