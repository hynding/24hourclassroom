      prompt: |
        Decide whether each rule is a rigid transformation, a dilation, or neither, and justify each with a distance computation or a named transformation: (a) (x, y) → (y + 1, −x); (b) (x, y) → (x/2, y/2); (c) (x, y) → (x, x + y).
      answer: |
        (a) Rigid: it is the 90° clockwise rotation (x, y) → (y, −x) followed by a translation by (1, 0); both preserve distances. Check: (0, 0) and (3, 4) are 5 apart; their images (1, 0) and (5, −3) are √(16 + 9) = 5 apart. (b) A dilation from the origin with scale factor 1/2: both coordinates are multiplied by the same constant; distances are halved, so it is not rigid. (c) Neither: (0, 0) and (1, 0) are 1 apart, but their images (0, 0) and (1, 1) are √2 apart, so it is not rigid; and (0, 0) and (0, 1) go to (0, 0) and (0, 1), distance unchanged, so distances are not all multiplied by one constant, so it is not a dilation (it is a shear).
      explanation: |
        1 point for (a) identified as rigid with the rotation-plus-translation decomposition or a correct distance check. 1 point for (b) identified as a dilation with k = 1/2. 1 point for (c) identified as neither, with evidence that distances change by different factors.

    - slug: geo-u06-w22-q25
      type: long_answer
      topic_code: "6.4"
      source: "IM Geometry, Unit 6, Lesson 4"
      points: 6
      prompt: |
        Quadrilateral KLMN has vertices K = (−2, 1), L = (2, 4), M = (6, 1) and N = (2, −2).

        (a) Compute all four side lengths and both diagonal lengths.
        (b) Use (a) to decide what kind of quadrilateral KLMN is, citing the theorems you use.
        (c) Find the point where the diagonals cross and verify it is the midpoint of both.
        (d) Write the equation of the circle centred at that crossing point that passes through all four vertices, or explain why no such circle exists.
      answer: |
        (a) KL = √(16 + 9) = 5; LM = √(16 + 9) = 5; MN = √(16 + 9) = 5; NK = √(16 + 9) = 5. Diagonals: KM = 8 (from (−2, 1) to (6, 1)); LN = 6 (from (2, 4) to (2, −2)).
        (b) All four sides are equal, so KLMN is a rhombus (a parallelogram by the both-pairs-of-opposite-sides-congruent converse, with all sides equal). The diagonals are not equal (8 ≠ 6), so it is not a square; it is a rhombus that is not a square. (Also KM is horizontal and LN is vertical, so the diagonals are perpendicular, as a rhombus's must be.)
        (c) KM lies on y = 1 and LN on x = 2, so they cross at (2, 1). Midpoint of KM: ((−2 + 6)/2, (1 + 1)/2) = (2, 1); midpoint of LN: ((2 + 2)/2, (4 − 2)/2) = (2, 1). Both ✓, as the diagonals of a parallelogram bisect each other.
        (d) The distances from (2, 1) to the vertices are 4 (to K and M) and 3 (to L and N). They are not all equal, so no circle centred at (2, 1) passes through all four vertices. (A quadrilateral has a circumscribed circle only if it is cyclic; a non-square rhombus is not.)
      explanation: |
        Scoring (6 points). (a) 1 point for all four sides equal to 5; 1 point for diagonals 8 and 6. (b) 1 point for "rhombus, not a square" with the four-equal-sides reason and the unequal diagonals. (c) 1 point for the crossing point (2, 1) verified as both midpoints. (d) 1 point for the distances 4 and 3 from the centre; 1 point for concluding no such circle exists.
