week: 22
unit: 6
title: "Transformations as Functions and the Distance Formula"
topics: ["6.1", "6.2", "6.3", "6.4"]
guide: guides/week-22.md
guide_description: |
  Coordinate rules for reflections, rotations, translations and dilations, transformations as functions and their compositions, deciding whether a rule is rigid, the distance formula and midpoint, and the equation of a circle from its centre and radius. Worked examples, Try-it problems and a self-check.
flashcards_description: |
  28 cards on the coordinate rules, composition, classifying rules, the distance formula, midpoints and circle equations. Review them before the week 22 quiz.
flashcards:
  - front: Reflect across the x-axis → rule
    back: |
      (x, y) → (x, −y). Across the y-axis it is (x, y) → (−x, y).
    topic_code: "6.1"
  - front: Reflect across y = x → rule
    back: |
      (x, y) → (y, x). Across y = −x it is (x, y) → (−y, −x).
    topic_code: "6.1"
  - front: Rotate 90° counterclockwise about the origin → rule
    back: |
      (x, y) → (−y, x). Check on (1, 0): it goes to (0, 1).
    topic_code: "6.1"
  - front: Rotate 180° about the origin → rule
    back: |
      (x, y) → (−x, −y). Also the result of reflecting across both axes.
    topic_code: "6.1"
  - front: Rotate 270° counterclockwise (90° clockwise) → rule
    back: |
      (x, y) → (y, −x). Check on (1, 0): it goes to (0, −1).
    topic_code: "6.1"
  - front: Translate by (a, b) → rule
    back: |
      (x, y) → (x + a, y + b).
    topic_code: "6.1"
  - front: Reflect across the vertical line x = c → rule
    back: |
      (x, y) → (2c − x, y). Across y = c it is (x, y) → (x, 2c − y). Reflecting (5, 2) across x = 1 gives (−3, 2).
    topic_code: "6.1"
  - front: Rotate about a point other than the origin → method
    back: |
      Subtract the centre, apply the origin rule, add the centre back. Rotating (4, 5) by 90° about (2, 1) gives (−2, 3).
    topic_code: "6.1"
  - front: Transformation as a function → meaning
    back: |
      A rule (x, y) → (f(x, y), g(x, y)) assigning each point an image point. Composition applies one rule after another.
    topic_code: "6.2"
  - front: Composing rules → how to write the result
    back: |
      Apply the first rule, then substitute its output into the second. Rotate 90° then reflect across the x-axis gives (x, y) → (−y, −x), the reflection across y = −x.
    topic_code: "6.2"
  - front: Reflect across the x-axis then the y-axis → result
    back: |
      (x, y) → (−x, −y), a 180° rotation: two reflections across perpendicular lines make a half-turn.
    topic_code: "6.2"
  - front: Does the order of composition matter?
    back: |
      Usually yes. Translate by (3, 0) then rotate 180° gives (−x − 3, −y); rotate then translate gives (−x + 3, −y).
    topic_code: "6.2"
  - front: Dilation from the origin by k → rule
    back: |
      (x, y) → (kx, ky). Not rigid unless k = 1.
    topic_code: "6.3"
  - front: Rule (x, y) → (2x, y) → what type
    back: |
      A horizontal stretch: neither rigid (distances change) nor a dilation (angles change). (0,0)-(1,1) is √2 apart but the images are √5 apart.
    topic_code: "6.3"
  - front: How to test whether a rule is rigid
    back: |
      Pick two points, compute their distance, apply the rule, compute the image distance. Rigid rules keep every distance; one failure disproves it.
    topic_code: "6.3"
  - front: Rule (x, y) → (−x, y + 1) → what type
    back: |
      Rigid: a reflection across the y-axis followed by a translation (a glide reflection).
    topic_code: "6.3"
  - front: Rule (x, y) → (x, 0) → what type
    back: |
      A projection onto the x-axis: not rigid and not one-to-one (every point of a vertical line goes to the same image).
    topic_code: "6.3"
  - front: Distance formula
    back: |
      d = √((x₂ − x₁)² + (y₂ − y₁)²), the Pythagorean theorem on the horizontal and vertical legs. (1, 2) to (7, 10) is 10.
    topic_code: "6.4"
  - front: Midpoint formula
    back: |
      ((x₁ + x₂)/2, (y₁ + y₂)/2). The midpoint of (1, 2) and (7, 10) is (4, 6).
    topic_code: "6.4"
  - front: Classifying a triangle from coordinates
    back: |
      Compute the three side lengths; equal sides give isosceles or equilateral; a² + b² = c² gives a right angle. (0,0), (6,0), (3,4) is isosceles, not right.
    topic_code: "6.4"
  - front: Showing a quadrilateral is a rectangle with distances
    back: |
      Opposite sides equal (parallelogram) and diagonals equal. For (1,1), (5,3), (4,5), (0,3) the sides are √20, √5, √20, √5 and both diagonals are 5.
    topic_code: "6.4"
  - front: Testing collinearity with distances
    back: |
      If the two shorter distances add to the longest, the middle point is on the segment. (0,0), (4,3), (8,6) give 5 + 5 = 10.
    topic_code: "6.4"
  - front: Equation of a circle with centre (h, k) and radius r
    back: |
      (x − h)² + (y − k)² = r², the distance formula with the distance fixed at r.
    topic_code: "6.4"
  - front: Reading a circle's centre and radius from its equation
    back: |
      (x − 2)² + (y + 3)² = 25 has centre (2, −3) and radius 5; (x + 1)² + (y − 2)² = 10 has centre (−1, 2) and radius √10.
    topic_code: "6.4"
  - front: Is a point on, inside or outside a circle?
    back: |
      Substitute: equal to r² means on; less means inside; more means outside. For (x − 2)² + (y + 3)² = 25, (0, 0) gives 13, inside.
    topic_code: "6.4"
  - front: Circle from its centre and one point on it
    back: |
      r = distance from the centre to the point. Centre (1, 1) through (4, 5): r = 5, (x − 1)² + (y − 1)² = 25.
    topic_code: "6.4"
  - front: Circle from the endpoints of a diameter
    back: |
      Centre = midpoint; radius = half the diameter's length. Endpoints (−2, 3) and (6, 9): centre (2, 6), radius 5.
    topic_code: "6.4"
  - front: Pythagorean theorem behind the distance formula (review)
    back: |
      The segment between two points is the hypotenuse of a right triangle whose legs are the differences in x and in y.
    topic_code: "3.14"
quiz:
  description: |
    25 questions · about 40 minutes · Coordinate rules for rigid motions and dilations, composition and classification of rules, the distance and midpoint formulas and circle equations, with review of transformations from Unit 1, dilations, the Pythagorean theorem and quadrilateral properties. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: geo-u06-w22-q01
      type: multiple_choice
      topic_code: "6.1"
      source: "IM Geometry, Unit 6, Lesson 1"
      points: 1
      stimulus: |
        Figure description: triangle PQR has vertices P = (2, 1), Q = (6, 1) and R = (6, 4) on a coordinate grid.
      prompt: |
        What are the vertices of the image of triangle PQR under a 90° counterclockwise rotation about the origin?
      options:
        - "P′ = (−1, 2), Q′ = (−1, 6), R′ = (−4, 6)"
        - "P′ = (1, −2), Q′ = (1, −6), R′ = (4, −6)"
        - "P′ = (−2, −1), Q′ = (−6, −1), R′ = (−6, −4)"
        - "P′ = (1, 2), Q′ = (1, 6), R′ = (4, 6)"
      option_explanations:
        - |
          Correct. The rule (x, y) → (−y, x) sends (2, 1) to (−1, 2), (6, 1) to (−1, 6) and (6, 4) to (−4, 6).
        - |
          (y, −x) is the clockwise (270° counterclockwise) rotation.
        - |
          (x, y) → (−x, −y) is the 180° rotation about the origin, not a reflection across the y-axis.
        - |
          (y, x) is the reflection across y = x, not a rotation.
      answer: 0

    - slug: geo-u06-w22-q02
      type: multiple_choice
      topic_code: "6.4"
      source: "IM Geometry, Unit 6, Lesson 4"
      points: 1
      stimulus: |
        Figure description: triangle PQR has vertices P = (2, 1), Q = (6, 1) and R = (6, 4) on a coordinate grid.
      prompt: |
        What is the length of PR?
      options:
        - "5"
        - "√7"
        - "7"
        - "√(4² + 3²) = 25"
      option_explanations:
        - |
          Correct. PR = √((6 − 2)² + (4 − 1)²) = √(16 + 9) = 5.
        - |
          √7 adds the differences (4 + 3) under the root instead of their squares.
        - |
          7 is the sum of the legs 4 and 3, not the hypotenuse.
        - |
          25 is the square of the distance; the distance is √25 = 5.
      answer: 0

    - slug: geo-u06-w22-q03
      type: multiple_choice
      topic_code: "6.4"
      source: "IM Geometry, Unit 6, Lesson 4"
      points: 1
      stimulus: |
        Figure description: triangle PQR has vertices P = (2, 1), Q = (6, 1) and R = (6, 4) on a coordinate grid.
      prompt: |
        Which equation describes the circle with centre P that passes through R?
      options:
        - "(x − 2)² + (y − 1)² = 25"
        - "(x + 2)² + (y + 1)² = 25"
        - "(x − 2)² + (y − 1)² = 5"
        - "(x − 6)² + (y − 4)² = 25"
      option_explanations:
        - |
          Correct. The centre is (2, 1) and the radius is PR = 5, so r² = 25.
        - |
          The signs are reversed: (x + 2)² corresponds to a centre at x = −2.
        - |
          The right side must be r² = 25, not r = 5.
        - |
          This circle is centred at R = (6, 4), not at P = (2, 1), so it is the wrong centre.
      answer: 0

    - slug: geo-u06-w22-q04
      type: multiple_choice
      topic_code: "6.1"
      source: "IM Geometry, Unit 6, Lesson 1"
      points: 1
      prompt: |
        What is the image of (−3, 5) under a reflection across the line y = x?
      options:
        - "(5, −3)"
        - "(3, −5)"
        - "(−5, 3)"
        - "(−3, −5)"
      option_explanations:
        - |
          Correct. Reflecting across y = x swaps the coordinates: (x, y) → (y, x).
        - |
          (3, −5) is the 180° rotation image (−x, −y).
        - |
          (−5, 3) is the image under reflection across y = −x, which is (−y, −x).
        - |
          (−3, −5) is the reflection across the x-axis.
      answer: 0

    - slug: geo-u06-w22-q05
      type: multiple_choice
      topic_code: "6.1"
      source: "IM Geometry, Unit 6, Lesson 1"
      points: 1
      prompt: |
        What is the image of (7, 2) under a 90° counterclockwise rotation about the point (3, 2)?
      options:
        - "(3, 6)"
        - "(−2, 7)"
        - "(3, −2)"
        - "(7, 6)"
      option_explanations:
        - |
          Correct. Subtract the centre: (4, 0); rotate: (0, 4); add the centre: (3, 6).
        - |
          (−2, 7) rotates about the origin instead of about (3, 2).
        - |
          (3, −2) is the clockwise rotation about (3, 2).
        - |
          (7, 6) is a translation by (0, 4), not a rotation.
      answer: 0

    - slug: geo-u06-w22-q06
      type: multiple_choice
      topic_code: "6.2"
      source: "IM Geometry, Unit 6, Lesson 2"
      points: 1
      prompt: |
        Which single rule describes "reflect across the y-axis, then rotate 90° counterclockwise about the origin"?
      options:
        - "(x, y) → (−y, −x)"
        - "(x, y) → (y, x)"
        - "(x, y) → (−y, x)"
        - "(x, y) → (y, −x)"
      option_explanations:
        - |
          Correct. (x, y) → (−x, y) → (−y, −x) after applying the rotation rule (a, b) → (−b, a) to (−x, y). This is the reflection across y = −x.
        - |
          (y, x) is the reflection across y = x; that would come from rotating first and then reflecting.
        - |
          (−y, x) is the rotation alone, without the reflection.
        - |
          (y, −x) is the clockwise rotation, which omits the reflection step.
      answer: 0

    - slug: geo-u06-w22-q07
      type: multiple_choice
      topic_code: "6.2"
      source: "IM Geometry, Unit 6, Lesson 2"
      points: 1
      prompt: |
        A transformation is given by the rule (x, y) → (x − 4, y + 6). What is it?
      options:
        - "A translation 4 units left and 6 units up"
        - "A translation 4 units right and 6 units down"
        - "A reflection across the line x = 2"
        - "A dilation with scale factor −4"
      option_explanations:
        - |
          Correct. Subtracting 4 from x moves left; adding 6 to y moves up.
        - |
          The signs are reversed; x − 4 is a move to the left.
        - |
          A reflection across x = 2 would be (x, y) → (4 − x, y), changing the sign of x.
        - |
          A dilation multiplies coordinates; this rule adds constants.
      answer: 0

    - slug: geo-u06-w22-q08
      type: multiple_choice
      topic_code: "6.3"
      source: "IM Geometry, Unit 6, Lesson 3"
      points: 1
      prompt: |
        Which rule is NOT a rigid transformation?
      options:
        - "(x, y) → (3x, 3y)"
        - "(x, y) → (y, −x)"
        - "(x, y) → (x + 1, y − 1)"
        - "(x, y) → (−x, y)"
      option_explanations:
        - |
          Correct. This dilation triples every distance, so it is not rigid.
        - |
          (y, −x) is a 90° clockwise rotation, which preserves distances.
        - |
          A translation is a rigid transformation and preserves every distance, so this is not the exception.
        - |
          A reflection across the y-axis preserves distances.
      answer: 0

    - slug: geo-u06-w22-q09
      type: multiple_choice
      topic_code: "6.3"
      source: "IM Geometry, Unit 6, Lesson 3"
      points: 1
      prompt: |
        The rule (x, y) → (x, 3y) is applied to the square with vertices (0, 0), (1, 0), (1, 1), (0, 1). Which statement is correct?
      options:
        - "The image is a 1 by 3 rectangle, so the rule is neither rigid nor a dilation"
        - "The image is a 3 by 3 square, so the rule is a dilation"
        - "The image is congruent to the original, so the rule is rigid"
        - "The image is a 3 by 1 rectangle, which is a dilation"
      option_explanations:
        - |
          Correct. Only the y-coordinates are tripled, so the image is (0,0), (1,0), (1,3), (0,3): a rectangle. Shapes change, so it is not a dilation, and distances change, so it is not rigid.
        - |
          A dilation would triple both coordinates; here x is unchanged.
        - |
          The vertical sides become 3 units long, so distances are not preserved.
        - |
          The rectangle is 1 wide and 3 tall, and a dilation never changes a square into a non-square rectangle.
      answer: 0

    - slug: geo-u06-w22-q10
      type: multiple_choice
      topic_code: "6.4"
      source: "IM Geometry, Unit 6, Lesson 4"
      points: 1
      prompt: |
        What is the distance between (−4, 6) and (8, 1)?
      options:
        - "13"
        - "√17"
        - "17"
        - "√119"
      option_explanations:
        - |
          Correct. √((8 + 4)² + (1 − 6)²) = √(144 + 25) = √169 = 13.
        - |
          √17 adds the differences 12 and 5 under the root without squaring.
        - |
          17 is 12 + 5, the sum of the two legs; the hypotenuse is √(144 + 25) = 13, not the sum.
        - |
          √119 is √(144 − 25), subtracting instead of adding the squares.
      answer: 0

    - slug: geo-u06-w22-q11
      type: multiple_choice
      topic_code: "6.4"
      source: "IM Geometry, Unit 6, Lesson 4"
      points: 1
      prompt: |
        What are the centre and radius of the circle (x + 5)² + (y − 2)² = 18?
      options:
        - "Centre (−5, 2), radius √18 = 3√2"
        - "Centre (5, −2), radius 18"
        - "Centre (−5, 2), radius 9"
        - "Centre (5, −2), radius √18"
      option_explanations:
        - |
          Correct. (x + 5)² = (x − (−5))², so h = −5; k = 2; r² = 18 gives r = √18 ≈ 4.24.
        - |
          The signs of the centre are reversed, and 18 is r², not r.
        - |
          9 is half of 18, which is not how the radius is found; r = √18.
        - |
          The radius is right but the centre's signs are reversed.
      answer: 0

    - slug: geo-u06-w22-q12
      type: multiple_choice
      topic_code: "6.4"
      source: "IM Geometry, Unit 6, Lesson 4"
      points: 1
      prompt: |
        Is the point (6, −1) on, inside or outside the circle (x − 3)² + (y + 5)² = 25?
      options:
        - "On the circle, because 3² + 4² = 25"
        - "Inside, because 3 + 4 < 25"
        - "Outside, because (6 + 3)² + (−1 − 5)² = 117 > 25"
        - "Inside, because 6 and −1 are both less than 25"
      option_explanations:
        - |
          Correct. Substituting gives (6 − 3)² + (−1 + 5)² = 9 + 16 = 25, equal to r², so the point is on the circle.
        - |
          The test compares the sum of squared differences, not the plain differences, with r².
        - |
          This substitutes with the wrong signs; the centre is (3, −5), so the differences are 3 and 4.
        - |
          The coordinates themselves are not compared with r²; the squared distance from the centre is.
      answer: 0

    - slug: geo-u06-w22-q13
      type: multiple_choice
      topic_code: "1.11"
      source: "IM Geometry, Unit 1, Lesson 11"
      points: 1
      prompt: |
        Review. Why does the rule (x, y) → (x, −y) deserve the name "reflection across the x-axis"?
      options:
        - "The x-axis is the perpendicular bisector of the segment joining (x, y) to (x, −y): the segment is vertical and the axis cuts it at its midpoint (x, 0)"
        - "Because it changes only one coordinate"
        - "Because it is a rotation by 180° about the x-axis"
        - "Because the image is always farther from the origin"
      option_explanations:
        - |
          Correct. That is the definition of reflection: the mirror line is the perpendicular bisector of each point-image segment.
        - |
          Changing one coordinate is a consequence, not the definition; (x, y) → (x, 2y) also changes one coordinate and is not a reflection.
        - |
          Rotations in the plane are about points, not lines; the rule fixes every point of the x-axis, which a half-turn about a point does not.
        - |
          Distances from the origin are unchanged: √(x² + y²) is the same for both points.
      answer: 0

    - slug: geo-u06-w22-q14
      type: multiple_choice
      topic_code: "2.13"
      source: "IM Geometry, Unit 2, Lesson 13"
      points: 1
      prompt: |
        Review. Quadrilateral ABCD has A = (0, 0), B = (6, 2), C = (8, 7), D = (2, 5). Using distances, which conclusion is justified?
      options:
        - "AB = CD = √40 and BC = DA = √29, so ABCD is a parallelogram (both pairs of opposite sides congruent)"
        - "All four sides are equal, so ABCD is a rhombus"
        - "AB = CD, so ABCD is a parallelogram"
        - "The diagonals are equal, so ABCD is a rectangle"
      option_explanations:
        - |
          Correct. AB² = 36 + 4 = 40, CD² = 36 + 4 = 40, BC² = 4 + 25 = 29, DA² = 4 + 25 = 29; both pairs of opposite sides congruent is a converse proved in Unit 2.
        - |
          √40 ≠ √29, so the sides are not all equal.
        - |
          One pair of congruent opposite sides is not enough (an isosceles trapezoid has that too).
        - |
          AC² = 64 + 49 = 113 and BD² = 16 + 9 = 25; the diagonals are not equal.
      answer: 0

    - slug: geo-u06-w22-q15
      type: multi_select
      topic_code: "6.2"
      source: "IM Geometry, Unit 6, Lesson 2"
      points: 2
      partial_credit: true
      prompt: |
        Which compositions produce the rule (x, y) → (−x, −y)? Select all that apply.
      options:
        - "Reflect across the x-axis, then reflect across the y-axis"
        - "Rotate 90° counterclockwise about the origin twice"
        - "Reflect across y = x, then reflect across y = −x"
        - "Reflect across the x-axis twice"
        - "Rotate 90° counterclockwise, then reflect across the x-axis"
      option_explanations:
        - |
          Yes: reflecting across the x-axis sends (x, y) to (x, −y), then reflecting across the y-axis gives (−x, −y).
        - |
          Yes: (x, y) → (−y, x) → (−x, −y); two quarter turns make a half-turn.
        - |
          Yes: (x, y) → (y, x) → (−x, −y); reflections across perpendicular lines through the origin compose to a half-turn.
        - |
          No: reflecting twice across the same line returns every point to itself.
        - |
          No: (x, y) → (−y, x) → (−y, −x), the reflection across y = −x.
      answer: [0, 1, 2]

    - slug: geo-u06-w22-q16
      type: multi_select
      topic_code: "3.3"
      source: "IM Geometry, Unit 3, Lesson 3"
      points: 2
      partial_credit: true
      prompt: |
        Review. The rule (x, y) → (2x, 2y) is applied to the triangle with vertices (0, 0), (3, 0), (0, 4). Which statements are true? Select all that apply.
      options:
        - "It is a dilation with centre (0, 0) and scale factor 2"
        - "The image triangle has vertices (0, 0), (6, 0), (0, 8)"
        - "The image's hypotenuse is 10"
        - "The image's area is twice the original's"
        - "The image's angles equal the original's"
      option_explanations:
        - |
          True: multiplying both coordinates by 2 is the dilation from the origin with k = 2.
        - |
          True: each vertex's coordinates are doubled.
        - |
          True: the original hypotenuse is 5 and lengths double.
        - |
          False: area scales by k² = 4 (from 6 to 24).
        - |
          True: a dilation preserves every angle measure, so the right angle at R is still a right angle in the image.
      answer: [0, 1, 2, 4]

    - slug: geo-u06-w22-q17
      type: true_false
      topic_code: "6.3"
      source: "IM Geometry, Unit 6, Lesson 3"
      points: 1
      prompt: |
        True or false: the rule (x, y) → (x + 2, −y) is a rigid transformation.
      answer: true
      explanation: |
        True. It is a reflection across the x-axis followed by a translation by (2, 0), a glide reflection; both steps preserve distances, so the composition does.

    - slug: geo-u06-w22-q18
      type: true_false
      topic_code: "1.14"
      source: "IM Geometry, Unit 1, Lesson 14"
      points: 1
      prompt: |
        Review. True or false: under the rule (x, y) → (−y, x), every point ends up the same distance from the origin as it started, which is consistent with the rule being a rotation about the origin.
      answer: true
      explanation: |
        True. The image (−y, x) has distance √(y² + x²) from the origin, the same as (x, y); a rotation keeps every point on its circle about the centre.

    - slug: geo-u06-w22-q19
      type: fill_blank
      topic_code: "6.4"
      source: "IM Geometry, Unit 6, Lesson 4"
      points: 1
      prompt: |
        The circle with centre (h, k) and radius r has equation (x − h)² + (y − k)² = ____.
      answer: ["r²", "r^2", "r squared", "r*r"]
      explanation: |
        The equation says the distance from (x, y) to (h, k) is r; squaring both sides of the distance formula gives r².

    - slug: geo-u06-w22-q20
      type: fill_blank
      topic_code: "3.14"
      source: "IM Geometry, Unit 3, Lesson 14"
      points: 1
      prompt: |
        Review. The distance formula is the ____ theorem applied to a right triangle whose legs are the differences in the x- and y-coordinates.
      answer: ["Pythagorean", "Pythagoras", "Pythagoras'", "Pythagoras's"]
      explanation: |
        The segment between two points is the hypotenuse; its legs are horizontal and vertical, with lengths |x₂ − x₁| and |y₂ − y₁|.

