week: 23
unit: 6
title: "Circles, Completing the Square and Parabolas"
topics: ["6.5", "6.6", "6.7", "6.8"]
guide: guides/week-23.md
guide_description: |
  Expanding and recognising circle equations, completing the square to recover a centre and radius (including non-circles), the focus–directrix definition of a parabola and its equation from the distance formula, and reading vertex, focus and directrix from an equation. Worked examples, Try-it problems and a self-check.
flashcards_description: |
  28 cards on expanded circle equations, completing the square, the parabola definition and its equation, vertex, focus, directrix and direction of opening. Review them before the week 23 quiz.
flashcards:
  - front: Expanded (general) form of a circle equation
    back: |
      x² + y² + Dx + Ey + F = 0, with equal coefficients on x² and y² and no xy term. The centre is (−D/2, −E/2).
    topic_code: "6.5"
  - front: Expand (x − 3)² + (y + 2)² = 25
    back: |
      x² − 6x + 9 + y² + 4y + 4 = 25, so x² + y² − 6x + 4y − 12 = 0.
    topic_code: "6.5"
  - front: Why x² − y² + 2x = 7 is not a circle
    back: |
      The y² term has a minus sign. A circle needs x² and y² with the same positive coefficient and no xy term.
    topic_code: "6.5"
  - front: Why x² + y² + 4xy = 10 is not a circle
    back: |
      An xy term never appears when (x − h)² + (y − k)² = r² is expanded.
    topic_code: "6.5"
  - front: Is a point inside, on or outside a circle given in expanded form?
    back: |
      Substitute. The left side equals (distance to centre)² − r²: negative means inside, zero means on, positive means outside.
    topic_code: "6.5"
  - front: Completing the square → the rule
    back: |
      x² + bx = (x + b/2)² − (b/2)². Half the coefficient of x, squared, is added and subtracted.
    topic_code: "6.6"
  - front: Complete the square on x² + 8x
    back: |
      (x + 4)² − 16. Check: (x + 4)² = x² + 8x + 16.
    topic_code: "6.6"
  - front: Complete the square on x² − 6x
    back: |
      (x − 3)² − 9. Half of −6 is −3, and (−3)² = 9.
    topic_code: "6.6"
  - front: Complete the square on y² + 5y
    back: |
      (y + 5/2)² − 25/4. Odd coefficients give fractions; keep them as fractions.
    topic_code: "6.6"
  - front: Centre and radius of x² + y² + 8x − 10y + 5 = 0
    back: |
      (x + 4)² − 16 + (y − 5)² − 25 = −5, so (x + 4)² + (y − 5)² = 36. Centre (−4, 5), radius 6.
    topic_code: "6.6"
  - front: First step when the equation is 2x² + 2y² − 12x + 4y − 6 = 0
    back: |
      Divide by 2 so x² and y² have coefficient 1: x² + y² − 6x + 2y − 3 = 0. Then complete both squares.
    topic_code: "6.6"
  - front: What x² + y² + 2x + 4y + 10 = 0 describes
    back: |
      (x + 1)² + (y + 2)² = −5. A sum of squares is never negative, so no point satisfies it.
    topic_code: "6.6"
  - front: What (x − 1)² + (y + 2)² = 0 describes
    back: |
      Only the single point (1, −2), where both squares are zero. Radius 0 is not a circle.
    topic_code: "6.6"
  - front: Common error when completing the square
    back: |
      Adding (b/2)² without subtracting it. x² + 8x equals (x + 4)² − 16, not (x + 4)².
    topic_code: "6.6"
  - front: Parabola → definition
    back: |
      The set of points equidistant from a fixed point (the focus) and a fixed line (the directrix).
    topic_code: "6.7"
  - front: Distance from (x, y) to the horizontal line y = c
    back: |
      |y − c|, the vertical gap. No slant distance and no formula beyond subtraction.
    topic_code: "6.7"
  - front: Derive the parabola with focus (0, 2) and directrix y = −2
    back: |
      √(x² + (y − 2)²) = |y + 2|. Square: x² + y² − 4y + 4 = y² + 4y + 4, so x² = 8y, or y = x²/8.
    topic_code: "6.7"
  - front: Parabola with focus (a, b) and directrix y = c → equation
    back: |
      y = ((x − a)² + b² − c²) / (2(b − c)). Rederive it each time: set the distances equal and square.
    topic_code: "6.7"
  - front: Vertex of a parabola → where it is
    back: |
      Halfway between the focus and the directrix on the axis of symmetry: (a, (b + c)/2) for focus (a, b) and directrix y = c.
    topic_code: "6.7"
  - front: Which way a parabola opens
    back: |
      Toward the focus, away from the directrix. Focus above the directrix means it opens up.
    topic_code: "6.8"
  - front: Axis of symmetry of a parabola with a horizontal directrix
    back: |
      The vertical line through the focus, x = a. The parabola is its own reflection across it.
    topic_code: "6.8"
  - front: Focus and directrix of y = (x − h)²/(4p) + k
    back: |
      Vertex (h, k), focus (h, k + p), directrix y = k − p. For y = (x − 2)²/8 + 1: p = 2, focus (2, 3), directrix y = −1.
    topic_code: "6.8"
  - front: Effect of moving the focus closer to the directrix
    back: |
      A narrower parabola. The coefficient of (x − a)² is 1/(2(b − c)), which grows as b − c shrinks.
    topic_code: "6.8"
  - front: Two easy points to plot on a parabola
    back: |
      The points level with the focus, 2p to either side of it: (h ± 2p, k + p). They are as far from the focus as from the directrix.
    topic_code: "6.8"
  - front: Check whether a point is on a parabola without the equation
    back: |
      Compute its distance to the focus and its vertical distance to the directrix. On the parabola only if they are equal.
    topic_code: "6.8"
  - front: Why a satellite dish is a parabola
    back: |
      Signals arriving parallel to the axis reflect to the focus, where the receiver sits; the equidistance property makes every path the same length.
    topic_code: "6.8"
  - front: Parabola with vertex (0, 0) through (6, 3) with a horizontal directrix
    back: |
      y = x²/(4p) with 3 = 36/(4p), so p = 3. Focus (0, 3), directrix y = −3.
    topic_code: "6.8"
  - front: Read the centre of x² + y² + 10x − 2y + 1 = 0 at a glance
    back: |
      (−5, 1): halve the x and y coefficients and change the signs. Complete the square to get the radius, 5.
    topic_code: "6.6"
quiz:
  description: |
    25 questions · about 40 minutes · Expanded circle equations, completing the square, the focus–directrix definition of a parabola and its equation, vertex, focus and direction, with review of the distance formula and midpoints, the Perpendicular Bisector Theorem, scaling solids, cylinder volume and trigonometric ratios. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: geo-u06-w23-q01
      type: multiple_choice
      topic_code: "6.6"
      source: "IM Geometry, Unit 6, Lesson 6"
      points: 1
      stimulus: |
        Figure description: the circle with equation x² + y² − 6x + 4y − 12 = 0 is drawn on a coordinate grid.
      prompt: |
        What is the centre of the circle?
      options:
        - "(6, −4)"
        - "(−3, 2)"
        - "(3, −2)"
        - "(−6, 4)"
      option_explanations:
        - |
          (6, −4) uses the full coefficients; the centre uses half of each, with the sign changed.
        - |
          The signs are reversed: (x − 3)² means h = 3 and (y + 2)² means k = −2.
        - |
          Correct. Completing the square gives (x − 3)² + (y + 2)² = 25, so the centre is (3, −2).
        - |
          (−6, 4) uses the full coefficients without halving and with the wrong signs.
      answer: 2

    - slug: geo-u06-w23-q02
      type: multiple_choice
      topic_code: "6.6"
      source: "IM Geometry, Unit 6, Lesson 6"
      points: 1
      stimulus: |
        Figure description: the circle with equation x² + y² − 6x + 4y − 12 = 0 is drawn on a coordinate grid.
      prompt: |
        What is the radius of the circle?
      options:
        - "5"
        - "25"
        - "12"
        - "√12"
      option_explanations:
        - |
          Correct. (x − 3)² + (y + 2)² = 12 + 9 + 4 = 25, so r² = 25 and r = 5.
        - |
          25 is r², the right side of the completed equation; the radius is its square root.
        - |
          12 is just the constant moved to the right; the 9 and 4 from completing the squares must be added.
        - |
          √12 forgets to add the 9 and the 4 that completing the two squares contributes.
      answer: 0

    - slug: geo-u06-w23-q03
      type: multiple_choice
      topic_code: "6.5"
      source: "IM Geometry, Unit 6, Lesson 5"
      points: 1
      stimulus: |
        Figure description: the circle with equation x² + y² − 6x + 4y − 12 = 0 is drawn on a coordinate grid.
      prompt: |
        Which point lies on the circle?
      options:
        - "(3, 2)"
        - "(0, 0)"
        - "(1, 1)"
        - "(3, 3)"
      option_explanations:
        - |
          (3, 2) is 4 units from the centre (3, −2), inside the circle of radius 5; substituting gives −9.
        - |
          Substituting (0, 0) gives −12, not 0; the origin is inside the circle.
        - |
          Substituting (1, 1) gives 1 + 1 − 6 + 4 − 12 = −12, so it is inside, not on, the circle.
        - |
          Correct. 9 + 9 − 18 + 12 − 12 = 0, and (3, 3) is 5 units directly above the centre (3, −2).
      answer: 3

    - slug: geo-u06-w23-q04
      type: multiple_choice
      topic_code: "6.5"
      source: "IM Geometry, Unit 6, Lesson 5"
      points: 1
      prompt: |
        Which equation is the expanded form of (x + 2)² + (y − 5)² = 9?
      options:
        - "x² + y² − 4x + 10y + 20 = 0"
        - "x² + y² + 4x − 10y + 20 = 0"
        - "x² + y² + 2x − 5y + 20 = 0"
        - "x² + y² + 4x − 10y − 9 = 0"
      option_explanations:
        - |
          The signs of the linear terms are reversed; (x + 2)² gives +4x and (y − 5)² gives −10y.
        - |
          Correct. x² + 4x + 4 + y² − 10y + 25 − 9 = 0 collects to x² + y² + 4x − 10y + 20 = 0.
        - |
          The linear coefficients are twice 2 and twice −5, so 4x and −10y, not 2x and −5y.
        - |
          The constants 4 and 25 from the two squares were dropped; 4 + 25 − 9 = 20.
      answer: 1

    - slug: geo-u06-w23-q05
      type: multiple_choice
      topic_code: "6.6"
      source: "IM Geometry, Unit 6, Lesson 6"
      points: 1
      prompt: |
        Which expression equals x² + 6x?
      options:
        - "(x + 6)² − 36"
        - "(x + 3)²"
        - "(x + 3)² + 9"
        - "(x + 3)² − 9"
      option_explanations:
        - |
          The number in the bracket is half the coefficient, 3, not the whole coefficient 6.
        - |
          (x + 3)² is x² + 6x + 9; the extra 9 must be subtracted.
        - |
          Adding 9 after squaring gives x² + 6x + 18, which is 18 too much.
        - |
          Correct. (x + 3)² = x² + 6x + 9, so subtracting 9 leaves x² + 6x.
      answer: 3

    - slug: geo-u06-w23-q06
      type: multiple_choice
      topic_code: "6.7"
      source: "IM Geometry, Unit 6, Lesson 7"
      points: 1
      prompt: |
        What is the equation of the parabola with focus (0, 3) and directrix y = −3?
      options:
        - "y = x²/6"
        - "y = x²/3"
        - "y = x²/12"
        - "x = y²/12"
      option_explanations:
        - |
          The denominator is 2(b − c) = 2 · 6 = 12, not b − c = 6.
        - |
          The denominator is 4p where p = 3 is the focus-to-vertex distance, giving 12, not 3.
        - |
          Correct. √(x² + (y − 3)²) = |y + 3| squares to x² = 12y, so y = x²/12.
        - |
          x = y²/12 opens sideways, which needs a vertical directrix; this directrix is horizontal.
      answer: 2

    - slug: geo-u06-w23-q07
      type: multiple_choice
      topic_code: "6.7"
      source: "IM Geometry, Unit 6, Lesson 7"
      points: 1
      prompt: |
        Which point is the same distance from F = (0, 2) as from the line y = −2?
      options:
        - "(4, 2)"
        - "(0, 1)"
        - "(4, 4)"
        - "(2, 2)"
      option_explanations:
        - |
          Correct. (4, 2) is 4 from F and 4 above the line y = −2, so it is on the parabola y = x²/8.
        - |
          (0, 1) is 1 from F but 3 from the line y = −2, so it is not equidistant.
        - |
          (4, 4) is √20 ≈ 4.47 from F but 6 above the line; the distances differ.
        - |
          (2, 2) is 2 from F but 4 from the line y = −2, so the distances differ.
      answer: 0

    - slug: geo-u06-w23-q08
      type: multiple_choice
      topic_code: "6.8"
      source: "IM Geometry, Unit 6, Lesson 8"
      points: 1
      prompt: |
        A parabola has focus (3, 1) and directrix y = −3. What is its vertex?
      options:
        - "(3, 1)"
        - "(3, −1)"
        - "(3, −3)"
        - "(0, −1)"
      option_explanations:
        - |
          (3, 1) is the focus itself, which is never on the parabola.
        - |
          Correct. The vertex is halfway between the focus and the directrix: (3, (1 + (−3))/2) = (3, −1).
        - |
          (3, −3) lies on the directrix, which never meets the parabola.
        - |
          The vertex shares the focus's x-coordinate, 3, because the axis of symmetry is x = 3.
      answer: 1

    - slug: geo-u06-w23-q09
      type: multiple_choice
      topic_code: "6.8"
      source: "IM Geometry, Unit 6, Lesson 8"
      points: 1
      prompt: |
        What is the focus of the parabola y = (x − 2)²/8 + 1?
      options:
        - "(4, 1)"
        - "(2, 1)"
        - "(2, −1)"
        - "(2, 3)"
      option_explanations:
        - |
          The focus lies on the axis of symmetry x = 2, so its x-coordinate cannot be 4.
        - |
          (2, 1) is the vertex, not the focus; the focus is p = 2 units above it.
        - |
          (2, −1) is on the directrix y = −1, which is 2 below the vertex; the focus is 2 above it.
        - |
          Correct. The vertex is (2, 1) and 4p = 8 gives p = 2, so the focus is 2 above the vertex at (2, 3).
      answer: 3

    - slug: geo-u06-w23-q10
      type: multiple_choice
      topic_code: "6.8"
      source: "IM Geometry, Unit 6, Lesson 8"
      points: 1
      prompt: |
        A parabola has focus (1, −4) and directrix y = 0. Which way does it open, and what is its vertex?
      options:
        - "To the right, vertex (1, 0)"
        - "Downward, vertex (1, −4)"
        - "Downward, vertex (1, −2)"
        - "Upward, vertex (1, −2)"
      option_explanations:
        - |
          A horizontal directrix gives an up-or-down parabola, never a sideways one.
        - |
          The vertex is halfway between focus and directrix, not at the focus.
        - |
          Correct. The focus is below the directrix, so the parabola opens down; the vertex is halfway, at (1, −2).
        - |
          A parabola opens toward its focus; the focus (1, −4) is below the directrix, so it opens down.
      answer: 2

    - slug: geo-u06-w23-q11
      type: multiple_choice
      topic_code: "6.6"
      source: "IM Geometry, Unit 6, Lesson 6"
      points: 1
      prompt: |
        What does the equation x² + y² + 2x + 4y + 10 = 0 describe?
      options:
        - "A circle of radius √5"
        - "No points at all"
        - "A circle of radius 5"
        - "The single point (−1, −2)"
      option_explanations:
        - |
          The right side is −5, not 5; a negative right side means there are no points.
        - |
          Correct. Completing the square gives (x + 1)² + (y + 2)² = −5, and a sum of squares cannot be negative.
        - |
          The constant 10 is not r²; after completing the square the right side is 1 + 4 − 10 = −5.
        - |
          A single point would need a right side of exactly 0; here it is −5.
      answer: 1

    - slug: geo-u06-w23-q12
      type: multiple_choice
      topic_code: "5.6"
      source: "IM Geometry, Unit 5, Lesson 6"
      points: 1
      prompt: |
        Review. A solid of volume 10 cm³ is dilated by a scale factor of 3. What is the volume of the image?
      options:
        - "270 cm³"
        - "90 cm³"
        - "810 cm³"
        - "30 cm³"
      option_explanations:
        - |
          Correct. Volume scales by k³ = 27, and 10 × 27 = 270 cm³.
        - |
          90 scales by k² = 9, which is how areas change, not volumes.
        - |
          810 uses k⁴ = 81; volume is three-dimensional, so the factor is k³ = 27.
        - |
          30 scales by k, which is how lengths change, not volumes.
      answer: 0

    - slug: geo-u06-w23-q13
      type: multiple_choice
      topic_code: "6.4"
      source: "IM Geometry, Unit 6, Lesson 4"
      points: 1
      prompt: |
        Review. What is the distance between (−2, 5) and (4, −3)?
      options:
        - "√28"
        - "10"
        - "14"
        - "√52"
      option_explanations:
        - |
          √28 adds the changes 6 + 8 = 14 and then doubles; the changes must be squared before adding.
        - |
          Correct. The horizontal change is 6 and the vertical change is 8, so the distance is √(36 + 64) = 10.
        - |
          14 is 6 + 8, the sum of the changes, not the hypotenuse of the right triangle they form.
        - |
          √52 comes from using changes of 6 and 4; the vertical change from 5 to −3 is 8, not 4.
      answer: 1

    - slug: geo-u06-w23-q14
      type: multi_select
      topic_code: "6.5"
      source: "IM Geometry, Unit 6, Lesson 5"
      points: 2
      partial_credit: true
      prompt: |
        Which equations describe a circle? Select all that apply.
      options:
        - "3x² + 3y² + 6x − 12y = 0"
        - "(x − 1)² + (y + 2)² = 0"
        - "x² + y² − 8x + 1 = 0"
        - "x² + y² + 4xy = 10"
        - "x² − y² + 2x = 7"
      option_explanations:
        - |
          Yes: dividing by 3 gives x² + y² + 2x − 4y = 0, or (x + 1)² + (y − 2)² = 5.
        - |
          No: a right side of 0 is satisfied only by the single point (1, −2), not a circle.
        - |
          Yes: completing the square gives (x − 4)² + y² = 15, a circle with radius √15.
        - |
          No: an xy term never comes from expanding (x − h)² + (y − k)².
        - |
          No: the y² term is negative, so this is not a sum of two squares.
      answer: [0, 2]

    - slug: geo-u06-w23-q15
      type: multi_select
      topic_code: "2.8"
      source: "IM Geometry, Unit 2, Lesson 8"
      points: 2
      partial_credit: true
      prompt: |
        Review. Which points are equidistant from A = (0, 0) and B = (6, 0)? Select all that apply.
      options:
        - "(3, −2)"
        - "(3, 5)"
        - "(6, 3)"
        - "(3, 0)"
        - "(2, 3)"
      option_explanations:
        - |
          Yes: every point with x = 3 is on the perpendicular bisector, whichever side of AB it is on.
        - |
          Yes: it lies on x = 3, the perpendicular bisector of AB, so it is equidistant from A and B.
        - |
          No: (6, 3) is 3 from B but √(36 + 9) = √45 from A, so the distances differ.
        - |
          Yes: (3, 0) is the midpoint of AB, 3 from each endpoint.
        - |
          No: it is √13 from A and √25 = 5 from B; it is not on the line x = 3.
      answer: [0, 1, 3]

    - slug: geo-u06-w23-q16
      type: true_false
      topic_code: "6.7"
      source: "IM Geometry, Unit 6, Lesson 7"
      points: 1
      prompt: |
        True or false: the vertex of a parabola is the point on the axis of symmetry halfway between the focus and the directrix.
      answer: true
      explanation: |
        True. The vertex is on the parabola, so it is equidistant from the focus and the directrix; the only such point on the axis is the midpoint between them.

    - slug: geo-u06-w23-q17
      type: true_false
      topic_code: "4.8"
      source: "IM Geometry, Unit 4, Lesson 8"
      points: 1
      prompt: |
        Review. True or false: in any right triangle, the sine of one acute angle equals the cosine of the other acute angle.
      answer: true
      explanation: |
        True. The two acute angles are complementary, and the side opposite one is adjacent to the other, so sin θ = cos(90° − θ).

    - slug: geo-u06-w23-q18
      type: fill_blank
      topic_code: "6.6"
      source: "IM Geometry, Unit 6, Lesson 6"
      points: 1
      prompt: |
        Completing the square: x² − 10x = (x − ____)² − 25.
      answer: ["5"]
      explanation: |
        Half the coefficient of x is −5, so x² − 10x = (x − 5)² − 25.

    - slug: geo-u06-w23-q19
      type: fill_blank
      topic_code: "6.4"
      source: "IM Geometry, Unit 6, Lesson 4"
      points: 1
      prompt: |
        Review. The midpoint of the segment from (−4, 2) to (6, 8) is (1, ____).
      answer: ["5"]
      explanation: |
        Average the coordinates: ((−4 + 6)/2, (2 + 8)/2) = (1, 5).

    - slug: geo-u06-w23-q20
      type: numeric
      topic_code: "6.6"
      source: "IM Geometry, Unit 6, Lesson 6"
      points: 1
      prompt: |
        What is the radius of the circle x² + y² − 4x + 6y − 12 = 0? Give an integer.
      answer: { value: 5, tolerance: 0 }
      explanation: |
        (x − 2)² − 4 + (y + 3)² − 9 = 12 gives (x − 2)² + (y + 3)² = 25, so the radius is 5.

    - slug: geo-u06-w23-q21
      type: numeric
      topic_code: "6.8"
      source: "IM Geometry, Unit 6, Lesson 8"
      points: 1
      prompt: |
        The parabola y = x²/20 has its vertex at the origin. What is the y-coordinate of its focus? Give an integer.
      answer: { value: 5, tolerance: 0 }
      explanation: |
        4p = 20 gives p = 5, so the focus is (0, 5) and the directrix is y = −5.

    - slug: geo-u06-w23-q22
      type: numeric
      topic_code: "5.9"
      source: "IM Geometry, Unit 5, Lesson 9"
      points: 1
      prompt: |
        Review. A cylinder has radius 3 cm and height 7 cm. What is its volume in cm³? Use π ≈ 3.1416 and round to one decimal place.
      answer: { value: 197.9, tolerance: 0.3 }
      explanation: |
        V = πr²h = π · 9 · 7 = 63π ≈ 197.9 cm³.

    - slug: geo-u06-w23-q23
      type: short_answer
      topic_code: "6.6"
      source: "IM Geometry, Unit 6, Lesson 6"
      points: 2
      prompt: |
        Explain, by completing the square, why the equation x² + y² + 6x − 2y + 11 = 0 has no points on its graph.
      answer: "(x + 3)² + (y − 1)² = 9 + 1 − 11 = −1; a sum of two squares is never negative, so no (x, y) satisfies the equation."
      explanation: |
        Completing both squares gives (x + 3)² − 9 + (y − 1)² − 1 + 11 = 0, so (x + 3)² + (y − 1)² = −1. Squares of real numbers are at least 0, so their sum cannot equal −1. Full credit needs the completed-square form and the sign argument.

    - slug: geo-u06-w23-q24
      type: short_answer
      topic_code: "2.8"
      source: "IM Geometry, Unit 2, Lesson 8"
      points: 2
      prompt: |
        Review. The parabola with focus F = (0, 2) and directrix y = −2 is the set of points equidistant from F and the line. Now replace the line with the point G = (0, −2). Describe the set of points equidistant from F and G, name the theorem that justifies your description, and give its equation.
      answer: "The perpendicular bisector of FG, by the Perpendicular Bisector Theorem and its converse: the horizontal line y = 0 (the x-axis)."
      explanation: |
        Points equidistant from two points lie on the perpendicular bisector of the segment joining them (converse of the Perpendicular Bisector Theorem), and every point of that bisector is equidistant (the theorem itself). FG is vertical with midpoint (0, 0), so the bisector is the x-axis, y = 0. Full credit needs the line, the theorem, and the equation.

    - slug: geo-u06-w23-q25
      type: long_answer
      topic_code: "6.8"
      source: "IM Geometry, Unit 6, Lesson 8"
      points: 6
      prompt: |
        The circle C has equation x² + y² − 2x + 4y − 20 = 0.

        (a) Complete the square to find the centre and radius of C.
        (b) Show that the point (4, 2) lies on C.
        (c) A parabola has its focus at the centre of C and directrix y = 3. Derive its equation and state its vertex.
        (d) Decide whether the parabola's vertex lies inside, on or outside C, with a calculation.
      answer: |
        (a) (x − 1)² − 1 + (y + 2)² − 4 = 20, so (x − 1)² + (y + 2)² = 25. Centre (1, −2), radius 5.
        (b) (4 − 1)² + (2 + 2)² = 9 + 16 = 25 ✓, so (4, 2) is on C. (Or substitute into the original: 16 + 4 − 8 + 8 − 20 = 0.)
        (c) Focus (1, −2), directrix y = 3. √((x − 1)² + (y + 2)²) = |y − 3|. Squaring: (x − 1)² + y² + 4y + 4 = y² − 6y + 9, so (x − 1)² + 10y − 5 = 0 and y = −(x − 1)²/10 + 1/2. Vertex (1, 1/2), halfway between y = −2 and y = 3; the parabola opens downward because the focus is below the directrix.
        (d) The vertex (1, 1/2) is 2.5 from the centre (1, −2), and 2.5 < 5, so it lies inside C. (Substituting into the left side of the original equation gives 1 + 1/4 − 2 + 2 − 20 = −18.75 < 0, confirming inside.)
      explanation: |
        Scoring (6 points): (a) 2 points for the completed-square form with centre (1, −2) and radius 5 (1 point if the centre is right but the radius is 25 or √20). (b) 1 point for a substitution that gives 25 or 0. (c) 2 points: 1 for setting the two distances equal and squaring correctly, 1 for y = −(x − 1)²/10 + 1/2 with vertex (1, 1/2). (d) 1 point for comparing 2.5 with the radius 5 (or an equivalent substitution) and concluding inside.
