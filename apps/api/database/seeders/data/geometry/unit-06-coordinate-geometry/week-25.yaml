      points: 3
      prompt: |
        A right triangle has vertices O = (0, 0), A = (2a, 0) and B = (0, 2b), with the right angle at O.

        (a) Find the midpoint M of the hypotenuse AB.
        (b) Compute MO, MA and MB.
        (c) State in words the theorem these computations prove.
      answer: |
        (a) M = ((2a + 0)/2, (0 + 2b)/2) = (a, b).
        (b) MO = √(a² + b²); MA = √((2a − a)² + (0 − b)²) = √(a² + b²); MB = √((0 − a)² + (2b − b)²) = √(a² + b²). All three are equal.
        (c) The midpoint of the hypotenuse of a right triangle is equidistant from all three vertices; equivalently, it is the circumcentre, and the hypotenuse is a diameter of the circle through the vertices.
      explanation: |
        1 point for M = (a, b). 1 point for the three distances, all √(a² + b²). 1 point for a correct statement of the theorem in words (midpoint of the hypotenuse equidistant from the vertices, or circumcentre at the midpoint of the hypotenuse).

    - slug: geo-u06-w25-q24
