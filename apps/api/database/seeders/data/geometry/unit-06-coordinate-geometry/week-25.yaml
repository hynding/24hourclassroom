      answer: |
        (a) 2/3 of (12, 9) is (8, 6): the shelter is at (8, 6).
        (b) The ratio 1 : 3 means the spring is 1/4 of the way from T: 1/4 of (12, 9) is (3, 2.25). Spring at (3, 2.25).
        (c) Distance = √((8 − 3)² + (6 − 2.25)²) = √(25 + 14.0625) = √39.0625 = 6.25 km. Prediction: the two points are at fractions 2/3 and 1/4 of a 15 km trail, so they are (2/3 − 1/4) · 15 = (5/12) · 15 = 6.25 km apart, because points on one straight segment are spaced in proportion to their fractions.
      explanation: |
        1 point for (8, 6). 1 point for recognising t = 1/4 and giving (3, 2.25). 1 point for 6.25 km with the explanation that the gap is (2/3 − 1/4) of the full length.

    - slug: geo-u06-w25-q25
      type: long_answer
      topic_code: "6.17"
      source: "IM Geometry, Unit 6, Lesson 17"
      points: 6
      prompt: |
        Triangle KLM has vertices K = (0, 0), L = (10, 0) and M = (4, 8).

        (a) Find the centroid G.
        (b) Write equations for two altitudes and find the orthocentre H.
        (c) Write equations for two perpendicular bisectors and find the circumcentre S. Verify that S is equidistant from K and M.
        (d) Show that H, G and S are collinear, and that G is 2/3 of the way from H to S.
      answer: |
        (a) G = ((0 + 10 + 4)/3, (0 + 0 + 8)/3) = (14/3, 8/3).
        (b) Altitude from M to KL (horizontal): x = 4. Slope of LM = (8 − 0)/(4 − 10) = −4/3, so the altitude from K has slope 3/4: y = 3/4 x. At x = 4, y = 3. H = (4, 3). (Check with the altitude from L: slope of KM is 2, so the altitude has slope −1/2: y = −1/2 (x − 10); at x = 4, y = 3 ✓.)
        (c) Perpendicular bisector of KL: x = 5. KM has midpoint (2, 4) and slope 2, so its perpendicular bisector is y − 4 = −1/2 (x − 2). At x = 5: y = 4 − 3/2 = 5/2. S = (5, 5/2). SK = √(25 + 25/4) = √(125/4) = (5√5)/2; SM = √((4 − 5)² + (8 − 5/2)²) = √(1 + 121/4) = √(125/4) = (5√5)/2 ✓.
        (d) Slope of HG = (8/3 − 3)/(14/3 − 4) = (−1/3)/(2/3) = −1/2. Slope of HS = (5/2 − 3)/(5 − 4) = −1/2. Equal slopes through the common point H, so the three points are collinear. From H to S the change is (1, −1/2); two thirds of it is (2/3, −1/3), and H + (2/3, −1/3) = (4 + 2/3, 3 − 1/3) = (14/3, 8/3) = G ✓.
      explanation: |
        Scoring (6 points): (a) 1 point for G = (14/3, 8/3). (b) 2 points: 1 for two correct altitude equations, 1 for H = (4, 3). (c) 2 points: 1 for two correct perpendicular bisector equations with S = (5, 5/2), 1 for verifying SK = SM. (d) 1 point for showing collinearity (equal slopes or the weighted-average check) and the 2/3 position of G.
