week: 25
unit: 6
title: "Coordinate Proof, Weighted Averages and Lines in Triangles"
topics: ["6.14", "6.15", "6.16", "6.17"]
guide: guides/week-25.md
guide_description: |
  Placing figures for a coordinate proof and proving the rectangle-diagonal, midsegment and parallelogram theorems with coordinates; weighted averages to find a point a given fraction of the way along a segment or dividing it in a ratio; the centroid as the average of the vertices with a proof that the medians are concurrent; and the orthocentre and circumcentre found by solving systems. Worked examples, Try-it problems and a self-check.
flashcards_description: |
  28 cards on coordinate proof, weighted averages and ratios, medians and the centroid, altitudes, perpendicular bisectors, the orthocentre and the circumcentre. Review them before the week 25 quiz.
flashcards:
  - front: Coordinate proof → the three steps
    back: |
      Place the figure with a vertex at the origin and a side on an axis; compute distances, slopes and midpoints; state the geometric conclusion.
    topic_code: "6.14"
  - front: Why use letters such as (2a, 2b) in a coordinate proof
    back: |
      Letters make the argument cover every figure of that kind, not one example. Even coordinates keep midpoints free of fractions.
    topic_code: "6.14"
  - front: Good placement of a rectangle for a coordinate proof
    back: |
      (0, 0), (a, 0), (a, b), (0, b). Both diagonals then have length √(a² + b²), which proves they are congruent.
    topic_code: "6.14"
  - front: Midsegment theorem → coordinate proof outline
    back: |
      Triangle (0, 0), (2a, 0), (2b, 2c). Midpoints (b, c) and (a + b, c) give a horizontal segment of length a: parallel to the base and half of 2a.
    topic_code: "6.14"
  - front: Diagonals of a parallelogram bisect each other → coordinate proof outline
    back: |
      Vertices (0, 0), (2a, 0), (2a + 2b, 2c), (2b, 2c). Both diagonals have midpoint (a + b, c), so each passes through the other's midpoint.
    topic_code: "6.14"
  - front: Prove a given quadrilateral is a parallelogram with coordinates → two routes
    back: |
      Show both pairs of opposite sides have equal slopes, or show both diagonals have the same midpoint.
    topic_code: "6.14"
  - front: Error-spot → "placing the figure as (0, 0), (4, 0), (4, 3), (0, 3) proves it for all rectangles"
    back: |
      It proves it only for a 4-by-3 rectangle. A general proof needs letters: (a, 0), (a, b), (0, b).
    topic_code: "6.14"
  - front: Point a fraction t of the way from A to B → formula
    back: |
      P = A + t(B − A) = ((1 − t)x₁ + t x₂, (1 − t)y₁ + t y₂): a weighted average with weight 1 − t on A and t on B.
    topic_code: "6.15"
  - front: One third of the way from A = (1, 2) to B = (7, 8)
    back: |
      B − A = (6, 6); a third of it is (2, 2); P = (3, 4). Equivalently (2/3)A + (1/3)B.
    topic_code: "6.15"
  - front: Which endpoint gets the bigger weight
    back: |
      The one the point is closer to. One third of the way from A means weight 2/3 on A and 1/3 on B.
    topic_code: "6.15"
  - front: "Partition AB in the ratio m : n → which t"
    back: |
      t = m/(m + n) of the way from A. A ratio 3 : 1 means t = 3/4, not 3.
    topic_code: "6.15"
  - front: "P on AB with AP : PB = 3 : 1, A = (−2, 5), B = (6, 1)"
    back: |
      t = 3/4; B − A = (8, −4); P = (−2, 5) + (6, −3) = (4, 2).
    topic_code: "6.15"
  - front: Fraction of the way a known point is from A to B → method
    back: |
      Compare P − A with B − A: if P − A = t(B − A), then P is t of the way. (5, 3) from (2, 0) to (8, 6) gives (3, 3) = 1/2 of (6, 6).
    topic_code: "6.15"
  - front: Weighted average with t = 1.5 or t = −1 → where the point is
    back: |
      On the line AB but outside the segment: past B for t > 1, past A for t < 0. The segment is 0 ≤ t ≤ 1.
    topic_code: "6.15"
  - front: Median of a triangle → definition
    back: |
      A segment from a vertex to the midpoint of the opposite side. Every triangle has three.
    topic_code: "6.16"
  - front: Centroid → definition and formula
    back: |
      The common point of the three medians, 2/3 of the way from each vertex to the opposite midpoint: ((x₁ + x₂ + x₃)/3, (y₁ + y₂ + y₃)/3).
    topic_code: "6.16"
  - front: Why the three medians are concurrent → weighted-average proof
    back: |
      The point 2/3 of the way from A to (B + C)/2 is (1/3)A + (1/3)B + (1/3)C. The same computation from B or from C gives the same point, so all three medians pass through (A + B + C)/3.
    topic_code: "6.16"
  - front: Centroid of (−2, 1), (4, 7), (7, −2)
    back: |
      ((−2 + 4 + 7)/3, (1 + 7 − 2)/3) = (3, 2).
    topic_code: "6.16"
  - front: Error-spot → "the centroid is the midpoint of the longest side"
    back: |
      The centroid is inside the triangle, the average of all three vertices. A side's midpoint is where a median ends, not where the medians meet.
    topic_code: "6.16"
  - front: Centroid as a balance point → why
    back: |
      Each median splits the triangle into two equal areas, so a cardboard triangle balances along every median; it balances on a pin where they all meet.
    topic_code: "6.16"
  - front: Altitude of a triangle → how to write its equation
    back: |
      Through the vertex, with slope the opposite reciprocal of the opposite side's slope. If the side is horizontal, the altitude is vertical, x = (vertex's x).
    topic_code: "6.17"
  - front: Perpendicular bisector of a side → how to write its equation
    back: |
      Through the side's midpoint, with slope the opposite reciprocal of the side's slope.
    topic_code: "6.17"
  - front: Orthocentre → definition
    back: |
      The common point of the three altitudes. Find two altitudes, solve the system, check the third.
    topic_code: "6.17"
  - front: Circumcentre → definition and property
    back: |
      The common point of the three perpendicular bisectors; it is equidistant from the vertices, so it is the centre of the circle through them.
    topic_code: "6.17"
  - front: Orthocentre and circumcentre of a right triangle
    back: |
      The orthocentre is the right-angle vertex (the legs are altitudes); the circumcentre is the midpoint of the hypotenuse.
    topic_code: "6.17"
  - front: Triangle (0, 0), (8, 0), (2, 6) → circumcentre and orthocentre
    back: |
      Perpendicular bisectors x = 4 and y − 3 = −1/3 (x − 1) meet at (4, 2); altitudes x = 2 and y = x meet at (2, 2). The centroid (10/3, 2) lies between them on y = 2.
    topic_code: "6.17"
  - front: Orthocentre, centroid, circumcentre → how they are related
    back: |
      They lie on one line (the Euler line), with the centroid 2/3 of the way from the orthocentre to the circumcentre.
    topic_code: "6.17"
  - front: Error-spot → "an altitude passes through the midpoint of the opposite side"
    back: |
      That is a perpendicular bisector (or, only in an isosceles triangle, both). An altitude passes through a vertex and is perpendicular to the opposite side's line.
    topic_code: "6.17"
quiz:
  description: |
    25 questions · about 40 minutes · Coordinate proofs, weighted averages and ratio partitions, the centroid and the concurrency of medians, altitudes, perpendicular bisectors, the orthocentre and circumcentre, with review of slopes, parallel and perpendicular lines, intersection points, the distance formula, circle equations, the midsegment theorem and parallelogram converses. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: geo-u06-w25-q01
      type: multiple_choice
      topic_code: "6.16"
      source: "IM Geometry, Unit 6, Lesson 16"
      points: 1
      stimulus: |
        Figure description: triangle ABC on a coordinate grid has vertices A = (0, 0), B = (12, 0) and C = (6, 9).
      prompt: |
        What is the centroid of triangle ABC?
      options:
        - "(9, 4.5)"
        - "(6, 0)"
        - "(6, 4.5)"
        - "(6, 3)"
      option_explanations:
        - |
          (9, 4.5) is the midpoint of BC, where a median ends.
        - |
          (6, 0) is the midpoint of AB; the centroid is 3 units above it, 2/3 of the way from C to that midpoint.
        - |
          (6, 4.5) is the midpoint of the median from C, not the point 2/3 of the way along it.
        - |
          Correct. The centroid is the average of the vertices: ((0 + 12 + 6)/3, (0 + 0 + 9)/3) = (6, 3).
      answer: 3

    - slug: geo-u06-w25-q02
      type: multiple_choice
      topic_code: "6.17"
      source: "IM Geometry, Unit 6, Lesson 17"
      points: 1
      stimulus: |
        Figure description: triangle ABC on a coordinate grid has vertices A = (0, 0), B = (12, 0) and C = (6, 9).
      prompt: |
        Which equation describes the altitude from A?
      options:
        - "y = 2/3 x"
        - "y = −3/2 x"
        - "x = 0"
        - "y = 3/2 x"
      option_explanations:
        - |
          Correct. BC has slope (9 − 0)/(6 − 12) = −3/2, so the altitude from A has slope 2/3 and passes through the origin.
        - |
          −3/2 is the slope of BC itself; the altitude is perpendicular to BC.
        - |
          x = 0 is vertical; it would be perpendicular to a horizontal side, but BC is not horizontal.
        - |
          3/2 changes the sign but not the reciprocal; the opposite reciprocal of −3/2 is 2/3.
      answer: 0

    - slug: geo-u06-w25-q03
      type: multiple_choice
      topic_code: "6.17"
      source: "IM Geometry, Unit 6, Lesson 17"
      points: 1
      stimulus: |
        Figure description: triangle ABC on a coordinate grid has vertices A = (0, 0), B = (12, 0) and C = (6, 9).
      prompt: |
        Where is the circumcentre of triangle ABC?
      options:
        - "(6, 3)"
        - "(6, 4.5)"
        - "(6, 2.5)"
        - "(6, 0)"
      option_explanations:
        - |
          (6, 3) is the centroid; it is √45 from A but 6 from C, so it is not equidistant from the vertices.
        - |
          (6, 4.5) is the midpoint of the median from C; its distances to A and C are √56.25 = 7.5 and 4.5.
        - |
          Correct. The perpendicular bisector of AB is x = 6; the point (6, y) is equidistant from A and C when 36 + y² = (y − 9)², giving y = 2.5. Check: distance to A is √(36 + 6.25) = 6.5, and to C it is 6.5.
        - |
          (6, 0) is the midpoint of AB, 6 from A and B but 9 from C.
      answer: 2

    - slug: geo-u06-w25-q04
      type: multiple_choice
      topic_code: "6.15"
      source: "IM Geometry, Unit 6, Lesson 15"
      points: 1
      prompt: |
        What is the point one quarter of the way from A = (2, −3) to B = (10, 9)?
      options:
        - "(6, 3)"
        - "(4, 0)"
        - "(8, 6)"
        - "(3, 0)"
      option_explanations:
        - |
          (6, 3) is the midpoint, halfway rather than a quarter of the way.
        - |
          Correct. B − A = (8, 12); a quarter of it is (2, 3); A + (2, 3) = (4, 0).
        - |
          (8, 6) is three quarters of the way from A (one quarter of the way from B).
        - |
          (3, 0) adds a quarter of the run but not the right rise; a quarter of (8, 12) is (2, 3).
      answer: 1

    - slug: geo-u06-w25-q05
      type: multiple_choice
      topic_code: "6.15"
      source: "IM Geometry, Unit 6, Lesson 15"
      points: 1
      prompt: |
        Point P lies on segment AB with AP : PB = 2 : 3, where A = (−5, 4) and B = (5, −6). What is P?
      options:
        - "(−3, 2)"
        - "(−1, 0)"
        - "(1, −2)"
        - "(0, −1)"
      option_explanations:
        - |
          (−3, 2) is 1/5 of the way from A; the ratio 2 : 3 means 2/5, not 1/5.
        - |
          Correct. P is 2/5 of the way from A: B − A = (10, −10), 2/5 of it is (4, −4), so P = (−1, 0).
        - |
          (1, −2) is 3/5 of the way from A, which gives AP : PB = 3 : 2, the ratio reversed.
        - |
          (0, −1) is the midpoint, which would give the ratio 1 : 1.
      answer: 1

    - slug: geo-u06-w25-q06
      type: multiple_choice
      topic_code: "6.14"
      source: "IM Geometry, Unit 6, Lesson 14"
      points: 1
      prompt: |
        To prove that the diagonals of every rectangle are congruent with a coordinate proof, which placement of the vertices is best?
      options:
        - "(0, 0), (4, 0), (4, 3), (0, 3)"
        - "(a, b), (c, d), (e, f), (g, h)"
        - "(0, 0), (a, 0), (b, c), (d, e)"
        - "(0, 0), (a, 0), (a, b), (0, b)"
      option_explanations:
        - |
          Specific numbers prove the statement for one rectangle only.
        - |
          Fully general coordinates are allowed but make the algebra needlessly heavy; sides on the axes are easier and still general.
        - |
          These four points need not form a rectangle at all; the placement must use the right angles.
        - |
          Correct. Letters cover every rectangle, and placing a vertex at the origin with sides along the axes keeps the diagonal lengths simple: both are √(a² + b²).
      answer: 3

    - slug: geo-u06-w25-q07
      type: multiple_choice
      topic_code: "6.14"
      source: "IM Geometry, Unit 6, Lesson 14"
      points: 1
      prompt: |
        A triangle has vertices (0, 0), (2a, 0) and (2b, 2c). The midpoints of the two sides that meet at (2b, 2c) are (b, c) and (a + b, c). What does this show?
      options:
        - "The midsegment is parallel to the base and half its length"
        - "The centroid is (b, c)"
        - "The triangle is isosceles"
        - "The midsegment is perpendicular to the base"
      option_explanations:
        - |
          Correct. Both midpoints have y-coordinate c, so the midsegment is horizontal like the base, and its length (a + b) − b = a is half of 2a.
        - |
          The centroid is ((2a + 2b)/3, 2c/3); (b, c) is a midpoint, not the centroid.
        - |
          Nothing about the side lengths was assumed or shown; the result holds for every triangle.
        - |
          A horizontal segment is parallel, not perpendicular, to the horizontal base.
      answer: 0

    - slug: geo-u06-w25-q08
      type: multiple_choice
      topic_code: "6.16"
      source: "IM Geometry, Unit 6, Lesson 16"
      points: 1
      prompt: |
        In triangle PQR, the median from P meets QR at its midpoint M, and the centroid is G. If PM = 15, what is PG?
      options:
        - "5"
        - "7.5"
        - "10"
        - "15"
      option_explanations:
        - |
          5 is GM, the part of the median beyond the centroid, not PG.
        - |
          7.5 would put G at the midpoint of the median; the split is 2 : 1, not 1 : 1.
        - |
          Correct. The centroid is 2/3 of the way from the vertex to the midpoint: PG = 2/3 · 15 = 10, and GM = 5.
        - |
          15 is the whole median; the centroid is inside it, not at M.
      answer: 2

    - slug: geo-u06-w25-q09
      type: multiple_choice
      topic_code: "6.17"
      source: "IM Geometry, Unit 6, Lesson 17"
      points: 1
      prompt: |
        A triangle has vertices (0, 0), (10, 0) and (0, 4). Where is its orthocentre?
      options:
        - "(0, 0)"
        - "(5, 2)"
        - "(5, 0)"
        - "(10/3, 4/3)"
      option_explanations:
        - |
          Correct. The triangle is right-angled at the origin, so the two legs are altitudes and they meet at (0, 0).
        - |
          (5, 2) is the midpoint of the hypotenuse, which is the circumcentre of a right triangle.
        - |
          (5, 0) is the midpoint of a leg; no altitude passes through it except the leg's own perpendicular bisector.
        - |
          (10/3, 4/3) is the centroid, the average of the vertices.
      answer: 0

    - slug: geo-u06-w25-q10
      type: multiple_choice
      topic_code: "6.17"
      source: "IM Geometry, Unit 6, Lesson 17"
      points: 1
      prompt: |
        Which equation describes the perpendicular bisector of the segment from (2, 1) to (8, 5)?
      options:
        - "y − 3 = 2/3 (x − 5)"
        - "y − 1 = −3/2 (x − 2)"
        - "y − 3 = −2/3 (x − 5)"
        - "y − 3 = −3/2 (x − 5)"
      option_explanations:
        - |
          Slope 2/3 is the segment's own slope; this line through the midpoint is the segment's line itself.
        - |
          The slope is right but the line passes through the endpoint (2, 1), not the midpoint (5, 3).
        - |
          −2/3 is the opposite of the slope but not its reciprocal; (2/3)(−2/3) ≠ −1.
        - |
          Correct. The midpoint is (5, 3), the segment's slope is 4/6 = 2/3, and the perpendicular slope is −3/2.
      answer: 3

    - slug: geo-u06-w25-q11
      type: multiple_choice
      topic_code: "6.11"
      source: "IM Geometry, Unit 6, Lesson 11"
      points: 1
      prompt: |
        Review. The orthocentre of a triangle with vertices (0, 0), (8, 0), (2, 6) is (2, 2). Which line is the altitude from (8, 0)?
      options:
        - "y = 3(x − 8)"
        - "x = 8"
        - "y = −1/3 (x − 8)"
        - "y = −3(x − 8)"
      option_explanations:
        - |
          Slope 3 is the opposite side's slope; a line with that slope through (8, 0) is parallel to the side, not perpendicular.
        - |
          x = 8 is vertical and would be perpendicular only to a horizontal side.
        - |
          Correct. The opposite side from (0, 0) to (2, 6) has slope 3, so the altitude has slope −1/3; at x = 2 it gives y = 2, the orthocentre.
        - |
          −3 changes the sign but keeps 3 instead of its reciprocal; (3)(−3) = −9, not −1.
      answer: 2

    - slug: geo-u06-w25-q12
      type: multiple_choice
      topic_code: "6.13"
      source: "IM Geometry, Unit 6, Lesson 13"
      points: 1
      prompt: |
        Review. Two altitudes of a triangle have equations x = 4 and y = 3/4 x. Where do they meet?
      options:
        - "(4, 0)"
        - "(4, 3)"
        - "(3, 4)"
        - "(0, 3)"
      option_explanations:
        - |
          (4, 0) is on x = 4 but y = 3/4 · 4 = 3, not 0.
        - |
          Correct. Substituting x = 4 into y = 3/4 x gives y = 3, so the orthocentre is (4, 3).
        - |
          (3, 4) has the coordinates swapped; it is not on the line x = 4.
        - |
          (0, 3) is on neither line; the vertical line forces x = 4.
      answer: 1

    - slug: geo-u06-w25-q13
      type: multiple_choice
      topic_code: "2.13"
      source: "IM Geometry, Unit 2, Lesson 13"
      points: 1
      prompt: |
        Review. A coordinate computation shows that both diagonals of quadrilateral WXYZ have midpoint (4, 5). Which theorem lets you conclude that WXYZ is a parallelogram?
      options:
        - "If the diagonals of a quadrilateral bisect each other, it is a parallelogram"
        - "The midsegment of a triangle is parallel to the third side"
        - "If one pair of opposite sides is parallel and congruent, it is a parallelogram"
        - "The diagonals of a rectangle are congruent"
      option_explanations:
        - |
          Correct. A common midpoint means each diagonal passes through the other's midpoint, which is the diagonal converse for parallelograms.
        - |
          The midsegment theorem is about triangles, not about a quadrilateral's diagonals.
        - |
          Nothing about sides being parallel or congruent was computed; the evidence is about the diagonals.
        - |
          That theorem runs the other way and is about rectangles; equal midpoints say nothing about congruent diagonals.
      answer: 0

    - slug: geo-u06-w25-q14
      type: multi_select
      topic_code: "6.16"
      source: "IM Geometry, Unit 6, Lesson 16"
      points: 2
      partial_credit: true
      prompt: |
        Triangle DEF has vertices D = (1, 2), E = (7, 2) and F = (4, 11). Which statements are true? Select all that apply.
      options:
        - "The centroid is 2/3 of the way from D to the midpoint of EF"
        - "The centroid is (4, 5)"
        - "The median from F lies on the line x = 4"
        - "The centroid is the midpoint of the median from F"
        - "The midpoint of EF is (5.5, 6.5)"
      option_explanations:
        - |
          Yes: D + 2/3 · ((5.5, 6.5) − (1, 2)) = (1, 2) + 2/3 · (4.5, 4.5) = (4, 5).
        - |
          Yes: ((1 + 7 + 4)/3, (2 + 2 + 11)/3) = (12/3, 15/3) = (4, 5).
        - |
          Yes: the midpoint of DE is (4, 2), directly below F = (4, 11), so the median is vertical.
        - |
          No: the midpoint of that median is (4, 6.5); the centroid (4, 5) splits it 2 : 1, not 1 : 1.
        - |
          Yes: ((7 + 4)/2, (2 + 11)/2) = (5.5, 6.5).
      answer: [0, 1, 2, 4]

    - slug: geo-u06-w25-q15
      type: multi_select
      topic_code: "6.10"
      source: "IM Geometry, Unit 6, Lesson 10"
      points: 2
      partial_credit: true
      prompt: |
        Review. Quadrilateral ABCD has vertices A = (0, 0), B = (5, 1), C = (7, 5) and D = (2, 4). Which statements are true? Select all that apply.
      options:
        - "ABCD is a rectangle"
        - "AB ∥ DC"
        - "ABCD is a parallelogram"
        - "BC ∥ AD"
        - "The diagonals AC and BD have the same midpoint"
      option_explanations:
        - |
          No: adjacent sides have slopes 1/5 and 2 with product 2/5, not −1, so the angles are not right angles.
        - |
          Yes: slope AB = 1/5 and slope DC = (5 − 4)/(7 − 2) = 1/5.
        - |
          Yes: both pairs of opposite sides are parallel.
        - |
          Yes: slope BC = 4/2 = 2 and slope AD = 4/2 = 2.
        - |
          Yes: both midpoints are (3.5, 2.5), as the diagonals of every parallelogram bisect each other.
      answer: [1, 2, 3, 4]

    - slug: geo-u06-w25-q16
      type: true_false
      topic_code: "6.17"
      source: "IM Geometry, Unit 6, Lesson 17"
      points: 1
      prompt: |
        True or false: the circumcentre of a triangle is always inside the triangle.
      answer: false
      explanation: |
        False. For a right triangle it is the midpoint of the hypotenuse, on the triangle, and for an obtuse triangle it lies outside. Only an acute triangle has its circumcentre inside.

    - slug: geo-u06-w25-q17
      type: true_false
      topic_code: "6.4"
      source: "IM Geometry, Unit 6, Lesson 4"
      points: 1
      prompt: |
        Review. True or false: the circumcentre (4, 2) of the triangle with vertices (0, 0), (8, 0) and (2, 6) is the centre of the circle (x − 4)² + (y − 2)² = 20, and all three vertices lie on that circle.
      answer: true
      explanation: |
        True. Each vertex is √20 from (4, 2): 16 + 4, 16 + 4 and 4 + 16 all equal 20, so each satisfies the circle's equation.

    - slug: geo-u06-w25-q18
      type: fill_blank
      topic_code: "6.15"
      source: "IM Geometry, Unit 6, Lesson 15"
      points: 1
      prompt: |
        The point 2/3 of the way from (0, 0) to (9, 6) is (6, ____).
      answer: ["4"]
      explanation: |
        2/3 of (9, 6) is (6, 4). The weights are 1/3 on (0, 0) and 2/3 on (9, 6).

    - slug: geo-u06-w25-q19
      type: fill_blank
      topic_code: "6.9"
      source: "IM Geometry, Unit 6, Lesson 9"
      points: 1
      prompt: |
        Review. The median from (4, 11) to the midpoint (4, 2) of the opposite side is a vertical line. Its equation is x = ____.
      answer: ["4"]
      explanation: |
        Both points have x-coordinate 4, so the line is x = 4; a vertical line has no slope and cannot be written in point-slope form.

    - slug: geo-u06-w25-q20
      type: numeric
      topic_code: "6.16"
      source: "IM Geometry, Unit 6, Lesson 16"
      points: 1
