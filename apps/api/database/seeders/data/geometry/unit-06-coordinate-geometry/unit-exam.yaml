      source: "IM Geometry, Unit 3, Lesson 5"
      points: 1
      prompt: |
        Review. A coordinate proof uses the triangle (0, 0), (2a, 0), (2b, 2c) and the midpoints (b, c) and (a + b, c). Which earlier theorem does this computation re-prove?
      options:
        - "The diagonals of a parallelogram bisect each other"
