unit: 6
description: |
  44 questions · about 80 minutes · covers every lesson of Unit 6 (coordinate rules for transformations and their
  composition, rigid and non-rigid rules, the distance formula, circle equations in both forms, completing the
  square, parabolas from a focus and a directrix, equations of lines, parallel and perpendicular slopes,
  intersection points, coordinate proof, weighted averages, the centroid, altitudes and perpendicular bisectors)
  with some review of Units 1 to 3. Multiple choice, select-all, true/false and numeric items are graded at
  once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by
  your teacher against the scoring notes.
questions:
    - slug: geo-u06-exam-q01
      type: multiple_choice
      topic_code: "6.16"
      source: "IM Geometry, Unit 6, Lesson 16"
      points: 1
      stimulus: |
        Figure description: triangle ABC on a coordinate grid has vertices A = (−3, 0), B = (5, 0) and C = (1, 6).
      prompt: |
        What is the centroid of triangle ABC?
      options:
        - "(3, 2)"
        - "(1, 0)"
        - "(1, 2)"
        - "(1, 3)"
      option_explanations:
        - |
          (3, 2) is the midpoint of BC, where a different median ends.
        - |
          (1, 0) is the midpoint of AB, the foot of the median from C.
        - |
          Correct. ((−3 + 5 + 1)/3, (0 + 0 + 6)/3) = (1, 2), two thirds of the way from C down the median to (1, 0).
        - |
          (1, 3) is the midpoint of the median from C; the centroid is 2/3 of the way along it, at height 2.
      answer: 2

    - slug: geo-u06-exam-q02
      type: multiple_choice
      topic_code: "6.17"
      source: "IM Geometry, Unit 6, Lesson 17"
      points: 1
      stimulus: |
        Figure description: triangle ABC on a coordinate grid has vertices A = (−3, 0), B = (5, 0) and C = (1, 6).
      prompt: |
        Which equation describes the altitude from A?
      options:
        - "y = −3/2 (x + 3)"
        - "y = 2/3 (x + 3)"
        - "x = −3"
        - "y = 2/3 (x − 3)"
      option_explanations:
        - |
          −3/2 is the slope of BC; the altitude is perpendicular to BC, so its slope is the opposite reciprocal.
        - |
          Correct. BC has slope (6 − 0)/(1 − 5) = −3/2, so the altitude has slope 2/3 and passes through A = (−3, 0).
        - |
          A vertical line through A would be perpendicular to a horizontal side, and BC is not horizontal.
        - |
          The slope is right but this line passes through (3, 0), not A = (−3, 0).
      answer: 1

    - slug: geo-u06-exam-q03
      type: multiple_choice
      topic_code: "6.17"
      source: "IM Geometry, Unit 6, Lesson 17"
      points: 1
      stimulus: |
        Figure description: triangle ABC on a coordinate grid has vertices A = (−3, 0), B = (5, 0) and C = (1, 6).
      prompt: |
        The perpendicular bisector of AB is x = 1. Which point is the circumcentre of triangle ABC?
      options:
        - "(1, 5/3)"
        - "(1, 8/3)"
        - "(1, 2)"
        - "(1, 3)"
      option_explanations:
        - |
          Correct. A point (1, y) is equidistant from A and C when 16 + y² = (y − 6)², which gives 12y = 20 and y = 5/3; its distance to each vertex is √(16 + 25/9).
        - |
          (1, 8/3) is the orthocentre, where the altitudes meet, not the perpendicular bisectors.
        - |
          (1, 2) is the centroid, 4 from C but √(16 + 4) from A; it is not equidistant from the vertices.
        - |
          (1, 3) is 3 from C but √(16 + 9) = 5 from A, so it is not equidistant from the vertices.
      answer: 0

    - slug: geo-u06-exam-q04
      type: multiple_choice
      topic_code: "6.1"
      source: "IM Geometry, Unit 6, Lesson 1"
      points: 1
      prompt: |
        What is the image of the point (3, −4) under a rotation of 90° counterclockwise about the origin?
      options:
        - "(−4, 3)"
        - "(−3, 4)"
        - "(4, −3)"
        - "(4, 3)"
      option_explanations:
        - |
          (−4, 3) forgets the sign change on the new first coordinate; the rule is (−y, x), and −y = 4.
        - |
          (−3, 4) is the image under the 180° rotation (x, y) → (−x, −y), not the 90° rotation.
        - |
          (4, −3) is the reflection across y = −x, or equivalently a 270° rotation would give (−4, −3); neither is the 90° rotation.
        - |
          Correct. The rule (x, y) → (−y, x) gives (−(−4), 3) = (4, 3).
      answer: 3

    - slug: geo-u06-exam-q05
      type: multiple_choice
      topic_code: "6.2"
      source: "IM Geometry, Unit 6, Lesson 2"
      points: 1
      prompt: |
        A point is reflected across the y-axis and then translated by (0, −2). Which single rule describes the composition?
      options:
        - "(x, y) → (−x, y − 2)"
        - "(x, y) → (−x − 2, y)"
        - "(x, y) → (x, −y − 2)"
        - "(x, y) → (−x, y + 2)"
      option_explanations:
        - |
          Correct. The reflection gives (−x, y) and the translation then subtracts 2 from the second coordinate.
        - |
          The translation vector (0, −2) changes y, not x.
        - |
          Reflecting across the y-axis changes the sign of x, not y.
        - |
          The translation moves points down 2, so the second coordinate decreases.
      answer: 0

    - slug: geo-u06-exam-q06
      type: multiple_choice
      topic_code: "6.3"
      source: "IM Geometry, Unit 6, Lesson 3"
      points: 1
      prompt: |
        Which of these coordinate rules fails to preserve distances, and so is not a rigid transformation?
      options:
        - "(x, y) → (−x, −y)"
        - "(x, y) → (y, −x)"
        - "(x, y) → (x + 4, y − 1)"
        - "(x, y) → (x, 3y)"
      option_explanations:
        - |
          (−x, −y) is a rotation of 180°, which is rigid.
        - |
          (y, −x) is a rotation of 90° clockwise about the origin, which preserves distances.
        - |
          A translation by (4, −1) slides every point the same way and preserves every distance.
        - |
          Correct. It triples vertical distances: (0, 0) and (0, 1) are 1 apart, their images 3 apart.
      answer: 3

    - slug: geo-u06-exam-q07
      type: multiple_choice
      topic_code: "6.4"
      source: "IM Geometry, Unit 6, Lesson 4"
      points: 1
      prompt: |
        Which equation describes the circle with centre (−1, 4) that passes through (2, 8)?
      options:
        - "(x − 2)² + (y − 8)² = 25"
        - "(x − 1)² + (y + 4)² = 25"
        - "(x + 1)² + (y − 4)² = 25"
        - "(x + 1)² + (y − 4)² = 5"
      option_explanations:
        - |
          (2, 8) is a point on the circle, not its centre.
        - |
          The signs are reversed; a centre (h, k) = (−1, 4) gives (x + 1)² and (y − 4)².
        - |
          Correct. The radius is the distance from (−1, 4) to (2, 8), √(9 + 16) = 5, and r² = 25.
        - |
          5 is the radius; the right side must be r² = 25.
      answer: 2

    - slug: geo-u06-exam-q08
      type: multiple_choice
      topic_code: "6.5"
      source: "IM Geometry, Unit 6, Lesson 5"
      points: 1
      prompt: |
        Which equation does NOT describe a circle?
      options:
        - "2x² + 2y² − 4x + 8y = 10"
        - "x² + 2y² − 4x + 8y = 0"
        - "x² + y² = 1"
        - "x² + y² − 4x + 8y = 0"
      option_explanations:
        - |
          Dividing by 2 gives x² + y² − 2x + 4y = 5, then (x − 1)² + (y + 2)² = 10: a circle.
        - |
          Correct. The coefficients of x² and y² differ (1 and 2), so this cannot come from expanding (x − h)² + (y − k)² = r².
        - |
          This is the unit circle, centre (0, 0) and radius 1.
        - |
          Completing the square gives (x − 2)² + (y + 4)² = 20, a circle of radius √20.
      answer: 1

    - slug: geo-u06-exam-q09
      type: multiple_choice
      topic_code: "6.6"
      source: "IM Geometry, Unit 6, Lesson 6"
      points: 1
      prompt: |
        What are the centre and radius of the circle x² + y² + 6x − 8y = 0?
      options:
        - "Centre (−6, 8), radius 10"
        - "Centre (−3, 4), radius 0"
        - "Centre (3, −4), radius 5"
        - "Centre (−3, 4), radius 5"
      option_explanations:
        - |
          The centre uses half the coefficients, (−3, 4), not the full coefficients.
        - |
          The constant on the right is 9 + 16 = 25, not 0; the circle passes through the origin and has radius 5.
        - |
          The signs are reversed: (x + 3)² means h = −3 and (y − 4)² means k = 4.
        - |
          Correct. (x + 3)² − 9 + (y − 4)² − 16 = 0 gives (x + 3)² + (y − 4)² = 25.
      answer: 3

    - slug: geo-u06-exam-q10
      type: multiple_choice
      topic_code: "6.7"
      source: "IM Geometry, Unit 6, Lesson 7"
      points: 1
      prompt: |
        A parabola has focus (0, 4) and directrix y = −4. Which equation describes it?
      options:
        - "y = x²/4"
        - "y = x²/8"
        - "y = x²/16"
        - "x = y²/16"
      option_explanations:
        - |
          4 is the focus-to-vertex distance p; the denominator is 4p = 16.
        - |
          8 is b − c = 4 − (−4); the denominator is 2(b − c) = 16.
        - |
          Correct. √(x² + (y − 4)²) = |y + 4| squares to x² − 8y + 16 = 8y + 16, so x² = 16y.
        - |
          x = y²/16 opens sideways; a horizontal directrix gives a parabola that opens up or down.
      answer: 2

    - slug: geo-u06-exam-q11
      type: multiple_choice
      topic_code: "6.8"
      source: "IM Geometry, Unit 6, Lesson 8"
      points: 1
      prompt: |
        The parabola y = −(x − 3)²/12 + 2 has which focus and directrix?
      options:
        - "Focus (3, −1), directrix y = 5"
        - "Focus (3, −10), directrix y = 14"
        - "Focus (3, 2), directrix y = −1"
        - "Focus (3, 5), directrix y = −1"
      option_explanations:
        - |
          Correct. Vertex (3, 2), 4p = −12 so p = −3: the focus is 3 below the vertex and the directrix 3 above, and the parabola opens downward.
        - |
          12 is 4p, not p; the focus is p = 3 from the vertex, not 12.
        - |
          (3, 2) is the vertex, which is never the focus.
        - |
          These are reversed; the negative coefficient means the parabola opens down, toward a focus below the vertex.
      answer: 0

    - slug: geo-u06-exam-q12
      type: multiple_choice
      topic_code: "6.9"
      source: "IM Geometry, Unit 6, Lesson 9"
      points: 1
      prompt: |
        Which equation describes the line through (−2, 7) and (4, −5)?
      options:
        - "y − 7 = 2(x + 2)"
        - "y − 7 = −2(x + 2)"
        - "y + 7 = −2(x − 2)"
        - "y − 7 = −1/2 (x + 2)"
      option_explanations:
        - |
          The line falls from left to right (7 down to −5 as x increases), so the slope is negative.
        - |
          Correct. The slope is (−5 − 7)/(4 + 2) = −12/6 = −2, and the line passes through (−2, 7).
        - |
          This line passes through (2, −7); the signs in the brackets are reversed.
        - |
          −1/2 is run over rise; the slope is rise over run, −12/6 = −2.
      answer: 1

    - slug: geo-u06-exam-q13
      type: multiple_choice
      topic_code: "6.10"
      source: "IM Geometry, Unit 6, Lesson 10"
      points: 1
      prompt: |
        Which line is parallel to 5x − 2y = 4 and passes through (2, 1)?
      options:
        - "y = −2/5 x + 9/5"
        - "y = 5/2 x + 1"
        - "y = 5/2 x − 4"
        - "y = 5/2 x − 2"
      option_explanations:
        - |
          −2/5 is the perpendicular slope, not the parallel one.
        - |
          Slope 5/2 is right, but at x = 2 this line gives y = 6, so it misses (2, 1).
        - |
          Correct. 5x − 2y = 4 is y = 5/2 x − 2, slope 5/2; through (2, 1): y − 1 = 5/2 (x − 2), so y = 5/2 x − 4.
        - |
          This is the given line itself; at x = 2 it gives y = 3, not 1.
      answer: 2

    - slug: geo-u06-exam-q14
      type: multiple_choice
      topic_code: "6.11"
      source: "IM Geometry, Unit 6, Lesson 11"
      points: 1
      prompt: |
        Why do perpendicular lines (neither vertical) have slopes that multiply to −1?
      options:
        - "Rotating a line of slope m by 90° about a point on it sends the slope point (1, m) to (−m, 1), giving slope −1/m"
        - "Translating a line keeps its slope, so the perpendicular must have the opposite slope"
        - "Perpendicular lines are symmetric, so their slopes are reciprocals"
        - "Reflecting a line of slope m across the x-axis gives slope −m, and −m · m = −m²"
      option_explanations:
        - |
          Correct. A 90° rotation produces a perpendicular line, and the rotation rule (x, y) → (−y, x) turns a run of 1 and rise of m into a run of −m and rise of 1.
        - |
          Translations explain why parallel lines have equal slopes, not anything about perpendiculars.
        - |
          Reciprocals alone would give a product of 1; the sign change comes from the rotation.
        - |
          A reflection across the x-axis does not produce a perpendicular line, and −m² is not −1 in general.
      answer: 0

    - slug: geo-u06-exam-q15
      type: multiple_choice
      topic_code: "6.12"
      source: "IM Geometry, Unit 6, Lesson 12"
      points: 1
      prompt: |
        Which line is perpendicular to y = 3/4 x − 5 and has y-intercept 2?
      options:
        - "y = 4/3 x + 2"
        - "y = −3/4 x + 2"
        - "y = −4/3 x − 5"
        - "y = −4/3 x + 2"
      option_explanations:
        - |
          4/3 is the reciprocal without the sign change; (3/4)(4/3) = 1, not −1.
        - |
          −3/4 changes the sign but not the reciprocal; (3/4)(−3/4) ≠ −1.
        - |
          The slope is right but the y-intercept should be 2, not −5.
        - |
          Correct. The opposite reciprocal of 3/4 is −4/3, and the intercept 2 gives y = −4/3 x + 2.
      answer: 3

    - slug: geo-u06-exam-q16
      type: multiple_choice
      topic_code: "6.13"
      source: "IM Geometry, Unit 6, Lesson 13"
      points: 1
      prompt: |
        Where does the line y = −2x + 10 meet the line y = x + 1?
      options:
        - "(3, 2)"
        - "(3, 4)"
        - "(4, 3)"
        - "The lines are parallel"
      option_explanations:
        - |
          (3, 2) is on neither line; both give y = 4 at x = 3.
        - |
          Correct. −2x + 10 = x + 1 gives 3x = 9, x = 3, y = 4; check: −6 + 10 = 4 ✓ and 3 + 1 = 4 ✓.
        - |
          At x = 4 the lines give y = 2 and y = 5, so they do not meet there.
        - |
          The slopes −2 and 1 differ, so the lines meet exactly once.
      answer: 1

    - slug: geo-u06-exam-q17
      type: multiple_choice
      topic_code: "6.13"
      source: "IM Geometry, Unit 6, Lesson 13"
      points: 1
      prompt: |
        The line y = 3 and the circle (x − 1)² + (y − 3)² = 16 meet at which points?
      options:
        - "They do not meet"
        - "(−3, 3) only"
        - "(1, 7) and (1, −1)"
        - "(−3, 3) and (5, 3)"
      option_explanations:
        - |
          The line passes through the centre (1, 3), so it must cross the circle twice.
        - |
          (x − 1)² = 16 has two solutions, x = 5 and x = −3; remember both square roots.
        - |
          These are where the vertical line x = 1 meets the circle, not the horizontal line y = 3.
        - |
          Correct. Substituting y = 3 gives (x − 1)² = 16, so x − 1 = ±4 and x = 5 or x = −3; the line passes through the centre, so this chord is a diameter.
      answer: 3

    - slug: geo-u06-exam-q18
      type: multiple_choice
      topic_code: "6.14"
      source: "IM Geometry, Unit 6, Lesson 14"
      points: 1
      prompt: |
        A coordinate proof places an isosceles triangle with vertices (−a, 0), (a, 0) and (0, b) and shows that the median from (0, b) is the line x = 0. What has been proved?
      options:
        - "The centroid of an isosceles triangle is at (0, b)"
        - "Every triangle has a median that is vertical"
        - "The median to the base of an isosceles triangle is perpendicular to the base"
        - "The base angles of an isosceles triangle are congruent"
      option_explanations:
        - |
          The centroid is (0, b/3); (0, b) is the apex.
        - |
          The median is vertical here only because of how the figure was placed; the geometric content is the right angle with the base.
        - |
          Correct. The midpoint of the base is (0, 0), the median is the vertical line x = 0, and the base lies on the horizontal line y = 0, so the median is perpendicular to the base; the letters make this hold for every isosceles triangle.
        - |
          Congruent base angles would need an angle or distance argument; this computation is about the median.
      answer: 2

    - slug: geo-u06-exam-q19
      type: multiple_choice
      topic_code: "6.15"
      source: "IM Geometry, Unit 6, Lesson 15"
      points: 1
      prompt: |
        Which point divides the segment from A = (−6, 2) to B = (9, −3) in the ratio AP : PB = 2 : 3?
      options:
        - "(0, 0)"
        - "(3, −1)"
        - "(−3, 1)"
        - "(1.5, −0.5)"
      option_explanations:
        - |
          Correct. P is 2/5 of the way from A: B − A = (15, −5), 2/5 of it is (6, −2), and A + (6, −2) = (0, 0).
        - |
          (3, −1) is 3/5 of the way from A, giving the ratio 3 : 2.
        - |
          (−3, 1) is only 1/5 of the way from A, which would give the ratio 1 : 4.
        - |
          (1.5, −0.5) is the midpoint, ratio 1 : 1.
      answer: 0

    - slug: geo-u06-exam-q20
      type: multiple_choice
      topic_code: "6.6"
      source: "IM Geometry, Unit 6, Lesson 6"
      points: 1
      stimulus: |
        Figure description: the circle with equation x² + y² − 4x − 6y − 12 = 0 is drawn on a coordinate grid, together with the point P = (5, 7).
      prompt: |
        What are the centre and radius of the circle?
      options:
        - "Centre (4, 6), radius 12"
        - "Centre (2, 3), radius 5"
        - "Centre (−2, −3), radius 5"
        - "Centre (2, 3), radius √12"
      option_explanations:
        - |
          The centre uses half of each coefficient, and 12 is the constant, not r².
        - |
          Correct. (x − 2)² − 4 + (y − 3)² − 9 − 12 = 0 gives (x − 2)² + (y − 3)² = 25.
        - |
          The signs are reversed; −4x comes from (x − 2)², so h = 2, and −6y gives k = 3.
        - |
          √12 forgets to add the 4 and the 9 produced by completing the squares; r² = 12 + 4 + 9 = 25.
      answer: 1

    - slug: geo-u06-exam-q21
      type: multiple_choice
      topic_code: "6.4"
      source: "IM Geometry, Unit 6, Lesson 4"
      points: 1
      stimulus: |
        Figure description: the circle with equation x² + y² − 4x − 6y − 12 = 0 is drawn on a coordinate grid, together with the point P = (5, 7).
      prompt: |
        Where is P relative to the circle?
      options:
        - "Inside the circle, because 5 + 7 < 25"
        - "On the circle, because substituting gives 12"
        - "Outside the circle, because 5² + 7² > 25"
        - "On the circle, because its distance from the centre is exactly 5"
      option_explanations:
        - |
          Adding the coordinates tests nothing; distance from the centre is what matters, and it equals the radius.
        - |
          Substituting into the left side gives 0, not 12; 0 means the point is on the circle.
        - |
          5² + 7² compares P with the origin, not with the centre (2, 3).
        - |
          Correct. From (2, 3) to (5, 7) is √(9 + 16) = 5, the radius; substituting P into the equation gives 25 + 49 − 20 − 42 − 12 = 0.
      answer: 3

    - slug: geo-u06-exam-q22
      type: multiple_choice
      topic_code: "6.11"
      source: "IM Geometry, Unit 6, Lesson 11"
      points: 1
      stimulus: |
        Figure description: the circle with equation x² + y² − 4x − 6y − 12 = 0 is drawn on a coordinate grid, together with the point P = (5, 7).
      prompt: |
        A tangent line to a circle is perpendicular to the radius at the point of tangency. What is the slope of the tangent line at P?
      options:
        - "4/3"
        - "−4/3"
        - "−3/4"
        - "3/4"
      option_explanations:
        - |
          4/3 is the slope of the radius itself; the tangent is perpendicular to it.
        - |
          −4/3 changes the sign but not the reciprocal; (4/3)(−4/3) ≠ −1.
        - |
          Correct. The radius from (2, 3) to (5, 7) has slope 4/3, so the perpendicular tangent has slope −3/4.
        - |
          3/4 is the reciprocal without the sign change; the product with 4/3 is 1, not −1.
      answer: 2

    - slug: geo-u06-exam-q23
      type: multiple_choice
      topic_code: "6.2"
      source: "IM Geometry, Unit 6, Lesson 2"
      points: 1
      prompt: |
        Which composition of two reflections equals the rotation (x, y) → (−x, −y)?
      options:
        - "Across y = x, then across the x-axis"
        - "Across the x-axis, then across the y-axis"
        - "Across the y-axis, then across y = x"
        - "Across the x-axis, then across the x-axis again"
      option_explanations:
        - |
          (x, y) → (y, x) → (y, −x), a 90° clockwise rotation, not 180°.
        - |
          Correct. (x, y) → (x, −y) → (−x, −y): two reflections across perpendicular lines make a 180° rotation.
        - |
          (x, y) → (−x, y) → (y, −x), again a 90° rotation.
        - |
          Reflecting twice across the same line returns every point to where it started.
      answer: 1

    - slug: geo-u06-exam-q24
      type: multiple_choice
      topic_code: "6.7"
      source: "IM Geometry, Unit 6, Lesson 7"
      points: 1
      prompt: |
        Which point is equidistant from the focus (0, 1) and the directrix y = −1?
      options:
        - "(4, 4)"
        - "(0, 1)"
        - "(2, 2)"
        - "(4, 2)"
      option_explanations:
        - |
          Correct. Its distance to (0, 1) is √(16 + 9) = 5 and its distance to y = −1 is 4 + 1 = 5; it lies on y = x²/4.
        - |
          The focus is 0 from itself and 2 from the directrix; it is never on the parabola.
        - |
          (2, 2) is √(4 + 1) = √5 from the focus but 3 from the directrix.
        - |
          (4, 2) is √(16 + 1) = √17 from the focus but 3 from the directrix.
      answer: 0

    - slug: geo-u06-exam-q25
      type: multiple_choice
      topic_code: "6.3"
      source: "IM Geometry, Unit 6, Lesson 3"
      points: 1
      prompt: |
        Which best describes the rule (x, y) → (3x, 3y)?
      options:
        - "A dilation centred at the origin with scale factor 3; not rigid"
        - "A translation by (3, 3); rigid"
        - "A rotation; rigid"
        - "A dilation with scale factor 3; rigid because angles are preserved"
      option_explanations:
        - |
          Correct. Every point moves to three times its distance from the origin along the same ray; distances triple, so it is not rigid.
        - |
          A translation adds a fixed vector; this rule multiplies, moving (1, 1) to (3, 3) but (2, 2) to (6, 6).
        - |
          A rotation keeps every point at the same distance from the centre; this rule triples the distance.
        - |
          Preserving angles is not enough for rigidity; a rigid transformation must preserve distances, and this one triples them.
      answer: 0

    - slug: geo-u06-exam-q26
      type: multiple_choice
