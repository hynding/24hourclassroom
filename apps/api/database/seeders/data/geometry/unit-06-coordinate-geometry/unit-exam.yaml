        - "The line 2x + 3y = 6 is parallel to ℓ"
        - "The line y = 3/2 x − 1 is perpendicular to ℓ"
        - "The line through (3, 2) and (6, 0) is parallel to ℓ"
        - "The line 2x + 3y = 12 is the same line as ℓ"
      option_explanations:
        - |
          No: slopes 2/3 and −2/3 differ, so the lines meet (at (0, 4)).
        - |
          Yes: 2x + 3y = 6 is y = −2/3 x + 2, same slope, different intercept.
        - |
          Yes: (−2/3)(3/2) = −1, so the slopes are opposite reciprocals.
        - |
          No: that line has slope (0 − 2)/(6 − 3) = −2/3, and (3, 2) satisfies ℓ (−2 + 4 = 2), so it is ℓ itself, not a parallel line.
        - |
