    - slug: geo-u06-exam-q42
      type: short_answer
      topic_code: "6.14"
      source: "IM Geometry, Unit 6, Lesson 14"
      points: 3
      prompt: |
        Quadrilateral PQRS has vertices P = (−2, −1), Q = (4, 1), R = (6, 7) and S = (0, 5).

        (a) Show that PQRS is a parallelogram.
        (b) Find the lengths of both diagonals and decide whether they are congruent.
        (c) What kind of parallelogram is it? Justify with a slope or distance calculation.
      answer: |
        (a) Slope PQ = 2/6 = 1/3 and slope SR = 2/6 = 1/3; slope QR = 6/2 = 3 and slope PS = 6/2 = 3. Both pairs of opposite sides are parallel, so PQRS is a parallelogram. (Or: both diagonals have midpoint (2, 3).)
        (b) PR = √(8² + 8²) = √128 = 8√2; QS = √((0 − 4)² + (5 − 1)²) = √(16 + 16) = √32 = 4√2. They are not congruent, so PQRS is not a rectangle.
        (c) Adjacent sides PQ and QR have slopes 1/3 and 3, product 1, not −1, so the angles are not right angles and PQRS is not a rectangle (consistent with unequal diagonals). PQ = √40 and QR = √40, so all four sides are equal: PQRS is a rhombus. Check with the diagonals: slope PR = 1 and slope QS = −1, product −1, so the diagonals are perpendicular, as a rhombus requires.
      explanation: |
        1 point for a correct parallelogram argument (opposite slopes equal, or common diagonal midpoint). 1 point for computing both diagonals, √128 and √32, and concluding that they are not congruent. 1 point for identifying a rhombus with a justification (equal adjacent sides or perpendicular diagonals) and ruling out a rectangle.

    - slug: geo-u06-exam-q43
      type: short_answer
      topic_code: "6.7"
      source: "IM Geometry, Unit 6, Lesson 7"
      points: 3
      prompt: |
        A parabola has focus F = (2, 5) and directrix y = 1.

        (a) Find its vertex and say which way it opens.
        (b) Derive its equation from the definition.
        (c) Verify that the point (6, 5) is on the parabola using distances, not the equation.
      answer: |
        (a) The vertex is halfway between the focus and the directrix: (2, 3). The focus is above the directrix, so it opens upward.
        (b) √((x − 2)² + (y − 5)²) = |y − 1|. Squaring: (x − 2)² + y² − 10y + 25 = y² − 2y + 1, so (x − 2)² + 24 = 8y and y = (x − 2)²/8 + 3.
        (c) Distance from (6, 5) to F: √(16 + 0) = 4. Distance from (6, 5) to y = 1: 5 − 1 = 4. Equal, so (6, 5) is on the parabola. (The equation agrees: 16/8 + 3 = 5.)
      explanation: |
        1 point for vertex (2, 3) and opening upward. 1 point for the derivation ending in y = (x − 2)²/8 + 3 (equivalent forms accepted). 1 point for the two distances, both 4.

    - slug: geo-u06-exam-q44
      type: long_answer
      topic_code: "6.17"
      source: "IM Geometry, Unit 6, Lesson 17"
      points: 8
      prompt: |
        Triangle ABC has vertices A = (0, 0), B = (6, 0) and C = (0, 8).

        (a) Find the centroid G and the circumcentre S, and explain why S is where it is without solving a system.
        (b) Find the orthocentre H and explain why no system needs to be solved.
        (c) Show that H, G and S are collinear and that HG : GS = 2 : 1.
        (d) Write the equation of the circle through A, B and C. Explain why the midpoint of BC is not on the circle, and decide whether G is inside, on or outside it.
        (e) Find the equation of the line through G parallel to BC, and the point where it meets the x-axis.
      answer: |
        (a) G = ((0 + 6 + 0)/3, (0 + 0 + 8)/3) = (2, 8/3). The triangle is right-angled at A, so the hypotenuse BC is a diameter of the circumscribed circle and S is the midpoint of BC: S = (3, 4). (Check: SA = √(9 + 16) = 5, SB = √(9 + 16) = 5, SC = √(9 + 16) = 5.)
        (b) The legs AB and AC are altitudes (each is perpendicular to the other), so the altitudes meet at the right-angle vertex: H = A = (0, 0).
        (c) From H = (0, 0) to S = (3, 4), the point 2/3 of the way is (2, 8/3) = G. So G lies on segment HS with HG : GS = 2 : 1. (Equivalently: slope HG = (8/3)/2 = 4/3 and slope HS = 4/3, same slope through H.)
        (d) Centre S = (3, 4), radius 5: (x − 3)² + (y − 4)² = 25. The midpoint of BC is S itself, the centre, which is 0 from the centre rather than 5, so it is not on the circle. G: (2 − 3)² + (8/3 − 4)² = 1 + 16/9 = 25/9 < 25, so G is inside the circle.
        (e) Slope of BC = (8 − 0)/(0 − 6) = −4/3. Through G: y − 8/3 = −4/3 (x − 2), or y = −4/3 x + 16/3. On the x-axis, y = 0: x = 4. The line meets the x-axis at (4, 0).
      explanation: |
        Scoring (8 points): (a) 2 points: 1 for G = (2, 8/3), 1 for S = (3, 4) with the hypotenuse-as-diameter reason. (b) 1 point for H = (0, 0) with the legs-are-altitudes reason. (c) 1 point for showing G is 2/3 of the way from H to S (or equal slopes plus the ratio). (d) 2 points: 1 for the circle equation, 1 for recognising that the midpoint of BC is the centre (not on the circle) and that G is inside (25/9 < 25). (e) 2 points: 1 for the line y = −4/3 x + 16/3 (any equivalent form), 1 for (4, 0).
