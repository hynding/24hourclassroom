    - slug: geo-u06-exam-q27
      type: multiple_choice
      topic_code: "2.8"
      source: "IM Geometry, Unit 2, Lesson 8"
      points: 1
      prompt: |
        Review. Why is the circumcentre of a triangle equidistant from all three vertices?
      options:
        - "It lies on each median, and medians split the opposite side in half"
        - "It lies on each altitude, and altitudes are perpendicular to the sides"
        - "It is the average of the three vertices"
        - "It lies on the perpendicular bisector of each side, and every point on a segment's perpendicular bisector is equidistant from its endpoints"
      option_explanations:
        - |
          Medians meet at the centroid, which is not equidistant from the vertices.
        - |
          Altitudes meet at the orthocentre; being perpendicular to a side says nothing about equal distances to vertices.
        - |
          The average of the vertices is the centroid, not the circumcentre.
        - |
          Correct. On the bisector of AB it is equidistant from A and B; on the bisector of BC it is equidistant from B and C; so it is the same distance from all three (the Perpendicular Bisector Theorem).
      answer: 3

    - slug: geo-u06-exam-q28
      type: multiple_choice
      topic_code: "1.11"
      source: "IM Geometry, Unit 1, Lesson 11"
      points: 1
      prompt: |
        Review. The rule (x, y) → (2c − x, y) reflects points across the line x = c. Which fact about reflections does the rule encode?
      options:
        - "Every point moves the same distance"
        - "The line of reflection is the perpendicular bisector of the segment joining a point to its image"
        - "A reflection preserves orientation"
        - "The image of a point is always on the opposite side of the origin"
      option_explanations:
        - |
          A point at distance d from the line moves 2d; points on the line do not move at all.
        - |
          Correct. The point and its image have the same y, so the joining segment is horizontal (perpendicular to x = c), and their x-coordinates average to c, so x = c bisects it.
        - |
          Reflections reverse orientation; that is why a reflected figure appears flipped.
        - |
          The reflection is across x = c, not through the origin; a point's side relative to the origin is irrelevant.
      answer: 1

    - slug: geo-u06-exam-q29
      type: multi_select
      topic_code: "6.6"
      source: "IM Geometry, Unit 6, Lesson 6"
      points: 2
      partial_credit: true
      prompt: |
        Which equations describe a circle with radius 3? Select all that apply.
      options:
        - "x² + y² − 2x + 4y − 4 = 0"
        - "2x² + 2y² − 8x − 10 = 0"
        - "x² + y² + 6y = 0"
        - "x² + y² − 10x + 25 = 9"
        - "(x − 1)² + (y + 1)² = 3"
      option_explanations:
        - |
          Yes: (x − 1)² + (y + 2)² = 4 + 1 + 4 = 9.
        - |
          Yes: dividing by 2 gives x² + y² − 4x = 5, then (x − 2)² + y² = 9.
        - |
          Yes: completing the square in y gives x² + (y + 3)² = 9, radius 3.
        - |
          Yes: (x − 5)² + y² = 9, a circle of radius 3 centred at (5, 0).
        - |
          No: the right side is r² = 3, so the radius is √3.
      answer: [0, 1, 2, 3]

    - slug: geo-u06-exam-q30
      type: multi_select
