          That theorem is about a quadrilateral's diagonals, not about midpoints of a triangle's sides.
        - |
          The Pythagorean theorem is about right triangles and side lengths; this is about parallel segments.
        - |
          Correct. The midsegment from (b, c) to (a + b, c) is horizontal (parallel to the base) and has length a, half of 2a.
