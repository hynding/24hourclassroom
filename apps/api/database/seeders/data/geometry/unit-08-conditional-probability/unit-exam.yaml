        - "P(A | B) = 0.6"
        - "P(A or B) = 0.70"
        - "A and B are independent"
        - "A and B are mutually exclusive"
      option_explanations:
        - |
          Yes: 30 of the 120 with A also have B, so 30/120 = 0.25.
        - |
          Yes: 30 of the 50 with B also have A, so 30/50 = 0.6.
        - |
          Yes: (120 + 50 − 30)/200 = 140/200 = 0.70 by the addition rule.
        - |
          Yes: P(B | A) = 0.25 = P(B) = 50/200, and equivalently 30/200 = 0.15 = 0.6 × 0.25.
        - |
          No: 30 people have both, so the events can happen together.
      answer: [0, 1, 2, 3]

