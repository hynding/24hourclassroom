    - slug: geo-u08-exam-q30
      type: multi_select
      topic_code: "8.10"
      source: "IM Geometry, Unit 8, Lesson 10"
      points: 2
      partial_credit: true
      prompt: |
        In a two-way table of 200 people, 120 have property A, 50 have property B and 30 have both. Which statements are true? Select all that apply.
      options:
