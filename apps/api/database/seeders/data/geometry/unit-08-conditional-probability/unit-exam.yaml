    - slug: geo-u08-exam-q42
      type: short_answer
      topic_code: "8.10"
      source: "IM Geometry, Unit 8, Lesson 10"
      points: 3
      prompt: |
        A school has 300 students. 180 play a sport (S), 120 take a music class (M), and 72 do both.

        (a) Build the two-way table: give the counts for "sport and music", "sport only", "music only" and "neither".

        (b) Compute P(M | S) and P(M).

        (c) Are "plays a sport" and "takes music" independent? Justify with your answers to (b), and state what independence means here in a sentence.
      answer: |
        (a) Sport and music: 72. Sport only: 180 − 72 = 108. Music only: 120 − 72 = 48. Neither: 300 − (72 + 108 + 48) = 72.

        (b) P(M | S) = 72/180 = 0.4. P(M) = 120/300 = 0.4.

        (c) Yes, independent: P(M | S) = P(M) (equivalently 72/300 = 0.24 = 0.6 × 0.4). Knowing that a student plays a sport does not change the chance that the student takes music; the music rate is 40% among athletes and 40% overall.
      explanation: |
        Scoring (3 points): 1 for the four correct cell counts (72, 108, 48, 72); 1 for both probabilities equal to 0.4 with correct denominators (180 and 300); 1 for "independent" justified by the equality in (b) or by the product test, with a plain-language sentence about knowing S not changing the chance of M.

    - slug: geo-u08-exam-q43
      type: short_answer
      topic_code: "8.11"
      source: "IM Geometry, Unit 8, Lesson 11"
      points: 3
      prompt: |
        A game uses a spinner with three equal regions numbered 1, 2, 3 and a fair coin; both are used once per turn. Player A wins if the spinner shows 3 or the coin shows heads (or both). Player B wins on every other outcome.

        (a) List the sample space and give P(A wins).

        (b) Give P(B wins) and decide whether the game is fair.

        (c) Change one rule so that the game becomes fair, and show that your rule gives each player probability 1/2.
      answer: |
        (a) Six equally likely outcomes: (1,H), (2,H), (3,H), (1,T), (2,T), (3,T). A wins on (1,H), (2,H), (3,H), (3,T): P(A wins) = 4/6 = 2/3.

        (b) B wins on (1,T) and (2,T): P(B wins) = 2/6 = 1/3. Not fair; A is favoured 2 to 1.

        (c) One fix: A wins if the coin shows heads, B wins if it shows tails, 3/6 each. Another: A wins on (3,H), (3,T), (1,H) and B wins on the other three outcomes; each has 3/6 = 1/2. Any rule assigning three of the six outcomes to each player works.
      explanation: |
        Scoring (3 points): 1 for the six-outcome sample space and P(A) = 2/3; 1 for P(B) = 1/3 and "not fair"; 1 for a rule giving each player exactly three of the six outcomes (or probability 1/2 each) with the check shown.

    - slug: geo-u08-exam-q44
      type: long_answer
      topic_code: "8.9"
      source: "IM Geometry, Unit 8, Lesson 9"
      points: 8
      prompt: |
        A factory uses two machines. Machine X makes 60% of its parts and 2% of X's parts are defective. Machine Y makes the other 40% and 5% of Y's parts are defective.

        (a) Imagine 1,000 parts. Build a two-way table (machine × defective or not) with the expected counts.

        (b) Find P(defective).

        (c) A defective part is found on the floor. Find P(made by X | defective), to three decimal places.

        (d) Are "made by X" and "defective" independent? Justify with probabilities from your table.

        (e) The factory wants its overall defect rate below 2.5% by moving more production to Machine X. If X makes a fraction p of the parts, write an inequality for p and solve it.
      answer: |
        (a) X makes 600 parts: 12 defective, 588 good. Y makes 400 parts: 20 defective, 380 good. Totals: 32 defective, 968 good, 1,000.

        | | Defective | Good | Total |
        |---|---|---|---|
        | X | 12 | 588 | 600 |
        | Y | 20 | 380 | 400 |
        | Total | 32 | 968 | 1000 |

        (b) P(defective) = 32/1000 = 0.032 (equivalently 0.6 × 0.02 + 0.4 × 0.05 = 0.012 + 0.020).

        (c) P(X | defective) = 12/32 = 0.375. Even though X makes most of the parts, most defective parts come from Y, because Y's defect rate is more than double X's.

        (d) Not independent. P(defective | X) = 12/600 = 0.02, but P(defective) = 0.032; the conditional probability differs from the unconditional one. (Equivalently P(X and defective) = 0.012 ≠ 0.6 × 0.032 = 0.0192.)

        (e) The overall defect rate is 0.02p + 0.05(1 − p) = 0.05 − 0.03p. Require 0.05 − 0.03p < 0.025, so 0.03p > 0.025 and p > 0.025/0.03 = 5/6 ≈ 0.833. Machine X must make more than five-sixths of the parts.
      explanation: |
        Scoring (8 points): 2 for a correct table (all four cells 12, 588, 20, 380 with correct totals; 1 point if one cell is wrong but the method is right); 1 for P(defective) = 0.032; 1 for P(X | defective) = 12/32 = 0.375 with the defective column as denominator; 1 for "not independent" with a correct comparison (0.02 versus 0.032, or the product test); 1 for setting up the expression 0.02p + 0.05(1 − p) for the overall rate; 1 for the inequality 0.05 − 0.03p < 0.025 correctly simplified; 1 for the solution p > 5/6 (about 83.3%) stated with its meaning. Deduct 1 overall if conditional probabilities are reversed anywhere but the rest is sound.
