      prompt: |
        True or false: if A and B are mutually exclusive and each has probability greater than 0, then A and B cannot be independent.
      answer: true
      explanation: |
        True. Independence needs P(A and B) = P(A) · P(B) > 0, but mutually exclusive events have P(A and B) = 0. Knowing A happened tells you B did not, which is the strongest kind of dependence.

