      source: "IM Geometry, Unit 8, Lesson 10"
      points: 3
      prompt: |
        A two-way table of 300 households shows: 120 have solar panels; 90 have an electric car; 36 have both.

        (a) Find P(electric car | solar panels) and P(electric car).
        (b) Decide whether "has solar panels" and "has an electric car" are independent, showing the multiplication test as well.
        (c) Fill in the number of households with neither, and find P(solar panels | no electric car).
      answer: |
        (a) P(car | solar) = 36/120 = 0.30; P(car) = 90/300 = 0.30.
        (b) Equal, so independent. Multiplication test: P(solar) · P(car) = 0.4 × 0.3 = 0.12 and P(both) = 36/300 = 0.12 ✓.
        (c) Neither: 300 − (36 + 84 + 54) = 126. P(solar | no car) = 84/210 = 0.40, which equals P(solar), as independence predicts.
      explanation: |
        1 point for both probabilities 0.30. 1 point for "independent" with the product check 0.12 = 0.12. 1 point for 126 and 0.40.

    - slug: geo-u08-w32-q24
      type: short_answer
      topic_code: "8.11"
      source: "IM Geometry, Unit 8, Lesson 11"
      points: 3
      prompt: |
        A carnival game: roll a fair die. On a 6 you win $10; on a 4 or 5 you win $2; otherwise nothing. It costs $3 to play.

        (a) Find the probability of each prize.
        (b) Compute the average winnings per play and say whether the game favours the player or the carnival.
        (c) The carnival wants the game to be exactly break-even on average (average winnings equal to the cost). Keeping the $2 prize, what should the top prize be?
      answer: |
        (a) P($10) = 1/6; P($2) = 2/6 = 1/3; P($0) = 3/6 = 1/2.
        (b) 10 × 1/6 + 2 × 1/3 = 1.667 + 0.667 ≈ $2.33 per play, less than $3: the carnival gains about 67 cents per play on average.
        (c) Need x/6 + 2/3 = 3, so x/6 = 7/3 and x = $14.
      explanation: |
        1 point for the three probabilities. 1 point for ≈ $2.33 and "favours the carnival". 1 point for $14.

    - slug: geo-u08-w32-q25
      type: long_answer
      topic_code: "8.9"
      source: "IM Geometry, Unit 8, Lesson 9"
      points: 6
      prompt: |
        A screening test for a plant disease is given to 1,000 plants. 5% of the plants actually have the disease. The test comes back positive for 90% of diseased plants and for 8% of healthy plants.

        (a) Build the two-way table (diseased / healthy against positive / negative) with totals.
        (b) Find P(positive).
        (c) Find P(diseased | positive) and explain in a sentence why it is so much smaller than 90%.
        (d) Find P(healthy | negative).
        (e) Are "diseased" and "positive" independent? Justify with a test.
      answer: |
        (a) Diseased: 50 plants; 45 positive, 5 negative. Healthy: 950 plants; 76 positive, 874 negative. Column totals: 121 positive, 879 negative; grand total 1,000.
        (b) P(positive) = 121/1000 = 0.121.
        (c) P(diseased | positive) = 45/121 ≈ 0.37. Because the disease is rare, the 8% false positives among the 950 healthy plants (76) outnumber the 45 true positives, so most positive results come from healthy plants.
        (d) P(healthy | negative) = 874/879 ≈ 0.994.
        (e) Dependent: P(positive | diseased) = 0.90 while P(positive) = 0.121; or P(diseased) · P(positive) = 0.05 × 0.121 ≈ 0.006 ≠ P(diseased and positive) = 0.045.
      explanation: |
        Scoring (6 points): (a) 1 point for a correct table. (b) 1 point for 0.121. (c) 2 points: 1 for ≈ 0.37, 1 for the explanation that false positives from the large healthy group outnumber true positives. (d) 1 point for ≈ 0.994. (e) 1 point for "dependent" with a valid test.
