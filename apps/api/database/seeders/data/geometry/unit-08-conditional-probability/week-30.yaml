    - slug: geo-u08-w30-q24
      type: short_answer
      topic_code: "8.2"
      source: "IM Geometry, Unit 8, Lesson 2"
      points: 3
      prompt: |
        A game uses a fair spinner with four equal regions numbered 1, 2, 3, 4, spun twice.

        (a) How many outcomes are in the sample space? List the outcomes in which the two spins add to 5.
        (b) Player A wins if the two spins add to 5; Player B wins if the two spins differ by exactly 1. Find each player's probability of winning and say whether the game is fair.
        (c) Propose a change to B's rule that makes the game fair, and show that it works.
      answer: |
        (a) 4 × 4 = 16 ordered pairs. Sum 5: (1, 4), (2, 3), (3, 2), (4, 1).
        (b) P(A wins) = 4/16 = 1/4. Differ by 1: (1, 2), (2, 1), (2, 3), (3, 2), (3, 4), (4, 3), so P(B wins) = 6/16 = 3/8. Not fair: B is more likely to win. (Note that (2, 3) and (3, 2) are wins for both players, so the rules would also need a tie-break.)
        (c) Change B's rule to "the two spins differ by exactly 2": (1, 3), (3, 1), (2, 4), (4, 2) are 4 outcomes, so P(B wins) = 4/16 = 1/4 = P(A wins), and no outcome is a win for both. (Any rule giving B exactly 4 of the 16 outcomes, none of which sum to 5, is acceptable.)
      explanation: |
        1 point for 16 and the four listed pairs. 1 point for 1/4 and 3/8 with "not fair". 1 point for a new rule giving B exactly 4 winning outcomes that do not overlap A's, with the check.

    - slug: geo-u08-w30-q25
      type: long_answer
      topic_code: "8.3"
      source: "IM Geometry, Unit 8, Lesson 3"
      points: 6
      prompt: |
        A carnival game has a spinner with three regions: red with central angle 180°, blue with 120°, and gold with 60°. A player spins twice.

        (a) Find P(red), P(blue) and P(gold) for one spin.
        (b) Explain why the 9 colour pairs for two spins are NOT equally likely, and find the probability of gold on both spins.
        (c) Find the probability that the two spins are the same colour.
        (d) The prize for "gold then gold" is $10, for "same colour, not gold" is $1, and for anything else nothing. If the game costs $1 to play, explain with a calculation whether a player should expect to gain or lose money over many plays.
      answer: |
        (a) P(red) = 180/360 = 1/2, P(blue) = 120/360 = 1/3, P(gold) = 60/360 = 1/6.
        (b) The regions have different sizes, so red is three times as likely as gold; the pairs inherit those unequal chances. P(gold, gold) = (1/6)(1/6) = 1/36, since the spins are independent.
        (c) P(same) = P(red, red) + P(blue, blue) + P(gold, gold) = 1/4 + 1/9 + 1/36 = 9/36 + 4/36 + 1/36 = 14/36 = 7/18 ≈ 0.389.
        (d) Over many plays, the average winnings per play are 10 · (1/36) + 1 · (13/36) + 0 · (22/36) = 23/36 ≈ $0.64, which is less than the $1 cost. The player should expect to lose about 36 cents per play on average.
      explanation: |
        Scoring (6 points): (a) 1 point for all three probabilities. (b) 2 points: 1 for the unequal-size explanation, 1 for 1/36. (c) 1 point for 7/18. (d) 2 points: 1 for the average winnings 23/36 ≈ $0.64 (accept a table of outcomes with the same total), 1 for comparing with $1 and concluding "lose".
