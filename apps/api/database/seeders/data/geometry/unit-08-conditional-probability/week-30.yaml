week: 30
unit: 8
title: "Chance, Sample Spaces and Two-Way Tables"
topics: ["8.1", "8.2", "8.3", "8.4"]
guide: guides/week-30.md
guide_description: |
  Outcomes, sample spaces, events and probability, spinners with unequal regions, model versus experiment, fair games, listing sample spaces with lists, tables and trees, the multiplication principle, and two-way tables with relative frequencies by grand total, row and column. Worked examples, Try-it problems and a self-check.
flashcards_description: |
  28 cards on probability vocabulary, equally likely outcomes, spinners, relative frequency, fair games, sample spaces, the multiplication principle and two-way tables. Review them before the week 30 quiz.
flashcards:
  - front: Sample space → definition
    back: |
      The set of all possible outcomes of a chance experiment. For one die it is {1, 2, 3, 4, 5, 6}; for two coins it is {HH, HT, TH, TT}.
    topic_code: "8.1"
  - front: Event (in probability) → definition
    back: |
      Any collection of outcomes from the sample space. "Even number" on a die is the event {2, 4, 6}.
    topic_code: "8.1"
  - front: Probability with equally likely outcomes → formula
    back: |
      P(event) = (number of outcomes in the event) ÷ (number of outcomes in the sample space). P(even on a die) = 3/6.
    topic_code: "8.1"
  - front: Range of a probability
    back: |
      From 0 (impossible) to 1 (certain). The probabilities of all the outcomes in a sample space add to 1.
    topic_code: "8.1"
  - front: Probability of a spinner region
    back: |
      Its central angle ÷ 360°, equivalently its sector area ÷ the circle's area. A 72° region has probability 1/5.
    topic_code: "8.1"
  - front: Relative frequency → definition
    back: |
      (times the event happened) ÷ (number of trials) in an actual experiment. 19 reds in 50 spins is 0.38.
    topic_code: "8.1"
  - front: Model probability versus relative frequency → how they compare
    back: |
      Relative frequency wobbles around the model probability and tends to get closer with more trials, but rarely equals it exactly. A large gap after many trials casts doubt on the model.
    topic_code: "8.1"
  - front: Chance versus skill → why it matters
    back: |
      Chance outcomes (cards, dice) get probabilities by counting; skill outcomes (free throws) need data from past performance.
    topic_code: "8.1"
  - front: Guessing one of four options → P(correct)
    back: |
      1/4. If two of five options count as correct, one random pick is right with probability 2/5.
    topic_code: "8.1"
  - front: Fair game → definition
    back: |
      Each player has the same probability of winning. Both players being able to win is not enough.
    topic_code: "8.2"
  - front: Two coins, A wins on a match, B on a mismatch → fair?
    back: |
      Yes: {HH, TT} versus {HT, TH}, 2/4 each.
    topic_code: "8.2"
  - front: Two dice, A wins on a sum of 7, B on a sum of 8 → fair?
    back: |
      No: 6/36 versus 5/36, and most rolls give neither.
    topic_code: "8.2"
  - front: How to test whether a game is fair
    back: |
      List the sample space, count each player's winning outcomes, compare the probabilities. Equal probabilities mean fair.
    topic_code: "8.2"
  - front: Simulation → what it is for
    back: |
      Estimating a probability by running a stand-in experiment many times (coins for children's genders, for instance) and recording the relative frequency.
    topic_code: "8.2"
  - front: Three ways to write a sample space
    back: |
      A list (small cases), a table (two actions), a tree diagram (actions in sequence; the leaves are the outcomes).
    topic_code: "8.3"
  - front: Multiplication principle for counting outcomes
    back: |
      m outcomes for one action and n for another give m × n for the pair. Two dice: 36; three coins: 8; a coin and a die: 12.
    topic_code: "8.3"
  - front: Two dice → P(sum = 7)
    back: |
      6 of the 36 ordered pairs (1+6, 2+5, 3+4, 4+3, 5+2, 6+1): 1/6. The 36 pairs, not the 11 sums, are the equally likely outcomes.
    topic_code: "8.3"
  - front: Three coins → P(exactly two heads)
    back: |
      HHT, HTH, THH: 3 of 8.
    topic_code: "8.3"
  - front: Error-spot → "(2, 5) and (5, 2) are the same outcome"
    back: |
      With two dice they are different ordered pairs. Dropping order undercounts and breaks "equally likely".
    topic_code: "8.3"
  - front: Drawing two from {A, B, C, D} without replacement → sample space size
    back: |
      4 × 3 = 12 ordered pairs. P(A is drawn) = 6/12 = 1/2.
    topic_code: "8.3"
  - front: P(at least one head) in three tosses → shortcut
    back: |
      1 − P(no heads) = 1 − 1/8 = 7/8. Complements turn "at least one" into "none".
    topic_code: "8.3"
  - front: Two-way table → what it holds
    back: |
      Counts classified by two variables at once, with row totals, column totals and a grand total.
    topic_code: "8.4"
  - front: Relative frequency table by the grand total → what it gives
    back: |
      Every cell ÷ grand total: the probability that a randomly chosen member is in that cell, such as P(walks and brings lunch) = 48/200 = 0.24.
    topic_code: "8.4"
  - front: Row relative frequency → the question it answers
    back: |
      Cell ÷ row total: "among the people in this row, what fraction …". 48 of 80 walkers bring lunch: 0.60.
    topic_code: "8.4"
  - front: Column relative frequency → the question it answers
    back: |
      Cell ÷ column total: "among the people in this column, what fraction …". 48 of 90 lunch-bringers walk: about 0.53.
    topic_code: "8.4"
  - front: P(A or B) from a two-way table
    back: |
      Add the relative frequencies of every cell in row A or column B, counting the shared cell once. Or 1 minus the cell in neither.
    topic_code: "8.4"
  - front: Error-spot → "P(walks and brings lunch) = 48/80"
    back: |
      48/80 is the fraction of walkers who bring lunch. "And" over the whole population is 48/200.
    topic_code: "8.4"
  - front: Build a two-way table from a word description → method
    back: |
      Name the two variables, draw a 2-by-2 grid with totals, fill the given numbers, subtract to fill the rest, check that rows and columns add up.
    topic_code: "8.4"
quiz:
  description: |
    25 questions · about 40 minutes · Outcomes, sample spaces and events, equally likely outcomes, spinners, relative frequency, fair games, listing and counting sample spaces, and two-way tables with relative frequencies, with review of sectors and central angles, area scaling, circle area and inscribed angles. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: geo-u08-w30-q01
      type: multiple_choice
      topic_code: "8.4"
      source: "IM Geometry, Unit 8, Lesson 4"
      points: 1
      stimulus: |
        A survey of 250 students recorded whether each plays a sport and whether each plays a musical instrument.

        | | Plays an instrument | No instrument | Total |
        |---|---|---|---|
        | Plays a sport | 60 | 90 | 150 |
        | No sport | 40 | 60 | 100 |
        | Total | 100 | 150 | 250 |
      prompt: |
        A student is chosen at random. What is the probability that the student plays a sport and an instrument?
      options:
        - "0.40"
        - "0.76"
        - "0.60"
        - "0.24"
      option_explanations:
        - |
          0.40 is 60/150, the fraction of sport players who play an instrument, a row relative frequency.
        - |
          0.76 is P(sport or instrument), everyone except the 60 who do neither; the question asks for "and".
        - |
          0.60 is 60/100, the fraction of instrument players who play a sport, or P(plays a sport) = 150/250; neither is the "and" probability.
        - |
          Correct. The "and" cell over the grand total: 60/250 = 0.24.
      answer: 3

    - slug: geo-u08-w30-q02
      type: multiple_choice
      topic_code: "8.4"
      source: "IM Geometry, Unit 8, Lesson 4"
      points: 1
      stimulus: |
        A survey of 250 students recorded whether each plays a sport and whether each plays a musical instrument.

        | | Plays an instrument | No instrument | Total |
        |---|---|---|---|
        | Plays a sport | 60 | 90 | 150 |
        | No sport | 40 | 60 | 100 |
        | Total | 100 | 150 | 250 |
      prompt: |
        Among the students who play a sport, what fraction play an instrument?
      options:
        - "0.60"
        - "0.24"
        - "0.40"
        - "0.36"
      option_explanations:
        - |
          0.60 is 90/150, the fraction of sport players with no instrument.
        - |
          0.24 is 60/250, the fraction of all students who do both.
        - |
          Correct. Divide by the row total: 60/150 = 0.40.
        - |
          0.36 is 90/250, the "sport and no instrument" cell over the grand total.
      answer: 2

    - slug: geo-u08-w30-q03
      type: multiple_choice
      topic_code: "8.4"
      source: "IM Geometry, Unit 8, Lesson 4"
      points: 1
      stimulus: |
        A survey of 250 students recorded whether each plays a sport and whether each plays a musical instrument.

        | | Plays an instrument | No instrument | Total |
        |---|---|---|---|
        | Plays a sport | 60 | 90 | 150 |
        | No sport | 40 | 60 | 100 |
        | Total | 100 | 150 | 250 |
      prompt: |
        What is the probability that a randomly chosen student plays a sport or an instrument (or both)?
      options:
        - "0.76"
        - "1.00"
        - "0.24"
        - "0.60"
      option_explanations:
        - |
          Correct. Everyone except the "no sport, no instrument" cell: 1 − 60/250 = 0.76, or (60 + 90 + 40)/250.
        - |
          Adding P(sport) + P(instrument) = 0.60 + 0.40 = 1.00 counts the 60 who do both twice.
        - |
          0.24 is the "and" probability, the single cell 60/250, not the "or".
        - |
          0.60 is P(sport) alone; "or" also includes the 40 who play an instrument but no sport.
      answer: 0

    - slug: geo-u08-w30-q04
      type: multiple_choice
      topic_code: "8.1"
      source: "IM Geometry, Unit 8, Lesson 1"
      points: 1
      prompt: |
        A spinner has four regions with central angles 60°, 60°, 90° and 150°. What is the probability of landing in the 150° region?
      options:
        - "150/360 + 1/4"
        - "5/12"
        - "1/4"
        - "1/2"
      option_explanations:
        - |
          Only the 150° region counts; nothing is added for other regions.
        - |
          Correct. 150/360 = 5/12; a region's probability is its share of the full turn.
        - |
          1/4 treats the four regions as equally likely, but they have different sizes.
        - |
          1/2 would need a 180° region; 150° is five twelfths of the circle.
      answer: 1

    - slug: geo-u08-w30-q05
      type: multiple_choice
      topic_code: "8.1"
      source: "IM Geometry, Unit 8, Lesson 1"
      points: 1
      prompt: |
        A model says a coin is fair. In 40 tosses it shows heads 24 times. Which conclusion is most reasonable?
      options:
        - "The probability of heads is now 0.60"
        - "The coin is definitely biased, because 24 ≠ 20"
        - "The relative frequency 0.60 is close enough to 0.5 for 40 tosses that the model is still plausible"
        - "The next 40 tosses must show fewer heads to balance out"
      option_explanations:
        - |
          A relative frequency estimates the probability but does not replace it; the model still says 0.5.
        - |
          An experiment almost never matches the model exactly; a difference of 4 in 40 is ordinary.
        - |
          Correct. Small samples wobble; 24 of 40 is not far from 20. Many more tosses would be needed to doubt the model.
        - |
          Coins have no memory; future tosses are not affected by past ones.
      answer: 2

    - slug: geo-u08-w30-q06
      type: multiple_choice
      topic_code: "8.2"
      source: "IM Geometry, Unit 8, Lesson 2"
      points: 1
      prompt: |
        Two players roll one fair die. Player A wins on a 1, 2 or 3; Player B wins on a 6. Which statement is correct?
      options:
        - "The game is unfair: P(A wins) = 1/2 and P(B wins) = 1/6"
        - "The game is fair because the die is fair"
        - "The game is unfair: P(A wins) = 3/4 and P(B wins) = 1/4"
        - "The game is fair because both players can win"
      option_explanations:
        - |
          Correct. A wins on 3 of 6 outcomes, B on 1 of 6, and a 4 or 5 is nobody's win.
        - |
          A fair die gives equally likely numbers, but the rules assign unequal sets of numbers to the players.
        - |
          The denominators must be the 6 outcomes of the die; 3/6 and 1/6, not 3/4 and 1/4.
        - |
          Fairness means equal probabilities of winning, not merely that each player could win.
      answer: 0

    - slug: geo-u08-w30-q07
      type: multiple_choice
      topic_code: "8.2"
      source: "IM Geometry, Unit 8, Lesson 2"
      points: 1
      prompt: |
        Which rule makes a game with two fair coins fair for players A and B?
      options:
        - "A wins if the first coin is heads; B wins if both are tails"
        - "A wins if both coins match; B wins if they differ"
        - "A wins if at least one coin is heads; B wins if both are tails"
        - "A wins if both are heads; B wins otherwise"
      option_explanations:
        - |
          A wins on HH and HT (2 of 4), B only on TT (1 of 4), and TH is nobody's win.
        - |
          Correct. {HH, TT} and {HT, TH} each have probability 2/4.
        - |
          A wins on HH, HT and TH, 3 of 4 outcomes, while B wins only on TT.
        - |
          A wins only on HH, 1 of 4 outcomes, while B wins on the other 3.
      answer: 1

    - slug: geo-u08-w30-q08
      type: multiple_choice
      topic_code: "8.3"
      source: "IM Geometry, Unit 8, Lesson 3"
      points: 1
      prompt: |
        Two fair dice are rolled. What is the probability that the sum is 10?
      options:
        - "2/36"
        - "10/36"
        - "1/11"
        - "3/36"
      option_explanations:
        - |
          (5, 5) is one outcome and (4, 6), (6, 4) are two more: three in all.
        - |
          The sum 10 is not a count of outcomes; only three pairs produce it.
        - |
          The 11 possible sums (2 to 12) are not equally likely; the 36 ordered pairs are.
        - |
          Correct. The pairs (4, 6), (5, 5) and (6, 4) give 10, out of 36 equally likely ordered pairs.
      answer: 3

    - slug: geo-u08-w30-q09
      type: multiple_choice
      topic_code: "8.3"
      source: "IM Geometry, Unit 8, Lesson 3"
      points: 1
      prompt: |
        A snack is chosen by picking one of 4 fruits, one of 3 crackers and one of 2 drinks. How many different snacks are possible, and what is the probability of a particular snack if all choices are made at random?
      options:
        - "9 snacks; 1/9"
        - "24 snacks; 1/24"
        - "24 snacks; 1/9"
        - "12 snacks; 1/12"
      option_explanations:
        - |
          9 adds the options; the choices combine by multiplying.
        - |
          Correct. The multiplication principle gives 4 × 3 × 2 = 24 equally likely snacks.
        - |
          The count is 24, so each of the 24 equally likely snacks has probability 1/24.
        - |
          12 leaves out the drink choice; 4 × 3 × 2 = 24.
      answer: 1

    - slug: geo-u08-w30-q10
      type: multiple_choice
      topic_code: "8.3"
      source: "IM Geometry, Unit 8, Lesson 3"
      points: 1
      prompt: |
        A fair coin is tossed four times. What is the probability of getting exactly one head?
      options:
        - "1/16"
        - "4/8"
        - "4/16"
        - "1/4 + 1/4 + 1/4 + 1/4 = 1"
      option_explanations:
        - |
          1/16 is the probability of one particular sequence, such as HTTT; there are four such sequences.
        - |
          Four tosses have 2⁴ = 16 outcomes, not 8; the four favourable sequences give 4/16.
        - |
          Correct. Of the 2⁴ = 16 equally likely sequences, four have exactly one head (HTTT, THTT, TTHT, TTTH).
        - |
          Probabilities of different positions are not added this way; the sample space has 16 outcomes and 4 are favourable.
      answer: 2

    - slug: geo-u08-w30-q11
      type: multiple_choice
      topic_code: "7.13"
      source: "IM Geometry, Unit 7, Lesson 13"
      points: 1
      prompt: |
        Review. A spinner of radius 4 has a prize region whose curved edge is 3 units long. What is the probability of landing in the prize region?
      options:
        - "3/4"
        - "0.75/360"
        - "3/(4π), about 0.239"
        - "3/(8π), about 0.119"
      option_explanations:
        - |
          3/4 is the angle in radians, not its share of the full turn 2π.
        - |
          0.75 is in radians, so it must be divided by 2π, not by 360.
        - |
          3/(4π) divides by π instead of 2π; a full turn is 2π radians.
        - |
          Correct. The central angle is 3/4 = 0.75 radians, and 0.75 ÷ 2π = 3/(8π) ≈ 0.119 of the full turn.
      answer: 3

    - slug: geo-u08-w30-q12
      type: multiple_choice
      topic_code: "7.8"
      source: "IM Geometry, Unit 7, Lesson 8"
      points: 1
      prompt: |
        Review. A spinner of radius 10 cm has a winning region that is a sector of area 20π cm². What is the probability of winning on one spin?
      options:
        - "1/5"
        - "1/10"
        - "1/4"
        - "20π/100"
      option_explanations:
        - |
          Correct. The circle's area is 100π, and 20π/100π = 1/5; the central angle would be 72°.
        - |
          1/10 would need a sector of 10π; the region is 20π of 100π.
        - |
          1/4 is a 90° region, area 25π, larger than this one.
        - |
          The denominator is the whole area 100π, so the π cancels and the fraction is 1/5.
      answer: 0

    - slug: geo-u08-w30-q13
      type: multiple_choice
      topic_code: "5.4"
      source: "IM Geometry, Unit 5, Lesson 4"
      points: 1
      prompt: |
        Review. A circular dartboard has radius 30 cm and a central bullseye of radius 6 cm. A dart that hits the board lands at a random point. What is the probability it lands in the bullseye?
      options:
        - "1/36"
        - "6/30"
        - "1/5"
        - "1/25"
      option_explanations:
        - |
          1/36 would be the square of 1/6; the radius ratio is 6/30 = 1/5.
        - |
          6/30 is a ratio of radii (lengths); the probability compares areas, so it must be squared.
        - |
          1/5 is the ratio of the radii; area scales by the square of that ratio.
        - |
          Correct. The bullseye is a dilation of the board by 1/5, so its area is (1/5)² = 1/25 of the board's.
      answer: 3

    - slug: geo-u08-w30-q14
      type: multi_select
      topic_code: "8.1"
      source: "IM Geometry, Unit 8, Lesson 1"
      points: 2
      partial_credit: true
      prompt: |
        A bag contains 4 red, 3 blue and 1 green marble; one is drawn at random. Which statements are true? Select all that apply.
      options:
        - "The sample space has 8 equally likely outcomes (the marbles)"
        - "P(blue or green) = 1/2"
        - "P(red) = 1/2"
        - "P(not green) = 7/8"
        - "P(red) = 1/3 because there are three colours"
      option_explanations:
        - |
          Yes: each of the 8 marbles is equally likely to be drawn.
        - |
          Yes: 3 + 1 = 4 of the 8 marbles are blue or green.
        - |
          Yes: 4 of the 8 equally likely marbles are red, so P(red) = 4/8 = 1/2.
        - |
          Yes: 7 of the 8 marbles are not green, so P(not green) = 7/8.
        - |
          No: the three colours are not equally likely; the marbles are.
      answer: [0, 1, 2, 3]

    - slug: geo-u08-w30-q15
      type: multi_select
      topic_code: "8.3"
      source: "IM Geometry, Unit 8, Lesson 3"
      points: 2
      partial_credit: true
      prompt: |
        Two fair dice are rolled. Which statements are true? Select all that apply.
      options:
        - "P(sum = 7) = 1/11"
        - "P(doubles) = 1/6"
        - "P(both dice show an even number) = 1/4"
        - "P(sum = 2) = P(sum = 12)"
        - "The sample space has 36 equally likely outcomes"
      option_explanations:
        - |
          No: 6 of the 36 pairs sum to 7, so the probability is 1/6; the 11 sums are not equally likely.
        - |
          Yes: the 6 doubles (1,1) to (6,6) out of 36 pairs give 1/6.
        - |
          Yes: 3 × 3 = 9 of the 36 pairs have both numbers even.
        - |
          Yes: each needs one specific pair, (1, 1) or (6, 6), probability 1/36 each.
        - |
          Yes: 6 × 6 ordered pairs, each with probability 1/36.
      answer: [1, 2, 3, 4]

    - slug: geo-u08-w30-q16
      type: true_false
      topic_code: "8.2"
      source: "IM Geometry, Unit 8, Lesson 2"
      points: 1
      prompt: |
        True or false: a game is fair if every player has the same probability of winning, even if on many turns nobody wins.
      answer: true
      explanation: |
        True. Fairness compares the players' winning probabilities with each other; turns with no winner do not favour anyone.

    - slug: geo-u08-w30-q17
      type: true_false
      topic_code: "7.2"
      source: "IM Geometry, Unit 7, Lesson 2"
      points: 1
      prompt: |
        Review. True or false: on a spinner, a region whose boundary points on the rim are seen from the centre at a 90° angle has probability 1/4, and an inscribed angle standing on that same arc would measure 45°.
      answer: true
      explanation: |
        True. The central angle 90° is a quarter of 360°, so the region's probability is 1/4; an inscribed angle on the same arc is half the central angle, 45°.

    - slug: geo-u08-w30-q18
      type: fill_blank
      topic_code: "8.3"
      source: "IM Geometry, Unit 8, Lesson 3"
      points: 1
      prompt: |
        A spinner with 3 equal regions is spun and a fair die is rolled. The sample space has ____ outcomes.
      answer: ["18"]
      explanation: |
        By the multiplication principle, 3 × 6 = 18 equally likely outcomes.

    - slug: geo-u08-w30-q19
      type: fill_blank
      topic_code: "7.11"
      source: "IM Geometry, Unit 7, Lesson 11"
      points: 1
      prompt: |
        Review. A spinner region has central angle π/3 radians. The probability of landing in it is 1/____.
      answer: ["6"]
      explanation: |
        π/3 is one sixth of the full turn 2π (equivalently 60° of 360°), so the probability is 1/6.

    - slug: geo-u08-w30-q20
      type: numeric
      topic_code: "8.1"
      source: "IM Geometry, Unit 8, Lesson 1"
      points: 1
      prompt: |
        A spinner has a red region with central angle 135°. What is the probability of landing on red? Give your answer as a decimal to three places.
      answer: { value: 0.375, tolerance: 0.001 }
      explanation: |
        135/360 = 3/8 = 0.375.

    - slug: geo-u08-w30-q21
      type: numeric
      topic_code: "6.4"
      source: "IM Geometry, Unit 6, Lesson 4"
      points: 1
      prompt: |
        Review. A point is chosen at random inside the circle x² + y² = 100. What is the probability that it lies inside the smaller circle x² + y² = 25? Give your answer as a decimal.
      answer: { value: 0.25, tolerance: 0.001 }
      explanation: |
        The circles have radii 10 and 5, so their areas are 100π and 25π, and the ratio is 1/4 = 0.25.

    - slug: geo-u08-w30-q22
      type: numeric
      topic_code: "4.11"
      source: "IM Geometry, Unit 4, Lesson 11"
      points: 1
      prompt: |
        Review. A square target of side 20 cm has a circular region of radius 10 cm inscribed in it (touching all four sides). A random point in the square lands in the circle with what probability? Use π ≈ 3.1416 and give your answer to three decimal places.
      answer: { value: 0.785, tolerance: 0.002 }
      explanation: |
        Circle area 100π ≈ 314.16; square area 400; ratio π/4 ≈ 0.785. (This ratio is a classic way to estimate π by random points.)

    - slug: geo-u08-w30-q23
      type: short_answer
      topic_code: "8.4"
      source: "IM Geometry, Unit 8, Lesson 4"
      points: 3
      prompt: |
        A library surveyed 120 visitors. 70 borrowed a book; of those, 28 also used a computer. Of the visitors who did not borrow a book, 32 used a computer.

        (a) Build the two-way table (borrowed / did not borrow against used a computer / did not), with totals.
        (b) Find the probability that a random visitor used a computer, and the probability that a random visitor borrowed a book and did not use a computer.
        (c) Among computer users, what fraction borrowed a book? Among non-users, what fraction borrowed a book? Compare the two.
      answer: |
        (a) Borrowed and computer 28; borrowed, no computer 42; not borrowed and computer 32; not borrowed, no computer 18. Row totals 70 and 50; column totals 60 and 60; grand total 120.
        (b) P(computer) = 60/120 = 0.5. P(borrowed and no computer) = 42/120 = 0.35.
