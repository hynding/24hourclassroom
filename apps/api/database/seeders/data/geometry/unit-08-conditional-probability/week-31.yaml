      source: "IM Geometry, Unit 8, Lesson 6"
      points: 6
      prompt: |
        A streaming service surveyed 1,000 subscribers. 620 watch dramas (D), 450 watch comedies (C), and 270 watch both.

        (a) Build the two-way table (D / not D against C / not C) with totals.
        (b) Find P(D or C) using the addition rule, and check it against the table.
        (c) Find P(C | D) and P(D | C), and explain why they differ.
        (d) Are D and C independent? Decide using P(C | D) and P(C), and give a one-sentence interpretation.
        (e) The service wants to recommend comedies to a random subscriber who does not watch dramas. What is the probability that this subscriber already watches comedies?
      answer: |
        (a) D and C: 270; D and not C: 350; not D and C: 180; not D and not C: 200. Row totals 620 and 380; column totals 450 and 550; grand total 1,000.
        (b) P(D or C) = 0.62 + 0.45 − 0.27 = 0.80. Table check: (270 + 350 + 180)/1000 = 800/1000 = 0.80 ✓.
        (c) P(C | D) = 270/620 ≈ 0.435; P(D | C) = 270/450 = 0.60. They have different denominators: the first is the share of drama watchers who watch comedies, the second the share of comedy watchers who watch dramas.
        (d) P(C) = 0.45 but P(C | D) ≈ 0.435: close but not equal, so strictly the events are dependent, though only slightly; knowing someone watches dramas barely changes the chance they watch comedies. (Check: P(D)P(C) = 0.279 versus P(D and C) = 0.27.)
        (e) P(C | not D) = 180/380 ≈ 0.47.
      explanation: |
        Scoring (6 points): (a) 1 point for a correct table. (b) 1 point for 0.80 with the check. (c) 1 point for both conditionals (≈ 0.435 and 0.60) and the explanation. (d) 2 points: 1 for comparing P(C | D) with P(C), 1 for the conclusion "dependent, but nearly independent" with an interpretation (accept "approximately independent" if the comparison is shown). (e) 1 point for ≈ 0.47.
