      source: "IM Geometry, Unit 8, Lesson 7"
      points: 3
      prompt: |
        A basketball player's record of 200 pairs of consecutive free throws shows: after making the first shot, she made the second 84 times out of 120; after missing the first, she made the second 56 times out of 80.

        (a) Find P(makes second | made first) and P(makes second | missed first).
        (b) Are "makes the first" and "makes the second" independent for this player, according to the data? Explain.
        (c) Explain why this question could not have been settled by counting outcomes in a sample space.
      answer: |
        (a) 84/120 = 0.70 and 56/80 = 0.70.
        (b) The two conditional probabilities are equal (and equal to her overall rate, 140/200 = 0.70), so the data show the events to be independent: knowing the first shot's result does not change the chance of making the second.
        (c) Free throws are a skill, not a chance device with equally likely outcomes; there is no sample space to count. Independence had to be tested by comparing observed rates.
      explanation: |
        1 point for both conditional probabilities 0.70. 1 point for "independent" with the reason that the conditionals match (and match the overall rate). 1 point for explaining that skill events need data rather than counting.

    - slug: geo-u08-w31-q25
      type: long_answer
