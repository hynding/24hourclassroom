week: 31
unit: 8
title: "Combining Events, the Addition Rule and Conditional Probability"
topics: ["8.5", "8.6", "8.7", "8.8"]
guide: guides/week-31.md
guide_description: |
  "And", "or" and "not" with Venn diagrams, lists and two-way tables; the addition rule and mutually exclusive events; dependent and independent events with and without replacement, the game-show door problem and data-based independence; and conditional probability P(A | B) = P(A and B)/P(B) from tables, lists and trees, with the multiplication rule. Worked examples, Try-it problems and a self-check.
flashcards_description: |
  30 cards on combining events, complements, the addition rule, mutual exclusivity, dependence and independence, and conditional probability. Review them before the week 31 quiz.
flashcards:
  - front: Event "A and B" → meaning
    back: |
      Both happen: the overlap of the two outcome sets. On a die, "even and greater than 3" is {4, 6}.
    topic_code: "8.5"
  - front: Event "A or B" → meaning
    back: |
      At least one happens: the union, with the overlap counted once. "Even or greater than 3" is {2, 4, 5, 6}.
    topic_code: "8.5"
  - front: Complement of an event → probability
    back: |
      P(not A) = 1 − P(A). Useful for "at least one": P(at least one six in four rolls) = 1 − (5/6)⁴ ≈ 0.518.
    topic_code: "8.5"
  - front: Venn diagram → what each region shows
    back: |
      The overlap is "A and B"; the two circles together are "A or B"; outside both is "neither".
    topic_code: "8.5"
  - front: Heart or face card from a standard deck → count
    back: |
      13 hearts + 12 face cards − 3 that are both = 22 of 52.
    topic_code: "8.5"
  - front: P(A or B) from a two-way table → method
    back: |
      Add every cell in row A and column B, counting the shared cell once; or subtract the "neither" cell from 1.
    topic_code: "8.5"
  - front: Error-spot → "P(A or B) = P(A) + P(B) always"
    back: |
      Only when A and B cannot both happen. Otherwise the overlap is counted twice and must be subtracted.
    topic_code: "8.5"
  - front: Addition rule → statement
    back: |
      P(A or B) = P(A) + P(B) − P(A and B).
    topic_code: "8.6"
  - front: Mutually exclusive events → definition and the rule
    back: |
      Events that cannot both happen, so P(A and B) = 0 and P(A or B) = P(A) + P(B). "Sum = 7" and "doubles" with two dice.
    topic_code: "8.6"
  - front: 60% sport, 45% instrument, 25% both → P(sport or instrument)
    back: |
      0.60 + 0.45 − 0.25 = 0.80, so 20% do neither.
    topic_code: "8.6"
  - front: Solve the addition rule for the overlap
    back: |
      P(A and B) = P(A) + P(B) − P(A or B). With 0.5, 0.4 and 0.7: overlap 0.2.
    topic_code: "8.6"
  - front: Spotting impossible probability claims with the addition rule
    back: |
      P(A or B) can never exceed 1, never be less than P(A) or P(B), and the overlap it implies must be between 0 and the smaller of P(A), P(B).
    topic_code: "8.6"
  - front: Two dice → P(sum is 5 or first die is 1)
    back: |
      4/36 + 6/36 − 1/36 = 9/36 = 1/4; the shared outcome is (1, 4).
    topic_code: "8.6"
  - front: Independent events → definition
    back: |
      Learning that one happened does not change the probability of the other. A coin toss and a die roll.
    topic_code: "8.7"
  - front: Dependent events → definition
    back: |
      Learning that one happened changes the probability of the other. Two draws from a box without replacement.
    topic_code: "8.7"
  - front: With replacement versus without → independence
    back: |
      With replacement the draws are independent; without replacement they are dependent, because the box changes.
    topic_code: "8.7"
  - front: Three doors, host knowingly opens an empty door → stay or switch?
    back: |
      Switch: staying wins 1/3 (first pick right), switching wins 2/3 (first pick wrong). Winning depends on the choice.
    topic_code: "8.7"
  - front: Three doors, host opens another door at random and it is empty → stay or switch?
    back: |
      No difference: each wins with probability 1/2. What the host knows is what creates the dependence in the classic version.
    topic_code: "8.7"
  - front: Twelve names, 5 from class A, two drawn without replacement → dependence
    back: |
      P(second from A) is 4/11 after an A-name and 5/11 after another: dependent.
    topic_code: "8.7"
  - front: When counting cannot decide independence
    back: |
      For skill events (free throws) you need data: compare the success rate after a make with the rate after a miss.
    topic_code: "8.7"
  - front: Error-spot → "unrelated-looking events are independent"
    back: |
      Independence is about information, not topic. Draws without replacement are dependent even when the colours have nothing to do with each other.
    topic_code: "8.7"
  - front: Error-spot → "mutually exclusive events are independent"
    back: |
      The opposite: if A and B cannot both happen (and both are possible), knowing A happened tells you B did not, so they are dependent.
    topic_code: "8.7"
  - front: Conditional probability P(A | B) → definition
    back: |
      The probability of A given that B happened: P(A and B) ÷ P(B), or (outcomes in both) ÷ (outcomes in B). The sample space shrinks to B.
    topic_code: "8.8"
  - front: One die → P(even | greater than 3)
    back: |
      Given {4, 5, 6}, two are even: 2/3. As a formula, (2/6)/(3/6).
    topic_code: "8.8"
  - front: P(A | B) versus P(B | A) → why they differ
    back: |
      Different denominators. P(brings lunch | walks) = 48/80 but P(walks | brings lunch) = 48/90.
    topic_code: "8.8"
  - front: Row and column relative frequencies → what they are in conditional language
    back: |
      Conditional probabilities: a row relative frequency is P(column event | row event), a column relative frequency is P(row event | column event).
    topic_code: "8.8"
  - front: Multiplication rule → statement
    back: |
      P(A and B) = P(B) × P(A | B). Box with 3 red and 2 blue, two draws: P(both red) = (3/5)(2/4) = 0.3.
    topic_code: "8.8"
  - front: Tree diagram → how to read P(A and B) and P(B)
    back: |
      Multiply along a branch for "and"; add the leaves that belong to B for P(B). Drivers: 0.2 × 0.3 = 0.06 under-25 accidents; P(accident) = 0.06 + 0.08 = 0.14.
    topic_code: "8.8"
  - front: Reversing a tree → P(under 25 | accident)
    back: |
      P(under 25 and accident)/P(accident) = 0.06/0.14 ≈ 0.43, even though under-25s are only 20% of drivers.
    topic_code: "8.8"
  - front: Independence in conditional language
    back: |
      A and B are independent exactly when P(A | B) = P(A). Coin and die: P(6 | heads) = 1/6 = P(6).
    topic_code: "8.8"
quiz:
  description: |
    25 questions · about 40 minutes · "And", "or" and complements, the addition rule and mutually exclusive events, dependent and independent events, and conditional probability from tables, lists and trees, with review of sample spaces, two-way tables, fair games, spinners and sector fractions and areas. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: geo-u08-w31-q01
      type: multiple_choice
      topic_code: "8.8"
      source: "IM Geometry, Unit 8, Lesson 8"
      points: 1
      stimulus: |
        A clinic recorded 400 patients by age group and whether they had a flu shot.

        | | Flu shot | No flu shot | Total |
        |---|---|---|---|
        | Under 65 | 120 | 180 | 300 |
        | 65 and over | 70 | 30 | 100 |
        | Total | 190 | 210 | 400 |
      prompt: |
        A patient is chosen at random. What is P(flu shot | 65 and over)?
      options:
        - "0.70"
        - "0.475"
        - "0.368"
        - "0.175"
      option_explanations:
        - |
          Correct. Restrict to the 100 patients aged 65 and over: 70 of them had the shot, 70/100 = 0.70.
        - |
          0.475 is 190/400, P(flu shot) with no condition.
        - |
          0.368 is 70/190, P(65 and over | flu shot): the condition is reversed.
        - |
          0.175 is 70/400, P(flu shot and 65 and over), the joint probability with the grand total as denominator.
      answer: 0

    - slug: geo-u08-w31-q02
      type: multiple_choice
      topic_code: "8.8"
      source: "IM Geometry, Unit 8, Lesson 8"
      points: 1
      stimulus: |
        A clinic recorded 400 patients by age group and whether they had a flu shot.

        | | Flu shot | No flu shot | Total |
        |---|---|---|---|
        | Under 65 | 120 | 180 | 300 |
        | 65 and over | 70 | 30 | 100 |
        | Total | 190 | 210 | 400 |
      prompt: |
        What is P(65 and over | flu shot)?
      options:
        - "70/100 = 0.70"
        - "70/190 ≈ 0.37"
        - "100/400 = 0.25"
        - "70/400 = 0.175"
      option_explanations:
        - |
          70/100 is the other conditional, P(flu shot | 65 and over).
        - |
          Correct. Among the 190 who had a shot, 70 are 65 and over.
        - |
          100/400 is P(65 and over) without any condition.
        - |
          70/400 is the joint probability, not a conditional one.
      answer: 1

    - slug: geo-u08-w31-q03
      type: multiple_choice
      topic_code: "8.6"
      source: "IM Geometry, Unit 8, Lesson 6"
      points: 1
      stimulus: |
        A clinic recorded 400 patients by age group and whether they had a flu shot.

        | | Flu shot | No flu shot | Total |
        |---|---|---|---|
        | Under 65 | 120 | 180 | 300 |
        | 65 and over | 70 | 30 | 100 |
        | Total | 190 | 210 | 400 |
      prompt: |
        Using the addition rule, what is P(flu shot or 65 and over)?
      options:
        - "0.475 + 0.25 = 0.725"
        - "0.175"
        - "1 − 0.175 = 0.825"
        - "0.475 + 0.25 − 0.175 = 0.55"
      option_explanations:
        - |
          Adding without subtracting counts the 70 patients in both groups twice.
        - |
          0.175 is the "and" probability, the overlap cell 70/400 alone, not the union.
        - |
          1 − 0.175 subtracts the overlap instead of the "neither" cell (180/400 = 0.45); 1 − 0.45 = 0.55.
        - |
          Correct. P(shot) = 190/400, P(65+) = 100/400, both = 70/400; the union is 220/400 = 0.55, the patients outside the "under 65, no shot" cell.
      answer: 3

    - slug: geo-u08-w31-q04
      type: multiple_choice
      topic_code: "8.5"
      source: "IM Geometry, Unit 8, Lesson 5"
      points: 1
      prompt: |
        One fair die is rolled. Let A = "prime number" and B = "greater than 2". Which set is the event "A and B"?
      options:
        - "{2, 3, 5}"
        - "{2, 3, 4, 5, 6}"
        - "{3, 5}"
        - "{4, 6}"
      option_explanations:
        - |
          This is A alone; 2 is prime but not greater than 2.
        - |
          This is "A or B", the union of the two sets.
        - |
          Correct. Primes are {2, 3, 5}; of these, 3 and 5 are greater than 2.
        - |
          These are in B but not in A, the event "B and not A".
      answer: 2

    - slug: geo-u08-w31-q05
      type: multiple_choice
      topic_code: "8.5"
      source: "IM Geometry, Unit 8, Lesson 5"
      points: 1
      prompt: |
        A card is drawn from a standard 52-card deck. What is the probability that it is a club or a king?
      options:
        - "13/52"
        - "16/52"
        - "17/52"
        - "4/52"
      option_explanations:
        - |
          13 is the clubs alone; the three other kings must be added.
        - |
          Correct. 13 clubs + 4 kings − 1 king of clubs = 16 cards.
        - |
          17 counts the king of clubs twice; it is both a club and a king.
        - |
          4 is the kings alone; the twelve other clubs must be added.
      answer: 1

    - slug: geo-u08-w31-q06
      type: multiple_choice
      topic_code: "8.6"
      source: "IM Geometry, Unit 8, Lesson 6"
      points: 1
      prompt: |
        P(A) = 0.55, P(B) = 0.4 and P(A or B) = 0.8. What is P(A and B)?
      options:
        - "0.15"
        - "0"
        - "0.22"
        - "0.95"
      option_explanations:
        - |
          Correct. P(A and B) = P(A) + P(B) − P(A or B) = 0.55 + 0.4 − 0.8 = 0.15.
        - |
          The overlap is 0 only if P(A or B) = P(A) + P(B) = 0.95, but it is 0.8.
        - |
          0.22 is P(A) × P(B), which would be the overlap only if A and B were independent; here the addition rule gives 0.15, so they are not.
        - |
          0.95 is P(A) + P(B), which exceeds P(A or B) by exactly the overlap.
      answer: 0

    - slug: geo-u08-w31-q07
      type: multiple_choice
      topic_code: "8.6"
      source: "IM Geometry, Unit 8, Lesson 6"
      points: 1
      prompt: |
        Which pair of events is mutually exclusive when one card is drawn from a standard deck?
      options:
        - "Drawing a red card; drawing a diamond"
        - "Drawing a face card; drawing a king"
        - "Drawing a heart; drawing a spade"
        - "Drawing a heart; drawing a queen"
      option_explanations:
        - |
          Every diamond is red, so the events overlap completely.
        - |
          Every king is a face card, so the events overlap completely in the kings.
        - |
          Correct. No card is both a heart and a spade, so P(heart and spade) = 0 and P(heart or spade) = 13/52 + 13/52.
        - |
          The queen of hearts is both a heart and a queen, so the events overlap.
      answer: 2

    - slug: geo-u08-w31-q08
      type: multiple_choice
      topic_code: "8.7"
      source: "IM Geometry, Unit 8, Lesson 7"
      points: 1
      prompt: |
        A box holds 4 red and 6 green tokens. Two tokens are drawn one after the other. In which case are the events "first is red" and "second is red" independent?
      options:
        - "Never, because the tokens come from the same box"
        - "Always, because the colours do not affect each other"
        - "When the first token is not put back"
        - "When the first token is put back before the second draw"
      option_explanations:
        - |
          Replacement restores the box, which makes the draws independent.
        - |
          Independence depends on whether the box changes, not on whether the colours are "related".
        - |
          Without replacement, P(second red) is 3/9 after a red and 4/9 after a green: dependent.
        - |
          Correct. With replacement the box is the same for the second draw, so P(second red) = 4/10 whatever the first was.
      answer: 3

    - slug: geo-u08-w31-q09
      type: multiple_choice
      topic_code: "8.7"
      source: "IM Geometry, Unit 8, Lesson 7"
      points: 1
      prompt: |
        In the three-door game, you choose door 1. The host, who knows where the prize is, opens an empty door among the other two and offers you a switch. What is the probability of winning if you switch, and why?
      options:
        - "1/3, because switching does not change anything"
        - "1, because the host always leaves the prize behind the other door"
        - "2/3, because switching wins exactly when your first choice was wrong"
        - "1/2, because two doors remain"
      option_explanations:
        - |
          Staying wins 1/3; switching wins the complementary 2/3.
        - |
          If your first pick was right (probability 1/3), switching loses.
        - |
          Correct. Your first pick is wrong with probability 2/3, and in that case the host's reveal leaves the prize behind the one door you can switch to.
        - |
          The two remaining doors are not equally likely; the host's informed choice shifts the odds.
      answer: 2

    - slug: geo-u08-w31-q10
      type: multiple_choice
      topic_code: "8.8"
      source: "IM Geometry, Unit 8, Lesson 8"
      points: 1
      prompt: |
        Two fair dice are rolled. What is P(sum = 9 | the first die shows 4)?
      options:
        - "4/36"
        - "1/6"
        - "4/9"
        - "1/36"
      option_explanations:
        - |
          4/36 is P(sum = 9) with no condition, over all 36 outcomes.
        - |
          Correct. Given a 4 first, the sum is 9 only if the second die is 5: 1 of the 6 possible second rolls.
        - |
          4/9 has no meaning here; the condition leaves 6 equally likely outcomes.
        - |
          1/36 is P(first 4 and sum 9), the joint probability; divide by P(first 4) = 1/6 to condition.
      answer: 1

    - slug: geo-u08-w31-q11
      type: multiple_choice
      topic_code: "8.8"
      source: "IM Geometry, Unit 8, Lesson 8"
      points: 1
      prompt: |
        A bag holds 3 white and 5 black beads. Two are drawn without replacement. What is P(both white)?
      options:
        - "(3/8)(2/7) = 6/56"
        - "(3/8)(3/8) = 9/64"
        - "(3/8)(2/8) = 6/64"
        - "3/8 + 2/7"
      option_explanations:
        - |
          Correct. P(first white) × P(second white | first white) = (3/8)(2/7).
        - |
          (3/8)² assumes replacement; after a white is removed, 2 whites remain among 7 beads.
        - |
          The second denominator must shrink to 7 as well, since a bead was removed.
        - |
          "Both" is an "and", which multiplies; adding gives a number greater than 1 in other cases and is never right here.
      answer: 0

    - slug: geo-u08-w31-q12
      type: multiple_choice
      topic_code: "8.3"
      source: "IM Geometry, Unit 8, Lesson 3"
      points: 1
      prompt: |
        Review. How many outcomes are in the sample space for drawing two beads one after another, without replacement, from a bag of 8 distinct beads?
      options:
        - "64"
        - "16"
        - "28"
        - "56"
      option_explanations:
        - |
          64 = 8 × 8 would allow the same bead twice, which is replacement.
        - |
          16 adds the choices instead of multiplying.
        - |
          28 counts unordered pairs; the draws happen in order, so (A, B) and (B, A) are different outcomes.
        - |
          Correct. 8 choices for the first bead and 7 for the second: 8 × 7 = 56 ordered pairs.
      answer: 3

    - slug: geo-u08-w31-q13
      type: multiple_choice
      topic_code: "7.8"
      source: "IM Geometry, Unit 7, Lesson 8"
      points: 1
      prompt: |
        Review. A spinner has a red region of 120° and a blue region of 90°; the rest is white. The spinner is spun once. What is P(red or blue)?
      options:
        - "7/12"
        - "1/12"
        - "5/12"
        - "1/3 + 1/4 − 1/12"
      option_explanations:
        - |
          Correct. Red and blue are separate regions, so the events are mutually exclusive: 120/360 + 90/360 = 210/360 = 7/12.
        - |
          1/12 is the product (1/3)(1/4), which is not the "or" probability.
        - |
          5/12 is the white region, 150/360, the complement of red or blue.
        - |
          There is no overlap to subtract; one spin lands in exactly one region.
      answer: 0

    - slug: geo-u08-w31-q14
      type: multi_select
      topic_code: "8.7"
      source: "IM Geometry, Unit 8, Lesson 7"
      points: 2
      partial_credit: true
      prompt: |
        Which pairs of events are independent? Select all that apply.
      options:
        - "Spinning a spinner twice; the first spin lands on red; the second spin lands on red"
        - "Drawing an ace from a deck; drawing an ace again without replacing"
        - "Drawing an ace from a deck; drawing an ace again after replacing and shuffling"
        - "Rolling a die and getting an even number; rolling the same die and getting a 4"
        - "Tossing a coin and getting heads; rolling a die and getting a 6"
      option_explanations:
        - |
          Yes: a spinner has no memory, so the second spin's probability does not depend on the first.
        - |
          No: without replacement P(second ace) is 3/51 after an ace and 4/51 otherwise.
        - |
          Yes: replacing and shuffling restores the deck, so the second draw is unaffected.
        - |
          No: these are two events on the same roll; knowing the roll is even raises P(4) from 1/6 to 1/3.
        - |
          Yes: the coin has no effect on the die; P(6 | heads) = 1/6 = P(6).
      answer: [0, 2, 4]

    - slug: geo-u08-w31-q15
      type: multi_select
      topic_code: "8.4"
      source: "IM Geometry, Unit 8, Lesson 4"
      points: 2
      partial_credit: true
      prompt: |
        Review. In a two-way table of 500 people, 200 are left-handed-or-ambidextrous (call it L) and 150 are musicians (M); 60 are both. Which statements are true? Select all that apply.
      options:
        - "The cell \"L and not M\" holds 140 people"
        - "The cell \"neither\" holds 210 people"
        - "P(L or M) = 0.58"
        - "P(L and M) = 0.12"
        - "The cell \"not L and M\" holds 90 people"
      option_explanations:
        - |
          Yes: the 200 in L minus the 60 who are also in M leaves 140.
        - |
          Yes: 500 − (140 + 60 + 90) = 210 people are in neither group.
        - |
          Yes: (140 + 60 + 90)/500 = 290/500 = 0.58, also 0.4 + 0.3 − 0.12.
        - |
          Yes: the overlap cell over the grand total, 60/500 = 0.12.
        - |
          Yes: the 150 in M minus the 60 who are also in L leaves 90.
      answer: [0, 1, 2, 3, 4]

    - slug: geo-u08-w31-q16
      type: true_false
      topic_code: "8.3"
      source: "IM Geometry, Unit 8, Lesson 3"
      points: 1
      prompt: |
        Review. True or false: tossing a fair coin five times has a sample space of 32 equally likely outcomes.
      answer: true
      explanation: |
        True. By the multiplication principle there are 2⁵ = 32 sequences, and with a fair coin each has probability 1/32.

    - slug: geo-u08-w31-q17
      type: true_false
      topic_code: "8.2"
      source: "IM Geometry, Unit 8, Lesson 2"
      points: 1
      prompt: |
        Review. True or false: in a game where A wins on a sum of 7 with two dice and B wins on doubles, the game is fair.
      answer: true
      explanation: |
        True. Each player wins on 6 of the 36 equally likely outcomes, and no outcome is a win for both (no double sums to 7).

    - slug: geo-u08-w31-q18
      type: fill_blank
      topic_code: "8.8"
      source: "IM Geometry, Unit 8, Lesson 8"
      points: 1
      prompt: |
        If P(A and B) = 0.12 and P(B) = 0.4, then P(A | B) = ____.
      answer: ["0.3", "0.30", "3/10", "30%"]
      explanation: |
        P(A | B) = P(A and B)/P(B) = 0.12/0.4 = 0.3.

    - slug: geo-u08-w31-q19
      type: fill_blank
      topic_code: "8.6"
      source: "IM Geometry, Unit 8, Lesson 6"
      points: 1
      prompt: |
        If P(A) = 0.5, P(B) = 0.3 and P(A and B) = 0.1, then P(A or B) = ____.
      answer: ["0.7", "0.70", "7/10", "70%"]
      explanation: |
        0.5 + 0.3 − 0.1 = 0.7 by the addition rule.

    - slug: geo-u08-w31-q20
      type: numeric
      topic_code: "8.1"
      source: "IM Geometry, Unit 8, Lesson 1"
      points: 1
      prompt: |
        Review. A bag holds 5 red, 4 blue and 3 green marbles. One is drawn at random. What is the probability that it is not red? Give your answer as a decimal to three places.
      answer: { value: 0.583, tolerance: 0.002 }
      explanation: |
        7 of the 12 marbles are not red: 7/12 ≈ 0.583.

    - slug: geo-u08-w31-q21
      type: numeric
      topic_code: "8.8"
      source: "IM Geometry, Unit 8, Lesson 8"
      points: 1
      prompt: |
        Of a school's students, 40% take the bus. Of bus riders, 25% arrive before 8:00; of the others, 55% arrive before 8:00. What is the probability that a randomly chosen student takes the bus and arrives before 8:00? Give your answer as a decimal.
      answer: { value: 0.1, tolerance: 0.001 }
      explanation: |
        P(bus and early) = P(bus) × P(early | bus) = 0.40 × 0.25 = 0.10.

    - slug: geo-u08-w31-q22
      type: numeric
      topic_code: "7.13"
      source: "IM Geometry, Unit 7, Lesson 13"
      points: 1
      prompt: |
        Review. A spinner of radius 6 has a winning sector of area 9. What is the probability of winning? Give your answer as a decimal to three places.
      answer: { value: 0.080, tolerance: 0.002 }
      explanation: |
        The circle's area is 36π ≈ 113.1, so 9/113.1 ≈ 0.080. (The central angle is 2 · 9/36 = 0.5 radians, and 0.5/(2π) ≈ 0.080.)

