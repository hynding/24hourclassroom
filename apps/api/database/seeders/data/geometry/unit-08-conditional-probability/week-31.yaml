      prompt: |
        In a town, 30% of households own a dog. Of the dog-owning households, 40% also own a cat; of the households without a dog, 20% own a cat.

        (a) Draw or describe the tree and find P(dog and cat).
        (b) Find P(cat).
        (c) Find P(dog | cat) and explain in a sentence what it means.
      answer: |
        (a) First split dog (0.3) / no dog (0.7); then cat (0.4) / no cat (0.6) under dog, and cat (0.2) / no cat (0.8) under no dog. P(dog and cat) = 0.3 × 0.4 = 0.12.
        (b) P(cat) = 0.12 + 0.7 × 0.2 = 0.12 + 0.14 = 0.26.
        (c) P(dog | cat) = 0.12/0.26 ≈ 0.46: among the households that own a cat, about 46% also own a dog, higher than the 30% of all households that own a dog.
      explanation: |
        1 point for the tree and 0.12. 1 point for 0.26. 1 point for ≈ 0.46 with a correct interpretation ("of cat owners, 46% have a dog").

    - slug: geo-u08-w31-q24
