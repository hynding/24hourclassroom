    - slug: geo-u01-exam-q32
      type: multi_select
      topic_code: "1.10"
      source: "IM Geometry, Unit 1, Lesson 10"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are preserved by every rigid transformation? Select all that apply.
