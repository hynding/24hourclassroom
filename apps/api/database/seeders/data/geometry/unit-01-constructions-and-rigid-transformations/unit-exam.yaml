        - "Angle measure"
        - "Orientation (clockwise versus counter-clockwise)"
        - "Area"
        - "Parallelism of lines"
      option_explanations:
        - |
          Yes: preserving every distance is the definition of a rigid transformation.
        - |
          Yes: angles are determined by distances, so they are preserved.
        - |
          No: reflections reverse orientation, although translations and rotations keep it.
        - |
          Yes: area is built from lengths, which do not change.
        - |
          Yes: parallel lines stay parallel because lines map to lines and distances between them are preserved.
