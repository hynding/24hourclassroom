        What is ∠ACB?
      options:
        - "71°"
        - "109°"
        - "13°"
        - "119°"
      option_explanations:
        - |
          Correct. D, C, E are collinear, so ∠DCA + ∠ACB + ∠BCE = 180°, giving ∠ACB = 180 − 48 − 61 = 71°. (Equivalently, the triangle's angles are 48°, 61° and 71°.)
        - |
          109° is 48 + 61, the sum of the two outside angles, not the angle between them.
        - |
          13° is the difference 61 − 48, which has no meaning here.
        - |
          119° would be the exterior angle at B (180 − 61), not ∠ACB.
      answer: 0

