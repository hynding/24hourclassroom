unit: 1
description: |
  47 questions · about 80 minutes · covers every lesson of Unit 1 (constructions, rigid transformations, symmetry,
  proof, transversals and the triangle angle sum). Multiple choice, select-all, true/false and numeric items are
  graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are
  graded by your teacher against the scoring notes.
questions:
    - slug: geo-u01-exam-q01
      type: multiple_choice
      topic_code: "1.1"
      source: "IM Geometry, Unit 1, Lesson 1"
      points: 1
      prompt: |
        A compass is opened to the length of segment RS, and a circle is drawn with its point on T. Point U is marked on the circle. Which statement is justified, and by what?
      options:
        - "TU = RS, by the definition of a circle"
        - "RU = RS, by the definition of a circle"
        - "TU = RS, because the compass measured the length"
        - "TU = TS, because T is the centre"
      option_explanations:
        - |
          Correct. U is on the circle centred at T with radius RS, so the distance from T to U is the radius, RS.
        - |
          The circle is centred at T, so the definition says nothing about distances from R.
        - |
          The compass transfers a length without measuring; the justification is the definition of a circle, not measurement.
        - |
          S is not on the circle in general, so TS need not equal the radius.
      answer: 0

    - slug: geo-u01-exam-q02
      type: multiple_choice
      topic_code: "1.3"
      source: "IM Geometry, Unit 1, Lesson 3"
      points: 1
      prompt: |
        Segment AB has length 12. A student draws a circle of radius 8 centred at A and a circle of radius 8 centred at B; they cross at P and Q. Which statement is true?
      options:
        - "Line PQ is the perpendicular bisector of AB, and PA = PB = 8"
        - "Line PQ is the perpendicular bisector of AB, and PA = 6"
        - "Line PQ is not the perpendicular bisector because the radius is not 12"
        - "The circles do not cross because 8 is less than 12"
      option_explanations:
        - |
          Correct. Equal radii make P and Q equidistant from A and B, so PQ is the perpendicular bisector; PA = PB = 8 as radii.
        - |
          PA is the radius 8; 6 is the distance from A to the midpoint of AB.
        - |
          Any common radius greater than half of AB works; it need not equal AB.
        - |
          The circles cross because 8 + 8 = 16 > 12.
      answer: 0

    - slug: geo-u01-exam-q03
      type: multiple_choice
      topic_code: "1.2"
      source: "IM Geometry, Unit 1, Lesson 2"
      points: 1
      prompt: |
        In the six-petal pattern made from a circle of radius r centred at O and six circles of radius r centred at points A–F on it, what is the distance between two points that are two steps apart, such as A and C?
      options:
        - "r"
        - "2r"
        - "r√3"
        - "r√2"
      option_explanations:
        - |
          r is the distance between neighbouring points, such as A and B.
        - |
          2r is the distance between opposite points, three steps apart, such as A and D.
        - |
          Correct. Triangle OAC has OA = OC = r and ∠AOC = 120° (two 60° angles), so AC = r√3; equivalently AC is the longer diagonal of rhombus OABC.
        - |
          r√2 would require a right angle at O, but ∠AOC is 120°.
      answer: 2

    - slug: geo-u01-exam-q04
      type: multiple_choice
      topic_code: "1.4"
      source: "IM Geometry, Unit 1, Lesson 4"
      points: 1
      prompt: |
        Euclid's first proposition constructs an equilateral triangle on segment AB. Which pair of statements is the proof that the triangle is equilateral?
      options:
        - "AC = AB because C is on the circle centred at A with radius AB; BC = AB because C is on the circle centred at B with radius AB"
        - "AC = BC because C is on the perpendicular bisector of AB; AB = AC because the triangle is symmetric"
        - "All three sides are equal because the two circles are congruent"
        - "∠A = ∠B = ∠C = 60°, so the sides are equal"
      option_explanations:
        - |
          Correct. Each equality comes from the definition of one circle; together they give AB = BC = CA.
        - |
          C is on the perpendicular bisector, but that only gives AC = BC; the symmetry claim is not a justification.
        - |
          Congruent circles alone do not say which segments are radii; the argument must name the circles each side belongs to.
        - |
          The angles being 60° is a consequence proved later; the construction establishes the sides directly.
      answer: 0

    - slug: geo-u01-exam-q05
      type: multiple_choice
      topic_code: "1.5"
      source: "IM Geometry, Unit 1, Lesson 5"
      points: 1
      prompt: |
        To bisect ∠AVB, a circle centred at V marks X on VA and Y on VB, and then circles of radius 5 centred at X and Y cross at Z. If instead the circle at Y had radius 6, what would go wrong?
      options:
        - "XZ ≠ YZ, so VXZY would not be a kite and VZ would not bisect the angle"
        - "VX ≠ VY, so the first step would be invalid"
        - "The circles would not cross at all"
        - "Nothing; the radius of the second circle does not matter"
      option_explanations:
        - |
          Correct. The bisector argument needs XZ = YZ as well as VX = VY; with different radii the symmetry across VZ is lost.
        - |
          VX = VY comes from the first circle at V and is unaffected by the later radii.
        - |
          Circles of radius 5 and 6 generally still cross; the problem is that the crossing is not on the bisector.
        - |
          The radius does matter: the two circles in the second step must be equal.
      answer: 0

    - slug: geo-u01-exam-q06
      type: multiple_choice
      topic_code: "1.6"
      source: "IM Geometry, Unit 1, Lesson 6"
      points: 1
      prompt: |
        Which statement correctly justifies that the line n, constructed as the perpendicular through P to the perpendicular m from P to ℓ, is parallel to ℓ?
      options:
        - "n and ℓ are both perpendicular to m, and two lines perpendicular to the same line cannot meet"
        - "n is the same distance from ℓ at P"
        - "n passes through P and ℓ does not"
        - "n and m are perpendicular, and perpendicular lines are parallel"
      option_explanations:
        - |
          Correct. If n and ℓ met, the triangle formed with m would have two right angles, impossible by the angle sum.
        - |
          Constant distance is a consequence of parallelism and cannot be checked at one point.
        - |
          Many non-parallel lines pass through P; this is not a reason.
        - |
          Perpendicular lines meet at right angles; the parallel pair is n and ℓ, both perpendicular to m.
      answer: 0

    - slug: geo-u01-exam-q07
      type: multiple_choice
      topic_code: "1.7"
      source: "IM Geometry, Unit 1, Lesson 7"
      points: 1
      prompt: |
        A square is inscribed in a circle of diameter 14. What is the area of the square?
      options:
        - "98"
        - "196"
        - "49"
        - "49√2"
      option_explanations:
        - |
          Correct. The square's diagonal is the diameter 14, so its side is 14/√2 = 7√2 and its area is (7√2)² = 98; equivalently half of 14².
        - |
          196 is the area of the square built on the diameter, twice the inscribed square.
        - |
          49 is the area of a square with side 7, the radius, which is smaller than the inscribed square's side.
        - |
          49√2 ≈ 69.3 mixes the side 7√2 with the wrong operation; the area is the side squared, 98.
      answer: 0

    - slug: geo-u01-exam-q08
      type: multiple_choice
      topic_code: "1.8"
      source: "IM Geometry, Unit 1, Lesson 8"
      points: 1
      prompt: |
        In dynamic geometry software, which of the following is evidence that a perpendicular bisector was constructed rather than drawn?
      options:
        - "Dragging either endpoint of the segment keeps the line through the segment's midpoint at a right angle"
        - "The line looks perpendicular at the current zoom level"
        - "The angle measurement tool currently reads 90.0°"
        - "The line was drawn with the line tool"
      option_explanations:
        - |
          Correct. Relationships that survive dragging are defined by the construction; a drawn line would be left behind.
        - |
          Appearance at one moment is not evidence of a defined relationship.
        - |
          A reading of 90° now is a measurement of this instance; it says nothing about what happens when the figure changes.
        - |
          Every line is drawn with the line tool; what matters is which points define it.
      answer: 0

    - slug: geo-u01-exam-q09
      type: multiple_choice
      topic_code: "1.9"
      source: "IM Geometry, Unit 1, Lesson 9"
      points: 1
      prompt: |
        Three hospitals are at A = (0, 0), B = (10, 0) and C = (0, 8). A patient at (6, 3) is sent to the nearest hospital. Which is it?
      options:
        - "B"
        - "A"
        - "C"
        - "A and B are equally near"
      option_explanations:
        - |
          Correct. Distance to B is √(16 + 9) = 5; to A is √(36 + 9) = √45 ≈ 6.71; to C is √(36 + 25) = √61 ≈ 7.81.
        - |
          A is √45 ≈ 6.71 away, more than the 5 to B; the point is right of the border x = 5.
        - |
          C is the farthest of the three, about 7.81 away.
        - |
          The distances 5 and √45 differ; the point is not on the perpendicular bisector x = 5.
      answer: 0

    - slug: geo-u01-exam-q10
      type: multiple_choice
      topic_code: "1.10"
      source: "IM Geometry, Unit 1, Lesson 10"
      points: 1
      prompt: |
        Which transformation is NOT rigid?
      options:
        - "(x, y) → (x, −y)"
        - "(x, y) → (x + 3, y − 1)"
        - "(x, y) → (−y, x)"
        - "(x, y) → (3x, 3y)"
      option_explanations:
        - |
          This is the reflection across the x-axis, which preserves distances.
        - |
          This is a translation by (3, −1), which preserves distances.
        - |
          This is a 90° counter-clockwise rotation about the origin, which preserves distances.
        - |
          Correct. This dilation triples every distance: (0, 0) and (1, 0) are 1 apart, their images 3 apart.
      answer: 3

    - slug: geo-u01-exam-q11
      type: multiple_choice
      topic_code: "1.11"
      source: "IM Geometry, Unit 1, Lesson 11"
      points: 1
      prompt: |
        A reflection sends K = (−3, 4) to K′ = (5, 4). Which line is the mirror?
      options:
        - "x = 1"
        - "y = 4"
        - "x = 4"
        - "x = −1"
      option_explanations:
        - |
          Correct. The midpoint of KK′ is (1, 4) and KK′ is horizontal, so its perpendicular bisector is the vertical line x = 1.
        - |
          Both points lie on y = 4, so that line contains the segment rather than bisecting it at right angles.
        - |
          x = 4 is vertical but does not pass through the midpoint (1, 4).
        - |
          x = −1 is 2 units from K and 6 from K′, so it is not equidistant from them.
      answer: 0

    - slug: geo-u01-exam-q12
      type: multiple_choice
      topic_code: "1.12"
      source: "IM Geometry, Unit 1, Lesson 12"
      points: 1
      prompt: |
        A translation by the directed segment from A = (2, −1) to B = (−1, 3) is applied to triangle PQR. Which statement is true for every vertex?
      options:
        - "It moves 5 units, by the arrow (−3, 4)"
        - "It moves 7 units, by the arrow (−3, 4)"
        - "It moves 5 units, by the arrow (3, −4)"
        - "Only the vertex nearest A moves"
      option_explanations:
        - |
          Correct. The arrow is B − A = (−3, 4), of length √(9 + 16) = 5, and every point moves by it.
        - |
          The length of (−3, 4) is 5, not 7 (do not add the components).
        - |
          (3, −4) is the reversed arrow, from B to A.
        - |
          A translation moves every point of the plane, not just one vertex.
      answer: 0

    - slug: geo-u01-exam-q13
      type: multiple_choice
      topic_code: "1.14"
      source: "IM Geometry, Unit 1, Lesson 14"
      points: 1
      prompt: |
        Point W = (−2, 6) is rotated 180° about the point (1, 2). What is W′?
      options:
        - "(4, −2)"
        - "(−6, −2)"
        - "(2, −6)"
        - "(−1, 4)"
      option_explanations:
        - |
          Correct. The centre is the midpoint of WW′: W′ = (2 × 1 − (−2), 2 × 2 − 6) = (4, −2).
        - |
          (−6, −2) is the 90° counter-clockwise image about the origin, not the 180° image about (1, 2).
        - |
          (2, −6) is the 180° rotation about the origin.
        - |
          (−1, 4) is the midpoint of W and the centre, not the image.
      answer: 0

    - slug: geo-u01-exam-q14
      type: multiple_choice
      topic_code: "1.13"
      source: "IM Geometry, Unit 1, Lesson 13"
      points: 1
      prompt: |
        Triangle with vertices (0, 0), (3, 0), (3, 1) is carried to the triangle with vertices (0, 0), (0, −3), (1, −3). Which single transformation does this?
      options:
        - "Rotation of 90° clockwise about the origin"
        - "Rotation of 90° counter-clockwise about the origin"
        - "Reflection across the line y = −x"
        - "Translation by (−3, −3)"
      option_explanations:
        - |
          Correct. (x, y) → (y, −x) sends (3, 0) → (0, −3) and (3, 1) → (1, −3), and orientation is preserved.
        - |
          Counter-clockwise would send (3, 0) to (0, 3), above the axis.
        - |
          Reflecting across y = −x sends (3, 1) to (−1, −3), not (1, −3), and reverses orientation.
        - |
          The origin is fixed, so it is not a translation by a nonzero arrow.
      answer: 0

    - slug: geo-u01-exam-q15
      type: multiple_choice
      topic_code: "1.15"
      source: "IM Geometry, Unit 1, Lesson 15"
      points: 1
      prompt: |
        Which figure has exactly two lines of symmetry and 180° rotation symmetry?
      options:
        - "A rhombus that is not a square"
        - "A kite that is not a rhombus"
        - "A square"
        - "An equilateral triangle"
      option_explanations:
        - |
          Correct. Its diagonals are its two lines of symmetry, and as a parallelogram it has 180° rotation symmetry. (A non-square rectangle also qualifies.)
        - |
          A kite has one line of symmetry and no rotation symmetry.
        - |
          A square has four lines of symmetry and 90° rotation symmetry.
        - |
          An equilateral triangle has three lines of symmetry and 120° rotation symmetry.
      answer: 0

    - slug: geo-u01-exam-q16
      type: multiple_choice
      topic_code: "1.16"
      source: "IM Geometry, Unit 1, Lesson 16"
      points: 1
      prompt: |
        A regular polygon has 20 lines of symmetry. What is its smallest positive angle of rotation symmetry?
      options:
        - "18°"
        - "20°"
        - "36°"
        - "9°"
      option_explanations:
        - |
          Correct. A regular n-gon has n lines of symmetry, so n = 20, and the smallest rotation angle is 360° ÷ 20 = 18°.
        - |
          20 is the number of sides, not the angle.
        - |
          36° would be for a regular decagon (10 sides).
        - |
          9° would be the smallest rotation angle of a regular 40-gon, not a 20-gon.
      answer: 0

    - slug: geo-u01-exam-q17
      type: multiple_choice
      topic_code: "1.17"
      source: "IM Geometry, Unit 1, Lesson 17"
      points: 1
      prompt: |
        △GHI ≅ △JKL. GH = 4, HI = 6, GI = 7, and ∠H = 80°. Which statement follows?
      options:
        - "KL = 6 and ∠K = 80°"
        - "JK = 6 and ∠J = 80°"
        - "JL = 4 and ∠L = 80°"
        - "KL = 7 and ∠K = 80°"
      option_explanations:
        - |
          Correct. H ↔ K and I ↔ L, so KL = HI = 6 and ∠K = ∠H = 80°.
        - |
          JK corresponds to GH = 4, and ∠J corresponds to ∠G, which is not given.
        - |
          JL corresponds to GI = 7, and ∠L corresponds to ∠I.
        - |
          KL corresponds to HI, which is 6, not 7.
      answer: 0

    - slug: geo-u01-exam-q18
      type: multiple_choice
      topic_code: "1.18"
      source: "IM Geometry, Unit 1, Lesson 18"
      points: 1
      prompt: |
        In the point-by-point method, after translating A onto D and rotating about D so that B lands on E, why can the image of C be in only one of two places?
      options:
        - "It must be at distance DF from D and EF from E, and two circles meet in at most two points, which are reflections of each other across line DE"
        - "Rotations only move points to two possible positions"
        - "The triangle has only two other vertices"
        - "It must lie on line DE"
      option_explanations:
        - |
          Correct. Rigid motions preserve the distances to D and E, so the image is on both circles; the two intersection points are mirror images across the line of centres.
        - |
          A rotation can move a point to any position on a circle; the restriction comes from two distance conditions, not from the rotation.
        - |
          The number of vertices has nothing to do with it; the argument is about distances.
        - |
          The image of C is generally not on line DE; it is on one side or the other.
      answer: 0

    - slug: geo-u01-exam-q19
      type: multiple_choice
      topic_code: "1.19"
      source: "IM Geometry, Unit 1, Lesson 19"
      points: 1
      prompt: |
        Which of these statements is a theorem rather than a definition?
      options:
        - "Vertical angles are congruent"
        - "A linear pair is two adjacent angles whose outer sides form a straight line"
        - "Complementary angles are two angles whose measures sum to 90°"
        - "A transversal is a line crossing two other lines at two points"
      option_explanations:
        - |
          Correct. That vertical angles are congruent must be proved (by linear pairs or by a 180° rotation); it is not true by definition.
        - |
          This is the definition of a linear pair; it names a configuration.
        - |
          This is the definition of complementary angles.
        - |
          This is the definition of a transversal.
      answer: 0

    - slug: geo-u01-exam-q20
      type: multiple_choice
      topic_code: "1.19"
      source: "IM Geometry, Unit 1, Lesson 19"
      points: 1
      prompt: |
        Two angles are supplementary and one is 4 times the other. What is the smaller angle?
      options:
        - "36°"
        - "18°"
        - "45°"
        - "144°"
      option_explanations:
        - |
          Correct. x + 4x = 180 gives x = 36; the angles are 36° and 144°.
        - |
          18° would come from a sum of 90° (complementary), not 180°.
        - |
          45° and 135° are supplementary, but 135 is 3 times 45, not 4.
        - |
          144° is the larger of the two angles; the question asks for the smaller one.
      answer: 0

    - slug: geo-u01-exam-q21
      type: multiple_choice
      topic_code: "1.20"
      source: "IM Geometry, Unit 1, Lesson 20"
      points: 1
      prompt: |
        ℓ ∥ m, and a transversal makes an angle of 37° with ℓ at the upper-right position. Which angle at the crossing with m must be 143°?
      options:
        - "The upper-left angle"
        - "The upper-right angle"
        - "The lower-left angle"
        - "None of them; 143° does not occur"
      option_explanations:
        - |
          Correct. The upper-right angle at m is 37° (corresponding), so the upper-left angle at m, its linear-pair partner, is 143°.
        - |
          The upper-right angle at m corresponds to the 37° angle, so it is 37°.
        - |
          The lower-left angle at m is vertical to the upper-right one, so it is 37°.
        - |
          143° does occur: every angle at both crossings is either 37° or 143°.
      answer: 0

    - slug: geo-u01-exam-q22
      type: multiple_choice
      topic_code: "1.20"
      source: "IM Geometry, Unit 1, Lesson 20"
      points: 1
      prompt: |
        Lines a and b are cut by a transversal, and a pair of co-interior angles measures 71° and 109°. What can be concluded?
      options:
        - "a ∥ b, because co-interior angles that are supplementary imply parallel lines"
        - "a ∥ b, because the angles are congruent"
        - "a and b are not parallel, because the angles are not equal"
        - "Nothing, because co-interior angles give no information about parallelism"
      option_explanations:
        - |
          Correct. 71 + 109 = 180, and supplementary co-interior angles are equivalent to congruent alternate interior angles, which imply parallel lines.
        - |
          71° and 109° are not congruent; the relevant condition for co-interior angles is supplementary.
        - |
          Co-interior angles of parallel lines are not supposed to be equal; they are supposed to sum to 180°, which they do.
        - |
          Co-interior angles summing to 180° is one of the standard tests for parallel lines.
      answer: 0

    - slug: geo-u01-exam-q23
      type: multiple_choice
      topic_code: "1.21"
      source: "IM Geometry, Unit 1, Lesson 21"
      points: 1
      prompt: |
        In triangle XYZ, ∠X = 2∠Y and ∠Z = ∠X + 20°. What is ∠Z?
      options:
        - "84°"
        - "64°"
        - "32°"
        - "96°"
      option_explanations:
        - |
          Correct. Let ∠Y = y; then ∠X = 2y and ∠Z = 2y + 20. Sum: 5y + 20 = 180, y = 32, so ∠Z = 64 + 20 = 84°.
        - |
          64° is ∠X, which is 2y with y = 32; the question asks for ∠Z.
        - |
          32° is ∠Y, the smallest angle; ∠Z is 20° more than twice this.
        - |
          96° would make the sum exceed 180° (32 + 64 + 96 = 192).
      answer: 0

    - slug: geo-u01-exam-q24
      type: multiple_choice
      topic_code: "1.21"
      source: "IM Geometry, Unit 1, Lesson 21"
      points: 1
      prompt: |
        Each interior angle of a regular polygon measures 156°. How many sides does it have?
      options:
        - "15"
        - "12"
        - "24"
        - "13"
      option_explanations:
        - |
          Correct. The exterior angle is 180 − 156 = 24°, and 360 ÷ 24 = 15 sides. Check: (15 − 2) × 180 ÷ 15 = 156.
        - |
          A regular 12-gon has interior angles of 150°.
        - |
          24 is the exterior angle in degrees, not the number of sides.
        - |
          A regular 13-gon has interior angles of about 152.3°.
      answer: 0

    - slug: geo-u01-exam-q25
      type: multiple_choice
      topic_code: "1.22"
      source: "IM Geometry, Unit 1, Lesson 22"
      points: 1
      prompt: |
        A design places regular polygons around a single point with no gaps or overlaps. Which combination works?
      options:
        - "Two regular octagons and one square"
        - "Three regular pentagons"
        - "Two regular hexagons and one equilateral triangle"
        - "Four equilateral triangles and one square"
      option_explanations:
        - |
          Correct. Two octagon angles and one square angle give 135° + 135° + 90° = 360°, a full turn with no gap.
        - |
          Three pentagon angles give 3 × 108° = 324°, which leaves a 36° gap at the point.
        - |
          120° + 120° + 60° = 300°, leaving a gap of 60° (a second triangle would be needed).
        - |
          4 × 60° + 90° = 330°, leaving a 30° gap.
      answer: 0

    # ---- Stimulus set A: a rhombus from two circles (1.4, 1.15, 1.11)
    - slug: geo-u01-exam-q26
      type: multiple_choice
      topic_code: "1.4"
      source: "IM Geometry, Unit 1, Lesson 4"
      points: 1
      stimulus: |
        Figure description: segment AB of length 6. A circle centred at A passes through B, and a circle centred at B passes through A. The circles cross at C (above AB) and D (below AB). Segments AC, BC, AD, BD and CD are drawn, and CD meets AB at M.
      prompt: |
        What is the length of CD?
      options:
        - "6√3"
        - "6"
        - "3√3"
        - "12"
      option_explanations:
        - |
          Correct. Triangle ACM has a right angle at M (CD is the perpendicular bisector of AB), AC = 6, AM = 3, so CM = √(36 − 9) = 3√3, and CD = 2 × 3√3 = 6√3 ≈ 10.39.
        - |
          6 is the length of each side of the rhombus, not the longer diagonal.
        - |
          3√3 ≈ 5.20 is CM, the distance from C to the midpoint M, which is only half of CD.
        - |
          12 would be the sum of two radii along a line, but C and D are not on opposite ends of a diameter through A or B.
      answer: 0

    - slug: geo-u01-exam-q27
      type: multiple_choice
      topic_code: "1.15"
      source: "IM Geometry, Unit 1, Lesson 15"
      points: 1
      stimulus: |
        Figure description: segment AB of length 6. A circle centred at A passes through B, and a circle centred at B passes through A. The circles cross at C (above AB) and D (below AB). Segments AC, BC, AD, BD and CD are drawn, and CD meets AB at M.
      prompt: |
        Which lines are lines of symmetry of quadrilateral ACBD?
      options:
        - "Line AB and line CD"
        - "Line AB only"
        - "Line CD only"
        - "Line AB, line CD, and the lines through the midpoints of opposite sides"
      option_explanations:
        - |
          Correct. ACBD is a rhombus (all sides 6), and a rhombus's lines of symmetry are its two diagonals, AB and CD.
        - |
          CD is also a line of symmetry: reflecting across it swaps A and B and fixes C and D.
        - |
          AB is also a line of symmetry: reflecting across it swaps C and D.
        - |
          The midpoint lines are symmetries of a rectangle; this rhombus (angles 60° and 120°) is not a rectangle.
      answer: 0

