    - slug: geo-u01-exam-q30
      type: multiple_choice
      topic_code: "1.21"
      source: "IM Geometry, Unit 1, Lesson 21"
      points: 1
      stimulus: |
        Figure description: lines p and q are parallel, with p above q. Points A and B lie on p, with A to the left of B. Point C lies on q. Segments CA and CB are drawn, forming triangle ABC with its apex C below the base AB. Point D is on q to the left of C and point E is on q to the right of C. ∠DCA = 48° and ∠ECB = 61°.
