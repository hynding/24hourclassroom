      prompt: |
        Triangle ABC has A = (0, 0), B = (3, 0), C = (3, 2). Triangle DEF has D = (4, 6), E = (4, 3), F = (6, 3). Answer (a), (b) and (c).

        (a) State the translation that sends A to D and give the images of B and C.
        (b) State the rotation about D that then sends the image of B onto E, and compute where the image of C goes.
        (c) Decide whether a reflection is needed to finish and, if so, name the mirror line.
      answer: |
