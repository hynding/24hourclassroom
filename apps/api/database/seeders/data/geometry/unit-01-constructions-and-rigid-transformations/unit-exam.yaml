    - slug: geo-u01-exam-q46
      type: short_answer
      topic_code: "1.5"
      source: "IM Geometry, Unit 1, Lesson 5"
      points: 3
      prompt: |
        Figure description: angle AVB with vertex V. Answer (a), (b) and (c).

        (a) Describe how to construct the bisector of ∠AVB with compass and straightedge.
        (b) Name the quadrilateral formed by V, the two arc points on the arms, and the crossing point, and state the two pairs of congruent sides.
        (c) Explain how the symmetry of that quadrilateral shows the ray bisects the angle.
      answer: |
        (a) Draw a circle centred at V crossing ray VA at X and ray VB at Y. Draw circles of one equal radius centred at X and at Y; they cross at Z inside the angle. Draw ray VZ. (b) VXZY is a kite: VX = VY (radii of the circle at V) and XZ = YZ (equal radii of the circles at X and Y). (c) A kite is symmetric across the diagonal through the vertices where its congruent sides meet, here VZ. Reflecting across VZ swaps X and Y and fixes V, so it carries ∠XVZ onto ∠YVZ; reflections preserve angle measure, so the two angles are congruent and VZ bisects ∠AVB.
      explanation: |
        1 point for (a): equal arcs on the arms, equal circles from the arc points, ray to the crossing. 1 point for (b): kite with VX = VY and XZ = YZ tied to the correct circles. 1 point for (c): reflection across VZ swapping X and Y and preserving the angle.

    - slug: geo-u01-exam-q47
      type: long_answer
      topic_code: "1.20"
      source: "IM Geometry, Unit 1, Lesson 20"
      points: 6
      prompt: |
        Figure description: lines ℓ and m are parallel. A transversal t meets ℓ at P and m at Q. Point A is on ℓ to the right of P, and point B is on m to the left of Q, so that ∠APQ and ∠PQB are alternate interior angles. Prove that ∠APQ = ∠PQB using a rotation. State the centre and angle of the rotation, explain where it sends P, Q, line ℓ and line m and why, and finish by explaining why the two angles are congruent. Then use the result to prove that the co-interior angles ∠APQ and ∠PQC are supplementary, where C is on m to the right of Q.
      answer: |
        Let M be the midpoint of segment PQ, and rotate the figure 180° about M.

        Where things go. Because M is the midpoint of PQ, the rotation sends P to Q and Q to P (a half turn about the midpoint swaps the endpoints). Line t passes through the centre M, so it maps to itself with its direction reversed: ray PQ maps to ray QP. A 180° rotation sends every line not through the centre to a parallel line; so the image of ℓ is a line parallel to ℓ passing through the image of P, which is Q. By the parallel postulate there is exactly one line through Q parallel to ℓ, and m is that line. Hence ℓ maps onto m. By the same reasoning m maps onto ℓ. Ray PA, which lies along ℓ to the right of P, maps to a ray along m from Q pointing in the opposite direction, that is, to the left of Q: ray QB.

        Why the angles are congruent. ∠APQ is the angle between ray PA and ray PQ. Its image is the angle between ray QB and ray QP, which is ∠PQB. Rotations are rigid transformations and preserve angle measure, so ∠APQ = ∠PQB. ∎

        Co-interior angles. B, Q, C are collinear on m with Q between B and C, so ∠PQB and ∠PQC form a linear pair: ∠PQB + ∠PQC = 180°. Substituting ∠APQ for ∠PQB gives ∠APQ + ∠PQC = 180°, so the co-interior angles are supplementary. ∎
      explanation: |
        Scoring (6 points): 1 for choosing the 180° rotation about the midpoint of PQ; 1 for P ↔ Q and t mapping to itself; 2 for the argument that ℓ maps to m (parallel image through Q, uniqueness from the parallel postulate); 1 for concluding ∠APQ = ∠PQB by angle preservation; 1 for the linear-pair step giving the supplementary co-interior angles. Deduct 1 for asserting ℓ → m without the uniqueness argument.
