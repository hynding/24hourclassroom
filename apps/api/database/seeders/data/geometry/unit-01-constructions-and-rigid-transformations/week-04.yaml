        Segment AB with A = (2, 0) and B = (6, 0) is carried to segment A′B′ with A′ = (0, 2) and B′ = (0, 6). Answer (a), (b) and (c).

        (a) Explain why this cannot be a translation.
        (b) Find a rotation that carries AB to A′B′, giving its centre, angle and direction.
        (c) Find a reflection that also carries AB to A′B′, and explain how you know the mirror line.
      answer: |
        (a) A moves by (−2, 2) and B moves by (−6, 6); the arrows are different, so it is not a translation (every point of a translation moves by the same arrow). (b) The 90° counter-clockwise rotation about the origin: (x, y) → (−y, x) sends (2, 0) → (0, 2) and (6, 0) → (0, 6). (c) The reflection across the line y = x swaps the coordinates: (2, 0) → (0, 2) and (6, 0) → (0, 6). The mirror must be the perpendicular bisector of AA′: the midpoint of (2, 0) and (0, 2) is (1, 1), and AA′ has direction (−1, 1), so the bisector has direction (1, 1) through (1, 1), which is y = x.
      explanation: |
        1 point for (a): different arrows for A and B. 1 point for (b): origin, 90°, counter-clockwise (accept 270° clockwise). 1 point for (c): y = x with the perpendicular-bisector justification (midpoint (1, 1) and the perpendicular direction).

