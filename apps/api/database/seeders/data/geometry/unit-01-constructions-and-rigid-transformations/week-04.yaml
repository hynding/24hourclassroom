        1 point for (a): both diagonals and 180° (deduct for listing midpoint lines, which are not symmetries of a non-square rhombus). 1 point for (b): the reflection swaps Q and S and so matches the two angles at P. 1 point for (c): PR is the perpendicular bisector of QS because the reflection across PR sends Q to S.

    - slug: geo-u01-w04-q24
      type: long_answer
      topic_code: "1.16"
      source: "IM Geometry, Unit 1, Lesson 16"
      points: 6
      prompt: |
        Figure description: regular hexagon ABCDEF with centre O, side 4. (1) List all the rotations about O (angles less than 360°) that carry the hexagon onto itself, and all its lines of symmetry, described by the points they pass through. (2) Use a specific rotation to explain why ∠ABC = ∠BCD. (3) Use a specific reflection to explain why diagonal AD is perpendicular to side BC's "partner" line, by showing that the line through A and D is the perpendicular bisector of BF. (4) State the length of AD and justify it.
      answer: |
        (1) Rotations about O by 60°, 120°, 180°, 240° and 300° (order 6). Six lines of symmetry: three through opposite vertices (AD, BE, CF) and three through the midpoints of opposite sides (the midpoints of AB and DE, of BC and EF, of CD and FA).

        (2) The 60° rotation about O sends A → B, B → C and C → D. So it carries ∠ABC (vertex B, arms BA and BC) onto ∠BCD (vertex C, arms CB and CD). Rotations preserve angle measure, so ∠ABC = ∠BCD. Repeating the argument around the hexagon shows all six angles are congruent.

        (3) Reflect across line AD. This reflection fixes A and D and O (all on the mirror) and swaps B with F and C with E, because the hexagon is carried onto itself and B, F are the neighbours of A. Since the reflection sends B to F, line AD is the perpendicular bisector of BF by the definition of reflection: AD ⊥ BF and AD passes through the midpoint of BF.

        (4) AD = 8. The hexagon is made of six equilateral triangles of side 4 around O (OA = OB = … = 4, as in the daisy construction), and A, O, D are collinear because three 60° angles at O make 180°. So AD = AO + OD = 4 + 4 = 8, a diameter of the circumscribed circle.
      explanation: |
        Scoring (6 points): 1 for the five rotation angles; 1 for six lines of symmetry correctly described (vertex-to-vertex and midpoint-to-midpoint); 1 for the 60° rotation mapping A→B→C→D with the angle-preservation conclusion; 2 for the reflection argument (B ↔ F, then "perpendicular bisector by definition of reflection"); 1 for AD = 8 with the equilateral-triangles or diameter justification.
