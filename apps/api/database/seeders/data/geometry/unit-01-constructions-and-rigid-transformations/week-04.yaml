week: 4
unit: 1
title: "Rotations and Symmetry"
topics: ["1.13", "1.14", "1.15", "1.16"]
guide: guides/week-04.md
guide_description: |
  Rotations defined by centre, angle and direction, constructed with a circle and a copied angle; the special case
  of 180°, where the centre is the midpoint of PP′. How to tell which rigid transformation carried a figure onto
  its image. Reflection symmetry and rotation symmetry of triangles, quadrilaterals, regular polygons and circles,
  with tables of lines and orders, and how one symmetry argument proves several facts about a figure at once.
flashcards_description: |
  28 cards on the definition and construction of rotations, 180° rotations, identifying transformations, lines
  of symmetry, rotation symmetry and order, and what symmetry proves about isosceles triangles and parallelograms.

flashcards:
  - front: Rotation about O by angle θ → definition
    back: |
      O is fixed. Every other point P goes to the point P′ with OP′ = OP and ∠POP′ = θ, turning in the stated direction (counter-clockwise unless told otherwise). Every point turns through the same angle.
    topic_code: "1.14"
  - front: Three things a rotation needs → list
    back: |
      A centre, an angle and a direction (clockwise or counter-clockwise). "Rotate by 90°" is incomplete; "rotate 90° counter-clockwise about O" is a transformation.
    topic_code: "1.13"
  - front: Constructing the rotation of P about O by θ → steps
    back: |
      Draw the circle centred at O through P. Copy the angle θ at O with one side along ray OP, in the required direction. The second side of the copied angle meets the circle at P′.
    topic_code: "1.14"
  - front: Rotation by 180° about O → what it does to a point
    back: |
      Sends P to the point P′ on line PO with O as the midpoint of PP′. Direction does not matter. On a grid with centre (a, b): (x, y) → (2a − x, 2b − y).
    topic_code: "1.14"
  - front: Fixed points of a rotation → which points
    back: |
      Only the centre (for an angle that is not a multiple of 360°). Every other point moves along a circle centred at O.
    topic_code: "1.14"
  - front: Orientation under a rotation → what happens
    back: |
      Preserved. Clockwise stays clockwise. Rotations and translations keep orientation; reflections reverse it.
    topic_code: "1.13"
  - front: Rotation of (x, y) by 90° counter-clockwise about the origin → rule
    back: |
      (x, y) → (−y, x). Check with (1, 0) → (0, 1). Clockwise 90° is (x, y) → (y, −x). By 180°: (x, y) → (−x, −y).
    topic_code: "1.14"
  - front: Two rotations about the same centre → combined effect
    back: |
      A rotation by θ followed by a rotation by φ about the same centre is a rotation by θ + φ about that centre. Two 180° rotations make the identity.
    topic_code: "1.14"
  - front: Undoing a rotation by θ → which transformation
    back: |
      Rotate by θ in the opposite direction about the same centre (equivalently by 360° − θ in the same direction).
    topic_code: "1.14"
  - front: Finding the centre of a rotation from P → P′ and Q → Q′ → method
    back: |
      The centre is equidistant from P and P′ and from Q and Q′, so it lies on both perpendicular bisectors; it is where they meet. Then measure or compute the angle POP′.
    topic_code: "1.13"
  - front: Deciding reflection, translation or rotation from a figure and image → checklist
    back: |
      Orientation reversed → reflection (mirror is the perpendicular bisector of PP′). Every vertex moved by the same arrow → translation. Orientation kept but turned → rotation (centre from two perpendicular bisectors).
    topic_code: "1.13"
  - front: Reflection symmetry → definition
    back: |
      A figure has reflection (line) symmetry if there is a line such that reflecting across it carries the figure onto itself. The line is a line of symmetry; folding along it matches the halves.
    topic_code: "1.15"
  - front: Lines of symmetry of an isosceles triangle → how many and where
    back: |
      One: through the apex (where the equal sides meet) and the midpoint of the base. An equilateral triangle has three.
    topic_code: "1.15"
  - front: Lines of symmetry of a rectangle (not a square) → how many and where
    back: |
      Two, through the midpoints of opposite sides. The diagonals are not lines of symmetry: reflecting across a diagonal sends a vertex to a point off the rectangle because adjacent sides differ in length.
    topic_code: "1.15"
  - front: Lines of symmetry of a rhombus (not a square) → how many and where
    back: |
      Two, the diagonals. Each diagonal is the perpendicular bisector of the other, and reflecting across one swaps the two vertices it does not pass through.
    topic_code: "1.15"
  - front: Lines of symmetry of a square → how many and where
    back: |
      Four: the two diagonals and the two lines through midpoints of opposite sides. It is both a rhombus and a rectangle, so it has both pairs.
    topic_code: "1.15"
  - front: Lines of symmetry of a kite and an isosceles trapezoid → how many
    back: |
      One each. For a kite, the diagonal through the vertices where the congruent sides meet. For an isosceles trapezoid, the line through the midpoints of the two parallel sides.
    topic_code: "1.15"
  - front: Lines of symmetry of a parallelogram (not a rhombus or rectangle) → how many
    back: |
      None. Its only symmetry is a 180° rotation about the point where the diagonals cross.
    topic_code: "1.16"
  - front: Lines of symmetry of a regular n-gon and of a circle → how many
    back: |
      A regular n-gon has n (through vertices and/or midpoints of sides, depending on whether n is odd or even). A circle has infinitely many: every line through its centre.
    topic_code: "1.15"
  - front: Rotation symmetry → definition
    back: |
      A figure has rotation symmetry if a rotation by some angle between 0° and 360° (exclusive) about some point carries the figure onto itself.
    topic_code: "1.16"
  - front: Order of rotation symmetry → meaning and formula for regular polygons
    back: |
      The number of positions in one full turn where the figure matches itself, counting the start. A regular n-gon has order n, with smallest angle 360°/n: 90° for a square, 60° for a regular hexagon.
    topic_code: "1.16"
  - front: Rotation symmetry of rectangle, rhombus, parallelogram → angle and centre
    back: |
      All three have 180° rotation symmetry (order 2) about the intersection of the diagonals. Only the square among them has 90° symmetry.
    topic_code: "1.16"
  - front: Figures with no rotation symmetry → examples
    back: |
      Isosceles triangle, kite, isosceles trapezoid, scalene triangle, any figure whose only symmetries are reflections or none. Their order of rotation symmetry is 1.
    topic_code: "1.16"
  - front: Point symmetry → meaning
    back: |
      Rotation symmetry of 180°: every point P of the figure has a partner P′ with the centre as the midpoint of PP′. Parallelograms and regular polygons with an even number of sides have it.
    topic_code: "1.16"
  - front: Isosceles triangle facts proved by one reflection → list
    back: |
      Reflecting across the line through the apex and the midpoint of the base swaps the base vertices and fixes the rest. So the base angles are congruent, the line bisects the apex angle, and it is perpendicular to the base.
    topic_code: "1.15"
  - front: Parallelogram facts proved by a 180° rotation → list
    back: |
      Rotating 180° about the diagonals' intersection M sends A → C and B → D. Hence AB = CD, BC = DA, ∠A = ∠C and ∠B = ∠D, and M is the midpoint of both diagonals.
    topic_code: "1.16"
  - front: Error-spot → "a rectangle's diagonal is a line of symmetry"
    back: |
      False unless the rectangle is a square. In rectangle ABCD with AB = 6 and BC = 4, reflecting across AC sends B to a point 6 from A and 4 from C, but D is 4 from A and 6 from C.
    topic_code: "1.15"
  - front: Error-spot → counting order of rotation symmetry without the full turn
    back: |
      Order counts the identity position. A square matches itself at 90°, 180°, 270° and 360°: order 4, not 3. An equilateral triangle: 120°, 240°, 360°, order 3.
    topic_code: "1.16"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 1.13 to 1.16: rotations, identifying
    transformations, reflection and rotation symmetry) with review of weeks 1 to 3 (constructions, reflections
    and translations). Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
    teacher against the scoring notes.
  questions:
    # ---- Stimulus set: parallelogram ABCD (1.16, 1.14, 1.13)
    - slug: geo-u01-w04-q01
      type: multiple_choice
      topic_code: "1.16"
      source: "IM Geometry, Unit 1, Lesson 16"
      points: 1
      stimulus: |
        Figure description: parallelogram ABCD with A = (0, 0), B = (6, 0), C = (8, 3) and D = (2, 3). The diagonals AC and BD cross at point M.
      prompt: |
        What are the coordinates of M, and why?
      options:
        - "(4, 1.5), because the diagonals of a parallelogram bisect each other"
        - "(4, 1.5), because M is the midpoint of side AB shifted up"
        - "(3, 1.5), because M is the midpoint of AD"
        - "(5, 1.5), because M is the midpoint of BC"
      option_explanations:
        - |
          Correct. The midpoint of AC is ((0 + 8)/2, (0 + 3)/2) = (4, 1.5), and the midpoint of BD is ((6 + 2)/2, (0 + 3)/2) = (4, 1.5); the diagonals share their midpoint.
        - |
          The coordinates are right but the reason is not; M is the common midpoint of the two diagonals, which has nothing to do with "shifting" AB.
        - |
          The midpoint of AD is (1, 1.5), and in any case the diagonals do not meet on a side.
        - |
          The midpoint of BC is (7, 1.5); M is inside the parallelogram where the diagonals cross.
      answer: 0

    - slug: geo-u01-w04-q02
      type: multiple_choice
      topic_code: "1.14"
      source: "IM Geometry, Unit 1, Lesson 14"
      points: 1
      stimulus: |
        Figure description: parallelogram ABCD with A = (0, 0), B = (6, 0), C = (8, 3) and D = (2, 3). The diagonals AC and BD cross at point M.
      prompt: |
        The parallelogram is rotated 180° about M. What is the image of vertex B?
      options:
        - "A"
        - "C"
        - "D"
        - "M"
      option_explanations:
        - |
          A is the image of C, not of B; AC is one diagonal and BD is the other.
        - |
          C is the image of A: both lie on diagonal AC with M as the midpoint.
        - |
          Correct. M is the midpoint of BD, so the 180° rotation about M sends B to D (check: 2 × 4 − 6 = 2 and 2 × 1.5 − 0 = 3, giving (2, 3) = D).
        - |
          M is the only fixed point of the rotation; B is not M, so B moves.
      answer: 2

    - slug: geo-u01-w04-q03
      type: multiple_choice
      topic_code: "1.16"
      source: "IM Geometry, Unit 1, Lesson 16"
      points: 1
      stimulus: |
        Figure description: parallelogram ABCD with A = (0, 0), B = (6, 0), C = (8, 3) and D = (2, 3). The diagonals AC and BD cross at point M.
      prompt: |
        Which conclusion follows from the fact that the 180° rotation about M carries the parallelogram onto itself?
      options:
        - "AB = CD and BC = DA, because the rotation sends side AB to side CD and side BC to side DA"
        - "AB = BC, because the rotation sends side AB to side BC"
        - "The diagonals are congruent, because the rotation sends AC to BD"
        - "Line AC is a line of symmetry"
      option_explanations:
        - |
          Correct. A → C and B → D, so segment AB → segment CD, and rotations preserve length; likewise BC → DA.
        - |
          The rotation does not send AB to BC; AB (length 6) and BC (length √13) are not even equal here.
        - |
          The rotation sends diagonal AC to itself (A ↔ C), not to BD; the diagonals of this parallelogram are not congruent (AC = √73, BD = 5).
        - |
          Rotation symmetry is not reflection symmetry; a non-rectangular parallelogram has no line of symmetry.
      answer: 0

    - slug: geo-u01-w04-q04
      type: multiple_choice
      topic_code: "1.14"
      source: "IM Geometry, Unit 1, Lesson 14"
      points: 1
      prompt: |
        Which statement is the definition of the rotation of a point P (P ≠ O) about centre O by angle θ counter-clockwise?
      options:
        - "P′ is the point with OP′ = OP and ∠POP′ = θ, measured counter-clockwise from ray OP"
        - "P′ is the point with PP′ = θ"
        - "P′ is the point such that O is the midpoint of PP′"
        - "P′ is the point on line OP at distance θ from O"
      option_explanations:
        - |
          Correct. The image stays on the circle centred at O through P and turns through the angle θ in the given direction.
        - |
          The angle of rotation is not a distance; PP′ depends on how far P is from O as well as on θ.
        - |
          That describes only the special case of a 180° rotation, not a general angle θ.
        - |
          θ is an angle, not a length, and P′ is on line OP only for a 180° (or 360°) rotation.
      answer: 0

    - slug: geo-u01-w04-q05
      type: multiple_choice
      topic_code: "1.4"
      source: "IM Geometry, Unit 1, Lesson 4"
      points: 1
      prompt: |
        Review. Equilateral triangle ABC is constructed on AB with circles of radius AB centred at A and B. Which rotation carries the triangle onto itself?
      options:
        - "A rotation of 120° about the point where the three perpendicular bisectors of the sides meet"
        - "A rotation of 90° about vertex A"
        - "A rotation of 180° about the midpoint of AB"
        - "A rotation of 60° about vertex C"
      option_explanations:
        - |
          Correct. An equilateral triangle has rotation symmetry of order 3 about its centre, which is where the perpendicular bisectors (and the lines of symmetry) meet; 360° ÷ 3 = 120°.
        - |
          A rotation about a vertex moves the other two vertices off the triangle; 90° is not a symmetry angle of a triangle anyway.
        - |
          A half turn about the midpoint of AB sends C to a point below AB, outside the triangle.
        - |
          Rotating 60° about C sends A onto B (since CA = CB and ∠ACB = 60°), but B moves to a point outside the triangle, so the figure does not land on itself.
      answer: 0

    - slug: geo-u01-w04-q06
      type: multiple_choice
      topic_code: "1.13"
      source: "IM Geometry, Unit 1, Lesson 13"
      points: 1
      prompt: |
        Triangle PQR with P = (1, 0), Q = (3, 0), R = (3, 2) is carried to triangle P′Q′R′ with P′ = (0, 1), Q′ = (0, 3), R′ = (−2, 3). Which single transformation does this?
      options:
        - "A translation by the arrow (−1, 1)"
        - "A rotation of 90° counter-clockwise about the origin"
        - "A reflection across the line y = x"
        - "A rotation of 90° clockwise about the origin"
      option_explanations:
        - |
          P moves by (−1, 1) but Q moves by (−3, 3), so the vertices do not all move by the same arrow.
        - |
          Correct. (x, y) → (−y, x) sends (1, 0) → (0, 1), (3, 0) → (0, 3), (3, 2) → (−2, 3), matching every vertex, and orientation is preserved.
        - |
          Reflecting across y = x sends (3, 2) to (2, 3), not (−2, 3), and would reverse orientation.
        - |
          Clockwise 90° sends (1, 0) to (0, −1), not (0, 1).
      answer: 1

    - slug: geo-u01-w04-q07
      type: multiple_choice
      topic_code: "1.15"
      source: "IM Geometry, Unit 1, Lesson 15"
      points: 1
      prompt: |
        How many lines of symmetry does a rectangle that is not a square have, and where are they?
      options:
        - "Four: the two diagonals and the two lines through midpoints of opposite sides"
        - "Two: the diagonals"
        - "Two: the lines through the midpoints of opposite sides"
        - "One: the longer diagonal"
      option_explanations:
        - |
          Four is the count for a square; a non-square rectangle's diagonals are not lines of symmetry.
        - |
          The diagonals are lines of symmetry of a rhombus, not of a rectangle: reflecting a 6-by-4 rectangle across a diagonal moves a vertex off the figure.
        - |
          Correct. Folding along either midpoint line matches the two halves exactly; these are the only two.
        - |
          Both diagonals of a rectangle are the same length, and neither is a line of symmetry.
      answer: 2

    - slug: geo-u01-w04-q08
      type: multiple_choice
      topic_code: "1.16"
      source: "IM Geometry, Unit 1, Lesson 16"
      points: 1
      prompt: |
        What is the smallest positive angle of rotation symmetry of a regular pentagon, and what is its order of rotation symmetry?
      options:
        - "72° and order 5"
        - "60° and order 6"
        - "108° and order 5"
        - "72° and order 4"
      option_explanations:
        - |
          Correct. 360° ÷ 5 = 72°, and the pentagon matches itself at 72°, 144°, 216°, 288° and 360°: five positions.
        - |
          60° and order 6 belong to a regular hexagon.
        - |
          108° is the interior angle of a regular pentagon, not its angle of rotation symmetry.
        - |
          The order counts the full turn too, giving 5, not 4.
      answer: 0

    - slug: geo-u01-w04-q09
      type: multiple_choice
      topic_code: "1.15"
      source: "IM Geometry, Unit 1, Lesson 15"
      points: 1
      prompt: |
        Isosceles triangle ABC has AB = AC, and M is the midpoint of BC. Reflecting across line AM carries the triangle onto itself. Which fact does this reflection NOT establish?
      options:
        - "∠ABC = ∠ACB"
        - "AM ⊥ BC"
        - "AM bisects ∠BAC"
        - "AB = BC"
      option_explanations:
        - |
          The reflection swaps B and C and fixes A, so it carries ∠ABC onto ∠ACB; this is established.
        - |
          The reflection swaps ∠AMB and ∠AMC, which together make 180°, so each is 90°; this is established.
        - |
          The reflection swaps ∠BAM and ∠CAM, so they are congruent; this is established.
        - |
          Correct. Nothing in the symmetry relates AB to the base BC; in general they are different (the triangle is isosceles, not equilateral).
      answer: 3

    - slug: geo-u01-w04-q10
      type: multiple_choice
      topic_code: "1.14"
      source: "IM Geometry, Unit 1, Lesson 14"
      points: 1
      prompt: |
        A rotation of 180° about C = (2, 5) sends P to P′ = (−1, 9). What is P?
      options:
        - "(5, 1)"
        - "(−4, 13)"
        - "(0.5, 7)"
        - "(1, 4)"
      option_explanations:
        - |
          Correct. C is the midpoint of PP′, so P = (2 × 2 − (−1), 2 × 5 − 9) = (5, 1). Check: midpoint of (5, 1) and (−1, 9) is (2, 5).
        - |
          (−4, 13) is the image of P′ under the rotation again; rotating twice by 180° returns to P, so P′ rotated once more gives back P, not this.
        - |
          (0.5, 7) is the midpoint of C and P′, not the pre-image.
        - |
          (1, 4) is P′ minus the arrow (−2, 5); a rotation is not a translation.
      answer: 0

    - slug: geo-u01-w04-q11
      type: multiple_choice
      topic_code: "1.11"
      source: "IM Geometry, Unit 1, Lesson 11"
      points: 1
      prompt: |
        Review. A reflection sends (3, 2) to (3, −6). What is the line of reflection?
      options:
        - "x = 3"
        - "y = −2"
        - "y = −4"
        - "y = 2"
      option_explanations:
        - |
          Both points are on x = 3; that line contains the segment instead of bisecting it at right angles.
        - |
          Correct. The midpoint of (3, 2) and (3, −6) is (3, −2), and the segment is vertical, so its perpendicular bisector is the horizontal line y = −2.
        - |
          y = −4 is horizontal but passes 2 units below the midpoint.
        - |
          y = 2 passes through the original point, so that point would be fixed, not moved.
      answer: 1

    - slug: geo-u01-w04-q12
      type: multiple_choice
      topic_code: "1.12"
      source: "IM Geometry, Unit 1, Lesson 12"
      points: 1
      prompt: |
        Review. Which property distinguishes a translation from every rotation with a nonzero angle?
      options:
        - "A translation preserves distances; a rotation does not"
        - "A translation has no fixed points; a rotation fixes its centre"
        - "A translation reverses orientation; a rotation preserves it"
        - "A translation moves points along circles; a rotation moves them along lines"
      option_explanations:
        - |
          Both are rigid transformations, so both preserve every distance.
        - |
          Correct. Every point moves under a translation by a nonzero arrow, whereas the centre of a rotation stays put.
        - |
          Both preserve orientation; only reflections reverse it.
        - |
          It is the other way round: translations move points along parallel lines, rotations along circles.
      answer: 1

    - slug: geo-u01-w04-q13
      type: multiple_choice
      topic_code: "1.5"
      source: "IM Geometry, Unit 1, Lesson 5"
      points: 1
      prompt: |
        Review. To construct the image of P under a rotation about O by a given angle, you draw the circle centred at O through P and then copy the angle at O. Copying an angle with compass and straightedge relies on which earlier idea?
      options:
        - "Two circles with equal radii produce a kite (or congruent triangles) whose matching angles are equal"
        - "A circle meets a line at right angles"
        - "The perpendicular bisector of a segment is parallel to the segment"
        - "The straightedge can measure the angle"
      option_explanations:
        - |
          Correct. Marking equal distances from the vertex and an equal chord between the arms reproduces the same kite, so the copied angle is congruent to the original; this is the same reasoning as the angle-bisector construction.
        - |
          Circles do not meet lines at right angles in general; radii do meet tangent lines at right angles, which is not used here.
        - |
          A perpendicular bisector is perpendicular to its segment, not parallel.
        - |
          A straightedge has no marks and cannot measure anything.
      answer: 0

    - slug: geo-u01-w04-q14
      type: multi_select
      topic_code: "1.15"
      source: "IM Geometry, Unit 1, Lesson 15"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following figures have at least one line of symmetry? Select all that apply.
      options:
        - "A kite that is not a rhombus"
        - "A parallelogram that is not a rhombus or rectangle"
        - "An isosceles trapezoid"
        - "A scalene triangle"
        - "A regular heptagon"
      option_explanations:
        - |
          Yes: the diagonal through the vertices where the congruent sides meet is a line of symmetry.
        - |
          No: such a parallelogram has 180° rotation symmetry but no line of symmetry.
        - |
          Yes: the line through the midpoints of the two parallel sides.
        - |
          No: all three sides differ, so no reflection can carry it onto itself.
        - |
          Yes: a regular 7-gon has seven lines of symmetry, each through a vertex and the midpoint of the opposite side.
      answer: [0, 2, 4]

    - slug: geo-u01-w04-q15
      type: multi_select
      topic_code: "1.16"
      source: "IM Geometry, Unit 1, Lesson 16"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following figures have rotation symmetry of 180° about some point? Select all that apply.
      options:
        - "A rhombus"
        - "A rectangle"
        - "An isosceles triangle"
        - "A regular hexagon"
        - "A kite that is not a rhombus"
      option_explanations:
        - |
          Yes: a rhombus is a parallelogram, with 180° symmetry about the intersection of its diagonals.
        - |
          Yes: a rectangle is also a parallelogram, with the same 180° symmetry.
        - |
          No: a 180° turn would put the apex where the base is; an isosceles triangle has only a line of symmetry.
        - |
          Yes: 180° is a multiple of 60°, so a regular hexagon matches itself after a half turn (opposite vertices swap).
        - |
          No: a kite's two ends are different, so a half turn does not carry it onto itself.
      answer: [0, 1, 3]

    - slug: geo-u01-w04-q16
      type: true_false
      topic_code: "1.14"
      source: "IM Geometry, Unit 1, Lesson 14"
      points: 1
      prompt: |
        True or false: a rotation of 180° about a point O gives the same image whether it is performed clockwise or counter-clockwise.
      answer: true
      explanation: |
        True. Either way, P′ lies on the circle centred at O through P and on the ray opposite OP, so O is the midpoint of PP′. For any other angle the two directions give different images.

    - slug: geo-u01-w04-q17
      type: true_false
      topic_code: "1.3"
      source: "IM Geometry, Unit 1, Lesson 3"
      points: 1
      prompt: |
        Review. True or false: the centre of a rotation that sends P to P′ must lie on the perpendicular bisector of PP′.
      answer: true
      explanation: |
        True. The centre O satisfies OP = OP′, so it is equidistant from P and P′, and every point equidistant from two points lies on their perpendicular bisector. Using two pairs locates the centre at the intersection of two bisectors.

    - slug: geo-u01-w04-q18
      type: fill_blank
      topic_code: "1.16"
      source: "IM Geometry, Unit 1, Lesson 16"
      points: 1
      prompt: |
        The smallest positive angle of rotation symmetry of a regular octagon is ____ degrees.
      answer: ["45", "45°", "45 degrees"]
      explanation: |
        A regular n-gon has rotation symmetry of order n with smallest angle 360°/n. For n = 8 that is 360 ÷ 8 = 45°.

    - slug: geo-u01-w04-q19
      type: fill_blank
      topic_code: "1.15"
      source: "IM Geometry, Unit 1, Lesson 15"
      points: 1
      prompt: |
        A figure has reflection symmetry if reflecting across some line carries the figure onto itself; that line is called a line of ____.
      answer: ["symmetry", "reflection symmetry", "reflection"]
      explanation: |
        A line of symmetry is a mirror for the figure: folding along it makes the two halves coincide. A square has four, a kite one, a parallelogram none.

