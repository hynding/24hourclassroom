      answer: |
        (a) Lines of symmetry: the two diagonals, line PR and line QS. Rotation symmetry: 180° about T (order 2). (b) Reflecting across PR fixes P and R and swaps Q and S (Q and S are equidistant from P and from R, so PR is the perpendicular bisector of QS). The reflection carries ray PQ onto ray PS, so ∠QPT is carried onto ∠SPT; these angles are therefore congruent and PR bisects ∠QPS. (c) Since the reflection across PR sends Q to S, line PR is the perpendicular bisector of QS by the definition of reflection. In particular PR ⊥ QS at T, and T is the midpoint of QS.
