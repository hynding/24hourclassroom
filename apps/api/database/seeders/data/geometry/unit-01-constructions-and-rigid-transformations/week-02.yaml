      prompt: |
        A square is inscribed in a circle of radius 6 with centre O. Answer (a), (b) and (c).

        (a) Describe how to construct the square using only compass and straightedge, starting from one diameter.
        (b) Find the side length of the square, showing your reasoning.
        (c) Find the area of the square and explain how it compares with the area of the square whose side is the diameter.
      answer: |
        (a) Draw a diameter AC through O. Construct the perpendicular bisector of AC (equal circles at A and C, join the crossings); it passes through O and meets the circle at B and D. Join A, B, C, D in order. (b) OA = OB = 6 and ∠AOB = 90°, so by the Pythagorean theorem AB = √(36 + 36) = √72 = 6√2 ≈ 8.49. (c) Area = (6√2)² = 72. The square on the diameter has side 12 and area 144, so the inscribed square has exactly half that area.
      explanation: |
        1 point for (a): perpendicular bisector of a diameter giving a second diameter, vertices joined in order. 1 point for (b): 6√2 with the right-triangle reasoning (accept 8.49). 1 point for (c): 72, and "half of 144" or an equivalent comparison.

    - slug: geo-u01-w02-q22
      type: long_answer
      topic_code: "1.5"
      source: "IM Geometry, Unit 1, Lesson 5"
      points: 6
      prompt: |
        Figure description: angle AVB with vertex V. Write numbered compass-and-straightedge steps that construct the bisector of ∠AVB. Then explain why your ray bisects the angle, naming the quadrilateral that appears and the property that justifies the conclusion. Finally, explain what goes wrong if the two circles in the second step have different radii.
      answer: |
        Construction. 1. Draw a circle centred at V with any radius; it crosses ray VA at X and ray VB at Y. 2. Keeping one opening (any radius greater than half of XY), draw a circle centred at X and a circle centred at Y. 3. They cross at a point Z inside the angle (and at a second point outside; use the inside one). 4. Draw ray VZ.

        Why it bisects. VX = VY because both are radii of the circle centred at V. XZ = YZ because Z lies on two circles of equal radius centred at X and Y. So quadrilateral VXZY has two pairs of congruent adjacent sides: it is a kite, and the diagonal VZ joining the vertices where the congruent sides meet is its line of symmetry. Folding the figure along VZ carries X onto Y (both are the same distance from V and from Z), so it carries ray VX onto ray VY and ∠XVZ onto ∠YVZ. Congruent angles means VZ bisects ∠AVB. (Equivalently, triangles VXZ and VYZ share VZ and have VX = VY and XZ = YZ, so they are congruent and the angles at V match.)

        Different radii. If the circle at X has radius 3 and the circle at Y has radius 4, then XZ = 3 and YZ = 4, so VXZY is no longer a kite and VZ is no longer a line of symmetry. The ray VZ lands closer to one side than the other and does not bisect the angle.
      explanation: |
        Scoring (6 points): 2 for a correct construction (circle at V giving X and Y; equal circles at X and Y; ray through the crossing); 2 for the justification naming the kite (or congruent triangles) with VX = VY and XZ = YZ each tied to its circle; 1 for explicitly concluding the two angles at V are congruent; 1 for explaining that unequal radii destroy the symmetry (XZ ≠ YZ). Deduct 1 for any appeal to measurement or appearance.
