week: 2
unit: 1
title: "Perpendiculars, Angle Bisectors, Parallels and Squares"
topics: ["1.5", "1.6", "1.7", "1.8"]
guide: guides/week-02.md
guide_description: |
  The rest of the basic construction toolkit, each built from the perpendicular bisector: a perpendicular through
  a point on or off a line, an angle bisector justified by a kite, a parallel by double perpendiculars or by a
  rhombus, a square on a segment and a square inscribed in a circle. Ends with the same constructions in dynamic
  geometry software and the drag test that tells a construction from a drawing.
flashcards_description: |
  27 cards on perpendicular and parallel constructions, angle bisectors, squares, inscribed squares and the
  construction-versus-drawing test in geometry software.

flashcards:
  - front: Perpendicular lines → definition and symbol
    back: |
      Lines (or rays or segments) that meet at a right angle, 90°. Written m ⊥ ℓ. Every perpendicular bisector is perpendicular to its segment, which is how perpendiculars are constructed.
    topic_code: "1.5"
  - front: Perpendicular to ℓ through a point P on ℓ → construction
    back: |
      Draw a circle centred at P; it meets ℓ at X and Y, so P is the midpoint of XY. Construct the perpendicular bisector of XY with equal circles at X and Y. That bisector passes through P and is perpendicular to ℓ.
    topic_code: "1.5"
  - front: Perpendicular to ℓ through a point P not on ℓ → construction
    back: |
      Draw a circle centred at P large enough to cross ℓ at X and Y; then PX = PY. Construct the perpendicular bisector of XY (P is already one equidistant point; find a second crossing Z with equal circles at X and Y). Line PZ ⊥ ℓ.
    topic_code: "1.5"
  - front: Foot of a perpendicular → meaning
    back: |
      The point where a perpendicular from P meets the line ℓ. In the circle construction it is the midpoint of the chord XY cut by the circle centred at P, and PF is the distance from P to ℓ.
    topic_code: "1.5"
  - front: Angle bisector → definition
    back: |
      The ray from the vertex that divides an angle into two congruent angles. Every point on the bisector is equidistant from the two sides of the angle.
    topic_code: "1.5"
  - front: Bisecting ∠AVB → construction steps
    back: |
      Circle centred at V crosses VA at X and VB at Y. Equal circles centred at X and Y cross at Z inside the angle. Ray VZ is the bisector.
    topic_code: "1.5"
  - front: Angle bisector construction → why ray VZ bisects
    back: |
      VX = VY (radii at V) and XZ = YZ (equal radii at X and Y), so VXZY is a kite with axis VZ. Folding along VZ swaps X and Y, so ∠XVZ ≅ ∠YVZ. Later: triangles VXZ and VYZ are congruent by SSS.
    topic_code: "1.5"
  - front: Kite → definition and the property its axis has
    back: |
      A quadrilateral with two pairs of congruent adjacent sides. The diagonal joining the vertices where the equal sides meet is a line of symmetry: it bisects those two angles and is the perpendicular bisector of the other diagonal.
    topic_code: "1.5"
  - front: Error-spot → unequal circles at X and Y when bisecting an angle
    back: |
      If XZ ≠ YZ the figure VXZY is not a kite and VZ leans toward one side. Both circles in the second step must have the same radius.
    topic_code: "1.5"
  - front: Constructing a 45° angle → steps
    back: |
      Construct a perpendicular to a line at a point (90°), then bisect the right angle. Bisecting again gives 22.5°. Only halvings are possible with repeated bisection.
    topic_code: "1.5"
  - front: Parallel lines → definition
    back: |
      Two lines in the same plane that never meet, written m ∥ ℓ. Being the same distance apart everywhere is a consequence of parallelism, not the definition.
    topic_code: "1.6"
  - front: Parallel to ℓ through P → double-perpendicular construction
    back: |
      Construct the perpendicular m to ℓ through P, then the perpendicular n to m through P. Then n ∥ ℓ because both are perpendicular to m.
    topic_code: "1.6"
  - front: Two lines perpendicular to the same line → why parallel
    back: |
      If they met at a point Q, Q and the two feet on the common line would form a triangle with two right angles, which is impossible once the angle sum of a triangle is known to be 180°.
    topic_code: "1.6"
  - front: Parallel to ℓ through P → rhombus construction
    back: |
      Pick A on ℓ; circle at A through P meets ℓ at B. Circles of that same radius at P and at B cross at C. ABCP has four equal sides, a rhombus, so PC ∥ AB.
    topic_code: "1.6"
  - front: Rhombus → why its opposite sides are parallel
    back: |
      A rhombus is a parallelogram (opposite sides congruent in pairs forces parallel sides, proved in Unit 2). So building a rhombus with one side on ℓ gives a side parallel to ℓ through the chosen point.
    topic_code: "1.6"
  - front: Distance between parallel lines → how it is measured
    back: |
      Along a perpendicular. Any point on one of two parallel lines is the same perpendicular distance from the other line; that constant distance is the distance between the lines.
    topic_code: "1.6"
  - front: Square → definition
    back: |
      A quadrilateral with four congruent sides and four right angles. Equivalently a rhombus with one right angle, or a rectangle with two adjacent sides congruent.
    topic_code: "1.7"
  - front: Square on segment AB → construction
    back: |
      Construct perpendiculars to AB at A and at B. Circles of radius AB centred at A and at B meet those perpendiculars at D and C on the same side. ABCD is a square.
    topic_code: "1.7"
  - front: Square construction → why ABCD is a square
    back: |
      AD = AB and BC = AB by circles. AD ∥ BC since both are perpendicular to AB, so ABCD is a parallelogram with a pair of congruent parallel sides. Then DC = AB too, and the right angles at A and B force right angles at C and D.
    topic_code: "1.7"
  - front: Inscribed polygon → meaning
    back: |
      A polygon whose vertices all lie on a circle. An inscribed square is built from two perpendicular diameters; an inscribed regular hexagon from stepping the radius around the circle.
    topic_code: "1.7"
  - front: Square inscribed in a circle → construction
    back: |
      Draw a diameter AC through the centre O. Construct its perpendicular bisector, which is a second diameter BD. A, B, C, D in order form a square: congruent perpendicular diagonals that bisect each other.
    topic_code: "1.7"
  - front: Side of a square inscribed in a circle of radius r → formula
    back: |
      r√2. Triangle AOB has legs OA = OB = r and a right angle at O, so AB = √(r² + r²) = r√2. The square's area is 2r², half the area of the square built on the diameter.
    topic_code: "1.7"
  - front: Radius of the circle through the vertices of a square of side s → formula
    back: |
      Half the diagonal: s√2 ÷ 2 = s/√2 ≈ 0.707s. For side 10 the radius is 5√2 ≈ 7.07.
    topic_code: "1.7"
  - front: Dynamic geometry software → the drag test
    back: |
      Drag one of the starting points. In a true construction every relationship (midpoint, perpendicular, equal lengths) survives, because each object is defined by others. In a drawing placed by eye, the relationships break.
    topic_code: "1.8"
  - front: Construction versus drawing in software → the difference
    back: |
      A construction defines each new object as a circle, a line or an intersection of earlier objects. A drawing positions objects by eye or by measuring and adjusting. Only the construction keeps its properties when dragged.
    topic_code: "1.8"
  - front: Software shortcut tools (perpendicular, parallel, bisector) → what they hide
    back: |
      Each is one of this week's compass constructions done automatically. When asked to construct with only circles and lines, build it yourself; otherwise you may use the tool but should be able to explain the construction behind it.
    topic_code: "1.8"
  - front: Which construction when → "I need a line through P parallel to ℓ"
    back: |
      Either two perpendiculars (perpendicular to ℓ through P, then perpendicular to that through P) or a rhombus with one side on ℓ and P as a vertex. Both justify parallelism without measuring.
    topic_code: "1.6"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 1.5 to 1.8: perpendiculars, angle bisectors,
    parallels, squares and constructions in software) with review of week 1 (the definition of a circle,
    perpendicular bisectors and equilateral triangles). Multiple choice, select-all, true/false and numeric items
    are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer
    are graded by your teacher against the scoring notes.
  questions:
    - slug: geo-u01-w02-q01
      type: multiple_choice
      topic_code: "1.5"
      source: "IM Geometry, Unit 1, Lesson 5"
      points: 1
      prompt: |
        Point P lies on line ℓ. To construct the perpendicular to ℓ at P, a student draws a circle centred at P that meets ℓ at X and Y. What is the purpose of this first circle?
      options:
        - "To find two points on ℓ that are equidistant from P, so that P is the midpoint of XY"
        - "To find the point on ℓ closest to P"
        - "To copy the length of ℓ"
        - "To draw the perpendicular directly, since a circle meets a line at right angles"
      option_explanations:
        - |
          Correct. PX = PY because both are radii, so P is the midpoint of XY and the perpendicular bisector of XY is the perpendicular to ℓ through P.
        - |
          P is already on ℓ, so there is no "closest point" to find; the circle's job is to produce a segment XY centred at P.
        - |
          A line has no length to copy; the circle marks two points at an equal distance from P.
        - |
          A circle does not meet a line at right angles in general, and the circle alone does not produce a line; the perpendicular comes from bisecting XY.
      answer: 0

    - slug: geo-u01-w02-q02
      type: multiple_choice
      topic_code: "1.5"
      source: "IM Geometry, Unit 1, Lesson 5"
      points: 1
      prompt: |
        Figure description: line ℓ, point P not on ℓ. A circle centred at P with radius 10 crosses ℓ at X and Y, and the perpendicular from P meets ℓ at F with PF = 6. What is XY?
      options:
        - "8"
        - "16"
        - "20"
        - "12"
      option_explanations:
        - |
          8 is FX (from 10² − 6² = 64), only half of XY; the chord is symmetric about F.
        - |
          Correct. FX = √(10² − 6²) = √64 = 8 and FY = 8 by symmetry, so XY = 16.
        - |
          20 is the diameter of the circle, which would be the chord only if ℓ passed through P.
        - |
          12 is twice PF; it mixes up the distance to the line with the half-chord.
      answer: 1

    - slug: geo-u01-w02-q03
      type: multiple_choice
      topic_code: "1.5"
      source: "IM Geometry, Unit 1, Lesson 5"
      points: 1
      prompt: |
        To bisect ∠AVB, a circle centred at V marks X on ray VA and Y on ray VB; then equal circles centred at X and Y cross at Z. Which fact about quadrilateral VXZY justifies that ray VZ bisects the angle?
      options:
        - "It is a kite with VX = VY and XZ = YZ, so VZ is its line of symmetry"
        - "It is a rectangle, so its diagonals are congruent"
        - "It is a square, so its diagonals are perpendicular"
        - "It is a trapezoid with XZ ∥ VY"
      option_explanations:
        - |
          Correct. Two pairs of congruent adjacent sides make a kite; folding along VZ sends X to Y, so the two angles at V are congruent.
        - |
          There are no right angles forced by the construction, so VXZY is not a rectangle; congruent diagonals would not bisect the angle anyway.
        - |
          The construction does not produce right angles; even when all four sides are equal (a rhombus), the figure is not generally a square.
        - |
          Nothing in the construction makes XZ parallel to VY; the sides XZ and YZ meet at Z.
      answer: 0

    - slug: geo-u01-w02-q05
      type: multiple_choice
      topic_code: "1.6"
      source: "IM Geometry, Unit 1, Lesson 6"
      points: 1
      prompt: |
        A student constructs line m perpendicular to ℓ through P, then line n perpendicular to m through P. Why is n parallel to ℓ?
      options:
        - "Because n and ℓ are the same distance apart at P"
        - "Because two lines that are both perpendicular to the same line cannot meet"
        - "Because n passes through P and ℓ does not"
        - "Because perpendicular lines are always parallel to each other"
      option_explanations:
        - |
          Being a fixed distance apart is a consequence of being parallel, and it cannot be checked at a single point anyway.
        - |
          Correct. If n and ℓ met at Q, then Q and the two feet on m would form a triangle with two right angles, which is impossible.
        - |
          Lots of lines through P are not parallel to ℓ; the reason has to involve the common perpendicular m.
        - |
          Perpendicular lines meet at right angles; they are not parallel. The parallel pair here is n and ℓ, both perpendicular to m.
      answer: 1

    - slug: geo-u01-w02-q06
      type: multiple_choice
      topic_code: "1.6"
      source: "IM Geometry, Unit 1, Lesson 6"
      points: 1
      prompt: |
        Figure description: line ℓ through points A and B; point P above ℓ with AP = AB. Circles of radius AB are centred at P and at B and cross at C above B. Which statement explains why PC ∥ ℓ?
      options:
        - "ABCP has four congruent sides, so it is a rhombus, and opposite sides of a rhombus are parallel"
        - "PC and AB are both radii of the same circle"
        - "C is the reflection of A across line PB"
        - "Triangle PBC is equilateral, so PC is horizontal"
      option_explanations:
        - |
          Correct. AB = AP by the first circle, PC = AB and BC = AB by the next two, so ABCP is a rhombus and PC ∥ AB.
        - |
          PC and AB are radii of different circles; equal lengths alone do not make segments parallel.
        - |
          Nothing in the construction reflects across PB; the justification is about four equal sides.
        - |
          PBC is equilateral when PB = AB, which is not generally true; and "horizontal" is not a geometric reason.
      answer: 0

    - slug: geo-u01-w02-q07
      type: multiple_choice
      topic_code: "1.7"
      source: "IM Geometry, Unit 1, Lesson 7"
      points: 1
      prompt: |
        In constructing a square ABCD on segment AB, a student builds the perpendicular at A, marks D on it with AD = AB, then builds the perpendicular at B and marks C with BC = AB on the same side. Which pair of facts together guarantees that DC is parallel and congruent to AB?
      options:
        - "AD ∥ BC (both perpendicular to AB) and AD = BC, so ABCD is a parallelogram"
        - "AD ⊥ AB and BC ⊥ AB, so DC ⊥ AB"
        - "AD = AB and BC = AB, so triangle ABD is isosceles"
        - "The diagonals AC and BD are perpendicular"
      option_explanations:
        - |
          Correct. One pair of opposite sides that is both parallel and congruent makes a parallelogram, so the other pair, DC and AB, is also parallel and congruent.
        - |
          Two sides perpendicular to AB make them parallel to each other, not DC perpendicular to AB; DC ends up parallel to AB.
        - |
          Those equalities are true, but an isosceles triangle does not by itself say anything about DC.
        - |
          The diagonals of this square are indeed perpendicular, but that is a property to be concluded, not one of the construction's given facts.
      answer: 0

    - slug: geo-u01-w02-q08
      type: multiple_choice
      topic_code: "1.7"
      source: "IM Geometry, Unit 1, Lesson 7"
      points: 1
      prompt: |
        A square is inscribed in a circle of radius 5. What is the side length of the square?
      options:
        - "5"
        - "5√2"
        - "10"
        - "5√3"
      option_explanations:
        - |
          5 is the radius; the side of the inscribed square is longer than the radius (it is the hypotenuse of a right triangle with legs 5 and 5).
        - |
          Correct. Two perpendicular radii OA and OB form a right triangle with legs 5 and 5, so AB = √(25 + 25) = 5√2 ≈ 7.07.
        - |
          10 is the diameter, which is the diagonal of the square, not its side.
        - |
          5√3 would be the side of an inscribed equilateral triangle, not a square.
      answer: 1

    - slug: geo-u01-w02-q09
      type: multiple_choice
      topic_code: "1.8"
      source: "IM Geometry, Unit 1, Lesson 8"
      points: 1
      prompt: |
        In dynamic geometry software, a student places point M where the midpoint of AB appears to be, then drags point A. Which outcome shows that M was not constructed?
      options:
        - "M stays where it was and is no longer the midpoint of AB"
        - "M moves so that it remains the midpoint of AB"
        - "Segment AB changes length"
        - "The software displays the coordinates of M"
      option_explanations:
        - |
          Correct. A point placed by eye is independent of A and B, so it does not follow when A moves. A constructed midpoint would move with it.
        - |
          That is exactly the behaviour of a constructed midpoint; it is the opposite of the student's situation.
        - |
          AB changes length whenever A is dragged, whether or not M was constructed; this says nothing about M.
        - |
          Displaying coordinates is a feature of the software, not a test of whether relationships are defined.
      answer: 0

    - slug: geo-u01-w02-q10
      type: multiple_choice
      topic_code: "1.8"
      source: "IM Geometry, Unit 1, Lesson 8"
      points: 1
      prompt: |
        Which sequence of software tools produces an equilateral triangle on AB that stays equilateral when A is dragged?
      options:
        - "Circle centred at A through B; circle centred at B through A; intersect; segments from the intersection to A and B"
        - "Point placed by eye above AB; segments to A and B; adjust until the measured sides match"
        - "Segment AB; measure its length; type the length into two new segments"
        - "Rotate segment AB by 60° by typing the angle into a rotation tool, then connect"
      option_explanations:
        - |
          Correct. Each object is defined by earlier objects, so dragging A redraws the circles and the intersection and the triangle stays equilateral.
        - |
          A point placed by eye is not tied to A or B; dragging A breaks the equal lengths.
        - |
          Typing a number fixes a length that does not update when AB changes, so the triangle falls apart.
        - |
          A typed 60° fixes the angle numerically instead of building it from circles and lines; it is a measurement shortcut, not the compass-and-straightedge construction the question asks for.
      answer: 0

    - slug: geo-u01-w02-q11
      type: multiple_choice
      topic_code: "1.3"
      source: "IM Geometry, Unit 1, Lesson 3"
      points: 1
      prompt: |
        Review. Which of the following is the set of all points P in a plane such that PA = PB for fixed points A and B?
      options:
        - "The circle with diameter AB"
        - "The midpoint of AB only"
        - "The perpendicular bisector of AB"
        - "The line through A and B"
      option_explanations:
        - |
          Points on that circle are generally at unequal distances from A and B.
        - |
          The midpoint is one such point, but every point on the perpendicular bisector qualifies.
        - |
          Correct. The perpendicular bisector is exactly the set of points equidistant from A and B, which is why the two-circle construction produces it.
        - |
          On line AB only the midpoint is equidistant from A and B.
      answer: 2

    - slug: geo-u01-w02-q12
      type: multiple_choice
      topic_code: "1.4"
      source: "IM Geometry, Unit 1, Lesson 4"
      points: 1
      prompt: |
        Review. Circles of radius AB centred at A and at B cross at C. Which statement is a correct justification that AC = BC?
      options:
        - "AC = AB because C is on the circle centred at A, and BC = AB because C is on the circle centred at B"
        - "AC = BC because C is on the perpendicular bisector of AB, and the perpendicular bisector was drawn first"
        - "AC = BC because triangle ABC looks symmetric"
        - "AC = BC because both are diameters of the same circle"
      option_explanations:
        - |
          Correct. Each equality comes from one circle; together they give AC = AB = BC.
        - |
          C is on the perpendicular bisector, but the bisector was not drawn first; it is a consequence of the two circles, not the reason for them.
        - |
          Appearance is never a justification in a construction.
        - |
          AC and BC are radii, not diameters, and they belong to different circles.
      answer: 0

    - slug: geo-u01-w02-q13
      type: multi_select
      topic_code: "1.7"
      source: "IM Geometry, Unit 1, Lesson 7"
      points: 2
      partial_credit: true
      prompt: |
        Figure description: circle with centre O. Diameter AC is drawn, and its perpendicular bisector meets the circle at B and D. Which statements about quadrilateral ABCD are true? Select all that apply.
      options:
        - "Its diagonals are congruent"
        - "Its diagonals are perpendicular"
        - "Its diagonals bisect each other"
        - "Each side equals the radius"
        - "It is a square"
      option_explanations:
        - |
          True: AC and BD are both diameters, so both equal 2r.
        - |
          True: BD was constructed as the perpendicular bisector of AC.
        - |
          True: both diameters pass through O, the midpoint of each.
        - |
          False: each side is r√2, the hypotenuse of a right triangle with two radii as legs.
        - |
          True: congruent, perpendicular diagonals that bisect each other force four congruent sides and four right angles.
      answer: [0, 1, 2, 4]

    - slug: geo-u01-w02-q14
      type: multi_select
      topic_code: "1.4"
      source: "IM Geometry, Unit 1, Lesson 5"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following can be constructed from a line ℓ and a point P on it using only compass and straightedge? Select all that apply.
      options:
        - "A 90° angle at P"
        - "A 45° angle at P"
        - "A 60° angle at P"
        - "A 30° angle at P"
        - "A 20° angle at P"
      option_explanations:
        - |
          Yes: a circle at P gives X and Y on ℓ; the perpendicular bisector of XY is perpendicular to ℓ at P.
        - |
          Yes: bisect the right angle constructed at P to get 45°.
        - |
          Yes: construct an equilateral triangle on a segment from P along ℓ.
        - |
          Yes: bisect the 60° angle from the equilateral triangle to get 30°.
        - |
          No: 20° is a third of 60°, and trisecting an angle is impossible with compass and straightedge; no sequence of bisections of 90° or 60° gives 20°.
      answer: [0, 1, 2, 3]

    - slug: geo-u01-w02-q15
      type: true_false
      topic_code: "1.6"
      source: "IM Geometry, Unit 1, Lesson 6"
      points: 1
      prompt: |
        True or false: the definition of parallel lines is "two lines that are the same distance apart everywhere".
      answer: false
      explanation: |
        False. Parallel lines are defined as lines in the same plane that never meet. Being a constant distance apart is a theorem that follows from the definition (and from the parallel postulate), not the definition itself.

    - slug: geo-u01-w02-q16
      type: true_false
      topic_code: "1.1"
      source: "IM Geometry, Unit 1, Lesson 1"
      points: 1
      prompt: |
        Review. True or false: in a construction, a straightedge may be used to draw the line through any two points that have already been constructed, but never to measure.
      answer: true
      explanation: |
        True. The straightedge has no markings. New points come only from intersections of circles and lines; lengths are transferred by the compass, never read from a scale.

    - slug: geo-u01-w02-q17
      type: fill_blank
      topic_code: "1.5"
      source: "IM Geometry, Unit 1, Lesson 5"
      points: 1
      prompt: |
        A quadrilateral with two pairs of congruent adjacent sides, such as VXZY in the angle-bisector construction, is called a ____.
      answer: ["kite"]
      explanation: |
        In the construction VX = VY and XZ = YZ, which are two pairs of congruent adjacent sides. The diagonal VZ is the kite's axis of symmetry, so it bisects the angle at V.

    - slug: geo-u01-w02-q18
      type: fill_blank
      topic_code: "1.6"
      source: "IM Geometry, Unit 1, Lesson 6"
      points: 1
      prompt: |
        Two lines in the same plane that never intersect are called ____ lines.
      answer: ["parallel"]
      explanation: |
        Parallel lines are constructed either as two lines perpendicular to a common line or as opposite sides of a rhombus. The symbol is ∥.

    - slug: geo-u01-w02-q19
      type: numeric
      topic_code: "1.7"
      source: "general knowledge"
      points: 1
      prompt: |
        A square is inscribed in a circle of radius 4. What is the area of the square? Give an exact integer.
      answer: { value: 32, tolerance: 0 }
      explanation: |
        The side is 4√2 (hypotenuse of a right triangle with legs 4 and 4), so the area is (4√2)² = 32. Equivalently, the area of a square is half the square of its diagonal: 8² ÷ 2 = 32.

    - slug: geo-u01-w02-q20
      type: numeric
      topic_code: "1.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Point P is 9 units from line ℓ. A circle centred at P with radius 15 crosses ℓ at X and Y. What is the length XY? Give an exact integer.
      answer: { value: 24, tolerance: 0 }
      explanation: |
        The foot F of the perpendicular from P is the midpoint of XY. FX = √(15² − 9²) = √(225 − 81) = √144 = 12, so XY = 24.

    - slug: geo-u01-w02-q23
      type: multiple_choice
      topic_code: "1.2"
      source: "IM Geometry, Unit 1, Lesson 2"
      points: 1
      prompt: |
        Review. In the six-petal daisy pattern built on a circle of radius r centred at O, with points A, B, C, D, E, F in order around the circle, what is the length of BE?
      options:
        - "r"
        - "r√2"
        - "r√3"
        - "2r"
      option_explanations:
        - |
          r is the distance between neighbouring points such as B and C; B and E are three steps apart.
        - |
          r√2 is the side of an inscribed square, which does not appear in the six-point pattern.
        - |
          r√3 is the distance between points two steps apart, such as B and D, not three.
        - |
          Correct. B and E are opposite points: triangles OBC, OCD and ODE together turn 3 × 60° = 180°, so B, O, E are collinear and BE is a diameter, 2r.
      answer: 3

