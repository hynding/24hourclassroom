week: 1
unit: 1
title: "Compass, Straightedge and the Definition of a Circle"
topics: ["1.1", "1.2", "1.3", "1.4"]
guide: guides/week-01.md
guide_description: |
  The two tools of classical construction and the one idea behind them: a circle is the set of points at a fixed
  distance from its centre, so a compass is a "same distance" machine. Copying a segment, the six-petal circle
  pattern and the rhombuses and hexagon inside it, the perpendicular bisector of a segment, and Euclid's first
  construction, the equilateral triangle, each with a step-by-step justification.
flashcards_description: |
  26 cards on the definition of a circle, compass and straightedge, the daisy pattern, the perpendicular bisector
  construction and the equilateral triangle construction.

flashcards:
  - front: Circle → definition in terms of distance
    back: |
      The set of all points in a plane that are a fixed distance (the radius) from a fixed point (the centre). Everything in a construction follows from this: two points on the same circle are the same distance from the centre.
    topic_code: "1.1"
  - front: Radius of a circle → two meanings
    back: |
      The fixed distance from the centre to the circle, and also any segment joining the centre to a point on the circle. All radii of one circle are congruent, which is why a compass copies lengths exactly.
    topic_code: "1.1"
  - front: Straightedge → what it can and cannot do
    back: |
      It draws the line through two points you already have. It has no markings, so it cannot measure or copy a length. Measuring with a ruler is not allowed in a construction.
    topic_code: "1.1"
  - front: Compass → what it does in a construction
    back: |
      Draws a circle with a chosen centre and a chosen radius, or copies a distance from one place to another. Because every point of the circle is the same distance from the centre, the compass guarantees equal lengths without measuring.
    topic_code: "1.1"
  - front: Copying a segment AB onto a ray from P → steps
    back: |
      Open the compass to AB. With the point on P, draw an arc crossing the ray at Q. Then PQ = AB because Q is on the circle centred at P with radius AB.
    topic_code: "1.1"
  - front: Justifying equal lengths in a construction → the sentence to write
    back: |
      "Both are radii of the circle centred at X", or "Q lies on the circle centred at P with radius AB, so PQ = AB". Never "they look equal" or "I measured".
    topic_code: "1.1"
  - front: Congruent segments → meaning and notation
    back: |
      Segments with the same length. Write AB ≅ CD for the segments and AB = CD for the lengths. In constructions, congruence is established by showing both segments are radii of equal circles.
    topic_code: "1.1"
  - front: Six-petal daisy pattern → how it is built
    back: |
      Draw a circle centred at O. Keeping the same radius, centre a circle at a point A on it; it meets the first circle at B and F. Centre at B to get C, and so on around. Six equally spaced points and six overlapping circles.
    topic_code: "1.2"
  - front: Why the six daisy points are equally spaced → the triangle argument
    back: |
      Each triangle such as OAB has OA = OB (radii of the first circle) and AB = OA (B is on the circle centred at A with the same radius). So every triangle around O is equilateral and every neighbouring pair of points is a distance r apart.
    topic_code: "1.2"
  - front: Rhombus → definition
    back: |
      A quadrilateral with four congruent sides. In the daisy, two adjacent equilateral triangles that share a side (for example OAB and OBC) form a rhombus OABC with every side equal to the radius.
    topic_code: "1.2"
  - front: Regular hexagon inside the daisy → why its sides equal the radius
    back: |
      Each side AB, BC, … is a chord whose endpoints were marked with the compass set to the radius, so each side is r. The hexagon's perimeter is therefore 6r.
    topic_code: "1.2"
  - front: Regular polygon → definition
    back: |
      A polygon whose sides are all congruent and whose angles are all congruent. The hexagon in the daisy pattern is regular; a rhombus is not regular unless it is a square.
    topic_code: "1.2"
  - front: Perpendicular bisector of a segment → definition
    back: |
      The line through the midpoint of the segment and perpendicular to it. Every point on it is equidistant from the two endpoints, and (Unit 2) every point equidistant from the endpoints lies on it.
    topic_code: "1.3"
  - front: Perpendicular bisector of AB → construction steps
    back: |
      Draw a circle centred at A and a circle centred at B with the same radius (more than half of AB). They cross at P and Q. Line PQ is the perpendicular bisector; it meets AB at the midpoint M.
    topic_code: "1.3"
  - front: Perpendicular bisector construction → why PA = PB
    back: |
      P lies on the circle centred at A, so PA equals the radius; P also lies on the circle centred at B with the same radius, so PB equals the same radius. Hence PA = PB and P is equidistant from A and B.
    topic_code: "1.3"
  - front: Equidistant → meaning
    back: |
      The same distance from two or more objects. A point equidistant from A and B satisfies PA = PB. The set of all such points in the plane is the perpendicular bisector of AB.
    topic_code: "1.3"
  - front: Midpoint of a segment → how to find it without measuring
    back: |
      Construct the perpendicular bisector: equal circles centred at each endpoint, join the two crossing points. Where that line meets the segment is the midpoint, because the construction is symmetric in the two endpoints.
    topic_code: "1.3"
  - front: Error-spot → different radii in a perpendicular bisector construction
    back: |
      If the circle at A has radius 4 and the circle at B has radius 5, a crossing point P has PA = 4 and PB = 5, so it is not equidistant. The line through the crossings is neither perpendicular to AB nor through its midpoint.
    topic_code: "1.3"
  - front: Error-spot → radius too small in a perpendicular bisector construction
    back: |
      If the common radius is at most half the segment, the two circles do not cross (or just touch at the midpoint), so there are no two points to draw the line through. Use a radius greater than half the segment.
    topic_code: "1.3"
  - front: Equilateral triangle → definition
    back: |
      A triangle with three congruent sides. Its three angles are also congruent (each 60°), a fact proved later; the construction establishes the equal sides directly from circles.
    topic_code: "1.4"
  - front: Equilateral triangle on segment AB → construction steps
    back: |
      Draw the circle centred at A through B and the circle centred at B through A. Let C be a crossing point. Join AC and BC. This is Euclid's Proposition 1.
    topic_code: "1.4"
  - front: Equilateral triangle construction → the proof it works
    back: |
      AC = AB because both are radii of the circle centred at A. BC = BA because both are radii of the circle centred at B. So AB = BC = CA.
    topic_code: "1.4"
  - front: Second crossing point in the equilateral-triangle construction → what figure results
    back: |
      Circles centred at A and B with radius AB cross at C and D. Quadrilateral ACBD has all four sides equal to AB, so it is a rhombus, and CD is the perpendicular bisector of AB.
    topic_code: "1.4"
  - front: Regular hexagon from one circle → construction
    back: |
      Mark a point A on a circle of radius r. Keeping the compass at r, step around the circle marking B, C, D, E, F; the sixth step lands back on A. Join consecutive points. Each side is r.
    topic_code: "1.4"
  - front: Which construction when → "I need a right angle at the midpoint"
    back: |
      Perpendicular bisector: equal circles from both endpoints, join the crossings. It gives the midpoint and the right angle in one construction.
    topic_code: "1.3"
  - front: Which construction when → "I need a 60° angle with no protractor"
    back: |
      Construct an equilateral triangle on a segment with one endpoint at the vertex you want. Each angle of an equilateral triangle is 60°, so the angle at that vertex is 60° exactly.
    topic_code: "1.4"

quiz:
  description: |
    22 questions · about 35 minutes · all on this week (topics 1.1 to 1.4: the definition of a circle, compass and
    straightedge, the daisy pattern, perpendicular bisectors and equilateral triangles), with no review yet because
    this is week 1. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank
    items are matched automatically; the short answers and the long answer are graded by your teacher against the
    scoring notes.
  questions:
    - slug: geo-u01-w01-q01
      type: multiple_choice
      topic_code: "1.1"
      source: "IM Geometry, Unit 1, Lesson 1"
      points: 1
      prompt: |
        Which statement is the definition of a circle?
      options:
        - "A round closed curve with no corners"
        - "The set of all points in a plane that are a fixed distance from a given point"
        - "A figure whose perimeter is π times its diameter"
        - "The set of all points in a plane that are the same distance from two given points"
      option_explanations:
        - |
          "Round" and "no corners" describe how a circle looks but do not say which points belong to it; an oval fits this description too.
        - |
          Correct. This is the definition: the fixed point is the centre and the fixed distance is the radius. Every construction argument uses it.
        - |
          That is a true property of circles (the circumference formula), but it is a consequence of the definition, not the definition itself.
        - |
          Points equidistant from two given points form a line, the perpendicular bisector, not a circle.
      answer: 1
      explanation: |
        Skill: state the definition precisely. "Fixed distance from a fixed point" is what lets you say that two radii of one circle are equal.

    - slug: geo-u01-w01-q02
      type: multiple_choice
      topic_code: "1.1"
      source: "IM Geometry, Unit 1, Lesson 1"
      points: 1
      prompt: |
        A compass is set to the length of segment AB and a circle is drawn with its point on C. Point D is on that circle. What can you conclude, and why?
      options:
        - "CD = AB, because the compass measured it"
        - "Nothing can be concluded without a ruler"
        - "AD = AB, because the circle was set from segment AB"
        - "CD = AB, because every point on the circle is the radius AB away from the centre C"
      option_explanations:
        - |
          The compass does not measure anything in the sense of reading a number; the conclusion rests on the definition of a circle, not on measurement.
        - |
          A construction never needs a ruler; the definition of a circle guarantees CD = AB exactly.
        - |
          The circle is centred at C, not at A, so the definition says nothing about the distance from A to D.
        - |
          Correct. The circle centred at C has radius AB, and D lies on it, so the distance from C to D is AB. This is the definition of a circle at work.
      answer: 3

    - slug: geo-u01-w01-q03
      type: multiple_choice
      topic_code: "1.1"
      source: "IM Geometry, Unit 1, Lesson 1"
      points: 1
      prompt: |
        Which of these is NOT allowed in a compass-and-straightedge construction?
      options:
        - "Marking a point 3 cm from another point by reading a ruler"
        - "Drawing a circle centred at a constructed point through another constructed point"
        - "Marking the point where two constructed circles cross"
        - "Drawing the line through two points that have already been constructed"
      option_explanations:
        - |
          Correct. A straightedge has no marks and a construction may not measure. Distances come only from circles.
        - |
          This is exactly what a compass is for; a circle is determined by a centre and a point on it.
        - |
          Intersection points of constructed circles and lines are the only way new points appear; this is allowed.
        - |
          This is exactly what a straightedge is for; lines through two existing points are always allowed.
      answer: 0

    - slug: geo-u01-w01-q04
      type: multiple_choice
      topic_code: "1.2"
      source: "IM Geometry, Unit 1, Lesson 2"
      points: 1
      prompt: |
        Figure description: a circle with centre O and radius r. Point A is on the circle. A second circle with centre A and radius r meets the first circle at B and F. In triangle OAB, which sides are equal to r, and why?
      options:
        - "Only AB, because B is on the circle centred at A"
        - "None, because the circles have different centres"
        - "All three: OA and OB are radii of the circle centred at O, and AB is a radius of the circle centred at A"
        - "Only OA and OB, because they are radii of the circle centred at O"
      option_explanations:
        - |
          AB = r is correct, but so are OA and OB, since A and B both lie on the circle centred at O with radius r.
        - |
          Different centres do not matter; what matters is which circle each endpoint lies on and that both circles have the same radius.
        - |
          Correct. Both circles have radius r, and each side of the triangle is a radius of one of them, so the triangle is equilateral.
        - |
          OA and OB are indeed radii of the first circle, but AB is also r because B lies on the circle centred at A with radius r.
      answer: 2
      explanation: |
        The daisy pattern is six equilateral triangles around O; this is the argument for each one.

    - slug: geo-u01-w01-q05
      type: multiple_choice
      topic_code: "1.2"
      source: "IM Geometry, Unit 1, Lesson 2"
      points: 1
      prompt: |
        In the six-petal daisy pattern built on a circle of radius r, the six points A, B, C, D, E, F are joined in order. Which name best describes polygon ABCDEF?
      options:
        - "A regular hexagon"
        - "An equilateral triangle"
        - "A rhombus"
        - "A rectangle"
      option_explanations:
        - |
          Correct. Six sides, each a chord marked with the compass at radius r, so all six are congruent, and the symmetric construction makes all six angles congruent.
        - |
          The equilateral triangles in the daisy are the six triangles with vertex O, such as OAB, not the outer polygon.
        - |
          A rhombus has four sides; ABCDEF has six. Rhombuses do appear in the daisy, but as quadrilaterals such as OABC.
        - |
          A rectangle has four sides and right angles; the outer figure has six sides and 120° angles.
      answer: 0

    - slug: geo-u01-w01-q06
      type: multiple_choice
      topic_code: "1.3"
      source: "IM Geometry, Unit 1, Lesson 3"
      points: 1
      prompt: |
        To construct the perpendicular bisector of segment AB, you draw two circles that cross at P and Q and then draw line PQ. What must be true of the two circles?
      options:
        - "One is centred at A and one at B, and they can have any two radii"
        - "Both are centred at the midpoint of AB"
        - "One is centred at A with radius AB and one is centred at B with half that radius"
        - "One is centred at A and one at B, and they have the same radius, which is greater than half of AB"
      option_explanations:
        - |
          With different radii a crossing point is at different distances from A and B, so the line through the crossings is not the perpendicular bisector.
        - |
          The midpoint is what you are trying to find; you cannot centre circles on it before you have it.
        - |
          Unequal radii break the equidistance argument; the point P would be AB from A but only half of AB from B.
        - |
          Correct. Equal radii make each crossing point equidistant from A and B, and a radius greater than half of AB guarantees the circles actually cross.
      answer: 3

    - slug: geo-u01-w01-q07
      type: multiple_choice
      topic_code: "1.3"
      source: "IM Geometry, Unit 1, Lesson 3"
      points: 1
      prompt: |
        Figure description: segment AB with AB = 8. Circles of radius 5 centred at A and at B cross at P and Q. Line PQ meets AB at M. Which statement is justified directly by the definition of a circle?
      options:
        - "AM = 4"
        - "∠PMA is a right angle"
        - "PA = PB = 5"
        - "PM = 3"
      option_explanations:
        - |
          AM = 4 is true, but it follows from the symmetry of the construction (M is the midpoint), not directly from "P is on a circle".
        - |
          The right angle is true but needs the perpendicular bisector argument; the definition of a circle alone gives only distances from centres.
        - |
          Correct. P is on the circle centred at A with radius 5 and on the circle centred at B with radius 5, so both distances are 5 by the definition of a circle.
        - |
          PM = 3 happens to be true (by the Pythagorean theorem, 3-4-5), but it is a computed consequence, not a direct reading of the definition.
      answer: 2

    - slug: geo-u01-w01-q08
      type: multiple_choice
      topic_code: "1.3"
      source: "IM Geometry, Unit 1, Lesson 3"
      points: 1
      prompt: |
        Point P satisfies PA = PB for two fixed points A and B. Which of the following must be true?
      options:
        - "P is the midpoint of AB"
        - "P lies on the perpendicular bisector of AB"
        - "P lies on the circle with diameter AB"
        - "P lies on line AB"
      option_explanations:
        - |
          The midpoint is one point equidistant from A and B, but there are infinitely many others, all on the perpendicular bisector.
        - |
          Correct. Every point equidistant from the endpoints of a segment lies on its perpendicular bisector; the midpoint is just the one on AB itself.
        - |
          Points on the circle with diameter AB are generally at different distances from A and B; only the two "top and bottom" points are equidistant.
        - |
          The only point on line AB equidistant from A and B is the midpoint; most equidistant points are off the line.
      answer: 1

    - slug: geo-u01-w01-q09
      type: multiple_choice
      topic_code: "1.4"
      source: "IM Geometry, Unit 1, Lesson 4"
      points: 1
      prompt: |
        In the construction of an equilateral triangle on segment AB, why is BC = AB?
      options:
        - "Because BC is the perpendicular bisector of AB"
        - "Because C lies on the circle centred at A with radius AB"
        - "Because C was chosen to make the triangle look equilateral"
        - "Because C lies on the circle centred at B with radius AB"
      option_explanations:
        - |
          BC is a side of the triangle, not a perpendicular bisector; the bisector of AB passes through C but is the line CD through both crossing points.
        - |
          The circle centred at A tells you AC = AB, not BC = AB. Both facts are needed, one from each circle.
        - |
          Constructions never rely on how a figure looks; C is determined by where two circles cross.
        - |
          Correct. C is a crossing point of the two circles; the one centred at B has radius AB, so BC = AB by the definition of a circle.
      answer: 3

    - slug: geo-u01-w01-q10
      type: multiple_choice
      topic_code: "1.4"
      source: "IM Geometry, Unit 1, Lesson 4"
      points: 1
      prompt: |
        Circles of radius AB centred at A and at B cross at C and D. Which figure is quadrilateral ACBD?
      options:
        - "A square, because the diagonals are perpendicular"
        - "A kite that is not a rhombus, because AC ≠ BC"
        - "A rhombus, because all four sides equal AB"
        - "A rectangle, because it has four right angles"
      option_explanations:
        - |
          The diagonals are perpendicular, but a square also needs right angles at the vertices; here the angles at C and D are 60° and at A and B are 120°.
        - |
          AC = BC = AB, since C is on both circles, so the sides are all equal and the kite is in fact a rhombus.
        - |
          Correct. AC = AD = AB (circle at A) and BC = BD = AB (circle at B), so all four sides are congruent and the figure is a rhombus made of two equilateral triangles.
        - |
          There are no right angles at the vertices; the angles are 60° and 120°.
      answer: 2

    - slug: geo-u01-w01-q11
      type: multiple_choice
      topic_code: "1.4"
      source: "general knowledge"
      points: 1
      prompt: |
        A regular hexagon is constructed by stepping a compass of fixed opening around a circle of radius 6. What is the perimeter of the hexagon, and why?
      options:
        - "36, because each side of the hexagon equals the radius"
        - "12π, because the hexagon has the same perimeter as the circle"
        - "36, because the perimeter of a hexagon is always 6 times its radius"
        - "18, because each side is half the radius"
      option_explanations:
        - |
          Correct. Each step marks a chord equal to the compass opening, which is the radius 6, so the six sides total 36.
        - |
          The circle's circumference is 12π ≈ 37.7, slightly longer than the hexagon's 36; the hexagon is inside the circle.
        - |
          The perimeter is 36, but the reason given is wrong: it is true only for a regular hexagon inscribed in the circle, and it holds because each side equals the radius.
        - |
          Each side equals the full radius, not half of it, because the compass opening never changed from 6.
      answer: 0

    - slug: geo-u01-w01-q12
      type: multi_select
      topic_code: "1.3"
      source: "IM Geometry, Unit 1, Lesson 3"
      points: 2
      partial_credit: true
      prompt: |
        Figure description: segment AB. Circles of equal radius centred at A and at B cross at P and Q. Line PQ meets AB at M. Which statements are true? Select all that apply.
      options:
        - "AM = MB"
        - "QA = QB"
        - "PA = AM"
        - "PM = MQ"
        - "PA = PB"
      option_explanations:
        - |
          True: PQ is the perpendicular bisector of AB, so it passes through the midpoint M.
        - |
          True: the same argument applies to Q, the other crossing point.
        - |
          False in general: PA is the common radius and AM is half of AB; they are equal only for one special radius.
        - |
          True: the figure is symmetric across line AB, so the two crossing points are equally far from M.
        - |
          True: P lies on both circles, which have the same radius, so its distances to the two centres are equal.
      answer: [0, 1, 3, 4]

    - slug: geo-u01-w01-q13
      type: multi_select
      topic_code: "1.2"
      source: "IM Geometry, Unit 1, Lesson 2"
      points: 2
      partial_credit: true
      prompt: |
        In the six-petal daisy pattern (circle centre O, radius r, six points A through F spaced around it), which figures with all sides equal to r can be found? Select all that apply.
      options:
        - "Hexagon ABCDEF"
        - "Triangle OAB"
        - "Triangle ACE"
        - "Quadrilateral ABDE"
        - "Quadrilateral OABC"
      option_explanations:
        - |
          Yes: each side is a chord stepped off with the compass at opening r.
        - |
          Yes: OA and OB are radii of the central circle and AB equals the radius by construction, so OAB is equilateral with side r.
        - |
          No: ACE joins every second point, and its sides are longer than r (each is r√3), so it is equilateral but not with side r.
        - |
          No: ABDE is a rectangle whose sides AB and DE are r but whose sides BD and EA are 2r (diameters).
        - |
          Yes: two adjacent equilateral triangles OAB and OBC share side OB; the outer sides OA, AB, BC, CO are all r, so OABC is a rhombus.
      answer: [0, 1, 4]

    - slug: geo-u01-w01-q14
      type: true_false
      topic_code: "1.1"
      source: "IM Geometry, Unit 1, Lesson 1"
      points: 1
      prompt: |
        True or false: in a compass-and-straightedge construction, two segments can be shown to be congruent by showing that each is a radius of the same circle.
      answer: true
      explanation: |
        True. By the definition of a circle every radius has the same length, so two radii of one circle are congruent. This is the basic justification used in every construction.

    - slug: geo-u01-w01-q15
      type: true_false
      topic_code: "1.3"
      source: "IM Geometry, Unit 1, Lesson 3"
      points: 1
      prompt: |
        True or false: when constructing the perpendicular bisector of AB, the radius of the two circles must be exactly AB.
      answer: false
      explanation: |
        False. Any common radius greater than half of AB works. Using AB is convenient because the compass is already set to it, but the argument only needs the two radii to be equal and the circles to cross.

    - slug: geo-u01-w01-q16
      type: fill_blank
      topic_code: "1.3"
      source: "IM Geometry, Unit 1, Lesson 3"
      points: 1
      prompt: |
        The set of all points in a plane that are the same distance from two points A and B is a line called the ____ of segment AB.
      answer: ["perpendicular bisector", "perpendicular bisector line"]
      explanation: |
        The perpendicular bisector passes through the midpoint of AB at a right angle, and it is exactly the set of points equidistant from A and B. The construction finds two such points (the circle crossings) and joins them.

    - slug: geo-u01-w01-q17
      type: fill_blank
      topic_code: "1.4"
      source: "IM Geometry, Unit 1, Lesson 4"
      points: 1
      prompt: |
        A triangle whose three sides are all congruent is called an ____ triangle.
      answer: ["equilateral", "equilateral triangle"]
      explanation: |
        Equilateral means "equal sides". Euclid's first proposition constructs one on any segment by drawing a circle centred at each endpoint through the other endpoint and joining a crossing point to both endpoints.

    - slug: geo-u01-w01-q18
      type: numeric
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
        Segment GH has length 14. Circles of radius 9 centred at G and at H cross at R and S, and line RS meets GH at M. What is the length GM? Give an exact value.
      answer: { value: 7, tolerance: 0 }
      explanation: |
        RS is the perpendicular bisector of GH (equal radii), so M is the midpoint and GM = 14 ÷ 2 = 7. The radius 9 affects where R and S are but not where M is.

    - slug: geo-u01-w01-q19
      type: numeric
      topic_code: "1.2"
      source: "general knowledge"
      points: 1
      prompt: |
        A regular hexagon is constructed inside a circle of radius 4.5 by stepping the compass around the circle. What is the perimeter of the hexagon? Give an exact decimal.
      answer: { value: 27, tolerance: 0 }
      explanation: |
        Each side of the hexagon equals the radius, 4.5, because each vertex was marked with the compass opened to the radius. Six sides give 6 × 4.5 = 27.

    - slug: geo-u01-w01-q20
      type: short_answer
      topic_code: "1.1"
      source: "IM Geometry, Unit 1, Lesson 1"
      points: 3
      prompt: |
        You are given segment AB and a point P not on line AB. Answer (a), (b) and (c).

        (a) Describe how to construct a point Q so that PQ = AB, using only a compass and straightedge.
        (b) State the definition of a circle.
        (c) Use the definition to explain why your Q satisfies PQ = AB.
      answer: |
        (a) Open the compass to AB (point on A, pencil on B). Keeping that opening, place the point on P and draw a circle (or an arc). Choose any point Q on that circle. (b) A circle is the set of all points in the plane at a fixed distance, the radius, from a fixed point, the centre. (c) Q is on the circle centred at P whose radius is AB, so by the definition the distance from P to Q is the radius, which is AB.
      explanation: |
        1 point for (a): a circle centred at P with radius copied from AB, Q on it (a ray through P is optional). 1 point for (b): fixed distance from a fixed point, with "all points" or "set of points". 1 point for (c): explicitly links Q being on the circle to PQ equalling the radius AB; "the compass measured it" earns nothing.

    - slug: geo-u01-w01-q21
