      prompt: |
        Figure description: segment AB. A circle centred at A passes through B, and a circle centred at B passes through A. The circles cross at C above AB and at D below AB. Answer (a), (b) and (c).

        (a) Explain why AC = AB.
        (b) Explain why triangle ABD is equilateral.
        (c) Name a line in the figure that is the perpendicular bisector of AB, and explain why.
      answer: |
        (a) C lies on the circle centred at A that passes through B, so AC and AB are both radii of that circle and AC = AB. (b) AD = AB because D is on the circle centred at A, and BD = BA because D is on the circle centred at B; so AB = BD = DA and triangle ABD has three congruent sides. (c) Line CD. C and D are each equidistant from A and B (CA = CB = AB and DA = DB = AB), and the set of points equidistant from A and B is the perpendicular bisector of AB, so the line through C and D is that bisector.
      explanation: |
        1 point for (a): both radii of the circle centred at A. 1 point for (b): both AD = AB and BD = AB, each tied to the correct circle. 1 point for (c): line CD, justified by C and D each being equidistant from A and B; naming CD without the equidistance reason earns half.

    - slug: geo-u01-w01-q22
      type: long_answer
      topic_code: "1.2"
      source: "IM Geometry, Unit 1, Lesson 2"
      points: 6
      prompt: |
        A circle has centre O and radius 5. Point A is on the circle. Describe, as numbered compass-and-straightedge steps, how to construct a regular hexagon ABCDEF inscribed in the circle. Then prove that triangle OAB is equilateral and use that to explain why every side of the hexagon has length 5. Finish by stating the perimeter of the hexagon.
      answer: |
        Construction. 1. Open the compass to OA = 5. 2. With the point on A, draw an arc crossing the circle at B. 3. With the point on B and the same opening, draw an arc crossing the circle at a new point C. 4. Repeat from C to get D, from D to get E, from E to get F. 5. The arc from F passes through A, confirming the sixth point closes the pattern. 6. Join AB, BC, CD, DE, EF and FA with the straightedge.

        Proof that OAB is equilateral. OA = 5 and OB = 5 because A and B lie on the circle centred at O with radius 5. AB = 5 because B lies on the arc (circle) centred at A with radius 5. So OA = OB = AB and triangle OAB is equilateral.

        Every side. The same argument applies to OBC, OCD, ODE, OEF and OFA: each has two sides that are radii of the big circle and a third side marked with the compass at opening 5. So AB = BC = CD = DE = EF = FA = 5. Since the six vertices are all on the circle and the six sides are congruent, ABCDEF is a regular hexagon. Perimeter = 6 × 5 = 30.
      explanation: |
        Scoring (6 points): 2 points for a correct numbered construction (compass at the radius, stepping around, joining); 2 points for the equilateral proof citing both circles correctly (OA = OB as radii of the circle at O; AB as a radius of the circle at A); 1 point for extending the argument to all six sides; 1 point for the perimeter 30. Deduct 1 if any step relies on measuring or on "it looks equal".
