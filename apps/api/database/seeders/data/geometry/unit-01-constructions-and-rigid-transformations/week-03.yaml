      prompt: |
        Triangle DEF has D = (1, 2), E = (5, 2) and F = (3, 6). It is translated by the directed segment from A = (0, 0) to B = (−4, 3). Answer (a), (b) and (c).

        (a) Give the coordinates of D′, E′ and F′.
        (b) Show that D′E′ = DE.
        (c) Explain, using the definition of a translation, why segment FF′ is parallel to segment DD′ and congruent to it.
      answer: |
        (a) Every point moves by (−4, 3): D′ = (−3, 5), E′ = (1, 5), F′ = (−1, 9). (b) DE = 5 − 1 = 4 and D′E′ = 1 − (−3) = 4, so they are equal. (c) By definition, each segment joining a point to its image is parallel to AB, has length AB = √(16 + 9) = 5, and points the same way. So DD′ and FF′ are both parallel to AB and both of length 5, which makes them parallel and congruent to each other.
      explanation: |
        1 point for (a): all three images correct. 1 point for (b): both lengths computed as 4. 1 point for (c): cites the definition (each PP′ is a copy of AB), including the length 5 or "same length as AB" and the parallel direction.

    - slug: geo-u01-w03-q24
      type: long_answer
      topic_code: "1.11"
      source: "IM Geometry, Unit 1, Lesson 11"
      points: 6
      prompt: |
        Figure description: line m and a point P not on m. (1) Write the definition of the reflection of P across m. (2) Describe, as numbered compass-and-straightedge steps, how to construct P′, and explain why the point you construct satisfies the definition. (3) Triangle ABC has vertices A = (1, 1), B = (4, 1), C = (4, 3) and is reflected across the line y = −1. Give the image vertices and state two properties of triangle ABC that are preserved and one that is reversed.
      answer: |
        (1) The reflection of P across m is the point P′ such that m is the perpendicular bisector of PP′ (and points on m are their own reflections).

        (2) Construction: 1. Draw a circle centred at P with a radius large enough to cross m at two points X and Y. 2. With the same radius, draw a circle centred at X and a circle centred at Y. 3. They cross at P (already on both) and at a second point; call it P′. 4. Draw PP′ if required. Why it works: PX = PY (radii of the first circle) and P′X = P′Y (radii of the equal circles), so both P and P′ are equidistant from X and Y. The set of points equidistant from X and Y is the perpendicular bisector of XY, so line PP′ is perpendicular to XY, which is m; and by the symmetry of the construction X and Y are equidistant from P and P′, so m is the perpendicular bisector of PP′. That is the definition.

        (3) Reflecting across y = −1 keeps x and sends y to −2 − y. A′ = (1, −3), B′ = (4, −3), C′ = (4, −5). Preserved: all side lengths (AB = A′B′ = 3, BC = B′C′ = 2, AC = A′C′ = √13), all angle measures (the right angle at B is still a right angle at B′) and the area (3). Reversed: orientation, since A, B, C go counter-clockwise but A′, B′, C′ go clockwise.
      explanation: |
        Scoring (6 points): 1 for the definition with "perpendicular bisector of PP′"; 2 for a correct construction (circle at P crossing m twice, equal circles at the crossings); 1 for the justification that m is the perpendicular bisector of PP′ (both points equidistant from X and Y); 1 for the three image vertices; 1 for naming two preserved properties and orientation as the reversed one.
