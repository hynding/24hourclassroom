        (b) Find the point equidistant from all three warehouses.
        (c) Which warehouse serves a customer at (7, 3)? Show the distances.
      answer: |
        (a) The perpendicular bisector of AB is the vertical line x = 6; the perpendicular bisector of AC is the horizontal line y = 5. (b) The point on both bisectors is (6, 5). Check: its distance to A is √(36 + 25) = √61, to B is √(36 + 25) = √61, to C is √(36 + 25) = √61. (c) Distances from (7, 3): to A, √(49 + 9) = √58 ≈ 7.62; to B, √(25 + 9) = √34 ≈ 5.83; to C, √(49 + 49) = √98 ≈ 9.90. B is nearest. (Consistent with x = 7 > 6, B's side of the AB border.)
