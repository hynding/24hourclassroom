week: 3
unit: 1
title: "Closest Points, Rigid Motions, Reflections and Translations"
topics: ["1.9", "1.10", "1.11", "1.12"]
guide: guides/week-03.md
guide_description: |
  Perpendicular bisectors as borders between "closest to A" and "closest to B", then the shift from building
  figures to moving them. What a rigid transformation is and what it preserves; the precise definition of a
  reflection (the mirror is the perpendicular bisector of PP′) and of a translation (PP′ is a copy of the directed
  segment AB), how to construct each image, and how to recover the mirror line or the arrow from a point and its image.
flashcards_description: |
  28 cards on closest-point regions, the definition of a rigid transformation, reflections, translations, fixed
  points, orientation and transformation notation.

flashcards:
  - front: Border between "closer to A" and "closer to B" → which line
    back: |
      The perpendicular bisector of AB. Points on A's side are closer to A, points on B's side closer to B, and points on the line are equidistant. With three or more sites, each region is bounded by pieces of bisectors.
    topic_code: "1.9"
  - front: Point equidistant from three given points → where it is
    back: |
      Where the three perpendicular bisectors of the segments joining the points meet. They always pass through a single point when the three points are not collinear (the circumcentre, Unit 7).
    topic_code: "1.9"
  - front: Deciding which of several points a location is closest to → method
    back: |
      Either compute each distance (with the Pythagorean theorem on a grid) or draw the perpendicular bisectors and see which region the location falls in. The two methods must agree.
    topic_code: "1.9"
  - front: Transformation → definition
    back: |
      A rule that assigns to every point of the plane exactly one image point. Reflections, translations, rotations and dilations are transformations; so is a stretch.
    topic_code: "1.10"
  - front: Rigid transformation → definition
    back: |
      A transformation that preserves distance: for every pair of points, the distance between the images equals the distance between the originals. Also called a rigid motion or isometry.
    topic_code: "1.10"
  - front: What a rigid transformation preserves → list
    back: |
      Distances (by definition), and therefore angle measures, lines to lines, parallel lines to parallel lines, the order of points on a line, perimeters and areas.
    topic_code: "1.10"
  - front: Three basic rigid transformations → names
    back: |
      Reflection (across a line), translation (by a directed segment) and rotation (about a point by an angle). Any sequence of these is also rigid.
    topic_code: "1.10"
  - front: Image and pre-image → meaning and notation
    back: |
      The pre-image is the original point or figure (P, triangle ABC); the image is the result (P′, triangle A′B′C′). Vertex labels correspond in order: A′ is the image of A.
    topic_code: "1.10"
  - front: Test for a non-rigid transformation → what to look for
    back: |
      Find one pair of points whose distance changes. For (x, y) → (2x, y), the points (0, 0) and (1, 0) are 1 apart but their images are 2 apart, so the transformation is not rigid.
    topic_code: "1.10"
  - front: Dilation versus rigid transformation → the key difference
    back: |
      A dilation preserves angle measures and sends lines to parallel lines, but it multiplies every distance by the scale factor, so it is rigid only when the factor is 1.
    topic_code: "1.10"
  - front: Reflection across line m → definition
    back: |
      Each point on m is fixed. Each point P not on m goes to the point P′ such that m is the perpendicular bisector of PP′: PP′ ⊥ m and the two are equidistant from m.
    topic_code: "1.11"
  - front: Constructing the reflection of P across m → steps
    back: |
      Draw a circle centred at P crossing m at X and Y. Draw equal circles centred at X and Y through P; their other crossing point is P′. (Equivalently: perpendicular from P to m, foot F, extend so FP′ = PF.)
    topic_code: "1.11"
  - front: Fixed points of a reflection → which points
    back: |
      Exactly the points on the line of reflection. Every other point moves to the other side of the line.
    topic_code: "1.11"
  - front: Reflecting twice across the same line → result
    back: |
      Every point returns to where it started: the composition is the identity. A reflection is its own inverse.
    topic_code: "1.11"
  - front: Orientation under a reflection → what happens
    back: |
      It reverses. If the vertices A, B, C read clockwise, the images A′, B′, C′ read counter-clockwise. Translations and rotations keep orientation.
    topic_code: "1.11"
  - front: Finding the mirror line from P and P′ → method
    back: |
      Construct the perpendicular bisector of PP′: it passes through the midpoint of PP′ at right angles. On a grid, find the midpoint and the direction perpendicular to PP′.
    topic_code: "1.11"
  - front: Reflection across the x-axis → coordinate rule
    back: |
      (x, y) → (x, −y). The x-axis is the perpendicular bisector of the segment from (x, y) to (x, −y). Across the y-axis: (x, y) → (−x, y).
    topic_code: "1.11"
  - front: Reflection across the vertical line x = a → coordinate rule
    back: |
      (x, y) → (2a − x, y). The midpoint of x and 2a − x is a, and the segment is horizontal, so the line x = a is its perpendicular bisector. Across y = b: (x, y) → (x, 2b − y).
    topic_code: "1.11"
  - front: Distance from P to its reflection P′ → formula
    back: |
      Twice the distance from P to the mirror line, because the foot F is the midpoint of PP′ and PF equals the distance from P to the line.
    topic_code: "1.11"
  - front: Translation by directed segment AB → definition
    back: |
      Sends every point P to P′ such that PP′ is parallel to AB, PP′ = AB, and P′ is in the direction from A to B. Equivalently, ABP′P is a parallelogram when P is off line AB.
    topic_code: "1.12"
  - front: Directed line segment → meaning
    back: |
      A segment with a chosen direction, drawn as an arrow from A to B; the same arrow drawn from any other starting point describes the same translation. Also called a vector.
    topic_code: "1.12"
  - front: Constructing the translation of P by AB → steps
    back: |
      Construct the line through P parallel to AB (double perpendicular or rhombus). With the compass set to AB, mark P′ on that line on the same side as B is from A. ABP′P is then a parallelogram.
    topic_code: "1.12"
  - front: Fixed points of a translation → which points
    back: |
      None, unless the directed segment has length zero (the identity). Every point moves the full distance AB, so no point can coincide with its image.
    topic_code: "1.12"
  - front: Translation on a coordinate grid → rule
    back: |
      If A = (a₁, a₂) and B = (b₁, b₂), every point moves by (b₁ − a₁, b₂ − a₂): (x, y) → (x + b₁ − a₁, y + b₂ − a₂). Find the arrow once, apply it to every vertex.
    topic_code: "1.12"
  - front: Identifying a translation from one point and its image → method
    back: |
      Subtract: the arrow is (x′ − x, y′ − y). Apply the same arrow to every other point. Check that all segments PP′ are parallel and congruent.
    topic_code: "1.12"
  - front: Lines under a translation → what happens to them
    back: |
      Every line goes to a line parallel to it (or to itself if the line is parallel to the translation direction). Orientation is preserved.
    topic_code: "1.12"
  - front: Undoing a translation → which transformation
    back: |
      The translation by the reversed arrow, from B to A. Applying A→B then B→A returns every point to its start.
    topic_code: "1.12"
  - front: Which transformation when → "the figure flipped and a vertex on the line stayed put"
    back: |
      A reflection. Points on the mirror are fixed, orientation reverses, and each other vertex and its image are joined by a segment the mirror bisects at right angles.
    topic_code: "1.11"

quiz:
  description: |
    24 questions · about 40 minutes · mostly on this week (topics 1.9 to 1.12: closest-point regions, rigid
    transformations, reflections and translations) with review of weeks 1 and 2 (circles, perpendicular bisectors,
    angle bisectors, parallels and squares). Multiple choice, select-all, true/false and numeric items are graded at
    once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by
    your teacher against the scoring notes.
  questions:
    - slug: geo-u01-w03-q01
      type: multiple_choice
      topic_code: "1.9"
      source: "IM Geometry, Unit 1, Lesson 9"
      points: 1
      prompt: |
        Two fire stations are at A = (0, 0) and B = (10, 0), with distances in km. Which line is the border between the area served by A and the area served by B, if every location is served by the nearer station?
      options:
        - "The line through A and B"
        - "The vertical line x = 5"
        - "The vertical line x = 10"
        - "The circle with diameter AB"
      option_explanations:
        - |
          Points on line AB are at all sorts of distances from A and B; the line through the two stations is not a border between their regions.
        - |
          Correct. x = 5 is the perpendicular bisector of AB: every point on it is equidistant from A and B, points to its left are nearer A, points to its right nearer B.
        - |
          x = 10 passes through B itself; points just left of it are far closer to B than to A.
        - |
          A circle does not separate "closer to A" from "closer to B"; the set of equidistant points is a line.
      answer: 1

    - slug: geo-u01-w03-q02
      type: multiple_choice
      topic_code: "1.9"
      source: "IM Geometry, Unit 1, Lesson 9"
      points: 1
      prompt: |
        Three shops are at A = (0, 0), B = (8, 0) and C = (0, 6). A customer is at H = (5, 4). Which shop is nearest?
      options:
        - "A, at distance √41"
        - "B, at distance 5"
        - "C, at distance √29"
        - "B and C are tied"
      option_explanations:
        - |
          HA = √(25 + 16) = √41 ≈ 6.40, the largest of the three distances.
        - |
          Correct. HB = √((8 − 5)² + 4²) = √(9 + 16) = 5, smaller than HC = √29 ≈ 5.39 and HA ≈ 6.40.
        - |
          HC = √(25 + 4) = √29 ≈ 5.39, slightly more than the 5 to B.
        - |
          5 and √29 are not equal; H is on B's side of the perpendicular bisector of BC.
      answer: 1

    - slug: geo-u01-w03-q03
      type: multiple_choice
      topic_code: "1.10"
      source: "IM Geometry, Unit 1, Lesson 10"
      points: 1
      prompt: |
        Which statement is the definition of a rigid transformation?
      options:
        - "A transformation that moves a figure without changing its position"
        - "A transformation that preserves the distance between every pair of points"
        - "A transformation that preserves angle measures"
        - "A transformation that can be done with a compass"
      option_explanations:
        - |
          Rigid transformations generally do change position; what they keep is size and shape.
        - |
          Correct. Preserving all distances is the definition; preserving angles, lines and areas follows from it.
        - |
          Preserving angles is a consequence, not the definition, and dilations preserve angles without being rigid.
        - |
          Compass use is about constructions, not a property of transformations.
      answer: 1

    - slug: geo-u01-w03-q04
      type: multiple_choice
      topic_code: "1.4"
      source: "IM Geometry, Unit 1, Lesson 4"
      points: 1
      prompt: |
        Review. A regular hexagon is inscribed in a circle of radius 7 by stepping a compass around the circle. Which statement about the hexagon is justified by the construction alone, without any angle measurement?
      options:
        - "Each side is 7, because each vertex was marked with the compass opened to the radius"
        - "Each interior angle is 120°, because the protractor says so"
        - "Each side is 7, because the hexagon has the same perimeter as the circle"
        - "Each side is 3.5, because the compass was opened to half the radius"
      option_explanations:
        - |
          Correct. Every side is a chord whose endpoints are the compass opening apart, and that opening is the radius 7.
        - |
          The angles are indeed 120°, but a protractor reading is a measurement, not a construction argument.
        - |
          The hexagon's perimeter (42) is less than the circumference (14π ≈ 44), and perimeter does not determine individual sides anyway.
        - |
          The compass is kept at the full radius; halving it would not land back at the start after six steps.
      answer: 0

    - slug: geo-u01-w03-q05
      type: multiple_choice
      topic_code: "1.11"
      source: "IM Geometry, Unit 1, Lesson 11"
      points: 1
      prompt: |
        Which statement is the definition of the reflection of a point P across a line m (for P not on m)?
      options:
        - "P′ is the point on the other side of m that is the same distance from m as P"
        - "P′ is the point such that m is the perpendicular bisector of segment PP′"
        - "P′ is the point such that PP′ is parallel to m"
        - "P′ is the point on m closest to P"
      option_explanations:
        - |
          "Same distance from m" is necessary but not sufficient: many points on the other side are at that distance. The segment must also be perpendicular to m.
        - |
          Correct. This fixes both requirements: PP′ ⊥ m and the midpoint of PP′ is on m.
        - |
          A segment parallel to m never crosses m; the image must be on the other side.
        - |
          That point is the foot of the perpendicular, the midpoint of PP′, not the reflection.
      answer: 1

    - slug: geo-u01-w03-q06
      type: multiple_choice
      topic_code: "1.11"
      source: "IM Geometry, Unit 1, Lesson 11"
      points: 1
      prompt: |
        Point P = (1, 6) is reflected across the vertical line x = 4. What are the coordinates of P′?
      options:
        - "(7, 6)"
        - "(4, 6)"
        - "(1, 2)"
        - "(−1, 6)"
      option_explanations:
        - |
          Correct. P is 3 units left of x = 4, so P′ is 3 units right of it, at x = 7; the y-coordinate is unchanged because PP′ is horizontal.
        - |
          (4, 6) is the foot of the perpendicular, the midpoint of PP′, not the image.
        - |
          Changing y would be a reflection across a horizontal line, not across x = 4.
        - |
          (−1, 6) is the reflection across the y-axis (x = 0), not across x = 4.
      answer: 0

    - slug: geo-u01-w03-q07
      type: multiple_choice
      topic_code: "1.11"
      source: "IM Geometry, Unit 1, Lesson 11"
      points: 1
      prompt: |
        A reflection sends A = (2, 1) to A′ = (2, 9). What is the line of reflection?
      options:
        - "The vertical line x = 2"
        - "The horizontal line y = 5"
        - "The horizontal line y = 4"
        - "The line y = x"
      option_explanations:
        - |
          Both points lie on x = 2, so that line contains AA′ rather than bisecting it at right angles.
        - |
          Correct. The midpoint of AA′ is (2, 5) and AA′ is vertical, so its perpendicular bisector is the horizontal line y = 5.
        - |
          y = 4 is perpendicular to AA′ but does not pass through the midpoint (2, 5).
        - |
          y = x neither bisects AA′ nor is perpendicular to it.
      answer: 1

    - slug: geo-u01-w03-q08
      type: multiple_choice
      topic_code: "1.12"
      source: "IM Geometry, Unit 1, Lesson 12"
      points: 1
      prompt: |
        Which statement is the definition of the translation by the directed line segment from A to B?
      options:
        - "Every point moves a distance AB in some direction"
        - "Every point P goes to the point P′ such that PP′ is parallel to AB, equal in length to AB and in the same direction"
        - "Every point P goes to the point P′ such that AB is the perpendicular bisector of PP′"
        - "Every point moves along line AB"
      option_explanations:
        - |
          Direction is part of the definition; all points must move in the same direction, the one from A to B.
        - |
          Correct. PP′ is a copy of the arrow AB drawn from P, so ABP′P is a parallelogram whenever P is off line AB.
        - |
          That is the definition of a reflection across line AB, not a translation.
        - |
          Only points already on line AB move along it; every other point moves along a line parallel to AB.
      answer: 1

    - slug: geo-u01-w03-q09
      type: multiple_choice
      topic_code: "1.12"
      source: "IM Geometry, Unit 1, Lesson 12"
      points: 1
      prompt: |
        A translation sends (3, −1) to (−2, 4). Where does it send (6, 0)?
      options:
        - "(1, 5)"
        - "(11, −5)"
        - "(−5, 5)"
        - "(1, −5)"
      option_explanations:
        - |
          Correct. The arrow is (−2 − 3, 4 − (−1)) = (−5, 5); applied to (6, 0) it gives (1, 5).
        - |
          (11, −5) uses the reversed arrow (5, −5), which is the translation that undoes this one.
        - |
          (−5, 5) is the arrow itself, not the image of (6, 0).
        - |
          The second coordinate must increase by 5, not decrease.
      answer: 0

    - slug: geo-u01-w03-q10
      type: multiple_choice
      topic_code: "1.7"
      source: "IM Geometry, Unit 1, Lesson 7"
      points: 1
      prompt: |
        Review. A square is constructed on segment AB by raising perpendiculars at A and B and marking D and C with AD = BC = AB. Which fact is needed to conclude that DC is parallel to AB?
      options:
        - "AD and BC are both perpendicular to AB, so AD ∥ BC, and with AD = BC the figure is a parallelogram"
        - "AD = AB, so triangle ABD is isosceles"
        - "The diagonals AC and BD are congruent"
        - "DC was drawn with the straightedge, so it is straight"
      option_explanations:
        - |
          Correct. One pair of opposite sides both parallel and congruent makes ABCD a parallelogram, whose other pair of sides, DC and AB, is then parallel too.
        - |
          True but irrelevant: an isosceles triangle on AB says nothing about the direction of DC.
        - |
          Congruent diagonals are a property of the finished rectangle, not a given that can be used to prove DC ∥ AB.
        - |
          Straightness is not parallelism; every side is straight.
      answer: 0

    - slug: geo-u01-w03-q11
      type: multiple_choice
      topic_code: "1.5"
      source: "IM Geometry, Unit 1, Lesson 5"
      points: 1
      prompt: |
        Review. To construct the reflection of P across m, you draw a circle centred at P crossing m at X and Y, then equal circles at X and Y through P. Why does the second crossing point of those circles equal the reflection P′?
      options:
        - "Because the two circles at X and Y have radius PX = PY, so both P and P′ are equidistant from X and Y, and m (through X and Y) is the perpendicular bisector of PP′"
        - "Because P′ is on the circle centred at P"
        - "Because XY is a diameter of the circle centred at P"
        - "Because the circles at X and Y are tangent to m"
      option_explanations:
        - |
          Correct. X and Y are both equidistant from P and P′, so line XY, which is m, is the perpendicular bisector of PP′, and that is the definition of the reflection.
        - |
          P′ is at distance PX from X and from Y, not from P; it is not on the circle centred at P in general.
        - |
          XY is a chord of that circle, a diameter only if P lies on m, in which case P is fixed.
        - |
          The circles cross m at X and Y rather than touching it; tangency plays no part.
      answer: 0

    - slug: geo-u01-w03-q12
      type: multiple_choice
      topic_code: "1.6"
      source: "IM Geometry, Unit 1, Lesson 6"
      points: 1
      prompt: |
        Review. In constructing a translation, you need the line through P parallel to AB. Which construction gives it?
      options:
        - "The perpendicular bisector of AB"
        - "The perpendicular to AB through P, then the perpendicular to that line through P"
        - "The angle bisector of ∠APB"
        - "The circle centred at P with radius AB"
      option_explanations:
        - |
          The perpendicular bisector of AB is perpendicular to AB, not parallel, and need not pass through P.
        - |
          Correct. Two lines perpendicular to the same line are parallel, so the second perpendicular through P is parallel to AB.
        - |
          The bisector of ∠APB passes through P but is not parallel to AB in general.
        - |
          A circle is used afterwards to mark the distance AB along the parallel, but it is not the parallel line itself.
      answer: 1

    - slug: geo-u01-w03-q13
      type: multiple_choice
      topic_code: "1.3"
      source: "IM Geometry, Unit 1, Lesson 3"
      points: 1
      prompt: |
        Review. A map shows two wells, W₁ and W₂. A farmer wants to fence the land that is closer to W₁ than to W₂. The fence should run along which line?
      options:
        - "The line through W₁ and W₂"
        - "The perpendicular bisector of the segment joining the wells"
        - "A circle centred at W₁"
        - "The perpendicular to W₁W₂ through W₁"
      option_explanations:
        - |
          Points along that line are closer to whichever well they are nearer; it does not separate the two regions.
        - |
          Correct. The perpendicular bisector is the set of points equidistant from the wells; one side is nearer W₁, the other nearer W₂.
        - |
          A circle around W₁ bounds points within a fixed distance of W₁, not points nearer W₁ than W₂.
        - |
          A perpendicular through W₁ puts W₁ itself on the border, which is wrong since W₁ is certainly closest to itself.
      answer: 1

    - slug: geo-u01-w03-q14
      type: multi_select
      topic_code: "1.11"
      source: "IM Geometry, Unit 1, Lesson 11"
      points: 2
      partial_credit: true
      prompt: |
        Triangle ABC is reflected across line m to triangle A′B′C′, where vertex B lies on m. Which statements must be true? Select all that apply.
      options:
        - "B′ = B"
        - "A′C′ = AC"
        - "m is the perpendicular bisector of AA′"
        - "The orientation of A′B′C′ is the same as that of ABC"
        - "∠A′B′C′ = ∠ABC"
      option_explanations:
        - |
          True: every point on the line of reflection is fixed.
        - |
          True: reflections are rigid, so every distance is preserved.
        - |
          True: that is the definition of the reflection of A (A is not on m, otherwise it would be fixed).
        - |
          False: a reflection reverses orientation; clockwise becomes counter-clockwise.
        - |
          True: rigid transformations preserve angle measures.
      answer: [0, 1, 2, 4]

    - slug: geo-u01-w03-q15
      type: multi_select
      topic_code: "1.12"
      source: "IM Geometry, Unit 1, Lesson 12"
      points: 2
      partial_credit: true
      prompt: |
        Quadrilateral PQRS is translated by the directed segment AB (with A ≠ B) to P′Q′R′S′. Which statements must be true? Select all that apply.
      options:
        - "PP′ = QQ′ = RR′ = SS′ = AB"
        - "Segments PP′ and QQ′ are parallel"
        - "The translation has exactly one fixed point"
        - "Line P′Q′ is parallel to line PQ or is the same line"
        - "P′Q′R′S′ has the same area as PQRS"
      option_explanations:
        - |
          True: every point moves the same distance, the length of AB.
        - |
          True: every point moves in the same direction, so all the segments joining points to their images are parallel.
        - |
          False: a translation by a nonzero arrow has no fixed points at all.
        - |
          True: a translation sends each line to a parallel line, or to itself if the line already runs in the arrow's direction.
        - |
          True: translations are rigid, and rigid transformations preserve area.
      answer: [0, 1, 3, 4]

    - slug: geo-u01-w03-q16
      type: true_false
      topic_code: "1.10"
      source: "IM Geometry, Unit 1, Lesson 10"
      points: 1
      prompt: |
        True or false: the transformation that sends every point (x, y) to (x + 2, 3y) is a rigid transformation.
      answer: false
      explanation: |
        False. The points (0, 0) and (0, 1) are 1 apart, but their images (2, 0) and (2, 3) are 3 apart. A rigid transformation must preserve every distance, and this one stretches vertical distances by 3.

    - slug: geo-u01-w03-q17
      type: true_false
      topic_code: "1.2"
      source: "IM Geometry, Unit 1, Lesson 2"
      points: 1
      prompt: |
        Review. True or false: in the six-petal daisy pattern on a circle of radius r, the quadrilateral formed by the centre O and three consecutive points A, B, C is a rhombus with side r.
      answer: true
      explanation: |
        True. OA = OB = OC = r as radii of the central circle, and AB = BC = r because each point was marked with the compass set to r. Four congruent sides make OABC a rhombus.

    - slug: geo-u01-w03-q18
      type: fill_blank
      topic_code: "1.10"
      source: "IM Geometry, Unit 1, Lesson 10"
      points: 1
      prompt: |
        A transformation that preserves the distance between every pair of points is called a ____ transformation.
      answer: ["rigid", "rigid motion", "isometry", "distance-preserving"]
      explanation: |
        Rigid transformations (reflections, translations, rotations and their compositions) keep distances, and therefore angles, lines and areas, unchanged. A dilation is not rigid.

    - slug: geo-u01-w03-q19
      type: fill_blank
      topic_code: "1.11"
      source: "IM Geometry, Unit 1, Lesson 11"
      points: 1
      prompt: |
        The reflection of point P across line m is the point P′ such that m is the ____ of segment PP′.
      answer: ["perpendicular bisector"]
      explanation: |
        The mirror line must cross PP′ at its midpoint and at a right angle. That single condition is the definition and also the recipe for constructing P′.

    - slug: geo-u01-w03-q20
      type: numeric
      topic_code: "1.11"
      source: "general knowledge"
      points: 1
      prompt: |
        Point P is 3.5 units from line m. P′ is the reflection of P across m. What is the distance PP′? Give an exact decimal.
      answer: { value: 7, tolerance: 0 }
      explanation: |
        The foot F of the perpendicular from P to m is the midpoint of PP′, and PF is the distance from P to m, 3.5. So PP′ = 2 × 3.5 = 7.

    - slug: geo-u01-w03-q21
      type: numeric
      topic_code: "1.7"
      source: "general knowledge"
      points: 1
      prompt: |
