        (b) Find the value of x that makes ℓ ∥ m, and state which theorem (or converse) justifies it.
        (c) For that value of x, find y and explain how you know.
      answer: |
        (a) They are alternate interior angles: both are between the lines and on opposite sides of t. (b) By the converse of the alternate interior angle theorem, ℓ ∥ m exactly when they are equal: 2x + 14 = 3x − 22, so x = 36, and each angle is 86°. (c) The y° angle and the (3x − 22)° angle are a linear pair at Q (upper-left and upper-right share the ray along m), so y = 180 − 86 = 94. (Also y is co-interior with the 86° angle at P, confirming 94°.)
      explanation: |
        1 point for (a): alternate interior. 1 point for (b): x = 36 with the converse named (accept "alternate interior angles equal means parallel"). 1 point for (c): y = 94 with a linear-pair or co-interior justification.

