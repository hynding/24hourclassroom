      prompt: |
        Figure description: triangle ABC with ∠A = 40° and ∠B = 65°. Side AC is extended beyond C to point D. Answer (a), (b) and (c).

        (a) Find ∠ACB and state the theorem used.
        (b) Find the exterior angle ∠BCD in two different ways.
        (c) Explain why the line through C parallel to AB would make angles of 40° and 65° at C on either side of ∠ACB, and name the theorem that guarantees this.
      answer: |
        (a) ∠ACB = 180° − 40° − 65° = 75°, by the triangle angle-sum theorem. (b) Linear pair: ∠BCD = 180° − 75° = 105°. Exterior angle theorem: ∠BCD = ∠A + ∠B = 40° + 65° = 105°. (c) With the line through C parallel to AB, segment AC is a transversal, so the angle at C between the parallel line and CA equals ∠A = 40° (alternate interior angles); segment BC is another transversal, so the angle between CB and the parallel line equals ∠B = 65°. Together with ∠ACB = 75° they fill the straight angle at C: 40 + 75 + 65 = 180. The theorem is the alternate interior angle theorem (for parallel lines).
      explanation: |
        1 point for (a): 75° and the angle-sum theorem. 1 point for (b): 105° by both the linear pair and the exterior angle theorem. 1 point for (c): both angles identified as alternate interior angles with the correct transversals, and the theorem named.

    - slug: geo-u01-w06-q25
      type: long_answer
      topic_code: "1.21"
      source: "IM Geometry, Unit 1, Lesson 21"
      points: 6
      prompt: |
        Write a complete proof that the interior angles of a triangle sum to 180°. Begin with triangle ABC, state the auxiliary line you add and why you are allowed to add it, label the angles at C clearly, justify each equality with the name of a theorem or definition, and conclude. Then use the result to prove the exterior angle theorem: if side AB is extended beyond B to point F, then ∠CBF = ∠A + ∠C.
      answer: |
        Proof of the angle sum. Let ABC be any triangle. Through C draw the line ℓ parallel to AB; this is allowed because through a point not on a line there is exactly one parallel (parallel postulate), and it can be constructed with two perpendiculars. Choose D on ℓ on the same side of line BC as A, and E on ℓ on the other side, so that D, C, E are collinear with C between them.

        1. ∠DCA = ∠CAB. Reason: ℓ ∥ AB and AC is a transversal; ∠DCA and ∠CAB are alternate interior angles, which are congruent for parallel lines.
        2. ∠ECB = ∠CBA. Reason: ℓ ∥ AB and BC is a transversal; ∠ECB and ∠CBA are alternate interior angles.
        3. ∠DCA + ∠ACB + ∠BCE = 180°. Reason: D, C, E are collinear, so the three adjacent angles at C make a straight angle.
        4. Substituting 1 and 2 into 3: ∠CAB + ∠ACB + ∠CBA = 180°. This is the sum of the three angles of triangle ABC. ∎

        Proof of the exterior angle theorem. A, B, F are collinear with B between A and F, so ∠CBA and ∠CBF form a linear pair: ∠CBA + ∠CBF = 180°. By the angle sum, ∠A + ∠CBA + ∠C = 180°. The two left-hand sides are equal, so ∠CBA + ∠CBF = ∠A + ∠CBA + ∠C. Subtracting ∠CBA from both sides gives ∠CBF = ∠A + ∠C. ∎
      explanation: |
        Scoring (6 points): 1 for the auxiliary parallel line through C with the parallel postulate (or construction) as justification; 2 for the two alternate interior angle equalities, each with the correct transversal named; 1 for the straight-angle step and the substitution giving 180°; 1 for the linear-pair equation in the exterior angle proof; 1 for the subtraction yielding ∠CBF = ∠A + ∠C. Deduct 1 if any step is justified by measurement or by "it looks like".
