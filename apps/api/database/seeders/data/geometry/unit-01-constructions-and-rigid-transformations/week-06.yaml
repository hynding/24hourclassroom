week: 6
unit: 1
title: "Parallel Lines, Transversals and the 180° Triangle"
topics: ["1.20", "1.21", "1.22"]
guide: guides/week-06.md
guide_description: |
  The names of the angle pairs at a transversal, the proof by a 180° rotation that alternate interior angles of
  parallel lines are congruent, and the corollaries for corresponding and co-interior angles. Then the proof that
  a triangle's angles sum to 180° using an auxiliary parallel line, the exterior angle theorem, the angle sums of
  polygons, and a closing lesson on designing and justifying constructions and tilings.
flashcards_description: |
  28 cards on transversal angle pairs, the alternate interior angle theorem and its proof, converses, the triangle
  angle sum and its proof, exterior angles, polygon angle sums and which regular polygons tile.

flashcards:
  - front: Transversal → definition
    back: |
      A line that crosses two other lines at two distinct points. It creates eight angles, four at each crossing, with names that apply whether or not the two lines are parallel.
    topic_code: "1.20"
  - front: Alternate interior angles → which pair
    back: |
      Two angles between the two lines (interior), on opposite sides of the transversal, one at each crossing. In the standard numbering with 1–4 at the top crossing and 5–8 at the bottom, the pairs are 3 & 6 and 4 & 5.
    topic_code: "1.20"
  - front: Corresponding angles → which pair
    back: |
      Two angles in the same position at the two crossings, such as both upper-left: pairs 1 & 5, 2 & 6, 3 & 7, 4 & 8. For parallel lines they are congruent.
    topic_code: "1.20"
  - front: Co-interior (same-side interior) angles → which pair and the parallel-line fact
    back: |
      Two interior angles on the same side of the transversal (3 & 5, 4 & 6). When the lines are parallel they are supplementary, summing to 180°.
    topic_code: "1.20"
  - front: Alternate exterior angles → which pair
    back: |
      Two angles outside the two lines on opposite sides of the transversal (1 & 8, 2 & 7). Congruent when the lines are parallel, by vertical angles plus alternate interior angles.
    topic_code: "1.20"
  - front: Alternate interior angle theorem → statement
    back: |
      If two parallel lines are cut by a transversal, each pair of alternate interior angles is congruent. The hypothesis "parallel" is essential.
    topic_code: "1.20"
  - front: Alternate interior angle theorem → proof by rotation
    back: |
      Rotate 180° about the midpoint M of the transversal segment PQ. P ↔ Q, the transversal maps to itself, and each parallel line maps to the line through the other crossing parallel to it, which by the parallel postulate is the other line. So each angle lands on its alternate interior partner.
    topic_code: "1.20"
  - front: Parallel postulate (uniqueness form) → statement and where it is used
    back: |
      Through a point not on a line there is exactly one line parallel to the given line. It is what lets the rotated image of ℓ be identified with m in the alternate interior angle proof, and what justifies the auxiliary line in the triangle proof.
    topic_code: "1.20"
  - front: Corresponding angles congruent → derived how
    back: |
      From alternate interior angles plus vertical angles: ∠1 = ∠4 (vertical), ∠4 = ∠5 (alternate interior), so ∠1 = ∠5.
    topic_code: "1.20"
  - front: Co-interior angles supplementary → derived how
    back: |
      ∠3 + ∠4 = 180° (linear pair) and ∠4 = ∠5 (alternate interior), so ∠3 + ∠5 = 180°.
    topic_code: "1.20"
  - front: Converse of the alternate interior angle theorem → statement
    back: |
      If a transversal makes a pair of congruent alternate interior angles with two lines, the lines are parallel. It is how parallelism is proved from angle measures.
    topic_code: "1.20"
  - front: Theorem versus converse → the distinction
    back: |
      "If parallel then congruent alternate interior angles" and "if congruent alternate interior angles then parallel" are different statements. Both are true here, but each needs its own proof and you must cite the one you are using.
    topic_code: "1.20"
  - front: All eight transversal angles when the lines are parallel → pattern
    back: |
      Only two measures occur, x and 180° − x. Angles that share a side are supplementary; angles that are vertical, corresponding or alternate are equal.
    topic_code: "1.20"
  - front: Triangle angle sum theorem → statement
    back: |
      The three interior angles of any triangle sum to 180°.
    topic_code: "1.21"
  - front: Triangle angle sum theorem → proof outline
    back: |
      Draw the line through C parallel to AB (auxiliary line). The angle on one side of C equals ∠A and the angle on the other side equals ∠B (alternate interior angles). Those two plus ∠C fill a straight angle, 180°.
    topic_code: "1.21"
  - front: Auxiliary line → meaning
    back: |
      A line added to a figure to make a proof possible, justified by a construction or postulate. The parallel through a vertex in the angle-sum proof is the classic example.
    topic_code: "1.21"
  - front: Exterior angle of a triangle → definition
    back: |
      The angle between one side and the extension of an adjacent side. It forms a linear pair with the interior angle at that vertex, so it equals 180° minus that interior angle.
    topic_code: "1.21"
  - front: Exterior angle theorem → statement and proof
    back: |
      An exterior angle equals the sum of the two remote interior angles. Proof: exterior + adjacent interior = 180° and the three interior angles = 180°; subtract the adjacent interior angle from both.
    topic_code: "1.21"
  - front: Acute angles of a right triangle → relationship
    back: |
      They are complementary: 90° + a + b = 180° gives a + b = 90°.
    topic_code: "1.21"
  - front: Each angle of an equilateral triangle → measure and why
    back: |
      60°. The three angles are congruent (rotation symmetry of order 3, or reflections across each line of symmetry) and sum to 180°, so each is 180° ÷ 3.
    topic_code: "1.21"
  - front: Angle sum of a quadrilateral → value and reason
    back: |
      360°. A diagonal splits it into two triangles, each with angle sum 180°.
    topic_code: "1.21"
  - front: Angle sum of an n-gon → formula
    back: |
      (n − 2) × 180°, because diagonals from one vertex split it into n − 2 triangles. Pentagon 540°, hexagon 720°, octagon 1080°.
    topic_code: "1.21"
  - front: Interior angle of a regular n-gon → formula and examples
    back: |
      (n − 2) × 180° ÷ n. Equilateral triangle 60°, square 90°, pentagon 108°, hexagon 120°, octagon 135°, decagon 144°, dodecagon 150°.
    topic_code: "1.21"
  - front: Exterior angle of a regular n-gon → formula
    back: |
      360° ÷ n, because walking around the polygon turns through one full revolution. Interior and exterior angles at a vertex are supplementary.
    topic_code: "1.21"
  - front: "Solving a triangle with angles in a ratio 2 : 3 : 4 → method"
    back: |
      Let the angles be 2k, 3k, 4k; 9k = 180 so k = 20; the angles are 40°, 60°, 80°.
    topic_code: "1.21"
  - front: Which regular polygons tile the plane alone → list and reason
    back: |
      Equilateral triangles (60°), squares (90°) and regular hexagons (120°), because the interior angle must divide 360° so that copies fit around a vertex with no gap or overlap.
    topic_code: "1.22"
  - front: Justifying a design built from constructions → what to write
    back: |
      For each length: which circle it is a radius of. For each angle: which theorem gives its measure (equilateral triangle 60°, perpendicular 90°, bisector halves, polygon formula). For a tiling: the angles around each vertex sum to 360°.
    topic_code: "1.22"
  - front: Constructing a 15° angle → two routes
    back: |
      Bisect 60° (equilateral triangle) to get 30°, then bisect again; or construct 60° and 45° (bisected right angle) sharing a side and take the difference.
    topic_code: "1.22"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 1.20 to 1.22: transversals, parallel-line angle
    theorems, the triangle angle sum, exterior angles, polygon angles and justified designs) with review of weeks
    1 to 5 (constructions, rigid transformations, symmetry and vertical angles). Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short
    answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: parallel lines and a transversal (1.20)
    - slug: geo-u01-w06-q01
      type: multiple_choice
      topic_code: "1.20"
      source: "IM Geometry, Unit 1, Lesson 20"
      points: 1
      stimulus: |
        Figure description: lines ℓ and m are parallel, with ℓ above m. Transversal t crosses ℓ at P and m at Q. At P the angles are numbered 1 (upper-left), 2 (upper-right), 3 (lower-left), 4 (lower-right); at Q they are 5 (upper-left), 6 (upper-right), 7 (lower-left), 8 (lower-right). ∠4 = 118°.
      prompt: |
        What is the measure of ∠5, and which relationship gives it directly?
      options:
        - "62°, alternate interior angles"
        - "118°, corresponding angles"
        - "62°, co-interior angles"
        - "118°, alternate interior angles"
      option_explanations:
        - |
          The relationship is right but the measure is wrong: alternate interior angles of parallel lines are equal, not supplementary.
        - |
          The angle corresponding to ∠4 is ∠8 (lower-right at Q), not ∠5.
        - |
          Co-interior angles are 4 and 6 (same side), which would be supplementary; 5 is on the other side of t.
        - |
          Correct. ∠4 (lower-right at P) and ∠5 (upper-left at Q) are interior angles on opposite sides of t, and the lines are parallel, so they are congruent.
      answer: 3

    - slug: geo-u01-w06-q02
      type: multiple_choice
      topic_code: "1.20"
      source: "IM Geometry, Unit 1, Lesson 20"
      points: 1
      stimulus: |
        Figure description: lines ℓ and m are parallel, with ℓ above m. Transversal t crosses ℓ at P and m at Q. At P the angles are numbered 1 (upper-left), 2 (upper-right), 3 (lower-left), 4 (lower-right); at Q they are 5 (upper-left), 6 (upper-right), 7 (lower-left), 8 (lower-right). ∠4 = 118°.
      prompt: |
        What is the measure of ∠6?
      options:
        - "Cannot be determined"
        - "62°"
        - "28°"
        - "118°"
      option_explanations:
        - |
          With parallel lines every angle at the transversal is determined once one is known.
        - |
          Correct. ∠4 and ∠6 are co-interior angles of parallel lines, so ∠6 = 180° − 118° = 62°. (Equivalently ∠6 = ∠2 by corresponding angles, and ∠2 = 180° − ∠4.)
        - |
          28° would be the complement of 62°; no right angle is involved here.
        - |
          ∠6 is co-interior with ∠4 (same side of t, both interior), so it is supplementary to 118°, not equal.
      answer: 1

    - slug: geo-u01-w06-q03
      type: multiple_choice
      topic_code: "1.20"
      source: "IM Geometry, Unit 1, Lesson 20"
      points: 1
      stimulus: |
        Figure description: lines ℓ and m are parallel, with ℓ above m. Transversal t crosses ℓ at P and m at Q. At P the angles are numbered 1 (upper-left), 2 (upper-right), 3 (lower-left), 4 (lower-right); at Q they are 5 (upper-left), 6 (upper-right), 7 (lower-left), 8 (lower-right). ∠4 = 118°.
      prompt: |
        A 180° rotation about the midpoint M of segment PQ is used to prove ∠4 = ∠5. Which statement about this rotation is correct?
      options:
        - "It fixes every point of t"
        - "It sends t to a line parallel to t through M"
        - "It sends P to Q and sends line ℓ onto line m, because the image of ℓ is a line through Q parallel to ℓ, and m is the only such line"
        - "It sends P to Q and sends line ℓ onto itself"
      option_explanations:
        - |
          Only the centre M is fixed; P and Q swap, and every other point of t moves.
        - |
          t passes through the centre M, so t maps to itself, not to a different parallel line.
        - |
          Correct. M is the midpoint of PQ, so P ↔ Q; a 180° rotation sends ℓ to a parallel line through the image of P, and the parallel postulate identifies that line as m.
        - |
          ℓ does not pass through the centre M (M is between the two lines), so ℓ cannot map to itself; it maps to m.
      answer: 2

    - slug: geo-u01-w06-q04
      type: multiple_choice
      topic_code: "1.20"
      source: "IM Geometry, Unit 1, Lesson 20"
      points: 1
      prompt: |
        Two lines are cut by a transversal, and one pair of alternate interior angles measures (5x − 10)° and (3x + 26)°. For which value of x are the two lines parallel?
      options:
        - "x = 18"
        - "x = 2"
        - "x = 20.5"
        - "x = 8"
      option_explanations:
        - |
          Correct. By the converse of the alternate interior angle theorem the lines are parallel exactly when the angles are equal: 5x − 10 = 3x + 26, so 2x = 36 and x = 18 (each angle is 80°).
        - |
          x = 2 gives 0° and 32°, which is impossible for the first angle.
        - |
          x = 20.5 would make the angles supplementary (92.5° and 87.5°), which is the condition for co-interior angles, not alternate interior angles.
        - |
          x = 8 gives 30° and 50°, which are not equal, so the lines would not be parallel.
      answer: 0

    - slug: geo-u01-w06-q05
      type: multiple_choice
      topic_code: "1.21"
      source: "IM Geometry, Unit 1, Lesson 21"
      points: 1
      prompt: |
        In the proof that the angles of triangle ABC sum to 180°, a line is drawn through C parallel to AB. Which theorem is then used, and how many times?
      options:
        - "The vertical angle theorem, twice"
        - "The alternate interior angle theorem, twice: once with transversal AC and once with transversal BC"
        - "The alternate interior angle theorem, once, with transversal AB"
        - "The exterior angle theorem, three times"
      option_explanations:
        - |
          No vertical angles appear in the standard proof; the angles at C are transferred by parallel lines.
        - |
          Correct. Each of the two angles at C outside the triangle equals the opposite base angle by alternate interior angles; then the three angles at C fill a straight line.
        - |
          AB is one of the parallel lines, not the transversal; the transversals are the other two sides.
        - |
          The exterior angle theorem is a consequence of the angle sum, so using it here would be circular.
      answer: 1

    - slug: geo-u01-w06-q06
      type: multiple_choice
      topic_code: "1.11"
      source: "IM Geometry, Unit 1, Lesson 11"
      points: 1
      prompt: |
        Review. Triangle ABC with A = (2, 3), B = (6, 3), C = (4, 8) is reflected across the line y = 3. Which statement about the image is correct?
      options:
        - "A′ = A, B′ = B and C′ = (4, −2)"
        - "A′ = (4, 3), B′ = (0, 3) and C′ = (2, 8)"
        - "A′ = A, B′ = B and C′ = (4, 8), so the triangle is unchanged"
        - "A′ = (2, −3), B′ = (6, −3) and C′ = (4, −8)"
      option_explanations:
        - |
          Correct. A and B lie on the mirror y = 3, so they are fixed; C is 5 above the mirror, so C′ is 5 below it, at (4, −2).
        - |
          Those are images under a reflection across the vertical line x = 3, which is not the mirror given.
        - |
          C is not on the mirror, so it moves; only points on y = 3 are fixed.
        - |
          That is the reflection across the x-axis (y = 0), not across y = 3.
      answer: 0

    - slug: geo-u01-w06-q07
      type: multiple_choice
      topic_code: "1.21"
      source: "IM Geometry, Unit 1, Lesson 21"
      points: 1
      prompt: |
        Side QR of triangle PQR is extended beyond R to point S. ∠PRS = 125° and ∠QPR = 70°. What is ∠PQR?
      options:
        - "70°"
        - "15°"
        - "125°"
        - "55°"
      option_explanations:
        - |
          70° is ∠QPR, the other remote interior angle, not ∠PQR.
        - |
          15° would come from subtracting the interior angle at R (55°) from 70°, which has no meaning here.
        - |
          125° is the exterior angle itself; an interior angle of the triangle cannot equal it here.
        - |
          Correct. The exterior angle at R equals the sum of the remote interior angles: 125 = 70 + ∠PQR, so ∠PQR = 55°.
      answer: 3

    - slug: geo-u01-w06-q08
      type: multiple_choice
      topic_code: "1.21"
      source: "IM Geometry, Unit 1, Lesson 21"
      points: 1
      prompt: |
        What is the measure of each interior angle of a regular nonagon (9 sides)?
      options:
        - "160°"
        - "40°"
        - "140°"
        - "135°"
      option_explanations:
        - |
          160° is the interior angle of a regular 18-gon.
        - |
          40° is the exterior angle, 360° ÷ 9; the interior angle is its supplement.
        - |
          Correct. The angle sum is (9 − 2) × 180° = 1260°, and 1260 ÷ 9 = 140°.
        - |
          135° is the interior angle of a regular octagon.
      answer: 2

    - slug: geo-u01-w06-q09
      type: multiple_choice
      topic_code: "1.22"
      source: "IM Geometry, Unit 1, Lesson 22"
      points: 1
      prompt: |
        A student wants to tile a floor using only copies of one regular polygon. Which polygon will NOT work, and why?
      options:
        - "A regular hexagon, because 120° does not divide 360°"
        - "A square, because 90° does not divide 360°"
        - "A regular pentagon, because 108° does not divide 360°"
        - "An equilateral triangle, because triangles cannot tile"
      option_explanations:
        - |
          Three hexagons meet at a point, since 3 × 120° = 360°; hexagons tile.
        - |
          Four squares meet at a point, since 4 × 90° = 360°; squares tile.
        - |
          Correct. Three pentagons leave a 36° gap and four overlap; no whole number of 108° angles makes 360°.
        - |
          Six equilateral triangles meet at a point, since 6 × 60° = 360°; triangles tile.
      answer: 2

    - slug: geo-u01-w06-q10
      type: multiple_choice
      topic_code: "1.22"
      source: "IM Geometry, Unit 1, Lesson 22"
      points: 1
      prompt: |
        A design calls for a 75° angle constructed with compass and straightedge. Which plan is valid?
      options:
        - "Construct a 45° angle and add a 30° angle obtained by trisecting the right angle"
        - "Construct a 90° angle and bisect it, then bisect again"
        - "Measure 75° with a protractor and mark it"
        - "Construct a 60° angle (equilateral triangle) and a 15° angle (60° bisected twice) adjacent to it on the same side"
      option_explanations:
        - |
          Trisecting an angle is impossible with compass and straightedge; 30° must come from bisecting 60°.
        - |
          Bisecting 90° twice gives 22.5°, not 75°.
        - |
          A protractor is a measuring tool; the result is a drawing, not a construction.
        - |
          Correct. 60° + 15° = 75°, and both pieces come from justified constructions (equilateral triangle; two bisections of 60°).
      answer: 3

    - slug: geo-u01-w06-q11
      type: multiple_choice
      topic_code: "1.19"
      source: "IM Geometry, Unit 1, Lesson 19"
      points: 1
      prompt: |
        Review. Lines cross at V, forming angles of (7x − 12)° and (4x + 33)° that are vertical angles. What is x?
      options:
        - "9"
        - "15"
        - "11"
        - "21"
      option_explanations:
        - |
          x = 9 gives 51° and 69°, which are not equal, so they cannot be vertical angles.
        - |
          Correct. Vertical angles are congruent: 7x − 12 = 4x + 33, so 3x = 45 and x = 15; each angle is 93°.
        - |
          x = 11 gives 65° and 77°, which are not equal.
        - |
          x = 21 comes from treating the angles as supplementary (11x + 21 = 180 does not give 21 either); vertical angles are equal, not supplementary.
      answer: 1

    - slug: geo-u01-w06-q12
      type: multiple_choice
      topic_code: "1.16"
      source: "IM Geometry, Unit 1, Lesson 16"
      points: 1
      prompt: |
        Review. A regular hexagon has centre O. Which fact about its interior angles follows from its 60° rotation symmetry together with the polygon angle-sum formula?
      options:
        - "All six angles are congruent, so each is 720° ÷ 6 = 120°"
        - "Each angle is 90° because the hexagon is made of squares"
        - "Opposite angles are supplementary"
        - "All six angles are congruent, so each is 360° ÷ 6 = 60°"
      option_explanations:
        - |
          Correct. The rotation carries each angle onto the next, so they are all equal, and the sum (6 − 2) × 180° = 720° shared six ways is 120°.
        - |
          A regular hexagon is made of six equilateral triangles, not squares.
        - |
          Opposite angles are both 120°; they are equal, and 240° is not 180°.
        - |
          360° ÷ 6 = 60° is the exterior angle (and the central angle), not the interior angle.
      answer: 0

    - slug: geo-u01-w06-q13
      type: multiple_choice
      topic_code: "1.6"
      source: "IM Geometry, Unit 1, Lesson 6"
      points: 1
      prompt: |
        Review. The triangle angle-sum proof needs "the line through C parallel to AB". Which construction produces it?
      options:
        - "Draw the circle centred at C through A"
        - "Construct the angle bisector at C"
        - "Construct the perpendicular bisector of AB"
        - "Construct the perpendicular to AB through C, then the perpendicular to that line through C"
      option_explanations:
        - |
          A circle is not a line, and it does not give a direction parallel to AB.
        - |
          The angle bisector at C enters the triangle; it is not parallel to AB.
        - |
          The perpendicular bisector of AB is perpendicular to AB and generally misses C.
        - |
          Correct. Two lines perpendicular to the same line are parallel, so the second perpendicular is the required parallel through C.
      answer: 3

    - slug: geo-u01-w06-q14
      type: multi_select
      topic_code: "1.20"
      source: "IM Geometry, Unit 1, Lesson 20"
      points: 2
      partial_credit: true
      prompt: |
        Lines a and b are cut by transversal t, and the angles are numbered 1–4 at the crossing with a and 5–8 at the crossing with b, in the standard arrangement (1 upper-left, 2 upper-right, 3 lower-left, 4 lower-right at each crossing). Which conditions each guarantee that a ∥ b? Select all that apply.
      options:
        - "∠3 = ∠6"
        - "∠1 = ∠5"
        - "∠4 + ∠6 = 180°"
        - "∠1 = ∠2"
        - "∠3 = ∠5"
      option_explanations:
        - |
          Yes: 3 and 6 are alternate interior angles, and congruent alternate interior angles imply parallel lines.
        - |
          Yes: 1 and 5 are corresponding angles; congruent corresponding angles imply parallel lines.
        - |
          Yes: 4 and 6 are co-interior; supplementary co-interior angles imply parallel lines (equivalently ∠4 = ∠5 by the linear pair 5 & 6).
        - |
          No: 1 and 2 form a linear pair at the same crossing; their equality (both 90°) says the transversal is perpendicular to a but nothing about b.
        - |
          No: 3 and 5 are co-interior, and for parallel lines they are supplementary, not equal (unless both are 90°).
      answer: [0, 1, 2]

    - slug: geo-u01-w06-q15
      type: multi_select
      topic_code: "1.21"
      source: "IM Geometry, Unit 1, Lesson 21"
      points: 2
      partial_credit: true
      prompt: |
        Which statements are consequences of the triangle angle-sum theorem? Select all that apply.
      options:
        - "The acute angles of a right triangle are complementary"
        - "Every triangle has at least one angle of exactly 60°"
        - "A triangle cannot have two obtuse angles"
        - "The angles of a quadrilateral sum to 360°"
        - "An exterior angle of a triangle equals the sum of the two remote interior angles"
      option_explanations:
        - |
          Yes: 90° plus the two acute angles is 180°, so they sum to 90°.
        - |
          No: a 30-60-90 triangle happens to have one, but a 50-50-80 triangle has none; the sum is 180°, which says nothing about any single angle.
        - |
          Yes: two angles over 90° would already exceed 180°.
        - |
          Yes: a diagonal splits a quadrilateral into two triangles with 180° each.
        - |
          Yes: subtract the angle-sum equation from the linear-pair equation at that vertex.
      answer: [0, 2, 3, 4]

    - slug: geo-u01-w06-q16
      type: true_false
      topic_code: "1.20"
      source: "IM Geometry, Unit 1, Lesson 20"
      points: 1
      prompt: |
        True or false: whenever a transversal crosses two lines, the alternate interior angles are congruent.
      answer: false
      explanation: |
        False. The names "alternate interior" apply to any two lines, but the congruence holds only when the lines are parallel. If the lines are not parallel, the alternate interior angles differ.

    - slug: geo-u01-w06-q17
      type: true_false
      topic_code: "1.14"
      source: "IM Geometry, Unit 1, Lesson 14"
      points: 1
      prompt: |
        Review. True or false: a 180° rotation about a point M sends every line not through M to a line parallel to it.
      answer: true
      explanation: |
        True. A half turn reverses every direction, so a line's image has the same direction (reversed twice over) and is therefore parallel to the original, or equal to it if the line passes through M. This is the key fact in the alternate interior angle proof.

    - slug: geo-u01-w06-q18
      type: fill_blank
      topic_code: "1.21"
      source: "IM Geometry, Unit 1, Lesson 21"
      points: 1
      prompt: |
        The interior angles of any triangle sum to ____ degrees.
      answer: ["180", "180°", "one hundred eighty", "180 degrees"]
      explanation: |
        Proved by drawing the line through one vertex parallel to the opposite side and using alternate interior angles twice to show the three angles fill a straight angle.

    - slug: geo-u01-w06-q19
      type: fill_blank
      topic_code: "1.20"
      source: "IM Geometry, Unit 1, Lesson 20"
      points: 1
      prompt: |
        A line that crosses two other lines at two distinct points is called a ____.
      answer: ["transversal"]
      explanation: |
        A transversal creates eight angles: four interior and four exterior, grouped into alternate, corresponding and co-interior pairs. The parallel-line theorems describe these pairs when the two crossed lines are parallel.

