      prompt: |
        Figure description: lines ℓ and m are cut by transversal t at P (on ℓ) and Q (on m). At P, the angle in the lower-right position is (2x + 14)°; at Q, the angle in the upper-left position is (3x − 22)°; at Q, the angle in the upper-right position is y°. Answer (a), (b) and (c).

