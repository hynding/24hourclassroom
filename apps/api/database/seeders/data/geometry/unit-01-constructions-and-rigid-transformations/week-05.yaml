week: 5
unit: 1
title: "Sequences of Rigid Motions and the Start of Proof"
topics: ["1.17", "1.18", "1.19"]
guide: guides/week-05.md
guide_description: |
  Carrying one figure exactly onto another with a named sequence of rigid transformations, the point-by-point
  method (translate a vertex, rotate to match a second, reflect across the matched side if needed), and the
  transformation definition of congruence. Then the line between evidence and proof, and the first theorems:
  linear pairs, supplementary and complementary angles, and two proofs that vertical angles are congruent.
flashcards_description: |
  27 cards on sequences of transformations, the point-by-point procedure, congruence by rigid motions,
  corresponding parts, evidence versus proof, linear pairs, supplementary and complementary angles, and the
  vertical angle theorem.

flashcards:
  - front: Sequence of transformations → meaning
    back: |
      Apply one transformation, then another to the result, and so on. A sequence of rigid transformations is itself rigid, so it preserves all distances and angles.
    topic_code: "1.17"
  - front: Describing a transformation precisely → what each kind needs
    back: |
      A reflection needs its line. A translation needs a directed segment (or an arrow on a grid). A rotation needs a centre, an angle and a direction. "Turn it a bit" is not a transformation.
    topic_code: "1.17"
  - front: Congruent figures → transformation definition
    back: |
      Two figures are congruent if there is a sequence of rigid transformations carrying one exactly onto the other. Consequently all corresponding sides and angles are congruent.
    topic_code: "1.17"
  - front: Order of letters in △ABC ≅ △DEF → what it tells you
    back: |
      The correspondence: A ↔ D, B ↔ E, C ↔ F, so AB ≅ DE, BC ≅ EF, CA ≅ FD and ∠A ≅ ∠D, etc. A different order is a different claim.
    topic_code: "1.17"
  - front: Corresponding parts of congruent figures → what is true of them
    back: |
      They are congruent, because a rigid transformation carries each part onto its partner and preserves length and angle measure. This is the fact used after any congruence is established.
    topic_code: "1.17"
  - front: Point-by-point method for carrying △ABC onto △DEF → the three steps
    back: |
      1. Translate by the arrow from A to D. 2. Rotate about D so the image of B lands on E. 3. If the image of C is not on F, reflect across line DE.
    topic_code: "1.18"
  - front: Point-by-point method step 2 → why B lands exactly on E
    back: |
      After translating, DB₁ = AB. Rotating keeps that distance and puts B₂ on ray DE. If AB = DE, the only point on ray DE at distance DE from D is E itself.
    topic_code: "1.18"
  - front: Point-by-point method step 3 → why one reflection always finishes
    back: |
      After two vertices match, the third image is at the same two distances from D and E as F. Two circles meet in at most two points, mirror images across the line of centres DE, so either it is already F or reflecting across DE moves it to F.
    topic_code: "1.18"
  - front: Rotating a point about a centre that is not the origin → procedure
    back: |
      Subtract the centre's coordinates, rotate about the origin with the coordinate rule, then add the centre back. For 90° counter-clockwise: (x, y) → (−y, x) in the shifted coordinates.
    topic_code: "1.18"
  - front: Checking a proposed sequence of transformations → what to verify
    back: |
      Compute the image of every vertex, in order, and confirm each lands on its intended partner. One vertex matching is not enough; all must.
    topic_code: "1.18"
  - front: Evidence versus proof → the difference
    back: |
      Evidence (measurements, examples, "it looks like") makes a claim plausible. A proof is a chain of statements, each justified by a definition, an accepted fact or an earlier result, that shows the claim holds in every case.
    topic_code: "1.19"
  - front: Conjecture and theorem → definitions
    back: |
      A conjecture is a claim believed from evidence but not yet proved. A theorem is a claim that has been proved. Measuring more examples never turns a conjecture into a theorem.
    topic_code: "1.19"
  - front: Allowed justifications in a proof → list
    back: |
      Definitions; properties of rigid transformations (distances and angles preserved); theorems already proved; facts about angle measure such as angles on a straight line summing to 180° and adjacent angles adding.
    topic_code: "1.19"
  - front: Linear pair → definition and sum
    back: |
      Two angles that share a vertex and one side, whose other two sides form a straight line. Their measures sum to 180°.
    topic_code: "1.19"
  - front: Supplementary angles → definition
    back: |
      Two angles whose measures add to 180°. They need not be adjacent; a linear pair is the adjacent special case.
    topic_code: "1.19"
  - front: Complementary angles → definition
    back: |
      Two angles whose measures add to 90°. The two acute angles of a right triangle are complementary.
    topic_code: "1.19"
  - front: Vertical angles → definition
    back: |
      The two non-adjacent angles formed when two lines cross: they are opposite each other at the crossing point. Two lines make two pairs of vertical angles.
    topic_code: "1.19"
  - front: Vertical angle theorem → statement
    back: |
      Vertical angles are congruent. If lines AB and CD cross at V, then ∠AVC ≅ ∠BVD and ∠AVD ≅ ∠CVB.
    topic_code: "1.19"
  - front: Vertical angle theorem → proof by linear pairs
    back: |
      ∠AVC + ∠CVB = 180° and ∠CVB + ∠BVD = 180° (linear pairs). So ∠AVC + ∠CVB = ∠CVB + ∠BVD; subtract ∠CVB from both sides to get ∠AVC = ∠BVD.
    topic_code: "1.19"
  - front: Vertical angle theorem → proof by rotation
    back: |
      Rotate 180° about the crossing point V. Each line through V maps to itself with its rays swapped, so ray VA → ray VB and ray VC → ray VD. Thus ∠AVC → ∠BVD, and rotations preserve angle measure.
    topic_code: "1.19"
  - front: 180° rotation about a point on a line → effect on the line
    back: |
      The line maps to itself, and the two rays from the centre swap. This is what makes the rotation proofs of vertical angles and (next week) alternate interior angles work.
    topic_code: "1.19"
  - front: Two angles both supplementary to the same angle → conclusion
    back: |
      They are congruent: each equals 180° minus the common angle. The same holds for two angles complementary to the same angle (each is 90° minus it).
    topic_code: "1.19"
  - front: Solving for x when vertical angles are (3x + 10)° and (5x − 30)° → method
    back: |
      Set them equal: 3x + 10 = 5x − 30, so x = 20 and each angle is 70°. The other pair of vertical angles is 180° − 70° = 110° each; check the four sum to 360°.
    topic_code: "1.19"
  - front: Error-spot → "I measured several examples, so the theorem is proved"
    back: |
      Measurement is evidence, never proof. It is inexact and covers only the examples drawn. A proof must justify every step for all cases.
    topic_code: "1.19"
  - front: Error-spot → writing △ABC ≅ △DFE when the sequence sends B to E
    back: |
      The letters must follow the correspondence. If A → D, B → E, C → F, write △ABC ≅ △DEF. △DFE would claim B ↔ F, which is generally false.
    topic_code: "1.17"
  - front: Which transformation when → "the two figures are mirror images with the same orientation after a slide"
    back: |
      If, after translating one vertex onto its partner and rotating to match a second, the third vertex is across the matched side, one reflection across that side finishes. Orientation reversal is the tell.
    topic_code: "1.18"
  - front: Proof of "diagonals of a rectangle are congruent" by symmetry → outline
    back: |
      Reflect across the line through the midpoints of two opposite sides. The rectangle maps to itself with A ↔ B and C ↔ D, so diagonal AC maps to diagonal BD; reflections preserve length.
    topic_code: "1.19"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 1.17 to 1.19: sequences of rigid motions,
    point-by-point transformations, congruence, evidence versus proof and vertical angles) with review of weeks 1
    to 4 (constructions, reflections, translations, rotations and symmetry). Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short
    answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: triangles ABC and DEF on a grid (1.17, 1.18)
    - slug: geo-u01-w05-q01
      type: multiple_choice
      topic_code: "1.18"
      source: "IM Geometry, Unit 1, Lesson 18"
      points: 1
      stimulus: |
        Figure description: triangle ABC with A = (0, 0), B = (4, 0), C = (0, 3). Triangle DEF with D = (6, 2), E = (6, 6), F = (3, 2).
      prompt: |
        The first step of the point-by-point method is to translate so that A lands on D. Where does C land after this translation?
      options:
        - "(0, 5)"
        - "(3, 2)"
        - "(6, 5)"
        - "(6, 2)"
      option_explanations:
        - |
          (0, 5) adds only the vertical part of the arrow; both coordinates must shift.
        - |
          (3, 2) is F, where C will land only after the later rotation; the translation alone does not get there.
        - |
          Correct. The arrow from A to D is (6, 2), and (0, 3) + (6, 2) = (6, 5).
        - |
          (6, 2) is D, which is the image of A under the translation, not the image of C.
      answer: 2

    - slug: geo-u01-w05-q02
      type: multiple_choice
      topic_code: "1.18"
      source: "IM Geometry, Unit 1, Lesson 18"
      points: 1
      stimulus: |
        Figure description: triangle ABC with A = (0, 0), B = (4, 0), C = (0, 3). Triangle DEF with D = (6, 2), E = (6, 6), F = (3, 2).
      prompt: |
        After translating by (6, 2), the image of B is B₁ = (10, 2). Which rotation about D sends B₁ to E?
      options:
        - "45° counter-clockwise"
        - "90° counter-clockwise"
        - "180°"
        - "90° clockwise"
      option_explanations:
        - |
          45° would land B₁ on the diagonal direction, not straight above D.
        - |
          Correct. B₁ is 4 units to the right of D and E is 4 units above D; a quarter turn counter-clockwise about D carries right to up.
        - |
          180° would send B₁ to (2, 2), 4 units to the left of D.
        - |
          Clockwise 90° about D would send a point 4 to the right of D to a point 4 below D, that is (6, −2), not E.
      answer: 1

    - slug: geo-u01-w05-q03
      type: multiple_choice
      topic_code: "1.17"
      source: "IM Geometry, Unit 1, Lesson 17"
      points: 1
      stimulus: |
        Figure description: triangle ABC with A = (0, 0), B = (4, 0), C = (0, 3). Triangle DEF with D = (6, 2), E = (6, 6), F = (3, 2).
      prompt: |
        After the translation by (6, 2) and the 90° counter-clockwise rotation about D, the image of C is (3, 2), which is F. What does this establish?
      options:
        - "The triangles have the same area but are not necessarily congruent"
        - "Nothing, because a reflection was not used"
        - "△ABC ≅ △DFE, because C was the last vertex matched"
        - "△ABC ≅ △DEF, because a sequence of rigid transformations carries ABC onto DEF with A → D, B → E, C → F"
      option_explanations:
        - |
          Equal area follows from congruence, but congruence itself is what the sequence of rigid motions proves.
        - |
          A reflection is needed only when the third vertex lands on the wrong side; here it landed on F, so the two steps suffice.
        - |
          The correspondence is A ↔ D, B ↔ E, C ↔ F regardless of the order in which they were matched, so △DEF is the right order.
        - |
          Correct. That is the definition of congruence; the correspondence is recorded by the order of the letters.
      answer: 3

    - slug: geo-u01-w05-q04
      type: multiple_choice
      topic_code: "1.17"
      source: "IM Geometry, Unit 1, Lesson 17"
      points: 1
      prompt: |
        Which of the following is a complete, precise description of a rigid transformation?
      options:
        - "Rotate the triangle 60° counter-clockwise about point P"
        - "Slide the triangle 5 units"
        - "Rotate the triangle about point P"
        - "Reflect the triangle"
      option_explanations:
        - |
          Correct. Centre, angle and direction are all given, so the image of every point is determined.
        - |
          A translation needs a direction as well as a distance.
        - |
          The angle and direction are missing, so the image is not determined.
        - |
          A reflection is not determined until its mirror line is named.
      answer: 0

    - slug: geo-u01-w05-q05
      type: multiple_choice
      topic_code: "1.17"
      source: "IM Geometry, Unit 1, Lesson 17"
      points: 1
      prompt: |
        △PQR ≅ △XYZ, with PQ = 9, QR = 5, ∠R = 70°. Which statement must be true?
      options:
        - "XY = 9 and ∠Z = 70°"
        - "YZ = 9 and ∠Y = 70°"
        - "XY = 5 and ∠X = 70°"
        - "XZ = 9 and ∠Z = 70°"
      option_explanations:
        - |
          Correct. P ↔ X, Q ↔ Y, R ↔ Z, so XY = PQ = 9 and ∠Z = ∠R = 70°.
        - |
          YZ corresponds to QR = 5, and ∠Y corresponds to ∠Q.
        - |
          XY corresponds to PQ, which is 9, and ∠X corresponds to ∠P, which is not given.
        - |
          XZ corresponds to PR, whose length is not given.
      answer: 0

    - slug: geo-u01-w05-q06
      type: multiple_choice
      topic_code: "1.18"
      source: "IM Geometry, Unit 1, Lesson 18"
      points: 1
      prompt: |
        In the point-by-point method, after translating A to D and rotating so B lands on E, the image of C is a point C₂ with DC₂ = DF and EC₂ = EF, but C₂ ≠ F. What is the relationship between C₂ and F?
      options:
        - "C₂ is the translation of F by the arrow from D to E"
        - "C₂ is the reflection of F across line DE"
        - "C₂ and F are unrelated; the method has failed"
        - "C₂ is the rotation of F by 180° about D"
      option_explanations:
        - |
          Translating F by the arrow D→E changes its distance from D, so that point is not DF from D.
        - |
          Correct. Both points are on the circle at D of radius DF and the circle at E of radius EF; two circles meet in at most two points, which are mirror images across the line of centres DE.
        - |
          The method has not failed; a single reflection across DE finishes it.
        - |
          A 180° rotation about D would change the distance from E, so the image would not be at distance EF from E.
      answer: 1

    - slug: geo-u01-w05-q07
      type: multiple_choice
      topic_code: "1.19"
      source: "IM Geometry, Unit 1, Lesson 19"
      points: 1
      prompt: |
        Which of the following is a proof, rather than evidence, that vertical angles are congruent?
      options:
        - "Measuring the vertical angles in six different drawings and finding each pair equal"
        - "Observing that the figure looks symmetric"
        - "Drawing the figure accurately in software and reading off equal angle measures"
        - "Noting that both vertical angles form a linear pair with the same angle, so each is 180° minus that angle"
      option_explanations:
        - |
          Measurement in examples is evidence; it cannot cover every case and is never exact.
        - |
          An observation about appearance is not a justified statement.
        - |
          Software measurement is still measurement of particular examples.
        - |
          Correct. This is a chain of justified statements that applies to every pair of crossing lines.
      answer: 3

    - slug: geo-u01-w05-q08
      type: multiple_choice
      topic_code: "1.19"
      source: "IM Geometry, Unit 1, Lesson 19"
      points: 1
      prompt: |
        Lines AB and CD cross at V. ∠AVC = (4x − 8)° and ∠BVD = (2x + 30)°. What is the measure of ∠AVD?
      options:
        - "19°"
        - "180°"
        - "112°"
        - "68°"
      option_explanations:
        - |
          19 is the value of x, not an angle measure.
        - |
          180° is a straight angle; ∠AVD is one part of it.
        - |
          Correct. Vertical angles are equal: 4x − 8 = 2x + 30 gives x = 19 and ∠AVC = 68°. ∠AVD forms a linear pair with ∠AVC, so it is 180° − 68° = 112°.
        - |
          68° is the measure of ∠AVC and ∠BVD (x = 19), but ∠AVD is their neighbour, not their equal.
      answer: 2

    - slug: geo-u01-w05-q09
      type: multiple_choice
      topic_code: "1.10"
      source: "IM Geometry, Unit 1, Lesson 10"
      points: 1
      prompt: |
        Review. A sequence of three transformations is applied to a triangle: a translation, then a rotation, then the transformation (x, y) → (2x, 2y). Is the overall transformation rigid?
      options:
        - "No, because a sequence of transformations is never rigid"
        - "Yes, because the first two steps are rigid"
        - "Yes, because angles are preserved throughout"
        - "No, because the last step doubles every distance"
      option_explanations:
        - |
          Sequences of rigid transformations are rigid; the problem is the dilation, not the sequencing.
        - |
          Two rigid steps followed by a non-rigid one give a non-rigid result; every step must preserve distance.
        - |
          Angles are preserved by the dilation, but distance preservation is the definition of rigid, and distances double.
        - |
          Correct. A sequence is rigid only if every distance is preserved overall; (x, y) → (2x, 2y) is a dilation that doubles distances, so the result is not rigid.
      answer: 3

    - slug: geo-u01-w05-q10
      type: multiple_choice
      topic_code: "1.19"
      source: "IM Geometry, Unit 1, Lesson 19"
      points: 1
      prompt: |
        In the rotation proof of the vertical angle theorem, lines AB and CD cross at V and the figure is rotated 180° about V. Which fact about the rotation makes the proof work?
      options:
        - "A 180° rotation about V fixes every point on both lines"
        - "A 180° rotation about V sends each line through V to itself, swapping its two rays, so ∠AVC lands on ∠BVD"
        - "A 180° rotation about V sends line AB to line CD"
        - "A 180° rotation about V reverses orientation, so the angles are mirror images"
      option_explanations:
        - |
          Only V is fixed; every other point moves to the opposite side of V.
        - |
          Correct. Ray VA goes to ray VB and ray VC to ray VD, so the angle between VA and VC is carried to the angle between VB and VD; rotations preserve angle measure.
        - |
          Each line through the centre maps to itself, not to the other line.
        - |
          Rotations preserve orientation; reflections reverse it.
      answer: 1

    - slug: geo-u01-w05-q11
      type: multiple_choice
      topic_code: "1.14"
      source: "IM Geometry, Unit 1, Lesson 14"
      points: 1
      prompt: |
        Review. Point Q = (7, 3) is rotated 90° counter-clockwise about the centre C = (5, 1). What is Q′?
      options:
        - "(3, −1)"
        - "(7, −1)"
        - "(3, 3)"
        - "(−3, 7)"
      option_explanations:
        - |
          (3, −1) is the 180° image: (2, 2) → (−2, −2) → (3, −1).
        - |
          (7, −1) is the 90° clockwise image: (2, 2) → (2, −2) → (7, −1).
        - |
          Correct. Shift by the centre: (7 − 5, 3 − 1) = (2, 2); rotate: (−2, 2); shift back: (3, 3).
        - |
          (−3, 7) is the result of rotating about the origin instead of about C.
      answer: 2

    - slug: geo-u01-w05-q12
      type: multiple_choice
      topic_code: "1.15"
      source: "IM Geometry, Unit 1, Lesson 15"
      points: 1
      prompt: |
        Review. Which quadrilateral has exactly one line of symmetry and no rotation symmetry?
      options:
        - "A kite that is not a rhombus"
        - "A parallelogram that is not a rhombus or rectangle"
        - "A rhombus that is not a square"
        - "A rectangle that is not a square"
      option_explanations:
        - |
          Correct. A kite's only symmetry is the reflection across the diagonal through the vertices where the congruent sides meet.
        - |
          A general parallelogram has no line of symmetry but does have 180° rotation symmetry.
        - |
          A rhombus has two lines of symmetry (its diagonals) and 180° rotation symmetry.
        - |
          A rectangle has two lines of symmetry and 180° rotation symmetry.
      answer: 0

    - slug: geo-u01-w05-q13
      type: multiple_choice
      topic_code: "1.11"
      source: "IM Geometry, Unit 1, Lesson 11"
      points: 1
      prompt: |
        Review. After two vertices of a triangle have been matched by a translation and a rotation, the third vertex lands at (2, 7) instead of its target (2, −1). The matched side lies along the line y = 3. Which transformation completes the match, and why?
      options:
        - "The translation by (0, −8), because it moves the point straight down"
        - "The rotation by 180° about (2, 3), because it swaps the two points"
        - "The reflection across x = 2, because both points lie on it"
        - "The reflection across y = 3, because y = 3 is the perpendicular bisector of the segment from (2, 7) to (2, −1)"
      option_explanations:
        - |
          The translation moves the third vertex correctly but also moves the two already-matched vertices off their targets.
        - |
          The rotation swaps the two points, but it also moves the matched vertices along the line y = 3 to the wrong places (unless both happen to be at (2, 3)).
        - |
          Reflecting across x = 2 fixes both points, since they lie on it; nothing moves.
        - |
          Correct. The midpoint of the two points is (2, 3), on the line, and the segment is vertical, perpendicular to y = 3; the reflection also leaves the matched side (on the mirror) in place.
      answer: 3

    - slug: geo-u01-w05-q14
      type: multi_select
      topic_code: "1.19"
      source: "IM Geometry, Unit 1, Lesson 19"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following may be used as a justification in a geometric proof? Select all that apply.
      options:
        - "The fact that rigid transformations preserve angle measure"
        - "A theorem proved earlier in the course"
        - "A measurement taken with a protractor on an accurate drawing"
        - "The observation that the claim held in every example tried"
        - "The definition of a reflection"
      option_explanations:
        - |
          Yes: this is a basic property of rigid transformations, used constantly.
        - |
          Yes: previously proved results may be cited.
        - |
          No: measurement is evidence about one drawing, not a reason that holds in general.
        - |
          No: examples support a conjecture but do not prove it.
        - |
          Yes: definitions are always valid justifications.
      answer: [0, 1, 4]

    - slug: geo-u01-w05-q15
      type: multi_select
      topic_code: "1.17"
      source: "IM Geometry, Unit 1, Lesson 17"
      points: 2
      partial_credit: true
      prompt: |
        △ABC is carried onto △DEF by a translation followed by a reflection, with A → D, B → E, C → F. Which statements must be true? Select all that apply.
      options:
        - "∠C = ∠F"
        - "The orientation of DEF is opposite to that of ABC"
        - "AB = DE"
        - "The triangles have different areas"
        - "△ABC ≅ △DEF"
      option_explanations:
        - |
          True: angle measures are preserved by rigid transformations.
        - |
          True: the translation keeps orientation and the reflection reverses it, so the final image has the opposite orientation.
        - |
          True: both transformations are rigid, so the side AB and its image DE have the same length.
        - |
          False: rigid transformations preserve area.
        - |
          True: a sequence of rigid transformations carrying one onto the other is the definition of congruence.
      answer: [0, 1, 2, 4]

    - slug: geo-u01-w05-q16
      type: true_false
      topic_code: "1.19"
      source: "IM Geometry, Unit 1, Lesson 19"
      points: 1
      prompt: |
        True or false: two angles that are supplementary must share a vertex and a side.
      answer: false
      explanation: |
        False. Supplementary only means the measures add to 180°; the angles can be anywhere. A linear pair is the special case of adjacent supplementary angles whose outer sides form a line.

    - slug: geo-u01-w05-q17
      type: true_false
      topic_code: "1.12"
      source: "IM Geometry, Unit 1, Lesson 12"
      points: 1
      prompt: |
        Review. True or false: if a translation sends A to D, then it also sends every other point of triangle ABC by the same arrow as A.
      answer: true
      explanation: |
        True. By definition every point moves by the same directed segment, so once the arrow from A to D is known, the images of B and C follow by adding the same arrow.

    - slug: geo-u01-w05-q18
      type: fill_blank
      topic_code: "1.19"
      source: "IM Geometry, Unit 1, Lesson 19"
      points: 1
      prompt: |
        Two angles whose measures add to 90° are called ____ angles.
      answer: ["complementary"]
      explanation: |
        Complementary angles add to 90°; supplementary angles add to 180°. The two acute angles of a right triangle are complementary.

    - slug: geo-u01-w05-q19
      type: fill_blank
      topic_code: "1.19"
      source: "IM Geometry, Unit 1, Lesson 19"
      points: 1
      prompt: |
        When two lines cross, the pair of non-adjacent angles opposite each other at the crossing point are called ____ angles.
      answer: ["vertical", "vertically opposite"]
      explanation: |
        Vertical angles are congruent, proved either by noticing that both form a linear pair with the same angle or by a 180° rotation about the crossing point.

    - slug: geo-u01-w05-q20
      type: numeric
      topic_code: "1.19"
      source: "general knowledge"
      points: 1
      prompt: |
        Angles ∠1 and ∠2 form a linear pair, and ∠1 is 3 times ∠2. What is the measure of ∠1 in degrees? Give an integer.
      answer: { value: 135, tolerance: 0 }
      explanation: |
        A linear pair sums to 180°: 3x + x = 180, so x = 45 and ∠1 = 3 × 45 = 135°.

    - slug: geo-u01-w05-q21
      type: numeric
      topic_code: "1.3"
      source: "general knowledge"
      points: 1
      prompt: |
