      prompt: |
        Figure description: lines PQ and RS cross at point O. ∠POR = 52°. Answer (a), (b) and (c).

        (a) Find ∠ROQ, ∠QOS and ∠SOP, naming the fact used for each.
        (b) Write a proof, using linear pairs, that ∠POR = ∠QOS.
        (c) A classmate says the proof in (b) only works when ∠POR = 52°. Explain why the proof applies to any pair of crossing lines.
      answer: |
        (a) ∠ROQ = 180° − 52° = 128° (linear pair with ∠POR along line PQ). ∠QOS = 52° (vertical angles with ∠POR). ∠SOP = 128° (vertical angles with ∠ROQ, or linear pair with ∠POR along line RS). (b) ∠POR + ∠ROQ = 180° because P, O, Q are collinear (linear pair). ∠ROQ + ∠QOS = 180° because R, O, S are collinear (linear pair). Therefore ∠POR + ∠ROQ = ∠ROQ + ∠QOS, and subtracting ∠ROQ from both sides gives ∠POR = ∠QOS. (c) The proof never used the number 52; it used only that the two lines are straight, so the linear pairs sum to 180°. Replacing 52° by any measure leaves every step valid, so the argument proves the theorem for all crossing lines.
      explanation: |
        1 point for (a): all three measures with correct reasons (linear pair, vertical angles). 1 point for (b): two linear-pair equations and the subtraction step. 1 point for (c): the proof does not depend on the specific measure.

    - slug: geo-u01-w05-q24
      type: long_answer
      topic_code: "1.18"
      source: "IM Geometry, Unit 1, Lesson 18"
      points: 6
      prompt: |
        Triangle ABC has A = (1, 1), B = (5, 1), C = (1, 4). Triangle DEF has D = (−2, 3), E = (−2, 7), F = (1, 3). Use the point-by-point method to find a sequence of rigid transformations carrying ABC onto DEF with A → D, B → E, C → F. Show the image of every vertex after each step, state at the end whether a reflection was needed and why, and then explain what the finished sequence proves about the two triangles.
      answer: |
        Step 1, translate A to D. The arrow is D − A = (−3, 2). Images: A₁ = (−2, 3) = D, B₁ = (2, 3), C₁ = (−2, 6).

        Step 2, rotate about D so that B₁ lands on E. B₁ is 4 units to the right of D (at (2, 3)); E is 4 units above D (at (−2, 7)). A 90° counter-clockwise rotation about D does this. Rotating a point: subtract D, apply (x, y) → (−y, x), add D. B₁: (4, 0) → (0, 4) → (−2, 7) = E ✓. C₁: (0, 3) → (−3, 0) → (−5, 3). So C₂ = (−5, 3).

        Step 3, check C. The target is F = (1, 3), but C₂ = (−5, 3). Both are 3 units from D along the horizontal line y = 3, on opposite sides of line DE (the vertical line x = −2). They are mirror images across line DE: the midpoint of C₂ and F is (−2, 3), which is on x = −2, and the segment is horizontal, perpendicular to the mirror. Reflect across x = −2: (x, y) → (−4 − x, y) sends (−5, 3) → (1, 3) = F ✓, while D and E, on the mirror, stay put.

        A reflection was needed because after matching two vertices the third landed on the wrong side of the matched side; the two triangles have opposite orientations (A, B, C goes counter-clockwise; D, E, F goes clockwise).

        Conclusion: the sequence translate by (−3, 2), rotate 90° counter-clockwise about D, reflect across line DE is a sequence of rigid transformations carrying △ABC exactly onto △DEF with A → D, B → E, C → F. By the definition of congruence, △ABC ≅ △DEF, and so AB = DE = 4, AC = DF = 3, BC = EF = 5 and the corresponding angles are congruent.
      explanation: |
        Scoring (6 points): 1 for the correct translation arrow and all three images; 2 for the correct rotation (90° counter-clockwise about D) with the images of B and C computed; 1 for recognising the reflection across line DE (x = −2) is needed and checking it sends C₂ to F; 1 for explaining why (wrong side / opposite orientation, mirror images across the line of centres); 1 for the conclusion that the triangles are congruent by the definition, with the correct correspondence.
