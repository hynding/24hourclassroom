week: 12
unit: 3
title: "Similarity and Transformations"
topics: ["3.5", "3.6", "3.7", "3.8"]
guide: guides/week-12.md
guide_description: |
  Dilating a triangle from a vertex and the side-splitting proportions it produces, the definition of similar figures as "rigid motions plus a dilation", how to show two figures are similar by naming the moves, and which families of figures are always similar. Worked examples, Try-it problems and a self-check.
flashcards_description: |
  28 cards on side splitting, midsegments, the definition of similarity, scale factors, correspondence and the "always similar" families. Review them before the week 12 quiz.
flashcards:
  - front: Dilating △ABC from vertex A by k → what happens to side BC
    back: |
      Its image B′C′ is parallel to BC and k times as long. A stays fixed; B′ is on ray AB with AB′ = k · AB; C′ is on ray AC with AC′ = k · AC.
    topic_code: "3.5"
  - front: Side-splitter setup → the whole-side proportion
    back: |
      If D is on AB, E is on AC and DE ∥ BC, then AD/AB = AE/AC = DE/BC.
    topic_code: "3.5"
  - front: Side-splitter setup → the pieces proportion
    back: |
      If DE ∥ BC (D on AB, E on AC), then AD/DB = AE/EC. Note that DE/BC is NOT equal to AD/DB; compare DE with BC using the whole side AB.
    topic_code: "3.5"
  - front: Why DE ∥ BC forces E to be the dilation image of C
    back: |
      The dilation from A with k = AD/AB sends B to D and sends line BC to the parallel line through D. That parallel meets AC in exactly one point, so the image of C must be E.
    topic_code: "3.5"
  - front: Midsegment of a triangle → definition and properties
    back: |
      The segment joining the midpoints of two sides. It is parallel to the third side and half its length (the side splitter with k = 1/2).
    topic_code: "3.5"
  - front: Joining all three midpoints of a triangle → result
    back: |
      Four congruent triangles, each similar to the original with scale factor 1/2 and one quarter of its area.
    topic_code: "3.5"
  - front: Similar figures → definition
    back: |
      Figure A is similar to figure B when a sequence of rigid motions and dilations carries A exactly onto B. Written A ∼ B.
    topic_code: "3.6"
  - front: Congruent versus similar → relationship
    back: |
      Congruent figures are similar (take k = 1). Similar figures are congruent only when the scale factor is 1.
    topic_code: "3.6"
  - front: Scale factor of a similarity → how to find it
    back: |
      Divide a length in the second figure by the corresponding length in the first (longest by longest, shortest by shortest). Every pair of corresponding lengths must give the same k.
    topic_code: "3.6"
  - front: Standard pattern for proving two triangles similar by transformations
    back: |
      Dilate the first triangle by k so its sides (or a side and angles) match the second; show the image is congruent to the second by SSS, SAS or ASA; conclude a rigid motion finishes the job.
    topic_code: "3.6"
  - front: What similarity preserves
    back: |
      Angle measures, parallelism, ratios of lengths within a figure, and shape. Lengths are multiplied by k, perimeter by k, area by k².
    topic_code: "3.6"
  - front: "△ABC ∼ △DEF → what the letter order tells you"
    back: |
      A ↔ D, B ↔ E, C ↔ F. So ∠A = ∠D, ∠B = ∠E, ∠C = ∠F and AB/DE = BC/EF = CA/FD.
    topic_code: "3.6"
  - front: Similar figures with areas 20 and 125 → scale factor
    back: |
      k² = 125/20 = 6.25, so k = 2.5. Take the square root of the area ratio to get the length ratio.
    topic_code: "3.6"
  - front: Sides 6, 8, 10 and sides 9, 12, 15 → similar?
    back: |
      Yes. 9/6 = 12/8 = 15/10 = 1.5, so a dilation by 1.5 gives a triangle congruent (SSS) to the second.
    topic_code: "3.6"
  - front: Two rectangles with all angles 90° → always similar?
    back: |
      No. A 1 × 2 rectangle and a 1 × 3 rectangle have different side ratios, so no single scale factor works. Equal angles do not force similarity for quadrilaterals.
    topic_code: "3.8"
  - front: Triangle dilated from one of its own vertices → rigid motion needed?
    back: |
      No. The dilation alone carries the small triangle onto the large one, because the vertex is fixed and the other two vertices slide out along the sides.
    topic_code: "3.7"
  - front: Two triangles meeting at a shared vertex O on opposite sides, with OC = k · OA and OD = k · OB on the extended rays
    back: |
      Dilate △OAB from O by k, then rotate 180° about O. The triangles are similar with scale factor k, and AB ∥ CD.
    topic_code: "3.7"
  - front: Two triangles with the same three angles → how to show similar
    back: |
      Dilate the first so one side matches the corresponding side of the second; ASA then makes the image congruent to the second triangle. Two equal angles are enough (AA criterion, proved next week).
    topic_code: "3.7"
  - front: Families that are always similar
    back: |
      Circles, squares, equilateral triangles, regular n-gons for the same n, isosceles right triangles, 30-60-90 triangles, parabolas. One length determines the whole figure once the angles are fixed.
    topic_code: "3.8"
  - front: Families that are NOT always similar
    back: |
      Rectangles, rhombuses, isosceles triangles, right triangles, general triangles, general parallelograms, hexagons with all angles 120°.
    topic_code: "3.8"
  - front: Why all circles are similar
    back: |
      Translate one centre onto the other, then dilate from that centre by r₂/r₁. Every point at distance r₁ goes to distance r₂.
    topic_code: "3.8"
  - front: Why all squares are similar
    back: |
      A rigid motion matches one vertex and the directions of its two sides; a dilation from that vertex by s₂/s₁ matches the side lengths, and the right angles do the rest.
    topic_code: "3.8"
  - front: Rhombuses → why not always similar
    back: |
      A rhombus can have any angle between 0° and 90° at a vertex. A square and a nearly flat rhombus have equal sides but different angles, and similarity preserves angles.
    topic_code: "3.8"
  - front: Isosceles triangles → why not always similar
    back: |
      Their apex angles can differ (20° versus 120°). Similarity preserves angles, so triangles with different angle sets are never similar.
    topic_code: "3.8"
  - front: Rule of thumb for "always similar"
    back: |
      A family is all-similar when its definition fixes every angle and leaves only one free length. Any second free length (a rectangle's two sides) breaks it.
    topic_code: "3.8"
  - front: Common error in side splitting → DE/BC versus AD/DB
    back: |
      DE/BC equals AD/AB (whole side), not AD/DB (pieces). With AD = 6, DB = 9, DE = 10 the side BC is 25, not 15.
    topic_code: "3.5"
  - front: Perimeter and area under a similarity with scale factor k
    back: |
      Perimeter is multiplied by k; area by k². Perimeters 24 and 36 (k = 1.5) go with areas 24 and 54.
    topic_code: "3.6"
  - front: Why dilations preserve parallelism (review of week 11)
    back: |
      A dilation maps every line to a line parallel to it (or to itself). Two parallel lines therefore map to two lines each parallel to the originals, hence parallel to each other.
    topic_code: "3.4"
quiz:
  description: |
    25 questions · about 40 minutes · Side splitting, midsegments, the definition of similarity, scale factors, naming transformations and the always-similar families, with review of rigid motions, congruence criteria and parallel-line angles. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: geo-u03-w12-q01
      type: multiple_choice
      topic_code: "3.5"
      source: "IM Geometry, Unit 3, Lesson 5"
      points: 1
      stimulus: |
        Figure description: triangle ABC with AB = 20, AC = 16 and BC = 12. Point D lies on AB with AD = 15, and point E lies on AC so that segment DE is parallel to BC.
      prompt: |
        What is the scale factor of the dilation centred at A that sends B to D?
      options:
        - "3/4"
        - "4/3"
        - "3"
        - "5/4"
      option_explanations:
        - |
          Correct. k = AD/AB = 15/20 = 3/4; the dilation from A shrinks the triangle to three quarters of its size.
        - |
          4/3 is AB/AD, the factor that would send D back to B, not B to D.
        - |
          3 is AD/DB, the ratio of the two pieces of AB, not the scale factor from A.
        - |
          5/4 is 20/16 = AB/AC, a ratio between two different sides, not a scale factor.
      answer: 0

    - slug: geo-u03-w12-q02
      type: multiple_choice
      topic_code: "3.5"
      source: "IM Geometry, Unit 3, Lesson 5"
      points: 1
      stimulus: |
        Figure description: triangle ABC with AB = 20, AC = 16 and BC = 12. Point D lies on AB with AD = 15, and point E lies on AC so that segment DE is parallel to BC.
      prompt: |
        What is the length of AE?
      options:
        - "12"
        - "11"
        - "4"
        - "13.5"
      option_explanations:
        - |
          Correct. E is the image of C, so AE = k · AC = (3/4)(16) = 12.
        - |
          11 comes from subtracting 5 from 16 (the amount AB lost); proportions are multiplicative, not additive.
        - |
          4 is EC, the leftover piece of AC, not AE.
        - |
          13.5 would be AE if k were AD/DB = 3 applied wrongly; the scale factor is AD/AB = 3/4.
      answer: 0

    - slug: geo-u03-w12-q03
      type: multiple_choice
      topic_code: "3.5"
      source: "IM Geometry, Unit 3, Lesson 5"
      points: 1
      stimulus: |
        Figure description: triangle ABC with AB = 20, AC = 16 and BC = 12. Point D lies on AB with AD = 15, and point E lies on AC so that segment DE is parallel to BC.
      prompt: |
        What is the length of DE?
      options:
        - "9"
        - "36"
        - "7"
        - "15"
      option_explanations:
        - |
          Correct. DE is the image of BC under the dilation, so DE = (3/4)(12) = 9.
        - |
          36 uses AD/DB = 3 as the scale factor; the correct factor compares AD with the whole side AB.
        - |
          7 subtracts 5 from 12; a dilation multiplies lengths, it does not subtract a fixed amount.
        - |
          15 is AD, a piece of side AB, not the length of segment DE.
      answer: 0

    - slug: geo-u03-w12-q04
      type: multiple_choice
      topic_code: "3.5"
      source: "IM Geometry, Unit 3, Lesson 5"
      points: 1
      prompt: |
        In triangle PQR, point S is on PQ and point T is on PR with ST ∥ QR. PS = 6, SQ = 9 and PT = 8. What is TR?
      options:
        - "12"
        - "11"
        - "5.33"
        - "20"
      option_explanations:
        - |
          Correct. The pieces proportion PS/SQ = PT/TR gives 6/9 = 8/TR, so TR = 12.
        - |
          11 adds 3 to 8 because SQ is 3 more than PS; proportions scale by multiplication, not by adding a difference.
        - |
          5.33 solves 6/9 = TR/8, which inverts one side of the proportion.
        - |
          20 is the whole side PR (8 + 12), not the piece TR.
      answer: 0

    - slug: geo-u03-w12-q05
      type: multiple_choice
      topic_code: "3.5"
      source: "IM Geometry, Unit 3, Lesson 5"
      points: 1
      prompt: |
        M and N are the midpoints of sides AB and AC of triangle ABC, and BC = 22. Which statement about segment MN is correct?
      options:
        - "MN ∥ BC and MN = 11"
        - "MN ∥ BC and MN = 22"
        - "MN ⊥ BC and MN = 11"
        - "MN ∥ AB and MN = 11"
      option_explanations:
        - |
          Correct. MN is the image of BC under the dilation from A with k = 1/2, so it is parallel to BC and half as long.
        - |
          The dilation with k = 1/2 halves the length, so MN cannot equal BC.
        - |
          A dilation maps a line to a parallel line, never a perpendicular one.
        - |
          MN joins a point of AB to a point not on AB, so it cannot be parallel to AB; it is parallel to BC.
      answer: 0

    - slug: geo-u03-w12-q06
      type: multiple_choice
      topic_code: "3.6"
      source: "IM Geometry, Unit 3, Lesson 6"
      points: 1
      prompt: |
        Which statement is the definition of "figure A is similar to figure B"?
      options:
        - "There is a sequence of rigid motions and dilations that carries A onto B"
        - "A and B have the same angles"
        - "A and B have the same shape and the same size"
        - "There is a sequence of translations, rotations and reflections that carries A onto B"
      option_explanations:
        - |
          Correct. Similarity is congruence with dilations allowed; the moves must carry A exactly onto B.
        - |
          Equal angles are a consequence for triangles, but not the definition, and for quadrilaterals equal angles do not give similarity.
        - |
          Same shape and same size describes congruence; similar figures may differ in size.
        - |
          Rigid motions alone define congruence; similarity also permits dilations.
      answer: 0

    - slug: geo-u03-w12-q07
      type: multiple_choice
      topic_code: "3.6"
      source: "IM Geometry, Unit 3, Lesson 6"
      points: 1
      prompt: |
        Triangle ABC has sides 5, 12, 13. Triangle DEF has sides 7.5, 18, 19.5. Which statement is correct?
      options:
        - "They are similar with scale factor 1.5, because every ratio of corresponding sides is 1.5"
        - "They are similar with scale factor 2.5, because 7.5 − 5 = 2.5"
        - "They are not similar, because the side lengths are different"
        - "They are congruent, because both are right triangles"
      option_explanations:
        - |
          Correct. 7.5/5 = 18/12 = 19.5/13 = 1.5, so a dilation by 1.5 followed by a rigid motion (SSS) carries one onto the other.
        - |
          The scale factor is a ratio, not a difference; 7.5 ÷ 5 = 1.5.
        - |
          Similar figures are expected to have different lengths; what matters is that all the ratios agree.
        - |
          Congruent triangles need equal sides; being right triangles says nothing about the side lengths.
      answer: 0

    - slug: geo-u03-w12-q08
      type: multiple_choice
      topic_code: "3.6"
      source: "IM Geometry, Unit 3, Lesson 6"
      points: 1
      prompt: |
        △ABC ∼ △XYZ with AB = 4, BC = 6, CA = 7 and XY = 10. What is YZ?
      options:
        - "15"
        - "12"
        - "17.5"
        - "16"
      option_explanations:
        - |
          Correct. The letter order gives AB ↔ XY, so k = 10/4 = 2.5, and YZ = 2.5 × BC = 15.
        - |
          12 adds 6 to 6 (the amount AB grew); the correspondence scales by a factor of 2.5, not by adding 6.
        - |
          17.5 is 2.5 × 7, which is ZX (the image of CA), not YZ.
        - |
          16 is not a multiple of any side by 2.5; YZ corresponds to BC = 6, giving 15.
      answer: 0

    - slug: geo-u03-w12-q09
      type: multiple_choice
      topic_code: "3.7"
      source: "IM Geometry, Unit 3, Lesson 7"
      points: 1
      prompt: |
        Triangle ABC has a right angle at A with AB = 2 and AC = 5. Points D and E lie on rays AB and AC with AD = 6 and AE = 15. Which sequence of transformations shows △ABC ∼ △ADE?
      options:
        - "A single dilation with centre A and scale factor 3"
        - "A dilation with centre B and scale factor 3, then a translation"
        - "A reflection across AC, then a dilation with scale factor 2.5"
        - "A rotation of 90° about A, then a dilation with scale factor 3"
      option_explanations:
        - |
          Correct. With centre A, B goes to the point on ray AB at distance 6 (that is D) and C goes to the point on ray AC at distance 15 (that is E).
        - |
          A dilation centred at B leaves B fixed, so B could never land on D; the shared vertex A is the natural centre.
        - |
          The scale factor is 6/2 = 15/5 = 3, not 2.5, and no reflection is needed since the triangles sit on the same rays.
        - |
          Rotating by 90° would move the sides off rays AB and AC; a dilation from A already carries the triangle onto △ADE.
      answer: 0

    - slug: geo-u03-w12-q10
      type: multiple_choice
      topic_code: "3.7"
      source: "IM Geometry, Unit 3, Lesson 7"
      points: 1
      prompt: |
        Segments AC and BD intersect at O with OA = 4, OC = 10, OB = 6 and OD = 15 (A and C on opposite sides of O, B and D on opposite sides of O). Which sequence carries △OAB onto △OCD?
      options:
        - "Dilate from O by 2.5, then rotate 180° about O"
        - "Dilate from O by 2.5, then translate by the arrow from A to C"
        - "Rotate 90° about O, then dilate from O by 2.5"
        - "Reflect across line AC, then dilate from O by 1.5"
      option_explanations:
        - |
          Correct. The dilation sends A to a point 10 from O on ray OA; a half-turn about O then carries it onto C (the opposite ray), and likewise B's image onto D.
        - |
          After the dilation, A's image is at distance 10 on ray OA; translating by the arrow from A to C moves O as well, and the triangle would no longer have vertex O.
        - |
          A 90° rotation sends ray OA to a ray perpendicular to it, not to the opposite ray OC.
        - |
          The scale factor is 10/4 = 15/6 = 2.5, not 1.5, and a reflection across AC does not send B to the side of line AC where D is.
      answer: 0

    - slug: geo-u03-w12-q11
      type: multiple_choice
      topic_code: "3.8"
      source: "IM Geometry, Unit 3, Lesson 8"
      points: 1
      prompt: |
        Which family of figures is always similar, any member to any other?
      options:
        - "Equilateral triangles"
        - "Rectangles"
        - "Isosceles triangles"
        - "Rhombuses"
      option_explanations:
        - |
          Correct. All angles are 60° and one side length fixes the triangle, so a rigid motion plus a dilation by the ratio of sides matches any two.
        - |
          A 1 × 2 rectangle and a 1 × 3 rectangle have different side ratios, so no scale factor matches them.
        - |
          Isosceles triangles can have different apex angles, and similarity preserves angles.
        - |
          Rhombuses can have any vertex angle; a square and a nearly flat rhombus are not similar.
      answer: 0

    - slug: geo-u03-w12-q12
      type: multiple_choice
      topic_code: "3.8"
      source: "IM Geometry, Unit 3, Lesson 8"
      points: 1
      prompt: |
        A student claims that any two quadrilaterals with four right angles are similar. Which counterexample refutes the claim?
      options:
        - "A 2 × 3 rectangle and a 2 × 5 rectangle"
        - "A 2 × 3 rectangle and a 4 × 6 rectangle"
        - "A square of side 2 and a square of side 5"
        - "A 2 × 3 rectangle and a 3 × 2 rectangle"
      option_explanations:
        - |
          Correct. Both have four right angles, but 3/2 ≠ 5/2 (and 5/3 ≠ 1 for the short sides), so no single scale factor exists.
        - |
          These are similar: 4/2 = 6/3 = 2 is a valid scale factor, so they support rather than refute the claim.
        - |
          All squares are similar (k = 2.5 here), so this pair does not refute the claim.
        - |
          A 2 × 3 and a 3 × 2 rectangle are congruent (rotate by 90°), hence similar.
      answer: 0

    - slug: geo-u03-w12-q13
      type: multiple_choice
      topic_code: "1.10"
      source: "IM Geometry, Unit 1, Lesson 10"
      points: 1
      prompt: |
        Review. Figure A is carried onto figure B by a rotation followed by a dilation with scale factor 1. Which statement is correct?
      options:
        - "A and B are congruent, and therefore also similar"
        - "A and B are similar but not congruent"
        - "A and B are congruent but not similar"
        - "A and B are neither congruent nor similar"
      option_explanations:
        - |
          Correct. A dilation with k = 1 moves nothing, so a rigid motion alone carries A onto B: congruent, and congruent figures are similar with k = 1.
        - |
          Similar-but-not-congruent needs a scale factor other than 1; here k = 1 changes no length.
        - |
          Every congruent pair is similar, because the definition of similarity allows a sequence with no dilation (or k = 1).
        - |
          A rotation is a rigid motion that carries A onto B, which is exactly the definition of congruent.
      answer: 0

    - slug: geo-u03-w12-q14
      type: multiple_choice
      topic_code: "2.3"
      source: "IM Geometry, Unit 2, Lesson 3"
      points: 1
      prompt: |
        Review. △ABC ≅ △PQR. Which pair of parts is guaranteed congruent by the statement?
      options:
        - "∠B and ∠Q"
        - "AB and QR"
        - "∠A and ∠R"
        - "BC and PQ"
      option_explanations:
        - |
          Correct. The letter order pairs B with Q, so the angles at those vertices correspond.
        - |
          AB corresponds to PQ (first two letters), not to QR.
        - |
          ∠A corresponds to ∠P; ∠R corresponds to ∠C.
        - |
          BC corresponds to QR (second and third letters), not to PQ.
      answer: 0

    - slug: geo-u03-w12-q15
      type: multi_select
      topic_code: "3.6"
      source: "IM Geometry, Unit 3, Lesson 6"
      points: 2
      partial_credit: true
      prompt: |
        △ABC ∼ △DEF with scale factor k = 3 (from ABC to DEF). Which statements must be true? Select all that apply.
      options:
        - "∠C = ∠F"
        - "The perimeter of △DEF is 3 times the perimeter of △ABC"
        - "The area of △DEF is 3 times the area of △ABC"
        - "DE/EF = AB/BC"
        - "DE = AB + 3"
      option_explanations:
        - |
          True: corresponding angles of similar triangles are equal, and C ↔ F by the letter order.
        - |
          True: every side is multiplied by 3, so their sum is multiplied by 3.
        - |
          False: area is multiplied by k² = 9, not by 3.
        - |
          True: ratios of lengths within a figure are preserved by a similarity, since both lengths are multiplied by the same k.
        - |
          False: lengths are multiplied by k, not increased by a fixed amount; DE = 3 · AB.
      answer: [0, 1, 3]

    - slug: geo-u03-w12-q16
      type: multi_select
      topic_code: "2.9"
      source: "IM Geometry, Unit 2, Lesson 9"
      points: 2
      partial_credit: true
      prompt: |
        Review. To prove △ABC ∼ △DEF, a student dilates △ABC by k so that the image △A′B′C′ has A′B′ = DE, B′C′ = EF and C′A′ = FD. Which congruence criteria could the student cite to conclude △A′B′C′ ≅ △DEF from exactly this information? Select all that apply.
      options:
        - "SSS"
        - "SAS"
        - "ASA"
        - "AAS"
        - "No criterion applies: three sides never determine a triangle"
      option_explanations:
        - |
          Yes: three pairs of congruent sides is precisely the SSS criterion, proved in Unit 2.
        - |
          No: SAS needs an included angle known to be congruent, and the student has only side information.
        - |
          No: ASA needs two angles and the included side; no angles are given.
        - |
          No: AAS needs two angles; the information here is three sides.
        - |
          No: three sides do determine a triangle (SSS); that is the whole point of the Unit 2 theorem.
      answer: [0]

    - slug: geo-u03-w12-q17
      type: true_false
      topic_code: "1.20"
      source: "IM Geometry, Unit 1, Lesson 20"
      points: 1
      prompt: |
        Review. In triangle ABC, D is on AB and E is on AC with DE ∥ BC. True or false: ∠ADE ≅ ∠ABC because they are corresponding angles formed by transversal AB crossing the parallel lines DE and BC.
      answer: true
      explanation: |
        True. Parallel lines cut by a transversal make congruent corresponding angles (proved by translation in Unit 1). This is why the small triangle ADE has the same angles as ABC, which is the angle half of the similarity.

    - slug: geo-u03-w12-q18
      type: true_false
      topic_code: "1.14"
      source: "IM Geometry, Unit 1, Lesson 14"
      points: 1
      prompt: |
        Review. True or false: a rotation of 180° about a point O maps every line not through O to a line parallel to it.
      answer: true
      explanation: |
        True. A half-turn sends each point P to the point P′ with O the midpoint of PP′; the image of a line is a line, and the two lines make equal alternate angles with any transversal through O, so they are parallel. This is why "dilate, then rotate 180°" produces parallel sides in the bow-tie figure.

    - slug: geo-u03-w12-q19
      type: fill_blank
      topic_code: "3.6"
      source: "IM Geometry, Unit 3, Lesson 6"
      points: 1
      prompt: |
        Two figures are similar when a sequence of rigid motions and ____ carries one onto the other.
      answer: ["dilations", "a dilation", "dilation"]
      explanation: |
        Dilations are the only non-rigid moves in the definition; they change size while preserving angles and ratios.

    - slug: geo-u03-w12-q20
      type: fill_blank
      topic_code: "3.5"
      source: "IM Geometry, Unit 3, Lesson 5"
      points: 1
      prompt: |
        The segment joining the midpoints of two sides of a triangle is parallel to the third side and ____ as long.
      answer: ["half", "1/2", "one half", "one-half"]
      explanation: |
        The midsegment is the image of the third side under the dilation from the shared vertex with scale factor 1/2.

    - slug: geo-u03-w12-q21
      type: numeric
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        In triangle ABC, D is on AB and E is on AC with DE ∥ BC. AD = 10, DB = 14 and DE = 15. What is BC? Give your answer as a decimal.
      answer: { value: 36, tolerance: 0 }
      explanation: |
