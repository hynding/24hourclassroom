      points: 3
      prompt: |
        Review. After a dilation, a similarity proof ends with "△A′B′C′ ≅ △DEF, so a rigid motion carries △A′B′C′ onto △DEF." Describe the standard sequence of rigid motions that carries one triangle onto a congruent triangle, naming what each move achieves and when a reflection is needed.
      answer: |
        Translate by the arrow from A′ to D so the first vertices coincide. Rotate about D by the angle between ray DB′ (the image of A′B′) and ray DE so the second vertices coincide; since A′B′ = DE, the point B′ lands exactly on E. If C′ is now on the same side of line DE as F, it coincides with F (because C′ is the unique point on that side at the given distances from D and E); if it is on the opposite side, reflect across line DE, which fixes D and E and carries C′ onto F.
      explanation: |
        1 point for translation matching one vertex. 1 point for rotation about that vertex matching the second, with the equal side length guaranteeing the match. 1 point for the reflection across the matched side as the conditional final step for the third vertex.
