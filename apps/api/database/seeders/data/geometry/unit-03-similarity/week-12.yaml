      prompt: |
        Triangle ABC has AB = 3, BC = 4, CA = 5. Triangle PQR has PQ = 7.5, QR = 10, RP = 12.5. Write a transformation argument showing △ABC ∼ △PQR. Name the dilation (centre and scale factor), state the congruence criterion you use for the image, and name the correspondence of vertices.
      answer: |
        The ratios 7.5/3, 10/4 and 12.5/5 all equal 2.5. Dilate △ABC from A (any centre works) with scale factor 2.5: the image △A′B′C′ has A′B′ = 7.5, B′C′ = 10, C′A′ = 12.5, which equal PQ, QR, RP. By SSS, △A′B′C′ ≅ △PQR, so a rigid motion carries △A′B′C′ onto △PQR. The dilation followed by that rigid motion carries △ABC onto △PQR, hence △ABC ∼ △PQR with A ↔ P, B ↔ Q, C ↔ R.
      explanation: |
        1 point for checking that all three side ratios equal 2.5 and naming a dilation with that factor. 1 point for citing SSS to get the image congruent to △PQR and invoking a rigid motion. 1 point for the correct vertex correspondence A ↔ P, B ↔ Q, C ↔ R.

    - slug: geo-u03-w12-q25
      type: long_answer
      topic_code: "3.5"
      source: "IM Geometry, Unit 3, Lesson 5"
      points: 6
      prompt: |
        Figure description: triangle ABC. Point D is on side AB and point E is on side AC, and DE is parallel to BC.

        (a) Explain, using a dilation centred at A, why AE/AC = AD/AB. Your explanation must say why E (and not some other point of AC) is the image of C.
        (b) Deduce from (a) that AD/DB = AE/EC.
        (c) Suppose AD = 4, DB = 6 and AC = 25. Find AE and EC, and find DE/BC.
      answer: |
        (a) Let k = AD/AB and dilate from A with scale factor k. A is fixed and B goes to the point on ray AB at distance k · AB = AD, which is D. The dilation sends line BC to a line through D parallel to BC. The parallel to BC through D is unique, and DE is parallel to BC through D, so the image of line BC is line DE. C is on line AC, and its image is on ray AC (lines through the centre map to themselves) and on the image of line BC, which is line DE; those two lines meet only at E, so the image of C is E. Therefore AE = k · AC, i.e. AE/AC = k = AD/AB.
        (b) From AD/AB = AE/AC, invert: AB/AD = AC/AE. Since AB = AD + DB and AC = AE + EC, this reads (AD + DB)/AD = (AE + EC)/AE, so 1 + DB/AD = 1 + EC/AE, hence DB/AD = EC/AE, and inverting again AD/DB = AE/EC.
        (c) AB = 10, so k = 4/10 = 2/5. AE = (2/5)(25) = 10 and EC = 15. Check with (b): AD/DB = 4/6 = 2/3 and AE/EC = 10/15 = 2/3. DE/BC = k = 2/5 = 0.4.
      explanation: |
        Scoring (6 points). (a) 1 point for defining the dilation from A with k = AD/AB and saying B maps to D; 1 point for stating the image of line BC is the parallel line through D, hence line DE; 1 point for the argument that C's image lies on both line AC and line DE, hence is E, giving AE = k · AC. (b) 1 point for a correct algebraic deduction of AD/DB = AE/EC from the whole-side proportion. (c) 1 point for AE = 10 and EC = 15; 1 point for DE/BC = 2/5 with the correct reasoning (whole-side ratio, not AD/DB).
