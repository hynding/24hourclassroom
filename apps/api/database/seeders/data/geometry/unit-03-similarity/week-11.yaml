    - slug: geo-u03-w11-q25
      type: long_answer
      topic_code: "3.4"
      source: "IM Geometry, Unit 3, Lesson 4"
      points: 6
      prompt: |
        Quadrilateral PQRS has P = (1, 1), Q = (5, 1), R = (6, 4), S = (2, 4). A dilation with centre C = (1, 1) and scale factor 2 is applied. (1) Find the image of every vertex. (2) Show that PQ ∥ P′Q′ and QR ∥ Q′R′ or explain why one of these lines is unchanged. (3) Compute the lengths PQ and P′Q′ and the ratio between them. (4) The original quadrilateral is a parallelogram; explain why its image must also be a parallelogram, and find the area of the image given that the original has area 12.
      answer: |
        (1) The centre is P, so P′ = P = (1, 1). For the others, double the arrow from C: Q − C = (4, 0) → (8, 0), so Q′ = (9, 1); R − C = (5, 3) → (10, 6), so R′ = (11, 7); S − C = (1, 3) → (2, 6), so S′ = (3, 7).

        (2) Line PQ is the horizontal line y = 1, which passes through the centre C = (1, 1), so its image is the same line: P′Q′ also lies on y = 1 (P′ = (1, 1), Q′ = (9, 1)). Line QR passes through (5, 1) and (6, 4), slope 3, and does not pass through C (at x = 1 it would have y = −11). Its image Q′R′ passes through (9, 1) and (11, 7), slope (7 − 1)/(11 − 9) = 3. Same slope, different lines, so Q′R′ ∥ QR.

        (3) PQ = 5 − 1 = 4; P′Q′ = 9 − 1 = 8. The ratio P′Q′/PQ = 2 = k, as the definition of dilation requires for every segment.

        (4) A dilation sends every line to a parallel line (or to itself), so PQ ∥ SR implies P′Q′ ∥ S′R′ and PS ∥ QR implies P′S′ ∥ Q′R′. Both pairs of opposite sides of the image are parallel, so the image is a parallelogram by definition. (Check: S′R′ joins (3, 7) and (11, 7), horizontal like P′Q′; P′S′ joins (1, 1) and (3, 7), slope 3 like Q′R′.) Area scales by k² = 4, so the image has area 12 × 4 = 48.
      explanation: |
        Scoring (6 points): 1 for all four images including P′ = P; 1 for recognising PQ passes through the centre and maps to itself; 1 for showing QR and Q′R′ have equal slopes and are distinct; 1 for the lengths 4 and 8 with ratio 2; 1 for the parallelogram argument via parallel images; 1 for area 48 via k².
