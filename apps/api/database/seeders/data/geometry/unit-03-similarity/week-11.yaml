week: 11
unit: 3
title: "Scale Drawings and Dilations"
topics: ["3.1", "3.2", "3.3", "3.4"]
guide: guides/week-11.md
guide_description: |
  Scale factors and scale drawings (lengths scale by k, areas by k², angles not at all), choosing a scale for a
  model of the solar system, and the definition of a dilation by centre and scale factor. Dilating points with a
  ruler, a compass or coordinates, finding the factor and the centre from a figure and its image, and what a
  dilation does to lines (parallel images, or the same line through the centre) and to angles (preserved).
flashcards_description: |
  28 cards on scale factors, scale drawings and models, the definition and construction of dilations, coordinate
  rules, finding the centre and factor, and the effect of a dilation on lines, angles, lengths and areas.

flashcards:
  - front: Scale factor → definition
    back: |
      The number k by which every length of a figure is multiplied to get the corresponding length of the scaled copy. k > 1 enlarges, 0 < k < 1 reduces, k = 1 changes nothing.
    topic_code: "3.1"
  - front: Scale drawing → definition
    back: |
      A drawing in which every length equals the corresponding real length times one fixed scale factor, and every angle equals the real angle. Maps, floor plans and blueprints are scale drawings.
    topic_code: "3.1"
  - front: "Reading a scale such as 1 cm : 4 km → how to convert"
    back: |
      Real length = drawing length × 4 km per cm; drawing length = real length ÷ 4. A 7.5 cm road is 30 km; a 50 km lake is 12.5 cm.
    topic_code: "3.1"
  - front: Area under a scale factor k → rule
    back: |
      Area is multiplied by k², because both dimensions are multiplied by k. At 1 : 50, a 14.7 cm² room on the plan is 14.7 × 2500 = 36,750 cm² in reality.
    topic_code: "3.1"
  - front: Converting between two scale drawings of the same object → method
    back: |
      Either go through the real length, or multiply by the ratio of the scales. From 1 : 200 to 1 : 500 the factor is 200/500 = 0.4, so 15 cm becomes 6 cm.
    topic_code: "3.1"
  - front: Angles in a scale drawing → what happens to them
    back: |
      Nothing: angles are the same in the drawing as in reality. Only lengths (and therefore areas and volumes) are scaled.
    topic_code: "3.1"
  - front: Choosing a scale for a model → the two constraints
    back: |
      The largest distance must fit the available space, and the smallest object must still be visible. The solar system cannot satisfy both at once: at a scale where distances fit a hallway, Earth is a tenth of a millimetre.
    topic_code: "3.2"
  - front: Earth as a 1 cm marble → Sun size and distance
    back: |
      Scale 1 cm : 12,700 km. The Sun (1,390,000 km across) is about 109 cm across, and the Earth–Sun distance (150 million km) is about 118 m. Diagrams that show both to scale are impossible on a page.
    topic_code: "3.2"
  - front: Scaling a distance in a model → computation pattern
    back: |
      Model distance = real distance × (model size ÷ real size of the reference). With a 40 m hallway for 4.5 billion km, Earth's orbit at 150 million km is 40 × 150/4500 ≈ 1.33 m.
    topic_code: "3.2"
  - front: Dilation with centre O and scale factor k → definition
    back: |
      The transformation sending each point P to the point P′ on ray OP with OP′ = k · OP. The centre O is fixed; every other point moves along its ray from O.
    topic_code: "3.3"
  - front: Dilating a point with a compass for k = 2 → construction
    back: |
      Draw the circle centred at P passing through O; it meets ray OP again at P′, and OP′ = 2 · OP because P is the midpoint of OP′. Repeating from P′ gives k = 3.
    topic_code: "3.3"
  - front: Dilating a point for k = 1/2 → construction
    back: |
      Construct the midpoint of OP with the perpendicular bisector (equal circles at O and P). That midpoint is P′, since OP′ = ½ · OP.
    topic_code: "3.3"
  - front: Dilation about the origin → coordinate rule
    back: |
      (x, y) → (kx, ky). With k = 3, (2, 1) → (6, 3). Only valid when the centre is the origin.
    topic_code: "3.3"
  - front: Dilation about a centre (a, b) → coordinate procedure
    back: |
      Subtract the centre, multiply by k, add the centre: (x, y) → (a + k(x − a), b + k(y − b)). Centre (1, 2), k = ½: (7, 5) → (1 + 3, 2 + 1.5) = (4, 3.5).
    topic_code: "3.3"
  - front: Finding the scale factor from a figure and its image → two ways
    back: |
      k = OP′/OP for any point and its image, or k = A′B′/AB for any segment and its image. The two ratios must agree for every point and segment.
    topic_code: "3.3"
  - front: Finding the centre of a dilation → method
    back: |
      Draw the line through a point and its image, and another through a second point and its image; the lines meet at the centre. Every point, its image and the centre are collinear.
    topic_code: "3.3"
  - front: Fixed points of a dilation → which points
    back: |
      Only the centre, for k ≠ 1. A vertex of the figure that happens to be the centre stays where it is; every other point moves.
    topic_code: "3.3"
  - front: Is a dilation a rigid transformation? → answer and reason
    back: |
      No, unless k = 1. Distances are multiplied by k, so they are not preserved. Angles, however, are preserved.
    topic_code: "3.4"
  - front: Image of a line through the centre of dilation → what it is
    back: |
      The same line. Each point of the line moves along the line (its ray from O lies on the line), so the line maps onto itself.
    topic_code: "3.4"
  - front: Image of a line not through the centre of dilation → what it is
    back: |
      A line parallel to the original, k times as far from the centre. On a grid, y = 2x + 3 dilated from the origin by 3 becomes y = 2x + 9.
    topic_code: "3.4"
  - front: Why a dilation preserves angles → reason
    back: |
      The image of each side of the angle lies on a line parallel to the original side. Angles whose sides are respectively parallel are congruent (corresponding angles, used twice), so the image angle equals the original.
    topic_code: "3.4"
  - front: Effect of a dilation on lengths, angles, lines, areas → summary
    back: |
      Lengths × k; angles unchanged; lines to parallel lines (or themselves through the centre); areas × k²; perimeters × k.
    topic_code: "3.4"
  - front: Dilation with the centre at a vertex of the figure → what the image looks like
    back: |
      That vertex stays put and the figure grows or shrinks away from it. A square of side 5 dilated by 2 from vertex A becomes a square of side 10 with the same vertex A and parallel sides.
    topic_code: "3.4"
  - front: Dilated 30-60-90 triangle → what changes and what does not
    back: |
      All three angles stay 30°, 60°, 90°; every side is multiplied by k, so the ratios between sides (hypotenuse twice the short leg) are unchanged.
    topic_code: "3.4"
  - front: Error-spot → scaling area by k
    back: |
      Area scales by k², not k. A 1 : 10 drawing with area 20 cm² represents a real area of 20 × 100 = 2000 cm².
    topic_code: "3.1"
  - front: Error-spot → multiplying coordinates by k when the centre is not the origin
    back: |
      (x, y) → (kx, ky) is a dilation about the origin only. For any other centre, subtract the centre first and add it back afterwards.
    topic_code: "3.3"
  - front: Error-spot → inverting a scale
    back: |
      1 : 50 means the drawing is 1/50 of real size. Real = drawing × 50, drawing = real ÷ 50. A 4.2 cm wall on the plan is 210 cm, not 0.084 cm.
    topic_code: "3.1"
  - front: Which method when → "find the image of a point under a dilation on a grid"
    back: |
      If the centre is the origin, multiply both coordinates by k. Otherwise compute the arrow from the centre to the point, multiply the arrow by k, and add it to the centre.
    topic_code: "3.3"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 3.1 to 3.4: scale drawings, scale models,
    dilations and their effect on lines and angles) with review of Units 1 and 2 (rigid transformations,
    parallel lines, congruence criteria and parallelograms). Multiple choice, select-all, true/false and numeric
    items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
    answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a dilation on a grid (3.3, 3.4)
    - slug: geo-u03-w11-q01
      type: multiple_choice
      topic_code: "3.3"
      source: "IM Geometry, Unit 3, Lesson 3"
      points: 1
      stimulus: |
        Figure description: triangle ABC with A = (2, 2), B = (6, 2), C = (2, 5). A dilation with centre O = (0, 0) and scale factor 1.5 maps it to triangle A′B′C′.
      prompt: |
        What are the coordinates of B′?
      options:
        - "(9, 3)"
        - "(7.5, 3.5)"
        - "(6, 2)"
        - "(4, 1.33)"
      option_explanations:
        - |
          Correct. With the centre at the origin, multiply both coordinates by 1.5: (6 × 1.5, 2 × 1.5) = (9, 3).
        - |
          (7.5, 3.5) adds 1.5 to each coordinate instead of multiplying; that is a translation, not a dilation.
        - |
          B is not the centre, so it moves; only (0, 0) is fixed.
        - |
          (4, 1.33) divides by 1.5, which is a dilation with factor 2/3.
      answer: 0

    - slug: geo-u03-w11-q02
      type: multiple_choice
      topic_code: "3.4"
      source: "IM Geometry, Unit 3, Lesson 4"
      points: 1
      stimulus: |
        Figure description: triangle ABC with A = (2, 2), B = (6, 2), C = (2, 5). A dilation with centre O = (0, 0) and scale factor 1.5 maps it to triangle A′B′C′.
      prompt: |
        Which statement about the image is true?
      options:
        - "A′B′ = 6, ∠A′ = 90°, and line A′B′ is parallel to line AB"
        - "A′B′ = 4, ∠A′ = 90°, and line A′B′ is the same as line AB"
        - "A′B′ = 6, ∠A′ = 135°, and line A′B′ is parallel to line AB"
        - "A′B′ = 5.5, ∠A′ = 90°, and line A′B′ passes through O"
      option_explanations:
        - |
          Correct. AB = 4 becomes 4 × 1.5 = 6; the right angle at A is preserved; the horizontal line y = 2 maps to the parallel line y = 3, which does not pass through O.
        - |
          Lengths are multiplied by 1.5, so A′B′ is 6, and y = 2 does not pass through the centre, so its image is a different (parallel) line.
        - |
          Dilations preserve angles; the right angle stays 90°.
        - |
          A′B′ = 6, not 5.5, and the image line y = 3 does not pass through the origin.
      answer: 0

    - slug: geo-u03-w11-q03
      type: multiple_choice
      topic_code: "3.4"
      source: "IM Geometry, Unit 3, Lesson 4"
      points: 1
      stimulus: |
        Figure description: triangle ABC with A = (2, 2), B = (6, 2), C = (2, 5). A dilation with centre O = (0, 0) and scale factor 1.5 maps it to triangle A′B′C′.
      prompt: |
        The area of triangle ABC is 6. What is the area of triangle A′B′C′?
      options:
        - "13.5"
        - "9"
        - "6"
        - "4"
      option_explanations:
        - |
          Correct. Area scales by k² = 2.25, so 6 × 2.25 = 13.5. Check: legs 6 and 4.5 give ½ × 6 × 4.5 = 13.5.
        - |
          9 = 6 × 1.5 scales the area by k instead of k².
        - |
          Dilations with k ≠ 1 are not rigid; area is multiplied by k² = 2.25, so it changes.
        - |
          4 = 6 ÷ 1.5 would be a reduction, but k = 1.5 enlarges.
      answer: 0

    - slug: geo-u03-w11-q04
      type: multiple_choice
      topic_code: "3.1"
      source: "IM Geometry, Unit 3, Lesson 1"
      points: 1
      prompt: |
        A map has scale 1 cm : 2.5 km. Two villages are 6.8 cm apart on the map. How far apart are they?
      options:
        - "17 km"
        - "2.72 km"
        - "9.3 km"
        - "4.3 km"
      option_explanations:
        - |
          Correct. Real distance = 6.8 × 2.5 = 17 km.
        - |
          2.72 = 6.8 ÷ 2.5 inverts the scale; the map is smaller than reality, so multiply.
        - |
          9.3 = 6.8 + 2.5 adds instead of multiplying.
        - |
          4.3 = 6.8 − 2.5 subtracts, which has no meaning here.
      answer: 0

    - slug: geo-u03-w11-q05
      type: multiple_choice
      topic_code: "3.1"
      source: "IM Geometry, Unit 3, Lesson 1"
      points: 1
      prompt: |
        A floor plan at 1 : 40 shows a room with area 30 cm². What is the real area of the room?
      options:
        - "48,000 cm² (4.8 m²)"
        - "1,200 cm² (0.12 m²)"
        - "0.75 cm²"
        - "1,600 cm² (0.16 m²)"
      option_explanations:
        - |
          Correct. Area scales by 40² = 1600, so 30 × 1600 = 48,000 cm² = 4.8 m².
        - |
          1,200 = 30 × 40 scales by k instead of k².
        - |
          0.75 = 30 ÷ 40 shrinks the area, but reality is larger than the plan.
        - |
          1,600 is k² itself, not the area; it must multiply the 30 cm².
      answer: 0

    - slug: geo-u03-w11-q06
      type: multiple_choice
      topic_code: "3.2"
      source: "IM Geometry, Unit 3, Lesson 2"
      points: 1
      prompt: |
        In a model where Earth (diameter 12,700 km) is a 1 cm ball, the Earth–Sun distance of 150,000,000 km is represented by roughly what length?
      options:
        - "About 118 m"
        - "About 118 cm"
        - "About 11.8 km"
        - "About 1.18 m"
      option_explanations:
        - |
          Correct. 150,000,000 ÷ 12,700 ≈ 11,800, so the distance is about 11,800 cm = 118 m.
        - |
          118 cm is a hundred times too small; the ratio of the distance to Earth's diameter is about 11,800, not 118.
        - |
          11.8 km is a hundred times too large; the model distance is about 11,800 cm, which is 118 m, not 11,800 m.
        - |
          1.18 m is a hundred times too small; 11,800 cm converts to 118 m, not 1.18 m.
      answer: 0

    - slug: geo-u03-w11-q07
      type: multiple_choice
      topic_code: "3.2"
      source: "IM Geometry, Unit 3, Lesson 2"
      points: 1
      prompt: |
        Why can no single scale model on a classroom table show both the sizes of the planets and the distances between them accurately?
      options:
        - "At a scale where the distances fit the table, the planets would be too small to see; at a scale where the planets are visible, the distances would be far longer than the table"
        - "Because the planets move"
        - "Because scale models cannot represent spheres"
        - "Because scale factors only apply to lengths, not distances"
      option_explanations:
        - |
          Correct. The ratio of the Sun–Neptune distance to Earth's diameter is about 350,000, so no single k serves both.
        - |
          Motion is irrelevant to a static model's scale.
        - |
          Spheres scale like any other shape; diameters are lengths.
        - |
          Distances are lengths; the same scale factor applies to both.
      answer: 0

    - slug: geo-u03-w11-q08
      type: multiple_choice
      topic_code: "3.3"
      source: "IM Geometry, Unit 3, Lesson 3"
      points: 1
      prompt: |
        A dilation has centre O = (−2, 1) and scale factor 3. What is the image of P = (1, 3)?
      options:
        - "(7, 7)"
        - "(3, 9)"
        - "(9, 6)"
        - "(1, 7)"
      option_explanations:
        - |
          Correct. The arrow from O to P is (3, 2); tripled it is (9, 6); added to O it gives (7, 7).
        - |
          (3, 9) multiplies the coordinates of P by 3, which is a dilation about the origin, not about (−2, 1).
        - |
          (9, 6) is the tripled arrow but forgets to add the centre back.
        - |
          (1, 7) triples only the vertical part of the arrow.
      answer: 0

    - slug: geo-u03-w11-q09
      type: short_answer
      topic_code: "2.6"
      source: "IM Geometry, Unit 2, Lesson 6"
      points: 3
      prompt: |
        Review. A dilation with centre O and scale factor 2 sends P to P′ and Q to Q′, so OP′ = 2 · OP and OQ′ = 2 · OQ. A student claims △OPQ ≅ △OP′Q′ by SAS, because the two triangles share the angle at O and "have two pairs of proportional sides". Explain what is wrong with the claim, and state what SAS actually requires. Then say whether the two triangles can be congruent at all.
      answer: |
        SAS requires two pairs of sides that are congruent (equal in length) with the included angle congruent. Here OP′ = 2 · OP, so the sides are proportional, not congruent; proportional sides with an equal included angle is the SAS similarity condition, not the SAS congruence criterion. The triangles cannot be congruent: a dilation with k = 2 doubles every length, so P′Q′ = 2 · PQ, and congruent triangles have equal corresponding sides.
      explanation: |
        1 point for identifying that SAS needs congruent (equal) sides, not proportional ones. 1 point for naming the included angle requirement correctly. 1 point for concluding the triangles are not congruent because every length doubles.
    - slug: geo-u03-w11-q10
      type: multiple_choice
      topic_code: "3.3"
      source: "IM Geometry, Unit 3, Lesson 3"
      points: 1
      prompt: |
        A dilation sends segment AB (length 12) to A′B′ (length 9), and OA = 20 where O is the centre. What are the scale factor and OA′?
      options:
        - "k = 3/4 and OA′ = 15"
        - "k = 4/3 and OA′ = 26.7"
        - "k = 3/4 and OA′ = 20"
        - "k = 3 and OA′ = 60"
      option_explanations:
        - |
          Correct. k = A′B′/AB = 9/12 = 3/4, and OA′ = k · OA = 15.
        - |
          4/3 is the inverse ratio AB/A′B′; the image is smaller, so k < 1.
        - |
          The distance from the centre is also multiplied by k, so OA′ ≠ OA.
        - |
          k = 3 would make A′B′ = 3 × 12 = 36, not 9; the image segment is shorter, so k must be less than 1.
      answer: 0

    - slug: geo-u03-w11-q11
      type: multiple_choice
      topic_code: "3.4"
      source: "IM Geometry, Unit 3, Lesson 4"
      points: 1
      prompt: |
        Line m passes through the centre O of a dilation with scale factor 4. What is the image of m?
      options:
        - "Line m itself"
        - "A line parallel to m, four times as far from O"
        - "A line perpendicular to m through O"
        - "A single point"
      option_explanations:
        - |
          Correct. Every point of m moves along m (its ray from O lies on m), so the line maps onto itself.
        - |
          A parallel image occurs only for lines not through the centre; m is at distance 0 from O.
        - |
          Dilations never rotate lines; every image line is parallel to, or identical with, its original.
        - |
          Only the centre is fixed; the other points of m spread out along m.
      answer: 0

    - slug: geo-u03-w11-q12
      type: multiple_choice
      topic_code: "1.20"
      source: "IM Geometry, Unit 1, Lesson 20"
      points: 1
      prompt: |
        Review. A dilation maps ∠PVQ to ∠P′V′Q′, where V′P′ ∥ VP and V′Q′ ∥ VQ. Which Unit 1 theorem explains why the two angles are congruent?
      options:
        - "Corresponding angles of parallel lines are congruent, applied twice (once for each side of the angle)"
        - "Vertical angles are congruent"
        - "The triangle angle sum is 180°"
        - "A 180° rotation maps a line to a parallel line"
      option_explanations:
        - |
          Correct. Sliding across one pair of parallel sides and then the other, the angle measure is carried over unchanged.
        - |
          No crossing lines form vertical angles between the two angles.
        - |
          No triangle is involved in the argument.
        - |
          That fact concerns rotations, not the comparison of two angles with parallel sides.
      answer: 0

    - slug: geo-u03-w11-q13
      type: multiple_choice
      topic_code: "1.10"
      source: "IM Geometry, Unit 1, Lesson 10"
      points: 1
      prompt: |
        Review. Which transformation is NOT rigid?
      options:
        - "A dilation with scale factor 1/2"
        - "A reflection across y = x"
        - "A rotation of 270° about the origin"
        - "A translation by (−5, 8)"
      option_explanations:
        - |
          Correct. Halving every distance is not distance-preserving; dilations with k ≠ 1 are never rigid.
        - |
          Reflections preserve distance between every pair of points, so they are rigid.
        - |
          Rotations preserve distance between every pair of points, so they are rigid.
        - |
          Translations preserve distance between every pair of points, so they are rigid.
      answer: 0

    - slug: geo-u03-w11-q14
      type: multiple_choice
      topic_code: "2.13"
      source: "IM Geometry, Unit 2, Lesson 13"
      points: 1
      prompt: |
        Review. Parallelogram ABCD is dilated from vertex A with scale factor 2 to AB′C′D′. Which statement is true?
      options:
        - "AB′C′D′ is a parallelogram with sides twice as long, and A is unchanged"
        - "AB′C′D′ is a parallelogram with the same side lengths"
        - "AB′C′D′ is not a parallelogram because dilations do not preserve parallelism"
        - "A moves to a new position twice as far from the origin"
      option_explanations:
        - |
          Correct. Dilations send lines to parallel lines, so opposite sides stay parallel; lengths double; the centre A is fixed.
        - |
          Every length is multiplied by the scale factor 2, so the sides are not the same length as before.
        - |
          Dilations do preserve parallelism (each line maps to a parallel line).
        - |
          The centre of a dilation is its fixed point.
      answer: 0

    - slug: geo-u03-w11-q15
      type: multi_select
      topic_code: "3.4"
      source: "IM Geometry, Unit 3, Lesson 4"
      points: 2
      partial_credit: true
      prompt: |
        A dilation with scale factor k = 3 is applied to a figure. Which quantities are preserved (unchanged)? Select all that apply.
      options:
        - "Angle measures"
        - "Side lengths"
        - "Parallelism of lines"
        - "Area"
        - "Ratios of side lengths within the figure"
      option_explanations:
        - |
          Yes: dilations preserve angles, because the image rays are parallel to the original rays.
        - |
          No: every length is multiplied by 3, so side lengths are not preserved.
        - |
          Yes: parallel lines map to parallel lines.
        - |
          No: area is multiplied by k² = 9, so it is not preserved.
        - |
          Yes: every length is multiplied by the same k, so ratios between them are unchanged.
      answer: [0, 2, 4]

    - slug: geo-u03-w11-q16
      type: multi_select
      topic_code: "3.1"
      source: "IM Geometry, Unit 3, Lesson 1"
      points: 2
      partial_credit: true
      prompt: |
        A scale drawing uses the scale 1 : 25. Which statements are true? Select all that apply.
      options:
        - "A real length of 5 m appears as 20 cm"
        - "A drawn length of 3 cm represents 75 cm"
        - "A drawn area of 4 cm² represents 100 cm²"
        - "A real angle of 40° appears as 40°"
        - "A drawn area of 4 cm² represents 2500 cm²"
      option_explanations:
        - |
          True: 5 m is 500 cm, and 500 cm ÷ 25 = 20 cm on the drawing.
        - |
          True: a drawn length of 3 cm represents 3 × 25 = 75 cm in reality.
        - |
          False: area scales by 25² = 625, so 4 cm² represents 2500 cm².
        - |
          True: angles are unchanged in a scale drawing.
        - |
          True: area scales by 25² = 625, so 4 cm² represents 4 × 625 = 2500 cm².
      answer: [0, 1, 3, 4]

    - slug: geo-u03-w11-q17
      type: true_false
      topic_code: "1.21"
      source: "IM Geometry, Unit 1, Lesson 21"
      points: 1
      prompt: |
        Review. True or false: a triangle with angles 40° and 65° is dilated by scale factor 3, and the third angle of the image measures 3 × 75° = 225°.
      answer: false
      explanation: |
        False. The third angle is 180° − 40° − 65° = 75° in both the original and the image. Dilations multiply lengths by k, never angles, and the angle sum of any triangle is 180°, so a 225° angle is impossible.
    - slug: geo-u03-w11-q18
      type: true_false
      topic_code: "1.12"
      source: "IM Geometry, Unit 1, Lesson 12"
      points: 1
      prompt: |
        Review. True or false: if a figure and its image are the same size and every side of the image is parallel to the corresponding side, the transformation might be a translation but cannot be a dilation with k ≠ 1.
      answer: true
      explanation: |
        True. A dilation with k ≠ 1 changes every length. Same size with parallel sides is consistent with a translation (or a 180° rotation, which also sends lines to parallel lines).

    - slug: geo-u03-w11-q19
      type: fill_blank
      topic_code: "3.3"
      source: "IM Geometry, Unit 3, Lesson 3"
      points: 1
      prompt: |
        A dilation is determined by two things: its scale factor and its ____.
      answer: ["centre", "center", "centre point", "center point"]
      explanation: |
        The centre is the fixed point from which every point is pushed outward (k > 1) or pulled inward (k < 1) along its ray.

    - slug: geo-u03-w11-q20
      type: fill_blank
      topic_code: "3.1"
      source: "IM Geometry, Unit 3, Lesson 1"
      points: 1
      prompt: |
        If every length of a figure is multiplied by k, then its area is multiplied by ____.
      answer: ["k²", "k^2", "k squared", "the square of k", "k*k", "k×k"]
      explanation: |
