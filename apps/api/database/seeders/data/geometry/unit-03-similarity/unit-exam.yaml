    - slug: geo-u03-exam-q44
      type: short_answer
      topic_code: "3.7"
      source: "IM Geometry, Unit 3, Lesson 7"
      points: 3
      prompt: |
        Quadrilateral ABCD is a square with side 4. Quadrilateral EFGH is a square with side 10, positioned somewhere else in the plane and tilted. Describe a specific sequence of transformations that carries ABCD onto EFGH, and explain how the sequence proves the two squares are similar.
      answer: |
        Translate ABCD by the arrow from A to E, so A lands on E. Rotate about E by the angle between ray EB′ (the image of AB) and ray EF, so side AB lies along EF (if the square ends up on the wrong side of line EF, reflect across EF). Now dilate from E with scale factor 10/4 = 2.5: side EB″ of length 4 becomes 10 and lands on F, and because every angle is 90° and every side scales to 10, the whole image coincides with EFGH. A sequence of rigid motions and a dilation carries ABCD onto EFGH, which is the definition of similar.
      explanation: |
        1 point for a translation matching a vertex and a rotation (with an optional reflection) aligning a side. 1 point for a dilation with scale factor 2.5 centred at the matched vertex. 1 point for explaining that the sequence meets the definition of similarity (rigid motions plus a dilation carrying one onto the other), using the right angles and equal sides to justify the full match.

    - slug: geo-u03-exam-q45
      type: short_answer
      topic_code: "3.11"
      source: "IM Geometry, Unit 3, Lesson 11"
      points: 3
      prompt: |
        Three parallel lines cross two transversals. On the first transversal the parallels cut off segments of lengths 5 and 8 (in that order). On the second transversal the first segment has length 7. Find the second segment on the second transversal, and explain, using a diagonal and the side-splitter theorem, why the proportion you used is valid.
      answer: |
        The second segment is x with x/7 = 8/5, so x = 11.2. Justification: draw the diagonal from the top point of the first transversal to the bottom point of the second transversal. It crosses the middle parallel line at some point M, creating two triangles. In the upper triangle the middle parallel is parallel to the third side, so by the side-splitter theorem it divides the first transversal and the diagonal in the same ratio: 5/8 = (upper piece of the diagonal)/(lower piece of the diagonal). In the lower triangle the same theorem gives (upper piece)/(lower piece) = 7/x. Hence 5/8 = 7/x and x = 56/5 = 11.2.
      explanation: |
        1 point for x = 11.2. 1 point for drawing a diagonal to create two triangles each with a parallel to one side. 1 point for applying the side-splitter theorem in both triangles through the shared ratio on the diagonal.

    - slug: geo-u03-exam-q46
      type: long_answer
      topic_code: "3.14"
      source: "IM Geometry, Unit 3, Lesson 14"
      points: 8
      prompt: |
        Figure description: right triangle ABC with the right angle at C. The altitude from C meets the hypotenuse AB at H. Let AH = p, HB = q, AB = c, BC = a, AC = b and CH = h.

        (a) Prove that △ACH ∼ △ABC and △CBH ∼ △ABC, naming the criterion and the angle facts.
        (b) Derive b² = pc and a² = qc from those similarities.
        (c) Use (b) to prove a² + b² = c².
        (d) Derive h² = pq, and verify all three relations numerically when p = 9 and q = 16.
      answer: |
        (a) △ACH and △ABC share ∠A, and ∠AHC = 90° = ∠ACB. Two congruent angle pairs give △ACH ∼ △ABC by AA. Likewise △CBH and △ABC share ∠B and have right angles at H and C, so △CBH ∼ △ABC by AA.
        (b) From △ACH ∼ △ABC (A ↔ A, C ↔ B, H ↔ C): AC/AB = AH/AC, so AC² = AH · AB, i.e. b² = pc. From △CBH ∼ △ABC (C ↔ A, B ↔ B, H ↔ C): BC/AB = BH/BC, so BC² = BH · AB, i.e. a² = qc.
        (c) Adding, a² + b² = qc + pc = (p + q)c. Since H lies on segment AB, p + q = AH + HB = AB = c, so a² + b² = c · c = c².
        (d) Both small triangles are similar to △ABC, hence to each other: △ACH ∼ △CBH with A ↔ C, C ↔ B, H ↔ H, giving AH/CH = CH/BH, so h² = pq. With p = 9, q = 16: c = 25, h² = 144 so h = 12, b² = 9 · 25 = 225 so b = 15, a² = 16 · 25 = 400 so a = 20, and 15² + 20² = 225 + 400 = 625 = 25².
      explanation: |
        Scoring (8 points). (a) 1 point for each similarity with AA and the correct angle facts (2 points). (b) 1 point for each leg relation with the correct correspondence written out (2 points). (c) 1 point for adding and factoring; 1 point for p + q = c with the reason (H lies on the hypotenuse). (d) 1 point for h² = pq from the similarity of the two small triangles; 1 point for the numerical check h = 12, b = 15, a = 20, 225 + 400 = 625.
