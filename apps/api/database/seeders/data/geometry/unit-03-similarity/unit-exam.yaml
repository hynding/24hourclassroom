unit: 3
description: |
  46 questions · about 85 minutes · covers every lesson of Unit 3 (scale drawings, dilations, the definition
  of similarity, AA, SAS and SSS similarity, the side-splitter theorem and its converse, the altitude to the
  hypotenuse, the Pythagorean theorem and its converse, special right triangles, indirect measurement and
  the bank shot) with some review of Units 1 and 2. Multiple choice, select-all, true/false and numeric items
  are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer
  are graded by your teacher against the scoring notes.
questions:
    - slug: geo-u03-exam-q01
      type: multiple_choice
      topic_code: "3.3"
      source: "IM Geometry, Unit 3, Lesson 3"
      points: 1
      stimulus: |
        Figure description: on a coordinate grid, triangle PQR has vertices P = (1, 1), Q = (7, 1) and R = (1, 5). It is dilated with centre P and scale factor 1/2 to triangle PQ′R′.
      prompt: |
        What are the coordinates of Q′ and R′?
      options:
        - "Q′ = (4, 1) and R′ = (1, 3)"
        - "Q′ = (3.5, 0.5) and R′ = (0.5, 2.5)"
        - "Q′ = (14, 1) and R′ = (1, 9)"
        - "Q′ = (4, 0) and R′ = (0, 3)"
      option_explanations:
        - |
          Correct. From P, the arrow to Q is (6, 0), halved to (3, 0), so Q′ = (4, 1); the arrow to R is (0, 4), halved to (0, 2), so R′ = (1, 3).
        - |
          These halve the coordinates themselves, which is a dilation from the origin, not from P.
        - |
          These double the arrows (k = 2); the scale factor here is 1/2.
        - |
          These halve the arrows but forget to add P back: the images must lie on rays from P, not from the origin.
      answer: 0

    - slug: geo-u03-exam-q02
      type: multiple_choice
      topic_code: "3.4"
      source: "IM Geometry, Unit 3, Lesson 4"
      points: 1
      stimulus: |
        Figure description: on a coordinate grid, triangle PQR has vertices P = (1, 1), Q = (7, 1) and R = (1, 5). It is dilated with centre P and scale factor 1/2 to triangle PQ′R′.
      prompt: |
        Which statement about segment Q′R′ is correct?
      options:
        - "Q′R′ ∥ QR and Q′R′ = ½ · QR"
        - "Q′R′ ∥ QR and Q′R′ = QR"
        - "Q′R′ ⊥ QR and Q′R′ = ½ · QR"
        - "Q′R′ passes through P"
      option_explanations:
        - |
          Correct. QR does not pass through the centre P, so its image is parallel to it, and every length is multiplied by 1/2.
        - |
          The length is halved: QR = √(36 + 16) = √52, while Q′R′ = √(9 + 4) = √13 = ½√52.
        - |
          Dilations never produce perpendicular images of lines; the image line is parallel.
        - |
          Only lines through the centre map to themselves; QR, and hence Q′R′, does not pass through P.
      answer: 0

    - slug: geo-u03-exam-q03
      type: multiple_choice
      topic_code: "3.6"
      source: "IM Geometry, Unit 3, Lesson 6"
      points: 1
      stimulus: |
        Figure description: on a coordinate grid, triangle PQR has vertices P = (1, 1), Q = (7, 1) and R = (1, 5). It is dilated with centre P and scale factor 1/2 to triangle PQ′R′.
      prompt: |
        The area of triangle PQR is 12. What is the area of triangle PQ′R′?
      options:
        - "3"
        - "6"
        - "24"
        - "12"
      option_explanations:
        - |
          Correct. Area scales by k² = 1/4, so 12 × 1/4 = 3. Check: legs 3 and 2 give ½ · 3 · 2 = 3.
        - |
          6 scales the area by k instead of k²; both the base and the height are halved.
        - |
          24 doubles the area; a scale factor of 1/2 shrinks the figure.
        - |
          The area changes because dilations with k ≠ 1 are not rigid.
      answer: 0

    - slug: geo-u03-exam-q04
      type: multiple_choice
      topic_code: "3.1"
      source: "IM Geometry, Unit 3, Lesson 1"
      points: 1
      prompt: |
        A floor plan is drawn at 1 : 40. A room measures 9 cm by 6 cm on the plan. What is the real area of the room?
      options:
        - "8.64 m²"
        - "0.216 m²"
        - "21.6 m²"
        - "216 m²"
      option_explanations:
        - |
          Correct. Real dimensions are 360 cm by 240 cm, i.e. 3.6 m by 2.4 m, so the area is 8.64 m² (equivalently 54 cm² × 40² = 86,400 cm²).
        - |
          0.216 scales the plan area by 40 once (54 × 40 = 2160 cm²) and then converts; areas scale by 40² = 1600.
        - |
          21.6 multiplies a real length (3.6 m) by a plan length (6 cm read as 6 m), mixing the two scales.
        - |
          216 is 3.6 × 60, using a wrong real width; the real width is 6 × 40 = 240 cm = 2.4 m.
      answer: 0

    - slug: geo-u03-exam-q05
      type: multiple_choice
      topic_code: "3.2"
      source: "IM Geometry, Unit 3, Lesson 2"
      points: 1
      prompt: |
        A model of the solar system uses a 2 cm ball for Earth (diameter about 12,700 km). About how far from the Sun should the Earth ball be placed, given the real distance is about 150,000,000 km?
      options:
        - "About 236 m"
        - "About 118 m"
        - "About 2.36 m"
        - "About 23.6 km"
      option_explanations:
        - |
          Correct. 150,000,000 ÷ 12,700 ≈ 11,800 Earth diameters, and 11,800 × 2 cm ≈ 23,600 cm ≈ 236 m.
        - |
          118 m is the answer for a 1 cm Earth; doubling the Earth doubles every model distance.
        - |
          2.36 m is a hundred times too small; 23,600 cm is 236 m.
        - |
          23.6 km is a hundred times too large; the model distance is 23,600 cm, not 23,600 m.
      answer: 0

    - slug: geo-u03-exam-q06
      type: multiple_choice
      topic_code: "3.3"
      source: "IM Geometry, Unit 3, Lesson 3"
      points: 1
      prompt: |
        A dilation sends A = (2, 3) to A′ = (8, 9) and B = (4, 3) to B′ = (14, 9). What are the centre and scale factor?
      options:
        - "Centre (−1, 0), k = 3"
        - "Centre (0, 0), k = 3"
        - "Centre (2, 3), k = 3"
        - "Centre (−1, 0), k = 2"
      option_explanations:
        - |
          Correct. AB = 2 and A′B′ = 6 give k = 3. Lines AA′ (direction (6, 6)) and BB′ (direction (10, 6)) meet at (−1, 0), and the check works: (−1, 0) + 3 · (3, 3) = (8, 9) and (−1, 0) + 3 · (5, 3) = (14, 9).
        - |
          With centre (0, 0) and k = 3, A would go to (6, 9) and B to (12, 9), not to (8, 9) and (14, 9).
        - |
          If the centre were A itself, A would be fixed; but A moves to (8, 9).
        - |
          k = 2 would make A′B′ = 4, but A′B′ = 14 − 8 = 6, so k = 3.
      answer: 0

    - slug: geo-u03-exam-q07
      type: multiple_choice
      topic_code: "3.4"
      source: "IM Geometry, Unit 3, Lesson 4"
      points: 1
      prompt: |
        The line y = 3x − 2 is dilated from the origin with scale factor 2. Which line is the image?
      options:
        - "y = 3x − 4"
        - "y = 6x − 4"
        - "y = 3x − 2"
        - "y = 3x − 1"
      option_explanations:
        - |
          Correct. The image is parallel (same slope 3), and the y-intercept (0, −2) maps to (0, −4).
        - |
          Dilations do not change slopes; the image of a line is parallel to it.
        - |
          The line does not pass through the centre (0, 0), so it does not map to itself.
        - |
          The intercept (0, −2) is doubled away from the origin to (0, −4), not halved to (0, −1).
      answer: 0

    - slug: geo-u03-exam-q08
      type: multiple_choice
      topic_code: "3.5"
      source: "IM Geometry, Unit 3, Lesson 5"
      points: 1
      prompt: |
        In triangle ABC, D is on AB and E is on AC with DE ∥ BC. AD = 7, DB = 21 and AC = 32. What is EC?
      options:
        - "24"
        - "8"
        - "28"
        - "4"
      option_explanations:
        - |
          Correct. AD/AB = 7/28 = 1/4, so AE = 8 and EC = 32 − 8 = 24. (Or AD/DB = AE/EC = 1/3 with AE + EC = 32.)
        - |
          8 is AE, the piece of AC next to A; the question asks for the other piece, EC = 32 − 8.
        - |
          28 is AB; EC is three quarters of AC = 32, which is 24.
        - |
          4 would be AE if k were 1/8; the scale factor is AD/AB = 1/4.
      answer: 0

    - slug: geo-u03-exam-q09
      type: multiple_choice
      topic_code: "3.5"
      source: "IM Geometry, Unit 3, Lesson 5"
      points: 1
      prompt: |
        The three midsegments of a triangle with perimeter 36 form a smaller triangle. What is its perimeter?
      options:
        - "18"
        - "12"
        - "9"
        - "24"
      option_explanations:
        - |
          Correct. Each midsegment is half of a side, so the midsegment triangle's perimeter is half of 36.
        - |
          12 is a third of the perimeter; midsegments halve lengths, they do not divide them by 3.
        - |
          9 is a quarter of 36, which is the area ratio k² = 1/4, not the length ratio 1/2.
        - |
          24 is two thirds of the perimeter, which does not correspond to any midsegment ratio.
      answer: 0

    - slug: geo-u03-exam-q10
      type: multiple_choice
      topic_code: "3.6"
      source: "IM Geometry, Unit 3, Lesson 6"
      points: 1
      prompt: |
        Which statement correctly describes the relationship between congruent and similar figures?
      options:
        - "Every pair of congruent figures is similar, with scale factor 1"
        - "Every pair of similar figures is congruent"
        - "Congruent and similar are unrelated properties"
        - "Figures are similar only when they are congruent after a rotation"
      option_explanations:
        - |
          Correct. The definition of similarity allows a sequence with no dilation (or k = 1), which is exactly congruence.
        - |
          Similar figures with k ≠ 1 differ in size and are not congruent.
        - |
          Congruence is a special case of similarity, so they are closely related.
        - |
          Similarity allows any rigid motions together with dilations, not only rotations.
      answer: 0

    - slug: geo-u03-exam-q11
      type: multiple_choice
      topic_code: "3.6"
      source: "IM Geometry, Unit 3, Lesson 6"
      points: 1
      prompt: |
        △KLM ∼ △RST with KL = 6, LM = 8, MK = 11 and ST = 20. What is RS?
      options:
        - "15"
        - "27.5"
        - "18"
        - "22"
      option_explanations:
        - |
          Correct. LM ↔ ST gives k = 20/8 = 2.5, and RS corresponds to KL, so RS = 2.5 × 6 = 15.
        - |
          27.5 is 2.5 × 11, which is TR (the image of MK), not RS.
        - |
          18 adds 12 to 6 because ST is 12 more than LM; the relationship is a ratio of 2.5, not a difference of 12.
        - |
          22 doubles 11, using both the wrong side and the wrong factor.
      answer: 0

    - slug: geo-u03-exam-q12
      type: multiple_choice
      topic_code: "3.7"
      source: "IM Geometry, Unit 3, Lesson 7"
      points: 1
      prompt: |
        △ABC has AB = 4, BC = 5, CA = 6. △DEF has DE = 10, EF = 12, FD = 8. Which transformation argument shows they are similar, and what is the correspondence?
      options:
        - "Dilate △ABC by k = 2; the image has sides 8, 10, 12, so SSS gives a rigid motion onto △DEF with A ↔ E, B ↔ F, C ↔ D"
        - "Dilate △ABC by k = 2; the image has sides 8, 10, 12, so SSS gives a rigid motion onto △DEF with A ↔ D, B ↔ E, C ↔ F"
        - "Dilate △ABC by k = 2.5; the image has sides 10, 12.5, 15, so the triangles are similar"
        - "The triangles are not similar because 10/4 ≠ 12/5"
      option_explanations:
        - |
          Correct. AB = 4 ↔ FD = 8, BC = 5 ↔ DE = 10, CA = 6 ↔ EF = 12; the shared letters give A ↔ E, B ↔ F, C ↔ D.
        - |
          With A ↔ D, B ↔ E, C ↔ F, AB would pair with DE, but 10/4 ≠ 2; the sides must be matched by size.
        - |
          k = 2.5 gives sides 10, 12.5, 15, which are not the sides of △DEF.
        - |
          10/4 compares non-corresponding sides; matching by size, every ratio is 2.
      answer: 0

    - slug: geo-u03-exam-q13
      type: multiple_choice
      topic_code: "3.8"
      source: "IM Geometry, Unit 3, Lesson 8"
      points: 1
      prompt: |
        Which family of figures is NOT always similar, any member to any other?
      options:
        - "Right triangles"
        - "Circles"
        - "Squares"
        - "Regular octagons"
      option_explanations:
        - |
          Correct. Right triangles can have different acute angles (for example 30-60-90 and 45-45-90), and similarity preserves angles.
        - |
          All circles are similar: translate the centres together and dilate by the ratio of radii.
        - |
          All squares are similar: a rigid motion matches a corner and a dilation by the ratio of sides finishes.
        - |
          All regular octagons are similar: all angles are 135° and one side length fixes the figure.
      answer: 0

    - slug: geo-u03-exam-q14
      type: multiple_choice
      topic_code: "3.9"
      source: "IM Geometry, Unit 3, Lesson 9"
      points: 1
      stimulus: |
        Figure description: right triangle ABC with the right angle at C, AC = 8 and BC = 15. The altitude from C meets the hypotenuse AB at H.
      prompt: |
        What is the length of the hypotenuse AB, and which triangles are similar to △ABC?
      options:
        - "AB = 17; both △ACH and △CBH are similar to △ABC"
        - "AB = 17; only △ACH is similar to △ABC"
        - "AB = 23; both △ACH and △CBH are similar to △ABC"
        - "AB = 17; neither small triangle is similar to △ABC"
      option_explanations:
        - |
          Correct. √(64 + 225) = 17, and each small triangle shares an acute angle with △ABC and has a right angle (AA).
        - |
          △CBH shares ∠B with △ABC and has a right angle at H, so it is similar too.
        - |
          23 is 8 + 15; the hypotenuse is √(8² + 15²) = 17.
        - |
          Both small triangles are similar to the whole by AA; that is what produces the geometric-mean relations.
      answer: 0

    - slug: geo-u03-exam-q15
      type: multiple_choice
      topic_code: "3.13"
      source: "IM Geometry, Unit 3, Lesson 13"
      points: 1
      stimulus: |
        Figure description: right triangle ABC with the right angle at C, AC = 8 and BC = 15. The altitude from C meets the hypotenuse AB at H.
      prompt: |
        What is the length of CH?
      options:
        - "120/17"
        - "17/2"
        - "√120"
        - "60/17"
      option_explanations:
        - |
          Correct. Area two ways: ½ · 8 · 15 = ½ · 17 · CH, so CH = 120/17 ≈ 7.06.
        - |
          17/2 is half the hypotenuse, the length of the median to the hypotenuse, not the altitude.
        - |
          √120 treats the legs as the pieces of the hypotenuse in h² = pq; the pieces are 64/17 and 225/17.
        - |
          60/17 forgets to double: the area is 60, and 60 = ½ · 17 · h gives h = 120/17.
      answer: 0

    - slug: geo-u03-exam-q16
      type: multiple_choice
      topic_code: "3.13"
      source: "IM Geometry, Unit 3, Lesson 13"
      points: 1
      stimulus: |
        Figure description: right triangle ABC with the right angle at C, AC = 8 and BC = 15. The altitude from C meets the hypotenuse AB at H.
      prompt: |
        What is the length of AH?
      options:
        - "64/17"
        - "225/17"
        - "8"
        - "4"
      option_explanations:
        - |
          Correct. △ACH ∼ △ABC gives AC² = AH · AB, so AH = 64/17 ≈ 3.76.
        - |
          225/17 is HB (from BC² = HB · AB), the piece next to the longer leg.
        - |
          8 is the leg AC; the piece AH is shorter than AC, since AC is the hypotenuse of △ACH.
        - |
          4 is half of AC, which has no role here; the piece is AC²/AB.
      answer: 0

    - slug: geo-u03-exam-q17
      type: multiple_choice
      topic_code: "3.9"
      source: "IM Geometry, Unit 3, Lesson 9"
      points: 1
      prompt: |
        Lines AB and CD are parallel, and segments AD and BC cross at O. OA = 9, OD = 6 and OB = 12. What is OC?
      options:
        - "8"
        - "18"
        - "4.5"
        - "15"
      option_explanations:
        - |
          Correct. △OAB ∼ △ODC (vertical and alternate interior angles) with OA ↔ OD and OB ↔ OC, so OC/OB = OD/OA = 6/9 and OC = 8.
        - |
          18 pairs OC with OA instead of OB; the alternate interior angles put A opposite D and B opposite C.
        - |
          4.5 uses 9/12 as the factor on 6, mixing the two transversals.
        - |
          15 adds 3 to 12 because OA is 3 more than OD; the relation is a ratio of 2/3, not a difference.
      answer: 0

    - slug: geo-u03-exam-q18
      type: multiple_choice
      topic_code: "3.10"
      source: "IM Geometry, Unit 3, Lesson 10"
      points: 1
      prompt: |
        △ABC has AB = 6, BC = 9 and ∠B = 40°. Which triangle is similar to △ABC by SAS∼?
      options:
        - "△DEF with DE = 4, EF = 6 and ∠E = 40°"
        - "△DEF with DE = 4, EF = 6 and ∠D = 40°"
        - "△DEF with DE = 4, EF = 7 and ∠E = 40°"
        - "△DEF with DE = 6, EF = 9 and ∠F = 40°"
      option_explanations:
        - |
          Correct. 4/6 = 6/9 = 2/3, and ∠E is included between DE and EF just as ∠B is between AB and BC.
        - |
          The angle at D is not between DE and EF; this is SSA, which is not a criterion.
        - |
          4/6 ≠ 7/9, so the sides are not proportional.
        - |
          The sides match but the 40° angle is at F, not included between DE and EF; the triangle may not be congruent to △ABC.
      answer: 0

    - slug: geo-u03-exam-q19
      type: multiple_choice
      topic_code: "3.10"
      source: "IM Geometry, Unit 3, Lesson 10"
      points: 1
      prompt: |
        Which set of side lengths gives a triangle similar to one with sides 8, 12, 18?
      options:
        - "12, 18, 27"
        - "10, 14, 20"
        - "16, 24, 32"
        - "4, 6, 8"
      option_explanations:
        - |
          Correct. 12/8 = 18/12 = 27/18 = 1.5, so SSS∼ applies.
        - |
          Adding 2 to each side is not a dilation: 10/8 = 1.25 but 14/12 ≈ 1.17.
        - |
          16/8 = 24/12 = 2 but 32/18 ≈ 1.78; the longest side breaks the proportion.
        - |
          4/8 = 6/12 = 0.5 but 8/18 ≈ 0.44, so the ratios are not all equal.
      answer: 0

    - slug: geo-u03-exam-q20
      type: multiple_choice
      topic_code: "3.11"
      source: "IM Geometry, Unit 3, Lesson 11"
      points: 1
      prompt: |
        In triangle ABC, D is on AB and E is on AC. For which values is DE ∥ BC guaranteed?
      options:
        - "AD = 6, DB = 9, AE = 8, EC = 12"
        - "AD = 6, DB = 9, AE = 8, EC = 11"
        - "AD = 6, DB = 9, AE = 9, EC = 6"
        - "AD = 6, DB = 9, AE = 6, EC = 8"
      option_explanations:
        - |
          Correct. 6/9 = 8/12 = 2/3, so the converse of the side-splitter theorem gives DE ∥ BC.
        - |
          8/11 ≈ 0.73 ≠ 2/3, so the sides are not cut proportionally.
        - |
          9/6 = 1.5 ≠ 2/3; the pieces are in the inverted ratio.
        - |
          6/8 = 0.75 ≠ 2/3, so the converse does not apply.
      answer: 0

    - slug: geo-u03-exam-q21
      type: multiple_choice
      topic_code: "3.11"
      source: "IM Geometry, Unit 3, Lesson 11"
      points: 1
      prompt: |
        In the proof of the converse of the side-splitter theorem, after showing △ADE ∼ △ABC by SAS∼, which fact finishes the proof that DE ∥ BC?
      options:
        - "∠ADE = ∠ABC are congruent corresponding angles for transversal AB, so the lines are parallel by the converse of the corresponding angles theorem"
        - "DE = ½ BC, so DE is a midsegment"
        - "Similar triangles always have parallel sides"
        - "∠ADE and ∠ABC are supplementary"
      option_explanations:
        - |
          Correct. Similarity gives the equal angles; the parallel-lines converse turns equal corresponding angles into parallel lines.
        - |
          D and E need not be midpoints; the proof covers any proportional division.
        - |
          Similar triangles can be placed in any orientation; parallelism needs the angle argument with a transversal.
        - |
          The angles are equal, not supplementary; supplementary co-interior angles would be ∠BDE and ∠ABC.
      answer: 0

    - slug: geo-u03-exam-q22
      type: multiple_choice
      topic_code: "3.12"
      source: "IM Geometry, Unit 3, Lesson 12"
      points: 1
      prompt: |
        A 1.5 m post casts a 2.5 m shadow at the same moment a tower casts a 40 m shadow. How tall is the tower?
      options:
        - "24 m"
        - "66.7 m"
        - "39 m"
        - "60 m"
      option_explanations:
        - |
          Correct. Height/shadow is the same for both (AA from parallel sun rays): 40 × 1.5/2.5 = 24 m.
        - |
          66.7 inverts the ratio (40 × 2.5/1.5); the post is shorter than its shadow, so the tower is too.
        - |
          39 subtracts 1 m because the post is 1 m shorter than its shadow; the relation is multiplicative.
        - |
          60 multiplies 40 by 1.5 without dividing by 2.5.
      answer: 0

    - slug: geo-u03-exam-q23
      type: multiple_choice
      topic_code: "3.12"
      source: "IM Geometry, Unit 3, Lesson 12"
      points: 1
      prompt: |
        Triangles ABC and ABD share side AB, with C on segment AD, and ∠ABC = ∠ADB. If AC = 4 and CD = 5, what is AB?
      options:
        - "6"
        - "4.5"
        - "√20"
        - "9"
      option_explanations:
        - |
          Correct. △ABC ∼ △ADB (shared ∠A, given angle pair), so AB/AD = AC/AB and AB² = 4 × 9 = 36.
        - |
          4.5 is the average of 4 and 5; AB is the geometric mean of AC and AD = 9, not an average.
        - |
          √20 uses AC · CD; the proportion involves the whole segment AD = 9, giving AB² = 36.
        - |
          9 is AD itself; AB is shorter, since AB² = AC · AD = 36.
      answer: 0

    - slug: geo-u03-exam-q24
      type: multiple_choice
      topic_code: "3.14"
      source: "IM Geometry, Unit 3, Lesson 14"
      points: 1
      prompt: |
        In the similar-triangles proof of the Pythagorean theorem, the two relations a² = qc and b² = pc are added. Which fact then gives c²?
      options:
        - "p + q = c, because H lies on the hypotenuse between A and B"
        - "p · q = h², the altitude relation"
        - "p = q, because the altitude bisects the hypotenuse"
        - "a + b = c"
      option_explanations:
        - |
          Correct. a² + b² = (p + q)c, and the two pieces of the hypotenuse add up to the whole hypotenuse c.
        - |
          The altitude relation is true but is not used in the sum; the proof needs only p + q = c.
        - |
          The altitude bisects the hypotenuse only in an isosceles right triangle; the proof works for every right triangle.
        - |
          a + b = c is false for any triangle (the triangle inequality gives a + b > c).
      answer: 0

    - slug: geo-u03-exam-q25
      type: multiple_choice
      topic_code: "3.14"
      source: "IM Geometry, Unit 3, Lesson 14"
      points: 1
      prompt: |
        A triangle has sides 9, 40 and 41. Which statement is correct?
      options:
        - "It is a right triangle, by the converse of the Pythagorean theorem, since 81 + 1600 = 1681"
        - "It is a right triangle, by the Pythagorean theorem"
        - "It is not a right triangle, because 9 + 40 ≠ 41"
        - "It is an obtuse triangle, because 41 is much larger than 9"
      option_explanations:
        - |
          Correct. 9² + 40² = 41² and the converse turns the equation into a right angle opposite the side 41.
        - |
          The Pythagorean theorem goes from a right angle to the equation; going the other way is its converse.
        - |
          Side lengths are not supposed to add; the test is on the squares.
