week: 13
unit: 3
title: "Triangle Similarity Criteria"
topics: ["3.9", "3.10", "3.11", "3.12"]
guide: guides/week-13.md
guide_description: |
  The AA, SAS and SSS similarity criteria with their dilate-then-congruence proofs, the side-splitter theorem and its converse, and the standard similar-triangle figures (nested, bow-tie, overlapping, shadows, mirrors, river widths). Worked examples, Try-it problems and a self-check.
flashcards_description: |
  28 cards on the three similarity criteria, why SSA and AAA are not criteria, the side-splitter theorem and converse, three-parallel-lines proportions and the indirect-measurement setups. Review them before the week 13 quiz.
flashcards:
  - front: AA similarity criterion → statement
    back: |
      If two angles of one triangle are congruent to two angles of another, the triangles are similar. The third pair is automatic by the 180° angle sum.
    topic_code: "3.9"
  - front: AA similarity criterion → proof idea
    back: |
      Dilate the first triangle by k = DE/AB so one side matches; angles are preserved, so ASA makes the image congruent to the second triangle; a rigid motion finishes.
    topic_code: "3.9"
  - front: Why "AAA" is not listed as a separate criterion
    back: |
      Two equal angles force the third by the angle sum, so AAA says nothing beyond AA.
    topic_code: "3.9"
  - front: Sources of equal angles for AA
    back: |
      A shared vertex angle, vertical angles, corresponding or alternate interior angles of parallel lines, right angles, angles marked congruent.
    topic_code: "3.9"
  - front: Nested similar triangles → correspondence
    back: |
      If D is on AB, E is on AC and ∠ADE = ∠ABC, then △ADE ∼ △ABC with A ↔ A, D ↔ B, E ↔ C (shared angle A plus the given pair).
    topic_code: "3.9"
  - front: Bow-tie similar triangles → correspondence when AB ∥ CD and AD, BC cross at O
    back: |
      △OAB ∼ △ODC with O ↔ O, A ↔ D, B ↔ C: vertical angles at O and alternate interior angles from the parallels. OA pairs with OD, OB with OC.
    topic_code: "3.9"
  - front: Altitude to the hypotenuse of a right triangle → similar triangles
    back: |
      The altitude from the right angle splits the triangle into two triangles each similar to the whole (shared acute angle plus a right angle, AA) and to each other.
    topic_code: "3.9"
  - front: SAS similarity criterion → statement
    back: |
      If AB/DE = AC/DF and the included angles ∠A and ∠D are congruent, then △ABC ∼ △DEF.
    topic_code: "3.10"
  - front: SAS similarity criterion → proof idea
    back: |
      Dilate △ABC by k = DE/AB; the image has two sides equal to DE and DF with the same included angle; SAS congruence, then a rigid motion.
    topic_code: "3.10"
  - front: SSS similarity criterion → statement
    back: |
      If all three ratios of corresponding sides are equal, AB/DE = BC/EF = CA/FD, then the triangles are similar.
    topic_code: "3.10"
  - front: SSS similarity criterion → proof idea
    back: |
      Dilate by k = DE/AB; all three image sides equal those of △DEF; SSS congruence, then a rigid motion.
    topic_code: "3.10"
  - front: SSA for similarity → does it work?
    back: |
      No. Two proportional sides with a non-included angle can give two different triangles, just as SSA fails for congruence.
    topic_code: "3.10"
  - front: Choosing the criterion → what to count
    back: |
      Two angle pairs: AA. Two equal side ratios with the included angle: SAS∼. Three equal side ratios: SSS∼. Anything else: look for more information.
    topic_code: "3.10"
  - front: Sides 4, 6, 7 and 6, 9, 10 → similar?
    back: |
      No. 6/4 = 1.5 and 9/6 = 1.5 but 10/7 ≈ 1.43; SSS∼ needs all three ratios equal.
    topic_code: "3.10"
  - front: Side-splitter theorem → statement
    back: |
      A line parallel to one side of a triangle that meets the other two sides divides them proportionally: AD/DB = AE/EC and AD/AB = AE/AC = DE/BC.
    topic_code: "3.11"
  - front: Side-splitter theorem → proof via AA
    back: |
      ∠ADE = ∠ABC (corresponding angles, DE ∥ BC) and ∠A is shared, so △ADE ∼ △ABC; the proportions are the similarity ratios.
    topic_code: "3.11"
  - front: Converse of the side-splitter theorem → statement
    back: |
      If D on AB and E on AC satisfy AD/DB = AE/EC (equivalently AD/AB = AE/AC), then DE ∥ BC.
    topic_code: "3.11"
  - front: Converse of the side-splitter theorem → proof idea
    back: |
      AD/AB = AE/AC with the shared angle A gives △ADE ∼ △ABC by SAS∼; then ∠ADE = ∠ABC, congruent corresponding angles, so DE ∥ BC by the converse of the corresponding angles theorem.
    topic_code: "3.11"
  - front: Three parallel lines cutting two transversals → rule
    back: |
      They cut the transversals proportionally: segments 4 and 6 on one, x and 9 on the other, give x/9 = 4/6, x = 6. Draw a diagonal to see two side-splitter triangles.
    topic_code: "3.11"
  - front: Is DE ∥ BC when AD = 9, DB = 6, AE = 12, EC = 8?
    back: |
      Yes: 9/6 = 12/8 = 1.5, so the converse of the side-splitter theorem applies.
    topic_code: "3.11"
  - front: Shadow problems → why the triangles are similar
    back: |
      The sun's rays are parallel, so the angle of elevation is the same for both objects; both triangles have a right angle at the ground. AA. Height/shadow is constant.
    topic_code: "3.12"
  - front: Mirror-on-the-ground problems → why the triangles are similar
    back: |
      Angle of incidence equals angle of reflection, and both triangles have a right angle at the ground. AA. Height/distance-to-mirror is constant.
    topic_code: "3.12"
  - front: River-width setup → the similar triangles
    back: |
      Right angles at both bank points and vertical angles at the sighting point B give △ABT ∼ △CBD, so AT/CD = AB/CB.
    topic_code: "3.12"
  - front: Overlapping triangles sharing side AB with ∠ACB = ∠ABD → relation
    back: |
      △ACB ∼ △ABD (shared angle A), so AC/AB = AB/AD, giving AB² = AC · AD.
    topic_code: "3.12"
  - front: Setting up a proportion safely → method
    back: |
      Write the similarity statement in corresponding letter order first, then read ratios from matching positions: △OAB ∼ △ODC gives OA/OD = AB/DC = OB/OC.
    topic_code: "3.12"
  - front: A 1.8 m person casts a 2.4 m shadow and a pole casts 12 m → pole height
    back: |
      h/12 = 1.8/2.4 = 0.75, so h = 9 m.
    topic_code: "3.12"
  - front: Congruence criteria behind the similarity criteria (review)
    back: |
      AA uses ASA; SAS∼ uses SAS; SSS∼ uses SSS. Each similarity proof is "dilate so one side matches, then apply the matching congruence criterion".
    topic_code: "2.9"
  - front: Converse of the corresponding angles theorem (review)
    back: |
      If a transversal makes congruent corresponding angles with two lines, the lines are parallel. Used to finish the converse of the side-splitter theorem.
    topic_code: "1.20"
quiz:
  description: |
    25 questions · about 40 minutes · AA, SAS and SSS similarity, the side-splitter theorem and its converse, three-parallel-line proportions and indirect measurement, with review of congruence criteria, parallel-line angles, dilations and last week's similarity definition. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: geo-u03-w13-q01
      type: multiple_choice
      topic_code: "3.9"
      source: "IM Geometry, Unit 3, Lesson 9"
      points: 1
      stimulus: |
        Figure description: segments AD and BC cross at point O, with A and D on opposite sides of O and B and C on opposite sides of O, so that triangles OAB and ODC form a bow tie. AB is parallel to CD. OA = 6, OB = 9, OC = 6 and AB = 12.
      prompt: |
        Which similarity statement is correctly written, and by which criterion?
      options:
        - "△OAB ∼ △ODC by SSS∼ (all three sides are given)"
        - "△OAB ∼ △ODC by AA (vertical angles at O, alternate interior angles from AB ∥ CD)"
        - "△OAB ∼ △ODC by SAS∼ (OA/OD = OB/OC with the included angle at O)"
        - "△OAB ∼ △OCD by AA (vertical angles at O, alternate interior angles from AB ∥ CD)"
      option_explanations:
        - |
          Only two sides of each triangle are known (and not all of the second triangle's), so SSS∼ cannot be checked; AA is the criterion that works here.
        - |
          Correct. ∠AOB = ∠DOC (vertical) and ∠OAB = ∠ODC (alternate interior angles, transversal AD), so AA applies, and A ↔ D, B ↔ C because those alternate angles match.
        - |
          OD is not given, so the side ratios cannot be checked; the angle facts are what the figure provides, which is AA.
        - |
          The correspondence is wrong: A pairs with D (both are on transversal AD and carry the alternate interior angles), not with C.
      answer: 1

    - slug: geo-u03-w13-q02
      type: multiple_choice
      topic_code: "3.9"
      source: "IM Geometry, Unit 3, Lesson 9"
      points: 1
      stimulus: |
        Figure description: segments AD and BC cross at point O, with A and D on opposite sides of O and B and C on opposite sides of O, so that triangles OAB and ODC form a bow tie. AB is parallel to CD. OA = 6, OB = 9, OC = 6 and AB = 12.
      prompt: |
        What is the length of OD?
      options:
        - "4"
        - "9"
        - "13.5"
        - "6"
      option_explanations:
        - |
          Correct. OB ↔ OC gives the scale factor OC/OB = 6/9 = 2/3 from △OAB to △ODC, so OD = (2/3)(6) = 4.
        - |
          9 would follow from pairing OD with OB, but OD corresponds to OA (both lie on transversal AD).
        - |
          13.5 uses the inverted factor 3/2 applied to OB; the second triangle is the smaller one, so k < 1.
        - |
          6 assumes OD = OA, which would need congruent triangles; OC = 6 ≠ OB = 9 shows they are not.
      answer: 0

    - slug: geo-u03-w13-q03
      type: multiple_choice
      topic_code: "3.9"
      source: "IM Geometry, Unit 3, Lesson 9"
      points: 1
      stimulus: |
        Figure description: segments AD and BC cross at point O, with A and D on opposite sides of O and B and C on opposite sides of O, so that triangles OAB and ODC form a bow tie. AB is parallel to CD. OA = 6, OB = 9, OC = 6 and AB = 12.
      prompt: |
        What is the length of CD?
      options:
        - "12"
        - "9"
        - "18"
        - "8"
      option_explanations:
        - |
          12 would make CD = AB, which needs congruent triangles; the side ratio 6/9 shows they are not.
        - |
          9 is OB, which is a side of the other triangle, not a computed length of CD.
        - |
          18 uses k = 3/2; the triangle ODC is smaller than OAB because OC = 6 is shorter than OB = 9.
        - |
          Correct. CD is the image of AB under the similarity with k = 2/3, so CD = (2/3)(12) = 8.
      answer: 3

    - slug: geo-u03-w13-q04
      type: multiple_choice
      topic_code: "3.9"
      source: "IM Geometry, Unit 3, Lesson 9"
      points: 1
      prompt: |
        Triangle ABC has angles 42° and 71°. Triangle DEF has angles 67° and 42°. Are the triangles similar?
      options:
        - "Yes, by SAS∼"
        - "No, because 71° and 67° are different angles"
        - "Yes, by AA: the third angle of each is 67° and 71° respectively, so each triangle has angles 42°, 67°, 71°"
        - "Cannot be determined without side lengths"
      option_explanations:
        - |
          No side lengths are given, so no side ratio can be checked; the angle information gives AA.
        - |
          The missing angles complete each set to 42°, 67°, 71°; comparing the two angles listed is not comparing all three.
        - |
          Correct. 180 − 42 − 71 = 67 and 180 − 67 − 42 = 71, so both triangles have the angle set {42°, 67°, 71°}; two matching pairs suffice.
        - |
          AA needs no side lengths at all; two pairs of congruent angles decide similarity.
      answer: 2

    - slug: geo-u03-w13-q05
      type: multiple_choice
      topic_code: "3.9"
      source: "IM Geometry, Unit 3, Lesson 9"
      points: 1
      prompt: |
        In the proof of the AA criterion, after dilating △ABC from A by k = DE/AB, which congruence criterion shows the image is congruent to △DEF?
      options:
        - "AA, using the two preserved angles"
        - "ASA, using the two preserved angles and the side AB′ = DE between them"
        - "SAS, using the two dilated sides and the angle at A"
        - "SSS, using the three dilated sides"
      option_explanations:
        - |
          AA is the similarity statement being proved; using it would be circular, and congruence needs a side.
        - |
          Correct. The dilation makes AB′ = DE and preserves ∠A and ∠B, which are the angles at the ends of that side: ASA.
        - |
          SAS would need two matched sides; only AB′ is known to equal DE.
        - |
          Only one side is known to match after the dilation (AB′ = DE); the other two side lengths are not given.
      answer: 1

    - slug: geo-u03-w13-q06
      type: multiple_choice
      topic_code: "3.10"
      source: "IM Geometry, Unit 3, Lesson 10"
      points: 1
      prompt: |
        △ABC has AB = 10, AC = 14 and ∠A = 35°. △DEF has DE = 15, DF = 21 and ∠D = 35°. Which criterion proves the triangles similar?
      options:
        - "SAS∼, because 15/10 = 21/14 = 1.5 and the equal angles are included between those sides"
        - "AA, because ∠A = ∠D"
        - "SSS∼, because three measurements are given for each triangle"
        - "No criterion applies, because the third sides are unknown"
      option_explanations:
        - |
          Correct. Two side ratios are equal and ∠A, ∠D are the angles between those sides in each triangle: SAS∼ with k = 1.5.
        - |
          AA needs two pairs of angles; only one pair is given.
        - |
          Only two sides of each triangle are given; the third measurement is an angle, so SSS∼ cannot be checked.
        - |
          SAS∼ needs only two sides and the included angle; the third sides are not required.
      answer: 0

    - slug: geo-u03-w13-q07
      type: multiple_choice
      topic_code: "3.10"
      source: "IM Geometry, Unit 3, Lesson 10"
      points: 1
      prompt: |
        Which pair of triangles is NOT guaranteed similar by the information given?
      options:
        - "Angles 50° and 60°; angles 60° and 70°"
        - "Sides 6, 9, 12; sides 4, 6, 8"
        - "Sides 6 and 9 with a 50° angle opposite the 9; sides 4 and 6 with a 50° angle opposite the 6"
        - "Sides 6 and 9 with a 50° angle between them; sides 4 and 6 with a 50° angle between them"
      option_explanations:
        - |
          The third angles are 70° and 50°, so both triangles have angles 50°, 60°, 70°: AA.
        - |
          Ratios 4/6 = 6/9 = 8/12 = 2/3: SSS∼ guarantees similarity.
        - |
          Correct. The angle is not included between the proportional sides, so this is SSA, which is not a similarity criterion.
        - |
          Ratios 4/6 = 6/9 = 2/3 with the included angle equal: SAS∼ guarantees similarity.
      answer: 2

    - slug: geo-u03-w13-q08
      type: multiple_choice
      topic_code: "3.10"
      source: "IM Geometry, Unit 3, Lesson 10"
      points: 1
      prompt: |
        Triangle P has sides 5, 7, 9. Which triangle is similar to P?
      options:
        - "Sides 5, 7, 11"
        - "Sides 7, 9, 11"
        - "Sides 10, 14, 20"
        - "Sides 12.5, 17.5, 22.5"
      option_explanations:
        - |
          Two sides match P exactly but the third differs; the ratios are 1, 1 and 11/9.
        - |
          Adding 2 to each side is not a dilation: 7/5 = 1.4 but 9/7 ≈ 1.29.
        - |
          10/5 = 14/7 = 2 but 20/9 ≈ 2.22; the longest side breaks the proportion.
        - |
          Correct. 12.5/5 = 17.5/7 = 22.5/9 = 2.5, so SSS∼ applies with k = 2.5.
      answer: 3

    - slug: geo-u03-w13-q09
      type: multiple_choice
      topic_code: "3.11"
      source: "IM Geometry, Unit 3, Lesson 11"
      points: 1
      prompt: |
        In triangle ABC, D is on AB and E is on AC with AD = 8, DB = 12, AE = 10 and EC = 15. What can you conclude?
      options:
        - "DE is not parallel to BC, since 8 ≠ 10"
        - "Nothing, because no angles are given"
        - "DE ∥ BC, because AD + AE = DB + EC − 9"
        - "DE ∥ BC, by the converse of the side-splitter theorem, since 8/12 = 10/15"
      option_explanations:
        - |
          AD and AE need not be equal; what must match is the ratio of the pieces on each side, and 8/12 = 10/15.
        - |
          The converse of the side-splitter theorem needs only the proportional pieces, no angles.
        - |
          Sums and differences of the pieces do not decide parallelism; the test is the equality of the ratios AD/DB and AE/EC.
        - |
          Correct. 8/12 = 2/3 and 10/15 = 2/3, so the sides are cut proportionally and the converse of the side-splitter theorem gives DE ∥ BC.
      answer: 3

    - slug: geo-u03-w13-q10
      type: multiple_choice
      topic_code: "3.11"
      source: "IM Geometry, Unit 3, Lesson 11"
      points: 1
      prompt: |
        Three parallel lines cross two transversals. The first transversal is cut into segments of 6 and 10. The second is cut into segments of 9 and x, in the same order. What is x?
      options:
        - "13"
        - "5.4"
        - "15"
        - "19"
      option_explanations:
        - |
          13 adds the difference 9 − 6 = 3 to 10; proportions scale by a factor of 1.5, not by adding 3.
        - |
          5.4 solves 6/10 = x/9 the wrong way round (x/9 should equal 10/6).
        - |
          Correct. Parallel lines cut transversals proportionally: x/10 = 9/6, so x = 15.
        - |
          19 comes from 9 + 10, which has no geometric meaning here.
      answer: 2

    - slug: geo-u03-w13-q11
      type: multiple_choice
      topic_code: "3.12"
      source: "IM Geometry, Unit 3, Lesson 12"
      points: 1
      prompt: |
        A 1.6 m tall student casts a 2 m shadow at the same moment a tree casts a 15 m shadow. How tall is the tree?
      options:
        - "12 m"
        - "14.6 m"
        - "13.4 m"
        - "18.75 m"
      option_explanations:
        - |
          Correct. The sun's rays are parallel, so the triangles are similar (AA) and height/shadow is constant: h = 15 × 1.6/2 = 12 m.
        - |
          14.6 subtracts 0.4 from 15, treating the height-shadow relation as a difference rather than a ratio.
        - |
          13.4 subtracts the student's shadow from the tree's shadow, which does not relate to the tree's height.
        - |
          18.75 inverts the ratio (15 × 2/1.6); heights are shorter than shadows here, since 1.6 < 2.
      answer: 0

    - slug: geo-u03-w13-q12
      type: multiple_choice
      topic_code: "3.12"
      source: "IM Geometry, Unit 3, Lesson 12"
      points: 1
      prompt: |
        A mirror lies on level ground 4.5 m from the base of a wall. A person whose eyes are 1.5 m above the ground stands 1.8 m from the mirror on the other side and sees the top of the wall. How tall is the wall?
      options:
        - "4.2 m"
        - "3.75 m"
        - "5.4 m"
        - "1.5 m"
      option_explanations:
        - |
          4.2 subtracts 0.3 from 4.5, but the relation between the triangles is a ratio, not a difference.
        - |
          Correct. Equal angles of incidence and reflection plus right angles give similar triangles: wall/4.5 = 1.5/1.8, wall = 3.75 m.
        - |
          5.4 multiplies 4.5 by 1.2 (inverting the eye-height ratio); the eye is below the mirror-to-person distance ratio, not above it.
        - |
          1.5 m is the eye height; the wall is farther from the mirror than the person is, so it is taller.
      answer: 1

    - slug: geo-u03-w13-q13
      type: multiple_choice
      topic_code: "3.6"
      source: "IM Geometry, Unit 3, Lesson 6"
      points: 1
      prompt: |
        Review. △ABC ∼ △DEF with scale factor 4 from ABC to DEF. The area of △ABC is 3 cm². What is the area of △DEF?
      options:
        - "48 cm²"
        - "7 cm²"
        - "12 cm²"
        - "24 cm²"
      option_explanations:
        - |
          Correct. Area scales by k² = 16, so 3 × 16 = 48 cm².
        - |
          7 adds 4 to the area; a similarity multiplies measurements, it does not add.
        - |
          12 multiplies by k instead of k²; lengths scale by 4, areas by 16.
        - |
          24 multiplies by 2k = 8, which is not how areas scale; the factor is k² = 16.
      answer: 0

    - slug: geo-u03-w13-q14
      type: multiple_choice
      topic_code: "2.11"
      source: "IM Geometry, Unit 2, Lesson 11"
      points: 1
      prompt: |
        Review. Why is SSA not a congruence criterion, and what does that imply for similarity?
      options:
        - "SSA fails for congruence only, but any two triangles with two equal side ratios are similar"
        - "Two sides and a non-included angle can be arranged into two different triangles, so proportional sides with a non-included angle cannot guarantee similarity either"
        - "SSA is a congruence criterion, and SSA∼ works the same way for similarity"
        - "SSA fails because angles are never enough information; similarity needs three side ratios"
      option_explanations:
        - |
          Two equal side ratios alone, or with a non-included angle, do not force similarity; the angle must be included (SAS∼) or a second angle is needed (AA).
        - |
          Correct. The swinging-side construction can produce two triangles with the same SSA data; dilating does not remove that ambiguity, so there is no SSA∼ criterion.
        - |
          SSA is not a criterion for congruence (except the hypotenuse-leg case), and the same ambiguity defeats it for similarity.
        - |
          Angles are enough: AA uses only angles. The failure of SSA is about the angle not being included between the two sides.
      answer: 1

    - slug: geo-u03-w13-q15
      type: multi_select
      topic_code: "3.10"
      source: "IM Geometry, Unit 3, Lesson 10"
      points: 2
      partial_credit: true
      prompt: |
        Which sets of information are sufficient to conclude that two triangles are similar? Select all that apply.
      options:
        - "Two pairs of sides in the same ratio and a pair of non-included angles congruent"
        - "Two pairs of congruent angles"
        - "Three pairs of congruent angles"
        - "Three pairs of sides in the same ratio"
        - "Two pairs of sides in the same ratio and the included angles congruent"
      option_explanations:
        - |
          Not sufficient: this is SSA, which can describe two different triangles.
        - |
          Sufficient: this is the AA criterion, proved by dilating and then applying ASA.
        - |
          Sufficient: three congruent angle pairs certainly include two, so AA applies (the third is redundant, not harmful).
        - |
          Sufficient: this is the SSS similarity criterion.
        - |
          Sufficient: this is the SAS similarity criterion.
      answer: [1, 2, 3, 4]

    - slug: geo-u03-w13-q16
      type: multi_select
      topic_code: "1.20"
      source: "IM Geometry, Unit 1, Lesson 20"
      points: 2
      partial_credit: true
      prompt: |
        Review. In triangle ABC, D is on AB and E is on AC with DE ∥ BC. Which angle pairs are congruent? Select all that apply.
      options:
        - "∠DAE and ∠BAC"
        - "∠BDE and ∠ABC"
        - "∠ADE and ∠ACB"
        - "∠ADE and ∠ABC"
        - "∠AED and ∠ACB"
      option_explanations:
        - |
          Congruent: they are the same angle, the angle at A shared by both triangles.
        - |
          Not congruent in general: ∠BDE and ∠ABC are co-interior (same-side interior) angles, so they are supplementary, not equal.
        - |
          Not in general: ∠ADE equals ∠ABC, and ∠ABC equals ∠ACB only when the triangle is isosceles.
        - |
          Congruent: corresponding angles made by transversal AB with the parallel lines DE and BC.
        - |
          Congruent: corresponding angles made by transversal AC with the parallel lines DE and BC.
      answer: [0, 3, 4]

    - slug: geo-u03-w13-q17
      type: true_false
      topic_code: "3.11"
      source: "IM Geometry, Unit 3, Lesson 11"
      points: 1
      prompt: |
        True or false: in triangle ABC with D on AB and E on AC, if AD/AB = AE/AC then DE must be parallel to BC.
      answer: true
      explanation: |
        True. This is the converse of the side-splitter theorem: the equal ratios with the shared angle at A give △ADE ∼ △ABC by SAS∼, so ∠ADE = ∠ABC, and congruent corresponding angles make DE ∥ BC.

    - slug: geo-u03-w13-q18
      type: true_false
      topic_code: "3.4"
      source: "IM Geometry, Unit 3, Lesson 4"
      points: 1
      prompt: |
        Review. True or false: in the proof of every similarity criterion, the step "dilate the first triangle" is allowed to change the angles of that triangle.
      answer: false
      explanation: |
        False. A dilation preserves every angle (image rays are parallel to the original rays); that is exactly why the dilated triangle still has the angles needed for the ASA or SAS step. Only lengths are multiplied by k.

    - slug: geo-u03-w13-q19
      type: fill_blank
      topic_code: "3.9"
      source: "IM Geometry, Unit 3, Lesson 9"
      points: 1
      prompt: |
        The similarity criterion that needs only two pairs of congruent angles is abbreviated ____.
