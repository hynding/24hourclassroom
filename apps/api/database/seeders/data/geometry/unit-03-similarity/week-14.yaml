week: 14
unit: 3
title: "Pythagoras, Unknown Values and the Bank Shot"
topics: ["3.13", "3.14", "3.15", "3.16"]
guide: guides/week-14.md
guide_description: |
  The three similar triangles made by the altitude to the hypotenuse, the geometric-mean relations, the similar-triangles proof of the Pythagorean theorem and its converse, strategies for finding every unknown value in a triangle (special right triangles included), and the reflection-plus-similar-triangles model of a bank shot. Worked examples, Try-it problems and a self-check.
flashcards_description: |
  28 cards on the altitude-to-hypotenuse relations, both proofs of the Pythagorean theorem, the converse, 45-45-90 and 30-60-90 triangles, unknown-value strategies and the bank-shot method. Review them before the week 14 quiz.
flashcards:
  - front: Altitude to the hypotenuse → how many similar triangles
    back: |
      Three: the two small triangles are each similar to the whole triangle (shared acute angle plus a right angle, AA) and therefore to each other.
    topic_code: "3.13"
  - front: Altitude to the hypotenuse → the altitude relation
    back: |
      h² = p · q, where p and q are the two pieces of the hypotenuse. The altitude is the geometric mean of the pieces.
    topic_code: "3.13"
  - front: Altitude to the hypotenuse → the leg relations
    back: |
      b² = p · c and a² = q · c: each leg is the geometric mean of the whole hypotenuse and the piece adjacent to that leg.
    topic_code: "3.13"
  - front: Geometric mean → definition
    back: |
      x is the geometric mean of p and q when x² = pq, i.e. x = √(pq). For 4 and 9 it is 6.
    topic_code: "3.13"
  - front: Hypotenuse pieces 4 and 9 → altitude, hypotenuse, legs
    back: |
      h = √36 = 6; c = 13; legs √(4 · 13) = 2√13 and √(9 · 13) = 3√13. Check: 52 + 117 = 169.
    topic_code: "3.13"
  - front: Legs 6 and 8 → altitude to the hypotenuse and the pieces
    back: |
      Area two ways: ½ · 6 · 8 = ½ · 10 · h gives h = 4.8. Pieces p = 36/10 = 3.6 and q = 64/10 = 6.4.
    topic_code: "3.13"
  - front: Which similarity gives b² = pc
    back: |
      △ACH ∼ △ABC (shared ∠A, right angles at H and C): AC/AB = AH/AC, so AC² = AH · AB.
    topic_code: "3.13"
  - front: Pythagorean theorem → proof by similar triangles
    back: |
      From the altitude figure, a² = qc and b² = pc. Adding, a² + b² = (p + q)c = c · c = c², since p + q = c.
    topic_code: "3.14"
  - front: Pythagorean theorem → proof by rearrangement
    back: |
      Four copies of the triangle inside a square of side a + b leave a central square of side c: (a + b)² = 2ab + c², so a² + b² = c².
    topic_code: "3.14"
  - front: Why the central tilted shape in the rearrangement proof is a square
    back: |
      Each of its angles is 180° minus the two acute angles of the right triangle, which sum to 90°, so each angle is 90°; its sides are all c.
    topic_code: "3.14"
  - front: Converse of the Pythagorean theorem → statement and proof idea
    back: |
      If a² + b² = c², the angle opposite c is right. Build a right triangle with legs a and b; its hypotenuse is c; SSS makes it congruent to the given triangle.
    topic_code: "3.14"
  - front: Sides 7, 24, 25 → right triangle?
    back: |
      Yes: 49 + 576 = 625 = 25². Sides 8, 9, 12 are not: 64 + 81 = 145 ≠ 144.
    topic_code: "3.14"
  - front: Six measurements of a triangle → strategy to find them all
    back: |
      Angle sum for the third angle; Pythagoras in right triangles; special-triangle ratios; drop an altitude in a non-right triangle; scale from a similar triangle.
    topic_code: "3.15"
  - front: 45-45-90 triangle → side ratios
    back: |
      Legs x and x, hypotenuse x√2. Half a square. Hypotenuse 14 gives legs 7√2.
    topic_code: "3.15"
  - front: 30-60-90 triangle → side ratios
    back: |
      Short leg x (opposite 30°), long leg x√3 (opposite 60°), hypotenuse 2x. Half an equilateral triangle.
    topic_code: "3.15"
  - front: 30-60-90 triangle with long leg 12 → other sides
    back: |
      Short leg 12/√3 = 4√3 ≈ 6.93; hypotenuse 8√3 ≈ 13.86.
    topic_code: "3.15"
  - front: Equilateral triangle with side s → height and area
    back: |
      Height (s/2)√3; area (√3/4)s². For s = 12: height 6√3, area 36√3 ≈ 62.35.
    topic_code: "3.15"
  - front: Isosceles triangle with equal sides 13 and base 10 → height and area
    back: |
      The altitude to the base bisects it: height √(169 − 25) = 12, area 60.
    topic_code: "3.15"
  - front: Square with side s → diagonal
    back: |
      s√2. A square with diagonal 10 has side 10/√2 = 5√2.
    topic_code: "3.15"
  - front: Altitude to the hypotenuse from the legs → quick formula
    back: |
      h = ab/c (from area two ways). Legs 8 and 15 give h = 120/17.
    topic_code: "3.15"
  - front: Bank shot → the physical rule
    back: |
      The angle of incidence equals the angle of reflection: the incoming and outgoing paths make equal angles with the cushion.
    topic_code: "3.16"
  - front: Bank shot → the reflection method
    back: |
      Reflect the target Q across the cushion to Q′; the line from P to Q′ meets the cushion at the bounce point B. BQ = BQ′ and the angles at B match.
    topic_code: "3.16"
  - front: Why the reflected path is the shortest bank shot
    back: |
      Any bounce path P → X → Q has the same length as P → X → Q′, and the straight segment PQ′ is the shortest route from P to Q′.
    topic_code: "3.16"
  - front: Bank shot bounce point → similar-triangles formula
    back: |
      With P at height a, Q at height b and horizontal separation d, the bounce is d · a/(a + b) from P's foot (right angles plus vertical angles give similar triangles).
    topic_code: "3.16"
  - front: P = (0, 3), Q = (8, 5), cushion y = 0 → bounce point
    back: |
      Q′ = (8, −5); B is 8 × 3/8 = 3 from P's foot: B = (3, 0). Both legs of the path are at 45°.
    topic_code: "3.16"
  - front: Two-cushion bank shot → method
    back: |
      Reflect across both cushions in turn (or reflect P across one and Q across the other), draw the straight line, and read off both bounce points.
    topic_code: "3.16"
  - front: AA criterion applied to the altitude figure (review)
    back: |
      △ACH and △ABC share ∠A and each has a right angle, so they are similar; likewise △CBH and △ABC share ∠B.
    topic_code: "3.9"
  - front: Reflection preserves distance and angle (review) → use in the bank shot
    back: |
      Reflecting Q to Q′ across the cushion keeps BQ = BQ′ for every point B on the cushion and swaps the two angles at B, which is why the straight line gives a legal bounce.
    topic_code: "1.11"
quiz:
  description: |
    25 questions · about 40 minutes · The altitude-to-hypotenuse relations, proving the Pythagorean theorem and its converse, special right triangles, finding all unknown values and bank shots, with review of AA similarity, side splitting, reflections, congruence criteria and the angle sum. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: geo-u03-w14-q01
      type: multiple_choice
      topic_code: "3.13"
      source: "IM Geometry, Unit 3, Lesson 13"
      points: 1
      stimulus: |
        Figure description: right triangle ABC with the right angle at C. The altitude from C meets hypotenuse AB at H. AH = 9 and HB = 16.
      prompt: |
        What is the length of the altitude CH?
      options:
        - "25"
        - "12.5"
        - "7"
        - "12"
      option_explanations:
        - |
          25 is the whole hypotenuse AH + HB, not the altitude.
        - |
          12.5 is the average of 9 and 16 (the arithmetic mean); the altitude is the geometric mean √(9 × 16).
        - |
          7 is the difference 16 − 9, which has no role in the altitude relation.
        - |
          Correct. △ACH ∼ △CBH gives AH/CH = CH/HB, so CH² = 9 × 16 = 144 and CH = 12.
      answer: 3

    - slug: geo-u03-w14-q02
      type: multiple_choice
      topic_code: "3.13"
      source: "IM Geometry, Unit 3, Lesson 13"
      points: 1
      stimulus: |
        Figure description: right triangle ABC with the right angle at C. The altitude from C meets hypotenuse AB at H. AH = 9 and HB = 16.
      prompt: |
        What is the length of leg AC?
      options:
        - "9"
        - "15"
        - "20"
        - "√(9 × 16)"
      option_explanations:
        - |
          9 is the piece AH of the hypotenuse; the leg AC is longer than AH since AC is the hypotenuse of △ACH.
        - |
          Correct. △ACH ∼ △ABC gives AC/AB = AH/AC, so AC² = 9 × 25 = 225 and AC = 15.
        - |
          20 is the other leg BC (BC² = 16 × 25 = 400); AC is the leg adjacent to the piece AH = 9.
        - |
          √(9 × 16) = 12 is the altitude CH, not a leg; a leg uses the whole hypotenuse in its product.
      answer: 1

    - slug: geo-u03-w14-q03
      type: multiple_choice
      topic_code: "3.14"
      source: "IM Geometry, Unit 3, Lesson 14"
      points: 1
      stimulus: |
        Figure description: right triangle ABC with the right angle at C. The altitude from C meets hypotenuse AB at H. AH = 9 and HB = 16.
      prompt: |
        Using AC² = AH · AB and BC² = HB · AB, which line completes the proof that AC² + BC² = AB²?
      options:
        - "AC² + BC² = (AH + HB) · AB = AB · AB = AB²"
        - "AC² + BC² = AH · HB = CH²"
        - "AC² + BC² = (AH · HB) · AB"
        - "AC² + BC² = 2 · CH · AB"
      option_explanations:
        - |
          Correct. Factor out AB from the sum of the two products; AH + HB = AB because H lies on the hypotenuse.
        - |
          AH · HB equals CH², the altitude relation, not the sum of the leg squares (which is 225 + 400 = 625 here, while CH² = 144).
        - |
          The sum AH · AB + HB · AB factors as (AH + HB) · AB; the pieces are added, not multiplied.
        - |
          2 · CH · AB is four times the area of the triangle, which is not AB² in general (here 600 ≠ 625).
      answer: 0

    - slug: geo-u03-w14-q04
      type: multiple_choice
      topic_code: "3.13"
      source: "IM Geometry, Unit 3, Lesson 13"
      points: 1
      prompt: |
        A right triangle has legs 5 and 12. What is the length of the altitude to the hypotenuse?
      options:
        - "13/2"
        - "√60"
        - "60/13"
        - "8.5"
      option_explanations:
        - |
          13/2 is half the hypotenuse, which would be the median to the hypotenuse, not the altitude.
        - |
          √60 treats the legs as the pieces of the hypotenuse in h² = pq; the pieces are 25/13 and 144/13.
        - |
          Correct. The hypotenuse is 13 and the area is 30, so ½ · 13 · h = 30 gives h = 60/13 ≈ 4.62.
        - |
          8.5 is the average of the legs, which has no geometric meaning here.
      answer: 2

    - slug: geo-u03-w14-q05
      type: multiple_choice
      topic_code: "3.14"
      source: "IM Geometry, Unit 3, Lesson 14"
      points: 1
      prompt: |
        In the rearrangement proof, four copies of a right triangle with legs a, b and hypotenuse c sit inside a square of side a + b, leaving a tilted quadrilateral of side c in the middle. Why is that quadrilateral a square?
      options:
        - "Its diagonals are equal to a + b"
        - "Any quadrilateral with four equal sides is a square"
        - "Because it is inside a square, it must also be a square"
        - "Its sides are all c, and each angle is 180° minus the two acute angles of the triangle, which add to 90°"
      option_explanations:
        - |
          The diagonals of the tilted square are c√2, not a + b, and equal diagonals alone would not prove it is a square anyway.
        - |
          Four equal sides make a rhombus; the angles must also be shown to be right.
        - |
          Being inside a square proves nothing about a figure's own angles; the argument must use the triangle's angle sum.
        - |
          Correct. At each corner, a straight angle is split into the triangle's two acute angles and the quadrilateral's angle; the acute angles sum to 90°, so the remaining angle is 90°.
      answer: 3

    - slug: geo-u03-w14-q06
      type: multiple_choice
      topic_code: "3.14"
      source: "IM Geometry, Unit 3, Lesson 14"
      points: 1
      prompt: |
        Which triangle is a right triangle?
      options:
        - "Sides 20, 21, 29"
        - "Sides 10, 15, 20"
        - "Sides 5, 5, 8"
        - "Sides 6, 7, 9"
      option_explanations:
        - |
          Correct. 400 + 441 = 841 = 29², so by the converse of the Pythagorean theorem the angle opposite 29 is right.
        - |
          100 + 225 = 325 ≠ 400; the angle opposite 20 is obtuse.
        - |
          25 + 25 = 50 ≠ 64; the angle opposite 8 is obtuse.
        - |
          36 + 49 = 85 ≠ 81; the triangle is acute (85 > 81).
      answer: 0

    - slug: geo-u03-w14-q07
      type: multiple_choice
      topic_code: "3.15"
      source: "IM Geometry, Unit 3, Lesson 15"
      points: 1
      prompt: |
        A right triangle has a 30° angle and hypotenuse 24. What are the lengths of its legs?
      options:
        - "24 and 24√3"
        - "8 and 16"
        - "12 and 12√3"
        - "12 and 12√2"
      option_explanations:
        - |
          24 is the hypotenuse; both legs must be shorter than it.
        - |
          8 and 16 do not satisfy Pythagoras with 24 (64 + 256 = 320 ≠ 576) and are not in the 1 : √3 ratio.
        - |
          Correct. In a 30-60-90 triangle the short leg is half the hypotenuse (12) and the long leg is the short leg times √3.
        - |
          √2 belongs to the 45-45-90 triangle; a 30° angle gives the √3 ratio.
      answer: 2

    - slug: geo-u03-w14-q08
      type: multiple_choice
      topic_code: "3.15"
      source: "IM Geometry, Unit 3, Lesson 15"
      points: 1
      prompt: |
        An isosceles triangle has two sides of length 17 and a base of 16. What is its area?
      options:
        - "240"
        - "120"
        - "68"
        - "136"
      option_explanations:
        - |
          240 is 16 × 15 without the ½ in the triangle area formula.
        - |
          Correct. The altitude to the base bisects it into 8 and 8, so the height is √(289 − 64) = 15 and the area is ½ · 16 · 15 = 120.
        - |
          68 is half of 136, so it compounds the wrong height with an extra halving.
        - |
          136 is ½ · 16 · 17, using a slanted side as the height; the height is the perpendicular, which is 15.
      answer: 1

    - slug: geo-u03-w14-q09
      type: multiple_choice
      topic_code: "3.15"
      source: "IM Geometry, Unit 3, Lesson 15"
      points: 1
      prompt: |
        A square has a diagonal of length 12. What is its side length?
      options:
        - "6√2"
        - "√12"
        - "12√2"
        - "6"
      option_explanations:
        - |
          Correct. The diagonal of a square is side × √2, so side = 12/√2 = 6√2 ≈ 8.49.
        - |
          √12 ≈ 3.46 is far too small: two such sides could not reach a diagonal of 12.
        - |
          12√2 would be the diagonal of a square with side 12; here the diagonal is given, so divide by √2.
        - |
          6 is half the diagonal; the side satisfies 2s² = 144, s² = 72.
      answer: 0

    - slug: geo-u03-w14-q10
      type: multiple_choice
      topic_code: "3.16"
      source: "IM Geometry, Unit 3, Lesson 16"
      points: 1
      prompt: |
        A ball at P = (0, 6) must bounce off the cushion along the x-axis and reach Q = (12, 2). Where should it hit the cushion?
      options:
        - "(8, 0)"
        - "(9, 0)"
        - "(6, 0)"
        - "(3, 0)"
      option_explanations:
        - |
          (8, 0) gives slopes 6/8 and 2/4, which are not equal, so the angles of incidence and reflection would differ.
        - |
          Correct. Reflect Q to (12, −2); the similar triangles give the bounce point 12 × 6/(6 + 2) = 9 from P's foot. The path drops 6 over 9 and then rises 2 over 3, the same slope magnitude.
        - |
          (6, 0) is the midpoint, which only works when P and Q are the same height; here P is higher so the bounce is closer to Q.
        - |
          (3, 0) uses the ratio the wrong way round (12 × 2/8); the bounce point is nearer the lower point Q.
      answer: 1

    - slug: geo-u03-w14-q11
      type: multiple_choice
      topic_code: "3.16"
      source: "IM Geometry, Unit 3, Lesson 16"
      points: 1
      prompt: |
        Why does reflecting the target Q across the cushion to Q′ and drawing the straight line PQ′ produce a legal bank shot?
      options:
        - "Because reflections rotate the path by 90°"
        - "Because a straight line is always the shortest path between P and Q"
        - "Because the cushion is the perpendicular bisector of PQ"
        - "The reflection swaps the two angles the path makes with the cushion at the crossing point, making them equal, and keeps BQ = BQ′"
      option_explanations:
        - |
          A reflection does not rotate by 90°; it flips across the mirror line and preserves angles.
        - |
          The straight line PQ′ is shortest from P to Q′, but that alone does not explain the equal angles; the reflection's angle-preserving property does.
        - |
          The cushion is the perpendicular bisector of QQ′, not of PQ; P is not reflected.
        - |
          Correct. For the crossing point B, the reflection fixes B and maps segment BQ′ onto BQ, so the angle between BQ and the cushion equals the angle between BQ′ and the cushion, which is the angle of PB with the cushion (vertical angles).
      answer: 3

    - slug: geo-u03-w14-q12
      type: multiple_choice
      topic_code: "3.9"
      source: "IM Geometry, Unit 3, Lesson 9"
      points: 1
      prompt: |
        Review. In right triangle ABC (right angle at C) with altitude CH to the hypotenuse, which pair of angle facts proves △ACH ∼ △ABC?
      options:
        - "∠A is shared, and ∠ACH = ∠ABC because they are vertical angles"
        - "∠ACH = ∠B and ∠HCB = ∠A because they are alternate interior angles"
        - "∠A is shared, and ∠AHC and ∠ACB are both right angles"
        - "The triangles share side AC"
      option_explanations:
        - |
          ∠ACH and ∠ABC are indeed equal, but as complements of ∠A, not as vertical angles (they do not share a vertex).
        - |
          There are no parallel lines in the figure, so alternate interior angles do not apply; the equal angles come from complements of the acute angles.
        - |
          Correct. Two pairs of congruent angles (the shared ∠A and the right angles) give AA.
        - |
          Sharing a side is not a similarity criterion; angles (AA) or side ratios are needed.
      answer: 2

    - slug: geo-u03-w14-q13
      type: multiple_choice
      topic_code: "3.11"
      source: "IM Geometry, Unit 3, Lesson 11"
      points: 1
      prompt: |
        Review. In triangle ABC, D is on AB and E is on AC. AD = 6, DB = 4, AE = 9 and EC = 6. Which statement follows?
      options:
        - "DE ∥ BC, and DE/BC = 3/5"
        - "DE is not parallel to BC, because 6 ≠ 9"
        - "DE ∥ BC, and DE/BC = 3/2"
        - "DE ∥ BC, and DE = BC"
      option_explanations:
        - |
          Correct. 6/4 = 9/6 = 3/2, so DE ∥ BC by the converse of the side-splitter theorem, and DE/BC = AD/AB = 6/10 = 3/5.
        - |
          AD and AE need not be equal; the test is AD/DB = AE/EC, which holds (both 3/2).
        - |
          3/2 is AD/DB, the ratio of the pieces; DE compares with BC through the whole side: AD/AB = 3/5.
        - |
          DE is the image of BC under a dilation with k = 3/5, so it is shorter than BC.
      answer: 0

    - slug: geo-u03-w14-q14
      type: multiple_choice
      topic_code: "2.9"
      source: "IM Geometry, Unit 2, Lesson 9"
      points: 1
      prompt: |
        Review. The proof of the converse of the Pythagorean theorem builds a right triangle with legs a and b and compares it with the given triangle whose sides are a, b and c with a² + b² = c². Which congruence criterion finishes the proof, and why?
      options:
        - "ASA: the right angle and the two acute angles match"
        - "SSS: the built triangle's hypotenuse is √(a² + b²) = c, so all three sides match"
        - "SAS: the two legs match and the included angle is 90° in both triangles"
        - "HL: both triangles have hypotenuse c and a leg a"
      option_explanations:
        - |
          No angles of the given triangle are known in advance; only its three sides are.
        - |
          Correct. The built triangle has sides a, b, c, the same as the given one, so SSS makes them congruent and the given triangle's angle opposite c is right by CPCTC.
        - |
          The given triangle is not yet known to have a right angle; that is what is being proved, so SAS with the 90° angle would be circular.
        - |
          HL requires both triangles to be right triangles, which is the conclusion, not a hypothesis.
      answer: 1

    - slug: geo-u03-w14-q15
      type: multi_select
      topic_code: "3.15"
      source: "IM Geometry, Unit 3, Lesson 15"
      points: 2
      partial_credit: true
      prompt: |
        A right triangle has a 45° angle and hypotenuse 10. Which statements are true? Select all that apply.
      options:
        - "Both legs are 5√2"
        - "The other acute angle is 45°"
        - "The legs are 5 and 5√3"
        - "The area is 25"
        - "The altitude to the hypotenuse is 5"
      option_explanations:
        - |
          True: a 45-45-90 triangle has legs hypotenuse/√2 = 10/√2 = 5√2.
        - |
          True: 180 − 90 − 45 = 45; the triangle is isosceles.
        - |
          False: 5 and 5√3 are the legs of a 30-60-90 triangle with hypotenuse 10.
        - |
          True: the legs are the base and height, so the area is ½ · 5√2 · 5√2 = ½ · 50 = 25.
        - |
          True: the altitude is the geometric mean of the equal pieces 5 and 5 (or ab/c = 50/10 = 5).
      answer: [0, 1, 3, 4]

    - slug: geo-u03-w14-q16
      type: multi_select
      topic_code: "1.11"
      source: "IM Geometry, Unit 1, Lesson 11"
      points: 2
      partial_credit: true
      prompt: |
        Review. Point Q is reflected across line m to Q′, and B is any point on m. Which statements are always true? Select all that apply.
      options:
        - "BQ = BQ′"
        - "m is the perpendicular bisector of QQ′"
        - "Q and Q′ are on the same side of m"
        - "B is the midpoint of QQ′"
        - "The angle between BQ and m equals the angle between BQ′ and m"
      option_explanations:
        - |
          True: every point of the mirror line is equidistant from a point and its reflection (the Perpendicular Bisector Theorem).
        - |
          True: this is the definition of reflection: Q′ is placed so that m is the perpendicular bisector of QQ′.
        - |
          False: a reflection carries a point not on m to the opposite side of m.
        - |
          False in general: the midpoint of QQ′ is the foot of the perpendicular from Q, which is only one particular point of m.
        - |
          True: the reflection fixes B and m, and carries ray BQ to ray BQ′, so the angles with m match.
      answer: [0, 1, 4]

    - slug: geo-u03-w14-q17
      type: true_false
      topic_code: "3.14"
      source: "IM Geometry, Unit 3, Lesson 14"
      points: 1
      prompt: |
        True or false: if the sides of a triangle satisfy a² + b² < c² (with c the longest side), then the angle opposite c is obtuse.
      answer: true
      explanation: |
        True. Compare with the right triangle with legs a and b, whose third side is √(a² + b²) < c. Making the third side longer while keeping the two legs opens the angle between them past 90°. The equality case is the converse of the Pythagorean theorem.

    - slug: geo-u03-w14-q18
      type: true_false
      topic_code: "1.21"
      source: "IM Geometry, Unit 1, Lesson 21"
      points: 1
      prompt: |
        Review. True or false: in a right triangle, the two acute angles are complementary, which is why the altitude to the hypotenuse creates angles equal to the original acute angles.
      answer: true
      explanation: |
        True. The angle sum gives ∠A + ∠B = 90°. In △ACH, ∠ACH = 90° − ∠A = ∠B, and in △CBH, ∠BCH = 90° − ∠B = ∠A, so each small triangle has the same angles as the whole.

    - slug: geo-u03-w14-q19
      type: fill_blank
      topic_code: "3.13"
      source: "IM Geometry, Unit 3, Lesson 13"
      points: 1
      prompt: |
        The altitude to the hypotenuse of a right triangle is the ____ mean of the two pieces of the hypotenuse.
      answer: ["geometric"]
      explanation: |
