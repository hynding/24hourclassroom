      prompt: |
        A rectangular table has its lower edge along the x-axis. A ball sits at P = (1, 4) and a target ball at Q = (13, 2). The ball must hit the lower cushion once and then reach Q.

        (a) Find the reflection Q′ of Q across the cushion, and explain why the straight path from P to Q′ gives the bounce point B.
        (b) Use similar triangles to find the coordinates of B, showing the similarity and the proportion you use.
        (c) Find the total length of the path P → B → Q.
        (d) Suppose a second ball is at R = (13, 4) instead of Q. Without recomputing from scratch, explain how B moves and give its new position.
      answer: |
        (a) Q′ = (13, −2). A path P → X → Q with X on the cushion has the same length as P → X → Q′ because XQ = XQ′ (reflection preserves distance). The shortest route from P to Q′ is the straight segment, so the best bounce is its crossing B with the cushion; the reflection also makes the angles at B equal (it fixes B, swaps the two angles at B), so this path obeys the bounce rule.
        (b) Let F = (1, 0) and G = (13, 0) be the feet of P and Q′. △PFB and △Q′GB have right angles at F and G and vertical angles at B, so they are similar by AA, with PF/Q′G = FB/BG. PF = 4, Q′G = 2, FG = 12, so FB/BG = 2 and FB = 12 × 4/(4 + 2) = 8. B = (9, 0).
        (c) PB = √(8² + 4²) = √80 = 4√5 ≈ 8.94; BQ = √(4² + 2²) = √20 = 2√5 ≈ 4.47. Total 6√5 ≈ 13.42, which equals PQ′ = √(12² + 6²) = √180 = 6√5 as expected.
        (d) With R at the same height as P, the ratio FB/BG becomes 4/4 = 1, so B moves to the midpoint of FG: B = (7, 0). Equal heights give a symmetric bounce.
      explanation: |
        Scoring (6 points). (a) 1 point for Q′ = (13, −2); 1 point for the shortest-path and equal-angles justification. (b) 1 point for naming the similar triangles with AA reasons; 1 point for B = (9, 0) from the proportion. (c) 1 point for the total length 6√5 ≈ 13.42 (either by the two segments or by PQ′). (d) 1 point for B = (7, 0) with the symmetry explanation.
