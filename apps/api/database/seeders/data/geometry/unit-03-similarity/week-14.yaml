      prompt: |
        A triangle has sides 9, 12 and 15. A student says "9² + 12² = 15², so by the Pythagorean theorem it is a right triangle." Explain why the student has cited the wrong theorem, state the correct theorem, and outline how it is proved.
      answer: |
        The Pythagorean theorem starts from a right triangle and concludes a² + b² = c². The student starts from a² + b² = c² and concludes a right angle, which is the converse of the Pythagorean theorem. The converse is proved by constructing a right triangle with legs 9 and 12; by the Pythagorean theorem its hypotenuse is √(81 + 144) = 15, so it has the same three sides as the given triangle; by SSS the triangles are congruent, and so the given triangle's angle opposite the side 15 is a right angle.
      explanation: |
        1 point for distinguishing the theorem (right angle ⇒ equation) from its converse (equation ⇒ right angle). 1 point for naming the converse as the correct justification. 1 point for the proof outline: build a right triangle with the same legs, compute its hypotenuse, apply SSS.

