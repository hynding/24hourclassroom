week: 29
unit: 7
title: "Radian Sense, Using Radians and Putting Circles Together"
topics: ["7.12", "7.13", "7.14"]
guide: guides/week-29.md
guide_description: |
  Estimating and sketching angles given in radians, benchmark angles, arc length rθ and sector area ½r²θ in both directions with applications to wheels, pendulums and angular speed, and modelling problems that combine sectors, chords, tangents, inscribed angles, triangle centres and trigonometry, including cost-per-area comparisons. Worked examples, Try-it problems and a self-check.
flashcards_description: |
  28 cards on radian estimation and benchmarks, the radian formulas for arc length and sector area, and the modelling strategies of the unit's closing lesson. Review them before the week 29 quiz.
flashcards:
  - front: How big is 1 radian, roughly?
    back: |
      A little less than 60° (about 57.3°): the angle whose arc equals the radius. The radius fits around the circle about 6.28 times.
    topic_code: "7.12"
  - front: Radian benchmarks to recognise on sight
    back: |
      π/6 = 30°, π/4 = 45°, π/3 = 60°, π/2 = 90°, π = 180°, 3π/2 = 270°, 2π = 360°.
    topic_code: "7.12"
  - front: Is 2.2 radians acute, right or obtuse?
    back: |
      Obtuse: it is more than π/2 ≈ 1.57 and less than π ≈ 3.14. About 126°.
    topic_code: "7.12"
  - front: Where is 3 radians compared with a half turn?
    back: |
      Just short of it: π ≈ 3.14, so 3 radians is about 172°.
    topic_code: "7.12"
  - front: Sketch an angle of 4 radians → method
    back: |
      4 is between π (half turn) and 3π/2 (three-quarter turn); draw a half turn and add roughly one more radian (about 57°). About 229°.
    topic_code: "7.12"
  - front: Order π/3, 1.5 rad, 100°, 2 rad from smallest
    back: |
      π/3 ≈ 1.05 rad (60°), 1.5 rad ≈ 86°, 100° ≈ 1.75 rad, 2 rad ≈ 115°. Convert to one unit before ordering.
    topic_code: "7.12"
  - front: What fraction of a full turn is 1 radian?
    back: |
      1/(2π) ≈ 0.159, about 16% of a turn.
    topic_code: "7.12"
  - front: 0.3 of a turn in radians
    back: |
      0.3 × 2π = 0.6π ≈ 1.88 radians, about 108°.
    topic_code: "7.12"
  - front: Error-spot → "2.5 radians is a small angle because 2.5 is a small number"
    back: |
      Radians are not degrees. 2.5 radians is more than π/2 ≈ 1.57, an obtuse angle of about 143°.
    topic_code: "7.12"
  - front: Arc length with θ in radians
    back: |
      arc = rθ. Radius 10, θ = 1.2: arc 12. No π appears unless the angle contains one.
    topic_code: "7.13"
  - front: Sector area with θ in radians
    back: |
      area = ½r²θ, or equivalently ½ · r · arc. Radius 10, θ = 1.2: area 60.
    topic_code: "7.13"
  - front: Radius 7, θ = 2π/3 → arc and sector area
    back: |
      Arc 14π/3 ≈ 14.66; area ½ · 49 · 2π/3 = 49π/3 ≈ 51.31.
    topic_code: "7.13"
  - front: Sector of radius 6 with area 27 → angle
    back: |
      ½ · 36 · θ = 27, so θ = 1.5 radians ≈ 86°.
    topic_code: "7.13"
  - front: Sector with θ = 0.8 and area 40 → radius and arc
    back: |
      ½r² · 0.8 = 40 gives r² = 100, r = 10; arc = 8.
    topic_code: "7.13"
  - front: Wheel of radius 35 cm turns through 2.5 radians → distance rolled
    back: |
      35 × 2.5 = 87.5 cm. Ten full turns roll 35 × 20π ≈ 2199 cm, about 22 m.
    topic_code: "7.13"
  - front: Pendulum 2 m long swings through an arc of 0.5 m → angle
    back: |
      0.5/2 = 0.25 radians ≈ 14.3°.
    topic_code: "7.13"
  - front: Angular speed → how to get the speed of a point
    back: |
      Speed along the circle = radius × angular speed (radians per second). At 2π rad every 1.8 s, a point 15 cm out moves ≈ 94.2/1.8 ≈ 52 cm/s.
    topic_code: "7.13"
  - front: Error-spot → "arc = 10 × 60 for a 60° angle in a circle of radius 10"
    back: |
      rθ needs radians. 60° = π/3, so the arc is 10π/3 ≈ 10.47.
    topic_code: "7.13"
  - front: Which formula when → "I measured the arc with string and I know the radius"
    back: |
      Angle = arc ÷ radius (radians); area = ½ · r · arc. No π and no degrees needed.
    topic_code: "7.13"
  - front: Comparing pizza deals → the right measure
    back: |
      Cost per unit area (or area per dollar): slice area = (1/n) · πr² for n equal slices, or ½ · r · arc if you measured the crust.
    topic_code: "7.14"
  - front: 30 cm pizza in 8 slices at $4 versus 40 cm pizza in 12 slices at $5
    back: |
      Slice areas ≈ 88.4 and 104.7 cm²; costs ≈ 4.5 and 4.8 cents per cm². The smaller pizza's slice is the better deal.
    topic_code: "7.14"
  - front: Slice with curved edge 11 cm and radius 14 cm → angle, slice count, area
    back: |
      11/14 ≈ 0.786 rad ≈ 45°, so about 8 slices; area ½ · 14 · 11 = 77 cm².
    topic_code: "7.14"
  - front: Horizontal bar 36 cm below the centre of a round window of radius 60 cm → bar length
    back: |
      Half-chord √(60² − 36²) = 48, so the bar is 96 cm. The area below it is a segment: sector minus triangle.
    topic_code: "7.14"
  - front: Where can a lamp stand so a wall PQ subtends a given angle?
    back: |
      On an arc of a circle through P and Q, by the Inscribed Angle Theorem: every inscribed angle on that arc is the same. Infinitely many positions.
    topic_code: "7.14"
  - front: Largest round table in a triangular corner → which circle
    back: |
      The incircle. For walls 3 m and 4 m meeting at a right angle (third side 5 m), r = Area/s = 6/6 = 1 m.
    topic_code: "7.14"
  - front: Fan-shaped stage of radius 10 m with a 18 m curved front → angle, area, fence
    back: |
      Angle 1.8 rad ≈ 103°; area ½ · 10 · 18 = 90 m²; perimeter 18 + 10 + 10 = 38 m.
    topic_code: "7.14"
  - front: Error-spot → "the bigger slice is always the better deal"
    back: |
      Size without price says nothing. Divide cost by area; a bigger slice can cost more per square centimetre.
    topic_code: "7.14"
  - front: Rounding π in a multi-step problem → when
    back: |
      Carry π (or full calculator precision) through every step and round only the final answer.
    topic_code: "7.14"
quiz:
  description: |
    25 questions · about 40 minutes · Radian estimation and benchmarks, arc length and sector area in radians in both directions, wheels and angular speed, and modelling problems that combine sectors, chords, tangents, inscribed angles, triangle centres and trigonometry, with review of degree–radian conversion, sectors in degrees, the inscribed circle, tangents, inscribed angles, chords and right-triangle trigonometry. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes. Use π ≈ 3.1416 where a decimal is asked for.
  questions:
    - slug: geo-u07-w29-q01
      type: multiple_choice
      topic_code: "7.14"
      source: "IM Geometry, Unit 7, Lesson 14"
      points: 1
      stimulus: |
        Two pizza shops sell by the slice. Shop A cuts a pizza of radius 15 cm into 8 equal slices and charges $4 a slice. Shop B cuts a pizza of radius 20 cm into 12 equal slices and charges $5 a slice.
      prompt: |
        What is the area of one slice from Shop A, to the nearest square centimetre?
      options:
        - "177 cm²"
        - "88 cm²"
        - "59 cm²"
        - "707 cm²"
      option_explanations:
        - |
          177 cm² is a quarter of the pizza, two slices.
        - |
          Correct. The whole pizza is 225π ≈ 706.9 cm², and one eighth is ≈ 88.4 cm².
        - |
          59 cm² is a twelfth of Shop A's pizza, but Shop A cuts 8 slices.
        - |
          707 cm² is the whole pizza, not one slice.
      answer: 1

    - slug: geo-u07-w29-q02
      type: multiple_choice
      topic_code: "7.14"
      source: "IM Geometry, Unit 7, Lesson 14"
      points: 1
      stimulus: |
        Two pizza shops sell by the slice. Shop A cuts a pizza of radius 15 cm into 8 equal slices and charges $4 a slice. Shop B cuts a pizza of radius 20 cm into 12 equal slices and charges $5 a slice.
      prompt: |
        Which slice is the better deal per square centimetre?
      options:
        - "Shop B, at about 4.8 cents per cm² versus about 4.5 cents per cm²"
        - "They are the same, because 4/8 = 5/10"
        - "Shop B, because its slice is bigger"
        - "Shop A, at about 4.5 cents per cm² versus about 4.8 cents per cm²"
      option_explanations:
        - |
          The rates are right but the comparison is backwards: the lower cost per cm² is the better deal.
        - |
          The slice counts and radii differ, so the rates must be computed from areas, not guessed from the prices.
        - |
          A bigger slice can still cost more per unit area; the price must be divided by the area.
        - |
          Correct. A: 400 cents ÷ 88.4 cm² ≈ 4.5 cents per cm². B: 500 ÷ 104.7 ≈ 4.8 cents per cm². The cheaper rate is A.
      answer: 3

    - slug: geo-u07-w29-q03
      type: multiple_choice
      topic_code: "7.13"
      source: "IM Geometry, Unit 7, Lesson 13"
      points: 1
      stimulus: |
        Two pizza shops sell by the slice. Shop A cuts a pizza of radius 15 cm into 8 equal slices and charges $4 a slice. Shop B cuts a pizza of radius 20 cm into 12 equal slices and charges $5 a slice.
      prompt: |
        What is the central angle of a Shop B slice in radians, and how long is its crust (the curved edge)?
      options:
        - "30 radians; crust 600 cm"
        - "π/4 radians; crust 5π ≈ 15.7 cm"
        - "π/6 radians; crust 20π/6 ≈ 10.5 cm"
        - "π/6 radians; crust 20 × 30 = 600 cm"
      option_explanations:
        - |
          A twelfth of a turn is 30°, which is π/6 radians, not 30 radians.
        - |
          π/4 is an eighth of a turn, Shop A's angle; Shop B cuts twelfths.
        - |
          Correct. 2π/12 = π/6, and arc = rθ = 20 · π/6 ≈ 10.5 cm.
        - |
          The angle is right, but rθ must use the radian value π/6, not 30 degrees.
      answer: 2

    - slug: geo-u07-w29-q04
      type: multiple_choice
      topic_code: "7.12"
      source: "IM Geometry, Unit 7, Lesson 12"
      points: 1
      prompt: |
        Without converting exactly, which description of an angle of 2 radians is best?
      options:
        - "Obtuse: a bit more than a right angle"
        - "A little less than a half turn"
        - "A little more than a full turn"
        - "Acute: less than 45°"
      option_explanations:
        - |
          Correct. π/2 ≈ 1.57 is a right angle and π ≈ 3.14 a half turn; 2 radians is about 115°.
        - |
          Just under a half turn would be about 3 radians.
        - |
          A full turn is 2π ≈ 6.28 radians, more than three times 2 radians.
        - |
          45° is π/4 ≈ 0.79 radians, much less than 2.
      answer: 0

    - slug: geo-u07-w29-q05
      type: multiple_choice
      topic_code: "7.12"
      source: "IM Geometry, Unit 7, Lesson 12"
      points: 1
      prompt: |
        Which list is in increasing order of angle size?
      options:
        - "π/4, 70°, 1 radian, 1.5 radians"
        - "π/4, 1 radian, 70°, 1.5 radians"
        - "1 radian, π/4, 70°, 1.5 radians"
        - "70°, π/4, 1 radian, 1.5 radians"
      option_explanations:
        - |
          70° ≈ 1.22 radians is larger than 1 radian (≈ 57°).
        - |
          Correct. π/4 = 45°, 1 radian ≈ 57°, 70° ≈ 1.22 radians, 1.5 radians ≈ 86°.
        - |
          1 radian (≈ 57°) is larger than π/4 (45°).
        - |
          70° is larger than both π/4 and 1 radian, so it cannot come first.
      answer: 1

    - slug: geo-u07-w29-q06
      type: multiple_choice
      topic_code: "7.13"
      source: "IM Geometry, Unit 7, Lesson 13"
      points: 1
      prompt: |
        A sector has radius 8 and central angle 0.75 radians. What are its arc length and area?
      options:
        - "Arc 0.75π, area 24"
        - "Arc 6, area 48"
        - "Arc 6, area 24"
        - "Arc 6, area 3"
      option_explanations:
        - |
          The angle is already in radians, so no π is introduced; arc = 8 × 0.75 = 6.
        - |
          48 forgets the ½ in ½r²θ; it is r²θ = 64 × 0.75.
        - |
          Correct. Arc = rθ = 6; area = ½r²θ = ½ · 64 · 0.75 = 24 (also ½ · 8 · 6).
        - |
          3 is ½ · 8 · 0.75, which mixes up the formulas; area is ½ · r · arc = ½ · 8 · 6.
      answer: 2

    - slug: geo-u07-w29-q07
      type: multiple_choice
      topic_code: "7.13"
      source: "IM Geometry, Unit 7, Lesson 13"
      points: 1
      prompt: |
        A sector of radius 5 has area 10. What is its central angle?
      options:
        - "0.8 radians"
        - "0.4 radians"
        - "4 radians"
        - "2 radians"
      option_explanations:
        - |
          Correct. ½ · 25 · θ = 10 gives θ = 20/25 = 0.8 radians, about 46°.
        - |
          0.4 is 10 ÷ 25, which forgets the ½ in the area formula ½r²θ.
        - |
          4 would give an area of ½ · 25 · 4 = 50, five times too big.
        - |
          2 is 10 ÷ 5, dividing by r instead of by ½r².
      answer: 0

    - slug: geo-u07-w29-q08
      type: multiple_choice
      topic_code: "7.13"
      source: "IM Geometry, Unit 7, Lesson 13"
      points: 1
      prompt: |
        A wheel of radius 0.4 m turns through 15 radians. How far does a point on its rim travel?
      options:
        - "2.4 m"
        - "37.5 m"
        - "0.6π m"
        - "6 m"
      option_explanations:
        - |
          2.4 is 0.4 × 6; the angle is 15 radians, not 6.
        - |
          37.5 divides instead of multiplying; distance along the rim is radius times the angle in radians.
        - |
          No π appears because the angle is already in radians and not expressed with π.
        - |
          Correct. Arc length = rθ = 0.4 × 15 = 6 m, since the angle is in radians.
      answer: 3

    - slug: geo-u07-w29-q09
      type: multiple_choice
      topic_code: "7.14"
      source: "IM Geometry, Unit 7, Lesson 14"
      points: 1
      prompt: |
        A lamp must be placed so that the two ends P and Q of a 10 m wall are seen from it at an angle of exactly 45°. Which describes all possible positions?
      options:
        - "An arc of a circle through P and Q on which PQ subtends an inscribed angle of 45°, by the Inscribed Angle Theorem"
        - "The single point on the perpendicular bisector of PQ at distance 5 m from the wall"
        - "The perpendicular bisector of PQ"
        - "Any point 10 m from the midpoint of PQ"
      option_explanations:
        - |
          Correct. All inscribed angles on the same arc are equal, so every point of that arc (central angle 90°, radius 5√2 m) works.
        - |
          That point works (it is on the arc), but it is only one of infinitely many positions.
        - |
          Moving along the bisector changes the angle: close to the wall it is near 180°, far away it is near 0°.
        - |
          Points at a fixed distance from the midpoint do not see PQ at the same angle unless they lie on the right arc.
      answer: 0

    - slug: geo-u07-w29-q10
      type: multiple_choice
      topic_code: "7.14"
      source: "IM Geometry, Unit 7, Lesson 14"
      points: 1
      prompt: |
        A circular window of radius 60 cm has a horizontal bar 36 cm below the centre. How long is the bar?
      options:
        - "120 cm"
        - "96 cm"
        - "48 cm"
        - "72 cm"
      option_explanations:
        - |
          120 cm is the diameter; a chord 36 cm from the centre is shorter than the diameter.
        - |
          Correct. The perpendicular from the centre bisects the chord; the half-chord is √(60² − 36²) = 48, so the bar is 96 cm.
        - |
          48 cm is half the bar, from the centre line to one end.
        - |
          72 cm is twice 36, the distance from the centre, which is not the half-chord.
      answer: 1

    - slug: geo-u07-w29-q11
      type: multiple_choice
      topic_code: "7.11"
      source: "IM Geometry, Unit 7, Lesson 11"
      points: 1
      prompt: |
        Review. Which angle is equal to 225°?
      options:
        - "4π/5 radians"
        - "5π/8 radians"
        - "5π/4 radians"
        - "225π radians"
      option_explanations:
        - |
          4π/5 radians is 144°, which inverts the fraction 5/4.
        - |
          5π/8 radians is 112.5°, half the required angle.
        - |
          Correct. 225 × π/180 = 225π/180 = 5π/4, which is π + π/4, a half turn plus 45°.
        - |
          Multiplying by π alone, without dividing by 180, is not a conversion.
      answer: 2

    - slug: geo-u07-w29-q12
      type: multiple_choice
      topic_code: "4.5"
      source: "IM Geometry, Unit 4, Lesson 5"
      points: 1
      prompt: |
        Review. In the round window of radius 60 cm with a bar 36 cm below the centre, what is the cosine of the angle between the vertical radius to the bar's midpoint and the radius to one end of the bar?
      options:
        - "1.25"
        - "0.75"
        - "0.8"
        - "0.6"
      option_explanations:
        - |
          1.25 is 60/48, a hypotenuse over a leg, which is not a cosine.
        - |
          0.75 is 36/48, the tangent of the complementary angle.
        - |
          0.8 is the sine, 48/60, the half-chord over the radius.
        - |
          Correct. In the right triangle formed by the centre, the bar's midpoint and one end, the adjacent leg is 36 and the hypotenuse is 60: cos = 36/60 = 0.6.
      answer: 3

    - slug: geo-u07-w29-q13
      type: multiple_choice
      topic_code: "7.7"
      source: "IM Geometry, Unit 7, Lesson 7"
      points: 1
      prompt: |
        Review. A triangular patio has sides 5 m, 12 m and 13 m. What is the radius of the largest circular table that can touch all three edges?
      options:
        - "3 m"
        - "2 m"
        - "4 m"
        - "6.5 m"
      option_explanations:
        - |
          3 m is the inradius of the 8-15-17 triangle, not this one.
        - |
          Correct. The table is the inscribed circle: area 30, s = 15, r = 30/15 = 2 m.
        - |
          4 m would need an area of 60 with s = 15; the area is ½ · 5 · 12 = 30.
        - |
          6.5 m is the circumradius (half the hypotenuse), the circle through the corners, not the one touching the edges.
      answer: 1

    - slug: geo-u07-w29-q14
      type: multi_select
      topic_code: "7.12"
      source: "IM Geometry, Unit 7, Lesson 12"
      points: 2
      partial_credit: true
      prompt: |
        Which angles are obtuse (strictly between a right angle and a half turn)? Select all that apply.
      options:
        - "2 radians"
        - "3 radians"
        - "1.5 radians"
        - "5π/6 radians"
        - "4 radians"
      option_explanations:
        - |
          Yes: 2 is between π/2 ≈ 1.57 and π ≈ 3.14 (about 115°).
        - |
          Yes: 3 is just under π ≈ 3.14 (about 172°).
        - |
          No: 1.5 is slightly less than π/2 ≈ 1.571, so it is acute (about 86°).
        - |
          Yes: 5π/6 radians is 150°, between 90° and 180°.
        - |
          No: 4 is more than π, a reflex angle of about 229°.
      answer: [0, 1, 3]

    - slug: geo-u07-w29-q15
      type: multi_select
      topic_code: "7.3"
      source: "IM Geometry, Unit 7, Lesson 3"
      points: 2
      partial_credit: true
      prompt: |
        Review. A round table of radius 1 m stands in a corner touching two walls that meet at a right angle. Which statements are true? Select all that apply.
      options:
        - "The centre is 1 m from the corner point"
        - "The radius to a point where the table touches a wall is perpendicular to that wall"
        - "The table's centre is 1 m from each wall"
        - "The centre lies on the bisector of the corner's right angle"
        - "Each wall is tangent to the table's edge"
      option_explanations:
        - |
          No: the centre is 1 m from each wall, so it is √2 ≈ 1.41 m from the corner.
        - |
          Yes: a tangent is perpendicular to the radius at the point of tangency.
        - |
          Yes: the perpendicular distance from the centre to a tangent line is the radius, 1 m.
        - |
          Yes: the centre is equidistant from the two walls, so it is on the angle bisector.
        - |
          Yes: each wall meets the circle at exactly one point.
      answer: [1, 2, 3, 4]

    - slug: geo-u07-w29-q16
      type: true_false
      topic_code: "7.13"
      source: "IM Geometry, Unit 7, Lesson 13"
      points: 1
      prompt: |
        True or false: for a central angle θ measured in radians, the sector area equals half the radius times the arc length.
      answer: true
      explanation: |
        True. Area = ½r²θ = ½ · r · (rθ) = ½ · r · arc. This is why arc length and area together determine the radius.

    - slug: geo-u07-w29-q17
      type: true_false
      topic_code: "7.8"
      source: "IM Geometry, Unit 7, Lesson 8"
      points: 1
      prompt: |
        Review. True or false: a sector with central angle 90° in a circle of radius 10 has arc length 5π.
      answer: true
      explanation: |
        True. A quarter of the circumference 20π is 5π; in radians, 10 × π/2 = 5π.

    - slug: geo-u07-w29-q18
      type: fill_blank
      topic_code: "7.13"
      source: "IM Geometry, Unit 7, Lesson 13"
      points: 1
      prompt: |
        A sector with central angle 1.2 radians has area 60. Its radius is ____.
      answer: ["10"]
      explanation: |
        ½r² · 1.2 = 60 gives r² = 100, so r = 10.

    - slug: geo-u07-w29-q19
      type: fill_blank
      topic_code: "7.2"
      source: "IM Geometry, Unit 7, Lesson 2"
      points: 1
      prompt: |
        Review. If a wall PQ must be seen at an inscribed angle of 60°, the lamp lies on a circle in which PQ subtends a central angle of ____°.
      answer: ["120"]
      explanation: |
        The central angle on an arc is twice the inscribed angle: 2 × 60° = 120°.

    - slug: geo-u07-w29-q20
      type: numeric
      topic_code: "7.13"
      source: "IM Geometry, Unit 7, Lesson 13"
      points: 1
      prompt: |
        A pendulum 2.5 m long swings through an arc of 0.8 m. Through what angle does it swing, in radians? Give your answer to two decimal places.
      answer: { value: 0.32, tolerance: 0.005 }
      explanation: |
        θ = arc ÷ radius = 0.8/2.5 = 0.32 radians (about 18.3°).

    - slug: geo-u07-w29-q21
      type: numeric
      topic_code: "7.14"
      source: "IM Geometry, Unit 7, Lesson 14"
      points: 1
      prompt: |
        A slice of pizza has a curved edge of 12 cm and straight edges of 16 cm. What is the area of the slice in cm²? Give an integer.
      answer: { value: 96, tolerance: 0 }
      explanation: |
        Area = ½ · r · arc = ½ · 16 · 12 = 96 cm². (The angle is 12/16 = 0.75 radians, about 43°.)

    - slug: geo-u07-w29-q22
      type: numeric
      topic_code: "7.12"
      source: "IM Geometry, Unit 7, Lesson 12"
      points: 1
      prompt: |
        What fraction of a full turn is an angle of 1.5 radians? Give your answer as a decimal to three places.
      answer: { value: 0.239, tolerance: 0.002 }
      explanation: |
        1.5/(2π) = 1.5/6.2832 ≈ 0.239, a little under a quarter turn (a quarter turn is π/2 ≈ 1.571).

    - slug: geo-u07-w29-q23
      type: short_answer
      topic_code: "7.14"
      source: "IM Geometry, Unit 7, Lesson 14"
      points: 3
      prompt: |
        A fan-shaped stage is a sector of radius 10 m. The curved front edge is 15 m long.

        (a) Find the central angle in radians and in degrees (to the nearest degree).
        (b) Find the area of the stage.
        (c) The stage is enlarged so that the radius becomes 14 m with the same angle. Find the new front edge and the new area without re-deriving the angle, explaining the factors you use.
      answer: |
        (a) θ = 15/10 = 1.5 radians ≈ 86°.
