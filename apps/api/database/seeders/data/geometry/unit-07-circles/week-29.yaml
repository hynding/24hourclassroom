    - slug: geo-u07-w29-q25
      type: long_answer
      topic_code: "7.14"
      source: "IM Geometry, Unit 7, Lesson 14"
      points: 6
      prompt: |
        A city is designing a circular fountain of radius 6 m inside a triangular plaza whose sides are 15 m, 20 m and 25 m, and a decorative sector-shaped flower bed elsewhere.

        (a) Show that the plaza is a right triangle and find the radius of the largest circle that fits inside it, touching all three sides. Does the 6 m fountain fit?
        (b) The fountain is actually built with radius 5 m. A footbridge crosses it as a chord 3 m from the centre. How long is the bridge?
        (c) The flower bed is a sector of radius 9 m whose curved edge is 13.5 m long. Find its central angle in radians and its area.
        (d) Edging costs $12 per metre. Find the cost of edging the entire flower bed (both straight sides and the curved edge).
      answer: |
        (a) 15² + 20² = 225 + 400 = 625 = 25², so the plaza is right-angled (legs 15 and 20). Area = ½ · 15 · 20 = 150 m², s = 30 m, so the inradius is 150/30 = 5 m (also (15 + 20 − 25)/2 = 5). A 6 m fountain does not fit; the largest that touches all three sides has radius 5 m.
        (b) Half-chord = √(5² − 3²) = 4 m, so the bridge is 8 m long.
        (c) θ = 13.5/9 = 1.5 radians (about 86°). Area = ½ · 9 · 13.5 = 60.75 m² (or ½ · 81 · 1.5).
        (d) Perimeter = 13.5 + 9 + 9 = 31.5 m. Cost = 31.5 × 12 = $378.
      explanation: |
        Scoring (6 points): (a) 2 points: 1 for the Pythagorean check and the area, 1 for r = 5 m and "does not fit". (b) 1 point for 8 m. (c) 2 points: 1 for 1.5 radians, 1 for 60.75 m². (d) 1 point for 31.5 m and $378.
