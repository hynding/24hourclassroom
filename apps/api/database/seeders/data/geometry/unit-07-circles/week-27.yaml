      source: "IM Geometry, Unit 2, Lesson 14"
      points: 3
      prompt: |
        Review. Triangle ABC is isosceles with AB = AC = 10 and BC = 12. Let M be the midpoint of BC.

        (a) Explain why the incentre and the circumcentre both lie on line AM.
        (b) Find AM.
        (c) Place the triangle with M = (0, 0), B = (−6, 0), C = (6, 0) and A = (0, 8). Find the circumcentre and the circumradius.
      answer: |
        (a) AM is the line of symmetry of the isosceles triangle: it is the perpendicular bisector of BC and also the bisector of ∠A. The circumcentre lies on every perpendicular bisector and the incentre on every angle bisector, so both lie on AM.
        (b) AM is the height: AM = √(10² − 6²) = √64 = 8.
        (c) The circumcentre is (0, k) on the y-axis, equidistant from B and A: 36 + k² = (8 − k)², so 36 = 64 − 16k and k = 28/16 = 1.75. Circumcentre (0, 1.75), circumradius 8 − 1.75 = 6.25. (Check: √(36 + 1.75²) = √39.0625 = 6.25.)
      explanation: |
        1 point for the symmetry argument (AM is both the perpendicular bisector of BC and the bisector of ∠A). 1 point for AM = 8. 1 point for the circumcentre (0, 1.75) and radius 6.25.

    - slug: geo-u07-w27-q25
      type: long_answer
      topic_code: "7.7"
      source: "IM Geometry, Unit 7, Lesson 7"
      points: 6
      prompt: |
        A triangular park has sides 7 m, 24 m and 25 m. The city wants (i) the largest possible circular flower bed that fits inside the park and (ii) a single lamp post equally far from the three corners.

        (a) Show that the park is a right triangle and find its area.
        (b) Find the radius of the flower bed and explain which centre of the triangle it is planted around.
        (c) Find the distance from the lamp post to each corner and say exactly where the post stands.
        (d) Explain why the flower bed touches each side of the park at exactly one point.
      answer: |
        (a) 7² + 24² = 49 + 576 = 625 = 25², so by the converse of the Pythagorean theorem the angle between the 7 m and 24 m sides is a right angle. Area = ½ · 7 · 24 = 84 m².
        (b) The largest circle inside a triangle is the inscribed circle, centred at the incentre (where the angle bisectors meet). s = (7 + 24 + 25)/2 = 28, so r = Area/s = 84/28 = 3 m. (Check: (7 + 24 − 25)/2 = 3.)
        (c) Equally far from the three corners means the circumcentre. For a right triangle it is the midpoint of the hypotenuse, so the post stands at the midpoint of the 25 m side, 12.5 m from each corner.
        (d) The incentre is the same perpendicular distance r = 3 m from each side, so the perpendicular from the incentre to a side ends on the circle. A line perpendicular to a radius at its endpoint on the circle is tangent, so each side touches the circle at exactly that one point.
      explanation: |
        Scoring (6 points): (a) 1 point for the Pythagorean check and the area 84. (b) 2 points: 1 for r = 3 m, 1 for identifying the incentre/angle bisectors. (c) 2 points: 1 for the midpoint of the hypotenuse (circumcentre), 1 for 12.5 m. (d) 1 point for the equal perpendicular distances plus the tangent–radius argument.
