week: 27
unit: 7
title: "Circumscribed Circles, the Incentre and Inscribed Circles"
topics: ["7.5", "7.6", "7.7"]
guide: guides/week-27.md
guide_description: |
  The proof that the perpendicular bisectors of a triangle meet at one point and the construction of the circumscribed circle, where the circumcentre lies for acute, right and obtuse triangles, the angle bisector as the set of points equidistant from two sides, the concurrency of angle bisectors at the incentre, the construction of the inscribed circle, and the inradius from Area = s · r. Worked examples, Try-it problems and a self-check.
flashcards_description: |
  28 cards on the circumcentre and circumscribed circle, the angle-bisector locus, the incentre, the inscribed circle and the inradius formula. Review them before the week 27 quiz.
flashcards:
  - front: Circumscribed circle of a triangle → definition
    back: |
      The circle through all three vertices. Its centre is the circumcentre and its radius is the circumradius R.
    topic_code: "7.5"
  - front: Why the three perpendicular bisectors of a triangle meet at one point
    back: |
      Where the bisectors of AB and BC meet, SA = SB and SB = SC (Perpendicular Bisector Theorem), so SA = SC and S is on the third bisector by the converse.
    topic_code: "7.5"
  - front: Construct the circumscribed circle → steps
    back: |
      Construct the perpendicular bisectors of two sides; mark their intersection S; set the compass to SA and draw the circle.
    topic_code: "7.5"
  - front: Circumcentre of an acute, a right and an obtuse triangle → where
    back: |
      Acute: inside. Right: the midpoint of the hypotenuse. Obtuse: outside, beyond the longest side.
    topic_code: "7.5"
  - front: Why the circumcentre of a right triangle is the midpoint of the hypotenuse
    back: |
      The right angle is inscribed in a semicircle, so the hypotenuse is a diameter and its midpoint is the centre. R is half the hypotenuse.
    topic_code: "7.5"
  - front: Circumradius of a right triangle with legs 6 and 8
    back: |
      Hypotenuse 10, so R = 5.
    topic_code: "7.5"
  - front: Circumradius of an equilateral triangle with side s
    back: |
      R = s/√3 = s√3/3: two thirds of the height s√3/2. For side 12, R = 4√3 ≈ 6.93.
    topic_code: "7.5"
  - front: Why two different circles share at most two points
    back: |
      Three shared points would put both centres on all three perpendicular bisectors, which meet at one point, so the circles would have the same centre and radius.
    topic_code: "7.5"
  - front: Which centre when → "equally far from three towns"
    back: |
      The circumcentre of the triangle the towns form: equidistant from three points means perpendicular bisectors.
    topic_code: "7.5"
  - front: Distance from a point to a line → how it is defined
    back: |
      The length of the perpendicular segment from the point to the line, never a slanted one.
    topic_code: "7.6"
  - front: Angle bisector as a locus → statement
    back: |
      A point is on the bisector of an angle if and only if it is equidistant from the angle's two sides.
    topic_code: "7.6"
  - front: On the bisector ⇒ equidistant → proof
    back: |
      Drop perpendiculars from P to both sides. The two triangles have right angles, equal half-angles at the vertex and the shared side PV, so they are congruent by AAS and the perpendiculars are equal.
    topic_code: "7.6"
  - front: Equidistant ⇒ on the bisector → proof
    back: |
      The two right triangles share hypotenuse PV and have equal legs (the distances), so they are congruent by HL and the angles at V are equal.
    topic_code: "7.6"
  - front: Incentre → definition
    back: |
      The common point of the three angle bisectors of a triangle. It is equidistant from the three sides and always lies inside the triangle.
    topic_code: "7.6"
  - front: Why the three angle bisectors meet at one point
    back: |
      Where the bisectors of ∠A and ∠B meet, the point is equidistant from AB and AC and from AB and BC, hence from AC and BC, so it is on the bisector of ∠C.
    topic_code: "7.6"
  - front: Salt poured on a cardboard triangle → what the ridges show
    back: |
      Grains settle where they are equally far from two edges, so the ridges lie along the angle bisectors and meet at a peak above the incentre.
    topic_code: "7.6"
  - front: Angle at the incentre → ∠AIB in terms of ∠C
    back: |
      ∠AIB = 180° − ½∠A − ½∠B = 90° + ½∠C. With ∠A = 70° and ∠B = 50°, ∠AIB = 120°.
    topic_code: "7.6"
  - front: Error-spot → "the incentre is equidistant from the vertices"
    back: |
      That is the circumcentre. The incentre is equidistant from the three sides, measured perpendicularly.
    topic_code: "7.6"
  - front: Inscribed circle of a triangle → definition
    back: |
      The circle inside the triangle tangent to all three sides. Its centre is the incentre and its radius is the inradius r.
    topic_code: "7.7"
  - front: Construct the inscribed circle → steps
    back: |
      Bisect two angles to find I; drop a perpendicular from I to one side, meeting it at F; draw the circle centred at I with radius IF.
    topic_code: "7.7"
  - front: Why the inscribed circle is tangent to all three sides
    back: |
      Each perpendicular from I to a side has length r and meets the side at a point of the circle; a line perpendicular to a radius at its endpoint on the circle is tangent.
    topic_code: "7.7"
  - front: Inradius formula → Area = s · r
    back: |
      Joining I to the vertices splits the triangle into three triangles of height r on bases a, b, c, so Area = ½(a + b + c)r = sr with s the semiperimeter. r = Area/s.
    topic_code: "7.7"
  - front: Inradius of a 3-4-5 triangle
    back: |
      Area 6, semiperimeter 6, so r = 1.
    topic_code: "7.7"
  - front: Inradius of a right triangle with legs a, b and hypotenuse c → shortcut
    back: |
      r = (a + b − c)/2. For 5-12-13, r = 2; check with Area/s = 30/15 = 2.
    topic_code: "7.7"
  - front: Inradius of an equilateral triangle with side 12
    back: |
      Area 36√3, s = 18, so r = 2√3 ≈ 3.46: exactly half the circumradius 4√3.
    topic_code: "7.7"
  - front: Inradius of the 13-14-15 triangle
    back: |
      Area 84 (height 12 on the side 14), s = 21, so r = 4.
    topic_code: "7.7"
  - front: Which centre when → "largest circular pond inside a triangular garden"
    back: |
      The inscribed circle: centre at the incentre (angle bisectors), radius Area/s. It touches all three edges.
    topic_code: "7.7"
  - front: Circumcircle versus incircle → the one-line contrast
    back: |
      Circumcircle: through the vertices, centre on the perpendicular bisectors. Incircle: tangent to the sides, centre on the angle bisectors.
    topic_code: "7.7"
quiz:
  description: |
    25 questions · about 40 minutes · The circumscribed circle and its proof, the location of the circumcentre, the angle-bisector locus and the incentre, the inscribed circle and the inradius, with review of the Perpendicular Bisector Theorem, the angle bisector theorem, HL and AAS congruence, inscribed angles, tangents, the Pythagorean theorem, 30-60-90 triangles and coordinate circumcentres. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: geo-u07-w27-q01
      type: multiple_choice
      topic_code: "7.7"
      source: "IM Geometry, Unit 7, Lesson 7"
      points: 1
      stimulus: |
        Figure description: triangle ABC has AB = 13, BC = 14 and CA = 15. The height from A to side BC is 12 and meets BC at a point D with BD = 5 and DC = 9.
      prompt: |
        What is the area of triangle ABC, and what is its semiperimeter?
      options:
        - "Area 90, semiperimeter 21"
        - "Area 168, semiperimeter 42"
        - "Area 84, semiperimeter 42"
        - "Area 84, semiperimeter 21"
      option_explanations:
        - |
          The area uses base 14 and height 12: ½ · 14 · 12 = 84, not 90.
        - |
          168 is base × height without the ½, and 42 is the full perimeter.
        - |
          The area is right but the semiperimeter is half of 42, which is 21.
        - |
          Correct. Area = ½ · 14 · 12 = 84, and s = (13 + 14 + 15)/2 = 21.
      answer: 3

    - slug: geo-u07-w27-q02
      type: multiple_choice
      topic_code: "7.7"
      source: "IM Geometry, Unit 7, Lesson 7"
      points: 1
      stimulus: |
        Figure description: triangle ABC has AB = 13, BC = 14 and CA = 15. The height from A to side BC is 12 and meets BC at a point D with BD = 5 and DC = 9.
      prompt: |
        What is the radius of the circle inscribed in triangle ABC?
      options:
        - "4"
        - "2"
        - "6"
        - "12"
      option_explanations:
        - |
          Correct. Area = s · r gives 84 = 21r, so r = 4.
        - |
          2 would come from dividing by the full perimeter 42 instead of the semiperimeter.
        - |
          6 is half the height, which is not related to the inradius in general.
        - |
          12 is the height from A, not the distance from the incentre to the sides.
      answer: 0

    - slug: geo-u07-w27-q03
      type: multiple_choice
      topic_code: "7.5"
      source: "IM Geometry, Unit 7, Lesson 5"
      points: 1
      stimulus: |
        Figure description: triangle ABC has AB = 13, BC = 14 and CA = 15. The height from A to side BC is 12 and meets BC at a point D with BD = 5 and DC = 9.
      prompt: |
        Is the circumcentre of triangle ABC inside, on or outside the triangle?
      options:
        - "Outside, because the triangle is not equilateral"
        - "On the side BC, because BC is the longest side"
        - "Inside, because all three angles are acute"
        - "At D, the foot of the height"
      option_explanations:
        - |
          Being non-equilateral does not push the circumcentre outside; only an obtuse angle does.
        - |
          The circumcentre lies on a side only for a right triangle, at the midpoint of the hypotenuse; this triangle has no right angle.
        - |
          Correct. The largest angle is opposite the longest side, 15: 13² + 14² = 365 > 225 = 15², so that angle is acute and so are the others; an acute triangle's circumcentre is inside.
        - |
          D is where the height meets BC, 5 from B and 9 from C, so it is not even equidistant from B and C.
      answer: 2

    - slug: geo-u07-w27-q04
      type: multiple_choice
      topic_code: "7.5"
      source: "IM Geometry, Unit 7, Lesson 5"
      points: 1
      prompt: |
        In the proof that the perpendicular bisectors of a triangle are concurrent, S is the intersection of the bisectors of AB and BC. Which statement completes the proof?
      options:
        - "The three bisectors are parallel, so they meet at a point at infinity"
        - "SA = SB and SB = SC, so SA = SC and S lies on the perpendicular bisector of AC by the converse of the Perpendicular Bisector Theorem"
        - "S is the midpoint of AC, so it lies on the perpendicular bisector of AC"
        - "Triangle SAB is equilateral, so S is equidistant from all vertices"
      option_explanations:
        - |
          The bisectors are perpendicular to non-parallel sides, so they are not parallel and meet at a real point.
        - |
          Correct. Each bisector gives an equal pair of distances; combining them makes S equidistant from A and C, and the converse puts S on the third bisector.
        - |
          S is almost never the midpoint of AC; it is equidistant from A and C, which is a different thing.
        - |
          SA = SB makes triangle SAB isosceles, not equilateral; nothing forces AB to equal the radius.
      answer: 1

    - slug: geo-u07-w27-q05
      type: multiple_choice
      topic_code: "7.5"
      source: "IM Geometry, Unit 7, Lesson 5"
      points: 1
      prompt: |
        A triangle has angles 25°, 35° and 120°. Where is its circumcentre?
      options:
        - "Outside the triangle, on the far side of the longest side"
        - "At the midpoint of the longest side"
        - "At the vertex of the 120° angle"
        - "Inside the triangle"
      option_explanations:
        - |
          Correct. The triangle is obtuse, and the circumcentre of an obtuse triangle lies outside, beyond the side opposite the obtuse angle.
        - |
          The midpoint of the longest side is the circumcentre only for a right triangle.
        - |
          The circumcentre is equidistant from all three vertices, so it cannot be one of them.
        - |
          Only an acute triangle has its circumcentre inside.
      answer: 0

    - slug: geo-u07-w27-q06
      type: multiple_choice
      topic_code: "7.6"
      source: "IM Geometry, Unit 7, Lesson 6"
      points: 1
      prompt: |
        Point P lies on the bisector of ∠XVY. The perpendicular from P to ray VX has length 7. What is the perpendicular distance from P to ray VY, and why?
      options:
        - "It cannot be determined without the angle measure"
        - "7, because a point on an angle bisector is equidistant from the two sides"
        - "14, because the bisector doubles distances"
        - "7, because P is the midpoint of XY"
      option_explanations:
        - |
          The angle's size does not matter; the bisector locus works for every angle.
        - |
          Correct. The two right triangles formed with V are congruent by AAS, so the perpendicular distances are equal.
        - |
          Distances to the two sides are equal, not doubled.
        - |
          P is not on segment XY in general; the result is about distances to the rays, not about midpoints.
      answer: 1

    - slug: geo-u07-w27-q07
      type: multiple_choice
      topic_code: "7.6"
      source: "IM Geometry, Unit 7, Lesson 6"
      points: 1
      prompt: |
        Which congruence criterion proves that a point on an angle bisector is equidistant from the two sides, using the two right triangles formed by the perpendiculars to the sides?
      options:
        - "SSS: all three sides are known"
        - "HL: the shared hypotenuse and the equal perpendiculars"
        - "AAS: right angles, equal half-angles at the vertex, and the shared segment from the vertex to the point"
        - "SAS: two sides and the included right angle"
      option_explanations:
        - |
          Only one side (the shared one) is known before the proof; the perpendiculars are what we want to show equal.
        - |
          HL is used for the converse (equidistant ⇒ on the bisector), where the perpendiculars are given as equal.
        - |
          Correct. The right angle, the half-angle and the non-included shared side give AAS, and the perpendiculars are then corresponding parts.
        - |
          The included angle between the known sides is not known to be equal; the equal angles are at the vertex, not at the right angle.
      answer: 2

    - slug: geo-u07-w27-q08
      type: multiple_choice
      topic_code: "7.7"
      source: "IM Geometry, Unit 7, Lesson 7"
      points: 1
      prompt: |
        A right triangle has legs 8 and 15. What is the radius of its inscribed circle?
      options:
        - "6"
        - "8.5"
        - "4"
        - "3"
      option_explanations:
        - |
          6 is the area divided by 10, half the semiperimeter; the correct divisor is s = 20.
        - |
          8.5 is the circumradius, half the hypotenuse, not the inradius.
        - |
          4 would need an area of 80; the area is ½ · 8 · 15 = 60.
        - |
          Correct. Hypotenuse 17, area 60, semiperimeter 20: r = 60/20 = 3. Also (8 + 15 − 17)/2 = 3.
      answer: 3

    - slug: geo-u07-w27-q09
      type: multiple_choice
      topic_code: "7.7"
      source: "IM Geometry, Unit 7, Lesson 7"
      points: 1
      prompt: |
        Why is the circle centred at the incentre I with radius equal to the distance from I to side AB tangent to all three sides?
      options:
        - "The angle bisectors are perpendicular to the sides"
        - "Every circle inside a triangle touches all three sides"
        - "I is equidistant from the three vertices, so the circle passes through them"
        - "I is the same perpendicular distance from each side, and a line perpendicular to a radius at its endpoint on the circle is tangent"
      option_explanations:
        - |
          Angle bisectors are not perpendicular to the sides; the perpendiculars from I are separate segments.
        - |
          A small circle near one vertex touches no side at all; tangency to all three needs the incentre and the right radius.
        - |
          That describes the circumcentre and the circumscribed circle, not the inscribed one.
        - |
          Correct. Each perpendicular from I to a side has length r and ends at a point of the circle, and the side is perpendicular to that radius there.
      answer: 3

    - slug: geo-u07-w27-q10
      type: multiple_choice
      topic_code: "7.6"
      source: "IM Geometry, Unit 7, Lesson 6"
      points: 1
      prompt: |
        Triangle ABC has ∠A = 64° and ∠B = 48°. The incentre is I. What is ∠AIB?
      options:
        - "124°"
        - "136°"
        - "112°"
        - "68°"
      option_explanations:
        - |
          Correct. ∠IAB = 32° and ∠IBA = 24°, so ∠AIB = 180° − 32° − 24° = 124°, which is 90° + ½∠C with ∠C = 68°.
        - |
          136° is 180° − 44°, which halves only one of the two base angles.
        - |
          112° is 180° − 68°, the supplement of ∠C; the incentre angle is 90° plus half of ∠C.
        - |
          68° is ∠C itself, the third angle of the triangle, not the angle at the incentre.
      answer: 0

    - slug: geo-u07-w27-q11
      type: multiple_choice
      topic_code: "2.8"
      source: "IM Geometry, Unit 2, Lesson 8"
      points: 1
      prompt: |
        Review. Which theorem guarantees that a point on the perpendicular bisector of AB is the same distance from A as from B?
      options:
        - "The triangle angle sum theorem"
        - "The Perpendicular Bisector Theorem"
        - "The Inscribed Angle Theorem"
        - "The angle bisector locus theorem"
      option_explanations:
        - |
          The angle sum theorem says nothing about distances.
        - |
          Correct. Every point on the perpendicular bisector of a segment is equidistant from its endpoints; its converse places equidistant points on the bisector.
        - |
          The Inscribed Angle Theorem relates inscribed and central angles, not distances to endpoints.
        - |
          The angle bisector result is about distances to two lines, not to two points.
      answer: 1

    - slug: geo-u07-w27-q12
      type: multiple_choice
      topic_code: "4.3"
      source: "IM Geometry, Unit 4, Lesson 3"
      points: 1
      prompt: |
        Review. An equilateral triangle has side 10. What is its height, and what is its circumradius?
      options:
        - "Height 5, circumradius 5√3/3"
        - "Height 10√3, circumradius 5"
        - "Height 5√3, circumradius 10√3/3"
        - "Height 5√3, circumradius 5√3"
      option_explanations:
        - |
          The height is the long leg, 5√3, not the short leg 5.
        - |
          The height of a 30-60-90 triangle with hypotenuse 10 is 5√3, not 10√3.
        - |
          Correct. Half the triangle is a 30-60-90 triangle with hypotenuse 10 and short leg 5, so the height is 5√3; the circumcentre is 2/3 of the way along the height from a vertex: (2/3)(5√3) = 10√3/3.
        - |
          The circumradius is two thirds of the height, not the whole height.
      answer: 2

    - slug: geo-u07-w27-q13
      type: multiple_choice
      topic_code: "7.2"
      source: "IM Geometry, Unit 7, Lesson 2"
      points: 1
      prompt: |
        Review. Triangle PQR is inscribed in a circle, and the circumcentre is the midpoint of PR. What can you conclude?
      options:
        - "∠PQR = 90°, because PR is a diameter and the angle at Q is inscribed in a semicircle"
        - "The triangle is equilateral"
        - "∠P = ∠R"
        - "PQ = QR"
      option_explanations:
        - |
          Correct. A chord through the centre is a diameter, and an angle inscribed in a semicircle is a right angle.
        - |
          An equilateral triangle has no 90° angle, so it is impossible here.
        - |
          ∠P = ∠R only if Q is at the top of the semicircle, making PQ = QR.
        - |
          Q can be anywhere on the semicircle, so the legs need not be equal.
      answer: 0

    - slug: geo-u07-w27-q14
      type: multi_select
      topic_code: "7.5"
      source: "IM Geometry, Unit 7, Lesson 5"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the circumcentre S of a triangle are true? Select all that apply.
      options:
        - "S is equidistant from the three sides"
        - "S lies on the perpendicular bisector of every side"
        - "S is equidistant from the three vertices"
        - "For a right triangle, S is the midpoint of the hypotenuse"
        - "S is always inside the triangle"
      option_explanations:
        - |
          No: equidistant from the sides describes the incentre.
        - |
          Yes: that is how S is defined, and the concurrency theorem shows all three bisectors pass through it.
        - |
          Yes: by the Perpendicular Bisector Theorem applied to each side.
        - |
          Yes: the hypotenuse is a diameter of the circumscribed circle.
        - |
          No: it is outside for an obtuse triangle and on the hypotenuse for a right triangle.
      answer: [1, 2, 3]

    - slug: geo-u07-w27-q15
      type: multi_select
      topic_code: "7.7"
      source: "IM Geometry, Unit 7, Lesson 7"
      points: 2
      partial_credit: true
      prompt: |
        A triangle has sides 6, 8 and 10. Which statements are true? Select all that apply.
      options:
        - "Its area is 24"
        - "Its inradius is 2"
        - "Its circumcentre lies on the side of length 10"
        - "Its incentre and circumcentre coincide"
        - "Its circumradius is 5"
      option_explanations:
        - |
          Yes: 6² + 8² = 10², so it is a right triangle with area ½ · 6 · 8 = 24.
        - |
          Yes: s = 12 and r = 24/12 = 2 (also (6 + 8 − 10)/2 = 2).
        - |
          Yes: the circumcentre of a right triangle is the midpoint of the hypotenuse.
        - |
          No: the two centres coincide only for an equilateral triangle; here the incentre is inside and the circumcentre is on the hypotenuse.
        - |
          Yes: the circumradius of a right triangle is half the hypotenuse, 5.
      answer: [0, 1, 2, 4]

    - slug: geo-u07-w27-q16
      type: true_false
      topic_code: "7.6"
      source: "IM Geometry, Unit 7, Lesson 6"
      points: 1
      prompt: |
        True or false: the incentre of a triangle is always inside the triangle.
      answer: true
      explanation: |
        True. Each angle bisector of an interior angle passes through the interior of the triangle, so their common point is inside; this is unlike the circumcentre, which can lie outside.

    - slug: geo-u07-w27-q17
      type: true_false
      topic_code: "2.14"
      source: "IM Geometry, Unit 2, Lesson 14"
      points: 1
      prompt: |
        Review. True or false: in any triangle, the angle bisector from a vertex meets the opposite side at its midpoint.
      answer: false
      explanation: |
        False. That happens only when the two sides at that vertex are equal (an isosceles triangle from its apex). In general the bisector's foot divides the opposite side in the ratio of the adjacent sides, not in half.

    - slug: geo-u07-w27-q18
      type: fill_blank
      topic_code: "7.7"
      source: "IM Geometry, Unit 7, Lesson 7"
      points: 1
      prompt: |
        A triangle has area 54 and perimeter 36. The radius of its inscribed circle is ____.
      answer: ["3"]
      explanation: |
        s = 18 and Area = s · r, so r = 54/18 = 3.

    - slug: geo-u07-w27-q19
      type: fill_blank
      topic_code: "7.2"
      source: "IM Geometry, Unit 7, Lesson 2"
      points: 1
      prompt: |
        Review. A right triangle has hypotenuse 26, and the right angle is inscribed in a semicircle of the circumscribed circle. The radius of its circumscribed circle is ____.
      answer: ["13"]
      explanation: |
        The hypotenuse is a diameter of the circumscribed circle, so the radius is half of it, 13.

    - slug: geo-u07-w27-q20
      type: numeric
      topic_code: "7.6"
      source: "IM Geometry, Unit 7, Lesson 6"
      points: 1
      prompt: |
        Triangle DEF has ∠D = 50° and ∠E = 70°. I is the incentre. What is ∠DIE in degrees? Give an integer.
      answer: { value: 120, tolerance: 0 }
      explanation: |
        ∠IDE = 25° and ∠IED = 35°, so ∠DIE = 180° − 60° = 120°. Check: 90° + ½ · 60° = 120°.

    - slug: geo-u07-w27-q21
      type: numeric
      topic_code: "7.7"
      source: "IM Geometry, Unit 7, Lesson 7"
      points: 1
      prompt: |
        An isosceles triangle has sides 10, 10 and 12. What is the radius of its inscribed circle? Give an integer.
      answer: { value: 3, tolerance: 0 }
      explanation: |
        The height to the base is √(100 − 36) = 8, so the area is 48; s = 16; r = 48/16 = 3.

    - slug: geo-u07-w27-q22
      type: numeric
      topic_code: "6.17"
      source: "IM Geometry, Unit 6, Lesson 17"
      points: 1
      prompt: |
        Review. A triangle has vertices (0, 0), (10, 0) and (0, 24). What is the radius of its circumscribed circle? Give an integer.
      answer: { value: 13, tolerance: 0 }
      explanation: |
        The triangle is right-angled at the origin with hypotenuse √(100 + 576) = 26, so the circumcentre is the hypotenuse's midpoint (5, 12) and the radius is 13.

    - slug: geo-u07-w27-q23
      type: short_answer
      topic_code: "7.6"
      source: "IM Geometry, Unit 7, Lesson 6"
      points: 3
      prompt: |
        Prove that the three angle bisectors of triangle ABC meet at one point.

        (a) Let the bisectors of ∠A and ∠B meet at I. State what being on each bisector tells you about I.
        (b) Combine the two facts to conclude something about I's distances to AC and BC.
        (c) Finish the proof by naming the theorem that puts I on the third bisector.
      answer: |
        (a) I on the bisector of ∠A means I is equidistant from sides AB and AC. I on the bisector of ∠B means I is equidistant from sides AB and BC.
        (b) Both distances equal the distance to AB, so I is equidistant from AC and BC.
        (c) By the converse of the angle bisector locus theorem (a point equidistant from the two sides of an angle lies on its bisector), I is on the bisector of ∠C. So all three bisectors pass through I.
      explanation: |
        1 point for the two equidistance statements. 1 point for deducing equal distances to AC and BC. 1 point for invoking the converse (equidistant ⇒ on the bisector) for ∠C.

    - slug: geo-u07-w27-q24
