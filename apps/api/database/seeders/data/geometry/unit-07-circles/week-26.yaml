week: 26
unit: 7
title: "Chords, Inscribed Angles, Tangents and Cyclic Quadrilaterals"
topics: ["7.1", "7.2", "7.3", "7.4"]
guide: guides/week-26.md
guide_description: |
  Chords, arcs and central angles with the isosceles-radii argument, the perpendicular from the centre bisecting a chord, the Inscribed Angle Theorem with its three-case proof and corollaries (same arc, same angle; angle in a semicircle), the tangent–radius right angle with its proof by contradiction, tangents from an outside point, and the supplementary opposite angles of a cyclic quadrilateral. Worked examples, Try-it problems and a self-check.
flashcards_description: |
  30 cards on circle vocabulary, chord theorems, the Inscribed Angle Theorem and its corollaries, tangent lines and tangent lengths, and cyclic quadrilaterals. Review them before the week 26 quiz.
flashcards:
  - front: Chord → definition
    back: |
      A segment whose two endpoints lie on the circle. A diameter is the longest chord, the one through the centre.
    topic_code: "7.1"
  - front: Central angle and arc measure → how they are related
    back: |
      A central angle has its vertex at the centre; the arc it cuts off has the same measure in degrees. A semicircle is 180°.
    topic_code: "7.1"
  - front: Minor arc versus major arc
    back: |
      Two points split a circle into a minor arc (under 180°) and a major arc (over 180°); their measures add to 360°.
    topic_code: "7.1"
  - front: Any two radii → what kind of triangle they make
    back: |
      An isosceles triangle with the centre as apex, because both radii have the same length. Its base angles are equal. Most circle proofs start here.
    topic_code: "7.1"
  - front: Congruent central angles ↔ congruent chords → proof
    back: |
      Equal central angles give △AOB ≅ △COD by SAS (radius, angle, radius), so AB ≅ CD; equal chords give the triangles by SSS, so the angles match.
    topic_code: "7.1"
  - front: Perpendicular from the centre to a chord → what it does
    back: |
      It bisects the chord. The centre is equidistant from the chord's endpoints, so it lies on the chord's perpendicular bisector.
    topic_code: "7.1"
  - front: Chord of length 16 in a circle of radius 10 → distance from the centre
    back: |
      Half-chord 8, radius 10: distance √(100 − 64) = 6, from the right triangle made by the radius, the half-chord and the perpendicular.
    topic_code: "7.1"
  - front: Chord 5 from the centre of a circle of radius 13 → chord length
    back: |
      Half-chord √(169 − 25) = 12, so the chord is 24.
    topic_code: "7.1"
  - front: Which chord has the larger central angle?
    back: |
      The longer one. With the same two radii as legs, a larger apex angle opens a longer base.
    topic_code: "7.1"
  - front: Inscribed angle → definition
    back: |
      An angle whose vertex is on the circle and whose sides are chords. The arc between its sides, away from the vertex, is its intercepted arc.
    topic_code: "7.2"
  - front: Inscribed Angle Theorem → statement
    back: |
      An inscribed angle is half the central angle on the same arc, so half the arc's measure. An arc of 110° gives an inscribed angle of 55°.
    topic_code: "7.2"
  - front: Inscribed Angle Theorem → proof when one side is a diameter
    back: |
      Triangle OAB is isosceles (radii), so ∠OBA = ∠OAB = x. The central angle BOC is an exterior angle of that triangle, so it equals x + x = 2x.
    topic_code: "7.2"
  - front: Inscribed Angle Theorem → the other two cases
    back: |
      Draw the diameter from the vertex. Centre inside the angle: add two diameter-case angles. Centre outside: subtract two of them.
    topic_code: "7.2"
  - front: Two inscribed angles on the same arc → conclusion
    back: |
      They are congruent: each is half the same arc.
    topic_code: "7.2"
  - front: Angle inscribed in a semicircle → measure and why
    back: |
      90°, because its intercepted arc is 180° and an inscribed angle is half its arc. Conversely, a right inscribed angle stands on a diameter.
    topic_code: "7.2"
  - front: AB a diameter, ∠CAB = 31° → ∠CBA
    back: |
      ∠ACB = 90° (semicircle), so ∠CBA = 180° − 90° − 31° = 59°.
    topic_code: "7.2"
  - front: Error-spot → "the central angle is half the inscribed angle"
    back: |
      Backwards. The inscribed angle is the half; the central angle on the same arc is twice the inscribed angle.
    topic_code: "7.2"
  - front: Tangent line → definition
    back: |
      A line that meets the circle in exactly one point, the point of tangency.
    topic_code: "7.3"
  - front: Tangent and radius at the point of tangency → relationship
    back: |
      They are perpendicular. Conversely, a line through a point of the circle perpendicular to the radius there is tangent.
    topic_code: "7.3"
  - front: Tangent ⊥ radius → proof by contradiction
    back: |
      If the perpendicular from O met the tangent at F ≠ T, then OF < OT = r (hypotenuse longest), so F is inside the circle and the line would cross the circle twice.
    topic_code: "7.3"
  - front: Construct the tangents from an outside point P → method
    back: |
      Draw the circle with diameter OP; it meets the given circle at T₁ and T₂. Each ∠OTP is inscribed in a semicircle, so it is 90°, and PT is tangent.
    topic_code: "7.3"
  - front: Two tangent segments from one outside point → relationship and proof
    back: |
      Congruent. Triangles OT₁P and OT₂P are right triangles with hypotenuse OP shared and legs OT₁ = OT₂ = r, so they are congruent by HL.
    topic_code: "7.3"
  - front: Tangent length from a point 13 from the centre of a circle of radius 5
    back: |
      √(13² − 5²) = 12. OP is the hypotenuse of right triangle OTP.
    topic_code: "7.3"
  - front: Angle between the two tangents from P when the central angle T₁OT₂ is 120°
    back: |
      Quadrilateral OT₁PT₂ has two right angles, so ∠T₁PT₂ = 360° − 180° − 120° = 60°. The tangent angle and the central angle are supplementary.
    topic_code: "7.3"
  - front: Tangent to x² + y² = 25 at (3, 4) → equation
    back: |
      The radius has slope 4/3, so the tangent has slope −3/4: y − 4 = −3/4 (x − 3), or 3x + 4y = 25.
    topic_code: "7.3"
  - front: Cyclic quadrilateral → definition
    back: |
      A quadrilateral whose four vertices lie on one circle; also called an inscribed quadrilateral.
    topic_code: "7.4"
  - front: Opposite angles of a cyclic quadrilateral → theorem and proof
    back: |
      They are supplementary. ∠A and ∠C intercept arcs that together make the whole circle, so ∠A + ∠C = ½ · 360° = 180°.
    topic_code: "7.4"
  - front: Cyclic quadrilateral with ∠P = 72° and ∠Q = 115° → the other two angles
    back: |
      ∠R = 180° − 72° = 108° and ∠S = 180° − 115° = 65°.
    topic_code: "7.4"
  - front: Which parallelograms can be inscribed in a circle?
    back: |
      Only rectangles (including squares). A parallelogram's opposite angles are equal, and equal supplementary angles must be 90°.
    topic_code: "7.4"
  - front: Can an isosceles trapezoid be inscribed in a circle?
    back: |
      Yes, always. Its base angles are equal and co-interior angles along a leg are supplementary, so each pair of opposite angles is supplementary.
    topic_code: "7.4"
quiz:
  description: |
    25 questions · about 40 minutes · Chords and central angles, the perpendicular from the centre to a chord, the Inscribed Angle Theorem and its corollaries, tangent lines and tangent lengths, and cyclic quadrilaterals, with review of isosceles triangles, the exterior angle theorem, the Perpendicular Bisector Theorem, HL congruence, perpendicular slopes, circle equations and the Pythagorean theorem. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: geo-u07-w26-q01
      type: multiple_choice
      topic_code: "7.2"
      source: "IM Geometry, Unit 7, Lesson 2"
      points: 1
      stimulus: |
        Figure description: a circle with centre O. Points A, B and C lie on the circle, and AC is a diameter. The inscribed angle ∠BAC measures 35°.
      prompt: |
        What is the measure of ∠ABC?
      options:
        - "90°"
        - "70°"
        - "55°"
        - "35°"
      option_explanations:
        - |
          Correct. ∠ABC is inscribed in a semicircle (its intercepted arc AC is 180°), so it is a right angle.
        - |
          70° is the central angle on arc BC, twice the inscribed angle at A.
        - |
          55° is the third angle of the triangle, ∠BCA, not ∠ABC.
        - |
          35° is ∠BAC itself; the angle at B stands on the diameter, not on arc BC.
      answer: 0

    - slug: geo-u07-w26-q02
      type: multiple_choice
      topic_code: "7.2"
      source: "IM Geometry, Unit 7, Lesson 2"
      points: 1
      stimulus: |
        Figure description: a circle with centre O. Points A, B and C lie on the circle, and AC is a diameter. The inscribed angle ∠BAC measures 35°.
      prompt: |
        What is the measure of the central angle ∠BOC?
      options:
        - "35°"
        - "145°"
        - "110°"
        - "70°"
      option_explanations:
        - |
          35° is the inscribed angle; the central angle on the same arc is double.
        - |
          145° is 180° − 35°; the central angle is found by doubling, not subtracting from 180°.
        - |
          110° is the measure of arc AB (and of ∠AOB), the supplement of ∠BOC along the diameter.
        - |
          Correct. ∠BAC and ∠BOC intercept the same arc BC, and the central angle is twice the inscribed angle: 2 · 35° = 70°.
      answer: 3

    - slug: geo-u07-w26-q03
      type: multiple_choice
      topic_code: "7.1"
      source: "IM Geometry, Unit 7, Lesson 1"
      points: 1
      stimulus: |
        Figure description: a circle with centre O. Points A, B and C lie on the circle, and AC is a diameter. The inscribed angle ∠BAC measures 35°.
      prompt: |
        Triangle OAB is drawn with two radii. What are its angles at A and B, and what is the measure of arc AB?
      options:
        - "70° and 70°; arc AB = 40°"
        - "35° and 35°; arc AB = 110°"
        - "35° and 55°; arc AB = 90°"
        - "35° and 35°; arc AB = 70°"
      option_explanations:
        - |
          The angle at A is given as 35°; the base angles are not 70°.
        - |
          Correct. OA = OB, so ∠OBA = ∠OAB = 35°, and ∠AOB = 180° − 70° = 110°, which is the measure of arc AB.
        - |
          Two radii make an isosceles triangle, so the base angles are equal; 55° is the triangle ABC's angle at C.
        - |
          The base angles are right, but the apex angle is 180° − 35° − 35° = 110°, which equals the arc.
      answer: 1

    - slug: geo-u07-w26-q04
      type: multiple_choice
      topic_code: "3.13"
      source: "IM Geometry, Unit 3, Lesson 13"
      points: 1
      prompt: |
        Review of the Pythagorean theorem. A chord of length 30 lies in a circle of radius 17. How far is the chord from the centre?
      options:
        - "√(17² − 30²)"
        - "15"
        - "8"
        - "2"
      option_explanations:
        - |
          The whole chord cannot be a leg; the half-chord 15 is, and 30 > 17 would give a negative number under the root.
        - |
          15 is half the chord, a leg of the right triangle, not the distance to the centre.
        - |
          Correct. The perpendicular from the centre bisects the chord, so a right triangle has hypotenuse 17 and leg 15; the other leg is √(289 − 225) = 8.
        - |
          2 is 17 − 15, a subtraction of lengths, not the Pythagorean theorem.
      answer: 2

    - slug: geo-u07-w26-q05
      type: multiple_choice
      topic_code: "7.1"
      source: "IM Geometry, Unit 7, Lesson 1"
      points: 1
      prompt: |
        Why does the centre of a circle lie on the perpendicular bisector of every chord?
      options:
        - "The centre is equidistant from the chord's endpoints, and points equidistant from two points lie on their perpendicular bisector"
        - "The perpendicular bisector of a chord is always a diameter, by definition"
        - "Every chord passes through the centre"
        - "The centre is the midpoint of every chord"
      option_explanations:
        - |
          Correct. Both endpoints are a radius away from the centre, so the converse of the Perpendicular Bisector Theorem places the centre on the bisector.
        - |
          It does lie along a diameter, but that is the conclusion to be explained, not a definition.
        - |
          Only diameters pass through the centre; most chords do not.
        - |
          The centre is the midpoint only of diameters.
      answer: 0

    - slug: geo-u07-w26-q06
      type: multiple_choice
      topic_code: "7.2"
      source: "IM Geometry, Unit 7, Lesson 2"
      points: 1
      prompt: |
        Points P, Q, R and S lie on a circle, in that order. Inscribed angles ∠PQS and ∠PRS both intercept arc PS, and ∠PQS = 41°. What is ∠PRS?
      options:
        - "139°"
        - "82°"
        - "49°"
        - "41°"
      option_explanations:
        - |
          139° would be an inscribed angle on the major arc, standing on the other side; ∠PRS is on the same side as ∠PQS.
        - |
          82° is the central angle on arc PS, not another inscribed angle.
        - |
          49° is the complement of 41°; nothing in the figure makes these angles complementary.
        - |
          Correct. Inscribed angles that intercept the same arc are congruent; both are half of arc PS.
      answer: 3

    - slug: geo-u07-w26-q07
      type: multiple_choice
      topic_code: "7.2"
      source: "IM Geometry, Unit 7, Lesson 2"
      points: 1
      prompt: |
        In the diameter case of the Inscribed Angle Theorem proof, with inscribed angle ∠BAC and diameter AC through the centre O, why is ∠BOC = 2∠BAC?
      options:
        - "∠BOC is a central angle, and central angles are always twice any angle in the figure"
        - "∠BOC is an exterior angle of isosceles triangle OAB, so it equals the sum of the two equal base angles"
        - "∠BOC and ∠BAC are vertical angles"
        - "Triangle OBC is equilateral"
      option_explanations:
        - |
          The factor of two is a theorem with a reason, not a general property of central angles.
        - |
          Correct. OA = OB makes ∠OBA = ∠OAB; the exterior angle at O equals the sum of these remote interior angles, 2∠BAC.
        - |
          The two angles have different vertices (O and A), so they cannot be vertical angles.
        - |
          Nothing forces OB = BC; only OA, OB and OC are radii.
      answer: 1

    - slug: geo-u07-w26-q08
      type: multiple_choice
      topic_code: "7.3"
      source: "IM Geometry, Unit 7, Lesson 3"
      points: 1
      prompt: |
        A circle has radius 9 and point P is 41 units from the centre. How long is each tangent segment from P?
      options:
        - "50"
        - "√1762"
        - "40"
        - "32"
      option_explanations:
        - |
          50 is 41 + 9, not a Pythagorean computation.
        - |
          √1762 adds the squares (1681 + 81); OP is the hypotenuse, so the squares are subtracted.
        - |
          Correct. The tangent is perpendicular to the radius, so PT² = 41² − 9² = 1681 − 81 = 1600 and PT = 40.
        - |
          32 is 41 − 9; distances along different directions cannot simply be subtracted.
      answer: 2

    - slug: geo-u07-w26-q09
      type: multiple_choice
      topic_code: "7.3"
      source: "IM Geometry, Unit 7, Lesson 3"
      points: 1
      prompt: |
        In the proof that a tangent is perpendicular to the radius at the point of tangency T, what contradiction arises if the perpendicular from the centre O meets the tangent at a different point F?
      options:
        - "OF would be shorter than the radius, so F would be inside the circle and the line would cross the circle twice"
        - "F would have to coincide with the centre"
        - "OF would be longer than the radius, so the line would miss the circle entirely"
        - "Triangle OFT would have two right angles"
      option_explanations:
        - |
          Correct. In right triangle OFT the hypotenuse OT = r is longest, so OF < r; a line through an interior point meets the circle in two points, not one.
        - |
          F lies on the tangent line, which is outside the circle except at T, so it cannot be the centre.
        - |
          A leg is shorter than the hypotenuse, not longer; OF < OT.
        - |
          The triangle has a right angle at F only; the contradiction is about distances, not angles.
      answer: 0

    - slug: geo-u07-w26-q10
      type: multiple_choice
      topic_code: "7.4"
      source: "IM Geometry, Unit 7, Lesson 4"
      points: 1
      prompt: |
        Quadrilateral ABCD is inscribed in a circle with ∠A = 83° and ∠B = 121°. What are ∠C and ∠D?
      options:
        - "∠C = 97°, ∠D = 121°"
        - "∠C = 59°, ∠D = 97°"
        - "∠C = 97°, ∠D = 59°"
        - "∠C = 83°, ∠D = 121°"
      option_explanations:
        - |
          ∠D must be supplementary to ∠B: 180° − 121° = 59°, and the four angles must add to 360°.
        - |
          These are swapped; ∠C is opposite ∠A, and ∠D is opposite ∠B.
        - |
          Correct. Opposite angles are supplementary: ∠C = 180° − 83° = 97° and ∠D = 180° − 121° = 59°.
        - |
          Equal opposite angles describe a parallelogram, which is cyclic only when it is a rectangle.
      answer: 2

    - slug: geo-u07-w26-q11
      type: multiple_choice
      topic_code: "7.4"
      source: "IM Geometry, Unit 7, Lesson 4"
      points: 1
      prompt: |
        Which quadrilateral can NEVER be inscribed in a circle?
      options:
        - "A rectangle that is not a square"
        - "A parallelogram with a 70° angle"
        - "An isosceles trapezoid"
        - "A square"
      option_explanations:
        - |
          All four angles are 90°, so opposite angles are supplementary and the diagonals' crossing is the centre.
        - |
          Correct. Its opposite angles are both 70°, which add to 140°, not 180°.
        - |
          Its opposite angles are supplementary (base angles equal, co-interior angles along a leg supplementary).
        - |
          A square is a rectangle, with four right angles.
      answer: 1

    - slug: geo-u07-w26-q12
      type: multiple_choice
      topic_code: "6.11"
      source: "IM Geometry, Unit 6, Lesson 11"
      points: 1
      prompt: |
        Review. The circle x² + y² = 100 passes through (6, 8). What is the slope of the tangent line at that point?
      options:
        - "3/4"
        - "4/3"
        - "−4/3"
        - "−3/4"
      option_explanations:
        - |
          3/4 is the reciprocal without the sign change; the product with 4/3 would be 1, not −1.
        - |
          4/3 is the slope of the radius; the tangent is perpendicular to the radius.
        - |
          −4/3 changes the sign but keeps the fraction; the opposite reciprocal of 4/3 is −3/4.
        - |
          Correct. The radius from (0, 0) to (6, 8) has slope 4/3; the tangent is perpendicular to it, with slope −3/4.
      answer: 3

    - slug: geo-u07-w26-q13
      type: multiple_choice
      topic_code: "1.21"
      source: "IM Geometry, Unit 1, Lesson 21"
      points: 1
      prompt: |
        Review. In triangle OAB, the exterior angle at O measures 2x and the interior angles at A and B are equal. Which theorem gives each of those interior angles as x?
      options:
        - "The triangle angle sum theorem alone, without any isosceles information"
        - "The exterior angle theorem: an exterior angle equals the sum of the two remote interior angles"
        - "The inscribed angle theorem applied to the exterior angle"
        - "The Perpendicular Bisector Theorem"
      option_explanations:
        - |
          The angle sum gives the interior angle at O, but splitting the remaining 2x equally needs the equal-angles fact; the exterior angle theorem is the direct route.
        - |
          Correct. 2x = (angle at A) + (angle at B), and the two are equal, so each is x.
        - |
          The inscribed angle theorem is proved using this step, not the other way round.
        - |
          That theorem is about distances to a segment's endpoints, not about angle sums.
      answer: 1

    - slug: geo-u07-w26-q14
      type: multi_select
      topic_code: "7.2"
      source: "IM Geometry, Unit 7, Lesson 2"
      points: 2
      partial_credit: true
      prompt: |
        Points A, B, C, D lie on a circle with centre O, and AB is a diameter. Which statements must be true? Select all that apply.
      options:
        - "∠ADB = 90°"
        - "∠ACB = 90°"
        - "∠AOC = 2∠ABC"
        - "∠ACB = ∠AOB"
        - "∠ACD = ∠ABD"
      option_explanations:
        - |
          Yes: ∠ADB is also inscribed in a semicircle on AB.
        - |
          Yes: ∠ACB is inscribed in the semicircle on diameter AB.
        - |
          Yes: the central angle on arc AC is twice the inscribed angle on arc AC.
        - |
          No: ∠AOB is a straight angle, 180°, while ∠ACB is 90°; the inscribed angle is half the central angle, not equal to it.
        - |
          Yes: both intercept arc AD, so they are congruent inscribed angles.
      answer: [0, 1, 2, 4]

    - slug: geo-u07-w26-q15
      type: multi_select
      topic_code: "2.11"
      source: "IM Geometry, Unit 2, Lesson 11"
      points: 2
      partial_credit: true
      prompt: |
        Review. From an outside point P, tangent segments touch a circle with centre O at T₁ and T₂. Which facts are used to prove PT₁ = PT₂? Select all that apply.
      options:
        - "The triangles are congruent by HL (hypotenuse-leg)"
        - "OT₁ = OT₂ because both are radii"
        - "∠OT₁P and ∠OT₂P are right angles because a tangent is perpendicular to the radius"
        - "The triangles are congruent by SSA, which always works"
        - "Triangles OT₁P and OT₂P share the hypotenuse OP"
      option_explanations:
        - |
          Yes: two right triangles with congruent hypotenuses and a pair of congruent legs are congruent, so PT₁ = PT₂ by CPCTC.
        - |
          Yes: equal radii supply the congruent legs.
        - |
          Yes: the tangent–radius theorem supplies the right angles that make HL available.
        - |
          No: SSA is not a congruence criterion in general; it works here only because the angle is right, which is the HL case.
        - |
          Yes: OP is the hypotenuse of both right triangles.
      answer: [0, 1, 2, 4]

    - slug: geo-u07-w26-q16
      type: true_false
      topic_code: "7.1"
      source: "IM Geometry, Unit 7, Lesson 1"
      points: 1
      prompt: |
        True or false: in a circle, two chords of equal length have central angles of equal measure.
      answer: true
      explanation: |
        True. The two triangles formed with the centre have three pairs of congruent sides (two radii and the equal chords), so they are congruent by SSS and their apex angles match.

    - slug: geo-u07-w26-q17
      type: true_false
      topic_code: "2.14"
      source: "IM Geometry, Unit 2, Lesson 14"
      points: 1
      prompt: |
        Review. True or false: the triangle formed by two radii and the chord joining their endpoints always has two congruent angles.
      answer: true
      explanation: |
        True. The two radii are congruent, so the triangle is isosceles and, by the isosceles triangle theorem, the angles opposite them (the angles at the chord's endpoints) are congruent.

    - slug: geo-u07-w26-q18
      type: fill_blank
      topic_code: "7.2"
      source: "IM Geometry, Unit 7, Lesson 2"
      points: 1
      prompt: |
        An inscribed angle intercepts an arc of 134°. The inscribed angle measures ____°.
      answer: ["67"]
      explanation: |
        An inscribed angle is half its intercepted arc: 134°/2 = 67°.

    - slug: geo-u07-w26-q19
      type: fill_blank
      topic_code: "7.4"
      source: "IM Geometry, Unit 7, Lesson 4"
      points: 1
      prompt: |
        In cyclic quadrilateral WXYZ, ∠W = 4∠Y. Then ∠Y = ____°.
      answer: ["36"]
      explanation: |
        ∠W + ∠Y = 180° and ∠W = 4∠Y give 5∠Y = 180°, so ∠Y = 36° and ∠W = 144°.

    - slug: geo-u07-w26-q20
      type: numeric
      topic_code: "7.3"
      source: "IM Geometry, Unit 7, Lesson 3"
      points: 1
      prompt: |
        A tangent segment from P to a circle of radius 7 has length 24. How far is P from the centre? Give an integer.
      answer: { value: 25, tolerance: 0 }
      explanation: |
        OP is the hypotenuse of the right triangle with legs 7 and 24: √(49 + 576) = √625 = 25.

    - slug: geo-u07-w26-q21
      type: numeric
      topic_code: "1.21"
      source: "IM Geometry, Unit 1, Lesson 21"
      points: 1
      prompt: |
        Review of angle sums. Two tangents from P touch a circle with centre O at T₁ and T₂, and the central angle ∠T₁OT₂ measures 136°. What is ∠T₁PT₂ in degrees? Give an integer.
      answer: { value: 44, tolerance: 0 }
      explanation: |
        Quadrilateral OT₁PT₂ has right angles at T₁ and T₂, so ∠T₁PT₂ = 360° − 90° − 90° − 136° = 44°.

    - slug: geo-u07-w26-q22
      type: numeric
      topic_code: "6.4"
      source: "IM Geometry, Unit 6, Lesson 4"
      points: 1
      prompt: |
        Review. A chord of the circle (x − 1)² + (y − 2)² = 169 has its midpoint at (4, 6). How long is the chord? Give an integer.
      answer: { value: 24, tolerance: 0 }
      explanation: |
        The midpoint (4, 6) is √(9 + 16) = 5 from the centre (1, 2), and the radius is 13. The segment from the centre to a chord's midpoint is perpendicular to the chord, so half the chord is √(169 − 25) = 12 and the chord is 24.

    - slug: geo-u07-w26-q23
      type: short_answer
      topic_code: "7.1"
      source: "IM Geometry, Unit 7, Lesson 1"
      points: 3
      prompt: |
        A circle has centre O and radius 25. Chord AB has length 48 and chord CD has length 14.

        (a) Find the distance from O to AB.
        (b) Find the distance from O to CD.
        (c) Which chord has the larger central angle? Explain using the triangles OAB and OCD.
      answer: |
        (a) The perpendicular from O bisects AB, so half of AB is 24 and the distance is √(625 − 576) = 7.
        (b) Half of CD is 7, so the distance is √(625 − 49) = 24.
        (c) AB. Triangles OAB and OCD are isosceles with the same legs (25). A longer base opens a larger apex angle, so ∠AOB > ∠COD. (Equivalently, the chord closer to the centre, AB at distance 7, subtends the larger central angle.)
      explanation: |
        1 point for 7. 1 point for 24. 1 point for choosing AB with a reason involving equal radii and the longer base (or the smaller distance from the centre).

    - slug: geo-u07-w26-q24
      type: short_answer
      topic_code: "7.4"
      source: "IM Geometry, Unit 7, Lesson 4"
      points: 3
      prompt: |
        Quadrilateral ABCD is inscribed in a circle. ∠A = (5x − 8)°, ∠C = (3x + 20)°, and ∠B = 2∠D.

        (a) Find x and the measures of ∠A and ∠C.
        (b) Find ∠B and ∠D.
        (c) Explain, using arcs, why ∠B and ∠D must be supplementary.
      answer: |
        (a) ∠A + ∠C = 180°: 8x + 12 = 180, x = 21. ∠A = 97°, ∠C = 83°.
        (b) ∠B + ∠D = 180° and ∠B = 2∠D give 3∠D = 180°, ∠D = 60°, ∠B = 120°.
        (c) ∠B intercepts arc ADC and ∠D intercepts arc ABC; these two arcs together make the whole circle, 360°. Each inscribed angle is half its arc, so ∠B + ∠D = ½ · 360° = 180°.
      explanation: |
        1 point for x = 21 with ∠A = 97° and ∠C = 83°. 1 point for ∠B = 120° and ∠D = 60°. 1 point for the arc argument (the two intercepted arcs make up the circle and each angle is half its arc).

    - slug: geo-u07-w26-q25
      type: long_answer
      topic_code: "7.3"
      source: "IM Geometry, Unit 7, Lesson 3"
      points: 6
      prompt: |
        A circle has centre O = (0, 0) and radius 5. The point P = (0, 13) lies outside it, and the point T = (−60/13, 25/13) lies on the circle.

        (a) Verify that T is on the circle.
        (b) Show that PT is tangent to the circle by showing that OT ⊥ PT.
        (c) Find the length PT in two ways: with the distance formula and with the Pythagorean theorem in triangle OTP.
        (d) The other tangent from P touches the circle at T′. Give the coordinates of T′ and explain how you know, using a symmetry of the figure.
      answer: |
        (a) (−60/13)² + (25/13)² = (3600 + 625)/169 = 4225/169 = 25 = 5². So T is on the circle.
        (b) Slope of OT = (25/13)/(−60/13) = −25/60 = −5/12. Slope of PT = (25/13 − 13)/(−60/13 − 0) = (−144/13)/(−60/13) = 144/60 = 12/5. Product: (−5/12)(12/5) = −1, so OT ⊥ PT. A line through a point of the circle perpendicular to the radius there is tangent.
        (c) Distance formula: PT = √((60/13)² + (13 − 25/13)²) = √(3600/169 + (144/13)²) = √((3600 + 20736)/169) = √(24336/169) = 156/13 = 12. Pythagorean theorem: OP = 13, OT = 5, so PT = √(169 − 25) = √144 = 12.
        (d) T′ = (60/13, 25/13). The whole figure (circle centred at the origin, P on the y-axis) is symmetric under reflection across the y-axis, (x, y) → (−x, y). That reflection fixes O and P and maps the circle to itself, so it maps the tangent PT to the other tangent from P, and T to T′.
      explanation: |
        Scoring (6 points): (a) 1 point for the substitution giving 25. (b) 2 points: 1 for both slopes (−5/12 and 12/5), 1 for the product −1 and the conclusion that PT is tangent. (c) 2 points: 1 for each method giving 12. (d) 1 point for T′ = (60/13, 25/13) justified by the reflection across the y-axis.
