    - slug: geo-u07-exam-q42
      type: short_answer
      topic_code: "7.2"
      source: "IM Geometry, Unit 7, Lesson 2"
      points: 3
      prompt: |
        Prove the diameter case of the Inscribed Angle Theorem: with inscribed angle ∠BAC, AC a diameter and O the centre, show that ∠BOC = 2∠BAC.

        (a) Explain why ∠OBA = ∠OAB.
        (b) Explain why ∠BOC equals the sum of ∠OAB and ∠OBA.
        (c) Conclude the proof, and state what has to change to prove the case where the centre is inside ∠BAC.
      answer: |
        (a) OA and OB are radii, so triangle OAB is isosceles and its base angles ∠OBA and ∠OAB are congruent (isosceles triangle theorem).
        (b) ∠BOC is an exterior angle of triangle OAB (since A, O, C are collinear on the diameter), and by the exterior angle theorem it equals the sum of the two remote interior angles, ∠OAB + ∠OBA.
        (c) So ∠BOC = ∠OAB + ∠OBA = 2∠OAB = 2∠BAC. For the centre-inside case, draw the diameter from A; it splits ∠BAC into two angles each with a diameter as one side, apply the diameter case to each, and add.
      explanation: |
        1 point for the isosceles argument with radii. 1 point for the exterior angle theorem. 1 point for the conclusion and the "draw a diameter and add" plan for the second case.

    - slug: geo-u07-exam-q43
      type: short_answer
      topic_code: "7.9"
      source: "IM Geometry, Unit 7, Lesson 9"
      points: 3
      prompt: |
        A circular running track has an inner lane of radius 36 m. A runner on the inner lane covers an arc of 60 m. A second runner on an outer lane of radius 40 m runs through the same central angle.

        (a) Find the central angle in radians.
        (b) How far does the second runner run?
        (c) Find the area of the strip of track (between the two lanes) that lies inside that central angle.
      answer: |
        (a) θ = 60/36 = 5/3 ≈ 1.667 radians (about 95°).
        (b) 40 × 5/3 = 200/3 ≈ 66.7 m.
        (c) Outer sector ½ · 40² · 5/3 = 4000/3; inner sector ½ · 36² · 5/3 = 1080; difference = 4000/3 − 1080 = 760/3 ≈ 253.3 m².
      explanation: |
        1 point for 5/3 radians. 1 point for ≈ 66.7 m. 1 point for ≈ 253.3 m² (outer sector minus inner sector).

    - slug: geo-u07-exam-q44
      type: long_answer
      topic_code: "7.14"
      source: "IM Geometry, Unit 7, Lesson 14"
      points: 8
      prompt: |
        A circular pond has centre O and radius 20 m. A straight footbridge AB crosses the pond as a chord whose midpoint M is 12 m from O. In the middle of the pond is a circular island of radius 5 m, also centred at O. A viewing point P on the bridge is 5 m from M, so that OP = 13 m, and two straight sightlines from P are tangent to the island at T₁ and T₂.

        (a) Find the length of the bridge AB.
        (b) Find the central angle ∠AOB in radians (use the cosine of the half-angle) and the area of the sector OAB, to one decimal place.
        (c) Find the area of the segment of the pond cut off by the bridge on the side away from O.
        (d) Find the length of each tangent sightline from P to the island and the angle ∠T₁PT₂ in degrees, to one decimal place.
        (e) Explain why the two tangent lengths are equal.
      answer: |
        (a) Half-chord = √(20² − 12²) = √256 = 16, so AB = 32 m.
        (b) cos(½∠AOB) = 12/20 = 0.6, so ½∠AOB ≈ 0.9273 and ∠AOB ≈ 1.855 radians (about 106.3°). Sector area ≈ ½ · 400 · 1.855 ≈ 371.0 m².
        (c) Triangle OAB has area ½ · 32 · 12 = 192 m². Segment ≈ 371.0 − 192 ≈ 179.0 m².
        (d) Tangent length = √(13² − 5²) = √144 = 12 m. In right triangle OT₁P, sin(∠OPT₁) = 5/13, so ∠OPT₁ ≈ 22.6° and ∠T₁PT₂ ≈ 45.2°.
        (e) Triangles OT₁P and OT₂P are right triangles (tangent ⊥ radius) with the common hypotenuse OP and equal legs OT₁ = OT₂ = 5, so they are congruent by HL and PT₁ = PT₂.
      explanation: |
        Scoring (8 points): (a) 1 point for 32 m. (b) 2 points: 1 for ≈ 1.855 radians, 1 for ≈ 371 m². (c) 1 point for ≈ 179 m². (d) 2 points: 1 for 12 m, 1 for ≈ 45.2°. (e) 2 points: 1 for the right angles from tangent ⊥ radius, 1 for HL with the shared hypotenuse.
