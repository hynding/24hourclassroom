unit: 7
description: |
  44 questions · about 80 minutes · covers every lesson of Unit 7 (chords, arcs and central angles, the Inscribed
  Angle Theorem and its corollaries, tangent lines, cyclic quadrilaterals, circumscribed and inscribed circles,
  the incentre and circumcentre, arc length and sector area, part-to-whole reasoning, the radian and radian
  sense, rθ and ½r²θ, and modelling with circles) with some review of Units 2, 4 and 6. Multiple choice,
  select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically;
  the short answers and the long answer are graded by your teacher against the scoring notes. Use π ≈ 3.1416
  where a decimal is asked for.
questions:
    - slug: geo-u07-exam-q01
      type: multiple_choice
      topic_code: "7.2"
      source: "IM Geometry, Unit 7, Lesson 2"
      points: 1
      stimulus: |
        Figure description: a circle with centre O and radius 10. Points A, B, C and D lie on the circle in that order, AC is a diameter, and the inscribed angle ∠BAC measures 20°.
      prompt: |
        What is the measure of ∠ABC?
      options:
        - "90°"
        - "40°"
        - "70°"
        - "20°"
      option_explanations:
        - |
          Correct. ∠ABC is inscribed in the semicircle on diameter AC, so it is a right angle.
        - |
          40° is the central angle ∠BOC, twice ∠BAC.
        - |
          70° is the third angle of triangle ABC, ∠BCA.
        - |
          20° is ∠BAC, the given inscribed angle at A.
      answer: 0

    - slug: geo-u07-exam-q02
      type: multiple_choice
      topic_code: "7.2"
      source: "IM Geometry, Unit 7, Lesson 2"
      points: 1
      stimulus: |
        Figure description: a circle with centre O and radius 10. Points A, B, C and D lie on the circle in that order, AC is a diameter, and the inscribed angle ∠BAC measures 20°.
      prompt: |
        What is the measure of ∠BDC?
      options:
        - "40°"
        - "160°"
        - "20°"
        - "90°"
      option_explanations:
        - |
          40° is the central angle on arc BC; an inscribed angle is half of it.
        - |
          160° is the supplement; D is on the same arc as A, so the inscribed angles are equal, not supplementary.
        - |
          Correct. ∠BDC and ∠BAC both intercept arc BC (D is on the same side of BC as A, since the order round the circle is A, B, C, D), so they are equal: 20°.
        - |
          90° would need BC to be a diameter; AC is the diameter here.
      answer: 2

    - slug: geo-u07-exam-q03
      type: multiple_choice
      topic_code: "7.1"
      source: "IM Geometry, Unit 7, Lesson 1"
      points: 1
      stimulus: |
        Figure description: a circle with centre O and radius 10. Points A, B, C and D lie on the circle in that order, AC is a diameter, and the inscribed angle ∠BAC measures 20°.
      prompt: |
        What is the length of chord BC, to one decimal place?
      options:
        - "3.4"
        - "6.8"
        - "18.8"
        - "20.0"
      option_explanations:
        - |
          3.4 is the half-chord, 10 sin 20°; the whole chord is twice that.
        - |
          Correct. In right triangle ABC with hypotenuse AC = 20, BC = 20 sin 20° ≈ 20 × 0.342 ≈ 6.8. (Or: the central angle ∠BOC = 40°, and the chord is 2 · 10 · sin 20°.)
        - |
          18.8 is AB = 20 cos 20°, the other leg of the right triangle ABC, not BC.
        - |
          20.0 is the diameter AC, the hypotenuse of the right triangle, not the chord BC.
      answer: 1

    - slug: geo-u07-exam-q04
      type: multiple_choice
      topic_code: "7.1"
      source: "IM Geometry, Unit 7, Lesson 1"
      points: 1
      prompt: |
        A chord of length 40 lies in a circle of radius 29. How far is the chord from the centre?
      options:
        - "20"
        - "9"
        - "√(29² − 40²)"
        - "21"
      option_explanations:
        - |
          20 is half the chord, a leg of the right triangle, not the distance.
        - |
          9 is 29 − 20, a subtraction instead of the Pythagorean theorem.
        - |
          The whole chord is not a leg; the half-chord is, and 40 > 29 would make the root undefined.
        - |
          Correct. The perpendicular from the centre bisects the chord: √(29² − 20²) = √(841 − 400) = √441 = 21.
      answer: 3

    - slug: geo-u07-exam-q05
      type: multiple_choice
      topic_code: "7.1"
      source: "IM Geometry, Unit 7, Lesson 1"
      points: 1
      prompt: |
        In one circle, chords PQ and RS satisfy PQ = RS. Which conclusion follows, and by which congruence criterion?
      options:
        - "∠POQ = ∠ROS, by SSS on triangles POQ and ROS"
        - "∠POQ = ∠ROS, by AA on triangles POQ and ROS"
        - "PQ ∥ RS, by SAS"
        - "Nothing can be concluded without the arcs"
      option_explanations:
        - |
          Correct. The triangles have two radii each and equal chords, so they are congruent by SSS and the central angles are corresponding parts.
        - |
          AA is a similarity criterion, and no angles are given.
        - |
          Equal chords need not be parallel; the conclusion is about central angles.
        - |
          The equal chords alone determine equal central angles and therefore equal arcs.
      answer: 0

    - slug: geo-u07-exam-q06
      type: multiple_choice
      topic_code: "7.2"
      source: "IM Geometry, Unit 7, Lesson 2"
      points: 1
      prompt: |
        An inscribed angle intercepts an arc of 146°. What is the inscribed angle, and what is the central angle on the same arc?
      options:
        - "146° and 292°"
        - "34° and 146°"
        - "73° and 146°"
        - "73° and 73°"
      option_explanations:
        - |
          The inscribed angle is half the arc, not equal to it, and a central angle cannot exceed 180° for a minor arc.
        - |
          34° is 180° − 146°, which is not a rule for inscribed angles.
        - |
          Correct. The inscribed angle is half the arc, 73°, and the central angle equals the arc, 146°.
        - |
          The central angle equals the arc measure, 146°, twice the inscribed angle.
      answer: 2

    - slug: geo-u07-exam-q07
      type: multiple_choice
      topic_code: "7.3"
      source: "IM Geometry, Unit 7, Lesson 3"
      points: 1
      prompt: |
        A circle has radius 12 and P is 20 units from its centre. How long is each tangent segment from P?
      options:
        - "32"
        - "16"
        - "√544"
        - "8"
      option_explanations:
        - |
          32 is 20 + 12, a sum of lengths rather than the Pythagorean computation.
        - |
          Correct. √(20² − 12²) = √(400 − 144) = √256 = 16, from the right angle between the tangent and the radius.
        - |
          √544 adds the squares; OP is the hypotenuse, so they are subtracted.
        - |
          8 is 20 − 12, not a Pythagorean computation.
      answer: 1

    - slug: geo-u07-exam-q08
      type: multiple_choice
      topic_code: "7.3"
      source: "IM Geometry, Unit 7, Lesson 3"
      points: 1
      prompt: |
        Which construction produces the tangent lines from an outside point P to a circle with centre O?
      options:
        - "Draw the perpendicular bisector of OP; where it meets the given circle are the points of tangency"
        - "Draw the circle centred at P through O; where it meets the given circle are the points of tangency"
        - "Draw the line OP; where it meets the circle are the points of tangency"
        - "Draw the circle with diameter OP; where it meets the given circle are the points of tangency"
      option_explanations:
        - |
          The perpendicular bisector of OP is the centre of the auxiliary circle's location, not the tangency points.
        - |
          A circle centred at P through O has the wrong radius; the right angle at T comes from a semicircle on OP.
        - |
          The line OP meets the circle at the nearest and farthest points, where the line is perpendicular to the circle, not tangent.
        - |
          Correct. For a point T on that circle, ∠OTP is inscribed in a semicircle, so it is a right angle and PT ⊥ OT, making PT tangent.
      answer: 3

    - slug: geo-u07-exam-q09
      type: multiple_choice
      topic_code: "7.4"
      source: "IM Geometry, Unit 7, Lesson 4"
      points: 1
      prompt: |
        Quadrilateral KLMN is inscribed in a circle with ∠K = 110° and ∠L = 75°. What are ∠M and ∠N?
      options:
        - "∠M = 105°, ∠N = 70°"
        - "∠M = 110°, ∠N = 75°"
        - "∠M = 80°, ∠N = 95°"
        - "∠M = 70°, ∠N = 105°"
      option_explanations:
        - |
          The values are swapped; ∠M is opposite ∠K.
        - |
          Equal opposite angles would make a parallelogram, which is cyclic only if it is a rectangle.
        - |
          These do not pair with the given angles to make 180°.
        - |
          Correct. ∠M = 180° − 110° = 70° (opposite ∠K) and ∠N = 180° − 75° = 105° (opposite ∠L).
      answer: 3

    - slug: geo-u07-exam-q10
      type: multiple_choice
      topic_code: "7.4"
      source: "IM Geometry, Unit 7, Lesson 4"
      points: 1
      prompt: |
        Why are the opposite angles of an inscribed quadrilateral supplementary?
      options:
        - "Every quadrilateral has an angle sum of 360°, so any two angles add to 180°"
        - "Each is equal to its intercepted arc, and the arcs add to 180°"
        - "Each is half its intercepted arc, and the two intercepted arcs together make the whole circle"
        - "The diagonals of a cyclic quadrilateral are diameters"
      option_explanations:
        - |
          The angle sum is 360° for every quadrilateral, but that does not make any two angles supplementary; the circle is essential.
        - |
          Inscribed angles are half their arcs, and the arcs add to 360°.
        - |
          Correct. ∠A + ∠C = ½(arc BCD + arc DAB) = ½ · 360° = 180°.
        - |
          The diagonals are usually not diameters; the proof uses arcs.
      answer: 2

    - slug: geo-u07-exam-q11
      type: multiple_choice
      topic_code: "7.5"
      source: "IM Geometry, Unit 7, Lesson 5"
      points: 1
      prompt: |
        Which lines must be constructed to locate the centre of the circle through the three vertices of a triangle?
      options:
        - "The perpendicular bisectors of two sides"
        - "Two medians"
        - "The bisectors of two angles"
        - "Two altitudes"
      option_explanations:
        - |
          Correct. Their intersection is equidistant from the three vertices by the Perpendicular Bisector Theorem.
        - |
          Medians meet at the centroid, the balance point, not the circumcentre.
        - |
          Angle bisectors locate the incentre, which is equidistant from the sides.
        - |
          Altitudes meet at the orthocentre, which is not equidistant from the vertices.
      answer: 0

    - slug: geo-u07-exam-q12
      type: multiple_choice
      topic_code: "7.5"
      source: "IM Geometry, Unit 7, Lesson 5"
      points: 1
      prompt: |
        A triangle has sides 20, 21 and 29. What is the radius of its circumscribed circle?
      options:
        - "6"
        - "14.5"
        - "29"
        - "10"
      option_explanations:
        - |
          6 is the inradius: area 210, s = 35, r = 6.
        - |
          Correct. 20² + 21² = 400 + 441 = 841 = 29², so the triangle is right-angled and the circumradius is half the hypotenuse, 14.5.
        - |
          29 is the hypotenuse, which is the diameter, not the radius.
        - |
          10 is half the shortest side, which has no special role here.
      answer: 1

    - slug: geo-u07-exam-q13
      type: multiple_choice
      topic_code: "7.6"
      source: "IM Geometry, Unit 7, Lesson 6"
      points: 1
      prompt: |
        Point P is 5 cm from ray VX and 5 cm from ray VY, measured perpendicularly. What can you conclude?
      options:
        - "P is 5 cm from V"
        - "P is the midpoint of XY"
        - "Nothing, unless ∠XVY is a right angle"
        - "P lies on the bisector of ∠XVY"
      option_explanations:
        - |
          P is farther than 5 cm from V, because PV is the hypotenuse of a right triangle with a leg of 5.
        - |
          X and Y are just points on the rays; P need not be on segment XY at all.
        - |
          The angle-bisector locus result holds for every angle, right or not.
        - |
          Correct. A point equidistant from the two sides of an angle lies on its bisector (proved with HL).
      answer: 3

    - slug: geo-u07-exam-q14
      type: multiple_choice
      topic_code: "7.6"
      source: "IM Geometry, Unit 7, Lesson 6"
      points: 1
      prompt: |
        In triangle ABC, ∠A = 80° and ∠B = 40°. I is the incentre. What is ∠AIB?
      options:
        - "60°"
        - "120°"
        - "150°"
        - "100°"
      option_explanations:
        - |
          60° is ∠C, the third angle of the triangle.
        - |
          Correct. ∠IAB = 40° and ∠IBA = 20°, so ∠AIB = 180° − 60° = 120°; equivalently 90° + ½∠C = 90° + 30°.
        - |
          150° would be 90° + ½ · 120°, but ∠C is 60°.
        - |
          100° is 180° − 80°, which halves nothing.
      answer: 1

    - slug: geo-u07-exam-q15
      type: multiple_choice
      topic_code: "7.7"
      source: "IM Geometry, Unit 7, Lesson 7"
      points: 1
      prompt: |
        A triangle has sides 13, 14 and 15 and area 84. What is the radius of its inscribed circle?
      options:
        - "4"
        - "2"
        - "6"
        - "8"
      option_explanations:
        - |
          Correct. s = 21 and Area = s · r, so r = 84/21 = 4.
        - |
          2 divides by the full perimeter 42 instead of the semiperimeter.
        - |
          6 divides by 14, one side, which is not the formula.
        - |
          8 is the circumradius of this triangle (abc/(4 · Area) = 2730/336 = 8.125, close to 8), not the inradius.
      answer: 0

    - slug: geo-u07-exam-q16
      type: multiple_choice
      topic_code: "7.7"
      source: "IM Geometry, Unit 7, Lesson 7"
      points: 1
      prompt: |
        After bisecting two angles of a triangle to find the point I, what is the next step in constructing the inscribed circle?
      options:
        - "Measure from I to one vertex; that is the radius"
        - "Bisect the third angle; the radius is the distance to its foot"
        - "Drop a perpendicular from I to one side; its length is the radius"
        - "Draw the circle through the three vertices"
      option_explanations:
        - |
          The distance to a vertex is larger than the inradius and differs from vertex to vertex.
        - |
          The third bisector passes through I anyway; its foot on the side is not the point of tangency in general.
        - |
          Correct. The inradius is the perpendicular distance from the incentre to any side, and the circle with that radius is tangent to all three sides.
        - |
          That is the circumscribed circle, centred at the circumcentre.
      answer: 2

    - slug: geo-u07-exam-q17
      type: multiple_choice
      topic_code: "7.8"
      source: "IM Geometry, Unit 7, Lesson 8"
      points: 1
      prompt: |
        A circle has radius 18. What are the arc length and area of a sector with central angle 100°?
      options:
        - "Arc 10π, area 180π"
        - "Arc 5π, area 90π"
        - "Arc 100, area 1800"
        - "Arc 10π, area 90π"
      option_explanations:
        - |
          180π is twice the correct area; (5/18)(324π) = 90π.
        - |
          5π is half the correct arc; (5/18)(36π) = 10π.
        - |
          The angle in degrees is not a length; the fraction of the circle must be used.
        - |
          Correct. Fraction 100/360 = 5/18. Arc = (5/18)(36π) = 10π; area = (5/18)(324π) = 90π.
      answer: 3

    - slug: geo-u07-exam-q18
      type: multiple_choice
      topic_code: "7.9"
      source: "IM Geometry, Unit 7, Lesson 9"
      points: 1
      prompt: |
        A sector with central angle 60° has arc length 4π. What is the area of the whole circle?
      options:
        - "144π"
        - "24π"
        - "48π"
        - "576π"
      option_explanations:
        - |
          Correct. 60° is one sixth, so the circumference is 24π and r = 12; the area is 144π.
        - |
          24π is the circumference of the circle (six times the arc), not its area.
        - |
          48π would be the area of a circle with r² = 48, which does not match r = 12.
        - |
          576π uses r = 24, mistaking the number in the circumference 24π for the radius; r = 24π/(2π) = 12.
      answer: 0

    - slug: geo-u07-exam-q19
      type: multiple_choice
      topic_code: "7.10"
      source: "IM Geometry, Unit 7, Lesson 10"
      points: 1
      prompt: |
        Sector A has arc length 8 and radius 5. Sector B has arc length 12 and radius 8. Which has the larger central angle?
      options:
        - "B, because its radius is larger"
        - "A, because 8/5 = 1.6 is larger than 12/8 = 1.5"
        - "B, because its arc is longer"
        - "They are equal, because both arcs are longer than their radii"
      option_explanations:
        - |
          A larger radius with a given arc means a smaller angle, not a larger one.
        - |
          Correct. The angle in radians is arc ÷ radius; 1.6 > 1.5.
        - |
          A longer arc in a larger circle can belong to a smaller angle; divide by the radius first.
        - |
          Both ratios exceed 1, but they are not equal: 1.6 and 1.5 are different angles (about 92° and 86°).
      answer: 1

    - slug: geo-u07-exam-q20
      type: multiple_choice
      topic_code: "7.11"
      source: "IM Geometry, Unit 7, Lesson 11"
      points: 1
      stimulus: |
        Figure description: a sector of a circle with centre O and radius 15 cm. Its curved edge, from A to B, measures 24 cm.
      prompt: |
        What is the central angle ∠AOB in radians?
      options:
        - "24π/15"
        - "0.625"
        - "1.6"
        - "360"
      option_explanations:
        - |
          No π appears: the arc was measured directly, so the ratio 24/15 is already the angle in radians.
        - |
          0.625 is radius ÷ arc, the ratio upside down.
        - |
          Correct. Radian measure is arc ÷ radius: 24/15 = 1.6 radians (about 92°).
        - |
          360 is a full turn in degrees; the angle here is 1.6 radians.
      answer: 2

    - slug: geo-u07-exam-q21
      type: multiple_choice
      topic_code: "7.13"
      source: "IM Geometry, Unit 7, Lesson 13"
      points: 1
      stimulus: |
        Figure description: a sector of a circle with centre O and radius 15 cm. Its curved edge, from A to B, measures 24 cm.
      prompt: |
        What is the area of the sector?
      options:
        - "360 cm²"
        - "90 cm²"
        - "225π cm²"
        - "180 cm²"
      option_explanations:
        - |
          360 forgets the ½ in the area formula; r · arc = 15 · 24 is twice the sector area.
        - |
          90 halves twice; the formula ½ · r · arc gives ½ · 15 · 24 = 180.
        - |
          225π is the whole circle's area; the sector is 1.6/(2π) ≈ 25% of it.
        - |
          Correct. Area = ½ · r · arc = ½ · 15 · 24 = 180 cm² (also ½ · 225 · 1.6).
      answer: 3

    - slug: geo-u07-exam-q22
      type: multiple_choice
      topic_code: "7.12"
      source: "IM Geometry, Unit 7, Lesson 12"
      points: 1
      stimulus: |
        Figure description: a sector of a circle with centre O and radius 15 cm. Its curved edge, from A to B, measures 24 cm.
      prompt: |
        Without converting to degrees exactly, which description of ∠AOB is best?
      options:
        - "A little less than a half turn"
        - "A little more than a right angle"
        - "A little more than a full turn"
        - "A little less than a right angle"
      option_explanations:
        - |
          A half turn is π ≈ 3.14 radians, nearly twice 1.6.
        - |
          Correct. 1.6 radians is just over π/2 ≈ 1.571, so the angle is slightly obtuse (about 92°).
        - |
          A full turn is 2π ≈ 6.28 radians, almost four times 1.6.
        - |
          A right angle is π/2 ≈ 1.571 radians, and 1.6 is slightly more, not less.
      answer: 1

    - slug: geo-u07-exam-q23
      type: multiple_choice
      topic_code: "7.12"
      source: "IM Geometry, Unit 7, Lesson 12"
      points: 1
      prompt: |
        Which angle is largest?
      options:
        - "3 radians"
        - "150°"
        - "π/2 radians"
        - "5π/6 radians"
      option_explanations:
        - |
          Correct. 3 radians ≈ 172°, larger than 150° (which is 5π/6 ≈ 2.62 radians) and than 90°.
        - |
          150° equals 5π/6 ≈ 2.62 radians, less than 3 radians.
        - |
          π/2 radians is 90°, the smallest of the four angles.
        - |
          5π/6 is exactly 150°, less than 3 radians ≈ 172°.
      answer: 0

    - slug: geo-u07-exam-q24
      type: multiple_choice
      topic_code: "7.14"
      source: "IM Geometry, Unit 7, Lesson 14"
      points: 1
      prompt: |
        A slice from a pizza of radius 14 cm cut into 8 equal pieces costs $3.00. A slice from a pizza of radius 18 cm cut into 12 equal pieces costs $3.60. Which is the better deal per square centimetre?
      options:
        - "They are the same deal, because 3.00/8 and 3.60/12 are both 0.3 after rounding"
        - "The 18 cm pizza's slice, because it is larger"
        - "The 14 cm pizza's slice, at about 3.9 cents per cm² versus about 4.2 cents per cm²"
        - "The 18 cm pizza's slice, at about 4.2 cents per cm² versus about 3.9 cents per cm²"
      option_explanations:
        - |
          Dividing price by the number of slices ignores the areas, which differ.
        - |
          The larger slice costs more per unit area here.
        - |
          Correct. Slice areas: 196π/8 ≈ 77.0 cm² and 324π/12 ≈ 84.8 cm². Costs: 300/77.0 ≈ 3.9 and 360/84.8 ≈ 4.2 cents per cm².
        - |
          The rates are right but the cheaper rate is the better deal, and that is the 14 cm pizza's slice.
      answer: 2

    - slug: geo-u07-exam-q25
      type: multiple_choice
      topic_code: "7.3"
      source: "IM Geometry, Unit 7, Lesson 3"
      points: 1
      prompt: |
        Two tangents from P touch a circle with centre O at T₁ and T₂, and ∠T₁PT₂ = 50°. What is the central angle ∠T₁OT₂?
      options:
        - "25°"
        - "100°"
        - "130°"
        - "50°"
      option_explanations:
        - |
          25° halves it; the correct relationship is 180° − 50°.
        - |
          100° doubles the tangent angle, which is not a rule for this figure.
        - |
          Correct. Quadrilateral OT₁PT₂ has right angles at T₁ and T₂, so the remaining two angles are supplementary: 180° − 50° = 130°.
        - |
          The angle at P and the central angle are supplementary, not equal.
      answer: 2

    - slug: geo-u07-exam-q26
      type: multiple_choice
      topic_code: "6.11"
      source: "IM Geometry, Unit 6, Lesson 11"
      points: 1
      prompt: |
        Review. The circle (x − 2)² + (y + 1)² = 25 passes through (5, 3). What is the equation of the tangent line there?
      options:
        - "y − 3 = 3/4 (x − 5)"
        - "y − 3 = −3/4 (x − 5)"
        - "y − 3 = 4/3 (x − 5)"
        - "y + 1 = −3/4 (x − 2)"
      option_explanations:
        - |
          3/4 is the reciprocal without the sign change.
        - |
          Correct. The radius from (2, −1) to (5, 3) has slope 4/3; the tangent is perpendicular, slope −3/4, through (5, 3).
        - |
          4/3 is the radius's slope; the tangent is perpendicular to the radius.
        - |
          The slope is right but this line passes through the centre, not the point of tangency.
      answer: 1

    - slug: geo-u07-exam-q27
      type: multiple_choice
      topic_code: "4.6"
      source: "IM Geometry, Unit 4, Lesson 6"
      points: 1
      prompt: |
        Review. In a circle of radius 10, a chord subtends a central angle of 70°. Which expression gives the chord's length?
      options:
        - "2 · 10 · sin 35°"
        - "10 · tan 70°"
        - "10 · sin 70°"
        - "2 · 10 · cos 35°"
      option_explanations:
        - |
          Correct. The perpendicular from the centre bisects the chord and the angle; each half-chord is the side opposite 35° in a right triangle with hypotenuse 10.
        - |
          tan involves the two legs, not the hypotenuse, which is the radius here.
        - |
          The half-angle is 35°, and the whole chord is twice the half-chord.
        - |
          cos 35° gives the adjacent side, the distance from the centre to the chord, not the half-chord.
      answer: 0

    - slug: geo-u07-exam-q28
