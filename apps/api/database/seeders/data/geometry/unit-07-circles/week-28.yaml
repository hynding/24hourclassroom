      prompt: |
        A garden sprinkler at point O waters a sector of radius 8 m with central angle 135°. A second sprinkler, an exact scaled-up copy, waters a sector of radius 12 m with the same angle.

        (a) Find the arc length and the area watered by the first sprinkler, exactly (in terms of π) and to one decimal place.
        (b) Without recomputing from the formulas, use scaling to find the arc length and the area for the second sprinkler, and explain the factors you used.
        (c) Show that arc length ÷ radius is the same for both sprinklers, and state that common value as the angle in radians.
        (d) A third sprinkler has radius 10 m and waters an arc of length 15 m along its outer edge. Does it turn through a larger or smaller angle than the first two? Justify with a calculation.
      answer: |
        (a) Fraction 135/360 = 3/8. Arc = (3/8)(16π) = 6π ≈ 18.8 m. Area = (3/8)(64π) = 24π ≈ 75.4 m².
        (b) Scale factor k = 12/8 = 1.5. Arc length is a length, so it is multiplied by 1.5: 9π ≈ 28.3 m. Area is multiplied by k² = 2.25: 54π ≈ 169.6 m².
        (c) First: 6π/8 = 3π/4. Second: 9π/12 = 3π/4. The common value 3π/4 is the radian measure of 135° (135 × π/180 = 3π/4).
        (d) 15/10 = 1.5 radians, while 3π/4 ≈ 2.356 radians. 1.5 < 2.356, so the third sprinkler turns through a smaller angle (about 86°).
      explanation: |
