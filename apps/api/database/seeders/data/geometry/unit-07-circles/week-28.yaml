week: 28
unit: 7
title: "Arcs, Sectors and the Radian"
topics: ["7.8", "7.9", "7.10", "7.11"]
guide: guides/week-28.md
guide_description: |
  Arc length and sector area as fractions of the circle, segments and sector perimeters, working backwards from a sector or arc to the whole circle, why arc length divided by radius depends only on the central angle (all circles are similar), the radian as that ratio, conversions and benchmark angles. Worked examples, Try-it problems and a self-check.
flashcards_description: |
  30 cards on arc length, sector area, segments, part-to-whole reasoning, the arc-to-radius ratio, the radian and degree–radian conversions. Review them before the week 28 quiz.
flashcards:
  - front: Arc length from degrees → formula
    back: |
      arc = (θ/360) · 2πr: the fraction of the circle times the circumference. Radius 6, 60°: (1/6)(12π) = 2π.
    topic_code: "7.8"
  - front: Sector area from degrees → formula
    back: |
      sector = (θ/360) · πr². Radius 6, 60°: (1/6)(36π) = 6π.
    topic_code: "7.8"
  - front: Sector of a circle → definition
    back: |
      The region bounded by two radii and the arc between them, like a pizza slice. Its central angle sets its fraction of the circle.
    topic_code: "7.8"
  - front: Arc length versus chord length
    back: |
      Arc length is measured along the curve; the chord is the straight segment between the endpoints and is always shorter.
    topic_code: "7.8"
  - front: Segment of a circle → area
    back: |
      Sector minus the triangle made by the two radii. Radius 6, 90°: 9π − 18 ≈ 10.27.
    topic_code: "7.8"
  - front: Perimeter of a sector
    back: |
      Arc length plus both radii. Radius 8, 45°: 2π + 16 ≈ 22.28.
    topic_code: "7.8"
  - front: Radius 10, central angle 135° → arc and sector
    back: |
      Fraction 3/8. Arc = (3/8)(20π) = 7.5π ≈ 23.56; sector = (3/8)(100π) = 37.5π ≈ 117.81.
    topic_code: "7.8"
  - front: Error-spot → "a 90° sector of radius 6 has area 36π/4 − 36"
    back: |
      The triangle's area needs the ½: it is ½ · 6 · 6 = 18. The segment is 9π − 18; the sector alone is 9π.
    topic_code: "7.8"
  - front: From a sector's area and angle to the whole circle → method
    back: |
      Divide the sector area by its fraction of the circle. 15π at 120° (one third): whole area 45π, so r = √45 = 3√5.
    topic_code: "7.9"
  - front: From an arc's length and angle to the radius → method
    back: |
      Divide the arc by its fraction to get the circumference, then r = C/(2π). 5π at 150° (fraction 5/12): C = 12π, r = 6.
    topic_code: "7.9"
  - front: Find the central angle from radius 12 and sector area 60π
    back: |
      (θ/360)(144π) = 60π, so θ/360 = 5/12 and θ = 150°.
    topic_code: "7.9"
  - front: Find the central angle from radius 5 and arc length 2π
    back: |
      (θ/360)(10π) = 2π, so θ/360 = 1/5 and θ = 72°.
    topic_code: "7.9"
  - front: Sector area alone → can you find the radius?
    back: |
      No: the central angle is also needed. With the angle, divide by the fraction and solve πr² = whole area.
    topic_code: "7.9"
  - front: Arc length and sector area together, no angle → can you find the radius?
    back: |
      Yes: sector area = ½ · r · arc, so r = 2 · area ÷ arc.
    topic_code: "7.9"
  - front: Error-spot → "a sector of 15π at 120° means the whole circle is 5π"
    back: |
      Dividing by 3 goes the wrong way. The sector is one third of the circle, so the circle is three times the sector: 45π.
    topic_code: "7.9"
  - front: Same central angle, radii 9 and 15 → how the arcs compare
    back: |
      The arcs are in the ratio 9 : 15 too, because the larger circle is a dilation of the smaller by 15/9 and dilations scale lengths.
    topic_code: "7.10"
  - front: Arc length ÷ radius → what it depends on
    back: |
      Only the central angle. A 60° angle gives π/3 in every circle; a 270° angle gives 3π/2.
    topic_code: "7.10"
  - front: Compare two central angles without degrees
    back: |
      Compute arc ÷ radius for each; the larger ratio is the larger angle. Arc 6 on radius 4 (1.5) beats arc 10 on radius 8 (1.25).
    topic_code: "7.10"
  - front: Why arc length alone cannot compare two progress bars
    back: |
      A longer arc may belong to a much larger circle. Only the ratio of arc to radius measures how far round the bar has gone.
    topic_code: "7.10"
  - front: Why circumference ÷ diameter is the same for every circle
    back: |
      Any circle is a dilation of any other, and a dilation multiplies the circumference and the diameter by the same factor. The constant ratio is π.
    topic_code: "7.10"
  - front: Dilating a sector by k → what changes
    back: |
      Radius and arc length multiply by k, area by k², the central angle and arc ÷ radius stay the same.
    topic_code: "7.10"
  - front: Radian → definition
    back: |
      The measure of a central angle equal to arc length ÷ radius. One radian is the angle whose arc equals the radius, about 57.3°.
    topic_code: "7.11"
  - front: Full turn and half turn in radians
    back: |
      360° = 2π radians (arc 2πr over radius r); 180° = π radians; 90° = π/2.
    topic_code: "7.11"
  - front: Degrees → radians → the factor
    back: |
      Multiply by π/180. 75° = 75π/180 = 5π/12 ≈ 1.309.
    topic_code: "7.11"
  - front: Radians → degrees → the factor
    back: |
      Multiply by 180/π. 2 radians = 360/π ≈ 114.6°; 5π/8 = 112.5°.
    topic_code: "7.11"
  - front: Benchmark radians → 30°, 45°, 60°, 90°, 120°, 135°, 150°
    back: |
      π/6, π/4, π/3, π/2, 2π/3, 3π/4, 5π/6.
    topic_code: "7.11"
  - front: Arc 7.5 in a circle of radius 5 → angle in radians
    back: |
      7.5/5 = 1.5 radians, about 85.9°.
    topic_code: "7.11"
  - front: Arc length and sector area with θ in radians
    back: |
      arc = rθ and sector = ½r²θ. Radius 6, θ = π/3: arc 2π, area 6π, the same as the degree formulas give for 60°.
    topic_code: "7.11"
  - front: Error-spot → "2π is 360, so π/2 is 90 degrees times π"
    back: |
      Radians are not degrees with a π attached. π/2 radians is a right angle, 90°; the conversion is × 180/π.
    topic_code: "7.11"
  - front: Which unit when → "the formula arc = rθ"
    back: |
      θ must be in radians. In degrees the formula is (θ/360) · 2πr. Convert first if the angle is given in degrees.
    topic_code: "7.11"
quiz:
  description: |
    25 questions · about 40 minutes · Arc length and sector area, segments, part-to-whole reasoning, the arc-to-radius ratio and the radian, with review of central and inscribed angles, dilations and area scaling, circumference, the inscribed circle and the Pythagorean theorem. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes. Use π ≈ 3.1416 where a decimal is asked for.
  questions:
    - slug: geo-u07-w28-q01
      type: multiple_choice
      topic_code: "7.8"
      source: "IM Geometry, Unit 7, Lesson 8"
      points: 1
      stimulus: |
        Figure description: a circle with centre O and radius 12. Radii OA and OB make a central angle of 120°, and the sector between them is shaded.
      prompt: |
        What is the length of arc AB?
      options:
        - "48π"
        - "8π"
        - "4π"
        - "24π"
      option_explanations:
        - |
          48π is one third of the area 144π, the sector area, not the arc length.
        - |
          Correct. 120° is one third of the circle, and one third of the circumference 24π is 8π.
        - |
          4π is one sixth of the circumference, the arc for a 60° angle.
        - |
          24π is the whole circumference of the circle, not one third of it.
      answer: 1

    - slug: geo-u07-w28-q02
      type: multiple_choice
      topic_code: "7.8"
      source: "IM Geometry, Unit 7, Lesson 8"
      points: 1
      stimulus: |
        Figure description: a circle with centre O and radius 12. Radii OA and OB make a central angle of 120°, and the sector between them is shaded.
      prompt: |
        What is the area of the shaded sector?
      options:
        - "96π"
        - "144π"
        - "48π"
        - "8π"
      option_explanations:
        - |
          96π is two thirds of the circle, the unshaded part.
        - |
          144π is the area of the whole circle, three times the sector.
        - |
          Correct. The sector is one third of the circle, and one third of the area πr² = 144π is 48π.
        - |
          8π is the arc length along the curved edge, not the area of the region.
      answer: 2

    - slug: geo-u07-w28-q03
      type: multiple_choice
      topic_code: "7.11"
      source: "IM Geometry, Unit 7, Lesson 11"
      points: 1
      stimulus: |
        Figure description: a circle with centre O and radius 12. Radii OA and OB make a central angle of 120°, and the sector between them is shaded.
      prompt: |
        What is the central angle in radians, and how does it relate to the arc length and the radius?
      options:
        - "120π, which equals arc length × radius"
        - "2π/3, which equals arc length × radius"
        - "π/3, which equals radius ÷ arc length"
        - "2π/3, which equals arc length ÷ radius = 8π/12"
      option_explanations:
        - |
          Radians are not degrees times π; the measure is a ratio of lengths and is dimensionless.
        - |
          The value is right but the relationship is division, arc ÷ radius, not a product.
        - |
          π/3 is 60°; the ratio also goes the other way, arc over radius.
        - |
          Correct. 120° × π/180 = 2π/3, and 8π ÷ 12 = 2π/3: the radian measure is the arc-to-radius ratio.
      answer: 3

    - slug: geo-u07-w28-q04
      type: multiple_choice
      topic_code: "7.8"
      source: "IM Geometry, Unit 7, Lesson 8"
      points: 1
      prompt: |
        A sector of a circle of radius 8 has central angle 45°. What is the perimeter of the sector?
      options:
        - "16 + 2π"
        - "16 + 8π"
        - "2π"
        - "8 + 2π"
      option_explanations:
        - |
          Correct. The arc is (1/8)(16π) = 2π, and the two radii add 16.
        - |
          8π would be the arc for a 180° angle; 45° gives one eighth of 16π.
        - |
          2π is the arc alone; the perimeter also includes the two straight edges.
        - |
          Only one radius was counted; a sector has two.
      answer: 0

    - slug: geo-u07-w28-q05
      type: multiple_choice
      topic_code: "7.8"
      source: "IM Geometry, Unit 7, Lesson 8"
      points: 1
      prompt: |
        In a circle of radius 10, a 90° central angle cuts off a segment (the region between the chord and the arc). What is the area of the segment?
      options:
        - "25π"
        - "25π − 100"
        - "25π − 50"
        - "100π − 50"
      option_explanations:
        - |
          25π is the whole sector; the segment leaves out the triangle.
        - |
          The triangle's area is ½ · 10 · 10 = 50, not 100.
        - |
          Correct. The sector is (1/4)(100π) = 25π and the right triangle with legs 10 and 10 has area 50.
        - |
          100π is the whole circle, not the quarter sector.
      answer: 2

    - slug: geo-u07-w28-q06
      type: multiple_choice
      topic_code: "7.9"
      source: "IM Geometry, Unit 7, Lesson 9"
      points: 1
      prompt: |
        A sector with central angle 72° has area 10π. What is the radius of the circle?
      options:
        - "10"
        - "√10"
        - "√2"
        - "5√2"
      option_explanations:
        - |
          10 would give a whole area of 100π, twice what one fifth of the circle implies.
        - |
          √10 treats the sector area as the whole circle's area.
        - |
          √2 divides 10π by 5 instead of multiplying; the whole is five times the sector.
        - |
          Correct. 72° is one fifth of the circle, so the whole area is 50π; r² = 50 and r = √50 = 5√2.
      answer: 3

    - slug: geo-u07-w28-q07
      type: multiple_choice
      topic_code: "5.5"
      source: "IM Geometry, Unit 5, Lesson 5"
      points: 1
      prompt: |
        Review. A sector is enlarged by a dilation, and its area becomes 6.25 times as large. By what factor did its arc length change?
      options:
        - "2.5"
        - "6.25"
        - "3.125"
        - "√6.25 squared, which is 39.06"
      option_explanations:
        - |
          Correct. Area scales by k², so k = √6.25 = 2.5, and arc length (a length) scales by k = 2.5.
        - |
          6.25 is the area factor; lengths scale by its square root.
        - |
          3.125 is half of 6.25; the length factor is the square root, not half.
        - |
          Squaring the square root just returns 6.25; the arc length factor is the root itself, 2.5.
      answer: 0

    - slug: geo-u07-w28-q08
      type: multiple_choice
      topic_code: "7.9"
      source: "IM Geometry, Unit 7, Lesson 9"
      points: 1
      prompt: |
        Which set of information is NOT enough to find the radius of a circle?
      options:
        - "The length of an arc and its central angle"
        - "The area of a sector only"
        - "The area of a sector and the length of its arc"
        - "The area of a sector and its central angle"
      option_explanations:
        - |
          The angle gives the fraction, so the circumference and then r follow.
        - |
          Correct. A small angle in a large circle or a large angle in a small circle can give the same sector area.
        - |
          Sector area = ½ · r · arc, so r = 2 · area ÷ arc without the angle.
        - |
          The angle gives the fraction, so the whole area and then r follow.
      answer: 1

    - slug: geo-u07-w28-q09
      type: multiple_choice
      topic_code: "7.10"
      source: "IM Geometry, Unit 7, Lesson 10"
      points: 1
      prompt: |
        Two circles have radii 4 and 10. In each, a central angle cuts off an arc; the arcs have lengths 6 and 15. How do the central angles compare?
      options:
        - "The second is 2.5 times the first"
        - "They are equal: both have arc ÷ radius = 1.5"
        - "The second is larger because its arc is longer"
        - "The first is larger because its circle is smaller"
      option_explanations:
        - |
          The radius and the arc are both 2.5 times larger, so the angle is the same.
        - |
          Correct. 6/4 = 1.5 and 15/10 = 1.5; the ratio of arc to radius measures the angle, and the second sector is a dilation of the first by 2.5.
        - |
          Arc length alone does not measure an angle; it must be compared with the radius.
        - |
          A smaller circle does not mean a larger angle; the ratio is what matters.
      answer: 1

    - slug: geo-u07-w28-q10
      type: multiple_choice
      topic_code: "7.10"
      source: "IM Geometry, Unit 7, Lesson 10"
      points: 1
      prompt: |
        Why is the ratio of arc length to radius the same for a given central angle in every circle?
      options:
        - "Arc length never changes when the radius changes"
        - "Central angles are always measured in radians"
        - "Every circle has the same circumference"
        - "All circles are similar, and a dilation multiplies arc length and radius by the same factor while leaving the angle unchanged"
      option_explanations:
        - |
          Arc length grows with the radius; it is the ratio that stays fixed.
        - |
          The constancy of the ratio is what makes radians a sensible unit, not the other way round.
        - |
          Circumferences differ; the circumference-to-diameter ratio is what all circles share.
        - |
          Correct. Scaling by k multiplies both lengths by k, so their ratio is unchanged, and angles are preserved by dilations.
      answer: 3

    - slug: geo-u07-w28-q11
      type: multiple_choice
      topic_code: "6.6"
      source: "IM Geometry, Unit 6, Lesson 6"
      points: 1
      prompt: |
        Review. The circle x² + y² − 6x + 8y = 0 is cut into four equal sectors by two perpendicular diameters. What is the area of one sector?
      options:
        - "π/4"
        - "5π/2"
        - "25π/4"
        - "25π"
      option_explanations:
        - |
          π/4 would be a quarter of a circle of radius 1; the radius here is 5, not 1.
        - |
          5π/2 is a quarter of the circumference 10π (an arc length), not a quarter of the area.
        - |
          Correct. Completing the square gives (x − 3)² + (y + 4)² = 25, radius 5, area 25π, and a quarter of it is 25π/4.
        - |
          25π is the whole circle; each of the four equal sectors is a quarter of it.
      answer: 2

    - slug: geo-u07-w28-q12
      type: multiple_choice
      topic_code: "7.11"
      source: "IM Geometry, Unit 7, Lesson 11"
      points: 1
      prompt: |
        An angle measures 2.5 radians. Approximately how many degrees is that?
      options:
        - "143°"
        - "7.9°"
        - "450°"
        - "72°"
      option_explanations:
        - |
          Correct. 2.5 × 180/π ≈ 2.5 × 57.3 ≈ 143°.
        - |
          7.9 is 2.5π, which multiplies by π instead of by the conversion factor 180/π.
        - |
          450 is 2.5 × 180, forgetting to divide by π.
        - |
          72° is 2π/5 radians, about 1.26, which is only half of 2.5 radians.
      answer: 0

    - slug: geo-u07-w28-q13
      type: multiple_choice
      topic_code: "5.4"
      source: "IM Geometry, Unit 5, Lesson 4"
      points: 1
      prompt: |
        Review. A sector is dilated by a scale factor of 3. By what factors do its arc length and its area change?
      options:
        - "Arc length × 3, area × 9"
        - "Arc length × 9, area × 9"
        - "Arc length × 3, area × 27"
        - "Arc length × 3, area × 3"
      option_explanations:
        - |
          Correct. Lengths scale by k = 3 and areas by k² = 9; the central angle is unchanged.
        - |
          Arc length is a length and scales by k, not k².
        - |
          27 = k³ is the volume factor, which does not apply to a flat sector.
        - |
          Area is two-dimensional and scales by k², not k.
      answer: 0

    - slug: geo-u07-w28-q14
      type: multi_select
      topic_code: "7.11"
      source: "IM Geometry, Unit 7, Lesson 11"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about radians are true? Select all that apply.
      options:
        - "One radian is the central angle whose arc length equals the radius"
        - "π radians equals 180°"
        - "To convert degrees to radians, multiply by π/180"
        - "An angle of 1 radian is about 57.3°"
        - "π/4 radians is 90°"
      option_explanations:
        - |
          Yes: that is the definition, arc ÷ radius = 1.
        - |
          Yes: a half turn has arc πr, and πr ÷ r = π.
        - |
          Yes: 360° corresponds to 2π, so each degree is 2π/360 = π/180 radians.
        - |
          Yes: one radian is 180/π degrees, which is about 57.3°.
        - |
          No: π/4 radians is 45°; the right angle, 90°, is π/2 radians.
      answer: [0, 1, 2, 3]

    - slug: geo-u07-w28-q15
      type: multi_select
      topic_code: "7.1"
      source: "IM Geometry, Unit 7, Lesson 1"
      points: 2
      partial_credit: true
      prompt: |
        Review. In a circle of radius 6, chord PQ has length 6. Which statements are true? Select all that apply.
      options:
        - "The minor arc PQ has length π"
        - "The minor arc PQ has length 2π"
        - "The sector OPQ has area 6π"
        - "The central angle ∠POQ is 60°"
        - "An inscribed angle on the major arc standing on PQ measures 30°"
      option_explanations:
        - |
          No: the arc is one sixth of the circumference, (1/6)(12π) = 2π, not π.
        - |
          Yes: one sixth of the circumference 12π.
        - |
          Yes: the sector is one sixth of the area, (1/6)(36π) = 6π.
        - |
          Yes: triangle OPQ has sides 6, 6, 6, so it is equilateral and the central angle is 60°.
        - |
          Yes: an inscribed angle is half the central angle on the same arc, 30°.
      answer: [1, 2, 3, 4]

    - slug: geo-u07-w28-q16
      type: true_false
      topic_code: "7.8"
      source: "IM Geometry, Unit 7, Lesson 8"
      points: 1
      prompt: |
        True or false: doubling the central angle of a sector (keeping the radius) doubles both its arc length and its area.
      answer: true
      explanation: |
        True. Both are proportional to the fraction θ/360 of the circle, so doubling θ doubles each. Doubling the radius instead would double the arc but quadruple the area.

    - slug: geo-u07-w28-q17
      type: true_false
      topic_code: "4.11"
      source: "IM Geometry, Unit 4, Lesson 11"
      points: 1
      prompt: |
        Review. True or false: the ratio of a circle's circumference to its diameter depends on the size of the circle.
      answer: false
      explanation: |
        False. Every circle is a dilation of every other, and dilations scale circumference and diameter by the same factor, so the ratio is the same constant, π, for all circles.

    - slug: geo-u07-w28-q18
      type: fill_blank
      topic_code: "7.11"
      source: "IM Geometry, Unit 7, Lesson 11"
      points: 1
      prompt: |
        An arc of length 9 in a circle of radius 4 subtends a central angle of ____ radians.
      answer: ["2.25", "9/4", "2 1/4"]
      explanation: |
        Radian measure is arc ÷ radius: 9/4 = 2.25 radians, about 129°.

    - slug: geo-u07-w28-q19
      type: fill_blank
      topic_code: "7.2"
      source: "IM Geometry, Unit 7, Lesson 2"
      points: 1
      prompt: |
        Review. A sector has central angle 140°. An inscribed angle that intercepts the same arc measures ____°.
      answer: ["70"]
      explanation: |
        An inscribed angle is half the central angle on the same arc: 140°/2 = 70°.

    - slug: geo-u07-w28-q20
      type: numeric
      topic_code: "7.8"
      source: "IM Geometry, Unit 7, Lesson 8"
      points: 1
      prompt: |
        A circle has radius 9. What is the area of a sector with central angle 80°? Use π ≈ 3.1416 and give your answer to one decimal place.
      answer: { value: 56.5, tolerance: 0.2 }
      explanation: |
        (80/360)(81π) = 18π ≈ 56.5.

    - slug: geo-u07-w28-q21
      type: numeric
      topic_code: "7.9"
      source: "IM Geometry, Unit 7, Lesson 9"
      points: 1
      prompt: |
        A sector of a circle of radius 15 has area 45π. What is its central angle in degrees? Give an integer.
      answer: { value: 72, tolerance: 0 }
      explanation: |
        The whole area is 225π, so the sector is 45/225 = 1/5 of the circle: 72°.

    - slug: geo-u07-w28-q22
      type: numeric
      topic_code: "7.11"
      source: "IM Geometry, Unit 7, Lesson 11"
      points: 1
      prompt: |
        Convert 7π/4 radians to degrees. Give an integer.
      answer: { value: 315, tolerance: 0 }
      explanation: |
        7π/4 × 180/π = 7 × 45 = 315°.

    - slug: geo-u07-w28-q23
      type: short_answer
      topic_code: "7.9"
      source: "IM Geometry, Unit 7, Lesson 9"
      points: 3
      prompt: |
        A sector has arc length 6π and area 36π.

        (a) Find the radius, using the relation between sector area, radius and arc length.
        (b) Find the central angle in degrees.
        (c) Find the central angle in radians, and check that arc length = radius × angle.
      answer: |
        (a) Sector area = ½ · r · arc, so 36π = ½ · r · 6π and r = 12.
        (b) The circumference is 24π and the arc is 6π, one quarter of it: 90°.
        (c) 90° = π/2 radians. Check: 12 × π/2 = 6π ✓.
      explanation: |
        1 point for r = 12 via area = ½ · r · arc (or an equivalent route). 1 point for 90°. 1 point for π/2 with the rθ check.

    - slug: geo-u07-w28-q24
      type: short_answer
      topic_code: "7.7"
      source: "IM Geometry, Unit 7, Lesson 7"
      points: 3
      prompt: |
        Review. A triangle has sides 9, 12 and 15.

        (a) Find its inradius r.
        (b) The inscribed circle is divided into three sectors by the radii to the three points of tangency; the sector facing the right angle has central angle 90°. Find the area of that sector.
        (c) Explain why that sector's central angle is 90°, using the tangent–radius right angles and the angle sum of a quadrilateral.
      answer: |
        (a) 9² + 12² = 15², so the triangle is right-angled with area 54 and s = 18; r = 54/18 = 3.
        (b) (90/360) · π · 3² = 9π/4 ≈ 7.07.
        (c) The two points of tangency on the legs, the incentre and the right-angle vertex form a quadrilateral with right angles at both tangency points (radius ⊥ tangent) and at the vertex; its angles sum to 360°, so the angle at the incentre is 360° − 3 · 90° = 90°.
      explanation: |
        1 point for r = 3. 1 point for 9π/4 (≈ 7.07). 1 point for the quadrilateral argument with the two tangent–radius right angles.

