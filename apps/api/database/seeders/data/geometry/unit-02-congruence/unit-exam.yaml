    - slug: geo-u02-exam-q46
      type: short_answer
      topic_code: "2.10"
      source: "IM Geometry, Unit 2, Lesson 10"
      points: 3
      prompt: |
        Figure description: AB ∥ DC, and E is the midpoint of segment AD. Line BE is extended to meet line DC at F (F on the extension of DC beyond C or D as needed). Answer (a), (b) and (c).

        (a) Prove △ABE ≅ △DFE, naming the criterion and the reason for each congruence.
        (b) Conclude by CPCTC that E is the midpoint of BF.
        (c) If AB = 7, find DF and explain.
      answer: |
        (a) ∠BAE ≅ ∠FDE (alternate interior angles, AB ∥ DF, transversal AD); AE ≅ DE (E is the midpoint of AD); ∠AEB ≅ ∠DEF (vertical angles). △ABE ≅ △DFE by ASA. (b) BE ≅ FE by CPCTC, so E is the midpoint of BF by definition. (c) DF = AB = 7 by CPCTC (corresponding sides AB and DF).
      explanation: |
        1 point for (a): ASA with the alternate interior, midpoint and vertical reasons. 1 point for (b): BE ≅ FE and the midpoint definition. 1 point for (c): DF = 7 by CPCTC.

    - slug: geo-u02-exam-q47
      type: short_answer
      topic_code: "2.15"
      source: "IM Geometry, Unit 2, Lesson 15"
      points: 3
      prompt: |
        Answer (a), (b) and (c).

        (a) State three measurements that determine a parallelogram up to congruence, and explain why no fewer will do.
        (b) State the minimum information that determines a rectangle, and justify it.
        (c) A kite has sides 5, 5, 12, 12. Is it determined up to congruence? If not, what one extra measurement fixes it?
      answer: |
        (a) Two adjacent sides and the included angle. With only two sides the angle can vary (the parallelogram leans); with a side and an angle the other side can vary; so three are needed, and three suffice because the theorems fix the remaining sides and angles. (b) Two side lengths. All angles are 90° by definition, so a diagonal cuts the rectangle into right triangles determined by SAS (two sides and the right angle). (c) No: a kite with those sides can open or close like a hinge (the angle between the two 5s can vary). One extra measurement fixes it: for example the axis diagonal (then SSS on each half) or the angle between the two congruent short sides (then SAS on one half and the symmetry).
      explanation: |
        1 point for (a): the S-A-S data with a reason fewer fail. 1 point for (b): two sides, with the right-angle justification. 1 point for (c): not determined, plus a valid single extra measurement.

    - slug: geo-u02-exam-q48
      type: long_answer
      topic_code: "2.6"
      source: "IM Geometry, Unit 2, Lesson 6"
      points: 6
      prompt: |
        State the SAS criterion precisely and prove it with rigid motions. Then apply it: figure description: quadrilateral WXYZ in which WX = WZ and diagonal WY bisects ∠XWZ. Prove that WY also bisects ∠XYZ and that WY is perpendicular to XZ (let XZ meet WY at T). Name every criterion and theorem used.
      answer: |
        SAS. If two sides and the included angle of one triangle are congruent to two sides and the included angle of another (AB ≅ DE, ∠A ≅ ∠D, AC ≅ DF), the triangles are congruent (△ABC ≅ △DEF).

        Proof. Translate by the directed segment from A to D; A lands on D. Rotate about D so that the image of B lies on ray DE; since rigid motions preserve length, the image of B is AB = DE from D, and the only point on ray DE at that distance is E. Now the image of ray AC makes angle ∠A = ∠D with ray DE. If it lies on the same side of line DE as F, it is ray DF (exactly one ray on a given side makes a given angle with DE). If it lies on the other side, reflect across line DE: D and E stay fixed, and the image ray is carried to ray DF. In either case the image of C lies on ray DF at distance AC = DF from D, which is F. A sequence of rigid motions sends A → D, B → E, C → F, so △ABC ≅ △DEF. ∎

        Application. In △WXY and △WZY: WX ≅ WZ (given); ∠XWY ≅ ∠ZWY (WY bisects ∠XWZ, definition of angle bisector); WY ≅ WY (reflexive). The angle at W is included between WX and WY, and between WZ and WY. So △WXY ≅ △WZY by SAS. By CPCTC, ∠XYW ≅ ∠ZYW, so WY bisects ∠XYZ.

        Perpendicularity. In △WXT and △WZT: WX ≅ WZ, ∠XWT ≅ ∠ZWT (same bisected angle), WT ≅ WT. △WXT ≅ △WZT by SAS. By CPCTC ∠WTX ≅ ∠WTZ. These angles form a linear pair along XZ, so each is 90°: WY ⊥ XZ. (Also XT ≅ ZT by CPCTC, so WY is the perpendicular bisector of XZ; alternatively, W and Y are each equidistant from X and Z, so WY is the perpendicular bisector of XZ by the converse of the Perpendicular Bisector Theorem.)
      explanation: |
        Scoring (6 points): 1 for a precise SAS statement with "included"; 2 for the rigid-motion proof (B landing on E by length; C landing on F by the equal angle and equal side, with the reflection case); 1 for △WXY ≅ △WZY by SAS with all three reasons and the CPCTC bisector conclusion; 1 for △WXT ≅ △WZT (or the Perpendicular Bisector Theorem route); 1 for the linear-pair argument giving the right angle. Deduct 1 for citing SSA or for circular reasoning.
