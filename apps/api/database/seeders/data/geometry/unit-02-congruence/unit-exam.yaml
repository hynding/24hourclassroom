unit: 2
description: |
  48 questions · about 85 minutes · covers every lesson of Unit 2 (congruent parts, rigid-motion proofs, SAS,
  ASA, SSS, HL, the Perpendicular Bisector Theorem, kites, rhombuses, parallelograms and what determines a
  quadrilateral) with some review of Unit 1. Multiple choice, select-all, true/false and numeric items are
  graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are
  graded by your teacher against the scoring notes.
questions:
    - slug: geo-u02-exam-q01
      type: multiple_choice
      topic_code: "2.1"
      source: "IM Geometry, Unit 2, Lesson 1"
      points: 1
      prompt: |
        Hexagon ABCDEF ≅ hexagon PQRSTU. Which pair of parts must be congruent?
      options:
        - "Side DE and side ST"
        - "Side DE and side RS"
        - "∠E and ∠Q"
        - "∠F and ∠P"
      option_explanations:
        - |
          Correct. D ↔ S and E ↔ T (fourth and fifth letters), so DE ↔ ST.
        - |
          RS corresponds to CD, the third and fourth letters, not to DE.
        - |
          ∠E (fifth letter) corresponds to ∠T, not ∠Q (second letter).
        - |
          ∠F (sixth letter) corresponds to ∠U, not ∠P (first letter).
      answer: 0

    - slug: geo-u02-exam-q02
      type: multiple_choice
      topic_code: "2.2"
      source: "IM Geometry, Unit 2, Lesson 2"
      points: 1
      prompt: |
        Which statement about quadrilaterals is true?
      options:
        - "Two quadrilaterals can have all four pairs of corresponding sides congruent without being congruent"
        - "Four congruent sides guarantee two quadrilaterals are congruent"
        - "If two quadrilaterals are congruent, some pair of corresponding sides may differ"
        - "Quadrilaterals have a three-part congruence criterion like triangles"
      option_explanations:
        - |
          Correct. A square and a non-square rhombus of the same side are the standard example; quadrilaterals can flex.
        - |
          Four congruent sides do not fix the angles, so congruence is not guaranteed.
        - |
          Congruent figures have all corresponding parts congruent, by the properties of rigid motions.
        - |
          Quadrilaterals need more information, such as four sides and a diagonal.
      answer: 0

    - slug: geo-u02-exam-q03
      type: multiple_choice
      topic_code: "2.3"
      source: "IM Geometry, Unit 2, Lesson 3"
      points: 1
      prompt: |
        In a rigid-motion proof that △ABC ≅ △DEF, the first two steps are a translation taking A to D and a rotation about D. What does the rotation accomplish, and what fact guarantees it?
      options:
        - "It places the image of B exactly on E, because the image of AB has length AB = DE and only one point on ray DE is at that distance from D"
        - "It places the image of C on F, because rotations preserve angles"
        - "It makes the triangles have the same orientation"
        - "It moves D onto E"
      option_explanations:
        - |
          Correct. The rotation aligns the image of B with ray DE, and the congruent side pins it to E.
        - |
          The image of C is handled in the third step, possibly with a reflection.
        - |
          Rotations do not change orientation; a reflection does that if needed.
        - |
          D is the centre of the rotation and stays fixed.
      answer: 0

    - slug: geo-u02-exam-q04
      type: multiple_choice
      topic_code: "2.4"
      source: "IM Geometry, Unit 2, Lesson 4"
      points: 1
      prompt: |
        After two vertices are matched (A on D, B on E), the image C′ of the third vertex satisfies DC′ = DF and EC′ = EF but C′ ≠ F. Which statement correctly completes the proof?
      options:
        - "D and E are each equidistant from C′ and F, so line DE is the perpendicular bisector of C′F, and reflecting across DE sends C′ to F"
        - "Translate C′ to F; D and E are unaffected"
        - "Rotate about D until C′ reaches F; E is unaffected"
        - "The proof cannot be completed"
      option_explanations:
        - |
          Correct. The converse of the Perpendicular Bisector Theorem identifies DE as the mirror, and the reflection fixes D and E.
        - |
          A translation moves every point, so D and E would leave their targets.
        - |
          A rotation about D moves E off its target (unless the angle is zero).
        - |
          One reflection across line DE finishes the proof, so it can be completed.
      answer: 0

    - slug: geo-u02-exam-q05
      type: multiple_choice
      topic_code: "2.5"
      source: "IM Geometry, Unit 2, Lesson 5"
      points: 1
      prompt: |
        Why is "AB = CD" (equal lengths) interchangeable with "AB ≅ CD" (congruent segments)?
      options:
        - "The Segment Congruence Theorem shows equal lengths imply a rigid motion carrying one onto the other, and rigid motions preserve length for the converse"
        - "Because segments are always congruent"
        - "Because length is defined as congruence"
        - "They are not interchangeable; congruence is a stronger condition"
      option_explanations:
        - |
          Correct. Translate one endpoint onto the other and rotate; the equal length lands the second endpoint. The converse is distance preservation.
        - |
          Segments of different lengths are not congruent.
        - |
          Length is a number; congruence is about rigid motions. The theorem links them.
        - |
          For segments and angles the two notions coincide exactly.
      answer: 0

    - slug: geo-u02-exam-q06
      type: multiple_choice
      topic_code: "2.6"
      source: "IM Geometry, Unit 2, Lesson 6"
      points: 1
      prompt: |
        Figure description: point M is the midpoint of both segments AC and BD, which cross at M. Which triangle congruence follows by SAS?
      options:
        - "△AMB ≅ △CMD"
        - "△AMB ≅ △DMC"
        - "△AMD ≅ △BMC"
        - "△ABM ≅ △CBM"
      option_explanations:
        - |
          Correct. AM ≅ CM, ∠AMB ≅ ∠CMD (vertical), BM ≅ DM; the correspondence A ↔ C, M ↔ M, B ↔ D.
        - |
          The correspondence is wrong: B corresponds to D, not to C; this statement claims AM ≅ DM.
        - |
          AMD and BMC are not matched by vertical angles at M in this orientation (the vertical pair of ∠AMD is ∠CMB, which would give △AMD ≅ △CMB).
        - |
          ABM and CBM share side BM but no congruence is given between AB and CB.
      answer: 0

    - slug: geo-u02-exam-q07
      type: multiple_choice
      topic_code: "2.6"
      source: "IM Geometry, Unit 2, Lesson 6"
      points: 1
      prompt: |
        △RST and △XYZ have RS = XY, ST = YZ and ∠T = ∠Z. Which is true?
      options:
        - "SAS does not apply, because the congruent angle is not between the two congruent sides"
        - "SAS applies, giving △RST ≅ △XYZ"
        - "ASA applies"
        - "SSS applies"
      option_explanations:
        - |
          Correct. The included angle between RS and ST is ∠S; ∠T is non-included, so this is SSA.
        - |
          The angle is at T, which is not between RS and ST.
        - |
          Only one angle is given, so ASA, which needs two angles, cannot apply.
        - |
          Only two sides are given, so SSS, which needs three, cannot apply.
      answer: 0

    - slug: geo-u02-exam-q08
      type: multiple_choice
      topic_code: "2.7"
      source: "IM Geometry, Unit 2, Lesson 7"
      points: 1
      prompt: |
        Figure description: AB ∥ DC, and segments AC and BD cross at E, where E is the midpoint of BD. Which criterion proves △ABE ≅ △CDE?
      options:
        - "ASA: ∠ABE ≅ ∠CDE (alternate interior), BE ≅ DE (midpoint), ∠AEB ≅ ∠CED (vertical)"
        - "SAS: AE ≅ CE, ∠AEB ≅ ∠CED, BE ≅ DE"
        - "SSS: AB ≅ CD, BE ≅ DE, AE ≅ CE"
        - "AAS: ∠BAE ≅ ∠DCE, ∠AEB ≅ ∠CED, AB ≅ CD"
      option_explanations:
        - |
          Correct. The parallel lines give the angle at B and D, the midpoint gives the included side, and the vertical angles give the angle at E.
        - |
          AE ≅ CE is not given; it is a conclusion.
        - |
          Neither AB ≅ CD nor AE ≅ CE is given; both would be CPCTC conclusions.
        - |
          AB ≅ CD is not given; it is a conclusion reached only after the congruence.
      answer: 0

    - slug: geo-u02-exam-q09
      type: multiple_choice
      topic_code: "2.7"
      source: "IM Geometry, Unit 2, Lesson 7"
      points: 1
      prompt: |
        Two triangles have angles of 40° and 75° and a side of 8 opposite the 40° angle in each. Are they congruent?
      options:
        - "Yes, by AAS: two angles and a corresponding non-included side"
        - "No, because the side is not included"
        - "No, because AAA is not a criterion"
        - "Only if the third angles are also measured"
      option_explanations:
        - |
          Correct. The third angle is 65° in both, and the side of 8 corresponds (opposite 40° in each), so ASA/AAS applies.
        - |
          A non-included side still works (AAS) once the third angle is known to match.
        - |
          A corresponding side is given, so this is not the AAA situation at all.
        - |
          The third angle is forced by the angle sum; no measurement is needed.
      answer: 0

    - slug: geo-u02-exam-q10
      type: multiple_choice
      topic_code: "2.8"
      source: "IM Geometry, Unit 2, Lesson 8"
      points: 1
      prompt: |
        Point T is equidistant from the endpoints of segment GH. Which conclusion follows, and from which theorem?
      options:
        - "T lies on the perpendicular bisector of GH, by the converse of the Perpendicular Bisector Theorem"
        - "T is the midpoint of GH, by the definition of midpoint"
        - "TG ⊥ GH, by the Perpendicular Bisector Theorem"
        - "T lies on line GH, by the Segment Congruence Theorem"
      option_explanations:
        - |
          Correct. Equidistant from the endpoints implies on the perpendicular bisector.
        - |
          The midpoint is one such point, but T could be any point on the bisector.
        - |
          TG is a slant segment to an endpoint; it is not perpendicular to GH in general.
        - |
          Only the midpoint is both equidistant and on the line.
      answer: 0

    - slug: geo-u02-exam-q11
      type: multiple_choice
      topic_code: "2.8"
      source: "IM Geometry, Unit 2, Lesson 8"
      points: 1
      prompt: |
        In the proof of the Perpendicular Bisector Theorem (on the bisector implies equidistant), with M the midpoint of AB and P on the bisector, which three congruences give △AMP ≅ △BMP?
      options:
        - "AM ≅ BM (midpoint), ∠AMP ≅ ∠BMP (right angles), MP ≅ MP (reflexive)"
        - "AP ≅ BP (given), AM ≅ BM, MP ≅ MP"
        - "∠A ≅ ∠B, AM ≅ BM, ∠AMP ≅ ∠BMP"
        - "AP ≅ BP, ∠APM ≅ ∠BPM, PM ≅ PM"
      option_explanations:
        - |
          Correct. Two sides and the included right angle at M: SAS.
        - |
          AP ≅ BP is the conclusion of this direction of the theorem, not a given.
        - |
          The base angles are not known in this direction of the theorem.
        - |
          Both AP ≅ BP and the bisected angle at P are conclusions, not givens.
      answer: 0

    - slug: geo-u02-exam-q12
      type: multiple_choice
      topic_code: "2.9"
      source: "IM Geometry, Unit 2, Lesson 9"
      points: 1
      prompt: |
        Figure description: △ABC and △ADC share side AC, with AB = AD and CB = CD. By which criterion are they congruent, and what is one CPCTC conclusion?
      options:
        - "SSS; ∠BAC ≅ ∠DAC"
        - "SAS; BC ≅ DC"
        - "ASA; AB ≅ AD"
        - "HL; AC is a hypotenuse"
      option_explanations:
        - |
          Correct. Three sides (two given pairs and the shared AC) give SSS; the angles at A are then congruent.
        - |
          No angle is given, so SAS cannot start; and BC ≅ DC is given, not concluded.
        - |
          No angles are given; AB ≅ AD is given, not concluded.
        - |
          No right angles are given, so HL cannot be used here.
      answer: 0

    - slug: geo-u02-exam-q13
      type: multiple_choice
      topic_code: "2.10"
      source: "IM Geometry, Unit 2, Lesson 10"
      points: 1
      prompt: |
        A proof lists: "1. PQ ≅ SR (given). 2. ∠QPR ≅ ∠SRP (alternate interior angles, PQ ∥ RS). 3. PR ≅ RP (reflexive). 4. △PQR ≅ △RSP." What reason belongs in step 4?
      options:
        - "SAS"
        - "ASA"
        - "SSS"
        - "AAS"
      option_explanations:
        - |
          Correct. Side PQ/RS, the included angle at P/R (between PQ and PR, and between RS and RP), and side PR/RP.
        - |
          Only one angle is listed, so ASA, which needs two angles, is not supported.
        - |
          Only two sides are listed, so SSS, which needs three, is not supported.
        - |
          Only one angle is listed, so AAS, which needs two angles, is not supported.
      answer: 0

    - slug: geo-u02-exam-q14
      type: multiple_choice
      topic_code: "2.11"
      source: "IM Geometry, Unit 2, Lesson 11"
      points: 1
      prompt: |
        Sides 10 and 6 with a 25° angle opposite the 6. Given sin 25° ≈ 0.423, how many non-congruent triangles have this data?
      options:
        - "Two, because 10 sin 25° ≈ 4.23 < 6 < 10"
        - "One, because the data is SSA"
        - "None, because 6 is too short"
        - "Infinitely many"
      option_explanations:
        - |
          Correct. The circle of radius 6 centred at the far vertex crosses the 25° ray twice because 6 is between the perpendicular distance 4.23 and the side 10.
        - |
          SSA data can give two triangles; this is the ambiguous case.
        - |
          6 exceeds the perpendicular distance 4.23, so the circle does reach the ray.
        - |
          Only two positions satisfy the distance condition.
      answer: 0

    - slug: geo-u02-exam-q15
      type: multiple_choice
      topic_code: "2.11"
      source: "IM Geometry, Unit 2, Lesson 11"
      points: 1
      prompt: |
        Right triangles △ABC (right angle at C) and △DEF (right angle at F) have AB = DE and AC = DF. Which criterion applies?
      options:
        - "HL, with hypotenuses AB and DE and legs AC and DF"
        - "SAS, with the right angle included"
        - "SSA, which does not apply"
        - "ASA"
      option_explanations:
        - |
          Correct. The hypotenuse is opposite the right angle; with one congruent leg, HL guarantees congruence.
        - |
          The right angle at C is between AC and BC, not between AB and AC.
        - |
          It is SSA in form, but the right-angle case is exactly where SSA works, under the name HL.
        - |
          Only one angle (the right angle) is given, so ASA cannot apply.
      answer: 0

    - slug: geo-u02-exam-q16
      type: multiple_choice
      topic_code: "2.12"
      source: "IM Geometry, Unit 2, Lesson 12"
      points: 1
      prompt: |
        Kite ABCD has AB = AD = 10 and CB = CD = 17, and diagonal BD = 16. What is the length of diagonal AC?
      options:
        - "21"
        - "27"
        - "√389"
        - "9"
      option_explanations:
        - |
          Correct. AC is the perpendicular bisector of BD, so with M the crossing point BM = 8; AM = √(100 − 64) = 6 and CM = √(289 − 64) = 15, so AC = 21.
        - |
          27 = 10 + 17 would need A, B, C collinear.
        - |
          √389 = √(100 + 289) treats AB and BC as perpendicular legs, which they are not.
        - |
          9 = 15 − 6 would be the distance if A and C were on the same side of BD, but they are on opposite sides.
      answer: 0

    - slug: geo-u02-exam-q17
      type: multiple_choice
      topic_code: "2.12"
      source: "IM Geometry, Unit 2, Lesson 12"
      points: 1
      prompt: |
        Which property do a rhombus's diagonals have that a general parallelogram's diagonals lack?
      options:
        - "They are perpendicular to each other"
        - "They bisect each other"
        - "They are congruent to each other"
        - "They lie inside the figure"
      option_explanations:
        - |
          Correct. A rhombus is a kite in both directions, so each diagonal is the perpendicular bisector of the other.
        - |
          All parallelograms have diagonals that bisect each other.
        - |
          Congruent diagonals belong to rectangles, not rhombuses in general.
        - |
          The diagonals of any convex quadrilateral lie inside it.
      answer: 0

    - slug: geo-u02-exam-q18
      type: multiple_choice
      topic_code: "2.13"
      source: "IM Geometry, Unit 2, Lesson 13"
      points: 1
      prompt: |
        In parallelogram ABCD, ∠A = 3∠B. What is ∠C?
      options:
        - "135°"
        - "45°"
        - "60°"
        - "120°"
      option_explanations:
        - |
          Correct. Consecutive angles are supplementary: 3x + x = 180, x = 45, ∠A = 135°, and ∠C = ∠A (opposite angles) = 135°.
        - |
          45° is the measure of ∠B and ∠D; ∠C is opposite ∠A and equals it.
        - |
          60° would come from an equal split of 180° into three parts, which is not the relationship given.
        - |
          120° would require ∠A = 2∠B, but the problem says ∠A = 3∠B.
      answer: 0

    - slug: geo-u02-exam-q19
      type: multiple_choice
      topic_code: "2.13"
      source: "IM Geometry, Unit 2, Lesson 13"
      points: 1
      prompt: |
        Which of the following is sufficient to prove that quadrilateral KLMN is a parallelogram?
      options:
        - "KL = NM and KL ∥ NM"
        - "KL = NM and KN ∥ LM"
        - "KL = LM and MN = NK"
        - "The diagonals KM and LN are congruent"
      option_explanations:
        - |
          Correct. One pair of opposite sides both parallel and congruent is Converse B.
        - |
          One pair congruent and the other pair parallel is satisfied by an isosceles trapezoid.
        - |
          Two pairs of congruent adjacent sides make a kite, not necessarily a parallelogram.
        - |
          Congruent diagonals alone are satisfied by an isosceles trapezoid.
      answer: 0

    - slug: geo-u02-exam-q20
      type: multiple_choice
      topic_code: "2.14"
      source: "IM Geometry, Unit 2, Lesson 14"
      points: 1
      prompt: |
        In △XYZ, ∠X = ∠Z = 65°. Which sides are congruent, and why?
      options:
        - "YZ = YX, by the converse of the isosceles triangle theorem (sides opposite congruent angles)"
        - "XZ = XY, because X is a base angle"
        - "XZ = YZ, because they share Z"
        - "No sides are congruent, because 65° is not 60°"
      option_explanations:
        - |
          Correct. The side opposite ∠X is YZ and the side opposite ∠Z is YX; congruent angles give congruent opposite sides.
        - |
          XZ is the base, opposite the apex angle Y (50°), and is not equal to the legs.
        - |
          Sharing a vertex does not make sides congruent; the relevant sides are the ones opposite the equal angles.
        - |
          Two equal angles make the triangle isosceles regardless of their value.
      answer: 0

    - slug: geo-u02-exam-q21
      type: multiple_choice
      topic_code: "2.14"
      source: "IM Geometry, Unit 2, Lesson 14"
      points: 1
      prompt: |
        Which statement is the angle bisector theorem in its distance form?
      options:
        - "A point on the bisector of an angle is the same perpendicular distance from both sides of the angle"
        - "A point on the bisector of an angle is the same distance from both endpoints of the angle's sides"
        - "The bisector of an angle is perpendicular to the opposite side"
        - "The bisector divides the opposite side into two congruent parts"
      option_explanations:
        - |
          Correct. Proved by AAS on the two right triangles formed by dropping perpendiculars to the sides.
        - |
          Rays have no endpoints to compare, and the theorem is about distance to lines.
        - |
          That is true only for the apex of an isosceles triangle.
        - |
          The bisector meets the opposite side at its midpoint only in an isosceles triangle.
      answer: 0

    - slug: geo-u02-exam-q22
      type: multiple_choice
      topic_code: "2.15"
      source: "IM Geometry, Unit 2, Lesson 15"
      points: 1
      prompt: |
        Two convex quadrilaterals have sides 6, 8, 10, 12 in order and a diagonal of 13 joining the vertex between the 6 and 12 to the vertex between the 8 and 10. Are they congruent?
      options:
        - "Yes: the diagonal splits each into a 6-8-13 triangle and a 10-12-13 triangle, each fixed by SSS, glued on opposite sides of the diagonal"
        - "No: four sides never determine a quadrilateral"
        - "Yes, but only if an angle is also given"
        - "No: the triangles could be glued on the same side"
      option_explanations:
        - |
          Correct. Four sides plus one diagonal determine a convex quadrilateral.
        - |
          Four sides alone do not, but a diagonal adds the missing information.
        - |
          No angle is needed once the diagonal is known.
        - |
          Gluing on the same side would produce a non-convex (self-overlapping) figure, excluded by convexity.
      answer: 0

    - slug: geo-u02-exam-q23
      type: multiple_choice
      topic_code: "1.20"
      source: "IM Geometry, Unit 1, Lesson 20"
      points: 1
      prompt: |
        Review. After proving △ABD ≅ △CDB with diagonal BD of quadrilateral ABCD, a student concludes ∠ABD ≅ ∠CDB by CPCTC. What does this tell you about AB and CD?
      options:
        - "AB ∥ CD, because congruent alternate interior angles with transversal BD imply parallel lines"
        - "AB ⊥ CD"
        - "AB = CD"
        - "Nothing about AB and CD"
      option_explanations:
        - |
          Correct. ∠ABD and ∠CDB are alternate interior angles for lines AB and CD cut by BD.
        - |
          Congruent alternate angles give parallel lines, not perpendicular ones.
        - |
          AB = CD follows from a different pair of corresponding parts (the sides), not from these angles.
        - |
          The converse of the alternate interior angle theorem gives a definite conclusion.
      answer: 0

    - slug: geo-u02-exam-q24
      type: multiple_choice
      topic_code: "1.19"
      source: "IM Geometry, Unit 1, Lesson 19"
      points: 1
      prompt: |
        Review. In a proof that two triangles formed by crossing segments are congruent, the angle at the crossing point is justified by which reason?
      options:
        - "Vertical angles are congruent"
        - "Alternate interior angles are congruent"
        - "The reflexive property"
        - "CPCTC"
      option_explanations:
        - |
          Correct. Two crossing segments form two pairs of vertical angles at the crossing point.
        - |
          Alternate interior angles need parallel lines and a transversal.
        - |
          The reflexive property is for a shared side or angle, and the two angles at the crossing are different angles.
        - |
          CPCTC comes after congruence is established.
      answer: 0

    # ---- Stimulus set A: parallelogram with a midpoint (2.13, 2.7, 2.6)
    - slug: geo-u02-exam-q25
      type: multiple_choice
      topic_code: "2.13"
      source: "IM Geometry, Unit 2, Lesson 13"
      points: 1
      stimulus: |
        Figure description: parallelogram ABCD with AB ∥ DC and AD ∥ BC. Point M is the midpoint of side DC. Line AM is extended to meet the extension of side BC at point E, beyond C.
      prompt: |
        Which pair of angles is congruent because AD ∥ BC (extended through E) with transversal AE?
      options:
        - "∠DAM and ∠CEM"
        - "∠DAM and ∠MCE"
        - "∠AMD and ∠EMC"
        - "∠ADM and ∠ECM"
      option_explanations:
        - |
          Correct. ∠DAM (at A, between DA and AM) and ∠CEM (at E, between EC and EM) are alternate interior angles for the parallels AD and BE with transversal AE.
        - |
          ∠MCE is at C, between CM and CE; it is not formed with the transversal AE.
        - |
          These are vertical angles, congruent for a different reason.
        - |
          ∠ADM and ∠ECM sit at D and C on the same line DC; they are co-interior angles for AD ∥ BC with transversal DC, so they are supplementary, not congruent.
      answer: 0

    - slug: geo-u02-exam-q26
      type: multiple_choice
      topic_code: "2.7"
      source: "IM Geometry, Unit 2, Lesson 7"
      points: 1
      stimulus: |
        Figure description: parallelogram ABCD with AB ∥ DC and AD ∥ BC. Point M is the midpoint of side DC. Line AM is extended to meet the extension of side BC at point E, beyond C.
      prompt: |
        Which criterion proves △ADM ≅ △ECM?
      options:
        - "AAS (or ASA): ∠DAM ≅ ∠CEM (alternate interior), ∠AMD ≅ ∠EMC (vertical), DM ≅ CM (midpoint)"
        - "SAS: AD ≅ EC, ∠ADM ≅ ∠ECM, DM ≅ CM"
        - "SSS: AD ≅ EC, DM ≅ CM, AM ≅ EM"
        - "HL: AM is a hypotenuse"
      option_explanations:
        - |
          Correct. Two angles and the side DM/CM (included between the angle at D/C and the angle at M once the third angle is known, or directly as AAS).
        - |
          AD ≅ EC is not given; it is the conclusion of the problem.
        - |
          Neither AD ≅ EC nor AM ≅ EM is given; both are CPCTC conclusions.
        - |
          No right angles are present in the figure, so HL cannot be used.
      answer: 0

    - slug: geo-u02-exam-q27
      type: multiple_choice
      topic_code: "2.6"
      source: "IM Geometry, Unit 2, Lesson 6"
      points: 1
