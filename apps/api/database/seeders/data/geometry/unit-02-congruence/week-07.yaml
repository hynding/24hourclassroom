week: 7
unit: 2
title: "Congruent Parts and Congruent Triangles"
topics: ["2.1", "2.2", "2.3", "2.4"]
guide: guides/week-07.md
guide_description: |
  How a congruence statement records a correspondence and why every pair of corresponding parts of congruent
  figures is congruent. Why the converse fails for quadrilaterals (four equal sides do not force congruence) but
  not for triangles. The rigid-motion proof that two triangles with all sides and angles congruent are congruent:
  translate, rotate, reflect if needed, with a justified reason for each landing, and two ways to justify the
  final reflection.
flashcards_description: |
  27 cards on congruence statements, corresponding parts, CPCTC, why quadrilaterals can flex, and the four-step
  rigid-motion proof of triangle congruence with its justifications.

flashcards:
  - front: Congruence statement △ABC ≅ △DEF → how to read the letters
    back: |
      The order records the correspondence of a rigid motion: A → D, B → E, C → F. Consequently AB ↔ DE, BC ↔ EF, CA ↔ FD and ∠A ↔ ∠D, ∠B ↔ ∠E, ∠C ↔ ∠F.
    topic_code: "2.1"
  - front: Congruent figures → what is true of their corresponding parts
    back: |
      Every pair of corresponding sides is congruent and every pair of corresponding angles is congruent, because the rigid motion that carries one figure onto the other preserves lengths and angle measures.
    topic_code: "2.1"
  - front: CPCTC → meaning and when to use it
    back: |
      "Corresponding parts of congruent triangles are congruent." After proving a triangle congruence, cite it to conclude that a particular pair of sides or angles is congruent.
    topic_code: "2.1"
  - front: Rewriting a congruence statement in a different order → rule
    back: |
      You may cycle or reorder the letters as long as the pairing is preserved: △ABC ≅ △DEF, △BCA ≅ △EFD and △CAB ≅ △FDE all say the same thing. △ABC ≅ △DFE says something different.
    topic_code: "2.1"
  - front: Isosceles triangle ABC with AB = AC → a congruence of the triangle with itself
    back: |
      △ABC ≅ △ACB, via the reflection across the line of symmetry (A fixed, B ↔ C). It records that ∠B ≅ ∠C and AB ≅ AC.
    topic_code: "2.1"
  - front: Converse of "congruent figures have congruent corresponding parts" → true for which figures
    back: |
      True for triangles (all six parts congruent, and even fewer, force congruence). False for quadrilaterals and other polygons, which can flex while keeping their side lengths.
    topic_code: "2.2"
  - front: Square and rhombus with the same side → why not congruent
    back: |
      All four pairs of corresponding sides are congruent, but a rigid motion preserves angle measure and 90° ≠ 60°. Equal sides alone never prove quadrilaterals congruent.
    topic_code: "2.2"
  - front: Hinge model of a quadrilateral → what it shows
    back: |
      Four rods pinned end to end can be pushed from a rectangle into a slanted parallelogram without changing any length. Three rods pinned into a triangle cannot move at all: triangles are rigid, quadrilaterals are not.
    topic_code: "2.2"
  - front: Four sides and one angle of a quadrilateral → enough for congruence?
    back: |
      No. The angle fixes one diagonal and the triangle on one side of it, but the fourth vertex can sit on either side of that diagonal, giving a convex and a dented quadrilateral with the same data.
    topic_code: "2.2"
  - front: Included angle → definition
    back: |
      The angle between two named sides of a triangle. In △ABC, ∠B is included between sides AB and BC. Used in stating the SAS criterion.
    topic_code: "2.3"
  - front: Included side → definition
    back: |
      The side between two named angles of a triangle. In △ABC, side BC is included between ∠B and ∠C. Used in stating the ASA criterion.
    topic_code: "2.3"
  - front: Rigid-motion congruence proof → step 1 and its reason
    back: |
      Translate by the directed segment from A to D so that A lands on D. Reason: a translation is a rigid motion, so the image triangle is congruent to the original.
    topic_code: "2.3"
  - front: Rigid-motion congruence proof → step 2 and its reason
    back: |
      Rotate about D so that the image of B lies on ray DE. Since rigid motions preserve length, the image of B is AB = DE from D, and the only point on ray DE at that distance from D is E.
    topic_code: "2.3"
  - front: Rigid-motion congruence proof → step 3 when the third vertex is on the correct side
    back: |
      Using the equal angles: ∠EDC″ = ∠A = ∠D, so ray DC″ coincides with ray DF; then DC″ = AC = DF puts C″ exactly at F. No reflection needed.
    topic_code: "2.4"
  - front: Rigid-motion congruence proof → step 3 when the third vertex is on the wrong side
    back: |
      Reflect across line DE. D and E are on the mirror, so they stay fixed; the image of C is carried to F by the equal-angle argument or by the perpendicular-bisector argument.
    topic_code: "2.4"
  - front: Perpendicular-bisector justification of the final reflection → statement
    back: |
      If DC″ = DF and EC″ = EF, then D and E are each equidistant from C″ and F, so both lie on the perpendicular bisector of C″F. Two points determine a line, so line DE is that perpendicular bisector, and reflecting across DE sends C″ to F by definition.
    topic_code: "2.4"
  - front: Why rays from D on the same side of DE making equal angles with DE coincide → reason
    back: |
      An angle measured from ray DE on a given side determines exactly one ray from D. Equal angle measures on the same side therefore give the same ray.
    topic_code: "2.4"
  - front: The unique point on ray DE at distance DE from D → where this fact is used
    back: |
      In step 2 of every rigid-motion proof, to turn "the image of B is on the ray" into "the image of B is E". It relies on the congruent side AB = DE.
    topic_code: "2.3"
  - front: Points on the line of reflection → what happens to them
    back: |
      They are fixed. In the final step of a congruence proof this is why the two already-matched vertices D and E stay in place when you reflect across line DE.
    topic_code: "2.4"
  - front: Which facts the six-part proof actually used → observation
    back: |
      Only AB = DE, ∠A = ∠D and AC = DF (two sides and the included angle). The other three congruences were never needed, which previews the SAS criterion.
    topic_code: "2.4"
  - front: Error-spot → "C lands on F because the triangles are congruent"
    back: |
      Circular: that is what is being proved. Replace it with a reason: equal angles at D put the image on ray DF at distance DF, or D and E are equidistant from the image and F.
    topic_code: "2.4"
  - front: Error-spot → concluding quadrilateral congruence from four congruent sides
    back: |
      Invalid. A square and a rhombus of the same side are a counterexample. Quadrilaterals need angle information as well, and even then the fourth vertex can flip across a diagonal.
    topic_code: "2.2"
  - front: Checking a rigid-motion proof on coordinates → what to verify
    back: |
      Compute the image of each vertex after each step and confirm the final images are D, E and F exactly. Verify the given side lengths with the distance formula before starting.
    topic_code: "2.3"
  - front: Translation then rotation about the matched vertex → why the first vertex stays matched
    back: |
      The rotation is centred at D, and a rotation fixes its centre. So after step 2 both A (now at D) and B (now at E) are in place.
    topic_code: "2.3"
  - front: Corresponding parts of congruent quadrilaterals → how many pairs
    back: |
      Four pairs of sides and four pairs of angles, matched by the order of the letters: ABCD ≅ WXYZ gives AB ↔ WX, …, DA ↔ ZW and ∠A ↔ ∠W, etc.
    topic_code: "2.1"
  - front: Which method when → "prove two triangles congruent from coordinates"
    back: |
      Verify the three side lengths match, then give the explicit translation, the rotation about the matched vertex (with its angle and direction), and the reflection across the matched side if the orientations differ. Check every vertex.
    topic_code: "2.4"
  - front: Triangle rigidity → why it underlies congruence criteria
    back: |
      Because three sides pinned together cannot flex, a few measurements determine the whole triangle. That is why SAS, ASA and SSS exist for triangles and no comparable short list exists for quadrilaterals.
    topic_code: "2.2"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 2.1 to 2.4: congruence statements,
    corresponding parts, why quadrilaterals flex, and rigid-motion proofs of triangle congruence) with review of
    Unit 1 (constructions, transformations, symmetry, transversals and the triangle angle sum). Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: two triangles on a grid (2.3, 2.4)
    - slug: geo-u02-w07-q01
      type: multiple_choice
      topic_code: "2.3"
      source: "IM Geometry, Unit 2, Lesson 3"
      points: 1
      stimulus: |
        Figure description: triangle ABC with A = (1, 1), B = (5, 1), C = (1, 4). Triangle DEF with D = (−2, 2), E = (−2, 6), F = (1, 2). All three pairs of corresponding sides are congruent: AB = DE = 4, AC = DF = 3, BC = EF = 5.
      prompt: |
        The proof begins by translating A to D. Where do B and C land?
      options:
        - "B → (2, 2) and C → (−2, 5)"
        - "B → (−2, 6) and C → (1, 2)"
        - "B → (5, 1) and C → (1, 4)"
        - "B → (−6, 2) and C → (−2, −1)"
      option_explanations:
        - |
          Correct. The arrow is D − A = (−3, 1); adding it to B and C gives (2, 2) and (−2, 5).
        - |
          Those are E and F themselves; a single translation does not finish the job here because the triangles are turned differently.
        - |
          The vertices B and C do move under the translation; only the arrow (0, 0) would leave them in place.
        - |
          Those use the arrow (−11, 1) and (−3, −5), which are not the arrow from A to D.
      answer: 0

    - slug: geo-u02-w07-q02
      type: multiple_choice
      topic_code: "2.3"
      source: "IM Geometry, Unit 2, Lesson 3"
      points: 1
      stimulus: |
        Figure description: triangle ABC with A = (1, 1), B = (5, 1), C = (1, 4). Triangle DEF with D = (−2, 2), E = (−2, 6), F = (1, 2). All three pairs of corresponding sides are congruent: AB = DE = 4, AC = DF = 3, BC = EF = 5.
      prompt: |
        After the translation, the image of B is B₁ = (2, 2). A rotation about D is chosen so that B₁ lands on ray DE. Which statement justifies that B₁ lands exactly on E?
      options:
        - "DB₁ = AB = 4 = DE, and the only point on ray DE at distance 4 from D is E"
        - "B₁ is on ray DE, and every point on a ray is the same"
        - "The rotation is 90°, and 90° rotations always land on vertices"
        - "The triangles are congruent, so B must go to E"
      option_explanations:
        - |
          Correct. Rigid motions preserve DB₁ = 4; the given DE = 4 and the uniqueness of a point at a given distance along a ray pin the image to E.
        - |
          A ray contains infinitely many points; the distance from D is what singles out E.
        - |
          The angle happens to be 90° counter-clockwise here, but the justification is the length, not the angle.
        - |
          That is what the proof is trying to establish; using it as a reason is circular.
      answer: 0

    - slug: geo-u02-w07-q03
      type: multiple_choice
      topic_code: "2.4"
      source: "IM Geometry, Unit 2, Lesson 4"
      points: 1
      stimulus: |
        Figure description: triangle ABC with A = (1, 1), B = (5, 1), C = (1, 4). Triangle DEF with D = (−2, 2), E = (−2, 6), F = (1, 2). All three pairs of corresponding sides are congruent: AB = DE = 4, AC = DF = 3, BC = EF = 5.
      prompt: |
        After the translation and the 90° counter-clockwise rotation about D, the image of C is C₂ = (−5, 2), while F = (1, 2). Which argument shows that reflecting across line DE sends C₂ to F?
      options:
        - "DC₂ = DF = 3 and EC₂ = EF = 5, so D and E are both on the perpendicular bisector of C₂F, which is therefore line DE"
        - "C₂ and F have the same y-coordinate, so any vertical line reflects one onto the other"
        - "Line DE passes through C₂"
        - "The rotation should have been clockwise instead"
      option_explanations:
        - |
          Correct. Two points equidistant from the endpoints of C₂F lie on its perpendicular bisector, and two points determine that line; by the definition of reflection, C₂ maps to F.
        - |
          Only the specific vertical line through the midpoint (x = −2) works; the proof must identify it as line DE.
        - |
          C₂ = (−5, 2) is not on line DE (x = −2); it is 3 units to the left of it.
        - |
          The rotation correctly placed B on E; the orientations differ, so a reflection is the right finishing step.
      answer: 0

    - slug: geo-u02-w07-q04
      type: multiple_choice
      topic_code: "2.1"
      source: "IM Geometry, Unit 2, Lesson 1"
      points: 1
      prompt: |
        Pentagon ABCDE ≅ pentagon VWXYZ. Which pair of parts must be congruent?
      options:
        - "∠C and ∠X"
        - "∠C and ∠V"
        - "Side CD and side XW"
        - "Side AB and side ZY"
      option_explanations:
        - |
          Correct. The third letters correspond: C ↔ X, so ∠C ≅ ∠X.
        - |
          V corresponds to A, the first letter, not to C.
        - |
          CD corresponds to XY (third and fourth letters), not to XW.
        - |
          AB corresponds to VW, the first two letters, not to ZY.
      answer: 0

    - slug: geo-u02-w07-q05
      type: multiple_choice
      topic_code: "2.1"
      source: "IM Geometry, Unit 2, Lesson 1"
      points: 1
      prompt: |
        △MNP ≅ △QRS with MN = 7, NP = 9, PM = 11 and ∠N = 72°. Which statement is true?
      options:
        - "RS = 9 and ∠R = 72°"
        - "QR = 9 and ∠Q = 72°"
        - "QS = 7 and ∠S = 72°"
        - "RS = 11 and ∠R = 72°"
      option_explanations:
        - |
          Correct. N ↔ R and P ↔ S, so RS = NP = 9 and ∠R = ∠N = 72°.
        - |
          QR corresponds to MN = 7, and ∠Q corresponds to ∠M, which is not given.
        - |
          QS corresponds to MP = 11, and ∠S corresponds to ∠P.
        - |
          RS corresponds to NP = 9, not to PM = 11.
      answer: 0

    - slug: geo-u02-w07-q06
      type: multiple_choice
      topic_code: "2.2"
      source: "IM Geometry, Unit 2, Lesson 2"
      points: 1
      prompt: |
        Two quadrilaterals each have sides 6, 6, 6, 6. One is a square and the other has angles of 50° and 130°. Which statement is correct?
      options:
        - "They are not congruent, because rigid motions preserve angle measure and 90° ≠ 50°"
        - "They are congruent, because all four pairs of corresponding sides are congruent"
        - "They are congruent, because both are rhombuses"
        - "They are not congruent, because a square is not a rhombus"
      option_explanations:
        - |
          Correct. Any rigid motion carrying one onto the other would have to send a 90° angle to a 50° angle, which is impossible.
        - |
          Four congruent sides do not force congruence for quadrilaterals; a rhombus can flex.
        - |
          Being rhombuses makes them the same type, not congruent copies.
        - |
          A square is a rhombus (four congruent sides); the reason they are not congruent is the angles.
      answer: 0

    - slug: geo-u02-w07-q07
      type: multiple_choice
      topic_code: "2.2"
      source: "IM Geometry, Unit 2, Lesson 2"
      points: 1
      prompt: |
        Why do triangles have short congruence criteria (such as three sides) while quadrilaterals do not?
      options:
        - "A triangle with fixed side lengths cannot flex, but a quadrilateral with fixed side lengths can"
        - "Triangles have fewer angles to measure"
        - "Quadrilaterals are never congruent to each other"
        - "Triangles always have a line of symmetry"
      option_explanations:
        - |
          Correct. Three pinned rods form a rigid figure; four pinned rods form a linkage that can change shape without changing lengths.
        - |
          Fewer angles is true but is not the reason; the reason is rigidity.
        - |
          Quadrilaterals can certainly be congruent; they just need more information to prove it.
        - |
          Most triangles (scalene ones) have no line of symmetry.
      answer: 0

    - slug: geo-u02-w07-q08
      type: multiple_choice
      topic_code: "2.4"
      source: "IM Geometry, Unit 2, Lesson 4"
      points: 1
      prompt: |
        In a rigid-motion proof, after A has been moved to D and B to E, the image C″ of C is on the same side of line DE as F, with ∠EDC″ = ∠EDF and DC″ = DF. Which reasoning shows C″ = F?
      options:
        - "Rays from D on the same side of DE making equal angles with DE coincide, so C″ is on ray DF; and DC″ = DF places it at F"
        - "Equal angles always mean equal triangles"
        - "C″ must be F because there is nowhere else for it to go"
        - "A reflection across DE sends C″ to F"
      option_explanations:
        - |
          Correct. The equal angle identifies the ray, and the equal distance identifies the point on it.
        - |
          Equal angles alone do not give congruent triangles (think of two triangles of different sizes with the same angles).
        - |
          "Nowhere else to go" is not a justification; the proof must say why.
        - |
          A reflection is needed only when C″ is on the opposite side of DE from F; here it is on the same side.
      answer: 0

    - slug: geo-u02-w07-q09
      type: multiple_choice
      topic_code: "2.3"
      source: "IM Geometry, Unit 2, Lesson 3"
      points: 1
      prompt: |
        A student's proof reads: "Translate so A lands on D. Rotate about D so B lands on E. Then C lands on F since the two triangles are congruent." What is wrong?
      options:
        - "The last step assumes the conclusion; it needs a reason such as equal angles at D or the perpendicular-bisector argument"
        - "The rotation should come before the translation"
        - "A rotation cannot send B to E"
        - "Nothing; the proof is complete"
      option_explanations:
        - |
          Correct. Citing the triangles' congruence while proving it is circular; the landing of C must be justified from the given congruent parts.
        - |
          The order translate-then-rotate is standard and fine.
        - |
          A rotation about D sends B's image to E whenever DB₁ = DE, which the given side congruence provides.
        - |
          The proof is not complete: its final step has no valid justification.
      answer: 0

    - slug: geo-u02-w07-q10
      type: multiple_choice
      topic_code: "1.11"
      source: "IM Geometry, Unit 2, Lesson 4"
      points: 1
      prompt: |
        In the final reflection across line DE of a rigid-motion proof, why do the already-matched vertices stay in place?
      options:
        - "D and E lie on the line of reflection, and every point on the mirror is fixed"
        - "Reflections never move vertices"
        - "D and E are equidistant from the mirror"
        - "The reflection is applied only to the third vertex"
      option_explanations:
        - |
          Correct. The mirror is the line through D and E, and the definition of a reflection fixes every point of the mirror.
        - |
          Reflections move every point that is not on the mirror.
        - |
          D and E are at distance zero from the mirror because they are on it; "equidistant" is not the reason.
        - |
          A transformation acts on the whole plane; it fixes D and E because they are on the line, not because it is applied selectively.
      answer: 0

    - slug: geo-u02-w07-q11
      type: multiple_choice
      topic_code: "1.17"
      source: "IM Geometry, Unit 1, Lesson 17"
      points: 1
      prompt: |
        Review. Which statement is the definition of congruent figures used in this course?
      options:
        - "There is a sequence of rigid transformations carrying one figure onto the other"
        - "All corresponding sides are congruent"
        - "The figures have the same area and perimeter"
        - "The figures have the same shape"
      option_explanations:
        - |
          Correct. Congruence is defined by rigid motions; congruent corresponding parts is a consequence.
        - |
          For quadrilaterals this is not enough, and for any figure it is a consequence rather than the definition.
        - |
          A 3-by-3 square and a rectangle with the same area and perimeter would need checking; equal measurements are not the definition.
        - |
          "Same shape" describes similarity (Unit 3), which allows different sizes.
      answer: 0

    - slug: geo-u02-w07-q12
      type: multiple_choice
      topic_code: "1.3"
      source: "IM Geometry, Unit 1, Lesson 3"
      points: 1
      prompt: |
        Review. Points D and E each satisfy DC₂ = DF and EC₂ = EF for two points C₂ and F. What can be concluded about line DE?
      options:
        - "It is the perpendicular bisector of segment C₂F"
        - "It is parallel to segment C₂F"
        - "It passes through C₂ and F"
        - "It is the angle bisector of ∠C₂DF only"
      option_explanations:
        - |
          Correct. Each of D and E is equidistant from C₂ and F, so each lies on the perpendicular bisector of C₂F; two points determine the line.
        - |
          The perpendicular bisector is perpendicular to C₂F, not parallel.
        - |
          D and E are equidistant from C₂ and F, which generally puts them off the segment, on its bisector.
        - |
          Line DE does bisect ∠C₂DF, but the stronger conclusion is that it is the perpendicular bisector of C₂F.
      answer: 0

    - slug: geo-u02-w07-q13
      type: multiple_choice
      topic_code: "1.21"
      source: "IM Geometry, Unit 1, Lesson 21"
      points: 1
      prompt: |
        Review. △ABC ≅ △DEF with ∠A = 52° and ∠E = 47°. What is ∠F?
      options:
        - "81°"
        - "99°"
        - "47°"
        - "52°"
      option_explanations:
        - |
          Correct. ∠D = ∠A = 52°, ∠E = 47°, so ∠F = 180 − 52 − 47 = 81° by the triangle angle sum.
        - |
          99° is 52 + 47, the sum of the other two angles, not the third angle.
        - |
          47° is the measure of ∠E and its partner ∠B, not of ∠F.
        - |
          52° is the measure of ∠A and its partner ∠D, not of ∠F.
      answer: 0

    - slug: geo-u02-w07-q14
      type: multi_select
      topic_code: "2.1"
      source: "IM Geometry, Unit 2, Lesson 1"
      points: 2
      partial_credit: true
      prompt: |
        △GHI ≅ △KLM. Which statements must be true? Select all that apply.
      options:
        - "HI = LM"
        - "∠G = ∠K"
        - "GI = KL"
        - "△IHG ≅ △MLK"
        - "∠H = ∠M"
      option_explanations:
        - |
          True: H ↔ L and I ↔ M, so side HI corresponds to side LM.
        - |
          True: G and K are the first letters of each triangle, so they correspond.
        - |
          False: G ↔ K and I ↔ M, so GI corresponds to KM, not to KL.
        - |
          True: reversing both triangles' letters preserves the pairing I ↔ M, H ↔ L, G ↔ K.
        - |
          False: H is the second letter and corresponds to L, so ∠H ↔ ∠L, not ∠M.
      answer: [0, 1, 3]

    - slug: geo-u02-w07-q15
      type: multi_select
      topic_code: "2.4"
      source: "IM Geometry, Unit 2, Lesson 4"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following are valid reasons that can appear in a rigid-motion proof of triangle congruence? Select all that apply.
      options:
        - "Rigid motions preserve distance"
        - "The only point on ray DE at distance DE from D is E"
        - "Points on the line of reflection are fixed"
        - "The triangles look the same size"
        - "Two points equidistant from the endpoints of a segment lie on its perpendicular bisector"
      option_explanations:
        - |
          Yes: this is the defining property and is used whenever a length is carried over.
        - |
          Yes: it converts "on the ray" into "at the vertex".
        - |
          Yes: it keeps the matched vertices in place during the final reflection.
        - |
          No: appearance is evidence, not a justification.
        - |
          Yes: it identifies line DE as the mirror in the final step.
      answer: [0, 1, 2, 4]

    - slug: geo-u02-w07-q16
      type: true_false
      topic_code: "2.2"
      source: "IM Geometry, Unit 2, Lesson 2"
      points: 1
      prompt: |
        True or false: if two quadrilaterals have all four pairs of corresponding sides congruent and one pair of corresponding angles congruent, they must be congruent.
      answer: false
      explanation: |
        False. The known angle fixes one diagonal and the triangle on one side of it, but the fourth vertex can lie on either side of that diagonal at the required distances, giving a convex and a non-convex quadrilateral with identical data.

    - slug: geo-u02-w07-q17
      type: true_false
      topic_code: "1.11"
      source: "IM Geometry, Unit 1, Lesson 11"
      points: 1
      prompt: |
        Review. True or false: if line m is the perpendicular bisector of segment PQ, then reflecting across m sends P to Q.
      answer: true
      explanation: |
        True. The reflection of P across m is by definition the point P′ such that m is the perpendicular bisector of PP′; since m is the perpendicular bisector of PQ, that point is Q.

    - slug: geo-u02-w07-q18
      type: fill_blank
      topic_code: "2.1"
      source: "IM Geometry, Unit 2, Lesson 1"
      points: 1
      prompt: |
        In △ABC, the angle between sides AB and BC is ∠B; it is called the ____ angle of those two sides.
      answer: ["included"]
      explanation: |
        The included angle is the one formed by the two named sides. The SAS criterion requires the congruent angle to be included between the two congruent sides.

    - slug: geo-u02-w07-q19
      type: fill_blank
      topic_code: "2.1"
