      answer: |
        (a) A square with sides 4, 4, 4, 4 and all angles 90°; and a rhombus with sides 4, 4, 4, 4 and angles 60°, 120°, 60°, 120°. (Any rectangle and a non-rectangular parallelogram with the same sides also work.) (b) Rigid transformations preserve angle measure. A rigid motion carrying the square onto the rhombus would have to send a 90° angle to a 60° angle, which cannot happen. (c) A triangle with three fixed side lengths cannot change shape (three pinned rods form a rigid frame), so two triangles with the same three sides are forced into the same shape and a rigid motion carries one onto the other. A quadrilateral's four pinned rods form a linkage that can flex, so equal sides leave the shape undetermined.
