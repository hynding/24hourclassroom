    - slug: geo-u02-w07-q25
      type: long_answer
      topic_code: "2.4"
      source: "IM Geometry, Unit 2, Lesson 4"
      points: 6
      prompt: |
        Triangle ABC has A = (0, 0), B = (6, 0), C = (2, 3). Triangle DEF has D = (4, −1), E = (4, −7), F = (1, −3). Write a complete rigid-motion proof that △ABC ≅ △DEF. Begin by verifying with the distance formula that the three pairs of corresponding sides are congruent. Then give each transformation precisely, compute the image of every vertex after each step, and justify why B lands on E and why C lands on F (using one of the two accepted arguments). End with the congruence statement.
      answer: |
        Side check. AB = 6; DE = |−7 − (−1)| = 6. AC = √(4 + 9) = √13; DF = √((4 − 1)² + (−1 + 3)²) = √(9 + 4) = √13. BC = √(16 + 9) = 5; EF = √((4 − 1)² + (−7 + 3)²) = √(9 + 16) = 5. All three pairs are congruent.

        Step 1: translate by the arrow D − A = (4, −1). A → (4, −1) = D, B → (10, −1), C → (6, 2). A translation is a rigid motion.

        Step 2: rotate about D so that the image of B lands on ray DE. B₁ = (10, −1) is 6 units to the right of D; E = (4, −7) is 6 units below D. A 90° clockwise rotation about D does this: subtract D, apply (x, y) → (y, −x), add D. B₁: (6, 0) → (0, −6) → (4, −7) = E. Justification: rigid motions preserve length, so DB₂ = AB = 6 = DE, and the only point on ray DE at distance 6 from D is E. C₁ = (6, 2): (2, 3) → (3, −2) → (7, −3) = C₂.

        Step 3: compare C₂ = (7, −3) with F = (1, −3). They are on opposite sides of line DE (the vertical line x = 4). DC₂ = √(9 + 4) = √13 = DF and EC₂ = √(9 + 16) = 5 = EF, so D and E are each equidistant from C₂ and F. Both therefore lie on the perpendicular bisector of C₂F, and since two points determine a line, line DE is that perpendicular bisector. (Check: the midpoint of C₂F is (4, −3), on x = 4, and C₂F is horizontal.) By the definition of reflection, reflecting across line DE sends C₂ to F, while D and E, on the mirror, stay fixed.

        Conclusion: the sequence "translate by (4, −1), rotate 90° clockwise about D, reflect across line DE" is a sequence of rigid motions sending A → D, B → E, C → F. Therefore △ABC ≅ △DEF.
      explanation: |
        Scoring (6 points): 1 for verifying all three side pairs; 1 for the translation with all images; 1 for the rotation (90° clockwise about D) with the images of B and C; 1 for the justification that B lands on E (length preserved, unique point on the ray); 1 for the perpendicular-bisector (or equal-angle) argument that the reflection sends C₂ to F, with D and E fixed; 1 for the correctly ordered congruence statement. Deduct 1 for any circular reasoning.
