      prompt: |
        Figure description: quadrilateral ABCD in which the diagonals AC and BD cross at M, with AM = CM and BM = DM. Answer (a), (b) and (c).

        (a) Prove △AMB ≅ △CMD, naming the criterion.
        (b) Use CPCTC to show AB ∥ CD and AB = CD.
        (c) Explain which converse now shows ABCD is a parallelogram.
      answer: |
        (a) AM ≅ CM (given), ∠AMB ≅ ∠CMD (vertical angles), BM ≅ DM (given). △AMB ≅ △CMD by SAS. (b) By CPCTC, AB ≅ CD, and ∠BAM ≅ ∠DCM. These are alternate interior angles for transversal AC with lines AB and CD, so AB ∥ CD by the converse of the alternate interior angle theorem. (c) AB and CD are one pair of opposite sides that are both parallel and congruent, so by Converse B (one pair of opposite sides parallel and congruent) ABCD is a parallelogram.
