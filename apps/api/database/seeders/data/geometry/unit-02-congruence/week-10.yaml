        1 point for (a): SAS with vertical angles. 1 point for (b): both the congruence and the parallel conclusion with the converse theorem. 1 point for (c): naming the "parallel and congruent pair" converse.

    - slug: geo-u02-w10-q24
      type: short_answer
      topic_code: "2.15"
      source: "IM Geometry, Unit 2, Lesson 15"
      points: 3
      prompt: |
        Answer (a), (b) and (c).

        (a) Explain why four side lengths alone do not determine a quadrilateral, with a specific example.
        (b) Explain why four side lengths plus one diagonal do determine a convex quadrilateral.
        (c) A classmate claims that four side lengths plus one angle always determine a quadrilateral. Describe the two figures that show this is false.
      answer: |
        (a) A square with side 5 and a rhombus with side 5 and a 60° angle have the same four side lengths but different angles, so no rigid motion carries one onto the other; the four-rod linkage can flex. (b) The diagonal cuts the quadrilateral into two triangles. Each triangle has three known sides, so each is determined by SSS, and the two are glued along the diagonal on opposite sides (convexity). Any two quadrilaterals with that data are made of congruent triangles in the same arrangement, hence congruent. (c) Fix sides AB, BC, CD, DA and the angle at A. Triangle ABD is determined by SAS, fixing diagonal BD. The vertex C must be at distance BC from B and CD from D, so it lies at one of the two intersection points of two circles, one on each side of line BD. One choice gives a convex quadrilateral and the other a non-convex (dented) one, with identical sides and the same angle at A.
      explanation: |
        1 point for (a): a concrete example and the angle-preservation reason. 1 point for (b): two SSS triangles glued along the diagonal. 1 point for (c): the two positions of the fourth vertex across the fixed diagonal.

    - slug: geo-u02-w10-q25
      type: long_answer
      topic_code: "2.13"
      source: "IM Geometry, Unit 2, Lesson 13"
      points: 6
      prompt: |
        Parallelogram ABCD has AB ∥ DC and AD ∥ BC. Write a complete two-column proof that (1) AB ≅ CD and AD ≅ CB, and (2) the diagonals AC and BD bisect each other at their crossing point M. For each statement give its reason. You may use the result of part (1) in part (2).
      answer: |
        Part (1). Draw diagonal BD.
        1. AB ∥ DC — given.
        2. ∠ABD ≅ ∠CDB — alternate interior angles (AB ∥ DC, transversal BD).
        3. AD ∥ BC — given.
        4. ∠ADB ≅ ∠CBD — alternate interior angles (AD ∥ BC, transversal BD).
        5. BD ≅ DB — reflexive property.
        6. △ABD ≅ △CDB — ASA (steps 2, 5, 4; BD is the included side).
        7. AB ≅ CD and AD ≅ CB — CPCTC.

        Part (2). Let the diagonals AC and BD meet at M.
        8. ∠BAM ≅ ∠DCM — alternate interior angles (AB ∥ DC, transversal AC).
        9. ∠ABM ≅ ∠CDM — alternate interior angles (AB ∥ DC, transversal BD; these are the same angles as ∠ABD and ∠CDB in step 2).
        10. AB ≅ CD — part (1), step 7.
        11. △ABM ≅ △CDM — ASA (steps 8, 10, 9; AB and CD are the included sides).
        12. AM ≅ CM and BM ≅ DM — CPCTC.
        13. M is the midpoint of AC and of BD — definition of midpoint; therefore the diagonals bisect each other. ∎
      explanation: |
        Scoring (6 points): 1 for the auxiliary diagonal and both alternate interior angle pairs with the correct parallels and transversal; 1 for the reflexive side and ASA in part (1); 1 for CPCTC giving both pairs of opposite sides; 1 for the two alternate interior angle pairs at M with AC and BD as transversals; 1 for ASA using AB ≅ CD as the included side; 1 for CPCTC and the midpoint conclusion. Deduct 1 for using "diagonals bisect each other" or "opposite sides congruent" as a reason before it is proved.
