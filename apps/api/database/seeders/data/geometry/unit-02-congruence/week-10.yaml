week: 10
unit: 2
title: "Parallelograms, Bisectors and What Determines a Quadrilateral"
topics: ["2.13", "2.14", "2.15"]
guide: guides/week-10.md
guide_description: |
  The parallelogram theorems (opposite sides and angles congruent, diagonals bisect each other) proved with ASA
  and alternate interior angles, and the three converses that prove a quadrilateral is a parallelogram, with the
  isosceles trapezoid as the warning counterexample. The isosceles triangle theorem both ways, the angle
  bisector as the set of points equidistant from the sides, and the week-2 constructions justified. Finally,
  which sets of measurements determine a quadrilateral up to congruence.
flashcards_description: |
  28 cards on the parallelogram theorems and converses, consecutive angles, the isosceles triangle theorem and
  its converse, the angle bisector theorem, justified constructions, and what determines a quadrilateral.

flashcards:
  - front: Parallelogram → definition
    back: |
      A quadrilateral with both pairs of opposite sides parallel. Every property beyond this (congruent opposite sides, bisecting diagonals) is a theorem to be proved from the definition.
    topic_code: "2.13"
  - front: Opposite sides of a parallelogram are congruent → proof
    back: |
      Draw diagonal BD. ∠ABD ≅ ∠CDB and ∠ADB ≅ ∠CBD (alternate interior angles from the two pairs of parallels), BD ≅ DB. △ABD ≅ △CDB by ASA; CPCTC gives AB ≅ CD and AD ≅ CB.
    topic_code: "2.13"
  - front: Opposite angles of a parallelogram are congruent → proof
    back: |
      From △ABD ≅ △CDB (ASA with diagonal BD), ∠A ≅ ∠C by CPCTC. The other diagonal gives ∠B ≅ ∠D.
    topic_code: "2.13"
  - front: Consecutive angles of a parallelogram → relationship and reason
    back: |
      Supplementary. ∠A and ∠B are co-interior angles for the parallel sides AD and BC with transversal AB, so they sum to 180°.
    topic_code: "2.13"
  - front: Diagonals of a parallelogram bisect each other → proof
    back: |
      Let AC and BD meet at M. ∠BAM ≅ ∠DCM and ∠ABM ≅ ∠CDM (alternate interior), AB ≅ CD (opposite sides). △ABM ≅ △CDM by ASA; CPCTC gives AM ≅ CM and BM ≅ DM.
    topic_code: "2.13"
  - front: Converse A → both pairs of opposite sides congruent implies parallelogram
    back: |
      Diagonal AC gives △ABC ≅ △CDA by SSS. CPCTC yields two pairs of congruent alternate interior angles, so AB ∥ CD and BC ∥ AD.
    topic_code: "2.13"
  - front: Converse B → one pair of opposite sides parallel and congruent implies parallelogram
    back: |
      AB ∥ DC and AB = DC; diagonal AC. ∠BAC ≅ ∠DCA (alternate interior), AB ≅ CD, AC shared: SAS. CPCTC gives ∠BCA ≅ ∠DAC, so BC ∥ AD.
    topic_code: "2.13"
  - front: Converse C → diagonals bisecting each other implies parallelogram
    back: |
      △AMB ≅ △CMD by SAS (halves of the diagonals and vertical angles). CPCTC: AB ≅ CD and ∠BAM ≅ ∠DCM, so AB ∥ CD. One pair parallel and congruent (Converse B) finishes.
    topic_code: "2.13"
  - front: Error-spot → "one pair of sides parallel and the other pair congruent"
    back: |
      Not a converse: an isosceles trapezoid has one pair of parallel sides and congruent legs but is not a parallelogram. The parallel pair and the congruent pair must be the same pair.
    topic_code: "2.13"
  - front: Solving a parallelogram with ∠A = (3x + 10)° and ∠C = (5x − 30)° → method
    back: |
      Opposite angles are congruent: 3x + 10 = 5x − 30 gives x = 20, ∠A = ∠C = 70°. Consecutive angles are supplementary, so ∠B = ∠D = 110°.
    topic_code: "2.13"
  - front: Diagonals of a parallelogram → what they are NOT in general
    back: |
      Not congruent (that needs a rectangle) and not perpendicular (that needs a rhombus). They only bisect each other. A square has both extra properties.
    topic_code: "2.13"
  - front: Rhombus is a parallelogram → shortest proof
    back: |
      All four sides are congruent, so both pairs of opposite sides are congruent; Converse A applies.
    topic_code: "2.13"
  - front: Isosceles triangle theorem → statement
    back: |
      If two sides of a triangle are congruent, the angles opposite those sides are congruent. In △ABC with AB = AC, ∠B = ∠C.
    topic_code: "2.14"
  - front: Isosceles triangle theorem → proof by self-congruence
    back: |
      △ABC ≅ △ACB by SAS: AB ≅ AC, ∠A ≅ ∠A (reflexive), AC ≅ AB. CPCTC gives ∠B ≅ ∠C. Alternatively, SSS with the midpoint of the base.
    topic_code: "2.14"
  - front: Converse of the isosceles triangle theorem → statement and proof
    back: |
      If two angles of a triangle are congruent, the sides opposite them are congruent. If ∠B ≅ ∠C, then △ABC ≅ △ACB by ASA (∠B ≅ ∠C, BC ≅ CB, ∠C ≅ ∠B), so AB ≅ AC by CPCTC.
    topic_code: "2.14"
  - front: Special segments of an isosceles triangle from the apex → which coincide
    back: |
      The median to the base, the bisector of the apex angle, the altitude to the base and the perpendicular bisector of the base are all the same segment. Proof: △ABM ≅ △ACM by SSS with M the midpoint.
    topic_code: "2.14"
  - front: Height of an isosceles triangle with legs 13 and base 10 → computation
    back: |
      The altitude meets the base at its midpoint, 5 from each end. Height = √(13² − 5²) = 12, area = ½ × 10 × 12 = 60.
    topic_code: "2.14"
  - front: Angle bisector theorem (distance form) → statement
    back: |
      A point on the bisector of an angle is equidistant from the two sides, measuring distance perpendicularly. Conversely, a point inside the angle equidistant from the sides lies on the bisector.
    topic_code: "2.14"
  - front: Angle bisector theorem → proof
    back: |
      Drop perpendiculars from P to the sides at X and Y. ∠XVP ≅ ∠YVP (bisector), ∠VXP ≅ ∠VYP (right angles), VP shared. △VXP ≅ △VYP by AAS, so PX ≅ PY. Converse by HL.
    topic_code: "2.14"
  - front: Angle bisector versus perpendicular bisector → the parallel descriptions
    back: |
      The perpendicular bisector of AB is the set of points equidistant from the two points A and B. The angle bisector is the set of points equidistant from the two sides (lines) of the angle.
    topic_code: "2.14"
  - front: Week-2 angle bisector construction → now justified how
    back: |
      VX = VY (circle at V), XZ = YZ (equal circles at X and Y), VZ shared. △VXZ ≅ △VYZ by SSS, so ∠XVZ ≅ ∠YVZ by CPCTC.
    topic_code: "2.14"
  - front: Distance from a point to a line → how it is measured
    back: |
      Along the perpendicular from the point to the line. Any slanted segment is longer. The angle bisector theorem and all "equidistant from a line" statements use this distance.
    topic_code: "2.14"
  - front: Four sides and one diagonal of a convex quadrilateral → determined?
    back: |
      Yes. The diagonal splits it into two triangles, each fixed by SSS, glued along the diagonal on opposite sides. Four sides and one angle, by contrast, are not enough.
    topic_code: "2.15"
  - front: Three sides and the two included angles (S-A-S-A-S) → determined?
    back: |
      Yes. The three sides with their two turning angles form a zigzag, which is determined by segment and angle congruence; the fourth side simply joins the ends.
    topic_code: "2.15"
  - front: Parallelogram → what determines it up to congruence
    back: |
      Two adjacent sides and the included angle. The theorems then fix the other sides and angles. Sides 4 and 7 with a 60° angle is one parallelogram; sides 4, 7, 4, 7 alone is a family.
    topic_code: "2.15"
  - front: Rectangle and rhombus → how many measurements determine each
    back: |
      A rectangle: two (its side lengths), since the angles are 90°. A rhombus: two (side and one angle, or the two diagonals).
    topic_code: "2.15"
  - front: Strategy for "is this quadrilateral determined?" → method
    back: |
      Try to cut it into triangles each fixed by a criterion (SSS, SAS, ASA) using the given data. If a vertex can be placed in two positions (flip across a diagonal, or slide while keeping lengths), the data is not enough; exhibit the two figures.
    topic_code: "2.15"
  - front: Which converse when → "I know the diagonals cross at their midpoints"
    back: |
      Converse C: diagonals that bisect each other make a parallelogram (SAS with vertical angles, then one pair parallel and congruent).
    topic_code: "2.13"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 2.13 to 2.15: parallelogram theorems and
    converses, isosceles triangles, angle bisectors, and what determines a quadrilateral) with review of weeks
    7 to 9 and Unit 1 (congruence criteria, kites, perpendicular bisectors and parallel lines). Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: parallelogram with algebra (2.13)
    - slug: geo-u02-w10-q01
      type: multiple_choice
      topic_code: "2.13"
      source: "IM Geometry, Unit 2, Lesson 13"
      points: 1
      stimulus: |
        Figure description: parallelogram ABCD with AB ∥ DC and AD ∥ BC. The diagonals AC and BD meet at M. AB = 3x + 2, DC = 5x − 8, AM = 2y + 1, MC = 3y − 4, and ∠DAB = 68°.
      prompt: |
        What is the value of x, and which theorem justifies the equation you solve?
      options:
        - "x = 5, because opposite sides of a parallelogram are congruent"
        - "x = 5, because the diagonals of a parallelogram are congruent"
        - "x = 3, because consecutive sides of a parallelogram are congruent"
        - "x = 1, because AB + DC = 180"
      option_explanations:
        - |
          Correct. AB = DC gives 3x + 2 = 5x − 8, so 2x = 10 and x = 5 (AB = DC = 17).
        - |
          The value is right but the reason is wrong: the diagonals of a parallelogram are not congruent in general, and AB and DC are sides.
        - |
          Consecutive sides are not congruent in a general parallelogram; that would be a rhombus.
        - |
          Side lengths do not sum to 180; that relation is for consecutive angles.
      answer: 0

    - slug: geo-u02-w10-q02
      type: multiple_choice
      topic_code: "2.13"
      source: "IM Geometry, Unit 2, Lesson 13"
      points: 1
      stimulus: |
        Figure description: parallelogram ABCD with AB ∥ DC and AD ∥ BC. The diagonals AC and BD meet at M. AB = 3x + 2, DC = 5x − 8, AM = 2y + 1, MC = 3y − 4, and ∠DAB = 68°.
      prompt: |
        What is the length of diagonal AC?
      options:
        - "22"
        - "11"
        - "17"
        - "34"
      option_explanations:
        - |
          Correct. The diagonals bisect each other, so AM = MC: 2y + 1 = 3y − 4 gives y = 5, AM = MC = 11, and AC = 22.
        - |
          11 is AM (or MC), only half of the full diagonal AC.
        - |
          17 is the length of sides AB and DC, not the diagonal.
        - |
          34 is twice a side, which has no meaning here.
      answer: 0

    - slug: geo-u02-w10-q03
      type: multiple_choice
      topic_code: "2.13"
      source: "IM Geometry, Unit 2, Lesson 13"
      points: 1
      stimulus: |
        Figure description: parallelogram ABCD with AB ∥ DC and AD ∥ BC. The diagonals AC and BD meet at M. AB = 3x + 2, DC = 5x − 8, AM = 2y + 1, MC = 3y − 4, and ∠DAB = 68°.
      prompt: |
        What are ∠ABC and ∠BCD?
      options:
        - "∠ABC = 112° and ∠BCD = 68°"
        - "∠ABC = 68° and ∠BCD = 112°"
        - "∠ABC = 112° and ∠BCD = 112°"
        - "∠ABC = 22° and ∠BCD = 68°"
      option_explanations:
        - |
          Correct. ∠ABC is consecutive to ∠DAB, so it is 180 − 68 = 112°; ∠BCD is opposite ∠DAB, so it is 68°.
        - |
          These are swapped: the angle at B is adjacent to A (supplementary), and the angle at C is opposite A (congruent).
        - |
          ∠BCD is opposite ∠DAB and therefore equals 68°, not 112°.
        - |
          22° would be the complement of 68°; consecutive angles of a parallelogram are supplementary, not complementary.
      answer: 0

    - slug: geo-u02-w10-q04
      type: multiple_choice
      topic_code: "2.13"
      source: "IM Geometry, Unit 2, Lesson 13"
      points: 1
      prompt: |
        Which condition does NOT guarantee that quadrilateral PQRS is a parallelogram?
      options:
        - "PQ ∥ SR and PS = QR"
        - "PQ ∥ SR and PQ = SR"
        - "PQ = SR and PS = QR"
        - "The diagonals PR and QS bisect each other"
      option_explanations:
        - |
          Correct. One pair parallel and the other pair congruent describes an isosceles trapezoid as well, which is not a parallelogram.
        - |
          One pair of opposite sides both parallel and congruent is Converse B, which does guarantee a parallelogram.
        - |
          Both pairs of opposite sides congruent is Converse A.
        - |
          Diagonals bisecting each other is Converse C.
      answer: 0

    - slug: geo-u02-w10-q05
      type: multiple_choice
      topic_code: "2.13"
      source: "IM Geometry, Unit 2, Lesson 13"
      points: 1
      prompt: |
        In the proof that the diagonals of parallelogram ABCD bisect each other (meeting at M), which criterion proves △ABM ≅ △CDM?
      options:
        - "ASA, using two pairs of alternate interior angles and the congruent opposite sides AB and CD"
        - "SAS, using AM ≅ CM and BM ≅ DM with the vertical angles"
        - "SSS, using all three sides"
        - "HL, since the diagonals are perpendicular"
      option_explanations:
        - |
          Correct. ∠BAM ≅ ∠DCM and ∠ABM ≅ ∠CDM come from the parallel sides, and AB ≅ CD from the earlier theorem; the side is included.
        - |
          AM ≅ CM and BM ≅ DM are the conclusion of the theorem, so they cannot be used as inputs.
        - |
          Only one pair of sides (AB and CD) is known to be congruent at this stage.
        - |
          The diagonals of a general parallelogram are not perpendicular, and there is no right angle.
      answer: 0

    - slug: geo-u02-w10-q06
      type: multiple_choice
      topic_code: "2.14"
      source: "IM Geometry, Unit 2, Lesson 14"
      points: 1
      prompt: |
        In △ABC, AB = AC and ∠A = 38°. What is ∠B?
      options:
        - "71°"
        - "38°"
        - "142°"
        - "52°"
      option_explanations:
        - |
          Correct. By the isosceles triangle theorem ∠B = ∠C, and 38 + 2∠B = 180 gives ∠B = 71°.
        - |
          38° is the apex angle; the base angles are the two equal ones at B and C.
        - |
          142° is the sum of the two base angles, not one of them.
        - |
          52° would be 90 − 38, which assumes a right angle that is not present.
      answer: 0

    - slug: geo-u02-w10-q07
      type: multiple_choice
      topic_code: "2.7"
      source: "IM Geometry, Unit 2, Lesson 14"
      points: 1
      prompt: |
        Which criterion proves the converse of the isosceles triangle theorem (if ∠B ≅ ∠C in △ABC, then AB ≅ AC) using the triangle's congruence with itself, △ABC ≅ △ACB?
      options:
        - "ASA: ∠B ≅ ∠C, BC ≅ CB, ∠C ≅ ∠B"
        - "SAS: AB ≅ AC, ∠A ≅ ∠A, AC ≅ AB"
        - "SSS: AB ≅ AC, BC ≅ CB, CA ≅ BA"
        - "AAA: all three angles match"
      option_explanations:
        - |
          Correct. The two base angles with the included base side BC give ASA; CPCTC then yields AB ≅ AC.
        - |
          That is the proof of the forward theorem; here AB ≅ AC is the conclusion and cannot be assumed.
        - |
          AB ≅ AC is the conclusion being proved, so it cannot be a premise.
        - |
          AAA is not a congruence criterion; equal angles allow different sizes.
      answer: 0

    - slug: geo-u02-w10-q08
      type: multiple_choice
      topic_code: "2.7"
      source: "IM Geometry, Unit 2, Lesson 14"
      points: 1
      prompt: |
        Point P lies on the bisector of ∠AVB. Perpendiculars from P meet VA at X and VB at Y. Which criterion proves △VXP ≅ △VYP, and what follows?
      options:
        - "AAS (∠XVP ≅ ∠YVP, right angles at X and Y, VP shared), so PX = PY"
        - "SAS (VX ≅ VY, ∠V shared, VP shared), so PX = PY"
        - "SSS, so ∠X = ∠Y"
        - "HL, so VX = VY, but PX and PY remain unknown"
      option_explanations:
        - |
          Correct. Two angles and the non-included shared side give AAS; CPCTC gives the equal perpendicular distances.
        - |
          VX ≅ VY is not given; it is a consequence.
        - |
          Neither PX ≅ PY nor VX ≅ VY is known in advance.
        - |
          HL needs PX ≅ PY as the known leg; that is the converse direction. And the congruence does give PX = PY by CPCTC.
      answer: 0

    - slug: geo-u02-w10-q09
      type: multiple_choice
      topic_code: "2.15"
      source: "IM Geometry, Unit 2, Lesson 15"
      points: 1
      prompt: |
        Which set of measurements determines a convex quadrilateral up to congruence?
      options:
        - "The four side lengths and the length of one diagonal"
        - "The four side lengths"
        - "The four angle measures"
        - "Two side lengths and two angle measures"
      option_explanations:
        - |
          Correct. The diagonal cuts the figure into two triangles each fixed by SSS, glued on opposite sides of the diagonal.
        - |
          Four sides can flex (a square and a rhombus with the same sides).
        - |
          Four angles allow scaling and more; a square and any rectangle share the angles.
        - |
          Far too little; many quadrilaterals share two sides and two angles.
      answer: 0

    - slug: geo-u02-w10-q10
      type: multiple_choice
      topic_code: "2.15"
      source: "IM Geometry, Unit 2, Lesson 15"
      points: 1
      prompt: |
        How many measurements are needed to determine a parallelogram up to congruence, and which?
      options:
        - "Three: two adjacent sides and the included angle"
        - "Four: all four sides"
        - "Two: the two diagonals"
        - "One: a single side, since all parallelograms with that side are congruent"
      option_explanations:
        - |
          Correct. The theorems then fix the opposite sides (congruent) and all angles (congruent opposite, supplementary consecutive).
        - |
          Four sides leave the angles free; the parallelogram can still lean.
        - |
          Two diagonals bisecting each other can cross at any angle, giving different parallelograms.
        - |
          A single side leaves the other side and the angle free.
      answer: 0

    - slug: geo-u02-w10-q11
      type: multiple_choice
      topic_code: "2.12"
      source: "IM Geometry, Unit 2, Lesson 12"
      points: 1
      prompt: |
        Review. A rhombus has side 10 and one diagonal of length 12. What is the other diagonal?
      options:
        - "16"
        - "8"
        - "14"
        - "20"
      option_explanations:
        - |
          Correct. The diagonals are perpendicular bisectors of each other: half of 12 is 6, and the other half-diagonal is √(100 − 36) = 8, so the diagonal is 16.
        - |
          8 is only half of the other diagonal; the full diagonal is twice that.
        - |
          14 comes from assuming the diagonals are equal plus something; there is no such relationship.
        - |
          20 would be twice the side, which is not a diagonal length here.
      answer: 0

    - slug: geo-u02-w10-q12
      type: multiple_choice
      topic_code: "2.9"
      source: "IM Geometry, Unit 2, Lesson 9"
      points: 1
      prompt: |
        Review. In the proof that AB ∥ CD when both pairs of opposite sides of ABCD are congruent, which criterion and which auxiliary segment are used?
      options:
        - "SSS, with diagonal AC drawn"
        - "ASA, with diagonal AC drawn"
        - "SAS, with the midpoint of AB"
        - "HL, with a perpendicular from A"
      option_explanations:
        - |
          Correct. AB ≅ CD, BC ≅ DA and the shared diagonal AC give SSS; CPCTC then gives the alternate interior angles.
        - |
          No angles are given, so ASA cannot start.
        - |
          No angle is given for SAS, and a midpoint of a side is not helpful.
        - |
          No right angles are present in the figure, so HL cannot be used.
      answer: 0

    - slug: geo-u02-w10-q13
      type: multiple_choice
      topic_code: "1.20"
      source: "IM Geometry, Unit 1, Lesson 20"
      points: 1
      prompt: |
        Review. In parallelogram ABCD, why are ∠A and ∠B supplementary?
      options:
        - "They are co-interior angles for the parallel lines AD and BC with transversal AB"
        - "They are alternate interior angles for AB ∥ DC"
        - "They are vertical angles"
        - "All angles of a parallelogram are supplementary to each other"
      option_explanations:
        - |
          Correct. Co-interior (same-side interior) angles of parallel lines sum to 180°.
        - |
          Alternate interior angles are congruent, not supplementary, and ∠A and ∠B are not such a pair.
        - |
          Vertical angles are formed by crossing lines, not by adjacent vertices of a polygon.
        - |
          Opposite angles are congruent, not supplementary (unless the parallelogram is a rectangle).
      answer: 0

    - slug: geo-u02-w10-q14
      type: multi_select
      topic_code: "2.13"
      source: "IM Geometry, Unit 2, Lesson 13"
      points: 2
      partial_credit: true
      prompt: |
        Which statements are true of every parallelogram? Select all that apply.
      options:
        - "Opposite sides are congruent"
        - "Opposite angles are congruent"
        - "The diagonals are congruent"
        - "The diagonals bisect each other"
        - "Consecutive angles are supplementary"
      option_explanations:
        - |
          True: proved by ASA on the triangles formed by a diagonal.
        - |
          True: ∠A ≅ ∠C follows by CPCTC from the same ASA congruence.
        - |
          False: congruent diagonals characterise rectangles among parallelograms.
        - |
          True: proved by ASA on the triangles at the crossing point.
        - |
          True: co-interior angles of the parallel sides.
      answer: [0, 1, 3, 4]

    - slug: geo-u02-w10-q15
      type: multi_select
      topic_code: "2.14"
      source: "IM Geometry, Unit 2, Lesson 14"
      points: 2
      partial_credit: true
      prompt: |
        In isosceles triangle ABC with AB = AC, M is the midpoint of BC. Which statements are true? Select all that apply.
      options:
        - "∠ABC = ∠ACB"
        - "AM ⊥ BC"
        - "AM bisects ∠BAC"
        - "AM = BM"
        - "△ABM ≅ △ACM"
      option_explanations:
        - |
          True: this is the isosceles triangle theorem, base angles opposite congruent sides.
        - |
          True: ∠AMB ≅ ∠AMC by CPCTC and they form a linear pair, so both are 90°.
        - |
          True: ∠BAM ≅ ∠CAM by CPCTC from △ABM ≅ △ACM, so AM bisects the apex angle.
        - |
          False: AM is the height and BM is half the base; they are equal only for a specific triangle (a right isosceles one).
        - |
          True: SSS with AB ≅ AC, BM ≅ CM, AM shared.
      answer: [0, 1, 2, 4]

    - slug: geo-u02-w10-q16
      type: true_false
      topic_code: "2.15"
      source: "IM Geometry, Unit 2, Lesson 15"
      points: 1
      prompt: |
        True or false: two rectangles with the same side lengths are congruent.
      answer: true
      explanation: |
        True. A rectangle is determined by its two side lengths: all angles are 90°, so a diagonal splits each rectangle into right triangles fixed by SAS, and the figures coincide after a rigid motion.

    - slug: geo-u02-w10-q17
      type: true_false
      topic_code: "2.8"
      source: "IM Geometry, Unit 2, Lesson 8"
      points: 1
      prompt: |
        Review. True or false: the angle bisector of ∠AVB is the set of points equidistant from the points A and B.
      answer: false
      explanation: |
        False. The angle bisector is the set of points equidistant from the two sides (lines) of the angle, measured perpendicularly. The set of points equidistant from the points A and B is the perpendicular bisector of segment AB.

    - slug: geo-u02-w10-q18
      type: fill_blank
      topic_code: "2.13"
      source: "IM Geometry, Unit 2, Lesson 13"
      points: 1
      prompt: |
        A quadrilateral with both pairs of opposite sides parallel is called a ____.
      answer: ["parallelogram"]
      explanation: |
        This is the definition. The theorems (congruent opposite sides and angles, bisecting diagonals) and the converses are proved from it with triangle congruence.

    - slug: geo-u02-w10-q19
      type: fill_blank
      topic_code: "2.14"
      source: "IM Geometry, Unit 2, Lesson 14"
      points: 1
      prompt: |
        If two angles of a triangle are congruent, then the sides ____ those angles are congruent.
      answer: ["opposite", "across from", "opposite to"]
      explanation: |
