    - slug: geo-u02-w08-q24
      type: short_answer
      topic_code: "2.8"
      source: "IM Geometry, Unit 2, Lesson 8"
      points: 3
      prompt: |
        In triangle ABC, the perpendicular bisector of AB and the perpendicular bisector of BC meet at point O. Answer (a), (b) and (c).

        (a) Explain why OA = OB and why OB = OC, naming the theorem and its direction each time.
        (b) Conclude that O lies on the perpendicular bisector of AC, naming the theorem and its direction.
        (c) If OA = 10, what is the radius of the circle centred at O that passes through A, B and C, and why does such a circle exist?
      answer: |
        (a) O is on the perpendicular bisector of AB, so OA = OB by the Perpendicular Bisector Theorem (forward direction: on the bisector implies equidistant). O is on the perpendicular bisector of BC, so OB = OC by the same direction. (b) From (a), OA = OC, so O is equidistant from A and C; by the converse of the Perpendicular Bisector Theorem (equidistant implies on the bisector), O lies on the perpendicular bisector of AC. (c) The radius is 10. Since OA = OB = OC = 10, all three vertices are at distance 10 from O, so they all lie on the circle centred at O with radius 10 (the definition of a circle).
      explanation: |
        1 point for (a): both equalities with the forward direction named. 1 point for (b): OA = OC and the converse direction. 1 point for (c): radius 10, justified by equal distances and the definition of a circle.

    - slug: geo-u02-w08-q25
      type: long_answer
      topic_code: "2.8"
      source: "IM Geometry, Unit 2, Lesson 8"
      points: 6
      prompt: |
        Prove the converse of the Perpendicular Bisector Theorem: if PA = PB, then P lies on the perpendicular bisector of AB. Use M, the midpoint of AB, and triangle congruence. Your proof must (1) establish that ∠PAB ≅ ∠PBA, with a justification that does not assume what is being proved; (2) prove △PAM ≅ △PBM, naming the criterion and the three congruences; (3) conclude that PM ⊥ AB; and (4) explain why that means P is on the perpendicular bisector.
      answer: |
        Given PA = PB. Let M be the midpoint of AB, so AM ≅ BM.

        (1) Base angles. Consider △PAB and △PBA (the same triangle with the roles of A and B swapped). PA ≅ PB (given), ∠APB ≅ ∠BPA (the same angle; reflexive), PB ≅ PA (given). By SAS, △PAB ≅ △PBA, with A ↔ B. By CPCTC, ∠PAB ≅ ∠PBA.

        (2) △PAM ≅ △PBM. PA ≅ PB (given); ∠PAM ≅ ∠PBM (these are the angles ∠PAB and ∠PBA from step 1, since M lies on segment AB); AM ≅ BM (M is the midpoint). The angle at A is included between PA and AM, and the angle at B between PB and BM. So △PAM ≅ △PBM by SAS.

        (3) PM ⊥ AB. By CPCTC, ∠PMA ≅ ∠PMB. These two angles form a linear pair (A, M, B are collinear), so ∠PMA + ∠PMB = 180°. Two congruent angles summing to 180° are each 90°. Hence PM ⊥ AB.

        (4) Conclusion. Line PM passes through M, the midpoint of AB, and is perpendicular to AB. By definition that line is the perpendicular bisector of AB, and P lies on it. ∎ (If P = M the statement is trivial: M is on the bisector.)
      explanation: |
        Scoring (6 points): 1 for the base-angle step via △PAB ≅ △PBA (SAS) or an equivalent non-circular argument; 2 for △PAM ≅ △PBM with SAS and all three congruences correctly justified (given, base angles, midpoint); 1 for CPCTC giving ∠PMA ≅ ∠PMB; 1 for the linear-pair argument yielding right angles; 1 for identifying PM as the perpendicular bisector (through the midpoint and perpendicular). Deduct 1 if SSS is cited without acknowledging it has not yet been proved, or if the proof assumes P is on the bisector.
