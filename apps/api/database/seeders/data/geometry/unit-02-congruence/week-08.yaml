week: 8
unit: 2
title: "SAS, ASA and the Perpendicular Bisector Theorem"
topics: ["2.5", "2.6", "2.7", "2.8"]
guide: guides/week-08.md
guide_description: |
  The Segment and Angle Congruence Theorems and their use on zigzags, then the first two triangle congruence
  criteria: SAS and ASA, each stated with the word "included", proved with rigid motions and applied in
  two-column proofs with CPCTC. The Perpendicular Bisector Theorem is proved in both directions with SAS, which
  finally justifies the week-1 construction and every "equidistant" argument since.
flashcards_description: |
  28 cards on the segment and angle congruence theorems, SAS, ASA and AAS with their proofs and checklists,
  the Perpendicular Bisector Theorem in both directions, and the standard reasons used in two-column proofs.

flashcards:
  - front: Segment Congruence Theorem → statement
    back: |
      If two segments have the same length, they are congruent: a rigid motion carries one onto the other. Proof: translate one endpoint onto its partner, rotate the other onto the ray, and the equal length puts it on the endpoint.
    topic_code: "2.5"
  - front: Angle Congruence Theorem → statement and proof sketch
    back: |
      If two angles have the same measure, they are congruent. Translate vertex to vertex, rotate one ray onto its partner, and reflect across that ray's line if the second ray is on the wrong side. One ray per measure per side finishes it.
    topic_code: "2.5"
  - front: Zigzag (polyline) congruence → what data forces it
    back: |
      Matching segment lengths in order and matching angles at each turn. Match the first segment, then each angle fixes the next direction and each length fixes the next point; reflect once if the first turn is mirrored.
    topic_code: "2.5"
  - front: Why "equal measure" and "congruent" are interchangeable for segments and angles → reason
    back: |
      The Segment and Angle Congruence Theorems show equal measure implies congruent, and rigid motions preserving measure gives the converse. So AB = CD and AB ≅ CD say the same thing.
    topic_code: "2.5"
  - front: SAS criterion → precise statement
    back: |
      If two sides and the included angle of one triangle are congruent to two sides and the included angle of another, the triangles are congruent. The angle must be the one between the two sides.
    topic_code: "2.6"
  - front: SAS → proof outline
    back: |
      Translate A to D; rotate about D so B lands on E (AB = DE). The image of ray AC makes angle ∠A = ∠D with DE, so it is ray DF after reflecting across DE if needed; AC = DF then puts the image of C at F.
    topic_code: "2.6"
  - front: Included angle check for SAS → how to verify
    back: |
      Name the two congruent sides; the congruent angle must be at the vertex they share. In △ABC with sides AB and AC, the included angle is ∠A. Two sides and an angle elsewhere is SSA, not a criterion.
    topic_code: "2.6"
  - front: Segments bisecting each other at M → which triangles are congruent and why
    back: |
      If AC and BD share midpoint M, then △AMB ≅ △CMD by SAS: AM ≅ CM and BM ≅ DM (midpoint), ∠AMB ≅ ∠CMD (vertical angles). CPCTC then gives AB ≅ CD and AB ∥ CD.
    topic_code: "2.6"
  - front: ASA criterion → precise statement
    back: |
      If two angles and the included side of one triangle are congruent to two angles and the included side of another, the triangles are congruent. The side must be the one joining the two angle vertices.
    topic_code: "2.7"
  - front: ASA → proof outline
    back: |
      Match the included side AB onto DE (translate, rotate). Reflect across DE if the third vertex is on the wrong side. Then the equal angles at D and E make the image rays ray DF and ray EF, which meet only at F.
    topic_code: "2.7"
  - front: Two rays from different points meet in at most one point → where it is used
    back: |
      In the ASA proof: the image of C lies on ray DF and on ray EF, and F is the only point on both, so the image of C is F.
    topic_code: "2.7"
  - front: AAS → statement and why it reduces to ASA
    back: |
      Two angles and a non-included side congruent imply congruence. The third angles are congruent by the triangle angle sum, so the given side becomes an included side between two congruent angles.
    topic_code: "2.7"
  - front: AAA → why it is not a congruence criterion
    back: |
      Three congruent angles allow different sizes: a triangle and a scaled copy have the same angles but different sides. AAA gives similarity (Unit 3), not congruence.
    topic_code: "2.7"
  - front: Parallel lines in an ASA proof → the angle pair to use
    back: |
      A transversal through the two parallels gives congruent alternate interior angles, which supply one of the two angles. Vertical angles at the crossing point often supply the other.
    topic_code: "2.7"
  - front: Perpendicular Bisector Theorem → statement (forward direction)
    back: |
      If a point is on the perpendicular bisector of a segment, it is equidistant from the segment's endpoints.
    topic_code: "2.8"
  - front: Perpendicular Bisector Theorem → proof of the forward direction
    back: |
      Let the bisector meet AB at midpoint M and let P be on it. AM ≅ BM, ∠AMP ≅ ∠BMP (right angles), PM ≅ PM. △AMP ≅ △BMP by SAS, so PA ≅ PB by CPCTC.
    topic_code: "2.8"
  - front: Perpendicular Bisector Theorem → converse statement
    back: |
      If a point is equidistant from the endpoints of a segment, it lies on the segment's perpendicular bisector.
    topic_code: "2.8"
  - front: Perpendicular Bisector Theorem → proof of the converse
    back: |
      PA = PB. Base angles ∠PAB ≅ ∠PBA (△PAB ≅ △PBA by SAS). With M the midpoint, △PAM ≅ △PBM by SAS (PA ≅ PB, ∠A ≅ ∠B, AM ≅ BM), so ∠PMA ≅ ∠PMB; a congruent linear pair means right angles, so PM is the perpendicular bisector.
    topic_code: "2.8"
  - front: Isosceles base angles via SAS → the self-congruence trick
    back: |
      If PA = PB, then △PAB ≅ △PBA by SAS (PA ≅ PB, ∠P ≅ ∠P, PB ≅ PA), and CPCTC gives ∠A ≅ ∠B. No auxiliary line needed.
    topic_code: "2.8"
  - front: Week-1 perpendicular bisector construction → now justified how
    back: |
      Each crossing point of the two equal circles is equidistant from A and B (radii), so by the converse of the Perpendicular Bisector Theorem it lies on the bisector; two such points determine the line.
    topic_code: "2.8"
  - front: Point on two perpendicular bisectors of a triangle → conclusion
    back: |
      It is equidistant from all three vertices: on the bisector of AB gives OA = OB, on the bisector of BC gives OB = OC. Hence it is on the third bisector too (circumcentre, Unit 7).
    topic_code: "2.8"
  - front: Two-column proof → format
    back: |
      Statements in the left column, one reason per statement in the right column. Reasons are givens, definitions, postulates, previously proved theorems, or properties such as reflexive and CPCTC.
    topic_code: "2.6"
  - front: Reflexive property → when to cite it
    back: |
      Whenever two triangles share a side or an angle: AC ≅ AC. It supplies one of the three congruences for SAS or ASA and must be written explicitly.
    topic_code: "2.6"
  - front: Standard reasons for congruent parts → list
    back: |
      Given; definition of midpoint; definition of angle bisector; vertical angles; alternate interior angles (parallel lines); reflexive property; all right angles are congruent; radii of a circle; Perpendicular Bisector Theorem; CPCTC (after congruence).
    topic_code: "2.7"
  - front: Checklist before writing "by SAS" or "by ASA" → four steps
    back: |
      Name the triangles in corresponding order; list the three congruences in S-A-S or A-S-A order with reasons; confirm the angle (or side) is included; cite the criterion, then CPCTC for the part needed.
    topic_code: "2.6"
  - front: Error-spot → "△PQR ≅ △XYZ by SAS" with PQ = XY, QR = YZ, ∠P = ∠X
    back: |
      Invalid: the equal angle is at P, which is not between PQ and QR; the included angle is ∠Q. This is SSA, which does not guarantee congruence.
    topic_code: "2.6"
  - front: Error-spot → using CPCTC before the triangles are proved congruent
    back: |
      CPCTC is a consequence of an established congruence. The three congruences and the criterion must come first; only then may a fourth part be concluded.
    topic_code: "2.7"
  - front: Which direction of the Perpendicular Bisector Theorem → "P is on the bisector, find PA"
    back: |
      Forward direction: on the bisector implies PA = PB. If PB (or the foot distance) is known, PA follows; with AM and PM known, PA comes from the Pythagorean theorem in right triangle PMA.
    topic_code: "2.8"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 2.5 to 2.8: segment and angle congruence, SAS,
    ASA, AAS and the Perpendicular Bisector Theorem) with review of week 7 and Unit 1 (congruence statements,
    rigid motions, vertical angles, parallel lines and the angle sum). Multiple choice, select-all, true/false and
    numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and
    the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: segments crossing at a midpoint (2.6, 2.7)
    - slug: geo-u02-w08-q01
      type: multiple_choice
      topic_code: "2.6"
      source: "IM Geometry, Unit 2, Lesson 6"
      points: 1
      stimulus: |
        Figure description: segments PR and QS cross at point T. T is the midpoint of PR and also the midpoint of QS. Segments PQ and RS are drawn, forming triangles PTQ and RTS on opposite sides of T.
      prompt: |
        Which three congruences, in order, justify △PTQ ≅ △RTS by SAS?
      options:
        - "PT ≅ RT (midpoint), ∠PTQ ≅ ∠RTS (vertical angles), QT ≅ ST (midpoint)"
        - "PT ≅ RT (midpoint), ∠TPQ ≅ ∠TRS (alternate interior angles), QT ≅ ST (midpoint)"
        - "PT ≅ QT (midpoint), ∠PTQ ≅ ∠RTS (vertical angles), RT ≅ ST (midpoint)"
        - "PQ ≅ RS (given), ∠PTQ ≅ ∠RTS (vertical angles), QT ≅ ST (midpoint)"
      option_explanations:
        - |
          Correct. The two sides meet at T, the vertical angle at T is included between them, and both side pairs come from the midpoints.
        - |
          The angle at P is not included between PT and QT, and PQ ∥ RS has not been established yet (it is a conclusion, not a given).
        - |
          PT and QT are halves of different segments and are not congruent in general; the pairs are PT with RT and QT with ST.
        - |
          PQ ≅ RS is not given; it is what CPCTC will conclude after the congruence.
      answer: 0

    - slug: geo-u02-w08-q02
      type: multiple_choice
      topic_code: "2.6"
      source: "IM Geometry, Unit 2, Lesson 6"
      points: 1
      stimulus: |
        Figure description: segments PR and QS cross at point T. T is the midpoint of PR and also the midpoint of QS. Segments PQ and RS are drawn, forming triangles PTQ and RTS on opposite sides of T.
      prompt: |
        After proving △PTQ ≅ △RTS, which conclusion follows by CPCTC, and what further fact does it give?
      options:
        - "PT ≅ QT, so T is the centre of a circle through P and Q"
        - "PQ ≅ QS, so PQS is isosceles"
        - "∠TPQ ≅ ∠TRS, so PQ ∥ RS by the converse of the alternate interior angle theorem"
        - "∠PTQ ≅ ∠RTS, so the lines are perpendicular"
      option_explanations:
        - |
          PT and QT are not corresponding parts; PT ↔ RT and QT ↔ ST.
        - |
          PQ corresponds to RS, not to QS, so CPCTC gives PQ ≅ RS.
        - |
          Correct. ∠TPQ and ∠TRS are corresponding angles of the congruent triangles; they are alternate interior angles for transversal PR, so the lines PQ and RS are parallel.
        - |
          ∠PTQ ≅ ∠RTS was an input (vertical angles), and it does not make the segments perpendicular.
      answer: 2

    - slug: geo-u02-w08-q03
      type: multiple_choice
      topic_code: "2.7"
      source: "IM Geometry, Unit 2, Lesson 7"
      points: 1
      stimulus: |
        Figure description: segments PR and QS cross at point T. T is the midpoint of PR and also the midpoint of QS. Segments PQ and RS are drawn, forming triangles PTQ and RTS on opposite sides of T.
      prompt: |
        Suppose instead you are told only that T is the midpoint of PR and that PQ ∥ RS. Which criterion proves △PTQ ≅ △RTS, and with which three parts?
      options:
        - "The triangles cannot be proved congruent from this information"
        - "ASA: ∠TPQ ≅ ∠TRS (alternate interior), PT ≅ RT (midpoint), ∠PTQ ≅ ∠RTS (vertical)"
        - "SAS: PT ≅ RT, ∠PTQ ≅ ∠RTS, QT ≅ ST"
        - "SSS: PT ≅ RT, QT ≅ ST, PQ ≅ RS"
      option_explanations:
        - |
          ASA applies: two angles (parallel-line and vertical) and the included side from the midpoint.
        - |
          Correct. The side PT/RT is included between the angle at P/R (from the parallel lines) and the angle at T (vertical angles).
        - |
          QT ≅ ST is no longer given; it is now a conclusion to be reached by CPCTC.
        - |
          Neither QT ≅ ST nor PQ ≅ RS is given in this version.
      answer: 1

    - slug: geo-u02-w08-q04
      type: multiple_choice
      topic_code: "2.5"
      source: "IM Geometry, Unit 2, Lesson 5"
      points: 1
      prompt: |
        In the proof of the Segment Congruence Theorem (if AB = CD then AB ≅ CD), why is no reflection needed?
      options:
        - "Reflections are not rigid motions"
        - "Segments are always on the same side of each other"
        - "The rotation already reverses orientation"
        - "After translating A to C and rotating the image of B onto ray CD, the equal length places it exactly at D; a segment has no side to be on"
      option_explanations:
        - |
          Reflections are rigid motions; they simply are not required here.
        - |
          This is not a meaningful statement; what matters is that the construction ends on the ray at the right distance.
        - |
          Rotations preserve orientation; orientation is irrelevant for a single segment anyway.
        - |
          Correct. Two rigid motions suffice because there is no third vertex whose side of the line matters.
      answer: 3

    - slug: geo-u02-w08-q05
      type: multiple_choice
      topic_code: "2.5"
      source: "IM Geometry, Unit 2, Lesson 5"
      points: 1
      prompt: |
        Zigzag A–B–C has AB = 3, BC = 5 and ∠ABC = 100°. Zigzag W–X–Y has WX = 3, XY = 5 and ∠WXY = 100°. Which statement is true?
      options:
        - "The zigzags cannot be compared because they are not closed figures"
        - "The zigzags are congruent but the triangles ABC and WXY might not be"
        - "The zigzags are congruent, and so are triangles ABC and WXY (by SAS)"
        - "The zigzags are congruent only if AC = WY is also given"
      option_explanations:
        - |
          Any figures can be compared by rigid motions; closedness is irrelevant.
        - |
          A rigid motion carrying the zigzag onto the other carries the segment AC onto WY as well, so the triangles are congruent.
        - |
          Correct. Matching the first segment, the angle fixes the direction of the second and its length fixes the endpoint (after a possible reflection); the same data is SAS for the triangles.
        - |
          AC = WY is a consequence (CPCTC), not an additional requirement.
      answer: 2

    - slug: geo-u02-w08-q06
      type: multiple_choice
      topic_code: "2.6"
      source: "IM Geometry, Unit 2, Lesson 6"
      points: 1
      prompt: |
        △ABC and △DEF have AB = DE = 7, BC = EF = 9 and ∠A = ∠D = 50°. Can SAS be applied?
      options:
        - "No: the congruent angle is at A, which is not included between AB and BC"
        - "Yes: two sides and an angle are congruent"
        - "No, because the triangles would need three congruent sides"
        - "Yes, because 50° is acute"
      option_explanations:
        - |
          Correct. The included angle between AB and BC is ∠B. With ∠A given, this is SSA, which is not a congruence criterion.
        - |
          SAS requires the angle to be between the two sides, not anywhere in the triangle.
        - |
          SAS needs two sides and the included angle, not three sides; the problem is which angle is given.
        - |
          Whether the angle is acute does not matter; its position does.
      answer: 0

    - slug: geo-u02-w08-q07
      type: multiple_choice
      topic_code: "2.7"
      source: "IM Geometry, Unit 2, Lesson 7"
      points: 1
      prompt: |
        In the ASA proof, after AB has been matched onto DE and (if necessary) a reflection across DE has been done, the image of C lies on ray DF and on ray EF. Why must the image be F?
      options:
        - "Rays always meet at their endpoints"
        - "Two rays from different points meet in at most one point, and F is on both"
        - "Because DF = EF"
        - "Because the reflection sent C to F"
      option_explanations:
        - |
          The endpoints of the two rays are D and E, which are different points; the rays meet elsewhere.
        - |
          Correct. Two distinct non-parallel rays from different points have at most one common point; F is that point.
        - |
          DF and EF need not be equal; the argument is about intersection, not length.
        - |
          The reflection only ensured the image ray from D is on the correct side; the intersection argument finishes the proof.
      answer: 1

    - slug: geo-u02-w08-q08
      type: multiple_choice
      topic_code: "2.7"
      source: "IM Geometry, Unit 2, Lesson 7"
      points: 1
      prompt: |
        △JKL and △MNP have ∠J = ∠M, ∠K = ∠N and KL = NP. Which statement is correct?
      options:
        - "The triangles are congruent by SAS"
        - "The triangles are similar but not necessarily congruent"
        - "The triangles are not necessarily congruent because the side is not included"
        - "The triangles are congruent by AAS, because ∠L = ∠P by the angle sum and then ASA applies with side KL/NP"
      option_explanations:
        - |
          Only one side is given, so SAS cannot be the criterion.
        - |
          Equal angles alone give similarity, but the congruent corresponding side fixes the size.
        - |
          A non-included side with two angles is AAS, which does guarantee congruence.
        - |
          Correct. Two angles determine the third, so KL is included between ∠K and ∠L, matching NP between ∠N and ∠P.
      answer: 3

    - slug: geo-u02-w08-q09
      type: multiple_choice
      topic_code: "2.8"
      source: "IM Geometry, Unit 2, Lesson 8"
      points: 1
      prompt: |
        In the proof that a point P on the perpendicular bisector of AB satisfies PA = PB, which triangles are shown congruent and by which criterion?
      options:
        - "△PAB ≅ △PBA by ASA"
        - "△AMP ≅ △BMP by SSS"
        - "△AMP ≅ △BMP by SAS, where M is the midpoint of AB"
        - "△APB ≅ △AMB by AAS"
      option_explanations:
        - |
          That self-congruence is used in the converse proof, and it needs PA = PB, which is what is being proved here.
        - |
          PA = PB is the conclusion, so it cannot be used as the third side.
        - |
          Correct. AM ≅ BM (midpoint), ∠AMP ≅ ∠BMP (right angles), PM ≅ PM (reflexive): two sides and the included angle.
        - |
          These are not a matching pair of triangles in the figure.
      answer: 2

    - slug: geo-u02-w08-q10
      type: multiple_choice
      topic_code: "2.8"
      source: "IM Geometry, Unit 2, Lesson 8"
      points: 1
      prompt: |
        Point X satisfies XA = XB = 17, and AB = 16. What is the distance from X to line AB?
      options:
        - "8"
        - "15"
        - "1"
        - "17"
      option_explanations:
        - |
          8 is AM, half of the base AB, not the perpendicular distance from X.
        - |
          Correct. X is on the perpendicular bisector (converse of the theorem), so the foot of the perpendicular is the midpoint M with AM = 8, and XM = √(17² − 8²) = √225 = 15.
        - |
          1 is 17 − 16, which has no geometric meaning here.
        - |
          17 is XA, the slant distance to an endpoint, not the perpendicular distance to the line.
      answer: 1

    - slug: geo-u02-w08-q11
      type: multiple_choice
      topic_code: "2.1"
      source: "IM Geometry, Unit 2, Lesson 1"
      points: 1
      prompt: |
        Review. After proving △AEB ≅ △DEC, a student writes "BE ≅ DE by CPCTC". What is wrong?
      options:
        - "CPCTC cannot be used for sides"
        - "CPCTC must be used before the congruence statement"
        - "Nothing; BE ≅ DE is correct"
        - "BE corresponds to CE, not DE; the second letters are E ↔ E and the first B ↔ C"
      option_explanations:
        - |
          CPCTC applies equally to corresponding sides and corresponding angles.
        - |
          CPCTC always comes after the congruence has been established.
        - |
          BE and DE are not corresponding parts under this correspondence.
        - |
          Correct. In △AEB ≅ △DEC, A ↔ D, E ↔ E, B ↔ C, so side EB corresponds to side EC.
      answer: 3

    - slug: geo-u02-w08-q12
      type: multiple_choice
      topic_code: "1.20"
      source: "IM Geometry, Unit 1, Lesson 20"
      points: 1
      prompt: |
        Review. In a proof, AB ∥ CD and segment AD is a transversal meeting them at A and D. Which pair of angles is congruent by the alternate interior angle theorem?
      options:
        - "∠BAD and ∠CDA"
        - "∠ABD and ∠BDC"
        - "∠BAD and ∠ADC's supplement only"
        - "∠BAD and ∠CDA are supplementary, not congruent"
      option_explanations:
        - |
          Correct. ∠BAD (at A, between AB and AD) and ∠CDA (at D, between DC and DA) are interior angles on opposite sides of transversal AD.
        - |
          Those angles involve transversal BD, not AD; the question specifies AD.
        - |
          The angles themselves are congruent; no supplement is involved.
        - |
          Co-interior angles are supplementary; alternate interior angles are congruent.
      answer: 0

    - slug: geo-u02-w08-q13
      type: multiple_choice
      topic_code: "2.4"
      source: "IM Geometry, Unit 2, Lesson 4"
      points: 1
      prompt: |
        Review. In every rigid-motion congruence proof this unit, after translating and rotating, a reflection across the matched side may be needed. What determines whether it is needed?
      options:
        - "Whether the triangles share a side"
        - "Whether the rotation angle was more than 90°"
        - "Whether the third vertex's image lies on the opposite side of the matched side from its target"
        - "Whether the triangles are isosceles"
      option_explanations:
        - |
          Shared sides affect which congruences are available, not whether a reflection is needed.
        - |
          The size of the rotation has nothing to do with it.
        - |
          Correct. If the orientations differ, the third vertex lands on the wrong side and the reflection across the matched side fixes it.
        - |
          Isosceles triangles have symmetry, but the need for a reflection depends on orientation, not on side lengths.
      answer: 2

    - slug: geo-u02-w08-q14
      type: multi_select
      topic_code: "2.6"
      source: "IM Geometry, Unit 2, Lesson 6"
      points: 2
      partial_credit: true
      prompt: |
        Which of the following sets of congruences would justify △ABC ≅ △DEF by SAS? Select all that apply.
      options:
        - "AB ≅ DE, ∠C ≅ ∠F, BC ≅ EF"
        - "AC ≅ DF, ∠C ≅ ∠F, BC ≅ EF"
        - "AB ≅ DE, ∠B ≅ ∠E, BC ≅ EF"
        - "AB ≅ DE, ∠A ≅ ∠D, AC ≅ DF"
        - "AB ≅ DE, ∠A ≅ ∠D, BC ≅ EF"
      option_explanations:
        - |
          No: ∠C is not between AB and BC; this is SSA.
        - |
          Yes: ∠C is the included angle between sides AC and BC, matching ∠F between DF and EF.
        - |
          Yes: ∠B is the included angle between sides AB and BC, matching ∠E between DE and EF.
        - |
          Yes: ∠A is the included angle between sides AB and AC, matching ∠D between DE and DF.
        - |
          No: ∠A is between AB and AC, not AB and BC; this is SSA.
      answer: [1, 2, 3]

    - slug: geo-u02-w08-q15
      type: multi_select
      topic_code: "2.8"
      source: "IM Geometry, Unit 2, Lesson 8"
      points: 2
      partial_credit: true
      prompt: |
        Which statements follow from the Perpendicular Bisector Theorem (either direction)? Select all that apply.
      options:
        - "The two crossing points of equal circles centred at A and B determine the perpendicular bisector of AB"
        - "The point where the perpendicular bisectors of two sides of a triangle meet is equidistant from all three vertices"
        - "Every point equidistant from A and B lies on line AB"
        - "If PA = PB, then P lies on the perpendicular bisector of AB"
        - "If P lies on the perpendicular bisector of AB, then PA = PB"
      option_explanations:
        - |
          Yes: each crossing point is equidistant from A and B (radii), so by the converse it is on the bisector.
        - |
          Yes: OA = OB from one bisector and OB = OC from the other (forward direction).
        - |
          No: only the midpoint of AB is both equidistant and on the line; the others are off the line, on the bisector.
        - |
          Yes: this is the converse direction, equidistant implies on the bisector.
        - |
          Yes: this is the forward direction, on the bisector implies equidistant.
      answer: [0, 1, 3, 4]

    - slug: geo-u02-w08-q16
      type: true_false
      topic_code: "1.10"
      source: "IM Geometry, Unit 2, Lesson 7"
      points: 1
      prompt: |
        True or false: if all three angles of one triangle are congruent to the three angles of another, the triangles must be congruent.
      answer: false
      explanation: |
        False. A triangle and an enlarged copy have the same angles but different side lengths, so no rigid motion carries one onto the other. AAA gives similarity, not congruence; at least one pair of corresponding sides must also be congruent.

    - slug: geo-u02-w08-q17
      type: true_false
      topic_code: "1.19"
      source: "IM Geometry, Unit 1, Lesson 19"
      points: 1
