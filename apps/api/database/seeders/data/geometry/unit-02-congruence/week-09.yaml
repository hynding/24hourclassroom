week: 9
unit: 2
title: "SSS, the SSA Trap, Proof Practice and Quadrilaterals"
topics: ["2.9", "2.10", "2.11", "2.12"]
guide: guides/week-09.md
guide_description: |
  The SSS criterion proved with the Perpendicular Bisector Theorem, a table for choosing the right criterion
  from a marked figure, and practice proofs with parallels, circles and shared sides. Why SSA fails (two
  triangles from one circle crossing a ray twice) and when it works (HL for right triangles, or an obtuse angle,
  or the longer side opposite the angle). Then the first quadrilateral theorems: a kite's axis diagonal bisects
  its angles and is the perpendicular bisector of the other diagonal, and a rhombus's diagonals are perpendicular
  bisectors of each other.
flashcards_description: |
  28 cards on SSS and its proof, choosing a congruence criterion, the SSA ambiguity and HL, and the kite and
  rhombus diagonal theorems with their converses.

flashcards:
  - front: SSS criterion → precise statement
    back: |
      If the three sides of one triangle are congruent to the three sides of another, the triangles are congruent. The correspondence is read from which sides match.
    topic_code: "2.9"
  - front: SSS → proof outline
    back: |
      Translate A to D, rotate so B lands on E. The image C′ of C satisfies DC′ = DF and EC′ = EF, so D and E both lie on the perpendicular bisector of C′F (converse of the Perpendicular Bisector Theorem); line DE is that bisector, and reflecting across it sends C′ to F.
    topic_code: "2.9"
  - front: Why SSS needs the Perpendicular Bisector Theorem → reason
    back: |
      No angles are given, so the equal-angle ray argument of SAS is unavailable. The only facts about the third vertex are its distances from the two matched vertices, which is exactly what the converse theorem turns into "on the bisector".
    topic_code: "2.9"
  - front: Reading the correspondence from three matched sides → method
    back: |
      Each vertex is the endpoint shared by two sides; match vertices by matching the pairs of sides that meet there. If AB ↔ CD and BC ↔ DA, then B ↔ D (shared by AB, BC and by CD, DA).
    topic_code: "2.9"
  - front: Quadrilateral with both pairs of opposite sides congruent → what SSS proves
    back: |
      Drawing diagonal AC gives △ABC ≅ △CDA by SSS. CPCTC yields opposite angles congruent and congruent alternate interior angles, so both pairs of opposite sides are parallel: it is a parallelogram.
    topic_code: "2.9"
  - front: Choosing a criterion from a marked figure → the table
    back: |
      Two sides and the included angle: SAS. Two angles and the included side: ASA. Two angles and another side: AAS. Three sides: SSS. Right angle plus hypotenuse and leg: HL. Two sides and a non-included angle without a right angle: look for more information.
    topic_code: "2.10"
  - front: Free information in a figure → what to look for
    back: |
      Vertical angles at a crossing; a shared side or angle (reflexive); alternate interior angles from parallel lines; midpoints giving congruent halves; bisectors giving congruent angles; radii of one circle.
    topic_code: "2.10"
  - front: Equal chords of a circle → which triangles and why
    back: |
      Radii to the endpoints give △OAB ≅ △OCD by SSS (OA ≅ OC, OB ≅ OD as radii, AB ≅ CD given). CPCTC shows equal chords subtend equal central angles.
    topic_code: "2.10"
  - front: Parallelogram diagonal proof → the ASA pattern
    back: |
      With AB ∥ DC and AD ∥ BC and diagonal BD: ∠ABD ≅ ∠CDB and ∠ADB ≅ ∠CBD (alternate interior), BD ≅ DB (reflexive). △ABD ≅ △CDB by ASA; CPCTC gives AB ≅ CD and AD ≅ CB.
    topic_code: "2.10"
  - front: SSA (side-side-angle) → why it is not a criterion
    back: |
      Given PQ, ∠P and QR, the vertex R lies on a ray from P and on a circle centred at Q. The circle can cross the ray twice, giving two non-congruent triangles with the same two sides and non-included angle.
    topic_code: "2.11"
  - front: Condition for two SSA triangles → inequality
    back: |
      With PQ = a, ∠P = θ and QR = b opposite the angle: two triangles exist when a sin θ < b < a. One triangle when b ≥ a or b = a sin θ (tangent). None when b < a sin θ.
    topic_code: "2.11"
  - front: HL (hypotenuse-leg) → statement
    back: |
      If the hypotenuse and one leg of a right triangle are congruent to the hypotenuse and one leg of another right triangle, the triangles are congruent. It is the SSA case with a right angle.
    topic_code: "2.11"
  - front: Why HL works when SSA fails → reason
    back: |
      The hypotenuse is opposite the right angle and is the longest side, so the circle centred at the far vertex with the hypotenuse as radius crosses the ray only once on the correct side (the b ≥ a case). Equivalently the third side is forced by the Pythagorean theorem and SSS applies.
    topic_code: "2.11"
  - front: SSA with an obtuse given angle → how many triangles
    back: |
      At most one. The side opposite an obtuse angle must be the longest, so the circle crosses the ray on the correct side only once, if at all.
    topic_code: "2.11"
  - front: Error-spot → "△PQR ≅ △PSR by SSA with PQ = PS, PR shared, ∠PRQ = ∠PRS"
    back: |
      The angle at R is not between PQ and PR, so this is SSA and invalid. If PR bisects ∠QPS instead, SAS applies; if the angles at R are right angles, HL applies.
    topic_code: "2.11"
  - front: Kite → definition
    back: |
      A quadrilateral with two pairs of congruent adjacent sides: ABCD with AB = AD and CB = CD. The vertices A and C where the pairs meet are the ends of the axis diagonal.
    topic_code: "2.12"
  - front: Kite theorem → statement
    back: |
      In kite ABCD with AB = AD and CB = CD, diagonal AC bisects ∠BAD and ∠BCD, and line AC is the perpendicular bisector of the other diagonal BD.
    topic_code: "2.12"
  - front: Kite theorem → proof
    back: |
      △ABC ≅ △ADC by SSS (AB ≅ AD, CB ≅ CD, AC ≅ AC); CPCTC gives the bisected angles. A and C are each equidistant from B and D, so both lie on the perpendicular bisector of BD; line AC is that bisector.
    topic_code: "2.12"
  - front: Which diagonal of a kite is the axis → how to tell
    back: |
      The one joining the two vertices where the congruent sides meet. In ABCD with AB = AD and CB = CD, that is AC. The other diagonal BD is bisected at right angles but does not bisect the angles at B and D.
    topic_code: "2.12"
  - front: Rhombus diagonals → theorem
    back: |
      The diagonals of a rhombus are perpendicular bisectors of each other, and each bisects the two angles it joins. Proof: a rhombus is a kite with respect to both diagonals.
    topic_code: "2.12"
  - front: Diagonals that are perpendicular bisectors of each other → what quadrilateral
    back: |
      A rhombus. Each vertex lies on the perpendicular bisector of the other diagonal, so by the Perpendicular Bisector Theorem it is equidistant from that diagonal's endpoints; chaining around gives four equal sides.
    topic_code: "2.12"
  - front: Side of a rhombus from its diagonals → formula
    back: |
      Half-diagonals are the legs of a right triangle: side = √((d₁/2)² + (d₂/2)²). Diagonals 16 and 12 give √(64 + 36) = 10.
    topic_code: "2.12"
  - front: Area of a rhombus (or kite) from its diagonals → formula
    back: |
      Half the product of the diagonals, ½ d₁ d₂, because the perpendicular diagonals cut the figure into four right triangles (two pairs for a kite). Diagonals 16 and 12 give 96.
    topic_code: "2.12"
  - front: Rhombus diagonals congruent? → only when
    back: |
      Only for a square. In general the diagonals of a rhombus have different lengths; perpendicular bisectors of each other, yes, congruent, no.
    topic_code: "2.12"
  - front: Auxiliary diagonal in a quadrilateral proof → why draw it
    back: |
      It splits the quadrilateral into two triangles that can be compared with a congruence criterion; the diagonal itself is a shared side (reflexive property).
    topic_code: "2.12"
  - front: Angles of a kite from the two axis-vertex angles → method
    back: |
      The axis bisects ∠A and ∠C; in triangle ABC the angle at B is 180° minus half of ∠A minus half of ∠C, and ∠D equals ∠B. With ∠A = 70° and ∠C = 40°, ∠B = ∠D = 125°.
    topic_code: "2.12"
  - front: Which criterion when → "a figure shows two radii and a chord in each of two triangles"
    back: |
      SSS: the radii are congruent as radii of the same circle, and the chords are given congruent (or shared). CPCTC then compares the central angles.
    topic_code: "2.10"
  - front: Which criterion when → "two right triangles share a hypotenuse and have a congruent leg"
    back: |
      HL: the shared hypotenuse (reflexive) and the congruent leg suffice because the triangles are right-angled.
    topic_code: "2.11"

quiz:
  description: |
    25 questions · about 40 minutes · mostly on this week (topics 2.9 to 2.12: SSS, choosing a criterion, SSA
    and HL, kites and rhombuses) with review of weeks 7 and 8 and Unit 1 (SAS, ASA, the Perpendicular Bisector
    Theorem, parallel lines and vertical angles). Multiple choice, select-all, true/false and numeric items are
    graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer
    are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: kite ABCD (2.12, 2.9)
    - slug: geo-u02-w09-q01
      type: multiple_choice
      topic_code: "2.12"
      source: "IM Geometry, Unit 2, Lesson 12"
      points: 1
      stimulus: |
        Figure description: kite ABCD with AB = AD = 5 and CB = CD = 13. Diagonal AC is drawn, and diagonal BD meets it at M. BD = 8.
      prompt: |
        Which criterion proves △ABC ≅ △ADC, and with which congruences?
      options:
        - "SSS: AB ≅ AD, CB ≅ CD, AC ≅ AC"
        - "HL: AC is the hypotenuse of both"
        - "SAS: AB ≅ AD, ∠BAC ≅ ∠DAC, AC ≅ AC"
        - "ASA: ∠ABC ≅ ∠ADC, BC ≅ DC, ∠BCA ≅ ∠DCA"
      option_explanations:
        - |
          Correct. The two given pairs of sides plus the shared diagonal (reflexive) give three congruent sides.
        - |
          There is no right angle at B or D in general (in fact 5² + 8² ≠ 13² here), so HL does not apply.
        - |
          ∠BAC ≅ ∠DAC is a conclusion of the kite theorem (CPCTC), not something given.
        - |
          Neither angle pair is given; they follow only after the congruence is proved.
      answer: 0

    - slug: geo-u02-w09-q02
      type: multiple_choice
      topic_code: "2.12"
      source: "IM Geometry, Unit 2, Lesson 12"
      points: 1
      stimulus: |
        Figure description: kite ABCD with AB = AD = 5 and CB = CD = 13. Diagonal AC is drawn, and diagonal BD meets it at M. BD = 8.
      prompt: |
        What is the length of AM?
      options:
        - "5"
        - "4"
        - "√41"
        - "3"
      option_explanations:
        - |
          5 is AB, the hypotenuse of right triangle AMB, not its leg AM.
        - |
          4 is BM, half of the diagonal BD, not the segment AM along the axis.
        - |
          √41 = √(25 + 16) would be the hypotenuse if 5 and 4 were legs, but 5 is the hypotenuse here.
        - |
          Correct. AC is the perpendicular bisector of BD, so BM = 4 and ∠AMB = 90°; AM = √(5² − 4²) = √9 = 3.
      answer: 3

    - slug: geo-u02-w09-q03
      type: multiple_choice
      topic_code: "2.9"
      source: "IM Geometry, Unit 2, Lesson 9"
      points: 1
      stimulus: |
        Figure description: kite ABCD with AB = AD = 5 and CB = CD = 13. Diagonal AC is drawn, and diagonal BD meets it at M. BD = 8.
      prompt: |
        What is the length of the diagonal AC?
      options:
        - "18"
        - "√194"
        - "3 + √153"
        - "12 + 3"
      option_explanations:
        - |
          18 = 5 + 13 would be the diagonal only if A, B, C were collinear, which they are not.
        - |
          √194 = √(25 + 169) treats AB and BC as perpendicular legs, but ∠ABC is not a right angle.
        - |
          Correct. AM = 3 (from the 3-4-5 triangle) and CM = √(13² − 4²) = √(169 − 16) = √153 ≈ 12.37, so AC = 3 + √153 ≈ 15.37.
        - |
          CM is √153, not 12 (12 would need CB = √160); 12 + 3 = 15 is close but not exact.
      answer: 2

    - slug: geo-u02-w09-q04
      type: multiple_choice
      topic_code: "2.8"
      source: "IM Geometry, Unit 2, Lesson 9"
      points: 1
      prompt: |
        In the proof of SSS, after A is moved to D and B to E, the image C′ of C satisfies DC′ = DF and EC′ = EF. Which theorem turns these two facts into "line DE is the perpendicular bisector of C′F"?
      options:
        - "The vertical angle theorem"
        - "The converse of the Perpendicular Bisector Theorem (equidistant implies on the bisector), applied at D and at E"
        - "The forward Perpendicular Bisector Theorem (on the bisector implies equidistant)"
        - "The SAS criterion"
      option_explanations:
        - |
          No crossing lines or vertical angles are involved in this step.
        - |
          Correct. Each of D and E is equidistant from C′ and F, so each lies on the perpendicular bisector; two points determine the line.
        - |
          The forward direction would need D and E already known to be on the bisector, which is the conclusion.
        - |
          SAS requires an angle; no angle is known about C′.
      answer: 1

    - slug: geo-u02-w09-q05
      type: multiple_choice
      topic_code: "2.10"
      source: "IM Geometry, Unit 2, Lesson 10"
      points: 1
      prompt: |
        Figure description: circle with centre O; chords AB and CD with AB = CD; radii OA, OB, OC, OD drawn. Which criterion proves △OAB ≅ △OCD?
      options:
        - "ASA, because the base angles are congruent"
        - "SAS, because the central angles are congruent"
        - "SSS, because OA ≅ OC and OB ≅ OD are radii and AB ≅ CD is given"
        - "HL, because the radii are hypotenuses"
      option_explanations:
        - |
          The base angles are not given; they also follow only after congruence.
        - |
          The central angles being congruent is the conclusion to be drawn by CPCTC, not a given.
        - |
          Correct. All radii of one circle are congruent, supplying two sides; the equal chords supply the third.
        - |
          There is no right angle in these triangles in general.
      answer: 2

    - slug: geo-u02-w09-q06
      type: multiple_choice
      topic_code: "2.10"
      source: "IM Geometry, Unit 2, Lesson 10"
      points: 1
      prompt: |
        Figure description: △PQR and △PSR share side PR. PQ = PS, and ∠QPR = ∠SPR. Which criterion proves △PQR ≅ △PSR?
      options:
        - "SAS, with PQ ≅ PS, ∠QPR ≅ ∠SPR, PR ≅ PR"
        - "SSA, with PQ ≅ PS, PR ≅ PR, ∠PRQ ≅ ∠PRS"
        - "SSS, with PQ ≅ PS, QR ≅ SR, PR ≅ PR"
        - "ASA, with ∠QPR ≅ ∠SPR, PR ≅ PR, ∠PRQ ≅ ∠PRS"
      option_explanations:
        - |
          Correct. The congruent angle at P is included between PQ and PR (and between PS and PR), and PR is shared.
        - |
          The angles at R are not given, and SSA would not be valid anyway.
        - |
          QR ≅ SR is not given; it is a CPCTC conclusion.
        - |
          The angles at R are not given in the figure, so ASA cannot be set up.
      answer: 0

    - slug: geo-u02-w09-q07
      type: multiple_choice
      topic_code: "2.11"
      source: "IM Geometry, Unit 2, Lesson 11"
      points: 1
      prompt: |
        Two triangles each have a side of 9, a side of 6, and an angle of 35° opposite the side of 6. Why might they fail to be congruent?
      options:
        - "Because SSA always gives exactly one triangle"
        - "Because 35° is acute, no triangle exists"
        - "Because the side of 9 must be the hypotenuse"
        - "The 6 is less than 9 but more than 9 sin 35° ≈ 5.16, so the circle of radius 6 crosses the 35° ray twice: two different triangles fit the data"
      option_explanations:
        - |
          SSA gives one triangle only in special cases (right angle, obtuse angle, or the opposite side at least as long).
        - |
          Triangles certainly exist; the problem is that two different ones do.
        - |
          No right angle is given, so there is no hypotenuse.
        - |
          Correct. This is the ambiguous case: a sin θ < b < a gives two non-congruent triangles with the same SSA data.
      answer: 3

    - slug: geo-u02-w09-q08
      type: multiple_choice
      topic_code: "2.11"
      source: "IM Geometry, Unit 2, Lesson 11"
      points: 1
      prompt: |
        Right triangles △ABC and △DEF have right angles at B and E, AC = DF and AB = DE. Which statement is correct?
      options:
        - "They are congruent by ASA"
        - "They are congruent by HL (hypotenuse AC ≅ DF, leg AB ≅ DE)"
        - "They are not necessarily congruent, because this is SSA"
        - "They are congruent by SAS"
      option_explanations:
        - |
          Only one angle (the right angle) is given, so ASA, which needs two angles, cannot apply.
        - |
          Correct. For right triangles, the hypotenuse and one leg determine the triangle; the other leg is forced (Pythagorean theorem), reducing to SSS.
        - |
          It is SSA, but the right-angle case is exactly the one where SSA works.
        - |
          The right angle is not included between AC and AB (it is at B, between AB and BC), so SAS does not apply directly.
      answer: 1

    - slug: geo-u02-w09-q09
      type: multiple_choice
      topic_code: "2.12"
      source: "IM Geometry, Unit 2, Lesson 12"
      points: 1
      prompt: |
        Rhombus WXYZ has diagonals WY = 30 and XZ = 16. What is its side length?
      options:
        - "34"
        - "17"
        - "√916"
        - "23"
      option_explanations:
        - |
          34 = √(30² + 16²) uses the whole diagonals instead of their halves.
        - |
          Correct. The diagonals bisect each other at right angles, so half-diagonals 15 and 8 are the legs: √(225 + 64) = √289 = 17.
        - |
          √916 = √(30² + 4²) uses the wrong half of XZ.
        - |
          23 is the average of the diagonals, which has no geometric meaning here.
      answer: 1

    - slug: geo-u02-w09-q10
      type: multiple_choice
      topic_code: "2.8"
      source: "IM Geometry, Unit 2, Lesson 12"
      points: 1
      prompt: |
        Quadrilateral EFGH has diagonals EG and FH that are perpendicular bisectors of each other. Which argument shows EF = EH?
      options:
        - "EF and EH are both radii of a circle centred at E"
        - "EFGH is a rectangle"
        - "The diagonals are congruent, so the sides are congruent"
        - "E lies on the perpendicular bisector of FH, so by the Perpendicular Bisector Theorem E is equidistant from F and H"
      option_explanations:
        - |
          A circle centred at E through F need not pass through H without the bisector argument.
        - |
          Perpendicular diagonals make a rhombus, not a rectangle.
        - |
          Nothing says the diagonals are congruent, and congruent diagonals would not imply congruent sides anyway.
        - |
          Correct. EG is the perpendicular bisector of FH, and E is on EG; the forward direction of the theorem gives EF = EH. The same reasoning around the figure shows all four sides are equal.
      answer: 3

    - slug: geo-u02-w09-q11
      type: multiple_choice
      topic_code: "2.6"
      source: "IM Geometry, Unit 2, Lesson 6"
      points: 1
      prompt: |
        Review. Figure description: AB ∥ DC and AB = DC; diagonal AC is drawn. Which criterion proves △ABC ≅ △CDA?
      options:
        - "ASA: ∠B ≅ ∠D, BC ≅ DA, ∠BCA ≅ ∠DAC"
        - "SSS: AB ≅ CD, BC ≅ DA, AC ≅ CA"
        - "SAS: AB ≅ CD, ∠BAC ≅ ∠DCA (alternate interior), AC ≅ CA"
        - "AAS: ∠B ≅ ∠D, ∠BAC ≅ ∠DCA, AC ≅ CA"
      option_explanations:
        - |
          Neither ∠B ≅ ∠D nor BC ≅ DA is given; both would be CPCTC conclusions.
        - |
          BC ≅ DA is not given; it is what CPCTC will conclude.
        - |
          Correct. The parallel sides give the alternate interior angle at A and C, which is included between the given congruent side and the shared diagonal.
        - |
          ∠B ≅ ∠D is not given; it follows only after the congruence is established.
      answer: 2

    - slug: geo-u02-w09-q12
      type: multiple_choice
      topic_code: "2.8"
      source: "IM Geometry, Unit 2, Lesson 8"
      points: 1
      prompt: |
        Review. In kite ABCD with AB = AD and CB = CD, why is line AC the perpendicular bisector of BD?
      options:
        - "A and C are each equidistant from B and D, so both lie on the perpendicular bisector of BD, and two points determine the line"
        - "Because the kite has four lines of symmetry"
        - "Because AC bisects BD, and any bisector of a segment is perpendicular to it"
        - "Because AC is longer than BD"
      option_explanations:
        - |
          Correct. This is the converse of the Perpendicular Bisector Theorem applied twice.
        - |
          A kite has exactly one line of symmetry, the axis diagonal.
        - |
          A segment has many bisectors (any line through its midpoint); only one is perpendicular, and bisection alone does not give that.
        - |
          Length comparison says nothing about perpendicularity or bisection.
      answer: 0

    - slug: geo-u02-w09-q13
      type: multiple_choice
      topic_code: "1.20"
      source: "IM Geometry, Unit 1, Lesson 20"
      points: 1
      prompt: |
        Review. After proving △ABC ≅ △CDA (with AC a diagonal of quadrilateral ABCD), you obtain ∠BCA ≅ ∠DAC by CPCTC. What does this tell you about the quadrilateral?
      options:
        - "ABCD is a rhombus"
        - "AB ∥ CD, by corresponding angles"
        - "BC ∥ AD, by the converse of the alternate interior angle theorem with transversal AC"
        - "AC ⊥ BD"
      option_explanations:
        - |
          Parallel sides make a parallelogram; a rhombus needs four equal sides.
        - |
          AB ∥ CD would follow from ∠BAC ≅ ∠DCA, a different pair.
        - |
          Correct. ∠BCA and ∠DAC are alternate interior angles formed by transversal AC with lines BC and AD; their congruence makes those lines parallel.
        - |
          Nothing about the other diagonal BD has been established by this congruence.
      answer: 2

    - slug: geo-u02-w09-q14
      type: multi_select
      topic_code: "2.10"
      source: "IM Geometry, Unit 2, Lesson 10"
      points: 2
      partial_credit: true
      prompt: |
        For each set of information about △ABC and △DEF, decide whether it guarantees congruence. Select all sets that do.
      options:
        - "AB ≅ DE, BC ≅ EF, CA ≅ FD"
        - "∠A ≅ ∠D, ∠B ≅ ∠E, ∠C ≅ ∠F"
        - "∠B = ∠E = 90°, AC ≅ DF, BC ≅ EF"
        - "AB ≅ DE, BC ≅ EF, ∠A ≅ ∠D (acute)"
        - "∠A ≅ ∠D, ∠C ≅ ∠F, AB ≅ DE"
      option_explanations:
        - |
          Yes: three pairs of congruent sides is the SSS criterion.
        - |
          No: AAA gives similar triangles that may differ in size.
        - |
          Yes: HL, with hypotenuse AC/DF and leg BC/EF.
        - |
          No: the angle at A is not between AB and BC, so this is SSA with an acute angle and may give two triangles.
        - |
          Yes: AAS (the third angles match, so AB is included between ∠A and ∠B).
      answer: [0, 2, 4]

    - slug: geo-u02-w09-q15
      type: multi_select
      topic_code: "2.12"
      source: "IM Geometry, Unit 2, Lesson 12"
      points: 2
      partial_credit: true
      prompt: |
        Which statements are true for every rhombus? Select all that apply.
      options:
        - "Each diagonal bisects the angles at its endpoints"
        - "The diagonals are perpendicular"
        - "The diagonals bisect each other"
        - "All four angles are congruent"
        - "The diagonals are congruent"
      option_explanations:
        - |
          True: the kite theorem applied to each diagonal.
        - |
          True: the rhombus is a kite in both directions, and a kite's axis is perpendicular to the other diagonal.
        - |
          True: each diagonal is the perpendicular bisector of the other.
        - |
          False: a rhombus generally has two acute and two obtuse angles; only a square has four congruent angles.
        - |
          False: only a square has congruent diagonals.
      answer: [0, 1, 2]

    - slug: geo-u02-w09-q16
      type: true_false
      topic_code: "2.11"
      source: "IM Geometry, Unit 2, Lesson 11"
      points: 1
      prompt: |
        True or false: if two triangles have two pairs of congruent sides and the angles opposite the longer of those sides are congruent, the triangles must be congruent.
      answer: true
      explanation: |
        True. When the side opposite the given angle is the longer of the two, the circle used in the SSA construction crosses the ray only once on the correct side, so the triangle is determined. The ambiguous case needs the angle opposite the shorter side.

    - slug: geo-u02-w09-q17
      type: true_false
      topic_code: "2.7"
      source: "IM Geometry, Unit 2, Lesson 7"
      points: 1
      prompt: |
        Review. True or false: in a proof using ASA, the congruent side must be the side that joins the vertices of the two congruent angles.
      answer: true
