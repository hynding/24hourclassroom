      points: 3
      prompt: |
        Figure description: quadrilateral ABCD with AB = CD and AD = CB. Diagonal AC is drawn. Answer (a), (b) and (c).

        (a) Write a two-column proof that △ABC ≅ △CDA.
        (b) Using CPCTC, show that AB ∥ CD.
        (c) Using CPCTC again, show that AD ∥ CB, and state what kind of quadrilateral ABCD is.
      answer: |
        (a) 1. AB ≅ CD — given. 2. BC ≅ DA — given. 3. AC ≅ CA — reflexive. 4. △ABC ≅ △CDA — SSS. (b) ∠BAC ≅ ∠DCA by CPCTC. These are alternate interior angles for transversal AC with lines AB and CD, so AB ∥ CD by the converse of the alternate interior angle theorem. (c) ∠BCA ≅ ∠DAC by CPCTC; these are alternate interior angles for transversal AC with lines BC and DA, so AD ∥ CB. Both pairs of opposite sides are parallel, so ABCD is a parallelogram.
      explanation: |
        1 point for (a): three congruences with reasons and SSS, with the correspondence A ↔ C, B ↔ D, C ↔ A. 1 point for (b): the correct angle pair and the converse theorem. 1 point for (c): the other pair and the conclusion "parallelogram".

    - slug: geo-u02-w09-q25
      type: long_answer
      topic_code: "2.9"
      source: "IM Geometry, Unit 2, Lesson 9"
      points: 6
      prompt: |
        Prove the SSS criterion: if AB ≅ DE, BC ≅ EF and CA ≅ FD, then △ABC ≅ △DEF. Write the proof as a sequence of rigid motions. Justify why the image of B lands on E, why the image C′ of C is at the same distances from D and E as F is, and why (if C′ ≠ F) reflecting across line DE sends C′ to F. Name every theorem you use. Then explain in one or two sentences why this proof could not have been written in week 7, before the Perpendicular Bisector Theorem was proved.
      answer: |
        Step 1. Translate by the directed segment from A to D. The image of A is D. (Translations are rigid motions.)

        Step 2. Rotate about D so that the image of B lies on ray DE. Rigid motions preserve length, so the image of B is at distance AB = DE from D along ray DE. The only point on ray DE at distance DE from D is E, so the image of B is E. D is the centre, so it stays fixed.

        Step 3. Let C′ be the image of C after these two motions. Rigid motions preserve length, so DC′ = AC = DF and EC′ = BC = EF. If C′ = F, the two motions already carry A → D, B → E, C → F and we are done.

        Step 4. If C′ ≠ F: D is equidistant from C′ and F (DC′ = DF), so by the converse of the Perpendicular Bisector Theorem, D lies on the perpendicular bisector of segment C′F. Likewise E is equidistant from C′ and F, so E lies on that perpendicular bisector. Two points determine a line, so line DE is the perpendicular bisector of C′F. By the definition of reflection, the reflection across line DE sends C′ to F; it fixes D and E because they lie on the mirror. Reflections are rigid motions.

        Conclusion. The sequence translate, rotate, (reflect) is a sequence of rigid motions sending A → D, B → E, C → F, so by the definition of congruence △ABC ≅ △DEF. ∎

        Why not in week 7. The final step depends on knowing that a point equidistant from two points lies on their perpendicular bisector (the converse of the Perpendicular Bisector Theorem). That was used informally earlier but was only proved, using SAS, in week 8; a proof that cites an unproved claim is not complete.
      explanation: |
        Scoring (6 points): 1 for the translation and the rotation with B landing on E justified by preserved length and the unique point on the ray; 1 for DC′ = DF and EC′ = EF from length preservation; 2 for the perpendicular-bisector argument (converse theorem at D and at E, two points determine the line); 1 for the reflection sending C′ to F with D and E fixed, and the congruence conclusion; 1 for the explanation about the dependence on the Perpendicular Bisector Theorem proved in week 8.
