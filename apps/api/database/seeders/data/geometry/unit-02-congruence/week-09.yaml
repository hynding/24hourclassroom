        1 point for (a): distance 5 and tangency at r = 5. 1 point for (b): two triangles with the "between 5 and 10" reasoning. 1 point for (c): one triangle because r exceeds PQ, so the second crossing is behind P.

    - slug: geo-u02-w09-q24
