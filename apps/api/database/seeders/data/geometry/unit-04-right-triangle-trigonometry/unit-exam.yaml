    - slug: geo-u04-exam-q42
      type: short_answer
      topic_code: "4.8"
      source: "IM Geometry, Unit 4, Lesson 8"
      points: 3
      prompt: |
        Using a right triangle with legs a (opposite θ), b (adjacent to θ) and hypotenuse c, prove that sin² θ + cos² θ = 1, and explain what this identity lets you do when only one of sin θ or cos θ is known.
      answer: |
        sin θ = a/c and cos θ = b/c, so sin² θ + cos² θ = a²/c² + b²/c² = (a² + b²)/c². By the Pythagorean theorem a² + b² = c², so the sum is c²/c² = 1. Given one of the two values, the identity gives the other without finding the angle: if sin θ = 0.6 then cos θ = √(1 − 0.36) = 0.8, and then tan θ = sin θ / cos θ = 0.75.
      explanation: |
        1 point for writing the two ratios and adding their squares to (a² + b²)/c². 1 point for applying the Pythagorean theorem to get 1. 1 point for the use: finding the other ratio (and hence the tangent) from one known ratio, with a correct example.

    - slug: geo-u04-exam-q43
      type: short_answer
      topic_code: "4.11"
      source: "IM Geometry, Unit 4, Lesson 11"
      points: 3
      prompt: |
        Explain how a regular n-gon inscribed in a circle of radius 1 and a regular n-gon circumscribed about it together prove that n sin(180°/n) < π < n tan(180°/n). Say where each inequality comes from and what right triangle gives each formula.
      answer: |
        Join the centre to two adjacent vertices and drop the perpendicular to the side: a right triangle with angle 180°/n at the centre. Inscribed: the hypotenuse is the radius 1, so half a side is sin(180°/n), the perimeter is 2n sin(180°/n), and since the polygon lies inside the circle its perimeter is less than the circumference 2π. Circumscribed: the perpendicular (apothem) is the radius 1, so half a side is tan(180°/n), the perimeter is 2n tan(180°/n), and since the polygon contains the circle its perimeter is greater than 2π. Dividing both inequalities by 2 gives n sin(180°/n) < π < n tan(180°/n).
      explanation: |
        1 point for the right triangle with angle 180°/n and the two cases (hypotenuse 1 versus apothem 1). 1 point for the inscribed perimeter 2n sin(180°/n) with the reason it is below 2π. 1 point for the circumscribed perimeter 2n tan(180°/n) with the reason it is above 2π, and the division by 2.

    - slug: geo-u04-exam-q44
      type: long_answer
      topic_code: "4.10"
      source: "IM Geometry, Unit 4, Lesson 10"
      points: 8
      prompt: |
        A zip line runs from the top of a 24 m tower straight down to an anchor on level ground, and the cable makes a 32° angle with the ground. (sin 32° ≈ 0.530, cos 32° ≈ 0.848, tan 32° ≈ 0.625)

        (a) Find the length of the cable and the horizontal distance from the tower to the anchor, to one decimal place, stating the ratio used for each.
        (b) A safety rule says the cable's angle with the ground must be at most 35°. A second tower, 30 m tall, is to use the same anchor. Find the angle its cable would make with the ground and decide whether it meets the rule.
        (c) For the 30 m tower, find the minimum horizontal distance to an anchor that meets the 35° rule, and the cable length in that case. (tan 35° ≈ 0.700, sin 35° ≈ 0.574)
        (d) Explain why, for a fixed tower height, moving the anchor farther away always decreases the angle, using what you know about how the tangent changes with the angle.
      answer: |
        (a) The tower (24 m) is the leg opposite the 32° angle. Cable = 24 / sin 32° ≈ 24 / 0.530 ≈ 45.3 m (sine, opposite and hypotenuse). Horizontal distance = 24 / tan 32° ≈ 24 / 0.625 ≈ 38.4 m (tangent, the two legs). Check: 38.4² + 24² ≈ 1475 + 576 = 2051 ≈ 45.3² ≈ 2052.
        (b) With the same anchor, the horizontal distance is 38.4 m and the height is 30 m, so tan θ = 30/38.4 ≈ 0.781 and θ = tan⁻¹(0.781) ≈ 38.0°. That exceeds 35°, so the rule is not met.
        (c) The angle is 35° exactly when tan 35° = 30/d, so d = 30 / 0.700 ≈ 42.9 m; any anchor at least 42.9 m away meets the rule. The cable is then 30 / sin 35° ≈ 30 / 0.574 ≈ 52.3 m.
        (d) tan θ = height / distance. For a fixed height, a larger distance makes the ratio smaller. The tangent increases as the angle increases (the opposite leg grows relative to the adjacent leg), so a smaller tangent means a smaller angle. Therefore moving the anchor farther away always lowers the angle.
      explanation: |
        Scoring (8 points). (a) 1 point for the cable ≈ 45.3 m with sine; 1 point for the distance ≈ 38.4 m with tangent. (b) 1 point for tan θ = 30/38.4; 1 point for θ ≈ 38.0° and the judgement that the rule is not met. (c) 1 point for d ≈ 42.9 m; 1 point for the cable ≈ 52.3 m. (d) 1 point for the ratio argument (fixed height over larger distance is smaller); 1 point for linking a smaller tangent to a smaller angle because tangent increases with the angle.
