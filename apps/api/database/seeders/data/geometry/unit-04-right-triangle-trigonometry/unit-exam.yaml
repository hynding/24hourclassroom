unit: 4
description: |
  44 questions · about 80 minutes · covers every lesson of Unit 4 (steepness, the 45-45-90 and 30-60-90
  triangles, the ratio table, sine, cosine and tangent, finding sides and angles, elevation and depression,
  ladders and wires, the complementary-angle and Pythagorean identities, regular polygons and approximating π)
  with some review of Units 1–3. Multiple choice, select-all, true/false and numeric items are graded at once;
  fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
  teacher against the scoring notes. A calculator in degree mode is expected.
questions:
    - slug: geo-u04-exam-q01
      type: multiple_choice
      topic_code: "4.6"
      source: "IM Geometry, Unit 4, Lesson 6"
      points: 1
      stimulus: |
        Figure description: right triangle PQR with the right angle at R. ∠P = 28° and the hypotenuse PQ = 30. Calculator values: sin 28° ≈ 0.4695, cos 28° ≈ 0.8829, tan 28° ≈ 0.5317.
      prompt: |
        What is the length of QR, to one decimal place?
      options:
        - "14.1"
        - "26.5"
        - "16.0"
        - "63.9"
      option_explanations:
        - |
          Correct. QR is opposite the 28° angle and PQ is the hypotenuse: QR = 30 sin 28° ≈ 14.1.
        - |
          26.5 is PR, the adjacent leg (30 cos 28°).
        - |
          16.0 multiplies the hypotenuse by tan 28°, mixing the hypotenuse with a leg-to-leg ratio.
        - |
          63.9 divides 30 by sin 28°, which makes a leg longer than the hypotenuse.
      answer: 0

    - slug: geo-u04-exam-q02
      type: multiple_choice
      topic_code: "4.6"
      source: "IM Geometry, Unit 4, Lesson 6"
      points: 1
      stimulus: |
        Figure description: right triangle PQR with the right angle at R. ∠P = 28° and the hypotenuse PQ = 30. Calculator values: sin 28° ≈ 0.4695, cos 28° ≈ 0.8829, tan 28° ≈ 0.5317.
      prompt: |
        What is the length of PR, to one decimal place?
      options:
        - "26.5"
        - "14.1"
        - "34.0"
        - "56.4"
      option_explanations:
        - |
          Correct. PR is adjacent to the 28° angle: PR = 30 cos 28° ≈ 26.5. Check: 14.1² + 26.5² ≈ 199 + 702 ≈ 901 ≈ 30².
        - |
          14.1 is the opposite leg QR (30 sin 28°), not the adjacent leg PR.
        - |
          34.0 divides 30 by cos 28°, giving a leg longer than the hypotenuse.
        - |
          56.4 divides 30 by tan 28°, which has no meaning when 30 is the hypotenuse.
      answer: 0

    - slug: geo-u04-exam-q03
      type: multiple_choice
      topic_code: "4.8"
      source: "IM Geometry, Unit 4, Lesson 8"
      points: 1
      stimulus: |
        Figure description: right triangle PQR with the right angle at R. ∠P = 28° and the hypotenuse PQ = 30. Calculator values: sin 28° ≈ 0.4695, cos 28° ≈ 0.8829, tan 28° ≈ 0.5317.
      prompt: |
        What are ∠Q and sin Q?
      options:
        - "∠Q = 62° and sin Q = cos 28° ≈ 0.8829"
        - "∠Q = 62° and sin Q = sin 28° ≈ 0.4695"
        - "∠Q = 152° and sin Q ≈ 0.4695"
        - "∠Q = 62° and sin Q = 1 − sin 28° ≈ 0.5305"
      option_explanations:
        - |
          Correct. The acute angles are complementary, so ∠Q = 62°, and the leg opposite Q is PR, which is adjacent to P, so sin Q = PR/PQ = cos P.
        - |
          sin Q = PR/PQ, the other leg over the hypotenuse, not QR/PQ.
        - |
          The angles of a triangle sum to 180°, and the right angle takes 90°, so ∠Q = 62°.
        - |
          Sines of complementary angles are not related by subtraction from 1; sin Q = cos P.
      answer: 0

    - slug: geo-u04-exam-q04
      type: multiple_choice
      topic_code: "4.1"
      source: "IM Geometry, Unit 4, Lesson 1"
      points: 1
      prompt: |
        A road has a 7 % grade, meaning it rises 7 m for every 100 m of horizontal distance. Which statement is correct?
      options:
        - "The road makes an angle of tan⁻¹(0.07) ≈ 4.0° with the horizontal"
        - "The road makes an angle of 7° with the horizontal"
        - "The road makes an angle of sin⁻¹(7) with the horizontal"
        - "The road makes an angle of 0.07° with the horizontal"
      option_explanations:
        - |
          Correct. Rise over run is the tangent of the angle, so the angle is tan⁻¹(0.07) ≈ 4.0°.
        - |
          A grade is a ratio, not an angle in degrees; 7 % corresponds to about 4°.
        - |
          sin⁻¹ accepts only inputs between 0 and 1, and the grade is a ratio of legs (a tangent), not a sine.
        - |
          0.07 is the ratio itself; converting to an angle needs the inverse tangent.
      answer: 0

    - slug: geo-u04-exam-q05
      type: multiple_choice
      topic_code: "4.1"
      source: "IM Geometry, Unit 4, Lesson 1"
      points: 1
      prompt: |
        Why do all right triangles with a 35° angle have the same value of opposite/hypotenuse?
      options:
        - "They are similar by AA, and similar triangles have equal ratios of corresponding sides"
        - "They are congruent by ASA"
        - "Because the hypotenuse is always the same length"
        - "Because opposite/hypotenuse is always 0.5"
      option_explanations:
        - |
          Correct. The 35° angle and the right angle give two congruent angle pairs; the similarity preserves every ratio of lengths within the triangle.
        - |
          ASA needs a congruent side; the triangles can be any size, so they are similar rather than congruent.
        - |
          Hypotenuses vary; what is fixed is the ratio of each leg to the hypotenuse.
        - |
          0.5 is sin 30°, not sin 35° ≈ 0.574; the ratio depends on the angle, not on a fixed constant.
      answer: 0

    - slug: geo-u04-exam-q06
      type: multiple_choice
      topic_code: "4.2"
      source: "IM Geometry, Unit 4, Lesson 2"
      points: 1
      prompt: |
        An isosceles right triangle has hypotenuse 9. What is the length of each leg?
      options:
        - "9/√2 = 9√2/2 ≈ 6.36"
        - "9√2 ≈ 12.73"
        - "4.5"
        - "9/√3 ≈ 5.20"
      option_explanations:
        - |
          Correct. The legs are equal and 2x² = 81, so x = 9/√2 ≈ 6.36.
        - |
          9√2 is the hypotenuse of an isosceles right triangle with legs 9, not the leg when the hypotenuse is 9.
        - |
          4.5 would satisfy 2x² = 40.5, not 81; a leg is the hypotenuse divided by √2, not by 2.
        - |
          √3 belongs to the 30-60-90 triangle; an isosceles right triangle has the ratio 1 : 1 : √2.
      answer: 0

    - slug: geo-u04-exam-q07
      type: multiple_choice
      topic_code: "4.3"
      source: "IM Geometry, Unit 4, Lesson 3"
      points: 1
      prompt: |
        A 30-60-90 triangle has short leg 7. What are its other two sides?
      options:
        - "Long leg 7√3 and hypotenuse 14"
        - "Long leg 14 and hypotenuse 7√3"
        - "Long leg 7√2 and hypotenuse 14"
        - "Long leg 7√3 and hypotenuse 21"
      option_explanations:
        - |
          Correct. The sides are in the ratio 1 : √3 : 2, so 7 : 7√3 : 14.
        - |
          The hypotenuse (opposite the right angle) is the longest side; 7√3 ≈ 12.1 is shorter than 14.
        - |
          √2 belongs to the 45-45-90 triangle; the long leg here is 7√3.
        - |
          The hypotenuse is twice the short leg, not three times.
      answer: 0

    - slug: geo-u04-exam-q08
      type: multiple_choice
      topic_code: "4.3"
      source: "IM Geometry, Unit 4, Lesson 3"
      points: 1
      prompt: |
        An equilateral triangle has side 10. What is its area?
      options:
        - "25√3 ≈ 43.3"
        - "50"
        - "50√3 ≈ 86.6"
        - "25√2 ≈ 35.4"
      option_explanations:
        - |
          Correct. The height is 5√3 (long leg of a 30-60-90 triangle with short leg 5), so the area is ½ · 10 · 5√3 = 25√3.
        - |
          50 uses a side as the height; the height is 5√3 ≈ 8.66, not 10.
        - |
          50√3 forgets the ½ in the triangle area formula.
        - |
          √2 comes from half a square, not from half an equilateral triangle.
      answer: 0

    - slug: geo-u04-exam-q09
      type: multiple_choice
      topic_code: "4.4"
      source: "IM Geometry, Unit 4, Lesson 4"
      points: 1
      prompt: |
        A table lists, for 20°: adjacent/hypotenuse ≈ 0.940, opposite/hypotenuse ≈ 0.342, opposite/adjacent ≈ 0.364. Which row must the table have for 70°?
      options:
        - "adjacent/hypotenuse ≈ 0.342, opposite/hypotenuse ≈ 0.940, opposite/adjacent ≈ 2.747"
        - "adjacent/hypotenuse ≈ 0.940, opposite/hypotenuse ≈ 0.342, opposite/adjacent ≈ 0.364"
        - "adjacent/hypotenuse ≈ 0.342, opposite/hypotenuse ≈ 0.940, opposite/adjacent ≈ 0.364"
        - "adjacent/hypotenuse ≈ 0.658, opposite/hypotenuse ≈ 0.060, opposite/adjacent ≈ 2.747"
      option_explanations:
        - |
          Correct. 20° and 70° are complementary: the opposite leg of one is the adjacent leg of the other, so the first two columns swap, and opposite/adjacent inverts to 1/0.364 ≈ 2.747.
        - |
          Copying the 20° row would mean the two acute angles have the same ratios, which is false unless both are 45°.
        - |
          The first two entries are right, but opposite/adjacent for 70° is the reciprocal of 0.364, about 2.747, not 0.364 again.
        - |
          Ratios are not found by subtracting from 1; the entries swap between complementary angles.
      answer: 0

    - slug: geo-u04-exam-q10
      type: multiple_choice
      topic_code: "4.5"
      source: "IM Geometry, Unit 4, Lesson 5"
      points: 1
      prompt: |
        A right triangle has legs 20 and 21 and hypotenuse 29. For the angle θ opposite the leg 20, which values are correct?
      options:
        - "sin θ = 20/29, cos θ = 21/29, tan θ = 20/21"
        - "sin θ = 21/29, cos θ = 20/29, tan θ = 21/20"
        - "sin θ = 20/21, cos θ = 21/29, tan θ = 20/29"
        - "sin θ = 20/29, cos θ = 21/29, tan θ = 21/20"
      option_explanations:
        - |
          Correct. Opposite 20, adjacent 21, hypotenuse 29: SOH-CAH-TOA gives exactly these three ratios.
        - |
          These are the ratios for the other acute angle, the one opposite the leg 21.
        - |
          sin θ must have the hypotenuse as its denominator, and tan θ compares the two legs.
        - |
          tan θ = opposite/adjacent = 20/21; 21/20 is the tangent of the other acute angle.
      answer: 0

    - slug: geo-u04-exam-q11
      type: multiple_choice
      topic_code: "4.5"
      source: "IM Geometry, Unit 4, Lesson 5"
      points: 1
      prompt: |
        Which of these is the exact value of tan 30°?
      options:
        - "1/√3 = √3/3"
        - "√3"
        - "1/2"
        - "√3/2"
      option_explanations:
        - |
          Correct. From the 30° angle, the opposite leg is 1 and the adjacent leg is √3 in the 1 : √3 : 2 triangle.
        - |
          √3 is tan 60°, the long leg over the short leg.
        - |
          1/2 is sin 30°, the short leg over the hypotenuse, not a ratio of the two legs.
        - |
          √3/2 is cos 30°, the long leg over the hypotenuse, not a ratio of the two legs.
      answer: 0

    - slug: geo-u04-exam-q12
      type: multiple_choice
      topic_code: "4.6"
      source: "IM Geometry, Unit 4, Lesson 6"
      points: 1
      prompt: |
        A right triangle has a 50° angle whose adjacent leg is 12. Which expression gives the hypotenuse? (sin 50° ≈ 0.766, cos 50° ≈ 0.643, tan 50° ≈ 1.192)
      options:
        - "12 / cos 50° ≈ 18.7"
        - "12 cos 50° ≈ 7.7"
        - "12 / sin 50° ≈ 15.7"
        - "12 tan 50° ≈ 14.3"
      option_explanations:
        - |
          Correct. cos 50° = 12/hyp, and the wanted side is in the denominator, so hyp = 12/0.643 ≈ 18.7.
        - |
          Multiplying gives a hypotenuse shorter than the leg, which is impossible.
        - |
          Sine pairs the opposite leg with the hypotenuse; 12 is the adjacent leg.
        - |
          12 tan 50° is the opposite leg, not the hypotenuse.
      answer: 0

    - slug: geo-u04-exam-q13
      type: multiple_choice
      topic_code: "4.6"
      source: "IM Geometry, Unit 4, Lesson 6"
      points: 1
      prompt: |
        A student needs the leg opposite a 38° angle when the adjacent leg is 50. Which ratio should be used, and what is the result? (tan 38° ≈ 0.781, sin 38° ≈ 0.616, cos 38° ≈ 0.788)
      options:
        - "Tangent: 50 tan 38° ≈ 39.1"
        - "Sine: 50 sin 38° ≈ 30.8"
        - "Cosine: 50 cos 38° ≈ 39.4"
        - "Tangent: 50 / tan 38° ≈ 64.0"
      option_explanations:
        - |
          Correct. The two legs are involved, so tangent; the wanted leg is on top, so multiply.
        - |
          Sine pairs the opposite leg with the hypotenuse, but 50 is a leg, not the hypotenuse.
        - |
          Cosine involves the hypotenuse, which is neither given nor wanted.
        - |
          Dividing finds the adjacent leg from the opposite leg, the reverse of this problem.
      answer: 0

    - slug: geo-u04-exam-q14
      type: multiple_choice
      topic_code: "4.11"
      source: "IM Geometry, Unit 4, Lesson 11"
      points: 1
      stimulus: |
        Figure description: a regular decagon (10 sides) is inscribed in a circle of radius 5. The centre O is joined to two adjacent vertices A and B, and M is the midpoint of side AB. Calculator values: sin 18° ≈ 0.3090, cos 18° ≈ 0.9511, tan 18° ≈ 0.3249.
      prompt: |
        What is the measure of ∠AOM, and what is the length of OA?
      options:
        - "∠AOM = 18° and OA = 5"
        - "∠AOM = 36° and OA = 5"
        - "∠AOM = 18° and OA = 5 cos 18°"
        - "∠AOM = 36° and OA = 10"
      option_explanations:
        - |
          Correct. The central angle AOB is 360°/10 = 36°, and OM bisects it; OA is a radius of the circle, 5.
        - |
          36° is the full central angle AOB; the right triangle AOM has half of it.
        - |
          5 cos 18° ≈ 4.76 is OM, the apothem; OA is the hypotenuse, equal to the radius.
        - |
          OA is a radius (5), not a diameter, and ∠AOM is half the central angle.
      answer: 0

    - slug: geo-u04-exam-q15
      type: multiple_choice
      topic_code: "4.11"
      source: "IM Geometry, Unit 4, Lesson 11"
      points: 1
      stimulus: |
        Figure description: a regular decagon (10 sides) is inscribed in a circle of radius 5. The centre O is joined to two adjacent vertices A and B, and M is the midpoint of side AB. Calculator values: sin 18° ≈ 0.3090, cos 18° ≈ 0.9511, tan 18° ≈ 0.3249.
      prompt: |
        What is the perimeter of the decagon, to one decimal place?
      options:
        - "30.9"
        - "15.5"
        - "32.5"
        - "47.6"
      option_explanations:
        - |
          Correct. AM = 5 sin 18° ≈ 1.545, so AB ≈ 3.090 and the perimeter is 10 × 3.090 ≈ 30.9.
        - |
          15.5 is ten half-sides; each side is twice AM.
        - |
          32.5 uses tan 18° instead of sin 18°, which is the circumscribed decagon's perimeter.
        - |
          47.6 is ten apothems (10 × 5 cos 18°), not ten sides.
      answer: 0

    - slug: geo-u04-exam-q16
      type: multiple_choice
      topic_code: "4.11"
      source: "IM Geometry, Unit 4, Lesson 11"
      points: 1
      stimulus: |
        Figure description: a regular decagon (10 sides) is inscribed in a circle of radius 5. The centre O is joined to two adjacent vertices A and B, and M is the midpoint of side AB. Calculator values: sin 18° ≈ 0.3090, cos 18° ≈ 0.9511, tan 18° ≈ 0.3249.
      prompt: |
        What is the area of the decagon, to one decimal place, and how does it compare with the circle's area?
      options:
        - "About 73.5, which is less than the circle's area 25π ≈ 78.5"
        - "About 73.5, which is more than the circle's area 25π ≈ 78.5"
        - "About 147.0, which is more than the circle's area"
        - "About 78.5, the same as the circle's area"
      option_explanations:
        - |
          Correct. Area = ½ · perimeter · apothem = ½ · 30.9 · 5 cos 18° ≈ ½ · 30.9 · 4.755 ≈ 73.5, and an inscribed polygon lies inside the circle.
        - |
          73.5 is correct but an inscribed polygon's area is always less than the circle's.
        - |
          147.0 forgets the ½ in the area formula.
        - |
          The decagon leaves ten small circular segments uncovered, so its area is strictly less than 25π.
      answer: 0

    - slug: geo-u04-exam-q17
      type: multiple_choice
      topic_code: "4.7"
      source: "IM Geometry, Unit 4, Lesson 7"
      points: 1
      prompt: |
        From a point 15 m from the base of a flagpole, the angle of elevation of the top is 62°. How tall is the flagpole? (tan 62° ≈ 1.881)
      options:
        - "About 28.2 m"
        - "About 8.0 m"
        - "About 13.2 m"
        - "About 32.0 m"
      option_explanations:
        - |
          Correct. Height = 15 tan 62° ≈ 15 × 1.881 ≈ 28.2 m.
        - |
          8.0 divides 15 by tan 62°, which would find the distance from a known height.
        - |
          13.2 is 15 sin 62°, treating 15 m as the hypotenuse instead of the horizontal leg.
        - |
          32.0 is 15 / cos 62°, the length of the line of sight, not the height.
      answer: 0

    - slug: geo-u04-exam-q18
      type: multiple_choice
      topic_code: "4.7"
      source: "IM Geometry, Unit 4, Lesson 7"
      points: 1
      prompt: |
        From a 40 m cliff top, a swimmer is seen at an angle of depression of 22°. How far is the swimmer from the base of the cliff? (tan 22° ≈ 0.404)
      options:
        - "About 99 m"
        - "About 16 m"
        - "About 43 m"
        - "About 107 m"
      option_explanations:
        - |
          Correct. The angle of elevation from the swimmer is also 22° (alternate interior angles), so distance = 40 / tan 22° ≈ 99 m.
        - |
          16 m multiplies 40 by tan 22°, which would find a height from a distance.
        - |
          43 m is 40 / cos 22°, the length of the line of sight, not the horizontal distance.
        - |
          107 m is 40 / sin 22°, which also gives the line of sight (approximately), not the ground distance.
      answer: 0

    - slug: geo-u04-exam-q19
      type: multiple_choice
      topic_code: "4.7"
      source: "IM Geometry, Unit 4, Lesson 7"
      points: 1
      prompt: |
        A 7 m ladder makes a 70° angle with level ground. How far is its foot from the wall, and how high does it reach? (sin 70° ≈ 0.940, cos 70° ≈ 0.342)
      options:
        - "Foot 7 cos 70° ≈ 2.4 m; height 7 sin 70° ≈ 6.6 m"
        - "Foot 7 sin 70° ≈ 6.6 m; height 7 cos 70° ≈ 2.4 m"
        - "Foot 7 / cos 70° ≈ 20.5 m; height 7 / sin 70° ≈ 7.4 m"
        - "Foot 7 tan 70° ≈ 19.2 m; height 7 m"
      option_explanations:
        - |
          Correct. The foot distance is adjacent to the 70° angle and the height is opposite; the ladder is the hypotenuse.
        - |
          The sine goes with the opposite side (the height), the cosine with the adjacent side (the foot distance); these are swapped.
        - |
          Dividing by the ratios gives lengths longer than the ladder, which is impossible for its legs.
        - |
          Tangent relates the two legs and the ladder (hypotenuse) is not a leg; the height is less than 7 m.
      answer: 0

    - slug: geo-u04-exam-q20
      type: multiple_choice
      topic_code: "4.8"
      source: "IM Geometry, Unit 4, Lesson 8"
      points: 1
      prompt: |
        If cos θ = 0.8 for an acute angle θ, what are sin θ and tan θ?
      options:
        - "sin θ = 0.6 and tan θ = 0.75"
        - "sin θ = 0.2 and tan θ = 0.25"
        - "sin θ = 0.8 and tan θ = 1"
        - "sin θ = 0.6 and tan θ = 1.33"
      option_explanations:
        - |
          Correct. sin² θ = 1 − 0.64 = 0.36, so sin θ = 0.6, and tan θ = 0.6/0.8 = 0.75 (the 3-4-5 triangle).
        - |
          Sine and cosine do not add to 1; their squares do.
        - |
          sin θ = cos θ only at 45°, where both are about 0.707.
        - |
          tan θ = sin θ / cos θ = 0.6/0.8, not 0.8/0.6.
      answer: 0

    - slug: geo-u04-exam-q21
      type: multiple_choice
      topic_code: "4.8"
      source: "IM Geometry, Unit 4, Lesson 8"
      points: 1
      prompt: |
        Which expression equals cos 41° exactly?
      options:
        - "sin 49°"
        - "sin 41°"
        - "1 − sin 41°"
        - "cos 49°"
      option_explanations:
        - |
          Correct. 41° + 49° = 90°, and the cosine of an angle is the sine of its complement.
        - |
          sin 41° ≈ 0.656 while cos 41° ≈ 0.755; they differ for every angle but 45°.
        - |
          1 − sin 41° ≈ 0.344, not cos 41°; the identity with 1 involves squares.
        - |
          cos 49° = sin 41°, which is not cos 41°.
      answer: 0

    - slug: geo-u04-exam-q22
      type: multiple_choice
      topic_code: "4.9"
      source: "IM Geometry, Unit 4, Lesson 9"
      points: 1
      prompt: |
        A right triangle has hypotenuse 10 and a leg 8. What is the angle between that leg and the hypotenuse?
      options:
        - "cos⁻¹(0.8) ≈ 36.9°"
        - "sin⁻¹(0.8) ≈ 53.1°"
        - "tan⁻¹(0.8) ≈ 38.7°"
        - "cos⁻¹(1.25), which is undefined"
      option_explanations:
        - |
          Correct. The leg is adjacent to the wanted angle and 10 is the hypotenuse, so cos θ = 0.8 and θ ≈ 36.9°.
        - |
          sin⁻¹(0.8) ≈ 53.1° is the angle opposite the leg 8, the other acute angle.
        - |
          Tangent needs the two legs; the other leg is 6, and tan⁻¹(6/8) ≈ 36.9° would agree, but 0.8 is not a leg ratio here.
        - |
          The hypotenuse belongs in the denominator, so the ratio is 8/10, and the triangle is a valid 6-8-10.
      answer: 0

    - slug: geo-u04-exam-q23
      type: multiple_choice
      topic_code: "4.9"
      source: "IM Geometry, Unit 4, Lesson 9"
      points: 1
      prompt: |
        A hill rises 2 m for every 7 m of horizontal distance. What is its angle with the horizontal?
      options:
        - "tan⁻¹(2/7) ≈ 15.9°"
        - "sin⁻¹(2/7) ≈ 16.6°"
        - "tan⁻¹(7/2) ≈ 74.1°"
        - "2/7 of 90° ≈ 25.7°"
      option_explanations:
        - |
          Correct. Rise and run are the two legs, so the angle is tan⁻¹(2/7).
        - |
          2/7 is a ratio of legs, not of a leg to the hypotenuse, so sin⁻¹ gives the wrong angle.
        - |
          7/2 is the tangent of the other acute angle (the angle with the vertical).
        - |
          Angles are not proportional to the ratio; the inverse tangent is needed.
      answer: 0

    - slug: geo-u04-exam-q24
      type: multiple_choice
      topic_code: "4.10"
      source: "IM Geometry, Unit 4, Lesson 10"
      points: 1
      prompt: |
        A guy wire runs from the top of an 18 m mast to the ground, making a 55° angle with the ground. How long is the wire and how far is the anchor from the base? (sin 55° ≈ 0.819, tan 55° ≈ 1.428)
      options:
        - "Wire 18 / sin 55° ≈ 22.0 m; anchor 18 / tan 55° ≈ 12.6 m"
        - "Wire 18 sin 55° ≈ 14.7 m; anchor 18 tan 55° ≈ 25.7 m"
        - "Wire 18 / tan 55° ≈ 12.6 m; anchor 18 / sin 55° ≈ 22.0 m"
        - "Wire 18 / cos 55° ≈ 31.4 m; anchor 18 m"
      option_explanations:
        - |
          Correct. The mast is the leg opposite 55°; the wire is the hypotenuse (18 / sin 55°) and the anchor distance is the adjacent leg (18 / tan 55°).
        - |
          Multiplying the opposite leg by sine or tangent reverses both relationships; the wire must be longer than the mast.
        - |
          The two answers are swapped: the wire (hypotenuse) is the longer of the two.
        - |
          18 / cos 55° would apply if 18 were the adjacent leg, but it is the opposite leg (the mast is vertical).
      answer: 0

