      prompt: |
        Review. A student measures a right triangle with a 38° angle and finds opposite leg 4.9 and adjacent leg 6.3, so opposite/adjacent ≈ 0.78. A second student draws a much larger right triangle with a 38° angle and gets opposite leg 24.5 and adjacent leg 31.5. Without measuring angles, explain why the second student's ratio must also be 0.78, naming the similarity criterion used.
      answer: |
        Both triangles have a 38° angle and a 90° angle, so they are similar by AA. Similar triangles have all corresponding side ratios equal, and in particular the ratio of the leg opposite 38° to the leg adjacent to 38° is the same in both. Checking: 24.5/31.5 ≈ 0.78, and the scale factor is 5 (24.5/4.9 = 31.5/6.3 = 5), confirming SSS∼ as well.
      explanation: |
        1 point for naming AA with the two angle pairs (38° and 90°). 1 point for the statement that similar triangles have equal ratios of corresponding sides (ratios within a figure are preserved). 1 point for verifying numerically (24.5/31.5 ≈ 0.78 or the scale factor 5).

    - slug: geo-u04-w15-q24
      type: short_answer
      topic_code: "4.2"
      source: "IM Geometry, Unit 4, Lesson 2"
      points: 3
      prompt: |
        Explain why cutting a square along a diagonal produces two triangles with angles 45°, 45° and 90°, and derive the ratio of the diagonal to the side. Then find the side of a square whose diagonal is 7.
      answer: |
        The diagonal is a line of symmetry: the reflection across it fixes its two endpoints and swaps the other two vertices, so it swaps the two angles the diagonal makes with the sides at each endpoint; they are therefore equal and, since together they make the 90° corner, each is 45°. (Alternatively, the two triangles are isosceles right triangles, so the base angles are equal and sum to 90°.) With side s, the Pythagorean theorem gives diagonal² = s² + s² = 2s², so the diagonal is s√2 and diagonal/side = √2. If the diagonal is 7, the side is 7/√2 = 7√2/2 ≈ 4.95.
      explanation: |
        1 point for the symmetry or isosceles argument giving 45° angles. 1 point for diagonal = s√2 via the Pythagorean theorem. 1 point for side = 7/√2 ≈ 4.95.

    - slug: geo-u04-w15-q25
      type: long_answer
      topic_code: "4.3"
      source: "IM Geometry, Unit 4, Lesson 3"
      points: 6
      prompt: |
        A ramp for loading a truck is to rise at exactly 30° and reach the truck bed, which is 1.5 m above the ground.

        (a) Explain why the ramp, the ground and the vertical from the truck bed form a 30-60-90 triangle, and identify which side is the short leg, the long leg and the hypotenuse.
        (b) Find the length of the ramp and the horizontal distance from the truck to the foot of the ramp, exactly and to two decimal places.
        (c) The loading area is only 2.2 m long. Can the 30° ramp fit? If not, what rise-to-run ratio would a ramp that exactly fits have, and would it be steeper or shallower than 30°?
        (d) A worker suggests a 45° ramp instead. Find its length and run, and explain which of the two ramps is harder to push a load up and why.
      answer: |
        (a) The ground is horizontal and the truck bed's vertical is perpendicular to it, so they meet at a right angle; the ramp makes 30° with the ground, so the remaining angle at the top is 60°. The vertical side (1.5 m) is opposite the 30° angle, so it is the short leg; the run along the ground is opposite 60°, the long leg; the ramp is the hypotenuse.
        (b) Ramp = 2 × short leg = 3 m exactly. Run = short leg × √3 = 1.5√3 ≈ 2.60 m.
        (c) The run of 2.60 m exceeds 2.2 m, so the 30° ramp does not fit. A ramp fitting exactly has rise/run = 1.5/2.2 ≈ 0.68, which is larger than 1/√3 ≈ 0.58, so it is steeper than 30° (about 34°).
        (d) At 45° the triangle is half a square: run = rise = 1.5 m and the ramp is 1.5√2 ≈ 2.12 m. The 45° ramp is steeper (ratio 1 versus 0.58), so it is harder to push a load up: more of the load's weight acts along the ramp.
      explanation: |
        Scoring (6 points). (a) 1 point for the right angle between ground and vertical with the 60° angle at the top, and the correct identification of short leg (1.5 m vertical), long leg (run) and hypotenuse (ramp). (b) 1 point for the ramp length 3 m; 1 point for the run 1.5√3 ≈ 2.60 m. (c) 1 point for "does not fit" with the ratio 1.5/2.2 ≈ 0.68 and the conclusion that it is steeper than 30°. (d) 1 point for run 1.5 m and ramp 1.5√2 ≈ 2.12 m; 1 point for identifying the 45° ramp as harder because it is steeper.
