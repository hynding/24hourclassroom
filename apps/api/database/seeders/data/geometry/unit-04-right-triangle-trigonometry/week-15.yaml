week: 15
unit: 4
title: "Steepness, Special Triangles and Ratios"
topics: ["4.1", "4.2", "4.3", "4.4"]
guide: guides/week-15.md
guide_description: |
  Steepness as rise over run, why similar right triangles make each side ratio a function of the acute angle alone, the exact ratios of the 45-45-90 and 30-60-90 triangles, and how to build and use a table of adjacent/hypotenuse, opposite/hypotenuse and opposite/adjacent. Worked examples, Try-it problems and a self-check.
flashcards_description: |
  28 cards on steepness, opposite and adjacent legs, the half-square and half-equilateral triangles, the ratio table and its symmetry. Review them before the week 15 quiz.
flashcards:
  - front: Steepness of a ramp → definition
    back: |
      Rise divided by run: height gained per unit of horizontal distance. A 1 : 12 ramp has steepness 1/12 ≈ 0.083.
    topic_code: "4.1"
  - front: Larger steepness ratio → what happens to the angle
    back: |
      The angle with the horizontal is larger. The relationship is increasing but not proportional: doubling the ratio does not double the angle.
    topic_code: "4.1"
  - front: Why two ramps with the same rise/run make the same angle
    back: |
      Each ramp is the hypotenuse of a right triangle with legs (run, rise). Equal ratios with the included right angle give SAS∼, so the triangles are similar and the angles match.
    topic_code: "4.1"
  - front: Why all right triangles with the same acute angle are similar
    back: |
      They share the acute angle and a right angle, so AA applies. Every ratio of sides is therefore the same for all of them.
    topic_code: "4.1"
  - front: Road grade of 8 % → meaning
    back: |
      Rise/run = 0.08: 8 m of climb for every 100 m of horizontal distance. Over 2 km horizontally the climb is 160 m.
    topic_code: "4.1"
  - front: Opposite leg of an acute angle → which side
    back: |
      The leg that does not touch the angle: the one across the triangle from it.
    topic_code: "4.4"
  - front: Adjacent leg of an acute angle → which side
    back: |
      The leg that forms one side of the angle. The hypotenuse forms the other side and is never called adjacent.
    topic_code: "4.4"
  - front: Half a square → the triangle it makes
    back: |
      A 45-45-90 triangle: legs equal (1 and 1), hypotenuse √2. The diagonal bisects the right angle by the reflection symmetry of the square.
    topic_code: "4.2"
  - front: 45-45-90 side ratio
    back: |
      leg : leg : hypotenuse = 1 : 1 : √2. Leg x gives hypotenuse x√2; hypotenuse h gives legs h/√2 = h√2/2.
    topic_code: "4.2"
  - front: Ratios from a 45° angle
    back: |
      opposite/hypotenuse = adjacent/hypotenuse = 1/√2 ≈ 0.707; opposite/adjacent = 1.
    topic_code: "4.2"
  - front: Square with diagonal 9 → side
    back: |
      9/√2 ≈ 6.36. Square with side 6 → diagonal 6√2 ≈ 8.49.
    topic_code: "4.2"
  - front: Isosceles right triangle with hypotenuse 20 → legs and area
    back: |
      Legs 10√2 ≈ 14.14; area ½ · (10√2)² = 100.
    topic_code: "4.2"
  - front: Half an equilateral triangle → the triangle it makes
    back: |
      A 30-60-90 triangle. From side 2: hypotenuse 2, short leg 1 (half the base), long leg √3 (the altitude).
    topic_code: "4.3"
  - front: 30-60-90 side ratio
    back: |
      short leg : long leg : hypotenuse = 1 : √3 : 2. The short leg is opposite 30°, the long leg opposite 60°.
    topic_code: "4.3"
  - front: Ratios from a 30° angle
    back: |
      opposite/hypotenuse = 1/2; adjacent/hypotenuse = √3/2 ≈ 0.866; opposite/adjacent = 1/√3 ≈ 0.577.
    topic_code: "4.3"
  - front: Ratios from a 60° angle
    back: |
      opposite/hypotenuse = √3/2 ≈ 0.866; adjacent/hypotenuse = 1/2; opposite/adjacent = √3 ≈ 1.732.
    topic_code: "4.3"
  - front: 30-60-90 with long leg 10 → other sides
    back: |
      Short leg 10/√3 ≈ 5.77; hypotenuse 20/√3 ≈ 11.55.
    topic_code: "4.3"
  - front: Equilateral triangle with side 8 → height and area
    back: |
      Height 4√3 ≈ 6.93; area 16√3 ≈ 27.71.
    topic_code: "4.3"
  - front: A ramp at 30° reaching 1.2 m → length and run
    back: |
      Length 2.4 m (hypotenuse is twice the short leg); run 1.2√3 ≈ 2.08 m; steepness 1/√3 ≈ 0.577.
    topic_code: "4.3"
  - front: The three ratios in the table
    back: |
      adjacent/hypotenuse, opposite/hypotenuse and opposite/adjacent, each depending only on the acute angle. Next week they are named cosine, sine and tangent.
    topic_code: "4.4"
  - front: Table row for 40°
    back: |
      adjacent/hypotenuse ≈ 0.766; opposite/hypotenuse ≈ 0.643; opposite/adjacent ≈ 0.839.
    topic_code: "4.4"
  - front: Table row for 70°
    back: |
      adjacent/hypotenuse ≈ 0.342; opposite/hypotenuse ≈ 0.940; opposite/adjacent ≈ 2.747.
    topic_code: "4.4"
  - front: How the table changes as the angle grows
    back: |
      opposite/hypotenuse rises from 0 toward 1; adjacent/hypotenuse falls from 1 toward 0; opposite/adjacent grows without bound.
    topic_code: "4.4"
  - front: Why the 20° and 70° rows swap two columns
    back: |
      In a right triangle with acute angles 20° and 70°, the leg opposite 20° is the leg adjacent to 70°, and the hypotenuse is shared.
    topic_code: "4.4"
  - front: Finding a side with the table → method
    back: |
      Identify the known side and the wanted side (opposite, adjacent or hypotenuse), choose the ratio that uses both, set it equal to the table value, solve.
    topic_code: "4.4"
  - front: Angle 40°, hypotenuse 25 → legs
    back: |
      opposite ≈ 25 × 0.643 ≈ 16.1; adjacent ≈ 25 × 0.766 ≈ 19.2. Check with Pythagoras: 259 + 369 ≈ 625.
    topic_code: "4.4"
  - front: Multiply or divide? → rule for table values
    back: |
      Wanted side in the numerator: multiply the known side by the ratio. Wanted side in the denominator: divide the known side by the ratio.
    topic_code: "4.4"
  - front: AA similarity behind the ratio table (review)
    back: |
      Any two right triangles with the same acute angle are similar by AA, so corresponding side ratios agree; that is why one table serves every right triangle.
    topic_code: "3.9"
quiz:
  description: |
    25 questions · about 40 minutes · Steepness, opposite and adjacent legs, the 45-45-90 and 30-60-90 ratios, reading and using a ratio table, with review of AA similarity, the Pythagorean theorem, special-triangle facts from Unit 3 and the angle sum. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: geo-u04-w15-q01
      type: multiple_choice
      topic_code: "4.4"
      source: "IM Geometry, Unit 4, Lesson 4"
      points: 1
      stimulus: |
        Ratio table (rounded): for 35°, adjacent/hypotenuse = 0.819, opposite/hypotenuse = 0.574, opposite/adjacent = 0.700. For 55°, adjacent/hypotenuse = 0.574, opposite/hypotenuse = 0.819, opposite/adjacent = 1.428.

        Figure description: right triangle DEF with the right angle at F, ∠D = 35°, and hypotenuse DE = 40.
      prompt: |
        What is the length of the leg EF, the leg opposite the 35° angle?
      options:
        - "About 23.0"
        - "About 32.8"
        - "About 28.0"
        - "About 69.7"
      option_explanations:
        - |
          Correct. EF/DE = opposite/hypotenuse = 0.574, so EF ≈ 40 × 0.574 ≈ 23.0.
        - |
          32.8 uses adjacent/hypotenuse (0.819), which gives the other leg DF.
        - |
          28.0 uses opposite/adjacent (0.700) with the hypotenuse, mixing two different ratios.
        - |
          69.7 divides 40 by 0.574 instead of multiplying; a leg must be shorter than the hypotenuse.
      answer: 0

    - slug: geo-u04-w15-q02
      type: multiple_choice
      topic_code: "4.4"
      source: "IM Geometry, Unit 4, Lesson 4"
      points: 1
      stimulus: |
        Ratio table (rounded): for 35°, adjacent/hypotenuse = 0.819, opposite/hypotenuse = 0.574, opposite/adjacent = 0.700. For 55°, adjacent/hypotenuse = 0.574, opposite/hypotenuse = 0.819, opposite/adjacent = 1.428.

        Figure description: right triangle DEF with the right angle at F, ∠D = 35°, and hypotenuse DE = 40.
      prompt: |
        What is the length of the leg DF?
      options:
        - "About 32.8"
        - "About 23.0"
        - "About 48.8"
        - "About 57.1"
      option_explanations:
        - |
          Correct. DF is adjacent to the 35° angle: DF ≈ 40 × 0.819 ≈ 32.8. Check: 23.0² + 32.8² ≈ 529 + 1076 ≈ 1605 ≈ 40².
        - |
          23.0 is the opposite leg EF, not the adjacent leg DF.
        - |
          48.8 divides 40 by 0.819, which makes the leg longer than the hypotenuse, impossible.
        - |
          57.1 multiplies 40 by 1.428 (the 55° opposite/adjacent ratio), which does not involve the hypotenuse.
      answer: 0

    - slug: geo-u04-w15-q03
      type: multiple_choice
      topic_code: "4.4"
      source: "IM Geometry, Unit 4, Lesson 4"
      points: 1
      stimulus: |
        Ratio table (rounded): for 35°, adjacent/hypotenuse = 0.819, opposite/hypotenuse = 0.574, opposite/adjacent = 0.700. For 55°, adjacent/hypotenuse = 0.574, opposite/hypotenuse = 0.819, opposite/adjacent = 1.428.

        Figure description: right triangle DEF with the right angle at F, ∠D = 35°, and hypotenuse DE = 40.
      prompt: |
        Why does the 55° row of the table have adjacent/hypotenuse = 0.574, the same as the 35° row's opposite/hypotenuse?
      options:
        - "∠E = 55°, and the leg adjacent to E is the leg opposite D, while the hypotenuse is the same"
        - "The table is symmetric for every pair of angles"
        - "Because 0.574 is the ratio for every angle between 30° and 60°"
        - "It is a coincidence of rounding"
      option_explanations:
        - |
          Correct. The acute angles sum to 90°, so ∠E = 55°; EF is opposite D and adjacent to E, so EF/DE serves as both ratios.
        - |
          The swap works only for complementary angles (those adding to 90°), not for every pair.
        - |
          The ratios change continuously with the angle; 0.574 belongs to 35° (opposite) and 55° (adjacent) specifically.
        - |
          The equality is exact, not a rounding effect: both ratios are EF/DE in the same triangle.
      answer: 0

    - slug: geo-u04-w15-q04
      type: multiple_choice
      topic_code: "4.1"
      source: "IM Geometry, Unit 4, Lesson 1"
      points: 1
      prompt: |
        Which ramp is the steepest?
      options:
        - "Rises 2 m over a run of 5 m"
        - "Rises 3 m over a run of 9 m"
        - "Rises 1 m over a run of 3 m"
        - "Rises 4 m over a run of 12 m"
      option_explanations:
        - |
          Correct. Steepness 2/5 = 0.4 is the largest of the four ratios.
        - |
          3/9 ≈ 0.333 is less steep than 0.4; the larger rise is spread over a longer run.
        - |
          1/3 ≈ 0.333, the same as the 3 over 9 ramp, and less than 0.4.
        - |
          4/12 ≈ 0.333; a bigger rise does not mean steeper when the run grows as well.
      answer: 0

    - slug: geo-u04-w15-q05
      type: multiple_choice
      topic_code: "4.1"
      source: "IM Geometry, Unit 4, Lesson 1"
      points: 1
      prompt: |
        Two ramps have the same rise-to-run ratio. Which argument shows they make the same angle with the ground?
      options:
        - "Each ramp forms a right triangle with legs (run, rise); equal ratios with the included right angle give SAS∼, so the angles agree"
        - "Equal ratios mean equal rises, so the ramps are congruent"
        - "The angle is the ratio multiplied by 90°"
        - "All right triangles are similar"
      option_explanations:
        - |
          Correct. Two sides in the same ratio with the right angle between them is the SAS similarity criterion; similar triangles have equal corresponding angles.
        - |
          Equal ratios allow different rises (1 over 12 and 2 over 24); the ramps are similar, not congruent.
        - |
          Angle and ratio are not proportional: a ratio of 1 is 45°, but a ratio of 2 is about 63°, not 90°.
        - |
          Right triangles with different acute angles are not similar; the equal ratio is what forces similarity here.
      answer: 0

    - slug: geo-u04-w15-q06
      type: multiple_choice
      topic_code: "4.2"
      source: "IM Geometry, Unit 4, Lesson 2"
      points: 1
      prompt: |
        A square has side 10. What is the length of its diagonal?
      options:
        - "10√2"
        - "20"
        - "10√3"
        - "5√2"
      option_explanations:
        - |
          Correct. The diagonal is the hypotenuse of a 45-45-90 triangle with legs 10, so it is 10√2 ≈ 14.1.
        - |
          20 would need the diagonal to be twice the side, but √(100 + 100) = √200 ≈ 14.1.
        - |
          √3 belongs to the 30-60-90 triangle, not to half a square.
        - |
          5√2 is half the diagonal (the distance from the centre to a corner).
      answer: 0

    - slug: geo-u04-w15-q07
      type: multiple_choice
      topic_code: "4.2"
      source: "IM Geometry, Unit 4, Lesson 2"
      points: 1
      prompt: |
        From a 45° angle in a right triangle, what is the value of opposite/adjacent?
      options:
        - "1"
        - "√2"
        - "1/√2"
        - "1/2"
      option_explanations:
        - |
          Correct. The two legs of a 45-45-90 triangle are equal, so their ratio is 1.
        - |
          √2 is the ratio hypotenuse/leg, not leg/leg.
        - |
          1/√2 is opposite/hypotenuse (or adjacent/hypotenuse), not opposite/adjacent.
        - |
          1/2 is opposite/hypotenuse for 30°, not any ratio for 45°.
      answer: 0

    - slug: geo-u04-w15-q08
      type: multiple_choice
      topic_code: "4.3"
      source: "IM Geometry, Unit 4, Lesson 3"
      points: 1
      prompt: |
        An equilateral triangle with side 2 is cut along an altitude. What are the sides of each half?
      options:
        - "1, √3, 2"
        - "1, 1, √2"
        - "1, √2, 2"
        - "2, 2, √3"
      option_explanations:
        - |
          Correct. The hypotenuse is a side (2), the short leg is half the base (1), and the altitude is √(4 − 1) = √3.
        - |
          1, 1, √2 is half a square, with two 45° angles; the half-equilateral triangle has 30° and 60° angles.
        - |
          The altitude is √(2² − 1²) = √3, not √2.
        - |
          Only one side keeps the length 2; the base is halved to 1.
      answer: 0

    - slug: geo-u04-w15-q09
      type: multiple_choice
      topic_code: "4.3"
      source: "IM Geometry, Unit 4, Lesson 3"
      points: 1
      prompt: |
        A 30-60-90 triangle has hypotenuse 18. What are its legs?
      options:
        - "9 and 9√3"
        - "9 and 9√2"
        - "6 and 12"
        - "18 and 18√3"
      option_explanations:
        - |
          Correct. The short leg is half the hypotenuse, 9, and the long leg is 9√3 ≈ 15.6.
        - |
          √2 appears in the 45-45-90 triangle; the 30-60-90 triangle uses √3.
        - |
          6 and 12 are not in the ratio 1 : √3, and 36 + 144 = 180 ≠ 324.
        - |
          A leg cannot equal the hypotenuse; the short leg is half of 18.
      answer: 0

    - slug: geo-u04-w15-q10
      type: multiple_choice
      topic_code: "4.3"
      source: "IM Geometry, Unit 4, Lesson 3"
      points: 1
      prompt: |
        From a 60° angle in a right triangle, what is opposite/hypotenuse?
      options:
        - "√3/2"
        - "1/2"
        - "√3"
        - "1/√3"
      option_explanations:
        - |
          Correct. The leg opposite 60° is the long leg x√3 and the hypotenuse is 2x, so the ratio is √3/2 ≈ 0.866.
        - |
          1/2 is adjacent/hypotenuse for 60° (or opposite/hypotenuse for 30°).
        - |
          √3 is opposite/adjacent for 60°, the ratio of the two legs.
        - |
          1/√3 is opposite/adjacent for 30°, the short leg over the long leg, not a ratio for 60°.
      answer: 0

    - slug: geo-u04-w15-q11
      type: multiple_choice
      topic_code: "4.4"
      source: "IM Geometry, Unit 4, Lesson 4"
      points: 1
      prompt: |
        In right triangle PQR with the right angle at R, which side is adjacent to ∠P?
      options:
        - "PR"
        - "QR"
        - "PQ"
        - "Both PR and PQ are adjacent legs"
      option_explanations:
        - |
          Correct. PR is the leg that forms one side of ∠P; the other side of the angle is the hypotenuse PQ.
        - |
          QR does not touch P; it is the leg opposite ∠P.
        - |
          PQ touches P but is the hypotenuse (opposite the right angle at R), not a leg.
        - |
          The hypotenuse is never called the adjacent leg; only one leg is adjacent to a given acute angle.
      answer: 0

    - slug: geo-u04-w15-q12
      type: multiple_choice
      topic_code: "4.4"
      source: "IM Geometry, Unit 4, Lesson 4"
      points: 1
      prompt: |
        As the acute angle θ of a right triangle increases from 10° to 80°, what happens to the ratio opposite/hypotenuse?
      options:
        - "It increases, staying below 1"
        - "It decreases toward 0"
        - "It stays constant"
        - "It increases without bound"
      option_explanations:
        - |
          Correct. The opposite leg grows relative to the hypotenuse as the angle opens, but a leg is always shorter than the hypotenuse, so the ratio stays below 1.
        - |
          Decreasing toward 0 describes adjacent/hypotenuse as the angle grows.
        - |
          The ratio depends on the angle; it is constant only across triangles with the same angle.
        - |
          Growing without bound describes opposite/adjacent, since the adjacent leg can shrink toward 0.
      answer: 0

    - slug: geo-u04-w15-q13
      type: multiple_choice
      topic_code: "3.9"
      source: "IM Geometry, Unit 3, Lesson 9"
      points: 1
      prompt: |
        Review. Two right triangles each have an acute angle of 52°. One has hypotenuse 10, the other hypotenuse 35. Why is the ratio (leg opposite 52°)/(hypotenuse) the same in both?
      options:
        - "The triangles are similar by AA (52° and 90°), and similar triangles have equal ratios of corresponding sides"
        - "Because both hypotenuses are multiples of 5"
        - "The triangles are congruent by HL"
        - "Because any two right triangles are similar"
      option_explanations:
        - |
          Correct. Two congruent angle pairs make the triangles similar, and a similarity preserves every ratio of lengths within a figure.
        - |
          The specific numbers are irrelevant; what matters is the shared angles.
        - |
          The hypotenuses differ (10 and 35), so the triangles are not congruent.
        - |
          Right triangles with different acute angles are not similar; the shared 52° angle is essential.
      answer: 0

    - slug: geo-u04-w15-q14
      type: multiple_choice
      topic_code: "3.14"
      source: "IM Geometry, Unit 3, Lesson 14"
      points: 1
      prompt: |
        Review. A right triangle has hypotenuse 2 and one leg 1. Which statement about the other leg is correct?
      options:
        - "It is √3, by the Pythagorean theorem: 2² − 1² = 3"
        - "It is 1, because the triangle must be isosceles"
        - "It is √5, because 2² + 1² = 5"
        - "It is 3, because 2² − 1² = 3"
      option_explanations:
        - |
          Correct. leg² = hypotenuse² − other leg² = 4 − 1 = 3, so the leg is √3; this is the 30-60-90 triangle.
        - |
          A hypotenuse of 2 with legs 1 and 1 would need 1 + 1 = 4, which fails.
        - |
          Adding squares finds a hypotenuse from two legs; here the hypotenuse is known and a leg is wanted, so subtract.
        - |
          3 is the square of the leg; the leg itself is √3 ≈ 1.73.
      answer: 0

    - slug: geo-u04-w15-q15
      type: multi_select
      topic_code: "4.4"
      source: "IM Geometry, Unit 4, Lesson 4"
      points: 2
      partial_credit: true
      prompt: |
        A right triangle has acute angles 25° and 65°. Which statements are true? Select all that apply.
      options:
        - "The leg opposite 25° is the leg adjacent to 65°"
        - "opposite/hypotenuse for 25° equals adjacent/hypotenuse for 65°"
        - "opposite/adjacent for 25° is greater than 1"
        - "opposite/adjacent for 65° is the reciprocal of opposite/adjacent for 25°"
        - "adjacent/hypotenuse for 25° is less than 0.5"
      option_explanations:
        - |
          True: each leg is opposite one acute angle and adjacent to the other.
        - |
          True: both ratios are the same leg over the same hypotenuse.
        - |
          False: for an angle under 45°, the opposite leg is shorter than the adjacent leg, so the ratio is below 1 (about 0.466).
        - |
          True: the two ratios swap numerator and denominator (about 2.145 and 0.466).
        - |
          False: the leg adjacent to 25° is the longer leg, so adjacent/hypotenuse is large (about 0.906), well above 0.5.
      answer: [0, 1, 3]

    - slug: geo-u04-w15-q16
      type: multi_select
      topic_code: "3.15"
      source: "IM Geometry, Unit 3, Lesson 15"
      points: 2
      partial_credit: true
      prompt: |
        Review. An equilateral triangle has side 12. Which statements are true? Select all that apply.
      options:
        - "Its height is 6√3"
        - "Its area is 36√3"
        - "Each half made by an altitude is a 30-60-90 triangle with hypotenuse 12"
        - "Its height is 6√2"
        - "Its area is 72"
      option_explanations:
        - |
          True: the altitude is the long leg of a 30-60-90 triangle with short leg 6, so it is 6√3 ≈ 10.4.
        - |
          True: the area is ½ · base · height = ½ · 12 · 6√3 = 36√3 ≈ 62.4.
        - |
          True: the altitude bisects the base and the apex angle, leaving angles 30°, 60°, 90° and the original side as hypotenuse.
        - |
          False: √2 belongs to the half-square; the half-equilateral triangle gives √3.
        - |
          False: 72 is ½ · 12 · 12, using a side as the height; the true height is 6√3 ≈ 10.4.
      answer: [0, 1, 2]

    - slug: geo-u04-w15-q17
      type: true_false
      topic_code: "4.1"
      source: "IM Geometry, Unit 4, Lesson 1"
      points: 1
      prompt: |
        True or false: if one ramp has twice the rise-to-run ratio of another, it makes twice the angle with the ground.
      answer: false
      explanation: |
        False. The angle grows with the ratio but not proportionally. A ratio of 1 gives 45°, but a ratio of 2 gives about 63.4°, not 90°, and no ratio can reach 90°.

    - slug: geo-u04-w15-q18
      type: true_false
      topic_code: "1.21"
      source: "IM Geometry, Unit 1, Lesson 21"
      points: 1
      prompt: |
        Review. True or false: in every right triangle the two acute angles are complementary, which is why the ratio table for θ and for 90° − θ contains the same numbers in swapped columns.
      answer: true
      explanation: |
        True. The angle sum gives θ + (90° − θ) = 90°; each leg is opposite one acute angle and adjacent to the other, so the opposite/hypotenuse column for θ equals the adjacent/hypotenuse column for 90° − θ.

    - slug: geo-u04-w15-q19
      type: fill_blank
      topic_code: "4.3"
      source: "IM Geometry, Unit 4, Lesson 3"
      points: 1
      prompt: |
        In a 30-60-90 triangle, the hypotenuse is ____ times the short leg.
      answer: ["2", "two", "twice"]
      explanation: |
        The short leg is half the side of the equilateral triangle the right triangle came from, and the hypotenuse is a full side.

    - slug: geo-u04-w15-q20
      type: fill_blank
      topic_code: "3.6"
      source: "IM Geometry, Unit 3, Lesson 6"
      points: 1
      prompt: |
        Review. In similar figures, the ratio of two lengths within one figure equals the ratio of the ____ two lengths within the other.
      answer: ["corresponding", "matching"]
      explanation: |
        A similarity multiplies every length by the same k, so ratios between corresponding pairs of lengths are unchanged; this is why side ratios in right triangles depend only on the angle.

    - slug: geo-u04-w15-q21
      type: numeric
      topic_code: "4.4"
      source: "general knowledge"
      points: 1
      prompt: |
