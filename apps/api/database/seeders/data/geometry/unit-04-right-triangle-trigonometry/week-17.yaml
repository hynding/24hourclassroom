      source: "IM Geometry, Unit 4, Lesson 10"
      points: 3
      prompt: |
        A straight road climbs from 200 m above sea level to 650 m above sea level over a horizontal distance of 6 km. Find the angle of the road with the horizontal and the road's actual length, showing which ratio or theorem you use for each. Then say whether the road is steeper or shallower than a 1 : 12 ramp.
      answer: |
        Rise = 650 − 200 = 450 m = 0.45 km; run = 6 km. The angle: tan θ = 0.45/6 = 0.075, so θ = tan⁻¹(0.075) ≈ 4.3° (tangent, because rise and run are the two legs). The road length is the hypotenuse: √(6² + 0.45²) = √36.2025 ≈ 6.017 km (Pythagorean theorem), or 6 / cos 4.3° ≈ 6.017 km. A 1 : 12 ramp has steepness 1/12 ≈ 0.083, which is more than 0.075, so the road is slightly shallower than the ramp.
      explanation: |
        1 point for θ ≈ 4.3° with tangent justified by the two legs. 1 point for the length ≈ 6.02 km by the Pythagorean theorem or cosine. 1 point for comparing 0.075 with 1/12 ≈ 0.083 and concluding shallower.

    - slug: geo-u04-w17-q25
      type: long_answer
      topic_code: "4.11"
      source: "IM Geometry, Unit 4, Lesson 11"
      points: 6
      prompt: |
        A circle has radius 1.

        (a) Describe the right triangle formed by the centre, one vertex and the midpoint of one side of an inscribed regular 12-gon, giving its angle at the centre and its hypotenuse. Find the 12-gon's perimeter and area. (sin 15° ≈ 0.2588, cos 15° ≈ 0.9659, sin 30° = 0.5)
        (b) Do the same for a circumscribed regular 12-gon. (tan 15° ≈ 0.2679)
        (c) Use (a) and (b) to write two inequalities that bound π, one from perimeters and one from areas, and state the resulting range for π.
        (d) Explain why increasing the number of sides improves the bounds, and why the method proves that the bounds approach the same number.
      answer: |
        (a) The centre, a vertex and the midpoint of an adjacent side form a right triangle with the right angle at the midpoint, angle 360°/24 = 15° at the centre, and hypotenuse 1 (the radius). Half a side is sin 15° ≈ 0.2588, so a side is 0.5176 and the perimeter is 12 × 0.5176 ≈ 6.212. The apothem is cos 15° ≈ 0.9659, so the area is ½ × 6.212 × 0.9659 ≈ 3.000 (exactly 3, since the area is also 6 sin 30° = 3).
        (b) For the circumscribed 12-gon the apothem is the radius 1 and the centre angle is still 15°; half a side is tan 15° ≈ 0.2679, so a side is 0.5359, the perimeter is 12 × 0.5359 ≈ 6.431, and the area is ½ × 6.431 × 1 ≈ 3.215.
        (c) Perimeters: 6.212 < 2π < 6.431, so 3.106 < π < 3.215. Areas: 3.000 < π < 3.215. Together, 3.106 < π < 3.215.
        (d) More sides make the inscribed polygon fill more of the circle (its perimeter and area grow toward the circle's) and make the circumscribed polygon hug the circle more tightly (its perimeter and area shrink toward the circle's), so the lower bound rises and the upper bound falls. The ratio of the two bounds is tan(180°/n) / sin(180°/n) = 1/cos(180°/n), which approaches 1 as n grows, so the bounds close in on a single number, which is π.
      explanation: |
        Scoring (6 points). (a) 1 point for the right triangle (15° at the centre, hypotenuse 1) with perimeter ≈ 6.21; 1 point for area = 3. (b) 1 point for perimeter ≈ 6.43 and area ≈ 3.215 with the apothem equal to 1. (c) 1 point for both inequalities and the range 3.106 < π < 3.215. (d) 1 point for the squeezing explanation; 1 point for a reason the bounds converge (such as the ratio 1/cos(180°/n) approaching 1).
