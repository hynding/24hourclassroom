    - slug: geo-u04-w17-q23
      type: short_answer
      topic_code: "4.3"
      source: "IM Geometry, Unit 4, Lesson 3"
      points: 3
      prompt: |
        Review. Without a calculator, explain why a regular hexagon inscribed in a circle of radius r has perimeter exactly 6r, and find its area exactly in terms of r.
      answer: |
        Joining the centre to the six vertices makes six isosceles triangles with apex angle 360°/6 = 60°; their base angles are (180° − 60°)/2 = 60°, so each triangle is equilateral and each side of the hexagon equals the radius r. Perimeter = 6r. Each equilateral triangle of side r has height (r/2)√3 (half of it is a 30-60-90 triangle with short leg r/2), so its area is ½ · r · (r√3/2) = (√3/4)r², and the hexagon's area is 6 · (√3/4)r² = (3√3/2)r² ≈ 2.598r².
      explanation: |
        1 point for showing the central triangles are equilateral (60° apex gives 60° base angles). 1 point for perimeter 6r. 1 point for the area (3√3/2)r² using the 30-60-90 height.

    - slug: geo-u04-w17-q24
      type: short_answer
