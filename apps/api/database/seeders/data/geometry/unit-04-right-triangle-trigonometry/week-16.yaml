      source: "IM Geometry, Unit 3, Lesson 9"
      points: 3
      prompt: |
        Review. Explain why "sin 40°" makes sense as a single number, even though there are infinitely many right triangles with a 40° angle. Name the similarity criterion and say what it guarantees.
      answer: |
        Any two right triangles with a 40° angle have two pairs of congruent angles (40° and 90°), so they are similar by AA. A similarity multiplies every length by the same scale factor, so the ratio of the leg opposite 40° to the hypotenuse is the same in every such triangle. That common ratio is sin 40° ≈ 0.643; the size of the triangle does not matter.
      explanation: |
        1 point for AA with the two angle pairs named. 1 point for the fact that similar triangles have equal corresponding side ratios (ratios within a figure are preserved). 1 point for concluding that opposite/hypotenuse is therefore one fixed number for 40°.

