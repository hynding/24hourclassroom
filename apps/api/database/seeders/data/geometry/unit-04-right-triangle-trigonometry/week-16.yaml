week: 16
unit: 4
title: "Sine, Cosine and Tangent"
topics: ["4.5", "4.6", "4.7", "4.8"]
guide: guides/week-16.md
guide_description: |
  The definitions of cosine, sine and tangent as side ratios, calculator work in degree mode, choosing the ratio from the sides involved and solving for a missing side, angles of elevation and depression and other applications, and the identities sin θ = cos(90° − θ), tan θ = sin θ / cos θ and sin² θ + cos² θ = 1. Worked examples, Try-it problems and a self-check.
flashcards_description: |
  28 cards on SOH-CAH-TOA, exact values, multiplying versus dividing, elevation and depression, ladders and guy wires, and the complementary-angle and Pythagorean identities. Review them before the week 16 quiz.
flashcards:
  - front: cos θ → definition
    back: |
      adjacent / hypotenuse, for an acute angle θ of a right triangle. Between 0 and 1.
    topic_code: "4.5"
  - front: sin θ → definition
    back: |
      opposite / hypotenuse, for an acute angle θ of a right triangle. Between 0 and 1.
    topic_code: "4.5"
  - front: tan θ → definition
    back: |
      opposite / adjacent. Equal to the steepness (rise over run) when the adjacent leg is horizontal. Can be any positive number.
    topic_code: "4.5"
  - front: SOH-CAH-TOA → meaning
    back: |
      Sine = Opposite/Hypotenuse, Cosine = Adjacent/Hypotenuse, Tangent = Opposite/Adjacent.
    topic_code: "4.5"
  - front: Legs 5 and 12, hypotenuse 13, θ opposite the 5 → the three ratios
    back: |
      sin θ = 5/13, cos θ = 12/13, tan θ = 5/12. For the other acute angle they are 12/13, 5/13 and 12/5.
    topic_code: "4.5"
  - front: Exact values for 30°
    back: |
      cos 30° = √3/2 ≈ 0.866, sin 30° = 1/2, tan 30° = 1/√3 ≈ 0.577.
    topic_code: "4.5"
  - front: Exact values for 45°
    back: |
      cos 45° = sin 45° = √2/2 ≈ 0.707, tan 45° = 1.
    topic_code: "4.5"
  - front: Exact values for 60°
    back: |
      cos 60° = 1/2, sin 60° = √3/2 ≈ 0.866, tan 60° = √3 ≈ 1.732.
    topic_code: "4.5"
  - front: Calculator mode for this unit
    back: |
      Degree mode. If sin 30° shows −0.988 instead of 0.5, the calculator is in radians.
    topic_code: "4.6"
  - front: Finding a side → three steps
    back: |
      Label the known and wanted sides as opposite, adjacent or hypotenuse relative to the known angle; pick the ratio using those two; write ratio = calculator value and solve.
    topic_code: "4.6"
  - front: Multiply or divide → rule
    back: |
      Wanted side on top of the ratio: multiply (opposite = h sin θ). Wanted side underneath: divide (hypotenuse = opposite / sin θ).
    topic_code: "4.6"
  - front: Angle 32°, hypotenuse 18 → legs
    back: |
      opposite = 18 sin 32° ≈ 9.54; adjacent = 18 cos 32° ≈ 15.26. Check: 91.0 + 232.9 ≈ 324 = 18².
    topic_code: "4.6"
  - front: Angle 55°, opposite leg 14 → hypotenuse and adjacent leg
    back: |
      hypotenuse = 14 / sin 55° ≈ 17.09; adjacent = 14 / tan 55° ≈ 9.80.
    topic_code: "4.6"
  - front: Solving a right triangle → what it means
    back: |
      Finding all three sides and both acute angles. With one acute angle and one side: the other angle by subtraction from 90°, the sides by two ratios, then a Pythagorean check.
    topic_code: "4.6"
  - front: Angle of elevation → definition
    back: |
      The angle above the horizontal from an observer up to an object. Height = distance × tan(elevation) when the distance is horizontal.
    topic_code: "4.7"
  - front: Angle of depression → definition and key fact
    back: |
      The angle below the horizontal from an observer down to an object. It equals the angle of elevation from the object back up, by alternate interior angles between the two horizontals.
    topic_code: "4.7"
  - front: Tower seen at 28° elevation from 50 m away → height
    back: |
      50 tan 28° ≈ 50 × 0.532 ≈ 26.6 m, plus the observer's eye height if the sight line starts at eye level.
    topic_code: "4.7"
  - front: Boat seen at 10° depression from an 80 m cliff → distance from the base
    back: |
      80 / tan 10° ≈ 80 / 0.176 ≈ 454 m.
    topic_code: "4.7"
  - front: Ladder 6 m long at 72° to the ground → height and foot distance
    back: |
      Height 6 sin 72° ≈ 5.71 m; foot 6 cos 72° ≈ 1.85 m from the wall.
    topic_code: "4.7"
  - front: Guy wire from a 20 m mast at 50° to the ground → length and anchor distance
    back: |
      Length 20 / sin 50° ≈ 26.1 m; anchor 20 / tan 50° ≈ 16.8 m from the base.
    topic_code: "4.7"
  - front: Two sightings of a building (35° then 55° from 30 m closer) → method
    back: |
      Let x be the nearer distance and h the height: h = x tan 55° and h = (x + 30) tan 35°. Solve: x ≈ 28.8 m, h ≈ 41.2 m.
    topic_code: "4.7"
  - front: sin θ = cos(90° − θ) → why
    back: |
      The two acute angles of a right triangle are complementary; the leg opposite θ is adjacent to 90° − θ and the hypotenuse is shared. "Cosine" means sine of the complement.
    topic_code: "4.8"
  - front: sin 20° written as a cosine
    back: |
      cos 70°. In general sin θ = cos φ for acute angles exactly when θ + φ = 90°.
    topic_code: "4.8"
  - front: tan θ in terms of sin θ and cos θ
    back: |
      tan θ = sin θ / cos θ, because (o/h) ÷ (a/h) = o/a.
    topic_code: "4.8"
  - front: Pythagorean identity
    back: |
      sin² θ + cos² θ = 1, because (o² + a²)/h² = h²/h². If sin θ = 0.6 then cos θ = 0.8 and tan θ = 0.75.
    topic_code: "4.8"
  - front: How sine and cosine change as the angle grows
    back: |
      Sine increases from 0 toward 1; cosine decreases from 1 toward 0; they are equal at 45°. cos 40° ≈ 0.766 is larger than cos 50° ≈ 0.643.
    topic_code: "4.8"
  - front: Why sin θ and cos θ are less than 1 for an acute angle
    back: |
      Each is a leg over the hypotenuse, and a leg is always shorter than the hypotenuse.
    topic_code: "4.8"
  - front: Pythagorean check after solving a triangle (review)
    back: |
      Square the two legs, add, compare with the hypotenuse squared; a mismatch beyond rounding means a ratio was chosen or applied wrongly.
    topic_code: "3.14"
quiz:
  description: |
    25 questions · about 40 minutes · Sine, cosine and tangent as ratios, calculator work, finding sides, elevation and depression problems and the complementary-angle and Pythagorean identities, with review of special triangles, steepness, AA similarity, parallel-line angles and the Pythagorean theorem. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: geo-u04-w16-q01
      type: multiple_choice
      topic_code: "4.6"
      source: "IM Geometry, Unit 4, Lesson 6"
      points: 1
      stimulus: |
        Figure description: right triangle ABC with the right angle at C. ∠A = 32° and the hypotenuse AB = 18. Calculator values: sin 32° ≈ 0.530, cos 32° ≈ 0.848, tan 32° ≈ 0.625.
      prompt: |
        Which equation correctly finds BC, the leg opposite ∠A?
      options:
        - "sin 32° = BC/18, so BC = 18 sin 32° ≈ 9.54"
        - "cos 32° = BC/18, so BC = 18 cos 32° ≈ 15.26"
        - "sin 32° = 18/BC, so BC = 18 / sin 32° ≈ 33.96"
        - "tan 32° = BC/18, so BC = 18 tan 32° ≈ 11.25"
      option_explanations:
        - |
          Correct. BC is opposite the 32° angle and AB is the hypotenuse, so sine is the ratio; the wanted side is on top, so multiply.
        - |
          Cosine uses the adjacent leg AC; this equation finds AC, not BC.
        - |
          The hypotenuse goes in the denominator of sine; this version makes BC longer than the hypotenuse, which is impossible.
        - |
          Tangent compares the two legs; 18 is the hypotenuse, so tangent does not apply with it.
      answer: 0

    - slug: geo-u04-w16-q02
      type: multiple_choice
      topic_code: "4.6"
      source: "IM Geometry, Unit 4, Lesson 6"
      points: 1
      stimulus: |
        Figure description: right triangle ABC with the right angle at C. ∠A = 32° and the hypotenuse AB = 18. Calculator values: sin 32° ≈ 0.530, cos 32° ≈ 0.848, tan 32° ≈ 0.625.
      prompt: |
        What is the length of AC, to two decimal places?
      options:
        - "11.25"
        - "21.23"
        - "9.54"
        - "15.26"
      option_explanations:
        - |
          11.25 multiplies the hypotenuse by tan 32°, which mixes a hypotenuse with a leg-to-leg ratio.
        - |
          21.23 divides 18 by 0.848, giving a leg longer than the hypotenuse.
        - |
          9.54 is the opposite leg BC (18 sin 32°).
        - |
          Correct. AC is adjacent to the 32° angle: AC = 18 cos 32° ≈ 18 × 0.848 ≈ 15.26.
      answer: 3

    - slug: geo-u04-w16-q03
      type: multiple_choice
      topic_code: "4.8"
      source: "IM Geometry, Unit 4, Lesson 8"
      points: 1
      stimulus: |
        Figure description: right triangle ABC with the right angle at C. ∠A = 32° and the hypotenuse AB = 18. Calculator values: sin 32° ≈ 0.530, cos 32° ≈ 0.848, tan 32° ≈ 0.625.
      prompt: |
        What is cos B?
      options:
        - "0.470, because cos B = 1 − cos A"
        - "0.530, because ∠B = 58° and cos 58° = sin 32°"
        - "0.625, because cos B = tan A"
        - "0.848, because cos B = cos A in the same triangle"
      option_explanations:
        - |
          Cosines of complementary angles are not related by subtraction from 1; the relation is cos B = sin A.
        - |
          Correct. ∠B = 90° − 32° = 58°, and the leg adjacent to B is BC, which is opposite A, so cos B = BC/AB = sin A ≈ 0.530.
        - |
          tan A = BC/AC compares the two legs; cos B = BC/AB uses the hypotenuse.
        - |
          cos A = AC/AB while cos B = BC/AB; the two acute angles have different adjacent legs.
      answer: 1

    - slug: geo-u04-w16-q04
      type: multiple_choice
      topic_code: "4.5"
      source: "IM Geometry, Unit 4, Lesson 5"
      points: 1
      prompt: |
        A right triangle has legs 8 and 15 and hypotenuse 17. Let θ be the angle opposite the leg 8. What is tan θ?
      options:
        - "8/17"
        - "15/17"
        - "8/15"
        - "15/8"
      option_explanations:
        - |
          8/17 is sin θ (opposite over hypotenuse).
        - |
          15/17 is cos θ (adjacent over hypotenuse).
        - |
          Correct. tan θ = opposite/adjacent = 8/15 ≈ 0.533.
        - |
          15/8 is the tangent of the other acute angle, the one opposite 15.
      answer: 2

    - slug: geo-u04-w16-q05
      type: multiple_choice
      topic_code: "4.5"
      source: "IM Geometry, Unit 4, Lesson 5"
      points: 1
      prompt: |
        Which value is exactly equal to sin 60°?
      options:
        - "√3/2"
        - "√2/2"
        - "1/2"
        - "√3"
      option_explanations:
        - |
          Correct. In the 30-60-90 triangle with sides 1, √3, 2, the leg opposite 60° is √3 and the hypotenuse is 2.
        - |
          √2/2 is sin 45° and cos 45°, the ratio from half a square, not from the half-equilateral triangle.
        - |
          1/2 is cos 60° (or sin 30°): the short leg over the hypotenuse, not the long leg.
        - |
          √3 is tan 60°; sine is never greater than 1.
      answer: 0

    - slug: geo-u04-w16-q06
      type: multiple_choice
      topic_code: "4.6"
      source: "IM Geometry, Unit 4, Lesson 6"
      points: 1
      prompt: |
        A right triangle has a 55° angle whose opposite leg is 14. Which expression gives the hypotenuse? (sin 55° ≈ 0.819, cos 55° ≈ 0.574, tan 55° ≈ 1.428)
      options:
        - "14 / cos 55° ≈ 24.39"
        - "14 / sin 55° ≈ 17.09"
        - "14 tan 55° ≈ 19.99"
        - "14 sin 55° ≈ 11.47"
      option_explanations:
        - |
          Cosine pairs the adjacent leg with the hypotenuse; 14 is the opposite leg.
        - |
          Correct. sin 55° = 14/hyp, and the wanted side is underneath, so hyp = 14 / 0.819 ≈ 17.09.
        - |
          Tangent relates the two legs and does not involve the hypotenuse.
        - |
          Multiplying gives a hypotenuse shorter than the leg, which is impossible; the hypotenuse is in the denominator of sine.
      answer: 1

    - slug: geo-u04-w16-q07
      type: multiple_choice
      topic_code: "4.6"
      source: "IM Geometry, Unit 4, Lesson 6"
      points: 1
      prompt: |
        A student computes sin 30° on a calculator and gets −0.988. What has gone wrong?
      options:
        - "The student should have used cosine"
        - "The calculator is broken; sine can never be negative"
        - "The calculator is in radian mode; in degree mode sin 30° = 0.5"
        - "sin 30° really is −0.988"
      option_explanations:
        - |
          cos 30° ≈ 0.866; the problem is the mode, not the choice of ratio.
        - |
          The calculator is working correctly for 30 radians; for acute angles in degrees sine is positive.
        - |
          Correct. 30 radians is a very different angle from 30 degrees; switching to degree mode gives 0.5.
        - |
          sin 30° = 1/2 exactly (the short leg over the hypotenuse of the half-equilateral triangle).
      answer: 2

    - slug: geo-u04-w16-q08
      type: multiple_choice
      topic_code: "4.7"
      source: "IM Geometry, Unit 4, Lesson 7"
      points: 1
      prompt: |
        From a point on level ground 60 m from the base of a tower, the angle of elevation of the top is 40°. How tall is the tower? (tan 40° ≈ 0.839, sin 40° ≈ 0.643, cos 40° ≈ 0.766)
      options:
        - "About 71.5 m"
        - "About 46.0 m"
        - "About 38.6 m"
        - "About 50.3 m"
      option_explanations:
        - |
          71.5 divides 60 by 0.839, which would be the method if 60 were the height and the distance were wanted.
        - |
          46.0 multiplies by cos 40°, which relates the adjacent leg to the hypotenuse, not to the height.
        - |
          38.6 multiplies by sin 40°, but 60 m is the horizontal leg, not the hypotenuse.
        - |
          Correct. Height is opposite the 40° angle and 60 m is adjacent: height = 60 tan 40° ≈ 50.3 m.
      answer: 3

    - slug: geo-u04-w16-q09
      type: multiple_choice
      topic_code: "4.7"
      source: "IM Geometry, Unit 4, Lesson 7"
      points: 1
      prompt: |
        From the top of a 75 m cliff, a boat is seen at an angle of depression of 15°. Why is the angle of elevation from the boat to the cliff top also 15°, and how far is the boat from the base of the cliff? (tan 15° ≈ 0.268)
      options:
        - "Alternate interior angles between the two horizontal lines; distance 75 / tan 15° ≈ 280 m"
        - "Corresponding angles; distance 75 / tan 15° ≈ 280 m, measured along the line of sight"
        - "They are not equal; the elevation angle is 75°"
        - "Vertical angles; distance 75 tan 15° ≈ 20 m"
      option_explanations:
        - |
          Correct. The horizontal at the top and the horizontal at sea level are parallel, and the line of sight is a transversal; the boat is 75 / 0.268 ≈ 280 m from the base.
        - |
          The angles are alternate interior, not corresponding, and 75 / tan 15° is the horizontal distance, not the line-of-sight distance.
        - |
          The angles are equal; 75° is the complement, the angle between the line of sight and the vertical.
        - |
          The two angles are at different vertices, so they are not vertical angles, and multiplying gives the wrong relationship (the 75 m is opposite the 15° angle).
      answer: 0

    - slug: geo-u04-w16-q10
      type: multiple_choice
      topic_code: "4.7"
      source: "IM Geometry, Unit 4, Lesson 7"
      points: 1
      prompt: |
        A 5 m ladder leans against a wall, making a 65° angle with the ground. How high up the wall does it reach? (sin 65° ≈ 0.906, cos 65° ≈ 0.423, tan 65° ≈ 2.145)
      options:
        - "About 5.52 m"
        - "About 4.53 m"
        - "About 2.11 m"
        - "About 10.72 m"
      option_explanations:
        - |
          5.52 divides by cos 65°, giving a height greater than the ladder's length.
        - |
          Correct. The ladder is the hypotenuse and the height is opposite the 65° angle: 5 sin 65° ≈ 4.53 m.
        - |
          2.11 m is 5 cos 65°, the distance of the ladder's foot from the wall.
        - |
          10.72 multiplies by tan 65°, which compares the two legs, not a leg with the ladder.
      answer: 1

    - slug: geo-u04-w16-q11
      type: multiple_choice
      topic_code: "4.8"
      source: "IM Geometry, Unit 4, Lesson 8"
      points: 1
      prompt: |
        Which equation is true for every acute angle θ?
      options:
        - "sin θ = cos θ"
        - "sin θ + cos θ = 1"
        - "sin θ = cos(90° − θ)"
        - "sin θ = 1 − cos θ"
      option_explanations:
        - |
          sin θ = cos θ only at 45°, where the two legs are equal; it fails for every other angle.
        - |
          At 45°, sin + cos ≈ 1.414; the identity with 1 involves squares: sin² θ + cos² θ = 1.
        - |
          Correct. The leg opposite θ is adjacent to the complementary angle, and the hypotenuse is shared.
        - |
          At 60°, 1 − cos 60° = 0.5 but sin 60° ≈ 0.866.
      answer: 2

    - slug: geo-u04-w16-q12
      type: multiple_choice
      topic_code: "4.8"
      source: "IM Geometry, Unit 4, Lesson 8"
      points: 1
      prompt: |
        For an acute angle θ, sin θ = 0.28. What is cos θ?
      options:
        - "0.72"
        - "3.43"
        - "0.28"
        - "0.96"
      option_explanations:
        - |
          0.72 is 1 − 0.28; sine and cosine do not add to 1, their squares do.
        - |
          3.43 is cos θ / sin θ = 0.96/0.28, the reciprocal of the tangent; cosine is never above 1.
        - |
          0.28 would need θ = 45°, where sin = cos ≈ 0.707, not 0.28.
        - |
          Correct. cos² θ = 1 − 0.28² = 1 − 0.0784 = 0.9216, so cos θ = 0.96 (this is the 7-24-25 triangle).
      answer: 3

    - slug: geo-u04-w16-q13
      type: multiple_choice
      topic_code: "4.3"
      source: "IM Geometry, Unit 4, Lesson 3"
      points: 1
      prompt: |
        Review. A right triangle has a 30° angle and its hypotenuse is 26. Without a calculator, what is the leg opposite the 30° angle?
      options:
        - "13√2"
        - "26√3"
        - "13"
        - "13√3"
      option_explanations:
        - |
          √2 belongs to the 45-45-90 triangle (half a square), not to a triangle with a 30° angle.
        - |
          26√3 is longer than the hypotenuse, which no leg can be.
        - |
          Correct. In a 30-60-90 triangle the short leg (opposite 30°) is half the hypotenuse: sin 30° = 1/2.
        - |
          13√3 is the long leg, opposite the 60° angle.
      answer: 2

    - slug: geo-u04-w16-q14
      type: multiple_choice
      topic_code: "3.14"
      source: "IM Geometry, Unit 3, Lesson 14"
      points: 1
      prompt: |
        Review. A student solves a right triangle with hypotenuse 20 and gets legs 12.9 and 15.3. Which check shows an error was made?
      options:
        - "12.9² + 15.3² ≈ 400.5, which matches 20² = 400, so no error is detected"
        - "12.9 × 15.3 ≠ 400, so there is an error"
        - "15.3 − 12.9 ≠ 20, so there is an error"
        - "12.9 + 15.3 = 28.2 ≠ 20, so there is an error"
      option_explanations:
        - |
          Correct. The Pythagorean check is the right test, and here it passes (166.4 + 234.1 ≈ 400.5), so the legs are consistent with the hypotenuse up to rounding.
        - |
          The product of the legs is twice the area, which has no reason to equal the hypotenuse squared.
        - |
          The difference of the legs has no relationship to the hypotenuse.
        - |
          Legs never add to the hypotenuse (the triangle inequality says they add to more); this is not a valid check.
      answer: 0

    - slug: geo-u04-w16-q15
      type: multi_select
      topic_code: "4.8"
      source: "IM Geometry, Unit 4, Lesson 8"
      points: 2
      partial_credit: true
      prompt: |
        Which statements are true for every acute angle θ? Select all that apply.
      options:
        - "tan θ < 1"
        - "cos θ = sin(90° − θ)"
        - "sin θ < 1"
        - "sin² θ + cos² θ = 1"
        - "tan θ = sin θ / cos θ"
      option_explanations:
        - |
          False: tan θ > 1 whenever θ > 45° (for example tan 60° ≈ 1.732).
        - |
          True: the leg adjacent to θ is opposite the complementary angle, with the same hypotenuse.
        - |
          True: the opposite leg is shorter than the hypotenuse.
        - |
          True: (o² + a²)/h² = h²/h² = 1 by the Pythagorean theorem.
        - |
          True: (opposite/hyp) ÷ (adjacent/hyp) = opposite/adjacent.
      answer: [1, 2, 3, 4]

    - slug: geo-u04-w16-q16
      type: multi_select
      topic_code: "4.4"
      source: "IM Geometry, Unit 4, Lesson 4"
      points: 2
      partial_credit: true
      prompt: |
        Review. A right triangle has legs 6 and 8 and hypotenuse 10. Let α be the angle opposite the leg 6 and β the angle opposite the leg 8. Which statements are true? Select all that apply.
      options:
        - "sin β = 0.6"
        - "tan β = 0.75"
        - "cos β = 0.6"
        - "tan α = 0.75"
        - "sin α = 0.6"
      option_explanations:
        - |
          False: the leg opposite β is 8, so sin β = 8/10 = 0.8, not 0.6.
        - |
          False: tan β = 8/6 ≈ 1.33, the reciprocal of tan α.
        - |
          True: the leg adjacent to β is the leg opposite α, which is 6, so cos β = 6/10 = sin α.
        - |
          True: tan α = opposite/adjacent = 6/8 = 0.75 for the angle opposite the leg 6.
        - |
          True: the leg opposite α is 6 and the hypotenuse is 10.
      answer: [2, 3, 4]

    - slug: geo-u04-w16-q17
      type: true_false
      topic_code: "4.6"
      source: "IM Geometry, Unit 4, Lesson 6"
      points: 1
      prompt: |
        True or false: to find the hypotenuse of a right triangle from an acute angle θ and the leg adjacent to it, you divide the leg by cos θ.
      answer: true
      explanation: |
        True. cos θ = adjacent/hypotenuse, so hypotenuse = adjacent / cos θ. Dividing by a number less than 1 makes the result larger, as a hypotenuse should be.

    - slug: geo-u04-w16-q18
      type: true_false
      topic_code: "1.20"
      source: "IM Geometry, Unit 1, Lesson 20"
      points: 1
      prompt: |
        Review. True or false: the angle of depression from a lookout down to a ship equals the angle of elevation from the ship up to the lookout because the two horizontal lines are parallel and the line of sight is a transversal making alternate interior angles.
      answer: true
      explanation: |
        True. The horizontal through the lookout and the horizontal through the ship are parallel; the line of sight crosses both, and the depression angle (at the top) and the elevation angle (at the bottom) are alternate interior angles, hence congruent.

    - slug: geo-u04-w16-q19
      type: fill_blank
      topic_code: "4.5"
      source: "IM Geometry, Unit 4, Lesson 5"
      points: 1
      prompt: |
        The ratio adjacent/hypotenuse for an acute angle θ is called the ____ of θ.
      answer: ["cosine", "cos"]
      explanation: |
        Cosine is the sine of the complement: the adjacent leg of θ is the opposite leg of 90° − θ.

    - slug: geo-u04-w16-q20
      type: fill_blank
      topic_code: "4.1"
      source: "IM Geometry, Unit 4, Lesson 1"
      points: 1
      prompt: |
        Review. The steepness of a ramp, rise divided by run, equals the ____ of the angle the ramp makes with the ground.
      answer: ["tangent", "tan"]
      explanation: |
        With the run horizontal, rise is the opposite leg and run is the adjacent leg, so rise/run = tan θ.

    - slug: geo-u04-w16-q21
      type: numeric
      topic_code: "4.7"
      source: "general knowledge"
      points: 1
      prompt: |
