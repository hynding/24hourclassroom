      points: 3
      prompt: |
        A guy wire runs from the top of a 12 m mast to an anchor on level ground and makes a 58° angle with the ground. Find the length of the wire and the distance from the anchor to the base of the mast, to one decimal place, stating which ratio you use for each and why. (sin 58° ≈ 0.848, cos 58° ≈ 0.530, tan 58° ≈ 1.600)
      answer: |
        The mast (12 m) is the leg opposite the 58° angle; the wire is the hypotenuse; the anchor distance is the adjacent leg. Wire: sin 58° = 12/wire, so wire = 12 / 0.848 ≈ 14.2 m (sine, because the opposite leg and the hypotenuse are involved). Anchor distance: tan 58° = 12/d, so d = 12 / 1.600 = 7.5 m (tangent, because the two legs are involved). Check: 7.5² + 12² = 56.25 + 144 = 200.25 ≈ 14.2² = 201.6, consistent up to rounding.
      explanation: |
        1 point for the wire ≈ 14.2 m with sine justified by opposite and hypotenuse. 1 point for the anchor distance 7.5 m with tangent justified by the two legs (or 14.2 cos 58° ≈ 7.5 with cosine justified). 1 point for correct identification of opposite, adjacent and hypotenuse relative to the 58° angle, or an explicit Pythagorean check.

    - slug: geo-u04-w16-q25
      type: long_answer
      topic_code: "4.7"
      source: "IM Geometry, Unit 4, Lesson 7"
      points: 6
      prompt: |
        A surveyor wants the height h of a building across a river, so she cannot measure the distance to its base. From point A she measures the angle of elevation of the top as 30°. She walks 20 m straight toward the building to point B and measures the angle of elevation as 50°. (tan 30° ≈ 0.5774, tan 50° ≈ 1.1918)

        (a) Draw or describe the figure and label the unknown distance x from B to the base of the building.
        (b) Write two equations for h, one from each sighting.
        (c) Solve for x and h to one decimal place.
        (d) Explain why one sighting alone would not have been enough, and why the surveyor chose to move closer rather than farther away.
      answer: |
        (a) Figure description: the building stands vertically with its base at point C on level ground. B is on the ground x metres from C; A is 20 m farther from C along the same line, so AC = x + 20. The lines of sight from A and B to the top T make angles 30° and 50° with the ground, and ∠TCB = 90°.
        (b) From B: tan 50° = h/x, so h = x tan 50° ≈ 1.1918x. From A: tan 30° = h/(x + 20), so h = (x + 20) tan 30° ≈ 0.5774(x + 20).
        (c) 1.1918x = 0.5774x + 11.548, so 0.6144x = 11.548 and x ≈ 18.8 m. Then h ≈ 1.1918 × 18.8 ≈ 22.4 m. (Check with the other equation: 0.5774 × 38.8 ≈ 22.4.)
        (d) One sighting gives one equation h = d tan θ with two unknowns, h and d, since the distance to the base cannot be measured across the river. A second sighting from a known distance away adds a second equation with the same unknowns. Moving closer makes the second angle noticeably larger (50° versus 30°), so the two equations differ enough to give a well-determined solution; moving farther away would make both angles small and close together, and small errors in the angles would produce large errors in h.
      explanation: |
        Scoring (6 points). (a) 1 point for a correct description with x, x + 20, h and the right angle at the base. (b) 1 point for each correct tangent equation (2 points). (c) 1 point for x ≈ 18.8 m; 1 point for h ≈ 22.4 m. (d) 1 point for explaining the two-unknowns problem and the advantage of a larger angle difference.
