week: 19
unit: 5
title: "Scaling Solids and Cylinder Volumes"
topics: ["5.6", "5.7", "5.8", "5.9", "5.10"]
guide: guides/week-19.md
guide_description: |
  How lengths, surface area and volume scale under a scale factor k (k, k², k³), undoing the scaling with square and cube roots, what scaling means for animals, containers and models, the cylinder volume formula for right and oblique cylinders, and Cavalieri's principle. Worked examples, Try-it problems and a self-check.
flashcards_description: |
  28 cards on the k² and k³ rules, cube roots, surface-to-volume reasoning, cylinder volumes and Cavalieri's principle. Review them before the week 19 quiz.
flashcards:
  - front: Scaling a solid by k → effect on surface area and volume
    back: |
      Lengths × k, surface area × k², volume × k³. A cube of edge 1 becomes a cube of edge k with 6k² of surface and k³ of volume.
    topic_code: "5.6"
  - front: Why volume scales by k³
    back: |
      Any solid is approximately a pile of small cubes, and each cube's volume is multiplied by k · k · k when its edge is multiplied by k.
    topic_code: "5.6"
  - front: k = 2 → area and volume factors
    back: |
      Surface area × 4, volume × 8. For k = 3: × 9 and × 27. For k = 1/2: × 1/4 and × 1/8.
    topic_code: "5.6"
  - front: k = 1.5 → area and volume factors
    back: |
      Area × 2.25, volume × 3.375. A 20 × 30 × 40 box scaled by 1.5 goes from 24,000 to 81,000 in volume.
    topic_code: "5.6"
  - front: Doubling only the radius of a cylinder → volume factor
    back: |
      × 4, because r is squared in V = πr²h. Doubling only the height gives × 2; doubling both gives × 8.
    topic_code: "5.6"
  - front: Cube root → definition and key values
    back: |
      ∛x is the number whose cube is x. ∛8 = 2, ∛27 = 3, ∛64 = 4, ∛125 = 5, ∛1000 = 10, ∛2 ≈ 1.26.
    topic_code: "5.7"
  - front: From a volume factor to k
    back: |
      k = ∛(volume factor). Volume × 8 means k = 2; volume × 1/1000 means k = 1/10.
    topic_code: "5.7"
  - front: From a surface-area factor to k
    back: |
      k = √(area factor). Area × 6.25 means k = 2.5, and then volume × 2.5³ = 15.625.
    topic_code: "5.7"
  - front: Doubling a cube's volume → edge factor
    back: |
      ∛2 ≈ 1.26, not 2 and not √2. Its surface area is multiplied by (∛2)² ≈ 1.587.
    topic_code: "5.7"
  - front: Converting a volume factor to an area factor
    back: |
      Take the cube root to get k, then square it: volume × 64 gives k = 4 and area × 16.
    topic_code: "5.7"
  - front: Bottles of 250 mL and 2000 mL, similar shapes → size comparison
    back: |
      Volume factor 8, so k = 2: the big bottle is twice as tall and wide, with 4 times the label area.
    topic_code: "5.7"
  - front: Weight versus bone strength when an animal is scaled up
    back: |
      Weight goes with volume (k³); bone strength with cross-sectional area (k²). At k = 10 each unit of bone area carries 10 times the load, so large animals need proportionally thicker legs.
    topic_code: "5.8"
  - front: Surface-to-volume ratio under scaling
    back: |
      It scales by k²/k³ = 1/k. Smaller objects have relatively more surface, so they lose heat (or cool, or dissolve) faster.
    topic_code: "5.8"
  - front: Why a mouse eats much more relative to its weight than an elephant
    back: |
      Heat loss is proportional to surface area and heat production to volume; the mouse's surface-to-volume ratio is far larger.
    topic_code: "5.8"
  - front: "Model at 1 : 20 weighs 2 kg → mass of the real object"
    back: |
      2 × 20³ = 16,000 kg (same material). Its surface is 400 times the model's.
    topic_code: "5.8"
  - front: Giant 3 times human height, same proportions → load on bones
    back: |
      Weight × 27, bone cross-section × 9, so each unit of bone area carries 3 times the normal load.
    topic_code: "5.8"
  - front: Doubling a box's dimensions → capacity and cardboard
    back: |
      Capacity × 8, cardboard (surface) × 4.
    topic_code: "5.8"
  - front: Volume of a cylinder → formula
    back: |
      V = πr²h, base area times height, like any prism. r = 3, h = 8 gives 72π ≈ 226.2.
    topic_code: "5.9"
  - front: Finding the height of a cylinder from its volume
    back: |
      h = V/(πr²). A 1 m³ tank of radius 0.5 m has height 1/(0.25π) ≈ 1.27 m.
    topic_code: "5.9"
  - front: Finding the radius of a cylinder from its volume
    back: |
      r = √(V/(πh)). Volume 200π and height 8 give r² = 25, r = 5.
    topic_code: "5.9"
  - front: Volume of a pipe (hollow cylinder)
    back: |
      π(R² − r²) × length. Outer radius 5, inner radius 4, length 100: 900π ≈ 2827.
    topic_code: "5.9"
  - front: Oblique cylinder → volume and the meaning of height
    back: |
      Still πr²h with h the perpendicular distance between the bases, not the slanted edge. Same as the right cylinder with the same base and height.
    topic_code: "5.9"
  - front: Unit facts for volume
    back: |
      1 L = 1000 cm³; 1 m³ = 1,000,000 cm³ = 1000 L. Lengths in cm give cm³.
    topic_code: "5.9"
  - front: Cavalieri's principle → statement
    back: |
      Two solids between the same parallel planes have equal volumes if every plane parallel to those planes cuts them in cross sections of equal area.
    topic_code: "5.10"
  - front: Why Cavalieri's principle is believable
    back: |
      Slice both solids into very thin slabs; matching slabs have equal base areas and equal thickness, hence equal volumes; add them up.
    topic_code: "5.10"
  - front: Cavalieri applied to a leaning stack of coins
    back: |
      Pushing a straight stack sideways changes nothing about the slices, so the volume is unchanged: an oblique cylinder equals the right one.
    topic_code: "5.10"
  - front: Cylinder of radius 2 versus square prism of base side 2√π, both height 9 → volumes
    back: |
      Both base areas are 4π, so by Cavalieri both volumes are 36π ≈ 113.1.
    topic_code: "5.10"
  - front: Area scaling by k² (review from week 18)
    back: |
      Lengths × k gives area × k²; undo with a square root. Volume adds one more factor of k.
    topic_code: "5.4"
quiz:
  description: |
    25 questions · about 40 minutes · The k, k², k³ rules, cube roots, scaling in the real world, cylinder volumes and Cavalieri's principle, with review of area scaling, cross sections, dilations, circle area and similarity. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: geo-u05-w19-q01
      type: multiple_choice
      topic_code: "5.9"
      source: "IM Geometry, Unit 5, Lesson 9"
      points: 1
      stimulus: |
        Figure description: a right cylinder has base radius 4 and height 10. A second cylinder is a scaled copy with every length multiplied by 1/2.
      prompt: |
        What is the volume of the original cylinder?
      options:
        - "160π ≈ 502.7"
        - "80π ≈ 251.3"
        - "40π ≈ 125.7"
        - "320π ≈ 1005.3"
      option_explanations:
        - |
          Correct. V = πr²h = π · 4² · 10 = π · 16 · 10 = 160π, the base area times the height.
        - |
          80π uses the radius without squaring it (π · 4 · 2 · 10), which is not the base area.
        - |
          40π is π · 4 · 10, the radius times the height, not the base area times the height.
        - |
          320π squares the diameter 8 instead of the radius 4 and then halves nothing; the base area is π · 4² = 16π.
      answer: 0

    - slug: geo-u05-w19-q02
      type: multiple_choice
      topic_code: "5.6"
      source: "IM Geometry, Unit 5, Lesson 6"
      points: 1
      stimulus: |
        Figure description: a right cylinder has base radius 4 and height 10. A second cylinder is a scaled copy with every length multiplied by 1/2.
      prompt: |
        What is the volume of the scaled copy?
      options:
        - "20π ≈ 62.8"
        - "80π ≈ 251.3"
        - "40π ≈ 125.7"
        - "10π ≈ 31.4"
      option_explanations:
        - |
          Correct. Volume scales by k³ = 1/8: 160π/8 = 20π. Check: π · 2² · 5 = 20π.
        - |
          80π halves the volume, scaling by k instead of k³.
        - |
          40π divides by 4, scaling by k² as if volume were an area.
        - |
          10π divides by 16, which is k⁴; three dimensions give k³ = 1/8.
      answer: 0

    - slug: geo-u05-w19-q03
      type: multiple_choice
      topic_code: "5.6"
      source: "IM Geometry, Unit 5, Lesson 6"
      points: 1
      stimulus: |
        Figure description: a right cylinder has base radius 4 and height 10. A second cylinder is a scaled copy with every length multiplied by 1/2.
      prompt: |
        The surface area of the original cylinder (two bases plus the curved side) is 2π · 4² + 2π · 4 · 10 = 112π. What is the surface area of the scaled copy?
      options:
        - "28π"
        - "56π"
        - "14π"
        - "112π"
      option_explanations:
        - |
          Correct. Surface area scales by k² = 1/4: 112π/4 = 28π. Check: 2π · 4 + 2π · 2 · 5 = 8π + 20π = 28π.
        - |
          56π halves the surface area, scaling by k instead of k².
        - |
          14π divides by 8, the volume factor, not the area factor.
        - |
          Surface area changes under a dilation with k ≠ 1; only the shape is preserved.
      answer: 0

    - slug: geo-u05-w19-q04
      type: multiple_choice
      topic_code: "5.6"
      source: "IM Geometry, Unit 5, Lesson 6"
      points: 1
      prompt: |
        A cube with edge 1 has surface area 6 and volume 1. Which statement explains the surface-area and volume factors when the edge is multiplied by k?
      options:
        - "Each of the 6 faces becomes a k-by-k square, so the surface area is 6k²; the solid is k by k by k, so the volume is k³"
        - "Both are multiplied by k, because every length is multiplied by k"
        - "The surface area is multiplied by 6k and the volume by 3k"
        - "The surface area is multiplied by k³ and the volume by k²"
      option_explanations:
        - |
          Correct. Area involves two lengths and volume three, so the factors are k² and k³.
        - |
          Lengths scale by k, but area and volume are products of two and three lengths respectively.
        - |
          The 6 faces and 3 dimensions do not multiply the factor; they are already counted in the original 6 and 1.
        - |
          The exponents are reversed: area is two-dimensional (k²) and volume three-dimensional (k³).
      answer: 0

    - slug: geo-u05-w19-q05
      type: multiple_choice
      topic_code: "5.7"
      source: "IM Geometry, Unit 5, Lesson 7"
      points: 1
      prompt: |
        Two similar jugs hold 0.5 L and 13.5 L. How many times taller is the larger jug?
      options:
        - "3"
        - "27"
        - "9"
        - "5.2"
      option_explanations:
        - |
          Correct. The volume factor is 27, and k = ∛27 = 3.
        - |
          27 is the volume factor itself; heights scale by its cube root.
        - |
          9 is the surface-area factor (k² = 9), not the height factor.
        - |
          5.2 is √27, a square root; volumes need a cube root.
      answer: 0

    - slug: geo-u05-w19-q06
      type: multiple_choice
      topic_code: "5.7"
      source: "IM Geometry, Unit 5, Lesson 7"
      points: 1
      prompt: |
        A storage tank is to be replaced by a similar tank with exactly twice the capacity. By what factor must each dimension be multiplied?
      options:
        - "∛2 ≈ 1.26"
        - "2"
        - "√2 ≈ 1.41"
        - "2/3"
      option_explanations:
        - |
          Correct. Volume × 2 means k³ = 2, so k = ∛2 ≈ 1.26.
        - |
          Doubling every dimension multiplies the capacity by 8, not 2.
        - |
          √2 is the length factor for doubling an area, not a volume.
        - |
          2/3 would shrink the tank; the exponent 3 belongs on k, not as a fraction.
      answer: 0

    - slug: geo-u05-w19-q07
      type: multiple_choice
      topic_code: "5.7"
      source: "IM Geometry, Unit 5, Lesson 7"
      points: 1
      prompt: |
        A sculpture is enlarged so that its surface area is multiplied by 16. By what factor is its volume multiplied?
      options:
        - "64"
        - "16"
        - "256"
        - "4"
      option_explanations:
        - |
          Correct. k = √16 = 4, so the volume factor is 4³ = 64.
        - |
          16 is the area factor; the volume factor has one more power of k.
        - |
          256 is 16², which is k⁴, too many factors of k.
        - |
          4 is k, the length factor, not the volume factor.
      answer: 0

    - slug: geo-u05-w19-q08
      type: multiple_choice
      topic_code: "5.8"
      source: "IM Geometry, Unit 5, Lesson 8"
      points: 1
      prompt: |
        An animal is scaled up by a factor of 5 with its proportions unchanged. Which statement about its leg bones is correct?
      options:
        - "Its weight is 125 times greater but the cross-sectional area of its bones is only 25 times greater, so each unit of bone area carries 5 times the load"
        - "Weight and bone area both increase 25 times, so the bones are equally strong"
        - "Its weight is 5 times greater and its bones are 5 times stronger"
        - "Its weight is 125 times greater and its bones are 125 times stronger"
      option_explanations:
        - |
          Correct. Weight goes with volume (k³ = 125); strength goes with cross-sectional area (k² = 25); the ratio 125/25 = 5 is the extra load per unit area.
        - |
          Weight is three-dimensional and scales by k³, not k².
        - |
          Neither weight nor strength scales by k; they are volume (k³) and area (k²) quantities.
        - |
          Bone strength depends on the cross-sectional area, which scales by k² = 25, not k³.
      answer: 0

    - slug: geo-u05-w19-q09
      type: multiple_choice
      topic_code: "5.8"
      source: "IM Geometry, Unit 5, Lesson 8"
      points: 1
      prompt: |
        Why does a small ice cube melt faster, relative to its size, than a large block of ice of the same shape?
      options:
        - "Heat enters through the surface (k²) while the amount to melt is the volume (k³), so the small cube has more surface per unit of volume"
        - "Small ice is colder"
        - "Because the small cube has a larger surface area"
        - "Because volume scales by k² and surface by k³"
      option_explanations:
        - |
          Correct. The surface-to-volume ratio scales by 1/k, so it is larger for the small cube.
        - |
          Temperature does not depend on size; the melting rate per unit of volume does, through the surface-to-volume ratio.
        - |
          The small cube has less surface area in absolute terms; what it has more of is surface relative to volume.
        - |
          The exponents are reversed: surface scales by k² and volume by k³.
      answer: 0

    - slug: geo-u05-w19-q10
      type: multiple_choice
      topic_code: "5.9"
      source: "IM Geometry, Unit 5, Lesson 9"
      points: 1
      prompt: |
        A cylindrical can has diameter 10 cm and holds 600 cm³. What is its height, to one decimal place?
      options:
        - "7.6 cm"
        - "1.9 cm"
        - "19.1 cm"
        - "60 cm"
      option_explanations:
        - |
          Correct. r = 5, so h = 600/(25π) ≈ 7.6 cm.
        - |
          1.9 cm uses the diameter squared (100π) as the base area; the radius is 5.
        - |
          19.1 cm uses π · 10 as the base area, forgetting to square the radius.
        - |
          60 cm divides by the diameter alone, ignoring π and the squaring.
      answer: 0

    - slug: geo-u05-w19-q11
      type: multiple_choice
      topic_code: "5.9"
      source: "IM Geometry, Unit 5, Lesson 9"
      points: 1
      prompt: |
        An oblique cylinder has base radius 3; its slanted side is 10 units long and the perpendicular distance between its bases is 8. What is its volume?
      options:
        - "72π"
        - "90π"
        - "30π"
        - "48π"
      option_explanations:
        - |
          Correct. V = πr²h with the perpendicular height 8: π · 9 · 8 = 72π. The slant does not change the volume.
        - |
          90π uses the slanted length 10 as the height; the height is the perpendicular distance 8.
        - |
          30π is π · 3 · 10, using the radius unsquared and the slant length.
        - |
          48π uses 6 (the diameter) as if it were r²; the base area is 9π.
      answer: 0

    - slug: geo-u05-w19-q12
      type: multiple_choice
      topic_code: "5.10"
      source: "IM Geometry, Unit 5, Lesson 10"
      points: 1
      prompt: |
        Which statement is Cavalieri's principle?
      options:
        - "If two solids between the same parallel planes have cross sections of equal area at every height, they have equal volumes"
        - "If two solids have equal surface areas, they have equal volumes"
        - "If two solids have the same height, they have the same volume"
        - "Any two solids with congruent bases have equal volumes"
      option_explanations:
        - |
          Correct. Equal slice areas at every level give equal volumes, slab by slab.
        - |
          Surface area and volume are independent; a long thin rod and a ball can share a surface area with very different volumes.
        - |
          Height alone says nothing about the cross sections; a thin cylinder and a wide one of the same height differ in volume.
        - |
          The cross sections must match at every height, not just at the base; a cone and a cylinder share a base but not a volume.
      answer: 0

    - slug: geo-u05-w19-q13
      type: multiple_choice
      topic_code: "5.4"
      source: "IM Geometry, Unit 5, Lesson 4"
      points: 1
      prompt: |
        Review. A square's side is multiplied by 7. By what factor is its area multiplied, and what does the analogous rule say for a cube's volume?
      options:
        - "Area × 49; a cube's volume would be × 343"
        - "Area × 7; a cube's volume would be × 7"
        - "Area × 14; a cube's volume would be × 21"
        - "Area × 49; a cube's volume would be × 49"
      option_explanations:
        - |
          Correct. Area is k² = 49 and volume is k³ = 343.
        - |
          Area and volume scale by powers of k, not by k itself.
        - |
          Multiplying by the number of dimensions is not how scaling works; the factor is k raised to that power.
        - |
          Volume gains a third factor of k: 7³ = 343.
      answer: 0

    - slug: geo-u05-w19-q14
      type: multiple_choice
      topic_code: "5.2"
      source: "IM Geometry, Unit 5, Lesson 2"
      points: 1
      prompt: |
        Review. In applying Cavalieri's principle to a right cylinder and an oblique cylinder with the same base radius and the same height, what are the cross sections made by a horizontal plane?
      options:
        - "Circles of the same radius in both, so the cross-section areas are equal at every height"
        - "A circle in the right cylinder and an ellipse in the oblique one"
        - "Rectangles in both"
        - "A circle in the right cylinder and a larger circle in the oblique one"
      option_explanations:
        - |
          Correct. Horizontal planes are parallel to both bases, so each slice is a translate of the base circle.
        - |
          An ellipse arises from a tilted plane; a horizontal plane in an oblique cylinder still cuts a circle congruent to the base.
        - |
          Rectangles come from vertical planes through the axis, not horizontal ones.
        - |
          The oblique cylinder's horizontal slices are congruent to its base, which has the same radius.
      answer: 0

    - slug: geo-u05-w19-q15
      type: multi_select
      topic_code: "5.7"
      source: "IM Geometry, Unit 5, Lesson 7"
      points: 2
      partial_credit: true
      prompt: |
        A model of a building is built at 1 : 50. Which statements are true? Select all that apply.
      options:
        - "The real building's volume is 125,000 times the model's"
        - "The real building's surface area is 2500 times the model's"
        - "The real building is 50 times as tall as the model"
        - "The real building's volume is 2500 times the model's"
        - "The real building's floor area is 50 times the model's"
      option_explanations:
        - |
          True: volume scales by k³ = 50³ = 125,000.
        - |
          True: surface area scales by k² = 50² = 2500.
        - |
          True: every length, including the height, scales by k = 50.
        - |
          False: 2500 is the area factor; volume uses k³.
        - |
          False: floor area is an area and scales by 50² = 2500.
      answer: [0, 1, 2]

    - slug: geo-u05-w19-q16
      type: multi_select
      topic_code: "3.4"
      source: "IM Geometry, Unit 3, Lesson 4"
      points: 2
      partial_credit: true
      prompt: |
        Review. A solid is dilated with scale factor 3. Which quantities are multiplied by exactly 3? Select all that apply.
      options:
        - "Its height"
        - "The perimeter of any cross section"
        - "The area of any cross section"
        - "Its volume"
        - "The length of its longest diagonal"
      option_explanations:
        - |
          Yes: height is a length, and every length is multiplied by the scale factor 3.
        - |
          Yes: a perimeter is a sum of lengths, each multiplied by 3, so the sum is multiplied by 3.
        - |
          No: cross-section areas are multiplied by 9.
        - |
          No: volume is three-dimensional and is multiplied by 3³ = 27.
        - |
          Yes: a diagonal is a length, so it is multiplied by exactly 3 like every other length.
      answer: [0, 1, 4]

    - slug: geo-u05-w19-q17
      type: true_false
      topic_code: "5.3"
      source: "IM Geometry, Unit 5, Lesson 3"
      points: 1
      prompt: |
        Review. True or false: the cross section of a cone made by a plane parallel to the base, halfway between the apex and the base, has one quarter of the base area.
      answer: true
      explanation: |
        True. The cross section is a dilation of the base from the apex with k = 1/2, so its area is k² = 1/4 of the base area (and its radius is half the base radius).
    - slug: geo-u05-w19-q18
      type: true_false
      topic_code: "3.6"
      source: "IM Geometry, Unit 3, Lesson 6"
      points: 1
      prompt: |
        Review. True or false: two cylinders are similar whenever their heights are in the same ratio as their radii.
      answer: true
      explanation: |
        True. A cylinder is determined by its radius and height; if both are multiplied by the same k, a dilation (plus a rigid motion) carries one onto the other. Cylinders with different height-to-radius ratios are not similar.

    - slug: geo-u05-w19-q19
      type: fill_blank
      topic_code: "5.7"
      source: "IM Geometry, Unit 5, Lesson 7"
      points: 1
      prompt: |
        If a solid's volume is multiplied by 1000, its lengths have been multiplied by ____.
      answer: ["10", "ten"]
      explanation: |
        k = ∛1000 = 10; the surface area is then multiplied by 100.

    - slug: geo-u05-w19-q20
      type: fill_blank
      topic_code: "5.10"
      source: "IM Geometry, Unit 5, Lesson 10"
      points: 1
      prompt: |
        The principle stating that solids with equal cross-sectional areas at every height have equal volumes is named after ____.
      answer: ["Cavalieri", "Bonaventura Cavalieri"]
      explanation: |
        Cavalieri's principle justifies V = Bh for oblique prisms and cylinders and, next week, the 1/3 in the pyramid formula.

    - slug: geo-u05-w19-q21
      type: numeric
      topic_code: "5.9"
      source: "general knowledge"
      points: 1
      prompt: |
        A cylindrical water tank has radius 1.5 m and height 2 m. How many litres does it hold? (1 m³ = 1000 L; use π ≈ 3.1416.) Give your answer to the nearest 10 litres.
      answer: { value: 14140, tolerance: 10 }
      explanation: |
        V = π · 1.5² · 2 = 4.5π ≈ 14.137 m³ ≈ 14,140 L.

    - slug: geo-u05-w19-q22
      type: short_answer
      topic_code: "5.5"
      source: "IM Geometry, Unit 5, Lesson 5"
      points: 3
      prompt: |
        Review. A cardboard box has volume 12,000 cm³ and surface area 3400 cm². A similar box has surface area 21,250 cm². Find the scale factor between the boxes, explain why a square root is involved, and find the larger box's volume.
      answer: |
        The surface-area factor is 21,250/3400 = 6.25. Surface area scales by k², so k = √6.25 = 2.5; the square root is needed because area is two-dimensional and the factor 6.25 contains k twice. Volume scales by k³ = 2.5³ = 15.625, so the larger box's volume is 12,000 × 15.625 = 187,500 cm³.
      explanation: |
        1 point for the area factor 6.25 and k = 2.5. 1 point for explaining the square root through the k² rule for area. 1 point for the volume 187,500 cm³ via k³ = 15.625.
    - slug: geo-u05-w19-q23
      type: numeric
      topic_code: "4.11"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. A regular hexagonal prism has base side 4 and height 10. What is its volume? Give your answer to one decimal place. (The area of a regular hexagon with side s is (3√3/2)s².)
      answer: { value: 415.7, tolerance: 0.3 }
      explanation: |
        Base area = (3√3/2) · 16 = 24√3 ≈ 41.57, and V = Bh = 41.57 × 10 ≈ 415.7.

    - slug: geo-u05-w19-q24
      type: short_answer
      topic_code: "5.8"
      source: "IM Geometry, Unit 5, Lesson 8"
      points: 3
      prompt: |
        A film shows a spider enlarged to 100 times its normal size with the same proportions. Using the k², k³ rules, explain two separate reasons the giant spider could not function: one about its legs and one about breathing through its surface (real spiders take in oxygen through surfaces whose area scales like any area).
      answer: |
        Legs: the spider's weight scales with volume, k³ = 1,000,000 times, while the cross-sectional area of its legs, which determines how much they can support, scales with k² = 10,000 times. Each unit of leg area would have to carry 100 times the normal load, so the legs would collapse. Breathing: oxygen intake scales with surface area (× 10,000) but the body needing oxygen scales with volume (× 1,000,000), so the giant would receive only 1/100 of the oxygen per unit of body it needs. Both failures come from the surface-to-volume ratio dropping by a factor of k = 100.
      explanation: |
        1 point for weight ∝ k³ versus leg strength ∝ k² with the resulting 100-fold overload. 1 point for oxygen intake ∝ k² versus demand ∝ k³ with the 100-fold shortfall. 1 point for using the correct numbers (10,000 and 1,000,000) or stating that the surface-to-volume ratio falls by the factor k.

    - slug: geo-u05-w19-q25
      type: long_answer
      topic_code: "5.10"
      source: "IM Geometry, Unit 5, Lesson 10"
      points: 6
      prompt: |
        Solid A is a right cylinder with base radius 3 and height 12. Solid B is an oblique cylinder with the same base radius whose bases are 12 apart (perpendicular distance) but whose axis is tilted so that the top base is shifted 5 units sideways. Solid C is a right square prism of height 12 whose base is a square of side 3√π.

        (a) Describe the cross section of each solid made by a horizontal plane at height y (0 < y < 12), and give its area.
        (b) Use Cavalieri's principle to compare the three volumes, and compute them.
        (c) Explain why the slanted edge of Solid B (which is longer than 12) must not be used as the height, and find its length.
        (d) Solid D is a cone with base radius 3 and height 12. Explain why Cavalieri's principle does NOT give it the same volume as A, by describing its cross section at height y.
      answer: |
        (a) A: a circle of radius 3, area 9π. B: a circle of radius 3 (a horizontal slice of an oblique cylinder is a translate of its base), area 9π. C: a square of side 3√π, area 9π. All three have cross-section area 9π at every height.
        (b) All three lie between the same horizontal planes (height 0 to 12) and have equal cross-section areas at every height, so by Cavalieri's principle they have equal volumes: V = 9π × 12 = 108π ≈ 339.3 for each.
        (c) Volume is base area times perpendicular height because the solid is a stack of slices each of thickness measured perpendicular to the bases; the slanted edge measures a longer, tilted distance. The edge is the hypotenuse of a right triangle with legs 12 (vertical) and 5 (the sideways shift): √(144 + 25) = 13.
        (d) At height y above the base, the cone's cross section is a circle of radius 3(12 − y)/12 = 3 − y/4 (a dilation of the base from the apex), with area π(3 − y/4)², which equals 9π only at y = 0 and is smaller above it. Since the cross-section areas differ, Cavalieri's principle does not apply, and indeed the cone's volume is one third of the cylinder's, 36π.
      explanation: |
        Scoring (6 points). (a) 1 point for all three cross sections correctly described with area 9π each (the square's side 3√π giving 9π must be noted). (b) 1 point for invoking Cavalieri with the hypotheses checked; 1 point for V = 108π. (c) 1 point for the perpendicular-height explanation and the slant edge 13. (d) 1 point for the cone's cross-section radius 3 − y/4 (or an equivalent description) and 1 point for concluding the areas differ so the principle does not apply.
