week: 18
unit: 5
title: "Solids, Cross Sections and Scaling Area"
topics: ["5.1", "5.2", "5.3", "5.4", "5.5"]
guide: guides/week-18.md
guide_description: |
  Solids of rotation and the regions that generate them, cross sections of prisms, cylinders, pyramids, cones and spheres, why a cross section parallel to the base of a pyramid or cone is a dilation of the base from the apex, and scaling area by k² in both directions. Worked examples, Try-it problems and a self-check.
flashcards_description: |
  28 cards on solids of rotation, cross sections, dilated cross sections, the k² rule for area and unscaling with square roots. Review them before the week 18 quiz.
flashcards:
  - front: Solid of rotation → definition
    back: |
      The solid swept out when a plane region is rotated 360° about a line called the axis. Every cross section perpendicular to the axis is a circle or a ring.
    topic_code: "5.1"
  - front: Rectangle rotated about one of its sides → solid
    back: |
      A cylinder whose height is that side and whose radius is the other side.
    topic_code: "5.1"
  - front: Right triangle rotated about a leg → solid
    back: |
      A cone whose height is that leg and whose radius is the other leg; the hypotenuse becomes the slant height.
    topic_code: "5.1"
  - front: Semicircle rotated about its diameter → solid
    back: |
      A sphere with the same radius. A quarter-disc rotated about a bounding radius gives a hemisphere.
    topic_code: "5.1"
  - front: Rectangle rotated about a parallel line outside it → solid
    back: |
      A tube (cylindrical shell): outer radius is the far side's distance from the axis, inner radius the near side's.
    topic_code: "5.1"
  - front: Right trapezoid rotated about its perpendicular side → solid
    back: |
      A frustum, which is a cone with its top sliced off parallel to the base.
    topic_code: "5.1"
  - front: Region producing a cylinder of radius 1 and height 10 with a cone of height 3 on top
    back: |
      A 1-by-10 rectangle with one long side on the axis, and on top of it a right triangle with legs 3 (on the axis) and 1.
    topic_code: "5.1"
  - front: Cross section → definition
    back: |
      The plane figure where a plane cuts through a solid.
    topic_code: "5.2"
  - front: Cylinder cross sections
    back: |
      Parallel to the base: a circle. Through the axis: a rectangle. Tilted: an ellipse (possibly cut off by the bases).
    topic_code: "5.2"
  - front: Cone cross sections
    back: |
      Parallel to the base: a circle, smaller nearer the apex. Through the apex perpendicular to the base: an isosceles triangle. Tilted: ellipse, parabola or hyperbola.
    topic_code: "5.2"
  - front: Sphere cross sections
    back: |
      Always a circle, largest (a great circle) when the plane passes through the centre.
    topic_code: "5.2"
  - front: Cube cross sections that are possible
    back: |
      Square, rectangle, triangle (plane cutting one corner), pentagon and regular hexagon (through the midpoints of six edges).
    topic_code: "5.2"
  - front: Cube of side 6 cut through the midpoints of three edges at one vertex → cross section
    back: |
      An equilateral triangle with side 3√2, each side being the hypotenuse of a right triangle with legs 3 and 3.
    topic_code: "5.2"
  - front: Cylinder of radius 3 cut by a vertical plane 1 unit from the axis → cross section
    back: |
      A rectangle of width 2√(9 − 1) = 2√8 ≈ 5.66 (a chord) and the cylinder's height.
    topic_code: "5.2"
  - front: Square pyramid cross sections
    back: |
      Parallel to the base: a smaller square. Through the apex perpendicular to the base: an isosceles triangle. Parallel to one base edge but tilted: a trapezoid.
    topic_code: "5.2"
  - front: Cross section of a pyramid or cone parallel to the base → what it is
    back: |
      A dilation of the base from the apex with scale factor k = (distance from apex)/(height). It is similar to the base with lengths × k and area × k².
    topic_code: "5.3"
  - front: Why a parallel cross section is a dilation from the apex
    back: |
      Every base point lies on a ray from the apex; the cutting plane meets each ray at the fraction d/h of its length (side-splitter in the vertical triangle through the ray), exactly as the dilation does.
    topic_code: "5.3"
  - front: Square pyramid, base 12, height 9, cut 3 below the apex → cross section
    back: |
      k = 3/9 = 1/3: a square of side 4 and area 16 (base area 144 × 1/9).
    topic_code: "5.3"
  - front: Cone of radius 5 and height 15, cut 6 above the base → cross section
    back: |
      The cut is 9 below the apex, k = 9/15 = 0.6: a circle of radius 3 and area 9π.
    topic_code: "5.3"
  - front: Frustum → definition and how to find the top radius
    back: |
      A cone with its top removed by a cut parallel to the base. Top radius = base radius × (height above the cut, measured from the apex)/(full height).
    topic_code: "5.3"
  - front: Scaling lengths by k → effect on area
    back: |
      Area is multiplied by k². Lengths × 3 gives area × 9; lengths × 0.5 gives area × 0.25.
    topic_code: "5.4"
  - front: Why area scales by k² for any shape
    back: |
      Approximate the region by small squares; each square's side is multiplied by k, so each area is multiplied by k², and so is the total.
    topic_code: "5.4"
  - front: Lengths increased by 10 % → area change
    back: |
      Area × 1.1² = 1.21, a 21 % increase. Lengths up 20 % gives area up 44 %.
    topic_code: "5.4"
  - front: Pizza of diameter 30 cm versus 40 cm → area ratio
    back: |
      (40/30)² = 16/9 ≈ 1.78. If the prices are 12 and 18 dollars (ratio 1.5), the larger pizza is the better value per unit area.
    topic_code: "5.4"
  - front: Unscaling area → finding k from an area ratio
    back: |
      k = √(area factor). Area × 16 gives k = 4; area × 2 gives k = √2 ≈ 1.414; area × 0.36 gives k = 0.6.
    topic_code: "5.5"
  - front: Photo 10 cm by 15 cm enlarged to area 600 cm² → new dimensions
    back: |
      Original area 150, factor 4, k = 2: 20 cm by 30 cm.
    topic_code: "5.5"
  - front: Tripling a circle's area → what to do to the radius
    back: |
      Multiply the radius by √3 ≈ 1.732, since area ∝ r².
    topic_code: "5.5"
  - front: Dilations and area (review from Unit 3)
    back: |
      A dilation with scale factor k multiplies every length by k and every area by k²; k is found from a length ratio directly or from an area ratio by a square root.
    topic_code: "3.4"
quiz:
  description: |
    25 questions · about 40 minutes · Solids of rotation, cross sections, dilated cross sections of pyramids and cones, scaling and unscaling area, with review of rotations, dilations, similarity, the Pythagorean theorem and trigonometry. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: geo-u05-w18-q01
      type: multiple_choice
      topic_code: "5.3"
      source: "IM Geometry, Unit 5, Lesson 3"
      points: 1
      stimulus: |
        Figure description: a square pyramid has a base of side 12 and height 9. A plane parallel to the base cuts the pyramid 3 units below the apex.
      prompt: |
        What is the scale factor of the dilation, centred at the apex, that carries the base onto the cross section?
      options:
        - "2/3"
        - "3"
        - "1/3"
        - "1/4"
      option_explanations:
        - |
          2/3 is the fraction of the height measured from the base; the dilation is centred at the apex, so the distance from the apex is what counts.
        - |
          3 would enlarge the base; a cross section nearer the apex is smaller than the base.
        - |
          Correct. The cut is 3 of the 9 units from the apex, so k = 3/9 = 1/3.
        - |
          1/4 is 3/12, mixing the distance from the apex with the base side instead of the height.
      answer: 2

    - slug: geo-u05-w18-q02
      type: multiple_choice
      topic_code: "5.3"
      source: "IM Geometry, Unit 5, Lesson 3"
      points: 1
      stimulus: |
        Figure description: a square pyramid has a base of side 12 and height 9. A plane parallel to the base cuts the pyramid 3 units below the apex.
      prompt: |
        What is the cross section?
      options:
        - "A square of side 4"
        - "A square of side 8"
        - "A rectangle 4 by 12"
        - "A square of side 9"
      option_explanations:
        - |
          Correct. The dilation with k = 1/3 sends the base square of side 12 to a square of side 4.
        - |
          Side 8 corresponds to k = 2/3, the fraction measured from the base rather than the apex.
        - |
          A dilation keeps the shape: the image of a square is a square.
        - |
          Side 9 subtracts 3 from 12; the cross section is a scaled copy, not a trimmed one.
      answer: 0

    - slug: geo-u05-w18-q03
      type: multiple_choice
      topic_code: "5.4"
      source: "IM Geometry, Unit 5, Lesson 4"
      points: 1
      stimulus: |
        Figure description: a square pyramid has a base of side 12 and height 9. A plane parallel to the base cuts the pyramid 3 units below the apex.
      prompt: |
        What fraction of the base area is the cross-section area?
      options:
        - "4/9"
        - "1/9"
        - "1/6"
        - "1/3"
      option_explanations:
        - |
          4/9 would be the area fraction for k = 2/3, the cut 6 units below the apex.
        - |
          Correct. Area scales by k² = (1/3)² = 1/9: the cross section has area 16 and the base has area 144.
        - |
          1/6 is not the square of any ratio in the figure; k² = 1/9.
        - |
          1/3 is the length factor; area uses its square.
      answer: 1

    - slug: geo-u05-w18-q04
      type: multiple_choice
      topic_code: "5.1"
      source: "IM Geometry, Unit 5, Lesson 1"
      points: 1
      prompt: |
        A right triangle with legs 4 and 9 is rotated 360° about the leg of length 9. What solid is produced?
      options:
        - "A cone with height 4 and base radius 9"
        - "A sphere of radius 9"
        - "A cylinder with height 9 and radius 4"
        - "A cone with height 9 and base radius 4"
      option_explanations:
        - |
          The axis leg (9) is the height; the leg that sweeps the base circle is 4.
        - |
          A sphere comes from a semicircle rotated about its diameter.
        - |
          A cylinder comes from rotating a rectangle; a triangle tapers to the apex.
        - |
          Correct. The leg on the axis becomes the height, and the other leg sweeps out the circular base.
      answer: 3

    - slug: geo-u05-w18-q05
      type: multiple_choice
      topic_code: "5.1"
      source: "IM Geometry, Unit 5, Lesson 1"
      points: 1
      prompt: |
        Which plane region, rotated about the vertical axis, produces a solid cylinder of radius 2 and height 7 with a hemisphere of radius 2 on top?
      options:
        - "A 2-by-7 rectangle with a long side on the axis, with a quarter-disc of radius 2 on top whose straight radius lies on the axis"
        - "A 4-by-7 rectangle centred on the axis, with a half-disc on top"
        - "A 2-by-7 rectangle with a short side on the axis, with a quarter-disc on top"
        - "A 2-by-7 rectangle with a long side on the axis, with a semicircle of radius 2 on top"
      option_explanations:
        - |
          Correct. The rectangle sweeps the cylinder, and a quarter-disc with one radius along the axis sweeps a hemisphere.
        - |
          Only the half of the region on one side of the axis is needed; a 4-wide rectangle centred on the axis sweeps the same cylinder but describes the solid redundantly and the half-disc is wrongly placed.
        - |
          A short side on the axis gives a cylinder of radius 7 and height 2.
        - |
          A full semicircle on one side of the axis would sweep more than a hemisphere (its straight edge is not on the axis).
      answer: 0

    - slug: geo-u05-w18-q06
      type: multiple_choice
      topic_code: "5.2"
      source: "IM Geometry, Unit 5, Lesson 2"
      points: 1
      prompt: |
        A cylinder is cut by a plane that contains its axis. What is the cross section?
      options:
        - "A circle congruent to the base"
        - "A square, always"
        - "A rectangle whose width is the diameter and whose height is the cylinder's height"
        - "An ellipse"
      option_explanations:
        - |
          A circle is the cross section for a plane parallel to the bases.
        - |
          It is a square only when the height equals the diameter.
        - |
          Correct. The plane cuts each base along a diameter and the curved surface along two vertical lines.
        - |
          An ellipse comes from a tilted plane, not one through the axis.
      answer: 2

    - slug: geo-u05-w18-q07
      type: multiple_choice
      topic_code: "5.2"
      source: "IM Geometry, Unit 5, Lesson 2"
      points: 1
      prompt: |
        Which cross section is NOT possible for a cube?
      options:
        - "An equilateral triangle"
        - "A regular hexagon"
        - "A rectangle that is not a square"
        - "A circle"
      option_explanations:
        - |
          A plane through three vertices adjacent to one corner (or the midpoints of the three edges there) gives an equilateral triangle.
        - |
          A plane through the midpoints of six edges gives a regular hexagon.
        - |
          A vertical plane not parallel to a face gives a rectangle wider than the cube's edge.
        - |
          Correct. A plane meets the flat faces of a cube in straight segments, so every cross section is a polygon.
      answer: 3

    - slug: geo-u05-w18-q08
      type: multiple_choice
      topic_code: "5.2"
      source: "IM Geometry, Unit 5, Lesson 2"
      points: 1
      prompt: |
        A cylinder of radius 5 and height 12 is cut by a vertical plane 3 units from its axis. What is the cross section?
      options:
        - "A rectangle 6 by 12"
        - "A rectangle 8 by 12"
        - "A rectangle 10 by 12"
        - "A circle of radius 4"
      option_explanations:
        - |
          6 is twice the distance from the axis, not the chord length.
        - |
          Correct. The plane cuts each base in a chord at distance 3 from the centre, of length 2√(25 − 9) = 8; the height is 12.
        - |
          10 is the diameter, the chord length only for a plane through the axis.
        - |
          A vertical plane does not produce a circle; circles come from horizontal planes.
      answer: 1

    - slug: geo-u05-w18-q09
      type: multiple_choice
      topic_code: "5.3"
      source: "IM Geometry, Unit 5, Lesson 3"
      points: 1
      prompt: |
        A cone has base radius 10 and height 25. What is the radius of the cross section 15 units above the base?
      options:
        - "4"
        - "6"
        - "2.5"
        - "15"
      option_explanations:
        - |
          Correct. The cut is 10 units below the apex, so k = 10/25 = 0.4 and the radius is 10 × 0.4 = 4.
        - |
          6 uses k = 15/25, the fraction measured from the base instead of the apex.
        - |
          2.5 is 25/10, a ratio with no meaning here.
        - |
          15 is the height of the cut, not a radius.
      answer: 0

    - slug: geo-u05-w18-q10
      type: multiple_choice
      topic_code: "5.3"
      source: "IM Geometry, Unit 5, Lesson 3"
      points: 1
      prompt: |
        Why is a cross section of a cone parallel to its base a dilation of the base from the apex?
      options:
        - "Because the cone is a solid of rotation"
        - "Because all circles are similar"
        - "Each base point lies on a segment from the apex, and the cutting plane meets every such segment at the same fraction of its length, which is what a dilation does"
        - "Because the plane is parallel to the axis"
      option_explanations:
        - |
          The same fact holds for pyramids, which are not solids of rotation.
        - |
          Similar circles do not explain the specific scale factor or the centre of the dilation.
        - |
          Correct. In the vertical triangle through any base point, the cut is a parallel line, so by the side-splitter theorem it divides the segment from the apex in the ratio d/h.
        - |
          The cutting plane is parallel to the base and perpendicular to the axis.
      answer: 2

    - slug: geo-u05-w18-q11
      type: multiple_choice
      topic_code: "5.4"
      source: "IM Geometry, Unit 5, Lesson 4"
      points: 1
      prompt: |
        Every side of a hexagon is multiplied by 2.5. By what factor is its area multiplied?
      options:
        - "5"
        - "15.625"
        - "2.5"
        - "6.25"
      option_explanations:
        - |
          5 doubles the factor instead of squaring it.
        - |
          15.625 is 2.5³, the volume factor for a solid, not the area factor.
        - |
          2.5 is the length factor; area uses its square.
        - |
          Correct. Area scales by k² = 2.5² = 6.25.
      answer: 3

    - slug: geo-u05-w18-q12
      type: multiple_choice
      topic_code: "5.5"
      source: "IM Geometry, Unit 5, Lesson 5"
      points: 1
      prompt: |
        A square's area increases from 40 cm² to 250 cm². By what factor did its side length increase?
      options:
        - "3.125"
        - "2.5"
        - "5"
        - "6.25"
      option_explanations:
        - |
          3.125 is half the area factor; unscaling needs a square root, not a halving.
        - |
          Correct. The area factor is 250/40 = 6.25, so the length factor is √6.25 = 2.5.
        - |
          5 would give an area factor of 25, far more than 6.25.
        - |
          6.25 is the area factor; the side factor is its square root.
      answer: 1

    - slug: geo-u05-w18-q13
      type: multiple_choice
      topic_code: "1.14"
      source: "IM Geometry, Unit 1, Lesson 14"
      points: 1
      prompt: |
        Review. A point P is rotated 360° about a line through point O perpendicular to the plane of the rotation. Which statement describes the path of P?
      options:
        - "A straight segment of length OP"
        - "A circle of radius 2 · OP"
        - "The single point P, since 360° brings it back"
        - "A circle centred at O with radius OP, because a rotation keeps every point at the same distance from the centre"
      option_explanations:
        - |
          A rotation moves P around O, not along a straight line.
        - |
          The distance OP is preserved, so the radius is OP itself.
        - |
          P returns to its start, but along the way it traces the whole circle, which is the path that sweeps the solid.
        - |
          Correct. Rotations preserve distance from the centre, so P sweeps a circle of radius OP; this is why solids of rotation have circular cross sections.
      answer: 3

    - slug: geo-u05-w18-q14
      type: multiple_choice
      topic_code: "3.5"
      source: "IM Geometry, Unit 3, Lesson 5"
      points: 1
      prompt: |
        Review. In the vertical triangle through the apex A of a cone, the base diameter is BC and a cut parallel to BC meets AB at D and AC at E. If AD/AB = 0.4, which statement follows from the side-splitter theorem?
      options:
        - "DE = 0.6 · BC, because the cut is 60 % of the way down"
        - "DE = 0.4 · BC, so the cross section's radius is 0.4 times the base radius"
        - "DE = BC, because DE ∥ BC"
        - "AE/AC = 0.6"
      option_explanations:
        - |
          The scale factor is measured from the apex A, where the dilation is centred: 0.4, not 0.6.
        - |
          Correct. DE ∥ BC gives △ADE ∼ △ABC with k = AD/AB = 0.4, so DE/BC = 0.4 and the same factor applies to the radius.
        - |
          Parallel means similar, not congruent; DE is a scaled copy of BC.
        - |
          AE/AC equals AD/AB = 0.4 by the side-splitter theorem.
      answer: 1

    - slug: geo-u05-w18-q15
      type: multi_select
      topic_code: "5.2"
      source: "IM Geometry, Unit 5, Lesson 2"
      points: 2
      partial_credit: true
      prompt: |
        Which solids have a circle as every cross section made by a plane parallel to the base (or, for a sphere, by any plane)? Select all that apply.
      options:
        - "Triangular prism"
        - "Square pyramid"
        - "Sphere"
        - "Cone"
        - "Cylinder"
      option_explanations:
        - |
          No: horizontal slices of a triangular prism are triangles.
        - |
          No: horizontal slices of a square pyramid are squares.
        - |
          Yes: every plane section of a sphere is a circle.
        - |
          Yes: every horizontal slice of a cone is a circle, smaller nearer the apex.
        - |
          Yes: every horizontal slice of a cylinder is a circle congruent to the base.
      answer: [2, 3, 4]

    - slug: geo-u05-w18-q16
      type: multi_select
      topic_code: "3.6"
      source: "IM Geometry, Unit 3, Lesson 6"
      points: 2
      partial_credit: true
      prompt: |
        Review. Two similar triangles have areas 20 and 45. Which statements are true? Select all that apply.
      options:
        - "Each side of the larger is 2.25 times the corresponding side of the smaller"
        - "The ratio of their areas equals the square of the ratio of their sides"
        - "The larger triangle's height is 2.25 times the smaller's"
        - "The scale factor from the smaller to the larger is 1.5"
        - "The perimeter of the larger is 1.5 times the perimeter of the smaller"
      option_explanations:
        - |
          False: 2.25 is the area ratio; sides scale by 1.5.
        - |
          True: that is the k² rule for area, because both dimensions are scaled by k.
        - |
          False: heights are lengths and scale by k = 1.5.
        - |
          True: the area ratio is k² = 45/20 = 2.25, so the length ratio is k = 1.5.
        - |
          True: a perimeter is a sum of lengths, so it scales by k = 1.5 like any length.
      answer: [1, 3, 4]

    - slug: geo-u05-w18-q17
      type: true_false
      topic_code: "5.1"
      source: "IM Geometry, Unit 5, Lesson 1"
      points: 1
      prompt: |
        True or false: rotating a rectangle about a line parallel to one of its sides but not touching the rectangle produces a solid cylinder.
      answer: false
      explanation: |
        False. Because the rectangle does not reach the axis, the swept solid has a hole along the axis: it is a tube (cylindrical shell) with inner radius equal to the gap and outer radius equal to the far side's distance from the axis.

    - slug: geo-u05-w18-q18
      type: true_false
      topic_code: "3.4"
      source: "IM Geometry, Unit 3, Lesson 4"
      points: 1
      prompt: |
        Review. True or false: a dilation with scale factor 1/3 maps a square of area 144 to a square of area 48.
      answer: false
      explanation: |
        False. Area scales by k² = 1/9, so the image has area 16. Dividing by 3 would be scaling by k, which applies to lengths (the side goes from 12 to 4).

    - slug: geo-u05-w18-q19
      type: fill_blank
      topic_code: "5.2"
      source: "IM Geometry, Unit 5, Lesson 2"
      points: 1
      prompt: |
        The plane figure formed where a plane cuts through a solid is called a ____.
      answer: ["cross section", "cross-section"]
      explanation: |
        Cross sections depend on the solid and on the direction of the cutting plane; parallel-to-base cuts of pyramids and cones are dilations of the base.

    - slug: geo-u05-w18-q20
      type: fill_blank
      topic_code: "3.6"
      source: "IM Geometry, Unit 3, Lesson 6"
      points: 1
      prompt: |
        Review. For similar figures, the ratio of their areas is the ____ of the ratio of their corresponding lengths.
      answer: ["square"]
      explanation: |
        If lengths are in ratio k, areas are in ratio k²; going backwards, the length ratio is the square root of the area ratio.
    - slug: geo-u05-w18-q21
      type: numeric
      topic_code: "5.3"
      source: "general knowledge"
      points: 1
      prompt: |
        A cone has base radius 9 and height 24. A plane parallel to the base cuts it 8 units below the apex. What is the area of the cross section, in square units? Give your answer to one decimal place (use π ≈ 3.1416).
      answer: { value: 28.3, tolerance: 0.2 }
      explanation: |
        k = 8/24 = 1/3, so the radius is 3 and the area is 9π ≈ 28.3. Equivalently, base area 81π times k² = 1/9.

    - slug: geo-u05-w18-q22
      type: short_answer
      topic_code: "4.9"
      source: "IM Geometry, Unit 4, Lesson 9"
      points: 3
      prompt: |
        Review. A right triangle with legs 5 (horizontal) and 12 (vertical) is rotated about its vertical leg. Describe the solid, find its slant height, and find the angle the slant side makes with the base, to one decimal place.
      answer: |
        The solid is a cone with height 12 and base radius 5. Its slant height is the hypotenuse of the generating triangle: √(25 + 144) = 13. The angle between the slant side and the base is the angle at the base vertex of the triangle, with opposite leg 12 and adjacent leg 5: tan θ = 12/5 = 2.4, so θ = tan⁻¹(2.4) ≈ 67.4°.
      explanation: |
        1 point for identifying a cone with height 12 and radius 5. 1 point for the slant height 13. 1 point for the angle ≈ 67.4° via tan⁻¹(12/5) (or cos⁻¹(5/13)).
    - slug: geo-u05-w18-q23
      type: numeric
      topic_code: "3.14"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. A right triangle with legs 6 and 8 is rotated about the leg of length 8. What is the slant height of the resulting cone? Give an integer.
      answer: { value: 10, tolerance: 0 }
      explanation: |
        The hypotenuse becomes the slant height: √(36 + 64) = 10.

    - slug: geo-u05-w18-q24
      type: short_answer
      topic_code: "5.5"
      source: "IM Geometry, Unit 5, Lesson 5"
      points: 3
      prompt: |
        A pizzeria sells a 25 cm pizza for 9 dollars and a 35 cm pizza for 15 dollars (the sizes are diameters). Which is the better value per unit of area? Show the area comparison, and explain why comparing diameters alone would mislead.
      answer: |
        The area ratio is (35/25)² = 1.4² = 1.96, so the larger pizza has almost twice the area. The price ratio is 15/9 ≈ 1.67. Since the area grows more (×1.96) than the price (×1.67), the 35 cm pizza is the better value: about 0.0156 dollars per cm² versus 0.0183 dollars per cm² (areas ≈ 490.9 and 962.1 cm²). Comparing diameters suggests the large is only 40 % bigger, but area scales by the square of the length factor, so it is 96 % bigger.
      explanation: |
        1 point for the area factor 1.96 from squaring 1.4. 1 point for comparing with the price factor 1.67 (or computing price per area) and concluding the larger is better value. 1 point for explaining that area scales by k², so diameter comparison understates the size difference.

    - slug: geo-u05-w18-q25
      type: long_answer
