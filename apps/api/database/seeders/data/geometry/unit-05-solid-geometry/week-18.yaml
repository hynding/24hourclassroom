      prompt: |
        A cone has base radius 6 and height 18. It is cut by a plane parallel to the base, 12 units above the base, and the small cone on top is removed, leaving a frustum.

        (a) Explain why the cross section is a dilation of the base, name the centre and scale factor, and find the radius of the cut.
        (b) Find the area of the top of the frustum and the area of its base, and state their ratio.
        (c) The slant height of the original cone is √(6² + 18²). Find the slant height of the small removed cone and of the frustum, explaining how similarity gives each.
        (d) A second cut is to be made so that its cross section has exactly half the base area. How far below the apex should it be?
      answer: |
        (a) Every point of the base lies on a segment from the apex, and a plane parallel to the base cuts all those segments at the same fraction of their length (side-splitter in each vertical triangle), which is precisely a dilation centred at the apex. The cut is 18 − 12 = 6 units below the apex, so k = 6/18 = 1/3, and the radius of the cut is 6 × 1/3 = 2.
        (b) Top area = π · 2² = 4π ≈ 12.6; base area = π · 6² = 36π ≈ 113.1; ratio 1/9 = k².
        (c) The original slant height is √(36 + 324) = √360 = 6√10 ≈ 18.97. The small cone is similar to the whole with k = 1/3, so its slant height is 6√10/3 = 2√10 ≈ 6.32. The frustum's slant height is the difference: 6√10 − 2√10 = 4√10 ≈ 12.65 (check: √(12² + 4²) = √160 = 4√10, with 4 = 6 − 2 the difference in radii).
        (d) Half the base area means k² = 1/2, so k = 1/√2 ≈ 0.707, and the cut is 18 × 0.707 ≈ 12.7 units below the apex (about 5.3 units above the base).
      explanation: |
        Scoring (6 points). (a) 1 point for the dilation explanation with centre at the apex; 1 point for k = 1/3 and radius 2. (b) 1 point for areas 4π and 36π with ratio 1/9. (c) 1 point for the small cone's slant height 2√10 by similarity; 1 point for the frustum's slant height 4√10. (d) 1 point for k = 1/√2 and the distance ≈ 12.7 below the apex.
