    - slug: geo-u05-exam-q42
      type: short_answer
      topic_code: "5.10"
      source: "IM Geometry, Unit 5, Lesson 10"
      points: 3
      prompt: |
        State Cavalieri's principle. Then use it to explain why two pyramids with the same height, one with a square base of side 6 and the other with a rectangular base 4 by 9, have the same volume, and compute that volume if the height is 10.
      answer: |
        Cavalieri's principle: if two solids lie between the same pair of parallel planes and every plane parallel to them cuts the solids in cross sections of equal area, the solids have equal volume. Both bases have area 36. At height y above the base, each pyramid's cross section is a dilation of its base from its apex with the same scale factor (h − y)/h, so both cross sections have area 36((h − y)/h)². Equal areas at every height give equal volumes. With h = 10, V = ⅓ · 36 · 10 = 120 for both.
      explanation: |
        1 point for a correct statement of the principle. 1 point for the equal-cross-section argument using the dilation scale factor. 1 point for V = 120.

    - slug: geo-u05-exam-q43
      type: short_answer
      topic_code: "5.8"
      source: "IM Geometry, Unit 5, Lesson 8"
      points: 3
      prompt: |
        A toy company makes a 20 cm tall plastic figure weighing 150 g. It plans a 1 m tall version of the same shape and the same plastic. Explain how to find the weight of the large figure, compute it, and explain why "5 times as tall means 5 times as heavy" is wrong.
      answer: |
        The scale factor is k = 100/20 = 5. Weight is proportional to volume (same material), and volume scales by k³ = 125, so the large figure weighs 150 × 125 = 18,750 g ≈ 18.75 kg. Height is one dimension, but the figure grows in all three dimensions; width and depth are also multiplied by 5, so the volume (and weight) is multiplied by 5 × 5 × 5, not 5.
      explanation: |
        1 point for k = 5 and the k³ rule. 1 point for 18,750 g (18.75 kg). 1 point for the explanation that all three dimensions scale, giving 125 rather than 5.

    - slug: geo-u05-exam-q44
      type: long_answer
      topic_code: "5.15"
      source: "IM Geometry, Unit 5, Lesson 15"
      points: 8
      prompt: |
        A storage tank is a cylinder of radius 2 m and height 6 m standing on the ground, with a cone of height 1.5 m on top (same radius). The steel used for the outside has density 7850 kg/m³ and is 0.01 m thick (treat the steel as a thin layer: mass ≈ density × surface area × thickness).

        (a) Find the volume of the tank (cylinder plus cone), to one decimal place.
        (b) Find the outside surface area to be made of steel: the curved wall, the cone's curved surface, and the circular floor. Give the cone's slant height exactly and the total area to one decimal place.
        (c) Estimate the mass of steel in the tank.
        (d) The tank is filled with oil of density 880 kg/m³. Find the oil's mass, and explain which of the two masses would change more, and by what factor, if the tank were rebuilt at twice the size (k = 2) with the same steel thickness.
      answer: |
        (a) Cylinder π · 4 · 6 = 24π ≈ 75.4 m³; cone ⅓ π · 4 · 1.5 = 2π ≈ 6.3 m³. Total 26π ≈ 81.7 m³.
        (b) Wall 2π · 2 · 6 = 24π ≈ 75.4 m². Cone slant height ℓ = √(2² + 1.5²) = 2.5 m; curved area πrℓ = 5π ≈ 15.7 m². Floor π · 4 = 4π ≈ 12.6 m². Total 33π ≈ 103.7 m².
        (c) Mass ≈ 7850 × 103.7 × 0.01 ≈ 8140 kg (about 8.1 tonnes).
        (d) Oil mass = 880 × 81.7 ≈ 71,900 kg. At k = 2 the volume (and the oil mass) is multiplied by 8, to about 575,000 kg, while the steel's surface area is multiplied by 4, so with the same thickness the steel mass is multiplied by 4, to about 32,600 kg. The oil mass changes more, by a factor of 8 versus 4; this is the k³ versus k² rule, and it is why larger tanks need thicker walls.
      explanation: |
        Scoring (8 points). (a) 1 point for the cylinder 24π and the cone 2π; 1 point for the total ≈ 81.7 m³. (b) 1 point for the slant height 2.5 m; 1 point for the total area ≈ 103.7 m² with the three parts identified (no top circle under the cone). (c) 1 point for ≈ 8140 kg. (d) 1 point for the oil mass ≈ 71,900 kg; 1 point for the factors 8 (volume) and 4 (area); 1 point for identifying the oil mass as changing more and connecting it to k³ versus k².
