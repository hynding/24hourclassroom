      source: "IM Geometry, Unit 5, Lesson 13"
      points: 1
      prompt: |
        True or false: moving the apex of a pyramid sideways, keeping it at the same height above the same base, changes the volume.
      answer: false
      explanation: |
        False. By Cavalieri's principle the cross sections at every height remain dilations of the base with the same scale factor, so the volume ⅓Bh is unchanged; only the surface area changes.

