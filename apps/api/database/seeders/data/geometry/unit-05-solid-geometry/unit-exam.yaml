unit: 5
description: |
  44 questions · about 80 minutes · covers every lesson of Unit 5 (solids of rotation, cross sections, dilated
  cross sections, scaling area and volume, cube roots, size in the real world, cylinder, prism, pyramid, cone and
  sphere volumes, Cavalieri's principle, surface area, density and graphs of volume) with some review of Units 3
  and 4. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
  matched automatically; the short answers and the long answer are graded by your teacher against the scoring
  notes. Use π ≈ 3.1416 where a decimal is asked for.
questions:
    - slug: geo-u05-exam-q01
      type: multiple_choice
      topic_code: "5.12"
      source: "IM Geometry, Unit 5, Lesson 12"
      points: 1
      stimulus: |
        Figure description: a right cone has base radius 5 and height 12. A right cylinder has the same base radius and the same height.
      prompt: |
        What are the volumes of the cone and the cylinder?
      options:
        - "Cone 100π, cylinder 300π"
        - "Cone 300π, cylinder 900π"
        - "Cone 150π, cylinder 300π"
        - "Cone 100π, cylinder 200π"
      option_explanations:
        - |
          Correct. Cylinder π · 25 · 12 = 300π; the cone is one third of it, 100π.
        - |
          300π is the cylinder, not the cone; the cone is a third of the cylinder.
        - |
          150π is half the cylinder; the factor for a cone is one third.
        - |
          The cylinder is π · 25 · 12 = 300π, not 200π.
      answer: 0

    - slug: geo-u05-exam-q02
      type: multiple_choice
      topic_code: "5.14"
      source: "IM Geometry, Unit 5, Lesson 14"
      points: 1
      stimulus: |
        Figure description: a right cone has base radius 5 and height 12. A right cylinder has the same base radius and the same height.
      prompt: |
        What is the total surface area of the cone?
      options:
        - "90π"
        - "85π"
        - "65π"
        - "170π"
      option_explanations:
        - |
          Correct. Slant height ℓ = √(25 + 144) = 13; lateral area πrℓ = 65π; plus the base 25π gives 90π.
        - |
          85π uses the height 12 instead of the slant height 13 in the lateral area (60π + 25π).
        - |
          65π is the lateral area alone, without the base.
        - |
          170π is the cylinder's total surface area (2 · 25π + 120π), not the cone's; the cone's total is 90π.
      answer: 0

    - slug: geo-u05-exam-q03
      type: multiple_choice
      topic_code: "5.3"
      source: "IM Geometry, Unit 5, Lesson 3"
      points: 1
      stimulus: |
        Figure description: a right cone has base radius 5 and height 12. A right cylinder has the same base radius and the same height.
      prompt: |
        Both solids are cut by a horizontal plane 9 units above the base. What are the two cross sections?
      options:
        - "Cone: a circle of radius 1.25; cylinder: a circle of radius 5"
        - "Cone: a circle of radius 3.75; cylinder: a circle of radius 5"
        - "Cone: a circle of radius 5; cylinder: a circle of radius 5"
        - "Cone: an isosceles triangle; cylinder: a rectangle"
      option_explanations:
        - |
          Correct. The cut is 3 units below the apex, k = 3/12 = 1/4, so the cone's section has radius 5/4 = 1.25; every horizontal section of the cylinder is the base circle.
        - |
          3.75 uses k = 9/12 measured from the base; the dilation is centred at the apex, 3 units away.
        - |
          The cone narrows toward the apex, so its section is smaller than the base.
        - |
          Triangles and rectangles come from vertical planes through the axis, not horizontal ones.
      answer: 0

    - slug: geo-u05-exam-q04
      type: multiple_choice
      topic_code: "5.1"
      source: "IM Geometry, Unit 5, Lesson 1"
      points: 1
      prompt: |
        A semicircle of radius 7 is rotated 360° about its diameter. What solid results, and what is its volume?
      options:
        - "A sphere of radius 7, volume 4/3 π · 343 ≈ 1436.8"
        - "A hemisphere of radius 7, volume 2/3 π · 343 ≈ 718.4"
        - "A cylinder of radius 7 and height 14, volume 686π"
        - "A cone of radius 7 and height 7, volume 343π/3"
      option_explanations:
        - |
          Correct. Rotating a half-disc about its diameter sweeps the whole ball.
        - |
          A hemisphere comes from a quarter-disc rotated about a bounding radius.
        - |
          A cylinder comes from a rectangle, not a curved region.
        - |
          A cone comes from a right triangle rotated about a leg.
      answer: 0

    - slug: geo-u05-exam-q05
      type: multiple_choice
      topic_code: "5.2"
      source: "IM Geometry, Unit 5, Lesson 2"
      points: 1
      prompt: |
        Which plane cuts a square pyramid in a trapezoid?
      options:
        - "A vertical plane parallel to one base edge that does not pass through the apex"
        - "A plane parallel to the base"
        - "A plane through the apex perpendicular to the base"
        - "No plane; a square pyramid's cross sections are only squares and triangles"
      option_explanations:
        - |
          Correct. A vertical plane parallel to a base edge, away from the apex, cuts the base in a segment and the two side faces in segments meeting the opposite slanted face in a shorter parallel segment: a trapezoid.
        - |
          A plane parallel to the base gives a square (a dilation of the base).
        - |
          A plane through the apex gives a triangle.
        - |
          Trapezoids and even pentagons are possible for suitable tilted planes.
      answer: 0

    - slug: geo-u05-exam-q06
      type: multiple_choice
      topic_code: "5.4"
      source: "IM Geometry, Unit 5, Lesson 4"
      points: 1
      prompt: |
        A triangle has area 30. Its sides are all multiplied by 1.2. What is the new area?
      options:
        - "43.2"
        - "36"
        - "51.84"
        - "32.4"
      option_explanations:
        - |
          Correct. Area scales by 1.2² = 1.44, and 30 × 1.44 = 43.2.
        - |
          36 scales by 1.2 once; area needs the square.
        - |
          51.84 scales by 1.2³, which is the volume factor.
        - |
          32.4 adds 8 % instead of 44 %; a 20 % length increase is a 44 % area increase.
      answer: 0

    - slug: geo-u05-exam-q07
      type: multiple_choice
      topic_code: "5.5"
      source: "IM Geometry, Unit 5, Lesson 5"
      points: 1
      prompt: |
        A photograph is enlarged so that its area is multiplied by 2.25. By what factor is its width multiplied?
      options:
        - "1.5"
        - "2.25"
        - "1.125"
        - "5.0625"
      option_explanations:
        - |
          Correct. Width is a length: k = √2.25 = 1.5.
        - |
          2.25 is the area factor; lengths use its square root.
        - |
          1.125 halves the area factor; unscaling needs a square root.
        - |
          5.0625 is 2.25², going the wrong direction.
      answer: 0

    - slug: geo-u05-exam-q08
      type: multiple_choice
      topic_code: "5.6"
      source: "IM Geometry, Unit 5, Lesson 6"
      points: 1
      prompt: |
        A box has volume 400 cm³ and surface area 340 cm². Every dimension is multiplied by 3. What are the new volume and surface area?
      options:
        - "Volume 10,800 cm³, surface area 3060 cm²"
        - "Volume 3600 cm³, surface area 3060 cm²"
        - "Volume 10,800 cm³, surface area 1020 cm²"
        - "Volume 1200 cm³, surface area 1020 cm²"
      option_explanations:
        - |
          Correct. Volume × 27 = 10,800; surface area × 9 = 3060.
        - |
          3600 scales the volume by 9 (the area factor) instead of 27.
        - |
          1020 scales the surface area by 3 instead of 9.
        - |
          Both are scaled by 3 only; area and volume need k² and k³.
      answer: 0

    - slug: geo-u05-exam-q09
      type: multiple_choice
      topic_code: "5.7"
      source: "IM Geometry, Unit 5, Lesson 7"
      points: 1
      prompt: |
        Two similar bottles have volumes 180 mL and 1440 mL. How do their heights compare?
      options:
        - "The large one is 2 times as tall"
        - "The large one is 8 times as tall"
        - "The large one is 4 times as tall"
        - "The large one is 2.83 times as tall"
      option_explanations:
        - |
          Correct. Volume factor 8, so k = ∛8 = 2.
        - |
          8 is the volume factor; heights scale by its cube root.
        - |
          4 is the surface-area factor (k²), not the height factor.
        - |
          2.83 is √8, a square root; volumes need a cube root.
      answer: 0

    - slug: geo-u05-exam-q10
      type: multiple_choice
      topic_code: "5.7"
      source: "IM Geometry, Unit 5, Lesson 7"
      points: 1
      prompt: |
        A cube's volume is to be increased by 50 % (multiplied by 1.5). By what factor must its edge be multiplied?
      options:
        - "∛1.5 ≈ 1.145"
        - "1.5"
        - "√1.5 ≈ 1.225"
        - "0.5"
      option_explanations:
        - |
          Correct. k³ = 1.5 gives k = ∛1.5 ≈ 1.145.
        - |
          Multiplying the edge by 1.5 multiplies the volume by 3.375.
        - |
          A square root undoes an area factor, not a volume factor.
        - |
          0.5 would shrink the cube to an eighth of its volume.
      answer: 0

    - slug: geo-u05-exam-q11
      type: multiple_choice
      topic_code: "5.8"
      source: "IM Geometry, Unit 5, Lesson 8"
      points: 1
      prompt: |
        Why can an ant lift many times its own weight while an elephant cannot?
      options:
        - "Muscle strength scales with cross-sectional area (k²) while weight scales with volume (k³), so small animals have far more strength relative to their weight"
        - "Ants have stronger muscle tissue"
        - "Elephants are lazy"
        - "Weight scales with k² and strength with k³"
      option_explanations:
        - |
          Correct. Strength per unit weight scales by k²/k³ = 1/k, which is huge for tiny k.
        - |
          The tissue is comparable; the difference is geometric scaling.
        - |
          The explanation is about area and volume scaling, not behaviour.
        - |
          The exponents are reversed: weight is a volume quantity (k³), strength an area quantity (k²).
      answer: 0

    - slug: geo-u05-exam-q12
      type: multiple_choice
      topic_code: "5.9"
      source: "IM Geometry, Unit 5, Lesson 9"
      points: 1
      prompt: |
        A cylindrical tank has radius 1.2 m and height 2.5 m. About how many litres does it hold?
      options:
        - "About 11,300 L"
        - "About 1,130 L"
        - "About 9,420 L"
        - "About 22,600 L"
      option_explanations:
        - |
          Correct. V = π · 1.44 · 2.5 ≈ 11.31 m³, and 1 m³ = 1000 L.
        - |
          1,130 L drops a factor of 10 in the conversion; 1 m³ is 1000 L.
        - |
          9,420 uses π · 1.2 · 2.5 (radius unsquared).
        - |
          22,600 doubles the volume, perhaps using the diameter 2.4 in place of the radius without squaring correctly.
      answer: 0

    - slug: geo-u05-exam-q13
      type: multiple_choice
      topic_code: "5.10"
      source: "IM Geometry, Unit 5, Lesson 10"
      points: 1
      prompt: |
        A right prism and an oblique prism have congruent bases of area 40 and the same perpendicular height 7. Which statement is justified by Cavalieri's principle?
      options:
        - "Both have volume 280, because every horizontal cross section of each is congruent to the base"
        - "The oblique prism has a larger volume because its edges are longer"
        - "The oblique prism has a smaller volume because it leans"
        - "Their volumes cannot be compared without knowing the angle of lean"
      option_explanations:
        - |
          Correct. Equal cross-section areas at every height give equal volumes: 40 × 7 = 280 for both.
        - |
          Longer slanted edges do not add volume; the cross sections and height are what count.
        - |
          Leaning changes the surface area, not the volume.
        - |
          Cavalieri's principle gives equal volumes regardless of the lean.
      answer: 0

    - slug: geo-u05-exam-q14
      type: multiple_choice
      topic_code: "5.13"
      source: "IM Geometry, Unit 5, Lesson 13"
      points: 1
      stimulus: |
        Figure description: a right square pyramid has base 8 by 8 and height 3. The apex is above the centre of the base.
      prompt: |
        What is the volume of the pyramid, and what fact about pyramids and prisms gives the formula?
      options:
        - "64, because a pyramid has one third of the volume of the prism with the same base and height"
        - "192, because a pyramid has the same volume as the prism with the same base and height"
        - "96, because a pyramid has half the volume of the matching prism"
        - "32, because a pyramid has one sixth of the volume of the matching prism"
      option_explanations:
        - |
          Correct. ⅓ · 64 · 3 = 64 (three congruent pyramids fill a cube; Cavalieri extends it).
        - |
          192 is the prism's volume; the pyramid is a third of it.
        - |
          The factor is one third, not one half; half of the prism's 192 is 96, but the pyramid is 64.
        - |
          One sixth is wrong; the cube splits into three pyramids, not six.
      answer: 0

    - slug: geo-u05-exam-q15
      type: multiple_choice
      topic_code: "5.14"
      source: "IM Geometry, Unit 5, Lesson 14"
      points: 1
      stimulus: |
        Figure description: a right square pyramid has base 8 by 8 and height 3. The apex is above the centre of the base.
      prompt: |
        What is the lateral area (the four triangular faces)?
      options:
        - "80"
        - "48"
        - "144"
        - "160"
      option_explanations:
        - |
          Correct. Slant height √(3² + 4²) = 5; each face is ½ · 8 · 5 = 20; four faces give 80.
        - |
          48 uses the height 3 instead of the slant height 5.
        - |
          144 is the total surface area (80 + 64), not the lateral area.
        - |
          160 omits the ½ in each triangle's area.
      answer: 0

    - slug: geo-u05-exam-q16
      type: multiple_choice
      topic_code: "5.6"
      source: "IM Geometry, Unit 5, Lesson 6"
      points: 1
      stimulus: |
        Figure description: a right square pyramid has base 8 by 8 and height 3. The apex is above the centre of the base.
      prompt: |
        A similar pyramid has base 20 by 20. What is its volume?
      options:
        - "1000"
        - "400"
        - "160"
        - "2560"
      option_explanations:
        - |
          Correct. k = 20/8 = 2.5, so the volume is 64 × 2.5³ = 64 × 15.625 = 1000 (check: ⅓ · 400 · 7.5 = 1000).
        - |
          400 scales by k² = 6.25, the area factor.
        - |
          160 scales the volume by k = 2.5 only; volume needs k³ = 15.625.
        - |
          2560 scales by 40, which is not any power of 2.5.
      answer: 0

    - slug: geo-u05-exam-q17
      type: multiple_choice
      topic_code: "5.15"
      source: "IM Geometry, Unit 5, Lesson 15"
      points: 1
      prompt: |
        A sphere has radius 6. What are its volume and surface area?
      options:
        - "Volume 288π, surface area 144π"
        - "Volume 144π, surface area 288π"
        - "Volume 216π, surface area 36π"
        - "Volume 288π, surface area 36π"
      option_explanations:
        - |
          Correct. 4/3 π · 216 = 288π and 4π · 36 = 144π.
        - |
          The two values are swapped: 288π is the volume (4/3 πr³) and 144π the surface area (4πr²).
        - |
          216π omits the 4/3, and 36π is one great circle, not the whole surface.
        - |
          The surface area is four great circles, 4 · 36π = 144π.
      answer: 0

    - slug: geo-u05-exam-q18
      type: multiple_choice
      topic_code: "5.15"
      source: "IM Geometry, Unit 5, Lesson 15"
      points: 1
      prompt: |
        A water tower is a cylinder of radius 5 m and height 12 m with a hemispherical top of radius 5 m. What is its volume?
      options:
        - "300π + 250π/3 ≈ 1204.3 m³"
        - "300π + 500π/3 ≈ 1466.1 m³"
        - "300π + 125π ≈ 1335.2 m³"
        - "60π + 250π/3 ≈ 450.3 m³"
      option_explanations:
        - |
          Correct. Cylinder π · 25 · 12 = 300π; hemisphere 2/3 π · 125 = 250π/3.
        - |
          500π/3 is a full sphere, not a hemisphere.
        - |
          125π is πr³ without the factor 2/3 that a hemisphere requires (2/3 · 125π = 250π/3).
        - |
          60π uses the radius unsquared in the cylinder.
      answer: 0

    - slug: geo-u05-exam-q19
      type: multiple_choice
      topic_code: "5.16"
      source: "IM Geometry, Unit 5, Lesson 16"
      points: 1
      prompt: |
        Two containers each hold 1000 cm³: a cube and a cylinder with height equal to its diameter. Which has less surface area, and roughly how much?
      options:
        - "The cylinder, about 554 cm² versus the cube's 600 cm²"
        - "The cube, about 600 cm² versus the cylinder's 650 cm²"
        - "They are equal at 600 cm²"
        - "The cube, because squares are more efficient than circles"
      option_explanations:
        - |
          Correct. Cube: edge 10, area 600. Cylinder with h = 2r: πr² · 2r = 1000 gives r ≈ 5.42, h ≈ 10.84, area 2πr² + 2πrh ≈ 184.5 + 369.0 ≈ 553.5.
        - |
          The cylinder's area is about 554, less than the cube's.
        - |
          The cylinder is slightly more efficient; the areas differ.
        - |
          Rounder shapes enclose volume with less surface; the sphere is the most efficient of all.
      answer: 0

    - slug: geo-u05-exam-q20
      type: multiple_choice
      topic_code: "5.17"
      source: "IM Geometry, Unit 5, Lesson 17"
      points: 1
      prompt: |
        A solid lead sphere (density 11.3 g/cm³) has radius 2 cm. What is its mass?
      options:
        - "About 379 g"
        - "About 142 g"
        - "About 34 g"
        - "About 3030 g"
      option_explanations:
        - |
          Correct. V = 4/3 π · 8 ≈ 33.5 cm³; mass ≈ 33.5 × 11.3 ≈ 379 g.
        - |
          142 g uses 4π ≈ 12.57 (omitting r³) as the volume; the volume is 4/3 π · 8 ≈ 33.5 cm³.
        - |
          34 g is the volume in cm³, not multiplied by the density.
        - |
          3030 g uses r = 4 (the diameter) in the volume formula.
      answer: 0

    - slug: geo-u05-exam-q21
      type: multiple_choice
      topic_code: "5.17"
      source: "IM Geometry, Unit 5, Lesson 17"
      points: 1
      prompt: |
        A block of wood has mass 480 g and volume 800 cm³. Which statement is correct?
      options:
        - "Its density is 0.6 g/cm³, so it floats in water"
        - "Its density is 1.67 g/cm³, so it sinks"
        - "Its density is 0.6 g/cm³, so it sinks"
        - "Its density is 384,000 g/cm³"
      option_explanations:
        - |
          Correct. 480/800 = 0.6 g/cm³, below water's 1 g/cm³, so it floats.
        - |
          1.67 divides volume by mass; density is mass over volume.
        - |
          A density below 1 g/cm³ means floating, not sinking.
        - |
          Multiplying mass by volume has no physical meaning.
      answer: 0

    - slug: geo-u05-exam-q22
      type: multiple_choice
      topic_code: "5.18"
      source: "IM Geometry, Unit 5, Lesson 18"
      points: 1
      prompt: |
        A cone has fixed radius 3. Which describes the graph of its volume against its height h?
      options:
        - "A straight line through the origin with slope 3π"
        - "A parabola through the origin"
        - "A cubic curve"
        - "A horizontal line"
      option_explanations:
        - |
          Correct. V = ⅓ π · 9 · h = 3πh, linear in h.
        - |
          A parabola would arise if the radius varied with the height fixed.
        - |
          A cubic arises when the whole solid scales.
        - |
          The volume grows with the height, so the graph cannot be horizontal; V = 3πh rises steadily.
      answer: 0

    - slug: geo-u05-exam-q23
      type: multiple_choice
      topic_code: "5.18"
      source: "IM Geometry, Unit 5, Lesson 18"
      points: 1
      prompt: |
        A graph of V against r for a cylinder with fixed height passes through (2, 50). What is V when r = 6?
      options:
        - "450"
        - "150"
        - "1350"
        - "100"
      option_explanations:
        - |
          Correct. V ∝ r² with the height fixed; tripling r multiplies V by 9: 450.
        - |
          150 treats the relationship as linear (tripling r triples V), but V depends on r².
        - |
          1350 multiplies by 27, the cubic factor, but only the radius changes.
        - |
          100 doubles V, which matches neither the linear nor the quadratic relationship for tripling r.
      answer: 0

    - slug: geo-u05-exam-q24
      type: multiple_choice
      topic_code: "5.11"
      source: "IM Geometry, Unit 5, Lesson 11"
      points: 1
      prompt: |
        A right prism has a regular hexagonal base of side 2 (area 6√3 ≈ 10.39) and height 9. What is its total surface area?
      options:
        - "108 + 12√3 ≈ 128.8"
        - "108 + 6√3 ≈ 118.4"
        - "54√3 ≈ 93.5"
        - "108"
      option_explanations:
        - |
          Correct. Lateral area = perimeter × height = 12 × 9 = 108; two bases add 2 · 6√3 = 12√3.
        - |
          Only one base is counted; a prism has two.
        - |
          54√3 is the volume (10.39 × 9 ≈ 93.5), not a surface area.
        - |
          108 is the lateral area alone; the two hexagonal bases (12√3) must be added.
      answer: 0

    - slug: geo-u05-exam-q25
      type: multiple_choice
      topic_code: "5.14"
      source: "IM Geometry, Unit 5, Lesson 14"
      points: 1
      prompt: |
        A cone of height 20 is cut parallel to its base, 15 units above the base. What fraction of the volume is in the small top cone?
      options:
        - "1/64"
        - "1/4"
        - "27/64"
        - "1/16"
      option_explanations:
        - |
          Correct. The top cone is 5 units tall out of 20, k = 1/4, and volume scales by k³ = 1/64.
        - |
          1/4 is the length factor, not the volume factor.
        - |
          27/64 would be the fraction for k = 3/4 (the removed part if the cut were 5 above the base).
        - |
          1/16 is k², the area factor of the cut's cross section, not the volume factor k³.
      answer: 0

    - slug: geo-u05-exam-q26
      type: multiple_choice
      topic_code: "3.14"
      source: "IM Geometry, Unit 3, Lesson 14"
      points: 1
      prompt: |
        Review. A right square pyramid has base side 10 and slant height 13. What is its height?
      options:
        - "12"
        - "√69 ≈ 8.3"
        - "13"
        - "√(13² + 5²) ≈ 13.9"
      option_explanations:
        - |
          Correct. The slant height is the hypotenuse of a right triangle with legs h and s/2 = 5: h = √(169 − 25) = 12.
        - |
          √69 uses the full side 10 instead of its half.
        - |
          13 is the slant height; the height is shorter.
        - |
          Adding squares finds a hypotenuse; the slant height already is the hypotenuse.
      answer: 0

    - slug: geo-u05-exam-q27
      type: multiple_choice
      topic_code: "4.9"
      source: "IM Geometry, Unit 4, Lesson 9"
      points: 1
      prompt: |
        Review. A cone has radius 6 and height 8. What angle does its slant side make with the base?
      options:
        - "tan⁻¹(8/6) ≈ 53.1°"
        - "tan⁻¹(6/8) ≈ 36.9°"
        - "sin⁻¹(8/6), which is undefined"
        - "cos⁻¹(8/10) ≈ 36.9°"
      option_explanations:
        - |
          Correct. At the base vertex, the opposite leg is the height 8 and the adjacent leg is the radius 6.
        - |
          6/8 is the tangent of the angle at the apex (between the slant side and the axis).
        - |
          8/6 exceeds 1 and is a ratio of legs, so tangent, not sine, applies.
        - |
          8/10 is the sine of the base angle (height over slant height), so cos⁻¹(0.8) gives the complementary angle.
      answer: 0

    - slug: geo-u05-exam-q28
      type: multiple_choice
      topic_code: "3.4"
      source: "IM Geometry, Unit 3, Lesson 4"
      points: 1
      prompt: |
        Review. Which property of dilations explains why a cross section of a pyramid parallel to its base is similar to the base?
      options:
        - "A dilation maps every figure to a similar figure, preserving angles and multiplying lengths by k"
        - "A dilation preserves distances"
        - "A dilation maps every line to a perpendicular line"
        - "A dilation has no fixed points"
      option_explanations:
        - |
          Correct. The cross section is the image of the base under a dilation from the apex, hence similar.
        - |
          Dilations multiply distances by k; only rigid motions preserve them.
        - |
          Dilations map lines to parallel lines (or themselves).
        - |
