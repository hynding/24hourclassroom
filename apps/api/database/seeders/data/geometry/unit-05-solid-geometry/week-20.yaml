week: 20
unit: 5
title: "Prisms and Pyramids"
topics: ["5.11", "5.12", "5.13", "5.14"]
guide: guides/week-20.md
guide_description: |
  Prism volumes as base area times height, lateral and total surface area, the relationship between prisms and pyramids, two proofs of V = ⅓Bh (three pyramids in a cube, and Cavalieri), volumes of pyramids, cones and frustums, slant heights and surface areas. Worked examples, Try-it problems and a self-check.
flashcards_description: |
  28 cards on prism and pyramid volumes, the cube dissection, the Cavalieri argument, slant heights, lateral areas and frustums. Review them before the week 20 quiz.
flashcards:
  - front: Volume of a prism → formula and reason
    back: |
      V = Bh, base area times perpendicular height: a prism is a stack of copies of its base. Works for any base and, by Cavalieri, for oblique prisms.
    topic_code: "5.11"
  - front: Triangular prism with base legs 6 and 8, height 10 → volume and surface area
    back: |
      Base area 24, V = 240. Surface area = 2 · 24 + (6 + 8 + 10) · 10 = 48 + 240 = 288.
    topic_code: "5.11"
  - front: Lateral area of a right prism → formula
    back: |
      (perimeter of base) × height. Total surface area = lateral area + 2B.
    topic_code: "5.11"
  - front: Trapezoidal trough 30 cm and 50 cm wide, 20 cm deep, 120 cm long → capacity
    back: |
      Base area ½(30 + 50)(20) = 800 cm²; V = 96,000 cm³ = 96 L.
    topic_code: "5.11"
  - front: Missing height of a prism from its volume
    back: |
      h = V/B. A rectangular prism with V = 720, length 12 and width 6 has height 720/72 = 10.
    topic_code: "5.11"
  - front: Oblique prism → volume
    back: |
      Still Bh with h the perpendicular height; the lean changes the lateral area but not the volume (Cavalieri).
    topic_code: "5.11"
  - front: Pyramid versus prism with the same base and height → volume relationship
    back: |
      The pyramid has one third of the prism's volume: V = ⅓Bh. The same holds for a cone in a cylinder: ⅓πr²h.
    topic_code: "5.12"
  - front: Sand experiment → what it shows
    back: |
      A pyramid's contents fill the matching prism exactly three times, suggesting the factor ⅓; the proofs make it certain.
    topic_code: "5.12"
  - front: Square pyramid with base 10 by 10 and height 12 → volume
    back: |
      ⅓ · 100 · 12 = 400.
    topic_code: "5.12"
  - front: Cone with radius 6 and height 8 → volume
    back: |
      ⅓ · 36π · 8 = 96π ≈ 301.6.
    topic_code: "5.12"
  - front: Three pyramids in a cube → the dissection argument
    back: |
      Pick a vertex V of a cube of edge s. The three faces not containing V are bases of three congruent pyramids with apex V that fill the cube, so each has volume s³/3 = ⅓ · s² · s.
    topic_code: "5.13"
  - front: Why the three pyramids in the cube are congruent
    back: |
      A rotation of the cube about the diagonal through V (by 120°) carries each pyramid onto the next.
    topic_code: "5.13"
  - front: Cavalieri argument for pyramids
    back: |
      Two pyramids with equal base area B and equal height h have, at every height y, cross sections that are dilations of their bases with the same k = (h − y)/h, hence equal areas Bk². So their volumes are equal.
    topic_code: "5.13"
  - front: From the cube pyramid to every pyramid → the last step
    back: |
      Cavalieri gives the same volume for every pyramid with base s² and height s; stretching base and height separately scales the volume by those factors, giving ⅓Bh in general.
    topic_code: "5.13"
  - front: Oblique pyramid → volume
    back: |
      ⅓Bh with the perpendicular height from the apex to the base plane; the position of the apex over the base does not matter.
    topic_code: "5.13"
  - front: Slant height of a right square pyramid → definition and formula
    back: |
      The distance from the apex to the midpoint of a base edge: ℓ² = h² + (s/2)².
    topic_code: "5.14"
  - front: Lateral and total surface area of a right square pyramid
    back: |
      Lateral = 4 · ½ · s · ℓ = 2sℓ; total = s² + 2sℓ. For s = 10, h = 12: ℓ = 13, lateral 260, total 360.
    topic_code: "5.14"
  - front: Edge of a square pyramid (apex to base corner) → formula
    back: |
      e² = h² + s²/2, longer than the slant height. For s = 10, h = 12: e ≈ 13.93.
    topic_code: "5.14"
  - front: Slant height and surface area of a right cone
    back: |
      ℓ² = h² + r²; lateral area πrℓ; total πr² + πrℓ. For r = 6, h = 8: ℓ = 10, lateral 60π, total 96π.
    topic_code: "5.14"
  - front: Why the lateral area of a cone is πrℓ
    back: |
      Unrolled, the curved surface is a sector of a circle of radius ℓ whose arc length is the base circumference 2πr; its area is ½ · arc · radius = ½ · 2πr · ℓ.
    topic_code: "5.14"
  - front: Cone with radius 9 and slant height 15 → height and volume
    back: |
      h = √(225 − 81) = 12; V = ⅓ · 81π · 12 = 324π.
    topic_code: "5.14"
  - front: Angle between a face of a square pyramid and its base
    back: |
      tan⁻¹(h/(s/2)). For s = 10, h = 12: tan⁻¹(12/5) ≈ 67.4°.
    topic_code: "5.14"
  - front: Frustum volume → method
    back: |
      Whole pyramid or cone minus the removed top. Cone r = 6, h = 12 cut at height 6: 144π − 18π = 126π; the removed part is k³ = 1/8 of the whole.
    topic_code: "5.14"
  - front: Fraction of a cone's volume removed by cutting the top third of its height
    back: |
      k = 1/3, so (1/3)³ = 1/27 is removed and 26/27 remains.
    topic_code: "5.14"
  - front: Surface-area mistakes for pyramids and prisms
    back: |
      A pyramid has one base, a prism has two. Use the slant height, not the height or the edge, for triangular faces.
    topic_code: "5.14"
  - front: Square pyramid with s = 16 and h = 6 → slant height, lateral area, volume
    back: |
      ℓ = √(36 + 64) = 10; lateral 2 · 16 · 10 = 320; V = ⅓ · 256 · 6 = 512.
    topic_code: "5.14"
  - front: Cavalieri's principle (review from week 19)
    back: |
      Equal cross-section areas at every height give equal volumes; it is the engine behind oblique prisms, oblique pyramids and the universality of ⅓Bh.
    topic_code: "5.10"
  - front: Dilated cross sections (review from week 18)
    back: |
      A cut parallel to a pyramid's base at fraction k of the height from the apex is a dilation of the base by k, with area k²B; this is what the Cavalieri argument compares.
    topic_code: "5.3"
quiz:
  description: |
    25 questions · about 40 minutes · Prism volumes and surface areas, the prism–pyramid relationship, the proofs of ⅓Bh, pyramid, cone and frustum volumes, slant heights and lateral areas, with review of Cavalieri, dilated cross sections, scaling, the Pythagorean theorem and trigonometry. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: geo-u05-w20-q01
      type: multiple_choice
      topic_code: "5.12"
      source: "IM Geometry, Unit 5, Lesson 12"
      points: 1
      stimulus: |
        Figure description: a right square pyramid has a base 18 by 18 and height 12. The apex is directly above the centre of the base.
      prompt: |
        What is the volume of the pyramid?
      options:
        - "1296"
        - "3888"
        - "648"
        - "432"
      option_explanations:
        - |
          Correct. V = ⅓ · 18² · 12 = ⅓ · 324 · 12 = 1296.
        - |
          3888 is the volume of the prism with the same base and height; the pyramid is one third of it.
        - |
          648 halves the prism's volume instead of taking a third.
        - |
          432 is ⅓ · 18 · 12 · 6, which does not use the base area 324.
      answer: 0

    - slug: geo-u05-w20-q02
      type: multiple_choice
      topic_code: "5.14"
      source: "IM Geometry, Unit 5, Lesson 14"
      points: 1
      stimulus: |
        Figure description: a right square pyramid has a base 18 by 18 and height 12. The apex is directly above the centre of the base.
      prompt: |
        What is the slant height (apex to the midpoint of a base edge)?
      options:
        - "15"
        - "√(12² + 18²) ≈ 21.6"
        - "12"
        - "√(12² + (9√2)²) ≈ 17.5"
      option_explanations:
        - |
          Correct. The slant height is the hypotenuse of the right triangle with legs h = 12 and s/2 = 9: √(144 + 81) = 15.
        - |
          Using the full side 18 instead of its half gives the wrong triangle.
        - |
          12 is the height; the slant height is longer because it is tilted.
        - |
          Using half the diagonal (9√2) gives the edge from the apex to a corner, about 17.5, not the slant height.
      answer: 0

    - slug: geo-u05-w20-q03
      type: multiple_choice
      topic_code: "5.14"
      source: "IM Geometry, Unit 5, Lesson 14"
      points: 1
      stimulus: |
        Figure description: a right square pyramid has a base 18 by 18 and height 12. The apex is directly above the centre of the base.
      prompt: |
        What is the total surface area of the pyramid?
      options:
        - "864"
        - "540"
        - "756"
        - "1188"
      option_explanations:
        - |
          Correct. Lateral area = 4 · ½ · 18 · 15 = 540; add the single base 324: total 864.
        - |
          540 is the lateral area alone; the base must be added.
        - |
          756 uses the height 12 instead of the slant height 15 for the triangular faces (432 + 324).
        - |
          1188 adds the base twice (540 + 648); a pyramid has one base.
      answer: 0

    - slug: geo-u05-w20-q04
      type: multiple_choice
      topic_code: "5.11"
      source: "IM Geometry, Unit 5, Lesson 11"
      points: 1
      prompt: |
        A prism has a base that is a right triangle with legs 9 and 12, and its height is 20. What is its volume?
      options:
        - "1080"
        - "2160"
        - "540"
        - "360"
      option_explanations:
        - |
          Correct. Base area ½ · 9 · 12 = 54, and V = 54 × 20 = 1080.
        - |
          2160 uses 9 × 12 = 108 as the base area, forgetting the ½ for a triangle.
        - |
          540 halves the correct volume, as if the prism were a pyramid-like half; prisms use Bh with no fraction.
        - |
          360 is ⅓ · 54 · 20, the volume of a pyramid with this base and height, not the prism.
      answer: 0

    - slug: geo-u05-w20-q05
      type: multiple_choice
      topic_code: "5.11"
      source: "IM Geometry, Unit 5, Lesson 11"
      points: 1
      prompt: |
        A right prism has a base that is a regular pentagon with side 6 and area about 61.9, and its height is 15. What is its lateral area?
      options:
        - "450"
        - "928.5"
        - "90"
        - "573.8"
      option_explanations:
        - |
          Correct. Lateral area = perimeter × height = 30 × 15 = 450.
        - |
          928.5 is the volume (61.9 × 15), not the lateral area.
        - |
          90 is one rectangular face (6 × 15); there are five of them.
        - |
          573.8 adds the two bases (123.8) to the lateral area; that is the total surface area, not the lateral area.
      answer: 0

    - slug: geo-u05-w20-q06
      type: multiple_choice
      topic_code: "5.12"
      source: "IM Geometry, Unit 5, Lesson 12"
      points: 1
      prompt: |
        A cone and a cylinder have the same base radius and the same height. The cylinder holds 750 mL. How much does the cone hold?
      options:
        - "250 mL"
        - "375 mL"
        - "2250 mL"
        - "500 mL"
      option_explanations:
        - |
          Correct. A cone is one third of the cylinder with the same base and height: 750/3 = 250 mL.
        - |
          375 mL is half; the factor is one third.
        - |
          2250 mL triples instead of dividing by three; the cone fits inside the cylinder.
        - |
          500 mL is two thirds, the part of the cylinder outside the cone.
      answer: 0

    - slug: geo-u05-w20-q07
      type: multiple_choice
      topic_code: "5.13"
      source: "IM Geometry, Unit 5, Lesson 13"
      points: 1
      prompt: |
        In the dissection argument for V = ⅓Bh, a cube of edge s is split into three pyramids with a common apex at one vertex V. Why are the three pyramids congruent?
      options:
        - "A 120° rotation of the cube about the diagonal through V carries each pyramid onto the next"
        - "Because any three pieces of a cube are congruent"
        - "Because each pyramid has a square base"
        - "They are not congruent; they merely have equal volumes by Cavalieri"
      option_explanations:
        - |
          Correct. That rotation is a symmetry of the cube fixing V and cycling the three faces opposite V, so it cycles the three pyramids.
        - |
          A cube can be cut into three pieces of very different shapes; the congruence here comes from the cube's symmetry.
        - |
          Square bases alone do not force congruence; the pyramids must also match in height and apex position, which the rotation guarantees.
        - |
          They are congruent (by the rotation), which is stronger than equal volume and needs no Cavalieri.
      answer: 0

    - slug: geo-u05-w20-q08
      type: multiple_choice
      topic_code: "5.13"
      source: "IM Geometry, Unit 5, Lesson 13"
      points: 1
      prompt: |
        Two pyramids have the same base area B and the same height h, but one has a triangular base and the other a square base. Why do they have the same volume?
      options:
        - "At every height their cross sections are dilations of their bases with the same scale factor, so the cross-section areas are equal, and Cavalieri's principle applies"
        - "Because all pyramids have the same volume"
        - "Because a triangle and a square with equal areas are congruent"
        - "They do not; the square pyramid is larger"
      option_explanations:
        - |
          Correct. At height y the scale factor is (h − y)/h for both, so both cross sections have area B((h − y)/h)².
        - |
          Pyramids with different base areas or heights have different volumes; it is the equal B and h that matter.
        - |
          A triangle and a square are never congruent; Cavalieri needs only equal areas, not congruence.
        - |
          Cavalieri's principle shows the volumes are equal, ⅓Bh for both.
      answer: 0

    - slug: geo-u05-w20-q09
      type: multiple_choice
      topic_code: "5.14"
      source: "IM Geometry, Unit 5, Lesson 14"
      points: 1
      prompt: |
        A cone has radius 8 and slant height 17. What is its volume?
      options:
        - "320π"
        - "362.7π"
        - "960π"
        - "128π"
      option_explanations:
        - |
          Correct. h = √(17² − 8²) = √225 = 15, so V = ⅓ · 64π · 15 = 320π ≈ 1005.3.
        - |
          362.7π uses the slant height 17 as the height; the height is 15.
        - |
          960π omits the ⅓: that is the cylinder's volume.
        - |
          128π is ⅓ · 64π · 6, which uses a height of 6; the height from the Pythagorean theorem is √(17² − 8²) = 15, giving 320π.
      answer: 0

    - slug: geo-u05-w20-q10
      type: multiple_choice
      topic_code: "5.14"
      source: "IM Geometry, Unit 5, Lesson 14"
      points: 1
      prompt: |
        What is the lateral (curved) surface area of a cone with radius 5 and height 12?
      options:
        - "65π"
        - "60π"
        - "25π"
        - "130π"
      option_explanations:
        - |
          Correct. Slant height ℓ = √(25 + 144) = 13, and lateral area = πrℓ = 65π.
        - |
          60π uses the height 12 instead of the slant height 13.
        - |
          25π is the base area, not the curved surface.
        - |
          130π doubles the lateral area; the formula is πrℓ, not 2πrℓ.
      answer: 0

    - slug: geo-u05-w20-q11
      type: multiple_choice
      topic_code: "5.14"
      source: "IM Geometry, Unit 5, Lesson 14"
      points: 1
      prompt: |
        A square pyramid has height 20. Its top is cut off by a plane parallel to the base, 5 units below the apex. What fraction of the original volume does the frustum (the remaining bottom part) have?
      options:
        - "63/64"
        - "3/4"
        - "15/16"
        - "1/64"
      option_explanations:
        - |
          Correct. The removed pyramid has k = 5/20 = 1/4, so its volume is (1/4)³ = 1/64 of the original, leaving 63/64.
        - |
          3/4 is the fraction of the height that remains; volume scales by k³, not k.
        - |
          15/16 would follow from k² = 1/16, the area factor, not the volume factor.
        - |
          1/64 is the removed fraction, not the remaining one.
      answer: 0

    - slug: geo-u05-w20-q12
      type: multiple_choice
      topic_code: "5.13"
      source: "IM Geometry, Unit 5, Lesson 13"
      points: 1
      prompt: |
        An oblique pyramid has a base of area 48 and its apex is 10 units above the base plane but not above the base's centre. What is its volume?
      options:
        - "160"
        - "480"
        - "Cannot be found without knowing where the apex is"
        - "Less than 160, because the lean reduces the volume"
      option_explanations:
        - |
          Correct. V = ⅓ · 48 · 10 = 160; by Cavalieri the position of the apex over the base does not affect the volume.
        - |
          480 is Bh, the prism's volume; a pyramid is one third of that.
        - |
          The perpendicular height and the base area determine the volume; the apex position affects only the surface area.
        - |
          Cross sections at every height are dilations of the base with the same scale factor whether or not the pyramid leans, so the volume is unchanged.
      answer: 0

    - slug: geo-u05-w20-q13
      type: multiple_choice
      topic_code: "5.10"
      source: "IM Geometry, Unit 5, Lesson 10"
      points: 1
      prompt: |
        Review. A stack of 200 identical square tiles, each 1 cm thick and 10 cm on a side, is pushed so that the stack leans. What happens to its volume, and why?
      options:
        - "It stays 20,000 cm³, because every horizontal cross section is still a 10 by 10 square (Cavalieri's principle)"
        - "It decreases, because the stack is now shorter when measured along its slanted edge"
        - "It increases, because the slanted edge is longer than 200 cm"
        - "It becomes 20,000 cm³ only if the lean is less than 45°"
      option_explanations:
        - |
          Correct. The tiles are the cross sections; their areas and the perpendicular height (200 cm) are unchanged.
        - |
          The perpendicular height is still 200 cm; the slanted edge is not the height.
        - |
          The slanted edge's length does not enter the volume; the tiles themselves are unchanged.
        - |
          Cavalieri's principle has no angle restriction; the volume is unchanged for any lean.
      answer: 0

    - slug: geo-u05-w20-q14
      type: multiple_choice
      topic_code: "5.6"
      source: "IM Geometry, Unit 5, Lesson 6"
      points: 1
      prompt: |
        Review. A square pyramid of volume 100 is scaled by a factor of 2 in every dimension. What is the new pyramid's volume, and what happens to its slant height?
      options:
        - "Volume 800; slant height doubled"
        - "Volume 400; slant height doubled"
        - "Volume 200; slant height doubled"
        - "Volume 800; slant height multiplied by 8"
      option_explanations:
        - |
          Correct. Volume scales by k³ = 8 and every length, including the slant height, by k = 2.
        - |
          400 is the k² factor, which applies to areas such as the lateral area, not the volume.
        - |
          Doubling every dimension multiplies the volume by 8, not 2.
        - |
          The slant height is a length and scales by k = 2, not by k³.
      answer: 0

    - slug: geo-u05-w20-q15
      type: multi_select
      topic_code: "5.14"
      source: "IM Geometry, Unit 5, Lesson 14"
      points: 2
      partial_credit: true
      prompt: |
        A right square pyramid has base side 12 and height 8. Which statements are true? Select all that apply.
      options:
        - "Its slant height is 10"
        - "Its volume is 384"
        - "Its lateral area is 240"
        - "The edge from the apex to a base corner is 10"
        - "Its total surface area is 384"
      option_explanations:
        - |
          True: the slant height is √(h² + (s/2)²) = √(64 + 36) = 10.
        - |
          True: V = ⅓ · base area · height = ⅓ · 144 · 8 = 384.
        - |
          True: lateral area = 4 · ½ · 12 · 10 = 240.
        - |
          False: the edge is √(8² + (6√2)²) = √(64 + 72) ≈ 11.7, longer than the slant height.
        - |
          True: 240 + 144 = 384 (a numerical coincidence with the volume; the units differ).
      answer: [0, 1, 2, 4]

    - slug: geo-u05-w20-q16
      type: multi_select
      topic_code: "5.3"
      source: "IM Geometry, Unit 5, Lesson 3"
      points: 2
      partial_credit: true
      prompt: |
        Review. A pyramid has base area B and height h. At height y above the base, which statements about the horizontal cross section are true? Select all that apply.
      options:
        - "It is similar to the base"
        - "Its scale factor relative to the base is (h − y)/h"
        - "Its area is B · ((h − y)/h)²"
        - "Its area is B · (h − y)/h"
        - "It is congruent to the base for every y"
      option_explanations:
        - |
          True: it is a dilation of the base from the apex.
        - |
          True: the distance from the apex is h − y out of the full height h.
        - |
          True: area scales by the square of the scale factor.
        - |
          False: that would be scaling area by k instead of k².
        - |
          False: only the base itself (y = 0) is congruent to the base; higher sections are smaller.
      answer: [0, 1, 2]

    - slug: geo-u05-w20-q17
      type: true_false
      topic_code: "5.12"
      source: "IM Geometry, Unit 5, Lesson 12"
      points: 1
      prompt: |
        True or false: a triangular pyramid and a triangular prism with the same base and height have volumes in the ratio 1 : 3.
      answer: true
      explanation: |
        True. For any base shape, the pyramid's volume is ⅓Bh and the prism's is Bh.

    - slug: geo-u05-w20-q18
      type: true_false
      topic_code: "3.14"
      source: "IM Geometry, Unit 3, Lesson 14"
      points: 1
      prompt: |
        Review. True or false: for a right square pyramid, the slant height, half the base side and the height form a right triangle, so ℓ² = h² + (s/2)².
      answer: true
      explanation: |
        True. The height meets the base at its centre, which is s/2 from the midpoint of an edge; the slant height is the hypotenuse of that right triangle by the Pythagorean theorem.

    - slug: geo-u05-w20-q19
      type: fill_blank
      topic_code: "5.12"
      source: "IM Geometry, Unit 5, Lesson 12"
      points: 1
      prompt: |
        The volume of a pyramid or cone is ____ of the volume of the prism or cylinder with the same base and height.
      answer: ["one third", "1/3", "a third", "one-third"]
      explanation: |
        V = ⅓Bh, proved by the three-pyramid dissection of a cube and extended to all pyramids by Cavalieri's principle.

    - slug: geo-u05-w20-q20
      type: fill_blank
      topic_code: "5.9"
      source: "IM Geometry, Unit 5, Lesson 9"
      points: 1
      prompt: |
        Review. The volume of any prism or cylinder is its base area multiplied by its perpendicular ____.
      answer: ["height"]
      explanation: |
        V = Bh, with the height measured perpendicular to the bases even when the solid is oblique.

    - slug: geo-u05-w20-q21
      type: numeric
      topic_code: "5.11"
      source: "general knowledge"
      points: 1
      prompt: |
        A trough is a prism whose base is a trapezoid with parallel sides 40 cm and 60 cm and height 25 cm; the trough is 2 m long. How many litres does it hold? Give an integer. (1 L = 1000 cm³)
      answer: { value: 250, tolerance: 0 }
      explanation: |
        Base area ½(40 + 60)(25) = 1250 cm²; length 200 cm; V = 250,000 cm³ = 250 L.

    - slug: geo-u05-w20-q22
      type: short_answer
      topic_code: "5.6"
      source: "IM Geometry, Unit 5, Lesson 6"
      points: 3
      prompt: |
        Review. A cone has radius 6 and height 12. Its top is cut off by a plane parallel to the base, 4 units below the apex. Using the scaling rules rather than computing the small cone's dimensions directly, find what fraction of the cone's volume is removed, and then find the volume of the remaining frustum (use π ≈ 3.1416, one decimal place).
      answer: |
        The removed cone is a dilation of the whole cone from the apex with k = 4/12 = 1/3, so its volume is k³ = 1/27 of the whole. The whole cone's volume is ⅓ · π · 36 · 12 = 144π ≈ 452.4. The frustum keeps 26/27 of it: 144π × 26/27 = 416π/3 ≈ 435.6. (Check: the small cone has radius 2 and height 4, volume ⅓ · 4π · 4 = 16π/3 = 144π/27.)
      explanation: |
        1 point for k = 1/3 and the removed fraction k³ = 1/27. 1 point for the whole volume 144π ≈ 452.4. 1 point for the frustum 416π/3 ≈ 435.6 (26/27 of the whole).
