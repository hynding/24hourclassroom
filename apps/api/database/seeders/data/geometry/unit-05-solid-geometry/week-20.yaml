    - slug: geo-u05-w20-q24
      type: short_answer
      topic_code: "5.13"
      source: "IM Geometry, Unit 5, Lesson 13"
      points: 3
      prompt: |
        Explain the argument that cuts a cube of edge s into three congruent pyramids, and show how it gives the volume of a square pyramid with base s by s and height s. Then say what extra step is needed to conclude V = ⅓Bh for a pyramid whose base is not a square.
      answer: |
        Choose a vertex V of the cube. Each of the three faces not containing V is the base of a pyramid with apex V; the three pyramids fill the cube with no overlap, and a 120° rotation about the long diagonal through V carries each onto the next, so they are congruent. Each therefore has volume s³/3, and since its base is s² and its height is s, that equals ⅓ · s² · s = ⅓Bh. For a non-square base, Cavalieri's principle is needed: a pyramid with base area B and height h has cross sections that are dilations of its base with the same scale factor at each height as any other pyramid with the same B and h, so the volumes agree; comparing with a square pyramid of the same base area and height (and stretching to adjust B and h if needed) gives ⅓Bh in general.
      explanation: |
        1 point for the three pyramids with a common apex and the rotation showing congruence. 1 point for s³/3 = ⅓ · s² · s. 1 point for naming Cavalieri's principle (equal cross sections at every height) as the step to other bases.

    - slug: geo-u05-w20-q25
      type: long_answer
      topic_code: "5.14"
      source: "IM Geometry, Unit 5, Lesson 14"
      points: 6
      prompt: |
        A tent is a right square pyramid with base 6 m by 6 m and height 4 m. The floor is a separate groundsheet; the four triangular faces are canvas.

        (a) Find the slant height and the total area of canvas.
        (b) Find the volume of air inside the tent.
        (c) The maker also sells a tent that is a scaled copy with 1.5 times the dimensions. Find its canvas area and volume using the scaling rules, and check the volume directly.
        (d) The pole from the apex to a base corner is used as a guy line. Find its length, and explain why it differs from the slant height.
      answer: |
        (a) Slant height ℓ = √(4² + 3²) = 5 m. Canvas = 4 · ½ · 6 · 5 = 60 m².
        (b) V = ⅓ · 36 · 4 = 48 m³.
        (c) Lengths × 1.5, areas × 2.25, volumes × 3.375. Canvas 60 × 2.25 = 135 m²; volume 48 × 3.375 = 162 m³. Direct check: base 9 by 9, height 6, V = ⅓ · 81 · 6 = 162 m³ (and ℓ = √(36 + 20.25) = 7.5, canvas 4 · ½ · 9 · 7.5 = 135 m²).
        (d) The corner is half a diagonal from the centre: 3√2 ≈ 4.24 m. The edge is √(4² + (3√2)²) = √(16 + 18) = √34 ≈ 5.83 m. It is longer than the slant height because the corner is farther from the centre of the base (4.24 m) than the midpoint of a side is (3 m); the slant height goes to the midpoint of an edge.
      explanation: |
        Scoring (6 points). (a) 1 point for ℓ = 5 m; 1 point for canvas 60 m² (lateral area only, no floor). (b) 1 point for 48 m³. (c) 1 point for 135 m² and 162 m³ via k² and k³, with a direct check of the volume. (d) 1 point for the edge √34 ≈ 5.83 m; 1 point for the explanation (corner at 3√2 from the centre versus 3 for the edge midpoint).
