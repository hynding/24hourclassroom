      source: "IM Geometry, Unit 5, Lesson 18"
      points: 3
      prompt: |
        A cylindrical tank of radius 2 m is being filled with water at a constant 0.5 m³ per minute. Write the volume V of water as a function of the depth d, describe the graph of V against d, and find how long it takes for the depth to reach 3 m. Then explain how the graph would differ for a tank shaped like an inverted cone.
      answer: |
        V = π · 2² · d = 4πd ≈ 12.57d m³, a straight line through the origin with slope 4π. At d = 3 m, V = 12π ≈ 37.7 m³, which takes 37.7/0.5 ≈ 75.4 minutes. For an inverted cone (apex down), the water forms a cone similar to the tank, so V is proportional to d³: the graph is a cubic curve, flat near the origin and steep later, meaning the depth rises quickly at first and slowly as the tank widens.
      explanation: |
        1 point for V = 4πd and the linear graph. 1 point for 12π ≈ 37.7 m³ and about 75 minutes. 1 point for the cubic relationship in the conical tank with a correct description of its graph.

    - slug: geo-u05-w21-q25
      type: long_answer
      topic_code: "5.16"
      source: "IM Geometry, Unit 5, Lesson 16"
      points: 6
      prompt: |
        A company sells 1 litre (1000 cm³) of juice in a cylindrical can and wants to use as little aluminium as possible.

        (a) For a can of radius 4 cm, find the height and the total surface area (two ends and the side), to one decimal place.
        (b) Repeat for radius 5.4 cm.
        (c) Which of the two cans uses less aluminium? The least-material can has height equal to its diameter; check which of your two cans is closer to that shape.
        (d) The company instead considers a cube-shaped carton of the same volume. Find its edge and surface area, and explain in terms of surface-to-volume reasoning why a sphere would beat both, and why spheres are nevertheless not used.
      answer: |
        (a) h = 1000/(16π) ≈ 19.9 cm. A = 2π · 16 + 2π · 4 · 19.9 ≈ 100.5 + 500.0 ≈ 600.5 cm².
        (b) h = 1000/(29.16π) ≈ 10.9 cm. A = 2π · 29.16 + 2π · 5.4 · 10.9 ≈ 183.2 + 369.9 ≈ 553.1 cm².
        (c) The radius-5.4 can uses less (553 versus 600 cm²). Its height 10.9 is close to its diameter 10.8, so it is almost the least-material shape; the radius-4 can is tall and thin (height 19.9 versus diameter 8).
        (d) A cube with volume 1000 cm³ has edge 10 cm and surface area 600 cm², about the same as the tall can and more than the squat can. For a fixed volume, the surface area is smallest when the shape is most "rounded": a sphere of volume 1000 has r = ∛(750/π) ≈ 6.2 cm and surface area 4π · 38.5 ≈ 483.6 cm², less than either can or the cube. Spheres are not used because they do not stand, stack or pour well, and are hard to manufacture and label; the squat cylinder is a practical compromise.
      explanation: |
        Scoring (6 points). (a) 1 point for h ≈ 19.9 and A ≈ 600 cm². (b) 1 point for h ≈ 10.9 and A ≈ 553 cm². (c) 1 point for choosing the 5.4 cm can and noting h ≈ 2r. (d) 1 point for the cube (edge 10, area 600); 1 point for the sphere's smaller area (≈ 484 cm²) with the surface-to-volume reasoning; 1 point for a sensible practical reason spheres are not used.
