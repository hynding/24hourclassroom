week: 21
unit: 5
title: "All the Solids, Density and Graphs"
topics: ["5.15", "5.16", "5.17", "5.18"]
guide: guides/week-21.md
guide_description: |
  The complete table of volume and surface-area formulas including spheres, composite solids and solids with holes, surface area against volume and why the cube and sphere are efficient, density as mass per volume with worked problems, and how volume depends on one changing dimension (linear, quadratic, cubic). Worked examples, Try-it problems and a self-check.
flashcards_description: |
  28 cards on sphere and hemisphere formulas, composite solids, surface-to-volume reasoning, density calculations and volume graphs. Review them before the week 21 quiz.
flashcards:
  - front: Volume and surface area of a sphere
    back: |
      V = 4/3 πr³ and A = 4πr². For r = 3 both equal 36π (numerically; the units differ).
    topic_code: "5.15"
  - front: Hemisphere → volume and surface area
    back: |
      V = 2/3 πr³. Curved surface 2πr², plus the flat circular face πr² if it is a solid hemisphere: total 3πr².
    topic_code: "5.15"
  - front: Where 2/3 πr³ for a hemisphere comes from
    back: |
      By Cavalieri, a hemisphere of radius r matches a cylinder of radius r and height r with a cone removed: at height y both cross sections have area π(r² − y²). So V = πr³ − ⅓πr³.
    topic_code: "5.15"
  - front: Silo made of a cylinder (r = 4, h = 12) and a hemisphere (r = 4) → volume
    back: |
      192π + 2/3 · 64π ≈ 192π + 42.67π ≈ 737.2.
    topic_code: "5.15"
  - front: Ice-cream cone (cone r = 3, h = 10, plus hemisphere r = 3) → volume
    back: |
      30π + 18π = 48π ≈ 150.8.
    topic_code: "5.15"
  - front: Cube of edge 10 with a cylindrical hole of radius 2 through it → volume
    back: |
      1000 − π · 4 · 10 ≈ 1000 − 125.7 = 874.3.
    topic_code: "5.15"
  - front: Capsule (cylinder r = 1, length 6, hemispherical ends) → volume and surface area
    back: |
      V = 6π + 4/3 π ≈ 23.0; A = 12π + 4π = 16π ≈ 50.3 (the two ends make one full sphere's surface).
    topic_code: "5.15"
  - front: Sphere with volume 288π → radius
    back: |
      4/3 πr³ = 288π gives r³ = 216, r = 6.
    topic_code: "5.15"
  - front: Composite surface area → what not to count
    back: |
      Faces that are glued together (the cylinder top under a hemisphere) are not on the surface; a hole adds its inner walls and removes its openings.
    topic_code: "5.15"
  - front: Boxes of volume 1000 → which has the least surface area
    back: |
      The cube 10 × 10 × 10 (A = 600). A 20 × 5 × 10 box has A = 700. Among all solids the sphere has the least surface for its volume.
    topic_code: "5.16"
  - front: Why surface area versus volume matters
    back: |
      Packaging cost, heat loss, evaporation and paint go with surface area; contents, mass and heat produced go with volume.
    topic_code: "5.16"
  - front: Can holding 500 cm³ → shape using the least metal
    back: |
      Height about equal to the diameter (h ≈ 2r). For r = 3 the area is about 390 cm²; for r ≈ 4.3 about 349 cm².
    topic_code: "5.16"
  - front: Surface-to-volume ratio of a cube with edge 5 versus edge 10
    back: |
      150/125 = 1.2 versus 600/1000 = 0.6. Doubling the size halves the ratio (the 1/k rule).
    topic_code: "5.16"
  - front: Sphere of radius 3 versus cube of edge 5 → which has more surface per volume
    back: |
      Sphere: 36π/36π = 1.0. Cube: 150/125 = 1.2. The cube has more surface for its volume.
    topic_code: "5.16"
  - front: Density → definition and units
    back: |
      ρ = mass/volume. Use g with cm³ or kg with m³; 1 g/cm³ = 1000 kg/m³. Water is 1 g/cm³.
    topic_code: "5.17"
  - front: Mass of a steel rod (7.85 g/cm³), radius 1 cm, length 10 cm
    back: |
      V = 10π ≈ 31.4 cm³; mass ≈ 31.4 × 7.85 ≈ 246.6 g.
    topic_code: "5.17"
  - front: Mass of a gold bar 20 × 8 × 4 cm at 19.3 g/cm³
    back: |
      V = 640 cm³; mass = 12,352 g ≈ 12.4 kg.
    topic_code: "5.17"
  - front: Ball of radius 4.5 cm with mass 343 g → density and floating
    back: |
      V ≈ 381.7 cm³; density ≈ 0.90 g/cm³, less than water, so it floats.
    topic_code: "5.17"
  - front: Edge of an aluminium cube (2.7 g/cm³) with mass 729 g
    back: |
      V = 729/2.7 = 270 cm³; edge = ∛270 ≈ 6.46 cm.
    topic_code: "5.17"
  - front: Population density → definition and example
    back: |
      People per unit area. 2,400,000 people on 600 km² is 4000 per km²; 35,000 on 50 km² is 700 per km².
    topic_code: "5.17"
  - front: Floating or sinking → the density test
    back: |
      An object floats in water when its density is below 1 g/cm³ (pine ≈ 0.5), sinks when above (steel 7.85).
    topic_code: "5.17"
  - front: Cylinder with fixed radius, height varies → graph of V
    back: |
      V = (πr²)h: a straight line through the origin with slope πr². Doubling h doubles V.
    topic_code: "5.18"
  - front: Cylinder with fixed height, radius varies → graph of V
    back: |
      V = (πh)r²: a parabola through the origin. Doubling r multiplies V by 4.
    topic_code: "5.18"
  - front: Cube edge or sphere radius varies → graph of V
    back: |
      V = s³ or 4/3 πr³: a cubic curve, flat near 0 and then steep. Doubling the dimension multiplies V by 8.
    topic_code: "5.18"
  - front: Telling the graph type from a table
    back: |
      Dimension doubles and V doubles: linear. V quadruples: quadratic. V is multiplied by 8: cubic.
    topic_code: "5.18"
  - front: Tank of radius 1.5 m filling → V against depth d
    back: |
      V = 2.25π d ≈ 7.07 d m³ per metre of depth; at d = 2 m, V ≈ 14.1 m³. Linear.
    topic_code: "5.18"
  - front: Cone-shaped funnel (apex down) filling → V against depth
    back: |
      The water is a cone similar to the funnel, so V ∝ d³: cubic, which is why the level rises fast at first and slowly later.
    topic_code: "5.18"
  - front: k³ rule for volume (review from week 19)
    back: |
      Scaling every length by k multiplies volume by k³; this is the cubic graph of V against a scale factor.
    topic_code: "5.6"
quiz:
  description: |
    25 questions · about 40 minutes · Sphere and composite volumes, surface areas, surface-to-volume reasoning, density and graphs of volume, with review of scaling rules, cylinders, pyramids, Cavalieri's principle and the Pythagorean theorem. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: geo-u05-w21-q01
      type: multiple_choice
      topic_code: "5.15"
      source: "IM Geometry, Unit 5, Lesson 15"
      points: 1
      stimulus: |
        Figure description: a grain silo is a right cylinder of radius 3 m and height 8 m with a hemisphere of radius 3 m on top. Grain has a density of about 0.75 g/cm³, which is 750 kg/m³.
      prompt: |
        What is the total volume of the silo?
      options:
        - "90π ≈ 282.7 m³"
        - "108π ≈ 339.3 m³"
        - "72π ≈ 226.2 m³"
        - "81π ≈ 254.5 m³"
      option_explanations:
        - |
          Correct. Cylinder π · 9 · 8 = 72π plus hemisphere 2/3 · π · 27 = 18π gives 90π.
        - |
          108π adds a full sphere (36π) instead of a hemisphere (18π).
        - |
          72π is the cylinder alone, omitting the hemispherical top.
        - |
          81π adds 9π, the area of the circular top, not the hemisphere's volume.
      answer: 0

    - slug: geo-u05-w21-q02
      type: multiple_choice
      topic_code: "5.17"
      source: "IM Geometry, Unit 5, Lesson 17"
      points: 1
      stimulus: |
        Figure description: a grain silo is a right cylinder of radius 3 m and height 8 m with a hemisphere of radius 3 m on top. Grain has a density of about 0.75 g/cm³, which is 750 kg/m³.
      prompt: |
        About how much does the grain weigh when the silo is full?
      options:
        - "About 212,000 kg"
        - "About 212 kg"
        - "About 377,000 kg"
        - "About 2,120 kg"
      option_explanations:
        - |
          Correct. mass = density × volume = 750 kg/m³ × 282.7 m³ ≈ 212,000 kg (about 212 tonnes).
        - |
          212 kg uses 0.75 as if it were kg/m³; 0.75 g/cm³ is 750 kg/m³.
        - |
          377,000 divides the volume by the density instead of multiplying.
        - |
          2,120 drops a factor of 100 in the unit conversion; 1 g/cm³ = 1000 kg/m³.
      answer: 0

    - slug: geo-u05-w21-q03
      type: multiple_choice
      topic_code: "5.16"
      source: "IM Geometry, Unit 5, Lesson 16"
      points: 1
      stimulus: |
        Figure description: a grain silo is a right cylinder of radius 3 m and height 8 m with a hemisphere of radius 3 m on top. Grain has a density of about 0.75 g/cm³, which is 750 kg/m³.
      prompt: |
        The outside of the silo (curved wall and dome, not the floor) is to be painted. What area is painted?
      options:
        - "66π ≈ 207.3 m²"
        - "75π ≈ 235.6 m²"
        - "84π ≈ 263.9 m²"
        - "48π ≈ 150.8 m²"
      option_explanations:
        - |
          Correct. Curved wall 2π · 3 · 8 = 48π plus dome 2π · 9 = 18π gives 66π; the circle where they meet is not a surface.
        - |
          75π adds the floor (9π), which is not painted.
        - |
          84π adds a full sphere's surface (36π) instead of a hemisphere's (18π).
        - |
          48π is the wall alone, forgetting the dome.
      answer: 0

    - slug: geo-u05-w21-q04
      type: multiple_choice
      topic_code: "5.15"
      source: "IM Geometry, Unit 5, Lesson 15"
      points: 1
      prompt: |
        A sphere has surface area 100π. What is its volume?
      options:
        - "500π/3 ≈ 523.6"
        - "1000π/3 ≈ 1047.2"
        - "100π/3 ≈ 104.7"
        - "125π ≈ 392.7"
      option_explanations:
        - |
          Correct. 4πr² = 100π gives r = 5, and V = 4/3 π · 125 = 500π/3.
        - |
          1000π/3 uses r = 10 (the diameter) in the volume formula.
        - |
          100π/3 uses r² = 25 instead of r³ = 125.
        - |
          125π omits the 4/3 in the sphere formula.
      answer: 0

    - slug: geo-u05-w21-q05
      type: multiple_choice
      topic_code: "5.15"
      source: "IM Geometry, Unit 5, Lesson 15"
      points: 1
      prompt: |
        A rectangular block 12 by 8 by 5 has a cylindrical hole of radius 1 drilled straight through the 5-unit dimension. What is the remaining volume?
      options:
        - "480 − 5π ≈ 464.3"
        - "480 − 10π ≈ 448.6"
        - "480 − 25π ≈ 401.5"
        - "480 − π ≈ 476.9"
      option_explanations:
        - |
          Correct. The hole is a cylinder of radius 1 and length 5: π · 1 · 5 = 5π.
        - |
          10π would need a base area of 2π, but the hole's base area is π · 1² = π, so the hole removes only 5π.
        - |
          25π squares the length 5 instead of the radius 1.
        - |
          π is the base area of the hole; multiply by its length 5.
      answer: 0

    - slug: geo-u05-w21-q06
      type: multiple_choice
      topic_code: "5.16"
      source: "IM Geometry, Unit 5, Lesson 16"
      points: 1
      prompt: |
        Three boxes each have volume 1728 cm³: a 12 × 12 × 12 cube, a 24 × 12 × 6 box and a 48 × 6 × 6 box. Which uses the least cardboard, and why?
      options:
        - "The cube (864 cm²), because for a fixed volume the surface area is smallest when the dimensions are equal"
        - "The 48 × 6 × 6 box, because it is the longest"
        - "The 24 × 12 × 6 box, because it is in the middle"
        - "All three use the same cardboard because the volumes are equal"
      option_explanations:
        - |
          Correct. Surface areas: cube 864; 24 × 12 × 6 gives 2(288 + 144 + 72) = 1008; 48 × 6 × 6 gives 2(288 + 288 + 36) = 1224.
        - |
          Stretching a box increases its surface area; the long box uses the most (1224).
        - |
          Its surface area (1008) is between the other two, not the least.
        - |
          Equal volumes do not imply equal surface areas; shape matters.
      answer: 0

    - slug: geo-u05-w21-q07
      type: multiple_choice
      topic_code: "5.16"
      source: "IM Geometry, Unit 5, Lesson 16"
      points: 1
      prompt: |
        Why does a large block of ice last much longer in the sun than the same mass of ice in small cubes?
      options:
        - "The small cubes have far more total surface area for the same volume, and melting happens at the surface"
        - "Small cubes are made of a different kind of ice"
        - "The large block has more volume"
        - "Surface area is irrelevant; only mass matters"
      option_explanations:
        - |
          Correct. Cutting a block into cubes multiplies the surface area while the volume is unchanged, so heat reaches the ice faster.
        - |
          The material is the same; the geometry differs.
        - |
          The total volume (and mass) is the same in both cases.
        - |
          Heat enters through the surface, so surface area controls the melting rate.
      answer: 0

    - slug: geo-u05-w21-q08
      type: multiple_choice
      topic_code: "5.17"
      source: "IM Geometry, Unit 5, Lesson 17"
      points: 1
      prompt: |
        A solid metal cylinder has radius 2 cm, height 10 cm and mass 1131 g. What is its density, and could it be aluminium (2.7 g/cm³), steel (7.85 g/cm³) or lead (11.3 g/cm³)?
      options:
        - "About 9.0 g/cm³; none of the three, though closest to steel"
        - "About 2.7 g/cm³; aluminium"
        - "About 11.3 g/cm³; lead"
        - "About 18.0 g/cm³; none of the three"
      option_explanations:
        - |
          Correct. V = π · 4 · 10 = 40π ≈ 125.7 cm³, so density ≈ 1131/125.7 ≈ 9.0 g/cm³, between steel and lead (brass is about 8.5–9.0).
        - |
          2.7 g/cm³ would give a mass of only about 339 g for this volume.
        - |
          Lead at 11.3 g/cm³ would give a mass of about 1420 g.
        - |
          18.0 g/cm³ comes from dividing by half the volume (62.8 cm³, as if the height were 5); the full volume is 40π ≈ 125.7 cm³.
      answer: 0

    - slug: geo-u05-w21-q09
      type: multiple_choice
      topic_code: "5.17"
      source: "IM Geometry, Unit 5, Lesson 17"
      points: 1
      prompt: |
        A city of 1,800,000 people covers 450 km². A town of 60,000 people covers 12 km². Which is more densely populated?
      options:
        - "The town: 5000 per km² versus 4000 per km²"
        - "The city, because it has more people"
        - "The city: 4000 per km² versus 5000 per km²"
        - "They are equal"
      option_explanations:
        - |
          Correct. 60,000/12 = 5000 per km² exceeds 1,800,000/450 = 4000 per km².
        - |
          Density compares people per unit area, not total population.
        - |
          The numbers are right but the comparison is reversed: 5000 is the larger density and belongs to the town.
        - |
          4000 and 5000 per km² are not equal; the town is more crowded by 1000 people per km².
      answer: 0

    - slug: geo-u05-w21-q10
      type: multiple_choice
      topic_code: "5.18"
      source: "IM Geometry, Unit 5, Lesson 18"
      points: 1
      prompt: |
        A cylinder has a fixed height of 10. Which describes the graph of its volume V against its radius r?
      options:
        - "A parabola through the origin, V = 10πr²; doubling r multiplies V by 4"
        - "A straight line through the origin; doubling r doubles V"
        - "A cubic curve; doubling r multiplies V by 8"
        - "A horizontal line, because the height is fixed"
      option_explanations:
        - |
          Correct. With h fixed, V = πr²h is a constant times r², a quadratic.
        - |
          A line would mean V ∝ r, but r is squared in the formula.
        - |
          A cubic arises when all three dimensions scale together (or for a sphere's radius); here only r changes.
        - |
          The volume certainly changes with the radius.
      answer: 0

    - slug: geo-u05-w21-q11
      type: multiple_choice
      topic_code: "5.18"
      source: "IM Geometry, Unit 5, Lesson 18"
      points: 1
      prompt: |
        A table shows a solid's volume for several values of one dimension d: d = 1 gives V = 6, d = 2 gives V = 48, d = 3 gives V = 162. Which relationship fits?
      options:
        - "Cubic: V = 6d³"
        - "Linear: V = 6d"
        - "Quadratic: V = 6d²"
        - "Exponential: V = 6 · 8^(d − 1)"
      option_explanations:
        - |
          Correct. 6 · 8 = 48 and 6 · 27 = 162, so V = 6d³: the dimension scales the whole solid.
        - |
          Linear would give 12 and 18 at d = 2 and 3.
        - |
          Quadratic would give 6 · 4 = 24 and 6 · 9 = 54 at d = 2 and 3, not 48 and 162.
        - |
          6 · 8² = 384 at d = 3, not 162; the pattern is a power of d, not of 8.
      answer: 0

    - slug: geo-u05-w21-q12
      type: multiple_choice
      topic_code: "5.18"
      source: "IM Geometry, Unit 5, Lesson 18"
      points: 1
      prompt: |
        Water is poured at a steady rate into a cone-shaped glass (apex at the bottom). Which statement about the water level is correct?
      options:
        - "It rises quickly at first and more slowly later, because the water's volume grows like the cube of its depth"
        - "It rises at a steady rate, because the pour rate is steady"
        - "It rises slowly at first and quickly later, because the glass narrows at the top"
        - "It rises quickly at first because the glass is empty"
      option_explanations:
        - |
          Correct. The water forms a cone similar to the glass, so V ∝ d³; near the bottom a little volume gives a lot of depth.
        - |
          A steady volume rate gives a steady level only in a cylinder, where V is linear in depth.
        - |
          The glass widens toward the top, so each extra centimetre of depth needs more water later.
        - |
          Emptiness is not the reason; the narrow bottom is, through the cubic relationship.
      answer: 0

    - slug: geo-u05-w21-q13
      type: multiple_choice
      topic_code: "5.9"
      source: "IM Geometry, Unit 5, Lesson 9"
      points: 1
      prompt: |
        Review. A cylindrical can has radius 4 cm and holds 1 litre. What is its height, to one decimal place?
      options:
        - "19.9 cm"
        - "79.6 cm"
        - "39.8 cm"
        - "6.2 cm"
      option_explanations:
        - |
          Correct. 1 L = 1000 cm³, so h = 1000/(16π) ≈ 19.9 cm.
        - |
          79.6 uses π · 4 instead of π · 16 as the base area.
        - |
          39.8 uses a base area of 8π, which is not πr² for r = 4.
        - |
          6.2 uses the diameter 8 squared (64π) as the base area.
      answer: 0

    - slug: geo-u05-w21-q14
      type: multiple_choice
      topic_code: "5.12"
      source: "IM Geometry, Unit 5, Lesson 12"
      points: 1
      prompt: |
        Review. A cone and a hemisphere have the same radius 6, and the cone's height is also 6. Which has the greater volume?
      options:
        - "The hemisphere: 144π versus the cone's 72π"
        - "The cone: 72π versus the hemisphere's 36π"
        - "They are equal"
        - "The cone: 216π versus the hemisphere's 144π"
      option_explanations:
        - |
          Correct. Hemisphere 2/3 π · 216 = 144π; cone ⅓ · 36π · 6 = 72π. The hemisphere is exactly twice the cone (this is the cylinder = cone + hemisphere relation).
        - |
          36π is not the hemisphere's volume; 2/3 π r³ with r = 6 is 144π.
        - |
          The cylinder of radius 6 and height 6 (216π) equals cone plus hemisphere, so they cannot be equal: the hemisphere is twice the cone.
        - |
          216π is the cylinder's volume, not the cone's.
      answer: 0

    - slug: geo-u05-w21-q15
      type: multi_select
      topic_code: "5.15"
      source: "IM Geometry, Unit 5, Lesson 15"
      points: 2
      partial_credit: true
      prompt: |
        A capsule is a cylinder of radius 2 and length 10 with a hemisphere of radius 2 on each end. Which statements are true? Select all that apply.
      options:
        - "Its volume is 40π + 32π/3"
        - "Its surface area is 40π + 16π"
        - "The two hemispheres together have the volume of one sphere of radius 2"
        - "Its surface area includes two circles of area 4π where the hemispheres meet the cylinder"
        - "Its volume is 40π + 16π/3"
      option_explanations:
        - |
          True: cylinder π · 4 · 10 = 40π plus a full sphere 4/3 π · 8 = 32π/3.
        - |
          True: curved cylinder 2π · 2 · 10 = 40π plus a full sphere's surface 4π · 4 = 16π.
        - |
          True: two hemispheres of the same radius make one sphere.
        - |
          False: those circles are interior (glued) faces and are not part of the surface.
        - |
          False: 16π/3 is only one hemisphere; both ends together give 32π/3.
      answer: [0, 1, 2]

    - slug: geo-u05-w21-q16
      type: multi_select
      topic_code: "5.6"
      source: "IM Geometry, Unit 5, Lesson 6"
      points: 2
      partial_credit: true
      prompt: |
        Review. A sphere's radius is multiplied by 3. Which statements are true? Select all that apply.
      options:
        - "Its volume is multiplied by 27"
        - "Its surface area is multiplied by 9"
        - "Its mass (same material) is multiplied by 27"
        - "Its surface-to-volume ratio is multiplied by 3"
        - "Its volume is multiplied by 9"
      option_explanations:
        - |
          True: volume is three-dimensional and scales by k³ = 3³ = 27.
        - |
          True: surface area is two-dimensional and scales by k² = 3² = 9.
        - |
          True: mass is density times volume, so it scales with the volume.
        - |
          False: the ratio scales by k²/k³ = 1/3; it is divided by 3.
        - |
          False: 9 is the area factor; the volume factor is 27.
      answer: [0, 1, 2]

    - slug: geo-u05-w21-q17
      type: true_false
      topic_code: "5.14"
      source: "IM Geometry, Unit 5, Lesson 14"
      points: 1
      prompt: |
        Review. True or false: the curved surface area of a cone is πrℓ, where the slant height ℓ equals √(r² + h²).
      answer: true
      explanation: |
        True. Unrolled, the curved surface is a sector of radius ℓ with arc length 2πr, so its area is ½ · 2πr · ℓ = πrℓ, and ℓ is the hypotenuse of the right triangle with legs r and h.
    - slug: geo-u05-w21-q18
      type: true_false
      topic_code: "5.10"
      source: "IM Geometry, Unit 5, Lesson 10"
      points: 1
      prompt: |
        Review. True or false: Cavalieri's principle shows that a hemisphere of radius r has the same volume as a cylinder of radius r and height r with a cone of radius r and height r removed, because at every height both cross sections have area π(r² − y²).
      answer: true
      explanation: |
        True. The hemisphere's slice at height y is a circle of radius √(r² − y²); the cylinder-minus-cone slice is a ring with outer radius r and inner radius y, area πr² − πy². Equal areas at every height give equal volumes: πr³ − ⅓πr³ = 2/3 πr³.

    - slug: geo-u05-w21-q19
      type: fill_blank
      topic_code: "5.15"
      source: "IM Geometry, Unit 5, Lesson 15"
      points: 1
      prompt: |
        The surface area of a sphere of radius r is ____ πr².
      answer: ["4", "four"]
      explanation: |
        A = 4πr², four times the area of a great circle; the volume is 4/3 πr³.

    - slug: geo-u05-w21-q20
      type: fill_blank
      topic_code: "5.17"
      source: "IM Geometry, Unit 5, Lesson 17"
      points: 1
      prompt: |
        Density is mass divided by ____.
      answer: ["volume"]
      explanation: |
        ρ = m/V; rearranged, m = ρV and V = m/ρ. Keep the units consistent (g with cm³, kg with m³).

    - slug: geo-u05-w21-q21
      type: numeric
      topic_code: "5.15"
      source: "general knowledge"
      points: 1
      prompt: |
        An ice-cream cone is a cone of radius 3 cm and height 12 cm filled level with ice cream, with a hemispherical scoop of radius 3 cm on top. What is the total volume of ice cream, in cm³? Give your answer to one decimal place (use π ≈ 3.1416).
      answer: { value: 169.6, tolerance: 0.3 }
      explanation: |
