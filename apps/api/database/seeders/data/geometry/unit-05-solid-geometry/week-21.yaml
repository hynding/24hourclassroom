      points: 3
      prompt: |
        Review. A concrete slab is a rectangular prism 3 m by 2 m by 0.15 m, and concrete has density 2400 kg/m³. Find the slab's volume and mass, then explain what would happen to the mass if the slab were made 0.3 m thick instead, and why this is not the k³ rule.
      answer: |
        V = 3 × 2 × 0.15 = 0.9 m³, so the mass is 0.9 × 2400 = 2160 kg. Doubling only the thickness to 0.3 m doubles the volume to 1.8 m³ and the mass to 4320 kg. This is a change in one dimension only, so the volume scales linearly (by 2); the k³ rule applies only when all three dimensions are scaled by the same factor, which would give 8 × 2160 = 17,280 kg.
      explanation: |
        1 point for V = 0.9 m³ and mass 2160 kg. 1 point for doubling to 4320 kg when only the thickness doubles. 1 point for distinguishing a one-dimension change (linear) from scaling all dimensions (k³).
