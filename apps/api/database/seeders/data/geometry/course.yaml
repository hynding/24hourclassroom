# The Geometry course map. Week files live under unit-NN-<slug>/week-NN.yaml.
# Titles and slugs are composed by Database\Seeders\Curriculum\Course from the
# numbers here, so nothing in a week file repeats the naming convention.
title: Geometry
# Every title starts with `prefix`; every test, material and the course row
# itself carry a slug that starts with `slug`.
prefix: Geometry
slug: geo
# The course page's introduction. Folded (`>`): one paragraph, not hard line breaks.
description: >
  A full year of high-school Geometry, one week at a time: a study guide, a
  flashcard deck and a quiz every week, a summary sheet and an exam at the end
  of each of the eight units, and a final-exam prep guide and a full practice
  final at the end of the year. The course runs from compass-and-straightedge
  constructions and rigid transformations through congruence, similarity,
  right-triangle trigonometry, solid geometry, coordinate geometry and
  circles, and closes with conditional probability. Every figure is described
  in words with labelled points and given measures, every proof is written
  out, and every example is worked step by step. Adapted from IM 9–12 Math by
  Illustrative Mathematics under CC BY 4.0, rewritten with original worked
  examples, questions and flashcards.
teacher: { name: "Geometry Teacher", email: geometry@example.com }
student: { name: "Geometry Student", email: geometry-student@example.com }
# Monday of week 1. Null means no due dates: the whole course is open at once.
start_date: 2026-08-31
subject: math
grade_level: "9-12"
review:
  prep_guide_week: 33
  practice_exam_week: 34
  prep_guide_description: The format of the practice final, what each of the eight units contributes, the formulas and theorems to know cold, how to write a proof and show work for credit, and a two-week review plan.
# Every guide and summary must end with all of these (the content lint).
attribution_markers: ["Illustrative Mathematics", "CC BY 4.0"]
attribution: |
  Adapted from IM 9–12 Math by Illustrative Mathematics (Geometry), © 2019
  Illustrative Mathematics, licensed under CC BY 4.0
  (https://creativecommons.org/licenses/by/4.0/). Lesson sequence, topic titles
  and learning goals follow the published curriculum; every study guide,
  flashcard, worked example and test item here is original writing for this
  course. Brief definitions and postulates quoted from Euclid's Elements use
  the public-domain Heath translation. The Illustrative Mathematics name and
  logo are used for attribution only, not as branding.
# The eight Standards for Mathematical Practice; guides tag themselves with them.
practices:
  MP1: Make sense of problems and persevere in solving them
  MP2: Reason abstractly and quantitatively
  MP3: Construct viable arguments and critique the reasoning of others
  MP4: Model with mathematics
  MP5: Use appropriate tools strategically
  MP6: Attend to precision
  MP7: Look for and make use of structure
  MP8: Look for and express regularity in repeated reasoning
