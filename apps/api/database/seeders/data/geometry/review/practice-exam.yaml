        (c) Stored grain has density 0.75 tonnes per m³. What mass of grain fills the cylindrical part exactly?

        (d) A second silo is similar to this one with scale factor 1.5. Find its total volume without recomputing the formulas, and explain the rule you used.

        (e) The outside of the silo (the curved side of the cylinder and the curved surface of the cone, not the base) is to be painted. Paint covers 5 m² per litre. How many litres are needed?
      answer: |
        (a) V = πr²h = π(4²)(10) = 160π ≈ 502.7 m³.

        (b) Cone: ⅓π(4²)(3) = 16π ≈ 50.3 m³. Total: 160π + 16π = 176π ≈ 552.9 m³.

        (c) Mass = density × volume = 0.75 × 160π = 120π ≈ 377.0 tonnes.

        (d) Volume scales by the cube of the scale factor: 1.5³ = 3.375, so the larger silo holds 176π × 3.375 = 594π ≈ 1866.1 m³.

        (e) Slant height of the cone: ℓ = √(4² + 3²) = 5 m. Cone lateral area πrℓ = π(4)(5) = 20π; cylinder lateral area 2πrh = 2π(4)(10) = 80π; total 100π ≈ 314.2 m². Paint: 314.2 ÷ 5 ≈ 62.8 litres, so buy 63 litres.
      explanation: |
        Scoring (8 points): 1 for 160π ≈ 502.7 m³; 1 for the cone 16π ≈ 50.3 m³ with the ⅓ used; 1 for the total 176π ≈ 552.9 m³; 1 for 120π ≈ 377.0 tonnes; 1 for the cube rule 1.5³ = 3.375 stated; 1 for 594π ≈ 1866.1 m³; 1 for the slant height 5 and the two lateral areas (20π and 80π, no base); 1 for 100π ≈ 314.2 m² and about 62.8 litres (accept 62.8 to 63). Deduct 1 overall for early rounding that moves a final answer by more than 0.1.

