week: 34
description: |
  A full-length practice final for the whole year: 70 questions, about 2 hours 30 minutes, in unit order and
  weighted roughly as the course weights its eight units (Unit 1 heaviest, Unit 8 lightest). 44 multiple choice
  (several in sets of three on one shared figure, table or scenario), 6 select-all (2 points, partial credit),
  5 true/false, 4 fill-in-the-blank, 6 numeric, 3 short answers (3 points each, from Units 2, 4 and 8) and 2 long
  answers (8 points each, from Units 5 and 6), 96 points in all. Multiple choice, select-all, true/false and
  numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the
  long answers are graded by your teacher against the scoring notes. Every figure is described in words: sketch
  it before you compute. Keep π and square roots exact until the last step, then round to the precision each
  prompt asks for (use π ≈ 3.1416). Sit it in one block if you can: about 75 minutes for items 1–44, a short
  break, then 75 minutes for items 45–70, leaving at least 20 minutes for each long answer.
questions:
  # ======================================================================
  # Unit 1 · Constructions and Rigid Transformations: q01–q12
  # Unit 2 · Congruence: q13–q21 · Unit 3 · Similarity: q22–q30
  # Unit 4 · Right Triangle Trigonometry: q31–q37 · Unit 5 · Solid Geometry: q38–q46
  # Unit 6 · Coordinate Geometry: q47–q56 · Unit 7 · Circles: q57–q64
  # Unit 8 · Conditional Probability: q65–q70
  # ======================================================================
  # ---- Unit 1 · Set A: a triangle on the grid under three rigid motions (1.11, 1.12, 1.14)
    - slug: geo-final-q01
      type: multiple_choice
      topic_code: "1.11"
      source: "IM Geometry, Unit 1, Lesson 11"
      points: 1
      stimulus: |
        Figure description: on a coordinate grid, triangle ABC has vertices A(1, 1), B(5, 1) and C(1, 4).
      prompt: |
        Triangle ABC is reflected across the x-axis. What is the image of C?
      options:
        - "(−1, 4)"
        - "(4, 1)"
        - "(1, −4)"
        - "(−1, −4)"
      option_explanations:
        - |
          (−1, 4) is the reflection across the y-axis, which negates x instead.
        - |
          (4, 1) swaps the coordinates, which is the reflection across the line y = x.
        - |
          Correct. Reflecting across the x-axis keeps x and negates y: (1, 4) → (1, −4).
        - |
          (−1, −4) is a 180° rotation about the origin, which negates both coordinates.
      answer: 2

    - slug: geo-final-q02
      type: multiple_choice
      topic_code: "1.12"
      source: "IM Geometry, Unit 1, Lesson 12"
      points: 1
      stimulus: |
        Figure description: on a coordinate grid, triangle ABC has vertices A(1, 1), B(5, 1) and C(1, 4).
      prompt: |
        A translation takes A to (−2, 3). Where does it take B?
      options:
        - "(2, 3)"
        - "(−6, 3)"
        - "(2, −1)"
        - "(8, −1)"
      option_explanations:
        - |
          Correct. The translation moves every point by (−3, +2), so B(5, 1) goes to (2, 3).
        - |
          (−6, 3) would need a move of (−11, +2); a translation moves every point by the same vector, (−3, +2).
        - |
          (2, −1) has the right x but subtracts 2 from y instead of adding 2.
        - |
          (8, −1) moves B by (+3, −2), the opposite direction from the one that takes A to (−2, 3).
      answer: 0

    - slug: geo-final-q03
      type: multiple_choice
      topic_code: "1.14"
      source: "IM Geometry, Unit 1, Lesson 14"
      points: 1
      stimulus: |
        Figure description: on a coordinate grid, triangle ABC has vertices A(1, 1), B(5, 1) and C(1, 4).
      prompt: |
        Triangle ABC is rotated 90° counterclockwise about the origin. What is the image of C?
      options:
        - "(−1, −4)"
        - "(4, 1)"
        - "(4, −1)"
        - "(−4, 1)"
      option_explanations:
        - |
          (−1, −4) is a 180° rotation, which negates both coordinates.
        - |
          (4, 1) is a reflection across y = x, not a rotation.
        - |
          (4, −1) is the 90° clockwise rotation, (x, y) → (y, −x).
        - |
          Correct. A 90° counterclockwise rotation about the origin sends (x, y) to (−y, x), so (1, 4) → (−4, 1).
      answer: 3

    - slug: geo-final-q04
      type: multiple_choice
      topic_code: "1.3"
      source: "IM Geometry, Unit 1, Lesson 3"
      points: 1
      prompt: |
        Which construction produces the perpendicular bisector of segment AB?
      options:
        - "Measure AB with a ruler, mark its midpoint, and draw any line through the midpoint"
        - "Draw circles centred at A and at B with the same radius, larger than half of AB; draw the line through their two intersection points"
        - "Draw circles centred at A and at B with radius equal to AB; draw the line through A and B"
        - "Draw a circle centred at A with radius AB; draw the line through A and the point where it crosses AB"
      option_explanations:
        - |
          A compass-and-straightedge construction does not measure, and "any line" through the midpoint need not be perpendicular.
        - |
          Correct. Each intersection point is equidistant from A and B, so the line through them is the perpendicular bisector.
        - |
          The line through A and B is the segment's own line, not its perpendicular bisector; the circles are drawn but never used.
        - |
          A circle centred at A with radius AB passes through B and crosses AB only at B; it locates no midpoint.
      answer: 1

    - slug: geo-final-q05
      type: multiple_choice
      topic_code: "1.5"
      source: "IM Geometry, Unit 1, Lesson 5"
      points: 1
      prompt: |
        To bisect angle V, an arc centred at V meets the two sides at P and Q; equal arcs centred at P and at Q meet at R; the ray VR is drawn. Why does VR bisect the angle?
      options:
        - "Because PR and QR are both perpendicular to the sides of the angle"
        - "Because VR is parallel to PQ"
        - "△VPR ≅ △VQR by SSS (VP = VQ, PR = QR, VR common), so ∠PVR = ∠QVR"
        - "Because R is the midpoint of PQ"
      option_explanations:
        - |
          Nothing in the construction makes PR or QR perpendicular to a side; the argument is about congruent triangles.
        - |
          VR crosses PQ (at its midpoint, in fact) rather than running parallel to it.
        - |
          Correct. The two triangles share VR, and the equal compass settings give VP = VQ and PR = QR; SSS makes the angles at V equal.
        - |
          R is not on PQ at all; it is where the two arcs from P and Q cross, away from the segment.
      answer: 2

    - slug: geo-final-q06
      type: multiple_choice
      topic_code: "1.15"
      source: "IM Geometry, Unit 1, Lesson 15"
      points: 1
      prompt: |
        Which figure has exactly three lines of symmetry and rotation symmetry of order 3 (it maps to itself under rotations of 120° and 240°)?
      options:
        - "An isosceles triangle that is not equilateral"
        - "An equilateral triangle"
        - "A rectangle that is not a square"
        - "A regular hexagon"
      option_explanations:
        - |
          An isosceles triangle has one line of symmetry and no rotation symmetry other than 360°.
        - |
          Correct. The three medians are lines of symmetry, and rotating 120° about the centre maps the triangle to itself.
        - |
          A rectangle has two lines of symmetry and rotation symmetry of order 2 (180°).
        - |
          A regular hexagon has six lines of symmetry and rotation symmetry of order 6.
      answer: 1

    - slug: geo-final-q07
      type: multiple_choice
      topic_code: "1.20"
      source: "IM Geometry, Unit 1, Lesson 20"
      points: 1
      prompt: |
        Figure description: lines m and n are parallel and are cut by a transversal t. Angles a and b are same-side interior angles, and a = 68°. What is b?
      options:
        - "158°"
        - "22°"
        - "68°"
        - "112°"
      option_explanations:
        - |
          158° does not come from 180° − 68°; supplementary angles sum to exactly 180°.
        - |
          22° is the complement of 68°; angles between parallel lines are supplementary, not complementary.
        - |
          68° would be right for alternate interior or corresponding angles, which are congruent, not for same-side interior angles.
        - |
          Correct. Same-side interior angles between parallel lines are supplementary: 180° − 68° = 112°.
      answer: 3

    - slug: geo-final-q08
      type: multiple_choice
      topic_code: "1.21"
      source: "IM Geometry, Unit 1, Lesson 21"
      points: 1
      prompt: |
        The angles of a triangle measure (2x)°, (3x + 10)° and (x + 20)°. What is the largest angle?
      options:
        - "85°"
        - "25°"
        - "50°"
        - "95°"
      option_explanations:
        - |
          Correct. 2x + 3x + 10 + x + 20 = 180 gives 6x = 150, x = 25, so the angles are 50°, 85° and 45°.
        - |
          25° is the value of x, not an angle of the triangle.
        - |
          50° is the angle 2x; 3x + 10 = 85° is larger.
        - |
          95° would need x = 28⅓, which does not make the angles sum to 180°.
      answer: 0

    - slug: geo-final-q09
      type: multi_select
      topic_code: "1.10"
      source: "IM Geometry, Unit 1, Lesson 10"
      points: 2
      partial_credit: true
      prompt: |
        Which transformations are rigid motions, preserving every distance and angle? Select all that apply.
      options:
        - "A translation by a given vector"
        - "A horizontal stretch that triples every x-coordinate"
        - "A reflection across a line"
        - "A dilation with scale factor 2"
        - "A rotation about a point"
      option_explanations:
        - |
          Yes: a translation slides every point the same distance in the same direction.
        - |
          No: a stretch changes horizontal lengths but not vertical ones, so distances and angles change.
        - |
          Yes: a reflection is a rigid motion; it keeps every length and angle, reversing orientation.
        - |
          No: a dilation with factor 2 doubles every length, so it is not rigid.
        - |
          Yes: a rotation keeps every distance from the centre and every angle between points.
      answer: [0, 2, 4]

    - slug: geo-final-q10
      type: true_false
      topic_code: "1.4"
      source: "IM Geometry, Unit 1, Lesson 4"
      points: 1
      prompt: |
        True or false: an equilateral triangle can be constructed on any segment AB by drawing the circles centred at A and at B with radius AB and joining A and B to one of the two points where the circles meet.
      answer: true
      explanation: |
        True. This is Euclid's first proposition: each circle has radius AB, so the intersection point C satisfies AC = AB and BC = AB.

    - slug: geo-final-q11
      type: fill_blank
      topic_code: "1.21"
      source: "IM Geometry, Unit 1, Lesson 21"
      points: 1
      prompt: |
        An exterior angle of a triangle measures 125°, and one of the two remote interior angles measures 40°. The other remote interior angle measures ____°.
      answer: ["85", "85°"]
      explanation: |
        An exterior angle equals the sum of the two remote interior angles: 125° − 40° = 85°.

    - slug: geo-final-q12
      type: numeric
      topic_code: "1.13"
      source: "IM Geometry, Unit 1, Lesson 13"
      points: 1
      prompt: |
        A figure is rotated 150° clockwise about point O, then 70° counterclockwise about the same point O. The combined effect is a single clockwise rotation about O through how many degrees? Give a whole number.
      answer: { value: 80, tolerance: 0 }
      explanation: |
        Rotations about the same centre add with sign: 150° clockwise then 70° counterclockwise is 150° − 70° = 80° clockwise.

  # ---- Unit 2 · Congruence (2.6–2.15): q13–q21
    - slug: geo-final-q13
      type: multiple_choice
      topic_code: "2.6"
      source: "IM Geometry, Unit 2, Lesson 6"
      points: 1
      prompt: |
        Figure description: segments AC and BD cross at M, and M is the midpoint of both. Which criterion proves △AMB ≅ △CMD?
      options:
        - "The triangles cannot be proved congruent from this information"
        - "SSS: all three pairs of sides are given equal"
        - "ASA: two pairs of angles and the included sides are given"
        - "SAS: AM = CM, ∠AMB = ∠CMD (vertical angles), BM = DM"
      option_explanations:
        - |
          Two sides and the included angle are enough; the triangles are congruent by SAS.
        - |
          Only two pairs of sides are given; AB = CD is a conclusion of the congruence, not a given.
        - |
          Only one pair of angles (the vertical angles) is known before the triangles are proved congruent.
        - |
          Correct. The midpoint gives two pairs of equal sides, and the vertical angles between them are equal; that is SAS.
      answer: 3

    - slug: geo-final-q14
      type: multiple_choice
      topic_code: "2.7"
      source: "IM Geometry, Unit 2, Lesson 7"
      points: 1
      prompt: |
        Figure description: quadrilateral ABCD has AB ∥ DC and AD ∥ BC; diagonal AC is drawn. Which statement proves △ABC ≅ △CDA?
      options:
        - "AAA: all three pairs of angles are equal"
        - "ASA: ∠BAC = ∠DCA and ∠BCA = ∠DAC (alternate interior angles), with AC common"
        - "SSS: AB = CD, BC = DA and AC = CA, all given"
        - "SAS: AB = CD, ∠B = ∠D, BC = DA"
      option_explanations:
        - |
          AAA is not a congruence criterion; it only gives similarity.
        - |
          Correct. Each pair of parallel sides gives a pair of alternate interior angles at the diagonal, and the diagonal is shared: ASA.
        - |
          AB = CD and BC = DA are consequences of the congruence, not givens; only the parallels are given.
        - |
          Neither the side equalities nor ∠B = ∠D is given; they follow from the congruence.
      answer: 1

    - slug: geo-final-q15
      type: multiple_choice
      topic_code: "2.11"
      source: "IM Geometry, Unit 2, Lesson 11"
      points: 1
      prompt: |
        In △ABC and △DEF, AB = DE = 7, BC = EF = 5 and ∠A = ∠D = 40°. Which statement is correct?
      options:
        - "The triangles are congruent by SAS"
        - "The triangles are congruent by SSA"
        - "The triangles need not be congruent: two sides and a non-included angle (SSA) allow two different triangles here"
        - "The triangles are congruent by ASA"
      option_explanations:
        - |
          SAS needs the angle between the two sides; here ∠A is at the end of AB but not adjacent to BC.
        - |
          SSA is not a congruence criterion; two sides and a non-included angle can fit two different triangles.
        - |
          Correct. The 40° angle is not between the two given sides, and the side opposite it (5) is shorter than the other side (7), so the swinging side can land in two places.
        - |
          Only one pair of angles is given, so ASA cannot apply.
      answer: 2

    - slug: geo-final-q16
      type: multiple_choice
      topic_code: "2.8"
      source: "IM Geometry, Unit 2, Lesson 8"
      points: 1
      prompt: |
        Point P satisfies PA = PB for two fixed points A and B. Which statement must be true?
      options:
        - "P lies on the perpendicular bisector of AB"
        - "P lies on the circle with diameter AB"
        - "P is the midpoint of AB"
        - "PA is perpendicular to PB"
      option_explanations:
        - |
          Correct. The Perpendicular Bisector Theorem: the points equidistant from A and B are exactly the perpendicular bisector of AB.
        - |
          Points on the circle with diameter AB see AB at a right angle; they are not in general equidistant from A and B.
        - |
          The midpoint is one such point, but every point of the perpendicular bisector works.
        - |
          PA ⊥ PB happens only at the two points of the perpendicular bisector that are half of AB away from the midpoint.
      answer: 0

    - slug: geo-final-q17
      type: multiple_choice
      topic_code: "2.13"
      source: "IM Geometry, Unit 2, Lesson 13"
      points: 1
      prompt: |
        In parallelogram PQRS the diagonals meet at T. If PT = 3x − 1 and TR = x + 7, what is x?
      options:
        - "8"
        - "4"
        - "3"
        - "2"
      option_explanations:
        - |
          8 is the common length PT = TR when x = 4, not the value of x.
        - |
          Correct. The diagonals of a parallelogram bisect each other, so PT = TR: 3x − 1 = x + 7 gives x = 4.
        - |
          x = 3 gives PT = 8 and TR = 10, which are not equal.
        - |
          x = 2 gives PT = 5 and TR = 9, which are not equal.
      answer: 1

    - slug: geo-final-q18
      type: multiple_choice
      topic_code: "2.15"
      source: "IM Geometry, Unit 2, Lesson 15"
      points: 1
      prompt: |
        Which set of conditions guarantees that a quadrilateral is a parallelogram?
      options:
        - "One pair of opposite angles is congruent"
        - "One pair of opposite sides is congruent and the other pair is parallel"
        - "Both pairs of opposite sides are congruent"
        - "The diagonals are congruent"
      option_explanations:
        - |
          A kite has one pair of congruent opposite angles and is not a parallelogram.
        - |
          An isosceles trapezoid has one pair of congruent legs and one pair of parallel bases without being a parallelogram.
        - |
          Correct. Drawing a diagonal gives two triangles congruent by SSS, whose alternate interior angles make both pairs of sides parallel.
        - |
          An isosceles trapezoid has congruent diagonals too; congruent diagonals mark a rectangle only among parallelograms.
      answer: 2

    - slug: geo-final-q19
      type: multi_select
      topic_code: "2.4"
      source: "IM Geometry, Unit 2, Lesson 4"
      points: 2
      partial_credit: true
      prompt: |
        In which cases must the two triangles described be congruent? Select all that apply.
      options:
        - "Two triangles with sides 3, 4, 5 and sides 3, 4, 5"
        - "Two triangles with sides 5 and 5 and a 50° angle between them"
        - "Two triangles with angles 30°, 60°, 90°"
        - "Two right triangles with hypotenuse 10 and one leg 6"
        - "Two triangles with sides 6 and 9 and a 35° angle opposite the side of length 6"
      option_explanations:
        - |
          Yes: three pairs of equal sides is the SSS criterion, which fixes the triangle completely.
        - |
          Yes: two sides and the included angle is SAS.
        - |
          No: equal angles give similar triangles, which can be different sizes.
        - |
          Yes: the other leg is forced to be 8 by the Pythagorean Theorem (or use HL), so SSS applies.
        - |
          No: this is SSA with the shorter side opposite the angle, which allows two different triangles.
      answer: [0, 1, 3]

    - slug: geo-final-q20
      type: true_false
      topic_code: "2.12"
      source: "IM Geometry, Unit 2, Lesson 12"
      points: 1
      prompt: |
        True or false: if the diagonals of a quadrilateral are perpendicular, the quadrilateral must be a rhombus.
      answer: false
      explanation: |
        False. A kite has perpendicular diagonals and is not a rhombus. Perpendicular diagonals mark a rhombus only when the quadrilateral is already a parallelogram.

    - slug: geo-final-q21
      type: short_answer
      topic_code: "2.10"
      source: "IM Geometry, Unit 2, Lesson 10"
      points: 3
      prompt: |
        Figure description: △ABC is isosceles with AB = AC, and M is the midpoint of BC. Segment AM is drawn.

        (a) Prove △ABM ≅ △ACM, naming the criterion.

        (b) Use (a) to prove ∠B = ∠C.

        (c) Use (a) to prove AM ⊥ BC.
      answer: |
        (a) AB = AC (given); BM = CM (M is the midpoint of BC); AM = AM (common side). So △ABM ≅ △ACM by SSS.

        (b) ∠ABM and ∠ACM are corresponding angles of the congruent triangles, so ∠B = ∠C.

        (c) ∠AMB and ∠AMC are corresponding angles of the congruent triangles, so they are equal; they also form a straight angle at M, so each is 90°. Hence AM ⊥ BC.
      explanation: |
        Scoring (3 points): 1 for listing the three pairs of equal sides and citing SSS; 1 for identifying ∠B and ∠C as corresponding parts of the congruent triangles; 1 for the equal angles at M that sum to 180°, hence 90° each. A proof using SAS after first establishing something not given earns no credit for (a).

  # ---- Unit 3 · Set B: a parallel segment inside a triangle (3.5, 3.9, 3.11)
    - slug: geo-final-q22
      type: multiple_choice
      topic_code: "3.11"
      source: "IM Geometry, Unit 3, Lesson 11"
      points: 1
      stimulus: |
        Figure description: in △ABC, point D lies on side AB and point E lies on side AC, with DE ∥ BC. AD = 4, DB = 6, AE = 3 and DE = 5.
      prompt: |
        What is the length of BC?
      options:
        - "12.5"
        - "7.5"
        - "20"
        - "11"
      option_explanations:
        - |
          Correct. △ADE ∼ △ABC with scale factor AB/AD = 10/4 = 2.5, so BC = 2.5 × 5 = 12.5.
        - |
          7.5 uses the ratio DB/AD = 6/4 instead of AB/AD = 10/4; the whole side AB is 10.
        - |
          20 multiplies by 4 for no reason; the scale factor is 10/4.
        - |
          11 adds 6 to DE; parallel segments scale, they do not add.
      answer: 0

    - slug: geo-final-q23
      type: multiple_choice
      topic_code: "3.5"
      source: "IM Geometry, Unit 3, Lesson 5"
      points: 1
      stimulus: |
        Figure description: in △ABC, point D lies on side AB and point E lies on side AC, with DE ∥ BC. AD = 4, DB = 6, AE = 3 and DE = 5.
      prompt: |
        What is the length of EC?
      options:
        - "2"
        - "7.5"
        - "6"
        - "4.5"
      option_explanations:
        - |
          2 would make AE/EC = 3/2, which does not match AD/DB = 2/3.
        - |
          7.5 is the whole side AC (= 2.5 × 3), not the part EC below E.
        - |
          6 copies DB; the segments on AC are shorter than the matching segments on AB in the ratio 3 : 4.
        - |
          Correct. DE ∥ BC splits the sides proportionally: AE/EC = AD/DB = 4/6, so EC = 3 × 6/4 = 4.5.
      answer: 3

    - slug: geo-final-q24
      type: multiple_choice
      topic_code: "3.9"
      source: "IM Geometry, Unit 3, Lesson 9"
      points: 1
      stimulus: |
        Figure description: in △ABC, point D lies on side AB and point E lies on side AC, with DE ∥ BC. AD = 4, DB = 6, AE = 3 and DE = 5.
      prompt: |
        Which argument shows that △ADE ∼ △ABC?
      options:
        - "ASA: two angles and the included side AD = AB"
        - "SSS∼: all three pairs of sides are in the ratio 2 : 5"
        - "The triangles share a vertex, and any two triangles sharing a vertex are similar"
        - "AA: ∠A is shared, and ∠ADE = ∠ABC because they are corresponding angles for the parallel lines DE and BC"
      option_explanations:
        - |
          ASA is a congruence criterion, and AD ≠ AB in any case.
        - |
          The ratio is 2 : 5 for AD : AB and AE : AC, but DE : BC and the third pair are conclusions, not givens.
        - |
          Sharing a vertex guarantees nothing; the parallel side is what forces the equal angles.
        - |
          Correct. Two pairs of equal angles are enough for similarity, and the parallel lines supply the second pair.
      answer: 3

    - slug: geo-final-q25
      type: multiple_choice
      topic_code: "3.3"
      source: "IM Geometry, Unit 3, Lesson 3"
      points: 1
      prompt: |
        A dilation with centre (0, 0) and scale factor 3 is applied to the point (2, −1). What is its image?
      options:
        - "(−6, 3)"
        - "(6, −3)"
        - "(5, 2)"
        - "(2/3, −1/3)"
      option_explanations:
        - |
          (−6, 3) multiplies by −3, which also rotates the point 180° about the centre.
        - |
          Correct. A dilation centred at the origin multiplies both coordinates by the scale factor.
        - |
          (5, 2) adds 3 to each coordinate, which is a translation, not a dilation.
        - |
          (2/3, −1/3) divides by 3, which is the dilation with scale factor 1/3.
      answer: 1

    - slug: geo-final-q26
      type: multiple_choice
      topic_code: "3.4"
      source: "IM Geometry, Unit 3, Lesson 4"
      points: 1
      prompt: |
        A dilation with centre O and scale factor 1/2 is applied to a line ℓ that does not pass through O. What is the image of ℓ?
      options:
        - "A line parallel to ℓ, half as far from O as ℓ is"
        - "A line through O perpendicular to ℓ"
        - "The line ℓ itself"
        - "A line parallel to ℓ, twice as far from O as ℓ is"
      option_explanations:
        - |
          Correct. A dilation maps a line not through the centre to a parallel line, and every distance from O is multiplied by 1/2.
        - |
          Dilations preserve directions; the image is parallel to ℓ, not perpendicular.
        - |
          A line maps to itself only when it passes through the centre of dilation.
        - |
          Twice as far would be scale factor 2; the factor here is 1/2.
      answer: 0

    - slug: geo-final-q27
      type: multiple_choice
      topic_code: "3.14"
      source: "IM Geometry, Unit 3, Lesson 14"
      points: 1
      prompt: |
        Figure description: right triangle ABC with the right angle at C; the altitude from C meets the hypotenuse AB at D, with AD = 4 and DB = 9. What is CD?
      options:
        - "13"
        - "6.5"
        - "6"
        - "36"
      option_explanations:
        - |
          13 is the hypotenuse AD + DB, not the altitude.
        - |
          6.5 is half the hypotenuse, the radius of the circumscribed circle, not the altitude.
        - |
