    - slug: geo-final-q56
      type: long_answer
      topic_code: "6.14"
      source: "IM Geometry, Unit 6, Lesson 14"
      points: 8
      prompt: |
        (a) Use coordinates to prove that the midpoints of the four sides of any quadrilateral are the vertices of a parallelogram. Place the quadrilateral with vertices A(0, 0), B(2a, 0), C(2b, 2c) and D(2d, 2e), find the four midpoints, and show that both pairs of opposite sides of the midpoint figure are parallel.

        (b) Check your proof on the quadrilateral A(0, 0), B(6, 0), C(8, 4), D(2, 6): find the four midpoints and the slopes of the four sides of the midpoint figure.
      answer: |
        (a) Midpoints: M₁ of AB = (a, 0); M₂ of BC = (a + b, c); M₃ of CD = (b + d, c + e); M₄ of DA = (d, e).

        Slope of M₁M₂ = (c − 0)/((a + b) − a) = c/b. Slope of M₄M₃ = ((c + e) − e)/((b + d) − d) = c/b. Equal slopes, so M₁M₂ ∥ M₄M₃. (If b = 0 both segments are vertical, still parallel.)

        Slope of M₂M₃ = ((c + e) − c)/((b + d) − (a + b)) = e/(d − a). Slope of M₁M₄ = (e − 0)/(d − a) = e/(d − a). Equal, so M₂M₃ ∥ M₁M₄. (If d = a both are vertical.)

        Both pairs of opposite sides are parallel, so M₁M₂M₃M₄ is a parallelogram. The coordinates were general (a, b, c, d, e arbitrary), so this holds for every quadrilateral.

        (b) Midpoints: AB → (3, 0); BC → (7, 2); CD → (5, 5); DA → (1, 3). Slopes: (3, 0)→(7, 2): 2/4 = 1/2; (1, 3)→(5, 5): 2/4 = 1/2; (7, 2)→(5, 5): 3/(−2) = −3/2; (3, 0)→(1, 3): 3/(−2) = −3/2. Opposite sides have equal slopes, as the proof predicts.
      explanation: |
        Scoring (8 points): 1 for the four midpoints in terms of a, b, c, d, e; 2 for the slopes of M₁M₂ and M₄M₃ both equal to c/b (1 each); 2 for the slopes of M₂M₃ and M₁M₄ both equal to e/(d − a) (1 each); 1 for the conclusion that two pairs of parallel opposite sides make a parallelogram, with a sentence noting the coordinates were general; 1 for the four numeric midpoints in (b); 1 for the four slopes in (b) showing the two matching pairs. A proof that instead shows the diagonals of the midpoint figure share a midpoint ((a + b + d)/2, (c + e)/2) earns full credit for the first six points.

