    - slug: geo-final-q70
      type: short_answer
      topic_code: "8.7"
      source: "IM Geometry, Unit 8, Lesson 7"
      points: 3
      prompt: |
        A bag holds 4 red and 2 blue tokens. Two tokens are drawn one after the other without replacement.

        (a) Find P(both red).

        (b) Find P(exactly one red).

        (c) Player A wins if the two tokens are the same colour; Player B wins if they are different colours. Is the game fair? If not, who is favoured, and by how much?
      answer: |
        (a) P(RR) = (4/6)(3/5) = 12/30 = 2/5.

        (b) P(RB) + P(BR) = (4/6)(2/5) + (2/6)(4/5) = 8/30 + 8/30 = 16/30 = 8/15.

        (c) P(same colour) = P(RR) + P(BB) = 12/30 + (2/6)(1/5) = 12/30 + 2/30 = 14/30 = 7/15; P(different) = 8/15. Not fair: B is favoured, 8/15 to 7/15, a difference of 1/15.
      explanation: |
        Scoring (3 points): 1 for 2/5 with the second-draw probability 3/5 (not 4/6); 1 for 8/15 with both orders counted; 1 for 7/15 versus 8/15 and the conclusion that B is favoured.
