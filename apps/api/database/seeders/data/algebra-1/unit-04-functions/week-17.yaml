week: 17
unit: 4
title: "Domain, Range, Piecewise and Absolute Value Functions"
topics: ["4.10", "4.11", "4.12", "4.13", "4.14"]
guide: guides/week-17.md
guide_description: |
  Deciding the domain and range of a function from a situation and from a graph, discrete versus continuous
  domains, open and closed endpoints, evaluating and graphing piecewise functions, the absolute value function
  as a distance and its V-shaped graph, and shifted absolute value graphs used for "within c of" conditions.
flashcards_description: |
  28 cards on domain and range vocabulary, domains from situations and from graphs, step and piecewise
  functions and their boundary points, the absolute value function, vertices of shifted V graphs, and solving
  distance equations and inequalities.

flashcards:
  - front: Domain of a function → definition
    back: |
      The set of all inputs that are allowed or make sense. In a situation it is decided by the context, not by whether the formula can be computed.
    topic_code: "4.10"
  - front: Range of a function → definition
    back: |
      The set of all outputs the function actually produces from the inputs in its domain.
    topic_code: "4.10"
  - front: Discrete versus continuous domain
    back: |
      Discrete: only separate values, such as whole numbers of tickets. Continuous: every value in an interval, such as time or length.
    topic_code: "4.10"
  - front: Cost of n tickets at $12, at most 8 per person → domain and range
    back: |
      Domain: whole numbers 0 to 8. Range: 0, 12, 24, …, 96. The formula 12n would accept any n, but the situation does not.
    topic_code: "4.10"
  - front: Tank V(t) = 500 − 20t draining → domain and range
    back: |
      It is empty at t = 25, so the domain is 0 ≤ t ≤ 25 and the range is 0 ≤ V ≤ 500. Negative times and volumes are excluded.
    topic_code: "4.10"
  - front: Height of a ball thrown at t = 0 and caught at t = 3 → domain
    back: |
      0 ≤ t ≤ 3, continuous, because every instant between the throw and the catch has a height.
    topic_code: "4.10"
  - front: Why the domain comes from the situation
    back: |
      A formula may produce numbers for inputs that have no meaning (negative tickets, time after the tank is empty). The domain keeps only inputs that make sense.
    topic_code: "4.10"
  - front: Reading the domain from a graph
    back: |
      The set of x-values the graph covers, read from left to right. A filled dot includes the endpoint; an open dot excludes it.
    topic_code: "4.11"
  - front: Reading the range from a graph
    back: |
      The set of y-values the graph reaches, read from bottom to top, including any dips or peaks between the endpoints.
    topic_code: "4.11"
  - front: Graph from a filled dot at (−2, 3) to an open dot at (4, 7), dipping to −1 → domain and range
    back: |
      Domain −2 ≤ x < 4. Range −1 ≤ y < 7: the low point −1 is on the curve, while 7 is excluded by the open dot.
    topic_code: "4.11"
  - front: Horizontal segment from (1, 4) to (5, 4) → domain and range
    back: |
      Domain 1 ≤ x ≤ 5; range the single value 4, because every output is 4.
    topic_code: "4.11"
  - front: Sketching a graph with a given domain and range
    back: |
      Start at the smallest x, end at the largest, touch both the smallest and largest y somewhere, and never leave the band. Many graphs qualify.
    topic_code: "4.11"
  - front: Piecewise function → definition
    back: |
      A function defined by different rules on different parts of its domain. To evaluate, find the piece that contains the input, then apply that rule.
    topic_code: "4.12"
  - front: Parking charge $3 first hour, $2 each extra hour or part → C(2.5)
    back: |
      2.5 hours falls in the piece 2 < t ≤ 3, which costs 3 + 2 + 2 = 7 dollars.
    topic_code: "4.12"
  - front: Step function graph → open and filled dots
    back: |
      Each horizontal step has an open dot at the end that is excluded and a filled dot at the end that is included; which end is which follows the inequalities of the pieces.
    topic_code: "4.12"
  - front: f(x) = 2x + 1 for x < 2 and 7 − x for x ≥ 2 → f(2)
    back: |
      2 satisfies x ≥ 2, so use the second rule: f(2) = 7 − 2 = 5. The first rule is for inputs strictly less than 2.
    topic_code: "4.12"
  - front: Boundary input of a piecewise function → which piece
    back: |
      The piece whose inequality includes the boundary (≤ or ≥). Only one piece may include each input, or the rule would not be a function.
    topic_code: "4.12"
  - front: Postage $1 up to 30 g, $1.50 over 30 g up to 60 g → P(30) and P(30.1)
    back: |
      P(30) = 1 because 30 g is "up to 30 g"; P(30.1) = 1.50 because it is over 30 g.
    topic_code: "4.12"
  - front: Absolute value → definition
    back: |
      The distance of a number from 0 on the number line, so |7| = 7 and |−7| = 7. It is never negative.
    topic_code: "4.13"
  - front: f(x) = |x| as a piecewise function
    back: |
      f(x) = x when x ≥ 0 and f(x) = −x when x < 0. Both pieces give non-negative outputs.
    topic_code: "4.13"
  - front: Graph of y = |x| → shape, vertex, domain, range
    back: |
      A V with vertex at the origin, slope 1 to the right and −1 to the left. Domain all real numbers; range y ≥ 0; minimum value 0 at x = 0.
    topic_code: "4.13"
  - front: Where the graph of |x| is decreasing
    back: |
      For x < 0: moving right toward 0 the distance from 0 shrinks. For x > 0 the graph is increasing.
    topic_code: "4.13"
  - front: Vertex of y = |x − a|
    back: |
      At (a, 0), where the inside equals zero. |x − 3| has its vertex at x = 3: the V shifts right, not left.
    topic_code: "4.14"
  - front: Vertex and range of y = |x + 4| − 1
    back: |
      The inside is zero at x = −4 and the output there is −1, so the vertex is (−4, −1) and the range is y ≥ −1.
    topic_code: "4.14"
  - front: Graph of y = −|x|
    back: |
      An upside-down V with vertex (0, 0): it has a maximum of 0 and range y ≤ 0.
    topic_code: "4.14"
  - front: Error function E(L) = |L − 50| for rods meant to be 50 cm
    back: |
      E gives how far a rod's length is from 50, regardless of direction. E(48) = 2, E(53) = 3. Rods with |L − 50| ≤ 1 satisfy 49 ≤ L ≤ 51.
    topic_code: "4.14"
  - front: Solving |x − 3| = 5 by distance
    back: |
      The numbers at distance 5 from 3 are 3 + 5 = 8 and 3 − 5 = −2. On the graph, y = 5 meets the V at x = −2 and x = 8.
    topic_code: "4.14"
  - front: Solving |x − 10| ≤ 2
    back: |
      The numbers within 2 of 10: 8 ≤ x ≤ 12. On the graph of |x − 10| this is where the V is at or below the height 2.
    topic_code: "4.14"

quiz:
  description: |
    25 questions · about 45 minutes · domain and range from situations and graphs, piecewise functions, and
    absolute value functions (lessons 4.10 to 4.14), with review of features of graphs and average rate of
    change from week 16, function basics from week 15, and earlier units. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the
    short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: parking garage (4.12, 4.10, 4.11)
    - slug: alg1-u04-w17-q01
      type: multiple_choice
      topic_code: "4.12"
      source: "IM Algebra 1, Unit 4, Lesson 12"
      points: 1
      stimulus: |
        A parking garage charges $3 for the first hour or any part of it, then $2 for each additional hour or any part of one, up to a maximum of $15 for the day. Cars may stay at most 24 hours. C(t) is the charge in dollars for a stay of t hours.
      prompt: |
        What is C(2.5)?
      options:
        - "$7"
        - "$5"
        - "$8"
        - "$7.50"
      option_explanations:
        - |
          Correct. The first hour costs $3 and the stay runs into a second and a third hour, each costing $2: 3 + 2 + 2 = 7.
        - |
          $5 covers only the first two hours; a stay of 2.5 hours runs into a third hour, which is charged in full.
        - |
          $8 would be four hours at $2 each; the first hour costs $3, not $2.
        - |
          The garage charges for any part of an hour, so there is no half-hour charge.
      answer: 0

    - slug: alg1-u04-w17-q02
      type: multiple_choice
      topic_code: "4.12"
      source: "IM Algebra 1, Unit 4, Lesson 12"
      points: 1
      stimulus: |
        A parking garage charges $3 for the first hour or any part of it, then $2 for each additional hour or any part of one, up to a maximum of $15 for the day. Cars may stay at most 24 hours. C(t) is the charge in dollars for a stay of t hours.
      prompt: |
        Which describes the graph of C correctly near t = 1?
      options:
        - "A horizontal step at $3 ending with a filled dot at t = 1, then a step at $5 starting with an open dot at t = 1."
        - "A horizontal step at $3 ending with an open dot at t = 1, then a step at $5 starting with a filled dot at t = 1."
        - "A straight line rising from $3 at t = 1 to $5 at t = 2."
        - "A single point at (1, 5)."
      option_explanations:
        - |
          Correct. Exactly 1 hour costs $3 (filled dot), and any stay longer than 1 hour, however slightly, costs $5 (open dot at the left end of the next step).
        - |
          This gives a 1-hour stay the $5 charge, but the first hour, including exactly 1 hour, costs $3.
        - |
          The charge jumps rather than rising gradually; any part of an hour costs the full $2.
        - |
          The graph is a step function defined for every t in the domain, not isolated points.
      answer: 0

    - slug: alg1-u04-w17-q03
      type: multiple_choice
      topic_code: "4.10"
      source: "IM Algebra 1, Unit 4, Lesson 10"
      points: 1
      stimulus: |
        A parking garage charges $3 for the first hour or any part of it, then $2 for each additional hour or any part of one, up to a maximum of $15 for the day. Cars may stay at most 24 hours. C(t) is the charge in dollars for a stay of t hours.
      prompt: |
        What is the domain of C?
      options:
        - "All real numbers"
        - "0 < t ≤ 24"
        - "The whole numbers 1 to 24"
        - "3 ≤ t ≤ 15"
      option_explanations:
        - |
          Negative stays and stays over 24 hours are not allowed, so the domain is restricted.
        - |
          Correct. A stay lasts some positive time up to the 24-hour limit, and any length in between is possible.
        - |
          Stays need not be whole hours; 2.5 hours is a valid input.
        - |
          3 and 15 are charges, outputs of C, not lengths of stay.
      answer: 1

    - slug: alg1-u04-w17-q04
      type: multiple_choice
      topic_code: "4.11"
      source: "IM Algebra 1, Unit 4, Lesson 11"
      points: 1
      stimulus: |
        A parking garage charges $3 for the first hour or any part of it, then $2 for each additional hour or any part of one, up to a maximum of $15 for the day. Cars may stay at most 24 hours. C(t) is the charge in dollars for a stay of t hours.
      prompt: |
        What is the range of C?
      options:
        - "3 ≤ C ≤ 15"
        - "The values 3, 5, 7, 9, 11, 13 and 15 only"
        - "0 < C ≤ 24"
        - "All multiples of 2 up to 15"
      option_explanations:
        - |
          Charges jump in $2 steps, so values such as $4 never occur; the range is not a whole interval.
        - |
          Correct. The charge starts at 3, rises by 2 for each extra hour, and is capped at 15, so only those seven values occur.
        - |
          0 to 24 describes the inputs (hours), not the charges.
        - |
          The charges are odd numbers (3, 5, 7, …), not multiples of 2.
      answer: 1

    # ---- Multiple choice (4.10–4.14)
    - slug: alg1-u04-w17-q05
      type: multiple_choice
      topic_code: "4.10"
      source: "IM Algebra 1, Unit 4, Lesson 10"
      points: 1
      prompt: |
        A 500-litre tank drains at 20 litres per minute, so V(t) = 500 − 20t gives the volume after t minutes. What is the domain of V in this situation?
      options:
        - "All real numbers"
        - "0 ≤ t ≤ 25"
        - "0 ≤ t ≤ 500"
        - "t ≥ 25"
      option_explanations:
        - |
          Negative time has no meaning, and after the tank is empty the formula would give negative volumes.
        - |
          Correct. The tank empties when 500 − 20t = 0, at t = 25, so sensible inputs run from 0 to 25 minutes.
        - |
          500 is the starting volume in litres, an output, not a number of minutes.
        - |
          After 25 minutes the tank is empty and the formula no longer describes anything.
      answer: 1

    - slug: alg1-u04-w17-q06
      type: multiple_choice
      topic_code: "4.10"
      source: "IM Algebra 1, Unit 4, Lesson 10"
      points: 1
      prompt: |
        A bakery sells muffins only in boxes of 6 and bakes at most 30 boxes a day. B(x) = 6x gives the number of muffins in x boxes. What is the range of B?
      options:
        - "All whole numbers from 0 to 180"
        - "The multiples of 6 from 0 to 180"
        - "The whole numbers from 0 to 30"
        - "All real numbers from 0 to 180"
      option_explanations:
        - |
          Only multiples of 6 can be produced; 7 muffins, for example, is impossible.
        - |
          Correct. The domain is the whole numbers 0 to 30, and 6 times each of those gives 0, 6, 12, …, 180.
        - |
          0 to 30 is the domain, the number of boxes, not the number of muffins.
        - |
          The outputs are whole numbers of muffins, not every real number.
      answer: 1

    - slug: alg1-u04-w17-q07
      type: multiple_choice
      topic_code: "4.11"
      source: "IM Algebra 1, Unit 4, Lesson 11"
      points: 1
      prompt: |
        A graph runs from a filled dot at (−2, 3) to an open dot at (4, 7), dipping to a lowest point of −1 in between. What are the domain and range?
      options:
        - "Domain −2 ≤ x < 4; range −1 ≤ y < 7"
        - "Domain −2 ≤ x ≤ 4; range 3 ≤ y ≤ 7"
        - "Domain −1 ≤ x < 7; range −2 ≤ y < 4"
        - "Domain −2 < x ≤ 4; range −1 < y ≤ 7"
      option_explanations:
        - |
          Correct. The x-values run from −2 (included) to 4 (excluded); the y-values run from the low point −1 up to, but not including, 7.
        - |
          The open dot excludes x = 4, and the range must include the dip to −1, which is below 3.
        - |
          This swaps the domain and range: the x-values are −2 to 4, the y-values −1 to 7.
        - |
          The filled dot is at x = −2 and the open dot at x = 4, so the inclusions are the other way round.
      answer: 0

    - slug: alg1-u04-w17-q08
      type: multiple_choice
      topic_code: "4.13"
      source: "IM Algebra 1, Unit 4, Lesson 13"
      points: 1
      prompt: |
        Which statement about the function f(x) = |x| is true?
      options:
        - "Its graph is a straight line with slope 1."
        - "f(−7) = −7."
        - "Its range is y ≥ 0 and its minimum value is 0."
        - "Its domain is x ≥ 0."
      option_explanations:
        - |
          The graph is a V: slope 1 to the right of 0 and slope −1 to the left.
        - |
          |−7| is the distance of −7 from 0, which is 7, never a negative number.
        - |
          Correct. Distances are never negative, and the distance is 0 at x = 0, the vertex.
        - |
          Any real number has a distance from 0, so every real number is an allowed input.
      answer: 2

    - slug: alg1-u04-w17-q09
      type: multiple_choice
      topic_code: "4.14"
      source: "IM Algebra 1, Unit 4, Lesson 14"
      points: 1
      prompt: |
        What is the vertex of the graph of y = |x − 3| + 2?
      options:
        - "(−3, 2)"
        - "(3, 2)"
        - "(3, −2)"
        - "(2, 3)"
      option_explanations:
        - |
          The inside is zero when x = 3, not −3; |x − 3| shifts the V to the right.
        - |
          Correct. The expression inside the bars is zero at x = 3, and the output there is 0 + 2 = 2.
        - |
          Adding 2 moves the V up, so the vertex has y-coordinate 2, not −2.
        - |
          This swaps the coordinates; x = 3 is where the inside vanishes and 2 is the output there.
      answer: 1

    - slug: alg1-u04-w17-q10
      type: multiple_choice
      topic_code: "4.14"
      source: "IM Algebra 1, Unit 4, Lesson 14"
      points: 1
      prompt: |
        Which values of x satisfy |x − 3| = 5?
      options:
        - "x = 8 only"
        - "x = 8 or x = −2"
        - "x = 2 or x = −8"
        - "x = 5 or x = −5"
      option_explanations:
        - |
          8 is one solution, but there is a second number at distance 5 from 3 on the other side.
        - |
          Correct. The numbers at distance 5 from 3 are 3 + 5 = 8 and 3 − 5 = −2.
        - |
          These are the numbers at distance 5 from −3, which would solve |x + 3| = 5.
        - |
          These solve |x| = 5; the shift by 3 moves both solutions to the right.
      answer: 1

    - slug: alg1-u04-w17-q11
      type: multiple_choice
      topic_code: "4.6"
      source: "IM Algebra 1, Unit 4, Lesson 6"
      points: 1
      prompt: |
        A function's graph reaches its lowest point, −4, when x = 2. Which statement is correct?
      options:
        - "The minimum value is 2."
        - "The minimum value is −4, occurring at x = 2."
        - "The function has a zero at x = −4."
        - "The function is decreasing for x > 2."
      option_explanations:
        - |
          2 is the input where the minimum occurs; the minimum value is the output, −4.
        - |
          Correct. The minimum is the smallest output, −4, and it happens at the input 2.
        - |
          A zero is an input with output 0; nothing here says the graph crosses the axis at −4.
        - |
          After its lowest point a graph rises, so the function is increasing for x > 2.
      answer: 1

    - slug: alg1-u04-w17-q12
      type: multiple_choice
      topic_code: "1.5"
      source: "IM Algebra 1, Unit 1, Lesson 5"
      points: 1
      prompt: |
        The data set 2, 4, 9 has mean 5. What is its mean absolute deviation (MAD)?
      options:
        - "0"
        - "8/3, about 2.67"
        - "7"
        - "3"
      option_explanations:
        - |
          The signed deviations (−3, −1, 4) add to 0, but MAD uses their absolute values.
        - |
          Correct. The distances from the mean are 3, 1 and 4; their mean is 8/3 ≈ 2.67.
        - |
          7 is the range (9 − 2), not the average distance from the mean.
        - |
          3 is the largest deviation below the mean, not the average of all the distances.
      answer: 1

    - slug: alg1-u04-w17-q13
      type: multiple_choice
      topic_code: "2.20"
      source: "IM Algebra 1, Unit 2, Lesson 20"
      points: 1
      prompt: |
        What is the solution set of 7 − 2x < 1?
      options:
        - "x < 3"
        - "x > 3"
        - "x < −3"
        - "x > −3"
      option_explanations:
        - |
          Dividing by −2 reverses the inequality symbol, so the solution is x > 3, not x < 3.
        - |
          Correct. 7 − 2x < 1 gives −2x < −6, and dividing by −2 flips the symbol: x > 3. Check x = 4: 7 − 8 = −1 < 1.
        - |
          −3 comes from a sign error in −2x < −6; dividing gives 3, with the symbol reversed.
        - |
          The boundary is 3, not −3; test x = 0: 7 < 1 is false, so 0 is not a solution.
      answer: 1

    # ---- Select-all (4.10, 4.7)
    - slug: alg1-u04-w17-q14
      type: multi_select
      topic_code: "4.10"
      source: "IM Algebra 1, Unit 4, Lesson 10"
      points: 2
      partial_credit: true
      prompt: |
        Which functions have a discrete domain (only separate values make sense as inputs)? Select all that apply.
      options:
        - "The cost of n ride tickets at a fair"
        - "The height of a kite t seconds after launch"
        - "The number of chairs needed for p people at a dinner"
        - "The temperature of soup m minutes after it is served"
        - "The total legs on c three-legged stools"
      option_explanations:
        - |
          Correct. Tickets come in whole numbers; half a ticket cannot be bought.
        - |
          Time is continuous: every instant after launch has a height.
        - |
          Correct. People are counted in whole numbers.
        - |
          Time is continuous, so every moment is a valid input.
        - |
          Correct. Stools are counted in whole numbers.
      answer: [0, 2, 4]

    - slug: alg1-u04-w17-q15
      type: multi_select
      topic_code: "4.7"
      source: "IM Algebra 1, Unit 4, Lesson 7"
      points: 2
      partial_credit: true
      prompt: |
        A table gives f(0) = 10, f(2) = 16, f(5) = 25 and f(8) = 25. Which statements are true? Select all that apply.
      options:
        - "The average rate of change from 0 to 2 is 3."
        - "The average rate of change from 2 to 5 is 3."
        - "The average rate of change from 5 to 8 is 0."
        - "The average rate of change from 0 to 8 is 15."
        - "The function is linear."
      option_explanations:
        - |
          Correct. The change in output 16 − 10 = 6 over a change in input of 2 gives a rate of 3.
        - |
          Correct. The output rises by 9 while the input rises by 3, so the rate is 9/3 = 3.
        - |
          Correct. The output does not change between 5 and 8, so the rate is 0.
        - |
          (25 − 10)/(8 − 0) = 15/8, not 15; the total change must be divided by the change in input.
        - |
          A linear function has the same rate over every interval, but here the rate drops from 3 to 0.
      answer: [0, 1, 2]

    # ---- True/false (4.13, 4.1)
    - slug: alg1-u04-w17-q16
      type: true_false
      topic_code: "4.13"
      source: "IM Algebra 1, Unit 4, Lesson 13"
      points: 1
      prompt: |
        True or false: the output of f(x) = |x| can be negative for some inputs.
      answer: false
      explanation: |
        False. |x| is the distance of x from 0, and distances are never negative. The smallest output is 0, at x = 0.

    - slug: alg1-u04-w17-q17
      type: true_false
      topic_code: "4.1"
      source: "IM Algebra 1, Unit 4, Lesson 1"
      points: 1
      prompt: |
        True or false: the horizontal line y = 5 is the graph of a function of x.
      answer: true
      explanation: |
        True. Every input x gives exactly one output, 5. A function may repeat outputs; it only cannot give one input two outputs (which is why a vertical line is not a function).

    # ---- Fill in the blank (4.11, 2.6)
    - slug: alg1-u04-w17-q18
      type: fill_blank
      topic_code: "4.11"
      source: "IM Algebra 1, Unit 4, Lesson 11"
      points: 1
      prompt: |
        On a graph, the set of y-values the graph reaches, read from bottom to top, is the ____ of the function.
      answer: ["range"]
      explanation: |
        The range is the set of outputs. The domain is read along the horizontal axis; the range along the vertical axis.

    - slug: alg1-u04-w17-q19
      type: fill_blank
      topic_code: "2.6"
      source: "IM Algebra 1, Unit 2, Lesson 6"
      points: 1
      prompt: |
        Multiplying both sides of an equation by the same ____ number produces an equivalent equation.
      answer: ["non-zero", "nonzero", "non zero"]
      explanation: |
        Multiplying by zero turns any equation into 0 = 0, which every number satisfies, so the solution set changes. Any other number is safe.

    # ---- Numeric (4.12, 4.14, 4.7)
    - slug: alg1-u04-w17-q20
      type: numeric
      topic_code: "4.12"
      source: "IM Algebra 1, Unit 4, Lesson 12"
      points: 1
      prompt: |
        g(x) = x² for x ≤ 1 and g(x) = 2 − x for x > 1. What is g(3)?
      answer: { value: -1, tolerance: 0 }
      explanation: |
        3 > 1, so the second rule applies: g(3) = 2 − 3 = −1.

    - slug: alg1-u04-w17-q21
      type: numeric
      topic_code: "4.14"
      source: "IM Algebra 1, Unit 4, Lesson 14"
      points: 1
      prompt: |
        What is the minimum value of y = |x − 6| + 1?
      answer: { value: 1, tolerance: 0 }
      explanation: |
        |x − 6| is at least 0, with equality at x = 6, so the smallest output is 0 + 1 = 1, at the vertex (6, 1).

    - slug: alg1-u04-w17-q22
      type: numeric
      topic_code: "4.7"
      source: "IM Algebra 1, Unit 4, Lesson 7"
      points: 1
      prompt: |
        What is the average rate of change of f(x) = x² + 1 from x = 2 to x = 4?
      answer: { value: 6, tolerance: 0 }
      explanation: |
        f(4) = 17 and f(2) = 5, so (17 − 5)/(4 − 2) = 12/2 = 6.

    # ---- Short answer (4.10/4.11, 4.14)
    - slug: alg1-u04-w17-q23
      type: short_answer
      topic_code: "4.10"
      source: "IM Algebra 1, Unit 4, Lesson 10"
      points: 3
      prompt: |
        A student has $40 and buys sandwiches at $2.50 each. M(n) = 40 − 2.5n is the money left after n sandwiches.

        (a) State the domain of M in this situation and explain each restriction.
        (b) State the range of M.
        (c) Describe what the graph of M looks like (shape, and whether it is a line or separate points) and why.
      answer: |
        (a) n is a whole number (sandwiches are not sold in fractions) and 2.5n ≤ 40, so 0 ≤ n ≤ 16. Negative sandwiches make no sense and more than 16 cannot be afforded.
        (b) The outputs 40, 37.5, 35, …, 2.5, 0: multiples of 2.5 from 0 to 40.
        (c) Seventeen separate points lying along a line of slope −2.5 from (0, 40) to (16, 0); they are not joined because only whole numbers of sandwiches are possible.
      explanation: |
        Three points, one per part.

        (a) 1 pt: whole numbers 0 to 16 with both reasons (no fractions, cannot exceed the money).

        (b) 1 pt: the 17 values from 40 down to 0 in steps of 2.5.

        (c) 1 pt: separate points on a falling line, not a connected segment, with the discrete-domain reason.

    - slug: alg1-u04-w17-q24
      type: short_answer
      topic_code: "4.14"
      source: "IM Algebra 1, Unit 4, Lesson 14"
      points: 3
      prompt: |
        A factory cuts rods that should be 80 cm long. The error for a rod of length L is E(L) = |L − 80|.

        (a) Find E(77) and E(82.5) and explain what each tells the inspector.
        (b) Describe the graph of E: its shape, its vertex, and its range.
        (c) Rods pass inspection if their error is at most 1.5 cm. Write this condition with absolute value and give the passing lengths as an inequality.
      answer: |
        (a) E(77) = 3: the rod is 3 cm off (too short). E(82.5) = 2.5: the rod is 2.5 cm off (too long). The error ignores direction and reports only the size of the miss.
        (b) A V with vertex (80, 0), opening upward with slopes −1 and 1; range E ≥ 0.
        (c) |L − 80| ≤ 1.5, which means 78.5 ≤ L ≤ 81.5.
      explanation: |
        Three points, one per part.

        (a) 1 pt: 3 and 2.5 with the interpretation that error measures size of the miss.

        (b) 1 pt: V shape, vertex (80, 0), range E ≥ 0.

        (c) 1 pt: the absolute value inequality and the interval 78.5 to 81.5.

    # ---- Long answer (4.12)
    - slug: alg1-u04-w17-q25
      type: long_answer
      topic_code: "4.12"
      source: "IM Algebra 1, Unit 4, Lesson 12"
      points: 6
      prompt: |
        A mobile plan charges $25 a month, which includes 2 GB of data. Each additional gigabyte, or part of one, costs $8, up to a cap: no bill ever exceeds $65. A customer can use at most 20 GB in a month. Let B(g) be the bill in dollars for g gigabytes used.

        (1) Write B as a piecewise function, giving the rule and the inputs for each piece, including the cap.
        (2) Evaluate B(1.5), B(2), B(2.1), B(5) and B(12).
        (3) Describe the graph of B: the shape of each piece, where the dots are open or filled at g = 2 and g = 3, and the flat part at the cap.
        (4) State the domain and range of B, and find every value of g for which B(g) = 41.
      answer: |
        (1) B(g) = 25 for 0 ≤ g ≤ 2; B(g) = 25 + 8k for 2 + (k − 1) < g ≤ 2 + k with k = 1, 2, 3, 4 (that is, 33 for 2 < g ≤ 3, 41 for 3 < g ≤ 4, 49 for 4 < g ≤ 5, 57 for 5 < g ≤ 6); B(g) = 65 for 6 < g ≤ 20 (the cap, reached because 25 + 8(5) = 65 at the sixth extra gigabyte).
        (2) B(1.5) = 25; B(2) = 25; B(2.1) = 33; B(5) = 49; B(12) = 65.
        (3) A horizontal segment at 25 from g = 0 to g = 2 with a filled dot at (2, 25); a step at 33 with an open dot at (2, 33) and a filled dot at (3, 33); then steps at 41, 49 and 57, each with an open left end and a filled right end; finally a flat segment at 65 from just after g = 6 (open dot at (6, 65)) to a filled dot at (20, 65).
        (4) Domain 0 ≤ g ≤ 20; range the values 25, 33, 41, 49, 57, 65. B(g) = 41 for every g with 3 < g ≤ 4.
      explanation: |
        Six points.

        (1) 2 pts: 1 for the base piece and the $8 steps with correct strict/non-strict inequalities, 1 for the cap piece starting after 6 GB.

        (2) 1 pt: all five values.

        (3) 1 pt: step shape with the correct open and filled dots and the flat cap.

        (4) 2 pts: 1 for the domain and the six-value range, 1 for 3 < g ≤ 4 as the full solution set (not a single value).

        Common errors: charging $8 for exactly 2 GB; treating the steps as a sloped line; giving the range as the interval 25 to 65; answering B(g) = 41 with g = 4 only.
