unit: 4
description: |
  45 questions · about 90 minutes · every lesson of Unit 4 (4.1 to 4.18): functions and notation, rules,
  features of graphs, average rate of change, interpreting and comparing graphs, domain and range, piecewise
  and absolute value functions, inverses, and modelling, plus review of Units 2 and 3. Three stimulus sets
  share a situation across consecutive items. Multiple choice, select-all, true/false and numeric items are
  graded at once; fill-in-the-blank items are matched automatically; the short answers and the long answer
  are graded by your teacher against the scoring notes.
questions:
  # ---- Functions, notation and rules (4.1-4.5)
  - slug: alg1-u04-exam-q01
    type: multiple_choice
    topic_code: "4.1"
    source: "IM Algebra 1, Unit 4, Lesson 1"
    points: 1
    prompt: |
      Which statement correctly explains why "the number of a student's locker" is a function of "the student", but "the student" is not a function of "the first letter of their surname"?
    options:
      - "Every student has exactly one locker, but several students can share a first letter."
      - "Locker numbers are numbers, while letters are not."
      - "Every letter is used by exactly one student."
      - "Students can have more than one locker."
    option_explanations:
      - |
        Correct. One input, one output makes the first a function; a letter leading to many students breaks the rule for the second.
      - |
        Whether outputs are numbers or letters has nothing to do with being a function.
      - |
        If each letter belonged to exactly one student, the second relationship would be a function; the point is that it does not.
      - |
        If students had several lockers the first relationship would fail; the statement says it is a function.
    answer: 0

  - slug: alg1-u04-exam-q02
    type: multiple_choice
    topic_code: "4.2"
    source: "IM Algebra 1, Unit 4, Lesson 2"
    points: 1
    prompt: |
      N(h) is the number of visitors in a museum h hours after it opens. Which statement means "three hours after opening there were 120 visitors"?
    options:
      - "N(120) = 3"
      - "N(3) = 120"
      - "N(3) × 120"
      - "N = 3 + 120"
    option_explanations:
      - |
        This puts 120 hours in and 3 visitors out, the reverse of the sentence.
      - |
        Correct. The input is 3 hours and the output is 120 visitors.
      - |
        Function notation is not multiplication; N(3) is a single value, 120.
      - |
        The notation names an input and its output; adding the two numbers has no meaning.
    answer: 1

  - slug: alg1-u04-exam-q03
    type: multiple_choice
    topic_code: "4.3"
    source: "IM Algebra 1, Unit 4, Lesson 3"
    points: 1
    prompt: |
      L(t) is the length of a candle in centimetres t hours after it is lit. What does L(2) > L(5) say?
    options:
      - "The candle was longer after 5 hours than after 2 hours."
      - "The candle was longer after 2 hours than after 5 hours."
      - "The candle burned 2 cm in 5 hours."
      - "The candle was lit for more than 5 hours."
    option_explanations:
      - |
        The statement says L(2) is the larger output, so the candle was longer at 2 hours.
      - |
        Correct. Comparing outputs compares lengths: at 2 hours the candle was longer than at 5 hours, as a burning candle should be.
      - |
        An inequality between outputs does not give a rate or an amount burned.
      - |
        The statement compares two lengths; it says nothing about how long the candle was lit in total.
    answer: 1

  - slug: alg1-u04-exam-q04
    type: multiple_choice
    topic_code: "4.4"
    source: "IM Algebra 1, Unit 4, Lesson 4"
    points: 1
    prompt: |
      A water tank starts with 300 litres and is filled at 25 litres per minute. Which rule gives the volume V(m) after m minutes?
    options:
      - "V(m) = 300m + 25"
      - "V(m) = 25m + 300"
      - "V(m) = 325m"
      - "V(m) = 300 − 25m"
    option_explanations:
      - |
        This adds 300 litres every minute and 25 once, the reverse of the situation.
      - |
        Correct. The starting volume is the constant and the rate multiplies the minutes.
      - |
        Adding the numbers and multiplying by m gives 325 litres per minute with no starting volume.
      - |
        The tank is filling, so the volume rises; subtracting describes draining.
    answer: 1

  - slug: alg1-u04-exam-q05
    type: multiple_choice
    topic_code: "4.4"
    source: "IM Algebra 1, Unit 4, Lesson 4"
    points: 1
    prompt: |
      A table gives k(0) = 50, k(3) = 38, k(6) = 26 and k(9) = 14. Which rule matches it?
    options:
      - "k(x) = 50 − 4x"
      - "k(x) = 50 − 12x"
      - "k(x) = 4x + 50"
      - "k(x) = 38 − 4x"
    option_explanations:
      - |
        Correct. The output falls 12 for every 3 units of input, so 4 per unit, from a start of 50.
      - |
        12 is the drop per 3 units, not per unit; k(3) would be 14, not 38.
      - |
        The outputs decrease, so the rate must be negative.
      - |
        The value at input 0 is 50, not 38; 38 is k(3).
    answer: 0

  - slug: alg1-u04-exam-q06
    type: multiple_choice
    topic_code: "4.5"
    source: "IM Algebra 1, Unit 4, Lesson 5"
    points: 1
    prompt: |
      The area of a square of side s is A(s) = s². For which side length is the area 169 square centimetres?
    options:
      - "13 cm"
      - "84.5 cm"
      - "28,561 cm"
      - "14 cm"
    option_explanations:
      - |
        Correct. s² = 169 gives s = 13, since 13 × 13 = 169 and side lengths are positive.
      - |
        84.5 is half of 169; the area is the side squared, not doubled.
      - |
        28,561 is 169², which evaluates A(169) instead of solving A(s) = 169.
      - |
        14 × 14 = 196, which is larger than 169, so 14 cm is too long.
    answer: 0

  # ---- Stimulus set A: a bakery's daily sales (4.2, 4.3, 4.7)
  - slug: alg1-u04-exam-q07
    type: multiple_choice
    topic_code: "4.2"
    source: "IM Algebra 1, Unit 4, Lesson 2"
    points: 1
    stimulus: |
      The function S gives the number of loaves a bakery has sold by h hours after opening.

      | h | 0 | 1 | 2 | 3 | 4 | 5 | 6 |
      |---|---|---|---|---|---|---|---|
      | S(h) | 0 | 24 | 40 | 52 | 52 | 70 | 90 |
    prompt: |
      What is S(3)?
    options:
      - "52"
      - "3"
      - "40"
      - "156"
    option_explanations:
      - |
        Correct. The column for h = 3 shows 52 loaves sold by then.
      - |
        3 is the input, the number of hours after opening, not the number of loaves sold.
      - |
        40 is S(2), the number of loaves sold by two hours after opening, the wrong column.
      - |
        156 is 52 × 3, treating the notation as multiplication.
    answer: 0

  - slug: alg1-u04-exam-q08
    type: multiple_choice
    topic_code: "4.3"
    source: "IM Algebra 1, Unit 4, Lesson 3"
    points: 1
    stimulus: |
      The function S gives the number of loaves a bakery has sold by h hours after opening.

      | h | 0 | 1 | 2 | 3 | 4 | 5 | 6 |
      |---|---|---|---|---|---|---|---|
      | S(h) | 0 | 24 | 40 | 52 | 52 | 70 | 90 |
    prompt: |
      What does S(3) = S(4) tell you about the bakery?
    options:
      - "The bakery sold 52 loaves during the fourth hour."
      - "No loaves were sold between 3 and 4 hours after opening."
      - "The bakery was closed for the first 3 hours."
      - "Sales doubled between the third and fourth hours."
    option_explanations:
      - |
        52 is the running total, not the sales in one hour; the total did not change during the fourth hour.
      - |
        Correct. The cumulative total stayed at 52, so nothing was sold in that hour.
      - |
        Loaves were sold from the first hour on (24 by h = 1), so the bakery was open.
      - |
        Equal totals mean zero sales in the interval, not a doubling.
    answer: 1

  - slug: alg1-u04-exam-q09
    type: multiple_choice
    topic_code: "4.7"
    source: "IM Algebra 1, Unit 4, Lesson 7"
    points: 1
    stimulus: |
      The function S gives the number of loaves a bakery has sold by h hours after opening.

      | h | 0 | 1 | 2 | 3 | 4 | 5 | 6 |
      |---|---|---|---|---|---|---|---|
      | S(h) | 0 | 24 | 40 | 52 | 52 | 70 | 90 |
    prompt: |
      What is the average rate of change of S from h = 4 to h = 6, and what does it mean?
    options:
      - "19 loaves per hour: the average selling rate in the last two hours."
      - "38 loaves per hour: the total sold in the last two hours."
      - "15 loaves per hour: the average rate over the whole day."
      - "45 loaves per hour: the final total divided by 2."
    option_explanations:
      - |
        Correct. (90 − 52)/(6 − 4) = 38/2 = 19 loaves per hour over that interval.
      - |
        38 is the total change in loaves, not a rate; it must be divided by the 2 hours.
      - |
        15 is (90 − 0)/6, the average rate over the whole day, not over h = 4 to 6.
      - |
        45 divides the final total by 2 instead of using the change over the interval.
    answer: 0

  # ---- Features, rates and graphs (4.6-4.9)
  - slug: alg1-u04-exam-q10
    type: multiple_choice
    topic_code: "4.6"
    source: "IM Algebra 1, Unit 4, Lesson 6"
    points: 1
    prompt: |
      The graph of a diver's height above the water, in metres, starts at 10 at t = 0, rises to a maximum of 11 at t = 0.5, and reaches 0 at t = 2. Which statement is correct?
    options:
      - "The vertical intercept is 10 and the zero is at t = 2."
      - "The vertical intercept is 11 and the zero is at t = 0.5."
      - "The maximum is at t = 10."
      - "The function is increasing for 0.5 < t < 2."
    option_explanations:
      - |
        Correct. The height at t = 0 is 10 (the platform), and the diver hits the water, height 0, at t = 2.
      - |
        11 is the maximum, not the starting value, and t = 0.5 is where the maximum occurs, not a zero.
      - |
        The maximum, 11, occurs at t = 0.5; 10 is a height, not a time.
      - |
        After the peak at t = 0.5 the diver falls, so the function is decreasing on that interval.
    answer: 0

  - slug: alg1-u04-exam-q11
    type: multiple_choice
    topic_code: "4.6"
    source: "IM Algebra 1, Unit 4, Lesson 6"
    points: 1
    prompt: |
      A function's graph lies below the horizontal axis for 0 < x < 4 and above it for x > 4, with its lowest point of −6 at x = 2. Which statement is true?
    options:
      - "f(4) = 0 and the minimum value is −6."
      - "f(2) = 0 and the minimum value is 4."
      - "The function is positive for 0 < x < 4."
      - "The minimum occurs at x = −6."
    option_explanations:
      - |
        Correct. The graph crosses the axis at x = 4, so f(4) = 0, and its lowest output is −6.
      - |
        f(2) is the minimum, −6, not 0; and 4 is an input, not the minimum value.
      - |
        Below the axis means negative outputs, so f is negative on 0 < x < 4.
      - |
        −6 is the minimum value (an output); it occurs at the input x = 2.
    answer: 0

  - slug: alg1-u04-exam-q12
    type: multiple_choice
    topic_code: "4.7"
    source: "IM Algebra 1, Unit 4, Lesson 7"
    points: 1
    prompt: |
      A plant was 8 cm tall on day 4 and 23 cm tall on day 10. What was its average growth rate over that period?
    options:
      - "2.5 cm per day"
      - "15 cm per day"
      - "1.5 cm per day"
      - "3.8 cm per day"
    option_explanations:
      - |
        Correct. (23 − 8)/(10 − 4) = 15/6 = 2.5 cm per day.
      - |
        15 cm is the total growth over the 6 days, not the growth per day.
      - |
        1.5 divides by 10 instead of by the 6 days between the measurements.
      - |
        3.8 is 15/4, dividing by the starting day rather than the elapsed time.
    answer: 0

  - slug: alg1-u04-exam-q13
    type: multiple_choice
    topic_code: "4.8"
    source: "IM Algebra 1, Unit 4, Lesson 8"
    points: 1
    prompt: |
      A graph of the number of people in a stadium against time rises slowly, then steeply, is flat for two hours, then drops almost vertically to zero. Which story fits?
    options:
      - "Early arrivals trickle in, a rush before kick-off fills the stadium, the match is played, and everyone leaves quickly at the end."
      - "The crowd leaves slowly at first, then quickly, then the stadium is empty for two hours."
      - "People arrive at a steady rate all afternoon."
      - "The stadium is full for the whole time."
    option_explanations:
      - |
        Correct. Slow rise, steep rise, plateau and a sudden drop match arrivals, a rush, the match and the exit.
      - |
        The graph rises before it is flat, so people are arriving, not leaving, at the start.
      - |
        A steady arrival rate would be a single straight rising line, with no plateau or drop.
      - |
        A full stadium throughout would be a flat line at the capacity the whole time.
    answer: 0

  - slug: alg1-u04-exam-q14
    type: multiple_choice
    topic_code: "4.9"
    source: "IM Algebra 1, Unit 4, Lesson 9"
    points: 1
    prompt: |
      Plan X costs X(n) = 30 + 0.5n dollars for n gigabytes. Plan Y's table shows Y(0) = 10 and Y(20) = 50, growing steadily. For which amounts of data is plan X cheaper?
    options:
      - "More than about 13.3 GB"
      - "Less than about 13.3 GB"
      - "More than 20 GB"
      - "Plan X is never cheaper."
    option_explanations:
      - |
        Correct. Y(n) = 10 + 2n; 30 + 0.5n < 10 + 2n gives 20 < 1.5n, n > 40/3 ≈ 13.3 GB.
      - |
        Below 13.3 GB plan Y, with its lower starting charge, is the cheaper one.
      - |
        The plans are equal at 13.3 GB, not 20 GB; at 20 GB X costs 40 and Y costs 50.
      - |
        X grows more slowly (0.5 per GB against 2), so it must become cheaper for large n.
    answer: 0

  - slug: alg1-u04-exam-q15
    type: multiple_choice
    topic_code: "4.9"
    source: "IM Algebra 1, Unit 4, Lesson 9"
    points: 1
    prompt: |
      Two cars leave the same place. Car A's distance graph is a straight line reaching 120 km at t = 2 hours. Car B's graph is curved: 40 km at t = 1 and 120 km at t = 2. Which statement is true?
    options:
      - "At t = 1, car A was ahead of car B."
      - "At t = 1, car B was ahead of car A."
      - "Car B's average speed over the two hours was higher."
      - "Car B travelled at a constant speed."
    option_explanations:
      - |
        Correct. Car A's steady 60 km/h puts it at 60 km after one hour, ahead of car B's 40 km.
      - |
        Car B had covered only 40 km at t = 1, less than car A's 60 km.
      - |
        Both covered 120 km in 2 hours, so their average speeds are equal.
      - |
        A curved distance graph means the speed changed; B went faster in the second hour.
    answer: 0

  # ---- Stimulus set B: a hike (4.6, 4.7, 4.8)
  - slug: alg1-u04-exam-q16
    type: multiple_choice
    topic_code: "4.6"
    source: "IM Algebra 1, Unit 4, Lesson 6"
    points: 1
    stimulus: |
      E(t) is a hiker's elevation in metres t hours into a hike. The graph starts at 400 at t = 0, climbs to 900 at t = 2, stays at 900 until t = 2.5, descends to 650 at t = 4, and climbs to 1,000 at t = 5, where the hike ends.
    prompt: |
      What is the maximum value of E, and when does it occur?
    options:
      - "1,000 m at t = 5"
      - "900 m at t = 2"
      - "5 at t = 1,000"
      - "650 m at t = 4"
    option_explanations:
      - |
        Correct. The highest elevation reached is 1,000 m, at the end of the hike.
      - |
        900 m is a local high point (a hill before the valley), but the hike ends higher, at 1,000 m.
      - |
        This swaps the value and the time; the value is 1,000 and the time is 5.
      - |
        650 m is the low point of the valley, the minimum of the middle section.
    answer: 0

  - slug: alg1-u04-exam-q17
    type: multiple_choice
    topic_code: "4.7"
    source: "IM Algebra 1, Unit 4, Lesson 7"
    points: 1
    stimulus: |
      E(t) is a hiker's elevation in metres t hours into a hike. The graph starts at 400 at t = 0, climbs to 900 at t = 2, stays at 900 until t = 2.5, descends to 650 at t = 4, and climbs to 1,000 at t = 5, where the hike ends.
    prompt: |
      What is the average rate of change of E from t = 2.5 to t = 4?
    options:
      - "About −167 m per hour"
      - "−250 m per hour"
      - "About 167 m per hour"
      - "−62.5 m per hour"
    option_explanations:
      - |
        Correct. (650 − 900)/(4 − 2.5) = −250/1.5 ≈ −166.7 m per hour: descending.
      - |
        −250 is the change in elevation; it must be divided by the 1.5 hours.
      - |
        The elevation falls over this interval, so the rate is negative.
      - |
        −62.5 divides by 4 instead of by the 1.5-hour length of the interval.
    answer: 0

  - slug: alg1-u04-exam-q18
    type: multiple_choice
    topic_code: "4.8"
    source: "IM Algebra 1, Unit 4, Lesson 8"
    points: 1
    stimulus: |
      E(t) is a hiker's elevation in metres t hours into a hike. The graph starts at 400 at t = 0, climbs to 900 at t = 2, stays at 900 until t = 2.5, descends to 650 at t = 4, and climbs to 1,000 at t = 5, where the hike ends.
    prompt: |
      Which description of the hike matches the graph?
    options:
      - "A two-hour climb, a half-hour rest, a descent into a valley, then a steep final climb."
      - "A steady climb for five hours."
      - "A climb, a descent, then a rest at the summit."
      - "A descent into a valley followed by a long rest."
    option_explanations:
      - |
        Correct. Rising, flat, falling, then rising faster than before (350 m in 1 hour) matches the graph piece by piece.
      - |
        The graph has a flat section and a descent, so the climb was not steady.
      - |
        The rest (flat section) comes after the first climb, not at the end; the hike ends on a climb.
      - |
        The graph begins by climbing from 400 to 900, not by descending.
    answer: 0

  # ---- Domain, range, piecewise, absolute value (4.10-4.14)
  - slug: alg1-u04-exam-q19
    type: multiple_choice
    topic_code: "4.10"
    source: "IM Algebra 1, Unit 4, Lesson 10"
    points: 1
    prompt: |
      A lift can carry at most 12 people, and W(p) = 75p estimates the load in kilograms for p people. What are the domain and range of W?
    options:
      - "Domain: whole numbers 0 to 12; range: multiples of 75 from 0 to 900"
      - "Domain: 0 ≤ p ≤ 900; range: 0 ≤ W ≤ 12"
      - "Domain: all real numbers; range: all real numbers"
      - "Domain: whole numbers 0 to 12; range: all numbers from 0 to 900"
    option_explanations:
      - |
        Correct. People come in whole numbers up to 12, and each count gives a load of 75 times that number.
      - |
        This swaps the domain and the range and treats the loads as the inputs.
      - |
        Negative or fractional people and loads beyond the capacity make no sense here.
      - |
        Only multiples of 75 occur as outputs; a load of 100 kg, for example, is impossible in the model.
    answer: 0

  - slug: alg1-u04-exam-q20
    type: multiple_choice
    topic_code: "4.11"
    source: "IM Algebra 1, Unit 4, Lesson 11"
    points: 1
    prompt: |
      A graph consists of a curve from an open dot at (0, 5) down to a filled dot at (3, 1), then up to a filled dot at (7, 9). What is the range?
    options:
      - "1 ≤ y ≤ 9"
      - "0 < x ≤ 7"
      - "5 < y ≤ 9"
      - "1 < y < 9"
    option_explanations:
      - |
        Correct. The lowest point (3, 1) and the highest point (7, 9) are both filled, and every height in between is reached.
      - |
        0 < x ≤ 7 is the domain, the x-values the graph covers.
      - |
        The curve dips to 1 before rising, so heights below 5 are included; the open dot at 5 does not matter because 5 is reached again on the way up.
      - |
        Both 1 and 9 are reached at filled dots, so the endpoints are included.
    answer: 0

  - slug: alg1-u04-exam-q21
    type: multiple_choice
    topic_code: "4.12"
    source: "IM Algebra 1, Unit 4, Lesson 12"
    points: 1
    prompt: |
      Shipping costs $5 for packages up to 2 kg, $9 for packages over 2 kg up to 5 kg, and $15 for packages over 5 kg up to 20 kg. What are the costs for 2 kg, 2.01 kg and 5 kg packages?
    options:
      - "$5, $9, $9"
      - "$5, $5, $15"
      - "$9, $9, $15"
      - "$5, $9, $15"
    option_explanations:
      - |
        Correct. Exactly 2 kg is "up to 2 kg" ($5); 2.01 kg is over 2 kg ($9); exactly 5 kg is "up to 5 kg" ($9).
      - |
        2.01 kg is over 2 kg, so it moves to the $9 band, and 5 kg is still within the $9 band.
      - |
        A 2 kg package is within the first band and costs $5.
      - |
        5 kg is "up to 5 kg", so it costs $9; the $15 band starts just above 5 kg.
    answer: 0

  - slug: alg1-u04-exam-q22
    type: multiple_choice
    topic_code: "4.13"
    source: "IM Algebra 1, Unit 4, Lesson 13"
    points: 1
    prompt: |
      Which describes the graph of f(x) = |x| for x < 0?
    options:
      - "A line with slope −1, decreasing toward the vertex at the origin"
      - "A line with slope 1, increasing toward the vertex"
      - "A horizontal line at y = 0"
      - "The graph does not exist for negative x"
    option_explanations:
      - |
        Correct. For negative x, |x| = −x, a line of slope −1 that falls to 0 as x approaches 0.
      - |
        Slope 1 describes the right half, x > 0, where |x| = x.
      - |
        The outputs are positive distances, not 0, for negative inputs.
      - |
        Every real number has a distance from 0, so negative inputs are in the domain.
    answer: 0

  - slug: alg1-u04-exam-q23
    type: multiple_choice
    topic_code: "4.14"
    source: "IM Algebra 1, Unit 4, Lesson 14"
    points: 1
    prompt: |
      What are the vertex and range of y = |x + 2| − 5?
    options:
      - "Vertex (−2, −5); range y ≥ −5"
      - "Vertex (2, −5); range y ≥ −5"
      - "Vertex (−2, 5); range y ≥ 5"
      - "Vertex (−2, −5); range y ≤ −5"
    option_explanations:
      - |
        Correct. The inside is zero at x = −2, the output there is −5, and the V opens upward from that minimum.
      - |
        The inside x + 2 is zero at x = −2, not 2; the V is shifted left.
      - |
        Subtracting 5 moves the V down, so the vertex's y-coordinate is −5.
      - |
        The V opens upward (no negative sign in front of the bars), so the outputs are at least −5.
    answer: 0

  - slug: alg1-u04-exam-q24
    type: multiple_choice
    topic_code: "4.14"
    source: "IM Algebra 1, Unit 4, Lesson 14"
    points: 1
    prompt: |
      A bag of flour is labelled 2 kg and passes inspection if |m − 2| ≤ 0.05, where m is its mass in kg. Which masses pass?
    options:
      - "1.95 ≤ m ≤ 2.05"
      - "m ≤ 2.05 only"
      - "m = 1.95 or m = 2.05"
      - "1.5 ≤ m ≤ 2.5"
    option_explanations:
      - |
        Correct. The mass must be within 0.05 of 2, on either side.
      - |
        A bag of 1.5 kg satisfies m ≤ 2.05 but is 0.5 kg underweight; the lower limit also matters.
      - |
        These are the boundary masses; everything between them passes as well.
      - |
        0.5 is ten times the allowed error of 0.05.
    answer: 0

  # ---- Stimulus set C: a canoe rental and its inverse (4.15, 4.16, 4.17)
  - slug: alg1-u04-exam-q25
    type: multiple_choice
    topic_code: "4.15"
    source: "IM Algebra 1, Unit 4, Lesson 15"
    points: 1
    stimulus: |
      A canoe rental charges a $12 launch fee plus $9 per hour, so R(h) = 9h + 12 is the cost in dollars of a rental lasting h hours. Rentals last between 1 and 6 hours.
    prompt: |
      Which table shows pairs of the inverse of R?
    options:
      - "21 → 1, 30 → 2, 39 → 3"
      - "1 → 21, 2 → 30, 3 → 39"
      - "21 → 1/21, 30 → 1/30, 39 → 1/39"
      - "1 → 9, 2 → 18, 3 → 27"
    option_explanations:
      - |
        Correct. R sends 1 → 21, 2 → 30, 3 → 39; the inverse reads each pair the other way, from dollars to hours.
      - |
        These are pairs of R itself, hours to dollars, not of its inverse.
      - |
        An inverse function is not a reciprocal; it returns the hours that produced each cost.
