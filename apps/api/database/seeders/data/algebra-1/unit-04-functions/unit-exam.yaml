  # ---- Free response
  - slug: alg1-u04-exam-q43
    type: short_answer
    topic_code: "4.8"
    source: "IM Algebra 1, Unit 4, Lesson 8"
    points: 3
    prompt: |
      A bathtub is empty at t = 0. The tap runs for 6 minutes, filling it to 150 litres. Someone then gets in, raising the level instantly to 180 litres, and bathes for 20 minutes. They get out (level drops back to 150) and pull the plug, and the tub drains in 5 minutes.

      (a) List the key points (t, volume) on the graph of water volume against time, noting where the graph jumps.
      (b) Compare the steepness of the filling segment and the draining segment, with rates.
      (c) Find the average rate of change of volume from t = 0 to t = 31 and explain the result.
    answer: |
      (a) (0, 0) rising to (6, 150); jump up to (6, 180); flat to (26, 180); jump down to (26, 150); falling to (31, 0).
      (b) Filling: 150/6 = 25 L/min. Draining: −150/5 = −30 L/min, so the draining segment is steeper (and falling).
      (c) (0 − 0)/31 = 0 L/min: the tub ends empty as it began, so the net change is zero despite all the activity.
    explanation: |
      Three points, one per part.

      (a) 1 pt: the five key points with both jumps identified.

      (b) 1 pt: 25 L/min and −30 L/min with the comparison.

      (c) 1 pt: 0 with the net-change explanation.

  - slug: alg1-u04-exam-q44
    type: short_answer
    topic_code: "4.12"
    source: "IM Algebra 1, Unit 4, Lesson 12"
    points: 3
    prompt: |
      A city's water bill is $20 for the first 10 kilolitres (kL) or less, plus $3 per kL for usage above 10 kL up to 30 kL, plus $5 per kL for usage above 30 kL. W(u) is the bill for u kL.

      (a) Write W as a piecewise function with three pieces.
      (b) Evaluate W(10), W(25) and W(40).
      (c) For what usage is the bill exactly $71?
    answer: |
      (a) W(u) = 20 for 0 ≤ u ≤ 10; W(u) = 20 + 3(u − 10) for 10 < u ≤ 30; W(u) = 80 + 5(u − 30) for u > 30 (since the bill at 30 kL is 20 + 60 = 80).
      (b) W(10) = 20; W(25) = 20 + 45 = 65; W(40) = 80 + 50 = 130.
      (c) 71 lies between 20 and 80, so use the middle piece: 20 + 3(u − 10) = 71 gives u − 10 = 17, u = 27 kL.
    explanation: |
      Three points, one per part.

      (a) 1 pt: three pieces with correct boundaries and the third piece starting from 80.

      (b) 1 pt: 20, 65 and 130.

      (c) 1 pt: 27 kL, with the middle piece identified.

  - slug: alg1-u04-exam-q45
    type: long_answer
    topic_code: "4.18"
    source: "IM Algebra 1, Unit 4, Lesson 18"
    points: 6
    prompt: |
      A drone's battery reads 100% at take-off and 70% after 12 minutes of flight. The drone must land with at least 10% remaining.

      (1) Write a linear model P(t) for the percentage after t minutes, state the rate with units, and give the domain of the model for a flight that respects the 10% rule.
      (2) Find the inverse of P and explain what question it answers for the pilot.
      (3) Use the inverse to find the latest time the drone may still be flying, and the time at which the model predicts 50%.
      (4) A second reading at 20 minutes shows 44%. Compute the model's prediction, find the difference, and explain what the pilot should conclude and do about the model.
    answer: |
      (1) Rate (70 − 100)/12 = −2.5 percentage points per minute. P(t) = 100 − 2.5t. The drone must land by the time P = 10: 100 − 2.5t = 10 gives t = 36, so the domain is 0 ≤ t ≤ 36.
      (2) t = (100 − P)/2.5. It tells the pilot at what minute the battery will show a given percentage.
      (3) Latest flying time: (100 − 10)/2.5 = 36 minutes. 50%: (100 − 50)/2.5 = 20 minutes.
      (4) Prediction at t = 20: 100 − 50 = 50%. Actual 44%, which is 6 points below the prediction, so the battery is draining faster than 2.5 points per minute (about 3.25 per minute between 12 and 20 minutes). The pilot should treat the 36-minute limit as too generous, land earlier (with the faster rate, 10% arrives at about 12 + (70 − 10)/3.25 ≈ 30.5 minutes), and update the model, for example with a piecewise rule or a refit using all three readings.
    explanation: |
      Six points.

      (1) 2 pts: 1 for the model and rate with units, 1 for the domain 0 to 36 from the 10% rule.

      (2) 1 pt: the inverse with its interpretation.

      (3) 1 pt: 36 minutes and 20 minutes.

      (4) 2 pts: 1 for the prediction 50% and the 6-point shortfall, 1 for concluding the drain sped up and proposing an earlier landing and a revised model.

      Common errors: rate 30 per minute; domain to 40 minutes (ignoring the 10% reserve); inverse written as a reciprocal.
