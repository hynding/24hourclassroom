        A gym charges a $50 joining fee plus $30 per month.

        (a) Write an equation for the total cost C after m months, and rewrite it in function notation as C(m).
        (b) Find C(12) and say what it means.
        (c) After how many months does the total reach $410? Show your solving.
      answer: |
        (a) C = 50 + 30m; C(m) = 30m + 50.
        (b) C(12) = 360 + 50 = 410: a year of membership costs $410 in total.
        (c) 30m + 50 = 410 gives 30m = 360, so m = 12 months.
