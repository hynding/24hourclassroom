    - slug: alg1-u04-w15-q25
      type: long_answer
      topic_code: "4.5"
      source: "IM Algebra 1, Unit 4, Lesson 5"
      points: 6
      prompt: |
        A streaming service offers two plans. Plan A costs $8 a month plus $2 per movie rented. Plan B costs $20 a month with unlimited movies.

        (1) Write rules A(n) and B(n) for the monthly cost of each plan when n movies are rented.
        (2) Find A(3), A(6) and B(6), and interpret A(6).
        (3) Solve A(n) = B(n) and explain what the solution means for a customer.
        (4) A customer has a budget of $14 a month. Use the rules to find how many movies she can rent on each plan, and recommend a plan for someone who rents about 4 movies a month.
      answer: |
        (1) A(n) = 2n + 8; B(n) = 20.
        (2) A(3) = 14; A(6) = 20; B(6) = 20. A(6) = 20 means six rentals on plan A cost $20 for the month.
        (3) 2n + 8 = 20 gives n = 6. At six movies the plans cost the same; below six, plan A is cheaper, above six, plan B is cheaper.
        (4) Plan A: 2n + 8 ≤ 14 gives n ≤ 3, so at most 3 movies. Plan B costs $20, which is over budget, so 0 movies on plan B within $14. For about 4 movies a month, plan A costs A(4) = 16, less than plan B's 20, so plan A is recommended.
      explanation: |
        Six points.

        (1) 1 pt: both rules, with B a constant function.

        (2) 2 pts: 1 for the three values, 1 for interpreting A(6) in context.

        (3) 1 pt: n = 6 with the break-even interpretation.

        (4) 2 pts: 1 for n ≤ 3 on plan A and plan B being over budget, 1 for recommending plan A with A(4) = 16 versus 20.

        Common errors: writing A(n) = 8n + 2; treating B as 20n; solving the budget as an equation and reporting 3 as the only possibility rather than at most 3.
