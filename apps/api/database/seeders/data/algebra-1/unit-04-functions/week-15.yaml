week: 15
unit: 4
title: "Functions and Function Notation"
topics: ["4.1", "4.2", "4.3", "4.4", "4.5"]
guide: guides/week-15.md
guide_description: |
  What makes a relationship a function, describing and sketching graphs of situations, reading and writing
  function notation, interpreting statements such as f(2) = 15 in context, writing rules from descriptions,
  tables and graphs, and evaluating a rule or solving it for the input.
flashcards_description: |
  28 cards on the definition of a function, inputs and outputs, the vertical line test, f(x) notation and
  what f(a) = b says, interpreting statements and inequalities in context, writing rules, and the difference
  between evaluating and solving.

flashcards:
  - front: Function → definition
    back: |
      A rule that assigns exactly one output to each input. Two inputs may share an output, but one input can never have two outputs.
    topic_code: "4.1"
  - front: Input and output → which is which
    back: |
      The input (independent variable) is the quantity you choose or that comes first; the output (dependent variable) is determined by it. Inputs go on the horizontal axis.
    topic_code: "4.1"
  - front: Is temperature a function of time of day?
    back: |
      Yes: at any one moment there is exactly one temperature. Time is not a function of temperature, because the same temperature can occur at several times.
    topic_code: "4.1"
  - front: Vertical line test
    back: |
      A graph shows a function of x if no vertical line crosses it more than once; a double crossing would mean one input with two outputs.
    topic_code: "4.1"
  - front: Describing the graph of filling, resting, then draining a bath
    back: |
      Depth rises steadily, stays level (a horizontal segment), then falls steeply to zero. Depth is a function of time.
    topic_code: "4.1"
  - front: Graph of a thrown ball's height against time → shape
    back: |
      A smooth arch: rising, slowing, peaking, then falling. Height is a function of time, but time is not a function of height since most heights occur twice.
    topic_code: "4.1"
  - front: Two inputs with the same output → still a function?
    back: |
      Yes. A function only forbids one input having two outputs. A horizontal line y = 3 is a function even though every input gives 3.
    topic_code: "4.1"
  - front: Function notation f(x) → how to read it
    back: |
      "f of x", the output of the function f when the input is x. It is not f multiplied by x.
    topic_code: "4.2"
  - front: f(a) = b → what it says
    back: |
      The input a produces the output b. On the graph of f, the point (a, b) lies on the curve.
    topic_code: "4.2"
  - front: C(4) = 50 where C(x) is the cost of x tickets → in words
    back: |
      Four tickets cost $50. The input 4 is a number of tickets; the output 50 is dollars.
    topic_code: "4.2"
  - front: Reading f(3) from a table
    back: |
      Find the row where the input is 3 and read the output in that row. If the row shows 3 and 11, then f(3) = 11.
    topic_code: "4.2"
  - front: Reading f(3) from a graph
    back: |
      Go to x = 3 on the horizontal axis, move vertically to the graph, and read the height. The point (3, f(3)) is on the graph.
    topic_code: "4.2"
  - front: Naming a function → choosing the letter
    back: |
      Any letter works; pick one that suggests the output, such as C for cost or h for height, and name the input in the parentheses, as in h(t).
    topic_code: "4.2"
  - front: T(6) = T(18) → meaning if T(h) is temperature at hour h
    back: |
      The temperature at 6 o'clock equalled the temperature at 18 o'clock. The statement does not say what that temperature was.
    topic_code: "4.3"
  - front: T(12) > T(6) → meaning
    back: |
      It was warmer at noon than at 6 o'clock. Comparing outputs compares the quantity the function measures.
    topic_code: "4.3"
  - front: The instruction to solve P(t) = 30 → what is being asked
    back: |
      Find every input t for which the output is 30. There may be one, several or no such inputs; a graph shows them where the curve meets the height 30.
    topic_code: "4.3"
  - front: Evaluating versus solving in function notation
    back: |
      f(10) asks for the output at input 10 (evaluate). f(x) = 10 asks for the input(s) that give output 10 (solve).
    topic_code: "4.3"
  - front: Point (40, 0) on the graph of d(t), distance from home → interpretation
    back: |
      d(40) = 0: at 40 minutes the distance from home is 0, so the walker is back home.
    topic_code: "4.3"
  - front: Writing "two hours after opening there were 15 people" in notation
    back: |
      P(2) = 15, where P(t) is the number of people t hours after opening.
    topic_code: "4.3"
  - front: Rule for a taxi charging $3 plus $2.50 per mile
    back: |
      f(m) = 2.5m + 3, with m miles and the output in dollars. The fixed charge is the constant; the per-mile rate multiplies m.
    topic_code: "4.4"
  - front: Rule for dollars left from $200 after n books at $12
    back: |
      L(n) = 200 − 12n. The starting amount is the constant and each book removes 12.
    topic_code: "4.4"
  - front: Rule from the table 1 → 7, 2 → 10, 3 → 13, 4 → 16
    back: |
      Outputs rise by 3 per step, so the rate is 3; stepping back to input 0 gives 4. g(x) = 3x + 4.
    topic_code: "4.4"
  - front: Rule for the perimeter and the area of a square of side s
    back: |
      P(s) = 4s and A(s) = s². The area rule is not linear: A(7) = 49, and A(s) = 144 gives s = 12.
    topic_code: "4.4"
  - front: Checking a rule against a table
    back: |
      Substitute each input and confirm the rule returns the listed output. One mismatch means the rule is wrong for that table.
    topic_code: "4.4"
  - front: Finding an input from an output with a rule
    back: |
      Set the rule equal to the target output and solve. For f(m) = 2.5m + 3 and output 28, 2.5m + 3 = 28 gives m = 10.
    topic_code: "4.5"
  - front: h(t) = 40t − 5t² → h(2) and when h(t) = 0
    back: |
      h(2) = 80 − 20 = 60. h(t) = 0 when 40t − 5t² = 5t(8 − t) = 0, so t = 0 or t = 8: the launch and the landing.
    topic_code: "4.5"
  - front: Using technology with a rule
    back: |
      Enter the rule in a graphing tool; a table feature lists outputs for a run of inputs, and tracing or an intersection with y = k finds inputs that give output k.
    topic_code: "4.5"
  - front: Phone plan $20 a month plus $0.10 per text → rule, C(150), and the texts for $35
    back: |
      C(t) = 20 + 0.1t; C(150) = 35; solving 20 + 0.1t = 35 gives t = 150 texts.
    topic_code: "4.5"

quiz:
  description: |
    25 questions · about 45 minutes · functions and situations, function notation, interpreting statements
    in context, and writing and using rules (lessons 4.1 to 4.5), with review of linear models and
    correlation from unit 3, equations and inequalities from unit 2, and statistics from unit 1. Multiple
    choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: bicycles at a rental station (4.2, 4.3)
    - slug: alg1-u04-w15-q01
      type: multiple_choice
      topic_code: "4.2"
      source: "IM Algebra 1, Unit 4, Lesson 2"
      points: 1
      stimulus: |
        The function B gives the number of bicycles available at a rental station t hours after 8 a.m.

        | t (hours) | 0 | 1 | 2 | 3 | 4 | 5 | 6 |
        |---|---|---|---|---|---|---|---|
        | B(t) | 20 | 16 | 11 | 11 | 8 | 14 | 20 |
      prompt: |
        What is B(2)?
      options:
        - "11"
        - "2"
        - "16"
        - "22"
      option_explanations:
        - |
          Correct. The input t = 2 is in the column showing 11 bicycles.
        - |
          2 is the input, the number of hours; B(2) asks for the output in that column.
        - |
          16 is B(1), the number of bicycles one hour after opening.
        - |
          22 would be 11 × 2, treating the notation as multiplication, which it is not.
      answer: 0

    - slug: alg1-u04-w15-q02
      type: multiple_choice
      topic_code: "4.3"
      source: "IM Algebra 1, Unit 4, Lesson 3"
      points: 1
      stimulus: |
        The function B gives the number of bicycles available at a rental station t hours after 8 a.m.

        | t (hours) | 0 | 1 | 2 | 3 | 4 | 5 | 6 |
        |---|---|---|---|---|---|---|---|
        | B(t) | 20 | 16 | 11 | 11 | 8 | 14 | 20 |
      prompt: |
        Which values of t solve the equation B(t) = 11?
      options:
        - "t = 11"
        - "t = 2 and t = 3"
        - "t = 2 only"
        - "There is no solution, because a function cannot repeat an output."
      option_explanations:
        - |
          11 is the output being sought; the question asks for the inputs that produce it.
        - |
          Correct. The table shows 11 bicycles at both 2 hours and 3 hours, so both inputs solve the equation.
        - |
          t = 2 works, but t = 3 also gives 11, and solving means finding every input.
        - |
          A function may repeat an output for different inputs; it only cannot give two outputs for one input.
      answer: 1

    - slug: alg1-u04-w15-q03
      type: multiple_choice
      topic_code: "4.3"
      source: "IM Algebra 1, Unit 4, Lesson 3"
      points: 1
      stimulus: |
        The function B gives the number of bicycles available at a rental station t hours after 8 a.m.

        | t (hours) | 0 | 1 | 2 | 3 | 4 | 5 | 6 |
        |---|---|---|---|---|---|---|---|
        | B(t) | 20 | 16 | 11 | 11 | 8 | 14 | 20 |
      prompt: |
        What does the statement B(0) = B(6) mean in this situation?
      options:
        - "No bicycles were rented all day."
        - "The station had the same number of bicycles at 8 a.m. and at 2 p.m."
        - "Zero bicycles were available at 6 hours."
        - "The station was open for 6 hours."
      option_explanations:
        - |
          Bicycles clearly came and went during the day (the count fell to 8); only the two end values match.
        - |
          Correct. Both outputs are 20: the count at t = 0 (8 a.m.) equals the count at t = 6 (2 p.m.).
        - |
          B(6) = 20, not 0; the 0 in the statement is an input, not an output.
        - |
          The statement compares two outputs; it says nothing about opening hours.
      answer: 1

    - slug: alg1-u04-w15-q04
      type: multiple_choice
      topic_code: "4.3"
      source: "IM Algebra 1, Unit 4, Lesson 3"
      points: 1
      stimulus: |
        The function B gives the number of bicycles available at a rental station t hours after 8 a.m.

        | t (hours) | 0 | 1 | 2 | 3 | 4 | 5 | 6 |
        |---|---|---|---|---|---|---|---|
        | B(t) | 20 | 16 | 11 | 11 | 8 | 14 | 20 |
      prompt: |
        Which statement is true according to the table?
      options:
        - "B(4) > B(5)"
        - "B(5) < B(1)"
        - "B(5) < B(4)"
        - "B(3) > B(1)"
      option_explanations:
        - |
          B(4) = 8 and B(5) = 14, so B(4) is less than B(5), not greater.
        - |
          Correct. B(5) = 14 and B(1) = 16, so there were fewer bicycles at 1 p.m. than at 9 a.m.
        - |
          B(5) = 14 and B(4) = 8, so B(5) is greater, not less.
        - |
          B(3) = 11 and B(1) = 16, so B(3) is less, not greater.
      answer: 1

    # ---- Multiple choice (4.1–4.5)
    - slug: alg1-u04-w15-q05
      type: multiple_choice
      topic_code: "4.1"
      source: "IM Algebra 1, Unit 4, Lesson 1"
      points: 1
      prompt: |
        Which relationship is a function?
      options:
        - "The output is a student in the class; the input is the student's height."
        - "The output is the price of a postage stamp; the input is the year."
        - "The output is a time of day; the input is the temperature on that day."
        - "The output is a person's sibling; the input is the person."
      option_explanations:
        - |
          Several students can share a height, so one input would have more than one output.
        - |
          Correct. Each year has exactly one stamp price, even though many years share a price.
        - |
          The same temperature can occur at several times in a day, so an input could have many outputs.
        - |
          A person may have several siblings, giving one input more than one output.
      answer: 1

    - slug: alg1-u04-w15-q06
      type: multiple_choice
      topic_code: "4.1"
      source: "IM Algebra 1, Unit 4, Lesson 1"
      points: 1
      prompt: |
        A pool is filled for 2 hours, left full for 5 hours, then drained in 1 hour. Which describes the graph of water depth against time?
      options:
        - "Rises steadily, stays level, then falls steeply to zero."
        - "Rises steadily the whole time."
        - "Falls, stays level, then rises."
        - "Rises steeply, falls slowly, then stays level."
      option_explanations:
        - |
          Correct. Filling raises the depth, resting keeps it constant (a horizontal segment), and a quick drain drops it to zero.
        - |
          The depth cannot keep rising while the pool rests and then drains.
        - |
          Filling comes first, so the graph begins by rising, not falling.
        - |
          The level stretch comes in the middle, and the drain at the end is fast, not slow.
      answer: 0

    - slug: alg1-u04-w15-q07
      type: multiple_choice
      topic_code: "4.2"
      source: "IM Algebra 1, Unit 4, Lesson 2"
      points: 1
      prompt: |
        If f(x) = 4x + 1, what is f(3)?
      options:
        - "13"
        - "12"
        - "4x + 4"
        - "7"
      option_explanations:
        - |
          Correct. Substitute 3 for x: 4(3) + 1 = 13.
        - |
          12 is 4 × 3 alone; the rule also adds 1, giving 13.
        - |
          f(3) is a number, the output at input 3, not an expression in x.
        - |
          7 would be 4 + 3, which adds instead of multiplying by 4.
      answer: 0

    - slug: alg1-u04-w15-q08
      type: multiple_choice
      topic_code: "4.4"
      source: "IM Algebra 1, Unit 4, Lesson 4"
      points: 1
      prompt: |
        A ride-share charges $4 to start plus $1.75 per mile. Which rule gives the fare F in dollars for m miles?
      options:
        - "F(m) = 4m + 1.75"
        - "F(m) = 1.75m + 4"
        - "F(m) = 5.75m"
        - "F(m) = 4 + 1.75"
      option_explanations:
        - |
          This charges $4 per mile and a $1.75 starting fee, the reverse of the situation.
        - |
          Correct. The starting charge is the constant and the per-mile rate multiplies the miles.
        - |
          Adding the two numbers and multiplying by m charges the start fee on every mile.
        - |
          This gives the same fare, $5.75, no matter how far the ride is.
      answer: 1

    - slug: alg1-u04-w15-q09
      type: multiple_choice
      topic_code: "4.4"
      source: "IM Algebra 1, Unit 4, Lesson 4"
      points: 1
      prompt: |
        A table gives g(1) = 7, g(2) = 10, g(3) = 13 and g(4) = 16. Which rule matches the table?
      options:
        - "g(x) = 7x"
        - "g(x) = x + 6"
        - "g(x) = 3x + 4"
        - "g(x) = 4x + 3"
      option_explanations:
        - |
          g(2) would be 14, not 10, so this rule fails after the first row.
        - |
          g(2) would be 8, not 10; the outputs rise by 3 per step, not by 1.
        - |
          Correct. Each step adds 3, and 3(1) + 4 = 7, 3(2) + 4 = 10, 3(3) + 4 = 13, 3(4) + 4 = 16.
        - |
          4(1) + 3 = 7 works, but 4(2) + 3 = 11, not 10.
      answer: 2

    - slug: alg1-u04-w15-q10
      type: multiple_choice
      topic_code: "4.5"
      source: "IM Algebra 1, Unit 4, Lesson 5"
      points: 1
      prompt: |
        A taxi's fare is f(m) = 2.5m + 3 dollars for m miles. For which distance is the fare $28?
      options:
        - "10 miles"
        - "73 miles"
        - "11.2 miles"
        - "12.4 miles"
      option_explanations:
        - |
          Correct. 2.5m + 3 = 28 gives 2.5m = 25, so m = 10.
        - |
          73 is f(28), the fare for 28 miles, which evaluates instead of solving.
        - |
          11.2 is 28 ÷ 2.5, which forgets to subtract the $3 starting charge first.
        - |
          12.4 is (28 + 3) ÷ 2.5, which adds the starting charge instead of subtracting it.
      answer: 0

    - slug: alg1-u04-w15-q11
      type: multiple_choice
      topic_code: "4.5"
      source: "IM Algebra 1, Unit 4, Lesson 5"
      points: 1
      prompt: |
        The height in metres of a ball t seconds after launch is h(t) = 40t − 5t². What is h(2)?
      options:
        - "60"
        - "70"
        - "80"
        - "30"
      option_explanations:
        - |
          Correct. 40(2) − 5(2²) = 80 − 20 = 60 metres.
        - |
          70 subtracts 5 × 2 = 10 instead of 5 × 2² = 20.
        - |
          80 is 40 × 2 without subtracting the 5t² term.
        - |
          30 would come from 40(2) − 5(2)² computed as 80 − 50, misreading 5t² as 5 × 10.
      answer: 0

    - slug: alg1-u04-w15-q12
      type: multiple_choice
      topic_code: "3.4"
      source: "IM Algebra 1, Unit 3, Lesson 4"
      points: 1
      prompt: |
        A plumber's charge in dollars for a job lasting x hours is modelled by f(x) = 45x + 60. What does the 60 represent?
      options:
        - "The charge for each hour of work"
        - "A fixed call-out charge, paid even for a job of 0 hours"
        - "The number of hours in a typical job"
        - "The total charge for a 1-hour job"
      option_explanations:
        - |
          The hourly rate is the slope, 45 dollars per hour.
        - |
          Correct. The constant term is the output at x = 0, a charge that does not depend on the hours worked.
        - |
          The model's constants are dollars, not hours.
        - |
          A 1-hour job costs 45 + 60 = 105 dollars, which includes the hourly charge.
      answer: 1

    - slug: alg1-u04-w15-q13
      type: multiple_choice
      topic_code: "2.4"
      source: "IM Algebra 1, Unit 2, Lesson 4"
      points: 1
      prompt: |
        Which value of x is a solution of 4x − 7 = 13?
      options:
        - "1.5"
        - "5"
        - "20"
        - "6"
      option_explanations:
        - |
          4(1.5) − 7 = −1, not 13; 1.5 is (13 − 7) ÷ 4, a sign error.
        - |
          Correct. 4(5) − 7 = 20 − 7 = 13, so 5 makes the equation true.
        - |
          20 is 13 + 7, the value of 4x, before dividing by 4.
        - |
          Substituting 6 gives 4(6) − 7 = 17, which is not 13.
      answer: 1

    # ---- Select-all (4.1, 2.19)
    - slug: alg1-u04-w15-q14
      type: multi_select
      topic_code: "4.1"
      source: "IM Algebra 1, Unit 4, Lesson 1"
      points: 2
      partial_credit: true
      prompt: |
        Which of these describe y as a function of x? Select all that apply.
      options:
        - "x is a person's age in whole years; y is the number of candles on their last birthday cake."
        - "x is the area of a square; y is its side length."
        - "x is a date; y is the closing price of a share on that date."
        - "x is a side length of a rectangle; y is its area."
        - "x is a day of the week; y is a student who has a birthday on that day."
      option_explanations:
        - |
          Correct. Each age gives exactly one number of candles.
        - |
          Correct. A given area determines one (positive) side length, the square root of the area.
        - |
          Correct. Each trading date has one closing price.
        - |
          A rectangle of a given side can have any width, so the area is not determined by one side.
        - |
          Many students may share a birthday weekday, so one input can have many outputs.
      answer: [0, 1, 2]

    - slug: alg1-u04-w15-q15
      type: multi_select
      topic_code: "2.19"
      source: "IM Algebra 1, Unit 2, Lesson 19"
      points: 2
      partial_credit: true
      prompt: |
        Which numbers are solutions of −2x + 5 ≥ 1? Select all that apply.
      options:
        - "2"
        - "3"
        - "0"
        - "−4"
        - "2.5"
      option_explanations:
        - |
          Correct. −2(2) + 5 = 1, and 1 ≥ 1 is true because the inequality includes equality.
        - |
          −2(3) + 5 = −1, and −1 ≥ 1 is false; the solutions are x ≤ 2.
        - |
          Correct. −2(0) + 5 = 5, and 5 ≥ 1 is true.
        - |
          Correct. −2(−4) + 5 = 13, and 13 ≥ 1 is true.
        - |
          −2(2.5) + 5 = 0, and 0 ≥ 1 is false, so 2.5 is not a solution.
      answer: [0, 2, 3]

    # ---- True/false (4.2, 3.9)
    - slug: alg1-u04-w15-q16
      type: true_false
      topic_code: "4.2"
      source: "IM Algebra 1, Unit 4, Lesson 2"
      points: 1
      prompt: |
        True or false: in function notation, f(5) means the function f multiplied by 5.
      answer: false
      explanation: |
        False. f(5) is the output of f when the input is 5. The parentheses enclose the input; no multiplication is involved.

    - slug: alg1-u04-w15-q17
      type: true_false
      topic_code: "3.9"
      source: "IM Algebra 1, Unit 3, Lesson 9"
      points: 1
      prompt: |
        True or false: a strong correlation between two variables is enough to conclude that one of them causes the other.
      answer: false
      explanation: |
        False. A lurking variable, a reversed direction of cause or coincidence can all produce a strong correlation. Only an experiment with random assignment supports a causal claim.

    # ---- Fill in the blank (4.3, 1.12)
    - slug: alg1-u04-w15-q18
      type: fill_blank
      topic_code: "4.3"
      source: "IM Algebra 1, Unit 4, Lesson 3"
      points: 1
      prompt: |
        If f(4) = 9, then the point (4, ____) lies on the graph of f.
      answer: ["9"]
      explanation: |
        f(a) = b corresponds to the point (a, b): the input is the x-coordinate and the output is the y-coordinate.

    - slug: alg1-u04-w15-q19
      type: fill_blank
      topic_code: "1.12"
      source: "IM Algebra 1, Unit 1, Lesson 12"
      points: 1
      prompt: |
        The ____ deviation of a data set measures the typical distance of the values from the mean, using squared deviations.
      answer: ["standard"]
      explanation: |
        The standard deviation squares each deviation from the mean, averages them, and takes the square root; it is the companion of the mean, as the IQR is of the median.

    # ---- Numeric (4.5, 4.4, 3.6)
    - slug: alg1-u04-w15-q20
      type: numeric
      topic_code: "4.5"
      source: "IM Algebra 1, Unit 4, Lesson 5"
      points: 1
      prompt: |
        If g(x) = 3x + 4, for what value of x is g(x) = 31?
      answer: { value: 9, tolerance: 0 }
      explanation: |
        3x + 4 = 31 gives 3x = 27, so x = 9.

    - slug: alg1-u04-w15-q21
      type: numeric
      topic_code: "4.4"
      source: "IM Algebra 1, Unit 4, Lesson 4"
      points: 1
      prompt: |
        The perimeter of a square of side s is P(s) = 4s. What is P(7.5)?
      answer: { value: 30, tolerance: 0 }
      explanation: |
        4 × 7.5 = 30.

    - slug: alg1-u04-w15-q22
      type: numeric
      topic_code: "3.6"
      source: "IM Algebra 1, Unit 3, Lesson 6"
      points: 1
      prompt: |
        A linear model is f(x) = 2x + 1. What is the residual for the data point (4, 12)?
      answer: { value: 3, tolerance: 0 }
      explanation: |
        Predicted f(4) = 9; residual = actual − predicted = 12 − 9 = 3.

    # ---- Short answer (4.3, 2.2)
    - slug: alg1-u04-w15-q23
      type: short_answer
      topic_code: "4.3"
      source: "IM Algebra 1, Unit 4, Lesson 3"
      points: 3
      prompt: |
        The function W gives the number of people waiting at a bus stop t minutes after 7:00 a.m.

        (a) Write in function notation: "at 7:10 there were 12 people waiting."
        (b) Explain in words what W(25) = 0 means.
        (c) What question does the equation W(t) = 8 ask? How many answers might it have?
      answer: |
        (a) W(10) = 12.
