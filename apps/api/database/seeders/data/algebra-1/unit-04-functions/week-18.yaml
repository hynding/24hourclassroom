        Three points, one per part.

        (a) 1 pt: 2.5 and 3 with an interpretation as distance from the setting.

        (b) 1 pt: vertex (21, 0) and decreasing for T < 21.

        (c) 1 pt: T < 19.5 or T > 22.5 (both pieces required).

