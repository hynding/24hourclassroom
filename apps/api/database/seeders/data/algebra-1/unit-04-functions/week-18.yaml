        A thermostat is set to 21 °C. The function D(T) = |T − 21| gives how far the room temperature T is from the setting.

        (a) Find D(18.5) and D(24) and interpret one of them.
        (b) Give the vertex of the graph of D and the interval on which D is decreasing.
        (c) The heating switches on whenever D(T) > 1.5. For which temperatures is the heating on? Express the answer without absolute value.
