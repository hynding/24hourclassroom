    - slug: alg1-u04-w18-q25
      type: long_answer
      topic_code: "4.18"
      source: "IM Algebra 1, Unit 4, Lesson 18"
      points: 6
      prompt: |
        An electric scooter's battery reads 96% at 7:00 and 72% at 9:00 while being ridden.

        (1) Assuming a steady drain, write a linear model S(t) for the percentage t hours after 7:00, and state its domain and range.
        (2) Find the inverse of S and explain what it tells the rider.
        (3) Use the model or its inverse to find when the battery reaches 30%, and when it is empty.
        (4) At 12:00 the actual reading is 24%, not what the model predicts. Compute the model's prediction for 12:00, compare it with 24%, say what this means about the drain after 9:00, and propose how to improve the model.
      answer: |
        (1) Rate (72 − 96)/2 = −12 points per hour: S(t) = 96 − 12t. Empty at t = 8, so domain 0 ≤ t ≤ 8 and range 0 ≤ S ≤ 96.
        (2) t = (96 − S)/12: for any battery percentage, it gives the number of hours after 7:00 at which the scooter will show that percentage.
        (3) 30%: t = (96 − 30)/12 = 5.5, so 12:30. Empty: t = 8, so 15:00.
        (4) At 12:00, t = 5 and S(5) = 36%. The actual 24% is 12 points lower, so the battery drained faster than 12 points per hour after 9:00 (24 points lower over 3 hours would be 48/3 = 16 points per hour from 9:00 to 12:00, perhaps from faster riding or hills). Improve the model with a piecewise rule: S(t) = 96 − 12t for 0 ≤ t ≤ 2 and S(t) = 72 − 16(t − 2) for t > 2, or refit a line using all three readings and check it against future readings.
      explanation: |
        Six points.

        (1) 2 pts: 1 for S(t) = 96 − 12t, 1 for domain 0 to 8 and range 0 to 96.

        (2) 1 pt: the inverse with an interpretation.

        (3) 1 pt: 12:30 and 15:00.

        (4) 2 pts: 1 for the prediction 36% and the conclusion that the drain sped up, 1 for a sensible improvement (piecewise model or refit with all data).

        Common errors: using 24 as the hourly rate; giving the domain as all real numbers; computing the inverse as 1/S.
