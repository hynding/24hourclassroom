week: 16
unit: 4
title: "Features of Graphs and Average Rate of Change"
topics: ["4.6", "4.7", "4.8", "4.9"]
guide: guides/week-16.md
guide_description: |
  Reading intercepts, maximums, minimums and increasing, decreasing and constant intervals from a graph and
  interpreting them in context, computing and interpreting the average rate of change between two inputs,
  interpreting and sketching graphs of situations, and comparing functions given in different forms.
flashcards_description: |
  28 cards on vertical and horizontal intercepts, maximum and minimum values and where they occur, intervals
  of increase and decrease, the average rate of change formula and its meaning, reading and drawing graphs
  of stories, and comparing two functions on their features and rates.

flashcards:
  - front: Vertical intercept of a graph → meaning
    back: |
      The output when the input is 0, written f(0); the point where the graph meets the vertical axis. In a story it is the starting value.
    topic_code: "4.6"
  - front: Horizontal intercept (zero) of a function → meaning
    back: |
      An input where the output is 0; the graph meets the horizontal axis there. Zeros are the solutions of f(x) = 0.
    topic_code: "4.6"
  - front: Maximum of a function → value versus location
    back: |
      The maximum is the largest output; it occurs at some input. "Maximum 60 m at t = 4" has value 60 and location 4. Answer whichever the question asks.
    topic_code: "4.6"
  - front: Minimum of a function → meaning
    back: |
      The smallest output the function takes; on a graph, the lowest point. A profit graph's minimum is the worst loss.
    topic_code: "4.6"
  - front: Increasing on an interval → definition
    back: |
      As the input moves to the right through the interval, the output gets larger; the graph rises. Intervals are described by inputs, such as 0 < t < 4.
    topic_code: "4.6"
  - front: Decreasing on an interval → definition
    back: |
      As the input moves to the right, the output gets smaller; the graph falls.
    topic_code: "4.6"
  - front: Constant on an interval → what the graph shows
    back: |
      A horizontal segment: the output does not change. For a height graph, the object is holding still at that height.
    topic_code: "4.6"
  - front: Drone flight graph → zeros at t = 0 and t = 12 mean
    back: |
      The drone is on the ground at launch (t = 0) and at landing (t = 12). h(t) = 0 at both inputs.
    topic_code: "4.6"
  - front: Profit graph crossing the horizontal axis → meaning
    back: |
      The company broke even at that month: profit was 0. Between two such crossings the profit has one sign, positive if the graph is above the axis.
    topic_code: "4.6"
  - front: Where is f positive on its graph?
    back: |
      Wherever the graph lies above the horizontal axis. Report the interval of inputs, for example 2 < x < 8, not the outputs.
    topic_code: "4.6"
  - front: Average rate of change from a to b → formula
    back: |
      (f(b) − f(a)) ÷ (b − a): the change in output divided by the change in input. It is the slope of the segment joining (a, f(a)) and (b, f(b)).
    topic_code: "4.7"
  - front: Average rate of change of a linear function
    back: |
      Equal to the slope over every interval. For f(x) = 3x + 1 the average rate of change from 2 to 10 is (31 − 7)/8 = 3.
    topic_code: "4.7"
  - front: Average rate of change of a curve → does the interval matter?
    back: |
      Yes. For g(x) = x², from 1 to 3 the rate is 4 and from 3 to 5 it is 8; the curve steepens, so different intervals give different rates.
    topic_code: "4.7"
  - front: Average rate of change over a whole round trip
    back: |
      Zero if the function returns to its starting value, because f(b) − f(a) = 0 even though the function changed in between.
    topic_code: "4.7"
  - front: Units of an average rate of change
    back: |
      Output units per input unit: metres per minute, people per year, dollars per month. Always state them.
    topic_code: "4.7"
  - front: Population 12,400 in 2000 and 15,600 in 2020 → average rate of change
    back: |
      (15,600 − 12,400)/(2020 − 2000) = 3,200/20 = 160 people per year.
    topic_code: "4.7"
  - front: Negative average rate of change → meaning
    back: |
      The output decreased over the interval on average; the segment joining the two points slopes down. The drone descending from 60 m to 20 m over 3 minutes has a rate of about −13.3 m per minute.
    topic_code: "4.7"
  - front: Average rate of change from a table
    back: |
      Pick the two rows, subtract the outputs, subtract the inputs, divide. f(1) = 5 and f(3) = 11 give (11 − 5)/(3 − 1) = 3.
    topic_code: "4.7"
  - front: Reading a story from a graph → the method
    back: |
      Move left to right and describe each piece: rising fast, rising slowly, flat, falling. Name what each piece means for the quantity on the vertical axis.
    topic_code: "4.8"
  - front: Drawing a graph from a story → the method
    back: |
      Mark the key points first (start, each turning point, end), then connect them with pieces of the right shape: steeper for faster change, flat for no change, curved for changing rates.
    topic_code: "4.8"
  - front: Walking to the library and jogging home → distance graph
    back: |
      Rises from (0, 0) to (20, 1.5), stays flat at 1.5 until t = 60, then falls steeply to (70, 0). The jog home is steeper than the walk because it covers the same distance in less time.
    topic_code: "4.8"
  - front: Cooling coffee → graph shape
    back: |
      Starts high, falls steeply at first, then more and more slowly, levelling off near room temperature without crossing it.
    topic_code: "4.8"
  - front: Filling a cone-shaped cup at a steady rate → height graph
    back: |
      Rises quickly at first while the narrow tip fills, then more slowly as the cup widens: an increasing curve that flattens.
    topic_code: "4.8"
  - front: A person who walks slowly → slope of the distance graph
    back: |
      A gentle positive slope, not a flat segment. Flat means stopped; slow means a small but non-zero rate.
    topic_code: "4.8"
  - front: Comparing two functions → what to compare
    back: |
      Starting values (vertical intercepts), maximums and when they occur, average rates of change over the same interval, and where the graphs cross (one overtakes the other).
    topic_code: "4.9"
  - front: Account A = 50 + 20m and account B with B(0) = 200, B(12) = 320 → comparison
    back: |
      A starts lower but grows 20 per month; B grows 120/12 = 10 per month. They are equal when 50 + 20m = 200 + 10m, m = 15; after that A is larger.
    topic_code: "4.9"
  - front: Comparing functions given in different forms
    back: |
      Convert what you need to a common form: evaluate the rule at the table's inputs, or read values off the graph, then compare the same feature in both.
    topic_code: "4.9"
  - front: Two runners' distance graphs → who is ahead, who finishes first
    back: |
      At a given time the higher graph is ahead. The graph that reaches the finishing distance at the smaller time finished first, even if it was behind early on.
    topic_code: "4.9"

quiz:
  description: |
    25 questions · about 45 minutes · features of graphs, average rate of change, interpreting and creating
    graphs, and comparing functions (lessons 4.6 to 4.9), with review of function notation and rules from
    week 15, slopes, systems and inequalities from unit 2, and earlier units. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the
    short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: drone flight (4.6, 4.7)
    - slug: alg1-u04-w16-q01
      type: multiple_choice
      topic_code: "4.6"
      source: "IM Algebra 1, Unit 4, Lesson 6"
      points: 1
      stimulus: |
        The graph of h(t), the height in metres of a drone t minutes after launch, starts at (0, 0), rises to a peak of 60 at t = 4, descends to 20 at t = 7, stays at 20 until t = 10, then descends to 0 at t = 12.
      prompt: |
        What is the maximum value of h, and when does it occur?
      options:
        - "Maximum 12, at t = 0"
        - "Maximum 60, at t = 4"
        - "Maximum 4, at t = 60"
        - "Maximum 20, at t = 7"
      option_explanations:
        - |
          12 is the landing time, an input where the output is 0.
        - |
          Correct. The highest output is 60 metres, reached when the input is t = 4 minutes.
        - |
          This swaps the input and the output; the height is 60 and the time is 4, not the reverse.
        - |
          20 metres is where the drone hovers, lower than the peak of 60.
      answer: 1

    - slug: alg1-u04-w16-q02
      type: multiple_choice
      topic_code: "4.6"
      source: "IM Algebra 1, Unit 4, Lesson 6"
      points: 1
      stimulus: |
        The graph of h(t), the height in metres of a drone t minutes after launch, starts at (0, 0), rises to a peak of 60 at t = 4, descends to 20 at t = 7, stays at 20 until t = 10, then descends to 0 at t = 12.
      prompt: |
        On which interval is h constant, and what is the drone doing there?
      options:
        - "7 < t < 10; hovering at 20 metres"
        - "0 < t < 4; climbing"
        - "10 < t < 12; landing"
        - "4 < t < 7; descending"
      option_explanations:
        - |
          Correct. The height stays at 20 metres between t = 7 and t = 10: a horizontal piece of the graph.
        - |
          From 0 to 4 the height rises from 0 to 60, so h is increasing, not constant.
        - |
          From 10 to 12 the height falls from 20 to 0, so h is decreasing.
        - |
          From 4 to 7 the height falls from 60 to 20, so h is decreasing.
      answer: 0

    - slug: alg1-u04-w16-q03
      type: multiple_choice
      topic_code: "4.7"
      source: "IM Algebra 1, Unit 4, Lesson 7"
      points: 1
      stimulus: |
        The graph of h(t), the height in metres of a drone t minutes after launch, starts at (0, 0), rises to a peak of 60 at t = 4, descends to 20 at t = 7, stays at 20 until t = 10, then descends to 0 at t = 12.
      prompt: |
        What is the average rate of change of h from t = 0 to t = 4?
      options:
        - "4 metres per minute"
        - "60 metres per minute"
        - "15 metres per minute"
        - "240 metres per minute"
      option_explanations:
        - |
          4 is the change in time; the rate divides the change in height by it.
        - |
          60 is the change in height alone, before dividing by the 4 minutes it took.
        - |
          Correct. (h(4) − h(0))/(4 − 0) = (60 − 0)/4 = 15 metres per minute.
        - |
          240 multiplies 60 by 4 instead of dividing.
      answer: 2

    - slug: alg1-u04-w16-q04
      type: multiple_choice
      topic_code: "4.7"
      source: "IM Algebra 1, Unit 4, Lesson 7"
      points: 1
      stimulus: |
        The graph of h(t), the height in metres of a drone t minutes after launch, starts at (0, 0), rises to a peak of 60 at t = 4, descends to 20 at t = 7, stays at 20 until t = 10, then descends to 0 at t = 12.
      prompt: |
        What is the average rate of change of h from t = 4 to t = 7?
      options:
        - "−40 metres per minute"
        - "About 13.3 metres per minute"
        - "0 metres per minute"
        - "About −13.3 metres per minute"
      option_explanations:
        - |
          −40 is the change in height; it must be divided by the 3 minutes of the interval.
        - |
          The height falls over this interval, so the rate must be negative.
        - |
          The rate is 0 only on the hovering interval 7 < t < 10, where the height does not change.
        - |
          Correct. (20 − 60)/(7 − 4) = −40/3 ≈ −13.3 metres per minute: the drone is descending.
      answer: 3

    # ---- Multiple choice (4.6–4.9)
    - slug: alg1-u04-w16-q05
      type: multiple_choice
      topic_code: "4.6"
      source: "IM Algebra 1, Unit 4, Lesson 6"
      points: 1
      prompt: |
        The graph of a company's monthly profit P(m), in thousands of dollars, crosses the horizontal axis at m = 3 and m = 9 and is above the axis in between. What do the crossings tell you?
      options:
        - "The company broke even (profit 0) in months 3 and 9, and made a profit between them."
        - "The company's maximum profit was in month 3 and its minimum in month 9."
        - "The company was open for 3 months and then for 9 months."
        - "The company earned $3,000 and $9,000 in those months."
      option_explanations:
        - |
          Correct. Zeros of P are months with zero profit, and the graph above the axis means positive profit between them.
        - |
          Crossings are where the output is 0, not where it is largest or smallest.
        - |
          The inputs are months into the year, not durations.
        - |
          A horizontal-axis crossing has output 0; the 3 and 9 are inputs (months), not dollar amounts.
      answer: 0

    - slug: alg1-u04-w16-q06
      type: multiple_choice
      topic_code: "4.6"
      source: "IM Algebra 1, Unit 4, Lesson 6"
      points: 1
      prompt: |
        The temperature T(h) in a greenhouse over a day has a minimum of 12 °C at h = 5 and a maximum of 31 °C at h = 15. On which interval is T increasing?
      options:
        - "12 < h < 31"
        - "5 < h < 15"
        - "15 < h < 24"
        - "0 < h < 5"
      option_explanations:
        - |
          12 and 31 are outputs (temperatures); intervals of increase are described by inputs (hours).
        - |
          Correct. From the minimum at h = 5 to the maximum at h = 15 the temperature rises.
        - |
          After the maximum the temperature is falling.
        - |
          Before the minimum the temperature is falling toward it.
      answer: 1

    - slug: alg1-u04-w16-q07
      type: multiple_choice
      topic_code: "4.7"
      source: "IM Algebra 1, Unit 4, Lesson 7"
      points: 1
      prompt: |
        A town's population was 12,400 in 2000 and 15,600 in 2020. What was the average rate of change of the population over that period?
      options:
        - "780 people per year"
        - "620 people per year"
        - "160 people per year"
        - "3,200 people per year"
      option_explanations:
        - |
          780 is 15,600 ÷ 20, dividing the final population rather than the change.
        - |
          620 is 12,400 ÷ 20, dividing the starting population rather than the change.
        - |
          Correct. (15,600 − 12,400)/(2020 − 2000) = 3,200/20 = 160 people per year.
        - |
          3,200 is the total change over 20 years, not the change per year.
      answer: 2

    - slug: alg1-u04-w16-q08
      type: multiple_choice
      topic_code: "4.8"
      source: "IM Algebra 1, Unit 4, Lesson 8"
      points: 1
      prompt: |
        Lin walks to a library 1.5 km away in 20 minutes, stays 40 minutes, then jogs home in 10 minutes. Which describes the graph of her distance from home against time?
      options:
        - "Rises steadily from 0 to 1.5 over the full 70 minutes."
        - "Rises to 1.5 by t = 20, falls to 0 by t = 60, then stays flat."
        - "Rises to 1.5 by t = 20, stays flat until t = 60, then falls to 0 by t = 70 less steeply than it rose."
        - "Rises to 1.5 by t = 20, stays flat until t = 60, then falls to 0 by t = 70 more steeply than it rose."
      option_explanations:
        - |
          Lin stops at the library and comes home, so the graph cannot rise the whole time.
        - |
          The flat segment is the 40 minutes in the library, which comes before the trip home, not after.
        - |
          The jog is faster than the walk, so the final segment must be steeper, not gentler.
        - |
          Correct. The jog covers the same 1.5 km in 10 minutes rather than 20, so the final segment is steeper.
      answer: 3

    - slug: alg1-u04-w16-q09
      type: multiple_choice
      topic_code: "4.8"
      source: "IM Algebra 1, Unit 4, Lesson 8"
      points: 1
      prompt: |
        A graph of a cup of tea's temperature starts at 90 °C, falls steeply at first, then more and more slowly, and levels off near 20 °C. Which interpretation is correct?
      options:
        - "The tea's temperature is a function of the room's temperature."
        - "The tea cools fastest when it is hottest and approaches room temperature without going below it."
        - "The tea cools at a constant rate until it freezes."
        - "The tea warms up after 20 minutes."
      option_explanations:
        - |
          The graph shows temperature against time; the room temperature is the level the graph approaches, not its input.
        - |
          Correct. The steep start is rapid cooling, the flattening shows slower cooling as the tea nears 20 °C, the room temperature.
        - |
          A constant rate would be a straight line, and the graph levels off near 20 °C, far above freezing.
        - |
          The graph never rises; levelling off is not warming.
      answer: 1

    - slug: alg1-u04-w16-q10
      type: multiple_choice
      topic_code: "4.9"
      source: "IM Algebra 1, Unit 4, Lesson 9"
      points: 1
      prompt: |
        Account A holds A(m) = 50 + 20m dollars after m months. Account B holds 200 dollars at m = 0 and 320 dollars at m = 12, growing at a steady rate. After how many months do the accounts hold the same amount?
      options:
        - "They are never equal."
        - "12 months"
        - "10 months"
        - "15 months"
      option_explanations:
        - |
          A grows faster than B, so A must eventually catch up and overtake it.
        - |
          At 12 months A holds 290 and B holds 320; A has not caught up.
        - |
          At 10 months A holds 250 and B holds 300, so they are not yet equal.
        - |
          Correct. B grows 120/12 = 10 per month, so B(m) = 200 + 10m; 50 + 20m = 200 + 10m gives m = 15.
      answer: 3

    - slug: alg1-u04-w16-q11
      type: multiple_choice
      topic_code: "4.9"
      source: "IM Algebra 1, Unit 4, Lesson 9"
      points: 1
      prompt: |
        Runner X runs 5 km at a steady pace and finishes in 25 minutes. Runner Y's distance graph starts steeper than X's, flattens later, and reaches 5 km at 28 minutes. Which statement is true?
      options:
        - "X was ahead the whole time."
        - "Both runners had the same average speed."
        - "Y was ahead after 5 minutes, but X finished first."
        - "Y finished first because Y started faster."
      option_explanations:
        - |
          Y's steeper early graph means Y was ahead at the start.
        - |
          Same distance in different times means different average speeds: X's is faster.
        - |
          Correct. A steeper start means Y had covered more distance early on; X reached 5 km at 25 minutes, before Y's 28.
        - |
          Finishing is decided by who reaches 5 km first, and X did at 25 minutes.
      answer: 2

    - slug: alg1-u04-w16-q12
      type: multiple_choice
      topic_code: "4.3"
      source: "IM Algebra 1, Unit 4, Lesson 3"
      points: 1
      prompt: |
        S(d) is the number of centimetres of snow on the ground d days after a storm. What does S(3) = 8 say?
      options:
        - "Eight centimetres of snow were on the ground 3 days after the storm."
        - "There were 24 cm of snow in total."
        - "Snow fell for 3 days at 8 cm per day."
        - "Three centimetres of snow remained after 8 days."
      option_explanations:
        - |
          Correct. The input d = 3 days gives the output 8 cm.
        - |
          f(a) = b never means multiply; 3 × 8 has no meaning here.
        - |
          Function notation states one output for one input, not a rate.
        - |
          This swaps input and output: the input 3 is days and the output 8 is centimetres.
      answer: 0

    - slug: alg1-u04-w16-q13
      type: multiple_choice
      topic_code: "2.10"
      source: "IM Algebra 1, Unit 2, Lesson 10"
      points: 1
      prompt: |
        What is the slope of the line through (1, 8) and (5, 0)?
      options:
        - "−2"
        - "−1/2"
        - "−8"
        - "2"
      option_explanations:
        - |
          Correct. Slope = (0 − 8)/(5 − 1) = −8/4 = −2, falling 2 units for each unit to the right.
        - |
          −1/2 divides the change in x by the change in y, the reverse of the formula.
        - |
          −8 is the change in y alone; it must be divided by the change in x, 4.
        - |
          The line falls from left to right, so its slope is negative.
      answer: 0

    # ---- Select-all (4.6, 2.17)
    - slug: alg1-u04-w16-q14
      type: multi_select
      topic_code: "4.6"
      source: "IM Algebra 1, Unit 4, Lesson 6"
      points: 2
      partial_credit: true
      prompt: |
        The graph of f has f(0) = 4, zeros at x = 2 and x = 8, and a maximum of 10 at x = 5. Which statements are true? Select all that apply.
      options:
        - "f is positive for 2 < x < 8."
        - "The maximum value of f is 5."
        - "f(5) = 10."
        - "f(2) = 0 and f(8) = 0."
        - "The vertical intercept is 4."
      option_explanations:
        - |
          Correct. Between its two zeros the graph rises to 10, so it is above the axis there.
        - |
          The maximum value is 10; 5 is the input at which it occurs.
        - |
          Correct. The maximum of 10 occurs at x = 5, which is the statement f(5) = 10.
        - |
          Correct. A zero is an input whose output is 0.
        - |
          Correct. f(0) = 4 is the output at input 0, the vertical intercept.
      answer: [0, 2, 3, 4]

    - slug: alg1-u04-w16-q15
      type: multi_select
      topic_code: "2.17"
      source: "IM Algebra 1, Unit 2, Lesson 17"
      points: 2
      partial_credit: true
      prompt: |
        Which systems have exactly one solution? Select all that apply.
      options:
        - "y = 3 and x = 3"
        - "y = x and y = −x"
        - "y = 2x + 1 and y = −x + 4"
        - "x + y = 6 and 2x + 2y = 12"
        - "y = 2x + 1 and y = 2x − 5"
      option_explanations:
        - |
          Correct. A horizontal and a vertical line cross exactly once, at (3, 3).
        - |
          Correct. Slopes 1 and −1 differ, so the lines cross once, at the origin.
        - |
          Correct. Different slopes (2 and −1) guarantee exactly one crossing point, (1, 3).
        - |
          The second equation is double the first, so they are the same line with infinitely many solutions.
        - |
          The lines have the same slope and different intercepts, so they are parallel and never meet.
      answer: [0, 1, 2]

    # ---- True/false (4.7, 4.2)
    - slug: alg1-u04-w16-q16
      type: true_false
      topic_code: "4.7"
      source: "IM Algebra 1, Unit 4, Lesson 7"
      points: 1
      prompt: |
        True or false: for a linear function, the average rate of change is the same over every interval.
      answer: true
      explanation: |
        True. The average rate of change between two points is the slope of the segment joining them, and every segment of a line has the line's slope.

    - slug: alg1-u04-w16-q17
      type: true_false
      topic_code: "4.2"
      source: "IM Algebra 1, Unit 4, Lesson 2"
      points: 1
      prompt: |
        True or false: the statement f(a) = b means that the point (b, a) is on the graph of f.
      answer: false
      explanation: |
        False. The input a is the x-coordinate and the output b is the y-coordinate, so the point is (a, b).

    # ---- Fill in the blank (4.6, 2.21)
    - slug: alg1-u04-w16-q18
      type: fill_blank
      topic_code: "4.6"
      source: "IM Algebra 1, Unit 4, Lesson 6"
      points: 1
      prompt: |
        An input at which a function's output is 0, where its graph meets the horizontal axis, is called a ____ of the function.
      answer: ["zero", "horizontal intercept", "x-intercept", "root"]
      explanation: |
        The zeros of f are the solutions of f(x) = 0. In a height graph they are the times on the ground; in a profit graph, the break-even months.

    - slug: alg1-u04-w16-q19
      type: fill_blank
      topic_code: "2.21"
      source: "IM Algebra 1, Unit 2, Lesson 21"
      points: 1
      prompt: |
        When graphing a strict inequality such as y < 3x − 2, the boundary line is drawn ____ to show that points on it are not solutions.
      answer: ["dashed", "dotted", "as a dashed line", "broken"]
      explanation: |
        A strict inequality excludes the boundary, shown by a dashed line; ≤ and ≥ include it and use a solid line.

    # ---- Numeric (4.7, 4.7, 4.5)
    - slug: alg1-u04-w16-q20
      type: numeric
      topic_code: "4.7"
      source: "IM Algebra 1, Unit 4, Lesson 7"
      points: 1
      prompt: |
        What is the average rate of change of g(x) = x² from x = 1 to x = 3?
      answer: { value: 4, tolerance: 0 }
      explanation: |
        (g(3) − g(1))/(3 − 1) = (9 − 1)/2 = 4.

    - slug: alg1-u04-w16-q21
      type: numeric
      topic_code: "4.7"
      source: "IM Algebra 1, Unit 4, Lesson 7"
      points: 1
      prompt: |
        A table gives f(1) = 5, f(3) = 11 and f(6) = 14. What is the average rate of change of f from x = 3 to x = 6?
      answer: { value: 1, tolerance: 0 }
      explanation: |
        (14 − 11)/(6 − 3) = 3/3 = 1 per unit.

    - slug: alg1-u04-w16-q22
      type: numeric
      topic_code: "4.5"
      source: "IM Algebra 1, Unit 4, Lesson 5"
      points: 1
      prompt: |
        If f(x) = 5x − 2, for what input is f(x) = 33?
      answer: { value: 7, tolerance: 0 }
      explanation: |
        5x − 2 = 33 gives 5x = 35, so x = 7.

    # ---- Short answer (4.8, 4.4)
    - slug: alg1-u04-w16-q23
      type: short_answer
      topic_code: "4.8"
      source: "IM Algebra 1, Unit 4, Lesson 8"
      points: 3
      prompt: |
        A cyclist leaves home, rides 12 km to a park at a steady speed in 30 minutes, rests for 15 minutes, then rides home at a steady speed in 45 minutes.

        (a) List the key points (time in minutes, distance from home in km) that the graph must pass through.
        (b) Describe the shape of each piece of the graph between those points and compare the steepness of the two riding segments.
        (c) Find the average rate of change of distance from home over the whole trip and explain why it is not the cyclist's average speed.
      answer: |
        (a) (0, 0), (30, 12), (45, 12), (90, 0).
        (b) A straight rising segment from (0, 0) to (30, 12); a flat segment from (30, 12) to (45, 12); a straight falling segment from (45, 12) to (90, 0). The ride out is steeper (12 km in 30 min, 0.4 km/min) than the ride home (12 km in 45 min, about 0.27 km/min).
        (c) (0 − 0)/(90 − 0) = 0 km per minute, because the cyclist ends where she started. Her average speed is distance travelled over time, 24 km in 90 minutes, about 0.27 km/min; the rate of change of distance from home cancels the out and back.
      explanation: |
        Three points, one per part.

        (a) 1 pt: all four points.

        (b) 1 pt: straight, flat, straight with the out segment identified as steeper.

        (c) 1 pt: average rate of change 0 with the explanation that it measures net change in distance from home, not distance covered.

    - slug: alg1-u04-w16-q24
      type: short_answer
      topic_code: "4.4"
      source: "IM Algebra 1, Unit 4, Lesson 4"
      points: 3
      prompt: |
        A table gives r(0) = 15, r(2) = 21, r(4) = 27 and r(6) = 33.

        (a) Write a rule for r(x), explaining how you found the rate and the starting value.
        (b) Use the rule to find r(9).
        (c) Solve r(x) = 60 and check your answer.
      answer: |
        (a) The output rises 6 for every 2 units of input, so 3 per unit; the starting value r(0) is 15. r(x) = 3x + 15.
        (b) r(9) = 27 + 15 = 42.
        (c) 3x + 15 = 60 gives 3x = 45, x = 15. Check: 3(15) + 15 = 60.
      explanation: |
        Three points, one per part.

        (a) 1 pt: r(x) = 3x + 15 with the reasoning.

        (b) 1 pt: 42.

        (c) 1 pt: x = 15 with a check.

    # ---- Long answer (4.9)
    - slug: alg1-u04-w16-q25
      type: long_answer
      topic_code: "4.9"
      source: "IM Algebra 1, Unit 4, Lesson 9"
      points: 6
      prompt: |
        Two water tanks are being filled. Tank P's volume in litres after t minutes is given by the rule P(t) = 40 + 6t. Tank Q's volume is given by a table: Q(0) = 10, Q(5) = 70, Q(10) = 115, Q(15) = 145, Q(20) = 155.

        (1) State the starting volume of each tank and find P(10) and P(20).
        (2) Compute the average rate of change of Q from t = 0 to t = 10 and from t = 10 to t = 20. What does the comparison tell you about how Q is being filled?
        (3) Compute the average rate of change of P over the same two intervals and explain why they are equal.
        (4) Which tank holds more water at t = 10? At t = 20? Describe when Q is ahead of P and when P is ahead, using the values you have.
      answer: |
        (1) P starts at 40 L, Q at 10 L. P(10) = 100; P(20) = 160.
        (2) Q from 0 to 10: (115 − 10)/10 = 10.5 L/min. Q from 10 to 20: (155 − 115)/10 = 4 L/min. Q is being filled more slowly as time goes on; its graph is curving and flattening.
        (3) P from 0 to 10: (100 − 40)/10 = 6 L/min; from 10 to 20: (160 − 100)/10 = 6 L/min. P is linear, so its average rate of change equals its slope, 6, over every interval.
        (4) At t = 10, Q holds 115 L and P holds 100 L, so Q is ahead. At t = 20, P holds 160 L and Q holds 155 L, so P is ahead. Q starts behind (10 versus 40), catches P at t = 5 (both 70), is ahead at t = 10 and t = 15 (145 versus 130), and then, because its rate has dropped below P's 6 L/min, P overtakes it somewhere between t = 15 and t = 20.
      explanation: |
        Six points.

        (1) 1 pt: starting volumes and both values of P.

        (2) 2 pts: 1 for the two rates (10.5 and 4 L/min), 1 for interpreting the slowing fill.

        (3) 1 pt: both rates equal 6 with the linear-function reason.

        (4) 2 pts: 1 for the comparison at t = 10 (Q ahead) and t = 20 (P ahead), 1 for a coherent description of the lead changing: equal at t = 5, Q ahead through t = 15, P ahead by t = 20.

        Common errors: reading the table's starting value as 0; computing total change without dividing; assuming Q stays ahead because it fills faster at first.
