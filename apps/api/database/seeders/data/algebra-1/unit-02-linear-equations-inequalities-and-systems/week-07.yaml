week: 7
unit: 2
title: "Rearranging Formulas and Connecting Equations to Their Graphs"
topics: ["2.9", "2.10", "2.11"]
guide: guides/week-07.md
guide_description: |
  Isolating any variable in a formula, slope-intercept form y = mx + b and what the slope and intercept mean in
  context, graphing from the form, and standard form ax + by = c with its intercepts, its slope −a/b and the
  meaning of its coefficients. Ends with how to choose between the two forms.
flashcards_description: |
  28 cards on rearranging formulas, slope and y-intercept, slope from two points, graphing from
  slope-intercept form, the intercepts and slope of standard form, and converting between forms.

flashcards:
  - front: Rearranging a formula for a chosen letter → the rule
    back: |
      Undo the operations applied to that letter, one at a time, on both sides, until it stands alone. The other letters are treated exactly like numbers.
    topic_code: "2.9"
  - front: Solve A = (1/2)(b₁ + b₂)h for b₂
    back: |
      Multiply by 2: 2A = (b₁ + b₂)h. Divide by h: 2A/h = b₁ + b₂. Subtract b₁: b₂ = 2A/h − b₁.
    topic_code: "2.9"
  - front: Solve v = u + at for a
    back: |
      Subtract u: v − u = at. Divide by t: a = (v − u)/t.
    topic_code: "2.9"
  - front: Solve 3x + 2y = 18 for x
    back: |
      Subtract 2y: 3x = 18 − 2y. Divide the whole right side by 3: x = (18 − 2y)/3, which is 6 − (2/3)y.
    topic_code: "2.9"
  - front: Which variable to solve for → how to decide
    back: |
      Isolate the quantity you will need to compute repeatedly. If customers know the payment and want the loan length, solve for time; if the bank knows the length and wants the payment, solve for payment.
    topic_code: "2.9"
  - front: Slope-intercept form → the form and the meaning of each letter
    back: |
      y = mx + b. m is the slope, the change in y for each increase of 1 in x; b is the y-intercept, the value of y when x = 0.
    topic_code: "2.10"
  - front: Slope from two points → formula
    back: |
      m = (y₂ − y₁)/(x₂ − x₁): change in y divided by change in x, subtracting in the same order in both. Through (1, 5) and (3, 11), m = 6/2 = 3.
    topic_code: "2.10"
  - front: Sign of the slope → what the line does
    back: |
      Positive slope rises from left to right, negative slope falls, zero slope is a horizontal line. The larger |m|, the steeper the line.
    topic_code: "2.10"
  - front: Graphing y = mx + b by hand → the steps
    back: |
      Plot (0, b). Move right 1 and up m (down if m is negative) to a second point, or right by the denominator and up by the numerator for a fraction. Draw the line and check a third point.
    topic_code: "2.10"
  - front: Equation of the line through (0, −3) and (4, 5)
    back: |
      m = (5 − (−3))/(4 − 0) = 2; the y-intercept is −3 because (0, −3) is on the line. y = 2x − 3.
    topic_code: "2.10"
  - front: Equation of the line through (2, 1) and (6, 9)
    back: |
      m = 8/4 = 2. Substitute (2, 1): 1 = 2(2) + b, so b = −3. y = 2x − 3.
    topic_code: "2.10"
  - front: Rewrite 4x + 3y = 24 in slope-intercept form
    back: |
      3y = −4x + 24, so y = −(4/3)x + 8. Slope −4/3, y-intercept 8. Every term on the right must be divided by 3.
    topic_code: "2.10"
  - front: Slope and intercept of C = 45h + 60 (plumber's charge)
    back: |
      Slope 45: the charge rises $45 for every extra hour. Intercept 60: the charge when h = 0, the call-out fee paid before any work.
    topic_code: "2.10"
  - front: Slope and intercept of V = 500 − 20t (draining tank)
    back: |
      Slope −20: the tank loses 20 litres each minute. Intercept 500: the volume at t = 0, before draining begins.
    topic_code: "2.10"
  - front: The slope of y = 6 − 1.5x
    back: |
      −1.5, the coefficient of x. Rewritten as y = −1.5x + 6, the y-intercept is 6. The first number written is not automatically the slope.
    topic_code: "2.10"
  - front: Standard form of a linear equation
    back: |
      ax + by = c with constants a, b, c (usually integers). It arises naturally when two quantities at different rates combine into a total, like 8b + 12f = 960.
    topic_code: "2.11"
  - front: Intercepts of ax + by = c → shortcuts
    back: |
      x-intercept: set y = 0, x = c/a. y-intercept: set x = 0, y = c/b. For 4x + 3y = 24 they are (6, 0) and (0, 8).
    topic_code: "2.11"
  - front: Slope of ax + by = c → formula
    back: |
      m = −a/b. For 4x + 3y = 24 the slope is −4/3; for 6x − 2y = 18 it is −6/(−2) = 3.
    topic_code: "2.11"
  - front: Meaning of the coefficients in 8b + 12f = 960
    back: |
      8 and 12 are the prices of balcony and floor seats, 960 the total income. The slope −2/3 says 3 more balcony seats trade for 2 fewer floor seats at the same total.
    topic_code: "2.11"
  - front: Changing c in ax + by = c → effect on the graph
    back: |
      The slope −a/b stays the same, so the new line is parallel; both intercepts change. 8b + 12f = 1200 is parallel to 8b + 12f = 960 with intercepts 150 and 100 instead of 120 and 80.
    topic_code: "2.11"
  - front: Changing a coefficient in ax + by = c → effect on the graph
    back: |
      The slope −a/b changes, so the line tilts, and one intercept changes while the other (c divided by the untouched coefficient) stays the same.
    topic_code: "2.11"
  - front: Rewrite y = (2/5)x − 3 in standard form with integers
    back: |
      Multiply by 5: 5y = 2x − 15. Move the x term: 2x − 5y = 15.
    topic_code: "2.11"
  - front: Rewrite y = −3x + 7 in standard form
    back: |
      Add 3x to both sides: 3x + y = 7.
    topic_code: "2.11"
  - front: Which form to use → slope-intercept vs standard
    back: |
      Slope-intercept to read the rate and starting value or to graph from (0, b). Standard to model two quantities making a total or to find both intercepts quickly.
    topic_code: "2.11"
  - front: Error to spot → "the slope of 4x + 3y = 24 is 4"
    back: |
      The slope is −a/b = −4/3. Reading a coefficient as the slope only works in slope-intercept form, where y is isolated.
    topic_code: "2.11"
  - front: Error to spot → "from 3y = −4x + 24, y = −4x + 8"
    back: |
      Every term on the right must be divided by 3: y = −(4/3)x + 8. Dividing only the constant changes the slope.
    topic_code: "2.10"
  - front: Error to spot → "y-intercept 8 means the point (8, 0)"
    back: |
      The y-intercept is where x = 0, so b = 8 is the point (0, 8). (8, 0) would be on the x-axis.
    topic_code: "2.10"
  - front: Error to spot → slope computed as (x₂ − x₁)/(y₂ − y₁)
    back: |
      That is run over rise, the reciprocal of the slope. Slope is the change in y divided by the change in x, with both differences taken in the same order.
    topic_code: "2.10"

quiz:
  description: |
    25 questions · about 45 minutes · rearranging formulas, slope-intercept form, slope and intercepts in
    context, and standard form (lessons 2.9 to 2.11), with review of writing equations, equivalent equations
    and solutions from weeks 5 and 6 and statistics from unit 1. Multiple choice, select-all, true/false and
    numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and
    the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: alg1-u02-w07-q01
      type: multiple_choice
      topic_code: "2.10"
      source: "IM Algebra 1, Unit 2, Lesson 10"
      points: 1
      prompt: |
        What is the slope of the line through (2, 7) and (5, 1)?
      options:
        - "2"
        - "−2"
        - "−1/2"
        - "6"
      option_explanations:
        - |
          The change in y is 1 − 7 = −6, negative, so the slope cannot be positive.
        - |
          Correct. m = (1 − 7)/(5 − 2) = −6/3 = −2.
        - |
          −1/2 is run over rise; slope is rise over run.
        - |
          6 is the size of the change in y alone, without dividing by the change in x and without its sign.
      answer: 1

    - slug: alg1-u02-w07-q02
      type: multiple_choice
      topic_code: "2.10"
      source: "IM Algebra 1, Unit 2, Lesson 10"
      points: 1
      prompt: |
        Which equation has slope −3 and y-intercept 5?
      options:
        - "y = 5x − 3"
        - "y = −3x + 5"
        - "y = 3x − 5"
        - "y = 5 − 3"
      option_explanations:
        - |
          Here the slope is 5 and the intercept −3, the reverse of what is asked.
        - |
          Correct. In y = mx + b the coefficient of x is the slope and the constant is the intercept.
        - |
          The slope is +3 and the intercept −5; both signs are wrong.
        - |
          There is no x term, so this is not even a line with slope −3; it is y = 2, a horizontal line.
      answer: 1

    - slug: alg1-u02-w07-q03
      type: multiple_choice
      topic_code: "2.10"
      source: "IM Algebra 1, Unit 2, Lesson 10"
      points: 1
      prompt: |
        A gym's membership cost is given by C = 28m + 50, where m is the number of months. What does the 50 represent?
      options:
        - "The cost per month"
        - "The joining fee, paid before any months are counted"
        - "The number of months in the contract"
        - "The total cost after one month"
      option_explanations:
        - |
          The monthly cost is the slope, 28, the amount added for each extra month.
        - |
          Correct. The y-intercept is the cost when m = 0, a one-time fee charged at the start.
        - |
          The 50 is in dollars; m counts the months.
        - |
          After one month the cost is 28 + 50 = 78.
      answer: 1

    - slug: alg1-u02-w07-q04
      type: multiple_choice
      topic_code: "2.11"
      source: "IM Algebra 1, Unit 2, Lesson 11"
      points: 1
      prompt: |
        What is the slope of the line 5x + 2y = 20?
      options:
        - "5"
        - "−5/2"
        - "5/2"
        - "−2/5"
      option_explanations:
        - |
          5 is the coefficient of x in standard form, not the slope; y has not been isolated.
        - |
          Correct. Solving for y gives y = −(5/2)x + 10, or use m = −a/b = −5/2.
        - |
          The sign is wrong: moving 5x to the other side makes it negative.
        - |
          −2/5 is the reciprocal; the slope is −a/b, not −b/a.
      answer: 1

    - slug: alg1-u02-w07-q05
      type: multiple_choice
      topic_code: "2.11"
      source: "IM Algebra 1, Unit 2, Lesson 11"
      points: 1
      stimulus: |
        A café sells coffee for $3 a cup and pastries for $4 each. One morning the café took in $240. Let c be the number of cups of coffee and p the number of pastries sold, so 3c + 4p = 240.
      prompt: |
        What are the intercepts of the graph (with c on the horizontal axis), and what do they mean?
      options:
        - "(80, 0): 80 coffees and no pastries; (0, 60): 60 pastries and no coffee"
        - "(60, 0): 60 coffees and no pastries; (0, 80): 80 pastries and no coffee"
        - "(240, 0) and (0, 240): 240 of each item"
        - "(3, 0) and (0, 4): the prices"
      option_explanations:
        - |
          Correct. p = 0 gives 3c = 240, c = 80; c = 0 gives 4p = 240, p = 60.
        - |
          The intercepts are swapped: 240 divided by the coffee price 3 is 80, not 60.
        - |
          240 is the total in dollars, not a number of items; each intercept divides 240 by a price.
        - |
          The prices are the coefficients, not the intercepts.
      answer: 0

    - slug: alg1-u02-w07-q06
      type: multiple_choice
      topic_code: "2.11"
      source: "IM Algebra 1, Unit 2, Lesson 11"
      points: 1
      stimulus: |
        A café sells coffee for $3 a cup and pastries for $4 each. One morning the café took in $240. Let c be the number of cups of coffee and p the number of pastries sold, so 3c + 4p = 240.
      prompt: |
        What is the slope of the graph, and what does it mean here?
      options:
        - "−3/4: selling 4 more coffees means selling 3 fewer pastries for the same total"
        - "−4/3: selling 3 more coffees means selling 4 fewer pastries for the same total"
        - "3/4: selling 4 more coffees means selling 3 more pastries"
        - "240: the total income"
      option_explanations:
        - |
          Correct. m = −a/b = −3/4: an increase of 4 in c changes p by −3 while the income stays $240.
        - |
          −4/3 is −b/a; the slope of ac + bp = total is −a/b.
        - |
          The slope is negative: more of one item means fewer of the other for the same income.
        - |
          240 is the constant c in standard form, not the slope.
      answer: 0

    - slug: alg1-u02-w07-q07
      type: multiple_choice
      topic_code: "2.9"
      source: "IM Algebra 1, Unit 2, Lesson 9"
      points: 1
      stimulus: |
        A café sells coffee for $3 a cup and pastries for $4 each. One morning the café took in $240. Let c be the number of cups of coffee and p the number of pastries sold, so 3c + 4p = 240.
      prompt: |
        The manager knows the number of coffees sold each morning and wants to compute the pastries quickly. Which rearrangement should she use?
      options:
        - "p = 240 − 3c"
        - "p = (240 − 3c)/4"
        - "p = 60 − 3c"
        - "p = (240 + 3c)/4"
      option_explanations:
        - |
          4p = 240 − 3c still has to be divided by 4.
        - |
          Correct. Subtract 3c from both sides and divide the whole right side by 4: p = 60 − (3/4)c.
        - |
          Only the 240 was divided by 4; the 3c must be divided too, giving (3/4)c.
        - |
          3c must be subtracted, not added, when moved to the other side.
      answer: 1

    - slug: alg1-u02-w07-q08
      type: multiple_choice
      topic_code: "2.8"
      source: "IM Algebra 1, Unit 2, Lesson 8"
      points: 1
      prompt: |
        Solve the formula V = lwh for h.
      options:
        - "h = V − lw"
        - "h = V/(lw)"
        - "h = lw/V"
        - "h = Vlw"
      option_explanations:
        - |
          l and w multiply h, so they are undone by division, not subtraction.
        - |
          Correct. Dividing both sides by lw isolates h.
        - |
          This is the reciprocal of the correct expression.
        - |
          Multiplying by lw would move further from isolating h.
      answer: 1

    - slug: alg1-u02-w07-q09
      type: multiple_choice
      topic_code: "2.10"
      source: "IM Algebra 1, Unit 2, Lesson 10"
      points: 1
      prompt: |
        Which description correctly graphs y = (2/3)x − 1?
      options:
        - "Plot (0, −1); from there move right 3 and up 2 to the next point."
        - "Plot (−1, 0); from there move right 2 and up 3 to the next point."
        - "Plot (0, −1); from there move right 2 and up 3 to the next point."
        - "Plot (0, 2/3); from there move right 1 and down 1 to the next point."
      option_explanations:
        - |
          Correct. The y-intercept is (0, −1) and a slope of 2/3 is a rise of 2 for a run of 3.
        - |
          The y-intercept is on the y-axis at (0, −1), not (−1, 0), and 2/3 is rise 2 over run 3.
        - |
          Rise 3 over run 2 would be a slope of 3/2, not 2/3.
        - |
          2/3 is the slope, not the intercept, and the line rises rather than falls.
      answer: 0

    - slug: alg1-u02-w07-q10
      type: multiple_choice
      topic_code: "2.11"
      source: "IM Algebra 1, Unit 2, Lesson 11"
      points: 1
      prompt: |
        Which equation is y = (3/4)x + 2 written in standard form with integer coefficients?
      options:
        - "3x − 4y = −8"
        - "3x + 4y = 8"
        - "4x − 3y = 2"
        - "3x − 4y = 2"
      option_explanations:
        - |
          Correct. Multiply by 4: 4y = 3x + 8; then 3x − 4y = −8 (or −3x + 4y = 8).
        - |
          With +4y the slope would be −3/4, not 3/4.
        - |
          The coefficients are swapped, giving slope 4/3.
        - |
          The constant 2 must also be multiplied by 4 when clearing the fraction.
      answer: 0

    - slug: alg1-u02-w07-q11
      type: multiple_choice
      topic_code: "2.6"
      source: "IM Algebra 1, Unit 2, Lesson 6"
      points: 1
      prompt: |
        Which equation is equivalent to 3(x + 2) = 21?
      options:
        - "3x + 2 = 21"
        - "x + 2 = 7"
        - "x + 2 = 18"
        - "3x = 21 − 2"
      option_explanations:
        - |
          The 3 was not distributed to the 2; the correct expansion is 3x + 6 = 21.
        - |
          Correct. Dividing both sides by 3 gives x + 2 = 7, and both equations have solution 5.
        - |
          Subtracting 3 from the right side only is not a valid move.
        - |
          Subtracting 2 undoes nothing here because the 2 is inside the parentheses multiplied by 3.
      answer: 1

    - slug: alg1-u02-w07-q12
      type: multiple_choice
      topic_code: "2.4"
      source: "IM Algebra 1, Unit 2, Lesson 4"
      points: 1
      prompt: |
        Which pair (x, y) is a solution of 7x − 2y = 10?
      options:
        - "(2, 2)"
        - "(0, 5)"
        - "(4, 8)"
        - "(1, 2)"
      option_explanations:
        - |
          Correct. 7(2) − 2(2) = 14 − 4 = 10, so the pair satisfies the equation.
        - |
          7(0) − 2(5) = −10, which has the wrong sign; the pair is not a solution.
        - |
          7(4) − 2(8) = 28 − 16 = 12, not 10, so the pair is not a solution.
        - |
          7(1) − 2(2) = 7 − 4 = 3, not 10, so the pair is not a solution.
      answer: 0

    - slug: alg1-u02-w07-q13
      type: multiple_choice
      topic_code: "1.12"
      source: "IM Algebra 1, Unit 1, Lesson 12"
      points: 1
      prompt: |
        The data 3, 5, 9, 11 have mean 7. What is the standard deviation (divide by n)?
      options:
        - "3"
        - "√10 ≈ 3.16"
        - "10"
        - "√40 ≈ 6.32"
      option_explanations:
        - |
          3 is the MAD (distances 4, 2, 2, 4 average to 3), not the SD.
        - |
          Correct. Squared deviations 16, 4, 4, 16 sum to 40; variance 40/4 = 10; SD = √10 ≈ 3.16.
        - |
          10 is the variance; the SD is its square root.
        - |
          The sum of squares must be divided by 4 before taking the square root.
      answer: 1

    - slug: alg1-u02-w07-q14
      type: multi_select
      topic_code: "2.10"
      source: "IM Algebra 1, Unit 2, Lesson 10"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the line y = −2x + 6 are true? Select all that apply.
      options:
        - "The line falls from left to right."
        - "The y-intercept is (0, 6)."
        - "The x-intercept is (3, 0)."
        - "When x increases by 1, y increases by 2."
        - "The point (4, −2) is on the line."
      option_explanations:
        - |
          Correct. A negative slope means the line falls as x increases.
        - |
          Correct. Setting x = 0 gives y = −2(0) + 6 = 6, so the intercept is (0, 6).
        - |
          Correct. Setting y = 0 gives 2x = 6, so x = 3.
        - |
          With slope −2, y decreases by 2 for each increase of 1 in x.
        - |
          Correct. −2(4) + 6 = −2, so the pair satisfies the equation.
      answer: [0, 1, 2, 4]

    - slug: alg1-u02-w07-q15
      type: multi_select
      topic_code: "2.11"
      source: "IM Algebra 1, Unit 2, Lesson 11"
      points: 2
      partial_credit: true
      prompt: |
        Consider the lines 2x + 5y = 20 and 2x + 5y = 40. Which statements are true? Select all that apply.
      options:
        - "Both lines have slope −2/5."
        - "The lines are parallel."
        - "The x-intercept of the second line is twice the x-intercept of the first."
        - "The lines cross at (10, 0)."
        - "The y-intercepts are 4 and 8."
      option_explanations:
        - |
          Correct. The slope −a/b depends only on the coefficients 2 and 5.
        - |
          Correct. Same slope and different intercepts means parallel lines.
        - |
          Correct. The x-intercepts are 20/2 = 10 and 40/2 = 20.
        - |
          Parallel lines never cross; (10, 0) is on the first line only.
        - |
          Correct. The y-intercepts are 20/5 = 4 and 40/5 = 8.
      answer: [0, 1, 2, 4]

    - slug: alg1-u02-w07-q16
      type: true_false
      topic_code: "2.10"
      source: "IM Algebra 1, Unit 2, Lesson 10"
      points: 1
      prompt: |
        True or false: in the equation y = 9 − 4x, the slope is 9.
      answer: false
      explanation: |
        False. The slope is the coefficient of x, which is −4. Rewritten as y = −4x + 9, the y-intercept is 9. The order in which the terms are written does not change their roles.

    - slug: alg1-u02-w07-q17
      type: true_false
      topic_code: "2.8"
      source: "IM Algebra 1, Unit 2, Lesson 8"
      points: 1
      prompt: |
        True or false: solving P = 2l + 2w for l gives l = P/2 − w.
      answer: true
      explanation: |
        True. Subtract 2w from both sides: P − 2w = 2l. Divide by 2: l = (P − 2w)/2 = P/2 − w.

    - slug: alg1-u02-w07-q18
      type: fill_blank
      topic_code: "2.11"
      source: "IM Algebra 1, Unit 2, Lesson 11"
      points: 1
      prompt: |
        The slope of the line ax + by = c is ____ (give the expression in a and b).
      answer: ["-a/b", "−a/b", "-(a/b)", "−(a/b)", "-a ÷ b"]
      explanation: |
        Solving for y gives y = −(a/b)x + c/b, so the slope is −a/b and the y-intercept is c/b.

    - slug: alg1-u02-w07-q19
      type: fill_blank
      topic_code: "2.10"
      source: "IM Algebra 1, Unit 2, Lesson 10"
      points: 1
      prompt: |
        A line has slope 4 and passes through (0, −7). Its equation in slope-intercept form is y = ____.
      answer: ["4x - 7", "4x − 7", "4x-7", "4x−7", "4 x - 7"]
      explanation: |
        The point (0, −7) is the y-intercept, so b = −7, and the slope is m = 4: y = 4x − 7.

    - slug: alg1-u02-w07-q20
      type: numeric
      topic_code: "2.10"
      source: "IM Algebra 1, Unit 2, Lesson 10"
      points: 1
      prompt: |
        A line passes through (−1, 4) and (3, −8). What is its slope? Give a whole number (it may be negative).
      answer: { value: -3, tolerance: 0 }
      explanation: |
        m = (−8 − 4)/(3 − (−1)) = −12/4 = −3. Subtract in the same order in the numerator and the denominator.

    - slug: alg1-u02-w07-q21
      type: numeric
      topic_code: "2.5"
      source: "IM Algebra 1, Unit 2, Lesson 5"
      points: 1
      prompt: |
        What is the x-coordinate of the x-intercept of 7x − 3y = 42? Give a whole number.
      answer: { value: 6, tolerance: 0 }
      explanation: |
        Set y = 0: 7x = 42, so x = 6. The y-intercept is found from −3y = 42, giving y = −14.

    - slug: alg1-u02-w07-q25
      type: numeric
      topic_code: "1.14"
      source: "IM Algebra 1, Unit 1, Lesson 14"
      points: 1
      prompt: |
        A data set has Q1 = 25 and Q3 = 37. What is the upper fence for outliers under the 1.5 × IQR rule? Give a whole number.
      answer: { value: 55, tolerance: 0 }
      explanation: |
        IQR = 37 − 25 = 12; 1.5 × 12 = 18; upper fence = 37 + 18 = 55. The lower fence is 25 − 18 = 7.

    - slug: alg1-u02-w07-q22
      type: short_answer
      topic_code: "2.10"
      source: "IM Algebra 1, Unit 2, Lesson 10"
      points: 3
      prompt: |
        A spring is 12 cm long with nothing hanging on it and stretches 0.5 cm for every 100 g added. Let L be the length in cm and m the mass in grams.

        (a) Write an equation for L in terms of m in slope-intercept form.
        (b) Interpret the slope and the intercept in context, with units.
        (c) Rearrange the equation to find m from L, and find the mass hanging when the spring is 15.5 cm long.
      answer: |
        (a) 0.5 cm per 100 g is 0.005 cm per gram, so L = 0.005m + 12.
        (b) The slope 0.005 means the spring lengthens 0.005 cm for each gram added (0.5 cm per 100 g); the intercept 12 cm is the unstretched length when m = 0.
        (c) m = (L − 12)/0.005. For L = 15.5, m = 3.5/0.005 = 700 g.
      explanation: |
        Three points, one per part.

        (a) 1 pt: L = 0.005m + 12 (accept L = 12 + 0.5(m/100)).

        (b) 1 pt: both interpretations with units.

        (c) 1 pt: the rearrangement and m = 700 g.

    - slug: alg1-u02-w07-q23
      type: short_answer
      topic_code: "2.11"
      source: "IM Algebra 1, Unit 2, Lesson 11"
      points: 3
      prompt: |
        A nut mix uses almonds at $9 per kg and peanuts at $4 per kg. A batch costs $72 in nuts. Let a be the kilograms of almonds and p the kilograms of peanuts.

        (a) Write the equation in standard form and find both intercepts.
        (b) Find the slope and explain what it tells the mixer about trading almonds for peanuts.
        (c) The mixer changes the batch budget to $90. Without recomputing from scratch, describe how the graph changes.
      answer: |
        (a) 9a + 4p = 72. Intercepts: (8, 0), 8 kg of almonds and no peanuts; (0, 18), 18 kg of peanuts and no almonds.
        (b) Slope = −9/4: for every 4 kg more of almonds the batch must use 9 kg fewer peanuts to keep the cost at $72 (equivalently, each extra kg of almonds costs 2.25 kg of peanuts).
        (c) The slope stays −9/4, so the new line is parallel to the old one, shifted away from the origin; the intercepts become (10, 0) and (0, 22.5).
      explanation: |
        Three points, one per part.

        (a) 1 pt: equation and both intercepts.

        (b) 1 pt: −9/4 with a trade-off interpretation.

        (c) 1 pt: parallel line, same slope, new intercepts 10 and 22.5.

    - slug: alg1-u02-w07-q24
      type: long_answer
      topic_code: "2.10"
      source: "IM Algebra 1, Unit 2, Lesson 10"
      points: 6
      prompt: |
        Two phone plans are offered. Plan A costs $20 per month plus $0.05 per text. Plan B is described by the equation 10x − 100y = −3000, where x is the number of texts and y the monthly cost in dollars.

        (1) Write plan A's cost in slope-intercept form and interpret the slope and intercept.
        (2) Rewrite plan B's equation in slope-intercept form and interpret its slope and intercept.
        (3) Describe how to graph both lines on the same axes, naming two points on each.
        (4) Which plan is cheaper for a customer who sends 500 texts a month? Show your work, and explain what the comparison of slopes tells you about customers who send very many texts.
      answer: |
        (1) y = 0.05x + 20. Slope 0.05: each text costs 5 cents. Intercept 20: the monthly charge with no texts.
        (2) −100y = −3000 − 10x, so y = 0.1x + 30. Slope 0.1: each text costs 10 cents. Intercept 30: the fixed monthly charge.
        (3) Plan A: plot (0, 20) and (200, 30) (right 200, up 10). Plan B: plot (0, 30) and (200, 50). Draw each line through its two points; B starts higher and rises faster.
        (4) At 500 texts: A costs 0.05(500) + 20 = $45; B costs 0.1(500) + 30 = $80. Plan A is cheaper. Because A's slope (0.05) is smaller than B's (0.1), A grows more slowly, so A is cheaper for every number of texts here: it starts lower and rises slower. (The lines never cross for x ≥ 0; they would meet only at x = −200.)
      explanation: |
        Six points.

        (1) 1 pt: equation with both interpretations.

        (2) 2 pts: 1 for y = 0.1x + 30 correctly rearranged (sign handling), 1 for interpretations.

        (3) 1 pt: two correct points per line and a sensible graphing description.

        (4) 2 pts: 1 for the costs $45 and $80 with A chosen; 1 for the slope comparison and the conclusion that A stays cheaper.

        Common errors: dropping the sign when dividing by −100; interpreting the intercept as a per-text cost; concluding that a plan with a lower intercept must eventually become more expensive without checking the slopes.
