    points: 1
    prompt: |
      True or false: the point (0, 0) can always be used as the test point when graphing a linear inequality.
    answer: false
    explanation: |
      False. If the boundary line passes through the origin (for example y < 3x), substituting (0, 0) gives a statement about the line itself and decides nothing. Choose another point such as (1, 0).

