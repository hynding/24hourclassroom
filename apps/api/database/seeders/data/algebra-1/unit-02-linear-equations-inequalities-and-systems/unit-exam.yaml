unit: 2
description: |
  46 questions · about 90 minutes · every lesson of Unit 2 (2.1 to 2.26): writing equations and their
  solutions, graphs and the two forms of a line, equivalent equations and solving for a variable, systems by
  graphing, substitution and elimination, the number of solutions, inequalities in one and two variables, and
  systems of inequalities, plus review of Unit 1 statistics. Three stimulus sets share a situation across
  consecutive items. Multiple choice, select-all, true/false and numeric items are graded at once;
  fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by your
  teacher against the scoring notes.
questions:
  # ---- Writing equations and solutions (2.1-2.4)
  - slug: alg1-u02-exam-q01
    type: multiple_choice
    topic_code: "2.1"
    source: "IM Algebra 1, Unit 2, Lesson 1"
    points: 1
    prompt: |
      A food truck pays $120 a day for its pitch and $2.40 per burger for ingredients. Which expression gives the day's cost for b burgers?
    options:
      - "120b + 2.40"
      - "120 + 2.40b"
      - "122.40b"
      - "2.40 + 120b"
    option_explanations:
      - |
        This charges $120 per burger and a single $2.40 fee, the reverse of the situation.
      - |
        Correct. The pitch is a fixed daily cost and ingredients scale with the number of burgers.
      - |
        Adding the two numbers and multiplying by b charges the pitch for every burger.
      - |
        The fixed and per-burger amounts are swapped.
    answer: 1

  - slug: alg1-u02-exam-q02
    type: multiple_choice
    topic_code: "2.2"
    source: "IM Algebra 1, Unit 2, Lesson 2"
    points: 1
    prompt: |
      A car's fuel tank holds 48 litres and the car uses 6 litres per 100 km. Which equation gives the fuel F remaining after d hundred kilometres?
    options:
      - "F = 48 + 6d"
      - "F = 48 − 6d"
      - "F = 6 − 48d"
      - "F = 48d − 6"
    option_explanations:
      - |
        Adding would make the tank fill up as the car drives.
      - |
        Correct. The tank starts at 48 and loses 6 litres for each hundred kilometres.
      - |
        The constants are swapped; the car does not start with 6 litres.
      - |
        This multiplies the starting fuel by distance, which does not describe steady consumption.
    answer: 1

  - slug: alg1-u02-exam-q03
    type: multiple_choice
    topic_code: "2.3"
    source: "IM Algebra 1, Unit 2, Lesson 3"
    points: 1
    prompt: |
      A table pairs n = 1, 3, 6 with T = 14, 22, 34. Which equation fits every row?
    options:
      - "T = 4n + 10"
      - "T = 8n + 6"
      - "T = 14n"
      - "T = 4n + 18"
    option_explanations:
      - |
        Correct. T rises by 8 over 2 units and by 12 over 3 units, so 4 per unit; 4(1) + 10 = 14, 4(3) + 10 = 22, 4(6) + 10 = 34.
      - |
        8(1) + 6 = 14 fits the first row, but 8(3) + 6 = 30, not 22.
      - |
        14(1) = 14 fits the first row, but 14(3) = 42, not 22.
      - |
        4(1) + 18 = 22, not 14, so the starting value is wrong.
    answer: 0

  - slug: alg1-u02-exam-q04
    type: multiple_choice
    topic_code: "2.4"
    source: "IM Algebra 1, Unit 2, Lesson 4"
    points: 1
    prompt: |
      Which pair (x, y) is a solution of 5x − 3y = 9?
    options:
      - "(3, 2)"
      - "(0, 3)"
      - "(2, 1)"
      - "(1, 2)"
    option_explanations:
      - |
        Correct. Substituting gives 5(3) − 3(2) = 15 − 6 = 9, so the pair satisfies the equation.
      - |
        Substituting (0, 3) gives 5(0) − 3(3) = −9, which has the wrong sign to equal 9.
      - |
        Substituting (2, 1) gives 5(2) − 3(1) = 10 − 3 = 7, which is not 9.
      - |
        Substituting (1, 2) gives 5(1) − 3(2) = 5 − 6 = −1, which is not 9.
    answer: 0

  # ---- Stimulus set A: a tutoring business (2.5, 2.10, 2.8)
  - slug: alg1-u02-exam-q05
    type: multiple_choice
    topic_code: "2.10"
    source: "IM Algebra 1, Unit 2, Lesson 10"
    points: 1
    stimulus: |
      A tutor charges a flat booking fee plus an hourly rate. A 2-hour session costs $70 and a 5-hour session costs $145. Let h be the hours and C the cost in dollars.
    prompt: |
      What are the hourly rate and the booking fee?
    options:
      - "$25 per hour and a $20 fee"
      - "$35 per hour and no fee"
      - "$29 per hour and a $12 fee"
      - "$20 per hour and a $25 fee"
    option_explanations:
      - |
        Correct. The slope is (145 − 70)/(5 − 2) = 25; then 70 = 25(2) + b gives b = 20.
      - |
        35(2) = 70 fits one point, but 35(5) = 175, not 145.
      - |
        29(2) + 12 = 70 fits one point, but 29(5) + 12 = 157, not 145.
      - |
        Two hours at this rate gives 20(2) + 25 = 65 dollars, which is not the 70 dollars charged.
    answer: 0

  - slug: alg1-u02-exam-q06
    type: multiple_choice
    topic_code: "2.5"
    source: "IM Algebra 1, Unit 2, Lesson 5"
    points: 1
    stimulus: |
      A tutor charges a flat booking fee plus an hourly rate. A 2-hour session costs $70 and a 5-hour session costs $145. Let h be the hours and C the cost in dollars.
    prompt: |
      Which point is on the graph of the tutor's cost equation, and what does it mean?
    options:
      - "(3, 95): a 3-hour session costs $95"
      - "(95, 3): a 95-hour session costs $3"
      - "(3, 75): a 3-hour session costs $75"
      - "(0, 0): a session of no hours costs nothing"
    option_explanations:
      - |
        Correct. C = 25(3) + 20 = 95, and the pair reads as (hours, cost).
      - |
        The coordinates are in the order (hours, cost); 95 hours would cost far more than $3.
      - |
        Three hours at this rate gives 25(3) + 20 = 95 dollars, which is not the 75 dollars charged.
      - |
        At h = 0 the cost is the $20 booking fee, so (0, 20) is on the graph, not (0, 0).
    answer: 0

  - slug: alg1-u02-exam-q07
    type: multiple_choice
    topic_code: "2.8"
    source: "IM Algebra 1, Unit 2, Lesson 8"
    points: 1
    stimulus: |
      A tutor charges a flat booking fee plus an hourly rate. A 2-hour session costs $70 and a 5-hour session costs $145. Let h be the hours and C the cost in dollars.
    prompt: |
      A client with a fixed budget wants a formula for the hours she can book. Which rearrangement of C = 25h + 20 should she use?
    options:
      - "h = (C − 20)/25"
      - "h = C − 20/25"
      - "h = (C + 20)/25"
      - "h = 25C − 20"
    option_explanations:
      - |
        Correct. Subtract 20 from both sides and divide the whole result by 25.
      - |
        Without parentheses only the 20 is divided by 25.
      - |
        The fee must be subtracted, not added, when moved across.
      - |
        This multiplies the cost instead of undoing the multiplication by 25.
    answer: 0

  # ---- Equivalent equations and forms (2.6, 2.7, 2.9, 2.11)
  - slug: alg1-u02-exam-q08
    type: multiple_choice
    topic_code: "2.6"
    source: "IM Algebra 1, Unit 2, Lesson 6"
    points: 1
    prompt: |
      Which equation is equivalent to 5(x − 2) = 30?
    options:
      - "5x − 2 = 30"
      - "x − 2 = 6"
      - "x − 2 = 25"
      - "5x = 32"
    option_explanations:
      - |
        The 5 was not distributed to the −2; the expansion is 5x − 10 = 30.
      - |
        Correct. Dividing both sides by 5 gives x − 2 = 6, with the same solution x = 8.
      - |
        Subtracting 5 from the right side only is not a valid move.
      - |
        Adding 2 to one side only (and not 10) changes the solution.
    answer: 1

  - slug: alg1-u02-exam-q09
    type: multiple_choice
    topic_code: "2.7"
    source: "IM Algebra 1, Unit 2, Lesson 7"
    points: 1
    prompt: |
      A student goes from 9x − 6 = 3x + 12 to 6x − 6 = 12. Which reason justifies the step?
    options:
      - "Divide both sides by 3"
      - "Subtract 3x from both sides"
      - "Add 6 to both sides"
      - "Combine like terms on the left"
    option_explanations:
      - |
        Dividing by 3 would give 3x − 2 = x + 4.
      - |
        Correct. Removing 3x from both sides changes 9x to 6x and leaves 12 on the right.
      - |
        Adding 6 would remove the −6, which is still present.
      - |
        The x terms were on opposite sides; nothing on the left was combined.
    answer: 1

  - slug: alg1-u02-exam-q10
    type: multiple_choice
    topic_code: "2.9"
    source: "IM Algebra 1, Unit 2, Lesson 9"
    points: 1
    prompt: |
      Solve the formula A = (1/2)h(a + b) for a.
    options:
      - "a = 2A/h − b"
      - "a = 2A − b − h"
      - "a = A/(2h) − b"
      - "a = (2A − b)/h"
    option_explanations:
      - |
        Correct. Multiply by 2: 2A = h(a + b); divide by h: 2A/h = a + b; subtract b.
      - |
        h multiplies the sum, so it is undone by division, not subtraction.
      - |
        The 2 multiplies A on the way across, giving 2A/h, not A/(2h).
      - |
        b is subtracted after dividing by h, so it is not inside the fraction.
    answer: 0

  - slug: alg1-u02-exam-q11
    type: multiple_choice
    topic_code: "2.11"
    source: "IM Algebra 1, Unit 2, Lesson 11"
    points: 1
    prompt: |
      What are the slope and intercepts of the line 3x − 5y = 30?
    options:
      - "Slope 3/5, x-intercept (10, 0), y-intercept (0, −6)"
      - "Slope −3/5, x-intercept (10, 0), y-intercept (0, 6)"
      - "Slope 3/5, x-intercept (6, 0), y-intercept (0, −10)"
      - "Slope 3, x-intercept (10, 0), y-intercept (0, −6)"
    option_explanations:
      - |
        Correct. −a/b = −3/(−5) = 3/5; y = 0 gives x = 10; x = 0 gives −5y = 30, y = −6.
      - |
        The two negatives make the slope positive, and the y-intercept is −6.
      - |
        The intercepts are swapped: 30/3 = 10 is the x-intercept.
      - |
        3 is the coefficient of x, not the slope; y has not been isolated.
    answer: 0

  # ---- Stimulus set B: a systems situation (2.12, 2.13, 2.17)
  - slug: alg1-u02-exam-q12
    type: multiple_choice
    topic_code: "2.12"
    source: "IM Algebra 1, Unit 2, Lesson 12"
    points: 1
    stimulus: |
      A cinema sold 250 tickets for a screening and took in $2,350. Adult tickets cost $11 and child tickets cost $7. Let a be the number of adult tickets and c the number of child tickets.
    prompt: |
      Which system models the sale?
    options:
      - "a + c = 250 and 11a + 7c = 2350"
      - "a + c = 2350 and 11a + 7c = 250"
      - "a + c = 250 and 7a + 11c = 2350"
      - "11a + 7c = 250 and a + c = 2350"
    option_explanations:
      - |
        Correct. Counting tickets gives the first equation; counting dollars at $11 and $7 gives the second.
      - |
        The totals are swapped between the equations.
      - |
        The prices are attached to the wrong ticket types.
      - |
        Both totals are attached to the wrong expressions.
    answer: 0

  - slug: alg1-u02-exam-q13
    type: multiple_choice
    topic_code: "2.13"
    source: "IM Algebra 1, Unit 2, Lesson 13"
    points: 1
    stimulus: |
      A cinema sold 250 tickets for a screening and took in $2,350. Adult tickets cost $11 and child tickets cost $7. Let a be the number of adult tickets and c the number of child tickets.
    prompt: |
      How many adult tickets were sold?
    options:
      - "150"
      - "100"
      - "200"
      - "125"
    option_explanations:
      - |
        Correct. c = 250 − a gives 11a + 7(250 − a) = 2350, so 4a + 1750 = 2350, a = 150 (and c = 100). Check: 1650 + 700 = 2350.
      - |
        100 is the number of child tickets sold, not the number of adult tickets the question asks for.
      - |
        200 adults and 50 children would bring in 2200 + 350 = $2,550.
      - |
        125 of each would bring in 1375 + 875 = $2,250.
    answer: 0

  - slug: alg1-u02-exam-q14
    type: multiple_choice
    topic_code: "2.17"
    source: "IM Algebra 1, Unit 2, Lesson 17"
    points: 1
    stimulus: |
      A cinema sold 250 tickets for a screening and took in $2,350. Adult tickets cost $11 and child tickets cost $7. Let a be the number of adult tickets and c the number of child tickets.
    prompt: |
      Suppose instead both ticket types had cost $9. What would the system a + c = 250 and 9a + 9c = 2350 tell you?
    options:
      - "It has no solution: the second equation requires a + c = 261.1, which contradicts a + c = 250."
      - "It has infinitely many solutions because both equations have the same slope."
      - "It has the single solution a = 125, c = 125."
      - "It has exactly two solutions."
    option_explanations:
      - |
        Correct. Dividing the second equation by 9 gives a + c ≈ 261.1, a parallel line to a + c = 250; the reported totals would be inconsistent.
      - |
        Same slope with different intercepts means parallel lines, so no solution rather than infinitely many.
      - |
        125 + 125 = 250 but 9(250) = 2250, not 2350.
      - |
        A linear system never has exactly two solutions.
    answer: 0

  # ---- Elimination and classification (2.14, 2.15, 2.16, 2.17)
  - slug: alg1-u02-exam-q15
    type: multiple_choice
    topic_code: "2.14"
    source: "IM Algebra 1, Unit 2, Lesson 14"
    points: 1
    prompt: |
      Solve the system 7x + 2y = 31 and 3x − 2y = 9.
    options:
      - "(4, 1.5)"
      - "(1.5, 4)"
      - "(5, −2)"
      - "(3, 5)"
    option_explanations:
      - |
        Correct. Adding eliminates y: 10x = 40, x = 4; then 28 + 2y = 31, y = 1.5. Check: 12 − 3 = 9.
      - |
        The coordinates are reversed; 7(1.5) + 2(4) = 18.5, not 31.
      - |
        35 − 4 = 31 fits the first equation, but 15 + 4 = 19, not 9.
      - |
        21 + 10 = 31 fits the first equation, but 9 − 10 = −1, not 9.
    answer: 0

  - slug: alg1-u02-exam-q16
    type: multiple_choice
    topic_code: "2.15"
    source: "IM Algebra 1, Unit 2, Lesson 15"
    points: 1
    prompt: |
      To solve 5x + 3y = 1 and 2x − y = 7 by elimination, which single multiplication sets up the cancellation of y?
    options:
      - "Multiply the second equation by 3, then add"
      - "Multiply the first equation by 2, then subtract"
      - "Multiply the second equation by −5, then add"
      - "Multiply the first equation by 3, then add"
    option_explanations:
      - |
        Correct. The second becomes 6x − 3y = 21; adding gives 11x = 22, x = 2, and then y = −3.
      - |
        Doubling the first gives 10x + 6y = 2; subtracting 2x − y = 7 leaves 8x + 7y = −5, nothing cancelled.
      - |
        That gives −10x + 5y = −35; adding to the first gives −5x + 8y = −34, nothing cancelled.
      - |
        Tripling the first gives 15x + 9y = 3; adding 2x − y = 7 gives 17x + 8y = 10, nothing cancelled.
    answer: 0

  - slug: alg1-u02-exam-q17
    type: multiple_choice
    topic_code: "2.16"
    source: "IM Algebra 1, Unit 2, Lesson 16"
    points: 1
    prompt: |
      Solve the system 4x + 6y = 2 and 6x + 9y = 3.
    options:
      - "There are infinitely many solutions; the equations describe the same line."
      - "There is no solution; the lines are parallel."
      - "The solution is (2, −1)."
      - "The solution is (0.5, 0)."
    option_explanations:
      - |
        Correct. Multiplying the first by 3 and the second by 2 gives 12x + 18y = 6 both times; subtracting gives 0 = 0, so every point on 2x + 3y = 1 is a solution.
      - |
        Parallel lines would give a false statement such as 0 = 1; here the statement is true.
      - |
        8 − 6 = 2 fits the first equation and 12 − 9 = 3 fits the second, so (2, −1) is a solution, but it is only one of infinitely many.
      - |
        2 + 0 = 2 and 3 + 0 = 3 both hold, so (0.5, 0) is also a solution, one of infinitely many.
    answer: 0

  - slug: alg1-u02-exam-q18
    type: multiple_choice
    topic_code: "2.17"
    source: "IM Algebra 1, Unit 2, Lesson 17"
    points: 1
    prompt: |
      Which system has exactly one solution?
    options:
      - "y = 3x + 2 and y = 3x − 5"
      - "y = 3x + 2 and 2y = 6x + 4"
      - "y = 3x + 2 and y = −3x + 2"
      - "y = 3x + 2 and 6x − 2y = 1"
    option_explanations:
      - |
        Same slope, different intercepts: parallel, no solution.
      - |
        Halving the second gives y = 3x + 2: the same line, infinitely many solutions.
      - |
        Correct. Slopes 3 and −3 differ, so the lines cross once, at (0, 2).
      - |
        Rewriting gives y = 3x − 0.5: same slope as the first with a different intercept, so no solution.
    answer: 2

  # ---- Inequalities (2.18-2.23)
  - slug: alg1-u02-exam-q19
    type: multiple_choice
    topic_code: "2.18"
    source: "IM Algebra 1, Unit 2, Lesson 18"
    points: 1
    prompt: |
      A bridge has a weight limit of 12 tonnes. A truck weighs 4.5 tonnes empty and each pallet it carries weighs 0.6 tonnes. Which inequality describes the number of pallets p the truck may carry across?
    options:
      - "4.5 + 0.6p ≤ 12"
      - "4.5 + 0.6p < 12"
      - "0.6 + 4.5p ≤ 12"
      - "4.5 + 0.6p ≥ 12"
    option_explanations:
      - |
        Correct. The total weight must not exceed the limit; a load of exactly 12 tonnes is allowed, so ≤.
      - |
        A weight limit of 12 tonnes permits exactly 12 tonnes, so the inequality is not strict.
      - |
        The constants are swapped: the truck is 4.5 tonnes and each pallet 0.6.
      - |
        The limit caps the weight from above, not below.
    answer: 0

  - slug: alg1-u02-exam-q20
    type: multiple_choice
    topic_code: "2.19"
    source: "IM Algebra 1, Unit 2, Lesson 19"
    points: 1
    prompt: |
      Which number-line graph shows the solutions of 3x + 4 < 19?
    options:
      - "Open circle at 5, shaded to the left"
      - "Closed circle at 5, shaded to the left"
      - "Open circle at 5, shaded to the right"
      - "Open circle at 7.67, shaded to the left"
    option_explanations:
      - |
        Correct. The boundary is 3x = 15, x = 5; < excludes it; testing x = 0 gives 4 < 19, true, so shade left.
      - |
        The strict inequality excludes the boundary, so the circle is open.
      - |
        Testing x = 10 gives 34 < 19, false, so the right side is not the solution.
      - |
        7.67 comes from dividing 19 by 3 without subtracting 4 first.
    answer: 0

  - slug: alg1-u02-exam-q21
    type: multiple_choice
    topic_code: "2.20"
    source: "IM Algebra 1, Unit 2, Lesson 20"
    points: 1
    prompt: |
      What is the solution of 8 − 5x ≥ −7?
    options:
      - "x ≤ 3"
      - "x ≥ 3"
      - "x ≤ −3"
      - "x ≥ −3"
    option_explanations:
      - |
        Correct. −5x ≥ −15, and dividing by −5 reverses the symbol: x ≤ 3. Check x = 0: 8 ≥ −7, true.
      - |
        Dividing by a negative must reverse the symbol; x = 10 gives −42 ≥ −7, false.
      - |
        −15 divided by −5 is positive 3, so the boundary is 3.
      - |
        Both the boundary's sign and the direction are wrong.
    answer: 0

  - slug: alg1-u02-exam-q22
    type: multiple_choice
    topic_code: "2.21"
    source: "IM Algebra 1, Unit 2, Lesson 21"
    points: 1
    prompt: |
      Which description correctly graphs 2x + y ≤ 6?
    options:
      - "Solid line through (3, 0) and (0, 6), shaded toward the origin"
      - "Dashed line through (3, 0) and (0, 6), shaded toward the origin"
      - "Solid line through (3, 0) and (0, 6), shaded away from the origin"
      - "Solid line through (6, 0) and (0, 3), shaded toward the origin"
    option_explanations:
      - |
        Correct. Intercepts (3, 0) and (0, 6); ≤ makes the line solid; (0, 0) gives 0 ≤ 6, true, so shade the origin's side.
      - |
        The symbol ≤ includes the boundary, so the line is solid.
      - |
        (0, 0) satisfies the inequality, so the shaded side contains the origin.
      - |
        The x-intercept is 6/2 = 3 and the y-intercept is 6; they are swapped here.
    answer: 0

  - slug: alg1-u02-exam-q23
    type: multiple_choice
    topic_code: "2.22"
    source: "IM Algebra 1, Unit 2, Lesson 22"
    points: 1
    prompt: |
      Graph description: a dashed line passes through (0, 1) and (2, 5); the region below and to the right of it is shaded. Which inequality is graphed?
    options:
      - "y < 2x + 1"
      - "y ≤ 2x + 1"
      - "y > 2x + 1"
      - "y < (1/2)x + 1"
    option_explanations:
      - |
        Correct. Slope 2, intercept 1; a shaded point such as (3, 0) gives 0 < 7, true; dashed means strict.
      - |
        A dashed line means points on it are not solutions, so the symbol is strict.
      - |
        (3, 0) is shaded and 0 > 7 is false, so > is the wrong direction.
      - |
        The slope through the two points is 4/2 = 2, not 1/2.
    answer: 0

  - slug: alg1-u02-exam-q24
    type: multiple_choice
    topic_code: "2.23"
    source: "IM Algebra 1, Unit 2, Lesson 23"
    points: 1
    prompt: |
      A charity run needs at least 300 volunteers' hours. Morning shifts are 4 hours and afternoon shifts are 3 hours. With m morning shifts and a afternoon shifts, which combination meets the need?
    options:
      - "40 morning and 50 afternoon"
      - "30 morning and 50 afternoon"
      - "50 morning and 20 afternoon"
      - "20 morning and 60 afternoon"
    option_explanations:
      - |
        Correct. 4(40) + 3(50) = 160 + 150 = 310 ≥ 300.
      - |
        4(30) + 3(50) = 120 + 150 = 270, below 300.
      - |
        4(50) + 3(20) = 200 + 60 = 260, below 300.
      - |
        4(20) + 3(60) = 80 + 180 = 260, below 300.
    answer: 0

  # ---- Stimulus set C: a system of inequalities (2.24, 2.25, 2.26)
  - slug: alg1-u02-exam-q25
    type: multiple_choice
    topic_code: "2.25"
    source: "IM Algebra 1, Unit 2, Lesson 25"
    points: 1
    stimulus: |
      A small workshop builds bookshelves and desks. A bookshelf takes 3 hours and a desk takes 5 hours; the workshop has 60 hours this week. The owner has promised at least 4 desks, and each bookshelf uses 2 sheets of plywood while each desk uses 1 sheet, with 30 sheets available. Let b be the number of bookshelves and d the number of desks.
    prompt: |
      Which system represents the constraints (with non-negativity)?
    options:
      - "3b + 5d ≤ 60, d ≥ 4, 2b + d ≤ 30, b ≥ 0"
      - "3b + 5d ≥ 60, d ≤ 4, 2b + d ≤ 30, b ≥ 0"
      - "5b + 3d ≤ 60, d ≥ 4, b + 2d ≤ 30, b ≥ 0"
      - "3b + 5d ≤ 60, d ≥ 4, 2b + d ≥ 30, b ≥ 0"
    option_explanations:
      - |
        Correct. Hours and plywood are limits (≤) and the desk promise is a minimum (≥).
      - |
        The hours are a limit, not a minimum, and "at least 4 desks" is d ≥ 4.
      - |
        The hours and plywood coefficients are attached to the wrong products.
      - |
        The plywood supply caps 2b + d from above.
    answer: 0

  - slug: alg1-u02-exam-q26
    type: multiple_choice
    topic_code: "2.24"
    source: "IM Algebra 1, Unit 2, Lesson 24"
    points: 1
    stimulus: |
      A small workshop builds bookshelves and desks. A bookshelf takes 3 hours and a desk takes 5 hours; the workshop has 60 hours this week. The owner has promised at least 4 desks, and each bookshelf uses 2 sheets of plywood while each desk uses 1 sheet, with 30 sheets available. Let b be the number of bookshelves and d the number of desks.
    prompt: |
      Which production plan satisfies every constraint?
    options:
