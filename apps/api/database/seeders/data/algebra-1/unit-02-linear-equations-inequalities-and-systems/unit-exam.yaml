  # ---- True/false (2.4, 2.21, 2.14)
  - slug: alg1-u02-exam-q33
    type: true_false
    topic_code: "2.4"
    source: "IM Algebra 1, Unit 2, Lesson 4"
    points: 1
    prompt: |
      True or false: a linear equation in two variables, such as 3x + 4y = 24, has infinitely many solutions.
    answer: true
    explanation: |
      True. Every point on the line is a solution: (0, 6), (4, 3), (8, 0), (2, 4.5) and so on. Context may restrict which solutions make sense, but the equation itself has infinitely many.

