  # ---- Free response
  - slug: alg1-u02-exam-q43
    type: short_answer
    topic_code: "2.12"
    source: "IM Algebra 1, Unit 2, Lesson 12"
    points: 3
    prompt: |
      A gym offers two plans. Plan A costs $40 a month plus $5 per class. Plan B costs $10 a month plus $8 per class.

      (a) Write a system of equations for the monthly cost C with c classes on each plan.
      (b) Solve the system and interpret the solution.
      (c) State which plan is cheaper for someone taking 6 classes a month and which for 15, with the costs.
    answer: |
      (a) C = 40 + 5c and C = 10 + 8c.
      (b) 40 + 5c = 10 + 8c gives 30 = 3c, c = 10, C = 90. At 10 classes a month both plans cost $90.
      (c) 6 classes: A costs $70, B costs $58, so B is cheaper. 15 classes: A costs $115, B costs $130, so A is cheaper.
    explanation: |
      Three points, one per part.

      (a) 1 pt: both equations.

      (b) 1 pt: (10, 90) with interpretation.

      (c) 1 pt: both comparisons with correct costs.

  - slug: alg1-u02-exam-q44
    type: short_answer
    topic_code: "2.7"
    source: "IM Algebra 1, Unit 2, Lesson 7"
    points: 3
    prompt: |
      A student solved 2(3x − 4) = 4x + 10 and wrote:

      Line 1: 6x − 8 = 4x + 10
      Line 2: 2x − 8 = 10
      Line 3: 2x = 2
      Line 4: x = 1

      (a) Give the reasons for the steps to line 1 and to line 2.
      (b) Find the first incorrect step and explain the error.
      (c) Complete the solution correctly and check it.
    answer: |
      (a) To line 1: distributive property. To line 2: subtract 4x from both sides.
      (b) Line 2 to line 3 is wrong: adding 8 to both sides gives 2x = 18, not 2 (the student subtracted 8 from the right side).
      (c) 2x = 18, x = 9. Check: 2(27 − 4) = 46 and 4(9) + 10 = 46.
    explanation: |
      Three points, one per part.

      (a) 1 pt: both reasons.

      (b) 1 pt: identifies line 3 and the sign error.

      (c) 1 pt: x = 9 with a check in the original equation.

  - slug: alg1-u02-exam-q45
    type: short_answer
    topic_code: "2.23"
    source: "IM Algebra 1, Unit 2, Lesson 23"
    points: 3
    prompt: |
      A student has 20 hours this week to split between a job paying $14 an hour and volunteering, and wants to earn at least $140.

      (a) Write a system of inequalities in j (job hours) and v (volunteer hours), including non-negativity.
      (b) Graph description: describe the boundaries, which are solid or dashed, and which region is shaded.
      (c) Name one combination that meets every constraint and one that meets the time limit but not the earnings goal.
    answer: |
      (a) j + v ≤ 20; 14j ≥ 140, i.e. j ≥ 10; j ≥ 0; v ≥ 0.
      (b) The line j + v = 20 (intercepts (20, 0) and (0, 20)) is solid, shaded toward the origin; the vertical line j = 10 is solid, shaded to the right; with v ≥ 0 the region is the triangle with vertices (10, 0), (20, 0) and (10, 10).
      (c) (12, 5): 17 ≤ 20 and 12 ≥ 10, meets everything. (5, 10): 15 ≤ 20 but 5 < 10, fails the earnings goal.
    explanation: |
      Three points, one per part.

      (a) 1 pt: all constraints.

      (b) 1 pt: correct boundaries, solid lines and the triangular region.

      (c) 1 pt: both examples checked.

  - slug: alg1-u02-exam-q46
    type: long_answer
    topic_code: "2.15"
    source: "IM Algebra 1, Unit 2, Lesson 15"
    points: 6
    prompt: |
      A florist sells two bouquets. The small bouquet uses 5 roses and 3 lilies; the large bouquet uses 8 roses and 6 lilies. On Saturday the florist used exactly 190 roses and 126 lilies.

      (1) Define variables and write a system of equations.
      (2) Solve the system by elimination, showing each step, and check the solution in both equations.
      (3) Rewrite the rose equation in slope-intercept form (large bouquets in terms of small ones) and interpret its slope.
      (4) On Sunday the florist has at most 100 roses and at most 60 lilies and must make at least 4 large bouquets. Write the system of inequalities and determine whether 12 small and 5 large bouquets is a possible plan.
    answer: |
      (1) s = small bouquets, l = large bouquets. 5s + 8l = 190 and 3s + 6l = 126.
      (2) Multiply the first by 3 (15s + 24l = 570) and the second by 5 (15s + 30l = 630). Subtract: 6l = 60, l = 10. Then 5s + 80 = 190, s = 22. Check: 5(22) + 8(10) = 190 and 3(22) + 6(10) = 126.
      (3) 8l = 190 − 5s, so l = 23.75 − (5/8)s. The slope −5/8 means every 8 extra small bouquets use the roses of 5 large bouquets: for a fixed number of roses, 8 more small means 5 fewer large.
      (4) 5s + 8l ≤ 100; 3s + 6l ≤ 60; l ≥ 4; s ≥ 0. Plan (12, 5): roses 60 + 40 = 100 ≤ 100 ✓; lilies 36 + 30 = 66 > 60 ✗. Not possible; it runs out of lilies.
    explanation: |
      Six points.

      (1) 1 pt: variables and both equations.

      (2) 2 pts: 1 for valid elimination steps, 1 for (22, 10) with both checks.

      (3) 1 pt: l = (190 − 5s)/8 with a trade-off interpretation of −5/8.

      (4) 2 pts: 1 for the full system of inequalities, 1 for checking (12, 5) and concluding it fails the lily constraint.

      Common errors: scaling only one side of an equation; stopping after finding l; interpreting the slope as a price; checking only the rose constraint in part 4.
