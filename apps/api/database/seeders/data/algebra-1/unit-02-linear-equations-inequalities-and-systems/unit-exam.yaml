    points: 1
    prompt: |
      True or false: adding the two equations of a system produces an equation that is also satisfied by the system's solution.
    answer: true
    explanation: |
      True. At the solution both equations are true statements that equal quantities are equal, and adding equals to equals keeps equality. This is the justification for elimination.

