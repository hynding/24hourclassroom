week: 6
unit: 2
title: "Graphs of Equations, Equivalent Equations and Solving for a Variable"
topics: ["2.5", "2.6", "2.7", "2.8"]
guide: guides/week-06.md
guide_description: |
  Why the graph of a two-variable equation is the picture of all its solutions, how to graph a line from its
  intercepts and interpret points on and off it, which moves keep equations equivalent and which break them,
  how to justify every solving step, and how to solve an equation for a chosen variable.
flashcards_description: |
  28 cards on graphs and intercepts, equivalent equations, the acceptable moves and the invalid ones, step
  justifications, and rearranging a formula for one variable.

flashcards:
  - front: Graph of a two-variable equation → what the points are
    back: |
      Every point on the graph is a solution (its coordinates satisfy the equation) and every solution is a point on the graph. For a linear equation the graph is a straight line.
    topic_code: "2.5"
  - front: Point not on the graph → what it means
    back: |
      Its coordinates do not satisfy the equation. If the graph of a cost equation misses (10, 80), then 10 items do not cost $80.
    topic_code: "2.5"
  - front: x-intercept and y-intercept → how to find each
    back: |
      For the y-intercept set x = 0 and solve for y; for the x-intercept set y = 0 and solve for x. Each is a point: (0, b) and (a, 0).
    topic_code: "2.5"
  - front: Graphing a linear equation quickly → the intercept method
    back: |
      Find the two intercepts, plot them, draw the line through them, then check a third solution lies on the line.
    topic_code: "2.5"
  - front: Intercepts of 5s + 2d = 60 in context (sandwiches at $5, drinks at $2)
    back: |
      (0, 30): no sandwiches and 30 drinks make $60. (12, 0): 12 sandwiches and no drinks make $60. Points between integer solutions have no meaning because items are sold whole.
    topic_code: "2.5"
  - front: Intercepts of 3x − 4y = 24
    back: |
      x = 0 gives −4y = 24, so y = −6: point (0, −6). y = 0 gives 3x = 24, so x = 8: point (8, 0).
    topic_code: "2.5"
  - front: Equivalent equations → definition
    back: |
      Equations with exactly the same solutions. 3x + 2 = 11, 3x = 9 and x = 3 are equivalent; each is true only for x = 3.
    topic_code: "2.6"
  - front: Three moves that keep an equation equivalent
    back: |
      1. Add or subtract the same quantity on both sides. 2. Multiply or divide both sides by the same non-zero number. 3. Replace either side with an equal expression (distribute, combine like terms).
    topic_code: "2.6"
  - front: Moves that break equivalence
    back: |
      Doing something to only one side (or only part of a side), multiplying both sides by zero, or dividing by an expression that could be zero.
    topic_code: "2.6"
  - front: Why dividing x² = 3x by x is not safe
    back: |
      x could be 0, and dividing by 0 is undefined. The step loses the solution x = 0: the original has solutions 0 and 3, the result x = 3 has only one.
    topic_code: "2.6"
  - front: Are 4(y − 2) = 20 and y − 2 = 5 equivalent?
    back: |
      Yes. The second comes from dividing both sides of the first by 4, and both have the single solution y = 7.
    topic_code: "2.6"
  - front: Are x + 3 = 8 and 2x + 3 = 16 equivalent?
    back: |
      No. The right side was doubled but only the x term on the left was. Their solutions are 5 and 6.5.
    topic_code: "2.6"
  - front: Equivalent to 6x − 4 = 20 → is it 6x = 16 or 3x − 2 = 10?
    back: |
      3x − 2 = 10 (both sides divided by 2). 6x = 16 subtracted 4 from one side only; its solution is 8/3, not 4.
    topic_code: "2.6"
  - front: Justifying a solving step → what to write beside each line
    back: |
      The move used: "distributive property", "combine like terms", "subtract 3x from both sides", "divide both sides by 4". Every line should follow from the one above by one named move.
    topic_code: "2.7"
  - front: Solve 5(x − 3) + 2x = 3x + 13 with reasons
    back: |
      5x − 15 + 2x = 3x + 13 (distribute); 7x − 15 = 3x + 13 (combine); 4x − 15 = 13 (subtract 3x); 4x = 28 (add 15); x = 7 (divide by 4). Check: both sides equal 34.
    topic_code: "2.7"
  - front: Spotting an invalid step → the test
    back: |
      Ask whether the same operation was applied to the whole of both sides. If only one side, or only one term, was changed, the step is invalid and the solutions change.
    topic_code: "2.7"
  - front: From 2x + 6 = 10 to x + 6 = 5 → valid?
    back: |
      No. Halving must apply to every term: x + 3 = 5. Here the 6 was left alone, so the new equation has solution −1 instead of 2.
    topic_code: "2.7"
  - front: From 4x = 4y to x = y → valid? From xy = xz to y = z?
    back: |
      The first is valid: divide both sides by the non-zero number 4. The second is not safe: x might be 0, in which case y and z need not be equal.
    topic_code: "2.7"
  - front: Checking a solution → the last step of every solve
    back: |
      Substitute the value into the original equation (not an intermediate line) and confirm both sides are equal. A check catches invalid steps and arithmetic slips.
    topic_code: "2.7"
  - front: Solving for a variable → what it means
    back: |
      Rewriting an equation so the chosen letter is alone on one side, with everything else on the other. The moves are the same as for a numeric equation; the other letters stay letters.
    topic_code: "2.8"
  - front: Why solve for a variable instead of substituting each time?
    back: |
      When the same quantity must be found for many inputs, solving once (p = (C − 40)/11) turns each later question into one substitution instead of a fresh solve.
    topic_code: "2.8"
  - front: Solve P = 2l + 2w for w
    back: |
      Subtract 2l from both sides: P − 2l = 2w. Divide both sides by 2: w = (P − 2l)/2. For P = 30 and l = 9, w = 6.
    topic_code: "2.8"
  - front: Solve 3x + 5y = 30 for y
    back: |
      Subtract 3x: 5y = 30 − 3x. Divide the whole right side by 5: y = (30 − 3x)/5, which is 6 − (3/5)x.
    topic_code: "2.8"
  - front: Solve d = rt for t
    back: |
      Divide both sides by r: t = d/r. With d = 300 and r = 60, t = 5.
    topic_code: "2.8"
  - front: Solve A = (1/2)bh for h
    back: |
      Multiply both sides by 2: 2A = bh. Divide both sides by b: h = 2A/b.
    topic_code: "2.8"
  - front: Error to spot → "from 5y = 30 − 3x, y = 30 − 3x/5"
    back: |
      Dividing by 5 must apply to the whole right side: y = (30 − 3x)/5. Without the parentheses only the 3x was divided.
    topic_code: "2.8"
  - front: Error to spot → "(3, 4) is on the graph of 2x + y = 8 because it is near the line"
    back: |
      Near is not on. 2(3) + 4 = 10, not 8, so (3, 4) is not a solution and is not on the graph. Only exact solutions are on the line.
    topic_code: "2.5"
  - front: Error to spot → "x-intercept of 2x + y = 8 is (0, 4)"
    back: |
      The x-intercept has y = 0: 2x = 8 gives x = 4, so the point is (4, 0). (0, 8) is the y-intercept. Swapping the coordinates puts the point on the wrong axis.
    topic_code: "2.5"

quiz:
  description: |
    24 questions · about 45 minutes · graphs of two-variable equations and intercepts, equivalent equations,
    justifying and spotting invalid steps, and solving for a variable (lessons 2.5 to 2.8), with review of
    writing equations from week 5 and statistics from unit 1. Multiple choice, select-all, true/false and
    numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers and
    the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: alg1-u02-w06-q01
      type: multiple_choice
      topic_code: "2.5"
      source: "IM Algebra 1, Unit 2, Lesson 5"
      points: 1
      prompt: |
        What is the x-intercept of the graph of 4x + 3y = 24?
      options:
        - "(0, 8)"
        - "(6, 0)"
        - "(0, 6)"
        - "(8, 0)"
      option_explanations:
        - |
          (0, 8) is the y-intercept: setting x = 0 gives 3y = 24, so y = 8.
        - |
          Correct. Setting y = 0 gives 4x = 24, so x = 6, and the point is (6, 0).
        - |
          A point with x = 0 lies on the y-axis, and 3(6) = 18, not 24, so it is not even a solution.
        - |
          4(8) = 32, not 24, so (8, 0) is not on the graph.
      answer: 1

    - slug: alg1-u02-w06-q02
      type: multiple_choice
      topic_code: "2.5"
      source: "IM Algebra 1, Unit 2, Lesson 5"
      points: 1
      prompt: |
        The graph of the equation relating the number of hours h a technician works and the charge C in dollars passes through the point (3, 190). What does this point tell you?
      options:
        - "Three technicians charge $190 together."
        - "A job that takes 3 hours costs $190."
        - "The charge per hour is $190."
        - "The technician works 190 hours for $3."
      option_explanations:
        - |
          The horizontal coordinate is hours, not the number of technicians.
        - |
          Correct. A point on the graph is a solution: the pair h = 3, C = 190 satisfies the equation.
        - |
          $190 is the total charge for 3 hours, which would be about $63 per hour if there were no fixed fee.
        - |
          The coordinates are in the order (hours, charge), not the reverse.
      answer: 1

    - slug: alg1-u02-w06-q03
      type: multiple_choice
      topic_code: "2.6"
      source: "IM Algebra 1, Unit 2, Lesson 6"
      points: 1
      prompt: |
        Which equation is equivalent to 8x − 12 = 20?
      options:
        - "8x = 8"
        - "2x − 3 = 5"
        - "x − 12 = 2.5"
        - "8x − 12 = 10"
      option_explanations:
        - |
          Subtracting 12 from one side only is not a valid move; adding 12 to both sides gives 8x = 32.
        - |
          Correct. Dividing every term on both sides by 4 gives 2x − 3 = 5, and both equations have solution x = 4.
        - |
          Only the 8x was divided by 8; the 12 was left alone, so the solutions differ.
        - |
          Halving only the right side changes the solution from 4 to 2.75.
      answer: 1

    - slug: alg1-u02-w06-q04
      type: multiple_choice
      topic_code: "2.6"
      source: "IM Algebra 1, Unit 2, Lesson 6"
      points: 1
      prompt: |
        Which move always produces an equivalent equation?
      options:
        - "Multiplying both sides by 0"
        - "Adding 5 to the left side"
        - "Multiplying both sides by 3"
        - "Dividing both sides by x"
      option_explanations:
        - |
          Multiplying by 0 turns every equation into 0 = 0, which is true for every value and loses the solutions.
        - |
          Changing one side only changes the solutions; the same quantity must be added to both sides.
        - |
          Correct. Multiplying both sides by the same non-zero number keeps exactly the same solutions.
        - |
          If x can be 0 the division is undefined and a solution may be lost.
      answer: 2

    - slug: alg1-u02-w06-q05
      type: multiple_choice
      topic_code: "2.7"
      source: "IM Algebra 1, Unit 2, Lesson 7"
      points: 1
      stimulus: |
        A student solves 3(x + 4) = 2x + 20 as follows.

        Line 1: 3x + 12 = 2x + 20
        Line 2: x + 12 = 20
        Line 3: x = 8
      prompt: |
        Which reason justifies going from line 1 to line 2?
      options:
        - "Distributive property"
        - "Subtract 2x from both sides"
        - "Divide both sides by 3"
        - "Combine like terms on the left side"
      option_explanations:
        - |
          The distributive property was used to get line 1 from the original equation, not line 2.
        - |
          Correct. Removing 2x from both sides turns 3x into x on the left and leaves 20 on the right.
        - |
          Dividing by 3 would change 12 to 4 and 2x + 20 to a fraction expression; that is not what happened.
        - |
          There are no like terms on one side to combine; the x terms are on opposite sides.
      answer: 1

    - slug: alg1-u02-w06-q06
      type: multiple_choice
      topic_code: "2.7"
      source: "IM Algebra 1, Unit 2, Lesson 7"
      points: 1
      stimulus: |
        A student solves 3(x + 4) = 2x + 20 as follows.

        Line 1: 3x + 12 = 2x + 20
        Line 2: x + 12 = 20
        Line 3: x = 8
      prompt: |
        Which reason justifies going from line 2 to line 3?
      options:
        - "Subtract 12 from both sides"
        - "Divide both sides by 12"
        - "Add 12 to both sides"
        - "Multiply both sides by 8"
      option_explanations:
        - |
          Correct. Taking 12 from both sides leaves x on the left and 20 − 12 = 8 on the right.
        - |
          Dividing by 12 would give x/12 + 1 on the left, not x alone.
        - |
          Adding 12 would move the equation further from isolating x, giving x + 24 = 32.
        - |
          Multiplying by 8 does not isolate x and has no connection to the result.
      answer: 0

    - slug: alg1-u02-w06-q07
      type: multiple_choice
      topic_code: "2.7"
      source: "IM Algebra 1, Unit 2, Lesson 7"
      points: 1
      stimulus: |
        A student solves 3(x + 4) = 2x + 20 as follows.

        Line 1: 3x + 12 = 2x + 20
        Line 2: x + 12 = 20
        Line 3: x = 8
      prompt: |
        How should the student check that x = 8 is correct?
      options:
        - "Substitute 8 into line 2 only"
        - "Substitute 8 into the original equation and confirm both sides equal 36"
        - "Divide 8 by 3 and see whether the result is a whole number"
        - "Graph the point (8, 0) and see whether it is on an axis"
      option_explanations:
        - |
          Checking an intermediate line would not catch an error made before that line.
        - |
          Correct. 3(8 + 4) = 36 and 2(8) + 20 = 36, so the solution satisfies the original equation.
        - |
          Whether a solution is a whole number has nothing to do with whether it is correct.
        - |
          A one-variable equation's solution is a number, not a point on a graph.
      answer: 1

    - slug: alg1-u02-w06-q08
      type: multiple_choice
      topic_code: "2.8"
      source: "IM Algebra 1, Unit 2, Lesson 8"
      points: 1
      prompt: |
        Solve 2x + 7y = 28 for y.
      options:
        - "y = 28 − 2x/7"
        - "y = (28 − 2x)/7"
        - "y = 4 − 2x"
        - "y = (28 + 2x)/7"
      option_explanations:
        - |
          Only the 2x has been divided by 7; the whole of 28 − 2x must be divided.
        - |
          Correct. Subtract 2x from both sides to get 7y = 28 − 2x, then divide the entire right side by 7.
        - |
          Dividing 28 by 7 gives 4, but 2x must also be divided by 7, giving (2/7)x.
        - |
          2x must be subtracted, not added, when it moves to the other side.
      answer: 1

    - slug: alg1-u02-w06-q09
      type: multiple_choice
      topic_code: "2.8"
      source: "IM Algebra 1, Unit 2, Lesson 8"
      points: 1
      prompt: |
        The formula for the perimeter of a rectangle is P = 2l + 2w. A carpenter has many frames with known perimeter and length and needs each width. Which rearrangement should she use?
      options:
        - "w = P − 2l"
        - "w = (P − 2l)/2"
        - "w = P/2 − l/2"
        - "w = (P − l)/2"
      option_explanations:
        - |
          After subtracting 2l from both sides, the result P − 2l still equals 2w and must be halved.
        - |
          Correct. P − 2l = 2w, and dividing both sides by 2 gives w = (P − 2l)/2, which equals P/2 − l.
        - |
          P/2 − l/2 halves the l term twice over; the correct form is P/2 − l.
        - |
          The length appears as 2l in the formula, so 2l, not l, is subtracted.
      answer: 1

    - slug: alg1-u02-w06-q10
      type: multiple_choice
      topic_code: "2.4"
      source: "IM Algebra 1, Unit 2, Lesson 4"
      points: 1
      prompt: |
        Which pair (x, y) is a solution of x − 2y = 6?
      options:
        - "(2, 2)"
        - "(0, 3)"
        - "(8, 1)"
        - "(4, 1)"
      option_explanations:
        - |
          2 − 4 = −2, not 6, so (2, 2) is not a solution.
        - |
          0 − 6 = −6, not 6; the y-intercept is actually (0, −3).
        - |
          Correct. 8 − 2(1) = 6, so the pair satisfies the equation and the point is on the line.
        - |
          4 − 2 = 2, not 6, so (4, 1) is not on the graph.
      answer: 2

    - slug: alg1-u02-w06-q11
      type: multiple_choice
      topic_code: "2.2"
      source: "IM Algebra 1, Unit 2, Lesson 2"
      points: 1
      prompt: |
        A water tank holds 800 litres and is filled at 35 litres per minute. Which equation gives the volume V after t minutes if it starts with 200 litres?
      options:
        - "V = 800 + 35t"
        - "V = 200 + 35t"
        - "V = 200 − 35t"
        - "V = 35 + 200t"
      option_explanations:
        - |
          800 is the capacity, not the starting volume; the tank starts at 200 litres.
        - |
          Correct. The volume starts at 200 and gains 35 litres each minute.
        - |
          Filling adds water; subtracting would describe draining.
        - |
          The constants are swapped: 35 is the rate per minute and 200 the starting amount.
      answer: 1

    - slug: alg1-u02-w06-q12
      type: multiple_choice
      topic_code: "1.5"
      source: "IM Algebra 1, Unit 1, Lesson 5"
      points: 1
      prompt: |
        For the data 3, 6, 6, 9, 11, 13, 16, 20, which is the interquartile range?
      options:
        - "17"
        - "8.5"
        - "10"
        - "6"
      option_explanations:
        - |
          17 is the range, 20 − 3, the distance between the extremes rather than the quartiles.
        - |
          Correct. Q1 = (6 + 6)/2 = 6 and Q3 = (13 + 16)/2 = 14.5, so IQR = 14.5 − 6 = 8.5.
        - |
          10 is the median, (9 + 11)/2, not a difference of quartiles.
        - |
          6 is Q1 itself, not the width of the middle half.
      answer: 1

    - slug: alg1-u02-w06-q13
      type: multiple_choice
      topic_code: "1.4"
      source: "IM Algebra 1, Unit 1, Lesson 4"
      points: 1
      prompt: |
        A dot plot of the number of siblings for 40 students has its tallest stack at 1, slightly shorter stacks at 0 and 2, and single dots at 4, 5 and 7. Which shape describes it?
      options:
        - "Skewed right"
        - "Skewed left"
        - "Uniform"
        - "Bimodal"
      option_explanations:
        - |
          Correct. The bulk of the data sits at 0 to 2 and a thin tail trails toward the larger values.
        - |
          A left skew would have a tail toward the small values, but the data cannot go below 0 and the tail is on the right.
        - |
          The stacks have very different heights, so the distribution is not flat.
        - |
          There is a single peak at 1, not two separate peaks.
      answer: 0

    - slug: alg1-u02-w06-q14
      type: multi_select
      topic_code: "2.6"
      source: "IM Algebra 1, Unit 2, Lesson 6"
      points: 2
      partial_credit: true
      prompt: |
        Which equations are equivalent to 2(x − 5) = 14? Select all that apply.
      options:
        - "x − 5 = 7"
        - "2x − 10 = 14"
        - "2x − 5 = 14"
        - "x = 12"
        - "2x = 4"
      option_explanations:
        - |
          Correct. Dividing both sides by 2 gives x − 5 = 7, with solution 12.
        - |
          Correct. Distributing the 2 gives 2x − 10 = 14, with solution 12.
        - |
          The 2 was not distributed to the −5; this equation has solution 9.5.
        - |
          Correct. The original has the single solution x = 12, so x = 12 is equivalent to it.
        - |
          Adding 10 to both sides gives 2x = 24, not 4; 2x = 4 has solution 2.
      answer: [0, 1, 3]

    - slug: alg1-u02-w06-q15
      type: multi_select
      topic_code: "2.5"
      source: "IM Algebra 1, Unit 2, Lesson 5"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the graph of 3x + y = 12 are true? Select all that apply.
      options:
        - "The y-intercept is (0, 12)."
        - "The x-intercept is (4, 0)."
        - "The point (2, 6) is on the graph."
        - "The point (3, 2) is on the graph."
        - "Every point on the graph is a solution of the equation."
      option_explanations:
        - |
          Correct. Setting x = 0 gives 3(0) + y = 12, so y = 12 and the intercept is (0, 12).
        - |
          Correct. Setting y = 0 gives 3x = 12, so x = 4.
        - |
          Correct. 3(2) + 6 = 12, so the pair satisfies the equation.
        - |
          3(3) + 2 = 11, not 12, so (3, 2) is not on the line.
        - |
          Correct. The graph is, by definition, the set of all solutions.
      answer: [0, 1, 2, 4]

    - slug: alg1-u02-w06-q16
      type: true_false
      topic_code: "2.6"
      source: "IM Algebra 1, Unit 2, Lesson 6"
      points: 1
      prompt: |
        True or false: the equations 5x = 15 and 5x + 2x = 15 + 2x are equivalent.
      answer: true
      explanation: |
        True. The same quantity, 2x, was added to both sides, which never changes the solutions. Both equations are true exactly when x = 3.

    - slug: alg1-u02-w06-q17
      type: true_false
      topic_code: "2.4"
      source: "IM Algebra 1, Unit 2, Lesson 4"
      points: 1
      prompt: |
        True or false: x = 2 is a solution of the equation 6x + 9 = 21.
      answer: true
      explanation: |
        True. Substituting gives 6(2) + 9 = 12 + 9 = 21, so the equation is true when x = 2. A solution is any value that makes the equation true.

    - slug: alg1-u02-w06-q18
      type: fill_blank
      topic_code: "2.5"
      source: "IM Algebra 1, Unit 2, Lesson 5"
      points: 1
      prompt: |
        The point where a graph crosses the y-axis, found by setting x = 0, is called the ____.
      answer: ["y-intercept", "y intercept", "vertical intercept"]
      explanation: |
        The y-intercept has x-coordinate 0. For 2x + y = 8 it is (0, 8). The x-intercept, found by setting y = 0, is (4, 0).

    - slug: alg1-u02-w06-q19
      type: fill_blank
      topic_code: "2.8"
      source: "IM Algebra 1, Unit 2, Lesson 8"
      points: 1
      prompt: |
        Solving the formula d = rt for r gives r = ____.
      answer: ["d/t", "d ÷ t", "d over t", "r = d/t"]
      explanation: |
        Divide both sides by t: r = d/t. For example, 300 miles in 5 hours is a rate of 300/5 = 60 miles per hour.

    - slug: alg1-u02-w06-q20
      type: numeric
      topic_code: "2.8"
      source: "IM Algebra 1, Unit 2, Lesson 8"
      points: 1
      prompt: |
        The cost of a party is C = 40 + 11p dollars for p pizzas. Solve for p and find the number of pizzas when the cost is $194. Give a whole number.
      answer: { value: 14, tolerance: 0 }
      explanation: |
        p = (C − 40)/11. For C = 194, p = 154/11 = 14 pizzas. Check: 40 + 11(14) = 40 + 154 = 194.

    - slug: alg1-u02-w06-q21
      type: numeric
      topic_code: "1.5"
      source: "IM Algebra 1, Unit 1, Lesson 5"
      points: 1
      prompt: |
        Find the mean absolute deviation of 8, 10, 13, 17. Give your answer to one decimal place.
      answer: { value: 3, tolerance: 0.05 }
      explanation: |
        Mean = 48/4 = 12. Distances from 12: 4, 2, 1, 5, which sum to 12. MAD = 12/4 = 3.0.

    - slug: alg1-u02-w06-q22
      type: short_answer
      topic_code: "2.7"
      source: "IM Algebra 1, Unit 2, Lesson 7"
      points: 3
      prompt: |
        A student solved 4(2x − 1) = 3x + 11 and wrote these lines.

        Line 1: 8x − 4 = 3x + 11
        Line 2: 5x − 4 = 11
        Line 3: 5x = 7
        Line 4: x = 7/5

        (a) Give the reason for the step from the original equation to line 1 and from line 1 to line 2.
        (b) Identify the first incorrect step and explain the error.
        (c) Finish the solution correctly and check it in the original equation.
      answer: |
        (a) Original to line 1: distributive property, 4 × 2x and 4 × (−1). Line 1 to line 2: subtract 3x from both sides.
        (b) Line 2 to line 3 is wrong: to remove −4 you add 4 to both sides, giving 5x = 15, not 5x = 7 (the student subtracted 4 on the right).
        (c) 5x = 15, so x = 3. Check: 4(2(3) − 1) = 4(5) = 20 and 3(3) + 11 = 20. ✓
      explanation: |
        Three points, one per part.

        (a) 1 pt: both reasons named correctly.

        (b) 1 pt: identifies line 3 and states that 4 should have been added to both sides.

        (c) 1 pt: x = 3 with a check in the original equation showing 20 = 20.

    - slug: alg1-u02-w06-q23
      type: short_answer
      topic_code: "2.8"
      source: "IM Algebra 1, Unit 2, Lesson 8"
      points: 3
      prompt: |
        The temperature conversion formula is F = (9/5)C + 32.

        (a) Solve the formula for C.
        (b) Use your formula to convert 68 °F and 212 °F to Celsius.
        (c) Explain why solving for C once is more efficient for a weather station that converts hundreds of readings than solving the original equation each time.
      answer: |
        (a) Subtract 32: F − 32 = (9/5)C. Multiply by 5/9: C = (5/9)(F − 32).
        (b) 68 °F: (5/9)(36) = 20 °C. 212 °F: (5/9)(180) = 100 °C.
        (c) With C isolated, every conversion is a single substitution and arithmetic; solving the original equation for C with each new F repeats the same two algebra steps hundreds of times, with the same chance of a slip each time.
      explanation: |
        Three points, one per part.

        (a) 1 pt: C = (5/9)(F − 32) or an equivalent form such as C = 5(F − 32)/9.

        (b) 1 pt: 20 and 100.

        (c) 1 pt: the rearranged formula turns repeated solving into repeated substitution.

    - slug: alg1-u02-w06-q24
      type: long_answer
      topic_code: "2.5"
      source: "IM Algebra 1, Unit 2, Lesson 5"
      points: 6
      prompt: |
        A theatre sells balcony seats for $8 and floor seats for $12. For one show the ticket income was $960. Let b be the number of balcony seats sold and f the number of floor seats sold.

        (1) Write an equation relating b and f.
        (2) Find both intercepts of its graph and explain what each means for the theatre.
        (3) Give two other solutions that make sense in context and one solution of the equation that does not make sense in context, explaining why.
        (4) Solve the equation for f, and use the result to find the number of floor seats sold if 45 balcony seats were sold.
      answer: |
        (1) 8b + 12f = 960.
        (2) b = 0 gives 12f = 960, f = 80: the point (0, 80) means all $960 came from 80 floor seats. f = 0 gives 8b = 960, b = 120: (120, 0) means 120 balcony seats and no floor seats.
        (3) (30, 60): 240 + 720 = 960; (60, 40): 480 + 480 = 960. The pair (1.5, 79) satisfies the equation (12 + 948 = 960) but makes no sense because seats are sold whole; likewise (150, −20) satisfies it (1200 − 240 = 960) but a negative number of seats is impossible.
        (4) 12f = 960 − 8b, so f = (960 − 8b)/12 = 80 − (2/3)b. For b = 45, f = 80 − 30 = 50 floor seats.
      explanation: |
        Six points.

        (1) 1 pt: 8b + 12f = 960.

        (2) 2 pts: 1 for both intercepts (0, 80) and (120, 0); 1 for interpreting each in context.

        (3) 1 pt: two valid integer solutions and one solution of the equation (non-integer or negative) explained as meaningless.

        (4) 2 pts: 1 for f = (960 − 8b)/12 or equivalent; 1 for f = 50.

        Common errors: swapping the prices; interpreting (0, 80) as 80 balcony seats; dividing only part of the right side when solving for f.
