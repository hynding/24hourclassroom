week: 5
unit: 2
title: "Writing Equations That Model a Situation"
topics: ["2.1", "2.2", "2.3", "2.4"]
guide: guides/week-05.md
guide_description: |
  Turning a situation into symbols: naming the quantities and their units, writing expressions for a fixed cost
  plus a rate, writing equations from descriptions and from tables, and what it means for a number or a pair of
  numbers to be a solution of an equation.
flashcards_description: |
  28 cards on quantities, variables and constants, the three equation patterns (part + part, fixed + rate ×
  amount, rate × time), reading a rule from a table, and testing and interpreting solutions.

flashcards:
  - front: Quantity vs variable vs constant → the difference
    back: |
      A quantity is anything measurable with a unit. A variable is a letter for a quantity that varies or is unknown. A constant is a quantity fixed in the situation, like a $40 room fee.
    topic_code: "2.1"
  - front: First step before writing any equation
    back: |
      List the quantities with their units and assign a letter to each one that varies: "p = number of pizzas, C = total cost in dollars". An undefined letter is a guess, not a model.
    topic_code: "2.1"
  - front: Fixed cost plus a per-item cost → expression pattern
    back: |
      total = fixed + rate × count. A $40 room fee plus $11 per pizza for p pizzas is 40 + 11p dollars.
    topic_code: "2.1"
  - front: Expression vs equation
    back: |
      An expression has no equals sign (40 + 11p); an equation sets two expressions equal (40 + 11p = 106). You evaluate an expression and solve an equation.
    topic_code: "2.1"
  - front: Why write 40 + 11p instead of computing 40 + 11 × 5?
    back: |
      The expression works for every number of pizzas at once. Recognising the pattern once replaces redoing the arithmetic for every case and lets you solve for the count later.
    topic_code: "2.1"
  - front: Equation pattern → total equals part plus part
    back: |
      When two kinds of items contribute to one total, add their contributions: 0.10d + 0.05n = 4.50 for d dimes and n nickels worth $4.50.
    topic_code: "2.2"
  - front: Equation pattern → fixed amount plus rate times amount
    back: |
      A starting value plus a constant change per unit: a taxi fare F after m miles at $3.50 plus $2.25 per mile is F = 3.50 + 2.25m.
    topic_code: "2.2"
  - front: Equation pattern → rate times time
    back: |
      distance = rate × time, and more generally total = rate × quantity. A cyclist at 14 mph for t hours covers d = 14t miles.
    topic_code: "2.2"
  - front: Something that decreases at a steady rate → equation shape
    back: |
      start − rate × time. A 500-litre tank draining at 20 litres per minute holds V = 500 − 20t litres after t minutes.
    topic_code: "2.2"
  - front: Tickets at $6 (students) and $10 (adults) raising $1,320 → equation
    back: |
      6s + 10a = 1320, where s is the number of student tickets and a the number of adult tickets. Each term is price times count.
    topic_code: "2.2"
  - front: Translating "3 more than w" and "5 less than x"
    back: |
      "3 more than w" is w + 3 (not 3w). "5 less than x" is x − 5 (not 5 − x). Order matters in subtraction.
    topic_code: "2.2"
  - front: Translating "twice as many as" and "half of"
    back: |
      "Twice as many as n" is 2n; "half of n" is n/2 or 0.5n. "Twice" multiplies, it never adds 2.
    topic_code: "2.2"
  - front: Reading an equation from a table → the two questions
    back: |
      How much does the output change for each step of 1 in the input (the rate)? What is the output when the input is 0 (the starting value)? Then output = start + rate × input, checked against every row.
    topic_code: "2.3"
  - front: Table with no input-0 row → how to find the starting value
    back: |
      Work backwards from a known row using the rate. If h = 4 gives 80 and the rate is 15 per hour, the value at h = 0 is 80 − 4 × 15 = 20.
    topic_code: "2.3"
  - front: Table x = 0, 1, 2, 3 and P = 20, 35, 50, 65 → equation
    back: |
      P rises by 15 each step and starts at 20, so P = 20 + 15x. Check the last row: 20 + 45 = 65.
    topic_code: "2.3"
  - front: Why check a table rule against every row
    back: |
      Two rows can fit many rules. Values 2, 5, 10, 17 fit n² + 1, not a constant-rate rule; only testing all rows reveals which pattern is right.
    topic_code: "2.3"
  - front: Perimeter of a rectangle whose length is 3 more than its width w → equation
    back: |
      Length = w + 3, so P = 2w + 2(w + 3) = 4w + 6. Express every side in terms of the one variable first.
    topic_code: "2.3"
  - front: Solution of an equation in one variable → definition and test
    back: |
      A value of the variable that makes the equation true. Test by substituting: 40 + 11p = 106 is true for p = 6 (40 + 66 = 106) and false for p = 5.
    topic_code: "2.4"
  - front: Solution of an equation in two variables → what it looks like
    back: |
      A pair of values, one for each variable, that makes the equation true: (120, 60) satisfies 6s + 10a = 1320. Such equations usually have infinitely many solutions.
    topic_code: "2.4"
  - front: How to check whether a pair is a solution
    back: |
      Substitute both values and evaluate each side. If the two sides are equal, the pair is a solution; if not, it is not. Never skip the arithmetic.
    topic_code: "2.4"
  - front: Interpreting a solution in context → what to write
    back: |
      Translate the numbers back into the situation with units: "p = 6 means 6 pizzas cost exactly $106"; "(120, 60) means 120 student and 60 adult tickets raise exactly $1,320".
    topic_code: "2.4"
  - front: Solutions that the context rules out
    back: |
      An equation may have solutions the situation cannot use: a negative number of tickets, or 2.5 pizzas. State the restriction (whole numbers, non-negative) when interpreting.
    topic_code: "2.4"
  - front: Is x = 4 a solution of 3(x − 1) = 2x + 1?
    back: |
      Left side 3(4 − 1) = 9; right side 2(4) + 1 = 9. Equal, so yes.
    topic_code: "2.4"
  - front: Error to spot → "11 + 40p for a $40 fee and $11 per pizza"
    back: |
      The constants are swapped. The fee is paid once (40) and the per-pizza price multiplies the count (11p): 40 + 11p.
    topic_code: "2.1"
  - front: Error to spot → "the solution of x + 3y = 12 is x = 6"
    back: |
      A two-variable equation needs a pair. x = 6 is only a solution together with y = 2: (6, 2). On its own, x = 6 is incomplete.
    topic_code: "2.4"
  - front: Error to spot → rule from the first two rows only
    back: |
      A rule that fits rows 1 and 2 may fail row 3. Test every row before trusting the equation.
    topic_code: "2.3"
  - front: Error to spot → "the bill is 25 + 0.10 for x texts"
    back: |
      The per-text charge must multiply the number of texts: 25 + 0.10x. Forgetting the variable makes the bill the same for every customer.
    topic_code: "2.2"
  - front: Writing a model → the checklist
    back: |
      1. Define each variable with its unit. 2. Identify the constants. 3. Write each contribution to the total. 4. Set the expression equal to the total or the other quantity. 5. Test with a known case.
    topic_code: "2.2"

quiz:
  description: |
    25 questions · about 45 minutes · identifying quantities, writing expressions and equations from situations
    and tables, and testing and interpreting solutions (lessons 2.1 to 2.4), with review of statistics from
    unit 1. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank
    items are matched automatically; the short answers and the long answer are graded by your teacher against
    the scoring notes.
  questions:
    - slug: alg1-u02-w05-q01
      type: multiple_choice
      topic_code: "2.1"
      source: "IM Algebra 1, Unit 2, Lesson 1"
      points: 1
      prompt: |
        A bowling alley charges $8 for shoe rental and $4.50 per game. Which expression gives the cost, in dollars, of renting shoes and playing g games?
      options:
        - "12.50g"
        - "4.50 + 8g"
        - "8g + 4.50"
        - "8 + 4.50g"
      option_explanations:
        - |
          Adding the two prices and multiplying by g charges the shoe fee for every game.
        - |
          This treats $4.50 as the fixed fee and $8 as the per-game price.
        - |
          This charges $8 per game and a single $4.50 fee, the reverse of the situation.
        - |
          Correct. The $8 shoe fee is paid once and $4.50 is multiplied by the number of games.
      answer: 3

    - slug: alg1-u02-w05-q02
      type: multiple_choice
      topic_code: "2.2"
      source: "IM Algebra 1, Unit 2, Lesson 2"
      points: 1
      prompt: |
        A fundraiser sells muffins for $2 each and cupcakes for $3 each and raises $270. If m is the number of muffins and c the number of cupcakes sold, which equation models the situation?
      options:
        - "2m + 3c = 270"
        - "5(m + c) = 270"
        - "m + c = 270"
        - "3m + 2c = 270"
      option_explanations:
        - |
          Correct. Money from muffins is 2m, from cupcakes 3c, and together they make $270.
        - |
          This would mean every item costs $5, which is not the case.
        - |
          This counts items, not dollars; each muffin brings in $2 and each cupcake $3.
        - |
          The prices are attached to the wrong items.
      answer: 0

    - slug: alg1-u02-w05-q03
      type: multiple_choice
      topic_code: "2.2"
      source: "IM Algebra 1, Unit 2, Lesson 2"
      points: 1
      prompt: |
        A candle is 25 cm tall and burns down 1.5 cm per hour. Which equation gives its height h, in cm, after t hours?
      options:
        - "h = 1.5 − 25t"
        - "h = 25 − 1.5t"
        - "h = 25 + 1.5t"
        - "h = 25t − 1.5"
      option_explanations:
        - |
          The constants are swapped: the candle does not start at 1.5 cm.
        - |
          Correct. The height starts at 25 and loses 1.5 cm for each hour, so 25 − 1.5t.
        - |
          Adding would make the candle grow taller as it burns.
        - |
          This multiplies the starting height by time and subtracts a constant, which does not match the situation.
      answer: 1

    - slug: alg1-u02-w05-q04
      type: multiple_choice
      topic_code: "2.3"
      source: "IM Algebra 1, Unit 2, Lesson 3"
      points: 1
      stimulus: |
        | Number of weeks, w | Money saved, S (dollars) |
        |---|---|
        | 0 | 45 |
        | 1 | 60 |
        | 2 | 75 |
        | 3 | 90 |
      prompt: |
        Which equation matches the table?
      options:
        - "S = 60w"
        - "S = 45 + 60w"
        - "S = 15w + 45"
        - "S = 45w + 15"
      option_explanations:
        - |
          At w = 0 this gives 0, but the table shows 45 already saved.
        - |
          At w = 1 this gives 45 + 60 = 105, not the 60 shown in the table.
        - |
          Correct. Savings start at 45 and rise by 15 each week: 15(3) + 45 = 90 matches the last row.
        - |
          At w = 1 this gives 60, but at w = 2 it gives 105, not 75; the roles of 45 and 15 are swapped.
      answer: 2

    - slug: alg1-u02-w05-q05
      type: multiple_choice
      topic_code: "2.3"
      source: "IM Algebra 1, Unit 2, Lesson 3"
      points: 1
      stimulus: |
        | Number of weeks, w | Money saved, S (dollars) |
        |---|---|
        | 0 | 45 |
        | 1 | 60 |
        | 2 | 75 |
        | 3 | 90 |
      prompt: |
        What does the number 15 in the correct equation represent?
      options:
        - "The amount saved before the first week"
        - "The total saved after 15 weeks"
        - "The amount added to the savings each week"
        - "The number of weeks needed to save $45"
      option_explanations:
        - |
          The amount before the first week is 45, the value at w = 0.
        - |
          After 15 weeks the savings would be 45 + 15 × 15 = 270.
        - |
          Correct. Each row's savings is 15 more than the row above, so 15 is the weekly deposit.
        - |
          Fifteen is a rate in dollars per week, not a number of weeks.
      answer: 2

    - slug: alg1-u02-w05-q06
      type: multiple_choice
      topic_code: "2.4"
      source: "IM Algebra 1, Unit 2, Lesson 4"
      points: 1
      stimulus: |
        | Number of weeks, w | Money saved, S (dollars) |
        |---|---|
        | 0 | 45 |
        | 1 | 60 |
        | 2 | 75 |
        | 3 | 90 |
      prompt: |
        Which pair (w, S) is a solution of the equation that models the table, and what does it mean?
      options:
        - "(10, 195): after 10 weeks, $195 has been saved"
        - "(195, 10): after 195 weeks, $10 has been saved"
        - "(5, 100): after 5 weeks, $100 has been saved"
        - "(10, 150): after 10 weeks, $150 has been saved"
      option_explanations:
        - |
          Correct. 15(10) + 45 = 195, and the pair reads as 10 weeks, $195.
        - |
          The order is (weeks, savings); 195 weeks would give far more than $10.
        - |
          15(5) + 45 = 120, not 100, so this pair does not satisfy the equation.
        - |
          15(10) + 45 = 195, not 150; this pair does not satisfy the equation.
      answer: 0

    - slug: alg1-u02-w05-q07
      type: multiple_choice
      topic_code: "2.4"
      source: "IM Algebra 1, Unit 2, Lesson 4"
      points: 1
      prompt: |
        Which value of x is a solution of 5x − 8 = 3x + 6?
      options:
        - "x = 14"
        - "x = 1"
        - "x = 2"
        - "x = 7"
      option_explanations:
        - |
          Left side 70 − 8 = 62, right side 42 + 6 = 48; not equal.
        - |
          Left side 5 − 8 = −3, right side 3 + 6 = 9; not equal.
        - |
          Left side 10 − 8 = 2, right side 6 + 6 = 12; not equal.
        - |
          Correct. Left side 35 − 8 = 27 and right side 21 + 6 = 27, so the equation is true.
      answer: 3

    - slug: alg1-u02-w05-q08
      type: multiple_choice
      topic_code: "2.4"
      source: "IM Algebra 1, Unit 2, Lesson 4"
      points: 1
      prompt: |
        Which pair is NOT a solution of 3x + 2y = 24?
      options:
        - "(0, 12)"
        - "(5, 4)"
        - "(6, 3)"
        - "(4, 6)"
      option_explanations:
        - |
          0 + 24 = 24, so this pair is a solution.
        - |
          Correct. 15 + 8 = 23, not 24, so (5, 4) does not satisfy the equation.
        - |
          18 + 6 = 24, so this pair is a solution.
        - |
          12 + 12 = 24, so this pair is a solution.
      answer: 1

    - slug: alg1-u02-w05-q09
      type: multiple_choice
      topic_code: "2.2"
      source: "IM Algebra 1, Unit 2, Lesson 2"
      points: 1
      prompt: |
        The length of a rectangle is 7 cm less than three times its width w. Which expression gives the length?
      options:
        - "3w + 7"
        - "7 − 3w"
        - "3(w − 7)"
        - "3w − 7"
      option_explanations:
        - |
          "Less than" calls for subtraction, not addition.
        - |
          "7 less than" something means subtract 7 from it, not subtract it from 7.
        - |
          This subtracts 7 from the width before tripling, which is 3w − 21.
        - |
          Correct. Three times the width is 3w, and 7 less than that is 3w − 7.
      answer: 3

    - slug: alg1-u02-w05-q10
      type: multiple_choice
      topic_code: "1.13"
      source: "IM Algebra 1, Unit 1, Lesson 13"
      points: 1
      prompt: |
        Two classes have the same mean score of 72. Class P has standard deviation 2 and class Q has standard deviation 9. Which statement is correct?
      options:
        - "Every student in class P scored 72."
        - "Scores in class Q are typically much farther from 72 than scores in class P."
        - "Class Q has a higher median than class P."
        - "Class P has more students than class Q."
      option_explanations:
        - |
          An SD of 2 means scores are typically about 2 from the mean, not all equal to it.
        - |
          Correct. A larger standard deviation means a larger typical distance from the mean, so Q's scores are more spread out.
        - |
          The SD says nothing about where the median sits; both classes could have the same median.
        - |
          The standard deviation does not depend on the number of students.
      answer: 1

    - slug: alg1-u02-w05-q11
      type: multiple_choice
      topic_code: "2.3"
      source: "IM Algebra 1, Unit 2, Lesson 3"
      points: 1
      prompt: |
        A table pairs x = 3, 5, 7 with y = 17, 27, 37. Which equation fits every row?
      options:
        - "y = 10x − 13"
        - "y = 5x − 2"
        - "y = 5x + 2"
        - "y = 2x + 11"
      option_explanations:
        - |
          10(3) − 13 = 17 fits the first row, but 10(5) − 13 = 37, not 27; the rate per unit of x is 5, not 10.
        - |
          5(3) − 2 = 13, not 17, so this rule fails the very first row.
        - |
          Correct. y rises by 10 when x rises by 2, so the rate is 5; at x = 3, 5(3) + 2 = 17, and 5(5) + 2 = 27, 5(7) + 2 = 37.
        - |
          2(3) + 11 = 17 fits the first row, but 2(5) + 11 = 21, not 27.
      answer: 2

    - slug: alg1-u02-w05-q12
      type: multiple_choice
      topic_code: "1.11"
      source: "IM Algebra 1, Unit 1, Lesson 11"
      points: 1
      prompt: |
        A dot plot of the number of hours 30 students worked last week is skewed right with two students working far more than the rest. Which summary is appropriate for a typical student's hours?
      options:
        - "The median, because it is resistant to the two extreme values"
        - "The standard deviation, because the data are spread out"
        - "The range, because it shows the extremes"
        - "The mean, because it uses all the data"
      option_explanations:
        - |
          Correct. A skewed distribution with extreme values calls for the resistant median.
        - |
          The standard deviation measures spread and is inflated by the extremes.
        - |
          The range is a measure of spread, not of a typical value.
        - |
          Using all the data is exactly why the two extreme values pull the mean away from a typical student.
      answer: 0

    - slug: alg1-u02-w05-q13
      type: multiple_choice
      topic_code: "1.14"
      source: "IM Algebra 1, Unit 1, Lesson 14"
      points: 1
      prompt: |
        A data set has Q1 = 10 and Q3 = 18. Which value is an outlier under the 1.5 × IQR rule?
      options:
        - "31"
        - "−1"
        - "29"
        - "0"
      option_explanations:
        - |
          Correct. The upper fence is 30, and 31 is beyond it.
        - |
          IQR = 8, so the lower fence is 10 − 12 = −2, and −1 is above it.
        - |
          29 is below the upper fence of 18 + 12 = 30.
        - |
          0 lies above the lower fence of 10 − 12 = −2, so it is inside the fences.
      answer: 0

    - slug: alg1-u02-w05-q14
      type: multi_select
      topic_code: "2.4"
      source: "IM Algebra 1, Unit 2, Lesson 4"
      points: 2
      partial_credit: true
      prompt: |
        Which pairs (x, y) are solutions of y = 4x − 3? Select all that apply.
      options:
        - "(2, 5)"
        - "(3, 10)"
        - "(−1, −7)"
        - "(0, −3)"
        - "(1, 1)"
      option_explanations:
        - |
          Correct. Substituting x = 2 gives 4(2) − 3 = 5, which matches y.
        - |
          4(3) − 3 = 9, not 10, so (3, 10) is not a solution.
        - |
          Correct. Substituting x = −1 gives 4(−1) − 3 = −7, which matches y.
        - |
          Correct. Substituting x = 0 gives 4(0) − 3 = −3, which matches y.
        - |
          Correct. Substituting x = 1 gives 4(1) − 3 = 1, which matches y.
      answer: [0, 2, 3, 4]

    - slug: alg1-u02-w05-q15
      type: multi_select
      topic_code: "2.2"
      source: "IM Algebra 1, Unit 2, Lesson 2"
      points: 2
      partial_credit: true
      prompt: |
        A car rental costs $45 per day plus $0.20 per mile. Let d be the number of days and m the number of miles. Which statements are correct? Select all that apply.
      options:
        - "The total cost is 45.20(d + m) dollars."
        - "Renting for 3 days and driving 200 miles costs $175."
        - "The total cost is 45d + 0.20m dollars."
        - "The number 45 is the cost per mile."
        - "If the cost must equal $300, the equation is 45d + 0.20m = 300."
      option_explanations:
        - |
          Adding days to miles mixes units, and 45.20 is not a rate for either.
        - |
          Correct. 45(3) + 0.20(200) = 135 + 40 = 175.
        - |
          Correct. Days multiply the daily rate and miles multiply the per-mile rate.
        - |
          45 is the cost per day; 0.20 is the cost per mile.
        - |
          Correct. Setting the cost expression equal to 300 gives the constraint.
      answer: [1, 2, 4]

    - slug: alg1-u02-w05-q16
      type: true_false
      topic_code: "2.4"
      source: "IM Algebra 1, Unit 2, Lesson 4"
      points: 1
      prompt: |
        True or false: an equation in two variables such as 2x + y = 11 has exactly one solution.
      answer: false
      explanation: |
        False. Every pair (x, y) with y = 11 − 2x is a solution, so there are infinitely many: (0, 11), (2, 7), (5, 1), (−1, 13) and so on. Context may limit which ones make sense.

    - slug: alg1-u02-w05-q17
      type: true_false
      topic_code: "1.10"
      source: "IM Algebra 1, Unit 1, Lesson 10"
      points: 1
      prompt: |
        True or false: adding one very large value to a data set changes the median much more than it changes the mean.
      answer: false
      explanation: |
        False. It is the other way round. The mean uses the size of every value and is pulled toward the new extreme; the median only shifts by at most one position in the ordered list.

    - slug: alg1-u02-w05-q18
      type: fill_blank
      topic_code: "2.4"
      source: "IM Algebra 1, Unit 2, Lesson 4"
      points: 1
      prompt: |
        A value of the variable that makes an equation true is called a ____ of the equation.
      answer: ["solution", "root"]
      explanation: |
        A solution makes the equation a true statement when substituted. For a one-variable equation it is a number; for a two-variable equation it is a pair.

    - slug: alg1-u02-w05-q19
      type: fill_blank
      topic_code: "2.1"
      source: "IM Algebra 1, Unit 2, Lesson 1"
      points: 1
      prompt: |
        A plumber charges a $60 call-out fee plus $45 per hour. The cost of a job lasting h hours is ____ dollars.
      answer: ["60 + 45h", "45h + 60", "60+45h", "45h+60", "60 + 45 h"]
      explanation: |
        The call-out fee is a constant paid once and the hourly rate multiplies the number of hours: 60 + 45h.

    - slug: alg1-u02-w05-q20
      type: numeric
      topic_code: "2.4"
      source: "IM Algebra 1, Unit 2, Lesson 4"
      points: 1
      prompt: |
        The equation 4x + 3y = 50 describes the number of 4-point and 3-point questions on a test worth 50 points. If there are 8 four-point questions, how many three-point questions are there? Give a whole number.
      answer: { value: 6, tolerance: 0 }
      explanation: |
        Substitute x = 8: 32 + 3y = 50, so 3y = 18 and y = 6. The pair (8, 6) is a solution: 8 four-point and 6 three-point questions make 50 points.

    - slug: alg1-u02-w05-q21
      type: numeric
      topic_code: "1.5"
      source: "IM Algebra 1, Unit 1, Lesson 5"
      points: 1
      prompt: |
        Find the mean of the data 14, 17, 21, 21, 27. Give a whole number.
      answer: { value: 20, tolerance: 0 }
      explanation: |
        The sum is 14 + 17 + 21 + 21 + 27 = 100, and 100/5 = 20. The median is 21, a little above the mean because the smallest value is far from the rest.

    - slug: alg1-u02-w05-q22
      type: short_answer
      topic_code: "2.3"
      source: "IM Algebra 1, Unit 2, Lesson 3"
      points: 3
      stimulus: |
        A community pool charges members a flat monthly fee plus a charge per visit. The table shows three members' bills for one month.

        | Visits | Bill (dollars) |
        |---|---|
        | 4 | 34 |
        | 7 | 43 |
        | 12 | 58 |
      prompt: |
        (a) Find the charge per visit and the monthly fee, showing how you used the table.
        (b) Write an equation for the bill B after v visits.
        (c) A member's bill was $70. Explain how to find the number of visits and give it.
      answer: |
        (a) From 4 to 7 visits the bill rises 9 dollars over 3 visits, so $3 per visit; check 7 to 12: 15 dollars over 5 visits, again $3. Working back from 4 visits: 34 − 4 × 3 = 22, so the monthly fee is $22.
        (b) B = 22 + 3v.
        (c) Set 22 + 3v = 70, so 3v = 48 and v = 16 visits.
      explanation: |
        Three points, one per part.

