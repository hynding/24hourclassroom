      source: "IM Algebra 1, Unit 1, Lesson 2"
      points: 1
      prompt: |
        True or false: the median of an even number of values is the mean of the two middle values once the data are in order.
      answer: true
      explanation: |
        True. With an even count there is no single middle value, so the median is halfway between the two middle values. The data must be ordered first.

    - slug: alg1-u02-w05-q23
      type: long_answer
      topic_code: "2.2"
      source: "IM Algebra 1, Unit 2, Lesson 2"
      points: 6
      prompt: |
        A school club is ordering T-shirts. The printer charges a one-time setup fee of $35 and $7.50 per shirt. The club has budgeted $260 and also plans to sell each shirt for $12.

        (1) Define variables and write an expression for the printer's total charge for the order.
        (2) Write an equation that says the order uses the whole budget, and find how many shirts that is.
        (3) Write an expression for the money the club collects if it sells every shirt in an order of n shirts, and an expression for the club's profit (money collected minus printer's charge).
        (4) Is n = 30 a solution of the equation profit = 100? Show your check and interpret the result.
      answer: |
        (1) n = number of shirts; charge = 35 + 7.50n dollars.
        (2) 35 + 7.50n = 260, so 7.50n = 225 and n = 30 shirts.
        (3) Money collected = 12n; profit = 12n − (35 + 7.50n) = 4.50n − 35.
        (4) 4.50(30) − 35 = 135 − 35 = 100, so yes: ordering and selling 30 shirts gives a profit of exactly $100, which also happens to be the order that uses the whole budget.
      explanation: |
        Six points.

        (1) 1 pt: variable defined and the charge 35 + 7.50n.

        (2) 2 pts: 1 for the equation 35 + 7.50n = 260, 1 for n = 30.

        (3) 2 pts: 1 for 12n, 1 for the profit 4.50n − 35 (accept the unsimplified difference).

        (4) 1 pt: substitutes 30, shows 100 and interprets in context.

        Common errors: writing 35n + 7.50; forgetting to subtract the setup fee in the profit; checking the equation with n = 30 but not stating what the result means.
