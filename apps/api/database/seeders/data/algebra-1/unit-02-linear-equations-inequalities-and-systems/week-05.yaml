      prompt: |
        The numbers of pizzas ordered at nine parties were 2, 3, 3, 4, 4, 5, 6, 8, 14.

        (a) Find the five-number summary.
        (b) Describe the shape of the distribution and name a value that may be an outlier.
        (c) A planner wants a single number for "the usual order". Which centre should she use, and why?
      answer: |
        (a) Min 2; median = 5th value = 4; Q1 = median of 2, 3, 3, 4 = 3; Q3 = median of 5, 6, 8, 14 = 7; max 14.
        (b) Skewed right: most orders are 2 to 6 with a long tail to 14. The 14 may be an outlier (IQR = 4, upper fence 7 + 6 = 13, and 14 > 13, so it is).
        (c) The median, 4 pizzas, because the 14-pizza party pulls the mean (49/9 ≈ 5.4) above what most parties order.
      explanation: |
        Three points, one per part.

        (a) 1 pt: 2, 3, 4, 7, 14.

        (b) 1 pt: skewed right and 14 identified; the fence computation is a bonus, not required.

        (c) 1 pt: the median with a reason tied to the extreme value or skew.

    - slug: alg1-u02-w05-q25
