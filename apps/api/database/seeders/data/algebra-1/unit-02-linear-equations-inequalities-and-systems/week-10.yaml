week: 10
unit: 2
title: "Solving Inequalities and Graphing Them in Two Variables"
topics: ["2.20", "2.21", "2.22", "2.23"]
guide: guides/week-10.md
guide_description: |
  Solving inequalities algebraically with the reverse-the-symbol rule for negative multipliers, graphing a
  two-variable inequality as a half-plane (boundary line, solid or dashed, test point, shade), reading an
  inequality back from a graph, and writing and using two-variable inequalities for budgets and capacities.
flashcards_description: |
  28 cards on the sign-flip rule, the four steps for graphing a half-plane, solid versus dashed boundaries,
  choosing a test point, vertical and horizontal boundaries, and constraints in context.

flashcards:
  - front: Solving an inequality algebraically → the one rule that differs from equations
    back: |
      Multiplying or dividing both sides by a negative number reverses the inequality symbol. Adding, subtracting, and multiplying or dividing by a positive number leave it alone.
    topic_code: "2.20"
  - front: Why dividing by a negative reverses the symbol
    back: |
      2 < 5 is true, but multiplying by −1 gives −2 and −5, and −2 > −5. Negatives sit in reverse order on the number line, so the comparison flips.
    topic_code: "2.20"
  - front: Solve 7 − 2x ≥ 15
    back: |
      Subtract 7: −2x ≥ 8. Divide by −2 and reverse: x ≤ −4. Check x = −10: 7 + 20 = 27 ≥ 15, true.
    topic_code: "2.20"
  - front: Avoiding the flip → the trick
    back: |
      Move the variable term to the side where its coefficient stays positive. 7 − 2x ≥ 15 becomes 7 ≥ 15 + 2x, then −8 ≥ 2x, so −4 ≥ x, the same as x ≤ −4.
    topic_code: "2.20"
  - front: Solve 3(x − 4) < 5x + 2
    back: |
      3x − 12 < 5x + 2 → −12 < 2x + 2 → −14 < 2x → x > −7. No flip was needed because the division was by positive 2.
    topic_code: "2.20"
  - front: Solve 9 − 4x > 1
    back: |
      −4x > −8, so dividing by −4 and reversing gives x < 2. Check x = 0: 9 > 1, true.
    topic_code: "2.20"
  - front: Data plan inequality → 2,400 MB total, 150 MB per hour of calls, keep at least 600 MB
    back: |
      150h + 600 ≤ 2400 → 150h ≤ 1800 → h ≤ 12 hours of calls.
    topic_code: "2.20"
  - front: Operations that do NOT flip an inequality
    back: |
      Adding or subtracting any number (positive or negative) on both sides, and multiplying or dividing by a positive number. Only a negative multiplier or divisor flips it.
    topic_code: "2.20"
  - front: Solution set of a linear inequality in two variables → what it looks like
    back: |
      A half-plane: all the points on one side of the boundary line, plus the line itself when the symbol is ≤ or ≥.
    topic_code: "2.21"
  - front: Graphing y < 2x + 1 → the four steps
    back: |
      1. Draw the boundary y = 2x + 1. 2. Dash it (strict <). 3. Test (0, 0): 0 < 1 is true. 4. Shade the side containing (0, 0), below the line.
    topic_code: "2.21"
  - front: Solid vs dashed boundary → which symbol gives which
    back: |
      ≤ and ≥ give a solid line (points on the line are solutions). < and > give a dashed line (points on the line are not solutions).
    topic_code: "2.21"
  - front: Choosing a test point → the rule
    back: |
      Use (0, 0) because it makes arithmetic easy, unless the boundary passes through the origin; then use another easy point such as (1, 0) or (0, 1).
    topic_code: "2.21"
  - front: Graph 3x + 2y ≥ 12
    back: |
      Boundary through (4, 0) and (0, 6), solid. Test (0, 0): 0 ≥ 12 is false, so shade the side away from the origin.
    topic_code: "2.21"
  - front: Is (3, 2) a solution of y < 2x + 1? Is (−2, 0)?
    back: |
      (3, 2): 2 < 7, true, so yes. (−2, 0): 0 < −3, false, so no. A solution is any point that makes the inequality true.
    topic_code: "2.21"
  - front: Reading an inequality from a graph → the steps
    back: |
      Find the boundary's equation from two points. Decide ≤/≥ (solid) or </> (dashed). Substitute a shaded point to see which direction makes the statement true.
    topic_code: "2.22"
  - front: Solid line through (0, −2) and (2, 2), shaded below → inequality
    back: |
      Slope 2, intercept −2: boundary y = 2x − 2. A shaded point such as (3, 0) gives 0 ≤ 4, so the inequality is y ≤ 2x − 2.
    topic_code: "2.22"
  - front: Dashed line through (0, 4) and (4, 0), shaded toward the origin → inequality
    back: |
      Boundary x + y = 4. (0, 0) gives 0 < 4, and the line is dashed, so x + y < 4.
    topic_code: "2.22"
  - front: Graph of x > 3
    back: |
      A dashed vertical line at x = 3 with everything to its right shaded. There is no y in the inequality, so every y is allowed.
    topic_code: "2.22"
  - front: Graph of y ≤ −1
    back: |
      A solid horizontal line at y = −1 with everything on or below it shaded.
    topic_code: "2.22"
  - front: Why one test point decides the whole side
    back: |
      The boundary line splits the plane into two sides, and the difference (left side minus right side) keeps one sign on each side. If the inequality is true at one point of a side, it is true at every point of that side.
    topic_code: "2.22"
  - front: Bake sale → at least $120 from cookies at $1.50 and brownies at $2
    back: |
      1.5c + 2b ≥ 120. Boundary intercepts (80, 0) and (0, 60), solid; (0, 0) fails, so shade away from the origin. (40, 30) gives exactly 120, on the boundary.
    topic_code: "2.23"
  - front: Trailer → at most 1,000 kg with 20 kg boxes and 50 kg crates
    back: |
      20x + 50y ≤ 1000. Intercepts (50, 0) and (0, 20), solid, shade toward the origin. (30, 5) is allowed (850 kg); (20, 15) is not (1,150 kg).
    topic_code: "2.23"
  - front: Context limits on a two-variable inequality
    back: |
      Only the first quadrant usually makes sense (quantities are non-negative), and often only whole-number points. State these restrictions when interpreting the shaded region.
    topic_code: "2.23"
  - front: Using the graph of a constraint → what a point inside the region tells you
    back: |
      That combination is possible: it satisfies the constraint. A point on a solid boundary uses the resource exactly; a point outside the region breaks the constraint.
    topic_code: "2.23"
  - front: Error to spot → "−3x ≥ 15, so x ≥ −5"
    back: |
      Dividing by −3 must reverse the symbol: x ≤ −5. Check x = −10: −3(−10) = 30 ≥ 15, true, which confirms the ≤ direction.
    topic_code: "2.20"
  - front: Error to spot → "x − 5 > 2 becomes x < 7 because I moved a negative"
    back: |
      Adding 5 to both sides never flips the symbol: x > 7. Only multiplying or dividing by a negative reverses it.
    topic_code: "2.20"
  - front: Error to spot → solid line for y > x − 1
    back: |
      Strict > means points on the line are not solutions, so the boundary must be dashed. Solid is only for ≤ and ≥.
    topic_code: "2.21"
  - front: Error to spot → testing (0, 0) for y < 3x
    back: |
      The line y = 3x passes through the origin, so (0, 0) gives 0 < 0, false on the line itself, which decides nothing. Test (1, 0) instead: 0 < 3, true, so shade the side containing (1, 0).
    topic_code: "2.21"

quiz:
  description: |
    25 questions · about 45 minutes · solving inequalities with the sign-flip rule, graphing half-planes,
    reading inequalities from graphs, and two-variable constraints in context (lessons 2.20 to 2.23), with
    review of systems, one-variable inequalities, and lines from earlier weeks. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the
    short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: alg1-u02-w10-q01
      type: multiple_choice
      topic_code: "2.20"
      source: "IM Algebra 1, Unit 2, Lesson 20"
      points: 1
      prompt: |
        What is the solution of 10 − 3x > 1?
      options:
        - "x > −3"
        - "x < 3"
        - "x < −3"
        - "x > 3"
      option_explanations:
        - |
          The boundary is x = 3, not −3: −9 divided by −3 is positive 3.
        - |
          Correct. −3x > −9, and dividing by −3 reverses the symbol: x < 3. Check x = 0: 10 > 1, true.
        - |
          Both the sign of the boundary and the direction are wrong.
        - |
          Dividing by −3 reverses the symbol; testing x = 10 gives −20 > 1, which is false.
      answer: 1

    - slug: alg1-u02-w10-q02
      type: multiple_choice
      topic_code: "2.18"
      source: "IM Algebra 1, Unit 2, Lesson 18"
      points: 1
      prompt: |
        A museum tour group must have fewer than 25 people, and 3 of them are guides. Which inequality describes the number of visitors v?
      options:
        - "v − 3 < 25"
        - "v + 3 ≤ 25"
        - "3v < 25"
        - "v + 3 < 25"
      option_explanations:
        - |
          The guides are part of the group, so they are added to the visitors, not subtracted.
        - |
          "Fewer than 25" does not allow a group of exactly 25, so the symbol must be strict.
        - |
          The guides are a fixed 3 people, not 3 per visitor.
        - |
          Correct. Visitors plus the 3 guides make the group, and "fewer than 25" is strict: v + 3 < 25, so v < 22.
      answer: 3

    - slug: alg1-u02-w10-q03
      type: multiple_choice
      topic_code: "2.20"
      source: "IM Algebra 1, Unit 2, Lesson 20"
      points: 1
      prompt: |
        A taxi charges $4 plus $2.50 per kilometre, and a passenger has $29. Which inequality and solution describe the distance d she can travel?
      options:
        - "4 + 2.5d ≤ 29, so d ≤ 10 km"
        - "2.5 + 4d ≤ 29, so d ≤ 6.6 km"
        - "4 + 2.5d ≥ 29, so d ≥ 10 km"
        - "4 + 2.5d ≤ 29, so d ≤ 13.2 km"
      option_explanations:
        - |
          Correct. The fare must not exceed $29: 2.5d ≤ 25, so d ≤ 10.
        - |
          The constants are swapped: $4 is the fixed charge and $2.50 is per kilometre.
        - |
          The money limits the distance from above, not below.
        - |
          The 4 must be subtracted before dividing: 25/2.5 = 10, not 33/2.5.
      answer: 0

    - slug: alg1-u02-w10-q04
      type: multiple_choice
      topic_code: "2.21"
      source: "IM Algebra 1, Unit 2, Lesson 21"
      points: 1
      prompt: |
        Which description correctly graphs y > −x + 2?
      options:
        - "Solid line through (0, 2) and (2, 0), shaded above"
        - "Solid line through (0, −2) and (2, 0), shaded above"
        - "Dashed line through (0, 2) and (2, 0), shaded above"
        - "Dashed line through (0, 2) and (2, 0), shaded below"
      option_explanations:
        - |
          The symbol > is strict, so the boundary must be dashed, not solid.
        - |
          The y-intercept of the boundary is (0, 2), not (0, −2), and the line should be dashed.
        - |
          Correct. The boundary y = −x + 2 is dashed; (0, 0) gives 0 > 2, false, so shade the other side, above the line.
        - |
          (0, 0) is below the line and does not satisfy the inequality, so the shading is above.
      answer: 2

    - slug: alg1-u02-w10-q05
      type: multiple_choice
      topic_code: "2.21"
      source: "IM Algebra 1, Unit 2, Lesson 21"
      points: 1
      prompt: |
        Which point is a solution of 2x − 3y ≤ 6?
      options:
        - "(6, 1)"
        - "(4, −1)"
        - "(5, 0)"
        - "(3, 0)"
      option_explanations:
        - |
          2(6) − 3(1) = 9, which is not less than or equal to 6, so (6, 1) is not a solution.
        - |
          2(4) − 3(−1) = 8 + 3 = 11, which is not less than or equal to 6, so (4, −1) is not a solution.
        - |
          2(5) − 3(0) = 10, which is not less than or equal to 6, so (5, 0) is not a solution.
        - |
          Correct. 6 − 0 = 6 ≤ 6; the point is on the solid boundary and counts as a solution.
      answer: 3

    - slug: alg1-u02-w10-q06
      type: multiple_choice
      topic_code: "2.22"
      source: "IM Algebra 1, Unit 2, Lesson 22"
      points: 1
      prompt: |
        Graph description: a solid line passes through (0, 3) and (3, 0); the region containing the origin is shaded. Which inequality is graphed?
      options:
        - "x − y ≤ 3"
        - "x + y ≥ 3"
        - "x + y ≤ 3"
        - "x + y < 3"
      option_explanations:
        - |
          The line through (0, 3) and (3, 0) has slope −1; x − y = 3 has slope 1 and passes through (0, −3).
        - |
          (0, 0) gives 0 ≥ 3, false, so this inequality would be shaded away from the origin.
        - |
          Correct. The boundary is x + y = 3; (0, 0) gives 0 ≤ 3, true, and the line is solid.
        - |
          A solid line means points on it are solutions, so the symbol includes equality.
      answer: 2

    - slug: alg1-u02-w10-q07
      type: multiple_choice
      topic_code: "2.22"
      source: "IM Algebra 1, Unit 2, Lesson 22"
      points: 1
      prompt: |
        Which inequality has as its graph a dashed vertical line at x = −2 with everything to its left shaded?
      options:
        - "x < −2"
        - "x ≤ −2"
        - "x > −2"
        - "y < −2"
      option_explanations:
        - |
          Correct. No y appears, the boundary is vertical, strict < makes it dashed, and smaller x-values are to the left.
        - |
          The symbol ≤ includes the boundary, so its line would be solid, not dashed.
        - |
          x > −2 describes points with larger x-values, which lie to the right of the line, not the left.
        - |
          y < −2 has a horizontal boundary with shading below.
      answer: 0

    - slug: alg1-u02-w10-q08
      type: multiple_choice
      topic_code: "2.23"
      source: "IM Algebra 1, Unit 2, Lesson 23"
      points: 1
      stimulus: |
        A school van can carry at most 900 kg of equipment. Each tent weighs 15 kg and each cooler weighs 25 kg. Let t be the number of tents and c the number of coolers loaded.
      prompt: |
        Which inequality describes the loads the van can carry?
      options:
        - "15t + 25c ≥ 900"
        - "15t + 25c ≤ 900"
        - "t + c ≤ 900"
        - "40(t + c) ≤ 900"
      option_explanations:
        - |
          The van's limit caps the weight from above; ≥ would require at least 900 kg.
        - |
          Correct. The total weight of tents plus coolers must not exceed 900 kg.
        - |
          Counting items ignores that tents and coolers weigh different amounts.
        - |
          Not every item weighs 40 kg; the weights must multiply their own counts.
      answer: 1

    - slug: alg1-u02-w10-q09
      type: multiple_choice
      topic_code: "2.23"
      source: "IM Algebra 1, Unit 2, Lesson 23"
      points: 1
      stimulus: |
        A school van can carry at most 900 kg of equipment. Each tent weighs 15 kg and each cooler weighs 25 kg. Let t be the number of tents and c the number of coolers loaded.
      prompt: |
        Which load is allowed?
      options:
        - "20 tents and 30 coolers"
        - "30 tents and 20 coolers"
        - "50 tents and 10 coolers"
        - "40 tents and 12 coolers"
      option_explanations:
        - |
          15(20) + 25(30) = 300 + 750 = 1,050 kg, over the limit.
        - |
          15(30) + 25(20) = 450 + 500 = 950 kg, over the limit.
        - |
          15(50) + 25(10) = 750 + 250 = 1,000 kg, over the limit.
        - |
          Correct. 15(40) + 25(12) = 600 + 300 = 900 kg, exactly the limit, which "at most" allows.
      answer: 3

    - slug: alg1-u02-w10-q10
      type: multiple_choice
      topic_code: "2.21"
      source: "IM Algebra 1, Unit 2, Lesson 21"
      points: 1
      stimulus: |
        A school van can carry at most 900 kg of equipment. Each tent weighs 15 kg and each cooler weighs 25 kg. Let t be the number of tents and c the number of coolers loaded.
      prompt: |
        If the inequality is graphed with t on the horizontal axis, which description is correct?
      options:
        - "Dashed boundary through (60, 0) and (0, 36), shaded away from the origin"
        - "Solid boundary through (36, 0) and (0, 60), shaded toward the origin"
        - "Solid boundary through (60, 0) and (0, 36), shaded toward the origin"
        - "Solid boundary through (900, 0) and (0, 900), shaded toward the origin"
      option_explanations:
        - |
          The symbol ≤ gives a solid line, and (0, 0) is a solution, so the shading includes the origin.
        - |
          The intercepts are swapped: tents are on the horizontal axis and 900/15 = 60.
        - |
          Correct. 900/15 = 60 tents alone and 900/25 = 36 coolers alone; ≤ makes the line solid; (0, 0) satisfies it, so shade toward the origin.
        - |
          900 is the weight limit in kilograms, not a number of items.
      answer: 2

    - slug: alg1-u02-w10-q11
      type: multiple_choice
      topic_code: "2.19"
      source: "IM Algebra 1, Unit 2, Lesson 19"
      points: 1
      prompt: |
        Which number-line graph represents the solutions of 2x + 1 ≥ 7?
      options:
        - "Closed circle at 4, shaded to the right"
        - "Closed circle at 3, shaded to the right"
        - "Closed circle at 3, shaded to the left"
        - "Open circle at 3, shaded to the right"
      option_explanations:
        - |
          The boundary comes from 2x + 1 = 7, so 2x = 6 and x = 3, not 4.
        - |
          Correct. The boundary is x = 3 and ≥ includes it; testing x = 10 gives 21 ≥ 7, true, so shade right.
        - |
          Testing x = 0 gives 1 ≥ 7, false, so the left side is not the solution.
        - |
          The symbol ≥ includes the boundary, so the circle must be closed.
      answer: 1

    - slug: alg1-u02-w10-q12
      type: multiple_choice
      topic_code: "2.17"
      source: "IM Algebra 1, Unit 2, Lesson 17"
      points: 1
      prompt: |
        How many solutions does the system 3x + 6y = 12 and x + 2y = 4 have?
      options:
        - "Infinitely many"
        - "Exactly three"
        - "None"
        - "Exactly one"
      option_explanations:
        - |
          Correct. Dividing the first equation by 3 gives x + 2y = 4, identical to the second: the same line.
        - |
          A linear system never has exactly three solutions.
        - |
          No solution needs parallel, distinct lines; these equations describe the same line.
        - |
          The first equation is 3 times the second, so there is no single crossing point.
      answer: 0

    - slug: alg1-u02-w10-q13
      type: multiple_choice
      topic_code: "2.15"
      source: "IM Algebra 1, Unit 2, Lesson 15"
      points: 1
      prompt: |
        Solve the system 2x + 3y = 4 and 4x − y = 22.
      options:
        - "(2, 0)"
        - "(−2, 5)"
        - "(5, 2)"
        - "(5, −2)"
      option_explanations:
        - |
          4 + 0 = 4 fits the first equation, but 8 − 0 = 8, not 22.
        - |
          −4 + 15 = 11, not 4, so this fails the first equation.
        - |
          10 + 6 = 16, not 4, so this fails the first equation.
        - |
          Correct. Tripling the second gives 12x − 3y = 66; adding gives 14x = 70, x = 5; then 20 − y = 22, y = −2. Check: 10 − 6 = 4.
      answer: 3

    - slug: alg1-u02-w10-q14
      type: multi_select
      topic_code: "2.21"
      source: "IM Algebra 1, Unit 2, Lesson 21"
      points: 2
      partial_credit: true
      prompt: |
        Which points are solutions of y ≥ 2x − 4? Select all that apply.
      options:
        - "(−3, −8)"
        - "(4, 1)"
        - "(1, −5)"
        - "(0, 0)"
        - "(2, 0)"
      option_explanations:
        - |
          Correct. Substituting (−3, −8) gives −8 ≥ 2(−3) − 4 = −10, which is true.
        - |
          Substituting (4, 1) gives 1 ≥ 2(4) − 4 = 4, which is false.
        - |
          Substituting (1, −5) gives −5 ≥ 2(1) − 4 = −2, which is false.
        - |
          Correct. Substituting (0, 0) gives 0 ≥ 2(0) − 4 = −4, which is true.
        - |
          Correct. 0 ≥ 0 is true; the point is on the solid boundary.
      answer: [0, 3, 4]

    - slug: alg1-u02-w10-q15
      type: multi_select
      topic_code: "2.20"
      source: "IM Algebra 1, Unit 2, Lesson 20"
      points: 2
      partial_credit: true
      prompt: |
        Which inequalities have the solution x ≤ −2? Select all that apply.
      options:
        - "−4x ≥ 8"
        - "5 − x ≤ 7"
        - "3x ≤ −6"
        - "x + 7 ≤ 5"
        - "−x ≥ 2"
      option_explanations:
        - |
          Correct. Dividing by −4 reverses the symbol: x ≤ −2.
        - |
          Subtracting 5 gives −x ≤ 2, and multiplying by −1 gives x ≥ −2, the opposite direction.
        - |
          Correct. Dividing by positive 3 gives x ≤ −2 with no flip.
        - |
          Correct. Subtracting 7 from both sides gives x ≤ −2 with no reversal needed.
        - |
          Correct. Multiplying by −1 and reversing gives x ≤ −2.
      answer: [0, 2, 3, 4]

    - slug: alg1-u02-w10-q16
      type: true_false
      topic_code: "2.14"
      source: "IM Algebra 1, Unit 2, Lesson 14"
      points: 1
      prompt: |
        True or false: in the system 5x + 2y = 9 and −5x + 7y = 18, adding the two equations eliminates x.
      answer: true
      explanation: |
        True. The x coefficients 5 and −5 are opposites, so their sum is 0: adding gives 9y = 27, y = 3, and then 5x + 6 = 9 gives x = 0.6.

    - slug: alg1-u02-w10-q17
      type: true_false
      topic_code: "2.22"
      source: "IM Algebra 1, Unit 2, Lesson 22"
      points: 1
      prompt: |
        True or false: if a test point on one side of a boundary line satisfies a linear inequality, every point on that side satisfies it.
      answer: true
      explanation: |
        True. The expression (left side minus right side) keeps the same sign throughout each side of the line, so one point decides the whole half-plane. That is why a single test point is enough.

    - slug: alg1-u02-w10-q18
      type: fill_blank
      topic_code: "2.21"
      source: "IM Algebra 1, Unit 2, Lesson 21"
      points: 1
      prompt: |
        When graphing y < 3x + 2, the boundary line is drawn ____ because points on the line are not solutions.
      answer: ["dashed", "dotted", "as a dashed line", "broken"]
      explanation: |
        A strict inequality excludes the boundary, shown by a dashed line. For ≤ or ≥ the line is solid because its points are solutions.

    - slug: alg1-u02-w10-q19
      type: fill_blank
      topic_code: "2.17"
      source: "IM Algebra 1, Unit 2, Lesson 17"
      points: 1
      prompt: |
        If elimination on a system of two linear equations ends with the true statement 0 = 0, the system has ____ solutions.
      answer: ["infinitely many", "infinite", "an infinite number of", "infinitely many solutions"]
      explanation: |
        A statement that is always true means every solution of one equation is also a solution of the other: the equations describe the same line.

    - slug: alg1-u02-w10-q20
      type: numeric
      topic_code: "2.20"
      source: "IM Algebra 1, Unit 2, Lesson 20"
      points: 1
      prompt: |
        A gym membership costs $35 to join plus $22 per month. A student can spend at most $300. What is the greatest whole number of months she can pay for? Give a whole number.
      answer: { value: 12, tolerance: 0 }
      explanation: |
        35 + 22m ≤ 300 → 22m ≤ 265 → m ≤ 12.045…, so 12 whole months (cost 35 + 264 = $299).

    - slug: alg1-u02-w10-q21
      type: numeric
      topic_code: "2.23"
      source: "IM Algebra 1, Unit 2, Lesson 23"
      points: 1
      prompt: |
        A florist needs at least 200 flowers for an order. Roses come in bunches of 12 and lilies in bunches of 8. If she buys 11 bunches of roses, what is the smallest whole number of bunches of lilies that meets the order? Give a whole number.
      answer: { value: 9, tolerance: 0 }
      explanation: |
        12(11) + 8l ≥ 200 → 132 + 8l ≥ 200 → 8l ≥ 68 → l ≥ 8.5, so 9 bunches (132 + 72 = 204 flowers).

    - slug: alg1-u02-w10-q22
      type: numeric
      topic_code: "2.13"
      source: "IM Algebra 1, Unit 2, Lesson 13"
      points: 1
      prompt: |
        Solve the system y = 5x − 7 and 2x + y = 14. What is the value of x? Give a whole number.
      answer: { value: 3, tolerance: 0 }
      explanation: |
        Substituting: 2x + 5x − 7 = 14, so 7x = 21 and x = 3; then y = 8. Check: 6 + 8 = 14.

    - slug: alg1-u02-w10-q23
      type: short_answer
      topic_code: "2.22"
      source: "IM Algebra 1, Unit 2, Lesson 22"
      points: 3
      prompt: |
        Graph description: a dashed line passes through (0, −1) and (2, 3). The region above and to the left of the line is shaded.

        (a) Find the equation of the boundary line.
        (b) Write the inequality that is graphed, explaining how you chose the symbol.
        (c) State one point that is a solution and one that is not, with checks.
      answer: |
        (a) Slope (3 − (−1))/(2 − 0) = 2, intercept −1: y = 2x − 1.
        (b) The shaded side contains (0, 0), and 0 versus 2(0) − 1 = −1 gives 0 > −1, so the shaded side is where y is greater; the line is dashed, so the symbol is strict: y > 2x − 1.
        (c) (0, 0): 0 > −1 true, a solution. (3, 0): 0 > 5 false, not a solution. (Any point on the line, such as (1, 1), is also not a solution because the boundary is dashed.)
      explanation: |
        Three points, one per part.

        (a) 1 pt: y = 2x − 1.

        (b) 1 pt: y > 2x − 1 with a test-point argument and the dashed-line reason for strictness.

        (c) 1 pt: one correct solution and one non-solution, each checked.

    - slug: alg1-u02-w10-q24
      type: short_answer
      topic_code: "2.20"
      source: "IM Algebra 1, Unit 2, Lesson 20"
      points: 3
      prompt: |
        A student solved −2(x − 3) ≥ 4x + 18 and wrote:

        Line 1: −2x + 6 ≥ 4x + 18
        Line 2: −6x + 6 ≥ 18
        Line 3: −6x ≥ 12
        Line 4: x ≥ −2

        (a) Identify the incorrect step and explain the error.
        (b) Give the correct solution and check it with a test value.
        (c) Show a different route from line 3 (or earlier) that reaches the correct answer without ever dividing by a negative number.
      answer: |
        (a) Line 3 to line 4: dividing by −6 must reverse the symbol. The correct line 4 is x ≤ −2.
        (b) x ≤ −2. Test x = −5: −2(−8) = 16 and 4(−5) + 18 = −2; 16 ≥ −2 is true. Test x = 0: 6 ≥ 18 is false, confirming the direction.
        (c) From line 1, add 2x to both sides: 6 ≥ 6x + 18; subtract 18: −12 ≥ 6x; divide by positive 6: −2 ≥ x, which is x ≤ −2.
      explanation: |
        Three points, one per part.

        (a) 1 pt: identifies the division by −6 without reversing.

        (b) 1 pt: x ≤ −2 with a test value on the solution side.

        (c) 1 pt: a valid route keeping the coefficient positive.

    - slug: alg1-u02-w10-q25
      type: long_answer
      topic_code: "2.23"
      source: "IM Algebra 1, Unit 2, Lesson 23"
      points: 6
      prompt: |
        A student has $60 to spend on snacks for a club meeting. Bags of pretzels cost $3 and boxes of granola bars cost $5. Let p be the number of bags of pretzels and g the number of boxes of granola bars.

        (1) Write an inequality for the combinations the student can afford.
        (2) Describe how to graph it: the intercepts of the boundary, whether the boundary is solid or dashed, and which side to shade, with a test point.
        (3) Give three combinations that are affordable, including one that spends exactly $60, and one combination that is not affordable, with the arithmetic for each.
        (4) The club also needs at least 15 items in total. Write this second constraint and name one combination that satisfies both constraints and one that satisfies the budget but not the item count.
      answer: |
        (1) 3p + 5g ≤ 60.
        (2) Boundary 3p + 5g = 60 with intercepts (20, 0) and (0, 12); solid because of ≤; test (0, 0): 0 ≤ 60 is true, so shade toward the origin (the triangle in the first quadrant under the line, since p, g ≥ 0).
        (3) Affordable: (5, 9): 15 + 45 = 60, exactly the budget; (10, 4): 30 + 20 = 50; (0, 10): 0 + 50 = 50. Not affordable: (12, 6): 36 + 30 = 66 > 60.
        (4) p + g ≥ 15. Both constraints: (10, 5): 30 + 25 = 55 ≤ 60 and 15 items. Budget but not count: (2, 4): 6 + 20 = 26 ≤ 60 but only 6 items.
      explanation: |
        Six points.

        (1) 1 pt: 3p + 5g ≤ 60.

        (2) 2 pts: 1 for intercepts and solid line; 1 for the test point and shading toward the origin.

        (3) 2 pts: 1 for three affordable combinations including one on the boundary; 1 for a correctly checked unaffordable combination.

        (4) 1 pt: p + g ≥ 15 with both example points checked.

        Common errors: dashed boundary for ≤; shading away from the origin without testing; forgetting that combinations must be whole numbers.
