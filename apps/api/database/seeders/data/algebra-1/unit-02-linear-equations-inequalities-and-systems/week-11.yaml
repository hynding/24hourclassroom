      prompt: |
        A student has at most 12 hours a week for two part-time jobs. Tutoring pays $15 an hour and lifeguarding pays $10 an hour. She needs to earn at least $120 a week and must lifeguard at least 4 hours to keep that job. Let t be tutoring hours and l lifeguarding hours.

        (a) Write the system of inequalities, including any constraints implied by the context.
        (b) Check whether (4, 6) and (8, 2) satisfy the system, showing each check.
        (c) Find the vertex where 15t + 10l = 120 meets l = 4 and interpret it.
      answer: |
        (a) t + l ≤ 12; 15t + 10l ≥ 120; l ≥ 4; t ≥ 0.
        (b) (4, 6): 10 ≤ 12 true; 60 + 60 = 120 ≥ 120 true; 6 ≥ 4 true: satisfies. (8, 2): 10 ≤ 12 true; 120 + 20 = 140 ≥ 120 true; but 2 ≥ 4 is false: fails.
        (c) 15t + 40 = 120 gives t = 16/3 ≈ 5.33; the vertex (5.33, 4) is the plan with the minimum lifeguarding and exactly $120 earned.
      explanation: |
        Three points, one per part.

        (a) 1 pt: all three stated constraints plus t ≥ 0.

        (b) 1 pt: both points checked against every constraint with the correct conclusions.

        (c) 1 pt: t = 16/3 (accept 5.3) with an interpretation.

    - slug: alg1-u02-w11-q25
      type: short_answer
