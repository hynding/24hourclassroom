week: 11
unit: 2
title: "Systems of Linear Inequalities"
topics: ["2.24", "2.25", "2.26"]
guide: guides/week-11.md
guide_description: |
  What it means for a point to solve a system of inequalities, graphing a system and finding the overlap,
  writing systems from situations with several constraints, and the full modelling method: variables,
  constraints including non-negativity, the feasible region, its vertices, and interpreting the best
  combination.
flashcards_description: |
  28 cards on checking points against every inequality, the overlap region, the three ways two regions can
  relate, constraints from situations, non-negativity, vertices and the complete modelling method.

flashcards:
  - front: Solution of a system of inequalities → definition
    back: |
      A point that satisfies every inequality in the system at once. Failing even one inequality means the point is not a solution.
    topic_code: "2.24"
  - front: Checking whether a point solves a system of inequalities → the procedure
    back: |
      Substitute the point into each inequality in turn. If every statement is true, the point is a solution; stop as soon as one is false.
    topic_code: "2.24"
  - front: Is (3, 4) a solution of y ≤ x + 2 and y > −2x + 1?
    back: |
      4 ≤ 5 is true and 4 > −5 is true, so yes. The point (0, 3) fails the first inequality (3 ≤ 2 is false), so it is not a solution.
    topic_code: "2.24"
  - front: Graphing a system of inequalities → where the solution is
    back: |
      Graph each inequality on the same axes (boundary, solid or dashed, test, shade). The solution region is the overlap where every shading is present.
    topic_code: "2.24"
  - front: Three ways two half-planes can relate
    back: |
      They overlap in a wedge or strip (the usual case); they do not overlap at all (parallel boundaries shaded away from each other); or one region lies inside the other, and the smaller one is the solution.
    topic_code: "2.24"
  - front: y > x + 3 and y < x − 1 → solution region
    back: |
      None. The boundaries are parallel and the shadings point away from each other, so no point satisfies both.
    topic_code: "2.24"
  - front: y > x + 3 and y > x − 1 → solution region
    back: |
      The region above y = x + 3. Every point above that line is also above y = x − 1, so the first inequality's region is the whole solution.
    topic_code: "2.24"
  - front: Point on a dashed boundary → in the solution region?
    back: |
      No. On a dashed boundary the strict inequality is false, so the point fails that inequality and therefore the system. Points on a solid boundary that satisfy the other inequalities are solutions.
    topic_code: "2.24"
  - front: Crossing point of two boundary lines → is it a solution?
    back: |
      Only if both boundaries are solid (and the point satisfies any other constraints). If either boundary is dashed the crossing point is excluded.
    topic_code: "2.24"
  - front: Writing a system from a situation → how many inequalities
    back: |
      One per constraint stated (time, money, minimums), plus any the situation implies, such as non-negativity and whole-number counts.
    topic_code: "2.25"
  - front: Job and homework constraints → the system
    back: |
      At most 10 hours total, at least 4 hours of homework, at least $48 at $12 per hour: j + h ≤ 10, h ≥ 4, j ≥ 4 (from 12j ≥ 48). Region: a triangle with corners (4, 4), (6, 4), (4, 6).
    topic_code: "2.25"
  - front: Checking a combination against a system in context
    back: |
      Substitute into every constraint. (5, 5) in the job system: 10 ≤ 10, 5 ≥ 4, 5 ≥ 4, all true. (7, 4): 11 ≤ 10 is false, so it fails.
    topic_code: "2.25"
  - front: A point that satisfies most constraints but fails one
    back: |
      It is not a solution. A system means all the conditions together; the plan is impossible if any single constraint is broken.
    topic_code: "2.25"
  - front: Horizontal and vertical constraints such as h ≥ 4 and j ≥ 4
    back: |
      h ≥ 4 is a solid horizontal line shaded above; j ≥ 4 is a solid vertical line shaded to the right. They cut the region to a corner of the plane.
    topic_code: "2.25"
  - front: Modelling with a system of inequalities → the five steps
    back: |
      1. Define variables with units. 2. Write every constraint, including non-negativity. 3. Graph and shade the feasible region. 4. Find the vertices by solving pairs of boundary equations. 5. Interpret: possible combinations, boundaries where a resource is used fully, the best corner for a goal.
    topic_code: "2.26"
  - front: Non-negativity constraints → when to add them
    back: |
      Whenever the variables count or measure real things that cannot be negative: x ≥ 0 and y ≥ 0. They keep the region in the first quadrant.
    topic_code: "2.26"
  - front: Feasible region → definition
    back: |
      The set of all points satisfying every constraint: the overlap of all the half-planes. Also called the solution region.
    topic_code: "2.26"
  - front: Vertex of a feasible region → how to find it exactly
    back: |
      Solve the two boundary equations that meet there as a system of equations (substitution or elimination). Reading it from the graph only gives an estimate.
    topic_code: "2.26"
  - front: Bakery model → flour and oven constraints
    back: |
      Loaves 500 g and 20 min, baguettes 250 g and 15 min, with 20 kg and 720 min: 2L + B ≤ 80 and 4L + 3B ≤ 144, plus L, B ≥ 0. The lines cross at (48, −16), outside the region, so the region is the triangle (0, 0), (36, 0), (0, 48).
    topic_code: "2.26"
  - front: A crossing of two boundary lines that is not a vertex
    back: |
      If the crossing point violates another constraint (for example it has a negative coordinate), it lies outside the region and is not a corner. Check each crossing against all constraints.
    topic_code: "2.26"
  - front: Where the best value of a linear goal occurs
    back: |
      At a vertex of the feasible region. Evaluate the goal expression at each corner and pick the largest (or smallest). For the bakery, profit 4L + 2.5B is $144 at (36, 0) and $120 at (0, 48).
    topic_code: "2.26"
  - front: Garden model → t + p ≤ 30 and 2t + p ≤ 40
    back: |
      With t, p ≥ 0 the vertices are (0, 0), (20, 0), (10, 20) and (0, 30). The crossing (10, 20) comes from subtracting the equations: t = 10, then p = 20.
    topic_code: "2.26"
  - front: Point on a boundary of the feasible region → meaning in context
    back: |
      That resource is used exactly: all the flour, all the time, or all the money. Points inside leave some of every resource unused.
    topic_code: "2.26"
  - front: Bounded vs unbounded feasible region
    back: |
      Bounded: enclosed on all sides (a polygon). Unbounded: extends without limit in some direction, which happens when constraints are only minimums. Both are valid solution regions.
    topic_code: "2.26"
  - front: Error to spot → "(0, 3) is a solution because 3 > −2(0) + 1"
    back: |
      Only one inequality was checked. The other, y ≤ x + 2, gives 3 ≤ 2, which is false, so (0, 3) is not a solution of the system.
    topic_code: "2.24"
  - front: Error to spot → shading both inequalities and calling the whole shaded area the solution
    back: |
      The solution is only the overlap where both shadings are present. Areas shaded by just one inequality fail the other.
    topic_code: "2.24"
  - front: Error to spot → leaving out x ≥ 0 and y ≥ 0 in a model
    back: |
      The region then includes negative amounts of items, which cannot exist, and the vertices and best corner may be wrong. Add non-negativity whenever quantities are real counts or measures.
    topic_code: "2.26"
  - front: Error to spot → vertex read from the graph as (10, 19)
    back: |
      Estimates from a sketch are unreliable. Solve the two boundary equations exactly: t + p = 30 and 2t + p = 40 give (10, 20).
    topic_code: "2.26"

quiz:
  description: |
    25 questions · about 45 minutes · solutions and graphs of systems of inequalities, systems from situations
    with several constraints, and modelling with feasible regions and vertices (lessons 2.24 to 2.26), with
    review of graphing single inequalities, solving systems of equations, and earlier skills. Multiple choice,
    select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    - slug: alg1-u02-w11-q01
      type: multiple_choice
      topic_code: "2.24"
      source: "IM Algebra 1, Unit 2, Lesson 24"
      points: 1
      prompt: |
        Which point is a solution of the system y < 2x + 1 and x + y ≥ 4?
      options:
        - "(1, 3)"
        - "(3, 2)"
        - "(0, 5)"
        - "(2, 5)"
      option_explanations:
        - |
          3 < 3 is false, so the point is on the dashed boundary and fails the first inequality.
        - |
          Correct. 2 < 7 is true and 3 + 2 = 5 ≥ 4 is true, so both inequalities hold.
        - |
          5 < 1 is false, so the first inequality fails even though 0 + 5 ≥ 4.
        - |
          5 < 5 is false; the point is on the dashed boundary of the first inequality.
      answer: 1

    - slug: alg1-u02-w11-q02
      type: multiple_choice
      topic_code: "2.24"
      source: "IM Algebra 1, Unit 2, Lesson 24"
      points: 1
      prompt: |
        The system y ≥ x + 4 and y ≤ x − 2 is graphed. What is its solution region?
      options:
        - "The strip between the two parallel lines"
        - "There is no solution region; the shadings do not overlap"
        - "Everything above the line y = x + 4"
        - "The whole plane"
      option_explanations:
        - |
          The first inequality shades above the upper line and the second shades below the lower line; the strip between them is in neither shading.
        - |
          Correct. The boundaries are parallel (slope 1) and the shaded sides point away from each other, so no point satisfies both.
        - |
          Points above y = x + 4 have y greater than x − 2, so they fail the second inequality.
        - |
          No point can be at least x + 4 and at most x − 2 at the same time.
      answer: 1

    - slug: alg1-u02-w11-q03
      type: multiple_choice
      topic_code: "2.24"
      source: "IM Algebra 1, Unit 2, Lesson 24"
      points: 1
      prompt: |
        Graph description: the line y = −x + 6 is drawn solid and shaded below; the line y = 2 is drawn dashed and shaded above. Which point is in the overlap?
      options:
        - "(3, 2)"
        - "(1, 3)"
        - "(5, 4)"
        - "(0, 1)"
      option_explanations:
        - |
          (3, 2) lies on the dashed line y = 2, so it fails y > 2.
        - |
          Correct. 3 ≤ −1 + 6 = 5 is true and 3 > 2 is true.
        - |
          4 ≤ −5 + 6 = 1 is false, so the point is above the solid line.
        - |
          1 > 2 is false, so the point is below the dashed line.
      answer: 1

    - slug: alg1-u02-w11-q04
      type: multiple_choice
      topic_code: "2.25"
      source: "IM Algebra 1, Unit 2, Lesson 25"
      points: 1
      stimulus: |
        A theatre club is selling two kinds of tickets for a show. There are at most 200 seats. Student tickets are $5 and general tickets are $9, and the club needs at least $1,200. Let s be the number of student tickets and g the number of general tickets.
      prompt: |
        Which system represents the constraints?
      options:
        - "s + g ≤ 200 and 5s + 9g ≥ 1200"
        - "s + g ≥ 200 and 5s + 9g ≤ 1200"
        - "s + g ≤ 200 and 5s + 9g ≤ 1200"
        - "5s + 9g ≤ 200 and s + g ≥ 1200"
      option_explanations:
        - |
          Correct. Seats cap the number of tickets from above, and the money goal is a minimum.
        - |
          Both symbols are reversed: seats are a maximum and income a minimum.
        - |
          The income must be at least $1,200, so its symbol is ≥.
        - |
          The totals are attached to the wrong expressions: 200 is seats and 1,200 is dollars.
      answer: 0

    - slug: alg1-u02-w11-q05
      type: multiple_choice
      topic_code: "2.25"
      source: "IM Algebra 1, Unit 2, Lesson 25"
      points: 1
      stimulus: |
        A theatre club is selling two kinds of tickets for a show. There are at most 200 seats. Student tickets are $5 and general tickets are $9, and the club needs at least $1,200. Let s be the number of student tickets and g the number of general tickets.
      prompt: |
        Which combination satisfies both constraints?
      options:
        - "150 student and 40 general"
        - "100 student and 80 general"
        - "180 student and 30 general"
        - "40 student and 100 general"
      option_explanations:
        - |
          190 seats is fine, but 750 + 360 = $1,110 is below $1,200.
        - |
          Correct. 180 seats ≤ 200 and 500 + 720 = $1,220 ≥ $1,200.
        - |
          180 + 30 = 210 tickets exceeds the 200 available seats, so the seat constraint fails.
        - |
          140 seats is fine, but 200 + 900 = $1,100 is below $1,200.
      answer: 1

    - slug: alg1-u02-w11-q06
      type: multiple_choice
      topic_code: "2.26"
      source: "IM Algebra 1, Unit 2, Lesson 26"
      points: 1
      stimulus: |
        A theatre club is selling two kinds of tickets for a show. There are at most 200 seats. Student tickets are $5 and general tickets are $9, and the club needs at least $1,200. Let s be the number of student tickets and g the number of general tickets.
      prompt: |
        Where do the boundary lines s + g = 200 and 5s + 9g = 1200 cross, and what does the crossing represent?
      options:
        - "(150, 50): selling out every seat while collecting exactly $1,200"
        - "(50, 150): selling out every seat while collecting exactly $1,200"
        - "(200, 0): all seats sold to students"
        - "(0, 133.3): all seats sold to the general public"
      option_explanations:
        - |
          Correct. From g = 200 − s, 5s + 9(200 − s) = 1200 gives 1800 − 4s = 1200, s = 150, g = 50; both constraints are met exactly.
        - |
          150 + 50 = 200 is right but 5(50) + 9(150) = 1600, not 1200; the coordinates are reversed.
        - |
          (200, 0) is an intercept of the seat line and collects only $1,000.
        - |
          (0, 133.3) is an intercept of the money line, not the crossing of the two lines.
      answer: 0

    - slug: alg1-u02-w11-q07
      type: multiple_choice
      topic_code: "2.26"
      source: "IM Algebra 1, Unit 2, Lesson 26"
      points: 1
      prompt: |
        A model for buying notebooks n and pens p has the constraints 3n + 2p ≤ 24 and n + p ≤ 10. Which constraints should be added because of the context?
      options:
        - "n ≥ 0 and p ≥ 0"
        - "n ≤ 0 and p ≤ 0"
        - "n + p ≥ 24"
        - "n = p"
      option_explanations:
        - |
          Correct. Numbers of notebooks and pens cannot be negative, so the region must stay in the first quadrant.
        - |
          Non-positive counts would make no sense.
        - |
          Nothing in the situation requires 24 items; 24 is the dollar budget.
        - |
          Nothing in the situation says the two counts must be equal; that would be an invented constraint.
      answer: 0

    - slug: alg1-u02-w11-q08
      type: multiple_choice
      topic_code: "2.26"
      source: "IM Algebra 1, Unit 2, Lesson 26"
      points: 1
      prompt: |
        The feasible region of a model has vertices (0, 0), (8, 0), (5, 6) and (0, 9). The goal is to make 3x + 4y as large as possible. Which vertex gives the largest value?
      options:
        - "(8, 0), value 24"
        - "(5, 6), value 39"
        - "(0, 9), value 36"
        - "(0, 0), value 0"
      option_explanations:
        - |
          At (8, 0) the value is 3(8) + 4(0) = 24, which is less than 39.
        - |
          Correct. 3(5) + 4(6) = 15 + 24 = 39 is the largest of the four corner values.
        - |
          At (0, 9) the value is 3(0) + 4(9) = 36, which is less than 39.
        - |
          At the origin the value is 3(0) + 4(0) = 0, the smallest of the four.
      answer: 1

    - slug: alg1-u02-w11-q09
      type: multiple_choice
      topic_code: "2.24"
      source: "IM Algebra 1, Unit 2, Lesson 24"
      points: 1
      prompt: |
        Which system has the region described: all points on or above the horizontal line y = 1 and strictly to the right of the vertical line x = −3?
      options:
        - "y ≥ 1 and x > −3"
        - "y > 1 and x ≥ −3"
        - "y ≤ 1 and x > −3"
        - "y ≥ 1 and x < −3"
      option_explanations:
        - |
          Correct. "On or above" is ≥ for y; "strictly to the right" is > for x.
        - |
          The symbols are swapped: the horizontal boundary is included and the vertical one is not.
        - |
          y ≤ 1 describes points below the line, not above.
        - |
          x < −3 describes points to the left of the vertical line.
      answer: 0

    - slug: alg1-u02-w11-q10
      type: multiple_choice
      topic_code: "2.21"
      source: "IM Algebra 1, Unit 2, Lesson 21"
      points: 1
      prompt: |
        When graphing 4x − y > 8 alone, which description is correct?
      options:
        - "Dashed line through (2, 0) and (0, −8), shaded on the side not containing the origin"
        - "Solid line through (2, 0) and (0, −8), shaded toward the origin"
        - "Dashed line through (2, 0) and (0, 8), shaded toward the origin"
        - "Dashed line through (8, 0) and (0, −8), shaded away from the origin"
      option_explanations:
        - |
          Correct. Intercepts are (2, 0) and (0, −8); > makes the line dashed; (0, 0) gives 0 > 8, false, so shade the other side.
        - |
          A strict inequality has a dashed boundary, and the origin fails the test.
        - |
          The y-intercept comes from −y = 8, so y = −8, not 8, and the origin is not in the region.
        - |
          The x-intercept comes from 4x = 8, so x = 2, not 8.
      answer: 0

    - slug: alg1-u02-w11-q11
      type: multiple_choice
      topic_code: "2.16"
      source: "IM Algebra 1, Unit 2, Lesson 16"
      points: 1
      prompt: |
        Solve the system 2x + 3y = 7 and 3x + 5y = 12.
      options:
        - "(−1, 3)"
        - "(2, 1)"
        - "(3, −1)"
        - "(1, 2)"
      option_explanations:
        - |
          Correct. Multiply the first by 3 (6x + 9y = 21) and the second by 2 (6x + 10y = 24); subtract: y = 3; then 2x + 9 = 7, x = −1. Check: −3 + 15 = 12.
        - |
          4 + 3 = 7 fits the first equation, but 6 + 5 = 11, not 12.
        - |
          6 − 3 = 3, not 7, so the pair fails the first equation.
        - |
          2 + 6 = 8, not 7, so the pair fails the first equation.
      answer: 0

    - slug: alg1-u02-w11-q12
      type: multiple_choice
      topic_code: "2.20"
      source: "IM Algebra 1, Unit 2, Lesson 20"
      points: 1
      prompt: |
        What is the solution of 15 − 4x ≤ 3?
      options:
        - "x ≥ 3"
        - "x ≤ 3"
        - "x ≥ −3"
        - "x ≤ 4.5"
      option_explanations:
        - |
          Correct. −4x ≤ −12, and dividing by −4 reverses the symbol: x ≥ 3. Check x = 5: 15 − 20 = −5 ≤ 3, true.
        - |
          Testing x = 0 gives 15 ≤ 3, false, so the solution is not the side below 3.
        - |
          −12 divided by −4 is positive 3, so the boundary is 3, not −3.
        - |
          4.5 would come from dividing 18 by 4; the correct first step is subtracting 15 to get −4x ≤ −12.
      answer: 0

    - slug: alg1-u02-w11-q13
      type: multiple_choice
      topic_code: "2.11"
      source: "IM Algebra 1, Unit 2, Lesson 11"
      points: 1
      prompt: |
        What are the intercepts of the line 5x + 4y = 40?
      options:
        - "(8, 0) and (0, 10)"
        - "(10, 0) and (0, 8)"
        - "(5, 0) and (0, 4)"
        - "(40, 0) and (0, 40)"
      option_explanations:
        - |
          Correct. y = 0 gives 5x = 40, x = 8; x = 0 gives 4y = 40, y = 10.
        - |
          The values are swapped: 40/5 = 8 is the x-intercept.
        - |
          5 and 4 are the coefficients, not the intercepts; divide 40 by each.
        - |
          40 is the constant; each intercept is 40 divided by a coefficient.
      answer: 0

    - slug: alg1-u02-w11-q14
      type: multi_select
      topic_code: "2.24"
      source: "IM Algebra 1, Unit 2, Lesson 24"
      points: 2
      partial_credit: true
      prompt: |
        Which points are solutions of the system x + y ≤ 6 and y > x − 2? Select all that apply.
      options:
        - "(0, 0)"
        - "(4, 2)"
        - "(5, 2)"
        - "(1, 4)"
        - "(−3, 1)"
      option_explanations:
        - |
          Correct. 0 ≤ 6 and 0 > −2 are both true.
        - |
          (4, 2): 6 ≤ 6 is true, but 2 > 2 is false; the point is on the dashed boundary.
        - |
          (5, 2): 5 + 2 = 7, and 7 ≤ 6 is false, so the point fails the first inequality.
        - |
          Correct. 5 ≤ 6 and 4 > −1 are both true.
        - |
          Correct. −2 ≤ 6 and 1 > −5 are both true.
      answer: [0, 3, 4]

    - slug: alg1-u02-w11-q15
      type: multi_select
      topic_code: "2.26"
      source: "IM Algebra 1, Unit 2, Lesson 26"
      points: 2
      partial_credit: true
      prompt: |
        A model has constraints x + y ≤ 8, x ≥ 2, y ≥ 1. Which points are vertices of its feasible region? Select all that apply.
      options:
        - "(2, 1)"
        - "(7, 1)"
        - "(2, 6)"
        - "(0, 8)"
        - "(4, 4)"
      option_explanations:
        - |
          Correct. The lines x = 2 and y = 1 meet at (2, 1), and it satisfies x + y ≤ 8.
        - |
          Correct. The lines y = 1 and x + y = 8 meet at (7, 1), and 7 ≥ 2.
        - |
          Correct. The lines x = 2 and x + y = 8 meet at (2, 6), and 6 ≥ 1.
        - |
          (0, 8) is on x + y = 8 but violates x ≥ 2, so it is outside the region.
        - |
          (4, 4) is inside the region (8 ≤ 8, 4 ≥ 2, 4 ≥ 1) but on only one boundary, so it is not a corner.
      answer: [0, 1, 2]

    - slug: alg1-u02-w11-q16
      type: true_false
      topic_code: "2.24"
      source: "IM Algebra 1, Unit 2, Lesson 24"
      points: 1
      prompt: |
        True or false: a point that satisfies one inequality of a system but not the other is still a solution of the system.
      answer: false
      explanation: |
        False. A system means all its inequalities together; a solution must satisfy every one. Failing a single inequality disqualifies the point.

    - slug: alg1-u02-w11-q17
      type: true_false
      topic_code: "2.22"
      source: "IM Algebra 1, Unit 2, Lesson 22"
      points: 1
      prompt: |
        True or false: the graph of y ≤ 3 is everything on or below a solid horizontal line through (0, 3).
      answer: true
      explanation: |
        True. No x appears, so the boundary is horizontal at y = 3; ≤ makes it solid and includes points below it, where y is smaller.

    - slug: alg1-u02-w11-q18
      type: fill_blank
      topic_code: "2.26"
      source: "IM Algebra 1, Unit 2, Lesson 26"
      points: 1
      prompt: |
        A corner of the feasible region, where two boundary lines meet, is called a ____.
      answer: ["vertex", "corner", "corner point", "vertex of the region"]
      explanation: |
        Vertices are found exactly by solving the two boundary equations as a system; the best value of a linear goal over the region always occurs at one of them.

    - slug: alg1-u02-w11-q19
      type: fill_blank
      topic_code: "2.19"
      source: "IM Algebra 1, Unit 2, Lesson 19"
      points: 1
      prompt: |
        The boundary of the inequality 4x + 3 > 19 is x = ____.
      answer: ["4", "x = 4", "4.0"]
      explanation: |
        Replace > with = and solve: 4x = 16, x = 4. Testing x = 10 gives 43 > 19, true, so the solution is x > 4 with an open circle at 4.

    - slug: alg1-u02-w11-q20
      type: numeric
      topic_code: "2.26"
      source: "IM Algebra 1, Unit 2, Lesson 26"
      points: 1
      prompt: |
        Two boundary lines of a feasible region are x + y = 30 and 2x + y = 40. What is the x-coordinate of the vertex where they meet? Give a whole number.
      answer: { value: 10, tolerance: 0 }
      explanation: |
        Subtracting the first equation from the second gives x = 10; then y = 20. The vertex is (10, 20).

    - slug: alg1-u02-w11-q21
      type: numeric
      topic_code: "2.25"
      source: "IM Algebra 1, Unit 2, Lesson 25"
      points: 1
      prompt: |
        A club must sell at least 50 tickets in total and wants to earn at least $400 from adult tickets at $10 and child tickets at $5. If it sells 30 adult tickets, what is the smallest whole number of child tickets that satisfies both constraints? Give a whole number.
      answer: { value: 20, tolerance: 0 }
      explanation: |
        Total tickets: 30 + c ≥ 50 gives c ≥ 20. Money: 300 + 5c ≥ 400 gives c ≥ 20. Both require at least 20 child tickets.

    - slug: alg1-u02-w11-q22
      type: numeric
      topic_code: "2.14"
      source: "IM Algebra 1, Unit 2, Lesson 14"
      points: 1
      prompt: |
        Solve the system 4x + y = 23 and 4x − 3y = 11. What is the value of y? Give a whole number.
      answer: { value: 3, tolerance: 0 }
      explanation: |
        Subtracting the second equation from the first gives 4y = 12, so y = 3; then 4x + 3 = 23 gives x = 5. Check: 20 − 9 = 11.

    - slug: alg1-u02-w11-q23
