      source: "IM Algebra 1, Unit 2, Lesson 10"
      points: 3
      prompt: |
        A swimming pool is being drained. After 2 hours it holds 42,000 litres and after 5 hours it holds 30,000 litres. Assume the volume V changes at a constant rate with time t in hours.

        (a) Find the rate of change and write V in slope-intercept form.
        (b) Interpret the slope and the V-intercept in context.
        (c) When will the pool be empty?
      answer: |
        (a) Slope = (30000 − 42000)/(5 − 2) = −4000 litres per hour. Using (2, 42000): 42000 = −4000(2) + b, so b = 50000. V = −4000t + 50000.
        (b) The slope −4000 means the pool loses 4,000 litres every hour; the intercept 50,000 is the volume when draining began (t = 0).
        (c) 0 = −4000t + 50000 gives t = 12.5 hours.
      explanation: |
        Three points, one per part.

        (a) 1 pt: slope −4000 and V = −4000t + 50000.

        (b) 1 pt: both interpretations with units.

        (c) 1 pt: 12.5 hours.

    - slug: alg1-u02-w11-q24
      type: long_answer
      topic_code: "2.26"
      source: "IM Algebra 1, Unit 2, Lesson 26"
      points: 6
      prompt: |
        A carpenter makes tables and chairs. A table takes 4 hours of work and 20 board-feet of wood; a chair takes 2 hours and 6 board-feet. This week she has 40 hours and 150 board-feet. Let x be the number of tables and y the number of chairs.

        (1) Write the system of constraints, including non-negativity.
        (2) Find the intercepts of each boundary line and describe the feasible region.
        (3) Find every vertex of the feasible region exactly, showing the system you solved for the crossing point.
        (4) A table earns $80 profit and a chair $30. Evaluate the profit at each vertex and state the best production plan. Explain in one sentence why checking the vertices is enough.
      answer: |
        (1) 4x + 2y ≤ 40 (i.e. 2x + y ≤ 20); 20x + 6y ≤ 150 (i.e. 10x + 3y ≤ 75); x ≥ 0; y ≥ 0.
        (2) Hours line: (10, 0) and (0, 20). Wood line: (7.5, 0) and (0, 25). Both shaded toward the origin; the region is a quadrilateral in the first quadrant bounded by the axes, the wood line near the x-axis and the hours line near the y-axis.
        (3) Vertices: (0, 0); (7.5, 0) from the wood line on the x-axis; (0, 20) from the hours line on the y-axis; and the crossing of 2x + y = 20 and 10x + 3y = 75: y = 20 − 2x, so 10x + 60 − 6x = 75, 4x = 15, x = 3.75, y = 12.5. Vertex (3.75, 12.5).
        (4) Profit 80x + 30y: (0, 0) → 0; (7.5, 0) → 600; (0, 20) → 600; (3.75, 12.5) → 300 + 375 = 675. The best vertex is (3.75, 12.5). Since furniture comes in whole units, check nearby integer points inside the region: (3, 13) uses 38 hours and 138 board-feet for a profit of 240 + 390 = 630; (4, 11) uses 38 hours and 146 board-feet for 320 + 330 = 650. So 4 tables and 11 chairs is the best whole-number plan. A linear profit over a polygon takes its largest value at a corner, so the corners are the only candidates to check.
      explanation: |
        Six points.

        (1) 1 pt: both resource constraints and non-negativity.

        (2) 1 pt: correct intercepts and a description of the region.

        (3) 2 pts: 1 for the three axis vertices, 1 for the crossing (3.75, 12.5) with the system shown.

        (4) 2 pts: 1 for evaluating the profit at every vertex and identifying (3.75, 12.5) with $675; 1 for the reason that a linear goal is maximised at a vertex (a whole-number refinement such as (4, 11) earning $650 is a bonus, not required).

        Common errors: omitting non-negativity; reading the crossing from a sketch; evaluating profit only at the intercepts.
