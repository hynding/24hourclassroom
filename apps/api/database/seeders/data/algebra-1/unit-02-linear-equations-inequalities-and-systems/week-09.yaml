week: 9
unit: 2
title: "Finishing Systems and Starting Inequalities"
topics: ["2.16", "2.17", "2.18", "2.19"]
guide: guides/week-09.md
guide_description: |
  Elimination when both equations must be scaled (and how to clear decimals and fractions first), the three
  possibilities for a system (one solution, none, infinitely many) read from slopes, intercepts or the result
  of elimination, writing inequalities from phrases like "at least" and "no more than", and solving a
  one-variable inequality by finding the boundary and testing a value on each side.
flashcards_description: |
  28 cards on scaling both equations, the three solution cases for a system, inequality vocabulary and
  symbols, the boundary-and-test method, and number-line graphs of solutions.

flashcards:
  - front: Elimination when both equations need scaling → how to pick the multipliers
    back: |
      Choose a variable, find the least common multiple of its two coefficients, and multiply each equation so that variable's coefficients become that LCM with opposite signs (or equal signs, then subtract).
    topic_code: "2.16"
  - front: Solve 4x + 6y = 10 and 6x − 9y = 3 by elimination
    back: |
      LCM of 4 and 6 is 12: first × 3 gives 12x + 18y = 30, second × 2 gives 12x − 18y = 6. Add: 24x = 36, x = 1.5; then 6 + 6y = 10, y = 2/3.
    topic_code: "2.16"
  - front: System with decimal coefficients → first move
    back: |
      Multiply each equation by a power of 10 to clear the decimals, then eliminate as usual. 0.5x + 0.2y = 3 becomes 5x + 2y = 30.
    topic_code: "2.16"
  - front: System with fractional coefficients → first move
    back: |
      Multiply each equation by its least common denominator to clear fractions, then eliminate. (1/2)x + (1/3)y = 4 times 6 becomes 3x + 2y = 24.
    topic_code: "2.16"
  - front: Solve 5x + 2y = 4 and 3x + 4y = −6
    back: |
      First × 2: 10x + 4y = 8. Subtract the second: 7x = 14, x = 2. Then 10 + 2y = 4, y = −3. Check: 6 − 12 = −6.
    topic_code: "2.16"
  - front: Non-integer solution of a system → is it wrong?
    back: |
      Not necessarily. Many systems have fractional solutions such as (28/11, 25/11). Check by substituting into both equations; if both hold, the answer is right.
    topic_code: "2.16"
  - front: Three possibilities for a linear system → the graphs
    back: |
      The two lines cross once (one solution), are parallel and distinct (no solution), or are the same line (infinitely many solutions).
    topic_code: "2.17"
  - front: Number of solutions from slopes and intercepts
    back: |
      Different slopes: one solution. Same slope, different y-intercepts: no solution. Same slope and same y-intercept: infinitely many.
    topic_code: "2.17"
  - front: Number of solutions from what elimination produces
    back: |
      A value (5x = 10): one solution. A false statement (0 = 7): no solution. A true statement (0 = 0): infinitely many.
    topic_code: "2.17"
  - front: Classify 2x + 3y = 6 and 4x + 6y = 18
    back: |
      Both have slope −2/3 but y-intercepts 2 and 3: parallel lines, no solution. Elimination gives 0 = 6, a false statement.
    topic_code: "2.17"
  - front: Classify x − 2y = 4 and −3x + 6y = −12
    back: |
      The second is the first multiplied by −3, so they are the same line: infinitely many solutions, every pair with x − 2y = 4.
    topic_code: "2.17"
  - front: Classify y = 2x + 1 and y = 2x − 4
    back: |
      Same slope 2, different intercepts: parallel, no solution. No number of x makes 2x + 1 equal 2x − 4.
    topic_code: "2.17"
  - front: Consistent, inconsistent, dependent → meanings
    back: |
      Consistent: at least one solution. Inconsistent: no solution (parallel lines). Dependent: the equations describe the same line (infinitely many solutions).
    topic_code: "2.17"
  - front: Two phone plans with the same per-text price and different fees → system type
    back: |
      Parallel lines: they never cost the same, so the system has no solution. The cheaper fee stays cheaper for every number of texts.
    topic_code: "2.17"
  - front: Inequality → definition and the four symbols
    back: |
      A statement comparing two expressions with < (less than), ≤ (less than or equal), > (greater than) or ≥ (greater than or equal).
    topic_code: "2.18"
  - front: Phrases that mean ≥
    back: |
      "At least", "no less than", "a minimum of", "not below". a ≥ 16 means 16 is allowed and anything above it.
    topic_code: "2.18"
  - front: Phrases that mean ≤
    back: |
      "At most", "no more than", "a maximum of", "up to", "must not exceed". n ≤ 8 means 8 is allowed and anything below.
    topic_code: "2.18"
  - front: Phrases that mean strict < or >
    back: |
      "Less than", "fewer than", "under", "below" give <; "more than", "greater than", "exceeds", "above" give >. Equality is not allowed.
    topic_code: "2.18"
  - front: Inequality for "$200 budget, shirts at $7.50 each, $45 reserved"
    back: |
      7.50n + 45 ≤ 200, where n is the number of shirts. The total of shirts and reserve must not exceed the budget, so equality is allowed.
    topic_code: "2.18"
  - front: Inequality for "average of at least 80 on four tests, first three 72, 85, 79"
    back: |
      (72 + 85 + 79 + s)/4 ≥ 80, i.e. (236 + s)/4 ≥ 80, where s is the fourth score. Solving gives s ≥ 84.
    topic_code: "2.18"
  - front: Boundary of an inequality → what it is
    back: |
      The value where the two sides are equal, found by solving the related equation. It splits the number line into the side that satisfies the inequality and the side that does not.
    topic_code: "2.19"
  - front: Boundary-and-test method → the steps
    back: |
      1. Replace the inequality symbol with = and solve for the boundary. 2. Test one value on each side in the original inequality. 3. The side where the test is true is the solution; include the boundary only for ≤ or ≥.
    topic_code: "2.19"
  - front: Solve 7.50n + 45 ≤ 200
    back: |
      Boundary: 7.50n = 155, n ≈ 20.67. Test n = 10: 120 ≤ 200 true. Solution n ≤ 20.67; with whole shirts, at most 20.
    topic_code: "2.19"
  - front: Solve 3x − 5 < 10
    back: |
      Boundary 3x = 15, x = 5. Test x = 0: −5 < 10 true, so the solution is x < 5: open circle at 5, shaded to the left.
    topic_code: "2.19"
  - front: Open circle vs closed circle on a number line
    back: |
      Open for < or > (the boundary is not a solution); closed (filled) for ≤ or ≥ (the boundary is a solution). Shade toward the side that satisfies the inequality.
    topic_code: "2.19"
  - front: Error to spot → "elimination gave 0 = 0, so there is no solution"
    back: |
      0 = 0 is always true, which means the equations describe the same line: infinitely many solutions. "No solution" comes from a false statement like 0 = 7.
    topic_code: "2.17"
  - front: Error to spot → "at most 8 passengers" written as n < 8
    back: |
      "At most" allows exactly 8, so the symbol is ≤: n ≤ 8. Strict < would wrongly exclude a full load.
    topic_code: "2.18"
  - front: Error to spot → shading the wrong side of the boundary
    back: |
      Always test a value. For 3x − 5 < 10 the boundary is 5; testing x = 0 gives −5 < 10, true, so the shading goes left of 5, not right.
    topic_code: "2.19"

quiz:
  description: |
    25 questions · about 45 minutes · elimination with both equations scaled, the number of solutions of a
    system, writing inequalities from situations, and solving one-variable inequalities by boundary and test
    (lessons 2.16 to 2.19), with review of substitution, graphs of lines, solving for a variable and
    statistics. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank
    items are matched automatically; the short answers and the long answer are graded by your teacher against
    the scoring notes.
  questions:
    - slug: alg1-u02-w09-q01
      type: multiple_choice
      topic_code: "2.16"
      source: "IM Algebra 1, Unit 2, Lesson 16"
      points: 1
      prompt: |
        To eliminate x from the system 6x + 5y = 7 and 4x − 3y = 11, which pair of multipliers works?
      options:
        - "Multiply the first by 3 and the second by 5, then add"
        - "Multiply the first by 4 and the second by 6, then add"
        - "Multiply the first by 2 and the second by 3, then subtract"
        - "Multiply the first by 5 and the second by 3, then add"
      option_explanations:
        - |
          That gives 18x and 20x, which do not match.
        - |
          Both x coefficients become 24 with the same sign, so adding does not cancel them (subtracting would).
        - |
          Correct. Both x coefficients become 12; subtracting gives 10y + 9y = 14 − 33, so 19y = −19 and y = −1, x = 2.
        - |
          That gives 30x and 12x; multiplying by 5 and 3 targets the y coefficients (25y and −9y), which also do not cancel.
      answer: 2

    - slug: alg1-u02-w09-q02
      type: multiple_choice
      topic_code: "2.16"
      source: "IM Algebra 1, Unit 2, Lesson 16"
      points: 1
      prompt: |
        Solve the system 0.3x + 0.2y = 1.2 and 0.5x − 0.4y = 0.9.
      options:
        - "(1.5, 3)"
        - "(3, 1.5)"
        - "(2, 3)"
        - "(4, 0)"
      option_explanations:
        - |
          0.3(1.5) + 0.2(3) = 0.45 + 0.6 = 1.05, not 1.2, so the pair fails the first equation.
        - |
          Correct. Clearing decimals gives 3x + 2y = 12 and 5x − 4y = 9; doubling the first and adding gives 11x = 33, x = 3, and 9 + 2y = 12 gives y = 1.5.
        - |
          0.6 + 0.6 = 1.2 fits the first equation, but 1 − 1.2 = −0.2, not 0.9.
        - |
          1.2 + 0 = 1.2 fits the first equation, but 2 − 0 = 2, not 0.9.
      answer: 1

    - slug: alg1-u02-w09-q03
      type: multiple_choice
      topic_code: "2.17"
      source: "IM Algebra 1, Unit 2, Lesson 17"
      points: 1
      prompt: |
        How many solutions does the system y = 4x − 3 and 8x − 2y = 6 have?
      options:
        - "Infinitely many"
        - "None"
        - "Exactly one"
        - "Exactly two"
      option_explanations:
        - |
          Correct. −2y = 6 − 8x gives y = 4x − 3, identical to the first equation: every point on the line is a solution.
        - |
          Parallel lines need the same slope and different intercepts; here the intercepts are also the same.
        - |
          Rewriting the second equation gives y = 4x − 3, the same line, so there is not a single crossing point.
        - |
          Two distinct lines cannot cross at two points, so a linear system never has exactly two solutions.
      answer: 0

    - slug: alg1-u02-w09-q04
      type: multiple_choice
      topic_code: "2.17"
      source: "IM Algebra 1, Unit 2, Lesson 17"
      points: 1
      prompt: |
        A student eliminates a variable from a system and ends with the statement 0 = 5. What does this mean?
      options:
        - "The system has infinitely many solutions."
        - "The system has exactly one solution, x = 5."
        - "The student must have divided by zero."
        - "The system has no solution; the lines are parallel."
      option_explanations:
        - |
          Infinitely many solutions produce a true statement such as 0 = 0.
        - |
          0 = 5 contains no variable; it is not a value of x.
        - |
          Multiplying and adding equations never involves division by zero; the false statement is a legitimate outcome.
        - |
          Correct. A false statement means no pair satisfies both equations: the lines have the same slope and different intercepts.
      answer: 3

    - slug: alg1-u02-w09-q05
      type: multiple_choice
      topic_code: "2.17"
      source: "IM Algebra 1, Unit 2, Lesson 17"
      points: 1
      prompt: |
        Which system has no solution?
      options:
        - "y = 2x + 3 and y = 2x − 1"
        - "y = 2x + 3 and x = 1"
        - "y = 2x + 3 and y = −2x + 3"
        - "y = 2x + 3 and 2y = 4x + 6"
      option_explanations:
        - |
          Correct. Same slope 2 with different intercepts 3 and −1: parallel lines that never meet.
        - |
          x = 1 is a vertical line; it meets y = 2x + 3 at (1, 5).
        - |
          Slopes 2 and −2 differ, so the lines cross once, at (0, 3).
        - |
          Halving the second equation gives y = 2x + 3: the same line, infinitely many solutions.
      answer: 0

    - slug: alg1-u02-w09-q06
      type: multiple_choice
      topic_code: "2.18"
      source: "IM Algebra 1, Unit 2, Lesson 18"
      points: 1
      prompt: |
        A lift can carry a load of at most 900 kg. Each crate weighs 60 kg. Which inequality describes the number of crates c the lift can carry?
      options:
        - "60c ≥ 900"
        - "60c ≤ 900"
        - "c + 60 ≤ 900"
        - "60c < 900"
      option_explanations:
        - |
          This would require the load to be at least 900 kg, the opposite of a limit.
        - |
          Correct. The total weight 60c must not exceed 900, including equality: c ≤ 15.
        - |
          Each crate's weight multiplies the number of crates; it is not added once.
        - |
          "At most" allows a load of exactly 900 kg, so the inequality must include equality.
      answer: 1

    - slug: alg1-u02-w09-q07
      type: multiple_choice
      topic_code: "2.15"
      source: "IM Algebra 1, Unit 2, Lesson 15"
      points: 1
      prompt: |
        To solve 2x + 3y = 13 and 4x − y = 5 by elimination, which single multiplication sets up the cancellation of x?
      options:
        - "Multiply the second equation by 3, then add"
        - "Multiply the first equation by 2, then add"
        - "Multiply the first equation by −2, then add"
        - "Multiply the second equation by −1, then add"
      option_explanations:
        - |
          Tripling the second makes the y terms 3y and −3y, which eliminates y, not x (that also works but is not what was asked).
        - |
          Doubling the first gives 4x + 6y = 26; adding to 4x − y = 5 gives 8x + 5y = 31 with nothing cancelled.
        - |
          Correct. The first becomes −4x − 6y = −26; adding to the second gives −7y = −21, y = 3, and then x = 2.
        - |
          That gives −4x + y = −5; adding to the first leaves −2x + 4y = 8, with both variables present.
      answer: 2

    - slug: alg1-u02-w09-q08
      type: multiple_choice
      topic_code: "2.14"
      source: "IM Algebra 1, Unit 2, Lesson 14"
      points: 1
      prompt: |
        Solve the system 3x + 2y = 19 and 3x − 2y = 5.
      options:
        - "(5, 2)"
        - "(3.5, 4)"
        - "(4, 2)"
        - "(4, 3.5)"
      option_explanations:
        - |
          15 + 4 = 19 fits the first equation, but 15 − 4 = 11, not 5.
        - |
          The coordinates are reversed; 3(3.5) + 2(4) = 18.5, not 19.
        - |
          12 + 4 = 16, not 19, so the pair fails the first equation.
        - |
          Correct. Adding eliminates y: 6x = 24, x = 4; then 12 + 2y = 19 gives y = 3.5. Check: 12 − 7 = 5.
      answer: 3

    - slug: alg1-u02-w09-q09
      type: multiple_choice
      topic_code: "2.19"
      source: "IM Algebra 1, Unit 2, Lesson 19"
      points: 1
      stimulus: |
        A streaming subscription costs $14 per month, and a student has saved $120 for it.
      prompt: |
        Which inequality describes the number of months m the savings will cover, and what is its solution?
      options:
        - "14m < 120; m < 8, so at most 7 months"
        - "m + 14 ≤ 120; m ≤ 106 months"
        - "14m ≤ 120; m ≤ 8.57, so at most 8 whole months"
        - "14m ≥ 120; m ≥ 8.57, so at least 9 months"
      option_explanations:
        - |
          The boundary is 8.57, not 8, and equality is allowed since spending exactly $120 is fine.
        - |
          The monthly price multiplies the number of months; it is not added once.
        - |
          Correct. The cost 14m must not exceed the savings; the boundary is 120/14 ≈ 8.57, and whole months cap it at 8.
        - |
          The savings limit the months from above, not below.
      answer: 2

    - slug: alg1-u02-w09-q10
      type: multiple_choice
      topic_code: "2.19"
      source: "IM Algebra 1, Unit 2, Lesson 19"
      points: 1
      stimulus: |
        A streaming subscription costs $14 per month, and a student has saved $120 for it.
      prompt: |
        The student checks whether m = 9 is a solution of the inequality by substituting. Which statement is correct?
      options:
        - "14(9) = 126, which is more than 120, so 9 is a solution."
        - "9 is a whole number, so it is a solution."
        - "9 is less than 120, so 9 is a solution."
        - "14(9) = 126, which is more than 120, so 9 is not a solution."
      option_explanations:
        - |
          Exceeding the savings is exactly what the inequality forbids.
        - |
          Being a whole number has nothing to do with satisfying the inequality.
        - |
          The comparison must be between the cost 14m and 120, not between m and 120.
        - |
          Correct. Nine months would cost $126, exceeding the savings, so the inequality 14m ≤ 120 is false at m = 9.
      answer: 3

    - slug: alg1-u02-w09-q11
      type: multiple_choice
      topic_code: "2.18"
      source: "IM Algebra 1, Unit 2, Lesson 18"
      points: 1
      stimulus: |
        A streaming subscription costs $14 per month, and a student has saved $120 for it.
      prompt: |
        The student also wants to keep at least $30 of the savings untouched. Which inequality now describes the months she can pay for?
      options:
        - "14m + 30 ≤ 120"
        - "14m − 30 ≤ 120"
        - "14m + 30 ≥ 120"
        - "14m ≤ 30"
      option_explanations:
        - |
          Correct. The subscription cost plus the $30 reserve must not exceed the $120 saved, so 14m ≤ 90 and m ≤ 6.43.
        - |
          Subtracting the reserve would let her spend more than she has.
        - |
          The combined amount must stay within the savings, so the symbol is ≤, not ≥.
        - |
          The reserve is what she keeps, not the limit on spending; she can spend 120 − 30 = 90.
      answer: 0

    - slug: alg1-u02-w09-q12
      type: multiple_choice
      topic_code: "2.13"
      source: "IM Algebra 1, Unit 2, Lesson 13"
      points: 1
      prompt: |
        Solve the system x = 3y + 2 and 2x + y = 18 by substitution.
      options:
        - "(2, 8)"
        - "(8, 2)"
        - "(11, 3)"
        - "(5, 1)"
      option_explanations:
        - |
          The coordinates are reversed; x = 2 would give 2 = 3(8) + 2, which is false.
        - |
          Correct. 2(3y + 2) + y = 18 gives 7y + 4 = 18, y = 2, and x = 3(2) + 2 = 8. Check: 16 + 2 = 18.
        - |
          11 = 3(3) + 2 fits the first equation, but 22 + 3 = 25, not 18.
        - |
          5 = 3(1) + 2 fits the first equation, but 10 + 1 = 11, not 18.
      answer: 1

    - slug: alg1-u02-w09-q13
      type: multiple_choice
      topic_code: "2.10"
      source: "IM Algebra 1, Unit 2, Lesson 10"
      points: 1
      prompt: |
        A line passes through (0, 5) and (4, −3). What is its equation?
      options:
        - "y = −(1/2)x + 5"
        - "y = −2x − 3"
        - "y = −2x + 5"
        - "y = 2x + 5"
      option_explanations:
        - |
          The change in y over the change in x is −8/4 = −2, not −1/2.
        - |
          The y-intercept is 5, the y-value at x = 0, not −3.
        - |
          Correct. The slope is (−3 − 5)/(4 − 0) = −2 and the y-intercept is 5.
        - |
          The line falls from (0, 5) to (4, −3), so the slope is negative.
      answer: 2

    - slug: alg1-u02-w09-q14
      type: multi_select
      topic_code: "2.17"
      source: "IM Algebra 1, Unit 2, Lesson 17"
      points: 2
      partial_credit: true
      prompt: |
        Which systems have infinitely many solutions? Select all that apply.
      options:
        - "y = x + 1 and y = −x + 1"
        - "2x − y = 4 and −4x + 2y = −8"
        - "x + y = 5 and 3x + 3y = 15"
        - "x + y = 5 and x + y = 8"
        - "y = (1/2)x − 3 and x − 2y = 6"
      option_explanations:
        - |
          Slopes 1 and −1 differ, so the lines cross exactly once, at (0, 1).
        - |
          Correct. The second equation is −2 times the first: the same line.
        - |
          Correct. The second equation is three times the first: the same line.
        - |
          Same slope, different intercepts: parallel lines with no solution.
        - |
          Correct. Rewriting x − 2y = 6 gives y = (1/2)x − 3, the same line.
      answer: [1, 2, 4]

    - slug: alg1-u02-w09-q15
      type: multi_select
      topic_code: "2.18"
      source: "IM Algebra 1, Unit 2, Lesson 18"
      points: 2
      partial_credit: true
      prompt: |
        Which phrases are correctly matched with an inequality symbol? Select all that apply.
      options:
        - "\"fewer than 12\" → x < 12"
        - "\"no more than 12\" → x < 12"
        - "\"at least 12\" → x ≥ 12"
        - "\"a maximum of 12\" → x ≤ 12"
        - "\"exceeds 12\" → x ≥ 12"
      option_explanations:
        - |
          Correct. Fewer than 12 excludes 12 itself.
        - |
          No more than 12 allows exactly 12, so the symbol is ≤, not <.
        - |
          Correct. At least 12 means 12 or any larger value, which is x ≥ 12.
        - |
          Correct. A maximum of 12 means 12 is the largest allowed value.
        - |
          Exceeds 12 means strictly more than 12, so the symbol is >, not ≥.
      answer: [0, 2, 3]

    - slug: alg1-u02-w09-q16
      type: true_false
      topic_code: "2.4"
      source: "IM Algebra 1, Unit 2, Lesson 4"
      points: 1
      prompt: |
        True or false: the pair (3, −2) is a solution of the equation 4x + 5y = 2.
      answer: true
      explanation: |
        True. Substituting gives 4(3) + 5(−2) = 12 − 10 = 2, so the pair makes the equation true. Checking a pair means evaluating both sides, not just looking at the numbers.

    - slug: alg1-u02-w09-q17
      type: true_false
      topic_code: "2.19"
      source: "IM Algebra 1, Unit 2, Lesson 19"
      points: 1
      prompt: |
        True or false: the boundary value of an inequality is always part of its solution set.
      answer: false
      explanation: |
        False. The boundary is included only for ≤ or ≥. For a strict inequality such as 3x − 5 < 10, the boundary x = 5 gives 10 < 10, which is false, so 5 is not a solution and the number line shows an open circle.

    - slug: alg1-u02-w09-q18
      type: fill_blank
      topic_code: "2.11"
      source: "IM Algebra 1, Unit 2, Lesson 11"
      points: 1
      prompt: |
        The slope of the line 2x + 3y = 9 is ____ (give a fraction).
      answer: ["-2/3", "−2/3", "-(2/3)", "−(2/3)"]
      explanation: |
        For ax + by = c the slope is −a/b, so here it is −2/3. Solving for y confirms it: y = −(2/3)x + 3.

    - slug: alg1-u02-w09-q19
      type: fill_blank
      topic_code: "2.19"
      source: "IM Algebra 1, Unit 2, Lesson 19"
      points: 1
      prompt: |
        On a number line, the solutions of x ≤ 4 are shown with a ____ circle at 4 and shading to the left.
      answer: ["closed", "filled", "solid", "filled-in"]
      explanation: |
        The symbol ≤ includes the boundary, so the circle at 4 is closed (filled). A strict inequality would use an open circle.

    - slug: alg1-u02-w09-q20
      type: numeric
      topic_code: "2.16"
      source: "IM Algebra 1, Unit 2, Lesson 16"
      points: 1
      prompt: |
        Solve the system 3x + 4y = 2 and 5x + 6y = 4. What is the value of x? Give a whole number (it may be negative).
      answer: { value: 2, tolerance: 0 }
      explanation: |
        Multiply the first by 3 (9x + 12y = 6) and the second by 2 (10x + 12y = 8). Subtract the first from the second: x = 2. Then 6 + 4y = 2 gives y = −1. Check in the second equation: 10 − 6 = 4.

    - slug: alg1-u02-w09-q21
      type: numeric
      topic_code: "2.19"
      source: "IM Algebra 1, Unit 2, Lesson 19"
      points: 1
      prompt: |
        A student needs an average of at least 85 on five quizzes. Her first four scores are 80, 88, 91 and 79. What is the lowest score on the fifth quiz that meets the goal? Give a whole number.
      answer: { value: 87, tolerance: 0 }
      explanation: |
        (80 + 88 + 91 + 79 + s)/5 ≥ 85 means 338 + s ≥ 425, so s ≥ 87. The boundary is 87 and higher scores also work.

    - slug: alg1-u02-w09-q22
      type: numeric
      topic_code: "1.12"
      source: "IM Algebra 1, Unit 1, Lesson 12"
      points: 1
      prompt: |
        The data 4, 8, 8, 12 have mean 8. What is the standard deviation (divide by n)? Give your answer to two decimal places.
      answer: { value: 2.83, tolerance: 0.01 }
      explanation: |
        Deviations −4, 0, 0, 4; squares 16, 0, 0, 16; variance 32/4 = 8; SD = √8 ≈ 2.83.

    - slug: alg1-u02-w09-q23
      type: short_answer
      topic_code: "2.17"
      source: "IM Algebra 1, Unit 2, Lesson 17"
      points: 3
      prompt: |
        Two companies rent scooters. Company A charges $3 to unlock plus $0.25 per minute. Company B charges $0.25 per minute with no unlock fee.

        (a) Write a system of equations for the cost C after m minutes with each company.
        (b) Without solving, explain how many solutions the system has and what that means for a rider.
        (c) Company B changes its price to $0.40 per minute with no unlock fee. Now find the number of minutes for which the two companies cost the same.
      answer: |
        (a) A: C = 0.25m + 3. B: C = 0.25m.
        (b) The lines have the same slope (0.25) and different intercepts (3 and 0), so they are parallel: no solution. The companies never cost the same; B is always exactly $3 cheaper.
        (c) 0.25m + 3 = 0.40m gives 3 = 0.15m, m = 20 minutes (both cost $8).
      explanation: |
        Three points, one per part.

        (a) 1 pt: both equations.

        (b) 1 pt: no solution, justified by equal slopes and different intercepts, with the rider interpretation.

        (c) 1 pt: m = 20.

    - slug: alg1-u02-w09-q24
      type: short_answer
      topic_code: "2.18"
      source: "IM Algebra 1, Unit 2, Lesson 18"
      points: 3
      prompt: |
        A school bus has a capacity of 48 passengers. A field trip needs 4 adult chaperones on the bus, and the rest of the seats can go to students.

        (a) Write an inequality for the number of students s who can ride.
        (b) Find the boundary of the inequality and use a test value to decide which side is the solution.
        (c) Describe the number-line graph of the solution, and state the realistic solutions in context.
      answer: |
        (a) s + 4 ≤ 48.
        (b) Boundary: s + 4 = 48, s = 44. Test s = 10: 14 ≤ 48 is true, so values below the boundary satisfy the inequality: s ≤ 44.
        (c) Closed circle at 44, shaded to the left. In context s is a whole number from 0 to 44.
      explanation: |
        Three points, one per part.

        (a) 1 pt: s + 4 ≤ 48 (or s ≤ 44 with the reasoning).

        (b) 1 pt: boundary 44 and a test value showing the lower side works.

        (c) 1 pt: closed circle, shading left, and the whole-number restriction 0 to 44.

    - slug: alg1-u02-w09-q25
      type: long_answer
      topic_code: "2.16"
      source: "IM Algebra 1, Unit 2, Lesson 16"
      points: 6
      prompt: |
        A chemist mixes a 20% salt solution with a 50% salt solution to make 12 litres of a 30% salt solution. Let x be the litres of 20% solution and y the litres of 50% solution.

        (1) Write a system of two equations: one for the total volume and one for the total amount of salt.
        (2) Solve the system by elimination, showing every step, and check your solution in both equations.
        (3) Explain what would happen to the system if the chemist wanted 12 litres of a 60% solution, and interpret the result in context.
        (4) Describe, without solving, how you could tell from the equations alone whether a mixture system like this has one solution, none or infinitely many.
      answer: |
        (1) x + y = 12 and 0.20x + 0.50y = 0.30(12) = 3.6.
        (2) Multiply the second equation by 10: 2x + 5y = 36. Multiply the first by 2: 2x + 2y = 24. Subtract: 3y = 12, y = 4; then x = 8. Check: 8 + 4 = 12 and 0.20(8) + 0.50(4) = 1.6 + 2.0 = 3.6.
        (3) The salt equation becomes 0.20x + 0.50y = 7.2, so 2x + 5y = 72 with x + y = 12. Subtracting 2x + 2y = 24 gives 3y = 48, y = 16, x = −4. The system has a solution but it is negative, which is impossible: you cannot reach 60% by mixing solutions that are at most 50% salt.
        (4) Compare the slopes: the volume line has slope −1 and the salt line has slope −0.20/0.50 = −0.4. Different slopes mean exactly one solution for any target percentage; the question is only whether that solution makes sense (non-negative volumes). The system could have no solution only if the two equations had the same slope, which would need equal concentrations, and infinitely many only if they were the same equation.
      explanation: |
        Six points.

        (1) 1 pt: both equations (accept 20x + 50y = 360).

        (2) 2 pts: 1 for valid elimination steps, 1 for (8, 4) with both checks.

        (3) 2 pts: 1 for solving to (−4, 16) or equivalent; 1 for interpreting that a negative volume means the target is unreachable because 60% exceeds both concentrations.

        (4) 1 pt: a correct argument from slopes (or from the structure of the equations) that the system always has exactly one solution.

        Common errors: using 30 instead of 3.6 in the salt equation; forgetting to multiply the right side when scaling; reporting x = −4 as an acceptable amount.
