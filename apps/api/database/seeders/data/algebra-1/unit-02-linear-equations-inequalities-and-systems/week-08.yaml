week: 8
unit: 2
title: "Systems of Linear Equations: Graphing, Substitution and Elimination"
topics: ["2.12", "2.13", "2.14", "2.15"]
guide: guides/week-08.md
guide_description: |
  Writing a system from a situation with two unknowns, why the intersection of the graphs is the solution,
  solving by substitution step by step, elimination when terms already cancel, and elimination after
  multiplying one equation by a constant. Ends with a table for choosing the method.
flashcards_description: |
  28 cards on what a system and its solution are, graphing systems, the substitution and elimination
  procedures, why adding equations is valid, sign traps, and choosing a method.

flashcards:
  - front: System of linear equations → definition and what its solution is
    back: |
      Two or more linear equations that must hold at the same time. A solution is a pair (x, y) that satisfies every equation in the system.
    topic_code: "2.12"
  - front: Two unknowns → how many conditions you need
    back: |
      Two independent conditions, one equation each. "300 tickets sold" gives a + c = 300; "$2,100 collected at $9 and $5" gives 9a + 5c = 2100.
    topic_code: "2.12"
  - front: Why the intersection of the graphs solves the system
    back: |
      Every point on a line is a solution of that line's equation. A point on both lines satisfies both equations, which is exactly what a solution of the system means.
    topic_code: "2.12"
  - front: Limitation of solving a system by graphing
    back: |
      The crossing can only be read as accurately as the drawing allows; a solution like (2.1, 6.8) looks like (2, 7). Graphing is for seeing and estimating; algebra gives exact answers.
    topic_code: "2.12"
  - front: System for "two numbers add to 50 and differ by 14"
    back: |
      x + y = 50 and x − y = 14. Adding gives 2x = 64, so x = 32 and y = 18.
    topic_code: "2.12"
  - front: Substitution method → the five steps
    back: |
      1. Isolate a variable in the easier equation. 2. Substitute that expression, in parentheses, into the other equation. 3. Solve the one-variable equation. 4. Back-substitute to find the other variable. 5. Check in both original equations.
    topic_code: "2.13"
  - front: When substitution is the natural choice
    back: |
      When one equation already has a variable isolated (y = 2x − 1) or has a coefficient of 1 that makes isolating easy (a + c = 300 gives c = 300 − a).
    topic_code: "2.13"
  - front: Solve y = 2x − 1 and 3x + 2y = 19 by substitution
    back: |
      3x + 2(2x − 1) = 19 → 7x − 2 = 19 → x = 3; then y = 2(3) − 1 = 5. Check: 9 + 10 = 19. Solution (3, 5).
    topic_code: "2.13"
  - front: Solve x = 4y + 1 and 2x − 3y = 12 by substitution
    back: |
      2(4y + 1) − 3y = 12 → 8y + 2 − 3y = 12 → 5y = 10 → y = 2, x = 9. Check: 18 − 6 = 12.
    topic_code: "2.13"
  - front: The parentheses rule when substituting
    back: |
      Replace the variable with the whole expression in parentheses: 3x + 2(2x − 1), never 3x + 2·2x − 1. The coefficient must multiply every term of the expression.
    topic_code: "2.13"
  - front: Back-substitution → what it is and where to do it
    back: |
      Putting the value you found into one of the original equations (usually the simpler one) to find the other variable. Then check the pair in the other equation.
    topic_code: "2.13"
  - front: Elimination → the idea in one sentence
    back: |
      Add or subtract the two equations so that one variable's terms cancel, leaving an equation in a single variable.
    topic_code: "2.14"
  - front: Why adding two equations of a system is legitimate
    back: |
      At the solution both equations are true statements that two quantities are equal; adding equal quantities to equal quantities gives equal quantities, so the sum is also true at the solution.
    topic_code: "2.14"
  - front: Solve 3x + 2y = 16 and 5x − 2y = 8 by elimination
    back: |
      The y coefficients are opposites, so add: 8x = 24, x = 3. Then 9 + 2y = 16, y = 3.5. Check: 15 − 7 = 8.
    topic_code: "2.14"
  - front: Same coefficients rather than opposite → what to do
    back: |
      Subtract one equation from the other, or multiply one equation by −1 and add. For 4x + y = 14 and 4x − 3y = −2, subtracting gives 4y = 16, y = 4.
    topic_code: "2.14"
  - front: Sign trap when subtracting equations
    back: |
      Subtracting −3y adds 3y and subtracting −2 adds 2: (y) − (−3y) = 4y and 14 − (−2) = 16. Multiplying by −1 and adding avoids the double negatives.
    topic_code: "2.14"
  - front: Solve x + y = 11 and x − y = 3
    back: |
      Add: 2x = 14, x = 7. Then y = 4. Check: 7 − 4 = 3.
    topic_code: "2.14"
  - front: Elimination when nothing cancels → the fix
    back: |
      Multiply one equation (or both) by a constant so that one variable's coefficients become opposites, then add. Multiplying both sides by a non-zero constant keeps the equation equivalent.
    topic_code: "2.15"
  - front: Solve 2x + 3y = 12 and 5x − y = 13 by elimination
    back: |
      Multiply the second by 3: 15x − 3y = 39. Add to the first: 17x = 51, x = 3. Then 15 − y = 13, y = 2. Check: 6 + 6 = 12.
    topic_code: "2.15"
  - front: Solve 3x + 4y = 10 and 5x + 6y = 16 by elimination
    back: |
      Multiply the first by 3 and the second by 2: 9x + 12y = 30 and 10x + 12y = 32. Subtract: x = 2. Then 6 + 4y = 10, y = 1.
    topic_code: "2.15"
  - front: Choosing which variable to eliminate
    back: |
      Pick the variable whose coefficients are easiest to match: already opposites, or one a multiple of the other, or with a small common multiple.
    topic_code: "2.15"
  - front: Choosing a method → the quick table
    back: |
      Variable already isolated: substitution. Coefficients opposite or equal: add or subtract. Unrelated coefficients: multiply then eliminate. Want a picture or estimate: graph.
    topic_code: "2.15"
  - front: Do the three methods ever disagree?
    back: |
      No. Graphing, substitution and elimination all find the same pair; they differ only in effort and precision. Use the one with the least arithmetic.
    topic_code: "2.15"
  - front: Error to spot → "I multiplied the first equation by 3 to get 6x + 3y = 12" from 2x + y = 12
    back: |
      Both sides must be multiplied: 6x + 3y = 36. Scaling only the left side changes the equation and the solution.
    topic_code: "2.15"
  - front: Error to spot → "x = 3, so the solution is 3"
    back: |
      A system in two variables has a pair as its solution. Back-substitute to find y and report (3, 5), then check both equations.
    topic_code: "2.13"
  - front: Error to spot → checking only in the equation used for back-substitution
    back: |
      That equation is satisfied by construction. The real test is the other equation; check the pair in both to catch earlier slips.
    topic_code: "2.13"
  - front: Error to spot → reading (2, 7) from a graph when the exact answer is (2.1, 6.8)
    back: |
      Graph estimates are approximate. Confirm by substituting into both equations; if the check fails, solve algebraically.
    topic_code: "2.12"
  - front: Tickets system → a + c = 300 and 9a + 5c = 2100 solved
    back: |
      c = 300 − a; 9a + 5(300 − a) = 2100 → 4a = 600 → a = 150, c = 150. Check: 1350 + 750 = 2100.
    topic_code: "2.13"

quiz:
  description: |
    25 questions · about 45 minutes · writing and graphing systems, substitution, and elimination with and
    without multiplying (lessons 2.12 to 2.15), with review of slope-intercept and standard form, solving for
    a variable, and statistics from earlier weeks. Multiple choice, select-all, true/false and numeric items
    are graded at once; fill-in-the-blank items are matched automatically; the short answers and the long
    answer are graded by your teacher against the scoring notes.
  questions:
    - slug: alg1-u02-w08-q01
      type: multiple_choice
      topic_code: "2.12"
      source: "IM Algebra 1, Unit 2, Lesson 12"
      points: 1
      prompt: |
        A farm stand sold 40 items, pumpkins at $6 and squash at $2, for $140 in total. With p pumpkins and s squash, which system models the situation?
      options:
        - "6p + 2s = 40 and p + s = 140"
        - "p + s = 40 and 6p + 2s = 140"
        - "p + s = 140 and 6p + 2s = 40"
        - "p + s = 40 and 2p + 6s = 140"
      option_explanations:
        - |
          Both totals are attached to the wrong equations.
        - |
          Correct. Counting items gives p + s = 40; counting money at $6 and $2 gives 6p + 2s = 140.
        - |
          The totals are swapped: 40 is the count of items and 140 the dollars.
        - |
          The prices are attached to the wrong vegetables.
      answer: 1

    - slug: alg1-u02-w08-q02
      type: multiple_choice
      topic_code: "2.12"
      source: "IM Algebra 1, Unit 2, Lesson 12"
      points: 1
      prompt: |
        Graph description: the lines y = x + 1 and y = −x + 5 are drawn on the same axes and cross at one point. Why is that crossing point the solution of the system?
      options:
        - "Because it is the only point that lies on both lines, so it satisfies both equations."
        - "Because it is the midpoint between the two y-intercepts."
        - "Because it has the largest y-value of any point on either line."
        - "Because it is where both lines cross the x-axis."
      option_explanations:
        - |
          Correct. Each line is the set of solutions of its equation; a point on both is a solution of both.
        - |
          The crossing point (2, 3) is not the midpoint of (0, 1) and (0, 5).
        - |
          Lines extend without bound; there is no largest y-value.
        - |
          The lines cross each other at (2, 3), which is not on the x-axis.
      answer: 0

    - slug: alg1-u02-w08-q03
      type: multiple_choice
      topic_code: "2.13"
      source: "IM Algebra 1, Unit 2, Lesson 13"
      points: 1
      prompt: |
        Solve the system y = 3x − 2 and 4x + y = 19.
      options:
        - "(3, 5)"
        - "(7, 3)"
        - "(2, 4)"
        - "(3, 7)"
      option_explanations:
        - |
          3(3) − 2 = 7, not 5, so this pair fails the first equation.
        - |
          The coordinates are reversed; x = 7 would give y = 19 and 4(7) + 19 = 47.
        - |
          3(2) − 2 = 4 fits the first equation, but 4(2) + 4 = 12, not 19.
        - |
          Correct. Substituting gives 4x + 3x − 2 = 19, so 7x = 21, x = 3, and y = 3(3) − 2 = 7. Check: 12 + 7 = 19.
      answer: 3

    - slug: alg1-u02-w08-q04
      type: multiple_choice
      topic_code: "2.13"
      source: "IM Algebra 1, Unit 2, Lesson 13"
      points: 1
      prompt: |
        A student substitutes y = 2x + 3 into 5x − 2y = 4 and writes 5x − 2 · 2x + 3 = 4. What went wrong?
      options:
        - "Nothing; the next line should be 3x + 3 = 4."
        - "The student should have added the equations instead of substituting."
        - "The expression 2x + 3 should have been placed in parentheses so that −2 multiplies both terms: 5x − 2(2x + 3) = 4."
        - "The student should have substituted into the first equation instead."
      option_explanations:
        - |
          Without parentheses the −2 multiplies only the 2x; the resulting equation has a different solution.
        - |
          Substitution is a fine method here; the error is the missing parentheses, not the choice of method.
        - |
          Correct. 5x − 2(2x + 3) = 4 gives 5x − 4x − 6 = 4, so x = 10 and y = 23.
        - |
          The first equation is the one that gave the expression; substituting back into it yields nothing new.
      answer: 2

    - slug: alg1-u02-w08-q05
      type: multiple_choice
      topic_code: "2.14"
      source: "IM Algebra 1, Unit 2, Lesson 14"
      points: 1
      prompt: |
        Which first step eliminates a variable from the system 6x + 5y = 7 and 6x − 2y = 28?
      options:
        - "Add the two equations"
        - "Subtract the second equation from the first"
        - "Multiply the first equation by 5"
        - "Substitute y = 7 into the second equation"
      option_explanations:
        - |
          Adding gives 12x + 3y = 35; nothing cancels because the x coefficients are equal, not opposite.
        - |
          Correct. Subtracting removes 6x and leaves 7y = −21, so y = −3 and then x = 11/3.
        - |
          Multiplying by 5 gives 30x + 25y = 35, which does not match any coefficient in the second equation.
        - |
          y = 7 is not known; 7 is the constant on the right of the first equation.
      answer: 1

    - slug: alg1-u02-w08-q06
      type: multiple_choice
      topic_code: "2.14"
      source: "IM Algebra 1, Unit 2, Lesson 14"
      points: 1
      prompt: |
        Solve the system 2x + 7y = 20 and −2x + 3y = 10.
      options:
        - "(10, 0)"
        - "(2, 3)"
        - "(3, 2)"
        - "(−0.5, 3)"
      option_explanations:
        - |
          2(10) + 0 = 20 fits the first equation, but −20 + 0 = −20, not 10.
        - |
          4 + 21 = 25, not 20, so this pair fails the first equation.
        - |
          6 + 14 = 20 fits the first equation, but −6 + 6 = 0, not 10, so (3, 2) fails the second.
        - |
          Correct. Adding the equations gives 10y = 30, so y = 3; then 2x + 21 = 20 gives x = −0.5. Check in the second: 1 + 9 = 10.
      answer: 3

    - slug: alg1-u02-w08-q07
      type: multiple_choice
      topic_code: "2.15"
      source: "IM Algebra 1, Unit 2, Lesson 15"
      points: 1
      prompt: |
        To solve 3x + 2y = 8 and 4x − 5y = 3 by elimination, which multiplication sets up the cancellation of y?
      options:
        - "Multiply the first equation by 5 and the second by 2, then add"
        - "Multiply the first equation by 4 and the second by 3, then add"
        - "Multiply the first equation by −1, then add"
        - "Multiply the first equation by 2 and the second by 5, then subtract"
      option_explanations:
        - |
          Correct. The y terms become 10y and −10y, which cancel on adding: 23x = 46, x = 2, y = 1.
        - |
          That makes the x coefficients both 12; adding would not cancel anything, and subtracting would eliminate x, not y.
        - |
          Multiplying by −1 gives −3x − 2y = −8; adding to the second gives x − 7y = −5, with nothing eliminated.
        - |
          That gives 4y and −25y, which do not cancel.
      answer: 0

    - slug: alg1-u02-w08-q08
      type: multiple_choice
      topic_code: "2.3"
      source: "IM Algebra 1, Unit 2, Lesson 3"
      points: 1
      prompt: |
        A table pairs the number of hours h = 2, 4, 6 with the cost C = 95, 155, 215. Which equation fits every row?
      options:
        - "C = 47.5h"
        - "C = 60h − 25"
        - "C = 30h + 35"
        - "C = 35h + 30"
      option_explanations:
        - |
          47.5(2) = 95 fits the first row, but 47.5(4) = 190, not 155.
        - |
          60(2) − 25 = 95 fits the first row, but 60(4) − 25 = 215, not 155; 60 is the change per 2 hours, not per hour.
        - |
          Correct. C rises by 60 for every 2 hours, so 30 per hour; at h = 2, 60 + 35 = 95, and 30(6) + 35 = 215 confirms the last row.
        - |
          35(2) + 30 = 100, not 95, so the rate and the fixed amount are swapped.
      answer: 2

    - slug: alg1-u02-w08-q09
      type: multiple_choice
      topic_code: "2.12"
      source: "IM Algebra 1, Unit 2, Lesson 12"
      points: 1
      stimulus: |
        Two friends save money. Mai starts with $30 and adds $8 each week. Noah starts with $0 and adds $13 each week. Let w be the number of weeks and S the savings in dollars.
      prompt: |
        Which system describes the two savings plans?
      options:
        - "S = 8 + 30w and S = 13w"
        - "S = 30w + 8 and S = 13w"
        - "S = 30 + 8w and S = 13 + w"
        - "S = 30 + 8w and S = 13w"
      option_explanations:
        - |
          The starting amount and weekly rate are swapped for Mai.
        - |
          Mai's 30 is a starting amount, not a weekly rate.
        - |
          Noah adds 13 per week, so the 13 multiplies w.
        - |
          Correct. Mai's savings start at 30 and grow by 8 per week; Noah's start at 0 and grow by 13 per week.
      answer: 3

    - slug: alg1-u02-w08-q10
      type: multiple_choice
      topic_code: "2.13"
      source: "IM Algebra 1, Unit 2, Lesson 13"
      points: 1
      stimulus: |
        Two friends save money. Mai starts with $30 and adds $8 each week. Noah starts with $0 and adds $13 each week. Let w be the number of weeks and S the savings in dollars.
      prompt: |
        After how many weeks will the two have the same amount, and how much is it?
      options:
        - "8 weeks, $94"
        - "5 weeks, $70"
        - "6 weeks, $78"
        - "30 weeks, $390"
      option_explanations:
        - |
          At 8 weeks Mai has 30 + 64 = 94 but Noah has 104, so Noah is already ahead.
        - |
          At 5 weeks Mai has 30 + 40 = 70 but Noah has only 65, so they are not equal.
        - |
          Correct. Setting 30 + 8w = 13w gives 30 = 5w, w = 6, and S = 13(6) = 78. Check: 30 + 48 = 78.
        - |
          At 30 weeks Mai has 270 and Noah 390; they are far apart.
      answer: 2

    - slug: alg1-u02-w08-q11
      type: multiple_choice
      topic_code: "2.12"
      source: "IM Algebra 1, Unit 2, Lesson 12"
      points: 1
      stimulus: |
        Two friends save money. Mai starts with $30 and adds $8 each week. Noah starts with $0 and adds $13 each week. Let w be the number of weeks and S the savings in dollars.
      prompt: |
        If both plans are graphed with w on the horizontal axis, what do the lines look like before and after the crossing point?
      options:
        - "Mai's line is above Noah's both before and after the crossing."
        - "Mai's line is above Noah's before the crossing and below it afterwards, because Noah's line is steeper."
        - "The lines are parallel and never cross."
        - "Noah's line is above Mai's before the crossing, because he saves faster."
      option_explanations:
        - |
          After week 6 Noah has more, so his line is above.
        - |
          Correct. Mai starts higher (intercept 30) but Noah's slope 13 beats Mai's 8, so Noah overtakes at week 6.
        - |
          The slopes 8 and 13 differ, so the lines are not parallel and cross exactly once.
        - |
          Noah starts at $0, below Mai's $30, so his line is below hers at first.
      answer: 1

    - slug: alg1-u02-w08-q12
      type: multiple_choice
      topic_code: "2.10"
      source: "IM Algebra 1, Unit 2, Lesson 10"
      points: 1
      prompt: |
        What is the slope of the line 3x − 6y = 12?
      options:
        - "1/2"
        - "−2"
        - "−1/2"
        - "3"
      option_explanations:
        - |
          Correct. −a/b = −3/(−6) = 1/2; equivalently y = (1/2)x − 2.
        - |
          −2 is the y-intercept of y = (1/2)x − 2, not its slope.
        - |
          The two negatives in −3/(−6) make the slope positive.
        - |
          3 is the coefficient of x in standard form, not the slope.
      answer: 0

    - slug: alg1-u02-w08-q13
      type: multiple_choice
      topic_code: "2.8"
      source: "IM Algebra 1, Unit 2, Lesson 8"
      points: 1
      prompt: |
        Solve 4x − 3y = 24 for y.
      options:
        - "y = (24 − 4x)/3"
        - "y = (4x − 24)/3"
        - "y = 4x − 8"
        - "y = 24 − 4x/3"
      option_explanations:
        - |
          This divides by 3 instead of −3; the signs are reversed.
        - |
          Correct. −3y = 24 − 4x, so y = (24 − 4x)/(−3) = (4x − 24)/3, which is (4/3)x − 8.
        - |
          The 4x must be divided by 3 as well, giving (4/3)x.
        - |
          The whole of 24 − 4x must be divided, and dividing by −3 flips the signs.
      answer: 1

    - slug: alg1-u02-w08-q14
      type: multi_select
      topic_code: "2.14"
      source: "IM Algebra 1, Unit 2, Lesson 14"
      points: 2
      partial_credit: true
      prompt: |
        For which systems does adding the two equations immediately eliminate a variable? Select all that apply.
      options:
        - "2x + 5y = 1 and 2x + 5y = 7"
        - "3x + y = 10 and 3x − y = 2"
        - "5x − 3y = 4 and 2x + 3y = 10"
        - "x + 4y = 9 and −x + 2y = 3"
        - "x + y = 6 and 2x + 2y = 12"
      option_explanations:
        - |
          Adding gives 4x + 10y = 8; nothing cancels because the coefficients match rather than oppose.
        - |
          Correct. The y coefficients 1 and −1 cancel, leaving 6x = 12.
        - |
          Correct. The y coefficients −3 and 3 cancel, leaving 7x = 14.
        - |
          Correct. The x coefficients 1 and −1 cancel, leaving 6y = 12.
        - |
          Adding gives 3x + 3y = 18 with both variables still present.
      answer: [1, 2, 3]

    - slug: alg1-u02-w08-q15
      type: multi_select
      topic_code: "2.13"
      source: "IM Algebra 1, Unit 2, Lesson 13"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the system x = 2y − 1 and 3x + 4y = 27 are true? Select all that apply.
      options:
        - "Checking (5, 3) in the second equation gives 15 + 12 = 27."
        - "The solution has x = 5."
        - "The solution is (3, 5)."
        - "The solution has y = 3."
        - "Substituting gives 3(2y − 1) + 4y = 27."
      option_explanations:
        - |
          Correct. 3(5) + 4(3) = 27 confirms the solution.
        - |
          Correct. Back-substituting y = 3 gives x = 2(3) − 1 = 5.
        - |
          The pair is written (x, y) = (5, 3); (3, 5) has the coordinates reversed and fails both equations.
        - |
          Correct. 6y − 3 + 4y = 27 gives 10y = 30, so y = 3.
        - |
          Correct. The expression for x replaces x, in parentheses.
      answer: [0, 1, 3, 4]

    - slug: alg1-u02-w08-q16
      type: true_false
      topic_code: "1.10"
      source: "IM Algebra 1, Unit 1, Lesson 10"
      points: 1
      prompt: |
        True or false: replacing the largest value of a data set with a much larger value leaves the median unchanged.
      answer: true
      explanation: |
        True. The largest value is still the largest after the change, so every value keeps its position in the ordered list and the median, a positional statistic, does not move. The mean, by contrast, rises.

    - slug: alg1-u02-w08-q17
      type: true_false
      topic_code: "2.6"
      source: "IM Algebra 1, Unit 2, Lesson 6"
      points: 1
      prompt: |
        True or false: multiplying only the left side of an equation by 4 before eliminating is acceptable as long as you remember to divide at the end.
      answer: false
      explanation: |
        False. Multiplying one side only produces a different equation with different solutions. Both sides must be multiplied by the same non-zero constant to keep the equation equivalent.

    - slug: alg1-u02-w08-q18
      type: fill_blank
      topic_code: "2.5"
      source: "IM Algebra 1, Unit 2, Lesson 5"
      points: 1
      prompt: |
        The y-intercept of the graph of 3x + 2y = 12 is the point (0, ____).
      answer: ["6", "6.0"]
      explanation: |
        Set x = 0: 2y = 12, so y = 6. The x-intercept, from 3x = 12, is (4, 0).

    - slug: alg1-u02-w08-q19
      type: fill_blank
      topic_code: "2.13"
      source: "IM Algebra 1, Unit 2, Lesson 13"
      points: 1
      prompt: |
        To solve y = x + 5 and 3x + y = 21 by substitution, replace y in the second equation to get 3x + (x + 5) = 21, so x = ____.
      answer: ["4", "x = 4", "4.0"]
      explanation: |
        3x + x + 5 = 21 gives 4x = 16, so x = 4 and y = 9. Check: 12 + 9 = 21.

    - slug: alg1-u02-w08-q20
      type: numeric
      topic_code: "2.15"
      source: "IM Algebra 1, Unit 2, Lesson 15"
      points: 1
      prompt: |
        Solve the system 4x + 3y = 26 and 2x − 5y = −13. What is the value of y? Give a whole number.
      answer: { value: 4, tolerance: 0 }
      explanation: |
        Multiply the second equation by −2: −4x + 10y = 26. Add to the first: 13y = 52, so y = 4. Then 4x + 12 = 26 gives x = 3.5. Check: 7 − 20 = −13.

    - slug: alg1-u02-w08-q21
      type: numeric
      topic_code: "2.14"
      source: "IM Algebra 1, Unit 2, Lesson 14"
      points: 1
      prompt: |
        Solve the system x + y = 25 and x − y = 7. What is the value of x? Give a whole number.
      answer: { value: 16, tolerance: 0 }
      explanation: |
        Adding the equations gives 2x = 32, so x = 16; then y = 9. Check: 16 − 9 = 7.

    - slug: alg1-u02-w08-q22
      type: numeric
