    - slug: alg1-u02-w08-q23
      type: short_answer
      topic_code: "2.12"
      source: "IM Algebra 1, Unit 2, Lesson 12"
      points: 3
      prompt: |
        A jar contains only dimes and quarters. There are 28 coins worth $4.75.

        (a) Define variables and write a system of equations.
        (b) Solve the system by any method, showing your steps.
        (c) Check your answer against both conditions in the original situation.
      answer: |
        (a) d = number of dimes, q = number of quarters. d + q = 28 and 0.10d + 0.25q = 4.75.
        (b) From the first, d = 28 − q. Substitute: 0.10(28 − q) + 0.25q = 4.75 → 2.8 − 0.10q + 0.25q = 4.75 → 0.15q = 1.95 → q = 13, d = 15.
        (c) 15 + 13 = 28 coins; 15(0.10) + 13(0.25) = 1.50 + 3.25 = 4.75 dollars.
      explanation: |
        Three points, one per part.

        (a) 1 pt: variables defined and both equations (accept 10d + 25q = 475).

        (b) 1 pt: a valid method reaching d = 15, q = 13.

        (c) 1 pt: both conditions checked with the numbers.

    - slug: alg1-u02-w08-q24
      type: short_answer
      topic_code: "2.15"
      source: "IM Algebra 1, Unit 2, Lesson 15"
      points: 3
      prompt: |
        Consider the system 3x + 4y = 25 and 5x − 2y = 7.

        (a) Explain why neither adding nor subtracting the equations as written eliminates a variable.
        (b) Multiply one equation by a constant so that adding eliminates y, then solve the system.
        (c) Describe a different multiplication (or pair of multiplications) that would eliminate x instead, without carrying it out.
      answer: |
        (a) The x coefficients are 3 and 5 and the y coefficients are 4 and −2; neither pair is equal or opposite, so adding gives 8x + 2y = 32 and subtracting gives −2x + 6y = 18, each with both variables.
        (b) Multiply the second equation by 2: 10x − 4y = 14. Add to the first: 13x = 39, x = 3. Then 9 + 4y = 25, y = 4. Check: 15 − 8 = 7.
        (c) Multiply the first equation by 5 and the second by −3 (giving 15x and −15x), then add; or multiply the first by 5 and the second by 3 and subtract.
      explanation: |
        Three points, one per part.

        (a) 1 pt: identifies that no pair of coefficients is equal or opposite.

        (b) 1 pt: correct multiplication and solution (3, 4) with a check.

        (c) 1 pt: a correct pair of multipliers that makes the x coefficients opposite or equal.

    - slug: alg1-u02-w08-q25
      type: long_answer
      topic_code: "2.13"
      source: "IM Algebra 1, Unit 2, Lesson 13"
      points: 6
      prompt: |
        A print shop charges a setup fee plus a price per poster. An order of 40 posters costs $130 and an order of 100 posters costs $280.

        (1) Let s be the setup fee and p the price per poster. Write a system of two equations.
        (2) Solve the system by elimination and state the setup fee and the price per poster.
        (3) Write the shop's cost equation in slope-intercept form, C = pn + s, and use it to find the cost of 75 posters.
        (4) A rival shop charges no setup fee and $3.50 per poster. Write its equation, find the number of posters for which the two shops charge the same, and explain which shop is cheaper for small orders and which for large orders, using the slopes and intercepts.
      answer: |
        (1) s + 40p = 130 and s + 100p = 280.
        (2) Subtract the first from the second: 60p = 150, so p = 2.5. Then s + 100 = 130, s = 30. Setup fee $30, price $2.50 per poster.
        (3) C = 2.5n + 30. For 75 posters: 187.5 + 30 = $217.50.
        (4) Rival: C = 3.5n. Equal when 2.5n + 30 = 3.5n, so n = 30 posters (cost $105 at both). For fewer than 30 posters the rival is cheaper because it has no setup fee (intercept 0 versus 30); for more than 30 the first shop is cheaper because its slope 2.5 is smaller than 3.5, so its cost grows more slowly.
      explanation: |
        Six points.

        (1) 1 pt: both equations.

        (2) 2 pts: 1 for eliminating s correctly (60p = 150), 1 for p = 2.5 and s = 30.

        (3) 1 pt: equation and $217.50.

        (4) 2 pts: 1 for n = 30; 1 for the comparison using intercepts for small orders and slopes for large orders.

        Common errors: treating 130 and 280 as the per-poster prices; solving for p but not s; concluding that the shop with the lower intercept is always cheaper.
