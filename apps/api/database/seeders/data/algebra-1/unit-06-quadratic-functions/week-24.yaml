        (1) Classify each sequence as linear, exponential or quadratic, showing the differences or ratios that justify each answer.
        (2) Write an expression in n for each sequence and check each against step 4.
        (3) Describe a tile pattern that sequence B could count.
        (4) Which sequence has the largest value at step 20? Compute all three and explain why that one wins.
      answer: |
        (1) A: differences 4, 4, 4, 4: linear. B: differences 6, 10, 14, 18, second differences 4: quadratic. C: ratios 3, 3, 3, 3: exponential.
        (2) A: 4n + 3 (step 4: 19). B: second difference 4 means 2n²; 2n² gives exactly 2, 8, 18, 32, 50, so B = 2n² (step 4: 32). C: 4 · 3ⁿ⁻¹ (step 4: 4 · 27 = 108).
        (3) Two n-by-n squares of tiles side by side at each step (or an n-by-2n rectangle).
        (4) A(20) = 83; B(20) = 800; C(20) = 4 · 3¹⁹ = 4,649,045,868. C is largest by far: its tripling adds amounts that grow exponentially, while B's increases grow linearly and A's are constant.
