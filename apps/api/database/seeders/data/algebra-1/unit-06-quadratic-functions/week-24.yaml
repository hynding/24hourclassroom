week: 24
unit: 6
title: "A Different Kind of Change: Quadratic Patterns"
topics: ["6.1", "6.2", "6.3", "6.4"]
guide: guides/week-24.md
guide_description: |
  Recognising change that is neither constant nor a constant multiple, using first and second differences to
  tell linear, exponential and quadratic tables apart, writing expressions with n² for growing geometric
  patterns and checking them, and comparing quadratic with exponential growth to see why the exponential
  function eventually wins.
flashcards_description: |
  28 cards on first and second differences, the tests for linear, exponential and quadratic tables, building
  expressions such as n² + 2n from patterns and from tables, the half-the-second-difference rule, parabola
  vocabulary, and comparing n² with 2ⁿ and other quadratic-exponential pairs.

flashcards:
  - front: Tiles in an n-by-n square patio → counts and differences
    back: |
      1, 4, 9, 16, 25 for n = 1 to 5. The increases are 3, 5, 7, 9: not constant, but each 2 more than the last.
    topic_code: "6.1"
  - front: Why n² is neither linear nor exponential
    back: |
      Its first differences 3, 5, 7, 9 are not constant (so not linear) and its ratios 4, 2.25, 1.78 are not constant (so not exponential).
    topic_code: "6.1"
  - front: Distance fallen 5t² metres → change over seconds 1 to 4
    back: |
      5, 20, 45, 80 metres; increases 15, 25, 35, each 10 more than the last.
    topic_code: "6.1"
  - front: Table 2, 5, 10, 17, 26 at x = 0 to 4 → kind of change
    back: |
      First differences 3, 5, 7, 9; second differences 2, 2, 2: quadratic (it is x² + 1).
    topic_code: "6.1"
  - front: Quadratic expression → definition
    back: |
      An expression whose highest power of the variable is 2, such as n² + 3n or 2x² − 5.
    topic_code: "6.1"
  - front: Signature of quadratic change in words
    back: |
      The amount added each step itself grows (or shrinks) by the same amount every step.
    topic_code: "6.1"
  - front: First differences → definition
    back: |
      The changes between consecutive outputs in a table with equally spaced inputs.
    topic_code: "6.2"
  - front: Second differences → definition
    back: |
      The changes between consecutive first differences. They are constant and non-zero for a quadratic function.
    topic_code: "6.2"
  - front: Test for a linear table
    back: |
      First differences constant. Example: 4, 7, 10, 13 with differences 3, 3, 3.
    topic_code: "6.2"
  - front: Test for an exponential table
    back: |
      Ratios of consecutive outputs constant. Example: 4, 8, 16, 32 with ratios 2, 2, 2.
    topic_code: "6.2"
  - front: Test for a quadratic table
    back: |
      Second differences constant and non-zero. Example: 4, 7, 12, 19 with first differences 3, 5, 7 and second differences 2, 2.
    topic_code: "6.2"
  - front: Classify 3, 6, 11, 18, 27
    back: |
      Differences 3, 5, 7, 9; second differences 2: quadratic.
    topic_code: "6.2"
  - front: Classify 10, 16, 24, 34, 46
    back: |
      Differences 6, 8, 10, 12; second differences 2: quadratic.
    topic_code: "6.2"
  - front: Graph of a quadratic function → name and shape
    back: |
      A parabola: a curve that bends one way throughout. For f(x) = x² it is a U symmetric about the y-axis.
    topic_code: "6.2"
  - front: "Pattern: n-by-n block with n extra squares on top → expression"
    back: |
      n² + n. Check: 2, 6, 12 at steps 1, 2, 3.
    topic_code: "6.3"
  - front: Coefficient of n² from a table
    back: |
      Half the constant second difference. Second differences of 2 mean 1 · n²; of 4 mean 2n²; of 6 mean 3n².
    topic_code: "6.3"
  - front: Finding the rest of the expression after n²
    back: |
      Subtract the n² part from each output; what remains follows a linear rule. For 3, 8, 15, 24: subtract 1, 4, 9, 16 to get 2, 4, 6, 8 = 2n, so n² + 2n.
    topic_code: "6.3"
  - front: Dots in an n-by-(n + 1) rectangle → expression and step 5
    back: |
      n(n + 1) = n² + n; step 5 has 30 dots.
    topic_code: "6.3"
  - front: Hollow square frame of side n → tiles and kind of growth
    back: |
      4n − 4 tiles: linear, because only the one-tile border grows.
    topic_code: "6.3"
  - front: Solid square with a one-tile border → expression
    back: |
      (n + 2)², since the border adds 2 to the side length.
    topic_code: "6.3"
  - front: Checking an expression against a pattern
    back: |
      Substitute each step number and compare with the count in the figure. One mismatch means the expression is wrong.
    topic_code: "6.3"
  - front: Steps with 5, 12, 21 tiles → expression and step 10
    back: |
      Differences 7, 9; second difference 2, so n² plus 4n: n² + 4n. Step 10: 100 + 40 = 140.
    topic_code: "6.3"
  - front: n² versus 2ⁿ → where they are equal and who wins
    back: |
      Equal at n = 2 and n = 4. n² is ahead for n = 3; 2ⁿ is ahead from n = 5 on and the gap grows without bound.
    topic_code: "6.4"
  - front: Why an exponential function eventually beats any quadratic
    back: |
      Each step adds 2n + 1 to n², a linearly growing amount, but multiplies 2ⁿ by 2, so the exponential increases grow exponentially.
    topic_code: "6.4"
  - front: 50n² versus 1.5ⁿ → comparison
    back: |
      At n = 10: 5,000 versus about 58. At n = 30: 45,000 versus about 191,751. The exponential function overtakes between n = 25 and n = 26.
    topic_code: "6.4"
  - front: Average rates of change of n² and 2ⁿ from 5 to 10
    back: |
      n²: (100 − 25)/5 = 15. 2ⁿ: (1,024 − 32)/5 = 198.4. The exponential rate multiplies; the quadratic rate only adds.
    topic_code: "6.4"
  - front: 3n² versus 3ⁿ at n = 2, 3, 4, 5
    back: |
      12 vs 9; 27 vs 27; 48 vs 81; 75 vs 243. Equal at n = 3, exponential ahead from n = 4.
    topic_code: "6.4"
  - front: A mistake to avoid → judging who wins from small inputs
    back: |
      A quadratic function can be far ahead for small n (50n² at n = 10), but an exponential function with factor above 1 always overtakes it eventually.
    topic_code: "6.4"

quiz:
  description: |
    25 questions · about 45 minutes · recognising quadratic change, first and second differences, building
    expressions from geometric patterns, and comparing quadratic with exponential growth (lessons 6.1 to
    6.4), with review of exponential tables, factors, negative exponents and rates of change from units 4
    and 5. Multiple choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank
    items are matched automatically; the short answers and the long answer are graded by your teacher
    against the scoring notes.
  questions:
    # ---- Stimulus set: a tile pattern (6.1–6.3)
    - slug: alg1-u06-w24-q01
      type: multiple_choice
      topic_code: "6.1"
      source: "IM Algebra 1, Unit 6, Lesson 1"
      points: 1
      stimulus: |
        A tile pattern grows step by step. Steps 1, 2, 3 and 4 use 3, 8, 15 and 24 tiles. In each step the tiles form an n-by-n square with two extra columns of n tiles attached.
      prompt: |
        How does the number of tiles change from step to step?
      options:
        - "The increases are 5, 7, 9: each increase is 1.4 times the last."
        - "The number of tiles is multiplied by the same factor each step."
        - "The number of tiles increases by the same amount, 5, each step."
        - "The increases are 5, 7, 9: each increase is 2 more than the last."
      option_explanations:
        - |
          The increases grow by adding 2, not by multiplying; 7/5 and 9/7 are different ratios.
        - |
          The ratios 8/3 ≈ 2.7, 15/8 ≈ 1.9 and 24/15 = 1.6 are not constant.
        - |
          The increase is 5 only at the first step; after that it is 7, then 9.
        - |
          Correct. 8 − 3 = 5, 15 − 8 = 7, 24 − 15 = 9: the increases grow by a constant 2.
      answer: 3

    - slug: alg1-u06-w24-q02
      type: multiple_choice
      topic_code: "6.2"
      source: "IM Algebra 1, Unit 6, Lesson 2"
      points: 1
      stimulus: |
        A tile pattern grows step by step. Steps 1, 2, 3 and 4 use 3, 8, 15 and 24 tiles. In each step the tiles form an n-by-n square with two extra columns of n tiles attached.
      prompt: |
        What kind of function gives the number of tiles at step n, and what is the evidence?
      options:
        - "Quadratic, because the ratios are constant."
        - "Exponential, because the counts grow quickly."
        - "Quadratic, because the second differences are a constant 2."
        - "Linear, because the first differences are odd numbers."
      option_explanations:
        - |
          Constant ratios would mean exponential change; it is the second differences that are constant here.
        - |
          Growing quickly is not the test; exponential change needs constant ratios, which these counts lack.
        - |
          Correct. First differences 5, 7, 9 give second differences 2, 2, the test for a quadratic pattern.
        - |
          Linear change needs constant first differences, and 5, 7, 9 are not constant.
      answer: 2

    - slug: alg1-u06-w24-q03
      type: multiple_choice
      topic_code: "6.3"
      source: "IM Algebra 1, Unit 6, Lesson 3"
      points: 1
      stimulus: |
        A tile pattern grows step by step. Steps 1, 2, 3 and 4 use 3, 8, 15 and 24 tiles. In each step the tiles form an n-by-n square with two extra columns of n tiles attached.
      prompt: |
        Which expression gives the number of tiles at step n?
      options:
        - "n² + 2"
        - "n² + 2n"
        - "2n² + n"
        - "3n"
      option_explanations:
        - |
          Two extra tiles, not two extra columns; this gives 3, 6, 11, 18, matching only step 1.
        - |
          Correct. The square has n² tiles and the two columns have 2n; check step 3: 9 + 6 = 15.
        - |
          Two squares would give 2n²; the pattern has one square. This gives 3 at step 1 but 10 at step 2.
        - |
          3n matches step 1 only; it is linear and the counts are not.
      answer: 1

    - slug: alg1-u06-w24-q04
      type: multiple_choice
      topic_code: "6.3"
      source: "IM Algebra 1, Unit 6, Lesson 3"
      points: 1
      stimulus: |
        A tile pattern grows step by step. Steps 1, 2, 3 and 4 use 3, 8, 15 and 24 tiles. In each step the tiles form an n-by-n square with two extra columns of n tiles attached.
      prompt: |
        How many tiles does step 10 use?
      options:
        - "120"
        - "60"
        - "30"
        - "102"
      option_explanations:
        - |
          Correct. Substituting n = 10 into n² + 2n gives 10² + 2(10) = 100 + 20 = 120 tiles.
        - |
          60 continues adding 6 per step from step 4, treating the pattern as linear.
        - |
          30 is 3 × 10, continuing step 1's count linearly.
        - |
          102 is n² + 2, the wrong expression for the two extra columns.
      answer: 0

    # ---- Multiple choice (6.2–6.4)
    - slug: alg1-u06-w24-q05
      type: multiple_choice
      topic_code: "6.2"
      source: "IM Algebra 1, Unit 6, Lesson 2"
      points: 1
      prompt: |
        Which table of outputs, for inputs 0, 1, 2, 3, 4, is quadratic?
      options:
        - "5, 8, 11, 14, 17"
        - "5, 8, 13, 20, 29"
        - "5, 10, 20, 40, 80"
        - "5, 8, 12, 15, 19"
      option_explanations:
        - |
          First differences are a constant 3: linear.
        - |
          Correct. First differences 3, 5, 7, 9 and second differences 2, 2, 2.
        - |
          Each output is double the previous: exponential.
        - |
          First differences 3, 4, 3, 4 and second differences 1, −1, 1: no constant pattern.
      answer: 1

    - slug: alg1-u06-w24-q06
      type: multiple_choice
      topic_code: "6.2"
      source: "IM Algebra 1, Unit 6, Lesson 2"
      points: 1
      prompt: |
        A table has equally spaced inputs. Which test identifies a quadratic function?
      options:
        - "The second differences are constant and not zero."
        - "The outputs are all perfect squares."
        - "The first differences are constant."
        - "The ratios of consecutive outputs are constant."
      option_explanations:
        - |
          Correct. Constant non-zero second differences are the signature of a quadratic pattern.
        - |
          n² + 1 gives 2, 5, 10, 17, none of which are perfect squares, yet it is quadratic.
        - |
          Constant first differences identify a linear function.
        - |
          Constant ratios identify an exponential function.
      answer: 0

    - slug: alg1-u06-w24-q07
      type: multiple_choice
      topic_code: "6.3"
      source: "IM Algebra 1, Unit 6, Lesson 3"
      points: 1
      prompt: |
        At step n, a pattern of dots forms a rectangle n dots wide and n + 1 dots tall. Which expression gives the number of dots, and how many are there at step 6?
      options:
        - "2n + 1; 13"
        - "(n + 1)²; 49"
        - "n² + 1; 37"
        - "n(n + 1); 42"
      option_explanations:
        - |
          2n + 1 is the perimeter-like count, not the area; the rectangle is filled with dots.
        - |
          (n + 1)² describes an (n + 1)-by-(n + 1) square, one column too many.
        - |
          n² + 1 adds one dot, but the rectangle has a whole extra row of n dots.
        - |
          Correct. Width times height is n(n + 1) = n² + n; at step 6 that is 6 × 7 = 42.
      answer: 3

    - slug: alg1-u06-w24-q08
      type: multiple_choice
      topic_code: "6.3"
      source: "IM Algebra 1, Unit 6, Lesson 3"
      points: 1
      prompt: |
        A pattern at step n is a hollow square frame of side n, one tile thick. Why is the number of tiles NOT quadratic?
      options:
        - "Because frames are not squares."
        - "It is quadratic, since the figure is a square."
        - "Only the border grows, giving 4n − 4 tiles, which is linear."
        - "Because the count is n², which is linear."
      option_explanations:
        - |
          The shape's name is irrelevant; what matters is how the count grows, and a hollow frame adds a constant 4 tiles per step.
        - |
          A solid square would be quadratic, but the hollow frame's interior is empty, so the count grows linearly.
        - |
          Correct. Four sides of n tiles with the four corners counted twice: 4n − 4, a constant increase of 4 per step.
        - |
          n² is the count for a solid square, and it is quadratic, not linear; the frame has 4n − 4 tiles.
      answer: 2

    - slug: alg1-u06-w24-q09
      type: multiple_choice
      topic_code: "6.4"
      source: "IM Algebra 1, Unit 6, Lesson 4"
      points: 1
      prompt: |
        For which whole numbers n is n² equal to 2ⁿ?
      options:
        - "n = 2 and n = 4"
        - "n = 1 and n = 2"
        - "n = 4 and n = 8"
        - "n = 2 only"
      option_explanations:
        - |
          Correct. 2² = 4 = 2² and 4² = 16 = 2⁴; between them n² is larger, and from n = 5 on 2ⁿ is larger.
        - |
          At n = 1, 1² = 1 but 2¹ = 2, so the two expressions are not equal there; n = 2 works, but n = 1 does not.
        - |
          At n = 8, 8² = 64 but 2⁸ = 256; by then the exponential function is already four times the quadratic one.
        - |
          n = 2 works, but so does n = 4: 16 = 16.
      answer: 0

    - slug: alg1-u06-w24-q10
      type: multiple_choice
      topic_code: "6.4"
      source: "IM Algebra 1, Unit 6, Lesson 4"
      points: 1
      prompt: |
        Why does 2ⁿ eventually exceed 100n², even though 100n² is far larger for small n?
      options:
        - "Because quadratic functions eventually decrease."
        - "Because 2 is larger than 100 in the long run."
        - "Each step multiplies 2ⁿ by 2, while each step adds only a linearly growing amount to 100n²."
        - "It never does; 100n² is always larger."
      option_explanations:
        - |
          100n² keeps increasing for positive n; it simply increases more slowly than 2ⁿ in the end.
        - |
          2 is never larger than 100; the point is how the functions change, not the sizes of the constants.
        - |
          Correct. The exponential increases grow exponentially; the quadratic increases, 100(2n + 1), grow only linearly.
        - |
          At n = 20, 100n² = 40,000 but 2²⁰ = 1,048,576; the exponential function is already far ahead.
      answer: 2

    - slug: alg1-u06-w24-q11
      type: multiple_choice
      topic_code: "5.2"
      source: "IM Algebra 1, Unit 5, Lesson 2"
      points: 1
      prompt: |
        Which table of outputs, for inputs 0, 1, 2, 3, shows exponential growth?
      options:
        - "6, 9, 14, 21"
        - "6, 9, 15, 24"
        - "6, 9, 12, 15"
        - "6, 9, 13.5, 20.25"
      option_explanations:
        - |
          The differences 3, 5, 7 grow by 2 each step (second differences 2, 2): quadratic, not exponential.
        - |
          The ratios 1.5, 1.67, 1.6 are not constant, so this is not exponential; its differences 3, 6, 9 have constant second differences of 3, so it is quadratic.
        - |
          The differences 3, 3, 3 are constant, so this table is linear, not exponential.
        - |
          Correct. 9/6 = 13.5/9 = 20.25/13.5 = 1.5, a constant ratio, which is the test for exponential growth.
      answer: 3

    - slug: alg1-u06-w24-q12
      type: multiple_choice
      topic_code: "4.7"
      source: "IM Algebra 1, Unit 4, Lesson 7"
      points: 1
      prompt: |
        What is the average rate of change of f(n) = n² from n = 5 to n = 10?
      options:
        - "75"
        - "15"
        - "5"
        - "25"
      option_explanations:
        - |
          75 is the change in output; it must be divided by the change in input, 5.
        - |
          Correct. (100 − 25)/(10 − 5) = 75/5 = 15.
        - |
          5 is the change in input, 10 − 5; the rate divides the change in output by this, giving 15.
        - |
          25 is f(5), the output at the start of the interval, not a rate of change over it.
      answer: 1

    - slug: alg1-u06-w24-q13
      type: multiple_choice
      topic_code: "5.14"
      source: "IM Algebra 1, Unit 5, Lesson 14"
      points: 1
      prompt: |
        A quantity of 480 is increased by 15%, and the result is then decreased by 15%. What is the final value?
      options:
        - "490.8"
        - "480"
        - "469.2"
        - "408"
      option_explanations:
        - |
          490.8 would be a net 2.25% increase; the combined factor 0.9775 is a decrease.
        - |
          The decrease is taken from a larger amount than the increase was added to, so they do not cancel.
        - |
          Correct. 480 · 1.15 · 0.85 = 480 · 0.9775 = 469.2.
        - |
          408 is a single 15% decrease with no increase first.
      answer: 2

    # ---- Select-all (6.2, 5.20)
    - slug: alg1-u06-w24-q14
      type: multi_select
      topic_code: "6.2"
      source: "IM Algebra 1, Unit 6, Lesson 2"
      points: 2
      partial_credit: true
      prompt: |
        Which of these tables, with inputs 1, 2, 3, 4, 5, are quadratic? Select all that apply.
      options:
        - "3, 5, 7, 9, 11"
        - "0, 3, 8, 15, 24"
        - "4, 10, 18, 28, 40"
        - "2, 4, 8, 16, 32"
        - "1, 4, 9, 16, 25"
      option_explanations:
        - |
          The differences are a constant 2, so this table is linear, not quadratic.
        - |
          Correct. Differences 3, 5, 7, 9 and second differences 2 (this is n² − 1).
        - |
          Correct. Differences 6, 8, 10, 12 and second differences 2 (this is n² + 3n).
        - |
          Each is double the previous: exponential.
        - |
          Correct. These are n²: differences 3, 5, 7, 9 and second differences 2.
      answer: [1, 2, 4]

    - slug: alg1-u06-w24-q15
      type: multi_select
      topic_code: "5.20"
      source: "IM Algebra 1, Unit 5, Lesson 20"
      points: 2
      partial_credit: true
      prompt: |
        g(n) = 2ⁿ. Which statements are true? Select all that apply.
      options:
        - "g(10)/g(7) = g(4)/g(1)."
        - "g(n + 1) − g(n) is the same for every n."
        - "g(n + 1) − g(n) = g(n) for every n."
        - "g(n + 1) = 2 · g(n) for every n."
        - "g(n + 4) = 16 · g(n) for every n."
      option_explanations:
        - |
          Correct. Both ratios span three steps, so both equal 8.
        - |
          The increase doubles each step; only a linear function has constant increases.
        - |
          Correct. 2ⁿ⁺¹ − 2ⁿ = 2ⁿ: the increase equals the current value.
        - |
          Correct. 2ⁿ⁺¹ = 2 · 2ⁿ, so moving one step to the right doubles the output every time.
        - |
          Correct. Four steps multiply by 2⁴ = 16.
      answer: [0, 2, 3, 4]

    # ---- True/false (6.3, 5.4)
    - slug: alg1-u06-w24-q16
      type: true_false
      topic_code: "6.3"
      source: "IM Algebra 1, Unit 6, Lesson 3"
      points: 1
      prompt: |
        True or false: if a quadratic table has constant second differences of 6, the expression contains 6n².
      answer: false
      explanation: |
        False. The coefficient of n² is half the second difference, so second differences of 6 mean 3n². Check: 3n² gives 3, 12, 27, 48 with first differences 9, 15, 21 and second differences 6.

    - slug: alg1-u06-w24-q17
      type: true_false
      topic_code: "5.4"
      source: "IM Algebra 1, Unit 5, Lesson 4"
      points: 1
      prompt: |
        True or false: a quantity that is multiplied by 0.75 each step is losing 25% of its value each step.
      answer: true
      explanation: |
        True. Keeping 75% means losing the other 25%; the factor is 1 − 0.25 = 0.75.

    # ---- Fill in the blank (6.2, 5.7)
    - slug: alg1-u06-w24-q18
      type: fill_blank
      topic_code: "6.2"
      source: "IM Algebra 1, Unit 6, Lesson 2"
      points: 1
      prompt: |
        For a quadratic function with equally spaced inputs, the ____ differences are constant.
      answer: ["second", "2nd"]
      explanation: |
        The first differences change by the same amount each step, so the differences of the differences are constant. For n² they are all 2.

    - slug: alg1-u06-w24-q19
      type: fill_blank
      topic_code: "5.7"
      source: "IM Algebra 1, Unit 5, Lesson 7"
      points: 1
      prompt: |
        For a non-zero number b, the expression b⁻ⁿ is equal to 1 divided by ____.
      answer: ["bⁿ", "b^n", "b to the n", "b to the power n", "b to the nth power"]
      explanation: |
        A negative exponent inverts the power: 2⁻³ = 1/2³ = 1/8.

    # ---- Numeric (6.3, 6.4, 5.3)
    - slug: alg1-u06-w24-q20
      type: numeric
      topic_code: "6.3"
      source: "IM Algebra 1, Unit 6, Lesson 3"
      points: 1
      prompt: |
        A pattern has 5, 12 and 21 tiles at steps 1, 2 and 3, following the rule n² + 4n. How many tiles are in step 10?
      answer: { value: 140, tolerance: 0 }
      explanation: |
        10² + 4(10) = 100 + 40 = 140.

    - slug: alg1-u06-w24-q21
      type: numeric
      topic_code: "6.4"
      source: "IM Algebra 1, Unit 6, Lesson 4"
      points: 1
      prompt: |
        By how much does 2ⁿ exceed n² when n = 7?
      answer: { value: 79, tolerance: 0 }
      explanation: |
        2⁷ = 128 and 7² = 49; the difference is 79.

    - slug: alg1-u06-w24-q22
      type: numeric
      topic_code: "5.3"
      source: "IM Algebra 1, Unit 5, Lesson 3"
      points: 1
      prompt: |
        If h(x) = 4 · 3ˣ, what is h(4)?
      answer: { value: 324, tolerance: 0 }
      explanation: |
        3⁴ = 81 and 4 · 81 = 324.

    # ---- Short answer (6.3, 6.4)
    - slug: alg1-u06-w24-q23
      type: short_answer
      topic_code: "6.3"
      source: "IM Algebra 1, Unit 6, Lesson 3"
      points: 3
      prompt: |
        A pattern of squares has 6, 11, 18, 27 squares at steps 1, 2, 3, 4.

        (a) Find the first and second differences and state what they tell you.
        (b) Find an expression for the number of squares at step n, showing how you found the part after n².
        (c) Describe a way the figures could be arranged to match your expression.
      answer: |
        (a) First differences 5, 7, 9; second differences 2, 2. The pattern is quadratic with n² coefficient 1.
        (b) Subtract n² from each count: 6 − 1 = 5, 11 − 4 = 7, 18 − 9 = 9, 27 − 16 = 11, which is 2n + 3. So the expression is n² + 2n + 3. Check step 4: 16 + 8 + 3 = 27.
        (c) An n-by-n square, two columns of n squares, and three extra squares (for instance in a row on top).
      explanation: |
        Three points, one per part.

