    # ---- Short answer (6.11, 6.13)
    - slug: alg1-u06-w26-q23
      type: short_answer
      topic_code: "6.11"
      source: "IM Algebra 1, Unit 6, Lesson 11"
      points: 3
      prompt: |
        Consider y = (x + 2)(x − 6).

        (a) State the x-intercepts and explain how the factored form gives them.
        (b) Find the axis of symmetry and the vertex.
        (c) Find the y-intercept and describe the graph in words, including one other point found by symmetry.
      answer: |
        (a) −2 and 6: a product is 0 when a factor is 0, and x + 2 = 0 at x = −2, x − 6 = 0 at x = 6.
        (b) Axis x = (−2 + 6)/2 = 2; y = (4)(−4) = −16. Vertex (2, −16).
        (c) y-intercept (0, −12), since (2)(−6) = −12. The parabola opens upward from a minimum at (2, −16), crossing the x-axis at −2 and 6 and the y-axis at −12; by symmetry (4, −12) is also on the graph, since 4 is as far from the axis as 0.
      explanation: |
        Three points, one per part.

        (a) 1 pt: −2 and 6 with the zero-factor reasoning.

        (b) 1 pt: x = 2 and (2, −16).

        (c) 1 pt: (0, −12), an accurate description, and the mirror point (4, −12).

    - slug: alg1-u06-w26-q24
      type: short_answer
      topic_code: "6.13"
      source: "IM Algebra 1, Unit 6, Lesson 13"
      points: 3
      prompt: |
        Compare the graphs of y = x², y = x² − 4x and y = −x² − 4x.

        (a) Find the vertex of y = x² − 4x and describe how the −4x term moved the graph of y = x².
        (b) Find the x-intercepts and vertex of y = −x² − 4x and say which way it opens.
        (c) Which of the three graphs have the same y-intercept, and why?
      answer: |
        (a) x² − 4x = x(x − 4): zeros 0 and 4, vertex (2, −4). The −4x term slid the vertex from (0, 0) right to x = 2 and down to −4, keeping the y-intercept at 0 and the upward opening.
        (b) −x² − 4x = −x(x + 4): intercepts 0 and −4; axis x = −2; y = −4 + 8 = 4, vertex (−2, 4). Opens downward because the coefficient of x² is −1.
        (c) All three: each has constant term 0, so each passes through the origin.
      explanation: |
        Three points, one per part.

        (a) 1 pt: vertex (2, −4) and the shift described.

        (b) 1 pt: intercepts 0, −4, vertex (−2, 4), opens downward.

        (c) 1 pt: all three, because c = 0 in each.

    # ---- Long answer (6.10)
    - slug: alg1-u06-w26-q25
      type: long_answer
      topic_code: "6.10"
      source: "IM Algebra 1, Unit 6, Lesson 10"
      points: 6
      prompt: |
        A ball is thrown upward from a balcony. Its height in feet after t seconds is h(t) = −16t² + 32t + 48.

        (1) Show that h(t) = −16(t − 3)(t + 1) by expanding the factored form.
        (2) State the zeros of h and explain what each means, including which one describes the ball.
        (3) Find the vertex and interpret it.
        (4) State the y-intercept and its meaning, give a sensible domain, and describe the graph over that domain.
      answer: |
        (1) (t − 3)(t + 1) = t² + t − 3t − 3 = t² − 2t − 3; multiplying by −16 gives −16t² + 32t + 48.
        (2) Zeros t = 3 and t = −1. t = 3 is when the ball reaches the ground, 3 seconds after the throw. t = −1 is a second before the throw, when the model does not apply; it is a zero of the expression but not a moment in the flight.
        (3) The axis is halfway between the zeros, t = 1; h(1) = −16 + 32 + 48 = 64. Vertex (1, 64): the ball is highest, 64 feet, one second after the throw.
        (4) y-intercept 48: the balcony is 48 feet up. Domain 0 ≤ t ≤ 3 (from the throw to the landing). The graph rises from (0, 48) to the peak (1, 64), then falls, passing (2, 48) by symmetry, to (3, 0).
      explanation: |
        Six points.

        (1) 1 pt: a correct expansion to −16t² + 32t + 48.

        (2) 2 pts: 1 for both zeros, 1 for interpreting 3 as the landing time and rejecting −1.

        (3) 1 pt: vertex (1, 64) with its meaning.

        (4) 2 pts: 1 for the y-intercept and domain with meanings, 1 for the description including the mirror point (2, 48).

        Common errors: zeros 3 and 1 (sign slip on the factor t + 1); vertex at t = 2 (averaging 3 and 1); treating t = −1 as a landing time.
