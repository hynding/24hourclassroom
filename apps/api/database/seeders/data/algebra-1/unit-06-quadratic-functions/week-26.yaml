week: 26
unit: 6
title: "Graphing from Standard and Factored Form"
topics: ["6.10", "6.11", "6.12", "6.13"]
guide: guides/week-26.md
guide_description: |
  What the factored form shows on a graph (the x-intercepts) and what the standard form shows (the
  y-intercept), finding the axis of symmetry halfway between the intercepts and the vertex on it, and how
  each coefficient of ax² + bx + c moves the parabola: a flips and stretches it, c slides it up or down,
  and b shifts the vertex sideways.
flashcards_description: |
  28 cards on reading x-intercepts from factors and the y-intercept from the constant, the axis of
  symmetry and the vertex from factored form, the steps for sketching a parabola, the effects of a, b and c
  on the graph of ax² + bx + c, and the vertex of x² + bx.

flashcards:
  - front: Factored form → what the graph shows directly
    back: |
      The x-intercepts. y = (x − 2)(x + 4) crosses the x-axis at x = 2 and x = −4, the values that make a factor 0.
    topic_code: "6.10"
  - front: Standard form → what the graph shows directly
    back: |
      The y-intercept: for y = ax² + bx + c the graph crosses the y-axis at (0, c), since x = 0 kills the other terms.
    topic_code: "6.10"
  - front: Why the x-intercepts come from the factors
    back: |
      A product is 0 only when one of its factors is 0, so (x − 2)(x + 4) = 0 exactly when x = 2 or x = −4.
    topic_code: "6.10"
  - front: Sign of an intercept from its factor
    back: |
      The factor (x + 4) is 0 at x = −4, and (x − 2) at x = 2: the intercept has the opposite sign to the number in the factor.
    topic_code: "6.10"
  - front: y = x² + 2x − 8 and y = (x − 2)(x + 4) → same graph?
    back: |
      Yes: expanding the factored form gives the standard form. Intercepts 2 and −4 from one, y-intercept −8 from the other.
    topic_code: "6.10"
  - front: Features of y = −(x − 1)(x − 5)
    back: |
      Opens downward (the leading coefficient is −1), x-intercepts 1 and 5, vertex (3, 4), y-intercept −(−1)(−5) = −5.
    topic_code: "6.10"
  - front: Axis of symmetry → definition and location
    back: |
      The vertical line through the vertex; the graph mirrors across it. It passes halfway between the x-intercepts: x = (p + q)/2 for intercepts p and q.
    topic_code: "6.11"
  - front: Vertex from factored form → steps
    back: |
      1. Read the x-intercepts. 2. Average them for the vertex's x-coordinate. 3. Substitute that x to get the y-coordinate.
    topic_code: "6.11"
  - front: Vertex of y = (x + 1)(x − 7)
    back: |
      Intercepts −1 and 7; axis x = 3; y = (3 + 1)(3 − 7) = 4 · (−4) = −16. Vertex (3, −16), a minimum.
    topic_code: "6.11"
  - front: Sketching a parabola from factored form → steps
    back: |
      Plot the x-intercepts, draw the axis halfway between, plot the vertex, plot the y-intercept and its mirror image across the axis, then join with a smooth curve.
    topic_code: "6.11"
  - front: Mirror points on a parabola
    back: |
      Two inputs equally far from the axis of symmetry give the same output. If the axis is x = 3, then f(0) = f(6) and f(1) = f(5).
    topic_code: "6.11"
  - front: Vertex of y = (x − 2)(x + 4)
    back: |
      Axis x = (2 + (−4))/2 = −1; y = (−3)(3) = −9. Vertex (−1, −9).
    topic_code: "6.11"
  - front: Vertex of y = x(x − 8)
    back: |
      Intercepts 0 and 8, axis x = 4, y = 4 · (−4) = −16: vertex (4, −16).
    topic_code: "6.11"
  - front: Effect of a in y = ax²
    back: |
      a > 0 opens upward, a < 0 opens downward; |a| > 1 makes the parabola narrower than x², 0 < |a| < 1 makes it wider.
    topic_code: "6.12"
  - front: Effect of c in y = ax² + bx + c
    back: |
      Slides the whole graph up (c > 0) or down (c < 0) by |c| without changing its shape; c is the y-intercept.
    topic_code: "6.12"
  - front: Features of y = 2x² − 8
    back: |
      Opens upward and narrower than x², vertex (0, −8), y-intercept −8, x-intercepts ±2 (where 2x² = 8).
    topic_code: "6.12"
  - front: y = −x² + 3 compared with y = x²
    back: |
      Flipped to open downward and shifted up 3: vertex (0, 3), a maximum, x-intercepts ±√3.
    topic_code: "6.12"
  - front: Maximum or minimum → deciding from a
    back: |
      a > 0: the vertex is the lowest point (a minimum). a < 0: the vertex is the highest point (a maximum).
    topic_code: "6.12"
  - front: Changing a from 1 to 1/2 → what happens
    back: |
      The graph of y = (1/2)x² is wider: at x = 2 it reaches only 2 instead of 4. Vertex and y-intercept stay at the origin.
    topic_code: "6.12"
  - front: Effect of b in y = x² + bx
    back: |
      Shifts the vertex off the y-axis: the zeros are 0 and −b, so the vertex is at x = −b/2 with y = −b²/4. The y-intercept stays 0.
    topic_code: "6.13"
  - front: Vertex of y = x² + 6x
    back: |
      x² + 6x = x(x + 6): zeros 0 and −6, axis x = −3, y = (−3)(3) = −9. Vertex (−3, −9).
    topic_code: "6.13"
  - front: Vertex of y = x² − 10x
    back: |
      Zeros 0 and 10, axis x = 5, y = 25 − 50 = −25. Vertex (5, −25).
    topic_code: "6.13"
  - front: Positive b versus negative b → which way the vertex moves
    back: |
      For a > 0, a positive b moves the vertex left of the y-axis and a negative b moves it right; x² + 4x and x² − 4x are mirror images across the y-axis.
    topic_code: "6.13"
  - front: Vertex of ax² + bx + c when it factors
    back: |
      Factor, read the zeros, average them, substitute. x² + 2x − 8 = (x − 2)(x + 4): zeros 2, −4; vertex (−1, −9).
    topic_code: "6.13"
  - front: What b does NOT change
    back: |
      The y-intercept (still c) and whether the graph opens up or down (still set by a). It moves the vertex and the intercepts.
    topic_code: "6.13"
  - front: Projectile h(t) = −16t² + 32t + 48 → graph features
    back: |
      Factored: −16(t − 3)(t + 1); zeros 3 and −1; vertex at t = 1, height 64; starts at 48. Only 0 ≤ t ≤ 3 describes the flight.
    topic_code: "6.10"
  - front: A mistake to avoid → reading the intercept of (x + 4) as 4
    back: |
      (x + 4) is 0 when x = −4. Set each factor equal to 0 and solve rather than copying the number.
    topic_code: "6.10"
  - front: A mistake to avoid → thinking c moves the graph sideways
    back: |
      c moves the graph up or down. Sideways movement of the vertex comes from b (and from the vertex form in week 27).
    topic_code: "6.12"

quiz:
  description: |
    25 questions · about 45 minutes · what the standard and factored forms show on a graph, the axis of
    symmetry and vertex, and the effects of a, b and c on a parabola (lessons 6.10 to 6.13), with review of
    equivalent expressions and projectile functions from week 25, features of graphs and average rate of
    change from unit 4, exponential graphs from unit 5, and equations and their graphs from unit 2. Multiple
    choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
    automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: one function in two forms (6.10, 6.11, 4.6)
    - slug: alg1-u06-w26-q01
      type: multiple_choice
      topic_code: "6.10"
      source: "IM Algebra 1, Unit 6, Lesson 10"
      points: 1
      stimulus: |
        The function f is defined by f(x) = (x − 2)(x + 4), which is equivalent to f(x) = x² + 2x − 8.
      prompt: |
        Where does the graph of f cross the x-axis?
      options:
        - "At (−2, 0) and (4, 0)"
        - "At (0, −8) only"
        - "At (2, 0) and (−4, 0)"
        - "At (2, 0) and (4, 0)"
      option_explanations:
        - |
          The signs are reversed: (x + 4) is 0 at x = −4, not 4, and (x − 2) is 0 at x = 2.
        - |
          (0, −8) is where the graph crosses the y-axis, read from the constant in the standard form.
        - |
          Correct. The product is 0 when x − 2 = 0 or x + 4 = 0, that is at x = 2 and x = −4.
        - |
          x = 4 gives (2)(8) = 16, not 0; the factor x + 4 is zero at −4.
      answer: 2

    - slug: alg1-u06-w26-q02
      type: multiple_choice
      topic_code: "6.11"
      source: "IM Algebra 1, Unit 6, Lesson 11"
      points: 1
      stimulus: |
        The function f is defined by f(x) = (x − 2)(x + 4), which is equivalent to f(x) = x² + 2x − 8.
      prompt: |
        What is the vertex of the graph of f?
      options:
        - "(−1, −8)"
        - "(0, −8)"
        - "(1, −5)"
        - "(−1, −9)"
      option_explanations:
        - |
          The x-coordinate is right, but f(−1) = (−1 − 2)(−1 + 4) = −9, not −8.
        - |
          (0, −8) is the y-intercept; the vertex lies on the axis of symmetry x = −1, not on the y-axis.
        - |
          x = 1 is the average of 2 and −4 only if the sign of −4 is dropped; the midpoint of 2 and −4 is −1.
        - |
          Correct. The axis of symmetry is halfway between the x-intercepts 2 and −4, at x = −1, and f(−1) = (−3)(3) = −9.
      answer: 3

    - slug: alg1-u06-w26-q03
      type: multiple_choice
      topic_code: "6.10"
      source: "IM Algebra 1, Unit 6, Lesson 10"
      points: 1
      stimulus: |
        The function f is defined by f(x) = (x − 2)(x + 4), which is equivalent to f(x) = x² + 2x − 8.
      prompt: |
        Which form makes the y-intercept easy to read, and what is it?
      options:
        - "The standard form; the y-intercept is −8."
        - "The factored form; the y-intercept is 2 + (−4) = −2."
        - "The factored form; the y-intercept is −2 · 4 = −8."
        - "The standard form; the y-intercept is 2."
      option_explanations:
        - |
          Correct. At x = 0 the x² and x terms vanish, leaving the constant −8; standard form shows it at a glance.
        - |
          Adding the intercepts gives −2, which is twice the axis of symmetry's x-coordinate, not the y-intercept.
        - |
          The value is right, but it took a computation: f(0) = (−2)(4) = −8. The standard form shows −8 without any arithmetic.
        - |
          2 is the coefficient of x, not the constant; the y-intercept is the constant term, −8.
      answer: 0

    - slug: alg1-u06-w26-q04
      type: multiple_choice
      topic_code: "4.6"
      source: "IM Algebra 1, Unit 4, Lesson 6"
      points: 1
      stimulus: |
        The function f is defined by f(x) = (x − 2)(x + 4), which is equivalent to f(x) = x² + 2x − 8.
      prompt: |
        On which interval is f decreasing, and what is its minimum value?
      options:
        - "Decreasing for −4 < x < 2; minimum value −8"
        - "Decreasing for x < −1; minimum value −9"
        - "Decreasing for x < 0; minimum value −8"
        - "Decreasing for x > −1; minimum value −9"
      option_explanations:
        - |
          Between the intercepts the function is negative, but it is not decreasing throughout: it turns at x = −1. The minimum is −9, not −8.
        - |
          Correct. The parabola opens upward with vertex (−1, −9), so it falls until x = −1 and rises afterwards; the lowest output is −9.
        - |
          The turning point is at x = −1, not at the y-axis; −8 is the y-intercept, not the minimum.
        - |
          To the right of the vertex an upward-opening parabola rises, not falls.
      answer: 1

    # ---- Multiple choice (6.10–6.13)
    - slug: alg1-u06-w26-q05
      type: multiple_choice
      topic_code: "6.10"
      source: "IM Algebra 1, Unit 6, Lesson 10"
      points: 1
      prompt: |
        g(x) = x² − 6x + 5. Which rewriting reveals the x-intercepts, and what are they?
      options:
        - "g(x) = x(x − 6) + 5; intercepts 0 and 6"
        - "g(x) = (x − 1)(x − 5); intercepts 1 and 5"
        - "g(x) = (x + 1)(x + 5); intercepts −1 and −5"
        - "g(x) = (x − 2)(x − 3); intercepts 2 and 3"
      option_explanations:
        - |
          x(x − 6) + 5 is equivalent but is not a product, so the intercepts cannot be read from it; g(0) = 5, not 0.
        - |
          Correct. (−1)(−5) = 5 and −1 + (−5) = −6, so the factors are (x − 1) and (x − 5), zero at 1 and 5.
        - |
          (x + 1)(x + 5) expands to x² + 6x + 5; the middle sign is wrong.
        - |
          (x − 2)(x − 3) = x² − 5x + 6, a different expression.
      answer: 1

    - slug: alg1-u06-w26-q06
      type: multiple_choice
      topic_code: "6.11"
      source: "IM Algebra 1, Unit 6, Lesson 11"
      points: 1
      prompt: |
        p(x) = (x + 1)(x − 7). What are the axis of symmetry and the vertex?
      options:
        - "x = 3; vertex (3, −16)"
        - "x = −3; vertex (−3, −20)"
        - "x = 3; vertex (3, 16)"
        - "x = 4; vertex (4, −15)"
      option_explanations:
        - |
          Correct. The intercepts −1 and 7 average to 3, and p(3) = (4)(−4) = −16.
        - |
          −3 is the midpoint of 1 and −7, the numbers in the factors with the wrong signs.
        - |
          p(3) = (3 + 1)(3 − 7) = 4 · (−4) = −16, negative: the parabola opens upward and its vertex is below the x-axis.
        - |
          4 is the average of 1 and 7; the intercept from (x + 1) is −1, so the midpoint is 3.
      answer: 0

    - slug: alg1-u06-w26-q07
      type: multiple_choice
      topic_code: "6.12"
      source: "IM Algebra 1, Unit 6, Lesson 12"
      points: 1
      prompt: |
        How does the graph of y = −2x² compare with the graph of y = x²?
      options:
        - "It is the same shape, shifted left 2."
        - "It opens downward and is wider."
        - "It opens upward and is shifted down 2."
        - "It opens downward and is narrower."
      option_explanations:
        - |
          Changing a never moves the vertex, which stays at the origin; it changes the direction and width.
        - |
          A coefficient with absolute value greater than 1 makes the parabola narrower, not wider.
        - |
          There is no constant term, so nothing shifts; the negative coefficient flips the graph.
        - |
          Correct. The negative sign flips the parabola, and the 2 doubles every output, so the graph rises (here falls) more steeply: at x = 1 it is at −2 instead of 1.
      answer: 3

    - slug: alg1-u06-w26-q08
      type: multiple_choice
      topic_code: "6.12"
      source: "IM Algebra 1, Unit 6, Lesson 12"
      points: 1
      prompt: |
        How does the graph of y = x² + 3 compare with the graph of y = x²?
      options:
        - "Narrower, with the same vertex."
        - "Same shape, shifted right 3 units."
        - "Same shape, shifted up 3 units; its y-intercept is 3."
        - "Opens downward with vertex (0, 3)."
      option_explanations:
        - |
          The coefficient of x² is still 1, so the width is unchanged; the vertex moves from (0, 0) to (0, 3).
        - |
          Adding a constant changes outputs, not inputs, so the graph moves vertically.
        - |
          Correct. Every output is 3 more, so each point moves straight up 3; the vertex is (0, 3) and the y-intercept is 3.
        - |
          The coefficient of x² is positive, so the graph still opens upward.
      answer: 2

    - slug: alg1-u06-w26-q09
      type: multiple_choice
      topic_code: "6.13"
      source: "IM Algebra 1, Unit 6, Lesson 13"
      points: 1
      prompt: |
        What are the x-intercepts and the vertex of the graph of y = x² + 6x?
      options:
        - "Intercepts 0 and −6; vertex (−3, −9)"
        - "Intercepts 0 and −6; vertex (−3, 9)"
        - "Intercepts 0 and 6; vertex (3, −9)"
        - "Intercept 6 only; vertex (0, 6)"
      option_explanations:
        - |
          Correct. x² + 6x = x(x + 6) is 0 at x = 0 and x = −6; halfway is x = −3, and (−3)² + 6(−3) = 9 − 18 = −9.
        - |
          The y-coordinate is 9 − 18 = −9; the parabola opens upward, so its vertex is below the intercepts.
        - |
          x + 6 is 0 at x = −6, not 6, so the axis is at x = −3.
        - |
          The graph has no constant term, so its y-intercept is 0 and the vertex is pushed off the y-axis by the 6x term.
      answer: 0

    - slug: alg1-u06-w26-q10
      type: multiple_choice
      topic_code: "6.13"
      source: "IM Algebra 1, Unit 6, Lesson 13"
      points: 1
      prompt: |
        How are the graphs of y = x² + 4x and y = x² − 4x related?
      options:
        - "They are identical, because 4x and −4x cancel."
        - "One is the other shifted up 8 units."
        - "One opens upward and the other opens downward."
        - "They are mirror images across the y-axis, with vertices (−2, −4) and (2, −4)."
      option_explanations:
        - |
          The terms belong to different functions; at x = 1 the outputs are 5 and −3.
        - |
          Both have y-intercept 0 and the same minimum value −4; neither is above the other everywhere.
        - |
          Both have leading coefficient 1, so both open upward; b does not change the direction.
        - |
          Correct. Changing the sign of b reflects the graph across the y-axis: x² + 4x has zeros 0, −4 and vertex (−2, −4); x² − 4x has zeros 0, 4 and vertex (2, −4).
      answer: 3

    - slug: alg1-u06-w26-q11
      type: multiple_choice
      topic_code: "6.10"
      source: "IM Algebra 1, Unit 6, Lesson 10"
      points: 1
      prompt: |
        Which description matches the graph of y = −(x − 1)(x − 5)?
      options:
        - "Opens downward, x-intercepts −1 and −5, vertex (−3, 4), y-intercept −5"
        - "Opens downward, x-intercepts 1 and 5, vertex (3, 4), y-intercept −5"
        - "Opens upward, x-intercepts 1 and 5, vertex (3, −4), y-intercept 5"
        - "Opens downward, x-intercepts 1 and 5, vertex (3, 4), y-intercept 5"
      option_explanations:
        - |
          (x − 1) and (x − 5) are zero at 1 and 5, positive values.
        - |
          Correct. The leading negative flips the parabola; the factors vanish at 1 and 5; at x = 3, y = −(2)(−2) = 4; at x = 0, y = −(−1)(−5) = −5.
        - |
          The negative sign in front makes the graph open downward, and y(0) = −(−1)(−5) = −5, not 5.
        - |
          The y-intercept is −(−1)(−5) = −5: the product of two negatives is positive, and the leading negative makes it negative.
      answer: 1

    - slug: alg1-u06-w26-q12
      type: multiple_choice
      topic_code: "6.8"
      source: "IM Algebra 1, Unit 6, Lesson 8"
      points: 1
      prompt: |
        Which expression is equivalent to (x + 4)²?
      options:
        - "x² + 16"
        - "2x + 8"
        - "x² + 8x + 16"
        - "x² + 4x + 16"
      option_explanations:
        - |
          Squaring a sum is not squaring each term; the two middle products 4x + 4x are missing. At x = 1 the values are 25 and 17.
        - |
          2x + 8 is 2(x + 4), a doubling, not a squaring.
        - |
          Correct. (x + 4)(x + 4) = x² + 4x + 4x + 16 = x² + 8x + 16.
        - |
          The middle term is 4x + 4x = 8x, one product from each factor.
      answer: 2

    - slug: alg1-u06-w26-q13
      type: multiple_choice
      topic_code: "5.12"
      source: "IM Algebra 1, Unit 5, Lesson 12"
      points: 1
      prompt: |
        Which statement about the graphs of y = 3 · 2ˣ and y = 3 · 4ˣ is correct?
      options:
        - "Both pass through (0, 3); for x > 0 the graph of 3 · 4ˣ is higher and rises more steeply."
        - "For x > 0 the graph of 3 · 2ˣ is higher because 2 is a smaller base."
        - "Both graphs cross the x-axis, at x = 2 and x = 4."
        - "The graph of 3 · 4ˣ has y-intercept 12 and the other has y-intercept 6."
      option_explanations:
        - |
          Correct. At x = 0 both equal 3 · 1 = 3; for positive x, 4ˣ exceeds 2ˣ, so the second graph is above and steeper.
        - |
          A larger base grows faster, so 3 · 4ˣ is higher for every x > 0 (and lower for x < 0).
        - |
          An exponential function a · bˣ with a > 0 is never 0, so neither graph meets the x-axis.
        - |
          The y-intercept of a · bˣ is a, which is 3 for both; 12 and 6 are the values at x = 1.
      answer: 0

    # ---- Select-all (6.12, 4.6)
    - slug: alg1-u06-w26-q14
      type: multi_select
      topic_code: "6.12"
      source: "IM Algebra 1, Unit 6, Lesson 12"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the graph of y = 2x² − 8 are true? Select all that apply.
      options:
        - "Its x-intercepts are 2 and −2."
        - "Its vertex is (0, 8)."
        - "Its y-intercept is −8."
        - "It opens upward."
        - "It is narrower than the graph of y = x²."
      option_explanations:
        - |
          Correct. 2x² − 8 = 0 when x² = 4, so x = 2 or x = −2.
        - |
          The vertex is on the y-axis (b = 0) at the y-intercept, (0, −8), not (0, 8).
        - |
          Correct. At x = 0 the output is 2 · 0 − 8 = −8, the constant term.
        - |
          Correct. The coefficient of x², 2, is positive, so the parabola opens upward.
        - |
          Correct. Doubling every x² value makes the graph climb twice as fast away from the vertex.
      answer: [0, 2, 3, 4]

    - slug: alg1-u06-w26-q15
      type: multi_select
      topic_code: "4.6"
      source: "IM Algebra 1, Unit 4, Lesson 6"
      points: 2
      partial_credit: true
      prompt: |
        Graph description: a parabola opening downward with x-intercepts at −1 and 5 and highest point (2, 9). Which statements are true? Select all that apply.
      options:
        - "The maximum value of the function is 9."
        - "The function is positive for −1 < x < 5."
        - "The function is increasing for x < 2."
        - "The minimum value of the function is 9."
        - "The y-intercept is positive."
      option_explanations:
        - |
          Correct. The highest point has y-coordinate 9, and no output exceeds it.
        - |
          Correct. Between its x-intercepts a downward-opening parabola is above the axis.
        - |
          Correct. To the left of the highest point the graph climbs toward it.
        - |
          9 is the maximum; a downward-opening parabola has no minimum value, since it falls without bound.
        - |
          Correct. x = 0 lies between the intercepts, where the graph is above the x-axis (the function is −(x + 1)(x − 5), with value 5 at x = 0).
      answer: [0, 1, 2, 4]

    # ---- True/false (6.12, 6.5)
    - slug: alg1-u06-w26-q16
      type: true_false
      topic_code: "6.12"
      source: "IM Algebra 1, Unit 6, Lesson 12"
      points: 1
      prompt: |
        True or false: changing the value of c in y = x² + bx + c moves the graph up or down but does not change its shape.
      answer: true
      explanation: |
        True. Adding c adds the same amount to every output, so every point moves vertically by c and the parabola keeps its width and direction; the y-intercept becomes c.

    - slug: alg1-u06-w26-q17
      type: true_false
      topic_code: "6.5"
      source: "IM Algebra 1, Unit 6, Lesson 5"
      points: 1
      prompt: |
        True or false: when the time a dropped object has been falling doubles, the distance it has fallen also doubles.
      answer: false
      explanation: |
        False. With d = 16t², doubling t multiplies d by 2² = 4: after 1 second 16 feet, after 2 seconds 64 feet.

    # ---- Fill in the blank (6.11, 2.5)
