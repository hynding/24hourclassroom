      prompt: |
        Consider y = −(x + 1)² + 4.

        (a) State the vertex and whether it is a maximum or a minimum, with a reason.
        (b) Find the y-intercept and the x-intercepts.
        (c) Describe the graph in words, naming one pair of mirror points.
      answer: |
        (a) Vertex (−1, 4), a maximum because a = −1 is negative, so the parabola opens downward.
        (b) y-intercept: −(1)² + 4 = 3. x-intercepts: (x + 1)² = 4, so x + 1 = ±2, x = 1 or x = −3.
        (c) A downward-opening parabola with its peak at (−1, 4), crossing the x-axis at −3 and 1 and the y-axis at 3. Since 0 and −2 are each 1 unit from the axis x = −1, (0, 3) and (−2, 3) are mirror points.
      explanation: |
        Three points, one per part.

        (a) 1 pt: (−1, 4), maximum, negative a.

        (b) 1 pt: 3; 1 and −3.

        (c) 1 pt: an accurate description with a correct mirror pair.

