    # ---- Long answer (6.14)
    - slug: alg1-u06-w27-q25
      type: long_answer
      topic_code: "6.14"
      source: "IM Algebra 1, Unit 6, Lesson 14"
      points: 6
      prompt: |
        Graph description: a parabola showing a diver's height above the water, in metres, against time in seconds. It starts at (0, 10), peaks at (0.5, 11.25), and reaches the water at (2, 0).

        (1) Say what each of the three marked points means for the dive.
        (2) Using the vertex, write the height function in vertex form h(t) = a(t − 0.5)² + 11.25, and find a from the point (0, 10).
        (3) Rewrite h(t) in standard form.
        (4) State a sensible domain, find the diver's height at t = 1.5, and explain what the graph's symmetry says about the heights at t = 0 and t = 1.
      answer: |
        (1) (0, 10): the diver leaves a platform 10 m above the water. (0.5, 11.25): the highest point of the dive, 11.25 m, half a second in. (2, 0): the diver enters the water 2 seconds after leaving the platform.
        (2) h(t) = a(t − 0.5)² + 11.25. At t = 0: a(0.25) + 11.25 = 10, so 0.25a = −1.25 and a = −5. h(t) = −5(t − 0.5)² + 11.25.
        (3) −5(t² − t + 0.25) + 11.25 = −5t² + 5t − 1.25 + 11.25 = −5t² + 5t + 10. Check: h(2) = −20 + 10 + 10 = 0.
        (4) Domain 0 ≤ t ≤ 2. h(1.5) = −5(1)² + 11.25 = 6.25 m. t = 0 and t = 1 are each 0.5 s from the axis t = 0.5, so h(1) = h(0) = 10: one second in, the diver is back level with the platform.
      explanation: |
        Six points.

        (1) 1 pt: all three meanings.

        (2) 2 pts: 1 for setting up the equation with the vertex, 1 for a = −5.

        (3) 1 pt: −5t² + 5t + 10.

        (4) 2 pts: 1 for the domain and h(1.5) = 6.25, 1 for the symmetry argument giving h(1) = 10.

        Common errors: a = 5 (sign slip); expanding (t − 0.5)² as t² − 0.25; using the whole parabola as the domain.
