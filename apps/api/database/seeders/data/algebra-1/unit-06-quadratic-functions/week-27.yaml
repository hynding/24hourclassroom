week: 27
unit: 6
title: "Graphs of Situations and the Vertex Form"
topics: ["6.14", "6.15", "6.16", "6.17"]
guide: guides/week-27.md
guide_description: |
  Reading the graph of a quadratic model (the starting value, the peak, the landing, the sensible domain),
  the vertex form a(x − h)² + k and why the vertex is (h, k), sketching a parabola from vertex form with
  its direction, y-intercept and x-intercepts, and how changing h and k slides the graph sideways and up
  or down.
flashcards_description: |
  28 cards on the landmarks of a projectile or revenue graph, the vertex form and reading its vertex with
  the right signs, which form shows which feature, graphing from vertex form, maximum and minimum values,
  x-intercepts from vertex form, the effects of h and k, and writing the equation of a shifted parabola.

flashcards:
  - front: Projectile graph → its three landmarks
    back: |
      The y-intercept is the starting height, the vertex is the peak (its x-coordinate the time of the peak), and the positive x-intercept is the landing time.
    topic_code: "6.14"
  - front: Revenue graph → reading the zeros and the vertex
    back: |
      The zeros are prices that earn nothing (free, or so high nobody buys); the vertex gives the best price and the greatest revenue.
    topic_code: "6.14"
  - front: Domain from the graph of a situation
    back: |
      From the input where the situation starts (usually 0) to the input where it ends, such as the landing time or the price at which sales stop; not the whole parabola.
    topic_code: "6.14"
  - front: Fountain jet h(x) = −0.5(x − 4)² + 8 → what the graph says
    back: |
      Water leaves the nozzle at ground level (h(0) = 0), peaks 8 feet high 4 feet out, and lands 8 feet from the nozzle (h(8) = 0).
    topic_code: "6.14"
  - front: Point (0, 48) on a height-against-time graph → meaning
    back: |
      At time 0 the object is 48 feet up: the launch height. It is the graph's y-intercept.
    topic_code: "6.14"
  - front: Vertex form → definition
    back: |
      a(x − h)² + k with a ≠ 0. The vertex is (h, k); a sets the direction and width exactly as in standard form.
    topic_code: "6.15"
  - front: Vertex of y = (x + 2)² − 5
    back: |
      (−2, −5). Write x + 2 as x − (−2): h = −2. k = −5 is read straight off.
    topic_code: "6.15"
  - front: Vertex of y = 3(x − 1)² + 4
    back: |
      (1, 4). a = 3 means it opens upward and is narrower than x², so 4 is the minimum value.
    topic_code: "6.15"
  - front: Why the vertex of a(x − h)² + k is (h, k)
    back: |
      (x − h)² is 0 at x = h and positive everywhere else, so a(x − h)² is at its extreme (0) there, and the output is k.
    topic_code: "6.15"
  - front: Recognising vertex form among the three forms
    back: |
      A number times the square of a linear factor, plus a constant: 2(x − 3)² + 1 is vertex form; (x − 3)(x + 1) is factored; x² − 2x − 3 is standard.
    topic_code: "6.15"
  - front: Which form shows which feature → summary
    back: |
      Standard ax² + bx + c: y-intercept c. Factored a(x − p)(x − q): x-intercepts p and q. Vertex a(x − h)² + k: vertex (h, k). All three share a.
    topic_code: "6.15"
  - front: Vertex form to standard form → method
    back: |
      Expand the square, multiply by a, add k: (x − 3)² − 4 = x² − 6x + 9 − 4 = x² − 6x + 5.
    topic_code: "6.15"
  - front: Graphing from vertex form → steps
    back: |
      Plot the vertex (h, k); use the sign of a for the direction; compute the y-intercept a · h² + k and its mirror point at x = 2h; join with a smooth curve.
    topic_code: "6.16"
  - front: Maximum or minimum from vertex form
    back: |
      k is the minimum value when a > 0 and the maximum value when a < 0; it occurs at x = h.
    topic_code: "6.16"
  - front: Features of y = −(x − 2)² + 9
    back: |
      Vertex (2, 9), a maximum; opens downward; y-intercept −4 + 9 = 5; x-intercepts where (x − 2)² = 9: x = 5 and x = −1.
    topic_code: "6.16"
  - front: Features of y = 2(x + 1)² − 8
    back: |
      Vertex (−1, −8), a minimum; opens upward, narrower; y-intercept 2 − 8 = −6; x-intercepts where (x + 1)² = 4: x = 1 and x = −3.
    topic_code: "6.16"
  - front: x-intercepts from vertex form → method
    back: |
      Set the expression equal to 0, isolate the square, then take both square roots: (x − 2)² = 9 gives x − 2 = ±3, so x = 5 or −1. No real intercepts if the square would have to be negative.
    topic_code: "6.16"
  - front: Minimum value of y = 3(x − 7)² − 11
    back: |
      −11, at x = 7. The square is never negative, so 3(x − 7)² ≥ 0 and the output is at least −11.
    topic_code: "6.16"
  - front: Effect of h in a(x − h)² + k
    back: |
      Slides the graph horizontally so the vertex sits at x = h: (x − 3)² is x² moved right 3; (x + 3)² is x² moved left 3.
    topic_code: "6.17"
  - front: Effect of k in a(x − h)² + k
    back: |
      Slides the graph vertically by k: up for positive k, down for negative. Shape and axis of symmetry unchanged.
    topic_code: "6.17"
  - front: y = x² moved right 3 and down 4 → equation
    back: |
      y = (x − 3)² − 4. Right means subtract inside the square; down means subtract outside.
    topic_code: "6.17"
  - front: Changing k from 2 to −1 in y = (x − 5)² + k
    back: |
      The whole graph drops 3 units; the vertex moves from (5, 2) to (5, −1), the axis x = 5 stays.
    topic_code: "6.17"
  - front: y = (x − 4)² and y = (x + 4)² → relationship
    back: |
      Mirror images across the y-axis: vertices (4, 0) and (−4, 0), same shape, same y-intercept 16.
    topic_code: "6.17"
  - front: Finding a from the vertex and one more point
    back: |
      Write a(x − h)² + k with the known vertex, substitute the other point, solve for a. Vertex (0.5, 11.25) and point (0, 10): 0.25a + 11.25 = 10, so a = −5.
    topic_code: "6.17"
  - front: Diver model h(t) = −5(t − 0.5)² + 11.25 → facts
    back: |
      Starts at h(0) = 10 m, peaks at 11.25 m after 0.5 s, enters the water when (t − 0.5)² = 2.25, t = 2 s.
    topic_code: "6.14"
  - front: y = (x − 2)² + 1 compared with y = (x − 6)² − 3
    back: |
      Same shape; the second is the first moved right 4 and down 4. Vertices (2, 1) and (6, −3).
    topic_code: "6.17"
  - front: A mistake to avoid → vertex of (x + 2)² − 5 read as (2, −5)
    back: |
      The form is (x − h)², so x + 2 means h = −2. The vertex is (−2, −5).
    topic_code: "6.15"
  - front: A mistake to avoid → judging the direction from k
    back: |
      Only the sign of a decides whether the parabola opens up or down. −(x − 2)² + 9 opens downward although k = 9 is positive.
    topic_code: "6.16"

quiz:
  description: |
    25 questions · about 45 minutes · reading graphs of quadratic models, the vertex form, graphing from
    vertex form, and changing the vertex (lessons 6.14 to 6.17), with review of the factored form and the
    effects of a and b from week 26, revenue and projectile functions from week 25, equivalent expressions,
    and domain and range from unit 4. Multiple choice, select-all, true/false and numeric items are graded
    at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are
    graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a fountain jet (6.15, 6.14, 6.16, 4.10)
    - slug: alg1-u06-w27-q01
      type: multiple_choice
      topic_code: "6.15"
      source: "IM Algebra 1, Unit 6, Lesson 15"
      points: 1
      stimulus: |
        A fountain shoots a jet of water from a nozzle at ground level. Its height in feet, h, at a horizontal distance of x feet from the nozzle is h(x) = −0.5(x − 4)² + 8.
      prompt: |
        What is the vertex of the graph of h?
      options:
        - "(4, 8)"
        - "(−4, 8)"
        - "(8, 4)"
        - "(−0.5, 8)"
      option_explanations:
        - |
          Correct. In a(x − h)² + k the vertex is (h, k); here x − 4 gives h = 4 and k = 8.
        - |
          The form is (x − h)², so x − 4 means h = 4, not −4.
        - |
          The coordinates are swapped: 4 is the horizontal distance and 8 the height.
        - |
          −0.5 is a, which sets the direction and width; it is not a coordinate of the vertex.
      answer: 0

    - slug: alg1-u06-w27-q02
      type: multiple_choice
      topic_code: "6.14"
      source: "IM Algebra 1, Unit 6, Lesson 14"
      points: 1
      stimulus: |
        A fountain shoots a jet of water from a nozzle at ground level. Its height in feet, h, at a horizontal distance of x feet from the nozzle is h(x) = −0.5(x − 4)² + 8.
      prompt: |
        What does the vertex tell you about the jet?
      options:
        - "The water reaches its greatest height, 8 feet, when it is 4 feet from the nozzle."
        - "The water lands 8 feet from the nozzle after reaching 4 feet in height."
        - "The water is 8 feet high at the nozzle and falls from there."
        - "The jet rises for 8 feet and then travels 4 feet horizontally."
      option_explanations:
        - |
          Correct. a = −0.5 is negative, so the vertex (4, 8) is the highest point: height 8 feet at horizontal distance 4 feet.
        - |
          The water does land 8 feet out, but that is an x-intercept, not the vertex; the peak height is 8, not 4.
        - |
          At the nozzle x = 0 and h(0) = −0.5 · 16 + 8 = 0: the jet starts at ground level.
        - |
          The coordinates are a horizontal distance (4) and a height (8), not a sequence of movements.
      answer: 0

    - slug: alg1-u06-w27-q03
      type: multiple_choice
      topic_code: "6.16"
      source: "IM Algebra 1, Unit 6, Lesson 16"
      points: 1
      stimulus: |
        A fountain shoots a jet of water from a nozzle at ground level. Its height in feet, h, at a horizontal distance of x feet from the nozzle is h(x) = −0.5(x − 4)² + 8.
      prompt: |
        How far from the nozzle does the water land?
      options:
        - "8 feet, because h(x) = 0 when (x − 4)² = 16, giving x = 0 or x = 8."
        - "4 feet, because the vertex is at x = 4."
        - "16 feet, because (x − 4)² = 16."
        - "12 feet, because 4 + 8 = 12."
      option_explanations:
        - |
          Correct. Setting −0.5(x − 4)² + 8 = 0 gives (x − 4)² = 16, so x − 4 = ±4; x = 0 is the nozzle and x = 8 is the landing point.
        - |
          x = 4 is where the water is highest, halfway through its flight, not where it lands.
        - |
          16 is (x − 4)², the square of the distance from the axis; taking the square root gives x − 4 = ±4.
        - |
          Adding the vertex coordinates has no meaning; the landing point is the x-intercept to the right of the vertex, 4 + 4 = 8.
      answer: 0

    - slug: alg1-u06-w27-q04
      type: multiple_choice
      topic_code: "4.10"
      source: "IM Algebra 1, Unit 4, Lesson 10"
      points: 1
      stimulus: |
        A fountain shoots a jet of water from a nozzle at ground level. Its height in feet, h, at a horizontal distance of x feet from the nozzle is h(x) = −0.5(x − 4)² + 8.
      prompt: |
        What are a sensible domain and range for h as a model of the jet?
      options:
        - "Domain 0 ≤ x ≤ 8; range 0 ≤ h ≤ 8"
        - "Domain all real numbers; range h ≤ 8"
        - "Domain 0 ≤ x ≤ 4; range 0 ≤ h ≤ 8"
        - "Domain 0 ≤ x ≤ 8; range −8 ≤ h ≤ 8"
      option_explanations:
        - |
          Correct. The water exists between the nozzle (x = 0) and the landing point (x = 8), and its height runs from 0 up to the peak of 8.
        - |
          The parabola continues for all x, but the water does not: beyond x = 8 the formula gives negative heights that describe nothing.
        - |
          Stopping at x = 4 leaves out the falling half of the jet, from the peak to the landing point.
        - |
          Heights below 0 would be underground; the water's height never drops below 0 while it is in the air.
      answer: 0

    # ---- Multiple choice (6.14–6.17, 6.7, 6.11)
    - slug: alg1-u06-w27-q05
      type: multiple_choice
      topic_code: "6.14"
      source: "IM Algebra 1, Unit 6, Lesson 14"
      points: 1
      prompt: |
        Graph description: a parabola showing a ball's height in feet against time in seconds. It passes through (0, 5), peaks at (2, 69), and crosses the time axis at about (4.1, 0). What does the point (0, 5) represent?
      options:
        - "The ball was launched from a height of 5 feet."
        - "The ball reached its peak after 5 seconds."
        - "The ball landed 5 seconds after launch."
        - "The ball travelled 5 feet before it started to fall."
      option_explanations:
        - |
          Correct. At time 0 the height is 5: the launch height, which is the graph's y-intercept.
        - |
          The peak is the vertex, (2, 69): it happens at 2 seconds and is 69 feet high.
        - |
          The landing is the x-intercept, at about 4.1 seconds.
        - |
          The ball rises 64 feet (from 5 to 69) before it starts to fall; 5 is a height at the start, not a distance travelled.
      answer: 0

    - slug: alg1-u06-w27-q06
      type: multiple_choice
      topic_code: "6.7"
      source: "IM Algebra 1, Unit 6, Lesson 7"
      points: 1
      prompt: |
        Graph description: a parabola showing a club's revenue in dollars against ticket price in dollars. It opens downward, crosses the price axis at 0 and 30, and peaks at (15, 2,250). What is the best price to charge, and why?
      options:
        - "$15, because the vertex gives the price with the greatest revenue, $2,250."
        - "$30, because the revenue is highest where the graph meets the axis."
        - "$2,250, because that is the largest number on the graph."
        - "$7.50, because revenue should be halfway between 0 and 15."
      option_explanations:
        - |
          Correct. The vertex of a downward-opening parabola is its highest point: price 15 earns 2,250, more than any other price.
        - |
          At $30 the revenue is 0; nobody buys at that price.
        - |
          2,250 is the revenue at the best price, not a price.
        - |
          The best price sits halfway between the zeros, 0 and 30, which is 15, not halfway between 0 and 15.
      answer: 0

    - slug: alg1-u06-w27-q07
      type: multiple_choice
      topic_code: "6.15"
      source: "IM Algebra 1, Unit 6, Lesson 15"
      points: 1
      prompt: |
        What is the vertex of the graph of y = (x + 2)² − 5?
      options:
        - "(−2, −5)"
        - "(2, −5)"
        - "(−2, 5)"
        - "(2, 5)"
      option_explanations:
        - |
          Correct. x + 2 is x − (−2), so h = −2, and k = −5 is the constant added after the square.
        - |
          The vertex form uses (x − h)²; a plus sign inside means h is negative.
        - |
          The −5 outside the square is k, so the vertex's y-coordinate is −5.
        - |
          Both signs are reversed; check: at x = −2 the square is 0 and y = −5, the lowest value.
      answer: 0

    - slug: alg1-u06-w27-q08
      type: multiple_choice
      topic_code: "6.15"
      source: "IM Algebra 1, Unit 6, Lesson 15"
      points: 1
      prompt: |
        Which expression is written in vertex form?
      options:
        - "3(x − 1)² + 4"
        - "3(x − 1)(x + 4)"
        - "3x² − 6x + 7"
        - "3x(x − 2) + 7"
      option_explanations:
        - |
          Correct. A number times the square of a linear factor, plus a constant: vertex (1, 4).
        - |
          This is factored form, a product of two different linear factors; it shows the x-intercepts 1 and −4.
        - |
          This is standard form, ax² + bx + c; it shows the y-intercept 7. (It is in fact equal to the first option.)
        - |
          This is neither: a product of x and a linear factor plus a constant, which does not display a vertex or intercepts.
      answer: 0

    - slug: alg1-u06-w27-q09
      type: multiple_choice
      topic_code: "6.16"
      source: "IM Algebra 1, Unit 6, Lesson 16"
      points: 1
      prompt: |
        Which description matches the graph of y = −(x − 2)² + 9?
      options:
        - "Opens downward, vertex (2, 9), y-intercept 5, x-intercepts −1 and 5"
        - "Opens upward, vertex (2, 9), y-intercept 9"
        - "Opens downward, vertex (−2, 9), y-intercept 5"
        - "Opens downward, vertex (2, 9), y-intercept 9, x-intercepts 2 and 9"
      option_explanations:
        - |
          Correct. a = −1 flips it; vertex (2, 9); at x = 0, y = −4 + 9 = 5; y = 0 when (x − 2)² = 9, so x = 5 or x = −1.
        - |
          The leading coefficient is −1, so the graph opens downward; k = 9 does not decide the direction.
        - |
          x − 2 gives h = 2, so the vertex is at x = 2.
        - |
          The y-intercept is −(0 − 2)² + 9 = 5, and the vertex's coordinates are not the x-intercepts.
      answer: 0

    - slug: alg1-u06-w27-q10
      type: multiple_choice
      topic_code: "6.16"
      source: "IM Algebra 1, Unit 6, Lesson 16"
      points: 1
      prompt: |
        For y = 2(x + 1)² − 8, which statement is correct?
      options:
        - "The minimum value is −8, at x = −1, and the y-intercept is −6."
        - "The maximum value is −8, at x = −1."
        - "The minimum value is −8, at x = 1, and the y-intercept is −8."
        - "The minimum value is −6, at x = 0."
      option_explanations:
        - |
          Correct. a = 2 > 0, so the vertex (−1, −8) is the lowest point; at x = 0, y = 2 · 1 − 8 = −6.
        - |
          With a positive a the vertex is a minimum, not a maximum; the graph rises on both sides of it.
        - |
          x + 1 means h = −1, and the y-intercept is 2(0 + 1)² − 8 = −6, not −8.
        - |
          −6 is the y-intercept, but it is not the lowest point; the vertex at x = −1 is lower, at −8.
      answer: 0

    - slug: alg1-u06-w27-q11
      type: multiple_choice
      topic_code: "6.17"
      source: "IM Algebra 1, Unit 6, Lesson 17"
      points: 1
      prompt: |
        The graph of y = x² is shifted 3 units to the right and 4 units down. What is the equation of the new graph?
      options:
        - "y = (x − 3)² − 4"
        - "y = (x + 3)² − 4"
        - "y = (x − 3)² + 4"
        - "y = (x − 4)² − 3"
      option_explanations:
        - |
          Correct. Moving right 3 puts the vertex at x = 3, written (x − 3)²; moving down 4 subtracts 4 outside: vertex (3, −4).
        - |
          (x + 3)² has its vertex at x = −3, a shift 3 to the left.
        - |
          Adding 4 outside the square moves the graph up 4, not down.
        - |
          The horizontal and vertical shifts are swapped: this vertex is (4, −3).
      answer: 0

    - slug: alg1-u06-w27-q12
      type: multiple_choice
      topic_code: "6.17"
      source: "IM Algebra 1, Unit 6, Lesson 17"
      points: 1
      prompt: |
        In y = (x − 5)² + k, the value of k is changed from 2 to −1. What happens to the graph?
      options:
        - "It moves down 3 units; the vertex goes from (5, 2) to (5, −1)."
        - "It moves left 3 units; the vertex goes from (5, 2) to (2, 2)."
        - "It flips to open downward."
        - "It becomes narrower."
      option_explanations:
        - |
          Correct. k is the vertex's y-coordinate and the vertical shift; changing it by −3 slides every point down 3.
        - |
          k never changes the horizontal position; the axis of symmetry stays at x = 5.
        - |
          The direction is set by a, which is still 1, so the graph still opens upward.
        - |
          The width is set by a, unchanged here; k only slides the graph vertically.
      answer: 0

    - slug: alg1-u06-w27-q13
      type: multiple_choice
      topic_code: "6.11"
      source: "IM Algebra 1, Unit 6, Lesson 11"
      points: 1
      prompt: |
        What is the vertex of the graph of y = (x − 1)(x − 9)?
      options:
        - "(5, −16)"
        - "(5, 16)"
        - "(4, −16)"
        - "(1, 9)"
      option_explanations:
        - |
          Correct. The intercepts 1 and 9 average to 5, and (5 − 1)(5 − 9) = 4 · (−4) = −16.
        - |
          The product (4)(−4) is negative; the upward-opening parabola dips below the axis between its intercepts.
        - |
          4 is half the distance between the intercepts, not their midpoint; the axis is at x = 5.
        - |
          1 and 9 are the x-intercepts, not the coordinates of the vertex.
      answer: 0

    # ---- Select-all (6.16, 6.8)
    - slug: alg1-u06-w27-q14
      type: multi_select
      topic_code: "6.16"
      source: "IM Algebra 1, Unit 6, Lesson 16"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the graph of y = −3(x − 1)² + 12 are true? Select all that apply.
      options:
        - "The vertex is (1, 12)."
        - "The maximum value of the function is 12."
        - "The y-intercept is 9."
        - "The graph opens downward."
        - "The minimum value of the function is 12."
      option_explanations:
        - |
          Correct. h = 1 and k = 12 can be read directly from the vertex form.
        - |
          Correct. a = −3 is negative, so the vertex is the highest point and 12 is the largest output.
        - |
          Correct. At x = 0, y = −3(−1)² + 12 = −3 + 12 = 9.
        - |
          Correct. The negative leading coefficient flips the parabola to open downward.
        - |
          A downward-opening parabola has no minimum; 12 is its maximum.
      answer: [0, 1, 2, 3]

    - slug: alg1-u06-w27-q15
      type: multi_select
      topic_code: "6.8"
      source: "IM Algebra 1, Unit 6, Lesson 8"
      points: 2
      partial_credit: true
      prompt: |
        Which expressions are equivalent to (x − 3)² − 4? Select all that apply.
      options:
        - "x² − 6x + 5"
        - "(x − 1)(x − 5)"
        - "(x − 3)(x − 3) − 4"
        - "x² − 9 − 4"
        - "x² − 6x + 9 − 4"
      option_explanations:
        - |
          Correct. (x − 3)² = x² − 6x + 9, and 9 − 4 = 5.
        - |
          Correct. (x − 1)(x − 5) = x² − 6x + 5, the same standard form; the intercepts 1 and 5 match (x − 3)² = 4.
        - |
          Correct. A square is the factor multiplied by itself; this is just the original with the square written out.
        - |
          (x − 3)² is not x² − 9: squaring a difference produces a middle term, −6x, and the constant is +9.
        - |
          Correct. This is the expanded square before collecting the constants, equal to x² − 6x + 5.
      answer: [0, 1, 2, 4]

    # ---- True/false (6.17, 6.13)
    - slug: alg1-u06-w27-q16
      type: true_false
      topic_code: "6.17"
      source: "IM Algebra 1, Unit 6, Lesson 17"
      points: 1
      prompt: |
        True or false: the graph of y = (x + 3)² is the graph of y = x² shifted 3 units to the right.
      answer: false
      explanation: |
        False. (x + 3)² is 0 when x = −3, so the vertex is at (−3, 0): the graph is shifted 3 units to the left. Right 3 would be (x − 3)².

    - slug: alg1-u06-w27-q17
      type: true_false
      topic_code: "6.13"
      source: "IM Algebra 1, Unit 6, Lesson 13"
      points: 1
      prompt: |
        True or false: the graphs of y = x² + 5x and y = x² have the same y-intercept.
      answer: true
      explanation: |
        True. Both have constant term 0, so both pass through the origin; the 5x term moves the vertex to (−2.5, −6.25) but not the y-intercept.

    # ---- Fill in the blank (6.15, 6.12)
    - slug: alg1-u06-w27-q18
      type: fill_blank
      topic_code: "6.15"
      source: "IM Algebra 1, Unit 6, Lesson 15"
      points: 1
      prompt: |
        For a quadratic function written as y = a(x − h)² + k, the vertex of the graph is the point (h, ____).
      answer: ["k", "k)"]
      explanation: |
