unit: 6
description: |
  45 questions · about 90 minutes · every lesson of Unit 6 (6.1 to 6.17): recognising quadratic change,
  first and second differences, expressions from patterns, quadratic versus exponential growth, functions
  for falling and launched objects and for revenue, equivalent expressions, the standard, factored and
  vertex forms, intercepts, axis of symmetry and vertex, the effects of a, b, c, h and k on a parabola, and
  reading graphs of situations, plus review of average rate of change and features of graphs from Unit 4.
  Three stimulus sets share a situation across consecutive items. Multiple choice, select-all, true/false
  and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short
  answers and the long answer are graded by your teacher against the scoring notes.
questions:
  # ---- Quadratic change, patterns, comparison (6.1-6.4)
  - slug: alg1-u06-exam-q01
    type: multiple_choice
    topic_code: "6.1"
    source: "IM Algebra 1, Unit 6, Lesson 1"
    points: 1
    prompt: |
      A table lists outputs 1, 3, 7, 13, 21 for inputs 1, 2, 3, 4, 5. Which statement describes how the outputs change?
    options:
      - "Each increase is 2 more than the previous increase: 2, 4, 6, 8."
      - "The outputs increase by the same amount each step."
      - "Each output is about 2 times the previous one."
      - "The outputs increase by 2, then stay constant."
    option_explanations:
      - |
        Correct. 3 − 1 = 2, 7 − 3 = 4, 13 − 7 = 6, 21 − 13 = 8: the increases themselves grow by 2, the mark of quadratic change.
      - |
        The increases 2, 4, 6, 8 are not equal, so the change is not constant.
      - |
        The ratios 3, 2.33, 1.86, 1.62 are not constant, so the change is not exponential either.
      - |
        The outputs keep growing, and by more each step.
    answer: 0

  - slug: alg1-u06-exam-q02
    type: multiple_choice
    topic_code: "6.2"
    source: "IM Algebra 1, Unit 6, Lesson 2"
    points: 1
    prompt: |
      Which table of outputs, for inputs 1, 2, 3, 4, 5, comes from a quadratic function?
    options:
      - "2, 6, 12, 20, 30"
      - "2, 6, 18, 54, 162"
      - "2, 6, 10, 14, 18"
      - "2, 6, 11, 15, 20"
    option_explanations:
      - |
        Correct. First differences 4, 6, 8, 10 and second differences 2, 2, 2: constant second differences (the function is n² + n).
      - |
        Each output is triple the previous: constant ratios, an exponential function.
      - |
        Constant first differences of 4: a linear function.
      - |
        First differences 4, 5, 4, 5 and second differences 1, −1, 1: no constant pattern of either kind.
    answer: 0

  - slug: alg1-u06-exam-q03
    type: multiple_choice
    topic_code: "6.3"
    source: "IM Algebra 1, Unit 6, Lesson 3"
    points: 1
    prompt: |
      A pattern of dots has 4, 10, 18, 28 dots at steps 1, 2, 3, 4. Which expression gives the number of dots at step n?
    options:
      - "n² + 3n"
      - "n² + 3"
      - "3n² + 1"
      - "6n − 2"
    option_explanations:
      - |
        Correct. Second differences (6, 8, 10 then 2, 2) give n²; subtracting 1, 4, 9, 16 leaves 3, 6, 9, 12 = 3n.
      - |
        n² + 3 gives 4 at step 1 but 7 at step 2, not 10.
      - |
        3n² + 1 gives 4 at step 1 but 13 at step 2; a coefficient of 3 would need second differences of 6.
      - |
        6n − 2 matches steps 1 and 2 (4, 10) but gives 16 at step 3, not 18; the pattern is not linear.
    answer: 0

  - slug: alg1-u06-exam-q04
    type: multiple_choice
    topic_code: "6.3"
    source: "IM Algebra 1, Unit 6, Lesson 3"
    points: 1
    prompt: |
      A quadratic table with inputs 1, 2, 3, … has constant second differences of 6. What is the coefficient of n² in its expression?
    options:
      - "3"
      - "6"
      - "12"
      - "1.5"
    option_explanations:
      - |
        Correct. The coefficient of n² is half the second difference: 3n² has outputs 3, 12, 27, 48 with second differences 6.
      - |
        6n² has second differences of 12, twice too large.
      - |
        12 is double the second difference; the coefficient is half of it.
      - |
        1.5n² has second differences of 3, half of what is needed.
    answer: 0

  - slug: alg1-u06-exam-q05
    type: multiple_choice
    topic_code: "6.4"
    source: "IM Algebra 1, Unit 6, Lesson 4"
    points: 1
    prompt: |
      Compare q(n) = 5n² and e(n) = 2ⁿ for whole numbers n. At n = 8, q = 320 and e = 256. From which value of n onward is e(n) larger than q(n)?
    options:
      - "n = 9, where e = 512 and q = 405"
      - "n = 8, because the exponential function is always larger"
      - "n = 10, where e = 1,024 and q = 500"
      - "Never, because 5n² starts ahead and quadratic functions grow without bound"
    option_explanations:
      - |
        Correct. At n = 9, 2⁹ = 512 exceeds 5 · 81 = 405, and from then on the doubling outpaces the quadratic increases.
      - |
        At n = 8 the quadratic is still ahead, 320 against 256; exponential functions are not always larger, only eventually.
      - |
        The exponential function is already ahead at n = 9; n = 10 is one step late.
      - |
        Both grow without bound, but the exponential function's increases multiply while the quadratic's only add, so it overtakes.
    answer: 0

  - slug: alg1-u06-exam-q06
    type: multiple_choice
    topic_code: "6.4"
    source: "IM Algebra 1, Unit 6, Lesson 4"
    points: 1
    prompt: |
      Why does an exponential function with growth factor greater than 1 eventually exceed any quadratic function?
    options:
      - "Each step multiplies the exponential function's value, so its increases grow exponentially, while a quadratic function's increases grow only linearly."
      - "Quadratic functions eventually turn around and decrease."
      - "Exponential functions are larger for every input."
      - "A quadratic function's second differences are constant, so it stops growing."
    option_explanations:
      - |
        Correct. The increase of n² from n to n + 1 is 2n + 1, a linear amount; the increase of 2ⁿ is 2ⁿ itself, which doubles every step.
      - |
        For positive inputs a quadratic function with positive leading coefficient keeps increasing; it is simply outpaced.
      - |
        n² exceeds 2ⁿ at n = 3, and 100n² exceeds 2ⁿ for all n up to 14; the exponential wins eventually, not everywhere.
      - |
        Constant second differences mean the increases grow steadily, not that growth stops.
    answer: 0

  # ---- Stimulus set A: a ball thrown from a cliff (6.6, 6.10, 6.11, 4.7)
  - slug: alg1-u06-exam-q07
    type: multiple_choice
    topic_code: "6.6"
    source: "IM Algebra 1, Unit 6, Lesson 6"
    points: 1
    stimulus: |
      A ball is thrown upward from the edge of a cliff. Its height above the beach, in feet, after t seconds is h(t) = 80 + 64t − 16t², which is equivalent to h(t) = −16(t − 5)(t + 1).
    prompt: |
      What are the height of the cliff and the ball's launch speed?
    options:
      - "80 feet; 64 feet per second"
      - "64 feet; 80 feet per second"
      - "80 feet; 16 feet per second"
      - "5 feet; 64 feet per second"
    option_explanations:
      - |
        Correct. h(0) = 80 is the starting height, and the coefficient of t, 64, is the upward launch speed.
      - |
        The constant term is the starting height and the t coefficient the speed; these are swapped.
      - |
        16 is the gravity coefficient in −16t², the same for every thrown object; the launch speed is 64.
      - |
        5 is a zero of the function (the landing time), not a height.
    answer: 0

  - slug: alg1-u06-exam-q08
    type: multiple_choice
    topic_code: "6.10"
    source: "IM Algebra 1, Unit 6, Lesson 10"
    points: 1
    stimulus: |
      A ball is thrown upward from the edge of a cliff. Its height above the beach, in feet, after t seconds is h(t) = 80 + 64t − 16t², which is equivalent to h(t) = −16(t − 5)(t + 1).
    prompt: |
      When does the ball land on the beach, and which form of the function shows it?
    options:
      - "At t = 5 seconds, shown by the factor (t − 5) in the factored form."
      - "At t = −1 second, shown by the factor (t + 1)."
      - "At t = 80 seconds, shown by the constant in the standard form."
      - "At t = 16 seconds, shown by the coefficient of t²."
    option_explanations:
      - |
        Correct. h(t) = 0 when a factor is 0; t − 5 = 0 at t = 5, the only zero after the throw.
      - |
        t = −1 is also a zero of the expression, but it is one second before the throw and does not describe the flight.
      - |
        80 is the starting height, read from the standard form; it is not a time.
      - |
        16 is the gravity coefficient; neither it nor the standard form displays the zeros.
    answer: 0

  - slug: alg1-u06-exam-q09
    type: multiple_choice
    topic_code: "6.11"
    source: "IM Algebra 1, Unit 6, Lesson 11"
    points: 1
    stimulus: |
      A ball is thrown upward from the edge of a cliff. Its height above the beach, in feet, after t seconds is h(t) = 80 + 64t − 16t², which is equivalent to h(t) = −16(t − 5)(t + 1).
    prompt: |
      What is the ball's greatest height, and when is it reached?
    options:
      - "144 feet at t = 2"
      - "128 feet at t = 1"
      - "144 feet at t = 3"
      - "160 feet at t = 2.5"
    option_explanations:
      - |
        Correct. The zeros 5 and −1 average to 2, and h(2) = 80 + 128 − 64 = 144.
      - |
        h(1) = 128, but the ball keeps rising until t = 2; by symmetry h(3) is also 128.
      - |
        144 is right, but it occurs at t = 2, the midpoint of the zeros; at t = 3 the height is 128.
      - |
        h(2.5) = 80 + 160 − 100 = 140, below the peak; 2.5 is half the landing time, not the midpoint of the zeros.
    answer: 0

  - slug: alg1-u06-exam-q10
    type: multiple_choice
    topic_code: "4.7"
    source: "IM Algebra 1, Unit 4, Lesson 7"
    points: 1
    stimulus: |
      A ball is thrown upward from the edge of a cliff. Its height above the beach, in feet, after t seconds is h(t) = 80 + 64t − 16t², which is equivalent to h(t) = −16(t − 5)(t + 1).
    prompt: |
      What is the average rate of change of the height from t = 2 to t = 5, and what does its sign mean?
    options:
      - "−48 feet per second; the ball is falling on that interval."
      - "48 feet per second; the ball is rising on that interval."
      - "−144 feet per second; the ball drops 144 feet."
      - "−16 feet per second; gravity's constant pull."
    option_explanations:
      - |
        Correct. (h(5) − h(2))/(5 − 2) = (0 − 144)/3 = −48; a negative rate means the height decreases over the interval.
      - |
        From the peak at t = 2 to the landing the height falls from 144 to 0, so the rate is negative.
      - |
        144 feet is the total change in height; dividing by the 3 seconds gives the rate, −48 per second.
      - |
        16 is the coefficient in −16t², not an average rate; the actual rate over this interval is −48.
    answer: 0

  # ---- Situations and forms (6.5-6.9)
  - slug: alg1-u06-exam-q11
    type: multiple_choice
    topic_code: "6.5"
    source: "IM Algebra 1, Unit 6, Lesson 5"
    points: 1
    prompt: |
      A stone is dropped from a 900-foot tower. How high is it after 5 seconds?
    options:
      - "500 feet"
      - "820 feet"
      - "400 feet"
      - "100 feet"
    option_explanations:
      - |
        Correct. It has fallen 16 · 5² = 400 feet, so its height is 900 − 400 = 500 feet.
      - |
        820 subtracts 16 · 5 = 80, treating the fall as linear; the distance fallen is 16t², not 16t.
      - |
        400 is the distance fallen, not the height remaining.
      - |
        100 would need a fall of 800 feet, which takes √50 ≈ 7.07 seconds.
    answer: 0

  - slug: alg1-u06-exam-q12
    type: multiple_choice
    topic_code: "6.5"
    source: "IM Algebra 1, Unit 6, Lesson 5"
    points: 1
    prompt: |
      An object is dropped from 1,024 feet. How long does it take to reach the ground?
    options:
      - "8 seconds"
      - "64 seconds"
      - "32 seconds"
      - "16 seconds"
    option_explanations:
      - |
        Correct. 16t² = 1,024 gives t² = 64, so t = 8 seconds.
      - |
        64 is t², the value of 1,024/16; the time is its square root.
      - |
        32 is √1,024, which forgets the 16 in 16t².
      - |
        After 16 seconds a dropped object has fallen 16 · 256 = 4,096 feet, far more than 1,024.
    answer: 0

  - slug: alg1-u06-exam-q13
    type: multiple_choice
    topic_code: "6.6"
    source: "IM Algebra 1, Unit 6, Lesson 6"
    points: 1
    prompt: |
      A ball's height in feet is h(t) = 3 + 40t − 16t². You find that h(0.5) = 19 and h(2) = 19. When is the ball highest, and how high is it then?
    options:
      - "At t = 1.25, 28 feet"
      - "At t = 1, 27 feet"
      - "At t = 1.25, 19 feet"
      - "At t = 2.5, 3 feet"
    option_explanations:
      - |
        Correct. Equal heights at t = 0.5 and t = 2 put the peak halfway, at t = 1.25: h(1.25) = 3 + 50 − 25 = 28.
      - |
        h(1) = 27 is high but not the peak; the symmetry of the flight puts the vertex at t = 1.25, where the height is 28.
      - |
        The time is right, but 19 is the height at t = 0.5 and t = 2, not at the peak.
      - |
        At t = 2.5 the ball is back at its starting height of 3 feet, on the way down.
    answer: 0

  - slug: alg1-u06-exam-q14
    type: multiple_choice
    topic_code: "6.7"
    source: "IM Algebra 1, Unit 6, Lesson 7"
    points: 1
    prompt: |
      A café predicts it will sell 150 − 25p muffins a day at a price of p dollars each. What is the daily revenue function, and which price gives the most revenue?
    options:
      - "R(p) = p(150 − 25p); p = $3, earning $225"
      - "R(p) = 150 − 25p; p = $0, earning $150"
      - "R(p) = p(150 − 25p); p = $6, earning $900"
      - "R(p) = 150p − 25; p = $6, earning $875"
    option_explanations:
      - |
        Correct. Revenue is price times quantity; the zeros are p = 0 and p = 6, so the best price is halfway, p = 3, where R = 3 · 75 = 225.
      - |
        150 − 25p is the number of muffins, not the revenue; at p = 0 the café gives them away and earns nothing.
      - |
        At p = 6 the quantity is 150 − 150 = 0, so the revenue is 0, not 900.
      - |
        150p − 25 is not price times quantity; the −25 must multiply p², not stand alone.
    answer: 0

  - slug: alg1-u06-exam-q15
    type: multiple_choice
    topic_code: "6.7"
    source: "IM Algebra 1, Unit 6, Lesson 7"
    points: 1
    prompt: |
      For the revenue function R(p) = p(150 − 25p), which domain makes sense for the situation?
    options:
      - "0 ≤ p ≤ 6"
      - "All real numbers"
      - "p ≥ 0"
      - "0 ≤ p ≤ 3"
    option_explanations:
      - |
        Correct. Below 0 the price is negative; above 6 the number sold, 150 − 25p, is negative. Both ends make no sense.
      - |
        The expression can be evaluated anywhere, but a negative price or a negative number of muffins describes nothing.
      - |
        Prices above 6 give a negative quantity sold, so the domain must stop at 6.
      - |
        Stopping at 3 leaves out prices between 3 and 6, which still sell muffins (fewer each dollar).
    answer: 0

  - slug: alg1-u06-exam-q16
    type: multiple_choice
    topic_code: "6.8"
    source: "IM Algebra 1, Unit 6, Lesson 8"
    points: 1
    prompt: |
      Which expression is equivalent to (x − 5)(x + 5)?
    options:
      - "x² − 25"
      - "x² − 10x − 25"
      - "x² + 25"
      - "x² − 10x + 25"
    option_explanations:
      - |
        Correct. x² + 5x − 5x − 25 = x² − 25; the middle terms cancel.
      - |
        The middle terms 5x and −5x cancel; there is no x term.
      - |
        The constant is (−5)(5) = −25, a negative product.
      - |
        x² − 10x + 25 is (x − 5)², the square of one factor, not the product of the two different factors.
    answer: 0

  - slug: alg1-u06-exam-q17
    type: multiple_choice
    topic_code: "6.8"
    source: "IM Algebra 1, Unit 6, Lesson 8"
    points: 1
    prompt: |
      Which expression is equivalent to (2x + 1)(x + 3)?
    options:
      - "2x² + 7x + 3"
      - "2x² + 3"
      - "2x² + 4x + 3"
      - "3x² + 7x + 3"
    option_explanations:
      - |
        Correct. 2x · x + 2x · 3 + 1 · x + 1 · 3 = 2x² + 6x + x + 3 = 2x² + 7x + 3.
      - |
        The middle products 6x and x are missing; at x = 1 the original is 3 · 4 = 12 but this gives 5.
      - |
        The middle term is 6x + x = 7x, not 3x + x.
      - |
        The x² coefficient is 2 · 1 = 2, the product of the x coefficients, not their sum.
    answer: 0

  - slug: alg1-u06-exam-q18
    type: multiple_choice
    topic_code: "6.9"
    source: "IM Algebra 1, Unit 6, Lesson 9"
    points: 1
    prompt: |
      Which is the factored form of x² − 5x − 14?
    options:
      - "(x − 7)(x + 2)"
      - "(x + 7)(x − 2)"
      - "(x − 7)(x − 2)"
      - "(x − 14)(x + 1)"
    option_explanations:
      - |
        Correct. (−7)(2) = −14 and −7 + 2 = −5, matching both the constant and the middle coefficient.
      - |
        7 + (−2) = 5, so this expands to x² + 5x − 14 with the wrong middle sign.
      - |
        (−7)(−2) = +14, not −14; this expands to x² − 9x + 14.
      - |
        (−14)(1) = −14, but −14 + 1 = −13, not −5.
    answer: 0

  # ---- Stimulus set B: one function in three forms (6.10, 6.11, 6.15, 4.6)
  - slug: alg1-u06-exam-q19
    type: multiple_choice
    topic_code: "6.10"
    source: "IM Algebra 1, Unit 6, Lesson 10"
    points: 1
    stimulus: |
      The function f is given by f(x) = x² − 4x − 12. It can also be written as f(x) = (x − 6)(x + 2) and as f(x) = (x − 2)² − 16.
    prompt: |
      What are the intercepts of the graph of f?
    options:
      - "x-intercepts 6 and −2; y-intercept −12"
      - "x-intercepts −6 and 2; y-intercept −12"
      - "x-intercepts 6 and −2; y-intercept −16"
      - "x-intercepts 2 and −16; y-intercept −12"
    option_explanations:
      - |
        Correct. The factors vanish at x = 6 and x = −2; the constant in the standard form, −12, is f(0).
      - |
        The signs are reversed: (x − 6) is 0 at 6 and (x + 2) at −2.
      - |
        −16 is the y-coordinate of the vertex, read from the vertex form, not the y-intercept.
      - |
        2 and −16 are the coordinates of the vertex, not the x-intercepts.
    answer: 0

  - slug: alg1-u06-exam-q20
    type: multiple_choice
    topic_code: "6.11"
    source: "IM Algebra 1, Unit 6, Lesson 11"
    points: 1
    stimulus: |
      The function f is given by f(x) = x² − 4x − 12. It can also be written as f(x) = (x − 6)(x + 2) and as f(x) = (x − 2)² − 16.
    prompt: |
      Using the factored form, how do you find the vertex, and what is it?
    options:
      - "Average the x-intercepts to get x = 2, then compute f(2) = (−4)(4) = −16: vertex (2, −16)."
      - "Multiply the x-intercepts to get −12: vertex (0, −12)."
      - "Average the x-intercepts to get x = 4: vertex (4, −12)."
      - "The vertex is the larger x-intercept: (6, 0)."
    option_explanations:
      - |
        Correct. The axis of symmetry is halfway between 6 and −2, at x = 2, and f(2) = (2 − 6)(2 + 2) = −16; the vertex form confirms (2, −16).
      - |
        The product of the intercepts is the y-intercept here, not a vertex coordinate; the vertex is off the y-axis.
      - |
        4 is half of 6 + 2, but the intercepts are 6 and −2, whose average is 2.
      - |
        The x-intercepts are where the graph crosses the axis; the vertex is the lowest point between them.
    answer: 0

  - slug: alg1-u06-exam-q21
    type: multiple_choice
    topic_code: "6.15"
    source: "IM Algebra 1, Unit 6, Lesson 15"
    points: 1
    stimulus: |
      The function f is given by f(x) = x² − 4x − 12. It can also be written as f(x) = (x − 6)(x + 2) and as f(x) = (x − 2)² − 16.
    prompt: |
      Which check confirms that (x − 2)² − 16 is equivalent to x² − 4x − 12?
    options:
      - "Expanding: (x − 2)² − 16 = x² − 4x + 4 − 16 = x² − 4x − 12."
      - "Both have a constant term, so they are the same function."
      - "Expanding: (x − 2)² − 16 = x² − 4 − 16 = x² − 20, which is close enough."
      - "Both equal −12 at x = 0, so they must agree everywhere."
    option_explanations:
      - |
        Correct. Squaring gives x² − 4x + 4, and 4 − 16 = −12; every term matches.
      - |
        Having a constant term is not a test of equivalence; the whole expansions must agree.
      - |
        (x − 2)² is not x² − 4; the square of a difference has a middle term, −4x, and a positive constant, 4.
      - |
        Agreeing at one input does not prove equivalence; x² + 20x − 12 also equals −12 at x = 0 but is a different function.
    answer: 0

  - slug: alg1-u06-exam-q22
    type: multiple_choice
    topic_code: "4.6"
    source: "IM Algebra 1, Unit 4, Lesson 6"
    points: 1
    stimulus: |
      The function f is given by f(x) = x² − 4x − 12. It can also be written as f(x) = (x − 6)(x + 2) and as f(x) = (x − 2)² − 16.
    prompt: |
      For which inputs is f(x) negative, and on which interval is f increasing?
    options:
      - "Negative for −2 < x < 6; increasing for x > 2"
      - "Negative for x < 2; increasing for x > 6"
      - "Negative for x > 6; increasing for x < 2"
      - "Negative for −2 < x < 6; increasing for x > 6"
    option_explanations:
      - |
        Correct. An upward-opening parabola is below the x-axis between its intercepts, and it rises to the right of its vertex at x = 2.
      - |
        The sign of f changes at the intercepts −2 and 6, not at the vertex; and f starts increasing at the vertex, x = 2, not at 6.
      - |
        Beyond x = 6 the graph is above the axis (f(7) = 9 > 0), and to the left of the vertex the function is decreasing.
      - |
        The negative interval is right, but the function already increases from x = 2 onward: f(3) = −15 > f(2) = −16.
    answer: 0

  # ---- Graphs and the vertex form (6.12-6.17)
  - slug: alg1-u06-exam-q23
    type: multiple_choice
    topic_code: "6.12"
    source: "IM Algebra 1, Unit 6, Lesson 12"
    points: 1
    prompt: |
      How does the graph of y = −(1/2)x² + 4 compare with the graph of y = x²?
    options:
      - "It opens downward, is wider, and has its vertex at (0, 4)."
      - "It opens downward, is narrower, and has its vertex at (0, 4)."
      - "It opens upward, is wider, and is shifted right 4."
      - "It opens downward, is wider, and has its vertex at (4, 0)."
    option_explanations:
      - |
        Correct. The negative coefficient flips it, the 1/2 halves every output so the graph is wider, and the + 4 lifts the vertex to (0, 4).
      - |
        A coefficient between 0 and 1 in absolute value makes the parabola wider, not narrower.
      - |
        The coefficient −1/2 is negative, so it opens downward, and a constant shifts the graph vertically, not horizontally.
      - |
        With no x term the vertex stays on the y-axis; + 4 moves it up to (0, 4), not sideways.
    answer: 0

  - slug: alg1-u06-exam-q24
    type: multiple_choice
    topic_code: "6.13"
    source: "IM Algebra 1, Unit 6, Lesson 13"
    points: 1
    prompt: |
      What is the vertex of the graph of y = x² + 8x?
    options:
      - "(−4, −16)"
      - "(4, −16)"
      - "(−4, 16)"
      - "(0, 8)"
    option_explanations:
      - |
