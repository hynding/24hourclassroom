      (b) y-intercept −15. Axis x = (−5 + 3)/2 = −1; g(−1) = 1 − 2 − 15 = −16. Vertex (−1, −16).
      (c) g(x) = (x + 1)² − 16. Check: x² + 2x + 1 − 16 = x² + 2x − 15.
    explanation: |
      Three points, one per part.

      (a) 1 pt: (x + 5)(x − 3) and intercepts −5, 3.

      (b) 1 pt: −15 and (−1, −16).

      (c) 1 pt: (x + 1)² − 16 with the expansion shown.

  - slug: alg1-u06-exam-q44
    type: short_answer
    topic_code: "6.4"
    source: "IM Algebra 1, Unit 6, Lesson 4"
    points: 3
    prompt: |
      Compare q(n) = 4n² and e(n) = 3ⁿ.

      (a) Make a table of both for n = 1, 2, 3, 4, 5.
      (b) State the first whole number n at which e(n) exceeds q(n), and the difference at n = 6.
      (c) Explain, in terms of how each function changes from one step to the next, why e stays ahead for every larger n.
    answer: |
      (a) q: 4, 16, 36, 64, 100. e: 3, 9, 27, 81, 243.
      (b) n = 4 (81 > 64). At n = 6: e = 729, q = 144, difference 585.
      (c) Each step adds 4(2n + 1) to q, an amount that grows by 8 each time, but triples e, so e's increase is twice its current value and grows exponentially. Once e is ahead its increases exceed q's and keep pulling away.
    explanation: |
      Three points, one per part.

      (a) 1 pt: both rows correct.

      (b) 1 pt: n = 4 and the difference 585.

      (c) 1 pt: additive, linearly growing increases against multiplicative ones.

  - slug: alg1-u06-exam-q45
    type: long_answer
    topic_code: "6.14"
    source: "IM Algebra 1, Unit 6, Lesson 14"
    points: 6
    prompt: |
      A model rocket is launched from a platform. Its height in feet after t seconds is h(t) = −16t² + 48t + 160.

      (1) Show that h(t) = −16(t − 5)(t + 2), and state what each zero means.
      (2) Find the vertex and interpret it.
      (3) Write h in vertex form and verify your answer by expanding.
      (4) Give a sensible domain, find h(3), and explain how symmetry predicts h(3) without arithmetic.
    answer: |
      (1) (t − 5)(t + 2) = t² − 3t − 10; times −16 gives −16t² + 48t + 160. Zero t = 5: the rocket lands 5 seconds after launch. Zero t = −2: a zero of the expression two seconds before the launch, outside the flight, with no physical meaning.
      (2) Axis halfway between −2 and 5: t = 1.5. h(1.5) = −36 + 72 + 160 = 196. Vertex (1.5, 196): the rocket peaks at 196 feet, 1.5 seconds after launch.
      (3) h(t) = −16(t − 1.5)² + 196. Check: −16(t² − 3t + 2.25) + 196 = −16t² + 48t − 36 + 196 = −16t² + 48t + 160.
      (4) Domain 0 ≤ t ≤ 5. h(3) = −144 + 144 + 160 = 160. t = 0 and t = 3 are each 1.5 seconds from the axis t = 1.5, so h(3) = h(0) = 160: three seconds in, the rocket is back at platform height.
    explanation: |
      Six points.

      (1) 2 pts: 1 for the expansion, 1 for interpreting t = 5 and rejecting t = −2.

      (2) 1 pt: (1.5, 196) with its meaning.

      (3) 2 pts: 1 for −16(t − 1.5)² + 196, 1 for the verification.

      (4) 1 pt: domain, h(3) = 160 and the symmetry argument.

      Common errors: zeros 5 and 2; vertex at t = 2.5 (half the landing time); expanding (t − 1.5)² as t² − 2.25.
