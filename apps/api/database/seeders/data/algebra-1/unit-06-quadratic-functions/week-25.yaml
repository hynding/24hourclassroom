week: 25
unit: 6
title: "Quadratic Functions for Situations and Their Forms"
topics: ["6.5", "6.6", "6.7", "6.8", "6.9"]
guide: guides/week-25.md
guide_description: |
  Building quadratic functions for falling and launched objects (16t² and h₀ + vt − 16t²) and for revenue
  (price times quantity sold), reading the starting height, launch speed, maximum and zeros in context,
  choosing a sensible domain, rewriting products such as (x + 3)(x + 5) with area diagrams, and naming
  the standard form ax² + bx + c and the factored form (x + p)(x + q).
flashcards_description: |
  28 cards on the free-fall rule d = 16t², height functions for dropped and launched objects, where the
  starting height and launch speed sit in the expression, revenue as price times quantity, domain, vertex
  and zeros in context, expanding products of binomials, and the standard and factored forms of a
  quadratic expression.

flashcards:
  - front: Distance fallen by a dropped object → rule
    back: |
      d = 16t² feet after t seconds (about 5t² metres). The table 16, 64, 144, 256 is quadratic: the object keeps speeding up.
    topic_code: "6.5"
  - front: Why a dropped object's distance table is quadratic
    back: |
      16, 64, 144, 256 have first differences 48, 80, 112 and second differences 32, 32: constant second differences, the quadratic signature.
    topic_code: "6.5"
  - front: Height of an object dropped from h₀ feet → function
    back: |
      h(t) = h₀ − 16t². The distance fallen is subtracted from the starting height; h decreases faster and faster.
    topic_code: "6.5"
  - front: Rock dropped from 400 ft → landing time
    back: |
      Solve 16t² = 400: t² = 25, t = 5 seconds. Only the positive root means anything here.
    topic_code: "6.5"
  - front: Distance fallen during each successive second
    back: |
      16, 48, 80, 112 feet in the 1st, 2nd, 3rd, 4th seconds: each second adds 32 more feet than the one before.
    topic_code: "6.5"
  - front: Free-fall coefficient in metres
    back: |
      About 5t²: gravity accelerates at about 9.8 m/s², and the distance is half of that times t², roughly 4.9t².
    topic_code: "6.5"
  - front: Height of a launched object → general function
    back: |
      h(t) = h₀ + vt − 16t² in feet: h₀ is the starting height, v the upward launch speed in feet per second, −16t² the pull of gravity.
    topic_code: "6.6"
  - front: Reading h₀ and v from h(t) = 6 + 64t − 16t²
    back: |
      Launched from 6 feet at 64 feet per second upward. h(0) = 6 confirms the starting height.
    topic_code: "6.6"
  - front: Maximum height from a table of heights
    back: |
      Look for equal outputs on either side of the peak; the maximum is halfway between them. For 6, 54, 70, 54, 6 at t = 0 to 4, the maximum is 70 at t = 2.
    topic_code: "6.6"
  - front: Why a launched object's height graph is symmetric
    back: |
      It rises exactly as fast as it later falls: the time up to the peak equals the time down to the same height, so heights match on either side of the peak.
    topic_code: "6.6"
  - front: Launched versus dropped → what changes in the function
    back: |
      A dropped object has no vt term: h₀ − 16t². A launched one adds vt, which lifts the graph before gravity wins.
    topic_code: "6.6"
  - front: h(t) = 0 for a projectile → meaning
    back: |
      The moment the object reaches the ground. Of the two inputs that give 0, only the positive one is a time after launch.
    topic_code: "6.6"
  - front: Revenue from a price → how to build the function
    back: |
      Revenue = price × number sold. If sales fall as the price rises, say 200 − 10p at price p, then r(p) = p(200 − 10p), a quadratic function.
    topic_code: "6.7"
  - front: r(p) = p(200 − 10p) → best price and zeros
    back: |
      Zeros at p = 0 and p = 20; the maximum sits halfway, at p = 10, where revenue is 10 · 100 = $1,000.
    topic_code: "6.7"
  - front: Domain of a revenue function in context
    back: |
      Prices from 0 up to the price at which nobody buys (20 in r(p) = p(200 − 10p)); outside that, price or revenue would be negative.
    topic_code: "6.7"
  - front: Vertex of a quadratic function in context
    back: |
      The input that gives the greatest or least output, and that output: the price that earns the most, the time of the highest point.
    topic_code: "6.7"
  - front: Zeros of a quadratic function in context
    back: |
      The inputs that make the output 0: the prices that earn nothing, the times when a projectile is at ground level.
    topic_code: "6.7"
  - front: Equivalent expressions → test
    back: |
      They have the same value for every input. Expanding one and collecting like terms should produce the other; checking one input can only disprove equivalence.
    topic_code: "6.8"
  - front: Expanding (x + 3)(x + 5) with an area diagram
    back: |
      A rectangle with sides x + 3 and x + 5 splits into x², 5x, 3x and 15, so (x + 3)(x + 5) = x² + 8x + 15.
    topic_code: "6.8"
  - front: Distributing x(x − 4)
    back: |
      x · x − x · 4 = x² − 4x. The product of a variable and a linear factor is already quadratic.
    topic_code: "6.8"
  - front: Expanding (x − 2)(x + 6) → watching the signs
    back: |
      x² + 6x − 2x − 12 = x² + 4x − 12. The constant is (−2)(6) = −12 and the middle term is 6 − 2 = 4.
    topic_code: "6.8"
  - front: Standard form of a quadratic expression
    back: |
      ax² + bx + c with a ≠ 0, such as 3x² − 5x + 2 (a = 3, b = −5, c = 2) or x² − 9 (b = 0).
    topic_code: "6.9"
  - front: Factored form of a quadratic expression
    back: |
      A product of two linear factors, (x + p)(x + q) or a(x + p)(x + q), such as (x − 3)(x + 4) or 2x(x − 5).
    topic_code: "6.9"
  - front: Factored form to standard form → method
    back: |
      Expand: multiply each term of the first factor by each term of the second, then collect like terms. (x − 3)(x + 4) = x² + x − 12.
    topic_code: "6.9"
  - front: x² + 7x + 12 → factored form
    back: |
      Find two numbers with product 12 and sum 7: 3 and 4. So (x + 3)(x + 4). Check by expanding.
    topic_code: "6.9"
  - front: Which form shows what → first look
    back: |
      Factored form shows where the expression is 0 (x = −p or x = −q); standard form shows the value at x = 0 (it is c). Week 26 connects both to the graph.
    topic_code: "6.9"
  - front: A mistake to avoid → (x + 3)(x + 5) = x² + 15
    back: |
      The two middle products 5x and 3x are missing. Every term of one factor multiplies every term of the other: x² + 8x + 15.
    topic_code: "6.8"
  - front: A mistake to avoid → h₀ − 16t² for a thrown ball
    back: |
      That is a dropped object. A ball thrown upward at v feet per second needs the vt term: h₀ + vt − 16t².
    topic_code: "6.6"

quiz:
  description: |
    25 questions · about 45 minutes · quadratic functions for falling and launched objects and for revenue,
    equivalent quadratic expressions, and the standard and factored forms (lessons 6.5 to 6.9), with review
    of quadratic patterns and differences from week 24, average rate of change, function notation and
    domain from unit 4, and comparing quadratic with exponential growth. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the
    short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a ball thrown from a platform (6.6, 6.5, 4.7)
    - slug: alg1-u06-w25-q01
      type: multiple_choice
      topic_code: "6.6"
      source: "IM Algebra 1, Unit 6, Lesson 6"
      points: 1
      stimulus: |
        A ball is thrown straight up from a platform. Its height in feet after t seconds is h(t) = 6 + 64t − 16t².
      prompt: |
        What do the numbers 6 and 64 tell you about the throw?
      options:
        - "The ball starts 6 feet above the ground and is thrown upward at 64 feet per second."
        - "The ball starts 64 feet above the ground and is thrown upward at 6 feet per second."
        - "The ball reaches a maximum height of 64 feet after 6 seconds."
        - "The ball is in the air for 6 seconds and travels 64 feet."
      option_explanations:
        - |
          Correct. h(0) = 6 is the starting height, and 64t is the distance the launch speed alone would carry the ball upward in t seconds.
        - |
          The constant term, not the coefficient of t, is the starting height: h(0) = 6 + 0 − 0 = 6.
        - |
          The maximum is 70 feet at t = 2 (h(2) = 6 + 128 − 64); neither number is read directly as a maximum.
        - |
          The flight lasts about 4.1 seconds (h(4) = 6 and the ball is still falling); 64 is a speed in feet per second, not a distance.
      answer: 0

    - slug: alg1-u06-w25-q02
      type: multiple_choice
      topic_code: "6.6"
      source: "IM Algebra 1, Unit 6, Lesson 6"
      points: 1
      stimulus: |
        A ball is thrown straight up from a platform. Its height in feet after t seconds is h(t) = 6 + 64t − 16t².
      prompt: |
        The heights at t = 0, 1, 2, 3, 4 are 6, 54, 70, 54, 6. What is the ball's maximum height, and when is it reached?
      options:
        - "70 feet at t = 2 seconds"
        - "54 feet at t = 1 second"
        - "70 feet at t = 1 second"
        - "64 feet at t = 2 seconds"
      option_explanations:
        - |
          Correct. The heights are symmetric about t = 2 (54 on each side), and h(2) = 6 + 128 − 64 = 70 is the largest value.
        - |
          54 feet occurs at t = 1 and again at t = 3; the ball is still rising at t = 1 and goes on to 70 feet.
        - |
          The maximum is 70, but it is reached at t = 2, the midpoint between the matching heights at t = 1 and t = 3.
        - |
          64 is the launch speed in feet per second; the height at t = 2 is 70 feet, not 64.
      answer: 0

    - slug: alg1-u06-w25-q03
      type: multiple_choice
      topic_code: "6.5"
      source: "IM Algebra 1, Unit 6, Lesson 5"
      points: 1
      stimulus: |
        A ball is thrown straight up from a platform. Its height in feet after t seconds is h(t) = 6 + 64t − 16t².
      prompt: |
        What does the term −16t² represent?
      options:
        - "The distance gravity pulls the ball down in t seconds, which grows faster and faster."
        - "The height the ball loses each second, a constant 16 feet."
        - "The ball's speed, which decreases by 16 feet per second each second."
        - "The height of the platform, measured downward."
      option_explanations:
        - |
          Correct. A dropped object falls 16t² feet in t seconds; the same term is subtracted from the launch height and the upward travel 64t.
        - |
          The loss is 16 feet in the first second but 48 in the next and 80 in the third; it is not constant.
        - |
          Gravity does slow the ball by 32 feet per second each second, but −16t² is a distance in feet, not a speed.
        - |
          The platform height is the constant term, 6; the t² term depends on time, so it cannot be a fixed height.
      answer: 0

    - slug: alg1-u06-w25-q04
      type: multiple_choice
      topic_code: "4.7"
      source: "IM Algebra 1, Unit 4, Lesson 7"
      points: 1
      stimulus: |
        A ball is thrown straight up from a platform. Its height in feet after t seconds is h(t) = 6 + 64t − 16t².
      prompt: |
        What is the average rate of change of the height from t = 0 to t = 1, and from t = 1 to t = 2?
      options:
        - "48 feet per second, then 16 feet per second"
        - "54 feet per second, then 70 feet per second"
        - "64 feet per second on both intervals"
        - "48 feet per second, then 48 feet per second"
      option_explanations:
        - |
          Correct. (54 − 6)/1 = 48 and (70 − 54)/1 = 16: the ball rises more slowly as it nears the peak.
        - |
          54 and 70 are heights, not rates; the rate on an interval is the change in height divided by the change in time.
        - |
          64 is the launch speed only at the instant t = 0; gravity reduces the average speed over every later interval.
        - |
          The second interval's change is 70 − 54 = 16 feet, not 48; a quadratic function's rate of change is not constant.
      answer: 0

    # ---- Multiple choice (6.5–6.9)
    - slug: alg1-u06-w25-q05
      type: multiple_choice
      topic_code: "6.5"
      source: "IM Algebra 1, Unit 6, Lesson 5"
      points: 1
      prompt: |
        A rock is dropped from a bridge 400 feet above a river. Which function gives its height above the water, in feet, after t seconds?
      options:
        - "h(t) = 400 − 16t²"
        - "h(t) = 400 − 16t"
        - "h(t) = 16t²"
        - "h(t) = 400 + 16t²"
      option_explanations:
        - |
          Correct. The rock falls 16t² feet in t seconds, and that distance is subtracted from the starting height of 400 feet.
        - |
          400 − 16t loses a constant 16 feet per second; a falling rock speeds up, so the loss must grow with t².
        - |
          16t² is the distance fallen, not the height above the water; it starts at 0 and grows, while the height starts at 400 and shrinks.
        - |
          Adding 16t² would have the rock rising ever faster away from the river.
      answer: 0

    - slug: alg1-u06-w25-q06
      type: multiple_choice
      topic_code: "6.5"
      source: "IM Algebra 1, Unit 6, Lesson 5"
      points: 1
      prompt: |
        An object is dropped from 576 feet. Its height after t seconds is 576 − 16t². When does it reach the ground?
      options:
        - "After 6 seconds, because 16 · 6² = 576."
        - "After 36 seconds, because 576/16 = 36."
        - "After 24 seconds, because √576 = 24."
        - "After 4 seconds, because 16 · 4² = 576."
      option_explanations:
        - |
          Correct. The height is 0 when 16t² = 576, so t² = 36 and t = 6 seconds.
        - |
          576/16 = 36 is t², not t; the time is the square root, 6 seconds.
        - |
          √576 = 24 forgets the 16: the equation is 16t² = 576, not t² = 576.
        - |
          16 · 4² = 256, not 576; after 4 seconds the object is still 320 feet up.
      answer: 0

    - slug: alg1-u06-w25-q07
      type: multiple_choice
      topic_code: "6.7"
      source: "IM Algebra 1, Unit 6, Lesson 7"
      points: 1
      prompt: |
        A club predicts that at a ticket price of p dollars it will sell 200 − 10p tickets. Which function gives the revenue, and what kind of function is it?
      options:
        - "r(p) = p(200 − 10p) = 200p − 10p², a quadratic function"
        - "r(p) = 200 − 10p, a linear function"
        - "r(p) = p + (200 − 10p) = 200 − 9p, a linear function"
        - "r(p) = 200 · 10ᵖ, an exponential function"
      option_explanations:
        - |
          Correct. Revenue is price times the number sold, and multiplying p by 200 − 10p produces a p² term.
        - |
          200 − 10p is the number of tickets sold, not the money taken; each ticket must be multiplied by its price.
        - |
          Revenue is a product, not a sum, of price and quantity.
        - |
          Nothing in the situation multiplies by a constant factor each step; the quantity sold falls linearly and revenue is price times quantity.
      answer: 0

    - slug: alg1-u06-w25-q08
      type: multiple_choice
      topic_code: "6.7"
      source: "IM Algebra 1, Unit 6, Lesson 7"
      points: 1
      prompt: |
        For the revenue function r(p) = p(200 − 10p), what do the zeros p = 0 and p = 20 mean, and where is the vertex?
      options:
        - "Revenue is 0 when tickets are free and when the price is so high that nobody buys; the vertex is at p = 10, the price that earns the most."
        - "Revenue is highest at p = 0 and at p = 20; the vertex is at p = 200."
        - "The club loses money at p = 0 and p = 20; the vertex is the price that breaks even."
        - "The zeros are the prices at which exactly 10 tickets sell; the vertex is at p = 20."
      option_explanations:
        - |
          Correct. r(0) = 0 and r(20) = 20 · 0 = 0; the maximum sits halfway between the zeros, at p = 10, where r = 10 · 100 = $1,000.
        - |
          The zeros are where revenue is 0, the lowest it gets; the vertex is between them, not at 200.
        - |
          Revenue is never negative here; a zero means no money comes in, not a loss.
        - |
          At p = 20 no tickets sell at all (200 − 200 = 0), and the vertex is at the midpoint of the zeros, p = 10.
      answer: 0

    - slug: alg1-u06-w25-q09
      type: multiple_choice
      topic_code: "6.8"
      source: "IM Algebra 1, Unit 6, Lesson 8"
      points: 1
      prompt: |
        Which expression is equivalent to (x + 3)(x + 5)?
      options:
        - "x² + 8x + 15"
        - "x² + 15"
        - "x² + 8x + 8"
        - "2x + 8"
      option_explanations:
        - |
          Correct. An area diagram with sides x + 3 and x + 5 has pieces x², 5x, 3x and 15; collecting gives x² + 8x + 15.
        - |
          This forgets the two middle products 3x and 5x; checking x = 1 gives 4 · 6 = 24 on the left but only 16 here.
        - |
          The constant is 3 · 5 = 15, not 3 + 5 = 8; the sum belongs in the coefficient of x.
        - |
          2x + 8 is the sum of the two factors; the product of two linear factors has an x² term.
      answer: 0

    - slug: alg1-u06-w25-q10
      type: multiple_choice
      topic_code: "6.8"
      source: "IM Algebra 1, Unit 6, Lesson 8"
      points: 1
      prompt: |
        Which expression is equivalent to (x − 2)(x + 6)?
      options:
        - "x² + 4x − 12"
        - "x² − 4x − 12"
        - "x² + 4x + 12"
        - "x² − 12"
      option_explanations:
        - |
          Correct. x · x + x · 6 − 2 · x − 2 · 6 = x² + 6x − 2x − 12 = x² + 4x − 12.
        - |
          The middle term is 6x − 2x = +4x; −4x would come from (x + 2)(x − 6).
        - |
          The constant is (−2)(6) = −12, a negative product, not +12.
        - |
          The middle terms 6x and −2x do not cancel; they combine to 4x.
      answer: 0

    - slug: alg1-u06-w25-q11
      type: multiple_choice
      topic_code: "6.9"
      source: "IM Algebra 1, Unit 6, Lesson 9"
      points: 1
      prompt: |
        Which is the factored form of x² + 7x + 12?
      options:
        - "(x + 3)(x + 4)"
        - "(x + 2)(x + 6)"
        - "(x + 1)(x + 12)"
        - "(x + 7)(x + 12)"
      option_explanations:
        - |
          Correct. 3 and 4 multiply to 12 and add to 7, so (x + 3)(x + 4) expands to x² + 7x + 12.
        - |
          2 and 6 multiply to 12 but add to 8; this expands to x² + 8x + 12.
        - |
          1 and 12 multiply to 12 but add to 13; this expands to x² + 13x + 12.
        - |
          This expands to x² + 19x + 84, nothing like the original; the numbers must multiply to 12 and add to 7.
      answer: 0

    - slug: alg1-u06-w25-q12
      type: multiple_choice
      topic_code: "6.9"
      source: "IM Algebra 1, Unit 6, Lesson 9"
      points: 1
      prompt: |
        Which is the standard form of 2(x − 1)(x + 5)?
      options:
        - "2x² + 8x − 10"
        - "2x² + 4x − 5"
        - "x² + 4x − 5"
        - "2x² + 8x + 10"
      option_explanations:
        - |
          Correct. (x − 1)(x + 5) = x² + 4x − 5, and multiplying every term by 2 gives 2x² + 8x − 10.
        - |
          The 2 multiplies every term of x² + 4x − 5, not just the x² term.
        - |
          This is (x − 1)(x + 5) with the factor 2 dropped; the expression is twice this.
        - |
          The constant is 2 · (−1) · 5 = −10, a negative product.
      answer: 0

    - slug: alg1-u06-w25-q13
      type: multiple_choice
      topic_code: "6.2"
      source: "IM Algebra 1, Unit 6, Lesson 2"
      points: 1
      prompt: |
        A table lists heights 0, 48, 64, 48, 0 feet at t = 0, 1, 2, 3, 4 seconds. What does the pattern of differences show?
      options:
        - "First differences 48, 16, −16, −48 and second differences −32: a quadratic function."
        - "First differences 48, 16, −16, −48: a linear function with a changing slope."
        - "The heights rise and fall, so the function is exponential."
        - "The differences are not constant, so no function fits the table."
      option_explanations:
        - |
          Correct. The first differences change by the same amount, −32, each step, which is the signature of a quadratic function (here 64t − 16t²).
        - |
          A linear function has one slope; first differences that change rule it out.
        - |
          Exponential functions never return to an earlier value; their ratios are constant and the heights here include 0.
        - |
          Constant second differences are a pattern; they identify a quadratic function.
      answer: 0

    # ---- Select-all (6.8, 4.10)
    - slug: alg1-u06-w25-q14
      type: multi_select
      topic_code: "6.8"
      source: "IM Algebra 1, Unit 6, Lesson 8"
      points: 2
      partial_credit: true
      prompt: |
        Which expressions are equivalent to x² − 9? Select all that apply.
      options:
        - "(x − 3)(x + 3)"
        - "(x + 3)(x − 3)"
        - "(x − 3)²"
        - "x(x − 9)"
        - "x² + 3x − 3x − 9"
      option_explanations:
        - |
          Correct. Expanding gives x² + 3x − 3x − 9 = x² − 9; the middle terms cancel.
        - |
          Correct. The order of the factors does not matter; this is the same product as (x − 3)(x + 3).
        - |
          (x − 3)² = (x − 3)(x − 3) = x² − 6x + 9, which has a middle term and a positive constant.
        - |
          x(x − 9) = x² − 9x, which has a middle term and no constant; at x = 2 it gives −14 while x² − 9 gives −5, so they are not equivalent.
        - |
          Correct. This is the expanded product before collecting; 3x − 3x = 0 leaves x² − 9.
      answer: [0, 1, 4]

    - slug: alg1-u06-w25-q15
      type: multi_select
      topic_code: "4.10"
      source: "IM Algebra 1, Unit 4, Lesson 10"
      points: 2
      partial_credit: true
      prompt: |
        A marble is dropped from 100 feet and its height is h(t) = 100 − 16t² until it lands. Which statements are true? Select all that apply.
      options:
        - "A sensible domain is 0 ≤ t ≤ 2.5."
        - "The range is 0 ≤ h ≤ 100."
        - "h(1) = 84."
        - "Negative values of t are in the domain because the function can be evaluated there."
        - "The marble is at 36 feet when t = 2."
      option_explanations:
        - |
          Correct. The marble lands when 16t² = 100, so t = 2.5; times before the drop or after landing describe nothing.
        - |
          Correct. The height starts at 100 and falls to 0 at landing, taking every value between.
        - |
          Correct. After 1 second the marble has fallen 16 feet, so its height is 100 − 16 = 84 feet.
        - |
          Being able to compute a value does not make it meaningful; the domain is set by the situation, and the marble was not falling before t = 0.
        - |
          Correct. After 2 seconds it has fallen 16 · 2² = 64 feet, so its height is 100 − 64 = 36 feet.
      answer: [0, 1, 2, 4]

    # ---- True/false (6.5, 6.4)
    - slug: alg1-u06-w25-q16
      type: true_false
      topic_code: "6.5"
      source: "IM Algebra 1, Unit 6, Lesson 5"
      points: 1
      prompt: |
        True or false: a dropped object falls the same distance during its second second of falling as during its first.
      answer: false
      explanation: |
        False. With d = 16t² it falls 16 feet in the first second (0 to 1) and 64 − 16 = 48 feet in the second (1 to 2): three times as far, because it is speeding up.

    - slug: alg1-u06-w25-q17
      type: true_false
      topic_code: "6.4"
      source: "IM Algebra 1, Unit 6, Lesson 4"
      points: 1
      prompt: |
        True or false: because 100n² is larger than 2ⁿ for every whole number n from 1 to 14, it stays larger for all larger n.
      answer: false
      explanation: |
        False. At n = 15, 100n² = 22,500 but 2¹⁵ = 32,768. The exponential function doubles every step while the quadratic function's increases only grow linearly, so 2ⁿ overtakes and stays ahead.

    # ---- Fill in the blank (4.3, 6.3)
    - slug: alg1-u06-w25-q18
      type: fill_blank
      topic_code: "4.3"
      source: "IM Algebra 1, Unit 4, Lesson 3"
      points: 1
      prompt: |
        If h(t) = 6 + 64t − 16t² gives a ball's height in feet after t seconds, then h(3) = 54 means that 3 seconds after the throw the ball's ____ is 54 feet.
      answer: ["height", "height above the ground", "elevation", "altitude"]
      explanation: |
        Function notation names the output: h(3) is the value of the height function at t = 3, so it is a height, not a time or a distance travelled.

    - slug: alg1-u06-w25-q19
      type: fill_blank
      topic_code: "6.3"
      source: "IM Algebra 1, Unit 6, Lesson 3"
      points: 1
      prompt: |
        When a table with inputs 1, 2, 3, … has constant second differences of 10, the coefficient of n² in its expression is ____.
      answer: ["5", "five", "5n²", "half of 10"]
      explanation: |
        The coefficient of n² is half the second difference: 5n² gives 5, 20, 45, 80 with first differences 15, 25, 35 and second differences 10.

    # ---- Numeric (6.5, 6.7, 4.7)
    - slug: alg1-u06-w25-q20
