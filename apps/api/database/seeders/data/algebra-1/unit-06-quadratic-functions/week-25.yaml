    # ---- Short answer (6.6, 6.9)
    - slug: alg1-u06-w25-q23
      type: short_answer
      topic_code: "6.6"
      source: "IM Algebra 1, Unit 6, Lesson 6"
      points: 3
      prompt: |
        A ball is tossed upward from a 4-foot-high table. Its height in feet is h(t) = 4 + 48t − 16t².

        (a) State the starting height and the launch speed, and explain where each appears in the expression.
        (b) Compute h(1), h(2) and h(3), and use the pattern to find the maximum height and when it occurs.
        (c) Explain why the heights at t = 1 and t = 2 are equal.
      answer: |
        (a) Starting height 4 feet (the constant term, h(0) = 4); launch speed 48 feet per second (the coefficient of t).
        (b) h(1) = 4 + 48 − 16 = 36; h(2) = 4 + 96 − 64 = 36; h(3) = 4 + 144 − 144 = 4. Equal heights at t = 1 and t = 2 put the peak halfway, at t = 1.5: h(1.5) = 4 + 72 − 36 = 40 feet.
        (c) The flight is symmetric about its highest point: the ball takes as long to rise from 36 feet to the peak as it takes to fall back to 36 feet. t = 1 and t = 2 are each half a second from the peak at t = 1.5, so the heights match.
      explanation: |
        Three points, one per part.

        (a) 1 pt: 4 feet from the constant term and 48 ft/s from the t coefficient.

        (b) 1 pt: 36, 36, 4 and the maximum 40 feet at t = 1.5.

        (c) 1 pt: symmetry about the peak (t = 1 and t = 2 are equally far from t = 1.5).

    - slug: alg1-u06-w25-q24
      type: short_answer
      topic_code: "6.9"
      source: "IM Algebra 1, Unit 6, Lesson 9"
      points: 3
      prompt: |
        Consider the expressions (x + 2)(x − 5) and x² − 2x − 15.

        (a) Write (x + 2)(x − 5) in standard form, showing the four products.
        (b) Write x² − 2x − 15 in factored form, explaining how you chose the numbers.
        (c) Name one thing each form makes easy to see about the expression.
      answer: |
        (a) x · x + x · (−5) + 2 · x + 2 · (−5) = x² − 5x + 2x − 10 = x² − 3x − 10.
        (b) Two numbers with product −15 and sum −2: −5 and 3. So (x − 5)(x + 3). Check: x² + 3x − 5x − 15 = x² − 2x − 15.
        (c) Factored form shows the inputs that make the expression 0 (x = 5 and x = −3 for (x − 5)(x + 3)); standard form shows the value at x = 0 (the constant, −15) and the coefficient of x².
      explanation: |
        Three points, one per part.

        (a) 1 pt: x² − 3x − 10 with the products shown.

        (b) 1 pt: (x − 5)(x + 3) with the product-and-sum reasoning.

        (c) 1 pt: zeros from factored form, constant or value at 0 from standard form (or any correct feature of each).

    # ---- Long answer (6.7)
    - slug: alg1-u06-w25-q25
      type: long_answer
      topic_code: "6.7"
      source: "IM Algebra 1, Unit 6, Lesson 7"
      points: 6
      prompt: |
        A bakery sells cookies by the dozen. It estimates that at a price of p dollars per dozen it will sell 120 − 20p dozen each day.

        (1) Write a function R(p) for the daily revenue and show that it is quadratic.
        (2) Make a table of R(p) for p = 0, 1, 2, 3, 4, 5, 6 and find the first and second differences.
        (3) State the zeros of R and explain what each means for the bakery.
        (4) Find the price that gives the greatest revenue, the revenue at that price, and a sensible domain for R, with reasons.
      answer: |
        (1) R(p) = p(120 − 20p) = 120p − 20p². The p² term makes it quadratic.
        (2) R: 0, 100, 160, 180, 160, 100, 0. First differences 100, 60, 20, −20, −60, −100; second differences −40 throughout, confirming a quadratic function.
        (3) Zeros at p = 0 (cookies given away, no money) and p = 6 (120 − 120 = 0 dozen sold, so no money).
        (4) The maximum is midway between the zeros, at p = 3, where R(3) = 3 · 60 = $180. Domain 0 ≤ p ≤ 6: below 0 the price is negative and above 6 the number sold would be negative.
      explanation: |
        Six points.

        (1) 1 pt: R(p) = 120p − 20p² identified as quadratic.

        (2) 2 pts: 1 for the table, 1 for both rows of differences with the constant −40.

        (3) 1 pt: both zeros with their meanings.

        (4) 2 pts: 1 for p = 3 and $180, 1 for the domain 0 to 6 with a reason.

        Common errors: R(p) = 120 − 20p (quantity, not revenue); reading the maximum from the wrong row; domain of all real numbers.
