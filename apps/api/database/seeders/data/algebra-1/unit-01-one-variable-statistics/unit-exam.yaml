unit: 1
description: |
  44 questions · about 80 minutes · every lesson of Unit 1 (1.1 to 1.16): statistical questions and data types,
  dot plots, histograms and box plots, shape, mean, median, MAD, IQR and standard deviation, spreadsheet
  formulas, the effect of extremes, outliers, and comparing data sets. Three stimulus sets share a table or a
  described plot across consecutive items. Multiple choice, select-all, true/false and numeric items are graded
  at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are graded
  by your teacher against the scoring notes.
questions:
  # ---- Statistical questions and data types (1.1)
  - slug: alg1-u01-exam-q01
    type: multiple_choice
    topic_code: "1.1"
    source: "IM Algebra 1, Unit 1, Lesson 1"
    points: 1
    prompt: |
      Which question would be answered by collecting data that vary and describing a distribution?
    options:
      - "What time does first period start?"
      - "How many classrooms does the school have?"
      - "How far do students at this school live from campus?"
      - "How many centimetres are in a metre?"
    option_explanations:
      - |
        The start time is a single scheduled fact, not something that varies across cases.
      - |
        A count of classrooms is one number that can be looked up.
      - |
        Correct. Distances vary from student to student, so the answer is a distribution of values.
      - |
        A unit conversion has one fixed answer and needs no data.
    answer: 2

  - slug: alg1-u01-exam-q02
    type: multiple_choice
    topic_code: "1.1"
    source: "IM Algebra 1, Unit 1, Lesson 1"
    points: 1
    prompt: |
      A form records each runner's bib number, finishing time, age group (under 20, 20–39, 40+) and shoe brand. Which of these variables is numerical?
    options:
      - "Bib number"
      - "Finishing time"
      - "Shoe brand"
      - "Age group"
    option_explanations:
      - |
        A bib number identifies a runner; averaging bib numbers means nothing.
      - |
        Correct. Finishing time is a measurement with meaningful differences and averages.
      - |
        Shoe brand is a label that sorts runners into groups.
      - |
        The age groups are categories, even though they are defined by ages.
    answer: 1

  # ---- Stimulus set A: a dot plot of library visits (1.2, 1.4, 1.5, 1.14)
  - slug: alg1-u01-exam-q03
    type: multiple_choice
    topic_code: "1.2"
    source: "IM Algebra 1, Unit 1, Lesson 2"
    points: 1
    stimulus: |
      Graph description: a dot plot shows the number of library visits made by 15 students in a month. There are two dots at 0, four dots at 1, three dots at 2, two dots at 3, one dot at 4, one dot at 5, one dot at 6 and one dot at 12.
    prompt: |
      What is the median number of visits?
    options:
      - "2"
      - "2.5"
      - "3"
      - "1"
    option_explanations:
      - |
        Correct. Ordered, the 15 values are 0, 0, 1, 1, 1, 1, 2, 2, 2, 3, 3, 4, 5, 6, 12; the 8th value is 2.
      - |
        With an odd count the median is a single data value, not an average of two.
      - |
        3 is the 10th and 11th value, past the middle.
      - |
        The dots at 0 and 1 account for the first six values; the 8th value lies in the group of 2s.
    answer: 0

  - slug: alg1-u01-exam-q04
    type: multiple_choice
    topic_code: "1.4"
    source: "IM Algebra 1, Unit 1, Lesson 4"
    points: 1
    stimulus: |
      Graph description: a dot plot shows the number of library visits made by 15 students in a month. There are two dots at 0, four dots at 1, three dots at 2, two dots at 3, one dot at 4, one dot at 5, one dot at 6 and one dot at 12.
    prompt: |
      Which description of the shape is correct?
    options:
      - "Symmetric, centred at 6"
      - "Uniform from 0 to 12"
      - "Skewed left, with a peak at 12"
      - "Skewed right, with a peak at 1 and a tail toward 12"
    option_explanations:
      - |
        The plot is lopsided: most dots sit at 0 to 3 and a tail trails to 12.
      - |
        A uniform plot would have equal stacks at every value; here the stacks vary from 0 to 4 dots.
      - |
        The peak is at 1, not 12, and the tail points to the right.
      - |
        Correct. The tallest stack is at 1, the dots thin out to the right, and the single dot at 12 extends the right tail.
    answer: 3

  - slug: alg1-u01-exam-q05
    type: multiple_choice
    topic_code: "1.14"
    source: "IM Algebra 1, Unit 1, Lesson 14"
    points: 1
    stimulus: |
      Graph description: a dot plot shows the number of library visits made by 15 students in a month. There are two dots at 0, four dots at 1, three dots at 2, two dots at 3, one dot at 4, one dot at 5, one dot at 6 and one dot at 12.
    prompt: |
      Q1 = 1 and Q3 = 4 for these data. Is 12 an outlier by the 1.5 × IQR rule?
    options:
      - "Yes, because the upper fence is 4 + 1.5 × 3 = 8.5 and 12 is above it"
      - "No, because the upper fence is 4 + 3 = 7 and 12 is a visit count, not a fence"
      - "Yes, because 12 is more than twice the median"
      - "No, because 12 is less than 1.5 × 12"
    option_explanations:
      - |
        Correct. IQR = 3, 1.5 × 3 = 4.5, upper fence = 8.5, and 12 > 8.5.
      - |
        The fence is Q3 plus 1.5 times the IQR, which is 8.5, and 12 is beyond it.
      - |
        There is no "twice the median" rule; the fence uses Q3 and the IQR.
      - |
        The rule compares the value with a fence built from the quartiles, not with a multiple of itself.
    answer: 0

  - slug: alg1-u01-exam-q06
    type: numeric
    topic_code: "1.5"
    source: "IM Algebra 1, Unit 1, Lesson 5"
    points: 1
    stimulus: |
      Graph description: a dot plot shows the number of library visits made by 15 students in a month. There are two dots at 0, four dots at 1, three dots at 2, two dots at 3, one dot at 4, one dot at 5, one dot at 6 and one dot at 12.
    prompt: |
      What is the mean number of visits? Give your answer to one decimal place.
    answer: { value: 2.9, tolerance: 0.05 }
    explanation: |
      Sum = 2(0) + 4(1) + 3(2) + 2(3) + 4 + 5 + 6 + 12 = 0 + 4 + 6 + 6 + 27 = 43. Mean = 43/15 ≈ 2.87, which rounds to 2.9. The mean sits above the median of 2 because the single value 12 pulls it toward the right tail.

  # ---- Displays (1.2, 1.3)
  - slug: alg1-u01-exam-q07
    type: multiple_choice
    topic_code: "1.3"
    source: "IM Algebra 1, Unit 1, Lesson 3"
    points: 1
    prompt: |
      A researcher has 5,000 measurements and wants to see whether the distribution has one peak or two. Which display is most useful?
    options:
      - "A dot plot"
      - "A histogram with a sensible bin width"
      - "A box plot"
      - "The five-number summary"
    option_explanations:
      - |
        Five thousand dots stacked on a number line cannot be read or counted.
      - |
        Correct. A histogram shows the shape of a large data set, and two peaks appear as two humps.
      - |
        A box plot shows five numbers and cannot reveal a second peak.
      - |
        Five numbers cannot tell one peak from two.
    answer: 1

  - slug: alg1-u01-exam-q08
    type: multiple_choice
    topic_code: "1.2"
    source: "IM Algebra 1, Unit 1, Lesson 2"
    points: 1
    prompt: |
      Graph description: a box plot has whiskers from 8 to 40, a box from 15 to 27, and a line at 19. What is the IQR?
    options:
      - "8"
      - "19"
      - "12"
      - "32"
    option_explanations:
      - |
        8 is the minimum, the left end of the left whisker.
      - |
        19 is the median, the line inside the box.
      - |
        Correct. The box runs from Q1 = 15 to Q3 = 27, so IQR = 27 − 15 = 12.
      - |
        32 is the range, 40 − 8, the distance between the whisker ends rather than the box edges.
    answer: 2

  - slug: alg1-u01-exam-q09
    type: multiple_choice
    topic_code: "1.2"
    source: "IM Algebra 1, Unit 1, Lesson 2"
    points: 1
    prompt: |
      A histogram uses bins 0–5, 5–10, 10–15 and 15–20 with heights 3, 8, 6 and 1. Which statement must be true?
    options:
      - "The data contain the value 8."
      - "The median is exactly 7.5."
      - "The largest value is 20."
      - "The data set has 18 values."
    option_explanations:
      - |
        Histograms hide individual values; we only know eight values lie between 5 and 10.
      - |
        The median lies in the 5–10 bin (the 9th and 10th values fall there) but its exact value cannot be read from a histogram.
      - |
        The last bin holds one value somewhere between 15 and 20; its exact value is unknown.
      - |
        Correct. Bar heights are counts: 3 + 8 + 6 + 1 = 18 values.
    answer: 3

  # ---- Centre and spread (1.5, 1.12)
  - slug: alg1-u01-exam-q10
    type: multiple_choice
    topic_code: "1.5"
    source: "IM Algebra 1, Unit 1, Lesson 5"
    points: 1
    prompt: |
      The data 6, 8, 11, 15 have mean 10. What is the mean absolute deviation?
    options:
      - "3.5"
      - "0"
      - "3"
      - "9"
    option_explanations:
      - |
        3.5 would need a sum of 14; the distances sum to 12.
      - |
        The signed deviations sum to zero, but the MAD uses distances.
      - |
        Correct. Distances from 10 are 4, 2, 1, 5; sum 12; MAD = 12/4 = 3.
      - |
        9 is the range, 15 − 6, not an average distance from the mean.
    answer: 2

  - slug: alg1-u01-exam-q11
    type: multiple_choice
    topic_code: "1.12"
    source: "IM Algebra 1, Unit 1, Lesson 12"
    points: 1
    prompt: |
      The data 4, 6, 10, 12 have mean 8. What is the standard deviation (dividing by n)?
    options:
      - "√10 ≈ 3.16"
      - "40"
      - "10"
      - "3"
    option_explanations:
      - |
        Correct. Squared deviations 16, 4, 4, 16 sum to 40; variance 40/4 = 10; SD = √10 ≈ 3.16.
      - |
        40 is the sum of squared deviations before dividing by n.
      - |
        10 is the variance, not its square root.
      - |
        3 is the MAD (distances 4, 2, 2, 4 average to 3); the SD squares first.
    answer: 0

  - slug: alg1-u01-exam-q12
    type: multiple_choice
    topic_code: "1.12"
    source: "IM Algebra 1, Unit 1, Lesson 12"
    points: 1
    prompt: |
      Which statement correctly interprets a standard deviation of 1.5 kg for the weights of a litter of puppies with mean 4 kg?
    options:
      - "The heaviest puppy is 1.5 kg heavier than the lightest."
      - "Half the puppies weigh exactly 4 kg."
      - "Every puppy weighs between 2.5 kg and 5.5 kg."
      - "A typical puppy's weight is about 1.5 kg away from 4 kg."
    option_explanations:
      - |
        That describes the range, which the SD does not give.
      - |
        The SD says nothing about how many values equal the mean.
      - |
        The SD is a typical distance, not a guaranteed limit; some puppies may be further from the mean.
      - |
        Correct. The standard deviation is a typical distance of the values from the mean, in the data's units.
    answer: 3

  # ---- Spreadsheets (1.6, 1.7, 1.8)
  - slug: alg1-u01-exam-q13
    type: multiple_choice
    topic_code: "1.6"
    source: "IM Algebra 1, Unit 1, Lesson 6"
    points: 1
    prompt: |
      Column A holds 1, 2, 5 and column B shows 2, 5, 26. Which formula is in B1?
    options:
      - "=A1*2"
      - "=A1^2+1"
      - "=3*A1-1"
      - "=A1+1"
    option_explanations:
      - |
        1 × 2 = 2 fits the first row, but 5 × 2 = 10, not 26.
      - |
        Correct. 1² + 1 = 2, 2² + 1 = 5 and 5² + 1 = 26.
      - |
        3 × 1 − 1 = 2 fits the first row, but 3 × 2 − 1 = 5 and 3 × 5 − 1 = 14, not 26.
      - |
        1 + 1 = 2 fits the first row, but 2 + 1 = 3, not 5.
    answer: 1

  - slug: alg1-u01-exam-q14
    type: multiple_choice
    topic_code: "1.7"
    source: "IM Algebra 1, Unit 1, Lesson 7"
    points: 1
    prompt: |
      Thirty values are in cells C2 through C31. Which formula computes their mean?
    options:
      - "=SUM(C2:C31)/31"
      - "=AVERAGE(C2+C31)"
      - "=AVERAGE(C2:C31)"
      - "=MEAN(C2:C31)"
    option_explanations:
      - |
        The range holds 30 values, not 31; the divisor is wrong.
      - |
        The plus sign adds just two cells; a range uses a colon.
      - |
        Correct. AVERAGE over the range of thirty cells returns their mean.
      - |
        MEAN is not a spreadsheet function; the mean is computed by AVERAGE.
    answer: 2

  - slug: alg1-u01-exam-q15
    type: multiple_choice
    topic_code: "1.8"
    source: "IM Algebra 1, Unit 1, Lesson 8"
    points: 1
    prompt: |
      Cell D2 contains =C2-$C$1 and is filled down to D10. What does D10 contain?
    options:
      - "=C10-$C$1"
      - "=C2-$C$1"
      - "=C10-C9"
      - "=C10-$C$9"
    option_explanations:
      - |
        Correct. The relative reference C2 becomes C10 and the absolute reference $C$1 is unchanged.
      - |
        The first reference moves with the formula when it is filled down.
      - |
        The copied formula keeps its dollar signs and its locked reference.
      - |
        The dollar signs keep the second reference at C1.
    answer: 0

  # ---- Stimulus set B: two sections' quiz summaries (1.11, 1.15, 1.10)
  - slug: alg1-u01-exam-q16
    type: multiple_choice
    topic_code: "1.11"
    source: "IM Algebra 1, Unit 1, Lesson 11"
    points: 1
    stimulus: |
      Two sections of the same course took a 40-point quiz.

      | Section | Shape | Mean | Median | SD | IQR | Outliers |
      |---|---|---|---|---|---|---|
      | Morning | roughly symmetric | 29.5 | 30 | 3.2 | 4 | none |
      | Afternoon | skewed left | 26.0 | 31 | 8.9 | 5 | two scores below 8 |
    prompt: |
      Which pair of statistics should be used to compare the typical scores of the two sections?
    options:
      - "The means, because they use every score"
      - "The IQRs, because they are resistant"
      - "The standard deviations, because they are larger"
      - "The medians, because one section is skewed with outliers"
    option_explanations:
      - |
        The afternoon mean is dragged down by two very low scores and does not describe a typical student there.
      - |
        The IQR is a measure of spread, so it cannot be used to compare typical scores.
      - |
        Standard deviations measure spread, not typical score.
      - |
        Correct. With skew and outliers in one section, the resistant median is the matching centre for both.
    answer: 3

  - slug: alg1-u01-exam-q17
    type: multiple_choice
    topic_code: "1.15"
    source: "IM Algebra 1, Unit 1, Lesson 15"
    points: 1
    stimulus: |
      Two sections of the same course took a 40-point quiz.

      | Section | Shape | Mean | Median | SD | IQR | Outliers |
      |---|---|---|---|---|---|---|
      | Morning | roughly symmetric | 29.5 | 30 | 3.2 | 4 | none |
      | Afternoon | skewed left | 26.0 | 31 | 8.9 | 5 | two scores below 8 |
    prompt: |
      Which conclusion is best supported by the table?
    options:
      - "The morning section scored much higher, since 29.5 is above 26.0."
      - "Typical scores are similar in the two sections, but the afternoon section is less consistent because of a few very low scores."
      - "The sections are identical because the IQRs are close."
      - "The afternoon section scored much higher, since its SD is larger."
    option_explanations:
      - |
        The 3.5-point gap in means is created by the two outliers; the medians differ by only one point.
      - |
        Correct. Medians of 30 and 31 are close; the afternoon SD of 8.9 and two outliers show more variability.
      - |
        Similar IQRs describe the middle halves; the SDs and outliers show the sections differ in spread.
      - |
        A larger SD means more spread, not higher scores.
    answer: 1

  - slug: alg1-u01-exam-q18
    type: multiple_choice
    topic_code: "1.10"
    source: "IM Algebra 1, Unit 1, Lesson 10"
    points: 1
    stimulus: |
      Two sections of the same course took a 40-point quiz.

      | Section | Shape | Mean | Median | SD | IQR | Outliers |
      |---|---|---|---|---|---|---|
      | Morning | roughly symmetric | 29.5 | 30 | 3.2 | 4 | none |
      | Afternoon | skewed left | 26.0 | 31 | 8.9 | 5 | two scores below 8 |
    prompt: |
      If the two afternoon scores below 8 were removed, which change would you expect?
    options:
      - "The afternoon mean would rise toward the median and the SD would fall."
      - "The afternoon IQR would double."
      - "The morning statistics would change."
      - "The afternoon median would fall sharply."
    option_explanations:
      - |
        Correct. The two low scores drag the mean down and inflate the SD; without them the mean approaches the median and the spread shrinks.
      - |
        The IQR depends on the quartiles of the middle, which barely move when two extreme values leave.
      - |
        The morning section's data are unaffected by changes to the afternoon section.
      - |
        Removing two low values shifts the median by at most one position upward, not sharply down.
    answer: 0

  # ---- Effects of changes (1.10, 1.13)
  - slug: alg1-u01-exam-q19
    type: multiple_choice
    topic_code: "1.13"
    source: "IM Algebra 1, Unit 1, Lesson 13"
    points: 1
    prompt: |
      A data set has mean 12 and standard deviation 2. Every value is multiplied by 3 and then 4 is subtracted. What are the new mean and standard deviation?
    options:
      - "Mean 36, SD 6"
      - "Mean 32, SD 18"
      - "Mean 32, SD 2"
      - "Mean 32, SD 6"
    option_explanations:
      - |
        The subtraction of 4 shifts the mean from 36 to 32.
      - |
        The SD triples to 6; squaring is not involved in the final SD.
      - |
        Multiplying by 3 triples the spread; the SD cannot stay at 2.
      - |
        Correct. Tripling gives mean 36 and SD 6; subtracting 4 moves the mean to 32 and leaves the SD at 6.
    answer: 3

  - slug: alg1-u01-exam-q20
    type: multiple_choice
    topic_code: "1.10"
    source: "IM Algebra 1, Unit 1, Lesson 10"
    points: 1
    prompt: |
      The data 15, 16, 18, 19, 22 have median 18. If 60 is added as a sixth value, what is the new median?
    options:
      - "60"
      - "18.5"
      - "18"
      - "25"
    option_explanations:
      - |
        The median is a middle value, never the extreme that was added.
      - |
        Correct. Ordered: 15, 16, 18, 19, 22, 60; the median is (18 + 19)/2 = 18.5, barely changed.
      - |
        With six values the median averages the 3rd and 4th, which are 18 and 19.
      - |
        25 is the new mean (150/6), which is what moves a lot; the median does not.
    answer: 1

  # ---- Stimulus set C: a spreadsheet of commute times (1.7, 1.8, 1.9)
  - slug: alg1-u01-exam-q21
    type: multiple_choice
    topic_code: "1.7"
    source: "IM Algebra 1, Unit 1, Lesson 7"
    points: 1
    stimulus: |
      A spreadsheet holds the commute times, in minutes, of 25 teachers in cells B2 through B26. Cell E1 holds the formula =AVERAGE(B2:B26) and displays 23.4. Column C is meant to hold each teacher's absolute deviation from the mean, and cell E2 will hold the MAD.
    prompt: |
      Which formula should go in C2 so that it can be filled down to C26 correctly?
    options:
      - "=B2-$E$1"
      - "=ABS(B2-E1)"
      - "=ABS(B2-$E$1)"
      - "=AVERAGE(B2-$E$1)"
    option_explanations:
      - |
        This gives a signed deviation; the MAD needs absolute values, and the signed deviations would average to zero.
      - |
        Without dollar signs, filling down turns E1 into E2, E3 and so on, pointing at the wrong cells.
      - |
        Correct. ABS gives the distance from the mean, and $E$1 keeps every row pointed at the mean.
      - |
        AVERAGE of a single difference is just that difference; it does not take the absolute value.
    answer: 2

  - slug: alg1-u01-exam-q22
    type: multiple_choice
    topic_code: "1.8"
    source: "IM Algebra 1, Unit 1, Lesson 8"
    points: 1
    stimulus: |
      A spreadsheet holds the commute times, in minutes, of 25 teachers in cells B2 through B26. Cell E1 holds the formula =AVERAGE(B2:B26) and displays 23.4. Column C is meant to hold each teacher's absolute deviation from the mean, and cell E2 will hold the MAD.
    prompt: |
      Which formula in E2 computes the MAD once column C is filled?
    options:
      - "=AVERAGE(C2:C26)"
      - "=AVERAGE(B2:B26)"
      - "=SUM(C2:C26)"
      - "=MEDIAN(C2:C26)"
    option_explanations:
      - |
        Correct. The MAD is the mean of the absolute deviations held in C2 through C26.
      - |
        That is the mean of the commute times again, already in E1.
      - |
        The sum of the deviations must still be divided by 25 to give an average distance.
      - |
        The median of the deviations is not the MAD, which is their mean.
    answer: 0

  - slug: alg1-u01-exam-q23
    type: multiple_choice
    topic_code: "1.9"
    source: "IM Algebra 1, Unit 1, Lesson 9"
    points: 1
    stimulus: |
      A spreadsheet holds the commute times, in minutes, of 25 teachers in cells B2 through B26. Cell E1 holds the formula =AVERAGE(B2:B26) and displays 23.4. Column C is meant to hold each teacher's absolute deviation from the mean, and cell E2 will hold the MAD.
    prompt: |
      The commute times range from 5 to 65 minutes. The spreadsheet's default histogram uses a bin width of 1 minute and looks like a scattered comb. Which bin width would give a readable histogram of these data?
    options:
      - "1 minute, because more detail is always better"
      - "0.5 minutes, to separate every value"
      - "60 minutes, giving a single bar"
      - "About 6 minutes, giving roughly ten bins"
    option_explanations:
      - |
        With only 25 values, 1-minute bins leave most bins empty or with one value, which hides the shape.
      - |
        Narrower bins make the comb worse, with even more empty or single-value bins.
      - |
        One bar covering the whole range shows no shape at all and hides every feature.
      - |
        Correct. A range of 60 minutes in bins of about 6 gives around ten bins, enough to show the shape without noise.
    answer: 3

  # ---- Outliers and shape (1.14, 1.4)
  - slug: alg1-u01-exam-q24
    type: multiple_choice
    topic_code: "1.14"
    source: "IM Algebra 1, Unit 1, Lesson 14"
    points: 1
    prompt: |
      A student records the heights of classmates and one entry reads 1,620 cm. Which action is appropriate?
    options:
      - "Change it to the mean height so it does not affect the SD"
      - "Check the record; it is almost certainly a typing error for 162 cm, and either correct it or remove it and say so"
      - "Keep it, because every data value must stay in the set"
      - "Delete it quietly so the mean looks reasonable"
    option_explanations:
      - |
        Inventing a value is fabrication; the correct value should be found or the entry removed.
      - |
        Correct. An outlier is investigated first; an impossible value is an error to fix or remove with a note.
      - |
        Values shown to be errors should be corrected or removed; this one is physically impossible.
      - |
        Removing data without reporting it misrepresents the analysis.
    answer: 1

  - slug: alg1-u01-exam-q25
    type: multiple_choice
    topic_code: "1.4"
    source: "IM Algebra 1, Unit 1, Lesson 4"
    points: 1
    prompt: |
      Which situation most likely produces a bimodal distribution?
    options:
      - "The weights of eggs from one farm"
      - "The last digit of 500 randomly chosen phone numbers"
      - "The heights of all the people at a parent–toddler swim class"
      - "The waiting times at a bank, where most waits are short and a few are long"
    option_explanations:
      - |
        Eggs from one farm are usually a single roughly symmetric cluster.
      - |
        Last digits are roughly uniform: each digit appears about equally often.
      - |
        Correct. Toddlers and adults form two separate clusters of heights, producing two peaks.
      - |
        Mostly short waits with a few long ones is a skewed-right distribution with one peak.
    answer: 2

  - slug: alg1-u01-exam-q26
    type: multiple_choice
    topic_code: "1.16"
    source: "IM Algebra 1, Unit 1, Lesson 16"
    points: 1
    prompt: |
      In a statistical investigation, which step comes immediately after collecting the data?
    options:
      - "Writing the conclusion"
      - "Displaying the data to see its shape"
      - "Computing the mean"
      - "Posing the statistical question"
    option_explanations:
      - |
        The conclusion comes last, after the displays and summaries.
      - |
        Correct. Plot first: the shape decides which summary statistics are appropriate.
      - |
        Computing before looking risks choosing the wrong centre for skewed data.
      - |
        The question is posed before any data are collected.
    answer: 1

  - slug: alg1-u01-exam-q27
