    topic_code: "1.14"
    source: "IM Algebra 1, Unit 1, Lesson 14"
    points: 1
    prompt: |
      True or false: a value exactly equal to Q3 + 1.5 × IQR is classified as an outlier.
    answer: false
    explanation: |
      False. The fences are boundaries; a value must lie beyond a fence (above the upper fence or below the lower fence) to count as an outlier. A value on the fence is inside.

