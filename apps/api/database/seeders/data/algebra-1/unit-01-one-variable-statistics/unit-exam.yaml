  # ---- Free response
  - slug: alg1-u01-exam-q41
    type: short_answer
    topic_code: "1.14"
    source: "IM Algebra 1, Unit 1, Lesson 14"
    points: 3
    prompt: |
      The number of text messages 12 students sent yesterday: 4, 9, 12, 15, 15, 18, 20, 22, 25, 28, 31, 90.

      (a) Find the five-number summary.
      (b) Use the 1.5 × IQR rule to decide whether 90 is an outlier.
      (c) State which centre you would report and give its value, with a reason.
    answer: |
      (a) Min 4; Q1 = median of 4, 9, 12, 15, 15, 18 = (12 + 15)/2 = 13.5; median = (18 + 20)/2 = 19; Q3 = median of 20, 22, 25, 28, 31, 90 = (25 + 28)/2 = 26.5; max 90.
      (b) IQR = 13; 1.5 × 13 = 19.5; upper fence = 26.5 + 19.5 = 46. Since 90 > 46, it is an outlier.
      (c) The median, 19 messages, because the outlier at 90 inflates the mean (the mean is 289/12 ≈ 24.1) and the distribution is skewed right.
    explanation: |
      Three points, one per part.

      (a) 1 pt: 4, 13.5, 19, 26.5, 90.

      (b) 1 pt: fence 46 and the conclusion that 90 is an outlier.

      (c) 1 pt: median 19 with a reason tied to the outlier or skew.

  - slug: alg1-u01-exam-q42
    type: short_answer
    topic_code: "1.12"
    source: "IM Algebra 1, Unit 1, Lesson 12"
    points: 3
    prompt: |
      Six bags of rice are weighed, in kilograms: 4.8, 4.9, 5.0, 5.0, 5.1, 5.2.

      (a) Compute the mean and the standard deviation (divide by n; round the SD to three decimal places).
      (b) A second factory's bags have mean 5.0 kg and SD 0.4 kg. Compare the two factories in one sentence.
      (c) The first factory's scale was later found to read 0.1 kg too high on every bag. Explain what happens to the mean and the SD once the weights are corrected.
    answer: |
      (a) Mean = 30.0/6 = 5.0. Deviations −0.2, −0.1, 0, 0, 0.1, 0.2; squares 0.04, 0.01, 0, 0, 0.01, 0.04; sum 0.10; variance 0.10/6 ≈ 0.01667; SD ≈ 0.129 kg.
      (b) Both factories fill bags to 5.0 kg on average, but the first is far more consistent: its SD of 0.129 kg is less than a third of the second's 0.4 kg.
      (c) Subtracting 0.1 kg from every weight shifts the mean to 4.9 kg but leaves every deviation, and so the SD, unchanged at 0.129 kg.
    explanation: |
      Three points, one per part.

      (a) 1 pt: mean 5.0 and SD ≈ 0.129 (accept 0.13).

      (b) 1 pt: same centre, first factory more consistent, citing the SDs.

      (c) 1 pt: mean falls by 0.1 to 4.9, SD unchanged, with the reason that a shift does not change deviations.

  - slug: alg1-u01-exam-q43
    type: short_answer
    topic_code: "1.7"
    source: "IM Algebra 1, Unit 1, Lesson 7"
    points: 3
    prompt: |
      A spreadsheet holds 50 test scores in cells A2 through A51.

      (a) Write formulas for the mean, the median and the maximum.
      (b) Write a formula for cell B2 that computes the first score's deviation from the mean stored in D1, in a form that fills down correctly, and write what B7 will contain after filling.
      (c) Describe one way to check that your spreadsheet is computing correctly before trusting it on the 50 scores.
    answer: |
      (a) =AVERAGE(A2:A51), =MEDIAN(A2:A51), =MAX(A2:A51).
      (b) =A2-$D$1; after filling, B7 contains =A7-$D$1.
      (c) Replace the data with a tiny set whose answers are known by hand (for example 2, 4, 6 has mean 4, median 4, max 6) and confirm the sheet shows those values; or compute one row's deviation by hand and compare it with column B.
    explanation: |
      Three points, one per part.

      (a) 1 pt: all three formulas with the correct range (SUM/COUNT for the mean is acceptable).

      (b) 1 pt: the locked reference $D$1 (or D$1) and the correct filled formula in B7.

      (c) 1 pt: any concrete check (small known data set, hand computation of one cell).

  - slug: alg1-u01-exam-q44
    type: long_answer
    topic_code: "1.15"
    source: "IM Algebra 1, Unit 1, Lesson 15"
    points: 6
    prompt: |
      A school tested two brands of light bulb. Each bulb's lifetime, in hundreds of hours, is listed.

      Brand A: 8, 9, 9, 10, 10, 10, 11, 11, 12, 30
      Brand B: 7, 9, 10, 11, 11, 12, 12, 13, 14, 15

      Write a complete comparison. Describe the shape of each distribution and apply the outlier rule to brand A. Choose and compute an appropriate centre and spread for each brand, justifying your choice. Compare the brands on typical lifetime and on consistency. Finally, recommend a brand for a gym that replaces all its bulbs at once and wants the longest typical life, and explain how your recommendation would change if the 30 in brand A's data turned out to be a recording error for 10.
    answer: |
      Shape: A is tightly clustered from 8 to 12 with a single far value at 30, so it is skewed right with a likely outlier. B is roughly symmetric from 7 to 15.
      Outlier rule for A: Q1 = median of 8, 9, 9, 10, 10 = 9; Q3 = median of 10, 11, 11, 12, 30 = 11; IQR = 2; upper fence = 11 + 3 = 14. The 30 is an outlier.
      Statistics: because A has an outlier, use medians and IQRs for both. A: median (10 + 10)/2 = 10, IQR = 2. B: median (11 + 12)/2 = 11.5, Q1 = 10, Q3 = 13, IQR = 3. (Means: A = 120/10 = 12.0, inflated by the 30; B = 114/10 = 11.4.)
      Comparison: B's typical bulb lasts about 150 hours longer (median 11.5 vs 10). A is slightly more consistent in its middle half (IQR 2 vs 3), but A also produced the single 30, which is not typical.
      Recommendation: for the longest typical life, choose B; its median is higher and it has no values below 7. If the 30 were really a 10, A's data would become 8 to 12 with median 10 and mean 10.0, still below B's 11.5, so the recommendation stays with B; the correction would only remove the misleading mean of 12.0 that might have made A look better.
    explanation: |
      Six points.

      Shape and outlier (2 pts): 1 pt for both shapes described correctly; 1 pt for computing A's fence (14) and identifying 30 as an outlier.

      Statistics (2 pts): 1 pt for choosing medians and IQRs with a justification based on A's outlier; 1 pt for correct values (A: 10 and 2; B: 11.5 and 3).

      Comparison and recommendation (2 pts): 1 pt for comparing both centre and spread in context; 1 pt for recommending B and correctly reasoning that the correction would not change the choice (A's median stays 10).

      Common errors: comparing means and concluding A lasts longer; stating 30 is an outlier without computing the fence; failing to revisit the recommendation after the correction.
