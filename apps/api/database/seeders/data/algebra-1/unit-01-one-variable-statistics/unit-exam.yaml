    points: 1
    prompt: |
      True or false: in a distribution that is skewed left, the mean is usually less than the median.
    answer: true
    explanation: |
      True. The tail of small values pulls the balance point (the mean) down toward it, while the median stays at the middle position.

  - slug: alg1-u01-exam-q33
