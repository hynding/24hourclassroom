    - slug: alg1-u01-w03-q22
      type: short_answer
      topic_code: "1.12"
      source: "IM Algebra 1, Unit 1, Lesson 12"
      points: 3
      prompt: |
        Five plants were measured one month after planting; their heights in centimetres are 10, 12, 13, 15, 20.

        (a) Compute the mean and list the deviation of each height from the mean.
        (b) Compute the variance and the standard deviation (divide by n), showing the squared deviations.
        (c) Interpret the standard deviation in a sentence about the plants.
      answer: |
        (a) Mean = 70/5 = 14. Deviations: −4, −2, −1, 1, 6.
        (b) Squared deviations: 16, 4, 1, 1, 36, sum 58. Variance = 58/5 = 11.6. SD = √11.6 ≈ 3.41 cm.
        (c) A typical plant's height is about 3.4 cm away from the mean height of 14 cm.
      explanation: |
        Three points, one per part.

        (a) 1 pt: mean 14 and all five deviations with correct signs.

        (b) 1 pt: squares, sum 58, variance 11.6 and SD ≈ 3.41 (accept 3.4). Reporting the variance as the SD loses the point.

        (c) 1 pt: an interpretation as a typical distance from the mean in centimetres, not merely "the spread is 3.41".

    - slug: alg1-u01-w03-q23
      type: short_answer
      topic_code: "1.11"
      source: "IM Algebra 1, Unit 1, Lesson 11"
      points: 3
      prompt: |
        A bakery recorded the number of loaves sold on each of 30 days. A dot plot shows most days between 40 and 60 loaves, a single peak near 50, and three days (a festival weekend) at 150, 160 and 175 loaves.

        (a) Would you report the mean or the median as the typical daily sales? Justify from the shape.
        (b) Would you report the standard deviation or the IQR as the spread? Justify.
        (c) The owner wants to know how many loaves to bake on an ordinary day. Explain why the summary you chose in (a) answers that question better than the other one.
      answer: |
        (a) The median. The three festival days make the distribution skewed right with extreme values, and the median is resistant to them.
        (b) The IQR, for the same reason: the standard deviation would be inflated by the three days far above the mean, while the IQR describes the spread of the middle half of ordinary days.
        (c) The mean would be pulled up by the festival sales (each of those days adds over 100 loaves above a normal day to the total), so it would overstate ordinary demand and lead to baking too much on normal days. The median sits among the ordinary days and reflects what usually sells.
      explanation: |
        Three points, one per part.

        (a) 1 pt: median, justified by skew or extreme values.

        (b) 1 pt: IQR, justified by resistance to the extreme values.

        (c) 1 pt: explains that the mean overstates an ordinary day because the festival days inflate it, linked to the owner's decision.

    - slug: alg1-u01-w03-q24
      type: long_answer
      topic_code: "1.10"
      source: "IM Algebra 1, Unit 1, Lesson 10"
      points: 6
      prompt: |
        A data set of seven test scores is 60, 64, 66, 70, 72, 74, 78.

        Part 1: compute the mean, median, IQR and standard deviation (divide by n; round the SD to two decimal places).

        Part 2: the score 78 was a typing mistake and should have been 98. Recompute all four statistics with 98 in place of 78.

        Part 3: write a paragraph explaining which statistics changed, by how much, and why the median and IQR behaved differently from the mean and standard deviation. Finish by stating which pair of statistics you would report for the corrected data and why.
      answer: |
        Part 1: sum 484, mean ≈ 69.14; median 70; Q1 = 64, Q3 = 74, IQR = 10; deviations from 69.14 are −9.14, −5.14, −3.14, 0.86, 2.86, 4.86, 8.86, squares ≈ 83.6, 26.4, 9.9, 0.7, 8.2, 23.6, 78.4, sum ≈ 230.9, variance ≈ 32.98, SD ≈ 5.74.
        Part 2: sum 504, mean = 72; median still 70; Q1 = 64, Q3 = 74, IQR still 10; deviations −12, −8, −6, −2, 0, 2, 26, squares 144, 64, 36, 4, 0, 4, 676, sum 928, variance ≈ 132.57, SD ≈ 11.51.
        Part 3: the mean rose by about 2.9 points and the SD doubled from about 5.7 to about 11.5, while the median and IQR did not change at all. The median depends only on the middle position and the quartiles only on the positions a quarter of the way in; replacing the largest value with a larger one leaves every position the same. The mean and SD use the size of every value, so a value 20 points higher raises the total and creates a large squared deviation. With 98 now an extreme value the distribution is skewed right, so I would report the median (70) and IQR (10), which describe the typical student without being distorted by the one very high score.
      explanation: |
        Six points.

        Part 1 (2 pts): 1 pt for mean ≈ 69.1 and median 70; 1 pt for IQR 10 and SD ≈ 5.74 (accept 5.7 to 5.8).

        Part 2 (2 pts): 1 pt for mean 72 with median and IQR unchanged; 1 pt for SD ≈ 11.5 (accept 11.4 to 11.6).

        Part 3 (2 pts): 1 pt for correctly identifying what changed and explaining resistance in terms of position versus size of values; 1 pt for choosing the median and IQR with a reason tied to the new extreme value.

        Common errors: recomputing the median as if it should change; forgetting the square root; choosing mean and SD "because they use all the data" without addressing the extreme value.
