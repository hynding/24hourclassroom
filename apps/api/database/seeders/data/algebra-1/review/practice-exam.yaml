      (b) 1 pt: 5 and −1, by taking roots or by factoring.

      (c) 1 pt: x² − 4x − 5, (x − 5)(x + 1) and −5.

      Common errors: vertex (−2, −9); x-intercepts ±3; expanding (x − 2)² as x² − 4 or x² + 4.

  # ---- Unit 7 · Set G: one equation three ways (7.10, 7.16, 7.20)
  - slug: alg1-final-q60
    type: multiple_choice
    topic_code: "7.10"
    source: "IM Algebra 1, Unit 7, Lesson 10"
    points: 1
    stimulus: |
      Consider the equation 2x² − 3x − 9 = 0.
    prompt: |
      Which is the factored form of the left side, and what are the solutions?
    options:
      - "(2x + 3)(x − 3) = 0; x = 3 or x = −3/2"
      - "(2x − 3)(x + 3) = 0; x = 3/2 or x = −3"
      - "(2x − 9)(x + 1) = 0; x = 9/2 or x = −1"
      - "(x + 3)(x − 3) = 0; x = 3 or x = −3"
    option_explanations:
      - |
        Correct. (2x + 3)(x − 3) = 2x² − 6x + 3x − 9 = 2x² − 3x − 9; the factors are zero at x = −3/2 and x = 3.
      - |
        (2x − 3)(x + 3) = 2x² + 6x − 3x − 9 = 2x² + 3x − 9, the wrong sign on the middle term.
      - |
        (2x − 9)(x + 1) = 2x² + 2x − 9x − 9 = 2x² − 7x − 9, not −3x.
      - |
        (x + 3)(x − 3) = x² − 9 has no 2x² and no x term.
    answer: 0

  - slug: alg1-final-q61
    type: multiple_choice
    topic_code: "7.16"
    source: "IM Algebra 1, Unit 7, Lesson 16"
    points: 1
    stimulus: |
      Consider the equation 2x² − 3x − 9 = 0.
    prompt: |
      Which shows the quadratic formula applied correctly to this equation?
    options:
      - "x = (3 ± √(9 + 72))/4 = (3 ± 9)/4, so x = 3 or x = −3/2"
      - "x = (−3 ± √(9 + 72))/4 = (−3 ± 9)/4, so x = 3/2 or x = −3"
      - "x = (3 ± √(9 − 72))/4, so there are no real solutions"
      - "x = (3 ± √(9 + 72))/2 = (3 ± 9)/2, so x = 6 or x = −3"
    option_explanations:
      - |
        Correct. a = 2, b = −3, c = −9: −b = 3, b² − 4ac = 9 − 4(2)(−9) = 9 + 72 = 81, 2a = 4. (3 + 9)/4 = 3 and (3 − 9)/4 = −3/2, matching the factored form.
      - |
        b = −3, so −b = +3; this uses the sign of b instead of −b.
      - |
        c = −9, so −4ac = −4(2)(−9) = +72, not −72; the discriminant is 81.
      - |
        The denominator is 2a = 4, not 2; dividing by 2 doubles both solutions.
    answer: 0

