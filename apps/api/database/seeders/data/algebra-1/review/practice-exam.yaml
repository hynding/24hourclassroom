    source: "IM Algebra 1, Unit 5, Lesson 19"
    points: 8
    prompt: |
      Town A has 10,000 people and grows by 5% each year. Town B has 12,000 people and grows by 500 people each year.

      (1) Write a function for each town's population t years from now, and say which is linear and which is exponential.
      (2) Make a table of both populations at t = 0, 5 and 10, rounded to the nearest person.
      (3) Find the first whole number of years after which town A's population is larger than town B's, showing the values that prove it.
      (4) Explain, in terms of how each population changes from one year to the next, why town A was certain to overtake town B eventually.
    answer: |
      (1) A(t) = 10,000 · (1.05)ᵗ, exponential (a constant factor of 1.05). B(t) = 12,000 + 500t, linear (a constant difference of 500).
      (2) t = 0: A 10,000, B 12,000. t = 5: A ≈ 10,000 · 1.2763 ≈ 12,763, B = 14,500. t = 10: A ≈ 10,000 · 1.6289 ≈ 16,289, B = 17,000.
      (3) At t = 12: A ≈ 10,000 · 1.7959 ≈ 17,959 and B = 18,000, so B is still ahead. At t = 13: A ≈ 10,000 · 1.8856 ≈ 18,856 and B = 18,500. Town A is larger after 13 years.
      (4) Town B adds the same 500 people every year. Town A adds 5% of its current population: 500 in the first year, 525 in the second, 551 in the third, and more each year, because 5% of a growing number grows. Once town A's yearly increase passes 500 (which happens immediately) it gains on town B every year, so the 2,000-person gap must close, and after that A pulls away.
    explanation: |
      Eight points, two per part.

      (1) 2 pts: 1 for both functions, 1 for the linear/exponential labels with a reason.

      (2) 2 pts: 1 for A's three values (within rounding), 1 for B's.

      (3) 2 pts: 1 for the answer 13 years, 1 for showing t = 12 (B ahead) and t = 13 (A ahead).

      (4) 2 pts: 1 for constant difference versus constant factor, 1 for the observation that A's increases grow past B's fixed 500.

      Common errors: A(t) = 10,000 · 0.05ᵗ or 10,000 + 500t; rounding 1.05¹³ before multiplying; reading the table at t = 10 and answering "never" because B is still ahead there.

