week: 34
description: |
  A full-length practice final for Algebra 1: 70 questions, about 2 hours 30 minutes, covering all seven units
  in course order. Each unit's share follows its weight in the course map: Unit 1 One-variable Statistics (7
  questions), Unit 2 Linear Equations, Inequalities, and Systems (16), Unit 3 Two-variable Statistics (6), Unit 4
  Functions (10), Unit 5 Introduction to Exponential Functions (11), Unit 6 Introduction to Quadratic Functions
  (9) and Unit 7 Quadratic Equations (11). Seven stimulus sets share a data set, a situation, a function or an
  equation across three consecutive questions. Multiple choice, true/false and numeric items are worth 1 point
  and graded at once; select-all items are worth 2 points with partial credit; fill-in-the-blank items (1 point)
  are matched automatically; the three short answers (3 points each, parts (a), (b), (c)) and the two long
  answers (8 points each, four numbered parts) are graded by your teacher against the scoring notes attached to
  each. The paper is out of 100 points. Sit it in one block if you can: about two minutes per one-point item,
  four for a select-all, six for a short answer and twelve for a long answer, which leaves a few minutes to
  check. Numeric answers that ask for decimals are marked with a small tolerance; exact answers are marked exactly.
questions:
  # ======================================================================
  # Unit 1 (7): q01-q07 · Unit 2 (16): q08-q23 · Unit 3 (6): q24-q29
  # Unit 4 (10): q30-q39 · Unit 5 (11): q40-q50 · Unit 6 (9): q51-q59
  # Unit 7 (11): q60-q70
  # ======================================================================
  # ---- Unit 1 · Set A: books read over the summer (1.5, 1.14, 1.10)
  - slug: alg1-final-q01
    type: multiple_choice
    topic_code: "1.5"
    source: "IM Algebra 1, Unit 1, Lesson 5"
    points: 1
    stimulus: |
      Eleven students reported how many books they read over the summer: 2, 3, 3, 4, 5, 5, 6, 7, 8, 9, 20.
    prompt: |
      What are the median and the interquartile range of the data?
    options:
      - "Median 5, IQR 5"
      - "Median 6, IQR 5"
      - "Median 5, IQR 18"
      - "Median 6.5, IQR 6"
    option_explanations:
      - |
        Correct. With 11 values the median is the 6th, 5. Q1 is the median of the lower five (2, 3, 3, 4, 5), which is 3; Q3 is the median of the upper five (6, 7, 8, 9, 20), which is 8; IQR = 8 − 3 = 5.
      - |
        6 is the 7th value; the middle of 11 ordered values is the 6th, which is 5.
      - |
        18 is the range (20 − 2), not the interquartile range Q3 − Q1 = 8 − 3 = 5.
      - |
        6.5 is close to the mean (72/11 ≈ 6.55), not the median; the median of an odd-sized list is a value in the list.
    answer: 0

  - slug: alg1-final-q02
    type: multiple_choice
    topic_code: "1.14"
    source: "IM Algebra 1, Unit 1, Lesson 14"
    points: 1
    stimulus: |
      Eleven students reported how many books they read over the summer: 2, 3, 3, 4, 5, 5, 6, 7, 8, 9, 20.
    prompt: |
      Using the 1.5 × IQR rule, is 20 an outlier?
    options:
      - "Yes: the upper fence is 8 + 1.5 · 5 = 15.5, and 20 is above it."
      - "No: the upper fence is 8 + 5 = 13 and 20 is only 7 above it."
      - "No: a value is an outlier only if it is more than twice the mean."
      - "Yes: any value more than 10 above the median is an outlier."
    option_explanations:
      - |
        Correct. Q3 = 8 and IQR = 5, so the fence is Q3 + 1.5 · IQR = 15.5; 20 > 15.5 makes it an outlier. The lower fence 3 − 7.5 = −4.5 catches nothing.
      - |
        The fence adds 1.5 times the IQR, 7.5, to Q3, giving 15.5; and being above the fence by any amount makes a value an outlier.
      - |
        The rule is not based on the mean; it uses the quartiles and the IQR.
      - |
        The rule is not "10 above the median"; the fence is Q3 + 1.5 · IQR = 15.5 here, and the conclusion happens to agree.
    answer: 0

  - slug: alg1-final-q03
    type: multiple_choice
    topic_code: "1.10"
    source: "IM Algebra 1, Unit 1, Lesson 10"
    points: 1
    stimulus: |
      Eleven students reported how many books they read over the summer: 2, 3, 3, 4, 5, 5, 6, 7, 8, 9, 20.
    prompt: |
      If the value 20 is removed, how do the mean and the median change?
    options:
      - "The mean drops from about 6.55 to 5.2; the median stays at 5."
      - "The mean stays at about 6.55; the median drops from 5 to 4."
      - "Both drop by the same amount, about 1.35."
      - "The median drops from 5 to 4.5; the mean is unchanged."
    option_explanations:
      - |
        Correct. The sum falls from 72 to 52 over 10 values, so the mean falls from 6.55 to 5.2. The median of the remaining ten (the average of the 5th and 6th values, 5 and 5) is still 5. An extreme value pulls the mean, not the median.
      - |
        Removing the largest value must lower the mean; and the middle of 2, 3, 3, 4, 5, 5, 6, 7, 8, 9 is (5 + 5)/2 = 5.
      - |
        The median is unchanged at 5; only the mean moves, by about 1.35.
      - |
        The 5th and 6th values of the remaining ten are both 5, so the median is 5; the mean falls to 5.2.
    answer: 0

  - slug: alg1-final-q04
    type: multiple_choice
    topic_code: "1.4"
    source: "IM Algebra 1, Unit 1, Lesson 4"
    points: 1
    prompt: |
      A dot plot of house prices in a town has most dots bunched between $150,000 and $250,000 and a thin tail of dots stretching out to $900,000. Which description is correct, and which measure of center best represents a typical price?
    options:
      - "Skewed right; the median, because the tail pulls the mean upward."
      - "Skewed left; the mean, because it uses every value."
      - "Symmetric; either the mean or the median."
      - "Skewed right; the mean, because the tail contains real houses."
    option_explanations:
      - |
        Correct. A tail toward the high values is a right skew; a few very expensive houses raise the mean well above where most prices lie, so the median is the better summary of a typical price.
      - |
        The tail stretches toward the higher prices, which is a right skew, and the mean is pulled toward that tail.
      - |
        A long tail on one side is a skew, not symmetry; the mean and median would differ.
      - |
        The expensive houses are real, but they make the mean unrepresentative of the typical house; the median resists them.
    answer: 0

  - slug: alg1-final-q05
    type: multi_select
    topic_code: "1.15"
    source: "IM Algebra 1, Unit 1, Lesson 15"
    points: 2
    partial_credit: true
    prompt: |
      Two classes took the same test. Class A: mean 72, median 75, standard deviation 8. Class B: mean 72, median 68, standard deviation 15. Which statements are supported? Select all that apply.
    options:
      - "Class A's scores are more spread out than class B's."
      - "The two classes have the same mean score."
      - "Class A's distribution is likely skewed left."
      - "Class B's distribution is likely skewed right."
      - "Half of class B scored above 72."
    option_explanations:
      - |
        A standard deviation of 8 is smaller than 15, so class A's scores are less spread out, not more.
      - |
        Correct. Both means are 72; the classes differ in shape and spread, not in mean.
      - |
        Correct. A mean below the median (72 < 75) is the signature of a tail toward the low scores, a left skew.
      - |
        Correct. A mean above the median (72 > 68) points to a tail toward the high scores, a right skew.
      - |
        Half scored above the median, 68, not above the mean; with a right skew, fewer than half are above 72.
    answer: [1, 2, 3]

  - slug: alg1-final-q06
    type: numeric
    topic_code: "1.12"
    source: "IM Algebra 1, Unit 1, Lesson 12"
    points: 1
    prompt: |
      Find the standard deviation of 1, 3, 5, 7, 9 (dividing by n), to two decimal places.
    answer: { value: 2.83, tolerance: 0.01 }
    explanation: |
      The mean is 5. The squared deviations are 16, 4, 0, 4, 16, which sum to 40; 40/5 = 8 and √8 ≈ 2.83.

  - slug: alg1-final-q07
    type: true_false
    topic_code: "1.6"
    source: "IM Algebra 1, Unit 1, Lesson 6"
    points: 1
    prompt: |
      True or false: adding 10 to every value in a data set adds 10 to the mean and leaves the standard deviation unchanged.
    answer: true
    explanation: |
      True. Every value, and so the mean, moves up by 10, but each value's distance from the mean is exactly what it was, so the standard deviation (and the IQR and range) do not change.

  # ---- Unit 2: writing, solving, rewriting (2.2, 2.4, 2.7, 2.9)
  - slug: alg1-final-q08
    type: multiple_choice
    topic_code: "2.2"
    source: "IM Algebra 1, Unit 2, Lesson 2"
    points: 1
    prompt: |
      A gym charges $25 to join and $12 a month. Which equation gives the total cost C, in dollars, after m months?
    options:
      - "C = 25 + 12m"
      - "C = 12 + 25m"
      - "C = 37m"
      - "C = 25m + 12"
    option_explanations:
      - |
        Correct. The one-time $25 is the starting value and $12 is added for each of the m months.
      - |
        This charges $25 every month and $12 once; the joining fee is paid once and the monthly fee repeats.
      - |
        37m charges both fees every month; after 2 months it gives $74 instead of 25 + 24 = $49.
      - |
        25m + 12 treats the joining fee as monthly; it swaps the roles of the two amounts.
    answer: 0

  - slug: alg1-final-q09
    type: multiple_choice
    topic_code: "2.4"
    source: "IM Algebra 1, Unit 2, Lesson 4"
    points: 1
    prompt: |
      Which ordered pair is a solution of 3x − 2y = 12?
    options:
      - "(4, 0)"
      - "(0, 6)"
      - "(2, 3)"
      - "(6, −3)"
    option_explanations:
      - |
        Correct. 3 · 4 − 2 · 0 = 12, so (4, 0) makes the equation true; it is the x-intercept.
      - |
        3 · 0 − 2 · 6 = −12, not 12; the y-intercept is (0, −6).
      - |
        3 · 2 − 2 · 3 = 6 − 6 = 0, not 12; (2, 3) lies on 3x − 2y = 0 instead.
      - |
        3 · 6 − 2 · (−3) = 18 + 6 = 24, not 12; subtracting a negative adds.
    answer: 0

  - slug: alg1-final-q10
    type: multiple_choice
    topic_code: "2.7"
    source: "IM Algebra 1, Unit 2, Lesson 7"
    points: 1
    prompt: |
      Solving 4(x − 3) = 20, a student went from 4(x − 3) = 20 to x − 3 = 5 in one step. Which statement explains why the new equation has the same solution?
    options:
      - "Both sides were divided by 4, and dividing both sides by the same non-zero number keeps the solutions."
      - "The 4 was subtracted from both sides, and subtracting the same number keeps the solutions."
      - "The distributive property was applied to the left side."
      - "The step is not valid; the student should have expanded to 4x − 12 = 20 first."
    option_explanations:
      - |
        Correct. 4(x − 3)/4 = x − 3 and 20/4 = 5; any number that made the first equation true makes the second true, and the step can be undone by multiplying by 4.
      - |
        Subtracting 4 from 4(x − 3) does not give x − 3; the 4 multiplies the bracket, so the inverse is division.
      - |
        The distributive property would give 4x − 12 = 20, not x − 3 = 5.
      - |
        Expanding first is also valid, but it is not required; dividing by 4 is a legitimate move that keeps the solution x = 8.
    answer: 0

  - slug: alg1-final-q11
    type: multiple_choice
    topic_code: "2.9"
    source: "IM Algebra 1, Unit 2, Lesson 9"
    points: 1
    prompt: |
      The perimeter of a rectangle is P = 2l + 2w. Which equation gives the width in terms of the perimeter and the length?
    options:
      - "w = (P − 2l)/2"
      - "w = P − 2l"
      - "w = P/2 − l/2"
      - "w = (P + 2l)/2"
    option_explanations:
      - |
        Correct. Subtract 2l from both sides, then divide by 2: w = (P − 2l)/2, which is also P/2 − l. With P = 30 and l = 10 it gives w = 5.
      - |
        After subtracting 2l the width is still multiplied by 2; P − 2l is twice the width.
      - |
        Dividing P − 2l by 2 gives P/2 − l, not P/2 − l/2; the 2 in 2l cancels fully.
      - |
        2l must be subtracted from P, not added; adding it makes the width larger than half the perimeter.
    answer: 0

  # ---- Unit 2 · Set B: apples and pears (2.12, 2.14, 2.10)
  - slug: alg1-final-q12
    type: multiple_choice
    topic_code: "2.12"
    source: "IM Algebra 1, Unit 2, Lesson 12"
    points: 1
    stimulus: |
      A fruit stand sells apples at $2 a pound and pears at $3 a pound. On Saturday it sold 50 pounds of fruit for $120. Let a be the pounds of apples and p the pounds of pears.
    prompt: |
      Which system represents the situation?
    options:
      - "a + p = 50 and 2a + 3p = 120"
      - "a + p = 120 and 2a + 3p = 50"
      - "2a + 3p = 50 and a + p = 120"
      - "a + p = 50 and 3a + 2p = 120"
    option_explanations:
      - |
        Correct. The pounds add to 50 and the money, $2 per pound of apples plus $3 per pound of pears, adds to $120.
      - |
        The numbers are swapped: 50 is the total weight and 120 the total money.
      - |
        The prices belong with the $120 total, not with the 50 pounds; this swaps the right-hand sides.
      - |
        Apples are $2 a pound, so the money equation needs 2a, not 3a.
    answer: 0

  - slug: alg1-final-q13
    type: multiple_choice
    topic_code: "2.14"
    source: "IM Algebra 1, Unit 2, Lesson 14"
    points: 1
    stimulus: |
      A fruit stand sells apples at $2 a pound and pears at $3 a pound. On Saturday it sold 50 pounds of fruit for $120. Let a be the pounds of apples and p the pounds of pears.
    prompt: |
      How many pounds of each were sold?
    options:
      - "30 pounds of apples and 20 pounds of pears"
      - "20 pounds of apples and 30 pounds of pears"
      - "40 pounds of apples and 10 pounds of pears"
      - "25 pounds of apples and 25 pounds of pears"
    option_explanations:
      - |
        Correct. Multiply a + p = 50 by 2 and subtract from 2a + 3p = 120: p = 20, so a = 30. Check: 60 + 60 = 120.
      - |
        20 apples and 30 pears weigh 50 pounds but bring in 40 + 90 = $130, not $120.
      - |
        40 and 10 weigh 50 pounds but bring in 80 + 30 = $110.
      - |
        25 and 25 bring in 50 + 75 = $125, five dollars too many.
    answer: 0

  - slug: alg1-final-q14
    type: multiple_choice
    topic_code: "2.10"
    source: "IM Algebra 1, Unit 2, Lesson 10"
    points: 1
    stimulus: |
      A fruit stand sells apples at $2 a pound and pears at $3 a pound. On Saturday it sold 50 pounds of fruit for $120. Let a be the pounds of apples and p the pounds of pears.
    prompt: |
      The graph of 2a + 3p = 120 is drawn with a on the horizontal axis. What are its intercepts, and what does the a-intercept mean?
    options:
      - "a-intercept 60, p-intercept 40; selling only apples, 60 pounds bring in $120."
      - "a-intercept 40, p-intercept 60; selling only apples, 40 pounds bring in $120."
      - "a-intercept 120, p-intercept 120; the stand sold $120 of each fruit."
      - "a-intercept 50, p-intercept 50; the stand sold 50 pounds in all."
    option_explanations:
      - |
        Correct. With p = 0, 2a = 120 gives a = 60; with a = 0, 3p = 120 gives p = 40. The a-intercept is the all-apples way to reach $120.
      - |
        The intercepts are swapped: 120/2 = 60 pounds of apples alone, 120/3 = 40 pounds of pears alone.
      - |
        The intercepts come from dividing 120 by each price, not from 120 itself.
      - |
        50 and 50 are the intercepts of the other equation, a + p = 50, not of the money equation.
    answer: 0

  # ---- Unit 2: systems, inequalities (2.17, 2.19, 2.22, 2.24, 2.6, 2.20, 2.15, 2.11, 2.13, 2.16)
  - slug: alg1-final-q15
    type: multiple_choice
    topic_code: "2.17"
    source: "IM Algebra 1, Unit 2, Lesson 17"
    points: 1
    prompt: |
      How many solutions does the system 2x + y = 5, 4x + 2y = 7 have?
    options:
      - "None: the second equation is 2x + y = 3.5, a line parallel to the first."
      - "Exactly one, found by elimination."
      - "Infinitely many: the second equation is twice the first."
      - "Exactly two, one for each equation."
    option_explanations:
      - |
        Correct. Dividing the second equation by 2 gives 2x + y = 3.5. The same expression cannot equal both 5 and 3.5, so the lines are parallel and never meet.
      - |
        Elimination (doubling the first and subtracting) gives 0 = 3, a false statement, which means no solution.
      - |
        Twice the first equation is 4x + 2y = 10, not 7; the lines have the same slope but different intercepts.
      - |
        A solution is a point on both lines; a system of two lines has none, one or infinitely many solutions, never two.
    answer: 0

  - slug: alg1-final-q16
    type: multiple_choice
    topic_code: "2.19"
    source: "IM Algebra 1, Unit 2, Lesson 19"
    points: 1
    prompt: |
      What is the solution set of −3x + 4 > 13?
    options:
      - "x < −3"
      - "x > −3"
      - "x < 3"
      - "x > −17/3"
    option_explanations:
      - |
        Correct. −3x > 9; dividing by −3 reverses the inequality: x < −3. Check x = −4: 12 + 4 = 16 > 13.
      - |
        Dividing by a negative number reverses the inequality; x > −3 fails at x = 0, where 4 > 13 is false.
      - |
        −3x > 9 gives x < −3, not x < 3; the sign of 9/(−3) is negative.
      - |
        This comes from adding 4 instead of subtracting it; the step is −3x > 13 − 4 = 9.
    answer: 0

  - slug: alg1-final-q17
    type: multiple_choice
    topic_code: "2.22"
    source: "IM Algebra 1, Unit 2, Lesson 22"
    points: 1
    prompt: |
      Which describes the graph of y ≤ 2x − 1?
    options:
      - "A solid line through (0, −1) with slope 2, shaded on the side not containing (0, 0)."
      - "A dashed line through (0, −1) with slope 2, shaded on the side containing (0, 0)."
      - "A solid line through (0, −1) with slope 2, shaded on the side containing (0, 0)."
      - "A solid line through (0, 1) with slope −2, shaded below."
    option_explanations:
      - |
        Correct. ≤ includes the boundary, so the line is solid. Testing (0, 0): 0 ≤ −1 is false, so the shaded region is the other side (below and to the right of the line).
      - |
        ≤ includes the boundary, so the line is solid, and (0, 0) does not satisfy the inequality.
      - |
        (0, 0) gives 0 ≤ −1, which is false, so the origin's side is not shaded.
      - |
        The line y = 2x − 1 has intercept −1 and slope 2, not intercept 1 and slope −2.
    answer: 0

  - slug: alg1-final-q18
    type: multiple_choice
    topic_code: "2.24"
    source: "IM Algebra 1, Unit 2, Lesson 24"
    points: 1
    prompt: |
      Which point is a solution of the system x + y ≤ 6 and y > 2x?
    options:
      - "(1, 4)"
      - "(3, 3)"
      - "(0, 7)"
      - "(2, 4)"
    option_explanations:
      - |
        Correct. 1 + 4 = 5 ≤ 6 and 4 > 2 · 1 = 2; both inequalities hold.
      - |
        3 + 3 = 6 ≤ 6 holds, but 3 > 6 is false.
      - |
        0 + 7 = 7 is not ≤ 6, so the first inequality fails (the second holds).
      - |
        2 + 4 = 6 ≤ 6 holds, but y > 2x needs 4 > 4, which is false; the boundary is excluded.
    answer: 0

  - slug: alg1-final-q19
    type: multi_select
    topic_code: "2.6"
    source: "IM Algebra 1, Unit 2, Lesson 6"
    points: 2
    partial_credit: true
    prompt: |
      Which equations are equivalent to 2x + 6 = 14 (that is, have exactly the same solution)? Select all that apply.
    options:
      - "x + 3 = 7"
      - "2x = 8"
      - "2x = 20"
      - "x = 4"
      - "2x + 6 − 6 = 14"
    option_explanations:
      - |
        Correct. Dividing both sides by 2 gives x + 3 = 7, whose solution is 4, the same as the original.
      - |
        Correct. Subtracting 6 from both sides gives 2x = 8; the solution is still 4.
      - |
        2x = 20 comes from adding 6 to the right side only; its solution is 10, not 4.
      - |
        Correct. x = 4 is the solution of the original, and an equation with the same solution is equivalent to it.
      - |
        Subtracting 6 from one side only gives 2x = 14, whose solution is 7, not 4.
    answer: [0, 1, 3]

  - slug: alg1-final-q20
    type: multi_select
    topic_code: "2.20"
    source: "IM Algebra 1, Unit 2, Lesson 20"
    points: 2
    partial_credit: true
    prompt: |
      A taxi charges $3 plus $2 per mile. Priya has $15. Let m be the number of miles she can ride. Which statements are correct? Select all that apply.
    options:
      - "The situation is modelled by 3 + 2m ≤ 15."
      - "Priya can ride at most 6 miles."
      - "Priya can ride 7 miles."
      - "The solution is 0 ≤ m ≤ 6."
      - "The solution is m < 6."
    option_explanations:
      - |
        Correct. The cost 3 + 2m must not exceed the $15 she has.
      - |
        Correct. 2m ≤ 12 gives m ≤ 6; a 6-mile ride costs exactly $15.
      - |
        7 miles would cost 3 + 14 = $17, more than she has.
      - |
        Correct. m ≤ 6 from the inequality, and m cannot be negative, so 0 ≤ m ≤ 6.
      - |
        m = 6 is allowed, since a $15 ride is affordable; the inequality is ≤, not <.
    answer: [0, 1, 3]

  - slug: alg1-final-q21
    type: true_false
    topic_code: "2.15"
    source: "IM Algebra 1, Unit 2, Lesson 15"
    points: 1
    prompt: |
      True or false: multiplying one equation of a system by 3 changes the solution of the system.
    answer: false
    explanation: |
      False. Multiplying both sides of an equation by 3 produces an equivalent equation with the same solutions, so the system's solution is unchanged. That is why elimination may scale an equation before adding.

  - slug: alg1-final-q22
    type: fill_blank
    topic_code: "2.11"
    source: "IM Algebra 1, Unit 2, Lesson 11"
    points: 1
    prompt: |
      The slope of the graph of 3x + 4y = 12 is ____.
    answer: ["-3/4", "−3/4", "-0.75", "−0.75"]
    explanation: |
      Solve for y: 4y = −3x + 12, so y = −(3/4)x + 3. The slope is −3/4, which is also −A/B for Ax + By = C.

  - slug: alg1-final-q23
    type: short_answer
    topic_code: "2.13"
    source: "IM Algebra 1, Unit 2, Lesson 13"
    points: 3
    prompt: |
      A theater sold 300 tickets for a show. Adult tickets cost $9 and student tickets cost $5, and the sales came to $2,100.

      (a) Write a system of two equations for the numbers of adult tickets a and student tickets s.
      (b) Solve the system by substitution, showing your steps.
      (c) Check your answer in both equations and state it in a sentence.
    answer: |
      (a) a + s = 300 and 9a + 5s = 2100.
      (b) From the first, s = 300 − a. Substitute: 9a + 5(300 − a) = 2100, so 9a + 1500 − 5a = 2100, 4a = 600, a = 150; then s = 150.
      (c) 150 + 150 = 300 and 9 · 150 + 5 · 150 = 1350 + 750 = 2100. The theater sold 150 adult tickets and 150 student tickets.
    explanation: |
      Three points, one per part.

      (a) 1 pt: both equations with the variables defined.

      (b) 1 pt: a correct substitution and a = 150, s = 150 (elimination earns the point too, if the prompt's method is not required by the teacher).

      (c) 1 pt: both checks shown and the answer stated in context.

      Common errors: 9a + 5s = 300; distributing 5 over only the 300; stopping at a = 150 without s.

  # ---- Unit 3 · Set C: sports and part-time jobs (3.2, 3.3, 3.1)
  - slug: alg1-final-q24
    type: multiple_choice
    topic_code: "3.2"
    source: "IM Algebra 1, Unit 3, Lesson 2"
    points: 1
    stimulus: |
      A survey of 200 students asked whether they play a school sport and whether they have a part-time job. Of the 120 who play a sport, 80 have a job. Of the 80 who do not play a sport, 30 have a job.
    prompt: |
      What percentage of the students who play a sport have a job, and what percentage of the students who do not play a sport have a job?
    options:
      - "About 67% and 37.5%"
      - "40% and 15%"
      - "About 73% and 27%"
      - "60% and 40%"
    option_explanations:
      - |
        Correct. Row relative frequencies: 80/120 ≈ 0.667 for sport players and 30/80 = 0.375 for non-players.
      - |
        40% and 15% are 80/200 and 30/200, shares of all students; the question asks for a share of each row.
      - |
