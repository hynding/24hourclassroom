  - slug: alg1-final-q70
    type: long_answer
    topic_code: "7.24"
    source: "IM Algebra 1, Unit 7, Lesson 24"
    points: 8
    prompt: |
      A rectangular pool is 10 meters by 16 meters. A paved path of uniform width w meters is built all the way around it, and the pool and path together cover 280 square meters.

      (1) Write an equation for w and rewrite it in the form w² + bw + c = 0.
      (2) Solve the equation by factoring.
      (3) Explain which solution is the width of the path and why the other is rejected, and check your answer against the 280 square meters.
      (4) Suppose instead that the pool and path cover 300 square meters. Use the quadratic formula to find the width of the path, to two decimal places.
    answer: |
      (1) The outer rectangle is (10 + 2w) by (16 + 2w), so (10 + 2w)(16 + 2w) = 280. Expanding: 160 + 20w + 32w + 4w² = 280, so 4w² + 52w − 120 = 0, and dividing by 4: w² + 13w − 30 = 0.
      (2) Two numbers with product −30 and sum 13 are 15 and −2: (w + 15)(w − 2) = 0, so w = −15 or w = 2.
      (3) The path is 2 meters wide. w = −15 is rejected because a width cannot be negative. Check: (10 + 4)(16 + 4) = 14 · 20 = 280.
      (4) (10 + 2w)(16 + 2w) = 300 gives 4w² + 52w − 140 = 0, or w² + 13w − 35 = 0. w = (−13 ± √(169 + 140))/2 = (−13 ± √309)/2. √309 ≈ 17.58, so w ≈ (−13 + 17.58)/2 ≈ 2.29 meters (the other root is negative). Check: 14.58 · 20.58 ≈ 300.
    explanation: |
      Eight points, two per part.

      (1) 2 pts: 1 for (10 + 2w)(16 + 2w) = 280 (each side gains 2w, one w per edge), 1 for w² + 13w − 30 = 0.

      (2) 2 pts: 1 for (w + 15)(w − 2), 1 for both solutions.

      (3) 2 pts: 1 for choosing w = 2 and rejecting −15 with a reason, 1 for the check.

      (4) 2 pts: 1 for w² + 13w − 35 = 0 with the formula set up correctly (a = 1, b = 13, c = −35), 1 for w ≈ 2.29.

      Common errors: (10 + w)(16 + w), adding the path on one side only; forgetting to subtract 280 before factoring; keeping w = −15; using c = +35 or dividing by 1 incorrectly in part (4).
