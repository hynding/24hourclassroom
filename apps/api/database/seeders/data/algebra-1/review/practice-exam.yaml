  - slug: alg1-final-q39
    type: short_answer
    topic_code: "4.17"
    source: "IM Algebra 1, Unit 4, Lesson 17"
    points: 3
    prompt: |
      A car rental costs C(m) = 40 + 0.25m dollars for a day in which the car is driven m miles.

      (a) Find C(200) and say what it means.
      (b) Find the inverse function and say what its input and output are.
      (c) Use the inverse to find how many miles were driven on a day that cost $115.
    answer: |
      (a) C(200) = 40 + 50 = 90: driving 200 miles costs $90.
      (b) From C = 40 + 0.25m, m = (C − 40)/0.25 = 4(C − 40). The inverse takes a cost in dollars and gives the miles driven.
      (c) m = 4(115 − 40) = 4 · 75 = 300 miles. Check: 40 + 0.25 · 300 = 115.
    explanation: |
      Three points, one per part.

      (a) 1 pt: $90 with its meaning.

      (b) 1 pt: m = 4(C − 40) or (C − 40)/0.25, with input and output named.

      (c) 1 pt: 300 miles, found from the inverse.

      Common errors: dividing by 0.25 before subtracting 40; writing 1/C(m) as the inverse; solving the original equation in (c) instead of using the inverse (full credit if the answer is right and an inverse was given in (b)).

