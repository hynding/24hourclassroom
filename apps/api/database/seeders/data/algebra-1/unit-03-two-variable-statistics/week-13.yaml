    - slug: alg1-u03-w13-q25
      type: long_answer
      topic_code: "3.6"
      source: "IM Algebra 1, Unit 3, Lesson 6"
      points: 6
      prompt: |
        A café records the outdoor temperature x (°C) and the number of iced drinks sold y on five days: (10, 14), (15, 22), (20, 34), (25, 40), (30, 55). The least-squares line is y = 2x − 7.

        (1) Compute the predicted value and the residual for each of the five days and present them in a table.
        (2) Show that the residuals add to 0 and explain why that is expected.
        (3) Describe what a residual plot of these values would look like and say whether a linear model is appropriate.
        (4) Predict sales at 22 °C and at 45 °C, and explain which prediction you trust more.
      answer: |
        (1) x = 10: predicted 13, residual +1. x = 15: predicted 23, residual −1. x = 20: predicted 33, residual +1. x = 25: predicted 43, residual −3. x = 30: predicted 53, residual +2.
        (2) 1 − 1 + 1 − 3 + 2 = 0. The least-squares line balances the points above and below it, so its residuals always sum to zero.
        (3) The residuals alternate in sign and are all small (between −3 and +2) with no curve or fan, so the residual plot is a random scatter around 0 and a linear model is appropriate.
        (4) At 22 °C: 2(22) − 7 = 37 drinks. At 45 °C: 2(45) − 7 = 83 drinks. The 22 °C prediction is interpolation inside the data (10 to 30 °C) and is trustworthy; 45 °C is well outside the data, so the trend may not hold (extreme heat may keep customers away), and that prediction is unreliable.
      explanation: |
        Six points.

        (1) 2 pts: 1 for the five predicted values, 1 for the five residuals with correct signs.

        (2) 1 pt: sum shown to be 0 with the balance explanation.

        (3) 1 pt: no pattern, small residuals, linear model appropriate.

        (4) 2 pts: 1 for both predictions (37 and 83), 1 for identifying 45 °C as extrapolation and explaining why it is less trustworthy.

        Common errors: predicted minus actual; claiming the model is poor because residuals are non-zero; trusting the extrapolated value.
