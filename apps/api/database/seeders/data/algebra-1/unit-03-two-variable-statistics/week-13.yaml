      prompt: |
        A school sold 300 tickets to a play. Adult tickets cost $8 and student tickets cost $5, and the sales totalled $1,950.

        (a) Define variables and write a system of equations for the situation.
        (b) Solve the system, showing your method.
        (c) Check your solution in both original equations.
      answer: |
        (a) Let a be adult tickets and s student tickets: a + s = 300 and 8a + 5s = 1950.
        (b) From the first, s = 300 − a. Substituting: 8a + 5(300 − a) = 1950, so 8a + 1500 − 5a = 1950, 3a = 450, a = 150 and s = 150.
        (c) 150 + 150 = 300 and 8(150) + 5(150) = 1200 + 750 = 1950; both hold.
      explanation: |
        Three points, one per part.

        (a) 1 pt: variables defined and both equations correct.

        (b) 1 pt: a = 150 and s = 150 by substitution or elimination with work shown.

        (c) 1 pt: both equations checked numerically.

