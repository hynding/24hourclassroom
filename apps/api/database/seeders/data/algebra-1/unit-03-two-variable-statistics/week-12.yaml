      source: "IM Algebra 1, Unit 3, Lesson 3"
      points: 6
      prompt: |
        A library surveyed 250 visitors. 150 were adults and the rest were teenagers. 90 adults borrowed a book during the visit, and 40 teenagers did not borrow a book.

        (1) Build the complete two-way table with age group as the rows and "borrowed / did not borrow" as the columns, including all totals.
        (2) Make the row relative frequency table, rounding to two decimal places.
        (3) What percent of all visitors were teenagers who borrowed a book? Which total did you divide by, and why?
        (4) Is there an association between age group and borrowing? Explain how you decided and state the finding in one sentence.
      answer: |
        (1) Adults: borrowed 90, did not borrow 60, total 150. Teenagers: borrowed 60, did not borrow 40, total 100. Column totals: borrowed 150, did not borrow 100; grand total 250.
        (2) Adults: 90/150 = 0.60 borrowed, 60/150 = 0.40 did not. Teenagers: 60/100 = 0.60 borrowed, 40/100 = 0.40 did not.
        (3) 60/250 = 24%, dividing by the grand total because the question says "of all visitors".
        (4) No association: the conditional relative frequency of borrowing is 60% in both groups, so knowing a visitor's age group does not change what to expect about borrowing. Adults and teenagers borrowed books at the same rate (60% each).
      explanation: |
        Six points.

        (1) 2 pts: 1 for the four inner cells (90, 60, 60, 40), 1 for correct row, column and grand totals.

        (2) 1 pt: all four row relative frequencies correct (0.60 / 0.40 in each row).

        (3) 1 pt: 24% with the grand total named as the divisor and the reason given.

        (4) 2 pts: 1 for concluding there is no association by comparing the two row percentages, 1 for a clear sentence stating the equal 60% rates.

        Common errors: putting 40 in the teenagers' borrowed cell; comparing the counts 90 and 60 and claiming adults borrow more; dividing by a row total in part (3).

