week: 12
unit: 3
title: "Two-way Tables and Associations in Categorical Data"
topics: ["3.1", "3.2", "3.3"]
guide: guides/week-12.md
guide_description: |
  Building and reading two-way tables with marginal totals, converting counts to relative frequencies of the
  whole table, a row or a column, choosing which total a question is asking about, and deciding whether two
  categorical variables are associated by comparing conditional relative frequencies.
flashcards_description: |
  28 cards on two-way table vocabulary, filling in missing cells from totals, joint, row and column relative
  frequencies, which total answers which question, and judging and describing an association.

flashcards:
  - front: Two-way table → definition
    back: |
      A table whose rows are the categories of one variable and whose columns are the categories of a second variable. Each inner cell counts the cases that fall in both categories.
    topic_code: "3.1"
  - front: Marginal totals of a two-way table
    back: |
      The row totals and column totals written in the margins. Each inner row adds to its row total, each column to its column total, and both sets of totals add to the grand total.
    topic_code: "3.1"
  - front: Grand total of a two-way table
    back: |
      The number of cases in the whole survey, found in the bottom-right corner. It equals the sum of the row totals and also the sum of the column totals.
    topic_code: "3.1"
  - front: Categorical variable → meaning
    back: |
      A variable whose values are labels or groups (sport or no sport, bus or car) rather than measurements. Two-way tables summarise two categorical variables at once.
    topic_code: "3.1"
  - front: Filling a missing cell in a two-way table
    back: |
      Subtract the known cells in that row (or column) from the row (or column) total. Example: row total 70 and one cell 24 means the other cell is 46.
    topic_code: "3.1"
  - front: Checking a completed two-way table
    back: |
      Add each row and column to its margin and add the margins to the grand total. If any sum fails, a cell was misread or miscalculated.
    topic_code: "3.1"
  - front: Building a two-way table from a description with "neither"
    back: |
      Place the "both" count and the "neither" count in their cells first, then use the row and column totals to find the two "only one" cells by subtraction.
    topic_code: "3.1"
  - front: Reading a cell → what question it answers
    back: |
      "How many cases are in this row category and this column category at the same time?" A cell never tells you about everyone in a row or column; the margin does.
    topic_code: "3.1"
  - front: Relative frequency → definition
    back: |
      A count divided by a total, expressed as a fraction, decimal or percent. It allows groups of different sizes to be compared fairly.
    topic_code: "3.2"
  - front: Joint relative frequency
    back: |
      A cell count divided by the grand total. It answers "what fraction of everyone is in both categories?" The joint relative frequencies of all cells add to 1.
    topic_code: "3.2"
  - front: Row relative frequency
    back: |
      A cell count divided by its row total. It answers "of the cases in this row, what fraction are in this column?" Each row's relative frequencies add to 1.
    topic_code: "3.2"
  - front: Column relative frequency
    back: |
      A cell count divided by its column total. It answers "of the cases in this column, what fraction are in this row?" Each column's relative frequencies add to 1.
    topic_code: "3.2"
  - front: Conditional relative frequency → meaning
    back: |
      A proportion computed within one group, that is, a row or column relative frequency. The condition is the group you restrict to, such as "among sport players".
    topic_code: "3.2"
  - front: Which total answers "percentage of what?"
    back: |
      The words after "of" name the total. "Of all students" → grand total; "of the sport players" → that row's total; "of the instrument players" → that column's total.
    topic_code: "3.2"
  - front: 24 of 70 sport players play an instrument → which relative frequency
    back: |
      A row relative frequency, 24/70 ≈ 0.34, because the total is the sport row. The same cell divided by the instrument column total (24/50 = 0.48) answers a different question.
    topic_code: "3.2"
  - front: Why the same cell gives different percentages
    back: |
      Because it can be divided by three different totals (grand, row, column). The count is fixed; the percentage depends on which group you are describing.
    topic_code: "3.2"
  - front: Converting a relative frequency table back to counts
    back: |
      Multiply each relative frequency by the total it was divided by. A row relative frequency of 0.52 in a row of 50 means 26 cases.
    topic_code: "3.2"
  - front: Rounding in relative frequency tables
    back: |
      Round each entry to two decimal places or to a whole percent, but check that rows or columns still add to about 1; small rounding gaps are normal.
    topic_code: "3.2"
  - front: Association between two categorical variables → definition
    back: |
      The variables are associated when the conditional relative frequencies differ noticeably between the groups, so knowing one variable changes what you expect of the other.
    topic_code: "3.3"
  - front: No association → what the table looks like
    back: |
      The row (or column) relative frequencies are nearly the same in every row (or column). Example: 25% of cats and 25% of dogs are over 5 years old.
    topic_code: "3.3"
  - front: Why compare percentages rather than counts across groups
    back: |
      Groups usually have different sizes. 35 old dogs out of 140 and 15 old cats out of 60 are both 25%, so the larger count does not mean a stronger tendency.
    topic_code: "3.3"
  - front: Steps to test for an association
    back: |
      1. Pick the explanatory variable and compute its row (or column) relative frequencies. 2. Compare the same column across the groups. 3. Judge whether the gap is large relative to the group sizes.
    topic_code: "3.3"
  - front: How large a gap suggests an association
    back: |
      No fixed rule in this course. A gap of a few percentage points in a small survey is likely chance; a gap of 15 to 20 points or more in groups of dozens is worth reporting as an association.
    topic_code: "3.3"
  - front: Describing an association in a sentence
    back: |
      Name both variables, the direction and the evidence. "Students who do not play a sport are more likely to play an instrument (52% versus 34%)."
    topic_code: "3.3"
  - front: Association versus causation in a two-way table
    back: |
      An association shows the variables tend to go together; it does not show that one causes the other. Other explanations, such as a third variable, remain possible.
    topic_code: "3.3"
  - front: Equal-sized groups → may counts be compared?
    back: |
      Yes, when the groups are exactly the same size the counts and the percentages rank the same way, but percentages are still the safer habit.
    topic_code: "3.3"
  - front: Segmented bar graph of a two-way table
    back: |
      One bar per group of the explanatory variable, each split into sections proportional to the conditional relative frequencies. Bars with similar splits show no association.
    topic_code: "3.3"
  - front: A gap of 2 percentage points in groups of 20 → conclusion
    back: |
      Little or no evidence of association. With 20 per group, one person changing category moves a percentage by 5 points, so a 2-point gap is within chance.
    topic_code: "3.3"

quiz:
  description: |
    25 questions · about 45 minutes · two-way tables, relative frequency tables and associations between
    categorical variables (lessons 3.1 to 3.3), with review of one-variable statistics and linear equations
    from units 1 and 2. Multiple choice, select-all, true/false and numeric items are graded at once;
    fill-in-the-blank items are matched automatically; the short answers and the long answer are graded by
    your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: learning-format survey (3.1–3.3)
    - slug: alg1-u03-w12-q01
      type: multiple_choice
      topic_code: "3.1"
      source: "IM Algebra 1, Unit 3, Lesson 1"
      points: 1
      stimulus: |
        A school surveyed 150 students in grades 9 and 10 about whether they prefer online or in-person homework help.

        | | Online | In-person | Total |
        |---|---|---|---|
        | Grade 9 | 36 | 54 | 90 |
        | Grade 10 | 30 | 30 | 60 |
        | Total | 66 | 84 | 150 |
      prompt: |
        How many grade 10 students prefer in-person help?
      options:
        - "60"
        - "84"
        - "54"
        - "30"
      option_explanations:
        - |
          60 is the grade 10 row total, the number of grade 10 students surveyed in all.
        - |
          84 is the in-person column total, which includes the grade 9 students as well.
        - |
          54 is the number of grade 9 students who prefer in-person help, the wrong row.
        - |
          Correct. The grade 10 row and the in-person column meet at the cell containing 30.
      answer: 3

    - slug: alg1-u03-w12-q02
      type: multiple_choice
      topic_code: "3.2"
      source: "IM Algebra 1, Unit 3, Lesson 2"
      points: 1
      stimulus: |
        A school surveyed 150 students in grades 9 and 10 about whether they prefer online or in-person homework help.

        | | Online | In-person | Total |
        |---|---|---|---|
        | Grade 9 | 36 | 54 | 90 |
        | Grade 10 | 30 | 30 | 60 |
        | Total | 66 | 84 | 150 |
      prompt: |
        What percent of all the students surveyed are grade 9 students who prefer online help?
      options:
        - "40%"
        - "24%"
        - "55%"
        - "60%"
      option_explanations:
        - |
          40% is 36/90, the fraction of grade 9 students who prefer online, not the fraction of everyone.
        - |
          Correct. "Of all the students" means divide by the grand total: 36/150 = 0.24.
        - |
          55% is roughly 36/66, the fraction of online-preferring students who are in grade 9.
        - |
          60% is 90/150, the fraction of all students who are in grade 9 regardless of preference.
      answer: 1

    - slug: alg1-u03-w12-q03
      type: multiple_choice
      topic_code: "3.2"
      source: "IM Algebra 1, Unit 3, Lesson 2"
      points: 1
      stimulus: |
        A school surveyed 150 students in grades 9 and 10 about whether they prefer online or in-person homework help.

        | | Online | In-person | Total |
        |---|---|---|---|
        | Grade 9 | 36 | 54 | 90 |
        | Grade 10 | 30 | 30 | 60 |
        | Total | 66 | 84 | 150 |
      prompt: |
        Among the grade 9 students, what percent prefer online help?
      options:
        - "24%"
        - "36%"
        - "40%"
        - "50%"
      option_explanations:
        - |
          24% divides by the grand total of 150, which answers a question about all students.
        - |
          36% treats the cell count as a percent; the count 36 must be divided by the grade 9 total of 90.
        - |
          Correct. "Among the grade 9 students" means the row total is the divisor: 36/90 = 0.40.
        - |
          50% is 30/60, the share of grade 10 students who prefer online help, the wrong row.
      answer: 2

    - slug: alg1-u03-w12-q04
      type: multiple_choice
      topic_code: "3.3"
      source: "IM Algebra 1, Unit 3, Lesson 3"
      points: 1
      stimulus: |
        A school surveyed 150 students in grades 9 and 10 about whether they prefer online or in-person homework help.

        | | Online | In-person | Total |
        |---|---|---|---|
        | Grade 9 | 36 | 54 | 90 |
        | Grade 10 | 30 | 30 | 60 |
        | Total | 66 | 84 | 150 |
      prompt: |
        Which statement best describes the relationship between grade and preference?
      options:
        - "Grade 10 students are somewhat more likely to prefer online help (50% versus 40%), a modest association."
        - "There is a strong association, because the two row totals, 90 and 60, are different."
        - "There is no association, because 30 and 30 are equal in the grade 10 row."
        - "Grade 9 students are more likely to prefer online help, because 36 is more than 30."
      option_explanations:
        - |
          Correct. The row relative frequencies for online are 36/90 = 40% and 30/60 = 50%, a 10-point gap favouring grade 10.
        - |
          Different row totals only mean different numbers of students were surveyed in each grade; they are not evidence of an association.
        - |
          The equal split in one row says nothing by itself; an association is judged by comparing the two rows' percentages.
        - |
          Comparing counts across groups of different sizes misleads; 36 of 90 is a smaller share than 30 of 60.
      answer: 0

    # ---- Multiple choice (3.1–3.3)
    - slug: alg1-u03-w12-q05
      type: multiple_choice
      topic_code: "3.1"
      source: "IM Algebra 1, Unit 3, Lesson 1"
      points: 1
      prompt: |
        In a two-way table, one row has a total of 80 and its first cell is 35. What is the other cell in that row?
      options:
        - "35"
        - "40"
        - "45"
        - "115"
      option_explanations:
        - |
          35 would make the row total 70, not 80; the cells in a row need not be equal.
        - |
          40 is half of 80; the cells only split evenly if the known cell were also 40.
        - |
          Correct. The two cells add to the row total, so the missing cell is 80 − 35 = 45.
        - |
          115 adds the cell to the total; the total already includes the known cell, so subtract instead.
      answer: 2

    - slug: alg1-u03-w12-q06
      type: multiple_choice
      topic_code: "3.2"
      source: "IM Algebra 1, Unit 3, Lesson 2"
      points: 1
      prompt: |
        A table has rows "plays a sport / no sport" and columns "plays an instrument / no instrument". Which total should you divide by to answer "What percent of instrument players also play a sport?"
      options:
        - "The total of the instrument column"
        - "The total of the no-instrument column"
        - "The grand total"
        - "The total of the sport row"
      option_explanations:
        - |
          Correct. "Of instrument players" names the group, so the instrument column total is the divisor.
        - |
          The no-instrument column contains students who do not play an instrument, so it cannot describe instrument players.
        - |
          The grand total answers "what percent of all students", but the question is only about instrument players.
        - |
          The sport row total would answer "what percent of sport players play an instrument", the reverse question.
      answer: 0

    - slug: alg1-u03-w12-q07
      type: multiple_choice
      topic_code: "3.2"
      source: "IM Algebra 1, Unit 3, Lesson 2"
      points: 1
      prompt: |
        A row of a relative frequency table shows 0.35 in its first cell, and the row contains 40 cases. How many cases are in that cell?
      options:
        - "35"
        - "0.875"
        - "26"
        - "14"
      option_explanations:
        - |
          35 reads the decimal as a count; 0.35 is a fraction of the row, not a number of cases.
        - |
          0.875 divides the relative frequency by 0.4, which has no meaning for a count of cases.
        - |
          26 is the other cell of the row, 40 − 14, the cases not in the first cell.
        - |
          Correct. A row relative frequency times the row total gives the count: 0.35 × 40 = 14.
      answer: 3

    - slug: alg1-u03-w12-q08
      type: multiple_choice
      topic_code: "3.3"
      source: "IM Algebra 1, Unit 3, Lesson 3"
      points: 1
      prompt: |
        In a survey, 50 of 200 adults and 25 of 100 teenagers said they read a newspaper daily. What does this show about the association between age group and daily newspaper reading?
      options:
        - "Adults are more likely to read daily because 50 is twice 25."
        - "There is no association: 25% of each group reads daily."
        - "Teenagers are more likely to read daily because their group is smaller."
        - "An association cannot be judged without the grand total."
      option_explanations:
        - |
          Counts cannot be compared across groups of different sizes; there are twice as many adults as teenagers.
        - |
          Correct. 50/200 = 25% and 25/100 = 25%, so the conditional relative frequencies are identical.
        - |
          Group size does not change a tendency; the share of readers is the same in both groups.
        - |
          The grand total (300) is known, but the comparison that matters is within each group, and it is already possible.
      answer: 1

    - slug: alg1-u03-w12-q09
      type: multiple_choice
      topic_code: "3.3"
      source: "IM Algebra 1, Unit 3, Lesson 3"
      points: 1
      prompt: |
        Among 100 bus commuters, 30 arrived late this week; among 100 car commuters, 20 arrived late. Which sentence correctly reports the finding?
      options:
        - "There is no association because both groups had exactly 100 commuters."
        - "Car commuters are more often late, because 80 of them were on time."
        - "Bus commuters were more often late than car commuters (30% versus 20%), a modest association."
        - "Taking the bus causes lateness, because 30% of bus riders were late."
      option_explanations:
        - |
          Equal group sizes make counts comparable, but the counts 30 and 20 are different, so there is an association.
        - |
          80 on time out of 100 is the on-time share for cars; it means car commuters were late less often, not more.
        - |
          Correct. The report names both variables, gives the direction and quotes the two conditional percentages.
        - |
          An association is not proof of cause; the bus riders might differ in other ways, such as distance travelled.
      answer: 2

    - slug: alg1-u03-w12-q10
      type: multiple_choice
      topic_code: "3.1"
      source: "IM Algebra 1, Unit 3, Lesson 1"
      points: 1
      prompt: |
        Of 80 café customers, 50 ordered coffee. 30 of the coffee drinkers also ordered food, and 10 customers ordered neither coffee nor food. How many customers ordered food but not coffee?
      options:
        - "10"
        - "50"
        - "30"
        - "20"
      option_explanations:
        - |
          10 is the number who ordered neither, the cell diagonally opposite the one asked for.
        - |
          50 is the food column total (30 + 20) and also the coffee row total; the question asks for one cell.
        - |
          30 is the number who ordered both coffee and food, or the no-coffee row total, not the food-only cell.
        - |
          Correct. 30 customers did not order coffee; 10 of them ordered nothing, so 30 − 10 = 20 ordered food only.
      answer: 3

    - slug: alg1-u03-w12-q11
      type: multiple_choice
      topic_code: "1.10"
      source: "IM Algebra 1, Unit 1, Lesson 10"
      points: 1
      prompt: |
        The data set 4, 5, 5, 6, 7 has one value changed from 7 to 70. Which statement is true?
      options:
        - "The median increases a lot while the mean stays at 5.4."
        - "The mean increases a lot while the median stays at 5."
        - "Neither the mean nor the median changes."
        - "The mean and the median both increase by the same amount."
      option_explanations:
        - |
          This reverses the roles: it is the mean, which uses every value, that is pulled toward the extreme.
        - |
          Correct. The mean rises from 5.4 to 18, but the middle value of 4, 5, 5, 6, 70 is still 5.
        - |
          The mean uses the sum of all values, so replacing 7 with 70 must change it.
        - |
          The median depends only on the middle value, so it cannot move as much as the mean when one extreme changes.
      answer: 1

    - slug: alg1-u03-w12-q12
      type: multiple_choice
      topic_code: "2.13"
      source: "IM Algebra 1, Unit 2, Lesson 13"
      points: 1
      prompt: |
        Solve the system y = 2x + 1 and 3x + y = 16 by substitution. What is the solution?
      options:
        - "(3, 7)"
        - "(7, 3)"
        - "(2, 5)"
        - "(5, 1)"
      option_explanations:
        - |
          Correct. Substituting gives 3x + 2x + 1 = 16, so 5x = 15, x = 3 and y = 2(3) + 1 = 7.
        - |
          (7, 3) swaps the coordinates; checking, 3(7) + 3 = 24, which is not 16.
        - |
          (2, 5) satisfies the first equation but gives 3(2) + 5 = 11 in the second, not 16.
        - |
          (5, 1) satisfies the second equation (15 + 1 = 16) but not the first, since 2(5) + 1 = 11, not 1.
      answer: 0

    # ---- Select-all (3.2, 2.20)
    - slug: alg1-u03-w12-q13
      type: multi_select
      topic_code: "3.2"
      source: "IM Algebra 1, Unit 3, Lesson 2"
      points: 2
      partial_credit: true
      prompt: |
        A two-way table has row A with cells 20 and 30 (row total 50) and row B with cells 10 and 40 (row total 50). Which values are row relative frequencies of this table? Select all that apply.
      options:
        - "20/30 ≈ 0.67"
        - "20/50 = 0.40"
        - "30/50 = 0.60"
        - "40/70 ≈ 0.57"
        - "10/50 = 0.20"
      option_explanations:
        - |
          20/30 divides a cell by the first column's total (20 + 10 = 30), which is a column relative frequency.
        - |
          Correct. The first cell of row A divided by the row A total is a row relative frequency.
        - |
          Correct. The second cell of row A divided by its row total of 50 is a row relative frequency.
        - |
          40/70 divides a cell by the second column's total (30 + 40 = 70), which is a column relative frequency.
        - |
          Correct. The first cell of row B divided by the row B total of 50 is a row relative frequency.
      answer: [1, 2, 4]

    - slug: alg1-u03-w12-q14
      type: multi_select
      topic_code: "2.20"
      source: "IM Algebra 1, Unit 2, Lesson 20"
      points: 2
      partial_credit: true
      prompt: |
        Which values of x satisfy the inequality 3x − 5 ≤ 7? Select all that apply.
      options:
        - "x = 5"
        - "x = −2"
        - "x = 0"
        - "x = 4"
        - "x = 4.5"
      option_explanations:
        - |
          3(5) − 5 = 10, and 10 ≤ 7 is false; 5 lies beyond the boundary x = 4.
        - |
          Correct. 3(−2) − 5 = −11, and −11 ≤ 7 is true.
        - |
          Correct. 3(0) − 5 = −5, and −5 ≤ 7 is true.
        - |
          Correct. 3(4) − 5 = 7, and 7 ≤ 7 is true because the inequality includes equality.
        - |
          3(4.5) − 5 = 8.5, and 8.5 ≤ 7 is false; the solution set is x ≤ 4.
      answer: [1, 2, 3]

    # ---- True/false (3.3, 1.12)
    - slug: alg1-u03-w12-q15
      type: true_false
      topic_code: "3.3"
      source: "IM Algebra 1, Unit 3, Lesson 3"
      points: 1
      prompt: |
        True or false: if one group has a larger count in a category than another group, the two variables must be associated.
      answer: false
      explanation: |
        False. A larger count can simply come from a larger group. Association is judged by comparing conditional relative frequencies, such as 25% of cats versus 25% of dogs, which shows no association even though the dog count is larger.

    - slug: alg1-u03-w12-q16
      type: true_false
      topic_code: "1.12"
      source: "IM Algebra 1, Unit 1, Lesson 12"
      points: 1
      prompt: |
        True or false: a data set in which every value is the same has a standard deviation of 0.
      answer: true
      explanation: |
        True. Every value equals the mean, so every deviation is 0, and the standard deviation, which averages the squared deviations before taking a root, is 0.

    # ---- Fill in the blank (3.2, 2.17)
    - slug: alg1-u03-w12-q17
      type: fill_blank
      topic_code: "3.2"
      source: "IM Algebra 1, Unit 3, Lesson 2"
      points: 1
      prompt: |
        A cell count divided by the grand total of the table is called a ____ relative frequency.
      answer: ["joint"]
      explanation: |
        Joint relative frequencies describe the share of everyone who falls in both categories at once; they add to 1 across the whole table.

    - slug: alg1-u03-w12-q18
      type: fill_blank
      topic_code: "2.17"
      source: "IM Algebra 1, Unit 2, Lesson 17"
      points: 1
      prompt: |
        A system of two linear equations whose graphs are distinct parallel lines has ____ solutions.
      answer: ["no", "zero", "0"]
      explanation: |
        Parallel lines never meet, so no ordered pair satisfies both equations; algebraically the variables cancel and a false statement such as 0 = 5 remains.

    # ---- Numeric (3.1, 3.2, 1.5)
    - slug: alg1-u03-w12-q19
      type: numeric
      topic_code: "3.1"
      source: "IM Algebra 1, Unit 3, Lesson 1"
      points: 1
      prompt: |
        A two-way table has a grand total of 200 and two rows. The first row total is 120. What is the second row total?
      answer: { value: 80, tolerance: 0 }
      explanation: |
        The row totals add to the grand total, so the second row total is 200 − 120 = 80.

    - slug: alg1-u03-w12-q20
      type: numeric
      topic_code: "3.2"
      source: "IM Algebra 1, Unit 3, Lesson 2"
      points: 1
      prompt: |
        In a column with total 180, one cell holds 45. What is the column relative frequency of that cell, as a percent? Give the number only.
      answer: { value: 25, tolerance: 0 }
      explanation: |
        45/180 = 0.25, which is 25% of the column.

    - slug: alg1-u03-w12-q21
      type: numeric
      topic_code: "1.5"
      source: "IM Algebra 1, Unit 1, Lesson 5"
      points: 1
      prompt: |
        What is the median of the data set 3, 9, 4, 12, 7, 8?
      answer: { value: 7.5, tolerance: 0 }
      explanation: |
        Sorted, the data are 3, 4, 7, 8, 9, 12. With six values the median is the mean of the two middle values, (7 + 8)/2 = 7.5.

    # ---- Short answer (3.3, 2.9)
    - slug: alg1-u03-w12-q22
      type: short_answer
      topic_code: "3.3"
      source: "IM Algebra 1, Unit 3, Lesson 3"
      points: 3
      prompt: |
        A gym asked members whether they attend morning or evening classes and whether they renewed their membership.

        | | Renewed | Did not renew | Total |
        |---|---|---|---|
        | Morning | 48 | 12 | 60 |
        | Evening | 70 | 70 | 140 |

        (a) Find the percent of morning members who renewed and the percent of evening members who renewed.
        (b) Is there an association between class time and renewal? Justify with the numbers.
        (c) Write one sentence reporting the finding that names both variables and the direction.
      answer: |
        (a) Morning: 48/60 = 80%. Evening: 70/140 = 50%.
        (b) Yes. The renewal rates differ by 30 percentage points, a large gap with groups of 60 and 140, so class time and renewal are associated.
        (c) Morning-class members renewed far more often than evening-class members (80% versus 50%).
      explanation: |
        Three points, one per part.

        (a) 1 pt: both row percentages correct (80% and 50%).

