    - slug: alg1-u03-w12-q23
      type: short_answer
      topic_code: "2.9"
      source: "IM Algebra 1, Unit 2, Lesson 9"
      points: 3
      prompt: |
        The perimeter of a rectangle is given by P = 2l + 2w.

        (a) Solve the formula for w.
        (b) Use your formula to find w when P = 50 and l = 15.
        (c) Explain in one sentence why solving for w first is useful if you must find w for many different rectangles.
      answer: |
        (a) 2w = P − 2l, so w = (P − 2l)/2, which can also be written w = P/2 − l.
        (b) w = (50 − 30)/2 = 10.
        (c) Once the formula is solved for w, each new rectangle needs only a substitution and arithmetic instead of re-solving an equation every time.
      explanation: |
        Three points, one per part.

        (a) 1 pt: w = (P − 2l)/2 or an equivalent such as P/2 − l.

        (b) 1 pt: w = 10 with the substitution shown.

        (c) 1 pt: an explanation that the rearranged formula avoids repeating the algebra for every case.

