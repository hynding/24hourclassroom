  # ---- Free response
  - slug: alg1-u03-exam-q43
    type: short_answer
    topic_code: "3.3"
    source: "IM Algebra 1, Unit 3, Lesson 3"
    points: 3
    prompt: |
      A theatre asked 300 patrons whether they bought a season ticket and whether they attended the opening night.

      | | Attended opening | Did not attend | Total |
      |---|---|---|---|
      | Season ticket | 90 | 30 | 120 |
      | Single tickets | 72 | 108 | 180 |

      (a) Find the percent of season-ticket holders who attended opening night and the percent of single-ticket buyers who did.
      (b) Is there an association between ticket type and attending opening night? Justify.
      (c) A manager says "season tickets make people attend opening night." Give one reason this causal claim is not justified by the table.
    answer: |
      (a) Season: 90/120 = 75%. Single: 72/180 = 40%.
      (b) Yes. A 35-point gap with groups of 120 and 180 is a clear association: season-ticket holders attended opening night far more often.
      (c) The data are observational; the kind of patron who buys a season ticket (a devoted theatre-goer) would likely attend opening night anyway, so enthusiasm is a lurking variable.
    explanation: |
      Three points, one per part.

      (a) 1 pt: 75% and 40%.

      (b) 1 pt: association affirmed with the 35-point gap cited.

      (c) 1 pt: any sound reason: lurking variable, reversed direction, or the absence of random assignment.

  - slug: alg1-u03-exam-q44
    type: short_answer
    topic_code: "3.7"
    source: "IM Algebra 1, Unit 3, Lesson 7"
    points: 3
    prompt: |
      Three scatter plots are described. Plot P: points rise steeply from left to right and lie almost exactly on a line. Plot Q: points fall gently from left to right with a visible trend but wide spread. Plot R: points form a perfect U shape, high at both ends and low in the middle.

      (a) Assign each plot one of r = −0.5, r = 0.01, r = 0.97 and explain each choice briefly.
      (b) Plot P has a much steeper line than a fourth plot S with r = 0.97. What can you say about the strength of S compared with P?
      (c) Why is r a poor summary of plot R?
    answer: |
      (a) P: 0.97 (tight upward line). Q: −0.5 (downward, wide spread). R: 0.01 (no linear trend even though there is a pattern).
      (b) They are equally strong; r measures how close the points are to a line, not how steep the line is.
      (c) r detects only linear relationships; the U shape is a strong relationship that r reports as almost zero, so the scatter plot, not r, should be used to describe it.
    explanation: |
      Three points, one per part.

      (a) 1 pt: all three matches with reasons (sign from direction, size from spread).

      (b) 1 pt: equal strength, with the slope-versus-r distinction.

      (c) 1 pt: r measures linear association only.

  - slug: alg1-u03-exam-q45
    type: long_answer
    topic_code: "3.10"
    source: "IM Algebra 1, Unit 3, Lesson 10"
    points: 6
    prompt: |
      A shop records the number of hours its sign is lit each evening, x, and the number of customers, y, over six evenings: (1, 32), (2, 40), (3, 48), (4, 50), (5, 61), (6, 69). Technology gives the least-squares line y = 7.14x + 25 with r = 0.99.

      (1) Interpret the slope and the intercept in context, and say whether the intercept is meaningful.
      (2) Compute the residuals for x = 2, x = 4 and x = 6.
      (3) Describe the strength of the relationship using r, and explain what a residual plot would need to show for the line to be a good model.
      (4) The owner proposes lighting the sign for 15 hours to attract 132 customers, and claims the lit sign is what brings customers in. Evaluate both the prediction and the causal claim.
    answer: |
      (1) Slope 7.14: each additional hour the sign is lit is associated with about 7 more customers. Intercept 25: about 25 customers are predicted with the sign never lit; x = 0 is just outside the data (1 to 6 hours) but is a sensible quantity, so the intercept is meaningful as a baseline.
      (2) x = 2: predicted 39.28, residual 40 − 39.28 = +0.72. x = 4: predicted 53.56, residual 50 − 53.56 = −3.56. x = 6: predicted 67.84, residual 69 − 67.84 = +1.16.
      (3) r = 0.99 is a very strong positive linear relationship. The residual plot should show small residuals scattered randomly above and below zero with no curve or fan.
      (4) Prediction: 7.14(15) + 25 = 132.1 ≈ 132, but 15 hours is far beyond the 6-hour maximum in the data, so this is extrapolation and unreliable (evenings do not have 15 lit hours of foot traffic). Causal claim: the data are observational; evenings when the sign was lit longer may also have been busier for other reasons (weekends, events, weather). Only an experiment that randomly assigns the lighting hours could support the claim.
    explanation: |
      Six points.

      (1) 2 pts: 1 for the slope in context, 1 for the intercept with a judgement on its meaning.

      (2) 1 pt: residuals +0.72, −3.56 and +1.16 (accept rounding to one decimal) with correct signs.

      (3) 1 pt: strong positive relationship and the no-pattern residual criterion.

      (4) 2 pts: 1 for computing about 132 and flagging the extrapolation, 1 for rejecting the causal claim with a lurking-variable or no-random-assignment argument.

      Common errors: predicted minus actual; treating r as the slope; accepting the 15-hour prediction because r is high.
