    topic_code: "3.4"
    source: "IM Algebra 1, Unit 3, Lesson 4"
    points: 1
    prompt: |
      True or false: a linear model fitted to data for x between 20 and 40 gives reliable predictions for x = 100 as long as r is close to 1.
    answer: false
    explanation: |
      False. A high r describes how well the line fits inside the data range. Predicting at x = 100 is extrapolation; the pattern may change beyond the data, so the prediction should be flagged as unreliable.

