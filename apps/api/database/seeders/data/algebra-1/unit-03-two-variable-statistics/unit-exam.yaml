    source: "IM Algebra 1, Unit 2, Lesson 11"
    points: 1
    prompt: |
      What is the slope of the line 3x + 4y = 24?
    options:
      - "3/4"
      - "−3/4"
      - "−4/3"
      - "6"
    option_explanations:
      - |
        3/4 has the right size but the wrong sign; solving for y gives y = −(3/4)x + 6.
      - |
        Correct. Solving for y: 4y = −3x + 24, so y = −(3/4)x + 6 and the slope is −3/4.
