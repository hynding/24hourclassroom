    source: "IM Algebra 1, Unit 3, Lesson 3"
    points: 1
    prompt: |
      True or false: if the row relative frequencies are the same in every row of a two-way table, there is no association between the two variables.
    answer: true
    explanation: |
      True. Identical conditional distributions mean that knowing the row category does not change what to expect about the column category, which is exactly what "no association" means.

