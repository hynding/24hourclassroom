unit: 3
description: |
  45 questions · about 90 minutes · every lesson of Unit 3 (3.1 to 3.10): two-way tables and relative
  frequencies, associations between categorical variables, linear models and their interpretation, fitting
  lines, residuals, the correlation coefficient, correlation versus causation, and modelling with data, plus
  review of Units 1 and 2. Three stimulus sets share a situation across consecutive items. Multiple choice,
  select-all, true/false and numeric items are graded at once; fill-in-the-blank items are matched
  automatically; the short answers and the long answer are graded by your teacher against the scoring notes.
questions:
  # ---- Two-way tables and associations (3.1-3.3)
  - slug: alg1-u03-exam-q01
    type: multiple_choice
    topic_code: "3.1"
    source: "IM Algebra 1, Unit 3, Lesson 1"
    points: 1
    prompt: |
      A two-way table records pet ownership (dog, cat) against housing (house, apartment). What does the number in the "cat" row and "apartment" column count?
    options:
      - "All the cat owners in the survey"
      - "All the apartment residents in the survey"
      - "The people who own a cat and live in an apartment"
      - "The total number of people surveyed"
    option_explanations:
      - |
        All cat owners are counted by the cat row's total in the margin, not by one inner cell.
      - |
        All apartment residents are counted by the apartment column's total, not by one inner cell.
      - |
        Correct. An inner cell counts the cases that belong to both its row category and its column category.
      - |
        The total surveyed is the grand total in the bottom-right corner.
    answer: 2

  - slug: alg1-u03-exam-q02
    type: multiple_choice
    topic_code: "3.1"
    source: "IM Algebra 1, Unit 3, Lesson 1"
    points: 1
    prompt: |
      A column of a two-way table has a total of 95 and three cells: 40, 25 and one unknown. What is the unknown cell?
    options:
      - "30"
      - "65"
      - "160"
      - "35"
    option_explanations:
      - |
        Correct. The cells add to the column total: 95 − 40 − 25 = 30.
      - |
        65 is 40 + 25, the sum of the known cells, not the remaining one.
      - |
        160 adds everything together instead of subtracting from the total.
      - |
        35 would make the column add to 100, not 95.
    answer: 0

  - slug: alg1-u03-exam-q03
    type: multiple_choice
    topic_code: "3.2"
    source: "IM Algebra 1, Unit 3, Lesson 2"
    points: 1
    prompt: |
      In a table of 400 shoppers, 120 are in the "paid by card" row and 90 of those bought groceries. What is the row relative frequency of card payers who bought groceries?
    options:
      - "0.225"
      - "0.75"
      - "0.30"
      - "0.133"
    option_explanations:
      - |
        0.225 is 90/400, the joint relative frequency over all shoppers.
      - |
        Correct. The row total is 120, so 90/120 = 0.75.
      - |
        0.30 is 120/400, the share of all shoppers who paid by card.
      - |
        0.133 is 120/900 or a similar mis-division; the cell should be divided by its row total.
    answer: 1

  - slug: alg1-u03-exam-q04
    type: multiple_choice
    topic_code: "3.2"
    source: "IM Algebra 1, Unit 3, Lesson 2"
    points: 1
    prompt: |
      Which set of relative frequencies must add to exactly 1?
    options:
      - "The joint relative frequencies of every inner cell"
      - "The row relative frequencies of the first column"
      - "The column relative frequencies of the first row"
      - "The relative frequencies of the two row totals and the two column totals"
    option_explanations:
      - |
        Correct. Every case is in exactly one inner cell, so the cell counts add to the grand total and their shares add to 1.
      - |
        One column's row relative frequencies come from different rows with different divisors and need not add to 1.
      - |
        One row's column relative frequencies have different column totals as divisors and need not add to 1.
      - |
        Row totals add to 1 and column totals add to 1 separately; together they add to 2.
    answer: 0

  - slug: alg1-u03-exam-q05
    type: multiple_choice
    topic_code: "3.3"
    source: "IM Algebra 1, Unit 3, Lesson 3"
    points: 1
    prompt: |
      In a survey, 42% of left-handed students and 41% of right-handed students prefer science to history. What is the best conclusion?
    options:
      - "Handedness is strongly associated with subject preference."
      - "There is little or no association between handedness and subject preference."
      - "Left-handed students cause science preference."
      - "No conclusion is possible without the counts."
    option_explanations:
      - |
        A 1-point gap is far too small to call an association; the percentages are essentially equal.
      - |
        Correct. The conditional percentages are nearly identical, so knowing handedness tells you nothing about preference.
      - |
        Even a real association would not show cause, and here there is no association to begin with.
      - |
        The conditional percentages are exactly what is needed; counts would only confirm the sample sizes.
    answer: 1

  - slug: alg1-u03-exam-q06
    type: multiple_choice
    topic_code: "3.3"
    source: "IM Algebra 1, Unit 3, Lesson 3"
    points: 1
    prompt: |
      Among 40 part-time workers, 30 said they were satisfied with their hours; among 160 full-time workers, 80 said so. Which statement is correct?
    options:
      - "Full-time workers are more satisfied because 80 is more than 30."
      - "Part-time workers are more often satisfied (75% versus 50%), so the variables are associated."
      - "The groups cannot be compared because they differ in size."
      - "Satisfaction is the same in both groups because both have a majority satisfied."
    option_explanations:
      - |
        Counts cannot be compared across groups of different sizes; 80 of 160 is a smaller share than 30 of 40.
      - |
        Correct. 30/40 = 75% and 80/160 = 50%, a 25-point gap, which is a clear association.
      - |
        Percentages make groups of any size comparable; that is why conditional relative frequencies are used.
      - |
        Both are at least half, but 75% and 50% are very different shares.
    answer: 1

  # ---- Stimulus set A: a school lunch survey (3.1, 3.2, 3.3)
  - slug: alg1-u03-exam-q07
    type: multiple_choice
    topic_code: "3.1"
    source: "IM Algebra 1, Unit 3, Lesson 1"
    points: 1
    stimulus: |
      A survey of 200 students asked whether they buy lunch at school or bring it from home, and whether they are in middle school or high school.

      | | Buys lunch | Brings lunch | Total |
      |---|---|---|---|
      | Middle school | 48 | 32 | 80 |
      | High school | 60 | 60 | 120 |
      | Total | 108 | 92 | 200 |
    prompt: |
      How many high-school students bring lunch from home?
    options:
      - "60"
      - "92"
      - "120"
      - "32"
    option_explanations:
      - |
        Correct. The high-school row meets the "brings lunch" column at 60.
      - |
        92 is the column total for bringing lunch, which includes the middle-school students.
      - |
        120 is the number of high-school students surveyed in total.
      - |
        32 is the number of middle-school students who bring lunch, the wrong row.
    answer: 0

  - slug: alg1-u03-exam-q08
    type: multiple_choice
    topic_code: "3.2"
    source: "IM Algebra 1, Unit 3, Lesson 2"
    points: 1
    stimulus: |
      A survey of 200 students asked whether they buy lunch at school or bring it from home, and whether they are in middle school or high school.

      | | Buys lunch | Brings lunch | Total |
      |---|---|---|---|
      | Middle school | 48 | 32 | 80 |
      | High school | 60 | 60 | 120 |
      | Total | 108 | 92 | 200 |
    prompt: |
      What percent of the students who buy lunch are in middle school?
    options:
      - "24%"
      - "60%"
      - "44%"
      - "40%"
    option_explanations:
      - |
        24% is 48/200, the share of all students, but the question restricts to those who buy lunch.
      - |
        60% is 48/80, the share of middle-school students who buy lunch, the reverse question.
      - |
        Correct. "Of the students who buy lunch" names the column total 108: 48/108 ≈ 0.44.
      - |
        40% is 80/200, the share of all students who are in middle school.
    answer: 2

  - slug: alg1-u03-exam-q09
    type: multiple_choice
    topic_code: "3.3"
    source: "IM Algebra 1, Unit 3, Lesson 3"
    points: 1
    stimulus: |
      A survey of 200 students asked whether they buy lunch at school or bring it from home, and whether they are in middle school or high school.

      | | Buys lunch | Brings lunch | Total |
      |---|---|---|---|
      | Middle school | 48 | 32 | 80 |
      | High school | 60 | 60 | 120 |
      | Total | 108 | 92 | 200 |
    prompt: |
      Is there an association between school level and buying lunch?
    options:
      - "Yes: 60% of middle-school students buy lunch compared with 50% of high-school students, a modest association."
      - "No: the same number of high-school students buy and bring lunch."
      - "Yes: more high-school students buy lunch (60 versus 48)."
      - "No: both groups have more buyers than bringers."
    option_explanations:
      - |
        Correct. 48/80 = 60% and 60/120 = 50%; a 10-point gap suggests a modest association.
      - |
        The 60/60 split in one row says nothing until it is compared with the other row's 60%.
      - |
        Comparing counts across groups of different sizes is misleading; the high-school group is larger.
      - |
        The middle-school group has more buyers, but the high-school group is split evenly, so the shares differ.
    answer: 0

  # ---- Linear models and residuals (3.4-3.6)
  - slug: alg1-u03-exam-q10
    type: multiple_choice
    topic_code: "3.4"
    source: "IM Algebra 1, Unit 3, Lesson 4"
    points: 1
    prompt: |
      A model for the weight of a puppy in pounds after w weeks is y = 1.4w + 3. Which interpretation of the intercept is correct?
    options:
      - "The puppy gains 3 pounds each week."
      - "The puppy weighed about 3 pounds at the start of the measurements."
      - "The puppy was 3 weeks old when first weighed."
      - "The puppy will weigh 3 pounds after 1.4 weeks."
    option_explanations:
      - |
        The weekly gain is the slope, 1.4 pounds, not the intercept.
      - |
        Correct. The intercept is the predicted value at w = 0, the start.
      - |
        The intercept is a weight in pounds, not an age in weeks.
      - |
        At w = 1.4 the prediction is 1.96 + 3 ≈ 5 pounds; the 3 belongs to w = 0.
    answer: 1

  - slug: alg1-u03-exam-q11
    type: multiple_choice
    topic_code: "3.4"
    source: "IM Algebra 1, Unit 3, Lesson 4"
    points: 1
    prompt: |
      A model relating a laptop's age in years to its resale price in dollars is p = −150a + 900. What does the model predict for a 4-year-old laptop?
    options:
      - "$600"
      - "$300"
      - "$750"
      - "$1,500"
    option_explanations:
      - |
        $600 subtracts 150 twice, which is the prediction for a 2-year-old laptop.
      - |
        Correct. −150(4) + 900 = −600 + 900 = 300 dollars.
      - |
        $750 subtracts 150 only once, the prediction for a 1-year-old laptop.
      - |
        $1,500 adds 600 instead of subtracting it; the slope is negative.
    answer: 1

  - slug: alg1-u03-exam-q12
    type: multiple_choice
    topic_code: "3.5"
    source: "IM Algebra 1, Unit 3, Lesson 5"
    points: 1
    prompt: |
      Two students draw lines of fit by eye for the same scatter plot and get slightly different equations. What is the best way to settle which line to use?
    options:
      - "Use whichever line passes through more data points."
      - "Use technology to compute the least-squares line."
      - "Average the two slopes and the two intercepts."
      - "Use the line that passes through the first and last points."
    option_explanations:
      - |
        A line of best fit need not pass through any data point; closeness to all points is what matters.
      - |
        Correct. The least-squares line is the agreed standard; it minimises the sum of squared residuals.
      - |
        Averaging two guesses gives a third guess with no guarantee of a better fit.
      - |
        The extreme points are the most likely to be unusual, so that line often tilts away from the cloud.
    answer: 1

  - slug: alg1-u03-exam-q13
    type: multiple_choice
    topic_code: "3.6"
    source: "IM Algebra 1, Unit 3, Lesson 6"
    points: 1
    prompt: |
      With the model y = 3x + 10, the data point (6, 25) has which residual?
    options:
      - "+3"
      - "−3"
      - "+28"
      - "0"
    option_explanations:
      - |
        +3 is predicted minus actual (28 − 25); the residual is actual minus predicted.
      - |
        Correct. Predicted 3(6) + 10 = 28; residual 25 − 28 = −3, so the point is below the line.
      - |
        28 is the predicted value, not the residual.
      - |
        The residual is 0 only when the point is exactly on the line, but 25 is not 28.
    answer: 1

  - slug: alg1-u03-exam-q14
    type: multiple_choice
    topic_code: "3.6"
    source: "IM Algebra 1, Unit 3, Lesson 6"
    points: 1
    prompt: |
      A residual plot shows small residuals for x between 0 and 20 that fan out to very large positive and negative residuals for x between 20 and 40. What does this suggest?
    options:
      - "The line fits equally well across the whole range."
      - "The line's predictions are much less reliable for larger x."
      - "The data follow a parabola."
      - "The slope should be made negative."
    option_explanations:
      - |
        Residuals that grow with x mean the fit worsens; the line does not fit equally well everywhere.
      - |
        Correct. A fan shape means the spread around the line increases, so predictions at large x carry more error.
      - |
        A parabola would give an arch of residuals with a consistent sign pattern, not a widening spread.
      - |
        The sign of the slope is set by the trend of the data; the fan says nothing about direction.
    answer: 1

  - slug: alg1-u03-exam-q15
    type: multiple_choice
    topic_code: "3.5"
    source: "IM Algebra 1, Unit 3, Lesson 5"
    points: 1
    prompt: |
      Which is a property of the least-squares line of best fit?
    options:
      - "It passes through at least two of the data points."
      - "Its residuals sum to zero."
      - "It has the same slope as the line through the first and last points."
      - "It always has a positive slope."
    option_explanations:
      - |
        The least-squares line may pass through none of the points; it is defined by closeness, not by passing through.
      - |
        Correct. The positive and negative residuals of the least-squares line cancel exactly.
      - |
        The first and last points have no special role in the least-squares calculation.
      - |
        The slope is negative whenever the data trend downward.
    answer: 1

  # ---- Stimulus set B: a running log (3.4, 3.5, 3.6)
  - slug: alg1-u03-exam-q16
    type: multiple_choice
    topic_code: "3.4"
    source: "IM Algebra 1, Unit 3, Lesson 4"
    points: 1
    stimulus: |
      A runner logs the distance of each run in kilometres, x, and the time in minutes, y: (3, 18), (4, 22), (5, 27), (6, 34), (8, 44), (10, 56). Technology gives the least-squares line y = 5.5x + 0.5 with r = 0.998.
    prompt: |
      What does the slope 5.5 mean in this context?
    options:
      - "The runner takes about 5.5 minutes for each kilometre."
      - "The runner covers 5.5 kilometres each minute."
      - "The runner's first run took 5.5 minutes."
      - "The runner adds 5.5 kilometres to each run."
    option_explanations:
      - |
        Correct. The slope is the change in minutes per additional kilometre, a pace of about 5.5 min/km.
      - |
        This reverses the units; 5.5 km per minute is impossible for a runner.
      - |
        A single run's time is a data value, not the slope.
      - |
        The x-variable is distance; the slope tells how time changes with distance, not how runs change over time.
    answer: 0

  - slug: alg1-u03-exam-q17
    type: multiple_choice
    topic_code: "3.6"
    source: "IM Algebra 1, Unit 3, Lesson 6"
    points: 1
    stimulus: |
      A runner logs the distance of each run in kilometres, x, and the time in minutes, y: (3, 18), (4, 22), (5, 27), (6, 34), (8, 44), (10, 56). Technology gives the least-squares line y = 5.5x + 0.5 with r = 0.998.
    prompt: |
      What is the residual for the 6 km run?
    options:
      - "+0.5"
      - "−0.5"
      - "+1"
      - "+33.5"
    option_explanations:
      - |
        Correct. Predicted 5.5(6) + 0.5 = 33.5; residual 34 − 33.5 = +0.5, slightly slower than the line predicts.
      - |
        −0.5 is predicted minus actual, the wrong order.
      - |
        +1 is 34 − 33, which forgets the intercept 0.5 in the prediction.
      - |
        33.5 is the predicted time, not the difference between actual and predicted.
    answer: 0

  - slug: alg1-u03-exam-q18
    type: multiple_choice
    topic_code: "3.5"
    source: "IM Algebra 1, Unit 3, Lesson 5"
    points: 1
    stimulus: |
      A runner logs the distance of each run in kilometres, x, and the time in minutes, y: (3, 18), (4, 22), (5, 27), (6, 34), (8, 44), (10, 56). Technology gives the least-squares line y = 5.5x + 0.5 with r = 0.998.
    prompt: |
      The runner wants to estimate the time for a 7 km run. Which statement is best?
    options:
      - "About 39 minutes; 7 km is within the data and the fit is very tight, so the estimate is reliable."
      - "About 39 minutes, but the estimate is unreliable because 7 km was never run."
      - "The model cannot be used because the intercept 0.5 is not meaningful."
      - "About 56 minutes, the time of the longest run."
    option_explanations:
      - |
        Correct. 5.5(7) + 0.5 = 39 minutes, an interpolation between 6 km and 8 km with r very close to 1.
      - |
        Predicting between observed x-values is interpolation and is exactly what the model is for.
      - |
        A nearly zero intercept is sensible here (no distance, no time), and in any case the intercept does not block prediction.
      - |
        56 minutes belongs to the 10 km run; it is not an estimate for 7 km.
    answer: 0

  # ---- Correlation, causation and modelling (3.7-3.10)
  - slug: alg1-u03-exam-q19
    type: multiple_choice
    topic_code: "3.7"
    source: "IM Algebra 1, Unit 3, Lesson 7"
    points: 1
    prompt: |
      A scatter plot slopes upward with points spread widely but with a clear trend. Which value of r fits best?
    options:
      - "0.98"
      - "0.55"
      - "−0.55"
      - "0.02"
    option_explanations:
      - |
        0.98 would mean the points lie almost exactly on a line, but they are widely spread.
      - |
        Correct. A visible upward trend with wide spread is a moderate positive correlation.
      - |
        The trend is upward, so r must be positive.
      - |
        0.02 would mean no visible trend at all.
    answer: 1

  - slug: alg1-u03-exam-q20
    type: multiple_choice
    topic_code: "3.7"
    source: "IM Algebra 1, Unit 3, Lesson 7"
    points: 1
    prompt: |
      Every point of a data set lies exactly on the line y = −2x + 7. What is r?
    options:
      - "−2"
      - "−1"
      - "1"
      - "7"
    option_explanations:
      - |
        −2 is the slope; r cannot be outside the interval from −1 to 1.
      - |
        Correct. A perfect linear relationship with a downward slope has r = −1.
      - |
        r = 1 would need an upward-sloping line, but this slope is negative.
      - |
        7 is the intercept and has nothing to do with r.
    answer: 1

  - slug: alg1-u03-exam-q21
    type: multiple_choice
    topic_code: "3.8"
    source: "IM Algebra 1, Unit 3, Lesson 8"
    points: 1
    prompt: |
      Technology reports r = −0.25 for the relationship between a city's rainfall and its number of sunny days in a month. How should this be described?
    options:
      - "A strong negative relationship"
      - "A weak negative relationship"
      - "A weak positive relationship"
      - "No relationship, since r is negative"
    option_explanations:
      - |
        Strong needs a size near 1; 0.25 is far from it.
      - |
        Correct. The sign is negative and the size, 0.25, is below 0.3, so the linear relationship is weak.
      - |
        The negative sign means more rain goes with fewer sunny days, not more.
      - |
        A negative r is still a relationship; it describes a downward trend.
    answer: 1

  - slug: alg1-u03-exam-q22
    type: multiple_choice
    topic_code: "3.9"
    source: "IM Algebra 1, Unit 3, Lesson 9"
    points: 1
    prompt: |
      Across many towns, the number of fire engines sent to a fire is strongly correlated with the dollar value of the damage. Which explanation is most reasonable?
    options:
      - "Fire engines cause damage, so fewer should be sent."
      - "Bigger fires both attract more engines and cause more damage."
      - "The correlation must be a coincidence."
      - "Damage causes engines to be built."
    option_explanations:
      - |
        There is no mechanism by which engines cause the damage; the correlation has a common cause.
      - |
        Correct. The size of the fire is the lurking variable driving both quantities.
      - |
        The pattern is consistent and explained by fire size, so it is not chance.
      - |
        Engines are dispatched before the damage total is known; this reverses nothing sensibly.
    answer: 1

  - slug: alg1-u03-exam-q23
    type: multiple_choice
    topic_code: "3.9"
    source: "IM Algebra 1, Unit 3, Lesson 9"
    points: 1
    prompt: |
      Which study design would best show whether a new study app causes higher test scores?
    options:
      - "Survey students who already use the app and compare their scores with those who do not."
      - "Randomly assign half of a class to use the app and half not, then compare scores."
      - "Collect a very large sample of app users' scores."
      - "Compute r between minutes of app use and test score."
    option_explanations:
      - |
        Students who choose the app may differ in motivation, a lurking variable the survey cannot remove.
      - |
        Correct. Random assignment balances lurking variables between the groups, so a difference can be credited to the app.
      - |
        Sample size sharpens a correlation but cannot turn observational data into evidence of cause.
      - |
        r measures the strength of a linear association in observational data; it does not address cause.
    answer: 1

  - slug: alg1-u03-exam-q24
    type: multiple_choice
    topic_code: "3.10"
    source: "IM Algebra 1, Unit 3, Lesson 10"
    points: 1
    prompt: |
      A modelling report on fossil data ends with "the model predicts a height of 236 cm for a 90 cm femur." Which addition makes the report complete?
    options:
      - "The value of r, the typical size of the residuals, and whether 90 cm is inside the range of the data."
      - "A statement that femur length causes height."
      - "The intercept interpreted as the height of an animal with no femur."
      - "A new line drawn through the two largest fossils."
    option_explanations:
      - |
        Correct. A prediction should be reported with its strength, its typical error and whether it is interpolation.
      - |
        The model shows a relationship between two body measurements, not a cause.
      - |
        A femur of length 0 does not exist, so that interpretation is meaningless.
      - |
        A line through two extreme points is a worse fit than the least-squares line already used.
    answer: 0

  # ---- Stimulus set C: screen time and sleep (3.7, 3.8, 3.9)
  - slug: alg1-u03-exam-q25
    type: multiple_choice
    topic_code: "3.8"
    source: "IM Algebra 1, Unit 3, Lesson 8"
    points: 1
    stimulus: |
      A health class surveyed 40 students about their average nightly screen time in hours, x, and their average hours of sleep, y. Technology gives the line y = −0.4x + 9.2 and r = −0.62. Screen time in the data ranged from 0.5 to 6 hours.
    prompt: |
      How should r = −0.62 be interpreted?
    options:
      - "A moderate negative relationship: more screen time tends to go with less sleep, with considerable variation."
      - "A strong relationship, because 0.62 is more than half."
      - "No relationship, because r is negative."
      - "Each hour of screen time reduces sleep by 0.62 hours."
    option_explanations:
      - |
        Correct. The sign is negative and the size, 0.62, is in the moderate range, so the trend is clear but the points are spread.
      - |
        "More than half" is not the test; strength is judged by closeness to 1, and 0.62 is moderate.
      - |
        A negative r describes a downward trend; it does not mean the variables are unrelated.
      - |
        The change in sleep per hour of screen time is the slope, −0.4, not r.
    answer: 0

  - slug: alg1-u03-exam-q26
    type: multiple_choice
    topic_code: "3.7"
    source: "IM Algebra 1, Unit 3, Lesson 7"
    points: 1
    stimulus: |
      A health class surveyed 40 students about their average nightly screen time in hours, x, and their average hours of sleep, y. Technology gives the line y = −0.4x + 9.2 and r = −0.62. Screen time in the data ranged from 0.5 to 6 hours.
    prompt: |
      One student reported 1 hour of screen time and only 5 hours of sleep, far below the line. If this student's data were removed, what would most likely happen to r?
    options:
      - "r would move closer to −1, because the remaining points fit the line more tightly."
      - "r would become positive."
      - "r would move closer to 0, because fewer points always weaken a correlation."
      - "r would be unchanged, because one point out of 40 cannot matter."
    option_explanations:
      - |
        Correct. A point far from the line weakens the fit; removing it leaves a cloud that hugs the line more closely, so the size of r rises.
      - |
        The other 39 points still trend downward, so the sign stays negative.
      - |
        The number of points does not set r; how close they are to a line does.
      - |
        One far-off point can noticeably change r, especially since it pulls the line as well.
    answer: 0

  - slug: alg1-u03-exam-q27
