  - slug: alg1-u07-exam-q34
    type: true_false
    topic_code: "7.9"
    source: "IM Algebra 1, Unit 7, Lesson 9"
    points: 1
    prompt: |
      True or false: to solve (x + 1)(x − 3) = 5, you may set x + 1 = 5 and x − 3 = 5.
    answer: false
    explanation: |
      False. The zero product property only applies when a product equals 0. Expand and rearrange first: x² − 2x − 3 = 5, so x² − 2x − 8 = 0, (x − 4)(x + 2) = 0, x = 4 or −2. Setting the factors to 5 gives x = 4 and x = 8, and 8 does not work: (9)(5) = 45.

  - slug: alg1-u07-exam-q35
