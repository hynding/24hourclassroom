unit: 7
description: |
  45 questions · about 90 minutes · every lesson of Unit 7 (7.1 to 7.24): writing quadratic equations,
  solving by reasoning, the zero product property, how many solutions, factoring with every sign pattern
  and with a leading coefficient, perfect squares and completing the square, irrational solutions, the
  quadratic formula and its derivation, the discriminant, rational and irrational numbers, vertex form by
  completing the square, maximum and minimum problems, and modelling, plus review of graphs from Unit 6.
  Two stimulus sets share a situation across consecutive items. Multiple choice, select-all, true/false
  and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short
  answers and the long answer are graded by your teacher against the scoring notes.
questions:
  # ---- Writing and reasoning about quadratic equations (7.1-7.5)
  - slug: alg1-u07-exam-q01
    type: multiple_choice
    topic_code: "7.1"
    source: "IM Algebra 1, Unit 7, Lesson 1"
    points: 1
    prompt: |
      A stone dropped from a 200-foot cliff has height h(t) = 200 − 16t². When is it 56 feet above the ground?
    options:
      - "After 3 seconds, because 16t² = 144 gives t = 3."
      - "After 9 seconds, because 144/16 = 9."
      - "After 12 seconds, because √144 = 12."
      - "After 3.5 seconds, because 56/16 = 3.5."
    option_explanations:
      - |
        Correct. 200 − 16t² = 56 means 16t² = 144, so t² = 9 and t = 3.
      - |
        144/16 = 9 is t², not t; the time is √9 = 3.
      - |
        √144 = 12 forgets to divide by 16 first; the equation is 16t² = 144.
      - |
        56 is the height remaining, not the distance fallen; the stone has fallen 144 feet.
    answer: 0

  - slug: alg1-u07-exam-q02
    type: multiple_choice
    topic_code: "7.2"
    source: "IM Algebra 1, Unit 7, Lesson 2"
    points: 1
    prompt: |
      A 10-inch by 14-inch poster has a border of uniform width x inches on every side, and the poster with its border covers 260 square inches. Which equation describes this?
    options:
      - "(10 + 2x)(14 + 2x) = 260"
      - "(10 + x)(14 + x) = 260"
      - "140 + 4x = 260"
      - "10 · 14 · x = 260"
    option_explanations:
      - |
        Correct. A border on every side adds 2x to each dimension, and the total area is the product.
      - |
        Each dimension grows by x on both ends, so by 2x in all.
      - |
        The border's area is not 4x; it grows quadratically with x, since the corners are x-by-x squares.
      - |
        Multiplying the poster's area by x has no meaning here.
    answer: 0

  - slug: alg1-u07-exam-q03
    type: multiple_choice
    topic_code: "7.3"
    source: "IM Algebra 1, Unit 7, Lesson 3"
    points: 1
    prompt: |
      What are the solutions of (x + 4)² = 81?
    options:
      - "x = 5 or x = −13"
      - "x = 5 only"
      - "x = 9 or x = −9"
      - "x = 77 or x = −85"
    option_explanations:
      - |
        Correct. x + 4 = 9 gives x = 5; x + 4 = −9 gives x = −13.
      - |
        (−13 + 4)² = (−9)² = 81 as well; a positive number has two square roots.
      - |
        9 and −9 are the values of x + 4, not of x.
      - |
        These use ±81 instead of ±9; the square root of 81 is 9.
    answer: 0

  - slug: alg1-u07-exam-q04
    type: multiple_choice
    topic_code: "7.4"
    source: "IM Algebra 1, Unit 7, Lesson 4"
    points: 1
    prompt: |
      What are the solutions of (3x − 2)(x + 5) = 0?
    options:
      - "x = 2/3 or x = −5"
      - "x = −2/3 or x = 5"
      - "x = 2 or x = −5"
      - "x = 3/2 or x = −5"
    option_explanations:
      - |
        Correct. 3x − 2 = 0 gives x = 2/3; x + 5 = 0 gives x = −5.
      - |
        The signs are reversed: 3x − 2 = 0 means 3x = 2, and x + 5 = 0 means x = −5.
      - |
        x = 2 gives (4)(7) = 28, not 0; the first factor is 0 at x = 2/3.
      - |
        3/2 would solve 2x − 3 = 0; here 3x = 2.
    answer: 0

  - slug: alg1-u07-exam-q05
    type: multiple_choice
    topic_code: "7.5"
    source: "IM Algebra 1, Unit 7, Lesson 5"
    points: 1
    prompt: |
      Which equation has exactly one solution?
    options:
      - "(x − 6)² = 0"
      - "x² = 36"
      - "x² + 36 = 0"
      - "(x − 6)² = 36"
    option_explanations:
      - |
        Correct. Only 0 squares to 0, so x − 6 = 0 and x = 6 is the single solution.
      - |
        x² = 36 has two solutions, 6 and −6, because both square to 36; that is a different equation from (x − 6)² = 0.
      - |
        x² = −36 has no real solutions, since a square is never negative.
      - |
        x − 6 = ±6 gives two solutions, 12 and 0.
    answer: 0

  - slug: alg1-u07-exam-q06
    type: multiple_choice
    topic_code: "7.5"
    source: "IM Algebra 1, Unit 7, Lesson 5"
    points: 1
    prompt: |
      Which description correctly uses a graph to solve x² − 2x = 8?
    options:
      - "Find where the graph of y = x² − 2x meets the horizontal line y = 8: at x = 4 and x = −2."
      - "Find where the graph of y = x² − 2x crosses the x-axis: at x = 0 and x = 2."
      - "Find where the graph of y = x² − 2x meets the line y = x: at x = 0 and x = 3."
      - "Find the vertex of y = x² − 2x: x = 1."
    option_explanations:
      - |
        Correct. The solutions are the inputs where the expression equals 8; checking, 16 − 8 = 8 and 4 + 4 = 8.
      - |
        The x-intercepts solve x² − 2x = 0, a different equation.
      - |
        Meeting the line y = x solves x² − 2x = x, not x² − 2x = 8.
      - |
        The vertex gives the minimum value, −1, which does not solve the equation.
    answer: 0

  # ---- Stimulus set A: a banner (7.2, 7.9, 7.4, 7.13)
  - slug: alg1-u07-exam-q07
    type: multiple_choice
    topic_code: "7.2"
    source: "IM Algebra 1, Unit 7, Lesson 2"
    points: 1
    stimulus: |
      A rectangular banner is 2 feet longer than it is wide and covers 24 square feet. Let w be its width in feet.
    prompt: |
      Which equation describes the banner?
    options:
      - "w(w + 2) = 24"
      - "w + (w + 2) = 24"
      - "2w + 2(w + 2) = 24"
      - "w² + 2 = 24"
    option_explanations:
      - |
        Correct. Width times length (w + 2) equals the area; expanded, w² + 2w = 24.
      - |
        Adding the two dimensions gives half the perimeter, not the area.
      - |
        This is the perimeter; the area is a product.
      - |
        w(w + 2) = w² + 2w; the extra 2 feet of length multiplies the whole width.
    answer: 0

  - slug: alg1-u07-exam-q08
    type: multiple_choice
    topic_code: "7.9"
    source: "IM Algebra 1, Unit 7, Lesson 9"
    points: 1
    stimulus: |
      A rectangular banner is 2 feet longer than it is wide and covers 24 square feet. Let w be its width in feet.
    prompt: |
      Rewritten as w² + 2w − 24 = 0, how does the equation factor, and what are its solutions?
    options:
      - "(w + 6)(w − 4) = 0; w = −6 or w = 4"
      - "(w − 6)(w + 4) = 0; w = 6 or w = −4"
      - "(w + 2)(w − 12) = 0; w = −2 or w = 12"
      - "w(w + 2) = 24; w = 24 or w = 22"
    option_explanations:
      - |
        Correct. 6 · (−4) = −24 and 6 + (−4) = 2, so (w + 6)(w − 4) = 0.
      - |
        (w − 6)(w + 4) = w² − 2w − 24, with the wrong middle sign.
      - |
        (w + 2)(w − 12) = w² − 10w − 24; the middle term is wrong.
      - |
        The zero product property needs 0 on one side; setting factors equal to 24 is not valid.
    answer: 0

  - slug: alg1-u07-exam-q09
    type: multiple_choice
    topic_code: "7.4"
    source: "IM Algebra 1, Unit 7, Lesson 4"
    points: 1
    stimulus: |
      A rectangular banner is 2 feet longer than it is wide and covers 24 square feet. Let w be its width in feet.
    prompt: |
      What are the banner's dimensions, and why is one solution of the equation rejected?
    options:
      - "4 feet by 6 feet; w = −6 is rejected because a width cannot be negative."
      - "6 feet by 8 feet; w = 4 is rejected because it is too small."
      - "4 feet by 6 feet and also −6 feet by −4 feet; both solutions are valid."
      - "24 feet by 1 foot; w = 4 is rejected because 4 · 6 ≠ 24."
    option_explanations:
      - |
        Correct. w = 4 gives length 6 and area 24; a negative width describes nothing.
      - |
        6 by 8 has area 48, not 24; and w = 4 is the valid solution.
      - |
        A rectangle cannot have negative sides; only w = 4 describes the banner.
      - |
        4 · 6 = 24, so w = 4 is right; 24 by 1 is not 2 feet longer than wide.
    answer: 0

  - slug: alg1-u07-exam-q10
    type: multiple_choice
    topic_code: "7.13"
    source: "IM Algebra 1, Unit 7, Lesson 13"
    points: 1
    stimulus: |
      A rectangular banner is 2 feet longer than it is wide and covers 24 square feet. Let w be its width in feet.
    prompt: |
      Solving w² + 2w = 24 by completing the square, which line is correct?
    options:
      - "(w + 1)² = 25, so w = 4 or w = −6"
      - "(w + 1)² = 24, so w = −1 ± √24"
      - "(w + 2)² = 28, so w = −2 ± √28"
      - "(w + 1)² = 23, so w = −1 ± √23"
    option_explanations:
      - |
        Correct. Half of 2 is 1, add 1² = 1 to both sides: 24 + 1 = 25; w + 1 = ±5.
      - |
        The 1 added on the left must also be added on the right: 24 + 1 = 25.
      - |
        Half of 2 is 1, not 2; (w + 2)² would need a middle term of 4w.
      - |
        1 is added to 24, not subtracted: the right side becomes 25.
    answer: 0

  # ---- Factoring and completing the square (7.6-7.15)
  - slug: alg1-u07-exam-q11
    type: multiple_choice
    topic_code: "7.6"
    source: "IM Algebra 1, Unit 7, Lesson 6"
    points: 1
    prompt: |
      Which is the factored form of x² + 11x + 30?
    options:
      - "(x + 5)(x + 6)"
      - "(x + 3)(x + 10)"
      - "(x + 2)(x + 15)"
      - "(x + 1)(x + 30)"
    option_explanations:
      - |
        Correct. 5 · 6 = 30 and 5 + 6 = 11, so (x + 5)(x + 6) expands to x² + 11x + 30.
      - |
        3 · 10 = 30 but 3 + 10 = 13, giving x² + 13x + 30.
      - |
        2 · 15 = 30 but 2 + 15 = 17, so (x + 2)(x + 15) expands to x² + 17x + 30.
      - |
        1 · 30 = 30 but 1 + 30 = 31, so (x + 1)(x + 30) expands to x² + 31x + 30.
    answer: 0

  - slug: alg1-u07-exam-q12
    type: multiple_choice
    topic_code: "7.7"
    source: "IM Algebra 1, Unit 7, Lesson 7"
    points: 1
    prompt: |
      Which is the factored form of x² − 4x − 21?
    options:
      - "(x − 7)(x + 3)"
      - "(x + 7)(x − 3)"
      - "(x − 7)(x − 3)"
      - "(x − 21)(x + 1)"
    option_explanations:
      - |
        Correct. (−7)(3) = −21 and −7 + 3 = −4, so (x − 7)(x + 3) expands to x² − 4x − 21.
      - |
        7 + (−3) = 4, giving x² + 4x − 21: the middle sign is wrong.
      - |
        (−7)(−3) = +21, not −21; this gives x² − 10x + 21.
      - |
        (−21)(1) = −21 but −21 + 1 = −20, not −4.
    answer: 0

  - slug: alg1-u07-exam-q13
    type: multiple_choice
    topic_code: "7.8"
    source: "IM Algebra 1, Unit 7, Lesson 8"
    points: 1
    prompt: |
      Which is the factored form of 9x² − 25?
    options:
      - "(3x − 5)(3x + 5)"
      - "(3x − 5)²"
      - "(9x − 25)(x + 1)"
      - "(3x − 5)(3x − 5) + 30x"
    option_explanations:
      - |
        Correct. 9x² = (3x)² and 25 = 5², a difference of squares; the middle terms 15x and −15x cancel.
      - |
        (3x − 5)² = 9x² − 30x + 25, with a middle term and a positive constant.
      - |
        (9x − 25)(x + 1) = 9x² − 16x − 25, which has a middle term.
      - |
        This is equivalent but is not a factored form; it is a sum, not a product.
    answer: 0

  - slug: alg1-u07-exam-q14
    type: multiple_choice
    topic_code: "7.10"
    source: "IM Algebra 1, Unit 7, Lesson 10"
    points: 1
    prompt: |
      Which is the factored form of 2x² − 9x + 4?
    options:
      - "(2x − 1)(x − 4)"
      - "(2x − 4)(x − 1)"
      - "(2x + 1)(x + 4)"
      - "(x − 1)(x − 4)"
    option_explanations:
      - |
        Correct. 2x · x = 2x², 2x · (−4) + (−1) · x = −9x, (−1)(−4) = 4.
      - |
        (2x − 4)(x − 1) = 2x² − 6x + 4; the middle term is −6x, not −9x.
      - |
        This expands to 2x² + 9x + 4, with the wrong middle sign.
      - |
        (x − 1)(x − 4) = x² − 5x + 4; the leading coefficient 2 is missing.
    answer: 0

  - slug: alg1-u07-exam-q15
    type: multiple_choice
    topic_code: "7.11"
    source: "IM Algebra 1, Unit 7, Lesson 11"
    points: 1
    prompt: |
      What are the solutions of x² + 18x + 81 = 4?
    options:
      - "x = −7 or x = −11"
      - "x = 7 or x = 11"
      - "x = −9 only"
      - "x = −5 or x = −13"
    option_explanations:
      - |
        Correct. The left side is (x + 9)², so x + 9 = ±2: x = −7 or x = −11.
      - |
        x + 9 = ±2 gives negative values of x; 7 + 9 = 16 and 16² = 256, not 4.
      - |
        −9 solves (x + 9)² = 0, but the right side is 4, so there are two solutions, 2 on either side of −9.
      - |
        These use x + 9 = ±4, forgetting to take the square root of 4.
    answer: 0

  - slug: alg1-u07-exam-q16
    type: multiple_choice
    topic_code: "7.12"
    source: "IM Algebra 1, Unit 7, Lesson 12"
    points: 1
    prompt: |
      Which is x² − 12x + 5 written in the form (x − k)² + m?
    options:
      - "(x − 6)² − 31"
      - "(x − 6)² + 5"
      - "(x − 6)² + 41"
      - "(x − 12)² − 139"
    option_explanations:
      - |
        Correct. Half of −12 is −6, square 36: x² − 12x + 36 − 36 + 5 = (x − 6)² − 31.
      - |
        The 36 added to complete the square must be subtracted again: 5 − 36 = −31.
      - |
        The 36 is subtracted, not added, after it goes inside the square.
      - |
        k is half the coefficient, 6, not 12; (x − 12)² has middle term −24x.
    answer: 0

  - slug: alg1-u07-exam-q17
    type: multiple_choice
    topic_code: "7.14"
    source: "IM Algebra 1, Unit 7, Lesson 14"
    points: 1
    prompt: |
      Solving 4x² + 8x − 5 = 0 by completing the square, which line is correct?
    options:
      - "x² + 2x = 5/4; (x + 1)² = 9/4; x = 1/2 or x = −5/2"
      - "4x² + 8x = 5; (2x + 2)² = 5; x = (−2 ± √5)/2"
      - "x² + 2x = 5; (x + 1)² = 6; x = −1 ± √6"
      - "x² + 8x = 5; (x + 4)² = 21; x = −4 ± √21"
    option_explanations:
      - |
        Correct. Divide by 4: x² + 2x − 5/4 = 0; add 1: (x + 1)² = 5/4 + 1 = 9/4; x + 1 = ±3/2. Check: (2x − 1)(2x + 5) factors the original.
      - |
        (2x + 2)² = 4x² + 8x + 4, so 4 must be added to both sides: (2x + 2)² = 9, which does give 1/2 and −5/2, but as written the right side is wrong.
      - |
        Dividing by 4 must apply to the constant too: −5 becomes −5/4, not −5.
      - |
        The x coefficient must also be divided by 4: 8x becomes 2x.
    answer: 0

  - slug: alg1-u07-exam-q18
    type: multiple_choice
    topic_code: "7.15"
    source: "IM Algebra 1, Unit 7, Lesson 15"
    points: 1
    prompt: |
      What are the exact solutions of x² − 6x + 2 = 0?
    options:
      - "x = 3 ± √7"
      - "x = 3 ± √2"
      - "x = −3 ± √7"
      - "x = 6 ± √7"
    option_explanations:
      - |
        Correct. x² − 6x = −2; add 9: (x − 3)² = 7; x = 3 ± √7, about 5.65 and 0.35.
      - |
        After adding 9 to both sides the right side is −2 + 9 = 7, not 2.
      - |
        x² − 6x completes to (x − 3)², so the solutions are centred at 3.
      - |
        Half of 6 is 3; the square is (x − 3)², not (x − 6)².
    answer: 0

  # ---- Stimulus set B: one equation, the formula and the discriminant (7.16, 7.17, 7.20, 7.22)
  - slug: alg1-u07-exam-q19
    type: multiple_choice
    topic_code: "7.16"
    source: "IM Algebra 1, Unit 7, Lesson 16"
    points: 1
    stimulus: |
      Consider the equation 3x² − 12x + 7 = 0.
    prompt: |
      What are a, b and c, and what is the discriminant?
    options:
      - "a = 3, b = −12, c = 7; b² − 4ac = 144 − 84 = 60"
      - "a = 3, b = 12, c = 7; b² − 4ac = 144 − 84 = 60"
      - "a = 3, b = −12, c = 7; b² − 4ac = −144 − 84 = −228"
      - "a = 3, b = −12, c = 7; b² − 4ac = 144 + 84 = 228"
    option_explanations:
      - |
        Correct. The coefficients carry their signs, and (−12)² − 4(3)(7) = 144 − 84 = 60.
      - |
        b is −12; the sign matters for −b in the formula, even though b² is the same.
      - |
        (−12)² = 144, positive; squaring removes the sign.
      - |
        c = 7 is positive, so −4ac = −84, which is subtracted.
    answer: 0

  - slug: alg1-u07-exam-q20
    type: multiple_choice
    topic_code: "7.17"
    source: "IM Algebra 1, Unit 7, Lesson 17"
    points: 1
    stimulus: |
      Consider the equation 3x² − 12x + 7 = 0.
    prompt: |
      Using the quadratic formula, what are the solutions to two decimal places?
    options:
      - "x = (12 ± √60)/6, about 3.29 and 0.71"
      - "x = (−12 ± √60)/6, about −0.71 and −3.29"
      - "x = (12 ± √60)/3, about 6.58 and 1.42"
      - "x = 12 ± √60/6, about 13.29 and 10.71"
    option_explanations:
      - |
        Correct. −b = 12, 2a = 6, √60 ≈ 7.75; (12 + 7.75)/6 ≈ 3.29 and (12 − 7.75)/6 ≈ 0.71.
      - |
        −b = −(−12) = 12, so the numerator starts with +12 and both solutions are positive.
      - |
        The denominator is 2a = 6, not a = 3; dividing by 3 doubles both solutions.
      - |
        The whole numerator, 12 ± √60, is divided by 6, not just the root.
    answer: 0

  - slug: alg1-u07-exam-q21
    type: multiple_choice
    topic_code: "7.20"
    source: "IM Algebra 1, Unit 7, Lesson 20"
    points: 1
    stimulus: |
      Consider the equation 3x² − 12x + 7 = 0.
    prompt: |
      What kind of solutions does the equation have, and how do you know before solving?
    options:
      - "Two irrational solutions, because the discriminant 60 is positive but not a perfect square."
      - "Two rational solutions, because the discriminant is positive."
      - "One solution, because the discriminant is not zero."
      - "No real solutions, because 7 is positive."
    option_explanations:
      - |
        Correct. A positive discriminant gives two solutions; since √60 is irrational, so are (12 ± √60)/6.
      - |
        Positive is not enough for rational solutions; the discriminant must also be a perfect square, and 60 is not.
      - |
        One solution happens only when the discriminant is 0; 60 ≠ 0 means two.
      - |
        The sign of c alone decides nothing; the discriminant 60 is positive, so there are two real solutions.
    answer: 0

  - slug: alg1-u07-exam-q22
    type: multiple_choice
    topic_code: "7.22"
    source: "IM Algebra 1, Unit 7, Lesson 22"
    points: 1
    stimulus: |
      Consider the equation 3x² − 12x + 7 = 0.
    prompt: |
      Which is 3x² − 12x + 7 written in vertex form, and what does it say about the graph of y = 3x² − 12x + 7?
    options:
      - "3(x − 2)² − 5; the minimum value is −5, at x = 2."
      - "3(x − 2)² + 7; the minimum value is 7, at x = 2."
      - "3(x − 4)² − 41; the minimum value is −41, at x = 4."
      - "3(x − 2)² − 5; the maximum value is −5, at x = 2."
    option_explanations:
      - |
        Correct. 3(x² − 4x) + 7 = 3(x − 2)² − 12 + 7 = 3(x − 2)² − 5; since a = 3 > 0 the vertex (2, −5) is a minimum, below the axis, consistent with two real zeros.
      - |
        The 4 inside the bracket is multiplied by 3, so 12 must be subtracted: 7 − 12 = −5.
      - |
        After factoring out 3 the x coefficient is −4, so the half is −2, not −4.
      - |
        The expression is correct, but a = 3 is positive, so the vertex is a minimum.
    answer: 0

  # ---- The formula, the discriminant, vertex form and modelling (7.16-7.24), with Unit 6 review
  - slug: alg1-u07-exam-q23
    type: multiple_choice
    topic_code: "7.18"
    source: "IM Algebra 1, Unit 7, Lesson 18"
    points: 1
    prompt: |
      To solve x² + 5x − 6 = 0, a student wrote x = (5 ± √(25 + 24))/2 = (5 ± 7)/2 and got x = 6 or x = −1. What went wrong?
    options:
      - "The numerator should start with −b = −5, giving (−5 ± 7)/2 = 1 or −6."
      - "The discriminant should be 25 − 24 = 1, giving (5 ± 1)/2 = 3 or 2."
      - "The denominator should be 2a = 4, giving (5 ± 7)/4 = 3 or −1/2."
      - "Nothing went wrong; 6 and −1 are the solutions."
    option_explanations:
      - |
        Correct. b = 5, so −b = −5; the solutions are (−5 + 7)/2 = 1 and (−5 − 7)/2 = −6. Check: 1 + 5 − 6 = 0 and 36 − 30 − 6 = 0.
      - |
        c = −6, so −4ac = −4(1)(−6) = +24 and the discriminant 25 + 24 = 49 is right; the sign slip is in −b.
      - |
        a = 1, so 2a = 2; the denominator was correct.
      - |
        Substituting 6 gives 36 + 30 − 6 = 60, not 0, so 6 is not a solution; the sign of −b was dropped.
    answer: 0

  - slug: alg1-u07-exam-q24
    type: multiple_choice
    topic_code: "7.19"
    source: "IM Algebra 1, Unit 7, Lesson 19"
    points: 1
    prompt: |
      Completing the square on ax² + bx + c = 0 reaches (x + b/(2a))² = (b² − 4ac)/(4a²). For x² + 6x − 7 = 0, what is the right-hand side, and what does it become?
    options:
      - "(36 + 28)/4 = 16, so (x + 3)² = 16 and x = −3 ± 4."
      - "(36 − 28)/4 = 2, so (x + 3)² = 2 and x = −3 ± √2."
      - "(36 + 28)/2 = 32, so (x + 3)² = 32 and x = −3 ± √32."
      - "(36 + 7)/4 = 43/4, so (x + 3)² = 43/4."
    option_explanations:
      - |
