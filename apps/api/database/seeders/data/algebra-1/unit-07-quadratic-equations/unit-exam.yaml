      - |
        (x − 4)² = x² − 8x + 16, which has a middle term; x² − 16 is (x − 4)(x + 4).
      - |
        Correct. The middle term −8x is 2 · (−4) · x and 16 = (−4)², so (x − 4)² expands to x² − 8x + 16.
      - |
