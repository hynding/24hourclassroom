  - slug: alg1-u07-exam-q43
    type: short_answer
    topic_code: "7.14"
    source: "IM Algebra 1, Unit 7, Lesson 14"
    points: 3
    prompt: |
      Solve 2x² + 8x − 10 = 0 by completing the square.

      (a) Divide every term by the leading coefficient and write the resulting equation.
      (b) Complete the square and find both solutions.
      (c) Verify your solutions by writing the original expression in factored form.
    answer: |
      (a) x² + 4x − 5 = 0.
      (b) x² + 4x = 5; add (4/2)² = 4 to both sides: (x + 2)² = 9, so x + 2 = ±3 and x = 1 or x = −5.
      (c) 2x² + 8x − 10 = 2(x² + 4x − 5) = 2(x + 5)(x − 1), which is zero exactly at x = −5 and x = 1.
    explanation: |
      Three points, one per part.

      (a) 1 pt: x² + 4x − 5 = 0, with the −10 divided too.

      (b) 1 pt: (x + 2)² = 9 and both solutions 1 and −5.

      (c) 1 pt: 2(x + 5)(x − 1), or substitution of both solutions into the original equation.

      Common errors: dividing only the x² term; adding 4 to one side; taking only the positive root.

  - slug: alg1-u07-exam-q44
    type: short_answer
    topic_code: "7.24"
    source: "IM Algebra 1, Unit 7, Lesson 24"
    points: 3
    prompt: |
      A ball is thrown from a balcony. Its height in feet after t seconds is h(t) = −16t² + 32t + 48.

      (a) State the starting height and find the maximum height and when it occurs.
      (b) Find when the ball lands, by factoring.
      (c) Find when the ball is back at the balcony's height, and explain how the answer to (a) could have predicted it.
    answer: |
      (a) h(0) = 48 feet. h(t) = −16(t² − 2t) + 48 = −16(t − 1)² + 16 + 48 = −16(t − 1)² + 64: maximum 64 feet at t = 1 second.
      (b) −16t² + 32t + 48 = −16(t² − 2t − 3) = −16(t − 3)(t + 1) = 0, so t = 3 (t = −1 is before the throw). It lands after 3 seconds.
      (c) h(t) = 48 means −16t² + 32t = 0, −16t(t − 2) = 0, t = 0 or 2: back at 48 feet at t = 2. The peak is at t = 1, and the graph is symmetric about t = 1, so t = 0 and t = 2 give the same height.
    explanation: |
      Three points, one per part.

      (a) 1 pt: 48 feet, and 64 feet at t = 1 (by vertex form or by the axis halfway between the zeros).

      (b) 1 pt: −16(t − 3)(t + 1) and t = 3 with t = −1 rejected.

      (c) 1 pt: t = 2 with the symmetry argument.

      Common errors: dividing h by −16 and reporting the maximum as 4; keeping t = −1; solving h(t) = 0 instead of h(t) = 48 in part (c).

  - slug: alg1-u07-exam-q45
    type: long_answer
    topic_code: "7.24"
    source: "IM Algebra 1, Unit 7, Lesson 24"
    points: 6
    prompt: |
      A shop finds that at a price of p dollars it sells 400 − 20p of an item per week. Each item costs the shop $4 to buy.

      (1) Write the weekly revenue R(p) and the weekly cost C(p) of the items sold, and show that the weekly profit is P(p) = −20p² + 480p − 1600.
      (2) Write P in vertex form and state the price that gives the greatest profit and what that profit is.
      (3) Find the prices at which the shop breaks even (profit 0), and explain why the lower one makes sense.
      (4) State a sensible domain for p and explain what happens to sales at the upper end of it.
    answer: |
      (1) R(p) = p(400 − 20p) = −20p² + 400p. C(p) = 4(400 − 20p) = 1600 − 80p. P(p) = R(p) − C(p) = −20p² + 400p − 1600 + 80p = −20p² + 480p − 1600.
      (2) P(p) = −20(p² − 24p) − 1600 = −20(p² − 24p + 144 − 144) − 1600 = −20(p − 12)² + 2880 − 1600 = −20(p − 12)² + 1280. Greatest profit $1,280 at a price of $12. Check: P(12) = −2880 + 5760 − 1600 = 1280.
      (3) −20(p² − 24p + 80) = −20(p − 4)(p − 20) = 0, so p = 4 or p = 20. At $4 the selling price equals the $4 cost of each item, so every sale earns nothing and the profit is 0.
      (4) 0 ≤ p ≤ 20. At p = 20 the quantity sold is 400 − 400 = 0: nobody buys at that price, so revenue, cost and profit are all 0, which is the other break-even price.
    explanation: |
      Six points.

      (1) 2 pts: 1 for R(p) = −20p² + 400p and C(p) = 1600 − 80p, 1 for the subtraction reaching −20p² + 480p − 1600.

      (2) 2 pts: 1 for −20(p − 12)² + 1280, 1 for $12 and $1,280 interpreted as price and profit.

      (3) 1 pt: p = 4 and p = 20 with the explanation that $4 is the unit cost.

      (4) 1 pt: 0 ≤ p ≤ 20 and sales of 0 at p = 20.

      Common errors: C(p) = 4 (forgetting to multiply by the quantity); dividing P by −20 and reporting a maximum profit of 64; subtracting 144 instead of 20 · 144 = 2880; keeping only p = 12 without the profit value.
