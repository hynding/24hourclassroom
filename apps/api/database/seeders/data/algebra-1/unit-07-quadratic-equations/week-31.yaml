    # ---- Short answer (7.17, 7.20)
    - slug: alg1-u07-w31-q23
      type: short_answer
      topic_code: "7.17"
      source: "IM Algebra 1, Unit 7, Lesson 17"
      points: 3
      prompt: |
        Solve 3x² + 5x − 2 = 0.

        (a) State a, b and c and compute the discriminant.
        (b) Apply the quadratic formula and give both solutions.
        (c) Confirm the solutions by factoring.
      answer: |
        (a) a = 3, b = 5, c = −2; b² − 4ac = 25 − 4(3)(−2) = 25 + 24 = 49.
        (b) x = (−5 ± 7)/6: x = 2/6 = 1/3 or x = −12/6 = −2.
        (c) 3x² + 5x − 2 = (3x − 1)(x + 2); zeros 1/3 and −2, the same.
      explanation: |
        Three points, one per part.

        (a) 1 pt: the coefficients and 49.

        (b) 1 pt: 1/3 and −2.

        (c) 1 pt: (3x − 1)(x + 2) with the match noted.

    - slug: alg1-u07-w31-q24
      type: short_answer
      topic_code: "7.20"
      source: "IM Algebra 1, Unit 7, Lesson 20"
      points: 3
      prompt: |
        Consider x² − 6x + 7 = 0.

        (a) Compute the discriminant and say how many solutions there are and whether they are rational or irrational.
        (b) Write the exact solutions.
        (c) Give the solutions to two decimal places and check one of them in the equation.
      answer: |
        (a) 36 − 28 = 8: positive, so two solutions; not a perfect square, so both are irrational.
        (b) x = (6 ± √8)/2, which simplifies to 3 ± √2.
        (c) About 4.41 and 1.59. Check 4.41: 19.45 − 26.46 + 7 ≈ −0.01, close to 0 (the small difference is rounding).
      explanation: |
        Three points, one per part.

        (a) 1 pt: 8, two irrational solutions.

        (b) 1 pt: (6 ± √8)/2 or 3 ± √2.

        (c) 1 pt: 4.41 and 1.59 with a check.

    # ---- Long answer (7.18)
    - slug: alg1-u07-w31-q25
      type: long_answer
      topic_code: "7.18"
      source: "IM Algebra 1, Unit 7, Lesson 18"
      points: 6
      prompt: |
        A ball is thrown and its height in feet after t seconds is h(t) = −16t² + 40t + 6.

        (1) Write the equation for the moment the ball lands, and state a, b and c.
        (2) Use the quadratic formula to find both solutions to two decimal places, and say which one is the landing time.
        (3) A classmate wrote t = (−40 ± √(1,600 − 384))/(−32) and got t ≈ 0.16 and t ≈ 2.34. Identify the error and explain how it changed the answer.
        (4) Check the landing time by substituting it into h(t), and explain why the result is close to but not exactly 0.
      answer: |
        (1) −16t² + 40t + 6 = 0; a = −16, b = 40, c = 6.
        (2) b² − 4ac = 1,600 − 4(−16)(6) = 1,600 + 384 = 1,984; √1,984 ≈ 44.54. t = (−40 ± 44.54)/(−32): t ≈ 4.54/(−32) ≈ −0.14 or t ≈ −84.54/(−32) ≈ 2.64. The landing is at t ≈ 2.64 s; −0.14 is before the throw.
        (3) The classmate computed −4ac as −384, but a = −16 and c = 6 give −4(−16)(6) = +384. The discriminant became 1,216 instead of 1,984, so the square root was too small (about 34.87) and both times were wrong.
        (4) h(2.64) = −16(6.9696) + 105.6 + 6 ≈ −111.51 + 111.6 ≈ 0.09. It is not exactly 0 because 2.64 is rounded; the exact solution (−40 − √1,984)/(−32) would give 0.
      explanation: |
        Six points.

        (1) 1 pt: the equation with a = −16, b = 40, c = 6.

        (2) 2 pts: 1 for the discriminant 1,984 and both times, 1 for choosing 2.64.

        (3) 2 pts: 1 for naming the sign error in −4ac, 1 for explaining its effect.

        (4) 1 pt: the substitution giving about 0.1 with the rounding explanation.

        Common errors: dividing by −16 or 32 instead of −32; dropping the negative solution without comment; expecting the check to give exactly 0.
