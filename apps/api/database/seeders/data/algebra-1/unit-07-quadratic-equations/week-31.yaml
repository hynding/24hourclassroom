week: 31
unit: 7
title: "The Quadratic Formula"
topics: ["7.16", "7.17", "7.18", "7.19", "7.20"]
guide: guides/week-31.md
guide_description: |
  The quadratic formula x = (−b ± √(b² − 4ac))/(2a), reading a, b and c from the standard form, applying
  the formula to equations that do and do not factor, the errors that most often spoil it and how to
  check a solution, where the formula comes from (completing the square on ax² + bx + c = 0), and using
  the discriminant b² − 4ac to predict rational, irrational, one or no solutions.
flashcards_description: |
  28 cards on the formula and its parts, rearranging to standard form, worked solutions, the four
  classic errors, three ways to check, the plan and key line of the derivation, the discriminant, and
  rational versus irrational numbers and solutions.

flashcards:
  - front: The quadratic formula → statement
    back: |
      For ax² + bx + c = 0 with a ≠ 0: x = (−b ± √(b² − 4ac))/(2a). The whole numerator is divided by 2a.
    topic_code: "7.16"
  - front: Reading a, b and c → with their signs
    back: |
      Put the equation in the form ax² + bx + c = 0 first. In 2x² − 5x − 3 = 0, a = 2, b = −5, c = −3.
    topic_code: "7.16"
  - front: Rearranging before using the formula
    back: |
      x² = 3x + 5 becomes x² − 3x − 5 = 0, so a = 1, b = −3, c = −5. The formula applies only to a side equal to 0.
    topic_code: "7.16"
  - front: Solving 2x² − 5x − 3 = 0 with the formula
    back: |
      x = (5 ± √(25 + 24))/4 = (5 ± 7)/4: x = 3 or x = −1/2. Factoring, (2x + 1)(x − 3), agrees.
    topic_code: "7.16"
  - front: What the formula is, in one sentence
    back: |
      Completing the square done once, in general, so the result can be reused for every quadratic equation.
    topic_code: "7.16"
  - front: Solving x² + 6x + 4 = 0 with the formula
    back: |
      x = (−6 ± √(36 − 16))/2 = (−6 ± √20)/2, about −0.76 and −5.24. (This is the same as −3 ± √5.)
    topic_code: "7.17"
  - front: Solving x² = 3x + 5 with the formula
    back: |
      Rearrange to x² − 3x − 5 = 0: x = (3 ± √(9 + 20))/2 = (3 ± √29)/2, about 4.19 and −1.19.
    topic_code: "7.17"
  - front: Choosing a solving method → guide
    back: |
      A square already isolated: take roots. An obvious integer pair: factor. Otherwise: complete the square or use the formula; the formula always works.
    topic_code: "7.17"
  - front: Formula with a negative leading coefficient
    back: |
      −16t² + 40t + 6 = 0: either use a = −16, b = 40, c = 6 directly, or multiply through by −1 first; both give t ≈ 2.64 and t ≈ −0.14.
    topic_code: "7.17"
  - front: Solving 3x² + 5x − 2 = 0 with the formula
    back: |
      x = (−5 ± √(25 + 24))/6 = (−5 ± 7)/6: x = 1/3 or x = −2.
    topic_code: "7.17"
  - front: Classic error → forgetting that the denominator is 2a
    back: |
      For 2x² − 5x − 3 = 0 the denominator is 4, not 2. Dividing by 2 gives 6 and −1, neither of which checks.
    topic_code: "7.18"
  - front: Classic error → the sign of −b
    back: |
      If b = −5 then −b = 5. Writing −5 in the numerator flips both solutions to the wrong side.
    topic_code: "7.18"
  - front: Classic error → b² when b is negative
    back: |
      (−5)² = 25, positive. Writing −25 under the root makes the discriminant wrong, often negative.
    topic_code: "7.18"
  - front: Classic error → −4ac when c is negative
    back: |
      −4(1)(−5) = +20. The discriminant of x² − 4x − 5 is 16 + 20 = 36, not 16 − 20.
    topic_code: "7.18"
  - front: Checking a solution → three ways
    back: |
      Substitute it into the original equation; solve again by a different method; or graph and read the x-intercepts. Substitution is exact, graphing is quick but approximate.
    topic_code: "7.18"
  - front: Checking x = 5 in x² − 4x − 5 = 0
    back: |
      25 − 20 − 5 = 0 ✓. Checking the decimal 2.64 in −16t² + 40t + 6 gives about 0.1, close to 0 because 2.64 is rounded.
    topic_code: "7.18"
  - front: Deriving the formula → the plan
    back: |
      Start with ax² + bx + c = 0, divide by a, move c/a across, add (b/(2a))² to both sides, write the left side as a square, take roots, solve for x.
    topic_code: "7.19"
  - front: Deriving the formula → the key line
    back: |
      (x + b/(2a))² = b²/(4a²) − c/a = (b² − 4ac)/(4a²). Taking roots: x + b/(2a) = ±√(b² − 4ac)/(2a).
    topic_code: "7.19"
  - front: Why 2a is in the denominator
    back: |
      b/(2a) is half the x coefficient after dividing by a, and √(4a²) = 2a when taking the root of the right side. Both pieces share the denominator 2a.
    topic_code: "7.19"
  - front: Discriminant → definition
    back: |
      b² − 4ac, the expression under the square root. It "discriminates" between the kinds of solutions.
    topic_code: "7.20"
  - front: Discriminant and the number of solutions
    back: |
      Positive: two real solutions. Zero: exactly one (the ± adds and subtracts 0). Negative: none, since a negative number has no real square root.
    topic_code: "7.20"
  - front: Discriminant and the type of solutions
    back: |
      With integer a, b, c: a perfect square discriminant (0, 1, 4, 9, …) gives rational solutions; a positive non-square gives irrational ones.
    topic_code: "7.20"
  - front: Rational number → definition
    back: |
      A number that can be written as a fraction of integers with a non-zero denominator: 3, −1/2, 0.75, 0.333… Its decimal ends or repeats.
    topic_code: "7.20"
  - front: Irrational number → definition and examples
    back: |
      A number that is not rational: √2, √7, √20, π. Its decimal never ends and never repeats.
    topic_code: "7.20"
  - front: Is √49 irrational?
    back: |
      No: √49 = 7, a whole number. A square root is irrational only when the number under it is not a perfect square (and is not a perfect-square fraction).
    topic_code: "7.20"
  - front: x² − 6x + 7 = 0 → type of solutions
    back: |
      Discriminant 36 − 28 = 8, positive and not a perfect square: two irrational solutions, (6 ± √8)/2 = 3 ± √2.
    topic_code: "7.20"
  - front: A mistake to avoid → using the formula on x² = 3x + 5 as it stands
    back: |
      a, b and c come from ax² + bx + c = 0. Reading c = 5 and b = 3 from x² = 3x + 5 gives the wrong signs; rearrange first.
    topic_code: "7.16"
  - front: A mistake to avoid → splitting the square root
    back: |
      √(16 + 20) = √36 = 6, not √16 + √20. Add under the root first, then take the root of the total.
    topic_code: "7.18"

quiz:
  description: |
    25 questions · about 45 minutes · the quadratic formula, applying it, spotting and avoiding errors,
    checking solutions, its derivation, and the discriminant (lessons 7.16 to 7.20), with review of
    completing the square and irrational solutions from week 30, factoring and the zero product property
    from week 29, checking solutions by substitution from unit 2, and projectile functions. Multiple
    choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the
    scoring notes.
  questions:
    # ---- Stimulus set: one equation, four looks (7.16, 7.16, 7.20, 7.10)
    - slug: alg1-u07-w31-q01
      type: multiple_choice
      topic_code: "7.16"
      source: "IM Algebra 1, Unit 7, Lesson 16"
      points: 1
      stimulus: |
        Consider the equation 2x² − 5x − 3 = 0.
      prompt: |
        What are the values of a, b and c for the quadratic formula?
      options:
        - "a = 2, b = 5, c = 3"
        - "a = 2, b = −5, c = 3"
        - "a = 1, b = −5, c = −3"
        - "a = 2, b = −5, c = −3"
      option_explanations:
        - |
          The signs matter: b is the coefficient −5 and c is the constant −3.
        - |
          The constant term is −3, not 3; the sign in front of it is part of c.
        - |
          a is the coefficient of x², which is 2 here.
        - |
          Correct. The equation is already in the form ax² + bx + c = 0, and the signs travel with the coefficients.
      answer: 3

    - slug: alg1-u07-w31-q02
      type: multiple_choice
      topic_code: "7.16"
      source: "IM Algebra 1, Unit 7, Lesson 16"
      points: 1
      stimulus: |
        Consider the equation 2x² − 5x − 3 = 0.
      prompt: |
        Using the quadratic formula, what are the solutions?
      options:
        - "x = 3 or x = −1/2"
        - "x = −3 or x = 1/2"
        - "x = (5 ± √1)/4, so x = 3/2 or x = 1"
        - "x = 6 or x = −1"
      option_explanations:
        - |
          Correct. x = (5 ± √(25 + 24))/4 = (5 ± 7)/4, giving 12/4 = 3 and −2/4 = −1/2.
        - |
          These have the wrong signs; −b = 5, so the numerator is 5 ± 7, not −5 ± 7.
        - |
          The discriminant is 25 − 4(2)(−3) = 25 + 24 = 49, not 25 − 24; with c negative, −4ac is positive.
        - |
          6 and −1 come from dividing by 2 instead of 2a = 4.
      answer: 0

    - slug: alg1-u07-w31-q03
      type: multiple_choice
      topic_code: "7.20"
      source: "IM Algebra 1, Unit 7, Lesson 20"
      points: 1
      stimulus: |
        Consider the equation 2x² − 5x − 3 = 0.
      prompt: |
        What does the discriminant tell you about the solutions before you finish solving?
      options:
        - "It is −23, so there are no real solutions."
        - "It is 1, so the solutions are irrational."
        - "It is 49, a positive perfect square, so there are two rational solutions."
        - "It is 49, so there is exactly one solution."
      option_explanations:
        - |
          −23 would come from 25 − 48; the discriminant is 25 + 24 = 49, positive.
        - |
          25 − 24 = 1 uses −4ac = −24, but c = −3 makes −4ac = +24; and even a discriminant of 1 is a perfect square, giving rational solutions.
        - |
          Correct. b² − 4ac = 25 + 24 = 49 = 7², so the square root is a whole number and both solutions are fractions of integers.
        - |
          One solution happens only when the discriminant is 0; 49 is positive, so there are two.
      answer: 2

    - slug: alg1-u07-w31-q04
      type: multiple_choice
      topic_code: "7.10"
      source: "IM Algebra 1, Unit 7, Lesson 10"
      points: 1
      stimulus: |
        Consider the equation 2x² − 5x − 3 = 0.
      prompt: |
        Which factorisation of the left side confirms the solutions?
      options:
        - "(2x − 1)(x + 3), giving x = 1/2 or x = −3"
        - "(2x + 1)(x − 3), giving x = −1/2 or x = 3"
        - "(x − 3)(x + 1), giving x = 3 or x = −1"
        - "(2x − 3)(x + 1), giving x = 3/2 or x = −1"
      option_explanations:
        - |
          (2x − 1)(x + 3) = 2x² + 5x − 3, with the wrong middle sign.
        - |
          Correct. (2x + 1)(x − 3) = 2x² − 6x + x − 3 = 2x² − 5x − 3, and its zeros match the formula's.
        - |
          (x − 3)(x + 1) = x² − 2x − 3; the leading coefficient 2 is missing.
        - |
          (2x − 3)(x + 1) = 2x² − x − 3, whose middle term is −x, not −5x.
      answer: 1

    # ---- Multiple choice (7.16–7.20, 7.13, 2.4)
    - slug: alg1-u07-w31-q05
      type: multiple_choice
      topic_code: "7.16"
      source: "IM Algebra 1, Unit 7, Lesson 16"
      points: 1
      prompt: |
        Which is the quadratic formula for the solutions of ax² + bx + c = 0?
      options:
        - "x = (−b ± √(b² + 4ac))/(2a)"
        - "x = −b ± √(b² − 4ac)/(2a)"
        - "x = (−b ± √(b² − 4ac))/(2a)"
        - "x = (b ± √(b² − 4ac))/(2a)"
      option_explanations:
        - |
          The discriminant is b² − 4ac, with a minus sign.
        - |
          Written this way only the root is divided by 2a; −b must be divided as well.
        - |
          Correct. The entire numerator −b ± √(b² − 4ac) is divided by 2a.
        - |
          The numerator starts with −b, the opposite of the x coefficient.
      answer: 2

    - slug: alg1-u07-w31-q06
      type: multiple_choice
      topic_code: "7.17"
      source: "IM Algebra 1, Unit 7, Lesson 17"
      points: 1
      prompt: |
        What are the solutions of x² + 6x + 4 = 0?
      options:
        - "x = (6 ± √20)/2, about 5.24 and 0.76"
        - "x = (−6 ± √20)/2, about −0.76 and −5.24"
        - "x = −2 or x = −4"
        - "x = (−6 ± √52)/2, about 0.61 and −6.61"
      option_explanations:
        - |
          −b = −6, not 6; both solutions are negative, as the positive coefficients suggest.
        - |
          Correct. b² − 4ac = 36 − 16 = 20, so x = (−6 ± √20)/2; √20 ≈ 4.47 gives −0.76 and −5.24. (Equivalently −3 ± √5.)
        - |
          −2 and −4 solve x² + 6x + 8 = 0; here (−2)² + 6(−2) + 4 = −4, not 0.
        - |
          52 would come from 36 + 16; with c = 4 positive, −4ac = −16.
      answer: 1

    - slug: alg1-u07-w31-q07
      type: multiple_choice
      topic_code: "7.17"
      source: "IM Algebra 1, Unit 7, Lesson 17"
      points: 1
      prompt: |
        To solve x² = 3x + 5 with the quadratic formula, what must be done first, and what are the solutions?
      options:
        - "Rewrite as x² − 3x − 5 = 0; x = (3 ± √29)/2"
        - "Divide by x to get x = 3 + 5/x; x = 8"
        - "Rewrite as x² − 3x + 5 = 0; x = (3 ± √(9 − 20))/2"
        - "Use a = 1, b = 3, c = 5 directly; x = (−3 ± √(9 − 20))/2"
      option_explanations:
        - |
          Correct. With everything on one side, a = 1, b = −3, c = −5, and b² − 4ac = 9 + 20 = 29.
        - |
          Dividing by x is not a valid rearrangement for solving, and 8 does not check: 64 ≠ 29.
        - |
          Moving 5 across changes its sign: the constant becomes −5.
        - |
          Reading b and c from the right side gives the wrong signs and a negative discriminant; the equation has two real solutions.
      answer: 0

    - slug: alg1-u07-w31-q08
      type: multiple_choice
      topic_code: "7.18"
      source: "IM Algebra 1, Unit 7, Lesson 18"
      points: 1
      prompt: |
        A student solving x² − 4x − 5 = 0 writes x = (4 ± √(16 − 20))/2 and concludes there are no solutions. What went wrong?
      options:
        - "Nothing; the equation has no real solutions."
        - "The denominator should be 1, not 2."
        - "The numerator should start with −4, not 4."
        - "−4ac = −4(1)(−5) = +20, so the discriminant is 16 + 20 = 36 and the solutions are 5 and −1."
      option_explanations:
        - |
          x = 5 checks: 25 − 20 − 5 = 0, so there are solutions.
        - |
          The denominator 2a = 2 · 1 = 2 is correct; the slip is under the square root.
        - |
          b = −4, so −b = 4; the sign of the numerator is right.
        - |
          Correct. With c negative, −4ac is positive; x = (4 ± 6)/2 gives 5 and −1, and (x − 5)(x + 1) confirms.
      answer: 3

    - slug: alg1-u07-w31-q09
      type: multiple_choice
      topic_code: "2.4"
      source: "IM Algebra 1, Unit 2, Lesson 4"
      points: 1
      prompt: |
        Which check correctly confirms that x = 5 is a solution of x² − 4x − 5 = 0?
      options:
        - "5² − 4(5) − 5 = 25 − 20 − 5 = 10"
        - "(5 − 5)(5 + 1) = 0, so the formula was right"
        - "5² − 4(5) − 5 = 25 − 20 − 5 = 0"
        - "5 is positive and the constant is negative, so it must work"
      option_explanations:
        - |
          The arithmetic is wrong: 25 − 20 − 5 = 0, not 10.
        - |
          This uses the factored form, which may itself contain the error; substitute into the original equation instead.
        - |
          Correct. Substituting into the original equation and getting a true statement is the check.
        - |
          Signs alone prove nothing; the value must be substituted.
      answer: 2

    - slug: alg1-u07-w31-q10
      type: multiple_choice
      topic_code: "7.19"
      source: "IM Algebra 1, Unit 7, Lesson 19"
      points: 1
      prompt: |
        In deriving the quadratic formula from ax² + bx + c = 0, after dividing by a and completing the square, which equation appears?
      options:
        - "(x + b/(2a))² = c/a − b²/(4a²)"
        - "(x + b/(2a))² = (b² − 4ac)/(4a²)"
        - "(x + b/a)² = b²/a² − c/a"
        - "(x + b)² = b² − 4ac"
      option_explanations:
        - |
          The constant moves across as −c/a, so the right side is b²/(4a²) − c/a, with the terms in this order.
        - |
          Correct. x² + (b/a)x = −c/a; adding (b/(2a))² = b²/(4a²) to both sides gives b²/(4a²) − c/a = (b² − 4ac)/(4a²).
        - |
          Half of b/a is b/(2a), not b/a; the square must use the half.
        - |
          Without dividing by a first the left side is not a perfect square of x + b.
      answer: 1

    - slug: alg1-u07-w31-q11
      type: multiple_choice
      topic_code: "7.20"
      source: "IM Algebra 1, Unit 7, Lesson 20"
      points: 1
      prompt: |
        What is the discriminant of 3x² + 2x + 5 = 0, and what does it mean?
      options:
        - "−56; the equation has no real solutions."
        - "−56; the equation has two irrational solutions."
        - "64; the equation has two rational solutions."
        - "4; the equation has two rational solutions."
      option_explanations:
        - |
          Correct. 2² − 4(3)(5) = 4 − 60 = −56, and a negative number has no real square root; the graph of y = 3x² + 2x + 5 stays above the x-axis.
        - |
          A negative discriminant means the square root does not exist as a real number, so there are no solutions, irrational or otherwise.
        - |
          64 would be 4 + 60; with c positive, −4ac is negative.
        - |
          4 is only b²; the −4ac part, −60, must be included.
      answer: 0

    - slug: alg1-u07-w31-q12
      type: multiple_choice
      topic_code: "7.20"
      source: "IM Algebra 1, Unit 7, Lesson 20"
      points: 1
      prompt: |
        Which equation has two irrational solutions?
      options:
        - "x² + x + 1 = 0"
        - "x² + 4x + 4 = 0"
        - "x² − 2x − 3 = 0"
        - "x² − 2x − 4 = 0"
      option_explanations:
        - |
          The discriminant is 1 − 4 = −3: no real solutions.
        - |
          The discriminant is 16 − 16 = 0: one rational solution, x = −2.
        - |
          The discriminant is 4 + 12 = 16 = 4², so the solutions 3 and −1 are rational.
        - |
          Correct. The discriminant is 4 + 16 = 20, positive but not a perfect square, so the solutions are 1 ± √5.
      answer: 3

    - slug: alg1-u07-w31-q13
      type: multiple_choice
      topic_code: "7.13"
      source: "IM Algebra 1, Unit 7, Lesson 13"
      points: 1
      prompt: |
        Solving x² + 8x + 7 = 0 by completing the square, which line is correct?
      options:
        - "(x + 4)² = 9, so x = −1 or x = −7"
        - "(x + 8)² = 57, so x = −8 ± √57"
        - "(x + 4)² = 23, so x = −4 ± √23"
        - "(x + 4)² = 7, so x = −4 ± √7"
      option_explanations:
        - |
          Correct. x² + 8x = −7; add 16: (x + 4)² = 9; x + 4 = ±3. Factoring, (x + 1)(x + 7), agrees.
        - |
          Half of 8 is 4; (x + 8)² would need a middle term of 16x.
        - |
          23 adds 16 to 7 instead of to −7; the constant moved across as −7.
        - |
          The 16 added on the left must also be added on the right: −7 + 16 = 9.
      answer: 0

    # ---- Select-all (7.18, 7.9)
    - slug: alg1-u07-w31-q14
      type: multi_select
      topic_code: "7.18"
      source: "IM Algebra 1, Unit 7, Lesson 18"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about using the quadratic formula correctly are true? Select all that apply.
      options:
        - "The whole numerator is divided by 2a, not by 2."
        - "The formula can be applied without first making one side 0."
        - "If a is positive and c is negative, −4ac is positive."
        - "If b is negative, −b is positive."
        - "b² is positive whether b is positive or negative."
      option_explanations:
        - |
          Correct. For 2x² − 5x − 3 = 0 the denominator is 4; dividing by 2 gives wrong answers.
        - |
          a, b and c are defined by ax² + bx + c = 0; reading them from x² = 3x + 5 without rearranging gives wrong signs.
        - |
          Correct. −4(1)(−5) = +20, which makes the discriminant larger, not smaller.
        - |
          Correct. −(−5) = 5; the numerator begins with the opposite of b.
        - |
          Correct. (−5)² = 25; squaring removes the sign.
      answer: [0, 2, 3, 4]

    - slug: alg1-u07-w31-q15
      type: multi_select
      topic_code: "7.9"
      source: "IM Algebra 1, Unit 7, Lesson 9"
      points: 2
      partial_credit: true
      prompt: |
        Which values are solutions of x² − x − 12 = 0? Select all that apply.
      options:
        - "−4"
        - "3"
        - "−3"
        - "12"
        - "4"
      option_explanations:
        - |
          (−4)² − (−4) − 12 = 16 + 4 − 12 = 8, not 0, so −4 is not a solution.
        - |
          9 − 3 − 12 = −6, not 0; the signs of the factors are (x − 4)(x + 3).
        - |
          Correct. (−3)² − (−3) − 12 = 9 + 3 − 12 = 0, so −3 satisfies the equation.
        - |
          144 − 12 − 12 = 120, not 0; the constant is not a solution just because it appears in the equation.
        - |
          Correct. 16 − 4 − 12 = 0; the equation factors as (x − 4)(x + 3) = 0.
      answer: [2, 4]

    # ---- True/false (7.20, 7.15)
    - slug: alg1-u07-w31-q16
      type: true_false
      topic_code: "7.20"
      source: "IM Algebra 1, Unit 7, Lesson 20"
      points: 1
      prompt: |
        True or false: if a, b and c are integers and b² − 4ac is a perfect square, the solutions of ax² + bx + c = 0 are rational.
      answer: true
      explanation: |
        True. The square root of a perfect square is an integer, so −b ± √(b² − 4ac) is an integer and dividing by the integer 2a gives a fraction of integers. For 2x² − 5x − 3 = 0 the discriminant is 49 and the solutions are 3 and −1/2.

    - slug: alg1-u07-w31-q17
      type: true_false
      topic_code: "7.15"
      source: "IM Algebra 1, Unit 7, Lesson 15"
      points: 1
      prompt: |
        True or false: the solutions of (x − 1)² = 5 are 1 + √5 and 1 − √5.
      answer: true
      explanation: |
        True. Taking both square roots gives x − 1 = ±√5, so x = 1 ± √5, about 3.24 and −1.24.

    # ---- Fill in the blank (7.16, 7.12)
    - slug: alg1-u07-w31-q18
      type: fill_blank
      topic_code: "7.16"
      source: "IM Algebra 1, Unit 7, Lesson 16"
      points: 1
      prompt: |
        In the quadratic formula, the expression under the square root is b² − ____.
      answer: ["4ac", "4 a c", "4 · a · c", "4*a*c", "four a c"]
      explanation: |
        b² − 4ac is the discriminant; its sign and whether it is a perfect square tell how many and what kind of solutions there are.

    - slug: alg1-u07-w31-q19
      type: fill_blank
