        What is the maximum value of f(x) = −2x² + 12x − 7?
      answer: { value: 11, tolerance: 0 }
      explanation: |
        −2(x² − 6x) − 7 = −2(x − 3)² + 18 − 7 = −2(x − 3)² + 11, so the maximum is 11, at x = 3.

    - slug: alg1-u07-w32-q21
      type: numeric
      topic_code: "7.24"
      source: "IM Algebra 1, Unit 7, Lesson 24"
      points: 1
      prompt: |
        The graphs of y = 2x + 1 and y = x² − 2 meet at two points. What is the larger x-coordinate?
      answer: { value: 3, tolerance: 0 }
      explanation: |
        2x + 1 = x² − 2 gives x² − 2x − 3 = 0, (x − 3)(x + 1) = 0, so x = 3 or x = −1.

