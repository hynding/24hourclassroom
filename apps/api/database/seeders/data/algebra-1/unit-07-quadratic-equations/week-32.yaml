week: 32
unit: 7
title: "Vertex Form Revisited and Modeling with Quadratics"
topics: ["7.21", "7.22", "7.23", "7.24"]
guide: guides/week-32.md
guide_description: |
  What happens when rational and irrational numbers are added or multiplied, rewriting any quadratic
  function in vertex form by completing the square (including a leading coefficient), using the vertex
  to answer maximum and minimum questions, and full modelling problems: starting value, peak, landing,
  and where a line meets a parabola.
flashcards_description: |
  28 cards on sums and products of rational and irrational numbers and the arguments behind them, the
  steps and checks for rewriting a function in vertex form, maximum and minimum problems for revenue,
  cost and projectiles, which form answers which question, and solving f(x) = g(x) for intersections.

flashcards:
  - front: Sum of two rational numbers → always rational
    back: |
      a/b + c/d = (ad + bc)/(bd), a fraction of integers with a non-zero denominator. 2/3 + 1/4 = 11/12.
    topic_code: "7.21"
  - front: Product of two rational numbers → always rational
    back: |
      (a/b)(c/d) = ac/(bd), again a fraction of integers. (2/3)(1/4) = 2/12 = 1/6.
    topic_code: "7.21"
  - front: Rational plus irrational → always irrational
    back: |
      If 5 + √3 were rational, subtracting the rational 5 would leave √3 rational, which it is not. So 5 + √3 is irrational.
    topic_code: "7.21"
  - front: Non-zero rational times irrational → always irrational
    back: |
      If 2√7 were rational, dividing by the rational 2 would make √7 rational, a contradiction. (0 times anything is 0, which is rational, so the rational factor must be non-zero.)
    topic_code: "7.21"
  - front: Irrational plus irrational → could be either
    back: |
      √2 + (−√2) = 0, rational; √2 + √3 is irrational. No general rule: check the particular numbers.
    topic_code: "7.21"
  - front: Irrational times irrational → could be either
    back: |
      √2 · √8 = √16 = 4, rational; √2 · √3 = √6, irrational. Again, no general rule.
    topic_code: "7.21"
  - front: Why 5 + √3 is irrational → the argument
    back: |
      Suppose it is rational, say p/q. Then √3 = p/q − 5, a difference of rationals, so rational; but √3 is irrational. The supposition fails.
    topic_code: "7.21"
  - front: 4x² + bx + 9 = 0 → how b controls the solutions
    back: |
      Discriminant b² − 144. b = ±12: one solution. |b| < 12: none. |b| > 12: two, rational when b² − 144 is a perfect square (b = 13 gives 25, b = 15 gives 81) and irrational otherwise (b = 14 gives 52).
    topic_code: "7.21"
  - front: Rewriting a function in vertex form → steps
    back: |
      1. Factor a out of the x² and x terms (if a ≠ 1). 2. Add and subtract (half the x coefficient)² inside. 3. Write the perfect square. 4. Multiply the subtracted part by a and combine constants.
    topic_code: "7.22"
  - front: x² − 6x + 2 → vertex form
    back: |
      x² − 6x + 9 − 9 + 2 = (x − 3)² − 7. Vertex (3, −7).
    topic_code: "7.22"
  - front: 2x² + 8x + 1 → vertex form
    back: |
      2(x² + 4x) + 1 = 2(x² + 4x + 4 − 4) + 1 = 2(x + 2)² − 8 + 1 = 2(x + 2)² − 7. Vertex (−2, −7).
    topic_code: "7.22"
  - front: −x² + 4x + 1 → vertex form
    back: |
      −(x² − 4x) + 1 = −(x² − 4x + 4 − 4) + 1 = −(x − 2)² + 4 + 1 = −(x − 2)² + 5. Vertex (2, 5), a maximum.
    topic_code: "7.22"
  - front: Leading coefficient in a function → factor, do not divide
    back: |
      For an equation equal to 0 you may divide by a; for a function you may not, since that changes its values. Factor a out of the first two terms instead.
    topic_code: "7.22"
  - front: Checking a vertex form → method
    back: |
      Expand it back: 2(x + 2)² − 7 = 2x² + 8x + 8 − 7 = 2x² + 8x + 1 ✓. Also check the y-intercept matches.
    topic_code: "7.22"
  - front: Vertex from the zeros instead of completing the square
    back: |
      If the expression factors, average the zeros: x² − 8x + 12 = (x − 2)(x − 6), vertex at x = 4, value −4. Completing the square gives (x − 4)² − 4: same.
    topic_code: "7.22"
  - front: Maximum or minimum → reading it from a(x − h)² + k
    back: |
      k is the minimum value when a > 0 and the maximum value when a < 0; it occurs at x = h.
    topic_code: "7.23"
  - front: Revenue R(p) = −4p² + 80p → the best price
    back: |
      −4(p² − 20p) = −4(p − 10)² + 400. Best price $10, revenue $400. (The zeros 0 and 20 average to 10 as well.)
    topic_code: "7.23"
  - front: Cost C(x) = x² − 12x + 50 → the minimum
    back: |
      (x − 6)² + 14. The least cost is 14, at x = 6.
    topic_code: "7.23"
  - front: Maximum of −2x² + 12x − 7
    back: |
      −2(x² − 6x) − 7 = −2(x − 3)² + 18 − 7 = −2(x − 3)² + 11. Maximum 11 at x = 3.
    topic_code: "7.23"
  - front: h(t) = −16t² + 64t + 20 → vertex form and peak
    back: |
      −16(t² − 4t) + 20 = −16(t − 2)² + 64 + 20 = −16(t − 2)² + 84. Peak 84 feet at t = 2.
    topic_code: "7.23"
  - front: Which form answers which question → summary
    back: |
      Starting value: the constant c in standard form. Landing or break-even: the zeros, by factoring or the formula. Peak or best price: the vertex, by vertex form or by averaging the zeros.
    topic_code: "7.24"
  - front: Landing time for h(t) = −16t² + 64t + 20
    back: |
      −16t² + 64t + 20 = 0; divide by −4: 4t² − 16t − 5 = 0; t = (16 ± √(256 + 80))/8 = (16 ± √336)/8 ≈ 4.29 s (the other root is negative).
    topic_code: "7.24"
  - front: Where a line meets a parabola → method
    back: |
      Set the two expressions equal and solve the resulting quadratic equation; each solution x gives a point (x, y) on both graphs.
    topic_code: "7.24"
  - front: y = x + 1 and y = x² − 2x − 3 → intersections
    back: |
      x + 1 = x² − 2x − 3 gives x² − 3x − 4 = 0, (x − 4)(x + 1) = 0: points (4, 5) and (−1, 0).
    topic_code: "7.24"
  - front: Ball h(t) = −16t² + 48t + 5 and drone d(t) = 5 + 8t → same height when
    back: |
      −16t² + 48t + 5 = 5 + 8t gives −16t² + 40t = 0, t(−16t + 40) = 0: t = 0 (both start at 5 ft) and t = 2.5 (both at 25 ft).
    topic_code: "7.24"
  - front: Checking a modelling answer → habits
    back: |
      Substitute back into the original function, reject inputs outside the domain (negative times, negative prices), and ask whether the size of the answer is sensible.
    topic_code: "7.24"
  - front: A mistake to avoid → dividing a function by a to reach vertex form
    back: |
      2x² + 8x + 1 is not x² + 4x + 1/2; those are different functions. Factor the 2 out and keep it: 2(x + 2)² − 7.
    topic_code: "7.22"
  - front: A mistake to avoid → "the sum of two irrationals is irrational"
    back: |
      √2 and −√2 are both irrational and add to 0. The guaranteed cases are rational + irrational and non-zero rational × irrational.
    topic_code: "7.21"

quiz:
  description: |
    25 questions · about 45 minutes · sums and products of rational and irrational numbers, vertex form by
    completing the square, maximum and minimum problems, and modelling with quadratic equations (lessons
    7.21 to 7.24), with review of the discriminant, the quadratic formula, irrational solutions and the
    zero product property from earlier in the unit, and graphs of situations from unit 6. Multiple
    choice, select-all, true/false and numeric items are graded at once; fill-in-the-blank items are
    matched automatically; the short answers and the long answer are graded by your teacher against the
    scoring notes.
  questions:
    # ---- Stimulus set: a launched ball (7.22, 7.23, 7.24, 6.14)
    - slug: alg1-u07-w32-q01
      type: multiple_choice
      topic_code: "7.22"
      source: "IM Algebra 1, Unit 7, Lesson 22"
      points: 1
      stimulus: |
        A ball is launched from a platform. Its height in feet after t seconds is h(t) = −16t² + 64t + 20.
      prompt: |
        Which is h(t) written in vertex form?
      options:
        - "h(t) = −16(t − 4)² + 276"
        - "h(t) = −16(t + 2)² + 84"
        - "h(t) = −16(t − 2)² + 20"
        - "h(t) = −16(t − 2)² + 84"
      option_explanations:
        - |
          Half of −4 is −2, not −4; and −16(t − 4)² + 276 expands to −16t² + 128t + 20, the wrong function.
        - |
          t² − 4t completes to (t − 2)², not (t + 2)²; the vertex is at t = 2.
        - |
          The 4 added inside the bracket is multiplied by −16, so 64 must be added to the constant: 20 + 64 = 84.
        - |
          Correct. −16(t² − 4t) + 20 = −16(t² − 4t + 4 − 4) + 20 = −16(t − 2)² + 64 + 20; expanding gives back −16t² + 64t + 20.
      answer: 3

    - slug: alg1-u07-w32-q02
      type: multiple_choice
      topic_code: "7.23"
      source: "IM Algebra 1, Unit 7, Lesson 23"
      points: 1
      stimulus: |
        A ball is launched from a platform. Its height in feet after t seconds is h(t) = −16t² + 64t + 20.
      prompt: |
        What is the ball's maximum height, and when is it reached?
      options:
        - "84 feet at t = 2 seconds"
        - "20 feet at t = 0 seconds"
        - "84 feet at t = 4 seconds"
        - "64 feet at t = 2 seconds"
      option_explanations:
        - |
          Correct. In −16(t − 2)² + 84 the square is 0 at t = 2 and negative-times-positive otherwise, so 84 is the greatest value.
        - |
          20 is the launch height; the ball rises well above it.
        - |
          At t = 4 the ball is back at 20 feet, by symmetry about t = 2.
        - |
          64 is the launch speed in feet per second, not a height; h(2) = −64 + 128 + 20 = 84.
      answer: 0

    - slug: alg1-u07-w32-q03
      type: multiple_choice
      topic_code: "7.24"
      source: "IM Algebra 1, Unit 7, Lesson 24"
      points: 1
      stimulus: |
        A ball is launched from a platform. Its height in feet after t seconds is h(t) = −16t² + 64t + 20.
      prompt: |
        When does the ball reach the ground, to two decimal places?
      options:
        - "About 2.29 seconds"
        - "About 4.29 seconds, the positive solution of −16t² + 64t + 20 = 0"
        - "Exactly 4 seconds, by symmetry about t = 2"
        - "About 0.29 seconds"
      option_explanations:
        - |
          At t = 2.29 the ball is near its peak, about 82.6 feet up.
        - |
          Correct. Dividing by −4 gives 4t² − 16t − 5 = 0; t = (16 ± √(256 + 80))/8 = (16 ± √336)/8 ≈ (16 ± 18.33)/8; the positive root is about 4.29.
        - |
          Symmetry about t = 2 puts the ball back at its launch height, 20 feet, at t = 4; it still has 20 feet to fall.
        - |
          0.29 comes from (16 − 18.33)/8 with the sign dropped; that root is −0.29, before the launch.
      answer: 1

    - slug: alg1-u07-w32-q04
      type: multiple_choice
      topic_code: "6.14"
      source: "IM Algebra 1, Unit 6, Lesson 14"
      points: 1
      stimulus: |
        A ball is launched from a platform. Its height in feet after t seconds is h(t) = −16t² + 64t + 20.
      prompt: |
        What is the platform's height, and what domain describes the flight?
      options:
        - "84 feet; 0 ≤ t ≤ 2"
        - "20 feet; all real numbers"
        - "20 feet; 0 ≤ t ≤ 4.29"
        - "64 feet; 0 ≤ t ≤ 4"
      option_explanations:
        - |
          84 feet is the peak, not the platform, and the flight continues past the peak until the landing.
        - |
          The parabola extends forever, but negative times and times after the landing describe nothing.
        - |
          Correct. h(0) = 20 is the starting height, and the ball is in the air from the launch until it lands at about 4.29 s.
        - |
          64 is the launch speed; the ball lands at about 4.29 s, not 4.
      answer: 2

    # ---- Multiple choice (7.21–7.24, 7.20, 6.16)
    - slug: alg1-u07-w32-q05
      type: multiple_choice
      topic_code: "7.21"
      source: "IM Algebra 1, Unit 7, Lesson 21"
      points: 1
      prompt: |
        Which statement about 3 + √2 is correct, and why?
      options:
        - "It is irrational, because every sum involving a square root is irrational."
        - "It is rational, because 3 is rational."
        - "It is irrational: if it were rational, subtracting 3 would make √2 rational, which it is not."
        - "It is rational, because it equals about 4.414, a decimal."
      option_explanations:
        - |
          3 + √4 = 5 is rational; what matters is whether the root itself is irrational.
        - |
          One rational term does not make the sum rational; the irrational part remains.
        - |
          Correct. The difference of two rational numbers is rational, so a rational 3 + √2 would force √2 to be rational.
        - |
          Every real number has a decimal; 4.414 is a rounding of a decimal that never ends or repeats.
      answer: 2

    - slug: alg1-u07-w32-q06
      type: multiple_choice
      topic_code: "7.21"
      source: "IM Algebra 1, Unit 7, Lesson 21"
      points: 1
      prompt: |
        Which of these products is rational?
      options:
        - "(1/2) · √8"
        - "√3 · √5"
        - "2 · √7"
        - "√2 · √8"
      option_explanations:
        - |
          (1/2)√8 = √8/2 ≈ 1.414, which is √2, irrational.
        - |
          √3 · √5 = √15, and 15 is not a perfect square.
        - |
          A non-zero rational times an irrational is irrational: if 2√7 were rational, so would √7 be.
        - |
          Correct. √2 · √8 = √16 = 4; two irrational numbers can have a rational product.
      answer: 3

    - slug: alg1-u07-w32-q07
      type: multiple_choice
      topic_code: "7.20"
      source: "IM Algebra 1, Unit 7, Lesson 20"
      points: 1
      prompt: |
        For which value of b does 4x² + bx + 9 = 0 have exactly one solution?
      options:
        - "b = 6"
        - "b = 12 (or b = −12)"
        - "b = 36"
        - "b = 0"
      option_explanations:
        - |
          36 − 144 = −108, negative: no solutions.
        - |
          Correct. The discriminant b² − 4(4)(9) = b² − 144 is 0 when b = ±12; then 4x² + 12x + 9 = (2x + 3)², one solution.
        - |
          1,296 − 144 = 1,152, positive: two solutions.
        - |
          0 − 144 = −144, negative: 4x² + 9 = 0 has no real solutions.
      answer: 1

    - slug: alg1-u07-w32-q08
      type: multiple_choice
      topic_code: "7.22"
      source: "IM Algebra 1, Unit 7, Lesson 22"
      points: 1
      prompt: |
        Which is x² − 6x + 2 written in vertex form?
      options:
        - "(x − 3)² − 7"
        - "(x − 3)² + 2"
        - "(x − 6)² − 34"
        - "(x − 3)² + 11"
      option_explanations:
        - |
          Correct. x² − 6x + 9 − 9 + 2 = (x − 3)² − 7; check: x² − 6x + 9 − 7 = x² − 6x + 2.
        - |
          The 9 added to complete the square must be subtracted again: 2 − 9 = −7.
        - |
          Half of −6 is −3; (x − 6)² has middle term −12x.
        - |
          The 9 is subtracted, not added, after it goes inside the square.
      answer: 0

    - slug: alg1-u07-w32-q09
      type: multiple_choice
      topic_code: "7.22"
      source: "IM Algebra 1, Unit 7, Lesson 22"
      points: 1
      prompt: |
        Which is 2x² + 8x + 1 written in vertex form?
      options:
        - "(x + 2)² − 3"
        - "2(x + 2)² − 7"
        - "2(x + 4)² − 31"
        - "2(x + 2)² − 3"
      option_explanations:
        - |
          The leading coefficient 2 cannot be dropped from a function; this expands to x² + 4x + 1.
        - |
          Correct. 2(x² + 4x) + 1 = 2(x² + 4x + 4 − 4) + 1 = 2(x + 2)² − 8 + 1 = 2(x + 2)² − 7.
        - |
          After factoring out 2 the x coefficient is 4, so the half is 2, not 4.
        - |
          The 4 subtracted inside the bracket is multiplied by 2, so 8 is subtracted, not 4: 1 − 8 = −7.
      answer: 1

    - slug: alg1-u07-w32-q10
      type: multiple_choice
      topic_code: "7.22"
      source: "IM Algebra 1, Unit 7, Lesson 22"
      points: 1
      prompt: |
        Which is −x² + 4x + 1 written in vertex form, and what is its vertex?
      options:
        - "−(x − 2)² + 5; vertex (2, 5)"
        - "−(x + 2)² + 5; vertex (−2, 5)"
        - "−(x − 2)² − 3; vertex (2, −3)"
        - "(x − 2)² + 5; vertex (2, 5)"
      option_explanations:
        - |
          Correct. −(x² − 4x) + 1 = −(x² − 4x + 4 − 4) + 1 = −(x − 2)² + 4 + 1 = −(x − 2)² + 5.
        - |
          Factoring out −1 leaves x² − 4x, which completes to (x − 2)².
        - |
          The −4 inside the bracket is multiplied by −1, giving +4, so the constant is 1 + 4 = 5.
        - |
          The leading coefficient is −1 and must stay; the parabola opens downward.
      answer: 0

    - slug: alg1-u07-w32-q11
      type: multiple_choice
      topic_code: "7.23"
      source: "IM Algebra 1, Unit 7, Lesson 23"
      points: 1
      prompt: |
        A club's revenue from selling snacks at p dollars each is R(p) = −4p² + 80p. What price gives the greatest revenue, and what is it?
      options:
        - "$5, giving $300"
        - "$20, giving $0"
        - "$10, giving $400"
        - "$80, giving $400"
      option_explanations:
        - |
          R(5) = −100 + 400 = 300, but R(10) = 400 is larger.
        - |
          p = 20 is a zero: −1,600 + 1,600 = 0, no revenue at all.
        - |
          Correct. −4(p² − 20p) = −4(p − 10)² + 400; the maximum 400 occurs at p = 10. (The zeros 0 and 20 also average to 10.)
        - |
          80 is the coefficient of p; the best price is 10.
      answer: 2

    - slug: alg1-u07-w32-q12
      type: multiple_choice
      topic_code: "6.16"
      source: "IM Algebra 1, Unit 6, Lesson 16"
      points: 1
      prompt: |
        A factory's daily cost in thousands of dollars when it runs x machines is C(x) = (x − 6)² + 14. What is the least possible cost?
      options:
        - "50 thousand dollars, with 0 machines"
        - "6 thousand dollars, with 14 machines"
        - "0 dollars, with 6 machines"
        - "14 thousand dollars, with 6 machines"
      option_explanations:
        - |
          C(0) = 36 + 14 = 50 is the cost with no machines, the largest of these, not the least.
        - |
          The coordinates are swapped: 6 is the number of machines and 14 the cost.
        - |
          The square can be 0 but the constant 14 remains; the cost is never 0.
        - |
          Correct. The square is never negative and is 0 at x = 6, so C is smallest there: 0 + 14 = 14.
      answer: 3

    - slug: alg1-u07-w32-q13
      type: multiple_choice
      topic_code: "7.24"
      source: "IM Algebra 1, Unit 7, Lesson 24"
      points: 1
      prompt: |
        Where do the graphs of y = x + 1 and y = x² − 2x − 3 intersect?
      options:
        - "At (4, 5) only"
        - "At (1, 2) and (−3, −2)"
        - "At (3, 4) and (−1, 0)"
        - "At (4, 5) and (−1, 0)"
      option_explanations:
        - |
          x = −1 is also a solution: both graphs pass through (−1, 0).
        - |
          At x = 1 the line gives 2 but the parabola gives −4.
        - |
          At x = 3 the line gives 4 but the parabola gives 9 − 6 − 3 = 0; they do not meet there.
        - |
          Correct. x + 1 = x² − 2x − 3 gives x² − 3x − 4 = 0, (x − 4)(x + 1) = 0, so x = 4 or x = −1; the y-values come from y = x + 1.
      answer: 3

    # ---- Select-all (7.21, 7.20)
    - slug: alg1-u07-w32-q14
      type: multi_select
      topic_code: "7.21"
      source: "IM Algebra 1, Unit 7, Lesson 21"
      points: 2
      partial_credit: true
      prompt: |
        Which of these numbers are irrational? Select all that apply.
      options:
        - "2 − √3"
        - "π + 1"
        - "(√5)²"
        - "√2/3"
        - "√9"
      option_explanations:
        - |
          Correct. √3 is irrational, and subtracting it from a rational number gives an irrational result.
        - |
          Correct. π is irrational, and adding the rational number 1 keeps it irrational.
        - |
          (√5)² = 5, rational; squaring undoes the root.
        - |
          Correct. A non-zero rational (1/3) times an irrational (√2) is irrational.
        - |
          √9 = 3, a whole number, so it is rational.
      answer: [0, 1, 3]

    - slug: alg1-u07-w32-q15
      type: multi_select
      topic_code: "7.20"
      source: "IM Algebra 1, Unit 7, Lesson 20"
      points: 2
      partial_credit: true
      prompt: |
        Which equations have two rational solutions? Select all that apply.
      options:
        - "2x² − 7x + 3 = 0"
        - "x² − 5x + 5 = 0"
        - "x² − 9 = 0"
        - "x² − 5x + 6 = 0"
        - "x² + 4 = 0"
      option_explanations:
        - |
          Correct. Discriminant 49 − 24 = 25: solutions 3 and 1/2.
        - |
          Discriminant 25 − 20 = 5, not a perfect square: two irrational solutions.
        - |
          Correct. Discriminant 0 + 36 = 36: solutions 3 and −3.
        - |
          Correct. Discriminant 25 − 24 = 1, a perfect square: solutions 3 and 2.
        - |
          Discriminant 0 − 16 = −16: no real solutions.
      answer: [0, 2, 3]

    # ---- True/false (7.21, 7.16)
    - slug: alg1-u07-w32-q16
      type: true_false
      topic_code: "7.21"
      source: "IM Algebra 1, Unit 7, Lesson 21"
      points: 1
      prompt: |
        True or false: the sum of two irrational numbers is always irrational.
      answer: false
      explanation: |
        False. √2 and −√2 are both irrational, and their sum is 0, which is rational. (The sum of a rational and an irrational number, by contrast, is always irrational.)

    - slug: alg1-u07-w32-q17
      type: true_false
      topic_code: "7.16"
      source: "IM Algebra 1, Unit 7, Lesson 16"
      points: 1
      prompt: |
        True or false: for x² + 2x − 8 = 0 the quadratic formula gives x = (−2 ± 6)/2, so the solutions are 2 and −4.
      answer: true
      explanation: |
        True. a = 1, b = 2, c = −8; the discriminant is 4 + 32 = 36, whose root is 6; (−2 + 6)/2 = 2 and (−2 − 6)/2 = −4. Factoring, (x + 4)(x − 2), agrees.

    # ---- Fill in the blank (7.22, 7.4)
    - slug: alg1-u07-w32-q18
      type: fill_blank
      topic_code: "7.22"
      source: "IM Algebra 1, Unit 7, Lesson 22"
      points: 1
      prompt: |
        In vertex form, x² + 10x + 3 is (x + 5)² − ____.
      answer: ["22", "twenty-two", "twenty two"]
      explanation: |
        x² + 10x + 25 − 25 + 3 = (x + 5)² − 22.

    - slug: alg1-u07-w32-q19
      type: fill_blank
      topic_code: "7.4"
      source: "IM Algebra 1, Unit 7, Lesson 4"
      points: 1
      prompt: |
        The solutions of x(x − 9) = 0 are x = 0 and x = ____.
      answer: ["9", "nine"]
      explanation: |
        By the zero product property, x = 0 or x − 9 = 0.

    # ---- Numeric (7.23, 7.24, 7.15)
    - slug: alg1-u07-w32-q20
      type: numeric
