    # ---- Short answer (7.22, 7.21)
    - slug: alg1-u07-w32-q23
      type: short_answer
      topic_code: "7.22"
      source: "IM Algebra 1, Unit 7, Lesson 22"
      points: 3
      prompt: |
        f(x) = x² − 8x + 10.

        (a) Rewrite f in vertex form, showing your steps.
        (b) State the minimum value of f and where it occurs.
        (c) Find the zeros of f exactly and to two decimal places.
      answer: |
        (a) x² − 8x + 16 − 16 + 10 = (x − 4)² − 6.
        (b) Minimum −6 at x = 4 (a = 1 > 0, so the vertex is the lowest point).
        (c) (x − 4)² = 6, x = 4 ± √6; about 6.45 and 1.55.
      explanation: |
        Three points, one per part.

        (a) 1 pt: (x − 4)² − 6 with the 16 added and subtracted.

        (b) 1 pt: −6 at x = 4.

        (c) 1 pt: 4 ± √6 with the decimals.

    - slug: alg1-u07-w32-q24
      type: short_answer
      topic_code: "7.21"
      source: "IM Algebra 1, Unit 7, Lesson 21"
      points: 3
      prompt: |
        (a) Show that the sum of 2/3 and 1/4 is rational by writing it as a single fraction of integers.
        (b) Explain why 5 + √3 must be irrational.
        (c) Give two irrational numbers whose product is rational, and show the product.
      answer: |
        (a) 2/3 + 1/4 = 8/12 + 3/12 = 11/12, a fraction of integers with non-zero denominator.
        (b) Suppose 5 + √3 were rational. Then √3 = (5 + √3) − 5 would be a difference of two rational numbers, hence rational. But √3 is irrational, so the supposition is impossible.
        (c) √2 and √8: √2 · √8 = √16 = 4. (Or √3 · √3 = 3.)
      explanation: |
        Three points, one per part.

        (a) 1 pt: 11/12 with the fraction form noted.

        (b) 1 pt: the contradiction argument.

        (c) 1 pt: a correct pair with the product computed.

    # ---- Long answer (7.24)
    - slug: alg1-u07-w32-q25
      type: long_answer
      topic_code: "7.24"
      source: "IM Algebra 1, Unit 7, Lesson 24"
      points: 6
      prompt: |
        A ball is thrown upward from a balcony; its height in feet after t seconds is h(t) = −16t² + 48t + 5. At the same moment a drone starts rising from the same height at a steady 8 feet per second, so its height is d(t) = 5 + 8t.

        (1) Rewrite h in vertex form and state the ball's maximum height and when it occurs.
        (2) Find when the ball lands, to two decimal places.
        (3) Find the times at which the ball and the drone are at the same height, and the height at each time.
        (4) Describe the flight in words over its domain, including when the ball is above the drone.
      answer: |
        (1) −16(t² − 3t) + 5 = −16(t − 1.5)² + 36 + 5 = −16(t − 1.5)² + 41. Maximum 41 feet at t = 1.5 s.
        (2) −16t² + 48t + 5 = 0: discriminant 2,304 + 320 = 2,624, √2,624 ≈ 51.22; t = (−48 − 51.22)/(−32) ≈ 3.10 s (the other root, about −0.10, is before the throw).
        (3) −16t² + 48t + 5 = 5 + 8t gives −16t² + 40t = 0, t(−16t + 40) = 0: t = 0 and t = 2.5. At t = 0 both are at 5 feet; at t = 2.5 both are at 5 + 20 = 25 feet (check: −100 + 120 + 5 = 25).
        (4) Domain 0 ≤ t ≤ 3.10. The ball leaves the balcony at 5 feet, rises to 41 feet at 1.5 s, passes the drone on the way down at 2.5 s (25 feet), and lands at about 3.10 s. It is above the drone for 0 < t < 2.5 and below it afterwards.
      explanation: |
        Six points.

        (1) 2 pts: 1 for −16(t − 1.5)² + 41, 1 for 41 feet at 1.5 s.

        (2) 1 pt: about 3.10 s with the negative root rejected.

        (3) 2 pts: 1 for t = 0 and t = 2.5, 1 for the heights 5 and 25.

        (4) 1 pt: a correct description with the interval 0 < t < 2.5.

        Common errors: (t − 3)² instead of (t − 1.5)²; forgetting 16 · 2.25 = 36 when completing the square; dividing by t in (3) and losing t = 0.
