week: 28
unit: 7
title: "Quadratic Equations by Reasoning and the Zero Product Property"
topics: ["7.1", "7.2", "7.3", "7.4", "7.5"]
guide: guides/week-28.md
guide_description: |
  Finding the input that gives a known output, writing quadratic equations for areas, frames and
  projectiles, solving equations such as (x − 1)² = 16 by reasoning about squares, the zero product
  property for equations in factored form, why the other side must be 0 first, and why a quadratic
  equation can have two, one or no solutions.
flashcards_description: |
  28 cards on unknown inputs, writing quadratic equations from situations, solving by isolating a square
  and taking both roots, the zero product property and its one condition, solutions as intersections of a
  parabola and a horizontal line, and the three possible numbers of solutions.

flashcards:
  - front: Finding an unknown input → the question being asked
    back: |
      The output is known and the input is wanted: when is the ball 36 feet up, what width gives an area of 40. It means solving an equation.
    topic_code: "7.1"
  - front: Why unknown inputs are harder for quadratic functions
    back: |
      Undoing a square is not a single step, and two different inputs can share one output, so there may be two answers, or none.
    topic_code: "7.1"
  - front: When h(t) = 100 − 16t² equals 36 → reasoning it out
    back: |
      16t² must be 64, so t² = 4 and t = 2 (t = −2 is before the drop). Working backwards one operation at a time.
    topic_code: "7.1"
  - front: Guess-and-check with a table → when it works
    back: |
      When the answer is a whole number the table happens to include. w(w + 3) = 40 is found at w = 5; w(w + 3) = 50 is not, so a method is needed.
    topic_code: "7.1"
  - front: Quadratic equation → definition
    back: |
      An equation that can be written as ax² + bx + c = 0 with a ≠ 0. w(w + 3) = 40, (x − 1)² = 16 and 3x² = 48 are all quadratic.
    topic_code: "7.2"
  - front: Garden w metres wide and 3 metres longer, area 40 → equation
    back: |
      w(w + 3) = 40, or w² + 3w − 40 = 0. Length times width equals area.
    topic_code: "7.2"
  - front: Frame of width x around an 8-by-10 picture → total area
    back: |
      (8 + 2x)(10 + 2x): the frame adds x to every side, so 2x to each dimension. Set it equal to the given area to get an equation.
    topic_code: "7.2"
  - front: Projectile reaching the ground → equation
    back: |
      h(t) = 0: for h(t) = 64t − 16t² that is 64t − 16t² = 0. The positive solution is the landing time.
    topic_code: "7.2"
  - front: Why a graph gives only approximate solutions
    back: |
      Reading where a curve crosses a line is limited by the scale; x² − 4x − 3 = 0 looks like about −0.6 and 4.6 but the exact values are irrational. Algebra gives exact answers.
    topic_code: "7.2"
  - front: Solving x² = 49 by reasoning
    back: |
      Two numbers square to 49: x = 7 or x = −7. Write both.
    topic_code: "7.3"
  - front: Solving (x − 1)² = 16 by reasoning
    back: |
      The quantity being squared is 4 or −4: x − 1 = 4 gives x = 5, x − 1 = −4 gives x = −3.
    topic_code: "7.3"
  - front: Solving 3x² − 5 = 70
    back: |
      Isolate the square: 3x² = 75, x² = 25, x = 5 or x = −5.
    topic_code: "7.3"
  - front: Square isolated → the two-root rule
    back: |
      If (something)² = k with k > 0, then something = √k or something = −√k. Both must be considered.
    topic_code: "7.3"
  - front: Solving x² + 5 = 30
    back: |
      x² = 25, so x = ±5. Undo the addition before undoing the square.
    topic_code: "7.3"
  - front: Zero product property → statement
    back: |
      If a product of factors is 0, at least one factor is 0: ab = 0 means a = 0 or b = 0. It only works for a product equal to 0.
    topic_code: "7.4"
  - front: Solving (x − 3)(x + 7) = 0
    back: |
      x − 3 = 0 or x + 7 = 0, so x = 3 or x = −7. Check: (0)(10) = 0 and (−10)(0) = 0.
    topic_code: "7.4"
  - front: Solving x(2x − 5) = 0
    back: |
      x = 0 or 2x − 5 = 0, so x = 0 or x = 5/2.
    topic_code: "7.4"
  - front: Why (x − 3)(x + 7) = 10 cannot be split into x − 3 = 10 or x + 7 = 10
    back: |
      Many pairs of numbers multiply to 10 (2 · 5, −1 · −10, 20 · 0.5); only 0 forces a factor to be 0. Rewrite with 0 on one side first.
    topic_code: "7.4"
  - front: Getting 0 on one side → procedure
    back: |
      Move every term to one side, then write the expression as a product. x² + 3x = 40 becomes x² + 3x − 40 = 0, then (x + 8)(x − 5) = 0.
    topic_code: "7.4"
  - front: Solving 3(x + 2)(x − 8) = 0
    back: |
      3 is never 0, so x + 2 = 0 or x − 8 = 0: x = −2 or x = 8. A constant factor contributes no solution.
    topic_code: "7.4"
  - front: Number of solutions of a quadratic equation → possibilities
    back: |
      Two, one or none. x² = 9 has two; (x − 4)² = 0 has one; x² = −9 has none.
    topic_code: "7.5"
  - front: Why x² = −9 has no solutions
    back: |
      A square of a real number is never negative, so no x makes x² equal −9. On a graph, y = x² never dips to −9.
    topic_code: "7.5"
  - front: Why (x − 4)² = 0 has exactly one solution
    back: |
      Only 0 squares to 0, so x − 4 = 0 and x = 4. The two roots coincide; the graph of y = (x − 4)² just touches the axis.
    topic_code: "7.5"
  - front: Solutions as intersections
    back: |
      The solutions of x² − 4x = 5 are the x-coordinates where the graph of y = x² − 4x meets the line y = 5: x = −1 and x = 5.
    topic_code: "7.5"
  - front: Counting solutions from a graph
    back: |
      A horizontal line can cross a parabola twice, touch it once at the vertex, or miss it entirely: two, one or no solutions.
    topic_code: "7.5"
  - front: Ball h(t) = 64t − 16t² back on the ground → zero product
    back: |
      64t − 16t² = 16t(4 − t) = 0, so t = 0 (launch) or t = 4 (landing).
    topic_code: "7.4"
  - front: A mistake to avoid → x² = 49 so x = 7 only
    back: |
      (−7)² = 49 too. A positive number has two square roots; keep both unless the situation rules one out.
    topic_code: "7.3"
  - front: A mistake to avoid → (x − 2)(x + 5) = 6 so x − 2 = 6
    back: |
      The zero product property needs 0. Expand, subtract 6, and factor again: x² + 3x − 16 = 0, which needs a later method.
    topic_code: "7.4"

quiz:
  description: |
    25 questions · about 45 minutes · finding unknown inputs, writing quadratic equations, solving by
    reasoning, the zero product property, and how many solutions (lessons 7.1 to 7.5), with review of
    factored and vertex forms, zeros and vertices from unit 6, domain from unit 4, equations and their
    solutions from unit 2, and expressions from patterns. Multiple choice, select-all, true/false and
    numeric items are graded at once; fill-in-the-blank items are matched automatically; the short answers
    and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a rectangular garden (7.2, 7.1, 7.4, 4.10)
    - slug: alg1-u07-w28-q01
      type: multiple_choice
      topic_code: "7.2"
      source: "IM Algebra 1, Unit 7, Lesson 2"
      points: 1
      stimulus: |
        A rectangular garden is 3 metres longer than it is wide. Let w be its width in metres.
      prompt: |
        Which equation says that the garden's area is 40 square metres?
      options:
        - "w(w + 3) = 40"
        - "w + (w + 3) = 40"
        - "2w + 2(w + 3) = 40"
        - "w² + 3 = 40"
      option_explanations:
        - |
          Correct. The length is w + 3 and area is width times length; expanded, w² + 3w = 40.
        - |
          Adding the sides gives half the perimeter, not the area.
        - |
          This is the perimeter; the area is the product of the two dimensions.
        - |
          w² + 3 forgets that the extra 3 metres of length is multiplied by the full width: w(w + 3) = w² + 3w.
      answer: 0

    - slug: alg1-u07-w28-q02
      type: multiple_choice
      topic_code: "7.1"
      source: "IM Algebra 1, Unit 7, Lesson 1"
      points: 1
      stimulus: |
        A rectangular garden is 3 metres longer than it is wide. Let w be its width in metres.
      prompt: |
        A table of areas w(w + 3) for w = 1, 2, 3, 4, 5, 6 reads 4, 10, 18, 28, 40, 54. What width gives an area of 40 square metres, and what does the table say about an area of 50?
      options:
        - "w = 5; an area of 50 needs a width between 5 and 6 that the table does not show."
        - "w = 40; an area of 50 needs w = 50."
        - "w = 5; an area of 50 is impossible because 50 is not in the table."
        - "w = 8; an area of 50 needs w = 10."
      option_explanations:
        - |
          Correct. 5 · 8 = 40; areas grow continuously with width, so 50 is reached somewhere between w = 5 (area 40) and w = 6 (area 54), which guess-and-check cannot pin down.
        - |
          The width is the input, not the output; w = 40 would give an area of 1,720.
        - |
          The table only lists whole-number widths; a width of about 5.7 gives an area of 50.
        - |
          8 is the length when w = 5, not the width; and w = 10 gives 130.
      answer: 0

    - slug: alg1-u07-w28-q03
      type: multiple_choice
      topic_code: "7.4"
      source: "IM Algebra 1, Unit 7, Lesson 4"
      points: 1
      stimulus: |
        A rectangular garden is 3 metres longer than it is wide. Let w be its width in metres.
      prompt: |
        The equation w(w + 3) = 40 can be rewritten as (w − 5)(w + 8) = 0. What are its solutions, and which describes the garden?
      options:
        - "w = 5 or w = −8; only 5 makes sense as a width."
        - "w = 5 or w = 8; both are widths."
        - "w = −5 or w = 8; only 8 makes sense."
        - "w = 40, because the product must equal 40."
      option_explanations:
        - |
          Correct. A product is 0 when a factor is 0: w − 5 = 0 or w + 8 = 0. A width cannot be negative, so the garden is 5 by 8 metres.
        - |
          w + 8 = 0 gives w = −8, not 8; and a negative width is rejected.
        - |
          w − 5 = 0 gives w = 5, and w + 8 = 0 gives −8; the signs are reversed here.
        - |
          The rewritten equation has 0 on the right, which is what lets each factor be set to 0.
      answer: 0

    - slug: alg1-u07-w28-q04
      type: multiple_choice
      topic_code: "4.10"
      source: "IM Algebra 1, Unit 4, Lesson 10"
      points: 1
      stimulus: |
        A rectangular garden is 3 metres longer than it is wide. Let w be its width in metres.
      prompt: |
        A(w) = w(w + 3) gives the garden's area. Which domain makes sense for A?
      options:
        - "w > 0"
        - "All real numbers"
        - "w > −3"
        - "0 < w < 3"
      option_explanations:
        - |
          Correct. A width must be positive; any positive width gives a real garden.
        - |
          The expression can be evaluated for any number, but a negative or zero width is not a garden.
        - |
          w > −3 keeps the length positive but allows negative widths, which describe nothing.
        - |
          Nothing limits the width to less than 3 metres; a 10-by-13 garden is fine.
      answer: 0

    # ---- Multiple choice (7.1–7.5, 6.5, 2.4)
    - slug: alg1-u07-w28-q05
      type: multiple_choice
      topic_code: "6.5"
      source: "IM Algebra 1, Unit 6, Lesson 5"
      points: 1
      prompt: |
        A ball is dropped from 100 feet, so its height is h(t) = 100 − 16t². When is it 36 feet above the ground?
      options:
        - "After 2 seconds, because 16t² = 64 gives t = 2."
        - "After 4 seconds, because 100 − 36 = 64."
        - "After 8 seconds, because 16t² = 64 gives t = 8."
        - "After 2.25 seconds, because 36/16 = 2.25."
      option_explanations:
        - |
          Correct. 100 − 16t² = 36 means 16t² = 64, t² = 4, t = 2 (the negative root is before the drop).
        - |
          64 is the distance fallen; it still has to be divided by 16 and square-rooted.
        - |
          16t² = 64 gives t² = 4, so t = 2; dividing 64 by 16 gives 4 = t², not t.
        - |
          36/16 = 2.25 would be t² if the ball had fallen 36 feet, but it has fallen 64 feet.
      answer: 0

    - slug: alg1-u07-w28-q06
      type: multiple_choice
      topic_code: "7.2"
      source: "IM Algebra 1, Unit 7, Lesson 2"
      points: 1
      prompt: |
        An 8-inch by 10-inch photo is surrounded by a frame of uniform width x inches. The photo and frame together cover 168 square inches. Which equation describes this?
      options:
        - "(8 + 2x)(10 + 2x) = 168"
        - "(8 + x)(10 + x) = 168"
        - "8 · 10 + x = 168"
        - "(8 + 2x) + (10 + 2x) = 168"
      option_explanations:
        - |
          Correct. The frame adds x on each side, so each dimension grows by 2x, and the total area is the product.
        - |
          A frame runs along both sides of the photo, so each dimension grows by 2x, not x.
        - |
          The frame's area depends on x in a quadratic way; it is not simply x square inches.
        - |
          Adding the dimensions gives half the perimeter, not an area.
      answer: 0

    - slug: alg1-u07-w28-q07
      type: multiple_choice
      topic_code: "7.3"
      source: "IM Algebra 1, Unit 7, Lesson 3"
      points: 1
      prompt: |
        What are the solutions of (x − 1)² = 16?
      options:
        - "x = 5 or x = −3"
        - "x = 5 only"
        - "x = 17 or x = −15"
        - "x = 4 or x = −4"
      option_explanations:
        - |
          Correct. The quantity x − 1 must be 4 or −4, giving x = 5 or x = −3. Check: 4² = 16 and (−4)² = 16.
        - |
          x = −3 also works: (−3 − 1)² = (−4)² = 16.
        - |
          These come from x − 1 = ±16, forgetting to take the square root.
        - |
          4 and −4 are the values of x − 1, not of x; add 1 to each.
      answer: 0

    - slug: alg1-u07-w28-q08
      type: multiple_choice
      topic_code: "7.3"
      source: "IM Algebra 1, Unit 7, Lesson 3"
      points: 1
      prompt: |
        What are the solutions of 3x² − 5 = 70?
      options:
        - "x = 5 or x = −5"
        - "x = 25"
        - "x = 5 only"
        - "x = √65/3 or x = −√65/3"
      option_explanations:
        - |
          Correct. 3x² = 75, x² = 25, and both 5 and −5 square to 25.
        - |
          25 is x², not x; the solutions are its two square roots.
        - |
          −5 is also a solution, since (−5)² = 25 and 3 · 25 − 5 = 70.
        - |
          This subtracts 5 instead of adding it: 70 + 5 = 75, not 65.
      answer: 0

    - slug: alg1-u07-w28-q09
      type: multiple_choice
      topic_code: "7.4"
      source: "IM Algebra 1, Unit 7, Lesson 4"
      points: 1
      prompt: |
        What are the solutions of (x − 3)(x + 7) = 0?
      options:
        - "x = 3 or x = −7"
        - "x = −3 or x = 7"
        - "x = 3 and x = −7 at the same time"
        - "x = −21"
      option_explanations:
        - |
          Correct. The product is 0 only when a factor is 0: x − 3 = 0 gives 3, x + 7 = 0 gives −7.
        - |
          The signs are reversed: (x − 3) is 0 at 3, and (x + 7) at −7.
        - |
          Either value alone makes the product 0; x takes one value at a time, so the equation has two separate solutions.
        - |
          −21 is the product of the constants, the value of the expression at x = 0, not a solution.
      answer: 0

    - slug: alg1-u07-w28-q10
      type: multiple_choice
      topic_code: "7.4"
      source: "IM Algebra 1, Unit 7, Lesson 4"
      points: 1
      prompt: |
        A student solves (x − 3)(x + 7) = 10 by writing x − 3 = 10 or x + 7 = 10, getting x = 13 or x = 3. What is wrong?
      options:
        - "The property only applies when the product is 0; the equation needs 0 on one side first."
        - "Nothing; both answers are correct."
        - "The student should have written x − 3 = 5 and x + 7 = 2, since 5 · 2 = 10."
        - "The student should have added the factors instead."
      option_explanations:
        - |
          Correct. Checking x = 3 gives (0)(10) = 0 ≠ 10. Only a product of 0 forces a factor to be 0; many pairs multiply to 10.
        - |
          x = 13 gives (10)(20) = 200 and x = 3 gives 0; neither is 10.
        - |
          Those two conditions are inconsistent (x = 8 and x = −5), and 10 has infinitely many factor pairs; the method cannot work.
        - |
          The equation is a product; adding the factors changes it entirely.
      answer: 0

    - slug: alg1-u07-w28-q11
      type: multiple_choice
      topic_code: "7.5"
      source: "IM Algebra 1, Unit 7, Lesson 5"
      points: 1
      prompt: |
        How many solutions does x² = −9 have, and why?
      options:
        - "None, because the square of a real number is never negative."
        - "Two, x = 3 and x = −3."
        - "One, x = −3."
        - "Two, x = −3 and x = −9."
      option_explanations:
        - |
          Correct. Both 3² and (−3)² are 9, positive; no real number squares to −9. The graph of y = x² never reaches −9.
        - |
          3 and −3 solve x² = 9, not x² = −9; both of their squares are positive 9.
        - |
          (−3)² = 9, not −9; squaring a negative number gives a positive result.
        - |
          (−9)² = 81; neither value squares to −9.
      answer: 0

    - slug: alg1-u07-w28-q12
      type: multiple_choice
      topic_code: "7.5"
      source: "IM Algebra 1, Unit 7, Lesson 5"
      points: 1
      prompt: |
        How many solutions does (x − 4)² = 0 have?
      options:
        - "Exactly one, x = 4, because only 0 squares to 0."
        - "Two, x = 4 and x = −4."
        - "None, because a square cannot be 0."
        - "Two, x = 0 and x = 4."
      option_explanations:
        - |
          Correct. x − 4 must be 0, so x = 4; the graph of y = (x − 4)² touches the x-axis at a single point.
        - |
          (−4 − 4)² = 64, not 0; the equation is about x − 4, not x.
        - |
          0² = 0, so a square can be 0, exactly when the quantity being squared is 0.
        - |
          x = 0 gives (0 − 4)² = 16, not 0; the only value that makes x − 4 equal 0 is x = 4.
      answer: 0

    - slug: alg1-u07-w28-q13
      type: multiple_choice
      topic_code: "2.4"
      source: "IM Algebra 1, Unit 2, Lesson 4"
      points: 1
      prompt: |
        Which value is a solution of the equation x² + 3x = 40?
      options:
        - "x = −8"
        - "x = 8"
        - "x = 4"
        - "x = −5"
      option_explanations:
        - |
          Correct. (−8)² + 3(−8) = 64 − 24 = 40. (The other solution is 5.)
        - |
          Substituting 8 gives 8² + 3 · 8 = 64 + 24 = 88, which is not 40, so 8 is not a solution.
        - |
          Substituting 4 gives 4² + 3 · 4 = 16 + 12 = 28, which is not 40, so 4 is not a solution.
        - |
          Substituting −5 gives (−5)² + 3(−5) = 25 − 15 = 10, which is not 40, so −5 is not a solution.
      answer: 0

    # ---- Select-all (7.4, 6.10)
    - slug: alg1-u07-w28-q14
      type: multi_select
      topic_code: "7.4"
      source: "IM Algebra 1, Unit 7, Lesson 4"
      points: 2
      partial_credit: true
      prompt: |
        Which equations can be solved immediately with the zero product property, without any rewriting? Select all that apply.
      options:
        - "(x − 2)(x + 5) = 0"
        - "x(x − 7) = 0"
        - "(x + 1)(x − 4) = 6"
        - "x² − 9 = 0"
        - "3(x + 2)(x − 8) = 0"
      option_explanations:
        - |
          Correct. A product of factors equal to 0: x = 2 or x = −5.
        - |
          Correct. x is itself a factor: x = 0 or x = 7.
        - |
          The product equals 6, not 0; the equation must be rearranged and refactored first.
        - |
          One side is 0, but x² − 9 is a difference, not a product; it must be factored as (x − 3)(x + 3) first.
        - |
          Correct. The constant factor 3 is never 0, so x = −2 or x = 8 straight away.
      answer: [0, 1, 4]

    - slug: alg1-u07-w28-q15
      type: multi_select
      topic_code: "6.10"
      source: "IM Algebra 1, Unit 6, Lesson 10"
      points: 2
      partial_credit: true
      prompt: |
        Which expressions equal 0 when x = 4? Select all that apply.
      options:
        - "(x − 4)(x + 1)"
        - "x² − 16"
        - "(x + 4)²"
        - "x² − 4x"
        - "x² + 4"
      option_explanations:
        - |
          Correct. The factor x − 4 is 0 at x = 4, so the whole product is 0.
        - |
          Correct. 16 − 16 = 0; x² − 16 = (x − 4)(x + 4) has zeros 4 and −4.
        - |
          (4 + 4)² = 64, not 0; this expression is 0 only at x = −4.
        - |
          Correct. 16 − 16 = 0; x² − 4x = x(x − 4) has zeros 0 and 4.
        - |
          16 + 4 = 20; x² + 4 is never 0 for any real x.
      answer: [0, 1, 3]

    # ---- True/false (7.3, 6.16)
    - slug: alg1-u07-w28-q16
      type: true_false
      topic_code: "7.3"
      source: "IM Algebra 1, Unit 7, Lesson 3"
      points: 1
      prompt: |
        True or false: the equation x² = 49 has exactly one solution, x = 7.
      answer: false
      explanation: |
        False. (−7)² = 49 as well, so the equation has two solutions, 7 and −7. Only a situation (such as a length) can rule one of them out.

    - slug: alg1-u07-w28-q17
      type: true_false
      topic_code: "6.16"
      source: "IM Algebra 1, Unit 6, Lesson 16"
      points: 1
      prompt: |
        True or false: the graph of y = x² + 4 has no x-intercepts.
      answer: true
      explanation: |
        True. Its vertex (0, 4) is above the axis and the parabola opens upward, so y is never 0; equivalently, x² = −4 has no real solutions.

    # ---- Fill in the blank (7.4, 6.11)
    - slug: alg1-u07-w28-q18
      type: fill_blank
      topic_code: "7.4"
      source: "IM Algebra 1, Unit 7, Lesson 4"
      points: 1
      prompt: |
        The zero product property says that if a · b = 0, then a = 0 or b = ____.
      answer: ["0", "zero"]
      explanation: |
        A product of real numbers is 0 only when at least one factor is 0; that is what lets (x − 3)(x + 7) = 0 split into two linear equations.

    - slug: alg1-u07-w28-q19
      type: fill_blank
      topic_code: "6.11"
      source: "IM Algebra 1, Unit 6, Lesson 11"
      points: 1
      prompt: |
        The vertex of the graph of y = (x − 3)(x + 7) has x-coordinate ____.
      answer: ["-2", "−2", "x = -2", "x = −2", "negative 2"]
      explanation: |
        The x-intercepts are 3 and −7, and the vertex lies halfway between them: (3 + (−7))/2 = −2.

    # ---- Numeric (7.1, 7.3, 6.3)
    - slug: alg1-u07-w28-q20
      type: numeric
      topic_code: "7.1"
      source: "IM Algebra 1, Unit 7, Lesson 1"
      points: 1
      prompt: |
        A stone is dropped from 144 feet, so its height is h(t) = 144 − 16t². After how many seconds is it 80 feet above the ground?
      answer: { value: 2, tolerance: 0 }
      explanation: |
        144 − 16t² = 80 gives 16t² = 64, t² = 4, t = 2 seconds.

    - slug: alg1-u07-w28-q21
      type: numeric
      topic_code: "7.3"
      source: "IM Algebra 1, Unit 7, Lesson 3"
      points: 1
      prompt: |
        What is the larger solution of (x + 3)² = 100?
      answer: { value: 7, tolerance: 0 }
      explanation: |
