    # ---- Short answer (7.4, 7.5)
    - slug: alg1-u07-w28-q23
      type: short_answer
      topic_code: "7.4"
      source: "IM Algebra 1, Unit 7, Lesson 4"
      points: 3
      prompt: |
        A ball is kicked from the ground and its height in feet is h(t) = 64t − 16t².

        (a) Write the equation that says the ball is on the ground, and rewrite its left side as a product.
        (b) Solve the equation using the zero product property.
        (c) Explain what each solution means for the kick.
      answer: |
        (a) 64t − 16t² = 0; factor out 16t: 16t(4 − t) = 0.
        (b) 16t = 0 or 4 − t = 0, so t = 0 or t = 4.
        (c) t = 0 is the moment of the kick, when the ball leaves the ground; t = 4 is the landing, 4 seconds later.
      explanation: |
        Three points, one per part.

        (a) 1 pt: 64t − 16t² = 0 written as 16t(4 − t) = 0 (or t(64 − 16t) = 0).

        (b) 1 pt: t = 0 and t = 4.

        (c) 1 pt: kick and landing identified.

    - slug: alg1-u07-w28-q24
      type: short_answer
      topic_code: "7.5"
      source: "IM Algebra 1, Unit 7, Lesson 5"
      points: 3
      prompt: |
        For each equation, state how many solutions it has and explain why, giving the solutions where they exist.

        (a) x² − 5 = 20
        (b) (x + 2)² = −1
        (c) x² − 6x + 9 = 0, which can be written (x − 3)² = 0
      answer: |
        (a) Two: x² = 25, so x = 5 or x = −5, because both square to 25.
        (b) None: a square is never negative, so no real x makes (x + 2)² equal −1.
        (c) One: only 0 squares to 0, so x − 3 = 0 and x = 3. The graph of y = (x − 3)² touches the x-axis once.
      explanation: |
        Three points, one per part.

        (a) 1 pt: two solutions, ±5, with the reason.

        (b) 1 pt: none, because a square cannot be negative.

        (c) 1 pt: one solution, 3, because only 0 squares to 0.

    # ---- Long answer (7.2)
    - slug: alg1-u07-w28-q25
      type: long_answer
      topic_code: "7.2"
      source: "IM Algebra 1, Unit 7, Lesson 2"
      points: 6
      prompt: |
        A 12-inch by 16-inch print is mounted with a border of uniform width x inches on every side. The print and border together cover 320 square inches.

        (1) Write expressions for the total width and total height, and an equation for the total area.
        (2) Expand the equation and rewrite it in the form x² + bx + c = 0.
        (3) Write the left side in factored form and solve with the zero product property.
        (4) State the border width, explain why the other solution is rejected, and check your answer against the given area.
      answer: |
        (1) Width 12 + 2x, height 16 + 2x; (12 + 2x)(16 + 2x) = 320.
        (2) 192 + 24x + 32x + 4x² = 320, so 4x² + 56x + 192 = 320, 4x² + 56x − 128 = 0, and dividing by 4: x² + 14x − 32 = 0.
        (3) Two numbers with product −32 and sum 14: 16 and −2. (x + 16)(x − 2) = 0, so x = −16 or x = 2.
        (4) The border is 2 inches wide; −16 is rejected because a width cannot be negative. Check: (12 + 4)(16 + 4) = 16 · 20 = 320.
      explanation: |
        Six points.

        (1) 1 pt: both dimensions with 2x and the area equation.

        (2) 2 pts: 1 for the expansion, 1 for x² + 14x − 32 = 0.

        (3) 2 pts: 1 for (x + 16)(x − 2), 1 for both solutions.

        (4) 1 pt: x = 2 chosen with the reason and the check.

        Common errors: (12 + x)(16 + x); forgetting to subtract 320 before factoring; keeping x = −16.
