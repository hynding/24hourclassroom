week: 29
unit: 7
title: "Factoring to Solve Quadratic Equations"
topics: ["7.6", "7.7", "7.8", "7.9", "7.10"]
guide: guides/week-29.md
guide_description: |
  Rewriting x² + bx + c in factored form by finding two numbers with product c and sum b, handling the
  signs when b or c is negative, the difference-of-squares and perfect-square patterns, solving equations
  by getting 0 on one side and factoring, factoring when the leading coefficient is not 1, and what to do
  when an expression does not factor.
flashcards_description: |
  28 cards on the product-and-sum search, sign rules, area diagrams, differences of squares, perfect
  square trinomials, the steps for solving by factoring, checking solutions, factoring with a leading
  coefficient, and recognising expressions that do not factor over the integers.

flashcards:
  - front: Factoring x² + bx + c → the two-number search
    back: |
      Find two numbers whose product is c and whose sum is b; then x² + bx + c = (x + m)(x + n). Check by expanding.
    topic_code: "7.6"
  - front: x² + 9x + 20 → factored form
    back: |
      Pairs with product 20: 1 and 20, 2 and 10, 4 and 5. Only 4 + 5 = 9, so (x + 4)(x + 5).
    topic_code: "7.6"
  - front: Area diagram for factoring → how it works
    back: |
      A rectangle of area x² + 7x + 10 with one side x + 2 must have the other side x + 5: the x² piece fixes the x's, and 10 ÷ 2 = 5 fixes the constant.
    topic_code: "7.6"
  - front: Listing factor pairs of c → method
    back: |
      Write every pair of whole numbers that multiply to c, then look for the pair that adds to b. For c = 15: 1 · 15 and 3 · 5; b = 8 picks 3 and 5.
    topic_code: "7.6"
  - front: x² + 8x + 15 → factored form
    back: |
      3 · 5 = 15 and 3 + 5 = 8, so (x + 3)(x + 5).
    topic_code: "7.6"
  - front: Signs when c is positive and b is negative
    back: |
      Both numbers are negative: x² − 11x + 24 = (x − 3)(x − 8), since (−3)(−8) = 24 and −3 + (−8) = −11.
    topic_code: "7.7"
  - front: Signs when c is negative
    back: |
      One number positive, one negative, and the one with the larger absolute value takes the sign of b: x² − 3x − 28 = (x − 7)(x + 4).
    topic_code: "7.7"
  - front: x² + 2x − 35 → factored form
    back: |
      Product −35, sum 2: 7 and −5. (x + 7)(x − 5).
    topic_code: "7.7"
  - front: x² − 5x − 6 → factored form
    back: |
      Product −6, sum −5: −6 and 1. (x − 6)(x + 1). Not (x − 2)(x − 3), which gives +6.
    topic_code: "7.7"
  - front: Checking a factorisation → method
    back: |
      Expand it. A wrong sign shows up in the middle term: (x − 2)(x − 3) = x² − 5x + 6, so it is not a factorisation of x² − 5x − 6.
    topic_code: "7.7"
  - front: Difference of squares → pattern
    back: |
      a² − b² = (a − b)(a + b). The middle terms cancel when expanding, which is why there is no x term.
    topic_code: "7.8"
  - front: x² − 49 → factored form
    back: |
      (x − 7)(x + 7). Think of it as x² + 0x − 49: product −49, sum 0.
    topic_code: "7.8"
  - front: 4x² − 9 → factored form
    back: |
      (2x − 3)(2x + 3), since 4x² = (2x)² and 9 = 3².
    topic_code: "7.8"
  - front: Perfect square trinomial → pattern
    back: |
      x² + 2kx + k² = (x + k)²; x² − 2kx + k² = (x − k)². The constant is the square of half the middle coefficient.
    topic_code: "7.8"
  - front: x² + 12x + 36 → factored form
    back: |
      (x + 6)², because 36 = 6² and 12 = 2 · 6.
    topic_code: "7.8"
  - front: Why x² + 25 does not factor
    back: |
      It would need two numbers with product 25 and sum 0, and no real pair does that; a sum of squares has no real zeros.
    topic_code: "7.8"
  - front: Solving by factoring → steps
    back: |
      1. Rearrange so one side is 0. 2. Write the other side as a product. 3. Set each factor equal to 0. 4. Check each solution in the original equation.
    topic_code: "7.9"
  - front: Solving x² + 3x = 40
    back: |
      x² + 3x − 40 = 0; (x + 8)(x − 5) = 0; x = −8 or x = 5. Check: 25 + 15 = 40 and 64 − 24 = 40.
    topic_code: "7.9"
  - front: Solving x² = 5x + 24
    back: |
      x² − 5x − 24 = 0; (x − 8)(x + 3) = 0; x = 8 or x = −3.
    topic_code: "7.9"
  - front: Solving x² − 2x − 35 = 0
    back: |
      (x − 7)(x + 5) = 0, so x = 7 or x = −5.
    topic_code: "7.9"
  - front: Checking solutions by substitution
    back: |
      Put each value back into the original equation, not the factored one; both sides must agree. It catches sign slips in the factors.
    topic_code: "7.9"
  - front: Factoring when the leading coefficient is not 1 → the shape
    back: |
      (px + m)(qx + n) with pq = a and mn = c; the middle coefficient is pn + mq. Try factor pairs of both a and c.
    topic_code: "7.10"
  - front: 2x² + 7x + 3 → factored form
    back: |
      (2x + 1)(x + 3): 2 · 3 + 1 · 1 = 7 in the middle, 1 · 3 = 3 at the end.
    topic_code: "7.10"
  - front: 3x² − 10x − 8 → factored form
    back: |
      (3x + 2)(x − 4): expanding gives 3x² − 12x + 2x − 8.
    topic_code: "7.10"
  - front: Solving 2x² + 11x + 12 = 0
    back: |
      (2x + 3)(x + 4) = 0, so x = −3/2 or x = −4.
    topic_code: "7.10"
  - front: When factoring fails → what to do
    back: |
      x² − 4x − 3 has no integer pair with product −3 and sum −4. A graph gives approximate zeros (about −0.65 and 4.65); completing the square and the quadratic formula give exact ones.
    topic_code: "7.10"
  - front: A mistake to avoid → sign of the middle term
    back: |
      (x + 2)(x + 3) = x² + 5x + 6, not x² − 5x + 6. Negative b with positive c needs two negative numbers.
    topic_code: "7.7"
  - front: A mistake to avoid → factoring before getting 0
    back: |
      x(x + 3) = 40 does not give x = 40. Subtract 40 first: x² + 3x − 40 = 0, then factor.
    topic_code: "7.9"

quiz:
  description: |
    25 questions · about 45 minutes · factoring x² + bx + c with any signs, differences of squares and
    perfect squares, solving quadratic equations by factoring, and factoring with a leading coefficient
    (lessons 7.6 to 7.10), with review of the zero product property and solving by reasoning from week 28,
    vertices and expanding products from unit 6, and falling objects. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the
    short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a toy rocket (7.9, 7.4, 7.9, 6.11)
    - slug: alg1-u07-w29-q01
      type: multiple_choice
      topic_code: "7.9"
      source: "IM Algebra 1, Unit 7, Lesson 9"
      points: 1
      stimulus: |
        A toy rocket is launched from a ledge. Its height in metres after t seconds is h(t) = −5t² + 20t + 25.
      prompt: |
        To find when the rocket lands, which equation should be solved, and what is its factored form?
      options:
        - "−5t² + 20t + 25 = 0, which is −5(t − 5)(t + 1) = 0"
        - "−5t² + 20t + 25 = 25, which is −5t(t − 4) = 0"
        - "−5t² + 20t + 25 = 0, which is −5(t + 5)(t − 1) = 0"
        - "h(t) = 20, because 20 is the launch speed"
      option_explanations:
        - |
          Correct. Landing means height 0; factoring out −5 leaves t² − 4t − 5 = (t − 5)(t + 1).
        - |
          Setting the height to 25 finds when the rocket is back at ledge height (t = 0 and t = 4), not on the ground.
        - |
          (t + 5)(t − 1) = t² + 4t − 5, with the wrong middle sign; the factors are (t − 5)(t + 1).
        - |
          20 is the launch speed in metres per second, not a height; landing is h(t) = 0.
      answer: 0

    - slug: alg1-u07-w29-q02
      type: multiple_choice
      topic_code: "7.4"
      source: "IM Algebra 1, Unit 7, Lesson 4"
      points: 1
      stimulus: |
        A toy rocket is launched from a ledge. Its height in metres after t seconds is h(t) = −5t² + 20t + 25.
      prompt: |
        Using −5(t − 5)(t + 1) = 0, when does the rocket land?
      options:
        - "After 5 seconds; t = −1 is before the launch and is rejected."
        - "After 1 second; t = −5 is rejected."
        - "After 5 seconds or 1 second; both are landings."
        - "After −5 seconds, because the factor −5 is set to 0."
      option_explanations:
        - |
          Correct. The factors give t = 5 or t = −1; only a time after the launch describes the flight.
        - |
          The zeros are 5 and −1, not 1 and −5: set each factor equal to 0 and solve.
        - |
          (t + 1) = 0 gives t = −1, a time before the launch; the rocket lands only once.
        - |
          The constant factor −5 is never 0 and contributes no solution.
      answer: 0

    - slug: alg1-u07-w29-q03
      type: multiple_choice
      topic_code: "7.9"
      source: "IM Algebra 1, Unit 7, Lesson 9"
      points: 1
      stimulus: |
        A toy rocket is launched from a ledge. Its height in metres after t seconds is h(t) = −5t² + 20t + 25.
      prompt: |
        When is the rocket exactly 40 metres high?
      options:
        - "At t = 1 and t = 3, from −5t² + 20t − 15 = 0, that is t² − 4t + 3 = 0."
        - "Only at t = 2, from −5t² + 20t + 25 = 40."
        - "At t = 8, because 40 = 20 · 2."
        - "Never, because 40 is more than 25."
      option_explanations:
        - |
          Correct. Subtract 40: −5t² + 20t − 15 = 0; divide by −5: t² − 4t + 3 = (t − 1)(t − 3) = 0. The rocket passes 40 m going up at t = 1 and coming down at t = 3.
        - |
          At t = 2 the height is −20 + 40 + 25 = 45, the peak; 40 m is reached twice, on the way up and on the way down.
        - |
          h(8) = −320 + 160 + 25 = −135; the rocket landed long before.
        - |
          25 is the launch height; the rocket rises to 45 m, so it passes 40 m.
      answer: 0

    - slug: alg1-u07-w29-q04
      type: multiple_choice
      topic_code: "6.11"
      source: "IM Algebra 1, Unit 6, Lesson 11"
      points: 1
      stimulus: |
        A toy rocket is launched from a ledge. Its height in metres after t seconds is h(t) = −5t² + 20t + 25.
      prompt: |
        What is the rocket's maximum height?
      options:
        - "45 metres, at t = 2"
        - "25 metres, at t = 0"
        - "45 metres, at t = 5"
        - "40 metres, at t = 2"
      option_explanations:
        - |
          Correct. The zeros 5 and −1 average to t = 2, and h(2) = −20 + 40 + 25 = 45.
        - |
          25 is the launch height; the rocket rises above it before falling.
        - |
          t = 5 is the landing time, when the height is 0.
        - |
          h(2) = 45; 40 is reached at t = 1 and t = 3, on either side of the peak.
      answer: 0

    # ---- Multiple choice (7.6–7.10)
    - slug: alg1-u07-w29-q05
      type: multiple_choice
      topic_code: "7.6"
      source: "IM Algebra 1, Unit 7, Lesson 6"
      points: 1
      prompt: |
        Which is the factored form of x² + 9x + 20?
      options:
        - "(x + 4)(x + 5)"
        - "(x + 2)(x + 10)"
        - "(x + 1)(x + 20)"
        - "(x + 9)(x + 20)"
      option_explanations:
        - |
          Correct. 4 · 5 = 20 and 4 + 5 = 9, so (x + 4)(x + 5) expands to x² + 9x + 20.
        - |
          2 · 10 = 20 but 2 + 10 = 12; this expands to x² + 12x + 20.
        - |
          1 · 20 = 20 but 1 + 20 = 21, not 9; this expands to x² + 21x + 20.
        - |
          9 · 20 = 180, nowhere near 20; the numbers must multiply to the constant.
      answer: 0

    - slug: alg1-u07-w29-q06
      type: multiple_choice
      topic_code: "7.6"
      source: "IM Algebra 1, Unit 7, Lesson 6"
      points: 1
      prompt: |
        A rectangle has area x² + 7x + 10 and one side of length x + 2. What is the other side?
      options:
        - "x + 5"
        - "x + 3.5"
        - "x + 8"
        - "x² + 5"
      option_explanations:
        - |
          Correct. (x + 2)(x + 5) = x² + 5x + 2x + 10 = x² + 7x + 10; 10 ÷ 2 = 5 and 2 + 5 = 7.
        - |
          Dividing the middle coefficient by 2 is not how the sides relate; (x + 2)(x + 3.5) = x² + 5.5x + 7.
        - |
          (x + 2)(x + 8) = x² + 10x + 16, not the given area.
        - |
          The other side must be linear so that the product is quadratic; (x + 2)(x² + 5) has an x³ term.
      answer: 0

    - slug: alg1-u07-w29-q07
      type: multiple_choice
      topic_code: "7.7"
      source: "IM Algebra 1, Unit 7, Lesson 7"
      points: 1
      prompt: |
        Which is the factored form of x² − 3x − 28?
      options:
        - "(x − 7)(x + 4)"
        - "(x + 7)(x − 4)"
        - "(x − 7)(x − 4)"
        - "(x − 14)(x + 2)"
      option_explanations:
        - |
          Correct. (−7)(4) = −28 and −7 + 4 = −3, so the product and sum both match.
        - |
          7 + (−4) = 3, giving x² + 3x − 28: the middle sign is wrong.
        - |
          (−7)(−4) = +28, not −28; this gives x² − 11x + 28.
        - |
          (−14)(2) = −28, but −14 + 2 = −12, not −3.
      answer: 0

    - slug: alg1-u07-w29-q08
      type: multiple_choice
      topic_code: "7.7"
      source: "IM Algebra 1, Unit 7, Lesson 7"
      points: 1
      prompt: |
        To factor x² − 11x + 24, what signs must the two numbers have, and what are they?
      options:
        - "Both negative: −3 and −8"
        - "Both positive: 3 and 8"
        - "One of each: −12 and 2"
        - "One of each: 12 and −2"
      option_explanations:
        - |
          Correct. A positive product needs matching signs, and a negative sum makes both negative: (−3)(−8) = 24, −3 + (−8) = −11.
        - |
          3 + 8 = 11 gives x² + 11x + 24, the wrong middle sign.
        - |
          Opposite signs would make the product negative, but 24 is positive.
        - |
          12 · (−2) = −24, not +24; opposite signs always give a negative product.
      answer: 0

    - slug: alg1-u07-w29-q09
      type: multiple_choice
      topic_code: "7.8"
      source: "IM Algebra 1, Unit 7, Lesson 8"
      points: 1
      prompt: |
        Which is the factored form of x² − 49?
      options:
        - "(x − 7)(x + 7)"
        - "(x − 7)²"
        - "(x − 49)(x + 1)"
        - "x(x − 49)"
      option_explanations:
        - |
          Correct. A difference of squares: the middle terms 7x and −7x cancel, leaving x² − 49.
        - |
          (x − 7)² = x² − 14x + 49, with a middle term and a positive constant.
        - |
          (x − 49)(x + 1) = x² − 48x − 49, which has a middle term.
        - |
          x(x − 49) = x² − 49x, a middle term with no constant.
      answer: 0

    - slug: alg1-u07-w29-q10
      type: multiple_choice
      topic_code: "7.8"
      source: "IM Algebra 1, Unit 7, Lesson 8"
      points: 1
      prompt: |
        Which expression is a perfect square, and what is its factored form?
      options:
        - "x² + 12x + 36 = (x + 6)²"
        - "x² + 12x + 24 = (x + 12)²"
        - "x² + 36 = (x + 6)²"
        - "x² + 6x + 36 = (x + 6)²"
      option_explanations:
        - |
          Correct. 36 = 6² and 12 = 2 · 6, so (x + 6)(x + 6) = x² + 12x + 36.
        - |
          (x + 12)² = x² + 24x + 144; and 24 is not the square of half of 12.
        - |
          (x + 6)² has a middle term, 12x; x² + 36 is a sum of squares and does not factor.
        - |
          (x + 6)² = x² + 12x + 36, so the middle term 6x is wrong; x² + 6x + 36 does not factor over the integers.
      answer: 0

    - slug: alg1-u07-w29-q11
      type: multiple_choice
      topic_code: "7.9"
      source: "IM Algebra 1, Unit 7, Lesson 9"
      points: 1
      prompt: |
        What are the solutions of x² + 3x = 40?
      options:
        - "x = 5 or x = −8"
        - "x = 40 or x = 37"
        - "x = −5 or x = 8"
        - "x = 5 only"
      option_explanations:
        - |
          Correct. x² + 3x − 40 = (x + 8)(x − 5) = 0; check 25 + 15 = 40 and 64 − 24 = 40.
        - |
          These come from x(x + 3) = 40 with each factor set to 40; the property needs 0, not 40.
        - |
          (−5)² + 3(−5) = 10 and 8² + 24 = 88; the signs are reversed.
        - |
          −8 is also a solution, since (−8)² + 3(−8) = 64 − 24 = 40; a quadratic equation can have two.
      answer: 0

    - slug: alg1-u07-w29-q12
      type: multiple_choice
      topic_code: "7.10"
      source: "IM Algebra 1, Unit 7, Lesson 10"
      points: 1
      prompt: |
        Which is the factored form of 2x² + 7x + 3?
      options:
        - "(2x + 1)(x + 3)"
        - "(2x + 3)(x + 1)"
        - "(x + 1)(x + 3)"
        - "2(x + 1)(x + 3)"
      option_explanations:
        - |
          Correct. 2x · x = 2x², 2x · 3 + 1 · x = 7x, 1 · 3 = 3.
        - |
          (2x + 3)(x + 1) = 2x² + 2x + 3x + 3 = 2x² + 5x + 3, with the wrong middle term.
        - |
          This expands to x² + 4x + 3; the leading coefficient 2 is missing.
        - |
          2(x + 1)(x + 3) = 2x² + 8x + 6, double the wrong expression.
      answer: 0

    - slug: alg1-u07-w29-q13
      type: multiple_choice
      topic_code: "7.10"
      source: "IM Algebra 1, Unit 7, Lesson 10"
      points: 1
      prompt: |
        A student tries to solve x² − 4x − 3 = 0 by factoring and cannot find the factors. Which statement is correct?
      options:
        - "No pair of integers has product −3 and sum −4, so the equation cannot be solved by factoring; a graph gives approximate solutions near −0.65 and 4.65."
        - "The factors are (x − 3)(x − 1), so x = 3 or x = 1."
        - "The equation has no solutions, because it cannot be factored."
        - "The factors are (x − 3)(x + 1), so x = 3 or x = −1."
      option_explanations:
        - |
          Correct. The only integer pairs for −3 are (−1, 3) and (1, −3), with sums 2 and −2; the graph of y = x² − 4x − 3 still crosses the axis twice, so exact methods come later.
        - |
          (x − 3)(x − 1) = x² − 4x + 3, not x² − 4x − 3.
        - |
          Not factoring over the integers does not mean no solutions; the graph crosses the x-axis at two points.
        - |
          (x − 3)(x + 1) = x² − 2x − 3, with the wrong middle term.
      answer: 0

    # ---- Select-all (7.8, 7.3)
    - slug: alg1-u07-w29-q14
      type: multi_select
      topic_code: "7.8"
      source: "IM Algebra 1, Unit 7, Lesson 8"
      points: 2
      partial_credit: true
      prompt: |
        Which expressions are differences of squares that factor as (a − b)(a + b)? Select all that apply.
      options:
        - "x² − 36"
        - "x² + 36"
        - "4x² − 9"
        - "x² − 6x + 9"
        - "25 − x²"
      option_explanations:
        - |
          Correct. x² − 36 = (x − 6)(x + 6), since 36 = 6² and the middle terms cancel.
        - |
          A sum of squares has no middle term to cancel and no real factors.
        - |
          Correct. (2x − 3)(2x + 3), since 4x² = (2x)² and 9 = 3².
        - |
          This is a perfect square, (x − 3)², with a middle term; it is not a difference of two squares.
        - |
          Correct. (5 − x)(5 + x); the order of the squares does not matter.
      answer: [0, 2, 4]

    - slug: alg1-u07-w29-q15
      type: multi_select
      topic_code: "7.3"
      source: "IM Algebra 1, Unit 7, Lesson 3"
      points: 2
      partial_credit: true
      prompt: |
        Which equations have exactly two solutions? Select all that apply.
      options:
        - "x² = 16"
        - "(x − 2)² = 0"
        - "x² + 1 = 0"
        - "(x + 1)² = 9"
        - "x² − 7 = 0"
      option_explanations:
        - |
          Correct. Both 4 and −4 square to 16, so x² = 16 has exactly two solutions.
        - |
          Only 0 squares to 0, so x = 2 is the single solution.
        - |
          x² = −1 has no real solutions, since squares are never negative.
        - |
          Correct. x + 1 = ±3, so x = 2 or x = −4.
        - |
          Correct. x² = 7, so x = √7 or x = −√7; the solutions need not be whole numbers.
      answer: [0, 3, 4]

    # ---- True/false (7.7, 7.4)
    - slug: alg1-u07-w29-q16
      type: true_false
      topic_code: "7.7"
      source: "IM Algebra 1, Unit 7, Lesson 7"
      points: 1
      prompt: |
        True or false: x² − 5x − 6 is equivalent to (x − 2)(x − 3).
      answer: false
      explanation: |
        False. (x − 2)(x − 3) = x² − 5x + 6, with a positive constant. x² − 5x − 6 = (x − 6)(x + 1): product −6, sum −5.

    - slug: alg1-u07-w29-q17
      type: true_false
      topic_code: "7.4"
      source: "IM Algebra 1, Unit 7, Lesson 4"
      points: 1
      prompt: |
        True or false: to solve x(x + 3) = 40 you can set x = 40 or x + 3 = 40.
      answer: false
      explanation: |
        False. The zero product property applies only when the product is 0. Rewrite as x² + 3x − 40 = 0, factor to (x + 8)(x − 5) = 0, and get x = −8 or x = 5.

    # ---- Fill in the blank (6.9, 6.8)
    - slug: alg1-u07-w29-q18
      type: fill_blank
      topic_code: "6.9"
      source: "IM Algebra 1, Unit 6, Lesson 9"
      points: 1
      prompt: |
        x² + 8x + 15 = (x + 3)(x + ____).
      answer: ["5", "five"]
      explanation: |
        3 · 5 = 15 and 3 + 5 = 8.

    - slug: alg1-u07-w29-q19
      type: fill_blank
      topic_code: "6.8"
      source: "IM Algebra 1, Unit 6, Lesson 8"
      points: 1
      prompt: |
        In standard form, (x − 4)(x + 4) is x² − ____.
      answer: ["16", "sixteen"]
      explanation: |
        x² + 4x − 4x − 16 = x² − 16; the middle terms cancel, which is the difference-of-squares pattern in reverse.

    # ---- Numeric (7.9, 7.10, 6.5)
    - slug: alg1-u07-w29-q20
      type: numeric
      topic_code: "7.9"
      source: "IM Algebra 1, Unit 7, Lesson 9"
      points: 1
      prompt: |
        What is the larger solution of x² − 2x − 35 = 0?
      answer: { value: 7, tolerance: 0 }
      explanation: |
        (x − 7)(x + 5) = 0 gives x = 7 or x = −5; the larger is 7.

    - slug: alg1-u07-w29-q21
      type: numeric
      topic_code: "7.10"
