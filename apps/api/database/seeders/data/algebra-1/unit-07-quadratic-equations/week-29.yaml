        (b) 2x + 3 = 0 or x + 4 = 0, so x = −3/2 or x = −4.
        (c) The factors would be (2x + m)(x + n) with mn = 13 and 2n + m = 11. The only integer pairs for 13 are (1, 13) and (13, 1) and their negatives, giving middle coefficients 27, 15, −27 or −15, never 11.
