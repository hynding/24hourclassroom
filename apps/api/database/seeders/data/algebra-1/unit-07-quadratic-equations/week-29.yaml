    # ---- Long answer (7.9)
    - slug: alg1-u07-w29-q25
      type: long_answer
      topic_code: "7.9"
      source: "IM Algebra 1, Unit 7, Lesson 9"
      points: 6
      prompt: |
        A ball is thrown upward from a roof. Its height in feet after t seconds is h(t) = −16t² + 48t + 64.

        (1) Find when the ball lands by writing h(t) = 0, factoring, and choosing the meaningful solution.
        (2) Find the times at which the ball is 64 feet high, and explain what they are.
        (3) Show that the ball is 100 feet high at exactly one time, and explain what that time is.
        (4) Show that the ball is never 120 feet high, using what you found in (3).
      answer: |
        (1) −16t² + 48t + 64 = 0; divide by −16: t² − 3t − 4 = 0; (t − 4)(t + 1) = 0; t = 4 or t = −1. The ball lands after 4 seconds; −1 is before the throw.
        (2) −16t² + 48t + 64 = 64 gives −16t² + 48t = 0, or −16t(t − 3) = 0: t = 0 and t = 3. 64 feet is the roof height, so these are the throw and the moment the ball is back level with the roof on its way down.
        (3) −16t² + 48t + 64 = 100 gives −16t² + 48t − 36 = 0; divide by −4: 4t² − 12t + 9 = 0, which is (2t − 3)² = 0, so t = 1.5 only. One solution means 100 feet is reached once: it is the maximum height, at the top of the flight.
        (4) The highest the ball gets is 100 feet, at t = 1.5, so it can never be at 120 feet; −16t² + 48t + 64 = 120 has no solutions.
      explanation: |
        Six points.

        (1) 2 pts: 1 for factoring to (t − 4)(t + 1), 1 for t = 4 with −1 rejected.

        (2) 1 pt: t = 0 and t = 3 with their meanings.

        (3) 2 pts: 1 for reaching (2t − 3)² = 0 (or an equivalent single solution), 1 for identifying t = 1.5 as the peak.

        (4) 1 pt: the maximum is 100, so 120 is unreachable.

        Common errors: factoring without first getting 0 on one side; losing t = 0 in (2) by dividing by t; treating (3) as having two solutions.
