week: 30
unit: 7
title: "Completing the Square"
topics: ["7.11", "7.12", "7.13", "7.14", "7.15"]
guide: guides/week-30.md
guide_description: |
  Recognising perfect square trinomials and solving equations whose one side is a perfect square, adding
  (b/2)² to complete a square, solving x² + bx + c = 0 by completing the square (including an odd b),
  dividing through first when the leading coefficient is not 1, and writing irrational solutions exactly
  as a ± √k and approximately as decimals.
flashcards_description: |
  28 cards on the pattern (x + k)² = x² + 2kx + k², the completing constant (b/2)², rewriting x² + bx + c
  as (x + k)² + m, the solving steps with worked equations, handling an odd b and a leading coefficient,
  the ± notation for irrational solutions, approximating and checking them, and when to factor instead.

flashcards:
  - front: Square of a binomial → expanded form
    back: |
      (x + k)² = x² + 2kx + k² and (x − k)² = x² − 2kx + k². The middle coefficient is twice k; the constant is k².
    topic_code: "7.11"
  - front: Perfect square trinomial → the test
    back: |
      Halve the coefficient of x and square it; if that equals the constant, the trinomial is a perfect square. x² − 14x + 49: half of −14 is −7, (−7)² = 49 ✓.
    topic_code: "7.11"
  - front: x² − 14x + 49 → written as a square
    back: |
      (x − 7)². Check: x² − 7x − 7x + 49.
    topic_code: "7.11"
  - front: Solving x² + 10x + 25 = 49
    back: |
      The left side is (x + 5)², so x + 5 = ±7: x = 2 or x = −12.
    topic_code: "7.11"
  - front: Why perfect squares matter for solving equations
    back: |
      An equation of the form (square) = (number) is solved by taking both square roots, whether or not the expression factors nicely.
    topic_code: "7.11"
  - front: Completing the square → the idea
    back: |
      x² + bx becomes a perfect square when (b/2)² is added: x² + bx + (b/2)² = (x + b/2)². Add the same amount to the other side, or subtract it again, to keep things equal.
    topic_code: "7.12"
  - front: x² + 8x + ___ → the completing constant
    back: |
      Half of 8 is 4, and 4² = 16: x² + 8x + 16 = (x + 4)².
    topic_code: "7.12"
  - front: x² + 8x + 3 → the form (x + k)² + m
    back: |
      x² + 8x + 16 − 16 + 3 = (x + 4)² − 13. Add and subtract 16 so the value does not change.
    topic_code: "7.12"
  - front: x² − 10x + 7 → the form (x − k)² + m
    back: |
      Half of −10 is −5, square 25: x² − 10x + 25 − 25 + 7 = (x − 5)² − 18.
    topic_code: "7.12"
  - front: Keeping an equation balanced while completing the square
    back: |
      Whatever is added to one side is added to the other: x² + 6x = 7 becomes x² + 6x + 9 = 7 + 9.
    topic_code: "7.12"
  - front: Solving by completing the square → steps
    back: |
      1. Move the constant to the right. 2. Add (b/2)² to both sides. 3. Write the left side as a square. 4. Take both square roots. 5. Solve for x and check.
    topic_code: "7.13"
  - front: Solving x² + 6x − 7 = 0 by completing the square
    back: |
      x² + 6x = 7; add 9: (x + 3)² = 16; x + 3 = ±4; x = 1 or x = −7.
    topic_code: "7.13"
  - front: Solving x² + 3x − 10 = 0 with an odd b
    back: |
      x² + 3x = 10; add (3/2)² = 9/4: (x + 3/2)² = 49/4; x + 3/2 = ±7/2; x = 2 or x = −5.
    topic_code: "7.13"
  - front: Half of an odd coefficient → how to write it
    back: |
      As a fraction, not a decimal that loses accuracy: b = 3 gives 3/2 and (3/2)² = 9/4; b = 5 gives 5/2 and 25/4.
    topic_code: "7.13"
  - front: Solving x² − 6x + 5 = 0 by completing the square
    back: |
      x² − 6x = −5; add 9: (x − 3)² = 4; x − 3 = ±2; x = 5 or x = 1.
    topic_code: "7.13"
  - front: Leading coefficient not 1 → first step
    back: |
      Divide every term by a (when the other side is 0 or a number) so the x² coefficient becomes 1, then complete the square as usual.
    topic_code: "7.14"
  - front: Solving 2x² + 12x + 10 = 0
    back: |
      Divide by 2: x² + 6x + 5 = 0; x² + 6x = −5; add 9: (x + 3)² = 4; x = −1 or x = −5.
    topic_code: "7.14"
  - front: Solving 3x² − 6x − 24 = 0
    back: |
      Divide by 3: x² − 2x − 8 = 0; x² − 2x = 8; add 1: (x − 1)² = 9; x = 4 or x = −2.
    topic_code: "7.14"
  - front: When a does not divide the other coefficients evenly
    back: |
      Fractions are fine. 2x² + 3x − 2 = 0 becomes x² + (3/2)x − 1 = 0, then (x + 3/4)² = 25/16, so x = 1/2 or x = −2.
    topic_code: "7.14"
  - front: Irrational solutions → where they come from
    back: |
      Completing the square gives (x − h)² = k with k not a perfect square: (x − 2)² = 7 gives x = 2 ± √7, and √7 is irrational.
    topic_code: "7.15"
  - front: Solving x² − 4x − 3 = 0
    back: |
      x² − 4x = 3; add 4: (x − 2)² = 7; x − 2 = ±√7; x = 2 + √7 or x = 2 − √7.
    topic_code: "7.15"
  - front: The ± notation → meaning
    back: |
      2 ± √7 is shorthand for two numbers, 2 + √7 and 2 − √7. Both are exact solutions.
    topic_code: "7.15"
  - front: Approximating 2 ± √7
    back: |
      √7 ≈ 2.646, so the solutions are about 4.65 and −0.65. Give the exact form unless a decimal is asked for.
    topic_code: "7.15"
  - front: Solving x² + 2x − 1 = 0
    back: |
      x² + 2x = 1; add 1: (x + 1)² = 2; x = −1 ± √2, about 0.41 and −2.41.
    topic_code: "7.15"
  - front: Checking an irrational solution by substitution
    back: |
      For x = 2 + √7 in x² − 4x − 3: (2 + √7)² = 11 + 4√7; 4x = 8 + 4√7; so 11 + 4√7 − 8 − 4√7 − 3 = 0 ✓.
    topic_code: "7.15"
  - front: Factoring versus completing the square → which to use
    back: |
      Factor when an integer pair is easy to spot. Complete the square when it is not, or when the solutions are irrational; it works for every quadratic equation.
    topic_code: "7.15"
  - front: A mistake to avoid → forgetting the ± when taking the root
    back: |
      (x + 3)² = 16 gives x + 3 = 4 or x + 3 = −4. Dropping the negative root loses the solution x = −7.
    topic_code: "7.13"
  - front: A mistake to avoid → adding (b/2)² to one side only
    back: |
      x² + 6x = 7 becomes (x + 3)² = 16 only if 9 is added to both sides; (x + 3)² = 7 is a different equation.
    topic_code: "7.12"

quiz:
  description: |
    25 questions · about 45 minutes · perfect squares, completing the square, solving with an odd middle
    coefficient or a leading coefficient, and irrational solutions (lessons 7.11 to 7.15), with review of
    factoring and solving by factoring from week 29, the zero product property, solving by reasoning and
    counting solutions from week 28, and vertex form from unit 6. Multiple choice, select-all, true/false
    and numeric items are graded at once; fill-in-the-blank items are matched automatically; the short
    answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: one equation, three views (7.12, 7.13, 7.9, 6.15)
    - slug: alg1-u07-w30-q01
      type: multiple_choice
      topic_code: "7.12"
      source: "IM Algebra 1, Unit 7, Lesson 12"
      points: 1
      stimulus: |
        Consider the equation x² + 6x − 7 = 0.
      prompt: |
        After moving the constant to the right side, what number must be added to both sides to complete the square?
      options:
        - "9, because half of 6 is 3 and 3² = 9"
        - "36, because 6² = 36"
        - "7, to cancel the constant"
        - "3, because half of 6 is 3"
      option_explanations:
        - |
          Correct. x² + 6x + 9 = (x + 3)², so adding 9 to both sides of x² + 6x = 7 makes the left side a perfect square.
        - |
          The completing constant is the square of half the coefficient, (6/2)² = 9, not 6².
        - |
          7 was moved to the other side; the number that completes the square depends only on the coefficient of x.
        - |
          3 is half the coefficient; it must still be squared to give the constant 9.
      answer: 0

    - slug: alg1-u07-w30-q02
      type: multiple_choice
      topic_code: "7.13"
      source: "IM Algebra 1, Unit 7, Lesson 13"
      points: 1
      stimulus: |
        Consider the equation x² + 6x − 7 = 0.
      prompt: |
        After completing the square the equation reads (x + 3)² = 16. What are the solutions?
      options:
        - "x = 1 only"
        - "x = 13 or x = −19"
        - "x = 4 or x = −4"
        - "x = 1 or x = −7"
      option_explanations:
        - |
          The negative square root gives a second solution, x = −7.
        - |
          These come from x + 3 = ±16; the square root of 16 is 4.
        - |
          4 and −4 are the values of x + 3, not of x.
        - |
          Correct. x + 3 = 4 gives x = 1; x + 3 = −4 gives x = −7. Check: 1 + 6 − 7 = 0 and 49 − 42 − 7 = 0.
      answer: 3

    - slug: alg1-u07-w30-q03
      type: multiple_choice
      topic_code: "7.9"
      source: "IM Algebra 1, Unit 7, Lesson 9"
      points: 1
      stimulus: |
        Consider the equation x² + 6x − 7 = 0.
      prompt: |
        Which factorisation of the left side confirms the solutions?
      options:
        - "(x − 7)(x + 1) = 0, giving x = 7 or x = −1"
        - "(x + 7)(x − 1) = 0, giving x = −7 or x = 1"
        - "(x + 3)(x + 3) = 0, giving x = −3"
        - "(x + 6)(x − 7) = 0, giving x = −6 or x = 7"
      option_explanations:
        - |
          (x − 7)(x + 1) = x² − 6x − 7, with the wrong middle sign.
        - |
          Correct. 7 · (−1) = −7 and 7 + (−1) = 6; the zeros agree with completing the square.
        - |
          (x + 3)² = x² + 6x + 9, not x² + 6x − 7; the constant is wrong.
        - |
          (x + 6)(x − 7) = x² − x − 42, nothing like the original.
      answer: 1

    - slug: alg1-u07-w30-q04
      type: multiple_choice
      topic_code: "6.15"
      source: "IM Algebra 1, Unit 6, Lesson 15"
      points: 1
      stimulus: |
        Consider the equation x² + 6x − 7 = 0.
      prompt: |
        Completing the square also rewrites y = x² + 6x − 7 in vertex form. What is that form, and what is the vertex?
      options:
        - "y = (x − 3)² − 16; vertex (3, −16)"
        - "y = (x + 3)² + 16; vertex (−3, 16)"
        - "y = (x + 3)² − 16; vertex (−3, −16)"
        - "y = (x + 3)² − 7; vertex (−3, −7)"
      option_explanations:
        - |
          x² + 6x gives (x + 3)², with vertex at x = −3, not 3.
        - |
          The constant is −16; at x = −3 the function is 9 − 18 − 7 = −16, below the axis.
        - |
          Correct. x² + 6x + 9 − 9 − 7 = (x + 3)² − 16; the vertex is (−3, −16), halfway between the zeros 1 and −7.
        - |
          Adding 9 inside the square must be balanced by subtracting 9: the constant is −9 − 7 = −16.
      answer: 2

    # ---- Multiple choice (7.11–7.15, 7.3)
    - slug: alg1-u07-w30-q05
      type: multiple_choice
      topic_code: "7.11"
      source: "IM Algebra 1, Unit 7, Lesson 11"
      points: 1
      prompt: |
        Which expression is a perfect square trinomial, and what is it the square of?
      options:
        - "x² − 14x + 14 = (x − 7)²"
        - "x² + 49 = (x + 7)²"
        - "x² − 7x + 49 = (x − 7)²"
        - "x² − 14x + 49 = (x − 7)²"
      option_explanations:
        - |
          The constant must be the square of half the middle coefficient, 49, not 14.
        - |
          (x + 7)² = x² + 14x + 49; a sum of squares has no middle term and is not a perfect square trinomial.
        - |
          (x − 7)² has middle term −14x, twice −7, not −7x.
        - |
          Correct. Half of −14 is −7 and (−7)² = 49, so (x − 7)(x − 7) = x² − 14x + 49.
      answer: 3

    - slug: alg1-u07-w30-q06
      type: multiple_choice
      topic_code: "7.3"
      source: "IM Algebra 1, Unit 7, Lesson 3"
      points: 1
      prompt: |
        What are the solutions of (x − 7)² = 36?
      options:
        - "x = 13 or x = 1"
        - "x = 43 or x = −29"
        - "x = 13 only"
        - "x = 6 or x = −6"
      option_explanations:
        - |
          Correct. x − 7 = 6 gives 13; x − 7 = −6 gives 1.
        - |
          These use ±36 instead of ±6; the square root of 36 is 6.
        - |
          x = 1 also works: (1 − 7)² = (−6)² = 36.
        - |
          6 and −6 are the values of x − 7; add 7 to each.
      answer: 0

    - slug: alg1-u07-w30-q07
      type: multiple_choice
      topic_code: "7.12"
      source: "IM Algebra 1, Unit 7, Lesson 12"
      points: 1
      prompt: |
        What number completes the square in x² + 8x + ___, and what is the resulting square?
      options:
        - "64; (x + 8)²"
        - "16; (x + 4)²"
        - "8; (x + 4)²"
        - "4; (x + 2)²"
      option_explanations:
        - |
          (x + 8)² = x² + 16x + 64, whose middle term is 16x, not 8x.
        - |
          Correct. Half of 8 is 4, and 4² = 16: (x + 4)² = x² + 8x + 16.
        - |
          (x + 4)² has constant 16, not 8; the number added must be the square of half the coefficient.
        - |
          (x + 2)² = x² + 4x + 4, whose middle term is 4x.
      answer: 1

    - slug: alg1-u07-w30-q08
      type: multiple_choice
      topic_code: "7.12"
      source: "IM Algebra 1, Unit 7, Lesson 12"
      points: 1
      prompt: |
        Which is x² − 10x + 7 written in the form (x − k)² + m?
      options:
        - "(x − 5)² + 32"
        - "(x − 5)² + 7"
        - "(x − 5)² − 18"
        - "(x − 10)² − 93"
      option_explanations:
        - |
          The 25 is subtracted, not added, after it is put inside the square: 7 − 25 = −18.
        - |
          Adding 25 to make the square must be undone: the constant is 7 − 25 = −18, not 7.
        - |
          Correct. x² − 10x + 25 − 25 + 7 = (x − 5)² − 18.
        - |
          (x − 10)² = x² − 20x + 100 has the wrong middle term; k is half the coefficient, 5.
      answer: 2

    - slug: alg1-u07-w30-q09
      type: multiple_choice
      topic_code: "7.13"
      source: "IM Algebra 1, Unit 7, Lesson 13"
      points: 1
      prompt: |
        Solving x² + 3x − 10 = 0 by completing the square, which line is correct?
      options:
        - "(x + 3)² = 19, so x = −3 ± √19"
        - "(x + 3/2)² = 49/4, so x = 2 or x = −5"
        - "(x + 3/2)² = 10, so x = −3/2 ± √10"
        - "(x + 1.5)² = 11.5, so x = −1.5 ± √11.5"
      option_explanations:
        - |
          Half of 3 is 3/2, not 3; (x + 3)² would need a middle term of 6x.
        - |
          Correct. x² + 3x = 10; add (3/2)² = 9/4: 10 + 9/4 = 49/4; x + 3/2 = ±7/2 gives 2 and −5. Factoring, (x + 5)(x − 2), agrees.
        - |
          9/4 was added to the left side but not to the right; both sides need it, giving 49/4.
        - |
          10 + 1.5 = 11.5 adds half the coefficient instead of its square, 2.25.
      answer: 1

    - slug: alg1-u07-w30-q10
      type: multiple_choice
      topic_code: "7.14"
      source: "IM Algebra 1, Unit 7, Lesson 14"
      points: 1
      prompt: |
        What is a good first step for solving 2x² + 12x + 10 = 0 by completing the square?
      options:
        - "Divide every term by 2 to get x² + 6x + 5 = 0."
        - "Take the square root of both sides."
        - "Add 36 to both sides."
        - "Divide only the x² term by 2."
      option_explanations:
        - |
          Correct. With a leading coefficient of 1 the usual method applies: x² + 6x = −5, add 9, (x + 3)² = 4, x = −1 or −5.
        - |
          Neither side is a perfect square yet; the square has to be built first.
        - |
          36 is (12/2)² but the x² coefficient is 2, so x² + 6x + 9 is the square to aim for after dividing.
        - |
          Dividing one term changes the equation; every term must be divided by 2.
      answer: 0

    - slug: alg1-u07-w30-q11
      type: multiple_choice
      topic_code: "7.14"
      source: "IM Algebra 1, Unit 7, Lesson 14"
      points: 1
      prompt: |
        What are the solutions of 3x² − 6x − 24 = 0?
      options:
        - "x = 8 or x = −3"
        - "x = 4 or x = 2"
        - "x = 1 ± √8"
        - "x = 4 or x = −2"
      option_explanations:
        - |
          These would be the solutions if the equation were x² − 5x − 24 = 0; here dividing by 3 gives x² − 2x − 8.
        - |
          x = 2 gives 12 − 12 − 24 = −24, not 0; the roots are 1 + 3 and 1 − 3.
        - |
          (x − 1)² equals 9, a perfect square, so the solutions are rational: 1 ± 3.
        - |
          Correct. Divide by 3: x² − 2x − 8 = 0; x² − 2x = 8; add 1: (x − 1)² = 9; x − 1 = ±3.
      answer: 3

    - slug: alg1-u07-w30-q12
      type: multiple_choice
      topic_code: "7.15"
      source: "IM Algebra 1, Unit 7, Lesson 15"
      points: 1
      prompt: |
        What are the exact solutions of x² − 4x − 3 = 0?
      options:
        - "x = −2 ± √7"
        - "x = 4 ± √7"
        - "x = 2 ± √7"
        - "x = 2 ± √3"
      option_explanations:
        - |
          x² − 4x completes to (x − 2)², so the solutions are centred at 2, not −2.
        - |
          Half of 4 is 2; the square is (x − 2)², so the solutions are 2 ± √7.
        - |
          Correct. x² − 4x = 3; add 4: (x − 2)² = 7; x = 2 ± √7, about 4.65 and −0.65.
        - |
          After adding 4 to both sides the right side is 3 + 4 = 7, not 3.
      answer: 2

    - slug: alg1-u07-w30-q13
      type: multiple_choice
      topic_code: "7.15"
      source: "IM Algebra 1, Unit 7, Lesson 15"
      points: 1
      prompt: |
        Which statement about the solutions of x² + 2x − 1 = 0 is correct?
      options:
        - "They are −1 + √2 ≈ 0.41 and −1 − √2 ≈ −2.41, both irrational."
        - "They are −1 ± 2, that is 1 and −3."
        - "They are 1 and −1, because the equation factors as (x + 1)(x − 1)."
        - "There are none, because the expression does not factor."
      option_explanations:
        - |
          Correct. (x + 1)² = 2 gives x = −1 ± √2, and √2 is irrational.
        - |
          The square root of 2 is not 2; (x + 1)² = 2 gives x + 1 = ±√2.
        - |
          (x + 1)(x − 1) = x² − 1, which is not x² + 2x − 1; and 1 + 2 − 1 = 2 ≠ 0.
        - |
          Not factoring over the integers does not mean no solutions; completing the square finds two.
      answer: 0

    # ---- Select-all (7.11, 7.5)
    - slug: alg1-u07-w30-q14
      type: multi_select
      topic_code: "7.11"
      source: "IM Algebra 1, Unit 7, Lesson 11"
      points: 2
      partial_credit: true
      prompt: |
        Which expressions are perfect square trinomials? Select all that apply.
      options:
        - "x² + 10x − 25"
        - "x² + 4x + 16"
        - "x² − 20x + 100"
        - "x² + 16x + 64"
        - "x² − 6x + 9"
      option_explanations:
        - |
          A perfect square has a positive constant, since it is k²; −25 cannot be the square of a real number.
        - |
          Half of 4 is 2 and 2² = 4, not 16; (x + 2)² = x² + 4x + 4.
        - |
          Correct. Half of −20 is −10 and 100 = (−10)²: (x − 10)².
        - |
          Correct. Half of 16 is 8 and 8² = 64: (x + 8)².
        - |
          Correct. Half of −6 is −3 and (−3)² = 9: (x − 3)².
      answer: [2, 3, 4]

    - slug: alg1-u07-w30-q15
      type: multi_select
      topic_code: "7.5"
      source: "IM Algebra 1, Unit 7, Lesson 5"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about numbers of solutions are true? Select all that apply.
      options:
        - "(x + 1)² = −5 has no solutions."
        - "x² = 0.01 has two solutions."
        - "(x − 3)² = 7 has two solutions."
        - "x² + 9 = 0 has two solutions."
        - "(x − 2)² = 0 has exactly one solution."
      option_explanations:
        - |
          Correct. A square is never negative, so no real x works.
        - |
          Correct. 0.1 and −0.1 both square to 0.01.
        - |
          Correct. x = 3 + √7 and x = 3 − √7; the right side need not be a perfect square for there to be two.
        - |
          x² = −9 has no real solutions; a square cannot be negative.
        - |
          Correct. Only 0 squares to 0, so x = 2 is the only solution.
      answer: [0, 1, 2, 4]

    # ---- True/false (7.15, 7.8)
    - slug: alg1-u07-w30-q16
      type: true_false
      topic_code: "7.15"
      source: "IM Algebra 1, Unit 7, Lesson 15"
      points: 1
      prompt: |
        True or false: the solutions of (x − 5)² = 20 are 5 + √20 and 5 − √20, and both are irrational.
      answer: true
      explanation: |
        True. Taking both square roots gives x = 5 ± √20, and 20 is not a perfect square, so √20 (about 4.47) is irrational; adding 5 keeps it irrational.

    - slug: alg1-u07-w30-q17
      type: true_false
      topic_code: "7.8"
      source: "IM Algebra 1, Unit 7, Lesson 8"
      points: 1
      prompt: |
        True or false: x² − 64 is equivalent to (x − 8)².
      answer: false
      explanation: |
        False. (x − 8)² = x² − 16x + 64. The difference of squares x² − 64 factors as (x − 8)(x + 8), and the middle terms cancel.

    # ---- Fill in the blank (7.12, 7.4)
    - slug: alg1-u07-w30-q18
      type: fill_blank
      topic_code: "7.12"
      source: "IM Algebra 1, Unit 7, Lesson 12"
      points: 1
      prompt: |
        To complete the square for x² + 12x, add ____.
      answer: ["36", "thirty-six", "thirty six"]
      explanation: |
        Half of 12 is 6 and 6² = 36: x² + 12x + 36 = (x + 6)².

    - slug: alg1-u07-w30-q19
      type: fill_blank
      topic_code: "7.4"
      source: "IM Algebra 1, Unit 7, Lesson 4"
      points: 1
      prompt: |
        If (x − 3)(x + 5) = 0, then x = 3 or x = ____.
      answer: ["-5", "−5", "x = -5", "x = −5", "negative 5"]
      explanation: |
        The zero product property: x + 5 = 0 gives x = −5.

