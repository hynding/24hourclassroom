    # ---- Short answer (7.13, 7.14)
    - slug: alg1-u07-w30-q23
      type: short_answer
      topic_code: "7.13"
      source: "IM Algebra 1, Unit 7, Lesson 13"
      points: 3
      prompt: |
        Solve x² + 10x + 16 = 0 by completing the square.

        (a) Rewrite the equation as (x + k)² = m, showing what you added to both sides.
        (b) Take square roots and state both solutions.
        (c) Confirm the solutions by factoring the original left side.
      answer: |
        (a) x² + 10x = −16; add (10/2)² = 25 to both sides: (x + 5)² = 9.
        (b) x + 5 = ±3, so x = −2 or x = −8.
        (c) x² + 10x + 16 = (x + 2)(x + 8), whose zeros are −2 and −8, the same.
      explanation: |
        Three points, one per part.

        (a) 1 pt: (x + 5)² = 9 with the 25 added to both sides.

        (b) 1 pt: −2 and −8.

        (c) 1 pt: (x + 2)(x + 8) with the agreement noted.

    - slug: alg1-u07-w30-q24
      type: short_answer
      topic_code: "7.14"
      source: "IM Algebra 1, Unit 7, Lesson 14"
      points: 3
      prompt: |
        Solve 2x² − 8x − 6 = 0.

        (a) Explain the first step and carry it out.
        (b) Complete the square and give the exact solutions.
        (c) Give the solutions as decimals to two places and say whether they are rational or irrational.
      answer: |
        (a) Divide every term by 2 so the x² coefficient is 1: x² − 4x − 3 = 0.
        (b) x² − 4x = 3; add 4: (x − 2)² = 7; x = 2 ± √7.
        (c) About 4.65 and −0.65; irrational, because √7 is not a rational number (7 is not a perfect square).
      explanation: |
        Three points, one per part.

        (a) 1 pt: dividing by 2 with the reason.

        (b) 1 pt: 2 ± √7.

        (c) 1 pt: 4.65 and −0.65, irrational with a reason.

    # ---- Long answer (7.15)
    - slug: alg1-u07-w30-q25
      type: long_answer
      topic_code: "7.15"
      source: "IM Algebra 1, Unit 7, Lesson 15"
      points: 6
      prompt: |
        A rectangular pool is to be 4 metres longer than it is wide, with an area of 50 square metres. Let w be the width in metres.

        (1) Write an equation for w and put it in the form w² + bw + c = 0.
        (2) Explain why factoring with integers does not work here.
        (3) Solve by completing the square, giving the exact solutions.
        (4) Choose the solution that describes the pool, give the width and length to two decimal places, and check that their product is close to 50.
      answer: |
        (1) w(w + 4) = 50, so w² + 4w − 50 = 0.
        (2) Two integers with product −50 and sum 4 would be needed; the pairs (1, −50), (2, −25), (5, −10) and their opposites have sums ±49, ±23, ±5, never 4.
        (3) w² + 4w = 50; add 4: (w + 2)² = 54; w + 2 = ±√54; w = −2 + √54 or w = −2 − √54.
        (4) A width must be positive, so w = −2 + √54 ≈ −2 + 7.348 = 5.35 m; the length is w + 4 ≈ 9.35 m. Check: 5.35 × 9.35 ≈ 50.0.
      explanation: |
        Six points.

        (1) 1 pt: w² + 4w − 50 = 0.

        (2) 1 pt: a check of the factor pairs of −50 showing none sum to 4.

        (3) 2 pts: 1 for (w + 2)² = 54, 1 for the exact solutions −2 ± √54.

        (4) 2 pts: 1 for choosing the positive root with the dimensions 5.35 and 9.35, 1 for the check.

        Common errors: adding 4 to only one side; writing √54 as 27; keeping the negative width.
