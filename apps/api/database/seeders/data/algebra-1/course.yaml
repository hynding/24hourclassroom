# The Algebra 1 course map. Week files live under unit-NN-<slug>/week-NN.yaml.
# Titles and slugs are composed by Database\Seeders\Curriculum\Course from the
# numbers here, so nothing in a week file repeats the naming convention.
title: Algebra 1
# Every title starts with `prefix`; every test, material and the course row
# itself carry a slug that starts with `slug`.
prefix: Algebra 1
slug: alg1
# The course page's introduction. Folded (`>`): one paragraph, not hard line breaks.
description: >
  A full year of Algebra 1 for a first-year high-school algebra student, or an
  8th grader taking it early, one week at a time: a study guide, a flashcard
  deck and a quiz every week, a summary sheet and an exam at the end of each
  of the seven units, and a final-exam prep guide and full practice final at
  the end of the year. The course runs from one-variable statistics through
  linear equations, inequalities and systems, two-variable statistics,
  functions, exponential functions, quadratic functions and quadratic
  equations. Adapted from IM 9–12 Math by Illustrative Mathematics under
  CC BY 4.0, rewritten in our own words with original worked examples,
  questions and cards.
  Free to copy, adapt and share under CC BY 4.0, crediting 24 Hour
  Classroom.
teacher: { name: "Algebra 1 Teacher", email: algebra1@example.com }
student: { name: "Algebra 1 Student", email: algebra1-student@example.com }
# Monday of week 1. Null means no due dates: the whole course is open at once.
# Weeks 1-32 teach; week 33 is the prep guide, week 34 the practice final.
start_date: 2026-08-31
subject: math
grade_level: "9-12"
review:
  prep_guide_week: 33
  practice_exam_week: 34
  prep_guide_description: The format of the practice final, what each of the seven units contributes, a two-week review plan, the formulas and procedures to know cold, and how to show work so a grader can follow it.
# Every guide and summary must end with all of these (the content lint).
attribution_markers: ["Illustrative Mathematics", "CC BY 4.0"]
attribution: |
  Adapted from IM 9–12 Math by Illustrative Mathematics, © 2019 Illustrative
  Mathematics, licensed under CC BY 4.0
  (https://creativecommons.org/licenses/by/4.0/). Unit and lesson titles and
  learning goals follow the IM Algebra 1 course at
  https://im.kendallhunt.com/HS/teachers/1/; every explanation, worked
  example, flashcard and question is written for this course. The
  Illustrative Mathematics name and logo are trademarks and are used here
  only to credit the source.
# The eight Standards for Mathematical Practice; guides tag their lessons with them.
practices:
  MP1: Make sense of problems and persevere in solving them
  MP2: Reason abstractly and quantitatively
  MP3: Construct viable arguments and critique the reasoning of others
  MP4: Model with mathematics
  MP5: Use appropriate tools strategically
  MP6: Attend to precision
  MP7: Look for and make use of structure
  MP8: Look for and express regularity in repeated reasoning
