unit: 5
description: |
  45 questions · about 90 minutes · every lesson of Unit 5 (5.1 to 5.21): linear versus exponential growth,
  growth and decay factors, writing and graphing a · bˣ, negative exponents, interpreting parameters, rates of
  change, modelling exponential data, percent change, compound interest and compounding intervals, equivalent
  forms, comparing growth, and predicting populations, plus review of Units 3 and 4. Three stimulus sets share
  a situation across consecutive items. Multiple choice, select-all, true/false and numeric items are graded
  at once; fill-in-the-blank items are matched automatically; the short answers and the long answer are
  graded by your teacher against the scoring notes.
questions:
  # ---- Growth and decay basics (5.1-5.5)
  - slug: alg1-u05-exam-q01
    type: multiple_choice
    topic_code: "5.1"
    source: "IM Algebra 1, Unit 5, Lesson 1"
    points: 1
    prompt: |
      A jar starts with 2 coins. Plan X adds 20 coins every day. Plan Y doubles the number of coins every day. Which statement is true?
    options:
      - "Plan X has more coins on day 3, but plan Y has more by day 7."
      - "Plan X has more coins on every day."
      - "Plan Y has more coins on every day after day 0."
      - "The plans have the same number of coins on day 5."
    option_explanations:
      - |
        Correct. Day 3: X has 62, Y has 16. Day 7: X has 142, Y has 256. Doubling starts slowly and then overtakes.
      - |
        By day 7 the doubling jar holds 256 coins against 142; it keeps pulling ahead.
      - |
        On day 1 plan X has 22 coins and plan Y only 4, so Y is behind at first.
      - |
        Day 5: X has 102 coins, Y has 64; they are not equal.
    answer: 0

  - slug: alg1-u05-exam-q02
    type: multiple_choice
    topic_code: "5.2"
    source: "IM Algebra 1, Unit 5, Lesson 2"
    points: 1
    prompt: |
      A table lists outputs 12, 18, 27, 40.5 for inputs 0, 1, 2, 3. What kind of pattern is this?
    options:
      - "Exponential, with growth factor 1.5"
      - "Linear, with rate 6"
      - "Exponential, with growth factor 6"
      - "Neither linear nor exponential"
    option_explanations:
      - |
        Correct. 18/12 = 27/18 = 40.5/27 = 1.5, a constant ratio.
      - |
        The differences 6, 9, 13.5 are not constant, so it is not linear.
      - |
        6 is the first difference, not a ratio; each value is 1.5 times the previous.
      - |
        The ratios are constant, which is exactly the exponential pattern.
    answer: 0

  - slug: alg1-u05-exam-q03
    type: multiple_choice
    topic_code: "5.3"
    source: "IM Algebra 1, Unit 5, Lesson 3"
    points: 1
    prompt: |
      An exponential function has f(1) = 20 and f(2) = 80. What is its equation?
    options:
      - "f(x) = 5 · 4ˣ"
      - "f(x) = 20 · 4ˣ"
      - "f(x) = 20 · 60ˣ"
      - "f(x) = 4 · 5ˣ"
    option_explanations:
      - |
        Correct. The factor is 80/20 = 4, and f(0) = 20/4 = 5.
      - |
        20 is f(1), not the starting value; this rule gives f(1) = 80.
      - |
        60 is the difference between the values, not the ratio.
      - |
        This gives f(1) = 20 but f(2) = 100, not 80.
    answer: 0

  - slug: alg1-u05-exam-q04
    type: multiple_choice
    topic_code: "5.3"
    source: "IM Algebra 1, Unit 5, Lesson 3"
    points: 1
    prompt: |
      Which is the value of 2 · 5³?
    options:
      - "250"
      - "1,000"
      - "30"
      - "17"
    option_explanations:
      - |
        Correct. The power comes first: 5³ = 125, then 2 · 125 = 250.
      - |
        1,000 is (2 · 5)³ = 10³, which multiplies before taking the power.
      - |
        30 is 2 · 5 · 3, treating the exponent as a multiplier.
      - |
        17 is 2 + 5 · 3, mixing up the operations entirely.
    answer: 0

  - slug: alg1-u05-exam-q05
    type: multiple_choice
    topic_code: "5.4"
    source: "IM Algebra 1, Unit 5, Lesson 4"
    points: 1
    prompt: |
      A pond's area of ice shrinks by a third each day. Which function gives the area after d days if it starts at 900 m²?
    options:
      - "A(d) = 900 · (2/3)ᵈ"
      - "A(d) = 900 · (1/3)ᵈ"
      - "A(d) = 900 − 300d"
      - "A(d) = 900 · 3ᵈ"
    option_explanations:
      - |
        Correct. Losing a third leaves two thirds, so the factor is 2/3.
      - |
        1/3 is the fraction lost; the factor is the fraction that remains.
      - |
        Subtracting 300 each day is linear; the loss is a third of a shrinking amount.
      - |
        A factor of 3 would triple the area each day.
    answer: 0

  - slug: alg1-u05-exam-q06
    type: multiple_choice
    topic_code: "5.5"
    source: "IM Algebra 1, Unit 5, Lesson 5"
    points: 1
    prompt: |
      A quantity decays exponentially and is 400 at x = 1 and 256 at x = 3. What is the decay factor per step?
    options:
      - "0.8"
      - "0.64"
      - "0.32"
      - "0.6"
    option_explanations:
      - |
        Correct. Two steps multiply by b² = 256/400 = 0.64, so b = 0.8.
      - |
        0.64 is the factor over two steps, not one.
      - |
        0.32 halves 0.64 instead of taking its square root.
      - |
        0.6² = 0.36, which would give 144 at x = 3, not 256.
    answer: 0

  # ---- Stimulus set A: a cooling drink (5.5, 5.6, 5.8)
  - slug: alg1-u05-exam-q07
    type: multiple_choice
    topic_code: "5.5"
    source: "IM Algebra 1, Unit 5, Lesson 5"
    points: 1
    stimulus: |
      A drink is taken out of a hot water bath. The difference between its temperature and the room's is 50 degrees at first and falls by 10% each minute. D(m) is the difference after m minutes.
    prompt: |
      Which equation gives D(m)?
    options:
      - "D(m) = 50 · 0.9ᵐ"
      - "D(m) = 50 · 0.1ᵐ"
      - "D(m) = 50 − 5m"
      - "D(m) = 0.9 · 50ᵐ"
    option_explanations:
      - |
        Correct. Losing 10% leaves 90%, so the difference is multiplied by 0.9 each minute.
      - |
        0.1 is the fraction lost, not the fraction that remains.
      - |
        Subtracting 5 degrees every minute is linear; the loss is 10% of a shrinking difference.
      - |
        This puts the starting value in the base and the factor in front, which is backwards.
    answer: 0

  - slug: alg1-u05-exam-q08
    type: multiple_choice
    topic_code: "5.6"
    source: "IM Algebra 1, Unit 5, Lesson 6"
    points: 1
    stimulus: |
      A drink is taken out of a hot water bath. The difference between its temperature and the room's is 50 degrees at first and falls by 10% each minute. D(m) is the difference after m minutes.
    prompt: |
      Which statement about the graph of D is correct?
    options:
      - "It starts at (0, 50), decreases, flattens, and never reaches 0."
      - "It starts at (0, 50) and reaches 0 at m = 10."
      - "It starts at (0, 50) and decreases at a constant rate."
      - "It starts at (0, 0) and rises toward 50."
    option_explanations:
      - |
        Correct. Each minute removes 10% of a smaller difference, so the drops shrink and the curve approaches the axis without touching it.
      - |
        0.9¹⁰ ≈ 0.35, so about 17 degrees of difference remain at 10 minutes; the graph never reaches 0.
      - |
        A constant rate would be a straight line; a percentage loss gives a curve.
      - |
        The difference is largest at the start and decreases.
    answer: 0

  - slug: alg1-u05-exam-q09
    type: multiple_choice
    topic_code: "5.8"
    source: "IM Algebra 1, Unit 5, Lesson 8"
    points: 1
    stimulus: |
      A drink is taken out of a hot water bath. The difference between its temperature and the room's is 50 degrees at first and falls by 10% each minute. D(m) is the difference after m minutes.
    prompt: |
      What does the equation D(m) = 25 ask, and roughly what is its solution?
    options:
      - "It asks when the difference has halved; m ≈ 6.6 minutes, since 0.9⁶ ≈ 0.53 and 0.9⁷ ≈ 0.48."
      - "It asks for the difference after 25 minutes; D(25) ≈ 3.6 degrees."
      - "It asks when the drink reaches 25 degrees; m = 25."
      - "It has no solution because D never equals 25."
    option_explanations:
      - |
        Correct. Solving D(m) = 25 means finding the input with output 25, half the starting difference, between 6 and 7 minutes.
      - |
        D(25) evaluates the function at 25; the equation D(m) = 25 asks for the input instead.
      - |
        D measures the difference from room temperature, not the drink's temperature, and 25 is an output, not a time.
      - |
        D takes every value between 50 and 0, so it equals 25 at some time.
    answer: 0

  # ---- Graphs, exponents, interpretation, rates, modelling (5.6-5.13)
  - slug: alg1-u05-exam-q10
    type: multiple_choice
    topic_code: "5.6"
    source: "IM Algebra 1, Unit 5, Lesson 6"
    points: 1
    prompt: |
      An exponential graph passes through (0, 8) and (3, 64). What is its equation?
    options:
      - "y = 8 · 2ˣ"
      - "y = 8 · 8ˣ"
      - "y = 8 + 56x/3"
      - "y = 64 · 2ˣ"
    option_explanations:
      - |
        Correct. a = 8 and b³ = 64/8 = 8, so b = 2.
      - |
        8 is b³, the factor over three steps; the factor per step is its cube root, 2.
      - |
        This is the line through the two points, not an exponential function.
      - |
        The y-intercept is 8, the value at x = 0; 64 is the value at x = 3.
    answer: 0

  - slug: alg1-u05-exam-q11
    type: multiple_choice
    topic_code: "5.7"
    source: "IM Algebra 1, Unit 5, Lesson 7"
    points: 1
    prompt: |
      What is 12 · 2⁻²?
    options:
      - "3"
      - "−48"
      - "−3"
      - "48"
    option_explanations:
      - |
        Correct. The negative exponent inverts the power: 2⁻² = 1/4, and 12 · (1/4) = 3.
      - |
        A negative exponent inverts the power; it does not make the result negative.
      - |
        The value is positive, because 12 times a positive fraction is positive.
      - |
        48 is 12 · 2², ignoring the negative sign on the exponent.
    answer: 0

  - slug: alg1-u05-exam-q12
    type: multiple_choice
    topic_code: "5.9"
    source: "IM Algebra 1, Unit 5, Lesson 9"
    points: 1
    prompt: |
      A bee colony is modelled by B(w) = 1,500 · 1.06ʷ, with w in weeks. Which interpretation is correct?
    options:
      - "The colony started with 1,500 bees and grows 6% each week."
      - "The colony started with 1,500 bees and grows 106% each week."
      - "The colony gains 1.06 bees each week."
      - "The colony started with 1.06 bees and grows by 1,500 each week."
    option_explanations:
      - |
        Correct. B(0) = 1,500 and multiplying by 1.06 is a 6% increase per week.
      - |
        A factor of 1.06 means 106% of the previous size, which is a 6% increase.
      - |
        The factor is a multiplier, not a number of bees added.
      - |
        The number in front is the starting value and the base is the factor, not the other way round.
    answer: 0

  - slug: alg1-u05-exam-q13
    type: multiple_choice
    topic_code: "5.10"
    source: "IM Algebra 1, Unit 5, Lesson 10"
    points: 1
    prompt: |
      For f(x) = 3ˣ, the average rate of change from 0 to 1 is 2. What is the average rate of change from 2 to 3?
    options:
      - "18"
      - "2"
      - "6"
      - "27"
    option_explanations:
      - |
        Correct. (27 − 9)/(3 − 2) = 18, which is the first rate multiplied by 3² = 9.
      - |
        Only a linear function has the same rate over every interval.
      - |
        6 is the rate from 1 to 2 (9 − 3); from 2 to 3 it triples again.
      - |
        27 is f(3), not the change from f(2) to f(3).
    answer: 0

  - slug: alg1-u05-exam-q14
    type: multiple_choice
    topic_code: "5.11"
    source: "IM Algebra 1, Unit 5, Lesson 11"
    points: 1
    prompt: |
      Daily counts of a mould patch's area in cm² are 4, 6.1, 9, 13.4, 20. Which model is most appropriate?
    options:
      - "A(d) = 4 · 1.5ᵈ, because the ratios are about 1.5"
      - "A(d) = 4 + 4d, because the area grows about 4 per day"
      - "A(d) = 4 · 2ᵈ, because the area roughly doubles"
      - "A(d) = 20 · 1.5ᵈ, starting from the last value"
    option_explanations:
      - |
        Correct. 6.1/4 ≈ 1.53, 9/6.1 ≈ 1.48, 13.4/9 ≈ 1.49, 20/13.4 ≈ 1.49: a steady ratio near 1.5.
      - |
        The daily increases (2.1, 2.9, 4.4, 6.6) grow, so a line does not fit.
      - |
        Doubling would predict 64 on day 4, far above 20.
      - |
        The starting value is the day-0 count, 4, not the last count.
    answer: 0

  - slug: alg1-u05-exam-q15
    type: multiple_choice
    topic_code: "5.13"
    source: "IM Algebra 1, Unit 5, Lesson 13"
    points: 1
    prompt: |
      How does the graph of y = 3 · 2ˣ compare with the graph of y = 2ˣ?
    options:
      - "Every output is three times as large, so the graph is stretched vertically and crosses the y-axis at (0, 3)."
      - "It is the same graph shifted 3 units to the right."
      - "It grows three times as fast in percentage terms."
      - "It crosses the y-axis at (0, 1) but is steeper."
    option_explanations:
      - |
        Correct. Changing a multiplies all outputs by a and moves the intercept to (0, a); the factor is unchanged.
      - |
        A horizontal shift would change the intercept differently; multiplying by 3 scales outputs instead.
      - |
        Both double each step; the percentage growth is the same 100% per unit.
      - |
        The intercept is 3 · 2⁰ = 3, not 1; the two graphs have the same steepness ratio but different heights.
    answer: 0

  # ---- Stimulus set B: a college fund (5.16, 5.17, 5.18)
  - slug: alg1-u05-exam-q16
    type: multiple_choice
    topic_code: "5.16"
    source: "IM Algebra 1, Unit 5, Lesson 16"
    points: 1
    stimulus: |
      A college fund opens with $5,000 at 4% interest per year, compounded annually. No other deposits are made.
    prompt: |
      Which function gives the balance F(t) after t years, and what is the balance after 3 years?
    options:
      - "F(t) = 5,000 · 1.04ᵗ; about $5,624.32"
      - "F(t) = 5,000 + 200t; $5,600"
      - "F(t) = 5,000 · 0.04ᵗ; $0.32"
      - "F(t) = 5,000 · 1.12; $5,600"
    option_explanations:
      - |
        Correct. Each year multiplies the balance by 1.04; 5,000 · 1.04³ = 5,624.32.
      - |
        Adding $200 a year is simple interest, which ignores interest earned on interest.
      - |
        0.04 is the interest rate; the yearly multiplier is 1 + 0.04 = 1.04.
      - |
        1.12 adds three years of 4% without compounding; the true three-year factor is 1.04³ ≈ 1.1249.
    answer: 0

  - slug: alg1-u05-exam-q17
    type: multiple_choice
    topic_code: "5.17"
    source: "IM Algebra 1, Unit 5, Lesson 17"
    points: 1
    stimulus: |
      A college fund opens with $5,000 at 4% interest per year, compounded annually. No other deposits are made.
    prompt: |
      Another bank offers 4% per year compounded quarterly. Which function gives that balance after t years?
    options:
      - "5,000 · 1.01^(4t)"
      - "5,000 · 1.04^(4t)"
      - "5,000 · 1.01ᵗ"
      - "5,000 · 1.16ᵗ"
    option_explanations:
      - |
        Correct. The quarterly rate is 4%/4 = 1%, applied 4t times in t years.
      - |
        Applying the full 4% every quarter would be 16% a year before compounding.
      - |
        This applies the quarterly factor only once per year.
      - |
        1.16 would be a 16% annual rate compounded once a year, four times the advertised rate.
    answer: 0

  - slug: alg1-u05-exam-q18
    type: multiple_choice
    topic_code: "5.18"
    source: "IM Algebra 1, Unit 5, Lesson 18"
    points: 1
    stimulus: |
      A college fund opens with $5,000 at 4% interest per year, compounded annually. No other deposits are made.
    prompt: |
      The quarterly-compounding function 5,000 · 1.01^(4t) can be rewritten as 5,000 · (1.01⁴)ᵗ ≈ 5,000 · 1.0406ᵗ. What does this show?
    options:
      - "Quarterly compounding at 4% is equivalent to annual compounding at about 4.06%."
      - "Quarterly compounding at 4% is equivalent to annual compounding at exactly 4%."
      - "The fund grows 1.0406% each quarter."
      - "The two forms give different balances."
    option_explanations:
      - |
        Correct. The effective annual factor is 1.01⁴ ≈ 1.0406, slightly more than 1.04.
      - |
        Compounding within the year earns a little extra, so the effective rate exceeds 4%.
      - |
        1.0406 is the yearly factor; the quarterly factor is 1.01.
      - |
        They are equivalent expressions and give exactly the same balances.
    answer: 0

  # ---- Percent change, comparison, populations (5.14-5.21)
  - slug: alg1-u05-exam-q19
    type: multiple_choice
    topic_code: "5.14"
    source: "IM Algebra 1, Unit 5, Lesson 14"
    points: 1
    prompt: |
      A jacket's price is marked up 25% and then the new price is discounted 25%. The final price is what fraction of the original?
    options:
      - "93.75%"
      - "100%"
      - "106.25%"
      - "75%"
    option_explanations:
      - |
        Correct. The two factors multiply: 1.25 · 0.75 = 0.9375, so the final price is 93.75% of the original.
      - |
        The 25% discount is taken from a larger amount than the 25% mark-up was added to, so they do not cancel.
      - |
        The combined factor is below 1; the final price is lower than the original.
      - |
        75% would be a single 25% discount with no mark-up.
    answer: 0

  - slug: alg1-u05-exam-q20
    type: multiple_choice
    topic_code: "5.15"
    source: "IM Algebra 1, Unit 5, Lesson 15"
    points: 1
    prompt: |
      A laptop bought for $1,200 loses 20% of its value each year. Which expression gives its value after 4 years?
    options:
      - "1,200 · 0.8⁴"
      - "1,200 − 240 · 4"
      - "1,200 · 0.2⁴"
      - "1,200 · 0.8 · 4"
    option_explanations:
      - |
        Correct. Each year keeps 80%: 1,200 · 0.8⁴ ≈ $491.52.
      - |
        Subtracting $240 a year is linear; the 20% is of a shrinking value.
      - |
        0.2 is the fraction lost each year; the factor is the 0.8 that remains.
      - |
        Multiplying by 0.8 once and then by 4 is not repeated percent change.
    answer: 0

  - slug: alg1-u05-exam-q21
    type: multiple_choice
    topic_code: "5.19"
    source: "IM Algebra 1, Unit 5, Lesson 19"
    points: 1
    prompt: |
      L(t) = 2,000 + 150t and E(t) = 2,000 · 1.06ᵗ. Which statement is true?
    options:
      - "L changes faster from t = 0 to 5, but E eventually overtakes L and stays ahead."
      - "E changes faster on every interval because it is exponential."
      - "L stays ahead forever because 150 per year is more than 6% of 2,000."
      - "E and L are equal at t = 5."
    option_explanations:
      - |
        Correct. From 0 to 5, L's rate is 150 against E's roughly 135; but E's increases keep growing and it passes L later.
      - |
        Early on, 6% of about 2,000 is roughly 120 to 135 per year, less than 150.
      - |
        6% of a growing amount eventually exceeds 150 per year, and from then on E gains ground.
      - |
        At t = 5, L = 2,750 and E ≈ 2,676; they are not equal.
    answer: 0

  - slug: alg1-u05-exam-q22
    type: multiple_choice
    topic_code: "5.20"
    source: "IM Algebra 1, Unit 5, Lesson 20"
    points: 1
    prompt: |
      A population grows 4% per year. By what factor does it grow over any 10-year period?
    options:
      - "1.04¹⁰ ≈ 1.48"
      - "1.4"
      - "1.04 · 10 = 10.4"
      - "It depends on which 10 years are chosen."
    option_explanations:
      - |
        Correct. Ten years of 4% growth compound to 1.04¹⁰ ≈ 1.48, over any decade.
      - |
        1.4 adds ten 4% rates and ignores compounding.
      - |
        Multiplying a factor by 10 has no meaning; factors multiply together.
      - |
        The equal-interval property makes the factor the same for every interval of the same width.
    answer: 0

  - slug: alg1-u05-exam-q23
    type: multiple_choice
    topic_code: "5.21"
    source: "IM Algebra 1, Unit 5, Lesson 21"
    points: 1
    prompt: |
      A town's population was 30,000 in 2010 and 36,000 in 2020. Assuming exponential growth, what does the model predict for 2040?
    options:
      - "About 51,840"
      - "48,000"
      - "43,200"
      - "72,000"
    option_explanations:
      - |
        Correct. The factor per decade is 1.2; 2040 is three decades after 2010: 30,000 · 1.2³ = 51,840.
      - |
        48,000 adds 6,000 per decade, which is the linear prediction.
      - |
        43,200 is the 2030 prediction (two decades), one decade short.
      - |
        72,000 doubles the 2020 figure; the factor is 1.2 per decade, not 2.
    answer: 0

  - slug: alg1-u05-exam-q24
    type: multiple_choice
    topic_code: "5.12"
    source: "IM Algebra 1, Unit 5, Lesson 12"
    points: 1
    prompt: |
      Which equation has a graph that falls from left to right and crosses the y-axis at (0, 40)?
    options:
      - "y = 40 · 0.7ˣ"
      - "y = 40 · 1.7ˣ"
      - "y = 0.7 · 40ˣ"
      - "y = 70 · 0.4ˣ"
    option_explanations:
      - |
        Correct. The intercept is 40 and the factor 0.7 is below 1, so the graph decreases.
      - |
        A factor of 1.7 is greater than 1, so this graph rises from left to right.
      - |
        This crosses the y-axis at (0, 0.7) and rises steeply.
      - |
        This falls, but it crosses the y-axis at (0, 70).
    answer: 0

  # ---- Stimulus set C: a city's census (5.11, 5.20, 5.21)
  - slug: alg1-u05-exam-q25
    type: multiple_choice
    topic_code: "5.11"
    source: "IM Algebra 1, Unit 5, Lesson 11"
    points: 1
    stimulus: |
      A city's population, in thousands, at four censuses taken every ten years: 1980: 125; 1990: 150; 2000: 180; 2010: 216.
    prompt: |
      Which model best fits the data, with d the number of decades after 1980?
    options:
      - "P(d) = 125 · 1.2ᵈ, because each count is 1.2 times the previous one"
      - "P(d) = 125 + 30d, because the counts rise by about 30 each decade"
      - "P(d) = 125 · 2ᵈ, because the population nearly doubles over the period"
      - "P(d) = 216 · 1.2ᵈ, starting from the latest count"
    option_explanations:
      - |
        Correct. 150/125 = 180/150 = 216/180 = 1.2 exactly.
      - |
        The differences are 25, 30, 36, growing each decade, so a line underestimates.
      - |
        Doubling every decade would give 1,000 by 2010, far above 216.
      - |
        The starting value should be the 1980 count, when d = 0.
    answer: 0

  - slug: alg1-u05-exam-q26
    type: multiple_choice
    topic_code: "5.20"
    source: "IM Algebra 1, Unit 5, Lesson 20"
    points: 1
    stimulus: |
      A city's population, in thousands, at four censuses taken every ten years: 1980: 125; 1990: 150; 2000: 180; 2010: 216.
    prompt: |
      Using the model P(d) = 125 · 1.2ᵈ, what is the growth factor per year?
    options:
      - "1.2^(1/10) ≈ 1.018, about 1.8% per year"
      - "1.2/10 = 0.12, about 12% per year"
      - "1.02, because 20% spread over 10 years is 2% per year"
      - "1.2, the same as per decade"
    option_explanations:
      - |
        Correct. Ten yearly factors multiply to 1.2, so each is the tenth root of 1.2.
      - |
        Dividing a factor by 10 gives a meaningless number; factors combine by multiplication.
