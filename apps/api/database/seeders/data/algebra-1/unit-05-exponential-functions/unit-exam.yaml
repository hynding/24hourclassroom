  - slug: alg1-u05-exam-q45
    type: long_answer
    topic_code: "5.19"
    source: "IM Algebra 1, Unit 5, Lesson 19"
    points: 6
    prompt: |
      Two scholarship funds are set up at the same time. Fund L receives $1,000 at the start and $150 added every year. Fund E receives $1,000 at the start and grows 8% a year, compounded annually, with no additions.

      (1) Write functions L(t) and E(t) for the amounts after t years, and state what kind of function each is.
      (2) Compute both amounts at t = 5, t = 10 and t = 15.
      (3) Find the average rate of change of each fund from t = 0 to t = 10 and from t = 10 to t = 15, and explain the pattern you see.
      (4) Decide between which two whole-number years E overtakes L, with evidence, and explain why E then stays ahead permanently.
    answer: |
      (1) L(t) = 1,000 + 150t (linear). E(t) = 1,000 · 1.08ᵗ (exponential).
      (2) t = 5: L = 1,750, E ≈ 1,469. t = 10: L = 2,500, E ≈ 2,159. t = 15: L = 3,250, E ≈ 3,172.
      (3) L: 150 per year on both intervals (a line's rate is constant). E: (2,159 − 1,000)/10 ≈ 116 per year, then (3,172 − 2,159)/5 ≈ 203 per year. E's rate grows because 8% of a larger balance is more dollars; it passes L's fixed 150 per year somewhere in the second interval.
      (4) t = 15: L = 3,250, E ≈ 3,172 (L ahead). t = 16: L = 3,400, E ≈ 3,426 (E ahead). So E overtakes L between years 15 and 16. After that E adds more than 150 every year (its yearly increase is 8% of a balance above 3,400, which exceeds 272), and that increase keeps growing, so the gap widens forever.
    explanation: |
      Six points.

      (1) 1 pt: both functions correctly classified.

      (2) 1 pt: all six values (accept rounding).

      (3) 2 pts: 1 for the four rates, 1 for the constant-versus-growing explanation.

      (4) 2 pts: 1 for locating the crossing between 15 and 16 with values, 1 for the argument that E's yearly increase exceeds 150 from then on and keeps growing.

      Common errors: E(t) = 1,000 · 0.08ᵗ or 1,000 + 80t; comparing single values rather than rates in (3); claiming L stays ahead because it leads at t = 10.
