      source: "IM Algebra 1, Unit 5, Lesson 18"
      points: 3
      prompt: |
        A population is modelled by P(t) = 8,000 · 1.21ᵗ, with t in years.

        (a) State the yearly growth rate as a percentage.
        (b) Rewrite the function with a half-year step, using the fact that 1.21 = 1.1², and state the growth rate per half-year.
        (c) Explain why the half-year rate is not simply half of the yearly rate.
      answer: |
        (a) 21% per year.
        (b) P(t) = 8,000 · 1.1^(2t); 10% per half-year.
        (c) Two half-year increases of 10% compound: 1.1 · 1.1 = 1.21, which is 21%, more than 2 × 10% = 20%, because the second increase applies to the already-increased amount.
      explanation: |
        Three points, one per part.

        (a) 1 pt: 21%.

        (b) 1 pt: 8,000 · 1.1^(2t) and 10% per half-year.

        (c) 1 pt: the compounding explanation (1.1² = 1.21, not 1.2).

