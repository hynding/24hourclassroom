    - slug: alg1-u05-w22-q25
      type: long_answer
      topic_code: "5.17"
      source: "IM Algebra 1, Unit 5, Lesson 17"
      points: 6
      prompt: |
        Han has $3,000 to put away for 5 years. Bank A offers 4% a year compounded annually. Bank B offers 4% a year compounded quarterly. Bank C offers simple interest of 4.2% a year.

        (1) Write a function for the balance after t years at each bank.
        (2) Compute the balance after 5 years at each bank, to the nearest cent.
        (3) Which bank gives the most after 5 years? Explain why B beats A, and why C, with its higher rate, can still lose to the compounding banks over a long enough time.
        (4) Bank B's function can be written with a yearly base. Find that base to four decimal places and state Bank B's effective annual rate.
      answer: |
        (1) A(t) = 3,000 · 1.04ᵗ. B(t) = 3,000 · 1.01^(4t). C(t) = 3,000 + 126t.
        (2) A(5) = 3,000 · 1.04⁵ ≈ 3,649.96. B(5) = 3,000 · 1.01²⁰ ≈ 3,660.57. C(5) = 3,000 + 630 = 3,630.00.
        (3) Bank B gives the most. B beats A because the interest is added four times a year and starts earning interest sooner. C adds the same $126 every year (linear), while A and B add more each year (exponential); at 5 years A and B are already ahead, and the gap only widens, since any exponential growth eventually outpaces linear growth.
        (4) 1.01⁴ ≈ 1.0406, so B(t) ≈ 3,000 · 1.0406ᵗ: an effective annual rate of about 4.06%.
      explanation: |
        Six points.

        (1) 1 pt: all three functions, with B's exponent 4t and C linear.

        (2) 2 pts: 1 for A and B, 1 for C.

        (3) 2 pts: 1 for choosing B with the compounding-frequency reason, 1 for the linear-versus-exponential argument about C.

        (4) 1 pt: 1.0406 and about 4.06%.

        Common errors: B(t) = 3,000 · 1.04^(4t); treating C as compound; reporting 1.01⁴ as 1.04.
