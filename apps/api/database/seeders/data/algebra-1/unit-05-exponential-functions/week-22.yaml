week: 22
unit: 5
title: "Percent Change and Compound Interest"
topics: ["5.14", "5.15", "5.16", "5.17", "5.18"]
guide: guides/week-22.md
guide_description: |
  Percent increase and decrease as a single multiplication and how to reverse them, functions for repeated
  percent change, compound versus simple interest, converting an annual rate to monthly, quarterly or daily
  compounding, and rewriting one exponential function in equivalent forms that show different rates.
flashcards_description: |
  28 cards on multipliers for percent change, undoing a discount, chained percent changes, repeated percent
  change functions, simple versus compound interest, per-period rates and exponents for different compounding
  intervals, effective annual rate, and equivalent forms of an exponential expression.

flashcards:
  - front: Increase a quantity by 15% in one step
    back: |
      Multiply by 1.15. 80 · 1.15 = 92. No need to compute 15% separately and add it.
    topic_code: "5.14"
  - front: Decrease a quantity by 15% in one step
    back: |
      Multiply by 0.85, the fraction that remains. 80 · 0.85 = 68.
    topic_code: "5.14"
  - front: Undoing a 30% discount
    back: |
      Divide by 0.7. A coat at $63 after 30% off cost 63/0.7 = $90. Adding 30% back (63 · 1.3 = 81.9) is wrong.
    topic_code: "5.14"
  - front: A 10% rise followed by a 10% fall → overall change
    back: |
      Factor 1.1 · 0.9 = 0.99, a 1% decrease overall, not a return to the start.
    topic_code: "5.14"
  - front: Price $54 after a 20% increase → original price
    back: |
      54/1.2 = 45 dollars.
    topic_code: "5.14"
  - front: A 25% increase then a 20% decrease → single factor
    back: |
      1.25 · 0.8 = 1: the quantity returns exactly to its starting value.
    topic_code: "5.14"
  - front: Function for repeated percent increase
    back: |
      f(x) = a · (1 + r)ˣ, with r the rate as a decimal. A city of 300,000 growing 2% a year: C(t) = 300,000 · 1.02ᵗ.
    topic_code: "5.15"
  - front: Function for repeated percent decrease
    back: |
      f(x) = a · (1 − r)ˣ. A phone worth $900 losing 25% a year: V(t) = 900 · 0.75ᵗ.
    topic_code: "5.15"
  - front: Adding 5 members a year versus growing 12.5% a year, from 40
    back: |
      Linear: 40 + 5t. Exponential: 40 · 1.125ᵗ. Both add 5 in year 1; the exponential club adds more each later year.
    topic_code: "5.15"
  - front: Website visits 15,000 growing 6% a month → visits after 8 months
    back: |
      15,000 · 1.06⁸ ≈ 23,908.
    topic_code: "5.15"
  - front: Fish population 5,000 dropping 8% a year → when below 3,000
    back: |
      5,000 · 0.92ᵗ: about 3,032 at t = 6 and 2,789 at t = 7, so in the seventh year.
    topic_code: "5.15"
  - front: Rent $1,400 rising 3% a year → rent after 5 years
    back: |
      R(t) = 1,400 · 1.03ᵗ; R(5) ≈ $1,623.
    topic_code: "5.15"
  - front: Compound interest → definition and formula
    back: |
      Interest is added to the balance and then itself earns interest. After n periods at rate r per period: P · (1 + r)ⁿ.
    topic_code: "5.16"
  - front: Simple interest → definition and formula
    back: |
      The same interest, a fixed percentage of the original amount, is added each period: P + P · r · n, which is linear.
    topic_code: "5.16"
  - front: $1,000 at 5% a year, compounded annually → after 1, 2 and 10 years
    back: |
      1,050; 1,102.50; about 1,628.89. Year 2 earns $52.50, more than year 1's $50, because interest earns interest.
    topic_code: "5.16"
  - front: Simple versus compound on $1,000 at 5% after 30 years
    back: |
      Simple: 1,000 + 50 · 30 = 2,500. Compound: 1,000 · 1.05³⁰ ≈ 4,322.
    topic_code: "5.16"
  - front: Loan of $800 at 2% a month compounded, nothing paid → owed after a year
    back: |
      800 · 1.02¹² ≈ $1,014.59.
    topic_code: "5.16"
  - front: $600 at 4% compounded annually for 3 years → balance and interest
    back: |
      600 · 1.04³ ≈ 674.92; interest earned about $74.92.
    topic_code: "5.16"
  - front: 6% a year compounded monthly → rate per month and periods in t years
    back: |
      0.06/12 = 0.005, so 0.5% a month; 12t periods. A(t) = P · 1.005^(12t).
    topic_code: "5.17"
  - front: $1,000 at 6% for one year → annual, quarterly, monthly, daily compounding
    back: |
      1,060.00; 1,061.36; 1,061.68; 1,061.83. More frequent compounding earns slightly more, with quickly shrinking gains.
    topic_code: "5.17"
  - front: Effective annual rate
    back: |
      The actual percentage growth over a year once compounding is included. 6% compounded monthly gives 1.005¹² ≈ 1.0617, about 6.17%.
    topic_code: "5.17"
  - front: $3,000 at 4% a year compounded quarterly for 5 years
    back: |
      Rate 1% per quarter, 20 quarters: 3,000 · 1.01²⁰ ≈ $3,660.57.
    topic_code: "5.17"
  - front: $500 at 8% a year compounded monthly for 2 years
    back: |
      500 · (1 + 0.08/12)²⁴ ≈ $586.44.
    topic_code: "5.17"
  - front: Common error with compounding intervals
    back: |
      Using the annual rate as the monthly rate, or forgetting to multiply years by periods per year in the exponent.
    topic_code: "5.17"
  - front: 1,000 · 1.005^(12t) written with a yearly base
    back: |
      1.005¹² ≈ 1.0617, so A(t) ≈ 1,000 · 1.0617ᵗ: the same values, now showing the effective yearly rate of about 6.17%.
    topic_code: "5.18"
  - front: 8,000 · 1.21ᵗ (t in years) written per half-year
    back: |
      1.21 = 1.1², so 8,000 · 1.1^(2t): 10% growth every half-year, which is 21% per year.
    topic_code: "5.18"
  - front: 500 · 0.64ᵗ written per half-year
    back: |
      0.64 = 0.8², so 500 · 0.8^(2t): a 20% loss each half-year equals a 36% loss each year.
    topic_code: "5.18"
  - front: 300 · 9ᵗ with base 3
    back: |
      300 · 3^(2t): the quantity triples every half unit of t.
    topic_code: "5.18"

quiz:
  description: |
    25 questions · about 45 minutes · percent change, functions with percent change, compound interest,
    compounding intervals, and equivalent forms of exponential expressions (lessons 5.14 to 5.18), with review
    of interpreting parameters, rates of change and graphs from earlier weeks of unit 5, and inverses,
    intercepts and equation writing from units 2 and 4. Multiple choice, select-all, true/false and numeric
    items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the
    long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a savings account (5.16–5.18)
    - slug: alg1-u05-w22-q01
      type: multiple_choice
      topic_code: "5.17"
      source: "IM Algebra 1, Unit 5, Lesson 17"
      points: 1
      stimulus: |
        Priya deposits $2,000 in an account that pays 6% interest per year, compounded monthly. She makes no other deposits or withdrawals.
      prompt: |
        What interest rate is applied each month?
      options:
        - "0.6%"
        - "72%"
        - "0.5%"
        - "6%"
      option_explanations:
        - |
          0.6% would be 6% divided by 10, but there are 12 months in a year.
        - |
          72% is 6% × 12, the annual rate wrongly multiplied instead of divided.
        - |
          Correct. The annual rate is spread over 12 months: 6%/12 = 0.5% per month.
        - |
          6% is the annual rate; applying it every month would give 72% a year before compounding.
      answer: 2

    - slug: alg1-u05-w22-q02
      type: multiple_choice
      topic_code: "5.17"
      source: "IM Algebra 1, Unit 5, Lesson 17"
      points: 1
      stimulus: |
        Priya deposits $2,000 in an account that pays 6% interest per year, compounded monthly. She makes no other deposits or withdrawals.
      prompt: |
        Which function gives the balance A(t) after t years?
      options:
        - "A(t) = 2,000 + 120t"
        - "A(t) = 2,000 · 1.005^(12t)"
        - "A(t) = 2,000 · 1.06^(12t)"
        - "A(t) = 2,000 · 1.005ᵗ"
      option_explanations:
        - |
          This is simple interest, adding the same $120 every year without compounding.
        - |
          Correct. Each month multiplies by 1.005, and t years contain 12t months.
        - |
          1.06 is the yearly factor for annual compounding; applying it 12t times would be 6% every month.
        - |
          This applies the monthly factor only once per year instead of twelve times.
      answer: 1

    - slug: alg1-u05-w22-q03
      type: multiple_choice
      topic_code: "5.16"
      source: "IM Algebra 1, Unit 5, Lesson 16"
      points: 1
      stimulus: |
        Priya deposits $2,000 in an account that pays 6% interest per year, compounded monthly. She makes no other deposits or withdrawals.
      prompt: |
        After one year the balance is about $2,123.36. How does this compare with simple interest of 6% a year, and why?
      options:
        - "It is slightly more than the $2,120 from simple interest, because each month's interest earns interest in later months."
        - "It is the same as simple interest, because the annual rate is 6% either way."
        - "It is exactly twice the simple-interest amount."
        - "It is less than simple interest, because the monthly rate is only 0.5%."
      option_explanations:
        - |
          Correct. 2,000 · 1.005¹² ≈ 2,123.36, while simple interest gives 2,000 + 120 = 2,120; the extra $3.36 is interest on interest.
        - |
          Compounding monthly produces an effective annual rate of about 6.17%, slightly above 6%.
        - |
          The difference is a few dollars, not a doubling.
        - |
          The 0.5% is applied twelve times and compounds, so it earns a little more than a single 6%.
      answer: 0

    - slug: alg1-u05-w22-q04
      type: multiple_choice
      topic_code: "5.18"
      source: "IM Algebra 1, Unit 5, Lesson 18"
      points: 1
      stimulus: |
        Priya deposits $2,000 in an account that pays 6% interest per year, compounded monthly. She makes no other deposits or withdrawals.
      prompt: |
        Which expression is equivalent to the balance function and shows the effective yearly growth factor?
      options:
        - "2,000 · 1.06ᵗ"
        - "2,000 · 1.005^(t/12)"
        - "2,000 · 12 · 1.005ᵗ"
        - "2,000 · (1.005¹²)ᵗ ≈ 2,000 · 1.0617ᵗ"
      option_explanations:
        - |
          1.06 is the factor for annual compounding; monthly compounding gives a slightly larger yearly factor.
        - |
          Dividing the exponent by 12 would apply the monthly factor a twelfth of a time per year.
        - |
          Multiplying the starting amount by 12 has no meaning here.
        - |
          Correct. 1.005^(12t) = (1.005¹²)ᵗ, and 1.005¹² ≈ 1.0617, an effective rate of about 6.17% a year.
      answer: 3

    # ---- Multiple choice (5.14–5.17)
    - slug: alg1-u05-w22-q05
      type: multiple_choice
      topic_code: "5.14"
      source: "IM Algebra 1, Unit 5, Lesson 14"
      points: 1
      prompt: |
        A coat costs $63 after a 30% discount. What was the original price?
      options:
        - "$90"
        - "$81.90"
        - "$44.10"
        - "$93"
      option_explanations:
        - |
          Correct. The sale price is 70% of the original, so the original is 63/0.7 = 90; check: 90 · 0.7 = 63.
        - |
          $81.90 adds 30% of the sale price, but the 30% was taken off the original price, which was larger.
        - |
          $44.10 applies the discount a second time instead of undoing it.
        - |
          $93 adds $30 to the sale price, treating the percentage as a dollar amount.
      answer: 0

    - slug: alg1-u05-w22-q06
      type: multiple_choice
      topic_code: "5.14"
      source: "IM Algebra 1, Unit 5, Lesson 14"
      points: 1
      prompt: |
        A share price rises 10% one week and falls 10% the next. What is the overall change?
      options:
        - "A 20% decrease"
        - "A 1% decrease"
        - "A 1% increase"
        - "No change"
      option_explanations:
        - |
          The changes partly offset; the net effect is far smaller than 20%.
        - |
          Correct. The factors multiply: 1.1 · 0.9 = 0.99, which is 1% below the start.
        - |
          The combined factor is 0.99, below 1, so the price ends lower.
        - |
          The 10% fall is taken from a larger amount than the 10% rise was added to, so they do not cancel.
      answer: 1

    - slug: alg1-u05-w22-q07
      type: multiple_choice
      topic_code: "5.15"
      source: "IM Algebra 1, Unit 5, Lesson 15"
      points: 1
      prompt: |
        A city of 300,000 people grows 2% each year. Which function gives the population after t years?
      options:
        - "C(t) = 300,000 + 6,000t"
        - "C(t) = 300,000 · 0.02ᵗ"
        - "C(t) = 300,000 · 1.02ᵗ"
        - "C(t) = 300,000 · 2ᵗ"
      option_explanations:
        - |
          This adds the first year's growth of 6,000 every year, which is linear, not percent growth.
        - |
          0.02 is the rate, not the factor; multiplying by 0.02 would shrink the city to 2% of its size.
        - |
          Correct. Growing 2% means multiplying by 1.02 each year.
        - |
          A factor of 2 doubles the population each year, a 100% increase.
      answer: 2

    - slug: alg1-u05-w22-q08
      type: multiple_choice
      topic_code: "5.15"
      source: "IM Algebra 1, Unit 5, Lesson 15"
      points: 1
      prompt: |
        A lake's fish population falls 8% a year from 5,000. In which year does it first drop below 3,000?
      options:
        - "The fourth year"
        - "The fifth year"
        - "The sixth year"
        - "The seventh year"
      option_explanations:
        - |
          After four years about 3,582 fish remain; a linear loss of 400 a year would give this answer, but the loss is 8% of a shrinking population.
        - |
          After five years about 3,295 fish remain.
        - |
          After six years about 3,032 fish remain, just above 3,000.
        - |
          Correct. 5,000 · 0.92⁶ ≈ 3,032 is still above 3,000, and 5,000 · 0.92⁷ ≈ 2,789 is below it.
      answer: 3

    - slug: alg1-u05-w22-q09
      type: multiple_choice
      topic_code: "5.16"
      source: "IM Algebra 1, Unit 5, Lesson 16"
      points: 1
      prompt: |
        $1,000 is deposited at 5% a year, compounded annually. The interest earned in the first year is $50. What is the interest earned in the second year?
      options:
        - "$55"
        - "$52.50"
        - "$50"
        - "$102.50"
      option_explanations:
        - |
          $55 would be 5% of 1,100, but the balance after one year is 1,050.
        - |
          Correct. The second year's interest is 5% of the new balance 1,050, which is $52.50.
        - |
          $50 every year would be simple interest; with compounding the balance, and so the interest, grows.
        - |
          $102.50 is the total interest over two years, not the second year's interest alone.
      answer: 1

    - slug: alg1-u05-w22-q10
      type: multiple_choice
      topic_code: "5.17"
      source: "IM Algebra 1, Unit 5, Lesson 17"
      points: 1
      prompt: |
        $1,000 is invested for one year at a nominal 6% annual rate. Which compounding schedule gives the largest balance after the year, and roughly how large is the advantage over annual compounding?
      options:
        - "Daily compounding, by less than $2"
        - "Monthly compounding, by about $60"
        - "Daily compounding, by about $300"
        - "Annual compounding, by about $60"
      option_explanations:
        - |
          Correct. Daily gives about 1,061.83 against 1,060.00 for annual; more frequent compounding helps, but only slightly.
        - |
          Monthly compounding gives about 1,061.68, only $1.68 more than annual, and daily is slightly higher still.
        - |
          The gains from more frequent compounding are a dollar or two, not hundreds.
        - |
          Annual compounding gives the smallest balance of the four schedules.
      answer: 0

    - slug: alg1-u05-w22-q11
      type: multiple_choice
      topic_code: "5.9"
      source: "IM Algebra 1, Unit 5, Lesson 9"
      points: 1
      prompt: |
        A car's value is modelled by V(t) = 18,000 · 0.82ᵗ, with t in years. What does the 0.82 mean?
      options:
        - "The car is worth $0.82 after t years."
        - "The car's value falls by $820 each year."
        - "The car keeps 82% of its value each year, losing 18%."
        - "The car loses 82% of its value each year."
      option_explanations:
        - |
          0.82 is a multiplier, not a dollar amount.
        - |
          A percentage loss is a multiplication; the dollar amount lost shrinks each year.
        - |
          Correct. Multiplying by 0.82 leaves 82% of the previous value; the loss is 18% per year.
        - |
          The factor is what remains, not what is lost.
      answer: 2

    - slug: alg1-u05-w22-q12
      type: multiple_choice
      topic_code: "4.16"
      source: "IM Algebra 1, Unit 4, Lesson 16"
      points: 1
      prompt: |
        S(p) = 0.7p gives the sale price of an item whose original price is p, after a 30% discount. Which is the inverse, and what does it do?
      options:
        - "p = 1/(0.7S); it reverses the discount."
        - "p = 0.7S; it gives the sale price from the original."
        - "p = S + 0.3S; it gives the original price from the sale price."
        - "p = S/0.7; it gives the original price from the sale price."
      option_explanations:
        - |
          An inverse function is not a reciprocal.
        - |
          This is the original function again, not its inverse.
        - |
          Adding 30% of the sale price does not restore the original; 63 + 18.9 = 81.9, not 90.
        - |
          Correct. Solving S = 0.7p for p gives p = S/0.7, which undoes the discount.
      answer: 3

    - slug: alg1-u05-w22-q13
      type: multiple_choice
      topic_code: "2.2"
      source: "IM Algebra 1, Unit 2, Lesson 2"
      points: 1
      prompt: |
        A gym charges a $40 joining fee plus $25 a month. Which equation gives the total paid T after m months?
      options:
        - "T = 40m + 25"
        - "T = 25m + 40"
        - "T = 65m"
        - "T = 40 · 1.25ᵐ"
      option_explanations:
        - |
          This charges $40 every month and $25 once.
        - |
          Correct. The fee is paid once and the monthly charge is multiplied by the number of months.
        - |
          Adding the numbers and multiplying by m charges the joining fee every month.
        - |
          The payments add a fixed amount each month; nothing grows by a percentage.
      answer: 1

    # ---- Select-all (5.14, 5.10)
    - slug: alg1-u05-w22-q14
      type: multi_select
      topic_code: "5.14"
      source: "IM Algebra 1, Unit 5, Lesson 14"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about percent change are correct? Select all that apply.
      options:
        - "A 50% increase followed by a 50% decrease returns to the original value."
        - "Decreasing by 45% is the same as multiplying by 0.45."
        - "Decreasing by 45% is the same as multiplying by 0.55."
        - "Undoing a 20% increase means dividing by 1.2."
        - "Increasing by 45% is the same as multiplying by 1.45."
      option_explanations:
        - |
          1.5 · 0.5 = 0.75, a 25% decrease overall.
        - |
          Multiplying by 0.45 keeps 45%, which is a 55% decrease.
        - |
          Correct. After losing 45%, the remaining 55% is what the multiplier 0.55 keeps.
        - |
          Correct. The increase multiplied by 1.2, so dividing by 1.2 reverses it.
        - |
          Correct. 100% + 45% = 145% of the original.
      answer: [2, 3, 4]

    - slug: alg1-u05-w22-q15
      type: multi_select
      topic_code: "5.10"
      source: "IM Algebra 1, Unit 5, Lesson 10"
      points: 2
      partial_credit: true
      prompt: |
        A balance grows as B(n) = 1,000 · 1.05ⁿ, with n in years. Which statements are true? Select all that apply.
      options:
        - "The balance increases by $50 in every year."
        - "The average rate of change from n = 0 to n = 2 is $51.25 per year."
        - "The balance increases by $50 in the first year."
        - "The average rate of change is the same over every two-year interval."
        - "The increase in the second year is larger than in the first."
      option_explanations:
        - |
          Only simple interest adds the same amount each year; compound growth adds more each year.
        - |
          Correct. (1,102.50 − 1,000)/2 = 51.25 dollars per year.
        - |
          Correct. The first year's growth is 1,000 · 0.05 = 50, taking the balance to 1,050.
        - |
          Later intervals have larger average rates, because the balance being multiplied is larger.
        - |
          Correct. The second year adds 1,102.50 − 1,050 = 52.50.
      answer: [1, 2, 4]

    # ---- True/false (5.16, 5.6)
    - slug: alg1-u05-w22-q16
      type: true_false
      topic_code: "5.16"
      source: "IM Algebra 1, Unit 5, Lesson 16"
      points: 1
      prompt: |
        True or false: an account earning simple interest grows linearly, while one earning compound interest grows exponentially.
      answer: true
      explanation: |
        True. Simple interest adds a fixed amount each period (constant difference); compound interest multiplies the balance by a fixed factor each period (constant ratio).

    - slug: alg1-u05-w22-q17
      type: true_false
      topic_code: "5.6"
      source: "IM Algebra 1, Unit 5, Lesson 6"
      points: 1
      prompt: |
        True or false: the graph of an exponential decay function eventually touches the horizontal axis.
      answer: false
      explanation: |
        False. The outputs a · bˣ are always positive, so the graph approaches the axis, which is a horizontal asymptote, but never reaches it.

    # ---- Fill in the blank (5.16, 4.6)
    - slug: alg1-u05-w22-q18
      type: fill_blank
      topic_code: "5.16"
      source: "IM Algebra 1, Unit 5, Lesson 16"
      points: 1
      prompt: |
        Interest that is added to the balance and then itself earns interest in later periods is called ____ interest.
      answer: ["compound", "compounded", "compounding"]
      explanation: |
        Compound interest produces exponential growth, P(1 + r)ⁿ, in contrast with simple interest, which adds the same amount every period.

    - slug: alg1-u05-w22-q19
      type: fill_blank
      topic_code: "4.6"
      source: "IM Algebra 1, Unit 4, Lesson 6"
      points: 1
      prompt: |
        For the function A(t) = 2,000 · 1.005^(12t), the value A(0) = 2,000 is the ____ intercept of the graph.
      answer: ["vertical", "y", "y-"]
      explanation: |
        The vertical intercept is the output at input 0, here the initial deposit.

    # ---- Numeric (5.14, 5.7, 5.17)
    - slug: alg1-u05-w22-q20
      type: numeric
      topic_code: "5.14"
      source: "IM Algebra 1, Unit 5, Lesson 14"
      points: 1
      prompt: |
        After a 20% increase, an item costs $54. What was its price before the increase, in dollars?
      answer: { value: 45, tolerance: 0 }
      explanation: |
        54/1.2 = 45; check: 45 · 1.2 = 54.

    - slug: alg1-u05-w22-q21
      type: numeric
      topic_code: "5.7"
      source: "IM Algebra 1, Unit 5, Lesson 7"
      points: 1
      prompt: |
        A balance is modelled by B(n) = 1,000 · 1.05ⁿ, with n in years from 2020. To the nearest cent, what does the model give for 2018, that is B(−2)?
      answer: { value: 907.03, tolerance: 0.01 }
      explanation: |
        1.05⁻² = 1/1.1025, so 1,000/1.1025 ≈ 907.03 dollars.

    - slug: alg1-u05-w22-q22
      type: numeric
      topic_code: "5.17"
      source: "IM Algebra 1, Unit 5, Lesson 17"
      points: 1
      prompt: |
        $500 is invested at 8% a year compounded monthly for 2 years. To the nearest cent, what is the balance?
      answer: { value: 586.44, tolerance: 0.05 }
      explanation: |
        Monthly rate 0.08/12, 24 months: 500 · (1 + 0.08/12)²⁴ ≈ 586.44.

    # ---- Short answer (5.15, 5.18)
    - slug: alg1-u05-w22-q23
      type: short_answer
      topic_code: "5.15"
      source: "IM Algebra 1, Unit 5, Lesson 15"
      points: 3
      prompt: |
        A club has 40 members. Plan 1 recruits 5 new members every year. Plan 2 grows the membership by 12.5% every year.

        (a) Write a function for each plan.
        (b) Compare the membership after 1 year and after 10 years under each plan.
        (c) Explain why both plans add the same number of members in the first year but not afterwards.
      answer: |
        (a) Plan 1: M₁(t) = 40 + 5t. Plan 2: M₂(t) = 40 · 1.125ᵗ.
        (b) Year 1: 45 and 45. Year 10: 90 and 40 · 1.125¹⁰ ≈ 130.
        (c) 12.5% of 40 is 5, so the first year's increases match. Afterwards plan 2 takes 12.5% of a larger number each year, so its increases grow, while plan 1 keeps adding exactly 5.
      explanation: |
        Three points, one per part.

        (a) 1 pt: both functions.

        (b) 1 pt: 45 and 45; 90 and about 130.

        (c) 1 pt: 12.5% of 40 is 5, and later percentages are of larger amounts.

    - slug: alg1-u05-w22-q24
      type: short_answer
