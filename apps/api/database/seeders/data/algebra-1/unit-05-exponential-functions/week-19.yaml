week: 19
unit: 5
title: "Exponential Growth and Decay"
topics: ["5.1", "5.2", "5.3", "5.4"]
guide: guides/week-19.md
guide_description: |
  Why repeated multiplication overtakes repeated addition, recognising exponential growth in a table through a
  constant ratio, writing a · bˣ from a starting value and a growth factor and graphing it, and describing
  exponential decay with a factor between 0 and 1.
flashcards_description: |
  28 cards on linear versus exponential growth, growth and decay factors from percentages and fractions,
  reading a and b from tables and equations, order of operations in a · bˣ, the shapes of growth and decay
  graphs, and why decay never reaches zero.

flashcards:
  - front: Linear growth versus exponential growth
    back: |
      Linear adds the same amount each step (y = a + mx); exponential multiplies by the same factor each step (y = a · bˣ).
    topic_code: "5.1"
  - front: $100 a day versus 1 cent doubled daily, for 30 days
    back: |
      The daily $100 totals $3,000. The doubling cent is $5.12 on day 10, about $5,243 on day 20 and about $5.37 million on day 30. Doubling starts tiny and ends enormous.
    topic_code: "5.1"
  - front: Why doubling eventually beats any constant addition
    back: |
      Adding puts on the same amount regardless of size, but doubling adds an amount equal to the current size, which keeps growing. Once the quantity is large, one doubling exceeds many additions.
    topic_code: "5.1"
  - front: Plan A $500 plus $50 a month; plan B $500 growing 5% a month → who leads when
    back: |
      A leads early (month 12: 1,100 versus about 898); B overtakes later (month 36: about 2,896 versus 2,300).
    topic_code: "5.1"
  - front: Lily pads doubling weekly from 10 → count after 5 weeks
    back: |
      10 · 2⁵ = 320. They pass 1,000 in week 7, when there are 1,280.
    topic_code: "5.1"
  - front: Testing a table for linear growth
    back: |
      Subtract consecutive outputs (for equally spaced inputs). A constant difference means linear; the difference is the rate.
    topic_code: "5.2"
  - front: Testing a table for exponential growth
    back: |
      Divide each output by the previous one. A constant ratio means exponential; the ratio is the growth factor.
    topic_code: "5.2"
  - front: Outputs 3, 6, 12, 24, 48 → type and factor
    back: |
      Ratios are all 2, so exponential with growth factor 2. The differences 3, 6, 12, 24 are not constant, so it is not linear.
    topic_code: "5.2"
  - front: Outputs 8, 12, 18, 27 → type and factor
    back: |
      Ratios 1.5 each time: exponential with factor 3/2. Factors need not be whole numbers.
    topic_code: "5.2"
  - front: Growth factor for "grows by 10% each year"
    back: |
      1.1, because 100% + 10% = 110% of the previous value remains. 1,000 → 1,100 → 1,210 → 1,331.
    topic_code: "5.2"
  - front: Growth factor for "triples" and for "grows by a quarter"
    back: |
      Triples: 3. Grows by a quarter: 1.25. The factor is always 1 plus the fractional increase.
    topic_code: "5.2"
  - front: Growth factor → definition
    back: |
      The fixed number each output is multiplied by to get the next, for inputs one step apart. It equals the ratio of any two consecutive outputs.
    topic_code: "5.2"
  - front: Equation for exponential growth
    back: |
      f(x) = a · bˣ, where a is the starting value (the output at x = 0, since b⁰ = 1) and b > 1 is the growth factor.
    topic_code: "5.3"
  - front: Reading a and b from g(x) = 50 · 1.08ˣ
    back: |
      Starts at 50 and grows 8% per step (factor 1.08).
    topic_code: "5.3"
  - front: Starting value when the table begins at x = 1
    back: |
      Divide backwards. If f(1) = 12 and f(2) = 36, the factor is 3 and f(0) = 12/3 = 4, so f(x) = 4 · 3ˣ.
    topic_code: "5.3"
  - front: Order of operations in 3 · 2ˣ
    back: |
      The power comes first: 3 · 2³ = 3 · 8 = 24, not (3 · 2)³ = 216.
    topic_code: "5.3"
  - front: Graph of a · bˣ with b > 1
    back: |
      Starts at (0, a), rises slowly then steeply, and stays above the x-axis on the left, getting ever closer to it. Larger b: steeper; larger a: higher.
    topic_code: "5.3"
  - front: Bacteria 400 doubling hourly → equation and count after 6 hours
    back: |
      B(h) = 400 · 2ʰ; B(6) = 400 · 64 = 25,600.
    topic_code: "5.3"
  - front: Table f(0) = 7, f(1) = 28, f(2) = 112 → equation and f(4)
    back: |
      Factor 4, start 7: f(x) = 7 · 4ˣ; f(4) = 7 · 256 = 1,792.
    topic_code: "5.3"
  - front: Checking an exponential equation against a table
    back: |
      Substitute each x and confirm the output. For 3 · 2ˣ at x = 3: 3 · 8 = 24, matching the table.
    topic_code: "5.3"
  - front: Exponential decay → definition
    back: |
      Repeated multiplication by a factor between 0 and 1, so the quantity loses the same fraction each step. f(x) = a · bˣ with 0 < b < 1.
    topic_code: "5.4"
  - front: Decay factor for "loses 20% each step"
    back: |
      0.8, because 80% remains. The factor is 1 minus the fraction lost, never the fraction itself.
    topic_code: "5.4"
  - front: Decay factor for "loses half" and "loses a third"
    back: |
      Loses half: 1/2. Loses a third: 2/3 (two thirds remain).
    topic_code: "5.4"
  - front: Medicine 200 mg reduced by a quarter each hour → equation and M(2)
    back: |
      M(h) = 200 · (3/4)ʰ; M(2) = 200 · 9/16 = 112.5 mg.
    topic_code: "5.4"
  - front: Why exponential decay never reaches 0
    back: |
      Each step removes a fraction of what is left, so some positive amount always remains; the graph approaches the x-axis without touching it.
    topic_code: "5.4"
  - front: Graph of a · bˣ with 0 < b < 1
    back: |
      Starts at (0, a), falls steeply at first, then flattens toward the x-axis. The drops get smaller because each is a fraction of a smaller amount.
    topic_code: "5.4"
  - front: Car worth $24,000 losing 15% a year → equation and value after 3 years
    back: |
      V(t) = 24,000 · 0.85ᵗ; V(3) ≈ $14,739.
    topic_code: "5.4"
  - front: Ball bouncing to 60% of its previous height, dropped from 250 cm → third bounce
    back: |
      250 · 0.6³ = 54 cm.
    topic_code: "5.4"

quiz:
  description: |
    25 questions · about 45 minutes · linear versus exponential growth, growth factors, writing and using
    a · bˣ, and exponential decay (lessons 5.1 to 5.4), with review of average rate of change, domain, features
    of graphs, inverses and absolute value from unit 4 and systems from unit 2. Multiple choice, select-all,
    true/false and numeric items are graded at once; fill-in-the-blank items are matched automatically; the
    short answers and the long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: algae in a tank (5.1–5.3)
    - slug: alg1-u05-w19-q01
      type: multiple_choice
      topic_code: "5.2"
      source: "IM Algebra 1, Unit 5, Lesson 2"
      points: 1
      stimulus: |
        The mass of algae in a tank is measured each day.

        | Day | 0 | 1 | 2 | 3 |
        |---|---|---|---|---|
        | Mass (grams) | 5 | 15 | 45 | 135 |
      prompt: |
        Which statement describes the pattern?
      options:
        - "Linear: the mass increases by 10 grams each day."
        - "Linear: the mass increases by 130 grams over 3 days."
        - "Exponential: the mass is multiplied by 10 each day."
        - "Exponential: the mass is multiplied by 3 each day."
      option_explanations:
        - |
          The increases are 10, 30 and 90, not a constant 10, so the growth is not linear.
        - |
          The total change is 130, but the daily increases are different, so the pattern is not linear.
        - |
          Multiplying by 10 would give 50 on day 1, not 15.
        - |
          Correct. 15/5 = 45/15 = 135/45 = 3: a constant ratio, so the growth factor is 3.
      answer: 3

    - slug: alg1-u05-w19-q02
      type: multiple_choice
      topic_code: "5.3"
      source: "IM Algebra 1, Unit 5, Lesson 3"
      points: 1
      stimulus: |
        The mass of algae in a tank is measured each day.

        | Day | 0 | 1 | 2 | 3 |
        |---|---|---|---|---|
        | Mass (grams) | 5 | 15 | 45 | 135 |
      prompt: |
        Which equation gives the mass M(d) on day d?
      options:
        - "M(d) = 5 · 3ᵈ"
        - "M(d) = 15ᵈ"
        - "M(d) = 3 · 5ᵈ"
        - "M(d) = 5 + 3d"
      option_explanations:
        - |
          Correct. The starting value 5 multiplies the growth factor 3 raised to the number of days: 5 · 3³ = 135.
        - |
          (5 · 3)ᵈ = 15ᵈ gives 225 on day 2; the factor alone is raised to the power.
        - |
          This starts at 3 and multiplies by 5; at d = 1 it gives 15 but at d = 2 it gives 75, not 45.
        - |
          This is a linear rule adding 3 grams a day; it gives 8 on day 1, not 15.
      answer: 0

    - slug: alg1-u05-w19-q03
      type: multiple_choice
      topic_code: "5.3"
      source: "IM Algebra 1, Unit 5, Lesson 3"
      points: 1
      stimulus: |
        The mass of algae in a tank is measured each day.

        | Day | 0 | 1 | 2 | 3 |
        |---|---|---|---|---|
        | Mass (grams) | 5 | 15 | 45 | 135 |
      prompt: |
        If the pattern continues, what is the mass on day 5?
      options:
        - "675 grams"
        - "225 grams"
        - "1,215 grams"
        - "405 grams"
      option_explanations:
        - |
          675 is 135 × 5, multiplying by the day number instead of tripling twice more.
        - |
          225 would be 135 + 90, continuing the last difference rather than the ratio.
        - |
          Correct. 5 · 3⁵ = 5 · 243 = 1,215 grams.
        - |
          405 is the mass on day 4; one more tripling is needed for day 5.
      answer: 2

    - slug: alg1-u05-w19-q04
      type: multiple_choice
      topic_code: "5.1"
      source: "IM Algebra 1, Unit 5, Lesson 1"
      points: 1
      stimulus: |
        The mass of algae in a tank is measured each day.

        | Day | 0 | 1 | 2 | 3 |
        |---|---|---|---|---|
        | Mass (grams) | 5 | 15 | 45 | 135 |
      prompt: |
        A second tank starts with 5 grams and gains a steady 40 grams a day. Which comparison is correct?
      options:
        - "The second tank has more algae on every day."
        - "The second tank has more algae on day 2 but less on day 3."
        - "The tanks hold the same mass on day 3."
        - "The first tank has more algae on every day after day 0."
      option_explanations:
        - |
          By day 3 the first tank (135) has passed the second (125), and the gap only widens.
        - |
          Correct. Day 2: second tank 85 against 45; day 3: 125 against 135. The tripling tank overtakes the linear one.
        - |
          Day 3 masses are 135 and 125; they are close but not equal.
        - |
          On day 1 the second tank has 45 grams against 15, so it leads early.
      answer: 1

    # ---- Multiple choice (5.1–5.4)
    - slug: alg1-u05-w19-q05
      type: multiple_choice
      topic_code: "5.2"
      source: "IM Algebra 1, Unit 5, Lesson 2"
      points: 1
      prompt: |
        Which sequence of outputs, for inputs 0, 1, 2, 3, shows exponential growth?
      options:
        - "2, 6, 18, 54"
        - "2, 6, 10, 14"
        - "2, 4, 8, 14"
        - "6, 4, 2, 0"
      option_explanations:
        - |
          Correct. Each output is 3 times the previous one: a constant ratio of 3.
        - |
          The outputs rise by 4 each step, a constant difference: linear growth.
        - |
          The ratios are 2, 2 and 1.75; the pattern breaks at the last step, so it is neither linear nor exponential.
        - |
          The outputs fall by 2 each step: linear decrease, and an exponential pattern never reaches 0.
      answer: 0

    - slug: alg1-u05-w19-q06
      type: multiple_choice
      topic_code: "5.3"
      source: "IM Algebra 1, Unit 5, Lesson 3"
      points: 1
      prompt: |
        In the function g(x) = 50 · 1.08ˣ, what do 50 and 1.08 represent?
      options:
        - "50 is the value after one step and 1.08 is the rate of change."
        - "50 is the starting value and the quantity grows 108% per step."
        - "50 is the growth factor and 1.08 is the starting value."
        - "50 is the starting value and the quantity grows 8% per step."
      option_explanations:
        - |
          g(1) = 54, not 50; and 1.08 is a multiplier, not an amount added per step.
        - |
          A factor of 1.08 means the new value is 108% of the old one, which is an 8% increase, not 108%.
        - |
          The number multiplied by the power is the starting value; the base of the power is the factor.
        - |
          Correct. g(0) = 50, and multiplying by 1.08 each step is an 8% increase.
      answer: 3

    - slug: alg1-u05-w19-q07
      type: multiple_choice
      topic_code: "5.3"
      source: "IM Algebra 1, Unit 5, Lesson 3"
      points: 1
      prompt: |
        What is the value of 3 · 2⁴?
      options:
        - "24"
        - "48"
        - "1,296"
        - "11"
      option_explanations:
        - |
          24 is 3 · 2³, using an exponent of 3; the exponent here is 4, so 2⁴ = 16.
        - |
          Correct. The power comes first: 2⁴ = 16, then 3 · 16 = 48.
        - |
          1,296 is (3 · 2)⁴ = 6⁴, which multiplies before raising to the power.
        - |
          11 is 3 + 2 · 4, mixing up multiplication and powers.
      answer: 1

    - slug: alg1-u05-w19-q08
      type: multiple_choice
      topic_code: "5.4"
      source: "IM Algebra 1, Unit 5, Lesson 4"
      points: 1
      prompt: |
        A quantity loses 20% of its value each year. What is the decay factor?
      options:
        - "1.2"
        - "0.2"
        - "0.8"
        - "20"
      option_explanations:
        - |
          1.2 would be a 20% increase, not a decrease.
        - |
          0.2 is the fraction lost; the factor is the fraction that remains.
        - |
          Correct. After losing 20%, 80% remains, so each year's value is 0.8 times the previous one.
        - |
          20 is the percentage, not a multiplier; a factor of 20 would multiply the quantity by 20.
      answer: 2

    - slug: alg1-u05-w19-q09
      type: multiple_choice
      topic_code: "5.4"
      source: "IM Algebra 1, Unit 5, Lesson 4"
      points: 1
      prompt: |
        A car bought for $24,000 loses 15% of its value each year. Which equation gives its value V(t) after t years, and what is V(3) to the nearest dollar?
      options:
        - "V(t) = 24,000 − 0.15t; V(3) ≈ $24,000"
        - "V(t) = 24,000 · 0.15ᵗ; V(3) = $81"
        - "V(t) = 24,000 · 0.85ᵗ; V(3) ≈ $14,739"
        - "V(t) = 24,000 · 1.15ᵗ; V(3) ≈ $36,501"
      option_explanations:
        - |
          This subtracts 15 cents a year; a percentage loss is a multiplication, not a subtraction.
        - |
          0.15 is the fraction lost, not the fraction kept; this would leave almost nothing after three years.
        - |
          Correct. 85% remains each year, and 24,000 · 0.85³ = 24,000 · 0.614125 ≈ 14,739.
        - |
          1.15 is a 15% increase; the car is losing value.
      answer: 2

    - slug: alg1-u05-w19-q10
      type: multiple_choice
      topic_code: "5.4"
      source: "IM Algebra 1, Unit 5, Lesson 4"
      points: 1
      prompt: |
        A table shows 640, 160, 40, 10 for x = 0, 1, 2, 3. Which equation fits?
      options:
        - "f(x) = 640 − 480x"
        - "f(x) = 640 · (1/4)ˣ"
        - "f(x) = 160 · (1/4)ˣ"
        - "f(x) = 640 · 4ˣ"
      option_explanations:
        - |
          The first drop is 480 but the next is only 120, so the pattern is not linear.
        - |
          Correct. Each value is a quarter of the previous one, from a start of 640.
        - |
          160 is f(1), not the starting value; f(0) must be 640.
        - |
          A factor of 4 would make the values grow, but they shrink.
      answer: 1

    - slug: alg1-u05-w19-q11
      type: multiple_choice
      topic_code: "4.7"
      source: "IM Algebra 1, Unit 4, Lesson 7"
      points: 1
      prompt: |
        For f(x) = 2 · 3ˣ, what is the average rate of change from x = 0 to x = 2?
      options:
        - "3"
        - "9"
        - "16"
        - "8"
      option_explanations:
        - |
          3 is the growth factor per step; the rate of change is a difference per unit, not a ratio.
        - |
          9 is 3², the factor over two steps, not the average rate of change.
        - |
          16 is the change in output alone; it must be divided by the change in input, 2.
        - |
          Correct. f(2) = 18 and f(0) = 2, so (18 − 2)/(2 − 0) = 8.
      answer: 3

    - slug: alg1-u05-w19-q12
      type: multiple_choice
      topic_code: "4.10"
      source: "IM Algebra 1, Unit 4, Lesson 10"
      points: 1
      prompt: |
        B(h) = 400 · 2ʰ models a bacteria count h hours after the start of an experiment that lasts 10 hours. What is a sensible domain for B?
      options:
        - "0 ≤ h ≤ 10"
        - "400 ≤ h ≤ 409,600"
        - "The whole numbers 0 to 10 only"
        - "All real numbers"
      option_explanations:
        - |
          Correct. Time runs continuously from the start to the end of the 10-hour experiment.
        - |
          These are bacteria counts (outputs), not hours.
        - |
          Time is continuous; the count at 2.5 hours is a perfectly good question.
        - |
          Negative times and times after the experiment ends are not part of the situation.
      answer: 0

    - slug: alg1-u05-w19-q13
      type: multiple_choice
      topic_code: "4.14"
      source: "IM Algebra 1, Unit 4, Lesson 14"
      points: 1
      prompt: |
        Which function has its vertex at (5, −3) and a minimum value of −3?
      options:
        - "y = |x + 5| − 3"
        - "y = |x − 5| + 3"
        - "y = −|x − 5| − 3"
        - "y = |x − 5| − 3"
      option_explanations:
        - |
          The inside x + 5 is zero at x = −5, putting the vertex at (−5, −3).
        - |
          Adding 3 places the vertex at (5, 3), not (5, −3).
        - |
          The negative sign makes the V open downward, so −3 would be a maximum, not a minimum.
        - |
          Correct. The inside is zero at x = 5, the output there is −3, and the V opens upward, so −3 is the minimum.
      answer: 3

    # ---- Select-all (5.2, 4.6)
    - slug: alg1-u05-w19-q14
      type: multi_select
      topic_code: "5.2"
      source: "IM Algebra 1, Unit 5, Lesson 2"
      points: 2
      partial_credit: true
      prompt: |
        Which situations describe exponential growth or decay? Select all that apply.
      options:
        - "A savings jar gains $5 every week."
        - "A rumour reaches three times as many people each day."
        - "A taxi charges $2 per kilometre."
        - "A ball rebounds to 70% of its previous height on each bounce."
        - "A population grows by 3% every year."
      option_explanations:
        - |
          Adding $5 each week is a constant difference: linear growth.
        - |
          Correct. Tripling each day is a constant factor of 3: exponential growth.
        - |
          The fare rises by the same $2 for each kilometre: linear.
        - |
          Correct. Multiplying by 0.7 each bounce is a constant factor less than 1: exponential decay.
        - |
          Correct. Multiplying by 1.03 each year is a constant factor: exponential growth.
      answer: [1, 3, 4]

    - slug: alg1-u05-w19-q15
      type: multi_select
      topic_code: "4.6"
      source: "IM Algebra 1, Unit 4, Lesson 6"
      points: 2
      partial_credit: true
      prompt: |
        The graph of f(x) = 5 · 2ˣ is drawn for 0 ≤ x ≤ 4. Which statements are true? Select all that apply.
      options:
        - "The average rate of change from 0 to 1 equals the average rate of change from 3 to 4."
        - "The maximum value on the interval is 80, at x = 4."
        - "The function is increasing on the whole interval."
        - "The graph has a zero at x = 0."
        - "The vertical intercept is 5."
      option_explanations:
        - |
          From 0 to 1 the rate is 5; from 3 to 4 it is 80 − 40 = 40. Exponential growth speeds up.
        - |
          Correct. f(4) = 5 · 16 = 80 is the largest value on the interval.
        - |
          Correct. Each output is twice the previous, so the graph rises throughout.
        - |
          f(0) = 5, not 0; an exponential function a · bˣ with a > 0 is never 0.
        - |
          Correct. f(0) = 5 · 2⁰ = 5 · 1 = 5, the starting value.
      answer: [1, 2, 4]

    # ---- True/false (5.4, 4.15)
    - slug: alg1-u05-w19-q16
      type: true_false
      topic_code: "5.4"
      source: "IM Algebra 1, Unit 5, Lesson 4"
      points: 1
      prompt: |
        True or false: a quantity that loses half its value every day will reach exactly 0 after enough days.
      answer: false
      explanation: |
        False. Halving always leaves half of a positive amount, so the quantity gets smaller and smaller but never reaches 0; the graph approaches the x-axis without touching it.

    - slug: alg1-u05-w19-q17
      type: true_false
      topic_code: "4.15"
      source: "IM Algebra 1, Unit 4, Lesson 15"
      points: 1
      prompt: |
        True or false: every function has an inverse function.
      answer: false
      explanation: |
        False. A function whose outputs repeat (such as the height of a thrown ball, or |x|) cannot send an output back to a single input, so it has no inverse function.

    # ---- Fill in the blank (5.3, 2.17)
    - slug: alg1-u05-w19-q18
      type: fill_blank
      topic_code: "5.3"
      source: "IM Algebra 1, Unit 5, Lesson 3"
      points: 1
      prompt: |
        In the exponential function f(x) = a · bˣ, the number a is the ____ value, the output when x = 0.
      answer: ["starting", "initial", "beginning", "start"]
      explanation: |
        Because b⁰ = 1, f(0) = a. The number b is the growth or decay factor.

    - slug: alg1-u05-w19-q19
      type: fill_blank
      topic_code: "2.17"
      source: "IM Algebra 1, Unit 2, Lesson 17"
      points: 1
      prompt: |
        The system 2x + y = 8 and 4x + 2y = 16 has ____ solutions.
      answer: ["infinitely many", "infinite", "infinitely many solutions", "an infinite number of"]
      explanation: |
        The second equation is exactly twice the first, so both describe the same line; every point on it satisfies both.

    # ---- Numeric (5.3, 5.4, 4.7)
    - slug: alg1-u05-w19-q20
      type: numeric
      topic_code: "5.3"
      source: "IM Algebra 1, Unit 5, Lesson 3"
      points: 1
      prompt: |
        If f(x) = 7 · 4ˣ, what is f(4)?
      answer: { value: 1792, tolerance: 0 }
      explanation: |
        4⁴ = 256, and 7 · 256 = 1,792.

    - slug: alg1-u05-w19-q21
      type: numeric
      topic_code: "5.4"
      source: "IM Algebra 1, Unit 5, Lesson 4"
      points: 1
      prompt: |
        A ball dropped from 250 cm rebounds to 60% of its previous height on each bounce. How high, in centimetres, is the third bounce?
      answer: { value: 54, tolerance: 0 }
      explanation: |
        250 · 0.6³ = 250 · 0.216 = 54 cm.

    - slug: alg1-u05-w19-q22
      type: numeric
      topic_code: "4.7"
      source: "IM Algebra 1, Unit 4, Lesson 7"
      points: 1
      prompt: |
        A town's population was 4,500 in 2010 and 6,300 in 2022. What was the average rate of change in people per year?
      answer: { value: 150, tolerance: 0 }
      explanation: |
        (6,300 − 4,500)/(2022 − 2010) = 1,800/12 = 150 people per year.

    # ---- Short answer (5.3/5.4, 5.1)
    - slug: alg1-u05-w19-q23
      type: short_answer
      topic_code: "5.3"
      source: "IM Algebra 1, Unit 5, Lesson 3"
      points: 3
      prompt: |
        A table shows a quantity of 12 at x = 1 and 36 at x = 2, and the pattern is known to be exponential.

        (a) Find the growth factor and the starting value, and write the equation.
        (b) Find the value at x = 5.
        (c) A classmate says the equation is f(x) = 12 · 3ˣ. Explain the mistake and show a check that exposes it.
      answer: |
        (a) Factor 36/12 = 3; starting value f(0) = 12/3 = 4; f(x) = 4 · 3ˣ.
        (b) f(5) = 4 · 243 = 972.
        (c) They used the x = 1 value as the starting value. Check x = 1: 12 · 3¹ = 36, but the table says 12. With 4 · 3¹ = 12 the table is matched.
      explanation: |
        Three points, one per part.

        (a) 1 pt: factor 3, start 4, equation 4 · 3ˣ.

        (b) 1 pt: 972.

        (c) 1 pt: identifies the start-value error with a substitution check.

