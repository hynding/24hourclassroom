      prompt: |
        Two job offers for a 10-day task: Offer A pays $80 per day. Offer B pays $1 on day 1 and doubles the daily pay each day.

        (a) Write expressions for the pay on day n under each offer.
        (b) Compare the pay on day 5 and on day 10.
        (c) Which offer pays more in total over the 10 days? Show the totals.
      answer: |
        (a) A: 80 each day. B: 2ⁿ⁻¹ dollars on day n.
        (b) Day 5: A 80, B 2⁴ = 16. Day 10: A 80, B 2⁹ = 512.
        (c) A total: 800. B total: 1 + 2 + 4 + … + 512 = 1,023. Offer B pays more, because its last few days dwarf the earlier ones.
      explanation: |
        Three points, one per part.

        (a) 1 pt: 80 and 2ⁿ⁻¹ (or an equivalent description).

        (b) 1 pt: day 5 (80 versus 16) and day 10 (80 versus 512).

        (c) 1 pt: totals 800 and 1,023 with B chosen.

