    - slug: alg1-u05-w19-q25
      type: long_answer
      topic_code: "5.4"
      source: "IM Algebra 1, Unit 5, Lesson 4"
      points: 6
      prompt: |
        A patient takes a 400 mg dose of a medicine. Each hour, the amount in the bloodstream falls by one quarter of what was there at the start of the hour.

        (1) Explain why this is exponential decay and give the decay factor. Write an equation A(h) for the amount after h hours.
        (2) Make a table of A(h) for h = 0, 1, 2, 3, 4, rounding to one decimal place, and describe how the hourly decreases change.
        (3) Describe the graph of A: its starting point, shape, and behaviour for large h.
        (4) A second medicine loses 100 mg every hour from a 400 mg dose. Write its rule, say which medicine has more remaining at h = 3 and at h = 5, and explain why the first medicine never runs out while the second does.
      answer: |
        (1) The same fraction (a quarter) is removed each hour, so the amount is multiplied by the same factor, 3/4 = 0.75, every hour: exponential decay. A(h) = 400 · 0.75ʰ.
        (2) h = 0: 400; h = 1: 300; h = 2: 225; h = 3: 168.8; h = 4: 126.6. The decreases are 100, 75, 56.3, 42.2: each decrease is three quarters of the previous one, so they shrink.
        (3) Starts at (0, 400), falls steeply at first, then more gently, flattening toward the h-axis without ever reaching it.
        (4) Second medicine: L(h) = 400 − 100h for 0 ≤ h ≤ 4. At h = 3: A ≈ 168.8 mg, L = 100 mg, so the first has more. At h = 5: A ≈ 95 mg, while L reached 0 at h = 4 and the second medicine is gone. The first removes a fraction of a shrinking amount, so a positive amount always remains; the second removes a fixed 100 mg regardless of what is left, so it reaches 0.
      explanation: |
        Six points.

        (1) 1 pt: constant-factor reasoning, factor 0.75, and A(h) = 400 · 0.75ʰ.

        (2) 2 pts: 1 for the table values, 1 for noting the decreases shrink by the same factor.

        (3) 1 pt: start (0, 400), decreasing and flattening, approaching but never reaching 0.

        (4) 2 pts: 1 for the linear rule and the comparisons at h = 3 and h = 5, 1 for the explanation of why one runs out and the other does not.

        Common errors: factor 0.25; linear subtraction of 100 for the first medicine; claiming A reaches 0 after four hours.
