        A town's population is modelled by P(t) = 3,000 · 1.05ᵗ, where t is years after 2020.

        (a) Find P(−3) to the nearest person and say what it estimates.
        (b) Explain, using the pattern of powers, why 1.05⁻³ equals 1 divided by 1.05³.
        (c) Give one reason the estimate for 2017 might be less reliable than the estimate for 2023.
      answer: |
        (a) P(−3) = 3,000/1.05³ ≈ 2,592: the estimated population in 2017.
        (b) Each decrease of 1 in the exponent divides by 1.05: 1.05¹ → 1.05⁰ = 1 → 1.05⁻¹ = 1/1.05 → … → 1.05⁻³ = 1/1.05³.
        (c) The 5% growth rate was measured from 2020 on; growth before 2020 may have been different, so projecting backwards assumes a pattern we did not observe.
      explanation: |
        Three points, one per part.

        (a) 1 pt: about 2,592 and the 2017 interpretation.

        (b) 1 pt: the divide-by-b pattern leading to the reciprocal.

        (c) 1 pt: any sound reason about the rate possibly differing before the data began.

