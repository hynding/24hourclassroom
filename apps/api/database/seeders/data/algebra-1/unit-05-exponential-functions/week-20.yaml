week: 20
unit: 5
title: "Decay Graphs, Negative Exponents and Exponential Functions"
topics: ["5.5", "5.6", "5.7", "5.8"]
guide: guides/week-20.md
guide_description: |
  Writing and graphing exponential decay from descriptions, tables and pairs of values, reading the starting
  value and factor from a graph and comparing graphs, why exponential graphs never cross the horizontal axis,
  negative exponents and extending a pattern into the past, and exponential situations written as functions
  with domain and range.
flashcards_description: |
  28 cards on decay factors from percentages and from two values, reading a and b from a graph, comparing
  growth and decay curves, the horizontal asymptote, zero and negative exponents, evaluating a · bˣ for
  negative x, and domain and range of exponential models.

flashcards:
  - front: Decay equation from "drops 12% a minute from 80"
    back: |
      Factor 0.88; T(m) = 80 · 0.88ᵐ. After 5 minutes, 80 · 0.88⁵ ≈ 42.2.
    topic_code: "5.5"
  - front: Finding the factor from values two steps apart
    back: |
      If f(0) = 500 and f(2) = 320, then b² = 320/500 = 0.64, so b = 0.8 and f(x) = 500 · 0.8ˣ. Take the square root, not half.
    topic_code: "5.5"
  - front: Forest of 6,000 hectares losing 4% a year → area after 10 years
    back: |
      F(t) = 6,000 · 0.96ᵗ; F(10) ≈ 3,989 hectares.
    topic_code: "5.5"
  - front: Table with 90 at x = 1 and 30 at x = 2 → equation
    back: |
      Factor 1/3; working back, f(0) = 90 · 3 = 270; f(x) = 270 · (1/3)ˣ.
    topic_code: "5.5"
  - front: Tyre losing 5% pressure a week from 36 psi → pressure after 4 weeks
    back: |
      P(w) = 36 · 0.95ʷ; P(4) ≈ 29.3 psi.
    topic_code: "5.5"
  - front: Shape of a decay graph a · bˣ, 0 < b < 1
    back: |
      Starts at (0, a), falls quickly at first, then flattens toward the x-axis without touching it.
    topic_code: "5.5"
  - front: Reading the starting value from an exponential graph
    back: |
      It is the y-intercept: the point (0, a).
    topic_code: "5.6"
  - front: Reading the factor from an exponential graph
    back: |
      Divide the y-value at x = 1 by the y-value at x = 0. If the second point is at x = 2, b² is that ratio, so take the square root.
    topic_code: "5.6"
  - front: Graph through (0, 200) and (1, 150) → equation
    back: |
      a = 200, b = 150/200 = 0.75: y = 200 · 0.75ˣ, decay.
    topic_code: "5.6"
  - front: Graph through (0, 4) and (3, 108) → equation
    back: |
      b³ = 108/4 = 27, so b = 3: y = 4 · 3ˣ.
    topic_code: "5.6"
  - front: Growth or decay from the direction of a graph
    back: |
      Rising from left to right means b > 1 (growth); falling means 0 < b < 1 (decay).
    topic_code: "5.6"
  - front: Comparing 100 · 0.9ˣ with 50 · 0.9ˣ
    back: |
      Same factor, so they fall at the same proportional rate; the first is always exactly twice the second.
    topic_code: "5.6"
  - front: Comparing decay with factors 0.5 and 0.8
    back: |
      Both approach zero, but the 0.5 graph drops far faster: after 3 steps it keeps 12.5% of its start, the 0.8 graph 51.2%.
    topic_code: "5.6"
  - front: Why an exponential graph never crosses the x-axis
    back: |
      Every output a · bˣ is a positive number times a positive power, so it is positive. The line y = 0 is a horizontal asymptote: approached, never touched.
    topic_code: "5.6"
  - front: Horizontal asymptote → definition
    back: |
      A horizontal line that a graph gets arbitrarily close to without reaching. For a · bˣ it is y = 0.
    topic_code: "5.6"
  - front: Zero exponent
    back: |
      b⁰ = 1 for any non-zero b. That is why f(0) = a in f(x) = a · bˣ.
    topic_code: "5.7"
  - front: Negative exponent → meaning
    back: |
      b⁻ⁿ = 1/bⁿ. 2⁻³ = 1/8 and 10⁻² = 1/100. A negative exponent never makes the value negative.
    topic_code: "5.7"
  - front: Negative exponent of a fraction
    back: |
      (1/2)⁻² = 1/(1/4) = 4. Dividing by a fraction less than 1 gives a larger number.
    topic_code: "5.7"
  - front: Why negative exponents fit the pattern
    back: |
      2⁴, 2³, 2², 2¹ divide by 2 each step: 16, 8, 4, 2. Continuing: 2⁰ = 1, 2⁻¹ = 1/2, 2⁻² = 1/4.
    topic_code: "5.7"
  - front: Bacteria 400 · 2ʰ at hour −2
    back: |
      400 · 2⁻² = 400/4 = 100: two hours before the count began there were 100 bacteria.
    topic_code: "5.7"
  - front: Decay model before time 0
    back: |
      M(h) = 200 · 0.75ʰ gives M(−1) = 200/0.75 ≈ 266.7, more than at hour 0, because the quantity was larger before it decayed.
    topic_code: "5.7"
  - front: Population 3,000 · 1.05ᵗ, t years after 2020 → 2017 estimate
    back: |
      P(−3) = 3,000/1.05³ ≈ 2,592.
    topic_code: "5.7"
  - front: Evaluate 5 · 3⁻², 10 · (1/4)⁻¹ and 6⁰
    back: |
      5/9; 40; 1.
    topic_code: "5.7"
  - front: Exponential model in function notation
    back: |
      A(h) = 400 · 0.75ʰ; A(3) ≈ 168.8 means about 168.8 mg after 3 hours; solving A(h) = 100 asks when 100 mg remains.
    topic_code: "5.8"
  - front: Domain of an exponential model
    back: |
      The inputs that make sense: continuous time such as h ≥ 0 or 0 ≤ h ≤ 24, or whole numbers for a count of doublings or rounds.
    topic_code: "5.8"
  - front: Range of a decay model with no end
    back: |
      0 < y ≤ a: the start is the largest value, and 0 is approached but not reached. For growth from a: y ≥ a.
    topic_code: "5.8"
  - front: Video views 1,200 growing 30% a day for two weeks → function, domain, V(7)
    back: |
      V(d) = 1,200 · 1.3ᵈ, 0 ≤ d ≤ 14; V(7) ≈ 7,530 views. Views first pass 10,000 on day 9.
    topic_code: "5.8"
  - front: Knockout C(n) = 20 · (1/2)ⁿ players after n rounds → domain
    back: |
      Whole numbers of rounds, 0 up to about 4; the model breaks down when it predicts fractions of a player.
    topic_code: "5.8"

quiz:
  description: |
    25 questions · about 45 minutes · representing decay, analysing graphs, negative exponents, and exponential
    situations as functions (lessons 5.5 to 5.8), with review of growth and decay basics from week 19, domain,
    range and inverses from unit 4, and earlier units. Multiple choice, select-all, true/false and numeric
    items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the
    long answer are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set: a cooling kettle (5.5, 5.6, 5.8)
    - slug: alg1-u05-w20-q01
      type: multiple_choice
      topic_code: "5.5"
      source: "IM Algebra 1, Unit 5, Lesson 5"
      points: 1
      stimulus: |
        A kettle is switched off. The difference between its temperature and the room's temperature is 80 degrees at first and falls by 12% each minute. D(m) is the difference after m minutes.
      prompt: |
        Which equation gives D(m)?
      options:
        - "D(m) = 80 · 1.12ᵐ"
        - "D(m) = 80 · 0.12ᵐ"
        - "D(m) = 80 · 0.88ᵐ"
        - "D(m) = 80 − 12m"
      option_explanations:
        - |
          1.12 would be a 12% increase, but the kettle is cooling.
        - |
          0.12 is the fraction lost; the factor is the fraction that remains.
        - |
          Correct. Losing 12% leaves 88%, so the difference is multiplied by 0.88 each minute.
        - |
          A 12% loss is a multiplication, not a subtraction of 12 degrees each minute.
      answer: 2

    - slug: alg1-u05-w20-q02
      type: multiple_choice
      topic_code: "5.6"
      source: "IM Algebra 1, Unit 5, Lesson 6"
      points: 1
      stimulus: |
        A kettle is switched off. The difference between its temperature and the room's temperature is 80 degrees at first and falls by 12% each minute. D(m) is the difference after m minutes.
      prompt: |
        Which describes the graph of D?
      options:
        - "Starts at (0, 80), falls steeply at first, then flattens toward the horizontal axis without touching it."
        - "Starts at (0, 80) and falls in a straight line to 0 at m = 6.67."
        - "Starts at (0, 80), falls, and crosses the horizontal axis at about m = 8."
        - "Starts at (0, 0) and rises toward 80."
      option_explanations:
        - |
          Correct. Each minute removes 12% of a smaller amount, so the drops shrink and the curve approaches, but never reaches, zero.
        - |
          A straight line would mean the same number of degrees lost each minute; the loss is a percentage.
        - |
          An exponential decay graph never crosses the axis; 0.88ᵐ is always positive.
        - |
          The difference starts at its largest, 80, and decreases.
      answer: 0

    - slug: alg1-u05-w20-q03
      type: multiple_choice
      topic_code: "5.8"
      source: "IM Algebra 1, Unit 5, Lesson 8"
      points: 1
      stimulus: |
        A kettle is switched off. The difference between its temperature and the room's temperature is 80 degrees at first and falls by 12% each minute. D(m) is the difference after m minutes.
      prompt: |
        What does D(5) ≈ 42.2 mean?
      options:
        - "The kettle loses 42.2 degrees in the first 5 minutes."
        - "After 5 minutes the kettle is about 42.2 degrees warmer than the room."
        - "The kettle's temperature is 42.2 degrees after 5 minutes."
        - "The kettle takes 42.2 minutes to cool by 5 degrees."
      option_explanations:
        - |
          The loss in 5 minutes is 80 − 42.2 = 37.8 degrees; 42.2 is what remains.
        - |
          Correct. The input is 5 minutes and the output is the difference from room temperature, about 42.2 degrees.
        - |
          D measures the difference from the room's temperature, not the kettle's actual temperature.
        - |
          The input is the time and the output the difference; this reverses them.
      answer: 1

    - slug: alg1-u05-w20-q04
      type: multiple_choice
      topic_code: "4.10"
      source: "IM Algebra 1, Unit 4, Lesson 10"
      points: 1
      stimulus: |
        A kettle is switched off. The difference between its temperature and the room's temperature is 80 degrees at first and falls by 12% each minute. D(m) is the difference after m minutes.
      prompt: |
        Which gives a sensible domain and range for D if the kettle is observed for one hour?
      options:
        - "Domain whole numbers 0 to 60; range 0 ≤ D ≤ 80"
        - "Domain 0 ≤ m ≤ 80; range 0 ≤ D ≤ 60"
        - "Domain all real numbers; range all real numbers"
        - "Domain 0 ≤ m ≤ 60; range from about 0.04 up to 80"
      option_explanations:
        - |
          Time is continuous, so fractions of a minute are valid inputs, and 0 is never reached.
        - |
          This swaps the numbers: 80 is a temperature difference and 60 is the number of minutes.
        - |
          Negative times and negative differences do not occur in the situation.
        - |
          Correct. Time runs continuously over the hour, and D falls from 80 to 80 · 0.88⁶⁰ ≈ 0.04, never reaching 0.
      answer: 3

    # ---- Multiple choice (5.5–5.8)
    - slug: alg1-u05-w20-q05
      type: multiple_choice
      topic_code: "5.5"
      source: "IM Algebra 1, Unit 5, Lesson 5"
      points: 1
      prompt: |
        A quantity decays exponentially from 500 at x = 0 to 320 at x = 2. What is the decay factor?
      options:
        - "0.8"
        - "0.64"
        - "0.32"
        - "0.9"
      option_explanations:
        - |
          Correct. Two steps multiply by b², so b² = 320/500 = 0.64 and b = 0.8.
        - |
          0.64 is the ratio over two steps, b²; the factor per step is its square root.
        - |
          0.32 halves 0.64 instead of taking its square root.
        - |
          0.9² = 0.81, which would give 405 at x = 2, not 320.
      answer: 0

    - slug: alg1-u05-w20-q06
      type: multiple_choice
      topic_code: "5.5"
      source: "IM Algebra 1, Unit 5, Lesson 5"
      points: 1
      prompt: |
        A table shows f(1) = 90 and f(2) = 30 for an exponential function. Which equation fits?
      options:
        - "f(x) = 30 · (1/3)ˣ"
        - "f(x) = 90 · 3ˣ"
        - "f(x) = 270 · (1/3)ˣ"
        - "f(x) = 90 · (1/3)ˣ"
      option_explanations:
        - |
          30 is f(2); this rule gives f(1) = 10, not 90.
        - |
          A factor of 3 makes the values grow, but they shrink from 90 to 30.
        - |
          Correct. The factor is 30/90 = 1/3, and working back one step gives f(0) = 270.
        - |
          90 is f(1), not f(0); this rule gives f(1) = 30.
      answer: 2

    - slug: alg1-u05-w20-q07
      type: multiple_choice
      topic_code: "5.6"
      source: "IM Algebra 1, Unit 5, Lesson 6"
      points: 1
      prompt: |
        The graph of an exponential function passes through (0, 200) and (1, 150). What is its equation?
      options:
        - "y = 150 · 0.75ˣ"
        - "y = 200 − 50x"
        - "y = 200 · 1.5ˣ"
        - "y = 200 · 0.75ˣ"
      option_explanations:
        - |
          The starting value is the y-intercept, 200, not 150.
        - |
          This is a line through the two points, not an exponential function.
        - |
          The graph falls from 200 to 150, so the factor is less than 1.
        - |
          Correct. The intercept gives a = 200 and the factor is 150/200 = 0.75.
      answer: 3

    - slug: alg1-u05-w20-q08
      type: multiple_choice
      topic_code: "5.6"
      source: "IM Algebra 1, Unit 5, Lesson 6"
      points: 1
      prompt: |
        Which statement about the graphs of y = 100 · 0.9ˣ and y = 50 · 0.9ˣ is true?
      options:
        - "The first graph falls at a slower proportional rate."
        - "The first graph is always exactly twice as high as the second."
        - "The graphs cross at x = 2."
        - "The second graph reaches 0 first."
      option_explanations:
        - |
          Both lose 10% per step; only their starting values differ.
        - |
          Correct. Both are multiplied by the same 0.9ˣ, so their ratio is 100/50 = 2 for every x.
        - |
          The ratio between them is always 2, so they never meet.
        - |
          Neither graph ever reaches 0; exponential decay only approaches it.
      answer: 1

    - slug: alg1-u05-w20-q09
      type: multiple_choice
      topic_code: "5.7"
      source: "IM Algebra 1, Unit 5, Lesson 7"
      points: 1
      prompt: |
        What is the value of 2⁻³?
      options:
        - "1/6"
        - "−8"
        - "1/8"
        - "−6"
      option_explanations:
        - |
          1/6 inverts the product 2 × 3 instead of the power 2³ = 8.
        - |
          A negative exponent does not make the result negative; it inverts the power.
        - |
          Correct. A negative exponent means a reciprocal: 2⁻³ = 1/2³ = 1/8.
        - |
          −6 treats the exponent as a multiplier, 2 × (−3), which is not what a power means.
      answer: 2

    - slug: alg1-u05-w20-q10
      type: multiple_choice
      topic_code: "5.7"
      source: "IM Algebra 1, Unit 5, Lesson 7"
      points: 1
      prompt: |
        A culture has B(h) = 400 · 2ʰ bacteria h hours after counting began. What does B(−2) = 100 tell you?
      options:
        - "After 2 hours there were 100 bacteria."
        - "Two hours before counting began, there were 100 bacteria."
        - "The culture lost 100 bacteria in 2 hours."
        - "The count is negative, so the model is invalid."
      option_explanations:
        - |
          After 2 hours the count is B(2) = 1,600; the negative input refers to the past.
        - |
          Correct. A negative input is a time before h = 0; 400 · 2⁻² = 400/4 = 100.
        - |
          The culture was growing the whole time; 100 is the earlier count, not a loss.
        - |
          The output, 100, is positive; only the input (a time) is negative, which is fine.
      answer: 1

    - slug: alg1-u05-w20-q11
      type: multiple_choice
      topic_code: "5.4"
      source: "IM Algebra 1, Unit 5, Lesson 4"
      points: 1
      prompt: |
        A quantity is multiplied by 0.65 each week. Which description matches?
      options:
        - "It loses 35% of its value each week."
        - "It loses 65% of its value each week."
        - "It gains 65% each week."
        - "It loses 0.65 units each week."
      option_explanations:
        - |
          Correct. Keeping 65% means losing the other 35%.
        - |
          A factor of 0.65 keeps 65%; the loss is 35%.
        - |
          A factor below 1 shrinks the quantity each week; it cannot describe a gain.
        - |
          The factor is a multiplier, not an amount subtracted.
      answer: 0

    - slug: alg1-u05-w20-q12
      type: multiple_choice
      topic_code: "4.16"
      source: "IM Algebra 1, Unit 4, Lesson 16"
      points: 1
      prompt: |
        Which is the inverse of the linear function y = 4x − 20?
      options:
        - "x = 1/(4y − 20)"
        - "x = (y − 20)/4"
        - "x = 4y + 20"
        - "x = (y + 20)/4"
      option_explanations:
        - |
          An inverse function is not a reciprocal.
        - |
          The function subtracted 20, so the inverse must add it back before dividing.
        - |
          This multiplies by 4 instead of dividing; it does not undo the function.
        - |
          Correct. Add 20 to both sides and divide by 4; check: y = 0 gives x = 5 and 4(5) − 20 = 0.
      answer: 3

    - slug: alg1-u05-w20-q13
      type: multiple_choice
      topic_code: "2.5"
      source: "IM Algebra 1, Unit 2, Lesson 5"
      points: 1
      prompt: |
        Which point lies on the graph of 3x − 2y = 12?
      options:
        - "(0, 6)"
        - "(2, 3)"
        - "(4, −1)"
        - "(6, 3)"
      option_explanations:
        - |
          3(0) − 2(6) = −12, the wrong sign; the y-intercept is (0, −6).
        - |
          Substituting (2, 3) gives 3(2) − 2(3) = 6 − 6 = 0, which is not 12.
        - |
          Substituting (4, −1) gives 3(4) − 2(−1) = 12 + 2 = 14, which is not 12.
        - |
          Correct. Substituting (6, 3) gives 3(6) − 2(3) = 18 − 6 = 12, so the point is on the line.
      answer: 3

    # ---- Select-all (5.6, 4.10)
    - slug: alg1-u05-w20-q14
      type: multi_select
      topic_code: "5.6"
      source: "IM Algebra 1, Unit 5, Lesson 6"
      points: 2
      partial_credit: true
      prompt: |
        Which statements about the graph of y = a · bˣ with a > 0 and 0 < b < 1 are true? Select all that apply.
      options:
        - "It crosses the y-axis at (0, a)."
        - "It is decreasing for all x."
        - "The outputs are always positive."
        - "It crosses the x-axis once, for some large x."
        - "For negative x the outputs are larger than a."
      option_explanations:
        - |
          Correct. b⁰ = 1, so the output at x = 0 is a.
        - |
          Correct. Multiplying by a factor less than 1 makes each output smaller than the last.
        - |
          Correct. A positive number times a positive power is positive.
        - |
          The output is always positive, so the graph never meets the x-axis.
        - |
          Correct. b⁻ⁿ = 1/bⁿ is greater than 1 when b < 1, so values to the left of 0 exceed a.
      answer: [0, 1, 2, 4]

    - slug: alg1-u05-w20-q15
      type: multi_select
      topic_code: "4.10"
      source: "IM Algebra 1, Unit 4, Lesson 10"
      points: 2
      partial_credit: true
      prompt: |
        C(n) = 64 · (1/2)ⁿ gives the number of players left after n rounds of a knockout tournament that starts with 64 players. Which statements are true? Select all that apply.
      options:
        - "The domain is the whole numbers 0 to 6."
        - "The range is 0 < C ≤ 64."
        - "The range is 64, 32, 16, 8, 4, 2, 1."
        - "C(6) = 1 means one player remains after six rounds: the winner."
        - "The domain is all real numbers n ≥ 0."
      option_explanations:
        - |
          Correct. Rounds are counted in whole numbers, and after round 6 one player is left, so the tournament ends.
        - |
          With a discrete domain the range is the list of seven values, not every number between 0 and 64.
        - |
          Correct. Each round halves the field: 64, 32, 16, 8, 4, 2, 1.
        - |
          Correct. 64 · (1/2)⁶ = 64/64 = 1, so one player, the champion, remains.
        - |
          Half a round has no meaning; the inputs are whole numbers.
      answer: [0, 2, 3]

    # ---- True/false (5.7, 5.2)
    - slug: alg1-u05-w20-q16
      type: true_false
      topic_code: "5.7"
      source: "IM Algebra 1, Unit 5, Lesson 7"
      points: 1
      prompt: |
        True or false: for any non-zero number b, b⁰ = 1.
      answer: true
      explanation: |
        True. Following the pattern of dividing by b as the exponent drops by 1, b¹/b = b⁰ = 1. This is why f(0) = a in f(x) = a · bˣ.

    - slug: alg1-u05-w20-q17
      type: true_false
      topic_code: "5.2"
      source: "IM Algebra 1, Unit 5, Lesson 2"
      points: 1
      prompt: |
        True or false: to decide whether a table shows exponential growth, you should check that consecutive outputs have a constant difference.
      answer: false
      explanation: |
        False. A constant difference signals linear growth. Exponential growth shows a constant ratio between consecutive outputs; that ratio is the growth factor.

    # ---- Fill in the blank (5.6, 4.11)
    - slug: alg1-u05-w20-q18
      type: fill_blank
      topic_code: "5.6"
      source: "IM Algebra 1, Unit 5, Lesson 6"
      points: 1
      prompt: |
        The line y = 0, which the graph of an exponential function approaches but never touches, is called a horizontal ____.
      answer: ["asymptote"]
      explanation: |
        A decay graph approaches y = 0 as x increases; a growth graph approaches it as x decreases. Either way the outputs stay positive.

    - slug: alg1-u05-w20-q19
      type: fill_blank
      topic_code: "4.11"
      source: "IM Algebra 1, Unit 4, Lesson 11"
      points: 1
      prompt: |
        The set of all inputs for which a function is defined or makes sense is called its ____.
      answer: ["domain"]
      explanation: |
        The domain is the set of allowed inputs; the range is the set of outputs they produce.

    # ---- Numeric (5.7, 5.5, 5.8)
    - slug: alg1-u05-w20-q20
      type: numeric
      topic_code: "5.7"
      source: "IM Algebra 1, Unit 5, Lesson 7"
      points: 1
      prompt: |
        What is 8 · 2⁻³?
      answer: { value: 1, tolerance: 0 }
      explanation: |
        2⁻³ = 1/8, and 8 · (1/8) = 1.

    - slug: alg1-u05-w20-q21
      type: numeric
      topic_code: "5.5"
      source: "IM Algebra 1, Unit 5, Lesson 5"
      points: 1
      prompt: |
        A tyre loses 5% of its pressure each week from 36 psi. To one decimal place, what is the pressure after 4 weeks?
      answer: { value: 29.3, tolerance: 0.1 }
      explanation: |
        36 · 0.95⁴ = 36 · 0.81450625 ≈ 29.3 psi.

    - slug: alg1-u05-w20-q22
      type: numeric
      topic_code: "5.8"
      source: "IM Algebra 1, Unit 5, Lesson 8"
      points: 1
      prompt: |
        V(d) = 1,200 · 1.3ᵈ gives a video's views d days after posting. On which day d does V(d) first exceed 10,000?
      answer: { value: 9, tolerance: 0 }
      explanation: |
        V(8) ≈ 9,789 and V(9) ≈ 12,725, so day 9 is the first with more than 10,000 views.

    # ---- Short answer (5.6, 5.7)
    - slug: alg1-u05-w20-q23
      type: short_answer
      topic_code: "5.6"
      source: "IM Algebra 1, Unit 5, Lesson 6"
      points: 3
      prompt: |
        The graph of an exponential function passes through (0, 50) and (2, 72).

        (a) Find the growth factor, showing why you need a square root.
        (b) Write the equation and find the output at x = 3.
        (c) Explain why this graph will never meet the x-axis, even for very negative x.
      answer: |
        (a) Two steps multiply by b², so b² = 72/50 = 1.44 and b = 1.2.
        (b) y = 50 · 1.2ˣ; at x = 3, 50 · 1.728 = 86.4.
        (c) For negative x, 1.2ˣ = 1/1.2⁻ˣ is a positive fraction, and 50 times a positive number is positive; the outputs get closer to 0 but never equal it.
      explanation: |
        Three points, one per part.

        (a) 1 pt: b² = 1.44 and b = 1.2 with the two-step reasoning.

        (b) 1 pt: equation and 86.4.

        (c) 1 pt: outputs are always positive because a positive base to any power is positive.

