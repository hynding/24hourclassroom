    - slug: alg1-u05-w20-q25
      type: long_answer
      topic_code: "5.8"
      source: "IM Algebra 1, Unit 5, Lesson 8"
      points: 6
      prompt: |
        A forest covers 6,000 hectares and loses 4% of its area each year to clearing. F(t) is the area in hectares t years from now.

        (1) Write F(t) and explain the factor. State a sensible domain if the model is used for the next 25 years, and the corresponding range.
        (2) Find F(10) to the nearest hectare and interpret it.
        (3) Describe the graph of F and explain why, according to the model, the forest never disappears completely, and whether that is realistic.
        (4) Use the model to estimate the area 5 years ago, and explain how a negative exponent is involved.
      answer: |
        (1) F(t) = 6,000 · 0.96ᵗ; losing 4% leaves 96%. Domain 0 ≤ t ≤ 25; range from F(25) = 6,000 · 0.96²⁵ ≈ 2,163 up to 6,000.
        (2) F(10) = 6,000 · 0.96¹⁰ ≈ 3,989 hectares: about two thirds of the forest remains after ten years.
        (3) Starts at (0, 6,000), decreasing, steeper at first and flattening, approaching the t-axis but never touching it. Mathematically 0.96ᵗ is always positive, so some area always remains; in reality the area is measured in whole hectares and clearing could stop or finish the forest, so the model is only an approximation, especially far into the future.
        (4) Five years ago is t = −5: F(−5) = 6,000 · 0.96⁻⁵ = 6,000/0.96⁵ ≈ 7,359 hectares. The negative exponent means dividing by 0.96 five times, which undoes five years of 4% losses.
      explanation: |
        Six points.

        (1) 2 pts: 1 for the equation with the factor explained, 1 for the domain and range (about 2,163 to 6,000).

        (2) 1 pt: about 3,989 with an interpretation.

        (3) 2 pts: 1 for the graph description and the always-positive argument, 1 for a sensible comment on realism.

        (4) 1 pt: about 7,359 with the reciprocal explanation.

        Common errors: factor 0.04 or 1.04; range 0 to 6,000; treating F(−5) as a loss.
