        (b) t = 0: A 2,000, B 1,200, so A. t = 5: A ≈ 2,433, B ≈ 1,846, so A still.
        (c) B's factor is larger, so its value is multiplied by more each year; a larger factor always overtakes a smaller one eventually. t = 10: A ≈ 2,960, B ≈ 2,841 (A still ahead); t = 12: A ≈ 3,202, B ≈ 3,375 (B ahead). So B overtakes A after about 11 years.
