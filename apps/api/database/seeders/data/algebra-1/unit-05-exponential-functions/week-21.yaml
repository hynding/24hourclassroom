      source: "IM Algebra 1, Unit 5, Lesson 11"
      points: 3
      prompt: |
        The excess temperature of a cup of coffee above room temperature is recorded every 5 minutes: 60, 48, 38, 31, 25 degrees.

        (a) Compute the ratios of consecutive values and decide whether an exponential model is reasonable.
        (b) Write a model E(t) with t counted in 5-minute steps, and use it to predict the excess temperature at 30 minutes.
        (c) Check the model against the 15-minute reading and comment on the fit.
      answer: |
        (a) 48/60 = 0.80, 38/48 ≈ 0.79, 31/38 ≈ 0.82, 25/31 ≈ 0.81: roughly constant, so exponential decay with factor about 0.8 is reasonable.
        (b) E(t) = 60 · 0.8ᵗ; 30 minutes is t = 6: 60 · 0.8⁶ ≈ 15.7 degrees.
        (c) At 15 minutes, t = 3: 60 · 0.512 = 30.7, against the actual 31. The model fits well.
      explanation: |
        Three points, one per part.

        (a) 1 pt: ratios about 0.8 and the exponential conclusion.

        (b) 1 pt: E(t) = 60 · 0.8ᵗ and about 15.7.

        (c) 1 pt: prediction about 30.7 compared with 31, judged a good fit.

    - slug: alg1-u05-w21-q24
