    # ---- Long answer (5.12, 5.13)
    - slug: alg1-u05-w21-q25
      type: long_answer
      topic_code: "5.12"
      source: "IM Algebra 1, Unit 5, Lesson 12"
      points: 6
      prompt: |
        Four functions are given: f(x) = 100 · 1.1ˣ, g(x) = 10 · 1.5ˣ, h(x) = 100 · 0.8ˣ and k(x) = 10 · 0.8ˣ.

        (1) Without plotting, describe how to tell the four graphs apart: which rise, which fall, and where each crosses the y-axis.
        (2) Compare h and k: what do they have in common, and how is one related to the other at every x?
        (3) f starts at ten times g's value. Compute both at x = 5 and x = 10, and state between which two whole numbers the graphs of f and g cross, with evidence.
        (4) A graph passes through (0, 10) and (2, 22.5). Decide which of the four functions it could be, or find its equation if it is none of them.
      answer: |
        (1) f and g rise (factors above 1); h and k fall (factor 0.8). Intercepts: f and h at (0, 100); g and k at (0, 10). So f: rising from 100; g: rising from 10; h: falling from 100; k: falling from 10.
        (2) Same factor 0.8, so both lose 20% per step and have the same shape; h(x) = 10 · k(x) for every x.
        (3) x = 5: f ≈ 161, g ≈ 76; x = 10: f ≈ 259, g ≈ 577. f is ahead at 5 and behind at 10. x = 7: f ≈ 195, g ≈ 171; x = 8: f ≈ 214, g ≈ 256. The graphs cross between x = 7 and x = 8.
        (4) a = 10; b² = 22.5/10 = 2.25, so b = 1.5: y = 10 · 1.5ˣ, which is g.
      explanation: |
        Six points.

        (1) 2 pts: 1 for direction of each, 1 for the intercepts.

        (2) 1 pt: same factor and h = 10k.

        (3) 2 pts: 1 for the four values, 1 for locating the crossing between 7 and 8 with evidence.

        (4) 1 pt: identifies g via b = 1.5.

        Common errors: using the intercept alone to match; taking b = 2.25; assuming the larger start stays ahead.
