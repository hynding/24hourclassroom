    # ---- Short answer (5.19, 5.21)
    - slug: alg1-u05-w23-q23
      type: short_answer
      topic_code: "5.19"
      source: "IM Algebra 1, Unit 5, Lesson 19"
      points: 3
      prompt: |
        L(t) = 500 + 100t and E(t) = 500 · 1.15ᵗ model two quantities.

        (a) Find the average rate of change of each from t = 0 to t = 5 and say which changes faster there.
        (b) Find the average rate of change of each from t = 10 to t = 15 and say which changes faster there.
        (c) Explain in one or two sentences why the answers to (a) and (b) can differ.
      answer: |
        (a) L: 100 per unit. E: (1,005.7 − 500)/5 ≈ 101 per unit. E, by a little.
        (b) L: 100. E: (4,068.5 − 2,022.8)/5 ≈ 409 per unit. E, by a lot.
        (c) A line's rate is the same everywhere, but an exponential function's increases are multiplied by the factor every step, so its average rate over later intervals is larger than over earlier ones.
      explanation: |
        Three points, one per part.

        (a) 1 pt: 100 and about 101 with E chosen.

        (b) 1 pt: 100 and about 409 with E chosen.

        (c) 1 pt: constant rate versus multiplying rate.

    - slug: alg1-u05-w23-q24
      type: short_answer
      topic_code: "5.21"
      source: "IM Algebra 1, Unit 5, Lesson 21"
      points: 3
      prompt: |
        A town had 12,000 people in 2005 and 15,000 in 2015.

        (a) Assuming exponential growth, find the growth factor per decade and write a model with d decades after 2005.
        (b) Predict the population in 2035.
        (c) Convert the factor to a yearly growth rate (as a percentage to two decimal places), explaining the method.
      answer: |
        (a) 15,000/12,000 = 1.25 per decade; T(d) = 12,000 · 1.25ᵈ.
        (b) 2035 is d = 3: 12,000 · 1.25³ = 23,437.5, about 23,400.
        (c) The yearly factor is the tenth root of 1.25: 1.25^(1/10) ≈ 1.0226, so about 2.26% per year. Dividing 25% by 10 would give 2.5%, which is wrong because yearly growth compounds.
      explanation: |
        Three points, one per part.

        (a) 1 pt: factor 1.25 and the model.

        (b) 1 pt: about 23,400.

        (c) 1 pt: tenth root, about 2.26%, with the compounding reason.

    # ---- Long answer (5.21)
    - slug: alg1-u05-w23-q25
      type: long_answer
      topic_code: "5.21"
      source: "IM Algebra 1, Unit 5, Lesson 21"
      points: 6
      prompt: |
        Census counts for a city, in thousands: 1990: 240; 2000: 288; 2010: 346; 2020: 415.

        (1) Compute the differences and the ratios between consecutive counts and decide whether a linear or an exponential model fits better, with reasons.
        (2) Write an exponential model P(d) with d decades after 1990, and rewrite it with t in years, giving the yearly factor to four decimal places.
        (3) Predict the population in 2030 and in 2060 with your model.
        (4) Discuss the reliability of each prediction in (3), and describe one piece of evidence that would make you revise the model.
      answer: |
        (1) Differences: 48, 58, 69 (growing). Ratios: 1.20, 1.20, 1.20 (constant). Constant ratios mean exponential growth; growing differences mean a line would underestimate later counts.
        (2) P(d) = 240 · 1.2ᵈ. Yearly factor 1.2^(1/10) ≈ 1.0184, so P(t) ≈ 240 · 1.0184ᵗ with t years after 1990.
        (3) 2030: d = 4, 240 · 1.2⁴ ≈ 498 thousand. 2060: d = 7, 240 · 1.2⁷ ≈ 860 thousand.
        (4) The 2030 prediction is one decade beyond the data and the pattern has held for three decades, so it is reasonable. The 2060 prediction assumes four more decades of 20% growth; limits on land, housing, water or jobs could slow growth, so it is far less reliable and should be reported as conditional. Evidence for revision: a 2030 count well below 498 thousand, or ratios between recent counts falling below 1.2, would show the growth factor is dropping.
      explanation: |
        Six points.

        (1) 1 pt: differences and ratios with the exponential conclusion.

        (2) 2 pts: 1 for P(d) = 240 · 1.2ᵈ, 1 for the yearly form with factor about 1.0184.

        (3) 1 pt: about 498 and about 860 thousand.

        (4) 2 pts: 1 for distinguishing the reliability of the two predictions with reasons, 1 for a sensible piece of revising evidence.

        Common errors: yearly factor 1.02 (dividing 20% by 10); predicting 2060 as 2020 plus 4 × 69; no caution on the long-range figure.
