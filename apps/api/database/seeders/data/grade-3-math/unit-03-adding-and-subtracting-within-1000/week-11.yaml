week: 11
unit: 3
title: "Two-Step Problems and Answers That Make Sense"
topics: ["3.OA.D.8", "3.OA.D.9"]
guide: guides/week-11.md
guide_description: |
  How to solve story problems that take two steps, using tape diagrams and equations with a letter for the
  unknown number, how to use an estimate to decide if an answer makes sense, and patterns with odd and even numbers.
flashcards_description: |
  19 cards on two-step problems, letters for unknown numbers, equations and tape diagrams, which step comes
  first, checking an answer with an estimate, and odd and even patterns.

flashcards:
  - front: Two-step story problem → how to plan it
    back: |
      Ask what you need to find first. Solve that step, then use its answer to do the second step.
    topic_code: "3.OA.D.8"
  - front: Letter for an unknown → what it means
    back: |
      A letter, like n or b, stands for the number we do not know yet. 245 + n = 400 asks "245 plus what is 400?"
    topic_code: "3.OA.D.8"
  - front: 245 + n = 400 → the value of n
    back: |
      155. Count up from 245: 5 to 250, 50 to 300, 100 to 400. 5 + 50 + 100 = 155.
    topic_code: "3.OA.D.8"
  - front: Equation → what it is
    back: |
      A math sentence with an equal sign that shows two amounts are the same, such as 3 × 8 + 5 = 29.
    topic_code: "3.OA.D.8"
  - front: Tape diagram in a two-step problem → how it helps
    back: |
      The full bar is the whole amount and the pieces are the parts. Labeling the pieces shows which part is unknown.
    topic_code: "3.OA.D.8"
  - front: '"In all" or "total" → usually means'
    back: |
      Put the parts together: add them, or multiply when the groups are equal.
    topic_code: "3.OA.D.8"
  - front: 4 × 6 + 10 → which step first
    back: |
      Multiply first: 4 × 6 = 24. Then add: 24 + 10 = 34.
    topic_code: "3.OA.D.8"
  - front: Parentheses → (20 − 5) × 2
    back: |
      Do what is inside the parentheses first: 20 − 5 = 15. Then 15 × 2 = 30.
    topic_code: "3.OA.D.8"
  - front: Checking a two-step answer → with an estimate
    back: |
      Round and solve again. If you got 803 for 198 + 305, compare with 200 + 300 = 500. Too far, so check your work.
    topic_code: "3.OA.D.8"
  - front: 3 packs of 8 markers, 5 given away → markers left
    back: |
      Step 1: 3 × 8 = 24 markers. Step 2: 24 − 5 = 19 markers left.
    topic_code: "3.OA.D.8"
  - front: Working backward → 18 + m = 50
    back: |
      Think 50 − 18 = 32, so m = 32. Check: 18 + 32 = 50.
    topic_code: "3.OA.D.8"
  - front: Even or odd for a big number → which digit decides
    back: |
      Only the ones digit. 346 ends in 6, so it is even. 571 ends in 1, so it is odd.
    topic_code: "3.OA.D.9"
  - front: Odd − odd → even or odd?
    back: |
      Always even. Take a number with 1 left over from another with 1 left over, and only pairs remain: 15 − 7 = 8.
    topic_code: "3.OA.D.9"
  - front: Odd + odd → even or odd?
    back: |
      Always even. The two leftover ones make a pair: 7 + 5 = 12.
    topic_code: "3.OA.D.9"
  - front: Even + odd → even or odd?
    back: |
      Always odd. One is still left over: 8 + 3 = 11.
    topic_code: "3.OA.D.9"
  - front: Even + even → even or odd?
    back: |
      Always even. Pairs plus pairs are still pairs: 14 + 6 = 20.
    topic_code: "3.OA.D.9"
  - front: Adding 10 again and again → the pattern
    back: |
      The tens digit goes up by 1 each time and the ones digit stays the same: 136, 146, 156, 166.
    topic_code: "3.OA.D.9"
  - front: Adding 100 again and again → the pattern
    back: |
      The hundreds digit goes up by 1 each time: 125, 225, 325, 425.
    topic_code: "3.OA.D.9"
  - front: Unknown in the middle of a story → example
    back: |
      Ivy had some beads, got 120 more, and now has 300: b + 120 = 300, so b = 180.
    topic_code: "3.OA.D.8"

quiz:
  description: |
    14 questions · about 30 minutes · two-step story problems with tape diagrams and equations that use a letter
    for the unknown, checking answers with estimates, and odd and even patterns, plus review of rounding, subtracting
    and area. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word is
    matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w11-q01
      type: multiple_choice
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 3, Section D"
      points: 1
      stimulus: |
        A class wants to collect 500 bottle caps for an art project. They collected 185 caps in week 1 and 240 caps in week 2. The letter c stands for the caps they still need in week 3. Use the tape diagram.
      figure: figures/w11-tape-diagram.svg
      figure_alt: "A tape diagram titled Bottle Caps Collected. A bracket over the whole bar is labeled 500. The bar has three parts: 185, then 240, then a small part labeled c."
      prompt: |
        Which equation can you use to find c?
      options:
        - "185 + 240 + c = 500"
        - "500 + 185 + 240 = c"
        - "185 + 240 = c"
        - "500 − 185 = c"
      option_explanations:
        - |
          Correct. The three parts, 185, 240 and c, together make the whole bar, 500.
        - |
          500 is the whole bar, not a part. Adding it to the parts makes a number bigger than the whole.
        - |
          185 + 240 finds what was collected in two weeks, not what is still needed. That is only the first step.
        - |
          500 − 185 takes away only week 1. Week 2's 240 caps must be taken away too.
      answer: 0

    - slug: g3math-w11-q02
      type: numeric
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 3, Section D"
      points: 1
      stimulus: |
        A class wants to collect 500 bottle caps for an art project. They collected 185 caps in week 1 and 240 caps in week 2. The letter c stands for the caps they still need in week 3. Use the tape diagram.
      prompt: |
        What number does c stand for?
      answer: { value: 75, tolerance: 0 }
      explanation: |
        Step 1: 185 + 240 = 425 caps so far. Step 2: 500 − 425 = 75. They still need 75 caps. Check: 185 + 240 + 75 = 500.

    - slug: g3math-w11-q03
      type: multiple_choice
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 3, Section D"
      points: 1
      figure: figures/w11-apple-bags.svg
      figure_alt: "A picture titled Apples in Bags. There are 3 bags drawn as circles with 8 red dots in each bag, in 2 rows of 4. Next to the bags are 5 more red dots that are not in a bag."
      prompt: |
        The letter a stands for the total number of apples in the picture. Which equation shows a?
      options:
        - "3 + 8 + 5 = a"
        - "3 × 8 + 5 = a"
        - "3 × 5 + 8 = a"
        - "4 × 8 = a"
      option_explanations:
        - |
          3 + 8 + 5 adds the number of bags instead of multiplying. 3 bags of 8 is 3 × 8 = 24 apples.
        - |
          Correct. 3 bags of 8 is 3 × 8 = 24, and 5 loose apples make 24 + 5 = 29. So a = 29.
        - |
          This switches the numbers. Each bag holds 8, not 5, and there are 5 loose apples, not 8.
        - |
          The 5 loose apples are not a full bag of 8, so you cannot count them as a fourth group.
      answer: 1

    - slug: g3math-w11-q04
      type: numeric
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 3, Section D"
      points: 1
      prompt: |
        Priya has 6 boxes of crayons with 7 crayons in each box. She gives 15 crayons to her friends. How many crayons does she have now?
      answer: { value: 27, tolerance: 0 }
      explanation: |
        Step 1: 6 × 7 = 42 crayons. Step 2: 42 − 15 = 27 crayons. An equation is 6 × 7 − 15 = p, and p = 27.

    - slug: g3math-w11-q05
      type: multiple_choice
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 3, Section D"
      points: 1
      prompt: |
        A bakery made 325 muffins in the morning and 248 muffins in the afternoon. It sold 400 muffins. How many muffins were left?
      options:
        - "573"
        - "973"
        - "173"
        - "163"
      option_explanations:
        - |
          573 is how many muffins were made. That is only the first step; the 400 sold must still be taken away.
        - |
          973 adds all three numbers. The 400 muffins were sold, so they must be subtracted.
        - |
          Correct. Step 1: 325 + 248 = 573 muffins made. Step 2: 573 − 400 = 173 muffins left.
        - |
          163 comes from 325 + 248 = 563, which forgets the ten made from 5 + 8 = 13 ones. The sum is 573, so 173 are left.
      answer: 2

    - slug: g3math-w11-q06
      type: fill_blank
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 3, Section D"
      points: 1
      prompt: |
        A math sentence with an equal sign, like 6 × 4 + 3 = 27, is called an ____.
      answer: ["equation", "equations"]
      explanation: |
        An equation shows that the amounts on both sides of the equal sign are the same. Here 6 × 4 + 3 and 27 are both 27.

    - slug: g3math-w11-q07
      type: true_false
      topic_code: "3.OA.D.9"
      source: "IM K–5 Math Grade 3, Unit 3, Section D"
      points: 1
      prompt: |
        True or false: when you add two odd numbers, the sum is always odd.
      answer: false
      explanation: |
        False. Each odd number has 1 left over after making pairs. The two leftovers make one more pair, so the sum is even: 7 + 9 = 16 and 15 + 21 = 36.

    - slug: g3math-w11-q08
      type: multi_select
      topic_code: "3.OA.D.9"
      source: "IM K–5 Math Grade 3, Unit 3, Section D"
      points: 2
      partial_credit: true
      prompt: |
        Which sums are even? Select all that apply.
      options:
        - "13 + 25"
        - "40 + 17"
        - "36 + 28"
        - "9 + 14"
        - "51 + 47"
      option_explanations:
        - |
          Yes. 13 and 25 are both odd, and odd + odd is always even: 13 + 25 = 38.
        - |
          No. 40 is even and 17 is odd, and even + odd is always odd: 40 + 17 = 57.
        - |
          Yes. 36 and 28 are both even, and even + even is always even: 36 + 28 = 64.
        - |
          No. 9 is odd and 14 is even, so one is left over and the sum is odd: 9 + 14 = 23.
        - |
          Yes. 51 and 47 are both odd, and their leftover ones make a pair: 51 + 47 = 98.
      answer: [0, 2, 4]

    - slug: g3math-w11-q09
      type: multiple_choice
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 3, Section D"
      points: 1
      prompt: |
        A school has 412 students. 189 of them go on a field trip. Sofia says 323 students stay at school. Is her answer reasonable?
      options:
        - "Yes, because 323 is less than 412."
        - "No, because the answer should be more than 412."
        - "Yes, because 412 − 189 is about 400 − 100 = 300."
        - "No, because 412 − 189 is about 400 − 200 = 200, and 323 is far from 200."
      option_explanations:
        - |
          Being less than 412 is not enough. The answer should be about 200 less than 412, and 323 is only about 90 less.
        - |
          Students left the school, so the number who stay is less than 412, not more.
        - |
          189 is close to 200, not 100. Rounding it down to 100 gives an estimate that is too big.
        - |
          Correct. 412 rounds to 400 and 189 rounds to 200, so about 200 students stay. The exact answer is 223.
      answer: 3

    - slug: g3math-w11-q10
      type: multiple_choice
      topic_code: "3.OA.D.9"
      source: "IM K–5 Math Grade 3, Unit 3, Section D"
      points: 1
      prompt: |
        What number comes next in this pattern? 136, 146, 156, 166, ...
      options:
        - "167"
        - "176"
        - "266"
        - "170"
      option_explanations:
        - |
          167 adds 1. Each number in the pattern is 10 more than the one before.
        - |
          Correct. The rule is add 10: the tens digit goes up by 1 and the ones stay 6. 166 + 10 = 176.
        - |
          266 adds 100. The hundreds digit stays 1 in this pattern; only the tens digit changes.
        - |
          170 rounds 166 to the nearest ten. The pattern asks for 10 more than 166.
      answer: 1

    - slug: g3math-w11-q11
      type: multiple_choice
      topic_code: "3.NBT.A.1"
      source: "IM K–5 Math Grade 3, Unit 3, Section C"
      points: 1
      prompt: |
        Round 465 to the nearest ten and to the nearest hundred.
      options:
        - "460 and 400"
        - "470 and 400"
        - "470 and 500"
        - "500 and 500"
      option_explanations:
        - |
          465 is exactly halfway between 460 and 470, and halfway rounds up to 470. It is also past 450, so it rounds to 500.
        - |
          470 is right for the nearest ten. For the nearest hundred, 465 is past 450, so it rounds up to 500.
        - |
          Correct. Halfway 465 rounds up to 470. For hundreds, 465 is past 450, so it rounds to 500.
        - |
          500 is the nearest hundred, but the nearest ten must be a ten next to 465: 460 or 470.
      answer: 2

    - slug: g3math-w11-q12
      type: numeric
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section B"
      points: 1
      prompt: |
        What is 902 − 457?
      answer: { value: 445, tolerance: 0 }
      explanation: |
        Count up from 457: 3 to 460, 40 to 500, 400 to 900, 2 to 902. 3 + 40 + 400 + 2 = 445. Check: 445 + 457 = 902.

    - slug: g3math-w11-q13
      type: multiple_choice
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section B"
      points: 1
      prompt: |
        A rug is shaped like a rectangle. It is 7 feet long and 4 feet wide. What is its area?
      options:
        - "11 square feet"
        - "22 square feet"
        - "24 square feet"
        - "28 square feet"
      option_explanations:
        - |
          11 adds the two side lengths. Area multiplies them: 7 × 4.
        - |
          22 is the distance around the rug (7 + 4 + 7 + 4). Area is the space inside.
        - |
          24 is 6 × 4, one row short. The rug has 7 rows of 4 square feet, or 4 rows of 7.
        - |
          Correct. 7 × 4 = 28, so the rug covers 28 square feet.
      answer: 3

    - slug: g3math-w11-q14
      type: short_answer
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 3, Section D"
      points: 2
      prompt: |
        A gym has 4 shelves with 9 balls on each shelf. A coach brings 12 more balls.

        (a) Write an equation with a letter for the total number of balls.
        (b) Solve it. Show your steps.
      answer: |
        (a) 4 × 9 + 12 = b
        (b) 4 × 9 = 36, and 36 + 12 = 48, so b = 48 balls.
      explanation: |
        Two points.

        (a) 1 pt: a correct equation with a letter for the total, such as 4 × 9 + 12 = b or 9 + 9 + 9 + 9 + 12 = b.

        (b) 1 pt: 48 balls with both steps shown (36 balls on the shelves, then 36 + 12).
