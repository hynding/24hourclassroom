unit: 3
description: |
  20 questions · about 40 minutes · the whole of Unit 3: adding within 1,000 with base-ten blocks, by place and
  with regrouping; subtracting within 1,000 by decomposing, counting up or back and across zeros; rounding to the
  nearest ten and hundred and estimating; two-step story problems with tape diagrams and letters for unknowns;
  and odd and even patterns. Two stimulus sets share a number line or a tape diagram. Multiple choice,
  select-all, true/false and number answers are graded at once; the fill-in word is matched automatically; the
  two short answers are checked by your teacher against the scoring notes.
questions:
  # ---- Adding within 1,000 (Section A)
  - slug: g3math-u03-check-q01
    type: multiple_choice
    topic_code: "3.NBT.A.2"
    source: "IM K–5 Math Grade 3, Unit 3, Section A"
    points: 1
    figure: figures/u03-base-ten-blocks.svg
    figure_alt: "Base-ten blocks for two numbers. The top row shows 365: 3 flats, 6 rods and 5 small cubes. The bottom row shows 248: 2 flats, 4 rods and 8 small cubes. A key says cube = 1, rod = 10, flat = 100."
    prompt: |
      The blocks show 365 and 248. What is 365 + 248?
    options:
      - "503"
      - "513"
      - "613"
      - "603"
    option_explanations:
      - |
        503 keeps only the last digit in each place and never regroups. 13 ones make a new ten, and then 11 tens make a new hundred.
      - |
        513 regroups the 13 ones but not the 11 tens. 11 tens is 1 hundred and 1 ten, so there are 6 hundreds.
      - |
        Correct. 5 + 8 = 13 ones: 1 ten and 3 ones. 6 + 4 + 1 = 11 tens: 1 hundred and 1 ten. 3 + 2 + 1 = 6 hundreds. That is 613.
      - |
        603 regroups 10 tens into a hundred but forgets the ten made from the 13 ones, so the tens digit should be 1.
    answer: 2

  - slug: g3math-u03-check-q02
    type: numeric
    topic_code: "3.NBT.A.2"
    source: "IM K–5 Math Grade 3, Unit 3, Section A"
    points: 1
    prompt: |
      A zoo had 274 visitors in the morning and 568 visitors in the afternoon. How many visitors came that day?
    answer: { value: 842, tolerance: 0 }
    explanation: |
      274 + 568. Ones: 4 + 8 = 12, write 2 and regroup 1 ten. Tens: 7 + 6 + 1 = 14, write 4 and regroup 1 hundred. Hundreds: 2 + 5 + 1 = 8. That is 842 visitors.

  - slug: g3math-u03-check-q03
    type: multiple_choice
    topic_code: "3.NBT.A.2"
    source: "IM K–5 Math Grade 3, Unit 3, Section A"
    points: 1
    prompt: |
      Which has the same value as 429 + 199?
    options:
      - "429 + 200 − 1"
      - "429 + 200 + 1"
      - "429 + 100 − 1"
      - "430 + 200"
    option_explanations:
      - |
        Correct. 199 is 1 less than 200, so add 200 and take 1 away: 629 − 1 = 628.
      - |
        Adding 200 already adds 1 too many. Adding another 1 makes the answer 2 too big.
      - |
        199 is close to 200, not 100. Adding 100 leaves out a whole hundred.
      - |
        This adds 1 to 429 and 1 to 199. Both numbers got bigger, so the sum is 2 too big.
    answer: 0

  # ---- Subtracting within 1,000 (Section B)
  - slug: g3math-u03-check-q04
    type: numeric
    topic_code: "3.NBT.A.2"
    source: "IM K–5 Math Grade 3, Unit 3, Section B"
    points: 1
    prompt: |
      What is 731 − 465?
    answer: { value: 266, tolerance: 0 }
    explanation: |
      Break a ten: 11 − 5 = 6 ones. Now 2 tens is less than 6, so break a hundred: 12 − 6 = 6 tens. Hundreds: 6 − 4 = 2. The answer is 266. Check: 266 + 465 = 731.

  - slug: g3math-u03-check-q05
    type: multiple_choice
    topic_code: "3.NBT.A.2"
    source: "IM K–5 Math Grade 3, Unit 3, Section B"
    points: 1
    figure: figures/u03-number-line-back.svg
    figure_alt: "An open number line titled Jumping Back on an Open Number Line. It starts at 612 on the right. A jump labeled −300 goes back to 312, a jump labeled −40 goes back to 272, and a jump labeled −5 goes back to 267."
    prompt: |
      Which subtraction does the number line show?
    options:
      - "612 − 3 = 609"
      - "612 − 345 = 267"
      - "612 + 345 = 957"
      - "612 − 300 = 312"
    option_explanations:
      - |
        3 is the number of jumps. The jumps are worth 300, 40 and 5, so they take away 345 in all.
      - |
        Correct. Start at 612 and jump back 300, 40 and 5. That takes away 345 and lands on 267.
      - |
        The jumps go to the left, toward smaller numbers, so they show taking away, not adding.
      - |
        612 − 300 = 312 is only the first jump. Two more jumps go back to 267.
    answer: 1

  - slug: g3math-u03-check-q06
    type: multiple_choice
    topic_code: "3.NBT.A.2"
    source: "IM K–5 Math Grade 3, Unit 3, Section B"
    points: 1
    prompt: |
      A box holds 800 beads. Ella uses 263 beads for bracelets. How many beads are left?
    options:
      - "663"
      - "637"
      - "547"
      - "537"
    option_explanations:
      - |
        663 takes the smaller digit from the bigger in each place. 263 must come away from 800, so decompose first.
      - |
        637 decomposes but still uses 8 hundreds. After trading, only 7 hundreds are left, and 7 − 2 = 5.
      - |
        547 keeps 10 tens after one ten was broken into ones. Only 9 tens are left, and 9 − 6 = 3.
      - |
        Correct. 800 is 7 hundreds, 9 tens, 10 ones. 10 − 3 = 7, 9 − 6 = 3, 7 − 2 = 5, so 537. Check: 537 + 263 = 800.
    answer: 3

  - slug: g3math-u03-check-q07
    type: true_false
    topic_code: "3.NBT.A.2"
    source: "IM K–5 Math Grade 3, Unit 3, Section B"
    points: 1
    prompt: |
      True or false: 504 − 278 = 226, because 226 + 278 = 504.
    answer: true
    explanation: |
      True. 226 + 278: 6 + 8 = 14, 2 + 7 + 1 = 10, 2 + 2 + 1 = 5, so 504. Since adding back gives 504, the subtraction is right.

  - slug: g3math-u03-check-q08
    type: fill_blank
    topic_code: "3.NBT.A.2"
    source: "IM K–5 Math Grade 3, Unit 3, Section B"
    points: 1
    prompt: |
      To find 52 − 8, Omar breaks 1 ten into 10 ones so he has 12 ones. Breaking a ten apart like this is called decomposing, or you can say he ____ the ten.
    answer: ["regroups", "regrouped", "regroup", "decomposes", "decomposed", "trades", "traded", "breaks apart"]
    explanation: |
      Breaking 1 ten into 10 ones is regrouping (also called decomposing a ten). Then 12 − 8 = 4 and 4 tens are left: 52 − 8 = 44.

  # ---- Rounding and estimating (Section C); stimulus set
  - slug: g3math-u03-check-q09
    type: multiple_choice
    topic_code: "3.NBT.A.1"
    source: "IM K–5 Math Grade 3, Unit 3, Section C"
    points: 1
    stimulus: |
      Use the number line. It goes from 400 to 500 with a tick every 10, and the dot is at 437.
    figure: figures/u03-number-line-round.svg
    figure_alt: "A number line titled Where Is 437? It goes from 400 to 500 with a tick mark every 10. The ticks at 400, 450 and 500 are labeled and taller. A red dot labeled 437 sits between the 430 and 440 ticks, closer to 440."
    prompt: |
      What is 437 rounded to the nearest ten?
    options:
      - "430"
      - "440"
      - "400"
      - "500"
    option_explanations:
      - |
        430 is the ten below. 437 is past 435, the halfway point, so it is closer to 440.
      - |
        Correct. 437 is between 430 and 440 and past the halfway point 435, so it rounds up to 440.
      - |
        400 is the nearest hundred, not the nearest ten.
      - |
        500 is a hundred, and 437 is not even close to it: it is less than the halfway mark 450.
    answer: 1

  - slug: g3math-u03-check-q10
    type: numeric
    topic_code: "3.NBT.A.1"
    source: "IM K–5 Math Grade 3, Unit 3, Section C"
    points: 1
    stimulus: |
      Use the number line. It goes from 400 to 500 with a tick every 10, and the dot is at 437.
    prompt: |
      What is 437 rounded to the nearest hundred?
    answer: { value: 400, tolerance: 0 }
    explanation: |
      437 is between 400 and 500. It is to the left of the halfway mark at 450, so it is closer to 400. (Round 437 itself, not 440.)

  - slug: g3math-u03-check-q11
    type: numeric
    topic_code: "3.NBT.A.1"
    source: "IM K–5 Math Grade 3, Unit 3, Section C"
    points: 1
    prompt: |
      Round 795 to the nearest ten.
    answer: { value: 800, tolerance: 0 }
    explanation: |
      795 is exactly halfway between 790 and 800. A halfway number rounds up, so 795 rounds to 800.

  - slug: g3math-u03-check-q12
    type: multiple_choice
    topic_code: "3.NBT.A.1"
    source: "IM K–5 Math Grade 3, Unit 3, Section C"
    points: 1
    prompt: |
      A theater sold 382 tickets on Friday and 427 tickets on Saturday. Round each number to the nearest hundred. About how many tickets did it sell in all?
    options:
      - "809"
      - "700"
      - "800"
      - "900"
    option_explanations:
      - |
        809 is the exact sum. The question asks for an estimate with rounded numbers: 400 + 400.
      - |
        700 rounds 382 down to 300. 382 is past 350, so it rounds up to 400.
      - |
        Correct. 382 rounds to 400 and 427 rounds to 400, so about 400 + 400 = 800 tickets.
      - |
        900 rounds 427 up to 500. 427 is less than 450, so it rounds down to 400.
    answer: 2

  - slug: g3math-u03-check-q13
    type: multi_select
    topic_code: "3.NBT.A.1"
    source: "IM K–5 Math Grade 3, Unit 3, Section C"
    points: 2
    partial_credit: true
    prompt: |
      Which numbers round to 350 when you round to the nearest ten? Select all that apply.
    options:
      - "344"
      - "345"
      - "355"
      - "349"
      - "354"
    option_explanations:
      - |
        No. 344 is between 340 and 350 but under the halfway number 345, so it rounds to 340.
      - |
        Yes. 345 is exactly halfway between 340 and 350, and halfway numbers round up to 350.
      - |
        No. 355 is exactly halfway between 350 and 360, so it rounds up to 360.
      - |
        Yes. 349 is between 340 and 350 and only 1 away from 350.
      - |
        Yes. 354 is between 350 and 360 and under the halfway number 355, so it rounds down to 350.
    answer: [1, 3, 4]

  # ---- Two-step problems (Section D); stimulus set
  - slug: g3math-u03-check-q14
    type: multiple_choice
    topic_code: "3.OA.D.8"
    source: "IM K–5 Math Grade 3, Unit 3, Section D"
    points: 1
    stimulus: |
      A garden club planted 136 tulips and 158 daffodils. Then they planted some sunflowers, s. They planted 400 flowers in all. Use the tape diagram.
    figure: figures/u03-tape-diagram.svg
    figure_alt: "A tape diagram titled Flowers Planted. A bracket over the whole bar is labeled 400. The bar has three parts: 136, then 158, then a part labeled s."
    prompt: |
      Which equation can you use to find s?
    options:
      - "400 + 136 + 158 = s"
      - "400 − 136 = s"
      - "136 + s = 158"
      - "136 + 158 + s = 400"
    option_explanations:
      - |
        400 is the whole, not a part. Adding the whole to the parts gives a number bigger than all the flowers.
      - |
        400 − 136 takes away only the tulips. The 158 daffodils must be taken away too.
      - |
        This leaves out the 400 flowers in all. The bar shows 136, 158 and s together making 400.
      - |
        Correct. The three parts of the bar, 136, 158 and s, make the whole, 400.
    answer: 3

  - slug: g3math-u03-check-q15
    type: numeric
    topic_code: "3.OA.D.8"
    source: "IM K–5 Math Grade 3, Unit 3, Section D"
    points: 1
    stimulus: |
      A garden club planted 136 tulips and 158 daffodils. Then they planted some sunflowers, s. They planted 400 flowers in all. Use the tape diagram.
    prompt: |
      How many sunflowers did they plant?
    answer: { value: 106, tolerance: 0 }
    explanation: |
      Step 1: 136 + 158 = 294 tulips and daffodils. Step 2: 400 − 294 = 106 sunflowers. Check: 136 + 158 + 106 = 400.

  - slug: g3math-u03-check-q16
    type: multiple_choice
    topic_code: "3.OA.D.8"
    source: "IM K–5 Math Grade 3, Unit 3, Section D"
    points: 1
    prompt: |
      Mateo has 5 bags with 6 marbles in each bag. He finds 9 more marbles. The letter m stands for his total. Which equation shows m?
    options:
      - "5 + 6 + 9 = m"
      - "5 × 9 + 6 = m"
      - "6 × 6 + 9 = m"
      - "5 × 6 + 9 = m"
    option_explanations:
      - |
        This adds the number of bags. 5 bags of 6 marbles is 5 × 6 = 30 marbles, not 5 + 6.
      - |
        This mixes up the numbers. Each bag holds 6, and the 9 marbles he found are extra.
      - |
        6 × 6 would mean 6 bags. Mateo has 5 bags of 6.
      - |
        Correct. 5 bags of 6 is 5 × 6 = 30, and 9 more makes 30 + 9 = 39. So m = 39.
    answer: 3

  - slug: g3math-u03-check-q17
    type: multiple_choice
    topic_code: "3.OA.D.8"
    source: "IM K–5 Math Grade 3, Unit 3, Section D"
    points: 1
    prompt: |
      Ana says 618 + 295 = 813. Is her answer reasonable?
    options:
      - "Yes, because 600 + 200 = 800, which is close to 813."
      - "No, because 600 + 300 = 900, and 813 is about 100 away from 900."
      - "Yes, because 813 is bigger than both 618 and 295."
      - "No, because the sum should be less than 618."
    option_explanations:
      - |
        295 is close to 300, not 200. With the right rounding, the estimate is 900.
      - |
        Correct. 618 rounds to 600 and 295 rounds to 300, so the sum is about 900. The exact sum is 913, so 813 is not reasonable.
      - |
        A sum is bigger than each addend, but that does not show it is the right size. The estimate 900 shows 813 is too small.
      - |
        Adding makes a number bigger, so the sum must be more than 618.
    answer: 1

  - slug: g3math-u03-check-q18
    type: multiple_choice
    topic_code: "3.OA.D.9"
    source: "IM K–5 Math Grade 3, Unit 3, Section D"
    points: 1
    prompt: |
      Kai adds an even number and an odd number. What kind of number is the sum?
    options:
      - "Always odd"
      - "Always even"
      - "Sometimes even and sometimes odd"
      - "Always a number that ends in 0"
    option_explanations:
      - |
        Correct. The even number is all pairs, and the odd number has 1 left over, so the sum has 1 left over too: 8 + 5 = 13.
      - |
        Two odd numbers or two even numbers make an even sum. Even + odd always leaves 1 over: 12 + 7 = 19.
      - |
        It never changes. Every example, like 4 + 3 = 7 or 20 + 11 = 31, is odd.
      - |
        A number ending in 0 is even. 6 + 5 = 11 ends in 1, so the sum is odd.
    answer: 0

  # ---- Short answers
  - slug: g3math-u03-check-q19
    type: short_answer
    topic_code: "3.OA.D.8"
    source: "IM K–5 Math Grade 3, Unit 3, Section D"
    points: 3
    prompt: |
      A library had 520 books on its shelves. It lent out 165 books in the morning and 148 books in the afternoon.

      (a) Write an equation with a letter for the number of books still on the shelves.
      (b) Solve it. Show your steps.
      (c) Use rounding to the nearest hundred to show your answer is reasonable.
    answer: |
      (a) 520 − 165 − 148 = b (or 165 + 148 + b = 520).
      (b) 520 − 165 = 355, then 355 − 148 = 207. So b = 207 books.
      (c) 520 rounds to 500, 165 to 200 and 148 to 100. 500 − 200 − 100 = 200, and 207 is close to 200.
    explanation: |
      Three points.

      (a) 1 pt: a correct equation with a letter for the unknown.

      (b) 1 pt: 207 books with both steps shown (two subtractions, or adding 165 + 148 = 313 and then 520 − 313 = 207).

      (c) 1 pt: rounds all three numbers correctly, finds an estimate of 200 and compares it with the answer.

  - slug: g3math-u03-check-q20
    type: short_answer
    topic_code: "3.NBT.A.2"
    source: "IM K–5 Math Grade 3, Unit 3, Section B"
    points: 2
    prompt: |
      (a) Find 603 − 247. Show your work.
      (b) Explain how you decomposed when there were not enough ones or tens.
    answer: |
      (a) 356. 603 becomes 5 hundreds, 9 tens and 13 ones. 13 − 7 = 6, 9 − 4 = 5, 5 − 2 = 3.
      (b) There were only 3 ones and 0 tens, so I broke 1 hundred into 10 tens, then broke 1 of those tens into 10 ones. Check: 356 + 247 = 603.
    explanation: |
      Two points.

      (a) 1 pt: 356 with work shown (decomposing, counting up 3 + 50 + 300 + 3, or a number line).

      (b) 1 pt: explains trading a hundred for tens and a ten for ones (or the counting-up jumps), so that each place has enough to take away.
