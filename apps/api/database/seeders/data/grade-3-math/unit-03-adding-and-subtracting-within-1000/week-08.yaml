week: 8
unit: 3
title: "Adding Within 1,000 Using Place Value"
topics: ["3.NBT.A.2"]
guide: guides/week-08.md
guide_description: |
  How to add three-digit numbers by thinking about hundreds, tens and ones: base-ten blocks, adding place by
  place, jumps on an open number line, making a hundred, and the standard way of writing it with regrouping.
flashcards_description: |
  19 cards on place value, base-ten blocks, regrouping 10 ones as a ten and 10 tens as a hundred, adding by
  place, number-line jumps, shortcuts like adding 99, and checking a sum.

flashcards:
  - front: Place value → what it means
    back: |
      The value of a digit depends on its place. In 352, the 3 means 3 hundreds (300), the 5 means 5 tens (50) and the 2 means 2 ones.
    topic_code: "3.NBT.A.2"
  - front: Base-ten blocks → the three sizes
    back: |
      A small cube is 1, a rod is 10 and a flat is 100. Ten cubes make a rod, and ten rods make a flat.
    topic_code: "3.NBT.A.2"
  - front: Expanded form → what it is
    back: |
      Writing a number as the sum of its place values: 472 = 400 + 70 + 2.
    topic_code: "3.NBT.A.2"
  - front: Sum → what it means
    back: |
      The answer to an addition problem. In 300 + 45 = 345, the sum is 345.
    topic_code: "3.NBT.A.2"
  - front: Addend → what it means
    back: |
      One of the numbers you add. In 128 + 50 = 178, the addends are 128 and 50.
    topic_code: "3.NBT.A.2"
  - front: Regrouping 10 ones → what you make
    back: |
      1 ten. 8 ones + 7 ones = 15 ones, which is 1 ten and 5 ones.
    topic_code: "3.NBT.A.2"
  - front: Regrouping 10 tens → what you make
    back: |
      1 hundred. 6 tens + 5 tens = 11 tens, which is 1 hundred and 1 ten.
    topic_code: "3.NBT.A.2"
  - front: Adding by place → 245 + 132
    back: |
      Hundreds 200 + 100 = 300, tens 40 + 30 = 70, ones 5 + 2 = 7. Put them together: 377.
    topic_code: "3.NBT.A.2"
  - front: Adding by place with regrouping → 368 + 254
    back: |
      300 + 200 = 500, 60 + 50 = 110, 8 + 4 = 12. Then 500 + 110 + 12 = 622.
    topic_code: "3.NBT.A.2"
  - front: Open number line → 427 + 150
    back: |
      Start at 427. Jump 100 to 527, then jump 50 to 577.
    topic_code: "3.NBT.A.2"
  - front: Adding 99 → a shortcut
    back: |
      Add 100, then take 1 away. 356 + 99: 456 − 1 = 455.
    topic_code: "3.NBT.A.2"
  - front: Making a hundred → 197 + 46
    back: |
      Move 3 from 46 over to 197. Now it is 200 + 43 = 243. The total stays the same.
    topic_code: "3.NBT.A.2"
  - front: Standard algorithm for addition → the steps
    back: |
      Line up the digits by place. Add the ones, then the tens, then the hundreds. When a place adds to 10 or more, regroup into the next place.
    topic_code: "3.NBT.A.2"
  - front: Little 1 above the tens → what it means
    back: |
      It is the new ten you made from 10 ones. Add it in with the other tens.
    topic_code: "3.NBT.A.2"
  - front: 10 hundreds → equal to
    back: |
      1 thousand, written 1,000. That is the biggest sum we work with in this unit.
    topic_code: "3.NBT.A.2"
  - front: Checking a sum → two ways
    back: |
      Add in a different order, or estimate. 298 + 405 should be close to 300 + 400 = 700, and the exact sum is 703.
    topic_code: "3.NBT.A.2"
  - front: Changing the order of addends → what happens to the sum
    back: |
      Nothing. 145 + 260 and 260 + 145 are both 405.
    topic_code: "3.NBT.A.2"
  - front: The 0 in 507 → what it tells you
    back: |
      There are no tens. 507 = 500 + 7, but the tens place still needs its 0 so the 5 stays in the hundreds place.
    topic_code: "3.NBT.A.2"
  - front: Adding hundreds → 400 + 300
    back: |
      Think 4 hundreds + 3 hundreds = 7 hundreds, which is 700. It works just like 4 + 3 = 7.
    topic_code: "3.NBT.A.2"

quiz:
  description: |
    13 questions · about 25 minutes · adding within 1,000 with base-ten blocks, by place, on an open number line
    and with regrouping, plus review of bar graphs. Multiple choice, select-all, true/false and number answers are
    graded at once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w08-q01
      type: multiple_choice
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section A"
      points: 1
      figure: figures/w08-base-ten-sum.svg
      figure_alt: "Base-ten blocks for two numbers. The top row shows 258: 2 flats, 5 rods and 8 small cubes. The bottom row shows 167: 1 flat, 6 rods and 7 small cubes. A key says cube = 1, rod = 10, flat = 100."
      prompt: |
        The blocks show 258 and 167. Put them together. What is the sum?
      options:
        - "315"
        - "325"
        - "425"
        - "415"
      option_explanations:
        - |
          315 keeps only the last digit of each place: 15 ones became 5 and 11 tens became 1. Those extra ten and hundred must be regrouped and added on.
        - |
          325 regroups the 15 ones into a ten but forgets to regroup the 12 tens. 12 tens is 1 hundred and 2 tens, so there are 4 hundreds.
        - |
          Correct. 8 + 7 = 15 ones, which is 1 ten and 5 ones. 5 + 6 + 1 = 12 tens, which is 1 hundred and 2 tens. 2 + 1 + 1 = 4 hundreds. That is 425.
        - |
          415 regroups the tens into a hundred but forgets the new ten made from the 15 ones. With it there are 12 tens, so the tens digit is 2.
      answer: 2

    - slug: g3math-w08-q02
      type: multiple_choice
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section A"
      points: 1
      prompt: |
        Mei adds 536 + 248 place by place. She writes 500 + 200 = 700, 30 + 40 = 70 and 6 + 8 = 14. What is the sum?
      options:
        - "784"
        - "774"
        - "7,714"
        - "884"
      option_explanations:
        - |
          Correct. Add the three parts: 700 + 70 + 14 = 784. The 14 is 1 ten and 4 ones, so the tens become 8.
        - |
          774 drops the ten inside 14. 14 is 10 + 4, so the tens grow from 70 to 80, and the sum is 784.
        - |
          7,714 writes the three parts side by side. The parts must be added together: 700 + 70 + 14 = 784.
        - |
          884 puts the extra 1 in the hundreds place. The 1 from 14 is a ten, not a hundred, so it goes with the tens.
      answer: 0

    - slug: g3math-w08-q03
      type: numeric
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section A"
      points: 1
      prompt: |
        A school library has 609 picture books and 287 chapter books. How many books is that in all?
      answer: { value: 896, tolerance: 0 }
      explanation: |
        609 + 287. Ones: 9 + 7 = 16, so write 6 and regroup 1 ten. Tens: 0 + 8 + 1 = 9. Hundreds: 6 + 2 = 8. The library has 896 books.

    - slug: g3math-w08-q04
      type: multiple_choice
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section A"
      points: 1
      figure: figures/w08-number-line-jumps.svg
      figure_alt: "An open number line. It starts at 348. A jump labeled +200 goes to 548, a jump labeled +30 goes to 578, and a jump labeled +5 goes to 583."
      prompt: |
        Which addition does the number line show?
      options:
        - "348 + 3 = 351"
        - "348 + 583 = 931"
        - "348 + 200 = 548"
        - "348 + 235 = 583"
      option_explanations:
        - |
          3 is how many jumps there are. The jumps are worth 200, 30 and 5, so together they add 235, not 3.
        - |
          583 is where the jumps end, not how much was added. The jumps add 200 + 30 + 5 = 235 to 348.
        - |
          348 + 200 = 548 is only the first jump. There are two more jumps, +30 and +5, that end at 583.
        - |
          Correct. Start at 348 and jump 200, 30 and 5. That adds 235 in all and lands on 583.
      answer: 3

    - slug: g3math-w08-q05
      type: fill_blank
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section A"
      points: 1
      prompt: |
        Jonah has 15 ones. He trades 10 of them for 1 ten. When you trade 10 ones for 1 ten, you ____.
      answer: ["regroup", "regrouped", "regrouping", "compose a ten", "make a ten", "trade", "exchange"]
      explanation: |
        Trading 10 ones for 1 ten is called regrouping (some books say composing a ten). 15 ones become 1 ten and 5 ones.

    - slug: g3math-w08-q06
      type: true_false
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section A"
      points: 1
      prompt: |
        True or false: 465 + 99 = 564.
      answer: true
      explanation: |
        True. Adding 99 is like adding 100 and then taking 1 away. 465 + 100 = 565, and 565 − 1 = 564.

    - slug: g3math-w08-q07
      type: multi_select
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section A"
      points: 2
      partial_credit: true
      prompt: |
        Which are equal to 375 + 248? Select all that apply.
      options:
        - "500 + 110 + 13"
        - "500 + 11 + 13"
        - "248 + 375"
        - "300 + 200 + 70 + 40 + 5 + 8"
        - "613"
      option_explanations:
        - |
          Yes. 300 + 200 = 500, 70 + 40 = 110 and 5 + 8 = 13. These are the partial sums, and they add to 623.
        - |
          No. 70 + 40 is 110, not 11. Writing 11 loses the value of the tens, so this adds to only 524.
        - |
          Yes. Changing the order of the addends does not change the sum. Both are 623.
        - |
          Yes. This is both numbers written in expanded form. It adds to 500 + 110 + 13 = 623.
        - |
          No. 613 forgets the ten made from 5 + 8 = 13 ones. The correct sum is 623.
      answer: [0, 2, 3]

    - slug: g3math-w08-q08
      type: multiple_choice
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section A"
      points: 1
      prompt: |
        Ravi finds 298 + 145 by thinking 300 + 143 instead. Why does that give the same answer?
      options:
        - "He added 2 to both numbers, so the sum stays the same."
        - "He moved 2 from 145 over to 298, so the total did not change."
        - "He rounded both numbers to the nearest hundred."
        - "He took 2 away from both numbers."
      option_explanations:
        - |
          He did not add 2 to 145; he took 2 away from it. Adding 2 to both numbers would make the sum 4 bigger.
        - |
          Correct. 298 got 2 more and 145 got 2 fewer. Nothing was added or lost, so 300 + 143 = 443 is the same as 298 + 145.
        - |
          Rounding 145 to the nearest hundred would give 100, not 143. Ravi kept exact numbers, so his answer is exact.
        - |
          298 became 300, which is 2 more, not 2 less. Only 145 lost 2.
      answer: 1

    - slug: g3math-w08-q09
      type: numeric
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section A"
      points: 1
      prompt: |
        On Saturday, 457 people visited the science museum. On Sunday, 386 people visited. How many people visited on the two days together?
      answer: { value: 843, tolerance: 0 }
      explanation: |
        457 + 386. Ones: 7 + 6 = 13, write 3 and regroup 1 ten. Tens: 5 + 8 + 1 = 14, write 4 and regroup 1 hundred. Hundreds: 4 + 3 + 1 = 8. The answer is 843 people.

    - slug: g3math-w08-q10
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the bar graph "Cans Collected for the Food Drive". The scale counts by 50s.
      figure: figures/w08-cans-bar-graph.svg
      figure_alt: "A bar graph titled Cans Collected for the Food Drive. The side scale is labeled Number of cans and goes 0, 50, 100, 150, 200, 250, 300, 350, 400. The Room 10 bar reaches 150, the Room 11 bar reaches 250 and the Room 12 bar reaches 350."
      prompt: |
        How many cans did Room 12 collect?
      options:
        - "7"
        - "250"
        - "300"
        - "350"
      option_explanations:
        - |
          7 counts the grid lines up to the top of the bar. Each line is worth 50 cans, so count by 50s: 50, 100, ... 350.
        - |
          250 is where the Room 11 bar ends. The Room 12 bar is two lines taller.
        - |
          300 is one line too low. The top of the Room 12 bar lines up with 350 on the scale.
        - |
          Correct. The top of the Room 12 bar lines up with 350 on the scale.
      answer: 3

    - slug: g3math-w08-q11
      type: numeric
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the bar graph "Cans Collected for the Food Drive". The scale counts by 50s.
      prompt: |
        How many cans did Room 10 and Room 11 collect together?
      answer: { value: 400, tolerance: 0 }
      explanation: |
        Room 10 collected 150 and Room 11 collected 250. 150 + 250: 5 tens + 5 tens = 10 tens, which is 1 hundred, so 100 + 200 + 100 = 400 cans.

    - slug: g3math-w08-q12
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the bar graph "Cans Collected for the Food Drive". The scale counts by 50s.
      prompt: |
        How many cans did all three rooms collect in all?
      options:
        - "650"
        - "15"
        - "750"
        - "350"
      option_explanations:
        - |
          650 forgets to regroup. 5 + 5 + 5 = 15 tens, which is 1 hundred and 5 tens, so there are 7 hundreds, not 6.
        - |
          15 adds the grid lines (3 + 5 + 7). Each line stands for 50 cans, so the amounts are 150, 250 and 350.
        - |
          Correct. 150 + 250 + 350 = 750 cans. The tens make 15 tens, which is 1 hundred and 5 tens.
        - |
          350 is only Room 12, the tallest bar. The question asks for all three rooms added together.
      answer: 2

    - slug: g3math-w08-q13
      type: short_answer
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section A"
      points: 2
      prompt: |
        (a) Find 486 + 237. Show your work.
        (b) Explain where you had to regroup.
      answer: |
        (a) 723. Ones: 6 + 7 = 13, write 3 and regroup 1 ten. Tens: 8 + 3 + 1 = 12, write 2 and regroup 1 hundred. Hundreds: 4 + 2 + 1 = 7.
        (b) I regrouped twice: 13 ones made 1 ten and 3 ones, and 12 tens made 1 hundred and 2 tens.
      explanation: |
        Two points.

        (a) 1 pt: 723 with work shown (the standard algorithm, partial sums 600 + 110 + 13, or number-line jumps).

        (b) 1 pt: names both regroupings: 10 ones into a ten and 10 tens into a hundred. A base-ten drawing that shows both trades also earns the point.
