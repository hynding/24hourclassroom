week: 9
unit: 3
title: "Subtracting Within 1,000"
topics: ["3.NBT.A.2"]
guide: guides/week-09.md
guide_description: |
  How to subtract three-digit numbers: taking away by place, decomposing a ten or a hundred when a place does not
  have enough, counting up or back on an open number line, subtracting across zeros, and checking with addition.
flashcards_description: |
  19 cards on the word difference, decomposing a ten or a hundred, subtracting by place, counting up and counting
  back, subtracting across zeros, the "smaller from bigger" mistake, and checking a subtraction with addition.

flashcards:
  - front: Difference → what it means
    back: |
      The answer to a subtraction problem. In 500 − 120 = 380, the difference is 380.
    topic_code: "3.NBT.A.2"
  - front: Decomposing a ten → when you need it
    back: |
      When there are not enough ones to take away. For 52 − 7, break 1 ten into 10 ones: 4 tens and 12 ones. 12 − 7 = 5, so the answer is 45.
    topic_code: "3.NBT.A.2"
  - front: Decomposing a hundred → 425 − 160
    back: |
      2 tens is not enough to take 6 tens. Break 1 hundred into 10 tens: 3 hundreds, 12 tens, 5 ones. 12 − 6 = 6 tens and 3 − 1 = 2 hundreds, so 265.
    topic_code: "3.NBT.A.2"
  - front: Subtracting by place → 789 − 352
    back: |
      700 − 300 = 400, 80 − 50 = 30, 9 − 2 = 7. Put them together: 437.
    topic_code: "3.NBT.A.2"
  - front: Counting up to subtract → 403 − 278
    back: |
      Start at 278. Jump 2 to 280, 20 to 300 and 103 to 403. The jumps add to 2 + 20 + 103 = 125.
    topic_code: "3.NBT.A.2"
  - front: Counting back on a number line → 634 − 210
    back: |
      Start at 634. Jump back 200 to 434, then back 10 to 424.
    topic_code: "3.NBT.A.2"
  - front: Subtracting 99 → a shortcut
    back: |
      Subtract 100, then add 1 back. 512 − 99: 412 + 1 = 413.
    topic_code: "3.NBT.A.2"
  - front: Addition and subtraction → how they are related
    back: |
      They undo each other. If 600 − 245 = 355, then 355 + 245 = 600.
    topic_code: "3.NBT.A.2"
  - front: Checking a subtraction → how
    back: |
      Add your answer to the number you took away. You should get back the number you started with.
    topic_code: "3.NBT.A.2"
  - front: Subtracting across zeros → 500 − 136
    back: |
      There are no tens or ones to break. Trade 1 hundred for 10 tens, then 1 ten for 10 ones: 4 hundreds, 9 tens, 10 ones. 500 − 136 = 364.
    topic_code: "3.NBT.A.2"
  - front: '"Smaller from bigger" mistake → 352 − 117'
    back: |
      Doing 7 − 2 in the ones is wrong: the top is 2, so you must take 7 from 2. Decompose a ten first: 12 − 7 = 5. The answer is 235.
    topic_code: "3.NBT.A.2"
  - front: Same change to both numbers → 342 − 198
    back: |
      Add 2 to both: 344 − 200 = 144. When both numbers move the same amount, the difference stays the same.
    topic_code: "3.NBT.A.2"
  - front: '"How many more" story → which operation'
    back: |
      Subtract (or count up). Zara has 410 stickers and Tom has 250: 410 − 250 = 160 more.
    topic_code: "3.NBT.A.2"
  - front: '"How many are left" story → which operation'
    back: |
      Subtract. A garden has 320 seeds and 140 are planted: 320 − 140 = 180 seeds are left.
    topic_code: "3.NBT.A.2"
  - front: Standard algorithm for subtraction → where to start
    back: |
      Line up the places and start with the ones. If the top digit is smaller, decompose from the next place first.
    topic_code: "3.NBT.A.2"
  - front: 1 hundred → how many tens
    back: |
      10 tens. And 1 ten is 10 ones. That is why you can break a hundred or a ten apart to subtract.
    topic_code: "3.NBT.A.2"
  - front: Addition and subtraction family → 245 + 155 = 400
    back: |
      155 + 245 = 400, 400 − 245 = 155 and 400 − 155 = 245. One picture, four equations.
    topic_code: "3.NBT.A.2"
  - front: Difference on a number line → what it is
    back: |
      The distance between the two numbers. 430 and 470 are 40 apart, so 470 − 430 = 40.
    topic_code: "3.NBT.A.2"
  - front: Taking away blocks → 456 − 231
    back: |
      Start with 4 flats, 5 rods, 6 cubes. Take away 2 flats, 3 rods, 1 cube. Left: 2 flats, 2 rods, 5 cubes = 225.
    topic_code: "3.NBT.A.2"

quiz:
  description: |
    13 questions · about 25 minutes · subtracting within 1,000 with base-ten blocks, by place, on an open number
    line and across zeros, checking with addition, plus review of area, unknown factors and picture graphs.
    Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word is matched
    automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w09-q01
      type: multiple_choice
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section B"
      points: 1
      stimulus: |
        Kiran shows 431 with base-ten blocks. He wants to take away 217.
      figure: figures/w09-blocks-431.svg
      figure_alt: "Base-ten blocks showing 431: 4 flats, 3 rods and 1 small cube. A key says cube = 1, rod = 10, flat = 100."
      prompt: |
        What should Kiran do first?
      options:
        - "Trade 1 flat for 10 rods."
        - "Trade 1 rod for 10 cubes, so he has 11 cubes."
        - "Take the 1 cube away from 7 and write 6 in the ones."
        - "Take away 7 rods instead of 7 cubes."
      option_explanations:
        - |
          There are 3 rods and he only needs to take 1 ten, so he has enough tens. The problem is the ones: 1 cube is not enough to take away 7.
        - |
          Correct. He has only 1 cube and needs to take away 7, so he breaks 1 rod into 10 cubes. Now he has 11 cubes and 2 rods.
        - |
          That subtracts the wrong way. The 7 must come away from the 1 he has, so he needs more cubes first.
        - |
          The 7 in 217 means 7 ones, so 7 cubes must be taken away. Rods are tens.
      answer: 1

    - slug: g3math-w09-q02
      type: numeric
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section B"
      points: 1
      stimulus: |
        Kiran shows 431 with base-ten blocks. He wants to take away 217.
      prompt: |
        What is 431 − 217?
      answer: { value: 214, tolerance: 0 }
      explanation: |
        Break 1 ten into 10 ones: 4 hundreds, 2 tens, 11 ones. Ones: 11 − 7 = 4. Tens: 2 − 1 = 1. Hundreds: 4 − 2 = 2. The answer is 214. Check: 214 + 217 = 431.

    - slug: g3math-w09-q03
      type: multiple_choice
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section B"
      points: 1
      prompt: |
        Lucía finds 352 − 117 and gets 245. What mistake did she make?
      options:
        - "In the ones she took 2 from 7 instead of decomposing a ten."
        - "She added the numbers instead of subtracting them."
        - "She forgot to subtract the hundreds."
        - "In the tens she should have written 5 − 1 = 3."
      option_explanations:
        - |
          Correct. The top ones digit is 2, so 7 cannot come away. She should break a ten: 12 − 7 = 5, 4 − 1 = 3 tens, 3 − 1 = 2 hundreds, which gives 235.
        - |
          Adding would give 469, which is far from 245. Her answer shows subtraction with a mistake in one place.
        - |
          Her hundreds digit is 2, and 3 − 1 = 2, so she did subtract the hundreds.
        - |
          5 − 1 is 4, not 3. The tens should be 3 only after a ten is decomposed for the ones, which is the step she skipped.
      answer: 0

    - slug: g3math-w09-q04
      type: multiple_choice
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section B"
      points: 1
      figure: figures/w09-count-up-number-line.svg
      figure_alt: "An open number line titled Counting Up From 286 to 523. A jump labeled +14 goes from 286 to 300, a jump labeled +200 goes from 300 to 500, and a jump labeled +23 goes from 500 to 523."
      prompt: |
        Amara counts up from 286 to 523 to find 523 − 286. What is the difference?
      options:
        - "3"
        - "809"
        - "363"
        - "237"
      option_explanations:
        - |
          3 is the number of jumps. The difference is how far she jumped in all: 14 + 200 + 23.
        - |
          809 adds 523 and 286. Counting up finds how far apart they are, which is a subtraction.
        - |
          363 comes from taking the smaller digit from the bigger in every place. Decomposing is needed, and the jumps show the real distance is 237.
        - |
          Correct. 14 + 200 + 23 = 237, so 523 − 286 = 237. Check: 286 + 237 = 523.
      answer: 3

    - slug: g3math-w09-q05
      type: numeric
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section B"
      points: 1
      prompt: |
        A farm stand had 600 apples. It sold 348 of them. How many apples are left?
      answer: { value: 252, tolerance: 0 }
      explanation: |
        600 − 348. Count up: 348 + 2 = 350, 350 + 50 = 400, 400 + 200 = 600. The jumps make 2 + 50 + 200 = 252 apples. Check: 252 + 348 = 600.

    - slug: g3math-w09-q06
      type: fill_blank
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section B"
      points: 1
      prompt: |
        In 700 − 250 = 450, the number 450 is called the ____.
      answer: ["difference", "the difference"]
      explanation: |
        The answer to a subtraction problem is the difference. It tells how far apart 700 and 250 are.

    - slug: g3math-w09-q07
      type: true_false
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section B"
      points: 1
      prompt: |
        True or false: to check 715 − 382 = 333, you can add 333 + 382 and see if you get 715.
      answer: true
      explanation: |
        True. Addition undoes subtraction. 333 + 382 = 715, so the subtraction is right.

    - slug: g3math-w09-q08
      type: multi_select
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which are equal to 704 − 296? Select all that apply.
      options:
        - "704 − 300 − 4"
        - "708 − 300"
        - "704 − 300 + 4"
        - "592"
        - "408"
      option_explanations:
        - |
          No. Taking away 300 takes away 4 too many, so you must add 4 back, not take away 4 more. This equals 400.
        - |
          Yes. Adding 4 to both numbers keeps the difference the same: 708 − 300 = 408.
        - |
          Yes. 300 is 4 more than 296, so subtract 300 and add the extra 4 back: 404 + 4 = 408.
        - |
          No. 592 comes from taking the smaller digit from the bigger in each place. The real difference is 408.
        - |
          Yes. 704 − 296 = 408. Check: 408 + 296 = 704.
      answer: [1, 2, 4]

    - slug: g3math-w09-q09
      type: multiple_choice
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section B"
      points: 1
      prompt: |
        The school has 500 stickers for a reading prize. It gives out 136. How many stickers are left?
      options:
        - "436"
        - "464"
        - "364"
        - "374"
      option_explanations:
        - |
          436 takes the smaller digit from the bigger in each place (6 − 0, 3 − 0, 5 − 1). You must take 136 away from 500, so decompose first.
        - |
          464 decomposes a hundred but still uses 5 in the hundreds. After trading, only 4 hundreds are left, and 4 − 1 = 3.
        - |
          Correct. Trade to get 4 hundreds, 9 tens, 10 ones. 10 − 6 = 4, 9 − 3 = 6, 4 − 1 = 3. That is 364, and 364 + 136 = 500.
        - |
          374 keeps 10 tens after one ten was already broken into ones. There are only 9 tens left, and 9 − 3 = 6.
      answer: 2

    - slug: g3math-w09-q10
      type: multiple_choice
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section B"
      points: 1
      figure: figures/w09-garden-grid.svg
      figure_alt: "A rectangle titled Vegetable Garden, covered by a grid of squares with 8 squares across and 6 squares down. A key says one square = 1 square foot."
      prompt: |
        What is the area of the vegetable garden?
      options:
        - "28 square feet"
        - "14 square feet"
        - "42 square feet"
        - "48 square feet"
      option_explanations:
        - |
          28 is the distance around the garden (8 + 6 + 8 + 6). Area counts the squares inside.
        - |
          14 adds the side lengths, 8 + 6. Area multiplies them: 6 rows of 8 squares.
        - |
          42 is 7 rows of 6 or 6 rows of 7, which is one row or column off. The grid has 6 rows of 8.
        - |
          Correct. There are 6 rows with 8 squares in each, and 6 × 8 = 48 square feet.
      answer: 3

    - slug: g3math-w09-q11
      type: numeric
      topic_code: "3.OA.A.4"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      prompt: |
        What number makes this equation true? 6 × ? = 42
      answer: { value: 7, tolerance: 0 }
      explanation: |
        Think: 6 groups of what make 42? Count by 6s: 6, 12, 18, 24, 30, 36, 42. That is 7 sixes, so 6 × 7 = 42.

    - slug: g3math-w09-q12
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      prompt: |
        On a picture graph, one star stands for 10 visitors. The Monday row has 7 stars and the Tuesday row has 4 stars. How many more visitors came on Monday than on Tuesday?
      options:
        - "3"
        - "30"
        - "110"
        - "70"
      option_explanations:
        - |
          3 is how many more stars Monday has. Each star is 10 visitors, so 3 stars stand for 30 visitors.
        - |
          Correct. Monday is 70 visitors and Tuesday is 40, and 70 − 40 = 30 more.
        - |
          110 adds the two days (70 + 40). "How many more" asks for the difference.
        - |
          70 is how many visitors came on Monday, not how many more than Tuesday.
      answer: 1

    - slug: g3math-w09-q13
      type: short_answer
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section B"
      points: 2
      prompt: |
        (a) Find 623 − 278. Show your work.
        (b) Show how you can use addition to check your answer.
      answer: |
        (a) 345. Ones: 3 is less than 8, so break a ten: 13 − 8 = 5. Tens: 1 ten is left, which is less than 7, so break a hundred: 11 − 7 = 4. Hundreds: 5 − 2 = 3.
        (b) 345 + 278 = 623, which is the number I started with, so 345 is right.
      explanation: |
        Two points.

        (a) 1 pt: 345 with work shown (decomposing a ten and a hundred, counting up 2 + 20 + 300 + 23, or counting back on a number line).

        (b) 1 pt: adds the answer to 278 and gets 623 (or adds their own answer to 278 correctly and compares it with 623).
