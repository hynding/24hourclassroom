week: 10
unit: 3
title: "Rounding to the Nearest 10 and 100"
topics: ["3.NBT.A.1"]
guide: guides/week-10.md
guide_description: |
  How to round a number to the nearest ten or hundred on a number line, what to do with a number exactly
  halfway, and how to use rounded numbers to estimate a sum or difference and decide if an answer makes sense.
flashcards_description: |
  19 cards on what rounding means, the nearest ten and nearest hundred, halfway numbers, the digit to look at,
  estimating sums and differences, and using an estimate to check an answer.

flashcards:
  - front: Rounding → what it means
    back: |
      Finding a nearby friendly number that is easy to work with. 47 rounded to the nearest ten is 50.
    topic_code: "3.NBT.A.1"
  - front: 63 rounded to the nearest ten → answer
    back: |
      60. 63 is between 60 and 70, and it is closer to 60.
    topic_code: "3.NBT.A.1"
  - front: 285 rounded to the nearest ten → answer
    back: |
      290. 285 is exactly halfway between 280 and 290, and a halfway number rounds up.
    topic_code: "3.NBT.A.1"
  - front: Halfway numbers → the rounding rule
    back: |
      A number exactly halfway rounds up. 45 rounds to 50, and 350 rounds to 400.
    topic_code: "3.NBT.A.1"
  - front: 438 rounded to the nearest hundred → answer
    back: |
      400. 438 is between 400 and 500. It is less than the halfway number 450, so it is closer to 400.
    topic_code: "3.NBT.A.1"
  - front: 762 rounded to the nearest hundred → answer
    back: |
      800. 762 is between 700 and 800. It is more than the halfway number 750, so it is closer to 800.
    topic_code: "3.NBT.A.1"
  - front: Halfway between 300 and 400 → the number
    back: |
      350. It is 50 away from each end.
    topic_code: "3.NBT.A.1"
  - front: Halfway between 520 and 530 → the number
    back: |
      525. It is 5 away from each end.
    topic_code: "3.NBT.A.1"
  - front: Rounding on a number line → the steps
    back: |
      Mark the tens (or hundreds) on each side of the number. Mark the halfway point. Place the number and see which end it is closer to.
    topic_code: "3.NBT.A.1"
  - front: Nearest ten → which digit to look at
    back: |
      The ones digit. 0, 1, 2, 3 or 4 rounds down; 5, 6, 7, 8 or 9 rounds up.
    topic_code: "3.NBT.A.1"
  - front: Nearest hundred → which digit to look at
    back: |
      The tens digit. 0 to 4 tens rounds down; 5 to 9 tens rounds up.
    topic_code: "3.NBT.A.1"
  - front: Estimate → what it means
    back: |
      An answer that is close to the exact one, found with rounded numbers. It tells you about how much.
    topic_code: "3.NBT.A.1"
  - front: Estimating 412 + 289 → nearest hundred
    back: |
      400 + 300 = 700. The exact sum, 701, is very close.
    topic_code: "3.NBT.A.1"
  - front: Estimating 615 − 382 → nearest hundred
    back: |
      600 − 400 = 200. The exact difference is 233, so 200 is a fair estimate.
    topic_code: "3.NBT.A.1"
  - front: Is my answer reasonable? → how to tell
    back: |
      Compare it with an estimate. If they are far apart, check your work again.
    topic_code: "3.NBT.A.1"
  - front: 96 rounded to the nearest ten → answer
    back: |
      100. 96 is between 90 and 100, and it is closer to 100.
    topic_code: "3.NBT.A.1"
  - front: 304 rounded to the nearest ten → answer
    back: |
      300. 304 is between 300 and 310, and it is closer to 300.
    topic_code: "3.NBT.A.1"
  - front: Numbers that round to 70 → nearest ten
    back: |
      65, 66, 67, 68, 69, 70, 71, 72, 73 and 74.
    topic_code: "3.NBT.A.1"
  - front: 349 to the nearest ten and to the nearest hundred → answers
    back: |
      Nearest ten: 350. Nearest hundred: 300. Always round the number itself, not a number you already rounded.
    topic_code: "3.NBT.A.1"

quiz:
  description: |
    14 questions · about 25 minutes · rounding to the nearest ten and hundred on a number line, halfway numbers,
    estimating sums and differences and deciding if an answer is reasonable, plus review of equal groups, adding
    and subtracting. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in
    word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w10-q01
      type: multiple_choice
      topic_code: "3.NBT.A.1"
      source: "IM K–5 Math Grade 3, Unit 3, Section C"
      points: 1
      stimulus: |
        Use the number line. It goes from 340 to 350, and the dot is at 347.
      figure: figures/w10-round-ten.svg
      figure_alt: "A number line from 340 to 350 with a tick mark for every whole number. The ticks at 340, 345 and 350 are labeled and taller. A red dot sits on the seventh tick after 340 and is labeled 347."
      prompt: |
        What is 347 rounded to the nearest ten?
      options:
        - "350"
        - "340"
        - "300"
        - "345"
      option_explanations:
        - |
          Correct. 347 is past the halfway mark at 345, so it is closer to 350 (3 away) than to 340 (7 away).
        - |
          340 is the ten below, but 347 is 7 away from it and only 3 away from 350.
        - |
          300 is a hundred, not a ten. Rounding to the nearest ten gives a number on this number line's ends: 340 or 350.
        - |
          345 is the halfway point. It helps you decide, but it is not a ten, so it cannot be the answer.
      answer: 0

    - slug: g3math-w10-q02
      type: numeric
      topic_code: "3.NBT.A.1"
      source: "IM K–5 Math Grade 3, Unit 3, Section C"
      points: 1
      stimulus: |
        Use the number line. It goes from 340 to 350, and the dot is at 347.
      prompt: |
        How many steps of 1 is the dot from 350?
      answer: { value: 3, tolerance: 0 }
      explanation: |
        Count the ticks from 347 to 350: 348, 349, 350. That is 3 steps, while 340 is 7 steps away, so 347 is closer to 350.

    - slug: g3math-w10-q03
      type: multiple_choice
      topic_code: "3.NBT.A.1"
      source: "IM K–5 Math Grade 3, Unit 3, Section C"
      points: 1
      figure: figures/w10-round-hundred.svg
      figure_alt: "A number line from 600 to 700 with a tick mark every 10. The ticks at 600, 650 and 700 are labeled and taller. A red dot labeled 670 sits on the second tick after 650."
      prompt: |
        The dot is at 670. What is 670 rounded to the nearest hundred?
      options:
        - "600"
        - "650"
        - "700"
        - "670"
      option_explanations:
        - |
          600 is the hundred below, but 670 is past the halfway mark at 650, so it is closer to 700.
        - |
          650 is the halfway mark, not a hundred. It shows that 670 is on the 700 side.
        - |
          Correct. 670 is past 650, the halfway point, so it is closer to 700 (30 away) than to 600 (70 away).
        - |
          670 is already a ten, but the question asks for the nearest hundred, which is 600 or 700.
      answer: 2

    - slug: g3math-w10-q04
      type: numeric
      topic_code: "3.NBT.A.1"
      source: "IM K–5 Math Grade 3, Unit 3, Section C"
      points: 1
      prompt: |
        Round 238 to the nearest ten.
      answer: { value: 240, tolerance: 0 }
      explanation: |
        238 is between 230 and 240. The halfway number is 235, and 238 is past it, so 238 rounds to 240.

    - slug: g3math-w10-q05
      type: numeric
      topic_code: "3.NBT.A.1"
      source: "IM K–5 Math Grade 3, Unit 3, Section C"
      points: 1
      prompt: |
        Round 851 to the nearest hundred.
      answer: { value: 900, tolerance: 0 }
      explanation: |
        851 is between 800 and 900. The halfway number is 850, and 851 is just past it, so 851 rounds to 900.

    - slug: g3math-w10-q06
      type: fill_blank
      topic_code: "3.NBT.A.1"
      source: "IM K–5 Math Grade 3, Unit 3, Section C"
      points: 1
      prompt: |
        Lin rounds 312 and 489 and adds 300 + 500 = 800. Her 800 is not exact. It is an ____.
      answer: ["estimate", "estimation", "approximation"]
      explanation: |
        An estimate is a close answer found with rounded numbers. The exact sum is 801, and the estimate of 800 is close to it.

    - slug: g3math-w10-q07
      type: true_false
      topic_code: "3.NBT.A.1"
      source: "IM K–5 Math Grade 3, Unit 3, Section C"
      points: 1
      prompt: |
        True or false: 450 rounded to the nearest hundred is 400.
      answer: false
      explanation: |
        False. 450 is exactly halfway between 400 and 500, and a halfway number rounds up. 450 rounds to 500.

    - slug: g3math-w10-q08
      type: multi_select
      topic_code: "3.NBT.A.1"
      source: "IM K–5 Math Grade 3, Unit 3, Section C"
      points: 2
      partial_credit: true
      prompt: |
        Which numbers round to 500 when you round to the nearest hundred? Select all that apply.
      options:
        - "449"
        - "462"
        - "551"
        - "450"
        - "549"
      option_explanations:
        - |
          No. 449 is just under the halfway number 450, so it is closer to 400.
        - |
          Yes. 462 is between 400 and 500 and past 450, so it rounds up to 500.
        - |
          No. 551 is between 500 and 600 and past 550, so it rounds up to 600.
        - |
          Yes. 450 is exactly halfway between 400 and 500, and halfway numbers round up to 500.
        - |
          Yes. 549 is between 500 and 600 but has not reached 550, so it rounds down to 500.
      answer: [1, 3, 4]

    - slug: g3math-w10-q09
      type: multiple_choice
      topic_code: "3.NBT.A.1"
      source: "IM K–5 Math Grade 3, Unit 3, Section C"
      points: 1
      prompt: |
        Estimate 389 + 412 by rounding each number to the nearest hundred.
      options:
        - "700"
        - "801"
        - "900"
        - "800"
      option_explanations:
        - |
          700 rounds 389 down to 300. 389 is past 350, so it rounds up to 400.
        - |
          801 is the exact sum. An estimate uses the rounded numbers, 400 + 400.
        - |
          900 rounds 412 up to 500. 412 is under 450, so it rounds down to 400.
        - |
          Correct. 389 rounds to 400 and 412 rounds to 400, so the estimate is 400 + 400 = 800.
      answer: 3

    - slug: g3math-w10-q10
      type: multiple_choice
      topic_code: "3.NBT.A.1"
      source: "IM K–5 Math Grade 3, Unit 3, Section C"
      points: 1
      prompt: |
        Theo says 703 − 296 = 507. Use rounding to decide if his answer is reasonable.
      options:
        - "Reasonable, because 700 − 200 = 500 and 507 is close to 500."
        - "Not reasonable, because 700 − 300 = 400 and 507 is far from 400."
        - "Not reasonable, because the answer must be more than 703."
        - "Reasonable, because 507 rounds to 500."
      option_explanations:
        - |
          296 is close to 300, not 200, so the estimate should be 700 − 300 = 400.
        - |
          Correct. 703 rounds to 700 and 296 rounds to 300, so the answer should be near 400. The exact answer is 407.
        - |
          Taking 296 away from 703 must give less than 703, not more.
        - |
          Rounding the answer alone does not test it. You need to estimate the problem: 700 − 300 = 400.
      answer: 1

    - slug: g3math-w10-q11
      type: multiple_choice
      topic_code: "3.OA.A.1"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 1
      figure: figures/w10-equal-groups.svg
      figure_alt: "A picture titled Muffins on Plates. There are 4 plates drawn as circles, and each plate has 6 red dots for muffins, in 2 rows of 3."
      prompt: |
        Which multiplication matches the picture?
      options:
        - "4 × 6"
        - "4 + 6"
        - "5 × 6"
        - "6 + 6 + 6"
      option_explanations:
        - |
          Correct. There are 4 equal groups with 6 muffins in each, so 4 × 6 = 24 muffins.
        - |
          4 + 6 adds the number of plates and the number on one plate. Equal groups need multiplication: 4 groups of 6.
        - |
          5 × 6 would need 5 plates. Count the circles again: there are 4.
        - |
          6 + 6 + 6 is only 3 groups of 6. The picture has 4 plates, so it is 6 + 6 + 6 + 6.
      answer: 0

    - slug: g3math-w10-q12
      type: numeric
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section A"
      points: 1
      prompt: |
        A class read 278 pages in October and 346 pages in November. How many pages did the class read in the two months?
      answer: { value: 624, tolerance: 0 }
      explanation: |
        278 + 346. Ones: 8 + 6 = 14, write 4 and regroup 1 ten. Tens: 7 + 4 + 1 = 12, write 2 and regroup 1 hundred. Hundreds: 2 + 3 + 1 = 6. The class read 624 pages (about 300 + 300 = 600, so it makes sense).

    - slug: g3math-w10-q13
      type: multiple_choice
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section B"
      points: 1
      prompt: |
        What is 800 − 357?
      options:
        - "557"
        - "543"
        - "443"
        - "453"
      option_explanations:
        - |
          557 takes the smaller digit from the bigger in each place. You must take 357 from 800, so decompose a hundred first.
        - |
          543 decomposes a hundred but still uses 8 in the hundreds. Only 7 hundreds are left, and 7 − 3 = 4.
        - |
          Correct. 800 becomes 7 hundreds, 9 tens, 10 ones. 10 − 7 = 3, 9 − 5 = 4, 7 − 3 = 4. Check: 443 + 357 = 800.
        - |
          453 keeps 10 tens after one ten was broken into ones. Only 9 tens are left, and 9 − 5 = 4.
      answer: 2

    - slug: g3math-w10-q14
      type: short_answer
      topic_code: "3.NBT.A.1"
      source: "IM K–5 Math Grade 3, Unit 3, Section C"
      points: 2
      prompt: |
        A school garden grew 587 strawberries in June and 312 in July.

        (a) Estimate the total by rounding each number to the nearest hundred.
        (b) Find the exact total. Was your estimate close?
      answer: |
        (a) 587 rounds to 600 and 312 rounds to 300. 600 + 300 = 900 strawberries.
        (b) 587 + 312 = 899. Yes, 899 is only 1 away from 900, so the estimate was very close.
      explanation: |
        Two points.

        (a) 1 pt: rounds both numbers correctly (600 and 300) and gives the estimate 900.

        (b) 1 pt: exact total 899 and a sentence comparing it with the estimate.
