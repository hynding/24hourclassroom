week: 6
unit: 2
title: "Area of Rectangles: Multiply the Side Lengths"
topics: ["3.MD.C.7"]
guide: guides/week-06.md
guide_description: |
  Why the area of a rectangle is its number of rows times the number of squares in each row, how to find the
  area from the side lengths without counting, how to find a missing side, and how to use square feet and
  square meters for real places like gardens and rugs.
flashcards_description: |
  18 cards on finding a rectangle's area by multiplying, side lengths, partly tiled rectangles, square feet and
  square meters, choosing a unit, missing side lengths, and the mix-up between adding and multiplying.

flashcards:
  - front: Area of a rectangle → the shortcut
    back: |
      Multiply the two side lengths. A rectangle 4 units by 6 units has an area of 4 × 6 = 24 square units.
    topic_code: "3.MD.C.7"
  - front: Rows of unit squares × squares in each row → what it gives
    back: |
      The area. 3 rows of 5 squares is 3 × 5 = 15 square units, the same as counting all 15 squares.
    topic_code: "3.MD.C.7"
  - front: Side length → what it is
    back: |
      How long one side of a shape is, like 6 centimeters. A rectangle's two side lengths tell its rows and its squares in each row.
    topic_code: "3.MD.C.7"
  - front: Rectangle 3 units by 7 units → area
    back: |
      21 square units, because 3 × 7 = 21.
    topic_code: "3.MD.C.7"
  - front: Rectangle 5 cm by 8 cm → area
    back: |
      40 square centimeters, because 5 × 8 = 40.
    topic_code: "3.MD.C.7"
  - front: Square with sides of 6 inches → area
    back: |
      36 square inches. All four sides are 6 inches, so the area is 6 × 6 = 36.
    topic_code: "3.MD.C.7"
  - front: Square foot → what it is
    back: |
      A square that is 1 foot on each side. We use square feet for rugs, gardens and floors.
    topic_code: "3.MD.C.7"
  - front: Square meter → what it is
    back: |
      A square that is 1 meter on each side. We use square meters for big spaces like a classroom or a playground.
    topic_code: "3.MD.C.7"
  - front: Area of a classroom floor → a good unit
    back: |
      Square feet or square meters. Square inches or square centimeters are so small you would need thousands of them.
    topic_code: "3.MD.C.7"
  - front: Area of a postage stamp → a good unit
    back: |
      Square centimeters or square inches, because a stamp is small.
    topic_code: "3.MD.C.7"
  - front: Rectangles with an area of 12 square units → whole-number sides
    back: |
      1 by 12, 2 by 6 and 3 by 4 (and the same ones turned: 12 by 1, 6 by 2, 4 by 3).
    topic_code: "3.MD.C.7"
  - front: Missing side of a rectangle → how to find it
    back: |
      Think: one side × what = the area? Area 20 and one side 4: 4 × 5 = 20, so the other side is 5.
    topic_code: "3.MD.C.7"
  - front: Rectangle with area 18 and one side 3 → other side
    back: |
      6, because 3 × 6 = 18.
    topic_code: "3.MD.C.7"
  - front: Rectangle with only its top row and left column tiled → how to find the area
    back: |
      The top row tells how many squares go in each row. The left column tells how many rows. Multiply them.
    topic_code: "3.MD.C.7"
  - front: Turning a rectangle on its side → does the area change?
    back: |
      No. A 3 by 8 rectangle and an 8 by 3 rectangle both cover 24 square units, because 3 × 8 = 8 × 3.
    topic_code: "3.MD.C.7"
  - front: Adding the side lengths to find area → why it is wrong
    back: |
      Adding 4 + 6 gives 10, but a 4 by 6 rectangle holds 4 rows of 6 squares. That is 4 × 6 = 24 square units.
    topic_code: "3.MD.C.7"
  - front: Writing an equation for a rectangle's area
    back: |
      side length × side length = area. For a rug 2 feet by 5 feet: 2 × 5 = 10, so the area is 10 square feet.
    topic_code: "3.MD.C.7"
  - front: Counting squares and multiplying sides → why they agree
    back: |
      Each row has the same number of squares, so counting them all is the same as adding equal rows, which is multiplying.
    topic_code: "3.MD.C.7"

quiz:
  description: |
    14 questions · about 30 minutes · finding the area of rectangles by multiplying side lengths, partly tiled
    rectangles, square feet and square meters, missing side lengths, plus review of counting square units, units
    of area, unknown factors, turning arrays and bar graphs. Multiple choice, select-all, true/false and number
    answers are graded at once; the fill-in words are matched automatically; the short answer is checked by your
    teacher.
  questions:
    - slug: g3math-w06-q01
      type: multiple_choice
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section B"
      points: 1
      figure: figures/w06-array-rectangle.svg
      figure_alt: "A rectangle tiled with blue unit squares, with no gaps. It has 4 rows, and each row has 6 squares."
      prompt: |
        Which equation tells the area of the rectangle, in square units?
      options:
        - "4 + 6 = 10"
        - "4 × 6 = 24"
        - "4 × 5 = 20"
        - "6 + 6 = 12"
      option_explanations:
        - |
          4 + 6 adds the two side lengths. The rectangle holds 4 rows of 6 squares, so multiply: 4 × 6 = 24.
        - |
          Correct. There are 4 rows with 6 squares in each row, and 4 × 6 = 24 square units.
        - |
          4 × 5 would mean 5 squares in each row. Count one row again: it has 6 squares, so the area is 4 × 6.
        - |
          6 + 6 counts only 2 rows. The rectangle has 4 rows of 6, so the area is 6 + 6 + 6 + 6 = 24.
      answer: 1

    - slug: g3math-w06-q02
      type: numeric
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section B"
      points: 1
      figure: figures/w06-partial-grid.svg
      figure_alt: "A rectangle outline. Blue unit squares fill only its top row and its left column. The top row has 7 squares. The left column has 5 squares, counting the corner square that is also in the top row. The rest of the rectangle is empty."
      prompt: |
        Mei started tiling this rectangle with unit squares, but she drew only the top row and the left column. When the rectangle is full of squares, what will its area be, in square units?
      answer: { value: 35, tolerance: 0 }
      explanation: |
        The top row shows 7 squares in each row. The left column shows 5 rows. 5 rows of 7 is 5 × 7 = 35 square units.

    - slug: g3math-w06-q03
      type: multiple_choice
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section B"
      points: 1
      prompt: |
        A drawing paper is a rectangle 6 centimeters wide and 8 centimeters long. What is its area?
      options:
        - "14 square centimeters"
        - "28 square centimeters"
        - "42 square centimeters"
        - "48 square centimeters"
      option_explanations:
        - |
          14 is 6 + 8, the two side lengths added. Area is side length times side length: 6 × 8.
        - |
          28 is the distance around the paper (6 + 8 + 6 + 8). Area is the space inside: 6 × 8 = 48.
        - |
          42 is 6 × 7. The long side is 8 centimeters, so the area is 6 × 8 = 48 square centimeters.
        - |
          Correct. The paper would hold 6 rows of 8 square centimeters, and 6 × 8 = 48 square centimeters.
      answer: 3

    - slug: g3math-w06-q04
      type: multiple_choice
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section B"
      points: 1
      stimulus: |
        Use the drawing of the class garden. It is a rectangle 7 feet long and 3 feet wide.
      figure: figures/w06-garden-rectangle.svg
      figure_alt: "A green rectangle titled Class Garden. The top side is labeled 7 feet and the left side is labeled 3 feet. There are no squares drawn inside."
      prompt: |
        What is the area of the class garden?
      options:
        - "21 square feet"
        - "10 square feet"
        - "20 square feet"
        - "21 feet"
      option_explanations:
        - |
          Correct. The garden would hold 3 rows of 7 one-foot squares, and 3 × 7 = 21 square feet.
        - |
          10 is 7 + 3, the side lengths added. To find area, multiply them: 7 × 3 = 21 square feet.
        - |
          20 feet is the distance around the garden (7 + 3 + 7 + 3). The area is 7 × 3 = 21 square feet.
        - |
          21 is the right number, but feet measure length. An area is said in square feet.
      answer: 0

    - slug: g3math-w06-q05
      type: numeric
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section B"
      points: 1
      stimulus: |
        Use the drawing of the class garden. It is a rectangle 7 feet long and 3 feet wide.
      prompt: |
        Next year the class makes a new garden that is 7 feet long and 4 feet wide. How many more square feet is the new garden than the class garden?
      answer: { value: 7, tolerance: 0 }
      explanation: |
        The new garden is 7 × 4 = 28 square feet. The class garden is 7 × 3 = 21 square feet. 28 − 21 = 7 more square feet. (The new garden has one more row of 7 squares.)

    - slug: g3math-w06-q06
      type: fill_blank
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section B"
      points: 1
      prompt: |
        A rug is measured with squares that are 1 foot long on each side. The rug's area is written in ____.
      answer: ["square feet", "square foot", "sq ft", "sq. ft.", "square ft"]
      explanation: |
        Square feet. A square that is 1 foot on each side covers 1 square foot, so the rug's area is a number of square feet. "Feet" alone would be a length.

    - slug: g3math-w06-q07
      type: true_false
      topic_code: "3.OA.B.5"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      prompt: |
        True or false: a rectangle 3 units by 5 units has the same area as a rectangle 5 units by 3 units.
      answer: true
      explanation: |
        True. 3 × 5 = 15 and 5 × 3 = 15. The second rectangle is the first one turned on its side, and turning a shape does not change how much space it covers.

    - slug: g3math-w06-q08
      type: multi_select
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which rectangles have an area of 24 square units? Select all that apply.
      options:
        - "3 units by 8 units"
        - "5 units by 5 units"
        - "2 units by 12 units"
        - "20 units by 4 units"
        - "6 units by 4 units"
      option_explanations:
        - |
          Yes. 3 rows of 8 squares is 3 × 8 = 24 square units.
        - |
          No. 5 × 5 = 25 square units, one more than 24.
        - |
          Yes. 2 rows of 12 squares is 2 × 12 = 24 square units (12 + 12).
        - |
          No. 20 + 4 makes 24, but area means multiplying: 20 × 4 = 80 square units.
        - |
          Yes. 6 rows of 4 squares is 6 × 4 = 24 square units.
      answer: [0, 2, 4]

    - slug: g3math-w06-q09
      type: multiple_choice
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section B"
      points: 1
      prompt: |
        A reading corner is a rectangle with an area of 30 square meters. One side is 5 meters long. How long is the other side?
      options:
        - "25 meters"
        - "35 meters"
        - "6 meters"
        - "150 meters"
      option_explanations:
        - |
          25 is 30 − 5. Think of a multiplication instead: 5 × what = 30?
        - |
          35 is 30 + 5. The area comes from multiplying the sides, so ask: 5 × what = 30?
        - |
          Correct. 5 × 6 = 30, so the other side is 6 meters long.
        - |
          150 is 30 × 5, but 30 is already the area. You need the side that times 5 makes 30.
      answer: 2

    - slug: g3math-w06-q10
      type: multiple_choice
      topic_code: "3.MD.C.6"
      source: "IM K–5 Math Grade 3, Unit 2, Section A"
      points: 1
      prompt: |
        Jamal covers a shape with square-inch tiles, with no gaps or overlaps. He uses 5 rows of 3 tiles and then 2 more tiles. What is the area of the shape?
      options:
        - "17 square inches"
        - "15 square inches"
        - "10 square inches"
        - "17 inches"
      option_explanations:
        - |
          Correct. 5 rows of 3 tiles is 15 tiles, and 2 more makes 15 + 2 = 17 square inches.
        - |
          15 counts the 5 rows of 3 but leaves out the 2 extra tiles. 15 + 2 = 17 square inches.
        - |
          10 adds the numbers in the story (5 + 3 + 2). Count the tiles instead: 3 + 3 + 3 + 3 + 3 + 2 = 17.
        - |
          17 is the right count, but inches measure length. Each tile covers a square inch, so say 17 square inches.
      answer: 0

    - slug: g3math-w06-q11
      type: numeric
      topic_code: "3.OA.A.4"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      prompt: |
        What number makes this equation true? 7 × ? = 56
      answer: { value: 8, tolerance: 0 }
      explanation: |
        7 × 8 = 56, so the missing number is 8. You can count by 7s: 7, 14, 21, 28, 35, 42, 49, 56. That is 8 sevens.

    - slug: g3math-w06-q12
      type: multiple_choice
      topic_code: "3.MD.C.5"
      source: "IM K–5 Math Grade 3, Unit 2, Section A"
      points: 1
      prompt: |
        Which of these is a unit for measuring area?
      options:
        - "inch"
        - "square inch"
        - "foot"
        - "centimeter"
      option_explanations:
        - |
          An inch measures length, like how long a pencil is. A unit of area must be a square, like a square inch.
        - |
          Correct. A square inch is a square 1 inch on each side, so it measures how much space a shape covers.
        - |
          A foot measures length, like how tall a door is. The area unit would be a square foot.
        - |
          A centimeter measures length. The area unit made from it is a square centimeter.
      answer: 1

    - slug: g3math-w06-q13
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      prompt: |
        On a bar graph, the scale counts by 2s. A bar stops exactly halfway between the 8 line and the 10 line. What number does the bar show?
      options:
        - "8"
        - "10"
        - "18"
        - "9"
      option_explanations:
        - |
          8 is the line just below the top of the bar. The bar goes past 8, halfway up to 10.
        - |
          10 is the line just above the bar. The bar stops halfway there, so it is less than 10.
        - |
          18 adds 8 and 10. The bar shows one number between them, the number halfway from 8 to 10.
        - |
          Correct. The number halfway between 8 and 10 is 9.
      answer: 3

    - slug: g3math-w06-q14
      type: short_answer
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section B"
      points: 2
      prompt: |
        Theo's rug is a rectangle 6 feet wide and 9 feet long.

        (a) What is the area of the rug?
        (b) Explain how multiplying tells you the area without counting every square.
      answer: |
        (a) 54 square feet, because 6 × 9 = 54.
        (b) If you covered the rug with 1-foot squares, there would be 6 rows with 9 squares in each row. Equal rows can be counted by multiplying: 6 × 9 = 54, so you do not need to count each square.
      explanation: |
        Two points.

        (a) 1 pt: 54 square feet (the number and the square unit).

        (b) 1 pt: explains that the side lengths give the rows and the squares in each row (6 rows of 9, or 9 rows of 6), so multiplying counts them all.
