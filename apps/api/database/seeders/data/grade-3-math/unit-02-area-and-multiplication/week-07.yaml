week: 7
unit: 2
title: "Splitting Rectangles and Finding the Area of Bigger Shapes"
topics: ["3.MD.C.7", "3.OA.B.5"]
guide: guides/week-07.md
guide_description: |
  How splitting a rectangle into two smaller rectangles turns a hard multiplication into two easier ones, and
  how to find the area of a shape made of rectangles by splitting it, finding each part's area and adding.
flashcards_description: |
  18 cards on splitting a rectangle (breaking one side into parts), the multiplications that match a split,
  shapes made of rectangles, finding a missing side on an L-shape, and the mistakes to watch for.

flashcards:
  - front: Splitting a rectangle → why do it
    back: |
      To turn one hard multiplication into two easier ones. 6 × 7 can be split into 6 × 5 and 6 × 2.
    topic_code: "3.OA.B.5"
  - front: Breaking a factor apart → what stays the same
    back: |
      The other factor. To find 4 × 9, break the 9 into 5 + 4 and keep the 4 in both parts: 4 × 5 + 4 × 4.
    topic_code: "3.OA.B.5"
  - front: 6 × 7 as 6 × 5 + 6 × 2 → product
    back: |
      42. 6 × 5 = 30 and 6 × 2 = 12, and 30 + 12 = 42.
    topic_code: "3.OA.B.5"
  - front: 8 × 6 as 8 × 5 + 8 × 1 → product
    back: |
      48. 8 × 5 = 40 and 8 × 1 = 8, and 40 + 8 = 48.
    topic_code: "3.OA.B.5"
  - front: 7 × 9 as 7 × 5 + 7 × 4 → product
    back: |
      63. 7 × 5 = 35 and 7 × 4 = 28, and 35 + 28 = 63.
    topic_code: "3.OA.B.5"
  - front: 9 × 4 as 5 × 4 + 4 × 4 → product
    back: |
      36. 5 × 4 = 20 and 4 × 4 = 16, and 20 + 16 = 36. Here the 9 rows were split into 5 rows and 4 rows.
    topic_code: "3.OA.B.5"
  - front: Splitting with a 5 → why it is handy
    back: |
      Fives are easy to count: 5, 10, 15, 20... So break 7 into 5 + 2, 8 into 5 + 3, or 9 into 5 + 4.
    topic_code: "3.OA.B.5"
  - front: Parts of a split rectangle → how their areas fit together
    back: |
      Add them. The two small areas together always make the area of the whole rectangle.
    topic_code: "3.MD.C.7"
  - front: Shape made of two rectangles → how to find its area
    back: |
      Split it into rectangles, find the area of each one by multiplying, then add the areas.
    topic_code: "3.MD.C.7"
  - front: L-shaped figure → how many ways to split it
    back: |
      At least two. Cut it across or cut it up and down. Both ways give the same total area.
    topic_code: "3.MD.C.7"
  - front: Missing side on an L-shape → how to find it
    back: |
      Use the sides you know. If the bottom is 8 and the top part is 3 wide, the step across is 8 − 3 = 5.
    topic_code: "3.MD.C.7"
  - front: Overlapping parts when splitting a shape → the mistake
    back: |
      If two parts share some squares, those squares get counted twice. Make the parts touch, not overlap.
    topic_code: "3.MD.C.7"
  - front: Adding all the side lengths of a shape → what that finds
    back: |
      The distance around it, not the area. For area, multiply side lengths of each rectangle and add the areas.
    topic_code: "3.MD.C.7"
  - front: Garden of a 4 by 6 part and a 2 by 3 part → total area
    back: |
      30 square units. 4 × 6 = 24 and 2 × 3 = 6, and 24 + 6 = 30.
    topic_code: "3.MD.C.7"
  - front: Checking a split → a good habit
    back: |
      Split a different way and see if you get the same total. 6 × 7 = 6 × 5 + 6 × 2 = 42, and 6 × 7 = 6 × 4 + 6 × 3 = 42 too.
    topic_code: "3.OA.B.5"
  - front: 4 × 9 = 4 × 5 + 4 × ? → the missing number
    back: |
      4. The 9 was split into 5 and 4, so the second part is 4 × 4.
    topic_code: "3.OA.B.5"
  - front: Decompose → meaning in math
    back: |
      To break a number or a shape into smaller parts, like breaking 8 into 5 and 3.
    topic_code: "3.OA.B.5"
  - front: Splitting a factor into three parts → does it still work?
    back: |
      Yes. 7 × 9 = 7 × 3 + 7 × 3 + 7 × 3 = 21 + 21 + 21 = 63. Every part keeps the 7.
    topic_code: "3.OA.B.5"

quiz:
  description: |
    14 questions · about 30 minutes · splitting a rectangle into two smaller rectangles, writing the
    multiplications that match a split, finding the area of shapes made of rectangles, plus review of counting
    square units, word problems, bar graphs and comparing areas. Multiple choice, select-all, true/false and
    number answers are graded at once; the fill-in word is matched automatically; the short answer is checked by
    your teacher.
  questions:
    - slug: g3math-w07-q01
      type: multiple_choice
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section C"
      points: 1
      stimulus: |
        Use the rectangle split by the red line. Each small square is 1 square unit.
      figure: figures/w07-split-rectangle.svg
      figure_alt: "A rectangle of unit squares, 4 rows tall and 9 squares long. A red line splits it into a blue part on the left that is 4 rows of 5 squares and a green part on the right that is 4 rows of 4 squares. Labels say 5 above the blue part, 4 above the green part and 4 on the left side."
      prompt: |
        What is the area of the whole rectangle?
      options:
        - "20 square units"
        - "13 square units"
        - "36 square units"
        - "32 square units"
      option_explanations:
        - |
          20 is only the blue part (4 × 5). Add the green part too: 20 + 16 = 36 square units.
        - |
          13 adds the numbers 4, 5 and 4. Find each part's area by multiplying: 4 × 5 = 20 and 4 × 4 = 16.
        - |
          Correct. The blue part is 4 × 5 = 20, the green part is 4 × 4 = 16, and 20 + 16 = 36 square units.
        - |
          32 is 4 × 8, one column short. The rectangle is 5 + 4 = 9 squares long, and 4 × 9 = 36.
      answer: 2

    - slug: g3math-w07-q02
      type: multiple_choice
      topic_code: "3.OA.B.5"
      source: "IM K–5 Math Grade 3, Unit 2, Section C"
      points: 1
      stimulus: |
        Use the rectangle split by the red line. Each small square is 1 square unit.
      prompt: |
        Which equation matches the way the rectangle is split?
      options:
        - "4 × 9 = 4 × 5 + 4 × 4"
        - "4 × 9 = 4 + 5 + 4 + 4"
        - "4 × 9 = 4 × 5 + 4"
        - "4 × 9 = 4 × 5 × 4 × 4"
      option_explanations:
        - |
          Correct. The whole is 4 × 9. The blue part is 4 × 5 and the green part is 4 × 4, and the two parts add up to the whole.
        - |
          This adds the side numbers instead of finding the area of each part. Each part is rows times squares in a row.
        - |
          The green part is 4 rows of 4, which is 4 × 4 = 16, not just 4. Both parts need a multiplication.
        - |
          The parts sit side by side, so their areas are added, not multiplied: 4 × 5 + 4 × 4.
      answer: 0

    - slug: g3math-w07-q03
      type: numeric
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section C"
      points: 1
      stimulus: |
        Use the drawing of Mr. Okafor's patio. All of its corners are square corners.
      figure: figures/w07-l-shape.svg
      figure_alt: "A blue L-shaped patio titled Patio: a tall part on the left and a wide part along the bottom. Going around from the top left corner, the side lengths are: top 3 m, then down 3 m, then across 5 m, then down the right side 3 m, the bottom 8 m, and the left side 6 m. All corners are square corners."
      prompt: |
        What is the area of the patio, in square meters?
      answer: { value: 33, tolerance: 0 }
      explanation: |
        Split it across. The bottom part is 8 m by 3 m: 8 × 3 = 24. The top part is 3 m by 3 m: 3 × 3 = 9. 24 + 9 = 33 square meters. (Split up and down instead: 3 × 6 = 18 and 5 × 3 = 15, and 18 + 15 = 33.)

    - slug: g3math-w07-q04
      type: multiple_choice
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section C"
      points: 1
      stimulus: |
        Use the drawing of Mr. Okafor's patio. All of its corners are square corners.
      prompt: |
        Which expression gives the area of the patio?
      options:
        - "8 × 6"
        - "3 + 3 + 5 + 3 + 8 + 6"
        - "3 × 6 + 8 × 3"
        - "3 × 3 + 8 × 3"
      option_explanations:
        - |
          8 × 6 is the area of a full rectangle 8 by 6. The patio is missing its top right corner, so it is smaller.
        - |
          Adding all the sides gives the distance around the patio. Area needs the rectangles' areas added together.
        - |
          The 3 by 6 part and the 8 by 3 part overlap in the bottom left corner, so those squares are counted twice.
        - |
          Correct. A 3 by 3 part on top and an 8 by 3 part on the bottom fit together with no overlap: 9 + 24 = 33.
      answer: 3

    - slug: g3math-w07-q05
      type: multiple_choice
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section C"
      points: 1
      figure: figures/w07-split-labeled.svg
      figure_alt: "A rectangle split into two parts by a line from top to bottom. The left side is labeled 6. The top of the blue left part is labeled 5 and the top of the green right part is labeled 2."
      prompt: |
        The rectangle is 6 units tall. It is split into a part 5 units wide and a part 2 units wide. What is the area of the whole rectangle?
      options:
        - "30 square units"
        - "42 square units"
        - "12 square units"
        - "13 square units"
      option_explanations:
        - |
          30 is only the blue part (6 × 5). Add the green part, 6 × 2 = 12: 30 + 12 = 42.
        - |
          Correct. 6 × 5 = 30 and 6 × 2 = 12, and 30 + 12 = 42. That matches 6 × 7 = 42 for the whole.
        - |
          12 is only the green part (6 × 2). The blue part adds 6 × 5 = 30 more.
        - |
          13 adds the labels 6 + 5 + 2. Find the area of each part by multiplying, then add the areas.
      answer: 1

    - slug: g3math-w07-q06
      type: fill_blank
      topic_code: "3.OA.B.5"
      source: "IM K–5 Math Grade 3, Unit 2, Section C"
      points: 1
      prompt: |
        Breaking a number or a shape into smaller parts, like breaking 7 into 5 and 2, is called ____.
      answer: ["decomposing", "decomposition", "decompose", "breaking apart", "splitting", "partitioning"]
      explanation: |
        Decomposing (breaking apart). When we decompose 7 into 5 and 2, we can find 6 × 7 as 6 × 5 + 6 × 2.

    - slug: g3math-w07-q07
      type: true_false
      topic_code: "3.OA.B.5"
      source: "IM K–5 Math Grade 3, Unit 2, Section C"
      points: 1
      prompt: |
        True or false: 5 × 8 is equal to 5 × 4 + 4.
      answer: false
      explanation: |
        False. 5 × 4 + 4 = 20 + 4 = 24, but 5 × 8 = 40. Splitting 8 into 4 and 4 gives 5 × 4 + 5 × 4 = 20 + 20 = 40. Both parts need the 5.

    - slug: g3math-w07-q08
      type: multi_select
      topic_code: "3.OA.B.5"
      source: "IM K–5 Math Grade 3, Unit 2, Section C"
      points: 2
      partial_credit: true
      prompt: |
        A rectangle is 7 units by 9 units. Which ways give its area? Select all that apply.
      options:
        - "7 × 5 + 7 × 4"
        - "7 × 9"
        - "7 + 9"
        - "7 × 3 + 7 × 3 + 7 × 3"
        - "7 × 5 + 4"
      option_explanations:
        - |
          Yes. The 9 is split into 5 + 4: 35 + 28 = 63 square units.
        - |
          Yes. Multiplying the side lengths gives the area: 7 × 9 = 63 square units.
        - |
          No. 7 + 9 = 16 adds the side lengths. The area is 7 rows of 9, which is 63.
        - |
          Yes. The 9 is split into 3 + 3 + 3, and each part keeps the 7: 21 + 21 + 21 = 63.
        - |
          No. The second part should be 7 × 4 = 28, not 4. This gives 35 + 4 = 39.
      answer: [0, 1, 3]

    - slug: g3math-w07-q09
      type: multiple_choice
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section C"
      points: 1
      prompt: |
        A play area is made of two rectangles that touch but do not overlap. One is 5 meters by 6 meters. The other is 3 meters by 4 meters. What is the area of the whole play area?
      options:
        - "18 square meters"
        - "30 square meters"
        - "42 square meters"
        - "12 square meters"
      option_explanations:
        - |
          18 adds all four side lengths (5 + 6 + 3 + 4). Find each rectangle's area by multiplying first.
        - |
          30 is only the bigger rectangle (5 × 6). Add the smaller one, 3 × 4 = 12, to get 42.
        - |
          Correct. 5 × 6 = 30 and 3 × 4 = 12, and 30 + 12 = 42 square meters.
        - |
          12 is only the smaller rectangle (3 × 4). The bigger rectangle adds 5 × 6 = 30 more.
      answer: 2

    - slug: g3math-w07-q10
      type: multiple_choice
      topic_code: "3.MD.C.6"
      source: "IM K–5 Math Grade 3, Unit 2, Section A"
      points: 1
      prompt: |
        Jun covers a card with square-inch tiles, with no gaps or overlaps. He makes 2 rows of 5 tiles. Then he adds a third row with only 3 tiles. What is the area covered now?
      options:
        - "13 square inches"
        - "10 square inches"
        - "8 square inches"
        - "15 square inches"
      option_explanations:
        - |
          Correct. 5 + 5 + 3 = 13 tiles, and each tile covers 1 square inch.
        - |
          10 counts only the first 2 rows. The third row adds 3 more tiles: 10 + 3 = 13.
        - |
          8 adds one row of 5 and the row of 3. There are two rows of 5, so 5 + 5 + 3 = 13.
        - |
          15 would be a full third row of 5. The third row has only 3 tiles, so the total is 13.
      answer: 0

    - slug: g3math-w07-q11
      type: numeric
      topic_code: "3.OA.A.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 1
      prompt: |
        There are 6 tables in the art room. Each table has 4 markers. How many markers are there in all?
      answer: { value: 24, tolerance: 0 }
      explanation: |
        6 groups of 4 is 6 × 4 = 24 markers. You can also add 4 + 4 + 4 + 4 + 4 + 4 = 24.

    - slug: g3math-w07-q12
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      prompt: |
        On a bar graph, the scale goes 0, 10, 20, 30, 40, 50. A bar stops exactly on the fourth line above 0. What number does the bar show?
      options:
        - "4"
        - "40"
        - "14"
        - "50"
      option_explanations:
        - |
          4 is how many lines the bar goes up. Each line is worth 10, so count by 10s: 10, 20, 30, 40.
        - |
          Correct. The lines above 0 are 10, 20, 30 and 40, so the fourth line is 40.
        - |
          14 mixes the line count with the scale. Each line adds 10, so four lines up is 40.
        - |
          50 is the fifth line above 0. The bar stops one line lower, at 40.
      answer: 1

    - slug: g3math-w07-q13
      type: multiple_choice
      topic_code: "3.MD.C.5"
      source: "IM K–5 Math Grade 3, Unit 2, Section A"
      points: 1
      prompt: |
        Pia's bookmark covers 12 unit squares in one long row. Ben's card covers 3 rows of 4 unit squares. Which sentence is true?
      options:
        - "Pia's bookmark has the greater area, because it is longer."
        - "Ben's card has the greater area, because it is wider."
        - "You cannot compare the areas, because the shapes are different."
        - "They have the same area."
      option_explanations:
        - |
          Longer does not mean more space. Pia's bookmark covers 12 squares, and Ben's card covers 3 × 4 = 12 too.
        - |
          Wider does not mean more space. Ben's card covers 3 × 4 = 12 squares, the same as Pia's 12.
        - |
          Shapes can look different and still be compared: count the unit squares in each. Both have 12.
        - |
          Correct. Pia's bookmark covers 12 unit squares and Ben's card covers 3 × 4 = 12, so the areas are equal.
      answer: 3

    - slug: g3math-w07-q14
      type: short_answer
      topic_code: "3.OA.B.5"
      source: "IM K–5 Math Grade 3, Unit 2, Section C"
      points: 2
      prompt: |
        Zara does not know 8 × 7 yet, but she knows her 5s and her 2s.

        (a) Show how she can split a rectangle 8 units by 7 units into two smaller rectangles. Write the area of each part.
        (b) What is 8 × 7?
      answer: |
        (a) Split the 7 into 5 and 2. The parts are 8 by 5 and 8 by 2. 8 × 5 = 40 and 8 × 2 = 16.
        (b) 40 + 16 = 56, so 8 × 7 = 56.
      explanation: |
        Two points.

        (a) 1 pt: two rectangles that together make 8 by 7 (for example 8 by 5 and 8 by 2, or 5 by 7 and 3 by 7), each with its correct area. A labeled drawing is fine.

        (b) 1 pt: 56, found by adding the two parts' areas.
