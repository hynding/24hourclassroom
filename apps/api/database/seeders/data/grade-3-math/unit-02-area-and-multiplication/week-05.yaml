week: 5
unit: 2
title: "What Is Area? Covering Shapes With Unit Squares"
topics: ["3.MD.C.5", "3.MD.C.6"]
guide: guides/week-05.md
guide_description: |
  What area means, why we measure it by covering a shape with squares that leave no gaps and do not overlap,
  how to count square units (including half squares), and how to name an area in square centimeters, square
  inches or other square units.
flashcards_description: |
  18 cards on area words (area, unit square, square unit, tiling, gaps and overlaps), counting squares row by
  row, half squares, square centimeters and square inches, and comparing the areas of two shapes.

flashcards:
  - front: Area → what it measures
    back: |
      How much flat space a shape covers. We find it by counting how many unit squares cover the shape.
    topic_code: "3.MD.C.5"
  - front: Unit square → what it is
    back: |
      A square that is 1 unit long on every side. It has an area of 1 square unit.
    topic_code: "3.MD.C.5"
  - front: Square unit → how we use it
    back: |
      It is the unit we use to say an area, like "12 square units". One unit square covers 1 square unit.
    topic_code: "3.MD.C.5"
  - front: Tiling a shape → what it means
    back: |
      Covering a shape with tiles that are all the same size, edge to edge, so the whole shape is covered.
    topic_code: "3.MD.C.5"
  - front: Gaps when measuring area → why they are not allowed
    back: |
      A gap is space you did not cover. If you leave gaps, you count too few squares and the area comes out too small.
    topic_code: "3.MD.C.5"
  - front: Overlaps when measuring area → why they are not allowed
    back: |
      Tiles that overlap cover the same space twice. Then you count too many squares and the area comes out too big.
    topic_code: "3.MD.C.5"
  - front: Shape covered by exactly 9 unit squares → its area
    back: |
      9 square units. Each unit square adds 1 square unit.
    topic_code: "3.MD.C.5"
  - front: Counting squares on a grid → a tidy way
    back: |
      Count one row at a time and write each row's number. Then add the rows: 2 + 4 + 5 + 2 = 13 square units.
    topic_code: "3.MD.C.6"
  - front: Half of a unit square → its area
    back: |
      Half a square unit. A square cut corner to corner makes two triangles, and each one is half of the square.
    topic_code: "3.MD.C.6"
  - front: Two half squares → their area together
    back: |
      1 square unit. Two halves fit together to make one whole square.
    topic_code: "3.MD.C.6"
  - front: Square centimeter → what it is
    back: |
      A square that is 1 centimeter on each side. It is about the size of a fingernail on your smallest finger.
    topic_code: "3.MD.C.6"
  - front: Square inch → what it is
    back: |
      A square that is 1 inch on each side. It is bigger than a square centimeter, about the size of a postage stamp.
    topic_code: "3.MD.C.6"
  - front: Centimeters vs square centimeters → which is area
    back: |
      Square centimeters. Centimeters measure length (how long). Square centimeters measure area (how much space is covered).
    topic_code: "3.MD.C.6"
  - front: Bigger tiles → more or fewer to cover the same table
    back: |
      Fewer. Each big tile covers more space, so you need fewer of them. The table's area does not change.
    topic_code: "3.MD.C.5"
  - front: Two shapes that look different → can they have the same area?
    back: |
      Yes. A long, thin shape and a short, wide shape can both cover 12 unit squares. Count the squares to check.
    topic_code: "3.MD.C.5"
  - front: Comparing the area of two shapes → how
    back: |
      Count the unit squares in each shape, then compare the numbers. More squares means a greater area.
    topic_code: "3.MD.C.6"
  - front: Empty squares on a grid → do they count toward a shape's area?
    back: |
      No. Count only the squares that are part of the shape, not every square on the paper.
    topic_code: "3.MD.C.6"
  - front: Why we use squares to measure area
    back: |
      Squares fit together with no gaps and no overlaps, and they are all the same size, so counting them is fair.
    topic_code: "3.MD.C.5"

quiz:
  description: |
    15 questions · about 30 minutes · what area means, covering shapes with unit squares, counting square units
    (including half squares), comparing areas, and square centimeters, plus review of picture graphs and equal
    groups. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in words are
    matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w05-q01
      type: multiple_choice
      topic_code: "3.MD.C.6"
      source: "IM K–5 Math Grade 3, Unit 2, Section A"
      points: 1
      figure: figures/w05-tiled-shape.svg
      figure_alt: "A blue shape made of squares on a grid that is 7 squares wide and 5 squares tall. From the top, the rows of the shape have 2 squares, 4 squares, 5 squares and 2 squares. The bottom row of the grid is empty. A key shows one blue square equals 1 square unit."
      prompt: |
        What is the area of the blue shape?
      options:
        - "12 square units"
        - "35 square units"
        - "13 square units"
        - "11 square units"
      option_explanations:
        - |
          12 is one square short. Count each row and write it down so none is missed: 2 + 4 + 5 + 2 = 13.
        - |
          35 counts every square on the whole grid (7 × 5), but only the blue squares are part of the shape.
        - |
          Correct. Row by row the shape has 2, 4, 5 and 2 squares, and 2 + 4 + 5 + 2 = 13 square units.
        - |
          11 leaves out the 2 squares in the shape's bottom row. Add them back: 11 + 2 = 13 square units.
      answer: 2

    - slug: g3math-w05-q02
      type: numeric
      topic_code: "3.MD.C.6"
      source: "IM K–5 Math Grade 3, Unit 2, Section A"
      points: 1
      figure: figures/w05-half-squares.svg
      figure_alt: "A green shape on a square grid. It has 2 rows of 3 whole squares. At the right end of each row is a green triangle that covers exactly half of one grid square. A key shows one whole square equals 1 square unit."
      prompt: |
        What is the area of the green shape, in square units?
      answer: { value: 7, tolerance: 0 }
      explanation: |
        There are 6 whole squares (2 rows of 3). The 2 triangles are each half a square, and two halves make 1 whole square. 6 + 1 = 7 square units.

    - slug: g3math-w05-q03
      type: multiple_choice
      topic_code: "3.MD.C.5"
      source: "IM K–5 Math Grade 3, Unit 2, Section A"
      points: 1
      prompt: |
        Which sentence tells what the area of a shape is?
      options:
        - "The number of unit squares it takes to cover the shape with no gaps or overlaps"
        - "The distance all the way around the outside of the shape"
        - "How tall the shape is from bottom to top"
        - "The number of corners the shape has"
      option_explanations:
        - |
          Correct. Area is how much flat space a shape covers, and we measure it by counting unit squares.
        - |
          The distance around the outside is the perimeter, which you will learn about later. Area is the space inside.
        - |
          Height is a length, measured with a ruler. Area tells how much space the whole shape covers.
        - |
          Counting corners helps you name a shape, but two shapes with 4 corners can cover very different amounts of space.
      answer: 0

    - slug: g3math-w05-q04
      type: multiple_choice
      topic_code: "3.MD.C.6"
      source: "IM K–5 Math Grade 3, Unit 2, Section A"
      points: 1
      stimulus: |
        Use the grid with the red shape and the blue shape. Each small square is 1 square unit.
      figure: figures/w05-compare-shapes.svg
      figure_alt: "A grid with two shapes. The red shape is a rectangle of 3 rows with 4 squares in each row. The blue shape has rows of 2 squares, 5 squares, 5 squares and 2 squares, from top to bottom, all lined up on the left. Labels under them say Red shape and Blue shape."
      prompt: |
        Which shape has the greater area, and by how much?
      options:
        - "The red shape, by 2 square units"
        - "They have the same area"
        - "The blue shape, by 14 square units"
        - "The blue shape, by 2 square units"
      option_explanations:
        - |
          The red shape is a neat rectangle, but it covers 12 squares and the blue shape covers 14, so red is smaller.
        - |
          Count both: red is 4 + 4 + 4 = 12 and blue is 2 + 5 + 5 + 2 = 14. The numbers are not the same.
        - |
          14 is the whole area of the blue shape. The question asks how much more it has than red: 14 − 12 = 2.
        - |
          Correct. Blue covers 2 + 5 + 5 + 2 = 14 squares and red covers 4 + 4 + 4 = 12, and 14 − 12 = 2.
      answer: 3

    - slug: g3math-w05-q05
      type: numeric
      topic_code: "3.MD.C.6"
      source: "IM K–5 Math Grade 3, Unit 2, Section A"
      points: 1
      stimulus: |
        Use the grid with the red shape and the blue shape. Each small square is 1 square unit.
      prompt: |
        How many square units do the two shapes cover in all?
      answer: { value: 26, tolerance: 0 }
      explanation: |
        The red shape is 12 square units and the blue shape is 14 square units. Together they cover 12 + 14 = 26 square units.

    - slug: g3math-w05-q06
      type: fill_blank
      topic_code: "3.MD.C.5"
      source: "IM K–5 Math Grade 3, Unit 2, Section A"
      points: 1
      prompt: |
        A square that is 1 unit long on each side is called a ____.
      answer: ["unit square", "a unit square", "the unit square", "unit squares", "square unit", "a square unit"]
      explanation: |
        It is a unit square. Its area is 1 square unit, and we measure area by counting how many unit squares cover a shape.

    - slug: g3math-w05-q07
      type: true_false
      topic_code: "3.MD.C.5"
      source: "IM K–5 Math Grade 3, Unit 2, Section A"
      points: 1
      prompt: |
        True or false: when you measure area with square tiles, it is fine to leave small gaps between the tiles.
      answer: false
      explanation: |
        False. A gap is space that is not covered, so it does not get counted and the area comes out too small. Tiles must touch edge to edge with no gaps and no overlaps.

    - slug: g3math-w05-q08
      type: multi_select
      topic_code: "3.MD.C.6"
      source: "IM K–5 Math Grade 3, Unit 2, Section A"
      points: 2
      partial_credit: true
      prompt: |
        Kofi covers a rectangle with square-centimeter tiles. He makes 2 rows of 6 tiles, with no gaps and no overlaps. Which describe the area of the rectangle? Select all that apply.
      options:
        - "12 square centimeters"
        - "12 centimeters"
        - "6 + 6 square centimeters"
        - "8 square centimeters"
        - "The same as the number of tiles in 6 rows of 2 tiles"
      option_explanations:
        - |
          True. There are 2 rows of 6 tiles, which is 12 tiles, and each tile is 1 square centimeter.
        - |
          False. Centimeters measure length. An area is said in square units, so the area is 12 square centimeters.
        - |
          True. Each row has 6 square centimeters, so the two rows together are 6 + 6 = 12 square centimeters.
        - |
          False. 8 adds the 2 rows to the 6 tiles in a row (2 + 6). To find the area, count all the tiles: 12.
        - |
          True. 6 rows of 2 tiles is also 12 tiles. Turning the rectangle on its side does not change its area.
      answer: [0, 2, 4]

    - slug: g3math-w05-q09
      type: multiple_choice
      topic_code: "3.MD.C.6"
      source: "IM K–5 Math Grade 3, Unit 2, Section A"
      points: 1
      prompt: |
        Lena covers a square sticker with square-centimeter tiles. She makes 3 rows of 3 tiles, with no gaps or overlaps. What is the area of the sticker?
      options:
        - "9 centimeters"
        - "9 square centimeters"
        - "3 square centimeters"
        - "12 square centimeters"
      option_explanations:
        - |
          9 is the right number, but centimeters measure length. Area is measured in square centimeters.
        - |
          Correct. 3 rows of 3 tiles is 3 + 3 + 3 = 9 tiles, and each tile covers 1 square centimeter.
        - |
          3 is the number of tiles in just one row. There are 3 rows, so count all of them: 3 + 3 + 3 = 9.
        - |
          12 centimeters is the distance around the outside of the sticker (3 + 3 + 3 + 3). Area counts the tiles inside: 9.
      answer: 1

    - slug: g3math-w05-q10
      type: multiple_choice
      topic_code: "3.MD.C.5"
      source: "IM K–5 Math Grade 3, Unit 2, Section A"
      points: 1
      prompt: |
        Ravi covers a desk with 6 big square tiles. Sofia covers the same desk with small square tiles, with no gaps or overlaps. Which sentence is true?
      options:
        - "Sofia uses 6 tiles too, because it is the same desk."
        - "Ravi uses more tiles, because his tiles are bigger."
        - "Sofia uses more tiles, because each of her tiles covers less space."
        - "Sofia uses more tiles, so the desk has a bigger area when she covers it."
      option_explanations:
        - |
          The desk is the same, but the tiles are not. Small tiles each cover less space, so it takes more than 6 of them.
        - |
          Bigger tiles each cover more space, so Ravi needs fewer tiles than Sofia, not more.
        - |
          Correct. Each small tile covers less of the desk, so Sofia needs more of them to cover the same space.
        - |
          Sofia does use more tiles, but the desk itself does not grow. The same space is just counted in smaller units.
      answer: 2

    - slug: g3math-w05-q11
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the picture graph "Tiles Used in Art Class". One square stands for 5 tiles.
      figure: figures/w05-tiles-picture-graph.svg
      figure_alt: "A picture graph titled Tiles Used in Art Class. Monday has 4 squares, Tuesday has 6 squares and Wednesday has 3 squares. The key says one square equals 5 tiles."
      prompt: |
        How many tiles were used on Tuesday?
      options:
        - "30"
        - "6"
        - "25"
        - "35"
      option_explanations:
        - |
          Correct. Tuesday has 6 squares and each square is 5 tiles: 5, 10, 15, 20, 25, 30.
        - |
          6 is the number of squares in Tuesday's row, but each square stands for 5 tiles, so count by 5s.
        - |
          25 is only 5 squares counted by 5s. Tuesday has 6 squares, so keep going one more: 30.
        - |
          35 would be 7 squares. Tuesday has 6 squares, and 6 fives make 30.
      answer: 0

    - slug: g3math-w05-q12
      type: numeric
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the picture graph "Tiles Used in Art Class". One square stands for 5 tiles.
      prompt: |
        How many more tiles were used on Tuesday than on Wednesday?
      answer: { value: 15, tolerance: 0 }
      explanation: |
        Tuesday is 6 squares, or 30 tiles. Wednesday is 3 squares, or 15 tiles. 30 − 15 = 15 more tiles on Tuesday. (Tuesday has 3 more squares, and 3 fives make 15.)

    - slug: g3math-w05-q13
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the picture graph "Tiles Used in Art Class". One square stands for 5 tiles.
      prompt: |
        How many tiles were used on all three days together?
      options:
        - "13"
        - "60"
        - "55"
        - "65"
      option_explanations:
        - |
          13 is the number of squares on the graph (4 + 6 + 3). Each square is 5 tiles, so the total is 13 fives.
        - |
          60 would be 12 squares. Count again: 4 + 6 + 3 = 13 squares, which is 65 tiles.
        - |
          55 is too small. Monday is 20, Tuesday is 30 and Wednesday is 15, and 20 + 30 + 15 = 65.
        - |
          Correct. Monday 20 + Tuesday 30 + Wednesday 15 = 65 tiles. (13 squares, and 13 fives make 65.)
      answer: 3

    - slug: g3math-w05-q14
      type: multiple_choice
      topic_code: "3.OA.A.1"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 1
      prompt: |
        Which shows 4 groups of 3 crayons?
      options:
        - "4 + 3"
        - "4 × 3"
        - "3 + 3 + 3"
        - "4 × 4"
      option_explanations:
        - |
          4 + 3 puts one group of 4 with one group of 3. Four groups of 3 means 3 four times, which is 4 × 3.
        - |
          Correct. 4 × 3 means 4 groups with 3 in each group: 3 + 3 + 3 + 3 = 12 crayons.
        - |
          3 + 3 + 3 is only 3 groups of 3. One more group of 3 is needed to make 4 groups.
        - |
          4 × 4 is 4 groups of 4. Each group here has 3 crayons, so the second number should be 3.
      answer: 1

    - slug: g3math-w05-q15
      type: short_answer
      topic_code: "3.MD.C.5"
      source: "IM K–5 Math Grade 3, Unit 2, Section A"
      points: 2
      prompt: |
        Nia covers a poster with sticky notes that are all the same size, with no gaps or overlaps. She uses 3 rows of 5 notes.

        (a) What is the area of the poster, in sticky notes?
        (b) Tomas covers the same poster with bigger square notes. Will he need more notes or fewer notes than Nia? Explain.
      answer: |
        (a) 15 sticky notes, because 5 + 5 + 5 = 15.
        (b) Fewer. Each bigger note covers more of the poster, so it takes fewer of them to cover the same space.
      explanation: |
        Two points.

        (a) 1 pt: 15 sticky notes (or 15 notes). Counting 3 rows of 5 or adding 5 + 5 + 5 is fine.

        (b) 1 pt: says "fewer" and explains that bigger notes each cover more space. "Fewer" with no reason earns no point.
