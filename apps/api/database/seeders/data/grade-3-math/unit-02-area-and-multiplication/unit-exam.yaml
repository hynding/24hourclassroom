unit: 2
description: |
  20 questions · about 40 minutes · every standard of Unit 2: what area is and how unit squares measure it
  (3.MD.C.5), counting square units including half squares (3.MD.C.6), finding the area of rectangles by
  multiplying side lengths and of shapes made of rectangles by adding (3.MD.C.7), and splitting a rectangle to
  multiply (3.OA.B.5). One stimulus set shares a tiled rectangle across two items. Multiple choice, select-all,
  true/false and number answers are graded at once; the fill-in word is matched automatically; the short answer
  is checked by your teacher against the scoring notes.
questions:
  # ---- What area is (3.MD.C.5) and counting squares (3.MD.C.6)
  - slug: g3math-u02-check-q01
    type: multiple_choice
    topic_code: "3.MD.C.5"
    source: "IM K–5 Math Grade 3, Unit 2, Section A"
    points: 1
    prompt: |
      Which question is about area?
    options:
      - "How much carpet does it take to cover the classroom floor?"
      - "How long is the hallway?"
      - "How tall is the classroom door?"
      - "How far is it all the way around the playground fence?"
    option_explanations:
      - |
        Correct. Covering a floor is about how much flat space it takes up, and that is area.
      - |
        How long something is asks for a length, measured with a ruler or a tape, not an area.
      - |
        How tall something is asks for a height, which is a length, not the space a shape covers.
      - |
        The distance around a shape is its perimeter. Area is the space inside, not the edge.
    answer: 0

  - slug: g3math-u02-check-q02
    type: multiple_choice
    topic_code: "3.MD.C.6"
    source: "IM K–5 Math Grade 3, Unit 2, Section A"
    points: 1
    figure: figures/u02-grid-shape.svg
    figure_alt: "A green shape on a grid 8 squares wide and 5 squares tall. From the top, the rows of the shape have 4 squares, 4 squares, 6 squares and 4 squares. The first three rows start at the left edge; the fourth row sits under the right 4 squares of the third row. The bottom row of the grid is empty. A key shows one green square equals 1 square centimeter."
    prompt: |
      What is the area of the green shape?
    options:
      - "16 square centimeters"
      - "18 square centimeters"
      - "40 square centimeters"
      - "18 centimeters"
    option_explanations:
      - |
        16 is two squares short. Count each row: 4 + 4 + 6 + 4 = 18 square centimeters.
      - |
        Correct. The rows have 4, 4, 6 and 4 squares, and 4 + 4 + 6 + 4 = 18 square centimeters.
      - |
        40 counts every square on the grid (8 × 5). Only the green squares are part of the shape.
      - |
        18 is the right count, but centimeters measure length. Each square is 1 square centimeter.
    answer: 1

  - slug: g3math-u02-check-q03
    type: fill_blank
    topic_code: "3.MD.C.5"
    source: "IM K–5 Math Grade 3, Unit 2, Section A"
    points: 1
    prompt: |
      The amount of flat space a shape covers, measured in square units, is called its ____.
    answer: ["area", "the area", "areas"]
    explanation: |
      Area. We measure it by counting the unit squares that cover a shape with no gaps and no overlaps.

  - slug: g3math-u02-check-q04
    type: true_false
    topic_code: "3.MD.C.5"
    source: "IM K–5 Math Grade 3, Unit 2, Section A"
    points: 1
    prompt: |
      True or false: a shape covered by 10 square-inch tiles has the same area as a shape covered by 10 square-centimeter tiles.
    answer: false
    explanation: |
      False. A square inch is bigger than a square centimeter, so 10 square inches covers more space than 10 square centimeters. The unit matters, not just the number.

  - slug: g3math-u02-check-q05
    type: multiple_choice
    topic_code: "3.MD.C.6"
    source: "IM K–5 Math Grade 3, Unit 2, Section A"
    points: 1
    prompt: |
      A shape on a grid covers 8 whole squares and 2 half squares. What is its area?
    options:
      - "10 square units"
      - "8 square units"
      - "9 square units"
      - "7 square units"
    option_explanations:
      - |
        10 counts each half square as a whole one. Two halves make just 1 whole square, so the area is 8 + 1 = 9.
      - |
        8 leaves out the half squares. They are part of the shape too: two halves make 1 more square unit.
      - |
        Correct. Two half squares make 1 whole square, so the area is 8 + 1 = 9 square units.
      - |
        Half squares add space; they do not take it away. The area is 8 + 1 = 9 square units.
    answer: 2

  # ---- Stimulus set: a tiled rectangle (3.MD.C.7)
  - slug: g3math-u02-check-q06
    type: multiple_choice
    topic_code: "3.MD.C.7"
    source: "IM K–5 Math Grade 3, Unit 2, Section B"
    points: 1
    stimulus: |
      Use the rectangle of square-inch tiles.
    figure: figures/u02-rectangle-grid.svg
    figure_alt: "A rectangle tiled with blue square-inch tiles, with no gaps. It has 5 rows, and each row has 6 tiles. A key shows one blue square equals 1 square inch."
    prompt: |
      Which equation tells the area of the rectangle, in square inches?
    options:
      - "5 + 6 = 11"
      - "5 × 5 = 25"
      - "6 × 6 = 36"
      - "5 × 6 = 30"
    option_explanations:
      - |
        5 + 6 adds the side lengths. The rectangle holds 5 rows of 6 tiles, so multiply: 5 × 6.
      - |
        5 × 5 would mean 5 tiles in each row. Count one row again: it has 6 tiles.
      - |
        6 × 6 would mean 6 rows. Count the rows again: there are 5 rows of 6 tiles.
      - |
        Correct. There are 5 rows with 6 tiles in each row, and 5 × 6 = 30 square inches.
    answer: 3

  - slug: g3math-u02-check-q07
    type: numeric
    topic_code: "3.MD.C.7"
    source: "IM K–5 Math Grade 3, Unit 2, Section B"
    points: 1
    stimulus: |
      Use the rectangle of square-inch tiles.
    prompt: |
      Ivan adds one more row of 6 tiles to the bottom of the rectangle. What is the new area, in square inches?
    answer: { value: 36, tolerance: 0 }
    explanation: |
      Now there are 6 rows of 6 tiles. 6 × 6 = 36 square inches. (Or: the old area 30 plus one row of 6 is 30 + 6 = 36.)

  # ---- Area of rectangles (3.MD.C.7)
  - slug: g3math-u02-check-q08
    type: multiple_choice
    topic_code: "3.MD.C.7"
    source: "IM K–5 Math Grade 3, Unit 2, Section B"
    points: 1
    prompt: |
      A rug is a rectangle 8 feet long and 4 feet wide. What is its area?
    options:
      - "32 square feet"
      - "12 square feet"
      - "24 square feet"
      - "28 square feet"
    option_explanations:
      - |
        Correct. The rug would hold 4 rows of 8 one-foot squares, and 4 × 8 = 32 square feet.
      - |
        12 is 8 + 4, the side lengths added. To find area, multiply them: 8 × 4 = 32.
      - |
        24 is the distance around the rug (8 + 4 + 8 + 4). Area is the space inside: 8 × 4 = 32.
      - |
        28 is 7 × 4. The long side is 8 feet, so the area is 8 × 4 = 32 square feet.
    answer: 0

  - slug: g3math-u02-check-q09
    type: numeric
    topic_code: "3.MD.C.7"
    source: "IM K–5 Math Grade 3, Unit 2, Section B"
    points: 1
    prompt: |
      A rectangle has an area of 42 square inches. One side is 6 inches long. How many inches long is the other side?
    answer: { value: 7, tolerance: 0 }
    explanation: |
      Think: 6 × what = 42? Since 6 × 7 = 42, the other side is 7 inches long.

  - slug: g3math-u02-check-q10
    type: multi_select
    topic_code: "3.MD.C.7"
    source: "IM K–5 Math Grade 3, Unit 2, Section B"
    points: 2
    partial_credit: true
    prompt: |
      Which rectangles have an area of 36 square units? Select all that apply.
    options:
      - "4 units by 9 units"
      - "6 units by 6 units"
      - "30 units by 6 units"
      - "3 units by 12 units"
      - "5 units by 7 units"
    option_explanations:
      - |
        Yes. 4 rows of 9 squares is 4 × 9 = 36 square units.
      - |
        Yes. 6 rows of 6 squares is 6 × 6 = 36 square units.
      - |
        No. 30 + 6 makes 36, but area means multiplying: 30 × 6 = 180 square units.
      - |
        Yes. 3 rows of 12 squares is 12 + 12 + 12 = 36 square units.
      - |
        No. 5 × 7 = 35 square units, one less than 36.
    answer: [0, 1, 3]

  - slug: g3math-u02-check-q11
    type: multiple_choice
    topic_code: "3.MD.C.7"
    source: "IM K–5 Math Grade 3, Unit 2, Section B"
    points: 1
    prompt: |
      A square sandbox has sides that are each 7 meters long. What is its area?
    options:
      - "28 square meters"
      - "49 square meters"
      - "14 square meters"
      - "42 square meters"
    option_explanations:
      - |
        28 is the distance around the sandbox (7 + 7 + 7 + 7). Area is the space inside: 7 × 7.
      - |
        Correct. A square's sides are all the same, so the area is 7 × 7 = 49 square meters.
      - |
        14 is 7 + 7, two sides added. Area is side length times side length: 7 × 7 = 49.
      - |
        42 is 6 × 7. Both sides of the square are 7 meters, so the area is 7 × 7 = 49.
    answer: 1

  - slug: g3math-u02-check-q12
    type: numeric
    topic_code: "3.MD.C.7"
    source: "IM K–5 Math Grade 3, Unit 2, Section C"
    points: 1
    figure: figures/u02-composite.svg
    figure_alt: "A green shape titled Name Sign, made of a tall part on the left and a short part on the right, with their bottoms lined up. Going around from the top left corner, the side lengths are: top 4 cm, then down 4 cm, then across 6 cm, then down the right side 3 cm, the bottom 10 cm, and the left side 7 cm. All corners are square corners."
    prompt: |
      What is the area of the name sign, in square centimeters?
    answer: { value: 46, tolerance: 0 }
    explanation: |
      Split it up and down. The tall part is 4 cm by 7 cm: 4 × 7 = 28. The short part is 6 cm by 3 cm: 6 × 3 = 18. 28 + 18 = 46 square centimeters. (Split across instead: 10 × 3 = 30 and 4 × 4 = 16, and 30 + 16 = 46.)

  # ---- Splitting to multiply (3.OA.B.5)
  - slug: g3math-u02-check-q13
    type: multiple_choice
    topic_code: "3.OA.B.5"
    source: "IM K–5 Math Grade 3, Unit 2, Section C"
    points: 1
    prompt: |
      Lucia splits a rectangle 6 units by 8 units into two parts to find 6 × 8. What number makes her equation true? 6 × 8 = 6 × 5 + 6 × ?
    options:
      - "5"
      - "8"
      - "3"
      - "6"
    option_explanations:
      - |
        With 5, the parts would be 6 × 5 + 6 × 5, which is 6 × 10. The 8 splits into 5 and 3.
      - |
        8 is the whole side. Lucia already used 5 of it, so the other part is what is left: 8 − 5 = 3.
      - |
        Correct. The 8 is split into 5 + 3, so 6 × 8 = 6 × 5 + 6 × 3 = 30 + 18 = 48.
      - |
        6 is the factor that stays in both parts. The missing number is the rest of the 8, which is 3.
    answer: 2

  - slug: g3math-u02-check-q14
    type: multiple_choice
    topic_code: "3.OA.B.5"
    source: "IM K–5 Math Grade 3, Unit 1, Section C"
    points: 1
    prompt: |
      A rectangle 4 units by 7 units is turned on its side, so now it is 7 units by 4 units. Which sentence is true?
    options:
      - "The area becomes 7 + 4 = 11 square units."
      - "The area gets bigger, because the rectangle is now taller."
      - "The area becomes 4 × 4 = 16 square units."
      - "The area stays 28 square units, because 4 × 7 = 7 × 4."
    option_explanations:
      - |
        Adding the sides never gives the area. The rectangle still covers 4 rows of 7, or 7 rows of 4: 28 square units.
      - |
        Turning a shape does not change how much space it covers. It is the same rectangle, so the area is the same.
      - |
        4 × 4 would be a square. The rectangle is still 7 by 4, so its area is 7 × 4 = 28.
      - |
        Correct. Turning the rectangle changes how it looks, not how much space it covers, and 4 × 7 = 7 × 4 = 28.
    answer: 3

  - slug: g3math-u02-check-q15
    type: numeric
    topic_code: "3.OA.B.5"
    source: "IM K–5 Math Grade 3, Unit 2, Section C"
    points: 1
    prompt: |
      Mo splits a rectangle 9 units by 7 units into a part 9 by 5 and a part 9 by 2. What is the area of the whole rectangle, in square units?
    answer: { value: 63, tolerance: 0 }
    explanation: |
      9 × 5 = 45 and 9 × 2 = 18. 45 + 18 = 63 square units, so 9 × 7 = 63.

  # ---- Mixed
  - slug: g3math-u02-check-q16
    type: multiple_choice
    topic_code: "3.MD.C.5"
    source: "IM K–5 Math Grade 3, Unit 2, Section A"
    points: 1
    prompt: |
      Rosa covers a table with 12 big square tiles. Eli covers the same table with 48 small square tiles. Which sentence is true?
    options:
      - "The table's area did not change; Eli's tiles are just smaller."
      - "When Eli covers it, the table has a bigger area."
      - "Rosa made a mistake, because she used fewer tiles."
      - "The area of the table is 60 tiles."
    option_explanations:
      - |
        Correct. It is the same table, so it covers the same space. Smaller tiles each cover less, so Eli needs more of them.
      - |
        The table does not grow. Eli counted the same space in smaller units, so his number is bigger.
      - |
        Both are right. Bigger tiles each cover more space, so Rosa needs fewer of them for the same table.
      - |
        60 adds the two counts, but they are two ways of measuring one table, in two different-size units.
    answer: 0

  - slug: g3math-u02-check-q17
    type: multiple_choice
    topic_code: "3.MD.C.7"
    source: "IM K–5 Math Grade 3, Unit 2, Section B"
    points: 1
    prompt: |
      One rug is 5 feet by 8 feet. Another rug is 6 feet by 6 feet. Which rug has the greater area, and by how much?
    options:
      - "The 6 by 6 rug, by 4 square feet"
      - "They have the same area"
      - "The 5 by 8 rug, by 4 square feet"
      - "The 5 by 8 rug, by 1 square foot"
    option_explanations:
      - |
        The 6 by 6 rug is 36 square feet and the 5 by 8 rug is 40, so the 6 by 6 rug is the smaller one.
      - |
        Multiply each: 5 × 8 = 40 and 6 × 6 = 36. The areas are not the same.
      - |
        Correct. 5 × 8 = 40 and 6 × 6 = 36, and 40 − 36 = 4 square feet.
      - |
        1 comes from adding the sides (5 + 8 = 13 and 6 + 6 = 12). Multiply instead: 40 − 36 = 4.
    answer: 2

  - slug: g3math-u02-check-q18
    type: multiple_choice
    topic_code: "3.MD.C.7"
    source: "IM K–5 Math Grade 3, Unit 2, Section C"
    points: 1
    prompt: |
      A play mat is made of two rectangles that touch but do not overlap. One is 2 feet by 5 feet and the other is 4 feet by 3 feet. What is the area of the whole mat?
    options:
      - "14 square feet"
      - "22 square feet"
      - "10 square feet"
      - "120 square feet"
    option_explanations:
      - |
        14 adds all four side lengths (2 + 5 + 4 + 3). Find each rectangle's area first by multiplying.
      - |
        Correct. 2 × 5 = 10 and 4 × 3 = 12, and 10 + 12 = 22 square feet.
      - |
        10 is only the first rectangle (2 × 5). Add the second one, 4 × 3 = 12, to get 22.
      - |
        120 multiplies the two areas (10 × 12). The parts sit side by side, so their areas are added: 10 + 12 = 22.
    answer: 1

  - slug: g3math-u02-check-q19
    type: short_answer
    topic_code: "3.MD.C.7"
    source: "IM K–5 Math Grade 3, Unit 2, Section C"
    points: 3
    prompt: |
      Ms. Rivera's reading rug is a rectangle 9 feet long and 6 feet wide.

      (a) Split the rug into two smaller rectangles using facts you know. Write the side lengths and the area of each part.
      (b) What is the area of the whole rug?
      (c) A second rug is 8 feet by 7 feet. Which rug has the greater area, and by how much?
    answer: |
      (a) Split the 9 into 5 + 4: a 5 by 6 part with area 5 × 6 = 30 square feet and a 4 by 6 part with area 4 × 6 = 24 square feet.
      (b) 30 + 24 = 54 square feet.
      (c) The second rug is 8 × 7 = 56 square feet. 56 − 54 = 2, so the second rug is greater by 2 square feet.
    explanation: |
      Three points.

      (a) 1 pt: two rectangles that together make 9 by 6 (for example 5 by 6 and 4 by 6, or 9 by 3 and 9 by 3), each with its correct area.

      (b) 1 pt: 54 square feet, found by adding the parts (or by 9 × 6).

      (c) 1 pt: names the 8 by 7 rug as greater and gives the difference, 2 square feet. Allow this point if a wrong area from (b) is carried forward correctly.

  - slug: g3math-u02-check-q20
    type: multiple_choice
    topic_code: "3.MD.C.6"
    source: "IM K–5 Math Grade 3, Unit 2, Section A"
    points: 1
    prompt: |
      Four shapes are made of unit squares. Which shape has the greatest area?
    options:
      - "3 rows of 5 squares"
      - "2 rows of 7 squares"
      - "Rows of 6, 6 and 3 squares"
      - "4 rows of 4 squares"
    option_explanations:
      - |
        3 rows of 5 is 5 + 5 + 5 = 15 square units, one less than 4 rows of 4.
      - |
        2 rows of 7 is 7 + 7 = 14 square units. Its rows are long, but there are only 2 of them.
      - |
        6 + 6 + 3 = 15 square units, one less than 4 rows of 4.
      - |
        Correct. 4 rows of 4 is 4 + 4 + 4 + 4 = 16 square units, more than 15, 14 and 15.
    answer: 3
