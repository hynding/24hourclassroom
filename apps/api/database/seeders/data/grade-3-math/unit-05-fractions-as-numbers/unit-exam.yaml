unit: 5
description: |
  20 questions · about 40 minutes · every standard of Unit 5: equal parts and unit fractions, fractions of a
  shape's area, fractions on the number line (including past 1), equivalent fractions, whole numbers as
  fractions, and comparing fractions with the same numerator or the same denominator. Two sets of questions
  share a picture. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in
  word is matched automatically; the short answer is checked by your teacher against the scoring notes.
questions:
  # ---- Equal parts and unit fractions (3.NF.A.1, 3.G.A.2)
  - slug: g3math-u05-check-q01
    type: multiple_choice
    topic_code: "3.NF.A.1"
    source: "IM K–5 Math Grade 3, Unit 5, Section A"
    points: 1
    stimulus: |
      Use the hexagon. It is split into 6 equal triangles, and 2 of them are shaded.
    figure: figures/u05-hexagon-sixths.svg
    figure_alt: "A hexagon split into 6 triangles that are all the same size, by lines from the center to each corner. The top triangle and the triangle next to it on the right are shaded blue. The other 4 triangles are white."
    prompt: |
      What fraction of the hexagon is shaded?
    options:
      - "2/6"
      - "2/4"
      - "4/6"
      - "1/6"
    option_explanations:
      - |
        Correct. The whole hexagon has 6 equal triangles and 2 are shaded, so 2/6 is shaded.
      - |
        2/4 compares the shaded triangles to the white ones. The bottom number must count all 6 triangles.
      - |
        4/6 is the white part of the hexagon. The question asks about the shaded part, which is 2 triangles.
      - |
        1/6 is one triangle. Two triangles are shaded, so the numerator is 2.
    answer: 0

  - slug: g3math-u05-check-q02
    type: multiple_choice
    topic_code: "3.G.A.2"
    source: "IM K–5 Math Grade 3, Unit 5, Section A"
    points: 1
    stimulus: |
      Use the hexagon. It is split into 6 equal triangles, and 2 of them are shaded.
    prompt: |
      What fraction of the hexagon's area is ONE triangle?
    options:
      - "1/2"
      - "6/1"
      - "1/6"
      - "2/6"
    option_explanations:
      - |
        1/2 would mean the hexagon had only 2 equal parts. It has 6 equal triangles.
      - |
        The numbers are flipped. One triangle is 1 part, and 6 equal parts make the whole hexagon.
      - |
        Correct. The 6 triangles have equal areas, so each one is 1/6 of the hexagon's area.
      - |
        2/6 is the area of the two shaded triangles together. The question asks about just one.
    answer: 2

  - slug: g3math-u05-check-q03
    type: true_false
    topic_code: "3.G.A.2"
    source: "IM K–5 Math Grade 3, Unit 5, Section A"
    points: 1
    figure: figures/u05-rectangle-four-parts.svg
    figure_alt: "A long rectangle cut by 3 lines into 4 parts of different widths. From left to right the parts get wider: the first part is the thinnest and is shaded blue, the last part is the widest. The widest part is 3 times as wide as the shaded part."
    prompt: |
      Jalen says the shaded part is 1/4 of the rectangle because the rectangle has 4 parts. True or false: Jalen is right.
    answer: false
    explanation: |
      False. Fourths must be 4 equal parts. These 4 parts have different widths, and the shaded part is the smallest one, so it is less than 1/4 of the rectangle.

  - slug: g3math-u05-check-q04
    type: multiple_choice
    topic_code: "3.NF.A.1"
    source: "IM K–5 Math Grade 3, Unit 5, Section A"
    points: 1
    prompt: |
      Which of these describes the fraction 5/8?
    options:
      - "8 copies of 1/5"
      - "5 copies of 1/5"
      - "3 copies of 1/8"
      - "5 copies of 1/8"
    option_explanations:
      - |
        This swaps the numbers. The denominator 8 says the unit fraction is 1/8, and the numerator says how many copies.
      - |
        5 copies of 1/5 make 5/5, which is 1 whole. The unit fraction must match the denominator 8.
      - |
        3 copies of 1/8 make 3/8, the part that is left over when 5/8 is taken from a whole.
      - |
        Correct. The denominator tells the unit fraction, 1/8, and the numerator tells how many: 5 copies of 1/8 make 5/8.
    answer: 3

  - slug: g3math-u05-check-q05
    type: numeric
    topic_code: "3.NF.A.1"
    source: "IM K–5 Math Grade 3, Unit 5, Section A"
    points: 1
    prompt: |
      Lucas has a granola bar cut into 4 equal pieces. He eats 1/4 of the bar. How many fourths of the bar are left?
    answer: { value: 3, tolerance: 0 }
    explanation: |
      The whole bar is 4/4. Eating 1/4 leaves 3/4, which is 3 fourths.

  # ---- Stimulus set: the number line from 0 to 2 (3.NF.A.2)
  - slug: g3math-u05-check-q06
    type: multiple_choice
    topic_code: "3.NF.A.2"
    source: "IM K–5 Math Grade 3, Unit 5, Section B"
    points: 1
    stimulus: |
      Use the number line from 0 to 2. Each whole is split into 4 equal parts. Points A and B are marked with dots.
    figure: figures/u05-number-line-to-2.svg
    figure_alt: "A number line from 0 to 2 with 9 tick marks spaced the same distance apart. 0, 1 and 2 are labeled. There are 4 equal parts from 0 to 1 and 4 equal parts from 1 to 2. A dot labeled A sits on the third tick mark after 0, one part before 1. A dot labeled B sits on the second tick mark after 1, halfway between 1 and 2."
    prompt: |
      What fraction is at point A?
    options:
      - "3/8"
      - "3/4"
      - "1/4"
      - "4/3"
    option_explanations:
      - |
        8 is the number of parts from 0 to 2. The denominator counts the parts in one whole, from 0 to 1, which is 4.
      - |
        Correct. Each whole is in fourths, and A is 3 jumps of 1/4 from 0, so A is at 3/4.
      - |
        1/4 is the distance from A to 1. Count the jumps from 0 to A instead: there are 3.
      - |
        The numbers are flipped. The 4 parts in one whole go on the bottom and the 3 jumps on top.
    answer: 1

  - slug: g3math-u05-check-q07
    type: multiple_choice
    topic_code: "3.NF.A.2"
    source: "IM K–5 Math Grade 3, Unit 5, Section B"
    points: 1
    stimulus: |
      Use the number line from 0 to 2. Each whole is split into 4 equal parts. Points A and B are marked with dots.
    prompt: |
      What fraction is at point B?
    options:
      - "6/8"
      - "2/4"
      - "6/4"
      - "4/6"
    option_explanations:
      - |
        8 counts all the parts from 0 to 2. One whole has 4 parts, so the denominator is 4.
      - |
        2/4 counts the jumps from 1, not from 0. Starting at 0, B is 6 jumps of 1/4 away.
      - |
        Correct. Counting jumps of 1/4 from 0: 1/4, 2/4, 3/4, 4/4 at 1, then 5/4, 6/4. B is at 6/4.
      - |
        The numbers are flipped. The parts in one whole (4) go on the bottom and the jumps from 0 (6) on top.
    answer: 2

  - slug: g3math-u05-check-q08
    type: numeric
    topic_code: "3.NF.A.2"
    source: "IM K–5 Math Grade 3, Unit 5, Section B"
    points: 1
    stimulus: |
      Use the number line from 0 to 2. Each whole is split into 4 equal parts. Points A and B are marked with dots.
    prompt: |
      How many fourths are there from 0 to 2?
    answer: { value: 8, tolerance: 0 }
    explanation: |
      Each whole has 4 fourths, and there are 2 wholes: 4 + 4 = 8 fourths. So 2 = 8/4.

  - slug: g3math-u05-check-q09
    type: multiple_choice
    topic_code: "3.NF.A.2"
    source: "IM K–5 Math Grade 3, Unit 5, Section B"
    points: 1
    prompt: |
      Mia splits a number line from 0 to 1 into 6 equal parts. Where does she put 1/6?
    options:
      - "At the end of the first part after 0"
      - "At the first tick mark after 1"
      - "At the sixth tick mark after 0"
      - "Halfway between 0 and 1"
    option_explanations:
      - |
        Correct. 1/6 is one jump of 1/6 from 0, so it is at the end of the first equal part.
      - |
        The first tick mark after 1 would be 7/6, which is more than 1 whole. 1/6 is less than 1.
      - |
        The sixth tick mark after 0 is 6/6, which is the same point as 1.
      - |
        Halfway is 3/6, three jumps from 0. 1/6 is just one jump.
    answer: 0

  - slug: g3math-u05-check-q10
    type: multi_select
    topic_code: "3.NF.A.2"
    source: "IM K–5 Math Grade 3, Unit 5, Section B"
    points: 2
    partial_credit: true
    prompt: |
      Which fractions are between 0 and 1 on a number line? Select all that apply.
    options:
      - "3/4"
      - "5/3"
      - "7/8"
      - "2/2"
      - "1/6"
    option_explanations:
      - |
        Yes. 3/4 is 3 of the 4 parts from 0 to 1, so it is before 1.
      - |
        No. 3/3 is already 1, so 5/3 is two thirds past 1.
      - |
        Yes. 7/8 is one eighth before 1, so it is between 0 and 1.
      - |
        No. 2/2 is both halves, which is exactly 1, not between 0 and 1.
      - |
        Yes. 1/6 is the first tick mark after 0 on a line in sixths.
    answer: [0, 2, 4]

  # ---- Equivalent fractions and whole numbers (3.NF.A.3)
  - slug: g3math-u05-check-q11
    type: multiple_choice
    topic_code: "3.NF.A.3"
    source: "IM K–5 Math Grade 3, Unit 5, Section C"
    points: 1
    figure: figures/u05-strips-thirds-sixths.svg
    figure_alt: "Two strips of the same length, one above the other, lined up at the left. The top strip is split into 3 equal parts with the first 2 shaded blue. The bottom strip is split into 6 equal parts with the first 4 shaded blue. The shading on both strips ends at the same place."
    prompt: |
      Which sentence does the picture show?
    options:
      - "2/3 is less than 4/6"
      - "2/3 is equal to 2/6"
      - "2/3 is equal to 6/4"
      - "2/3 is equal to 4/6"
    option_explanations:
      - |
        The shading on both strips ends at the same place, so neither fraction is less. They are equal.
      - |
        2/6 would be only 2 of the 6 small parts. The bottom strip has 4 of its 6 parts shaded.
      - |
        6/4 is more than 1 whole. The bottom strip shows 4 shaded parts out of 6, which is 4/6.
      - |
        Correct. 2 of 3 equal parts and 4 of 6 equal parts cover the same length of the same whole, so 2/3 = 4/6.
    answer: 3

  - slug: g3math-u05-check-q12
    type: multiple_choice
    topic_code: "3.NF.A.3"
    source: "IM K–5 Math Grade 3, Unit 5, Section C"
    points: 1
    prompt: |
      Which fraction is equal to the whole number 3?
    options:
      - "3/3"
      - "6/2"
      - "3/6"
      - "2/6"
    option_explanations:
      - |
        3/3 is three thirds, which makes just 1 whole, not 3.
      - |
        Correct. Each whole has 2 halves, so 3 wholes have 6 halves: 6/2 = 3.
      - |
        3/6 is three sixths, which is one half. It is less than 1.
      - |
        2/6 is two sixths, which is less than 1 whole.
    answer: 1

  - slug: g3math-u05-check-q13
    type: numeric
    topic_code: "3.NF.A.3"
    source: "IM K–5 Math Grade 3, Unit 5, Section C"
    points: 1
    prompt: |
      Fill in the missing numerator: 2/4 = ?/8. What number goes where the ? is?
    answer: { value: 4, tolerance: 0 }
    explanation: |
      Each fourth is two eighths. Two fourths are 2 + 2 = 4 eighths, so 2/4 = 4/8.

  - slug: g3math-u05-check-q14
    type: fill_blank
    topic_code: "3.NF.A.1"
    source: "IM K–5 Math Grade 3, Unit 5, Section A"
    points: 1
    prompt: |
      A fraction with 1 as its numerator, such as 1/3 or 1/8, is called a ____ fraction.
    answer: ["unit", "a unit"]
    explanation: |
      It is a unit fraction: it names exactly one equal part of the whole. Other fractions are built from copies of unit fractions.

  - slug: g3math-u05-check-q15
    type: multiple_choice
    topic_code: "3.NF.A.3"
    source: "IM K–5 Math Grade 3, Unit 5, Section D"
    points: 1
    prompt: |
      Which comparison is true?
    options:
      - "3/8 is less than 3/4"
      - "1/3 is greater than 1/2"
      - "4/6 is less than 2/6"
      - "5/8 is greater than 7/8"
    option_explanations:
      - |
        Correct. Both have 3 parts, and eighths are smaller parts than fourths, so 3/8 is less than 3/4.
      - |
        A whole cut into 3 parts has smaller parts than a whole cut into 2, so 1/3 is less than 1/2.
      - |
        Both are sixths, so the parts are the same size. 4 sixths is more than 2 sixths, so 4/6 is greater.
      - |
        Both are eighths, and 5 eighths is fewer than 7 eighths, so 5/8 is less than 7/8.
    answer: 0

  - slug: g3math-u05-check-q16
    type: multiple_choice
    topic_code: "3.NF.A.3"
    source: "IM K–5 Math Grade 3, Unit 5, Section D"
    points: 1
    prompt: |
      Ama and Rosa have garden beds that are the same size. Ama plants corn in 3/6 of her bed. Rosa plants corn in 3/8 of her bed. Who planted corn in more of her bed?
    options:
      - "Rosa, because 8 is greater than 6."
      - "Ama, because sixths are bigger parts than eighths."
      - "They planted the same amount, because both planted 3 parts."
      - "Rosa, because eighths are bigger parts than sixths."
    option_explanations:
      - |
        A bigger denominator means the bed is cut into more, smaller parts, so 3/8 is the smaller amount.
      - |
        Correct. Both planted 3 parts of the same size bed, and sixths are bigger than eighths, so 3/6 is greater than 3/8.
      - |
        Both planted 3 parts, but the parts are different sizes, so the amounts are not the same.
      - |
        Eighths are smaller than sixths, because the same bed is cut into more parts. Rosa planted less.
    answer: 1

  - slug: g3math-u05-check-q17
    type: numeric
    topic_code: "3.NF.A.3"
    source: "IM K–5 Math Grade 3, Unit 5, Section D"
    points: 1
    prompt: |
      Jamal's fraction has 6 as its denominator. It is greater than 4/6 and less than 6/6. What is its numerator?
    answer: { value: 5, tolerance: 0 }
    explanation: |
      All three are sixths, so compare numerators. The only whole number greater than 4 and less than 6 is 5. Jamal's fraction is 5/6.

  - slug: g3math-u05-check-q18
    type: multiple_choice
    topic_code: "3.G.A.2"
    source: "IM K–5 Math Grade 3, Unit 5, Section A"
    points: 1
    prompt: |
      A square garden is split into 8 parts with equal areas. Peas grow in 3 of the parts. What fraction of the garden's area has peas?
    options:
      - "3/5"
      - "8/3"
      - "3/8"
      - "5/8"
    option_explanations:
      - |
        3/5 compares the pea parts to the other parts. The bottom number must count all 8 equal parts.
      - |
        The numbers are flipped. The 8 equal parts make the whole, so 8 is the denominator.
      - |
        Correct. The garden has 8 equal parts and peas grow in 3, so peas cover 3/8 of the area.
      - |
        5/8 is the part of the garden without peas.
    answer: 2

  - slug: g3math-u05-check-q19
    type: short_answer
    topic_code: "3.NF.A.3"
    source: "IM K–5 Math Grade 3, Unit 5, Section C"
    points: 3
    prompt: |
      Ms. Delgado's class has two trays of cornbread that are the same size. Tray 1 is cut into 4 equal pieces. Tray 2 is cut into 8 equal pieces.

      (a) What fraction of tray 1 is one piece?
      (b) Diego eats 2 pieces from tray 2. Hana eats 1 piece from tray 1. Did they eat the same amount? Answer yes or no.
      (c) Explain how you know.
    answer: |
      (a) 1/4 of the tray.
      (b) Yes.
      (c) Diego ate 2/8 of a tray and Hana ate 1/4 of a tray. Each fourth of a tray is the same as two eighths, because tray 2 is cut into twice as many pieces. So 2/8 = 1/4, and they ate the same amount.
    explanation: |
      Three points.

      (a) 1 pt: 1/4.

      (b) 1 pt: yes.

      (c) 1 pt: names 2/8 and 1/4 (or says two eighths fit in one fourth) and explains they are equivalent, using words, a drawing of two same-size trays, fraction strips or a number line.

  - slug: g3math-u05-check-q20
    type: multiple_choice
    topic_code: "3.NF.A.3"
    source: "IM K–5 Math Grade 3, Unit 5, Section C"
    points: 1
    prompt: |
      Which pair of fractions is equivalent?
    options:
      - "3/4 and 4/3"
      - "1/4 and 4/8"
      - "2/3 and 2/6"
      - "1/2 and 3/6"
    option_explanations:
      - |
        3/4 is less than 1 and 4/3 is more than 1, so they cannot be equal.
      - |
        4/8 is one half. One fourth is equal to 2/8, not 4/8.
      - |
        2/6 is the same as 1/3, so it is only half as much as 2/3.
      - |
        Correct. Three sixths fill half of the whole, so 1/2 and 3/6 sit at the same point on a number line.
    answer: 3
