week: 17
unit: 5
title: "Equal Parts and Unit Fractions"
topics: ["3.NF.A.1", "3.G.A.2"]
guide: guides/week-17.md
guide_description: |
  How to split a shape into equal parts, how to name one equal part with a unit fraction such as 1/4, and how
  fractions such as 3/4 are made of unit fractions. Also the words numerator and denominator.
flashcards_description: |
  18 cards on equal parts, halves, thirds, fourths, sixths and eighths, unit fractions, numerator and
  denominator, and reading the shaded part of a shape or strip.

flashcards:
  - front: Equal parts → what they are
    back: |
      Parts of a whole that are all the same size. A sandwich cut into 2 equal parts gives two halves that are the same size.
    topic_code: "3.G.A.2"
  - front: Fraction → what it is
    back: |
      A number that names part of a whole, such as 1/2 or 3/4. The whole must be split into equal parts.
    topic_code: "3.NF.A.1"
  - front: Halves → how many make a whole
    back: |
      2. A whole split into 2 equal parts is split into halves, and each part is 1/2.
    topic_code: "3.NF.A.1"
  - front: Thirds → how many make a whole
    back: |
      3. A whole split into 3 equal parts is split into thirds, and each part is 1/3.
    topic_code: "3.NF.A.1"
  - front: Fourths → how many make a whole
    back: |
      4. A whole split into 4 equal parts is split into fourths (also called quarters), and each part is 1/4.
    topic_code: "3.NF.A.1"
  - front: Sixths → how many make a whole
    back: |
      6. A whole split into 6 equal parts is split into sixths, and each part is 1/6.
    topic_code: "3.NF.A.1"
  - front: Eighths → how many make a whole
    back: |
      8. A whole split into 8 equal parts is split into eighths, and each part is 1/8.
    topic_code: "3.NF.A.1"
  - front: Unit fraction → what it is
    back: |
      A fraction with 1 on top, such as 1/3 or 1/8. It names just one equal part of the whole.
    topic_code: "3.NF.A.1"
  - front: Numerator → what it tells you
    back: |
      The top number of a fraction. It tells how many equal parts you are talking about. In 3/8 the numerator is 3.
    topic_code: "3.NF.A.1"
  - front: Denominator → what it tells you
    back: |
      The bottom number of a fraction. It tells how many equal parts make one whole. In 3/8 the denominator is 8.
    topic_code: "3.NF.A.1"
  - front: 3/4 → made of which unit fractions
    back: |
      Three copies of 1/4: 1/4 + 1/4 + 1/4 = 3/4.
    topic_code: "3.NF.A.1"
  - front: 5/6 → made of which unit fractions
    back: |
      Five copies of 1/6. Count them: 1/6, 2/6, 3/6, 4/6, 5/6.
    topic_code: "3.NF.A.1"
  - front: Shape cut into 4 parts that are not the same size → fourths or not
    back: |
      Not fourths. Fourths must be 4 equal parts. Unequal parts cannot be named with a fraction like 1/4.
    topic_code: "3.G.A.2"
  - front: Strip of 8 equal parts with 3 shaded → fraction shaded
    back: |
      3/8. There are 8 equal parts in the whole (denominator) and 3 are shaded (numerator).
    topic_code: "3.NF.A.1"
  - front: Square split into 4 equal parts → each part's share of the area
    back: |
      Each part is 1/4 of the area of the square, because the 4 parts are the same size.
    topic_code: "3.G.A.2"
  - front: Two ways to cut a square into fourths
    back: |
      Cut it into 4 strips the same width, or cut it into 4 small squares with one line across and one line down. Both give 4 equal parts.
    topic_code: "3.G.A.2"
  - front: Folding a paper strip in half twice → parts you get
    back: |
      4 equal parts. The first fold makes halves, and folding again cuts each half in two, so each part is 1/4.
    topic_code: "3.NF.A.1"
  - front: Fraction of a shape → two steps to name it
    back: |
      1. Count the equal parts in the whole: that is the denominator. 2. Count the parts you want (such as shaded ones): that is the numerator.
    topic_code: "3.NF.A.1"

quiz:
  description: |
    13 questions · about 25 minutes · equal parts, unit fractions, naming the shaded part of a shape or strip,
    fractions built from unit fractions, plus review of division, area and adding within 1,000. Multiple
    choice, select-all, true/false and number answers are graded at once; the fill-in word is matched
    automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w17-q01
      type: multiple_choice
      topic_code: "3.NF.A.1"
      source: "IM K–5 Math Grade 3, Unit 5, Section A"
      points: 1
      stimulus: |
        Use the picture of the rectangle. It is split into 6 equal parts, and 1 part is shaded.
      figure: figures/w17-rectangle-sixths.svg
      figure_alt: "A rectangle split into 6 equal parts: 2 rows with 3 parts in each row. The top left part is shaded blue. The other 5 parts are white."
      prompt: |
        What fraction of the rectangle is shaded?
      options:
        - "1/5"
        - "1/6"
        - "1/3"
        - "6/1"
      option_explanations:
        - |
          5 is the number of white parts. The whole rectangle has 6 equal parts, so the bottom number is 6.
        - |
          Correct. The whole has 6 equal parts and 1 of them is shaded, so the shaded part is 1/6.
        - |
          The top row has 3 parts, but the whole rectangle has 2 rows of 3, which is 6 equal parts.
        - |
          The numbers are flipped. The bottom number tells how many parts make the whole (6), and the top tells how many are shaded (1).
      answer: 1

    - slug: g3math-w17-q02
      type: multiple_choice
      topic_code: "3.NF.A.1"
      source: "IM K–5 Math Grade 3, Unit 5, Section A"
      points: 1
      stimulus: |
        Use the picture of the rectangle. It is split into 6 equal parts, and 1 part is shaded.
      prompt: |
        What fraction of the rectangle is NOT shaded?
      options:
        - "1/6"
        - "6/5"
        - "1/5"
        - "5/6"
      option_explanations:
        - |
          1/6 is the shaded part. The question asks about the white parts, and there are 5 of them.
        - |
          The numbers are flipped. There are 6 parts in the whole, so 6 goes on the bottom, and 5 parts are white.
        - |
          The white parts are 5 of the 6 equal parts. The top number counts the white parts, so it is 5, not 1.
        - |
          Correct. 5 of the 6 equal parts are white, so 5/6 is not shaded. That is five copies of 1/6.
      answer: 3

    - slug: g3math-w17-q03
      type: multi_select
      topic_code: "3.G.A.2"
      source: "IM K–5 Math Grade 3, Unit 5, Section A"
      points: 2
      partial_credit: true
      figure: figures/w17-four-shapes.svg
      figure_alt: "Four shapes labeled A, B, C and D. A is a rectangle cut by 3 lines into 4 strips that are all the same width. B is the same size rectangle cut into 4 strips, from thin on the left to wide on the right. C is a square cut corner to corner both ways into 4 triangles that are all the same size. D is a circle cut into 3 equal parts."
      prompt: |
        Which shapes are split into fourths? Select all that apply.
      options:
        - "Shape A"
        - "Shape B"
        - "Shape C"
        - "Shape D"
      option_explanations:
        - |
          Yes. Shape A has 4 strips that are all the same width, so each strip is 1/4 of the rectangle.
        - |
          No. Shape B has 4 parts, but they are different sizes. Fourths must be 4 equal parts.
        - |
          Yes. The two lines from corner to corner make 4 triangles that are all the same size, so each is 1/4 of the square.
        - |
          No. Shape D has equal parts, but only 3 of them. That shows thirds, not fourths.
      answer: [0, 2]

    - slug: g3math-w17-q04
      type: multiple_choice
      topic_code: "3.NF.A.1"
      source: "IM K–5 Math Grade 3, Unit 5, Section A"
      points: 1
      figure: figures/w17-strip-eighths.svg
      figure_alt: "A long strip split into 8 equal parts. The first 3 parts on the left are shaded blue and the other 5 parts are white."
      prompt: |
        What fraction of the strip is shaded?
      options:
        - "3/8"
        - "3/5"
        - "5/8"
        - "8/3"
      option_explanations:
        - |
          Correct. The strip has 8 equal parts and 3 of them are shaded, so 3/8 is shaded.
        - |
          3/5 compares the shaded parts to the white parts. The bottom number must count all 8 parts of the whole.
        - |
          5/8 is the white part of the strip. The question asks about the shaded part, which is 3 parts.
        - |
          The numbers are flipped. The bottom number is how many parts make the whole strip, which is 8.
      answer: 0

    - slug: g3math-w17-q05
      type: numeric
      topic_code: "3.NF.A.1"
      source: "IM K–5 Math Grade 3, Unit 5, Section A"
      points: 1
      prompt: |
        The fraction 3/4 is made of copies of the unit fraction 1/4. How many copies of 1/4 make 3/4?
      answer: { value: 3, tolerance: 0 }
      explanation: |
        The numerator tells how many fourths: 1/4 + 1/4 + 1/4 = 3/4. So 3 copies of 1/4 make 3/4.

    - slug: g3math-w17-q06
      type: fill_blank
      topic_code: "3.NF.A.1"
      source: "IM K–5 Math Grade 3, Unit 5, Section A"
      points: 1
      prompt: |
        In the fraction 5/8, the top number, 5, tells how many equal parts we are counting. The top number of a fraction is called the ____.
      answer: ["numerator", "the numerator", "numerators"]
      explanation: |
        The top number is the numerator: it counts the parts we are talking about. The bottom number, 8, is the denominator.

    - slug: g3math-w17-q07
      type: true_false
      topic_code: "3.G.A.2"
      source: "IM K–5 Math Grade 3, Unit 5, Section A"
      points: 1
      prompt: |
        True or false: any shape that is cut into 4 parts is cut into fourths.
      answer: false
      explanation: |
        False. Fourths must be 4 equal parts. If the 4 parts are different sizes, no part is 1/4 of the shape.

    - slug: g3math-w17-q08
      type: multiple_choice
      topic_code: "3.NF.A.1"
      source: "IM K–5 Math Grade 3, Unit 5, Section A"
      points: 1
      prompt: |
        Which of these is a unit fraction?
      options:
        - "2/3"
        - "3/4"
        - "1/6"
        - "4/4"
      option_explanations:
        - |
          2/3 is two copies of 1/3. A unit fraction has 1 as its top number, and this one has 2.
        - |
          3/4 is three copies of 1/4. It is made of unit fractions, but it is not one itself.
        - |
          Correct. 1/6 has 1 on top, so it names just one equal part of a whole split into 6.
        - |
          4/4 is four fourths, which is the whole thing. A unit fraction has 1 on top, not 4.
      answer: 2

    - slug: g3math-w17-q09
      type: multiple_choice
      topic_code: "3.NF.A.1"
      source: "IM K–5 Math Grade 3, Unit 5, Section A"
      points: 1
      prompt: |
        Lena folds a paper strip in half. Then she folds it in half again and opens it up. The folds split the strip into equal parts. What fraction of the strip is each part?
      options:
        - "1/2"
        - "1/4"
        - "1/3"
        - "1/8"
      option_explanations:
        - |
          1/2 is what you get after only the first fold. The second fold cuts each half in two again.
        - |
          Correct. The first fold makes 2 equal parts and the second fold splits each one, so there are 4 equal parts. Each is 1/4.
        - |
          There are 3 fold lines when the strip is opened, but 3 lines split the strip into 4 parts, not 3.
        - |
          1/8 would need a third fold. Two folds in half make 4 equal parts.
      answer: 1

    - slug: g3math-w17-q10
      type: short_answer
      topic_code: "3.NF.A.1"
      source: "IM K–5 Math Grade 3, Unit 5, Section A"
      points: 2
      prompt: |
        The class garden is split into 3 equal parts. Kofi plants flowers in 2 of the parts.

        (a) What fraction of the garden has flowers?
        (b) Explain what each number in your fraction means for the garden.
      answer: |
        (a) 2/3 of the garden.
        (b) The 3 (denominator) means the garden is split into 3 equal parts. The 2 (numerator) means 2 of those parts have flowers. 2/3 is two copies of 1/3.
      explanation: |
        Two points.

        (a) 1 pt: 2/3 (also accept "two thirds").

        (b) 1 pt: says the bottom number is how many equal parts the whole garden has and the top number is how many parts have flowers. A labeled drawing of 3 equal parts with 2 marked also earns the point.

    - slug: g3math-w17-q11
      type: multiple_choice
      topic_code: "3.OA.A.2"
      source: "IM K–5 Math Grade 3, Unit 4, Section A"
      points: 1
      prompt: |
        Ms. Okafor has 48 stickers. She puts 6 stickers on each chart. How many charts get stickers?
      options:
        - "42"
        - "54"
        - "7"
        - "8"
      option_explanations:
        - |
          42 is 48 − 6, which takes away only one group of 6. Find how many groups of 6 fit in 48 instead.
        - |
          54 is 48 + 6. The stickers are being split into groups, so this is division, not addition.
        - |
          7 groups of 6 is only 42 stickers, and 6 stickers would be left over. One more chart is needed.
        - |
          Correct. 48 ÷ 6 = 8, because 8 groups of 6 make 48. So 8 charts get stickers.
      answer: 3

    - slug: g3math-w17-q12
      type: numeric
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section B"
      points: 1
      prompt: |
        A rug is a rectangle 7 feet long and 4 feet wide. What is its area in square feet?
      answer: { value: 28, tolerance: 0 }
      explanation: |
        Area of a rectangle = length × width. 7 × 4 = 28, so the rug covers 28 square feet.

    - slug: g3math-w17-q13
      type: multiple_choice
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section A"
      points: 1
      prompt: |
        The school library has 356 picture books and 278 chapter books. How many books is that in all?
      options:
        - "634"
        - "524"
        - "534"
        - "624"
      option_explanations:
        - |
          Correct. Ones: 6 + 8 = 14, write 4 and carry 1 ten. Tens: 5 + 7 + 1 = 13, write 3 and carry 1 hundred. Hundreds: 3 + 2 + 1 = 6. That makes 634.
        - |
          524 forgets both regroupings. 6 + 8 = 14 ones makes a new ten, and 13 tens makes a new hundred.
        - |
          534 carries the ten from the ones but forgets that 13 tens makes 1 hundred and 3 tens.
        - |
          624 carries the hundred but forgets the ten made by 6 + 8 = 14 ones.
      answer: 0
