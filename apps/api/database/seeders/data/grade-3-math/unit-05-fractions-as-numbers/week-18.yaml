week: 18
unit: 5
title: "Fractions on the Number Line"
topics: ["3.NF.A.2"]
guide: guides/week-18.md
guide_description: |
  How to split the space from 0 to 1 on a number line into equal parts, how to mark and name fractions such as
  1/3 and 3/4 on it, and how fractions keep going past 1, such as 4/3 and 5/3.
flashcards_description: |
  18 cards on number line words (tick mark, whole, interval), marking unit fractions, counting jumps to name a
  fraction, tick-mark counts, and fractions greater than 1.

flashcards:
  - front: Number line → what it is
    back: |
      A straight line with numbers placed in order at equal steps. Fractions live on it too, between the whole numbers.
    topic_code: "3.NF.A.2"
  - front: Tick mark → what it is on a number line
    back: |
      A short line across the number line that marks a point, such as 0, 1, or 1/4.
    topic_code: "3.NF.A.2"
  - front: The space from 0 to 1 → its name on a fraction number line
    back: |
      One whole. To show fractions, split this one whole into equal parts.
    topic_code: "3.NF.A.2"
  - front: Marking 1/4 on a number line → the steps
    back: |
      Split the space from 0 to 1 into 4 equal parts. 1/4 is the end of the first part after 0.
    topic_code: "3.NF.A.2"
  - front: Marking 1/3 on a number line → the steps
    back: |
      Split the space from 0 to 1 into 3 equal parts. 1/3 is the end of the first part after 0.
    topic_code: "3.NF.A.2"
  - front: Marking 3/4 on a number line → the steps
    back: |
      Split 0 to 1 into fourths, then count 3 jumps of 1/4 from 0: 1/4, 2/4, 3/4.
    topic_code: "3.NF.A.2"
  - front: Jumps of 1/6 from 0 → where 5 jumps land
    back: |
      At 5/6. Each jump is 1/6, so five jumps are 5/6.
    topic_code: "3.NF.A.2"
  - front: Fourths from 0 to 1 → how many tick marks
    back: |
      5 tick marks: 0, 1/4, 2/4, 3/4 and 1. There is always one more tick mark than parts.
    topic_code: "3.NF.A.2"
  - front: 3 tick marks between 0 and 1 → what parts they make
    back: |
      Fourths. 3 tick marks between 0 and 1 make 4 equal parts.
    topic_code: "3.NF.A.2"
  - front: Equal spaces on a number line → why they matter
    back: |
      A fraction names equal parts. If the spaces between tick marks are not equal, the marks do not show fourths or thirds.
    topic_code: "3.NF.A.2"
  - front: 4/4 on a number line → where it is
    back: |
      At 1. Four jumps of 1/4 reach the end of the first whole.
    topic_code: "3.NF.A.2"
  - front: 4/3 on a number line → where it is
    back: |
      One jump of 1/3 past 1. Count thirds from 0: 1/3, 2/3, 3/3 (which is 1), 4/3.
    topic_code: "3.NF.A.2"
  - front: Number line from 0 to 2 in thirds → how many thirds in all
    back: |
      6 thirds. Each whole has 3 thirds, and 3 + 3 = 6.
    topic_code: "3.NF.A.2"
  - front: Naming a point on a number line → the denominator
    back: |
      Count the equal parts between 0 and 1 (not 0 to 2, and not the tick marks). That count is the denominator.
    topic_code: "3.NF.A.2"
  - front: Naming a point on a number line → the numerator
    back: |
      Count the jumps from 0 to the point. That count is the numerator.
    topic_code: "3.NF.A.2"
  - front: 7/8 on a number line → close to 0 or close to 1
    back: |
      Close to 1. It is just one jump of 1/8 before 1.
    topic_code: "3.NF.A.2"
  - front: Fraction strip and number line → how they match
    back: |
      Lay a fraction strip along the line from 0 to 1. Each piece of the strip is one equal part, and its right edge is a tick mark.
    topic_code: "3.NF.A.2"
  - front: 1/8 or 1/2 → which is closer to 0 on a number line
    back: |
      1/8. A whole cut into 8 parts has small parts, so the first tick mark is very near 0.
    topic_code: "3.NF.A.2"

quiz:
  description: |
    13 questions · about 25 minutes · splitting 0 to 1 into equal parts, naming and marking fractions on a
    number line, fractions past 1, plus review of fractions of a shape, rounding and unknown factors. Multiple
    choice, select-all, true/false and number answers are graded at once; the fill-in word is matched
    automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w18-q01
      type: multiple_choice
      topic_code: "3.NF.A.2"
      source: "IM K–5 Math Grade 3, Unit 5, Section B"
      points: 1
      stimulus: |
        Use the number line. The space from 0 to 1 is split into 4 equal parts, and point P is marked with a dot.
      figure: figures/w18-number-line-fourths.svg
      figure_alt: "A number line from 0 to 1. There are 5 tick marks spaced the same distance apart: 0, three unlabeled marks, then 1. That makes 4 equal parts. A dot labeled P sits on the third tick mark after 0, one part before 1."
      prompt: |
        What fraction is at point P?
      options:
        - "3/5"
        - "1/4"
        - "3/4"
        - "4/3"
      option_explanations:
        - |
          5 is the number of tick marks. Count the equal parts between 0 and 1 instead: there are 4, so the denominator is 4.
        - |
          1/4 is the distance from P to 1. Count the jumps from 0 to P: there are 3.
        - |
          Correct. The line from 0 to 1 is in fourths, and P is 3 jumps of 1/4 from 0, so P is at 3/4.
        - |
          The numbers are flipped. The 4 equal parts make the denominator and the 3 jumps make the numerator.
      answer: 2

    - slug: g3math-w18-q02
      type: numeric
      topic_code: "3.NF.A.2"
      source: "IM K–5 Math Grade 3, Unit 5, Section B"
      points: 1
      stimulus: |
        Use the number line. The space from 0 to 1 is split into 4 equal parts, and point P is marked with a dot.
      prompt: |
        Ben starts at 0 and makes jumps of 1/4. How many jumps does he make to land on point P?
      answer: { value: 3, tolerance: 0 }
      explanation: |
        Each jump of 1/4 moves one equal part: 1/4, 2/4, 3/4. P is at 3/4, so Ben makes 3 jumps.

    - slug: g3math-w18-q03
      type: multiple_choice
      topic_code: "3.NF.A.2"
      source: "IM K–5 Math Grade 3, Unit 5, Section B"
      points: 1
      figure: figures/w18-number-line-thirds-to-2.svg
      figure_alt: "A number line from 0 to 2 with tick marks spaced the same distance apart. 0, 1 and 2 are labeled. The space from 0 to 1 is split into 3 equal parts, and so is the space from 1 to 2. A dot labeled Q sits on the second tick mark after 1, one part before 2."
      prompt: |
        What fraction is at point Q?
      options:
        - "5/3"
        - "5/6"
        - "2/3"
        - "3/5"
      option_explanations:
        - |
          Correct. Each whole is split into thirds. Counting jumps of 1/3 from 0 gives 1/3, 2/3, 3/3, 4/3, 5/3, so Q is at 5/3.
        - |
          6 is the number of parts from 0 to 2. The denominator counts the parts in one whole, from 0 to 1, which is 3.
        - |
          2/3 counts the jumps from 1, not from 0. Always start counting at 0: Q is 5 jumps of 1/3 from 0.
        - |
          The numbers are flipped. The parts in one whole (3) go on the bottom and the jumps from 0 (5) go on top.
      answer: 0

    - slug: g3math-w18-q04
      type: multi_select
      topic_code: "3.NF.A.2"
      source: "IM K–5 Math Grade 3, Unit 5, Section B"
      points: 2
      partial_credit: true
      figure: figures/w18-number-line-sixths.svg
      figure_alt: "A number line from 0 to 1 with 7 tick marks spaced the same distance apart, making 6 equal parts. Only 0 and 1 are labeled. A dot labeled R sits on the second tick mark after 0."
      prompt: |
        Which sentences about this number line are true? Select all that apply.
      options:
        - "Each part from 0 to 1 is 1/6."
        - "Point R is at 2/6."
        - "Point R is at 2/7."
        - "There are 7 tick marks from 0 to 1, counting both ends."
        - "Point R is at 1/2."
      option_explanations:
        - |
          True. The space from 0 to 1 is split into 6 equal parts, so each part is 1/6.
        - |
          True. R is 2 jumps of 1/6 from 0, so it is at 2/6.
        - |
          False. 7 is the number of tick marks, but there are only 6 equal parts, so the denominator is 6.
        - |
          True. 0, five marks in between, and 1 make 7 tick marks for 6 parts.
        - |
          False. 1/2 is halfway, which is 3 jumps of 1/6 from 0. R is only 2 jumps from 0.
      answer: [0, 1, 3]

    - slug: g3math-w18-q05
      type: fill_blank
      topic_code: "3.NF.A.2"
      source: "IM K–5 Math Grade 3, Unit 5, Section B"
      points: 1
      prompt: |
        To show fractions on a number line, we split the space from 0 to 1 into equal parts. That space from 0 to 1 is one ____.
      answer: ["whole", "one whole", "a whole", "the whole", "1 whole", "unit"]
      explanation: |
        The space from 0 to 1 is one whole. Fractions such as 1/4 and 3/4 name equal parts of that whole.

    - slug: g3math-w18-q06
      type: true_false
      topic_code: "3.NF.A.2"
      source: "IM K–5 Math Grade 3, Unit 5, Section B"
      points: 1
      prompt: |
        True or false: to show 1/4, draw 4 tick marks between 0 and 1, spaced evenly, and mark the first one after 0.
      answer: false
      explanation: |
        False. 4 tick marks between 0 and 1 split it into 5 equal parts, so the first mark would be 1/5. For fourths you need 3 tick marks between 0 and 1.

    - slug: g3math-w18-q07
      type: multiple_choice
      topic_code: "3.NF.A.2"
      source: "IM K–5 Math Grade 3, Unit 5, Section B"
      points: 1
      prompt: |
        A number line from 0 to 1 is split into eighths. Which fraction is closest to 1?
      options:
        - "1/8"
        - "3/8"
        - "5/8"
        - "7/8"
      option_explanations:
        - |
          1/8 is only one jump from 0, so it is the closest of these to 0, not to 1.
        - |
          3/8 is 3 jumps from 0 and still 5 jumps away from 1.
        - |
          5/8 is a little past halfway, but it is still 3 jumps of 1/8 away from 1.
        - |
          Correct. 7/8 is just one jump of 1/8 before 8/8, which is 1.
      answer: 3

    - slug: g3math-w18-q08
      type: numeric
      topic_code: "3.NF.A.2"
      source: "IM K–5 Math Grade 3, Unit 5, Section B"
      points: 1
      prompt: |
        Ayasha draws a number line from 0 to 1 and splits it into eighths. How many tick marks does she draw, counting the marks at 0 and at 1?
      answer: { value: 9, tolerance: 0 }
      explanation: |
        8 equal parts need one more tick mark than parts: 0, 1/8, 2/8, 3/8, 4/8, 5/8, 6/8, 7/8 and 1. That is 9 tick marks.

    - slug: g3math-w18-q09
      type: multiple_choice
      topic_code: "3.NF.A.2"
      source: "IM K–5 Math Grade 3, Unit 5, Section B"
      points: 1
      prompt: |
        The hallway from the classroom to the gym is split into 4 equal parts by lines on the floor. Amir walks from the classroom to the end of the 2nd part. What fraction of the way to the gym has he walked?
      options:
        - "2/5"
        - "2/4"
        - "1/4"
        - "4/2"
      option_explanations:
        - |
          5 counts the classroom door, the 3 lines and the gym door. The hallway has 4 equal parts, so the denominator is 4.
        - |
          Correct. The whole hallway is 4 equal parts and Amir has walked 2 of them, so he has gone 2/4 of the way.
        - |
          1/4 is just one part. Amir walked to the end of the 2nd part, so he walked 2 parts.
        - |
          The numbers are flipped. The parts in the whole hallway (4) go on the bottom and the parts walked (2) on top.
      answer: 1

    - slug: g3math-w18-q10
      type: short_answer
      topic_code: "3.NF.A.2"
      source: "IM K–5 Math Grade 3, Unit 5, Section B"
      points: 2
      prompt: |
        A number line from 0 to 2 has each whole split into 3 equal parts.

        (a) Name the fractions at the tick marks between 0 and 1.
        (b) Where on the number line is 4/3? Explain how you know.
      answer: |
        (a) 1/3 and 2/3 (then 3/3 at 1).
        (b) 4/3 is one tick mark past 1. Counting jumps of 1/3 from 0: 1/3, 2/3, 3/3 is at 1, and the next jump lands on 4/3.
      explanation: |
        Two points.

        (a) 1 pt: 1/3 and 2/3. Also naming 3/3 at 1 is fine.

        (b) 1 pt: places 4/3 one third past 1 (the first tick mark between 1 and 2) with a reason, such as counting four jumps of 1/3 from 0.

    - slug: g3math-w18-q11
      type: multiple_choice
      topic_code: "3.NF.A.1"
      source: "IM K–5 Math Grade 3, Unit 5, Section A"
      points: 1
      figure: figures/w18-circle-eighths.svg
      figure_alt: "A circle cut into 8 equal slices, like a pizza. 5 slices next to each other are shaded blue and 3 slices are white."
      prompt: |
        What fraction of the circle is shaded?
      options:
        - "5/3"
        - "3/8"
        - "8/5"
        - "5/8"
      option_explanations:
        - |
          5/3 compares the shaded slices to the white slices. The bottom number must count all 8 slices.
        - |
          3/8 is the white part. The question asks about the shaded part, which is 5 slices.
        - |
          The numbers are flipped. The 8 equal slices make the whole, so 8 is the denominator.
        - |
          Correct. The circle has 8 equal slices and 5 are shaded, so 5/8 is shaded.
      answer: 3

    - slug: g3math-w18-q12
      type: numeric
      topic_code: "3.NBT.A.1"
      source: "IM K–5 Math Grade 3, Unit 3, Section C"
      points: 1
      prompt: |
        The school collected 467 cans for the food drive. Round 467 to the nearest hundred.
      answer: { value: 500, tolerance: 0 }
      explanation: |
        467 is between 400 and 500. The tens digit is 6, so 467 is past the halfway point of 450 and rounds up to 500.

    - slug: g3math-w18-q13
      type: multiple_choice
      topic_code: "3.OA.A.4"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      prompt: |
        What number makes this equation true? 9 × ? = 54
      options:
        - "45"
        - "5"
        - "6"
        - "63"
      option_explanations:
        - |
          45 is 54 − 9, which subtracts. The equation multiplies, so find how many 9s make 54.
        - |
          9 × 5 = 45, which is one group of 9 short of 54. Try one more 9.
        - |
          Correct. 9 × 6 = 54, so the missing factor is 6. You can check with division: 54 ÷ 9 = 6.
        - |
          9 × 7 = 63, which is one group of 9 too many. Try one fewer 9.
      answer: 2
