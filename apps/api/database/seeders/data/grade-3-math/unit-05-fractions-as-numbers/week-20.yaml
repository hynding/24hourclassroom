week: 20
unit: 5
title: "Comparing Fractions"
topics: ["3.NF.A.3"]
guide: guides/week-20.md
guide_description: |
  How to compare two fractions with the same denominator (count the parts) or the same numerator (look at the
  size of the parts), how to use the words "is greater than", "is less than" and "is equal to", and why the
  wholes must be the same size.
flashcards_description: |
  18 cards on comparing fractions with the same denominator or the same numerator, ordering unit fractions,
  comparing on a number line, and why both fractions must be of the same whole.

flashcards:
  - front: Same denominator → how to compare
    back: |
      The parts are the same size, so count them. More parts is more: 5/8 is greater than 3/8.
    topic_code: "3.NF.A.3"
  - front: Same numerator → how to compare
    back: |
      Both have the same number of parts, so look at the size of the parts. Bigger parts make the greater fraction: 2/3 is greater than 2/6.
    topic_code: "3.NF.A.3"
  - front: Bigger denominator → bigger or smaller parts
    back: |
      Smaller parts. Cutting the same whole into more parts makes each part smaller, so 1/8 is less than 1/4.
    topic_code: "3.NF.A.3"
  - front: Unit fractions in order from greatest to least
    back: |
      1/2, 1/3, 1/4, 1/6, 1/8. The more parts the whole is cut into, the smaller each part.
    topic_code: "3.NF.A.3"
  - front: 1/3 or 1/6 → which is greater
    back: |
      1/3. A whole cut into 3 parts has bigger parts than a whole cut into 6.
    topic_code: "3.NF.A.3"
  - front: 3/4 or 3/8 → which is greater
    back: |
      3/4. Both are 3 parts, but fourths are bigger parts than eighths.
    topic_code: "3.NF.A.3"
  - front: 2/6 or 5/6 → which is greater
    back: |
      5/6. Both are sixths, and 5 sixths is more than 2 sixths.
    topic_code: "3.NF.A.3"
  - front: Comparing on a number line → which is greater
    back: |
      The fraction farther to the right is greater. The fraction farther to the left is less.
    topic_code: "3.NF.A.3"
  - front: Is greater than → what it means
    back: |
      Has more. "5/8 is greater than 3/8" means 5/8 is more of the whole than 3/8.
    topic_code: "3.NF.A.3"
  - front: Is less than → what it means
    back: |
      Has less. "1/6 is less than 1/2" means one sixth is a smaller amount than one half.
    topic_code: "3.NF.A.3"
  - front: Same whole → why it matters when comparing
    back: |
      Half of a small pancake is less than half of a big pancake. Only compare fractions of wholes that are the same size.
    topic_code: "3.NF.A.3"
  - front: Comparing with 1/2 → a quick check
    back: |
      For fourths, 2/4 is one half; for sixths, 3/6; for eighths, 4/8. A fraction with more parts than that is greater than 1/2.
    topic_code: "3.NF.A.3"
  - front: 4/8 or 1/2 → which is greater
    back: |
      Neither. They are equivalent: 4/8 is equal to 1/2.
    topic_code: "3.NF.A.3"
  - front: Common mistake → "1/8 is bigger because 8 is bigger"
    back: |
      Not true. The 8 means the whole is cut into 8 parts, so each part is small. 1/8 is less than 1/2.
    topic_code: "3.NF.A.3"
  - front: Fraction strips → how to compare two fractions
    back: |
      Use strips of the same length. Shade each fraction from the left. The shading that reaches farther is the greater fraction.
    topic_code: "3.NF.A.3"
  - front: 7/8 or 7/6 → which is greater
    back: |
      7/6. Sixths are bigger parts than eighths, and 7/6 is more than 1 whole while 7/8 is less than 1.
    topic_code: "3.NF.A.3"
  - front: Explaining a comparison → two good reasons
    back: |
      "The parts are the same size, and there are more of them," or "There are the same number of parts, but these parts are bigger."
    topic_code: "3.NF.A.3"
  - front: Fraction closest to 0 → how to find it on a number line
    back: |
      It is the point farthest to the left, the least fraction. Among 1/2, 1/4 and 1/8, it is 1/8.
    topic_code: "3.NF.A.3"

quiz:
  description: |
    13 questions · about 25 minutes · comparing fractions with the same denominator or the same numerator, with
    fraction strips, number lines and word problems, plus review of the number line, division facts and
    subtracting within 1,000. Multiple choice, select-all, true/false and number answers are graded at once;
    the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w20-q01
      type: multiple_choice
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section D"
      points: 1
      stimulus: |
        Use the two fraction strips. They are the same length. The top strip shows 3/4 and the bottom strip shows 3/8.
      figure: figures/w20-strips-fourths-eighths.svg
      figure_alt: "Two strips of the same length, one above the other, lined up at the left. The top strip, labeled 3/4, is split into 4 equal parts with the first 3 shaded blue. The bottom strip, labeled 3/8, is split into 8 equal parts with the first 3 shaded blue. The top shading reaches three quarters of the way across; the bottom shading stops before the middle."
      prompt: |
        Which sentence is true?
      options:
        - "3/8 is greater than 3/4 because 8 is greater than 4."
        - "3/4 is equal to 3/8 because both have 3 parts shaded."
        - "3/4 is greater than 3/8 because fourths are bigger parts than eighths."
        - "You cannot compare them because the strips have different numbers of parts."
      option_explanations:
        - |
          A bigger denominator means the whole is cut into more, smaller parts. The 3/8 shading is shorter, so 3/8 is less.
        - |
          Both have 3 parts shaded, but the parts are different sizes. The top shading reaches much farther.
        - |
          Correct. The numerators are the same, so compare the size of the parts. Fourths are bigger, so 3/4 is greater than 3/8.
        - |
          The strips are the same length, so they are the same whole, and you can compare how far the shading reaches.
      answer: 2

    - slug: g3math-w20-q02
      type: numeric
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section D"
      points: 1
      stimulus: |
        Use the two fraction strips. They are the same length. The top strip shows 3/4 and the bottom strip shows 3/8.
      prompt: |
        How many more eighths must be shaded on the bottom strip so that it shows the same amount as the top strip?
      answer: { value: 3, tolerance: 0 }
      explanation: |
        Each fourth is two eighths, so 3/4 = 6/8. The bottom strip has 3 eighths shaded, and 6 − 3 = 3 more eighths are needed.

    - slug: g3math-w20-q03
      type: multi_select
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section D"
      points: 2
      partial_credit: true
      figure: figures/w20-number-line-eighths.svg
      figure_alt: "A number line from 0 to 1 split into 8 equal parts by tick marks spaced the same distance apart. Only 0 and 1 are labeled. There are three dots: one labeled 2/8 on the second tick mark after 0, one labeled 5/8 on the fifth tick mark, and one labeled 7/8 on the seventh tick mark, one part before 1."
      prompt: |
        Which sentences are true? Select all that apply.
      options:
        - "5/8 is greater than 2/8."
        - "7/8 is less than 5/8."
        - "Of two points on this line, the one farther to the right is the greater fraction."
        - "2/8 is greater than 1/2."
        - "7/8 is closer to 1 than to 0."
      option_explanations:
        - |
          True. 5/8 is to the right of 2/8, and 5 eighths is more than 2 eighths.
        - |
          False. 7/8 is to the right of 5/8, so 7/8 is greater than 5/8.
        - |
          True. Numbers get greater as you move right on a number line.
        - |
          False. 1/2 is 4/8, the middle tick mark. 2/8 is to its left, so 2/8 is less than 1/2.
        - |
          True. 7/8 is just one jump of 1/8 from 1 but seven jumps from 0.
      answer: [0, 2, 4]

    - slug: g3math-w20-q04
      type: true_false
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section D"
      points: 1
      figure: figures/w20-two-pancakes.svg
      figure_alt: "Two round pancakes side by side. The small pancake on the left is about half as wide as the big pancake on the right. Each pancake is cut down the middle into 2 equal halves, and the left half of each one is shaded blue."
      prompt: |
        True or false: the shaded half of the small pancake is the same amount of pancake as the shaded half of the big pancake.
      answer: false
      explanation: |
        False. Both are 1/2, but of different wholes. Half of the big pancake is much more pancake than half of the small one. Only compare fractions of wholes that are the same size.

    - slug: g3math-w20-q05
      type: multiple_choice
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section D"
      points: 1
      prompt: |
        Which fraction is greater than 3/6?
      options:
        - "2/6"
        - "5/6"
        - "1/6"
        - "3/8"
      option_explanations:
        - |
          2/6 has the same size parts as 3/6 but fewer of them, so 2/6 is less than 3/6.
        - |
          Correct. Both are sixths, so the parts are the same size, and 5 sixths is more than 3 sixths.
        - |
          1/6 is just one sixth, which is less than three sixths.
        - |
          3/8 has the same number of parts as 3/6, but eighths are smaller parts, so 3/8 is less than 3/6.
      answer: 1

    - slug: g3math-w20-q06
      type: multiple_choice
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section D"
      points: 1
      prompt: |
        Which unit fraction is the least?
      options:
        - "1/2"
        - "1/3"
        - "1/4"
        - "1/8"
      option_explanations:
        - |
          1/2 is the greatest of these. A whole cut into only 2 parts has the biggest parts.
        - |
          1/3 is one of 3 parts, which is bigger than one of 4 or one of 8 parts of the same whole.
        - |
          1/4 is bigger than 1/8, because cutting a whole into 4 parts makes bigger parts than cutting it into 8.
        - |
          Correct. The whole is cut into the most parts, 8, so each part is the smallest. 1/8 is the least.
      answer: 3

    - slug: g3math-w20-q07
      type: multiple_choice
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section D"
      points: 1
      prompt: |
        Zara and Eli run on the same 1-mile track at recess. Zara runs 2/3 of a mile. Eli runs 2/4 of a mile. Who runs farther?
      options:
        - "Zara, because thirds are bigger parts than fourths."
        - "Eli, because 4 is greater than 3."
        - "They run the same distance, because both run 2 parts."
        - "Eli, because fourths are bigger parts than thirds."
      option_explanations:
        - |
          Correct. Both ran 2 parts of the same mile, and a third of a mile is longer than a fourth, so 2/3 is greater than 2/4.
        - |
          A bigger denominator means the mile is cut into more, shorter parts. That makes 2/4 the shorter run.
        - |
          Both ran 2 parts, but the parts are not the same size, so the distances are different.
        - |
          Fourths are smaller than thirds, because the mile is cut into more parts. Eli ran the shorter distance.
      answer: 0

    - slug: g3math-w20-q08
      type: fill_blank
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section D"
      points: 1
      prompt: |
        2/3 and 2/8 have the same numerator. When two fractions have the same numerator, the one with the smaller ____ is the greater fraction.
      answer: ["denominator", "the denominator", "denominators", "bottom number", "the bottom number"]
      explanation: |
        A smaller denominator means the whole is cut into fewer, bigger parts. So 2/3 is greater than 2/8.

    - slug: g3math-w20-q09
      type: numeric
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section D"
      points: 1
      prompt: |
        Nadia's fraction has 8 as its denominator. It is greater than 3/8 and less than 5/8. What is its numerator?
      answer: { value: 4, tolerance: 0 }
      explanation: |
        All three fractions are eighths, so compare the numerators. The only whole number greater than 3 and less than 5 is 4. Nadia's fraction is 4/8.

    - slug: g3math-w20-q10
      type: short_answer
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section D"
      points: 2
      prompt: |
        Two granola bars are the same size. Malik eats 1/6 of one bar. Rosa eats 1/4 of the other bar.

        (a) Compare 1/6 and 1/4. Write a sentence using "is greater than" or "is less than".
        (b) Explain how you know.
      answer: |
        (a) 1/6 is less than 1/4 (or: 1/4 is greater than 1/6).
        (b) Both are one part of the same size bar. A bar cut into 6 parts has smaller parts than a bar cut into 4 parts, so one sixth is less than one fourth. Rosa ate more.
      explanation: |
        Two points.

        (a) 1 pt: a correct comparison sentence, either "1/6 is less than 1/4" or "1/4 is greater than 1/6".

        (b) 1 pt: a reason about the size of the parts (more parts in the same whole means smaller parts), or a correct description of strips or a number line.

    - slug: g3math-w20-q11
      type: multiple_choice
      topic_code: "3.NF.A.2"
      source: "IM K–5 Math Grade 3, Unit 5, Section B"
      points: 1
      prompt: |
        A number line from 0 to 1 is split into fourths. Which fraction is at the tick mark exactly halfway between 0 and 1?
      options:
        - "2/4"
        - "1/4"
        - "4/2"
        - "3/4"
      option_explanations:
        - |
          Correct. Fourths have 3 tick marks between 0 and 1, and the middle one is 2 jumps of 1/4 from 0: 2/4.
        - |
          1/4 is the first tick mark after 0, which is only a quarter of the way to 1.
        - |
          The numbers are flipped. The 4 equal parts go on the bottom and the 2 jumps go on top.
        - |
          3/4 is the third tick mark after 0, which is past the halfway point.
      answer: 0

    - slug: g3math-w20-q12
      type: numeric
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 1
      prompt: |
        A teacher puts 63 markers into 9 cups, with the same number in each cup. How many markers go in each cup?
      answer: { value: 7, tolerance: 0 }
      explanation: |
        63 ÷ 9 = 7, because 9 × 7 = 63. Each cup gets 7 markers.

    - slug: g3math-w20-q13
      type: multiple_choice
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section B"
      points: 1
      prompt: |
        A school has 502 students. 268 of them ride the bus. How many students do not ride the bus?
      options:
        - "366"
        - "234"
        - "244"
        - "334"
      option_explanations:
        - |
          366 subtracts the smaller digit from the bigger one in each place (8 − 2, 6 − 0, 5 − 2). You need to regroup instead.
        - |
          Correct. 502 is 4 hundreds, 9 tens, 12 ones after regrouping. 12 − 8 = 4, 9 − 6 = 3, 4 − 2 = 2, so 234.
        - |
          244 regroups the hundred into 10 tens but forgets that one ten was then given to the ones, leaving 9 tens.
        - |
          334 forgets that one hundred was regrouped, so the hundreds should be 4 − 2 = 2, not 5 − 2 = 3.
      answer: 1
