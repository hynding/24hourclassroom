week: 19
unit: 5
title: "Equivalent Fractions and Whole Numbers as Fractions"
topics: ["3.NF.A.3"]
guide: guides/week-19.md
guide_description: |
  How two different fractions can name the same amount, such as 1/2 and 2/4, how to find them with fraction
  strips and number lines, and how whole numbers can be written as fractions, such as 4/4 = 1 and 6/2 = 3.
flashcards_description: |
  18 cards on equivalent fractions with halves, thirds, fourths, sixths and eighths, fractions equal to 1,
  whole numbers written as fractions, and checking equivalence with strips and number lines.

flashcards:
  - front: Equivalent fractions → what they are
    back: |
      Fractions that name the same amount or the same point on the number line, such as 1/2 and 2/4.
    topic_code: "3.NF.A.3"
  - front: 1/2 → equivalent fractions in fourths and eighths
    back: |
      2/4 and 4/8. One half covers the same length as two fourths or four eighths.
    topic_code: "3.NF.A.3"
  - front: 1/2 → equivalent fraction in sixths
    back: |
      3/6. Three sixths fill half of the whole.
    topic_code: "3.NF.A.3"
  - front: 1/3 → equivalent fraction in sixths
    back: |
      2/6. Cut each third in two and you get two sixths.
    topic_code: "3.NF.A.3"
  - front: 2/3 → equivalent fraction in sixths
    back: |
      4/6. Each third is two sixths, so two thirds are four sixths.
    topic_code: "3.NF.A.3"
  - front: 1/4 → equivalent fraction in eighths
    back: |
      2/8. Each fourth splits into two eighths.
    topic_code: "3.NF.A.3"
  - front: 3/4 → equivalent fraction in eighths
    back: |
      6/8. Three fourths, each made of two eighths, make six eighths.
    topic_code: "3.NF.A.3"
  - front: Equivalent fractions on a number line → how to spot them
    back: |
      They sit at the very same point. On lines in thirds and sixths, 2/3 and 4/6 line up.
    topic_code: "3.NF.A.3"
  - front: Equivalent fractions with strips → how to check
    back: |
      Line the strips up at the left. If the shaded parts end at the same place, the fractions are equivalent.
    topic_code: "3.NF.A.3"
  - front: Same numerator, different denominator → equivalent or not
    back: |
      Not equivalent. 3/4 and 3/8 both have 3 parts, but eighths are smaller parts, so 3/8 is less.
    topic_code: "3.NF.A.3"
  - front: Fraction with the same top and bottom number → its value
    back: |
      1 whole. 2/2, 3/3, 4/4, 6/6 and 8/8 all equal 1.
    topic_code: "3.NF.A.3"
  - front: Fraction with 1 as the denominator → its value
    back: |
      The same as its numerator. 5/1 means 5 wholes, each in 1 part, so 5/1 = 5.
    topic_code: "3.NF.A.3"
  - front: 2 wholes → written in halves
    back: |
      4/2. Each whole has 2 halves, and 2 + 2 = 4 halves.
    topic_code: "3.NF.A.3"
  - front: 3 wholes → written in fourths
    back: |
      12/4. Each whole has 4 fourths, and 4 + 4 + 4 = 12 fourths.
    topic_code: "3.NF.A.3"
  - front: 6/3 → as a whole number
    back: |
      2. Three thirds make 1, so six thirds make 2.
    topic_code: "3.NF.A.3"
  - front: 8/8 or 1 → which is bigger
    back: |
      Neither. 8/8 is all eight eighths, which is exactly 1 whole.
    topic_code: "3.NF.A.3"
  - front: Equivalent fractions → same whole needed
    back: |
      Compare fractions of the same size whole. Half of a small sandwich is not the same amount as half of a big one.
    topic_code: "3.NF.A.3"
  - front: Smaller parts in an equivalent fraction → what happens to the numbers
    back: |
      Cutting each part into 2 makes twice as many parts in the whole and twice as many shaded: 1/3 becomes 2/6.
    topic_code: "3.NF.A.3"

quiz:
  description: |
    13 questions · about 25 minutes · finding equivalent fractions with fraction strips and number lines,
    fractions equal to 1, whole numbers as fractions, plus review of the number line, two-step problems and
    multiplying by multiples of 10. Multiple choice, select-all, true/false and number answers are graded at
    once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w19-q01
      type: numeric
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section C"
      points: 1
      stimulus: |
        Use the fraction strips. Each row is the same length: 1 whole, then halves, fourths and eighths.
      figure: figures/w19-fraction-strips.svg
      figure_alt: "Four fraction strips of the same length, stacked and lined up at the left. The top strip is one whole piece labeled 1. The second strip has 2 equal pieces labeled 1/2. The third has 4 equal pieces labeled 1/4. The bottom strip has 8 equal pieces labeled 1/8. Each 1/4 piece is exactly as long as two 1/8 pieces, and each 1/2 piece is as long as two 1/4 pieces."
      prompt: |
        How many eighths are equal to 3/4?
      answer: { value: 6, tolerance: 0 }
      explanation: |
        Each 1/4 piece lines up with two 1/8 pieces. Three fourths line up with 2 + 2 + 2 = 6 eighths, so 3/4 = 6/8.

    - slug: g3math-w19-q02
      type: multiple_choice
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section C"
      points: 1
      stimulus: |
        Use the fraction strips. Each row is the same length: 1 whole, then halves, fourths and eighths.
      prompt: |
        Which fraction is equivalent to 1/4?
      options:
        - "1/8"
        - "2/4"
        - "2/8"
        - "4/8"
      option_explanations:
        - |
          One eighth is only half as long as one fourth. It takes two eighths to cover one fourth.
        - |
          2/4 is two fourths, which is twice as much as 1/4. It is equal to 1/2.
        - |
          Correct. One 1/4 piece is exactly as long as two 1/8 pieces, so 1/4 = 2/8.
        - |
          4/8 lines up with 2/4, which is one half. That is twice as long as 1/4.
      answer: 2

    - slug: g3math-w19-q03
      type: multiple_choice
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section C"
      points: 1
      figure: figures/w19-two-number-lines.svg
      figure_alt: "Two number lines from 0 to 1, one above the other, with 0 and 1 lined up. The top line is split into 3 equal parts, with tick marks labeled 0, 1/3, 2/3 and 1. The bottom line is split into 6 equal parts, labeled 0, 1/6, 2/6, 3/6, 4/6, 5/6 and 1. The 1/3 mark is straight above 2/6, and the 2/3 mark is straight above 4/6."
      prompt: |
        Which fraction on the bottom line is at the same point as 2/3?
      options:
        - "4/6"
        - "2/6"
        - "3/6"
        - "5/6"
      option_explanations:
        - |
          Correct. 2/3 on the top line is straight above 4/6 on the bottom line, so 2/3 = 4/6.
        - |
          2/6 keeps the same top number, but sixths are smaller parts. 2/6 lines up with 1/3, not 2/3.
        - |
          3/6 is halfway between 0 and 1. It sits between 1/3 and 2/3, not under 2/3.
        - |
          5/6 is one sixth past the 2/3 mark. Look for the mark that is straight below 2/3.
      answer: 0

    - slug: g3math-w19-q04
      type: multiple_choice
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section C"
      points: 1
      figure: figures/w19-three-circles-fourths.svg
      figure_alt: "Three circles of the same size in a row. Each circle is cut into 4 equal parts, and every part of all three circles is shaded blue. That is 12 shaded fourths in all."
      prompt: |
        Each circle is 1 whole. Which fraction tells how much is shaded in all?
      options:
        - "3/4"
        - "4/12"
        - "4/3"
        - "12/4"
      option_explanations:
        - |
          3/4 is less than 1 whole. Here 3 whole circles are shaded, which is much more than 1.
        - |
          The numbers are flipped. Each whole has 4 equal parts, so the denominator is 4, and 12 parts are shaded.
        - |
          4/3 uses the number of circles as the denominator. The denominator counts the parts in one whole, which is 4.
        - |
          Correct. Each whole is cut into fourths and 12 fourths are shaded, so 12/4 is shaded. That equals 3 wholes.
      answer: 3

    - slug: g3math-w19-q05
      type: multi_select
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section C"
      points: 2
      partial_credit: true
      prompt: |
        Which fractions are equal to 1 whole? Select all that apply.
      options:
        - "4/4"
        - "1/4"
        - "6/6"
        - "8/1"
        - "3/3"
      option_explanations:
        - |
          Yes. 4/4 is all four fourths of the whole, so it is 1.
        - |
          No. 1/4 is just one of four equal parts, which is less than 1 whole.
        - |
          Yes. 6/6 is all six sixths, which makes 1 whole.
        - |
          No. 8/1 means 8 wholes, each cut into 1 part, so 8/1 = 8.
        - |
          Yes. 3/3 is all three thirds, so it equals 1 whole.
      answer: [0, 2, 4]

    - slug: g3math-w19-q06
      type: fill_blank
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section C"
      points: 1
      prompt: |
        1/2 and 3/6 name the same amount. Fractions that name the same amount are called ____ fractions.
      answer: ["equivalent"]
      explanation: |
        They are equivalent fractions. 1/2 and 3/6 cover the same length on fraction strips and sit at the same point on a number line.

    - slug: g3math-w19-q07
      type: true_false
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section C"
      points: 1
      prompt: |
        True or false: 6/1 is equal to 6.
      answer: true
      explanation: |
        True. The denominator 1 means each whole is just 1 part, so 6 parts are 6 wholes. 6/1 = 6.

    - slug: g3math-w19-q08
      type: numeric
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section C"
      points: 1
      prompt: |
        Fill in the missing numerator: 3 = ?/2. What number goes where the ? is?
      answer: { value: 6, tolerance: 0 }
      explanation: |
        Each whole has 2 halves. Three wholes have 2 + 2 + 2 = 6 halves, so 3 = 6/2.

    - slug: g3math-w19-q09
      type: multiple_choice
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section C"
      points: 1
      prompt: |
        Two pans of cornbread are the same size. Kiara ate 2/6 of the first pan. Ben ate the same amount from the second pan, which is cut into thirds. What fraction of his pan did Ben eat?
      options:
        - "2/3"
        - "1/3"
        - "1/6"
        - "3/6"
      option_explanations:
        - |
          2/3 keeps Kiara's numerator, but thirds are bigger pieces than sixths. 2/3 is twice as much as 2/6.
        - |
          Correct. Two sixths fit exactly into one third, so 2/6 = 1/3. Ben ate 1/3 of his pan.
        - |
          1/6 is only half of what Kiara ate. Also, Ben's pan is cut into thirds, not sixths.
        - |
          3/6 is one half of the pan, which is more than the 2/6 that Kiara ate.
      answer: 1

    - slug: g3math-w19-q10
      type: short_answer
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section C"
      points: 2
      prompt: |
        Sofia says 3/4 and 3/8 are equivalent because both have a 3 on top.

        (a) Is Sofia right? Answer yes or no.
        (b) Explain how you know. You can describe fraction strips or a number line.
      answer: |
        (a) No.
        (b) Eighths are smaller pieces than fourths, because the same whole is cut into more parts. Three eighths cover less of a strip than three fourths. On a number line, 3/8 is before the halfway point and 3/4 is past it. (3/4 is equivalent to 6/8, not 3/8.)
      explanation: |
        Two points.

        (a) 1 pt: No.

        (b) 1 pt: a reason that compares the size of the parts, such as eighths being smaller than fourths, the strips not ending at the same place, the points not matching on a number line, or 3/4 being equal to 6/8.

    - slug: g3math-w19-q11
      type: multiple_choice
      topic_code: "3.NF.A.2"
      source: "IM K–5 Math Grade 3, Unit 5, Section B"
      points: 1
      prompt: |
        A number line from 0 to 1 is split into 8 equal parts. What fraction is at the 5th tick mark after 0?
      options:
        - "5/9"
        - "4/8"
        - "5/8"
        - "8/5"
      option_explanations:
        - |
          9 is the number of tick marks from 0 to 1. The denominator counts the equal parts, and there are 8.
        - |
          4/8 counts the tick mark at 0 as a jump. Start at 0 and count jumps: the 5th mark after 0 is 5 jumps.
        - |
          Correct. Each part is 1/8, and the 5th tick mark after 0 is 5 jumps of 1/8, which is 5/8.
        - |
          The numbers are flipped. The 8 equal parts go on the bottom and the 5 jumps go on top.
      answer: 2

    - slug: g3math-w19-q12
      type: multiple_choice
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 3, Section D"
      points: 1
      prompt: |
        An art room has 4 tables with 6 students at each table. Then 5 students leave to go to the library. How many students are still in the art room?
      options:
        - "29"
        - "19"
        - "15"
        - "24"
      option_explanations:
        - |
          29 adds the 5 students. They left the room, so take 5 away: 24 − 5.
        - |
          Correct. First 4 × 6 = 24 students. Then 24 − 5 = 19 students are still in the art room.
        - |
          15 adds 4 + 6 + 5. There are 4 equal groups of 6, so multiply first: 4 × 6 = 24.
        - |
          24 is the number before anyone leaves. The second step is to take away the 5 students.
      answer: 1

    - slug: g3math-w19-q13
      type: numeric
      topic_code: "3.NBT.A.3"
      source: "IM K–5 Math Grade 3, Unit 4, Section C"
      points: 1
      prompt: |
        The art room has 6 boxes of crayons with 40 crayons in each box. How many crayons is that?
      answer: { value: 240, tolerance: 0 }
      explanation: |
        6 × 40 is 6 groups of 4 tens, which is 24 tens. 24 tens = 240 crayons.
