<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" font-family="sans-serif" font-size="16">
  <title>A rectangle with two sides labeled</title>
  <rect x="0" y="0" width="380" height="200" fill="#ffffff"/>
  <polygon points="45,160 315,160 315,40 45,40" fill="none" stroke="#2457c5" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="45,149 56,149 56,160" fill="none" stroke="#1c2733" stroke-width="1.5"/>
  <polyline points="304,160 304,149 315,149" fill="none" stroke="#1c2733" stroke-width="1.5"/>
  <polyline points="315,51 304,51 304,40" fill="none" stroke="#1c2733" stroke-width="1.5"/>
  <polyline points="56,40 56,51 45,51" fill="none" stroke="#1c2733" stroke-width="1.5"/>
  <text x="180" y="179" text-anchor="middle" fill="#1c2733">9 cm</text>
  <text x="345" y="105" text-anchor="middle" fill="#1c2733">4 cm</text>
</svg>
