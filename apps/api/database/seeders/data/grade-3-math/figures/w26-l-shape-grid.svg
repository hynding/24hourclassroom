  <g stroke="#b8bfc6" stroke-width="1"><line x1="26" y1="30" x2="26" y2="246"/><line x1="62" y1="30" x2="62" y2="246"/><line x1="98" y1="30" x2="98" y2="246"/><line x1="134" y1="30" x2="134" y2="246"/><line x1="170" y1="30" x2="170" y2="246"/><line x1="206" y1="30" x2="206" y2="246"/><line x1="242" y1="30" x2="242" y2="246"/><line x1="278" y1="30" x2="278" y2="246"/><line x1="26" y1="30" x2="278" y2="30"/><line x1="26" y1="66" x2="278" y2="66"/><line x1="26" y1="102" x2="278" y2="102"/><line x1="26" y1="138" x2="278" y2="138"/><line x1="26" y1="174" x2="278" y2="174"/><line x1="26" y1="210" x2="278" y2="210"/><line x1="26" y1="246" x2="278" y2="246"/></g>
