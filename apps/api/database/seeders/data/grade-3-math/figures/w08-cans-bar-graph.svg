<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" font-family="sans-serif" font-size="15">
  <title>Cans Collected for the Food Drive</title>
  <rect x="0" y="0" width="460" height="330" fill="#ffffff"/>
  <text x="250" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#1c2733">Cans Collected for the Food Drive</text>
  <g stroke="#b8bfc6" stroke-width="1">
    <line x1="80" y1="260" x2="440" y2="260"/>
    <line x1="80" y1="235" x2="440" y2="235"/>
    <line x1="80" y1="210" x2="440" y2="210"/>
    <line x1="80" y1="185" x2="440" y2="185"/>
    <line x1="80" y1="160" x2="440" y2="160"/>
    <line x1="80" y1="135" x2="440" y2="135"/>
    <line x1="80" y1="110" x2="440" y2="110"/>
    <line x1="80" y1="85" x2="440" y2="85"/>
