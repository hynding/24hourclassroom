  <rect x="125" y="185" width="60" height="75" fill="#2457c5"/>
  <text x="155" y="282" text-anchor="middle" fill="#1c2733">Room 10</text>
  <rect x="230" y="135" width="60" height="125" fill="#2457c5"/>
  <text x="260" y="282" text-anchor="middle" fill="#1c2733">Room 11</text>
  <rect x="335" y="85" width="60" height="175" fill="#2457c5"/>
  <text x="365" y="282" text-anchor="middle" fill="#1c2733">Room 12</text>
  <text x="18" y="160" fill="#1c2733" text-anchor="middle" transform="rotate(-90 18 160)">Number of cans</text>
  <text x="260" y="310" text-anchor="middle" fill="#1c2733">Classroom</text>
