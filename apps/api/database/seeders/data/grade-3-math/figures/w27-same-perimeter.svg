<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" font-family="sans-serif" font-size="16">
  <title>Three rectangles with the same perimeter</title>
  <rect x="0" y="0" width="460" height="260" fill="#ffffff"/>
  <rect x="20" y="60" width="196" height="28" fill="#2457c5" fill-opacity="0.18"/>
  <g stroke="#1c2733" stroke-width="1"><line x1="48" y1="60" x2="48" y2="88"/><line x1="76" y1="60" x2="76" y2="88"/><line x1="104" y1="60" x2="104" y2="88"/><line x1="132" y1="60" x2="132" y2="88"/><line x1="160" y1="60" x2="160" y2="88"/><line x1="188" y1="60" x2="188" y2="88"/></g>
  <rect x="20" y="60" width="196" height="28" fill="none" stroke="#2457c5" stroke-width="3"/>
  <text x="118" y="40" text-anchor="middle" font-weight="bold" fill="#1c2733">Rectangle 1</text>
  <rect x="20" y="150" width="168" height="56" fill="#2457c5" fill-opacity="0.18"/>
  <g stroke="#1c2733" stroke-width="1"><line x1="48" y1="150" x2="48" y2="206"/><line x1="76" y1="150" x2="76" y2="206"/><line x1="104" y1="150" x2="104" y2="206"/><line x1="132" y1="150" x2="132" y2="206"/><line x1="160" y1="150" x2="160" y2="206"/><line x1="20" y1="178" x2="188" y2="178"/></g>
  <rect x="20" y="150" width="168" height="56" fill="none" stroke="#2457c5" stroke-width="3"/>
  <text x="104" y="130" text-anchor="middle" font-weight="bold" fill="#1c2733">Rectangle 2</text>
  <rect x="300" y="100" width="112" height="112" fill="#2457c5" fill-opacity="0.18"/>
  <g stroke="#1c2733" stroke-width="1"><line x1="328" y1="100" x2="328" y2="212"/><line x1="356" y1="100" x2="356" y2="212"/><line x1="384" y1="100" x2="384" y2="212"/><line x1="300" y1="128" x2="412" y2="128"/><line x1="300" y1="156" x2="412" y2="156"/><line x1="300" y1="184" x2="412" y2="184"/></g>
  <rect x="300" y="100" width="112" height="112" fill="none" stroke="#2457c5" stroke-width="3"/>
  <text x="356" y="80" text-anchor="middle" font-weight="bold" fill="#1c2733">Rectangle 3</text>
  <text x="230" y="250" text-anchor="middle" font-size="15" fill="#1c2733">Each small square is 1 square unit.</text>
</svg>
