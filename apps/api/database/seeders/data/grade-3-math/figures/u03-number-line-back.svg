<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" font-family="sans-serif" font-size="16">
  <title>Jumping Back on an Open Number Line</title>
  <rect x="0" y="0" width="640" height="180" fill="#ffffff"/>
