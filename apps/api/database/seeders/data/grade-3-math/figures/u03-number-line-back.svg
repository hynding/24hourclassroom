  <line x1="30" y1="130" x2="610" y2="130" stroke="#1c2733" stroke-width="2"/>
  <line x1="60" y1="120" x2="60" y2="140" stroke="#1c2733" stroke-width="2"/>
  <text x="60" y="162" text-anchor="middle" fill="#1c2733">267</text>
