<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="sans-serif" font-size="16">
  <title>Three rectangles with the same area</title>
  <rect x="0" y="0" width="560" height="280" fill="#ffffff"/>
  <rect x="20" y="50" width="336" height="28" fill="#2457c5" fill-opacity="0.18"/>
  <g stroke="#1c2733" stroke-width="1"><line x1="48" y1="50" x2="48" y2="78"/><line x1="76" y1="50" x2="76" y2="78"/><line x1="104" y1="50" x2="104" y2="78"/><line x1="132" y1="50" x2="132" y2="78"/><line x1="160" y1="50" x2="160" y2="78"/><line x1="188" y1="50" x2="188" y2="78"/><line x1="216" y1="50" x2="216" y2="78"/><line x1="244" y1="50" x2="244" y2="78"/><line x1="272" y1="50" x2="272" y2="78"/><line x1="300" y1="50" x2="300" y2="78"/><line x1="328" y1="50" x2="328" y2="78"/></g>
  <rect x="20" y="50" width="336" height="28" fill="none" stroke="#2457c5" stroke-width="3"/>
  <text x="188" y="38" text-anchor="middle" font-weight="bold" fill="#1c2733">Rectangle 1</text>
  <rect x="20" y="140" width="168" height="56" fill="#2457c5" fill-opacity="0.18"/>
  <g stroke="#1c2733" stroke-width="1"><line x1="48" y1="140" x2="48" y2="196"/><line x1="76" y1="140" x2="76" y2="196"/><line x1="104" y1="140" x2="104" y2="196"/><line x1="132" y1="140" x2="132" y2="196"/><line x1="160" y1="140" x2="160" y2="196"/><line x1="20" y1="168" x2="188" y2="168"/></g>
  <rect x="20" y="140" width="168" height="56" fill="none" stroke="#2457c5" stroke-width="3"/>
  <text x="104" y="128" text-anchor="middle" font-weight="bold" fill="#1c2733">Rectangle 2</text>
  <rect x="300" y="140" width="112" height="84" fill="#2457c5" fill-opacity="0.18"/>
  <g stroke="#1c2733" stroke-width="1"><line x1="328" y1="140" x2="328" y2="224"/><line x1="356" y1="140" x2="356" y2="224"/><line x1="384" y1="140" x2="384" y2="224"/><line x1="300" y1="168" x2="412" y2="168"/><line x1="300" y1="196" x2="412" y2="196"/></g>
  <rect x="300" y="140" width="112" height="84" fill="none" stroke="#2457c5" stroke-width="3"/>
  <text x="356" y="128" text-anchor="middle" font-weight="bold" fill="#1c2733">Rectangle 3</text>
  <text x="280" y="270" text-anchor="middle" font-size="15" fill="#1c2733">Each small square is 1 square unit.</text>
</svg>
