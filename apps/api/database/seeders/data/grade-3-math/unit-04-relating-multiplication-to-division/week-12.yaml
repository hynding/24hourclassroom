week: 12
unit: 4
title: "What Is Division? Sharing and Making Groups"
topics: ["3.OA.A.2"]
guide: guides/week-12.md
guide_description: |
  What division means: sharing a total equally into a number of groups, or making groups of a given size and
  counting how many groups, with pictures, tape diagrams and the ÷ sign.
flashcards_description: |
  18 cards on the two meanings of division, the ÷ sign, the word quotient, reading a division equation as a
  story, and quick sharing and grouping problems.

flashcards:
  - front: Division → what it means
    back: |
      Splitting a total into equal groups. You either know how many groups and find how many in each, or know how many in each and find how many groups.
    topic_code: "3.OA.A.2"
  - front: Division as sharing → what you find
    back: |
      How many go in each group. 12 cookies shared equally by 3 friends: each friend gets 4.
    topic_code: "3.OA.A.2"
  - front: Division as making groups → what you find
    back: |
      How many groups you can make. 12 cookies in bags of 3: you can fill 4 bags.
    topic_code: "3.OA.A.2"
  - front: ÷ sign → how to read it
    back: |
      "Divided by". 18 ÷ 6 is read "18 divided by 6".
    topic_code: "3.OA.A.2"
  - front: Quotient → what it is
    back: |
      The answer to a division. In 20 ÷ 4 = 5, the quotient is 5.
    topic_code: "3.OA.A.2"
  - front: Shared equally → what it means
    back: |
      Every group gets the same amount. Nobody gets more and nobody gets less.
    topic_code: "3.OA.A.2"
  - front: 15 ÷ 3 = 5 as a sharing story
    back: |
      15 marbles shared equally among 3 kids. Each kid gets 5 marbles.
    topic_code: "3.OA.A.2"
  - front: 15 ÷ 3 = 5 as a groups-of story
    back: |
      15 marbles put in bags of 3. That fills 5 bags.
    topic_code: "3.OA.A.2"
  - front: First number in a division equation → what it is
    back: |
      The total, the whole amount before it is split. In 24 ÷ 6 = 4, the total is 24.
    topic_code: "3.OA.A.2"
  - front: Share 20 stickers among 4 friends → each friend gets
    back: |
      5 stickers. Deal them out one at a time: after 5 rounds all 20 are gone.
    topic_code: "3.OA.A.2"
  - front: 18 socks in pairs of 2 → number of pairs
    back: |
      9 pairs. Count by 2s to 18: 2, 4, 6, 8, 10, 12, 14, 16, 18 is 9 counts.
    topic_code: "3.OA.A.2"
  - front: Dealing out one at a time → what it shows
    back: |
      A way to share. Give one to each group, then another, until the total is used up. Then count one group.
    topic_code: "3.OA.A.2"
  - front: Circling groups → what it shows
    back: |
      A way to make groups. Circle groups of the right size until every object is circled, then count the circles.
    topic_code: "3.OA.A.2"
  - front: Tape diagram for division → how it looks
    back: |
      A bar for the total, cut into equal parts. 20 cut into 4 equal parts shows 20 ÷ 4, and each part is 5.
    topic_code: "3.OA.A.2"
  - front: Division checked with multiplication → how
    back: |
      Multiply the answer back. 28 ÷ 4 = 7 is right because 4 groups of 7 make 28.
    topic_code: "3.OA.A.2"
  - front: Repeated subtraction → how it divides
    back: |
      Take away the group size again and again until you reach 0, then count how many times. 12 − 4 − 4 − 4 = 0 is 3 times, so 12 ÷ 4 = 3.
    topic_code: "3.OA.A.2"
  - front: Division mistake → mixing up the two numbers
    back: |
      In 20 ÷ 5, 20 is the total. "20 ÷ 5" does not mean 20 groups of 5; that would be 100 things.
    topic_code: "3.OA.A.2"
  - front: Multiplication and division → how they are related
    back: |
      Multiplication puts equal groups together to find the total. Division starts with the total and splits it into equal groups.
    topic_code: "3.OA.A.2"

quiz:
  description: |
    13 questions · about 25 minutes · division as sharing and as making groups, matching pictures, tape diagrams
    and stories to division equations, plus review of equal groups, adding within 1,000 and rounding.
    Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word is matched
    automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w12-q01
      type: multiple_choice
      topic_code: "3.OA.A.2"
      source: "IM K–5 Math Grade 3, Unit 4, Section A"
      points: 1
      figure: figures/w12-strawberry-plates.svg
      figure_alt: "Three plates drawn as large circles, labeled Plate 1, Plate 2 and Plate 3. Each plate has 5 red dots for strawberries, so there are 15 strawberries in all."
      prompt: |
        Ravi shared 15 strawberries equally on 3 plates, as the picture shows. He wrote 15 ÷ 3 = 5. What does his equation tell us?
      options:
        - "15 strawberries shared on 3 plates gives 5 strawberries on each plate."
        - "There are 15 plates with 3 strawberries on each plate."
        - "3 strawberries were shared on 5 plates."
        - "There are 5 plates with 15 strawberries on each plate."
      option_explanations:
        - |
          Correct. 15 is the total, 3 is the number of plates, and 5 is how many strawberries land on each plate.
        - |
          The picture has only 3 plates, not 15. The 15 in the equation is the total number of strawberries.
        - |
          There are 15 strawberries, not 3. The 3 in the equation is the number of plates they were shared on.
        - |
          5 plates of 15 would be 75 strawberries. The picture shows 3 plates, each with 5 strawberries.
      answer: 0

    - slug: g3math-w12-q02
      type: numeric
      topic_code: "3.OA.A.2"
      source: "IM K–5 Math Grade 3, Unit 4, Section A"
      points: 1
      stimulus: |
        Use the picture of pencil cups. Lena has 24 pencils. She puts 4 pencils in each cup.
      figure: figures/w12-pencil-cups.svg
      figure_alt: "Six cups drawn as boxes in two rows of three. Each cup holds 4 blue pencils, so there are 24 pencils in all."
      prompt: |
        How many cups does Lena fill?
      answer: { value: 6, tolerance: 0 }
      explanation: |
        Each cup takes a group of 4. Count by 4s to 24: 4, 8, 12, 16, 20, 24. That is 6 groups, so 24 ÷ 4 = 6 cups.

    - slug: g3math-w12-q03
      type: multiple_choice
      topic_code: "3.OA.A.2"
      source: "IM K–5 Math Grade 3, Unit 4, Section A"
      points: 1
      stimulus: |
        Use the picture of pencil cups. Lena has 24 pencils. She puts 4 pencils in each cup.
      prompt: |
        Lena writes 24 ÷ 4 = 6. What does the 4 stand for?
      options:
        - "The number of cups"
        - "The total number of pencils"
        - "The number of pencils in each cup"
        - "The number of pencils left over"
      option_explanations:
        - |
          The number of cups is 6, the answer. The 4 is the size of each group, the pencils that go in one cup.
        - |
          The total is 24, the first number in the equation. The 4 tells how many pencils go together in a cup.
        - |
          Correct. Lena makes groups of 4, so the 4 is the number of pencils in each cup.
        - |
          No pencils are left over: 6 cups of 4 use all 24. The 4 is how many pencils go in one cup.
      answer: 2

    - slug: g3math-w12-q04
      type: multiple_choice
      topic_code: "3.OA.A.2"
      source: "IM K–5 Math Grade 3, Unit 4, Section A"
      points: 1
      figure: figures/w12-tape-20.svg
      figure_alt: "A tape diagram: one long bar cut into 4 equal parts. Each part is labeled with a question mark. A bracket over the whole bar is labeled 20."
      prompt: |
        Which story matches the tape diagram?
      options:
        - "4 friends each have 20 stickers. How many stickers do they have in all?"
        - "20 stickers are shared equally by 4 friends. How many stickers does each friend get?"
        - "There are 20 stickers and 4 are given away. How many are left?"
        - "There are 20 stickers and 4 more are added. How many are there now?"
      option_explanations:
        - |
          In this story 20 would be the size of each part and the total would be unknown. In the diagram the total is 20.
        - |
          Correct. The whole bar is 20 stickers, cut into 4 equal parts for 4 friends, and each part is the unknown.
        - |
          Taking 4 away is subtraction. The diagram cuts 20 into 4 equal parts; it does not remove 4.
        - |
          Adding 4 more would make the bar longer. The diagram splits a total of 20 into 4 equal parts.
      answer: 1

    - slug: g3math-w12-q05
      type: numeric
      topic_code: "3.OA.A.2"
      source: "IM K–5 Math Grade 3, Unit 4, Section A"
      points: 1
      prompt: |
        Jamal has 32 crayons. He shares them equally among 4 tables. How many crayons go to each table?
      answer: { value: 8, tolerance: 0 }
      explanation: |
        Sharing 32 into 4 equal groups is 32 ÷ 4. Since 4 × 8 = 32, each table gets 8 crayons.

    - slug: g3math-w12-q06
      type: multiple_choice
      topic_code: "3.OA.A.2"
      source: "IM K–5 Math Grade 3, Unit 4, Section A"
      points: 1
      prompt: |
        Ms. Ortiz has 18 students. She makes teams of 3 students. How many teams can she make?
      options:
        - "15"
        - "21"
        - "54"
        - "6"
      option_explanations:
        - |
          15 is 18 − 3, taking away just one team. Keep making teams of 3 until all 18 students are used.
        - |
          21 is 18 + 3. Making teams splits the 18 students into groups; it does not add students.
        - |
          54 is 18 × 3. That would be 18 teams of 3, but there are only 18 students in all.
        - |
          Correct. Count by 3s to 18: 3, 6, 9, 12, 15, 18. That is 6 teams, so 18 ÷ 3 = 6.
      answer: 3

    - slug: g3math-w12-q07
      type: fill_blank
      topic_code: "3.OA.A.2"
      source: "IM K–5 Math Grade 3, Unit 4, Section A"
      points: 1
      prompt: |
        In 35 ÷ 5 = 7, the answer 7 is called the ____.
      answer: ["quotient", "the quotient", "quotients"]
      explanation: |
        The answer to a division problem is the quotient. Here 35 split into 5 equal groups gives a quotient of 7.

    - slug: g3math-w12-q08
      type: true_false
      topic_code: "3.OA.A.2"
      source: "IM K–5 Math Grade 3, Unit 4, Section A"
      points: 1
      prompt: |
        True or false: 20 ÷ 5 means 20 groups with 5 in each group.
      answer: false
      explanation: |
        False. 20 is the total. 20 ÷ 5 means 20 split into 5 equal groups, or 20 put in groups of 5. Either way the answer is 4. Twenty groups of 5 would be 100 things.

    - slug: g3math-w12-q09
      type: multi_select
      topic_code: "3.OA.A.2"
      source: "IM K–5 Math Grade 3, Unit 4, Section A"
      points: 2
      partial_credit: true
      prompt: |
        Which stories can be solved with 30 ÷ 6? Select all that apply.
      options:
        - "30 seeds are planted in 6 equal rows. How many seeds are in each row?"
        - "30 books are put in stacks of 6. How many stacks are there?"
        - "6 boxes each hold 30 crayons. How many crayons are there?"
        - "30 kids are at the park and 6 go home. How many are still there?"
        - "6 friends share 30 grapes equally. How many grapes does each friend get?"
      option_explanations:
        - |
          Yes. 30 seeds shared into 6 equal rows is 30 ÷ 6, and each row has 5 seeds.
        - |
          Yes. Making groups of 6 from 30 books is 30 ÷ 6, and there are 5 stacks.
        - |
          No. 6 groups of 30 is multiplication, 6 × 30. The total is unknown here, not 30.
        - |
          No. 6 kids leaving is subtraction, 30 − 6 = 24. Nothing is split into equal groups.
        - |
          Yes. Sharing 30 grapes equally among 6 friends is 30 ÷ 6, so each friend gets 5.
      answer: [0, 1, 4]

    - slug: g3math-w12-q10
      type: multiple_choice
      topic_code: "3.OA.A.1"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 1
      prompt: |
        Which expression shows 5 groups of 4?
      options:
        - "5 × 4"
        - "5 + 4"
        - "4 + 4 + 4 + 4"
        - "5 × 5"
      option_explanations:
        - |
          Correct. 5 × 4 means 5 groups with 4 in each group, which is 20 in all.
        - |
          5 + 4 joins one group of 5 and one group of 4. That is only 9, not 5 equal groups.
        - |
          This adds four 4s, which is 4 groups of 4. One more 4 is needed to make 5 groups.
        - |
          5 × 5 is 5 groups of 5. Each group here should have 4, not 5.
      answer: 0

    - slug: g3math-w12-q11
      type: numeric
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section A"
      points: 1
      prompt: |
        The school library has 348 books on one shelf and 275 books on another shelf. How many books are on the two shelves?
      answer: { value: 623, tolerance: 0 }
      explanation: |
        348 + 275. Ones: 8 + 5 = 13, write 3 and regroup 1 ten. Tens: 4 + 7 + 1 = 12 tens, write 2 and regroup 1 hundred. Hundreds: 3 + 2 + 1 = 6. The total is 623 books.

    - slug: g3math-w12-q12
      type: multiple_choice
      topic_code: "3.NBT.A.1"
      source: "IM K–5 Math Grade 3, Unit 3, Section C"
      points: 1
      prompt: |
        Round 467 to the nearest hundred.
      options:
        - "400"
        - "470"
        - "460"
        - "500"
      option_explanations:
        - |
          400 is the hundred below 467, but 467 is past the halfway mark of 450, so it is closer to 500.
        - |
          470 is 467 rounded to the nearest ten. The question asks for the nearest hundred.
        - |
          460 is not a hundred, and it is not the nearest ten either. Look at the hundreds: 467 is between 400 and 500.
        - |
          Correct. 467 is between 400 and 500 and past the halfway mark of 450, so it rounds up to 500.
      answer: 3

    - slug: g3math-w12-q13
      type: short_answer
      topic_code: "3.OA.A.2"
      source: "IM K–5 Math Grade 3, Unit 4, Section A"
      points: 2
      prompt: |
        Kofi has 21 toy cars.

        (a) He shares all the cars equally into 3 boxes. How many cars are in each box?
        (b) Then he packs the cars again with 3 cars in each box. How many boxes does he fill? Show or explain how you know.
      answer: |
        (a) 7 cars in each box. Deal the 21 cars into 3 boxes one at a time; each box ends up with 7. (3 × 7 = 21.)
        (b) 7 boxes. Make groups of 3: 3, 6, 9, 12, 15, 18, 21 is 7 groups. Both parts are 21 ÷ 3 = 7, one as sharing and one as making groups.
      explanation: |
        Two points.

        (a) 1 pt: 7 cars in each box.

        (b) 1 pt: 7 boxes, with work that shows groups of 3 (counting by 3s, a drawing of 7 groups of 3, or 7 × 3 = 21).
