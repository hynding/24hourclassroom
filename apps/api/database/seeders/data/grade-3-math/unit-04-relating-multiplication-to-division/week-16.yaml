week: 16
unit: 4
title: "Multiplication and Division Word Problems"
topics: ["3.OA.A.3"]
guide: guides/week-16.md
guide_description: |
  How to solve multiplication and division stories within 100: find the total, the number of groups and the
  size of each group, draw a tape diagram, write an equation with a symbol for the unknown, and check that the
  answer makes sense.
flashcards_description: |
  18 cards on the three numbers in every equal-groups story, which operation to use, writing an equation with
  an unknown, tape diagrams, and checking an answer.

flashcards:
  - front: Equal-groups story → the three numbers to find
    back: |
      The number of groups, the size of each group, and the total. Two are given; the story asks for the third.
    topic_code: "3.OA.A.3"
  - front: Total unknown in an equal-groups story → which operation
    back: |
      Multiply. 6 bags with 4 apples in each: 6 × 4 = 24 apples.
    topic_code: "3.OA.A.3"
  - front: Size of each group unknown → which operation
    back: |
      Divide (or find the missing factor). 24 apples shared into 6 bags: 24 ÷ 6 = 4 in each bag.
    topic_code: "3.OA.A.3"
  - front: Number of groups unknown → which operation
    back: |
      Divide (or find the missing factor). 24 apples in bags of 4: 24 ÷ 4 = 6 bags.
    topic_code: "3.OA.A.3"
  - front: '"Each" and "in all" in a story → what they usually mean'
    back: |
      "Each" tells the size of one group. "In all" asks for the total. Read the whole story before you decide.
    topic_code: "3.OA.A.3"
  - front: '"Shared equally" in a story → what it tells you'
    back: |
      A total is being split into equal groups, so the story is a division.
    topic_code: "3.OA.A.3"
  - front: Symbol for an unknown → examples
    back: |
      A question mark, a box or a letter: 8 × ? = 40, 8 × □ = 40, or 8 × n = 40. Here the unknown is 5.
    topic_code: "3.OA.A.4"
  - front: 9 vans with 7 students each → equation and answer
    back: |
      9 × 7 = ?. The answer is 63 students.
    topic_code: "3.OA.A.3"
  - front: 40 chairs in 5 equal rows → equation and answer
    back: |
      40 ÷ 5 = ? or 5 × ? = 40. There are 8 chairs in each row.
    topic_code: "3.OA.A.3"
  - front: 56 cards in piles of 8 → equation and answer
    back: |
      56 ÷ 8 = ? or ? × 8 = 56. There are 7 piles.
    topic_code: "3.OA.A.3"
  - front: Tape diagram for a story → what goes where
    back: |
      The whole bar is the total. Each equal part is one group. Mark the unknown with a question mark.
    topic_code: "3.OA.A.3"
  - front: Array in a story → what the rows and columns tell you
    back: |
      Rows are the groups and the number in each row is the group size. 4 rows of 9 seats make 36 seats.
    topic_code: "3.OA.A.3"
  - front: Measurement story with equal parts → example
    back: |
      A 32-inch ribbon cut into 4 equal pieces: 32 ÷ 4 = 8 inches each.
    topic_code: "3.OA.A.3"
  - front: Checking a word problem answer → two questions
    back: |
      Does it answer the question that was asked? Does it make sense? If 30 kids ride in vans of 6, the answer must be fewer than 30 vans.
    topic_code: "3.OA.A.3"
  - front: Checking a division story → multiply back
    back: |
      If 48 treats go 6 to a dog and you found 8 dogs, check: 8 × 6 = 48.
    topic_code: "3.OA.A.3"
  - front: Word problem mistake → adding instead of multiplying
    back: |
      "7 boxes of 6 crayons" is not 7 + 6 = 13. It is 7 groups of 6, so 7 × 6 = 42.
    topic_code: "3.OA.A.3"
  - front: Word problem mistake → dividing the wrong way
    back: |
      In a division story the total comes first. "4 friends share 28 cards" is 28 ÷ 4 = 7, not 4 ÷ 28.
    topic_code: "3.OA.A.3"
  - front: Picture graph with a key of 4 → finding one row
    back: |
      Multiply the number of pictures by 4. A row of 6 pictures stands for 6 × 4 = 24.
    topic_code: "3.MD.B.3"

quiz:
  description: |
    14 questions · about 25 minutes · multiplication and division stories within 100 with tape diagrams,
    picture graphs and equal groups, writing equations with an unknown, plus review of sharing, two-step
    problems and subtracting within 1,000. Multiple choice, select-all, true/false and number answers are
    graded at once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w16-q01
      type: multiple_choice
      topic_code: "3.OA.A.3"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 1
      stimulus: |
        Use the tape diagram. A garden has 7 rows of carrots with the same number of carrots in each row.
      figure: figures/w16-tape-carrots.svg
      figure_alt: "A tape diagram: one long bar cut into 7 equal parts, and every part is labeled 8. A bracket over the whole bar is labeled with a question mark."
      prompt: |
        How many carrots are in the garden?
      options:
        - "15"
        - "48"
        - "56"
        - "64"
      option_explanations:
        - |
          15 is 7 + 8. The diagram shows 7 equal parts of 8, so multiply 7 × 8.
        - |
          48 is 6 × 8, one row short. Count the parts again: there are 7.
        - |
          Correct. 7 rows of 8 carrots: 7 × 8 = 56.
        - |
          64 is 8 × 8. There are 7 parts in the bar, not 8.
      answer: 2

    - slug: g3math-w16-q02
      type: multiple_choice
      topic_code: "3.OA.A.3"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 1
      stimulus: |
        Use the tape diagram. A garden has 7 rows of carrots with the same number of carrots in each row.
      prompt: |
        Which equation matches the tape diagram?
      options:
        - "7 × 8 = ?"
        - "7 + 8 = ?"
        - "8 − 7 = ?"
        - "8 × 8 = ?"
      option_explanations:
        - |
          Correct. There are 7 equal parts of 8 and the total is unknown, so 7 × 8 = ?.
        - |
          Adding 7 and 8 treats the story as two groups. The bar has 7 equal groups of 8.
        - |
          Subtraction finds a difference. The diagram puts equal parts together to make a total.
        - |
          The 8 is the size of each part, but there are 7 parts, not 8.
      answer: 0

    - slug: g3math-w16-q03
      type: numeric
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the picture graph "Stickers Collected". One star stands for 4 stickers.
      figure: figures/w16-sticker-picture-graph.svg
      figure_alt: "A picture graph titled Stickers Collected. Ava has 6 stars, Bilal has 4 stars and Chiara has 9 stars. The key says one star equals 4 stickers."
      prompt: |
        How many stickers did Chiara collect?
      answer: { value: 36, tolerance: 0 }
      explanation: |
        Chiara has 9 stars and each star is 4 stickers: 9 × 4 = 36 stickers.

    - slug: g3math-w16-q04
      type: multiple_choice
      topic_code: "3.OA.A.2"
      source: "IM K–5 Math Grade 3, Unit 4, Section A"
      points: 1
      stimulus: |
        Use the picture graph "Stickers Collected". One star stands for 4 stickers.
      prompt: |
        Bilal puts all his stickers on 2 pages of his book, with the same number on each page. How many stickers are on each page?
      options:
        - "2"
        - "8"
        - "14"
        - "32"
      option_explanations:
        - |
          2 is 4 stars ÷ 2. Each star is 4 stickers, so first find Bilal's total: 4 × 4 = 16.
        - |
          Correct. Bilal has 4 stars × 4 = 16 stickers, and 16 ÷ 2 = 8 on each page.
        - |
          14 is 16 − 2. Putting stickers on 2 pages splits 16 into 2 equal groups.
        - |
          32 is 16 × 2. Sharing onto 2 pages gives fewer on each page, not more.
      answer: 1

    - slug: g3math-w16-q05
      type: numeric
      topic_code: "3.OA.A.3"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 1
      prompt: |
        A pet shelter has 48 dog treats. Each dog gets 6 treats. How many dogs get treats?
      answer: { value: 8, tolerance: 0 }
      explanation: |
        The total is 48 and each group (one dog) is 6, so find the number of groups: 48 ÷ 6 = 8 dogs. Check: 8 × 6 = 48.

    - slug: g3math-w16-q06
      type: multiple_choice
      topic_code: "3.OA.A.3"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 1
      prompt: |
        There are 9 vans for a field trip. Each van holds 7 students. How many students can ride in the vans?
      options:
        - "16"
        - "56"
        - "72"
        - "63"
      option_explanations:
        - |
          16 is 9 + 7. There are 9 vans with 7 students in each, so multiply.
        - |
          56 is 8 × 7, one van short. There are 9 vans.
        - |
          72 is 9 × 8. Each van holds 7 students, not 8.
        - |
          Correct. 9 groups of 7: 9 × 7 = 63 students.
      answer: 3

    - slug: g3math-w16-q07
      type: multiple_choice
      topic_code: "3.OA.A.4"
      source: "IM K–5 Math Grade 3, Unit 4, Section B"
      points: 1
      prompt: |
        Pablo set out 35 chairs in 5 equal rows. Which equation could he use to find how many chairs are in each row?
      options:
        - "5 × ? = 35"
        - "35 × 5 = ?"
        - "35 + 5 = ?"
        - "35 − 5 = ?"
      option_explanations:
        - |
          Correct. 5 rows times the unknown number in each row makes 35 chairs. The unknown is 7.
        - |
          This makes 35 the size of a group. But 35 is the total number of chairs.
        - |
          Adding 5 more chairs is not part of the story. The 35 chairs are split into 5 equal rows.
        - |
          Taking away 5 chairs is not part of the story. The chairs are split into equal rows.
      answer: 0

    - slug: g3math-w16-q08
      type: fill_blank
      topic_code: "3.OA.A.3"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 1
      prompt: |
        A drawing that shows a story as a long bar cut into equal parts is called a tape ____.
      answer: ["diagram", "tape diagram", "diagrams", "a tape diagram"]
      explanation: |
        A tape diagram shows the total as a whole bar and each equal group as one part of the bar.

    - slug: g3math-w16-q09
      type: true_false
      topic_code: "3.OA.A.3"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 1
      prompt: |
        True or false: the story "Each of 4 bags holds 9 marbles. How many marbles are there in all?" can be solved with 9 ÷ 4.
      answer: false
      explanation: |
        False. The story gives the number of groups (4 bags) and the size of each group (9 marbles) and asks for the total, so multiply: 4 × 9 = 36 marbles.

    - slug: g3math-w16-q10
      type: multi_select
      topic_code: "3.OA.A.3"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 2
      partial_credit: true
      prompt: |
        Which stories have an answer of 6? Select all that apply.
      options:
        - "42 crayons go in boxes of 7. How many boxes are filled?"
        - "3 friends each fly 2 kites. How many kites are there?"
        - "Maya reads 30 pages, 5 pages each day. How many days does it take?"
        - "There are 5 rows of 6 chairs. How many chairs are there?"
        - "18 apples go in bags of 2. How many bags are filled?"
      option_explanations:
        - |
          Yes. 42 crayons in groups of 7: 42 ÷ 7 = 6 boxes.
        - |
          Yes. 3 friends with 2 kites each: 3 × 2 = 6 kites.
        - |
          Yes. 30 pages in groups of 5 pages: 30 ÷ 5 = 6 days.
        - |
          No. 6 is the size of each row, but the story asks for the total: 5 × 6 = 30 chairs.
        - |
          No. 18 ÷ 2 = 9 bags, because 9 × 2 = 18.
      answer: [0, 1, 2]

    - slug: g3math-w16-q11
      type: numeric
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 3, Section D"
      points: 1
      prompt: |
        A classroom has 4 tables with 6 students at each table. Then 5 students leave for music class. How many students are still in the room?
      answer: { value: 19, tolerance: 0 }
      explanation: |
        Step 1: 4 × 6 = 24 students. Step 2: 24 − 5 = 19 students are still in the room.

    - slug: g3math-w16-q12
      type: multiple_choice
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section B"
      points: 1
      prompt: |
        Students ran 485 laps in the fall and 329 laps in the spring. How many more laps did they run in the fall?
      options:
        - "164"
        - "156"
        - "814"
        - "166"
      option_explanations:
        - |
          164 comes from taking 5 from 9 in the ones place. You need 5 − 9, so regroup a ten: 15 − 9 = 6.
        - |
          Correct. 485 − 329: regroup a ten, 15 − 9 = 6 ones; 7 − 2 = 5 tens; 4 − 3 = 1 hundred. That is 156.
        - |
          814 is 485 + 329. "How many more" asks for the difference, so subtract.
        - |
          166 regroups for the ones but forgets that the tens place now has 7 tens, not 8.
      answer: 1

    - slug: g3math-w16-q13
      type: short_answer
      topic_code: "3.OA.A.3"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 2
      prompt: |
        Imani has 24 beads. She makes bracelets with 6 beads on each bracelet.

        (a) Write an equation with a symbol for the unknown number.
        (b) Solve it and tell what your answer means in the story.
      answer: |
        (a) 24 ÷ 6 = ? (or 6 × ? = 24, or ? × 6 = 24).
        (b) ? = 4, because 4 × 6 = 24. Imani can make 4 bracelets.
      explanation: |
        Two points.

        (a) 1 pt: a correct equation that uses a symbol (?, a box or a letter) for the unknown, such as 24 ÷ 6 = ? or 6 × b = 24.

        (b) 1 pt: 4, with what it means: 4 bracelets.

    - slug: g3math-w16-q14
      type: multiple_choice
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 3, Section D"
      points: 1
      figure: figures/w16-muffin-trays.svg
      figure_alt: "Three trays labeled Tray 1, Tray 2 and Tray 3. Each tray holds 2 rows of 4 red circles for muffins, so each tray has 8 muffins."
      prompt: |
        Rosa baked the 3 trays of muffins in the picture. She shares all the muffins equally among 4 classes. How many muffins does each class get?
      options:
        - "8"
        - "24"
        - "6"
        - "2"
      option_explanations:
        - |
          8 is the number of muffins on one tray. All 3 trays are shared, so first find the total.
        - |
          24 is the total number of muffins (3 × 8). The question asks how many each of the 4 classes gets.
        - |
          Correct. Step 1: 3 trays × 8 muffins = 24. Step 2: 24 ÷ 4 = 6 muffins for each class.
        - |
          2 shares only one tray (8 ÷ 4). All 3 trays are shared, so share 24 muffins.
      answer: 2
