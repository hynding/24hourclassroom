week: 13
unit: 4
title: "Division as an Unknown Factor and Fact Families"
topics: ["3.OA.B.6", "3.OA.A.4"]
guide: guides/week-13.md
guide_description: |
  How every division is a multiplication with a missing factor, how arrays and tape diagrams show both at once,
  how to write the four equations of a fact family, and how to find the unknown number in any of them.
flashcards_description: |
  18 cards on division as a missing factor, fact families, finding the unknown number in multiplication and
  division equations, and using a known multiplication fact to divide.

flashcards:
  - front: Division as a missing factor → what it means
    back: |
      Every division asks a multiplication question. 35 ÷ 5 = ? asks "5 times what number makes 35?" The answer is 7.
    topic_code: "3.OA.B.6"
  - front: Factor → in a multiplication equation
    back: |
      One of the numbers you multiply. In 6 × 4 = 24, the factors are 6 and 4 and the product is 24.
    topic_code: "3.OA.B.6"
  - front: Fact family → what it is
    back: |
      A set of multiplication and division equations that use the same three numbers. 3, 5 and 15 make 3 × 5 = 15, 5 × 3 = 15, 15 ÷ 3 = 5 and 15 ÷ 5 = 3.
    topic_code: "3.OA.B.6"
  - front: Fact family for 4, 9 and 36 → all four equations
    back: |
      4 × 9 = 36, 9 × 4 = 36, 36 ÷ 4 = 9, 36 ÷ 9 = 4.
    topic_code: "3.OA.B.6"
  - front: Fact family → the biggest number goes where in a division
    back: |
      First. The product of the multiplication is the total you divide: 36 ÷ 4, never 4 ÷ 36.
    topic_code: "3.OA.B.6"
  - front: 42 ÷ 6 → the multiplication fact that helps
    back: |
      6 × 7 = 42, so 42 ÷ 6 = 7.
    topic_code: "3.OA.B.6"
  - front: 54 ÷ 9 → the multiplication fact that helps
    back: |
      9 × 6 = 54, so 54 ÷ 9 = 6.
    topic_code: "3.OA.B.6"
  - front: An array of 3 rows of 8 → the two divisions it shows
    back: |
      24 ÷ 3 = 8 (3 rows, 8 in each row) and 24 ÷ 8 = 3 (groups of 8, 3 of them).
    topic_code: "3.OA.B.6"
  - front: Tape diagram with 5 equal parts and a total of 40 → the equation
    back: |
      5 × ? = 40, or 40 ÷ 5 = ?. Each part is 8.
    topic_code: "3.OA.B.6"
  - front: Unknown number → how it can be shown
    back: |
      With a box, a question mark or a letter, such as 7 × ? = 28 or 7 × n = 28. Here the unknown is 4.
    topic_code: "3.OA.A.4"
  - front: 8 × ? = 48 → the unknown
    back: |
      6, because 8 × 6 = 48.
    topic_code: "3.OA.A.4"
  - front: "? × 7 = 63 → the unknown"
    back: |
      9, because 9 × 7 = 63.
    topic_code: "3.OA.A.4"
  - front: 32 ÷ ? = 4 → the unknown
    back: |
      8, because 32 ÷ 8 = 4. Check: 4 × 8 = 32.
    topic_code: "3.OA.A.4"
  - front: "? ÷ 5 = 6 → the unknown"
    back: |
      30. The unknown is the total here: 5 groups of 6 make 30.
    topic_code: "3.OA.A.4"
  - front: Finding an unknown → a good first question
    back: |
      "Is the unknown a factor or the total?" If it is the total, multiply. If it is a factor, think of the missing factor or divide.
    topic_code: "3.OA.A.4"
  - front: Checking a division → multiply back
    back: |
      Multiply the quotient by the number you divided by. If you get the total, the division is right: 56 ÷ 7 = 8 because 7 × 8 = 56.
    topic_code: "3.OA.B.6"
  - front: Dividing by 1 → what happens
    back: |
      The number stays the same. 9 ÷ 1 = 9, because 1 × 9 = 9.
    topic_code: "3.OA.B.6"
  - front: A number divided by itself → the quotient
    back: |
      1, as long as the number is not 0. 8 ÷ 8 = 1, because 8 × 1 = 8.
    topic_code: "3.OA.B.6"

quiz:
  description: |
    13 questions · about 25 minutes · division as a missing factor, fact families from arrays and tape diagrams,
    and finding the unknown number in an equation, plus review of area, subtracting within 1,000 and the order
    of factors. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word
    is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w13-q01
      type: multiple_choice
      topic_code: "3.OA.B.6"
      source: "IM K–5 Math Grade 3, Unit 4, Section B"
      points: 1
      stimulus: |
        Use the array. It shows the 28 tomato plants in Mr. Adebayo's garden.
      figure: figures/w13-tomato-array.svg
      figure_alt: "An array of green dots for tomato plants: 4 rows with 7 dots in each row, 28 dots in all."
      prompt: |
        Which multiplication equation helps you find 28 ÷ 4?
      options:
        - "4 × 8 = 32"
        - "7 + 7 + 7 = 21"
        - "4 × 7 = 28"
        - "4 + 28 = 32"
      option_explanations:
        - |
          The rows have 7 plants, not 8. Also 4 × 8 is 32, not the 28 plants in the garden.
        - |
          This adds only three rows of 7. The array has 4 rows, and 4 rows of 7 make 28.
        - |
          Correct. 4 rows of 7 make 28, so 28 split into 4 rows gives 7 in each: 28 ÷ 4 = 7.
        - |
          Adding 4 to 28 makes a bigger number. Division needs the factor that times 4 makes 28.
      answer: 2

    - slug: g3math-w13-q02
      type: multi_select
      topic_code: "3.OA.B.6"
      source: "IM K–5 Math Grade 3, Unit 4, Section B"
      points: 2
      partial_credit: true
      stimulus: |
        Use the array. It shows the 28 tomato plants in Mr. Adebayo's garden.
      prompt: |
        Which equations belong to the fact family the array shows? Select all that apply.
      options:
        - "4 × 7 = 28"
        - "28 ÷ 4 = 7"
        - "7 × 4 = 28"
        - "28 − 4 = 24"
        - "28 ÷ 7 = 4"
      option_explanations:
        - |
          Yes. The array has 4 rows of 7 plants, and 4 rows of 7 make 28 plants.
        - |
          Yes. 28 plants split into 4 rows gives 7 plants in each row.
        - |
          Yes. 7 columns of 4 plants also make 28. The factors can switch places.
        - |
          No. A fact family uses only multiplication and division with 4, 7 and 28. Subtraction is not part of it.
        - |
          Yes. 28 plants in groups of 7 make 4 groups, one for each row.
      answer: [0, 1, 2, 4]

    - slug: g3math-w13-q03
      type: numeric
      topic_code: "3.OA.A.4"
      source: "IM K–5 Math Grade 3, Unit 4, Section B"
      points: 1
      prompt: |
        What number makes this equation true? 8 × ? = 56
      answer: { value: 7, tolerance: 0 }
      explanation: |
        Think "8 times what is 56?" Count by 8s: 8, 16, 24, 32, 40, 48, 56. That is 7 eights, so the unknown is 7.

    - slug: g3math-w13-q04
      type: multiple_choice
      topic_code: "3.OA.B.6"
      source: "IM K–5 Math Grade 3, Unit 4, Section B"
      points: 1
      stimulus: |
        Use the tape diagram. All the parts are the same size.
      figure: figures/w13-tape-42.svg
      figure_alt: "A tape diagram: one long bar cut into 6 equal parts, each labeled with a question mark. A bracket over the whole bar is labeled 42."
      prompt: |
        Which equation matches the tape diagram?
      options:
        - "6 × ? = 42"
        - "42 × 6 = ?"
        - "6 + ? = 42"
        - "42 + 6 = ?"
      option_explanations:
        - |
          Correct. There are 6 equal parts and together they make 42, so 6 times the size of a part is 42.
        - |
          This would make the total bigger than 42. In the diagram 42 is already the total of the 6 parts.
        - |
          The bar has 6 equal parts, not one part of 6 and one unknown part. Equal parts mean multiplication.
        - |
          The diagram does not add 6 to 42. The whole bar is 42, cut into 6 equal parts.
      answer: 0

    - slug: g3math-w13-q05
      type: numeric
      topic_code: "3.OA.B.6"
      source: "IM K–5 Math Grade 3, Unit 4, Section B"
      points: 1
      stimulus: |
        Use the tape diagram. All the parts are the same size.
      prompt: |
        What number goes in each part?
      answer: { value: 7, tolerance: 0 }
      explanation: |
        6 × ? = 42. Since 6 × 7 = 42, each part is 7. That also means 42 ÷ 6 = 7.

    - slug: g3math-w13-q06
      type: multiple_choice
      topic_code: "3.OA.B.6"
      source: "IM K–5 Math Grade 3, Unit 4, Section B"
      points: 1
      prompt: |
        Which multiplication fact helps you solve 54 ÷ 9?
      options:
        - "9 × 5 = 45"
        - "5 × 4 = 20"
        - "54 − 9 = 45"
        - "9 × 6 = 54"
      option_explanations:
        - |
          9 × 5 is 45, which is one 9 short of 54. The fact you need has 54 as its product.
        - |
          This uses the digits of 54 as factors. The fact you need has 54 as the product and 9 as a factor.
        - |
          Subtracting one 9 does not tell how many 9s are in 54. Use a multiplication fact whose product is 54.
        - |
          Correct. 9 × 6 = 54, so 54 split into groups of 9 makes 6 groups: 54 ÷ 9 = 6.
      answer: 3

    - slug: g3math-w13-q07
      type: fill_blank
      topic_code: "3.OA.B.6"
      source: "IM K–5 Math Grade 3, Unit 4, Section B"
      points: 1
      prompt: |
        The equations 5 × 8 = 40, 8 × 5 = 40, 40 ÷ 5 = 8 and 40 ÷ 8 = 5 use the same three numbers. Together they are called a fact ____.
      answer: ["family", "fact family", "a fact family", "families"]
      explanation: |
        A fact family is a group of multiplication and division equations that use the same three numbers, here 5, 8 and 40.

    - slug: g3math-w13-q08
      type: true_false
      topic_code: "3.OA.B.6"
      source: "IM K–5 Math Grade 3, Unit 4, Section B"
      points: 1
      prompt: |
        True or false: if 6 × 9 = 54, then 54 ÷ 6 = 9.
      answer: true
      explanation: |
        True. 6 groups of 9 make 54, so 54 split into 6 equal groups has 9 in each group. Both equations are in the same fact family.

    - slug: g3math-w13-q09
      type: multiple_choice
      topic_code: "3.OA.A.4"
      source: "IM K–5 Math Grade 3, Unit 4, Section B"
      points: 1
      prompt: |
        What number makes this equation true? 36 ÷ ? = 4
      options:
        - "32"
        - "9"
        - "40"
        - "144"
      option_explanations:
        - |
          32 is 36 − 4. Ask instead: 4 times what number makes 36?
        - |
          Correct. 36 ÷ 9 = 4, because 4 × 9 = 36.
        - |
          40 is 36 + 4. Dividing 36 by 40 would not give 4. Think 4 × ? = 36.
        - |
          144 is 36 × 4. The unknown must divide 36 into groups, so it is smaller than 36.
      answer: 1

    - slug: g3math-w13-q10
      type: multiple_choice
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section B"
      points: 1
      prompt: |
        A rug is shaped like a rectangle. It is 5 feet long and 8 feet wide. What is its area?
      options:
        - "13 square feet"
        - "26 square feet"
        - "40 square feet"
        - "45 square feet"
      option_explanations:
        - |
          13 is 5 + 8. Area is found by multiplying the side lengths, not adding them.
        - |
          26 is the distance all the way around the rug (5 + 8 + 5 + 8). Area counts the squares inside.
        - |
          Correct. Area of a rectangle is length × width: 5 × 8 = 40 square feet.
        - |
          45 is 5 × 9, one row too many. The rug is 8 feet wide, so it is 5 × 8.
      answer: 2

    - slug: g3math-w13-q11
      type: numeric
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section B"
      points: 1
      prompt: |
        A farm had 500 eggs. It sold 263 eggs at the market. How many eggs are left?
      answer: { value: 237, tolerance: 0 }
      explanation: |
        500 − 263. There are no ones or tens in 500, so regroup: 500 is 4 hundreds, 9 tens and 10 ones. Ones: 10 − 3 = 7. Tens: 9 − 6 = 3. Hundreds: 4 − 2 = 2. That is 237 eggs. Check: 237 + 263 = 500.

    - slug: g3math-w13-q12
      type: multiple_choice
      topic_code: "3.OA.B.5"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      prompt: |
        Nia knows that 3 × 9 = 27. Which fact also equals 27?
      options:
        - "9 × 3"
        - "9 + 3"
        - "3 × 8"
        - "27 × 3"
      option_explanations:
        - |
          Correct. Switching the order of the factors does not change the product: 9 × 3 = 3 × 9 = 27.
        - |
          9 + 3 is 12. Adding the numbers is not the same as multiplying them.
        - |
          3 × 8 is 24, one group of 3 less than 3 × 9.
        - |
          27 × 3 is three groups of 27, which is much more than 27.
      answer: 0

    - slug: g3math-w13-q13
      type: short_answer
      topic_code: "3.OA.B.6"
      source: "IM K–5 Math Grade 3, Unit 4, Section B"
      points: 2
      prompt: |
        Ana wants to find 63 ÷ 7.

        (a) Write a multiplication equation with an unknown number that helps her.
        (b) Find 63 ÷ 7 and explain how your multiplication equation helps.
      answer: |
        (a) 7 × ? = 63 (or ? × 7 = 63).
        (b) 63 ÷ 7 = 9. Counting by 7s: 7, 14, 21, 28, 35, 42, 49, 56, 63 is 9 sevens, so 7 × 9 = 63. The missing factor is the answer to the division.
      explanation: |
        Two points.

        (a) 1 pt: a multiplication equation with an unknown, such as 7 × ? = 63, ? × 7 = 63 or 7 × n = 63.

        (b) 1 pt: 9, with a reason that links it to the multiplication, such as 7 × 9 = 63 or counting by 7s to 63.
