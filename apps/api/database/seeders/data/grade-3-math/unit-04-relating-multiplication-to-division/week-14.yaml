week: 14
unit: 4
title: "Multiplying by Multiples of 10 and Larger Products"
topics: ["3.NBT.A.3", "3.OA.B.5"]
guide: guides/week-14.md
guide_description: |
  How to multiply a one-digit number by 10, 20, 30 and other multiples of 10 by thinking in tens, and how to
  find products like 6 × 14 by splitting a rectangle into a tens part and a ones part.
flashcards_description: |
  18 cards on multiples of 10, multiplying by thinking in tens, base-ten pictures, and splitting a factor to
  find a larger product.

flashcards:
  - front: Multiple of 10 → what it is
    back: |
      A number you say when you count by 10s: 10, 20, 30, 40, 50 and so on. Each one is a number of tens.
    topic_code: "3.NBT.A.3"
  - front: 40 → how many tens
    back: |
      4 tens. 40 = 4 × 10.
    topic_code: "3.NBT.A.3"
  - front: 3 × 20 → thinking in tens
    back: |
      20 is 2 tens. 3 × 2 tens = 6 tens, and 6 tens is 60.
    topic_code: "3.NBT.A.3"
  - front: 4 × 30 → thinking in tens
    back: |
      30 is 3 tens. 4 × 3 tens = 12 tens, and 12 tens is 120.
    topic_code: "3.NBT.A.3"
  - front: 7 × 50 → product
    back: |
      350. 7 × 5 tens = 35 tens = 350.
    topic_code: "3.NBT.A.3"
  - front: 9 × 60 → product
    back: |
      540. 9 × 6 tens = 54 tens = 540.
    topic_code: "3.NBT.A.3"
  - front: 8 × 80 → product
    back: |
      640. 8 × 8 tens = 64 tens = 640.
    topic_code: "3.NBT.A.3"
  - front: 5 × 40 → product
    back: |
      200. 5 × 4 tens = 20 tens, and 20 tens is 200.
    topic_code: "3.NBT.A.3"
  - front: 12 tens → as a number
    back: |
      120. Ten tens make 100, and 2 more tens make 120.
    topic_code: "3.NBT.A.3"
  - front: Base-ten rod → what it stands for
    back: |
      1 ten. A picture of 4 groups with 3 rods in each shows 4 × 30 = 120.
    topic_code: "3.NBT.A.3"
  - front: Multiplying by a multiple of 10 → the mistake to avoid
    back: |
      Forgetting the tens. 6 × 40 is not 24; it is 24 tens, which is 240.
    topic_code: "3.NBT.A.3"
  - front: 6 × 3 and 6 × 30 → how they are related
    back: |
      6 × 3 = 18 ones, and 6 × 30 = 18 tens = 180. Same facts, but tens instead of ones.
    topic_code: "3.NBT.A.3"
  - front: Splitting a factor → why it helps
    back: |
      A big factor can be broken into easier parts. 6 × 14 = 6 × 10 + 6 × 4 = 60 + 24 = 84.
    topic_code: "3.OA.B.5"
  - front: Distributive property → in words
    back: |
      You can split one factor into parts, multiply each part, then add. 7 × 12 = 7 × 10 + 7 × 2 = 70 + 14 = 84.
    topic_code: "3.OA.B.5"
  - front: Area diagram for 4 × 18 → how to split it
    back: |
      Cut the 18 side into 10 and 8. Find 4 × 10 = 40 and 4 × 8 = 32, then add: 40 + 32 = 72.
    topic_code: "3.OA.B.5"
  - front: 3 × 16 → by splitting
    back: |
      3 × 10 = 30 and 3 × 6 = 18. 30 + 18 = 48.
    topic_code: "3.OA.B.5"
  - front: 5 × 17 → by splitting
    back: |
      5 × 10 = 50 and 5 × 7 = 35. 50 + 35 = 85.
    topic_code: "3.OA.B.5"
  - front: Splitting a factor → the mistake to avoid
    back: |
      Multiplying only one part. 6 × 14 is not 6 × 10 + 4; both parts must be multiplied by 6: 6 × 10 + 6 × 4.
    topic_code: "3.OA.B.5"

quiz:
  description: |
    14 questions · about 25 minutes · multiplying by multiples of 10 with base-ten pictures, splitting a
    rectangle to find a larger product, plus review of division, rounding and area. Multiple choice,
    select-all, true/false and number answers are graded at once; the fill-in word is matched automatically;
    the short answer is checked by your teacher.
  questions:
    - slug: g3math-w14-q01
      type: multiple_choice
      topic_code: "3.NBT.A.3"
      source: "IM K–5 Math Grade 3, Unit 4, Section C"
      points: 1
      stimulus: |
        Use the base-ten picture. Each rod is 1 ten.
      figure: figures/w14-tens-rods.svg
      figure_alt: "Four boxes in a row. Each box holds 3 blue base-ten rods, and each rod is split into 10 small squares. There are 12 rods in all."
      prompt: |
        Which expression matches the picture?
      options:
        - "4 × 3"
        - "4 × 30"
        - "4 + 30"
        - "7 × 10"
      option_explanations:
        - |
          4 × 3 counts the rods as ones. Each rod is a ten, so each box holds 30, not 3.
        - |
          Correct. There are 4 boxes and each box holds 3 tens, which is 30. That is 4 × 30.
        - |
          4 + 30 adds one box to the number in a box. There are 4 equal groups of 30, so multiply.
        - |
          7 × 10 adds the 4 boxes and the 3 rods in a box. Count the rods instead: there are 12 tens.
      answer: 1

    - slug: g3math-w14-q02
      type: numeric
      topic_code: "3.NBT.A.3"
      source: "IM K–5 Math Grade 3, Unit 4, Section C"
      points: 1
      stimulus: |
        Use the base-ten picture. Each rod is 1 ten.
      prompt: |
        What number does the whole picture show?
      answer: { value: 120, tolerance: 0 }
      explanation: |
        4 boxes × 3 tens = 12 tens. Ten tens are 100, and 2 more tens are 20, so 12 tens = 120. That is 4 × 30 = 120.

    - slug: g3math-w14-q03
      type: multiple_choice
      topic_code: "3.NBT.A.3"
      source: "IM K–5 Math Grade 3, Unit 4, Section C"
      points: 1
      prompt: |
        What is 6 × 50?
      options:
        - "30"
        - "56"
        - "3,000"
        - "300"
      option_explanations:
        - |
          30 is 6 × 5. But 50 is 5 tens, so the product is 30 tens, not 30 ones.
        - |
          56 is 6 + 50. Multiplying makes 6 groups of 50, which is much more.
        - |
          3,000 has one zero too many. 6 × 5 tens = 30 tens, and 30 tens is 300.
        - |
          Correct. 50 is 5 tens. 6 × 5 tens = 30 tens = 300.
      answer: 3

    - slug: g3math-w14-q04
      type: numeric
      topic_code: "3.NBT.A.3"
      source: "IM K–5 Math Grade 3, Unit 4, Section C"
      points: 1
      prompt: |
        A box holds 20 markers. How many markers are in 8 boxes?
      answer: { value: 160, tolerance: 0 }
      explanation: |
        8 × 20. 20 is 2 tens, and 8 × 2 tens = 16 tens. 16 tens is 160 markers.

    - slug: g3math-w14-q05
      type: multiple_choice
      topic_code: "3.OA.B.5"
      source: "IM K–5 Math Grade 3, Unit 4, Section C"
      points: 1
      stimulus: |
        Use the rectangle diagram. The rectangle is 6 units tall and 14 units long, and a red line splits it into two parts.
      figure: figures/w14-area-6-by-14.svg
      figure_alt: "A rectangle on a grid of unit squares, 6 squares tall and 14 squares long. A red line splits it into a left part 10 squares long and a right part 4 squares long. The side is labeled 6 and the top is labeled 10 and 4."
      prompt: |
        Which expression shows the area of the whole rectangle?
      options:
        - "6 × 10 + 6 × 4"
        - "6 × 10 + 4"
        - "6 + 10 + 4"
        - "10 × 4 + 6"
      option_explanations:
        - |
          Correct. The left part is 6 by 10 and the right part is 6 by 4. Add the two areas to get the whole.
        - |
          The right part is not just 4 squares. It is 6 rows of 4, so it is 6 × 4.
        - |
          Adding the side lengths does not count the squares inside. Each part's area is a multiplication.
        - |
          10 × 4 multiplies the two top lengths, which are side by side. Each part must use the height, 6.
      answer: 0

    - slug: g3math-w14-q06
      type: numeric
      topic_code: "3.OA.B.5"
      source: "IM K–5 Math Grade 3, Unit 4, Section C"
      points: 1
      stimulus: |
        Use the rectangle diagram. The rectangle is 6 units tall and 14 units long, and a red line splits it into two parts.
      prompt: |
        What is the area of the whole rectangle, in square units?
      answer: { value: 84, tolerance: 0 }
      explanation: |
        Left part: 6 × 10 = 60. Right part: 6 × 4 = 24. Whole rectangle: 60 + 24 = 84 square units, so 6 × 14 = 84.

    - slug: g3math-w14-q07
      type: fill_blank
      topic_code: "3.OA.B.5"
      source: "IM K–5 Math Grade 3, Unit 4, Section C"
      points: 1
      prompt: |
        Finding 6 × 14 by splitting it into 6 × 10 and 6 × 4 and then adding uses the ____ property.
      answer: ["distributive", "the distributive", "distributive property", "the distributive property"]
      explanation: |
        The distributive property lets you split one factor into parts (14 = 10 + 4), multiply each part, and add the products.

    - slug: g3math-w14-q08
      type: true_false
      topic_code: "3.NBT.A.3"
      source: "IM K–5 Math Grade 3, Unit 4, Section C"
      points: 1
      prompt: |
        True or false: 3 × 90 = 27.
      answer: false
      explanation: |
        False. 90 is 9 tens, so 3 × 90 = 27 tens, which is 270. The answer 27 forgets that we are counting tens.

    - slug: g3math-w14-q09
      type: multi_select
      topic_code: "3.NBT.A.3"
      source: "IM K–5 Math Grade 3, Unit 4, Section C"
      points: 2
      partial_credit: true
      prompt: |
        Which products are equal to 240? Select all that apply.
      options:
        - "8 × 30"
        - "4 × 60"
        - "6 × 40"
        - "2 × 40"
        - "3 × 70"
      option_explanations:
        - |
          Yes. 30 is 3 tens, and 8 × 3 tens = 24 tens = 240.
        - |
          Yes. 60 is 6 tens, and 4 × 6 tens = 24 tens = 240.
        - |
          Yes. 40 is 4 tens, and 6 × 4 tens = 24 tens = 240.
        - |
          No. 40 is 4 tens, and 2 × 4 tens = 8 tens, which is only 80.
        - |
          No. 70 is 7 tens, and 3 × 7 tens = 21 tens, which is 210, not 240.
      answer: [0, 1, 2]

    - slug: g3math-w14-q10
      type: multiple_choice
      topic_code: "3.OA.B.5"
      source: "IM K–5 Math Grade 3, Unit 4, Section C"
      points: 1
      prompt: |
        Which is the same as 8 × 7?
      options:
        - "8 × 5 + 2"
        - "8 × 5 + 7 × 2"
        - "8 × 5 + 8 × 2"
        - "5 × 2 + 8"
      option_explanations:
        - |
          This multiplies the 5 by 8 but adds only 2. The 2 must also be multiplied by 8: 40 + 2 is 42, not 56.
        - |
          The second part uses 7 instead of 8. Both parts must be groups of 8: 8 × 5 + 8 × 2.
        - |
          Correct. 7 = 5 + 2, so 8 × 7 = 8 × 5 + 8 × 2 = 40 + 16 = 56.
        - |
          5 × 2 + 8 is 18. This does not keep 8 groups of 7 at all.
      answer: 2

    - slug: g3math-w14-q11
      type: multiple_choice
      topic_code: "3.OA.A.2"
      source: "IM K–5 Math Grade 3, Unit 4, Section A"
      points: 1
      prompt: |
        27 children line up in 3 equal lines for a relay race. How many children are in each line?
      options:
        - "24"
        - "30"
        - "81"
        - "9"
      option_explanations:
        - |
          24 is 27 − 3. Sharing 27 children into 3 lines means splitting them into 3 equal groups.
        - |
          30 is 27 + 3. Making lines does not add children.
        - |
          81 is 27 × 3. That would be 3 lines of 27, but there are only 27 children in all.
        - |
          Correct. 27 ÷ 3 = 9, because 3 lines of 9 make 27.
      answer: 3

    - slug: g3math-w14-q12
      type: numeric
      topic_code: "3.NBT.A.1"
      source: "IM K–5 Math Grade 3, Unit 3, Section C"
      points: 1
      prompt: |
        Round 352 to the nearest ten.
      answer: { value: 350, tolerance: 0 }
      explanation: |
        352 is between 350 and 360. It has 2 ones, which is less than 5, so it is closer to 350.

    - slug: g3math-w14-q13
      type: short_answer
      topic_code: "3.NBT.A.3"
      source: "IM K–5 Math Grade 3, Unit 4, Section C"
      points: 2
      prompt: |
        Tomás says 5 × 60 = 30 because 5 × 6 = 30.

        (a) What is 5 × 60?
        (b) Explain, using tens, why Tomás's answer is not right.
      answer: |
        (a) 300.
        (b) 60 is 6 tens. 5 × 6 tens = 30 tens, and 30 tens is 300. Tomás found 30 ones instead of 30 tens.
      explanation: |
        Two points.

        (a) 1 pt: 300.

        (b) 1 pt: an explanation that uses tens, such as "60 is 6 tens, so the answer is 30 tens = 300", or a picture of 5 groups of 6 rods.

    - slug: g3math-w14-q14
      type: multiple_choice
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section B"
      points: 1
      prompt: |
        A garden bed is a rectangle 7 feet long and 6 feet wide. What is its area?
      options:
        - "42 square feet"
        - "13 square feet"
        - "26 square feet"
        - "36 square feet"
      option_explanations:
        - |
          Correct. The area of a rectangle is length × width: 7 × 6 = 42 square feet.
        - |
          13 is 7 + 6. To find area, multiply the side lengths.
        - |
          26 is the distance around the bed (7 + 6 + 7 + 6). Area counts the square feet inside.
        - |
          36 is 6 × 6. The bed is 7 feet long, so it is 7 × 6.
      answer: 0
