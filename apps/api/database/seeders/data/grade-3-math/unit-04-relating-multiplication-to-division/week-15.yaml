week: 15
unit: 4
title: "Dividing Larger Numbers Using Facts You Know"
topics: ["3.OA.C.7"]
guide: guides/week-15.md
guide_description: |
  How to divide numbers up to 100 by sharing tens and ones, by splitting a total into friendly parts on an
  area diagram, and by skip-counting on a number line, always checking with multiplication.
flashcards_description: |
  18 cards on division facts, dividing tens and ones separately, splitting a total into friendly parts, and
  checking a quotient with multiplication.

flashcards:
  - front: Division facts → how to learn them fast
    back: |
      Learn them with their multiplication partners. If you know 7 × 8 = 56, you also know 56 ÷ 7 = 8 and 56 ÷ 8 = 7.
    topic_code: "3.OA.C.7"
  - front: 48 ÷ 6 → quotient
    back: |
      8, because 6 × 8 = 48.
    topic_code: "3.OA.C.7"
  - front: 63 ÷ 9 → quotient
    back: |
      7, because 9 × 7 = 63.
    topic_code: "3.OA.C.7"
  - front: 56 ÷ 7 → quotient
    back: |
      8, because 7 × 8 = 56.
    topic_code: "3.OA.C.7"
  - front: 81 ÷ 9 → quotient
    back: |
      9, because 9 × 9 = 81.
    topic_code: "3.OA.C.7"
  - front: 36 ÷ 4 → quotient
    back: |
      9, because 4 × 9 = 36.
    topic_code: "3.OA.C.7"
  - front: 70 ÷ 7 → quotient
    back: |
      10, because 7 × 10 = 70.
    topic_code: "3.OA.C.7"
  - front: Dividing tens and ones → how it works
    back: |
      Share the tens first, then the ones. 48 ÷ 4: 4 tens ÷ 4 = 1 ten, 8 ones ÷ 4 = 2 ones, so the answer is 12.
    topic_code: "3.OA.C.7"
  - front: 66 ÷ 3 → by tens and ones
    back: |
      6 tens ÷ 3 = 2 tens and 6 ones ÷ 3 = 2 ones. 66 ÷ 3 = 22.
    topic_code: "3.OA.C.7"
  - front: Friendly parts → what they are
    back: |
      Parts of the total that are easy to divide, like a multiple of 10 times the divisor. For 52 ÷ 4, use 40 and 12.
    topic_code: "3.OA.C.7"
  - front: 52 ÷ 4 → by friendly parts
    back: |
      52 = 40 + 12. 40 ÷ 4 = 10 and 12 ÷ 4 = 3. 10 + 3 = 13.
    topic_code: "3.OA.C.7"
  - front: 75 ÷ 5 → by friendly parts
    back: |
      75 = 50 + 25. 50 ÷ 5 = 10 and 25 ÷ 5 = 5. 10 + 5 = 15.
    topic_code: "3.OA.C.7"
  - front: Area diagram for division → what is known and unknown
    back: |
      The area (the total) and one side are known. The other side is the quotient. Area 52 with a side of 4: the other side is 13.
    topic_code: "3.OA.C.7"
  - front: Number line for 54 ÷ 6 → how to use it
    back: |
      Jump by 6 from 0 until you land on 54, then count the jumps. There are 9 jumps, so 54 ÷ 6 = 9.
    topic_code: "3.OA.C.7"
  - front: Counting jumps on a number line → the mistake to avoid
    back: |
      Count the jumps, not the tick marks. From 0 to 54 by 6s there are 10 tick marks but only 9 jumps.
    topic_code: "3.OA.C.7"
  - front: Quotient of 0 divided by a number → what it is
    back: |
      0. If there is nothing to share, every group gets 0: 0 ÷ 5 = 0.
    topic_code: "3.OA.C.7"
  - front: Checking 84 ÷ 4 = 21 → how
    back: |
      Multiply: 4 × 21 = 4 × 20 + 4 × 1 = 80 + 4 = 84. It matches, so 21 is right.
    topic_code: "3.OA.C.7"
  - front: Dividing within 100 → three strategies
    back: |
      1. Use a multiplication fact. 2. Split into tens and ones or friendly parts. 3. Skip-count on a number line.
    topic_code: "3.OA.C.7"

quiz:
  description: |
    14 questions · about 25 minutes · dividing numbers up to 100 with base-ten pictures, area diagrams, number
    lines and known facts, plus review of sharing, multiplying by tens, two-step problems and area. Multiple
    choice, select-all, true/false and number answers are graded at once; the fill-in word is matched
    automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w15-q01
      type: multiple_choice
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 1
      stimulus: |
        Use the picture. Hana shared 48 beads equally into 4 bags. Each rod is 10 beads and each small square is 1 bead.
      figure: figures/w15-beads-in-bags.svg
      figure_alt: "Four tall boxes labeled Bag 1, Bag 2, Bag 3 and Bag 4. Each bag holds 1 blue base-ten rod made of 10 small squares and 2 separate small squares."
      prompt: |
        How many beads are in each bag?
      options:
        - "3"
        - "12"
        - "4"
        - "44"
      option_explanations:
        - |
          3 counts the pieces in one bag (1 rod and 2 squares). The rod is worth 10 beads, so the bag has 10 + 2.
        - |
          Correct. Each bag has 1 ten and 2 ones, which is 12 beads. 48 ÷ 4 = 12.
        - |
          4 is the number of bags, not the number of beads in each bag.
        - |
          44 is 48 − 4. Sharing among 4 bags splits 48 into 4 equal parts.
      answer: 1

    - slug: g3math-w15-q02
      type: true_false
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 1
      stimulus: |
        Use the picture. Hana shared 48 beads equally into 4 bags. Each rod is 10 beads and each small square is 1 bead.
      prompt: |
        True or false: the picture also shows that 4 × 12 = 48.
      answer: true
      explanation: |
        True. There are 4 bags with 12 beads in each, and 4 groups of 12 make 48. Sharing 48 into 4 bags and making 4 groups of 12 are the same picture.

    - slug: g3math-w15-q03
      type: numeric
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 1
      stimulus: |
        Use the area diagram. A rectangle has an area of 52 square units and a side of 4 units. It is split into two parts with areas of 40 and 12 square units.
      figure: figures/w15-area-52.svg
      figure_alt: "A rectangle with a left side labeled 4. A line splits it into a wide left part with 40 written inside and a narrow right part with 12 written inside. Above the left part the top is labeled 10, and above the right part it is labeled with a question mark."
      prompt: |
        What number goes where the question mark is?
      answer: { value: 3, tolerance: 0 }
      explanation: |
        The right part has an area of 12 and a side of 4. 4 × ? = 12, and 4 × 3 = 12, so the missing length is 3.

    - slug: g3math-w15-q04
      type: multiple_choice
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 1
      stimulus: |
        Use the area diagram. A rectangle has an area of 52 square units and a side of 4 units. It is split into two parts with areas of 40 and 12 square units.
      prompt: |
        What is 52 ÷ 4?
      options:
        - "13"
        - "3"
        - "10"
        - "48"
      option_explanations:
        - |
          Correct. The whole top side is 10 + 3 = 13, so 4 × 13 = 52 and 52 ÷ 4 = 13.
        - |
          3 is only the length above the small part. Add the length above the big part, 10, too.
        - |
          10 is only the length above the big part. The small part adds 3 more.
        - |
          48 is 52 − 4. The diagram splits 52 into parts that are easy to divide by 4.
      answer: 0

    - slug: g3math-w15-q05
      type: multiple_choice
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 1
      figure: figures/w15-jumps-of-6.svg
      figure_alt: "A number line with tick marks labeled 0, 6, 12, 18, 24, 30, 36, 42, 48 and 54. Blue arcs jump from each tick mark to the next, from 0 all the way to 54: 9 jumps in all."
      prompt: |
        Kwame uses the number line to find 54 ÷ 6. How many jumps of 6 does it take to get from 0 to 54?
      options:
        - "10"
        - "8"
        - "6"
        - "9"
      option_explanations:
        - |
          10 is the number of tick marks, including 0. Count the jumps between the marks instead.
        - |
          8 leaves out one jump. Count again from 0: the jumps land on 6, 12, 18, 24, 30, 36, 42, 48, 54.
        - |
          6 is the size of each jump, not how many jumps there are.
        - |
          Correct. The jumps land on 6, 12, 18, 24, 30, 36, 42, 48 and 54. That is 9 jumps, so 54 ÷ 6 = 9.
      answer: 3

    - slug: g3math-w15-q06
      type: numeric
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 1
      prompt: |
        What is 72 ÷ 8?
      answer: { value: 9, tolerance: 0 }
      explanation: |
        Think 8 × ? = 72. 8 × 9 = 72, so 72 ÷ 8 = 9.

    - slug: g3math-w15-q07
      type: multiple_choice
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 1
      prompt: |
        Sofia knows that 6 × 8 = 48. Which division can she solve with that fact?
      options:
        - "42 ÷ 6"
        - "56 ÷ 8"
        - "48 ÷ 6"
        - "48 ÷ 5"
      option_explanations:
        - |
          42 ÷ 6 needs the fact 6 × 7 = 42. Sofia's fact has 48 as the product.
        - |
          56 ÷ 8 needs the fact 7 × 8 = 56. Sofia's fact has 48 as the product.
        - |
          Correct. 6 × 8 = 48, so 48 split into 6 groups has 8 in each: 48 ÷ 6 = 8.
        - |
          5 is not a factor in Sofia's fact, and 48 cannot be split into 5 equal whole groups.
      answer: 2

    - slug: g3math-w15-q08
      type: fill_blank
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 1
      prompt: |
        To check that 81 ÷ 9 = 9 is right, you can use the opposite operation, ____.
      answer: ["multiplication", "multiplying", "multiply", "times"]
      explanation: |
        Multiplication undoes division. 9 × 9 = 81, so 81 ÷ 9 = 9 is right.

    - slug: g3math-w15-q09
      type: multi_select
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 2
      partial_credit: true
      prompt: |
        Which equations are true? Select all that apply.
      options:
        - "64 ÷ 8 = 8"
        - "45 ÷ 5 = 9"
        - "36 ÷ 4 = 8"
        - "70 ÷ 7 = 10"
        - "24 ÷ 3 = 7"
      option_explanations:
        - |
          True. 8 × 8 = 64, so 64 split into 8 equal groups has 8 in each.
        - |
          True. 5 × 9 = 45, so 45 split into 5 equal groups has 9 in each.
        - |
          False. 4 × 8 is 32, not 36. The quotient is 9, because 4 × 9 = 36.
        - |
          True. 7 × 10 = 70, so 70 split into 7 equal groups has 10 in each.
        - |
          False. 3 × 7 is 21, not 24. The quotient is 8, because 3 × 8 = 24.
      answer: [0, 1, 3]

    - slug: g3math-w15-q10
      type: numeric
      topic_code: "3.OA.A.2"
      source: "IM K–5 Math Grade 3, Unit 4, Section A"
      points: 1
      prompt: |
        Coach Rivera has 60 cones. She puts them in 5 equal rows. How many cones are in each row?
      answer: { value: 12, tolerance: 0 }
      explanation: |
        60 ÷ 5. Split 60 into 50 and 10. 50 ÷ 5 = 10 and 10 ÷ 5 = 2, so each row has 10 + 2 = 12 cones. Check: 5 × 12 = 60.

    - slug: g3math-w15-q11
      type: multiple_choice
      topic_code: "3.NBT.A.3"
      source: "IM K–5 Math Grade 3, Unit 4, Section C"
      points: 1
      prompt: |
        What is 9 × 40?
      options:
        - "360"
        - "36"
        - "49"
        - "3,600"
      option_explanations:
        - |
          Correct. 40 is 4 tens. 9 × 4 tens = 36 tens = 360.
        - |
          36 is 9 × 4. Since 40 is 4 tens, the product is 36 tens, not 36 ones.
        - |
          49 is 9 + 40. Multiplying makes 9 groups of 40.
        - |
          3,600 is too big by ten times. 36 tens is 360.
      answer: 0

    - slug: g3math-w15-q12
      type: numeric
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 3, Section D"
      points: 1
      prompt: |
        Leo had 45 stickers. Then he got 3 packs with 8 stickers in each pack. How many stickers does Leo have now?
      answer: { value: 69, tolerance: 0 }
      explanation: |
        Step 1: the packs hold 3 × 8 = 24 stickers. Step 2: 45 + 24 = 69 stickers.

    - slug: g3math-w15-q13
      type: multiple_choice
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section B"
      points: 1
      prompt: |
        A rectangle has an area of 36 square units. One side is 4 units long. How long is the other side?
      options:
        - "32 units"
        - "40 units"
        - "144 units"
        - "9 units"
      option_explanations:
        - |
          32 is 36 − 4. The sides multiply to make the area, so think 4 × ? = 36.
        - |
          40 is 36 + 4. The other side times 4 must equal 36.
        - |
          144 is 36 × 4. The area is already 36; you need the side that times 4 makes 36.
        - |
          Correct. 4 × 9 = 36, so the other side is 9 units. That is 36 ÷ 4 = 9.
      answer: 3

    - slug: g3math-w15-q14
      type: short_answer
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 2
      prompt: |
        Ji-woo wants to find 84 ÷ 4.

        (a) What is 84 ÷ 4?
        (b) Show how you could split 84 into friendly parts to find it.
      answer: |
        (a) 21.
        (b) 84 = 80 + 4. 80 ÷ 4 = 20 and 4 ÷ 4 = 1. 20 + 1 = 21. Check: 4 × 21 = 84.
      explanation: |
        Two points.

        (a) 1 pt: 21.

        (b) 1 pt: a split that works, such as 80 + 4 or 40 + 40 + 4, with each part divided by 4 and the results added. An area diagram or base-ten drawing showing 2 tens and 1 one in each of 4 groups also earns the point.
