unit: 4
description: |
  20 questions · about 40 minutes · every standard of Unit 4: division as sharing and as making groups,
  division as an unknown factor and fact families, finding unknown numbers, multiplying by multiples of 10,
  splitting a factor to find a larger product, dividing within 100, and multiplication and division word
  problems. Two stimulus sets share an array or an area diagram across consecutive items. Multiple choice,
  select-all, true/false and number answers are graded at once; the fill-in word is matched automatically;
  the short answer is checked by your teacher against the scoring notes.
questions:
  # ---- Division as sharing and making groups (3.OA.A.2)
  - slug: g3math-u04-check-q01
    type: multiple_choice
    topic_code: "3.OA.A.2"
    source: "IM K–5 Math Grade 3, Unit 4, Section A"
    points: 1
    figure: figures/u04-shell-bags.svg
    figure_alt: "Four bags drawn as circles in a row. Each bag holds 5 blue dots for shells, so there are 20 shells in all."
    prompt: |
      Kai put 20 shells into bags with 5 shells in each bag, as the picture shows. He wrote 20 ÷ 5 = 4. What does the 4 tell us?
    options:
      - "The number of bags"
      - "The number of shells in each bag"
      - "The total number of shells"
      - "The number of shells left over"
    option_explanations:
      - |
        Correct. Kai made groups of 5 from 20 shells, and the quotient 4 is how many groups, or bags, he filled.
      - |
        Each bag holds 5 shells, and 5 is the number Kai divided by. The 4 is how many bags.
      - |
        The total is 20, the first number in the equation. The 4 is the answer, the number of bags.
      - |
        Nothing is left over: 4 bags of 5 use all 20 shells. The 4 counts the bags.
    answer: 0

  - slug: g3math-u04-check-q02
    type: numeric
    topic_code: "3.OA.A.2"
    source: "IM K–5 Math Grade 3, Unit 4, Section A"
    points: 1
    prompt: |
      42 crayons are shared equally among 6 tables. How many crayons does each table get?
    answer: { value: 7, tolerance: 0 }
    explanation: |
      42 ÷ 6. Since 6 × 7 = 42, each table gets 7 crayons.

  - slug: g3math-u04-check-q03
    type: multiple_choice
    topic_code: "3.OA.A.2"
    source: "IM K–5 Math Grade 3, Unit 4, Section A"
    points: 1
    prompt: |
      Which story matches 24 ÷ 8?
    options:
      - "There are 8 bowls with 24 grapes in each bowl. How many grapes are there?"
      - "There are 24 grapes and 8 are eaten. How many grapes are left?"
      - "24 grapes are put in groups of 8. How many groups are there?"
      - "There are 8 grapes, and then 24 more are added. How many grapes are there now?"
    option_explanations:
      - |
        This story asks for a total of 8 groups of 24, which is 8 × 24. In 24 ÷ 8, 24 is the total.
      - |
        Eating 8 grapes is subtraction, 24 − 8. Nothing is split into equal groups.
      - |
        Correct. 24 is the total and 8 is the size of each group, so 24 ÷ 8 finds the number of groups: 3.
      - |
        Adding 24 more is addition, 8 + 24. Division splits a total into equal groups.
    answer: 2

  # ---- Stimulus set A: an array of cupcakes (3.OA.B.6)
  - slug: g3math-u04-check-q04
    type: multiple_choice
    topic_code: "3.OA.B.6"
    source: "IM K–5 Math Grade 3, Unit 4, Section B"
    points: 1
    stimulus: |
      Use the array. It shows 48 cupcakes on a table, in 6 rows.
    figure: figures/u04-cupcake-array.svg
    figure_alt: "An array of red dots for cupcakes: 6 rows with 8 dots in each row, 48 dots in all."
    prompt: |
      Which multiplication fact helps you find 48 ÷ 6?
    options:
      - "6 × 7 = 42"
      - "6 × 8 = 48"
      - "4 × 8 = 32"
      - "48 − 6 = 42"
    option_explanations:
      - |
        6 × 7 is 42, one cupcake short in every row. Each row has 8 cupcakes.
      - |
        Correct. 6 rows of 8 make 48, so 48 split into 6 rows gives 8 in each row: 48 ÷ 6 = 8.
      - |
        4 × 8 uses the digits of 48 as factors. The fact you need has 48 as the product and 6 as a factor.
      - |
        Taking away one 6 does not tell how many are in each row. Use a multiplication fact with a product of 48.
    answer: 1

  - slug: g3math-u04-check-q05
    type: multi_select
    topic_code: "3.OA.B.6"
    source: "IM K–5 Math Grade 3, Unit 4, Section B"
    points: 2
    partial_credit: true
    stimulus: |
      Use the array. It shows 48 cupcakes on a table, in 6 rows.
    prompt: |
      Which equations belong to the fact family the array shows? Select all that apply.
    options:
      - "8 × 6 = 48"
      - "48 ÷ 6 = 8"
      - "6 + 8 = 14"
      - "48 ÷ 8 = 6"
      - "48 − 8 = 40"
    option_explanations:
      - |
        Yes. The array also has 8 columns of 6 cupcakes, which make 48.
      - |
        Yes. 48 cupcakes split into 6 rows gives 8 in each row.
      - |
        No. A fact family for this array uses multiplication and division with 6, 8 and 48, not addition.
      - |
        Yes. 48 cupcakes in groups of 8 make 6 groups, one for each row.
      - |
        No. Subtraction is not part of a multiplication and division fact family.
    answer: [0, 1, 3]

  # ---- Unknown numbers (3.OA.A.4)
  - slug: g3math-u04-check-q06
    type: numeric
    topic_code: "3.OA.A.4"
    source: "IM K–5 Math Grade 3, Unit 4, Section B"
    points: 1
    prompt: |
      What number makes this equation true? ? × 9 = 72
    answer: { value: 8, tolerance: 0 }
    explanation: |
      Count by 9s: 9, 18, 27, 36, 45, 54, 63, 72. That is 8 nines, so 8 × 9 = 72 and the unknown is 8.

  - slug: g3math-u04-check-q07
    type: multiple_choice
    topic_code: "3.OA.A.4"
    source: "IM K–5 Math Grade 3, Unit 4, Section B"
    points: 1
    prompt: |
      What number makes this equation true? 56 ÷ ? = 8
    options:
      - "48"
      - "64"
      - "9"
      - "7"
    option_explanations:
      - |
        48 is 56 − 8. Think of the multiplication instead: 8 times what number makes 56?
      - |
        64 is 56 + 8. Dividing 56 by a number bigger than 56 would not give 8.
      - |
        8 × 9 is 72, not 56. Try one less: 8 × 7 = 56.
      - |
        Correct. 56 ÷ 7 = 8, because 8 × 7 = 56.
    answer: 3

  - slug: g3math-u04-check-q08
    type: fill_blank
    topic_code: "3.OA.B.6"
    source: "IM K–5 Math Grade 3, Unit 4, Section B"
    points: 1
    prompt: |
      To find 35 ÷ 7, Zara thinks 7 × ? = 35. The unknown number in her equation is a missing ____.
    answer: ["factor", "a factor", "the factor", "factors"]
    explanation: |
      7 and the unknown are the factors and 35 is the product. Division finds the missing factor: 7 × 5 = 35, so 35 ÷ 7 = 5.

  # ---- Multiples of 10 (3.NBT.A.3)
  - slug: g3math-u04-check-q09
    type: multiple_choice
    topic_code: "3.NBT.A.3"
    source: "IM K–5 Math Grade 3, Unit 4, Section C"
    points: 1
    prompt: |
      What is 7 × 80?
    options:
      - "560"
      - "56"
      - "87"
      - "5,600"
    option_explanations:
      - |
        Correct. 80 is 8 tens. 7 × 8 tens = 56 tens = 560.
      - |
        56 is 7 × 8. Since 80 is 8 tens, the product is 56 tens, not 56 ones.
      - |
        87 is 7 + 80. Multiplying makes 7 groups of 80.
      - |
        5,600 is ten times too big. 56 tens is 560.
    answer: 0

  - slug: g3math-u04-check-q10
    type: numeric
    topic_code: "3.NBT.A.3"
    source: "IM K–5 Math Grade 3, Unit 4, Section C"
    points: 1
    prompt: |
      Each shelf in the class library holds 30 books. How many books do 7 shelves hold?
    answer: { value: 210, tolerance: 0 }
    explanation: |
      7 × 30. 30 is 3 tens, and 7 × 3 tens = 21 tens. 21 tens is 210 books.

  - slug: g3math-u04-check-q11
    type: true_false
    topic_code: "3.NBT.A.3"
    source: "IM K–5 Math Grade 3, Unit 4, Section C"
    points: 1
    prompt: |
      True or false: 5 × 80 = 400.
    answer: true
    explanation: |
      True. 80 is 8 tens, and 5 × 8 tens = 40 tens. 40 tens is 400.

  # ---- Stimulus set B: splitting a rectangle (3.OA.B.5)
  - slug: g3math-u04-check-q12
    type: multiple_choice
    topic_code: "3.OA.B.5"
    source: "IM K–5 Math Grade 3, Unit 4, Section C"
    points: 1
    stimulus: |
      Use the area diagram. A rectangle 7 units tall and 13 units long is split into a part 10 units long and a part 3 units long.
    figure: figures/u04-area-7-by-13.svg
    figure_alt: "A rectangle with its left side labeled 7. A line splits it into a wide left part and a narrow right part. The top of the left part is labeled 10 and the top of the right part is labeled 3."
    prompt: |
      Which expression shows the area of the whole rectangle?
    options:
      - "7 × 10 + 3"
      - "7 + 10 + 3"
      - "7 × 10 + 7 × 3"
      - "10 × 3 + 7"
    option_explanations:
      - |
        The small part is not just 3. It is 7 units tall and 3 units long, so its area is 7 × 3.
      - |
        Adding the side lengths does not find area. Each part's area is its height times its length.
      - |
        Correct. The left part is 7 × 10 and the right part is 7 × 3. Add them to get the whole area.
      - |
        10 and 3 are both lengths along the top, so they are not multiplied together. Each part uses the height, 7.
    answer: 2

  - slug: g3math-u04-check-q13
    type: numeric
    topic_code: "3.OA.B.5"
    source: "IM K–5 Math Grade 3, Unit 4, Section C"
    points: 1
    stimulus: |
      Use the area diagram. A rectangle 7 units tall and 13 units long is split into a part 10 units long and a part 3 units long.
    prompt: |
      What is the area of the whole rectangle, in square units?
    answer: { value: 91, tolerance: 0 }
    explanation: |
      7 × 10 = 70 and 7 × 3 = 21. 70 + 21 = 91 square units, so 7 × 13 = 91.

  # ---- Dividing within 100 (3.OA.C.7)
  - slug: g3math-u04-check-q14
    type: multiple_choice
    topic_code: "3.OA.C.7"
    source: "IM K–5 Math Grade 3, Unit 4, Section D"
    points: 1
    prompt: |
      What is 64 ÷ 8?
    options:
      - "7"
      - "8"
      - "56"
      - "72"
    option_explanations:
      - |
        8 × 7 is 56, which is 8 less than 64. Try 8 × 8.
      - |
        Correct. 8 × 8 = 64, so 64 split into groups of 8 makes 8 groups: 64 ÷ 8 = 8.
      - |
        56 is 64 − 8. Division asks how many 8s make 64.
      - |
        72 is 64 + 8. Division splits 64 into equal groups; it does not add to it.
    answer: 1

  - slug: g3math-u04-check-q15
    type: numeric
    topic_code: "3.OA.C.7"
    source: "IM K–5 Math Grade 3, Unit 4, Section D"
    points: 1
    prompt: |
      What is 75 ÷ 5?
    answer: { value: 15, tolerance: 0 }
    explanation: |
      Split 75 into friendly parts: 50 and 25. 50 ÷ 5 = 10 and 25 ÷ 5 = 5. 10 + 5 = 15. Check: 5 × 15 = 75.

  - slug: g3math-u04-check-q16
    type: multiple_choice
    topic_code: "3.OA.C.7"
    source: "IM K–5 Math Grade 3, Unit 4, Section D"
    points: 1
    prompt: |
      Dev knows that 9 × 7 = 63. Which division fact does he also know?
    options:
      - "63 ÷ 3 = 9"
      - "70 ÷ 7 = 9"
      - "63 ÷ 9 = 6"
      - "63 ÷ 7 = 9"
    option_explanations:
      - |
        63 ÷ 3 is 21, not 9. The division facts that go with 9 × 7 = 63 divide by 9 or by 7.
      - |
        70 ÷ 7 is 10. Dev's fact has 63 as the product, not 70.
      - |
        63 ÷ 9 is 7, not 6. The fact family uses only 9, 7 and 63.
      - |
        Correct. 9 groups of 7 make 63, so 63 ÷ 7 = 9. It is in the same fact family.
    answer: 3

  # ---- Word problems (3.OA.A.3)
  - slug: g3math-u04-check-q17
    type: multiple_choice
    topic_code: "3.OA.A.3"
    source: "IM K–5 Math Grade 3, Unit 4, Section D"
    points: 1
    prompt: |
      Mrs. Kowalski has 36 markers. She puts 4 markers in each cup. How many cups does she use?
    options:
      - "9"
      - "32"
      - "40"
      - "144"
    option_explanations:
      - |
        Correct. 36 markers in groups of 4: 36 ÷ 4 = 9 cups, because 9 × 4 = 36.
      - |
        32 is 36 − 4, filling only one cup. Keep making groups of 4 until all 36 markers are used.
      - |
        40 is 36 + 4. Putting markers in cups does not add markers.
      - |
        144 is 36 × 4. That would be 36 cups of 4, but there are only 36 markers in all.
    answer: 0

  - slug: g3math-u04-check-q18
    type: numeric
    topic_code: "3.OA.A.3"
    source: "IM K–5 Math Grade 3, Unit 4, Section D"
    points: 1
    prompt: |
      A soccer league has 8 teams. Each team has 6 players. How many players are in the league?
    answer: { value: 48, tolerance: 0 }
    explanation: |
      8 equal groups of 6: 8 × 6 = 48 players.

  - slug: g3math-u04-check-q19
    type: multiple_choice
    topic_code: "3.OA.A.4"
    source: "IM K–5 Math Grade 3, Unit 4, Section D"
    points: 1
    prompt: |
      Some stickers were shared equally by 5 friends. Each friend got 7 stickers. Which equation can you use to find how many stickers there were?
    options:
      - "5 ÷ 7 = ?"
      - "? ÷ 5 = 7"
      - "7 − 5 = ?"
      - "5 + 7 = ?"
    option_explanations:
      - |
        The total is unknown, so it cannot be 5. In a division, the total comes first.
      - |
        Correct. The unknown total, shared by 5 friends, gives 7 each. The unknown is 35, because 5 × 7 = 35.
      - |
        Subtraction finds a difference. The story is about 5 equal groups of 7.
      - |
        5 + 7 joins one group of 5 and one of 7. The story has 5 equal groups of 7.
    answer: 1

  - slug: g3math-u04-check-q20
    type: short_answer
    topic_code: "3.OA.A.3"
    source: "IM K–5 Math Grade 3, Unit 4, Section D"
    points: 3
    prompt: |
      The garden club has 54 seeds. They plant 6 seeds in each pot.

      (a) Write an equation with a symbol for the unknown number.
      (b) How many pots do they fill?
      (c) Show how you can check your answer with multiplication.
    answer: |
      (a) 54 ÷ 6 = ? (or 6 × ? = 54, or ? × 6 = 54).
      (b) 9 pots.
      (c) 9 pots × 6 seeds = 54 seeds, which matches the number of seeds the club has.
    explanation: |
      Three points.

      (a) 1 pt: a correct equation with a symbol (?, a box or a letter) for the unknown, such as 54 ÷ 6 = p or 6 × p = 54.

      (b) 1 pt: 9 pots.

      (c) 1 pt: a multiplication that checks the answer, 9 × 6 = 54 or 6 × 9 = 54, linked back to the 54 seeds.
