week: 2
unit: 1
title: "Equal Groups and Writing Multiplication"
topics: ["3.OA.A.1"]
guide: guides/week-02.md
guide_description: |
  What equal groups are, how "4 groups of 5" becomes the multiplication 4 × 5, what the words factor and
  product mean, and how to find a total by skip-counting or adding the same number again and again.
flashcards_description: |
  18 cards on equal groups, the × sign, factors and products, "groups of" language, skip-counting by 2s, 3s,
  4s and 5s, and matching a story to a multiplication expression.

flashcards:
  - front: Equal groups → what they are
    back: |
      Groups that all have the same number of things in them. 3 bags with 4 apples in every bag are equal groups.
    topic_code: "3.OA.A.1"
  - front: Unequal groups → why they are not multiplication
    back: |
      If one bag has 4 apples and another has 2, the groups are not the same size, so you cannot use one multiplication. You add instead.
    topic_code: "3.OA.A.1"
  - front: Multiplication → what it means
    back: |
      A fast way to find the total of equal groups. 3 × 4 means 3 groups of 4, which is 12.
    topic_code: "3.OA.A.1"
  - front: The × sign → how to read it
    back: |
      Say "times" or "groups of". 5 × 2 is read "5 times 2" and can mean 5 groups of 2.
    topic_code: "3.OA.A.1"
  - front: Factor → what it is
    back: |
      A number you multiply. In 6 × 3 = 18, the factors are 6 and 3.
    topic_code: "3.OA.A.1"
  - front: Product → what it is
    back: |
      The answer when you multiply. In 6 × 3 = 18, the product is 18.
    topic_code: "3.OA.A.1"
  - front: In 4 × 5, the first factor → what it tells
    back: |
      In this course, the first factor tells how many groups there are: 4 groups.
    topic_code: "3.OA.A.1"
  - front: In 4 × 5, the second factor → what it tells
    back: |
      How many are in each group: 5 in each group.
    topic_code: "3.OA.A.1"
  - front: 2 groups of 6 → multiplication expression
    back: |
      2 × 6. The total is 6 + 6 = 12.
    topic_code: "3.OA.A.1"
  - front: 5 groups of 3 → total
    back: |
      15. Count by 3s five times: 3, 6, 9, 12, 15.
    topic_code: "3.OA.A.1"
  - front: 4 + 4 + 4 → as multiplication
    back: |
      3 × 4, because there are 3 groups of 4. The product is 12.
    topic_code: "3.OA.A.1"
  - front: 6 × 2 → as repeated addition
    back: |
      2 + 2 + 2 + 2 + 2 + 2 = 12. Six 2s are added.
    topic_code: "3.OA.A.1"
  - front: Skip-count by 4s → first six numbers
    back: |
      4, 8, 12, 16, 20, 24.
    topic_code: "3.OA.A.1"
  - front: Skip-count by 3s → first six numbers
    back: |
      3, 6, 9, 12, 15, 18.
    topic_code: "3.OA.A.1"
  - front: Skip-counting → how it finds a product
    back: |
      Count by the group size once for each group. For 4 groups of 5, say 5, 10, 15, 20. The last number is the product.
    topic_code: "3.OA.A.1"
  - front: Story for 3 × 6 → one example
    back: |
      3 lunch tables with 6 students at each table. There are 18 students.
    topic_code: "3.OA.A.1"
  - front: 7 ladybugs with 6 legs each → expression
    back: |
      7 × 6, because there are 7 groups (ladybugs) of 6 legs.
    topic_code: "3.OA.A.1"
  - front: Drawing equal groups → a quick way
    back: |
      Draw a circle for each group, then put the same number of dots in every circle. Count the dots to find the product.
    topic_code: "3.OA.A.1"

quiz:
  description: |
    13 questions · about 25 minutes · equal groups, writing a multiplication expression for a picture or a story,
    factors and products, and three review questions on reading a picture graph. Multiple choice, select-all,
    true/false and number answers are graded at once; the fill-in word is matched automatically; the short
    answer is checked by your teacher.
  questions:
    - slug: g3math-w02-q01
      type: multiple_choice
      topic_code: "3.OA.A.1"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 1
      stimulus: |
        Use the picture "Cookies on Plates". Every plate has the same number of cookies.
      figure: figures/w02-cookie-plates.svg
      figure_alt: "A picture titled Cookies on Plates. There are 4 plates in a row, and each plate has 5 red cookies on it."
      prompt: |
        Which expression matches the picture?
      options:
        - "4 + 5"
        - "5 × 5"
        - "4 × 5"
        - "4 × 4"
      option_explanations:
        - |
          4 + 5 adds the number of plates and the number on one plate. The picture shows 4 groups of 5, which is multiplication.
        - |
          There are only 4 plates, not 5. Count the plates again: the first factor is 4 because there are 4 groups.
        - |
          Correct. There are 4 plates (groups) with 5 cookies on each plate, so 4 groups of 5 is 4 × 5.
        - |
          4 × 4 would mean 4 cookies on each plate, but each plate has 5 cookies. Count the dots on one plate.
      answer: 2

    - slug: g3math-w02-q02
      type: numeric
      topic_code: "3.OA.A.1"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 1
      stimulus: |
        Use the picture "Cookies on Plates". Every plate has the same number of cookies.
      prompt: |
        How many cookies are there in all?
      answer: { value: 20, tolerance: 0 }
      explanation: |
        There are 4 plates with 5 cookies on each. Count by 5s, once for each plate: 5, 10, 15, 20. So 4 × 5 = 20 cookies.

    - slug: g3math-w02-q03
      type: multiple_choice
      topic_code: "3.OA.A.1"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 1
      stimulus: |
        Use the picture "Cookies on Plates". Every plate has the same number of cookies.
      prompt: |
        Dad brings 2 more plates with 5 cookies on each plate. Which expression shows all the cookies now?
      options:
        - "6 × 5"
        - "4 × 7"
        - "2 × 5"
        - "6 × 7"
      option_explanations:
        - |
          Correct. Now there are 4 + 2 = 6 plates, and every plate still has 5 cookies, so it is 6 groups of 5.
        - |
          4 × 7 puts 2 more cookies on each plate. The new cookies came on 2 new plates, so the number of groups changed, not the size.
        - |
          2 × 5 shows only the new plates. The question asks about all the cookies, so the 4 old plates count too.
        - |
          6 × 7 changes both numbers. There are 6 plates now, but each plate still holds 5 cookies, not 7.
      answer: 0

    - slug: g3math-w02-q04
      type: multiple_choice
      topic_code: "3.OA.A.1"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 1
      figure: figures/w02-flower-pots.svg
      figure_alt: "A picture titled Flower Pots. There are 6 red flower pots in a row, and each pot has 2 blue flowers growing in it."
      prompt: |
        Which words describe the flowers in the picture?
      options:
        - "2 groups of 6"
        - "6 groups of 6"
        - "12 groups of 2"
        - "6 groups of 2"
      option_explanations:
        - |
          2 groups of 6 has the same total, 12, but the picture shows 6 pots, so there are 6 groups, each with 2 flowers.
        - |
          6 groups of 6 would mean 6 flowers in every pot. Each pot in the picture has only 2 flowers.
        - |
          12 is the number of flowers in all. Each pot is one group, and there are 6 pots, not 12.
        - |
          Correct. Each pot is a group. There are 6 pots and each one has 2 flowers, so it is 6 groups of 2.
      answer: 3

    - slug: g3math-w02-q05
      type: numeric
      topic_code: "3.OA.A.1"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 1
      prompt: |
        Kenji puts 7 crayons in each of 3 boxes. How many crayons does he put in the boxes?
      answer: { value: 21, tolerance: 0 }
      explanation: |
        There are 3 groups of 7, which is 3 × 7. Count by 7s: 7, 14, 21. Or add 7 + 7 + 7 = 21 crayons.

    - slug: g3math-w02-q06
      type: fill_blank
      topic_code: "3.OA.A.1"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 1
      prompt: |
        In 5 × 4 = 20, the answer 20 is called the ____.
      answer: ["product", "the product", "products"]
      explanation: |
        The answer to a multiplication is the product. The numbers you multiply, 5 and 4, are the factors.

    - slug: g3math-w02-q07
      type: true_false
      topic_code: "3.OA.A.1"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 1
      prompt: |
        True or false: 3 + 3 + 3 + 3 is the same amount as 4 × 3.
      answer: true
      explanation: |
        True. 3 + 3 + 3 + 3 adds four 3s, which is 4 groups of 3. Both make 12.

    - slug: g3math-w02-q08
      type: multi_select
      topic_code: "3.OA.A.1"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which of these show 3 groups of 6? Select all that apply.
      options:
        - "6 + 6 + 6"
        - "3 × 6"
        - "3 + 6"
        - "6 × 6"
        - "3 bags with 6 marbles in each bag"
      option_explanations:
        - |
          Yes. Adding 6 three times is 3 groups of 6, and the total is 18.
        - |
          Yes. 3 × 6 is read "3 groups of 6" and the product is 18.
        - |
          No. 3 + 6 adds the number of groups to the size of a group and makes 9, not 18.
        - |
          No. 6 × 6 is 6 groups of 6, which is 36. There should be only 3 groups.
        - |
          Yes. Each bag is a group, there are 3 bags, and each bag has 6 marbles.
      answer: [0, 1, 4]

    - slug: g3math-w02-q09
      type: multiple_choice
      topic_code: "3.OA.A.1"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 1
      prompt: |
        Which story could be shown by 5 × 2?
      options:
        - "There are 5 red socks and 2 blue socks in a drawer."
        - "There are 5 pairs of socks, with 2 socks in each pair."
        - "Sam had 5 socks and put 2 in the wash."
        - "There are 5 socks in each of 5 drawers."
      option_explanations:
        - |
          5 red and 2 blue socks are two different groups added together: 5 + 2 = 7. They are not equal groups.
        - |
          Correct. Each pair is a group of 2, and there are 5 pairs, so 5 groups of 2 is 5 × 2 = 10 socks.
        - |
          Taking 2 away from 5 is subtraction, 5 − 2 = 3. Nothing here is a group of the same size.
        - |
          5 socks in each of 5 drawers is 5 groups of 5, which is 5 × 5, not 5 × 2.
      answer: 1

    - slug: g3math-w02-q10
      type: short_answer
      topic_code: "3.OA.A.1"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 2
      prompt: |
        Mia has 4 bags. There are 6 oranges in each bag.

        (a) Write a multiplication expression for the oranges.
        (b) How many oranges does Mia have? Show how you know.
      answer: |
        (a) 4 × 6 (4 groups of 6).
        (b) 24 oranges. Count by 6s four times: 6, 12, 18, 24. Or 6 + 6 + 6 + 6 = 24.
      explanation: |
        Two points.

        (a) 1 pt: 4 × 6. Accept 6 × 4 only if the student says it means 4 bags of 6.

        (b) 1 pt: 24 with work, such as skip-counting by 6s, adding four 6s, or a drawing of 4 groups with 6 in each.

    - slug: g3math-w02-q11
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the picture graph "Favorite Recess Game". One ball stands for 5 students.
      figure: figures/w02-recess-picture-graph.svg
      figure_alt: "A picture graph titled Favorite Recess Game. Tag has 4 balls, Jump rope has 2 balls and Soccer has 6 balls. The key says one ball equals 5 students."
      prompt: |
        How many students chose soccer?
      options:
        - "6"
        - "11"
        - "30"
        - "25"
      option_explanations:
        - |
          6 is the number of balls in the soccer row. Each ball stands for 5 students, so count by 5s six times.
        - |
          11 adds 6 balls and 5 students. The key means each ball is worth 5, so it is 6 groups of 5.
        - |
          Correct. Soccer has 6 balls and each ball is 5 students: 5, 10, 15, 20, 25, 30.
        - |
          25 is one ball short. Count by 5s once for each of the 6 balls: the last number is 30.
      answer: 2

    - slug: g3math-w02-q12
      type: numeric
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the picture graph "Favorite Recess Game". One ball stands for 5 students.
      prompt: |
        How many more students chose tag than chose jump rope?
      answer: { value: 10, tolerance: 0 }
      explanation: |
        Tag has 4 balls, so 20 students. Jump rope has 2 balls, so 10 students. 20 − 10 = 10 more students chose tag.

    - slug: g3math-w02-q13
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the picture graph "Favorite Recess Game". One ball stands for 5 students.
      prompt: |
        Ravi says, "2 students chose jump rope." What mistake did Ravi make?
      options:
        - "He read the tag row instead of the jump rope row."
        - "He counted the balls but forgot that each ball stands for 5 students."
        - "He added the balls in every row."
        - "He should have counted by 2s."
      option_explanations:
        - |
          The tag row has 4 balls, not 2. Ravi did look at the jump rope row; the trouble is what each ball is worth.
        - |
          Correct. Jump rope has 2 balls, and each ball is 5 students, so 2 groups of 5 is 10 students, not 2.
        - |
          Adding every row would give 12 balls. Ravi said 2, which is just the number of balls in the jump rope row.
        - |
          The key says one ball is 5 students, so you count by 5s, not by 2s: 5, 10.
      answer: 1
