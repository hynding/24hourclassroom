unit: 1
description: |
  20 questions · about 40 minutes · every standard of Unit 1: reading scaled bar graphs, equal groups and
  arrays, writing multiplication, story problems, unknown numbers, turn-around facts and patterns. Two
  stimulus sets share a picture across consecutive questions. Multiple choice, select-all, true/false and
  number answers are graded at once; the fill-in word is matched automatically; the two short answers are
  checked by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: a bar graph with a scale of 5 (3.MD.B.3)
  - slug: g3math-u01-check-q01
    type: multiple_choice
    topic_code: "3.MD.B.3"
    source: "IM K–5 Math Grade 3, Unit 1, Section A"
    points: 1
    stimulus: |
      Use the bar graph "Books in Our Class Library". The scale counts by 5s.
    figure: figures/u01-library-bar-graph.svg
    figure_alt: "A bar graph titled Books in Our Class Library. The side scale goes 0, 5, 10, 15, 20, 25, 30, 35 and is labeled Number of books. The Animals bar reaches 25, the Sports bar reaches 15, the Space bar reaches 30 and the Poems bar reaches 10."
    prompt: |
      How many space books are in the library?
    options:
      - "6"
      - "25"
      - "30"
      - "35"
    option_explanations:
      - |
        6 counts the lines up to the top of the space bar. Each line is worth 5, so six lines up is 30.
      - |
        25 is where the animals bar ends. The space bar is one line taller, at 30.
      - |
        Correct. The top of the space bar lines up with 30 on the scale.
      - |
        35 is the top of the scale. The space bar stops one line below it, at 30.
    answer: 2

  - slug: g3math-u01-check-q02
    type: numeric
    topic_code: "3.MD.B.3"
    source: "IM K–5 Math Grade 3, Unit 1, Section A"
    points: 1
    stimulus: |
      Use the bar graph "Books in Our Class Library". The scale counts by 5s.
    prompt: |
      How many more animal books are there than poem books?
    answer: { value: 15, tolerance: 0 }
    explanation: |
      Animals is 25 and poems is 10. "How many more" is the difference: 25 − 10 = 15 more animal books.

  - slug: g3math-u01-check-q03
    type: multiple_choice
    topic_code: "3.MD.B.3"
    source: "IM K–5 Math Grade 3, Unit 1, Section A"
    points: 1
    stimulus: |
      Use the bar graph "Books in Our Class Library". The scale counts by 5s.
    prompt: |
      The class gets 10 new sports books. Where should the Sports bar end now?
    options:
      - "25"
      - "20"
      - "10"
      - "35"
    option_explanations:
      - |
        Correct. Sports had 15 books, and 15 + 10 = 25. On this scale that is two lines higher.
      - |
        20 moves the bar up only one line. Each line is 5 books, so 10 new books is two lines: 15 to 25.
      - |
        10 is just the new books. The bar shows all the sports books, the 15 old ones and the 10 new ones.
      - |
        35 adds 10 to the animals bar (25 + 10). The new books are sports books, and sports had 15.
    answer: 0

  # ---- Stimulus set B: equal groups (3.OA.A.1)
  - slug: g3math-u01-check-q04
    type: multiple_choice
    topic_code: "3.OA.A.1"
    source: "IM K–5 Math Grade 3, Unit 1, Section B"
    points: 1
    stimulus: |
      Use the picture "Boxes of Crayons". Every box has the same number of crayons.
    figure: figures/u01-crayon-boxes.svg
    figure_alt: "A picture titled Boxes of Crayons. There are 5 boxes in a row, and each box holds 4 crayons drawn as dots: one red, one blue, one green and one black."
    prompt: |
      Which expression matches the picture?
    options:
      - "5 + 4"
      - "5 × 4"
      - "4 × 4"
      - "5 × 5"
    option_explanations:
      - |
        5 + 4 adds the boxes and the crayons in one box. There are 5 equal groups of 4, which is multiplication.
      - |
        Correct. There are 5 boxes (groups) with 4 crayons in each box, so 5 groups of 4 is 5 × 4.
      - |
        4 × 4 would be only 4 boxes. Count the boxes again: there are 5.
      - |
        5 × 5 would mean 5 crayons in every box. Each box holds 4.
    answer: 1

  - slug: g3math-u01-check-q05
    type: numeric
    topic_code: "3.OA.A.1"
    source: "IM K–5 Math Grade 3, Unit 1, Section B"
    points: 1
    stimulus: |
      Use the picture "Boxes of Crayons". Every box has the same number of crayons.
    prompt: |
      How many crayons are there in all?
    answer: { value: 20, tolerance: 0 }
    explanation: |
      5 boxes of 4 is 5 × 4. Count by 4s five times: 4, 8, 12, 16, 20. There are 20 crayons.

  - slug: g3math-u01-check-q06
    type: multiple_choice
    topic_code: "3.OA.A.1"
    source: "IM K–5 Math Grade 3, Unit 1, Section B"
    points: 1
    prompt: |
      Which words tell what 7 × 3 means?
    options:
      - "7 groups and 3 more"
      - "3 groups with 3 in each group"
      - "10 things, because 7 and 3 make 10"
      - "7 groups with 3 in each group"
    option_explanations:
      - |
        "7 groups and 3 more" mixes groups with adding. 7 × 3 means every one of the 7 groups has 3 in it.
      - |
        3 groups of 3 is 3 × 3 = 9. The first factor, 7, tells how many groups there are.
      - |
        7 + 3 = 10 is addition. 7 × 3 means 7 groups of 3, which is 21.
      - |
        Correct. 7 × 3 is 7 groups with 3 in each group. Count by 3s seven times to get 21.
    answer: 3

  - slug: g3math-u01-check-q07
    type: multiple_choice
    topic_code: "3.OA.A.1"
    source: "IM K–5 Math Grade 3, Unit 1, Section C"
    points: 1
    figure: figures/u01-tiles-array.svg
    figure_alt: "A picture titled Floor Tiles. Blue square tiles are in an array of 4 rows, with 7 tiles in each row."
    prompt: |
      The picture shows tiles on a floor. Which equation tells how many tiles there are?
    options:
      - "4 × 7 = 28"
      - "4 + 7 = 11"
      - "4 × 8 = 32"
      - "7 × 7 = 49"
    option_explanations:
      - |
        Correct. There are 4 rows with 7 tiles in each row. Count by 7s: 7, 14, 21, 28.
      - |
        4 + 7 adds the rows and the tiles in one row. The array has 4 equal rows of 7, so multiply.
      - |
        4 × 8 puts 8 tiles in each row. Count one row again: it has 7 tiles.
      - |
        7 × 7 would need 7 rows. The array has 7 columns but only 4 rows.
    answer: 0

  - slug: g3math-u01-check-q08
    type: true_false
    topic_code: "3.OA.B.5"
    source: "IM K–5 Math Grade 3, Unit 1, Section C"
    points: 1
    prompt: |
      True or false: an array with 4 rows of 7 tiles has the same number of tiles as an array with 7 rows of 4 tiles.
    answer: true
    explanation: |
      True. Turn one array on its side and you get the other one. 4 × 7 and 7 × 4 are both 28.

  - slug: g3math-u01-check-q09
    type: multiple_choice
    topic_code: "3.OA.A.3"
    source: "IM K–5 Math Grade 3, Unit 1, Section B"
    points: 1
    prompt: |
      A school garden has 6 rows of carrots. There are 5 carrots in each row. How many carrots are in the garden?
    options:
      - "11"
      - "25"
      - "30"
      - "35"
    option_explanations:
      - |
        11 adds 6 and 5. There are 6 rows with 5 in each row, which is 6 groups of 5.
      - |
        25 is 5 rows of 5, one row short. Count by 5s six times: 5, 10, 15, 20, 25, 30.
      - |
        Correct. 6 groups of 5 is 6 × 5 = 30 carrots.
      - |
        35 is 7 rows of 5, one row too many. The garden has 6 rows.
    answer: 2

  - slug: g3math-u01-check-q10
    type: numeric
    topic_code: "3.OA.A.3"
    source: "IM K–5 Math Grade 3, Unit 1, Section B"
    points: 1
    prompt: |
      A toy octopus has 8 arms. How many arms do 4 toy octopuses have?
    answer: { value: 32, tolerance: 0 }
    explanation: |
      4 groups of 8 is 4 × 8. Count by 8s: 8, 16, 24, 32. The 4 toys have 32 arms.

  - slug: g3math-u01-check-q11
    type: multiple_choice
    topic_code: "3.OA.A.4"
    source: "IM K–5 Math Grade 3, Unit 1, Section C"
    points: 1
    prompt: |
      Which number makes this equation true? ? × 4 = 36
    options:
      - "32"
      - "40"
      - "8"
      - "9"
    option_explanations:
      - |
        32 is 36 − 4. The equation multiplies, so ask how many 4s make 36.
      - |
        40 is 36 + 4, and 10 groups of 4. That is one group too many.
      - |
        8 × 4 is 32. You need one more 4 to reach 36.
      - |
        Correct. Count by 4s: 4, 8, 12, 16, 20, 24, 28, 32, 36. That is 9 fours, so 9 × 4 = 36.
    answer: 3

  - slug: g3math-u01-check-q12
    type: numeric
    topic_code: "3.OA.A.4"
    source: "IM K–5 Math Grade 3, Unit 1, Section C"
    points: 1
    prompt: |
      What number makes this equation true? 8 × ? = 48
    answer: { value: 6, tolerance: 0 }
    explanation: |
      8 groups of what make 48? Count by 6s eight times: 6, 12, 18, 24, 30, 36, 42, 48. So 8 × 6 = 48 and the unknown is 6. (Or use the turn-around fact 6 × 8 = 48.)

  - slug: g3math-u01-check-q13
    type: multiple_choice
    topic_code: "3.OA.A.4"
    source: "IM K–5 Math Grade 3, Unit 1, Section C"
    points: 1
    prompt: |
      Aiko puts 27 shells into piles of 3. Which equation could help her find how many piles she makes?
    options:
      - "27 + 3 = ?"
      - "? × 3 = 27"
      - "27 × 3 = ?"
      - "3 + ? = 27"
    option_explanations:
      - |
        27 + 3 adds more shells. Aiko is not getting more shells; she is putting the 27 shells into equal groups.
      - |
        Correct. Some number of piles, each with 3 shells, makes 27 shells. The unknown is the number of piles.
      - |
        27 is already the total. 27 × 3 would be 27 piles of 3, which is far more shells than Aiko has.
      - |
        3 + ? adds one pile to a number. Every pile has 3 shells, so it is equal groups of 3: multiplication.
    answer: 1

  - slug: g3math-u01-check-q14
    type: multiple_choice
    topic_code: "3.OA.B.5"
    source: "IM K–5 Math Grade 3, Unit 1, Section C"
    points: 1
    prompt: |
      Ben knows that 3 × 9 = 27. Which other fact does that tell him?
    options:
      - "9 × 3 = 27"
      - "9 × 3 = 39"
      - "3 × 27 = 9"
      - "3 + 9 = 27"
    option_explanations:
      - |
        Correct. 9 × 3 is the turn-around fact. The same two factors in the other order give the same product.
      - |
        39 just writes the factors 3 and 9 next to each other. Switching the order of the factors keeps the product at 27.
      - |
        3 × 27 is 81, not 9. 27 is the product, so it stays on its own side of the equal sign.
      - |
        3 + 9 is 12. Adding is not the same as multiplying, so this is not true.
    answer: 0

  - slug: g3math-u01-check-q15
    type: fill_blank
    topic_code: "3.OA.A.1"
    source: "IM K–5 Math Grade 3, Unit 1, Section B"
    points: 1
    prompt: |
      In 6 × 3 = 18, the numbers 6 and 3 are called ____.
    answer: ["factors", "the factors", "factor"]
    explanation: |
      The numbers you multiply are factors. The answer, 18, is the product.

  - slug: g3math-u01-check-q16
    type: multiple_choice
    topic_code: "3.OA.D.9"
    source: "IM K–5 Math Grade 3, Unit 1, Section C"
    points: 1
    prompt: |
      What number is missing from the pattern 9, 18, 27, ___, 45?
    options:
      - "35"
      - "28"
      - "54"
      - "36"
    option_explanations:
      - |
        35 is 10 less than 45, but the pattern adds 9 each time: 27 + 9 = 36.
      - |
        28 adds only 1 to 27. Check the steps: 9 to 18 to 27 each add 9.
      - |
        54 is what comes after 45. The blank is between 27 and 45.
      - |
        Correct. The pattern adds 9 each time: 27 + 9 = 36, and 36 + 9 = 45. These are the 9s facts.
    answer: 3

  - slug: g3math-u01-check-q17
    type: multi_select
    topic_code: "3.OA.D.9"
    source: "IM K–5 Math Grade 3, Unit 1, Section C"
    points: 2
    partial_credit: true
    prompt: |
      Which products are even? Select all that apply.
    options:
      - "4 × 3"
      - "5 × 7"
      - "6 × 5"
      - "3 × 9"
      - "2 × 9"
    option_explanations:
      - |
        Even. 4 × 3 = 12, and 12 splits into 2 equal groups of 6.
      - |
        Odd. 5 × 7 = 35. Odd times odd always gives an odd product.
      - |
        Even. 6 × 5 = 30, which ends in 0. An even factor makes an even product.
      - |
        Odd. 3 × 9 = 27, and both factors are odd, so the product is odd.
      - |
        Even. 2 × 9 = 18. Any number times 2 is even.
    answer: [0, 2, 4]

  - slug: g3math-u01-check-q18
    type: multiple_choice
    topic_code: "3.OA.D.9"
    source: "IM K–5 Math Grade 3, Unit 1, Section C"
    points: 1
    prompt: |
      Which sentence about multiplying by 10 is true?
    options:
      - "Every product of 10 is odd."
      - "10 × 4 = 14"
      - "Every product of 10 ends in 0."
      - "The products of 10 go up by 1 each time."
    option_explanations:
      - |
        The 10s facts are 10, 20, 30, 40 and so on. They all end in 0, so they are all even, not odd.
      - |
        14 is 10 + 4. 10 × 4 means 4 groups of 10, which is 40.
      - |
        Correct. 10, 20, 30, 40, 50: every product of 10 ends in 0.
      - |
        The 10s facts go 10, 20, 30, so they go up by 10 each time, not by 1.
    answer: 2

  - slug: g3math-u01-check-q19
    type: short_answer
    topic_code: "3.OA.A.3"
    source: "IM K–5 Math Grade 3, Unit 1, Section B"
    points: 3
    prompt: |
      Ms. Okafor's class makes 4 posters. Each poster has 6 stars on it.

      (a) Draw or describe equal groups or an array for the stars.
      (b) Write a multiplication equation for the story.
      (c) How many stars are there in all?
    answer: |
      (a) 4 circles (or 4 rows) with 6 stars in each.
      (b) 4 × 6 = 24.
      (c) 24 stars. Count by 6s: 6, 12, 18, 24.
    explanation: |
      Three points.

      (a) 1 pt: a drawing or description of 4 equal groups of 6, or an array of 4 rows of 6 (6 rows of 4 is also fine if it is labeled).

      (b) 1 pt: 4 × 6 = 24 (accept 6 × 4 = 24, or 4 × 6 written with the product in part c).

      (c) 1 pt: 24 stars.

  - slug: g3math-u01-check-q20
    type: short_answer
    topic_code: "3.OA.B.5"
    source: "IM K–5 Math Grade 3, Unit 1, Section C"
    points: 2
    prompt: |
      Gabe says, "5 × 8 and 8 × 5 have different products, because the numbers are in a different order."

      (a) Is Gabe right?
      (b) Explain your thinking. You may draw an array or equal groups.
    answer: |
      (a) No.
      (b) Both products are 40. An array of 5 rows of 8 turned on its side is 8 rows of 5, and it has the same 40 dots. Changing the order of the factors does not change the product.
    explanation: |
      Two points.

      (a) 1 pt: no (Gabe is not right).

      (b) 1 pt: a reason, such as finding that both products are 40, turning an array, or saying the order of the factors does not change the product.
