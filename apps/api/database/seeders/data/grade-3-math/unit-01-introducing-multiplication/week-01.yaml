week: 1
unit: 1
title: "Picture Graphs and Bar Graphs With a Scale"
topics: ["3.MD.B.3"]
guide: guides/week-01.md
guide_description: |
  How to read and draw picture graphs where one picture stands for more than one thing, and bar graphs whose
  scale counts by 2s, 5s or 10s, then how to answer "how many more" and "how many fewer" questions from a graph.
flashcards_description: |
  18 cards on graph words (title, key, scale, category), reading a key, counting by 2s, 5s and 10s, and
  comparing categories on a graph.

flashcards:
  - front: Picture graph → what it is
    back: |
      A graph that uses small pictures to show how many are in each group. A key tells you how many each picture stands for.
    topic_code: "3.MD.B.3"
  - front: Key on a picture graph → what it tells you
    back: |
      How many things one picture stands for. If the key says one star = 2 students, then 4 stars mean 2 + 2 + 2 + 2 = 8 students.
    topic_code: "3.MD.B.3"
  - front: Bar graph → what it is
    back: |
      A graph that uses bars to show how many are in each group. The taller (or longer) the bar, the more there are.
    topic_code: "3.MD.B.3"
  - front: Scale on a bar graph → what it means
    back: |
      The numbers along the side of a bar graph. A scale that counts 0, 5, 10, 15 goes up by 5 for each line.
    topic_code: "3.MD.B.3"
  - front: Category → meaning on a graph
    back: |
      One of the groups being counted, such as "dog", "cat" or "fish" on a graph about pets.
    topic_code: "3.MD.B.3"
  - front: Title of a graph → why it matters
    back: |
      The title tells you what the graph is about, such as "Favorite Fruit". Always read it first.
    topic_code: "3.MD.B.3"
  - front: Key of 1 picture = 5 → 3 pictures stand for
    back: |
      15. Count by 5s: 5, 10, 15.
    topic_code: "3.MD.B.3"
  - front: Key of 1 picture = 2 → 6 pictures stand for
    back: |
      12. Count by 2s: 2, 4, 6, 8, 10, 12.
    topic_code: "3.MD.B.3"
  - front: Key of 1 picture = 10 → 4 pictures stand for
    back: |
      40. Count by 10s: 10, 20, 30, 40.
    topic_code: "3.MD.B.3"
  - front: Half a picture with key 1 picture = 2 → stands for
    back: |
      1, because half of 2 is 1.
    topic_code: "3.MD.B.3"
  - front: Bar ends halfway between the 10 line and the 20 line → its value
    back: |
      15, because 15 is halfway between 10 and 20.
    topic_code: "3.MD.B.3"
  - front: '"How many more" on a graph → how to find it'
    back: |
      Find the two amounts, then subtract the smaller from the bigger. 20 dogs and 15 cats: 20 − 15 = 5 more dogs.
    topic_code: "3.MD.B.3"
  - front: '"How many fewer" on a graph → how to find it'
    back: |
      It is the same subtraction as "how many more": bigger amount − smaller amount. 15 cats is 5 fewer than 20 dogs.
    topic_code: "3.MD.B.3"
  - front: '"How many in all" on a graph → how to find it'
    back: |
      Add the amounts of all the groups. 8 + 6 + 12 = 26 students in all.
    topic_code: "3.MD.B.3"
  - front: Why use a key bigger than 1
    back: |
      When the numbers are big, one picture for each thing would make the graph very long. A key of 5 or 10 keeps it short and easy to read.
    topic_code: "3.MD.B.3"
  - front: Picture graph vs bar graph → one way they are alike
    back: |
      Both show how many are in each category, and both can use a scale that counts by more than 1.
    topic_code: "3.MD.B.3"
  - front: Drawing a bar graph → the first three steps
    back: |
      1. Write a title. 2. Label each category. 3. Choose a scale that fits your biggest number, such as counting by 5s up to 30.
    topic_code: "3.MD.B.3"
  - front: Choosing a scale → a good rule
    back: |
      Pick a scale that counts by an easy number (2, 5 or 10) and reaches past your biggest amount.
    topic_code: "3.MD.B.3"

quiz:
  description: |
    12 questions · about 25 minutes · reading picture graphs with a key, reading bar graphs with a scale, and
    answering "how many more", "how many fewer" and "how many in all" from a graph. Multiple choice, select-all,
    true/false and number answers are graded at once; the fill-in word is matched automatically; the short
    answer is checked by your teacher.
  questions:
    - slug: g3math-w01-q01
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the picture graph "Favorite Fruit". One circle stands for 2 students.
      figure: figures/w01-fruit-picture-graph.svg
      figure_alt: "A picture graph titled Favorite Fruit. Apple has 4 circles, Banana has 3 circles and Grape has 6 circles. The key says one circle equals 2 students."
      prompt: |
        How many students chose apple?
      options:
        - "4"
        - "8"
        - "6"
        - "2"
      option_explanations:
        - |
          4 is the number of circles, but each circle stands for 2 students, so count by 2s: 2, 4, 6, 8.
        - |
          Correct. Apple has 4 circles and each circle is 2 students: 2 + 2 + 2 + 2 = 8.
        - |
          6 is how many students chose banana (3 circles × 2), not apple.
        - |
          2 is how many students one circle stands for, not the number for the whole apple row.
      answer: 1

    - slug: g3math-w01-q02
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the picture graph "Favorite Fruit". One circle stands for 2 students.
      prompt: |
        How many more students chose grape than chose banana?
      options:
        - "3"
        - "12"
        - "18"
        - "6"
      option_explanations:
        - |
          3 is how many more circles grape has than banana. Each circle is 2 students, so the difference is 6 students.
        - |
          12 is how many students chose grape, not how many more than banana.
        - |
          18 is grape and banana added together (12 + 6); the question asks for the difference.
        - |
          Correct. Grape is 6 circles = 12 students and banana is 3 circles = 6 students, and 12 − 6 = 6.
      answer: 3

    - slug: g3math-w01-q03
      type: numeric
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the picture graph "Favorite Fruit". One circle stands for 2 students.
      prompt: |
        How many students were asked in all?
      answer: { value: 26, tolerance: 0 }
      explanation: |
        Apple 8, banana 6 and grape 12 students. 8 + 6 + 12 = 26 students in all. (There are 13 circles, and 13 twos make 26.)

    - slug: g3math-w01-q04
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the bar graph "Pets at Home". The scale counts by 5s.
      figure: figures/w01-pets-bar-graph.svg
      figure_alt: "A bar graph titled Pets at Home. The side scale goes 0, 5, 10, 15, 20, 25 and is labeled Number of students. The Dog bar reaches 20, the Cat bar reaches 15, the Fish bar reaches 5 and the None bar reaches 10."
      prompt: |
        How many students have a cat?
      options:
        - "15"
        - "3"
        - "20"
        - "10"
      option_explanations:
        - |
          Correct. The top of the cat bar lines up with 15 on the scale.
        - |
          3 counts grid lines, but each line on this scale is worth 5, so three lines up is 15.
        - |
          20 is where the dog bar ends, not the cat bar.
        - |
          10 is where the "None" bar ends; the cat bar is one line higher, at 15.
      answer: 0

    - slug: g3math-w01-q05
      type: numeric
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the bar graph "Pets at Home". The scale counts by 5s.
      prompt: |
        How many fewer students have a fish than have a dog?
      answer: { value: 15, tolerance: 0 }
      explanation: |
        Dog is 20 and fish is 5. "How many fewer" is the difference: 20 − 5 = 15 fewer students have a fish.

    - slug: g3math-w01-q06
      type: multi_select
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 2
      partial_credit: true
      stimulus: |
        Use the bar graph "Pets at Home". The scale counts by 5s.
      prompt: |
        Which sentences are true about the graph? Select all that apply.
      options:
        - "Dog is the most popular answer."
        - "More students have a fish than have a cat."
        - "10 students have no pet."
        - "Dog and cat together make 35 students."
        - "Each line on the scale stands for 1 student."
      option_explanations:
        - |
          True. The dog bar, at 20, is the tallest bar on the graph.
        - |
          False. Fish is 5 and cat is 15, so fewer students have a fish than a cat.
        - |
          True. The "None" bar stops at 10 on the scale.
        - |
          True. Dog is 20 and cat is 15, and 20 + 15 = 35.
        - |
          False. The scale goes 0, 5, 10, 15, so each line stands for 5 students.
      answer: [0, 2, 3]

    - slug: g3math-w01-q07
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the picture graph "Books Read This Month". One book picture stands for 5 books.
      figure: figures/w01-books-picture-graph.svg
      figure_alt: "A picture graph titled Books Read This Month. Maya has 3 book pictures, Leo has 5 book pictures and Ana has 2 book pictures. The key says one book picture equals 5 books."
      prompt: |
        How many books did Leo read?
      options:
        - "5"
        - "10"
        - "25"
        - "15"
      option_explanations:
        - |
          5 is the number of pictures in Leo's row; each one stands for 5 books, so count by 5s.
        - |
          10 is how many books Ana read (2 pictures × 5).
        - |
          Correct. Leo has 5 pictures and each is 5 books: 5, 10, 15, 20, 25.
        - |
          15 is how many books Maya read (3 pictures × 5).
      answer: 2

    - slug: g3math-w01-q08
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the picture graph "Books Read This Month". One book picture stands for 5 books.
      prompt: |
        Ana wants to read as many books as Maya. How many more books does Ana need to read?
      options:
        - "1"
        - "5"
        - "15"
        - "10"
      option_explanations:
        - |
          1 is how many more pictures Ana needs, but one picture stands for 5 books.
        - |
          Correct. Maya read 15 books and Ana read 10, and 15 − 10 = 5 more books.
        - |
          15 is how many books Maya read in all, not the difference between Maya and Ana.
        - |
          10 is how many books Ana has read already, not how many more she needs.
      answer: 1

    - slug: g3math-w01-q09
      type: true_false
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      prompt: |
        True or false: on a picture graph where one picture stands for 10 apples, 3 pictures stand for 13 apples.
      answer: false
      explanation: |
        False. Each picture is 10 apples, so count by 10s: 10, 20, 30. Three pictures stand for 30 apples, not 13.

    - slug: g3math-w01-q10
      type: fill_blank
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      prompt: |
        The part of a picture graph that tells how many each picture stands for is called the ____.
      answer: ["key", "the key", "legend"]
      explanation: |
        The key tells you what one picture is worth, such as "one circle = 2 students". Some books call it a legend.

    - slug: g3math-w01-q11
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      prompt: |
        A class counted 30, 25, 40 and 15 cars on four days. Which scale is the best choice for a bar graph of these numbers?
      options:
        - "Count by 1s from 0 to 40"
        - "Count by 10s from 0 to 30"
        - "Count by 2s from 0 to 20"
        - "Count by 5s from 0 to 40"
      option_explanations:
        - |
          Counting by 1s up to 40 would need 40 lines, which makes a tall graph that is hard to read.
        - |
          A scale that stops at 30 is too short: the 40 bar would not fit. Also 25 and 15 fall between the lines.
        - |
          A scale that stops at 20 is too short for 25, 30 and 40.
        - |
          Correct. Every number is a multiple of 5, and the scale reaches 40, the biggest number, so every bar ends on a line.
      answer: 3

    - slug: g3math-w01-q12
      type: short_answer
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 2
      prompt: |
        Jada made a picture graph of 12 rainy days. Her key says one cloud = 2 days.

        (a) How many clouds should she draw for 12 rainy days?
        (b) Explain how you know.
      answer: |
        (a) 6 clouds.
        (b) Each cloud is 2 days, so count by 2s until you reach 12: 2, 4, 6, 8, 10, 12. That is 6 counts, so 6 clouds. (Or: 6 twos make 12.)
      explanation: |
        Two points.

        (a) 1 pt: 6 clouds.

        (b) 1 pt: an explanation that uses the key, such as counting by 2s to 12, or saying 6 groups of 2 make 12. A drawing of 6 clouds labeled 2 each also earns the point.
