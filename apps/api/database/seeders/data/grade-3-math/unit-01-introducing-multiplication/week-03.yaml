week: 3
unit: 1
title: "Arrays, Story Problems and Unknown Numbers"
topics: ["3.OA.A.1", "3.OA.A.3", "3.OA.A.4"]
guide: guides/week-03.md
guide_description: |
  How rows and columns make an array, how equal jumps on a number line and tape diagrams show multiplication,
  how to solve equal-group story problems, and how to find the missing number in an equation like 4 × ? = 28.
flashcards_description: |
  19 cards on arrays (rows and columns), equal jumps, tape diagrams, steps for solving story problems, and
  finding an unknown factor in a multiplication equation.

flashcards:
  - front: Array → what it is
    back: |
      Things arranged in equal rows and equal columns, like chairs set out for a show or eggs in a carton.
    topic_code: "3.OA.A.1"
  - front: Row in an array → which way it goes
    back: |
      A row goes across, from left to right, like a line of students standing side by side.
    topic_code: "3.OA.A.1"
  - front: Column in an array → which way it goes
    back: |
      A column goes up and down, like a tall stack of blocks.
    topic_code: "3.OA.A.1"
  - front: Array with 3 rows of 5 → expression
    back: |
      3 × 5. Each row is a group of 5, and there are 3 rows. The product is 15.
    topic_code: "3.OA.A.1"
  - front: Array with 4 rows of 6 → total
    back: |
      24. Count by 6s four times: 6, 12, 18, 24.
    topic_code: "3.OA.A.1"
  - front: Adding one row to an array → what changes
    back: |
      The number of rows goes up by 1, so you add one more group. 4 rows of 6 is 24; 5 rows of 6 is 24 + 6 = 30.
    topic_code: "3.OA.A.3"
  - front: Equal jumps on a number line → how they show multiplication
    back: |
      Each jump is one group. 5 jumps of 4 from 0 land on 20, so 5 × 4 = 20.
    topic_code: "3.OA.A.1"
  - front: Counting jumps on a number line → a careful tip
    back: |
      Count the jumps (the curves), not the tick marks you land on. The starting point 0 is not a jump.
    topic_code: "3.OA.A.1"
  - front: Tape diagram → what it shows
    back: |
      A long bar cut into equal parts. Each part is one group, and the whole bar is the total.
    topic_code: "3.OA.A.4"
  - front: Unknown number → how we show it
    back: |
      Use a symbol such as ? or a box for the number we do not know yet, like 3 × ? = 12.
    topic_code: "3.OA.A.4"
  - front: 4 × ? = 20 → unknown factor
    back: |
      5, because 4 groups of 5 make 20. Count by 4s until you reach 20: 4, 8, 12, 16, 20. That is 5 counts.
    topic_code: "3.OA.A.4"
  - front: "? × 3 = 21 → unknown factor"
    back: |
      7, because 7 groups of 3 make 21: 3, 6, 9, 12, 15, 18, 21.
    topic_code: "3.OA.A.4"
  - front: 6 × ? = 30 → unknown factor
    back: |
      5, because 6 groups of 5 make 30.
    topic_code: "3.OA.A.4"
  - front: 18 = 2 × ? → unknown factor
    back: |
      9. The equal sign can come first: 18 is the same as 2 groups of 9.
    topic_code: "3.OA.A.4"
  - front: Story problem → three steps
    back: |
      1. Find the number of groups. 2. Find how many in each group. 3. Multiply, then check that the answer makes sense.
    topic_code: "3.OA.A.3"
  - front: '"In each" or "on every" in a story → what it often tells you'
    back: |
      It often tells the size of each group, like "6 apples in each basket".
    topic_code: "3.OA.A.3"
  - front: 3 vans with 7 students in each → total
    back: |
      21 students, because 3 × 7 = 21.
    topic_code: "3.OA.A.3"
  - front: 40 chairs in 5 equal rows → chairs in a row
    back: |
      8, because 5 × 8 = 40. The equation is 5 × ? = 40.
    topic_code: "3.OA.A.4"
  - front: Checking an answer to a story problem → one way
    back: |
      Draw the groups or an array and count, or skip-count again. Your answer should match the story.
    topic_code: "3.OA.A.3"

quiz:
  description: |
    14 questions · about 30 minutes · arrays, equal jumps on a number line, tape diagrams, equal-group story
    problems and unknown numbers in multiplication equations, with review of equal groups and bar graphs.
    Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word is matched
    automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w03-q01
      type: multiple_choice
      topic_code: "3.OA.A.1"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      stimulus: |
        Use the picture "Garden Plants". The plants are in rows that go across and columns that go down.
      figure: figures/w03-garden-array.svg
      figure_alt: "A picture titled Garden Plants. Green dots stand for plants in an array of 4 rows, with 6 plants in each row, so there are 6 columns."
      prompt: |
        Which expression matches the array?
      options:
        - "4 × 6"
        - "4 + 6"
        - "5 × 6"
        - "6 × 6"
      option_explanations:
        - |
          Correct. There are 4 rows and each row has 6 plants, so it is 4 groups of 6, or 4 × 6.
        - |
          4 + 6 adds the number of rows to the number in one row. The array has 4 equal rows of 6, so multiply.
        - |
          5 × 6 has one row too many. Count the rows going down again: there are 4.
        - |
          6 × 6 would need 6 rows. The array has 6 columns but only 4 rows.
      answer: 0

    - slug: g3math-w03-q02
      type: numeric
      topic_code: "3.OA.A.1"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      stimulus: |
        Use the picture "Garden Plants". The plants are in rows that go across and columns that go down.
      prompt: |
        How many plants are in the garden?
      answer: { value: 24, tolerance: 0 }
      explanation: |
        There are 4 rows of 6. Count by 6s once for each row: 6, 12, 18, 24. So 4 × 6 = 24 plants.

    - slug: g3math-w03-q03
      type: multiple_choice
      topic_code: "3.OA.A.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 1
      stimulus: |
        Use the picture "Garden Plants". The plants are in rows that go across and columns that go down.
      prompt: |
        The gardener plants one more row that is just like the others. How many plants are in the garden now?
      options:
        - "25"
        - "28"
        - "30"
        - "36"
      option_explanations:
        - |
          25 adds just one plant. A new row has 6 plants in it, so add 6, not 1.
        - |
          28 adds a new column of 4. The gardener added a row, and each row has 6 plants.
        - |
          Correct. Now there are 5 rows of 6, and 5 × 6 = 30. That is also 24 + 6 = 30.
        - |
          36 would be 6 rows of 6. There are only 5 rows after one more row is added.
      answer: 2

    - slug: g3math-w03-q04
      type: multiple_choice
      topic_code: "3.OA.A.1"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 1
      figure: figures/w03-number-line-jumps.svg
      figure_alt: "A number line from 0 to 24 with a tick mark at every whole number and labels at 0, 4, 8, 12, 16, 20 and 24. Five curved jumps start at 0 and land on 4, 8, 12, 16 and 20. Each jump is labeled +4."
      prompt: |
        The number line shows equal jumps that start at 0. Which multiplication does it show?
      options:
        - "4 × 4 = 16"
        - "5 + 4 = 9"
        - "6 × 4 = 24"
        - "5 × 4 = 20"
      option_explanations:
        - |
          4 × 4 = 16 stops one jump early. Count the curves again: there are 5 jumps, and the last one lands on 20.
        - |
          5 + 4 adds the number of jumps and the size of a jump. Each jump adds 4 more, so it is 5 groups of 4.
        - |
          6 × 4 counts the 6 numbers 0, 4, 8, 12, 16, 20 as jumps. The 0 is where you start, not a jump, so there are 5 jumps.
        - |
          Correct. There are 5 jumps and each jump is 4, so 5 groups of 4 land on 20.
      answer: 3

    - slug: g3math-w03-q05
      type: multiple_choice
      topic_code: "3.OA.A.4"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      stimulus: |
        Use the tape diagram. It has 3 equal parts, and the whole tape is 18.
      figure: figures/w03-tape-diagram.svg
      figure_alt: "A tape diagram made of 3 equal boxes in a row. Each box has a question mark in it. A bracket over the whole tape is labeled 18."
      prompt: |
        Which equation matches the tape diagram?
      options:
        - "3 × ? = 18"
        - "3 + ? = 18"
        - "18 × 3 = ?"
        - "? − 3 = 18"
      option_explanations:
        - |
          Correct. There are 3 equal parts, each part is the unknown number, and together they make 18.
        - |
          3 + ? adds 3 to one part. The tape has 3 parts that are all the same size, so the 3 tells how many groups.
        - |
          18 is already the total, so it should be the product, not a factor. 18 × 3 would be much bigger than the tape.
        - |
          Nothing is taken away in the tape diagram. Three equal parts join to make the whole, so it is multiplication.
      answer: 0

    - slug: g3math-w03-q06
      type: numeric
      topic_code: "3.OA.A.4"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      stimulus: |
        Use the tape diagram. It has 3 equal parts, and the whole tape is 18.
      prompt: |
        What number goes in each part of the tape?
      answer: { value: 6, tolerance: 0 }
      explanation: |
        Find the number that makes 3 × ? = 18. Count by 6s three times: 6, 12, 18. Each part is 6.

    - slug: g3math-w03-q07
      type: numeric
      topic_code: "3.OA.A.4"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      prompt: |
        What number makes this equation true? 7 × ? = 28
      answer: { value: 4, tolerance: 0 }
      explanation: |
        7 groups of what make 28? Try 4: 4, 8, 12, 16, 20, 24, 28 is seven 4s. So 7 × 4 = 28, and the unknown is 4.

    - slug: g3math-w03-q08
      type: multiple_choice
      topic_code: "3.OA.A.4"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      prompt: |
        Which number makes this equation true? ? × 5 = 35
      options:
        - "30"
        - "7"
        - "40"
        - "6"
      option_explanations:
        - |
          30 is 35 − 5. The equation multiplies, so look for how many 5s make 35.
        - |
          Correct. Count by 5s: 5, 10, 15, 20, 25, 30, 35. That is 7 fives, so 7 × 5 = 35.
        - |
          40 is 35 + 5. The unknown is a number of groups of 5, and 40 groups of 5 would be far more than 35.
        - |
          6 × 5 is 30, one group short of 35. You need one more 5, so the unknown is 7.
      answer: 1

    - slug: g3math-w03-q09
      type: fill_blank
      topic_code: "3.OA.A.1"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      prompt: |
        Things set out in equal rows and equal columns make an ____.
      answer: ["array", "arrays", "an array"]
      explanation: |
        An array has equal rows and equal columns, like the plants in the garden picture. Each row is an equal group.

    - slug: g3math-w03-q10
      type: true_false
      topic_code: "3.OA.A.1"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      prompt: |
        True or false: an array with 3 rows of 8 dots has 3 + 8 dots in all.
      answer: false
      explanation: |
        False. 3 rows of 8 is 3 groups of 8, so multiply: 3 × 8 = 24 dots. 3 + 8 = 11 is far too few.

    - slug: g3math-w03-q11
      type: multi_select
      topic_code: "3.OA.A.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which problems can be solved with 6 × 3? Select all that apply.
      options:
        - "There are 6 tables with 3 kids at each table. How many kids are there?"
        - "There are 6 red cars and 3 blue cars. How many cars are there?"
        - "There are 6 rows of chairs with 3 chairs in each row. How many chairs are there?"
        - "Jo has 6 stickers and gives 3 to a friend. How many does Jo have left?"
        - "Each of 6 kites has 3 bows on its tail. How many bows are there?"
      option_explanations:
        - |
          Yes. Each table is a group of 3, and there are 6 tables: 6 groups of 3.
        - |
          No. Red cars and blue cars are two groups of different sizes, so you add: 6 + 3 = 9.
        - |
          Yes. 6 rows with 3 chairs in each row is an array of 6 groups of 3.
        - |
          No. Giving stickers away is taking away, so you subtract: 6 − 3 = 3.
        - |
          Yes. Each kite is a group of 3 bows, and there are 6 kites.
      answer: [0, 2, 4]

    - slug: g3math-w03-q12
      type: multiple_choice
      topic_code: "3.OA.A.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 1
      prompt: |
        A class goes on a field trip in 4 vans. Each van carries 8 students. How many students go on the trip?
      options:
        - "12"
        - "28"
        - "32"
        - "36"
      option_explanations:
        - |
          12 adds 4 and 8. There are 4 vans with 8 students in each, which is 4 groups of 8.
        - |
          28 is 4 × 7. Each van carries 8 students, not 7, so count by 8s.
        - |
          Correct. 4 groups of 8 is 4 × 8. Count by 8s: 8, 16, 24, 32.
        - |
          36 is 4 × 9, one too many in every van. Count by 8s: 8, 16, 24, 32.
      answer: 2

    - slug: g3math-w03-q13
      type: short_answer
      topic_code: "3.OA.A.4"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 2
      prompt: |
        Tomás sets up 40 chairs for a school show. He puts them in 5 equal rows.

        (a) Write an equation for this story. Use ? for the number of chairs in each row.
        (b) How many chairs are in each row? Explain how you know.
      answer: |
        (a) 5 × ? = 40.
        (b) 8 chairs. Count by 8s five times: 8, 16, 24, 32, 40. So 5 × 8 = 40.
      explanation: |
        Two points.

        (a) 1 pt: 5 × ? = 40, or 40 = 5 × ?, or ? × 5 = 40 with a note that ? is the chairs in a row.

        (b) 1 pt: 8, with a reason, such as skip-counting by 8s to 40, counting by 5s to 40 and seeing 8 counts, or a drawing of 5 rows of 8.

    - slug: g3math-w03-q14
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      prompt: |
        On a bar graph, the scale counts by 2s: 0, 2, 4, 6, 8, 10. A bar stops halfway between 8 and 10. What number does the bar show?
      options:
        - "4"
        - "8"
        - "10"
        - "9"
      option_explanations:
        - |
          4 counts the lines up to 8, but each line is worth 2, and the bar goes past 8.
        - |
          8 is the line just below the top of the bar. The bar goes higher than 8, to the middle of 8 and 10.
        - |
          10 is the line just above the top of the bar. The bar stops before it reaches 10.
        - |
          Correct. The number halfway between 8 and 10 is 9, so the bar shows 9.
      answer: 3
