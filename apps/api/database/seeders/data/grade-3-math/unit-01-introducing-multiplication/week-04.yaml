week: 4
unit: 1
title: "Turn-Around Facts and Patterns in the Times Table"
topics: ["3.OA.B.5", "3.OA.D.9"]
guide: guides/week-04.md
guide_description: |
  Why the order of the factors does not change the product (turning an array on its side), how to use a fact
  you know to find its turn-around fact, and how to spot and explain patterns in a multiplication table.
flashcards_description: |
  18 cards on turn-around facts (the commutative property), turning an array, the multiplication table, even
  and odd products, and patterns in the 2s, 4s, 5s and 10s.

flashcards:
  - front: Turn-around fact for 3 × 7 → what it is
    back: |
      7 × 3. Both have the product 21, because you can switch the order of the factors.
    topic_code: "3.OA.B.5"
  - front: Commutative property of multiplication → what it says
    back: |
      You can multiply two factors in either order and get the same product: 4 × 6 = 6 × 4 = 24.
    topic_code: "3.OA.B.5"
  - front: Turning an array on its side → what changes and what stays
    back: |
      The rows become columns, so 2 rows of 5 becomes 5 rows of 2. The number of dots stays 10.
    topic_code: "3.OA.B.5"
  - front: 4 groups of 3 vs 3 groups of 4 → are the totals the same?
    back: |
      Yes, both are 12. The groups look different (4 small groups or 3 bigger groups), but the total is the same.
    topic_code: "3.OA.B.5"
  - front: Know 2 × 9 = 18 → what else do you know?
    back: |
      9 × 2 = 18. A turn-around fact gives you a second fact for free.
    topic_code: "3.OA.B.5"
  - front: 5 × 8 = 8 × ? → missing factor
    back: |
      5. The same two factors in a different order give the same product, 40.
    topic_code: "3.OA.B.5"
  - front: Multiplication table → how to read it
    back: |
      Find one factor at the side and the other at the top. The product is where that row and column meet.
    topic_code: "3.OA.D.9"
  - front: Row for 2 in the table → pattern
    back: |
      2, 4, 6, 8, 10, 12. The products go up by 2 and are all even.
    topic_code: "3.OA.D.9"
  - front: Row for 5 in the table → pattern
    back: |
      5, 10, 15, 20, 25, 30. The products end in 5 or 0, taking turns.
    topic_code: "3.OA.D.9"
  - front: Row for 10 → pattern
    back: |
      10, 20, 30, 40. Every product ends in 0, and the tens digit is the other factor.
    topic_code: "3.OA.D.9"
  - front: Row for 4 → link to the row for 2
    back: |
      Each product in the 4s row is double the one in the 2s row: 2 × 3 = 6 and 4 × 3 = 12.
    topic_code: "3.OA.D.9"
  - front: Even number → what it is
    back: |
      A number that can be split into 2 equal groups with none left over, like 8 or 14. Even numbers end in 0, 2, 4, 6 or 8.
    topic_code: "3.OA.D.9"
  - front: Odd number → what it is
    back: |
      A number that leaves 1 over when you split it into 2 equal groups, like 7 or 15. Odd numbers end in 1, 3, 5, 7 or 9.
    topic_code: "3.OA.D.9"
  - front: Any number × 2 → even or odd?
    back: |
      Always even, because it is the number of things in 2 equal groups.
    topic_code: "3.OA.D.9"
  - front: Odd × odd → even or odd?
    back: |
      Odd, such as 3 × 5 = 15 and 7 × 3 = 21.
    topic_code: "3.OA.D.9"
  - front: Diagonal line in the multiplication table → what you see
    back: |
      The table matches on both sides of the line from 1 × 1 down to the corner, because every fact has a turn-around fact.
    topic_code: "3.OA.D.9"
  - front: Pattern 3, 6, 9, 12 → next number
    back: |
      15. The numbers go up by 3 each time; they are the 3s facts.
    topic_code: "3.OA.D.9"
  - front: Explaining a pattern → good words to use
    back: |
      Say what changes and by how much, such as "each product is 5 more than the one before, because we add one more group of 5."
    topic_code: "3.OA.D.9"

quiz:
  description: |
    14 questions · about 30 minutes · turn-around facts, turning arrays, reading a multiplication table, even
    and odd products and number patterns, with review of unknown numbers, story problems and bar graphs.
    Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word is matched
    automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w04-q01
      type: multiple_choice
      topic_code: "3.OA.B.5"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      stimulus: |
        Use the picture "Two Arrays". Array A has 3 rows of 5 dots. Array B has 5 rows of 3 dots.
      figure: figures/w04-two-arrays.svg
      figure_alt: "A picture titled Two Arrays. On the left, Array A has 3 rows of blue dots with 5 dots in each row. On the right, Array B has 5 rows of green dots with 3 dots in each row."
      prompt: |
        Which sentence about the two arrays is true?
      options:
        - "Array B has more dots, because it has more rows."
        - "Both arrays have 15 dots."
        - "Array A has 2 more dots than Array B."
        - "Both arrays have 8 dots."
      option_explanations:
        - |
          Array B has more rows, but each row is shorter: 5 rows of 3 is 15, the same as 3 rows of 5.
        - |
          Correct. 3 × 5 = 15 and 5 × 3 = 15. Array B is just Array A turned on its side.
        - |
          2 is 5 − 3, the difference between the factors. The totals are the same, 15 and 15, so neither has more.
        - |
          8 is 3 + 5. Each array has equal rows, so multiply: 3 groups of 5 is 15.
      answer: 1

    - slug: g3math-w04-q02
      type: multiple_choice
      topic_code: "3.OA.B.5"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      stimulus: |
        Use the picture "Two Arrays". Array A has 3 rows of 5 dots. Array B has 5 rows of 3 dots.
      prompt: |
        Which equation do the two arrays show?
      options:
        - "3 × 5 = 5 × 3"
        - "3 + 5 = 5 × 3"
        - "3 × 5 = 3 × 3"
        - "3 × 5 = 15 × 3"
      option_explanations:
        - |
          Correct. Array A is 3 × 5 and Array B is 5 × 3. They have the same number of dots, so the two sides are equal.
        - |
          3 + 5 is 8, but 5 × 3 is 15. Adding the factors does not give the number of dots in either array.
        - |
          3 × 3 is 9, which would be 3 rows of 3. Array B has 5 rows of 3, which is 5 × 3.
        - |
          15 is the product, not a factor. 15 × 3 would be 45 dots, far more than either array.
      answer: 0

    - slug: g3math-w04-q03
      type: numeric
      topic_code: "3.OA.B.5"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      prompt: |
        Lin knows that 4 × 9 = 36. What is 9 × 4?
      answer: { value: 36, tolerance: 0 }
      explanation: |
        9 × 4 is the turn-around fact of 4 × 9. Switching the order of the factors does not change the product, so 9 × 4 = 36.

    - slug: g3math-w04-q04
      type: multiple_choice
      topic_code: "3.OA.B.5"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      prompt: |
        Which fact has the same product as 6 × 8?
      options:
        - "8 + 6"
        - "6 × 9"
        - "7 × 7"
        - "8 × 6"
      option_explanations:
        - |
          8 + 6 = 14 adds the factors. 6 × 8 means 6 groups of 8, which is 48.
        - |
          6 × 9 = 54 is one more group of 6 than 6 × 8. Changing a factor changes the product.
        - |
          7 × 7 = 49 is close to 48 but not the same. Only switching the same two factors keeps the product.
        - |
          Correct. 8 × 6 uses the same two factors in the other order, so its product is also 48.
      answer: 3

    - slug: g3math-w04-q05
      type: multiple_choice
      topic_code: "3.OA.D.9"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      stimulus: |
        Use the multiplication table. It shows every product from 1 × 1 to 6 × 6.
      figure: figures/w04-times-table.svg
      figure_alt: "A multiplication table with factors 1 to 6 across the top and 1 to 6 down the side. Row 1 reads 1, 2, 3, 4, 5, 6. Row 2 reads 2, 4, 6, 8, 10, 12. Row 3 reads 3, 6, 9, 12, 15, 18. Row 4 reads 4, 8, 12, 16, 20, 24. Row 5 reads 5, 10, 15, 20, 25, 30. Row 6 reads 6, 12, 18, 24, 30, 36."
      prompt: |
        Look at the row for 5. Which pattern do you see in its products?
      options:
        - "The products are all even."
        - "The products go up by 1 each time."
        - "The products end in 5 or 0."
        - "The products go up by 6 each time."
      option_explanations:
        - |
          Only 10, 20 and 30 are even. 5, 15 and 25 are odd, so the products are not all even.
        - |
          Going up by 1 would be 5, 6, 7. The row goes 5, 10, 15, 20, 25, 30, which is up by 5.
        - |
          Correct. The row reads 5, 10, 15, 20, 25, 30. The ones digit takes turns: 5, 0, 5, 0.
        - |
          Going up by 6 is the pattern in the row for 6. Each step in the 5s row adds one more 5.
      answer: 2

    - slug: g3math-w04-q06
      type: multi_select
      topic_code: "3.OA.D.9"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 2
      partial_credit: true
      stimulus: |
        Use the multiplication table. It shows every product from 1 × 1 to 6 × 6.
      prompt: |
        Which sentences about the table are true? Select all that apply.
      options:
        - "Every product in the row for 3 is odd."
        - "Every product in the row for 2 is even."
        - "The product 12 is in the table four times."
        - "Odd times odd gives an even product."
        - "The products in the row for 4 go up by 4 each time."
      option_explanations:
        - |
          False. The row for 3 is 3, 6, 9, 12, 15, 18, and 6, 12 and 18 are even.
        - |
          True. The row for 2 is 2, 4, 6, 8, 10, 12, and every one of them is even.
        - |
          True. 12 is 2 × 6, 3 × 4, 4 × 3 and 6 × 2, so it shows up four times.
        - |
          False. 3 × 5 = 15 and 5 × 5 = 25 are odd. Odd times odd is always odd.
        - |
          True. The row for 4 is 4, 8, 12, 16, 20, 24, adding 4 each time.
      answer: [1, 2, 4]

    - slug: g3math-w04-q07
      type: numeric
      topic_code: "3.OA.D.9"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      stimulus: |
        Use the multiplication table. It shows every product from 1 × 1 to 6 × 6.
      prompt: |
        The row for 4 ends at 6 × 4. If the table kept going, what would come after 24 in the row for 4?
      answer: { value: 28, tolerance: 0 }
      explanation: |
        The row for 4 goes up by 4 each time: 4, 8, 12, 16, 20, 24. The next product is 24 + 4 = 28, which is 4 × 7.

    - slug: g3math-w04-q08
      type: fill_blank
      topic_code: "3.OA.B.5"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      prompt: |
        Changing the order of the factors does not change the ____.
      answer: ["product", "the product", "products"]
      explanation: |
        The answer to a multiplication is the product. 3 × 8 and 8 × 3 have the same product, 24.

    - slug: g3math-w04-q09
      type: true_false
      topic_code: "3.OA.D.9"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      prompt: |
        True or false: when you multiply any whole number by 2, the product is even.
      answer: true
      explanation: |
        True. Any number × 2 is 2 equal groups, and a number made of 2 equal groups is even. Look at the 2s row: 2, 4, 6, 8, 10, 12.

    - slug: g3math-w04-q10
      type: multiple_choice
      topic_code: "3.OA.D.9"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      prompt: |
        What number comes next in the pattern 6, 12, 18, 24, ___?
      options:
        - "30"
        - "28"
        - "25"
        - "36"
      option_explanations:
        - |
          Correct. Each number is 6 more than the one before, so 24 + 6 = 30. These are the 6s facts.
        - |
          28 adds 4. Check the steps: 6 to 12 to 18 to 24 each add 6, not 4.
        - |
          25 adds only 1 to 24. The pattern adds 6 each time.
        - |
          36 skips a step: it is 6 × 6. The next number after 24 is 6 × 5 = 30.
      answer: 0

    - slug: g3math-w04-q11
      type: short_answer
      topic_code: "3.OA.B.5"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 2
      prompt: |
        Ezra does not know 7 × 2. He does know that 2 × 7 = 14.

        (a) What is 7 × 2?
        (b) Explain or draw why knowing 2 × 7 helps Ezra.
      answer: |
        (a) 14.
        (b) 7 × 2 is the turn-around fact of 2 × 7. An array of 2 rows of 7 turned on its side is 7 rows of 2, and it still has 14 dots.
      explanation: |
        Two points.

        (a) 1 pt: 14.

        (b) 1 pt: a reason that the order of the factors does not change the product, such as turning an array, drawing 2 groups of 7 and 7 groups of 2 that both make 14, or naming the turn-around (commutative) property.

    - slug: g3math-w04-q12
      type: multiple_choice
      topic_code: "3.OA.A.4"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      prompt: |
        Which number makes this equation true? ? × 6 = 42
      options:
        - "36"
        - "6"
        - "48"
        - "7"
      option_explanations:
        - |
          36 is 42 − 6. The equation multiplies, so ask how many 6s make 42.
        - |
          6 × 6 is 36, one group of 6 short of 42.
        - |
          48 is 42 + 6. That is the total for 8 groups of 6, which is more than 42.
        - |
          Correct. Count by 6s: 6, 12, 18, 24, 30, 36, 42. That is 7 sixes, so 7 × 6 = 42.
      answer: 3

    - slug: g3math-w04-q13
      type: numeric
      topic_code: "3.OA.A.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 1
      prompt: |
        A pet shop has 8 fish tanks. There are 5 fish in each tank. How many fish are there?
      answer: { value: 40, tolerance: 0 }
      explanation: |
        8 groups of 5 is 8 × 5. Count by 5s eight times: 5, 10, 15, 20, 25, 30, 35, 40. There are 40 fish.

    - slug: g3math-w04-q14
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      figure: figures/w04-snacks-bar-graph.svg
      figure_alt: "A bar graph titled Class Party Snacks. The side scale goes 0, 2, 4, 6, 8, 10, 12, 14 and is labeled Number of students. The Crackers bar reaches 8, the Apples bar reaches 12, the Carrots bar reaches 6 and the Grapes bar reaches 10."
      prompt: |
        The bar graph shows which snack each student chose. How many more students chose apples than carrots?
      options:
        - "3"
        - "6"
        - "18"
        - "2"
      option_explanations:
        - |
          3 is how many more lines the apples bar has than the carrots bar. Each line is worth 2, so the difference is 6.
        - |
          Correct. Apples reaches 12 and carrots reaches 6, and 12 − 6 = 6 more students.
        - |
          18 adds apples and carrots, 12 + 6. "How many more" asks for the difference, so subtract.
        - |
          2 is how many more students chose apples than grapes (12 − 10). The question asks about carrots.
      answer: 1
