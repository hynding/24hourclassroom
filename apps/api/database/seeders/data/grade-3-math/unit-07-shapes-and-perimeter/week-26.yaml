week: 26
unit: 7
title: "Perimeter: The Distance All the Way Around"
topics: ["3.MD.D.8"]
guide: guides/week-26.md
guide_description: |
  What perimeter means, how to find it by adding side lengths or counting unit lengths on a grid, shortcuts for
  rectangles and squares, and how to find a missing side when you know the perimeter.
flashcards_description: |
  19 cards on the meaning of perimeter, its units, adding the sides, rectangle and square shortcuts, finding a
  missing side, and telling perimeter apart from area.

flashcards:
  - front: Perimeter → what it is
    back: |
      The total length of all the sides of a shape: the distance all the way around it.
    topic_code: "3.MD.D.8"
  - front: Perimeter → how to find it for any polygon
    back: |
      Add the lengths of all the sides. Sides of 5, 4 and 6 cm: 5 + 4 + 6 = 15 cm.
    topic_code: "3.MD.D.8"
  - front: Perimeter → which units to use
    back: |
      Length units, like centimeters, meters, inches and feet. Not square units.
    topic_code: "3.MD.D.8"
  - front: Perimeter on a grid → what to count
    back: |
      Count the unit lengths along the outside edge, one for each side of a square that is on the edge. Do not count the squares inside.
    topic_code: "3.MD.D.8"
  - front: Perimeter vs area → the difference
    back: |
      Perimeter is the length around a shape (cm). Area is how many unit squares cover it (square cm).
    topic_code: "3.MD.D.8"
  - front: Rectangle perimeter → why only two labels are enough
    back: |
      Opposite sides of a rectangle are the same length, so knowing the length and the width tells you all 4 sides.
    topic_code: "3.MD.D.8"
  - front: Rectangle 7 cm by 3 cm → perimeter
    back: |
      20 cm. 7 + 3 + 7 + 3 = 20, or (7 + 3) × 2 = 20.
    topic_code: "3.MD.D.8"
  - front: Rectangle perimeter → a quick way
    back: |
      Add one length and one width, then double it. 8 m by 5 m: 8 + 5 = 13, and 13 + 13 = 26 m.
    topic_code: "3.MD.D.8"
  - front: Square perimeter → a quick way
    back: |
      All 4 sides are equal, so multiply one side by 4. A side of 6 in: 4 × 6 = 24 in.
    topic_code: "3.MD.D.8"
  - front: Square with side 9 cm → perimeter
    back: |
      36 cm, because 4 × 9 = 36.
    topic_code: "3.MD.D.8"
  - front: Square with perimeter 20 cm → one side
    back: |
      5 cm, because 20 ÷ 4 = 5.
    topic_code: "3.MD.D.8"
  - front: Missing side → how to find it from the perimeter
    back: |
      Add the sides you know, then subtract that sum from the perimeter. Perimeter 20, known sides 6 + 5 + 4 = 15, so 20 − 15 = 5.
    topic_code: "3.MD.D.8"
  - front: Rectangle perimeter 16 m, one side 5 m → the side next to it
    back: |
      3 m. Two 5 m sides make 10, then 16 − 10 = 6 is left for the other two sides, and 6 ÷ 2 = 3.
    topic_code: "3.MD.D.8"
  - front: Triangle with sides 4, 7 and 8 cm → perimeter
    back: |
      19 cm, because 4 + 7 + 8 = 19.
    topic_code: "3.MD.D.8"
  - front: Perimeter in real life → three examples
    back: |
      A fence around a garden, a ribbon border around a bulletin board, the lap you walk around a field.
    topic_code: "3.MD.D.8"
  - front: Perimeter → a common counting mistake
    back: |
      Counting the squares inside a shape on a grid. That gives the area, not the perimeter.
    topic_code: "3.MD.D.8"
  - front: Perimeter → a common adding mistake
    back: |
      Adding only the sides that have labels. Every side counts, even the ones you have to figure out.
    topic_code: "3.MD.D.8"
  - front: Checking a perimeter → a good habit
    back: |
      Put your finger on one corner and go all the way around, touching each side once as you add it.
    topic_code: "3.MD.D.8"
  - front: Shape with all corners square and notches → finding hidden sides
    back: |
      Opposite sides balance out. If the bottom is 10 and the top is two parts, one 6, the other part is 10 − 6 = 4.
    topic_code: "3.MD.D.8"

quiz:
  description: |
    13 questions · about 25 minutes · finding perimeter on a grid and from side lengths, rectangle and square
    shortcuts, missing side lengths, and telling perimeter from area, plus review of area, shape names and adding
    within 1,000. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word
    is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w26-q01
      type: multiple_choice
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section B"
      points: 1
      stimulus: |
        Use the shaded shape on the grid. Each square is 1 centimeter long on each side.
      figure: figures/w26-l-shape-grid.svg
      figure_alt: "A grid of squares, 7 across and 6 down. A shaded shape is drawn along the grid lines: a row of 5 squares by 2 squares along the bottom, with a block 2 squares wide and 2 squares tall on top of its left end. Going around the outside: the bottom is 5 units, the right side 2, then left 3, up 2, the top 2, and the left side 4. A note says each square is 1 cm on each side."
      prompt: |
        What is the perimeter of the shaded shape?
      options:
        - "14 cm"
        - "16 cm"
        - "18 cm"
        - "9 cm"
      option_explanations:
        - |
          14 is the number of squares inside the shape. That is its area, 14 square centimeters, not the length around it.
        - |
          16 cm leaves out one of the 2 cm sides. Go all the way around: 5 + 2 + 3 + 2 + 2 + 4 = 18.
        - |
          Correct. Going around: 5 + 2 + 3 + 2 + 2 + 4 = 18 cm.
        - |
          9 cm adds only the bottom (5) and the left side (4). Every side of the shape counts.
      answer: 2

    - slug: g3math-w26-q02
      type: numeric
      topic_code: "3.MD.C.6"
      source: "IM K–5 Math Grade 3, Unit 2, Section A"
      points: 1
      stimulus: |
        Use the shaded shape on the grid. Each square is 1 centimeter long on each side.
      prompt: |
        Review: how many square centimeters does the shaded shape cover? (This is its area.)
      answer: { value: 14, tolerance: 0 }
      explanation: |
        Count the unit squares: the bottom part is 5 × 2 = 10 squares and the part on top is 2 × 2 = 4 squares. 10 + 4 = 14 square centimeters.

    - slug: g3math-w26-q03
      type: numeric
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section B"
      points: 1
      stimulus: |
        Use the picture of the garden. The perimeter of the garden is 26 feet.
      figure: figures/w26-garden-pentagon.svg
      figure_alt: "A garden with five sides. The bottom side is 8 ft, the right side is 3 ft, a slanted side going up and to the left is labeled ? ft, the top side is 4 ft and the left side is 6 ft. Right angle marks are in the bottom left, bottom right and top left corners."
      prompt: |
        How many feet long is the side marked with a question mark?
      answer: { value: 5, tolerance: 0 }
      explanation: |
        Add the four sides you know: 8 + 3 + 4 + 6 = 21 feet. The perimeter is 26 feet, so the missing side is 26 − 21 = 5 feet.

    - slug: g3math-w26-q04
      type: multiple_choice
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section B"
      points: 1
      stimulus: |
        Use the picture of the garden. The perimeter of the garden is 26 feet.
      prompt: |
        Mateo puts a fence along every side of the garden except the 8-foot side, which is next to a wall. How many feet of fence does he need?
      options:
        - "18 feet"
        - "26 feet"
        - "34 feet"
        - "8 feet"
      option_explanations:
        - |
          Correct. The whole way around is 26 feet. Leave out the 8-foot side: 26 − 8 = 18 feet.
        - |
          26 feet would fence every side, but the 8-foot side is next to the wall and needs no fence.
        - |
          34 adds the 8 feet on to the perimeter. The 8-foot side should be taken away, not added.
        - |
          8 feet is the side that needs no fence. The fence goes along the other four sides.
      answer: 0

    - slug: g3math-w26-q05
      type: multiple_choice
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section B"
      points: 1
      figure: figures/w26-rectangle-9-by-4.svg
      figure_alt: "A rectangle with a right angle mark in all 4 corners. The bottom side is labeled 9 cm and the right side is labeled 4 cm. The top and left sides have no labels."
      prompt: |
        What is the perimeter of the rectangle?
      options:
        - "13 cm"
        - "36 cm"
        - "22 cm"
        - "26 cm"
      option_explanations:
        - |
          13 cm adds only the two labeled sides. A rectangle has 4 sides, and the top and left sides count too.
        - |
          36 is 9 × 4, which is the area in square centimeters, not the length around the rectangle.
        - |
          22 cm adds 9 + 9 + 4, which leaves out the left side. Opposite sides match, so it is 4 cm too.
        - |
          Correct. Opposite sides are equal, so the sides are 9, 4, 9 and 4 cm. 9 + 4 + 9 + 4 = 26 cm.
      answer: 3

    - slug: g3math-w26-q06
      type: multiple_choice
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section B"
      points: 1
      prompt: |
        A square sticker has sides that are 7 inches long. What is its perimeter?
      options:
        - "14 inches"
        - "28 inches"
        - "49 inches"
        - "11 inches"
      option_explanations:
        - |
          14 inches counts only 2 sides. A square has 4 sides of 7 inches.
        - |
          Correct. A square has 4 equal sides: 4 × 7 = 28 inches.
        - |
          49 is 7 × 7, the area in square inches. Perimeter adds the 4 sides instead.
        - |
          11 adds 7 and 4, the side length and the number of sides. Multiply them instead: 4 × 7.
      answer: 1

    - slug: g3math-w26-q07
      type: multi_select
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which rectangles have a perimeter of 20 cm? Select all that apply.
      options:
        - "6 cm by 4 cm"
        - "5 cm by 5 cm"
        - "10 cm by 2 cm"
        - "8 cm by 2 cm"
        - "4 cm by 5 cm"
      option_explanations:
        - |
          Yes. Add all four sides: 6 + 4 + 6 + 4 = 20 cm.
        - |
          Yes. This rectangle is a square: 5 + 5 + 5 + 5 = 20 cm.
        - |
          No. 10 + 2 + 10 + 2 = 24 cm. Its area is 20 square cm, which may be why it looks right.
        - |
          Yes. Add all four sides: 8 + 2 + 8 + 2 = 20 cm.
        - |
          No. 4 + 5 + 4 + 5 = 18 cm. Its area is 20 square cm, but its perimeter is 18 cm.
      answer: [0, 1, 3]

    - slug: g3math-w26-q08
      type: true_false
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section B"
      points: 1
      prompt: |
        True or false: perimeter is measured in square units, like square centimeters.
      answer: false
      explanation: |
        False. Perimeter is a length, the distance around a shape, so it is measured in length units like centimeters or feet. Square units are for area.

    - slug: g3math-w26-q09
      type: fill_blank
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section B"
      points: 1
      prompt: |
        The total length of all the sides of a shape is called its ____.
      answer: ["perimeter", "the perimeter", "perimeters"]
      explanation: |
        The perimeter is the distance all the way around a shape, so you find it by adding the lengths of all its sides.

    - slug: g3math-w26-q10
      type: multiple_choice
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section B"
      points: 1
      prompt: |
        A rectangle-shaped garden bed has a perimeter of 30 meters. One side is 10 meters long. How long is the side next to it?
      options:
        - "20 meters"
        - "10 meters"
        - "15 meters"
        - "5 meters"
      option_explanations:
        - |
          30 − 10 = 20 takes away only one 10-meter side. The rectangle has two 10-meter sides, and the 20 left over is shared by two sides.
        - |
          30 − 10 − 10 = 10 is what is left for the other two sides together. Split it in half: each side is 5 meters.
        - |
          15 is half of 30. That is one length plus one width, so the width is 15 − 10 = 5 meters.
        - |
          Correct. Two sides are 10 m, which is 20 m. 30 − 20 = 10 m is left for the other two sides, so each is 5 m.
      answer: 3

    - slug: g3math-w26-q11
      type: multiple_choice
      topic_code: "3.G.A.1"
      source: "IM K–5 Math Grade 3, Unit 7, Section A"
      points: 1
      prompt: |
        Review: Ji-woo's shape has 4 sides that are each 5 cm long and 4 right angles. Which tells its perimeter and its most exact name?
      options:
        - "20 cm, square"
        - "25 cm, square"
        - "20 cm, a rhombus that is not a square"
        - "9 cm, rectangle"
      option_explanations:
        - |
          Correct. 4 × 5 = 20 cm around, and 4 equal sides with 4 right angles make a square.
        - |
          25 is 5 × 5, the area in square centimeters. The perimeter adds the 4 sides: 20 cm.
        - |
          The perimeter is right, but a rhombus with 4 right angles is a square, so "not a square" is wrong.
        - |
          9 adds the side length and the number of sides. Also, "square" is more exact than "rectangle" here.
      answer: 0

    - slug: g3math-w26-q12
      type: numeric
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section A"
      points: 1
      prompt: |
        Review: a walking path goes around a field shaped like a triangle. The sides are 136 meters, 208 meters and 175 meters. How many meters is one trip around the field?
      answer: { value: 519, tolerance: 0 }
      explanation: |
        Add the three sides. 136 + 208 = 344, and 344 + 175 = 519 meters. (Hundreds: 100 + 200 + 100 = 400; tens: 30 + 0 + 70 = 100; ones: 6 + 8 + 5 = 19; 400 + 100 + 19 = 519.)

    - slug: g3math-w26-q13
      type: short_answer
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section B"
      points: 2
      prompt: |
        Ana made a rectangle with a perimeter of 18 cm. One of its sides is 6 cm long.

        (a) How long is the side next to the 6 cm side?
        (b) Show how you know.
      answer: |
        (a) 3 cm.
        (b) A rectangle has two 6 cm sides: 6 + 6 = 12 cm. 18 − 12 = 6 cm is left for the other two sides, and they are equal, so each is 6 ÷ 2 = 3 cm. Check: 6 + 3 + 6 + 3 = 18.
      explanation: |
        Two points.

        (a) 1 pt: 3 cm.

        (b) 1 pt: work that uses both 6 cm sides and shares what is left between the other two sides, or a check that 6 + 3 + 6 + 3 = 18. A labeled drawing of the rectangle also earns the point.
