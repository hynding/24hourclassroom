week: 25
unit: 7
title: "Sorting Shapes: Quadrilaterals, Rhombuses, Rectangles and Squares"
topics: ["3.G.A.1"]
guide: guides/week-25.md
guide_description: |
  How to describe a shape by its attributes (number of sides, side lengths, right angles), what makes a shape a
  quadrilateral, a rhombus, a rectangle or a square, and why every square is both a rhombus and a rectangle.
flashcards_description: |
  20 cards on shape words (polygon, side, vertex, angle, right angle, attribute), shape names by number of sides,
  and the rules for rhombuses, rectangles and squares.

flashcards:
  - front: Polygon → what it is
    back: |
      A flat, closed shape made only of straight sides. Triangles, quadrilaterals, pentagons and hexagons are polygons.
    topic_code: "3.G.A.1"
  - front: Circle → is it a polygon?
    back: |
      No. A circle has a curved edge and no straight sides, so it is not a polygon.
    topic_code: "3.G.A.1"
  - front: Closed shape → what it means
    back: |
      The sides meet all the way around, with no gaps. A shape with a gap in its outline is not a polygon.
    topic_code: "3.G.A.1"
  - front: Side of a polygon → what it is
    back: |
      One of the straight line segments that make the outline of the shape.
    topic_code: "3.G.A.1"
  - front: Vertex of a polygon → what it is
    back: |
      A corner, where two sides meet. More than one vertex are called vertices.
    topic_code: "3.G.A.1"
  - front: Angle in a polygon → where to find it
    back: |
      At each vertex, where two sides meet. A square has 4 angles, a triangle has 3.
    topic_code: "3.G.A.1"
  - front: Right angle → what it looks like
    back: |
      A square corner, like the corner of a sheet of paper or a book. Drawings often mark it with a tiny square.
    topic_code: "3.G.A.1"
  - front: Checking for a right angle → an easy tool
    back: |
      Hold the corner of an index card or a sheet of paper in the corner of the shape. If they match exactly, it is a right angle.
    topic_code: "3.G.A.1"
  - front: Attribute of a shape → meaning
    back: |
      A feature you can check, such as how many sides it has, whether the sides are equal, or whether it has right angles. Color and size are not shape attributes.
    topic_code: "3.G.A.1"
  - front: Triangle → number of sides
    back: |
      3 sides and 3 vertices.
    topic_code: "3.G.A.1"
  - front: Quadrilateral → what it is
    back: |
      Any polygon with exactly 4 sides. "Quad" means four.
    topic_code: "3.G.A.1"
  - front: Pentagon → number of sides
    back: |
      5 sides and 5 vertices.
    topic_code: "3.G.A.1"
  - front: Hexagon → number of sides
    back: |
      6 sides and 6 vertices.
    topic_code: "3.G.A.1"
  - front: Rhombus → what makes a shape one
    back: |
      It is a quadrilateral with 4 sides that are all the same length. Its angles do not have to be right angles.
    topic_code: "3.G.A.1"
  - front: Rectangle → what makes a shape one
    back: |
      It is a quadrilateral with 4 right angles. Its sides do not all have to be the same length.
    topic_code: "3.G.A.1"
  - front: Square → what makes a shape one
    back: |
      It is a quadrilateral with 4 sides of the same length and 4 right angles.
    topic_code: "3.G.A.1"
  - front: Is a square a rectangle?
    back: |
      Yes. A square has 4 right angles, and that is all a rectangle needs.
    topic_code: "3.G.A.1"
  - front: Is a square a rhombus?
    back: |
      Yes. A square has 4 equal sides, and that is all a rhombus needs.
    topic_code: "3.G.A.1"
  - front: Is every rectangle a square?
    back: |
      No. A rectangle that is 6 cm long and 3 cm wide has 4 right angles but its sides are not all equal, so it is not a square.
    topic_code: "3.G.A.1"
  - front: Is every rhombus a square?
    back: |
      No. A rhombus can lean over so its corners are not square. Only a rhombus with 4 right angles is a square.
    topic_code: "3.G.A.1"

quiz:
  description: |
    13 questions · about 25 minutes · naming shapes by their sides and angles, telling rhombuses, rectangles and
    squares apart, and why a square belongs to both of the other groups, plus review of area, time and equal
    groups. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word is
    matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w25-q01
      type: numeric
      topic_code: "3.G.A.1"
      source: "IM K–5 Math Grade 3, Unit 7, Section A"
      points: 1
      stimulus: |
        Use the six shapes. Side lengths are in centimeters, and a small square in a corner marks a right angle.
      figure: figures/w25-six-shapes.svg
      figure_alt: "Six shapes. Shape 1 has 4 sides, each 4 cm, with a right angle mark in all 4 corners. Shape 2 has 4 sides of 6 cm, 3 cm, 6 cm and 3 cm, with a right angle mark in all 4 corners. Shape 3 has 4 sides, each 5 cm, leaning over, with no right angles. Shape 4 has 3 sides. Shape 5 has 4 sides of 7 cm, 6 cm, 2 cm and 4 cm, with no right angles. Shape 6 has 5 sides."
      prompt: |
        How many of the six shapes are quadrilaterals?
      answer: { value: 4, tolerance: 0 }
      explanation: |
        A quadrilateral has exactly 4 sides. Shapes 1, 2, 3 and 5 each have 4 sides, so 4 shapes are quadrilaterals. Shape 4 has 3 sides and Shape 6 has 5 sides.

    - slug: g3math-w25-q02
      type: multi_select
      topic_code: "3.G.A.1"
      source: "IM K–5 Math Grade 3, Unit 7, Section A"
      points: 2
      partial_credit: true
      stimulus: |
        Use the six shapes. Side lengths are in centimeters, and a small square in a corner marks a right angle.
      prompt: |
        Which shapes are rhombuses? Select all that apply.
      options:
        - "Shape 1"
        - "Shape 2"
        - "Shape 3"
        - "Shape 5"
        - "Shape 6"
      option_explanations:
        - |
          Yes. Shape 1 has 4 sides that are all 4 cm. A square has 4 equal sides, so it is a rhombus too.
        - |
          No. Shape 2 has sides of 6 cm and 3 cm, so its 4 sides are not all the same length.
        - |
          Yes. Shape 3 has 4 sides that are all 5 cm, so it is a rhombus even though it has no right angles.
        - |
          No. Shape 5 has 4 sides, but they are 7, 6, 2 and 4 cm long, which are all different.
        - |
          No. Shape 6 has 5 sides, so it is a pentagon, not a quadrilateral, and a rhombus must have 4 sides.
      answer: [0, 2]

    - slug: g3math-w25-q03
      type: multiple_choice
      topic_code: "3.G.A.1"
      source: "IM K–5 Math Grade 3, Unit 7, Section A"
      points: 1
      stimulus: |
        Use the six shapes. Side lengths are in centimeters, and a small square in a corner marks a right angle.
      prompt: |
        Which shape is a rectangle and a rhombus at the same time?
      options:
        - "Shape 1"
        - "Shape 2"
        - "Shape 3"
        - "Shape 5"
      option_explanations:
        - |
          Correct. Shape 1 has 4 right angles, so it is a rectangle, and 4 equal sides, so it is a rhombus. It is a square.
        - |
          Shape 2 has 4 right angles, so it is a rectangle, but its sides are 6 cm and 3 cm, so it is not a rhombus.
        - |
          Shape 3 has 4 equal sides, so it is a rhombus, but it has no right angles, so it is not a rectangle.
        - |
          Shape 5 has no right angles and no equal sides, so it is neither a rectangle nor a rhombus.
      answer: 0

    - slug: g3math-w25-q04
      type: multiple_choice
      topic_code: "3.G.A.1"
      source: "IM K–5 Math Grade 3, Unit 7, Section A"
      points: 1
      prompt: |
        Rosa drew a shape with 4 sides. Every side is 6 cm long, and none of its angles are right angles. What is the best name for her shape?
      options:
        - "Square"
        - "Rectangle"
        - "Rhombus"
        - "Hexagon"
      option_explanations:
        - |
          A square needs 4 equal sides and 4 right angles. Rosa's shape has no right angles, so it is not a square.
        - |
          A rectangle needs 4 right angles. Rosa's shape has none, so it cannot be a rectangle.
        - |
          Correct. A quadrilateral with 4 sides of the same length is a rhombus, with or without right angles.
        - |
          A hexagon has 6 sides. The 6 here is the length of each side in centimeters, not the number of sides.
      answer: 2

    - slug: g3math-w25-q05
      type: multiple_choice
      topic_code: "3.G.A.1"
      source: "IM K–5 Math Grade 3, Unit 7, Section A"
      points: 1
      prompt: |
        Which sentence is always true about a square?
      options:
        - "It is a rectangle, but it is never a rhombus."
        - "It is both a rectangle and a rhombus."
        - "It has 4 equal sides but no right angles."
        - "It is not a quadrilateral because it has its own name."
      option_explanations:
        - |
          A square has 4 equal sides, and that is exactly what a rhombus needs, so a square is always a rhombus.
        - |
          Correct. A square has 4 right angles (so it is a rectangle) and 4 equal sides (so it is a rhombus).
        - |
          A square always has 4 right angles. A shape with 4 equal sides and no right angles is a rhombus that is not a square.
        - |
          A square has exactly 4 sides, so it is a quadrilateral. A special name does not take it out of the bigger group.
      answer: 1

    - slug: g3math-w25-q06
      type: true_false
      topic_code: "3.G.A.1"
      source: "IM K–5 Math Grade 3, Unit 7, Section A"
      points: 1
      prompt: |
        True or false: every rectangle is a square.
      answer: false
      explanation: |
        False. A rectangle only needs 4 right angles. A rectangle that is 6 cm by 3 cm has 4 right angles, but its sides are not all equal, so it is not a square. (It works the other way: every square is a rectangle.)

    - slug: g3math-w25-q07
      type: fill_blank
      topic_code: "3.G.A.1"
      source: "IM K–5 Math Grade 3, Unit 7, Section A"
      points: 1
      prompt: |
        A polygon with exactly 4 sides is called a ____.
      answer: ["quadrilateral", "a quadrilateral", "quadrilaterals"]
      explanation: |
        Any polygon with exactly 4 sides is a quadrilateral. Rhombuses, rectangles and squares are all special kinds of quadrilaterals.

    - slug: g3math-w25-q08
      type: multiple_choice
      topic_code: "3.G.A.1"
      source: "IM K–5 Math Grade 3, Unit 7, Section A"
      points: 1
      stimulus: |
        Use the four quadrilaterals W, X, Y and Z. Side lengths are in centimeters, and a small square in a corner marks a right angle.
      figure: figures/w25-four-quadrilaterals.svg
      figure_alt: "Four shapes with 4 sides each. Shape W: every side 3 cm, with a right angle mark in all 4 corners. Shape X: sides 6 cm, 2 cm, 6 cm and 2 cm, with a right angle mark in all 4 corners. Shape Y: every side 4 cm, leaning over, with no right angles. Shape Z: bottom 7 cm, left side 4 cm, top 4 cm and a slanted right side of 5 cm, with right angle marks only in the 2 left corners."
      prompt: |
        Which shape is a rectangle but not a square?
      options:
        - "Shape W"
        - "Shape Y"
        - "Shape Z"
        - "Shape X"
      option_explanations:
        - |
          Shape W has 4 right angles, so it is a rectangle, but all of its sides are 3 cm, so it is also a square.
        - |
          Shape Y has 4 equal sides but no right angles. It is a rhombus, not a rectangle.
        - |
          Shape Z has only 2 right angles. A rectangle needs all 4 corners to be right angles.
        - |
          Correct. Shape X has 4 right angles, so it is a rectangle, and its sides are 6 cm and 2 cm, so it is not a square.
      answer: 3

    - slug: g3math-w25-q09
      type: multiple_choice
      topic_code: "3.G.A.1"
      source: "IM K–5 Math Grade 3, Unit 7, Section A"
      points: 1
      stimulus: |
        Use the four quadrilaterals W, X, Y and Z. Side lengths are in centimeters, and a small square in a corner marks a right angle.
      prompt: |
        Which shape is a quadrilateral, but not a rhombus, not a rectangle and not a square?
      options:
        - "Shape W"
        - "Shape X"
        - "Shape Z"
        - "Shape Y"
      option_explanations:
        - |
          Shape W has 4 equal sides and 4 right angles, so it is a square, a rectangle and a rhombus all at once.
        - |
          Shape X has 4 right angles, so it is a rectangle.
        - |
          Correct. Shape Z has 4 sides, so it is a quadrilateral, but its sides are not all equal and only 2 of its angles are right angles.
        - |
          Shape Y has 4 sides that are all 4 cm, so it is a rhombus.
      answer: 2

    - slug: g3math-w25-q10
      type: numeric
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section B"
      points: 1
      prompt: |
        Review: a rug is a rectangle 6 feet long and 4 feet wide. What is its area in square feet?
      answer: { value: 24, tolerance: 0 }
      explanation: |
        The area of a rectangle is length × width. 6 × 4 = 24, so the rug covers 24 square feet.

    - slug: g3math-w25-q11
      type: multiple_choice
      topic_code: "3.MD.A.1"
      source: "IM K–5 Math Grade 3, Unit 6, Section C"
      points: 1
      prompt: |
        Review: recess starts at 10:35 and lasts 25 minutes. What time does recess end?
      options:
        - "10:50"
        - "11:00"
        - "10:60"
        - "11:10"
      option_explanations:
        - |
          10:50 is only 15 minutes after 10:35. Count on 25 minutes: 10:45, 10:55, then 5 more makes 11:00.
        - |
          Correct. From 10:35, 25 more minutes reaches 60 minutes after 10:00, which is 11:00.
        - |
          35 + 25 is 60, but 60 minutes is a whole hour, so the clock shows 11:00, not 10:60.
        - |
          11:10 is 35 minutes after 10:35. That counts 10 minutes too many.
      answer: 1

    - slug: g3math-w25-q12
      type: numeric
      topic_code: "3.OA.A.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section B"
      points: 1
      prompt: |
        Review: Tomás cut out 7 squares for an art project. Each square has 4 sides. How many sides do the 7 squares have in all?
      answer: { value: 28, tolerance: 0 }
      explanation: |
        There are 7 equal groups of 4 sides. 7 × 4 = 28 sides in all.

    - slug: g3math-w25-q13
      type: short_answer
      topic_code: "3.G.A.1"
      source: "IM K–5 Math Grade 3, Unit 7, Section A"
      points: 2
      prompt: |
        Amara says, "A rhombus and a square are the same thing."

        (a) Draw or describe a rhombus that is not a square.
        (b) Explain why your shape is a rhombus and why it is not a square.
      answer: |
        (a) A shape with 4 sides that are all 5 cm long, leaning over like a pushed-over square, so its corners are not square corners.
        (b) It is a rhombus because it has 4 sides of the same length. It is not a square because it has no right angles, and a square needs 4 right angles. So Amara is not right: every square is a rhombus, but not every rhombus is a square.
      explanation: |
        Two points.

        (a) 1 pt: a drawing or description of a 4-sided shape with all sides equal and corners that are not right angles.

        (b) 1 pt: says it is a rhombus because the 4 sides are equal, and not a square because it does not have 4 right angles.
