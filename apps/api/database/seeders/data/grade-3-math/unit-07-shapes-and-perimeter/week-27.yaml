week: 27
unit: 7
title: "Same Perimeter, Different Area (and the Other Way Around)"
topics: ["3.MD.D.8", "3.MD.C.7"]
guide: guides/week-27.md
guide_description: |
  How rectangles with the same perimeter can cover different areas, how rectangles with the same area can have
  different perimeters, and how to list every rectangle with whole-number sides for a given perimeter or area.
flashcards_description: |
  19 cards on comparing perimeter and area, listing rectangles for a perimeter or an area, and which shapes give
  the most or least area or perimeter.

flashcards:
  - front: Same perimeter → does it mean same area?
    back: |
      No. A 7 by 1 rectangle and a 4 by 4 square both have a perimeter of 16 units, but their areas are 7 and 16 square units.
    topic_code: "3.MD.D.8"
  - front: Same area → does it mean same perimeter?
    back: |
      No. A 12 by 1 rectangle and a 4 by 3 rectangle both cover 12 square units, but their perimeters are 26 and 14 units.
    topic_code: "3.MD.D.8"
  - front: Rectangle area → how to find it
    back: |
      Multiply the length by the width. 6 by 2: 6 × 2 = 12 square units.
    topic_code: "3.MD.C.7"
  - front: Rectangle perimeter → half of it is
    back: |
      One length plus one width. A perimeter of 12 means length + width = 6.
    topic_code: "3.MD.D.8"
  - front: Rectangles with perimeter 12 and whole-number sides → the list
    back: |
      1 by 5 (area 5), 2 by 4 (area 8), 3 by 3 (area 9). Each pair of sides adds to 6.
    topic_code: "3.MD.D.8"
  - front: Rectangles with area 12 and whole-number sides → the list
    back: |
      1 by 12 (perimeter 26), 2 by 6 (perimeter 16), 3 by 4 (perimeter 14). Each pair of sides multiplies to 12.
    topic_code: "3.MD.D.8"
  - front: Listing rectangles for a perimeter → a system
    back: |
      Halve the perimeter, then start the width at 1 and count up: 1 and the rest, 2 and the rest, and so on, until the sides repeat.
    topic_code: "3.MD.D.8"
  - front: Listing rectangles for an area → a system
    back: |
      Find the factor pairs of the area. For 18: 1 × 18, 2 × 9, 3 × 6. Each pair is a rectangle.
    topic_code: "3.MD.C.7"
  - front: Same perimeter → which rectangle has the most area?
    back: |
      The one closest to a square. With perimeter 20, the 5 by 5 square covers 25 square units, more than 6 by 4 (24) or 9 by 1 (9).
    topic_code: "3.MD.D.8"
  - front: Same perimeter → which rectangle has the least area?
    back: |
      The longest, skinniest one. With perimeter 20, the 9 by 1 rectangle covers only 9 square units.
    topic_code: "3.MD.D.8"
  - front: Same area → which rectangle has the greatest perimeter?
    back: |
      The longest, skinniest one. With area 16, the 16 by 1 rectangle has a perimeter of 34 units.
    topic_code: "3.MD.D.8"
  - front: Same area → which rectangle has the least perimeter?
    back: |
      The one closest to a square. With area 16, the 4 by 4 square has a perimeter of only 16 units.
    topic_code: "3.MD.D.8"
  - front: A 4 by 2 rectangle turned on its side → does anything change?
    back: |
      No. A 2 by 4 rectangle is the same rectangle turned. It still has area 8 and perimeter 12.
    topic_code: "3.MD.D.8"
  - front: Perimeter units vs area units
    back: |
      Perimeter is in units (cm, m, ft). Area is in square units (square cm, square m, square ft).
    topic_code: "3.MD.D.8"
  - front: Fence vs grass → which one is perimeter?
    back: |
      The fence goes around the edge, so it is perimeter. The grass covers the inside, so it is area.
    topic_code: "3.MD.D.8"
  - front: Rectangle 5 by 3 → area and perimeter
    back: |
      Area 5 × 3 = 15 square units. Perimeter 5 + 3 + 5 + 3 = 16 units.
    topic_code: "3.MD.D.8"
  - front: Rectangle area 24, one side 6 → the other side
    back: |
      4, because 6 × 4 = 24. Think: 6 times what is 24?
    topic_code: "3.MD.C.7"
  - front: Square with side 6 → area vs perimeter
    back: |
      Area 6 × 6 = 36 square units. Perimeter 4 × 6 = 24 units.
    topic_code: "3.MD.D.8"
  - front: Comparing two rectangles → what to check
    back: |
      Find both the area (multiply) and the perimeter (add the sides) of each one. One can be bigger while the other is the same or smaller.
    topic_code: "3.MD.D.8"

quiz:
  description: |
    13 questions · about 25 minutes · rectangles with the same perimeter and different areas, rectangles with the
    same area and different perimeters, listing rectangles and choosing the one with the most room, plus review
    of area words, unknown factors and fractions of a shape. Multiple choice, select-all, true/false and number
    answers are graded at once; the fill-in word is matched automatically; the short answer is checked by your
    teacher.
  questions:
    - slug: g3math-w27-q01
      type: numeric
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section C"
      points: 1
      stimulus: |
        Use the three rectangles made of small squares. Each small square is 1 square unit, and each of its sides is 1 unit long.
      figure: figures/w27-same-perimeter.svg
      figure_alt: "Three rectangles made of small squares. Rectangle 1 is 7 squares long and 1 square tall. Rectangle 2 is 6 squares long and 2 squares tall. Rectangle 3 is 4 squares long and 4 squares tall. A note says each small square is 1 square unit."
      prompt: |
        What is the perimeter of Rectangle 1, in units?
      answer: { value: 16, tolerance: 0 }
      explanation: |
        Rectangle 1 is 7 units long and 1 unit tall: 7 + 1 + 7 + 1 = 16 units. (Rectangles 2 and 3 also have perimeters of 16 units: 6 + 2 + 6 + 2 and 4 + 4 + 4 + 4.)

    - slug: g3math-w27-q02
      type: multiple_choice
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section C"
      points: 1
      stimulus: |
        Use the three rectangles made of small squares. Each small square is 1 square unit, and each of its sides is 1 unit long.
      prompt: |
        All three rectangles have a perimeter of 16 units. Which one has the greatest area?
      options:
        - "Rectangle 1"
        - "Rectangle 2"
        - "Rectangle 3"
        - "They all have the same area."
      option_explanations:
        - |
          Rectangle 1 is the longest, but it is only 1 square tall: 7 × 1 = 7 square units, the least of the three.
        - |
          Rectangle 2 covers 6 × 2 = 12 square units. Rectangle 3 covers more.
        - |
          Correct. Rectangle 3 covers 4 × 4 = 16 square units, more than 12 or 7. The shape closest to a square has the most area.
        - |
          The same perimeter does not mean the same area. Count the squares: 7, 12 and 16.
      answer: 2

    - slug: g3math-w27-q03
      type: multiple_choice
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 7, Section C"
      points: 1
      stimulus: |
        Use the three rectangles made of small squares. Each small square is 1 square unit, and each of its sides is 1 unit long.
      prompt: |
        How many more square units does Rectangle 3 cover than Rectangle 1?
      options:
        - "9 square units"
        - "0 square units"
        - "16 square units"
        - "3 square units"
      option_explanations:
        - |
          Correct. Rectangle 3 covers 16 square units and Rectangle 1 covers 7. 16 − 7 = 9.
        - |
          The rectangles have the same perimeter, but not the same area, so the difference is not 0.
        - |
          16 is the area of Rectangle 3 alone. Subtract Rectangle 1's 7 square units to compare.
        - |
          3 is how much taller Rectangle 3 is than Rectangle 1 (4 − 1). The question asks about squares covered.
      answer: 0

    - slug: g3math-w27-q04
      type: multiple_choice
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section C"
      points: 1
      stimulus: |
        Use the second set of three rectangles. Each small square is 1 square unit, and each of its sides is 1 unit long.
      figure: figures/w27-same-area.svg
      figure_alt: "Three rectangles made of small squares. Rectangle 1 is 12 squares long and 1 square tall. Rectangle 2 is 6 squares long and 2 squares tall. Rectangle 3 is 4 squares long and 3 squares tall. A note says each small square is 1 square unit."
      prompt: |
        All three rectangles cover 12 square units. Which one has the greatest perimeter?
      options:
        - "Rectangle 2"
        - "Rectangle 3"
        - "They all have the same perimeter."
        - "Rectangle 1"
      option_explanations:
        - |
          Rectangle 2 has a perimeter of 6 + 2 + 6 + 2 = 16 units. Rectangle 1 goes around farther.
        - |
          Rectangle 3 has the least perimeter: 4 + 3 + 4 + 3 = 14 units. It is the closest to a square.
        - |
          The same area does not mean the same perimeter. Add the sides: 26, 16 and 14 units.
        - |
          Correct. Rectangle 1 is long and thin: 12 + 1 + 12 + 1 = 26 units, the greatest perimeter.
      answer: 3

    - slug: g3math-w27-q05
      type: numeric
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section C"
      points: 1
      stimulus: |
        Use the second set of three rectangles. Each small square is 1 square unit, and each of its sides is 1 unit long.
      prompt: |
        What is the perimeter of Rectangle 3, in units?
      answer: { value: 14, tolerance: 0 }
      explanation: |
        Rectangle 3 is 4 units long and 3 units tall: 4 + 3 + 4 + 3 = 14 units.

    - slug: g3math-w27-q06
      type: multiple_choice
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section C"
      points: 1
      prompt: |
        Kai has exactly 20 meters of fence to make a rectangle pen for his rabbit. The sides are whole meters. Which pen gives the rabbit the most room?
      options:
        - "9 m by 1 m"
        - "5 m by 5 m"
        - "6 m by 4 m"
        - "10 m by 10 m"
      option_explanations:
        - |
          9 + 1 + 9 + 1 = 20 m of fence, but the pen covers only 9 × 1 = 9 square meters. It is long and thin.
        - |
          Correct. 5 + 5 + 5 + 5 = 20 m of fence, and the pen covers 5 × 5 = 25 square meters, the most room.
        - |
          6 + 4 + 6 + 4 = 20 m of fence and 6 × 4 = 24 square meters. That is close, but 5 by 5 gives 25.
        - |
          A 10 m by 10 m pen needs 10 + 10 + 10 + 10 = 40 m of fence. Kai has only 20 m.
      answer: 1

    - slug: g3math-w27-q07
      type: multi_select
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section C"
      points: 2
      partial_credit: true
      prompt: |
        A poster is a rectangle 6 cm by 4 cm, so its area is 24 square cm and its perimeter is 20 cm. Which rectangles have the same area as the poster but a different perimeter? Select all that apply.
      options:
        - "8 cm by 3 cm"
        - "12 cm by 2 cm"
        - "4 cm by 6 cm"
        - "7 cm by 3 cm"
        - "24 cm by 1 cm"
      option_explanations:
        - |
          Yes. 8 × 3 = 24 square cm, and 8 + 3 + 8 + 3 = 22 cm, which is different from 20 cm.
        - |
          Yes. 12 × 2 = 24 square cm, and 12 + 2 + 12 + 2 = 28 cm.
        - |
          No. A 4 by 6 rectangle is the poster turned on its side: area 24 square cm and the same perimeter, 20 cm.
        - |
          No. 7 + 3 + 7 + 3 = 20 cm is the same perimeter, and 7 × 3 = 21 square cm is a different area. That is the reverse.
        - |
          Yes. 24 × 1 = 24 square cm, and 24 + 1 + 24 + 1 = 50 cm.
      answer: [0, 1, 4]

    - slug: g3math-w27-q08
      type: true_false
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section C"
      points: 1
      prompt: |
        True or false: if two rectangles have the same perimeter, they must have the same area.
      answer: false
      explanation: |
        False. A 5 by 1 rectangle and a 3 by 3 square both have a perimeter of 12 units, but the first covers 5 square units and the square covers 9.

    - slug: g3math-w27-q09
      type: fill_blank
      topic_code: "3.MD.C.5"
      source: "IM K–5 Math Grade 3, Unit 2, Section A"
      points: 1
      prompt: |
        Review: perimeter is the length around a shape. The number of square units that cover the shape is its ____.
      answer: ["area", "the area", "areas"]
      explanation: |
        Area tells how many unit squares cover a shape. It is measured in square units, while perimeter is measured in units of length.

    - slug: g3math-w27-q10
      type: multiple_choice
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section C"
      points: 1
      prompt: |
        A rectangle has whole-number sides and a perimeter of 12 units. Which one has the least area?
      options:
        - "1 unit by 5 units"
        - "3 units by 3 units"
        - "2 units by 4 units"
        - "6 units by 6 units"
      option_explanations:
        - |
          Correct. 1 + 5 + 1 + 5 = 12 units around, and it covers only 1 × 5 = 5 square units, the least.
        - |
          The 3 by 3 square covers 9 square units. It has the most area of these rectangles, not the least.
        - |
          The 2 by 4 rectangle covers 8 square units, which is more than the 1 by 5 rectangle's 5.
        - |
          A 6 by 6 square has a perimeter of 24 units, not 12. Half of 12 is 6, which is length + width, not one side.
      answer: 0

    - slug: g3math-w27-q11
      type: numeric
      topic_code: "3.OA.A.4"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      prompt: |
        Review: a rectangle-shaped rug covers 42 square feet. One side is 6 feet long. How many feet long is the other side?
      answer: { value: 7, tolerance: 0 }
      explanation: |
        Area = length × width, so 6 × ? = 42. Since 6 × 7 = 42, the other side is 7 feet.

    - slug: g3math-w27-q12
      type: multiple_choice
      topic_code: "3.G.A.2"
      source: "IM K–5 Math Grade 3, Unit 5, Section A"
      points: 1
      prompt: |
        Review: a rectangle 4 units by 2 units is cut into its 8 unit squares. What fraction of the rectangle's area is one unit square?
      options:
        - "1/4"
        - "1/2"
        - "8/1"
        - "1/8"
      option_explanations:
        - |
          1/4 would mean 4 equal parts. 4 is the length of the rectangle, but it is cut into 8 equal squares.
        - |
          1/2 would mean the rectangle was cut into 2 equal parts. It was cut into 8.
        - |
          8/1 means 8 wholes. One small square is a part of the rectangle, not 8 whole rectangles.
        - |
          Correct. The rectangle is cut into 8 equal squares, so each square is 1/8 of its area.
      answer: 3

    - slug: g3math-w27-q13
      type: short_answer
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section C"
      points: 2
      prompt: |
        Priya is making a rectangle out of 16 square tiles, using every tile.

        (a) Draw or list two different rectangles she could make. Give the side lengths of each.
        (b) Find the perimeter of each rectangle and say which perimeter is greater.
      answer: |
        (a) Any two of: 1 by 16, 2 by 8, 4 by 4 (each covers 16 square units).
        (b) 1 by 16: 1 + 16 + 1 + 16 = 34 units. 2 by 8: 2 + 8 + 2 + 8 = 20 units. 4 by 4: 4 + 4 + 4 + 4 = 16 units. For example, the 2 by 8 rectangle has a greater perimeter (20) than the 4 by 4 square (16), even though both use 16 tiles.
      explanation: |
        Two points.

        (a) 1 pt: two different rectangles whose sides multiply to 16 (1 by 16, 2 by 8 or 4 by 4). A rectangle and the same one turned (2 by 8 and 8 by 2) count as one.

        (b) 1 pt: correct perimeters for both rectangles and the greater one named.
