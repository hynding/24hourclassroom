week: 28
unit: 7
title: "Designing With Area and Perimeter"
topics: ["3.MD.D.8", "3.G.A.1"]
guide: guides/week-28.md
guide_description: |
  How to use perimeter and area together to plan real things: finding hidden sides on a plan with square
  corners, splitting a plan into rectangles to find its area, choosing whether a job needs perimeter or area,
  and designing a shape that fits a rule.
flashcards_description: |
  18 cards on hidden sides, splitting shapes into rectangles, which jobs need perimeter and which need area,
  designing to a rule, and shape names in designs.

flashcards:
  - front: Plan with square corners → finding a hidden side
    back: |
      The short sides on one side add up to the long side across from it. Bottom 10 m, top part 6 m: the hidden part is 10 − 6 = 4 m.
    topic_code: "3.MD.D.8"
  - front: Plan with a corner cut out → its perimeter
    back: |
      Find every hidden side first, then add all the sides, going all the way around once.
    topic_code: "3.MD.D.8"
  - front: Plan with a corner cut out → its area
    back: |
      Split it into two rectangles, find each area by multiplying, then add the two areas.
    topic_code: "3.MD.C.7"
  - front: Area of an L-shape → a common mistake
    back: |
      Multiplying the two longest sides. That finds the area of the whole box around it, including the part that was cut out.
    topic_code: "3.MD.C.7"
  - front: Ribbon around a bulletin board → perimeter or area?
    back: |
      Perimeter, because the ribbon goes around the edge.
    topic_code: "3.MD.D.8"
  - front: Tiles to cover a floor → perimeter or area?
    back: |
      Area, because the tiles cover the inside.
    topic_code: "3.MD.D.8"
  - front: Paint for a wall → perimeter or area?
    back: |
      Area, because the paint covers the whole flat surface.
    topic_code: "3.MD.D.8"
  - front: Fence for a yard → perimeter or area?
    back: |
      Perimeter, because the fence goes around the outside.
    topic_code: "3.MD.D.8"
  - front: Design rule "perimeter 20 m" → how to start
    back: |
      Halve it: length + width = 10. Then try 1 and 9, 2 and 8, 3 and 7, 4 and 6, 5 and 5.
    topic_code: "3.MD.D.8"
  - front: Design rule "area 30 square feet, least border" → best choice
    back: |
      The 5 by 6 rectangle: its perimeter is 22 ft, less than 3 by 10 (26 ft), 2 by 15 (34 ft) or 1 by 30 (62 ft).
    topic_code: "3.MD.D.8"
  - front: Rhombus with 4 cm sides → perimeter
    back: |
      16 cm. A rhombus has 4 equal sides, so 4 × 4 = 16.
    topic_code: "3.MD.D.8"
  - front: Rectangle frame from a 24 inch strip, one side 8 in → the other sides
    back: |
      8 in, 4 in and 4 in. Two 8 in sides use 16 in; the 8 in left over makes two 4 in sides.
    topic_code: "3.MD.D.8"
  - front: Square garden with 32 m of fence → each side
    back: |
      8 m, because 32 ÷ 4 = 8.
    topic_code: "3.MD.D.8"
  - front: Design with 4 equal sides and 4 right angles → its name
    back: |
      A square, which is also a rectangle and a rhombus.
    topic_code: "3.G.A.1"
  - front: Design with 4 right angles and sides 9 m and 2 m → its name
    back: |
      A rectangle. It is not a square, because its sides are not all equal.
    topic_code: "3.G.A.1"
  - front: Checking a design → two questions to ask
    back: |
      Does it follow the rule (the right perimeter or area)? Is it a sensible shape for the job (not 1 m wide for a garden path to sit in)?
    topic_code: "3.MD.D.8"
  - front: Doubling every side of a rectangle → what happens to the perimeter
    back: |
      It doubles too. A 3 by 2 rectangle has perimeter 10; a 6 by 4 rectangle has perimeter 20.
    topic_code: "3.MD.D.8"
  - front: Two designs, same area → which needs less border?
    back: |
      The one closer to a square. Long, thin designs need more border for the same space inside.
    topic_code: "3.MD.D.8"

quiz:
  description: |
    13 questions · about 25 minutes · finding hidden sides, perimeter and area on a garden plan, comparing flower
    beds, deciding whether a job needs perimeter or area, and designing rectangles to a rule, plus review of shape
    names, two-step problems and rounding. Multiple choice, select-all, true/false and number answers are graded
    at once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w28-q01
      type: numeric
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section D"
      points: 1
      stimulus: |
        Use the plan of the school garden. All of its corners are square corners, and lengths are in meters.
      figure: figures/w28-garden-plan.svg
      figure_alt: "Plan of a garden shaped like a big rectangle with its top right corner cut out. The bottom side is 10 m, the left side is 8 m and the top side is 6 m. The right side, going up from the bottom right corner, is 3 m. From the top of that side, a side labeled a goes left to the inside corner, and a side labeled b goes up from that corner to the right end of the top side. Every corner is a square corner."
      prompt: |
        How many meters long is the side labeled a?
      answer: { value: 4, tolerance: 0 }
      explanation: |
        The bottom side is 10 m. Across the top of the plan, the 6 m side and side a together make the same width, so a = 10 − 6 = 4 m.

    - slug: g3math-w28-q02
      type: numeric
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section D"
      points: 1
      stimulus: |
        Use the plan of the school garden. All of its corners are square corners, and lengths are in meters.
      prompt: |
        What is the perimeter of the garden, in meters?
      answer: { value: 36, tolerance: 0 }
      explanation: |
        First find the hidden sides. a = 10 − 6 = 4 m. On the right, 3 m and side b make the 8 m height, so b = 8 − 3 = 5 m. Then add all six sides: 10 + 3 + 4 + 5 + 6 + 8 = 36 m.

    - slug: g3math-w28-q03
      type: multiple_choice
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section C"
      points: 1
      stimulus: |
        Use the plan of the school garden. All of its corners are square corners, and lengths are in meters.
      prompt: |
        What is the area of the garden?
      options:
        - "36 square meters"
        - "60 square meters"
        - "80 square meters"
        - "48 square meters"
      option_explanations:
        - |
          36 is the perimeter in meters, the distance around. Area counts the square meters inside.
        - |
          Correct. Split it into a 6 by 8 rectangle (48) and a 4 by 3 rectangle (12). 48 + 12 = 60 square meters.
        - |
          80 is 10 × 8, the big rectangle before the top right corner was cut out. Take that part away or split the shape.
        - |
          48 is only the 6 by 8 part. The 4 by 3 part on the bottom right adds 12 more square meters.
      answer: 1

    - slug: g3math-w28-q04
      type: multiple_choice
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section D"
      points: 1
      stimulus: |
        Use the picture of the three flower beds. Lengths are in feet, and a small square in a corner marks a right angle.
      figure: figures/w28-flower-beds.svg
      figure_alt: "Three flower beds. Bed 1 has 4 sides, each labeled 6 ft, and leans over with no right angles. Bed 2 has sides labeled 8 ft, 4 ft, 8 ft and 4 ft, with a right angle mark in all 4 corners. Bed 3 has 4 sides, each labeled 5 ft, with a right angle mark in all 4 corners."
      prompt: |
        Each bed gets a wooden edge all the way around. Which two beds need the same length of edging?
      options:
        - "Bed 2 and Bed 3"
        - "Bed 1 and Bed 3"
        - "Bed 1 and Bed 2"
        - "No two beds need the same length."
      option_explanations:
        - |
          Bed 2 needs 8 + 4 + 8 + 4 = 24 ft, but Bed 3 needs 4 × 5 = 20 ft. They are not the same.
        - |
          Bed 1 needs 4 × 6 = 24 ft and Bed 3 needs 4 × 5 = 20 ft, so they are different.
        - |
          Correct. Bed 1 is 6 + 6 + 6 + 6 = 24 ft around and Bed 2 is 8 + 4 + 8 + 4 = 24 ft around.
        - |
          Find all three perimeters: 24 ft, 24 ft and 20 ft. Two of them match.
      answer: 2

    - slug: g3math-w28-q05
      type: multi_select
      topic_code: "3.G.A.1"
      source: "IM K–5 Math Grade 3, Unit 7, Section A"
      points: 2
      partial_credit: true
      stimulus: |
        Use the picture of the three flower beds. Lengths are in feet, and a small square in a corner marks a right angle.
      prompt: |
        Which sentences are true about Bed 1? Select all that apply.
      options:
        - "It is a rhombus."
        - "It is a quadrilateral."
        - "It is a square."
        - "Its perimeter is 24 feet."
        - "It is a rectangle."
      option_explanations:
        - |
          True. Bed 1 has 4 sides that are all 6 ft long, so it is a rhombus.
        - |
          True. Bed 1 has exactly 4 straight sides, so it is a quadrilateral.
        - |
          False. A square needs 4 right angles, and Bed 1 leans over with no right angles.
        - |
          True. Bed 1 has four 6-foot sides, and 6 + 6 + 6 + 6 = 24 feet.
        - |
          False. A rectangle needs 4 right angles, and Bed 1 has none.
      answer: [0, 1, 3]

    - slug: g3math-w28-q06
      type: multiple_choice
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section D"
      points: 1
      prompt: |
        Which job needs you to find a perimeter, not an area?
      options:
        - "Putting a ribbon border around a bulletin board"
        - "Covering a table top with square tiles"
        - "Painting one wall of the art room"
        - "Laying carpet on the reading-corner floor"
      option_explanations:
        - |
          Correct. A border goes around the edge, so you need the distance all the way around: the perimeter.
        - |
          Tiles cover the inside of the table top, so this job needs the area.
        - |
          Paint covers the whole flat wall, so this job needs the area.
        - |
          Carpet covers the floor inside the corner, so this job needs the area.
      answer: 0

    - slug: g3math-w28-q07
      type: multiple_choice
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section D"
      points: 1
      prompt: |
        Mr. Haddad wants a rectangle rug that covers 36 square feet, with whole-foot sides. Fringe will go all the way around it. Which rug needs the least fringe?
      options:
        - "4 ft by 9 ft"
        - "3 ft by 12 ft"
        - "2 ft by 18 ft"
        - "6 ft by 6 ft"
      option_explanations:
        - |
          4 × 9 = 36 square feet, but it needs 4 + 9 + 4 + 9 = 26 ft of fringe. The square needs less.
        - |
          3 × 12 = 36 square feet, but it needs 3 + 12 + 3 + 12 = 30 ft of fringe.
        - |
          2 × 18 = 36 square feet, but this long, thin rug needs the most fringe: 2 + 18 + 2 + 18 = 40 ft.
        - |
          Correct. 6 × 6 = 36 square feet, and it needs only 6 + 6 + 6 + 6 = 24 ft of fringe.
      answer: 3

    - slug: g3math-w28-q08
      type: true_false
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section D"
      points: 1
      prompt: |
        True or false: every rhombus with sides of 4 cm has a perimeter of 16 cm, even if it leans over.
      answer: true
      explanation: |
        True. A rhombus has 4 equal sides. Leaning over changes its angles, not its side lengths, so it is always 4 + 4 + 4 + 4 = 16 cm around.

    - slug: g3math-w28-q09
      type: fill_blank
      topic_code: "3.G.A.1"
      source: "IM K–5 Math Grade 3, Unit 7, Section A"
      points: 1
      prompt: |
        Every quadrilateral with 4 right angles is called a ____, even when its sides are not all the same length.
      answer: ["rectangle", "a rectangle", "rectangles"]
      explanation: |
        A rectangle is a quadrilateral with 4 right angles. Its sides do not have to be equal. A square is a special rectangle whose sides are all equal.

    - slug: g3math-w28-q10
      type: multiple_choice
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section D"
      points: 1
      prompt: |
        Leo uses a wooden strip exactly 24 inches long to make a rectangle picture frame. One side is 8 inches. How long are the other three sides?
      options:
        - "8 in, 8 in and 8 in"
        - "16 in, 16 in and 8 in"
        - "8 in, 4 in and 4 in"
        - "3 in, 3 in and 8 in"
      option_explanations:
        - |
          Four 8-inch sides make a square, which is a rectangle, but 8 × 4 = 32 inches. That is more than the 24-inch strip.
        - |
          24 − 8 = 16 is all that is left after one side, and it must be shared by three sides, not used twice.
        - |
          Correct. The side across from the 8 in side is also 8 in. 24 − 16 = 8 in is left, so each of the other two sides is 4 in.
        - |
          3 comes from 24 ÷ 8. The other sides must add with 8 to make 24 all the way around: 8 + 4 + 8 + 4 = 24.
      answer: 2

    - slug: g3math-w28-q11
      type: numeric
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 3, Section D"
      points: 1
      prompt: |
        Review: the art club makes 4 square tiles. Each side of a tile is 5 inches. They glue ribbon all the way around the edge of every tile. How many inches of ribbon do they use in all?
      answer: { value: 80, tolerance: 0 }
      explanation: |
        Step 1: one tile needs 4 × 5 = 20 inches of ribbon. Step 2: 4 tiles need 4 × 20 = 80 inches.

    - slug: g3math-w28-q12
      type: multiple_choice
      topic_code: "3.NBT.A.1"
      source: "IM K–5 Math Grade 3, Unit 3, Section C"
      points: 1
      prompt: |
        Review: the fence around the school field is 487 meters long. About how long is it, rounded to the nearest hundred meters?
      options:
        - "500 meters"
        - "400 meters"
        - "490 meters"
        - "480 meters"
      option_explanations:
        - |
          Correct. 487 is between 400 and 500, and the tens digit is 8, so it is closer to 500.
        - |
          400 is the hundred below 487, but 487 is much closer to 500 (13 away) than to 400 (87 away).
        - |
          490 is 487 rounded to the nearest ten. The question asks for the nearest hundred.
        - |
          480 drops the ones, but that is not rounding to the nearest hundred, and 487 is nearer 490 than 480 anyway.
      answer: 0

    - slug: g3math-w28-q13
      type: short_answer
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section D"
      points: 2
      prompt: |
        Design a rectangle vegetable garden with whole-meter sides and a perimeter of exactly 20 meters.

        (a) Give its two side lengths and its area.
        (b) Show that its perimeter is 20 meters.
      answer: |
        (a) Any rectangle whose length and width add to 10, for example 6 m by 4 m, with an area of 6 × 4 = 24 square meters. (Others: 1 by 9, area 9; 2 by 8, area 16; 3 by 7, area 21; 5 by 5, area 25.)
        (b) 6 + 4 + 6 + 4 = 20 meters.
      explanation: |
        Two points.

        (a) 1 pt: two whole-number side lengths that add to 10, with the correct area for that rectangle.

        (b) 1 pt: adds all four sides (or doubles length + width) to show 20 meters.
