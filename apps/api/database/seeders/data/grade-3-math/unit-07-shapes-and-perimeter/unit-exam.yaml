unit: 7
description: |
  20 questions · about 40 minutes · every standard of Unit 7: sorting shapes by their sides and angles,
  rhombuses, rectangles and squares, perimeter from side lengths, missing sides, perimeter and area of a floor
  plan, and rectangles with the same perimeter or the same area. Two stimulus sets share a picture across
  consecutive questions. Multiple choice, select-all, true/false and number answers are graded at once; the
  fill-in word is matched automatically; the short answer is checked by your teacher against the scoring notes.
questions:
  # ---- Stimulus set A: four quadrilaterals (3.G.A.1, 3.MD.D.8)
  - slug: g3math-u07-check-q01
    type: multiple_choice
    topic_code: "3.G.A.1"
    source: "IM K–5 Math Grade 3, Unit 7, Section A"
    points: 1
    stimulus: |
      Use the four shapes. Side lengths are in inches, and a small square in a corner marks a right angle.
    figure: figures/u07-quadrilaterals.svg
    figure_alt: "Four shapes with 4 sides each. Shape 1: every side 3 in, with a right angle mark in all 4 corners. Shape 2: sides 5 in, 2 in, 5 in and 2 in, with a right angle mark in all 4 corners. Shape 3: every side 5 in, leaning over, with no right angles. Shape 4: sides 7 in, 5 in, 2 in and 3 in, with no right angles."
    prompt: |
      Which shape is a rhombus but not a square?
    options:
      - "Shape 1"
      - "Shape 2"
      - "Shape 3"
      - "Shape 4"
    option_explanations:
      - |
        Shape 1 has 4 equal sides, so it is a rhombus, but it also has 4 right angles, so it is a square.
      - |
        Shape 2 has sides of 5 in and 2 in. Its sides are not all equal, so it is not a rhombus.
      - |
        Correct. Shape 3 has 4 sides of 5 in, so it is a rhombus, and it has no right angles, so it is not a square.
      - |
        Shape 4 has sides of 7, 5, 2 and 3 in. A rhombus needs all 4 sides to be the same length.
    answer: 2

  - slug: g3math-u07-check-q02
    type: multi_select
    topic_code: "3.G.A.1"
    source: "IM K–5 Math Grade 3, Unit 7, Section A"
    points: 2
    partial_credit: true
    stimulus: |
      Use the four shapes. Side lengths are in inches, and a small square in a corner marks a right angle.
    prompt: |
      Which shapes are rectangles? Select all that apply.
    options:
      - "Shape 1"
      - "Shape 2"
      - "Shape 3"
      - "Shape 4"
    option_explanations:
      - |
        Yes. Shape 1 has 4 right angles. It is a square, and every square is a rectangle.
      - |
        Yes. Shape 2 has 4 right angles, so it is a rectangle, even though its sides are not all equal.
      - |
        No. Shape 3 has equal sides but no right angles, so it is a rhombus, not a rectangle.
      - |
        No. Shape 4 has no right angles at all, so it cannot be a rectangle.
    answer: [0, 1]

  - slug: g3math-u07-check-q03
    type: numeric
    topic_code: "3.MD.D.8"
    source: "IM K–5 Math Grade 3, Unit 7, Section B"
    points: 1
    stimulus: |
      Use the four shapes. Side lengths are in inches, and a small square in a corner marks a right angle.
    prompt: |
      What is the perimeter of Shape 4, in inches?
    answer: { value: 17, tolerance: 0 }
    explanation: |
      Add all four sides of Shape 4: 7 + 5 + 2 + 3 = 17 inches.

  - slug: g3math-u07-check-q04
    type: multiple_choice
    topic_code: "3.G.A.1"
    source: "IM K–5 Math Grade 3, Unit 7, Section A"
    points: 1
    prompt: |
      Which sentence is always true?
    options:
      - "Every square is a rhombus."
      - "Every rhombus is a square."
      - "Every rectangle is a square."
      - "Every quadrilateral is a rectangle."
    option_explanations:
      - |
        Correct. A rhombus needs 4 equal sides, and every square has 4 equal sides.
      - |
        A rhombus can lean over with no right angles. Only a rhombus with 4 right angles is a square.
      - |
        A rectangle can be long and thin, like 5 in by 2 in. It has 4 right angles but not 4 equal sides.
      - |
        A quadrilateral only needs 4 sides. Many quadrilaterals, like a rhombus that leans over, have no right angles.
    answer: 0

  - slug: g3math-u07-check-q05
    type: true_false
    topic_code: "3.G.A.1"
    source: "IM K–5 Math Grade 3, Unit 7, Section A"
    points: 1
    prompt: |
      True or false: a closed shape with 4 straight sides of different lengths and no right angles is still a quadrilateral.
    answer: true
    explanation: |
      True. A quadrilateral is any polygon with exactly 4 sides. The sides do not have to be equal and the corners do not have to be right angles.

  - slug: g3math-u07-check-q06
    type: fill_blank
    topic_code: "3.G.A.1"
    source: "IM K–5 Math Grade 3, Unit 7, Section A"
    points: 1
    prompt: |
      Every quadrilateral with 4 sides of the same length is a ____. (Some of them are also squares.)
    answer: ["rhombus", "a rhombus", "rhombuses", "rhombi"]
    explanation: |
      A rhombus is a quadrilateral with 4 equal sides. A rhombus that also has 4 right angles is a square.

  - slug: g3math-u07-check-q07
    type: multiple_choice
    topic_code: "3.MD.D.8"
    source: "IM K–5 Math Grade 3, Unit 7, Section B"
    points: 1
    prompt: |
      A square table has sides that are 9 feet long. What is its perimeter?
    options:
      - "18 feet"
      - "36 feet"
      - "81 feet"
      - "13 feet"
    option_explanations:
      - |
        18 feet counts only two of the sides. A square has 4 sides of 9 feet.
      - |
        Correct. A square has 4 equal sides: 4 × 9 = 36 feet.
      - |
        81 is 9 × 9, the area in square feet, not the distance around the table.
      - |
        13 adds the side length and the number of sides (9 + 4). Multiply them instead: 4 × 9.
    answer: 1

  - slug: g3math-u07-check-q08
    type: numeric
    topic_code: "3.MD.D.8"
    source: "IM K–5 Math Grade 3, Unit 7, Section B"
    points: 1
    prompt: |
      A triangle-shaped flag has sides of 14 cm, 9 cm and 11 cm. What is its perimeter, in centimeters?
    answer: { value: 34, tolerance: 0 }
    explanation: |
      Add the three sides: 14 + 9 = 23, and 23 + 11 = 34 cm.

  # ---- Stimulus set B: a floor plan with square corners (3.MD.D.8, 3.MD.C.7)
  - slug: g3math-u07-check-q09
    type: numeric
    topic_code: "3.MD.D.8"
    source: "IM K–5 Math Grade 3, Unit 7, Section D"
    points: 1
    stimulus: |
      Use the floor plan of the art room. Every corner is a square corner, and lengths are in feet. Two short sides have no labels.
    figure: figures/u07-room-plan.svg
    figure_alt: "Floor plan of a room shaped like a big rectangle with its top right corner cut out. Every corner is a square corner. The bottom side is 9 ft, the left side is 7 ft, the top side is 5 ft, and the right side, going up from the bottom right corner, is 5 ft. The two short sides around the cut-out corner have no labels."
    prompt: |
      What is the perimeter of the room, in feet?
    answer: { value: 32, tolerance: 0 }
    explanation: |
      Find the hidden sides first. Across: 9 − 5 = 4 ft. Up: 7 − 5 = 2 ft. Then add all six sides: 9 + 5 + 4 + 2 + 5 + 7 = 32 ft.

  - slug: g3math-u07-check-q10
    type: multiple_choice
    topic_code: "3.MD.C.7"
    source: "IM K–5 Math Grade 3, Unit 7, Section D"
    points: 1
    stimulus: |
      Use the floor plan of the art room. Every corner is a square corner, and lengths are in feet. Two short sides have no labels.
    prompt: |
      What is the area of the room's floor?
    options:
      - "32 square feet"
      - "63 square feet"
      - "45 square feet"
      - "55 square feet"
    option_explanations:
      - |
        32 is the perimeter in feet. Area counts the square feet that cover the floor.
      - |
        63 is 9 × 7, the whole box around the room, including the corner that was cut out.
      - |
        45 is only the 9 by 5 bottom part. The 5 by 2 part on top adds 10 more square feet.
      - |
        Correct. Split it into a 9 by 5 rectangle (45) and a 5 by 2 rectangle (10). 45 + 10 = 55 square feet.
    answer: 3

  - slug: g3math-u07-check-q11
    type: multiple_choice
    topic_code: "3.MD.D.8"
    source: "IM K–5 Math Grade 3, Unit 7, Section B"
    points: 1
    prompt: |
      A pentagon has a perimeter of 40 cm. Four of its sides are 8 cm, 9 cm, 7 cm and 10 cm. How long is the fifth side?
    options:
      - "34 cm"
      - "8 cm"
      - "6 cm"
      - "74 cm"
    option_explanations:
      - |
        34 cm is the sum of the four known sides. Subtract it from the perimeter to find what is left.
      - |
        8 is 40 ÷ 5, which would only work if all five sides were equal. These sides are different.
      - |
        Correct. 8 + 9 + 7 + 10 = 34 cm, and 40 − 34 = 6 cm.
      - |
        74 adds the perimeter and the known sides. The known sides should be taken away from 40.
    answer: 2

  - slug: g3math-u07-check-q12
    type: numeric
    topic_code: "3.MD.D.8"
    source: "IM K–5 Math Grade 3, Unit 7, Section B"
    points: 1
    prompt: |
      A rectangle-shaped soccer goal box has a perimeter of 36 meters. One side is 11 meters long. How many meters long is the side next to it?
    answer: { value: 7, tolerance: 0 }
    explanation: |
      Two sides are 11 m: 11 + 11 = 22 m. 36 − 22 = 14 m is left for the other two sides, so each is 14 ÷ 2 = 7 m. Check: 11 + 7 + 11 + 7 = 36.

  - slug: g3math-u07-check-q13
    type: multiple_choice
    topic_code: "3.MD.D.8"
    source: "IM K–5 Math Grade 3, Unit 7, Section C"
    points: 1
    prompt: |
      Which two rectangles have the same perimeter but different areas?
    options:
      - "2 cm by 8 cm and 4 cm by 6 cm"
      - "3 cm by 4 cm and 2 cm by 6 cm"
      - "5 cm by 5 cm and 5 cm by 5 cm"
      - "1 cm by 9 cm and 3 cm by 4 cm"
    option_explanations:
      - |
        Correct. Both are 20 cm around (2 + 8 + 2 + 8 and 4 + 6 + 4 + 6), but their areas are 16 and 24 square cm.
      - |
        These have the same area (12 square cm) but different perimeters, 14 cm and 16 cm. That is the reverse.
      - |
        These are the same square twice, so their perimeters and their areas are both the same.
      - |
        These have different perimeters (20 cm and 14 cm) and different areas (9 and 12 square cm).
    answer: 0

  - slug: g3math-u07-check-q14
    type: multiple_choice
    topic_code: "3.MD.D.8"
    source: "IM K–5 Math Grade 3, Unit 7, Section C"
    points: 1
    prompt: |
      Each of these rectangles covers 20 square units. Which one has the greatest perimeter?
    options:
      - "2 units by 10 units"
      - "1 unit by 20 units"
      - "4 units by 5 units"
      - "They all have the same perimeter."
    option_explanations:
      - |
        2 + 10 + 2 + 10 = 24 units. The 1 by 20 rectangle is thinner and goes around farther.
      - |
        Correct. 1 + 20 + 1 + 20 = 42 units. The longest, thinnest rectangle has the greatest perimeter.
      - |
        4 + 5 + 4 + 5 = 18 units. This one is closest to a square, so it has the least perimeter.
      - |
        The same area does not mean the same perimeter: the perimeters are 24, 42 and 18 units.
    answer: 1

  - slug: g3math-u07-check-q15
    type: multi_select
    topic_code: "3.MD.D.8"
    source: "IM K–5 Math Grade 3, Unit 7, Section C"
    points: 2
    partial_credit: true
    prompt: |
      Which rectangles have a perimeter of 16 units and an area greater than 12 square units? Select all that apply.
    options:
      - "4 by 4"
      - "3 by 5"
      - "2 by 6"
      - "1 by 7"
      - "4 by 5"
    option_explanations:
      - |
        Yes. 4 + 4 + 4 + 4 = 16 units, and the area is 4 × 4 = 16 square units, which is greater than 12.
      - |
        Yes. 3 + 5 + 3 + 5 = 16 units, and the area is 3 × 5 = 15 square units, which is greater than 12.
      - |
        No. The perimeter is 16 units, but the area is 2 × 6 = 12 square units, which is not greater than 12.
      - |
        No. The perimeter is 16 units, but the area is only 1 × 7 = 7 square units.
      - |
        No. The area is 20 square units, but the perimeter is 4 + 5 + 4 + 5 = 18 units, not 16.
    answer: [0, 1]

  - slug: g3math-u07-check-q16
    type: multiple_choice
    topic_code: "3.MD.C.7"
    source: "IM K–5 Math Grade 3, Unit 7, Section C"
    points: 1
    prompt: |
      A classroom rug is a rectangle 8 feet long and 6 feet wide. How many square feet does it cover?
    options:
      - "28 square feet"
      - "14 square feet"
      - "42 square feet"
      - "48 square feet"
    option_explanations:
      - |
        28 is the perimeter (8 + 6 + 8 + 6) in feet. Area multiplies the length by the width.
      - |
        14 adds the length and the width. For area, multiply them: 8 × 6.
      - |
        42 is 6 × 7, one row of 6 too few. 8 rows of 6 is 48.
      - |
        Correct. The rug is 8 rows of 6 square feet: 8 × 6 = 48 square feet.
    answer: 3

  - slug: g3math-u07-check-q17
    type: multiple_choice
    topic_code: "3.MD.D.8"
    source: "IM K–5 Math Grade 3, Unit 7, Section D"
    points: 1
    prompt: |
      Which question is answered by finding a perimeter?
    options:
      - "How much lace goes around the edge of a pillow?"
      - "How many square tiles cover the kitchen floor?"
      - "How much paper covers a bulletin board?"
      - "How many square feet of grass are in the yard?"
    option_explanations:
      - |
        Correct. The lace goes around the edge of the pillow, so you need the distance all the way around.
      - |
        Tiles cover the inside of the floor, so this question is about area.
      - |
        Paper that covers a board fills the inside, so this question is about area.
      - |
        Square feet of grass measure the space inside the yard, so this question is about area.
    answer: 0

  - slug: g3math-u07-check-q18
    type: numeric
    topic_code: "3.MD.D.8"
    source: "IM K–5 Math Grade 3, Unit 7, Section B"
    points: 1
    prompt: |
      A square picture has a perimeter of 32 inches. How many inches long is one side?
    answer: { value: 8, tolerance: 0 }
    explanation: |
      A square has 4 equal sides, so 4 × ? = 32. Since 4 × 8 = 32, each side is 8 inches (32 ÷ 4 = 8).

  - slug: g3math-u07-check-q19
    type: short_answer
    topic_code: "3.MD.D.8"
    source: "IM K–5 Math Grade 3, Unit 7, Section C"
    points: 3
    prompt: |
      A class has exactly 18 meters of fence for a rectangle garden. The sides must be whole meters.

      (a) List every rectangle they could make, with the area of each.
      (b) Which rectangle gives the most space for plants? Explain how you know.
    answer: |
      (a) Length + width = 18 ÷ 2 = 9. The rectangles are 1 by 8 (area 8 square meters), 2 by 7 (14), 3 by 6 (18) and 4 by 5 (20).
      (b) The 4 m by 5 m rectangle. It uses all 18 m of fence (4 + 5 + 4 + 5 = 18) and covers 20 square meters, the greatest area in the list. It is the one closest to a square.
    explanation: |
      Three points.

      (a) 2 pts: all four rectangles with correct areas. 1 pt for at least two correct rectangles with their areas. A rectangle and the same one turned (4 by 5 and 5 by 4) count once.

      (b) 1 pt: names 4 by 5 and explains by comparing the areas (20 is the greatest).

  - slug: g3math-u07-check-q20
    type: multiple_choice
    topic_code: "3.G.A.1"
    source: "IM K–5 Math Grade 3, Unit 7, Section A"
    points: 1
    prompt: |
      Kim drew a quadrilateral with 4 right angles. Its sides are 6 cm, 3 cm, 6 cm and 3 cm. Which is the most exact name for it?
    options:
      - "Square"
      - "Rectangle"
      - "Rhombus"
      - "Both a rhombus and a square"
    option_explanations:
      - |
        A square needs 4 equal sides. Kim's sides are 6 cm and 3 cm, so it is not a square.
      - |
        Correct. It has 4 right angles, so it is a rectangle, and its sides are not all equal, so it is not a square.
      - |
        A rhombus needs 4 sides of the same length. Kim's shape has two 6 cm sides and two 3 cm sides.
      - |
        A rhombus and a square both need 4 equal sides, and Kim's shape does not have them.
    answer: 1
