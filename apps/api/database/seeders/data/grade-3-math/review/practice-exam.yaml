week: 33
description: |
  The End-of-Year Check for Grade 3 Math: 37 questions, about 75 minutes, covering all eight units in course
  order. Each unit's share follows its number of weeks: Unit 1 Introducing Multiplication (5 questions), Unit 2
  Area and Multiplication (4), Unit 3 Adding and Subtracting Within 1,000 (5), Unit 4 Relating Multiplication
  to Division (7), Unit 5 Fractions as Numbers (5), Unit 6 Measuring Length, Time, Liquid Volume, and Weight
  (5), Unit 7 Two-dimensional Shapes and Perimeter (4) and Unit 8 Putting It All Together (2). Five questions
  have a picture, and three pairs of questions share a picture or a situation. Multiple choice, true/false,
  fill-in and number answers are worth 1 point each; the select-all question is worth 2 points with partial
  credit; the two short answers are worth 3 points each and are checked by your teacher against the scoring
  notes. The check is out of 42 points. Take it in one sitting if you can, or in two halves (questions 1–19,
  then 20–37), and leave a few minutes to look back over your answers.
questions:
  # ======================================================================
  # Unit 1 (5): q01-q05 · Unit 2 (4): q06-q09 · Unit 3 (5): q10-q14
  # Unit 4 (7): q15-q21 · Unit 5 (5): q22-q26 · Unit 6 (5): q27-q31
  # Unit 7 (4): q32-q35 · Unit 8 (2): q36-q37
  # ======================================================================
  # ---- Unit 1 · Set A: favorite recess game bar graph (3.MD.B.3)
  - slug: g3math-final-q01
    type: multiple_choice
    topic_code: "3.MD.B.3"
    source: "IM K–5 Math Grade 3, Unit 1, Section A"
    points: 1
    stimulus: |
      Use the bar graph "Favorite Recess Game". The scale counts by 2s.
    figure: figures/review-recess-bar-graph.svg
    figure_alt: "A bar graph titled Favorite Recess Game. The side scale goes 0, 2, 4, 6, 8, 10, 12, 14, 16 and is labeled Number of students. Tag reaches 12, Jump rope reaches 8, Soccer reaches 14, and Hopscotch stops halfway between 4 and 6, at 5."
    prompt: |
      How many students chose soccer?
    options:
      - "7"
      - "14"
      - "12"
      - "16"
    option_explanations:
      - |
        7 is the number of grid lines the soccer bar climbs, but each line is worth 2 students, so it is 14.
      - |
        Correct. The top of the soccer bar lines up with 14 on the scale.
      - |
        12 is where the tag bar ends. The soccer bar is one line higher, at 14.
      - |
        16 is the top line of the scale. The soccer bar stops one line below it, at 14.
    answer: 1

  - slug: g3math-final-q02
    type: numeric
    topic_code: "3.MD.B.3"
    source: "IM K–5 Math Grade 3, Unit 1, Section A"
    points: 1
    stimulus: |
      Use the bar graph "Favorite Recess Game". The scale counts by 2s.
    prompt: |
      How many more students chose tag than chose hopscotch?
    answer: { value: 7, tolerance: 0 }
    explanation: |
      Tag is 12. Hopscotch stops halfway between 4 and 6, which is 5. 12 − 5 = 7 more students.

  - slug: g3math-final-q03
    type: multiple_choice
    topic_code: "3.OA.A.1"
    source: "IM K–5 Math Grade 3, Unit 1, Section B"
    points: 1
    prompt: |
      Tomás sets out 5 cups with 3 pencils in each cup. Which expression shows the total number of pencils?
    options:
      - "5 × 3"
      - "5 + 3"
      - "3 × 3"
      - "5 − 3"
    option_explanations:
      - |
        Correct. There are 5 equal groups of 3 pencils, and 5 groups of 3 is 5 × 3 = 15.
      - |
        5 + 3 adds the number of cups to the number in one cup. Equal groups mean multiply.
      - |
        3 × 3 would be 3 cups of 3. Tomás has 5 cups.
      - |
        5 − 3 subtracts. Nothing is taken away here; the pencils are in equal groups.
    answer: 0

  - slug: g3math-final-q04
    type: true_false
    topic_code: "3.OA.B.5"
    source: "IM K–5 Math Grade 3, Unit 1, Section C"
    points: 1
    prompt: |
      True or false: 4 × 7 and 7 × 4 have the same product.
    answer: true
    explanation: |
      True. Turning an array of 4 rows of 7 on its side makes 7 rows of 4. It is the same 28 dots, so the order of the factors does not change the product.

  - slug: g3math-final-q05
    type: multiple_choice
    topic_code: "3.OA.A.4"
    source: "IM K–5 Math Grade 3, Unit 1, Section C"
    points: 1
    prompt: |
      What number makes this true? 8 × ___ = 40
    options:
      - "32"
      - "48"
      - "5"
      - "6"
    option_explanations:
      - |
        32 is 40 − 8. The blank is how many 8s make 40, not what is left after one 8.
      - |
        48 is 40 + 8, which is 6 eights. The product must be 40.
      - |
        Correct. 8 × 5 = 40, so the missing factor is 5.
      - |
        8 × 6 = 48, which is one 8 too many. 8 × 5 = 40.
    answer: 2

  # ---- Unit 2 (3.MD.C.5, 3.MD.C.6, 3.MD.C.7, 3.OA.B.5)
  - slug: g3math-final-q06
    type: multiple_choice
    topic_code: "3.MD.C.7"
    source: "IM K–5 Math Grade 3, Unit 2, Section B"
    points: 1
    figure: figures/review-rectangle.svg
    figure_alt: "A rectangle. The long side at the bottom is labeled 7 cm and the short side on the left is labeled 4 cm."
    prompt: |
      What is the area of the rectangle?
    options:
      - "22 square centimeters"
      - "11 square centimeters"
      - "24 square centimeters"
      - "28 square centimeters"
    option_explanations:
      - |
        22 is the perimeter, 7 + 4 + 7 + 4. Area is the space inside, so multiply the side lengths.
      - |
        11 adds two sides, 7 + 4. Area is rows times columns: 7 × 4.
      - |
        24 is 6 × 4, one column short. The long side is 7 cm, so it is 7 × 4.
      - |
        Correct. Area = 7 × 4 = 28 square centimeters.
    answer: 3

  - slug: g3math-final-q07
    type: numeric
    topic_code: "3.MD.C.6"
    source: "IM K–5 Math Grade 3, Unit 2, Section A"
    points: 1
    prompt: |
      Ming covers a rug with unit squares, with no gaps and no overlaps. She makes 5 rows with 9 squares in each row. What is the area of the rug in square units?
    answer: { value: 45, tolerance: 0 }
    explanation: |
      5 rows of 9 unit squares is 5 × 9 = 45 unit squares, so the area is 45 square units.

  - slug: g3math-final-q08
    type: fill_blank
    topic_code: "3.MD.C.5"
    source: "IM K–5 Math Grade 3, Unit 2, Section A"
    points: 1
    prompt: |
      A square that is 1 unit long on each side, used to measure area, is called a ____.
    answer: ["unit square", "a unit square", "unit squares", "square unit", "a square unit"]
    explanation: |
      A unit square has sides 1 unit long. The number of unit squares that cover a shape with no gaps or overlaps is its area.

  - slug: g3math-final-q09
    type: multiple_choice
    topic_code: "3.OA.B.5"
    source: "IM K–5 Math Grade 3, Unit 2, Section C"
    points: 1
    prompt: |
      Which expression splits the 8 to find 8 × 7?
    options:
      - "(4 × 7) + (3 × 7)"
      - "(5 × 7) + (3 × 7)"
      - "(5 × 7) + (3 × 4)"
      - "(8 × 5) + (8 × 3)"
    option_explanations:
      - |
        4 + 3 is only 7, so this is 7 × 7. Splitting 8 needs two parts that add to 8, like 5 and 3.
      - |
        Correct. 8 rows of 7 split into 5 rows and 3 rows: 35 + 21 = 56.
      - |
        The second part should also have 7 in each row. 3 × 4 changes the other factor.
      - |
        This multiplies 8 by 5 and by 3, which is 8 × 8 = 64. The 8 should be split, and each part multiplied by 7.
    answer: 1

  # ---- Unit 3 (3.NBT.A.2, 3.NBT.A.1, 3.OA.D.8)
  - slug: g3math-final-q10
    type: multiple_choice
    topic_code: "3.NBT.A.2"
    source: "IM K–5 Math Grade 3, Unit 3, Section A"
    points: 1
    prompt: |
      What is 358 + 276?
    options:
      - "634"
      - "524"
      - "534"
      - "624"
    option_explanations:
      - |
        Correct. Ones 8 + 6 = 14 (regroup 1 ten), tens 5 + 7 + 1 = 13 (regroup 1 hundred), hundreds 3 + 2 + 1 = 6. The sum is 634.
      - |
        524 writes 4 ones and 2 tens but never adds the regrouped ten or hundred.
      - |
        534 adds the regrouped ten but forgets the hundred made by 13 tens, so the hundreds digit is one too small.
      - |
        624 forgets the ten made by 14 ones, so the tens digit is one too small.
    answer: 0

  - slug: g3math-final-q11
    type: numeric
    topic_code: "3.NBT.A.2"
    source: "IM K–5 Math Grade 3, Unit 3, Section B"
    points: 1
    prompt: |
      What is 602 − 157?
    answer: { value: 445, tolerance: 0 }
    explanation: |
      Count up from 157: + 3 is 160, + 40 is 200, + 400 is 600, + 2 is 602. 3 + 40 + 400 + 2 = 445. Check: 445 + 157 = 602.

  - slug: g3math-final-q12
    type: multiple_choice
    topic_code: "3.NBT.A.1"
    source: "IM K–5 Math Grade 3, Unit 3, Section C"
    points: 1
    prompt: |
      What is 476 rounded to the nearest ten?
    options:
      - "470"
      - "500"
      - "400"
      - "480"
    option_explanations:
      - |
        476 is between 470 and 480, but the ones digit is 6, so it is closer to 480.
      - |
        500 is 476 rounded to the nearest hundred. The question asks for the nearest ten.
      - |
        400 rounds down to a hundred, and 476 is closer to 500 than to 400 anyway. To the nearest ten it is 480.
      - |
        Correct. 476 is between 470 and 480, and 6 ones is past halfway, so it rounds up to 480.
    answer: 3

  - slug: g3math-final-q13
    type: multiple_choice
    topic_code: "3.NBT.A.1"
    source: "IM K–5 Math Grade 3, Unit 3, Section C"
    points: 1
    prompt: |
      What is 649 rounded to the nearest hundred?
    options:
      - "650"
      - "700"
      - "600"
      - "640"
    option_explanations:
      - |
        650 is 649 rounded to the nearest ten. To the nearest hundred, choose between 600 and 700.
      - |
        700 looks at the 9 in the ones place. For hundreds, look at the tens digit: 4 tens is less than halfway.
      - |
        Correct. 649 is between 600 and 700. Its tens digit is 4, so it is closer to 600.
      - |
        640 rounds down to a ten, and the question asks for the nearest hundred, which is 600.
    answer: 2

  - slug: g3math-final-q14
    type: numeric
    topic_code: "3.OA.D.8"
    source: "IM K–5 Math Grade 3, Unit 3, Section D"
    points: 1
    prompt: |
      The school theater has 9 rows of 8 seats. At the spring show, 15 seats are empty. How many seats are filled?
    answer: { value: 57, tolerance: 0 }
    explanation: |
      Step 1: 9 × 8 = 72 seats in all. Step 2: 72 − 15 = 57 seats are filled.

  # ---- Unit 4 (3.OA.A.2, 3.OA.B.6, 3.OA.C.7, 3.NBT.A.3, 3.OA.A.4, 3.OA.A.3)
  - slug: g3math-final-q15
    type: multiple_choice
    topic_code: "3.OA.A.2"
    source: "IM K–5 Math Grade 3, Unit 4, Section A"
    points: 1
    prompt: |
      Grandpa shares 24 apples equally into 4 baskets. How many apples go in each basket?
    options:
      - "20"
      - "6"
      - "28"
      - "8"
    option_explanations:
      - |
        20 is 24 − 4, which takes away only 4 apples. Sharing into 4 equal groups is 24 ÷ 4.
      - |
        Correct. 24 ÷ 4 = 6, because 4 × 6 = 24. Each basket gets 6 apples.
      - |
        28 is 24 + 4. Sharing into baskets is division, not addition.
      - |
        8 apples in each of 4 baskets would be 32 apples. 8 is the share for 3 baskets.
    answer: 1

  - slug: g3math-final-q16
    type: multiple_choice
    topic_code: "3.OA.B.6"
    source: "IM K–5 Math Grade 3, Unit 4, Section B"
    points: 1
    prompt: |
      Which multiplication fact helps you find 63 ÷ 7?
    options:
      - "7 × 9 = 63"
      - "7 × 8 = 56"
      - "63 − 7 = 56"
      - "6 × 3 = 18"
    option_explanations:
      - |
        Correct. 63 ÷ 7 asks "7 times what is 63?" Since 7 × 9 = 63, the answer is 9.
      - |
        7 × 8 = 56 is one 7 short of 63, so 8 is not the answer.
      - |
        63 − 7 takes away one 7. Division asks how many 7s make 63, which a times fact answers.
      - |
        6 × 3 uses the digits of 63, but 63 is 6 tens and 3 ones, not 6 times 3.
    answer: 0

  - slug: g3math-final-q17
    type: numeric
    topic_code: "3.OA.C.7"
    source: "IM K–5 Math Grade 3, Unit 4, Section D"
    points: 1
    prompt: |
      What is 54 ÷ 6?
    answer: { value: 9, tolerance: 0 }
    explanation: |
      Think "6 times what is 54?" 6 × 9 = 54, so 54 ÷ 6 = 9.

  - slug: g3math-final-q18
    type: multiple_choice
    topic_code: "3.NBT.A.3"
    source: "IM K–5 Math Grade 3, Unit 4, Section C"
    points: 1
    prompt: |
      What is 7 × 40?
    options:
      - "47"
      - "28"
      - "320"
      - "280"
    option_explanations:
      - |
        47 adds 7 + 40. 7 × 40 means 7 groups of 40.
      - |
        28 is 7 × 4, but 40 is 4 tens. 7 × 4 tens is 28 tens, or 280.
      - |
        320 is 8 × 40, one group of 40 too many.
      - |
        Correct. 7 × 4 tens = 28 tens, and 28 tens is 280.
    answer: 3

  - slug: g3math-final-q19
    type: multi_select
    topic_code: "3.OA.C.7"
    source: "IM K–5 Math Grade 3, Unit 4, Section D"
    points: 2
    partial_credit: true
    prompt: |
      Which of these have a product of 24? Select all that apply.
    options:
      - "3 × 8"
      - "4 × 6"
      - "5 × 5"
      - "6 × 4"
      - "2 × 10"
    option_explanations:
      - |
        Yes. Three 8s are 8, 16, 24, so 3 × 8 = 24.
      - |
        Yes. Four 6s are 6, 12, 18, 24, so 4 × 6 = 24.
      - |
        No. 5 × 5 = 25, which is one more than 24.
      - |
        Yes. 6 × 4 has the same factors as 4 × 6 in the other order, so it is also 24.
      - |
        No. 2 × 10 = 20, which is 4 less than 24.
    answer: [0, 1, 3]

  - slug: g3math-final-q20
    type: true_false
    topic_code: "3.OA.A.4"
    source: "IM K–5 Math Grade 3, Unit 4, Section B"
    points: 1
    prompt: |
      True or false: in 30 ÷ ___ = 5, the missing number is 6.
    answer: true
    explanation: |
      True. 30 ÷ 6 = 5, because 6 × 5 = 30.

  - slug: g3math-final-q21
    type: short_answer
    topic_code: "3.OA.A.3"
    source: "IM K–5 Math Grade 3, Unit 4, Section D"
    points: 3
    prompt: |
      Ms. Patel has 42 markers. She puts 6 markers in each cup.

      (a) How many cups does she fill?
      (b) Write the division equation and the multiplication equation that match.
      (c) She gets 18 more markers and puts them in cups of 6 too. How many cups are filled now?
    answer: |
      (a) 7 cups.
      (b) 42 ÷ 6 = 7 and 6 × 7 = 42 (or 7 × 6 = 42).
      (c) 18 ÷ 6 = 3 more cups, so 7 + 3 = 10 cups. (Or 42 + 18 = 60 and 60 ÷ 6 = 10.)
    explanation: |
      Three points.

      (a) 1 pt: 7 cups.

      (b) 1 pt: both equations, 42 ÷ 6 = 7 and a matching multiplication (6 × 7 = 42 or 7 × 6 = 42).

      (c) 1 pt: 10 cups, by either method shown.

  # ---- Unit 5 · Set B: number line from 0 to 2 (3.NF.A.2, 3.NF.A.3)
  - slug: g3math-final-q22
    type: multiple_choice
    topic_code: "3.NF.A.2"
    source: "IM K–5 Math Grade 3, Unit 5, Section B"
    points: 1
    stimulus: |
      Use the number line from 0 to 2. Each whole is split into 4 equal parts.
    figure: figures/review-fraction-number-line.svg
    figure_alt: "A number line from 0 to 2, labeled 0, 1 and 2. Each whole is split into 4 equal parts by tick marks, so there are 8 equal parts in all. Point A is on the third tick mark after 0. Point B is on 2."
    prompt: |
      What fraction is at point A?
    options:
      - "3/5"
      - "3/8"
      - "3/4"
      - "4/3"
    option_explanations:
      - |
        3/5 counts the tick marks from 0 to 1 (there are 5), but the whole is split into 4 equal parts, the spaces between the marks.
      - |
        3/8 uses all 8 parts from 0 to 2. The denominator tells how many parts make one whole, which is 4.
      - |
        Correct. From 0 to 1 there are 4 equal parts, and A is 3 parts from 0, so A is 3/4.
      - |
        4/3 flips the numbers. The parts in one whole (4) go on the bottom; the parts counted (3) go on top.
    answer: 2

  - slug: g3math-final-q23
    type: multiple_choice
    topic_code: "3.NF.A.3"
    source: "IM K–5 Math Grade 3, Unit 5, Section C"
    points: 1
    stimulus: |
      Use the number line from 0 to 2. Each whole is split into 4 equal parts.
    prompt: |
      Point B is at 2. Which fraction is equal to 2?
    options:
      - "8/4"
      - "2/4"
      - "4/8"
      - "6/4"
    option_explanations:
      - |
        Correct. From 0 to 2 there are 8 parts of size 1/4, so 2 = 8/4.
      - |
        2/4 is only 2 fourths, which is halfway between 0 and 1. 2 wholes is 8 fourths.
      - |
        4/8 flips the numbers and equals 1/2. It is far less than 2.
      - |
        6/4 is 6 fourths, which is 2 parts short of 2. Count all 8 parts from 0 to 2.
    answer: 0

  - slug: g3math-final-q24
    type: multiple_choice
    topic_code: "3.NF.A.1"
    source: "IM K–5 Math Grade 3, Unit 5, Section A"
    points: 1
    prompt: |
      A pizza is cut into 8 equal slices. Maya eats 3 slices. What fraction of the pizza did Maya eat?
    options:
      - "5/8"
      - "3/5"
      - "8/3"
      - "3/8"
    option_explanations:
      - |
        5/8 is the part of the pizza that is left. Maya ate 3 of the 8 slices.
      - |
        3/5 compares the eaten slices to the slices left. The bottom number should be all 8 equal parts.
      - |
        8/3 flips the numbers. The whole pizza has 8 parts, so 8 goes on the bottom.
      - |
        Correct. 3 of 8 equal slices is 3/8 of the pizza.
    answer: 3

  - slug: g3math-final-q25
    type: true_false
    topic_code: "3.NF.A.3"
    source: "IM K–5 Math Grade 3, Unit 5, Section D"
    points: 1
    prompt: |
      True or false: 1/3 of a sandwich is more than 1/6 of the same sandwich.
    answer: true
    explanation: |
      True. Splitting the same sandwich into 3 equal parts makes bigger parts than splitting it into 6. One big part (1/3) is more than one small part (1/6).

  - slug: g3math-final-q26
    type: fill_blank
    topic_code: "3.NF.A.1"
    source: "IM K–5 Math Grade 3, Unit 5, Section A"
    points: 1
    prompt: |
      In the fraction 2/5, the bottom number 5 is called the ____.
    answer: ["denominator", "the denominator", "denominators"]
    explanation: |
      The denominator tells how many equal parts make one whole. The top number, the numerator, tells how many parts we are counting.

  # ---- Unit 6 (3.MD.A.1, 3.MD.A.2, 3.MD.B.4)
  - slug: g3math-final-q27
    type: multiple_choice
    topic_code: "3.MD.A.1"
    source: "IM K–5 Math Grade 3, Unit 6, Section C"
    points: 1
    figure: figures/review-clock.svg
    figure_alt: "An analog clock. The short hour hand is a little less than halfway from 2 to 3. The long minute hand points at the 5. The clock shows 2:25."
    prompt: |
      Wen looks at the clock when recess ends. What time does the clock show?
    options:
      - "5:10"
      - "2:25"
      - "3:25"
      - "2:05"
    option_explanations:
      - |
        5:10 reads the hands the wrong way round. The short hand shows the hour (just past 2) and the long hand shows minutes.
      - |
        Correct. The hour hand is just past 2, and the minute hand on the 5 means 5 × 5 = 25 minutes. It is 2:25.
      - |
        The hour hand has not reached 3 yet. It is between 2 and 3, so the hour is still 2.
      - |
        The minute hand on the 5 means 25 minutes, not 5. Count by 5s for each number: 5, 10, 15, 20, 25.
    answer: 1

  - slug: g3math-final-q28
    type: multiple_choice
    topic_code: "3.MD.A.1"
    source: "IM K–5 Math Grade 3, Unit 6, Section C"
    points: 1
    prompt: |
      Soccer practice starts at 4:15 and ends at 5:05. How long is practice?
    options:
      - "90 minutes"
      - "45 minutes"
      - "50 minutes"
      - "60 minutes"
    option_explanations:
      - |
        90 treats the times like whole numbers (505 − 415). An hour has 60 minutes, not 100.
      - |
        45 minutes takes you from 4:15 to 5:00. Practice goes 5 more minutes, to 5:05.
      - |
        Correct. 4:15 to 5:00 is 45 minutes, and 5:00 to 5:05 is 5 more. 45 + 5 = 50 minutes.
      - |
        60 minutes from 4:15 would end at 5:15, which is 10 minutes later than 5:05.
    answer: 2

  - slug: g3math-final-q29
    type: numeric
    topic_code: "3.MD.A.2"
    source: "IM K–5 Math Grade 3, Unit 6, Section D"
    points: 1
    prompt: |
      A cooler holds 20 liters of water. The team fills 3 bottles that hold 4 liters each. How many liters are left in the cooler?
