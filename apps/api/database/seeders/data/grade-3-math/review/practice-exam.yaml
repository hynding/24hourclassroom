  - slug: g3math-final-q37
    type: short_answer
    topic_code: "3.OA.D.8"
    source: "IM K–5 Math Grade 3, Unit 8, Section D"
    points: 3
    prompt: |
      On field day there are 6 teams with 8 students on each team. 6 grown-up helpers join them. Then everyone splits into groups of 9 for the relay race.

      (a) How many people are there in all?
      (b) How many relay groups are there?
      (c) Write one equation, with a letter for the unknown, for the number of relay groups.
    answer: |
      (a) 6 × 8 = 48 students, and 48 + 6 = 54 people.
      (b) 54 ÷ 9 = 6 relay groups.
      (c) g = (6 × 8 + 6) ÷ 9, so g = 6.
    explanation: |
      Three points.

      (a) 1 pt: 54 people, with 6 × 8 = 48 shown.

      (b) 1 pt: 6 groups (54 ÷ 9 = 6, or 9 × 6 = 54).

      (c) 1 pt: an equation with a letter that uses the steps of the problem, such as g = (48 + 6) ÷ 9 or 54 ÷ 9 = g.
