  # ---- Unit 7 (3.G.A.1, 3.MD.D.8, 3.MD.C.7)
  - slug: g3math-final-q32
    type: multiple_choice
    topic_code: "3.G.A.1"
    source: "IM K–5 Math Grade 3, Unit 7, Section A"
    points: 1
    prompt: |
      Which sentence is true?
    options:
      - "Every rhombus is a square."
      - "Every square is a rhombus."
      - "Every rectangle is a square."
      - "Every quadrilateral has 4 equal sides."
    option_explanations:
      - |
        A rhombus has 4 equal sides, but its corners do not have to be square corners, so not every rhombus is a square.
      - |
        Correct. A rhombus is a quadrilateral with 4 equal sides. Every square has 4 equal sides, so every square is a rhombus.
      - |
        A rectangle has 4 square corners, but its sides do not have to be equal, like a 2 by 5 rectangle.
      - |
        A quadrilateral only needs 4 sides. Many, like most rectangles and trapezoids, have sides of different lengths.
    answer: 1

  # ---- Unit 7 · Set C: the dog pen (3.MD.D.8, 3.MD.C.7)
  - slug: g3math-final-q33
    type: multiple_choice
    topic_code: "3.MD.D.8"
    source: "IM K–5 Math Grade 3, Unit 7, Section B"
    points: 1
    stimulus: |
      Use the drawing of the dog pen. The pen is a rectangle with a perimeter of 30 meters. One side is 9 meters long.
    figure: figures/review-dog-pen.svg
    figure_alt: "A rectangle labeled Dog Pen. The long side at the bottom is labeled 9 meters. The short side on the left is labeled with a question mark. Below it is written Perimeter = 30 meters."
    prompt: |
      How long is the side marked with a question mark?
    options:
      - "21 meters"
      - "12 meters"
      - "6 meters"
      - "15 meters"
    option_explanations:
      - |
        21 is 30 − 9, which takes away only one long side. A rectangle has two 9-meter sides.
      - |
        12 is 30 − 9 − 9, the two short sides together. Each short side is half of 12.
      - |
        Correct. The two long sides are 9 + 9 = 18 meters. 30 − 18 = 12 meters for the two short sides, so each is 6 meters.
      - |
        15 is half of 30, one long side and one short side together. Take away the 9 to get 6.
    answer: 2

  - slug: g3math-final-q34
    type: numeric
    topic_code: "3.MD.C.7"
    source: "IM K–5 Math Grade 3, Unit 7, Section C"
    points: 1
    stimulus: |
      Use the drawing of the dog pen. The pen is a rectangle with a perimeter of 30 meters. One side is 9 meters long.
    prompt: |
      What is the area of the dog pen, in square meters?
    answer: { value: 54, tolerance: 0 }
    explanation: |
      The short side is 6 meters (30 − 9 − 9 = 12, and 12 ÷ 2 = 6). Area = 9 × 6 = 54 square meters.

  - slug: g3math-final-q35
    type: multiple_choice
    topic_code: "3.MD.D.8"
    source: "IM K–5 Math Grade 3, Unit 7, Section C"
    points: 1
    prompt: |
      Two rectangles each have an area of 12 square units. One is 3 units by 4 units. The other is 2 units by 6 units. Which sentence is true?
    options:
      - "They have the same perimeter."
      - "The 3 by 4 rectangle has the bigger perimeter."
      - "They have different areas."
      - "The 2 by 6 rectangle has the bigger perimeter."
    option_explanations:
      - |
        Same area does not mean same perimeter. 3 + 4 + 3 + 4 = 14 units, but 2 + 6 + 2 + 6 = 16 units.
      - |
        The 3 by 4 rectangle has perimeter 14 units, which is less than the 16 units of the 2 by 6 rectangle.
      - |
        Both areas are 12 square units: 3 × 4 = 12 and 2 × 6 = 12.
      - |
        Correct. The 2 by 6 rectangle has perimeter 2 + 6 + 2 + 6 = 16 units, more than the 14 units of the 3 by 4 rectangle.
    answer: 3

