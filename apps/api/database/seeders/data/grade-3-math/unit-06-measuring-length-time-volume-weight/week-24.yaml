week: 24
unit: 6
title: "Solving Measurement Word Problems"
topics: ["3.MD.A.2", "3.OA.D.8"]
guide: guides/week-24.md
guide_description: |
  How to solve one-step and two-step word problems about kilograms, grams, liters and time with all four
  operations, using tape diagrams, number lines and equations with a letter for the unknown, and how to check
  that an answer is reasonable.
flashcards_description: |
  18 cards on the steps for solving a word problem, choosing the operation, tape diagrams, letters for unknown
  numbers, two-step measurement problems and checking an answer with an estimate.

flashcards:
  - front: Measurement word problem → four steps
    back: |
      1. Read and picture the story. 2. Draw a tape diagram or number line. 3. Write an equation and solve. 4. Check that the answer makes sense and has a unit.
    topic_code: "3.OA.D.8"
  - front: Equal bags of rice put together → which operation
    back: |
      Multiply. 5 bags of 3 kg is 5 × 3 = 15 kg.
    topic_code: "3.MD.A.2"
  - front: Total liters shared equally into jugs → which operation
    back: |
      Divide. 20 L shared equally into 4 jugs is 20 ÷ 4 = 5 L in each jug.
    topic_code: "3.MD.A.2"
  - front: How many 3 L buckets fill 12 L → which operation
    back: |
      Divide: 12 ÷ 3 = 4 buckets. You are finding how many groups of 3 fit in 12.
    topic_code: "3.MD.A.2"
  - front: Some liters poured out → which operation
    back: |
      Subtract the amount poured out from the amount you started with.
    topic_code: "3.MD.A.2"
  - front: Tape diagram with equal parts and a total → what it shows
    back: |
      A total split into equal parts. If you know the total and the number of parts, divide to find one part.
    topic_code: "3.MD.A.2"
  - front: Tape diagram with 3 parts of 6 kg → total
    back: |
      18 kg, because 3 × 6 = 18.
    topic_code: "3.MD.A.2"
  - front: Letter in an equation → what it stands for
    back: |
      An unknown number you are trying to find. In 4 × 5 = m, the letter m stands for 20.
    topic_code: "3.OA.D.8"
  - front: Two-step problem → what makes it two steps
    back: |
      You must find a hidden number first, then use it to answer the question. Find the total of the bags, then take some away.
    topic_code: "3.OA.D.8"
  - front: 3 bags of 4 kg, then 2 kg more → total
    back: |
      14 kg. First 3 × 4 = 12 kg, then 12 + 2 = 14 kg.
    topic_code: "3.OA.D.8"
  - front: 30 L of water, 4 plants get 5 L each → water left
    back: |
      10 L. First 4 × 5 = 20 L used, then 30 − 20 = 10 L left.
    topic_code: "3.OA.D.8"
  - front: Equation for 30 L minus 4 plants of 5 L → with a letter
    back: |
      30 − (4 × 5) = w. The parentheses say to find 4 × 5 first.
    topic_code: "3.OA.D.8"
  - front: Is my answer reasonable → how to check
    back: |
      Round the numbers and estimate. 46 L + 31 L is about 50 + 30 = 80 L, so an answer of 77 L makes sense, but 177 L does not.
    topic_code: "3.OA.D.8"
  - front: Estimate → what it is
    back: |
      A number close to the exact answer, often found by rounding to the nearest 10 or 100.
    topic_code: "3.OA.D.8"
  - front: Time word problem → a good tool
    back: |
      A number line with jumps. Jump to the next o'clock, then on to the end.
    topic_code: "3.MD.A.1"
  - front: Unit in the answer → why it matters
    back: |
      "12" could be 12 grams, 12 kilograms or 12 liters. Writing the unit says what you found.
    topic_code: "3.MD.A.2"
  - front: Mixed-up units in a problem → what to watch for
    back: |
      Only add or subtract amounts with the same unit: kilograms with kilograms, liters with liters.
    topic_code: "3.MD.A.2"
  - front: Answer bigger than the start in a "how much is left" problem → what it tells you
    back: |
      Something went wrong. After taking some away, the amount left must be smaller than the start.
    topic_code: "3.OA.D.8"

quiz:
  description: |
    13 questions · about 30 minutes · one-step and two-step word problems with kilograms, liters and time,
    tape diagrams, equations with a letter for the unknown, and checking answers with estimates, plus review of
    rulers and elapsed time. Multiple choice, select-all, true/false and number answers are graded at once; the
    fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w24-q01
      type: multiple_choice
      topic_code: "3.MD.A.2"
      source: "IM K–5 Math Grade 3, Unit 6, Section D"
      points: 1
      figure: figures/w24-tape-soil.svg
      figure_alt: "A tape diagram. A bracket over the whole tape is labeled 24 kg. The tape is split into 4 equal parts labeled bag 1, bag 2, bag 3 and bag 4, and each part has a question mark."
      prompt: |
        The garden club splits 24 kilograms of soil equally into 4 bags. How much soil goes in each bag?
      options:
        - "20 kilograms"
        - "28 kilograms"
        - "6 kilograms"
        - "96 kilograms"
      option_explanations:
        - |
          20 is 24 − 4. The soil is shared into 4 equal bags, so divide instead of subtract.
        - |
          28 is 24 + 4. Each bag holds part of the 24 kilograms, so each must be less than 24.
        - |
          Correct. The tape shows 24 kg split into 4 equal parts, and 24 ÷ 4 = 6, so each bag holds 6 kilograms.
        - |
          96 is 24 × 4. The 24 kilograms is the total, so it gets split up, not multiplied.
      answer: 2

    - slug: g3math-w24-q02
      type: numeric
      topic_code: "3.MD.A.2"
      source: "IM K–5 Math Grade 3, Unit 6, Section D"
      points: 1
      prompt: |
        A baker uses 8 bags of flour each week. Each bag has a mass of 5 kilograms. How many kilograms of flour does the baker use each week?
      answer: { value: 40, tolerance: 0 }
      explanation: |
        8 equal bags of 5 kilograms: 8 × 5 = 40 kilograms.

    - slug: g3math-w24-q03
      type: multiple_choice
      topic_code: "3.MD.A.2"
      source: "IM K–5 Math Grade 3, Unit 6, Section D"
      points: 1
      stimulus: |
        Use the picture of the class water cooler. The marks count liters.
      figure: figures/w24-water-cooler.svg
      figure_alt: "A tall water cooler with marks on the side from 0 to 20 liters. There is a mark for every liter, and the marks 0, 4, 8, 12, 16 and 20 have numbers. The water comes up to the second unlabeled mark above 12."
      prompt: |
        How many liters of water are in the cooler?
      options:
        - "14 liters"
        - "12 liters"
        - "16 liters"
        - "13 liters"
      option_explanations:
        - |
          Correct. Every mark is 1 liter. The water is 2 marks above 12, so it is 12 + 2 = 14 liters.
        - |
          12 is the labeled mark below the water. The water goes 2 marks higher.
        - |
          16 is the labeled mark above the water. The water stops 2 marks below it.
        - |
          13 is the first mark above 12. The water is at the second mark, 14.
      answer: 0

    - slug: g3math-w24-q04
      type: numeric
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 6, Section D"
      points: 1
      stimulus: |
        Use the picture of the class water cooler. The marks count liters.
      prompt: |
        Then 3 students each fill a 2-liter jug from the cooler. How many liters of water are left in the cooler?
      answer: { value: 8, tolerance: 0 }
      explanation: |
        Two steps. First, the water taken out: 3 × 2 = 6 liters. Then the water left: 14 − 6 = 8 liters.

    - slug: g3math-w24-q05
      type: multiple_choice
      topic_code: "3.MD.A.1"
      source: "IM K–5 Math Grade 3, Unit 6, Section C"
      points: 1
      figure: figures/w24-clock-bus.svg
      figure_alt: "An analog clock labeled Bus leaves. The long minute hand points at the 5. The short hour hand is between the 9 and the 10, a little less than halfway to the 10."
      prompt: |
        The clock shows when the field trip bus leaves. The ride takes 40 minutes. What time does the bus arrive?
      options:
        - "9:65"
        - "10:05"
        - "10:25"
        - "10:15"
      option_explanations:
        - |
          25 + 40 is 65, but an hour has only 60 minutes. 9:60 is 10:00, so 9:65 is really 10:05.
        - |
          Correct. The bus leaves at 9:25. Jump 35 minutes to 10:00, then the last 5 minutes to 10:05.
        - |
          10:25 is a whole hour after 9:25. The ride is 40 minutes, less than an hour.
        - |
          From 9:25 to 10:00 is 35 minutes, so only 5 of the 40 minutes are left, not 15.
      answer: 1

    - slug: g3math-w24-q06
      type: multiple_choice
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 6, Section D"
      points: 1
      prompt: |
        A garden tank holds 45 liters of water. The class uses 5 liters each day for 4 days. Which equation finds w, the liters left in the tank?
      options:
        - "45 − 4 − 5 = w"
        - "45 + (4 × 5) = w"
        - "(45 ÷ 5) − 4 = w"
        - "45 − (4 × 5) = w"
      option_explanations:
        - |
          This takes away only 4 liters and then 5 liters. The class uses 5 liters on each of 4 days, which is 4 × 5 liters.
        - |
          Water is used up, so the amount in the tank goes down. Adding makes it go up.
        - |
          Dividing 45 by 5 finds how many days the water would last, not how much is left after 4 days.
        - |
          Correct. The class uses 4 × 5 = 20 liters, and that is taken away from 45. So 45 − (4 × 5) = w, and w is 25.
      answer: 3

    - slug: g3math-w24-q07
      type: numeric
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 6, Section D"
      points: 1
      prompt: |
        Dev's empty backpack has a mass of 3 kilograms. He puts in 4 books. Each book has a mass of 2 kilograms. What is the mass of the full backpack, in kilograms?
      answer: { value: 11, tolerance: 0 }
      explanation: |
        First the books: 4 × 2 = 8 kilograms. Then add the backpack: 8 + 3 = 11 kilograms.

    - slug: g3math-w24-q08
      type: true_false
      topic_code: "3.MD.A.2"
      source: "IM K–5 Math Grade 3, Unit 6, Section D"
      points: 1
      prompt: |
        True or false: 2 grams is a reasonable mass for a pet rabbit.
      answer: false
      explanation: |
        False. 2 grams is about as heavy as 2 paper clips. A pet rabbit is about as heavy as 2 full 1-liter water bottles, so about 2 kilograms is reasonable.

    - slug: g3math-w24-q09
      type: fill_blank
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 6, Section D"
      points: 1
      prompt: |
        A number close to the exact answer, often found by rounding, is called an ____.
      answer: ["estimate", "an estimate", "estimates"]
      explanation: |
        An estimate is a close, easy number. Rounding 46 + 31 to 50 + 30 = 80 gives an estimate to check the exact answer, 77.

    - slug: g3math-w24-q10
      type: multi_select
      topic_code: "3.MD.A.2"
      source: "IM K–5 Math Grade 3, Unit 6, Section D"
      points: 2
      partial_credit: true
      prompt: |
        Which problems can be solved with 32 ÷ 4? Select all that apply.
      options:
        - "32 liters of lemonade are shared equally into 4 jugs. How many liters are in each jug?"
        - "There are 4 bags of sand, and each has a mass of 32 kilograms. What is the total mass?"
        - "A 32-kilogram pile of sand is put into bags of 4 kilograms each. How many bags are filled?"
        - "A tank has 32 liters, and 4 liters leak out. How many liters are left?"
        - "Ana pours 4 liters into each bottle and uses 32 liters in all. How many bottles does she fill?"
      option_explanations:
        - |
          Yes. Sharing 32 liters equally into 4 jugs is 32 ÷ 4 = 8 liters in each jug.
        - |
          No. Four equal bags of 32 kilograms is 4 × 32, a multiplication problem.
        - |
          Yes. Finding how many groups of 4 kilograms fit in 32 kilograms is 32 ÷ 4 = 8 bags.
        - |
          No. Liquid leaking out is taken away: 32 − 4 = 28 liters.
        - |
          Yes. Finding how many groups of 4 liters make 32 liters is 32 ÷ 4 = 8 bottles.
      answer: [0, 2, 4]

    - slug: g3math-w24-q11
      type: short_answer
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 6, Section D"
      points: 2
      prompt: |
        A pet shop has 3 small fish tanks that hold 9 liters each, and one big tank that holds 38 liters.

        (a) How many liters of water do all four tanks hold together?
        (b) Use an estimate to explain whether your answer is reasonable.
      answer: |
        (a) 65 liters. The small tanks hold 3 × 9 = 27 liters, and 27 + 38 = 65 liters.
        (b) 27 rounds to 30 and 38 rounds to 40, and 30 + 40 = 70. 65 is close to 70, so the answer is reasonable.
      explanation: |
        Two points.

        (a) 1 pt: 65 liters, from 3 × 9 = 27 and 27 + 38 = 65.

        (b) 1 pt: an estimate that rounds the numbers (such as 30 + 40 = 70) and says 65 is close to it, so it makes sense. Another sensible rounding (such as 25 + 40) also earns the point.

    - slug: g3math-w24-q12
      type: multiple_choice
      topic_code: "3.MD.B.4"
      source: "IM K–5 Math Grade 3, Unit 6, Section A"
      points: 1
      prompt: |
        Pia measures a feather from the 0 mark of a ruler marked in quarter inches. Its tip is on the mark just before 2 inches. How long is the feather?
      options:
        - "1 1/4 inches"
        - "1 3/4 inches"
        - "2 1/4 inches"
        - "1 1/2 inches"
      option_explanations:
        - |
          1 1/4 is the first short mark after 1. The mark just before 2 is two more quarter inches along.
        - |
          Correct. The marks from 1 go 1 1/4, 1 1/2, 1 3/4, then 2. The mark just before 2 is 1 3/4 inches.
        - |
          2 1/4 is the mark just after 2. The tip is before the 2.
        - |
          1 1/2 is the half-inch mark. There is one more quarter-inch mark between it and 2.
      answer: 1

    - slug: g3math-w24-q13
      type: multiple_choice
      topic_code: "3.MD.A.1"
      source: "IM K–5 Math Grade 3, Unit 6, Section C"
      points: 1
      prompt: |
        Art class ended at 2:10. It lasted 25 minutes. What time did art class start?
      options:
        - "1:45"
        - "2:35"
        - "1:85"
        - "1:55"
      option_explanations:
        - |
          Correct. Jump back 10 minutes from 2:10 to 2:00, then back the other 15 minutes to 1:45.
        - |
          2:35 adds 25 minutes. Art class started before it ended, so jump back in time.
        - |
          1:85 comes from 210 − 25 = 185, as if times were regular numbers. An hour has 60 minutes, so count back with jumps.
        - |
          1:55 is only 15 minutes before 2:10. Art class lasted 25 minutes, so go back 10 more.
      answer: 0
