week: 22
unit: 6
title: "Grams, Kilograms and Liters"
topics: ["3.MD.A.2"]
guide: guides/week-22.md
guide_description: |
  What mass and liquid volume are, how heavy a gram and a kilogram feel, how much a liter holds, how to
  estimate with things you know, and how to read a scale, a balance and a container marked in liters.
flashcards_description: |
  19 cards on grams, kilograms and liters: what each unit measures, objects to compare with, choosing a unit,
  reading scales and containers, and adding or taking away amounts with the same unit.

flashcards:
  - front: Mass → what it is
    back: |
      How heavy something is: how much "stuff" it has. We measure mass in grams and kilograms.
    topic_code: "3.MD.A.2"
  - front: Gram → how heavy
    back: |
      Very light. A paper clip has a mass of about 1 gram. Write grams as g.
    topic_code: "3.MD.A.2"
  - front: Kilogram → how heavy
    back: |
      A big textbook or a full 1-liter water bottle has a mass of about 1 kilogram. Write kilograms as kg.
    topic_code: "3.MD.A.2"
  - front: Gram or kilogram → which is heavier
    back: |
      A kilogram, by a lot. A gram is about one paper clip, and a kilogram is about a full 1-liter water bottle.
    topic_code: "3.MD.A.2"
  - front: Liquid volume → what it is
    back: |
      How much liquid a container holds or has in it. This week we measure it in liters.
    topic_code: "3.MD.A.2"
  - front: Liter → how much
    back: |
      About as much as a large water bottle holds. Write liters as L.
    topic_code: "3.MD.A.2"
  - front: Unit for the mass of a strawberry → gram or kilogram
    back: |
      Grams. A strawberry is very light, so a small unit fits.
    topic_code: "3.MD.A.2"
  - front: Unit for the mass of a dog → gram or kilogram
    back: |
      Kilograms. A dog is heavy, so the bigger unit fits.
    topic_code: "3.MD.A.2"
  - front: Unit for the water in a bathtub → liter, gram or kilogram
    back: |
      Liters, because it is an amount of liquid.
    topic_code: "3.MD.A.2"
  - front: Pan balance → what level pans mean
    back: |
      The two sides have the same mass. If 3 blocks of 1 kg balance a melon, the melon is about 3 kg.
    topic_code: "3.MD.A.2"
  - front: Pan balance → what a lower pan means
    back: |
      The lower side is heavier. The higher side is lighter.
    topic_code: "3.MD.A.2"
  - front: Reading a kitchen scale → first step
    back: |
      Find out what each mark is worth. Count from one labeled number to the next and see how many spaces there are.
    topic_code: "3.MD.A.2"
  - front: Scale labeled 0, 100, 200 with one mark in between → that mark's worth
    back: |
      50. It is halfway between 0 and 100, so the marks count by 50s: 0, 50, 100, 150, 200.
    topic_code: "3.MD.A.2"
  - front: Container marks labeled 0, 2, 4, 6 → the mark between 4 and 6
    back: |
      5 liters. The marks count by 1s, and only every other one has a number.
    topic_code: "3.MD.A.2"
  - front: Estimate in measuring → what it means
    back: |
      A careful guess of an amount, made by comparing with something you know, such as "about as heavy as 2 water bottles".
    topic_code: "3.MD.A.2"
  - front: 6 L of juice and 3 L more → total
    back: |
      9 L. Same unit, so add: 6 + 3 = 9 liters.
    topic_code: "3.MD.A.2"
  - front: 15 kg of sand, 4 kg used → amount left
    back: |
      11 kg. Same unit, so take away: 15 − 4 = 11 kilograms.
    topic_code: "3.MD.A.2"
  - front: 1 kg of feathers or 1 kg of rocks → which has more mass
    back: |
      Neither. Both are 1 kilogram. The feathers just take up much more space.
    topic_code: "3.MD.A.2"
  - front: Grams, kilograms, liters → units to always write
    back: |
      Always write the unit after the number. "5" is not an answer; "5 kg" and "5 L" are.
    topic_code: "3.MD.A.2"

quiz:
  description: |
    14 questions · about 25 minutes · grams, kilograms and liters: choosing a unit, estimating, reading a
    scale, a pan balance and containers, and adding and subtracting amounts, plus review of rulers, division
    and fractions. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in
    word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w22-q01
      type: multiple_choice
      topic_code: "3.MD.A.2"
      source: "IM K–5 Math Grade 3, Unit 6, Section B"
      points: 1
      figure: figures/w22-scale-apples.svg
      figure_alt: "Five apples sit on a kitchen scale. The scale's number line is labeled 0, 100, 200, 300, 400, 500, 600, 700, 800, 900 and 1,000 grams, with one smaller mark halfway between each pair of labels. A red pointer is on the smaller mark halfway between 700 and 800."
      prompt: |
        What is the mass of the apples?
      options:
        - "705 grams"
        - "750 grams"
        - "800 grams"
        - "700 grams"
      option_explanations:
        - |
          705 is only a little more than 700. The pointer is halfway to 800, and halfway from 700 to 800 is 750.
        - |
          Correct. Each small mark is halfway between two labels, so it is worth 50 more. Halfway between 700 and 800 is 750 grams.
        - |
          800 is the next label. The pointer stops before it, on the small mark in the middle.
        - |
          700 is the label just before the pointer. The pointer is past it, on the middle mark.
      answer: 1

    - slug: g3math-w22-q02
      type: multiple_choice
      topic_code: "3.MD.A.2"
      source: "IM K–5 Math Grade 3, Unit 6, Section B"
      points: 1
      prompt: |
        Which thing has a mass of about 1 kilogram?
      options:
        - "a paper clip"
        - "a school bus"
        - "a full 1-liter bottle of water"
        - "a single grape"
      option_explanations:
        - |
          A paper clip is about 1 gram, far too light. A kilogram feels more like a big textbook.
        - |
          A school bus is thousands of kilograms. It is much too heavy.
        - |
          Correct. A full 1-liter bottle of water has a mass of about 1 kilogram, which makes it a handy thing to compare with.
        - |
          A grape is only a few grams, so it is far lighter than 1 kilogram.
      answer: 2

    - slug: g3math-w22-q03
      type: multiple_choice
      topic_code: "3.MD.A.2"
      source: "IM K–5 Math Grade 3, Unit 6, Section B"
      points: 1
      prompt: |
        Which unit should Ming use to measure the mass of one strawberry?
      options:
        - "grams"
        - "kilograms"
        - "liters"
        - "inches"
      option_explanations:
        - |
          Correct. A strawberry is very light, so the small unit, grams, fits best.
        - |
          A kilogram is about a whole bottle of water. A strawberry is far lighter, so it would be only a tiny part of a kilogram.
        - |
          Liters measure liquid volume, how much a container holds, not how heavy something is.
        - |
          Inches measure length, how long something is, not its mass.
      answer: 0

    - slug: g3math-w22-q04
      type: fill_blank
      topic_code: "3.MD.A.2"
      source: "IM K–5 Math Grade 3, Unit 6, Section B"
      points: 1
      prompt: |
        The unit we use this week to measure liquid volume, about the amount in a large water bottle, is the ____.
      answer: ["liter", "liters", "the liter", "litre", "litres", "the litre"]
      explanation: |
        The liter (written L) measures liquid volume. A large water bottle holds about 1 liter.

    - slug: g3math-w22-q05
      type: multiple_choice
      topic_code: "3.MD.A.2"
      source: "IM K–5 Math Grade 3, Unit 6, Section B"
      points: 1
      stimulus: |
        Use the picture of the pail and the tub. The marks on each one count liters.
      figure: figures/w22-pail-and-tub.svg
      figure_alt: "Two containers, a Pail and a Tub, each with marks on the side from 0 to 10 liters. There is a mark for every liter, and the marks 0, 2, 4, 6, 8 and 10 have numbers. The water in the Pail comes up to the unlabeled mark between 6 and 8. The water in the Tub comes up to the mark labeled 4."
      prompt: |
        How much water is in the pail?
      options:
        - "6 liters"
        - "8 liters"
        - "4 liters"
        - "7 liters"
      option_explanations:
        - |
          6 is the labeled mark just below the water. The water goes one mark higher.
        - |
          8 is the labeled mark just above the water. The water stops one mark below it.
        - |
          4 liters is how much water is in the tub, not the pail.
        - |
          Correct. Only every other mark has a number, so the marks count by 1s. The mark between 6 and 8 is 7 liters.
      answer: 3

    - slug: g3math-w22-q06
      type: numeric
      topic_code: "3.MD.A.2"
      source: "IM K–5 Math Grade 3, Unit 6, Section B"
      points: 1
      stimulus: |
        Use the picture of the pail and the tub. The marks on each one count liters.
      prompt: |
        How many more liters of water are in the pail than in the tub?
      answer: { value: 3, tolerance: 0 }
      explanation: |
        The pail has 7 liters and the tub has 4 liters. 7 − 4 = 3 more liters.

    - slug: g3math-w22-q07
      type: numeric
      topic_code: "3.MD.A.2"
      source: "IM K–5 Math Grade 3, Unit 6, Section B"
      points: 1
      stimulus: |
        Use the picture of the pail and the tub. The marks on each one count liters.
      prompt: |
        Zainab pours all the water from the pail and the tub into a big empty tank. How many liters of water are in the tank now?
      answer: { value: 11, tolerance: 0 }
      explanation: |
        7 liters from the pail and 4 liters from the tub: 7 + 4 = 11 liters.

    - slug: g3math-w22-q08
      type: multiple_choice
      topic_code: "3.MD.A.2"
      source: "IM K–5 Math Grade 3, Unit 6, Section B"
      points: 1
      figure: figures/w22-balance-rice.svg
      figure_alt: "A pan balance with its beam level. The left pan holds a bag labeled rice. The right pan holds 4 blocks, and each block is labeled 1 kg."
      prompt: |
        The pans are level. What is the mass of the bag of rice?
      options:
        - "4 kilograms"
        - "1 kilogram"
        - "4 grams"
        - "5 kilograms"
      option_explanations:
        - |
          Correct. Level pans mean both sides have the same mass, and 4 blocks of 1 kg make 4 kilograms.
        - |
          Each block is 1 kilogram, but there are 4 blocks balancing the rice.
        - |
          The blocks are labeled kg, kilograms, not grams. 4 grams would be as light as 4 paper clips.
        - |
          This counts the bag as one more block. Only the 4 blocks on the right are weights, so the rice is 4 kilograms.
      answer: 0

    - slug: g3math-w22-q09
      type: true_false
      topic_code: "3.MD.A.2"
      source: "IM K–5 Math Grade 3, Unit 6, Section B"
      points: 1
      prompt: |
        True or false: a bag holding 1 kilogram of feathers has less mass than a bag holding 1 kilogram of rocks.
      answer: false
      explanation: |
        False. Both bags hold 1 kilogram, so their masses are the same. The feathers take up much more space, but they are not lighter.

    - slug: g3math-w22-q10
      type: multi_select
      topic_code: "3.MD.A.2"
      source: "IM K–5 Math Grade 3, Unit 6, Section B"
      points: 2
      partial_credit: true
      prompt: |
        Which of these would you measure in liters? Select all that apply.
      options:
        - "the water in a bathtub"
        - "the juice in a big jug"
        - "how heavy a cat is"
        - "how long a desk is"
        - "the water in a fish tank"
      option_explanations:
        - |
          Yes. Bath water is a liquid, and a tub holds many liters of it.
        - |
          Yes. Juice is a liquid, so its volume is measured in liters.
        - |
          No. How heavy a cat is means its mass, which is measured in kilograms.
        - |
          No. How long a desk is means its length, which is measured in inches or other length units.
        - |
          Yes. A fish tank holds water, and the amount of water is measured in liters.
      answer: [0, 1, 4]

    - slug: g3math-w22-q11
      type: short_answer
      topic_code: "3.MD.A.2"
      source: "IM K–5 Math Grade 3, Unit 6, Section B"
      points: 2
      prompt: |
        Tomás says his backpack full of books has a mass of about 4 grams.

        (a) Is his backpack closer to 4 grams or 4 kilograms?
        (b) Explain how you know, using something you know the mass of.
      answer: |
        (a) 4 kilograms.
        (b) A gram is about as heavy as one paper clip, so 4 grams is like 4 paper clips, far too light for a backpack of books. A kilogram is about a full 1-liter water bottle, and a full backpack feels like about 4 of those.
      explanation: |
        Two points.

        (a) 1 pt: 4 kilograms.

        (b) 1 pt: a reason that compares with a known mass, such as a gram being about a paper clip or a kilogram being about a 1-liter water bottle or a big book.

    - slug: g3math-w22-q12
      type: multiple_choice
      topic_code: "3.MD.B.4"
      source: "IM K–5 Math Grade 3, Unit 6, Section A"
      points: 1
      prompt: |
        On a ruler, which length is exactly halfway between 2 inches and 3 inches?
      options:
        - "2 1/4 inches"
        - "3 1/2 inches"
        - "2 1/2 inches"
        - "2 3/4 inches"
      option_explanations:
        - |
          2 1/4 is only one quarter of the way from 2 to 3. Halfway is two quarters, 2 2/4, the same as 2 1/2.
        - |
          3 1/2 is halfway between 3 and 4, past the 3 mark.
        - |
          Correct. Halfway between two whole inches is the half-inch mark, so halfway between 2 and 3 is 2 1/2.
        - |
          2 3/4 is three quarters of the way to 3, past the middle.
      answer: 2

    - slug: g3math-w22-q13
      type: numeric
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 1
      prompt: |
        8 friends share 56 stickers equally. How many stickers does each friend get?
      answer: { value: 7, tolerance: 0 }
      explanation: |
        56 ÷ 8 = 7, because 8 × 7 = 56. Each friend gets 7 stickers.

    - slug: g3math-w22-q14
      type: multiple_choice
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section C"
      points: 1
      prompt: |
        Which fraction is equal to 1 whole?
      options:
        - "2/3"
        - "4/4"
        - "1/4"
        - "4/1"
      option_explanations:
        - |
          2/3 is 2 of 3 equal parts. One more third is needed to make a whole.
        - |
          Correct. 4/4 means all 4 of the 4 equal parts, which is the whole thing.
        - |
          1/4 is just one of 4 equal parts, much less than a whole.
        - |
          4/1 means 4 wholes, each cut into 1 part, so it equals 4, not 1.
      answer: 1
