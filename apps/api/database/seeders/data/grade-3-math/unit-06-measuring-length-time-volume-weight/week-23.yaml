week: 23
unit: 6
title: "Telling Time to the Minute and Finding Elapsed Time"
topics: ["3.MD.A.1"]
guide: guides/week-23.md
guide_description: |
  How to read an analog clock to the exact minute, why the hour hand sits between two numbers, and how to find
  how much time has passed, or when something ends, by making jumps on a number line, even across the hour.
flashcards_description: |
  19 cards on the hour and minute hands, counting minutes by 5s and 1s, a.m. and p.m., minutes in an hour, and
  finding elapsed time, start times and end times with jumps on a number line.

flashcards:
  - front: Hour hand → how to spot it
    back: |
      The short hand. It points to the hour, and it moves slowly from one number to the next in 1 hour.
    topic_code: "3.MD.A.1"
  - front: Minute hand → how to spot it
    back: |
      The long hand. It goes all the way around the clock in 1 hour.
    topic_code: "3.MD.A.1"
  - front: Minutes in 1 hour
    back: |
      60 minutes. The minute hand goes once around the clock: 12 numbers, 5 minutes each.
    topic_code: "3.MD.A.1"
  - front: Minute hand pointing at the 4 → minutes after the hour
    back: |
      20 minutes. Count by 5s for each number: 5, 10, 15, 20.
    topic_code: "3.MD.A.1"
  - front: Minute hand two small marks past the 7 → minutes after the hour
    back: |
      37 minutes. Count by 5s to the 7 (35), then by 1s: 36, 37.
    topic_code: "3.MD.A.1"
  - front: Hour hand between the 5 and the 6 → what hour to say
    back: |
      5. It is after 5:00 and not yet 6:00, so use the number the hour hand has passed.
    topic_code: "3.MD.A.1"
  - front: Hour hand at 4:50 → where it points
    back: |
      Almost at the 5. Nearly a whole hour has passed since 4:00, so the hour hand has moved most of the way from 4 to 5.
    topic_code: "3.MD.A.1"
  - front: Hour hand at 9:30 → where it points
    back: |
      Halfway between the 9 and the 10, because half of the hour has passed.
    topic_code: "3.MD.A.1"
  - front: Elapsed time → what it means
    back: |
      How much time passes from the start of something to its end.
    topic_code: "3.MD.A.1"
  - front: a.m. → when it is
    back: |
      From midnight until noon: the night and the morning.
    topic_code: "3.MD.A.1"
  - front: p.m. → when it is
    back: |
      From noon until midnight: the afternoon and the evening.
    topic_code: "3.MD.A.1"
  - front: Number line for time → how to use it
    back: |
      Mark the start time, then make jumps to the end time. Add the jumps to find the elapsed time.
    topic_code: "3.MD.A.1"
  - front: Elapsed time across the hour → a helpful jump
    back: |
      Jump to the next o'clock first. From 3:40, jump 20 minutes to 4:00, then jump on from there.
    topic_code: "3.MD.A.1"
  - front: 6:45 to 7:10 → elapsed time
    back: |
      25 minutes. 6:45 to 7:00 is 15 minutes, and 7:00 to 7:10 is 10 more: 15 + 10 = 25.
    topic_code: "3.MD.A.1"
  - front: 2:20 plus 30 minutes → end time
    back: |
      2:50. Only the minutes change: 20 + 30 = 50.
    topic_code: "3.MD.A.1"
  - front: 8:50 plus 20 minutes → end time
    back: |
      9:10. 10 minutes gets to 9:00, then 10 more minutes is 9:10.
    topic_code: "3.MD.A.1"
  - front: Ends at 1:15, lasted 30 minutes → start time
    back: |
      12:45. Jump back 15 minutes to 1:00, then 15 more to 12:45.
    topic_code: "3.MD.A.1"
  - front: Why 3:50 to 4:10 is not 60 minutes
    back: |
      Clock times are not regular numbers, so you cannot subtract 350 from 410. There are 60 minutes in an hour, not 100. Count on: 10 minutes to 4:00, 10 more to 4:10, so 20 minutes.
    topic_code: "3.MD.A.1"
  - front: Quarter past and quarter to → what they mean
    back: |
      Quarter past 7 is 7:15. Quarter to 8 is 15 minutes before 8, which is 7:45.
    topic_code: "3.MD.A.1"

quiz:
  description: |
    14 questions · about 25 minutes · reading clocks to the minute, finding how much time has passed and when
    something ends, with jumps on a number line and across the hour, plus review of liters, rulers and two-step
    problems. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word is
    matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w23-q01
      type: multiple_choice
      topic_code: "3.MD.A.1"
      source: "IM K–5 Math Grade 3, Unit 6, Section C"
      points: 1
      figure: figures/w23-clock-347.svg
      figure_alt: "An analog clock with the numbers 1 to 12 and a small mark for every minute. The long minute hand points two small marks past the 9. The short hour hand is between the 3 and the 4, much closer to the 4."
      prompt: |
        What time does the clock show?
      options:
        - "3:47"
        - "4:47"
        - "3:09"
        - "3:45"
      option_explanations:
        - |
          Correct. The hour hand has passed 3 but not reached 4, so the hour is 3. The minute hand is at 45 (the 9) plus 2 small marks: 47.
        - |
          The hour hand is close to the 4 but has not reached it, so it is still the 3 o'clock hour. It is 3:47, not 4:47.
        - |
          The minute hand points near the 9, but each number on the clock means 5 minutes when you read the minute hand: 9 fives is 45.
        - |
          The 9 means 45 minutes, but the minute hand is 2 small marks past the 9, so count on: 46, 47.
      answer: 0

    - slug: g3math-w23-q02
      type: multiple_choice
      topic_code: "3.MD.A.1"
      source: "IM K–5 Math Grade 3, Unit 6, Section C"
      points: 1
      prompt: |
        The minute hand points exactly at the 6. How many minutes after the hour is it?
      options:
        - "6 minutes"
        - "30 minutes"
        - "60 minutes"
        - "36 minutes"
      option_explanations:
        - |
          6 is the number on the clock, but each number stands for 5 minutes. Count by 5s six times.
        - |
          Correct. Count by 5s for each number up to the 6: 5, 10, 15, 20, 25, 30. It is half past the hour.
        - |
          60 minutes is a whole trip around the clock, back to the 12. The 6 is only halfway around.
        - |
          36 mixes the number 6 with counting by 5s. Six jumps of 5 make 30.
      answer: 1

    - slug: g3math-w23-q03
      type: fill_blank
      topic_code: "3.MD.A.1"
      source: "IM K–5 Math Grade 3, Unit 6, Section C"
      points: 1
      prompt: |
        The amount of time that passes from the start of an activity to its end is called ____ time.
      answer: ["elapsed", "elapsed time"]
      explanation: |
        Elapsed time is how much time has passed. Lunch from 12:00 to 12:30 has an elapsed time of 30 minutes.

    - slug: g3math-w23-q04
      type: multiple_choice
      topic_code: "3.MD.A.1"
      source: "IM K–5 Math Grade 3, Unit 6, Section C"
      points: 1
      stimulus: |
        Use the two clocks. They show when Rosa's piano practice started and when it ended.
      figure: figures/w23-clocks-practice.svg
      figure_alt: "Two analog clocks. The clock labeled Start has the long minute hand pointing at the 3 and the short hour hand a little past the 2. The clock labeled End has the long minute hand pointing two small marks past the 10 and the short hour hand almost at the 3."
      prompt: |
        What time did piano practice start?
      options:
        - "2:03"
        - "3:10"
        - "2:15"
        - "2:30"
      option_explanations:
        - |
          The minute hand points at the 3, but each number means 5 minutes: 3 fives is 15, not 3.
        - |
          This mixes up the hands. The long hand on the 3 shows minutes, and the short hand just past the 2 shows the hour.
        - |
          Correct. The short hand is just past 2, so the hour is 2. The long hand is on the 3, which is 15 minutes. Practice started at 2:15.
        - |
          30 minutes would put the long hand on the 6. Here it points at the 3, which is 15 minutes.
      answer: 2

    - slug: g3math-w23-q05
      type: numeric
      topic_code: "3.MD.A.1"
      source: "IM K–5 Math Grade 3, Unit 6, Section C"
      points: 1
      stimulus: |
        Use the two clocks. They show when Rosa's piano practice started and when it ended.
      prompt: |
        How many minutes long was Rosa's piano practice?
      answer: { value: 37, tolerance: 0 }
      explanation: |
        It started at 2:15 and ended at 2:52 (the minute hand is 2 marks past the 10, so 50 + 2 = 52). Both times are in the 2 o'clock hour, so count on from 15 to 52: 52 − 15 = 37 minutes.

    - slug: g3math-w23-q06
      type: multiple_choice
      topic_code: "3.MD.A.1"
      source: "IM K–5 Math Grade 3, Unit 6, Section C"
      points: 1
      figure: figures/w23-number-line-reading.svg
      figure_alt: "A time number line from 4:30 to 5:30 with a tick mark every 5 minutes, labeled 4:30, 4:40, 4:50, 5:00, 5:10, 5:20 and 5:30. Red dots are at 4:35, 5:00 and 5:10. One jump arcs from 4:35 to 5:00, and a second jump arcs from 5:00 to 5:10."
      prompt: |
        Kai started reading at 4:35 and stopped at 5:10. The number line shows his jumps. How long did Kai read?
      options:
        - "25 minutes"
        - "10 minutes"
        - "75 minutes"
        - "35 minutes"
      option_explanations:
        - |
          25 minutes is only the first jump, from 4:35 to 5:00. Add the second jump too.
        - |
          10 minutes is only the second jump, from 5:00 to 5:10. Add the first jump too.
        - |
          75 comes from 510 − 435, as if clock times were regular numbers. An hour has 60 minutes, not 100, so count the jumps instead.
        - |
          Correct. From 4:35 to 5:00 is 25 minutes, and from 5:00 to 5:10 is 10 minutes. 25 + 10 = 35 minutes.
      answer: 3

    - slug: g3math-w23-q07
      type: numeric
      topic_code: "3.MD.A.1"
      source: "IM K–5 Math Grade 3, Unit 6, Section C"
      points: 1
      prompt: |
        Recess starts at 11:40 a.m. and ends at 12:05 p.m. How many minutes long is recess?
      answer: { value: 25, tolerance: 0 }
      explanation: |
        Jump from 11:40 to 12:00: that is 20 minutes. Then jump from 12:00 to 12:05: 5 more minutes. 20 + 5 = 25 minutes.

    - slug: g3math-w23-q08
      type: true_false
      topic_code: "3.MD.A.1"
      source: "IM K–5 Math Grade 3, Unit 6, Section C"
      points: 1
      prompt: |
        True or false: when a clock shows 7:50, the hour hand is very close to the 8.
      answer: true
      explanation: |
        True. At 7:50, 50 of the 60 minutes after 7:00 have passed, so the hour hand has moved most of the way from the 7 to the 8. It is still the 7 o'clock hour.

    - slug: g3math-w23-q09
      type: multi_select
      topic_code: "3.MD.A.1"
      source: "IM K–5 Math Grade 3, Unit 6, Section C"
      points: 2
      partial_credit: true
      prompt: |
        Which of these mean the same time as 8:45? Select all that apply.
      options:
        - "45 minutes after 8"
        - "15 minutes before 9"
        - "quarter past 8"
        - "45 minutes before 9"
        - "quarter to 9"
      option_explanations:
        - |
          Yes. 8:45 means 8 o'clock and 45 more minutes.
        - |
          Yes. From 8:45 it is 15 more minutes to 9:00.
        - |
          No. Quarter past 8 is 15 minutes after 8, which is 8:15.
        - |
          No. 45 minutes before 9 is 8:15. 8:45 is only 15 minutes before 9.
        - |
          Yes. Quarter to 9 means a quarter hour, 15 minutes, before 9, which is 8:45.
      answer: [0, 1, 4]

    - slug: g3math-w23-q10
      type: multiple_choice
      topic_code: "3.MD.A.1"
      source: "IM K–5 Math Grade 3, Unit 6, Section C"
      points: 1
      prompt: |
        A movie at school starts at 1:25 and lasts 50 minutes. What time does it end?
      options:
        - "1:75"
        - "2:15"
        - "2:25"
        - "2:05"
      option_explanations:
        - |
          25 + 50 is 75, but there are only 60 minutes in an hour. After 1:60 comes 2:00, so 1:75 is really 2:15.
        - |
          Correct. Jump 35 minutes from 1:25 to 2:00. That leaves 15 of the 50 minutes, so the movie ends at 2:15.
        - |
          2:25 is a whole hour after 1:25. The movie lasts 50 minutes, 10 minutes less than an hour.
        - |
          From 1:25 to 2:05 is only 40 minutes. The movie needs 10 more minutes.
      answer: 1

    - slug: g3math-w23-q11
      type: short_answer
      topic_code: "3.MD.A.1"
      source: "IM K–5 Math Grade 3, Unit 6, Section C"
      points: 2
      prompt: |
        Ama starts her homework at 6:40 p.m. She does math for 15 minutes, then reading for 20 minutes.

        (a) What time does she finish?
        (b) Show your jumps on a number line or explain how you found it.
      answer: |
        (a) 7:15 p.m.
        (b) Start at 6:40. Jump 15 minutes to 6:55 for math. Then jump 5 minutes to 7:00 and 15 more minutes to 7:15 for reading (5 + 15 = 20).
      explanation: |
        Two points.

        (a) 1 pt: 7:15 (p.m.).

        (b) 1 pt: jumps or steps that add 15 and then 20 minutes to 6:40, crossing 7:00 correctly. Adding 35 minutes in one jump through 7:00 also earns the point. An answer of 6:75 earns no points for (a), but correct jumps still earn (b).

    - slug: g3math-w23-q12
      type: multiple_choice
      topic_code: "3.MD.A.2"
      source: "IM K–5 Math Grade 3, Unit 6, Section B"
      points: 1
      prompt: |
        Which container holds about 1 liter?
      options:
        - "a large water bottle"
        - "a spoon"
        - "a bathtub"
        - "a swimming pool"
      option_explanations:
        - |
          Correct. A large water bottle holds about 1 liter, the same amount we use to picture a liter.
        - |
          A spoon holds only a tiny sip, much less than 1 liter.
        - |
          A bathtub holds a lot of water, more than 100 liters.
        - |
          A swimming pool holds a huge amount of water, many thousands of liters.
      answer: 0

    - slug: g3math-w23-q13
      type: multiple_choice
      topic_code: "3.MD.B.4"
      source: "IM K–5 Math Grade 3, Unit 6, Section A"
      points: 1
      prompt: |
        A shoelace starts at the 0 mark of a ruler. Its other end is exactly halfway between the 7 and the 8. How long is the shoelace?
      options:
        - "7 inches"
        - "8 1/2 inches"
        - "7 1/2 inches"
        - "15 inches"
      option_explanations:
        - |
          7 inches would end right on the 7. The shoelace goes halfway on toward 8.
        - |
          8 1/2 is halfway between 8 and 9, past the end of the shoelace.
        - |
          Correct. Halfway between 7 and 8 is the half-inch mark, 7 1/2 inches.
        - |
          15 adds 7 and 8. The end is between those two marks, so the length is between 7 and 8 inches.
      answer: 2

    - slug: g3math-w23-q14
      type: numeric
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 3, Section D"
      points: 1
      prompt: |
        A class has 4 packs of markers with 6 markers in each pack. The teacher brings 9 more markers. How many markers does the class have now?
      answer: { value: 33, tolerance: 0 }
      explanation: |
        First the packs: 4 × 6 = 24 markers. Then add the new ones: 24 + 9 = 33 markers.
