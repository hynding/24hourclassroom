unit: 6
description: |
  20 questions · about 40 minutes · every part of Unit 6: measuring lengths to the half and quarter inch and
  reading line plots, grams, kilograms and liters, telling time to the minute and finding elapsed time, and
  one-step and two-step measurement word problems. One stimulus set shares a line plot across two questions.
  Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word is matched
  automatically; the short answer is checked by your teacher against the scoring notes.
questions:
  # ---- Length and line plots (3.MD.B.4)
  - slug: g3math-u06-check-q01
    type: multiple_choice
    topic_code: "3.MD.B.4"
    source: "IM K–5 Math Grade 3, Unit 6, Section A"
    points: 1
    figure: figures/u06-ruler-paintbrush.svg
    figure_alt: "A paintbrush lies above a ruler marked from 0 to 5 inches, with long marks at whole inches, middle marks at half inches and short marks at quarter inches. The end of the green handle lines up with 0. The tip of the black bristles lines up with the short mark just before 4."
    prompt: |
      How long is the paintbrush, to the nearest quarter inch?
    options:
      - "3 inches"
      - "3 3/4 inches"
      - "4 inches"
      - "3 1/2 inches"
    option_explanations:
      - |
        The brush goes well past the 3. Its tip is three quarter-inch marks after 3.
      - |
        Correct. The brush starts at 0, and its tip is on the short mark just before 4, which is 3 3/4 inches.
      - |
        The tip stops one quarter inch before the 4, so the brush is a little less than 4 inches.
      - |
        3 1/2 is the middle mark between 3 and 4. The tip goes one more short mark, to 3 3/4.
    answer: 1

  - slug: g3math-u06-check-q02
    type: multiple_choice
    topic_code: "3.MD.B.4"
    source: "IM K–5 Math Grade 3, Unit 6, Section A"
    points: 1
    prompt: |
      A piece of string starts at the 2-inch mark of a ruler and ends at the 5 1/2-inch mark. How long is the string?
    options:
      - "5 1/2 inches"
      - "7 1/2 inches"
      - "3 inches"
      - "3 1/2 inches"
    option_explanations:
      - |
        5 1/2 is where the string ends, but it starts at 2, not 0. Count from 2 instead.
      - |
        7 1/2 adds the start and the end. A length is the distance from the start mark to the end mark.
      - |
        From 2 to 5 is 3 inches, but the string goes on to 5 1/2, so add the last 1/2 inch.
      - |
        Correct. From 2 to 5 is 3 inches, and from 5 to 5 1/2 is 1/2 inch more, so the string is 3 1/2 inches.
    answer: 3

  - slug: g3math-u06-check-q03
    type: numeric
    topic_code: "3.MD.B.4"
    source: "IM K–5 Math Grade 3, Unit 6, Section A"
    points: 1
    stimulus: |
      Use the line plot "Shell Lengths". Each X is one shell measured to the nearest quarter inch.
    figure: figures/u06-line-plot-shells.svg
    figure_alt: "A line plot titled Shell Lengths, with the label Length in inches. The number line is marked 1, 1 1/4, 1 1/2, 1 3/4 and 2. There are 2 X's above 1, 3 X's above 1 1/4, 5 X's above 1 1/2, 1 X above 1 3/4 and 3 X's above 2."
    prompt: |
      How many shells were measured?
    answer: { value: 14, tolerance: 0 }
    explanation: |
      Count every X: 2 + 3 + 5 + 1 + 3 = 14 shells.

  - slug: g3math-u06-check-q04
    type: numeric
    topic_code: "3.MD.B.4"
    source: "IM K–5 Math Grade 3, Unit 6, Section A"
    points: 1
    stimulus: |
      Use the line plot "Shell Lengths". Each X is one shell measured to the nearest quarter inch.
    prompt: |
      How many shells are shorter than 1 1/2 inches?
    answer: { value: 5, tolerance: 0 }
    explanation: |
      Shorter than 1 1/2 means the X's to the left of 1 1/2: 2 above 1 and 3 above 1 1/4. 2 + 3 = 5 shells. The 5 X's on 1 1/2 are not shorter than 1 1/2.

  - slug: g3math-u06-check-q05
    type: true_false
    topic_code: "3.MD.B.4"
    source: "IM K–5 Math Grade 3, Unit 6, Section A"
    points: 1
    prompt: |
      True or false: a line plot that shows the lengths of 10 leaves has exactly 10 X's on it.
    answer: true
    explanation: |
      True. A line plot has one X for each thing measured, so 10 leaves make 10 X's, even when some X's share the same length.

  - slug: g3math-u06-check-q06
    type: multiple_choice
    topic_code: "3.MD.B.4"
    source: "IM K–5 Math Grade 3, Unit 6, Section A"
    points: 1
    prompt: |
      A ruler is marked in quarter inches. How many quarter-inch spaces are there from 0 to 2 inches?
    options:
      - "8"
      - "4"
      - "2"
      - "6"
    option_explanations:
      - |
        Correct. Each inch has 4 quarter-inch spaces, so 2 inches have 4 + 4 = 8.
      - |
        4 is the number of quarter-inch spaces in just 1 inch. There are 2 inches here.
      - |
        2 is the number of whole inches. Each inch is split into 4 quarters.
      - |
        6 counts 4 quarters in the first inch but only 2 in the second. Each inch has 4.
    answer: 0

  # ---- Mass and liquid volume (3.MD.A.2)
  - slug: g3math-u06-check-q07
    type: multiple_choice
    topic_code: "3.MD.A.2"
    source: "IM K–5 Math Grade 3, Unit 6, Section B"
    points: 1
    figure: figures/u06-scale-pumpkin.svg
    figure_alt: "A pumpkin sits on a scale. The scale's number line goes from 0 to 10 kilograms with a mark for every kilogram, and the marks 0, 2, 4, 6, 8 and 10 have numbers. A red pointer is on the unlabeled mark between 6 and 8."
    prompt: |
      What is the mass of the pumpkin?
    options:
      - "6 kilograms"
      - "8 kilograms"
      - "7 kilograms"
      - "7 grams"
    option_explanations:
      - |
        6 is the labeled mark just before the pointer. The pointer is one mark further along.
      - |
        8 is the labeled mark just after the pointer. The pointer stops one mark before it.
      - |
        Correct. Only every other mark has a number, so each mark is 1 kilogram. The mark between 6 and 8 is 7 kilograms.
      - |
        The scale is in kilograms, not grams. 7 grams would be as light as 7 paper clips.
    answer: 2

  - slug: g3math-u06-check-q08
    type: multiple_choice
    topic_code: "3.MD.A.2"
    source: "IM K–5 Math Grade 3, Unit 6, Section B"
    points: 1
    prompt: |
      Which is the best estimate for the mass of a pencil?
    options:
      - "5 grams"
      - "5 kilograms"
      - "5 liters"
      - "500 kilograms"
    option_explanations:
      - |
        Correct. A pencil feels like a few paper clips, and a paper clip is about 1 gram, so about 5 grams.
      - |
        5 kilograms is about as heavy as 5 full water bottles, far too heavy for a pencil.
      - |
        Liters measure liquid volume, how much a container holds, not how heavy a pencil is.
      - |
        500 kilograms is about as heavy as a horse. A pencil is very light.
    answer: 0

  - slug: g3math-u06-check-q09
    type: numeric
    topic_code: "3.MD.A.2"
    source: "IM K–5 Math Grade 3, Unit 6, Section B"
    points: 1
    prompt: |
      A fish tank holds 36 liters. Jo fills it using a jug that holds 4 liters. How many full jugs does Jo pour in to fill the tank?
    answer: { value: 9, tolerance: 0 }
    explanation: |
      How many groups of 4 liters make 36 liters? 36 ÷ 4 = 9, because 9 × 4 = 36. Jo pours 9 jugs.

  - slug: g3math-u06-check-q10
    type: numeric
    topic_code: "3.MD.A.2"
    source: "IM K–5 Math Grade 3, Unit 6, Section B"
    points: 1
    prompt: |
      One bag of sand has a mass of 18 kilograms. Another has a mass of 27 kilograms. What is their total mass, in kilograms?
    answer: { value: 45, tolerance: 0 }
    explanation: |
      Both use kilograms, so add: 18 + 27 = 45 kilograms.

  - slug: g3math-u06-check-q11
    type: fill_blank
    topic_code: "3.MD.A.2"
    source: "IM K–5 Math Grade 3, Unit 6, Section B"
    points: 1
    prompt: |
      Grams and kilograms are units for measuring ____, which is how heavy something is.
    answer: ["mass", "the mass", "weight", "the weight"]
    explanation: |
      Grams and kilograms measure mass. Liters measure liquid volume, and inches measure length.

  # ---- Time (3.MD.A.1)
  - slug: g3math-u06-check-q12
    type: multiple_choice
    topic_code: "3.MD.A.1"
    source: "IM K–5 Math Grade 3, Unit 6, Section C"
    points: 1
    figure: figures/u06-clock-853.svg
    figure_alt: "An analog clock with the numbers 1 to 12 and a small mark for every minute. The long minute hand points three small marks past the 10. The short hour hand is between the 8 and the 9, almost at the 9."
    prompt: |
      Mateo checks the kitchen clock just before dinner. What time is it?
    options:
      - "9:53"
      - "8:53"
      - "8:11"
      - "8:50"
    option_explanations:
      - |
        The hour hand is almost at the 9 but has not reached it, so it is still the 8 o'clock hour.
      - |
        Correct. The hour hand has passed 8 but not reached 9, so the hour is 8. The minute hand is at 50 (the 10) plus 3 small marks: 53.
      - |
        The minute hand is near the 11, but each number means 5 minutes. Count by 5s to the 10 (50), then on by 1s.
      - |
        The 10 means 50 minutes, but the minute hand is 3 small marks past it, so count on: 51, 52, 53.
    answer: 1

  - slug: g3math-u06-check-q13
    type: multiple_choice
    topic_code: "3.MD.A.1"
    source: "IM K–5 Math Grade 3, Unit 6, Section C"
    points: 1
    prompt: |
      A soccer game starts at 3:35 and ends at 4:20. How long is the game?
    options:
      - "45 minutes"
      - "85 minutes"
      - "25 minutes"
      - "20 minutes"
    option_explanations:
      - |
        Correct. From 3:35 to 4:00 is 25 minutes, and from 4:00 to 4:20 is 20 minutes. 25 + 20 = 45 minutes.
      - |
        85 comes from 420 − 335, as if times were regular numbers. An hour has 60 minutes, so count on with jumps.
      - |
        25 minutes only gets from 3:35 to 4:00. Add the time from 4:00 to 4:20.
      - |
        20 minutes is only the part after 4:00. Add the 25 minutes from 3:35 to 4:00.
    answer: 0

  - slug: g3math-u06-check-q14
    type: numeric
    topic_code: "3.MD.A.1"
    source: "IM K–5 Math Grade 3, Unit 6, Section C"
    points: 1
    prompt: |
      Music class starts at 10:05 and ends at 10:47. How many minutes long is music class?
    answer: { value: 42, tolerance: 0 }
    explanation: |
      Both times are in the 10 o'clock hour, so count on from 5 minutes to 47 minutes: 47 − 5 = 42 minutes. (Jumps: 10:05 to 10:45 is 40 minutes, then 2 more.)

  - slug: g3math-u06-check-q15
    type: multiple_choice
    topic_code: "3.MD.A.1"
    source: "IM K–5 Math Grade 3, Unit 6, Section C"
    points: 1
    prompt: |
      Bao starts walking his dog at 5:48 p.m. The walk takes 25 minutes. What time does he get home?
    options:
      - "5:73 p.m."
      - "6:23 p.m."
      - "6:13 p.m."
      - "6:03 p.m."
    option_explanations:
      - |
        48 + 25 is 73, but an hour has only 60 minutes. After 5:59 comes 6:00, so 5:73 is really 6:13.
      - |
        From 5:48 to 6:00 is 12 minutes, which leaves 13 minutes, not 23.
      - |
        Correct. Jump 12 minutes from 5:48 to 6:00. That leaves 25 − 12 = 13 minutes, so he gets home at 6:13.
      - |
        6:03 is only 15 minutes after 5:48. The walk takes 10 minutes longer than that.
    answer: 2

  - slug: g3math-u06-check-q16
    type: multi_select
    topic_code: "3.MD.A.1"
    source: "IM K–5 Math Grade 3, Unit 6, Section C"
    points: 2
    partial_credit: true
    prompt: |
      Which of these show exactly 30 minutes of elapsed time? Select all that apply.
    options:
      - "from 2:10 to 2:40"
      - "from 6:45 to 7:15"
      - "from 11:30 to 12:30"
      - "from 4:50 to 5:10"
      - "from 8:35 to 9:05"
    option_explanations:
      - |
        Yes. Both times are in the 2 o'clock hour, and 40 − 10 = 30 minutes.
      - |
        Yes. 6:45 to 7:00 is 15 minutes, and 7:00 to 7:15 is 15 more: 30 minutes.
      - |
        No. 11:30 to 12:30 is a whole hour, 60 minutes.
      - |
        No. 4:50 to 5:00 is 10 minutes, and 5:00 to 5:10 is 10 more: only 20 minutes.
      - |
        Yes. 8:35 to 9:00 is 25 minutes, and 9:00 to 9:05 is 5 more: 30 minutes.
    answer: [0, 1, 4]

  # ---- Word problems (3.OA.D.8, 3.MD.A.2)
  - slug: g3math-u06-check-q17
    type: multiple_choice
    topic_code: "3.OA.D.8"
    source: "IM K–5 Math Grade 3, Unit 6, Section D"
    points: 1
    prompt: |
      Sara buys 3 bags of rice. Each bag has a mass of 5 kilograms. She uses 4 kilograms for a party. Which equation finds r, the kilograms of rice left?
    options:
      - "(3 + 5) − 4 = r"
      - "(3 × 5) + 4 = r"
      - "5 − (4 × 3) = r"
      - "(3 × 5) − 4 = r"
    option_explanations:
      - |
        3 + 5 adds the number of bags to the mass of one bag. 3 equal bags of 5 kilograms is 3 × 5.
      - |
        Sara uses some rice, so the amount goes down. Take away the 4 kilograms instead of adding it.
      - |
        This starts with one bag and takes away more than it holds. Start with all the rice, 3 × 5 = 15 kilograms.
      - |
        Correct. The rice is 3 × 5 = 15 kilograms, and 4 kilograms are used, so (3 × 5) − 4 = r and r is 11.
    answer: 3

  - slug: g3math-u06-check-q18
    type: numeric
    topic_code: "3.OA.D.8"
    source: "IM K–5 Math Grade 3, Unit 6, Section D"
    points: 1
    prompt: |
      The school juice cooler holds 20 liters. 6 classes each take 3 liters for a picnic. How many liters of juice are left in the cooler?
    answer: { value: 2, tolerance: 0 }
    explanation: |
      Two steps. The classes take 6 × 3 = 18 liters. Then 20 − 18 = 2 liters are left.

  - slug: g3math-u06-check-q19
    type: multiple_choice
    topic_code: "3.OA.D.8"
    source: "IM K–5 Math Grade 3, Unit 6, Section D"
    points: 1
    prompt: |
      Kofi adds the masses of two dogs, 48 kilograms and 29 kilograms, and gets 97 kilograms. Which estimate best checks his answer?
    options:
      - "It is reasonable, because 48 + 29 is about 40 + 20 = 60."
      - "It is not reasonable: 48 is about 50 and 29 is about 30, so the total is about 80, not 97."
      - "It is reasonable, because both numbers are less than 50."
      - "It is not reasonable, because the total must be less than 48."
    option_explanations:
      - |
        48 rounds to 50 and 29 rounds to 30, not 40 and 20. Rounding to the nearest 10 gives about 80.
      - |
        Correct. Rounding gives 50 + 30 = 80, and 97 is far from 80. The exact total is 48 + 29 = 77 kilograms.
      - |
        Two numbers less than 50 can still add up to almost 100, so this does not check the answer.
      - |
        Adding makes a total bigger than each part, so the total must be more than 48, not less.
    answer: 1

  - slug: g3math-u06-check-q20
    type: short_answer
    topic_code: "3.OA.D.8"
    source: "IM K–5 Math Grade 3, Unit 6, Section D"
    points: 3
    prompt: |
      The class garden has 6 rows of beans. Each row needs 4 liters of water. The rain barrel has 30 liters of water.

      (a) How many liters of water do the beans need?
      (b) Is there enough water in the barrel? How many liters are left over or missing?
      (c) Write one equation for part (b) with a letter for the unknown number.
    answer: |
      (a) 24 liters, because 6 × 4 = 24.
      (b) Yes, there is enough. 30 − 24 = 6, so 6 liters are left over.
      (c) 30 − (6 × 4) = w, and w = 6.
    explanation: |
      Three points.

      (a) 1 pt: 24 liters.

      (b) 1 pt: yes, with 6 liters left over (follow through from a wrong (a): full credit for 30 minus their (a) with the right yes or no).

      (c) 1 pt: a correct equation with a letter for the unknown, such as 30 − (6 × 4) = w or 30 − 24 = w. An equation without a letter earns no point.
