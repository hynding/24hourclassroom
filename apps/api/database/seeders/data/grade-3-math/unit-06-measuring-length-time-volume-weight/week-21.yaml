week: 21
unit: 6
title: "Measuring to the Half Inch and Quarter Inch, and Line Plots"
topics: ["3.MD.B.4"]
guide: guides/week-21.md
guide_description: |
  How to measure with a ruler marked in halves and fourths of an inch, how to read a length like 3 1/4 inches,
  what to do when an object does not start at 0, and how to show many measurements on a line plot and answer
  questions from it.
flashcards_description: |
  19 cards on ruler marks (whole, half and quarter inches), reading and writing lengths like 2 3/4 inches,
  measuring from 0, and reading line plots.

flashcards:
  - front: Inch → what it is
    back: |
      A unit for measuring length. A small paper clip is about 1 inch long. Rulers show inches with the numbers 1, 2, 3 and so on.
    topic_code: "3.MD.B.4"
  - front: Half-inch mark on a ruler → where it is
    back: |
      The middle-sized mark exactly halfway between two inch numbers. Halfway between 3 and 4 is 3 1/2 inches.
    topic_code: "3.MD.B.4"
  - front: Quarter-inch marks on a ruler → how many in each inch
    back: |
      Each inch is split into 4 equal parts, so each part is 1/4 inch. The marks go 1/4, 2/4 (the same as 1/2), 3/4, then the next whole inch.
    topic_code: "3.MD.B.4"
  - front: Ruler tick sizes → what each length means
    back: |
      Longest marks are whole inches. Middle marks are half inches. Shortest marks are quarter inches.
    topic_code: "3.MD.B.4"
  - front: 3 1/4 inches → how to say it
    back: |
      "Three and one-fourth inches": 3 whole inches and 1/4 of an inch more.
    topic_code: "3.MD.B.4"
  - front: First short mark after 2 on a quarter-inch ruler → its length
    back: |
      2 1/4 inches.
    topic_code: "3.MD.B.4"
  - front: Mark just before 5 on a quarter-inch ruler → its length
    back: |
      4 3/4 inches. It is one quarter inch less than 5.
    topic_code: "3.MD.B.4"
  - front: 2/4 inch and 1/2 inch → same or different
    back: |
      The same length. Two quarter inches fill the same space as one half inch, so they share one mark on the ruler.
    topic_code: "3.MD.B.4"
  - front: Measuring with a ruler → where to start
    back: |
      Line up one end of the object with the 0 mark, not with the edge of the ruler.
    topic_code: "3.MD.B.4"
  - front: Object starts at 1 inch and ends at 4 inches → its length
    back: |
      3 inches. Count the inch spaces from 1 to 4, or take away: 4 − 1 = 3.
    topic_code: "3.MD.B.4"
  - front: Measuring to the nearest half inch → what it means
    back: |
      Find the whole or half-inch mark the end of the object is closest to, and use that number.
    topic_code: "3.MD.B.4"
  - front: Measuring to the nearest quarter inch → what it means
    back: |
      Find the whole, half or quarter-inch mark the end of the object is closest to. Quarter inches give a more exact length than half inches.
    topic_code: "3.MD.B.4"
  - front: Line plot → what it is
    back: |
      A number line with an X above it for each thing measured. The X goes above that thing's length.
    topic_code: "3.MD.B.4"
  - front: Number line of a line plot → what it needs
    back: |
      Equal spaces and labels that count by the same amount, such as 2, 2 1/4, 2 1/2, 2 3/4, 3, plus a label that names the unit.
    topic_code: "3.MD.B.4"
  - front: Line plot → how many things were measured
    back: |
      Count every X on the plot. Each X is one thing.
    topic_code: "3.MD.B.4"
  - front: Tallest stack of X's on a line plot → what it tells you
    back: |
      The length that came up most often.
    topic_code: "3.MD.B.4"
  - front: Line plot with no X above a number → what it means
    back: |
      Nothing measured had that length. The number still stays on the line so the spaces stay equal.
    topic_code: "3.MD.B.4"
  - front: Line plot → "how many are longer than" a length
    back: |
      Count the X's to the right of that length. Do not count the X's that sit right on it.
    topic_code: "3.MD.B.4"
  - front: Making a line plot → the steps
    back: |
      1. Measure each thing. 2. Draw a number line from the shortest to the longest length, with equal steps. 3. Put one X above the line for each measurement. 4. Add a title and a unit.
    topic_code: "3.MD.B.4"

quiz:
  description: |
    13 questions · about 25 minutes · reading lengths to the half and quarter inch on a ruler, measuring an
    object that does not start at 0, and answering questions from a line plot, plus review of fractions, bar
    graphs and multiplication. Multiple choice, select-all, true/false and number answers are graded at once;
    the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w21-q01
      type: multiple_choice
      topic_code: "3.MD.B.4"
      source: "IM K–5 Math Grade 3, Unit 6, Section A"
      points: 1
      figure: figures/w21-ruler-crayon.svg
      figure_alt: "A crayon lies above a ruler marked from 0 to 6 inches. The ruler has long marks at each whole inch, middle marks at each half inch and short marks at each quarter inch. The flat end of the crayon lines up with 0. Its pointed tip lines up with the first short mark after 4, one quarter inch past 4."
      prompt: |
        How long is the crayon, to the nearest quarter inch?
      options:
        - "4 inches"
        - "4 1/2 inches"
        - "4 1/4 inches"
        - "5 1/4 inches"
      option_explanations:
        - |
          The tip goes past the 4. It ends one small mark after 4, so the crayon is a little more than 4 inches.
        - |
          4 1/2 is the middle-sized mark halfway between 4 and 5. The tip stops sooner, at the first short mark after 4.
        - |
          Correct. The crayon starts at 0 and its tip is on the first quarter-inch mark after 4, so it is 4 1/4 inches long.
        - |
          This counts the 1 mark as the first inch and adds one too many. The crayon starts at 0, so read the mark at its tip: 4 1/4.
      answer: 2

    - slug: g3math-w21-q02
      type: multiple_choice
      topic_code: "3.MD.B.4"
      source: "IM K–5 Math Grade 3, Unit 6, Section A"
      points: 1
      figure: figures/w21-ruler-ribbon.svg
      figure_alt: "A red ribbon lies above a ruler marked from 0 to 5 inches in quarter inches. The left end of the ribbon lines up with the 1 inch mark. The right end lines up with the half-inch mark between 3 and 4."
      prompt: |
        The ribbon does not start at 0. How long is the ribbon?
      options:
        - "3 1/2 inches"
        - "2 1/2 inches"
        - "2 inches"
        - "4 1/2 inches"
      option_explanations:
        - |
          3 1/2 is where the ribbon ends, but it starts at 1, not 0. The first inch of the ruler is not under the ribbon.
        - |
          Correct. From 1 to 3 is 2 whole inches, and from 3 to 3 1/2 is 1/2 inch more, so the ribbon is 2 1/2 inches long.
        - |
          From 1 to 3 is 2 inches, but the ribbon keeps going to the half-inch mark after 3, so add 1/2 inch.
        - |
          This adds the start and the end. To find a length, count the spaces from the start mark to the end mark.
      answer: 1

    - slug: g3math-w21-q03
      type: numeric
      topic_code: "3.MD.B.4"
      source: "IM K–5 Math Grade 3, Unit 6, Section A"
      points: 1
      stimulus: |
        Use the line plot "Leaf Lengths". Each X is one leaf the class measured to the nearest quarter inch.
      figure: figures/w21-line-plot-leaves.svg
      figure_alt: "A line plot titled Leaf Lengths, with the label Length in inches. The number line is marked 2, 2 1/4, 2 1/2, 2 3/4, 3, 3 1/4 and 3 1/2. There is 1 X above 2, 2 X's above 2 1/4, 4 X's above 2 1/2, 3 X's above 2 3/4, 2 X's above 3, no X's above 3 1/4 and 1 X above 3 1/2."
      prompt: |
        How many leaves did the class measure?
      answer: { value: 13, tolerance: 0 }
      explanation: |
        Each X is one leaf. Add the X's: 1 + 2 + 4 + 3 + 2 + 0 + 1 = 13 leaves.

    - slug: g3math-w21-q04
      type: multiple_choice
      topic_code: "3.MD.B.4"
      source: "IM K–5 Math Grade 3, Unit 6, Section A"
      points: 1
      stimulus: |
        Use the line plot "Leaf Lengths". Each X is one leaf the class measured to the nearest quarter inch.
      prompt: |
        Which leaf length did the class measure most often?
      options:
        - "4 inches"
        - "2 3/4 inches"
        - "3 1/2 inches"
        - "2 1/2 inches"
      option_explanations:
        - |
          4 is how many X's are in the tallest stack, not a length. Read the number under that stack.
        - |
          2 3/4 has 3 X's. The stack above 2 1/2 is taller, with 4 X's.
        - |
          3 1/2 is the longest leaf, but only 1 leaf had that length. "Most often" means the tallest stack.
        - |
          Correct. The tallest stack, 4 X's, is above 2 1/2, so 2 1/2 inches came up most often.
      answer: 3

    - slug: g3math-w21-q05
      type: numeric
      topic_code: "3.MD.B.4"
      source: "IM K–5 Math Grade 3, Unit 6, Section A"
      points: 1
      stimulus: |
        Use the line plot "Leaf Lengths". Each X is one leaf the class measured to the nearest quarter inch.
      prompt: |
        How many leaves are longer than 2 3/4 inches?
      answer: { value: 3, tolerance: 0 }
      explanation: |
        Longer than 2 3/4 means the X's to the right of 2 3/4: 2 above 3, 0 above 3 1/4 and 1 above 3 1/2. 2 + 0 + 1 = 3 leaves. The 3 X's on 2 3/4 itself are not longer than 2 3/4.

    - slug: g3math-w21-q06
      type: multi_select
      topic_code: "3.MD.B.4"
      source: "IM K–5 Math Grade 3, Unit 6, Section A"
      points: 2
      partial_credit: true
      prompt: |
        Which are good ways to measure a pencil with a ruler? Select all that apply.
      options:
        - "Line up one end of the pencil with the 0 mark."
        - "If the pencil starts at 0, read the mark at its other end."
        - "Line up the pencil with the edge of the ruler, even if the 0 mark is a little way in."
        - "If the pencil starts at the 2 mark, count the inches from 2 to its other end."
        - "Count all the tick marks under the pencil to get the number of inches."
      option_explanations:
        - |
          Yes. Starting at 0 means the number at the other end is the length.
        - |
          Yes. When the pencil starts at 0, the mark at its other end tells the length.
        - |
          No. On many rulers 0 is a little way in from the edge. Starting at the edge adds a bit of extra length.
        - |
          Yes. If you start at 2, count the inch spaces from 2 to the end, or take away 2 from the end number.
        - |
          No. The tick marks include half and quarter marks, so counting all of them gives far too many inches.
      answer: [0, 1, 3]

    - slug: g3math-w21-q07
      type: true_false
      topic_code: "3.MD.B.4"
      source: "IM K–5 Math Grade 3, Unit 6, Section A"
      points: 1
      prompt: |
        True or false: on a ruler, 3 2/4 inches and 3 1/2 inches are different lengths.
      answer: false
      explanation: |
        False. 2/4 and 1/2 are equivalent fractions: two quarter inches fill the same space as one half inch. So 3 2/4 inches and 3 1/2 inches are the same mark on the ruler.

    - slug: g3math-w21-q08
      type: fill_blank
      topic_code: "3.MD.B.4"
      source: "IM K–5 Math Grade 3, Unit 6, Section A"
      points: 1
      prompt: |
        A graph that shows each measurement as an X above a number line is called a ____.
      answer: ["line plot", "a line plot", "line plots", "dot plot", "a dot plot"]
      explanation: |
        A line plot puts one X above the number line for each thing measured, right above its length. Some books call it a dot plot.

    - slug: g3math-w21-q09
      type: short_answer
      topic_code: "3.MD.B.4"
      source: "IM K–5 Math Grade 3, Unit 6, Section A"
      points: 2
      prompt: |
        Nadia measured 6 pencils to the nearest half inch. Her lengths, in inches, are 5, 5 1/2, 4 1/2, 5, 5 1/2, 5.

        (a) She makes a line plot. How many X's go above 5?
        (b) How much longer is the longest pencil than the shortest pencil? Explain how you know.
      answer: |
        (a) 3 X's, because three of the pencils are 5 inches long.
        (b) 1 inch. The longest is 5 1/2 and the shortest is 4 1/2. From 4 1/2 to 5 is 1/2 inch and from 5 to 5 1/2 is another 1/2 inch, so the difference is 1 whole inch. (Or: both end in 1/2, and 5 − 4 = 1.)
      explanation: |
        Two points.

        (a) 1 pt: 3 X's.

        (b) 1 pt: 1 inch with a reason, such as counting two half-inch jumps from 4 1/2 to 5 1/2 on a number line, or noticing that both end in 1/2 so the difference is 5 − 4. An answer of 1 inch with no reason earns no point.

    - slug: g3math-w21-q10
      type: multiple_choice
      topic_code: "3.NF.A.2"
      source: "IM K–5 Math Grade 3, Unit 5, Section B"
      points: 1
      prompt: |
        A number line from 0 to 1 is split into 4 equal parts. What fraction names the second tick mark after 0?
      options:
        - "2/4"
        - "1/4"
        - "4/2"
        - "2/3"
      option_explanations:
        - |
          Correct. Each part is 1/4. Two parts from 0 is 2 fourths, written 2/4.
        - |
          1/4 is the first tick mark after 0. The second mark is two jumps of 1/4.
        - |
          4/2 swaps the numbers. The bottom number tells how many equal parts make 1 whole, which is 4.
        - |
          The line is split into 4 equal parts, not 3, so the bottom number is 4.
      answer: 0

    - slug: g3math-w21-q11
      type: multiple_choice
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section D"
      points: 1
      prompt: |
        Two ribbons are the same size. Liam cuts 3/4 of one ribbon and Ava cuts 3/8 of the other. Who cuts the longer piece?
      options:
        - "Ava, because 8 is greater than 4"
        - "Liam, because fourths are bigger pieces than eighths"
        - "Neither, because both cut 3 pieces"
        - "Ava, because eighths are bigger pieces than fourths"
      option_explanations:
        - |
          A bigger bottom number means the whole is cut into more parts, so each part is smaller, not bigger.
        - |
          Correct. Both take 3 pieces, but a fourth is bigger than an eighth, so 3/4 is longer than 3/8.
        - |
          Both took 3 pieces, but the pieces are different sizes, so the lengths are not the same.
        - |
          Cutting a ribbon into 8 equal parts makes smaller parts than cutting it into 4, so eighths are smaller.
      answer: 1

    - slug: g3math-w21-q12
      type: numeric
      topic_code: "3.OA.A.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      prompt: |
        The art room has 7 boxes of rulers. Each box holds 6 rulers. How many rulers are there?
      answer: { value: 42, tolerance: 0 }
      explanation: |
        7 equal groups of 6 is 7 × 6 = 42 rulers.

    - slug: g3math-w21-q13
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      prompt: |
        On a bar graph of favorite games, the scale counts by 2s. The bar for jump rope stops halfway between the 8 line and the 10 line. How many students chose jump rope?
      options:
        - "8"
        - "18"
        - "10"
        - "9"
      option_explanations:
        - |
          8 is the line just below the top of the bar. The bar goes past it, to halfway up to 10.
        - |
          18 adds the two line numbers. The value is the number halfway between 8 and 10.
        - |
          10 is the line just above the bar. The bar stops halfway, before it reaches 10.
        - |
          Correct. The scale counts by 2s, so halfway between 8 and 10 is 9.
      answer: 3
