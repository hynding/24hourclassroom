week: 29
unit: 8
title: "Multiplication and Division Facts You Can Trust"
topics: ["3.OA.C.7", "3.NBT.A.3"]
guide: guides/week-29.md
guide_description: |
  A look back at every multiplication and division strategy from the year: facts you know by heart, breaking
  a fact apart, doubling, using a nearby ten, thinking of division as a missing factor, and multiplying by
  multiples of 10 such as 6 × 40.
flashcards_description: |
  20 cards on fact strategies (break apart, double, use 10), square facts, division as a missing factor, fact
  families, the rules for 0 and 1, and multiplying one-digit numbers by 20, 30, 40 and more.

flashcards:
  - front: Fact fluency at the end of the year → what it means
    back: |
      Finding answers correctly and quickly, and being able to pick a strategy that works. If you forget a fact, you can still build it from one you know.
    topic_code: "3.OA.C.7"
  - front: 6 × 7 → build it from 5 × 7
    back: |
      42. Five 7s are 35, and one more 7 makes 35 + 7 = 42.
    topic_code: "3.OA.C.7"
  - front: 8 × 6 → build it by doubling 4 × 6
    back: |
      48. 4 × 6 = 24, and 8 is double 4, so double 24: 24 + 24 = 48.
    topic_code: "3.OA.C.7"
  - front: 9 × 7 → build it from 10 × 7
    back: |
      63. Ten 7s are 70. Nine 7s is one 7 less: 70 − 7 = 63.
    topic_code: "3.OA.C.7"
  - front: 7 × 7 → a square fact
    back: |
      49. A square fact multiplies a number by itself. 7 rows of 7 make a square array.
    topic_code: "3.OA.C.7"
  - front: 8 × 8 → another square fact
    back: |
      64. 8 rows of 8. You can also double 4 × 8 = 32 to get 64.
    topic_code: "3.OA.C.7"
  - front: 6 × 9 → build it from 6 × 10
    back: |
      54. Six 10s are 60. Take away one 6: 60 − 6 = 54.
    topic_code: "3.OA.C.7"
  - front: 56 ÷ 7 → think of the missing factor
    back: |
      8. Ask "7 times what is 56?" Since 7 × 8 = 56, the answer is 8.
    topic_code: "3.OA.C.7"
  - front: 72 ÷ 9 → think of the missing factor
    back: |
      8. Ask "9 times what is 72?" Since 9 × 8 = 72, the answer is 8.
    topic_code: "3.OA.C.7"
  - front: Fact family for 6, 9 and 54 → its four facts
    back: |
      6 × 9 = 54, 9 × 6 = 54, 54 ÷ 6 = 9 and 54 ÷ 9 = 6. The same three numbers make all four facts.
    topic_code: "3.OA.C.7"
  - front: 9 × 1 and 1 × 9 → the rule they show
    back: |
      The number stays the same. 1 group of 9 is 9, so 9 × 1 = 9.
    topic_code: "3.OA.C.7"
  - front: 8 × 0 and 0 × 8 → the rule they show
    back: |
      The product is 0. Zero groups of 8 is nothing at all, so 8 × 0 = 0.
    topic_code: "3.OA.C.7"
  - front: 7 ÷ 7 → the rule it shows
    back: |
      1, as long as the number is not 0. 7 ÷ 7 = 1: 7 cookies shared by 7 friends gives each friend 1.
    topic_code: "3.OA.C.7"
  - front: Checking 42 ÷ 6 = 7 → how to do it
    back: |
      Multiply the answer by the number you divided by: 6 × 7 = 42. It matches, so the division is right.
    topic_code: "3.OA.C.7"
  - front: 5 × 40 → think in tens
    back: |
      200. 40 is 4 tens, so 5 × 4 tens = 20 tens, and 20 tens is 200.
    topic_code: "3.NBT.A.3"
  - front: 7 × 30 → think in tens
    back: |
      210. 30 is 3 tens, so 7 × 3 tens = 21 tens, which is 210.
    topic_code: "3.NBT.A.3"
  - front: 60 × 8 → swap the factors and think in tens
    back: |
      480. 8 × 6 tens = 48 tens, which is 480. Order does not change a product.
    topic_code: "3.NBT.A.3"
  - front: 9 × 80 → the product
    back: |
      720. 9 × 8 = 72, so 9 × 8 tens = 72 tens = 720.
    topic_code: "3.NBT.A.3"
  - front: 6 × 10 and 9 × 10 → what the product shows
    back: |
      How many tens there are. 6 × 10 is 6 tens, which is 60, and 9 × 10 is 9 tens, which is 90. The ones place is 0 because there are no extra ones.
    topic_code: "3.NBT.A.3"
  - front: 6 × 7 → build it by doubling 3 × 7
    back: |
      A 6s fact is double the 3s fact. 3 × 7 = 21, so 6 × 7 = 21 + 21 = 42.
    topic_code: "3.OA.C.7"

quiz:
  description: |
    13 questions · about 25 minutes · multiplication and division facts within 100, strategies for building a
    fact you forget, division as a missing factor, multiplying by multiples of 10, and a picture graph with a
    key of 6. Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word
    is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w29-q01
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the picture graph "Stickers Earned". One star stands for 6 stickers.
      figure: figures/w29-stickers-picture-graph.svg
      figure_alt: "A picture graph titled Stickers Earned. Ines has 7 stars, Tomas has 4 stars and Wen has 9 stars. The key says one star equals 6 stickers."
      prompt: |
        How many stickers did Wen earn?
      options:
        - "9"
        - "15"
        - "54"
        - "48"
      option_explanations:
        - |
          9 is the number of stars in Wen's row, but each star stands for 6 stickers, so you need 9 sixes.
        - |
          15 comes from adding 9 + 6. Each star is a group of 6, so multiply: 9 × 6.
        - |
          Correct. Wen has 9 stars and each star is 6 stickers: 9 × 6 = 54.
        - |
          48 is 8 × 6, one star short. Count Wen's stars again: there are 9, so it is 9 × 6 = 54.
      answer: 2

    - slug: g3math-w29-q02
      type: numeric
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the picture graph "Stickers Earned". One star stands for 6 stickers.
      prompt: |
        How many more stickers did Ines earn than Tomas?
      answer: { value: 18, tolerance: 0 }
      explanation: |
        Ines has 7 stars, so 7 × 6 = 42 stickers. Tomas has 4 stars, so 4 × 6 = 24 stickers. 42 − 24 = 18 more. (Or: Ines has 3 more stars, and 3 × 6 = 18.)

    - slug: g3math-w29-q03
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the picture graph "Stickers Earned". One star stands for 6 stickers.
      prompt: |
        Ravi earned 36 stickers. How many stars should go in Ravi's row?
      options:
        - "6"
        - "36"
        - "30"
        - "7"
      option_explanations:
        - |
          Correct. Each star is 6 stickers, so ask "6 times what is 36?" Since 6 × 6 = 36, Ravi needs 6 stars.
        - |
          36 is the number of stickers. With a key of 6, one star stands for 6 stickers, so you need far fewer stars.
        - |
          30 is 36 − 6, a subtraction. The question is how many groups of 6 make 36, which is 36 ÷ 6.
        - |
          7 stars would stand for 7 × 6 = 42 stickers, which is 6 too many. 6 stars make exactly 36.
      answer: 0

    - slug: g3math-w29-q04
      type: multiple_choice
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 8, Section C"
      points: 1
      figure: figures/w29-array-split.svg
      figure_alt: "An array of dots titled 7 rows of 8. Each row has 8 dots. A dashed line splits it into a top part labeled 5 rows of 8, in blue, and a bottom part labeled 2 rows of 8, in green."
      prompt: |
        Diego split a 7 × 8 array into 5 rows of 8 and 2 rows of 8. What is 7 × 8?
      options:
        - "15"
        - "54"
        - "48"
        - "56"
      option_explanations:
        - |
          15 is 7 + 8, the two factors added. The array has 7 rows with 8 dots in each, so multiply.
        - |
          54 is close but not right. Add the two parts carefully: 5 × 8 = 40 and 2 × 8 = 16, and 40 + 16 = 56.
        - |
          48 is 6 × 8, one row short. The array has 5 rows plus 2 rows, which is 7 rows of 8.
        - |
          Correct. The top part is 5 × 8 = 40 and the bottom part is 2 × 8 = 16. Together 40 + 16 = 56.
      answer: 3

    - slug: g3math-w29-q05
      type: multiple_choice
      topic_code: "3.NBT.A.3"
      source: "IM K–5 Math Grade 3, Unit 8, Section C"
      points: 1
      figure: figures/w29-tens-groups.svg
      figure_alt: "Base-ten blocks titled 4 groups of 3 tens. There are 4 circles, and each circle holds 3 ten-rods. A key shows that one rod equals 1 ten, or 10 ones."
      prompt: |
        The blocks show 4 × 30. What is 4 × 30?
      options:
        - "12"
        - "120"
        - "34"
        - "1,200"
      option_explanations:
        - |
          12 counts the rods (4 × 3 = 12), but each rod is a ten, so the blocks show 12 tens.
        - |
          Correct. 4 groups of 3 tens is 12 tens, and 12 tens is 120.
        - |
          34 puts the 4 and the 30 together by adding. The picture shows 4 equal groups, so multiply.
        - |
          1,200 has one zero too many. 12 tens is 120; 1,200 would be 12 hundreds.
      answer: 1

    - slug: g3math-w29-q06
      type: numeric
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 8, Section C"
      points: 1
      prompt: |
        Mr. Okafor puts 63 crayons into 7 boxes. Each box gets the same number. How many crayons go in each box?
      answer: { value: 9, tolerance: 0 }
      explanation: |
        This is 63 ÷ 7. Think "7 times what is 63?" Since 7 × 9 = 63, each box gets 9 crayons.

    - slug: g3math-w29-q07
      type: multiple_choice
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 8, Section C"
      points: 1
      prompt: |
        Which multiplication fact can help you find 48 ÷ 6?
      options:
        - "6 × 8 = 48"
        - "6 × 7 = 42"
        - "48 − 6 = 42"
        - "6 + 8 = 14"
      option_explanations:
        - |
          Correct. 48 ÷ 6 asks "6 times what is 48?" The fact 6 × 8 = 48 says the answer is 8.
        - |
          6 × 7 = 42 is one group of 6 short of 48. It gets close, but the fact that matches is 6 × 8 = 48.
        - |
          48 − 6 takes away just one 6. Division asks how many 6s fit into 48, which a times fact answers.
        - |
          6 + 8 = 14 is an addition fact. It does not tell how many groups of 6 make 48.
      answer: 0

    - slug: g3math-w29-q08
      type: true_false
      topic_code: "3.NBT.A.3"
      source: "IM K–5 Math Grade 3, Unit 8, Section C"
      points: 1
      prompt: |
        True or false: 6 × 50 = 300.
      answer: true
      explanation: |
        True. 50 is 5 tens, so 6 × 5 tens = 30 tens, and 30 tens is 300.

    - slug: g3math-w29-q09
      type: fill_blank
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 8, Section C"
      points: 1
      prompt: |
        The answer to a division problem is called the ____. In 54 ÷ 9 = 6, it is 6.
      answer: ["quotient", "the quotient", "quotients"]
      explanation: |
        The quotient is the answer when you divide. In 54 ÷ 9 = 6, the quotient is 6. (The answer when you multiply is the product.)

    - slug: g3math-w29-q10
      type: multi_select
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 8, Section C"
      points: 2
      partial_credit: true
      prompt: |
        Which of these are equal to 36? Select all that apply.
      options:
        - "4 × 9"
        - "6 × 6"
        - "7 × 5"
        - "40 ÷ 4"
        - "9 × 4"
      option_explanations:
        - |
          Yes. Four 9s are 9, 18, 27, 36, so 4 × 9 = 36.
        - |
          Yes. 6 × 6 is a square fact: six rows of 6 make 36.
        - |
          No. 7 × 5 = 35, which is one less than 36.
        - |
          No. 40 ÷ 4 = 10, because 4 × 10 = 40. It is not 36.
        - |
          Yes. 9 × 4 has the same factors as 4 × 9 in the other order, so it is also 36.
      answer: [0, 1, 4]

    - slug: g3math-w29-q11
      type: multiple_choice
      topic_code: "3.NBT.A.3"
      source: "IM K–5 Math Grade 3, Unit 8, Section C"
      points: 1
      prompt: |
        The gym has 8 racks. Each rack holds 20 balls. How many balls can the racks hold in all?
      options:
        - "16"
        - "28"
        - "160"
        - "180"
      option_explanations:
        - |
          16 is 8 × 2, but each rack holds 20, which is 2 tens. 8 × 2 tens is 16 tens, or 160.
        - |
          28 adds 8 + 20. There are 8 equal groups of 20, so multiply: 8 × 20.
        - |
          Correct. 8 × 20 = 8 × 2 tens = 16 tens, and 16 tens is 160 balls.
        - |
          180 is 9 × 20, one rack too many. There are 8 racks, so it is 8 × 20 = 160.
      answer: 2

    - slug: g3math-w29-q12
      type: multiple_choice
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 8, Section C"
      points: 1
      prompt: |
        Lena has 42 beads. She puts 7 beads on each bracelet. How many bracelets can she make?
      options:
        - "35"
        - "49"
        - "5"
        - "6"
      option_explanations:
        - |
          35 is 42 − 7, which takes away only one bracelet's beads. Ask how many groups of 7 make 42.
        - |
          49 is 42 + 7. Lena is making groups of 7 from her 42 beads, so divide: 42 ÷ 7.
        - |
          5 bracelets use 5 × 7 = 35 beads, leaving 7 beads, enough for one more bracelet.
        - |
          Correct. 42 ÷ 7 = 6, because 7 × 6 = 42. Lena can make 6 bracelets.
      answer: 3

    - slug: g3math-w29-q13
      type: short_answer
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 8, Section C"
      points: 2
      prompt: |
        Aiko knows that 5 × 9 = 45.

        (a) Use that fact to find 6 × 9.
        (b) Explain how 5 × 9 helped you.
      answer: |
        (a) 6 × 9 = 54.
        (b) 6 groups of 9 is 5 groups of 9 and 1 more group of 9. So 6 × 9 = 45 + 9 = 54.
      explanation: |
        Two points.

        (a) 1 pt: 54.

        (b) 1 pt: an explanation that adds one more 9 to 45, such as "6 nines is 5 nines plus one more nine", or an array of 6 rows of 9 split into 5 rows and 1 row. Another correct strategy (such as 60 − 6) earns the point only if it says why it works.
