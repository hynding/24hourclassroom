week: 31
unit: 8
title: "Solving Problems With Everything We Know"
topics: ["3.OA.D.8"]
guide: guides/week-31.md
guide_description: |
  How to solve two-step word problems with all four operations: read, draw a tape diagram or a picture, write
  an equation with a letter for the unknown, solve, and check that the answer makes sense with an estimate.
  The problems use area, perimeter, time, measurement data and fractions from the whole year.
flashcards_description: |
  18 cards on the steps for solving a word problem, letters for unknowns, choosing the operation, two-step
  equations, estimating to check, and quick reminders of area, perimeter, elapsed time and fractions.

flashcards:
  - front: Two-step story → how to spot one
    back: |
      A word problem that needs two calculations. First find a missing number, then use it to answer the question.
    topic_code: "3.OA.D.8"
  - front: Four-step plan for a word problem → the steps
    back: |
      1. Read it and say what you need to find. 2. Draw a picture or diagram. 3. Write an equation and solve. 4. Check that the answer makes sense.
    topic_code: "3.OA.D.8"
  - front: Letter t in 4 × 6 + 5 = t → what it stands for
    back: |
      A number we do not know yet. In 4 × 6 + 5 = t, the letter t stands for the total.
    topic_code: "3.OA.D.8"
  - front: 3 bags of 7 apples, then 4 more apples → equation
    back: |
      a = 3 × 7 + 4. First 3 × 7 = 21, then 21 + 4 = 25 apples.
    topic_code: "3.OA.D.8"
  - front: 40 pencils, 5 used, the rest shared by 5 friends → equation
    back: |
      p = (40 − 5) ÷ 5. First 40 − 5 = 35, then 35 ÷ 5 = 7 pencils each.
    topic_code: "3.OA.D.8"
  - front: '"Equal groups" in a two-step story → which operation'
    back: |
      Multiply to find the total, or divide to find the number of groups or the size of each group.
    topic_code: "3.OA.D.8"
  - front: '"How many are left" in a two-step story → which operation'
    back: |
      Subtract: start with the whole and take away the part that is gone.
    topic_code: "3.OA.D.8"
  - front: Tape diagram for a two-step story → why draw one
    back: |
      It shows the parts and the whole as boxes, so you can see which number is missing and whether to add, subtract, multiply or divide.
    topic_code: "3.OA.D.8"
  - front: Checking a story answer with an estimate → how
    back: |
      Round the numbers and work out a rough answer. If your real answer is far from the estimate, check your work again.
    topic_code: "3.OA.D.8"
  - front: Answer 175 for 3 × 9 + 48 → reasonable?
    back: |
      No. 3 × 9 is about 30 and 48 is about 50, so the answer should be about 80. The exact answer is 27 + 48 = 75.
    topic_code: "3.OA.D.8"
  - front: 2 + 3 × 4 → which step first
    back: |
      Do the part in parentheses first. With no parentheses, multiply or divide before you add or subtract: 2 + 3 × 4 = 2 + 12 = 14.
    topic_code: "3.OA.D.8"
  - front: Writing 25 apples, not just 25 → why
    back: |
      A number alone is not an answer to a story. Say what it counts: 25 apples, 7 pencils, 40 square feet.
    topic_code: "3.OA.D.8"
  - front: Fence around a 7 ft by 3 ft pen → how much
    back: |
      20 feet. Add all four sides: 7 + 3 + 7 + 3 = 20.
    topic_code: "3.MD.D.8"
  - front: Grass inside a 7 ft by 3 ft pen → how much
    back: |
      21 square feet. Multiply the side lengths: 7 × 3 = 21.
    topic_code: "3.MD.C.7"
  - front: Bus ride from 9:50 to 10:20 → how long
    back: |
      30 minutes. 10 minutes takes you to 10:00, and 20 more takes you to 10:20.
    topic_code: "3.MD.A.1"
  - front: Xs above a number on a line plot → what they count
    back: |
      Each X is one thing measured. Count the Xs above a number to find how many things had that measurement.
    topic_code: "3.MD.B.4"
  - front: Half a pan of cornbread → how many fourths
    back: |
      2 fourths. 1/2 and 2/4 are equal: they mark the same point on a number line and cover the same amount of a pan.
    topic_code: "3.NF.A.3"
  - front: Square feet or feet → which for area and which for perimeter
    back: |
      Area is counted in square units (square feet, square meters). Perimeter and length are counted in units (feet, meters).
    topic_code: "3.MD.D.8"

quiz:
  description: |
    14 questions · about 30 minutes · two-step word problems with all four operations, letters for unknowns,
    estimating to check, and problems about a garden, a bus trip, ribbon lengths, chairs and fractions.
    Multiple choice, select-all, true/false and number answers are graded at once; the fill-in word is matched
    automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w31-q01
      type: multiple_choice
      topic_code: "3.MD.D.8"
      source: "IM K–5 Math Grade 3, Unit 7, Section B"
      points: 1
      stimulus: |
        Use the drawing of the class garden. The garden is a rectangle 8 feet long and 5 feet wide.
      figure: figures/w31-garden.svg
      figure_alt: "A rectangle labeled Class Garden. The long side at the bottom is labeled 8 feet and the short side on the left is labeled 5 feet."
      prompt: |
        The class wants to put a fence all the way around the garden. How many feet of fence do they need?
      options:
        - "13 feet"
        - "21 feet"
        - "26 feet"
        - "40 feet"
      option_explanations:
        - |
          13 feet adds only two sides, 8 + 5. A rectangle has four sides, so the fence must go 8 + 5 + 8 + 5.
        - |
          21 feet adds three sides, 8 + 5 + 8. The fence also needs the last 5-foot side.
        - |
          Correct. The perimeter is 8 + 5 + 8 + 5 = 26 feet.
        - |
          40 is the area, 8 × 5 square feet. A fence goes around the edge, so you need the perimeter.
      answer: 2

    - slug: g3math-w31-q02
      type: numeric
      topic_code: "3.MD.C.7"
      source: "IM K–5 Math Grade 3, Unit 2, Section B"
      points: 1
      stimulus: |
        Use the drawing of the class garden. The garden is a rectangle 8 feet long and 5 feet wide.
      prompt: |
        What is the area of the garden, in square feet?
      answer: { value: 40, tolerance: 0 }
      explanation: |
        Area of a rectangle = length × width = 8 × 5 = 40 square feet. (Rows of 8 unit squares, 5 rows.)

    - slug: g3math-w31-q03
      type: multiple_choice
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 8, Section D"
      points: 1
      stimulus: |
        Use the drawing of the class garden. The garden is a rectangle 8 feet long and 5 feet wide.
      prompt: |
        The class uses half of the garden's area for beans. They plant 4 bean seeds in every square foot of the bean part. How many bean seeds do they plant?
      options:
        - "80"
        - "160"
        - "44"
        - "20"
      option_explanations:
        - |
          Correct. Half of 40 square feet is 20 square feet, and 20 × 4 = 80 seeds.
        - |
          160 is 40 × 4, seeds for the whole garden. Only half of the garden is beans, which is 20 square feet.
        - |
          44 adds 40 + 4. Each square foot gets 4 seeds, so multiply the number of square feet by 4.
        - |
          20 is the area of the bean part, the first step. The second step is 20 × 4 seeds.
      answer: 0

    - slug: g3math-w31-q04
      type: multiple_choice
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 8, Section D"
      points: 1
      prompt: |
        Amir has 3 packs of 8 markers. He gives 5 markers to his sister. Which equation shows m, the number of markers Amir has left?
      options:
        - "m = 3 + 8 − 5"
        - "m = 3 × 8 + 5"
        - "m = 3 × 5 − 8"
        - "m = 3 × 8 − 5"
      option_explanations:
        - |
          3 + 8 adds the number of packs to the size of a pack. 3 packs of 8 is 3 equal groups, so multiply.
        - |
          This adds the 5 markers, but Amir gives them away, so they should be taken away.
        - |
          3 × 5 mixes up the numbers. The packs hold 8 each, so the total is 3 × 8, and then 5 are given away.
        - |
          Correct. 3 × 8 = 24 markers in all, then 24 − 5 = 19 left, so m = 19.
      answer: 3

    - slug: g3math-w31-q05
      type: numeric
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 8, Section D"
      points: 1
      prompt: |
        A baker makes 5 trays of muffins with 6 muffins on each tray. She sells 17 muffins. How many muffins are left?
      answer: { value: 13, tolerance: 0 }
      explanation: |
        Step 1: 5 × 6 = 30 muffins. Step 2: 30 − 17 = 13 muffins left. Equation: m = 5 × 6 − 17 = 13.

    - slug: g3math-w31-q06
      type: multiple_choice
      topic_code: "3.MD.A.1"
      source: "IM K–5 Math Grade 3, Unit 6, Section C"
      points: 1
      figure: figures/w31-clock.svg
      figure_alt: "An analog clock. The short hour hand is a little past halfway from 10 to 11. The long minute hand points at the 7, which is 35 minutes. The clock shows 10:35."
      prompt: |
        The field trip bus left school at the time on the clock. The ride took 40 minutes. What time did the bus arrive?
      options:
        - "10:75"
        - "11:15"
        - "11:05"
        - "10:15"
      option_explanations:
        - |
          10:75 adds 35 + 40 = 75 minutes, but an hour has only 60 minutes. 75 minutes is 1 hour and 15 minutes, so it is 11:15.
        - |
          Correct. From 10:35, 25 minutes gets to 11:00, and 15 more minutes makes 40. The bus arrived at 11:15.
        - |
          11:05 is only 30 minutes after 10:35. The ride took 40 minutes, so it is 10 minutes later: 11:15.
        - |
          10:15 is earlier than the start time. The bus arrives after it leaves, so count forward 40 minutes.
      answer: 1

    - slug: g3math-w31-q07
      type: multiple_choice
      topic_code: "3.MD.B.4"
      source: "IM K–5 Math Grade 3, Unit 6, Section A"
      points: 1
      stimulus: |
        Use the line plot "Lengths of Ribbon Pieces". Each X is one piece of ribbon.
      figure: figures/w31-ribbon-line-plot.svg
      figure_alt: "A line plot titled Lengths of Ribbon Pieces, labeled Length (inches). The number line is marked 3, 3 1/4, 3 1/2, 3 3/4 and 4. There are 2 Xs above 3, 1 X above 3 1/4, 4 Xs above 3 1/2, 2 Xs above 3 3/4 and 1 X above 4."
      prompt: |
        How many ribbon pieces are longer than 3 1/4 inches?
      options:
        - "8"
        - "7"
        - "4"
        - "10"
      option_explanations:
        - |
          8 includes the piece that is exactly 3 1/4 inches. "Longer than" means only the pieces to the right of 3 1/4.
        - |
          Correct. 3 1/2 has 4, 3 3/4 has 2 and 4 has 1. 4 + 2 + 1 = 7 pieces.
        - |
          4 counts only the 3 1/2-inch pieces. The 3 3/4-inch and 4-inch pieces are also longer than 3 1/4 inches.
        - |
          10 is every piece on the line plot. The 3-inch and 3 1/4-inch pieces are not longer than 3 1/4 inches.
      answer: 1

    - slug: g3math-w31-q08
      type: numeric
      topic_code: "3.MD.B.4"
      source: "IM K–5 Math Grade 3, Unit 6, Section A"
      points: 1
      stimulus: |
        Use the line plot "Lengths of Ribbon Pieces". Each X is one piece of ribbon.
      prompt: |
        How many more pieces are 3 1/2 inches long than are 3 inches long?
      answer: { value: 2, tolerance: 0 }
      explanation: |
        There are 4 Xs above 3 1/2 and 2 Xs above 3. 4 − 2 = 2 more pieces.

    - slug: g3math-w31-q09
      type: numeric
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 3, Section B"
      points: 1
      prompt: |
        Hillside School has 438 students. 196 students go on a field trip. How many students stay at school?
      answer: { value: 242, tolerance: 0 }
      explanation: |
        438 − 196. Count up: 196 + 4 = 200, 200 + 200 = 400, 400 + 38 = 438. 4 + 200 + 38 = 242 students. Check: 242 + 196 = 438.

    - slug: g3math-w31-q10
      type: multiple_choice
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 1
      prompt: |
        Mr. Haddad sets up 36 chairs in rows of 9. How many rows does he make?
      options:
        - "27"
        - "5"
        - "45"
        - "4"
      option_explanations:
        - |
          27 is 36 − 9, which takes away only one row. Ask how many 9s make 36.
        - |
          5 rows of 9 would be 45 chairs, which is 9 more than he has.
        - |
          45 is 36 + 9. The chairs are being put into equal rows, so divide: 36 ÷ 9.
        - |
          Correct. 36 ÷ 9 = 4, because 9 × 4 = 36.
      answer: 3

    - slug: g3math-w31-q11
      type: true_false
      topic_code: "3.OA.D.9"
      source: "IM K–5 Math Grade 3, Unit 1, Section C"
      points: 1
      prompt: |
        True or false: 7 × 6 is an odd number because 7 is odd.
      answer: false
      explanation: |
        False. 7 × 6 = 42, which is even. A product is odd only when both factors are odd. Since 6 is even, 7 groups of 6 can always be split into pairs.

    - slug: g3math-w31-q12
      type: fill_blank
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 3, Section D"
      points: 1
      prompt: |
        A rough answer you work out with rounded numbers, to check if a real answer makes sense, is called an ____.
      answer: ["estimate", "estimation", "an estimate", "estimates"]
      explanation: |
        An estimate is a close guess made with friendly numbers. For 296 + 507, the estimate 300 + 500 = 800 shows an answer near 800 makes sense.

    - slug: g3math-w31-q13
      type: multi_select
      topic_code: "3.NF.A.3"
      source: "IM K–5 Math Grade 3, Unit 5, Section C"
      points: 2
      partial_credit: true
      prompt: |
        Sofia shares a pan of cornbread with her family. Which fractions are equal to 1/2? Select all that apply.
      options:
        - "2/4"
        - "3/6"
        - "4/8"
        - "2/3"
        - "1/4"
      option_explanations:
        - |
          Yes. 2 of 4 equal parts is the same amount as 1 of 2 equal parts.
        - |
          Yes. 3 of 6 equal parts covers half of the whole, so 3/6 = 1/2.
        - |
          Yes. 4 of 8 equal parts is half of 8 parts, so 4/8 = 1/2.
        - |
          No. 2/3 is more than half. On a number line it is past the middle of 0 and 1.
        - |
          No. 1/4 is half of a half, so it is less than 1/2.
      answer: [0, 1, 2]

    - slug: g3math-w31-q14
      type: short_answer
      topic_code: "3.OA.D.8"
      source: "IM K–5 Math Grade 3, Unit 8, Section D"
      points: 2
      prompt: |
        The art club has 64 crayons. They buy 2 more boxes with 8 crayons in each box. Then they share all the crayons equally among 8 tables.

        (a) Write an equation with a letter for the number of crayons each table gets.
        (b) Solve it. Show both steps.
      answer: |
        (a) c = (64 + 2 × 8) ÷ 8.
        (b) 2 × 8 = 16 new crayons. 64 + 16 = 80 crayons in all. 80 ÷ 8 = 10, so each table gets 10 crayons.
      explanation: |
        Two points.

        (a) 1 pt: an equation that uses a letter for the unknown and both steps, such as c = (64 + 16) ÷ 8 or two equations 64 + 2 × 8 = t and t ÷ 8 = c.

        (b) 1 pt: 10 crayons, with both steps shown (finding 80 in all, then dividing by 8).
