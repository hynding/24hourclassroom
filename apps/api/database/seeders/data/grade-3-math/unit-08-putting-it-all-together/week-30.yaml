week: 30
unit: 8
title: "Adding and Subtracting Within 1,000, and Number Patterns"
topics: ["3.NBT.A.2", "3.OA.D.9"]
guide: guides/week-30.md
guide_description: |
  A look back at adding and subtracting three-digit numbers: place value, regrouping, counting up on an open
  number line and checking with the opposite operation, then patterns in the addition and multiplication
  tables, such as odd and even sums.
flashcards_description: |
  19 cards on regrouping, counting up to subtract, checking with addition, making friendly numbers, odd and
  even patterns, and patterns in the addition and multiplication tables.

flashcards:
  - front: 47 + 25 → why the ones need regrouping
    back: |
      Trading 10 ones for 1 ten, or 10 tens for 1 hundred, when a place gets 10 or more. In 47 + 25, 7 + 5 = 12 ones, which is 1 ten and 2 ones.
    topic_code: "3.NBT.A.2"
  - front: 524 − 263 → why a hundred is traded
    back: |
      When the tens on top are fewer than the tens you take away. In 524 − 263, trade 1 hundred for 10 tens: 4 hundreds and 12 tens.
    topic_code: "3.NBT.A.2"
  - front: 600 − 258 → count up from 258
    back: |
      342. 258 + 2 = 260, 260 + 40 = 300, 300 + 300 = 600. The jumps 2 + 40 + 300 = 342.
    topic_code: "3.NBT.A.2"
  - front: Checking 523 − 186 = 337 → how to do it
    back: |
      Add the answer to the number you took away: 337 + 186 = 523. It matches, so the subtraction is right.
    topic_code: "3.NBT.A.2"
  - front: 298 + 145 → make a friendly number
    back: |
      443. Move 2 from 145 to 298: 300 + 143 = 443.
    topic_code: "3.NBT.A.2"
  - front: 356 + 228 → add place by place
    back: |
      584. Hundreds 300 + 200 = 500, tens 50 + 20 = 70, ones 6 + 8 = 14. Then 500 + 70 + 14 = 584.
    topic_code: "3.NBT.A.2"
  - front: 700 − 248 → subtract across zeros
    back: |
      452. Trade 1 hundred for 10 tens, then 1 ten for 10 ones: 6 hundreds, 9 tens, 10 ones. 10 − 8 = 2, 9 − 4 = 5, 6 − 2 = 4.
    topic_code: "3.NBT.A.2"
  - front: Jumps on an open number line → how to read the answer
    back: |
      A line with no fixed scale where you draw jumps to add or subtract. Mark where you start, show each jump, and add up the jumps.
    topic_code: "3.NBT.A.2"
  - front: 250 + 175 = 425 → the two subtraction facts it gives
    back: |
      They undo each other. If 250 + 175 = 425, then 425 − 175 = 250 and 425 − 250 = 175.
    topic_code: "3.NBT.A.2"
  - front: Ones digit 0, 2, 4, 6 or 8 → odd or even?
    back: |
      It can be split into 2 equal groups with none left over. Its ones digit is 0, 2, 4, 6 or 8.
    topic_code: "3.OA.D.9"
  - front: Ones digit 1, 3, 5, 7 or 9 → odd or even?
    back: |
      Split into 2 equal groups, it has 1 left over. Its ones digit is 1, 3, 5, 7 or 9.
    topic_code: "3.OA.D.9"
  - front: 7 + 5 → why odd plus odd is even
    back: |
      Always even. Each odd number has one left over, and the two leftovers make a pair. 7 + 5 = 12.
    topic_code: "3.OA.D.9"
  - front: 8 + 5 → why even plus odd is odd
    back: |
      Always odd. The even number makes pairs, and the odd number still has one left over. 8 + 5 = 13.
    topic_code: "3.OA.D.9"
  - front: 4 + 4, 5 + 5, 6 + 6 in the addition table → the pattern
    back: |
      The doubles (4 + 4, 5 + 5, 6 + 6) run corner to corner and are all even. Each one is 2 more than the one before: 8, 10, 12.
    topic_code: "3.OA.D.9"
  - front: 5 + 6 then 5 + 7 in the addition table → what changes
    back: |
      The sum goes up by 1, because you add 1 more. 5 + 6 = 11 and 5 + 7 = 12.
    topic_code: "3.OA.D.9"
  - front: 5, 10, 15, 20, 25 → the ones-digit pattern
    back: |
      The ones digits go 5, 0, 5, 0: 5, 10, 15, 20, 25, 30.
    topic_code: "3.OA.D.9"
  - front: 4 × 7 and 6 × 9 → why both products are even
    back: |
      Always even. 4 × 7 = 28 and 6 × 9 = 54. Only odd × odd gives an odd product, like 3 × 5 = 15.
    topic_code: "3.OA.D.9"
  - front: 352 + 100 → which digit changes
    back: |
      Only the hundreds digit goes up by 1. 352 + 100 = 452.
    topic_code: "3.NBT.A.2"
  - front: Is 296 + 507 = 703 reasonable? → check with rounding
    back: |
      No. 296 is about 300 and 507 is about 500, so the sum is about 800. The real sum is 803.
    topic_code: "3.NBT.A.2"

quiz:
  description: |
    13 questions · about 25 minutes · adding and subtracting within 1,000 with regrouping, counting up on an
    open number line, a bar graph of cans collected, odd and even patterns, and review of multiplying by
    multiples of 10, division and rounding. Multiple choice, select-all, true/false and number answers are
    graded at once; the fill-in word is matched automatically; the short answer is checked by your teacher.
  questions:
    - slug: g3math-w30-q01
      type: multiple_choice
      topic_code: "3.MD.B.3"
      source: "IM K–5 Math Grade 3, Unit 1, Section A"
      points: 1
      stimulus: |
        Use the bar graph "Cans Collected". The scale counts by 50s.
      figure: figures/w30-cans-bar-graph.svg
      figure_alt: "A bar graph titled Cans Collected. The side scale goes 0, 50, 100, 150, 200, 250, 300, 350 and is labeled Number of cans. Room 12 reaches 250. Room 14 stops halfway between 150 and 200, at 175. Room 16 reaches 300. Room 18 stops halfway between 100 and 150, at 125."
      prompt: |
        How many cans did Room 14 collect?
      options:
        - "150"
        - "175"
        - "200"
        - "125"
      option_explanations:
        - |
          150 is the line just below the top of the bar. The bar goes past 150, halfway up to 200.
        - |
          Correct. The bar stops halfway between 150 and 200, and halfway between them is 175.
        - |
          200 is the line just above the bar. The bar stops halfway there, so it is less than 200.
        - |
          125 is where Room 18's bar stops. Room 14's bar is one line higher, at 175.
      answer: 1

    - slug: g3math-w30-q02
      type: multiple_choice
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 8, Section C"
      points: 1
      stimulus: |
        Use the bar graph "Cans Collected". The scale counts by 50s.
      prompt: |
        How many cans did Room 12 and Room 14 collect together?
      options:
        - "325"
        - "75"
        - "500"
        - "425"
      option_explanations:
        - |
          325 forgets the regrouped hundred. 5 tens + 7 tens = 12 tens, which is 1 hundred and 2 tens, so the hundreds become 2 + 1 + 1 = 4.
        - |
          75 is 250 − 175, a subtraction. "Together" means add the two rooms.
        - |
          500 is an estimate (about 300 + 200). The exact sum is 250 + 175 = 425.
        - |
          Correct. 250 + 175: 200 + 100 = 300, 50 + 75 = 125, and 300 + 125 = 425.
      answer: 3

    - slug: g3math-w30-q03
      type: numeric
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 8, Section C"
      points: 1
      stimulus: |
        Use the bar graph "Cans Collected". The scale counts by 50s.
      prompt: |
        How many more cans did Room 16 collect than Room 18?
      answer: { value: 175, tolerance: 0 }
      explanation: |
        Room 16 has 300 and Room 18 has 125. 300 − 125: count up from 125 by 75 to reach 200, then 100 more to reach 300. 75 + 100 = 175 more cans.

    - slug: g3math-w30-q04
      type: numeric
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 8, Section C"
      points: 1
      prompt: |
        The school library has 612 books. 245 books are checked out. How many books are still on the shelves?
      answer: { value: 367, tolerance: 0 }
      explanation: |
        612 − 245. Trade 1 ten for 10 ones: 12 − 5 = 7 ones. Trade 1 hundred for 10 tens: 10 − 4 = 6 tens. Then 5 − 2 = 3 hundreds. 367 books. Check: 367 + 245 = 612.

    - slug: g3math-w30-q05
      type: multiple_choice
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 8, Section C"
      points: 1
      figure: figures/w30-number-line.svg
      figure_alt: "An open number line titled Counting up from 278 to 503. It is marked 278, 300, 500 and 503. Three jumps are drawn: plus 22 from 278 to 300, plus 200 from 300 to 500, and plus 3 from 500 to 503."
      prompt: |
        Kai found 503 − 278 by counting up on the number line. What is 503 − 278?
      options:
        - "225"
        - "375"
        - "325"
        - "781"
      option_explanations:
        - |
          Correct. Add the jumps: 22 + 200 + 3 = 225. Check: 278 + 225 = 503.
        - |
          375 takes the smaller digit from the bigger digit in each place (8 − 3, 7 − 0, 5 − 2). You must regroup instead.
        - |
          325 forgets that a hundred was traded away. After regrouping, 503 has 4 hundreds, so 4 − 2 = 2 hundreds.
        - |
          781 is 503 + 278, the two numbers added. The question asks for the difference.
      answer: 0

    - slug: g3math-w30-q06
      type: multiple_choice
      topic_code: "3.OA.D.9"
      source: "IM K–5 Math Grade 3, Unit 8, Section C"
      points: 1
      figure: figures/w30-addition-table.svg
      figure_alt: "Part of the addition table. The top row and left column each show 4, 5, 6, 7. The sums fill the grid. The shaded squares run corner to corner: 4 + 4 = 8, 5 + 5 = 10, 6 + 6 = 12 and 7 + 7 = 14."
      prompt: |
        The shaded squares show the doubles. What pattern do the shaded numbers follow?
      options:
        - "They go up by 1."
        - "They are all odd."
        - "They go up by 2 and are all even."
        - "They are all less than 10."
      option_explanations:
        - |
          Moving one square right in a row goes up by 1, but the shaded numbers go 8, 10, 12, 14, which is up by 2.
        - |
          8, 10, 12 and 14 end in 8, 0, 2 and 4, so they are even. A double is two equal groups, so it is always even.
        - |
          Correct. 8, 10, 12, 14 go up by 2 each time, and every double is even because it is two equal groups.
        - |
          Only 8 is less than 10. The shaded numbers are 8, 10, 12 and 14.
      answer: 2

    - slug: g3math-w30-q07
      type: true_false
      topic_code: "3.OA.D.9"
      source: "IM K–5 Math Grade 3, Unit 8, Section C"
      points: 1
      prompt: |
        True or false: when you add two odd numbers, the sum is always even.
      answer: true
      explanation: |
        True. Each odd number has one left over when you make pairs. The two leftovers make one more pair, so nothing is left over. For example 7 + 9 = 16 and 15 + 3 = 18.

    - slug: g3math-w30-q08
      type: fill_blank
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 8, Section C"
      points: 1
      prompt: |
        In 348 + 236, the ones make 8 + 6 = 14. Trading 10 of those ones for 1 ten is called ____.
      answer: ["regrouping", "regroup", "regrouped", "trading", "composing a ten", "making a ten", "carrying"]
      explanation: |
        Regrouping means trading 10 ones for 1 ten (or 10 tens for 1 hundred). The 14 ones become 1 ten and 4 ones, so the sum is 584.

    - slug: g3math-w30-q09
      type: multi_select
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 8, Section C"
      points: 2
      partial_credit: true
      prompt: |
        Which of these have an answer of exactly 500? Select all that apply.
      options:
        - "275 + 225"
        - "632 − 132"
        - "350 + 250"
        - "800 − 300"
        - "461 + 49"
      option_explanations:
        - |
          Yes. 75 + 25 = 100 and 200 + 200 = 400, so 275 + 225 = 500.
        - |
          Yes. Taking 132 from 632 leaves 500, because the tens and ones match.
        - |
          No. 350 + 250 = 600. The 50 and 50 make another hundred.
        - |
          Yes. 8 hundreds − 3 hundreds = 5 hundreds, which is 500.
        - |
          No. 461 + 49 = 510. 461 + 39 would be 500, but 49 is 10 more.
      answer: [0, 1, 3]

    - slug: g3math-w30-q10
      type: multiple_choice
      topic_code: "3.NBT.A.3"
      source: "IM K–5 Math Grade 3, Unit 4, Section C"
      points: 1
      prompt: |
        What is 6 × 70?
      options:
        - "42"
        - "76"
        - "480"
        - "420"
      option_explanations:
        - |
          42 is 6 × 7, but 70 is 7 tens. 6 × 7 tens is 42 tens, which is 420.
        - |
          76 is 6 + 70. The × sign means 6 groups of 70, so multiply.
        - |
          480 is 6 × 80, one ten too many in each group. 6 × 70 = 6 × 7 tens = 420.
        - |
          Correct. 6 × 7 tens = 42 tens, and 42 tens is 420.
      answer: 3

    - slug: g3math-w30-q11
      type: multiple_choice
      topic_code: "3.OA.C.7"
      source: "IM K–5 Math Grade 3, Unit 4, Section D"
      points: 1
      prompt: |
        Which number makes this true? 8 × ___ = 56
      options:
        - "6"
        - "7"
        - "48"
        - "64"
      option_explanations:
        - |
          8 × 6 = 48, which is one group of 8 short of 56.
        - |
          Correct. 8 × 7 = 56, so 7 is the missing factor. That also means 56 ÷ 8 = 7.
        - |
          48 is 56 − 8. The blank is a factor, the number of 8s it takes to make 56.
        - |
          64 is 8 × 8 or 56 + 8. The missing factor is how many 8s make 56, which is 7.
      answer: 1

    - slug: g3math-w30-q12
      type: multiple_choice
      topic_code: "3.NBT.A.1"
      source: "IM K–5 Math Grade 3, Unit 3, Section C"
      points: 1
      prompt: |
        Nadia wants to estimate 389 + 412 by rounding each number to the nearest hundred. Which estimate does she get?
      options:
        - "800"
        - "700"
        - "900"
        - "801"
      option_explanations:
        - |
          Correct. 389 rounds up to 400 and 412 rounds down to 400, and 400 + 400 = 800.
        - |
          700 rounds 389 down to 300, but 389 is closer to 400 because its tens digit is 8.
        - |
          900 rounds 412 up to 500, but 412 is closer to 400 because its tens digit is 1.
        - |
          801 is the exact sum. An estimate uses the rounded numbers, 400 + 400 = 800.
      answer: 0

    - slug: g3math-w30-q13
      type: short_answer
      topic_code: "3.NBT.A.2"
      source: "IM K–5 Math Grade 3, Unit 8, Section C"
      points: 2
      prompt: |
        A farm stand had 400 apples in the morning. By noon, 163 apples were sold.

        (a) How many apples were left at noon?
        (b) Show how to use addition to check your answer.
      answer: |
        (a) 237 apples. Count up from 163: + 7 is 170, + 30 is 200, + 200 is 400. 7 + 30 + 200 = 237.
        (b) 237 + 163 = 400. The sum is the number we started with, so the answer is right.
      explanation: |
        Two points.

        (a) 1 pt: 237, found by any correct method (counting up, regrouping across the zeros, or a number line).

        (b) 1 pt: adds 237 + 163 (or 163 + 237) and shows it makes 400.
