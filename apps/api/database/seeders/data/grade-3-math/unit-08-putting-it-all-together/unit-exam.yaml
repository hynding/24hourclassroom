unit: 8
description: |
  18 questions · about 35 minutes · every standard of Unit 8: multiplication and division facts within 100
  (3.OA.C.7), multiplying by multiples of 10 (3.NBT.A.3), adding and subtracting within 1,000 (3.NBT.A.2),
  patterns in the addition and multiplication tables (3.OA.D.9) and two-step word problems (3.OA.D.8). One
  stimulus set shares a bar graph across three questions. Multiple choice, select-all, true/false and number
  answers are graded at once; the fill-in word is matched automatically; the short answer is checked by your
  teacher against the scoring notes.
questions:
  # ---- Multiplication and division facts (3.OA.C.7)
  - slug: g3math-u08-check-q01
    type: multiple_choice
    topic_code: "3.OA.C.7"
    source: "IM K–5 Math Grade 3, Unit 8, Section C"
    points: 1
    prompt: |
      What is 7 × 9?
    options:
      - "56"
      - "72"
      - "63"
      - "16"
    option_explanations:
      - |
        56 is 7 × 8, one group of 7 short. Try 10 × 7 = 70, then take away one 7: 70 − 7 = 63.
      - |
        72 is 8 × 9, one group of 9 too many. 7 nines are 63.
      - |
        Correct. 7 × 10 = 70, and 7 × 9 is one 7 less: 70 − 7 = 63.
      - |
        16 is 7 + 9, the factors added. The × sign means 7 groups of 9, so multiply.
    answer: 2

  - slug: g3math-u08-check-q02
    type: multiple_choice
    topic_code: "3.OA.C.7"
    source: "IM K–5 Math Grade 3, Unit 8, Section C"
    points: 1
    prompt: |
      Zara puts 81 stickers onto 9 pages, the same number on each page. How many stickers go on each page?
    options:
      - "9"
      - "72"
      - "8"
      - "90"
    option_explanations:
      - |
        Correct. 81 ÷ 9 asks "9 times what is 81?" Since 9 × 9 = 81, each page gets 9 stickers.
      - |
        72 is 81 − 9, which takes away only one page of stickers. Share 81 equally into 9 groups instead.
      - |
        8 stickers on each of 9 pages uses only 72 stickers. There are 9 stickers left, enough for one more on each page.
      - |
        90 is 81 + 9. Sharing into equal groups is division, not addition.
    answer: 0

  - slug: g3math-u08-check-q03
    type: numeric
    topic_code: "3.OA.C.7"
    source: "IM K–5 Math Grade 3, Unit 8, Section C"
    points: 1
    prompt: |
      What number makes this equation true? 6 × ___ = 48
    answer: { value: 8, tolerance: 0 }
    explanation: |
      Ask "6 times what is 48?" 6 × 8 = 48, so the missing factor is 8. It is the same as 48 ÷ 6 = 8.

  - slug: g3math-u08-check-q04
    type: multiple_choice
    topic_code: "3.OA.C.7"
    source: "IM K–5 Math Grade 3, Unit 8, Section C"
    points: 1
    prompt: |
      Which fact is in the same fact family as 4 × 7 = 28?
    options:
      - "28 − 7 = 21"
      - "4 + 7 = 11"
      - "28 ÷ 2 = 14"
      - "28 ÷ 7 = 4"
    option_explanations:
      - |
        28 − 7 uses two of the numbers but subtracts. A multiplication fact family has only multiplication and division facts.
      - |
        4 + 7 adds the factors. The fact family of 4, 7 and 28 is made of × and ÷ facts.
      - |
        28 ÷ 2 = 14 is true, but 2 and 14 are not in the family. The family uses only 4, 7 and 28.
      - |
        Correct. 4, 7 and 28 make the family 4 × 7 = 28, 7 × 4 = 28, 28 ÷ 4 = 7 and 28 ÷ 7 = 4.
    answer: 3

  # ---- Multiples of 10 (3.NBT.A.3)
  - slug: g3math-u08-check-q05
    type: multiple_choice
    topic_code: "3.NBT.A.3"
    source: "IM K–5 Math Grade 3, Unit 8, Section C"
    points: 1
    figure: figures/u08-jumps-of-40.svg
    figure_alt: "A number line titled Jumps of 40. It is marked 0, 40, 80, 120, 160 and 200. Five equal jumps, each labeled plus 40, go from 0 to 200."
    prompt: |
      The number line shows 5 jumps of 40. What is 5 × 40?
    options:
      - "45"
      - "200"
      - "160"
      - "2,000"
    option_explanations:
      - |
        45 is 5 + 40. The number line shows 5 equal jumps of 40, which is multiplication.
      - |
        Correct. 5 jumps of 40 end at 200. Also 5 × 4 tens = 20 tens = 200.
      - |
        160 is where the fourth jump ends. Count the jumps again: there are 5, ending at 200.
      - |
        2,000 has one zero too many. 5 × 4 tens is 20 tens, and 20 tens is 200.
    answer: 1

  - slug: g3math-u08-check-q06
    type: numeric
    topic_code: "3.NBT.A.3"
    source: "IM K–5 Math Grade 3, Unit 8, Section C"
    points: 1
    prompt: |
      A pack has 60 craft sticks. How many craft sticks are in 9 packs?
    answer: { value: 540, tolerance: 0 }
    explanation: |
      9 × 60 = 9 × 6 tens = 54 tens, and 54 tens is 540 craft sticks.

  - slug: g3math-u08-check-q07
    type: true_false
    topic_code: "3.NBT.A.3"
    source: "IM K–5 Math Grade 3, Unit 8, Section C"
    points: 1
    prompt: |
      True or false: 3 × 80 is the same as 3 × 8 tens, which is 24 tens, or 240.
    answer: true
    explanation: |
      True. 80 is 8 tens. 3 × 8 tens = 24 tens, and 24 tens is 240.

  # ---- Adding and subtracting within 1,000 (3.NBT.A.2)
  - slug: g3math-u08-check-q08
    type: multiple_choice
    topic_code: "3.NBT.A.2"
    source: "IM K–5 Math Grade 3, Unit 8, Section C"
    points: 1
    prompt: |
      What is 467 + 285?
    options:
      - "752"
      - "642"
      - "652"
      - "742"
    option_explanations:
      - |
        Correct. Ones 7 + 5 = 12 (regroup 1 ten), tens 6 + 8 + 1 = 15 (regroup 1 hundred), hundreds 4 + 2 + 1 = 7. The sum is 752.
      - |
        642 writes the 2 from 12 ones and the 4 from 14 tens but never adds the regrouped ten or hundred.
      - |
        652 regroups the ones but not the tens. 15 tens is 1 hundred and 5 tens, so the hundreds become 7.
      - |
        742 regroups the tens but forgets the ten made by 7 + 5 = 12 ones, so the tens digit is one too small.
    answer: 0

  - slug: g3math-u08-check-q09
    type: numeric
    topic_code: "3.NBT.A.2"
    source: "IM K–5 Math Grade 3, Unit 8, Section C"
    points: 1
    prompt: |
      What is 700 − 348?
    answer: { value: 352, tolerance: 0 }
    explanation: |
      Count up from 348: + 2 is 350, + 50 is 400, + 300 is 700. 2 + 50 + 300 = 352. Check: 352 + 348 = 700.

  - slug: g3math-u08-check-q10
    type: multiple_choice
    topic_code: "3.NBT.A.2"
    source: "IM K–5 Math Grade 3, Unit 8, Section C"
    points: 1
    prompt: |
      Rosa says 523 − 189 = 334. Which addition can she use to check her answer?
    options:
      - "334 + 523"
      - "523 + 189"
      - "334 + 189"
      - "334 + 334"
    option_explanations:
      - |
        334 + 523 adds the answer to the starting number. To check, add the answer to the number taken away.
      - |
        523 + 189 adds the two numbers in the problem. That does not undo the subtraction.
      - |
        Correct. Add the difference to the number taken away: 334 + 189 = 523, which is where she started.
      - |
        Doubling the answer does not check it. The check adds 334 to the 189 that was taken away.
    answer: 2

  - slug: g3math-u08-check-q11
    type: multi_select
    topic_code: "3.NBT.A.2"
    source: "IM K–5 Math Grade 3, Unit 8, Section C"
    points: 2
    partial_credit: true
    prompt: |
      Which of these have an answer greater than 500? Select all that apply.
    options:
      - "248 + 263"
      - "900 − 425"
      - "612 − 98"
      - "199 + 299"
      - "350 + 175"
    option_explanations:
      - |
        Yes. 248 + 263 = 511, which is greater than 500.
      - |
        No. 900 − 425 = 475, which is less than 500.
      - |
        Yes. 612 − 98 = 514. (Take away 100 to get 512, then add back 2.)
      - |
        No. 199 + 299 = 498, just under 500. (200 + 300 = 500, minus 2.)
      - |
        Yes. 350 + 175 = 525, which is greater than 500.
    answer: [0, 2, 4]

  # ---- Patterns (3.OA.D.9)
  - slug: g3math-u08-check-q12
    type: multiple_choice
    topic_code: "3.OA.D.9"
    source: "IM K–5 Math Grade 3, Unit 8, Section C"
    points: 1
    figure: figures/u08-times-table.svg
    figure_alt: "Part of the multiplication table with rows and columns 1 to 6. The column under 4 is shaded and shows 4, 8, 12, 16, 20 and 24."
    prompt: |
      Look at the shaded column of the multiplication table. Which sentence is true about every number in it?
    options:
      - "Every number is odd."
      - "The numbers go up by 2."
      - "Every number ends in 4 or 8."
      - "Every number is even."
    option_explanations:
      - |
        4, 8, 12, 16, 20 and 24 all end in 0, 2, 4, 6 or 8, so none of them is odd.
      - |
        The numbers go 4, 8, 12, 16, so they go up by 4 each time, not by 2.
      - |
        12, 16 and 20 do not end in 4 or 8. The ones digits are 4, 8, 2, 6, 0, 4.
      - |
        Correct. Each number is 4 times something, and 4 is even, so every product is even.
    answer: 3

  - slug: g3math-u08-check-q13
    type: fill_blank
    topic_code: "3.OA.D.9"
    source: "IM K–5 Math Grade 3, Unit 8, Section C"
    points: 1
    prompt: |
      10, 20, 30 and 40 are all ____ of 10, because you say them when you count by 10s.
    answer: ["multiples", "multiple", "the multiples"]
    explanation: |
      A multiple of 10 is a number you get by multiplying 10 by a whole number: 1 × 10, 2 × 10, 3 × 10 and so on.

  # ---- Stimulus set: snacks bar graph (3.OA.D.8, 3.OA.C.7, 3.NBT.A.2)
  - slug: g3math-u08-check-q14
    type: multiple_choice
    topic_code: "3.OA.D.8"
    source: "IM K–5 Math Grade 3, Unit 8, Section D"
    points: 1
    stimulus: |
      Use the bar graph "Snacks Packed for the Field Trip". The scale counts by 10s.
    figure: figures/u08-snacks-bar-graph.svg
    figure_alt: "A bar graph titled Snacks Packed for the Field Trip. The side scale goes 0 to 80 by 10s and is labeled Number of snacks. Apples reach 40, Crackers reach 70, Carrots reach 30 and Grapes reach 60."
    prompt: |
      The class ate 15 of the apples and carrots on the bus. How many apples and carrots are left?
    options:
      - "85"
      - "55"
      - "70"
      - "25"
    option_explanations:
      - |
        85 adds the 15 eaten snacks. They were eaten, so take 15 away from 70.
      - |
        Correct. Apples 40 + carrots 30 = 70. Then 70 − 15 = 55 left.
      - |
        70 is the first step, apples and carrots together. The class ate 15, so subtract: 70 − 15 = 55.
      - |
        25 is 40 − 15, which leaves out the 30 carrots. Add the carrots first.
    answer: 1

  - slug: g3math-u08-check-q15
    type: numeric
    topic_code: "3.OA.C.7"
    source: "IM K–5 Math Grade 3, Unit 8, Section C"
    points: 1
    stimulus: |
      Use the bar graph "Snacks Packed for the Field Trip". The scale counts by 10s.
    prompt: |
      The crackers go into bags with 7 crackers in each bag. How many bags are filled?
    answer: { value: 10, tolerance: 0 }
    explanation: |
      There are 70 crackers. 70 ÷ 7 = 10, because 7 × 10 = 70. So 10 bags.

  - slug: g3math-u08-check-q16
    type: multiple_choice
    topic_code: "3.NBT.A.2"
    source: "IM K–5 Math Grade 3, Unit 8, Section C"
    points: 1
    stimulus: |
      Use the bar graph "Snacks Packed for the Field Trip". The scale counts by 10s.
    prompt: |
      How many more crackers than carrots did the class pack?
    options:
      - "100"
      - "4"
      - "40"
      - "30"
    option_explanations:
      - |
        100 is crackers and carrots added, 70 + 30. "How many more" asks for the difference, 70 − 30.
      - |
        4 counts the lines between the two bars, but each line on this scale is worth 10, so the difference is 40.
      - |
        Correct. Crackers reach 70 and carrots reach 30, and 70 − 30 = 40 more crackers.
      - |
        30 is the number of carrots. The difference between the crackers and the carrots is 70 − 30 = 40.
    answer: 2

  # ---- Two-step problems (3.OA.D.8)
  - slug: g3math-u08-check-q17
    type: multiple_choice
    topic_code: "3.OA.D.8"
    source: "IM K–5 Math Grade 3, Unit 8, Section D"
    points: 1
    prompt: |
      Lucia buys 4 boxes of 8 crayons and has 39 crayons already. She says she has 171 crayons in all. Which estimate shows whether her answer is reasonable?
    options:
      - "No: 4 × 8 is about 30 and 39 is about 40, so she should have about 70."
      - "Yes: 171 is close to 100 + 70."
      - "Yes: she used all the numbers in the story."
      - "No: she should have about 40 crayons."
    option_explanations:
      - |
        Correct. 4 × 8 = 32 is about 30 and 39 is about 40, so the total is about 70. The exact total is 32 + 39 = 71, so 171 is too big.
      - |
        Breaking 171 into 100 + 70 does not check it against the story. The estimate from the story is about 30 + 40 = 70.
      - |
        Using every number does not make an answer right. An estimate, about 30 + 40 = 70, shows 171 is far too big.
      - |
        About 40 is only the crayons she had already. She also bought 4 × 8 = 32 more, so about 70 in all.
    answer: 0

  - slug: g3math-u08-check-q18
    type: short_answer
    topic_code: "3.OA.D.8"
    source: "IM K–5 Math Grade 3, Unit 8, Section D"
    points: 3
    prompt: |
      A garden club plants 4 rows of tulips with 7 tulips in each row. They also plant 25 daffodils.

      (a) Write an equation with a letter for the total number of flowers.
      (b) Solve your equation.
      (c) Use an estimate to explain why your answer is reasonable.
    answer: |
      (a) f = 4 × 7 + 25.
      (b) 4 × 7 = 28 tulips. 28 + 25 = 53 flowers.
      (c) 28 is about 30 and 25 is about 25, so the total is about 55. 53 is close to 55, so it makes sense.
    explanation: |
      Three points.

      (a) 1 pt: an equation with a letter that shows both steps, such as f = 4 × 7 + 25 or 28 + 25 = f.

      (b) 1 pt: 53 flowers, with 4 × 7 = 28 shown.

      (c) 1 pt: an estimate with rounded numbers (for example 30 + 25 = 55, or 30 + 30 = 60) and a sentence comparing it to the answer.
