    - slug: apush-u03-w07-q23
      type: short_answer
      topic_code: "3.6"
      source: "Primary source: Abigail Adams to John Adams, 31 March 1776, Founders Online (National Archives), Adams Papers"
      points: 3
      stimulus: |
        "I desire you would Remember the Ladies, and be more generous and favourable to them than your ancestors. Do not put such unlimited power into the hands of the Husbands. Remember all Men would be tyrants if they could. If perticuliar care and attention is not paid to the Laidies we are determined to foment a Rebelion, and will not hold ourselves bound by any Laws in which we have no voice, or Representation."

        — Abigail Adams, letter to her husband, John Adams, a delegate to the Continental Congress, March 31, 1776
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe ONE way the excerpt reflects ideas used by colonists to justify resistance to Britain.

        (b) Briefly explain ONE way the intended audience or historical situation of the excerpt shaped its content.

        (c) Briefly explain ONE way the status of women in the United States did or did not change as a result of the American Revolution in the period 1776–1800.
      answer: |
        (a) Adams turns the Patriots' own argument against them: just as colonists refused to obey laws made by a Parliament in which they had no representation, women will not be 'bound by any Laws in which we have no voice, or Representation'. Her warning that men 'would be tyrants' borrows the language of resistance to tyranny.

        (b) She wrote privately to her husband, a delegate in Congress as independence was being debated in the spring of 1776. Because John Adams could help shape 'the new Code of Laws', she framed her request as practical advice to a lawmaker, mixing serious argument with the playful threat of a 'Rebelion' that fits a letter between spouses.

        (c) Women's legal status changed little: under coverture married women still could not own property or make contracts in their own names, and no state except New Jersey (briefly) let women vote. But the idea of Republican Motherhood gave women a recognised civic role in raising virtuous citizens and encouraged better education for girls.
      explanation: |
        Three points, one per part.

        (a) 1 pt for connecting the excerpt to revolutionary ideas: no taxation/legislation without representation, consent of the governed, resistance to tyranny or unlimited power. Must link the excerpt's words to the colonial argument.

        (b) 1 pt for explaining how audience (her husband, a congressional delegate) or situation (the spring of 1776, debates on independence and on new governments) shaped the content: e.g. she addresses someone who could actually write laws; the private format allows frankness or humour. Zero for describing the situation without connecting it to the content.

        (c) 1 pt for a specific explained change or continuity: coverture remained; no general suffrage; New Jersey's 1776 constitution allowed some propertied women to vote until 1807; Republican Motherhood; female academies and improved education; women's wartime economic roles. Zero for claiming women gained the vote nationally.

        Skills: sourcing (audience, situation) and continuity and change.

    - slug: apush-u03-w07-q24
      type: short_answer
      topic_code: "3.6"
      source: "Interpretations written for this course, representing the 'radical' and 'conservative' schools of interpretation of the Revolution"
      points: 3
      stimulus: |
        Two interpretations (written for this course):

        Historian A (a view associated with historians who stress the Revolution's radicalism): "The Revolution transformed American society. By rejecting monarchy and hereditary privilege, it made the consent of ordinary people the basis of all authority, and that principle, once released, could not be contained."

        Historian B (a view associated with historians who stress continuity): "The Revolution was a political separation led by colonial elites who largely kept their power. The same families governed afterward, slavery endured and expanded in the South, and women and the poor remained excluded from political life."
      prompt: |
        Using the excerpts, answer (a), (b) and (c).

        (a) Briefly describe ONE major difference between Historian A's and Historian B's interpretations.

        (b) Briefly explain how ONE specific historical event or development in the period 1776–1800 that is not explicitly mentioned in the excerpts could be used to support Historian A's interpretation.

        (c) Briefly explain how ONE specific historical event or development in the period 1776–1800 that is not explicitly mentioned in the excerpts could be used to support Historian B's interpretation.
      answer: |
        (a) Historian A argues the Revolution brought fundamental social change by making popular consent the basis of authority, while Historian B argues it was mainly a change of rulers that left the social order, including slavery and the exclusion of women and the poor, largely intact.

        (b) Northern states began to abolish slavery: Pennsylvania's Gradual Abolition Act of 1780 and the Massachusetts court rulings of the early 1780s show the logic of natural rights reaching beyond the elites who proclaimed it. The disestablishment of churches, as in Virginia's Statute for Religious Freedom (1786), also supports A.

        (c) The Constitution of 1787 protected slavery through the three-fifths clause and the guarantee of the slave trade until 1808, and most states kept property qualifications for voting, which supports B's view that elites kept control and the social order continued.
      explanation: |
        Three points, one per part.

        (a) 1 pt for a difference that addresses both interpretations: transformation vs continuity, social revolution vs political separation, popular vs elite. Zero for describing only one historian.

        (b) 1 pt for a specific development not in the excerpts, explained as support for A: gradual emancipation in the North; manumission laws in the Upper South; disestablishment and the Virginia Statute for Religious Freedom; abolition of primogeniture and entail; new state constitutions with bills of rights and lower property requirements (e.g. Pennsylvania 1776); Black petitions for freedom; Republican Motherhood and women's education. Do not award for 'rejecting monarchy' (already in the excerpt).

        (c) 1 pt for a specific development explained as support for B: the Constitution's protections for slavery; property qualifications for voting; coverture; continued elite leadership (Washington, Adams); suppression of Shays' Rebellion or the Whiskey Rebellion; the expansion of slavery into new southern territory; Native land loss.

        Skills: analysing secondary sources; comparison; claims and evidence.

    - slug: apush-u03-w07-q25
      type: long_answer
      topic_code: "3.5"
      source: "general knowledge"
      points: 6
      prompt: |
        In 1775 the colonies faced the world's strongest navy and a professional army with little more than militias and a new Continental Army. Eight years later Britain recognised American independence. In developing your argument, you might consider military strategy and leadership, foreign assistance, geography, and the roles of different groups of Americans.

        Evaluate the relative importance of the causes of American victory in the Revolutionary War.
      answer: |
        Thesis: French intervention was the most important cause of American victory, because French money and above all French sea power made Yorktown possible; but it was available only because Washington's strategy kept the Continental Army alive and because the victory at Saratoga proved the Americans could win.

        Context: The war grew out of the imperial crisis after 1763; by 1775 colonial militias and committees already controlled much of the countryside, and in 1776 Congress declared independence, partly to obtain foreign aid.

        Body 1 (foreign aid): France sent secret aid from 1776 and allied in 1778 after Saratoga; Spain (1779) and the Dutch (1780) widened the war. At Yorktown in 1781, Rochambeau's troops and de Grasse's fleet trapped Cornwallis.

        Body 2 (strategy and leadership): Washington lost New York in 1776 but saved his army, struck at Trenton and Princeton, and endured Valley Forge, where Steuben's drill professionalised the troops. Britain could take cities but not end the rebellion.

        Body 3 (geography and popular support): distance and a vast territory strained British supply; militias won at Kings Mountain and partisan warfare in the South wore down Cornwallis. However, many Loyalists, most Native nations and thousands of enslaved people sided with Britain, so popular support alone could not have won.

        Conclusion: Foreign intervention was decisive, but it depended on the earlier American ability to survive and win at Saratoga.
      explanation: |
        Scored on the LEQ rubric (6 points).

        Thesis/claim (0–1): 1 pt for a defensible claim that ranks or weighs causes, for example that French aid was most important, or that Washington's strategy and American persistence mattered most. Simply listing causes without establishing relative importance does not earn the point.

        Contextualization (0–1): 1 pt for describing the broader situation: the imperial crisis of 1763–1775, the Anglo-French rivalry since the Seven Years' War, the decision to declare independence to secure alliances, or British global commitments. Must be more than a phrase and must relate to the prompt.

        Evidence (0–2): 1 pt for two specific relevant examples (Saratoga, the 1778 alliance, Yorktown, de Grasse, Rochambeau, Trenton, Valley Forge and Steuben, the southern strategy, Kings Mountain, Cowpens, Spain's entry and Gálvez, Loyalists, Joseph Brant, Dunmore's Proclamation). 2 pts for using specific evidence to support an argument about relative importance.

        Analysis and reasoning (0–2): 1 pt for using causation to explain why the chosen factors led to victory. 1 more pt for complex understanding: e.g. explaining how causes were interdependent (Saratoga made the alliance possible), weighing British weaknesses against American strengths, considering multiple perspectives (Loyalists, Native nations, enslaved people for whom British victory might have meant freedom), or connecting to the global war.

        Common errors: narrating battles without argument; overstating colonial unity; ignoring the role of the French navy.
