      prompt: |
        Select all of the following that were weaknesses of the national government under the Articles of Confederation.
      options:
        - "Congress could not levy taxes and depended on requests to the states."
        - "Congress could not regulate interstate or foreign commerce."
        - "Amending the Articles required the consent of every state."
        - "The president could veto acts of Congress."
        - "There was no national court system to settle disputes between states."
      option_explanations:
        - |
          Correct. Requisitions to the states went largely unpaid, so Congress could not pay its war debt or its soldiers.
        - |
