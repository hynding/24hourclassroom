week: 8
unit: 3
title: "The Articles, the Convention and the Constitution"
topics: ["3.7", "3.8", "3.9"]
guide: guides/week-08.md
guide_description: |
  Why the first national government was deliberately weak, what it achieved in the West, and how debt, Shays'
  Rebellion and diplomatic humiliation produced the Constitutional Convention of 1787. Covers the convention's
  compromises (including those over slavery), the ratification debate between Federalists and Anti-Federalists, and
  the Constitution's design of federalism, separation of powers and checks and balances. Worked examples: sourcing
  Federalist No. 10, a comparison chart of the Articles and the Constitution, and an LEQ thesis on how far the
  Constitution fixed the Articles' weaknesses.
flashcards_description: |
  32 cards on the Articles of Confederation and the land ordinances, Shays' Rebellion, the Philadelphia Convention and
  its compromises, ratification and The Federalist, and the Bill of Rights.

flashcards:
  - front: Articles of Confederation → drafted, ratified, and why ratification took four years
    back: |
      Drafted by the Second Continental Congress in 1777, in force from 1781. Maryland held out until states with western land claims, above all Virginia, agreed to cede them to the national government, so that the West would be common property.
    topic_code: "3.7"
  - front: Why did Americans create such a weak central government in 1777?
    back: |
      Fear of centralised power, learned in the fight against Parliament and the crown; loyalty to their own states, which they saw as the real governments; and belief that a republic could survive only on a small scale. The Articles created a 'firm league of friendship' among sovereign states.
    topic_code: "3.7"
  - front: Structure of the Confederation Congress → four features
    back: |
      A one-house legislature; one vote per state regardless of population; nine of thirteen states required for major measures (war, treaties, borrowing, coinage); unanimous consent of the states to amend. No separate executive or national courts.
    hint: One house, one vote, nine for big things, thirteen to amend.
    topic_code: "3.7"
  - front: Two powers the Confederation Congress lacked that mattered most
    back: |
      It could not tax (it could only request money from the states, which often paid little) and it could not regulate interstate or foreign commerce. Without revenue it could not pay its debts or its soldiers; without commerce power it could not retaliate against British trade restrictions.
    topic_code: "3.7"
  - front: Land Ordinance of 1785 → what it did
    back: |
      Provided for surveying the Northwest Territory into townships six miles square, each divided into 36 sections of 640 acres, sold at auction; one section in each township was reserved to support public schools. The grid still shapes the map of the Midwest.
    topic_code: "3.7"
  - front: Northwest Ordinance (1787) → four provisions
    back: |
      Created a process for territories to become states (from three to five states, with statehood at 60,000 free inhabitants) on equal terms with the original thirteen; guaranteed civil liberties; encouraged education; and banned slavery in the territory north of the Ohio River. It also promised 'good faith' toward American Indians.
    topic_code: "3.7"
  - front: Northwest Ordinance's slavery ban → significance
    back: |
      The first federal restriction on the spread of slavery, making the Ohio River a line between free and slave territory in the West. It set a precedent for congressional power over slavery in the territories that mattered in the Missouri crisis and the 1850s.
    topic_code: "3.7"
  - front: Postwar depression and debt (1780s) → effects
    back: |
      British goods flooded American markets while Britain closed its West Indies to American ships; money was scarce, the states and Congress owed huge war debts, and states taxed heavily to pay them, falling hard on cash-poor farmers.
    topic_code: "3.7"
  - front: Shays' Rebellion (1786–1787) → cause, course, result
    back: |
      Western Massachusetts farmers, many of them veterans led by Daniel Shays, closed courts to stop foreclosures for unpaid debts and taxes. A militia funded by Boston merchants scattered them. Elites concluded that the Confederation was too weak to keep order, and support grew for the Philadelphia Convention.
    topic_code: "3.7"
  - front: Foreign problems under the Articles → three examples
    back: |
      Britain kept forts in the Northwest in violation of the Treaty of Paris; Spain closed the lower Mississippi to American trade in 1784; Barbary states seized American ships in the Mediterranean. Congress could do little about any of them.
    topic_code: "3.7"
  - front: Annapolis Convention (1786) → purpose and outcome
    back: |
      Delegates from five states met to discuss interstate commerce. Too few came to act, so Alexander Hamilton and James Madison persuaded them to call a convention in Philadelphia in 1787 to revise the Articles.
    topic_code: "3.7"
  - front: Philadelphia Convention (May–September 1787) → who and how
    back: |
      Fifty-five delegates from twelve states (Rhode Island stayed away), with George Washington presiding and James Madison taking notes. They met in secret and decided to write a new constitution rather than amend the Articles.
    topic_code: "3.8"
  - front: Virginia Plan vs New Jersey Plan
    back: |
      Virginia (Madison): a strong national government with a two-house legislature, representation in both houses by population, favouring large states. New Jersey (William Paterson): a one-house legislature with equal votes per state, as under the Articles, favouring small states.
    topic_code: "3.8"
  - front: Great (Connecticut) Compromise (1787) → terms
    back: |
      A House of Representatives apportioned by population and elected by the people, and a Senate with two members per state chosen by state legislatures. Money bills had to start in the House. It reconciled large and small states.
    topic_code: "3.8"
  - front: Three-Fifths Compromise → what it counted and why
    back: |
      Three-fifths of 'all other Persons', meaning enslaved people, were counted toward a state's population for representation in the House and for direct taxes. It gave slaveholding states extra seats and electoral votes without the word slavery appearing in the text.
    topic_code: "3.8"
  - front: Slave trade clause (Article I, Section 9) → terms
    back: |
      Congress could not prohibit the 'Migration or Importation' of enslaved people before 1808. Congress banned the international slave trade as soon as it was allowed to, in a law that took effect January 1, 1808.
    topic_code: "3.8"
  - front: Fugitive slave clause (Article IV) → meaning
    back: |
      A person 'held to Service or Labour' in one state who escaped to another had to be returned. It made free states complicit in slavery and was later enforced by the Fugitive Slave Acts of 1793 and 1850.
    topic_code: "3.8"
  - front: Electoral College → why the framers created it
    back: |
      Electors chosen as each state legislature directed would elect the president. It compromised between election by Congress and by the people, gave weight to the states, and (through the three-fifths clause) extra weight to slaveholding states.
    topic_code: "3.9"
  - front: Federalism (in the Constitution)
    back: |
      Division of power between the national government and the states. The national government received enumerated powers, including taxation and regulation of commerce; the states kept other powers; the Constitution and federal laws are the 'supreme Law of the Land'.
    topic_code: "3.9"
  - front: Separation of powers and checks and balances
    back: |
      Legislative, executive and judicial powers in separate branches, each able to limit the others: the veto and override, Senate approval of treaties and appointments, impeachment, and (as later established) judicial review. Designed to prevent any one branch from becoming tyrannical.
    topic_code: "3.9"
  - front: Necessary and proper (elastic) clause → text and later fight
    back: |
      Article I, Section 8 lets Congress 'make all Laws which shall be necessary and proper for carrying into Execution the foregoing Powers'. Whether it allowed a national bank divided Hamilton and Jefferson in 1791 (week 9).
    topic_code: "3.9"
  - front: Federalists (1787–1788) → who and what they argued
    back: |
      Supporters of ratification: often merchants, creditors, coastal and urban interests, and nationalists such as Hamilton, Madison and Washington. They argued that a stronger national government was needed for order, credit, commerce and respect abroad, and that its structure would protect liberty.
    topic_code: "3.8"
  - front: Anti-Federalists (1787–1788) → who and what they argued
    back: |
      Opponents of ratification: often small farmers, backcountry people and state-focused leaders such as Patrick Henry, George Mason and Mercy Otis Warren. They feared a distant, aristocratic government that would swallow the states, and demanded a bill of rights.
    topic_code: "3.8"
  - front: The Federalist (1787–1788) → authors and audience
    back: |
      Eighty-five essays signed 'Publius', written by Alexander Hamilton, James Madison and John Jay for New York newspapers to persuade New York to ratify. Now read as the best explanation of the framers' thinking.
    topic_code: "3.8"
  - front: Federalist No. 10 (Madison) → argument about faction
    back: |
      Factions are inevitable because they are 'sown in the nature of man', most commonly from unequal property. A large republic controls their effects: with more interests, it is less likely that any majority will unite to oppress others. It reversed the belief that republics must be small.
    topic_code: "3.8"
  - front: Federalist No. 51 (Madison) → key idea
    back: |
      'Ambition must be made to counteract ambition.' Because people are not angels, government must be structured so that branches check one another, and power is divided between national and state governments.
    topic_code: "3.9"
  - front: Ratification → the numbers and the close states
    back: |
      Nine of thirteen state conventions were required. New Hampshire was the ninth (June 1788), but the new government needed large Virginia and New York, which ratified narrowly in June and July 1788. North Carolina (1789) and Rhode Island (1790) followed later.
    topic_code: "3.8"
  - front: Bill of Rights (1791) → origin and content
    back: |
      Promised by Federalists to win ratification, drafted by James Madison in the First Congress, ratified in 1791: ten amendments protecting freedoms of religion, speech, press and assembly, the right to bear arms, rights of the accused, and (Tenth Amendment) reserving undelegated powers to the states or the people.
    topic_code: "3.9"
  - front: Tenth Amendment → text in brief and significance
    back: |
      Powers not delegated to the United States nor prohibited to the states are reserved to the states or the people. It was the Anti-Federalists' safeguard and became the basis of later states'-rights arguments.
    topic_code: "3.9"
  - front: Compare the Articles and the Constitution on taxation
    back: |
      Articles: Congress could only request money from the states. Constitution: Congress may lay and collect taxes, duties and excises directly, giving the national government its own revenue to pay debts and fund an army.
    topic_code: "3.9"
  - front: Constitution and slavery → the word that never appears
    back: |
      'Slave' and 'slavery' do not appear; the text says 'other Persons' and 'Person held to Service or Labour'. The framers protected slavery (three-fifths, 1808 clause, fugitive clause) while avoiding the word, a sign of their discomfort and of the compromise with the Deep South.
    topic_code: "3.8"
  - front: Mercy Otis Warren → role in the ratification debate
    back: |
      A Massachusetts writer and playwright who published an Anti-Federalist pamphlet (1788) objecting to the lack of a bill of rights and the power of the new government, and later a history of the Revolution. An example of a woman participating in political debate before women could vote.
    topic_code: "3.8"

quiz:
  description: |
    25 questions · about 35 minutes · about 68% this week (the Articles of Confederation, the Constitutional
    Convention, ratification and the Constitution) and 32% review of weeks 6–7 and Period 2 (the imperial crisis,
    revolutionary ideals, the Treaty of Paris and colonial self-government). Multiple choice, select-all and
    true/false items are graded at once; fill-in-the-blank items are matched automatically; the short answers and the
    long essay are graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: Articles of Confederation, Article IX (3.7, review 3.4)
    - slug: apush-u03-w08-q01
      type: multiple_choice
      topic_code: "3.7"
      source: "Primary source: Articles of Confederation (1777, ratified 1781), Article IX, National Archives, Milestone Documents"
      points: 1
      stimulus: |
        "The united states, in congress assembled, shall never engage in a war, nor grant letters of marque and reprisal in time of peace, nor enter into any treaties or alliances, nor coin money, nor regulate the value thereof nor ascertain the sums and expenses necessary for the defence and welfare of the united states, or any of them, nor emit bills, nor borrow money on the credit of the united states, nor appropriate money, nor agree upon the number of vessels of war to be built or purchased, or the number of land or sea forces to be raised, nor appoint a commander in chief of the army or navy, unless nine states assent to the same . . ."

        — Articles of Confederation, Article IX
      prompt: |
        The provision in the excerpt most directly reflects which concern of the Articles' authors?
      options:
        - "A desire to give large states more influence than small states"
        - "A belief that the president should control war and foreign policy"
        - "A wish to make the national government independent of the state legislatures"
        - "Fear of a powerful central government acting without the broad consent of the states"
      option_explanations:
        - |
          Each state had one vote whatever its size, so the supermajority rule did not favour large states; that was a complaint of the large states later.
        - |
          There was no president with executive power under the Articles; Congress itself conducted war and diplomacy.
        - |
          The Confederation Congress's delegates were chosen and paid by state legislatures; the national government depended on the states.
        - |
          Correct. Having just fought a war against a distant government that acted without their consent, the authors required nine of thirteen states to agree before Congress could take any major step.
      answer: 3
      explanation: |
        Contextualization: the Articles reflect lessons of the imperial crisis (weeks 6–7). Their weakness was by design.

    - slug: apush-u03-w08-q02
      type: multiple_choice
      topic_code: "3.7"
      source: "Primary source: Articles of Confederation (1777, ratified 1781), Article IX, National Archives, Milestone Documents"
      points: 1
      stimulus: |
        "The united states, in congress assembled, shall never engage in a war, nor grant letters of marque and reprisal in time of peace, nor enter into any treaties or alliances, nor coin money, nor regulate the value thereof nor ascertain the sums and expenses necessary for the defence and welfare of the united states, or any of them, nor emit bills, nor borrow money on the credit of the united states, nor appropriate money, nor agree upon the number of vessels of war to be built or purchased, or the number of land or sea forces to be raised, nor appoint a commander in chief of the army or navy, unless nine states assent to the same . . ."

        — Articles of Confederation, Article IX
      prompt: |
        Which of the following was a consequence of the government structure partly described in the excerpt?
      options:
        - "The national government imposed heavy direct taxes on farmers, causing Shays' Rebellion."
        - "Congress quickly built a large standing army to remove British troops from the Northwest."
        - "States lost the right to issue their own paper money."
        - "Congress struggled to pay the national debt and to respond to crises such as Shays' Rebellion."
      option_explanations:
        - |
          The heavy taxes that drove Shays' Rebellion were laid by the Massachusetts legislature, not by Congress, which had no power to tax.
        - |
          Congress had neither the money nor the votes to raise a large army; British forts in the Northwest remained until after Jay's Treaty (1794–1796).
        - |
          Under the Articles states kept the power to issue paper money; the Constitution later forbade it.
        - |
          Correct. Congress could only request funds from the states, needed nine states for major decisions and could not act directly on individuals. It could neither pay its debts nor help Massachusetts suppress the rebellion of 1786–1787.
      answer: 3
      explanation: |
        Causation: the structure of the Articles caused paralysis, and paralysis caused the call for a new constitution.

    - slug: apush-u03-w08-q03
      type: multiple_choice
      topic_code: "3.4"
      source: "Primary source: Articles of Confederation (1777, ratified 1781), Article IX, National Archives, Milestone Documents"
      points: 1
      stimulus: |
        "The united states, in congress assembled, shall never engage in a war, nor grant letters of marque and reprisal in time of peace, nor enter into any treaties or alliances, nor coin money, nor regulate the value thereof nor ascertain the sums and expenses necessary for the defence and welfare of the united states, or any of them, nor emit bills, nor borrow money on the credit of the united states, nor appropriate money, nor agree upon the number of vessels of war to be built or purchased, or the number of land or sea forces to be raised, nor appoint a commander in chief of the army or navy, unless nine states assent to the same . . ."

        — Articles of Confederation, Article IX
      prompt: |
        Review. The absence of any provision for a separate executive in the Articles most directly reflected
      options:
        - "the influence of the Iroquois Confederacy's hereditary chiefs"
        - "a desire to copy the British system of cabinet government"
        - "the republican belief, strengthened by the conflict with George III, that executive power threatened liberty"
        - "the absence of any experienced leaders in the colonies"
      option_explanations:
        - |
          Whatever the Iroquois example meant to some colonists, it does not explain the specific fear of executive tyranny drawn from the struggle with the crown.
        - |
          The Articles rejected the British model; they had no prime minister or cabinet answerable to the legislature.
        - |
          Correct. The Declaration's grievances were aimed at the king, and republican thought distrusted executive power; state constitutions of the same years also created weak governors.
        - |
          Americans had experienced leaders (Washington, Franklin, John Adams); the omission was a choice, not a lack of talent.
      answer: 2
      explanation: |
        Review of 3.4 (republicanism) and 3.6 (state constitutions): ideas from the Revolution shaped the first national government.

    - slug: apush-u03-w08-q04
      type: multiple_choice
      topic_code: "3.7"
      source: "general knowledge"
      points: 1
      prompt: |
        The most significant achievement of the Confederation government was
      options:
        - "creating a national currency that ended inflation"
        - "negotiating free navigation of the Mississippi with Spain"
        - "forcing Britain to evacuate its forts in the Northwest"
        - "establishing an orderly system for surveying, selling and governing western lands and admitting new states"
      option_explanations:
        - |
          Continental currency collapsed during the war ('not worth a Continental') and Congress could not fix it.
        - |
          Spain closed the lower Mississippi in 1784, and the Jay–Gardoqui talks failed; free navigation came with Pinckney's Treaty in 1795.
        - |
          Britain kept its northwest posts until after Jay's Treaty (1794), under the Constitution.
        - |
          Correct. The Land Ordinance of 1785 and the Northwest Ordinance of 1787 set the pattern for western expansion: surveyed townships, school lands, territorial government and statehood on equal terms.
      answer: 3
      explanation: |
        Avoid a one-sided view of the Articles: the land ordinances were lasting achievements.

    - slug: apush-u03-w08-q05
      type: multiple_choice
      topic_code: "3.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best explains why Shays' Rebellion increased support for a stronger national government?
      options:
        - "It showed that the Confederation could not protect property or keep order, alarming creditors and political leaders."
        - "It was organised by Loyalists hoping to restore British rule."
        - "It forced Congress to abolish all state debts."
        - "It was put down by the Continental Army, proving that a national army worked."
      option_explanations:
        - |
          Correct. Debtor farmers closed courts in western Massachusetts, and Congress could do nothing; Massachusetts had to rely on a privately funded militia. Elites such as Washington feared anarchy and backed the Philadelphia Convention.
        - |
          The rebels were mostly Revolutionary War veterans and debt-burdened farmers who claimed the Revolution's own principles, not Loyalists.
        - |
          Congress had no power to abolish state debts, and it did not; the rebellion was about state taxes and foreclosures.
        - |
          The Continental Army had been disbanded; Congress could not raise troops in time, which is exactly what alarmed observers.
      answer: 0
      explanation: |
        Causation: an event's significance lies in how contemporaries interpreted it. To nationalists Shays' Rebellion was proof of the Articles' failure.

    - slug: apush-u03-w08-q06
      type: multiple_choice
      topic_code: "3.8"
      source: "general knowledge"
      points: 1
      prompt: |
        The Great (Connecticut) Compromise at the Constitutional Convention resolved a dispute between
      options:
        - "coastal and western states over the national bank"
        - "northern and southern states over counting enslaved people"
        - "Federalists and Anti-Federalists over a bill of rights"
        - "large and small states over representation in Congress"
      option_explanations:
        - |
          The national bank was proposed by Hamilton in 1790–1791, after the Constitution was in force.
        - |
          Counting enslaved people was settled by the three-fifths compromise, a separate bargain.
        - |
          The bill of rights became the key issue during ratification, after the convention ended.
        - |
          Correct. The Virginia Plan wanted representation by population; the New Jersey Plan wanted equal votes for each state. The compromise gave the House representation by population and the Senate two members per state.
      answer: 3
      explanation: |
        Comparison: know which compromise resolved which conflict.

    - slug: apush-u03-w08-q07
      type: multiple_choice
      topic_code: "3.5"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The large national and state debts that the Confederation government struggled with in the 1780s resulted mainly from
      options:
        - "the purchase of Louisiana from France"
        - "payments the United States made to Native nations for land west of the Appalachians"
        - "the cost of the Seven Years' War, which Britain transferred to the colonies in the Treaty of Paris of 1763"
        - "financing the Revolutionary War through loans from France and the Dutch, unpaid certificates to soldiers and suppliers, and paper money"
      option_explanations:
        - |
          The Louisiana Purchase came in 1803, under the Constitution.
        - |
          The United States claimed western land by right of conquest after 1783 and paid relatively little for it in this period.
        - |
          Britain kept its own Seven Years' War debt; trying to make the colonists share the cost of defence caused the imperial crisis, but no debt was transferred.
        - |
          Correct. Lacking taxing power, Congress paid for the war with foreign loans, IOUs to soldiers and farmers, and Continental currency that collapsed. The states borrowed heavily too, and their taxes to repay it sparked Shays' Rebellion.
      answer: 3
      explanation: |
        Review of 3.5 (causation): how the war was fought explains the fiscal crisis of the 1780s.

    # ---- Stimulus set B: Federalist No. 10 (3.8, 3.9)
    - slug: apush-u03-w08-q08
      type: multiple_choice
      topic_code: "3.8"
      source: "Primary source: James Madison, The Federalist No. 10 (1787), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "The latent causes of faction are thus sown in the nature of man . . . But the most common and durable source of factions has been the various and unequal distribution of property. . . .

        The smaller the society, the fewer probably will be the distinct parties and interests composing it . . . Extend the sphere, and you take in a greater variety of parties and interests; you make it less probable that a majority of the whole will have a common motive to invade the rights of other citizens . . ."

        — James Madison, writing as Publius, The Federalist No. 10, New York Packet, November 23, 1787
      prompt: |
        Madison's argument in the excerpt was mainly intended to answer the objection that
      options:
        - "the Constitution failed to protect the slave trade"
        - "the Constitution gave too much power to small states in the Senate"
        - "the president would become a king"
        - "a republic can survive only in a small territory where citizens share common interests"
      option_explanations:
        - |
          No serious objection claimed the Constitution failed to protect the slave trade; it protected it until 1808.
        - |
          Equal representation in the Senate was a convention compromise; Federalist No. 10 is about faction and the size of the republic, not the Senate.
        - |
          Fear of the presidency was a real objection, but other essays (Hamilton's on the executive) addressed it; this excerpt concerns factions and territory.
        - |
          Correct. Many Anti-Federalists, drawing on Montesquieu, held that republics must be small. Madison argued the reverse: a large republic contains so many interests that no single faction can easily dominate.
      answer: 3
      explanation: |
        Sourcing (purpose): read a persuasive essay as an answer to an opponent. Madison inverted the small-republic argument.

    - slug: apush-u03-w08-q09
      type: multiple_choice
      topic_code: "3.8"
      source: "Primary source: James Madison, The Federalist No. 10 (1787), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "The latent causes of faction are thus sown in the nature of man . . . But the most common and durable source of factions has been the various and unequal distribution of property. . . .

        The smaller the society, the fewer probably will be the distinct parties and interests composing it . . . Extend the sphere, and you take in a greater variety of parties and interests; you make it less probable that a majority of the whole will have a common motive to invade the rights of other citizens . . ."

        — James Madison, writing as Publius, The Federalist No. 10, New York Packet, November 23, 1787
      prompt: |
        Which event of 1786–1787 most likely shaped Madison's concern that a majority might 'invade the rights of other citizens'?
      options:
        - "Shays' Rebellion and state laws favouring debtors, such as paper-money and debt-relief measures"
        - "The Boston Tea Party"
        - "The Whiskey Rebellion"
        - "The XYZ Affair"
      option_explanations:
        - |
          Correct. To Madison and other nationalists, debtor uprisings and state legislatures that passed paper-money and stay laws showed local majorities threatening creditors' property, the danger the large republic was meant to contain.
        - |
          The Tea Party (1773) was resistance to Parliament, not a domestic majority threatening minority property rights.
        - |
          The Whiskey Rebellion was in 1794, seven years after the essay.
        - |
          The XYZ Affair (1797–1798) concerned diplomacy with France, long after this essay.
      answer: 0
      explanation: |
        Contextualization: the historical situation of a source explains its fears. Note too that Madison names unequal property as the main source of faction.

    - slug: apush-u03-w08-q10
      type: multiple_choice
      topic_code: "3.9"
      source: "Primary source: James Madison, The Federalist No. 10 (1787), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "The latent causes of faction are thus sown in the nature of man . . . But the most common and durable source of factions has been the various and unequal distribution of property. . . .

        The smaller the society, the fewer probably will be the distinct parties and interests composing it . . . Extend the sphere, and you take in a greater variety of parties and interests; you make it less probable that a majority of the whole will have a common motive to invade the rights of other citizens . . ."

        — James Madison, writing as Publius, The Federalist No. 10, New York Packet, November 23, 1787
      prompt: |
        Which feature of the Constitution best reflects the same concern about controlling the power of majorities?
      options:
        - "The direct election of senators by the people"
        - "Separation of powers among three branches, each able to check the others"
        - "The requirement that all laws be approved by the state legislatures"
        - "A one-house legislature with equal votes for every state"
      option_explanations:
        - |
          Senators were chosen by state legislatures until the Seventeenth Amendment (1913); indirect election was itself a check on popular majorities.
        - |
          Correct. Dividing power among branches (and between nation and states) means no faction that captures one part can easily control the whole, as Madison explained further in Federalist No. 51.
        - |
          The Constitution created a government that acts directly on individuals; ordinary laws did not need state approval.
        - |
          That describes the Confederation Congress, which the Constitution replaced.
      answer: 1
      explanation: |
        Making connections: link an argument to institutional design (3.9).

    - slug: apush-u03-w08-q11
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The fate of the Albany Plan of Union in 1754 most closely foreshadowed which weakness of the Articles of Confederation?
      options:
        - "The unwillingness of the states to give a central body the power to tax them"
        - "The dominance of the large states in Congress"
        - "The power of the president to declare war"
        - "The absence of a bill of rights"
      option_explanations:
        - |
          Correct. Colonial assemblies rejected Franklin's plan because it gave an intercolonial council power to levy taxes; a generation later the states again denied the central government a power to tax, and the result was a government that could not pay its bills.
        - |
          Under the Articles each state had one vote, so large states did not dominate; that was their complaint.
        - |
          The Articles created no president, so there was no such power to worry about.
        - |
          A bill of rights was an Anti-Federalist demand about the Constitution; it has no connection to the Albany Plan.
      answer: 0
      explanation: |
