    # ---- Stimulus set C: the Constitution and slavery (3.8, review 3.6)
    - slug: apush-u03-w08-q13
      type: multiple_choice
      topic_code: "3.8"
      source: "Primary source: Constitution of the United States (1787), Article I, Sections 2 and 9, National Archives, transcript"
      points: 1
      stimulus: |
        "Representatives and direct Taxes shall be apportioned among the several States . . . according to their respective Numbers, which shall be determined by adding to the whole Number of free Persons, including those bound to Service for a Term of Years, and excluding Indians not taxed, three fifths of all other Persons. . . .

        The Migration or Importation of such Persons as any of the States now existing shall think proper to admit, shall not be prohibited by the Congress prior to the Year one thousand eight hundred and eight . . ."

        — Constitution of the United States, Article I, Sections 2 and 9 (1787)
      prompt: |
        The provisions in the excerpt are best understood as
      options:
        - "rules designed to increase the representation of American Indians in Congress"
        - "provisions copied directly from the Articles of Confederation"
        - "compromises between delegates from slaveholding states and delegates who wished to limit the political power of slavery"
        - "measures intended to abolish slavery in the United States by 1808"
      option_explanations:
        - |
          'Indians not taxed' were excluded from the count entirely; the provisions did not increase Native representation.
        - |
          The Articles had no House apportioned by population and no such clause; the provisions were new.
        - |
          Correct. Southern delegates wanted enslaved people counted fully for representation; many northerners wanted them not counted at all. The three-fifths ratio and the twenty-year protection of the slave trade were the price of Deep South support.
        - |
          The 1808 clause only allowed Congress to ban the international slave trade from that year; it did not abolish slavery, which grew after 1808 through natural increase and the domestic trade.
      answer: 2
      explanation: |
        Contextualization (3.8): the Constitution's silence about the word slavery hides a set of explicit bargains.

