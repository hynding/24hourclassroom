    - slug: apush-u03-w06-q13
      type: multiple_choice
      topic_code: "3.1"
      source: "general knowledge"
      points: 1
      prompt: |
        Which statement best contextualizes the growth of colonial resistance between 1763 and 1774?
      options:
        - "Colonists who had grown used to largely self-governing assemblies under loose imperial oversight faced a Britain determined to tighten control and raise revenue after a costly war."
        - "Colonists objected chiefly to British efforts to abolish slavery in the colonies."
        - "Colonists turned against Britain because they had been allied with France during the Seven Years' War."
        - "Colonists who had always paid heavy direct taxes to Parliament finally decided the amounts were too high."
      option_explanations:
        - |
          Correct. Decades of salutary neglect let assemblies control taxes and salaries; the debt of the Seven Years' War pushed London to reverse course. The collision between the two expectations generated the crisis.
        - |
          Britain did not try to abolish colonial slavery in this period; Parliament abolished slavery in its empire only in 1833.
        - |
          The colonists fought on Britain's side against France; the alliance with France came only in 1778.
        - |
          Before 1764 Parliament had laid no direct taxes on the colonies; the novelty of the Stamp Act was part of the outrage.
      answer: 0
      explanation: |
        Contextualization: connect a development to the broader situation before it. The best context sentence links Period 2 habits of self-rule to post-1763 imperial needs.

