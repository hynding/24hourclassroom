    - slug: apush-u03-w06-q23
      type: short_answer
      topic_code: "3.2"
      source: "Benjamin Franklin, 'Join, or Die' woodcut, Pennsylvania Gazette, May 9, 1754, Library of Congress Prints and Photographs Division (described)"
      points: 3
      stimulus: |
        Non-text source (described): a woodcut printed in Benjamin Franklin's Pennsylvania Gazette on May 9, 1754, a few weeks before the Albany Congress met. It shows a snake cut into eight pieces. The pieces are labelled with abbreviations for New England (as one piece), New York, New Jersey, Pennsylvania, Maryland, Virginia, North Carolina and South Carolina. Beneath the snake are the words "Join, or Die." The image accompanied Franklin's report of French advances in the Ohio country.
      prompt: |
        Using the source, answer (a), (b) and (c).

        (a) Briefly describe the purpose of the image in its 1754 historical situation.

        (b) Briefly explain ONE reason why the colonies did not achieve the union the image called for in 1754.

        (c) Briefly explain ONE way the image's meaning changed when it was reprinted in the period 1765–1775.
      answer: |
        (a) Franklin printed the snake to urge the colonies to unite against the French, who were building forts in the Ohio Valley and had just driven Virginia's troops back. The cut snake says that divided colonies will be destroyed one by one; it supported his proposal for a plan of union at Albany.

        (b) The colonial assemblies rejected the Albany Plan because each was unwilling to give an intercolonial council the power to tax its people and control its western land claims; jealous localism and rivalries over the West outweighed the French threat.

        (c) During the Stamp Act and the crisis of the 1770s, patriot newspapers reprinted versions of the snake as a call to unite against British policies rather than against France. An image of loyal imperial defence became a symbol of colonial resistance to the empire itself.
      explanation: |
        Three points, one per part.

        (a) 1 pt for describing the purpose as promoting colonial unity or cooperation against France (or for defence, or in support of the Albany Plan). Accept a description that links the image to French advances in the Ohio Valley. Zero for 'to declare independence' or 'to oppose British taxes' in 1754 (anachronistic).

        (b) 1 pt for a specific reason: assemblies refused to surrender control over taxation or land; rivalries among colonies (for example over western claims); the crown's distrust of a strong intercolonial body; local priorities outweighing a distant threat. Must explain, not merely state 'they disagreed'.

        (c) 1 pt for explaining that the image was reused against Britain (Stamp Act, 1765; Coercive Acts, 1774) so that the enemy changed from France to Parliament, or that it came to symbolise intercolonial resistance or American identity. Zero for restating the 1754 meaning.

        Skills: sourcing (historical situation and purpose) and continuity and change in a source's use.

    - slug: apush-u03-w06-q24
      type: short_answer
      topic_code: "3.3"
      source: "Interpretation written for this course, in the tradition of the 'imperial school' of historians"
      points: 3
      stimulus: |
        Interpretation (written for this course, in the tradition of the 'imperial school' of historians):

        "British policy after 1763 is better understood as a reasonable attempt to manage an enlarged, indebted empire than as a plot against colonial liberty. Ministers asked the colonists to pay only part of the cost of the troops defending them, chose taxes that Britons at home already paid, and repeatedly retreated in the face of protest. The crisis grew less from British tyranny than from the colonists' long habit of governing themselves, which made any assertion of imperial authority seem illegitimate."
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe the argument the author makes about the causes of the imperial crisis.

        (b) Briefly explain ONE specific historical development from 1763 to 1774 that supports the author's argument.

        (c) Briefly explain ONE specific historical development from 1763 to 1774 that challenges the author's argument.
      answer: |
        (a) The author argues that the crisis was caused mainly by colonists' expectations of self-government, not by oppressive British intentions: Britain's measures were reasonable responses to debt and defence costs.

        (b) Parliament repealed the Stamp Act in 1766 and most of the Townshend duties in 1770 when colonists protested, which supports the claim that ministers retreated rather than pursuing tyranny. The Seven Years' War had nearly doubled Britain's debt, and the stamp duties were lighter than taxes paid in Britain.

        (c) The Townshend Acts used revenue to pay royal governors and judges, and the Massachusetts Government Act of 1774 curtailed town meetings and made the council appointive. These measures attacked self-government directly, supporting colonists' fears that Britain aimed to reduce their liberties, not just raise money.
      explanation: |
        Three points, one per part.

        (a) 1 pt for accurately describing the argument: British policy was reasonable or defensive, and colonial habits of self-rule (not tyranny) caused the crisis. Zero for simply repeating 'Britain taxed the colonies'.

        (b) 1 pt for a specific supporting development explained: repeal of the Stamp Act (1766) or the Townshend duties (1770); the size of the war debt; the cost of troops after Pontiac's War; the Tea Act lowering tea prices; the stamp tax being lighter than British taxes.

        (c) 1 pt for a specific challenging development explained: the Declaratory Act's claim to bind the colonies 'in all cases whatsoever'; vice-admiralty courts without juries (Sugar Act); Townshend revenue paying governors and judges; troops in Boston and the Boston Massacre; the Coercive Acts, especially the Massachusetts Government Act.

        Zero for evidence from outside 1763–1774 or for developments that do not bear on the argument. Skills: analysing secondary sources; claims and evidence.

    - slug: apush-u03-w06-q25
      type: long_answer
      topic_code: "3.2"
      source: "general knowledge"
      points: 6
      prompt: |
        The Seven Years' War ended French power in mainland North America and left Britain with a vast territory and a vast debt. In the following decade, relations between Britain and its colonies changed in many ways. In developing your argument, you might consider imperial policy, colonial political ideas and economic interests, and relations with American Indians.

        Evaluate the extent to which the Seven Years' War marked a turning point in relations between Britain and its North American colonies in the period from 1754 to 1774.
      answer: |
        Thesis: The Seven Years' War was a major turning point because the debt and the territory it left behind led Britain to abandon salutary neglect, which turned colonial loyalty into organised resistance; however, the colonists' arguments drew on long-standing traditions of self-government that predated the war.

        Context: Before 1754 Britain enforced the Navigation Acts loosely, and assemblies such as the House of Burgesses controlled taxes and salaries. Colonists saw themselves as loyal Englishmen proud of the empire.

        Body 1 (change in imperial policy): The war doubled Britain's debt and left 10,000 troops in America. Grenville's Sugar Act (1764) and Stamp Act (1765), and later the Townshend Acts (1767), were new attempts to raise revenue, which colonists had never paid to Parliament.

        Body 2 (change in the West): The removal of France led to Pontiac's War and the Proclamation of 1763, which closed land colonists believed they had won; speculators and settlers resented imperial control.

        Body 3 (continuity / complexity): Colonial protest drew on older ideas: the rights of Englishmen, the power of the purse, and the Great Awakening's challenge to authority. The Stamp Act Congress still declared 'all due subordination' to Parliament, and many colonists remained loyal in 1774. The war therefore changed policy faster than it changed colonial identity.

        Conclusion: The war was the turning point for imperial policy, but resistance grew from the clash between new policy and old habits.
      explanation: |
        Scored on the LEQ rubric (6 points).

        Thesis/claim (0–1): 1 pt for a historically defensible claim that establishes a line of reasoning about the extent of change, for example that the war was a turning point because it led to new taxes and western restrictions, possibly qualified by continuities in colonial self-government. Must be in the introduction or conclusion. Zero for restating the prompt ('the war changed relations to some extent').

        Contextualization (0–1): 1 pt for describing the broader situation before or during the period, such as salutary neglect and colonial assemblies, Anglo-French imperial rivalry, or mercantilism and the Navigation Acts, explained in relation to the argument. A single phrase does not earn it.

        Evidence (0–2): 1 pt for identifying two specific, relevant examples (Albany Plan, Treaty of Paris 1763, Pontiac's War, Proclamation of 1763, Sugar Act, Stamp Act, Stamp Act Congress, Declaratory Act, Townshend Acts, Boston Massacre, Tea Act, Coercive Acts, First Continental Congress). 2 pts for using specific evidence to support the argument, explaining how each example shows change or continuity.

        Analysis and reasoning (0–2): 1 pt for using continuity and change (or causation) to frame the argument, for example explaining how the war's debt caused a shift from salutary neglect to direct taxation. 1 more pt for a complex understanding, such as explaining both change and continuity, considering multiple perspectives (British ministers, colonial elites, backcountry settlers, American Indians), corroborating with several pieces of evidence, or connecting to a later period (the Articles' lack of taxing power).

        Common errors: treating the colonists as seeking independence from 1763; describing events without explaining how they changed relations; confusing the order of the acts.
