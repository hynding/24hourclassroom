week: 6
unit: 3
title: "The Seven Years' War and the Imperial Crisis"
topics: ["3.1", "3.2", "3.3"]
guide: guides/week-06.md
guide_description: |
  How a backcountry clash over the Ohio Valley became a global war, why Britain's victory loosened its hold on the
  colonies, and how a decade of new taxes and regulations (1763–1774) turned a constitutional quarrel into armed
  resistance. Worked examples: a contextualization paragraph for Period 3, the Stamp Act Congress resolutions read
  for HIPP, and a causation chain from the Treaty of Paris (1763) to the Intolerable Acts.
flashcards_description: |
  32 cards on the Seven Years' War, Pontiac's War and the Proclamation of 1763, the taxes and protests of 1764–1774,
  and the arguments over representation that linked them.

flashcards:
  - front: Period 3 (1754–1800) → the one-sentence frame
    back: |
      British imperial attempts to tighten control after the Seven Years' War provoked colonial resistance and a revolution, and the new nation then struggled to define its government, its identity and its relations with American Indians and foreign powers.
    topic_code: "3.1"
  - front: Ohio River valley, 1754 → why three peoples wanted it
    back: |
      British colonists (and Virginia land companies) wanted it for settlement and speculation; the French wanted it to link Canada with Louisiana and protect the fur trade; the Native nations who lived there (Shawnee, Delaware, Mingo and others) wanted to keep it. The contest started the Seven Years' War.
    topic_code: "3.2"
  - front: Fort Necessity (1754) → who, what, why it matters
    back: |
      A young Virginia militia officer, George Washington, skirmished with a French party and then surrendered his hastily built fort to a larger French force in July 1754. The clash in the Ohio country helped ignite a war that spread to Europe in 1756.
    topic_code: "3.2"
  - front: Albany Plan of Union (1754) → proposal and fate
    back: |
      Benjamin Franklin's plan for an intercolonial council, under a crown-appointed president general, to manage defence and Indian affairs. The Albany Congress approved it, but every colonial assembly rejected it (and London ignored it) because the colonies would not give up control of taxes and land. An early, failed experiment in colonial unity.
    hint: Approved by the delegates, rejected by the assemblies.
    topic_code: "3.2"
  - front: Franklin's 'Join, or Die' woodcut (1754) → creator and message
    back: |
      Benjamin Franklin's woodcut of a snake cut into pieces labelled with colonies, printed in the Pennsylvania Gazette to urge union against the French. It was revived in the 1760s and 1770s as a symbol of resistance to Britain, showing how the meaning of a source can change with its historical situation.
    topic_code: "3.2"
  - front: Seven Years' War vs French and Indian War → what the two names tell you
    back: |
      Same conflict (1754/1756–1763), different frames. "French and Indian War" names the North American enemies as colonists saw them; "Seven Years' War" names the global war fought in Europe, India, the Caribbean and Africa. The second frame explains why Britain ended it so deeply in debt.
    topic_code: "3.2"
  - front: William Pitt's war strategy (from 1757) → what changed
    back: |
      Pitt poured British money and regular troops into North America and promised to reimburse colonial assemblies for their costs. The war turned in Britain's favour (Louisbourg 1758, Quebec 1759, Montreal 1760), but it also convinced London that colonists had been paid to defend themselves and should help pay the bill.
    topic_code: "3.2"
  - front: Quebec (1759) → significance
    back: |
      British forces under James Wolfe defeated the French under Montcalm on the Plains of Abraham, and both generals died. The fall of Quebec, and of Montreal the next year, ended French power in Canada.
    topic_code: "3.2"
  - front: Treaty of Paris (1763) → who got what
    back: |
      France gave Britain Canada and its claims east of the Mississippi; Spain gave Britain Florida; France had already passed Louisiana west of the Mississippi (and New Orleans) to Spain. France was effectively removed from mainland North America.
    hint: France out, Britain east of the Mississippi, Spain west.
    topic_code: "3.2"
  - front: Why did the end of French power hurt American Indians?
    back: |
      Native nations had kept their autonomy by playing the French and British against each other. With France gone, they lost that leverage, the British cut back the diplomatic gifts the French had given, and settlers pushed west. This loss of a balance of power led directly to Pontiac's War.
    topic_code: "3.2"
  - front: Pontiac's War (1763) → cause and result
    back: |
      A pan-Indian uprising in the Great Lakes and Ohio country, associated with the Odawa leader Pontiac and the Delaware prophet Neolin, attacked British forts after the British ended gift-giving and settlers advanced. It did not expel the British but pushed the crown toward the Proclamation of 1763.
    topic_code: "3.2"
  - front: Proclamation of 1763 → line, purpose, colonial reaction
    back: |
      A royal proclamation reserving lands west of the Appalachian crest for American Indians and forbidding colonial settlement and private purchase there. London meant to prevent costly frontier wars; land-hungry colonists and speculators saw it as a barrier to opportunity they had fought for, and many ignored it.
    topic_code: "3.3"
  - front: Paxton Boys (1763–1764) → what happened and what it reveals
    back: |
      Scots-Irish frontiersmen from Paxton, Pennsylvania, murdered peaceful Conestoga Indians and marched on Philadelphia demanding frontier defence. Franklin talked them down. It reveals backcountry anger at eastern elites and at any government that seemed to protect Native people over settlers.
    topic_code: "3.2"
  - front: Britain's war debt after 1763 → why it changed imperial policy
    back: |
      The war roughly doubled Britain's national debt, and London decided to keep about 10,000 troops in America. Ministers concluded the colonists, who had benefited most, should pay part of the cost; that conclusion drove every new tax from 1764 to 1773.
    topic_code: "3.3"
  - front: End of salutary neglect (1763) → what it means
    back: |
      Before 1763 Britain enforced trade laws loosely and let colonial assemblies run their own affairs. After the war ministers such as George Grenville enforced the Navigation Acts, added new taxes and stationed troops: the empire tightened just as colonists had grown used to self-government.
    topic_code: "3.3"
  - front: Sugar Act (1764) → what it did
    back: |
      George Grenville's act cut the duty on foreign molasses but meant to collect it, added duties on other goods, and sent smuggling cases to vice-admiralty courts without juries. Merchants protested its effect on trade and the loss of jury trials.
    topic_code: "3.3"
  - front: Currency Act (1764) → why colonists objected
    back: |
      It barred colonies from issuing paper money as legal tender, in a cash-short economy already sliding into a postwar depression. Debtors and merchants alike felt squeezed.
    topic_code: "3.3"
  - front: Stamp Act (1765) → what made it different from the Sugar Act
    back: |
      It was a direct, internal tax on printed paper (newspapers, legal documents, licences, playing cards), not a duty on trade. It touched almost everyone, especially the lawyers, printers and merchants who led opinion, and it was the first such tax Parliament laid on the colonies.
    topic_code: "3.3"
  - front: Virtual representation vs actual representation
    back: |
      Virtual: the British view that every member of Parliament represented the whole empire, so colonists were represented though they elected no one. Actual: the colonial view that only representatives chosen by the people themselves (their own assemblies) could consent to taxes.
    hint: Who you elect vs who speaks for you.
    topic_code: "3.3"
  - front: Stamp Act Congress (October 1765) → who and what
    back: |
      Delegates from nine colonies met in New York and adopted resolutions affirming loyalty to the crown but denying Parliament's right to tax them, because they were not represented in the House of Commons. The first broad intercolonial protest since the Albany Congress.
    topic_code: "3.3"
  - front: Sons of Liberty and the Stamp Act riots (1765) → methods
    back: |
      Organised groups of artisans, merchants and others who intimidated stamp distributors (Andrew Oliver resigned after a Boston crowd ransacked his property), led boycotts and spread news through committees. Protest ranged from petitions to crowd action.
    topic_code: "3.3"
  - front: Nonimportation agreements → why boycotts worked
    back: |
      Colonial merchants and consumers refused British goods, hurting British exporters, who lobbied Parliament for repeal. Women's spinning bees and homespun cloth made ordinary households part of the protest, politicising consumption.
    topic_code: "3.3"
  - front: Declaratory Act (1766) → what it said and why it mattered
    back: |
      Passed alongside repeal of the Stamp Act, it asserted Parliament's full authority to make laws binding the colonies "in all cases whatsoever." Colonists celebrated repeal and overlooked the principle, which left the constitutional question unresolved.
    topic_code: "3.3"
  - front: Townshend Acts (1767) → what they taxed and how the revenue was used
    back: |
      Duties on imported glass, lead, paint, paper and tea, collected at the ports (an external tax). Part of the revenue paid royal governors and judges, freeing them from dependence on colonial assemblies, which made the acts a threat to self-government as well as to pocketbooks.
    topic_code: "3.3"
  - front: John Dickinson, Letters from a Farmer in Pennsylvania (1767–1768) → argument
    back: |
      Dickinson accepted Parliament's right to regulate trade but argued that duties laid to raise revenue were taxes, and so unconstitutional without consent. He urged peaceful, united resistance. A moderate who later hesitated over independence.
    topic_code: "3.3"
  - front: Boston Massacre (March 5, 1770) → event and use
    back: |
      British soldiers fired into a crowd harassing them, killing five, including Crispus Attucks, a man of African and Native descent. John Adams defended the soldiers at trial; most were acquitted. Paul Revere's engraving turned the event into propaganda depicting deliberate slaughter.
    topic_code: "3.3"
  - front: Committees of correspondence (from 1772) → purpose
    back: |
      Networks begun in Boston by Samuel Adams and in the colonial legislatures (Virginia, 1773) to share news and coordinate resistance among towns and colonies. They became a shadow government and the backbone of later congresses.
    topic_code: "3.3"
  - front: Tea Act (1773) → why a tax cut caused a revolt
    back: |
      It let the East India Company sell tea directly to the colonies, making legal tea cheaper even with the Townshend duty. Colonists saw a trick to make them accept Parliament's right to tax, and a monopoly that cut out colonial merchants. The Boston Tea Party (December 1773) followed.
    topic_code: "3.3"
  - front: Coercive (Intolerable) Acts (1774) → the four measures
    back: |
      The Boston Port Act closed the harbour until the tea was paid for; the Massachusetts Government Act curtailed town meetings and made the council appointive; the Administration of Justice Act allowed trials of officials elsewhere; a new Quartering Act eased housing of troops. Other colonies saw Massachusetts as a warning to all.
    topic_code: "3.3"
  - front: Quebec Act (1774) → why colonists lumped it with the Intolerable Acts
    back: |
      It extended Quebec's borders into the Ohio country, kept French civil law and tolerated Catholicism. Protestant colonists read it as a threat to their western claims and to their religion, though London intended it to secure the loyalty of French Canadians.
    topic_code: "3.3"
  - front: First Continental Congress (1774) → what it did
    back: |
      Delegates from twelve colonies met in Philadelphia, endorsed the Suffolk Resolves, adopted the Continental Association (a coordinated boycott enforced by local committees) and petitioned the king. They still sought rights within the empire, not independence.
    topic_code: "3.3"
  - front: Imperial crisis, 1763–1774 → which reasoning process and theme?
    back: |
      Causation (each British measure and colonial response produced the next) under the themes Politics and Power (PCE) and America in the World (WOR). The argument was over who had authority to tax and govern, not at first over independence.
    topic_code: "3.1"

quiz:
  description: |
    25 questions · about 35 minutes · about 68% this week (the Seven Years' War, the Proclamation of 1763 and the
    taxes and protests of 1763–1774) and 32% review of Periods 1 and 2 (mercantilism, colonial self-government,
    Native diplomacy, slavery, the Great Awakening and the Enlightenment). Multiple choice, select-all and true/false items are
    graded at once; fill-in-the-blank items are matched automatically; the short answers and the long essay are
    graded by your teacher against the scoring notes.
  questions:
    # ---- Stimulus set A: the Proclamation of 1763 (3.3, 3.2, review 2.5)
    - slug: apush-u03-w06-q01
      type: multiple_choice
      topic_code: "3.3"
      source: "Primary source: Royal Proclamation of October 7, 1763, Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "And whereas it is just and reasonable, and essential to our Interest, and the Security of our Colonies, that the several Nations or Tribes of Indians with whom We are connected, and who live under our Protection, should not be molested or disturbed in the Possession of such Parts of Our Dominions and Territories as, not having been ceded to or purchased by Us, are reserved to them . . .

        And We do hereby strictly forbid, on Pain of our Displeasure, all our loving Subjects from making any Purchases or Settlements whatever, or taking Possession of any of the Lands above reserved . . . without our especial leave and Licence for that Purpose first obtained."

        — King George III, Royal Proclamation, October 7, 1763
      prompt: |
        The primary purpose of the proclamation excerpted above was to
      options:
        - "reduce the cost of defending the colonies by preventing conflict between settlers and American Indians"
        - "reward colonial militias for their service by granting them land in the Ohio Valley"
        - "punish the colonies for refusing to help pay for the Seven Years' War"
        - "encourage American Indians to convert to Christianity and adopt European farming"
      option_explanations:
        - |
          Correct. Pontiac's War had just shown how expensive frontier conflict was. Keeping settlers east of the Appalachian crest and controlling land purchases was meant to prevent new wars and the cost of troops to fight them.
        - |
          The proclamation did the opposite: it closed western land to settlement, which angered veterans and land companies who expected to profit from the war's victory.
        - |
          The proclamation is framed around the security of the colonies and the protection of Native land, not punishment. The revenue measures came separately, starting with the Sugar Act of 1764.
        - |
          Nothing in the excerpt concerns religion or farming; the text is about land possession and settlement. Conversion was a goal of earlier Spanish and French missions, not of this act.
      answer: 0
      explanation: |
        Sourcing (purpose). Read the reasons the document gives for itself ("essential to our Interest, and the Security of our Colonies") together with the historical situation: Pontiac's War was under way in 1763, and Britain faced a huge war debt.

    - slug: apush-u03-w06-q02
      type: multiple_choice
      topic_code: "3.3"
      source: "Primary source: Royal Proclamation of October 7, 1763, Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "And whereas it is just and reasonable, and essential to our Interest, and the Security of our Colonies, that the several Nations or Tribes of Indians with whom We are connected, and who live under our Protection, should not be molested or disturbed in the Possession of such Parts of Our Dominions and Territories as, not having been ceded to or purchased by Us, are reserved to them . . .

        And We do hereby strictly forbid, on Pain of our Displeasure, all our loving Subjects from making any Purchases or Settlements whatever, or taking Possession of any of the Lands above reserved . . . without our especial leave and Licence for that Purpose first obtained."

        — King George III, Royal Proclamation, October 7, 1763
      prompt: |
        Which group in the colonies was most likely to oppose the policy described in the excerpt?
      options:
        - "Merchants in port cities who depended on the Atlantic trade with Britain"
        - "Quaker leaders in Pennsylvania who favoured peaceful relations with Native nations"
        - "Royal governors appointed by the crown"
        - "Land speculators and backcountry farmers who hoped to settle west of the Appalachians"
      option_explanations:
        - |
          Port merchants cared more about trade regulations and taxes; the western line touched them less directly than it touched people who wanted the land itself.
        - |
          Quaker leaders had long pursued negotiated land purchases and peace with Native nations; a line restraining settlers fitted their aims better than it fitted the backcountry's.
        - |
          Royal governors were the crown's agents and were instructed to enforce the proclamation; the excerpt forbids them, not opposes them.
        - |
          Correct. Speculators (including Virginia elites such as George Washington) and settlers had expected the defeat of France to open the Ohio Valley. The proclamation closed it, and many simply ignored the line.
      answer: 3
      explanation: |
        Contextualization and point of view: the effect of a policy depends on who wanted what. The Ohio Valley was the prize that started the war, so closing it angered those who expected to profit.

    - slug: apush-u03-w06-q03
      type: multiple_choice
      topic_code: "2.5"
      source: "Primary source: Royal Proclamation of October 7, 1763, Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "And whereas it is just and reasonable, and essential to our Interest, and the Security of our Colonies, that the several Nations or Tribes of Indians with whom We are connected, and who live under our Protection, should not be molested or disturbed in the Possession of such Parts of Our Dominions and Territories as, not having been ceded to or purchased by Us, are reserved to them . . .

        And We do hereby strictly forbid, on Pain of our Displeasure, all our loving Subjects from making any Purchases or Settlements whatever, or taking Possession of any of the Lands above reserved . . . without our especial leave and Licence for that Purpose first obtained."

        — King George III, Royal Proclamation, October 7, 1763
      prompt: |
        Review. The excerpt's concern with conflict over land most closely continued a pattern visible in which earlier development?
      options:
        - "The Great Awakening, which encouraged colonists to question established churches"
        - "Metacom's War (King Philip's War) in New England in 1675–1676, which followed decades of English expansion onto Native land"
        - "The Columbian Exchange, which spread crops and animals between hemispheres"
        - "The Toleration Act of 1649 in Maryland, which protected Christians of different denominations"
      option_explanations:
        - |
          The Great Awakening was a religious revival; it has no direct connection to disputes over western land.
        - |
          Correct. Metacom's War grew out of English settlers' steady expansion onto Wampanoag and Narragansett land. The proclamation responded to the same underlying conflict, settler demand for Native land, a century later.
        - |
          The Columbian Exchange was an exchange of plants, animals and diseases; it shaped Native demography but was not a conflict over boundaries that a government tried to regulate.
        - |
          The Maryland Toleration Act concerned religious freedom among Christians and says nothing about American Indian land.
      answer: 1
      explanation: |
        Making connections (continuity). Settler hunger for Native land, and violence when it was resisted, runs from the earliest English colonies through Metacom's War and Bacon's Rebellion to Pontiac's War and the Proclamation of 1763.

    - slug: apush-u03-w06-q04
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following was the most immediate cause of the fighting that began in North America in 1754?
      options:
        - "British efforts to tax the colonies to pay for earlier wars"
        - "The collapse of the Iroquois Confederacy after a smallpox epidemic"
        - "Spanish attempts to expand northward from Florida into Georgia"
        - "Competing British, French and Native claims to the Ohio River valley"
      option_explanations:
        - |
          The new taxes came after the war, from 1764 on, as a result of the war debt; they were an effect of the conflict, not its cause.
        - |
          The Haudenosaunee (Iroquois) Confederacy survived as a major diplomatic power through the war, courted by both sides at Albany in 1754.
        - |
          Spanish–British rivalry along the Georgia border was real (the War of Jenkins' Ear, 1739–1748), but it did not start the 1754 conflict.
        - |
          Correct. Virginia's land companies, French forts such as Fort Duquesne and the Native nations of the region all claimed the Forks of the Ohio, and Washington's 1754 expedition there began the fighting.
      answer: 3
      explanation: |
        Causation: distinguish immediate from long-term causes. The long-term cause was Anglo-French imperial rivalry; the spark was the struggle for the Ohio Valley.

    - slug: apush-u03-w06-q05
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        The Albany Plan of Union (1754) is significant to historians chiefly because it
      options:
        - "created the first permanent intercolonial government in British North America"
        - "was enacted by Parliament as the model for colonial administration after 1763"
        - "secured the Iroquois Confederacy as a full military ally of Britain from the start of the war"
        - "showed both an early interest in colonial cooperation and the colonies' reluctance to give up control over taxation"
      option_explanations:
        - |
          The plan was never put into effect, so it created no government at all, permanent or otherwise.
        - |
          London ignored the plan; Parliament's post-1763 policy relied on direct taxes and royal officials instead.
        - |
          The Albany Congress failed to win a firm Iroquois commitment; most of the Confederacy stayed neutral until British victories later in the war.
        - |
          Correct. The Albany delegates approved Franklin's plan, but every colonial assembly rejected it because they would not surrender authority over taxes and land. It previews both cooperation and the jealous localism that later weakened the Articles of Confederation.
      answer: 3
      explanation: |
        Significance and continuity: an event's importance can lie in what it reveals. The Albany Plan foreshadows the problem of union without a power to tax.

    - slug: apush-u03-w06-q06
      type: multiple_choice
      topic_code: "3.2"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best describes the effect of the 1763 Treaty of Paris on American Indians in the trans-Appalachian West?
      options:
        - "It transferred their lands to Spain, which immediately began to settle the region."
        - "It removed France as a counterweight to Britain, weakening Native nations' diplomatic leverage."
        - "It ended conflict between settlers and Native nations for a generation."
        - "It guaranteed their land rights in an international treaty signed by Native leaders."
      option_explanations:
        - |
          Spain received Louisiana west of the Mississippi; the trans-Appalachian region east of the river went to Britain.
        - |
          Correct. For decades Native nations had played the French and British against each other. With France gone, the British cut back diplomatic gifts and settlers pressed west, provoking Pontiac's War within months.
        - |
          Pontiac's War broke out in 1763, and frontier violence continued through the Revolution and the 1790s.
        - |
          No Native nations were parties to the Treaty of Paris; European powers exchanged claims to land that Native people actually occupied.
      answer: 1
      explanation: |
        Causation: the end of the French empire in North America changed the balance of power that Native diplomacy depended on. That is the key link between 3.2 and 3.3.

    - slug: apush-u03-w06-q07
      type: multiple_choice
      topic_code: "2.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Colonial writers protesting British taxes in the 1760s most often drew on which Enlightenment idea, associated with John Locke?
      options:
        - "That kings rule by divine right and subjects owe them unconditional obedience"
        - "That all land should be held in common and private property abolished"
        - "That people have natural rights, including property, and that government rests on the consent of the governed"
        - "That the economy works best when governments grant monopolies to chartered companies"
      option_explanations:
        - |
          Divine right was the doctrine Locke and the Glorious Revolution rejected; colonists cited it only as the tyranny they feared.
        - |
          Locke defended private property as a natural right; the colonists' whole argument was that their property could not be taken without consent.
        - |
          Correct. Locke's Second Treatise (1690) argued that government exists to protect life, liberty and property, so taking property through taxes without consent violates the compact. Colonial pamphleteers quoted him constantly.
        - |
          Granting monopolies is a mercantilist practice, and the colonists objected to one (the East India Company's tea monopoly) in 1773.
      answer: 2
      explanation: |
        Review of 2.7 (Enlightenment ideas in colonial culture). Natural rights and consent link the Period 2 Enlightenment to the Period 3 resistance and, in week 7, to the Declaration of Independence.

    # ---- Stimulus set B: the Stamp Act Congress resolutions (3.3)
    - slug: apush-u03-w06-q08
      type: multiple_choice
      topic_code: "3.3"
      source: "Primary source: Resolutions of the Stamp Act Congress, October 19, 1765, Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "That His Majesty's subjects in these colonies, owe the same allegiance to the Crown of Great-Britain, that is owing from his subjects born within the realm, and all due subordination to that august body the Parliament of Great Britain. . . .

        That it is inseparably essential to the freedom of a people, and the undoubted right of Englishmen, that no taxes be imposed on them, but with their own consent, given personally, or by their representatives.

        That the people of these colonies are not, and from their local circumstances cannot be, represented in the House of Commons in Great-Britain.

        That the only representatives of the people of these colonies, are persons chosen therein by themselves, and that no taxes ever have been, or can be constitutionally imposed on them, but by their respective legislatures."

        — Resolutions of the Stamp Act Congress, New York, October 19, 1765
      prompt: |
        The resolutions most directly challenged which British idea?
      options:
        - "That colonists were virtually represented in Parliament even though they elected no members"
        - "That trade between the colonies and foreign nations should be unrestricted"
        - "That the colonies should be governed under the Albany Plan of Union"
        - "That the king was the head of the Church of England"
      option_explanations:
        - |
          Correct. British ministers argued that Parliament represented every subject of the empire, elected or not. The congress answered that the colonists 'cannot be' represented in the Commons, so only their own assemblies could tax them.
        - |
          Unrestricted trade was the opposite of British mercantilist policy, and the congress did not demand it; it accepted Parliament's general authority.
        - |
          The Albany Plan had been rejected a decade earlier and was not British policy; it is not what the resolutions dispute.
        - |
          The resolutions say nothing about religion or the established church; they concern taxation and representation.
      answer: 0
      explanation: |
        Argumentation: identify the counterargument a document is answering. The third and fourth resolutions are a direct reply to virtual representation.

    - slug: apush-u03-w06-q09
      type: multiple_choice
      topic_code: "3.3"
      source: "Primary source: Resolutions of the Stamp Act Congress, October 19, 1765, Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "That His Majesty's subjects in these colonies, owe the same allegiance to the Crown of Great-Britain, that is owing from his subjects born within the realm, and all due subordination to that august body the Parliament of Great Britain. . . .

        That it is inseparably essential to the freedom of a people, and the undoubted right of Englishmen, that no taxes be imposed on them, but with their own consent, given personally, or by their representatives.

        That the people of these colonies are not, and from their local circumstances cannot be, represented in the House of Commons in Great-Britain.

        That the only representatives of the people of these colonies, are persons chosen therein by themselves, and that no taxes ever have been, or can be constitutionally imposed on them, but by their respective legislatures."

        — Resolutions of the Stamp Act Congress, New York, October 19, 1765
      prompt: |
        The opening resolution, which affirms allegiance and "due subordination" to Parliament, best reflects which aspect of the delegates' position in 1765?
      options:
        - "They saw themselves as loyal British subjects claiming the rights of Englishmen within the empire."
        - "They believed Parliament had no authority at all over the colonies."
        - "They were representatives of the crown sent to restore order after the riots."
        - "They were preparing to declare independence and wanted to conceal their plans."
      option_explanations:
        - |
          Correct. The congress claimed rights as Englishmen, which presumed membership in the empire. Its quarrel was limited to Parliament's power to tax, not its existence or the king's authority.
        - |
          The resolution explicitly concedes 'all due subordination' to Parliament; the delegates denied only its right to tax them.
        - |
          The delegates were chosen by colonial assemblies (or their members), not by the crown, and they were protesting crown policy.
        - |
          There is no evidence that the 1765 delegates sought independence; that idea gained wide support only in 1775–1776, after fighting began and Common Sense appeared.
      answer: 0
      explanation: |
        Sourcing (point of view and purpose): early resisters framed their case in loyal, constitutional terms. Do not read the 1776 outcome back into 1765.

    - slug: apush-u03-w06-q10
      type: multiple_choice
      topic_code: "3.3"
      source: "Primary source: Resolutions of the Stamp Act Congress, October 19, 1765, Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "That His Majesty's subjects in these colonies, owe the same allegiance to the Crown of Great-Britain, that is owing from his subjects born within the realm, and all due subordination to that august body the Parliament of Great Britain. . . .

        That it is inseparably essential to the freedom of a people, and the undoubted right of Englishmen, that no taxes be imposed on them, but with their own consent, given personally, or by their representatives.

        That the people of these colonies are not, and from their local circumstances cannot be, represented in the House of Commons in Great-Britain.

        That the only representatives of the people of these colonies, are persons chosen therein by themselves, and that no taxes ever have been, or can be constitutionally imposed on them, but by their respective legislatures."

        — Resolutions of the Stamp Act Congress, New York, October 19, 1765
      prompt: |
        Parliament's most direct response to the position expressed in the resolutions was to
      options:
        - "transfer control of colonial taxation to the colonial assemblies permanently"
        - "close the port of Boston until the colonists paid for the stamps"
        - "repeal the Stamp Act while passing the Declaratory Act, asserting its authority over the colonies in all cases"
        - "invite the colonies to elect members to the House of Commons"
      option_explanations:
        - |
          Parliament never surrendered its claim to tax; it returned to taxation with the Townshend duties in 1767.
        - |
          The Boston Port Act came in 1774, in response to the Tea Party, not to the Stamp Act protests.
        - |
          Correct. In March 1766 Parliament repealed the Stamp Act, largely because British merchants hurt by boycotts demanded it, and on the same day passed the Declaratory Act, conceding nothing on principle.
        - |
          Colonial seats in the Commons were discussed by a few writers but never offered; and many colonists, like the congress, said representation from so far away was impractical.
      answer: 2
      explanation: |
        Causation: repeal plus the Declaratory Act is a classic 'retreat in practice, not in principle'. It explains why the crisis resumed in 1767.

