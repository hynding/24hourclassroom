        — Thomas Jefferson, draft of the Kentucky Resolutions, October 1798
      prompt: |
        Review. The argument in Source 2 most closely echoes the concerns expressed during the ratification debate of 1787–1788 by
      options:
        - "the authors of the Virginia Plan, who wanted representation by population in both houses"
        - "Federalists, who argued that the Articles had left the national government too weak"
        - "Anti-Federalists, who warned that a powerful national government would threaten the states and individual liberty"
        - "Loyalists, who wanted to restore British rule"
      option_explanations:
