        Source 2: "Resolved, That the several States composing the United States of America, are not united on the principle of unlimited submission to their General Government; but that, by a compact under the style and title of a Constitution for the United States, and of amendments thereto, they constituted a General Government for special purposes . . ."

        — Thomas Jefferson, draft of the Kentucky Resolutions, October 1798
