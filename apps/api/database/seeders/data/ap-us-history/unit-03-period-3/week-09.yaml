    - slug: apush-u03-w09-q23
      type: short_answer
      topic_code: "3.11"
      source: "Primary source: J. Hector St. John de Crèvecoeur, Letters from an American Farmer (1782), Letter III, Project Gutenberg"
      points: 3
      stimulus: |
        "What then is the American, this new man? He is either an European, or the descendant of an European, hence that strange mixture of blood, which you will find in no other country. . . . Here individuals of all nations are melted into a new race of men, whose labours and posterity will one day cause great changes in the world."

        — J. Hector St. John de Crèvecoeur, a French-born settler who farmed in New York, Letters from an American Farmer, published in London in 1782
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe ONE claim the author makes about American identity.

        (b) Briefly explain ONE way the author's background or intended audience shaped his description of Americans.

        (c) Briefly explain ONE group whose experience in the period 1776–1800 challenges the author's description.
      answer: |
        (a) Crèvecoeur claims that Americans are a new people formed by the mixing of different European nationalities, whose labour and opportunity in America make them distinct from Europeans and destined to change the world.

        (b) As a French-born immigrant who had prospered as a farmer, he emphasised the opportunities America offered newcomers; and because the book was published in London for European readers, he presented America as a land where Europeans of all nations could become prosperous, free and equal.

        (c) Enslaved African Americans, about a fifth of the population, were excluded from his 'new race' of free farmers; slavery expanded in the South after the cotton gin of 1793. American Indians, too, were left out, and they lost land through wars such as the Northwest Indian War and the Treaty of Greenville (1795).
      explanation: |
        Three points, one per part.

        (a) 1 pt for describing a claim: Americans are a new people; a mixture of European nationalities ('melting'); defined by labour and opportunity; destined for greatness. Must be grounded in the excerpt.

        (b) 1 pt for explaining how his background (immigrant, French-born, prosperous farmer, writing as an idealised 'farmer') or audience (European readers, published in London) shaped the content, for example by stressing opportunity and European origins. Zero for describing his background without linking it to the description.

        (c) 1 pt for a specific group and explanation: enslaved African Americans; free Black Americans facing discrimination (Banneker, Richard Allen); American Indians and land loss; women under coverture; non-European immigrants. Zero for a group named without explanation.

        Skills: sourcing (point of view, audience) and argumentation.

    - slug: apush-u03-w09-q24
      type: short_answer
      topic_code: "3.12"
      source: "Primary source: Treaty of Greenville (1795), Articles I and III, Avalon Project, Yale Law School"
      points: 3
      stimulus: |
        "Henceforth all hostilities shall cease; peace is hereby established, and shall be perpetual; and a friendly intercourse shall take place between the said United States and Indian tribes. . . .

        The general boundary line between the lands of the United States and the lands of the said Indian tribes, shall begin at the mouth of Cayahoga river . . ."

        — Treaty of Greenville, concluded August 3, 1795, between the United States (represented by General Anthony Wayne) and the Wyandot, Delaware, Shawnee, Ottawa, Chippewa, Potawatomi, Miami and other nations. (Article III goes on to draw a line across present-day Ohio; the nations ceded the lands east and south of it.)
      prompt: |
        Using the excerpt, answer (a), (b) and (c).

        (a) Briefly describe the historical situation in which the treaty was negotiated.

        (b) Briefly explain ONE reason why the Native nations agreed to the treaty's terms.

        (c) Briefly explain ONE way the treaty reflects continuity with British or colonial policy toward American Indians before 1776.
      answer: |
        (a) The treaty followed the Northwest Indian War. Native nations of the Ohio country, rejecting the Treaty of Paris's transfer of their land, formed a Western Confederacy that defeated American armies in 1790 and 1791. In 1794 Anthony Wayne defeated them at Fallen Timbers.

        (b) After Fallen Timbers the British, their main source of support, refused to shelter retreating warriors and, under Jay's Treaty, agreed to leave their northwest forts, so the confederacy had lost both a battle and its European ally. The treaty also promised annual payments in goods.

        (c) Like the Proclamation of 1763, the treaty drew a boundary line between Native and settler lands and treated Native nations as peoples with whom a government negotiated over land. As before, the line was intended to keep peace but was soon overrun by settlement, and land passed from Native nations to newcomers.
      explanation: |
        Three points, one per part.

        (a) 1 pt for describing the situation: the Northwest Indian War; the Western Confederacy (Little Turtle, Blue Jacket); Harmar's or St. Clair's defeat; Fallen Timbers (1794); settler pressure on the Ohio country after the Northwest Ordinance; British forts in the Northwest. Must be specific to the 1790s.

        (b) 1 pt for an explained reason: military defeat at Fallen Timbers; the British refusal to help and Jay's Treaty; promises of annuities; exhaustion after years of war; divisions within the confederacy.

        (c) 1 pt for an explained continuity: boundary lines like the Proclamation Line or earlier colonial treaties; diplomacy and gifts (annuities like earlier presents); land cessions following war (as after Metacom's War or Pontiac's War); settler pressure undermining agreements. Accept a well-explained answer that frames continuity in terms of Native resistance.

        Skills: contextualization; continuity and change.

    - slug: apush-u03-w09-q25
      type: long_answer
      topic_code: "3.13"
      source: "general knowledge"
      points: 6
      prompt: |
        Between 1754 and 1800 British colonists became citizens of an independent republic, and the people who held power over the lands west of the Appalachians changed more than once. Relations between American Indians and those who sought their land changed in some ways and stayed the same in others. In developing your argument, you might consider diplomacy and war, land and boundary policies, and the strategies Native nations used to protect their interests.

        Evaluate the extent to which relations between American Indians and Euro-Americans changed in the period from 1754 to 1800.
      answer: |
        Thesis: Relations changed significantly in their political framework, as Native nations lost the European rivalry they had used to protect their independence and faced a republic committed to western expansion; but the central dynamic of settler demand for land, Native resistance and treaties that ended in cession continued throughout the period.

        Context: Before 1754, Native nations such as the Iroquois Confederacy maintained independence by trading and allying with both the French and the British, and colonial expansion had repeatedly led to war (Metacom's War, the Yamasee War).

        Body 1 (change: end of the balance of power): The Treaty of Paris (1763) removed France, and Pontiac's War followed. In 1783 Britain ceded the trans-Appalachian West to the United States without consulting its Native allies.

        Body 2 (change: from crown to republic): The crown's Proclamation of 1763 had tried to restrain settlers; the republic's Land Ordinance and Northwest Ordinance organised the same land for sale and statehood, and claimed it by conquest.

        Body 3 (continuity): Native nations continued to form alliances and confederacies (Pontiac in 1763; the Western Confederacy under Little Turtle and Blue Jacket in the 1790s) and to seek European support; and wars still ended in boundary lines and cessions, from the Proclamation Line to the Treaty of Greenville (1795).

        Conclusion: The players and the legal framework changed, but the pattern of expansion and resistance did not, and it would continue into Period 4.
      explanation: |
        Scored on the LEQ rubric (6 points).

        Thesis/claim (0–1): 1 pt for a defensible claim about the extent of change, establishing a line of reasoning (e.g. major change in the balance of power and sovereignty, continuity in land conflict and resistance). Zero for 'relations changed and stayed the same' without specifying how.

        Contextualization (0–1): 1 pt for describing relations before 1754 (play-off diplomacy between French and British, the fur trade, earlier wars such as Metacom's War, the Pueblo Revolt or the Yamasee War) or the broader context of imperial rivalry or the Revolution, explained in relation to the argument.

        Evidence (0–2): 1 pt for two specific examples (Albany Congress, Seven Years' War alliances, Treaty of Paris 1763, Pontiac's War, Neolin, Proclamation of 1763, Paxton Boys, Native nations in the Revolution, Joseph Brant, Oneida, Treaty of Paris 1783, Land Ordinance, Northwest Ordinance's 'good faith' clause, Little Turtle, St. Clair's defeat, Fallen Timbers, Treaty of Greenville). 2 pts for using evidence to support an argument about the extent of change.

        Analysis and reasoning (0–2): 1 pt for using continuity and change over time to frame the argument. 1 more pt for complex understanding: explaining both change and continuity; analysing multiple perspectives (different Native nations made different choices; crown vs settlers vs the federal government); corroborating across several pieces of evidence; or connecting to Period 4 (Tecumseh, Indian Removal).

        Common errors: treating American Indians as passive victims rather than political actors; ignoring the period's start (1754–1763); generalising about 'the Indians' without naming nations or events.
