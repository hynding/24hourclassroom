week: 9
unit: 3
title: "The New Republic: Washington, Adams and an American Identity"
topics: ["3.10", "3.11", "3.12", "3.13"]
guide: guides/week-09.md
guide_description: |
  How the first federal government was built and argued over: Hamilton's financial plan and Jefferson's objections,
  the rise of the first parties, neutrality and Jay's Treaty, war and diplomacy in the Ohio country, the Alien and
  Sedition Acts and the election of 1800. Also covers the search for an American identity, migration west, and the
  continuities and changes of Period 3. Worked examples: comparing Hamilton's and Jefferson's bank opinions, sourcing
  Washington's Farewell Address, and a continuity-and-change thesis for 1754–1800.
flashcards_description: |
  33 cards on Washington's and Adams's presidencies, Hamilton's program and the first parties, foreign policy in the
  1790s, the Northwest Indian War, American identity and migration, and the continuities of Period 3.

flashcards:
  - front: Washington's first cabinet (1789) → who held which post
    back: |
      Thomas Jefferson (State), Alexander Hamilton (Treasury), Henry Knox (War) and Edmund Randolph (Attorney General). The cabinet was not in the Constitution; Washington created the practice of consulting department heads.
    topic_code: "3.10"
  - front: Judiciary Act of 1789 → what it created
    back: |
      Set the Supreme Court at six justices, created federal district and circuit courts, and allowed appeals from state courts on federal questions. Congress filled in the judicial branch the Constitution had only sketched.
    topic_code: "3.10"
  - front: Hamilton's financial plan (1790–1791) → four parts
    back: |
      Fund the national debt at full value; assume the states' war debts; charter a national bank; and raise revenue through tariffs and an excise tax on whiskey. A Report on Manufactures (1791) also urged protection for industry. Goal: bind wealthy creditors to the government and build national credit.
    topic_code: "3.10"
  - front: Assumption of state debts → who objected and how it passed
    back: |
      States such as Virginia that had paid off much of their debt objected to paying for others'. The Compromise of 1790 traded southern votes for assumption for a permanent capital on the Potomac River.
    topic_code: "3.10"
  - front: Bank of the United States (1791) → Hamilton's vs Jefferson's constitutional argument
    back: |
      Hamilton: the necessary and proper clause implies power to use any reasonable means toward an enumerated end (loose construction). Jefferson: the Tenth Amendment reserves undelegated powers, and a bank is not 'necessary' (strict construction). Washington signed the bank bill.
    topic_code: "3.10"
  - front: Loose vs strict construction
    back: |
      Loose (broad) construction reads the Constitution's grants of power generously, allowing implied powers; strict construction allows the national government only powers clearly enumerated. The divide began with the bank and has run through American politics ever since.
    topic_code: "3.10"
  - front: Federalists vs Democratic-Republicans (1790s) → compare
    back: |
      Federalists (Hamilton, Adams): strong national government, commerce, manufacturing and finance, loose construction, pro-British; strongest in New England and among merchants. Democratic-Republicans (Jefferson, Madison): states' rights, agrarian republic, strict construction, pro-French; strongest in the South and West.
    topic_code: "3.10"
  - front: First party system → why it surprised the founders
    back: |
      The framers distrusted parties as factions (Madison's Federalist No. 10) and Washington warned against them, yet within a few years disputes over Hamilton's program and the French Revolution created two organised parties with newspapers and candidates.
    topic_code: "3.10"
  - front: Whiskey Rebellion (1794) → cause and significance
    back: |
      Western Pennsylvania farmers resisted Hamilton's excise tax on whiskey, a key cash product. Washington led about 13,000 militia to suppress it, showing that the new government could enforce its laws, in contrast to the Confederation's helplessness during Shays' Rebellion.
    topic_code: "3.10"
  - front: Neutrality Proclamation (1793) → why
    back: |
      When revolutionary France went to war with Britain, Washington declared the United States neutral despite the 1778 alliance with France, judging the new nation too weak for war. Republicans protested that it betrayed an ally and a sister republic.
    topic_code: "3.10"
  - front: Citizen Genêt (1793) → what he did
    back: |
      The French minister Edmond Genêt toured the United States recruiting Americans to fight Britain and Spain and appealing to the public over Washington's head. His conduct embarrassed even Jefferson, and Washington asked France to recall him.
    topic_code: "3.10"
  - front: Jay's Treaty (1794, ratified 1795) → terms and reaction
    back: |
      Britain agreed to leave its forts in the Northwest and allowed limited trade in the West Indies, but did not stop seizing American ships and sailors. It avoided war with Britain, but Republicans denounced it as pro-British, and it deepened the party divide.
    topic_code: "3.10"
  - front: Pinckney's Treaty (1795) → terms
    back: |
      Spain granted Americans free navigation of the Mississippi and the right of deposit at New Orleans, and accepted the 31st parallel as Florida's border. Popular in the West, it was a clear diplomatic success.
    topic_code: "3.12"
  - front: Western Confederacy and St. Clair's defeat (1791)
    back: |
      A coalition of Native nations in the Ohio country, led by Little Turtle (Miami) and Blue Jacket (Shawnee), defeated Josiah Harmar in 1790 and destroyed Arthur St. Clair's army in 1791, among the worst defeats the U.S. army ever suffered at Native hands.
    topic_code: "3.12"
  - front: Battle of Fallen Timbers (1794) → significance
    back: |
      General Anthony Wayne defeated the Western Confederacy near present-day Toledo. British troops in a nearby fort would not help their Native allies; combined with Jay's Treaty, this left the confederacy isolated.
    topic_code: "3.12"
  - front: Treaty of Greenville (1795) → result
    back: |
      The Western Confederacy ceded most of present-day Ohio to the United States in exchange for annual payments. It opened the region to settlement and followed a pattern of war, cession and treaty that would repeat westward.
    topic_code: "3.12"
  - front: Migration across the Appalachians (1780s–1790s) → evidence and effect
    back: |
      Settlers poured into Kentucky (a state in 1792), Tennessee (1796) and the Ohio country. Westerners wanted access to the Mississippi, protection from Native resistance and cheap land, and they pressured the national government on all three.
    topic_code: "3.12"
  - front: Eli Whitney's cotton gin (1793) → effect on slavery
    back: |
      The gin separated seeds from short-staple cotton quickly, making upland cotton profitable across the South. Cotton production soared and slavery, which some had expected to fade, expanded westward instead.
    topic_code: "3.12"
  - front: Free Black communities in the early republic → example
    back: |
      Gradual emancipation and manumission produced growing free Black communities in cities such as Philadelphia, where Richard Allen and Absalom Jones founded independent churches in the 1790s (Allen's Bethel church became the core of the African Methodist Episcopal Church). They built schools and mutual-aid societies despite discrimination.
    topic_code: "3.12"
  - front: Benjamin Banneker's letter to Jefferson (1791) → argument
    back: |
      Banneker, a free Black mathematician and almanac-maker from Maryland, sent Jefferson his almanac and challenged him to reconcile the Declaration's principles with slavery and with doubts about African Americans' abilities. Evidence of Black Americans using revolutionary ideals.
    topic_code: "3.11"
  - front: Republican Motherhood → definition and effect
    back: |
      The idea that women served the republic by raising sons to be virtuous citizens and by sustaining civic virtue at home. It kept women out of formal politics but justified better education for girls and gave women's domestic role public significance.
    topic_code: "3.11"
  - front: Crèvecoeur's 'What is an American?' (1782) → claim
    back: |
      In Letters from an American Farmer, J. Hector St. John de Crèvecoeur described the American as a 'new man', a mixture of European peoples melted into a new race with new opportunities. His vision of identity left out enslaved Africans and American Indians.
    topic_code: "3.11"
  - front: Noah Webster → contribution to American identity
    back: |
      His spelling book (1783) and later dictionary (1828) promoted distinct American spellings (color, center) and a common national language, part of an effort to build a culture independent of Britain.
    topic_code: "3.11"
  - front: Regional identities in the 1790s → examples
    back: |
      New England's commercial, Federalist and Congregationalist culture; the South's plantation and slaveholding society; the West's frontier farmers who wanted the Mississippi open and Native nations removed. National identity coexisted with strong regional loyalties.
    topic_code: "3.11"
  - front: Washington's Farewell Address (1796) → two main warnings
    back: |
      Avoid permanent alliances with foreign nations (keep commercial ties but 'as little political connection as possible') and beware the spirit of party and sectional division. It guided American foreign policy for generations.
    topic_code: "3.10"
  - front: Election of 1796 → outcome and quirk
    back: |
      Federalist John Adams won the presidency and his opponent, Republican Thomas Jefferson, became vice president, because electors cast two undifferentiated votes. The Twelfth Amendment (1804) later fixed the system.
    topic_code: "3.10"
  - front: XYZ Affair (1797–1798) → what happened
    back: |
      French agents (labelled X, Y and Z in published dispatches) demanded a bribe before American diplomats could meet the French foreign minister. Public outrage led to an undeclared naval war with France, the Quasi-War (1798–1800).
    topic_code: "3.10"
  - front: Alien and Sedition Acts (1798) → provisions and purpose
    back: |
      Lengthened the residency requirement for citizenship to 14 years, let the president deport aliens deemed dangerous, and made it a crime to publish 'false, scandalous and malicious' writing against the government. Federalists used the Sedition Act to prosecute Republican editors.
    topic_code: "3.10"
  - front: Kentucky and Virginia Resolutions (1798) → authors and argument
    back: |
      Secretly written by Jefferson (Kentucky) and Madison (Virginia), they argued that the Constitution was a compact among the states, which could judge when the federal government exceeded its powers, and declared the Alien and Sedition Acts unconstitutional. Later cited by nullifiers and secessionists.
    topic_code: "3.10"
  - front: Election of 1800 → why called a 'revolution'
    back: |
      Jefferson defeated Adams, and power passed peacefully from one party to its rival for the first time. The House broke a tie between Jefferson and his running mate Aaron Burr. Jefferson later called it a revolution in principles.
    topic_code: "3.13"
  - front: Period 3 continuity → American Indian land
    back: |
      From the Proclamation of 1763 through the Treaty of Greenville (1795), settler demand for Native land and Native resistance drove conflict. What changed was the power claiming sovereignty: the crown, which sometimes restrained settlers, was replaced by a republic built on western expansion.
    topic_code: "3.13"
  - front: Period 3 change → from subjects to citizens
    back: |
      In 1754 colonists were loyal subjects of a king; by 1800 they were citizens of a republic with a written constitution, a bill of rights and peaceful transfers of power between parties. Slavery, coverture and Native dispossession were among the continuities.
    topic_code: "3.13"
  - front: Shays' Rebellion vs Whiskey Rebellion → comparison
    back: |
      Both were rural protests against taxes by indebted farmers. Shays' (1786–1787) exposed the Confederation's weakness and had to be put down by a privately funded state militia; the Whiskey Rebellion (1794) was crushed by federal militia led by the president, demonstrating the new government's strength.
    topic_code: "3.13"

quiz:
  description: |
    25 questions · about 35 minutes · about 68% this week (the first federal government, parties, diplomacy, the West
    and American identity) and 32% review of weeks 6–8 and Period 2 (the imperial crisis, the Revolution, the Articles
    and the Constitution). Multiple choice, select-all and true/false items are graded at once; fill-in-the-blank items
    are matched automatically; the short answers and the long essay are graded by your teacher against the scoring
    notes.
  questions:
    # ---- Stimulus set A: Washington's Farewell Address (3.10, review 3.5)
    - slug: apush-u03-w09-q01
      type: multiple_choice
      topic_code: "3.10"
      source: "Primary source: George Washington, Farewell Address (1796), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "Let me now take a more comprehensive view, and warn you in the most solemn manner against the baneful effects of the spirit of party generally. . . .

        The great rule of conduct for us in regard to foreign nations is in extending our commercial relations, to have with them as little political connection as possible. . . . It is our true policy to steer clear of permanent alliances with any portion of the foreign world . . ."

        — George Washington, Farewell Address, published September 1796
      prompt: |
        Washington's warning against 'the spirit of party' was most directly a response to
      options:
        - "disputes among Loyalists over whether to leave the United States"
        - "the conflict between large and small states at the Constitutional Convention"
        - "the division of Congress into Whigs and Democrats"
        - "the rivalry between Federalists and Democratic-Republicans over Hamilton's program and relations with Britain and France"
      option_explanations:
        - |
          Loyalist emigration was a matter of the 1780s and did not create political parties in the 1790s.
        - |
          The large-small state conflict was settled by the Great Compromise in 1787 and did not produce parties.
        - |
          Whigs and Democrats were the parties of the 1830s–1850s (Period 4 and 5), an anachronism here.
        - |
          Correct. By 1796 the two parties had their own newspapers and candidates and bitterly divided over the bank, the French Revolution and Jay's Treaty; Washington himself had been attacked in the Republican press.
      answer: 3
      explanation: |
        Contextualization: the Address responds to the conflicts of Washington's second term. Name the parties and the issues.

    - slug: apush-u03-w09-q02
      type: multiple_choice
      topic_code: "3.10"
      source: "Primary source: George Washington, Farewell Address (1796), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "Let me now take a more comprehensive view, and warn you in the most solemn manner against the baneful effects of the spirit of party generally. . . .

        The great rule of conduct for us in regard to foreign nations is in extending our commercial relations, to have with them as little political connection as possible. . . . It is our true policy to steer clear of permanent alliances with any portion of the foreign world . . ."

        — George Washington, Farewell Address, published September 1796
      prompt: |
        Which action of Washington's presidency was most consistent with the foreign-policy advice in the excerpt?
      options:
        - "Issuing the Neutrality Proclamation of 1793 rather than joining France in its war with Britain"
        - "Signing a new military alliance with Spain to drive Britain from Canada"
        - "Sending troops to support the French Revolution"
        - "Declaring war on Britain over the impressment of sailors"
      option_explanations:
        - |
          Correct. Despite the 1778 alliance, Washington kept the United States out of the war between France and Britain, protecting trade while avoiding political entanglement.
        - |
          No such alliance was made; Pinckney's Treaty (1795) with Spain settled navigation and borders and was not a military alliance.
        - |
          Washington refused to involve the United States militarily in France's wars, to the anger of many Republicans.
        - |
          The United States declared war on Britain in 1812, under Madison, long after Washington's presidency.
      answer: 0
      explanation: |
        Making connections: the Farewell Address explained and justified policies Washington had already pursued.

    - slug: apush-u03-w09-q03
      type: multiple_choice
      topic_code: "3.5"
      source: "Primary source: George Washington, Farewell Address (1796), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        "Let me now take a more comprehensive view, and warn you in the most solemn manner against the baneful effects of the spirit of party generally. . . .

        The great rule of conduct for us in regard to foreign nations is in extending our commercial relations, to have with them as little political connection as possible. . . . It is our true policy to steer clear of permanent alliances with any portion of the foreign world . . ."

        — George Washington, Farewell Address, published September 1796
      prompt: |
        Review. Washington's advice to avoid 'permanent alliances' is notable because the United States had earlier depended on which alliance to win its independence?
      options:
        - "An alliance with the Netherlands that brought Dutch troops to Yorktown"
        - "An alliance with Britain against Spain"
        - "The alliance with France, signed in 1778 after Saratoga"
        - "An alliance with the Iroquois Confederacy, signed at Albany in 1754"
      option_explanations:
        - |
          The Dutch lent money and were at war with Britain, but sent no troops to Yorktown; the troops there were American and French.
        - |
          The United States fought Britain for independence; it made no alliance with Britain against Spain.
        - |
          Correct. French money, troops and naval power were decisive at Yorktown. By the 1790s the treaty of 1778 threatened to pull the United States into France's wars, which shaped Washington's advice.
        - |
          The Albany Congress failed to secure a firm Iroquois alliance, and that was a British colonial matter in any case.
      answer: 2
      explanation: |
        Review of 3.5 (continuity and change in foreign policy): the alliance that won independence became a burden a decade later.

    - slug: apush-u03-w09-q04
      type: multiple_choice
      topic_code: "3.10"
      source: "general knowledge"
      points: 1
      prompt: |
        Alexander Hamilton's proposal that the federal government assume the states' Revolutionary War debts was intended mainly to
      options:
        - "give wealthy creditors a stake in the success of the national government and establish its credit"
        - "transfer the costs of the war to Britain under the Treaty of Paris"
        - "reduce the national debt by refusing to pay speculators"
        - "punish states that had supported the Anti-Federalists"
      option_explanations:
        - |
          Correct. If creditors held federal rather than state bonds, they would want the national government to succeed. Paying debts in full also built the credit the government would need to borrow in future.
        - |
          The treaty imposed no such obligation on Britain; the war debts were American.
        - |
          Hamilton insisted on paying the debt at full value even to speculators who had bought it cheaply, which angered critics like Madison.
        - |
          Assumption benefited heavily indebted states such as Massachusetts, which had Federalist majorities; it was not designed as punishment.
      answer: 0
      explanation: |
        Causation and purpose: Hamilton's plan was political as well as financial, tying the interests of the wealthy to the federal government.

    - slug: apush-u03-w09-q05
      type: multiple_choice
      topic_code: "3.10"
      source: "general knowledge"
      points: 1
      prompt: |
        The Alien and Sedition Acts of 1798 were passed in the context of
      options:
        - "the Louisiana Purchase"
        - "the War of 1812 against Britain"
        - "Shays' Rebellion in Massachusetts"
        - "the Quasi-War with France and Federalist fears of Republican opposition and immigrant radicals"
      option_explanations:
        - |
          The Louisiana Purchase came in 1803, under Jefferson.
        - |
          The War of 1812 began fourteen years later.
        - |
          Shays' Rebellion (1786–1787) predated the Constitution and these acts by a decade.
        - |
          Correct. After the XYZ Affair, the undeclared naval war with France let Federalists portray Republican critics and recent (often Irish and French) immigrants, who tended to vote Republican, as dangers to national security.
      answer: 3
      explanation: |
        Contextualization: national-security fears in wartime have repeatedly been used to restrict dissent; this is the first example under the Constitution.

    - slug: apush-u03-w09-q06
      type: multiple_choice
      topic_code: "3.7"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. Pinckney's Treaty (1795), which secured free navigation of the Mississippi and the right of deposit at New Orleans, resolved a problem that had exposed the weakness of the Confederation government when
      options:
        - "France bought Louisiana from Spain in 1783"
        - "Britain blockaded New Orleans during the Revolutionary War"
        - "Spain closed the lower Mississippi to American trade in 1784 and Congress could neither force nor negotiate its reopening"
        - "the Northwest Ordinance banned river trade north of the Ohio"
      option_explanations:
        - |
          Spain held Louisiana until 1800, when it secretly returned it to France; nothing of the kind happened in 1783.
        - |
          New Orleans was Spanish during the Revolution, and Spain was at war with Britain from 1779; there was no British blockade of the city.
        - |
          Correct. Western farmers depended on the river to ship crops; the Jay–Gardoqui talks of 1785–1786, which would have given up navigation rights for commercial gains, angered westerners and southerners and failed. Under the Constitution, Pinckney won the river.
        - |
          The Northwest Ordinance regulated territorial government and banned slavery, not river trade; it declared the waters leading to the Mississippi free highways.
      answer: 2
      explanation: |
        Review of 3.7 (causation and comparison): a western grievance under the Articles was settled by diplomacy under the Constitution.

    - slug: apush-u03-w09-q07
      type: multiple_choice
      topic_code: "3.6"
      source: "general knowledge"
      points: 1
      prompt: |
        Review. The spread of slavery across the southern interior after the invention of the cotton gin (1793) contrasted most sharply with which development of the 1780s?
      options:
        - "The Stamp Act Congress's protest against taxation"
        - "The passage of gradual emancipation laws and court rulings that began ending slavery in the northern states"
        - "The Proclamation of 1763's restriction on western settlement"
        - "The adoption of the Albany Plan of Union"
      option_explanations:
        - |
          The Stamp Act Congress met in 1765 and dealt with taxation and representation.
        - |
          Correct. Pennsylvania (1780), Massachusetts (court rulings, 1781–1783), Connecticut and Rhode Island (1784) moved against slavery on revolutionary principles, while cotton made slavery more profitable and expansive in the South, deepening a regional divide.
        - |
          The Proclamation of 1763 is from the 1760s and concerned settlement and Native lands, not slavery.
        - |
          The Albany Plan (1754) was never adopted and concerned colonial defence.
      answer: 1
      explanation: |
        Review of 3.6 (comparison): revolutionary ideals and economic change pulled North and South in opposite directions on slavery.

    # ---- Stimulus set B: the bank opinions (3.10, review 3.9)
    - slug: apush-u03-w09-q08
      type: multiple_choice
      topic_code: "3.10"
      source: "Primary sources: Jefferson's and Hamilton's opinions on the constitutionality of a national bank (1791), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        Source 1: "I consider the foundation of the Constitution as laid on this ground: That \"all powers not delegated to the United States, by the Constitution, nor prohibited by it to the States, are reserved to the States or to the people.\" To take a single step beyond the boundaries thus specially drawn around the powers of Congress, is to take possession of a boundless field of power, no longer susceptible of any definition."

        — Thomas Jefferson, Secretary of State, opinion for President Washington, February 1791

        Source 2: ". . . every power vested in a government is in its nature sovereign, and includes, by force of the term, a right to employ all the means requisite and fairly applicable to the attainment of the ends of such power . . ."

        — Alexander Hamilton, Secretary of the Treasury, opinion for President Washington, February 1791
      prompt: |
        The two opinions disagree most directly about
      options:
        - "whether the United States should remain neutral in the war between Britain and France"
        - "whether the Constitution allows Congress to exercise powers not specifically listed in it"
        - "whether the states should ratify the Bill of Rights"
        - "whether the national government should pay the Revolutionary War debt"
      option_explanations:
        - |
          Neutrality was a later dispute (1793) and is not addressed in these 1791 opinions.
        - |
          Correct. Jefferson argues for strict construction: stepping beyond enumerated powers opens a 'boundless field of power'. Hamilton argues for implied powers: a government may use any fairly applicable means to achieve its listed ends.
        - |
          The Bill of Rights was being ratified in 1791, but Jefferson cites the Tenth Amendment as settled principle; neither excerpt debates ratification.
        - |
          Both men agreed the debt should be paid in some form; these excerpts concern constitutional power, specifically the bank.
      answer: 1
      explanation: |
        Comparison and argumentation: identify the precise point of disagreement between two sources. Strict vs loose construction.

    - slug: apush-u03-w09-q09
      type: multiple_choice
      topic_code: "3.9"
      source: "Primary sources: Jefferson's and Hamilton's opinions on the constitutionality of a national bank (1791), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        Source 1: "I consider the foundation of the Constitution as laid on this ground: That \"all powers not delegated to the United States, by the Constitution, nor prohibited by it to the States, are reserved to the States or to the people.\" To take a single step beyond the boundaries thus specially drawn around the powers of Congress, is to take possession of a boundless field of power, no longer susceptible of any definition."

        — Thomas Jefferson, Secretary of State, opinion for President Washington, February 1791

        Source 2: ". . . every power vested in a government is in its nature sovereign, and includes, by force of the term, a right to employ all the means requisite and fairly applicable to the attainment of the ends of such power . . ."

        — Alexander Hamilton, Secretary of the Treasury, opinion for President Washington, February 1791
      prompt: |
        Review. Hamilton's argument in Source 2 relied most heavily on which part of the Constitution?
      options:
        - "The First Amendment"
        - "The three-fifths clause"
        - "The clause giving Congress power to make all laws 'necessary and proper' for carrying out its enumerated powers"
        - "The clause forbidding states to coin money"
      option_explanations:
        - |
          The First Amendment protects speech, religion, press and assembly; it is not relevant to the power to charter a bank.
        - |
          The three-fifths clause concerns apportionment of representation and has nothing to do with the bank.
        - |
          Correct. Hamilton argued that a bank was a reasonable means of carrying out Congress's powers to tax, borrow and regulate commerce, and so was authorised by the necessary and proper (elastic) clause.
        - |
          The ban on state coinage limits the states; Hamilton's case rested on an affirmative grant of power to Congress.
      answer: 2
      explanation: |
        Review of 3.9: the elastic clause written in 1787 became the first great constitutional battleground in 1791.

    - slug: apush-u03-w09-q10
      type: multiple_choice
      topic_code: "3.10"
      source: "Primary sources: Jefferson's and Hamilton's opinions on the constitutionality of a national bank (1791), Avalon Project, Yale Law School"
      points: 1
      stimulus: |
        Source 1: "I consider the foundation of the Constitution as laid on this ground: That \"all powers not delegated to the United States, by the Constitution, nor prohibited by it to the States, are reserved to the States or to the people.\" To take a single step beyond the boundaries thus specially drawn around the powers of Congress, is to take possession of a boundless field of power, no longer susceptible of any definition."

        — Thomas Jefferson, Secretary of State, opinion for President Washington, February 1791

        Source 2: ". . . every power vested in a government is in its nature sovereign, and includes, by force of the term, a right to employ all the means requisite and fairly applicable to the attainment of the ends of such power . . ."

        — Alexander Hamilton, Secretary of the Treasury, opinion for President Washington, February 1791
      prompt: |
        The disagreement shown in the two sources contributed most directly to
      options:
        - "the formation of the first political parties"
        - "the decision to locate the capital in Philadelphia permanently"
        - "the outbreak of Shays' Rebellion"
        - "the calling of the Constitutional Convention"
      option_explanations:
        - |
          Correct. Disputes over Hamilton's program, including the bank, divided Hamilton's supporters (Federalists) from those of Jefferson and Madison (Democratic-Republicans), joined soon after by disagreements over the French Revolution.
        - |
          The Compromise of 1790 placed the permanent capital on the Potomac, not in Philadelphia, which was only a temporary seat.
        - |
          Shays' Rebellion occurred in 1786–1787, before the Constitution and these opinions.
        - |
          The Constitutional Convention met in 1787; these opinions were written under the Constitution, in 1791.
      answer: 0
      explanation: |
        Causation: the bank fight turned a cabinet disagreement into a partisan divide.

    - slug: apush-u03-w09-q11
      type: multiple_choice
      topic_code: "3.12"
      source: "general knowledge"
      points: 1
      prompt: |
        Which of the following best explains why the Western Confederacy of Native nations was defeated in the mid-1790s after its victories of 1790 and 1791?
      options:
        - "Anthony Wayne's better-trained army won at Fallen Timbers, and Britain declined to support its Native allies as it moved toward Jay's Treaty."
        - "France sent an army to help the United States in the Ohio country."
        - "Spain transferred the Ohio country to the United States in Pinckney's Treaty."
        - "The confederacy voluntarily sold its land in order to move west of the Mississippi."
      option_explanations:
        - |
          Correct. After St. Clair's disaster, Congress funded a professional 'Legion'; Wayne won at Fallen Timbers in 1794, British soldiers at Fort Miami shut their gates to retreating warriors, and Jay's Treaty soon removed British posts. The Treaty of Greenville followed in 1795.
        - |
          France sent no army to the Ohio country; relations with France were deteriorating by the mid-1790s.
        - |
          Spain never held the Ohio country; Pinckney's Treaty dealt with the Mississippi and Florida's border.
        - |
          The Treaty of Greenville followed military defeat; it was not a voluntary migration.
      answer: 0
      explanation: |
        Causation and the role of diplomacy (3.12): Native resistance was weakened when the British withdrew support.

    - slug: apush-u03-w09-q12
